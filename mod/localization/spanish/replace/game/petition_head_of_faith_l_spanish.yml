 petition_head_of_faith.5000.t:0 "A Confissão"
 petition_head_of_faith.5020.a:0 "Graças sejam dadas a [recipient.GetFaith.HighGodName]."
 petition_head_of_faith.5020.desc:0 "O(a) [recipient.GetFaith.ReligiousHeadName] se levanta para administrar a misericórdia do Senhor:\n\n\"Levante-se, meu filho. Você foi restaurado(a) à comunhão dos fiéis. A maldição sobre sua alma foi suspensa.\""
 petition_head_of_faith.5020.t:0 "Absolvição Concedida"
 petition_head_of_faith.5030.a:0 "Imagino que [recipient.GetFaith.HighGodName] tenha falado por meio de Seu servo."
 petition_head_of_faith.5030.desc.canon_law:0 "\"Sua erudição deficiente é um reflexo de sua alma."
 petition_head_of_faith.5030.desc.conclusion:0 " A censura permanece.\""
 petition_head_of_faith.5030.desc.confess:0 "\"Sua confissão soa vazia."
 petition_head_of_faith.5030.desc.fallback:0 "\"Você presume demais."
