l_spanish:
 NOT_petition_head_of_faith_decision_cost_major_piety:0 "$petition_head_of_faith_decision_cost_major_piety$"
 NOT_petition_head_of_faith_decision_cost_massive_piety:0 "$petition_head_of_faith_decision_cost_massive_piety$"
 NOT_petition_head_of_faith_decision_head_of_faith_exists:0 "Sua [faith|E] não tem um [head_of_faith|E] atual"
 OIKOUMENE_GLOSS:0 "Termo grego para \"o mundo habitado\". Na fala romano-oriental, a #bold oikoumene#! nomeava o mundo civilizado: o império e a ordem cristã mais ampla supervisionada por sua igreja."
 petition_antipope_decision:0 "Peticionar ao $anti_religious_head_name$"
 petition_antipope_decision_confirm:0 "Preparar a petição"
 petition_antipope_decision_desc:0 "Viaje para a corte do meu $anti_religious_head_name$ e apresente uma petição formal. O [ROOT.Char.GetFaith.ReligiousHeadTitleName] em [ROOT.Char.GetFaith.GetReligiousHead.GetCapitalLocation.GetName] não é mais meu para peticionar."
 petition_antipope_decision_tooltip:0 "Viaje para o seu [challenger_hof|E] e peça um favor"
 petition_head_of_faith.0601.a:0 "Que assim seja."
 petition_head_of_faith.0601.desc.at_war:0 "Não posso fazer uma petição formal enquanto estiver em guerra com [recipient.GetTitledFirstName]."
 petition_head_of_faith.0601.desc.fallback:0 "Minha petição não pode mais ser poursuída, e a jornada dá em nada."
 petition_head_of_faith.0601.desc.head_changed:0 "O líder da minha fé mudou, e minha petição não pode mais ser apresentada a [recipient.GetTitledFirstName]."
 petition_head_of_faith.0601.desc.head_dead:0 "[recipient.GetTitledFirstName] morreu antes que minha petição pudesse ser ouvida."
 petition_head_of_faith.0601.desc.head_imprisoned:0 "[recipient.GetTitledFirstName] está aprisionado e não pode receber petições formais."
 petition_head_of_faith.0601.desc.no_head:0 "Quando estou pronto para apresentar meu caso, já não há um pastor espiritual adequado para receber minha petição."
 petition_head_of_faith.0601.desc.refund.none:0 "Pelo menos nada havia mudado de mãos ainda."
 petition_head_of_faith.0601.desc.refund.piety:0 "A oferta piedosa que eu havia comprometido para esta petição foi devolvida."
 petition_head_of_faith.0601.desc.repentance_resolved:0 "Já não há qualquer excomunhão para ser levantada de mim."
 petition_head_of_faith.0601.desc.repentance_too_soon:0 "Meu arrependimento não seria ouvido tão cedo após a minha última censura."
 petition_head_of_faith.0601.desc.target_already_excommunicated:0 "[petition_target.GetTitledFirstName] já está excomungado."
 petition_head_of_faith.0601.desc.target_dead:0 "[petition_target.GetTitledFirstName] faleceu antes que a petição pudesse ser ouvida."
 petition_head_of_faith.0601.desc.target_too_low:0 "[petition_target.GetTitledFirstName] já não é um rei ou governante superior, e portanto está fora do escopo desta petição formal."
 petition_head_of_faith.0601.desc.target_wrong_faith:0 "[petition_target.GetTitledFirstName] não pertence mais à minha fé, portanto nenhuma excomunhão formal pode ser solicitada."
 petition_head_of_faith.0601.t:0 "Petição Abandonada"
 petition_head_of_faith.1000.a.argue:0 "Apresentarei o meu caso."
 petition_head_of_faith.1000.a.argue_tt:0 "Tentar persuadir [recipient.GetShortUINameNoTooltip] durante a audiência"
 petition_head_of_faith.1000.desc.address:0 "\n\nApresento meu pedido a [recipient.GetHerHim]: \"Santo [recipient.GetMotherFather|U], "
 petition_head_of_faith.1000.desc.conclusion:0 "[recipient.GetSheHe] diz, aguardando com expectativa."
 petition_head_of_faith.1000.desc.court_high_grandeur:0 "O palácio, famoso por seus grandes salões, é verdadeiramente humilhante de se adentrar. Rezo para que seu dourado celestial seja um reflexo da justiça e da riqueza espiritual em seu interior.\n\n"
 petition_head_of_faith.1000.desc.court_low_grandeur:0 "O outrora grandioso palácio jaz em ruínas ao meu redor. Rezo para que isso não seja um reflexo da pobreza espiritual do [recipient.GetFaith.ReligiousHeadName].\n\n"
 petition_head_of_faith.1000.desc.disposition_favorable:0 "\n\n\"Ouvemos-te, meu filho. Fala os pormenores do teu pedido e recebê-lo-emos com favor.\""
 petition_head_of_faith.1000.desc.disposition_hostile:0 "\n\n\"Presumes muito ao vir aqui. Pesa bem as tuas próximas palavras.\""
 petition_head_of_faith.1000.desc.disposition_neutral:0 "\n\n\"A tua petição está perante nós. Julgaremos conforme o cânone e a Santa Igreja exigem.\""
 petition_head_of_faith.1000.desc.disposition_skeptical:0 "\n\n\"Belas palavras são facilmente ditas. Recebemos a tua petição com o ceticismo que o Senhor exige,\""
 petition_head_of_faith.1000.desc.excommunication:0 "[petition_target.GetTitledFirstName] cometeu crimes contra Deus. Venho como um humilde mensageiro; é, naturalmente, de vossa alçada proferir julgamento sobre [petition_target.GetHerHis] alma imortal.\""
 petition_head_of_faith.1000.desc.health_excess:0 "\n\n[recipient.GetHerHis|U] saúde debilitada é claramente o fruto de uma vida de excessos ruinosos."
 petition_head_of_faith.1000.desc.health_noble:0 "\n\n[recipient.GetHerHis|U] saúde debilitada é claramente o fruto de uma vida de nobre labor."
 petition_head_of_faith.1000.desc.intro:0 "Ali se senta o vigário de Deus na Terra. "
 petition_head_of_faith.1000.desc.recipient_sinful:0 "Apesar de ser bem sabido que [recipient.GetSheHe] é [petition_hof_gravest_sin.GetName(recipient)], por algum artifício diabólico [recipient.GetSheHe] encontrou [recipient.GetHerHis] caminho até o trono de São Pedro."
 petition_head_of_faith.1000.desc.recipient_virtuous:0 "Certamente o julgamento de [recipient.GetHerHis] será guiado por [recipient.GetHerHis] natureza [petition_hof_gravest_virtue.GetName(recipient)]."
 petition_head_of_faith.1000.desc.repentance:0 "Venho em humildade, suplicando a libertação da censura lançada sobre minha alma e rezando para ser restaurado à comunhão dos fiéis.\""
 petition_head_of_faith.1000.t.excommunication:0 "Petição: Excomunhão"
 petition_head_of_faith.1000.t.repentance:0 "Petição: Arrependimento"
 petition_head_of_faith.1310.a:0 "\"Levanta-te, meu filho. Estás restaurado à comunhão dos fiéis.\""
 petition_head_of_faith.1310.b:0 "\"A censura permanece. Retorna quando o teu arrependimento for manifesto.\""
 petition_head_of_faith.1310.desc.disposition_favorable:0 "\n\n\"Sempre me demonstraste caridade, Santo [ROOT.Char.GetMotherFather|U]. Não peço favor terreno, apenas que Deus e a Santa Igreja vejam a verdade da minha contrição.\""
 petition_head_of_faith.1310.desc.disposition_hostile:0 "\n\n\"Fomos inimigos no mundo. Não vos peço que faleis bem de mim em assuntos terrenos, mas reconhecei a minha penança e não ponhais em risco a minha alma.\""
 petition_head_of_faith.1310.desc.disposition_neutral:0 "\n\n\"Diante de Deus apresento-me como qualquer penitente, e peço apenas justiça sob o cânone.\""
 petition_head_of_faith.1310.desc.disposition_skeptical:0 "\n\n\"Não me tomeis por [SelectLocalization( ROOT.Char.GetFaith.HasDoctrineByKey( 'special_doctrine_ecumenical_christian' ), 'petition_head_of_faith.1310.serpent.christian', 'petition_head_of_faith.1310.serpent.generic' )], usando de belas palavras para vos desviar. Juro por [ROOT.Char.GetFaith.HighGodName] e pelo vigário de Deus na Terra que estou arrependido.\""
 petition_head_of_faith.1310.desc.intro:0 "\"Santo [ROOT.Char.GetMotherFather|U], estou excomungado, banido dos sacramentos e separado dos fiéis. Suplico-vos, tirai esta censura da minha alma e restituí-me à comunhão\", diz o [actor.GetTitledFirstName] ajoelhado.\n\n\"Mostra [ROOT.Char.GetFaith.HighGodName] a tua contrição primeiro\", respondo."
 petition_head_of_faith.1310.desc.penitent_clean:0 "\n\n\"Pouco veneno se apega ao teu nome. Talvez a interdição tenha cumprido seu trabalho curativo. Veremos se a tua alma corresponde ao teu porte.\""
 petition_head_of_faith.1310.desc.penitent_sinful:0 "\n\n\"Sois conhecido por nós como [petition_gravest_sin.GetName(actor)]. Belas palavras não podem limpar uma alma manchada. Como fareis reparação?\""
 petition_head_of_faith.1310.serpent.christian:0 "a serpente no jardim"
 petition_head_of_faith.1310.serpent.generic:0 "uma serpente"
 petition_head_of_faith.1310.t:0 "Petição: Arrependimento de [actor.GetTitledFirstNamePossessiveNoTooltip]"
 petition_head_of_faith.1320.a:0 "\"Excomungo [petition_target.GetHerHim] da comunhão dos fiéis.\""
 petition_head_of_faith.1320.b:0 "\"O teu caso não é convincente; nenhuma censura recairá sobre [petition_target.GetHerHim].\""
 petition_head_of_faith.1320.desc.disposition_favorable:0 "\n\n\"Sempre me demonstraste justiça, Santo [ROOT.Char.GetMotherFather|U]. Não peço favor terreno, apenas que Deus e a Santa Igreja vejam a verdade das transgressões de [petition_target.GetTitledFirstNamePossessiveNoTooltip]."
 petition_head_of_faith.1320.desc.disposition_hostile:0 "\n\n\"Fomos inimigos no mundo, mas por favor avaliai a alma de [petition_target.GetTitledFirstNamePossessiveNoTooltip] como o cânone exige."
 petition_head_of_faith.1320.desc.disposition_neutral:0 "\n\n\"Diante de Deus apresento esta acusação como simples súdito do Senhor Jesus Cristo, e peço apenas o que a justiça da Santa Igreja exige."
 petition_head_of_faith.1320.desc.disposition_skeptical:0 "\n\n\"Não penseis em mim como a serpente no jardim que usa belas palavras para resolver uma contenda privada. Juro perante [ROOT.Char.GetFaith.HighGodName] e o seu vigário na Terra que esta acusação é justa."
 petition_head_of_faith.1320.desc.finish:0 "conclui [actor.GetTitledFirstName]."
 petition_head_of_faith.1320.desc.intro:0 "\"Santo [ROOT.Char.GetMotherFather|U], [petition_target.GetTitledFirstName] cometeu crimes contra Deus. Se esta podridão não for extirpada, todas as nossas almas estarão comprometidas\", diz [actor.GetTitledFirstName]\n\n\"Não exercemos a excomunhão como arma privada de um príncipe. Tornai clara a vossa acusação perante Deus\", respondo."
 petition_head_of_faith.1320.desc.target_clean:0 "[petition_target.GetTitledFirstNamePossessiveNoTooltip] esconde bem a maldade de [petition_target.GetHerHis], mas tenho fé de que, se buscar orientação do Senhor, o pecado de [petition_target.GetHerHis] será revelado.\""
 petition_head_of_faith.1320.desc.target_sinful:0 "A podridão do pecado de [petition_target.GetTitledFirstNamePossessiveNoTooltip] brota da natureza [petition_target.GetHerHis] de [petition_gravest_sin.GetName(petition_target)].\""
 petition_head_of_faith.1320.t:0 "Petição: Excomunhão de [petition_target.GetTitledFirstNamePossessiveNoTooltip]"
 petition_head_of_faith.2000.a.cite_sins:0 "Proclamar [petition_target.GetTitledFirstNameNoTooltip] [petition_gravest_sin.GetName(petition_target)] perante Deus."
 petition_head_of_faith.2000.a.cite_sins_fallback:0 "Nomear os pecados de [petition_target.GetTitledFirstNamePossessiveNoTooltip] perante Deus."
 petition_head_of_faith.2000.b.finesse:0 "\"A Igreja tem muitas necessidades. Permiti-me cuidar de algumas.\""
 petition_head_of_faith.2000.c.learning_duel:0 "Citarei Escrituras obscuras para enredar o ímpio [petition_target.GetTitleAsNameNoTooltip]."
 petition_head_of_faith.2000.d.hook:0 "Lembrar ao [recipient.GetFaith.ReligiousHeadName] de certos... assuntos particulares."
 petition_head_of_faith.2000.desc.atmosphere_aniconism:0 "\"Provarias os crimes de [petition_target.GetTitledFirstNamePossessiveNoTooltip] pelas Escrituras e pelos cânones da Igreja? Ajoelhou-se [petition_target.GetSheHe] perante imagens esculpidas? \""
 petition_head_of_faith.2000.desc.atmosphere_apostolic_succession:0 "\"Apelarias à autoridade dos Apóstolos para nos fazerdex condenar [petition_target.GetTitledFirstNameNoTooltip] na terra e no céu?\""
 petition_head_of_faith.2000.desc.atmosphere_armed_pilgrimages:0 "\"É aqui que a vossa queixa contra [petition_target.GetTitledFirstNameNoTooltip] deve ser julgada? Não seria melhor para ambos tomardes a Cruz e fazerdes guerra contra os inimigos de Cristo?\""
 petition_head_of_faith.2000.desc.atmosphere_communion:0 "\"Considerais adequado expulsar [petition_target.GetTitledFirstNameNoTooltip] da comunhão dos fiéis?\""
 petition_head_of_faith.2000.desc.atmosphere_confession:0 "\"Quereis que ajamos contra [petition_target.GetTitledFirstNameNoTooltip] com base no que foi dito sob o segredo de confissão?\""
 petition_head_of_faith.2000.desc.atmosphere_divine_liturgy:0 "\"Faria com que expulsássemos [petition_target.GetTitledFirstNameNoTooltip] da sagrada liturgia no calor de uma inimizade pessoal, e não por provas de um pecado grave?\""
 petition_head_of_faith.2000.desc.atmosphere_dulia:0 "\"Será que [petition_target.GetTitledFirstNameNoTooltip] ultrajou a veneração aos mártires com aberto desdém?\""
 petition_head_of_faith.2000.desc.atmosphere_fallback:0 "\"Como gostaria que a Santa Igreja resolvesse a sua contenda com [petition_target.GetTitledFirstNameNoTooltip]?\""
 petition_head_of_faith.2000.desc.atmosphere_hyperdulia:0 "\"Acaso [petition_target.GetTitledFirstNameNoTooltip] não merece a misericórdia da Mãe de Deus? Pode alguém, mesmo você, afirmar estar livre do pecado do homem?\""
 petition_head_of_faith.2000.desc.atmosphere_khachkar:0 "\"E assim você acusaria [petition_target.GetTitledFirstNameNoTooltip] sob a cruz de pedra que o povo local reverencia?\""
 petition_head_of_faith.2000.desc.atmosphere_mendicant_preachers:0 "\"Você vem clamar por justiça contra [petition_target.GetTitledFirstNameNoTooltip] em todas as suas vestes finas, enquanto nossos frades vagam entre os pobres com nada além das roupas do corpo. Um mendicante não aconselharia antes a paciência, ou será o pecado assim tão grande?\""
 petition_head_of_faith.2000.desc.atmosphere_miles_christi:0 "\"Você nos pediria para expulsar um soldado de Cristo com base no testemunho do inimigo de [petition_target.GetHerHis]?\""
 petition_head_of_faith.2000.desc.atmosphere_ora_et_labora:0 "\"Você nos pediria para expulsar [petition_target.GetTitledFirstNameNoTooltip]. Dê-nos algum indício de que [petition_target.GetSheHe] tem vivido em desobediência e indolência, pois é a ociosidade a inimiga da alma.\""
 petition_head_of_faith.2000.desc.atmosphere_original_sin:0 "\"Deseja que condenemos [petition_target.GetTitledFirstNameNoTooltip] como se apenas [petition_target.GetSheHe] tivesse herdado a culpa de Adão? Cada alma entra no mundo ferida pela Queda, e a Igreja expulsa apenas aqueles que se regozijam em sua inclinação pecaminosa.\""
 petition_head_of_faith.2000.desc.atmosphere_peace_of_god:0 "\"Incitaria-nos contra [petition_target.GetTitledFirstNameNoTooltip] por sangue derramado em tempo sagrado ou violência em terras da Igreja? Acaso [petition_target.GetSheHe] violou a Paz e Trégua de Deus?\""
 petition_head_of_faith.2000.desc.atmosphere_pentarchy:0 "\"Vem até nós para fazer com que [petition_target.GetTitledFirstNameNoTooltip] seja banido enquanto nós, cinco tronos patriarcais, tentamos manter unida uma Cristandade fragmentada? Acredita que toda a [Glossary( 'oikoumene', 'OIKOUMENE_GLOSS' )] apoiaria a sua acusação?\""
 petition_head_of_faith.2000.desc.atmosphere_purgatory:0 "\"Deseja que expulsemos [petition_target.GetTitledFirstNameNoTooltip] enquanto remédios mais brandos ainda possam resgatar [petition_target.GetHerHim] do pecado?\""
 petition_head_of_faith.2000.desc.atmosphere_scholasticism:0 "\"Você nos perturba em nosso estudo dos cânones para condenar [petition_target.GetTitledFirstNameNoTooltip]. Acaso sua retórica está fundamentada nos escritos dos Padres da Igreja e nas Escrituras?\""
 petition_head_of_faith.2000.desc.atmosphere_transubstantiation:0 "\"Baniu [petition_target.GetTitledFirstNameNoTooltip] do altar de Cristo? Negar a [petition_target.GetHerHim] o sustento da carne de Nosso Senhor? Acaso [petition_target.GetSheHe] não mais deve beber do Seu sangue?\""
 petition_head_of_faith.2000.desc.atmosphere_vows_of_poverty:0 "\"Você negaria a [petition_target.GetTitledFirstNameNoTooltip] os sacramentos. Colocaria em risco a participação de [petition_target.GetHerHis] nas riquezas da vida eterna com Cristo no Céu? É na terra que buscamos os votos de pobreza.\""
 petition_head_of_faith.2000.desc.judgment_seat:0 "\n\n\"Deve saber que não manejamos a excomunhão como arma particular de um príncipe. Nós julgaremos que justiça deve ser feita. Apresente sua causa perante Deus!\" Exige [recipient.GetMotherFather|U]."
 petition_head_of_faith.2000.desc.target_clean:0 "\n\nParece que [recipient.GetTitledFirstName] sabe que [petition_target.GetTitledFirstNameNoTooltip] não está revestido de pecado. Sem evidências de maldade para apresentar ao tribunal, devo encontrar outro caminho para a justiça que busco."
 petition_head_of_faith.2000.desc.target_sinful:0 "\n\nEmbora as palavras [recipient.GetFaith.GetReligiousHeadTitle.GetNamePossessive] devam parecer imparciais, é evidente que a notícia da natureza pecaminosa de [petition_target.GetTitledFirstNamePossessiveNoTooltip] já chegou a estes sagrados salões. Resta-me apenas confirmar as transgressões de [petition_target.GetHerHis]."
 petition_head_of_faith.2000.e.withdraw:0 "...talvez isto seja entre [petition_target.GetFaith.HighGodName] e [petition_target.GetTitledFirstNameNoTooltip]."
 petition_head_of_faith.2000.t:0 "A Arguição"
 petition_head_of_faith.2020.a:0 "[recipient.GetFaith.HighGodName] falou através de Seu servo."
 petition_head_of_faith.2020.desc:0 "O(a) [recipient.GetFaith.ReligiousHeadName] se levanta para administrar a justiça do Senhor:\n\n\"[petition_target.GetTitledFirstName] está excomungado(a), cortado(a) do corpo dos fiéis, com [petition_target.GetHerHis] alma entregue ao perigo até que haja verdadeiro arrependimento.\""
 petition_head_of_faith.2020.t:0 "Excomunhão Prounciada"
 petition_head_of_faith.2030.a:0 "Creio que [recipient.GetFaith.HighGodName] falou através de Seu servo."
 petition_head_of_faith.2030.desc.cite_sins:0 "\"Os pecados que nomeia não são graves o bastante para merecer tão terrível sentença. [petition_target.GetTitledFirstName] não será excomungado.\""
 petition_head_of_faith.2030.desc.fallback:0 "\"Você presume demais! Não vejo razão para que [petition_target.GetTitledFirstName] seja excomungado.\""
 petition_head_of_faith.2030.desc.finesse:0 "\"Não expulsamos os fiéis simplesmente porque uma taxa principesca nos é paga. Aquilo que é de César não pode comprar os julgamentos de [recipient.GetFaith.HighGodName].\""
 petition_head_of_faith.2030.desc.intro:0 "O [recipient.GetFaith.ReligiousHeadName] ergue-se para dispensar a justiça do Senhor:\n\n"
 petition_head_of_faith.2030.desc.learning_duel:0 "\"Pretendes enredar um [petition_target.GetTitleAsNameNoTooltip] em distorções deliberadas do direito canônico? [petition_target.GetTitledFirstName] não será excomungado com base na... força de sua erudição.\""
 petition_head_of_faith.2030.t:0 "A Petição Recusada"
 petition_head_of_faith.5000.a.confess:0 "Confessar meus pecados, sem ocultar nada."
 petition_head_of_faith.5000.b.canon_law:0 "Argumentar que a lei da Igreja exige minha reconciliação."
 petition_head_of_faith.5000.c.weep:0 "Entregar-me à misericórdia do tribunal."
 petition_head_of_faith.5000.desc.atmosphere_aniconism:0 "\"Vens em busca de absolvição. Acaso curvaste-te a imagens de escultura sabendo que apenas as Escrituras e a penitência te purificarão?\""
 petition_head_of_faith.5000.desc.atmosphere_apostolic_succession:0 "\"Possuímos as chaves de Pedro. Esta autoridade pode absolver-te se fores deveras penitente.\""
 petition_head_of_faith.5000.desc.atmosphere_armed_pilgrimages:0 "\"Se vestiste a cruz apenas de nome e ainda assim feriste a Cristandade, sabes que quebraste a lei.\""
 petition_head_of_faith.5000.desc.atmosphere_communion:0 "\"Estás separado da comunhão dos fiéis.\""
 petition_head_of_faith.5000.desc.atmosphere_confession:0 "\"O sacramento da confissão exige um relato completo e verdadeiro.\""
 petition_head_of_faith.5000.desc.atmosphere_divine_liturgy:0 "\"Buscas novamente a Divina Liturgia. Pensa no que te afastou do altar e dos fiéis.\""
 petition_head_of_faith.5000.desc.atmosphere_dulia:0 "\"Os mártires conquistaram seu lugar no céu com o próprio sangue.\""
 petition_head_of_faith.5000.desc.atmosphere_fallback:0 "\"A absolvição não é conquistada apenas por tua longa peregrinação.\""
 petition_head_of_faith.5000.desc.atmosphere_hyperdulia:0 "\"A Mãe de Deus transborda misericórdia, mas não podemos levantar tua censura apenas por Ela.\""
 petition_head_of_faith.5000.desc.atmosphere_khachkar:0 "\"Espero que venhas suplicar por absolvição ao pé da cruz de pedra esculpida.\""
 petition_head_of_faith.5000.desc.atmosphere_mendicant_preachers:0 "\"Nossos frades vagam entre os pobres com nada além de hábitos esfarrapados.\""
 petition_head_of_faith.5000.desc.atmosphere_miles_christi:0 "\"Vestiste a cruz sobre o peito e ainda assim ofendeste a Cristandade.\""
 petition_head_of_faith.5000.desc.atmosphere_ora_et_labora:0 "\"A ociosidade é a inimiga da alma. Ajoelha-te não apenas em contrrição, mas com prontidão para a penitência, a oração e o trabalho.\""
 petition_head_of_faith.5000.desc.atmosphere_original_sin:0 "\"Nasceste em pecado, assim como todos nós. Por que adicionar nova maldade a essa herança?\""
 petition_head_of_faith.5000.desc.atmosphere_peace_of_god:0 "\"Foi o teu pecado a quebra da Paz e Trégua de Deus? Derramaste sangue no tempo sagrado?\""
 petition_head_of_faith.5000.desc.atmosphere_pentarchy:0 "\"Os cinco tronos patriarcais observam. Não baratearemos a absolvição enquanto toda a [Glossary( 'oikoumene', 'OIKOUMENE_GLOSS' )] assiste.\""
 petition_head_of_faith.5000.desc.atmosphere_purgatory:0 "\"A excomunhão é o remédio da Igreja. Uma dádiva concedida para que possas emendar tua vida e abreviar tua purgação.\""
 petition_head_of_faith.5000.desc.atmosphere_scholasticism:0 "\"Buscas a reconciliação. Satisfaz a lei por capítulo e distinção do Decretum.\""
 petition_head_of_faith.5000.desc.atmosphere_transubstantiation:0 "\"Estás banido do altar de Cristo e do sustento de Sua carne e sangue.\""
 petition_head_of_faith.5000.desc.atmosphere_vows_of_poverty:0 "\"Apreciamos os votos de pobreza: os luxos da posição social não te farão recuperar os sacramentos.\""
 petition_head_of_faith.5000.desc.judgment_seat:0 "\n\n\"Deve saber que não suspendemos uma censura por aparências ou adulação. Torna clara a tua contrrição perante Deus!\" Exige [recipient.GetMotherFather|U]."
 petition_head_of_faith.5000.desc.penitent_clean:0 "\n\nCom pouca maldade para expor, o tribunal deve ser capaz de ver que a interdição cumpriu sua obra curativa."
 petition_head_of_faith.5000.desc.penitent_sinful:0 "\n\nA notícia da minha natureza [petition_gravest_sin.GetName(actor)] certamente já chegou a estes sagrados salões."
