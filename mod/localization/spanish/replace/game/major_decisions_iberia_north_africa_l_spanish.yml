l_spanish:
 decision_unite_africa_confirm:0 "Unifique a África"
 form_the_kingdom_of_aragon_decision.tt.x_random_counties_in_d_aragon:0 "3 [counties|E] aleatórios em $d_aragon$:"
 iberia_north_africa.0001.a:0 "Agora nossa hora chegou!"
 iberia_north_africa.0001.christian.desc:0 "Nosso povo sofreu sob o governo Mulçumano por séculos, mas não mais. Finalmente, através da conquista gloriosa em nome de [ROOT.Char.GetFaith.WarGodName], somos uma livre nação [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]!\n\n"
 iberia_north_africa.0001.end.desc:0 "Através dos milênios, muitas civilizações governaram estas terras. Eles todos contribuíram para a complexa rede que é nossa herança cultural. Hoje temos nossa identidade única, e enquanto eu formo este novo reino, nós podemos orgulhosamente nos chamar de Portugueses!"
 iberia_north_africa.0001.muslim.desc:0 "Através do poder de [ROOT.Char.GetFaith.WarGodName], nós conquistamos estas terras e podemos agora orgulhosamente chamar a costa ocidental da Península Ibérica de nosso lar. Que [ROOT.Char.GetFaith.GetAdjective] prospere aqui nos anos que virão!\n\n"
 iberia_north_africa.0001.start.desc:0 "Este dia será para sempre lembrado como o amanhecer do grande Império de Portugal."
 iberia_north_africa.0001.t:0 "O Reino de Portugal"
 iberia_north_africa.0002.a1:0 "Glória para [ROOT.Char.GetFaith.WarGodName]!"
 iberia_north_africa.0002.b:0 "[ROOT.Char.GetFaith.WarGodName] abençõe Portugal!"
 iberia_north_africa.0002.c:0 "Eu ainda sou [ROOT.Char.GetCulture.GetNameNoTooltip], não importa o que eles pensam."
 iberia_north_africa.0002.end.desc:0 "formou o Império de Portugal em sua costa ocidental. Depois de séculos de migração e guerra, o orgulhoso povo Português emergiu, com [portugal_former.GetTitledFirstNameNoTooltip] como líder.\n\nIrá esta jovem nação ascender à glória ou será consumida em mais uma conquista? Apenas o tempo irá dizer."
 iberia_north_africa.0002.former.desc:0 "[portugal_former.GetTitledFirstName]"
 iberia_north_africa.0002.relation_former.desc:0 "Meu [ROOT.Char.Custom2('RelationToMe', portugal_former)] [portugal_former.GetTitledFirstName]"
 iberia_north_africa.0002.start.desc:0 "Uma nova era chegou à Península Ibérica!"
 iberia_north_africa.0005.a:0 "Esta é a aurora de uma nova era."
 iberia_north_africa.0005.desc:0 "Mais uma vez, os tronos da Espanha foram unidos em um [ROOT.Char.GetTitleAsNameNoTooltip]. Os falsos monarcas foram destronados, enquanto orgulhosos [ROOT.Char.GetPrimaryTitle.GetNameNoTier] permanecem mais fortes que nunca.\n\nUm dia eu deverei partir deste mundo e ir para [ROOT.Char.GetFaith.DivineRealm], porém meu legado irá permanecer na Terra para sempre. Eles irão me chamar '[ROOT.Char.GetTitledFirstNameNoTooltip] — [ROOT.Char.GetMotherFather|U] da Espanha.'"
 iberia_north_africa.0005.t:0 "Uma Espanha Unida"
 iberia_north_africa.0006.end.desc:0 "declarou [spain_uniter.GetHerselfHimself] '[spain_uniter.GetMotherFather|U] da Espanha.'\n\nO nome [spain_uniter.GetHerHim|U] irá certamente viver por séculos, mas [spain_uniter.GetSheHe] será lembrado como um herói ou tirano? Somente [ROOT.Char.GetFaith.FateGodName] sabe."
 iberia_north_africa.0006.former.desc:0 "[spain_uniter.GetTitledFirstName]"
 iberia_north_africa.0006.relation_former.desc:0 "Meu [ROOT.Char.Custom2('RelationToMe', spain_uniter)] [spain_uniter.GetTitledFirstName]"
 iberia_north_africa.0006.start.desc:0 "Um depois do outro, os Reinos da Espanha caíram sobre as leis de [spain_uniter.GetPrimaryTitle.GetNameNoTier]."
 iberia_north_africa.0010.a:0 "Glória à África!"
 iberia_north_africa.0010.ancestors.desc:0 "\n\nOs [africa_uniter.Custom('DefaultPriestTitlePlural')] me contaram que os Ancestrais estão satisfeitos. Finalmente, nossas terras estão liberadas! Ainda resta trabalho a fazer, mas hoje, nós celebraremos!"
 iberia_north_africa.0010.generic.desc:0 "\n\nEles vêm de todas as esferas da vida, mas eu irei nos reunir e forjar um novo caminho. A partir deste dia, somos um só povo sob [ROOT.Char.GetFaith.HighGodName]."
 iberia_north_africa.0010.spirits.desc:0 "\n\nOs [africa_uniter.Custom('DefaultPriestTitlePlural')] me contaram que os espíritos estão satisfeitos. Finalmente, nossas terras estão liberadas! Ainda resta trabalho a fazer, mas hoje, nós celebraremos!"
 iberia_north_africa.0010.start.desc:0 "Ninguém pensou que poderia ser feito, porém aqui estou, [ROOT.Char.GetTitleAsNameNoTooltip] de toda África."
 iberia_north_africa.0010.t:0 "Uma África"
 iberia_north_africa.0010.vassals.desc:0 "Da costa do Atlântico para o Oceano Oriental, toda tribo, [vassal_1.GetTitleAsNameNoTooltip], e [vassal_2.GetTitleAsNameNoTooltip] agora se curvam a mim."
 iberia_north_africa.0011.end.desc:0 "unificou todos sob a bandeira [africa_uniter.GetFaith.GetAdjective].\n\nPode uma tão vasta [africa_uniter.GetPrimaryTitle.GetTierAsNameNoTooltip] resistir ao teste do tempo, ou esta união irá se despedaçar? Somente [ROOT.Char.GetFaith.FateGodName] sabe."
 iberia_north_africa.0011.former.desc:0 "[africa_uniter.GetTitledFirstName]"
 iberia_north_africa.0011.relation_former.desc:0 "Meu [ROOT.Char.Custom2('RelationToMe', africa_uniter)] [africa_uniter.GetTitledFirstName]"
 iberia_north_africa.0011.start.desc:0 "Todo o povo da África, da menor tribo para o maior monarca, estão agora sob o governo de [africa_uniter.GetPrimaryTitle.GetNameNoTier]."
 iberia_north_africa.0015.a:0 "Allahu akbar."
 iberia_north_africa.0015.islam.desc:0 "levou tropas [avenger.GetHerHim] para o coração do antigo Reino Franco e esmagou toda oposição. Com a firme base [avenger.GetHerHim] na Europa, o futuro do Islã parece mais claro que nunca."
 iberia_north_africa.0015.part1.desc:0 "Milhares e milhares de bravos Mulçumanos morreram na estrada para Tours, no Caminho dos Martírs. Eles estavam lutando por um futuro melhor, uma nova era de ouro para os verdadeiros crentes. Hoje, este futuro está finalmente aqui."
 iberia_north_africa.0015.part2.desc:0 "\n\nCom uma firme base na Europa, minha conquista gloriosa apenas começou..."
 iberia_north_africa.0015.t:0 "Vingando os Martírs"
 iberia_north_africa.0016.christianity.a:0 "Que o Senhor tenha misericórdia de nossas almas."
 iberia_north_africa.0016.former.desc:0 "\n\n[avenger.GetTitledFirstName]"
 iberia_north_africa.0016.generic.desc:0 "Muitos anos atrás, na estrada para Tours, as forças Franco-Cristão puseram um fim a invasão Umayyad na Europa. Charles Martel e seus homens alteraram o curso da história.\n\nMas nada dura para sempre. [avenger.GetName] marchou com suas tropas para dentro do antigo Império Franco e [avenger.GetSheHe] o clamou como seu. Com esta base firme na Europa, somente [ROOT.Char.GetFaith.FateGodName] sabe o que [avenger.GetTitledFirstNameNoTooltip] irá fazer em seguida..."
 iberia_north_africa.0016.relation_former.desc:0 "\n\nMeu [ROOT.Char.Custom2('RelationToMe', avenger)] [avenger.GetTitledFirstName]"
 iberia_north_africa.0016.t:0 "Ecos do Passado"
 iberia_north_africa.0101.a.tt:0 "Você defende um caminho mais $doctrine_pluralism_righteous_name$"
 iberia_north_africa.0101.a:0 "Um povo, uma fé!"
 iberia_north_africa.0101.b.tt:0 "Você defende um caminho mais $doctrine_pluralism_fundamentalist_name$"
 iberia_north_africa.0101.b:0 "Não podemos ter medo de assumir o poder para defender o nosso próprio povo."
 iberia_north_africa.0101.c.tt:0 "Você defende um caminho ainda mais $doctrine_pluralism_pluralistic_name$"
 iberia_north_africa.0101.c:0 "O [religious_leader.GetFaith.ReligiousText] ainda precisará de interpretação..."
 iberia_north_africa.0101.desc:0 "Não foi tarefa fácil, mas minha família conseguiu reunir terras e autoridade espiritual suficientes na fé [religious_leader.GetFaith.GetAdjective] para convocar um conclave dos nossos mais altos clérigos. Finalmente, nosso sangue, suor e esforço foram recompensados.\n\nOs [religious_leader.GetFaith.PriestNeuterPlural] reunidos em [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier] discutem acaloradamente sobre políticas, enchendo os corredores do meu castelo com dezenas de propostas e, ocasionalmente, brigando por questões teológicas. Sabemos que desejamos seguir Roma e [pope.GetTitledFirstName], mas concordamos em pouco mais do que isso.\n\nDepois de semanas de impasse, cabe a mim, como anfitrião e [religious_leader.GetTitleAsNameNoTooltip], arbitrar."
 iberia_north_africa.0101.t:0 "Lealdade ao Trono de São Pedro"
 iberia_north_africa.0102.a.misc:0 "Que fanáticos preocupantes!"
 iberia_north_africa.0102.a.same_faith:0 "Devemos nos defender!"
 iberia_north_africa.0102.a.same_religion:0 "Eles nos definem #EMP como ameaça#!?"
 iberia_north_africa.0102.b.misc:0 "Desde que eles fiquem na deles."
 iberia_north_africa.0102.b.same_faith:0 "Uma fé para nós mesmos!"
 iberia_north_africa.0102.b.same_religion:0 "Que egoísmo..."
 iberia_north_africa.0102.c.misc:0 "A solução deles para a deriva doutrinária é criticar minuciosamente a doutrina?"
 iberia_north_africa.0102.c.same_faith:0 "O estudo rigoroso do [religious_leader.GetFaith.ReligiousText] beneficia a todos."
 iberia_north_africa.0102.c.same_religion:0 "Que inútil; estudar tanto quando já estão tão errados..."
 iberia_north_africa.0102.desc.fundamentalist:0 "percebidos abusos cometidos contra os fiéis, e como isso só pode ser evitado estabelecendo poder temporal por todos os meios disponíveis."
 iberia_north_africa.0102.desc.intro:0 "Após uma vida acumulando autoridade religiosa e política, [religious_leader.GetTitledFirstName] conseguiu reunir um grande conclave de ministros [religious_leader.GetFaith.GetAdjective] em sua capital, [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier], para discutir o futuro da fé.\n\nApós semanas de debate acirrado, o clero reunido decidiu reafirmar sua lealdade a [pope.GetTitledFirstName], embora com algumas... #EMP ajustes#! na política eclesiástica.\n\nEssas melhorias se concentram principalmente em"
 iberia_north_africa.0102.desc.pluralist:0 "estabelecendo costumes e práticas rigorosos para o estudo do [religious_leader.GetFaith.ReligiousText] e métodos formais para questionar a compreensão do mesmo."
 iberia_north_africa.0102.desc.righteous:0 "olhando para dentro, garantindo a homogeneidade religiosa entre as principais culturas que seguem a Igreja."
 iberia_north_africa.0102.t:0 "Lealdade ao Trono [religious_leader.GetFaith.GetAdjectiveNoTooltip] de São Pedro"
 iberia_north_africa.0111.a.tt:0 "$iberia_north_africa.0101.a.tt$"
 iberia_north_africa.0111.a:0 "O Filho de Deus ensinou a paz, e nós seguiremos."
 iberia_north_africa.0111.b.tt:0 "$iberia_north_africa.0101.b.tt$"
 iberia_north_africa.0111.b:0 "Mesmo sem Roma, sabemos o valor de defender o nosso!"
 iberia_north_africa.0111.c.tt:0 "$iberia_north_africa.0101.c.tt$"
 iberia_north_africa.0111.c:0 "O Islamismo não é uma religião do Livro também?"
 iberia_north_africa.0111.desc:0 "Levou anos para construir a unidade política e espiritual para reunir este conclave, mas finalmente trouxe o suficiente tanto do povo quanto do clero para minhas bandeiras para repudiar significativamente o falso-[pope.GetTitledFirstName].\n\nMesmo agora, os corredores e quartos de hóspedes de [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier] estão lotados de clérigos argumentativos e bispos apaixonados; cada frade magoado e [religious_leader.GetFaith.PriestNeuter] menor que Roma já desprezou obstruindo meus corredores.\n\nTodo esse debate é crucial para legitimidade, mas, em última análise, como o preeminente governante [religious_leader.GetFaith.GetAdjective], #EMP my#! palavra será o voto decisivo final."
 iberia_north_africa.0111.t:0 "Liberdade das Correntes de Roma"
 iberia_north_africa.0112.a.misc:0 "Parece que eles estão dividindo cabelo..."
 iberia_north_africa.0112.a.same_faith:0 "Pelo [religious_leader.GetFaith.HighGodName] e nosso direito!"
 iberia_north_africa.0112.a.same_religion:0 "É melhor não trancarem nossos santuários sagrados."
 iberia_north_africa.0112.b.misc:0 "Pergunto-me como isso vai funcionar para eles..."
 iberia_north_africa.0112.b.same_faith:0 "Poder através da paz!"
 iberia_north_africa.0112.b.same_religion:0 "Eu espero que eles pensem que são melhores do que nós ..."
 iberia_north_africa.0112.c.islam:0 "Esperançosamente, este é o primeiro passo em direção à verdadeira conversão..."
 iberia_north_africa.0112.c.misc:0 "Eles são uma fé híbrida, então?"
 iberia_north_africa.0112.c.same_faith:0 "Nós compartilhamos muito mais do que não compartilhamos."
 iberia_north_africa.0112.c.same_religion:0 "Preocupante..."
 iberia_north_africa.0112.desc.fundamentalist:0 "assumir a responsabilidade de proteger as peregrinações aos locais sagrados da [religious_leader.GetFaith.GetAdjectiveNoTooltip] com força armada."
 iberia_north_africa.0112.desc.intro:0 "Com grande esforço, [religious_leader.GetTitledFirstName] finalmente alcançou a obra de sua vida de acumular autoridade política e espiritual suficiente para unir a Igreja [religious_leader.GetFaith.GetAdjective] em busca de um objetivo: romper com os ditames de [pope.GetTitledFirstName].\n\nO conselho eclesiástico acompanhante foi explosivo em suas discussões sobre como preencher o vazio deixado pelo domínio de Roma, com alguns clérigos relatando brigas abertas nos corredores de [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier].\n\nA intercessão de [religious_leader.GetTitledFirstNamePossessiveNoTooltip] é a única coisa que quebrou o impasse, optando por se concentrar em"
 iberia_north_africa.0112.desc.pluralist:0 "flexibilizando as restrições e proibições que impedem uma acomodação mais fácil com seus vizinhos muçulmanos, defendendo uma abordagem ecumênica nas relações inter-religiosas."
 iberia_north_africa.0112.desc.righteous:0 "revertendo o que [religious_leader.GetSheHe] vê como a violência pecaminosa que infectou grande parte de [religious_leader.GetFaith.GetReligion.GetName].\n\nSegundo [religious_leader.GetSheHe], [religious_leader.GetFaith.GetAdherentNamePluralNoTooltip] deveriam focar na piedade de viver simplesmente uma boa vida em vez de tentar pavimentar o caminho para a [religious_leader.GetFaith.PositiveAfterLife] com o sangue dos infiéis."
 iberia_north_africa.0112.t:0 "Igreja [religious_leader.GetFaith.GetAdjectiveNoTooltip] se divide do [pope.GetFaith.GetNameNoTooltip]"
 iberia_north_africa.0121.a.tt:0 "Você defende um caminho mais $doctrine_pluralism_fundamentalist_name$"
 iberia_north_africa.0121.a:0 "[basque_faith.GetNameNoTooltip] será novamente a fé de um guerreiro!"
 iberia_north_africa.0121.b.tt:0 "Você defende um caminho mais $doctrine_pluralism_righteous_name$"
 iberia_north_africa.0121.b:0 "A harmonia com a natureza é melhor do que a harmonia com os vizinhos."
 iberia_north_africa.0121.c.tt:0 "Você defende um caminho mais $doctrine_pluralism_pluralistic_name$"
 iberia_north_africa.0121.c:0 "Há religiões mais dignas de compartilhar tradições."
 iberia_north_africa.0121.d.tt:0 "Você deixa a fé como a encontra."
 iberia_north_africa.0121.d:0 "Se eu tentar forçar mudanças, serei menos corrupto do que [old_faith.GetNameNoTooltip]?"
 iberia_north_africa.0121.desc.excommunicated:0 "A excomunhão tem sido difícil para mim, sobrecarregando minha alma injustamente e causando muita turbulência com os outros [old_faith.GetAdherentNamePluralNoTooltip] em minha vida."
 iberia_north_africa.0121.desc.intro:0 "Não é segredo que eu tenho tido... problemas com minha fé [old_faith.GetAdjective]."
 iberia_north_africa.0121.desc.lorgar:0 "Apesar do fogo da minha crença queimar tão brilhantemente quanto o Sol, não consigo sacudir a sensação de que deve haver algo #EMP mais#! no universo do que apenas [old_faith.HighGodName]. Alguma verdade mais primordial."
 iberia_north_africa.0121.desc.naked_cynicism:0 "Acho desinteressante, e pior, totalmente fascinado por poderes que tenho pouco ou nenhum controle."
 iberia_north_africa.0121.desc.negative_piety_level:0 "Minhas ações me marcaram como pecador, alguém cuja fé parece contente em deixar cair pelo caminho espiritual, e não há como negar o quão isolado tenho sido."
 iberia_north_africa.0121.desc.outro:0 "\n\nFinalmente, porém, acho que encontrei consolo em [basque_faith.GetName]. Os sincréticos rurais deste pequeno seita não têm julgamento sobre mim, apenas entusiasmo alegre com a perspectiva de se tornar algo mais do que simples guardiões locais das tradições.\n\nUm entusiasmo que talvez os deixe abertos a... sugestões."
 iberia_north_africa.0121.desc.rivalry_with_hof:0 "Discussões constantes com [old_faith.GetReligiousHead.GetTitledFirstName], uma disputa temporal mesquinha que [old_faith.GetReligiousHead.GetSheHe] #EMP deveria#! estar acima, me deixaram desiludido."
 iberia_north_africa.0121.desc.sinful_traits:0 "Sinto que cada ação minha, cada pensamento, a própria maneira como vivo minha vida é marcada como inerentemente pecaminosa."
 iberia_north_africa.0121.desc.virtuous_basque_pagan_traits:0 "Às vezes questiono como pude amá-la, quando minha personalidade inteira parece #EMP construída#! para algo diferente."
 iberia_north_africa.0121.t:0 "Um Retorno ao Campo"
 iberia_north_africa.0122.a:0 "Sabe, eu acho que [religious_leader.GetSheHe] tem um ponto de vista..."
 iberia_north_africa.0122.b.misc:0 "Desde que lutem longe daqui."
 iberia_north_africa.0122.b.respects_fellow_warmongers:0 "Pelo menos eles não têm medo de uma boa luta."
 iberia_north_africa.0122.b.same_faith:0 "Isso é uma heresia sangrenta!"
 iberia_north_africa.0122.b.same_religion:0 "Isso só pode acabar com a aniquilação deles"
 iberia_north_africa.0122.c.believes_in_harmony_with_nature:0 "Pelo menos eles entendem a maravilha da natureza."
 iberia_north_africa.0122.c.misc:0 "Então eles falam pelas árvores?"
 iberia_north_africa.0122.c.same_faith:0 "[religious_leader.GetFirstNameNoTooltip] abandonou [old_faith.HighGodName] por algumas florestas envelhecidas?!"
 iberia_north_africa.0122.c.same_religion:0 "Será que [religious_leader.GetFirstNameNoTooltip] acha que [religious_leader.GetSheHe] é #EMP melhor#! do que nós?"
 iberia_north_africa.0122.d.misc:0 "Ah, não é minha festa, nem meus ursos dançantes."
 iberia_north_africa.0122.d.muslim:0 "Pelo menos os [basque_faith.GetAdherentNamePluralNoTooltip] estão se aproximando mais do [islam_religion.GetNameNoTooltip]."
 iberia_north_africa.0122.d.same_faith:0 "Eles nos abandonaram duas vezes!"
 iberia_north_africa.0122.d.same_religion:0 "Uma afronta!"
 iberia_north_africa.0122.d.syncretised_with_islam:0 "Pelo menos eles não perderam completamente o juízo."
 iberia_north_africa.0122.desc.excommunicated:0 "a excomunhão de [old_faith.GetName] finalmente se tornou demasiado cansativa para [religious_leader.GetSheHe]."
 iberia_north_africa.0122.desc.fundamentalist:0 "Embora originalmente pacífico, [religious_leader.GetTitledFirstNameNoTooltip] incitou o jovem movimento a uma fúria ardente, prometendo-lhes uma recompensa de guerreiro em saque e pilhagem se eles apoiassem a campanha fundamentalista [religious_leader.GetHerHim]."
 iberia_north_africa.0122.desc.intro:0 "Parece que o [religious_leader.GetTitledFirstNamePossessive]..."
 iberia_north_africa.0122.desc.lorgar:0 "a luxúria por algo mais... #EMP primordial#! em que acreditar se tornou forte demais, levando [religious_leader.GetSheHe] ao caminho da heresia."
 iberia_north_africa.0122.desc.midtro:0 "\n\nNum acesso de loucura, o [religious_leader.GetTitleAsNameNoTooltip|U] elevou uma fé popular sincretista obscura dos Pirenéus, [basque_faith.GetName], como a nova religião principal do [religious_leader.GetPrimaryTitle.GetNameNoTier].\n\n"
 iberia_north_africa.0122.desc.naked_cynicism:0 "o desejo descarado de maior controle sobre a vida espiritual de seu reino está completamente fora de controle."
 iberia_north_africa.0122.desc.negative_piety_level:0 "as transgressões anteriores contra [old_faith.GetName] estão prestes a ser ofuscadas pelas suas próximas."
 iberia_north_africa.0122.desc.pluralist:0 "Embora a seita tenha passado séculos absorvendo elementos do Cristianismo, [religious_leader.GetTitledFirstNameNoTooltip] está usando sua considerável influência para introduzir elementos competitivos do Islamismo, apagando, substituindo e atualizando os rituais Nazarenos onde [religious_leader.GetSheHe] pode."
 iberia_north_africa.0122.desc.righteous:0 "Buscando distanciar a pequena seita de sua relação próxima com o Cristianismo, [religious_leader.GetTitledFirstNameNoTooltip] está promovendo um retorno ao que [religious_leader.GetSheHe] vê como as partes mais verificavelmente pagãs de seus mitos."
 iberia_north_africa.0122.desc.rivalry_with_hof:0 "a rivalidade com [old_faith.GetReligiousHead.GetTitledFirstName] finalmente atingiu um ponto de ebulição inevitável."
 iberia_north_africa.0122.desc.sinful_traits:0 "maneiras pecaminosas finalmente venceram completamente a fé [old_faith.GetAdjective] [religious_leader.GetHerHim]."
 iberia_north_africa.0122.desc.unchanged:0 "Essencialmente inalterada desde a obscuridade, apesar do aumento da atenção teológica, a seita professa uma combinação de dogmas cristãos adotados e mitologia tradicional Vasconiana."
 iberia_north_africa.0122.desc.virtuous_basque_pagan_traits:0 "a sedução lenta pelas virtudes da vida rural está finalmente completa."
 iberia_north_africa.0122.e.misc:0 "Parece uma mudança bastante comum, honestamente."
 iberia_north_africa.0122.e.same_faith:0 "Então #EMP esse#! é o padrão de tolerância."
 iberia_north_africa.0122.e.same_religion:0 "Preocupante..."
 iberia_north_africa.0122.e.syncretised_with_christianity:0 "$iberia_north_africa.0122.d.syncretised_with_islam$"
 iberia_north_africa.0122.t:0 "$iberia_north_africa.0121.t$"
 iberia_north_africa.0131.a:0 "Essas pessoas são minhas pessoas e são suficientes."
 iberia_north_africa.0131.b:0 "Nem todas as características da cultura [founder_culture.GetNameNoTooltip] são tão ruins..."
 iberia_north_africa.0131.c:0 "O que é verdadeiramente importante para nós não mudou."
 iberia_north_africa.0131.d:0 "Não importa como o mundo gire, não podemos esquecer nossas raízes!"
 iberia_north_africa.0131.desc.duchy.one:0 "[duchy_a.GetBaseNameNoTier]"
 iberia_north_africa.0131.desc.duchy.three:0 "[duchy_a.GetBaseNameNoTier], [duchy_b.GetBaseNameNoTier] e [duchy_c.GetBaseNameNoTier]"
 iberia_north_africa.0131.desc.duchy.two:0 "[duchy_a.GetBaseNameNoTier] e [duchy_b.GetBaseNameNoTier]"
 iberia_north_africa.0131.desc.intro:0 "Com a criação de [k_aragon.GetDefinitiveName], desencadeei uma próspera expansão da cultura [aragonese_culture.GetName] nas cidades e vilas do meu reino. Não apenas em nossas terras de $d_aragon$, mas"
 iberia_north_africa.0131.desc.outro:0 "também, espalhando a influência do meu povo recém-encontrado por toda parte.\n\nE, no entanto... não consigo deixar de sentir falta de algumas das formas da [founder_culture.GetName]. Seu tempo no centro da minha vida pode ter acabado, mas com minha influência e posição, não precisa partir completamente."
 iberia_north_africa.0131.t:0 "Filhos do Ebro"
 iberia_north_africa.2001.a.a:0 "Você pede um livro para ajudar a melhorar sua habilidade mais baixa."
 iberia_north_africa.2001.a.diplointrigue:0 "retórica"
 iberia_north_africa.2001.a.end:0 "publicações."
 iberia_north_africa.2001.a.learning:0 "filosóficos"
 iberia_north_africa.2001.a.martial:0 "militares"
 iberia_north_africa.2001.a.stewardship:0 "econômicos"
 iberia_north_africa.2001.a:0 "Não pouparei despesas em"
 iberia_north_africa.2001.b.a:0 "[generated_actor.GetFirstNameNoTooltip] lhe dará um livro aleatório que melhora a [skill|E]"
 iberia_north_africa.2001.b:0 "Você tem o meu patrocínio, traga algo útil."
 iberia_north_africa.2001.c:0 "Por que eu iria querer livros antigos? A história não tem lugar na ciência!"
 iberia_north_africa.2001.desc:0 "Um famoso tradutor, [generated_actor.GetFullName], chegou à minha corte após ouvir que eu estava patrocinando as ciências. 'Se é conhecimento que você busca, o melhor pode ser encontrado em livros antigos. Pois embora possa ter sido esquecido, isso não é menos verdadeiro', declara o tradutor. \n\n 'Tenho comigo muitos livros que permanecem não traduzidos. Se você me patrocinar, certamente se beneficiará também!'"
 iberia_north_africa.2001.t:0 "$iberia_north_africa.fp2_golden_age_generic_title_intro$ Conhecimento Perdido"
 iberia_north_africa.2002.a.a:0 "[child_offering.GetFirstName] ajuda na operação"
 iberia_north_africa.2002.a.b:0 "Resultados da Operação de Catarata"
 iberia_north_africa.2002.a.flavor:0 "Você oferece seu filho [child_offering.GetFirstName] como assistente para ajudar na operação de catarata por método de sucção de [patientzero.GetFirstName]."
 iberia_north_africa.2002.a:0 "Esta é uma maravilhosa oportunidade para [child_offering.GetFirstNameNoTooltip] aprender medicina!"
 iberia_north_africa.2002.b.a:0 "Você exige que a operação continue, conhecendo os riscos."
 iberia_north_africa.2002.b:0 "As estrelas não têm influência na sua habilidade, realize a operação!"
 iberia_north_africa.2002.c:0 "De fato, pode ser melhor esperar até que as condições sejam favoráveis."
 iberia_north_africa.2002.d:0 "#italic Bem, na verdade#!, se você olhar #italic dessa#! forma, as estrelas estão perfeitamente alinhadas!"
 iberia_north_africa.2002.desc:0 "'Meu senhor, por favor faça esse tolo ouvir! Esse cirurgião realizou uma operação de catarata em meu olho direito, mas agora se recusa a consertar o esquerdo!' exclama [patientzero.GetTitledFirstName]. 'A operação foi bem-sucedida apenas porque a conjunção dos astros era perfeita. Você #italic deve#! esperar mais doze anos para garantir outra operação bem-sucedida!', responde o médico frustrado, [generated_actor.GetFirstName]. \n\n Como governante, é meu dever resolver essas questões. Devo interferir na astrologia e correr o risco de uma cirurgia fracassada?"
 iberia_north_africa.2002.t:0 "$iberia_north_africa.fp2_golden_age_generic_title_intro$ Cirurgião Visionário"
 iberia_north_africa.2003.a.flavor:0 "Você ofende ambos os estudiosos, concentrando o desprezo deles em você em vez de um ao outro."
 iberia_north_africa.2003.a:0 "Na verdade, isso cai sob a #ber minha#! autoridade. Agora, vá trabalhar."
 iberia_north_africa.2003.b:0 "Filósofos, é claro, homens sábios como Aristutalis deveriam."
 iberia_north_africa.2003.c:0 "Como você pode acreditar em filósofos se não pode confiar em Ezekiel?"
 iberia_north_africa.2003.desc:0 "Muitos estudiosos vieram e foram através de [playerprovince.GetNameNoTooltip] desde que concedi minha proteção, mas dois deles se destacaram para mim. Talvez seja porque ambos são indivíduos de vasta inteligência, talvez seja porque eles #italic não conseguem calar a boca#! e param de discutir sobre diferenças mínimas de crença no meio da minha corte. \"Eu #italic me recuso#! a trabalhar com um tolo como [generated_actor_r.GetFirstName]!\" exclama [generated_actor_k.GetFirstName] antes de [generated_actor_r.GetFirstName] responder \"Tudo bem para mim, eu nunca trabalharia com alguém tão teimoso como #italic você!#!\"\n\n\"[ROOT.Char.GetTitledFirstName], o que você acredita? É papel do filósofo explicar o mundo natural ou isso cabe à autoridade do profeta?"
 iberia_north_africa.2003.t:0 "$iberia_north_africa.fp2_golden_age_generic_title_intro$ Naturezas Conflitantes"
 iberia_north_africa.2011.a:0 "[generated_actor.GetFaith.HighGodName] gostaria que você se juntasse às minhas fileiras, [generated_actor.GetFirstNameNoTooltip]."
 iberia_north_africa.2011.b.flavor:0 "Você encoraja o guerreiro a continuar lutando por [generated_actor.GetFaith.HighGodName], por conta própria, espalhando a palavra de sua boa natureza."
 iberia_north_africa.2011.b:0 "Tenho certeza de que [generated_actor.GetFaith.HighGodName] quer que você continue vagando em busca de inimigos."
 iberia_north_africa.2011.c.flavor:0 "Você permite que o guerreiro continue sua missão a [generated_actor.GetFaith.HighGodName] sem interrupções."
 iberia_north_africa.2011.c:0 "Certamente você encontrará [generated_actor.GetFaith.HighGodName] ao final de sua peregrinação."
 iberia_north_africa.2011.desc:0 "Enquanto eu caminho pelo [chosen_location_for_pilgrim_roads.GetName], encontro uma grande árvore silenciosamente me tentando a descansar abaixo dela. Eu sento sob a sombra fresca ao lado de um [generated_actor.GetWomanMan]. \"Você é um peregrino?\" Eu pergunto."
 iberia_north_africa.2011.desc_captain:0 "$iberia_north_africa.2011.desc_merge_into$ \"Talvez, eu seja. Mas me reconheço como mais uma alma perdida. Meu nome é [generated_actor.GetName], ex-capitão de uma ordem sagrada, agora um vagabundo errante em busca de [generated_actor.GetFaith.HighGodName] e uma causa maior para servir.\""
 iberia_north_africa.2011.desc_merge_into:0 "Para o qual a figura descansando responde,"
 iberia_north_africa.2011.desc_soldier:0 "$iberia_north_africa.2011.desc_merge_into$ \"Mas sou um guerreiro equivocado pelo nome de [generated_actor.GetName]. Vim visitar [chosen_holy_site_for_pilgrim_roads.GetNameNoTier] para descobrir por que [generated_actor.GetFaith.HighGodName] me abandonou e saber para onde devo levar minha lâmina a seguir.\""
 iberia_north_africa.2011.t:0 "$iberia_north_africa.fp2_pilgrim_roads_generic_title_intro$ Guerreiro Errante"
 iberia_north_africa.2012.a:0 "Eu poderia usar o conhecimento. Muito bem, concordo com essa troca."
 iberia_north_africa.2012.b.flavor:0 "Você oferece ao estudante um bom emprego em sua corte, surpreendendo-o."
 iberia_north_africa.2012.b:0 "Talvez você devesse tentar conseguir um emprego."
 iberia_north_africa.2012.c:0 "Sem negociação. Como um [ROOT.Char.GetFaith.GetAdherentNameNoTooltip], é meu dever ajudá-lo."
 iberia_north_africa.2012.desc:0 "Caminhando por minhas novas estradas na [chosen_location_for_pilgrim_roads.GetName], encontro um jovem [generated_actor.GetWomanMan] sentado em uma pedra com uma expressão triste e uma bolsa vazia na mão. O [generated_actor.GetWomanMan] se vira para mim e pergunta: \"[ROOT.Char.Custom2('RelationToMeAddress', generated_actor)], você poderia me dar uma moeda para um estudante em peregrinação?\""
 iberia_north_africa.2012.desc_architect:0 "Estudo arquitetura, tendo vindo de longe para ver e aprender com as obras bem conservadas em [chosen_holy_site_for_pilgrim_roads.GetNameNoTier]. Sou dedicado apenas à minha arte. Se você me desse uma moeda, até lhe daria minhas escrituras sobre arquitetura!\""
 iberia_north_africa.2012.desc_student:0 "Eu sou um estudante de teologia, desejando entender melhor o mundo concedido a nós por [generated_actor.GetFaith.HighGodName]. Eu até estaria disposto a lhe dar minhas anotações de viagem como um sinal de apreciação como um colega [generated_actor.GetFaith.GetAdjective]!\""
 iberia_north_africa.2012.t:0 "$iberia_north_africa.fp2_pilgrim_roads_generic_title_intro$ Estudante empobrecido"
 iberia_north_africa.2013.a:0 "Seu elogio sozinho é suficiente, meu [fp2_iberia_north_africa_2013_head_of_faith.GetFaith.ReligiousHeadName]."
 iberia_north_africa.2013.b:0 "Espalhe a palavra sobre minhas ações em nome de [ROOT.Char.GetFaith.HighGodName]."
 iberia_north_africa.2013.c:0 "Deixe todos os guerreiros saberem da minha dedicação ao [ROOT.Char.GetFaith.GetNameNoTooltip]."
 iberia_north_africa.2013.d.tooltip:0 "[fp2_iberia_north_africa_2013_head_of_faith.GetTitledFirstName] lhe dará um [artifact|E] abençoado"
 iberia_north_africa.2013.d:0 "Dê-me um artefato digno de ser exibido em [chosen_holy_site_for_pilgrim_roads.GetNameNoTierNoTooltip]."
 iberia_north_africa.2013.desc:0 "Você fez um trabalho exemplar ao abrir o caminho literal necessário para facilitar o acesso ao local sagrado de [chosen_holy_site_for_pilgrim_roads.GetNameNoTierNoTooltip]. Por isso, sou obrigado a recompensá-lo.\n\nDiga-me, há algo que você deseja?"
 iberia_north_africa.2013.notif.t:0 "Caminhos de piedade"
 iberia_north_africa.2013.t:0 "Para [ROOT.Char.GetSheHe] que abriu o caminho para os peregrinos."
 iberia_north_africa.2100.a:0 "Sob minha liderança, podemos conquistar qualquer coisa!"
 iberia_north_africa.2100.b:0 "Não seremos mais intimidados!"
 iberia_north_africa.2100.desc:0 "Durante séculos, nós, Bascos, suportamos implacavelmente nossas desventuras com coragem e determinação. Como se esculpidos na antiga rocha pirenaica, nos mantivemos firmes contra inúmeras invasões, esperando o momento oportuno para atacar.\n\nAqueles dias sombrios ficaram para trás, e finalmente conseguimos recuperar as terras de nossos antepassados, agora o coração de um novo e livre Reino de [GetTitleByKey('k_navarra').GetNameNoTier].\n\nApós sofrer as lições mais duras da história, juro que nunca mais permitiremos ser expulsos de nossos lares."
 iberia_north_africa.2100.t:0 "Velha Vasconha Restaurada"
 iberia_north_africa.2101.b:0 "Deveriam ter permanecido nas montanhas!"
 iberia_north_africa.2101.c:0 "Uma surpresa, sem dúvida."
 iberia_north_africa.2101.desc:0 "Ao longo dos séculos, os Bascos foram sendo encurralados nos Pireneus, sendo assediados por invasores de ambos os lados.\n\nAgora, com grande parte das terras ancestrais [founder.GetHerHim] recuperadas, [founder.GetTitledFirstNameRegnal] declarou [founder.GetHerselfHimself] \"[@founder.Custom('QueenKing')] de [GetTitleByKey('k_navarra').GetNameNoTier]\", reivindicando os tratos perdidos como parte de um novo reino basco.\n\nOs povos vizinhos veem essa mudança de fortuna como meramente uma aberração na história da região, e certamente buscam a mais cedo oportunidade de corrigir esse desequilíbrio..."
 iberia_north_africa.2105.a:0 "Ninguém pode se opor a nós!"
 iberia_north_africa.2105.desc:0 "Com a conquista de [mallorca.GetNameNoTier], [sardinas.GetNameNoTier] e [sicily.GetNameNoTier], nos declaramos os governantes justos do Mar Mediterrâneo. Enviados navegaram para todos os cantos da Terra e notificaram os governantes menores sobre nossa gloriosa conquista.\n\nEste mar, e tudo o que ele toca, nos pertence!"
 iberia_north_africa.2105.t:0 "Governantes do Mediterrâneo"
 iberia_north_africa.9101.a:0 "Um novo Reino nasce!"
 iberia_north_africa.9101.b:0 "O futuro de [title_k_canarias.GetNameNoTierNoTooltip] está em Iberia!"
 iberia_north_africa.9101.desc.guanche:0 "Com o horizonte se ampliando e se desenrolando diante de nós, vemos o surgimento de grandes Reinos muito maiores do que os nossos, e se quisermos resistir a invasores estrangeiros, devemos forjar nosso próprio destino e nossa própria coroa. Com [canarias_former.GetName] coroado como o primeiro [canarias_former.GetTitleAsNameNoTooltip] de [title_k_canarias.GetNameNoTierNoTooltip], os habitantes das ilhas têm finalmente um símbolo que os une e um objetivo comum de preservar nosso modo de vida."
 iberia_north_africa.9101.desc.iberian:0 "Com a derrota final dos reis guanches pagãos, há pouco que impeça a propagação do [canarias_former.GetFaith.GetName] entre os habitantes das ilhas e solidifique o domínio de [canarias_former.GetTitledFirstNamePossessiveNoTooltip] sobre as ilhas. [title_k_canarias.GetNameNoTierNoTooltip] agora foi declarado um [title_k_canarias.GetTierAsNameNoTooltip], com [canarias_former.GetName] como seu primeiro [canarias_former.GetTitleAsNameNoTooltip]!"
 iberia_north_africa.9101.desc.intro:0 "Desde tempos imemoriais, cada uma das ilhas se autodenominava um 'reino', mas agora, com todas as ilhas sob o governo diligente de [canarias_former.GetTitledFirstName], chegou a hora de unir as coroas em uma só.\n\n"
 iberia_north_africa.9101.desc.outro:0 "\n\nO futuro ainda permanece incerto para [title_k_canarias.GetNameNoTierNoTooltip], mas a declaração de um novo [title_k_canarias.GetTierAsNameNoTooltip] indubitavelmente inaugurará uma nova era para as ilhas e o futuro da África do Norte."
 iberia_north_africa.9101.t:0 "O Reino das Canárias"
 iberia_north_africa.fp2_golden_age_generic_title_intro:0 "Ciência na Era Dourada:"
 iberia_north_africa.fp2_pilgrim_roads_generic_title_intro:0 "Caminhos do Peregrino:"
 mozarabic_break_with_rome_decision.tt.new_hof_id:0 "[new_religious_head.GetTitledFirstName] é o seu novo [head_of_faith|E]."
 mozarabic_break_with_rome_decision.tt.you_gain_a_hof:0 "Um novo [title|E] de [head_of_faith|E] da mesma fé é criado para o [religious_leader.GetFaith.GetName]"
 name_alas:0 "Ah."
 name_i_see:0 "Vejo."
