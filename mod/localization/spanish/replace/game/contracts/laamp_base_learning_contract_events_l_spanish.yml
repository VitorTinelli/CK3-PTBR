 laamp_base_learning_contract_events.4100.tt.progress_towards_success:0 "$laamp_base_contract_schemes.2781.tt.progress_towards_success$"
 laamp_base_learning_contract_events.4100.tt.support_skill.failure:0 "[support_person.GetFirstName] falha com você."
 laamp_base_learning_contract_events.4100.tt.support_skill.success:0 "[support_person.GetFirstName] tem sucesso."
 laamp_base_learning_contract_events.4100.tt.support_skill:0 "#WEAK Este duelo é decidido pela [skill|E] de [support_person.GetShortUIName]#!"
 laamp_base_learning_contract_events.4110.a:0 "\"Ei, [child_to_educate.Custom('ChildPetName')], qual é a sua experiência com...\""
 laamp_base_learning_contract_events.4110.b.tt:0 "Você não sabe uma língua a mais que [child_to_educate.GetShortUIName]."
 laamp_base_learning_contract_events.4110.b:0 "\"Você sabe a palavra em [alternative_language_culture.GetLanguage.GetNameNoTooltip] para #EMP meleca#!?\""
 laamp_base_learning_contract_events.4110.c.tt:0 "@alert_icon! #alert_trial A falha do [task_contract|E] é iminente#!"
 laamp_base_learning_contract_events.4110.c:0 "Nah. [child_to_educate.GetSheHe|U] é uma causa perdida."
 laamp_base_learning_contract_events.4110.desc:0 "Reconheço o fracasso iminente enquanto o olhar [Select_CString( child_to_educate.IsFemale, 'da', 'do' )] [child_to_educate.GetFirstName] começa a vagar para o aether novamente.\n\nPor algum motivo, a criança está tão #EMP receptiva#!... Eu cerro os punhos e respiro fundo algumas vezes. Talvez eu esteja abordando isso pelo ângulo errado?\n\nNosso tempo está quase acabando, e eu melhor fazer uma #EMP última#! tentativa de conseguir ensinar ao jovem #EMP algo#! substancial."
 laamp_base_learning_contract_events.4110.t:0 "$laamp_base_learning_contract_events_prefix.4100$: Uma Última Tentativa"
 laamp_base_learning_contract_events.4120.a.failure_standard:0 "A criança é sem esperança... ou talvez eu seja."
 laamp_base_learning_contract_events.4120.a.success_critical:0 "\"Foi tudo [child_to_educate.GetSheHe].\""
 laamp_base_learning_contract_events.4120.a.success_standard:0 "\"Muito obrigado.\""
 laamp_base_learning_contract_events.4120.desc.failure:0 "[employer.GetTitledFirstName] balança sua cabeça em descrença:\n\n\"Não vou mentir; esperava mais de você. Esta é uma exibição patética de tutoria — deixar [child_to_educate.GetFirstName] vagar livre pela selva teria sido #EMP mais#! educativo. Agora, afaste-se e não escureça minha porta novamente.\"\n\nSinto a vergonha da tarefa falhada subir em minhas bochechas enquanto me viro para sair."
 laamp_base_learning_contract_events.4120.desc.success:0 "[employer.GetTitledFirstName] tem um olhar indecifrável, beirando o apreciativo:\n\n\"Você certamente tem uma abordagem não convencional para a educação, e [child_to_educate.GetFirstName] realmente recebeu uma ou duas novas perspectivas sobre as coisas... Talvez eu entre em contato novamente, caso seus serviços sejam desejados no futuro.\"\n\nEu aceno com a cabeça e inclino levemente, enquanto me viro para sair."
 laamp_base_learning_contract_events.4120.desc.success_critical:0 "[employer.GetTitledFirstName] tenta suprimir sua alegria:\n\n\"Bem! Seus métodos não convencionais parecem ser muito bem-sucedidos! O jovem [child_to_educate.GetFirstName] já está mostrando sinais de pensamentos e ideias mais discernentes!\"\n\n\"Ângulos de ataque, cortesia social, economia... trabalho maravilhoso! Obrigado, e #EMP faça#! me saber da próxima vez que você estiver na área!\" exclama o [employer.GetTitleAsNameNoTooltip] e gesticula animadamente.\n\nUm breve sorriso passa pelos meus lábios enquanto aceno."
