 fleeting_stewardship_knowledge_modifier_desc:0 "Este personagem foi submetido a uma intensa educação em pensamentos organizacionais."
 laamp_base_4001_request:0 "Este [task_contract|E] requer que você transcreva um manuscrito através de #BOLD 3#! desafios de [skill|E] de [learning|E]; alternativamente, confiando em [lifestyle_traits|E] para produzir um manuscrito ainda melhor"
 laamp_base_4011_request:0 "Esta [task_contract|E] requer que você viaje para as terras [Select_CString( TaskContract.GetEmployer.IsFemale, 'da', 'do' )] [TaskContract.GetEmployer.GetTitledFirstName] e resolva uma série de disputas teológicas locais, através de desafios de [skill|E] em [learning|E], [piety_level|E], [traits|E] religiosos aplicáveis, [piety|E] ou [stress|E]."
 laamp_base_4021_request:0 "Esta [task_contract|E] requer que você crie um manuscrito para o [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier], principalmente através de desafios de [skill|E] em [learning|E], mas potencialmente também desafios em outras [skills|E] relevantes, [lifestyle_traits|E] e experiências de [travel|E]."
 laamp_base_4100_contract:0 "Tutorar Criança"
 laamp_base_4100_contract_contract:0 "$laamp_base_4100_contract$"
 laamp_base_4100_desc:0 "Pessoas de letras são solicitadas pelo [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] para ajudar na tutoria das crianças que residem na corte [TaskContract.GetEmployer.GetHerHim]. O desempenho meritório será reconhecido."
 laamp_base_4100_desc_title:0 "Eruditos conhecedores desejados,"
 laamp_base_4100_request:0 "Este [task_contract|E] exige que você complete #BOLD 3#! desafios de [skill|E] para educar a criança especificada."
 laamp_base_learning_contract_events.4001.a:0 "Que tal eu embelezar isso, só um pouquinho..."
 laamp_base_learning_contract_events.4001.b.flavor.unlearned:0 "Mas como eu desenharia isso..."
 laamp_base_learning_contract_events.4001.b.tt.unavailable:0 "Você não tem nenhum [lifestyle_traits|E] aplicável para este Trecho"
 laamp_base_learning_contract_events.4001.b.tt.used:0 "Você já se inspirou neste [lifestyle_trait|E] para esta Transcrição"
 laamp_base_learning_contract_events.4001.b.unavailable:0 "Se ao menos eu fosse mais experiente neste tópico."
 laamp_base_learning_contract_events.4001.b:0 "Posso me inspirar em minhas próprias experiências!"
 laamp_base_learning_contract_events.4001.c.tt.unavailable:0 "Você só conhece uma [language|E]"
 laamp_base_learning_contract_events.4001.c.tt.used:0 "Você já se baseou no seu conhecimento da [language|E] para esta Transcrição"
 laamp_base_learning_contract_events.4001.c.unavailable:0 "Queria ser mais erudito."
 laamp_base_learning_contract_events.4001.c:0 "Hmm... Vejo as semelhanças com [additional_language_culture.GetLanguage.GetNameNoTooltip]"
 laamp_base_learning_contract_events.4001.d.flavor.unlearned:0 "O que... pode significar aquela linha tortuosa..."
 laamp_base_learning_contract_events.4001.d.flavor.unwind:0 "Por que fazer mais quando posso fazer menos."
 laamp_base_learning_contract_events.4001.d.secret.tt:0 "Você descobre o [secret|E] de [employer.GetShortUIName]"
 laamp_base_learning_contract_events.4001.d.secret:0 "Vou passar mais tempo interpretando."
 laamp_base_learning_contract_events.4001.d:0 "Vamos apenas seguir o script."
 laamp_base_learning_contract_events.4001.desc.01:0 "A luz do dia lentamente se apaga enquanto estou na câmara [Select_CString( employer.IsFemale, 'da', 'do' )] [employer.GetTitledFirstName], à luz de velas, copiando freneticamente linhas tortuosas de tinta de uma folha para outra.\n\nMinhas pálpebras começam a cair, e eu cochilo momentaneamente antes de acordar sobressaltado. Pelo que posso perceber, este trecho específico parece estar relacionado a [SCOPE.Custom('GetScriptTopic')] — mas por #EMP [ROOT.Char.GetFaith.HighGodName]#! está se arrastando #EMP sem parar#!."
 laamp_base_learning_contract_events.4001.desc.02:0 "Alguns dias se passaram, e estou avançando pela transcrição. O trecho atual, no entanto, é mais seco do que cascalho exposto ao sol...\n\nMinha mente começa a divagar para outros assuntos, e eu piscando algumas vezes para forçar meu retorno ao reino da realidade. O cerne do trecho parece estar relacionado a [SCOPE.Custom('GetScriptTopic')], o que por si só não é inerentemente enfadonho."
 laamp_base_learning_contract_events.4001.desc.03:0 "Estou me aproximando do final da transcrição, que está indo [SCOPE.Custom('GetScoreAdjective')] até agora. Mais uma vez, o escriba deste manuscrito está adotando a abordagem mais #EMP monótona#! possível sobre o assunto.\n\nMeu olhar se fixa no atendente, uma visão infinitamente mais interessante, até que [attendant.GetSheHe] me lança um olhar suspeito, me fazendo voltar ao texto. O trecho em si parece estar relacionado a [SCOPE.Custom('GetScriptTopic')], que interessaria os leitores — se não fosse tão seco."
 laamp_base_learning_contract_events.4001.desc.final_shot:0 "Páginas meio escritas; manchas de tinta; penas #EMP por toda parte#!. Eu esfrego minhas têmporas enquanto pondero o caos que minha transcrição malsucedida resultou.\n\nOs olhos do atendente [Select_CString( employer.IsFemale, 'da', 'do' )] [employer.GetTitledFirstName] queimam um buraco nas minhas costas, enquanto eu temo me virar para enfrentar meu iminente fracasso.\n\nMas então, enquanto estudo [ROOT.Char.Custom('GetMarginalia')] esboçado nas margens, eu endireito as costas em um súbito impulso de desafio: #EMP Falhar?#! Só preciso correr através dessas últimas páginas!"
 laamp_base_learning_contract_events.4001.e:0 "É melhor eu me concentrar."
 laamp_base_learning_contract_events.4001.f.tt:0 "$laamp_base_learning_contract_events.4110.c.tt$"
 laamp_base_learning_contract_events.4001.f:0 "Não. Acabou."
 laamp_base_learning_contract_events.4001.failure.t:0 "Transcrição Descartada"
 laamp_base_learning_contract_events.4001.failure.tt:0 "O trecho sai mal e você o descarta"
 laamp_base_learning_contract_events.4001.outro.01:0 "\n\nEu traço um dedo manchado de tinta ao longo de [ROOT.Char.Custom('GetMarginalia')] nas margens. Talvez eu devesse melhorar um pouco o texto, para torná-lo mais atraente?"
 laamp_base_learning_contract_events.4001.outro.02:0 "\n\nEu observo casualmente [ROOT.Char.Custom('GetMarginalia')], rabiscado nas margens, enquanto pondero a situação."
 laamp_base_learning_contract_events.4001.outro.03:0 "\n\nConsidero a melhor maneira de seguir em frente enquanto admiro a marginalia de [ROOT.Char.Custom('GetMarginalia')]."
 laamp_base_learning_contract_events.4001.outro.secret:0 "\n\nEnquanto pondero, noto outro rabisco mencionando o [employer.GetTitleAsNameNoTooltip] nas margens, se ao menos eu pudesse passar um tempo interpretando isso..."
 laamp_base_learning_contract_events.4001.success.t:0 "Transcrição Bem-Sucedida"
 laamp_base_learning_contract_events.4001.success.tt.embellishment:0 "A embelezamento sai perfeito"
 laamp_base_learning_contract_events.4001.success.tt:0 "A transcrição sai bem"
 laamp_base_learning_contract_events.4001.t.diplomacy:0 "$laamp_base_learning_contract_events_prefix.4001$: As Câmaras Internas"
 laamp_base_learning_contract_events.4001.t.intrigue:0 "$laamp_base_learning_contract_events_prefix.4001$: Toda Língua é Silenciosa"
 laamp_base_learning_contract_events.4001.t.learning:0 "$laamp_base_learning_contract_events_prefix.4001$: Palavras Divinas"
 laamp_base_learning_contract_events.4001.t.martial:0 "$laamp_base_learning_contract_events_prefix.4001$: Paz Através da Guerra"
 laamp_base_learning_contract_events.4001.t.stewardship:0 "$laamp_base_learning_contract_events_prefix.4001$: Quando o Ouro Fala"
 laamp_base_learning_contract_events.4001.t:0 "$laamp_base_learning_contract_events_prefix.4001$: O Empurrão Final"
 laamp_base_learning_contract_events.4001.tt.current_total.sub_t1:0 "#TUT Você tem uma pontuação de #V [task_contract.MakeScope.Var('score_tally').GetValue]#! de #V [task_contract.MakeScope.Var('win_t1_threshold').GetValue]#! em direção a um #P Sucesso Qualificado#!#!"
 laamp_base_learning_contract_events.4001.tt.current_total.sub_t2:0 "#TUT Você tem uma pontuação de #V [task_contract.MakeScope.Var('score_tally').GetValue]#! de #V [task_contract.MakeScope.Var('win_t2_threshold').GetValue]#! em direção a um #P Sucesso#! #WEAK (atualmente você conquistou um Sucesso Qualificado)#!#!"
 laamp_base_learning_contract_events.4001.tt.current_total.sub_t3:0 "#TUT Você tem uma pontuação de #V [task_contract.MakeScope.Var('score_tally').GetValue]#! de #V [task_contract.MakeScope.Var('win_t3_threshold').GetValue]#! em direção a um #P Sucesso Excepcional#! #WEAK (atualmente você conquistou um Sucesso)#!#!"
 laamp_base_learning_contract_events.4001.tt.no_progress:0 "Você #BOLD não#! recebe nenhuma pontuação em direção à conclusão bem-sucedida do [task_contract|E]"
 laamp_base_learning_contract_events.4001.tt.passages_left:0 "#TUT Você tem #V [task_contract.MakeScope.Var('text_passages_left').GetValue]#! de #V [task_contract.MakeScope.Var('win_t1_threshold').GetValue]#! trechos de transcrição restantes#!"
 laamp_base_learning_contract_events.4001.tt.progress_towards_success_1:0 "#P +[SCOPE.ScriptValue('learning_task_contract_qualified_score_value')]#! pontuação em direção à conclusão bem-sucedida do [task_contract|E]"
 laamp_base_learning_contract_events.4001.tt.progress_towards_success_2:0 "#P +[SCOPE.ScriptValue('learning_task_contract_medium_score_value')]#! pontuação em direção à conclusão bem-sucedida do [task_contract|E]"
 laamp_base_learning_contract_events.4001.tt.progress_towards_success_3:0 "#P +[SCOPE.ScriptValue('learning_task_contract_major_score_value')]#! pontuação em direção à conclusão bem-sucedida do [task_contract|E]"
 laamp_base_learning_contract_events.4005.a.failure_standard:0 "\"Entendido.\""
 laamp_base_learning_contract_events.4005.a.success_critical:0 "\"Tudo em um dia de trabalho.\""
 laamp_base_learning_contract_events.4005.a.success_qualified:0 "\"Uma transcrição, entregue.\""
 laamp_base_learning_contract_events.4005.a.success_standard:0 "\"Muito obrigado.\""
 laamp_base_learning_contract_events.4005.desc.failure:0 "[employer.GetTitledFirstName] balança sua cabeça:\n\n\"Como isso... o que é... isto é inaceitável. Você arruinou minhas câmaras #EMP e#! desperdiçou preciosos recursos de escrita.\"\n\n[employer.GetSheHe|U] cerra os dentes: \"Saia. Agora. Antes que eu me sinta #EMP menos#! benevolente.\"\n\nEu corro em direção à porta."
 laamp_base_learning_contract_events.4005.desc.success.critical:0 "[employer.GetTitledFirstName] tenta suprimir sua alegria:\n\n\"Bem! Seus métodos não convencionais parecem ser muito bem-sucedidos! O jovem [child_to_educate.GetFirstName] já está mostrando sinais de pensamentos e ideias mais discernentes!\"\n\n\"Ângulos de ataque, cortesia social, economia... trabalho maravilhoso! Obrigado, e #EMP faça#! me saber da próxima vez que você estiver na área!\" exclama o [employer.GetTitleAsNameNoTooltip] gesticulando animadamente.\n\nUm breve sorriso escapa dos meus lábios enquanto aceno."
 laamp_base_learning_contract_events.4005.desc.success.qualified:0 "[employer.GetTitledFirstName] franze seus lábios enquanto [employer.GetSheHe] inspeciona o manuscrito: \"É de fato uma réplica da peça original. Obrigado pela sua entrega confiável.\"\n\n[employer.GetSheHe|U] se vira para sair, mas para por um momento para mencionar: \"Oh. Você pode pegar sua recompensa na porta. Veja-se para fora.\"\n\nVejo a bolsa na porta enquanto me viro para sair."
 laamp_base_learning_contract_events.4005.desc.success:0 "[employer.GetTitledFirstName] folheia as páginas, uma expressão intrigada no rosto [employer.GetHerHim]: \"Bem, este manuscrito é certamente mais interessante do que eu lembrava...\n\n[employer.GetSheHe|U] entrega o roteiro a seu atendente: \"Estude isso e vamos nos reunir à noite.\"\n\nVoltando-se para mim, [employer.GetTitledFirstNameNoTooltip] sorri brevemente, entregando-me um pesado saco: \"Bom trabalho. Como combinado, aqui está sua recompensa.\""
 laamp_base_learning_contract_events.4005.t:0 "$laamp_base_learning_contract_events_prefix.4001$: Conclusão"
 laamp_base_learning_contract_events.4011.a.tt:0 "@camp_travel_short_icon! Você [travel|E] sem seu [domicile|E]"
 laamp_base_learning_contract_events.4011.a:0 "Vamos apressar!"
 laamp_base_learning_contract_events.4011.desc:0 "A manhã chegou, e eu assemblei uma comitiva para me acompanhar até a residência [Select_CString( employer.IsFemale, 'da', 'do' )] [employer.GetTitledFirstName] em [employer.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip].\n\nOs cavalos se mexem inquietos no lugar, e eu dou uma última olhada no acampamento antes de partir."
 laamp_base_learning_contract_events.4011.t:0 "$laamp_base_learning_contract_events_prefix.4011$: Partindo"
 laamp_base_learning_contract_events.4011.tt.destination_list.3_destinations:0 "Você começa imediatamente a [traveling|E] para [employer_location_destination.GetName], depois [destination_1.GetNameNoTier], depois [destination_2.GetNameNoTier], depois [destination_3.GetNameNoTier] e finalmente de volta para [employer_location_destination.GetName]"
 laamp_base_learning_contract_events.4011.tt.destination_list.4_destinations:0 "Você começa imediatamente a [traveling|E] para [employer_location_destination.GetName], depois [destination_1.GetNameNoTier], depois [destination_2.GetNameNoTier], depois [destination_3.GetNameNoTier], depois [destination_4.GetNameNoTier] e finalmente de volta para [employer_location_destination.GetName]"
 laamp_base_learning_contract_events.4011.tt.destination_list.5_destinations:0 "Você começa imediatamente a [traveling|E] para [employer_location_destination.GetName], depois [destination_1.GetNameNoTier], depois [destination_2.GetNameNoTier], depois [destination_3.GetNameNoTier], depois [destination_4.GetNameNoTier], depois [destination_5.GetNameNoTier] e finalmente de volta para [employer_location_destination.GetName]"
 laamp_base_learning_contract_events.4011.tt.explanation:0 "#TUT Para completar a [task_contract|E]:\n$EFFECT_LIST_BULLET$Complete um desafio de [learning|E], use seu [piety_level|E], use [fame_traits|E] religiosos ou convença o portador do destino através de meios #EMP ímpios#!\n$EFFECT_LIST_BULLET$Ganhe um terço de seus desafios para um #P Sucesso Qualificado#!\n$EFFECT_LIST_BULLET$Ganhe dois terços de seus desafios para um #P Sucesso# ordinário#!\n$EFFECT_LIST_BULLET$Ganhe todos os seus desafios para um #P Sucesso Excepcional#!\n\n@alert_icon! #alert_trial Cancelar a [travel|E] invalidará a [task_contract|E]#!#!"
 laamp_base_learning_contract_events.4014.a.tt:0 "Comece a viajar em direção a [destination_1.GetNameNoTier]"
 laamp_base_learning_contract_events.4014.a:0 "\"Farei o meu melhor.\""
 laamp_base_learning_contract_events.4014.desc:0 "\"... e foi então que [dummy_gender.GetSheHe] começou a #EMP rir#!\" a indignação [Select_CString( employer.IsFemale, 'da', 'do' )] [employer.GetTitledFirstName] é palpável.\n\n\"Eu tive #EMP muitas#! discussões teológicas na minha vida, e [employer.GetFaith.HighGodNameAlternate|l] sabe que tento manter a paciência. No entanto, alguns dos meus súditos podem precisar de um #EMP empurrão adicional#! para ver a luz. Talvez #EMP você#! possa ser esse guia espiritual.\"\n\n[employer.GetSheHe|U] acena para [employer.GetHerselfHimself], aparentemente satisfeito com a solução [employer.GetHerHim]: \"[employer.GetFaith.HighGodName] abençoe você em suas viagens. Agora vá.\""
 laamp_base_learning_contract_events.4014.t:0 "$laamp_base_learning_contract_events_prefix.4011$: A Mão Orientadora"
 laamp_base_learning_contract_events.4015.a.failure.t:0 "[challenge_character.GetShortUIName] Permanece Não Convencido"
 laamp_base_learning_contract_events.4015.a.failure.tt:0 "[challenge_character.GetShortUIName] continua a discordar"
 laamp_base_learning_contract_events.4015.a.success.t:0 "[challenge_character.GetShortUIName] Muda de Ideia"
 laamp_base_learning_contract_events.4015.a.success.tt:0 "Você consegue convencer [challenge_character.GetShortUIName]"
 laamp_base_learning_contract_events.4015.a:0 "\"Permita-me compartilhar minha interpretação.\""
 laamp_base_learning_contract_events.4015.b.failure.t:0 "$laamp_base_learning_contract_events.4015.a.failure.t$"
 laamp_base_learning_contract_events.4015.b.failure.tt:0 "Não há como convencer [challenge_character.GetShortUIName]"
 laamp_base_learning_contract_events.4015.b.success.t:0 "$laamp_base_learning_contract_events.4015.a.success.t$"
 laamp_base_learning_contract_events.4015.b.success.tt:0 "Você tem uma conversa produtiva sobre o [challenge_character.GetFaith.GetName]"
 laamp_base_learning_contract_events.4015.b:0 "\"Vamos discutir!\""
 laamp_base_learning_contract_events.4015.c:0 "\"Bem, na #EMP minha#! experiência...\""
 laamp_base_learning_contract_events.4015.d.failure.t:0 "$laamp_base_learning_contract_events.4015.a.failure.t$"
 laamp_base_learning_contract_events.4015.d.failure.tt:0 "[challenge_character.GetShortUIName] não se desviará de suas convicções"
 laamp_base_learning_contract_events.4015.d.success.t:0 "$laamp_base_learning_contract_events.4015.a.success.t$"
 laamp_base_learning_contract_events.4015.d.success.tt:0 "[camp_priest.GetShortUIName] consegue convencer [challenge_character.GetShortUIName]"
 laamp_base_learning_contract_events.4015.d:0 "\"Divino [camp_priest.GetFirstNameNoTooltip], amigo, o que #EMP você#! acha?\""
 laamp_base_learning_contract_events.4015.desc.local_mood.admiration:0 "\"Sinto muito que [employer.GetSheHe] se sinta assim. Mas minha lealdade está, em primeiro lugar, com o [challenge_character.GetFaith.GetNameNoTooltip]. Receio que não há muito que você possa fazer aqui,\" [challenge_character.GetSheHe] diz de maneira apologética."
 laamp_base_learning_contract_events.4015.desc.local_mood.anger:0 "\"Você vem aqui, me interrompendo, por #EMP isso#!? Que [employer.GetTitleAsName] tão mesquinho, minha palavra!\" [challenge_character.GetSheHe|U] fecha seus punhos, respira fundo algumas vezes e tenta se acalmar. \"Não há nada que você possa dizer que me faça concordar com esse #EMP [employer.Custom2('InsultNounClumsy', SCOPE.sC('challenge_character'))]#!!\""
 laamp_base_learning_contract_events.4015.desc.local_mood.disapproval:0 "\"[employer.GetSheHe|U] sempre foi um pouco denso sobre esse assunto em particular,\" [challenge_character.GetSheHe] reconhece enquanto explico a razão da minha visita. \"Certamente não concordo com seu ponto de vista, e duvido que algum dia concordarei.\""
 laamp_base_learning_contract_events.4015.desc.local_mood.indifferent.02:0 "Seus olhos se arregalam e piscam algumas vezes antes de [challenge_character.GetSheHe] perceber o que quero dizer: \"Entendi. É uma pena que [employer.GetSheHe] se sinta assim, mas teremos que concordar em discordar,\" [challenge_character.GetSheHe] franze a testa."
 laamp_base_learning_contract_events.4015.desc.local_mood.indifferent:0 "\"O quê de quem agora? Eh. Claro. Eu acho que podemos ter uma conversa sobre isso. Duvido que mude muito. Mas se isso te faz sentir melhor.\""
 laamp_base_learning_contract_events.4015.desc.local_mood.thinking:0 "\"Oh? Aquela pequena discordância? Eu não pensei muito sobre isso, mas se você tiver argumentos adicionais a apresentar, fique à vontade.\" [challenge_character.GetSheHe|U] dá de ombros: \"Eu não tinha especialmente a intenção de deixar [employer.GetSheHe] bravo, mesmo que não concordemos necessariamente sobre esse ponto em particular.\""
 laamp_base_learning_contract_events.4015.desc.outro:0 "Eu assento em concordância, enquanto cuidadosamente traço o melhor caminho a seguir."
 laamp_base_learning_contract_events.4015.desc.outro_priest.exhausted:0 "$laamp_base_learning_contract_events.4015.desc.outro_priest.intro$ está parecendo decididamente desgastado, olhando para o vazio de vez em quando. Coloco uma mão suave no ombro [camp_priest.GetHerHim]."
 laamp_base_learning_contract_events.4015.desc.outro_priest.intro:0 "À minha direita, meu sacerdote de campo [camp_priest.GetFirstName]"
 laamp_base_learning_contract_events.4015.desc.outro_priest.wary:0 "$laamp_base_learning_contract_events.4015.desc.outro_priest.intro$ está começando a parecer um pouco cansado, enquanto seus olhos se estreitam enquanto considera contra-argumentos."
 laamp_base_learning_contract_events.4015.desc.outro_priest:0 "$laamp_base_learning_contract_events.4015.desc.outro_priest.intro$ murmura e acena, preparando-se mentalmente para suas convicções espirituais."
 laamp_base_learning_contract_events.4015.desc.surroundings.alley:0 "Eu avisto [challenge_character.GetTitledFirstName] em uma das vielas de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], enquanto me dirijo para a residência [challenge_character.GetHerHim]. [challenge_character.GetSheHe|U] estreita os olhos e começa a se mover mais perto quando me aproximo."
 laamp_base_learning_contract_events.4015.desc.surroundings.corridor:0 "Ao chegar, [challenge_character.GetTitledFirstName] está passeando de forma reflexiva por um dos longos corredores. [challenge_character.GetSheHe|U] se vira para me olhar enquanto me aproximo."
 laamp_base_learning_contract_events.4015.desc.surroundings.council_chamber:0 "Ao chegar, [challenge_character.GetTitledFirstName] está nas câmaras do conselho, olhando melancolicamente pela janela. [challenge_character.GetSheHe|U] lentamente se vira ao ouvir meus passos."
 laamp_base_learning_contract_events.4015.desc.surroundings.market:0 "Em um canto do mercado, encontro [challenge_character.GetTitledFirstName] inspecionando minuciosamente um [challenge_character.Custom('GetTradeGoods')] sendo vendido por um comerciante local. [challenge_character.GetSheHe|U] olha para cima quando me aproximo."
 laamp_base_learning_contract_events.4015.desc.surroundings.outdoors_temple:0 "Uma brisa suave me cumprimenta ao entrar nos terrenos sagrados de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]. [challenge_character.GetTitledFirstName] está caminhando tranquilamente um pouco mais à frente, eventualmente desacelerando e se virando para mim à medida que me aproximo."
 laamp_base_learning_contract_events.4015.desc.surroundings.physician:0 "Encontro [challenge_character.GetTitledFirstName] no consultório do médico, envolvido em uma conversa com dois membros [challenge_character.GetFaith.AltPriestTermPlural] [challenge_character.GetHerHim]. O trio para imediatamente de falar enquanto me aproximo, me lançando um olhar curioso."
 laamp_base_learning_contract_events.4015.desc.surroundings.relaxing_room:0 "[challenge_character.GetTitledFirstName] está confortavelmente reclinado em uma cadeira acolchoada enquanto entro na sala de relaxamento. [challenge_character.GetSheHe|U] ergue sua cabeça quando me aproximo."
 laamp_base_learning_contract_events.4015.desc.surroundings.study:0 "Ao chegar, encontro [challenge_character.GetTitledFirstName] absorto em um mapa em seu estudo. Sem olhar para cima, [challenge_character.GetSheHe] grunhe, reconhecendo minha presença."
 laamp_base_learning_contract_events.4015.desc.surroundings.temple:0 "[challenge_character.GetTitledFirstName] está prestes a sair de um[challenge_character.GetFaith.HouseOfWorship] quando chego. [challenge_character.GetSheHe|U] inclina a cabeça quando [challenge_character.GetSheHe] me nota caminhando em direção a [challenge_character.GetSheHe]."
 laamp_base_learning_contract_events.4015.e.flavor:0 "Se alguns argumentos podem ser considerados controversos, bem..."
 laamp_base_learning_contract_events.4015.e:0 "Não irei medir palavras ao convencer [challenge_character.GetSheHe]."
 laamp_base_learning_contract_events.4015.t:0 "$laamp_base_learning_contract_events_prefix.4011$: [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 laamp_base_learning_contract_events.4015.tt.current_total.sub_t1:0 "#TUT Você tem uma pontuação de #V [task_contract.MakeScope.Var('wins_tally').GetValue]#! de #V [task_contract.MakeScope.Var('win_t1_threshold').GetValue]#! para um #P Sucesso Qualificado#!#!"
 laamp_base_learning_contract_events.4015.tt.current_total.sub_t2:0 "#TUT Você tem uma pontuação de #V [task_contract.MakeScope.Var('wins_tally').GetValue]#! de #V [task_contract.MakeScope.Var('win_t2_threshold').GetValue]#! para um #P Sucesso#! #WEAK (você atualmente ganhou um Sucesso Qualificado)#!#!"
 laamp_base_learning_contract_events.4015.tt.current_total.sub_t3:0 "#TUT Você tem uma pontuação de #V [task_contract.MakeScope.Var('wins_tally').GetValue]#! de #V [task_contract.MakeScope.Var('win_t3_threshold').GetValue]#! para um #P Sucesso Excepcional#! #WEAK (você atualmente ganhou um Sucesso)#!#!"
 laamp_base_learning_contract_events.4015.tt.disputes_left:0 "#TUT Você tem #V [task_contract.MakeScope.Var('opportunities_left_tally').GetValue]#! de #V [task_contract.MakeScope.Var('win_t3_threshold').GetValue]#! Disputas restantes#!"
 laamp_base_learning_contract_events.4015.tt.no_progress:0 "$laamp_base_learning_contract_events.4001.tt.no_progress$"
 laamp_base_learning_contract_events.4015.tt.progress_towards_success:0 "$laamp_base_contract_schemes.2781.tt.progress_towards_success$"
 laamp_base_learning_contract_events.4017.a.failure.tt:0 "Você não consegue convencer [employer.GetShortUIName]"
 laamp_base_learning_contract_events.4017.a.success.tt:0 "[employer.GetShortUIName] é convencido"
 laamp_base_learning_contract_events.4017.a.tt:0 "Eles voltarão ao aprisco. Eu #EMP sei#! disso."
 laamp_base_learning_contract_events.4017.a:0 "\"Considere isto: eu semeei as sementes da dúvida.\""
 laamp_base_learning_contract_events.4017.b.failure_standard:0 "$laamp_base_learning_contract_events.4005.a.failure_standard$"
 laamp_base_learning_contract_events.4017.b.success_critical:0 "\"[employer.GetFaith.HighGodNameAlternate] guiou meu caminho.\""
 laamp_base_learning_contract_events.4017.b.success_qualified:0 "\"Estou certo de que eles mudarão de ideia.\""
 laamp_base_learning_contract_events.4017.b.success_standard:0 "\"Só precisei de um pequeno empurrão.\""
 laamp_base_learning_contract_events.4017.desc.failure:0 "[employer.GetTitledFirstName] faz um som de desdém ao eu entrar na sala: \"Oh, você se deu ao trabalho de voltar? Depois de uma exibição tão pobre?\"\n\n[employer.GetSheHe|U] balança a cabeça de forma desdenhosa: \"Você sabe pelo menos a primeira coisa sobre o [employer.GetFaith.GetNameNoTooltip]? Ainda bem que não menciona nada sobre lidar com #EMP imbecis.#!\"\n\n[employer.GetSheHe|U] se vira para sair, e eu fico por um momento antes de começar a andar pelos corredores, procurando a saída."
 laamp_base_learning_contract_events.4017.desc.success.critical:0 "[employer.GetTitledFirstName] praticamente dança ao entrar na sala ao meu retorno: \"#EMP Maravilhoso!#! Ovelhas perdidas retornaram ao aprisco; todas elas. Até aquela incômoda [mentioned_disputee.GetFirstName]...\"\n\n[employer.GetSheHe|U] se vira para pegar um saco, pesado de moedas, e entrega prontamente: \"Você ganhou cada centavo disso. Obrigado, e me avise, caso seu caminho o leve a [employer.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] novamente!\"\n\nEu sorrio e aceno."
 laamp_base_learning_contract_events.4017.desc.success.qualified:0 "[employer.GetTitledFirstName] franze a testa ao voltar para [employer.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]: \"Hmm. Isso é aceitável, embora eu talvez esperasse um pouco mais.\"\n\n[employer.GetSheHe|U] se vira, murmurando para [employer.GetHerselfHimself]: \"Talvez na próxima vez eles se saiam melhor...\"\n\nPercebendo minha presença contínua, [employer.GetSheHe] gesticula em direção a uma bolsa fina ao lado da porta: \"Bem, fique à vontade. Confio que você encontrará seu caminho para sair.\""
 laamp_base_learning_contract_events.4017.desc.success.standard:0 "[employer.GetTitledFirstName] acena sagazmente e aperta os lábios: \"Um trabalho bem feito. A maioria deles me enviou cartas sobre nossas disputas, afirmando minha correção no assunto.\"\n\n[employer.GetSheHe|U] hesita por um momento e então acrescenta: \"Não tenho dúvidas de que o resto mudará de ideia. Eu #EMP estou#! certo, afinal.\"\n\nEu aceno cortês e me viro para sair."
 laamp_base_learning_contract_events.4017.t:0 "$laamp_base_learning_contract_events_prefix.4011$: Conclusão"
 laamp_base_learning_contract_events.4021.a.tt:0 "Ficar com #V 3#! Capítulos"
 laamp_base_learning_contract_events.4021.a:0 "Melhor manter simples."
 laamp_base_learning_contract_events.4021.b.tt:0 "Alcançar #V 5#! Capítulos\n$EFFECT_LIST_BULLET$Chance adicional de um ponto em [skill|E] no último Capítulo"
 laamp_base_learning_contract_events.4021.b:0 "Minha criação será #EMP exaustiva#!."
 laamp_base_learning_contract_events.4021.desc:0 "Eu canto enquanto olho ao redor do estúdio [Select_CString( employer.IsFemale, 'da', 'do' )] [employer.GetTitledFirstName]. Muitos scripts, manuscritos e contos estão reunidos aqui, em pilhas organizadas e alinhados nas prateleiras.\n\nUma obra não é necessariamente julgada por seu comprimento, com certeza? Mesmo a menção de uma única palavra pode evocar emoções complexas.\n\nMas primeiro as coisas: que tamanho de obra eu consigo produzir?"
 laamp_base_learning_contract_events.4021.t:0 "$laamp_base_learning_contract_events_prefix.4021$: O que há em uma Obra"
 laamp_base_learning_contract_events.4021.tt.chapter_explanation:0 "#TUT Com mais Capítulos, você enfrentará um aumento na quantidade de desafios. As recompensas irão se acumular, mas a dificuldade também!#!"
 laamp_base_learning_contract_events.4021.tt.explanation:0 "#TUT Para completar o [task_contract|E]:\n$EFFECT_LIST_BULLET$Complete um desafio de [learning|E], um desafio combinado em outra [skill|E] relevante ou tire proveito da sua experiência [traveling|E]\n$EFFECT_LIST_BULLET$Ganhe um terço dos seus desafios para um #P Sucesso Qualificado#!\n$EFFECT_LIST_BULLET$Ganhe dois terços dos seus desafios para um #P Sucesso#! ordinário\n$EFFECT_LIST_BULLET$Ganhe todos os seus desafios para um #P Sucesso Excepcional#!#!"
 laamp_base_learning_contract_events.4025.a.second:0 "Um toque a mais de sagacidade não faria mal."
 laamp_base_learning_contract_events.4025.a:0 "Vou deslumbrá-los com minha sagacidade!"
 laamp_base_learning_contract_events.4025.b.second:0 "Outro teorema sobre diplomacia seria bom."
 laamp_base_learning_contract_events.4025.b:0 "Um trecho sobre habilidades sociais seria útil."
 laamp_base_learning_contract_events.4025.c.second:0 "Outra seção sobre comandantes, talvez?"
 laamp_base_learning_contract_events.4025.c:0 "Meu conhecimento militar deve se traduzir bem."
 laamp_base_learning_contract_events.4025.d.second:0 "Desta vez, vamos abordar eficiência."
 laamp_base_learning_contract_events.4025.d:0 "S é para administração. Meu tipo de tópico."
 laamp_base_learning_contract_events.4025.desc.01:0 "A luz do dia desaparece lá fora e eu estou sentado à luz de vela no estúdio [Select_CString( employer.IsFemale, 'da', 'do' )] [employer.GetTitledFirstName], aproveitando a hospitalidade que vem com ser um escriba em atividade."
 laamp_base_learning_contract_events.4025.desc.02:0 "Serventes aparecem ocasionalmente, limpando silenciosamente o cômodo ou fornecendo porções de comida; mas sempre tendo o máximo cuidado para ser silenciosos e fechando a porta cuidadosamente ao sair."
 laamp_base_learning_contract_events.4025.desc.03:0 "De vez em quando, quando não está fora e sobre, [employer.GetTitledFirstName] aparece com a cabeça no estúdio, espreitando minhas páginas de progresso manchadas de tinta. [employer.GetSheHe|U] murmura e depois sai, aparentemente ocupado com assuntos mais importantes."
 laamp_base_learning_contract_events.4025.desc.final_shot:0 "A luz do dia desaparece lá fora enquanto estou sentado à luz de vela, agora me sentindo decididamente mais frio, deixado com meus próprios pensamentos de inadequação. Nem mesmo as frequentes porções de comida conseguem alegrar meu humor."
 laamp_base_learning_contract_events.4025.desc.first:0 "O [ROOT.Char.Custom('WritingInstrument')] acariciando meu queixo, pondero cuidadosamente sobre o que o manuscrito deve ser."
 laamp_base_learning_contract_events.4025.desc.intro.01:0 "Depois de um tempo, enquanto me envolvo nisso, descubro que estou rabiscando, preenchendo página após página com pensamentos e observações relacionadas a [SCOPE.Custom('GetLatestTopic')]."
 laamp_base_learning_contract_events.4025.desc.intro.02:0 "Enquanto estou escrevendo, desfruto de um delicioso canto de pássaros, que entra pelos magníficos jardins de [employer.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 laamp_base_learning_contract_events.4025.desc.intro.03:0 "O tempo passa rapidamente enquanto estou sentado perto do púlpito, registrando minhas minuciosas observações e perspectivas sobre [SCOPE.Custom('GetLatestTopic')]."
 laamp_base_learning_contract_events.4025.desc.intro.final_shot:0 "Secando uma gota de suor da minha testa, minha mente continua girando. Meu trabalho está quase completo — mas como eu tenho me saído? Isso é apresentável?"
 laamp_base_learning_contract_events.4025.desc.intro.first:0 "Eu olho para a página em branco à minha frente. #EMP Palavras.#! Por que é sempre tão difícil começar?"
 laamp_base_learning_contract_events.4025.desc.intro.inspiration:0 "Um pensamento de repente me ocorre. [SCOPE.Custom('GetInspirationTopic')|U]. Não é tão difícil, é? Quanto mais penso sobre isso, mais inspirado me sinto para compartilhar meu conhecimento sobre o assunto."
 laamp_base_learning_contract_events.4025.desc.intro.last:0 "Lendo meus rabiscos, solto um grunhido satisfeito. Relevante e conciso. Isso deve ser capaz de satisfazer [employer.GetTitledFirstName], certamente?"
 laamp_base_learning_contract_events.4025.desc.last:0 "Os pratos continuam se acumulando enquanto aproveito os últimos vestígios de hospitalidade agora que meu trabalho aqui está chegando ao fim. Os serventes estão mais mesquinhos com a comida agora, ou estou imaginando coisas...?"
 laamp_base_learning_contract_events.4025.desc.outro.01:0 "Reconhecendo isso, passo para a questão mais pertinente de tentar decidir se devo continuar escrevendo sobre [SCOPE.Custom('GetLatestTopic')] ou se seria mais sábio diversificar..."
 laamp_base_learning_contract_events.4025.desc.outro.02:0 "Refletindo sobre isso, continuo considerando sobre o que deve ser o próximo capítulo..."
 laamp_base_learning_contract_events.4025.desc.outro.03:0 "Com o pensamento pairando em minha mente, volto minha atenção para a página — [SCOPE.Custom('GetLatestTopic')] ainda é pertinente para escrever sobre...?"
 laamp_base_learning_contract_events.4025.desc.outro.final_shot:0 "Pondero sobre isso e então endireito um pouco as costas. Tenho duas opções — reconhecer minhas falhas ou — eu enfio o peito para fora — faço uma última tentativa, #EMP apropriada#!"
 laamp_base_learning_contract_events.4025.desc.outro.first.has_topic:0 "[employer.GetTitledFirstName] queria uma escritura relacionada a [SCOPE.Custom('GetPreferedTopic')]. Um ponto válido para eu considerar. Agora, por onde começo..."
 laamp_base_learning_contract_events.4025.desc.outro.first.no_topic:0 "Deixando meu olhar vagar pela sala novamente, procuro em minha mente tópicos apropriados para começar meu capítulo..."
 laamp_base_learning_contract_events.4025.e.second:0 "Outro capítulo sobre discrição, talvez."
 laamp_base_learning_contract_events.4025.e:0 "Um tratado sobre engano, a caminho."
 laamp_base_learning_contract_events.4025.f.second:0 "Outra rodada de histórias de viagem poderia ser boa."
 laamp_base_learning_contract_events.4025.f:0 "Tenho muitas histórias de viagem para contar."
 laamp_base_learning_contract_events.4025.failure.t:0 "Capítulo Fraco"
 laamp_base_learning_contract_events.4025.failure.tt:0 "Você estraga o Capítulo"
 laamp_base_learning_contract_events.4025.g.second:0 "Estamos realmente prontos para acabar com peregrinações?"
 laamp_base_learning_contract_events.4025.g:0 "Peregrinações. Há realmente algo mais #EMP divino#!?"
 laamp_base_learning_contract_events.4025.h.second:0 "Há muitas mais maravilhas para escrever!"
 laamp_base_learning_contract_events.4025.h:0 "As #EMP maravilhas#! que vi. Vou escrever sobre isso."
 laamp_base_learning_contract_events.4025.i.flavor:0 "Isso faz minha cabeça doer..."
 laamp_base_learning_contract_events.4025.i.second:0 "Mais uma concentração, então."
 laamp_base_learning_contract_events.4025.i:0 "Melhor me concentrar, suponho."
 laamp_base_learning_contract_events.4025.j:0 "Um #EMP último#! esforço..."
 laamp_base_learning_contract_events.4025.k:0 "Não. Não vale a pena."
 laamp_base_learning_contract_events.4025.success.t:0 "Capítulo Terrífico"
 laamp_base_learning_contract_events.4025.success.tt:0 "O Capítulo sai bem"
 laamp_base_learning_contract_events.4025.t.first:0 "$laamp_base_learning_contract_events_prefix.4021$: Começos Humildes"
 laamp_base_learning_contract_events.4025.t.last:0 "$laamp_base_learning_contract_events_prefix.4021$: o Capítulo Final"
 laamp_base_learning_contract_events.4025.t:0 "$laamp_base_learning_contract_events_prefix.4021$: o Próximo Capítulo"
 laamp_base_learning_contract_events.4025.tt.chapters_left:0 "Você tem #V [task_contract.MakeScope.Var('chapters_left').GetValue]#! de #V [task_contract.MakeScope.Var('win_t3_threshold').GetValue]#! Capítulos restantes"
 laamp_base_learning_contract_events.4025.tt.current_total.sub_t1:0 "$laamp_base_learning_contract_events.4015.tt.current_total.sub_t1$"
 laamp_base_learning_contract_events.4025.tt.current_total.sub_t2:0 "$laamp_base_learning_contract_events.4015.tt.current_total.sub_t2$"
 laamp_base_learning_contract_events.4025.tt.current_total.sub_t3:0 "$laamp_base_learning_contract_events.4015.tt.current_total.sub_t3$"
 laamp_base_learning_contract_events.4025.tt.guaranteed_success:0 "#P +2#! pontos em direção à conclusão bem-sucedida do [task_contract|E]"
 laamp_base_learning_contract_events.4025.tt.no_progress:0 "$laamp_base_learning_contract_events.4001.tt.no_progress$"
 laamp_base_learning_contract_events.4025.tt.prefered_topic:0 "Este [task_contract|E] tem recompensas extras para o tópico [SCOPE.Custom('GetPreferedTopicConcept')]"
 laamp_base_learning_contract_events.4025.tt.progress_towards_success:0 "$laamp_base_contract_schemes.2781.tt.progress_towards_success$"
 laamp_base_learning_contract_events.4027.a.failure.tt:0 "$laamp_base_learning_contract_events.4017.a.failure.tt$"
 laamp_base_learning_contract_events.4027.a.success.tt:0 "$laamp_base_learning_contract_events.4017.a.success.tt$"
 laamp_base_learning_contract_events.4027.a.tt:0 "É #EMP um#! verdadeiro pedaço de trabalho."
 laamp_base_learning_contract_events.4027.a:0 "\"Considere isso: Você tem um manuscrito único em suas mãos.\""
 laamp_base_learning_contract_events.4027.b.failure_standard:0 "$laamp_base_learning_contract_events.4005.a.failure_standard$"
 laamp_base_learning_contract_events.4027.b.success_critical:0 "\"Uma maravilha adicional no mundo.\""
 laamp_base_learning_contract_events.4027.b.success_qualified:0 "\"Bem, eu #EMP estava#! um pouco apressado.\""
 laamp_base_learning_contract_events.4027.b.success_standard:0 "\"Eu vivo para servir.\""
 laamp_base_learning_contract_events.4027.desc.failure:0 "\"Que tipo de...\" [employer.GetTitledFirstName] para por um momento antes de lançar o manuscrito para seu atendente.\n\n\"Você teve a audácia de gastar minha tinta e folhas duramente conquistadas com isso... #EMP bobagem#!?\"\n\nAgora vagando em pequenos círculos frenéticos, [employer.GetSheHe] esfrega suas têmporas: \"Eu o convidei para minha casa. Meu #EMP escritório#! E #EMP isso#! é o que você consegue produzir? Estou com meio pensamento em chamar os guardas por essa traição!\""
 laamp_base_learning_contract_events.4027.desc.success.critical:0 "[employer.GetTitledFirstName] folheia as páginas do manuscrito, parando para contemplar um trecho de cada página. \"Vou dizer...\"\n\n[employer.GetSheHe|U] se vira e gentilmente entrega o manuscrito ao seu atendente. \"Você viu isso? Posso muito bem colocá-lo em #EMP exibição#!. Uma peça de escritura de tirar o fôlego.\"\n\nAplaudindo suavemente, [employer.GetSheHe] se inclina, travessamente. \"Eu particularmente gostei #EMP daquele#! pedaço de marginalia. Muito bem feito! Aproveite suas recompensas e me avise se algum dia voltar a [employer.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip].\"\n\nEu me estico orgulhosamente e aceno com a cabeça."
 laamp_base_learning_contract_events.4027.desc.success.qualified:0 "\"Não... exatamente o que eu tinha em mente. Certamente #EMP uma peça de trabalho#! mas... \" [employer.GetTitledFirstName] enruga um pouco o nariz enquanto [employer.GetSheHe] entrega o manuscrito ao seu atendente.\n\n\"...talvez eu coloque isso em uma das pilhas. Confio que você consegue sair sozinho?\" Não esperando minha resposta, [employer.GetSheHe] já deixou o quarto.\n\nEu pego a megera sacola pela porta e começo a vagar pelos corredores em busca de uma saída."
 laamp_base_learning_contract_events.4027.desc.success.standard:0 "Olhando curiosamente para o manuscrito, [employer.GetTitledFirstName] faz um som e acena com a cabeça. \"No geral, um trabalho bem feito — vou colocá-lo na minha prateleira com o resto das obras.\"\n\n[employer.GetSheHe|U] entrega uma sacola de tamanho respeitável. \"Confio que isso deve compensá-lo pelo seu tempo.\"\n\n\"Por favor, me avise se quiser tentar novamente em algum momento,\" [employer.GetSheHe] termina, enquanto [employer.GetSheHe] se vira para sair.\n\nEu aceito a sacola e aceno cortêsmente."
 laamp_base_learning_contract_events.4027.t:0 "$laamp_base_learning_contract_events_prefix.4021$: Conclusão"
 laamp_base_learning_contract_events.4100.a:0 "\"Pequeno [child_to_educate.Custom('ChildPetName')], você #EMP sabia#! que...\""
 laamp_base_learning_contract_events.4100.b.scholar:0 "Que tal uma abordagem mais acadêmica!"
 laamp_base_learning_contract_events.4100.b:0 "\"Certo, apenas por mais um pouco, então vamos começar.\""
 laamp_base_learning_contract_events.4100.c.diplomacy.support_not_exists.tt:0 "Você não tem um [follower|E] com uma [skill|E] [Concept('diplomacy', 'Diplomática')|E] alta o suficiente."
 laamp_base_learning_contract_events.4100.c.diplomacy.support_not_exists:0 "Se ao menos eu tivesse um diplomata mais experiente para me ajudar."
 laamp_base_learning_contract_events.4100.c.intrigue.support_not_exists.tt:0 "Você não tem um [follower|E] com uma [skill|E] em [intrigue|E] alta o suficiente."
 laamp_base_learning_contract_events.4100.c.intrigue.support_not_exists:0 "Se ao menos eu tivesse alguém mais astuto para convocar."
 laamp_base_learning_contract_events.4100.c.learning.support_not_exists.tt:0 "Você não tem um [follower|E] com uma [skill|E] em [learning|E] alta o suficiente."
 laamp_base_learning_contract_events.4100.c.learning.support_not_exists:0 "Se ao menos eu conhecesse alguém mais sábio."
 laamp_base_learning_contract_events.4100.c.martial.support_not_exists.tt:0 "Você não tem um [follower|E] com uma [skill|E] [martial|E] alta o suficiente."
 laamp_base_learning_contract_events.4100.c.martial.support_not_exists:0 "Se ao menos eu tivesse um seguidor mais militar para me ajudar."
 laamp_base_learning_contract_events.4100.c.prowess.support_not_exists.tt:0 "Você não tem um [follower|E] com uma [skill|E] de [prowess|E] alta o suficiente."
 laamp_base_learning_contract_events.4100.c.prowess.support_not_exists:0 "Eu gostaria de conhecer alguém com grandes habilidades de combate."
 laamp_base_learning_contract_events.4100.c.stewardship.support_not_exists.tt:0 "Você não tem um [follower|E] com uma [skill|E] [Concept('stewardship', 'Administrativa')|E] alta o suficiente."
 laamp_base_learning_contract_events.4100.c.stewardship.support_not_exists:0 "Aposto que alguém mais organizado poderia lidar com isso."
 laamp_base_learning_contract_events.4100.c.support_exists:0 "\"[support_person.GetFirstNameNoTooltip], sua hora de brilhar!\""
 laamp_base_learning_contract_events.4100.child.fleeting_knowledge.desc:0 "O conhecimento é efêmero."
 laamp_base_learning_contract_events.4100.child.nothing_gleaned.desc:0 "Não há nada extraído deste momento educacional."
 laamp_base_learning_contract_events.4100.child.solid_knowledge.desc:0 "O conhecimento se solidifica."
 laamp_base_learning_contract_events.4100.child:0 "Isso irá aumentar a"
 laamp_base_learning_contract_events.4100.child_diplomacy.tt:0 "$laamp_base_learning_contract_events.4100.child$ [education_focus|E] [Concept('diplomacy', 'Diplomático')|E] [Select_CString( child_to_educate.IsFemale, 'da', 'do' )] [child_to_educate.GetFirstNameNoTooltip]"
 laamp_base_learning_contract_events.4100.child_intrigue.tt:0 "$laamp_base_learning_contract_events.4100.child$ [education_focus|E] de [intrigue|E] [Select_CString( child_to_educate.IsFemale, 'da', 'do' )] [child_to_educate.GetFirstNameNoTooltip]"
 laamp_base_learning_contract_events.4100.child_learning.tt:0 "$laamp_base_learning_contract_events.4100.child$ [education_focus|E] de [learning|E] [Select_CString( child_to_educate.IsFemale, 'da', 'do' )] [child_to_educate.GetFirstNameNoTooltip]"
 laamp_base_learning_contract_events.4100.child_martial.tt:0 "$laamp_base_learning_contract_events.4100.child$ [education_focus|E] [martial|E] [Select_CString( child_to_educate.IsFemale, 'da', 'do' )] [child_to_educate.GetFirstNameNoTooltip]"
 laamp_base_learning_contract_events.4100.child_stewardship.tt:0 "$laamp_base_learning_contract_events.4100.child$ [education_focus|E] [Concept('stewardship', 'Administrativo')|E] [Select_CString( child_to_educate.IsFemale, 'da', 'do' )] [child_to_educate.GetFirstNameNoTooltip]"
 laamp_base_learning_contract_events.4100.d:0 "\"Ei! #EMP Você ESCUTA aqui!#!\""
 laamp_base_learning_contract_events.4100.desc.distraction.attention:0 "\n\nQuando me viro, porém, [Select_CString( child_to_educate.IsFemale, 'a', 'o' )] [child_to_educate.Custom('GirlBoy')] parou abruptamente em seus rastros, inspecionando atentamente um graveto do tamanho de um braço que [child_to_educate.GetSheHe] encontrou no chão, enquanto [child_to_educate.GetSheHe] está totalmente indiferente aos meus chamados."
 laamp_base_learning_contract_events.4100.desc.distraction.crushing:0 "\n\nMais à frente, um[Select_CString( dummy_gender.IsFemale, 'a', '' )] impressionante [dummy_gender.Custom('GirlBoy')] camponês[Select_CString( dummy_gender.IsFemale, 'a', '' )] aparentemente encantou meu protegido. [child_to_educate.GetSheHe|U] se esgueira, observando atentamente [Select_CString( dummy_gender.IsFemale, 'a', 'o' )] [dummy_gender.Custom('GirlBoy')] carregando provisões e #EMP decididamente#! ignora minha presença."
 laamp_base_learning_contract_events.4100.desc.distraction.dog:0 "\n\nEntão, como que do nada, um grande [ROOT.Char.Custom('get_region_dog_type')] corre em direção à criança, desesperado para brincar. [Select_CString( child_to_educate.IsFemale, 'A', 'O' )] [child_to_educate.Custom('GirlBoy')] grita de alegria e imediatamente começa a brincar com o cachorro."
 laamp_base_learning_contract_events.4100.desc.distraction.friends:0 "\n\nMeu pupilo aparentemente trouxe um monte de amigos, o que é bom, mas eles parecem muito pouco interessados em ouvir minha palestra, para minha decepção. Tento não franzir a testa enquanto eles brigam e provocam uns aos outros."
 laamp_base_learning_contract_events.4100.desc.distraction.hiding:0 "\n\n[Select_CString( child_to_educate.IsFemale, 'A', 'O' )] [child_to_educate.Custom('GirlBoy')] aparentemente entrou em uma fase de brincadeira, enquanto [child_to_educate.GetSheHe] obsessivamente aparece e desaparece de lugares para se esconder, tentando se afastar de mim. Tento afastar minha crescente frustração."
 laamp_base_learning_contract_events.4100.desc.distraction.hobbyhorse:0 "\n\nAtrás de mim, meu protegido está flutuando, pegando o cavalo de madeira [child_to_educate.GetHerHim] de um suporte próximo. [child_to_educate.GetSheHe|U] começa a andar em círculos, correndo alegremente ao redor da área."
 laamp_base_learning_contract_events.4100.desc.distraction.other_kids:0 "\n\nOutras crianças estão correndo em um jogo improvisado, chamando a atenção d[Select_CString( child_to_educate.IsFemale, 'a', 'o' )] [child_to_educate.Custom('GirlBoy')]. [child_to_educate.GetSheHe|U] corre até elas, juntando-se à partida antes que eu possa parar [child_to_educate.GetSheHe]."
 laamp_base_learning_contract_events.4100.desc.distraction.running:0 "\n\nDe repente, [Select_CString( child_to_educate.IsFemale, 'a', 'o' )] jovem [child_to_educate.Custom('GirlBoy')] [child_to_educate.GetCulture.GetNameNoTooltip] fica com um olhar selvagem em seus olhos e começa a gritar: \"Os bandidos estão chegando!\" e quase ri muito enquanto [child_to_educate.GetSheHe] corre de um lado para o outro com seu acompanhante."
 laamp_base_learning_contract_events.4100.desc.distraction.stress:0 "\n\nA criança caminha atrás de mim, decididamente olhando para o outro lado e me ignorando sempre que olho para [child_to_educate.GetSheHe], preparando-se para minha próxima explosão de impaciência. Com as sobrancelhas franzidas, pondero sobre a situação."
 laamp_base_learning_contract_events.4100.desc.distraction.unimpressed:0 "\n\nNão demorou muito para que a cortesia inicial se dissipasse, quando a criança, por algum motivo, se recosta e começa a me ignorar, fechando seus olhos e fingindo que está dormindo no meio da minha palestra."
 laamp_base_learning_contract_events.4100.desc.intro.first_time:0 "[child_to_educate.GetFirstName] me olha com curiosidade, mas expectativa, quando nos encontramos para nossa primeira sessão."
 laamp_base_learning_contract_events.4100.desc.intro.learning:0 "[child_to_educate.GetFirstName] me dá um olhar enigmático quando nos encontramos para nossa próxima sessão."
 laamp_base_learning_contract_events.4100.desc.intro.stress:0 "À medida que me aproximo, [child_to_educate.GetFirstName] recua instintivamente, seus olhos se estreitando em suspeita."
 laamp_base_learning_contract_events.4100.desc.intro.support:0 "[child_to_educate.GetFirstName] inspeciona [support_person.GetFirstName] com um olhar curioso enquanto nos aproximamos."
 laamp_base_learning_contract_events.4100.desc.intro.support_no_support:0 "Uma breve expressão de confusão passa pelo rosto [Select_CString( child_to_educate.IsFemale, 'da', 'do' )] [child_to_educate.GetFirstName] enquanto [child_to_educate.GetSheHe] pondera onde meu assistente da última sessão foi."
 laamp_base_learning_contract_events.4100.desc.intro.topic:0 "Ao nos reencontrarmos, [child_to_educate.GetFirstName] inclina sua cabeça enquanto eu resumo o tópico da nossa última sessão."
 laamp_base_learning_contract_events.4100.desc.outro:0 "\n\n[support_person.GetFirstName] $laamp_base_learning_contract_events.4100.desc.outro_body$"
 laamp_base_learning_contract_events.4100.desc.outro_body:0 "acena para mim de lá, pronto para ajudar caso seja necessário."
 laamp_base_learning_contract_events.4100.desc.outro_other:0 "\n\n[support_person.GetFirstNameNoTooltip] $laamp_base_learning_contract_events.4100.desc.outro_body$"
 laamp_base_learning_contract_events.4100.desc.surroundings.alley_day:0 "\n\nA viela está cheia de atividade, comerciantes se movendo rapidamente entre as praças, "
 laamp_base_learning_contract_events.4100.desc.surroundings.armory:0 "\n\nA fornalha rugindo, as armas estão empilhadas nos cantos da armaria, "
 laamp_base_learning_contract_events.4100.desc.surroundings.desert:0 "\n\nAreia, areia, areia, até onde a vista alcança. Nós nos movemos pelos arredores da propriedade, "
 laamp_base_learning_contract_events.4100.desc.surroundings.docks:0 "\n\nOs barcos de pesca estão entrando para atracar e a riqueza do mar está sendo descarregada, "
 laamp_base_learning_contract_events.4100.desc.surroundings.drylands:0 "\n\nAs terras secas não abrigam muitas gotas de água, mas ainda passamos por várias festas de viajantes, "
 laamp_base_learning_contract_events.4100.desc.surroundings.farmlands:0 "\n\nUma fila de aldeões indo e vindo atravessa as terras agrícolas planas, "
 laamp_base_learning_contract_events.4100.desc.surroundings.foggy_forest:0 "\n\nUma névoa brilhante envolve a floresta, enquanto os locais estão preparando sua próxima refeição nas proximidades, "
 laamp_base_learning_contract_events.4100.desc.surroundings.forest:0 "\n\nNos deparamos com um acampamento local de aventureiros amigáveis na floresta, "
 laamp_base_learning_contract_events.4100.desc.surroundings.forest_cave:0 "\n\nO sábio local [ROOT.Char.GetWomanMan] que habita a caverna atrai bastante público, "
 laamp_base_learning_contract_events.4100.desc.surroundings.gallows:0 "\n\nA multidão ao redor da forca está se dispersando, sua sede de sangue satisfeita, "
 laamp_base_learning_contract_events.4100.desc.surroundings.garden:0 "\n\nOs jardins tranquilos acomodam amplas oportunidades de ensino, "
 laamp_base_learning_contract_events.4100.desc.surroundings.hills:0 "\n\nAs colinas ondulantes abrigam muit[ROOT.Char.Custom('RegionalFarmAnimalPlural')] pastando, "
 laamp_base_learning_contract_events.4100.desc.surroundings.managed_forest:0 "\n\nO acampamento de madeira próximo está repleto de atividade, "
 laamp_base_learning_contract_events.4100.desc.surroundings.market:0 "\n\nOs bens estão trocando de mãos e as necessidades estão sendo atendidas no mercado, "
 laamp_base_learning_contract_events.4100.desc.surroundings.mountains:0 "\n\nA montanha local está cheia de viajantes e atividades, "
 laamp_base_learning_contract_events.4100.desc.surroundings.oasis:0 "\n\nO oásis, localizado nos arredores da propriedade, atrai muitos visitantes, "
 laamp_base_learning_contract_events.4100.desc.surroundings.pine_forest:0 "\n\nForasteiros se mexem na mata, colhendo iguarias locais, "
 laamp_base_learning_contract_events.4100.desc.surroundings.plains:0 "\n\nOs ventos vagam pelas planícies, o toque de seu sopro sentido por todos que passam, "
 laamp_base_learning_contract_events.4100.desc.surroundings.snowy_forest:0 "\n\nAldeões estão à procura de pegadas de animais na neve, "
 laamp_base_learning_contract_events.4100.desc.surroundings.steppe:0 "\n\nA estepe aparentemente continua ad infinitum, enquanto nós adentramos a periferia da propriedade, "
 laamp_base_learning_contract_events.4100.desc.surroundings.tavern:0 "\n\nA taverna coleta uma variedade de regulares e visitantes, "
 laamp_base_learning_contract_events.4100.desc.surroundings.temple:0 "\n\nVários [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdherentNamePluralNoTooltip] passeiam pacificamente pelos terrenos sagrados, "
 laamp_base_learning_contract_events.4100.desc.surroundings.throneroom:0 "\n\nOs servos correm de um lado para o outro na sala do trono, "
 laamp_base_learning_contract_events.4100.desc.surroundings.wetlands:0 "\n\nToda sorte de pragas chama as terras úmidas de lar, como o viajante descobre rapidamente, "
 laamp_base_learning_contract_events.4100.desc.topic.diplomacy:0 "e eu avisto uma variedade de oportunidades para ensinar [child_to_educate.GetFirstNameNoTooltip] mais sobre a graça da interação social."
 laamp_base_learning_contract_events.4100.desc.topic.intrigue:0 "e enquanto caminhamos pelo caminho, mantenho um olhar atento em nossos arredores — uma habilidade que [child_to_educate.GetFirstNameNoTooltip] deve dominar."
 laamp_base_learning_contract_events.4100.desc.topic.learning:0 "e eu localizo [ROOT.Char.Custom('GetScientificObjects')] que seriam benéficos para [child_to_educate.GetFirstNameNoTooltip] tomar conhecimento."
 laamp_base_learning_contract_events.4100.desc.topic.martial:0 "e enquanto examino nossos arredores, rapidamente avisto alguns pontos de vantagem que devo ensinar a [child_to_educate.GetFirstNameNoTooltip]."
 laamp_base_learning_contract_events.4100.desc.topic.prowess:0 "e imediatamente começo a identificar os vários ângulos perigosos de onde poderíamos ser emboscados — algo que devo ensinar a [child_to_educate.GetFirstNameNoTooltip]."
 laamp_base_learning_contract_events.4100.desc.topic.stewardship:0 "e olhando ao redor, identifico várias oportunidades para melhorar a organização atual; algo que [child_to_educate.GetFirstNameNoTooltip] deve ser informado."
