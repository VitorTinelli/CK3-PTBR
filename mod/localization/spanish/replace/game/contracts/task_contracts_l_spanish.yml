 laamp_base_0031_request:0 "Este [task_contract|E] requer que você [Concept('travel', 'viaje')|E] para #BOLD 3#! [counties|E] nas terras [Select_CString( TaskContract.GetEmployer.IsFemale, 'da', 'do' )] [TaskContract.GetEmployer.GetTitledFirstName], usando uma [skill|E] diferente em cada uma para ajudar [TaskContract.GetEmployer.GetSheHe] a remover um [modifier|E] negativo."
