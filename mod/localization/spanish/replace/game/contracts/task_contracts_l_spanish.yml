 EVENT_WINDOW_OPTION_AVAILABLE_INCREASE_CONTROL_TAXES:0 "Esta opção está disponível devido aos impostos abusivos deste condado"
 IS_CONTACT_OF:0 "[CHARACTER.GetShortUIName] é [contact_list_contact|E] [Select_CString( TARGET_CHARACTER.IsFemale, 'da', 'do' )] [TARGET_CHARACTER.GetShortUIName]"
