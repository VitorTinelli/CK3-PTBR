 TREASURE_HUNTING_CONTRACT_DECISION_NEXT_STEP_BUTTON:0 "\"Selecionar Destino\""
 TREASURE_HUNTING_DECISION_TRAVEL_LIMIT:0 "\"[region|E] está longe demais, você não tem [provisions|E] suficientes.\""
 adventurer_not_famous_or_patron_trigger_tt:0 "$adventurer_not_famous_trigger_tt$ ou [TARGET_CHARACTER.GetShortUIName] tem que ser [contact_list_contact|E] [Select_CString( CHARACTER.IsFemale, 'da', 'do' )] [CHARACTER.GetShortUIName]"
 adventurer_not_famous_trigger_tt:0 "Seu [prestige_level|E] deve ser pelo menos [GetPrestigeLevelName( '(int32)$VALUE|q$' )]"
 any_character_task_contract:0 "Qualquer [GetPlayer.Custom('GetContractOrIssue')]:"
 complete_task_contract:0 "Viajar para Completar um Contrato"
 complete_task_contract_interaction:0 "Viajar para Completar um Contrato"
 contract_event_prefix:0 "Contrato:"
 cultural_acceptance_laamp_cultural_minority_contract:0 "Os esforços de [adventurer|E] permitiram uma [obligation|E] de [GetSubjectContractType( 'title_revocation_rights' ).GetObligationName( 'title_revocation_rights_protected' )] contra um senhor feudal estrangeiro"
 ep3_contract_event.0001.animal:0 "[task_contract_employer.Custom('CatOrDogStoryName')] viajará em um travesseiro de cetim."
 ep3_contract_event.0001.artifact:0 "Cuidarei bem deste artefato."
 ep3_contract_event.0001.child:0 "[task_contract_object.GetNameNoTooltip] será bem cuidado."
 ep3_contract_event.0001.construction:0 "Entregarei os materiais imediatamente."
 ep3_contract_event.0001.desc:0 "Uma delegação de [task_contract_employer.GetName] entra pela abertura da minha grande tenda.\n\n\"Saudações, aventureiro!\" fala um enviado. \"Muitos são os caminhos deste mundo, e traiçoeiros: se você trabalhar para [task_contract_employer.GetPrimaryTitle.GetNameNoTier], meu senhor feudal pagará bem por sua experiência.\"\n\n"
 ep3_contract_event.0001.desc_animal:0 "\"[task_contract_employer.Custom('CatOrDogStoryName')], um animal de estimação muito precioso d[Select_CString( task_contract_employer.IsFemale, 'a', 'o' )] [task_contract_employer.GetTitleAsNameNoTooltip], tocou o coração d[Select_CString( task_contract_target.IsFemale, 'a', 'o' )] [task_contract_target.GetTitledFirstName]. Assim, meu senhor feudal gentilmente concordou em enviar a criatura para [task_contract_destination.GetTitle.GetNameNoTier]. Posso confiar a você a segurança do doce [task_contract_employer.Custom('CatOrDogStoryName')]?\""
 ep3_contract_event.0001.desc_artifact:0 "\"Seu precioso [escorted_artifact.GetName] será confiado a você. Leve-o até [task_contract_destination.GetTitle.GetName], onde [task_contract_target.GetTitledFirstName] se encontra, pois [escorted_artifact.GetNameNoTooltip] é prometido como um presente régio. E esteja avisado! Se este tesouro sagrado não encontrar seu caminho, as consequências serão graves.\""
 ep3_contract_event.0001.desc_capitals:0 "\"Viajantes se encantam com [task_contract_destination.GetCounty.GetTitle.GetHolder.GetPrimaryTitle.GetDefinitiveName] como tendo uma capital grandiosa e de grande beleza, talvez a mais fina de todas as terras ao redor.\""
 ep3_contract_event.0001.desc_child:0 "\"Proteja [task_contract_object.Custom2('MyCharacterIntroduction', task_contract_employer)]!\" ordenou [Select_CString( task_contract_employer.IsFemale, 'a', 'o' )] [task_contract_employer.GetTitleAsNameNoTooltip]. A [task_contract_object.Custom('GirlBoy')] terá uma educação como nenhuma outra em [task_contract_destination.GetTitle.GetNameNoTier], onde [Select_CString( task_contract_target.IsFemale, 'a sábia', 'o sábio' )] [task_contract_target.GetTitledFirstName] aguarda [task_contract_object.GetSheHe]. Mantenha esta criança ao seu lado: o destino dela é de grande importância para o futuro de [task_contract_employer.GetPrimaryTitle.GetNameNoTierNoTooltip]!\""
 ep3_contract_event.0001.desc_construction:0 "\"[Select_CString( task_contract_employer.IsFemale, 'A', 'O' )] [task_contract_employer.GetTitleAsNameNoTooltip] está construindo um [task_contract_destination.GetHolding.GetConstructingHoldingType.GetName] em [task_contract_destination.GetTitle.GetNameNoTier] e espera uma entrega de madeira e pedra. Quando você chegar ao local da construção, podemos negociar mais obrigações.\""
 ep3_contract_event.0001.desc_explorer:0 "\"Por favor, leve-me até [task_contract_destination.GetTitle.GetName]. Proteja-me no caminho e eu o recompensarei generosamente com moedas!\""
 ep3_contract_event.0001.desc_explorer_intro:0 "\"Ouvi dizer que o [task_contract_destination.GetHolding.GetSpecialBuildingType.GetName]"
 ep3_contract_event.0001.desc_gold:0 "\"Carregamos conosco um poderoso baú de joias, perfumes e metais preciosos. Você deve levar isso até [task_contract_destination.GetTitle.GetNameNoTier] e apresentá-lo, com grande cerimônia, [Select_CString( task_contract_target.IsFemale, 'a', 'o' )] [task_contract_target.GetTitledFirstName]. Um presente verdadeiramente luxuoso, que colocará [Select_CString( task_contract_target.IsFemale, 'a', 'o' )] [task_contract_target.GetTitleAsNameNoTooltip] profundamente na dívida de meu senhor feudal: deve ser guardado com muito cuidado.\""
 ep3_contract_event.0001.desc_grand_city:0 "\"Desejo visitar uma grande cidade, um paraíso urbano de cidadãos orgulhosos, ruas largas e mercados movimentados.\""
 ep3_contract_event.0001.desc_intro_explorer:0 "Deixando sua mula carregada resfolegando do lado de fora, [task_contract_employer.GetName] é conduzido para minha tenda.\n\n\"Saudações! Dizem que você é um [ROOT.Char.GetWomanMan] do mundo: talvez alguém com coragem suficiente para aventurar-se ao lado de um explorador sempre curioso como eu?\"\n\n"
 ep3_contract_event.0001.desc_lighthouse_of_alexandria:0 "\"Que farol mais orgulhoso vigia sobre o Mediterrâneo do que o $TRAVEL_POINT_OF_INTEREST_TT_poi_lighthouse_of_alexandria$? Desejo contemplar seu brilho elevado com meus próprios olhos.\""
 ep3_contract_event.0001.desc_mausoleum_at_halicarnassus:0 "\"Diz-se que o $TRAVEL_POINT_OF_INTEREST_TT_poi_mausoleum_at_halicarnassus$ é um épico monumental a um dos governantes do passado, algo como nada construído por aqueles de nosso tempo...\""
 ep3_contract_event.0001.desc_natural_feature:0 "$ep3_contract_event.0001.desc_explorer_intro$ está entre as mais finas criações de [task_contract_employer.GetFaith.HighGodName], uma visão verdadeiramente deslumbrante."
 ep3_contract_event.0001.desc_special_buildings_diplomatic:0 "$ep3_contract_event.0001.desc_explorer_intro$ é um lugar histórico de poder, onde se deve aproximar apenas com reverência e decoro."
 ep3_contract_event.0001.desc_special_buildings_economic:0 "$ep3_contract_event.0001.desc_explorer_intro$ é uma fonte de grandes riquezas, conhecida entre os mercadores de todas as terras."
 ep3_contract_event.0001.desc_special_buildings_learning:0 "$ep3_contract_event.0001.desc_explorer_intro$ é um grande centro de aprendizado e repositório de conhecimento."
 ep3_contract_event.0001.desc_special_buildings_martial:0 "$ep3_contract_event.0001.desc_explorer_intro$ é um poderoso testemunho das glórias marciais do passado."
 ep3_contract_event.0001.desc_special_buildings_religious:0 "$ep3_contract_event.0001.desc_explorer_intro$ é um daqueles raros lugares onde os visitantes realmente desfrutam da presença do divino."
 ep3_contract_event.0001.desc_special_buildings_wonder:0 "$ep3_contract_event.0001.desc_explorer_intro$ é uma verdadeira maravilha — uma visão que alguns falam como mágica."
 ep3_contract_event.0001.desc_vip:0 "\"Eu, [task_contract_object.GetName], [Select_CString( task_contract_object.IsFemale, 'sou uma servidora', 'sou um servidor' )] muito leal [Select_CString( task_contract_employer.IsFemale, 'da', 'do' )] [task_contract_employer.GetTitleAsNameNoTooltip]. São as palavras [task_contract_employer.GetHerHim] que devo levar a [task_contract_destination.GetTitle.GetNameNoTier], para o salão d[Select_CString( task_contract_target.IsFemale, 'a', 'o' )] [task_contract_target.GetTitledFirstName]. Guie-me, proteja-me e confie que minha missiva não cairá nas mãos curiosas!\""
 ep3_contract_event.0001.explorer:0 "[task_contract_destination.GetNameNoTooltip], que grandioso! Vamos!"
 ep3_contract_event.0001.gold:0 "Viajaré com este baú sempre à vista."
 ep3_contract_event.0001.invalidate:0 "Não quero este contrato."
 ep3_contract_event.0001.t:0 "Contrato de Transporte:"
 ep3_contract_event.0001.t_animal:0 "$ep3_contract_event.0001.t$ $laamp_transport_animal_contract$"
 ep3_contract_event.0001.t_artifact:0 "$ep3_contract_event.0001.t$ $laamp_transport_artifact_contract$"
 ep3_contract_event.0001.t_child:0 "$ep3_contract_event.0001.t$ $laamp_transport_ward_contract$"
 ep3_contract_event.0001.t_construction:0 "$ep3_contract_event.0001.t$ $laamp_construction_contract_contract$"
 ep3_contract_event.0001.t_explorer:0 "$ep3_contract_event.0001.t$ $laamp_transport_explorer_contract$"
 ep3_contract_event.0001.t_gold:0 "$ep3_contract_event.0001.t$ $laamp_transport_gold_contract$"
 ep3_contract_event.0001.t_vip:0 "$ep3_contract_event.0001.t$ $laamp_transport_vip_contract$"
 ep3_contract_event.0001.tt_animal:0 "Você [Concept('travel', 'viajará')|E] para [task_contract_target.GetName] escortando [task_contract_employer.Custom('CatOrDogStoryName')]"
 ep3_contract_event.0001.tt_artifact:0 "Você [Concept('travel', 'viajará')|E] para [task_contract_destination.GetName] e presenteará [escorted_artifact.GetNameNoTooltip] [Select_CString( task_contract_employer.IsFemale, 'da', 'do' )] [task_contract_employer.GetName] a [task_contract_target.GetName]."
 ep3_contract_event.0001.tt_construction:0 "Você [Concept('travel', 'viajará')|E] para [task_contract_destination.GetName] e entregará materiais de construção a [task_contract_employer.GetName]."
 ep3_contract_event.0001.tt_explorer:0 "Você [Concept('travel', 'viajará')|E] para [task_contract_destination.GetName] ao lado do explorador, [task_contract_object.GetName]."
 ep3_contract_event.0001.tt_gold:0 "Você [Concept('travel', 'viajará')|E] para [task_contract_destination.GetName], entregando o presente [Select_CString( task_contract_employer.IsFemale, 'da', 'do' )] [task_contract_employer.GetName] a [task_contract_target.GetName]."
 ep3_contract_event.0001.tt_increase_control:0 "Você [Concept('travel', 'viajará')|E] para um [county|E] [task_contract_councillor_liege.GetPrimaryTitle.GetAdjective] com [county_corruption|E] ou baixo [county_control|E]."
 ep3_contract_event.0001.tt_vip:0 "Você [Concept('travel', 'viajará')|E] para [task_contract_destination.GetName] escortando [task_contract_object.GetName] até a corte de [task_contract_target.GetName]."
 ep3_contract_event.0001.tt_ward:0 "Você [Concept('travel', 'viajará')|E] para [task_contract_destination.GetName] garantindo que [task_contract_object.GetName] comece sua educação."
 ep3_contract_event.0001.vip:0 "[task_contract_object.GetTitledFirstNameNoTooltip] viajará com segurança e rapidez!"
 ep3_contract_event.0001.with_domicile.tt:0 "Mover seu [camp|E] para [task_contract_destination.GetNameNoTooltip] custará [provisions_i][provisions|E]"
 ep3_contract_event.0001.with_domicile:0 "Todo o meu acampamento viajará para [task_contract_destination.GetNameNoTooltip]."
 ep3_contract_event.0003.a:0 "Levante as bandeiras! Marchamos imediatamente!"
 ep3_contract_event.0003.b:0 "$ep3_contract_event.0001.invalidate$"
 ep3_contract_event.0003.desc:0 "$ep3_contract_event.0001.desc$ seu inimigo jurado, [Select_CString( task_contract_target.IsFemale, 'a', 'o' )] [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.GetName], tem sido uma ameaça ultimamente. Meu senhor feudal gostaria que você o colocasse em seu lugar, capturando seus homens."
 ep3_contract_event.0003.t:0 "$contract_event_prefix$ Incursão por Cativos"
 ep3_contract_event.0004.a:0 "É melhor eu não perguntar o que [task_contract_employer.GetSheHe] fará com eles."
 ep3_contract_event.0004.b:0 "Eu apenas tive azar..."
 ep3_contract_event.0004.desc:0 "Seus esforços firmes na minha guerra são muito apreciados! Aproveite seu bem merecido ouro, meu bom [ROOT.Char.GetWomanMan]!"
 ep3_contract_event.0004.desc_failure:0 "Sua reputação marcial foi muito exagerada. Você quebrou seu contrato comigo — deveria ter vergonha de si mesmo!"
 ep3_contract_event.0004.opening:0 "[task_contract_employer.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 ep3_contract_event.0004.opening_failure:0 "[task_contract_employer.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 ep3_contract_event.0004.success:0 "Os cativos foram transportados para [prison|E] [Select_CString( task_contract_employer.IsFemale, 'da', 'do' )] [task_contract_employer.GetName]:"
 ep3_contract_event.0005.a:0 "É melhor eu escolher um lugar já!"
 ep3_contract_event.0005.a_tt:0 "Abre a [decision|E] $treasure_hunting_contract_decision$"
 ep3_contract_event.0005.b:0 "$ep3_contract_event.0001.invalidate$"
 ep3_contract_event.0005.desc:0 "$ep3_contract_event.0001.desc$ [task_contract_employer.GetNameNoTooltip] tem uma grande visão de reunir uma variedade de artesanato de lugares exóticos. No entanto, seus deveres não podem ser adiados, portanto [task_contract_employer.GetSheHe] oferece a você a oportunidade de procurar o mundo em busca de um artefato adequado para a coleção [task_contract_employer.GetHerHim]."
 ep3_contract_event.0005.t:0 "$contract_event_prefix$ $laamp_treasure_hunting_contract_contract$"
 ep3_contract_event.0006.buy:0 "\"Posso pagar, generosamente!\""
 ep3_contract_event.0006.buy_lost:0 "$ep3_contract_event.0006.city_lost$"
 ep3_contract_event.0006.buy_lost_desc:0 "$ep3_contract_event.0006.city_lost_desc$"
 ep3_contract_event.0006.buy_won:0 "Você faz uma oferta convincente e compra o item."
 ep3_contract_event.0006.castle:0 "\"Com licença, mas talvez possamos unir forças?\""
 ep3_contract_event.0006.castle_lost:0 "[local_1.GetShortUIName] Pega o Artefato"
 ep3_contract_event.0006.castle_lost_desc:0 "[local_1.GetTitledFirstNameNoTooltip] te engana e escapa com o [newly_created_artifact.GetNameNoTooltip]"
 ep3_contract_event.0006.castle_won:0 "Você recupera o item com sucesso."
 ep3_contract_event.0006.church:0 "\"Sou digno, vou provar isso!\""
 ep3_contract_event.0006.church_lost:0 "[local_1.GetShortUIName] Te Considera Ímpio."
 ep3_contract_event.0006.church_lost_desc:0 "[local_1.GetTitledFirstNameNoTooltip] não está convencido de que você é piedoso o suficiente."
 ep3_contract_event.0006.church_won:0 "Você prova seu zelo e recupera o item."
 ep3_contract_event.0006.city:0 "\"Baixe o preço e temos um acordo!\""
 ep3_contract_event.0006.city_lost:0 "[local_1.GetShortUIName] Rejeita a Oferta."
 ep3_contract_event.0006.city_lost_desc:0 "[local_1.GetTitledFirstNameNoTooltip] não quer mais vender para você."
 ep3_contract_event.0006.city_won:0 "Você convence [local_1.GetShortUIName] a baixar o preço."
 ep3_contract_event.0006.desc:0 "Chego em [task_contract_destination.GetName], visitando a [task_contract_destination.Custom('GetGuildType')] local em busca de pistas sobre curiosidades na área... mas sem sorte. Eu paro na"
 ep3_contract_event.0006.desc_locals:0 "taverna, onde escuto uma conversa intrigante entre dois fofoqueiros.\n\n\"Eu te digo, [local_2.GetFirstName]: o [newly_created_artifact.GetName] está escondido em nosso [task_contract_destination.GetTerrain.GetNameNoTooltip|l]! E eu sei onde ele está!\" sussurra um dos [local_1.GetCulture.GetCollectiveNounNoTooltip].\n\n\"Silêncio, [local_1.GetFirstName]. Temos olhos em nós...\" sibila o outro, gesticulando para mim."
 ep3_contract_event.0006.desc_locals_castle:0 "portões do [task_contract_destination.GetHolding.GetType.GetName|l], onde noto um par de locais.\n\n\"Não estou te enganando, [local_2.GetFirstName]! A família [local_ruler.GetDynastyHouseName] adquiriu o [newly_created_artifact.GetName]! Eu acabei de vê-los carregar para dentro do [local_ruler.Custom('ResidenceBuilding')],\" fala o primeiro [local_1.GetCulture.GetNameNoTooltip].\n\n\"Não será fácil, [local_1.GetFirstName]... mas talvez #EMP possamos conseguir isso!\" responde o segundo, com um brilho nos olhos [local_2.GetHerHim]."
 ep3_contract_event.0006.desc_locals_city:0 "mercado, onde sou agarrado por um vendedor bem na entrada.\n\n\"Saudações, viajante! Ah, você parece ser um comerciante experiente. Acontece que eu tenho tudo o que você precisa, da cabeça aos pés, do traseiro ao cotovelo! Posso te interessar por um item especial... um [newly_created_artifact.GetName]?\""
 ep3_contract_event.0006.desc_locals_temple:0 "[task_contract_destination.Custom('GetLocationFaithTemple')].\n\n\"Bem-vindo, viajante!\" cumprimenta o [local_1.GetFaith.PriestNeuter] local. \"A palavra é que você busca tesouros terrenos. Bem... eu posso ter algo para lhe contar sobre o [newly_created_artifact.GetName].\"\n\n\"Mas somente se você conhece o favor de [local_1.GetFaith.WealthGodName]...\""
 ep3_contract_event.0006.explore.tt:0 "$ep3_contract_event.0006.library.tt$"
 ep3_contract_event.0006.explore:0 "Estou melhor sozinho. Pelo menos agora sei que tesouros podem ser encontrados aqui."
 ep3_contract_event.0006.explore_lost:0 "Você Não Consegue Encontrar Nada."
 ep3_contract_event.0006.explore_lost_desc:0 "Você não consegue encontrar nenhuma pista de artefatos sozinho e sai de mãos vazias."
 ep3_contract_event.0006.explore_won:0 "$ep3_contract_event.0006.library_won$"
 ep3_contract_event.0006.intimidate:0 "\"Dê isso para mim, #EMP AGORA!#!\""
 ep3_contract_event.0006.intimidate_lost:0 "[local_1.GetShortUIName] Não Tem Medo de Você."
 ep3_contract_event.0006.intimidate_lost_desc:0 "[local_1.GetTitledFirstNameNoTooltip] mantém o artefato."
 ep3_contract_event.0006.intimidate_won:0 "Você intimida [local_1.GetTitledFirstNameNoTooltip] a entregar o item."
 ep3_contract_event.0006.library.tt:0 "Você se tornará o proprietário de um [artifact|E] diferente."
 ep3_contract_event.0006.library:0 "Vou procurar em outro lugar. Deve haver algo!"
 ep3_contract_event.0006.library_lost:0 "Você Sai de Mãos Vazias."
 ep3_contract_event.0006.library_lost_desc:0 "Você não consegue encontrar nada útil e sai de mãos vazias."
 ep3_contract_event.0006.library_won:0 "Você procura por um artefato diferente."
 ep3_contract_event.0006.t:0 "$ep3_contract_event.0005.t$"
 ep3_contract_event.0007.a:0 "Por que eu não iria pegar para mim mesm[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]?"
 ep3_contract_event.0007.b:0 "Perfeito! Envie para [task_contract_employer.GetTitledFirstNameNoTooltip]."
 ep3_contract_event.0007.castle:0 "\"Espere, não é bem assim. Eu ainda estou com você!\""
 ep3_contract_event.0007.castle_buy:0 "\"Concordo, mas apenas se você se juntar a mim.\""
 ep3_contract_event.0007.city_city:0 "Levarei tudo."
 ep3_contract_event.0007.desc_castle_buy:0 "[local_1.GetFirstName] e [local_2.GetFirstName] debatem entre si por um tempo.\n\n\"É um grande risco que estamos assumindo... mas uma oferta generosa também. Você pode ter nosso prêmio, #EMP se#! conseguirmos pegá-lo.\"\n\nNaquela noite, vou ao local de encontro fora do castelo e ouço uma grande comoção atrás da parede. [local_1.GetFirstNameNoTooltip] e [local_2.GetFirstNameNoTooltip] descem as pedras acima de mim.\n\n\"Corra! Temos companhia!\" grita [local_1.GetFirstNameNoTooltip], enquanto [local_1.GetSheHe] passa por mim. Corremos para o [task_contract_destination.GetTerrain.GetName|l], até chegarmos a um lugar seguro.\n\n\"Acho que você nos deve o dobro,\" diz [local_2.GetFirstNameNoTooltip], ainda tentando recuperar o fôlego."
 ep3_contract_event.0007.desc_castle_castle:0 "Atacamos à meia-noite. Sob o céu negro da noite, entramos no [task_contract_destination.GetHolding.GetType.GetName|l] sem ser notados. Graças à orientação [Select_CString( local_1.IsFemale, 'da', 'do' )] [local_1.GetFirstName], encontramos rapidamente o [newly_created_artifact.GetName]. No entanto — no caminho de saída — os sentinelas nos avistam! Eu pego o artefato e corro, enquanto os guardas saem de todos os cantos. Meus cúmplices e eu somos separados.\n\nApós uma longa perseguição, acabo nas sombras atrás das paredes. Posso ouvir a voz ofegante de [local_2.GetFirstName] à distância:\n\n\"[ROOT.Char.GetSheHe|U] roubou o que nos pertencia por direito. Aquele vilão!\""
 ep3_contract_event.0007.desc_castle_intimidate:0 "\"Quem você pensa que é?\" zomba [local_1.GetFirstName], com arrogância. \"Estamos em maior número do que você!\"\n\n\"Tem certeza disso?\" eu respondo, sinalizando para meus homens cercá-los. \"Agora, por favor... me tragam o [newly_created_artifact.GetName].\"\n\nNos encontramos novamente na noite seguinte. [local_1.GetFirstNameNoTooltip] e [local_2.GetFirstName] parecem cansados e derrotados.\n\n\"Quase fomos pegos lá atrás. Espero que esse artefato signifique muito para você!\" diz um, entregando-me o prêmio com uma expressão de dor."
 ep3_contract_event.0007.desc_church_buy:0 "\"Sou um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] de [ROOT.Char.GetFaith.HighGodName] e apenas [ROOT.Char.GetFaith.HighGodName] pode me julgar!\" eu grito, contra-atacando forçosamente [Select_CString( local_1.IsFemale, 'a', 'o' )] [local_1.GetFaith.PriestNeuter]. \"Mas eu ofereço a você um benefício imediato: moedas!\"\n\n\"Você realmente está tentando subornar um[Select_CString( local_1.IsFemale, 'a', '' )] serv[Select_CString( local_1.IsFemale, 'a', 'o' )] de [local_1.GetFaith.HighGodName]...?\" responde [local_1.GetFirstName], ofendido(a à primeira vista, mas quanto mais [local_1.GetSheHe] olha para o saco de prata, mais irresistível parece.\n\n\"Nós #EMP precisamos#! reparar o telhado do [task_contract_destination.Custom('GetLocationFaithTemple')]. Leve o [newly_created_artifact.GetName] e nunca fale sobre nossos negócios!\""
 ep3_contract_event.0007.desc_church_church:0 "Eu caio de joelhos e começo a recitar versos do [local_1.GetFaith.ReligiousText].\n\n\"Eu vi e ouvi o suficiente. Você é, sem dúvida, um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] de [local_1.GetFaith.HighGodName]!\" elogia [local_1.GetName], claramente impressionad[Select_CString( local_1.IsFemale, 'a', 'o' )]. \"Você não precisa procurar mais. Eu concedo a você o [newly_created_artifact.GetName]. Cuide bem dele, pois é um presente não apenas meu, mas de [local_1.GetFaith.HighGodName]!\""
 ep3_contract_event.0007.desc_church_intimidate:0 "\"[follower.GetFirstName]! Temos um teimoso aqui!\" eu chamo meus seguidores. Eles invadem o [task_contract_destination.Custom('GetLocationFaithTemple')].\n\n\"Por favor, mostre algum respeito! Fique longe!\" suplica [local_1.GetFirstName]. Mas é tarde demais. Meus companheiros são soltos, levando as ofertas, prestes a roubar e destruir tudo que podem. Claramente superad[Select_CString( local_1.IsFemale, 'a', 'o' )] e em menor número, [local_1.GetNameNoTooltip] se entrega.\n\n\"Tudo bem, tudo bem! Leve o [newly_created_artifact.GetName], vocês hereges! Mas poupem este lugar sagrado.\""
 ep3_contract_event.0007.desc_city_buy:0 "\"Que oferta generosa! Por favor, leve o [newly_created_artifact.GetName]! Foi um prazer fazer negócios com você!\" [local_1.GetFirstName] parece estar sobrecarregad[Select_CString( local_1.IsFemale, 'a', 'o' )] pela minha oferta.\n\nTalvez eu pudesse ter negociado um preço melhor...? Da próxima vez, preciso ser mais paciente..."
 ep3_contract_event.0007.desc_city_city:0 "\"Seus preços são altos... e eu sou apenas um pobre vagabundo,\" eu tento negociar. \"Eu preciso pagar meus homens e alimentar nossos cavalos. Aqui — é tudo que posso pagar. Podemos fazer um acordo?\"\n\n[local_1.GetFirstName] não parece acreditar em mim, mas [local_1.GetSheHe] é um[Select_CString( local_1.IsFemale, 'a', '' )] negociador[Select_CString( local_1.IsFemale, 'a', '' )] experiente e, portanto, [local_1.GetSheHe] rapidamente faz uma contraproposta. \"Eu aceitarei isso, sim. Mas preciso te mostrar isso primeiro.\" [local_1.GetSheHe|U] revela um [newly_created_artifact.GetName]. \"Olhe para essa #EMP beleza!#! Uma oferta limitada, só para você. Estou dispost[Select_CString( local_1.IsFemale, 'a', 'o' )] a vender ambos, por um preço razoável!\""
 ep3_contract_event.0007.desc_city_intimidate:0 "Eu sinalizo para meus seguidores invadirem a loja do vendedor, onde rapidamente superamos o único comerciante.\n\n\"Por favor, sou apenas um[Select_CString( local_1.IsFemale, 'a', '' )] balconista! Tenho uma família para alimentar e esta loja é tudo que possuo!\" implora [local_1.GetFirstName].\n\n\"[follower.GetFirstName], mostre a [local_1.GetSheHe] que não estamos brincando!\" eu instruo meu capanga de escolha, e [follower.GetSheHe] alcança uma prateleira precária cheia de itens delicados. Justo quando [follower.GetSheHe] está prestes a derrubar o balcão, o vendedor se joga na frente [follower.GetHerHim].\n\n\"Eu imploro, pare! Apenas leve o que quiser e vá!\""
 ep3_contract_event.0007.desc_explore:0 "Em vez de depender daquel[Select_CString( local_1.IsFemale, 'a', 'e' )] [local_1.GetFirstName] tagarela e de algumas rumores estranhos, decido voltar a um edifício aparentemente abandonado.\n\nPrimeiro, cortamos através dos jardins cobertos de mato; depois, suportamos o fedor mofado de seus cômodos. Podemos ter certeza, pelo menos, que o lugar está deserto. Para cobrir o terreno o mais rápido possível, meus companheiros se separam. Depois de algum tempo, [follower.GetFirstName] me chama para o quarto principal:\n\n\"Isso estava debaixo da cama,\" diz [follower.GetSheHe], apontando para um baú enferrujado. \"Cheio de moedas! E isso pode ser — um [newly_created_artifact.GetName]?\""
 ep3_contract_event.0007.desc_library:0 "\"Obrigado pela oferta, mas talvez você saiba onde posso encontrar uma propriedade abandonada ou um forte desativado...?\" eu pergunto, logo convencendo [local_1.GetFirstName] a me direcionar relutantemente a uma sala em ruínas.\n\nAssim que entro, fico completamente impressionad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com a quantidade de velhos tomos espalhados pelos cômodos empoeirados. Passo a noite toda revirando esses livros. Então, enterrada bem no fundo do porão, descubro um mapa manuscrito — nele, um 'X' marca um ponto próximo!\n\nMeus homens e eu chegamos lá ao amanhecer. Algumas picadas de pá de depois, [follower.GetFirstName] me chama.\n\n\"Um baú! Está cheio de moedas! E, o que é isso? Uma nota o chama de \"[newly_created_artifact.GetName].\""
 ep3_contract_event.0007.t:0 "$ep3_contract_event.0005.t$"
 ep3_contract_event.0008.a:0 "Parece uma causa justa! Eu ajudarei [task_contract_employer.GetSheHe]."
 ep3_contract_event.0008.b:0 "$ep3_contract_event.0001.invalidate$"
 ep3_contract_event.0008.desc:0 "Um pequeno grupo de cavaleiros cansados para em meu acampamento, e um desses visitantes entra na minha grande tenda.\n\n\"Sou o capitão desses [task_contract_employer.GetPrimaryTitle.GetAdjective] batedores, e falo [Select_CString( task_contract_employer.IsFemale, 'pela nossa', 'pelo nosso' )] [task_contract_employer.GetTitledFirstName],\" começa o soldado. \"Meu senhor está interessado em seu pequeno bando de lutadores.\n\n\"Um [task_contract_war.Custom('WarCasusBelliShort')] causa [Select_CString( task_contract_employer.IsFemale, 'a', 'ao' )] [task_contract_employer.GetTitleAsNameNoTooltip] noites sem sono. Nosso inimigo está oferecendo uma luta feroz — e eu fui enviado para contratar suas espadas! Você emprestará [task_contract_employer.GetPrimaryTitle.GetNameNoTierNoTooltip] seu espírito de luta?\""
 ep3_contract_event.0008.t:0 "$contract_event_prefix$ $laamp_join_war_contract_contract$"
 ep3_contract_event.0009.a:0 "Inteligente! Ninguém jamais suspeitará #EMP de mim#!."
 ep3_contract_event.0009.b:0 "$ep3_contract_event.0001.invalidate$"
 ep3_contract_event.0009.desc:0 "$ep3_contract_event.0001.desc$[task_contract_employer.GetTitledFirstNameNoTooltip] é o legítimo proprietário do [task_contract_object.GetName], que [Select_CString( task_contract_target.IsFemale, 'a', 'o' )] [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.GetName] mantém como refém. Meu senhor deseja que você o recupere — por quaisquer meios necessários!"
 ep3_contract_event.0009.open_start_stealing_back_artifact:0 "Abre [character_interaction|E] para começar o [scheme|E] de [GetScheme('steal_back_artifact').GetTypeName]"
 ep3_contract_event.0009.t:0 "$contract_event_prefix$ $laamp_steal_artifact_contract_contract$"
 ep3_contract_event.0011.a:0 "\"Eu mudarei meu acampamento para [task_contract_destination.GetNameNoTooltip] com prazer.\""
 ep3_contract_event.0011.b:0 "\"Eu adoraria se [task_contract_object.GetTitledFirstNameNoTooltip] se juntasse a nós permanentemente.\""
 ep3_contract_event.0011.c:0 "\"Talvez isso mude sua mente?\""
 ep3_contract_event.0011.construction_invalidation:0 "\"@warning_icon! #X Se a localização do [camp|E] mudar, o modificador será removido e o [task_contract|E] será invalidado.#!\""
 ep3_contract_event.0011.construction_reward:0 "\"Se você mantiver seu [camp|E] em [task_contract_destination.GetName] até a construção ser concluída, o [task_contract|E] será #P concluído com sucesso#!:"
 ep3_contract_event.0011.d_continue:0 "\"Eu deveria continuar minha jornada.\""
 ep3_contract_event.0011.d_end:0 "\"Eu deveria voltar para meu acampamento.\""
 ep3_contract_event.0011.desc:0 "Sou levad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] diante d[Select_CString( task_contract_target.IsFemale, 'a', 'o' )] [Select_CString( task_contract_target.IsFemale, 'própria', 'próprio' )] [task_contract_target.GetTitledFirstName].\n\n\"Você veio a [Select_CString( task_contract_employer.IsFemale, 'minha', 'meu' )] [task_contract_target.Custom2('RelationToMeShort',task_contract_employer)] a pedido d[Select_CString( task_contract_employer.IsFemale, 'a', 'o' )] [task_contract_employer.GetTitledFirstName], não? Para que negócio?\"\n\n"
 ep3_contract_event.0011.desc_animal_cat:0 "\"$ep3_contract_event.0011.desc$[task_contract_target.Custom('CatStoryName')] espreita de uma câmara funerária. Ao notar [task_contract_target.GetTitledFirstNameNoTooltip], o gato começa a ronronar.\""
 ep3_contract_event.0011.desc_animal_cat_hate:0 "\"$ep3_contract_event.0011.desc_animal_cat$\n\n\"\"É um gato!? Tire esse pequeno demônio esfarrapado daqui! Oh, como minha cabeça já dói! Como meu nariz está prestes a explodir!\""
 ep3_contract_event.0011.desc_animal_cat_love:0 "\"$ep3_contract_event.0011.desc_animal_cat$\n\n\"\"Oh, é [task_contract_target.Custom('CatStoryName')]? [task_contract_employer.GetTitledFirstNameNoTooltip] é simplesmente generoso demais! Por sua parte nisso, viajante, você pode permanecer aqui o tempo que desejar.\""
 ep3_contract_event.0011.desc_animal_dog:0 "\"$ep3_contract_event.0011.desc$Eu mal consigo segurar [task_contract_target.Custom('DogStoryName')]. Escapando de sua coleira, o cachorro se lança sobre [task_contract_target.GetTitledFirstNameNoTooltip], derrubando [task_contract_target.GetSheHe] e lambendo o rosto [task_contract_target.GetHerHim].\""
 ep3_contract_event.0011.desc_animal_dog_hate:0 "\"$ep3_contract_event.0011.desc_animal_dog$\n\n\"\"Afaste esse cão imundo de mim! O cheiro dele — realmente vilt! Que [task_contract_employer.GetTitledFirstNameNoTooltip] maldiga meu salão com essa besta!\""
 ep3_contract_event.0011.desc_animal_dog_love:0 "\"$ep3_contract_event.0011.desc_animal_dog$\n\n\"\"Que alegria você me dá! Obrigado, viajante. Você abençoou meu reino com esta criatura e é bem-vindo para ficar aqui o tempo que desejar.\""
 ep3_contract_event.0011.desc_artifact:0 "$ep3_contract_event.0011.desc$Eu trago o [escorted_artifact.GetName], para a admiração da corte.\n\n\"Um excelente presente!\" exclama [Select_CString( task_contract_target.IsFemale, 'a', 'o' )] [task_contract_target.GetTitleAsNameNoTooltip]. \"Você se saiu bem, aventureir[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. Você pode permanecer e desfrutar dos prazeres de [task_contract_destination.GetName].\""
 ep3_contract_event.0011.desc_construction:0 "\"Eu olho para o canteiro de obras em [task_contract_destination.GetName]. Enquanto trabalhadores descarregam meus materiais adquiridos, sou abordado por [task_contract_employer.GetName] [task_contract_employer.GetHerselfHimself].\n\n\"\"Uma entrega oportuna, [ROOT.Char.GetTitleAsName]!\"\" fala [Select_CString( task_contract_employer.IsFemale, 'a', 'o' )] [task_contract_employer.GetTitleTierName]. \"\"No entanto, como você pode ver, ainda levará algo como [task_contract_destination.GetHolding.GetConstructionTimeLeft] para terminar o [task_contract_destination.GetHolding.GetConstructingHoldingType.GetName]. Preciso de mais mão de obra para concluir isso.\"\n\n\"\"Você ficará em [task_contract_destination.GetNameNoTooltip] e emprestará a força de seu povo ao trabalho dos meus trabalhadores?\""
 ep3_contract_event.0011.desc_explorer:0 "\"\n\n\"\"Eu não tinha certeza se conseguiria chegar!\"\" gaspa [task_contract_object.GetName]. \"\"Mas você tem sido um guia constante em todos os perigos! Obrigado. Seu pagamento está bem merecido. E, você deve admitir — [task_contract_destination.GetNameNoTooltip] é surpreendente!\""
 ep3_contract_event.0011.desc_explorer_building:0 "\"Estamos em [task_contract_destination.GetName] e, finalmente, nosso destino se encontra diante de nós. Aproximamo-nos do [task_contract_destination.GetHolding.GetSpecialBuildingType.GetName]$ep3_contract_event.0011.desc_explorer$\""
 ep3_contract_event.0011.desc_explorer_other:0 "\"Finalmente nos encontramos no [task_contract_destination.GetTerrain.GetName] de [task_contract_destination.GetTitle.GetName]: destino [Select_CString( task_contract_object.IsFemale, 'da', 'do' )] [task_contract_object.GetName].$ep3_contract_event.0011.desc_explorer$\""
 ep3_contract_event.0011.desc_gold:0 "\"Nobre [task_contract_target.GetName]!\"\" eu proclamo, \"\"Este baú está repleto de ouro, prata e gemas, selecionados para você do vasto tesouro de [task_contract_employer.GetName]!\"\"\n\n[task_contract_target.GetTitledFirstNameNoTooltip] salta de seu trono: \"\"Louvado seja [task_contract_target.GetFaith.HighGodName] e louvado seja [task_contract_employer.GetTitledFirstNameNoTooltip]! Poucos conheceram tamanha generosidade! Meus agradecimentos, viajante. Você é muito bem-vindo para permanecer em [task_contract_destination.GetName]... particularmente se houver moedas perdidas em seu acampamento...\""
 ep3_contract_event.0011.desc_vip:0 "$ep3_contract_event.0011.desc$[task_contract_object.GetName] avança. \"Dign[Select_CString( task_contract_target.IsFemale, 'a', 'o' )] [task_contract_target.GetTitledFirstNameNoTooltip], eu falo por [task_contract_employer.GetNameNoTooltip]! Mas a mensagem que trago é adequada apenas para seus ouvidos.\"\n\n\"Venha,\" responde [Select_CString( task_contract_target.IsFemale, 'a', 'o' )] [task_contract_target.GetTitleAsNameNoTooltip], sombriamente, \"Falaremos em meus aposentos. [ROOT.Char.GetTitledFirstNameNoTooltip], seu serviço é notado — você pode permanecer como hóspede em meu [task_contract_destination.GetHolding.GetType.GetName|l]!\""
 ep3_contract_event.0011.desc_ward:0 "$ep3_contract_event.0011.desc$Eu dou um último tapinha nas costas [Select_CString( task_contract_object.IsFemale, 'da', 'do' )] [task_contract_object.GetFirstName], conduzindo [task_contract_object.GetSheHe] para frente. \"Trouxe uma nobre juventude, merecedora de uma educação refinada.\"\n\n"
 ep3_contract_event.0011.desc_ward_accepted:0 "[task_contract_target.GetTitledFirstNameNoTooltip] aceita a reverência d[Select_CString( task_contract_object.IsFemale, 'a', 'o' )] [task_contract_object.Custom('GirlBoy')], dizendo: \"De agora em diante, [task_contract_object.Custom('GirlBoy')], serei seu tutor e guardião. E, se [ROOT.Char.GetSheHe] desejar, seu companheiro de viagem também poderá permanecer aqui por algum tempo.\""
 ep3_contract_event.0011.desc_ward_limit:0 "\"Lamento,\" responde [Select_CString( task_contract_target.IsFemale, 'a', 'o' )] [task_contract_target.GetTitleAsNameNoTooltip], \"Já estou sobrecarregad[Select_CString( task_contract_target.IsFemale, 'a', 'o' )] por uma quantidade excessiva de crianças choronas. Não há espaço em minha corte para mais um pupilo.\""
 ep3_contract_event.0011.desc_ward_too_old:0 "\"Lamento,\" responde [Select_CString( task_contract_target.IsFemale, 'a', 'o' )] [task_contract_target.GetTitleAsNameNoTooltip], avaliando a juventude diante [task_contract_target.GetHerHim], \"a estrada já fez dest[Select_CString( task_contract_object.IsFemale, 'a', 'e' )] [task_contract_object.GetWomanMan] [Select_CString( task_contract_object.IsFemale, 'uma adulta', 'um adulto' )]. Não me rebaixaria a tratar [task_contract_object.GetSheHe] como um inocente de olhos arregalados.\""
 ep3_contract_event.0011.reward:0 "\"Você completa o contrato [task_contract.GetType.GetName] e será recompensado por [task_contract_employer.GetTitledFirstNameNoTooltip]\""
 ep3_contract_event.0011.t_animal:0 "$ep3_contract_event.0001.t_animal$"
 ep3_contract_event.0011.t_artifact:0 "$ep3_contract_event.0001.t_artifact$"
 ep3_contract_event.0011.t_child:0 "$ep3_contract_event.0001.t_child$"
 ep3_contract_event.0011.t_construction:0 "$ep3_contract_event.0001.t_construction$"
 ep3_contract_event.0011.t_explorer:0 "$ep3_contract_event.0001.t_explorer$"
 ep3_contract_event.0011.t_gold:0 "$ep3_contract_event.0001.t_gold$"
 ep3_contract_event.0011.t_vip:0 "$ep3_contract_event.0001.t_vip$"
 ep3_contract_event.0012.a:0 "\"Notícias tristes, mas algumas moedas são melhores do que nenhuma moeda.\""
 ep3_contract_event.0012.b:0 "\"Não havia nada que eu pudesse fazer.\""
 ep3_contract_event.0012.c:0 "\"Vamos continuar em direção a [travel_destination.GetNameNoTooltip].\""
 ep3_contract_event.0012.desc_dead_intro:0 "\"Sua incompetência é estonteante e minha indignação é imensurável. Como você poderia deixar\""
 ep3_contract_event.0012.desc_dead_outro:0 "\"morrer? Você concordou em [ROOT.Char.Custom('GetInvalidatedContractType')]! Espero nunca mais vê-lo novamente, de uma forma ou #EMP de outra#!.\""
 ep3_contract_event.0012.desc_employer_dead:0 "\"Devo informar que [Select_CString( task_contract_employer.IsFemale, 'minha predecessora', 'meu predecessor' )], [task_contract_employer.GetTitledFirstName], está mort[Select_CString( task_contract_employer.IsFemale, 'a', 'o' )]. Como seu novo empregador, $ep3_contract_event.0012.desc_employer_dead_outro$\""
 ep3_contract_event.0012.desc_employer_dead_outro:0 "\"Eu rescindo sua obrigação: o [ROOT.Char.Custom('GetInvalidatedContractType')]. Não se preocupe; tenha um pouco de ouro como compensação.\""
 ep3_contract_event.0012.desc_escortee_dead:0 "\"$ep3_contract_event.0012.desc_dead_intro$ [task_contract_object.GetFirstName] $ep3_contract_event.0012.desc_dead_outro$\""
 ep3_contract_event.0012.desc_faction_disbanded:0 "\"As circunstâncias levaram à dissolução de nossa facção. $ep3_contract_event.0012.desc_employer_dead_outro$\""
 ep3_contract_event.0012.desc_not_vassal:0 "\"Alegre-se, pois não sou mais um vassalo d[Select_CString( task_contract_target.IsFemale, 'a', 'o' )] [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.GetName]. $ep3_contract_event.0012.desc_employer_dead_outro$\""
 ep3_contract_event.0012.desc_pet_dead:0 "\"$ep3_contract_event.0012.desc_dead_intro$ [ROOT.Char.Custom('CatOrDogStoryName')] $ep3_contract_event.0012.desc_dead_outro$\""
 ep3_contract_event.0012.desc_prisoner_free:0 "\"Devo informar que [Select_CString( task_contract_object.IsFemale, 'minha', 'meu' )] [task_contract_employer.Custom2('RelationToMeShort',task_contract_object)] [task_contract_object.GetFirstName] já saiu da prisão. Não posso ter certeza se você teve alguma participação nisso ou não, mas $ep3_contract_event.0012.desc_employer_dead_outro$\""
 ep3_contract_event.0012.desc_target_dead:0 "\"Devo informar que [Select_CString( task_contract_target.IsFemale, 'minha', 'meu' )] [task_contract_employer.Custom2('RelationToMeShort',task_contract_target)], [task_contract_target.GetTitledFirstName], está morto. Devido às circunstâncias, $ep3_contract_event.0012.desc_employer_dead_outro$\""
 ep3_contract_event.0012.desc_unlanded_employer:0 "\"e, como tal, seu [ROOT.Char.Custom('GetInvalidatedContractType')] não é mais necessário.\""
 ep3_contract_event.0012.desc_unlanded_employer_is_imprisoned:0 "\"Devo informar que não sou mais um [task_contract_employer.GetWomanMan] livre, $ep3_contract_event.0012.desc_unlanded_employer$\""
 ep3_contract_event.0012.opening:0 "\"[task_contract_employer.Custom2('AppropriateGreetingPositive', ROOT.Char)]\""
 ep3_contract_event.0012.opening_angry:0 "\"[task_contract_employer.Custom2('AppropriateGreetingNegative', ROOT.Char)]\""
 ep3_contract_event.0013.a:0 "\"Lutar lado a lado foi uma honra.\""
 ep3_contract_event.0013.b:0 "\"'O Quebrador de Juramentos' não soa tão mal assim...\""
 ep3_contract_event.0013.desc_failure:0 "\"Você deve ser conhecido como 'O Quebrador de Juramentos' por sua miserável falha em aparecer no campo de batalha!\n\nEu, que lutaria ao seu lado, agora o nomeio um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('task_contract_employer'))] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] e líder de covardes.\""
 ep3_contract_event.0013.desc_success:0 "\"Suas contribuições foram vitais para a vitória da minha guerra, e a bravura de seus mercenários é muito admirada por meus lutadores.\n\nQue este pagamento ajude você a celebrar nossa grande vitória!\""
 ep3_contract_event.0013.opening_failure:0 "\"[task_contract_employer.Custom2('AppropriateGreetingNegative', ROOT.Char)]\""
 ep3_contract_event.0013.opening_success:0 "\"[task_contract_employer.Custom2('AppropriateGreetingPositive', ROOT.Char)]\""
 ep3_contract_event.0020.a:0 "Fique tranquilo, tenho maneiras de alcançar [task_contract_target.GetSheHe]!"
 ep3_contract_event.0020.agents_diplomacy:0 "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_diplomat' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_shill' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_scribe' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_socialite' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_herald' ).GetName]"
 ep3_contract_event.0020.agents_intrigue:0 "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thug' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_shill' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_wrangler' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_socialite' ).GetName]"
 ep3_contract_event.0020.agents_learning:0 "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_bailiff' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_scribe' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_diplomat' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_theologian' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_justiciar_speed' ).GetName]"
 ep3_contract_event.0020.agents_martial:0 "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_muscle' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thug' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_bodyguard' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_footpad' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_tracker' ).GetName]"
 ep3_contract_event.0020.b:0 "Aprendi alguns truques para conquistar os [task_contract_target.GetCulture.GetCollectiveNounNoTooltip]."
 ep3_contract_event.0020.c:0 "Posso visitar [task_contract_target.GetSheHe] com meus melhores homens!"
 ep3_contract_event.0020.d:0 "Deve haver #EMP algum#! plano credível dentro da lei [task_contract_target.GetPrimaryTitle.GetAdjectiveNoTooltip]."
 ep3_contract_event.0020.desc:0 "Um grupo de [task_contract_employer.GetCulture.GetCollectiveNoun] entra no meu acampamento, desejando falar comigo.\n\n\"Saudações, aventureiro!\" começa o mais velho do grupo. \"Viemos de [task_contract_destination.GetName], uma terra próxima, onde o governo [Select_CString( task_contract_employer.IsFemale, 'da', 'do' )] [task_contract_employer.GetName] é justo, de acordo com as nobres tradições [task_contract_employer.GetCulture.GetNameNoTooltip]!\" Algumas tímidas saudações ao nome [Select_CString( task_contract_employer.IsFemale, 'da', 'do' )] [task_contract_employer.GetTitledFirstNameNoTooltip] distraem o ancião, antes que ele continue:\n\n\"No entanto, o senhor feudal [task_contract_employer.GetHerHim], [task_contract_target.GetName], é um estrangeiro e não está acostumado às nossas maneiras. Em nome [Select_CString( task_contract_employer.IsFemale, 'da', 'do' )] [task_contract_employer.GetTitledFirstNameNoTooltip], suplicamos; ajude-nos a garantir nossa liberdade cultural sob o reinado [Select_CString( task_contract_target.IsFemale, 'da', 'do' )] [task_contract_target.GetTitleAsName]!\""
 ep3_contract_event.0020.e:0 "Vamos ver se consigo convencer um [task_contract_target.GetCulture.GetNameNoTooltip]."
 ep3_contract_event.0020.t:0 "$contract_event_prefix$ $laamp_cultural_minority_contract_contract$"
 ep3_contract_event.0020.tt:0 "Um [scheme|E] bem-sucedido resultará em [task_contract_employer.GetShortUIName] ganhando uma [obligation|E] de [GetSubjectContractType( 'title_revocation_rights' ).GetObligationName( 'title_revocation_rights_protected' )]"
 ep3_contract_event.0021.a:0 "$ep3_contract_event.0020.a$"
 ep3_contract_event.0021.agents_diplomacy:0 "$ep3_contract_event.0020.agents_diplomacy$"
 ep3_contract_event.0021.agents_intrigue:0 "$ep3_contract_event.0020.agents_intrigue$"
 ep3_contract_event.0021.agents_learning:0 "$ep3_contract_event.0020.agents_learning$"
 ep3_contract_event.0021.agents_martial:0 "$ep3_contract_event.0020.agents_martial$"
 ep3_contract_event.0021.b:0 "Aprendi alguns truques para conquistar os [task_contract_target.GetFaith.GetAdherentNamePluralNoTooltip]."
 ep3_contract_event.0021.c:0 "$ep3_contract_event.0020.c$"
 ep3_contract_event.0021.d:0 "Vou encontrar algo no [task_contract_target.GetFaith.ReligiousText] para convencer [task_contract_target.GetSheHe]."
 ep3_contract_event.0021.desc:0 "Um grupo de [task_contract_employer.GetFaith.GetAdherentNamePlural] entra no meu acampamento, desejando falar comigo.\n\n\"Saudações, aventureiro!\" começa o mais velho do grupo. \"Viemos de [task_contract_destination.GetName], uma terra próxima, onde o governo piedoso [Select_CString( task_contract_employer.IsFemale, 'da', 'do' )] [task_contract_employer.GetName] segue o sagrado [task_contract_employer.GetFaith.ReligiousText]!\" Algumas tímidas saudações ao nome de [task_contract_employer.GetFaith.HighGodName] distraem o ancião, antes que ele continue:\n\n\"No entanto, o senhor feudal [task_contract_employer.GetHerHim], [task_contract_target.GetName], é um [task_contract_employer.Custom2('GetUnbelieverTerm', task_contract_target)] que pouco se importa com nossas maneiras. Em nome de [task_contract_employer.GetFaith.HighGodName], suplicamos; ajude-nos a obter garantias de liberdade religiosa sob este reinado [Select_CString( task_contract_target.IsFemale, 'da', 'do' )] [task_contract_target.GetPrimaryTitle.GetTierAsNameNoTooltip]!\""
 ep3_contract_event.0021.e:0 "$ep3_contract_event.0020.e$"
 ep3_contract_event.0021.t:0 "$contract_event_prefix$ $laamp_religious_minority_contract_contract$"
 ep3_contract_event.0021.tt:0 "Um [scheme|E] bem-sucedido resultará em [task_contract_target.GetShortUIName] concedendo a [obligation|E] de [GetSubjectContractType( 'religious_rights' ).GetObligationName( 'religious_rights_protected' )] a [task_contract_employer.GetShortUIName]"
 ep3_contract_event.0030.a:0 "$ep3_contract_event.0020.a$"
 ep3_contract_event.0030.agents:0 "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thief' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thug' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_lookout' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_decoy' ).GetName]"
 ep3_contract_event.0030.b:0 "Vou começar a planejar uma fuga imediatamente!"
 ep3_contract_event.0030.c.tt:0 "Desbloqueia [interaction|E] $prison_break_contract_interaction$."
 ep3_contract_event.0030.c:0 "Isso pode esperar até a manhã."
 ep3_contract_event.0030.desc:0 "\"Aquel[Select_CString( task_contract_target.IsFemale, 'a', 'e' )] [task_contract_target.Custom2('InsultNoun', SCOPE.sC('task_contract_employer'))] [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))], [task_contract_target.GetName]!\" Profanidades altas do lado de fora da minha tenda me acordam.\n\n\"Quem está aí? Quem me incomoda à noite, no meu próprio acampamento?\" pergunto, ainda meio adormecido.\n\n\"Sou eu, [task_contract_employer.GetName]!\" anuncia orgulhosamente o intruso. \"Apresse-se, não há tempo a perder! [task_contract_object.Custom2('MyCharacterIntroduction', task_contract_employer)|U] foi feito prisioneiro pelos [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.Custom2('InsultNoun', SCOPE.sC('task_contract_employer'))], [task_contract_target.GetTitledFirstNameNoTooltip].\" Vendo minha confusão, [task_contract_employer.GetSheHe] acrescenta:\n\n\"Vou pagar bem, caso você consiga libertar [task_contract_object.GetSheHe]!\""
 ep3_contract_event.0030.t:0 "$contract_event_prefix$ $laamp_prison_break_contract_contract$"
 ep3_contract_event.0040.a:0 "Meu empregador não vai gostar disso."
 ep3_contract_event.0040.a_travel:0 "Mas — eu estava apenas... ah, bem."
 ep3_contract_event.0040.b:0 "Pode muito bem ficar aqui."
 ep3_contract_event.0040.desc:0 "Enquanto tiro o mapa do tesouro para mais um olhar confuso, o mapa se prende em algo na minha bolsa com um horrível #EMP \"RI-I-P\"#!\n\nMeu mapa agora está despedaçado bem no meio, pouco mais que retalhos caindo ao chão.\n\nFico em pé, chocado, segurando os — agora em grande parte inúteis — pedaços nas minhas mãos."
 ep3_contract_event.0040.t:0 "$treasure_map_prefix$: Capture do Tesouro"
 ep3_contract_event.0041.a.flavor_dead:0 "Que [task_contract_employer.GetFaith.HighGodName] conceda descanso à alma [task_contract_employer.GetHerHim]."
 ep3_contract_event.0041.a.flavor_incapable:0 "Que estado terrível de... ser?"
 ep3_contract_event.0041.a.tt:0 "Mova seu [camp|E] para [THIS.Char.GetCurrentLocation.GetNameNoTooltip]"
 ep3_contract_event.0041.a:0 "Devemos voltar."
 ep3_contract_event.0041.b:0 "Não há nada para voltar, de qualquer forma."
 ep3_contract_event.0041.desc_dead:0 "$ep3_contract_event.0041.desc_intro$\n\nEntro na tenda e, por um segundo, [task_contract_employer.GetFirstNameNoTooltip] parece estar apenas dormindo — até eu notar o rosto [task_contract_employer.GetHerHim] lentamente se tornando pálido como a morte.\n\nAinda atordoado, eu"
 ep3_contract_event.0041.desc_incapable:0 "$ep3_contract_event.0041.desc_intro$\n\nEntro na tenda para encontrar [task_contract_employer.GetFirstNameNoTooltip] em um monte no chão, vivo, mas... apenas... #EMP não aqui#!.\n\nAinda atordoado, ajudo a sentar [task_contract_employer.GetSheHe] contra a cama, e então"
 ep3_contract_event.0041.desc_intro:0 "O guarda do fogo intervém na minha caminhada para a tenda [Select_CString( task_contract_employer.IsFemale, 'da', 'do' )] [task_contract_employer.GetTitledFirstName]: \"[ROOT.Char.GetTitleAsNameNoTooltip|U], não... [task_contract_employer.GetSheHe] foi embora, [ROOT.Char.Custom('MistressMaster')].\""
 ep3_contract_event.0041.desc_outro:0 "olho ao redor, tentando localizar o mapa do tesouro, mas rapidamente percebo que não está em lugar nenhum.\n\nAgora, eu não posso possivelmente completar a busca pelo tesouro final..."
 ep3_contract_event.0041.t_dead:0 "$treasure_map_prefix$: A Eternidade Não Espera por Nenhum [task_contract_employer.GetWomanMan|U]"
 ep3_contract_event.0041.t_incapable:0 "$treasure_map_prefix$: A Noite Cai"
 ep3_contract_event.0043.a.tt:0 "Abra a visão da [decision|E] [GetDecisionWithKey('treasure_map_contract_decision').GetName]"
 ep3_contract_event.0043.a:0 "Vamos sair!"
 ep3_contract_event.0043.b:0 "Vou cuidar disso. Em breve."
 ep3_contract_event.0043.desc:0 "[task_contract_employer.GetTitledFirstName] se aproxima de mim e dá um tapinha no meu ombro: \"Você é um [ROOT.Char.Custom('GetLassLad')] tão bom! Eu realmente aprecio sua ajuda nesta última excursão.\"\n\n[task_contract_employer.GetSheHe|U] me entrega um [0043_treasure_map.GetName] surrado, as rugas ao redor dos olhos [task_contract_employer.GetHerHim] suavizando enquanto [task_contract_employer.GetSheHe] sorri. \"Pode não parecer muito, mas eu lutei com [task_contract_employer.GetFaith.DevilName] [task_contract_employer.GetFaith.DevilHerselfHimself] para obter isso. Trate-o com cuidado.\"\n\nFazendo uma pausa por um momento para deixar as palavras absorverem, o velho [task_contract_employer.GetWomanMan] então ri: \"Sempre que você estiver pronto — temos um tesouro para desenterrar!\""
 ep3_contract_event.0043.t:0 "$treasure_map_prefix$: O Que Escapou"
 ep3_contract_event.0045.a:0 "Notícias esplêndidas para [task_contract_employer.GetTitledFirstNameNoTooltip]!"
 ep3_contract_event.0045.a_artifact_historical:0 "[task_contract_employer.GetTitledFirstNameNoTooltip] ficará #EMP emocionado!#!"
 ep3_contract_event.0045.a_pillaged:0 "Hmh. Suponho que meu empregador deva ser informado..."
 ep3_contract_event.0045.b.flavor:0 "Vou guardar isso para mais tarde."
 ep3_contract_event.0045.b.flavor_reforged:0 "Vou refazê-lo em algo útil."
 ep3_contract_event.0045.b:0 "Achados e perdidos."
 ep3_contract_event.0045.b_artifact_historical:0 "Isto pertence... #EMP a mim.#!"
 ep3_contract_event.0045.b_pillaged:0 "Não há muito o que celebrar aqui."
 ep3_contract_event.0045.desc_artifact_historical:0 "$ep3_contract_event.0045.desc_intro_artifact$\n\nFinalmente, descubro um monte sob alguns arbustos dispostos um pouco #EMP demais#! ordenadamente para ser natural. Ao começar a cavar, bato em algo e cuidadosamente desenterro para descobrir que é... [treasure_artifact_historical.GetName]!?"
 ep3_contract_event.0045.desc_artifact_jewelry:0 "$ep3_contract_event.0045.desc_intro_artifact$\n\nUm pouco adiante em uma coleção de árvores antigas, avisto algo em uma de suas cavidades ocos. Colocando minha mão dentro da árvore, puxo... [treasure_artifact_jewelry.GetName]."
 ep3_contract_event.0045.desc_gold_great:0 "$ep3_contract_event.0045.desc_intro_gold$\n\nDentro da gruta, sua decoração retratando várias atividades estranhas e lugubres, aguarda um baú de madeira empoeirado.\n\nEu o abro e descubro uma grande quantidade de ouro, joias e objetos de valor!"
 ep3_contract_event.0045.desc_gold_mediocre:0 "$ep3_contract_event.0045.desc_intro_gold$\n\nAs partes internas da gruta, aparentemente esquecidas há muito tempo, são o lar de objetos espalhados.\n\nLevantando o que parece ser uma urna antiga — e surpreendentemente pesada — descubro um respeitável estoque de moedas de ouro dentro."
 ep3_contract_event.0045.desc_gold_poor:0 "$ep3_contract_event.0045.desc_intro_gold$\n\nO interior da gruta parece ser um santuário secreto para alguma deidade obscura... e sob os olhares de espíritos desconhecidos, não consigo encontrar nada de valor, exceto um único enfeite de ouro em um prato de oferenda."
 ep3_contract_event.0045.desc_intro:0 "[task_contract_employer.GetFirstName] mal consegue conter sua empolgação ao retornar para a tenda [task_contract_employer.GetHerHim]."
 ep3_contract_event.0045.desc_intro_artifact:0 "Ao amanhecer, chegamos em [excavation_location.GetName] — no que deveria ser o marcador no [0045_treasure_map.GetName]. Começo a procurar por locais adequados onde alguém poderia esconder um tesouro.\n\nPor milhas, se estende apenas o tranquilo [excavation_location.GetTerrain.GetNameNoTooltip|l]: um majestoso pano de fundo para minha busca."
 ep3_contract_event.0045.desc_intro_gold:0 "Chegamos ao campo de [excavation_location.GetName] no início da tarde e começamos a procurar pistas sobre onde o marcador no [0045_treasure_map.GetName] pode apontar.\n\nCaminhando pelo [excavation_location.GetTerrain.GetNameNoTooltip|l], noto uma cavidade bem escondida em um penhasco rochoso. Ela leva a uma pequena caverna."
 ep3_contract_event.0045.desc_intro_scenery:0 "Ao chegarmos nos arredores de [excavation_location.GetName], sigo o marcador no [0045_treasure_map.GetName] através dos penhascos e da vegetação e..."
 ep3_contract_event.0045.desc_pillaged:0 "$ep3_contract_event.0045.desc_intro_gold$\n\nDepois de pouco mais de uma hora, encontro um buraco parcialmente coberto com um pequeno baú de madeira dentro. Está quase vazio... exceto por um punhado de trinkets [excavation_location.GetCulture.GetNameNoTooltip]."
 ep3_contract_event.0045.desc_riches_in_scenery:0 "$ep3_contract_event.0045.desc_intro_scenery$\n\nO [excavation_location.GetTerrain.GetNameNoTooltip|l] se abre em uma magnífica fonte. Uma infinidade de pássaros e animais pastando populam este lugar, indenes ao mundo exterior.\n\nContemplo a beleza deste local, e como todas as criaturas existem em uma hierarquia gentil: insetos, peixes, pássaros e bestas.\n\nUma sensação de calor cresce em meu peito. Esta é uma sensação divina: não há dúvida!"
 ep3_contract_event.0045.desc_riches_in_scenery_dry:0 "$ep3_contract_event.0045.desc_intro_scenery$\n\nO [excavation_location.GetTerrain.GetNameNoTooltip|l] se abre para um deslumbrante oásis. A água fresca oferece alívio do calor incessante, e as ondas se movem na superfície enquanto peixes coloridos dançam embaixo.\n\nPenso em como — mesmo nos momentos mais difíceis — esses portos seguros serenos permanecem inalterados: em tais lugares de serenidade, sente-se sua proximidade com [ROOT.Char.GetFaith.HighGodName]..."
 ep3_contract_event.0045.t:0 "$treasure_map_prefix$: Um Pássaro na Mão..."
 ep3_contract_event.0050.a:0 "Prazer em fazer negócios com você."
 ep3_contract_event.0050.desc_artifact_historical:0 "\"[treasure_artifact_historical.GetName]!\" [task_contract_employer.GetTitledFirstName] gaspou, enquanto eu entrego o [treasure_artifact_historical.Custom('ArtifactType')].\n\n\"Deus o abençoe, amigo, por trazer isso para mim. Eu entendo que pode ter sido inimaginavelmente difícil se desfazer de um tesouro como esse...\"\n\n[task_contract_employer.GetSheHe|U] sorri agradecido. \"Suponho que a sabedoria da minha mãe continua verdadeira: pode-se realmente ter fé na bondade dos estranhos.\""
 ep3_contract_event.0050.desc_artifact_jewelry:0 "$ep3_contract_event.0045.desc_intro$ \"Exquisito! Olhe para aquela estranha arte!\"\n\n[task_contract_employer.GetSheHe|U] analisa os mínimos detalhes do [treasure_artifact_jewelry.GetName], praticamente ronronando de alegria, e me lança um sorriso. \"Você tem minha eterna gratidão por isso.\""
 ep3_contract_event.0050.desc_gold:0 "$ep3_contract_event.0045.desc_intro$ \"Ouro, você diz? Que final de tesouro maravilhoso!\"\n\nUm toque de melancolia, indubitavelmente ao pensar no fim de uma aventura, passa pelo rosto [task_contract_employer.GetHerHim] enquanto [task_contract_employer.GetSheHe] conclui esse assunto. \"Sou grato por esse golpe de sorte dourado, devidamente entregue. Vá, com meus agradecimentos.\""
 ep3_contract_event.0050.desc_pillaged:0 "$ep3_contract_event.0045.desc_intro$ \"Já havia sido saqueado?\"\n\n[task_contract_employer.GetSheHe|U] suspira pesadamente. \"A vida de um aventureiro não termina com um estrondo, mas sim com um... lamento, suponho. Bem. Você me divertiu nessa tolice, e tem meus agradecimentos.\""
 ep3_contract_event.0050.desc_scenic:0 "$ep3_contract_event.0045.desc_intro$ \"Isso... parece realmente de tirar o fôlego. Passei tanto da minha vida buscando riqueza, porquinhos, por coisas que brilham. Isso...\"\n\n[task_contract_employer.GetSheHe|U] faz uma pausa por um momento, perdido em pensamentos: \"...este é o lugar onde passarei meus últimos dias, em paz. Obrigado, meu amigo.\""
 ep3_contract_event.0050.t:0 "$treasure_map_prefix$: ...vale mais que dois no arbusto"
 ep3_contract_event.0060.a:0 "$ep3_contract_event.0008.a$"
 ep3_contract_event.0060.desc:0 "Um grupo viajante de [task_contract_employer.GetCulture.GetCollectiveNoun], suas lanças adornadas com novos estandartes brilhantes, para na minha tenda. Um dos [task_contract_employer.Custom('KnightCulturePluralNoTooltip')|l], [commander.GetName], traz-me um pedido de seu mestre.\n\n\"[task_contract_employer.GetName] prepara seu exército para atacar os [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] de [task_contract_target.GetName], e — pelos golpes de batalha — recuperar o que é de direito [task_contract_employer.GetHerHim]!\"\n\n\"E quando nossos estandartes estiverem acima de [task_contract.MakeScope.Var('task_contract_title').Title.GetNameNoTier], haverá finos espólios distribuídos a todos que lutaram pela reivindicação [Select_CString( task_contract_employer.IsFemale, 'da', 'do' )] [task_contract_employer.GetTitleAsNameNoTooltip]!\""
 ep3_contract_event.0060.join_war:0 "[task_contract_taker.GetShortUIName|U] se juntará à [war|E] como Atacante"
 ep3_contract_event.0060.t:0 "$contract_event_prefix$ $laamp_help_claimant_contract_contract$"
 ep3_contract_event.0070.a:0 "Quero um pedaço da terra [Select_CString( task_contract_target.IsFemale, 'da', 'do' )] [task_contract_target.GetFirstNameNoTooltip]!"
 ep3_contract_event.0070.b:0 "Uma causa justa, de fato!"
 ep3_contract_event.0070.desc:0 "Um contingente armado, sob a bandeira de [task_contract_employer.GetName], visita meu acampamento.\n\n\"Saudações, [ROOT.Char.GetTitledFirstNameNoTooltip]! Dizem que você está curioso sobre nossa causa, e por isso viemos falar de nosso inimigo, o [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.GetName]. "
 ep3_contract_event.0070.desc_claimant_faction:0 "$ep3_contract_event.0070.desc$[task_contract_target.GetSheHe|U] é um governante indigno e ilegítimo de [task_contract_faction.GetSpecialTitle.GetName]. Nossas esperanças estão com [task_contract_faction.GetSpecialCharacter.GetName]: um verdadeiro líder, tão [task_contract_faction.GetSpecialCharacter.Custom('PersonalityGetPositiveTraitDesc')] quanto [task_contract_faction.GetSpecialCharacter.GetSheHe] é [task_contract_faction.GetSpecialCharacter.Custom('DescriptorPositiveStandalone')]!\"\n\nE, [task_contract_target.GetTitledFirstNameNoTooltip]..."
 ep3_contract_event.0070.desc_fallback_faction:0 "$ep3_contract_event.0070.desc$Como [task_contract_target.GetSheHe] rasteja sob a pele de seus súditos, rasgando-nos de dentro! Desejamos lançar [task_contract_target.GetSheHe] à luz, mostrar a [task_contract_target.GetSheHe] como a vil larva que [task_contract_target.GetSheHe] é!\"\n\n\"Pior ainda..."
 ep3_contract_event.0070.desc_independence_faction:0 "$ep3_contract_event.0070.desc$[task_contract_target.GetSheHe|U] é um senhor feudal incompetente — indigno! #EMP Indigno!#! Nós súditos faríamos melhor em ficar sozinhos.\n\nAlém disso..."
 ep3_contract_event.0070.desc_liberty_faction:0 "$ep3_contract_event.0070.desc$[task_contract_target.GetSheHe|U] aperta a garganta do nosso reino; [task_contract_target.GetSheHe] estrangula a nobreza com o poder acumulado!\"\n\nÉ intolerável! E..."
 ep3_contract_event.0070.desc_liege_culture:0 "[task_contract_target.GetSheHe] é descaradamente [task_contract_target.GetCulture.GetName]!\""
 ep3_contract_event.0070.desc_liege_faith:0 "[task_contract_target.GetSheHe] é [task_contract_target.GetFaith.GetAdherentName] como eles vêm!\""
 ep3_contract_event.0070.desc_liege_fallback:0 "[task_contract_target.GetSheHe] é [task_contract_target.Custom('DescriptorNegativeStandalone')]!\""
 ep3_contract_event.0070.desc_liege_levies:0 "Milícias [task_contract_target.GetHerHim] chamam cada último trabalhador de meus campos!\""
 ep3_contract_event.0070.desc_liege_taxes:0 "Impostos [task_contract_target.GetHerHim] espreme cada último centavo de mim e meu povo!\""
 ep3_contract_event.0070.desc_nation_fracturing_faction:0 "$ep3_contract_event.0070.desc$Não só [task_contract_target.GetSheHe] é inadequado para a coroa, mas todo o [task_contract_faction.GetSpecialTitle.GetName] está podre até seu núcleo! Acreditamos que nada pode salvar este reino amaldiçoado.\"\n\n\"A única maneira de seguir em frente é destruí-lo e reconstruí-lo das cinzas!"
 ep3_contract_event.0070.desc_outro:0 "cospe o líder [task_contract_employer.Custom('KnightCultureNoTooltip')|l], estendendo a mão. \"Você se juntará a nós?\""
 ep3_contract_event.0070.t:0 "$contract_event_prefix$ $laamp_join_faction_contract_contract$"
 ep3_contract_event.0080.a:0 "Deixe-me ver o que posso fazer."
 ep3_contract_event.0080.desc:0 "Meu acampamento é honrado com a visita de [task_contract_councillor.GetCouncilTitleFirstName] de [task_contract_councillor_liege.GetPrimaryTitle.GetNameNoTier].\n\n\"Saudações, [ROOT.Char.GetTitledFirstNameNoTooltip]. Você parece ser um [ROOT.Char.GetWomanMan] perspicaz... já que você descobriu exatamente do que se trata, em segredo.\" [task_contract_councillor.GetFirstNameNoTooltip] coloca sua mão em meu ombro. \"Veja, [task_contract_target.GetName]... [task_contract_target.GetSheHe] é um usurpador. Eu sei disso, [task_contract_employer.GetTitledFirstNameNoTooltip] sabe disso, e você sabe disso.\" [task_contract_councillor.GetSheHe|U] me dá uma batida no peito.\n\n\"Digamos que você aconteça em #EMP encontrar#! provas das reivindicações ancestrais do meu senhor feudal? Você então deixaria todos saberem a #EMP verdade#!?"
 ep3_contract_event.0080.open_start_generate_claim_interaction:0 "Abre [character_interaction|E] para iniciar um [scheme|E] de [GetScheme('generate_claim').GetTypeName]"
 ep3_contract_event.0080.t:0 "$contract_event_prefix$ $laamp_help_fabricate_claim_contract_contract$"
 ep3_contract_event.0082.a:0 "Tentarei parar [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip]!"
 ep3_contract_event.0082.b:0 "Falarei com [task_contract_councillor_liege.GetTitledFirstNameNoTooltip] em [task_contract_councillor_liege.GetCapitalLocation.GetNameNoTooltip], a capital de [task_contract_councillor_liege]."
 ep3_contract_event.0082.desc:0 "Uma delegação de fiéis [task_contract_employer.GetFaith.GetAdherentNamePluralNoTooltip] visita meu acampamento, apresentando um apelo para agitar o sangue.\n\n\"Ó, poderos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitledFirstNameNoTooltip]!\" dizem eles. \"Somos apenas uma coleção de pobres [task_contract_employer.GetFaith.DevoteeNeuterPlural]. \"Dia e noite, somos importunados por missionários enviados de [task_contract_councillor_liege.GetCapitalLocation.GetName] por [task_contract_councillor_liege.GetTitledFirstName]! Fomos forçados a fugir para cá — pois em nossa casa, o [task_contract_councillor.GetCouncilTitleFirstName] [task_contract_councillor.GetHerselfHimself] pratica males! [task_contract_councillor.GetSheHe|U] converte à força aqueles que [task_contract_councillor.GetSheHe] captura!\"\n\nOs refugiados esfarrapados estão de joelhos em desespero.\n\n\"Em nome [Select_CString( task_contract_employer.IsFemale, 'da', 'do' )] [task_contract_employer.GetTitledFirstName] — em [task_contract_employer.GetFaith.HighGodName] — salve-nos!\""
 ep3_contract_event.0082.t:0 "$contract_event_prefix$ $laamp_fight_faith_conversion_contract_contract$"
 ep3_contract_event.0082.to_destination:0 "Você viajará para [task_contract_destination.GetName] para parar o trabalho missionário [Select_CString( task_contract_target.IsFemale, 'da', 'do' )] [task_contract_target.GetCouncilTitleFirstName]"
 ep3_contract_event.0082.to_liege:0 "Você viajará para [task_contract_councillor_liege.GetName] para convencer [task_contract_councillor_liege.GetSheHe] a lembrar [task_contract_councillor.GetCouncilTitleFirstName]"
 ep3_contract_event.0083.a:0 "\"Vamos remover [task_contract_councillor.GetNameNoTooltip] da equação.\""
 ep3_contract_event.0083.a_lose:0 "Você falha em capturar o [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip]"
 ep3_contract_event.0083.a_win:0 "Você captura com sucesso o [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip]"
 ep3_contract_event.0083.b:0 "\"[task_contract_councillor.GetNameNoTooltip] só entenderá poder.\""
 ep3_contract_event.0083.b_lose:0 "Você falha em ameaçar o [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip]"
 ep3_contract_event.0083.b_win:0 "Você intimida o [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip]"
 ep3_contract_event.0083.c:0 "\"Certamente, posso negociar com um [task_contract_councillor.GetFaith.PriestNeuter] [task_contract_councillor.GetFaith.GetAdjectiveNoTooltip]?\""
 ep3_contract_event.0083.c_lose:0 "Você perde o debate com o [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip]"
 ep3_contract_event.0083.c_win:0 "Você negocia uma coexistência pacífica com o [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip]"
 ep3_contract_event.0083.d:0 "Fuja, [task_contract_employer.GetFirstNameNoTooltip]! Você está seguro comigo."
 ep3_contract_event.0083.desc:0 "Chegamos em [task_contract_destination.GetName]. Quando [task_contract_employer.GetName] entra no [task_contract_destination.Custom('GetLocationFaithTemple')] [task_contract_employer.GetHerHim], um grito de dor vem do fundo do seu coração!\n\n\"#EMP Tudo está arruinado!#! O [task_contract_employer.GetFaith.ReligiousSymbol] roubado! O [task_contract_employer.GetFaith.ReligiousSymbol2] pisoteado no chão! Eu poderia gritar cada palavra do [task_contract_employer.GetFaith.ReligiousText]! Quem teria a ousadia de saquear este lugar e colocá-lo em chamas? Quem, senão [Select_CString( task_contract_councillor.IsFemale, 'a', 'o' )] [task_contract_councillor.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_councillor.GetTitledFirstName]!\"\n\n\"Você entende agora, [ROOT.Char.GetTitledFirstNameNoTooltip]!\" [task_contract_employer.GetFirstNameNoTooltip] aponta para o [task_contract_employer.GetFaith.ReligiousSymbol3] profanado. \"Não podemos viver assim por mais tempo!\""
 ep3_contract_event.0083.t:0 "$ep3_contract_event.0082.t$"
 ep3_contract_event.0084.a:0 "Os [task_contract_employer.GetFaith.GetAdherentNamePluralNoTooltip] devem governar a si mesmos."
 ep3_contract_event.0084.a_lost:0 "Você não convenceu [task_contract_councillor_liege.GetTitledFirstNameNoTooltip]"
 ep3_contract_event.0084.a_win:0 "[task_contract_employer.GetTitledFirstNameNoTooltip] ganha o [task_contract_destination.GetCounty.GetTitle.GetNameNoTooltip]"
 ep3_contract_event.0084.a_win_rights.tt:0 "Ganha [obligation|E] de [GetSubjectContractType( 'religious_rights' ).GetObligationName( 'religious_rights_protected' )]"
 ep3_contract_event.0084.a_win_rights:0 "Para [task_contract_employer.GetFirstNameNoTooltip]: [task_contract_destination.GetCounty.GetTitle.GetNameNoTierNoTooltip] e direitos de proteção"
 ep3_contract_event.0084.b:0 "Seu povo deve aprender a coexistir."
 ep3_contract_event.0084.b_lost:0 "$ep3_contract_event.0084.a_lost$"
 ep3_contract_event.0084.b_win:0 "[task_contract_councillor_liege.GetTitledFirstNameNoTooltip] irá parar de tentar converter [task_contract_destination.GetCounty.GetTitle.GetNameNoTierNoTooltip]"
 ep3_contract_event.0084.desc:0 "Após alguns puxões de cordas perturbadores em [task_contract_destination.GetName], consigo uma audiência com [task_contract_councillor_liege.GetName].\n\n\"[task_contract_councillor_liege.GetTitleAsNameNoTooltip]!\" eu digo. \"Em nome [Select_CString( task_contract_employer.IsFemale, 'da', 'do' )] [task_contract_employer.GetTitledFirstName] e dos [task_contract_employer.GetFaith.GetAdherentNamePlural] da sua terra, venho até você. Seu [task_contract_councillor.GetCouncilTitleFirstName] cometeu atos desprezíveis contra sua comunidade e merece punição! Essa justiça não seria, sem dúvida, o caminho do seu [task_contract_councillor_liege.GetFaith.HighGodName]?\"\n\n[task_contract_councillor_liege.GetTitledFirstNameNoTooltip] franze a testa.\n\n\"De fato. Eu não sou um tirano; ouvirei sua petição na íntegra. E só então decidirei o destino [task_contract_councillor.GetCouncilTitlePossessive] e de todos os [task_contract_employer.GetFaith.GetAdherentNamePluralNoTooltip] em meu reino.\""
 ep3_contract_event.0084.t:0 "$ep3_contract_event.0082.t$"
 ep3_contract_event.0085.a:0 "Isso é loucura. [task_contract_councillor.GetTitledFirstNameNoTooltip] tem que ser parad[Select_CString( task_contract_councillor.IsFemale, 'a', 'o' )]!"
 ep3_contract_event.0085.a_lose:0 "Você falha em capturar [task_contract_councillor.GetTitledFirstNameNoTooltip] e o contrato"
 ep3_contract_event.0085.a_win:0 "Você espanta todos os missionários"
 ep3_contract_event.0085.a_win_critical:0 "Você captura com sucesso [task_contract_councillor.GetTitledFirstNameNoTooltip]"
 ep3_contract_event.0085.b:0 "Acho que vou #EMP aproveitar#! este trabalho missionário."
 ep3_contract_event.0085.c:0 "Vou ensiná-los sobre [task_contract_councillor.GetFaith.GoodGodNames]."
 ep3_contract_event.0085.c_lose:0 "Eles não entendem o ponto da história"
 ep3_contract_event.0085.c_win:0 "Eles entendem a alegoria"
 ep3_contract_event.0085.d:0 "Vou avisá-los sobre [task_contract_councillor.GetFaith.EvilGodNames]!"
 ep3_contract_event.0085.d_lose:0 "Eles ficaram assustados com o [task_contract_councillor.GetFaith.EvilGodName]"
 ep3_contract_event.0085.d_win:0 "Eles entendem a alegoria"
 ep3_contract_event.0085.desc:0 "[task_contract_destination.GetName] é"
 ep3_contract_event.0085.desc_bad:0 "Em [task_contract_destination.GetName], o [task_contract_destination.Custom('GetLocationFaithTemple')] local está em chamas! Eu encontro [task_contract_councillor.GetCouncilTitleFirstName] [Select_CString( task_contract_councillor_liege.IsFemale, 'da', 'do' )] [task_contract_councillor_liege.GetName] nos arredores; [Select_CString( task_contract_councillor.IsFemale, 'suas', 'seus' )] [task_contract_councillor.Custom('WomenMenPeople_GenderPreference')] têm cabeças do [task_contract_destination.County.GetFaith.GetName] nas pontas de suas espadas.\n\n\"Ah, bem a tempo! Aqueles camponeses não respeitariam nossos pregadores, então decidimos mostrar a eles o verdadeiro poder de [task_contract_councillor.GetFaith.HighGodName].\" [task_contract_councillor.GetTitledFirstNameNoTooltip] está claramente se divertindo com [task_contract_councillor.GetHerselfHimself].\n\n\"Por favor, tenham misericórdia!\" imploram os sobreviventes. \"Nós somos apenas simples [task_contract_destination.County.GetFaith.DevoteeNeuterPlural]. Não queremos mal: por favor, nos deixem em paz!\""
 ep3_contract_event.0085.desc_good:0 "[task_contract_destination.GetName] pareceu bastante tranquila desde a minha chegada. Eu avisto [task_contract_councillor.GetCouncilTitleFirstName] [Select_CString( task_contract_councillor_liege.IsFemale, 'da', 'do' )] [task_contract_councillor_liege.GetName] cercado por um grupo de [task_contract_destination.County.GetFaith.GetAdherentNamePlural] locais.\n\n\"Saudações, viajante! Eu estava prestes a recitar algo do [task_contract_councillor.GetFaith.ReligiousText] para meus discípulos.\" [task_contract_councillor.GetSheHe|U] aponta para os camponeses. \"Talvez você possa nos indicar suas parábolas favoritas?\""
 ep3_contract_event.0085.t:0 "$contract_event_prefix$ $laamp_help_faith_conversion_contract_contract$"
 ep3_contract_event.0090.a:0 "Deixe-me ver aqueles [task_contract_councillor_liege.Custom('WomenMenPeople_GenderPreference')]!"
 ep3_contract_event.0090.desc:0 "Ao chegar, sou recebido por [task_contract_councillor.GetCouncilTitleFirstName] [Select_CString( task_contract_councillor_liege.IsFemale, 'da', 'do' )] [task_contract_councillor_liege.GetName].\n\n\"Estou feliz que você pôde vir. Estamos precisando de um especialista nas artes da guerra, pois nossos comandantes são bastante inexperientes.\" [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip] inclina sua cabeça e rapidamente acrescenta: \"Pelo menos... segundo nosso senhor feudal.\"\n\n\"Bem, eu ficaria feliz em convidá-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], mas [Select_CString( task_contract_councillor_liege.IsFemale, 'minha', 'meu' )] [task_contract_councillor_liege.GetTitleAsNameNoTooltip] espera que você comece o treinamento imediatamente. Escolha quem quiser e armá-los.\""
 ep3_contract_event.0090.opens_task_contract_train_knight_interaction:0 "Abre [character_interaction|E] $task_contract_train_knight_interaction$"
 ep3_contract_event.0090.t:0 "$contract_event_prefix$ Instrutor de [task_contract_employer.Custom('KnightCulturePluralNoTooltip')]"
 ep3_contract_event.0091.a:0 "Eu poderia usar alguém assim comigo mesmo!"
 ep3_contract_event.0091.b:0 "Ensinar [trait_to_teach.GetNameNoTooltip( ROOT.Char )] a [knight.GetSheHe] deve ser fácil!"
 ep3_contract_event.0091.c:0 "\"[helper.GetFirstNameNoTooltip], dê a [knight.GetSheHe] uma lição particular.\""
 ep3_contract_event.0091.d:0 "[knight.GetFirstNameNoTooltip] deve apenas seguir meus movimentos."
 ep3_contract_event.0091.desc:0 "Para saber com o que estou lidando, convido [knight.GetName] para um sparring com"
 ep3_contract_event.0091.desc_helper:0 "[helper.GetName].\n\n\"Eles assumem suas posições, aguardando uma abertura.\""
 ep3_contract_event.0091.desc_high_prowess:0 "[knight.GetNameNoTooltip] ataca primeiro, uma sequência contra [helper.GetFirstNameNoTooltip] com [knight.Custom('signature_weapon')] [knight.GetHerHim]. [helper.GetFirstNameNoTooltip] parece impotente, claramente superado pelo oponente."
 ep3_contract_event.0091.desc_low_prowess:0 "Guarda [Select_CString( knight.IsFemale, 'da', 'do' )] [knight.GetFirstNameNoTooltip] guarda enfraquece primeiro, permitindo alguns, mas precisos, golpes de [helper.Custom('signature_weapon')] [Select_CString( helper.IsFemale, 'da', 'do' )] [helper.GetFirstName]. [knight.GetSheHe|U] tem dificuldades até para se manter em pé. Parece que esta será uma lição bem longa..."
 ep3_contract_event.0091.desc_me:0 "mim.\n\n\"Nós assumimos nossas posições, aguardando uma abertura.\""
 ep3_contract_event.0091.desc_me_high_prowess:0 "[knight.GetFirstNameNoTooltip] ataca primeiro, uma sequência de golpes com [knight.Custom('signature_weapon')] [knight.GetHerHim]. Fico pego de surpresa: tento me recuperar e contra-atacar com alguns golpes meus. No entanto, [knight.GetSheHe] para minha [ROOT.Char.Custom('signature_weapon')] com bastante facilidade."
 ep3_contract_event.0091.desc_me_low_prowess:0 "Guarda [Select_CString( knight.IsFemale, 'da', 'do' )] [knight.GetFirstNameNoTooltip] enfraquece primeiro, permitindo alguns, mas precisos, golpes de minha [helper.Custom('signature_weapon')]. Claramente, [knight.GetSheHe] não é páreo para mim."
 ep3_contract_event.0091.desc_outro:0 "\n\nEu paro a luta antes que fique sangrenta. \"Obrigado por seus esforços, [knight.GetFirstNameNoTooltip]. Já vi o suficiente para saber como prosseguir com seus ensinamentos.\""
 ep3_contract_event.0091.t:0 "$ep3_contract_event.0090.t$"
 ep3_contract_event.0091_lost:0 "[knight.GetFirstNameNoTooltip] não consegue acompanhar"
 ep3_contract_event.0091_lost_recruit:0 "[knight.GetFirstNameNoTooltip] recusa se juntar ao seu acampamento"
 ep3_contract_event.0091_won:0 "[knight.GetFirstNameNoTooltip] aprende muito com você"
 ep3_contract_event.0091_won_helper:0 "[knight.GetFirstNameNoTooltip] aprende muito com [helper.GetFirstNameNoTooltip]"
 ep3_contract_event.0091_won_recruit:0 "[knight.GetFirstNameNoTooltip] está ansioso para se juntar ao seu acampamento"
 ep3_contract_event.0091_won_trait:0 "[knight.GetFirstNameNoTooltip] aprende na hora"
 ep3_contract_event.0092.a:0 "Deixe-me lidar com eles!"
 ep3_contract_event.0092.a_tt:0 "$ep3_contract_event.0094.travel_without_domicile$"
 ep3_contract_event.0092.b:0 "Vou mover meu acampamento para lá."
 ep3_contract_event.0092.b_tt:0 "$ep3_contract_event.0094.travel_with_domicile$"
 ep3_contract_event.0092.desc:0 "[task_contract_councillor.GetName], [task_contract_councillor.GetCouncilTitle] [Select_CString( task_contract_councillor_liege.IsFemale, 'da', 'do' )] [task_contract_councillor_liege.GetPrimaryTitle.GetNameNoTier], visita meu acampamento por um dia. Assim que ficamos sozinhos, [task_contract_councillor.GetSheHe] começa a murmurar.\n\n\"É embaraçoso admitir... mas eu preciso da sua ajuda para lidar com os camponeses desobedientes de [task_contract_destination.GetName].\" O [task_contract_councillor.GetCouncilTitle|l] bufada e franze a testa.\n\n\"Eles desrespeitam a autoridade [Select_CString( task_contract_councillor_liege.IsFemale, 'da minha', 'do meu' )] [task_contract_councillor_liege.GetTitleAsName]!\""
 ep3_contract_event.0092.desc_bandits:0 "Eles se organizam em milícias, afirmando que são aterrorizados por foras da lei! Toda a região está se tornando um vasto e indisciplinado grupo..."
 ep3_contract_event.0092.desc_low_control:0 "Não consigo mantê-los sob controle! Eles batem e humilham qualquer um que eu envio, desafiando-me a agir com toda a força — sua conduta é uma mancha, que macula todo o reino!"
 ep3_contract_event.0092.desc_riots:0 "Suspeito uma influência estrangeira, provocando os simples camponeses a atos desprezíveis... que eles devem cessar imediatamente!"
 ep3_contract_event.0092.desc_taxes:0 "Os cobradores de impostos são recebidos com portas trancadas e pedras arremessadas! Tarifas e deveres antigos estão sendo ignorados, onde quer que eu vá."
 ep3_contract_event.0092.t:0 "$contract_event_prefix$ $laamp_help_increase_control_contract_contract$"
 ep3_contract_event.0093.a:0 "\"Cale seu povo ou #EMP morra#!, camponês!\""
 ep3_contract_event.0093.a_lose:0 "Mas você tem que deixar alguns [ROOT.Char.GetWomenMen] para trás"
 ep3_contract_event.0093.a_win:0 "Você ajuda a impor a presença [Select_CString( task_contract_councillor.IsFemale, 'da', 'do' )] [task_contract_councillor.GetCouncilTitleFirstName]"
 ep3_contract_event.0093.b:0 "Não posso tolerar esse tipo de injustiça."
 ep3_contract_event.0093.bandits:0 "\"Poderia me dizer onde fica o acampamento deles?\""
 ep3_contract_event.0093.bandits_lose:0 "Muitos bons soldados são perdidos"
 ep3_contract_event.0093.bandits_win:0 "Você lida com os bandidos sem perdas"
 ep3_contract_event.0093.desc:0 "Quando chegamos a [task_contract_destination.GetName], sou rápido em reunir os piores dos incitadores e exigir que se expliquem. [corrupt_province_peasant.GetName], um camponês de alguma reputação, fala pelo resto.\n\n"
 ep3_contract_event.0093.desc_bandits:0 "\"Tememos pela segurança de nossas crianças. É dever [Select_CString( task_contract_councillor_liege.IsFemale, 'da', 'do' )] [task_contract_councillor_liege.GetTitledFirstName] nos proteger, mas [task_contract_councillor_liege.GetSheHe] está apenas preocupado em nos controlar! Se as finas espadas [task_contract_councillor_liege.GetHerHim] não vão cortar os malditos fora da lei, meu povo vai prometer a vida de seus filhos às suas próprias foices, maças e flechas!\""
 ep3_contract_event.0093.desc_low_control:0 "\"É nosso lugar ser governados — mas [task_contract_councillor_liege.GetTitledFirstName] o faz injustamente! Com o caos predominando na terra, enquanto mal conseguimos manter o que é nosso, [task_contract_councillor_liege.GetSheHe] ainda nos força a trabalhar para [task_contract_councillor_liege.GetSheHe] como se fôssemos animais de trabalho! Trabalhamos sem qualquer promessa de segurança contra guerras, doenças e semelhantes!\""
 ep3_contract_event.0093.desc_riots:0 "\"Nossas mentes são nossas! Como se receberíamos a intromissão de forasteiros — bah! Rejeitamos, também, a presença dos capangas e bajuladores [Select_CString( task_contract_councillor_liege.IsFemale, 'da', 'do' )] [task_contract_councillor_liege.GetTitledFirstName]! Não podemos administrar nossos próprios assuntos locais, sem ser molestados?\""
 ep3_contract_event.0093.desc_taxes:0 "\"Os dízimos são altos, mas os pagamos! Os deveres que pagamos sobre nossos bens nos deixam com quase nada para sobrar! Suportamos esses pagamentos — e [task_contract_councillor_liege.GetTitledFirstName] exige ainda mais de nós — enquanto os coletores de impostos ficam cada vez mais ricos. É #EMP eles#! que você deveria estar confrontando!\""
 ep3_contract_event.0093.low_control:0 "\"Esta é uma graça do seu [task_contract_councillor_liege.GetTitleAsNameNoTooltip]...\""
 ep3_contract_event.0093.low_control_lose:0 "Os camponeses fazem de você um bode expiatório"
 ep3_contract_event.0093.low_control_win:0 "Você convence os camponeses"
 ep3_contract_event.0093.riots:0 "\"Espere! Ouça-me...\""
 ep3_contract_event.0093.riots_lose:0 "Os camponeses fazem de você um bode expiatório"
 ep3_contract_event.0093.riots_win:0 "Você consegue que os camponeses cooperem"
 ep3_contract_event.0093.t:0 "$ep3_contract_event.0092.t$"
 ep3_contract_event.0093.taxes:0 "\"Aqui, deixe-me ajudar com os registros...\""
 ep3_contract_event.0093.taxes_lose:0 "Os camponeses fazem você pagar por isso, e um pouco mais"
 ep3_contract_event.0093.taxes_win:0 "Você consegue lidar com isso"
 ep3_contract_event.0094.a:0 "Vamos nos apressar!"
 ep3_contract_event.0094.b:0 "Vou mover meu acampamento para lá."
 ep3_contract_event.0094.c:0 "Estou cansado dos problemas [Select_CString( task_contract_employer.IsFemale, 'da', 'do' )] [task_contract_employer.GetFirstNameNoTooltip]."
 ep3_contract_event.0094.desc:0 "Quando a barulhenta tarefa de dobrar cada líder camponês à minha vontade está completa, retomamos a estrada. [task_contract_councillor.GetName] fala sobre nosso próximo destino.\n\n\"Vamos para [corrupt_province.GetName], para melhor ou para pior. As máfias locais são uma grave preocupação.\""
 ep3_contract_event.0094.desc_bandits:0 "$ep3_contract_event.0092.desc_bandits$"
 ep3_contract_event.0094.desc_low_control:0 "$ep3_contract_event.0092.desc_low_control$"
 ep3_contract_event.0094.desc_riots:0 "$ep3_contract_event.0092.desc_riots$"
 ep3_contract_event.0094.desc_taxes:0 "$ep3_contract_event.0092.desc_taxes$"
 ep3_contract_event.0094.t:0 "$ep3_contract_event.0092.t$"
 ep3_contract_event.0094.travel_with_domicile:0 "Inicia uma [travel|E] para [corrupt_province.GetName] levando seu [camp|E] com você"
 ep3_contract_event.0094.travel_without_domicile:0 "Inicia uma [travel|E] para [corrupt_province.GetName] sem mover seu [camp|E]"
 ep3_contract_event.0094_fail:0 "Você falha no [task_contract.GetType.GetName] [task_contract|E]: você ajudou os camponeses mais do que [task_contract_employer.GetShortUIName]."
 ep3_contract_event.0094_success:0 "Você conclui o [task_contract.GetType.GetName] [task_contract|E]: você ajudou [task_contract_employer.GetShortUIName] mais do que os camponeses."
 ep3_contract_event.0095.a:0 "\"Direitos para os camponeses!\""
 ep3_contract_event.0095.a_2:0 "Eu os liderarei apenas na guerra."
 ep3_contract_event.0095.a_become_landed:0 "@warning_icon! #X Se você vencer a guerra, você se tornará [landed|E]#!"
 ep3_contract_event.0095.a_lose:0 "$ep3_contract_event.0083.a_lose$"
 ep3_contract_event.0095.a_remain_laamp:0 "@alert_icon! #alert_trial Se você vencer a guerra, você permanecerá um [adventurer|E]#!"
 ep3_contract_event.0095.a_win:0 "$ep3_contract_event.0083.a_win$"
 ep3_contract_event.0095.b:0 "Eles estão na verdade... sozinhos."
 ep3_contract_event.0095.c:0 "\"Não, espere: eu posso explicar tudo!\""
 ep3_contract_event.0095.c_lose:0 "[task_contract_councillor.GetFirstNameNoTooltip] é categórico que você falhou no contrato"
 ep3_contract_event.0095.c_tie:0 "Você persuade [task_contract_councillor.GetFirstNameNoTooltip] a simplesmente anular o contrato"
 ep3_contract_event.0095.c_win:0 "Você convence [task_contract_councillor.GetFirstNameNoTooltip] que de alguma forma cumpriu seu contrato"
 ep3_contract_event.0095.desc:0 "Recebo a notícia: meu apoio às preocupações do povo comum os incitou à ação! O povo valente se reúne em grupos orgulhosos, aclamando meu nome e agitando armas improvisadas — prontos para uma revolta! Infelizmente, essa notícia também chegou a [task_contract_councillor.GetName].\n\n\"Eu pensei que tínhamos um acordo? Que você estava reunindo aqueles tolos para dar um susto neles! Não, por [task_contract_councillor.GetFaith.GoodGodNames], para #EMP chorar#! pela situação desses canalhas! E agora, #EMP o que#! — você se juntará aos plebeus na revolta!?\""
 ep3_contract_event.0095.t:0 "$ep3_contract_event.0092.t$"
 ep3_contract_event.0100.a:0 "Oh, [task_contract_councillor.GetSheHe] é bom, mas eu posso fazer melhor!"
 ep3_contract_event.0100.desc:0 "Eu deveria me encontrar com [task_contract_councillor.GetCouncilTitleFirstName] [Select_CString( task_contract_councillor_liege.IsFemale, 'da', 'do' )] [task_contract_councillor_liege.GetName], mas quando cheguei em [task_contract_destination.GetName], o [task_contract_destination.GetHolding.GetType.GetName|l] parece vazio... ninguém por aqui?\n\n\"Você parece confuso, aventureiro,\" vem um sussurro das sombras, \"Você realmente está apto para essa tarefa? O que precisamos é de alguém vigilante, cauteloso, sutil...\"\n\nOlho freneticamente ao meu redor: a voz parece vir de uma direção diferente a cada palavra.\n\n\"Você não parece ser nenhum desses...\" diz a voz, enquanto [task_contract_councillor.GetNameNoTooltip] aparece atrás de mim."
 ep3_contract_event.0100.t:0 "$contract_event_prefix$ $laamp_help_find_secrets_contract_contract$"
 ep3_contract_event.0510.a.critfailure:0 "Sua retórica falha completamente"
 ep3_contract_event.0510.a.failure:0 "Você falha em fazer um argumento convincente"
 ep3_contract_event.0510.a.success:0 "Você convence [peasant.GetSheHe] e qualquer ouvinte"
 ep3_contract_event.0510.a:0 "Se eu convencer este local, os outros seguirão o exemplo."
 ep3_contract_event.0510.b.critfailure:0 "Você julga mal a situação, e #EMP verdadeiros#! problemas surgem"
 ep3_contract_event.0510.b.failure:0 "[peasant.GetFirstNameNoTooltip] zomba de suas ameaças"
 ep3_contract_event.0510.b.success:0 "Suas ameaças funcionam"
 ep3_contract_event.0510.b:0 "A força faz o certo..."
 ep3_contract_event.0510.c:0 "Talvez uma bolsa de ouro possa conquistar a lealdade deste camponês..."
 ep3_contract_event.0510.desc:0 "Chego em [location.GetName] para encontrá-lo em algo como um alvoroço. O povo pequeno está claramente descontentemente, e seu líder — um [peasant.GetWomanMan] chamado [peasant.GetFirstName] — harangueia uma multidão reunida.\n\n\"[task_contract_employer.GetTitledFirstName]? Que tipo de #EMP [task_contract_employer.GetTitleAsNameNoTooltip]#! [task_contract_employer.GetSheHe] é!\" [peasant.GetSheHe|U] ruge. \"Costumávamos ter #EMP verdadeiros#! governantes, nomeados por [peasant.GetFaith.FateGodName]!\"\n\nO discurso é apaixonado, mas grande parte da multidão claramente balança incerta com suas lealdades."
 ep3_contract_event.0510.t:0 "Direito de Governar"
 ep3_contract_event.0520.a:0 "Excelente."
 ep3_contract_event.0520.b:0 "Bem... eu tentei."
 ep3_contract_event.0520.desc.critfailure:0 "Eu realmente não esperava uma verdadeira fortaleza de oposição.\n\nMinha tentativa de intimidar o camponês afunda como uma pedra em um lago, e a situação se torna feia com uma velocidade horripilante. Enquanto dou as costas e fujo, minha capa fica encharcada de saliva e sou atingido por uma enxurrada de vegetais podres.\n\nAparentemente, a reputação [Select_CString( task_contract_employer.IsFemale, 'da', 'do' )] [task_contract_employer.GetTitledFirstName] está mudando de uma maneira #EMP bastante#! diferente do que prometi a [task_contract_employer.GetSheHe]..."
 ep3_contract_event.0520.desc.failure:0 "A situação nos escapa — rápido. Eu não esperava fogo e retórica de um simples camponês, mas as respostas retumbantes [Select_CString( peasant.IsFemale, 'da', 'do' )] [peasant.GetFirstName] às minhas palavras fracas enviam a multidão ao furor.\n\nEu dou uma retirada apressada! A ralé está cantando e jogando pedras, repetindo todos os insultos proferidos por seu líder.\n\n[task_contract_employer.GetTitledFirstName] não vai gostar disso..."
 ep3_contract_event.0520.desc.success:0 "O camponês tumultuado estava determinado, mas toda a determinação se desfez diante da minha convicção. A multidão, que antes estava prestes a ser incitada à violência, logo começa a se aquietar.\n\nEventualmente, eles se dispersam, professando fé no lugar legítimo [Select_CString( task_contract_employer.IsFemale, 'da', 'do' )] [task_contract_employer.GetTitledFirstName] como governante de [location.GetName]. Representantes do meu empregador depõem suas armas, professando gratidão pelo meu trabalho e passando minha recompensa merecida."
 ep3_contract_event.0520.t.critfailure:0 "$ep3_contract_event.0510.t$: Falha Excepcional"
 ep3_contract_event.0520.t.failure:0 "$ep3_contract_event.0510.t$: Falha"
 ep3_contract_event.0520.t.success:0 "$ep3_contract_event.0510.t$: Sucesso"
 ep3_contract_event.0550.a.tt:0 "Abra a carta."
 ep3_contract_event.0550.a:0 "Vamos ver o que me espera..."
 ep3_contract_event.0550.desc:0 "Chego ao local combinado em [location.GetName]. Há pouquíssimas pessoas por perto, mas avisto alguém se aproximando: envolto de cabeça a pé em um manto, essa figura secreta sussurra para mim.\n\n\"Você é [ROOT.Char.GetFirstNameNoTooltip], sim?\"\n\nEu aceno, e [messenger.GetSheHe] silenciosamente me entrega uma missiva. Apressando-se, o mensageiro logo se dissolve na escuridão.\n\nClaramente, [task_contract_employer.GetTitledFirstName] está determinado a que nenhum desses negócios seja rastreado de volta a [task_contract_employer.GetSheHe]..."
 ep3_contract_event.0550.t:0 "Criador de Problemas: Mensagens na Escuridão"
 ep3_contract_event.0555.a:0 "Ah... eu devo me livrar de um[Select_CString( councillor.IsFemale, 'a', '' )] [councillor.GetActiveCouncilTask.GetPositionName] indisciplinad[Select_CString( councillor.IsFemale, 'a', 'o' )]."
 ep3_contract_event.0555.desc:0 "Espero que você entenda a necessidade de discrição. O desespero me forçou a isso, e por isso não posso me dar ao luxo de mostrar minhas cartas.\n\nSeu alvo é [councillor.GetName]. [councillor.GetSheHe|U] deve ser removido... do poder ou deste mundo completamente: não me importa.\n\nVocê pode encontrar [councillor.GetSheHe] esta noite, em um lugar conhecido como [ROOT.Char.Custom('GetPubName')]. Destrua esta missiva e nunca fale sobre isso novamente."
 ep3_contract_event.0560.a.critfailure:0 "A luta vai terrivelmente mal"
 ep3_contract_event.0560.a.failure:0 "Você atrapalha a emboscada e deve fugir"
 ep3_contract_event.0560.a.neutral:0 "[councillor.GetFirstNameNoTooltip] morre na luta"
 ep3_contract_event.0560.a.success:0 "A luta é rápida, sem testemunhas deixadas vivas"
 ep3_contract_event.0560.a:0 "#EMP Entro pela porta da frente!#!"
 ep3_contract_event.0560.b.failure:0 "O alarme é acionado, frustrando você"
 ep3_contract_event.0560.b.neutral:0 "Há uma luta, e as pessoas notam sua fuga"
 ep3_contract_event.0560.b.success:0 "Funciona perfeitamente"
 ep3_contract_event.0560.b:0 "Uma faca no banheiro terá que servir."
 ep3_contract_event.0560.c.critfailure:0 "Você é peg[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] no ato de envenenar"
 ep3_contract_event.0560.c.critsuccess:0 "O veneno nunca é detectado"
 ep3_contract_event.0560.c.failure:0 "[councillor.GetFirstNameNoTooltip] apenas fica doente"
 ep3_contract_event.0560.c.success:0 "Quando o veneno é notado, já é tarde demais"
 ep3_contract_event.0560.c:0 "Talvez envenenar a bebida [councillor.GetHerHim]?"
 ep3_contract_event.0560.contractcritfailure:0 "Seu [task_contract|E] é uma #N Falha Excepcional#!"
 ep3_contract_event.0560.contractcritsuccess:0 "Seu [task_contract|E] é um #P Sucesso Excepcional#!"
 ep3_contract_event.0560.contractfailure:0 "Seu [task_contract|E] é um #N Falha#!"
 ep3_contract_event.0560.contractsuccess:0 "Seu [task_contract|E] é um #P Sucesso#!"
 ep3_contract_event.0560.d.critsuccess:0 "Você sequestra com sucesso [councillor.GetFirstNameNoTooltip]"
 ep3_contract_event.0560.d.failure:0 "[councillor.GetFirstNameNoTooltip] escapa"
 ep3_contract_event.0560.d.success:0 "Seu alvo oferece resistência e deve ser dominado"
 ep3_contract_event.0560.d:0 "Um sequestro eficaz poderia servir ao mesmo propósito..."
 ep3_contract_event.0560.desc:0 "A taverna estava próxima. Enquanto espreito discretamente pela entrada dos fundos, consigo ver [councillor.GetActiveCouncilTask.GetPositionName] [Select_CString( task_contract_employer.IsFemale, 'da', 'do' )] [task_contract_employer.GetTitleAsNameNoTooltip] desfrutando de uma noite ruidosa, ceg[Select_CString( councillor.IsFemale, 'a', 'o' )] a todo perigo.\n\nEste poderia ser um trabalho simples... apenas entrar e despedaçar [councillor.GetTitledFirstName]. Mas talvez uma abordagem mais sutil também funcione?\n\nTalvez, até mesmo... eu poderia deixar [Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetWomanMan] infeliz viver?"
 ep3_contract_event.0560.t:0 "Criador de Problemas: Um[Select_CString( councillor.IsFemale, 'a', '' )] [councillor.GetActiveCouncilTask.GetPositionName] Turbulent[Select_CString( councillor.IsFemale, 'a', 'o' )]"
 ep3_contract_event.0565.a:0 "[councillor.GetSheHe|U] nunca será ouvid[Select_CString( councillor.IsFemale, 'a', 'o' )] novamente."
 ep3_contract_event.0565.b:0 "Maldição."
 ep3_contract_event.0565.desc.critfailure:0 "Um desastre absoluto! Toda a ira do estabelecimento hostil se voltou contra mim, e tive sorte de escapar com a vida.\n\nLimpando minhas feridas em um rio próximo, eu me cobro de lama e luto para reatar minha bagagem.\n\nDevo continuar a fugir... [councillor.GetTitledFirstName] vive, e [task_contract_employer.GetTitledFirstName] ficará furios[Select_CString( task_contract_employer.IsFemale, 'a', 'o' )] comigo. Apenas um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] tol[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ficaria aqui."
 ep3_contract_event.0565.desc.critsuccess:0 "A eliminação [Select_CString( councillor.IsFemale, 'da', 'do' )] [councillor.GetTitledFirstName] é brutalmente rápida; [Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetWomanMan] morre na ignomínia, silenciad[Select_CString( councillor.IsFemale, 'a', 'o' )] antes mesmo que seus companheiros possam levantar um alvoroço.\n\nA luz fria do dia quase limpa meus pecados; um banho em um riacho local faz o resto.\n\nUm agente aguarda na margem — se é o mesmo de antes, não posso dizer — com um punhado de sacos pesados.\n\n\"[Select_CString( task_contract_employer.IsFemale, 'A', 'O' )] [task_contract_employer.GetTitleAsNameNoTooltip] agradece pelo seu trabalho. [task_contract_employer.GetSheHe|U] incluiu um presente adicional como sinal de gratidão [task_contract_employer.GetHerHim].\""
 ep3_contract_event.0565.desc.failure:0 "Ainda assim, os gritos, o barulho de pratos e bancos jogados, os golpes duros ecoam em meus ouvidos. Eu esfrego furiosamente minhas mãos, mas este riacho não pode limpar as marcas da falha.\n\nQue bagunça. [councillor.GetTitledFirstName] vive, e meu contrato com [task_contract_employer.GetTitledFirstName] está anulado. Eu não deveria demorar aqui, caso contrário, a vingança de uma fonte ou outra pode me encontrar."
 ep3_contract_event.0565.desc.success:0 "[councillor.GetTitledFirstFirstName] não está mais. O ato de violência é um pouco grosseiro, mas a verdade é a mesma: eu matei meu alvo.\n\nA luz fria do dia quase limpa meus pecados; um banho em um riacho local faz o resto.\n\nUm agente aguarda na margem — se é o mesmo de antes, não posso dizer — com um saco pesado pendurado na sela [messenger.GetHerHim].\n\n\"[Select_CString( task_contract_employer.IsFemale, 'A', 'O' )] [task_contract_employer.GetTitleAsNameNoTooltip] agradece pelo seu trabalho. Seu serviço será lembrado.\""
 ep3_contract_event.0565.t.critfailure:0 "Criador de Problemas: Falha Excepcional"
 ep3_contract_event.0565.t.critsuccess:0 "Criador de Problemas: Sucesso Excepcional"
 ep3_contract_event.0565.t.failure:0 "Criador de Problemas: Falha"
 ep3_contract_event.0565.t.success:0 "Criador de Problemas: Sucesso"
 ep3_contract_event.0570.a.tt:0 "#V Duelo#! [prisonguard.GetFirstNameNoTooltip].\nSua [prowess|E]: [prowess_i]#V [root_for_loc.GetProwess]#!\n[prowess|E] d[Select_CString( prisonguard.IsFemale, 'a', 'o' )] [prisonguard.GetFirstName]: [prowess_i]#V [prisonguard.GetProwess]#!"
 ep3_contract_event.0570.a:0 "Espere até que [prisonguard.GetSheHe] retorne, espada em punho."
 ep3_contract_event.0570.b.failure.tt:0 "Você sofre ferimentos enquanto escapa"
 ep3_contract_event.0570.b.failure:0 "O guarda não é enganado"
 ep3_contract_event.0570.b.success:0 "Sua distração funciona"
 ep3_contract_event.0570.b:0 "Talvez eu possa distrair o guarda?"
 ep3_contract_event.0570.c.failure:0 "Você fica sem tempo e precisa escapar"
 ep3_contract_event.0570.c.success:0 "Você destranca a porta"
 ep3_contract_event.0570.c:0 "Vai ser apertado, mas eu #EMP poderia#! destrancar a porta a tempo..."
 ep3_contract_event.0570.desc:0 "Ao chegar em [location.GetName], algumas perguntas me direcionam para o local que estou procurando. Encontro [task_contract_employer.GetFirstName] angustiad[Select_CString( task_contract_employer.IsFemale, 'a', 'o' )], acorrentad[Select_CString( task_contract_employer.IsFemale, 'a', 'o' )] a uma parede dentro de um prédio levemente vigiado.\n\nUm guarda faz patrulha regularmente, e aproveito a chance no momento em que [prisonguard.GetSheHe] está ausente para me aproximar da cela [Select_CString( task_contract_employer.IsFemale, 'da', 'do' )] [task_contract_employer.GetFirstNameNoTooltip].\n\n\"Você veio me ajudar?\" [task_contract_employer.GetSheHe] pergunta frac[Select_CString( task_contract_employer.IsFemale, 'a', 'o' )]. \"Por favor, rapidamente: você deve me libertar antes que aqueles desgraçados que me aprisionaram voltem!\""
 ep3_contract_event.0570.t:0 "Resgatador"
 ep3_contract_event.0575.a:0 "É um prazer tê-l[Select_CString( task_contract_employer.IsFemale, 'a', 'o' )]!"
 ep3_contract_event.0575.b:0 "Uma pena."
 ep3_contract_event.0575.desc.duel:0 "O corpo sem vida do guarda cai no chão, e eu já estou cortando todos os bolsos, chaves e afins. Encontro algumas moedas e [newly_created_artifact.GetName], mas não há mais tempo a perder.\n\n"
 ep3_contract_event.0575.desc.failure:0 "A fuga foi um desastre. [task_contract_employer.GetFirstName] ainda está acorrentad[Select_CString( task_contract_employer.IsFemale, 'a', 'o' )] à parede, e qualquer esperança de ganhar seu serviço como recompensa pelo resgate está em ruínas.\n\nTudo o que posso fazer é voltar para meu cavalo — inconspicuamente, pois posso estar sendo perseguido — e me preparar para retornar de onde vim."
 ep3_contract_event.0575.desc.success:0 "Precisamos nos mover rapidamente. As algemas se soltam, caindo no chão com um alto #EMP clang#!, e então estamos fora. Através da porta da prisão, pela entrada, ao redor da esquina e em plena luz do dia. Liberdade.\n\n\"Não posso agradecer o suficiente!\" [task_contract_employer.GetFirstName] diz, sua respiração ainda vindo em ofegos devido ao esforço. \"Estou em dívida. Meu serviço para você começa agora.\""
 ep3_contract_event.0575.t.failure:0 "$ep3_contract_event.0570.t$: Falha"
 ep3_contract_event.0575.t.success:0 "$ep3_contract_event.0570.t$: Sucesso"
 ep3_contract_event.0580.a.failure:0 "Você não consegue distinguir claramente"
 ep3_contract_event.0580.a.success:0 "Você se esgueira perto o suficiente para ouvir"
 ep3_contract_event.0580.a:0 "Aproximar-me um pouco mais..."
 ep3_contract_event.0580.b.failure:0 "[task_contract_employer.GetFirstNameNoTooltip] não acredita em você de jeito nenhum"
 ep3_contract_event.0580.b.success:0 "[task_contract_employer.GetFirstNameNoTooltip] acredita na sua mentira"
 ep3_contract_event.0580.b:0 "Talvez se eu apenas #EMP fingisse#! que sabia..."
 ep3_contract_event.0580.c.failure:0 "[secret_haver.GetFirstNameNoTooltip] escarnece de suas ameaças"
 ep3_contract_event.0580.c.neutral.tt:0 "[secret_haver.GetFirstNameNoTooltip] tem um sorriso estranho no rosto [secret_haver.GetHerHim]..."
 ep3_contract_event.0580.c.neutral:0 "[secret_haver.GetFirstNameNoTooltip] propõe um acordo"
 ep3_contract_event.0580.c.success:0 "Suas ameaças funcionam"
 ep3_contract_event.0580.c.tt:0 "Ameaças abertas podem ter sucesso onde a escuta falhou."
 ep3_contract_event.0580.c:0 "Estou farto de me esconder."
 ep3_contract_event.0580.desc:0 "Suspeitas d[Select_CString( task_contract_employer.IsFemale, 'a', 'o' )] [task_contract_employer.GetTitledFirstName] recaem sobre [Select_CString( secret_haver.IsFemale, 'sua', 'seu' )] [task_contract_employer.Custom2('RelationToMeShort', SCOPE.sC('secret_haver'))], [secret_haver.GetTitledFirstName], e assim me encontro seguindo [secret_haver.GetSheHe] pelos corredores de um[secret_haver.GetFaith.HouseOfWorship].\n\n[secret_haver.GetSheHe|U] está claramente em profunda consulta com [secret_haver.GetHerselfHimself]. Aproveito para me aproximar mais, escondendo-me atrás de uma parede saliente.\n\nEu #EMP quase#! consigo ouvir as palavras sussurradas [secret_haver.GetHerHim]. Se são uma confissão para [secret_haver.GetFaith.HighGodName] ou apenas murmúrios insensatos, não consigo identificar... "
 ep3_contract_event.0580.t:0 "Informação Classificada"
 ep3_contract_event.0581.a:0 "Eu tenho um contrato a cumprir."
 ep3_contract_event.0581.b:0 "É uma oferta tentadora..."
 ep3_contract_event.0581.desc:0 "Enquanto avanço em direção [Select_CString( secret_haver.IsFemale, 'a', 'ao' )] [secret_haver.GetTitledFirstName] de maneira ameaçadora, [secret_haver.GetSheHe] levanta suas mãos em um apelo.\n\n\"Espere! Eu sei que você já ouviu o suficiente. Sei que você vai conseguir o resto de mim. Mas tenho uma proposta.\"\n\n\"Eu sei exatamente quem te colocou nisso. Seu empregador não é tão isento de segredos quanto [task_contract_employer.GetSheHe] faz parecer.\"\n\n\"Se eu lhe der isso...\" [secret_haver.GetSheHe] estende um pequeno saco de ouro, deslizando um anel do dedo [secret_haver.GetHerHim] enquanto faz isso, \"...talvez você seja persuadido a levar isso e esse conhecimento com você e manter meu segredo seguro?\""
 ep3_contract_event.0581.t:0 "$ep3_contract_event.0580.t$: Um Novo Acordo"
 ep3_contract_event.0585.a:0 "Excelente."
 ep3_contract_event.0585.b:0 "Maldições!"
 ep3_contract_event.0585.desc.failure:0 "\"Você é um tolo. S[Select_CString( ROOT.Char.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('task_contract_employer'))] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))]!\" [task_contract_employer.GetTitledFirstName] não fica muito impressionado com meus esforços para descobrir o segredo d[Select_CString( secret_haver.IsFemale, 'a', 'o' )] [secret_haver.GetFirstName].\n\n\"Eu simplesmente #EMP devo#! saber desse segredo! Todos que envio são incompetentes ou alguns mentirosos mesquinhos! Eu pensei que você poderia quebrar essa sequência.\" [task_contract_employer.GetSheHe|U] gesticula para a porta, com o lábio curvado.\n\n\"Saia. Espero que nossos caminhos nunca se cruzem novamente, [ROOT.Char.GetTitledFirstNameNoTooltip].\""
 ep3_contract_event.0585.desc.liedsuccessfully:0 "\"Sério?\" Eu aguardo com a respiração suspensa enquanto [task_contract_employer.GetTitledFirstName] considera minha mentira descarada. \"Sim... sim! Isso faz #EMP perfeito#! sentido!\"\n\nSolto um suspiro de alívio enquanto [task_contract_employer.GetSheHe] gesticula para um guarda trazer minha recompensa.\n\n\"Não é exatamente o que eu esperava, é claro, mas quando você #EMP pensa#! sobre isso...\" [task_contract_employer.GetSheHe] claramente não está mais falando comigo, mas sim com [task_contract_employer.GetHerselfHimself].\n\nHora de fazer uma retirada apressada."
 ep3_contract_event.0585.desc.success:0 "\"Excelente! Excelente!\" [task_contract_employer.GetTitledFirstName] brada, enquanto trago a notícia para [task_contract_employer.GetSheHe]. \"Eu já suspeitava, é claro, mas ter isso confirmado...\"\n\n[task_contract_employer.GetSheHe|U] gesticula para um guarda trazer meu pagamento, acariciando o queixo em reflexão.\n\n\"Sua recompensa. Caso eu precise de ajuda no futuro, não hesite em responder meu chamado. Adeus, [ROOT.Char.GetTitledFirstNameNoTooltip].\""
 ep3_contract_event.0585.t.failure:0 "$ep3_contract_event.0580.t$: Falha"
 ep3_contract_event.0585.t.success:0 "$ep3_contract_event.0580.t$: Sucesso"
 ep3_contract_event.0590.a.failure:0 "[heir.GetFirstNameNoTooltip] ouve você se aproximando e foge"
 ep3_contract_event.0590.a.success:0 "[heir.GetFirstNameNoTooltip] morre silenciosamente"
 ep3_contract_event.0590.a:0 "Chega disso. É hora de morrer, [heir.GetFirstNameNoTooltip]."
 ep3_contract_event.0590.b.failure:0 "[heir.GetFirstNameNoTooltip] ouve você se aproximando"
 ep3_contract_event.0590.b.fatalbonk:0 "Você bate [Select_CString( heir.IsFemale, 'nela', 'nele' )] um pouco #EMP forte demais#!"
 ep3_contract_event.0590.b.success:0 "[heir.GetFirstNameNoTooltip] desmaia"
 ep3_contract_event.0590.b:0 "Talvez eu possa incapacitar [heir.GetSheHe]?"
 ep3_contract_event.0590.c.critfailure:0 "Você deixa escapar quem te contratou para isso"
 ep3_contract_event.0590.c.failure:0 "[heir.GetFirstNameNoTooltip] ridiculariza sua história"
 ep3_contract_event.0590.c.success:0 "[heir.GetFirstNameNoTooltip] concorda em ir com você"
 ep3_contract_event.0590.c:0 "Talvez se eu explicar a situação..."
 ep3_contract_event.0590.desc:0 "[Select_CString( heir.IsFemale, 'Herdeira problemática', 'Herdeiro problemático' )] d[Select_CString( task_contract_employer.IsFemale, 'a', 'o' )] [task_contract_employer.GetTitledFirstName], [heir.GetTitledFirstName], é um pouco descuidado quando se trata de proteção pessoal. Um passeio tarde da noite pode tirar o estresse, mas outra lâmina está prestes a encontrar seu caminho...\n\nE ainda assim, algo imobiliza minha mão. Estou contratado para fazer um trabalho, mas parece... estranho.\n\nTalvez haja outra forma de contornar isso?"
 ep3_contract_event.0590.t:0 "Trabalho Sujo"
 ep3_contract_event.0591.a:0 "\"Boa sorte para você!"
 ep3_contract_event.0591.desc.camewillingly:0 "Eu me sento em uma pedra, observando [heir.GetTitledFirstName] prender uma bolsa ao cavalo [heir.GetHerHim]. A jornada até a periferia de [location.GetName] foi todo o tempo que eu precisava para explicar a situação, e [heir.GetFirstNameNoTooltip] estava muito feliz em seguir.\n\n\"Obrigado por me poupar.\" [heir.GetSheHe|U] diz, assim que a bolsa estava segura. \"Não vou esquecer. Espero que nossos caminhos se cruzem novamente.\" Com isso, [heir.GetSheHe] começa a trotar para longe, acenando em despedida."
 ep3_contract_event.0591.desc.knockedout:0 "Eu me sento em uma pedra na periferia de [location.GetName], observando [heir.GetTitledFirstName] lentamente voltar a si. Meu golpe na cabeça [heir.GetHerHim] foi claramente bem medido: [heir.GetSheHe] terá uma dor de cabeça por um dia, mas nenhum dano duradouro deve ser causado.\n\nLeva-me alguns momentos para explicar a situação. Considerando a reviravolta na vida [heir.GetHerHim], [heir.GetFirstNameNoTooltip] aceita notavelmente bem.\n\n\"Obrigado por me poupar.\" [heir.GetSheHe|U] diz, segurando uma bolsa no cavalo que eu trouxe para ele. \"Não vou esquecer. Espero que nossos caminhos se cruzem novamente.\" Com isso, [heir.GetSheHe] começa a trotar para longe, acenando em despedida."
 ep3_contract_event.0591.t:0 "$ep3_contract_event.0590.t$: Segunda Chance"
 ep3_contract_event.0595.a:0 "De volta à estrada..."
 ep3_contract_event.0595.desc:0 "Minhas tentativas de cumprir os desejos d[Select_CString( task_contract_employer.IsFemale, 'a', 'o' )] [task_contract_employer.GetFirstName] estão em ruínas.\n\n[heir.GetFirstName|U] vive, um espinho no lado d[Select_CString( task_contract_employer.IsFemale, 'a', 'o' )] [task_contract_employer.GetFirstNameNoTooltip]. Por minha parte, devo sair de [location.GetName] rapidamente, a menos que a ira do meu empregador me encontre."
 ep3_contract_event.0595.t:0 "$ep3_contract_event.0590.t$: Ação Desfeita"
