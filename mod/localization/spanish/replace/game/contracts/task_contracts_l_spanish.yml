 laamp_boost_legitimacy_contract_contract:0 "Promoção de Legitimidade"
 laamp_boost_legitimacy_contract_desc:0 "[Select_CString( TaskContract.GetEmployer.IsFemale, 'A', 'O' )] [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] requer um orador de palavras doces para ajudar seus camponeses indisciplinados a entender que [TaskContract.GetEmployer.GetSheHe] tem um direito inimitável de governar. Aparições locais devem ser feitas."
 laamp_boost_legitimacy_contract_desc_title:0 "Viajeiros de boa linhagem,"
 laamp_boost_legitimacy_contract_request:0 "Este [task_contract|E] exige que você [travel|E] para [TaskContract.GetLocation.GetName]."
 laamp_construction_contract_contract:0 "Trabalho de Construção"
 laamp_construction_contract_desc:0 "Um esforço de construção mandatado pel[Select_CString( TaskContract.GetEmployer.IsFemale, 'a', 'o' )] [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] está com escassez de materiais. Uma grande soma está em oferta pela aquisição de novos suprimentos de construção."
 laamp_construction_contract_desc_title:0 "Vendedores engenhosos de experiência,"
 laamp_construction_contract_request:0 "Este [task_contract|E] requer que você vá para um [county|E] e fique à toa até que a [building|E] seja finalizada"
 laamp_council_task_contract_desc_councillor:0 "Meu senhor feudal, [TaskContract.GetTarget.GetName],"
 laamp_council_task_contract_desc_liege:0 "[Select_CString( TaskContract.GetEmployer.IsFemale, 'A', 'O' )] [TaskContract.GetEmployer.GetTitleAsNameNoTooltip]"
 laamp_cultural_minority_contract_contract:0 "Proteger o Patrimônio"
 laamp_cultural_minority_contract_desc:0 "[TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] busca a ajuda de colegas [TaskContract.GetEmployer.GetCulture.GetCollectiveNoun] — ou qualquer outro que esteja disposto a advogar por seus direitos com [TaskContract.GetEmployer.GetLiege.GetName]."
 laamp_cultural_minority_contract_desc_title:0 "Ouçam nossa aflição!"
 laamp_cultural_minority_contract_request:0 "Este [task_contract|E] requer que você complete sua escolha entre um [scheme|E] [Concept('diplomacy', 'Diplomático')|E], [martial|E], de [intrigue|E] ou de [learning|E]"
 laamp_eliminate_heir_contract_contract:0 "Eliminar Herdeiro"
 laamp_eliminate_heir_contract_desc:0 "Uma lâmina experiente e silenciosa é necessária para... resolver problemas familiares. Conexões chave e uma recompensa rica à disposição."
 laamp_eliminate_heir_contract_desc_title:0 "Assassinos da estrada aberta,"
 laamp_eliminate_heir_contract_request:0 "Este [task_contract|E] exige que você [travel|E] para [TaskContract.GetLocation.GetName]."
 laamp_fight_faith_conversion_contract_contract:0 "Silenciar Missionários"
 laamp_fight_faith_conversion_contract_desc:0 "Missionários [TaskContract.MakeScope.Var('task_contract_councillor').Char.GetFaith.GetAdjectiveNoTooltip] assombram comunidades [TaskContract.GetEmployer.GetFaith.GetAdjectiveNoTooltip]. Buscamos um negociador habilidoso ou um brutamontes intimidador para lidar com esses pagãos."
