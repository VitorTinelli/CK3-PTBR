 ADVENTURER_PEASANT_LEADER_DUCHY_NAME_adj:0 "Livre [new_capital_duchy.GetAdjectiveNoTooltip]"
 EVENT_WINDOW_OPTION_AVAILABLE_INCREASE_CONTROL_BANDITS:0 "Esta opção está disponível devido ao banditismo neste condado"
