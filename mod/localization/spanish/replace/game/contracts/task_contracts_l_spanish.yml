 laamp_base_1011_request:0 "$laamp_request_boilerplate_martial_scheme$"
 laamp_base_1021_request:0 "$laamp_request_boilerplate_martial_scheme$"
 laamp_base_1031_request:0 "$laamp_request_boilerplate_martial_scheme$"
 laamp_base_1041_contract:0 "$laamp_base_1041_contract_scheme$"
 laamp_base_1041_request:0 "Este [task_contract|E] requer que você [Concept('travel', 'viaje')|E] para uma [holding|E] distante, emboscando [characters|E] para pegar seu [gold|E] no caminho através de desafios de [prowess|E], [martial|E] ou [intrigue|E].\n$laamp_request_boilerplate_criminal$"
 laamp_base_2001_contract:0 "$laamp_base_2001_contract_scheme$"
 laamp_base_2001_request:0 "Este [task_contract|E] requer que você [Concept('travel', 'viaje')|E] para uma [holding|E] da [city|E] & investigá-lo através de eventos. Sua recompensa total depende de provar que seus [characters|E] não estão pagando sua parte justa de impostos completando desafios de [skill|E] de [stewardship|E] ou desafios de [aptitude|E] de [GetCourtPositionType('quartermaster_camp_officer').GetName()]."
 laamp_base_2011_contract:0 "$laamp_base_2011_contract_scheme$"
 laamp_base_2011_request:0 "Este [task_contract|E] requer que você [Concept('travel', 'viaje')|E] para várias [holdings|E] no [realm|E] [contractor_possessive|E], passando por um desafio de [skill|E] de [stewardship|E], um de [intrigue|E], ou um desafio de [aptitude|E] de [GetCourtPositionType('quartermaster_camp_officer').GetName()]."
 laamp_base_2021_contract:0 "$laamp_base_2021_contract_scheme$"
 laamp_base_2021_request:0 "$laamp_request_boilerplate_stewardship_scheme$"
 laamp_base_2031_contract:0 "$laamp_base_2031_contract_scheme$"
 laamp_base_2031_request:0 "Este [task_contract|E] requer que você [Concept('travel', 'viaje')|E] para uma [holding|E] de [baron|E] e complete um desafio. Você terá a garantia de poder testar [stewardship|E], mas outras opções dependerão do que é a questão, qual [camp_purpose|E] você tem, seus [followers|E] e seus [officers|E]."
 laamp_base_2041_contract:0 "$laamp_base_2041_contract_scheme$"
 laamp_base_2041_request:0 "Este [task_contract|E] requer que você [Concept('travel', 'viaje')|E] para até #BOL [TaskContract.GetEmployer.MakeScope.ScriptValue('laamp_base_2041_num_counties_to_rob_sans_capital_value')|0]#! [counties|E] nas terras [Select_CString( TaskContract.GetEmployer.IsFemale, 'da', 'do' )] [TaskContract.GetEmployer.GetTitledFirstName], completando desafios de [stewardship|E], [intrigue|E] ou [GetCourtPositionType('master_bard_camp_officer').GetName()] [aptitude|E] cada vez mais difíceis para enganar os súditos [TaskContract.GetEmployer.GetHerHim] e fazê-los entregar impostos destinados [Select_CString( TaskContract.GetEmployer.IsFemale, 'a', 'ao' )] [TaskContract.GetEmployer.GetTitleAsNameNoTooltip]\n$laamp_request_boilerplate_criminal$"
 laamp_base_3001_contract:0 "$laamp_base_3001_contract_scheme$"
 laamp_base_3001_request:0 "Este [task_contract|E] requer que você [Concept('travel', 'viaje')|E] para três [counties|E], realizando desafios de [intrigue|E] ou [diplomacy|E] em cada um — ou simplesmente queimando [prestige|E] e [opinion|E]"
 laamp_base_3011_contract:0 "$laamp_base_3011_contract_scheme$"
 laamp_base_3011_request:0 "$laamp_request_boilerplate_intrigue_scheme$\n$laamp_request_boilerplate_criminal$"
 laamp_base_3021_contract:0 "$laamp_base_3021_contract_scheme$"
 laamp_base_3021_request:0 "$laamp_request_boilerplate_intrigue_scheme$\n$laamp_request_boilerplate_criminal$"
 laamp_base_3031_contract:0 "$laamp_base_3031_contract_scheme$"
 laamp_base_3031_request:0 "Este [task_contract|E] requer que você [Concept('travel', 'viaje')|E] para um [location|E] e cometa incêndio criminoso através de um desafio de [intrigue|E]. [martial|E], [prowess|E] e seus [officers|E] também podem ser usados em vez disso.\n$laamp_request_boilerplate_criminal$"
 laamp_base_3041_contract:0 "$laamp_base_3041_contract_scheme$"
 laamp_base_3041_request:0 "$laamp_request_boilerplate_intrigue_scheme$; se você tiver sucesso, poderá testar sua [intrigue|E], [agents|E] e [officers|E] para roubar ainda mais [gold|E]\n$laamp_request_boilerplate_criminal$"
