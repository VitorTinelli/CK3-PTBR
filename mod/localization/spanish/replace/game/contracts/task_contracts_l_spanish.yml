 laamp_base_5021_request:0 "$laamp_request_boilerplate_prowess_scheme$"
 laamp_base_5031_contract:0 "$laamp_base_5031_contract_scheme$"
 laamp_base_5031_request:0 "Esta [task_contract|E] requer que você [Concept('travel', 'viaje')|E] para várias [Concept('location', 'locais')|E], roubando gado em cada uma através de um desafio de [prowess|E]. Você também pode testar o maior valor entre [martial|E] ou [stewardship|E], ou usar certos [officers|E] em vez disso.\n$laamp_request_boilerplate_criminal$"
 laamp_base_5041_request:0 "$laamp_request_boilerplate_prowess_scheme$\n$laamp_request_boilerplate_criminal$"
 laamp_base_5051_contract:0 "$laamp_base_5051_contract_scheme$"
 laamp_base_5051_request:0 "$laamp_request_boilerplate_prowess_scheme$, embora ao longo do $game_concept_scheme$ você também receberá eventos especiais para assaltar locais ricos por [gold|E] extra fora da recompensa geral.\n$laamp_request_boilerplate_criminal$"
