 laamp_base_1001_contract:0 "$laamp_base_1001_contract_scheme$"
 laamp_base_1001_request:0 "Este [task_contract|E] requer que você mate um [character|E] em particular, seja através de um [single_combat_duel|E], completando um desafio de [skill|E] [martial|E], ou lançando seus [men_at_arms|E] contra eles e enfrentando perdas."
