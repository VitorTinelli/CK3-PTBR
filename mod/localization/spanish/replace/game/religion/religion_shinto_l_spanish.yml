 shinto_desc:0 "O mundo espiritual está ao nosso redor, e os espíritos habitam todas as partes do mundo. Qualquer coisa pode ser habitada pelo sobrenatural — uma cama, uma montanha, até mesmo uma tempestade. É importante manter a harmonia com esse mundo espiritual e dar a ele o devido respeito e reconhecimento."
