 hussite_desc:0 "Uma fé reformista boêmia nascida da convicção de que Roma se desviou do caminho apostólico. Os hussitas insistem na comunhão em pão e vinho para os leigos, nas escrituras na língua vernácula e em um clero despojado de riquezas e emaranhados mundanos."
 iconoclast:0 "Iconoclastismo"
