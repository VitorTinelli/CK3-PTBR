 miaphysitism_adherent_plural:0 "Coptas"
 miaphysitism_adj:0 "copta"
 miaphysitism_desc:0 "Rastreando suas origens até São Marcos Evangelista, a Igreja Copta é famosa tanto por ser o berço do monaquismo cristão quanto por manter uma longa tradição de promoção da educação e da filosofia."
 mozarabic_church:0 "Moçarabismo"
 mozarabic_church_adherent:0 "Moçárabe"
 mozarabic_church_adherent_plural:0 "Moçárabes"
 mozarabic_church_adj:0 "Moçárabe"
 mozarabic_church_desc:0 "Descendente dos primeiros ritos ibéricos, o cristianismo moçárabe manteve um nível de independência de Roma devido aos séculos sob domínio islâmico. Sua longa convivência com outras religiões os tornou mais tolerantes com as diferenças do que seitas mais fundamentalistas."
 nestorian:0 "Nestorianismo"
 nestorian_adherent:0 "Nestoriano"
 nestorian_adherent_plural:0 "Nestorianos"
 nestorian_adj:0 "Nestoriano"
 nestorian_desc:0 "Ao ensinar que Jesus Cristo tem duas naturezas, uma divina e outra humana, o nestorianismo foi declarado herético pela maioria das religiões cristãs. Apesar disso, sua visão única atraiu seguidores em lugares tão distantes como China, Índia e até Mongólia."
 nestorian_religious_head_title:0 "Patriarca"
 nestorian_religious_head_title_female:0 "Patriarca"
