 joachimite_adj:0 "joaquimita"
 joachimite_desc:0 "Uma fé mística apocalíptica que lê as escrituras e a história como uma revelação tripartite — a Era do Pai, a Era do Filho e uma iminente Era do Espírito Santo na qual a Igreja institucional dará lugar a uma ordem contemplativa de pregadores descalços e desprovidos de propriedades."
 lollard:0 "Lolardismo"
 lollard_adherent:0 "Lolardia"
 lollard_adherent_plural:0 "Lolardios"
 lollard_adj:0 "Lolardia"
 lollard_desc:0 "Denunciando muitos sacramentos cristãos comuns, como o batismo e a confissão, os lolardos sustentam que a Bíblia Sagrada é a única fonte válida da doutrina cristã e que qualquer ensino não baseado diretamente nela é inerentemente ilegítimo."
 messalian:0 "Messalianismo"
 messalian_adherent:0 "Messaliano"
 messalian_adherent_plural:0 "Messalianos"
 messalian_adj:0 "Messaliano"
 messalian_desc:0 "Acreditando que a essência de Deus pode ser percebida através dos sentidos carnais, os messalianos rejeitam os sacramentos cristãos tradicionais e, em vez disso, procuram experimentar Deus diretamente por meios menos convencionais de adoração."
 messalian_priest:0 "perfeito"
 messalian_priest_plural:0 "perfeitos"
 miaphysitism:0 "Copta"
