 adamites_adj:0 "Adamita"
 adamites_desc:0 "Os adamitas afirmam ter recapturado o estado original de inocência de Adão e Eva, tirando suas roupas. Grupos de adamitas muitas vezes vivem em um estado de absoluta ilegalidade, alegando que, devido a essa inocência, suas ações não podem ser boas nem más."
 adoptionist:0 "Adocionismo"
 adoptionist_adherent:0 "Adocionista"
 adoptionist_adherent_plural:0 "Adocionistas"
 adoptionist_adj:0 "Adocionista"
 adoptionist_desc:0 "O ramo ibérico do Adocionismo traça suas raízes a uma combinação de pensamento independente no Arcebispado de Toledo e suas dioceses vizinhas, ao puritanismo norte-africano dos séculos passados e a vários hereges extremamente carismáticos do início do nono século. \n\nEmbora assuma muitas formas, desde as mais sutis até as mais diretas, o ponto doutrinário unificador é uma atitude questionadora em relação à divindade eterna do Filho."
