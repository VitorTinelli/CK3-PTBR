 special_doctrine_adoptionist_school_elipandic_doctrine_desc:0 "Preferindo focar em variações sutis na Cristologia, a variante Elipandista do $adoptionist$ enfatiza a importância de diferenças precisas em relação ao dogma trinitário. Uma distinção complexa bem-feita é considerada infinitamente melhor do que uma explicação simples mal justificada."
 special_doctrine_adoptionist_school_elipandic_doctrine_name:0 "Escola Elipandista"
 special_doctrine_adoptionist_school_felicitous_doctrine_desc:0 "Os adeptos felicianos do $adoptionist$ acreditam na praticidade acima da pureza, entendendo que devem trabalhar dentro de sistemas hostis para miná-los. Uma mentira abominável em busca de uma causa nobre é considerada valer mais do que mil verdades inúteis."
 special_doctrine_adoptionist_school_felicitous_doctrine_name:0 "Escola Felicista"
 special_doctrine_adoptionist_school_radical_doctrine_desc:0 "Os adeptos radicais do $adoptionist$ não reconhecem nenhum Deus além do Pai, não aceitam nenhuma divindade da carne mortal e não reconhecem nenhum $christianity_religion_adherent_plural$ além de si mesmos. Receber Cristo sem concordar com cada letra do cânone é reconhecer a apostasia."
 special_doctrine_adoptionist_school_radical_doctrine_name:0 "Escola Radical"
 special_doctrine_ecumenical_christian_desc:0 "Nossos líderes religiosos historicamente estiveram envolvidos em diálogos inter-religiosos para aumentar a cooperação entre as diferentes denominações cristãs."
 special_doctrine_ecumenical_christian_name:0 "Ecumenismo"
 special_doctrine_ecumenical_miaphysite_desc:0 "Apesar de suas hierarquias separadas, as igrejas miafisistas permanecem em plena comunhão, reconhecendo os sacramentos e o clero umas das outras."
 special_doctrine_ecumenical_miaphysite_name:0 "Comunhão Miafisista"
 special_doctrine_fire_worship_desc:0 "Todos nós somos unidos por nossa veneração ao fogo, o elemento mais puro e agente da glória divina. É nosso dever sagrado manter as chamas eternas acesas no mundo, para dissipar a falsidade e o mal."
 special_doctrine_fire_worship_name:0 "Fogo Sagrado"
 special_doctrine_full_tolerance_desc:0 "Todos são livres para escolher sua própria fé. Nossas diferenças não nos dividem, elas nos tornam mais fortes."
 special_doctrine_full_tolerance_name:0 "Tolerância Total"
 special_doctrine_has_clerical_electors_desc:0 "Esta [faith|E] eleita seu [head_of_faith|E] através de [cardinals|E]."
 special_doctrine_has_clerical_electors_name:0 "Eleitores Clericais"
 special_doctrine_has_jizya_doctrine_name:0 "$tenet_tax_nonbelievers_jizya_name$"
 special_doctrine_is_christian_faith_desc:0 "Há aqueles no mundo que aderem aos ensinamentos de Jesus sem reconhecer sua divindade. Embora blasfemo, ainda devemos mostrar compaixão por essas almas desorientadas, pois elas podem se converter à verdadeira fé algum dia."
 special_doctrine_is_christian_faith_name:0 "Ensinos de Jesus"
 special_doctrine_is_eastern_christian_faith_desc:0 "Pertence a uma tradição cristã oriental (Ortodoxa, Miafisista, Igreja do Oriente, etc.)."
 special_doctrine_is_eastern_christian_faith_name:0 "Cristão Oriental"
 special_doctrine_is_eastern_faith_desc:0 "Juntos, não somos unidos por uma única fé, mas pelas muitas fé que compõem o tecido religioso de nossa sociedade. Embora possamos nos chamar por nomes diferentes e seguir caminhos diferentes, alguns de fora de nosso próprio sistema de crenças aprenderam a conviver em nossa sociedade como se fossem um de nós."
 special_doctrine_is_eastern_faith_name:0 "Entrelaçamento Multirreligioso"
 special_doctrine_is_gnostic_faith_desc:0 "$tenet_gnosticism_desc$"
 special_doctrine_is_gnostic_faith_name:0 "$tenet_gnosticism_name$"
 special_doctrine_is_islamic_faith_desc:0 "Embora não sigam todas as leis do Profeta, há alguns neste mundo que são mais guiados pela vontade de Allah do que sabem. Com o tempo, esses meios-convertidos podem até abandonar seus caminhos malignos e se tornarem verdadeiros membros da Ummah!"
 special_doctrine_is_islamic_faith_name:0 "Ensinos do Profeta"
 special_doctrine_is_jewish_faith_desc:0 "Nem todos entre os gentios vivem no pecado. Há aqueles que respeitam o povo escolhido de Deus e esses merecem nossa consideração em troca."
 special_doctrine_is_jewish_faith_name:0 "Ensinos de Moisés"
 special_doctrine_is_maitreya_desc:0 "É nosso dever solene reconstruir o mundo e inaugurar a era do Buda Maitreya."
 special_doctrine_is_maitreya_descriptive_name:0 "$maitreya_adj$ Adotam os ensinamentos de Buda"
 special_doctrine_is_maitreya_name:0 "É $maitreya$"
 special_doctrine_is_sinitic_faith_desc:0 "$special_doctrine_is_eastern_faith_desc$"
 special_doctrine_is_sinitic_faith_name:0 "Cosmologia Sínica"
 special_doctrine_is_western_christian_faith_desc:0 "Pertence à tradição cristã ocidental (latina)."
 special_doctrine_is_western_christian_faith_name:0 "Cristão Ocidental"
 special_doctrine_jizya_desc:0 "$tenet_tax_nonbelievers_desc$"
 special_doctrine_jizya_name:0 "$tenet_tax_nonbelievers_jizya_name$"
 special_doctrine_maitreya_hostility_desc:0 "$maitreya_adherent_plural$ buscam destruir todos os outros seguidores dos ensinamentos do Buda. Embora nem todos sigam o mesmo caminho, os caminhos de $maitreya$ são intoleráveis."
 special_doctrine_maitreya_hostility_descriptive_name:0 "Hostilidade para com $maitreya_adherent_plural$"
 special_doctrine_maitreya_hostility_name:0 "Hostil aos $maitreya_adherent_plural$"
 special_doctrine_naked_priests_desc:0 "Nossos sacerdotes sabem que roupas aprisionam o espírito e nos impedem de alcançar a verdadeira iluminação. Apenas ao nos despirmos de nossas vestes podemos despertar nossas almas e experimentar o amor de [ROOT.Faith.HighGodNamePossessive]."
 special_doctrine_naked_priests_descriptive_name:0 "$special_doctrine_naked_priests_name$"
 special_doctrine_naked_priests_name:0 "Sacerdotes Nus"
 special_doctrine_not_allowed_to_hof_desc:0 "O Sacerdócio Maior desta fé foi completamente desmantelado. Qualquer tentativa de nomear um Sumo Sacerdote requer primeiro uma reconstrução completa da estrutura tradicional da igreja."
 special_doctrine_not_allowed_to_hof_name:0 "Sacerdócio Desmantelado"
