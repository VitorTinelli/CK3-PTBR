 unreformed_faith_doctrine_desc:0 "Uma fé não reformada não possui um clero organizado e doutrinas canônicas estabelecidas; diferentes comunidades podem seguir nominalmente a mesma fé enquanto possuem práticas religiosas e crenças muito diferentes."
