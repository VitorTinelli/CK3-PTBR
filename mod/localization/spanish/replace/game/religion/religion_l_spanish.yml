 divine_destiny_doctrine_desc:0 "Somos aqueles que vão inaugurar uma era de paz e prosperidade para todos os povos. Somos os governantes legítimos do mundo."
 divine_destiny_doctrine_descriptive_name:0 "$divine_destiny_doctrine_name$"
 divine_destiny_doctrine_name:0 "Governantes Legítimos do Mundo"
 divine_destiny_name:0 "Destino Divino"
 doctrine_adultery_men_accepted_desc:0 "Não há nada intrinsecamente errado em um homem decidir se envolver em relação sexual fora do casamento, então a decisão é dele sozinho."
 doctrine_adultery_men_accepted_descriptive_name:0 "Adultério Masculino Aceito"
 doctrine_adultery_men_accepted_name:0 "Aceito"
 doctrine_adultery_men_crime_desc:0 "É crime para os homens se envolverem em relações sexuais fora do casamento, e eles serão punidos de acordo."
 doctrine_adultery_men_crime_descriptive_name:0 "Adultério Masculino Criminoso"
 doctrine_adultery_men_crime_name:0 "Crime"
 doctrine_adultery_men_name:0 "Adulterio Masculino"
 doctrine_adultery_men_shunned_desc:0 "É pecaminoso para os homens se envolverem em relações sexuais fora do casamento, mas como todos os pecados, é o divino que deve julgá-los por suas falhas."
 doctrine_adultery_men_shunned_descriptive_name:0 "Adultério Masculino Evitado"
 doctrine_adultery_men_shunned_name:0 "Desprezado"
 doctrine_adultery_women_accepted_desc:0 "Não há nada intrinsecamente errado em uma mulher decidir se envolver em relação sexual fora do casamento, então a decisão é dela sozinha."
 doctrine_adultery_women_accepted_descriptive_name:0 "Adultério Feminino Aceito"
 doctrine_adultery_women_accepted_name:0 "Aceita"
 doctrine_adultery_women_crime_desc:0 "É crime para as mulheres se envolverem em relações sexuais fora do casamento, e elas serão punidas de acordo."
 doctrine_adultery_women_crime_descriptive_name:0 "Adultério Feminino Criminoso"
 doctrine_adultery_women_crime_name:0 "Criminoso"
 doctrine_adultery_women_name:0 "Adultério Feminino"
 doctrine_adultery_women_shunned_desc:0 "É pecaminoso para as mulheres se envolverem em relações sexuais fora do casamento, mas como todos os pecados, é o divino quem deve julgá-las por suas falhas."
 doctrine_adultery_women_shunned_descriptive_name:0 "Adultério Feminino Evitado"
 doctrine_adultery_women_shunned_name:0 "Evitada"
 doctrine_bastardry_all_desc:0 "Os laços do casamento são sagrados e as crianças nascidas fora do casamento sempre serão ilegítimas."
 doctrine_bastardry_all_descriptive_name:0 "Ilegitimidade de Bastardos"
 doctrine_bastardry_all_name:0 "Sem Legitimação"
 doctrine_bastardry_legitimization_desc:0 "O casamento é sagrado, então as crianças nascidas fora dele devem ser abençoadas de outra maneira se quiserem ser consideradas legítimas."
 doctrine_bastardry_legitimization_descriptive_name:0 "Legitimação de Bastardos"
 doctrine_bastardry_legitimization_name:0 "Legitimação"
 doctrine_bastardry_name:0 "Bastardia"
 doctrine_bastardry_none_desc:0 "O sangue determina a linhagem, não o casamento. Crianças nascidas fora do casamento são tão legítimas quanto qualquer outra."
 doctrine_bastardry_none_descriptive_name:0 "Sempre Legítimos Bastardos"
 doctrine_bastardry_none_name:0 "Sem Bastardos"
 doctrine_christianity_monasticism_default_desc:0 "$tenet_monasticism_desc$\n\n$pam_matthew_16_24_default$\n\n[Glossary('Monasticism Historical Background','doctrine_monasticism_christianity_historical_desc')]"
 doctrine_christianity_monasticism_greek_desc:0 "$tenet_monasticism_desc$\n\n$pam_matthew_16_24_greek$\n\n[Glossary('Monasticism Historical Background','doctrine_monasticism_christianity_historical_desc')]"
 doctrine_christianity_monasticism_latin_desc:0 "$tenet_monasticism_desc$\n\n$pam_matthew_16_24_latin$\n\n[Glossary('Monasticism Historical Background','doctrine_monasticism_christianity_historical_desc')]"
 doctrine_clerical_function_alms_and_pacification_desc:0 "Nossos [ROOT.Faith.PriestNeuterPlural] são responsáveis por garantir que os pobres e oprimidos tenham comida e abrigo suficientes quando não podem provê-los por si mesmos."
 doctrine_clerical_function_alms_and_pacification_descriptive_name:0 "Esmolas e Pacificação Clericais"
 doctrine_clerical_function_alms_and_pacification_name:0 "Esmolas e Pacificação"
 doctrine_clerical_function_name:0 "Função Clerical"
 doctrine_clerical_function_recruitment_desc:0 "Nossos [ROOT.Faith.PriestNeuterPlural] podem pegar em armas e defender nossa fé. A responsabilidade de liderar como exemplo lhes concede força extra em combate."
 doctrine_clerical_function_recruitment_descriptive_name:0 "Funções Militares para o Clero"
 doctrine_clerical_function_recruitment_name:0 "Recrutamento"
 doctrine_clerical_function_taxation_desc:0 "O [ROOT.Faith.AltPriestTermPlural] deriva sua autoridade de [ROOT.Faith.HighGodName] [ROOT.Faith.HighGodHerselfHimself], e isso ainda se aplica aqui na Terra."
 doctrine_clerical_function_taxation_descriptive_name:0 "Funções de Controle para o Clero"
 doctrine_clerical_function_taxation_name:0 "Controle"
 doctrine_clerical_gender_either_desc:0 "Qualquer pessoa que tenha sentido o chamado divino deve ser capaz de servir como um [ROOT.Faith.PriestNeuterPlural], independentemente de seu gênero."
 doctrine_clerical_gender_either_descriptive_name:0 "Gêneros Irrestritos para o Clero"
 doctrine_clerical_gender_either_name:0 "Qualquer Gênero"
 doctrine_clerical_gender_female_only_desc:0 "Apenas mulheres são sábias o suficiente para interpretar a vontade de [ROOT.Faith.HighGodNamePossessive] e servir como [ROOT.Faith.PriestFemalePlural] de nossa fé."
 doctrine_clerical_gender_female_only_descriptive_name:0 "Clero Restrito a Mulheres"
 doctrine_clerical_gender_female_only_name:0 "Apenas Mulheres"
 doctrine_clerical_gender_male_only_desc:0 "Apenas homens podem assumir a grande responsabilidade de servir como [ROOT.Faith.PriestMalePlural] de nossa fé."
 doctrine_clerical_gender_male_only_descriptive_name:0 "Clero Restrito a Homens"
 doctrine_clerical_gender_male_only_name:0 "Apenas Homens"
 doctrine_clerical_gender_name:0 "Gênero Clerical"
 doctrine_clerical_marriage_allowed_desc:0 "O casamento é uma instituição sagrada, e os [ROOT.Faith.PriestNeuterPlural] devem ser capazes de participar dela como qualquer outro fiel."
 doctrine_clerical_marriage_allowed_descriptive_name:0 "Casamento Clerical Permitido"
 doctrine_clerical_marriage_allowed_name:0 "Permitido"
 doctrine_clerical_marriage_disallowed_desc:0 "Tornar-se um [ROOT.Faith.PriestNeuter] significa dedicar a vida a [ROOT.Faith.HighGodName]. É inerentemente infiel considerar ter um cônjuge mortal além disso."
 doctrine_clerical_marriage_disallowed_descriptive_name:0 "Casamento Clerical Proibido"
 doctrine_clerical_marriage_disallowed_name:0 "Não Permitido"
 doctrine_clerical_marriage_name:0 "Casamento Clerical"
 doctrine_clerical_succession_conditional_can_pick_tt:0 "Esta [doctrine|E] não pode ser escolhida livremente; ela só pode ser restabelecida por meio de um concílio ecumênico"
 doctrine_clerical_succession_conditional_desc:0 "O direito de substituir os detentores de títulos clericais permanece indefinido. Tal arranjo contestado inevitavelmente conduz a fé a um [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]."
 doctrine_clerical_succession_conditional_descriptive_name:0 "Nomeação Clerical Condicional"
 doctrine_clerical_succession_conditional_name:0 "Condicional"
 doctrine_clerical_succession_name:0 "Nomeação Clerical"
 doctrine_clerical_succession_spiritual_appointment_desc:0 "Embora os [ROOT.Faith.AltPriestTermPlural] devam nomear todos os [ROOT.Faith.BishopNeuterPlural], os governantes seculares ainda devem ser capazes de demitir aqueles que falharem com eles."
 doctrine_clerical_succession_spiritual_appointment_descriptive_name:0 "Nomeação Clerical Espiritual Revogável"
 doctrine_clerical_succession_spiritual_appointment_name:0 "Espiritual, Revogável"
 doctrine_clerical_succession_spiritual_fixed_appointment_desc:0 "[ROOT.Faith.BishopNeuterPlural|U] são servos do divino, e como representantes do divino, a escolha que os [ROOT.Faith.AltPriestTermPlural] fazem para a posição é final e absoluta."
 doctrine_clerical_succession_spiritual_fixed_appointment_descriptive_name:0 "Nomeação Clerical Espiritual Vitalícia"
 doctrine_clerical_succession_spiritual_fixed_appointment_name:0 "Espiritual, Vitalícia"
 doctrine_clerical_succession_temporal_appointment_desc:0 "[ROOT.Faith.BishopNeuterPlural|U] são servos do reino e, portanto, devem poder ser contratados e demitidos por seu senhor feudal com apenas pequenas restrições."
 doctrine_clerical_succession_temporal_appointment_descriptive_name:0 "Nomeação Clerical Temporal Revogável"
 doctrine_clerical_succession_temporal_appointment_name:0 "Temporária, Revogável"
 doctrine_clerical_succession_temporal_fixed_appointment_desc:0 "Embora um governante deva ser capaz de selecionar seu próprio [ROOT.Faith.BishopNeuterPlural], suas responsabilidades são sagradas e divinas, e sua nomeação não deve estar sujeita a revogação."
 doctrine_clerical_succession_temporal_fixed_appointment_descriptive_name:0 "Nomeação Clerical Temporal Vitalícia"
 doctrine_clerical_succession_temporal_fixed_appointment_name:0 "Temporária, Vitalícia"
 doctrine_communion_historical_desc:0 "Na refeição da Páscoa, na véspera de sua crucificação, Cristo abençoou o pão, partiu-o e deu-o aos seus discípulos, dizendo #weak 'Isto é o meu corpo, que é dado por vós. Fazei isto em memória de mim.'#! Ele declarou o cálice de vinho o seu sangue da nova aliança, derramado para o perdão dos pecados.\n\nEsta instituição da Eucaristia tornou-se o ato central do culto cristão, repetido em cada missa e liturgia divina. Para os crentes, a comunhão é uma participação no sacrifício de Cristo, e não apenas um memorial, unindo os fiéis ao seu Salvador e uns aos outros."
 doctrine_concubines_desc:0 "O casamento é um laço sagrado, mas desde que o cônjuge tenha prioridade, pode ser permitido ter concubinas para se relacionar também."
 doctrine_concubines_descriptive_name:0 "Concubinato"
 doctrine_concubines_name:0 "Concubinas"
 doctrine_consanguinity_aunt_nephew_and_uncle_niece_desc:0 "Desde que não sejam diretamente relacionados, membros da família podem se casar entre si pelo bem da dinastia."
 doctrine_consanguinity_aunt_nephew_and_uncle_niece_descriptive_name:0 "$doctrine_consanguinity_aunt_nephew_and_uncle_niece_name$"
 doctrine_consanguinity_aunt_nephew_and_uncle_niece_name:0 "Casamento de Avunculado"
 doctrine_consanguinity_cousins_desc:0 "Primos podem ser parentes, mas suficientemente distantes para que seja aceitável que se casem para preservar sua linhagem."
 doctrine_consanguinity_cousins_descriptive_name:0 "$doctrine_consanguinity_cousins_name$"
 doctrine_consanguinity_cousins_name:0 "Casamento entre Primos"
 doctrine_consanguinity_dynastic_desc:0 "É estritamente proibido casar-se com alguém com quem você compartilhe sobrenome e ascendência comum, não importando o quão distante seja o parentesco, assim como não é aceitável casar-se com aqueles de outros sobrenomes próximos por sangue."
 doctrine_consanguinity_dynastic_descriptive_name:0 "Casamento Proibido na Dinastia"
 doctrine_consanguinity_dynastic_name:0 "Proibição Linear"
 doctrine_consanguinity_name:0 "Consanguinidade"
 doctrine_consanguinity_restricted_desc:0 "É um pecado contra [ROOT.Faith.HighGodName] permitir que dois parentes se casem ou se envolvam em relações sexuais."
 doctrine_consanguinity_restricted_descriptive_name:0 "Casamento Proibido com Parentes Próximos"
 doctrine_consanguinity_restricted_name:0 "Tabu de Parentesco Próximo"
 doctrine_consanguinity_unrestricted_desc:0 "É natural e saudável que membros da família se amem, e aqueles que dizem que o amor deve ser restrito a relações não sexuais são tolos."
 doctrine_consanguinity_unrestricted_descriptive_name:0 "$doctrine_consanguinity_unrestricted_name$"
 doctrine_consanguinity_unrestricted_name:0 "Casamento sem restrições"
 doctrine_deviancy_accepted_desc:0 "O amor é belo e sagrado, não importa a forma que ele tome. Todos devem ser permitidos a amar e fazer o que quiserem."
 doctrine_deviancy_accepted_descriptive_name:0 "Desvio Aceito"
 doctrine_deviancy_accepted_name:0 "Aceito"
 doctrine_deviancy_crime_desc:0 "É claro que há apenas uma maneira correta de amar outra pessoa. Qualquer desvio desse formato é pecaminoso e deve ser punido."
 doctrine_deviancy_crime_descriptive_name:0 "Desvio Criminoso"
 doctrine_deviancy_crime_name:0 "Criminoso"
 doctrine_deviancy_name:0 "Desvio"
 doctrine_deviancy_shunned_desc:0 "Existem algumas práticas sexuais que são simplesmente anormais e estranhas. É razoável pensar que as pessoas com esses desejos são igualmente anormais e estranhas."
 doctrine_deviancy_shunned_descriptive_name:0 "Desvio Evitado"
 doctrine_deviancy_shunned_name:0 "Evitado"
 doctrine_deviancy_virtuous_desc:0 "Os prazeres da carne nos aproximam do divino, e assim aqueles que estão livres de desejos convencionais são o ápice da virtude em nossa fé."
 doctrine_deviancy_virtuous_descriptive_name:0 "Desvio Virtuoso"
 doctrine_deviancy_virtuous_name:0 "Virtuoso"
 doctrine_divorce_allowed_desc:0 "O casamento é apenas uma parceria entre duas pessoas e, como todas as parcerias, pode ser encerrado a qualquer momento."
 doctrine_divorce_allowed_descriptive_name:0 "Divórcio Sempre Permitido"
 doctrine_divorce_allowed_name:0 "Sem Restrições"
 doctrine_divorce_approval_desc:0 "Embora os laços do casamento não devam ser levados a sério, circunstâncias atenuantes às vezes podem tornar o divórcio uma necessidade."
 doctrine_divorce_approval_descriptive_name:0 "Divórcio Condicionalmente Aprovado"
 doctrine_divorce_approval_name:0 "Aprovado com Restrições"
 doctrine_divorce_disallowed_desc:0 "Os votos do casamento são finais e vinculantes. Somente a morte pode nos separar."
 doctrine_divorce_disallowed_descriptive_name:0 "Divórcio Proibido"
 doctrine_divorce_disallowed_name:0 "Não Permitido"
 doctrine_divorce_name:0 "Divórcio"
 doctrine_family_rites_desc:0 "A morte é um período de luto e rituais para os que permanecem vivos. Hierarquia e senioridade importam tanto na morte quanto na vida; é importante venerar os mais idosos mesmo após seu falecimento, e ser visto venerando da maneira correta."
 doctrine_family_rites_descriptive_name:0 "Ritos de Sepultamento Familiar"
 doctrine_family_rites_name:0 "Ritos Familiares"
 doctrine_funeral_bewailment_desc:0 "A alma iniciou sua longa jornada para [ROOT.Faith.PositiveAfterLife] e nunca mais a veremos no mundo dos vivos. É imperativo que todos que conheceram o falecido se reúnam e ofereçam seu lamento em uma demonstração pública de tristeza. Isso tanto honra os mortos quanto purifica nossas almas da dor sentida por sua partida."
 doctrine_funeral_bewailment_name:0 "Sepultamento de Lamento"
 doctrine_funeral_cremation_desc:0 "Das cinzas viemos, às cinzas retornamos. O corpo de nosso falecido é disposto em uma grande pira funerária, e as cinzas resultantes são espalhadas pela terra para continuar a jornada dos mortos."
 doctrine_funeral_cremation_name:0 "Cremação"
 doctrine_funeral_mummification_desc:0 "O corpo deixou de funcionar, mas ainda é o vaso pelo qual o espírito irá viajar para [ROOT.Faith.PositiveAfterLife]. Portanto, a forma física deve ser tão constante quanto a alma, aguardando o julgamento de [ROOT.Faith.FateGodName]."
 doctrine_funeral_mummification_name:0 "Mumificação"
 doctrine_funeral_name:0 "Tradição Funerária"
 doctrine_funeral_sky_burial_desc:0 "$tenet_sky_burials_desc$"
 doctrine_funeral_sky_burial_name:0 "$tenet_sky_burials_name$"
 doctrine_funeral_stoic_desc:0 "O corpo morreu, mas a alma vive. A morte não é um tempo para tristeza e lamento, mas sim um funeral deve honrar os mortos ao entregar seu corpo à terra em uma cerimônia quieta e humilde."
 doctrine_funeral_stoic_name:0 "Sepultamento Estoico"
 doctrine_gender_equal_desc:0 "É tolo negar a pessoas habilidosas um papel no governo puramente por causa de seu gênero. Permitiremos que todos que são capazes governem nossa sociedade."
 doctrine_gender_equal_descriptive_name:0 "Igualdade de Gênero"
 doctrine_gender_equal_name:0 "Igualdade"
 doctrine_gender_female_dominated_desc:0 "As mulheres provaram repetidamente que apenas elas possuem a sabedoria e prudência necessárias para governar adequadamente nossa sociedade."
 doctrine_gender_female_dominated_descriptive_name:0 "Sociedade Domination Feminina"
 doctrine_gender_female_dominated_name:0 "Dominação Feminina"
 doctrine_gender_male_dominated_desc:0 "Os homens são mais fortes e melhor equipados para nos liderar neste mundo duro e implacável, então devemos confiar a eles o governo de nossa sociedade."
 doctrine_gender_male_dominated_descriptive_name:0 "Sociedade Dominada por Homens"
 doctrine_gender_male_dominated_name:0 "Dominação Masculina"
 doctrine_gender_name:0 "Visão sobre Gênero"
 doctrine_head_of_faith_desc:0 "O [head_of_faith|E] é o líder de uma [faith|E]"
 doctrine_head_of_faith_name:0 "Líder da Fé"
 doctrine_homosexuality_accepted_desc:0 "O amor transcende a fisicalidade em algo tão profundo e maravilhoso que não pode ser restringido pelo mero gênero."
 doctrine_homosexuality_accepted_descriptive_name:0 "Relações entre Pessoas do Mesmo Sexo Aceitas"
 doctrine_homosexuality_accepted_name:0 "Aceito"
 doctrine_homosexuality_crime_desc:0 "Os desejos pecaminosos dos sodomitas são um perigo para a própria sociedade, então eles devem ser punidos e presos por suas transgressões."
 doctrine_homosexuality_crime_descriptive_name:0 "Relações entre Pessoas do Mesmo Sexo Criminosas"
 doctrine_homosexuality_crime_name:0 "Crime"
 doctrine_homosexuality_name:0 "Relações entre pessoas do mesmo sexo"
 doctrine_homosexuality_shunned_desc:0 "É antinatural que dois homens se envolvam em relações sexuais um com o outro, independentemente das circunstâncias."
 doctrine_homosexuality_shunned_descriptive_name:0 "Relações entre Pessoas do Mesmo Sexo Evitadas"
 doctrine_homosexuality_shunned_name:0 "Evitado"
 doctrine_kinslaying_accepted_desc:0 "O assassinato da própria família não é diferente de qualquer outro assassinato e deve ser tratado da mesma forma."
 doctrine_kinslaying_accepted_descriptive_name:0 "Parricídio e Homicídio de Parentes Aceitos"
 doctrine_kinslaying_accepted_name:0 "Aceito"
 doctrine_kinslaying_any_dynasty_member_crime_desc:0 "Todos os parentes são unidos pelo sangue, e matar até mesmo um parente distante é um crime grave contra toda a dinastia. Tais transgressões não serão esquecidas."
 doctrine_kinslaying_any_dynasty_member_crime_descriptive_name:0 "Homicídio de Membro da Dinastia Criminoso"
 doctrine_kinslaying_any_dynasty_member_crime_name:0 "Criminoso Dinástico"
 doctrine_kinslaying_close_kin_crime_desc:0 "O fratricídio e atos similares não podem ser tolerados em uma sociedade justa e correta. Aqueles que cometem tais ofensas serão punidos."
 doctrine_kinslaying_close_kin_crime_descriptive_name:0 "Homicídio de Parente Próximo Criminoso"
 doctrine_kinslaying_close_kin_crime_name:0 "Parentes Próximos são Criminosos"
 doctrine_kinslaying_extended_family_crime_desc:0 "O assassinato da própria família é um dos crimes mais abomináveis que se pode cometer. Quem comete tal ato será severamente punido."
 doctrine_kinslaying_extended_family_crime_descriptive_name:0 "Homicídio de Familiar Distante Criminoso"
 doctrine_kinslaying_extended_family_crime_name:0 "Familiar é Crime"
 doctrine_kinslaying_name:0 "Fratricídio"
 doctrine_kinslaying_shunned_desc:0 "Embora seja chocante matar parentes próximos, tais atos não são inherentemente mais criminosos do que qualquer outro assassinato."
 doctrine_kinslaying_shunned_descriptive_name:0 "Homicídio de Parentes Evitado"
 doctrine_kinslaying_shunned_name:0 "Evitado"
 doctrine_marriage_type_name:0 "Tipo de Casamento"
 doctrine_monasticism_absent_desc:0 "O monaquismo nunca foi estabelecido nesta tradição. A vida religiosa é vivida no mundo; não há caminho formal de isolamento ou votos perpétuos."
 doctrine_monasticism_absent_descriptive_name:0 "Sem Monaquismo"
 doctrine_monasticism_absent_name:0 "Ausente"
 doctrine_monasticism_accepted_desc:0 "A vida monástica é permitida, mas não é central para a fé. Os devotos podem fazer votos e retirar-se para casas religiosas, embora a tradição não enfatize o monaquismo como o caminho ideal."
 doctrine_monasticism_accepted_descriptive_name:0 "Aceitar o Monaquismo"
 doctrine_monasticism_accepted_name:0 "Aceito"
 doctrine_monasticism_christianity_historical_desc:0 "O monaquismo espalhou-se por todo o mundo católico durante a Idade Média, com mosteiros estabelecidos por toda a Europa, Norte da África e Oriente Médio. Monges e freiras faziam votos de pobreza, castidade e obediência, vivendo seja como eremitas em celas isoladas, seja em comunidades sob regras estritas.\n\nEstas instituições cumpriam múltiplas funções: preservar manuscritos e textos clássicos, fornecer educação, operar hospitais e hospícios, gerenciar propriedades agrícolas e oferecer hospitalidade a viajantes. Ordens monásticas como os beneditinos, cistercienses e cartuxos desenvolveram tradições distintas sobre oração, trabalho e vida comunitária."
 doctrine_monasticism_encouraged_desc:0 "$doctrine_monasticism_general_desc$"
 doctrine_monasticism_encouraged_descriptive_name:0 "Encorajar o Monaquismo"
 doctrine_monasticism_encouraged_name:0 "Encorajado"
 doctrine_monasticism_forbidden_desc:0 "Esta fé rejeita explicitamente a vida monástica. Fazer votos é proibido, e aqueles que possuem o traço monástico são considerados criminosos aos olhos da fé."
 doctrine_monasticism_forbidden_descriptive_name:0 "Proibir o Monaquismo"
 doctrine_monasticism_forbidden_name:0 "Proibido"
 doctrine_monasticism_general_desc:0 "$tenet_monasticism_desc$\n\n[Glossary('Monasticism Historical Background','doctrine_monasticism_general_historical_desc')]"
 doctrine_monasticism_general_historical_desc:0 "Comunidades monásticas existem em várias tradições religiosas, não apenas no cristianismo, mas também no budismo, hinduísmo e jainismo. Essas instituições envolvem tipicamente indivíduos que se afastam da sociedade comum para buscar a devoção religiosa por meio de oração, meditação, estudo e práticas ascéticas.\n\nMosteiros frequentemente funcionam como centros de aprendizado, preservando textos sagrados e fornecendo educação. Eles podem estar completamente isolados da população ao redor ou manter envolvimento ativo por meio de obras de caridade, atendimento médico e produção agrícola. As regras específicas que governam a vida monástica variam amplamente entre tradições e comunidades individuais."
 doctrine_monasticism_name:0 "$tenet_monasticism_name$"
 doctrine_monogamy_desc:0 "O casamento é um laço sagrado entre duas pessoas. Tentar formar esse laço com várias pessoas ao mesmo tempo é sacrilégio."
 doctrine_monogamy_descriptive_name:0 "Monogamia"
 doctrine_monogamy_name:0 "Monogâmico"
 doctrine_monotheist_desc:0 "Apenas um deus é adorado. Outros chamados de 'deuses' são, no melhor dos casos, ídolos vazios, e no pior, tentativas de algum enganador maligno para desviar os fiéis da adoração adequada de [ROOT.Faith.HighGodName].[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'mandala_monotheist_warning')]"
 doctrine_monotheist_descriptive_name:0 "Monoteísmo"
 doctrine_monotheist_name:0 "Monoteísta"
 doctrine_mythic_literary_desc:0 "A fé se espalha e persiste através de histórias de obras divinas, muitas das quais coletadas em obras literárias."
 doctrine_mythic_literary_descriptive_name:0 "Preservação Mítico-Literária"
 doctrine_mythic_literary_name:0 "Mítico-Literário"
 doctrine_no_head_desc:0 "É pura tolice assumir que uma única pessoa possa compreender verdadeiramente a vontade de [ROOT.Faith.HighGodName]. Devemos seguir nossos próprios corações para descobrir o que [ROOT.Faith.HighGodSheHe] planejou para nós."
 doctrine_no_head_descriptive_name:0 "Sem Líder da Fé"
 doctrine_no_head_name:0 "Nenhum"
 doctrine_oral_storytelling_desc:0 "Mitos de criação e lições morais são codificados em narrativas populares, que são recontadas através de gerações e culturas."
 doctrine_oral_storytelling_name:0 "Tradição Oral"
