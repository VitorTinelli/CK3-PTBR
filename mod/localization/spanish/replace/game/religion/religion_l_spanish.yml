 doctrine_pilgrimage_encouraged_desc:0 "Esta fé incentiva seus membros a visitar locais terrenos considerados de significado espiritual como uma forma de demonstrar reverência pelo [ROOT.Faith.PantheonTerm]."
 doctrine_pilgrimage_encouraged_descriptive_name:0 "Peregrinações Encorajadas"
 doctrine_pilgrimage_encouraged_name:0 "Encorajada"
 doctrine_pilgrimage_forbidden_desc:0 "A presença de [ROOT.Faith.HighGodName] pode ser sentida em todos os lugares, e a noção de que certos lugares são mais divinos do que outros é simplesmente heresia."
 doctrine_pilgrimage_forbidden_descriptive_name:0 "Peregrinações Proibidas"
 doctrine_pilgrimage_forbidden_name:0 "Proibida"
 doctrine_pilgrimage_local_rites_desc:0 "Os seguidores desta fé preferem o conforto e a estabilidade dos ritos de rotina em santuários locais aos riscos e ao esforço de longas peregrinações."
 doctrine_pilgrimage_local_rites_name:0 "Ritos Locais"
 doctrine_pilgrimage_mandatory_desc:0 "Espera-se que todos os [ROOT.Faith.GetAdherentNamePlural] em pleno vigor físico realizem uma jornada espiritual a um lugar sagrado assim que possível. Não fazê-lo representa uma falta de submissão ao [ROOT.Faith.HighGodName]."
 doctrine_pilgrimage_mandatory_descriptive_name:0 "Peregrinações Obrigatórias"
 doctrine_pilgrimage_mandatory_hajj_desc:0 "Espera-se que todos os muçulmanos em pleno vigor físico realizem um Hajj a Meca durante sua vida. Embora sejam feitas isenções especiais, qualquer [ROOT.Faith.GetAdherentNameNoTooltip] que não complete um Hajj será visto com ceticismo."
 doctrine_pilgrimage_mandatory_hajj_name:0 "Hajj"
 doctrine_pilgrimage_mandatory_name:0 "Obrigatória"
 doctrine_pilgrimage_name:0 "Atitude de Peregrinação"
 doctrine_pluralism_fundamentalist_desc:0 "Nossa fé é a única verdadeira, nossa palavra a única verdadeira. Qualquer desvio do [ROOT.Faith.ReligiousText] é inerentemente blasfêmico."
 doctrine_pluralism_fundamentalist_descriptive_name:0 "Atitude Fundamentalista"
 doctrine_pluralism_fundamentalist_name:0 "Fundamentalista"
 doctrine_pluralism_name:0 "Atitude Religiosa"
 doctrine_pluralism_pluralistic_desc:0 "É uma tolice dizer que há apenas uma interpretação correta da vontade divina e que todas as outras visões estão erradas. Cada um de nós tem sua própria maneira de adorar [ROOT.Faith.HighGodName]."
 doctrine_pluralism_pluralistic_descriptive_name:0 "Atitude Pluralista"
 doctrine_pluralism_pluralistic_name:0 "Pluralista"
 doctrine_pluralism_righteous_desc:0 "Como mortais, não podemos compreender completamente a vontade do [ROOT.Faith.HighGodNamePossessive], mas nossos [ROOT.Faith.PriestNeuterPlural] ainda têm uma boa ideia do que é sagrado e do que é profano."
 doctrine_pluralism_righteous_descriptive_name:0 "Atitude Justa"
 doctrine_pluralism_righteous_name:0 "Justo"
 doctrine_polygamy_desc:0 "Como o casamento é uma união sagrada, ter múltiplos casamentos é claramente mais sagrado do que ter apenas um casamento - contanto que cada casamento seja sagrado em si mesmo."
 doctrine_polygamy_descriptive_name:0 "Poligamia"
 doctrine_polygamy_name:0 "Poligâmico"
 doctrine_polytheist_desc:0 "O cosmos está cheio de deidades e espíritos poderosos. Pode haver um conjunto de deuses estabelecido em um panteão claro, mas é possível que o mundo espiritual seja incontável, permeie tudo ao nosso redor e nem mesmo tenha deuses nomeados."
 doctrine_polytheist_descriptive_name:0 "Politeísmo"
 doctrine_polytheist_name:0 "Politeísta"
 doctrine_sacraments_absent_desc:0 "Esta tradição não enfatiza sacramentos ou um sistema formal de ritos sagrados. A vida religiosa não é centrada na administração ritual pelo clero ou na importância de cerimonias específicas."
 doctrine_sacraments_absent_name:0 "Sem Sacramentos"
 doctrine_sacraments_central_desc:0 "$doctrine_sacraments_general_desc$"
 doctrine_sacraments_central_greek_desc:0 "$tenet_communion_desc$\n\n$pam_luke_22_19_greek$"
 doctrine_sacraments_central_latin_desc:0 "$tenet_communion_desc$\n\n$pam_luke_22_19_latin$"
 doctrine_sacraments_central_name:0 "Central"
 doctrine_sacraments_general_desc:0 "A fé dá importância central aos sacramentos e ritos sagrados. Os rituais não são meramente simbólicos, mas invocam a presença do divino. O clero os administra e os fiéis podem ser excomungados."
 doctrine_scriptural_desc:0 "A pureza doutrinária é preservada através de gerações por meio da adesão a uma lista centralizada de escrituras sagradas."
 doctrine_scriptural_descriptive_name:0 "Preservação Escritural"
 doctrine_scriptural_name:0 "Escritural"
 doctrine_spiritual_head_desc:0 "O mundo físico e o mundo espiritual não são iguais. Devemos garantir que o mundo espiritual tenha seu próprio líder, para nos guiar e proteger nossa fé de ser profanada por desejos físicos."
 doctrine_spiritual_head_descriptive_name:0 "Liderança Espiritual"
 doctrine_spiritual_head_name:0 "Espiritual"
 doctrine_spouse_parameter_multiple_spouses:0 "Governantes, se permitido por [gender_law|E], podem ter até $VALUE|V0$ cônjuges"
 doctrine_spouse_parameter_only_one_spouse:0 "Personagens só podem ter um [spouse|E]"
 doctrine_temporal_head_desc:0 "O espiritual e o físico estão intrinsecamente ligados, inteiros e inseparáveis. É tolo ter dois líderes diferentes para um único reino."
 doctrine_temporal_head_descriptive_name:0 "Liderança Temporal"
 doctrine_temporal_head_name:0 "Temporal"
 doctrine_theism_name:0 "Teísmo"
 doctrine_theocracy_lay_clergy_desc:0 "Qualquer seguidor dedicado é mais do que capaz de entender, seguir e pregar as doutrinas de nossa fé."
 doctrine_theocracy_lay_clergy_descriptive_name:0 "$doctrine_theocracy_lay_clergy_name$"
 doctrine_theocracy_lay_clergy_name:0 "Clero Leigo"
 doctrine_theocracy_name:0 "Tradição Clerical"
 doctrine_theocracy_temporal_desc:0 "Apenas [ROOT.Faith.PriestNeuterPlural] sancionados podem ser encarregados de manter as doutrinas de nossa fé e, por extensão, de gerenciar e cuidar de nossos lugares sagrados."
 doctrine_theocracy_temporal_descriptive_name:0 "Clero Teocrático"
 doctrine_theocracy_temporal_name:0 "Teocrático"
 doctrine_witchcraft_accepted_desc:0 "A magia preenche o mundo ao nosso redor, e é nosso direito e nosso privilégio se envolver com ela da maneira como nossos ancestrais fizeram."
 doctrine_witchcraft_accepted_descriptive_name:0 "Bruxaria Aceita"
 doctrine_witchcraft_accepted_name:0 "Aceito"
 doctrine_witchcraft_crime_desc:0 "Somente os divinos têm o direito de realizar milagres nesta terra. Qualquer um que fizer tentativas profanas de fazer o mesmo será punido por sua arrogância e presunção."
 doctrine_witchcraft_crime_descriptive_name:0 "Bruxaria Criminosa"
 doctrine_witchcraft_crime_name:0 "Criminoso"
 doctrine_witchcraft_name:0 "Bruxaria"
 doctrine_witchcraft_shunned_desc:0 "Os divinos têm a jurisdição legítima sobre as forças sobrenaturais neste mundo, então qualquer tentativa de coagir essas forças a obedecer a vontade de um mortal é intrinsecamente equivocada."
 doctrine_witchcraft_shunned_descriptive_name:0 "Bruxaria Evitada"
 doctrine_witchcraft_shunned_name:0 "Evitado"
 doctrine_witchcraft_virtuous_desc:0 "Praticar bruxaria é colocar a própria alma em perigo diante de espíritos malignos. Pela coragem neste aspecto necessário de manter nossas próprias almas limpas, as bruxas devem ser veneradas."
 doctrine_witchcraft_virtuous_descriptive_name:0 "Bruxaria Virtuosa"
 doctrine_witchcraft_virtuous_name:0 "Virtuoso"
