 global_religion.1000.a:0 "Você é mais do que bem-vindo aqui."
 global_religion.1000.b:0 "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U] não pode acomodá-lo."
 global_religion.1000.desc_any_counties:0 "A perseguição religiosa é intensa no [target_faith_associated_county.GetName], onde a nobreza [target_faith_associated_county_faith.GetAdjective] está convertendo à força os [local_character.GetFaith.GetAdherentNamePlural].\n\nAgora, mais de [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] exilados desejam entrar no meu reino. Seu líder, [local_character.GetFirstName], pede audiência: \"Estamos à procura de uma vida melhor e mais segura, [ROOT.Char.GetTitleAsNameNoTooltip],\" implora [local_character.GetSheHe]. \"Permita-nos nos estabelecer em torno de [initial_county_target.GetNameNoTier].\"\n\nSe eu permitir, a fé [local_character.GetFaith.GetAdjective] se espalhará por [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]."
 global_religion.1000.desc_any_counties_alt:0 "Mais de [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] [local_character.GetFaith.GetAdherentNamePlural], exilados do [target_faith_associated_county.GetName], desejam entrar no meu reino. Seu líder, [local_character.GetFirstName], pede audiência: \"Estamos à procura de uma vida melhor e mais segura, [ROOT.Char.GetTitleAsNameNoTooltip],\" implora [local_character.GetSheHe]. \"Permita-nos nos estabelecer em torno de [initial_county_target.GetNameNoTier].\"\n\nSe eu permitir, a fé [local_character.GetFaith.GetAdjective] se espalhará por [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]."
 global_religion.1000.desc_same_faith_counties:0 "Mais de [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] [local_character.GetFaith.GetAdherentNamePlural], exilados do [target_faith_associated_county.GetName], desejam entrar no meu reino. Seu líder, [local_character.GetFirstName], busca audiência: \"Estamos à procura de uma vida melhor e mais segura, [ROOT.Char.GetTitleAsNameNoTooltip],\" diz [local_character.GetSheHe]. \"Permita-nos nos estabelecer por [ROOT.Char.GetPrimaryTitle.GetDefinitiveName].\""
 global_religion.1000.desc_same_faith_counties_alt:0 "A perseguição religiosa é intensa no [target_faith_associated_county.GetName], onde a nobreza [target_faith_associated_county_faith.GetAdjective] está convertendo à força os [local_character.GetFaith.GetAdherentNamePlural].\n\nAgora, mais de [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] exilados desejam entrar no meu reino. Seu líder, [local_character.GetFirstName], busca audiência: \"Estamos à procura de uma vida melhor e mais segura, [ROOT.Char.GetTitleAsNameNoTooltip],\" diz [local_character.GetSheHe]. \"Permita-nos nos estabelecer por [ROOT.Char.GetPrimaryTitle.GetDefinitiveName].\""
 global_religion.1000.serenity_aspect:0 "Você viverá na capital, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 global_religion.1000.special:0 "Abraçarei a fé [local_character.GetFaith.GetAdjectiveNoTooltip]!"
