 kabarism:0 "Kuzarismo"
 kabarism_adherent:0 "Kuzari"
 kabarism_adherent_plural:0 "Kuzaris"
 kabarism_adj:0 "Kuzarita"
 kabarism_desc:0 "Uma comunidade de convertidos, os Kuzaritas seguem a interpretação Rabínica comum da Halakha. Mesmo muito tempo após a conversão, eles continuam a manter algumas crenças e tradições locais com reverência religiosa."
 karaism:0 "Caraísmo"
 karaism_adherent:0 "Caraíta"
 karaism_adherent_plural:0 "Caraítas"
 karaism_adj:0 "Caraíta"
 karaism_desc:0 "Em matéria de direito religioso, só o Tanakh é a autoridade máxima e absoluta. O papel dos rabinos não é o de reavaliar e adaptar as regras do pacto, mas o de interpretar o seu significado literal."
 malabarism:0 "Malabarismo"
 malabarism_adherent:0 "Malabari"
 malabarism_adherent_plural:0 "Malabari"
 malabarism_adj:0 "Malabari"
 malabarism_desc:0 "Após os descendentes das tribos de Israel se espalharem pelo mundo, eles criaram comunidades menores de leste a oeste, vivendo de forma independente. Também chamados de Judeus de Cochin, eles fizeram sua nova morada no reino Cochin do sul da Índia. Lá, eles se misturaram ao povo local e trocaram experiências culturais."
 merkabah:0 "Merkabah"
 merkabah_adherent:0 "Merkabista"
 merkabah_adherent_plural:0 "Merkabistas"
 merkabah_adj:0 "Merkabah"
 merkabah_desc:0 "O Misticismo Merkabah é uma seita do misticismo judaico que compartilha alguma influência das ensinamentos gnósticos. A fé está centrada em visões, adotando estilos de vida ascéticos para se unir ao Trono de Deus."
 rabbinic_faith:0 "Rabínica"
 rabbinic_faith_adherent:0 "Judeu"
 rabbinic_faith_adherent_plural:0 "Judeus"
 rabbinic_faith_adj:0 "Rabínica"
 rabbinic_faith_desc:0 "A tradição principal do povo judeu, fundamentada na dupla autoridade da Torá Escrita e da Torá Oral, conforme compiladas no Talmude. Guiada pela erudição rabínica e pela lei haláchica, seus adeptos buscam viver retamente por meio da observância dos mandamentos divinos."
 rabbinism:0 "Rabinismo"
 rabbinism_adherent:0 "Rabinista"
 rabbinism_adherent_plural:0 "Rabinistas"
 rabbinism_adj:0 "Rabínico"
 rabbinism_desc:0 "O rabinismo enfatiza o propósito dos rabinos como intérpretes da lei religiosa da Halachá. São as leis e tradições que asseguram o cumprimento do pacto com o Senhor, e os rabinos guardam essas leis."
 samaritan:0 "Samaritanismo"
 samaritan_adherent:0 "Samaritano"
 samaritan_adherent_plural:0 "Samaritanos"
 samaritan_adj:0 "Samaritano"
 samaritan_desc:0 "Originados das tribos que colonizaram Samaria, os samaritanos seguiram uma versão original e não modificada da Torá. Nesse sentido, eles praticam a verdadeira religião de Moisés, servindo aos deveres diretos concedidos por Deus."
 temple_authority_kohanim_doctrine_desc:0 "O Judaísmo Cohenítico afirma que os Cohanim são a autoridade suprema em todos os assuntos religiosos, incluindo a Halakha. Os Cohanim devem ser descendentes patrilineares de Aarão, irmão de Moisés."
 temple_authority_kohanim_doctrine_name:0 "Cohenítica"
 temple_authority_rabbinic_doctrine_desc:0 "Os judeus rabínicos acreditam que a Halakha pode ser interpretada apenas pelos Rabinos. Eles acreditam na Torá Escrita e na Torá Oral, transmitida pelos Rabinos. Toda a crença rabínica está codificada no Talmude Babilônico, que é considerado a fonte primária a partir da qual a Halakha é interpretada e distribuída."
 temple_authority_rabbinic_doctrine_name:0 "Rabínica"
 temple_authority_samaritan_torah_doctrine_desc:0 "Os Samaritanos rejeitam a autoridade da Torá por completo, concedendo autoridade suprema à Torá Samaritana. Sua rejeição da Torá faz com que sejam universalmente vistos por seus pares como hereges."
 temple_authority_samaritan_torah_doctrine_name:0 "Samaritano"
 temple_authority_toric_doctrine_desc:0 "O Judaísmo Tórico rejeita o Talmude e a Torá Oral, passando a autoridade apenas para a Torá escrita. Os Rabinos não podem alterar ou adaptar a Halakha; seu dever é unicamente interpretar o significado literal da Torá."
 temple_authority_toric_doctrine_name:0 "Tórica"
 tenet_communal_identity_chosen_people_desc:0 "Fomos escolhidos por [ROOT.Faith.HighGodName] para um pacto sagrado. Embora isso una nosso povo com um propósito único, pode atuar como um impedimento para conversões."
 tenet_communal_identity_chosen_people_name:0 "Povo Escolhido"
