l_spanish:
 ambrosian_rite:0 "Rito Ambrosiano"
 ambrosian_rite_adherent:0 "Cristão Ambrosiano"
 ambrosian_rite_adherent_plural:0 "Cristãos Ambrosianos"
 ambrosian_rite_adj:0 "Ambrosiano"
 ambrosian_rite_desc:0 "Próprio da Arquidiocese de Milão desde os dias de seu grande bispo Santo Ambrósio, o Rito Ambrosiano mantém sua própria liturgia e canto, e uma tradição teológica que preza o pensamento de Santo Agostinho de Hipona."
 antiochian_rite:0 "Rito Antioqueno"
 antiochian_rite_adherent:0 "Cristão Antioqueno"
 antiochian_rite_adherent_plural:0 "Cristãos Antioquenos"
 antiochian_rite_adj:0 "Antioqueno"
 antiochian_rite_desc:0 "O Patriarcado de Antioquia é uma das comunidades cristãs mais antigas, fundada pelos Apóstolos São Pedro e São Paulo. Sua tradição síria ocidental, chamada 'jacobita' em homenagem a Tiago Baradeu, que reorganizou a igreja, sustenta o ensino miafisista e a antiga liturgia de São Tiago."
 armenian_rite:0 "Apostólica"
 armenian_rite_adherent:0 "Apostólico"
 armenian_rite_adherent_plural:0 "Apostólicos"
 armenian_rite_adj:0 "Apostólica"
 armenian_rite_desc:0 "Fundada pelos Apóstolos Bartolomeu e Tadeu, a Igreja Apostólica Armênia rapidamente ganhou seguidores na região e conduziu o Reino da Armênia a se tornar o primeiro estado a adotar o cristianismo como religião oficial."
 beneventan_rite:0 "Rito Beneventano"
 beneventan_rite_adherent:0 "Cristão Beneventano"
 beneventan_rite_adherent_plural:0 "Cristãos Beneventanos"
 beneventan_rite_adj:0 "Beneventano"
 beneventan_rite_desc:0 "A tradição litúrgica do sul lombardo, centrada em Benevento e na grande abadia de Montecassino. Seu canto distintivo e suas observâncias o diferenciam da prática romana, que observa o rito com crescente desconfiança."
 byzantine_rite:0 "Rito Grego"
 byzantine_rite_adherent:0 "Cristão Grego"
 byzantine_rite_adherent_plural:0 "Cristãos Gregos"
 byzantine_rite_adj:0 "Rito Grego"
 byzantine_rite_desc:0 "O Patriarcado de Constantinopla é um dos centros mais significativos do cristianismo ortodoxo oriental, conhecido por suas ricas tradições teológicas e influência histórica. O Rito Grego origina-se diretamente do patriarcado."
 carolingian_christianity:0 "Cristianismo Carolíngio"
 carolingian_christianity_adherent:0 "Carolíngio"
 carolingian_christianity_adherent_plural:0 "Carolíngios"
 carolingian_christianity_adj:0 "Carolíngio"
 carolingian_christianity_desc:0 "Uma forma de cristianismo que se desenvolveu sob o reinado da dinastia carolíngia, caracterizada por sua ênfase no monaquismo e no trabalho missionário."
 coptic_rite:0 "Copta"
 coptic_rite_adherent:0 "Copta"
 coptic_rite_adherent_plural:0 "Coptas"
 coptic_rite_adj:0 "Copta"
 coptic_rite_desc:0 "Rastreando suas origens até São Marcos Evangelista, a Igreja Copta é famosa tanto por ser o berço do monaquismo cristão quanto por manter uma longa tradição de promoção da educação e da filosofia."
