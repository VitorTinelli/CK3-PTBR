 ethiopian_rite:0 "Ge'ez"
 ethiopian_rite_adherent:0 "Ge'ez"
 ethiopian_rite_adherent_plural:0 "Cristãos Ge'ez"
 ethiopian_rite_adj:0 "Ge'ez"
 ethiopian_rite_desc:0 "Centrada nas terras altas da Etiópia e enraizada no legado de Axum, esta antiga tradição cristã difere de outras igrejas alexandrinas por manter um cânone bíblico mais amplo, fortes tradições monásticas e uma aliança moldada pela herança real salomônica."
 generic_rite_description:0 "[Rite.GetNameNoTooltip] foi fundado por [Character.GetFullName] em [Character.GetCurrentLocation.GetTitle.GetAdjective] em [GetCurrentDate.GetStringLong], como um rito dentro da fé [Faith.GetAdjective]. [Rite.Custom('GetGenericRiteTenetSentence')]"
 generic_rite_focus_fallback:0 "Este rito preserva uma ênfase devocional distintiva dentro de sua fé principal."
 generic_rite_focus_tenet_acts_of_apostles:0 "Este rito molda-se com base na comunidade apostólica, na caridade e na vida partilhada dos primeiros fiéis."
 generic_rite_focus_tenet_adaptive:0 "Este rito curva-se sem quebrar, absorvendo o costume local enquanto preserva o seu núcleo sagrado."
 generic_rite_focus_tenet_adoptionism:0 "Este rito enfatiza a exaltação e a filiação divina de uma forma que minimiza a distinção eterna."
 generic_rite_focus_tenet_adorcism:0 "Este rito corteja os espíritos com reverência, esperando conquistar o seu favor e afastar a sua ira."
 generic_rite_focus_tenet_alexandrian_catechism:0 "Este rito preza o ensino erudito, a doutrina subtil e a instrução paciente dos fiéis."
 generic_rite_focus_tenet_anachoresis:0 "Este rito honra o afastamento do mundo, procurando a santidade na solidão, na adversidade e na distância."
 generic_rite_focus_tenet_ancestor_worship:0 "Este rito recorre aos mortos honrados em busca de orientação, bênção e continuidade com os vivos."
 generic_rite_focus_tenet_aniconism:0 "Este rito rejeita as imagens sagradas, procurando a reverência através da ausência, da contenção e da santidade do divino sem representação."
 generic_rite_focus_tenet_apostolic_succession:0 "Este rito fundamenta a autoridade numa cadeia ininterrupta de transmissão que remonta aos apóstolos."
 generic_rite_focus_tenet_armed_pilgrimages:0 "Este rito trata a guerra santa e a peregrinação armada como deveres sagrados dos devotos."
 generic_rite_focus_tenet_asceticism:0 "Este rito procura a santidade através da abnegação, da disciplina e do domínio paciente do desejo."
 generic_rite_focus_tenet_astrology:0 "Este rito lê o significado nos céus, confiando que as estrelas revelam a ordem, o destino e o momento oportuno."
 generic_rite_focus_tenet_be_fruitful_and_multiply:0 "Este rito eleva a família, a prokreación e a geração de nova vida como deveres sagrados."
 generic_rite_focus_tenet_benevolent_governance:0 "Este rito mede a santidade em parte pelo governo justo, pela administração ordenada e pelo cuidado com o reino."
 generic_rite_focus_tenet_bhakti:0 "Este rito centra-se na devoção sincera, ensinando que a rendição amorosa aproxima a alma do divino."
 generic_rite_focus_tenet_carnal_exaltation:0 "Este rito honra o desejo e o prazer corpóreo como dádivas tocadas pelo sagrado."
 generic_rite_focus_tenet_celestial_hierarchy:0 "Este rito imagina o cosmos ordenado em escalões sagrados, sendo que cada posto reflete o design divino."
 generic_rite_focus_tenet_christian_syncretism:0 "Este rito absorve os ensinamentos cristãos no seu arcabouço sagrado em vez de os rejeitar por completo."
 generic_rite_focus_tenet_communal_identity:0 "Este rito liga firmemente a adoração ao costume partilhado, à vida comum e a uma identidade comunal guardada."
 generic_rite_focus_tenet_communal_possessions:0 "Este rito minimiza a riqueza privada, exortando os fiéis a partilharem os recursos em comum."
 generic_rite_focus_tenet_communion:0 "Este rito mantém-se unificado através da devoção partilhada, da esmola e da comunhão com a sua chefia espiritual."
 generic_rite_focus_tenet_confession:0 "Este rito preza o arrependimento aberto e a absolvição, confiando que o pecado confessado se torna o início da cura."
 generic_rite_focus_tenet_consolamentum:0 "Este rito procura a purificação final através da renúncia e de uma preparação inabalável para a morte."
 generic_rite_focus_tenet_cranial_trophies:0 "Este rito trata os restos mortais dos inimigos como prova sagrada de triunfo e prestígio aterrorizante."
 generic_rite_focus_tenet_cthonic_redoubts:0 "Este rito venera as alturas e os refúgios ocultos da terra como lugares de santidade inusual."
 generic_rite_focus_tenet_dharmic_pacifism:0 "Este rito preza a inofensividade e a autocontenção, tratando a paz como uma disciplina superior à ira."
 generic_rite_focus_tenet_divine_liturgy:0 "Este rito exalta a liturgia solene, tratando a adoração ordenada como a janela mais clara para o divino."
 generic_rite_focus_tenet_divine_marriage:0 "Este rito sagra tanto a união quanto o governo, encarando o casamento sagrado como um reflexo da ordem divina."
 generic_rite_focus_tenet_dulia:0 "Este rito honra os santos e os exemplos sagrados, venerando a sua memória sem os equiparar ao divino."
 generic_rite_focus_tenet_eastern_syncretism:0 "Este rito absorve prontamente os ensinamentos orientais, interpretando a sabedoria estrangeira como eco da verdade sagrada."
 generic_rite_focus_tenet_esotericism:0 "Este rito preza a sabedoria oculta, a iniciação e as verdades reveladas apenas aos preparados."
 generic_rite_focus_tenet_exaltation_of_pain:0 "Este rito considera a dor purificadora, revelando a devoção através da resistência e do sofrimento aceite."
 generic_rite_focus_tenet_extinction_of_dharma:0 "Este rito vê o mundo como tomado pela corrupção, justificando a violência implacável em defesa da verdade."
 generic_rite_focus_tenet_false_conversion_sanction:0 "Este rito tolera a conformidade oculta e as aparências externas quando a sobrevivência ou a vantagem o exigem."
 generic_rite_focus_tenet_filial_piety:0 "Este rito ensina a reverência pelos pais e anciãos como fundamento da ordem moral e sagrada."
 generic_rite_focus_tenet_fp3_fedayeen:0 "Este rito santifica a furtividade, a infiltração e a violência sacrificial ao serviço de uma causa superior."
 generic_rite_focus_tenet_gnosticism:0 "Este rito procura verdades ocultas para além do véu do mundo, confiando a salvação ao conhecimento sagrado."
 generic_rite_focus_tenet_gruesome_festivals:0 "Este rito abraça festejos terríveis, transformando o medo, o sangue e o espetáculo numa exibição sagrada."
 generic_rite_focus_tenet_harmonious_society:0 "Este rito valoriza o equilíbrio, a propriedade e a harmonia social como reflexos da ordem cósmica."
 generic_rite_focus_tenet_hedonistic:0 "Este rito abraça a folia, o excesso e a santificação do prazer na adoração comunal."
 generic_rite_focus_tenet_hesychasm:0 "Este rito procura a união através do silêncio, da imobilidade e da repetição interior da oração sagrada."
 generic_rite_focus_tenet_holy_myron:0 "Este rito atribui especial importância à santa unção, tratando o óleo sagrado como selo da graça divina."
 generic_rite_focus_tenet_household_gods:0 "Este rito centra-se no lar, colocando a lareira, os parentes e a devoção diária sob tutela divina."
