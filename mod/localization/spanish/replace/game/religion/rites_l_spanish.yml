 generic_tenet_focus_tenet_pentarchy:0 "[GetTenetType('tenet_pentarchy').GetName( GetPlayer.GetRite )] estima antigos assentos de autoridade e a administração ordenada da fé mais ampla."
 generic_tenet_focus_tenet_polyamory:0 "[GetTenetType('tenet_polyamory').GetName( GetPlayer.GetRite )] abençoa múltiplos amores de uma só vez, recusando-se a restringir a intimidade sagrada a um único vínculo."
 generic_tenet_focus_tenet_preservation:0 "[GetTenetType('tenet_preservation').GetName( GetPlayer.GetRite )] preza a resistência, a continuidade e a salvaguarda cuidadosa do que foi confiado."
 generic_tenet_focus_tenet_pure_land:0 "[GetTenetType('tenet_pure_land').GetName( GetPlayer.GetRite )] fixa a esperança em um reino abençoado além do sofrimento, alcançado através da confiança, lembrança e devoção."
 generic_tenet_focus_tenet_purgatory:0 "[GetTenetType('tenet_purgatory').GetName( GetPlayer.GetRite )] ensina que muitas almas são purificadas após a morte antes de poderem entrar na bem-aventurança perfeita."
 generic_tenet_focus_tenet_pursuit_of_knowledge:0 "[GetTenetType('tenet_pursuit_of_knowledge').GetName( GetPlayer.GetRite )] exalta o aprendizado como trabalho sagrado, buscando a verdade por meio de estudo, debate e investigação disciplinada."
 generic_tenet_focus_tenet_pursuit_of_power:0 "[GetTenetType('tenet_pursuit_of_power').GetName( GetPlayer.GetRite )] abençoa a ambição e o domínio temporal, tratando o domínio como um instrumento adequado do sagrado."
 generic_tenet_focus_tenet_reincarnation:0 "[GetTenetType('tenet_reincarnation').GetName( GetPlayer.GetRite )] vê a jornada da alma como cíclica, com cada vida moldando a seguinte."
 generic_tenet_focus_tenet_religious_legal_pronouncements:0 "[GetTenetType('tenet_religious_legal_pronouncements').GetName( GetPlayer.GetRite )] investe decisões sagradas e julgamentos solenes com autoridade espiritual duradoura."
 generic_tenet_focus_tenet_ritual_cannibalism:0 "[GetTenetType('tenet_ritual_cannibalism').GetName( GetPlayer.GetRite )] incorpora o consumo de carne humana ao culto tabu e ao terror sagrado."
 generic_tenet_focus_tenet_ritual_celebrations:0 "[GetTenetType('tenet_ritual_celebrations').GetName( GetPlayer.GetRite )] exalta os festejos comunitários e a festividade sagrada como a expressão mais plena de adoração."
 generic_tenet_focus_tenet_ritual_hospitality:0 "[GetTenetType('tenet_ritual_hospitality').GetName( GetPlayer.GetRite )] trata a acolhida de estrangeiros como obrigação sagrada, unindo anfitrião e convidado sob o costume sagrado."
 generic_tenet_focus_tenet_sacred_childbirth:0 "[GetTenetType('tenet_sacred_childbirth').GetName( GetPlayer.GetRite )] cerca a chegada das crianças de reverência, tratando a maternidade e a nova vida como atos de significado sagrado."
 generic_tenet_focus_tenet_sacred_destruction:0 "[GetTenetType('tenet_sacred_destruction').GetName( GetPlayer.GetRite )] vê a ruína sagrada como purificadora, fazendo da própria devastação um instrumento de renovação."
 generic_tenet_focus_tenet_sacred_shadows:0 "[GetTenetType('tenet_sacred_shadows').GetName( GetPlayer.GetRite )] reveste-se de segredo, santificando o ocultamento, o crepúsculo e aquilo que é escondido da maioria."
 generic_tenet_focus_tenet_sacrificial_ceremonies:0 "[GetTenetType('tenet_sacrificial_ceremonies').GetName( GetPlayer.GetRite )] faz da oferenda solene o coração da adoração, vinculando-a à aliança e ao favor."
 generic_tenet_focus_tenet_sanctity_of_nature:0 "[GetTenetType('tenet_sanctity_of_nature').GetName( GetPlayer.GetRite )] encontra o divino no mundo vivo, reverenciando o crescimento, a fertilidade e a criação indomada."
 generic_tenet_focus_tenet_scholasticism:0 "[GetTenetType('tenet_scholasticism').GetName( GetPlayer.GetRite )] aprimora a crença por meio de argumentos, comentários e da reconciliação entre razão e fé."
 generic_tenet_focus_tenet_simony:0 "[GetTenetType('tenet_simony').GetName( GetPlayer.GetRite )] aceita que o cargo sagrado, o apadrinhamento e a riqueza mundana não são facilmente separados."
 generic_tenet_focus_tenet_sinitic_syncretism:0 "[GetTenetType('tenet_sinitic_syncretism').GetName( GetPlayer.GetRite )] entrelaça sua tradição com o pensamento sínico, buscando a harmonia em vez da ruptura."
 generic_tenet_focus_tenet_struggle_submission:0 "[GetTenetType('tenet_struggle_submission').GetName( GetPlayer.GetRite )] ensina que a fé é provada por meio das dificuldades, da conquista e da subjugação dos ímpios."
 generic_tenet_focus_tenet_sun_worship:0 "[GetTenetType('tenet_sun_worship').GetName( GetPlayer.GetRite )] honra o disco flamejante do céu como um sinal vivificante de ordem, esplendor e favor divino."
 generic_tenet_focus_tenet_takamin:0 "[GetTenetType('tenet_takamin').GetName( GetPlayer.GetRite )] trata o urso e as potências correlatas da natureza selvagem com reverência, temor e respeito zeloso."
 generic_tenet_focus_tenet_tax_nonbelievers:0 "[GetTenetType('tenet_tax_nonbelievers').GetName( GetPlayer.GetRite )] trata aqueles fora da fé como devedores de tributos, reforçando a hierarquia sagrada por meio de taxas mundanas."
 generic_tenet_focus_tenet_transubstantiation:0 "[GetTenetType('tenet_transubstantiation').GetName( GetPlayer.GetRite )] trata os santos mistérios como verdadeiramente transformadores, tornando o sacramento central para a presença divina."
 generic_tenet_focus_tenet_unreformed_syncretism:0 "[GetTenetType('tenet_unreformed_syncretism').GetName( GetPlayer.GetRite )] baseia-se livremente em práticas antigas, fundindo ritos ancestrais em um novo todo sagrado."
 generic_tenet_focus_tenet_unrelenting_faith:0 "[GetTenetType('tenet_unrelenting_faith').GetName( GetPlayer.GetRite )] louva o zelo inabalável, a firme resolução e a prontidão para lutar pelo que é sagrado."
 generic_tenet_focus_tenet_vows_of_poverty:0 "[GetTenetType('tenet_vows_of_poverty').GetName( GetPlayer.GetRite )] honra a santa penúria, exortando os fiéis a abandonarem os excessos e viverem com pouco."
 generic_tenet_focus_tenet_warmonger:0 "[GetTenetType('tenet_warmonger').GetName( GetPlayer.GetRite )] glorifica a conquista e o vigor marcial, esperando que os fiéis provem seu valor em batalha."
 georgian_rite:0 "Rito Georgiano"
 georgian_rite_adherent:0 "Georgiano"
 georgian_rite_adherent_plural:0 "Georgianos"
 georgian_rite_adj:0 "Georgiano"
 georgian_rite_desc:0 "O Rito Georgiano representa as tradições cristãs da Geórgia, caracterizadas por uma liturgia distinta, herança eclesiástica e fortes laços com a teologia e prática cristã oriental."
 hanafi:0 "Hanafi"
 hanafi_adherent:0 "Hanafi"
 hanafi_adherent_plural:0 "Hanafis"
 hanafi_adj:0 "Hanafi"
 hanafi_desc:0 "Desenvolvido a partir dos ensinamentos do jurista e teólogo Abu Hanifa, que sistematizou o uso do raciocínio. A teoria jurídica Hanafi deriva primariamente a lei do Corão, da Sunnah, do consenso acadêmico e do raciocínio analógico."
 hanbali:0 "Hanbali"
 hanbali_adherent:0 "Hanbali"
 hanbali_adherent_plural:0 "Hanbalis"
 hanbali_adj:0 "Hanbali"
 hanbali_desc:0 "A escola Hanbali é a menor das quatro principais escolas de jurisprudência islâmica sunita, baseada nos ensinamentos de Ahmad ibn Hanbal. Ao contrário de outras, os hanbalis opõem-se à codificação da lei num sistema abrangente, enfatizando o Corão e o Hadith como as fontes supremas."
 insular_celtic_religious_head_title_female:0 "Arquig abadesa"
 maliki:0 "Maliki"
 maliki_adherent:0 "Maliki"
 maliki_adherent_plural:0 "Malikis"
 maliki_adj:0 "Maliki"
 maliki_desc:0 "Uma das quatro principais escolas de jurisprudência islâmica dentro do islamismo sunita. Foi fundada por Malik ibn Anas no século VIII. A escola Maliki difere das outras escolas jurídicas sunitas mais notavelmente nas fontes que utiliza para a derivação de preceitos."
 nabi:0 "Nabi"
 nabi_adherent:0 "Nabi"
 nabi_adherent_plural:0 "Nabis"
 nabi_adj:0 "Nabi"
 nabi_desc:0 "Conforme declarado explicitamente no Sagrado Corão, Nabi significa ser escolhido pelo Todo-Poderoso para entregar Sua mensagem e lembrar as pessoas do Dia em que serão convocadas perante Ele e responsabilizadas por suas ações. De acordo com a crença central, o Profeta Maomé foi o último deles."
 rite_no_name:0 "#D Nome do Rito #!"
 rite_no_name_adherent:0 "$rite_no_name_adj$"
 rite_no_name_adherent_plural:0 "$rite_no_name_adj$"
 rite_no_name_adj:0 "#D Sem Nome #!"
 rite_no_name_desc:0 "#D Este Rito deve ter um nome #!"
 roman_rite:0 "Rito Romano"
 roman_rite_adherent:0 "Cristão Romano"
 roman_rite_adherent_plural:0 "Cristãos Romanos"
 roman_rite_adj:0 "Rito Romano"
 roman_rite_desc:0 "O rito romano é a tradição litúrgica da Igreja de Roma, moldada pela teologia latina, autoridade jurídica e ênfase na disciplina sacramental, hierarquia clerical e unidade institucional."
 sahabah:0 "Sahabah"
 sahabah_adherent:0 "Sahabi"
 sahabah_adherent_plural:0 "Sahabah"
 sahabah_adj:0 "Sahabah"
 sahabah_desc:0 "Também conhecidos como os Companheiros de Maomé, eram seguidores muçulmanos que o encontraram ou viram durante sua vida. Os companheiros desempenharam um papel significativo na luta, na sociedade, na narração de hadiths e na governança muçulmana primitiva."
 shafii:0 "Shafi'i"
 shafii_adherent:0 "Shafi'i"
 shafii_adherent_plural:0 "Shafi'is"
 shafii_adj:0 "Shafi'i"
 shafii_desc:0 "A escola de al-Shafi'i, o estudioso e jurista muçulmano do início do século IX conhecido como 'o pai da jurisprudência muçulmana'. O núcleo do pensamento shafi'i: cada ato de um crente sob a Lei responde a um estatuto da Lei Revelada, a Shari'a."
 slavic_rite:0 "Rito Eslavo"
 slavic_rite_adherent:0 "Cristão eslavo"
 slavic_rite_adherent_plural:0 "Cristãos eslavos"
 slavic_rite_adj:0 "Eslavo"
 slavic_rite_desc:0 "Trazido ao povo eslavo por Cirilo e Metódio, este rito incorpora elementos da liturgia bizantina adaptados às línguas e cultura eslavas através do alfabeto glagolítico."
 tabiun:0 "Tabi'un"
 tabiun_adherent:0 "Tabi"
 tabiun_adherent_plural:0 "Tabi'un"
 tabiun_adj:0 "Tabi'un"
 tabiun_desc:0 "Descritos como a geração de muçulmanos que seguiram os companheiros (Sahabah) do profeta Maomé, recebendo assim seus ensinamentos em segunda mão antes da chegada das escolas sunitas nos séculos posteriores."
