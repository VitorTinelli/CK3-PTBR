 vajrayana_faith_adherent:0 "Vajrayanista"
 vajrayana_faith_adherent_plural:0 "Vajrayanistas"
 vajrayana_faith_adj:0 "Vajrayana"
 vajrayana_faith_desc:0 "A tradição Vajrayana abrange comunidades budistas tântricas que buscam a iluminação rápida por meio de práticas esotéricas, mantras e técnicas rituais."
