 maitreya_religious_head_title_name:0 "Ordens Religiosas"
 mantrayana:0 "Mantrayana"
 mantrayana_adherent:0 "Mantrayanista"
 mantrayana_adherent_plural:0 "Mantrayanistas"
 mantrayana_adj:0 "Mantrayana"
 mantrayana_desc:0 "Os budistas Mantrayana aprimoram sua compreensão do profundo e aceleram sua jornada espiritual através de uma variedade de rituais esotéricos e instrumentos místicos."
 pundarika:0 "Pundarika"
 pundarika_adherent:0 "Pundarikista"
 pundarika_adherent_plural:0 "Pundarikistas"
 pundarika_adj:0 "Pundarika"
 pundarika_desc:0 "O Sutra de Lótus é reverenciado e venerado acima de todos os outros no Budismo Pundarika, que enfatiza mantras e rituais complexos e teve origem em uma mistura de elementos tântricos e esotéricos transmitidos à China pela Rota da Seda."
 sukhavati:0 "Sukhavati"
 sukhavati_adherent:0 "Sukhavatista"
 sukhavati_adherent_plural:0 "Sukhavatistas"
 sukhavati_adj:0 "Sukhavati"
 sukhavati_desc:0 "Sukhavati, ou Budismo da Terra Pura, ensina que os caminhos tradicionais para a iluminação não são mais possíveis. No entanto, ao invocar a compaixão de Amitābha recitando seu nome, pode-se renascer em sua Terra Pura após a morte, seja monge ou leigo."
 theravada:0 "Theravadismo"
 theravada_adherent:0 "Teravadiano"
 theravada_adherent_plural:0 "Teravadianos"
 theravada_adj:0 "Theravada"
 theravada_desc:0 "O caminho para a iluminação passa pela experiência pessoal, reflexão e raciocínio. Gautama Buddha encontrou seu próprio caminho para o Nirvana, e a única maneira de encontrar um caminho semelhante é experimentando, aprendendo e estudando sua própria existência."
 theravada_faith:0 "Theravada"
 theravada_faith_adherent:0 "Theravadano"
 theravada_faith_adherent_plural:0 "Theravadanos"
 theravada_faith_adj:0 "Theravada"
 theravada_faith_desc:0 "A tradição Theravada abrange comunidades devotadas aos ensinamentos originais do Buda preservados no Cânone Pāli, enfatizando a experiência pessoal e a percepção."
 vajrayana:0 "Vajrayanaismo"
 vajrayana_adherent:0 "Vajrayanano"
 vajrayana_adherent_plural:0 "Vajrayananos"
 vajrayana_adj:0 "Vajrayana"
 vajrayana_creator_god_name:0 "Adi-Buda"
 vajrayana_creator_god_name_possessive:0 "de Adi-Buda"
 vajrayana_desc:0 "A motivação para o estado de Buda é crucialmente importante, e a verdadeira iluminação só pode ser alcançada quando buscada para o benefício de todos os seres sencientes. Todos os seres nascem com uma mente iluminada, mas ela é obscurecida pela existência. Praticar ver a verdade do mundo e do universo, portanto, desbloqueia a iluminação inata."
