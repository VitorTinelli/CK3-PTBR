 mahayana:0 "Mahayanismo"
 mahayana_adherent:0 "Mahayanano"
 mahayana_adherent_plural:0 "Mahayananos"
 mahayana_adj:0 "Mahayana"
 mahayana_desc:0 "A liberação do Samsara não é meramente algo feito individualmente, mas uma experiência compartilhada entre os seres sencientes. Alcançar o estado de Buda é um passo no longo caminho para que todos os seres sencientes sejam liberados no Nirvana, e esse é o objetivo virtuoso do Samsara."
 mahayana_faith:0 "Maiana"
 mahayana_faith_adherent:0 "Maianista"
 mahayana_faith_adherent_plural:0 "Maianistas"
 mahayana_faith_adj:0 "Maiana"
 mahayana_faith_desc:0 "A tradição maiana abrange diversas escolas budistas da Ásia Oriental que enfatizam o ideal do bodisatva e a busca pelo estado de Buda em benefício de todos os seres sencientes."
 maitreya:0 "Maitreya"
 maitreya_adherent:0 "Maitreyanista"
 maitreya_adherent_plural:0 "Maitreyanistas"
 maitreya_adj:0 "Maitreya"
 maitreya_desc:0 "A era do Buda Sakyamuni terminou, e o Buda Maitreya desceu ao mundo — assim acreditam aqueles que o exaltam e o abraçam como seu salvador profetizado. Apenas através da destruição da velha ordem o mundo pode ser salvo."
 maitreya_faith:0 "Maitreya"
 maitreya_faith_adherent:0 "Maitreyanista"
 maitreya_faith_adherent_plural:0 "Maitreyanistas"
 maitreya_faith_adj:0 "Maitreyano"
 maitreya_faith_desc:0 "A tradição Maitreya abrange movimentos budistas milenaristas que proclamam que a era de Gautama Buda terminou e que o profetizado Buda Maitreya desceu para refazer o mundo. Apenas varrendo a velha ordem é que uma nova era pode ser inaugurada."
