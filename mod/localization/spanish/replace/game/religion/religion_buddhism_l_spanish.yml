 avatamsaka_desc:0 "Os budistas Avatamsaka consideram o Sutra da Guirlanda de Flores como a suprema fonte de verdade, que fala sobre uma infinidade de mundos, de universos inteiros contidos dentro de uma única partícula de poeira."
