l_spanish:
 GLOSS_NEMBUTSU:0 "Recitar o nome de Amitābha é uma antiga prática budista de atenção plena que despertou grande interesse nas escolas do Leste Asiático. Conhecida como Nianfo na China, ou Nembutsu no Japão, a prática é considerada por algumas escolas como uma invocação direta da misericórdia de Amitābha, por cuja graça alguém pode receber entrada na Terra Pura, seja monge ou leigo."
 acharya:0 "Acharya"
 acharya_adherent:0 "Acharyista"
 acharya_adherent_plural:0 "Acharyistas"
 acharya_adj:0 "Acharya"
 acharya_desc:0 "Acharya, uma derivação do Budismo Vajrayana, cristalizou-se no século IX com a mistura e integração dos ritos chineses e práticas tântricas tibetanas, resultando em uma manifestação regional única das práticas e cultos budistas."
 ari:0 "Arismo"
