 vinaya_adj:0 "Vinaya"
 vinaya_desc:0 "Os adeptos do Budismo Vinaya se impõem e impõem uns aos outros rigorosos padrões morais e éticos, pois a autodisciplina é o alicerce necessário para a busca da sabedoria profunda."
 yogacara:0 "Yogacara"
 yogacara_adherent:0 "Yogacarista"
 yogacara_adherent_plural:0 "Yogacaristas"
 yogacara_adj:0 "Yogacara"
 yogacara_desc:0 "Os budistas Yogacara questionam aquilo que os outros simplesmente tomam como certo ao longo da vida, tratando o mundo material como nada mais do que uma manifestação de suas próprias consciências."
