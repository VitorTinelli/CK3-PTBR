 khurramism:0 "Khurramismo"
 khurramism_adherent:0 "Khurramita"
 khurramism_adherent_plural:0 "Khurramitas"
 khurramism_adj:0 "Khurramita"
 khurramism_desc:0 "Num mundo de Luz e Escuridão, governantes injustos devem ser derrubados em apoio ao que é bom. Através de profetas como Mazdak, Abu Muslim e al-Muqanna, os Curramitas acreditam que o divino nasce na humanidade e um dia retornará para liderá-los como o Messias."
 mazdakism:0 "Mazdakismo"
 mazdakism_adherent:0 "Mazdakita"
 mazdakism_adherent_plural:0 "Mazdakitas"
 mazdakism_adj:0 "Mazdakita"
 mazdakism_desc:0 "Os profetas radicais Zardusht Khuragan e Mazdak foram influenciados por crenças esotéricas do final da Antiguidade, e agitaram pela propriedade compartilhada de recursos e cooperação universal entre humanos para superar os cinco demônios da avareza, ira, inveja, possessividade e vingança."
 mazdayasna:0 "Masdeísmo"
 mazdayasna_adherent:0 "Masdeísta"
 mazdayasna_adherent_plural:0 "Masdeístas"
 mazdayasna_adj:0 "Masdeísta"
 mazdayasna_desc:0 "Os seres humanos auxiliam na luta contra #italic Aka Manah#! por meio de bons pensamentos e vidas. Isso é feito por meio de pureza ritual, preservação da natureza e destruição de criaturas malignas."
 tenet_zurvanism_desc:0 "Os zurvanistas acreditam que Ohrmazd e Ahriman eram gêmeos iguais mas opostos, nascidos de Zurvã, o Criador de tudo. O Zurvanismo enfatiza fortemente ajudar Ahura Mazda erradicando o mal e as falsidades."
