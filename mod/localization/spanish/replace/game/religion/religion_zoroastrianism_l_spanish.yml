 zoroastrianism_religion_desc:0 "Seguindo os ensinamentos de Zoroastro, os zoroastristas acreditam no senhor da sabedoria, Ohrmazd, que é a fonte de todo o bem e se opõe à falsidade, representada por Ahriman. Um zoroastrista busca o caminho da Verdade por meio de Boas Ideias, Boas Palavras e Boas Ações."
