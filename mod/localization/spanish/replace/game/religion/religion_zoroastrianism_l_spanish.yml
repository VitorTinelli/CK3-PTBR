 zurvanism_creator_god_name_possessive:0 "de Zurvã"
 zurvanism_desc:0 "Seguidores dos ensinamentos de Behafarid, os $zurvanism_adherent_plural$ buscam cooperação com o mundo islâmico, fazendo numerosas reformas em sua fé em resposta às críticas muçulmanas ao Zoroastrismo ortodoxo. Entre essas reformas estão a proibição do consumo de álcool, forte oposição ao casamento familiar e encorajamento à caridade como uma medida para usar sua riqueza para o bem público."
