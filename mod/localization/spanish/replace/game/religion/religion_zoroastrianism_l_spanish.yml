 afridunism:0 "Afridunismo"
 afridunism_adherent:0 "Afridunista"
 afridunism_adherent_plural:0 "Afridunistas"
 afridunism_adj:0 "Afridunista"
 afridunism_desc:0 "Imersa nas tradições Daylamite e no paganismo persa, muitos aspectos do Afridunismo antecedem até mesmo o antigo credo zoroastrista. Os adeptos se esforçam para viver de acordo com as regras estabelecidas pelo herói mítico Faridun, que enfatiza o poder absoluto dos líderes familiares e um espírito feroz de independência."
 afridunism_good_god_hvar_khshaita:0 "Hvar-Khshaita"
 afridunism_good_god_mithra:0 "Mithra"
 afridunism_priest_male:0 "zautar"
 afridunism_priest_male_plural:0 "zautars"
 afridunism_war_god_name:0 "Verethragna"
 afridunism_war_god_name_possessive:0 "Verethragna"
 doctrine_heretic_branch_zandik_desc:0 "Os $doctrine_major_branch_behdin_name$ nos chamam de hereges, excluídos e subversivos. Embora nada nos una além do seu desprezo, a retidão dita nossa resistência e o desdém deles endurece nossos corações."
 doctrine_heretic_branch_zandik_name:0 "Korramdin"
 doctrine_major_branch_behdin_desc:0 "Apesar das diferenças em algumas peculiaridades de prática, não concordamos nós, zoroastristas convencionais, sobre os fundamentos da lealdade a Ahura Mazda?"
 doctrine_major_branch_behdin_name:0 "Behdin"
 doctrine_parameter_hostility_override_doctrine_heretic_branch_zandik:0 "Considera outros [faiths|E] Korramdin como [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_doctrine_major_branch_behdin:0 "Considera outros [faiths|E] Behdin como [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 doctrine_zoroastrian_branches_desc:0 "Devemos apoiar o sacerdócio estabelecido e sua doutrina para proteger nossa fé contra heresias - ou eles que estão equivocados e corrompidos?"
 doctrine_zoroastrian_branches_name:0 "Bem e Mal"
 gayomarthianism:0 "Gayomarthianismo"
 gayomarthianism_adherent:0 "Gayomarthiano"
 gayomarthianism_adherent_plural:0 "Gayomarthianos"
 gayomarthianism_adj:0 "Gayomarthiano"
 gayomarthianism_desc:0 "Com base na ideia de que Ahura Mazda, por meio de seus pensamentos, criou espíritos malignos por acidente, os Gayomartianos rejeitam a infalibilidade do Senhor da Sabedoria e, em vez disso, enfatizam a prática ritualística para aprender a Verdade em comunhão com Ahura Mazda."
 khurmazta:0 "Khurmazdismo"
 khurmazta_adherent:0 "Khurmazta"
 khurmazta_adherent_plural:0 "Khurmaztas"
 khurmazta_adj:0 "Khurmazta"
 khurmazta_desc:0 "Com raízes profundas na mistura religiosa da Sogdiana, os Khurmazta adoram um amplo conjunto de deuses e espíritos, tanto ancestrais quanto universais. Eles também reverenciam ícones, algo anátema para muitos outros zoroastristas. No entanto, por mais únicos que alguns aspectos de sua fé possam ser, de outras maneiras permanecem dentro da órbita da doutrina zoroastriana tradicional, praticando rituais de pureza e cuidando dos fogo eternos com devoção incessante."
