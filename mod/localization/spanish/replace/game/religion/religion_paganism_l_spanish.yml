 biliku_religion_desc:0 "É a crença em um panteão de Deuses que mantêm uma relação complexa com a humanidade. Muitas histórias Nakkavara envolvem grandes ancestrais lutando contra os deuses principais da fé. Algumas pessoas personificam o deus principal como uma Deusa Aranha feminina, enquanto outras como um Deus Lagarto masculino. Em todas as versões, o criador lançou uma tocha no grande ancestral que roubou o fogo e então desapareceu do mundo material, cansado da humanidade. O criador deixou para trás seus filhos, que assumiram a forma do vento para trazer recompensas e punições aos humanos."
