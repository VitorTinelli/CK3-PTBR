 special_doctrine_immaterial_harmony_desc:0 "Não há conflito entre nossas tradições e os ensinamentos do Buda ou dos sábios. Pode-se praticar qualquer uma delas, ou até todas ao mesmo tempo, sem dificuldade espiritual."
 special_doctrine_immaterial_harmony_name:0 "Harmonia Imaterial"
 spiritual_fulfillment_from_building_personal_toast:0 "$building_temples_gives_development_toast$"
 successful_battles_and_sieges_give_sp_toast:0 "Princípio de $tenet_miles_christi_name$"
 successful_sieges_give_piety_toast:0 "Dogma da $tenet_sacred_destruction_name$"
 sun_worship_desert_travel_toast:0 "$tenet_sun_worship_name$"
 tenet_adaptive_desc:0 "A adesão dogmática a velhas restrições só prejudica os fiéis. Enquanto nos mantivermos fiéis às crenças fundamentais de nossa fé,podemos adaptar nossas leis ao mundo a nossa volta."
 tenet_adaptive_name:0 "Adaptativa"
 tenet_adorcism_desc:0 "Os espírito deste mundo podem realizar grandes obras, tanto do bem quanto do mal. Ao honrá-los e respeitá-los, só podemos esperar que eles farão o bem a nós e o mal aos nossos inimigos."
 tenet_adorcism_name:0 "Adorcismo"
 tenet_alexandrian_catechism_desc:0 "A Escola Catequista de Alexandria teve a longa tradição de encorajar os teólogos a pensar criticamente e questionar o status quo.\n\n Apesar da destruição física da escola, nós mantivemos essas tradições."
 tenet_alexandrian_catechism_name:0 "Catecismo Alexandrino"
 tenet_ancestor_worship_desc:0 "Nossos ancestrais nos protegem de além túmulo, nos guiando e mostrando o caminho a seguir. Por isso nós devemos honrá-los e respeitá-los."
 tenet_ancestor_worship_name:0 "Adoração ao Ancestral"
 tenet_aniconism_desc:0 "A adoração de imagens tem cegado muitos para a verdade divina. Nós expulsaremos todos os ídolos de nossos locais sagrados para que nossos fiéis não caiam nessa armadilha."
 tenet_aniconism_name:0 "Aniconismo"
 tenet_aniconism_siege_destruction_toast:0 "$tenet_aniconism_name$"
 tenet_anusim:0 "Anusim"
 tenet_armed_pilgrimages_desc:0 "Nossos peregrinos viajam pelo mundo para visitar nossos locais sagrados - teremos prazer em empunhar a espada para mantê-los seguros de qualquer um que tente prejudicá-los"
 tenet_armed_pilgrimages_name:0 "Peregrinações Armadas"
 tenet_asceticism_desc:0 "Posses materiais nos cegam para a verdade divina. Somente nos dedicando a uma vida simples e sem luxo nós podemos alcançar a iluminação espiritual."
 tenet_asceticism_name:0 "Ascese"
 tenet_astrology_desc:0 "A noite o céu é nossa janela para o reino do divino. Os grandes segredos e mistérios do mundo estão escritos lá, abertos para todos aprenderem se estes souberem onde olhar."
 tenet_astrology_name:0 "Astrologia"
 tenet_benevolent_governance_desc:0 "Aqueles que governam as massas têm o dever moral de promover o que é bom e rejeitar o que é mau. Somente ao seguir esse princípio um governante pode ser verdadeiramente justo."
 tenet_benevolent_governance_name:0 "Governo Benevolente"
 tenet_bhakti_desc:0 "Os mortais não podem viver à altura da glória divina, mas pela seleção de um único aspecto da divindade para imitar, adorar e ser devoto, podemos nos aproximar daquilo que, de outra forma, seria impossível."
 tenet_bhakti_name:0 "Bhakti"
 tenet_bhakti_patron_god_name:0 "Deuses Patronos"
 tenet_carnal_exaltation_desc:0 "Os prazeres da carne são sublimes de uma maneira que transcende outras experiências terrenas, nos aproximando do divino. Nós devemos glorificar nossos desejos sexuais e buscar oportunidades de saciá-los."
 tenet_carnal_exaltation_name:0 "Exaltação Carnal"
 tenet_christian_syncretism_desc:0 "Jesus de Nazaré pode não ter sido verdadeiramente divino, mas ele ainda permanece como uma figura virtuosa. Devemos honrar e respeitar seus ensinamentos."
 tenet_christian_syncretism_name:0 "Sincretismo Cristão"
 tenet_communal_identity_desc:0 "Nossa fé e nossa cultura são intrinsecamente ligadas. Esta prática fortalece os laços de nossa comunidade, embora tenda a exluir os estrangeiros."
 tenet_communal_identity_name:0 "Identidade Comunal"
 tenet_communal_possessions_desc:0 "[ROOT.Faith.HighGodName] pretendia para todos nós uma parcela igual dos recursos da Terra. Devemos manter todas as coisas em comum e redistribuir a riqueza roubada dos poderosos."
 tenet_communal_possessions_name:0 "Posses Comunais"
 tenet_communion_desc:0 "Nossos rituais não são meramente simbólicos — eles invocam a própria presença do divino. Aqueles que não podem ou não se juntam a nós em sua prática não podem ser verdadeiros fiéis."
 tenet_communion_name:0 "Comunhão"
 tenet_consolamentum_desc:0 "Quando envelhecemos ou adoecemos, nós realizamos um ritual para purificar nossas almas do pecado. Uma vez feito, encerramos nossas vidas de forma rápida e definitiva, para que o pecado não tenha oportunidade de nos infestar novamente."
 tenet_consolamentum_name:0 "Endura"
 tenet_consolamentum_name_alternate:0 "Suicídio Ritual"
 tenet_cranial_trophies_desc:0 "A cabeça é o receptáculo da quintessência de seu dono. Ao separá-la e extrair seu conteúdo, podemos reivindicar a potente energia espiritual para nós mesmos."
 tenet_cranial_trophies_name:0 "Troféus Cranianos"
 tenet_cthonic_redoubts_desc:0 "Não há abrigo melhor do que as raízes da Terra, nenhuma fortaleza mais resistente do que suas espinhas proeminentes, nenhuma peregrinação mais sagrada do que suas trilhas ocultas. Observamos a Criação de cima desses cumes altivos e sentimos o verdadeiro peso do Divino."
 tenet_cthonic_redoubts_name:0 "Redutos Cthônicos"
 tenet_dharmic_pacifism_desc:0 "Somos todos uma parte da ordem cósmica. A violência contra qualquer coisa é violência contra tudo, inclusive a si mesmo."
 tenet_dharmic_pacifism_name:0 "Pacifismo Dármico"
 tenet_divination_desc:0 "O destino dos mortais e o futuro do mundo estão escritos nas estrelas e em sinais ocultos, e por meio de rituais, sonhos e presságios, praticantes habilidosos podem desvendar esses segredos dos espíritos além."
 tenet_divination_name:0 "Adivinhação"
 tenet_divine_marriage_desc:0 "Ao casar-se com parentes próximos, imitamos as uniões sagradas dos primeiros seres na criação. Boas qualidades serão transmitidas à nossa linhagem familiar e, assim, ganhamos pureza e favor na batalha eterna contra o mal."
 tenet_divine_marriage_name:0 "Casamento Divino"
 tenet_divine_marriage_xwedodah:0 "Xwedodah"
 tenet_eastern_syncretism_desc:0 "Há algo a ser aprendido com a forma como as diferentes religiões dhármicas toleram umas às outras. Elas podem não seguir a fé verdadeira, mas isso não as torna más."
 tenet_eastern_syncretism_name:0 "Sincretismo $rf_eastern$"
 tenet_esotericism_desc:0 "Os grandes mistérios do divino podem estar além da compreensão mortal, mas isso não é desculpa para a ignorância. Sua própria existência nos obriga a buscar conhecimento e compreensão do mundo ao nosso redor."
 tenet_esotericism_kabbalah:0 "Cabala"
 tenet_esotericism_kabbalah_desc:0 "Os ensinamentos da Cabala tornam compreensível para os mortais a relação entre o Deus eterno, a natureza do infinito conhecida como Ein Sof, e a criação de Deus. A Cabala forma a base para todo o misticismo judaico, e os praticantes da Cabala frequentemente interagem com outras escolas judaicas."
 tenet_esotericism_name:0 "Esoterismo"
 tenet_exaltation_of_pain_desc:0 "Dor é a sensação universal, violência a língua universal. Infligir dor em outros é dá-los uma benção, portanto, receber a dor é receber a graça."
 tenet_exaltation_of_pain_name:0 "Exaltação da Dor"
 tenet_excommunicated:0 "[GetTrait('excommunicated').GetName( GetNullCharacter )]"
 tenet_extinction_of_dharma_desc:0 "Demônios andam pela terra disfarçados de piedosos e devotos; aquele que matar um dará um passo em direção à Iluminação, aquele que matar dez dará dez passos em direção à Iluminação."
 tenet_extinction_of_dharma_name:0 "Extinção do Dharma"
 tenet_false_conversion_sanction_desc:0 "Se sua vida está ameaçada, é aceitável professar uma falsa fé, contanto que você mantenha a verdade em seu coração."
 tenet_false_conversion_sanction_name:0 "Falsas Conversões Sancionadas"
 tenet_filial_piety_desc:0 "A piedade filial e a obediência aos mais velhos são fundamentais para a realização da bondade humana. Quando nossos pais estão vivos, servimo-los com propriedade; quando morrem, enterramo-los com propriedade, e depois os veneramos com propriedade."
 tenet_filial_piety_name:0 "Piedade Filial"
 tenet_fp3_fedayeen_desc:0 "Quando a guerra convencional não é suficiente, é nosso dever diante de [ROOT.Faith.HighGodNameAlternate] destruir os seus inimigos por meio de infiltração e decepção. Não devemos temer nem a morte nem a dor e prontamente sacrificamos nossas vidas pela causa maior."
 tenet_fp3_fedayeen_name:0 "Fedayeen"
 tenet_fp3_sacred_murder_name:0 "Assassinato Sagrado"
 tenet_gnosticism_desc:0 "Por meio do conhecimento, a centelha divina que repousa dentro de todos os seres humanos pode ser libertada e retornar à sua fonte celestial no reino espiritual."
 tenet_gnosticism_name:0 "Gnosticismo"
 tenet_gruesome_festivals_blot_name:0 "Blót"
 tenet_gruesome_festivals_desc:0 "Todos nós nascemos no sangue. Sobrevivemos pelo sangue de nosso gado, nossa família, nossos inimigos. É apenas natural que [ROOT.Faith.PantheonTerm] exijam sua justa parte."
 tenet_gruesome_festivals_name:0 "Festivais Terríveis"
 tenet_harmonious_society_desc:0 "Tudo deve estar em equilíbrio: indivíduos, natureza, sociedade. O Filho do Céu define o ritmo, e nós seguimos seu canto."
 tenet_harmonious_society_name:0 "Sociedade Harmoniosa"
 tenet_harmonious_society_sway_boon:0 "Sua [faith|E] possui [GetFaithDoctrine('tenet_harmonious_society').GetBaseName]: $VALUE|+0=$"
 tenet_hedonistic_desc:0 "O divino preencheu este mundo com uma abundância de prazeres para nos entregarmos e desfrutarmos - não aproveitar de tais coisas é desprezar a própria obra da criação."
 tenet_hedonistic_name:0 "Hedonista"
 tenet_household_gods_desc:0 "Nós reverenciamos nossos #EMP Lares#! e os #EMP Genii#! — os espíritos protetores que vigiam nossos lares. Acima de tudo, honramos nosso glorioso imperador, cuja alma é encarregada de proteger todo o reino."
 tenet_household_gods_name:0 "Deuses da Casa"
 tenet_human_sacrifice_desc:0 "A melhor forma de provar nossa devoção é através do ato de sacrifício. O mais valioso sacrifício que podemos oferecer é o sacrifício de uma vida humana."
 tenet_human_sacrifice_name:0 "Sacrifício Humano"
 tenet_inner_journey_desc:0 "Somente pelo entendimento de si mesmo nós podemos entender o mundo. A jornada de auto-descoberta é importante, uma vez que é longa e difícil."
 tenet_inner_journey_name:0 "Jornada Interior"
 tenet_islamic_rationalism_desc:0 "Como [ROOT.Faith.HighGodNameAlternate] é justo e sábio, [ROOT.Faith.HighGodNameSheHe|U] não pode ir contra a razão ou ignorar o bem-estar de sua criação. Somente através da razão pura podemos esperar compreender nossa parte na sua grande obra e separar o bem do mal."
 tenet_islamic_rationalism_name:0 "Racionalismo Islâmico"
 tenet_islamic_syncretism_desc:0 "As palavras do profeta são indiscutivelmente sábias e justas, e quaisquer outras dúvidas que tenhamos, devemos observar seus pensamentos e ações."
 tenet_islamic_syncretism_name:0 "Sincretismo Islâmico"
 tenet_jewish_syncretism_desc:0 "Embora não concordemos com suas afirmações sobre o povo escolhido de Deus, a sabedora da Torá Judaica é inegável e há muito a ser aprendido com o texto."
 tenet_jewish_syncretism_name:0 "Sincretismo Judaico"
 tenet_legalism_desc:0 "Nossas leis são o resultado de gerações de sabedoria e devoção, e aderí-las é, por sua própria natureza, um ato de devoção. Um pecador, não importa quem, nunca estará acima da Lei."
 tenet_legalism_law_cost_tooltip:0 "[legalism|E]:\n Meus pecados e virtudes estão afetando isso em: [SCOPE.ScriptValue('legalism_law_cost_modifier')|-0%]"
 tenet_legalism_name:0 "Legalismo"
 tenet_literalism_desc:0 "Nossas escrituras sagradas claramente afirmam a intenção divina, e a interpretação humana é de valor limitado."
 tenet_literalism_name:0 "Literalismo"
 tenet_megaliths_desc:0 "A adoração não deve ser feita apenas nos limites de um templo, que são construções primitivas do homem que o distraem das criações divinas que nos cercam. Nós abraçamos a pedra e o ar livre, organizando as pedras que o Criador nos deu de maneiras que os agradam e nos aproximam da divindade."
 tenet_megaliths_name:0 "Construções Megálitas"
 tenet_mendicant_preachers_desc:0 "Nossos missionários viajam por toda a parte com nada além das roupas do corpo. Eles vivem da generosidade daqueles que visitam e, em troca, compartilham o conhecimento da verdadeira fé."
 tenet_mendicant_preachers_name:0 "Pregadores Mendicantes"
 tenet_monasticism_desc:0 "Os prazers da boa comida e bebida só servem para nos distrair do serviço ao divino. Nos isolar em monastérios remotos é a melhor maneira de evitar essas tentações."
 tenet_monasticism_name:0 "Monasticismo"
 tenet_mystical_birthright_alternate:0 "Táltos Születés"
 tenet_mystical_birthright_desc:0 "Cada um de nós nasceu com um destino, o mais importante deles é o de Táltos - aqueles que são escolhidos desde o nascimento para possuir poderes mágicos e se tornarem grandes líderes espirituais."
 tenet_mystical_birthright_name:0 "Direito de Primogenitura Auspiciosa"
 tenet_natural_primitivism_desc:0 "A civilização é antinatural, uma tentativa fútil e blasfema do homem de impor ordem a uma criação inerentemente desordenada. Abraçamos o naturismo e vivemos como [ROOT.Faith.PantheonTerm] pretendia, selvagens e livres.  "
 tenet_natural_primitivism_name:0 "Primitivismo Natural"
 tenet_pacifism_desc:0 "Violência é um ato abominável que só leva ao sofrimento, dor e arrependimento. Trabalhando para evitá-la sempre que possível, podemos construir sociedades mais fortes e seguras para os fiéis viverem."
 tenet_pacifism_name:0 "Pacifismo"
 tenet_pastoral_isolation_desc:0 "Tudo o que queremos é ser deixados em paz. Nossas práticas são nossas e não dizem respeito a ninguém assim como as crenças alheias não nos dizem respeito."
 tenet_pastoral_isolation_name:0 "Isolamento Pastoral"
 tenet_pentarchy_alternate_name:0 "A Pentarquia"
 tenet_pentarchy_desc:0 "Nosso locais sagrados são mais do que só lugares sagrados - eles são o próprio trono do poder, de onde nossos líderes religiosos governam."
 tenet_pentarchy_name:0 "Eclesiarcado"
 tenet_polyamory_desc:0 "Nosso amor pelo outro deveria ser tão incondicionla quanto o amor de [ROOT.Faith.FertilityGodNamePossessive] por nós. Nós devemos dispensar as noções ultrapassadas de uma pessoa possuir afetivamente a outra."
 tenet_polyamory_name:0 "Poliamor"
 tenet_polyamory_new_beloved_toast:0 "Do seu [personal_tenet|E] [GetTenetType('tenet_polyamory').GetName( GetPlayer.GetRite )]"
 tenet_preservation_desc:0 "Criação, proteção, transformação. A virtude é derivada da construção — de erguer algo e vê-lo prosperar."
 tenet_preservation_name:0 "Preservação"
 tenet_pursuit_of_knowledge_desc:0 "Aqueles que nascem naturalmente dotados de conhecimento são os mais superiores. Aqueles que buscam o conhecimento voluntariamente vêm em segundo. Aqueles que são tolos e não procuram aprender são as pessoas mais inferiores."
 tenet_pursuit_of_knowledge_name:0 "Busca pelo Conhecimento"
 tenet_pursuit_of_power_desc:0 "O que é ou não justo é transitório, definido por aqueles que atualmente detêm o poder. Isso significa que a busca pelo poder é a única causa verdadeiramente justa."
 tenet_pursuit_of_power_name:0 "Busca do Poder"
 tenet_reincarnation_desc:0 "Já vivemos muitas vidas antes desta e continuaremos a viver muitas outras vidas após esta. Cada morte é somente o começo de algo novo."
 tenet_reincarnation_name:0 "Reencarnação"
 tenet_reincarnation_zoroastrian_desc:0 "Assim como os deuses podem encarnar em corpos humanos, também podemos renascer. Os bons são recompensados com formas de beleza e pureza, e podem eventualmente tornar-se anjos de luz pura."
 tenet_reincarnation_zoroastrian_name:0 "Raj'a"
 tenet_religious_fatwa_cost_tooltip:0 "Fátua: #P -10%#!"
 tenet_religious_halakha_cost_tooltip:0 "Halachá: #P -10%#!"
 tenet_religious_kabbalah_cost_tooltip:0 "Cabala: #P -10%#!"
 tenet_religious_legal_pronouncements_cost_tooltip:0 "Lei Religiosa: #P -10%#!"
 tenet_religious_legal_pronouncements_desc:0 "O limite entre argumentos teológicos e jurídicos é tênue, e as qualidades espirituais podem e devem ser consideradas em assentamentos seculares."
 tenet_religious_legal_pronouncements_fatwa:0 "Fátua"
 tenet_religious_legal_pronouncements_halakha:0 "Halachá"
 tenet_religious_legal_pronouncements_hisbah:0 "Hisbah"
 tenet_religious_legal_pronouncements_name:0 "Lei Religiosa"
 tenet_rite_desc:0 "Nossas crenças não são tão diferentes das de nossa fé mãe... por que discutir sobre detalhes quando concordamos nos pontos principais da doutrina e, o mais importante, na autoridade final para arbitragem?"
 tenet_rite_name:0 "Rito"
 tenet_ritual_cannibalism_desc:0 "A humanidade é abençoada por ter recebido a centelha do divino. A carne humana é, portanto, sagrada e contém algo a ser saboreado, não enterrado ou queimado."
 tenet_ritual_cannibalism_name:0 "Canibalismo Ritual"
 tenet_ritual_celebrations_desc:0 "A adoração do divino é algo a ser exaltado e compartilhado com nossa comunidade. Organizar grandes festivais para honrar e louvar o divino nos aproxima."
 tenet_ritual_celebrations_name:0 "Celebrações Rituais"
 tenet_ritual_hospitality_alternate_name:0 "Puja"
 tenet_ritual_hospitality_desc:0 "\"Hospitalidade é uma das maiores virtudes que a humanidade pode mostrar. Os hóspedes em nossas casas, sejam eles mortais ou divinos, devem ser tratados sempre com a maior honra e respeito."
 tenet_ritual_hospitality_name:0 "Hospitalidade Ritual"
 tenet_sacred_childbirth_alternate_name:0 "Kūdikis Lemti"
 tenet_sacred_childbirth_birthing_building_discount_cost_desc:0 "$tenet_sacred_childbirth_name$"
 tenet_sacred_childbirth_desc:0 "As casas de banho onde mães dão à luz devem ser limpas e preparadas com os rituais adequados, a fim de encorajar o divino a nos conceder sua benção durante o parto"
 tenet_sacred_childbirth_name:0 "Parto Sagrado"
 tenet_sacred_destruction_desc:0 "Não pode haver criação sem destruição. Para que algo novo comece, algo antigo deve terminar."
 tenet_sacred_destruction_name:0 "Destruição Sagrada"
 tenet_sacred_shadows_desc:0 "Mentir é a mais profunda arte que existe. Aqueles que podem convencer os outros de suas mentiras são santos. Aqueles que podem mentir para si mesmos com sucesso são imparáveis."
 tenet_sacred_shadows_name:0 "Mentiras Sagradas"
 tenet_sacrificial_ceremonies_desc:0 "O sacrifício humano, tanto voluntário quanto involuntário, nos aproxima do divino. É costume e virtuoso que alguém se ofereça para se sacrificar em cerimônia, assim como é virtuoso sacrificar aqueles que cometeram crimes imperdoáveis contra os Deuses."
 tenet_sacrificial_ceremonies_name:0 "Cerimônias de Sacrifício"
 tenet_sanctity_of_nature_desc:0 "O mundo natural é criação divina e nós somos meros hóspedes nele. Devemos respeitar e honrar cada árvore, cada animal e até mesmo o próprio solo."
 tenet_sanctity_of_nature_name:0 "Santidade da Natureza"
 tenet_sinitic_syncretism_desc:0 "Podemos aprender com as antigas religiões siníticas. Ao longo dos séculos e milênios, elas inspiraram uma vida virtuosa e bons costumes."
 tenet_sinitic_syncretism_name:0 "Sincretismo Sinítico"
 tenet_sky_burials_desc:0 "Os mortos não devem ficar aprisionados sob a terra - é muito melhor permitir que eles sejam consumidos por pássaros necrófagos, onde, em um ato final de generosidade, eles alimentam o mundo que os alimentou."
 tenet_sky_burials_name:0 "Enterros Celestiais"
 tenet_struggle_submission_desc:0 "A vontade divina é a fonte de todo o bem, logo uma boa existência é baseada em submissão a essa vontade, expressa através da luta para cumprí-la."
 tenet_struggle_submission_name:0 "Luta e Submissão"
 tenet_sun_worship_desc:0 "O portador da luz, o doador de vida, a chama sempre ardente - ele reina alto no céu como o verdadeiro soberano do mundo."
 tenet_sun_worship_name:0 "Adoração do Sol"
 tenet_tax_nonbelievers_desc:0 "O serviço militar é para os crentes somente, enquanto um imposto é cobrado dos não crentes pela proteção que lhes é oferecida."
 tenet_tax_nonbelievers_jizya_name:0 "Jizia"
 tenet_tax_nonbelievers_name:0 "Impostos dos Não Crentes"
 tenet_temporal_condemnation_taqiya:0 "Taqiya"
 tenet_unreformed_syncretism_desc:0 "Quem somos nós para dizer que as tradições dos outros são falsas? Não é nosso lugar dar palestras sobre costumes que eles praticaram por séculos: em vez disso, devemos aprender em silêncio sobre seus caminhos."
 tenet_unreformed_syncretism_name:0 "Tradições Folclóricas Sincretistas"
 tenet_unrelenting_faith_desc:0 "Nossas convicções são fortes, e teremos prazer em lutar e morrer por nossa fé. Não importa o quanto as probabilidades estejam contra nós, não devemos nos render."
 tenet_unrelenting_faith_name:0 "Fé Implacável"
 tenet_unrelenting_faith_zandik_desc:0 "Não desejamos mal a nenhuma alma, nem a nada, mas se nossos caminhos forem ameaçados, os defenderemos com ferocidade implacável."
 tenet_unrelenting_faith_zandik_name:0 "Rebelião Justa"
 tenet_volcanic_veneration_desc:0 "Há pouco mais divino do que a terra recém-nascida jorrando das profundezas flamejantes de nossa casa. Passamos nossas vidas à beira do desastre, sempre à mercê de [ROOT.Faith.PantheonTerm]."
 tenet_volcanic_veneration_name:0 "Veneração Vulcânica"
 tenet_vows_of_poverty_desc:0 "O dinheiro corrompe os corações dos homens e afasta-os da verdadeira fé. Nós devemos evitar a aquisição de riqueza material se quisermos nos concentrar no que realmente importa."
 tenet_vows_of_poverty_name:0 "Votos de Pobreza"
 tenet_warmonger_desc:0 "Fé e guerra andam de mãos dadas. Aquele que se recusa a lutar em nome do divino não pode ser chamado de verdadeiro crente."
 tenet_warmonger_name:0 "Guerreiro"
 tenets_name:0 "Princípios"
 tgp_local_shrines_patronized:0 "Santuários Locais Patrocinados"
 unreformed_syncretic_actor_county_opinion_name:0 "$faith_syncretic_popular_opinion_active_control$"
 unreformed_syncretic_actor_name:0 "$tenet_unreformed_syncretism_name$"
 unreformed_syncretic_actor_opinion_active_county_opinion_name:0 "$faith_syncretic_popular_opinion_active_control$"
 unreformed_syncretic_actor_opinion_active_opinion_name:0 "$faith_syncretic_opinion_active_control$"
