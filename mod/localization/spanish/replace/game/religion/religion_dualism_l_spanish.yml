 gnostic_faith_desc:0 "A tradição gnóstica engloba as várias comunidades que buscam o conhecimento divino — a gnosis — como o caminho para a salvação. Elas defendem que o mundo material é a criação imperfeita de uma divindade menor, e que o verdadeiro Deus é um ser distante e transcendente cuja centelha de divindade jaz oculta dentro da alma humana."
