 manichaean_faith_desc:0 "A tradição maniqueia engloba as várias comunidades que seguem os ensinamentos do profeta Mani, que pregava uma luta cósmica entre a luz e as trevas. De seus centros na Pérsia e na Ásia Central, o maniqueísmo espalhou-se para o leste até a China e para o oeste até Roma."
