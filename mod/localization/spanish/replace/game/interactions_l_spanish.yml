 marriage_interaction.0010.mid.g_desc:0 "\n\n[Select_CString( secondary_actor.IsFemale, 'Sua', 'Seu' )] [actor.Custom2('RelationToMe', SCOPE.sC('secondary_actor'))], [secondary_actor.GetFirstName], e eu seremos o melhor casal #EMP de todos os tempos#!!"
