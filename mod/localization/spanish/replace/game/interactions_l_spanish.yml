 marriage_interaction.0010.mid.d_desc:0 "\n\n[Select_CString( secondary_actor.IsFemale, 'Sua', 'Seu' )] [actor.Custom2('RelationToMe', SCOPE.sC('secondary_actor'))], [secondary_actor.GetFirstName], será prometido em casamento a [Select_CString( secondary_recipient.IsFemale, 'minha', 'meu' )] [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetFirstName]."
