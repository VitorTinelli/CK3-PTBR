 marriage_interaction.0010.ending.e_recipient_desc:0 "\n\nFinalmente estamos unidos em [secondary_actor.Custom('GetCulturallyAppropriateMarriageReference')], assim como em alma e coração!"
 marriage_interaction.0010.ending.f_actor_desc:0 "\n\nPor que alguém gostaria de se casar com [Select_CString( secondary_recipient.IsFemale, 'aquela', 'aquele' )] [secondary_recipient.Custom2('InsultNoun', ROOT.Char)] [secondary_recipient.Custom2('InsultAdjective', ROOT.Char)] está além de mim, então, boa sorte."
 marriage_interaction.0010.ending.f_desc:0 "\n\nPor que alguém gostaria de se casar com [Select_CString( secondary_recipient.IsFemale, 'aquela', 'aquele' )] [secondary_recipient.Custom2('InsultNoun', ROOT.Char)] [secondary_recipient.Custom2('InsultAdjective', ROOT.Char)] está além de mim, mas eu lhes desejo tudo de bom."
 marriage_interaction.0010.ending.g_actor_desc:0 "\n\nEu rezo para que vocês juntos possam encontrar redenção, expiação e felicidade."
