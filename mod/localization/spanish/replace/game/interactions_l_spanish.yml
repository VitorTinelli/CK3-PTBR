 marriage_interaction.0010.ending.h_actor_desc:0 "\n\nQue você encontre força e apoio um no outro!"
 marriage_interaction.0010.ending.h_both_desc:0 "\n\nQue nós encontremos força e apoio um no outro, [Select_CString( secondary_actor.IsFemale, 'minha', 'meu' )] [secondary_actor.Custom('ComplimentAdjective')] [secondary_actor.Custom('WifeHusband')]!"
 marriage_interaction.0010.ending.h_desc:0 "\n\nQue eles encontrem força e apoio um no outro!"
 marriage_interaction.0010.ending.h_recipient_desc:0 "\n\nQue nós encontremos força e apoio um no outro!"
 marriage_interaction.0010.gwedding.desc:0 "\n\nTambém aguardo ansiosamente pelo [GetActivityType('activity_wedding').GetName] prometido; tente não me decepcionar."
 marriage_interaction.0010.mid.a_desc:0 "\n\n[Select_CString( secondary_actor.IsFemale, 'Sua', 'Seu' )] [actor.Custom2('RelationToMe', SCOPE.sC('secondary_actor'))], [secondary_actor.GetFirstName], e [Select_CString( secondary_recipient.IsFemale, 'minha', 'meu' )] [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetFirstName], serão unidos em [secondary_actor.Custom('GetCulturallyAppropriateMarriageReference')]."
 marriage_interaction.0010.mid.a_no_acquaintance_desc:0 "\n\n[Select_CString( secondary_actor.IsFemale, 'Sua', 'Seu' )], [secondary_actor.GetFirstName], e [Select_CString( secondary_recipient.IsFemale, 'minha', 'meu' )] [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetFirstName], serão unidos em [secondary_actor.Custom('GetCulturallyAppropriateMarriageReference')]."
