 char_interaction.0001.desc:0 "Eu aceito sua graciosa oferta de vassalização. Meu senhor feudal!"
 char_interaction.0001.opening:0 "[recipient.Custom2('AppropriateGreeting', actor )]"
 char_interaction.0002.a:0 "Terei que explorar outras opções..."
 char_interaction.0002.desc:0 "Eu não preciso da sua proteção e prefiro manter a riqueza do meu reino para mim."
 char_interaction.0010.a:0 "Meu senhor feudal!"
 char_interaction.0010.desc:0 "[actor.GetFirstName], acredito que este é o começo de um belo vassalismo!"
 char_interaction.0010.opening:0 "[recipient.Custom2('AppropriateGreetingPositive', actor )]"
 char_interaction.0011.a:0 "Que pena."
 char_interaction.0011.desc:0 "Embora eu aprecie sua oferta de lealdade, não posso aceitar."
 char_interaction.0020.a:0 "O quê? Por quê!?"
 char_interaction.0020.desc:0 "Como Chefe da Dinastia, eu te renego e deserdarei! Você não herdará títulos de nenhum membro da Dinastia [actor.GetDynastyName]."
 char_interaction.0020.opening:0 "[actor.Custom2('AppropriateGreetingNegative', recipient)]"
 char_interaction.0030.a:0 "Sou grato!"
 char_interaction.0030.desc:0 "Como Chefe da Dinastia, eu restauro o seu direito de herdar títulos de membros da Dinastia [actor.GetDynastyName]!"
 char_interaction.0030.opening:0 "[actor.Custom2('AppropriateGreetingPositive', recipient)]"
 char_interaction.0040.a:0 "O quê? Por quê!?"
 char_interaction.0040.desc:0 "Como Chefe da Dinastia, eu denuncio você como um reprovado e uma vergonha para toda a Dinastia [actor.GetDynastyName]!"
 char_interaction.0041.a:0 "Calúnia!"
 char_interaction.0041.desc:0 "[Select_CString( recipient.IsFemale, 'Sua', 'Seu' )] [recipient.Custom2('InsultBehavior', SCOPE.sC('actor'))] e comportamento decadente trazem vergonha para toda a casa [actor.GetHouse.GetBaseName] — e como Líder da Casa, considero meu dever informar o restante do clã sobre suas maneiras [recipient.Custom2('InsultAdjective', SCOPE.sC('actor'))].\n\nQue a luz do [actor.GetFaith.HighGodNamePossessive] o guie de volta a um caminho virtuoso... embora duvide disso."
 char_interaction.0042.a:0 "Encantador!"
 char_interaction.0042.desc:0 "Você é tanto [recipient.Custom('FormalComplimentAdjective')] quanto [recipient.Custom('ComplimentAdjective')], uma inspiração para toda a casa [actor.GetHouse.GetBaseName] — e como Líder da Casa, é meu dever exaltar suas virtudes para todo o clã!\n\nQue permaneça na graça de [actor.GetFaith.HighGodNamePossessive]."
 char_interaction.0050.a:0 "A justiça foi feita!"
 char_interaction.0050.desc:0 "Como Chefe da Dinastia, eu perdoo suas transgressões passadas e revogo sua denúncia entre os membros da Dinastia [actor.GetDynastyName]!"
 char_interaction.0060.a:0 "Isso não pode ser bom."
 char_interaction.0060.desc:0 "Eu gosto bastante do [target.GetName], então, como seu Chefe de Dinastia, decidi reivindicá-lo. Faça o que quiser com essa informação."
 char_interaction.0070.a:0 "Que intrometido insuportável!"
 char_interaction.0070.desc:0 "Essa briga interna dentro da Dinastia [actor.GetDynastyName] é indecente e deve acabar imediatamente. Como Chefe da Dinastia, eu declaro Paz Branca entre você e seus inimigos na Dinastia!"
 char_interaction.0070.opening:0 "[actor.Custom2('AppropriateGreeting', recipient)]"
 char_interaction.0071.a:0 "Sou grato!"
 char_interaction.0071.desc:0 "Essa briga interna dentro da Dinastia [actor.GetDynastyName] é indecente e deve acabar imediatamente. Como Chefe da Dinastia, eu ordenei que [recipient.GetFullName] aceite a Paz Branca com você."
 char_interaction.0078.a:0 "De todos os insultos...!"
 char_interaction.0078.desc:0 "Eu sei que concordamos que [ward.GetTitledFirstName] seria educado por [guardian.GetTitledFirstName], mas aqui está a questão... [guardian.GetSheHe|U] já está muito ocupado com outros pupilos. Desculpe."
 char_interaction.0078.desc_them:0 "Eu sei que concordamos que [ward.GetTitledFirstName] seria educado por mim, mas aqui está a questão... eu já estou muito ocupado com outros pupilos. Desculpe."
 char_interaction.0079.a:0 "Eu posso ter cometido um erro..."
 char_interaction.0079.desc:0 "Eu pensei que tínhamos concordado que [guardian.GetTitledFirstName] educaria [ward.GetTitledFirstName], mas agora ouço que [guardian.GetSheHe] tem suas mãos cheias com outros pupilos?! Que vergonha."
 char_interaction.0079.desc_them:0 "Eu pensei que tínhamos concordado que você educaria [ward.GetTitledFirstName], mas agora ouço que suas mãos estão cheias com outros pupilos?! Que vergonha."
 char_interaction.0080.desc:0 "Eu ficaria feliz que [guardian.GetShortUINameNoFormat] educasse meu [ward_liege.Custom2('RelationToMeShort', SCOPE.sC('ward'))], [ward.GetShortUINameNoFormat] — uma educação nobre para um espírito nobre!"
 char_interaction.0080.desc_guardian:0 "Eu ficaria feliz se meu [guardian_liege.Custom2('RelationToMeShort', SCOPE.sC('guardian'))], [guardian.GetShortUINameNoFormat], educasse [ward.GetShortUINameNoFormat] — uma educação nobre para um espírito nobre!"
 char_interaction.0080.desc_guardian_self:0 "Eu ficaria feliz em educar seu [ward_liege.Custom2('RelationToMeShort', SCOPE.sC('ward'))], [ward.GetShortUIName] — uma educação nobre para um espírito nobre!"
 char_interaction.0080.desc_guardian_self_ward:0 "Eu ficaria feliz em te educar — uma educação nobre para um espírito nobre!"
 char_interaction.0080.desc_self:0 "Eu ficaria feliz que você educasse meu [ward_liege.Custom2('RelationToMeShort', SCOPE.sC('ward'))], [ward.GetShortUINameNoFormat] — uma educação nobre para um espírito nobre!"
 char_interaction.0080.desc_ward_selfaccept:0 "Ficaria feliz que você me educasse — uma criação nobre para um espírito nobre!"
 char_interaction.0081.a:0 "Que pena."
 char_interaction.0081.desc:0 "Infelizmente, não achamos sua proposta de educação adequada aos nossos interesses."
 char_interaction.0082.a:0 "Muito bem."
 char_interaction.0082.desc.liege:0 "\n\n[guardian.GetSheHe|U] me diz que as lições de [ward.GetFirstNamePossessiveNoTooltip] começarão em breve!"
 char_interaction.0082.desc:0 "\n\n[guardian.GetSheHe|U] me diz que minhas lições começarão em breve!"
 char_interaction.0082.intro:0 "[guardian.GetTitledFirstName] finalmente chegou de [guardian_liege.GetPrimaryTitle.GetNameNoTierNoTooltip], carregado com tomos e pergaminhos."
 char_interaction.0082.t:0 "Um Mentor para Mim"
 char_interaction.0083.a:0 "Excelente."
 char_interaction.0083.desc.host:0 "\n\n[guardian.GetTitledFirstName] logo começará as lições."
 char_interaction.0083.desc:0 "\n\nAssim que [ward.GetSheHe] estiver instalado, as lições começarão."
 char_interaction.0083.intro:0 "Jovem [ward.GetTitledFirstName],"
 char_interaction.0083.not_related:0 "[ward_liege.Custom2('RelationToMeShort', SCOPE.sC('ward'))] [Select_CString( ward_liege.IsFemale, 'da', 'do' )] [ward_liege.GetTitledFirstName],"
 char_interaction.0083.outro:0 "finalmente chegou de [ward_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] para a educação [ward.GetHerHim]."
 char_interaction.0083.related:0 "[Select_CString( ward.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('ward'))],"
 char_interaction.0083.t:0 "Moldando uma Mente"
 char_interaction.0084.a:0 "Muito bem."
 char_interaction.0084.desc:0 "[Select_CString( ward.IsFemale, 'Sua', 'Seu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('ward'))], [ward.GetTitledFirstName], chegou com segurança em [guardian_liege.GetPrimaryTitle.GetNameNoTierNoTooltip], e eu começarei as lições [ward.GetHerHim]."
 char_interaction.0090.a:0 "Devo me sentir insultado?"
 char_interaction.0090.from_ward.desc:0 "Temo que minha educação em sua corte não atenda mais às minhas necessidades. Eu estarei retornando imediatamente para [capital.GetNameNoTierNoTooltip]."
 char_interaction.0090.one_ward.desc:0 "Temo que a educação de [ward.GetTitledFirstName] em sua corte não atenda mais às nossas necessidades. [ward.GetSheHe|U] está sendo chamado de volta aos nossos cuidados."
 char_interaction.0090.two_wards.desc:0 "Temo que a educação de [ward.GetTitledFirstName] e [ward_2.GetTitledFirstName] em sua corte não atenda mais às nossas necessidades. Eles estão sendo chamados de volta aos nossos cuidados."
 char_interaction.0100.a:0 "Uma adição bem-vinda aos meus cofres!"
 char_interaction.0100.desc:0 "Meu amigo, por favor, aceite este humilde presente como um sinal da minha apreciação."
 char_interaction.0110.a:0 "Meu poder cresce!"
 char_interaction.0110.desc:0 "Eu concedo a você o [landed_title.GetName], seu título, território formal e a renda associada. Que você governe bem!"
 char_interaction.0111.desc:0 "Eu o nomeio governador de [landed_title.GetName]. Que você prove ser um representante digno de [actor.GetTitleAsNameNoTooltip] e administre bem!"
 char_interaction.0120.a:0 "Isso é justo!"
 char_interaction.0120.desc:0 "Após consideração cuidadosa, decidi torná-lo meu herdeiro legal. Não me decepcione, pois ainda não é tarde demais para eu mudar de ideia."
 char_interaction.0121.a:0 "É hora de conquistar meu lugar por direito."
 char_interaction.0121.desc:0 "Após muita consideração, decidi recomendá-lo/a como herdeiro/a do/da [my_title.GetName]. No entanto, o assento não é garantido. Não me decepcione."
 char_interaction.0130.a:0 "Um bom acordo."
 char_interaction.0131.a:0 "Hora de cortar a ração [recipient.GetHerHim]..."
 char_interaction.0131.desc:0 "Acho sua oferta completamente irrazoável. Faça a coisa honrosa e deixe [secondary_recipient.GetShortUIName] ir."
 char_interaction.0131.desc_personal:0 "Prefiro apodrecer na sua masmorra a aceitar sua oferta de resgate irracional."
 char_interaction.0131.opening:0 "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 char_interaction.0140.desc:0 "Aceito sua oferta de resgate. [secondary_recipient.GetShortUIName|U] será devolvido a você imediatamente!"
 char_interaction.0140.toast_puppeteer:0 "[puppet_or_actor.GetShortUIName] pagou resgate a [recipient.GetShortUIName]"
 char_interaction.0141.a:0 "Maldito seja ess[Select_CString( actor.IsFemale, 'a', 'e' )] [actor.Custom2('InsultNoun', ROOT.Char)] [actor.Custom2('InsultAdjective', ROOT.Char)]!"
 char_interaction.0141.desc:0 "Acho sua oferta de resgate muito insuficiente. Acho que vou manter [secondary_recipient.GetShortUIName] por enquanto."
 char_interaction.0141.toast_puppeteer:0 "[recipient.GetShortUIName] recusou a oferta de resgate de [puppet_or_actor.GetShortUINamePossessive]"
 char_interaction.0150.desc:0 "Muito bem, vou libertá-lo, embora deva admitir que me apeguei à sua companhia."
 char_interaction.0151.desc:0 "Receio que devo recusar sua oferta de resgate. Você terá que suportar minha hospitalidade por um tempo mais."
 char_interaction.0160.a.courtier:0 "Cuide bem dos seus passos agora, [recipient.GetFirstNameNoTooltip]..."
 char_interaction.0160.a:0 "Adeus, [recipient.GetFirstNameNoTooltip]..."
 char_interaction.0160.desc:0 "Não tenho escolha senão aceitar suas condições para minha libertação."
 char_interaction.0160.desc_banish:0 "Eu irei embora e nunca mais voltarei."
 char_interaction.0160.desc_become_executioner:0 "Eu servirei como seu carrasco."
 char_interaction.0160.desc_demand_admin:0 "Eu farei parte da sua administração [recipient.Custom2('InsultAdjective', actor)]."
 char_interaction.0160.desc_demand_conversion:0 "Eu me converterei à fé de [actor.GetFaith.GetName]."
 char_interaction.0160.desc_gain_hook:0 "Ficarei em dívida com você."
 char_interaction.0160.desc_recruit:0 "Eu me juntarei à sua corte [recipient.Custom2('InsultAdjective', actor)]."
 char_interaction.0160.desc_renounce_claims:0 "Eu renunciarei a todas as minhas reivindicações sobre as terras [recipient.Custom2('InsultAdjective', actor)] de vocês."
 char_interaction.0160.desc_take_vows:0 "Eu me juntarei aos [recipient.Custom('NunMonkPlural')]."
 char_interaction.0160.toast_puppeteer:0 "[recipient.GetShortUIName] aceitou os termos de soltura de [puppet_or_actor.GetShortUINamePossessive]"
 char_interaction.0161.desc:0 "Prefiro apodrecer na sua masmorra a aceitar suas demandas irrazoáveis."
 char_interaction.0161.toast_puppeteer:0 "[recipient.GetShortUIName] recusou os termos de soltura de [puppet_or_actor.GetShortUINamePossessive]"
 char_interaction.0170.a:0 "Maldita seja sua alma negra, [actor.GetFirstNameNoTooltip]!!!"
 char_interaction.0170.desc:0 "Fui acordado nas primeiras horas da manhã por dois guardas desconhecidos. Sendo levado para fora, não tinha ilusões sobre o que estava prestes a acontecer. Ao ajoelhar para o carrasco de [actor.GetShortUINamePossessive], experimento um momento de serenidade e clareza perfeita."
 char_interaction.0170.desc_burned:0 "Assim que terminei minha modesta refeição, a porta se abriu com força e fui agarrado e arrastado para fora. Não será uma morte fácil para mim - a pira está acesa e já posso sentir o calor em minhas pernas. Um silêncio desce sobre a multidão quando eles testemunham meus momentos finais com expressões desequilibradas em seus rostos."
 char_interaction.0170.desc_devoured:0 "A porta se abriu, e os guardas de [actor.GetShortUINamePossessive] me forçaram ao chão e me prenderam. Então, [actor.GetTitleAsNameNoTooltip] [actor.GetHerselfHimself] entrou, faca na mão e sorriso largo.\n\nSem se importar com meus gritos [actor.GetSheHe] esculpe minha carne com faca e dentes. Através de uma névoa encontro seu rosto coberto de sangue - coberto de pedaços de #EMP me#! - e imploro, mas enquanto [actor.GetSheHe] mastiga e engole com prazer, percebo que é assim que eu morro."
 char_interaction.0170.desc_public:0 "Ao amanhecer, sou acordado com rudeza por dois guardas me arrastando para fora.\n\nConforme me levam em direção a uma plataforma elevada no meio de uma multidão reunida, meu coração afunda, e quando o carrasco de [actor.GetShortUINamePossessive] sorri para mim e levanta sua pesada espada, eu desespero.\n\nA multidão fica quieta quando o carrasco se aproxima de mim, onde sou forçado a ajoelhar, e com um grunhido de esforço e um som quase inaudível de #EMP swish#! tudo fica escuro."
 char_interaction.0170.life_is_just_a_joke.a:0 "A vida #EMP é#! apenas uma piada, não é?"
 char_interaction.0170.t:0 "Um Momento Difícil"
 char_interaction.0180.a:0 "Suponho que eu deva."
 char_interaction.0180.desc.liege:0 "Como seu senhor, exijo que abandone sua falsa fé e junte-se a mim como um seguidor [actor.GetFaith.GetAdherentName], imediatamente."
 char_interaction.0180.desc:0 "Como Chefe da sua Casa, decidi que você deve abraçar o [actor.GetFaith.GetName], a única verdadeira fé. Receio que você não tenha escolha nesta questão."
 char_interaction.0181.desc:0 "Muito bem, eu vou abraçar a Fé [actor.GetFaith.GetAdjective], embora pareça estranho abandonar tanto do que é familiar."
 char_interaction.0181.toast_puppeteer:0 "[recipient.GetShortUIName] converteu-se à demanda de [puppet_or_actor.GetShortUINamePossessive]"
 char_interaction.0182.a:0 "Que decepção..."
 char_interaction.0182.desc:0 "Nunca abandonarei minha Fé e, em vez disso, fundarei minha própria Casa!"
 char_interaction.0182.toast_puppeteer:0 "[recipient.GetShortUIName] recusou converter-se à demanda de [puppet_or_actor.GetShortUINamePossessive]"
 char_interaction.0190.desc:0 "Muito bem, eu vou abraçar a Fé [actor.GetFaith.GetAdjective], embora pareça estranho abandonar tanto do que é familiar."
 char_interaction.0190.toast_puppeteer:0 "[recipient.GetShortUIName] converteu-se à demanda de [puppet_or_actor.GetShortUINamePossessive]"
 char_interaction.0191.desc:0 "Minha Fé está no cerne do meu ser - nunca a abandonarei."
 char_interaction.0191.toast_puppeteer:0 "[recipient.GetShortUIName] recusou converter-se à demanda de [puppet_or_actor.GetShortUINamePossessive]"
 char_interaction.0199.a:0 "É isso mesmo."
 char_interaction.0199.desc:0 "Não vejo escolha a não ser aceitar sua decisão de me tirar o [landed_title.GetName]."
 char_interaction.0200.a:0 "Não posso acreditar nisso!"
 char_interaction.0200.desc:0 "Cheguei à conclusão de que você não pode ser confiável com a dignidade e a responsabilidade do [landed_title.GetName]. Portanto, despojo você deste título pelo bem maior do Reino."
 char_interaction.0201.a:0 "Como [recipient.GetSheHe] ousa!"
 char_interaction.0201.desc:0 "[landed_title.GetName] pertence legítimamente à Casa [recipient.GetHouse.GetName]. Não vou renunciar a ele em nenhuma circunstância."
 char_interaction.0211.a:0 "Ingrato!"
 char_interaction.0211.desc:0 "Eu realmente aprecio sua generosa oferta de fazer [secondary_recipient.GetShortUIName] meu vassalo, mas temo que eu deva recusar."
 char_interaction.0220.a:0 "Bom."
 char_interaction.0220.desc:0 "Aceito sua retratação do meu vassalo, [secondary_recipient.GetShortUIName], embora eu ache isso injusto."
 char_interaction.0221.a:0 "Isso é traição!"
 char_interaction.0221.desc:0 "Não posso trair o juramento de fidelidade de [secondary_recipient.GetShortUIName]. Protegerei meu vassalo, mesmo que isso signifique quebrar o juramento que tenho com você."
 char_interaction.0230.a:0 "Traidor!"
 char_interaction.0230.a_court_chaplain_stayed:0 "Bem, isso é... embaraçoso."
 char_interaction.0230.desc.courtier:0 "[recipient.GetTitledFirstName] conseguiu evitar a captura e fugiu para o campo!"
 char_interaction.0230.desc.courtier_court_chaplain_stayed:0 "[recipient.GetTitledFirstName] conseguiu evitar a captura, e dizer que [recipient.GetSheHe] está descontente com minhas ações seria um eufemismo."
 char_interaction.0230.title:0 "Renegado!"
 char_interaction.0230.toast_puppeteer:0 "[puppet_or_actor.GetShortUIName] falhou ao aprisionar [recipient.GetShortUIName]"
 char_interaction.0231.a:0 "Bom."
 char_interaction.0231.desc_house_arrest:0 "De acordo com minhas ordens, [recipient.GetTitledFirstName] agora está confinado em sua casa. Coloquei alguns dos meus guardas para garantir que [recipient.GetSheHe] esteja em conformidade com a prisão domiciliar."
 char_interaction.0231.desc_prison:0 "[recipient.GetTitledFirstName] foi capturado e aguarda seu destino seguramente trancado em minhas masmorras."
 char_interaction.0231.desc_stockade:0 "De acordo com minhas ordens, [recipient.GetTitledFirstName] agora deve ser confinado ao estoque, onde [recipient.GetSheHe] aguarda seu destino."
 char_interaction.0231.title:0 "Justiça"
 char_interaction.0231.toast_puppeteer:0 "[puppet_or_actor.GetShortUIName] aprisionou [recipient.GetShortUIName]"
 char_interaction.0232.a:0 "Você não ficará sozinho!"
 char_interaction.0232.b:0 "Você é o traidor!"
 char_interaction.0232.desc:0 "Por tempo demais sofri indignidades às mãos de [actor.GetTitledFirstName].\n\n"
 char_interaction.0232.liege:0 "Não ficarei de braços cruzados enquanto nosso suserano abusa dos leais vassalos [actor.GetHerHim]. Exorto você a se juntar a mim na luta para depor este tirano."
 char_interaction.0232.regent:0 "Não ficarei de braços cruzados enquanto [actor.GetSheHe] abusa dos leais vassalos de [ceremonial_liege.GetTitledFirstName]. Exorto você a se juntar a mim na luta para depor este tirano."
 char_interaction.0233.a:0 "O que?!? Isso é um absurdo!"
 char_interaction.0233.desc:0 "Devido a crimes contra a Coroa, você está sob prisão."
 char_interaction.0234.a:0 "Parece que eu tenho pouca escolha..."
 char_interaction.0234.desc:0 "Eu convoco você a honrar nosso acordo pendente e se juntar a mim formalmente como aliado."
 char_interaction.0235.a:0 "Notícia maravilhosa!"
 char_interaction.0235.desc:0 "Estou honrado com sua solicitação e ficaria feliz em chamá-lo de aliado."
 char_interaction.0235.toast_puppeteer:0 "[recipient.GetShortUIName] celebrou uma [alliance|E] com [puppet_or_actor.GetShortUIName]"
 char_interaction.0235.tooltip:0 "[recipient.GetTitledFirstNameNoTooltip] entrou em uma aliança mútua com você"
 char_interaction.0236.a:0 "Preocupante..."
 char_interaction.0236.desc:0 "Depois de longa consideração, receio que tenha chegado à conclusão de que devo recusar sua oferta."
 char_interaction.0236.toast_puppeteer:0 "[recipient.GetShortUIName] recusou uma [alliance|E] com [puppet_or_actor.GetShortUIName]"
 char_interaction.0250.a:0 "Parece que não tenho muita escolha..."
 char_interaction.0250.desc:0 "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nLamento informar que decidi aumentar suas obrigações contratuais.\n\nCompreenda minha situação – [actor.GetPrimaryTitle.GetNameNoTierNoTooltip] precisa ser protegido, e sua contribuição é vital.\n\nE, além disso, você #emphasis me deve!#!"
 char_interaction.0251.desc:0 "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nTenho sido um bom vassalo para você, mas certamente você entende que também tenho meus próprios súditos!\n\nMeu contrato atual é muito restritivo, certamente você veria a sabedoria em torná-lo mais flexível?\n\nE, além disso, você #emphasis me deve!#!"
 char_interaction.0252.a:0 "Concederei acesso às nossas barracas de mercado."
 char_interaction.0252.b:0 "Sim, sua dinastia provou-se digna de se unir à minha."
 char_interaction.0252.c:0 "Contanto que permaneça leal ao seu [recipient.GetTitleTierName]!"
 char_interaction.0252.d.alt:0 "Em vez disso, reduzirei suas obrigações fiscais."
 char_interaction.0252.d:0 "Considere suas obrigações fiscais reduzidas."
 char_interaction.0252.desc:0 "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nEm reconhecimento às nossas ofertas e respeito a [recipient.GetPrimaryTitle.GetNameNoTooltip], peço que honre essa devoção concedendo [SCOPE.Custom('CelestialTributaryRequest')].\n\nQue este favor fortaleça a harmonia entre seu trono e nosso humilde reino."
 char_interaction.0252.e.alt:0 "Que eu reconheça a soberania de [actor.GetPrimaryTitle.GetNameNoTooltip] em seu lugar."
 char_interaction.0252.e:0 "Reconhecerei a soberania de [actor.GetPrimaryTitle.GetNameNoTooltip]."
 char_interaction.0253.a:0 "Assumirei minhas novas responsabilidades."
 char_interaction.0253.desc:0 "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nDecidi que o tipo de administração de [recipient.GetPrimaryTitle.GetNameNoTooltip] será alterado.\n\nEsta decisão serve ao bem maior de [actor.GetPrimaryTitle.GetNameNoTierNoTooltip].\n"
 char_interaction.0261.a:0 "Um abuso flagrante de poder!"
 char_interaction.0261.desc:0 "Pela autoridade investida em mim por [intermediary.GetTitledFirstName], eu tiro de você o seu falso domínio sobre o [landed_title.GetName]. Você deve entregar o título para mim, em custódia da Coroa, imediatamente."
 char_interaction.0262.a:0 "[intermediary.GetSheHe|U] já sabe."
 char_interaction.0262.desc:0 "[intermediary.GetTitledFirstName] ficará sabendo disso, mas $char_interaction.0199.desc$"
 char_interaction.0263.a.tt:0 "Seus crimes são relatados para [intermediary.GetTitledFirstName]"
 char_interaction.0263.a:0 "É traição, então."
 char_interaction.0263.b:0 "Acha que estou blefando? É guerra!"
 char_interaction.0263.desc:0 "Você não é o [intermediary.GetTitleAsNameNoTooltip] e eu não me curvo aos seus caprichos mesquinhos. Se você quer o [landed_title.GetName], terá que tomá-lo pela força."
 char_interaction.0263.result.criminal:0 "Se [actor.GetShortUINameNoTooltip] [Select_CString(actor.IsLocalPlayer, 'recuar', 'recuar' )]"
 char_interaction.0263.result.war:0 "Se [actor.GetShortUINameNoTooltip] [Select_CString(actor.IsLocalPlayer, 'pressionar', 'pressionar' )] a reivindicação"
 char_interaction.0271.a:0 "Não posso recusar, mas se eu #EMP pudesse#!..."
 char_interaction.0271.desc:0 "Pela autoridade do cargo concedido a mim por [intermediary.GetTitledFirstName], estou corrigindo algumas inconsistências triviais nas fronteiras do reino.\n\nVocê está ordenado a entregar a vassalagem de [intermediary.GetTitledFirstName] ao seu senhor feudal legítimo. Eu."
 char_interaction.0272.a:0 "Você nunca teve escolha, [recipient.GetFirstNameNoTooltip]."
 char_interaction.0272.desc:0 "Você ultrapassa os limites da sua autoridade, mas não posso resistir ao cargo do meu [intermediary.GetTitleAsName], mesmo quando é apenas #EMP você#! exercendo-o.\n\nAceito a sua retirada como meu vassalo."
 char_interaction.0273.a.tt:0 "$char_interaction.0263.a.tt$"
 char_interaction.0273.a:0 "Você vai se arrepender disso, [recipient.GetFirstNameNoTooltip]."
 char_interaction.0273.b:0 "Que convite #EMP agradável#!"
 char_interaction.0273.desc:0 "Jurei proteger meus vassalos, e isso inclui protegê-los dos ataques de gente como #EMP você#!.\n\nVocê pode tentar me tirar [intermediary.GetTitledFirstName] e suas terras em uma batalha ou pode fugir de volta para o buraco amaldiçoado onde você se esconde."
 char_interaction.0273.result.criminal:0 "$char_interaction.0263.result.criminal$"
 char_interaction.0273.result.war:0 "$char_interaction.0263.result.war$"
 char_interaction.0281.a:0 "Não tenho escolha."
 char_interaction.0281.desc:0 "Pela autoridade do cargo que [intermediary.GetTitledFirstName] me concedeu, estou prendendo você sob suspeita de atividades iníquas.\n\nEntregue-se à minha guarda ou sofra as consequências."
 char_interaction.0282.a:0 "Onde eu dei a entender que eu queria que você #EMP esquecesse#!?"
 char_interaction.0282.desc:0 "Ao contrário das minhas ações, suas demandas são criminosas.\n\nPelo bem do reino, vou cumprir, mas saiba que não vou esquecer essa afronta."
 char_interaction.0283.a.tt:0 "$char_interaction.0263.a.tt$"
 char_interaction.0283.a:0 "Você vai se arrepender disso, eventualmente."
 char_interaction.0283.b:0 "Acho que você não entendeu. Isso não foi um pedido."
 char_interaction.0283.desc:0 "Me entregar à sua misericórdia? Acho que não. Se você quer me jogar em uma prisão, você terá que vir pessoalmente me pegar.\n\nEmbora, se você insistir, talvez eu #EMP possa#! ir até você... se você permitir que eu traga alguns #EMP amigos#!."
 char_interaction.0291.a:0 "Tenho certeza de que meu senhor feudal sabe o que é melhor."
 char_interaction.0291.b:0 "Pirralho insolente!"
 char_interaction.0291.c:0 "Idiota babão!"
 char_interaction.0291.d:0 "Idiota senil!"
 char_interaction.0291.desc.negative:0 "Você não consegue fazer #EMP nada#! certo? Até o mais lento dos tolos perceberia que você não deveria estar focando em [recipient.GetTitledFirstName]. Pare de intimidar vassalos melhores e faça o seu trabalho."
 char_interaction.0291.desc.neutral:0 "No momento, não está nos meus interesses permitir essa ação. Confio que você entenda e continue governando com dignidade em meu lugar."
 char_interaction.0291.desc.positive:0 "Embora eu confie em você para representar meus interesses, você errou aqui. [recipient.GetTitledFirstName] é um súdito leal e valorizado, e você deveria direcionar suas energias para outro lugar."
 char_interaction.0291.e:0 "Eu. Odeio. [Select_CString( intermediary.IsFemale, 'Essa', 'Esse' )]. #EMP [intermediary.GetWomanMan|U].#!"
 char_interaction.0291.f:0 "Esse #EMP desgraçado#!."
 char_interaction.0291.g:0 "Espero que você apodreça na sua confinamento!"
 char_interaction.0291.h:0 "[intermediary.GetSheHe|U] certamente não vai me impedir da próxima vez..."
 char_interaction.0360.a:0 "Meu suserano!"
 char_interaction.0360.desc:0 "[actor.GetFirstName], aceito graciosamente seu tributo e aguardo ansiosamente por muitos mais caravanas ao longo dos anos!"
 char_interaction.0360.opening:0 "[recipient.Custom2('AppropriateGreetingPositive', actor )]"
 char_interaction.0360.toast_puppeteer:0 "[recipient.GetShortUIName] aceitou a oferta de tributo de [puppet_or_actor.GetShortUINamePossessive]"
 char_interaction.0361.a:0 "Palavras de combate, não esquecidas em breve."
 char_interaction.0361.desc:0 "Tanto sua covardia patética quanto suas ofertas mesquinhas estão abaixo de nós."
 char_interaction.0361.opening:0 "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 char_interaction.0361.toast_puppeteer:0 "[recipient.GetShortUIName] recusou a oferta de tributo de [puppet_or_actor.GetShortUINamePossessive]"
 char_interaction.0362.a:0 "Aceito sua graciosa oferta de tributo."
 char_interaction.0362.desc:0 "[actor.GetFirstName], quaisquer riquezas mesquinhas que [recipient.GetPrimaryTitle.GetName] consiga reunir serão dedicadas à sua glória!"
 char_interaction.0362.opening:0 "[recipient.Custom2('AppropriateGreetingPositive', actor )]"
 char_interaction.0362.toast_puppeteer:0 "[recipient.GetShortUIName] concordou em pagar tributo a [puppet_or_actor.GetShortUIName]"
 char_interaction.0363.a:0 "Um erro #EMP caro#!"
 char_interaction.0363.desc:0 "[recipient.GetPrimaryTitle.GetName|U] nunca se curvará à sua tirania."
 char_interaction.0363.opening:0 "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 char_interaction.0363.toast_puppeteer:0 "[recipient.GetShortUIName] recusou-se a pagar tributo a [puppet_or_actor.GetShortUIName]"
 char_interaction.0370.a.herder:0 "Eu deveria ter mantido meu reino unido."
 char_interaction.0370.a:0 "Que [actor.GetShortUINameNoTooltip] não encontre consolo quando a sorte falhar."
 char_interaction.0370.b:0 "Então teremos que #EMP fazer#! [actor.GetShortUINameNoTooltip] pagar!"
 char_interaction.0370.desc.herder:0 "Você se afastou muito de onde eu o encontrei pela última vez, e não posso continuar pagando tributo a você."
 char_interaction.0370.desc:0 "Decidi que pagar tributo a você não é mais do meu interesse."
 char_interaction.0370.opening.herder:0 "[recipient.Custom2('AppropriateGreetingPositive', actor )]"
 char_interaction.0370.opening:0 "[actor.Custom2('AppropriateGreetingNegative', recipient )]"
 char_interaction.0380.a:0 "Estou me perguntando o que estão planejando..."
 char_interaction.0380.desc:0 "Não desejo mais fornecer sua proteção. Considere seus presentes insignificantes como não mais necessários."
 char_interaction.0380.opening:0 "[actor.Custom2('AppropriateGreetingNegative', recipient )]"
 character_interaction_against_on_cooldown:0 "$INTERACTION_NAME$ indisponível em relação a [TARGET_CHARACTER.GetShortUIName] até [DATE.GetStringLong]"
 character_interaction_on_cooldown:0 "$INTERACTION_NAME$ indisponível até [DATE.GetStringLong]"
 character_interaction_recipient_recieve_on_cooldown:0 "$character_interaction_against_on_cooldown$"
 character_is_rite_head_first:0 "Você é [head_of_rite|E]"
 character_is_rite_head_global:0 "É [head_of_rite|E]"
 character_is_rite_head_third:0 "[Character.GetShortUIName|V] é [head_of_rite|E]"
 character_will_leave_court_holy_order:0 "Vai deixar a corte de [actor.GetTitledFirstNamePossessiveNoTooltip] para entrar na Ordem Sagrada"
 claim_throne_interaction_toast:0 "Planejando Reivindicar o Trono"
 claim_throne_interaction_toast_puppeteer:0 "[puppet_or_actor.GetShortUIName] está conspirando para reivindicar o trono de [recipient.GetShortUIName]"
 claimed_my_artifact_opinion:0 "Comprado uma [personal_artifact_claim|E] em meu [artifact|E]"
 claimed_my_title_opinion:0 "[Concept('claimed', 'Reivindicou')|E] meu [title|E]"
 compelled_me_to_convert_opinion:0 "Me Forçou a Converter"
 compose_insult_poetry_to:0 "Escrever poesia insultuosa"
 compose_poetry:0 "Escrever poesia"
 compose_poetry_to:0 "Escrever poesia para"
 convert_at_war_interaction:0 "$convert_to_religion_interaction$"
 convert_at_war_interaction_desc:0 "Converter-se à [faith|E] de [recipient.GetShortUINamePossessiveNoTooltip] para pôr fim à [holy_war|E]\n#weak (Do [actor.GetFaith.GetName] para o [recipient.GetFaith.GetName])#!"
 convert_to_religion_adventurer_interaction:0 "$convert_to_religion_interaction$"
 convert_to_religion_interaction:0 "Adotar fé"
 convert_to_religion_interaction_desc:0 "Converter-se à [faith|E] de [recipient.GetShortUINamePossessiveNoTooltip]\n#weak (Do [actor.GetFaith.GetName] para o [recipient.GetFaith.GetName])#!"
 convert_to_witch:0 "Converter para Bruxaria"
 council_interaction.0000.opening:0 "[sender.Custom2('AppropriateGreeting', receiver)]"
 council_interaction.0001.a:0 "Excelente!"
 council_interaction.0001.desc.accept:0 "Começarei a trabalhar imediatamente para cumprir minhas novas responsabilidades e verei você na próxima reunião do conselho!"
 council_interaction.0001.desc:0 "É uma honra receber seu pedido para que eu sirva como seu [sender.GetActiveCouncilTask.GetPositionName]."
 council_interaction.0002.a:0 "Acho que preciso encontrar outra pessoa..."
 council_interaction.0002.desc.refuse:0 "Infelizmente, minhas responsabilidades atuais não me deixam tempo para assumir tarefas adicionais, então lamento ter que recusar sua oferta."
 council_interaction.0011.a:0 "Isso é lamentável."
 council_interaction.0011.desc:0 "Ultimamente, minha atenção tem sido dividida demais e estou lutando para cuidar de todas as minhas responsabilidades.\n\nAlgo tem que ceder, e acredito que é melhor para nós dois se eu renunciar como [council_task.GetPositionName]."
 council_interaction.0021.a:0 "Como [sender.GetSheHe] se atreve!?"
 council_interaction.0021.desc:0 "Eu esperava que não chegasse a isso, mas não tenho outra opção. Devo revogar imediatamente sua nomeação como [council_task.GetPositionName] de [sender.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 court_amenities_interactions.0001.a.tt_failure:0 "#negative_value Seus argumentos sobre vestuário têm pouco peso#!"
 court_amenities_interactions.0001.a.tt_success:0 "#positive_value Você defende com sucesso suas escolhas de roupas#!"
 court_amenities_interactions.0001.a:0 "\"E você está vestindo o que, exatamente?\""
 court_amenities_interactions.0001.b.tt:0 "$religious_interaction.2400.b.tt$"
 court_amenities_interactions.0001.b:0 "Pagarei o preço com minha dignidade..."
 court_amenities_interactions.0001.b_turned_down:0 "[recipient.GetShortUIName|U] cedeu à pressão e mudou suas escolhas de estilo"
 court_amenities_interactions.0001.desc.nakey:0 "\"Embora o corpo deva ser celebrado em todas as formas, pelo menos cuide-se! Há quanto tempo você não toma banho?\""
 court_amenities_interactions.0001.desc:0 "\"Quem você pensa que é, desfilando com essa roupa ridícula? Esta é uma corte real, não um bordel! Vá e encontre algo mais humilde!\""
 court_amenities_interactions.0001.desc_byzantine:0 "“Por que você presume ser aceitável usar púrpura? Apenas #EMP eu#! e minha família têm essa honra! Remova imediatamente!”"
 court_amenities_interactions.0001.desc_court_position:0 "\"Você acha #EMP isso#! traje digno de um [recipient.GetTitleAsNameNoTooltip]? Você parece um tolo! Desista imediatamente ou chamarei os guardas!\""
 court_amenities_interactions.0001.desc_intro:0 "Enquanto percorro os corredores de [debate_locale.GetNameNoTierNoTooltip] como de costume, sou subitamente interrompido por ninguém menos que [actor.GetTitledFirstName]!\n\n[actor.GetSheHe|U] pressiona o dedo com força contra meu peito."
 court_amenities_interactions.0001.desc_outro:0 "\n\n[actor.GetSheHe|U] me acusou de violar as leis sumptuárias [actor.GetPrimaryTitle.GetAdjective], uma mancha social pela qual é improvável que eu seja perdoado — embora eu possa dar um jeito em [actor.GetTitledFirstNameNoTooltip]! Talvez até conseguir danos..."
 court_amenities_interactions.0001.t:0 "Acusado de Violar a Lei Sumptuária!"
 court_amenities_interactions.0002.a_lost.humble:0 "Deixa eles verem. Eu não tenho vergonha."
 court_amenities_interactions.0002.a_lost.lustful:0 "Eu geralmente reservo essa honra para meus amantes."
 court_amenities_interactions.0002.a_lost:0 "Eu talvez nunca mais mostre meu rosto novamente."
 court_amenities_interactions.0002.a_won:0 "Hah! Que piada!"
 court_amenities_interactions.0002.desc_intro:0 "Devemos ter ficado debatendo as leis de aparência e cuidados pessoais por horas, gesticulando violentamente um para o outro, citando leis antigas que poucos na corte pareciam estar cientes. Conforme a fumaça do espetáculo se dissipou,"
 court_amenities_interactions.0002.desc_lost.nakey:0 "Estou chocado ao descobrir que, na verdade, estou violando a lei!\n\n Pela primeira vez na minha vida, sinto vergonha do corpo que [ROOT.Char.GetFaith.CreatorName] me deu, e quando sinto minha nudez se tornar obscena, guardas e estilistas próximos se aproximam para me vestir com roupas comuns e sujas."
 court_amenities_interactions.0002.desc_lost:0 "Estou chocado ao descobrir que, na verdade, estou violando a lei!\n\n Fico envergonhado enquanto os guardas e estilistas do castelo [debate_locale.GetNameNoTierNoTooltip] me despojam até minha roupa de baixo e continuam me despojando! Exposto à corte, fujo da cena com meu orgulho entre as pernas."
 court_amenities_interactions.0002.desc_won.nakey:0 "parece que eu ganhei!\n\n Como tal, [actor.GetName] foi forçado a vestir roupas de um plebeu e esconder seu corpo vergonhosamente negligenciado do mundo."
 court_amenities_interactions.0002.desc_won:0 "parece que eu ganhei!\n\n Como tal, [recipient.GetName] foi forçado a se despir até sua roupa de baixo! Todos presentes na corte viram [recipient.GetSheHe] exatamente como [ROOT.Char.GetFaith.CreatorName] criou [recipient.GetSheHe]!"
 court_amenities_interactions.0002.t:0 "Um Debate Fashionável"
 court_amenities_interactions.0003.desc_won.nakey:0 "Parece que eu ganhei!\n\n Como resultado, [actor.GetName] foi forçado a vestir as roupas de um plebeu e esconder seu corpo vergonhosamente negligenciado do mundo."
 court_amenities_interactions.0003.desc_won:0 "Parece que eu ganhei!\n\n Como resultado, [actor.GetName] foi forçado a se despir até suas roupas íntimas! Todos presentes na corte viram [actor.GetSheHe] exatamente como [ROOT.Char.GetFaith.CreatorName] criou [actor.GetSheHe]!"
