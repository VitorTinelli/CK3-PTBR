 end_scheme:0 "#D Encerrar conspiração#!"
 end_war_attacker_defeat_attacker_desc:0 "\nEu gostaria de saber o que me possuía para pensar que poderia enfrentar um inimigo tão formidável como você em uma luta. Infelizmente, não posso mudar o passado, apenas o futuro.\n\nEu me rendo a você - vamos seguir em frente a partir deste conflito."
 end_war_attacker_defeat_defender_desc:0 "\nVocê pode ter pensado que poderia me vencer, mas eu provei que você estava errado. Não torne isso mais complicado do que precisa ser - renda-se e vamos acabar com esta guerra."
 end_war_attacker_defeat_interaction:0 "$end_war_attacker_victory_interaction$"
 end_war_attacker_victory_attacker_desc:0 "\nEstá claro para todos que eu o derrotei. Por que continuar resistindo? Há uma certa dignidade em aprender a aceitar seu destino."
 end_war_attacker_victory_defender_desc:0 "\nVocê me venceu. Não posso mais resistir - eu me rendo a você e seus exércitos. Apenas deixe-me manter minha dignidade."
 end_war_attacker_victory_interaction:0 "Oferta de Paz"
 end_war_attacker_white_peace_attacker_desc:0 "\nEstá claro para mim agora que eu errei em atacá-lo. Já houve sangue suficiente nesta guerra - vamos acabar com essa luta sem sentido."
 end_war_attacker_white_peace_defender_desc:0 "\nNão foi derramado sangue suficiente nesta sua guerra sem sentido? Nenhum de nós tem algo a ganhar continuando a lutar. Vamos fazer as pazes."
