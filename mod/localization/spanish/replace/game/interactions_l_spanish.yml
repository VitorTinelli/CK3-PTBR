 marriage_interaction.0010.ending.b_recipient_desc:0 "\n\nQue [recipient.GetFaith.FertilityGodName] nos abençoe!"
 marriage_interaction.0010.ending.c_actor_desc:0 "\n\nQue você traga ao outro felicidade e realização!"
 marriage_interaction.0010.ending.c_both_desc:0 "\n\nQue nós nos tragam felicidade e realização, [Select_CString( secondary_actor.IsFemale, 'minha', 'meu' )] [secondary_actor.Custom('ComplimentAdjective')] [secondary_actor.Custom('WifeHusband')]!"
 marriage_interaction.0010.ending.c_desc:0 "\n\nQue eles tragam um ao outro felicidade e realização!"
 marriage_interaction.0010.ending.c_recipient_desc:0 "\n\nQue nós nos tragam felicidade e realização!"
 marriage_interaction.0010.ending.d_actor_desc:0 "\n\nQue o seu casamento seja frutífero apesar da animosidade entre vocês."
 marriage_interaction.0010.ending.d_both_desc:0 "\n\nQue o nosso casamento seja frutífero apesar da animosidade entre nós, [Select_CString( secondary_actor.IsFemale, 'minha', 'meu' )] [secondary_actor.Custom('WifeHusband')] [secondary_actor.Custom2('InsultAdjective', ROOT.Char)]!"
 marriage_interaction.0010.ending.d_desc:0 "\n\nQue o casamento deles seja frutífero apesar da animosidade entre eles."
 marriage_interaction.0010.ending.d_recipient_desc:0 "\n\nQue o nosso casamento seja frutífero apesar da animosidade entre nós."
 marriage_interaction.0010.ending.e_actor_desc:0 "\n\nNunca vi um casal tão perfeito, vocês foram feitos um para o outro!"
 marriage_interaction.0010.ending.e_both_desc:0 "\n\nFinalmente estamos unidos em [secondary_actor.Custom('GetCulturallyAppropriateMarriageReference')], assim como em alma e coração, [Select_CString( secondary_actor.IsFemale, 'minha', 'meu' )] [secondary_actor.Custom('ComplimentAdjective')] [secondary_actor.Custom('WifeHusband')]!"
