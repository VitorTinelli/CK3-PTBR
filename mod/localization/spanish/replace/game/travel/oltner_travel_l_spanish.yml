 trap_scenario_water_covered_ditch:0 "quase tropeça em uma vala profunda coberta de água, mas é puxad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] para trás por"
 trap_scenario_water_hole:0 "quase cai em um buraco de água coberto por juncos, mas é rapidamente segurad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por"
 trap_scenario_wire_trap:0 "está prestes a tropeçar em uma armadilha de fio oculta, mas é rapidamente alertad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por"
 travel_delayed:0 "Jornada Atrasada"
 travel_events_oltner_2.1000.desc:0 "O sol castiga as dunas de [location.GetName], fazendo com que cada passo seja um testemunho de resistência. No entanto, em meio a essa vasta aridez, uma oásis de vegetação floresce - um feito agrícola no coração do deserto.\n\nEnquanto admiramos essa anomalia, o administrador dessas terras se aproxima com um sorriso marcado pelo sol. \"Viajantes,\" [local_character.GetSheHe] chama, \"venham, testemunhem os frutos do nosso trabalho. Talvez levem contos de nossa vitória sobre as areias de volta para suas terras natais!\""
 travel_events_oltner_2.1000.option.a:0 "\"Mostre-nos como domaram o deserto.\""
 travel_events_oltner_2.1000.option.b:0 "\"Agradecemos, mas devemos recusar.\""
 travel_events_oltner_2.1000.option.c:0 "\"Talvez uma amostra da sua colheita para nos sustentar?\""
 travel_events_oltner_2.1000.option.d:0 "\"Gostaria de ouvir mais sobre suas vidas aqui.\""
 travel_events_oltner_2.1000.t:0 "Areias Cultivadas"
 travel_events_oltner_2.1010.b:0 "\"Ah, deixe-me participar da decocção!\""
 travel_events_oltner_2.1010.c:0 "\"Meu [ROOT.Char.Custom('GetCourtType')] poderia precisar de um médico, por que não se junta a nós?\""
 travel_events_oltner_2.1010.d:0 "\"Aqui está uma doação, use-a para ajudar os enfermos.\""
 travel_events_oltner_2.1010.desc:0 "Enquanto viajamos pela [location.Custom('TerrainTypeProvince')] de [location.GetName], um hospício coberto com belas artes [location.GetCulture.GetNameNoTooltip] aparece ao longo da estrada.\n\n\"Viajantes, parecem cansados. Nossas portas estão abertas para descanso e cuidados,\" oferece um médico com um sorriso gentil. Dentro, o ar é calmo, preenchido com o aroma reconfortante das ervas.\n\n\"Aqui, experimente minha famosa #EMP 'Decocção de [location.Custom('get_region_flower_type')|U]'#!, ela revigorará suas almas!\""
 travel_events_oltner_2.1010.t:0 "Hospícios Hospitaleiros"
 travel_events_oltner_2.1020.a:0 "\"Deixe as festividades desta noite revigorar nossas almas!\""
 travel_events_oltner_2.1020.b:0 "\"Estou intrigado pela resistência dos camelos.\""
 travel_events_oltner_2.1020.c:0 "\"Gostaria de comprar o seu melhor camelo para meu exército.\""
 travel_events_oltner_2.1020.d:0 "\"Infelizmente, devo atender ao chamado da jornada e recusar.\""
 travel_events_oltner_2.1020.desc:0 "Enquanto minha comitiva e eu atravessamos a vastidão de [location.GetName], a silhueta distinta de uma fazenda de camelos surge à vista. Quando a noite cai, um pastor se aproxima.\n\n\"Bem-vindos, ilustres convidados,\" [local_character.GetSheHe] sorri. \"Os camelos de [location.GetName] nos sustentam, e esta noite honramos essas nobres bestas. Vocês se juntam a nós sob as estrelas para um banquete e contos do deserto?\""
 travel_events_oltner_2.1020.t:0 "O Banquete do Pastor de Camelos"
 travel_events_oltner_2.1030.a:0 "\"Estou ansioso para ver suas mercadorias, vamos negociar.\""
 travel_events_oltner_2.1030.b:0 "\"Não é necessário, mas talvez possamos viajar juntos por um tempo?\""
 travel_events_oltner_2.1030.c:0 "\"Mostre-me algo único, um verdadeiro tesouro de [location.GetNameNoTooltip].\""
 travel_events_oltner_2.1030.d:0 "\"Já carregamos fardos suficientes...\""
 travel_events_oltner_2.1030.desc:0 "Viajando pelas areias de [location.GetName], uma caravana de camelos carregados cruza nosso caminho. O mestre da caravana nota nossa comitiva e interrompe a procissão.\n\n\"Nobres viajantes,\" [local_character.GetSheHe] chama com um brilho astuto no olhar [local_character.GetHerHim], \"talvez queiram dar uma olhada nos tesouros que essas fortes bestas carregam? Pelo preço certo, as maravilhas do deserto podem acompanhá-los em suas jornadas.\""
 travel_events_oltner_2.1030.t:0 "Uma Caravana Carregada"
 travel_events_oltner_2.1040.a:0 "\"Por [ROOT.Char.GetFaith.HighGodName], vamos ficar aqui por alguns dias!\""
 travel_events_oltner_2.1040.b:0 "\"Você parece sábio, por que não se junta a nós?\""
 travel_events_oltner_2.1040.c:0 "\"Talvez devêssemos negociar?\""
 travel_events_oltner_2.1040.d:0 "\"Seu oásis é um alívio para os olhos cansados, mas o tempo é precioso.\""
 travel_events_oltner_2.1040.desc:0 "Enquanto atravessamos as planícies áridas de [location.GetName], um sereno oásis surge à vista, cercado por uma frota de camelos.\n\nUm ancião sábio, reclinado à beira da água, nota nossa aproximação e gesticula convidativamente. \"Viajantes cansados,\" [local_character.GetSheHe] começa, com a voz suave como a brisa da noite, \"o espírito do deserto pode ser implacável. Repousem junto às nossas águas, deixem a força tranquila dos camelos restaurá-los.\""
 travel_events_oltner_2.1040.t:0 "Oásis de Tranquilidade"
 travel_events_oltner_2.1050.a:0 "\"Com prazer!\""
 travel_events_oltner_2.1050.b:0 "\"Quanto de ouro pelo mais forte?\""
 travel_events_oltner_2.1050.c:0 "\"Estou mais interessado na #EMP sua#! destreza como $knight_culture_player_plural_no_tooltip_lowercase$!\""
 travel_events_oltner_2.1050.d:0 "\"Belas criaturas, mas devo priorizar minha jornada.\""
 travel_events_oltner_2.1050.desc:0 "Enquanto atravessamos os arredores de [location.GetName], o estrondo dos cascos quebra o silêncio. Uma equipe de cavalos de fineza e seus cavaleiros se aproxima, uma visão majestosa contra o pano de fundo de [location.Custom('TerrainTypeProvincePrefix')] [location.Custom('TerrainTypeProvince')].\n\n\"Salve, viajantes!\" chama o líder deles. \"Somos emissários do [location.GetTitle.GetName]. Gostariam de testemunhar a destreza de nossos corcéis?\""
 travel_events_oltner_2.1050.t:0 "Emissários Equinos"
 travel_events_oltner_2.1060.a:0 "\"Mostre-me o seu cavalo mais rápido.\""
 travel_events_oltner_2.1060.b:0 "\"Preciso de todos os seus melhores cavalos!\""
 travel_events_oltner_2.1060.c:0 "\"Você estaria interessado em comprar nossas éguas excedentes?\""
 travel_events_oltner_2.1060.d:0 "\"Lamentavelmente, devemos #EMp partir rapidamente#!...\""
 travel_events_oltner_2.1060.desc:0 "O cheiro de feno e o som de relinchos nos levam até os renomados estábulos de [location.GetName]. O mestre de estábulos, uma figura bem-respeitada nesta região, nos saúda calorosamente.\n\n\"Bem-vindos,\" [local_character.GetSheHe] proclama, \"meus cavalos estão entre os mais rápidos que existem. Considerariam comprar um companheiro tão nobre para suas viagens?\""
 travel_events_oltner_2.1060.t:0 "Administrador dos Estábulos"
 travel_events_oltner_2.1070.a:0 "\"Podemos ajudar a curar essa nobre besta?\""
 travel_events_oltner_2.1070.b:0 "\"Você deveria se tornar meu Mestre dos Cavalos!\""
 travel_events_oltner_2.1070.c:0 "\"Diga, você poderia me ensinar este ofício?\""
 travel_events_oltner_2.1070.d:0 "\"Espero que ela se recupere rapidamente, adeus.\""
 travel_events_oltner_2.1070.desc:0 "Em meio aos pastos tranquilos de [location.GetName], uma figura cuida de um cavalo com uma pata ferida. À medida que nos aproximamos, o curandeiro olha para cima, com os olhos [local_character.GetHerHim] refletindo anos de conhecimento.\n\n\"Um simples passo em falso,\" [local_character.GetSheHe] explica, \"mas ela correrá novamente.\" Comovidos pelos cuidados [local_character.GetHerHim], paramos em nossa jornada."
 travel_events_oltner_2.1070.t:0 "O Curandeiro de Cavalos"
 travel_events_oltner_2.1080.a:0 "\"Escolho o seu camelo mais majestoso.\""
 travel_events_oltner_2.1080.b:0 "\"Quero o espécime mais resistente.\""
 travel_events_oltner_2.1080.c:0 "\"O seu camelo mais rápido servirá.\""
 travel_events_oltner_2.1080.d:0 "\"Prefiro que me pague em ouro...\""
 travel_events_oltner_2.1080.desc:0 "Ao passarmos pelas fazendas de camelos de [location.GetName], um odor pungente atinge nossos sentidos. Os camelos, vitais como são, produzem um cheiro que permeia todos os cantos.\n\nDe repente, um dos nossos cavalos foge para a distância, aparentemente aterrorizado com o cheiro.\n\n\"Desculpe, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord|U]!\" o fazendeiro exclama. \"Deixe-me escolher um dos meus camelos mais magníficos para compensar sua perda.\""
 travel_events_oltner_2.1080.t:0 "Prodígio Pungente"
 travel_events_oltner_2.1090.a:0 "\"Deixe-nos descansar sob sua proteção, amigo.\""
 travel_events_oltner_2.1090.b:0 "\"Diga-nos, estamos seguindo o caminho certo?\""
 travel_events_oltner_2.1090.c:0 "\"Talvez você possa ser nosso guia por estas terras?\""
 travel_events_oltner_2.1090.d:0 "\"Precisamos partir rapidamente.\""
 travel_events_oltner_2.1090.desc:0 "No silêncio de [location.GetName], onde os ventos quentes esculpem as areias, uma torre de vigilância solitária se mantém atenta. Seu guarda, um sentinela austero, nos saúda calorosamente.\n\n\"Estimados convidados!\" [Select_CString( local_character.IsFemale, 'a', 'o' )] [local_character.GetWomanMan] grita do topo. \"Há algo que eu possa fazer por vocês? Talvez queiram se juntar a mim para contemplar a calma das [location.Custom('TerrainTypeProvince')]?\""
 travel_events_oltner_2.1090.t:0 "Sentinela das Dunas Silenciosas"
 travel_events_oltner_2.1100.a:0 "\"Mostre-me como você cuida do seu rebanho.\""
 travel_events_oltner_2.1100.b:0 "\"Vamos encher nossos suprimentos, e nossas barrigas!\""
 travel_events_oltner_2.1100.c:0 "\"Queijo azul de [location.GetTitle.GetNameNoTierNoTooltip] soa #EMP delicioso!#!\""
 travel_events_oltner_2.1100.d:0 "\"Precisamos apressar nossa jornada.\""
 travel_events_oltner_2.1100.desc:0 "A jornada por [location.GetName] revela pastagens vastas pontilhadas de gado. Quando minha comitiva faz uma pausa na borda de um campo verdejante, o vaqueiro se aproxima. Tocando alegremente sua lira, [local_character.GetSheHe] nos saúda com um grande sorriso.\n\n\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLadyLord|U],\" [local_character.GetSheHe] começa, \"estes animais são o orgulho de nossa província! Quer se juntar a mim para testemunhar nosso trabalho, reabastecer seus suprimentos, ou talvez degustar nosso famoso queijo azul de [location.GetTitle.GetNameNoTierNoTooltip]?\""
 travel_events_oltner_2.1100.t:0 "Abundância Bovina"
 travel_events_oltner_2.1110.a:0 "\"Um conjunto de armaduras não cairia mal.\""
 travel_events_oltner_2.1110.b:0 "\"Estou procurando uma arma.\""
 travel_events_oltner_2.1110.c:0 "\"Você faz escudos?\""
 travel_events_oltner_2.1110.d:0 "\"Prefiro meus próprios ferreiros, adeus.\""
 travel_events_oltner_2.1110.desc:0 "Nossa jornada nos leva a [location.GetName], onde o martelar rítmico dos ferreiros forma o coração do comércio local. Fumaça sai das chaminés enquanto os ferreiros, banhados em suor e fuligem, transformam o bruto no notável.\n\nUm dos ferreiros enxuga a testa e me chama, \"Bem-vindo, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLadyLord|U],\" [local_character.GetSheHe] declara. \"Somos mestres ferreiros [local_character.GetCulture.GetNameNoTooltip], os melhores que há! Por favor, dê uma olhada em nossas mercadorias.\""
 travel_events_oltner_2.1110.t:0 "O Som do Ferreiro"
 travel_events_oltner_2.1120.a:0 "\"Aqui, tome este ouro para ajudá-lo a se reerguer.\""
 travel_events_oltner_2.1120.b:0 "\"Junte-se a nós, poderíamos usar um ferreiro.\""
 travel_events_oltner_2.1120.c:0 "\"Que terrível. Bem, que seja!\""
 travel_events_oltner_2.1120.desc:0 "Enquanto nossa comitiva passeia por [location.GetName], encontramos a oficina de um ferreiro em desordem. O ferreiro, coberto de fuligem, parece aflito, lamentando sobre um forno quebrado.\n\n\"Oh, [local_character.GetFaith.HighGodName] amaldiçoou [Select_CString( local_character.IsFemale, 'a', 'o' )] pobre [local_character.GetTitledFirstName]! A desgraça atingiu minha bigorna!\" [local_character.GetSheHe] explica. \"Sem reparos, meu ofício—e minha fonte de sustento—se extinguem, oh, quão triste é minha sorte!\""
 travel_events_oltner_2.1120.t:0 "Um Ferreiro Quebrado"
 travel_events_oltner_2.1130.a:0 "\"Por favor, guiem-nos com segurança através do [location.Custom('TerrainTypeProvince')].\""
 travel_events_oltner_2.1130.b:0 "\"Você parece forte. Que tal se juntar a mim?\""
 travel_events_oltner_2.1130.c:0 "\"Todos vocês parecem formidáveis, vou dobrar o que [Select_CString( location.GetTitle.GetHolder.IsFemale, 'a', 'o' )] [location.GetTitle.GetHolder.GetFirstNameNoTooltip] está pagando!\""
 travel_events_oltner_2.1130.d:0 "\"Não é necessário, mas obrigado.\""
 travel_events_oltner_2.1130.desc:0 "À medida que a silhueta de [location.GetName] se aproxima, os contornos ásperos dos fortes colinas dominam a paisagem.\n\nUm grupo de guerreiros com aparência brutal se aproxima, sendo o líder o mais rude de todos. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [local_character.GetSheHe] acena, \"somos [local_character.GetWomenMen] da guarnição d[Select_CString( location.GetTitle.GetHolder.IsFemale, 'a', 'o' )] [location.GetTitle.GetHolder.GetTitledFirstNamePossessive]. Por uma pequena taxa, podemos protegê-lo em sua jornada. O que me diz?\""
 travel_events_oltner_2.1130.t:0 "O Sentinela [location.Custom('TerrainTypeProvince')|U]"
 travel_events_oltner_2.1140.a:0 "\"Isso mesmo! Agora vá contar para sua aldeia sobre mim!\""
 travel_events_oltner_2.1140.b:0 "\"Bravos defensores, digam-nos o caminho mais rápido por essas [location.Custom('TerrainTypeProvince')].\""
 travel_events_oltner_2.1140.c:0 "\"#EMP *Desenhe sua arma e assuste as crianças*#!\""
 travel_events_oltner_2.1140.d:0 "\"Valorize seus jogos, criança. Precisamos ir embora.\""
 travel_events_oltner_2.1140.desc:0 "Ao pé de um forte imponente em [location.GetName], um grupo de crianças brinca de guerreiros, sua risada contrastando com a solenidade da pedra.\n\nUma criança, ousada e de olhos brilhantes, se aproxima com uma espada de madeira. \"Parem! Ninguém pode passar pelo forte d[Select_CString( local_character.IsFemale, 'a', 'o' )] [local_character.GetFirstName] e seu [local_character.Custom('ComplimentAdjective')] grupo!\" a criança exclama alegremente. \"Oh, espere, você é um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip]!?\""
 travel_events_oltner_2.1140.t:0 "Defensores Diminutos"
 travel_events_oltner_2.1150.a.failure:0 "Os bandidos matam o comandante e fogem."
 travel_events_oltner_2.1150.a.success:0 "Você mata todos os bandidos."
 travel_events_oltner_2.1150.a:0 "\"Devemos ajudá-los, vamos lá!\""
 travel_events_oltner_2.1150.b.failure:0 "Os bandidos vencem"
 travel_events_oltner_2.1150.b.success:0 "A guarnição vence"
 travel_events_oltner_2.1150.b:0 "\"Esperamos, depois pegamos os corpos.\""
 travel_events_oltner_2.1150.c.failure:0 "[retinue_member.GetFirstName] é 'tragicamente' morto"
 travel_events_oltner_2.1150.c.success:0 "[retinue_member.GetFirstName] mata o líder dos bandidos"
 travel_events_oltner_2.1150.c:0 "\"[retinue_member.GetFirstNameNoTooltip], ajude-os! Nós... ficaremos aqui.\""
 travel_events_oltner_2.1150.d:0 "\"Essa não é nossa batalha.\""
 travel_events_oltner_2.1150.desc:0 "O som ecoante de chifres preenche o ar enquanto atravessamos o [location.Custom('TerrainTypeProvince')] perto de [location.GetName]. Os fortes de colina reverberam com o som, um chamado à armas que ressoou por gerações.\n\nMere segundos após o primeiro som, uma multidão de guerreiros [local_character.GetCulture.GetName] da guarnição emerge da fortificação mais próxima, atacando um grupo de bandidos e foras-da-lei aterrorizados."
 travel_events_oltner_2.1150.t:0 "Chifres Ecoantes"
 travel_events_oltner_2.1160.a:0 "\"Sua engenhosidade é louvável!\""
 travel_events_oltner_2.1160.b:0 "\"Não se associe com os inferiores!\""
 travel_events_oltner_2.1160.c:0 "\"Isso certamente apressará nossa jornada.\""
 travel_events_oltner_2.1160.desc:0 "Enquanto atravessamos um caminho desafiador em [location.GetName], ouço risos à frente. M[Select_CString( entourage_member_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] e m[Select_CString( entourage_member_2.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName] estão trabalhando juntos para atravessar [location.Custom('GetRandomCrossingToBridge')].\n\n\"[entourage_member_1.GetFirstNameNoTooltip], sua ideia de construir uma ponte improvisada foi brilhante!\" exclama [Select_CString( entourage_member_2.IsFemale, 'a', 'o' )] [entourage_member_2.GetFirstNameNoTooltip]. [entourage_member_1.GetFirstNameNoTooltip] responde com uma risada, \"E seu rápido pensamento com aqueles [location.Custom('GetRandomImprovisedBridgeMaterial')] prendeu tudo!\"\n\nParece que esse obstáculo gerou uma nova amizade!"
 travel_events_oltner_2.1160.t:0 "Vínculo à Beira do Caminho"
 travel_events_oltner_2.1170.a.failure:0 "A imprudência d[Select_CString( entourage_member_1.IsFemale, 'a', 'o' )] [entourage_member_1.GetFirstNamePossessive] resulta em ferimentos"
 travel_events_oltner_2.1170.a.success:0 "A estratégia arriscada d[Select_CString( entourage_member_1.IsFemale, 'a', 'o' )] [entourage_member_1.GetFirstNamePossessive] dá certo"
 travel_events_oltner_2.1170.a:0 "\"Escutem-me, vocês precisam #EMP trabalhar juntos#!.\""
 travel_events_oltner_2.1170.b:0 "\"[entourage_member_1.GetFirstNameNoTooltip] está cert[Select_CString( entourage_member_1.IsFemale, 'a', 'o' )], não podemos nos dar ao luxo de perder tempo.\""
 travel_events_oltner_2.1170.c.failure:0 "A cautela d[Select_CString( entourage_member_2.IsFemale, 'a', 'o' )] [entourage_member_2.GetFirstNamePossessive] resulta em atrasos"
 travel_events_oltner_2.1170.c.success:0 "A estratégia cautelosa d[Select_CString( entourage_member_2.IsFemale, 'a', 'o' )] [entourage_member_2.GetFirstNamePossessive] dá certo"
 travel_events_oltner_2.1170.c:0 "\"Sigamos a cautela como [Select_CString( entourage_member_2.IsFemale, 'a', 'o' )] [entourage_member_2.GetFirstNameNoTooltip] sugeriu.\""
 travel_events_oltner_2.1170.d:0 "\"Oh, querido [ROOT.Char.GetFaith.HighGodName], que crianças...\""
 travel_events_oltner_2.1170.desc:0 "Ao viajar pelo terreno acidentado de [location.GetName], surge um desafio quando o [location.Custom('GetPrecariousTerrainFeature')].\n\nM[Select_CString( entourage_member_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] e m[Select_CString( entourage_member_2.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName] começam a discutir sobre a melhor abordagem para atravessar a trilha traiçoeira. \"[entourage_member_1.GetFirstNameNoTooltip], sua sugestão é imprudente!\" exclama [Select_CString( entourage_member_2.IsFemale, 'a', 'o' )] [entourage_member_2.GetFirstNameNoTooltip], visivelmente frustrado. [entourage_member_1.GetFirstNameNoTooltip] retruca, \"E a sua é covarde!\"\n\nParece que minha comitiva chegou a um impasse..."
 travel_events_oltner_2.1170.t:0 "Caminho da Rivalidade"
 travel_events_oltner_2.1180.a:0 "Fofo, mas [Select_CString( seduced_entourage.IsFemale, 'a', 'o' )] [seduced_entourage.GetFirstNameNoTooltip] não consegue resistir #EMP a mim.#!"
 travel_events_oltner_2.1180.b:0 "\"Oi! Sobre o que vocês estão falando? Posso me juntar a vocês!?\""
 travel_events_oltner_2.1180.c:0 "Drama... Seria #EMP uma verdadeira pena#! se isso vazasse..."
 travel_events_oltner_2.1180.d:0 "Tanta ternura, vou deixá-los a sós."
 travel_events_oltner_2.1180.desc:0 "Sob a luz da lua em [location.GetName], escuto uma conversa íntima entre m[Select_CString( entourage_member_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] e m[Select_CString( entourage_member_2.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName].\n\n\"Oh [entourage_member_1.GetFirstNameNoTooltip], m[Select_CString( entourage_member_1.IsFemale, 'inha', 'eu' )] [entourage_member_1.Custom('RomanticComplimentAdjective')] [entourage_member_1.Custom('RomanticComplimentNoun')], você faz essas noites estreladas inesquecíveis,\" confessa [entourage_member_2.GetFirstNameNoTooltip], com a voz [entourage_member_2.GetHerHim] tremendo. [entourage_member_1.GetFirstNameNoTooltip] responde suavemente, \"Nunca imaginei encontrar alguém que me entendesse tão bem.\"\n\nParece que o amor está florescendo em minha comitiva..."
 travel_events_oltner_2.1180.t:0 "Confissões ao Luar"
 travel_events_oltner_2.1190.a:0 "\"Pertence [Select_CString( entourage_member_1.IsFemale, 'a', 'ao' )] [entourage_member_1.GetFirstNameNoTooltip].\""
 travel_events_oltner_2.1190.b:0 "\"[entourage_member_2.GetFirstNameNoTooltip] deve ficar com isso.\""
 travel_events_oltner_2.1190.c:0 "\"Vocês são duas crianças, entreguem isso!\""
 travel_events_oltner_2.1190.d.1:0 "[entourage_member_2.GetName] pega"
 travel_events_oltner_2.1190.d.2:0 "[entourage_member_1.GetName] pega"
 travel_events_oltner_2.1190.d:0 "\"Realmente #EMP não#! temos tempo para isso!\""
 travel_events_oltner_2.1190.desc:0 "No silêncio do nosso acampamento próximo a [location.GetName], um clamor estridente quebra a calma. [Select_CString( entourage_member_1.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] confronta [Select_CString( entourage_member_2.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName] de forma acusatória, segurando um precioso [entourage_member_1.Custom('GetRandomSmallPreciousItem')].\n\n\"Seu ladrão! Isso era da minha mãe!\" exclama [entourage_member_1.GetFirstNameNoTooltip], com os olhos ardendo de raiva. [entourage_member_2.GetFirstNameNoTooltip] nega veementemente a acusação, \"S[Select_CString( entourage_member_2.IsFemale, 'ua', 'meu' )] [entourage_member_1.Custom2('InsultNoun', SCOPE.sC('entourage_member_2'))] mentiros[Select_CString( entourage_member_2.IsFemale, 'a', 'o' )], isso sempre foi meu!\""
 travel_events_oltner_2.1190.t:0 "Uma Relíquia Roubada"
 travel_events_oltner_2.1200.a:0 "Ótima decisão, [entourage_member_1.GetFirstNameNoTooltip]!"
 travel_events_oltner_2.1200.b:0 "[entourage_member_2.GetFirstNameNoTooltip], você não deve nada a [entourage_member_1.GetSheHe]."
 travel_events_oltner_2.1200.c:0 "Vamos seguir com o máximo de cuidado por um tempo."
 travel_events_oltner_2.1200.d:0 "Ai, precisamos nos apressar!"
 travel_events_oltner_2.1200.desc:0 "Enquanto passamos pela [location.Custom('TerrainTypeProvince')] de [location.GetName], m[Select_CString( entourage_member_2.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName] [location.Custom('GetRandomHazardAndRescue')] m[Select_CString( entourage_member_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName].\n\n\"[entourage_member_2.GetFirstNameNoTooltip], você precisa ser mais cuidados[Select_CString( entourage_member_2.IsFemale, 'a', 'o' )],\" [entourage_member_1.GetFirstNameNoTooltip] admoesta, com preocupação evidente na sua voz. [entourage_member_2.GetFirstNameNoTooltip] oferece um sorriso tímido e grato em resposta. \"Obrigado, te devo uma!\""
 travel_events_oltner_2.1200.t:0 "Anjo da Guarda"
 travel_events_oltner_2.1210.a.failure:0 "Não há nada a descobrir"
 travel_events_oltner_2.1210.a.success:0 "Você descobre algo"
 travel_events_oltner_2.1210.a:0 "Se algo está acontecendo entre esses dois, eu vou descobrir..."
 travel_events_oltner_2.1210.b:0 "\"[entourage_member_2.GetFirstNameNoTooltip], o mundo deveria ouvir você tocar e cantar!\""
 travel_events_oltner_2.1210.c.failure:0 "Você não consegue aprender muito"
 travel_events_oltner_2.1210.c.success:0 "Você aprende a tocar, pelo menos um pouco"
 travel_events_oltner_2.1210.c:0 "\"Você... você pode me ensinar a tocar assim?\""
 travel_events_oltner_2.1210.d:0 "\"Ah, que melodia bonita.\""
 travel_events_oltner_2.1210.desc:0 "Sob o céu estrelado de [location.GetName], o acampamento é agraciado com uma apresentação inesperada. M[Select_CString( entourage_member_2.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName] surpreende a todos com uma melodia comovente, a voz [entourage_member_2.GetHerHim] ecoando em elogios para m[Select_CString( entourage_member_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName].\n\n[entourage_member_1.GetFirstName] ouve atentamente, visivelmente envergonhad[Select_CString( entourage_member_1.IsFemale, 'a', 'o' )]. Quando a música termina, um reconhecimento silencioso passa entre eles."
 travel_events_oltner_2.1210.t:0 "Serenata Noturna"
 travel_events_oltner_2.1220.a:0 "Hm. Técnica fascinante."
 travel_events_oltner_2.1220.b:0 "\"#EMP GUARDAS!#!\""
 travel_events_oltner_2.1220.c:0 "Eu vi... nada..."
 travel_events_oltner_2.1220.desc:0 "Na calada da noite, em nosso acampamento perto de [location.GetName], saio silenciosamente. O que foi esse som?\n\nFoi então que vejo: [location.Custom('GetTerrainMurderMethod')|U]\n\n[entourage_member_1.GetFirstNameNoTooltip] rapidamente vasculha a área, sem perceber que eu vi tudo."
 travel_events_oltner_2.1220.t:0 "Fim dos Rivais"
 travel_events_oltner_2.1230.a:0 "\"Foi [Select_CString( corpse_finder.IsFemale, 'a', 'o' )] [corpse_finder.GetFirstNameNoTooltip]. [entourage_member_1.GetFirstNameNoTooltip], #EMP mate [corpse_finder.GetSheHe].#!\""
 travel_events_oltner_2.1230.b:0 "\"Eu vi [Select_CString( corpse_finder.IsFemale, 'a', 'o' )] [corpse_finder.GetFirstNameNoTooltip] se esgueirar na noite, pegue [corpse_finder.GetSheHe]!\""
 travel_events_oltner_2.1230.c:0 "\"Este é o trabalho característico de um [ROOT.Char.Custom('RegionalFerociousAnimal')], sem dúvida.\""
 travel_events_oltner_2.1230.d:0 "\"Nós... nós deveríamos seguir em frente...\""
 travel_events_oltner_2.1230.desc:0 "\"Por [ROOT.Char.GetFaith.HighGodName], houve um #EMP assassinato!#!\"\n\n\"Quem desejaria a morte [Select_CString( entourage_member_2.IsFemale, 'da nossa', 'do nosso' )] [entourage_member_2.Custom('ComplimentAdjective')] [entourage_member_2.GetFirstName]? E por que foi tão #EMP brutal?!#!\" M[Select_CString( corpse_finder.IsFemale, 'inha', 'eu' )] [player_scope.Custom2('RelationToMeShort', corpse_finder )] [corpse_finder.GetFirstName] continua.\n\n\"Sim, de fato... quem #EMP poderia sonhar#! em fazer algo assim com [Select_CString( entourage_member_2.IsFemale, 'a', 'o' )] pobre e inocente [entourage_member_2.GetFirstNameNoTooltip].\" [entourage_member_1.GetFirstName] diz. No canto do meu olho, posso ver [entourage_member_1.GetSheHe] segurando um riso."
 travel_events_oltner_2.1230.t:0 "Uma Manhã Macabra"
 travel_events_oltner_2.1240.a:0 "Talvez eu devesse passar um tempo de qualidade com [Select_CString( entourage_member_1.IsFemale, 'a', 'o' )] [entourage_member_1.GetFirstNameNoTooltip]."
 travel_events_oltner_2.1240.b:0 "Eu poderia usar um bobo da corte, e m[Select_CString( entourage_member_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entourage_member_1'))] adoraria [local_character.GetSheHe]!"
 travel_events_oltner_2.1240.c:0 "Uma pausa merecida para todos nós."
 travel_events_oltner_2.1240.desc:0 "Ao entrar no [location.GetTitle.GetName], somos recebidos por uma trupe de artistas. Há apresentações de fantoches, danças e músicas!\n\nM[Select_CString( entourage_member_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entourage_member_1'))] [entourage_member_1.GetFirstName] parece gostar da música, e está encantado com um bobo da corte em particular! [Select_CString( local_character.IsFemale, 'A', 'O' )] [local_character.GetWomanMan] é um performer extraordinário – equilibrando vários instrumentos enquanto os toca!"
 travel_events_oltner_2.1240.t:0 "A Troupe Viajante"
 travel_hardy_camels_modifier:0 "Camelos Resilientes"
 travel_hardy_camels_modifier_desc:0 "Essa viagem é facilitada por um grupo de camelos particularmente resistentes e confiáveis."
 travel_hastened:0 "Jornada Acelerada"
 traveling_with_camel_merchants_modifier:0 "Viajando com Mercadores de Camelos"
 traveling_with_camel_merchants_modifier_desc:0 "Esta comitiva se juntou a um grupo de mercadores do deserto, tornando a jornada mais segura."
 war_camel_modifier:0 "Camelo de Guerra Poderoso"
 war_camel_modifier_desc:0 "Este personagem possui um camelo de guerra particularmente impressionante."
 watchman_guidance_modifier:0 "Vigia do Deserto"
 watchman_guidance_modifier_desc:0 "Esta comitiva está acompanhada por um vigia experiente, muito familiarizado com o terreno local."
 watchtower_guidance_modifier:0 "Orientação da Torre de Vigilância"
 watchtower_guidance_modifier_desc:0 "Esta comitiva recebeu orientação de um vigia perspicaz."
 well_funded_hospices_modifier:0 "Hospícios Bem-Financiados"
 well_funded_hospices_modifier_desc:0 "Hospícios nessas terras estão prosperando com generosas doações de viajantes."
