 assassination_scenario_wetlands:0 "m[Select_CString( entourage_member_1.IsFemale, 'inha', 'eu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] se move silenciosamente em direção [Select_CString( entourage_member_2.IsFemale, 'a minha', 'ao meu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], que está dormindo no terreno pantanoso. [entourage_member_1.GetFirstNameNoTooltip] sufoca [entourage_member_2.GetFirstNameNoTooltip] com lama, deixando [entourage_member_2.GetSheHe] imóvel na área pantanosa."
