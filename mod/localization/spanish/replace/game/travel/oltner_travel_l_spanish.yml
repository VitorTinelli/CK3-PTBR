 assassination_scenario_desert:0 "m[Select_CString( entourage_member_1.IsFemale, 'inha', 'eu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] se aproxima silenciosamente de m[Select_CString( entourage_member_2.IsFemale, 'inha', 'eu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], dormindo sob uma palma. De repente, [entourage_member_1.GetFirstNameNoTooltip] enterra as mãos na areia ao redor do pescoço de [entourage_member_2.GetFirstNamePossessiveNoTooltip], sufocando [entourage_member_2.GetSheHe] em silêncio."
 assassination_scenario_desert_mountains:0 "m[Select_CString( entourage_member_1.IsFemale, 'inha', 'eu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] se move furtivamente em direção [Select_CString( entourage_member_2.IsFemale, 'a minha', 'ao meu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], que está dormindo perto da borda de um penhasco. Com um empurrão rápido, [entourage_member_1.GetFirstName] faz [entourage_member_2.GetFirstNameNoTooltip] cair montanha abaixo."
 assassination_scenario_drylands:0 "m[Select_CString( entourage_member_1.IsFemale, 'inha', 'eu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] se aproxima sorrateiramente de m[Select_CString( entourage_member_2.IsFemale, 'inha', 'eu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], que está descansando perto de um arbusto seco. Pegando uma pedra, [entourage_member_1.GetFirstNameNoTooltip] atinge a cabeça de [entourage_member_2.GetFirstNamePossessiveNoTooltip] com força fatal, deixando apenas uma mancha escura na terra."
 assassination_scenario_farmlands:0 "m[Select_CString( entourage_member_1.IsFemale, 'inha', 'eu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] se aproxima de m[Select_CString( entourage_member_2.IsFemale, 'inha', 'eu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], dormindo perto de um arado. Em um ato repentino e violento, [entourage_member_1.GetFirstNameNoTooltip] perfura [entourage_member_2.GetFirstNameNoTooltip] com as lâminas afiadas do arado, garantindo um fim rápido."
 assassination_scenario_floodplains:0 "m[Select_CString( entourage_member_1.IsFemale, 'inha', 'eu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] se aproxima sorrateiramente de m[Select_CString( entourage_member_2.IsFemale, 'inha', 'eu' )]eu [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName] na margem do rio. Com um empurrão repentino, [entourage_member_1.GetFirstNameNoTooltip] afoga [entourage_member_2.GetFirstNameNoTooltip] nas águas turvas e agitadas."
 assassination_scenario_forest:0 "m[Select_CString( entourage_member_1.IsFemale, 'inha', 'eu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] se aproxima silenciosamente de m[Select_CString( entourage_member_2.IsFemale, 'inha', 'eu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], que está dormindo sob uma árvore. Usando uma corda, [entourage_member_1.GetFirstNameNoTooltip] rapidamente estrangula [entourage_member_2.GetFirstNameNoTooltip], deixando [entourage_member_2.GetSheHe] pendurado em um galho de árvore."
 assassination_scenario_hills:0 "m[Select_CString( entourage_member_1.IsFemale, 'inha', 'eu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] caminha nas pontas dos pés até m[Select_CString( entourage_member_2.IsFemale, 'inha', 'eu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], que está cochilando em uma encosta. [entourage_member_1.GetFirstNameNoTooltip] rola [entourage_member_2.GetFirstNameNoTooltip] morro abaixo, onde rochas afiadas garantem uma morte rápida e dolorosa."
 assassination_scenario_jungle:0 "m[Select_CString( entourage_member_1.IsFemale, 'inha', 'eu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] avança silenciosamente em direção [Select_CString( entourage_member_2.IsFemale, 'a minha', 'ao meu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], que está dormindo sob folhagens espessas. [entourage_member_1.GetFirstNameNoTooltip] usa uma videira para estrangular [entourage_member_2.GetFirstNameNoTooltip], deixando [entourage_member_2.GetSheHe] enredado e sem vida."
 assassination_scenario_mountains:0 "m[Select_CString( entourage_member_1.IsFemale, 'inha', 'eu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] se aproxima sorrateiramente de m[Select_CString( entourage_member_2.IsFemale, 'inha', 'eu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], que está descansando perto de uma queda íngreme. Um empurrão repentino e forçado faz [entourage_member_2.GetFirstNameNoTooltip] cair no abismo."
 assassination_scenario_oasis:0 "m[Select_CString( entourage_member_1.IsFemale, 'inha', 'eu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] se move silenciosamente em direção [Select_CString( entourage_member_2.IsFemale, 'a minha', 'ao meu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], que está dormindo à beira d'água. [entourage_member_1.GetFirstNameNoTooltip] rapidamente submerge a cabeça de [entourage_member_2.GetFirstNamePossessiveNoTooltip] na água, afogando [entourage_member_2.GetSheHe] silenciosamente."
 assassination_scenario_plains:0 "m[Select_CString( entourage_member_1.IsFemale, 'inha', 'eu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] se aproxima silenciosamente de m[Select_CString( entourage_member_2.IsFemale, 'inha', 'eu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], que está dormindo nos campos abertos. Com uma pedra pesada, [entourage_member_1.GetFirstNameNoTooltip] esmaga o crânio de [entourage_member_2.GetFirstNamePossessiveNoTooltip], deixando a grama manchada de sangue."
 assassination_scenario_steppe:0 "m[Select_CString( entourage_member_1.IsFemale, 'inha', 'eu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] persegue m[Select_CString( entourage_member_2.IsFemale, 'inha', 'eu' )] [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], dormindo sob o vasto céu. [entourage_member_1.GetFirstNameNoTooltip] rapidamente quebra o pescoço de [entourage_member_2.GetFirstNamePossessiveNoTooltip], deixando [entourage_member_2.GetSheHe] imóvel na vasta estepe."
