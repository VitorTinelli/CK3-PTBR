l_spanish:
 building_al_azhar_university_destination_desc:0 "A [GetBuilding('al_azhar_university').GetName] no Cairo é um farol de aprendizado e erudição no mundo [GetReligionByKey('islam_religion').GetName]ico. As sagradas dependências desta instituição nutriram gerações de estudiosos, contribuindo grandemente para a riqueza intelectual e cultural da região."
 building_al_qarawiyyin_university_01_destination_desc:0 "Fundada por comerciantes e migrantes da cidade africana de Kairouan, a [GetBuilding('al_qarawiyyin_university_01').GetName] é um dos centros de aprendizado superior mais prestigiosos de todo o mundo islâmico ocidental, atraindo estudiosos de regiões distantes."
 building_alamut_castle_destination_desc:0 "O [GetBuilding('alamut_castle_01').GetName], situado no topo de uma montanha no Vale de Alamut, evoca um senso de mistério e intriga. Antiga fortaleza dos Assassinos, sua localização estratégica e o passado cheio de histórias continuam a fascinar a mim e aos visitantes locais."
 building_alcazar_of_segovia_destination_desc:0 "O [GetBuilding('alcazar_of_segovia_01').GetName], empoleirado em uma rocha acima da cidade, é um castelo de contos de fadas tornado realidade. Esta fortaleza, com sua forma distintiva e história fascinante, captura a imaginação dos habitantes locais e visitantes."
 building_alhambra_destination_desc:0 "A [GetBuilding('alhambra_01').GetName], com sua intrincada arquitetura mourisca e jardins luxuriantes, é uma joia de Granada. O complexo palaciano, uma fusão de forma e função, reflete o gosto sofisticado e o poder de seus governantes."
 building_aljaferia_palace_destination_desc:0 "O [GetBuilding('aljaferia_palace_01').GetName] em Zaragoza é uma joia da arquitetura [GetReligionByKey('islam_religion').GetName]ica no coração da Aragão. Os arcos ornamentados e os pátios tranquilos refletem a rica fusão cultural dos mouros e cristãos, um legado estimado pela população local."
 building_allaq_mines_destination_desc:0 "As [GetBuilding('allaq_mines_01').GetName], aninhadas nas montanhas de Allaq, são uma fonte crucial de cobre. O som dos picaretas contra as rochas ressoa pelo ar, enquanto os mineiros trabalham incansavelmente para fornecer esse metal essencial."
 building_ananda_temple_destination_desc:0 "O [GetBuilding('ananda_temple_01').GetName], com seu sikhara brilhante e magníficas terraços, é um testemunho da habilidade arquitetônica da Dinastia [pagan_dynasty.GetName]. Este templo requintado, adornado com intrincadas esculturas e murais, é um farol do budismo Theravada."
 building_angkor_wat_01_destination_desc:0 "Atravesso a passagem de arenito até [GetBuilding('angkor_wat_01').GetName], cujas torres lembram botões de lótus acima de fossos espelhados. Pilares esculpidos e galerias se organizam em perfeita simetria, cada pedra trazendo figuras de divindades, dançarinas e o ritmo intemporal."
 building_apollinare_nuovo_destination_desc:0 "Na histórica cidade de Ravena, a [GetBuilding('apollinare_nuovo').GetName] se ergue como um testemunho da arte e arquitetura cristã primitiva. Os magníficos mosaicos da igreja, que retratam cenas bíblicas, são uma fonte de assombro e inspiração tanto para os fiéis locais quanto para admiradores da história."
 building_argentiera_mines_destination_desc:0 "As [GetBuilding('argentiera_mines_01').GetName] são famosas por suas ricas veios de chumbo e prata. As condições severas enfrentadas pelos mineiros aqui ressaltam a busca implacável por esses valiosos recursos."
 building_ark_of_bukhara_destination_desc:0 "Ao passar pelas imponentes portas do [GetBuilding('ark_of_bukhara_01').GetName], não posso deixar de sentir o peso dos séculos. Esta antiga fortaleza tem sido a sede de poder dos emirados locais desde sua fundação há séculos, e suas espessas muralhas acolheram incontáveis caravanas ao longo da Rota da Seda."
 building_aurelian_walls_destination_desc:0 "Cercando a cidade eterna, as [GetBuilding('aurelian_walls_01').GetName] permanecem firmes contra o tempo e as turbulências. Essas antigas defesas, expandidas e fortificadas ao longo dos anos, cercam uma história rica e complexa, um bastião do legado duradouro de Roma."
 building_baofeng_mines_destination_desc:0 "A mineração é a principal fonte de emprego nesta área e a maioria das construções residenciais se concentra perto das [GetBuilding('baofeng_mines_01').GetName]. À beira do rio, oficinas de moagem de prata movidas a água alinham as ruas."
 building_besakih_temple_01_destination_desc:0 "Ao contrário do nome humilde do [GetBuilding('besakih_temple_01').GetName], não encontro apenas um templo, mas todo um vasto complexo de santuários públicos e privados usados para orações e cerimônias — motivo pelo qual ganhou o apelido de \"O Templo-Mãe\"."
 building_beta_giyorgis_01_destination_desc:0 "A [GetBuilding('beta_giyorgis_01').GetName] foi esculpida inteiramente em uma rocha vulcânica vermelha e quente. Escavado profundamente na rocha, o salão principal da igreja é ricamente pintado com belos afrescos, enquanto ícones sagrados adornam as paredes."
 building_borobudur_01_destination_desc:0 "Ao amanhecer, fico diante do [GetBuilding('borobudur_01').GetName], cujos terraços se elevam como um mandala de pedra emergindo da névoa. Budas esculpidos observam enquanto a luz toca as estupas, revelando um caminho da terra à iluminação, gravado em pedra vulcânica."
 building_boudhanath_destination_desc:0 "A enorme cúpula da Estupa de [GetBuilding('boudhanath_01').GetName] abriga restos mortais e relíquias relacionadas a muitos budas históricos, sendo também, de longe, o edifício mais alto de Catmandu. Elevando-se sobre o resto da cidade, é um claro indicativo da importância do Budismo para a história deste lugar. Ao me aproximar, vejo-me cercado por viajantes, peregrinos e mercadores, todos parando para descansar e rezar."
 building_brihadeeswarar_temple_destination_desc:0 "O [GetBuilding('brihadeeswarar_temple_01').GetName], uma monumental edificação de granito, se ergue majestoso sobre Thanjavur. Seu vimana imponente e os intrincados relevos falam da grandeza da Dinastia [chola_dynasty.GetName], uma época em que a arte e a devoção encontraram uma expressão sublime."
 building_buddha_kamakura_destination_desc:0 "Ao entrar no grande salão que abriga o [GetBuilding('buddha_kamakura_01').GetName], fico imediatamente impressionado com sua dimensão colossal. Mesmo sentado na posição de lótus, o Buda ainda é mais alto do que muitos homens juntos. A enorme estátua de bronze inspira reverência espiritual, além de admiração pela grande habilidade artesanal necessária para criar tal titã de bronze."
 building_buddhas_of_bamian_destination_desc:0 "Os colossais [GetBuilding('buddhas_of_bamian_01').GetName], esculpidos na face da falésia, permanecem como um silencioso testemunho da história religiosa e cultural desta terra. Apesar do desgaste do tempo, a arte e a devoção dos antigos artesãos ainda são evidentes nessas magníficas esculturas."
 building_burkhan_khaldun_01_destination_desc:0 "Velado em névoa e reverência, o [GetBuilding('burkhan_khaldun_01').GetName] ergue-se sagrado entre os picos de Khentii. Um lugar de oração e peregrinação, suas encostas silenciosas são acreditadas para proteger a alma da terra e de seu povo."
 building_byeokran_port_01_destination_desc:0 "Dos penhascos acima, o [GetBuilding('byeokran_port_01').GetName] se estende ao longo da baía cintilante. Armazéns margeiam a costa ao lado de mastros de madeira, enquanto os gritos das gaivotas se misturam ao clangor das âncoras."
 building_castle_arrival_01_desc:0 "Minha empolgação cresce à medida que me aproximo do [location.GetTitle.GetName]. A perspectiva de testemunhar sua grandiosidade me enche de antecipação."
 building_castle_arrival_02_desc:0 "Ao me aproximar do [location.GetTitle.GetName], meu coração acelera com a emoção de explorar as lendas consagradas dentro de suas paredes."
 building_castle_arrival_03_desc:0 "Quando o [location.GetTitle.GetName] aparece à vista, um sentimento de aventura desperta dentro de mim."
 building_castle_arrival_04_desc:0 "A visão do [location.GetTitle.GetName] me enche de reverência e uma curiosidade aguçada sobre as histórias que ele guarda."
 building_castle_arrival_05_desc:0 "Aproximando-me do [location.GetTitle.GetName], estou ansioso para descobrir as histórias que ele testemunhou ao longo dos tempos."
 building_cattolica_stilo_destination_desc:0 "A [GetBuilding('cattolica_stilo').GetName] é um notável exemplo de arquitetura bizantina na Itália. Esta pequena, mas fascinante igreja, com seu plano característico em forma de cruz, ocupa um lugar especial no coração da comunidade local."
 building_cevennes_mines_destination_desc:0 "As minas locais em [GetBuilding('cevennes_mines_01').GetName] são uma fonte essencial de prata. O trabalho incansável dos mineiros e a recompensa resultante desempenham um papel crucial na sustentação da subsistência da região."
 building_changan_market_01_destination_desc:0 "O [GetBuilding('changan_market_01').GetName] está repleto de mercadores de todas as partes do mundo sob bandeiras vibrantes. Produtos estrangeiros trazem cor ao cenário, e artistas de rua e estudiosos se misturam em meio ao agitado centro de comércio."
 building_chihu_mines_destination_desc:0 "Os [GetBuilding('chihu_mines_01').GetName] dizem estar ativas desde o período dos Três Reinos e, por mais de um milênio, têm fornecido ferro e armas para as dinastias da China. Na própria cidade isso é evidente por toda parte: casas da moeda e forjas alinham-se pelas ruas, e encontrei carroças carregadas de minério de ferro muito antes de avistar o assentamento em si."
 building_chinjufu_01_destination_desc:0 "O [GetBuilding('chinjufu_01').GetName] pulsa com disciplina organizada — quartéis e estaleiros ecoam com o clangor das armaduras e os chamados dos marinheiros. Torres de vigia alinham a baía, guardando os mares do norte do reino, onde cada batimento é guiado pelo dever e pela defesa."
 building_chocolate_hills_destination_desc:0 "As [GetBuilding('chocolate_hills_01').GetName] são uma visão incomum. Durante a maior parte do ano são exuberantemente verdes, apenas para se transformarem em um marrom vívido, quase alaranjado, durante a estação seca. Nunca vi nada parecido e fico cativado por essa paisagem maravilhosa."
 building_church_of_the_theotokos_destination_desc:0 "À sombra das muralhas de Constantinopla, a [GetBuilding('church_of_the_theotokos').GetName] é um farol de fé. Esta antiga igreja, com sua atmosfera serena e ícones sagrados, é uma pedra angular da vida religiosa e cultural da comunidade local."
 building_cilician_gates_destination_desc:0 "Os [GetBuilding('cilician_gates').GetName] têm sido um ponto estratégico de cruzamento por séculos. Este corredor natural, utilizado por comerciantes e exércitos, possui grande significado para as comunidades locais que há muito percorrem esses caminhos."
 building_citadel_linan_destination_desc:0 "Nas encostas da Colina Fênix, a [GetBuilding('citadel_linan_01').GetName] é o centro do poder administrativo não apenas desta cidade, mas também da região ao redor. Ao atravessar seus portões, sou cercado por dignitários e oficiais eruditos, todos desempenhando os papéis cerimoniais que seus cargos exigem."
 building_citadel_of_aleppo_destination_desc:0 "A imponente [GetBuilding('citadel_of_aleppo_01').GetName], uma fortaleza no topo de uma colina, domina a paisagem da cidade. Suas enormes muralhas e robustas estruturas, evoluindo ao longo dos tempos, testemunham incontáveis cercos e a resiliência desta cidade antiga."
 building_citadel_thang_long_01_destination_desc:0 "Caminho ao longo das muralhas do [GetBuilding('citadel_thang_long_01').GetName], cujas paredes de terra alcançam o rio. Torres de vigia observam lagoas de lótus e telhados de azulejos, enquanto soldados e cortesãos se movem pela névoa de incenso e pela bruma matinal, guardando a crescente capital."
 building_citadel_thang_long_02_destination_desc:0 "Passo pelos portões do [GetBuilding('citadel_thang_long_02').GetName], onde desenhos de dragões se enrolam pelas antigas paredes de pedra. Os pátios ecoam os passos dos guardas, enquanto o cheiro de chuva nos tijolos se mistura ao peso de uma autoridade ancestral."
 building_city_arrival_01_desc:0 "Chegando ao [location.GetTitle.GetName], fico animado com a ideia de descobrir suas joias escondidas e sua cultura vibrante."
 building_city_arrival_02_desc:0 "O movimento e a agitação do [location.GetTitle.GetName] me revigoram, enquanto me preparo para me imergir em suas ruas animadas."
 building_city_arrival_03_desc:0 "Ao entrar no [location.GetTitle.GetName], um sentimento de maravilha me envolve, ansioso para explorar seus tesouros culturais e vielas históricas."
 building_city_arrival_04_desc:0 "Ao pisar no [location.GetTitle.GetName], estou ansioso para vivenciar seus mercados agitados e marcos históricos."
 building_city_arrival_05_desc:0 "A energia do [location.GetTitle.GetName] me envolve, despertando minha curiosidade para me aprofundar em sua vida vibrante e seu passado histórico."
 building_city_wall_of_toledo_destination_desc:0 "Cercando a cidade histórica, as imponentes [GetBuilding('city_wall_of_toledo_01').GetName] são um testemunho de seu passado repleto de histórias. Essas muralhas, uma mistura de design [roman_culture.GetName], [visigothic_culture.GetName] e mourisco, são uma fonte de orgulho e segurança para os residentes dentro."
 building_cluny_abbey_01_destination_desc:0 "Um presente de terras e direitos, em troca da salvação eterna. Esse é o pacto formado entre a comunidade monástica de [GetBuilding('cluny_abbey_01').GetName] e o senhor local."
 building_cluny_abbey_02_destination_desc:0 "A [GetBuilding('cluny_abbey_02').GetName], a maior igreja jamais imaginada. Suas cinco naves, mais longas do que as do Vaticano, e os imensos arcos de pedra, uma conquista arquitetônica repleta de torres e telhados. Esta é verdadeiramente uma nova Roma."
 building_confucius_temple_destination_desc:0 "É difícil não sentir grande reverência no [GetBuilding('confucius_temple_01').GetName]. Este é o mais antigo santuário do grande mestre e modelo que tanto moldou o mundo. Logo me vejo alinhando-me silenciosamente com os outros peregrinos para ver os túmulos dele e de seus discípulos."
 building_culai_academy_01_destination_desc:0 "Quando o [GetBuilding('culai_academy_01').GetName] surge à vista, fico cada vez mais cativado por sua beleza que purifica a alma. Névoas que descem dos picos do Monte Culai flutuam por seus pátios, onde buscadores do conhecimento perseguem suas ambições acadêmicas."
 building_damascus_mosque_01_destination_desc:0 "A [GetBuilding('damascus_mosque_01').GetName] é um dos locais mais sagrados do Islã, com uma história venerável para contar, colocando suas fundações sobre um antigo templo romano e uma basílica cristã primitiva, muitas séculos de espiritualidade e engenhosidade maravilhosas empilhadas uma sobre a outra."
 building_danevirke_destination_desc:0 "O [GetBuilding('danevirke_01').GetName], uma massiva fortificação de terra, se estende pela Península da Jutlândia. Esta antiga defesa, construída e expandida pelo povo local, simboliza sua determinação em proteger suas terras e manter sua autonomia."
 building_dau_temple_01_destination_desc:0 "O [GetBuilding('dau_temple_01').GetName] ergue-se onde as planícies do Rio Vermelho encontram o céu, com seus pátios vivos de incenso e oração. Antigos santuários brilham sob a luz do sol, marcando o berço do budismo na região e séculos de devoção espiritual duradoura."
 building_dazaifu_01_destination_desc:0 "O [GetBuilding('dazaifu_01').GetName] repousa entre colinas ondulantes e pomares de ameixeiras, movimentado por escribas, emissários e oficiais. É um centro onde diretivas administrativas são enviadas a províncias distantes, com decretos selados por tinta, incenso e autoridade sutil."
 building_dean_mines_destination_desc:0 "As [GetBuilding('dean_mines_01').GetName] são uma fonte significativa de ferro. O clangor dos martelos e o brilho das fornalhas são constantes aqui, enquanto os mineiros e ferreiros trabalham incansavelmente, forjando os materiais para empreendimentos militares e de construção."
 building_dengfeng_observatory_destination_desc:0 "Ao entrar na cidade, o grande [GetBuilding('dengfeng_observatory_01').GetName] é visível de longe. Acredita-se que este local seja o centro da terra, e astrônomos chineses observam os céus aqui há séculos. O edifício funciona como um gigantesco relógio de sol durante o dia e como um observatório para mapear as estrelas durante a noite."
 building_despot_palace_destination_desc:0 "O esplendor do [GetBuilding('despot_palace').GetName] é um espetáculo a ser visto. Seus grandiosos salões e pátios requintados estão vivos com a agitação dos cortesãos e as melodias dos trovadores. O palácio, um centro de atividade política e artística, se ergue como um símbolo orgulhoso de poder e sofisticação."
 building_dieng_plateau_01_destination_desc:0 "A quietude sobrenatural do [GetBuilding('dieng_plateau_01').GetName] impressiona o olhar humano. Vapor sobe de suas crateras esmeralda, e antigos santuários de pedra erguem-se na névoa. É um reino deslumbrante onde natureza e divindade parecem compartilhar o mesmo sopro."
 building_diplomatic_learning_outro_01_desc:0 "Esta experiência ampliou minha perspectiva sobre as complexidades e sutilezas das relações diplomáticas e da arte de governar."
 building_diplomatic_learning_outro_02_desc:0 "Parto com uma maior apreciação pela arte intrincada da diplomacia e pelas sutilezas das alianças políticas."
 building_diplomatic_learning_outro_03_desc:0 "Meu tempo aqui aprimorou meu entendimento sobre o delicado equilíbrio de poder e o papel crucial da diplomacia na formação da história."
 building_doges_palace_destination_desc:0 "A grandeza do [GetBuilding('doges_palace_01').GetName] me deixa sem palavras. Sua fachada ornamentada e aposentos luxuosos são um símbolo do poder e prosperidade de Veneza. As obras de arte intrincadas e a decoração luxuosa falam do poder e riqueza de seus governantes."
 building_dome_of_the_rock_destination_desc:0 "O [GetBuilding('dome_of_the_rock_01').GetName], com sua cúpula dourada brilhando ao sol, é um marco reverenciado em Jerusalém. Este santuário, que abriga a rocha sagrada, é um local de profunda importância espiritual, reverenciado tanto por muçulmanos quanto por judeus."
 building_drassanes_01_destination_desc:0 "O grande arsenal de [GetBuilding('drassanes_01').GetName] prepara uma frota de galeras de guerra, concedendo ao seu proprietário a capacidade de projetar sua vontade no Mediterrâneo. Sob abóbadas de pedra pontiagudas, os trabalhadores laboram incansavelmente."
 building_dunhuang_market_01_destination_desc:0 "O [GetBuilding('dunhuang_market_01').GetName] vibra sob o sol do deserto, com mercadores de todas as regiões trocando bens exóticos e essenciais. Camelos descansam junto aos portões enquanto peregrinos e moradores trocam pergaminhos e histórias destinados aos oásis distantes."
 building_duomo_florence_01_destination_desc:0 "Seguindo as antigas muralhas romanas perto de seu portão norte, a [GetBuilding('duomo_florence_01').GetName] tem sido o lar dos cristãos desde antes da época de Constantino. Ao longo do tempo, sofreu incêndios e saques, reconstrução e bênçãos."
 building_duomo_florence_02_destination_desc:0 "A [GetBuilding('duomo_florence_02').GetName] é um colossal batistério octagonal no centro da cidade, dedicado ao seu patrono São João.\nÉ revestido de mármores caros e decorado com esculturas primorosas e mosaicos dourados, um verdadeiro testemunho da riqueza da cidade."
 building_duomo_florence_03_destination_desc:0 "A [GetBuilding('duomo_florence_03').GetName] é uma catedral digna da rica Florença. A fachada é preenchida com estátuas humanas de profetas, deuses e patronos, e uma longa sombra é projetada por sua alta torre sineira, marcando as horas de trabalho e oração para os cidadãos e visitantes."
 building_duomo_florence_04_destination_desc:0 "[GetBuilding('duomo_florence_04').GetName] é a maior conquista dos construtores florentinos, erguendo-se esbelta e aérea contra o céu azul. É mais alta e mais larga do que jamais se concebeu, sem sistemas de apoio para impedir seu colapso, mas com o uso engenhoso de uma casca dupla de tijolos e alvenaria."
 building_dushan_mines_destination_desc:0 "[GetBuilding('dushan_mines_01').GetName] domina a economia local aqui. O jade local é um dos mais preciosos e diz-se que possui uma cor mais rica do que qualquer outro."
 building_dvin_shuka_01_destination_desc:0 "Ao caminhar pelo [GetBuilding('dvin_shuka_01').GetName], o ar ressoa com vozes de terras distantes. Bronze brilha sob coberturas tramadas enquanto comerciantes me convidam a provar seus doces e admirar suas sedas vibrantes. Cada troca revela um fragmento da energia vibrante da cidade."
 building_economic_learning_outro_01_desc:0 "Minha visita aprimorou minha compreensão dos princípios econômicos e do papel fundamental do comércio na prosperidade das nações."
 building_economic_learning_outro_02_desc:0 "Explorar este local aprofundou meu entendimento sobre as complexidades do desenvolvimento econômico."
 building_economic_learning_outro_03_desc:0 "Parto com uma perspectiva mais rica sobre a importância vital da sagacidade econômica para sustentar reinos poderosos."
 building_enryaku_ji_01_destination_desc:0 "O [GetBuilding('enryaku_ji_01').GetName] coroa o Monte Hiei, seus salões velados por névoa. Peregrinos sobem os caminhos sinuosos passando por monges em cânticos e sinos que ressoam, onde os ensinamentos de $SaichO_$ ainda moldam a fé e a disciplina de uma nação."
 building_etchmiadzin_cathedral_destination_desc:0 "A [GetBuilding('etchmiadzin_cathedral').GetName], um santuário em Vagharshapat, considerada o centro espiritual dos armênios em todo o mundo. Esta antiga catedral, com sua rica história e significado religioso, é uma fonte de orgulho e consolo espiritual para a comunidade armênia local."
 building_exploration_01_desc:0 "Com grande antecipação, começo minha exploração!"
 building_exploration_02_desc:0 "Olhos arregalados de curiosidade, me aventurei com entusiasmo!"
 building_exploration_03_desc:0 "Cheio de empolgação, parto para explorar as maravilhas deste local!"
 building_exploration_04_desc:0 "Com um senso de admiração, vou explorar cada canto e recanto!"
 building_exploration_05_desc:0 "Caminho com o entusiasmo da descoberta, ansioso para absorver o conhecimento que este lugar promete!"
 building_exploration_06_desc:0 "Com entusiasmo, inicio minha exploração!"
 building_exploration_07_desc:0 "Com o coração alegre, começo minha jornada por este local!"
 building_exploration_08_desc:0 "Cheio de espírito aventureiro, me lanço a atravessar este lugar!"
 building_exploration_09_desc:0 "Começo minha exploração com ânimo, cada passo cheio de antecipação!"
 building_exploration_10_desc:0 "Com um espírito de entusiasmo, percorro este local!"
 building_exploration_11_desc:0 "Avanço com espírito aventureiro, ansioso para explorar a rica história deste local!"
 building_exploration_12_desc:0 "Com um passo alegre, começo a explorar!"
 building_exploration_13_desc:0 "Com grande entusiasmo, parto em minha jornada por este local, antecipando as descobertas que estão por vir!"
 building_exploration_14_desc:0 "Cheio de empolgação, me aventuro por este local, ansioso pelas vistas que ele promete!"
 building_exploration_15_desc:0 "Começo minha exploração com um senso de admiração, ansioso para aprender com o patrimônio deste lugar!"
 building_exploration_16_desc:0 "Com grande antecipação, percorro este local, pronto para ser cativado pela beleza deste lugar!"
 building_exploration_17_desc:0 "Começo minha exploração com um sentimento de entusiasmo!"
 building_exploration_18_desc:0 "Embarco em minha jornada por este local com uma grande curiosidade!"
 building_exploration_19_desc:0 "Com um coração entusiástico, parto para explorar!"
 building_exploration_20_desc:0 "Começo minha exploração ansioso para vivenciar a magnificência que este local representa!"
 building_fairy_chimneys_destination_desc:0 "As [GetBuilding('fairy_chimneys').GetName] em Capadócia são esculpidas pelo vento e pela água. Essas impressionantes formações rochosas, com suas formas únicas, não apenas atraem viajantes curiosos, mas também servem como moradias e locais de culto para o povo local."
 building_falak_ol_aflak_citadel_destination_desc:0 "Com vista para a cidade de Khorramabad, a [GetBuilding('falak_ol_aflak_citadel_01').GetName] é uma fortaleza de notável força e beleza. Esta cidadela histórica, com suas imponentes muralhas e posição estratégica, é um símbolo do rico patrimônio e do espírito duradouro da região."
 building_falun_mines_destination_desc:0 "As [GetBuilding('falun_mines_01').GetName] são um labirinto de túneis em busca de cobre. O vibrante pigmento vermelho, Falu red, derivado das minas, adorna muitos edifícios aqui, um vívido lembrete da importância da mina para a comunidade local."
 building_fanfang_guangzhou_destination_desc:0 "Minaretes não são uma visão cotidiana nesta parte do mundo, mas no [GetBuilding('fanfang_guangzhou_01').GetName] o minarete de uma mesquita local é imediatamente visível da rua. Ao caminhar pelo distrito, ouço idiomas de toda a Ásia e do mundo islâmico; aqui, estrangeiros de todos os tipos vivem e trabalham dentro do império."
 building_fengtian_mines_destination_desc:0 "Desde os tempos antigos, os mineiros de [GetBuilding('fengtian_mines_01').GetName] balançam picaretas para expandir os poços e recolher jade para inspeção. Enquanto isso, os comerciantes da ilha enchiam seus cofres."
 building_forbidden_city_01_destination_desc:0 "Entro no [GetBuilding('forbidden_city_01').GetName] através de portões vermilion imponentes, onde telhados esmaltados cintilam como luz do sol na água. Pátios bordados por dragões esculpidos se alinham em simetria, conectando salões orientados ao trono do imperador."
 building_generic_destination_desc:0 "Ao chegar ao local, seu caráter único e o senso de história que exala são imediatamente evidentes. Ele se ergue como um testemunho do legado duradouro desta terra, e cada aspecto deste lugar conta uma história esperando para ser descoberta."
 building_ghana_palace_01_destination_desc:0 "Cercido por um bosque sagrado está o [GetBuilding('ghana_palace_01').GetName] - morada dos chefes reais da cidade.\nO complexo é composto por edifícios de arenito e tijolos de barro, protegido por uma cerca com portões. Uma estrutura imensa, este palácio domina a cidade ao redor."
 building_giant_wild_goose_pagoda_01_destination_desc:0 "Estou diante do [GetBuilding('giant_wild_goose_pagoda_01').GetName], um centro de conhecimento de sete andares construído em tijolos ocres com um pináculo de bronze que protegeu sutras budistas — símbolo de devoção, erudição e intercâmbio cultural."
 building_goguryeo_tomb_destination_desc:0 "Uma enorme pirâmide domina a paisagem à distância e, embora seja chamada de [GetBuilding('goguryeo_tomb_01').GetName], ninguém parece saber ao certo qual rei está sepultado aqui. Ainda assim, o tamanho impressionante e a arquitetura única do túmulo, juntamente com os murais internos de impressionantes cavaleiros, contam a história de um passado glorioso nesta região."
 building_golden_gate_of_kiev_destination_desc:0 "Ao me aproximar do [GetBuilding('golden_gate_of_kiev_01').GetName], sou arrebatado por sua grandiosidade vibrante. O portão, que serve de entrada para a cidade, ressoa com os sons do comércio. Sua robusta arquitetura, símbolo do poder da cidade, continua a inspirar reverência e um senso de conexão com o glorioso passado de Kiev."
 building_gongsanseong_fortress_01_destination_desc:0 "Quando o [GetBuilding('gongsanseong_fortress_01').GetName] aparece diante de mim, sou impressionado por sua postura imponente sobre o vale do rio. Suas muralhas antigas ecoam histórias de batalhas esquecidas, reis leais e o espírito resiliente de um reino orgulhoso."
 building_great_wall_of_gorgan_destination_desc:0 "Ao percorrer a paisagem, me sinto humilde diante da magnitude do [GetBuilding('great_wall_of_gorgan_01').GetName]. Esta colossal fortificação, que se estende mais do que os olhos podem ver, é um poderoso lembrete da necessidade do antigo reino de proteger suas fronteiras contra invasores."
 building_guiyang_mines_destination_desc:0 "[GetBuilding('guiyang_mines_01').GetName] deixou uma marca clara no assentamento ao longo dos séculos. As moedas cunhadas aqui circularam por toda a China desde os dias da Dinastia Han Ocidental."
 building_gunung_api_destination_desc:0 "O [GetBuilding('gunung_api_01').GetName] é dito ser uma montanha sagrada, e sua aparência certamente é diferente de qualquer outra que encontrei em minhas viagens. Rochas afiadas e estreitas erguem-se abruptamente aos céus, ofuscando as árvores ao redor."
 building_ha_long_bay_destination_desc:0 "A [GetBuilding('ha_long_bay_01').GetName] é melhor contemplada a partir do mar, e assim me encontro em um pequeno barco no Golfo de Tonquim. À medida que nos aproximamos da baía, toda conversa cessa; em completo silêncio navegamos pela paisagem cárstica. As grandes montanhas que nos cercam por todos os lados são talvez a coisa mais bela que já vi."
 building_hadrians_wall_destination_desc:0 "Enquanto caminho pelos remanescentes da [GetBuilding('hadrians_wall_01').GetName], pondero sobre o poder dos antepassados [roman_culture.GetName]. Esta barreira antes formidável, agora uma série de ruínas, serviu como uma fronteira norte, um testemunho da extensão e dos limites de um império."
 building_hagia_sophia_christian_destination_desc:0 "Enquanto caminho pela magnífica [GetBuilding('hagia_sophia_01').GetName], sua grandeza me deixa em admiração. A vasta cúpula parece tocar os céus, e os intrincados mosaicos brilham à luz. Posso sentir a profundidade espiritual deste lugar, ressoando com séculos de adoração cristã e majestade bizantina."
 building_hagia_sophia_islamic_destination_desc:0 "Ao entrar na [GetBuilding('hagia_sophia_02').GetName], agora uma grande mesquita, sou cativado pela sua transformação. Os imponentes minaretes alcançam os céus, complementando a majestosa cúpula. Dentro, a caligrafia e ornamentação islâmicas se misturam harmoniosamente com a arquitetura bizantina, criando uma atmosfera de profunda reverência e fusão cultural."
 building_hagios_demetrios_destination_desc:0 "A Igreja de [GetBuilding('hagios_demetrios').GetName] em Tessalônica é um santuário espiritual, dedicado ao santo padroeiro da cidade. Os corredores sagrados, adornados com magníficos mosaicos, ressoam com as orações e cânticos da devota congregação local."
 building_hakata_port_01_destination_desc:0 "O [GetBuilding('hakata_port_01').GetName] fervilha com mercadores e marinheiros de regiões distantes, com docas repletas de seda, cerâmica e especiarias. O porto está cheio de navios de madeira rangentes, suas velas captando a brisa marítima, servindo como um vibrante centro de comércio, cultura e influência imperial."
 building_hamadan_bazaar_01_destination_desc:0 "O [GetBuilding('hamadan_bazaar_01').GetName] serpenteia por becos abobadados cheios dos aromas de açafrão e couro. Comerciantes chamam de barracas sombreadas, seus produtos prontos para novos donos enquanto viajantes e habitantes cruzam este histórico centro de comércio."
 building_hanging_temple_01_destination_desc:0 "O [GetBuilding('hanging_temple_01').GetName] paira na encosta do penhasco como uma visão fugaz entre a terra e o céu. Salões de madeira se projetam da face rochosa, com vigas que parecem desafiar a gravidade, onde monges oram entre o vento, o silêncio e a devoção inabalável."
 building_hanxing_mines_destination_desc:0 "As [GetBuilding('hanxing_mines_01').GetName] ."
 building_heddal_stave_church_destination_desc:0 "Na serena paisagem norueguesa, a [GetBuilding('heddal_stave_church_01').GetName] se ergue como um magnífico exemplo da habilidade medieval. Os intrincados entalhes em madeira e a estrutura imponente refletem a devoção e a habilidade dos artesãos locais."
 building_heian_palace_01_destination_desc:0 "O [GetBuilding('heian_palace_01').GetName] ergue-se ao longo da avenida, seus portões vermilion abrindo-se para vastos pátios de cascalho branco cuidadosamente alinhado. Cortesãos perfumados deslizam por salões laqueados, onde biombos dourados e cítaras distantes ecoam a elegância da vida imperial."
 building_herat_bazaar_01_destination_desc:0 "Vago pelos salões abobadados do [GetBuilding('herat_bazaar_01').GetName], onde azulejos reluzem acima de barracas sombreadas. A água corre por canais de pedra, e o aroma de tintura e poeira paira sob o murmúrio constante do comércio."
 building_hetian_mines_destination_desc:0 "As minas em [GetBuilding('hetian_mines_01').GetName] são a fonte do jade mais precioso que existe. A economia local depende em grande parte desse comércio, e mineiros e artesãos de jade podem ser vistos por toda a cidade."
 building_holy_site_basilica_santiago_destination_desc:0 "A [GetBuilding('holy_site_basilica_santiago_01').GetName] é um farol para os peregrinos de toda a Cristandade. Esta magnífica catedral, ponto final do Caminho de Santiago, é reverenciada por suas relíquias sagradas e deslumbrante arquitetura românica, profundamente venerada pelos fiéis."
 building_holy_site_canterbury_cathedral_destination_desc:0 "Caminhando pelos corredores consagrados da [GetBuilding('holy_site_canterbury_cathedral_01').GetName], sinto o peso da história ao meu redor. Este marco da fé cristã está imbuído com histórias de mártires e santos. As intricadas esculturas e a atmosfera solene ecoam as orações de incontáveis peregrinos."
 building_holy_site_cologne_cathedral_destination_desc:0 "Ao me aproximar da [GetBuilding('holy_site_cologne_cathedral_01').GetName], suas torres inacabadas e construção contínua são um testemunho da ambição de sua época. Entre os andaimes e pedras, vejo uma visão de grandeza tomando forma, um símbolo de fé que perdurará por séculos."
 building_holy_site_great_mosque_of_cordoba_destination_desc:0 "Ao caminhar pelos amplos corredores da [GetBuilding('holy_site_great_mosque_of_cordoba_01').GetName], a floresta de colunas e arcos vermelhos e brancos é uma maravilha da engenhosidade arquitetônica. A mistura de estilos [GetReligionByKey('islam_religion').GetName]icos e [visigothic_culture.GetName]os fala de uma terra rica em história e cultura."
 building_holy_site_great_mosque_of_djenne_destination_desc:0 "A visão da [GetBuilding('holy_site_great_mosque_of_djenne_01').GetName], erguendo-se majestosamente do coração da cidade, é de tirar o fôlego. Sua arquitetura única em adobe, que reflete a paisagem saheliana, é um símbolo orgulhoso da fé e habilidade de seus construtores."
 building_holy_site_great_mosque_of_mecca_destination_desc:0 "Ao contemplar a [GetBuilding('holy_site_great_mosque_of_mecca_01').GetName], meu coração se enche de admiração. A visão da Kaaba, um santuário sagrado desde tempos imemoriais, é um testemunho da resistência de [GetReligionByKey('islam_religion').GetName]. As multidões de peregrinos, cada um buscando proximidade com o divino, se movem como um só ser em sua devoção."
 building_holy_site_great_mosque_of_samarra_destination_desc:0 "Ao ficar diante da [GetBuilding('holy_site_great_mosque_of_samarra_01').GetName], seu minarete espiral único se eleva sobre a paisagem. Seu estilo arquitetônico distinto a torna uma joia do mundo [GetReligionByKey('islam_religion').GetName]ico."
 building_holy_site_imam_ali_mosque_destination_desc:0 "Ao entrar na cidade, a cúpula dourada da [GetBuilding('holy_site_imam_ali_mosque_01').GetName] brilha como um farol. Este local sagrado, onde [Select_CString( ali.IsFemale, 'a', 'o' )] Imam [ali.GetFirstName] está sepultad[Select_CString( ali.IsFemale, 'a', 'o' )], está cheio de peregrinos prestando suas homenagens. O ar está carregado de devoção, e a caligrafia intricada nas paredes fala de uma profunda reverência pelo divino."
 building_holy_site_mahabodhi_temple_destination_desc:0 "Vagando pelos terrenos sagrados do [GetBuilding('holy_site_mahabodhi_temple_01').GetName], sou tocado por sua serenidade. O local onde o Buda atingiu a iluminação sob a Árvore Bodhi é um lugar de profunda paz. As intricadas esculturas que retratam sua jornada em direção à iluminação me lembram do caminho espiritual que todos devemos seguir."
 building_holy_site_prophetic_mosque_destination_desc:0 "[GetBuilding('holy_site_prophetic_mosque_01').GetName], com seus pátios serenos e arcos elegantes, é um lugar de profunda significância espiritual. Aqui, onde o Profeta Muhammad caminhou e pregou, o ar parece preenchido com tranquilidade. Os fiéis se reúnem em reverência, suas orações murmuradas sob o vasto céu."
 building_holy_site_st_peters_basilica_destination_desc:0 "Erguendo-se sobre a Colina do Vaticano, no local do túmulo de São Pedro, a [GetBuilding('holy_site_st_peters_basilica_01').GetName] é um lembrete do poder da Igreja Ocidental e de seus papas. Padres e freiras podem ser vistos por toda esta parte da Cidade Eterna, junto de mendigos esperando por doações dos muitos peregrinos."
 building_holy_wisdom_01_destination_desc:0 "A magnífica [GetBuilding('holy_wisdom_01').GetName] foi modelada após a Hagia Sophia, para representar a mesma luz, riqueza e poder na terra gelada do norte. Sua aparência austera de calcário branco trai as cores esmagadoras dos afrescos no interior."
 building_hoshi_ryokan_01_destination_desc:0 "Chego ao [GetBuilding('hoshi_ryokan_01').GetName], cujas vigas de madeira foram polidas por séculos de hospitalidade silenciosa. Lanternas brilham ao longo de corredores de tatame, e o aroma de cedro e água da nascente flutua dos banhos, onde o próprio tempo parece correr mais suavemente."
 building_hosios_loukas_destination_desc:0 "O [GetBuilding('hosios_loukas').GetName], aninhado nas montanhas da Grécia Central, é uma joia da arte bizantina. A arquitetura impressionante do mosteiro e os belos afrescos são venerados pelos fiéis locais, servindo como um farol do cristianismo ortodoxo."
 building_hotin_fort_destination_desc:0 "O formidável [GetBuilding('hotin_fort_01').GetName] sobrevive observando o rio Dniéster. As espessas muralhas e a posição estratégica do forte atestam a determinação do povo local em proteger suas terras contra invasores."
 building_house_of_wisdom_destination_desc:0 "A [GetBuilding('house_of_wisdom_01').GetName] em Bagdá é um farol de conhecimento e aprendizado. Esta grandiosa biblioteca e centro de estudos, estabelecido pelos califas abássidas, atrai estudiosos de todas as terras, ansiosos para explorar sua vasta coleção de textos e discursos."
 building_hpakant_mines_destination_desc:0 "Escondido entre florestas e largos rios, [GetBuilding('hpakant_mines_01').GetName] é uma fonte próspera de jade entre os artesãos locais. Sua extração permite que eles expressem melhor suas culturas."
 building_hwangnyongsa_01_destination_desc:0 "Estou diante do [GetBuilding('hwangnyongsa_01').GetName], onde sua pagoda de nove andares reluz sob o sol. Monges entoam cânticos nos vastos pátios, e percebo fé e resiliência refletidas em cada pedra e viga dourada."
 building_ijil_mines_destination_desc:0 "As vastas [GetBuilding('ijil_mines_01').GetName] abrigam ricos depósitos de sal. Os habilidosos mineiros tornaram esta área uma contribuição crucial para o comércio e o desenvolvimento da região."
 building_imam_reza_shrine_destination_desc:0 "O [GetBuilding('imam_reza_shrine_01').GetName] é um local de imenso significado espiritual. O magnífico complexo, com sua cúpula dourada e minaretes, atrai incontáveis peregrinos que buscam consolo e renovação espiritual neste espaço sagrado."
 building_iron_lion_cangzhou_destination_desc:0 "Fundido em ferro, o colossal [GetBuilding('iron_lion_cangzhou_01').GetName] sobreviveu tanto a terremotos quanto a inundações. Ao conversar com alguns mercadores locais, eles me dizem que o grande leão é até mesmo considerado um guardião contra as águas crescentes do próprio mar."
 building_iron_pillar_of_delhi_destination_desc:0 "A [GetBuilding('iron_pillar_of_delhi_01').GetName] se ergue desafiadora contra os estragos do tempo, sua composição resistente à ferrugem sendo uma maravilha da metalurgia. Erguido em honra ao rei Chandragupta II, é um testemunho do conhecimento avançado e habilidade dos artesãos de sua época."
 building_iron_pillar_of_dhar_destination_desc:0 "A [GetBuilding('iron_pillar_of_dhar_01').GetName] se ergue como um irmão menos conhecido, mas igualmente fascinante, de seu equivalente em Delhi. Este testemunho da engenhosidade dos artesãos antigos continua sendo um curioso tema para muitos viajantes e estudiosos."
 building_ise_jingu_01_destination_desc:0 "O [GetBuilding('ise_jingu_01').GetName] ergue-se ao lado das águas de um lago turvo, sua pagoda de cinco andares lançando longas sombras sobre as ruas antigas. Cortesãos e monges passam sob portões robustos, onde estudiosos meditam em tranquila devoção budista."
 building_itoigawa_mines_destination_desc:0 "Adornado por monges e místicos da região, o jade extraído em [GetBuilding('itoigawa_mines_01').GetName] possui uma longa história de prestígio. Sua beleza sempre atraiu caravanas de toda a ilha para abastecer seus artesãos."
 building_itsukushima_jinja_01_destination_desc:0 "O [GetBuilding('itsukushima_jinja_01').GetName] repousa sobre as águas da maré, com seu torii vermilion parecendo flutuar entre o mar e o céu. Lanternas balançam sob beirais de madeira enquanto monges cuidam dos rituais sagrados, seus cânticos misturando-se ao ritmo das ondas."
 building_izumo_taisha_destination_desc:0 "Cheguei a esta região a tempo de um festival; por toda parte vejo pessoas celebrando a divindade do casamento, Kotoamatsuikami. Ao avançar pela multidão, finalmente alcanço o [GetBuilding('izumo_taisha_01').GetName], um antigo santuário que me dizem ser mais antigo do que qualquer outro nestas ilhas."
 building_jaisalmer_fort_01_destination_desc:0 "À medida que o sol começa a se pôr no horizonte, as poderosas muralhas do [GetBuilding('jaisalmer_fort_01').GetName] ganham a cor quente do mel doce, brilhando intensamente no meio do deserto. A fortaleza foi construída para proteger a cidade interna de qualquer ameaça."
 building_jiaodong_mines_destination_desc:0 "Frequentemente chamada de Cidade Dourada do Céu, as [GetBuilding('jiaodong_mines_01').GetName] são amplamente conhecidas pela grande quantidade de ouro que produzem. A própria cidade cresceu e tornou-se um grande centro de comércio, centrado no trabalho e revenda do metal precioso."
 building_jizu_shan_temples_01_destination_desc:0 "Em terraços sobre as encostas da montanha, o [GetBuilding('jizu_shan_temples_01').GetName] observa nuvens que flutuam como marés. Rodas de oração de bronze giram ao vento enquanto monges cuidam do incenso entre as árvores antigas. Peregrinos sobem pacientemente degraus de pedra, buscando ecos de antigos esclarecimentos."
 building_jokhang_01_destination_desc:0 "O [GetBuilding('jokhang_01').GetName] é um complexo labiríntico de pátios e residências monásticas atravessados por corredores cavernosos e salões cobertos com manteiga de iaque. Hm, manteiga de iaque, talvez eu devesse experimentar um pouco..."
 building_jvari_monastery_destination_desc:0 "Empoleirado no topo de uma colina, o [GetBuilding('jvari_monastery').GetName] tem vista para a confluência dos rios abaixo. Este mosteiro ortodoxo georgiano, com sua arquitetura harmoniosa, é um retiro sereno e um símbolo da fé cristã duradoura na região."
 building_kaibao_mines_destination_desc:0 "O [GetBuilding('kaibao_mines_01').GetName] tem sido uma fonte de prata para o tesouro imperial por mais de mil anos, e isso realmente fica evidente quando viajo pela região. Prata e moedas atraem riqueza. Aqui, mercadores e artesãos prosperam com aquilo que os mineiros extraem para os fundidores."
 building_kaifeng_palace_01_destination_desc:0 "A névoa matinal do [GetBuilding('kaifeng_palace_01').GetName] revela um palácio imperial com vigas graciosamente pintadas. Caldeirões de bronze fumegam ao lado de pátios ladrilhados, enquanto calígrafos e oficiais passam sob treliças entalhadas, ecoando a autoridade Song."
 building_kairouan_basins_01_destination_desc:0 "Os [GetBuilding('kairouan_basins_01').GetName] foram construídos para fornecer água potável à cidade em tempos de necessidade, esses enormes reservatórios purificam a água da chuva agindo como tanques de decantação e filtrando os sedimentos."
 building_kano_walls_01_destination_desc:0 "As [GetBuilding('kano_walls_01').GetName], com vários metros de altura, cercam a antiga cidade de Kano, canalizando as importantes rotas comerciais da região por suas grandes portas."
 building_kassiopi_castle_destination_desc:0 "O [GetBuilding('kassiopi_castle').GetName], empoleirado majestosamente acima do Mar Jônico, se ergue como um farol de vigilância. O castelo, um ponto central de atividade naval e militar, desempenha um papel crucial na segurança e prosperidade das terras ao redor, com sua história entrelaçada com o fluxo e refluxo da própria Roma Oriental."
 building_khajuraho_destination_desc:0 "Os [GetBuilding('khajuraho_01').GetName], com suas esculturas requintadas e ousadas, são uma celebração da vida, do amor e da adoração. Esses maravilhosos marcos arquitetônicos, construídos pelos governantes Chandela, são um testemunho da visão artística e espiritual da época."
 building_khetri_mines_destination_desc:0 "As [GetBuilding('khetri_mines_01').GetName] são conhecidas por seus substanciais depósitos de cobre. Os diligentes esforços dos mineiros e ferreiros locais, extraindo e refinando esse metal essencial, sustentam o meio de vida da região."
 building_khiva_bazaar_01_destination_desc:0 "O [GetBuilding('khiva_bazaar_01').GetName] serpenteia por vielas ensolaradas sob torres turquesa, repleto dos aromas de cominho e lã. Comerciantes barganham por tapetes e marfim, suas vozes ecoando sob cúpulas que refletem o comércio histórico e o império do deserto."
 building_kofuku_ji_01_destination_desc:0 "O [GetBuilding('kofuku_ji_01').GetName] ergue-se ao lado das águas de um lago turvo, sua pagoda de cinco andares projetando longas sombras sobre as ruas antigas. Nobres e monges passam por portões robustos, onde estudiosos meditam em tranquila devoção budista."
 building_koganeyama_mines_destination_desc:0 "A ilha de Kinka é pontilhada pelos diligentes escavadores de [GetBuilding('koganeyama_mines_01').GetName], em busca do famoso pó de ouro que Kanayama, kami da mineração, ocultou ali."
 building_kollur_mines_destination_desc:0 "As [GetBuilding('kollur_mines_01').GetName], localizadas nas densas florestas de Kollur, são renomadas por seus diamantes requintados. As gemas dessas minas não apenas adornam as coroas dos reis, mas também simbolizam a riqueza das terras e a habilidade de quem as extrai."
 building_konark_temple_01_destination_desc:0 "Trabalhado por milhares de artesãos, o imenso [GetBuilding('konark_temple_01').GetName] é dedicado ao deus do sol, Surya. Todo o complexo foi construído para se assemelhar ao poderoso carro do deus, carregando a luz do mar em direção ao leste."
 building_konasamudram_mines_destination_desc:0 "As [GetBuilding('konasamudram_mines_01').GetName] são conhecidas por sua terra rica em diamantes. O brilho dessas pedras preciosas reflete não apenas a riqueza que elas trazem, mas também a habilidade e o esforço daqueles que as extraem."
 building_krakatoa_01_destination_desc:0 "Do meu barco no estreito, observo o [GetBuilding('krakatoa_01').GetName] elevando-se no horizonte, suas encostas envoltas em fumaça cambiante. O mar sussurra inquieto, e o ar carrega o aroma cortante de cinza — um lembrete do coração inquieto da montanha sob as ondas."
 building_kremnica_mines_destination_desc:0 "As [GetBuilding('kremnica_mines_01').GetName] são renomadas por seus depósitos de ouro. A extração desse metal precioso, símbolo de riqueza e poder, sustenta a cunhagem de moedas e o esplendor das cortes dos governantes."
 building_kutna_hora_mines_destination_desc:0 "As [GetBuilding('kutna_hora_mines_01').GetName] são uma fonte vital de prata, impulsionando tanto o comércio quanto a moeda. A rede de túneis e poços, escavados por mineiros determinados, exemplifica a engenhosidade e o trabalho árduo que impulsionam a economia da região."
 building_kyz_kala_01_destination_desc:0 "A [GetBuilding('kyz_kala_01').GetName] se eleva sobre o exuberante oásis de Merv, lançando sua longa sombra sobre a terra seca. Suas fundações repousam sobre um pedestal robusto, e suas paredes flutuadas engolfam oficinas, arsenais e grandes salões onde emissários e burocratas caminham apressadamente."
 building_lahur_bazaar_01_destination_desc:0 "O [GetBuilding('lahur_bazaar_01').GetName] pulsa com cores e sons vibrantes, enquanto vielas estreitas fervilham com vendedores de especiarias, tintureiros e joalheiros. Fumaça aromática sobe de barracas de comida, e cada esquina vibra com a energia de grandeza e comércio animado."
 building_lantian_mines_destination_desc:0 "[GetBuilding('lantian_mines_01').GetName] tem sido uma fonte proeminente de jade, tornando as colinas ao redor uma visão impressionante com pedreiras esculpidas e pedras verdes cintilantes à distância."
 building_leshan_giant_buddha_01_destination_desc:0 "Estou diante do [GetBuilding('leshan_giant_buddha_01').GetName], esculpido nos penhascos vermelhos acima do encontro dos rios. A névoa se reúne ao redor de seus imensos joelhos, e monges próximos entoam cânticos suaves, cujas preces são carregadas pelo mesmo vento que moldou esta montanha sagrada."
 building_lhasa_market_01_destination_desc:0 "O [GetBuilding('lhasa_market_01').GetName] se estende sob bandeiras de oração tremulantes, exibindo barracas repletas de lamparinas de manteiga, contas coloridas e lã de iaque. Monges, nômades e mercadores interagem no ar rarefeito da montanha, suas barganhas suavizadas pelos sinos distantes dos templos."
 building_liangzhe_mines_destination_desc:0 "[GetBuilding('liangzhe_mines_01').GetName] e o negócio da prata são o que fazem esta área prosperar. A prata atraiu artesãos e mineiros para cá, e as moedas cunhadas são o que atrai todos os mercadores."
 building_lingyin_temple_01_destination_desc:0 "Ao me aproximar do [GetBuilding('lingyin_temple_01').GetName] pelos vales enevoados de Hangzhou, Budas de pedra observam do Pico Feilai. No salão principal, um grande Sakyamuni dourado irradia entre incenso e cânticos."
 building_liuhe_pagoda_01_destination_desc:0 "Ao longo do curso do rio, o [GetBuilding('liuhe_pagoda_01').GetName] me recebe com sua majestosa elegância em camadas, claro no alto e escuro na base. No interior, à medida que subo, cada passo revela paredes externas, corredores em zigue-zague, paredes internas e pequenas câmaras ocupadas por estudiosos dedicados."
 building_lize_academy_01_destination_desc:0 "Ao finalizar minha jornada, o [GetBuilding('maoshan_academy_01').GetName] surge à minha frente, ao lado de um lago quieto que reflete salgueiros e telhados esmaltados. Ao me aproximar, ouço ao longe os estudiosos em seus simples mantos recitando os clássicos confucionistas."
 building_london_bridge_destination_desc:0 "A [GetBuilding('london_bridge_01').GetName], com seus arcos robustos e lojas movimentadas, atravessa o imenso Tâmisa como um cordão umbilical no coração de Londres. Ela serve não apenas como uma travessia, mas como um vibrante centro de comércio e atividade, onde mercadores, viajantes e habitantes se encontram."
 building_lund_cathedral_destination_desc:0 "A [GetBuilding('lund_cathedral_01').GetName], com sua impressionante arquitetura românica, domina o horizonte. Este centro espiritual, renomado por sua cripta e relógio astronômico, é um ponto focal da vida religiosa para a comunidade cristã local."
 building_maharloo_lake_destination_desc:0 "A visão do [GetBuilding('maharloo_lake_01').GetName] perto de Shiraz é hipnotizante. Suas águas cor-de-rosa criam uma paisagem quase surreal. O lago, um fenômeno natural único, me cativa com sua beleza e tranquilidade incomuns."
 building_maiden_tower_destination_desc:0 "A [GetBuilding('maiden_tower').GetName] vigia a boca do Bósforo. Suas paredes, imersas em lendas, têm observado a ascensão e queda de impérios. Agora, ela observa diligentemente, um ponto estratégico que comanda a passagem dos navios por estas águas históricas."
 building_maijishan_grottoes_destination_desc:0 "De longe, a montanha de Maijishan se ergue acima da paisagem, mas à medida que me aproximo, mais e mais das [GetBuilding('maijishan_grottoes_01').GetName], escavadas na encosta da montanha avermelhada, tornam-se visíveis. Há mais grutas do que consigo contar, com um grande número de estátuas de argila ornamentando cada abertura."
 building_mali_mines_destination_desc:0 "Nas vastas extensões do Mali, as [GetBuilding('mali_mines_01').GetName] são ricas em minério precioso, uma fonte de grande riqueza e orgulho. Os habilidosos mineiros e artesãos desta região há muito exploram essas reservas, impulsionando a economia local e o comércio."
 building_man_made_wonder_learning_outro_01_desc:0 "A engenhosidade e o talento artesanal testemunhados aqui deixaram uma impressão duradoura sobre a criatividade e a ambição humana."
 building_man_made_wonder_learning_outro_02_desc:0 "Esta maravilha da construção ampliou minha apreciação pelas alturas que podem ser alcançadas por meio do esforço humano."
 building_man_made_wonder_learning_outro_03_desc:0 "Estou partindo inspirado pelo notável legado de maestria arquitetônica que se ergue como um testemunho do nosso potencial."
 building_maoshan_academy_01_destination_desc:0 "O [GetBuilding('maoshan_academy_01').GetName] ergue-se entre picos esmeraldinos envoltos em névoa, com pátios perfumados por pinho e tinta. Acadêmicos copiam textos à luz de lamparinas, misturando medicina e misticismo enquanto garças circulam pelas cristas coroadas de santuários ao longe."
 building_martial_learning_outro_01_desc:0 "O poderio militar e os insights estratégicos adquiridos nesta visita ampliaram profundamente minha compreensão sobre a guerra."
 building_martial_learning_outro_02_desc:0 "Esta exploração me proporcionou valiosas lições sobre táticas militares e a arte da guerra, essenciais para qualquer líder."
 building_martial_learning_outro_03_desc:0 "Obtive conhecimentos significativos sobre estratégias de batalha e a importância da habilidade marcial na formação do curso da história."
 building_meteora_destination_desc:0 "Em Tessália, os mosteiros de [GetBuilding('meteora_01').GetName] são uma visão impressionante, empoleirados no topo de pilares rochosos. Estes santuários, aparentemente suspensos entre a terra e o céu, simbolizam a busca dos monges locais pela elevação espiritual."
 building_minarets_and_remains_of_jam_destination_desc:0 "Ao me aproximar das [GetBuilding('minarets_and_remains_of_jam_01').GetName], um sentimento de reverência me envolve. Essas estruturas imponentes, remanescentes da Dinastia Ghurid, se erguem como sentinelas solitárias na paisagem acidentada, com seu intricado trabalho em tijolos testemunhando uma era esquecida."
 building_mogok_mines_destination_desc:0 "As [GetBuilding('mogok_mines_01').GetName] brilham com a promessa de rubis e safiras. Essas gemas, enterradas profundamente na terra, são procuradas em todo o mundo, e seu brilho diz-se não ter igual."
 building_mont_st_michel_destination_desc:0 "Ao se aproximar da ilha de marés do [GetBuilding('mont_st_michel_01').GetName] durante a maré baixa, é possível ver sua magnífica igreja e muralhas elevando-se no horizonte, um lembrete do poder de Deus acima do Céu e da Terra. O local é tanto um importante centro religioso quanto uma fortaleza fortificada para os monges e pescadores locais."
 building_mount_apo_01_destination_desc:0 "Quando o [GetBuilding('mount_apo_01').GetName] surge no horizonte, sinto-me humilde diante de sua majestade silenciosa e grandiosa. Nuvens abraçam suas encostas acidentadas, e o aroma de chuva e cinza paira suavemente, com seu venerado pico guardando os espíritos da terra e do fogo."
 building_mount_athos_destination_desc:0 "O [GetBuilding('mount_athos_01').GetName], uma península no norte da Grécia, é uma comunidade monástica única. Esta montanha sagrada, lar de vários mosteiros, é um refúgio espiritual, imerso na tradição cristã ortodoxa, reverenciado tanto por monges quanto por peregrinos."
 building_mount_baekdu_01_destination_desc:0 "Quando o [GetBuilding('mount_baekdu_01').GetName] surge à vista, seu cume coberto de neve brilha contra o horizonte. Dizem que há no topo um vasto lago de cratera, repousando como um espelho dos céus, refletindo a própria bem-aventurança celestial."
 building_mount_damavand_destination_desc:0 "O majestoso [GetBuilding('mount_damavand_01').GetName], erguendo-se sobre a paisagem ao redor, inspira tanto admiração quanto reverência. Como o pico mais alto da [GetGeographicalRegion('world_persian_empire').GetName], seu cume coberto de neve e suas associações míticas cativam minha imaginação."
 building_mount_fuji_01_destination_desc:0 "[GetBuilding('mount_fuji_01').GetName] ergue-se majestosamente acima das planícies, seu pico nevado brilhando contra o céu límpido. Aldeões e peregrinos olham para cima em reverência, pois ele está associado à sua deusa e se ergue como um espelho de beleza eterna."
 building_mozu_tombs_destination_desc:0 "Os [GetBuilding('mozu_tombs').GetName] são uma maravilha curiosa. Diz-se que abrigam os imperadores de antigamente — os impressionantes túmulos em forma de montículo, com seus fossos em formato de fechadura, moldam a paisagem física tanto quanto a espiritual."
 building_muara_takus_destination_desc:0 "O [GetBuilding('muara_takus_01').GetName] é um lembrete do poder do império Srivijaya, além de um grande centro de culto. À medida que me aproximo, sou cercado por peregrinos vindos de todas as ilhas ao redor. Por séculos, o complexo de templos aqui tem sido um centro de poder religioso e temporal."
 building_muaro_jambi_01_destination_desc:0 "O [GetBuilding('muaro_jambi_01').GetName] se estende ao longo da margem do rio, um labirinto de santuários de tijolos envoltos pela selva. Trepadeiras se enrolam em estupas elegantemente construídas, e o ar vibra com o peso dos séculos — ecos de estudiosos e peregrinos que aqui buscavam comércio e fé."
 building_my_son_sanctuary_destination_desc:0 "O [GetBuilding('my_son_sanctuary_01').GetName] tem sido um centro da civilização cham por séculos, com reis sucessivos acrescentando novos templos e monumentos a uma área que agora é supremamente serena. Sou tomado por reverência ao observar os sacerdotes, peregrinos e oficiais cham cumprindo suas funções ao meu redor."
 building_nalanda_university_destination_desc:0 "A [GetBuilding('nalanda_university').GetName] é um grande centro de erudição védica. Esta antiga instituição atraiu estudiosos de toda a Ásia, e seu legado é estimado pelo povo local, que a reverencia como um símbolo de seu patrimônio histórico e cultural."
 building_nanhua_temple_01_destination_desc:0 "O [GetBuilding('nanhua_temple_01').GetName] ergue-se entre colinas exuberantes e rios tranquilos, com seus telhados de azulejos brilhando através da névoa matinal. Antigos ciprestes margeiam o caminho, e peregrinos se curvam diante de salões que ecoam séculos de devoção e estudiosa serenidade."
 building_natural_wonder_learning_outro_01_desc:0 "A beleza de tirar o fôlego e a majestade desta maravilha natural aprofundaram consideravelmente minha apreciação pelas esplêndidas maravilhas do mundo."
 building_natural_wonder_learning_outro_02_desc:0 "Esta visita instilou em mim um profundo senso de admiração pelo mundo natural e suas inúmeras maravilhas."
 building_natural_wonder_learning_outro_03_desc:0 "Estou partindo com uma reverência renovada pelo poder e beleza inspiradores da natureza, e sua capacidade de moldar nosso mundo e perspectivas."
 building_nishapur_mines_destination_desc:0 "As [GetBuilding('nishapur_mines_01').GetName] são famosas por seu requintado turquesa. Esta vibrante gema, valorizada em joias e decoração, reflete a riqueza da cultura [persian_culture.GetName] e seu artesanato."
 building_notre_dame_destination_desc:0 "A majestosa [GetBuilding('notre_dame_01').GetName], com suas torres imponentes e grande fachada, é uma obra-prima da arquitetura gótica. Dentro, o ar ressoa com os ecos de piedade, cada vitral e escultura conta uma história sagrada."
 building_offas_dyke_destination_desc:0 "Percorrendo a paisagem, a [GetBuilding('offas_dyke_01').GetName] se ergue como uma notável obra de terra, uma fronteira criada na época [Select_CString( offa.IsFemale, 'da rainha', 'do rei' )] [offa.GetFirstName]. Este grande divisor, agora parcialmente erodido, mas ainda discernível, marca uma linha antiga de defesa e demarcação, sugerindo as lutas pelo poder da era."
 building_pagoda_of_fogong_temple_01_destination_desc:0 "O [GetBuilding('pagoda_of_fogong_temple_01').GetName] ergue-se diante de mim, seus níveis de madeira alcançando o céu como uma prece gravada no firmamento. Cada andar carrega o aroma de incenso antigo, representando um duradouro testamento de devoção e artesania por quase mil anos."
 building_palace_of_aachen_destination_desc:0 "O [GetBuilding('palace_of_aachen_01').GetName] permanece como um legado d[Select_CString( charlemagne.IsFemale, 'a', 'o' )] [charlemagne.GetFirstNameNicknamed]. Sua grandiosa capela, com design octagonal e teto abobadado, reflete a ambição do imperador de reviver a glória do [GetTitleByKey('h_roman_empire').GetNameNoTier]."
 building_palace_of_ctesiphon_destination_desc:0 "O [GetBuilding('palace_of_ctesiphon_01').GetName] evoca a grandiosidade do Império Sassânida. O arco de Taq Kasra, ainda de pé apesar dos estragos do tempo, é um lembrete tocante da habilidade arquitetônica dessa antiga civilização."
 building_pansjhir_mines_destination_desc:0 "As [GetBuilding('pansjhir_mines_01').GetName] são conhecidas por seu precioso lápis-lazúli. Esta pedra azul vibrante, procurada por sua beleza e raridade, é um tesouro dessas terras, cobiçado por artesãos e mercadores."
 building_parthenon_destination_desc:0 "O [GetBuilding('parthenon').GetName] no topo da Acrópole em Atenas se ergue como um símbolo duradouro da civilização grega antiga. Este majestoso templo, embora parcialmente em ruínas, continua a impressionar os visitantes com sua genialidade arquitetônica e importância histórica."
 building_patras_castle_destination_desc:0 "O [GetBuilding('patras_castle').GetName] tem sido um sentinela ao longo dos séculos. Suas robustas muralhas e torres, marcadas por várias épocas, são um testemunho da importância histórica e valor estratégico da cidade."
 building_petra_destination_desc:0 "A antiga cidade de [GetBuilding('petra_01').GetName], esculpida nas falésias de cor vermelho-rosa, é uma visão de tirar o fôlego. Seu famoso Al-Khazneh, embora desbotado de sua glória anterior, ainda ecoa a prosperidade de uma era passada, uma maravilha de engenharia e arte."
 building_phnom_dek_mines_destination_desc:0 "As [GetBuilding('phnom_dek_mines_01').GetName] ou 'Montanha de Ferro' é uma grande fonte de ferro nesta região. Ao se aproximar da cidade, não há como evitar as muitas carroças pesadamente carregadas a caminho das planícies ao redor de Angkor."
 building_phocaea_mines_destination_desc:0 "As [GetBuilding('phocaea_mines_01').GetName] são conhecidas por seu alúmen. O processo de extração deste mineral vital, usado na tinturaria e curtume, envolve habilidade e conhecimento transmitidos de geração em geração."
 building_plain_of_jars_01_destination_desc:0 "A [GetBuilding('plain_of_jars_01').GetName] estende-se diante de mim, vasto e silencioso sob um céu pálido. Espalhados pelas colinas, enormes vasos misteriosos repousam semienterrados entre a grama e as sombras, seu propósito esquecido sussurrando sobre uma civilização há muito desaparecida, mas jamais totalmente perdida."
 building_pleasure_dome_01_destination_desc:0 "O [GetBuilding('pleasure_dome').GetName] ergue-se do chão como um sonho tornado real. Cercado por jardins e riachos, seus salões de mármore e pavilhões abertos convidam ao lazer e à reflexão, flutuando em uma névoa de música e ar perfumado."
 building_po_klong_garai_01_destination_desc:0 "Chego ao [GetBuilding('po_klong_garai_01').GetName] sob o sol escaldante, suas torres de tijolos vermelhos erguendo-se das colinas áridas como brasas de devoção. Entalhes desgastados de divindades e serpentes guardam o santuário, onde incenso e silêncio honram um rei tornado lenda."
 building_pyramid_lingapura_destination_desc:0 "A [GetBuilding('pyramid_lingapura_01').GetName] é o principal destaque desta cidade e, ao adentrar o recinto ao seu redor, não posso deixar de me maravilhar com a enorme pirâmide que se ergue acima de mim. Diversas pequenas capelas e santuários cobrem partes dos degraus que levam ao topo, onde um grande templo abriga o lingam dourado sobre um vasto pedestal."
 building_qianling_mausoleum_01_destination_desc:0 "Chego ao [GetBuilding('qianling_mausoleum_01').GetName], onde avenidas de pedra sobem uma colina de túmulos reais. Estátuas de cavalos e emissários permanecem em fileiras silenciosas, guardando o Imperador Gaozong e a Imperatriz Wu sob o solene abraço da terra."
 building_quanzhou_seaport_01_destination_desc:0 "O [GetBuilding('quanzhou_seaport_01').GetName] é movimentado, com navios descarregando mercadorias nos cais agitados enquanto marinheiros gritam por cima dos sons de cordas e carroças, enquanto oficiais registram meticulosamente cada carga. Um ritmo constante de comércio define este vibrante porto costeiro."
 building_rainbow_mountains_destination_desc:0 "Ao olhar para as [GetBuilding('rainbow_mountains_01').GetName], fico maravilhado com suas camadas vibrantes e multicoloridas. Estas impressionantes formações naturais, uma maravilha geológica, me deixam em êxtase diante da arte natural da Terra."
 building_rammelsberg_mines_destination_desc:0 "As [GetBuilding('rammelsberg_mines_01').GetName] são um centro de atividade, cavando profundamente na terra em busca de minérios preciosos. A engenhosidade e perseverança dos mineiros aqui são essenciais para a prosperidade e habilidade artesanal da região."
 building_ratnapura_mines_destination_desc:0 "As [GetBuilding('ratnapura_mines_01').GetName] brilham com a promessa de safiras e rubis. Essas gemas, enterradas profundamente na terra, são procuradas no mundo todo, um testemunho da riqueza dessas terras."
 building_religious_learning_outro_01_desc:0 "Esta visita aprofundou minha compreensão das crenças espirituais e práticas que moldaram as civilizações."
 building_religious_learning_outro_02_desc:0 "Explorar este local sagrado enriqueceu minha visão sobre o impacto profundo da fé na história e cultura humanas."
 building_religious_learning_outro_03_desc:0 "Minha jornada aqui iluminou as diversas maneiras pelas quais a devoção religiosa foi expressa e reverenciada ao longo do tempo."
 building_rock_of_gibraltar_destination_desc:0 "A [GetBuilding('rock_of_gibraltar_01').GetName], erguendo-se majestosa acima do mar, é um marco estratégico e simbólico. O povo local, ciente de sua importância militar, a fortificou ao longo dos séculos, tornando-a uma bastião na porta de entrada entre dois mundos."
 building_roman_wall_of_lugo_destination_desc:0 "A [GetBuilding('roman_wall_of_lugo_01').GetName], que circunda a cidade velha, é um notável testemunho da engenharia [roman_culture.GetName]. A população local se orgulha deste monumento histórico, que continua a ser um robusto símbolo do passado antigo de sua cidade."
 building_rudnik_mines_destination_desc:0 "As [GetBuilding('rudnik_mines_01').GetName] estão movimentadas, extraindo preciosa prata. Os trabalhadores mineiros locais e a riqueza que geram fizeram desta região um centro de atividade econômica e crescimento."
 building_sado_mines_destination_desc:0 "Um lugar discreto, desolado e isolado, mas abaixo do solo os mineiros de [GetBuilding('sado_mines_01').GetName] extraem com afinco as riquezas escondidas da ilha."
 building_saint_catherine_destination_desc:0 "Aninhado aos pés do Monte Sinai, o [GetBuilding('saint_catherine').GetName] é uma fortaleza da fé. Este antigo mosteiro, com seus manuscritos inestimáveis e relíquias sagradas, é um lugar de reflexão para a comunidade ortodoxa local e para os visitantes."
 building_saint_lazarus_destination_desc:0 "No coração de Larnaca, a [GetBuilding('saint_lazarus').GetName] se ergue como um venerável local de culto. Esta bela estrutura, com sua iconografia intrincada e relíquias sagradas, ocupa um lugar especial na vida espiritual da comunidade ortodoxa local."
 building_sanchi_stupa_destination_desc:0 "A cúpula da [GetBuilding('sanchi_stupa_01').GetName] é o principal ponto focal em uma colina fora do próprio assentamento de Sanchi. Entre os muitos peregrinos e monges que encontro neste local, muitos afirmam que o complexo do templo está em uso há milhares de anos."
 building_sankore_university_destination_desc:0 "Na lendária cidade de Timbuktu, a [GetBuilding('sankore_university').GetName] é um centro de aprendizado e erudição. Estudiosos e alunos se reúnem aqui, explorando uma vasta gama de estudos, desde teologia até astronomia."
 building_sar_i_sang_mines_01_destination_desc:0 "Na [GetBuilding('sar_i_sang_mines_01').GetName], o ar está espesso com a poeira do lápis-lazúli. A pedra azul profunda, valorizada por sua cor intensa, está sendo extraída meticulosamente por mineradores habilidosos. As minas ressoam com uma história de comércio e luxo, o lápis-lazúli tendo adornado os mais finos tesouros dos impérios."
 building_schwaz_mines_destination_desc:0 "As [GetBuilding('schwaz_mines_01').GetName] são um centro de produção de prata. A riqueza extraída dessas profundezas transformou a cidade em um próspero centro comercial, atraindo mercadores e artesãos de todas as partes."
 building_shah_i_zinda_destination_desc:0 "Explorar a necrópole de [GetBuilding('shah_i_zinda_01').GetName] em Samarcanda é uma jornada através do tempo e da arte. Cada mausoléu, com seu requintado trabalho em azulejos, conta uma história, evocando um profundo respeito pela rica herança cultural e espiritual da região."
 building_shaolin_monastery_01_destination_desc:0 "Chego ao [GetBuilding('shaolin_monastery_01').GetName] próximo ao Monte Song, onde monges treinam entre aromas de pinho e incenso, mesclando meditação e artes marciais em uma disciplina rítmica."
 building_shigu_academy_01_destination_desc:0 "Minhas viagens finalmente me levam ao [GetBuilding('shigu_academy_01').GetName], escondido no topo de colinas envoltas de névoa e cercado por bosques exuberantes. Subindo as escadas, seu famoso portão surge acolhedor com escritos intrincados, sombreado pelo telhado recentemente restaurado."
 building_shwedagon_pagoda_destination_desc:0 "A [GetBuilding('shwedagon_pagoda_01').GetName], com seu pináculo dourado alcançando os céus, é uma maravilha de se ver. Este local sagrado, acreditando-se conter relíquias do Buda, é um lugar de peregrinação e devoção, refletindo o coração espiritual da Birmânia."
 building_siderokausia_mines_destination_desc:0 "As [GetBuilding('siderokausia_mines_01').GetName] estão em pleno movimento, extraindo ferro vital para as necessidades da região. Os esforços incansáveis dos mineiros aqui são voltados para aproveitar os recursos da terra."
 building_siena_university_destination_desc:0 "A Universidade de Siena, localizada no coração da Toscana e representada pela [GetBuilding('siena_university').GetName], é um centro de educação e pensamento. Seu corpo docente renomado e seus alunos dedicados contribuem para uma comunidade acadêmica vibrante, desempenhando um papel fundamental na vida intelectual da população local."
 building_sofia_ohrid_destination_desc:0 "Quando o [GetBuilding('sofia_ohrid').GetName] aparece à vista, fico encantado com sua beleza serena. Cada afresco e mosaico conta uma história de fé e arte, um legado que resistiu ao teste do tempo e continua a inspirar tanto os fiéis quanto os visitantes."
 building_soltaniyeh_destination_desc:0 "O [GetBuilding('soltaniyeh_01').GetName] é uma obra-prima arquitetônica da era Ilkhanate. Seu design inovador e azulejos azuis deslumbrantes fazem dele um marco que realmente se destaca."
 building_somapura_university_01_destination_desc:0 "[GetBuilding('somapura_university_01').GetName] tem servido por séculos como um dos centros de aprendizado mais importantes da Índia, atraindo estudiosos de regiões distantes graças à sua multiplicidade de conexões com mosteiros budistas, jainistas e hindus."
 building_srebrenica_mines_destination_desc:0 "As [GetBuilding('srebrenica_mines_01').GetName] é uma fonte crucial de prata. O constante trabalho árduo dos mineiros, cavando na terra, impulsiona a prosperidade da região, tornando-a um centro vital para o comércio."
 building_stone_pagoda_destination_desc:0 "O [GetBuilding('stone_pagoda_01').GetName] é dito ser o mais antigo de seu tipo nesta região; com sua alvenaria branca imaculada refletindo a luz intensa do sol, isso é difícil de imaginar. Dizem-me que foi construído em um lago drenado por ordem de um antigo rei, e que artesãos de todos os reinos da Coreia contribuíram para sua criação."
 building_stonehenge_destination_desc:0 "O misterioso [GetBuilding('stonehenge_01').GetName] se ergue na Planície de Salisbury, seu propósito perdido no tempo. Essas grandes pedras, dispostas em uma formação complexa, falam de um conhecimento ancestral e uma conexão com o celestial, muito antes de nosso tempo."
 building_sumela_monastery_destination_desc:0 "Esculpido nas falésias de Trabzon, o [GetBuilding('sumela_monastery_01').GetName] é uma maravilha da arquitetura monástica. Este retiro remoto, agarrado à encosta da montanha, oferece vistas deslumbrantes e um senso de paz profunda para aqueles que o visitam."
 building_sunday_bazaar_01_destination_desc:0 "O [GetBuilding('sunday_bazaar_01').GetName] é vibrante, com ruas iluminadas pelo sol repletas de sedas, especiarias e gado. Comerciantes de regiões distantes negociam em muitos idiomas, criando um mosaico vivo de vozes e mercadorias que encarna o espírito da Rota da Seda."
 building_suvarnadvipa_mines_destination_desc:0 "Ao longo das encostas das Montanhas Barisan, [GetBuilding('suvarnadvipa_mines_01').GetName] oferece aos trabalhadores um trabalho exigente, porém gratificante, enquanto enriquece a riqueza dos artesãos e comerciantes locais."
 building_suwalesi_megaliths_destination_desc:0 "Um tipo único de megalito pode ser visto por todo este vale. Grandes figuras de pedra, com rostos simples e estilizados, nos cercam. Um aldeão no caminho até aqui disse que realizam sacrifícios para alguns deles, enquanto o propósito de outros é desconhecido até mesmo para as pessoas que vivem aqui."
 building_swahili_port_lamu_destination_desc:0 "Chego ao [GetBuilding('swahili_port_lamu').GetName], onde casas de pedra de coral encaram o mar e barcos flutuam com a maré. O ar vibra com línguas regionais, e o aroma de cravo e sal preenche as vielas estreitas iluminadas pelo sol."
 building_swahili_port_mombasa_destination_desc:0 "O [GetBuilding('swahili_port_mombasa').GetName] se estende ao longo de uma baía em crescente, suas águas vivas com velas e vozes. Fortificações de pedra vigiam o porto, enquanto mercados se espalham em direção à costa, densos com o aroma de óleo de palma, cobre e a promessa inquieta do vasto mar além."
 building_swahili_port_pate_destination_desc:0 "A linha costeira do [GetBuilding('swahili_port_pate').GetName] brilha intensamente sob o sol do meio-dia, com cais de pedra movimentados onde mercadores gritam sobre caixas de marfim e grãos. Palmeiras-datim balançam atrás dos muros do porto, enquanto toda a ilha pulsa com o som dos mares distantes."
 building_swahili_port_pemba_destination_desc:0 "O [GetBuilding('swahili_port_pemba').GetName] vibra com um propósito tranquilo, e o aroma de cravo é intenso no ar. Comerciantes desconhecidos das costas do norte trocam moedas de prata, enquanto pequenos barcos descarregam sacos de especiarias destinados a mercados distantes."
 building_swahili_port_zanzibar_destination_desc:0 "O [GetBuilding('swahili_port_zanzibar').GetName] fervilha de atividade sob nuvens passageiras quando chego, com portas de madeira entalhada levando a vielas repletas de barracas de especiarias, enquanto navios estrangeiros atracam no porto."
 building_tada_mines_destination_desc:0 "Entre as montanhas florestadas de Settsu, [GetBuilding('tada_mines_01').GetName] ecoa com a atividade intensa dos mineradores de cobre, extraindo as riquezas escondidas da terra."
 building_taghaza_mines_destination_desc:0 "No coração do deserto do Saara, as [GetBuilding('taghaza_mines_01').GetName] são uma fonte severa, mas crucial, de sal. Caravanas percorrem grandes distâncias até este lugar desolado, em busca do sal que é mais valioso que o ouro nessas terras."
 building_takkeda_mines_destination_desc:0 "As movimentadas [GetBuilding('takkeda_mines_01').GetName] são renomadas por seus ricos veios de prata. O metal extraído aqui não apenas impulsiona a habilidade local, mas também contribui significativamente para o tesouro da região."
 building_temple_arrival_01_desc:0 "Ao entrar no [location.GetTitle.GetName], estou ansioso para as maravilhas espirituais que se encontram dentro."
 building_temple_arrival_02_desc:0 "A aura serena do [location.GetTitle.GetName] me chama, prometendo uma jornada para um reino de paz e sabedoria antiga."
 building_temple_arrival_03_desc:0 "Ao me aproximar do [location.GetTitle.GetName], um profundo senso de reverência toma conta de mim, antecipando os insights sagrados que ele oferece."
 building_temple_arrival_04_desc:0 "Ao entrar no [location.GetTitle.GetName], me sinto pronto para vivenciar a profundidade espiritual e a beleza que ele abriga."
 building_temple_arrival_05_desc:0 "O [location.GetTitle.GetName] se ergue diante de mim, um santuário de fé, e estou ansioso para me imergir em sua atmosfera sagrada."
 building_temple_in_jerusalem_destination_desc:0 "Os remanescentes do [GetBuilding('temple_in_jerusalem_01').GetName], sagrados tanto para judeus quanto para cristãos, evocam um profundo senso de história e espiritualidade. O Muro das Lamentações, o que restou deste templo outrora magnífico, é um lembrete pungente do turbulento passado da cidade."
 building_temple_of_uppsala_destination_desc:0 "O [GetBuilding('temple_of_uppsala_01').GetName], envolto na aura do sagrado, se ergue como um local reverenciado onde as antigas tradições nórdicas se fundem com o presente. Este venerado salão tem sido um centro de encontros, suas origens ecoando com as diversas vozes dos peregrinos."
 building_the_colosseum_destination_desc:0 "Diante de mim está [GetBuilding('the_colosseum_01').GetName], uma colossal ruína de uma era passada. Antigamente um lugar de espetáculo e glória, agora permanece parcialmente em ruínas, lembrando o poder e a extensão de [GetTitleByKey('h_roman_empire').GetNameNoTier], ecoando histórias de um passado repleto de grandeza e conflito."
 building_the_friday_mosque_destination_desc:0 "[GetBuilding('the_friday_mosque_01').GetName], com sua estrutura imponente e elegantes minaretes, é um local central de adoração. Toda semana, torna-se um centro de atividade e oração, onde os fiéis se reúnem em grande número, reafirmando a força e unidade da comunidade [GetReligionByKey('islam_religion').GetName]ica."
 building_the_pyramids_destination_desc:0 "[GetBuilding('the_pyramids_01').GetName], antigas e majestosas, se erguem das areias como fizeram por milênios. Esses túmulos dos faraós, agora despidos de seu calcário polido, ainda impõem admiração e respeito, uma memória duradoura de uma civilização outrora grandiosa."
 building_the_tower_of_london_destination_desc:0 "[GetBuilding('the_tower_of_london_01').GetName], com sua estrutura imponente, serve tanto como palácio real quanto como prisão. O ar dentro dessas muralhas é pesado com história, as histórias de reis, rainhas e prisioneiros gravadas em suas pedras."
 building_theodosian_walls_destination_desc:0 "As imponentes [GetBuilding('theodosian_walls_01').GetName], protegendo Constantinopla, são uma maravilha da engenharia. Sua presença imponente e múltiplas camadas falam de uma cidade preparada para qualquer cerco. A visão em construir tais defesas é evidente."
 building_three_pagodas_dali_destination_desc:0 "Erguendo-se diante do complexo do templo Congsheng, as [GetBuilding('three_pagodas_dali_01').GetName] são a característica definidora de Dali, bem como o maior monumento do reino. O pagode principal, com seus 16 andares, é um lembrete de quão pequena é uma única pessoa no grande esquema das coisas. A área ao redor está repleta de peregrinos e monges, alguns alheios às grandiosas construções, outros claramente maravilhados ao vê-las pela primeira vez."
 building_thuriang_kilns_destination_desc:0 "Não consigo deixar de admirar a beleza dos templos e dos fossos cheios de água em Sukhotai. A cidade claramente não é apenas um centro de fé; ao atravessar uma área de intensa atividade, observo os famosos [GetBuilding('thuriang_kilns_01').GetName]. Aqui, mestres de seu ofício produzem requintadas peças de cerâmica celadon para exportação a toda a região."
 building_tiantai_monasteries_01_destination_desc:0 "O [GetBuilding('tiantai_monasteries_01').GetName] se agarra a penhascos enevoados acima de vales profundos. Riachos murmuram por entre pedras cobertas de musgo, e monges que carregam pergaminhos debatem escrituras onde seus mestres um dia ensinaram meditação, doutrina e o próprio mundo."
 building_tomb_of_cyrus_destination_desc:0 "Diante do [GetBuilding('tomb_of_cyrus_01').GetName] em Pasárgada, sou preenchido com um profundo senso de história. Este monumento simples, mas elegante, dedicado à mãe do Rei Salomão, ressoa com um legado profundo."
 building_tower_of_hercules_destination_desc:0 "Erguendo-se perto da costa, a [GetBuilding('tower_of_hercules_01').GetName] é um antigo farol que tem guiado marinheiros por séculos. Esta estrutura [roman_culture.GetName], imersa em mitos e história, é um símbolo de resistência e orientação para a comunidade local de marinheiros."
 building_trepca_mines_destination_desc:0 "As [GetBuilding('trepca_mines_01').GetName] é uma fonte significativa de chumbo e prata. A comunidade mineira local, hábil em navegar pelo terreno desafiador, desempenha um papel fundamental na prosperidade da área."
 building_tribal_holding_arrival_01_desc:0 "À medida que me aproximo do [location.GetTitle.GetName], um senso de espírito comunitário e unido me recebe."
 building_tribal_holding_arrival_02_desc:0 "A atmosfera vibrante do [location.GetTitle.GetName] me saúda com cores vivas e expressões culturais ricas."
 building_tribal_holding_arrival_03_desc:0 "Ao me aproximar do [location.GetTitle.GetName], a harmonia entre a natureza e a tradição é imediatamente evidente."
 building_tribal_holding_arrival_04_desc:0 "O charme rústico do [location.GetTitle.GetName] me enche de antecipação e desejo de aprender."
 building_tribal_holding_arrival_05_desc:0 "Ao entrar no [location.GetTitle.GetName], sou tocado pela simplicidade e calor da comunidade local."
 building_trosky_castle_01_destination_desc:0 "O poderoso [GetBuilding('trosky_castle_01').GetName] é construído entre duas enormes formações rochosas de basalto, ditas pelos anciãos como vulcões adormecidos. Embora seu nome ironicamente se traduza como 'ruínas' por causa da aparência das rochas, ele está longe de ser isso."
 building_tsushima_mines_destination_desc:0 "A fama de [GetBuilding('tsushima_mines_01').GetName] garante um fluxo constante de mineiros espalhados pela ilha, processando o minério negro e procurando novas veias."
 building_turda_mines_destination_desc:0 "As [GetBuilding('turda_mines_01').GetName] são uma fonte vital de sal. Este 'ouro branco', essencial tanto para a preservação quanto para o comércio, tornou as minas um importante centro econômico."
 building_vatapi_caves_01_destination_desc:0 "Construídas pela dinastia Chalukya, as [GetBuilding('building_vatapi_caves_01').GetName] foram escavadas profundamente em uma formação imponente de arenito. No interior, encontra-se um mundo interior mais sagrado e silencioso. Um portão triunfal conduz os peregrinos até a face monolítica da montanha."
 building_verespatak_mines_destination_desc:0 "As [GetBuilding('verespatak_mines_01').GetName] são uma rica fonte de ouro. Essa abundância transformou a área em um centro movimentado de atividade mineradora, atraindo aventureiros e mercadores seduzidos pela promessa de riqueza."
 building_visby_ringmur_destination_desc:0 "A [GetBuilding('visby_ringmur_01').GetName] circunda a cidade, um testemunho de pedra de sua importância no comércio e na defesa. Caminhando por essas muralhas, admiro a habilidade dos construtores e a visão dos líderes, garantindo a segurança e a prosperidade de seu povo."
 building_visegrad_castle_01_destination_desc:0 "O [GetBuilding('visegrad_castle_01').GetName] é um grandioso e impenetrável sistema de muralhas e torres, protegendo a curva do Danúbio e controlando seu rico comércio."
 building_walls_of_benin_destination_desc:0 "As grandes [GetBuilding('walls_of_benin_01').GetName] se estendem até onde a vista alcança, um esforço monumental do povo local. Esta enorme obra de terra, maior do que muitas que vi, é um símbolo orgulhoso da força e engenhosidade desta terra."
 building_walls_of_genoa_destination_desc:0 "As imponentes [GetBuilding('walls_of_genoa_01').GetName], erguendo-se como barreiras formidáveis para proteger a cidade, exibem o poder militar e a astúcia estratégica de seus líderes."
 building_wartburg_01_destination_desc:0 "Escondida na floresta da Turíngia e empoleirada no alto de um grande precipício rochoso, a poderosa fortaleza de [GetBuilding('wartburg_01').GetName] controla todo o movimento de mercadorias e pessoas pela região. Um enorme salão de pedra fria aquecido pelas várias lareiras no interior."
 building_wawel_cathedral_01_destination_desc:0 "Construída com a ajuda de artesãos de toda a Cristandade, esta grande catedral de pedra é a primeira de seu tipo nas terras polonesas. Do topo da colina de [GetBuilding('wawel_cathedral_01').GetName], os sinos de suas duas torres chamam os cidadãos para a missa em suas longas naves iluminadas por velas."
 building_white_deer_grotto_academy_01_destination_desc:0 "À medida que me aproximo do [GetBuilding('white_deer_grotto_academy_01').GetName], sou tomado pela forma como ele se integra perfeitamente às colinas ao redor. Seus edifícios de pedra repousam entre bosques de bambu, evocando um local onde estudiosos outrora buscaram verdade e harmonia."
 building_wilwatikta_palace_destination_desc:0 "A área urbana da cidade-templo é tão impressionante quanto extensa; ao passar pelas áreas residenciais e me aproximar do [GetBuilding('wilwatikta_palace_01').GetName], não posso deixar de refletir sobre as grandes riquezas e o poder político da ilha de Java e de seu povo."
 building_wudang_mountain_temples_01_destination_desc:0 "Ascendo pelos caminhos sinuosos do [GetBuilding('wudang_mountain_temples_01').GetName], onde templos se agarram a penhascos enevoados. Telhados de bronze brilham entre as nuvens enquanto monges se movem silenciosamente entre santuários e pinheiros. É um lugar sagrado onde arquitetura e natureza se unem."
 building_wulingyuan_01_destination_desc:0 "Minha jornada me leva pelos vales cobertos de névoa do [GetBuilding('wulingyuan_01').GetName], onde imponentes pilares de arenito se erguem como sentinelas antigas acima de densas florestas verdes. Cachoeiras surreais despencam dos penhascos, e templos ocultos se agarram a saliências rochosas."
 building_xiuyan_mines_destination_desc:0 "O tipo de jade extraído em [GetBuilding('xiuyan_mines_01').GetName] continua a adornar o artesanato comum com seu distinto tom verde há séculos."
 building_yazd_mosque_destination_desc:0 "Ao erguer o olhar para os minaretes acima do grande portal da [GetBuilding('yazd_mosque_01').GetName], sou tomado por reverência. No caminho até aqui, um morador local me lembrou de que a cidade é um centro religioso há mais tempo do que qualquer um consegue se lembrar. Hoje, as ruas ainda estão cheias de peregrinos e sacerdotes, fiéis que viajaram de longe para visitar este local requintado."
 building_york_walls_01_destination_desc:0 "Com vários quilômetros de extensão, essas imponentes [GetBuilding('york_walls_01').GetName] protegem a cidade desde a época dos césares. O local foi escolhido não por sua elevação, mas para aproveitar os dois rios que serpenteiam pela campina ao redor."
 building_yuelu_academy_destination_desc:0 "Ao atravessar o pátio principal da [GetBuilding('yuelu_academy_01').GetName], sou tomado por reverência pelos estudiosos e discípulos de Confúcio que vieram aqui para ensinar e debater. É fácil perceber como incontáveis oficiais eruditos se beneficiam do que acontece nesses pátios."
 building_yungang_grottoes_01_destination_desc:0 "O [GetBuilding('yungang_grottoes_01').GetName] é um complexo de cavernas onde penhascos cor de mel foram esculpidos em grandes santuários de pedra. Dentro das sombras frias, fileiras de enormes Budas encaram o exterior, seus rostos serenos ainda exibindo vestígios de tinta antiga."
 building_zawar_mines_destination_desc:0 "As [GetBuilding('zawar_mines_01').GetName] são uma fonte antiga de zinco e chumbo. A engenhosidade dos mineiros, que se aprofundam nas profundezas para extrair esses metais, tem sido crucial para o crescimento e desenvolvimento da região."
 building_zigong_mines_destination_desc:0 "Por milhares de anos, as [GetBuilding('zigong_mines_01').GetName] forneceram sal aos chineses. A paisagem urbana é dominada pelos característicos poços perfurados, áreas de evaporação e outras infraestruturas especializadas na extração de sal."
 building_zijinshan_mines_destination_desc:0 "Se não fosse pelas [GetBuilding('zijinshan_mines_01').GetName] e seu ouro, esta área provavelmente não seria tão desenvolvida quanto é hoje. O assentamento é claramente moldado pelo negócio da mineração e pelos muitos engenheiros e artesãos que trouxe das regiões vizinhas."
 curiosity_1:0 "Espero ansiosamente os encontros com os locais, desejando me imergir em suas histórias e tradições."
 curiosity_2:0 "A perspectiva de me conectar com a comunidade local, aprendendo com suas experiências, me enche de alegria."
 curiosity_3:0 "Minha empolgação cresce ao pensar em conhecer aqueles que chamam este lugar de lar, compartilhando contos e sabedoria."
 knowledge_hoarding_1:0 "Farei anotações intermináveis e devorarei cada pedaço de conhecimento que eu encontrar."
 knowledge_hoarding_2:0 "Compilarei notas exaustivas e absorverei cada fragmento de sabedoria disponível."
 knowledge_hoarding_3:0 "Tenho a intenção de reunir registros completos e consumir cada pedaço de insight possível."
 legendary_hunting_ground_destination_desc:0 "O [GetBuilding('legendary_hunting_lodge').GetName] é um reino onde a selva reina suprema. Suas vastas terras, repletas de flora e fauna diversificadas, oferecem um santuário intocado para a nobre arte da caça. Aqui, tradição e natureza se entrelaçam, proporcionando uma experiência desafiadora, mas gratificante, para aqueles que buscam testar suas habilidades contra a selvageria."
 legendary_palace_destination_desc:0 "Envolto em grandeza, o [GetBuilding('legendary_palace').GetName] é uma obra-prima arquitetônica que cativa todos que entram em seu domínio. Seus luxuosos salões e jardins são um testemunho do auge da realização artística. Este palácio, um centro de poder e beleza, inspira admiração e maravilha nos corações dos visitantes."
 legendary_shrine_destination_desc:0 "Aninhado na tranquilidade, o [GetBuilding('legendary_shrine').GetName] é um oásis sagrado que atrai tanto os fiéis quanto os curiosos. É um lugar de reflexão e devoção, onde rituais e orações ecoam contra o pano de fundo do tempo. Este santuário oferece consolo e conexão com o divino, servindo como uma ponte entre o terreno e o etéreo."
 legendary_statue_destination_desc:0 "A [GetBuilding('legendary_statue').GetName] se ergue como uma homenagem imortal ao heroísmo e às virtudes que representa. Esculpida em pedra, mas imbuída com o espírito da lenda, ela captura o olhar de todos que passam. É um ponto de orgulho e inspiração, encarnando a memória coletiva e as aspirações do povo."
 legendary_watchtower_destination_desc:0 "A [GetBuilding('legendary_watchtower').GetName] se eleva alto, observando a terra com um olhar imperturbável. Sua estrutura formidável, um farol por milhas ao redor, é um testemunho da vigilância de seus criadores. Ela serve não apenas como um ponto de observação, mas também como um símbolo de proteção contra qualquer um que ouse ameaçar a paz do reino."
 spread_legend_1:0 "Vou tecer a história de [ROOT.Char.GetPromotedLegend.GetName] no tecido deste lugar, deixando sua marca na história."
 spread_legend_2:0 "Minha jornada também é uma missão: espalhar a fama de [ROOT.Char.GetPromotedLegend.GetName], fazendo dela parte do folclore local."
 spread_legend_3:0 "É meu objetivo ver [ROOT.Char.GetPromotedLegend.GetName] celebrado pelos que encontro, sua lenda crescendo a cada narração."
 the_with_space:0 "o "
 travel_destinations.1000.desc:0 "[location.Custom('GetTouristHoldingIntro')]\n\n[location.Custom('GetSpecialBuildingTouristDescriptor')]\n\n[location.Custom('GetTouristStartEventOutro')]"
 travel_destinations.1000.t:0 "As Vistas de [location.GetNameNoTooltip]"
 travel_start_event.1000.norwegian:0 "Ut på tur, aldri sur!"
 travel_start_event.1090.desc_activity_journey:0 "O caminho para [location.GetName] é longo, mas mal posso esperar para desenterrar os segredos de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] e dos [location.GetTitle.GetHolder.Custom('ComplimentAdjective')] [location.GetCulture.GetCollectiveNoun] [location.GetCounty.GetTitle.GetAdjective] que lá vivem! [ROOT.Char.Custom('IntentInitialEventDesc')]\n\nEu desejaria já estar lá, precisamos apressar!"
 travel_start_event.1090.desc_activity_roaming:0 "Finalmente, a estrada aberta está diante de mim! Em breve, pisarei na [location.Custom('TerrainTypeProvincePrefix')] [location.Custom('TerrainTypeProvince')] da bela [location.GetName].\n\nAh, como anseio por suas [location.Custom('GetProvinceFoliageDesc')] e pelas doces fragrâncias de [location.Custom('get_region_flower_type_plural')]. Ver [location.Custom('GetRandomRegionalWildDaytimeBirdProvince')]s voando pelos céus abertos acima de mim!\n\nJá devo ir!"
 travel_start_event.1090.desc_activity_survey:0 "É hora de tomar as rédeas da situação. Eu pessoalmente supervisionarei o funcionamento de [location.GetName], contarei cada [root_scope.Custom('RegionalFarmAnimal')], cada fortificação, cada espada e cada saco de grãos!\n\nMeu reino será o mais bem administrado de todos – vamos cavalgar!"
 travel_start_event.1090.t_activity_journey:0 "Expedição: Rumo a [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]!"
 travel_start_event.1090.t_activity_roaming:0 "$activity_roaming$: Na Estrada Novamente"
 travel_start_event.1090.t_activity_survey:0 "$activity_survey$: Supervisando as Terras"
