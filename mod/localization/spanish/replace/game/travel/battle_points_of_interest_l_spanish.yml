l_spanish:
 BattlePoIHistoricalDescAngkor:0 "#emp Vitorioso: [GetScriptedCharacterByHistoryID( 'cham_panduranga_04' ).GetFullName]\nDerrotado: [GetScriptedCharacterByHistoryID( 'khmer_tribhuvanaditya_01' ).GetFullName]\nData: 1177 d.C.#!\n#weak Um período de conflitos civis e golpes no reino de Kambuja resultou na ascensão de Tribhuvanaditya, um não-real, ao poder. Enquanto enfrentava rebeldes reais apoiando outros pretendentes, o reino de Champa invadiu Kambuja.\n\nAs forças de Champa avançaram pelo Mekong e Tonle Sap, saqueando a própria capital Angkor e matando Tribhuvanaditya.\n\nApós o cerco, o reino de Kambuja colapsou, com o saque espalhado pela região ou levado pelos Cham.#!"
 BattlePoIHistoricalDescAror:0 "#emp Vencedor: Muhammad ibn al-Qasim\nDerrotado: Raja Dahir\nData: 711 DC#!\n#weak Uma batalha na invasão umayyad da Índia, entre o Raja de Sindh e o Império Umayyad.\n\nEmbora seus oponentes fossem inicialmente uma força mais numerosa, o comandante umayyad conseguiu obter a melhor posição para seu exército antes de se comprometer para a batalha. Ao longo do conflito, esse desequilíbrio levou as forças muçulmanas a tomarem o controle do fluxo da batalha, e com a morte do Raja Dahir, a vitória foi garantida.#!"
 BattlePoIHistoricalDescBaekgang:0 "#emp Vitorioso: Reino de Silla & China Tang\nDerrotado: [GetScriptedCharacterByHistoryID( 'japanese_abe_36' ).GetFullName]\nData: 663 d.C.#!\n#weak Uma batalha naval decisiva onde Tang e Silla enfrentaram as forças do Movimento de Restauração de Baekje e seus aliados japoneses.\n\nA batalha foi travada principalmente no rio Baengma. Embora as forças japonesas fossem superiores em número, a marinha Tang manteve sua posição e eventualmente contra-atacou, cercando e derrotando a frota japonesa.\n\nA vitória decisiva de Silla–Tang obrigou o Japão a se retirar completamente dos assuntos coreanos e esmagou o Movimento de Restauração de Baekje.#!"
 BattlePoIHistoricalDescCanheSlope:0 "#emp Vitorioso: Touba Gui – Wei do Norte\nDerrotado: Murong Bao – Yan Posterior\nData: 395 d.C.#!\n#weak A batalha foi resultado de um conflito em que a dinastia Yan Posterior iniciou uma campanha punitiva contra a dinastia Wei do Norte.\n\nQuando as forças de Yan Posterior chegaram à encosta de Canhe, foram surpreendidas por uma tempestade durante a qual foram atacadas por seus inimigos. O exército de Yan Posterior foi pego de surpresa, e muitos soldados fugiram para dentro do rio Amarelo.\n\nA batalha acabou revertendo completamente o equilíbrio de poder, com os Wei do Norte assumindo a maioria dos territórios de Yan Posterior.#!"
 BattlePoIHistoricalDescCivitate:0 "#emp Vencedor: [GetScriptedCharacterByHistoryID( '1126' ).GetFullName]\nDerrotado: [GetScriptedCharacterByHistoryID( '1338' ).GetFullName]\nData: 18 de Junho, 1053 DC#!\n#weak Uma batalha entre os normandos de um lado e uma coalizão liderada pelo Papa do outro, incluindo alemães e italianos locais.\n\nApesar da vantagem numérica, a coalizão papal não conseguiu romper a infantaria normanda no centro da batalha, e suas cavalarias nas alas perderam a batalha contra a cavalaria normanda.\n\nPouco tempo depois da batalha, o Papa foi capturado pelos normandos, levando ao fim do conflito.#!"
 BattlePoIHistoricalDescDandanaqan:0 "#emp Vencedor: [GetScriptedCharacterByHistoryID( '3036' ).GetFullName]\nDerrotado: [GetScriptedCharacterByHistoryID( '144129' ).GetFullName]\nData: 23 de Maio, 1040 DC#!\n#weak Uma importante batalha entre o crescente poder seljúcida do norte da Pérsia e o Império Gaznévida. Após repelirem as forças seljúcidas em suas batalhas iniciais, as forças Gaznévida começaram a brigar pelas pilhagens deixadas para trás.\n\nDesorganizados e despreparados para a batalha, foram pegos de surpresa com o retorno das forças seljúcidas. Assolados, famintos e desmoralizados, as forças Gaznévida foram esmagadas por seus adversários.#!"
 BattlePoIHistoricalDescFeiRiver:0 "#emp Vitorioso: Xie An - Jin\nDerrotado: Fu Jian - Antigo Estado de Qin\nData: 383 d.C.#!\n#weak A batalha foi o ápice de uma longa campanha em que o antigo Estado de Qin, tendo unificado vários povos estrangeiros, tomou controle de partes significativas das terras de Jin. Os exércitos de Qin eram numericamente muito superiores aos de Jin, que decidiram resistir no Rio Fei.\n\nDurante a batalha, as tropas disciplinadas e bem treinadas de Jin derrotaram as forças muito mais numerosas, porém desorganizadas e desmotivadas, do tardio Estado de Qin.\n\nA vitória de Jin sobre as forças de Qin, sofrendo apenas baixas mínimas, mudou drasticamente o equilíbrio de poder e garantiu que a China do sul permanecesse independente por mais de 100 anos.#!"
 BattlePoIHistoricalDescGaoliang:0 "#emp Vitorioso: [GetScriptedCharacterByHistoryID( '194330' ).GetFullName]\nDerrotado: [GetScriptedCharacterByHistoryID( 'han_4801' ).GetFullName]\nData: 979 d.C.#!\n#weak A batalha ocorreu após uma tentativa da dinastia Song de recuperar as 16 prefeituras que a dinastia Liao havia conquistado em 960, sendo liderada pessoalmente pelo irmão do imperador (o futuro Imperador [GetScriptedCharacterByHistoryID( 'han_4801' ).GetFullNameNoTooltip]).\n\nA cidade de Youzhou permaneceu sitiada por 3 meses antes que reforços Liao chegassem para socorrer os defensores. Embora inicialmente vitorioso, o exército Song foi pego de surpresa durante a noite por um ataque vindo de 3 direções.\n\nA batalha terminou com [GetScriptedCharacterByHistoryID( 'han_4801' ).GetFullNameNoTooltip] fugindo do local em uma carroça puxada por um burro. Esta foi a primeira grande derrota dos Song após sua ascensão ao poder.#!"
 BattlePoIHistoricalDescGuandu:0 "#emp Vitorioso: Cao Cao\nDerrotado: Yuan Shao\nData: 200 d.C.#!\n#weak A Batalha de Guandu foi travada entre os senhores da guerra Cao Cao e Yuan Shao durante o final da dinastia Han Oriental. Ambos haviam alcançado grande poder e eram os principais rivais na disputa pelo controle da China.\n\nAs forças de Cao Cao estavam em menor número, mas usaram táticas como um ataque surpresa ao depósito de suprimentos de Yuan Shao, enfraquecendo gravemente o exército inimigo.\n\nA batalha foi um ponto de virada, com Cao Cao emergindo vitorioso e pavimentando o caminho para o futuro estado de Cao Wei no período dos Três Reinos.#!"
 BattlePoIHistoricalDescHastings:0 "#emp Vencedor: [GetScriptedCharacterByHistoryID( '140' ).GetFirstName] [GetScriptedCharacterByHistoryID( '140' ).GetDynastyName]\nDerrotado: [GetScriptedCharacterByHistoryID( '122' ).GetFullName]\nData: 14 de Outubro, 1066 DC#!\n#weak A Batalha de Hastings foi uma das batalhas chave para a ascensão de Guilherme ao poder na Inglaterra. Forçados a lutar na subida, o exército normando estava tendo dificuldades em avançar, e até começou a recuar em certo momento, mas Guilherme conseguiu reorganizar um contra-ataque contra as tropas inglesas.\n\nSobrecarregados pelas forças inimigas, Harold morreu juntamente com seus dois irmãos [GetScriptedCharacterByHistoryID( '132' ).GetFirstNameNoTooltip] e [GetScriptedCharacterByHistoryID( '130' ).GetFirstNameNoTooltip], deixando o trono inglês vazio.#!"
 BattlePoIHistoricalDescLechfeld:0 "#emp Vencedor: [GetScriptedCharacterByHistoryID( '1282' ).GetTitledFirstName]\nDerrotado: [GetScriptedCharacterByHistoryID( '460' ).GetFirstName] [GetScriptedCharacterByHistoryID( '460' ).GetDynastyName]\nData: 10 de Agosto, 955 DC#!\n#weak Uma batalha brutal entre as forças do rei saxão Otto e as forças da Hungria. Após perdas devastadoras de ambos os lados, os húngaros fugiram quando estavam prestes a ser cercados e viram a batalha se virar contra eles.\n\nApós o fim da batalha, muitos dos comandantes húngaros foram capturados e executados, e a ameaça contínua dos magyares à Europa Ocidental foi finalmente encerrada.#!"
 BattlePoIHistoricalDescManzikert:0 "#emp Vencedor: [GetScriptedCharacterByHistoryID( '3040' ).GetFirstName] [GetScriptedCharacterByHistoryID( '3040' ).GetDynastyName]\nDerrotado: [GetScriptedCharacterByHistoryID( '1734' ).GetFullName]\nData: 26 de Agosto, 1071 DC#!\n#weak Coroado Imperador do Império Bizantino em 1068, Romanos liderou uma campanha contra as incursões turcas na Anatólia. Após um sucesso limitado, ele tentou alcançar uma vitória decisiva em uma batalha contra Arp Arslan do Império Seljúcida perto de Manzikert.\n\nTraído por um de seus comandantes, que se retirou com uma grande seção de seu exército, Romanos acabou sendo capturado pelas tropas muçulmanas. Mais tarde, embora tenha sido libertado pelo inimigo, foi deposto, cegado, exilado e morreu por causa de suas feridas.#!"
 BattlePoIHistoricalDescMuye:0 "#emp Vitorioso: Rei Wu\nDerrotado: Imperador Zhou de Shang\nData: 1046 a.C.#!\n#weak A batalha de Muye foi travada entre o rebelde Rei Wu e o imperador Shang Zhou.\n\nAs forças de Wu estavam inicialmente em menor número, mas as tropas Shang — em grande parte escravos militares — mostraram-se pouco confiáveis e fugiram do campo de batalha. O resultado final foi uma vitória extremamente sangrenta para as forças rebeldes sob o comando de Wu.\n\nA batalha resultou na queda da dinastia Shang e na reivindicação do Mandato do Céu pelo Rei Wu, que fundou a nova dinastia Zhou.#!"
 BattlePoIHistoricalDescPalembang:0 "#emp Vitorioso: [GetScriptedCharacterByHistoryID( '189038' ).GetFullName]\nDerrotado: [GetScriptedCharacterByHistoryID( 'javanese_sailendra_25' ).GetFullName]\nData: 1025 d.C.#!\n#weak Um ataque repentino das forças Chola à capital Srivijaya em Palembang.\n\nAs forças Chola chegaram por mar e rapidamente subjugaram a capital de Srivijaya, saqueando-a e destruindo-a no processo.\n\nA queda de Palembang resultou no colapso total do Império Srivijaya, e a influência Chola sobre a região durou décadas.#!"
 BattlePoIHistoricalDescRedCliffs:0 "#emp Vitorioso: Sun Quan\nDerrotado: Cao Cao\nData: 208 d.C.#!\n#weak A Batalha dos Penhascos Vermelhos foi uma batalha fluvial travada entre uma coalizão de senhores da guerra e o senhor da guerra do norte, Cao Cao, durante o período próximo ao fim da dinastia Han. Cao Cao tentava estabelecer uma cabeça de ponte através do rio Yangtzé para penetrar no sul da China.\n\nSimulando uma rendição, as forças aliadas conseguiram atrair os navios de Cao Cao para uma armadilha, incendiando-os e queimando vivos muitos soldados e cavalos. O exército do norte então entrou em confusão e foi derrotado.\n\nA derrota impediu Cao Cao de avançar além do Yangtzé e preparou o cenário para os anos seguintes do período dos Três Reinos.#!"
 BattlePoIHistoricalDescSongping:0 "#emp Vitorioso: Yang Sijin\nDerrotado: Cai Xi\nData: 863 d.C.#!\n#weak Tumultos no protetorado Tang de Annan levaram o reino vizinho de Nanzhao a se aliar com tribos locais e invadir a região com uma força avassaladora.\n\nO exército de Nanzhao e seus aliados sitiaram a cidade por algum tempo antes de finalmente penetrar a cidade interna. Os defensores fizeram uma última resistência no portão leste, emboscando a cavalaria inimiga e matando muitos deles antes de serem derrotados.\n\nEmbora inicialmente bem-vindas pela população Viet, as forças de Nanzhao saquearam a região, e um contra-ataque Tang em 864 reconquistou toda a área.#!"
 BattlePoIHistoricalDescStamfordBridge:0 "#emp Vencedor: [GetScriptedCharacterByHistoryID( '122' ).GetFullName]\nDerrotado: [GetScriptedCharacterByHistoryID( '102531' ).GetNameNicknamed]\nData: 25 de Setembro, 1066 DC#!\n#weak A Batalha de Stamford Bridge foi uma das batalhas chave entre os três contendores pelo trono inglês: Guilherme da Normandia, Harald da Noruega e Harold da Inglaterra. Correndo para o norte com seus homens, Harold conseguiu surpreender as tropas norueguesas e forçá-las a lutar em uma batalha para a qual não estavam preparadas.\n\nHarald foi morto por uma flecha na traqueia, e seu aliado inglês [GetScriptedCharacterByHistoryID( '124' ).GetFirstNameNoTooltip], irmão de Harold, também foi abatido. O exército norueguês, sem seus comandantes, foi aniquilado após a batalha.#!"
 BattlePoIHistoricalDescSufuku:0 "#emp Vitorioso: Os Emishi de Isawa\nDerrotado: [GetScriptedCharacterByHistoryID( 'japanese_iruma_1' ).GetFullName]\nData: 789 d.C.#!\n#weak Uma batalha importante como parte da subjugação japonesa dos Emishi.\n\nAs forças japonesas inicialmente se dividiram em duas, avançando por ambos os lados do rio Kitakami após os Emishi em retirada. Escaramuçadores Emishi impediram que os japoneses cruzassem o rio, encurralando grande parte deles entre o rio e as montanhas.\n\nO colapso japonês que se seguiu foi uma grande vergonha, com muitos soldados nadando nus pelo rio para escapar da morte. O exército foi dissolvido e [GetScriptedCharacterByHistoryID( 'japanese_yamato_24' ).GetFullName] repreendeu severamente seus comandantes.#!"
 BattlePoIHistoricalDescSvolder:0 "#emp Vencedor: [GetScriptedCharacterByHistoryID( '101505' ).GetFullName]\nDerrotado: [GetScriptedCharacterByHistoryID( '144004' ).GetFullName]\nData: 9 de Setembro, 999 DC#!\n#weak Uma batalha entre as forças norueguesas de Olafr Tryggvason de um lado, e uma coalizão de forças dinamarquesas e suecas lideradas pelo rei Sveinn da Dinamarca do outro.\n\nEmbora amplamente em menor número, o rei norueguês se recusou a fugir da coalizão hostil e enfrentou os suecos e dinamarqueses em batalha, chamando-os de 'comedores de cavalos' e 'bodes de floresta'.\n\nNo final, embora tenha desferido um golpe pesado no inimigo, o exército norueguês foi esmagado. Olafr desapareceu na batalha, e provavelmente faleceu.#!"
 BattlePoIHistoricalDescTalas:0 "#emp Vencedor: Califado Abássida\nDerrotado: Dinastia Tang\nData: 751 DC#!\n#weak Um conflito prolongado entre o Califado Abássida, que expandia para a Transoxiana a partir do sudoeste, e a Dinastia Tang, que expandia para a região a partir do leste.\n\nOriginalmente, a infantaria pesada da dinastia Tang e seus mercenários turcos desempenharam um papel importante em repelir as forças abássidas, mas com a mudança de lado dos mercenários e a traição de muitos de seus aliados, os Tang foram forçados a recuar.\n\nEsse conflito marcou o fim da expansão ocidental da Dinastia Tang e a Transoxiana passou a estar sob controle muçulmano por tempo indeterminado.#!"
 BattlePoIHistoricalDescTours:0 "#emp Vencedor: [GetScriptedCharacterByHistoryID( '131721' ).GetFirstNameNicknamed]\nDerrotado: Abd al-Rahman al-Ghafiqi\nData: 10 de Outubro, 732 DC#!\n#weak A batalha onde Karl, o Martelo, repeliu a invasão umayyad da França, nos rios Clain e Vienne. Diz-se que os homens de Karl eram tão imutáveis quanto uma parede, cortando a cavaleiros pesados umayyads que avançavam. Após rastrear o comandante inimigo e matá-lo, os adversários fugiram do campo de batalha.#!"
 BattlePoIHistoricalDescXiangji:0 "#emp Vitorioso: [GetScriptedCharacterByHistoryID( 'han_1528' ).GetFullName]\nDerrotado: [GetScriptedCharacterByHistoryID( 'an_qingxu' ).GetFullName]\nData: 757 d.C.#!\n#weak Esta batalha foi o auge de um contra-ataque Tang contra forças rebeldes que haviam tomado grande parte do norte da China e foi uma das mais sangrentas da Rebelião de An Lushan. Os dois enormes exércitos se enfrentaram ao norte de Chang'an, próximo ao Templo Xiangji.\n\nAo meio-dia, o exército Tang havia tomado a vantagem do terreno alto, enquanto o exército Yan estava posicionado diante da própria Chang'an. Após várias manobras, a batalha chegou a um impasse prolongado, com tropas disciplinadas lutando sem recuar até que a linha Yan finalmente colapsou devido às perdas massivas.\n\nA brutalidade da batalha deixou ambos os exércitos dizimados, mas quebrou o ímpeto da rebelião. As forças Tang conseguiram retomar Chang'an no dia seguinte.#!"
 BattlePoIHistoricalDescYarmuk:0 "#emp Vencedor: [GetScriptedCharacterByHistoryID( '163015' ).GetFullName]\nDerrotado: [GetScriptedCharacterByHistoryID( '145071' ).GetFullName]\nData: 20 de Agosto, 636 DC#!\n#weak A Batalha de Yarmuk é uma das batalhas mais importantes da história bizantina. Uma derrota decisiva levou à perda da Síria e do Egito pelos bizantinos, e à grande expansão do império árabe.\n\nCom duração de 6 dias, o fluxo da batalha inicialmente virou-se contra os invasores muçulmanos, mas ao amanhecer do quinto dia, eles mudaram de uma estratégia defensiva para ofensiva. No sexto dia, eles comprometeram sua cavalaria em um ataque ousado que quebrou o exército bizantino.\n\nCom a moral destruída, os soldados bizantinos caíram em ravinas, se afogaram ou foram esmagados pelos soldados inimigos enquanto fugiam do campo de batalha.#!"
 BattlePoIHistoricalDescYiling:0 "#emp Vitorioso: Lu Xun – Wu Oriental\nDerrotado: Liu Bei – Shu Han\nData: 221 d.C.#!\n#weak Tentando retomar territórios perdidos na província de Jing, Liu Bei liderou pessoalmente suas tropas para atacar Wu Oriental, obtendo sucesso inicial.\n\nDurante a batalha, as forças de Liu Bei foram atraídas para uma armadilha pelo general Lu Xun, que incendiou o acampamento de Shu Han, forçando Liu Bei a recuar. Liu Bei conseguiu escapar ordenando a seus homens que incendiassem suas armaduras, criando uma barreira de fogo contra os perseguidores.\n\nA batalha foi uma derrota decisiva para Liu Bei, encerrando sua campanha e sendo seguida por sua própria morte.#!"
