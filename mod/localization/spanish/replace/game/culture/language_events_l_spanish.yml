l_spanish:
 language_events.0001.a:0 "Deixe-o desaparecer no esquecimento..."
 language_events.0001.b:0 "Não! Eu devo trabalhar mais duro e estudar mais!"
 language_events.0001.desc:0 "É difícil manter todas essas línguas na minha cabeça, eu continuo esquecendo qual idioma estou falando!\n\nApenas outro dia, eu acidentalmente me apresentei usando uma mistura confusa de palavras em [language_to_forget.GetLanguage.GetNameNoTooltip] e [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]... e eu nem percebi que tinha feito isso até que alguém me apontou!\n\nTalvez eu devesse deixar [language_to_forget.GetLanguage.GetNameNoTooltip] desaparecer da minha mente..?"
 language_events.0001.t:0 "Letargia Lexical"
 language_events.0002.a:0 "\"Com maior compreensão vem a prosperidade compartilhada!\""
 language_events.0002.b.tt:0 "Você envia coletores para 'impostar' [gold_i]#P 50#! de cada condado de [vassal_speaking_other_language.GetCulture.GetName] no reino de [vassal_speaking_other_language.GetTitledFirstNamePossessive]"
 language_events.0002.b:0 "\"Oh-ho ho! Agora posso tributar você com mais eficácia, caro vassalo.\""
 language_events.0002.desc:0 "Chegou aos meus ouvidos que meu vassalo, [vassal_speaking_other_language.GetTitledFirstName], está elogiando publicamente minha proficiência em falar [vassal_speaking_other_language.GetCulture.GetLanguage.GetName] - o idioma falado por seus próprios súditos!\n\nMeus conselheiros sugerem que eu aproveite essa oportunidade enviando uma carta em [vassal_speaking_other_language.GetCulture.GetLanguage.GetNameNoTooltip] para [vassal_speaking_other_language.GetSheHe], reconhecendo as suas ações."
 language_events.0002.t:0 "Uma Língua em Comum"
 language_events.0010.a:0 "Isso não pode continuar."
 language_events.0010.b:0 "Continuarei a me esforçar diariamente!"
 language_events.0010.desc:0 "Eu acordo suando depois de um pesadelo extenuante, onde uma coruja estava constantemente me seguindo e testando meu conhecimento na língua [language_to_forget.GetLanguage.GetNameNoTooltip].\n\nUm símbolo de sabedoria em algumas culturas, a ave emplumada estava me perseguindo a noite toda, e eu temia decepcioná-la. Talvez haja algo como \"conhecimento em excesso\" e este sonho seja resultado de todo o estresse que sinto em manter minhas habilidades afiadas."
 language_events.0010.t:0 "É Hora da sua Lição de [language_to_forget.GetLanguage.GetNameNoTooltip|U]!"
