 recruit_winter_specialist_decision_desc:0 "Meu povo resistente, os [ROOT.Char.GetCulture.GetCollectiveNoun], são mestres do frio. Caso eu precise de um comandante especialista para guiar minhas tropas pelo inverno implacável, basta enviar um recado - não falta veteranos congelados dispostos a atender ao meu chamado."
