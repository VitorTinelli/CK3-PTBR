 recruit_forest_specialist_decision_desc:0 "Os [ROOT.Char.GetCulture.GetCollectiveNoun] consideram a floresta como sua segunda casa. Ela oferece proteção, abrigo e lenha para o fogo. Se eu precisar de alguém para guiar minhas tropas por florestas profundas e traiçoeiras, não faltam caçadores dispostos a atender ao chamado."
