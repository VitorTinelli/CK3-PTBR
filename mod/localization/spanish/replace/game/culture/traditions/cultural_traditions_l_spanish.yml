 culture_parameter_windmills_hill_farms_unlock:0 "A [building|E] #V $building_hill_farms_04$#! desbloqueia os primeiros quatro níveis da linha de [buildings|E] #V $building_type_windmills_01$#!"
 culture_parameter_winter_soldier_trait_more_common:0 "O [commander_trait|E] [GetTrait('winter_soldier').GetName( GetNullCharacter )] é mais comum"
