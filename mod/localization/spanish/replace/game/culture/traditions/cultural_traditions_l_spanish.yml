 culture_emergence_events.0001.a:0 "Se eles agem como eu, então eu agirei como eles. Logo seremos como um só."
 culture_emergence_events.0001.b:0 "A admiração deles é suficiente!"
 culture_emergence_events.0001.desc:0 "Eu sou [ROOT.Char.GetCulture.GetName], mas as pessoas da minha capital, o [capital_county_scope.GetBaseName], são da cultura [hybdridization_offer_culture.GetName]. Ultimamente, tenho visto meus súditos [hybdridization_offer_culture.GetNameNoTooltip] me imitando e adotando os costumes da minha cultura [ROOT.Char.GetCulture.GetNameNoTooltip].\n\nEles estão mesclando nossas tradições. Algumas são antigas, outras são novas, mas o mais importante é que eles estão mais aceitando do meu governo!\n\nTalvez esse desenvolvimento deva ser incentivado?"
 culture_emergence_events.0001.existing_hybrid:0 "Você e suas terras adotarão a [culture|E] [existing_hybrid_culture.GetName]"
 culture_emergence_events.0001.new_hybrid:0 "Você e suas terras adotarão uma [hybrid_culture|E] recém-surgida"
 culture_emergence_events.0001.t:0 "Intercâmbio Cultural"
 culture_emergence_events.0002.a:0 "Vamos construir uma identidade nova e mais forte!"
 culture_emergence_events.0002.b:0 "Somos [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] e nada mais! Alinhem-se!"
 culture_emergence_events.0002.desc:0 "Meu povo, os [ROOT.Char.GetCulture.GetCollectiveNoun], são um povo orgulhoso e disperso.\n\nNo entanto, por mais semelhantes que sejamos, não posso negar que meus súditos começaram a agir de maneira diferente dos [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] em outros lugares. Às vezes, há até conflito entre grupos de [ROOT.Char.GetCulture.GetNameNoTooltip] visitantes e aqueles sob meu governo.\n\nEstamos desenvolvendo uma nova identidade, somos [ROOT.Char.GetCulture.GetNameNoTooltip] - mas ao mesmo tempo não somos. Talvez esse desenvolvimento deva ser incentivado?"
