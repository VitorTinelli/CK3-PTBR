 recruit_jungle_specialist_decision:0 "Recrutar Especialista em Selvas"
 recruit_jungle_specialist_decision_confirm:0 "$invite_knights_decision_confirm$"
 recruit_jungle_specialist_decision_desc:0 "A selva é um lugar duro e traiçoeiro para viajar, mas meu povo, os [ROOT.Char.GetCulture.GetCollectiveNoun], dominou a arte de atravessá-la. Exploradores e guias experientes estão prontos para levar minhas forças por esse terreno exuberante, porém mortal."
 recruit_jungle_specialist_decision_tooltip:0 "$recruit_jungle_specialist_decision.tt$"
