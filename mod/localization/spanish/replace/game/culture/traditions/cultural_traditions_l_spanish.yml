 culture_tradition_events.0002.a:0 "Um bom combate!"
 culture_tradition_events.0002.b:0 "Eu posso ter perdido, mas foi um bom treinamento!"
 culture_tradition_events.0002.desc:0 "Eu baixo minha arma e me volto para [Select_CString( recipient.IsFemale, 'a', 'o' )] [recipient.GetTitledFirstName], aplaudindo [recipient.GetSheHe] como é costume. [recipient.GetSheHe|U] faz o mesmo.\n\n"
 culture_tradition_events.0002.desc_actor_victor_bad:0 "\"Bem lutado, meu [actor.GetTitleTierName|U], estou completamente derrotado.\" [recipient.GetFirstNameNoTooltip] murmura.\n\"Mas lembre-se, não deixe essa vitória subir à sua cabeça. Eu não sou seu inimigo, eles ainda estão lá fora.\"\n\nBah! Eu estou muito bem!"
 culture_tradition_events.0002.desc_actor_victor_good:0 "\"Bem lutado, meu [actor.GetTitleTierName|U]! Você me venceu de forma justa e honesta.\" [recipient.GetFirstNameNoTooltip] diz.\n\"Essa prática certamente nos servirá bem, caso haja guerra no futuro do [actor.GetPrimaryTitle.GetNameNoTierNoTooltip].\"\n\nIsso foi revigorante, me sinto em forma e pronto!"
 culture_tradition_events.0002.desc_recipient_victor_bad:0 "\"Bem lutado, meu [actor.GetTitleTierName|U]. Desculpe se causei algum mal. Por um breve momento, eu estava em transe — eu e minha arma éramos um só...\" [recipient.GetFirstNameNoTooltip] diz, pedindo desculpas.\n\"Talvez você precise descansar um pouco?\"\n\nBobagem, estou em plena forma!"
 culture_tradition_events.0002.desc_recipient_victor_good:0 "\"Bem lutado, meu [actor.GetTitleTierName|U], eu venço desta vez!\" [recipient.GetFirstNameNoTooltip] diz com um tom esportivo. \"Agora estamos prontos para enfrentar qualquer coisa!\"\n\nCertamente estamos, talvez eu deva considerar minha próxima conquista?"
 culture_tradition_events.0002.t:0 "Lutar com [GetPlayer.Custom( 'KnightCultureNoTooltip' )]: Conclusão"
 culture_tradition_events.0100.a:0 "Devemos manter a doutrina [faith_scope.GetAdjectiveNoTooltip]."
 culture_tradition_events.0100.b:0 "Os costumes do meu povo são mais importantes!"
 culture_tradition_events.0100.desc:0 "Uma mensagem d[Select_CString( head_of_faith.IsFemale, 'a', 'o' )] [head_of_faith.GetTitledFirstName] chegou. Começa com cortesias e destaca a importância que tenho aos olhos do povo [culture_scope.GetName].\n\n"
 culture_tradition_events.0100.end:0 "\n\nUm dilema, de fato... O que valorizo mais? Os costumes do meu povo ou as doutrinas de nossa fé?"
 culture_tradition_events.0100.t:0 "Um Conflito entre Cultura e Fé"
 culture_tradition_events.0100.tradition_concubines:0 "\"Sua prática do concubinato não é apoiada pela doutrina [faith_scope.GetAdjective], apenas através do casamento adequado [faith_scope.HighGodName] sorrirá para seu povo! Só desejo sua salvação. Abandone suas concubinas, pelo bem de todos nós.\" lê-se na mensagem."
 culture_tradition_events.0100.tradition_monogamous:0 "\"Você deve entender que enquanto seu povo pratica a monogamia, você está violando a doutrina [faith_scope.GetAdjective]! Só desejo sua salvação. O dever de todo bom [faith_scope.GetAdjectiveNoTooltip] não pode ser cumprido com apenas um cônjuge.\" lê-se na mensagem."
 culture_tradition_events.0100.tradition_polygamous:0 "\"Sua prática da poligamia está em estrita oposição à doutrina [faith_scope.GetAdjective] e é um pecado aos olhos de [faith_scope.HighGodName]! Só desejo sua salvação. Por favor, guie seu povo para a luz e abandone os excessos de cônjuges!\" lê-se na mensagem."
 culture_tradition_events.0101.a.tt:0 "Todas as [children|E] disponíveis na [court|E] recebem um impulso em sua [education|E] contínua"
 culture_tradition_events.0101.a:0 "Claro, nobre [mendicant_mystic.GetFaith.PriestNeuter]. Por favor, largue o bastão de bater."
 culture_tradition_events.0101.b.tt.failure:0 "O místico deixa sua corte com nojo"
 culture_tradition_events.0101.b.tt.success:0 "Você contesta o místico"
 culture_tradition_events.0101.b:0 "Isso não é um pouco demais para o trabalho de [mendicant_mystic.GetFaith.HighGodName]?"
 culture_tradition_events.0101.c:0 "Saia daqui, mendigo, estou tentando jantar!"
 culture_tradition_events.0101.desc:0 "É raro eu ter a chance de fazer uma refeição tranquila sem bajuladores ou assuntos de Estado interrompendo, mas esta noite consegui. Um jantar tranquilo e a oportunidade de descansar meus músculos sociais.\n\nEm questão de segundos, a porta é arrebentada de suas dobradiças com uma inevitabilidade trágica, e um [mendicant_mystic.GetFaith.PriestNeuter] irrompe na sala. [mendicant_mystic.GetSheHe|U] carrega um bastão envelhecido, ainda coberto de estilhaços do arrombamento da porta em um único golpe.\n\n\"Nobre [ROOT.Char.GetTitleAsNameNoTooltip], estou aqui com uma oferta! Por uma pequena contribuição, eu, #EMP [mendicant_mystic.GetFirstName]#!, compartilharei o conhecimento dos antigos caminhos do nosso povo com as crianças da sua corte!\""
 culture_tradition_events.0101.t:0 "A Mente de um Místico"
 culture_tradition_events.0111.a.tt.failure:0 "Você tropeça nas suas palavras"
 culture_tradition_events.0111.a.tt.success:0 "Você desmonta o argumento do místico"
 culture_tradition_events.0111.a:0 "Palavras tão inspiradoras!"
 culture_tradition_events.0111.b:0 "Você já disse o que tinha a dizer, agora deixe-me dizer o meu..."
 culture_tradition_events.0111.c:0 "Quem deixou esse vagabundo entrar na minha casa? Guardas! SOCORRO!"
 culture_tradition_events.0111.desc:0 "\"... é por isso que devemos nos submeter à benevolência de [mendicant_mystic.GetFaith.HighGodName] a cada momento de cada dia de nossas vidas. Você entende? Devo continuar?\"\n\nDuas. Longas. Horas.\n\nEu nem sei como [mendicant_mystic.GetName] encontrou seu caminho até meus aposentos, mas o [mendicant_mystic.GetFaith.PriestNeuter] tem me dado palestras sobre os pontos mais finos da teologia do [mendicant_mystic.GetFaith.GetName] por #EMP duas. Longas. Horas.#!\n\nFinalmente, [Select_CString( mendicant_mystic.IsFemale, 'a', 'o' )] [mendicant_mystic.GetWomanMan] fica em silêncio, olhando para mim em busca de uma resposta. Sinto meu olho começar a tremer."
 culture_tradition_events.0111.t:0 "Discurso de um Místico"
 culture_tradition_events.0121.a:0 "Certamente posso aproveitar um[Select_CString( mendicant_mystic.IsFemale, 'a', '' )] [mendicant_mystic.GetWomanMan] de seus talentos..."
 culture_tradition_events.0121.b:0 "Um [mendicant_mystic.GetFaith.PriestNeuter] leal, você diz..."
 culture_tradition_events.0121.c:0 "Com essa aparência, #EMP esse cheiro#!, e você quer morar aqui?"
 culture_tradition_events.0121.desc:0 "Quase de forma incomum para sua profissão, [mendicant_mystic.GetFirstName] esperou pacientemente em uma antessala até que eu pudesse lhe dar uma audiência.\n\nO [mendicant_mystic.GetFaith.PriestNeuter] parece nervoso quando eu entro, mas começa um discurso apressado assim que eu chego.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], tenho sido um mendicante por algum tempo agora, e embora seja o trabalho de [mendicant_mystic.GetFaith.HighGodName], é tão desgastante para a mente e o corpo quanto é nutridor para a alma.\"\n\n\"Se me permitir, eu pendurarei meu bastão de andarilho e servirei à corte da melhor maneira possível. V-você me acolheria?\""
 culture_tradition_events.0121.t:0 "O Serviço de um Místico"
 culture_tradition_events.0131.a.tt.failure:0 "[Select_CString( mendicant_mystic.IsFemale, 'A', 'O' )] místic[Select_CString( mendicant_mystic.IsFemale, 'a', 'o' )] mostra que você é um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] tol[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]"
 culture_tradition_events.0131.a.tt.success:0 "Você prova que [Select_CString( mendicant_mystic.IsFemale, 'a', 'o' )] místic[Select_CString( mendicant_mystic.IsFemale, 'a', 'o' )] é um[Select_CString( mendicant_mystic.IsFemale, 'a', '' )] complet[Select_CString( mendicant_mystic.IsFemale, 'a', 'o' )] hipócrita"
 culture_tradition_events.0131.a:0 "#EMP Meus#! pecados? Vamos falar sobre #EMP você#!."
 culture_tradition_events.0131.b.tt.failure:0 "Você é dominad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por angústia mental"
 culture_tradition_events.0131.b.tt.success:0 "[Select_CString( mendicant_mystic.IsFemale, 'A', 'O' )] místic[Select_CString( mendicant_mystic.IsFemale, 'a', 'o' )] ajuda você a superar suas falhas"
 culture_tradition_events.0131.b:0 "Você... você vai me ensinar a ser melhor?"
 culture_tradition_events.0131.c:0 "#EMP Se contorcendo na sujeira?#! Jogue esse lunático no poço de esterco mais próximo!"
 culture_tradition_events.0131.desc:0 "\"[ROOT.Char.GetTitleAsNameNoTooltip]? Você é apenas um verme, #EMP se contorcendo na sujeira#! da sua própria corrupção! Arrependa-se de seus pecados diante de [mendicant_mystic.GetFaith.HighGodName]! [mendicant_mystic.GetFaith.HighGodName], o Poderoso! [mendicant_mystic.GetFaith.HighGodName], o Inabalável! [mendicant_mystic.GetFaith.HighGodName], o Inatingível!\"\n\nMaldito e amaldiçoado seja esse irritante [mendicant_mystic.GetFaith.PriestNeuter]. Já era ruim o suficiente quando [mendicant_mystic.GetSheHe] estava na esquina da rua! Se eu #EMP descobrir#! quem deixou [Select_CString( mendicant_mystic.IsFemale, 'a', 'o' )] [mendicant_mystic.GetFirstName] entrar na minha #EMP casa#!, arrancarei seus olhos; [mendicant_mystic.GetSheHe] mal está aqui há dez minutos e já estou com uma dor de cabeça lancinante.\n\nNão posso suportar mais o discurso do mendicante, tenho que agir rapidamente enquanto há uma pausa natural na sua diatribe."
 culture_tradition_events.0131.t:0 "A Ira de um Místico"
 culture_tradition_events.0141.a:0 "Acho suas palavras persuasivas, [mendicant_mystic.GetFaith.PriestNeuter]."
 culture_tradition_events.0141.b.tt.failure:0 "Vocês permanecem em desacordo"
 culture_tradition_events.0141.b.tt.success:0 "Você ilumina [Select_CString( mendicant_mystic.IsFemale, 'a', 'o' )] [mendicant_mystic.GetFirstNameNoTooltip]"
 culture_tradition_events.0141.b:0 "Permita-me elucidar os méritos das crenças do [ROOT.Char.GetFaith.GetNameNoTooltip]..."
 culture_tradition_events.0141.c:0 "Seu [mendicant_mystic.GetFaith.HighGodName]! Quantas milícias [mendicant_mystic.GetFaith.HighGodNameSheHe|U] tem?"
 culture_tradition_events.0141.desc:0 "\"Você não vê, [ROOT.Char.Custom('FormOfAddressForLiege')], como você arrisca sua alma com essa... ideia do [ROOT.Char.GetFaith.GetName]? Permita-me trazer você para a luz da verdadeira crença [mendicant_mystic.GetFaith.GetAdjective] e resgatá-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] da miséria eterna!\"\n\nComo um[Select_CString( mendicant_mystic.IsFemale, 'a', '' )] mendicante [mendicant_mystic.GetFaith.PriestNeuter], [mendicant_mystic.GetFirstName] está acostumad[Select_CString( mendicant_mystic.IsFemale, 'a', 'o' )] a pregar para os incrédulos do povo [ROOT.Char.GetCulture.GetName], mas técnicas que funcionam com os camponeses nem sempre são eficazes com a nobreza.\n\nO silêncio cai entre nós, e me encontro olhando profundamente nos olhos d[Select_CString( mendicant_mystic.IsFemale, 'a', 'o' )] [mendicant_mystic.GetWomanMan], observando as luzes da esperança e da fome dançarem e cintilarem por trás deles."
 culture_tradition_events.0141.t:0 "Um Pacto d[Select_CString( mendicant_mystic.IsFemale, 'a', 'o' )] Místic[Select_CString( mendicant_mystic.IsFemale, 'a', 'o' )]"
 culture_tradition_events.3000.a:0 "Devo preparar minha lança..."
 culture_tradition_events.3000.desc:0 "Caçadores em [bear_sighting.GetName] avistaram um [bear_sighting_county.Custom('GetAnimalGroup')] de [bear_sighting_county.Custom('GetAnimalPlural')] vagando pelos [bear_sighting.Custom('GetTerrainTypePlural')] — pegadas largas na lama, árvores marcadas com garras, arbustos quebrados.\n\nSe eu fosse [GetActivityType('activity_hunt').GetName|l] e matar ou capturar um, os espíritos certamente notariam."
 culture_tradition_events.3000.t:0 "Avistamento de Urso"
 culture_tradition_events.3100.a:0 "Vamos festejar!"
 culture_tradition_events.3100.b:0 "Nossos inimigos cairão!"
 culture_tradition_events.3100.c:0 "Obedeça, pois o espírito do urso está ao meu lado."
 culture_tradition_events.3100.desc:0 "Amarramos o grande urso em silêncio. Os caçadores cantam baixo, vozes firmes, fumaça subindo com o aroma de abeto.\n\nEu ajoelho, encosto minha testa em seu focinho e sussurro meus agradecimentos antes que a lâmina caia. Compartilharemos sua carne, para que sua força possa viver entre nós."
 culture_tradition_events.3100.t:0 "Sacrifício de Urso"
