 recruit_mountain_specialist_decision:0 "Recrutar Especialista em Montanhas"
 recruit_mountain_specialist_decision_confirm:0 "$invite_knights_decision_confirm$"
 recruit_mountain_specialist_decision_desc:0 "Meu povo resistente, os [ROOT.Char.GetCulture.GetCollectiveNoun], conseguem navegar pelos desfiladeiros de montanhas mais traiçoeiros. Se eu quiser mover e lutar nas montanhas, posso contar com um guia experiente para ajudar meu exército a encontrar o caminho."
