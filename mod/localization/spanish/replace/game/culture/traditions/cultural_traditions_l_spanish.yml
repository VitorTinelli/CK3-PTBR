 mpo_siberian_permafrost_modifier_desc:0 "Solo congelado por milênios, sem acesso a água subterrânea, vegetação escassa. O terreno muda a cada ano devido ao derretimento e recongelamento repetidos. Para tornar estas terras suas, os habitantes precisam de séculos para se adaptar. Todos os outros, tudo o mais, perecerá e se juntará aos antigos mortos sob o gelo.\n\n#weak Este modificador pode ser removido ou pela [interaction|E] #V $feudalize_holding_interaction$#! ou #V $demand_admin_interaction$#! ou após conquistar todo o Norte com a [decision|E] #V $expand_the_steppe_decision_generic$#! para a região #V $dlc_mpo_steppe_siberia_further_expansion_tooltip$#!\n\n"
