 recruit_hill_specialist_decision:0 "Recrutar Especialista em Colinas"
 recruit_hill_specialist_decision_confirm:0 "$invite_knights_decision_confirm$"
 recruit_hill_specialist_decision_desc:0 "Os [ROOT.Char.GetCulture.GetCollectiveNoun] se sentem em casa nas colinas e vales, onde cuidam de seus rebanhos e afastam facilmente os animais selvagens. Não faltam pastores habilidosos que se sairiam bem guiando um exército."
