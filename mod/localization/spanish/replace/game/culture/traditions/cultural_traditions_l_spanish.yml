 elephant_pens_percentage_desc:0 "A [culture|E] não possui #V 3#! [counties|E] com a [building|E] #V $building_elephant_pens_02$#!"
 equal_law_culture_faith_or_innovation_trigger:0 "Sua [faith|E] não possui a [doctrines|E] [GetFaithDoctrine('doctrine_gender_equal').GetBaseName] e sua [culture|E] não possui uma [culture_tradition|E] que permite a [GetLaw('equal_law').GetName]."
 ethos_bellicose_desc:0 "Esta cultura considera o conflito e a violência como estados necessários da existência; incutida em seu povo está a ideia de que se deve defender e lutar por si mesmo."
 ethos_bellicose_name:0 "Belicoso"
 ethos_bureaucratic_desc:0 "Nenhuma cultura dura mais do que o seu registro mais antigo, e esta cultura acredita em uma contabilidade tão meticulosa a ponto de garantir a imortalidade."
 ethos_bureaucratic_name:0 "Burocrático"
 ethos_communal_desc:0 "Esta cultura valoriza os laços da comunidade acima de tudo, promovendo grande lealdade e dedicação ao trabalhar juntos em prol de objetivos comuns."
 ethos_communal_herders_bonus_effects:0 "[herders|E] têm um aumento em $MOD_MONTHLY_COUNTY_FERTILITY_GROWTH$"
 ethos_communal_name:0 "Comunal"
 ethos_courtly_desc_nhc:0 "A cerimônia da vida cortesã é tão essencial para esta cultura que ela faz parte integrante do comportamento social das pessoas. Um lugar para todos, e todos em seu lugar."
 ethos_courtly_name:0 "Cerimonioso"
 ethos_egalitarian_desc:0 "A intolerância e o isolacionismo podem ser o caminho para outros, mas esta cultura reconhece que aceitar as diferenças é muito melhor do que aniquilá-las."
 ethos_egalitarian_name:0 "Igualitarismo"
 ethos_spiritual_better_consult_the_skies_effects:0 "A [decision|E] $mpo_divination_decision$ tem efeitos adicionais"
 ethos_spiritual_better_court_astrologers_effects:0 "[characters|E] desta [culture|E] possuem maior [aptitude|E] para a posição de $court_astrologer_court_position$"
 ethos_spiritual_desc:0 "Enquanto algumas culturas recorrem à guerra e outras ao conhecimento mundano, esta cultura deposita sua confiança na única constante ao longo de sua história - o divino. A espiritualidade é o único caminho a seguir em um mundo duro e indiferente."
 ethos_spiritual_name:0 "Espiritual"
 ethos_stoic_desc:0 "Esta cultura acredita em manter-se forte como uma montanha, enfrentando todas as dificuldades que a vida possa lançar sobre eles e suportando todas com determinação e espírito indomável."
 ethos_stoic_name:0 "Estóico"
