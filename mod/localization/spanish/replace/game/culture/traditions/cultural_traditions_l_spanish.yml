 temple_next_level_name:0 "#V $tradition_fervent_temple_builders_name$#!"
 tenet_takamin_desc:0 "Acreditando nos ursos como manifestações dos deuses, a santidade desses animais deve ser respeitada, e a matança de um durante caçadas deve ser feita com o máximo respeito."
 tenet_takamin_name:0 "Takamin"
 tgp_nepotism_bypass_exams_modifier:0 "Isento de Exame"
 tgp_nepotism_bypass_exams_modifier_desc:0 "Este personagem contornou o exame típico necessário para se tornar um oficial através da influência de um parente próximo."
 three_gender_rulers_desc:0 "A [culture|E] não possui pelo menos #V 3#! [rulers|E] mulheres e pelo menos #V 3#! [rulers|E] homens"
 three_witch_rulers_desc:0 "A [culture|E] não possui pelo menos #V 3#! [rulers|E] com o [trait|E] [GetTrait('witch').GetName( GetNullCharacter )]"
 tradition_adaptive_skirmishing_desc:0 "Esta cultura sabe como usar efetivamente esquadrões de combate em qualquer ambiente."
 tradition_adaptive_skirmishing_name:0 "Esquadrões Adaptáveis"
 tradition_african_tolerance_desc:0 "Embora alguns possam considerá-la como fraqueza, um reino fundado na compreensão e tolerância é um reino construído sobre bases sólidas."
 tradition_african_tolerance_name:0 "Tolerância Africana"
 tradition_agrarian_desc:0 "Esta cultura é distintamente agrícola, suas terras produzindo colheitas abundantes para exércitos famintos. Embora não ter que lutar pela comida signifique muitos camponeses para o recrutamento, também significa que cada soldado não é tão motivado como aqueles de regiões mais árduas."
 tradition_agrarian_name:0 "Agrícola"
 tradition_alpine_supremacy_desc:0 "O povo desta cultura adaptou-se a viver em regiões montanhosas, e seu conhecimento e expertise em climas alpinos são incomparáveis."
 tradition_alpine_supremacy_name:0 "Supremacia Alpina"
 tradition_amharic_highlanders_desc:0 "As terras altas amáricas são bastante adequadas para a agricultura, desde que se saiba como abordar melhor o assunto. Por várias gerações, esse povo tem trabalhado e vivido nesse ambiente, prosperando enquanto desenvolve suas próprias tradições e costumes."
 tradition_amharic_highlanders_name:0 "Montanheses Amáricos"
 tradition_ancient_miners_desc:0 "Esta cultura sempre esteve cercada por matérias-primas, minério e gemas brutas. Eles têm uma afinidade para encontrar locais para escavações de mineração."
 tradition_ancient_miners_name:0 "Mineradores Antigos"
 tradition_artisans_desc:0 "As crianças desta cultura frequentemente seguem a profissão de seus pais, acumulando conhecimento e habilidade extensos para o seu ofício ao longo das gerações."
 tradition_artisans_name:0 "Artesãos Especialistas"
 tradition_astute_diplomats_desc:0 "É uma ideia comum nesta cultura que a expressão mais pura de superioridade é a capacidade de subjugar seu inimigo sem lutar contra ele."
 tradition_astute_diplomats_name:0 "Diplomatas Astutos"
 tradition_battlefield_looters_desc:0 "Nesta cultura, as batalhas não são travadas por prestígio, mas por lucro. Quem se importa com o status se você não pode pagar pela guerra?"
 tradition_battlefield_looters_name:0 "Saqueadores de Campo de Batalha"
 tradition_brewery_desc:0 "Esta cultura vê a fabricação e o consumo de álcool como desempenhando um papel importante tanto nas festividades quanto na vida diária."
 tradition_brewery_name:0 "Cultura da Cervejaria"
 tradition_by_the_sword_desc:0 "Os membros desta cultura acreditam que o melhor missionário é aquele que carrega uma espada. Embora o apoio às guerras santas seja generalizado, os motivos são analisados para garantir que os poderes Divinos aprovem."
 tradition_by_the_sword_name:0 "Pela Espada"
 tradition_byzantine_succession_desc:0 "Esta cultura está intimamente associada às tradições imperiais do Império Romano Oriental e seu legado na forma de um código complexo e intrincado de conduta cortesã."
 tradition_byzantine_succession_name:0 "Tradições Bizantinas"
 tradition_caravaneers_desc:0 "Esta cultura está bem integrada às práticas comerciais da região, e seu povo está fortemente associado ao comércio de caravanas."
 tradition_caravaneers_name:0 "Caravaneiros"
 tradition_castle_keepers_desc:0 "A ofensiva não é uma boa defesa. Uma boa defesa é ter a maioria dos castelos no mundo conhecido."
 tradition_castle_keepers_name:0 "Guardiões dos Castelos"
 tradition_caucasian_wolves_desc:0 "Tendo passado séculos fazendo da região dos portões do Cáucaso o seu lar, esta cultura está bem adaptada a tudo o que a guerra nas montanhas envolve."
 tradition_caucasian_wolves_name:0 "Lobos Caucasianos"
 tradition_ce1_ritual_washing_desc:0 "As propriedades purificadoras da água são uma parte essencial da vida para esta cultura e o ritual de ablução ocupa uma posição proeminente em sua sociedade."
 tradition_ce1_ritual_washing_name:0 "Rituais de Água"
 tradition_chanson_de_geste_desc:0 "Esta cultura valoriza as façanhas heróicas de antepassados há muito tempo passados. A narrativa romântica das vidas de cavaleiros como Guillaume ou Roland inspirará gerações futuras."
 tradition_chanson_de_geste_name:0 "Chanson de Geste"
 tradition_charitable_desc:0 "Independentemente da fé, as pessoas desta cultura são motivadas a apoiar aqueles menos afortunados."
 tradition_charitable_name:0 "Caridosos"
 tradition_chinese_arts_desc:0 "O caminho da caneta, o caminho do pincel, todos elementos importantes para esta cultura. Em vez de depender apenas da força militar ou de uma administração complexa, os chineses dão ênfase à perfeição de qualquer forma de arte."
 tradition_chinese_arts_name:0 "Artes Chinesas"
 tradition_chivalry_desc:0 "Esta cultura abraçou a cavalaria e os códigos de conduta cavalheirescos como um método social de regular o comportamento. A destreza marcial, o dever, a honra e a moralidade são valorizados, assim como a poesia ruim e a literatura romântica."
 tradition_chivalry_name:0 "Cavalaria"
 tradition_city_keepers_desc:0 "As cidades são o coração urbano pulsante desta cultura, e eles desejam que cada uma de suas metrópoles se torne joias invejáveis conhecidas em todo o mundo."
 tradition_city_keepers_name:0 "Guardiões das Cidades"
 tradition_collective_lands_desc:0 "A ideia de que indivíduos possuem terras pessoalmente é estranha a esta cultura; a terra pertence a todas as pessoas, para o bem comum."
 tradition_collective_lands_name:0 "Terras Coletivas"
 tradition_concubines_desc:0 "Os governantes desta cultura frequentemente mantêm um número de concubinas em sua casa, independentemente de sua fé."
 tradition_concubines_name:0 "Concubinas"
 tradition_court_eunuchs_desc:0 "Esta cultura faz uso extensivo de eunucos na corte, ocupando posições que vão desde servos domésticos até administradores burocráticos e até mesmo comandantes militares. Homens sem desejo são fáceis de serem confiados."
 tradition_court_eunuchs_name:0 "Eunucos na Corte"
 tradition_culinary_art_desc:0 "A comida não é apenas sustento para esta cultura; ela é tanto uma arte quanto um ritual, um ponto focal tanto para a família quanto para a comunidade."
 tradition_culinary_art_name:0 "Artistas Culinários"
 tradition_cultivation_desc:0 "Ajustando o corpo, a respiração e a mente até que o lodo do coração assente e a virtude interior surja como água cristalina."
 tradition_cultivation_name:0 "Cultivo"
 tradition_cultural_head_affinity_penalty_desc:0 "O [culture_head|E] não possui nenhum [traits|E] correspondente"
 tradition_cultural_head_learning_bonus:0 "[learning_skill|E] de [culture_head|E]"
 tradition_cultural_head_learning_penalty:0 "O [culture_head|E] possui baixa [learning_skill|E]"
 tradition_cultural_head_trait_bonus:0 "[trait|E] do [culture_head|E]"
 tradition_cultural_primacy_desc:0 "Esta cultura orgulhosa se contenta em olhar para sua própria história rica e vida social, e sente pouca necessidade de se misturar com seus vizinhos."
 tradition_cultural_primacy_name:0 "Primazia Cultural"
 tradition_culture_blending_desc:0 "Membros desta cultura frequentemente conviveram com pessoas de outras culturas. Por meio da exposição, eles se tornaram adeptos em incorporar idiomas, tradições e costumes estrangeiros em suas próprias vidas."
 tradition_culture_blending_name:0 "Mistura de Culturas"
 tradition_debug_desc:0 "Esta cultura é conhecida por suas muitas posições ecléticas e contraditórias."
 tradition_debug_name:0 "Caminhos Voláteis"
 tradition_desert_nomads_desc:0 "Esta cultura não é estranha ao ambiente árduo do deserto e dominou o uso de camelos para ajudá-los em viagens, guerra e vida cotidiana."
 tradition_desert_nomads_name:0 "Viajantes do Deserto"
 tradition_determined_independence_desc:0 "Morte antes da submissão! Os governantes desta cultura não encontram derrota pior do que a vassalização e farão qualquer coisa para se tornarem seus próprios mestres."
 tradition_determined_independence_name:0 "Independência Determinada"
 tradition_devoted_horsemanship_desc:0 "Nem mesmo os confortos palacianos conseguem manter o povo desta cultura longe da sela. Onde quer que se encontrem, seus rebanhos também estão lá, e os cavalos são cuidados com olhar atento."
 tradition_devoted_horsemanship_name:0 "Equitação Devotada"
 tradition_diasporic_desc:0 "As pessoas desta cultura perderam a pátria que um dia amaram. Alguns deles viajam pelo mundo em busca de um lugar onde possam recomeçar."
 tradition_diasporic_name:0 "Diáspora"
 tradition_dryland_dwellers_desc:0 "Esta cultura está acostumada a viver em climas secos e sabe onde encontrar água e como trabalhar as terras."
 tradition_dryland_dwellers_name:0 "Moradores de Terras Secas"
 tradition_ep2_avid_falconers_desc:0 "A arte de criar, treinar e caçar com rapinantes como falcões e falcões-peregrinos é um dos passatempos mais prestigiosos entre a elite desta cultura."
 tradition_ep2_avid_falconers_name:0 "Falcões Devotos"
 tradition_ep3_audacious_cadets_desc:0 "Multidões inquietas de filhos mais novos definem esta cultura. Ousados e sem escrúpulos, esses cavaleiros buscam sonhos de aventuras distantes, de crueldades mercenárias e de conquistas gloriosas."
 tradition_ep3_audacious_cadets_name:0 "Cadetes Audaciosos"
 tradition_ep3_cultivated_sophistication_desc:0 "Os bárbaros olham com inveja para as resplandecentes luxúrias desta cultura, a sofisticação de sua sociedade. Impulsionada por um senso de primazia, esta cultura rejeita quaisquer contradições que estejam fora de sua esfera cosmopolita de influência."
 tradition_ep3_cultivated_sophistication_name:0 "Sofisticação Cultivada"
 tradition_ep3_imperial_tagmata_desc:0 "Regimentos de elite bem armados formam a espinha dorsal das campanhas militares desta cultura. Suas tropas arrogantes têm pouca consideração pelos nobres guerreiros mesquinhos e atos imprudentes de valentia pessoal; em vez disso, honram a disciplina e os nomes sagrados de suas unidades. #EMP Exkoubitoi! Scholai! Hikanatoi!#!"
 tradition_ep3_imperial_tagmata_name:0 "Tagmata Imperial"
 tradition_ep3_indomitable_azatani_desc:0 "Para os nobres ferozmente orgulhosos desta cultura, cavalgando trovejantemente de seus altos castelos, 'A ferida de uma adaga cicatriza, mas a de uma língua — nunca!'"
 tradition_ep3_indomitable_azatani_name:0 "Azatani Indomável"
 tradition_ep3_palace_politics_desc:0 "Eunucos poderosos e bajuladores de seda ocupam um vasto aparato político, impressionando com finuras, elogiando com honras e tramando ferozmente em nome do avanço."
 tradition_ep3_palace_politics_name:0 "Política do Palácio"
 tradition_ep3_roman_ceremonies_desc:0 "Os imperadores do passado concederam a esta cultura uma grandeza duradoura, rituais espetaculares, uma admiração pelo ofício imperial... e uma vida pública rica em agitação."
 tradition_ep3_roman_ceremonies_name:0 "Cerimônias Romanas"
 tradition_equal_inheritance_desc:0 "Esta cultura tem uma história de governantes dividindo suas terras entre todos os filhos, mesmo aqueles que normalmente seriam excluídos."
 tradition_equal_inheritance_link:0 "Herança Igualitária"
 tradition_equal_inheritance_name:0 "Herança Igualitária"
 tradition_equitable_desc:0 "Nesta cultura, a verdade e a justiça imparcial são altamente valorizadas."
 tradition_equitable_name:0 "Equitativos"
 tradition_esteemed_hospitality_desc:0 "Nesta cultura, os governantes são conhecidos e esperados para receber qualquer pessoa que possa chegar à sua corte de braços abertos. Hospedar convidados e visitantes de maneira espetacular."
 tradition_esteemed_hospitality_name:0 "Hospitalidade Estimada"
 tradition_eye_for_an_eye_desc:0 "Nesta cultura, ofensas não são esquecidas, nem perdoadas. Seu povo pode guardar ressentimentos por muito tempo, e a vingança é realizada com paixão."
 tradition_eye_for_an_eye_name:0 "Olho por Olho"
 tradition_faith_bound_desc:0 "Nesta cultura, pertencer a uma fé diferente significa que você não é elegível para a sucessão."
 tradition_faith_bound_name:0 "Unidos pela Fé"
 tradition_family_entrepreneurship_desc:0 "Esta cultura incentiva o desenvolvimento de negócios ao longo das linhas familiares, onde cada geração adquire as ferramentas e técnicas do ofício dos antecessores, construindo uma forte tradição de profissionalismo ancestral."
 tradition_family_entrepreneurship_name:0 "Negócios Familiares"
 tradition_female_only_inheritance_desc:0 "Esta cultura impõe uma hierarquia matriarcal, onde a classe dominante é predominantemente composta por mulheres."
 tradition_female_only_inheritance_name:0 "Matriarcal"
 tradition_female_only_inheritance_requirements:0 "Você deve ter uma [faith|E] [GetFaithDoctrine('doctrine_gender_female_dominated').GetBaseName] ou a [heritage|E] #V $heritage_akan_name$#!, #V $heritage_west_african_name$#!, #V $heritage_senegambian_name$#! ou #V $heritage_yoruba_name$#!"
 tradition_fervent_temple_builders_desc:0 "Esta cultura considera a construção de templos como o caminho mais direto para o divino. Régios fervorosos são esperados para construir muitos e grandiosos templos."
 tradition_fervent_temple_builders_name:0 "Construtores de Templos Fervorosos"
 tradition_festivities_desc:0 "A frequência e exuberância com que esta cultura realiza festividades seriam consideradas vulgares por outros, mas uma festa é uma festa!"
 tradition_festivities_name:0 "Festividades Frequentes"
 tradition_fishermen_desc:0 "Qualquer um pode pescar, mas fazê-lo com tanta habilidade que qualquer captura seja abundante, independentemente da maré ou do vento, é um talento raro. Ninguém conhece melhor a costa, a terra ou o mar do que esses pescadores."
 tradition_fishermen_name:0 "Pescadores Hábeis"
 tradition_forbearing_desc:0 "Nesta cultura, ser paciente e contido diante da adversidade é comum."
 tradition_forbearing_name:0 "Tolerantes"
 tradition_forest_fighters_desc:0 "Esta cultura é especializada em lutar em florestas."
 tradition_forest_fighters_name:0 "Lutadores da Floresta"
 tradition_forest_folk_desc:0 "Esta cultura vive próxima a vastas florestas e sabe como aproveitar seus recursos."
 tradition_forest_folk_name:0 "Povo da Floresta"
 tradition_formation_fighting_desc:0 "Esta cultura sabe como criar sinergia entre diferentes tipos de unidades por meio de formações protetoras eficientes."
 tradition_formation_fighting_name:0 "Especialistas em Combate em Formação"
 tradition_fortress_mastery_desc:0 "Esta cultura possui uma longa tradição de engenhosidade defensiva, usando o terreno local para proteger sua terra natal e repelir invasores. Eles combinam essa habilidade com maestria no arco e tropas ágeis, capazes de superar qualquer inimigo."
 tradition_fortress_mastery_name:0 "Mestrado em Fortaleza"
 tradition_fp1_coastal_warriors_desc:0 "Sempre fomos atraídos para a costa. O cheiro do ar marinho, as gaivotas chorando, o aroma do peixe defumado... que guerreiro optaria por viver longe da água e de suas liberdades?"
 tradition_fp1_coastal_warriors_name:0 "Guerreiros Costeiros"
 tradition_fp1_northern_stories_desc:0 "A vida é vivida, contada e lembrada através das histórias. O que dizemos e o que as pessoas dizem sobre nós importa tanto quanto o que fazemos. Lembramos disso, e isso se reflete em nossas histórias."
 tradition_fp1_northern_stories_name:0 "Histórias do Norte"
 tradition_fp1_performative_honour_desc:0 "A honra nasce, sim, mas a honra também é conquistada e perdida por meio de ações. Ao buscar e vingar ofensas, ou ao falhar nisso, os soldados se tornam desprezíveis enquanto os jovens se transformam em guerreiros."
 tradition_fp1_performative_honour_name:0 "Honra Performática"
 tradition_fp1_the_right_to_prove_desc:0 "Embora nem todos nasçam lutadores, com a coragem certa e um braço forte com a espada, qualquer um pode mostrar-se um guerreiro de coração e assim se tornar um na prática."
 tradition_fp1_the_right_to_prove_name:0 "O Direito de Provar"
 tradition_fp1_trials_by_combat_desc:0 "Palavras são um substituto covarde para armas. Por que deixar a justiça para leis decrépitas e magistrados corruptos quando disputas podem ser resolvidas mais rápido e de forma mais justa com a espada?"
 tradition_fp1_trials_by_combat_name:0 "Julgamentos por Combate"
 tradition_fractious_desc:0 "O inimigo do meu inimigo é #EMP também#! meu inimigo."
 tradition_fractious_name:0 "Quereloso"
 tradition_frugal_armorsmiths_desc:0 "Enquanto um conjunto de armadura de alta qualidade pode salvar uma vida, ter dez conjuntos decentes pode vencer uma batalha."
 tradition_frugal_armorsmiths_name:0 "Armeiros Econômicos"
 tradition_gardening_desc:0 "Esta cultura tem uma longa tradição de construção e manutenção de vários tipos de jardins, criando um pequeno paraíso para si mesmos."
 tradition_gardening_name:0 "Arquitetos de Jardins"
 tradition_hard_working_desc:0 "Esta cultura ensina e valoriza ideias de dedicação e trabalho árduo em prol da comunidade."
 tradition_hard_working_name:0 "Trabalhadores Dedicados"
 tradition_hereditary_bards_desc:0 "Para algumas culturas, existem histórias transmitidas ao longo das gerações, tão valiosas quanto qualquer título de propriedade."
 tradition_hereditary_bards_name:0 "Bardos Hereditários"
 tradition_hereditary_hierarchy_desc:0 "Esta cultura acredita que a liderança é transmitida por meio do sangue, a nobreza está ligada às pedras dos castelos e a estrutura feudal é inabalável. Eles não esquecem facilmente aqueles que quebram o código feudal."
 tradition_hereditary_hierarchy_name:0 "Hierarquia Hereditária"
 tradition_hidden_cities_desc:0 "Seja nas copas das árvores da selva ou protegidas pelo labirinto orgânico, os estrangeiros podem nem mesmo saber que as cidades dessa cultura existem, quanto mais ter uma pista de como sitiá-las."
 tradition_hidden_cities_name:0 "Cidades Ocultas"
 tradition_highland_warriors_desc:0 "Guerreiros desta cultura lutam bem nas encostas e vales de suas terras montanhosas."
 tradition_highland_warriors_name:0 "Guerreiros das Terras Altas"
 tradition_hill_dwellers_desc:0 "Esta cultura se sente em casa nas colinas e sabe como trabalhar suas terras de forma eficaz."
 tradition_hill_dwellers_name:0 "Moradores de Colinas"
 tradition_himalayan_settlers_desc:0 "Esta cultura fez sua morada no 'teto do mundo', onde o ar é fresco, mas frio, e os invernos são longos e rigorosos. Eles se orgulham de que poucas culturas abaixo seriam capazes de viver tão bem quanto esse povo faz, entre os picos e planaltos onde apenas as ovelhas podem prosperar."
 tradition_himalayan_settlers_name:0 "Colonizadores do Himalaia"
 tradition_hit_and_run_desc:0 "Esta cultura domina o uso de unidades levemente armadas para atacar o inimigo com força e depois recuar."
 tradition_hit_and_run_name:0 "Táticos do Golpe e Fuga"
 tradition_hold_the_line_desc:0 "Esta cultura faz com que todos os combatentes se orgulhem de sua força. Os discursos empolgantes de seus comandantes mantêm os soldados inspirados até o fim."
 tradition_hold_the_line_name:0 "Manter a Linha"
 tradition_horse_breeder_desc:0 "Esta cultura acumulou minuciosamente conhecimento e experiência na arte e ciência refinada da criação de cavalos. Sejam destriers ou coursers, os cavalos desse povo são renomados por sua superioridade."
 tradition_horse_breeder_name:0 "Criadores de Cavalos"
 tradition_horse_lords_desc:0 "Esta cultura dominou o uso do cavalo em guerra."
 tradition_horse_lords_name:0 "Senhores dos Cavalos"
 tradition_hunters_desc:0 "Impulsionada pela necessidade econômica, ou talvez expectativa social, esta cultura aprimorou suas práticas de caça em uma arte precisa e quase bela."
 tradition_hunters_name:0 "Caçadores Prolíficos"
 tradition_illyrian_grit_desc:0 "Esta cultura pode sempre estar lutando contra si mesma, mas se unirá para enfrentar qualquer invasor quando chegar a hora."
 tradition_illyrian_grit_name:0 "Força Ilíria"
 tradition_insular_spirit_desc:0 "Esta cultura está determinada a não se curvar aos seus caminhos originais e lutará por qualquer um de seus próprios que seja atacado por outra cultura."
 tradition_insular_spirit_name:0 "Espírito Insular"
 tradition_intensive_farming_desc:0 "Esta cultura valoriza muito uma grande classe agrícola que sustenta sua população não agrícola. Através de milênios de experiência, eles foram capazes de aumentar significativamente a produção de trigo e arroz, dependendo do que melhor se adapta às circunstâncias locais."
 tradition_intensive_farming_name:0 "Agricultura Intensiva"
 tradition_isolationist_desc:0 "Esta cultura prefere manter-se isolada e raramente busca além de seu próprio âmbito."
 tradition_isolationist_name:0 "Isolacionista"
 tradition_jungle_dwellers_desc:0 "Esta cultura vive próxima à selva e sabe como aproveitar suas riquezas."
 tradition_jungle_dwellers_name:0 "Moradores da Selva"
 tradition_jungle_warriors_desc:0 "Guerreiros desta cultura sabem bem como atravessar selvas traiçoeiras."
 tradition_jungle_warriors_name:0 "Guerreiros da Selva"
 tradition_language_scholars_desc:0 "Aprender as palavras de um vizinho aproxima você da linguagem do Divino."
 tradition_language_scholars_name:0 "Linguistas"
 tradition_legalistic_desc:0 "Esta cultura considera o império da lei e sua codificação como o parâmetro mais importante de uma sociedade civilizada."
 tradition_legalistic_name:0 "Legalista"
 tradition_legendary_noble_families_desc:0 "A menos que você esteja conectado a uma das famílias nobres que ajudaram a forjar o destino desta cultura, você não é nada."
 tradition_legendary_noble_families_name:0 "Famílias Nobres Lendárias"
 tradition_life_is_just_a_joke_desc:0 "Esta cultura riria na guilhotina com um machado sobre sua cabeça."
 tradition_life_is_just_a_joke_name:0 "A Vida é Apenas uma Piada"
 tradition_longbow_competitions_desc:0 "Esta cultura favorece um arco mais poderoso do que a maioria poderia puxar, e praticar com eles uma vez por semana é tão importante quanto qualquer ritual de adoração, desde as aldeias rurais até as maiores metrópoles urbanas."
 tradition_longbow_competitions_name:0 "Competições de Arco Longo"
 tradition_lords_of_the_elephant_desc:0 "Esta cultura venera elefantes, comparando-os à realeza. Eles são mestres em capturá-los, treiná-los e usá-los de forma devastadora em guerra."
 tradition_lords_of_the_elephant_name:0 "Senhores dos Elefantes"
 tradition_loyal_soldiers_desc:0 "Para esta cultura, servir ao seu senhor feudal e país é nobre e justo - um dever e um privilégio, em vez de um acordo ganancioso ou um fardo indesejado."
 tradition_loyal_soldiers_name:0 "Súditos Leais"
 tradition_malleable_invaders_desc:0 "Nós tomaremos suas terras, seus filhos, suas tradições e seu #EMP futuro#!."
 tradition_malleable_invaders_name:0 "Invasores Moldáveis"
 tradition_maritime_mangroves_desc:0 "Esta cultura aprendeu a navegar em pântanos que outras culturas consideram intransponíveis. Eles usaram isso para construir bases inacessíveis a partir das quais negociar, saquear e explorar o mundo."
 tradition_maritime_mangroves_name:0 "Mangues Marítimos"
 tradition_maritime_mercantilism_desc:0 "O mundo pode ser governado por exércitos, mas esta cultura sabe que é verdadeiramente controlado por quem domina o fluxo de ouro pelos mares."
 tradition_maritime_mercantilism_name:0 "Mercantilismo Marítimo"
 tradition_maritime_way_of_life_desc:0 "Desde tempos imemoriais, os catamarãs de balancim desta cultura têm sido avistados no horizonte. Longas viagens marítimas são uma segunda natureza para este povo.\nPara alguém que considera a vida no mar natural, não há limites para onde podem se estabelecer, como podem comerciar ou quem podem saquear."
 tradition_maritime_way_of_life_name:0 "Modo de Vida Marítimo"
 tradition_martial_admiration_desc:0 "Aqueles que estão dispostos a pegar em espada e lutar por sua cultura são dignos de admiração. Não importa as probabilidades."
 tradition_martial_admiration_name:0 "Admiração Marcial"
 tradition_medicinal_plants_desc:0 "Esta cultura desenvolveu há muito tempo conhecimentos sobre as propriedades medicinais das plantas e árvores; para eles, a maioria das doenças pode ser tratada com o emplasto, pomada ou caldo certo."
 tradition_medicinal_plants_name:0 "Herbalistas Medicinais"
 tradition_memories_of_bactria_desc:0 "Imortalizado na memória cultural dessas pessoas está o ideal da terra perfeita de Bactria, a bela coroa do Oriente, cujo tempo voltará novamente."
 tradition_memories_of_bactria_name:0 "Memórias de Bactria"
 tradition_mendicant_mystics_desc:0 "As pessoas sagradas desta cultura acreditam fortemente que a fé deve ser ministrada no campo, e seus mais devotos frequentemente percorrem o mundo."
 tradition_mendicant_mystics_name:0 "Místicos Mendicantes"
 tradition_merciful_blindings_desc:0 "Não importa o quão além do perdão alguém tenha ido, esta cultura acredita que é melhor arrancar um olho do que perfurar um coração."
 tradition_merciful_blindings_name:0 "Cegamentos Misericordiosos"
 tradition_metal_craftsmanship_desc:0 "Esta cultura desfruta de fácil acesso ao ferro há séculos. Ao longo do tempo, eles desenvolveram seu entendimento do metal a tal ponto que seu nome se tornou sinônimo de armas e armaduras duráveis e de alta qualidade."
 tradition_metal_craftsmanship_name:0 "Metalúrgicos"
 tradition_mixed_governance_desc:0 "Esta cultura considera cada pensamento digno de ser ouvido e cada nova forma de governar digna de ser experimentada. Os governantes incentivam os vassalos a governarem da maneira que acharem melhor."
 tradition_mixed_governance_name:0 "Governança Mista"
 tradition_modest_desc:0 "Esta cultura valoriza a modéstia, não se deve ocupar muito espaço ou se considerar melhor do que os outros."
 tradition_modest_name:0 "Modestos"
 tradition_monastic_communities_desc:0 "Esta cultura tem uma longa história de enviar descendentes nobres para servir a fé. Pensadores políticos reverenciados frequentemente surgem das ordens monásticas."
 tradition_monastic_communities_name:0 "Comunidades Monásticas"
 tradition_monogamous_desc:0 "Nesta cultura, mantém-se um único cônjuge, independentemente da fé."
 tradition_monogamous_name:0 "Monogâmicos"
 tradition_mountain_homes_desc:0 "Esta cultura sabe como viver e prosperar em planaltos próximos às encostas íngremes das montanhas."
 tradition_mountain_homes_name:0 "Lares nas Montanhas"
 tradition_mountaineer_ruralism_desc:0 "Desde suas origens nas colinas da Floresta da Boêmia, até as escarpas das montanhas Ore e Tatra, a maioria nesta cultura sabe não apenas como percorrer as terras rochosas, mas também lidar com a vida em uma montanha com facilidade."
 tradition_mountaineer_ruralism_name:0 "Ruralismo Montanhês"
 tradition_mountaineers_desc:0 "Soldados desta cultura carregam tudo o que precisam para atravessar montanhas."
 tradition_mountaineers_name:0 "Montanhistas"
 tradition_mpo_iron_cavalry_desc:0 "Mesmo povos cavaleiros podem ser vencidos por cavalaria revestida da cabeça aos cascos em placas de lamelar. Esta cultura não apenas desenvolveu o gosto por tal armamento caro, mas emprega aqueles nascidos na sela — arco em mãos — como seus cavaleiros pesadamente armadurados."
 tradition_mpo_iron_cavalry_name:0 "Cavalaria de Ferro"
 tradition_mpo_northern_tribes_desc:0 "Esta é uma das culturas conhecidas em geral como os 'Povos da Floresta' por seus vizinhos do sul. Esses nortistas são em alguns lugares caçadores respeitáveis, em outros exímios pescadores de rio, às vezes fundidores de ferro e frequentemente pastores."
 tradition_mpo_northern_tribes_name:0 "Tribos do Norte"
 tradition_mpo_wolves_of_the_deep_steppe_desc:0 "Longe do toque dos confortos 'civilizados', homens vivem do que podem tomar, e sonham com a morte nas costas de seus cavalos. Povos mais fracos são empurrados diante desses guerreiros."
 tradition_mpo_wolves_of_the_deep_steppe_name:0 "Lobos da Estepe Profunda"
 tradition_music_theory_desc:0 "Esta cultura trata a música quase como a linguagem do divino, e assim muitos indivíduos se dedicam desde jovens ao nobre e celebrado estudo musical."
 tradition_music_theory_name:0 "Teóricos Musicais"
 tradition_mystical_ancestors_desc:0 "A linhagem é muito importante para esta cultura, ao ponto em que os ancestrais se tornaram seres míticos e lendários, com muitos que afirmam ser seus descendentes."
 tradition_mystical_ancestors_name:0 "Ancestrais Místicos"
 tradition_noble_adoption_desc:0 "Adotar crianças órfãs em casas nobres é comum nesta sociedade. O sangue da aliança é mais espesso que a água do útero."
 tradition_noble_adoption_name:0 "Adoção Nobre"
 tradition_nubian_warrior_kings_desc:0 "Aqueles que vivem no leste da África lembram-se bem dos grandes Reis Guerreiros que um dia enfrentaram invasores e forjaram reinos em Kush. Nossos vizinhos podem insistir na superioridade das mulheres, mas nós rastreamos nossas linhagens através de nossos pais, e o grito de guerra dos poderosos homens núbios fazem essas \"mulheres\" estrangeiras fugirem para casa."
 tradition_nubian_warrior_kings_name:0 "Reis Guerreiros"
 tradition_nubian_warrior_queens_desc:0 "Aqueles que vivem no leste da África lembram-se bem das grandes Rainhas Guerreiras que um dia enfrentaram invasores e forjaram reinos em Kush. Nossos vizinhos podem insistir na superioridade dos homens, mas nós rastreamos nossas linhagens através de nossas mães, e o grito de guerra das poderosas mulheres núbias fazem esses \"homens\" estrangeiros fugirem para casa."
 tradition_nubian_warrior_queens_name:0 "Rainhas Guerreiras"
 tradition_nudists_desc:0 "Os adeptos desta cultura não acreditam em proteger o corpo contra os elementos, optando por viver como seu criador os fez."
 tradition_nudists_name:0 "Nudistas"
 tradition_only_the_strong_desc:0 "Esta cultura dá uma grande importância a ter alguns guerreiros bem treinados. Se você não é o melhor dos melhores, não é bem-vindo para servir."
 tradition_only_the_strong_name:0 "Somente os Fortes"
 tradition_ordo_riders_desc:0 "A demanda por rebanhos e a necessidade de fortalecer a unidade da tribo forçou muitos dos povos da horda desta cultura a se tornarem guerreiros experientes, capazes de repelir ataques enquanto também conseguem reunir suprimentos de forma eficaz para o povo."
 tradition_ordo_riders_name:0 "Cavaleiros Ordo"
 tradition_pacifism_desc:0 "Para esta cultura, o uso da força nunca pode ser justificado. Somente seguindo um caminho de não violência as pessoas podem verdadeiramente viver em paz."
 tradition_pacifism_name:0 "Pacifistas"
 tradition_parochialism_desc:0 "Os residentes da cidade desta cultura são ferozmente competitivos e independentes. Eles investem muito dinheiro e energia para garantir que sua cidade seja a mais grandiosa."
 tradition_parochialism_name:0 "Paroquialismo"
 tradition_pastoralists_desc:0 "Esta cultura se sente em casa em terrenos amplos e abertos, onde eles pastoreiam grandes grupos de animais."
 tradition_pastoralists_name:0 "Pastores"
 tradition_philosopher_culture_desc:0 "Esta cultura promove o pensamento e a autorreflexão."
 tradition_philosopher_culture_name:0 "Cultura Filosófica"
 tradition_poetry_desc:0 "A poesia é considerada uma arte nobre nesta cultura, e muitos dedicam seu tempo a juntar palavras com significado e reflexão."
 tradition_poetry_name:0 "Poesia Refinada"
 tradition_polders_desc:0 "Esta cultura tem uma longa tradição de recuperação de terras do mar circundante. Isso lhes permite utilizar o que normalmente seria um leito marinho raso para agricultura e construção."
 tradition_polders_name:0 "Pôlderes"
 tradition_polygamous_desc:0 "Nesta cultura, é comum ter múltiplos cônjuges, independentemente da fé."
 tradition_polygamous_name:0 "Poligâmicos"
 tradition_practiced_pirates_desc:0 "Invadir um porto, incendiá-lo e levar tudo o que não está pregado pode não ser nobre, mas é lucrativo."
 tradition_practiced_pirates_name:0 "Piratas Praticantes"
 tradition_priestly_caste_desc:0 "Esta cultura impõe um sistema de castas para elevar o sacerdócio em sua sociedade. Para eles, indivíduos encarregados de interpretar a vontade do divino devem ser protegidos e obedecidos."
 tradition_priestly_caste_name:0 "Castas Sacerdotais"
 tradition_quarrelsome_desc:0 "Conflitos fronteiriços são comuns para os governantes desta cultura. Terras frequentemente mudam de mãos de maneira injusta."
 tradition_quarrelsome_name:0 "Briguentos"
 tradition_reavers_desc:0 "Muitos nesta cultura, que vivem na costa, tentam se aventurar a abordar navios para roubar de outros portos. Embora isso não seja aprovado por seus senhores diretos, todo governante sabe que isso resultará em melhores soldados quando chegar a hora."
 tradition_reavers_name:0 "Pilhadores"
 tradition_reindeer_hunters_desc:0 "Perseguir veados não passa de uma dança sobre o gelo constante da taiga. Esta cultura aprendeu a usar os suprimentos de caça que têm ao máximo."
 tradition_reindeer_hunters_name:0 "Caçadores de Rena"
 tradition_religion_blending_desc:0 "Membros desta cultura frequentemente convivem com aqueles que compartilham diferentes fé e crenças, e se adaptam bem à adoção de elementos estrangeiros em seu próprio culto."
 tradition_religion_blending_name:0 "Mistura de Religiões"
 tradition_religious_festivities_desc:0 "O movimento do Sol e das estrelas é irrelevante para a concepção de tempo desta cultura. Em vez disso, uma forma muito mais popular de marcar a passagem dos dias é por meio de uma infinidade de festivais religiosos e celebrações regulares, para os quais todos são convidados!"
 tradition_religious_festivities_name:0 "Festividades Religiosas"
 tradition_religious_patronage_desc:0 "Para a salvação da alma, é preciso se comprometer com obras de significado religioso. Você não pode comprar redenção, mas ter um templo de sacerdotes cantando seus louvores #EMP ajuda.#!"
 tradition_religious_patronage_name:0 "Patrocínio Religioso"
 tradition_republican_legacy_desc:0 "Esta cultura possui uma longa história de valores republicanos, onde as classes urbanas são tão importantes quanto os proprietários rurais."
 tradition_republican_legacy_name:0 "Legado Republicano"
 tradition_reverence_for_veterans_desc:0 "Esta cultura não menospreza aqueles que não podem mais lutar devido a ferimentos; em vez disso, eles são celebrados como heróis e usados como professores."
 tradition_reverence_for_veterans_name:0 "Reverência pelos Veteranos"
 tradition_ritual_scarrification_desc:0 "Esta cultura respeita aqueles cuja carne já provou a lâmina. Seja para provar sua coragem ou criar um belo desenho, eles marcam sua própria pele."
 tradition_ritual_scarrification_name:0 "Escarificação Ritual"
 tradition_roman_legacy_desc:0 "A organização militar do Império Romano ainda está na memória viva desta cultura. Um exército profissional é favorecido em relação a tropas recrutadas."
 tradition_roman_legacy_name:0 "Legado Romano Oriental"
 tradition_ruling_caste_desc:0 "Os governantes desta cultura estão acostumados a dominar sobre súditos que não são de sua própria cultura. Eles sabem como reprimir efetivamente revoltas, embora às custas da percepção pública."
 tradition_ruling_caste_name:0 "Casta Governante"
 tradition_runestones_desc:0 "Morte, conquista, aquisição de posição - não são essas as coisas que definem a vida da nobreza? Onde nosso povo vai, também vão os marcos do valor de nossas vidas."
 tradition_runestones_name:0 "Erguidores de Pedras Rúnicas"
 tradition_sacral_kingship_desc:0 "Os governantes desta cultura são considerados deuses, ou a realeza é vista como uma virtude divina. O que é um Rei para um Deus?"
 tradition_sacral_kingship_name:0 "Realeza Sagrada"
 tradition_sacred_groves_desc:0 "As árvores são consideradas sagradas por esta cultura. A floresta é um ser vivo que deve ser cuidado — não destruído."
 tradition_sacred_groves_name:0 "Bosques Sagrados"
 tradition_sacred_hunts_desc:0 "A caça não é nem um esporte nem um passatempo, é nada menos que a expressão mais pura da experiência humana, onde alguém pode se conectar com o divino ao demonstrar seu domínio sobre a natureza."
 tradition_sacred_hunts_name:0 "Caçadas Sagradas"
 tradition_sacred_mountains_desc:0 "Esta cultura considera as montanhas como conexões com o divino e as trata com reverência e respeito."
 tradition_sacred_mountains_name:0 "Montanhas Sagradas"
 tradition_saharan_nomads_desc:0 "Esta cultura está intimamente familiarizada com o deserto do Saara, que tem percorrido por séculos, conectando o Mediterrâneo aos reinos subsaarianos do Sahel."
 tradition_saharan_nomads_name:0 "Nômades do Saara"
 tradition_scholar_officials_desc:0 "A caneta e o pincel são mais poderosos que a espada... Esta cultura acredita fortemente em um ideal onde a influência é dada a oficiais leais, educados nas artes nobres."
 tradition_scholar_officials_name:0 "Oficiais Eruditos"
 tradition_scientific_curiosity_desc:0 "A maioria das pessoas olha para a esquerda, para a direita, para trás e para a frente em busca de respostas. Não essas pessoas. Essas pessoas olham para cima."
 tradition_scientific_curiosity_name:0 "Curiosidade Científica"
 tradition_seafaring_desc:0 "Para esta cultura, o chamado do mar é irresistível, e eles vivem para velejar como um sonho em um oceano cristalino, ou cavalgar no topo de uma tempestade selvagem e furiosa."
 tradition_seafaring_name:0 "Navegadores"
 tradition_sinophilic_desc:0 "A influência da hegemonia chinesa sobre este reino levou muitos de seu povo a adotarem costumes deles."
 tradition_sinophilic_name:0 "Sinofílica"
 tradition_sorcerous_metallurgy_desc:0 "Há tantos alquimistas nesta cultura tentando transformar metal em ouro quanto ferreiros forjando armas. O que importa se a riqueza e as armas dessa cultura são aprimoradas pela bruxaria?"
 tradition_sorcerous_metallurgy_name:0 "Metalurgia Feiticeira"
 tradition_spartan_desc:0 "Esta cultura não valoriza os símbolos de poder - a cerimônia, a riqueza, a decoração sem sentido. Essa cultura está mais interessada no próprio poder, preferencialmente na forma de muralhas altas e fortalezas."
 tradition_spartan_name:0 "Espartana"
 tradition_stalwart_defenders_desc:0 "Defender o que é seu próprio é de importância primordial para esta cultura."
 tradition_stalwart_defenders_name:0 "Defensores Firmes"
 tradition_stand_and_fight_desc:0 "Guerreiros desta cultura são inabaláveis e firmes. Eles não recuam - mesmo diante de probabilidades esmagadoras, para melhor ou para pior."
 tradition_stand_and_fight_name:0 "Permanecer e Lutar!"
 tradition_staunch_traditionalists_desc:0 "A tradição é tradição, é imutável e inalterável. Devemos estar prontos e dispostos a defender o que nos torna quem somos."
 tradition_staunch_traditionalists_name:0 "Tradicionais Inflexíveis"
 tradition_steppe_tolerance_desc:0 "Aqueles que vivem na Estepe sempre terão muito em comum com aqueles que compartilham seu modo de vida. Estrangeiros podem adorar de forma diferente, mas ainda vivem na sela."
 tradition_steppe_tolerance_name:0 "Tolerância das Estepes"
 tradition_storytellers_desc:0 "Esta cultura possui uma tradição oral forte e persistente. O passado é preservado por meio de narrativas ritualísticas, onde os heróis e lendas do passado são transmitidos de geração em geração."
 tradition_storytellers_name:0 "Contadores de Histórias"
 tradition_stratified_society_desc:0 "Há aqueles que nascem para liderar, e há aqueles que nascem para servir. Em uma $tradition_stratified_society_name$, a realidade do privilégio hereditário frequentemente se sobrepõe aos princípios de meritocracia, e a proximidade do poder é tudo."
 tradition_stratified_society_family_member_toast_desc:0 "Graças às conquistas de [family_success.GetName], você ganhou [merit|E] e não precisa realizar o @provincial_exam_icon! [GetActivityType( 'activity_local_examination' ).GetName]"
 tradition_stratified_society_family_member_toast_title:0 "$tradition_stratified_society_toast_title$"
 tradition_stratified_society_name:0 "Sociedade Estratificada"
 tradition_stratified_society_toast_desc:0 "Como privilégio de seu posto distinto, seus parentes próximos ganharam [merit|E] e não precisam realizar o @provincial_exam_icon! [GetActivityType( 'activity_local_examination' ).GetName]"
 tradition_stratified_society_toast_title:0 "[ROOT.Char.GetHouse.GetNameNoTooltip] Ascendente"
 tradition_strength_display_desc:0 "Possuir apenas força não é suficiente. Você precisa #EMP demonstrar#! sua força diante dos outros, para que você saiba que pode enfrentar um oponente digno ou lutar ao lado de um aliado valoroso."
 tradition_strength_display_name:0 "Demonstrações de Força"
 tradition_strength_in_numbers_desc:0 "Esta cultura abandona a ideia de ter tropas de elite e, em vez disso, favorece exércitos massivos."
 tradition_strength_in_numbers_name:0 "Força em Números"
 tradition_strong_kinship_desc:0 "Esta cultura tem uma forte tradição de parentesco dentro da família extensa ou clã. Em tempos de necessidade, um governante sempre poderá contar com seus parentes."
 tradition_strong_kinship_name:0 "Parentesco Forte"
 tradition_swords_for_hire_desc:0 "Esta cultura vê o trabalho de mercenários com bons olhos e encoraja guerreiros a buscar glória como mercenários entre as guerras."
 tradition_swords_for_hire_name:0 "Espadas Contratadas"
 tradition_talent_acquisition_desc:0 "\"Mate-me se desejar, mas se me deixar viver, servirei a você lealmente.\""
 tradition_talent_acquisition_name:0 "Reconhecimento de Talento"
 tradition_tea_ceremony_desc:0 "Às vezes, tudo o que se precisa para melhorar tudo é uma xícara de chá gostoso."
 tradition_tea_ceremony_name:0 "Cerimônias de Chá"
 tradition_tgp_art_of_war_desc:0 "Esta cultura estudou teoria militar por mil anos, e seus generais e marechais dispõem de uma rica coleção de manuais e livros militares. Este conhecimento é apenas ofuscado por um grande entendimento técnico de como fabricar armas e armaduras resistentes."
 tradition_tgp_art_of_war_name:0 "Arte da Guerra"
 tradition_tgp_barangay_confederations_desc:0 "Os governantes desta cultura lideram diversas cidades-estado espalhadas por estuários de rios e pela costa. Tais estados variam bastante em tamanho, mas tendem a se unir em confederações, lideradas por um chefe escolhido dentre os [Glossary( 'Datu', 'DATU_GLOSS' )] dos membros."
 tradition_tgp_barangay_confederations_name:0 "Confederações Barangay"
 tradition_tgp_bushido_desc:0 "Enraizada em um legado de honra e disciplina marcial, esta tradição eleva o vínculo entre senhor e vassalo por meio de atos de homenagem e valor. A força de caráter e os feitos de integridade forjam lealdade e respeito inabaláveis."
 tradition_tgp_bushido_name:0 "Bushidō"
 tradition_tgp_court_machinations_desc:0 "Nos labirínticos salões da corte, eunucos exercem poder, consortes disputam favores e sussurros de traição ecoam por câmaras douradas."
 tradition_tgp_court_machinations_name:0 "Intrigas da Corte"
 tradition_tgp_defiant_ambushers_desc:0 "Sempre atacados por invasores, o domínio da sela e do arco permite que pequenos números sejam usados com efeito devastador em ataques de guerrilha e emboscadas."
 tradition_tgp_defiant_ambushers_name:0 "Emboscadores Desafiadores"
 tradition_tgp_ephemeral_grace_desc:0 "A filosofia estética de #EMP Mono no Aware#! celebra a beleza transitória dos momentos efêmeros. Fomenta uma profunda harmonia com a natureza e uma apreciação reflexiva da arte e da impermanência da vida."
 tradition_tgp_ephemeral_grace_name:0 "Graça Efêmera"
 tradition_tgp_esoteric_power_desc:0 "Divinos e misteriosos são os dois adjetivos que descrevem a nobreza aos olhos desta cultura. Governantes que desejam assegurar seu mandato precisam engajar-se em rituais elaborados e manifestar seu poder por meio da exibição de artefatos divinos."
 tradition_tgp_esoteric_power_name:0 "Poder Esotérico"
 tradition_tgp_fortified_strongholds_desc:0 "Esta cultura se caracteriza por grandes cidades fortificadas que cumprem funções religiosas, militares e governamentais. A proteção dessas fortalezas culturais é crucial, e a fundação de novas cidades é uma questão de grande prestígio."
 tradition_tgp_fortified_strongholds_name:0 "Fortalezas Fortificadas"
 tradition_tgp_hydraulic_builders_desc:0 "Esta cultura valoriza grandemente a utilização de obras hidráulicas de forma espiritual. No centro dessa fascinação está o [GetBuilding('sacred_pool_06').GetName], que tende a ser expandido em grandes reservatórios com máxima importância religiosa."
 tradition_tgp_hydraulic_builders_name:0 "Construtores Hidráulicos"
 tradition_tgp_imperial_peace_desc:0 "Embora amplamente protegida de invasões pelo mar, defender-se de ataques do norte e manter a paz de Kanmu contra pretendentes ou governadores ambiciosos ainda exige guerreiros habilidosos e organização."
 tradition_tgp_imperial_peace_name:0 "Paz Frágil"
 tradition_tgp_inward_perfection_desc:0 "Esta cultura valoriza a autossuficiência e o enriquecimento das virtudes internas em detrimento da influência externa. Laços diplomáticos podem enfraquecer, mas conhecimento e introspecção florescem em tranquila solidão."
 tradition_tgp_inward_perfection_name:0 "Perfeição Interior"
 tradition_tgp_japanese_houses_desc:0 "Embora as normas matrimoniais sejam importantes para manter aparência e validade legal, o prazer é um dom natural concedido pelos deuses e vital para a boa saúde, quaisquer que sejam as ramificações sobre o pedigree."
 tradition_tgp_japanese_houses_name:0 "Pragmatismo Dinástico"
 tradition_tgp_mountain_island_desc:0 "As montanhas e florestas das várias ilhas do arquipélago japonês se erguem e descem pelo oceano, seus habitantes são especialistas em atravessar essas paisagens acidentadas e diversificadas."
 tradition_tgp_mountain_island_name:0 "Yashima"
 tradition_tgp_religious_hospitality_desc:0 "Esta cultura é hábil em mesclar religiões estrangeiras com seus costumes, promovendo uma sociedade mais cosmopolita, com várias crenças convivendo pacificamente. Muito disso é alcançado através do comércio e relações internacionais."
 tradition_tgp_religious_hospitality_name:0 "Hospitalidade Religiosa"
 tradition_tgp_rice_cultivators_desc:0 "O arroz é a base vital desta cultura. Por meio de trabalho diligente e conhecimento agrícola, suas colheitas são ricas enquanto controlarem terras adequadas para seu cultivo. Como resultado, sua prosperidade econômica e poder militar se elevam acima de vizinhos menos avançados."
 tradition_tgp_rice_cultivators_name:0 "Cultivadores de Arroz"
 tradition_tgp_warrior_monks_desc:0 "A devoção a uma vida moral não deve impedir o uso da força, especialmente quando há necessidade de proteger a comunidade religiosa de seitas rivais e oficiais corruptos, ou de defender os necessitados."
 tradition_tgp_warrior_monks_name:0 "Monge Guerreiros"
 tradition_the_witenagemot_desc:0 "Esta cultura tem uma longa história de realização de assembleias compostas pelos potentados governantes da terra, debatendo política, lei, finanças e, o mais importante, como melhor... #EMP aconselhar#! o governante."
 tradition_the_witenagemot_name:0 "A Witenagemot"
 tradition_theocratic_autonomy_desc:0 "As autoridades religiosas desta cultura têm ampla liberdade concedida pelos governantes seculares e são respeitadas e obedecidas pelo povo."
 tradition_theocratic_autonomy_name:0 "Autonomia Teocrática"
 tradition_things_desc:0 "Na Escandinávia, as distâncias e a natureza selvagem tornam a autoridade centralizada ineficaz. Quando disputas precisam ser resolvidas e decisões devem ser tomadas, é convocada a #EMP reunião Ting#, uma assembleia de pares presidida por um leispeaker."
 tradition_things_name:0 "Reunião Ting"
 tradition_tribe_unity_desc:0 "Esta cultura enfatiza os laços familiares e comunitários que seu povo compartilha, incentivando-os a lembrar sua herança comum."
 tradition_tribe_unity_name:0 "Unidade Tribal"
 tradition_vegetarianism_desc:0 "Esta cultura desenvolveu uma forte aversão ao consumo de carne animal e pratica o vegetarianismo em toda a sociedade."
 tradition_vegetarianism_name:0 "Vegetarianos"
 tradition_warrior_culture_desc:0 "Esta cultura valoriza a destreza marcial e a força acima de tudo. As crianças são criadas sabendo lutar e são desencorajadas de buscar atividades acadêmicas. A fraqueza não é tolerada."
 tradition_warrior_culture_name:0 "Cultura Guerreira"
 tradition_warrior_monks_desc:0 "Esta cultura acredita que se você escolher seguir estudos teológicos, também deve ser capaz de defender sua fé."
 tradition_warrior_monks_name:0 "Sacerdotes Guerreiros"
 tradition_warriors_by_merit_desc:0 "Esta cultura acredita que se você provou ser capaz como guerreiro, deve ter permissão para lutar, não importa quem você seja."
 tradition_warriors_by_merit_name:0 "Guerreiros por Mérito"
 tradition_warriors_of_the_dry_desc:0 "Esta cultura dominou a arte de lutar em climas muito secos."
 tradition_warriors_of_the_dry_name:0 "Guerreiros do Árido"
 tradition_wedding_ceremonies_desc:0 "Para esta cultura, a união de duas pessoas em matrimônio é considerada um evento altamente público e ritualístico."
 tradition_wedding_ceremonies_name:0 "Cerimônias Matrimoniais"
 tradition_welcoming_desc:0 "As pessoas desta cultura destacam-se em questões diplomáticas, e a etiqueta social é valorizada acima de tudo."
 tradition_welcoming_name:0 "Carismáticos"
 tradition_wetlanders_desc:0 "Esta cultura dominou os pântanos e brejos. Embora a vida às vezes seja uma batalha contra o mofo, eles aprenderam a usar a turfa a seu favor."
 tradition_wetlanders_name:0 "Pantaneiros"
 tradition_winter_warriors_desc:0 "Esta cultura está acostumada à realidade de ventos rigorosos e frio intenso."
 tradition_winter_warriors_name:0 "Guerreiros do Inverno"
 tradition_xenophilic_desc:0 "Esta cultura abraça a todos e genuinamente se fascina por todas as culturas."
 tradition_xenophilic_name:0 "Xenofílico"
 tradition_zealous_people_desc:0 "As pessoas desta cultura são particularmente fervorosas e dedicadas à sua fé."
 tradition_zealous_people_name:0 "Crentes Fervorosos"
 traditionalist_discount_desc:0 "A [culture|E] foi direcionada ao tradicionalismo pelo seu [culture_head|E]"
 traditions_cheaper_value:0 "A partir das [traditions|E]"
 trait_culture_disinherited:0 "Deserdado"
 trait_culture_disinherited_desc:0 "Este personagem foi deserdado pelas tradições de sua cultura e não pode herdar nenhum título."
 tribals_can_into_temples_name:0 "$temple_next_level_name$"
 turkic_or_mongolic_and_capital_in_steppe_trigger:0 "A [culture|E] deve ser da [heritage|E] turca ou mongólica, ou sua capital deve estar na estepe"
 turkic_or_mongolic_desc:0 "A [culture|E] não possui a [heritage|E] Turca ou Mongólica"
 unlock_co_emperors_name:0 "[duumvirates|E]"
 unlock_junior_emperors_name:0 "[nominal_duumvirates|E]"
 unlock_maa_mangudai_name:0 "[GetCultureTradition('tradition_mpo_wolves_of_the_deep_steppe').GetName]"
 unlock_voluntary_laampdom_name:0 "[GetCultureTradition('tradition_swords_for_hire').GetName], [GetCultureTradition('tradition_horse_lords').GetName], [GetCultureTradition('tradition_futuwaa').GetName], [GetCultureTradition('tradition_ep3_audacious_cadets').GetName], [GetCultureTradition('tradition_hird').GetName], [GetCultureTradition('tradition_caravaneers').GetName], [GetCultureTradition('tradition_diasporic').GetName], ou [GetCultureTradition('tradition_fp1_coastal_warriors').GetName]"
 vegetarian_building_ban_name:0 "#V $tradition_vegetarianism_name$#!"
 vegetarian_next_level_cereal_fields_name:0 "#V $tradition_vegetarianism_name$#!"
 warrior_lodges_lift_restrictions_name:0 "#V $tradition_reverence_for_veterans_name$#!"
 watermills_forestries_unlock_name:0 "#V $tradition_forest_wardens_name$#!"
 watermills_windmills_cities_name:0 "#V $tradition_city_keepers_name$#!"
 windmills_hill_farms_unlock_name:0 "#V $tradition_hill_dwellers_name$#!"
 winter_percentage_desc:0 "A [culture|E] não possui #V 30%#! de seus [counties|E] em uma [region|E] de inverno"
 winter_soldier_affinity_desc:0 "O [culture_head|E] não possui o [trait|E] [GetTrait('winter_soldier').GetName( GetNullCharacter )]"
