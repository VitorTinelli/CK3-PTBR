 recruit_gardener_decision:0 "Recrutar Jardineiro"
 recruit_gardener_decision_confirm:0 "$invite_knights_decision_confirm$"
 recruit_gardener_decision_desc:0 "Nós, [ROOT.Char.GetCulture.GetCollectiveNoun], temos amplo conhecimento em moldar e cuidar de jardins de todos os tipos. Existem muitos jardineiros habilidosos por aí cuja expertise posso aproveitar ao máximo."
