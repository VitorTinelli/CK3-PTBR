 culture_emergence_events.0005.b:0 "Romansh fará parte do mosaico de [new_culture_scope.GetName]."
 culture_emergence_events.0005.c.tt:0 "[new_culture_scope.GetNameNoTooltip] permanecerá como está"
 culture_emergence_events.0005.c:0 "Esta língua camponesa não tem valor para [new_culture_scope.GetName]!"
 culture_emergence_events.0005.desc:0 "Enquanto [county_scope.GetNameNoTierNoTooltip] celebra o surgimento de [new_culture_scope.GetName], notei que algumas das pessoas mais #italic rústicas#! da terra ainda falam um dialeto que não é bem o que eu imaginava que [new_culture_scope.GetNameNoTooltip] fosse.\n\nUm camponês está próximo à estrada enquanto passo, conversando com alguém nos campos. 'Ei, você aí!' eu trovejo. 'Que língua é essa que você fala?'\n\n[Select_CString( rustic_peasant.IsFemale, 'A', 'O' )] [rustic_peasant.GetWomanMan] pausa. 'Suponho,' responde lentamente em [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip], 'simplesmente chamamos de #italic Romansh#!.'\n\n'Romansh', é? É isso que meu povo realmente é?"
