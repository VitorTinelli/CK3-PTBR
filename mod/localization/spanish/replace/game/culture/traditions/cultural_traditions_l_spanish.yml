 recruit_open_specialist_decision:0 "Recrutar Especialista em Planícies"
 recruit_open_specialist_decision_confirm:0 "$invite_knights_decision_confirm$"
 recruit_open_specialist_decision_desc:0 "Num mar de gramados, a manobra é quase completamente irrestrita, os [ROOT.Char.GetCulture.GetCollectiveNoun] dominaram a arte de como aproveitar ao máximo essa mobilidade. Dentro de nossas próprias fileiras, seríamos capazes de encontrar rapidamente comandantes que usariam nossas forças para envolver e cercar."
 recruit_open_specialist_decision_tooltip:0 "$recruit_open_specialist_decision.tt$"
 recruit_open_specialist_decision_valid_tt:0 "Sua [culture|E] deve permitir recrutar um [commander|E] com o [GetTrait('open_terrain_expert').GetName( GetNullCharacter )] [trait|E], ou você deve ser um [martial|E] [minister|E] ou ter o [GetTrait('nomadic_philosophy').GetName( GetNullCharacter )] [trait|E]"
 recruit_terrain_specialist_decision:0 "Recrutar Especialista em Terreno"
 recruit_terrain_specialist_decision_confirm:0 "Recrutar"
 recruit_terrain_specialist_decision_desc:0 "Nossos inimigos são inumeráveis, e nossos exércitos nem sempre podem escolher os terrenos nos quais iremos enfrentá-los.\n\nPara garantir a vitória em todas as frentes, precisamos de comandantes que possam habilmente transformar até mesmo a própria terra em nossa vantagem."
 recruit_terrain_specialist_decision_minister_tooltip:0 "Você busca um [commander|E] altamente habilidoso com o [commander_trait|E] selecionado para se juntar à sua [court|E]\n\n#weak Como um [minister|E], você pode recrutar qualquer tipo de comandante#!"
