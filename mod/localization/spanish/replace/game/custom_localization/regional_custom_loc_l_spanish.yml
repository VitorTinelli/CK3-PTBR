l_spanish:
 ARRACK_GLOSS:0 "Uma aguardente forte destilada de seiva de palmeira ou cana-de-açúcar."
 BOCHET_GLOSS:0 "Uma bebida condimentada feita de mel fervido."
 COMMANDARIA_GLOSS:0 "Um vinho de sobremesa doce de Chipre."
 DJINN_GLOSS:0 "Um espírito de fogo sem fumaça do folclore do Oriente Médio, capaz de mudar de forma e enganar."
 DOMOVOI_GLOSS:0 "Um espírito doméstico eslavo que protege a casa, mas prega peças quando ofendido ou negligenciado."
 DUENDE_GLOSS:0 "Um pequeno espírito travesso e esquivo do folclore ibérico, que causa pequenos caos nas casas."
 DUNGEON_CONCEPT_plural:0 "[dungeons|E]"
 EBU_GOGO_GLOSS:0 "Pequenos espíritos peludos da floresta do folclore indonésio, conhecidos por imitar a fala humana e roubar comida ou pequenos objetos das aldeias."
 GULYABANI_GLOSS:0 "Um ghoul enorme e peludo do folclore turco, conhecido por assombrar lugares desolados e atacar viajantes solitários à noite."
 HIPPOCRAS_GLOSS:0 "Um vinho doce condimentado."
 HUANGJIU_GLOSS:0 "Um vinho da China fermentado de arroz ou milho-miúdo."
 HULIJING_GLOSS:0 "Um espírito raposa chinês com poderes de metamorfose, famoso por sua astúcia e engano sedutor."
 IFRIT_GLOSS:0 "Um espírito rebelde e de fogo do folclore norte-africano, associado à enganação e força."
 JACKFRUIT_GLOSS:0 "Uma fruta tropical enorme, a #bold jaca #! produz bulbos dourados doces e muito perfumados quando maduros."
 JIN_KURCACI_GLOSS:0 "Pequenos seres semelhantes a humanos do folclore das Malucas, conhecidos por habitar florestas e montanhas, oferecendo orientação ou travessuras a quem encontram."
 JUJUBE_GLOSS:0 "A #bold jujuba#!, ou tamareira chinesa, é uma pequena fruta avermelhada, crocante e semelhante a uma maçã quando fresca, e enrugada como tâmara depois de seca."
 KABOUTER_GLOSS:0 "Uma criatura semelhante a um gnomo do folclore holandês, que ajuda em tarefas ou prega peças quando desrespeitada."
 KALLIKANTZAROS_GLOSS:0 "Um goblin malévolo que emerge durante os doze dias do Natal para causar travessuras e caos."
 KAMAITACHI_GLOSS:0 "Um espírito doninha que cavalga o vento do norte do Japão, conhecido por cortar carne sem dor."
 KASTRON_GLOSS:0 "Originalmente referindo-se a uma fortaleza ou cidadela, o #bold kástron#! passou a significar a cidade bizantina como um todo."
 KOBOLD_GLOSS:0 "Um espírito doméstico do folclore alemão, alternando entre tarefas úteis e travessuras quando provocado."
 KOUMISS_GLOSS:0 "Uma bebida levemente azeda de leite de égua fermentado."
 KUMIHO_GLOSS:0 "Um espírito raposa de nove caudas da mitologia coreana, conhecido por enganar e atacar humanos."
 KUTKH_GLOSS:0 "Um espírito corvo presente nas tradições siberianas, tanto criador quanto travesso."
 KVASS_GLOSS:0 "Uma bebida eslava de pão levemente fermentada."
 LONGAN_GLOSS:0 "Um parente pequeno e doce da lichia, o #bold longan #! mostra uma semente escura através de sua polpa pálida, ganhando o nome de 'olho de dragão'."
 LOQUAT_GLOSS:0 "A #bold nêspera #! é uma fruta dourada pequena e picante do Oriente, valorizada como uma das primeiras a amadurecer na primavera."
 LUTIN_GLOSS:0 "Um pequeno espírito doméstico ou florestal do folclore francês, conhecido por travessuras como embaraçar cabelos e esconder objetos."
 LYCHEE_GLOSS:0 "Uma fruta perfumada com casca vermelha áspera e polpa translúcida, a #bold lichia #! era tão cobiçada que os imperadores Tang a mandavam carregar para o norte por correios em revesamento."
 MALVASIA_GLOSS:0 "Um vinho ricamente doce das ilhas gregas."
 MANGOSTEEN_GLOSS:0 "O #bold mangostão #! esconde gomos branco-neve, doces e ácidos dentro de uma casca roxa espessa, mais tarde celebrado como a rainha das frutas."
 MAZAPEGUL_GLOSS:0 "Um espírito noturno travesso do folclore italiano, conhecido por assombrar quartos, trançar crinas de cavalos e sentar-se no peito dos dorminhocos causando pesadelos."
 MEDLAR_GLOSS:0 "Um pequeno pomo marrom da família das rosas, a #bold nêspera-germânica #! é consumida apenas quando amolecida, um agrado favorito do banquete medieval."
 METHEGLIN_GLOSS:0 "Um hidromel condimentado ou medicinal."
 MRENH_KONGVEAL_GLOSS:0 "Pequenos espíritos esquivos do folclore Khmer, conhecidos por travessuras brincalhonas e papel protetor sobre animais e viajantes."
 MULBERRY_GLOSS:0 "Uma baga escura e macia, delicada demais para viajar longe, de modo que a doçura da #bold amora #! era um luxo fugaz consumido perto da árvore."
 NINKI_NANKA_GLOSS:0 "Um espírito temível, semelhante a um dragão, dos pântanos da África Ocidental, acreditado trazer morte àqueles que o veem."
 ORANG_BUNIAN_GLOSS:0 "Espíritos invisíveis que habitam florestas do folclore de Bornéu, conhecidos por interagir com humanos, às vezes desviando-os ou causando travessuras."
 PENANGGALAN_GLOSS:0 "Um espírito cabeça flutuante do folclore malaio, que aparenta ser humano durante o dia e aterrorizante à noite."
 PERRY_GLOSS:0 "Uma bebida feita de peras fermentadas."
 PERSIMMON_GLOSS:0 "Uma fruta laranja doce como mel do Leste Asiático, o #bold caqui #! é amadurecido até ficar macio ou seco em bolos planos."
 PHITAIHONG_GLOSS:0 "Um fantasma vingativo da tradição tailandesa, formado por uma morte súbita ou violenta, conhecido por assombrar e enganar."
 PIMENT_GLOSS:0 "Um vinho doce condimentado."
 PIXIE_GLOSS:0 "Um pequeno espírito alado do folclore celta e britânico, conhecido por travessuras e por desorientar viajantes."
 POPOBAWA_GLOSS:0 "Um espírito semelhante a um morcego do folclore suaíli, conhecido por espalhar medo à noite através de metamorfose e tormento psicológico."
 PRUNELLE_GLOSS:0 "Um licor aromatizado com ameixa-branca ou abrunho."
 RAKSHASA_GLOSS:0 "Um metamorfógeno malévolo da mitologia indiana, habilidoso em ilusões e enganos."
 RETSINA_GLOSS:0 "Um vinho branco da Grécia, aromatizado com resina de pinho."
 ROLANGS_GLOSS:0 "Um cadáver reanimado do folclore tibetano, conhecido por seus movimentos rígidos e intenções malévolas."
 RUMNEY_GLOSS:0 "Um vinho doce da Grécia, enviado para o oeste para as cortes latinas."
 SACK_WINE_GLOSS:0 "Um vinho branco fortificado da Ibéria."
 SAKE_GLOSS:0 "Um vinho de arroz do Japão, bebido morno ou frio."
 SHARBAH_GLOSS:0 "Uma bebida de frutas adoçada."
 SHIRAZ_WHITE_GLOSS:0 "Um vinho pálido dos vinhedos de Shiraz."
 SLIVOVITZ_GLOSS:0 "Uma aguardente forte de ameixa das terras eslavas."
 SMALL_BEER_GLOSS:0 "Uma cerveja fraca do dia a dia, mais segura que a água para o povo comum."
 SOMA_GLOSS:0 "Uma bebida ritual sagrada dos antigos indo-iranianos."
 STOCKADE_CONCEPT:0 "[stockade|E]"
 STOCKADE_CONCEPT_plural:0 "[stockades|E]"
 TAMARIND_GLOSS:0 "O #bold tamarindo #! é uma vagem marrom cheia de polpa pegajosa, doce e ácida, apreciada como doce e valorizada como remédio refrescante."
 TANUKI_GLOSS:0 "Um espírito guaxinim-dog metamórfico do folclore japonês, conhecido por ilusões e travessuras brincalhonas."
 THARRA_GLOSS:0 "Uma bebida destilada forte e rústica da Índia."
 TIKBALANG_GLOSS:0 "Um espírito alto com cabeça de cavalo do folclore filipino, conhecido por desorientar viajantes e pregar peças nas florestas."
 TODDY_GLOSS:0 "Uma bebida de seiva de palmeira fermentada."
 TOMTE_GLOSS:0 "Um espírito escandinavo dito proteger fazendas e animais, mas propenso a travessuras se irritado."
 TUBA_GLOSS:0 "Um vinho de seiva de coco fermentada das ilhas filipinas."
