l_spanish:
 GeneratePoem_Intro_Rhyming_Incompetence_01_A_01:0 "[Select_CString( ROOT.Char.IsFemale, 'Uma', 'Um' )] [ROOT.Var('poem_subject').Char.GetLadyLord] não é nada sem sabedoria,"
 GeneratePoem_Intro_Rhyming_Incompetence_01_A_02:0 "$GeneratePoem_Intro_Rhyming_Incompetence_01_A_01$"
 GeneratePoem_Intro_Rhyming_Incompetence_01_A_03:0 "$GeneratePoem_Intro_Rhyming_Incompetence_01_A_01$"
 GeneratePoem_Intro_Rhyming_Incompetence_01_B_01:0 "Caso contrário, suas ações falham sua visão,"
 GeneratePoem_Intro_Rhyming_Incompetence_01_B_02:0 "Uma cabeça vazia, com pensamentos não refletidos,"
 GeneratePoem_Intro_Rhyming_Incompetence_01_B_03:0 "Uma paródia zombeteira, um cisma esperando,"
 GeneratePoem_Intro_Rhyming_Incompetence_02_A_01:0 "Algumas [ROOT.Var('poem_subject').Char.GetWomenMen] simplesmente fazem todos os outros se sentirem desconfortáveis,"
 GeneratePoem_Intro_Rhyming_Incompetence_02_A_02:0 "$GeneratePoem_Intro_Rhyming_Incompetence_02_A_01$"
 GeneratePoem_Intro_Rhyming_Incompetence_02_A_03:0 "$GeneratePoem_Intro_Rhyming_Incompetence_02_A_01$"
 GeneratePoem_Intro_Rhyming_Incompetence_02_B_01:0 "Sua aparência é tão pobre que as piadas vêm facilmente,"
 GeneratePoem_Intro_Rhyming_Incompetence_02_B_02:0 "Seus traços são desajeitados, sua respiração ofegante,"
 GeneratePoem_Intro_Rhyming_Incompetence_02_B_03:0 "De tal forma que ninguém ao seu redor pode falar livremente,"
 GeneratePoem_Intro_Rhyming_Incompetence_03_A_01:0 "Às vezes o Destino é muito cruel,"
 GeneratePoem_Intro_Rhyming_Incompetence_03_A_02:0 "$GeneratePoem_Intro_Rhyming_Incompetence_03_A_01$"
 GeneratePoem_Intro_Rhyming_Incompetence_03_A_03:0 "$GeneratePoem_Intro_Rhyming_Incompetence_03_A_01$"
 GeneratePoem_Intro_Rhyming_Incompetence_03_B_01:0 "Deixando nobres e camponeses sob tal regra,"
 GeneratePoem_Intro_Rhyming_Incompetence_03_B_02:0 "Deixando um reino se tornar tal cloaca,"
 GeneratePoem_Intro_Rhyming_Incompetence_03_B_03:0 "Colocando a coroa de [Select_CString( ROOT.Char.IsFemale, 'uma', 'um' )] [ROOT.Var('poem_subject').Char.GetLadyLord] em tal mula,"
 GeneratePoem_Intro_Rhyming_Legacy_01_A_01:0 "Os mais poderosos [ROOT.Var('poem_subject').Char.GetWomenMen] devem deixar esta Terra,"
 GeneratePoem_Intro_Rhyming_Legacy_01_A_02:0 "$GeneratePoem_Intro_Rhyming_Legacy_01_A_01$"
 GeneratePoem_Intro_Rhyming_Legacy_01_A_03:0 "$GeneratePoem_Intro_Rhyming_Legacy_01_A_01$"
 GeneratePoem_Intro_Rhyming_Legacy_01_B_01:0 "Suas façanhas, seus atos, seu valor inflado"
 GeneratePoem_Intro_Rhyming_Legacy_01_B_02:0 "E esperança de boas palavras não é escassa"
 GeneratePoem_Intro_Rhyming_Legacy_01_B_03:0 "Não importa em que reinos deram à luz,"
 GeneratePoem_Intro_Rhyming_Legacy_02_A_01:0 "[ROOT.Var('poem_subject').Char.GetWomenMen|U] não precisam temer à medida que as vidas partem,"
 GeneratePoem_Intro_Rhyming_Legacy_02_A_02:0 "$GeneratePoem_Intro_Rhyming_Legacy_02_A_01$"
 GeneratePoem_Intro_Rhyming_Legacy_02_A_03:0 "$GeneratePoem_Intro_Rhyming_Legacy_02_A_01$"
 GeneratePoem_Intro_Rhyming_Legacy_02_B_01:0 "Desde que deixem para trás a arte,"
 GeneratePoem_Intro_Rhyming_Legacy_02_B_02:0 "Cruzando a morte tranquila com coração nobre,"
 GeneratePoem_Intro_Rhyming_Legacy_02_B_03:0 "Embora possa dilacerar seus afligidos,"
 GeneratePoem_Intro_Rhyming_Legacy_03_A_01:0 "Que [ROOT.Var('poem_subject').Char.GetWomanMan] não espera descansar quando cansado,"
 GeneratePoem_Intro_Rhyming_Legacy_03_A_02:0 "$GeneratePoem_Intro_Rhyming_Legacy_03_A_01$"
 GeneratePoem_Intro_Rhyming_Legacy_03_A_03:0 "$GeneratePoem_Intro_Rhyming_Legacy_03_A_01$"
 GeneratePoem_Intro_Rhyming_Legacy_03_B_01:0 "Não importa sua riqueza e tesouro adquiridos?"
 GeneratePoem_Intro_Rhyming_Legacy_03_B_02:0 "Em memória gloriosa, com desejo do coração?"
 GeneratePoem_Intro_Rhyming_Legacy_03_B_03:0 "Seus trabalhos cercando o feliz e aposentado?"
 GeneratePoem_Intro_Rhyming_Mourning_01_A_01:0 "Não importa quantos dias passem e se dobrem,"
 GeneratePoem_Intro_Rhyming_Mourning_01_A_02:0 "$GeneratePoem_Intro_Rhyming_Mourning_01_A_01$"
 GeneratePoem_Intro_Rhyming_Mourning_01_A_03:0 "$GeneratePoem_Intro_Rhyming_Mourning_01_A_01$"
 GeneratePoem_Intro_Rhyming_Mourning_01_B_01:0 "A vida sem [ROOT.Var('poem_subject').Char.GetSheHe] é um pântano doente,"
 GeneratePoem_Intro_Rhyming_Mourning_01_B_02:0 "O mundo parece distante, como se através de vidro,"
 GeneratePoem_Intro_Rhyming_Mourning_01_B_03:0 "Os ventos sussurram friamente pela grama,"
 GeneratePoem_Intro_Rhyming_Mourning_02_A_01:0 "Quando uma tão bela presença está oculta à vista,"
 GeneratePoem_Intro_Rhyming_Mourning_02_A_02:0 "$GeneratePoem_Intro_Rhyming_Mourning_02_A_01$"
 GeneratePoem_Intro_Rhyming_Mourning_02_A_03:0 "$GeneratePoem_Intro_Rhyming_Mourning_02_A_01$"
 GeneratePoem_Intro_Rhyming_Mourning_02_B_01:0 "Nós gritamos e choramos, não importa a nossa força,"
 GeneratePoem_Intro_Rhyming_Mourning_02_B_02:0 "A dor certamente parece uma ofensa pessoal,"
 GeneratePoem_Intro_Rhyming_Mourning_02_B_03:0 "Aqueles que ficaram devem sentir uma maldição,"
 GeneratePoem_Intro_Rhyming_Mourning_03_A_01:0 "Quão cruel é a aleatoriedade do destino,"
 GeneratePoem_Intro_Rhyming_Mourning_03_A_02:0 "$GeneratePoem_Intro_Rhyming_Mourning_03_A_01$"
 GeneratePoem_Intro_Rhyming_Mourning_03_A_03:0 "$GeneratePoem_Intro_Rhyming_Mourning_03_A_01$"
 GeneratePoem_Intro_Rhyming_Mourning_03_B_01:0 "Para privar o mundo de uma dança tão bela,"
 GeneratePoem_Intro_Rhyming_Mourning_03_B_02:0 "Para deixar [ROOT.Var('poem_subject').Char.GetSheHe] de lado sem sequer um olhar,"
 GeneratePoem_Intro_Rhyming_Mourning_03_B_03:0 "Para nos deixar todos nessa maldita transe,"
 GeneratePoem_Intro_Rhyming_Romance_01_A_01:0 "Oh, como um semblante tão belo reluz,"
 GeneratePoem_Intro_Rhyming_Romance_01_A_02:0 "$GeneratePoem_Intro_Rhyming_Romance_01_A_01$"
 GeneratePoem_Intro_Rhyming_Romance_01_A_03:0 "$GeneratePoem_Intro_Rhyming_Romance_01_A_01$"
 GeneratePoem_Intro_Rhyming_Romance_01_B_01:0 "Cintilante, reluzente, assombrando meus sonhos,"
 GeneratePoem_Intro_Rhyming_Romance_01_B_02:0 "Tão perfeitamente puro que eu me desfaço em pedaços,"
 GeneratePoem_Intro_Rhyming_Romance_01_B_03:0 "Ser pego no seu sorriso é tão aquecedor quanto os raios de sol,"
 GeneratePoem_Intro_Rhyming_Romance_02_A_01:0 "Aquela deliciosa [ROOT.Var('poem_subject').Char.GetWomanMan] que me encanta tanto,"
 GeneratePoem_Intro_Rhyming_Romance_02_A_02:0 "$GeneratePoem_Intro_Rhyming_Romance_02_A_01$"
 GeneratePoem_Intro_Rhyming_Romance_02_A_03:0 "$GeneratePoem_Intro_Rhyming_Romance_02_A_01$"
 GeneratePoem_Intro_Rhyming_Romance_02_B_01:0 "Onde, oh onde, foi aquela [ROOT.Var('poem_subject').Char.GetWomanMan]?"
 GeneratePoem_Intro_Rhyming_Romance_02_B_02:0 "Cujo rosto parece sempre brilhar,"
 GeneratePoem_Intro_Rhyming_Romance_02_B_03:0 "À qual minha lealdade eu eternamente devo,"
 GeneratePoem_Intro_Rhyming_Romance_03_A_01:0 "Eu me pergunto quais segredos sua máscara protege?"
 GeneratePoem_Intro_Rhyming_Romance_03_A_02:0 "$GeneratePoem_Intro_Rhyming_Romance_03_A_01$"
 GeneratePoem_Intro_Rhyming_Romance_03_A_03:0 "$GeneratePoem_Intro_Rhyming_Romance_03_A_01$"
 GeneratePoem_Intro_Rhyming_Romance_03_B_01:0 "Que maravilhas ocultas? Que assuntos disfarçados?"
 GeneratePoem_Intro_Rhyming_Romance_03_B_02:0 "Certamente esta [ROOT.Var('poem_subject').Char.GetWomanMan] está livre de defeitos,"
 GeneratePoem_Intro_Rhyming_Romance_03_B_03:0 "É um escudo ou apenas um afeto?"
 GeneratePoem_Intro_Rhyming_Strife_01_A_01:0 "Quando a guerra de penas vermelhas chegar às suas terras,"
 GeneratePoem_Intro_Rhyming_Strife_01_A_02:0 "$GeneratePoem_Intro_Rhyming_Strife_01_A_01$"
 GeneratePoem_Intro_Rhyming_Strife_01_A_03:0 "$GeneratePoem_Intro_Rhyming_Strife_01_A_01$"
 GeneratePoem_Intro_Rhyming_Strife_01_B_01:0 "Nunca encontrará mãos mais ágeis,"
 GeneratePoem_Intro_Rhyming_Strife_01_B_02:0 "Não poderia ter esperado por esse briguento,"
 GeneratePoem_Intro_Rhyming_Strife_01_B_03:0 "Todos flashes de ferro e exigências gritadas,"
 GeneratePoem_Intro_Rhyming_Strife_02_A_01:0 "Onde outros [ROOT.Var('poem_subject').Char.GetWomenMen] falam palavras prateadas,"
 GeneratePoem_Intro_Rhyming_Strife_02_A_02:0 "$GeneratePoem_Intro_Rhyming_Strife_02_A_01$"
 GeneratePoem_Intro_Rhyming_Strife_02_A_03:0 "$GeneratePoem_Intro_Rhyming_Strife_02_A_01$"
 GeneratePoem_Intro_Rhyming_Strife_02_B_01:0 "Nossa [ROOT.Var('poem_subject').Char.Custom('GetHeroineHero')], [ROOT.Var('poem_subject').Char.GetHerselfHimself], em corpetes de ferro"
 GeneratePoem_Intro_Rhyming_Strife_02_B_02:0 "[ROOT.Var('poem_subject').Char.GetSheHe|U] lidera soldados em manadas de ferro,"
 GeneratePoem_Intro_Rhyming_Strife_02_B_03:0 "[ROOT.Var('poem_subject').Char.GetSheHe|U] faz bons negócios ao limpar a sujeira,"
 GeneratePoem_Intro_Rhyming_Strife_03_A_01:0 "Embora o conflito traga a ira para todos algum dia,"
 GeneratePoem_Intro_Rhyming_Strife_03_A_02:0 "$GeneratePoem_Intro_Rhyming_Strife_03_A_01$"
 GeneratePoem_Intro_Rhyming_Strife_03_A_03:0 "$GeneratePoem_Intro_Rhyming_Strife_03_A_01$"
 GeneratePoem_Intro_Rhyming_Strife_03_B_01:0 "É a espada desta [ROOT.Var('poem_subject').Char.GetWomanMan] que mantém a morte à distância,"
 GeneratePoem_Intro_Rhyming_Strife_03_B_02:0 "Nossa [ROOT.Var('poem_subject').Char.Custom('GetHeroineHero')] vive para entrar na batalha!"
 GeneratePoem_Intro_Rhyming_Strife_03_B_03:0 "Ninguém é tão amaldiçoado quanto a presa desta [ROOT.Var('poem_subject').Char.Custom('GetHeroineHeroPossessive')],"
 GeneratePoem_Outro_Rhyming_Incompetence_01_A_01:0 "Oh, que fados cruéis o Destino distribui,"
 GeneratePoem_Outro_Rhyming_Incompetence_01_A_02:0 "$GeneratePoem_Outro_Rhyming_Incompetence_01_A_01$"
 GeneratePoem_Outro_Rhyming_Incompetence_01_A_03:0 "$GeneratePoem_Outro_Rhyming_Incompetence_01_A_01$"
 GeneratePoem_Outro_Rhyming_Incompetence_01_B_01:0 "Quando um palerma desse porte exerce tanto poder?"
 GeneratePoem_Outro_Rhyming_Incompetence_01_B_02:0 "Quando o mundo permite que tal estupidez floresça?"
 GeneratePoem_Outro_Rhyming_Incompetence_01_B_03:0 "Quando todos devem observar tal grosseiro terrível?"
 GeneratePoem_Outro_Rhyming_Incompetence_02_A_01:0 "Quando um [ROOT.Var('poem_subject').Char.GetWomanMan] é vista a existir,"
 GeneratePoem_Outro_Rhyming_Incompetence_02_A_02:0 "$GeneratePoem_Outro_Rhyming_Incompetence_02_A_01$"
 GeneratePoem_Outro_Rhyming_Incompetence_02_A_03:0 "$GeneratePoem_Outro_Rhyming_Incompetence_02_A_01$"
 GeneratePoem_Outro_Rhyming_Incompetence_02_B_01:0 "Dá vontade de dar um soco!"
 GeneratePoem_Outro_Rhyming_Incompetence_02_B_02:0 "Todos esperamos que ela(e) tenha cistos mortais!"
 GeneratePoem_Outro_Rhyming_Incompetence_02_B_03:0 "É óbvio que o Destino está irritado!"
 GeneratePoem_Outro_Rhyming_Incompetence_03_A_01:0 "A própria vida murcha no seu rastro."
 GeneratePoem_Outro_Rhyming_Incompetence_03_A_02:0 "$GeneratePoem_Outro_Rhyming_Incompetence_03_A_01$"
 GeneratePoem_Outro_Rhyming_Incompetence_03_A_03:0 "$GeneratePoem_Outro_Rhyming_Incompetence_03_A_01$"
 GeneratePoem_Outro_Rhyming_Incompetence_03_B_01:0 "E todo o mundo sente dor e sofrimento."
 GeneratePoem_Outro_Rhyming_Incompetence_03_B_02:0 "Nenhuma ideia ruim é suficiente para saciar sua luxúria."
 GeneratePoem_Outro_Rhyming_Incompetence_03_B_03:0 "Essa malfadada [ROOT.Var('poem_subject').Char.GetWomanMan], erro do Destino."
 GeneratePoem_Outro_Rhyming_Legacy_01_A_01:0 "E esperam apenas pela graça da memória,"
 GeneratePoem_Outro_Rhyming_Legacy_01_A_02:0 "$GeneratePoem_Outro_Rhyming_Legacy_01_A_01$"
 GeneratePoem_Outro_Rhyming_Legacy_01_A_03:0 "$GeneratePoem_Outro_Rhyming_Legacy_01_A_01$"
 GeneratePoem_Outro_Rhyming_Legacy_01_B_01:0 "Seu tempo de conquista acabou, acelerado..."
 GeneratePoem_Outro_Rhyming_Legacy_01_B_02:0 "Para que sua história encontre um verdadeiro lugar..."
 GeneratePoem_Outro_Rhyming_Legacy_01_B_03:0 "Para que todo o mundo se lembre de seu rosto!"
 GeneratePoem_Outro_Rhyming_Legacy_02_A_01:0 "É raro o suficiente para que [ROOT.Var('poem_subject').Char.GetWomenMen] admitam,"
 GeneratePoem_Outro_Rhyming_Legacy_02_A_02:0 "$GeneratePoem_Outro_Rhyming_Legacy_02_A_01$"
 GeneratePoem_Outro_Rhyming_Legacy_02_A_03:0 "$GeneratePoem_Outro_Rhyming_Legacy_02_A_01$"
 GeneratePoem_Outro_Rhyming_Legacy_02_B_01:0 "Que tudo o que deixam para trás é merda."
 GeneratePoem_Outro_Rhyming_Legacy_02_B_02:0 "Que seus feitos deixam aqueles que ficaram depois divididos."
 GeneratePoem_Outro_Rhyming_Legacy_02_B_03:0 "Que, dada a chance, eles mudariam bastante."
 GeneratePoem_Outro_Rhyming_Legacy_03_A_01:0 "E quando a hora final se aproxima,"
 GeneratePoem_Outro_Rhyming_Legacy_03_A_02:0 "$GeneratePoem_Outro_Rhyming_Legacy_03_A_01$"
 GeneratePoem_Outro_Rhyming_Legacy_03_A_03:0 "$GeneratePoem_Outro_Rhyming_Legacy_03_A_01$"
 GeneratePoem_Outro_Rhyming_Legacy_03_B_01:0 "Esperança, devem eles, que seus nomes tragam alegria!"
 GeneratePoem_Outro_Rhyming_Legacy_03_B_02:0 "Seus nomes vivem, nos lábios dos pares..."
 GeneratePoem_Outro_Rhyming_Legacy_03_B_03:0 "Será que a vida ecoará pelos anos?"
 GeneratePoem_Outro_Rhyming_Mourning_01_A_01:0 "Sozinho, desolado, sem aquela doce [ROOT.Var('poem_subject').Char.GetWomanMan],"
 GeneratePoem_Outro_Rhyming_Mourning_01_A_02:0 "$GeneratePoem_Outro_Rhyming_Mourning_01_A_01$"
 GeneratePoem_Outro_Rhyming_Mourning_01_A_03:0 "$GeneratePoem_Outro_Rhyming_Mourning_01_A_01$"
 GeneratePoem_Outro_Rhyming_Mourning_01_B_01:0 "Nossos corações, mentes e almas, todos amaldiçoados..."
 GeneratePoem_Outro_Rhyming_Mourning_01_B_02:0 "Nós vagueamos, perguntando-nos onde a dor começou?"
 GeneratePoem_Outro_Rhyming_Mourning_01_B_03:0 "Quem entre nós terminará sua jornada em seguida?"
 GeneratePoem_Outro_Rhyming_Mourning_02_A_01:0 "Sem [ROOT.Var('poem_subject').Char.GetSheHe], nós somos apenas cascas vazias,"
 GeneratePoem_Outro_Rhyming_Mourning_02_A_02:0 "$GeneratePoem_Outro_Rhyming_Mourning_02_A_01$"
 GeneratePoem_Outro_Rhyming_Mourning_02_A_03:0 "$GeneratePoem_Outro_Rhyming_Mourning_02_A_01$"
 GeneratePoem_Outro_Rhyming_Mourning_02_B_01:0 "Todos os corações solitários em celas separadas..."
 GeneratePoem_Outro_Rhyming_Mourning_02_B_02:0 "Nossa miséria aumenta, nossos corações se rebelam."
 GeneratePoem_Outro_Rhyming_Mourning_02_B_03:0 "Cada um de nós um pequeno cadáver, um vazio, em paralelo."
 GeneratePoem_Outro_Rhyming_Mourning_03_A_01:0 "Quando um tão grande cai tão baixo,"
 GeneratePoem_Outro_Rhyming_Mourning_03_A_02:0 "$GeneratePoem_Outro_Rhyming_Mourning_03_A_01$"
 GeneratePoem_Outro_Rhyming_Mourning_03_A_03:0 "$GeneratePoem_Outro_Rhyming_Mourning_03_A_01$"
 GeneratePoem_Outro_Rhyming_Mourning_03_B_01:0 "É raro que alguém escape, menos, com uma cicatriz."
 GeneratePoem_Outro_Rhyming_Mourning_03_B_02:0 "Os caprichos cruéis do destino não são simplesmente bizarros?"
 GeneratePoem_Outro_Rhyming_Mourning_03_B_03:0 "Todas as vidas, todos os planos, são deixados em aberto."
 GeneratePoem_Outro_Rhyming_Romance_01_A_01:0 "Embora, talvez, [ROOT.Var('poem_subject').Char.GetSheHe] vá quebrar meu coração ainda?"
 GeneratePoem_Outro_Rhyming_Romance_01_A_02:0 "$GeneratePoem_Outro_Rhyming_Romance_01_A_01$"
 GeneratePoem_Outro_Rhyming_Romance_01_A_03:0 "$GeneratePoem_Outro_Rhyming_Romance_01_A_01$"
 GeneratePoem_Outro_Rhyming_Romance_01_B_01:0 "Mas por essa [ROOT.Var('poem_subject').Char.GetWomanMan], eu aceito essa aposta."
 GeneratePoem_Outro_Rhyming_Romance_01_B_02:0 "Mas pelo menos sua memória, eu nunca esquecerei."
 GeneratePoem_Outro_Rhyming_Romance_01_B_03:0 "Mas não tentar seria um arrependimento maior."
 GeneratePoem_Outro_Rhyming_Romance_02_A_01:0 "Porque a sua vida é minha vida e nossa vida por vir,"
 GeneratePoem_Outro_Rhyming_Romance_02_A_02:0 "$GeneratePoem_Outro_Rhyming_Romance_02_A_01$"
 GeneratePoem_Outro_Rhyming_Romance_02_A_03:0 "$GeneratePoem_Outro_Rhyming_Romance_02_A_01$"
 GeneratePoem_Outro_Rhyming_Romance_02_B_01:0 "O belo começo de uma árvore genealógica."
 GeneratePoem_Outro_Rhyming_Romance_02_B_02:0 "E enquanto estou com [ROOT.Var('poem_subject').Char.GetSheHe], eu serei livre."
 GeneratePoem_Outro_Rhyming_Romance_02_B_03:0 "Tão quente e refrescante como um chá aromático."
 GeneratePoem_Outro_Rhyming_Romance_03_A_01:0 "A simples ideia do seu sorriso traz um sorriso ao meu rosto,"
 GeneratePoem_Outro_Rhyming_Romance_03_A_02:0 "$GeneratePoem_Outro_Rhyming_Romance_03_A_01$"
 GeneratePoem_Outro_Rhyming_Romance_03_A_03:0 "$GeneratePoem_Outro_Rhyming_Romance_03_A_01$"
 GeneratePoem_Outro_Rhyming_Romance_03_B_01:0 "E uma vez que esse sorriso está lá, ele fica fixo no lugar."
 GeneratePoem_Outro_Rhyming_Romance_03_B_02:0 "E faz meu coração palpitar com uma velocidade notável."
 GeneratePoem_Outro_Rhyming_Romance_03_B_03:0 "Todas as preocupações, tristezas e angústias, desaparecem sem deixar rastro."
 GeneratePoem_Outro_Rhyming_Strife_01_A_01:0 "Seus súditos provam gratidão, pois se não o fizerem,"
 GeneratePoem_Outro_Rhyming_Strife_01_A_02:0 "$GeneratePoem_Outro_Rhyming_Strife_01_A_01$"
 GeneratePoem_Outro_Rhyming_Strife_01_A_03:0 "$GeneratePoem_Outro_Rhyming_Strife_01_A_01$"
 GeneratePoem_Outro_Rhyming_Strife_01_B_01:0 "Então, à porta deles, a sua espada é trazida."
 GeneratePoem_Outro_Rhyming_Strife_01_B_02:0 "Eles aprenderão como um império é forjado."
 GeneratePoem_Outro_Rhyming_Strife_01_B_03:0 "Logo verão em que lado lutaram."
 GeneratePoem_Outro_Rhyming_Strife_02_A_01:0 "Então todos tremerão enquanto [ROOT.Var('poem_subject').Char.GetSheHe] toma o campo,"
 GeneratePoem_Outro_Rhyming_Strife_02_A_02:0 "$GeneratePoem_Outro_Rhyming_Strife_02_A_01$"
 GeneratePoem_Outro_Rhyming_Strife_02_A_03:0 "$GeneratePoem_Outro_Rhyming_Strife_02_A_01$"
 GeneratePoem_Outro_Rhyming_Strife_02_B_01:0 "E mostrará ao inimigo que não há escudo grosso o suficiente."
 GeneratePoem_Outro_Rhyming_Strife_02_B_02:0 "Todo fogo e fúria e manejando trovões."
 GeneratePoem_Outro_Rhyming_Strife_02_B_03:0 "Seus golpes ceifadores também são excessivamente duros para curar."
 GeneratePoem_Outro_Rhyming_Strife_03_A_01:0 "Então, que ninguém desafie a sua intenção corajosa,"
 GeneratePoem_Outro_Rhyming_Strife_03_A_02:0 "$GeneratePoem_Outro_Rhyming_Strife_03_A_01$"
 GeneratePoem_Outro_Rhyming_Strife_03_A_03:0 "$GeneratePoem_Outro_Rhyming_Strife_03_A_01$"
 GeneratePoem_Outro_Rhyming_Strife_03_B_01:0 "A menos que descubram onde o último desafiante foi."
 GeneratePoem_Outro_Rhyming_Strife_03_B_02:0 "A menos que desejem ser enviados ao além."
