 marco_polo_quote_desc_1:0 "Nós andamos nus porque não queremos nada deste mundo; pois viemos ao mundo nus e despidos. Quanto a não ter vergonha de mostrar nossos membros, o fato é que não pecamos com eles e, portanto, não temos mais vergonha deles do que você tem ao mostrar sua mão ou rosto ou as outras partes do seu corpo que não o levam ao pecado carnal; enquanto você usa seus membros para cometer pecado e luxúria, e assim os cobre e tem vergonha deles. Mas nós não temos mais vergonha de mostrá-los do que temos de mostrar nossos dedos, porque não pecamos com eles."
 marco_polo_quote_desc_2:0 "E eu asseguro que as mulheres compram e vendem e fazem tudo que é necessário para seus maridos e lares. Pois os homens não se preocupam com nada além de caça, guerra e falcoaria. Eles vivem de carne, leite e caça, e de ratos, que são abundantes em todo lugar."
 marco_polo_quote_desc_3:0 "Eles são lutadores robustos, excelendo em coragem e resistência. Deixe-me explicar como é que eles conseguem suportar mais do que qualquer outro homem. Muitas vezes, se necessário, eles vão ou ficam por um mês inteiro sem provisões, bebendo apenas o leite de uma égua e comendo caça que eles mesmos pegam."
 marco_polo_quote_desc_4:0 "Aqui está outro costume estranho que eu havia esquecido de descrever. Você pode considerar um fato que, quando há dois homens, um dos quais teve um filho homem que morreu aos quatro anos, ou o que você quiser, e o outro teve uma filha que também morreu, eles organizam um casamento entre eles."
 marco_polo_quote_desc_5:0 "Há certos vales grandes e profundos, aos quais não há acesso. Por isso, os homens que vão à procura de diamantes levam consigo pedaços de carne, o mais magro que conseguem, e esses eles lançam no fundo de um vale. Quando as águias veem a carne jogada, elas a atacam e a levam para algum topo rochoso. As pessoas vão aos ninhos dessas águias brancas, das quais há muitas, e em suas fezes encontram muitos diamantes que as aves engoliram ao devorar a carne que foi lançada nos vales."
 marco_polo_quote_desc_6:0 "Há uma fonte de óleo que libera uma quantidade tão grande que é suficiente para carregar muitos camelos. O uso dado a ele não é para alimento, mas como um unguento para curar distúrbios cutâneos em homens e gado, bem como outras doenças, e também é bom para queimar. Na região ao redor, nenhum outro óleo é usado em suas lâmpadas, e pessoas vêm de partes distantes para adquiri-lo."
 marco_polo_quote_desc_7:0 "Se for questionado como a população do país pode fornecer número suficiente para essas funções, e por quais meios podem ser sustentados, podemos responder que todos os idólatras mantêm de seis, oito ou dez mulheres, conforme suas circunstâncias, com as quais têm um número prodigioso de filhos. Alguns têm até trinta filhos capazes de seguir seus pais nas armas."
 marco_polo_quote_end_1:0 "Eu falo e falo, mas o ouvinte retém apenas as palavras que está esperando. Não é a voz que comanda a história: é o ouvido."
 marco_polo_quote_end_2:0 "Pois, conte como eu puder, você nunca ficaria satisfeito achando que eu estou dentro da verdade e da razão."
 marco_polo_quote_intro_1:0 "Você ouvirá por si mesmo, e isso certamente o encherá de maravilha."
 marco_polo_quote_intro_2:0 "O mundo é uma vasta tapeçaria, tecida com os fios de diferentes culturas e tradições."
