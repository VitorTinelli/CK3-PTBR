 evidence_artifact_fire:0 "Por algum motivo, a bainha da roupa do capitão está levemente chamuscada. Que curioso..."
 evidence_artifact_knocked_over:0 "No canto do meu olho, não posso deixar de notar que as mãos do capitão estão arranhadas."
 evidence_artifact_smeared_food:0 "Curiosamente, as manchas de comida na [ROOT.Artifact.GetName] correspondem às que estão nas mangas do capitão..."
 evidence_artifact_spilled_drink:0 "O capitão parece estar todo sujo com o mesmo líquido. Será que eu realmente não era para notar?"
 evidence_artifact_tear:0 "Há pequenos cortes por toda as mãos do capitão. Fico me perguntando de onde eles vieram."
 evidence_artifact_tear_down:0 "O capitão tem um arranhão na bochecha e suas roupas estão desalinhadas. Isso parece muito suspeito..."
 evidence_artifact_threw_up:0 "Minhas habilidades de observação percebem que há um pouco de alguma substância pegajosa nos dentes e nos cantos da boca do capitão."
 evidence_artifact_unspeakable:0 "As calças desabotoadas do capitão, assim como as mechas de cabelo saindo de seu capacete, me deixam imaginando #EMP quem#! fez coisas indizíveis na [ROOT.Artifact.GetName]..."
