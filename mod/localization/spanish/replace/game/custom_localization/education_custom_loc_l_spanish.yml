l_spanish:
 ChildhoodPersonalityTrait_bossy:0 "[GetTrait('bossy').GetName( ROOT.Char )]"
 ChildhoodPersonalityTrait_charming:0 "[GetTrait('charming').GetName( ROOT.Char )]"
 ChildhoodPersonalityTrait_curious:0 "[GetTrait('curious').GetName( ROOT.Char )]"
 ChildhoodPersonalityTrait_pensive:0 "[GetTrait('pensive').GetName( ROOT.Char )]"
 ChildhoodPersonalityTrait_rowdy:0 "[GetTrait('rowdy').GetName( ROOT.Char )]"
 diplomacy_bad_trait_match_bad_outcome:0 "[ROOT.Char.GetFirstName] sempre estava tão focado no que queria, então talvez não seja grande surpresa que [ROOT.Char.GetSheHe] tenha tido dificuldades em aprender como influenciar os outros."
 diplomacy_bad_trait_match_good_outcome:0 "Apesar de raramente se dar bem com outras crianças, [ROOT.Char.GetFirstName] mostrou uma aptidão surpreendente para manobras diplomáticas."
 diplomacy_good_trait_match_bad_outcome:0 "Apesar de ser uma criança falante, às vezes [ROOT.Char.GetFirstName] encontra dificuldades em se dar bem com as pessoas."
 diplomacy_good_trait_match_good_outcome:0 "Mesmo quando criança, [ROOT.Char.GetFirstName] sempre teve um jeito com as palavras. Portanto, não é surpreendente que [ROOT.Char.GetSheHe] tenha se saído bem nos estudos de relações diplomáticas."
 diplomacy_neutral_trait_match_bad_outcome:0 "Por muito tempo, eu estava esperando que uma boa tutela seria suficiente para ensinar [ROOT.Char.GetFirstName] as complexidades da diplomacia. No entanto, todos os esforços foram em vão."
 diplomacy_neutral_trait_match_good_outcome:0 "Com tutela suficiente, mesmo uma criança que tenha mostrado pouca inclinação natural para a influência diplomática, como [ROOT.Char.GetFirstName], pode realmente entendê-la."
 diplomatic_education:0 "$education_diplomacy_loc$"
 education_diplomacy_1_outcome_description:0 "As práticas de cortesia e honra são um desafio para [ROOT.Char.GetSheHe], mas pelo menos [ROOT.Char.GetSheHe] sabe o básico de etiqueta."
 education_diplomacy_2_outcome_description:0 "Poucos em qualquer corte ficariam muito impressionados com o domínio da etiqueta [ROOT.Char.GetHerHim], mas pelo menos [ROOT.Char.GetSheHe] sabe como se comportar em companhia educada."
 education_diplomacy_3_outcome_description:0 "Com um excelente domínio de todos os tipos de etiqueta, uma compreensão de todos os tipos de entretenimento e a eloquência que acompanha tudo isso, [ROOT.Char.GetSheHe] terá pouco problema em navegar em uma vida na corte."
 education_diplomacy_4_outcome_description:0 "Uma verdadeira língua de prata, [ROOT.Char.GetSheHe] poderia influenciar a opinião de Condes e Reis! Quando [ROOT.Char.GetSheHe] fala, a corte ouve em um silêncio enfeitiçado."
 education_intrigue_1_outcome_description:0 "Com falta de sutileza e paciência, [ROOT.Char.GetSheHe] acha difícil executar seus planos de longo prazo. Pelo menos [ROOT.Char.GetSheHe] tenta fazer planos."
 education_intrigue_2_outcome_description:0 "Embora [ROOT.Char.GetSheHe] tenha mostrado [ROOT.Char.GetHerselfHimself] completamente capaz de tramóias mesquinhas, poucos as chamariam de refinadas, mas o refinamento nem sempre é o que você precisa."
 education_intrigue_3_outcome_description:0 "[ROOT.Char.GetSheHe|U] agora conhece muitas maneiras de conseguir o que [ROOT.Char.GetSheHe] quer. O mais importante é que [ROOT.Char.GetSheHe] está altamente consciente das implicações políticas desses desejos."
 education_intrigue_4_outcome_description:0 "Agora é mais difícil dizer, no entanto. Tudo o que é atribuído a [ROOT.Char.GetSheHe] é feito por outros antes de [ROOT.Char.GetSheHe] começar, e [ROOT.Char.GetSheHe] nunca conta mentirinhas mesquinhas como costumava. Talvez [ROOT.Char.GetSheHe] não fosse tão esperto(a) quanto parecia afinal."
 education_learning_1_outcome_description:0 "A busca pelo conhecimento nunca pareceu se firmar adequadamente na mente [ROOT.Char.GetHerHim], e agora o tempo gasto entre livros e tomos parece ser mais uma tarefa para [ROOT.Char.GetSheHe] do que uma alegria."
 education_learning_2_outcome_description:0 "Mal estudioso(a), [ROOT.Char.GetSheHe] pelo menos conseguiu memorizar certas citações escolhidas dos clássicos. [ROOT.Char.GetSheHe|U] provavelmente nunca escreverá grandes teoremas, mas [ROOT.Char.GetSheHe] pode ler um ou dois."
 education_learning_3_outcome_description:0 "Um aprendiz ávido, [ROOT.Char.GetSheHe] se tornou um grande conhecedor de conhecimentos e provou ser totalmente capaz de estruturar argumentos teóricos e teológicos avançados."
 education_learning_4_outcome_description:0 "Seu entendimento de obras filosóficas e teóricas é impressionante, e [ROOT.Char.GetSheHe] muitas vezes se envolve em debates com seus professores antigos. Mesmo em uma idade tão jovem, [ROOT.Char.GetSheHe] pode ser ouvido(a) citando passagens obscuras para apoiar novas ideias e teorias."
 education_martial_1_outcome_description:0 "[ROOT.Char.GetSheHe|U] mostrou pouco entendimento do assunto, mas pelo menos [ROOT.Char.GetSheHe] sabe como segurar uma espada, e talvez consiga diferenciar um infante de um $knight_culture_player_no_tooltip_lowercase$."
 education_martial_2_outcome_description:0 "[ROOT.Char.GetSheHe|U] desenvolveu apenas uma compreensão básica do assunto, mas pelo menos [ROOT.Char.GetSheHe] aprendeu o essencial sobre o gerenciamento de um exército. Só posso esperar que o resto venha com a experiência."
 education_martial_3_outcome_description:0 "[ROOT.Char.GetSheHe|U] mostrou grande aptidão tanto em táticas de batalha quanto no gerenciamento de exércitos. [ROOT.Char.GetSheHe|U] será um excelente comandante um dia, tenho certeza."
 education_martial_3_outcome_description_not_commander:0 "[ROOT.Char.GetSheHe|U] mostrou grande aptidão tanto em táticas de batalha quanto no gerenciamento de exércitos. É uma pena que [ROOT.Char.GetSheHe] nunca comandará exércitos."
 education_martial_4_outcome_description:0 "É impressionante ver tamanha habilidade em alguém tão jovem. [ROOT.Char.GetSheHe|U] demonstra um nível de insight que é raro mesmo entre comandantes veteranos!"
 education_martial_prowess_1_outcome_description:0 "\n\nEm nível pessoal, [ROOT.Char.GetSheHe] pouco aprendeu com seus estudos $knight_culture_player_adjective_no_tooltip_lowercase$ e se sai mal em lutas individuais."
 education_martial_prowess_2_outcome_description:0 "\n\nEm nível pessoal, [ROOT.Char.GetSheHe] também lutou em algumas batalhas bem-sucedidas contra pequenos grupos de camponeses rebeldes, mostrando ser um $knight_culture_player_no_tooltip_lowercase$ competente."
 education_martial_prowess_3_outcome_description:0 "\n\nEm nível pessoal, [ROOT.Char.GetSheHe] provou ser um lutador bem-sucedido em combates de curta distância, capaz de manejar sua espada e retinência pessoal de forma coesa."
 education_martial_prowess_4_outcome_description:0 "\n\nEm nível pessoal, [ROOT.Char.GetSheHe] mostrou ser um lutador individual incrivelmente hábil, dominando até mesmo as formas mais difíceis do combate tradicional de [ROOT.Char.GetCulture.GetNameNoTooltip]."
 education_stewardship_1_outcome_description:0 "Talvez [ROOT.Char.GetSheHe] possa ser considerado(a) sortudo(a) por ter dominado a arte de contar moedas, já que a maioria dos outros aspectos do trabalho de um(a) curador(a) parecem ter escapado [ROOT.Char.GetHerHim]."
 education_stewardship_2_outcome_description:0 "Poucos ficariam impressionados com o entendimento [ROOT.Char.GetHerHim] com o assunto, mas [ROOT.Char.GetSheHe] pelo menos desenvolveu uma compreensão sólida dos princípios básicos da gestão e o começo de uma frugalidade sensata."
 education_stewardship_3_outcome_description:0 "Demonstrando uma compreensão profunda do fluxo de ouro e as andanças das pessoas, [ROOT.Char.GetSheHe] até expressa uma criatividade notável ao lidar com essas questões."
 education_stewardship_4_outcome_description:0 "Não satisfeito(a) em entender o fluxo de riqueza e pessoas, [ROOT.Char.GetSheHe] parece capaz de prever isso como se fosse por instinto! [ROOT.Char.GetSheHe|U] sempre encontra novas maneiras de lucrar com isso também."
 intrigue_bad_trait_match_bad_outcome:0 "Como uma criança quieta e reclusa, [ROOT.Char.GetFirstName] nunca demonstrou muito interesse em conseguir o que queria."
 intrigue_bad_trait_match_good_outcome:0 "Apesar de ser uma criança introvertida, frequentemente perdida em pensamentos, [ROOT.Char.GetFirstName] vem desenvolvendo um gosto pela arte da manipulação."
 intrigue_education:0 "$education_intrigue_loc$"
 intrigue_good_trait_match_bad_outcome:0 "Apesar de ter tido mais do que uma justa parcela de experiência com mentiras como uma criança, [ROOT.Char.GetFirstName] sempre achou difícil aplicar esse tipo de criatividade em qualquer forma estruturada."
 intrigue_good_trait_match_good_outcome:0 "Sempre uma criança esperta, [ROOT.Char.GetFirstName] provou repetidamente ao longo de seus estudos que tinha uma afinidade natural para planejamento cuidadoso e mais do que um pouco de desvio."
 intrigue_neutral_trait_match_bad_outcome:0 "Por muito tempo eu esperava que uma boa tutela seria suficiente para ensinar [ROOT.Char.GetFirstName] as complexidades do planejamento cuidadoso. Todas as tentativas foram em vão, no entanto."
 intrigue_neutral_trait_match_good_outcome:0 "Com tutela suficiente, até uma criança que não mostrou inclinação natural para planejamento cuidadoso, como [ROOT.Char.GetFirstName], pode compreender seus usos verdadeiramente."
 learning_bad_trait_match_bad_outcome:0 "Tendo sido uma criança tão desatenta, não é difícil ver por que [ROOT.Char.GetFirstName] teve dificuldades para lidar com a aprendizagem."
 learning_bad_trait_match_good_outcome:0 "Apesar de sempre parecer tão desatento como uma criança, [ROOT.Char.GetFirstName] provou que o estudo focado não é tudo o que faz um estudioso."
 learning_education:0 "$education_learning_loc$"
 learning_good_trait_match_bad_outcome:0 "Apesar de ser uma criança curiosa e ansiosa por aprender, a atenção de [ROOT.Char.GetFirstName] desviou-se para outras coisas à medida que crescia."
 learning_good_trait_match_good_outcome:0 "Sempre uma criança curiosa e ávida por conhecimento, [ROOT.Char.GetFirstName] mostrou uma afinidade pela aprendizagem desde cedo."
 learning_neutral_trait_match_bad_outcome:0 "Durante muito tempo, eu esperava que um bom ensino fosse suficiente para ensinar [ROOT.Char.GetFirstName] as complexidades de qualquer tipo de aprendizagem. Todas as tentativas foram em vão, no entanto."
 learning_neutral_trait_match_good_outcome:0 "Com um ensino suficiente, até uma criança que demonstrou pouca inclinação natural para a aprendizagem, como [ROOT.Char.GetFirstName], pode realmente entender qualquer assunto."
 martial_bad_trait_match_bad_outcome:0 "[ROOT.Char.GetFirstName] nunca demonstrou muito interesse pelo assunto da guerra, mas eu sempre esperava que pudesse ser apenas uma fase passageira. Fui ingênuo."
 martial_bad_trait_match_good_outcome:0 "Dizer que a indisciplinada [ROOT.Char.GetFirstName] não parecia ter aptidão para a vida na guerra é um eufemismo. No entanto, [ROOT.Char.GetSheHe] desafiou todas as expectativas."
 martial_education:0 "$education_martial_loc$"
 martial_good_trait_match_bad_outcome:0 "A natureza enérgica de [ROOT.Char.GetFirstNamePossessive] foi considerada um sinal de afinidade com a guerra e o combate, mas talvez tenha sido apenas indisciplina."
 martial_good_trait_match_good_outcome:0 "Como uma criança ativa e entusiasmada, não é surpresa que [ROOT.Char.GetFirstName] tenha se saído bem em seus estudos sobre guerra e combate."
 martial_neutral_trait_match_bad_outcome:0 "Por muito tempo, eu esperava que uma boa tutela seria suficiente para ensinar [ROOT.Char.GetFirstName] as intrincadezas da guerra. Fui ingênuo."
 martial_neutral_trait_match_good_outcome:0 "Com tutela suficiente, mesmo uma criança que tenha mostrado pouca inclinação natural para a guerra, como [ROOT.Char.GetFirstName], pode chegar a entender verdadeiramente o assunto."
 stewardship_bad_trait_match_bad_outcome:0 "Talvez sem surpresa, a obsessão de [ROOT.Char.GetFirstName] pelos detalhes minuciosos das vidas das pessoas não foi benéfica para sua compreensão da administração de um reino inteiro."
 stewardship_bad_trait_match_good_outcome:0 "Apesar de estar mais interessado em rumores sobre o povo do reino do que seus impostos e censo, [ROOT.Char.GetFirstName] desenvolveu aptidão para administração."
 stewardship_education:0 "$education_stewardship_loc$"
 stewardship_good_trait_match_bad_outcome:0 "Apesar de sempre parecer buscar autoridade e ordem, [ROOT.Char.GetFirstName] não se tornou tão proficiente quanto o esperado na administração de terras e pessoas."
 stewardship_good_trait_match_good_outcome:0 "Um administrador nato desde o nascimento, não deve surpreender ninguém que [ROOT.Char.GetFirstName] tenha progredido muito em seus estudos sobre a administração do reino."
 stewardship_neutral_trait_match_bad_outcome:0 "Por muito tempo eu esperava que uma boa tutela seria suficiente para ensinar [ROOT.Char.GetFirstName] as complexidades da administração. Todas as tentativas foram em vão, no entanto."
 stewardship_neutral_trait_match_good_outcome:0 "Com tutela suficiente, até uma criança que não mostrou inclinação natural para administração, como [ROOT.Char.GetFirstName], pode compreendê-la verdadeiramente."
