 chariot_comeback_blazing:0 "ultrapassando os competidores de trás para confrontar os líderes"
 chariot_comeback_bursting:0 "irrompendo da última posição, perseguindo agressivamente os líderes"
 chariot_comeback_dashing:0 "apressando-se da última posição, engajando-se rapidamente com os líderes"
 chariot_comeback_fallback:0 "catapultando da última posição para desafiar os líderes"
 chariot_comeback_miracle:0 "fazendo um salto milagroso da última para contestar diretamente os líderes"
 chariot_comeback_propelling:0 "impulsionando-se do final, disputando com determinação com os charioteers líderes"
 chariot_comeback_rallying:0 "reagrupando-se de trás, abordando audaciosamente os contendores líderes"
 chariot_comeback_rocketing:0 "disparando do final para desafiar diretamente os corredores líderes"
 chariot_comeback_soaring:0 "elevando-se do fundo do grupo para enfrentar bravamente os líderes"
 chariot_comeback_sprinting:0 "correndo para frente do final, fechando rapidamente a distância para os líderes"
 chariot_comeback_surging:0 "avançando de trás, enfrentando audaciosamente os charioteers líderes"
 chariot_governor_chitchat_10:0 "Vamos aproveitar este intervalo em nossos deveres por um tempo, meu amigo, e nos deliciar com o espetáculo do Hipódromo. Afinal, até os governadores merecem alguns momentos de lazer."
 chariot_governor_chitchat_1:0 "Maravilhe-se com a majestade das corridas de carroças, meu caro governador. O Hipódromo é onde o espírito de Bizâncio realmente ganha vida!"
 chariot_governor_chitchat_2:0 "Nos rugidos estrondosos da multidão e nas patas trovejantes das carroças, encontramos o coração do nosso grande império, não concorda?"
 chariot_governor_chitchat_3:0 "Essas corridas não são apenas um espetáculo; elas são um testemunho da unidade e força do nosso povo. Um lembrete de que, mesmo na competição, permanecemos como um só."
 chariot_governor_chitchat_4:0 "Olhe para as cores vibrantes das facções competidoras, um banquete visual que reflete a diversidade e riqueza do nosso amado império."
 chariot_governor_chitchat_5:0 "Como governadores, somos guardiões da tradição. As corridas de carroças no Hipódromo são um fio inquebrável que conecta nosso presente ao nosso glorioso passado."
 chariot_governor_chitchat_6:0 "Veja como os aplausos e vaias ecoam através dos tempos, carregando os ecos de imperadores há muito desaparecidos. O Hipódromo é nossa herança compartilhada."
 chariot_governor_chitchat_7:0 "Na arena, onde habilidade e estratégia convergem, reside um reflexo de nossos deveres administrativos. Devemos navegar os obstáculos com precisão, assim como esses carroceiros."
 chariot_governor_chitchat_8:0 "Testemunhe o fervor do povo enquanto eles se reúnem em torno de seus carroceiros favoritos. É um lembrete de que a governança, assim como as corridas, é uma dança com o sentimento público."
 chariot_governor_chitchat_9:0 "O Hipódromo sussurra histórias de vitórias e derrotas, lembrando-nos que o sucesso requer tanto estratégia quanto adaptabilidade, assim como nossos próprios deveres."
 chariot_movement_cut_off_at_turn:0 "agarra as rédeas de [ROOT.Char.GetHerHis] e incentiva [ROOT.Char.GetHerHis] finos corcéis a contornar a curva o mais apertadamente possível"
