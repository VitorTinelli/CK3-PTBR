l_spanish:
 BLUE_VENETOI_GLOSS:0 "Os #bold Venetoi#!, um nome do período para \"o Azul\", eram considerados uma das equipes mais prestigiadas que competiram no Hipódromo de Constantinopla e pensava-se que estavam conectados às classes superiores. O famoso carroceiro, Porphyrius, era um membro estimado dos Azuis, embora tenha mudado brevemente sua afiliação para os Verdes durante o período dos Distúrbios de Nika."
 CHRYSOTRIKLINOS_GLOSS:0 "O #bold Chrysotriklinos#!, ou Sala de Recepção Dourada, era o principal salão cerimonial do Grande Palácio de Constantinopla"
 GREEN_PRASINOI_GLOSS:0 "Os #bold Prasinoi#!, um nome do período para \"o Verde\", eram considerados uma facção do povo. No século VI, os Verdes massacram quase 3.000 membros dos Azuis no anfiteatro de Constantinopla."
 RED_RHOUSIOI_GLOSS:0 "Os #bold Rhousioi#!, um nome do período para \"o Vermelho\", foram historicamente ofuscados pelos Azuis e pelos Verdes, mas de forma alguma insignificantes. Em nosso período, já haviam sido incorporados pelos Verdes."
 WHITE_LEUKOI_GLOSS:0 "Os #bold Leukoi#!, um nome do período para \"o Branco\", foram historicamente ofuscados pelos Azuis e pelos Verdes, mas de forma alguma insignificantes. Em nosso período, já haviam sido incorporados pelos Azuis."
