 greeting_supplimentary.negative.greek:0 "Seu caráter baixo é tema de peças gregas."
 greeting_supplimentary.negative.insult.1:0 "Que seus humores apodreçam em seu corpo vivo."
 greeting_supplimentary.negative.insult.2:0 "Que seus anos sejam curtos e miseráveis."
 greeting_supplimentary.negative.insult.3:0 "Que a sabedoria sempre lhe escape."
 greeting_supplimentary.negative.insult.4:0 "Que seus campos fiquem em pousio e seus poços sequem."
 greeting_supplimentary.negative.insult.oathbreaker:0 "Você é um mentiroso e um perjuro."
 greeting_supplimentary.negative.insult.unreliable_swine:0 "Seu porco traiçoeiro."
 greeting_supplimentary.negative.insult_byzantine.1:0 "Até os ratos de Constantinopla fogem do seu fedor."
 greeting_supplimentary.negative.insult_christian.1:0 "Que os santos abandonem a sua causa."
 greeting_supplimentary.negative.insult_christian.2:0 "O seu nome será apagado de todas as preces."
 greeting_supplimentary.negative.insult_christian.3:0 "Que o inferno se abra para recebê-lo."
 greeting_supplimentary.negative.insult_hindu.1:0 "Você caminha longe do caminho da retidão — e eu o farei ir ainda mais longe."
 greeting_supplimentary.negative.insult_jewish.1:0 "Que o seu nome seja riscado do livro dos vivos."
 greeting_supplimentary.negative.insult_muslim.1:0 "Maldição sobre o seu sétimo avô."
 greeting_supplimentary.negative.insult_muslim.2:0 "Que você seja costurado vivo na barriga de um camelo morto."
 greeting_supplimentary.negative.insult_muslim.3:0 "Que Alá destrua sua casa."
 greeting_supplimentary.negative.insult_muslim.4:0 "Você filho de um cachorro sarnento."
 greeting_supplimentary.negative.insult_muslim.5:0 "Que os chacais disputem os seus ossos enterrados."
 greeting_supplimentary.negative.insult_muslim.6:0 "Que os seus poços se encham de areia e as suas tendas de escorpiões."
 greeting_supplimentary.negative.insult_norse.1:0 "Que os seus ancestrais cuspam na sua sombra."
 greeting_supplimentary.negative.insult_norse.2:0 "A sua coragem é mais fina que o gelo de inverno."
 greeting_supplimentary.negative.insult_norse.3:0 "Que os corvos se fartem de festejar com os seus mortos."
 greeting_supplimentary.negative.insult_zoroastrian.1:0 "Que a escuridão sufoque o fogo que você diz zelar."
 greeting_supplimentary.negative.tales:0 "Histórias de suas más ações são contadas da Irlanda à Catai."
 greeting_supplimentary.negative:0 "[ROOT.Char.Custom2('NegativeSupplimentaryGreeting', second)]"
 greeting_supplimentary.positive.flattery.10:0 "Paz e fartura sobre a sua casa."
 greeting_supplimentary.positive.flattery.11:0 "Que a fortuna sorria para os seus estandartes."
 greeting_supplimentary.positive.flattery.12:0 "A sua sabedoria é uma luz para aqueles que buscam conselho."
 greeting_supplimentary.positive.flattery.13:0 "Que o Paraíso o mantenha em sua graça."
 greeting_supplimentary.positive.flattery.1:0 "Bênçãos sobre você e sua Casa."
 greeting_supplimentary.positive.flattery.2:0 "Sua sabedoria e misericórdia são lendárias."
 greeting_supplimentary.positive.flattery.3:0 "A paz esteja com você."
 greeting_supplimentary.positive.flattery.4:0 "Que você viva em harmonia e contentamento."
 greeting_supplimentary.positive.flattery.5:0 "Sua crueldade é invejável."
 greeting_supplimentary.positive.flattery.6:0 "Seus grandes apetites são famosos em todo o mundo."
 greeting_supplimentary.positive.flattery.7:0 "A sua fama o precede por todas as fronteiras."
 greeting_supplimentary.positive.flattery.8:0 "Que a sua linhagem perdure por mil anos."
 greeting_supplimentary.positive.flattery.9:0 "Que Deus mantenha o seu braço armado forte."
 greeting_supplimentary.positive.flattery_byzantine.1:0 "Que a glória da Cidade brilhe sobre a sua casa."
 greeting_supplimentary.positive.flattery_chinese.1:0 "As bênçãos do Céu estejam sobre vós."
 greeting_supplimentary.positive.flattery_chinese.2:0 "Que as suas terras sempre prosperem."
 greeting_supplimentary.positive.flattery_chinese.3:0 "Que a força e o vigor abençoem o seu governo."
 greeting_supplimentary.positive.flattery_jewish.1:0 "Que o Santo abençoe a sua casa com paz."
 greeting_supplimentary.positive.flattery_norse.1:0 "Que os deuses lhe concedam ventos favoráveis e gado gordo."
