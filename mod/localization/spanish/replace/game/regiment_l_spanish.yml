 abudrar:0 "Abudrar"
 abudrar_flavor:0 "#F Os montanheses Abudrar conhecem cada garganta e vale de sua terra natal.#!"
 accolade_maa_archers:0 "Arqueiros da Comitiva"
 accolade_maa_archers_flavor:0 "[retinue_maa|E]\n#F Esses arqueiros de elite não são simples caçadores furtivos: eles são treinados incansavelmente para lançar flechas com precisão e em alta velocidade.#!"
 accolade_maa_cameliers:0 "Cavaleiros de Camelo da Comitiva"
 accolade_maa_cameliers_flavor:0 "[retinue_maa|E]\n#F Temidos no Oriente Médio e no Norte da África, são poucos os exércitos que possuem tamanha habilidade com camelos.#!"
 accolade_maa_crossbowers:0 "Besteiros da Comitiva"
 accolade_maa_crossbowers_flavor:0 "[retinue_maa|E]\n#F Nobre ou plebeu: qualquer um pode ser perfurado pelas flechas de ferro cuidadosamente colocadas desses besteiros altamente treinados.#!"
 accolade_maa_elephantiers:0 "Elefantes de Guerra da Comitiva"
 accolade_maa_elephantiers_flavor:0 "[retinue_maa|E]\n#F De cima de suas torres, os habilidosos condutores dessas feras provam que a única coisa mais difícil de parar do que um elefante em carga é outro elefante, ainda #EMP maior#!.#!"
 accolade_maa_handgunners:0 "Atiradores de Canhão de Mão da Comitiva"
 accolade_maa_handgunners_flavor:0 "[retinue_maa|E]\n#F Avançando firmemente através da fumaça da pólvora, esses atiradores de canhão de mão altamente treinados podem despedaçar as fileiras inimigas com suas armas magistralmente forjadas.#!"
 accolade_maa_horse_archers:0 "Arqueiros Montados da Comitiva"
 accolade_maa_horse_archers_flavor:0 "[retinue_maa|E]\n#F Os cavaleiros das estepes comuns possuem habilidades ao longo da vida: esses cavaleiros veteranos possuem ainda mais. Enfrentá-los é dor; persegui-los é morte.#!"
 accolade_maa_lancers:0 "Lanceiros da Comitiva"
 accolade_maa_lancers_flavor:0 "[retinue_maa|E]\n#F Avançando com um estrondo ensurdecedor e verdadeira nobreza, as fileiras cerradas desses cavaleiros inspiram um medo terrível em qualquer campo de batalha.#!"
 accolade_maa_outriders:0 "Batedores da Comitiva"
 accolade_maa_outriders_flavor:0 "[retinue_maa|E]\n#F Montados em corcéis velozes, esses cavaleiros de elite podem ultrapassar qualquer inimigo e atacar onde é menos esperado e menos bem-vindo.#!"
 accolade_maa_pikes:0 "Piqueiros da Comitiva"
 accolade_maa_pikes_flavor:0 "[retinue_maa|E]\n#F Vestidos com armaduras finas e portando piques longos, esses infantes formam o núcleo inquebrável do exército de seu senhor feudal.#!"
 accolade_maa_skirmishers:0 "Escaramuçadores da Comitiva"
 accolade_maa_skirmishers_flavor:0 "[retinue_maa|E]\n#F Uma mistura de guerreiros de elite levemente equipados e saqueadores mercenários experientes, temidos por sua habilidade em emboscadas e guerras não convencionais.#!"
 accolade_maa_vanguards:0 "Vanguarda da Comitiva"
 accolade_maa_vanguards_flavor:0 "[retinue_maa|E]\n#F Colocados em posição de destaque no meio da batalha, esses infantes pesados disciplinados e resplandecentes são uma força que poucos inimigos podem resistir.#!"
 akritai:0 "Ácritas"
 akritai_flavor:0 "#F Veteranos recrutas rurais, defensores das passagens rochosas, que usam o timing cuidadoso e o conhecimento local para assediar até os maiores exércitos.#!"
 archer_cavalry:0 "[archer_cavalry|E]"
 archers:0 "[archers|E]"
 archers_lowercase:0 "arqueiros"
 archers_of_the_nile:0 "Arqueiros do Nilo"
 archers_of_the_nile_flavor:0 "#F Por milhares de anos, os Núbios protegeram sua terra natal dominando o arco desde jovens, repelindo ataques dos povos do deserto vizinho e invasores de todos os tipos.#!"
 armored_footmen:0 "Soldados de Infantaria Blindados"
 armored_footmen_flavor:0 "#F Altamente armados e bem treinados, essas tropas são especializadas em esmagar infantarias em massa.#!"
 armored_horsemen:0 "Cavaleiros Blindados"
 armored_horsemen_flavor:0 "#F Altamente armados e protegidos, esses cavaleiros dominam a guerra em planícies abertas.#!"
 ayrudzi:0 "Ayrudzi"
 ayrudzi_flavor:0 "#F Cavaleiros velozes e astutos no uso de terrenos difíceis, ainda assim vestidos com armaduras sólidas, esses nobres ferozes podem servir tanto como cavalaria de assédio quanto como uma vanguarda formidável.#!"
 ayyar:0 "Ayyar"
 ayyar_flavor:0 "#F Jovens e ávidos, membros dos clubes de luta Ayyar servem como soldados dispostos e capazes, prontos para serem chamados a qualquer momento.#!"
 ballista:0 "Balestras de Cerco"
 ballista_elephant:0 "Elefantes Balestra"
 ballista_elephant_flavor:0 "#F Um elefante em carga já é impressionante, mas um elefante equipado com uma poderosa balestra nas costas certamente amedrontará até os inimigos mais experientes.#!"
 ballista_flavor:0 "#F Grandes balestras montadas em uma plataforma com rodas, capazes de lançar virotes com ponta de aço a distâncias impressionantes.#!"
 ballistrai:0 "Ballistrai"
 ballistrai_flavor:0 "#F Virotes do tamanho de lanças são disparados dessas máquinas baseadas em torção contra assentamentos sitiados e formações inimigas, causando medo e desordem.#!"
 black_armor_cavalry:0 "Cavalaria Blindada Negra"
 black_armor_cavalry_flavor:0 "#F Uma unidade de guarda imperial de elite conhecida por sua armadura escura de ferro oxidado.#!"
 bombard:0 "Bombardas"
 bombard_flavor:0 "#F Não mais limitados pelas alavancas e polias, esses canhões podem destruir fortificações com facilidade.#!"
 bowmen:0 "Arqueiros"
 bowmen_flavor:0 "#F Arqueiros profissionais enchem o ar com flechas, devastando as tropas inimigas à frente.#!"
 burenjia:0 "Infantaria Burenjia"
 burenjia_flavor:0 "#F Desdobrada em grande número, em formações fechadas, esta infantaria é a espinha dorsal dos exércitos imperiais. Composta por até 1000 peças de lamela, sua armadura pesada permite resistir a quase qualquer invasor.#!"
 bush_hunter:0 "Cazadores de Arbustos"
 bush_hunter_flavor:0 "#F Esses arqueiros da África Ocidental usam o terreno difícil da selva a seu favor.#!"
 caballero:0 "Caballeros"
 caballero_flavor:0 "#F Ao contrário da maioria da cavalaria, os Caballeros ibéricos se sentem em casa tanto em planícies quanto em terrenos acidentados e montanhosos.#!"
 camel_cavalry:0 "[camel_cavalry|E]"
 camel_cavalry_lowercase:0 "cavalaria de camelos"
 camel_rider:0 "Cavaleiros de Camelo"
 camel_rider_flavor:0 "#F Melhor adequados para a guerra no deserto do que a cavalaria tradicional, esses cavaleiros dominam as areias.#!"
 cannon:0 "Motores Dragão de Fogo"
 cannon_flavor:0 "#F Estas armas relativamente pequenas, mas letais, eram apoiadas na boca do cano e fixadas ao chão para amortecer o recuo.#!"
 cataphract:0 "Kataphraktoi"
 cataphract_archers:0 "Arqueiros Catapratas"
 cataphract_archers_flavor:0 "#F Flechas e lâminas ricocheteiam inofensivamente sobre os casacos lamelares desses cavaleiros e seus cavalos. Enquanto isso, seus arcos trazem morte e sofrimento.#!"
 cataphract_flavor:0 "#F Blindados com casacos de ferro, os cataphracts gregos podem quebrar quase qualquer linha defensiva com sua carga.#!"
 chasseur:0 "Chasseurs"
 chasseur_flavor:0 "#F Os cavaleiros do Outremer dominaram tanto a cavalaria europeia quanto as táticas do deserto levantino.#!"
 cloud_ladder:0 "Escadas de Nuvem"
 cloud_ladder_flavor:0 "#F Uma escada dobrável articulada com um simples mecanismo de puxar para se desdobrar ao alcançar as muralhas inimigas.#!"
 conrois:0 "Conrois"
 conrois_flavor:0 "#F Galopando com lanças em riste, esses cavaleiros normandos imprudentes se lançam em qualquer fraqueza encontrada nas formações inimigas, ansiosos para conquistar a vitória através de choque e terror.#!"
 crossbowmen:0 "Besteiros"
 crossbowmen_flavor:0 "#F Embora lentas para recarregar, as bestas são fáceis de usar e disparam parafusos que podem perfurar a maioria das armaduras a uma boa distância.#!"
 druzhina:0 "Druzhina"
 druzhina_flavor:0 "#F Os Druzhinas russos são habilidosos guarda-costas que se dedicaram a proteger seus aliados.#!"
 elephant_cavalry:0 "[elephant_cavalry|E]"
 elephant_cavalry_lowercase:0 "cavalaria de elefantes"
 emishi_horse_archers:0 "Cavaleiros Emishi"
 emishi_horse_archers_flavor:0 "#F Forçados a se defender de ameaças mais fortes, os arqueiros a cavalo Emishi são mestres em táticas de ataque e fuga, saques e emboscadas.#!"
 fire_lancers:0 "Lanceiros de Fogo"
 fire_lancers_flavor:0 "#F Usando fórmulas experimentais, homens armados com estranhos alabardas são capazes de lançar fogo sobre inimigos aterrorizados.#!\n#help Habilitado pelo [GetBuilding('powder_magazine_01').GetName].#!"
 gakgung_archers:0 "Arqueiros Gakgung"
 gakgung_archers_flavor:0 "#F Equipados com arcos reflexivos poderosos e anéis de polegar para fortalecer seu puxar, esses arqueiros podem disparar flechas a uma distância incrível."
 garudas:0 "Garudas"
 garudas_flavor:0 "#F Os Guerreiros Garudas são famosos por sua lealdade e por lutar até a morte. Quando um guerreiro Garuda cai, é esperado que toda a sua escolta de guerreiros Lenka morra com ele.#!"
 gendarme:0 "Gendarmes"
 gendarme_flavor:0 "#F Os Gendarmes franceses são o brilhante pináculo da cavalaria pesada, inspirando admiração em todo o mundo.#!"
 goedendag:0 "Milícia Goedendag"
 goedendag_flavor:0 "#F O goedendag flamengo é uma clava espinhosa que pode ser presa contra cargas de cavalaria.#!"
 guanch_vaulter:0 "Infantaria Vaulter Guanch"
 guanch_vaulter_flavor:0 "#F Armados com longas varas de salto, esses guerreiros ágeis são capazes de navegar em terrenos rochosos e montanhosos com facilidade e até mesmo saltar sobre algumas fortificações.#!"
 guinea_warrior:0 "Uplanders Guineanos"
 guinea_warrior_flavor:0 "#F Guerreiros das terras altas da Guiné se movem rapidamente e suas lanças são precisas e mortais.#!"
 gunpowder:0 "[gunpowder|E]"
 gunpowder_lowercase:0 "atirador de canhão de mão"
 handgunners:0 "Mosqueteiros"
 handgunners_flavor:0 "#F Caros e explosivos na mesma medida, essas armas de fogo rudimentares são armas incrivelmente eficazes.#!\n#help Habilitado pelo [GetBuilding('powder_magazine_01').GetName].#!"
 handpicked_faithful:0 "Fiéis Selecionados"
 handpicked_faithful_flavor:0 "#F Individualmente destacados em valor, lealdade e talento, esses combatentes estão prontos para dar suas vidas para proteger seu líder.#!"
 heavy_cavalry:0 "[heavy_cavalry|E]"
 heavy_cavalry_lowercase:0 "cavalaria pesada"
 heavy_horse_archers:0 "Arqueiros a Cavalo Pesados"
 heavy_horse_archers_flavor:0 "#F Cavaleiros armados com arcos fortes. Como cada um lidera uma linha de finos cavalos, esses nômades podem lutar incansavelmente no campo aberto.#!"
 heavy_infantry:0 "[heavy_infantry|E]"
 heavy_infantry_lowercase:0 "infantaria pesada"
 hobelar:0 "Hobelars"
 hobelar_flavor:0 "#F Rápidos e ágeis, os Hobelars celtas podem facilmente atacar as florestas e colinas que outros cavaleiros evitam.#!"
 horn_warrior:0 "Guerreros del Cuerno"
 horn_warrior_flavor:0 "#F Praticantes de guerra em montanhas, guerreiros do Chifre da África não devem ser subestimados.#!"
 horse_archers:0 "Arqueiros Montados"
