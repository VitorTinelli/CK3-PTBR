l_spanish:
 msg_passive_learned_doctrine_abroad_desc:0 "Ao observar [passive_learn_source.GetTitledFirstName] do [passive_learn_source.GetRite.GetAdjective] [rite|E] em [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier], você obteve [agnostic_knowledge|E] do [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )] [doctrine|E]."
 msg_passive_learned_doctrine_pilgrimage_rite_desc:0 "Em [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier], você obteve [agnostic_knowledge|E] do [passive_learn_doctrine.GetDescriptiveName( passive_learn_rite.GetFaith.Self )] [doctrine|E] do [passive_learn_rite.GetAdjective] [rite|E]."
 msg_passive_learned_rite_abroad_desc:0 "Por meio de [passive_learn_source.GetTitledFirstNameNoTooltip], você obteve [agnostic_knowledge|E] do [core_tenets|E] e [doctrines|E] do [passive_learn_source.GetRite.GetAdjective] [rite|E]."
 msg_passive_learned_tenet_abroad_desc:0 "Ao observar [passive_learn_source.GetTitledFirstName] do [passive_learn_source.GetRite.GetAdjective] [rite|E] em [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier], você obteve [agnostic_knowledge|E] do [passive_learn_tenet.GetBaseName] [core_tenet|E]."
 msg_passive_learned_tenet_pilgrimage_rite_desc:0 "Em [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier], você obteve [agnostic_knowledge|E] do [passive_learn_tenet.GetBaseName] [core_tenet|E] do [passive_learn_rite.GetAdjective] [rite|E]."
 rite_travel_events.1000.a:0 "Muito esclarecedor."
 rite_travel_events.1000.b:0 "[passive_learn_source.GetSheHe|U] deveria se juntar a mim."
 rite_travel_events.1000.c:0 "Não tenho ouvidos para tal heresia."
 rite_travel_events.1000.desc:0 "O crepúsculo cai, e um [passive_learn_rite.GetAdherentName] viajante junta-se a nós junto à fogueira.\n\nÀ medida que a noite avança, compartilhamos [passive_learn_source.Custom('RegionalDrink')], [passive_learn_source.Custom('RegionalEdibleMeat')] e histórias. [passive_learn_source.GetSheHe|U] fala dos ensinamentos sagrados do povo de [passive_learn_source.GetHerHis], de como [passive_learn_rite.GetNameNoTooltip] é vivido e praticado. Há convicção em cada palavra."
 rite_travel_events.1000.t:0 "Um [passive_learn_rite.GetAdherentNameNoTooltip] viajante"
 rite_travel_events.2000.a:0 "[ROOT.Char.GetFaith.HighGodName] espera isso de mim."
 rite_travel_events.2000.b:0 "Não sou nenhum pagão!"
 rite_travel_events.2000.desc:0 "Enquanto viajo pelo [location.GetTerrain.GetNameNoTooltip] de [location.GetName], encontro uma multidão reunida.\n\nUm pregador fala de algo chamado [passive_learn_tenet.GetBaseName]. Nunca ouvi falar disso, mas sinto as palavras de [passive_learn_source.GetHerHis].\n\nEu pretendia passar direto. Em vez disso, eu ouço.\n\nIsto... isto é a verdade."
 rite_travel_events.2000.t:0 "Revelação"
