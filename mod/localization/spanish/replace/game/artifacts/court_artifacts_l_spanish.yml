 artifact_pedestal_veil_veronica:0 "O autêntico Véu de Verônica: um pedaço de pano no qual o rosto de Jesus foi milagrosamente impresso durante a Paixão. Diz-se que cura os enfermos pela Graça de Deus"
 artifact_pedestal_veil_veronica_name:0 "Véu de Veronica"
 artifact_philosophers_stone_description:0 "Uma caixa contendo a substância alquímica mítica capaz de transmutar metais comuns em ouro. A caixa de [newly_created_artifact.GetFeatureText( 'box_material' )] é de habilidade artesanal [SCOPE.Custom('ArtifactQuality')]. [newly_created_artifact.GetFeatureText( 'box_decoration' )]."
