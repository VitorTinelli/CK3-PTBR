 artifact_statue_religious_jesus:0 "Jesus na Cruz"
 artifact_statue_religious_mary:0 "a Virgem Maria"
 artifact_statue_roman_woman_desc:0 "Uma antiga estátua de uma mulher romana, ligeiramente danificada, mas ainda encantadora."
