 artifact_throne_special:0 "$artifact_throne$"
 artifact_throne_stone_scone:0 "Um simples assento de arenito vermelho no qual todos os monarcas de Alba foram coroados desde o Rei Kenneth I."
 artifact_throne_stone_scone_name:0 "Pedra de Scone"
 artifact_tree_automa:0 "Uma árvore finamente esculpida e dourada, com pássaros realistas empoleirados em seus ramos. Somente os gregos conhecem os segredos de sua bomba hidráulica oculta, que faz os pássaros se moverem e cantarem agradavelmente."
