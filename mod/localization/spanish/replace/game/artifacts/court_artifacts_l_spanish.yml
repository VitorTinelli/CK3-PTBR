 artifact_statue_constantine:0 "Uma antiga estátua de Constantino, ligeiramente danificada, mas ainda imponente, fundador de Constantinopla e modelo para todos os imperadores romanos."
 artifact_statue_constantine_name:0 "Estátua de Constantino"
