 artifact_sculpture_cabinet_pentapyrgion_description:0 "Este elegante armário foi construído pelo imperador Teófilo para exibir vasos, coroas e outros objetos de valor no Crisotrício, o salão de recepção do Grande Palácio de Constantinopla."
