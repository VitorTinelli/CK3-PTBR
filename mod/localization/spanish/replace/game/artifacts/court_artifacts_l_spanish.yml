 artifact_statuette_description:0 "Uma elegante estatueta em miniatura de habilidade artesanal [SCOPE.Custom('ArtifactQuality')], retratando um [host.Custom('MountedWarriorTerm')] montado em um torneio. É feita de ouro e possui detalhes impressionantes."
 artifact_statuette_name:0 "Estatueta $artifact_name_prefix$"
 artifact_sword_goujian:0 "Diz-se que esta antiga espada pertenceu ao Rei de Yue, Goujian. Embora antiquada em seu design, a espada demonstra excelente artesanato. Texto dourado no estilo de escrita selo pássaro-verme é visível próximo ao punho."
 artifact_sword_goujian_name:0 "Espada de Goujian"
 artifact_sword_goujian_purity:0 "[gujian_sword.GetDesc]\n\nAcredita-se que esta seja a espada \"Pureza\"."
 artifact_sword_goujian_refulgence:0 "[gujian_sword.GetDesc]\n\nAcredita-se que esta seja a espada chamada \"Refulgência\", que Goujian portava quando buscou o conselho de Confúcio."
 artifact_table_description:0 "Uma mesa [SCOPE.Custom('ArtifactQuality')]. Ela é construída a partir de painéis de [newly_created_artifact.GetFeatureText( 'generic_material_wood' )]. [newly_created_artifact.GetFeatureText( 'wood_decoration' )]"
 artifact_table_name:0 "Mesa $artifact_name_prefix$"
 artifact_throne_charlemagne_description:0 "Um trono simples, mas imponente, sem ornamentos. Construído em mármore sólido, há rumores de que as lajes foram tiradas da Igreja do Santo Sepulcro em Jerusalém."
 artifact_throne_charlemagne_name:0 "Trono de Carlos Magno"
 artifact_throne_description:0 "Um trono real de qualidade [SCOPE.Custom('ArtifactQuality')]. O trono foi construído a partir de postes sólidos de [newly_created_artifact.GetFeatureText( 'generic_material_wood')] e o assento é acolchoado com travesseiros de [newly_created_artifact.GetFeatureText( 'generic_material_cloth' )]."
 artifact_throne_name:0 "Trono $artifact_name_prefix$"
 artifact_throne_solomon_description:0 "Um trono ostensivo que, segundo rumores, pertenceu ao lendário rei Salomão. Construído de marfim e dourado com ouro, o trono também é cravejado de muitas pedras preciosas e esculturas de metal de vários animais adornam os degraus que levam a ele. "
