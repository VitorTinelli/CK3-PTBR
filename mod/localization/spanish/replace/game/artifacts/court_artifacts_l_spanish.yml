 artifact_sculpture_animal_description:0 "Estátua de um animal [SCOPE.Custom('ArtifactArticleWealth')], pintada e esculpida com qualidade [SCOPE.Custom('ArtifactAdverbQuality')] . As qualidades míticas da criatura são interpretadas como uma alegoria para [owner.GetTitleAsNameNoTooltip] e seu(a) [owner.Custom('RulerSkill')]. [ROOT.GetCharacter.GetHerHim|U] [newly_created_artifact.GetFeatureText( 'sculpture_material' )] da escultura é de qualidade [SCOPE.Custom('ArtifactAdverbQuality')]."
