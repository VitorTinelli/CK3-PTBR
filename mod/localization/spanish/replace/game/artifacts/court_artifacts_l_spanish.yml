 artifact_pedestal_skull_of_the_apostate_description:0 "Um crânio humano limpo e perfeitamente preservado que pertenceu [Select_CString( rival.IsFemale, 'a', 'ao' )] [rival.GetTitledFirstNameNoTooltip], removido cirurgicamente por viver contrário aos valores de [owner.GetFaith.GetName]."
 artifact_pedestal_skull_of_the_apostate_name:0 "Crânio do Apóstata"
 artifact_pedestal_skull_of_the_enemy_description:0 "Um crânio humano limpo e perfeitamente preservado que pertenceu [Select_CString( rival.IsFemale, 'a', 'ao' )] [rival.GetTitledFirstNameNoTooltip], removido cirurgicamente devido a ofensas pessoais contra [owner.GetTitledFirstNameNoTooltip]."
