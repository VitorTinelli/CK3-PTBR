 artifact_tun_barrel_description:0 "Um enorme recipiente de [newly_created_artifact.GetFeatureText( 'generic_material_wood' )] de habilidade artesanal [SCOPE.Custom('ArtifactQuality')], capaz de armazenar centenas de galões de vinho."
