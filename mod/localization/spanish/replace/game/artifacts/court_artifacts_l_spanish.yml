 artifact_plate_description:0 "Um magnífico prato de habilidade artesanal [SCOPE.Custom('ArtifactQuality')]. É fundido a partir de [newly_created_artifact.GetFeatureText( 'generic_material_metal' )] e gravado com [newly_created_artifact.GetFeatureText( 'decoration_pattern' )]."
