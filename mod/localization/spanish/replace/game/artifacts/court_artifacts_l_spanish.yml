 artifact_statue_four_tetrarchs_name:0 "Estátua dos Quatro Tetrarcas"
 artifact_statue_green_amitabha_buddha_descripton:0 "Esta bela estátua do Buda Amitabha parece ter sido esculpida em uma pedra verde monolítica. A base é decorada com pétalas de lótus e padrões de ondas de água.\n\nDiz-se que a estátua apareceu milagrosamente criada a partir dos escombros de uma Pagoda que desabou pouco depois de ser construída."
