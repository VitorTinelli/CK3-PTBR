 feature_tapestry_scene_animals:0 "A tapeçaria retrata alguns animais caçando. No centro, um leão poderoso atacou um cervo que luta em vão para escapar."
 feature_tapestry_scene_banquet:0 "A tapeçaria retrata um rico banquete na corte [Select_CString( Artifact.GetOwner.IsFemale, 'da', 'do' )] [Artifact.GetOwner.GetTitledFirstName]: convidados notáveis ​​sentam-se em uma mesa rica enquanto os artistas tocam música e dançam."
 feature_tapestry_scene_battle:0 "A tapeçaria retrata o ponto de virada da famosa batalha de [Artifact.GetOwner.MakeScope.Var('epic_battle_location').Province.GetName], vencida [Select_CString( Artifact.GetOwner.IsFemale, 'pela', 'pelo' )] [Artifact.GetOwner.GetTitledFirstName] contra [Artifact.GetOwner.MakeScope .Var('epic_loser').Char.GetTitledFirstName]."
 feature_tapestry_scene_bucolic:0 "A tapeçaria retrata cenas serenas da vida cotidiana nos campos ao longo do ano: alguns plantam um campo, outros aram e outros colhem a colheita."
 feature_tapestry_scene_calligraphic:0 "A tapeçaria foi tecida para mostrar um design intrincado no qual letras caligráficas elegantes se misturam perfeitamente com formas geométricas."
 feature_tapestry_scene_coronation:0 "[Artifact.GetOwner.GetTitledFirstName|U] é representado no centro da cena durante a sua coroação, entronizado em meio a uma multidão animada."
 feature_tapestry_scene_garden:0 "Um belo jardim é retratado no pano: a grama é verde, as flores crescem coloridas e luxuriantes, e as árvores carregadas de frutas parecem alcançar o céu."
 feature_tapestry_scene_geometric_patterns:0 "A tapeçaria foi tecida para mostrar um desenho intrincado de formas geométricas interligadas."
 feature_tapestry_scene_hearing:0 "A tapeçaria retrata uma audiência na corte: [Artifact.GetOwner.GetTitledFirstName] senta-se majestosamente no centro da cena, enquanto vassalos, emissários, inimigos derrotados e servos esperam na fila para prestar homenagem."
 feature_tapestry_scene_historical:0 "A tapeçaria retrata a fundação do [Artifact.GetOwner.GetPrimaryTitle.GetName] e outros grandes eventos históricos que levaram ao reinado [Select_CString( Artifact.GetOwner.IsFemale, 'da', 'do' )] [Artifact.GetOwner.GetTitledFirstName]."
 feature_tapestry_scene_hunt:0 "A tapeçaria retrata uma cena de caça: vários caçadores, armados com arcos e lanças, cercam um animal ferido e estão prestes a desferir o golpe mortal."
 feature_tapestry_scene_myth:0 "Deuses antigos, monstros inspiradores e heróis destemidos são tecidos neste tecido, representando uma cena do mito."
 feature_tapestry_scene_religious:0 "A tapeçaria mostra várias cenas proeminentes tiradas do cânone [Artifact.GetOwner.GetFaith.GetAdjectiveNoTooltip]."
 feature_tapestry_scene_ships:0 "A tapeçaria retrata uma poderosa frota navegando pelos mares - em cada navio, guerreiros armados examinam o horizonte em busca de inimigos."
 feature_wood_decoration_hsb_inlay:0 "A madeira é incrustada com decorações de [Artifact.GetFeatureText( 'decoration_material_inlay_HSB' )]."
 feature_wood_decoration_none:0 "A madeira foi lixada para um acabamento suave."
 feature_wood_decoration_painted_pattern:0 "A madeira foi pintada com [Artifact.GetFeatureText('decoration_pattern')]."
