 artifact_pedestal_scroll_description:0 "Um tomo de aparência formal contendo as leis fundamentais do [owner.GetPrimaryTitle.GetNameNoTooltip] escritas [Select_CString( owner.IsFemale, 'pela', 'pelo' )] [owner.GetTitledFirstNameNoTooltip]."
 artifact_pedestal_scroll_name:0 "Tomo $artifact_name_prefix$"
 artifact_pedestal_seven_branched_sword_desc:0 "A 'Espada de Sete Ramos', uma lâmina de ferro com sete bifurcações em forma de chamas, diz-se ter sido um presente de amizade ao $king_tenno_male_japanese$, enviado de além-mar pelo rei de Baekje há muito tempo."
 artifact_pedestal_seven_branched_sword_name:0 "Shichishitō"
 artifact_pedestal_skull_goblet_description:0 "Um elegante, porém macabro cálice para beber, formado a partir do crânio de [bp1_yearly_5601_dead_nemesis.GetFirstName]."
