l_spanish:
 artifact_misc_relic_banner_desc:0 "Consagrado para uso nos grandes ritos realizados em altos locais sagrados, o tecido deste estandarte está eternamente embebido na fumaça das oferendas."
 artifact_misc_relic_banner_name:0 "Estandarte Sagrado"
 artifact_misc_relic_idol_desc:0 "Um ídolo esculpido, o assento corpóreo do deus durante o ritual."
 artifact_misc_relic_idol_name:0 "Ídolo Sagrado"
 artifact_misc_relic_mask_desc:0 "Uma máscara cerimonial usada durante os ritos mais elevados, um vaso para a presença divina."
 artifact_misc_relic_mask_name:0 "Máscara Ritual"
 artifact_misc_relic_stele_desc:0 "Uma laje de pedra gravada que lista a linhagem do sacerdócio, uma testemunha através das gerações."
 artifact_misc_relic_stele_name:0 "Estela Ancestral"
 artifact_relic_abu_hanifa_turban_desc:0 "O turbante acadêmico de Abu Hanifa an-Nu'man, fundador do madhab hanafi — um polo da jurisprudência sunita para cada peregrino hanafi."
 artifact_relic_abu_hanifa_turban_name:0 "Turbante de Abu Hanifa"
 artifact_relic_analects_desc:0 "Uma cópia antiga em tiras de bambu dos Analectos — os ditados reunidos do Mestre Kong — estudados por gerações de eruditos chineses."
 artifact_relic_analects_name:0 "Analectos de Confúcio"
 artifact_relic_atash_bahram_desc:0 "Brasas incandescentes trazidas do grande Atash Bahram, o Fogo sagrado dos Sacerdotes, ainda mantido no templo do fogo."
 artifact_relic_atash_bahram_name:0 "Brasas do Adur Farnbag"
 artifact_relic_athena_promachos_desc:0 "Um fragmento de bronze da estátua colossal de Atena que outrora vigiava a Acrópole."
 artifact_relic_athena_promachos_name:0 "Fragmento de Atena Promacos"
 artifact_relic_augustine_pallium_desc:0 "O pálio usado por Agostinho de Cantuária, primeiro Arcebispo e apóstolo dos ingleses."
 artifact_relic_augustine_pallium_name:0 "Pálio de Santo Agostinho"
 artifact_relic_baptist_arm_desc:0 "O antebraço direito de João Batista, dito ser a própria mão que batizou Cristo no Jordão."
 artifact_relic_baptist_arm_name:0 "Braço Direito de São João Batista"
 artifact_relic_becket_desc:0 "As vestes encharcadas de sangue e o crânio de Thomas Becket, martirizado em sua própria catedral em 1170 e rapidamente aclamado como o maior santo da Cristandade inglesa."
 artifact_relic_becket_name:0 "Relíquias de São Thomas Becket"
 artifact_relic_black_stone_desc:0 "Um fragmento preto polido separado da Pedra Negra da Caaba, beijado pelo próprio Profeta e venerado por todo peregrino do Hajj."
 artifact_relic_black_stone_name:0 "Fragmento da Pedra Negra"
 artifact_relic_bodhi_leaf_desc:0 "Uma folha preservada da Árvore Bodhi em Bodh Gaya, sob a qual o Buda alcançou a iluminação."
 artifact_relic_bodhi_leaf_name:0 "Folha da Árvore Bodhi"
 artifact_relic_bones_of_james_desc:0 "Os ossos do Apóstolo Tiago, o Maior, que atraem peregrinos de toda a Cristandade."
 artifact_relic_bones_of_james_name:0 "Ossos de São Tiago"
 artifact_relic_buraq_footprint_desc:0 "Uma pedra contendo a pegada deixada pelo Buraq quando o Profeta ascendeu aos céus a partir da Pedra Fundamental em Jerusalém."
 artifact_relic_buraq_footprint_name:0 "Pegada do Buraq"
 artifact_relic_crown_of_thorns_desc:0 "A coroa de espinhos pressionada sobre a cabeça de Cristo antes da Crucificação."
 artifact_relic_crown_of_thorns_name:0 "Coroa de Espinhos"
 artifact_relic_dhamek_desc:0 "Uma relíquia sagrada do Buda de Sarnath, onde ele ensinou o darma aos seus primeiros discípulos."
 artifact_relic_dhamek_name:0 "Sarira da Estupa de Dhamek"
 artifact_relic_dhulfiqar_desc:0 "A espada de lâmina fendida do Profeta, dita ter sido dada por ele a Ali, e reverenciada em toda a umma como símbolo de governo sancionado divinamente."
 artifact_relic_dhulfiqar_name:0 "Dhulfiqar"
 artifact_relic_ignatius_desc:0 "Os ossos de Inácio, segundo patriarca de Antioquia e discípulo do Apóstolo João, que foi martirizado em Roma durante o reinado de Trajano."
 artifact_relic_ignatius_name:0 "Ossos de Santo Inácio"
 artifact_relic_jowo_desc:0 "Uma imagem consagrada do jovem Buda, trazida da China e considerada pelos tibetanos como a mais sagrada das estátuas."
 artifact_relic_jowo_name:0 "Jowo Shakyamuni"
 artifact_relic_kong_tomb_desc:0 "Uma tabuleta de pedra esculpida do túmulo de Confúcio em Qufu, venerada pela família Kong ao longo das gerações."
 artifact_relic_kong_tomb_name:0 "Estela do Túmulo de Kong"
 artifact_relic_krishna_stone_desc:0 "Uma pedra gasta do Krishna janmabhumi de Mathura, o exato local que a tradição aponta como o local de nascimento de Krishna."
 artifact_relic_krishna_stone_name:0 "Pedra do Nascimento de Krishna"
 artifact_relic_lance_antioch_desc:0 "Uma ponta de lança de ferro dita ter perfurado o lado de Cristo."
 artifact_relic_lance_antioch_name:0 "Santa Lança de Antioquia"
 artifact_relic_lingam_desc:0 "Um fragmento sagrado do lingam de Shiva do grande templo de Varanasi, a mais sagrada das cidades no Ganges."
 artifact_relic_lingam_name:0 "Lingam de Vishvanath"
 artifact_relic_mark_desc:0 "A cabeça ceifada do Evangelista Marcos, fundador da Igreja de Alexandria."
 artifact_relic_mark_name:0 "Cabeça de São Marcos"
 artifact_relic_nine_saints_desc:0 "Ossos dos Nove Santos — monges siríacos que fugiram das controvérsias calcedonianas para Axum e fundaram os primeiros mosteiros da Etiópia, plantando o cristianismo miafisita pelas terras altas."
 artifact_relic_nine_saints_name:0 "Ossos dos Nove Santos"
 artifact_relic_opa_oranmiyan_desc:0 "O cajado de granito do lendário rei Oranmiyan de Ifé, berço ancestral iorubá."
 artifact_relic_opa_oranmiyan_name:0 "Opa Oranmiyan"
 artifact_relic_oshe_shango_desc:0 "O Oshe Shango, um machado de duas lâminas moldado à semelhança das pedras de raio gêmeas do deus da tempestade Xangô, erguido por seus sacerdotes em dança extática."
 artifact_relic_oshe_shango_name:0 "Oshe Shango"
 artifact_relic_palitana_tirtha_desc:0 "Uma pedra de relíquia sagrada das colinas de Shatrunjaya em Palitana, o tirta mais sagrado na tradição jainista."
 artifact_relic_palitana_tirtha_name:0 "Tirta de Palitana"
 artifact_relic_parshvanatha_paduka_desc:0 "O Charan Paduka, uma pedra que traz a impressão dos pés do vigésimo terceiro Tirtancara Parshvanatha."
 artifact_relic_parshvanatha_paduka_name:0 "Charan Paduka de Parshvanatha"
 artifact_relic_paul_bones_desc:0 "Os ossos do Apóstolo Paulo, martirizado em Aquae Salviae."
 artifact_relic_paul_bones_name:0 "Ossos de São Paulo"
 artifact_relic_perun_idol_desc:0 "Um ídolo de madeira do deus do trovão Perun, senhor dos deuses eslavos, erguido pelo príncipe Vladimir."
 artifact_relic_perun_idol_name:0 "Ídolo de Perun"
 artifact_relic_peter_bones_desc:0 "Os ossos do Apóstolo Pedro, príncipe dos apóstolos e primeiro bispo de Roma."
 artifact_relic_peter_bones_name:0 "Ossos de São Pedro"
 artifact_relic_prophet_sandals_desc:0 "Sandálias de couro ditas terem sido usadas pelo Profeta, infinitamente copiadas no formato na'l por artífices devotos em toda a umma."
 artifact_relic_prophet_sandals_name:0 "Sandálias do Profeta"
 artifact_relic_rama_footprint_desc:0 "Uma pedra que carrega a pegada do próprio Rama, trazida de Aiodhya, seu local de nascimento."
 artifact_relic_rama_footprint_name:0 "Pegada de Rama"
 artifact_relic_sacred_tooth_desc:0 "O canino esquerdo do Buda, trazido de Kalinga no século IV — um paládio da realeza cuja custódia legitima o governante acima de todos os outros."
 artifact_relic_sacred_tooth_name:0 "Dente Sagrado do Buda"
 artifact_relic_shikharji_nishidhi_desc:0 "Pedras memoriais nishidhi dos picos do Monte Sammed-Shikhar, onde vinte dos vinte e quatro tirtancaras alcançaram o mocxa — o tirta mais sagrado da fé jainista."
 artifact_relic_shikharji_nishidhi_name:0 "Nishidhi dos Tirtancaras"
 artifact_relic_shin_no_mihashira_desc:0 "Uma lasca do Shin no Mihashira — o Pilar Central sagrado enterrado sob o santuário mais íntimo do Naikū, considerado o mais oculto e sagrado dos mistérios de Ise e renovado a cada reconstrução shikinen sengū."
 artifact_relic_shin_no_mihashira_name:0 "Shin no Mihashira"
 artifact_relic_suldetug_desc:0 "Um estandarte preto de pelos de iaque, um receptáculo espiritual do deus da guerra, carregado à frente dos cãs da estepe."
 artifact_relic_suldetug_name:0 "Estandarte Sülde-tug"
 artifact_relic_sword_of_ali_desc:0 "Uma lâmina que se acredita ter sido empunhada por Ali ibn Abi Talib em Badr e Siffin."
 artifact_relic_sword_of_ali_name:0 "Espada de Ali"
 artifact_relic_tablets_desc:0 "Um fragmento de pedra dito ter se quebrado das Tábuas da Lei no Monte Sinai quando Moisés as atirou ao chão em ira."
 artifact_relic_tablets_name:0 "Fragmento das Tábuas"
 artifact_relic_tabot_desc:0 "Uma tabuleta de pedra consagrada representando a Arca da Aliança, reverenciada como a mais sagrada das relíquias etíopes."
 artifact_relic_tabot_name:0 "Tabot da Aliança"
 artifact_relic_thomas_desc:0 "Os ossos e a ponta de lança manchada de sangue de Tomé Apóstolo, que dizem ter trazido a fé a Querala e ter sido martirizado ali."
 artifact_relic_thomas_name:0 "Relíquias do Apóstolo Tomé"
 artifact_relic_three_magi_desc:0 "Os ossos dos Três Reis Magos que seguiram a estrela até Belém."
 artifact_relic_three_magi_name:0 "Relíquias dos Três Magos"
 artifact_relic_trishul_desc:0 "Um tridente de três pontas dito ter sido empunhado pelo próprio Shiva — um símbolo do domínio do deus sobre a criação, preservação e destruição."
 artifact_relic_trishul_name:0 "Trishul de Shiva"
 artifact_relic_true_cross_desc:0 "Uma lasca da cruz sobre a qual Cristo foi crucificado, incrustada em um relicário dourado."
 artifact_relic_true_cross_name:0 "Fragmento da Verdadeira Cruz"
 artifact_relic_ursula_desc:0 "Os ossos de Úrsula e de suas virgens mártires acompanhantes, desenterrados nos cemitérios de Colônia."
 artifact_relic_ursula_name:0 "Ossos de Santa Úrsula"
 artifact_relic_vajrasana_desc:0 "Um fragmento polido do Vajrasana, o Trono de Diamante sob a Árvore Bodhi no qual o Buda sentou-se imóvel até o momento da iluminação."
 artifact_relic_vajrasana_name:0 "Fragmento do Vajrasana"
 artifact_relic_western_wall_desc:0 "Uma pedra lavrada retirada da parede de arrimo ocidental da plataforma do Segundo Templo, um dos poucos remanescentes que permaneceram de pé após a destruição romana do Templo em 70 d.C."
 artifact_relic_western_wall_name:0 "Pedra do Muro das Lamentações"
 artifact_relic_yata_kagami_desc:0 "Um espelho de bronze tradicionalmente identificado com uma das três Insígnias Imperiais do Japão, dito ter atraído a deusa do sol Amaterasu para fora de sua caverna."
 artifact_relic_yata_kagami_name:0 "Yata no Kagami"
 artifact_relic_yggdrasil_branch_desc:0 "Um galho dito ter caído da árvore sagrada no Templo de Uppsala, onde os corpos de oferendas abatidas ainda pendem."
 artifact_relic_yggdrasil_branch_name:0 "Galho do Yggdrasil"
