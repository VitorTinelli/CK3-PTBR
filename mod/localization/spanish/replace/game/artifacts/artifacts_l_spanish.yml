 sword_decoration_none:0 "É simples e sem decoração, mas ainda assim impressionante em aparência."
 sword_decoration_none_alt:0 "Tudo em sua construção serve a um propósito, e sua falta de pretensão opulenta dá ao dono uma aura estritamente utilitária."
 terracotta_toy_fowl.desc:0 "A superfície desgastada conta a história de um brinquedo uma vez amado."
 terracotta_toy_fowl:0 "Galinha de Brinquedo de Terracota"
 tiny_box_trinket_description:0 "Uma caixa pequena mas misteriosa. Talvez ela libere um único pecado no mundo ao ser aberta. Criada [Select_CString( inspiration_owner.IsFemale, 'pela', 'pelo' )] [inspiration_owner.GetTitledFirstNameNoTooltip]."
 tiny_box_trinket_name:0 "Miniatura de Caixa"
 tiny_cabinet_trinket_description:0 "Um armário pequeno o suficiente para provavelmente ser guardado em outro armário para evitar que seja pisoteado. Criado [Select_CString( inspiration_owner.IsFemale, 'pela', 'pelo' )] [inspiration_owner.GetTitledFirstNameNoTooltip]."
 tiny_cabinet_trinket_name:0 "Miniatura de Armário"
 tiny_chest_trinket_description:0 "Um baú pequeno, mas do tamanho de um dedo. Ele balança quando agitado, denunciando o conteúdo dentro. Criado [Select_CString( inspiration_owner.IsFemale, 'pela', 'pelo' )] [inspiration_owner.GetTitledFirstNameNoTooltip]."
 tiny_chest_trinket_name:0 "Miniatura de Baú"
 tiny_sculpture_trinket_description:0 "Uma miniatura de escultura [Select_CString( statue_owner.IsFemale, 'da', 'do' )] [statue_owner.GetTitledFirstNameNoTooltip]. Tamanho de bolso e pronta para governar. Criada [Select_CString( inspiration_owner.IsFemale, 'pela', 'pelo' )] [inspiration_owner.GetTitledFirstNameNoTooltip]."
 tiny_sculpture_trinket_name:0 "Miniatura de Escultura"
