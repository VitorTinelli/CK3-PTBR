l_spanish:
 abhidhamma_pitaka_description:0 "Uma obra detalhada de estudos analisando os ensinamentos de Buda. Parte do Cânone Pali."
 abhidhamma_pitaka_name:0 "Pitaka Abhidhamma"
 adverb_quality_excellent:0 "excelentemente"
 adverb_quality_fine:0 "finamente"
 adverb_quality_masterful:0 "mestramente"
 adverb_wealth_beautiful:0 "belamente"
 adverb_wealth_elegant:0 "elegantemente"
 adverb_wealth_extravagant:0 "extravagantemente"
 adverb_wealth_fancy:0 "com elegância"
 adverb_wealth_lavish:0 "suntuosamente"
 adverb_wealth_masterful:0 "com maestria"
 adverb_wealth_opulent:0 "opulentamente"
 adverb_wealth_ornate:0 "ornamentalmente"
 adverb_wealth_plain:0 "simplesmente"
 adverb_wealth_rich:0 "riqueza"
 adverb_wealth_wonderful:0 "maravilhosamente"
 afarganyu_name:0 "Afarganyu"
 al_dawat_description:0 "Esta é uma tinteiro feito de ouro e coral. Por muito tempo, desempenhou um papel especial nas cerimônias do Califado."
 al_dawat_name:0 "al-Dawat"
 al_hafir_description:0 "Este rubi vermelho, conhecido como al-Hafir ou 'o casco', é de uma qualidade raramente vista neste mundo. Ele é costurado em um pedaço de seda com hastes de esmeralda formando um círculo ao seu redor. Tradicionalmente, ele adornava o rosto do cavalo do califa."
 al_hafir_name:0 "al-Hafir"
 al_sayf_al_khass_description:0 "Esta espada cravejada de joias diz-se ter sido feita de um raio. Ela é guardada em uma capa dourada inscrita, da qual raramente saiu devido ao seu significado cerimonial no califado."
 al_sayf_al_khass_name:0 "al-Sayf al-Khass"
 al_taj_crown_description:0 "A 'Coroa Honrosa' ou 'Envoltório de Veneração' é a coroa processional tradicional dos califas fatímidas. É adornada pela enorme jóia 'al-Yatima'."
 al_taj_crown_name:0 "al-Taj al-Sharif"
 animal_ring_description:0 "Com incrustações de joias e em muitas cores, você tem mais chances de ser capaz de cegar seus cortesãos do que impressionar com seu senso de moda. Enviado para [Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstNameNoTooltip] [Select_CString( inspiration_owner.IsFemale, 'pela', 'pelo' )] [inspiration_owner.GetTitledFirstNameNoTooltip] durante as aventuras [inspiration_owner.GetHerHim]."
 animal_ring_name:0 "Anel de Tigre Chamativo"
 article_wealth_beautiful:0 "Um bonito"
 article_wealth_elegant:0 "Um elegante"
 article_wealth_extravagant:0 "Um extravagante"
 article_wealth_fancy:0 "Um sofisticado"
 article_wealth_opulent:0 "Um opulento"
 article_wealth_ornate:0 "Um ornamentado"
 article_wealth_plain:0 "Um simples"
 artifact_:0 "Artefato Destruído"
 artifact_afarganyu_description:0 "Este grande vaso é onde o fogo sagrado, central para muitas das cerimônias da fé zoroástrica, é aceso. Uma inscrição antiga fala sobre a pessoa que originalmente o doou para o sacerdócio."
 artifact_aram_description:0 "Esta antiga lança escurecida já viu gerações passarem. É tão antiga que muitos acreditam que seja a lendária lança Aram, conhecida pelas histórias de Jangar."
 artifact_aram_name:0 "Aram"
 artifact_armor_brigandine_description:0 "O [newly_created_artifact.GetFeatureText('armor_material')] da armadura é revestido internamente com placas de aço oblongas e coberto com uma camada de [newly_created_artifact.GetFeatureText('generic_material_cloth')]."
 artifact_armor_brigandine_lowercase:0 "armadura segmentada"
 artifact_armor_brigandine_uppercase:0 "Armadura Segmentada"
 artifact_armor_description:0 "[SCOPE.Custom('ArtifactArmorDesc')]. [newly_created_artifact.GetFeatureText('armor_helmet')]. [newly_created_artifact.GetFeatureText('armor_decoration')]."
 artifact_armor_descriptor_flexible:0 "flexível"
 artifact_armor_descriptor_powerful:0 "poderosa"
 artifact_armor_descriptor_shiny:0 "brilhante"
 artifact_armor_fallback_description:0 "[SCOPE.Custom('ArtifactDecorationArmor')]."
 artifact_armor_lamellar_description:0 "A armadura é construída a partir de placas de [newly_created_artifact.GetFeatureText('armor_material')] que são [SCOPE.Custom('ArtifactAdverbQuality')] unidas com cordas de [newly_created_artifact.GetFeatureText('generic_material_cordage')] de pano, enquanto o acabamento e o revestimento são feitos de um fino [newly_created_artifact.GetFeatureText('generic_material_cloth')]."
 artifact_armor_lamellar_lowercase:0 "armadura lamelar"
 artifact_armor_lamellar_uppercase:0 "Armadura Lamelar"
 artifact_armor_laminar_description:0 "A armadura é construída a partir de faixas horizontais [newly_created_artifact.GetFeatureText('armor_material')] que são trançadas juntas com cordas de [newly_created_artifact.GetFeatureText('generic_material_cordage')], enquanto o acabamento e o forro são cortados em um belo [newly_created_artifact.GetFeatureText('generic_material_cloth')]."
 artifact_armor_laminar_lowercase:0 "armadura laminar"
 artifact_armor_laminar_uppercase:0 "Armadura Laminar"
 artifact_armor_mail_description:0 "Embora os elos de corrente não ofereçam espaço para decoração, o trabalho [SCOPE.Custom('ArtifactQuality')] nos rebites diferencia esta peça do corrente comum."
 artifact_armor_mail_lowercase:0 "cota de malha"
 artifact_armor_mail_uppercase:0 "Cota de Malha"
 artifact_armor_name:0 "[SCOPE.Custom('ArtifactArmorArtifactName')]"
 artifact_armor_name_basic:0 "[SCOPE.Custom('ArtifactArmorTypeUppercase')|U] [newly_created_artifact.GetFeatureText( 'armor_property' )|U] $artifact_name_prefix$"
 artifact_armor_name_culture:0 "[SCOPE.Custom('ArtifactArmorTypeUppercase')|U] [ROOT.Char.GetCulture.GetNameNoTooltip]"
 artifact_armor_name_descriptor:0 "[SCOPE.Custom('ArtifactArmorTypeUppercase')|U] [newly_created_artifact.GetFeatureText( 'armor_property' )|U]"
 artifact_armor_name_dynasty:0 "[SCOPE.Custom('ArtifactArmorTypeUppercase')|U] dos [ROOT.Char.GetDynasty.GetBaseNameNoTooltip]"
 artifact_armor_plate_description:0 "A armadura é construída a partir de grandes placas de [newly_created_artifact.GetFeatureText('armor_material')] que foram forjadas [SCOPE.Custom('ArtifactAdverbQuality')] para cobrir completamente o usuário."
 artifact_armor_plate_lowercase:0 "armadura de placa"
 artifact_armor_plate_uppercase:0 "Armadura de Placa"
 artifact_armor_scale_description:0 "A armadura é construída a partir de escamas [newly_created_artifact.GetFeatureText('armor_material')] [SCOPE.Custom('ArtifactAdverbQuality')] trabalhadas que são fixadas em um suporte de couro."
 artifact_armor_scale_lowercase:0 "armadura de escamas"
 artifact_armor_scale_uppercase:0 "Armadura de Escamas"
 artifact_armor_shield_lowercase:0 "um escudo"
 artifact_armor_shield_uppercase:0 "Um Escudo"
 artifact_arms_of_alex_description:0 "Este antigo conjunto de armadura de linho laminado é dito ter pertencido a Alexandre, o Grande. Embora não seja mais adequada para uso, a armadura em si carrega o legado do grande conquistador, conhecido do Mediterrâneo às bordas da Índia."
 artifact_arms_of_alex_name:0 "Armadura de Alexandre"
 artifact_aruval_description:0 "Este longo Aruval é dito ser tão antigo que é possível que Karuppu Sami o tenha empunhado uma vez."
 artifact_aruval_name:0 "Aruval Antigo"
 artifact_axe_description:0 "Um machado de batalha [SCOPE.Custom('ArtifactQuality')] de artesanato. [newly_created_artifact.Custom('ArtifactAxeHeadDescription')] [newly_created_artifact.Custom('ArtifactAxeHaftDescription')]"
 artifact_axe_haft_decorated:0 "um elegante cabo de [ROOT.Artifact.GetFeatureText( 'shaft_wood' )] que foi [ROOT.Artifact.GetFeatureText( 'shaft_decoration' )]."
 artifact_axe_haft_undecorated:0 "um cabo resistente de [ROOT.Artifact.GetFeatureText( 'shaft_wood' )]. É habilmente equilibrado e tão fácil de balançar quanto é afiado."
 artifact_axe_head_decorated:0 "A cabeça de [ROOT.Artifact.GetFeatureText( 'head_metal' )] foi [ROOT.Artifact.GetFeatureText( 'head_decoration' )] e, em seguida, montada em"
 artifact_axe_head_undecorated:0 "A cabeça de [ROOT.Artifact.GetFeatureText( 'head_metal' )] é montada em"
 artifact_axe_name:0 "Machado de batalha $artifact_name_prefix$"
 artifact_banner_islam_description:0 "Dizem que esta é a Bandeira Sagrada de Maomé, uma relíquia dos dias do profeta e um símbolo de toda a fé muçulmana."
 artifact_banner_islam_name:0 "Bandeira Sagrada de Maomé"
 artifact_bow:0 "Arco"
 artifact_bow_description:0 "Um arco [SCOPE.Custom('ArtifactQuality')], feito de madeira [newly_created_artifact.GetFeatureText( 'bow_wood' )], encordado com [newly_created_artifact.GetFeatureText( 'bow_string' )], útil tanto para caça quanto para guerra."
 artifact_bow_name:0 "Arco $artifact_name_prefix$"
 artifact_bronze_head_description:0 "Esta cabeça de bronze naturalista captura com grande detalhe as características de um antigo governante já falecido, parecendo mais uma escultura do que algo fundido em metal. A cabeça é adornada com uma coroa que mostra o status do monarca retratado."
 artifact_bronze_head_name:0 "Cabeça de Bronze"
 artifact_brooch:0 "Broche"
 artifact_brooch_description:0 "[SCOPE.Custom('ArtifactArticleWealth')] broche de artesanato [SCOPE.Custom('ArtifactQuality')]. [newly_created_artifact.GetFeatureText( 'brooch_decoration' )]."
 artifact_brooch_name:0 "Broche $artifact_name_prefix$"
 artifact_brooch_pedestal:0 "$artifact_brooch$"
 artifact_chinese_caligraphy_description:0 "Este delicado pedaço de papel está coberto por caracteres belos e muito precisos; clareza e elegância emanam do papel. Embora o escriba que o produziu seja desconhecido, o artesanato é certamente excelente."
 artifact_chinese_caligraphy_name:0 "Caligrafia Chinesa"
 artifact_cintamani_buddhist_description:0 "Esta é uma pedra que dizem ter caído do céu. Alguns afirmam que já foi segurada pelos Bodhisattvas Avalokiteshvara e Ksitigarbha, e que também realiza os desejos daqueles que a possuem."
 artifact_cintamani_hindu_description:0 "Esta é uma pedra que dizem ter caído do céu. Alguns afirmam que ela já pertenceu a Vishnu ou ao rei Naga, e que também traz prosperidade ao seu dono."
 artifact_cintamani_name:0 "Pedra Cintamani"
 artifact_colada_description:0 "Rumor diz que uma das espadas de El Cid é esta lâmina, uma inspiração para qualquer pessoa que aspire às suas virtudes cavalheirescas."
 artifact_colada_name:0 "Colada"
 artifact_composite:0 "Arco Composto"
 artifact_composite_description:0 "Um arco composto [SCOPE.Custom('ArtifactQuality')], feito de madeira [newly_created_artifact.GetFeatureText( 'composite_wood' )], reforçado com chifre de [newly_created_artifact.GetFeatureText( 'composite_horn' )] e tendão, e encordado com [newly_created_artifact.GetFeatureText( 'bow_string' )]. Seu tamanho reduzido o torna ideal para atirar a cavalo."
 artifact_composite_name:0 "Arco Composto $artifact_name_prefix$"
 artifact_crossbow:0 "Besta"
 artifact_crossbow_description:0 "Uma besta [SCOPE.Custom('ArtifactQuality')], com coronha de [newly_created_artifact.GetFeatureText( 'bow_wood' )] e corda de tendão. Extremamente poderosa e pode ser mantida pronta, mas lenta para recarregar."
 artifact_crossbow_name:0 "Besta $artifact_name_prefix$"
 artifact_crown_description:0 "[SCOPE.Custom('ArtifactArticleWealth')] coroa de artesanato [SCOPE.Custom('ArtifactQuality')]. A coroa é forjada em [newly_created_artifact.GetFeatureText('decoration_material_wire')] e [newly_created_artifact.GetFeatureText('crown_decoration')]."
 artifact_crown_name:0 "Coroa $artifact_name_prefix$"
 artifact_crystal_carving_description:0 "Este pedaço retangular de cristal de rocha transparente é quase perfeitamente transparente, e a maior parte de sua superfície é coberta por esculturas intricadas. É um objeto de grande beleza, mas de utilidade pouco clara."
 artifact_crystal_carving_name:0 "Escultura de Cristal"
 artifact_curtana_description:0 "Diz-se que esta é a Curtana, a espada da Misericórdia. A lendária espada foi uma vez empunhada por Tristan contra Morholt. Isso também pode ser o motivo pelo qual a ponta da espada está faltando, um pedaço perdido no crânio espesso do gigante irlandês."
 artifact_curtana_name:0 "Curtana"
 artifact_dagger_description:0 "Uma adaga [newly_created_artifact.GetFeatureText( 'blade_metal' )] de artesanato [SCOPE.Custom('ArtifactQuality')]. [newly_created_artifact.Custom('ArtifactDaggerDecoration')]"
 artifact_dagger_name:0 "Adaga [Select_CString( owner.IsFemale, 'da', 'do' )] [owner.GetTitledFirstNameNoTooltip]"
 artifact_dagger_of_rostam_description:0 "Esta adaga intricada é afirmada ser a que Rostam usou para matar o Daeva branco."
 artifact_dagger_of_rostam_name:0 "Adaga de Rostam"
 artifact_dragvandil_description:0 "Uma espada que dizem ter pertencido a Egill Skallagrimsson, fazendeiro, poeta e guerreiro, conhecido pela Saga de Egill."
 artifact_dragvandil_name:0 "Dragvandil"
 artifact_durendal_description:0 "Esta espada curta e pesada é dita ser a lendária Durendal, escondida por Roland como seu último ato, em uma tentativa de negá-la aos inimigos da coroa."
 artifact_durendal_name:0 "Durendal"
 artifact_fine_brooch_description:0 "A sutil invocação do nome de [artifact.GetOwner.GetHouse.GetBaseName] ao redor das bordas deste broche fez com que sua legitimidade se espalhasse rapidamente."
 artifact_fine_brooch_name:0 "Broche Fino"
 artifact_hammer_description:0 "Um martelo de guerra [SCOPE.Custom('ArtifactQuality')] de artesanato. [newly_created_artifact.Custom('ArtifactHammerHeadDescription')] [newly_created_artifact.Custom('ArtifactHammerShaftDescription')]"
 artifact_hammer_head_decorated:0 "$artifact_axe_head_decorated$"
 artifact_hammer_head_undecorated:0 "$artifact_axe_head_undecorated$"
 artifact_hammer_name:0 "Martelo de Guerra $artifact_name_prefix$"
 artifact_hammer_shaft_decorated:0 "um elegante cabo de [ROOT.Artifact.GetFeatureText( 'shaft_wood' )] que foi [ROOT.Artifact.GetFeatureText( 'shaft_decoration' )]."
 artifact_hammer_shaft_undecorated:0 "um cabo resistente de [ROOT.Artifact.GetFeatureText( 'shaft_wood' )]."
 artifact_ibeji_description:0 "Esta é uma pequena escultura de madeira que representa um gêmeo falecido, acreditando-se que traga riqueza e fortuna se cuidado pela sua família. É adornado com um elaborado e bastante alto penteado."
 artifact_ibeji_name:0 "Ibeji"
 artifact_icon_description:0 "[SCOPE.Custom('ArtifactArticleWealth')] ícone de artesanato [SCOPE.Custom('ArtifactQuality')] retratando [newly_created_artifact.GetFeatureText('icon_decoration')]"
 artifact_icon_name:0 "Ícone de [newly_created_artifact.GetFeatureText('icon_decoration')]"
 artifact_ikenga_description:0 "Esta pequena estátua com chifres é alegadamente capaz de conceder sucesso e vitória ao seu dono."
 artifact_ikenga_name:0 "Ikenga"
 artifact_jewelled_danda_description:0 "Este é um cajado adornado com jóias da Índia, o sinal supremo da autoridade real e da habilidade de um monarca em impor punições aos seus súditos."
 artifact_jewelled_danda_name:0 "Cajado com Joias"
 artifact_joyeuse_description:0 "A Espada de Carlos Magno, forjada para conter a Lança de Longinus. Joyeuse é um símbolo tanto do valor cavaleiresco quanto do legado real do império de Carlos Magno."
 artifact_joyeuse_name:0 "Joyeuse"
 artifact_kantele_description:0 "Este instrumento de cordas de madeira tem sido passado de geração em geração. Rumores afirmam que ele pode até datar dos dias de Väinämöinen."
 artifact_kantele_name:0 "Kantele Antiga"
 artifact_kaves_apron_description:0 "Diz-se que esta bandeira rasgada é o lendário estandarte que o ferreiro persa Kave fez de seu avental para unir seu povo contra seu malvado soberano."
 artifact_kaves_apron_name:0 "Avental de Kave"
 artifact_khanda_description:0 "Este Khanda foi feito para cerimônia em vez de combate, e por gerações tem sido um lembrete da necessidade de cortar o véu da ignorância."
 artifact_khanda_name:0 "Khanda Cerimonial"
 artifact_kladenets_description:0 "Embora tenha visto dias melhores, esta antiga espada de aço dizem ser a mítica Kladenets, uma espada que pode se mover sozinha. Em sua condição atual, é difícil manuseá-la, mas sua mera presença comanda respeito daqueles que acreditam em sua origem sobrenatural."
 artifact_kladenets_name:0 "Kladenets"
 artifact_kris_description:0 "Um Kris de [newly_created_artifact.GetFeatureText( 'blade_metal' )] com artesanato de qualidade [SCOPE.Custom('ArtifactQuality')]. [newly_created_artifact.Custom('ArtifactDaggerDecoration')]"
 artifact_kris_name:0 "Kris d[Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstNamePossessiveNoTooltip]"
 artifact_legbiter_description:0 "Uma espada extremamente afiada com cabo de marfim. A arma dizem ter pertencido ao grande rei Magnus Olafsson da Noruega."
 artifact_legbiter_name:0 "Mordedor de Pernas"
 artifact_longbow:0 "Arco Longo"
 artifact_longbow_description:0 "Um arco longo [SCOPE.Custom('ArtifactQuality')], esculpido em [newly_created_artifact.GetFeatureText( 'longbow_wood' )], utilizando a madeira elástica da madeira jovem e a madeira rígida do cerne, e encordado com [newly_created_artifact.GetFeatureText( 'bow_string' )]. Maior que um homem, poucos arcos podem igualar sua força de tração."
 artifact_longbow_name:0 "Arco Longo $artifact_name_prefix_owner_culture$"
 artifact_longsword_name:0 "Espada Longa $artifact_name_prefix$"
 artifact_mace_description:0 "Uma maça [SCOPE.Custom('ArtifactQuality')] com esporões de habilidade. [newly_created_artifact.Custom('ArtifactMaceHeadDescription')] [newly_created_artifact.Custom('ArtifactMaceHandleDescription')]"
 artifact_mace_handle_decorated:0 "um cabo elegante de [ROOT.Artifact.GetFeatureText( 'handle_metal' )] que foi [ROOT.Artifact.GetFeatureText( 'metal_handle_decoration' )]."
 artifact_mace_handle_undecorated:0 "um cabo sólido de [ROOT.Artifact.GetFeatureText( 'handle_metal' )]."
 artifact_mace_head_decorated:0 "$artifact_axe_head_decorated$"
 artifact_mace_head_undecorated:0 "$artifact_axe_head_undecorated$"
 artifact_mace_name:0 "Maça $artifact_name_prefix$"
 artifact_magnificent_crown_description:0 "O belo filigrana desta coroa e os padrões finamente trabalhados servem para destacar a verdadeira razão de sua existência: os relevos gravados dos ancestrais d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetFirstName] invocam sua autoridade e a entrelaçam com a sua própria."
 artifact_magnificent_crown_name:0 "Coroa Magnífica"
 artifact_makarakundala_description:0 "Estes são brincos como os usados pelos deuses, alguns até afirmam que este par em particular pertenceu a seres divinos."
 artifact_makarakundala_name:0 "Makarakundala"
 artifact_mantle_of_the_prophet_description:0 "Herdado por séculos de um Califa para o próximo, este é o manto do Profeta. É tradicionalmente usado pelo Califa durante todos os feriados festivos, dando-lhe uma aura de tranquilidade e dignidade inabaláveis."
 artifact_mantle_of_the_prophet_islam_name:0 "Manto do Profeta"
 artifact_mmaagha_kamalu_description:0 "Esta é uma espada cerimonial muito antiga e ornamentada. Diz-se que já pertenceu a Kamalu, o deus igbo da guerra."
 artifact_mmaagha_kamalu_name:0 "Mmaagha Kamalu"
 artifact_muhammads_epistles_description:0 "Esta carta faz parte da correspondência entre o profeta Maomé e os governantes de [newly_created_artifact.Custom('EpistleReciever')|U]."
 artifact_muhammads_epistles_name:0 "Carta de Muhammad"
 artifact_nagelring_description:0 "De acordo com a tradição, esta espada envelhecida está ligada ao lendário e bastante popular Dietrich von Bern. Essa conexão elevou o item a uma fama de outra forma injustificada."
 artifact_nagelring_name:0 "Anel Nagel"
 artifact_name_prefix:0 "[SCOPE.Custom('ArtifactPrefixGeneric')]"
 artifact_name_prefix_artifact_scope:0 "[Artifact.GetOwner.Custom('ArtifactPrefixGenericAfterCreation')]"
 artifact_name_prefix_artifact_scope_owner_culture:0 "[Artifact.GetOwner.GetCulture.GetNameNoTooltip]"
 artifact_name_prefix_artifact_scope_owner_dynasty:0 "dos [Artifact.GetOwner.GetDynasty.GetBaseNameNoTooltip]"
 artifact_name_prefix_artifact_scope_owner_name:0 "d[Select_CString( Artifact.GetOwner.IsFemale, 'a', 'o' )] [Artifact.GetOwner.GetTitledFirstNameNoTooltip]"
 artifact_name_prefix_descriptor_high_quality:0 "magnífico"
 artifact_name_prefix_descriptor_low_quality:0 "fino"
 artifact_name_prefix_descriptor_medium_alt_version_quality:0 "excelente"
 artifact_name_prefix_descriptor_medium_quality:0 "robusto"
 artifact_name_prefix_inspiration_owner_name:0 "d[Select_CString( inspiration_owner.IsFemale, 'a', 'o' )] [inspiration_owner.GetTitledFirstNameNoTooltip]"
 artifact_name_prefix_location_culture:0 "[owner.MakeScope.Var('adventure_artifact_location').Province.GetHolder.GetCulture.GetNameNoTooltip]"
 artifact_name_prefix_owner_culture:0 "[owner.GetCulture.GetNameNoTooltip]"
 artifact_name_prefix_owner_dynasty:0 "dos [owner.GetDynasty.GetBaseNameNoTooltip]"
 artifact_name_prefix_owner_name:0 "d[Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstNameNoTooltip]"
 artifact_navaratna_description:0 "Uma cadeia de nove gemas, com um grande rubi no meio, simbolizando os nove deuses celestiais do hinduísmo."
 artifact_navaratna_name:0 "Navaratna"
 artifact_necklace:0 "Colar"
 artifact_necklace_description:0 "[SCOPE.Custom('ArtifactArticleWealth')] um colar, porém delicado, de [SCOPE.Custom('ArtifactQuality')] fabricação. O colar é forjado com [newly_created_artifact.GetFeatureText( 'decoration_material_wire' )] e apresenta um lindo pingente de [newly_created_artifact.GetFeatureText( 'decoration_material_gem' )]."
 artifact_necklace_name:0 "Colar de [newly_created_artifact.GetFeatureText( 'decoration_material_gem' )|U] e [newly_created_artifact.GetFeatureText( 'decoration_material_wire' )|U]"
 artifact_necklace_pedestal:0 "$artifact_necklace$"
 artifact_olifant_description:0 "Um grande chifre de marfim, coberto por entalhes intrincados. Alguns afirmam que é o próprio chifre usado por Roland para convocar ajuda antes de morrer na batalha de Roncevaux."
 artifact_olifant_name:0 "Olifant"
 artifact_oxus_bracelet_description:0 "Esta pulseira de maravilhosa artesanato é dito ser originária da terra de $k_transoxiana$. Embora sua incrustação de esmalte e pedras semipreciosas esteja perdida há muito tempo, o ouro mantém seu brilho. Pulseiras como esta eram presentes de honra nas cortes do Rei dos Reis na antiguidade, então talvez tenha sido usada por um grande lorde na Babilônia."
 artifact_oxus_bracelet_name:0 "Pulseira de Oxus"
 artifact_pas_darmes_spurs:0 "Troféu Pas D'Armes"
 artifact_pas_darmes_spurs_description:0 "Um par de esporas [SCOPE.Custom('ArtifactQuality')] de [newly_created_artifact.GetFeatureText( 'generic_material_metal' )] pertencentes a [owner.GetFullName], entregues a [winner.GetFullName] em um pas d'armes em [location.GetName]."
 artifact_pas_darmes_spurs_name:0 "Esporas d[Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetFirstNameNoTooltip]"
 artifact_pas_darmes_token:0 "Ficha Pas D'Armes"
 artifact_pas_darmes_token_description:0 "[owner.GetFullName] [SCOPE.Custom('ArtifactQuality')] [newly_created_artifact.GetFeatureText( 'generic_material_cloth' )] [owner.Custom('GetTournamentFavor')] decorado(a) com [newly_created_artifact.GetFeatureText( 'decoration_pattern' )], cedido(a) a [winner.GetFullName] em um pas d'armes em [location.GetName]."
 artifact_pas_darmes_token_name:0 "Ficha d[Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetFirstNameNoTooltip]"
 artifact_pedestal_al_jabal_description:0 "Este é um anel adornado com um grande rubi conhecido como al-Jabal, ou 'a Montanha'. A pedra é de tamanho incomparável e diz-se que o próprio anel já foi usado pelos imperadores sassânidas da Pérsia."
 artifact_pedestal_al_jabal_name:0 "al-Jabal"
 artifact_pedestal_al_yatima_description:0 "Conhecida como al-Yatima ('a Órfã'), esta enorme pérola é dita ser diferente de qualquer outra neste mundo. Órfã entre as famílias de pedras preciosas e pérolas."
 artifact_pedestal_al_yatima_name:0 "al-Yatima"
 artifact_pedestal_great_diamond_description:0 "Esta enorme gema diz-se que já adornou uma estátua do templo, antes de ser roubada por um intruso ganancioso."
 artifact_pedestal_great_diamond_name:0 "Grande Diamante"
 artifact_pedestal_koh_i_noor_description:0 "Este é um diamante de tamanho e claridade incomparáveis. Diz-se que foi escavado nas minas do sudeste da Índia, mas sua verdadeira origem é provavelmente desconhecida."
 artifact_pedestal_koh_i_noor_name:0 "Montanha de Luz"
 artifact_pillow_book:0 "O Livro do Travesseiro"
 artifact_pillow_book_description:0 "Escrito pela poetisa e dama da corte Sei Shōnagon como seu diário pessoal, o chamado Livro do Travesseiro oferece um vislumbre das fofocas, romances e dramas do dia a dia da aristocracia japonesa."
 artifact_pressed_flower_description:0 "Uma bela flor de [SCOPE.Custom('ArtifactFlowerSpecies')], prensada e seca para preservar sua beleza."
 artifact_pressed_flower_name:0 "[SCOPE.Custom('ArtifactFlowerSpecies')|U] prensada"
 artifact_quernbiter_description:0 "Esta espada foi empunhada pelo próprio rei Haakon da Noruega, e naquela época diziam que era tão afiada que poderia cortar pedras de moinho."
 artifact_quernbiter_name:0 "Quebrapedra"
 artifact_regalia_description:0 "[SCOPE.Custom('ArtifactArticleWealth')] conjunto de ornamento de artesanato [SCOPE.Custom('ArtifactQuality')]. É composto por [newly_created_artifact.GetFeatureText('regalia_scepter')], [newly_created_artifact.GetFeatureText('regalia_clothes')], e [newly_created_artifact.GetFeatureText('regalia_accessory')]."
