 easteregg_artifact_elisabeth_plush_description:0 "A raposa de pelúcia de Elisabeth é um brinquedo muito querido e esteve com ela por grande parte de sua vida. Elisabeth frequentemente falava com ele enquanto tecia intrincados cifras para quem pudesse empregar seus serviços. É reconfortante e inspira seu portador a imitar a astúcia da raposa."
 easteregg_artifact_jason_sword:0 "Espada de São Martinho"
 easteregg_artifact_jason_sword_description:0 "Ao longo da nervura da lâmina, alguém raspou desajeitadamente as palavras \"Eu sou o que é.\""
 easteregg_artifact_map_lohmander:0 "Antigo Itinerário"
 easteregg_artifact_map_lohmander_description:0 "Este pequeno livro encadernado em couro contém os contos de um escriba escandinavo e sua jornada do oeste até a Índia. Ele detalha perigos, rotas e o equipamento necessário, desde onde encontrar água até onde será preciso o tipo certo de botas, e assim por diante. Também possui uma grande quantidade de informações sobre tipos locais de comida e danças.\n\nDentro, há também diversos mapas dobrados, representando o subcontinente e muitos outros lugares, com anotações sobre locais distantes e seus nomes em épocas passadas."
 easteregg_artifact_nicks_redolence:0 "A Última Fragrância"
 easteregg_artifact_nicks_redolence_description:0 "Um pequeno frasco com uma medida de fragrância de cor — [ROOT.Char.Custom('GetComplexColor')] —, certamente capaz de fazer lordes e damas desmaiarem em sua presença. Uma pequena inscrição em sua rolha diz #EMP \"E agora, o fim está próximo...\"#!"
 easteregg_artifact_veronica_book:0 "Os Anéis do Senhor"
 easteregg_artifact_veronica_book_description:0 "Uma referência sutil, em forma de livro. Escrito no melhor português."
 edmund_head_description:0 "Edmund exigiu que se tornasse um santo desde o momento de seu nascimento. As lendas contam que ele foi um rei de East Anglia que se ofereceu como sacrifício aos vikings em vez de deixar seu povo ser massacrado por eles."
 edmund_head_name:0 "Cabeça de São Edmund"
 epistle_arabia:0 "as tribos árabes"
 epistle_bahrain:0 "Bahrain"
 epistle_byzantium:0 "o Império Romano Oriental"
 epistle_persia:0 "a Pérsia"
 epistle_syria:0 "Síria"
 essen_crown_description:0 "Alguns dizem que esta coroa foi criada para a coroação de Otto III em Essen, outros que foi destinada a coroar uma estátua da Virgem. De qualquer forma, é muito pequena, mas você pode tentar colocá-la na sua cabeça."
 essen_crown_name:0 "Kinderkrone"
 excalibur_description:0 "Não há governante na Grã-Bretanha que não reivindique a verdadeira Excalibur. Guerras são pagas vendendo Excaliburs, e você deve esperar que seus convidados não peguem outro exibindo a espada."
 excalibur_name:0 "'Excalibur'"
 fake_papal_tiara_description:0 "Uma réplica imponente de uma mitra papal que talvez não resista a uma inspeção minuciosa. Ainda assim, é uma diversão, não é mesmo?"
 fake_papal_tiara_name:0 "Tiara Papal Falsa"
 famed_replica_sassanian_sword_description:0 "Esta espada é inspirada na visão de uma gloriosa era passada, remontando ao passado heróico dos ancestrais do fabricante. Ela $sassanian_sword_description_base$, tornando-a uma visão magnífica de se ver. Ao empunhá-la, projeta-se a imagem dos lendários reis do passado."
