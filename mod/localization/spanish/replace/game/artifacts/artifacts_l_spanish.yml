 dynastic_imperial_seal.desc:0 "Este é o selo imperial dos [owner.GetDynasty.GetBaseNameNoTooltip] e da [owner.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]. Ele foi criado a pedido de [owner.GetTitledFirstNamePossessiveNoTooltip] e é um [newly_created_artifact.GetFeatureText('decoration_material_slate')] com [newly_created_artifact.GetFeatureText('decoration_material_ink')]. O selo é um dos mais importantes tesouros do reino e um símbolo de sua dinastia governante."
