 artifact_ring:0 "Anel"
 artifact_ring_angelica_description:0 "Diz-se que este é o próprio anel usado por Angelica, conhecida nas histórias de Roland e Carlos Magno. Seus poderes devem ter acabado, já que não parece mais conceder invisibilidade, mas ainda é um magnífico símbolo desta princesa há muito tempo desaparecida."
 artifact_ring_angelica_name:0 "Anel de Angelica"
 artifact_ring_description:0 "[SCOPE.Custom('ArtifactArticleWealth')] anel de artesanato [SCOPE.Custom('ArtifactQuality')]. Sua haste de [newly_created_artifact.GetFeatureText( 'generic_material_metal' )] [newly_created_artifact.GetFeatureText( 'ring_decoration' )]."
 artifact_ring_name:0 "Anel $artifact_name_prefix$"
 artifact_ruyi_description:0 "Este é um pequeno cetro de jade coberto por símbolos e adornos. O artesanato é primoroso."
 artifact_ruyi_name:0 "Ruyi"
 artifact_sassanian_replica_sword_name:0 "Espada Estilo Sassânida"
 artifact_sassanian_sword_description:0 "Diz-se ser um vestígio da antiga era Sassânida, esta espada $sassanian_sword_description_base$, tornando-a uma visão magnífica de se ver. Embora hoje em dia seja muito frágil para ser levada à batalha, talvez esta espada tenha sido empunhada por um herói agora perdido no tempo?"
