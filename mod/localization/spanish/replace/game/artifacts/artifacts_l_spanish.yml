 prince_archivist_love_poem_description:0 "Uma balada sobre dois homens apaixonados - um príncipe e um arquivista, observando as estrelas no topo de uma torre longe de olhares curiosos e juntos entre as estrelas. Rumores sugerem que o arquivista é baseado nas experiências [Select_CString( inspiration_owner.IsFemale, 'da autora', 'do autor' )] [inspiration_owner.GetTitledFirstNameNoTooltip]."
 prince_archivist_love_poem_name:0 "Eu a Lua, Você o Sol"
 qadib_al_mulk_description:0 "O bastão processional do Califado Fatímida, coberto de ouro e adornado com pérolas e joias."
 qadib_al_mulk_name:0 "Qadib al-Mulk"
 quail_eggshell_gem.desc:0 "Um pedaço colorido de casca de ovo que passa por uma gema."
 quail_eggshell_gem:0 "Gema de Casca de Ovo de Codorna"
 quality_excellent:0 "excelente"
 quality_fine:0 "fino"
 quality_masterful:0 "mestre"
 quality_very_fine:0 "muito fino"
 reichskrone_description:0 "Este é o emblema do cargo do Imperador Sagrado Romano. Garantido para chamar a atenção de todos os duques que passam."
 reichskrone_name:0 "Reichskrone"
 robe_kassapa:0 "Parte do Manto de Kassapa"
 robe_kassapa_desc:0 "Kassapa, o terceiro Buda do presente Kalpa, usou esta roupa durante grande parte de sua vida cotidiana. Um tecido curiosamente grosseiro, que ocupa um lugar especial de reverência como um dos únicos itens conhecidos da vestimenta de um Buda que sobrevive."
 ryukyu_crown_description:0 "Uma peça incrustada de coral, coroada com um dragão-marinho dourado segurando uma pérola da sabedoria. Seu brilho ecoa sobre as ondas, um farol de poder e prosperidade."
 ryukyu_crown_name:0 "Coroa do Dragão"
 ryukyu_shaku_description:0 "Um bastão cerimonial laqueado, esculpido em cedro sagrado da ilha, simbolizando a unificação dos clãs sob um único mandato divino."
 ryukyu_shaku_name:0 "Shaku das Três Montanhas"
 saint_margaret_fingernails_description:0 "Santa Margarida de Antioquia ficou famosa por matar um dragão usando apenas os saltos de seus sapatos. Supostamente, esses cortes nas velhas e nojentas unhas pertenciam a ela. Enviado para [Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstNameNoTooltip] [Select_CString( inspiration_owner.IsFemale, 'pela', 'pelo' )] [inspiration_owner.GetTitledFirstNameNoTooltip] durante as aventuras [inspiration_owner.GetHerHim]."
 saint_margaret_fingernails_name:0 "Unhas de Santa Margarida"
 sassanian_sword_description_base:0 "é adornada com várias gemas e apresenta padrões intricados"
 scarab_brooch.desc:0 "Um delicado broche em forma de escaravelho. Dizem que a incrustação de esmeralda tem efeitos benéficos para a saúde."
 scarab_brooch:0 "Broche Antigo de Escaravelho"
 seahorse_brooch_description:0 "Um broche com delicados tassels encadeados sob o cavalo, que tem tanto asas como uma cauda de nadadeira. Enviado para [Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstNameNoTooltip] [Select_CString( inspiration_owner.IsFemale, 'pela', 'pelo' )] [inspiration_owner.GetTitledFirstNameNoTooltip] durante as aventuras [inspiration_owner.GetHerHim]."
 seahorse_brooch_name:0 "Broche de Cavalo-Marinho Dourado"
 seal_of_investiture.desc:0 "[SCOPE.Custom('ArtifactArticleWealth')] [seal_of_investiture|E] de artesanato [SCOPE.Custom('ArtifactQuality')]. É um [newly_created_artifact.GetFeatureText( 'decoration_material_slate' )] com [newly_created_artifact.GetFeatureText( 'decoration_material_ink' )].\n\nFoi confeccionado por ordem de [tributary_scope.GetSuzerain.GetFullName] para documentar a lealdade de [tributary_scope.GetFullName], apresentado a [tributary_scope.GetHerHim] nas cerimônias de encerramento da missão de tributo [tributary_scope.GetHerHim] a [tributary_scope.GetSuzerain.GetCapitalLocation.GetName]."
 seal_of_investiture:0 "Selo de Investidura"
 sekhmet_ring.desc:0 "O anel de ouro é gravado com a imagem de um ser humano posando com algum tipo de capacete peculiar."
