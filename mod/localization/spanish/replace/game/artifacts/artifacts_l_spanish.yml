 translated_arabic_book_elements_desc:0 "Uma cópia do tratado matemático em treze volumes de Euclides sobre geometria, lógica e suas demonstrações, escrito na antiga Alexandria e $translated_arabic_book_shared_desc$"
 translated_arabic_book_elements_name:0 "#italic Elementos#!"
 translated_arabic_book_on_ascensions_desc:0 "Uma cópia do tratado celeste de Hipsiclo sobre os movimentos dos signos do zodíaco pelo céu, escrito na antiga Alexandria e $translated_arabic_book_shared_desc$"
 translated_arabic_book_on_ascensions_name:0 "#italic Sobre Ascensões#!"
 translated_arabic_book_on_the_soul_desc:0 "Uma cópia do tratado psicológico de três livros de Aristóteles sobre a natureza da alma e suas inclinações, $translated_arabic_book_shared_desc$"
 translated_arabic_book_on_the_soul_name:0 "#italic Sobre a Alma#!"
 translated_arabic_book_plutarch_desc:0 "Uma cópia das biografias comparativas de líderes antigos proeminentes e seu caráter moral, $translated_arabic_book_shared_desc$"
 translated_arabic_book_plutarch_name:0 "#italic Vidas Paralelas de Plutarco#!"
 translated_arabic_book_shared_desc:0 "traduzido para o árabe do grego original para [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitledFirstNameNoTooltipRegnal]."
