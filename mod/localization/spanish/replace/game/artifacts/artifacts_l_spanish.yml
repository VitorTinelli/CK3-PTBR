 translated_arabic_book_thucydides_name:0 "#italic História da Guerra do Peloponeso de Tucídides#!"
 turquoise_throne_description:0 "Este trono real cravejado de joias foi feito à imagem do lendário trono dos reis persas do Shahnama. Sua estrutura de ébano é adornada com uma quantidade incalculável de turquesas, bem como placas de ouro puro esmaltadas em um tom de turquesa. Sua beleza de tirar o fôlego só poderia ser obtida pelos maiores artesãos em seus campos."
 turquoise_throne_name:0 "Trono de Turquesa"
 vinaya_pitaka_description:0 "Um texto budista dos três trabalhos do Cânone Pali. Este texto é instrucional nas convenções de conduta monástica para monges e monjas."
 vinaya_pitaka_name:0 "Vinaya Pitaka"
 warenne_coin:0 "Moeda Warenne"
 warenne_coin_description:0 "Esta moeda possui o emblema quadriculado azul e amarelo da dinastia Warenne no anverso. Uma mancha escura de sangue marca sua borda."
 water_filter_konagamana:0 "Filtro de água de Koṇāgamana"
 water_filter_konagamana_desc:0 "Koṇāgamana, o segundo Buda do atual Kalpa, carregava este filtro de água em suas jornadas. Esta simples peça de pano servia a um duplo propósito, como meio de fornecer água potável e também para garantir que quaisquer insetos fossem filtrados com segurança e compaixão."
