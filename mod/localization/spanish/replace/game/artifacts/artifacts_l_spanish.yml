 stewardship_old_ledger_description:0 "Um velho livro caixa empoeirado, cheio de rabiscos e anotações contábeis. Ele não é realmente útil para nada além de aprender como um livro caixa pode parecer."
 stewardship_old_ledger_name:0 "Livro Caixa Antigo"
 sullied_blooded_blade:0 "Espada Contaminada"
 sullied_blooded_blade_description:0 "Os padrões turbilhonantes e serrilhados desta arma são indicadores sutis de sua qualidade geralmente baixa, mas também de sua herança: uma arma temperada no sangue [Select_CString( ROOT.Char.IsFemale, 'da', 'do' )] [ROOT.Char.GetTitledFirstName]."
 sutta_pitaka_description:0 "Um texto budista Theravada baseado no primeiro conselho budista realizado após a morte de Buda. Inclui muitos poemas e sermões atribuídos a Buda e seus discípulos. Parte do Cânone Pali."
 sutta_pitaka_name:0 "Sutta Pitaka"
 sword_decoration_blade:0 "[ROOT.Artifact.GetFeatureText( 'blade_decoration' )|U]."
