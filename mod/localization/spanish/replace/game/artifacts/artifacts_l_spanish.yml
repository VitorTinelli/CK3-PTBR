 artifact_siddhachakra_description:0 "Este é um diagrama místico usado para adoração pelos jainistas. Em seu centro, um lótus florescido é cercado por deidades em pétalas, simbolizando a lenda do rei Shripala e sua esposa Mayanasundari."
 artifact_sledovik_description:0 "Esta grande pedra está coberta de pegadas que penetraram na própria rocha. Por muitos anos tem servido como um altar, e as pegadas são acreditadas terem sido deixadas por homens santos locais."
