l_spanish:
 anti_innovation_muslim_modifier:0 "Nizamiyyah"
 anti_innovation_muslim_modifier_desc:0 "Este personagem mostrou interesse em um novo movimento religioso que abomina o racionalismo e a ciência."
 aversion_to_joy_modifier:0 "Aversão à Alegria"
 aversion_to_joy_modifier_desc:0 "Este personagem diz a si mesmo que a alegria e a beleza são distrações vãs, tornando você fraco."
 cannot_read_greek_modifier:0 "Alega Saber Ler Grego"
 cannot_read_greek_modifier_desc:0 "Este personagem afirma estar versado na linguagem dos estudiosos do mundo antigo, mas evidências apontam o contrário."
 compelling_apology_modifier:0 "Desculpas Persuasivas"
 compelling_apology_modifier_desc:0 "Qualquer que tenha sido seu erro, este personagem fez um pedido de desculpas #italic muito #!sincero."
 cortes_modifier:0 "Cortes"
 cortes_modifier_desc:0 "Este personagem permite que representantes eleitos das municipalidades livres participem das reuniões do conselho."
 crusading_against_iberian_wine_modifier:0 "Campanha Anti-Vinho Ibérico"
 crusading_against_iberian_wine_modifier_desc:0 "Este personagem está determinado a acabar com os hábitos blasfemos de beber de seus súditos ibéricos."
 destitute_single_mothers_modifier:0 "Menagerie Lamentável"
 destitute_single_mothers_modifier_desc:0 "A corte deste personagem está cheia de mães solteiras e seus filhos, em vários estados de miséria."
 dusty_libraries_modifier:0 "Bibliotecas Empoeiradas"
 dusty_libraries_modifier_desc:0 "As antigas e magníficas bibliotecas no reino deste personagem tornaram-se empoeiradas e desorganizadas. No entanto, é possível encontrar uma estranha tranquilidade dentro delas."
 extra_large_cortes_modifier:0 "Parlamento Popular"
 extra_large_cortes_modifier_desc:0 "Este personagem permite que #italic qualquer um#! participe das reuniões do conselho."
 fanatical_recruits_modifier:0 "Recrutas Fanáticos"
 fanatical_recruits_modifier_desc:0 "Este personagem tem um fluxo constante de recrutas zelosos."
 felt_something_modifier:0 "Maravilhado com a Beleza"
 felt_something_modifier_desc:0 "Este personagem ouviu uma música de beleza sobrenatural."
 foreboding_visions_modifier:0 "Visões Ameaçadoras do Futuro"
 foreboding_visions_modifier_desc:0 "Em sonhos febris e acessos do que pode ser possessão, este personagem experimenta visões sombrias de eventos futuros."
 former_slave_npc_modifier:0 "Ex-Escravo"
 former_slave_npc_modifier_desc:0 "Este personagem foi uma vez escravo e é muito comprometido em defender sua liberdade."
 fp2_advanced_maritime_technology_modifier:0 "Tecnologia Marítima Avançada"
 fp2_advanced_maritime_technology_modifier_desc:0 "Este personagem possui tecnologia naval que está muito à frente do resto do mundo."
 fp2_successful_shipyards_modifier:0 "Mestres Construtores de Navios"
 fp2_successful_shipyards_modifier_desc:0 "Este local é lar de artesãos navais experientes, capazes de construir até mesmo os navios mais complexos."
 frightened_by_portent_modifier:0 "Assustado por Presságios"
 frightened_by_portent_modifier_desc:0 "Este personagem recebeu um presságio de eventos terríveis que virão."
 great_pine_chopped_down_county_modifier:0 "Grande Pinheiro Derrubado"
 great_pine_chopped_down_county_modifier_desc:0 "Neste condado, havia um grande e antigo pinheiro de pedra, que lançava uma sombra agradável. Ele não está mais de pé."
 great_translation_school_modifier:0 "Grande Escola de Tradução"
 great_translation_school_modifier_desc:0 "Este personagem fundou uma escola de tradução onde grandes obras estrangeiras são disponibilizadas para beneficiar toda a civilização."
 guild_rights_protected_modifier:0 "Direitos da Guilda Protegidos"
 guild_rights_protected_modifier_desc:0 "A guilda de ferreiros deste condado foi protegida contra interferências externas."
 hate_monger_modifier:0 "Divisor de Ódio"
 hate_monger_modifier_desc:0 "Este personagem é conhecido por semear discórdia e ódio."
 inspired_medicine_modifier:0 "Inspirado pelas Inovações Médicas"
 inspired_medicine_modifier_desc:0 "Este personagem demonstrou interesse nas recentes inovações no campo médico por estudiosos persas e andaluzes."
 investing_in_music_modifier:0 "Investindo em Música"
 investing_in_music_modifier_desc:0 "Este personagem está fazendo um esforço para ter músicos talentosos, mesmo plebeus, se apresentando em sua corte."
 lay_ruler_issued_fatwa_modifier:0 "Decisão Religiosa"
 lay_ruler_issued_fatwa_modifier_desc:0 "Este governante emitiu uma opinião legal em um assunto religioso - embora alguns possam afirmar que ele não tem autoridade para fazê-lo."
 master_smith_npc_modifier:0 "Mestre Ferreiro"
 master_smith_npc_modifier_desc:0 "As habilidades de ferraria deste personagem são quase incomparáveis."
 medical_insights_modifier:0 "Visão Médica"
 medical_insights_modifier_desc:0 "Este personagem leu Hipócrates e Galeno, e agora insiste que as pessoas lavem as mãos na corte."
 mediocre_translation_school_modifier:0 "Escola de Tradução Medíocre"
 mediocre_translation_school_modifier_desc:0 "Este personagem financiou uma escola de tradução, mas as pessoas envolvidas possuem talento questionável."
 memorable_public_execution_modifier:0 "Execução Pública Memorável"
 memorable_public_execution_modifier_desc:0 "Este personagem executou alguém de maneira #italic muito #!horrível."
 misread_medicine_incompetence_modifier:0 "Interpretação Errada do Cânone da Medicina"
 misread_medicine_incompetence_modifier_desc:0 "Este personagem leu o Cânone da Medicina e outras grandes obras sobre saúde e higiene, mas as interpretou completamente erroneamente."
 mysterious_prophetess_illness_modifier:0 "Doença das Sibilas"
 mysterious_prophetess_illness_modifier_desc:0 "Este personagem sofre de uma doença debilitante aparentemente relacionada a sonhos proféticos."
 mystery_meat_health_benefits_modifier:0 "Grande Nutrição"
 mystery_meat_health_benefits_modifier_desc:0 "Este personagem comeu uma grande quantidade de carne de uma carcaça gigante que havia encalhado em uma praia. Era muito saborosa."
 mystery_meat_unhealth_benefits_modifier:0 "Sensação Estranha"
 mystery_meat_unhealth_benefits_modifier_desc:0 "Este personagem comeu uma grande quantidade de carne de uma carcaça gigante misteriosa que havia encalhado em uma praia. Provavelmente não deveria ter comido..."
 nursing_salaries_for_single_mothers_modifier:0 "Salários de Enfermagem"
 nursing_salaries_for_single_mothers_modifier_desc:0 "Este personagem instituiu um sistema em que mães solteiras são pagas para amamentar seus filhos por um tempo."
 obligations_fulfilled_modifier:0 "Obrigações Questionáveis"
 obligations_fulfilled_modifier_desc:0 "Este personagem cumpriu suas obrigações para com outro governante - entregando escravos fugitivos..."
 restitution_to_minorities_modifier:0 "Restituição às Minorias Locais"
 restitution_to_minorities_modifier_desc:0 "Este personagem reparou algumas das queixas das minorias locais."
 riots_and_murders_province_modifier:0 "Tumultos e Assassinatos"
 riots_and_murders_province_modifier_desc:0 "Este condado foi abalado por massacres e expulsões de chamados indesejáveis."
 rolling_in_filth_modifier:0 "Enrolando na Sujeira"
 rolling_in_filth_modifier_desc:0 "Este personagem não se preocupa com a limpeza e a chamada higiene."
 saqaliba_settlers_county_modifier:0 "Colonos Saqaliba"
 saqaliba_settlers_county_modifier_desc:0 "Ex-escravos de origem europeia oriental se estabeleceram nesta província."
 saw_the_world_from_above_modifier:0 "Viagem Aérea"
 saw_the_world_from_above_modifier_desc:0 "Este personagem teve uma experiência profunda de voar pelos céus."
 starving_single_mothers_and_children_modifier:0 "Mães Famintas"
 starving_single_mothers_and_children_modifier_desc:0 "Viúvas, pais solteiros e seus filhos são deixados para morrer de fome nas terras deste personagem."
 tensions_eased_province_modifier:0 "Tensões Aliviadas"
 tensions_eased_province_modifier_desc:0 "A tensão religiosa nesta província está diminuindo."
 toledo_steel_armaments_modifier:0 "Armado como os Romanos"
 toledo_steel_armaments_modifier_desc:0 "Os soldados deste personagem carregam lâminas feitas de um requintado aço ibérico, assim como as legiões romanas do passado."
 toledo_steel_county_modifier:0 "Aço de Toledo"
 toledo_steel_county_modifier_desc:0 "Este condado produz um tipo forte de aço que é renomado desde a antiguidade."
 tolerance_gospel_modifier:0 "Tolerância Gospel"
 tolerance_gospel_modifier_desc:0 "Este personagem instou seu povo a abraçar a paciência e a unidade."
 tortured_smith_spilling_secrets_modifier:0 "Segredos da Fabricação de Espadas"
 tortured_smith_spilling_secrets_modifier_desc:0 "Este personagem aprendeu segredos da fabricação de espadas de um mestre ferreiro torturado."
 translation_effort_modifier:0 "Esforço de Tradução"
 translation_effort_modifier_desc:0 "Este personagem contratou um estudioso capaz para traduzir obras importantes."
 vineyards_burnt_county_modifier:0 "Vinhas Queimadas"
 vineyards_burnt_county_modifier_desc:0 "Este condado já abrigou vinhas magníficas, mas todas foram destruídas."
 vineyards_protected_county_modifier:0 "Vinhas Protegidas"
 vineyards_protected_county_modifier_desc:0 "As vinhas deste condado são guardadas contra fanáticos religiosos que desejam queimá-las."
 widows_and_widowers_amazing_funds_modifier:0 "Fundos para Viúvas"
 widows_and_widowers_amazing_funds_modifier_desc:0 "Este personagem criou um fundo para aqueles que ficaram viúvos por causa da guerra ou da desgraça - mas pessoas com filhos fora do casamento não recebem nada."
 wine_supply_secure_modifier:0 "Suprimento de Vinho Seguro"
 wine_supply_secure_modifier_desc:0 "Este personagem garantiu que nada possa ameaçar o suprimento de vinho fino local de sua corte."
