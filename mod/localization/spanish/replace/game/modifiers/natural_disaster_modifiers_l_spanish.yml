l_spanish:
 tgp_natural_disaster_aid_control_recovery:0 "Recuperação do Controle de Ajuda a Desastres"
 tgp_natural_disaster_aid_control_recovery_desc:0 "Os esforços de ajuda humanitária ajudaram a restaurar a ordem e a estabilidade nas áreas afetadas pelo desastre, acelerando a recuperação do controle administrativo local."
 tgp_natural_disaster_aid_monthly_expense:0 "Despesa Mensal de Ajuda Humanitária"
 tgp_natural_disaster_aid_monthly_expense_desc:0 "Custos mensais contínuos para fornecer ajuda humanitária às vítimas de desastres, incluindo alimentos, abrigo e suprimentos médicos."
 tgp_natural_disaster_built_memorial_fortifications:0 "Construtor de Memorial"
 tgp_natural_disaster_built_memorial_fortifications_desc:0 "Este personagem financiou generosamente a construção de fortificações aprimoradas no local de um desastre, criando um registro permanente do compromisso de sua dinastia com o bem-estar da região."
 tgp_natural_disaster_cleanup_material_recovery:0 "Recuperação de Materiais do Desastre"
 tgp_natural_disaster_cleanup_material_recovery_desc:0 "Materiais recuperados da organização da limpeza do desastre foram reaproveitados, reduzindo significativamente os custos de construção."
 tgp_natural_disaster_drainage_reduce_levies:0 "Esforços de Drenagem: Levas Reduzidas"
 tgp_natural_disaster_drainage_reduce_levies_desc:0 "As levas locais são redirecionadas para auxiliar nas obras de drenagem, reduzindo significativamente as forças militares disponíveis por um tempo."
 tgp_natural_disaster_drainage_work_levy_shortage:0 "Escassez de Levas para Obras de Drenagem"
 tgp_natural_disaster_drainage_work_levy_shortage_desc:0 "Muitas de nossas levas estão ocupadas com trabalhos de drenagem de enchentes, limitando severamente nossa capacidade de reabastecer as forças militares."
 tgp_natural_disaster_keeper_of_order:0 "Guardião da Ordem"
 tgp_natural_disaster_keeper_of_order_desc:0 "A supervisão decisiva deste personagem sobre os esforços de limpeza — removendo rapidamente destroços e restaurando a ordem — lhe rendeu respeito entre seus vassalos."
 tgp_natural_disaster_memorial_fortifications:0 "Fortificações Memorial"
 tgp_natural_disaster_memorial_fortifications_desc:0 "As fortificações nesta região não apenas foram reconstruídas, mas também aprimoradas, servindo como memorial aos mortos e celebração do triunfo sobre o desastre."
 tgp_natural_disaster_memorial_fortifications_wierdijks:0 "$tgp_natural_disaster_memorial_fortifications$"
 tgp_natural_disaster_memorial_fortifications_wierdijks_desc:0 "$tgp_natural_disaster_memorial_fortifications_desc$"
 tgp_natural_disaster_reconstruction_development_growth:0 "Impulso de Desenvolvimento da Reconstrução"
 tgp_natural_disaster_reconstruction_development_growth_desc:0 "Os extensos esforços de reconstrução trouxeram novas técnicas, materiais e infraestrutura que aceleram o crescimento do desenvolvimento neste condado."
 tgp_natural_disaster_reconstruction_economic_activity:0 "Boom Econômico da Reconstrução"
 tgp_natural_disaster_reconstruction_economic_activity_desc:0 "Os esforços de reconstrução estimularam atividade econômica significativa neste condado, com aumento de negócios decorrente das operações de reconstrução."
 tgp_natural_disaster_recovery_minister_chancellor:0 "Grande Chanceler Auxilia Recuperação de Desastres"
 tgp_natural_disaster_recovery_minister_chancellor_desc:0 "Os esforços deste personagem para se recuperar de um desastre natural são apoiados pelo Grande Chanceler."
 tgp_natural_disaster_recovery_minister_of_personnel:0 "Ministro de Pessoal Auxilia Recuperação de Desastres"
 tgp_natural_disaster_recovery_minister_of_personnel_desc:0 "Os esforços deste personagem para se recuperar de um desastre natural são apoiados pelo Ministro de Pessoal."
 tgp_natural_disaster_recovery_minister_of_rites:0 "Ministro dos Ritos Auxilia Recuperação de Desastres"
 tgp_natural_disaster_recovery_minister_of_rites_desc:0 "Os esforços deste personagem para se recuperar de um desastre natural são apoiados pelo Ministro dos Ritos."
 tgp_natural_disaster_recovery_minister_of_war:0 "Ministro da Guerra Auxilia Recuperação de Desastres"
 tgp_natural_disaster_recovery_minister_of_war_desc:0 "Os esforços deste personagem para se recuperar de um desastre natural são apoiados pelo Ministro da Guerra."
 tgp_natural_disaster_recovery_popular_hero:0 "Herói do Socorro a Desastres"
 tgp_natural_disaster_recovery_popular_hero_desc:0 "Este personagem é amplamente elogiado por financiar esforços de recuperação de desastres, ganhando respeito em todo o reino."
 tgp_natural_disaster_recovery_tax_burden:0 "Encargo Fiscal de Recuperação dos Sobreviventes"
 tgp_natural_disaster_recovery_tax_burden_desc:0 "Os coletores de impostos deste personagem foram instruídos a redirecionar os impostos para os esforços de recuperação do desastre."
 tgp_natural_disaster_recovery_tax_burden_reduced:0 "$tgp_natural_disaster_recovery_tax_burden$"
 tgp_natural_disaster_recovery_tax_burden_reduced_desc:0 "$tgp_natural_disaster_recovery_tax_burden_desc$"
 tgp_natural_disaster_relief_savior:0 "Salvador da Ajuda a Desastres"
 tgp_natural_disaster_relief_savior_desc:0 "Este personagem é amplamente reverenciado por sua ajuda compassiva às vítimas de desastres, ganhando respeito espiritual e reconhecimento duradouros."
 tgp_natural_disaster_resettlement_domain_burden:0 "Encargo de Reassentamento de Desastres"
 tgp_natural_disaster_resettlement_domain_burden_desc:0 "Gerenciar populações deslocadas de áreas de desastre sobrecarregou a capacidade administrativa, reduzindo a gestão eficaz do domínio."
 tgp_natural_disaster_resettlement_levy_growth:0 "Levas de Refugiados"
 tgp_natural_disaster_resettlement_levy_growth_desc:0 "Muitos sobreviventes deslocados do recente desastre voluntariamente se oferecem para o serviço militar."
 tgp_natural_disaster_resettlement_taxation_loss:0 "Perda de Tributação pelo Reassentamento"
 tgp_natural_disaster_resettlement_taxation_loss_desc:0 "O deslocamento caótico da população levou a uma diminuição na arrecadação de impostos."
