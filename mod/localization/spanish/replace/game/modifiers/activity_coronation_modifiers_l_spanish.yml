l_spanish:
 ach_arrested_rumormongers_character_modifier:0 "$ach_arrested_rumormongers_modifier$"
 ach_arrested_rumormongers_character_modifier_desc:0 "Este personagem ganhou reputação por sua disposição em prender camponeses fofoqueiros, um sinal de medo e certo nível de insegurança."
 ach_arrested_rumormongers_modifier:0 "Fofoqueiros Recentemente Presos"
 ach_arrested_rumormongers_modifier_desc:0 "Os fofoqueiros locais recentemente ficaram em silêncio devido ao medo de opressão por parte de seu senhor."
 ach_awed_peasantry_modifier:0 "Camponeses Emocionados"
 ach_awed_peasantry_modifier_desc:0 "Este personagem fez um discurso para acalmar uma multidão tumultuada, trazendo centenas às lágrimas com sua eloquência."
 ach_beat_peasants_modifier:0 "Castigo aos Camponeses"
 ach_beat_peasants_modifier_desc:0 "Este personagem ganhou reputação por reprimir pessoalmente seus inferiores quando saem da linha."
 ach_coronation_blissful_ignorance_modifier:0 "Ignorância Abençoada"
 ach_coronation_blissful_ignorance_modifier_desc:0 "Este personagem sabe que alguns problemas potenciais são melhor ignorados felizmente."
 ach_coronation_crackdown_character_modifier:0 "$ach_coronation_crackdown_modifier$"
 ach_coronation_crackdown_character_modifier_desc:0 "Este personagem mostrou disposição em liberar seus próprios soldados sobre sua população para restaurar a ordem, inspirando respeito em muitos, mas desgosto em alguns."
 ach_coronation_crackdown_modifier:0 "Repressão da Coroação"
 ach_coronation_crackdown_modifier_desc:0 "Multidões de guardas desceram sobre a população desta região para restaurar a ordem. Muito foi destruído, mas a ordem foi restabelecida."
 ach_coronation_expended_resources_intrigue_modifier:0 "$ach_coronation_expended_resources_modifier$"
 ach_coronation_expended_resources_intrigue_modifier_desc:0 "$ach_coronation_expended_resources_modifier_desc$ Sua própria rede de espiões, como resultado, está bastante sobrecarregada."
 ach_coronation_expended_resources_martial_modifier:0 "$ach_coronation_expended_resources_modifier$"
 ach_coronation_expended_resources_martial_modifier_desc:0 "$ach_coronation_expended_resources_modifier_desc$ Até seus próprios exércitos foram exauridos."
 ach_coronation_expended_resources_martial_nomad_modifier:0 "$ach_coronation_expended_resources_modifier$"
 ach_coronation_expended_resources_martial_nomad_modifier_desc:0 "$ach_coronation_expended_resources_modifier_desc$ Até seus próprios exércitos foram exauridos."
 ach_coronation_expended_resources_modifier:0 "Recursos Gastos"
 ach_coronation_expended_resources_modifier_desc:0 "Este personagem gastou muitos recursos recentemente apoiando outro governante."
 ach_coronation_good_listener_modifier:0 "Bom Ouvinte"
 ach_coronation_good_listener_modifier_desc:0 "Este personagem começou a observar as pessoas e está aprendendo muito com isso..."
 ach_coronation_gossips_with_servants_modifier:0 "Fofocas com Servos"
 ach_coronation_gossips_with_servants_modifier_desc:0 "Este personagem passou a trocar fofocas com a ajuda dos servos."
 ach_coronation_little_birds_modifier:0 "Pequenos Pássaros"
 ach_coronation_little_birds_modifier_desc:0 "Este personagem é apoiado pela rede de espiões de um de seus vassalos — um grande alívio!"
 ach_coronation_stampede_modifier:0 "Pânico na Coroação"
 ach_coronation_stampede_modifier_desc:0 "Uma série infeliz de eventos levou dezenas — principalmente plebeus — a serem pisoteados até a morte."
 ach_coronation_studying_ceremony_modifier:0 "Estudando a Cerimônia de Coroação"
 ach_coronation_studying_ceremony_modifier_desc:0 "Este personagem está aprendendo bastante ao testemunhar as dificuldades de organizar uma cerimônia de coroação."
 ach_coronation_theocratic_allies_modifier:0 "Aliados Teocráticos"
 ach_coronation_theocratic_allies_modifier_desc:0 "Este personagem se beneficiou muito dos apelos de um vassalo junto ao clero."
 ach_coronation_treated_wound_modifier:0 "Feridas Tratadas"
 ach_coronation_treated_wound_modifier_desc:0 "As feridas deste personagem foram habilmente tratadas."
 ach_coronation_trusts_nobody_modifier:0 "Não Confia em Ninguém"
 ach_coronation_trusts_nobody_modifier_desc:0 "Este personagem se assusta com cada sombra e está cada vez mais convencido de que seus vassalos tramam sua queda."
 ach_declarations_of_loyalty_modifier:0 "Declarações de Lealdade"
 ach_declarations_of_loyalty_modifier_desc:0 "Este personagem aparentemente não tem sobre o que conversar com seus vassalos além da justiça de seu senhor."
 ach_drunk_province_1_modifier:0 "População Bêbada"
 ach_drunk_province_1_modifier_desc:0 "Os locais desfrutaram bastante de bebidas durante a recente coroação."
 ach_drunk_province_2_modifier:0 "População Embriagada"
 ach_drunk_province_2_modifier_desc:0 "A disponibilidade excessiva de álcool durante a recente coroação levou a níveis de embriaguez até então desconhecidos nesta província."
 ach_familial_support_modifier:0 "Apoio Familiar"
 ach_familial_support_modifier_desc:0 "Esta Dinastia é conhecida por trabalhar como um todo maior."
 ach_favored_minority_modifier:0 "Minoria Favorecida"
 ach_favored_minority_modifier_desc:0 "O governante desta província optou por favorecer seu povo, apesar de ser de uma cultura diferente."
 ach_focusing_on_prayer_modifier:0 "Focando na Oração"
 ach_focusing_on_prayer_modifier_desc:0 "Este personagem está contendo bastante frustração concentrando-se em assuntos de fé."
 ach_generous_coronation_drinks_modifier:0 "Bebidas Generosas na Coroação"
 ach_generous_coronation_drinks_modifier_desc:0 "Este personagem garantiu que os plebeus desfrutassem de bastante bebida durante sua coroação, e eles ainda brindam seu nome até hoje."
 ach_hof_visit_modifier:0 "Visita do Líder Religioso"
 ach_hof_visit_modifier_desc:0 "Estas terras estão em alvoroço devido à visita de seu chefe religioso e da grande delegação que o acompanha. Os fiéis se dirigem à província e os locais recebem bênçãos e esmolas."
 ach_how_to_lose_a_war_listener_modifier:0 "Contos de Guerras Perdidas: Ouvinte"
 ach_how_to_lose_a_war_listener_modifier_desc:0 "Este personagem ouviu um conto de desgraças sobre uma guerra perdida e aprendeu o que não fazer na vida e na guerra."
 ach_how_to_lose_a_war_talker_modifier:0 "Contos de Guerras Perdidas: Narrador"
 ach_how_to_lose_a_war_talker_modifier_desc:0 "Este personagem falou sem parar sobre seu conto de desgraças. Compartilhar demais e repetir-se trouxe algum conforto mental, no entanto."
 ach_imperious_modifier:0 "Imperioso"
 ach_imperious_modifier_desc:0 "Este personagem ganhou reputação por estar acima de preocupações mais mesquinhas."
 ach_liege_subsidies_modifier:0 "Subsídios Reais"
 ach_liege_subsidies_modifier_desc:0 "O governante local é favorecido por seu senhor, assim como seu domínio."
 ach_negative_rumors_modifier:0 "Boatos Negativos"
 ach_negative_rumors_modifier_desc:0 "O moinho de rumores não tem feito nenhum favor a este personagem ultimamente."
 ach_neutered_revanchist_modifier:0 "Revanchista Vingativo Contido"
 ach_neutered_revanchist_modifier_desc:0 "Este personagem teve uma conversa que mudou sua vida durante uma cerimônia de coroação, fazendo-o repensar sua abordagem em relação à vida e ao passado."
 ach_partners_in_revanchism_active_modifier:0 "Parceiros no Revanchismo: Guerra"
 ach_partners_in_revanchism_active_modifier_desc:0 "Este personagem está cooperando de perto com outro governante em uma guerra de vingança."
 ach_partners_in_revanchism_passive_modifier:0 "Parceiros no Revanchismo: Preparação"
 ach_partners_in_revanchism_passive_modifier_desc:0 "Este personagem está se preparando para cooperar de perto com outro governante para travar uma guerra de vingança.\n\n#weak Este modificador ganhará efeitos adicionais quando a guerra for declarada contra o alvo pretendido. O governante que compartilha este modificador será chamado para a guerra e se juntará, se possível. Seu novo modificador de guerra estará ativo por um ano#!"
 ach_peace_broker_modifier:0 "Pacificador de Língua Prata"
 ach_peace_broker_modifier_desc:0 "Na véspera de sua coroação, este personagem preveniu a repetição de uma guerra revanchista, evitando um segundo erro sangrento."
 ach_positive_rumors_modifier:0 "Boatos Positivos"
 ach_positive_rumors_modifier_desc:0 "Os plebeus do reino parecem agitados com contos infundados sobre a glória deste personagem."
 ach_reign_of_terror_character_modifier:0 "Reinado de Terror"
 ach_reign_of_terror_character_modifier_desc:0 "Este personagem respondeu aos rumores da plebe com uma cruel série de represálias brutais."
 ach_reign_of_terror_modifier:0 "Reinado de Terror"
 ach_reign_of_terror_modifier_desc:0 "Esta província sofre com as cruéis represálias de um mestre desprezado."
 ach_secret_stash_modifier:0 "Esconderijo Secreto"
 ach_secret_stash_modifier_desc:0 "Este personagem adquiriu um suprimento de haxixe exótico.\n\nConcede um uso do [GetDecisionWithKey('stress_loss_hashishiyah_decision').GetName] [decision|E]"
 ach_social_distancing_modifier:0 "Mantendo Distância"
 ach_social_distancing_modifier_desc:0 "Este personagem mantém uma grande distância de todos os outros. Surpreendentemente eficaz para permanecer saudável, embora ter que gritar através de salas para ser ouvido não seja o ideal."
 ach_useful_crowds_modifier:0 "Multidões Úteis"
 ach_useful_crowds_modifier_desc:0 "Os agentes deste personagem movem-se despercebidos pelas multidões locais."
