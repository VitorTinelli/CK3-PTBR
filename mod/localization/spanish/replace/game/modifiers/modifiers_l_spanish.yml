 piety_level_0:0 "Pecador"
 piety_level_0_desc:0 "$piety_level_0$ é o único nível negativo de [piety_level|E]. O próximo nível é [GetModifier('piety_level_1').GetNameWithTooltip|L].\nEfeitos:\n[GetPietyLevelDesc( '(int32)0' )]"
 piety_level_1:0 "Dedicado"
 piety_level_1_desc:0 "$piety_level_1$ é o primeiro nível de [piety_level|E]. O próximo nível é [GetModifier('piety_level_2').GetNameWithTooltip|L].\nEfeitos:\n[GetPietyLevelDesc( '(int32)1' )]"
 piety_level_2:0 "Fiel"
 piety_level_2_desc:0 "$piety_level_2$ é o segundo nível de [piety_level|E]. O próximo nível é [GetModifier('piety_level_3').GetNameWithTooltip|L].\nEfeitos:\n[GetPietyLevelDesc( '(int32)2' )]"
 piety_level_3:0 "Servo Devoto"
 piety_level_3_desc:0 "$piety_level_3$ é o terceiro nível de [piety_level|E]. O próximo nível é [GetModifier('piety_level_4').GetNameWithTooltip|L].\nEfeitos:\n[GetPietyLevelDesc( '(int32)3' )]"
 piety_level_4:0 "Modelo de Virtude"
 piety_level_4_desc:0 "$piety_level_4$ é o quarto nível de [piety_level|E]. O próximo nível é [GetModifier('piety_level_5').GetNameWithTooltip|L].\nEfeitos:\n[GetPietyLevelDesc( '(int32)4' )]"
 piety_level_5:0 "Ícone Religioso"
 piety_level_5_desc:0 "$piety_level_5$ é o quinto e mais alto possível nível de [piety_level|E] para [governments|E] que não são [mandala|E]. O próximo nível é [GetModifier( 'piety_level_6' ).GetNameWithTooltip|L].\nEfeitos:\n[GetPietyLevelDesc('(int32)5')|=+]"
 piety_level_6:0 "Divino"
 piety_level_6_desc:0 "$piety_level_6$ é o sexto nível de [piety_level|E]. O próximo nível é [GetModifier( 'piety_level_7' ).GetNameWithTooltip|L].\n\nQuando um [ruler|E] [mandala|E] morre de uma forma aceitável para seu [aspect|E], após alcançar [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L], o [heir|E] desse Governante desenvolve a habilidade de progredir para este Nível de Devoção.\n\nEfeitos:\n[GetPietyLevelDesc('(int32)6')|=+]"
 piety_level_7:0 "Semideus"
 piety_level_7_desc:0 "$piety_level_7$ é o sétimo nível de [piety_level|E]. O próximo nível é [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L].\n\nQuando um [ruler|E] [mandala|E] morre de uma forma aceitável para seu [aspect|E], após alcançar [GetModifier( 'piety_level_6' ).GetNameWithTooltip|L], o [heir|E] desse Governante desenvolve a habilidade de progredir para este Nível de Devoção.\n\nEfeitos:\n[GetPietyLevelDesc('(int32)7')|=+]"
 piety_level_8:0 "Divino Supremo"
