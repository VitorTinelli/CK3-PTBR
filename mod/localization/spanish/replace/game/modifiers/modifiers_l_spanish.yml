 prestige_level_3_laamp_desc:0 "Desbloqueia o seguinte:\n\t#weak [casus_bellis|e] $EP3_LAAMP_INVASION_CB_DUCHY_NAME$ e menor\n\t[interaction|E] de $purchase_land_interaction$ para [counties|E] e [duchies|E]\n\t$hire_laamp_mercenaries_interaction$ [interaction|E] recompensas [county|E] e [duchy|E]\n\t[scheme|E] de $seize_realm$ para [duchies|E] e [counties|E]\n\t[interaction|E] de $request_laamp_invasion_sponsorship_interaction$#!"
