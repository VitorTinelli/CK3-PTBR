l_spanish:
 appealing_theology_modifier:0 "Teologia Atraente"
 appealing_theology_modifier_desc:0 "Este personagem descobriu um texto teológico estrangeiro que considera particularmente atraente."
 christian_fulfillment_level_0:0 "Perdido"
 christian_fulfillment_level_1:0 "Abandonado"
 christian_fulfillment_level_2:0 "Perturbado"
 christian_fulfillment_level_3:0 "Penitente"
 christian_fulfillment_level_4:0 "Absolvido"
 christian_fulfillment_level_5:0 "Acomodado"
 christian_fulfillment_level_6:0 "Em Graça"
 default_fulfillment_level_0:0 "À deriva"
 default_fulfillment_level_1:0 "Buscando"
 default_fulfillment_level_2:0 "Observante"
 default_fulfillment_level_3:0 "Devoto"
 default_fulfillment_level_4:0 "Em Paz"
 followers_of_dead_faith_scheme_modifier:0 "Conhecimento perdido no tempo"
 followers_of_dead_faith_scheme_modifier_desc:0 "A [faith|E] não é mais praticada abertamente, tornando extremamente difícil encontrar adeptos."
 foolish_convert_modifier:0 "Converso Tolo"
 foolish_convert_modifier_desc:0 "Este tolo decidiu precipitadamente converter-se a uma [rite|E] com um sistema de crenças vastamente diferente, e está tendo muita dificuldade para se adaptar à sua nova vida espiritual."
 heathen_mandate_modifier:0 "Hereges Pregando Legitimidade"
 heathen_mandate_modifier_desc:0 "Os homens santos de um soberano pagão reivindicam as almas desta terra, alegações detestáveis apoiadas por sua falsa fé."
 industrious_junior_members_modifier:0 "Noviços Industriosos"
 informed_convert_modifier:0 "Converso Informado"
 informed_convert_modifier_desc:0 "Esta pessoa decidiu converter-se a uma [rite|E] com um sistema de crenças diferente, totalmente preparada para os novos desafios que esta decisão trará."
 modifier_definition_value_per_chaplain_learning:0 "\t#weak Aumento por ponto de [court_chaplain|E] de [learning|E] (máx. [EmptyScope.ScriptValue('pam_divine_liturgy_chaplain_learning_cap_value')])#!"
 modifier_definition_value_per_held_temple:0 "\t#weak Aumento por [temple_holding|E] possuído (máx. [EmptyScope.ScriptValue('pam_divine_liturgy_temple_cap_value')])#!"
 modifier_definition_value_per_theocratic_vassal:0 "\t#weak Aumento por [theocratic_vassal|E] (máx. [EmptyScope.ScriptValue('pam_apostolic_succession_bishop_cap_value')])#!"
 monastic_onslaught_modifier:0 "Fundações Monásticas"
 monastic_onslaught_modifier_desc:0 "Uma ordem monástica, amplamente apoiada por um patrono secular, impulsiona a atividade econômica local."
 pam_blessed_passing_modifier:0 "Passagem Abençoada"
 pam_blessed_passing_modifier_desc:0 "O predecessor deste personagem deu sua vida em uma morte santificada, e sua graça repousa sobre ele."
 pam_blissful_harmony_gospel_modifier:0 "Evangelho da Boa Vida"
 pam_blissful_harmony_gospel_modifier_desc:0 "A pregação do soberano celebra a paz, a piedade e a vida ordenada."
 pam_blissful_harmony_restless_ambition_modifier:0 "Ambição Inquieta"
 pam_blissful_harmony_restless_ambition_modifier_desc:0 "Um momento de felicidade deixa este personagem inquieto por mais."
 pam_building_new_shrines:0 "Construindo Novos Santuários"
 pam_building_new_shrines_desc:0 "Este condado tem pessoas de diferentes [faith|E] mudando-se para cá e construindo novos santuários.\n #weak Isso torna a #V [GetPlayer.GetPlayerInteractionName('feudalize_holding_interaction')]#! [interaction|E] mais barata.#!"
 pam_cardinal_order_accelerate_cultural_fascination_modifier:0 "Ordem de Aceleração de Fascinação Cultural"
 pam_cardinal_order_accelerate_cultural_fascination_modifier_desc:0 "Sob o comando de seu superior, um Cardeal trabalha para acelerar a pesquisa de novas tecnologias."
 pam_cardinal_order_convert_faith_modifier:0 "Ordem Cardinal de Conversão de Fé"
 pam_cardinal_order_convert_faith_modifier_desc:0 "Sob o comando de seu superior, um Cardeal trabalha para reforçar a conversão dentro da Arquidiocese local e terras fronteiriças.\n\n$EFFECT_LIST_BULLET$[convert_county|E] neste [county|E]: #P +25%#!"
 pam_cardinal_order_improve_development_modifier:0 "Ordem Cardinal de Melhoria de Desenvolvimento"
 pam_cardinal_order_improve_development_modifier_desc:0 "Sob o comando de seu superior, um Cardeal trabalha para fomentar o desenvolvimento dentro da Arquidiocese local."
 pam_cardinal_order_improve_epidemic_resistance_modifier:0 "Ordem Cardinal de Melhoria de Resistência a Pragas"
 pam_cardinal_order_improve_epidemic_resistance_modifier_desc:0 "Sob o comando de seu superior, um Cardeal mobiliza os recursos da Igreja para ajudar na mitigação de pragas."
 pam_cardinal_order_improve_legitimacy_modifier:0 "Ordem Cardinal de Melhoria de Legitimidade"
 pam_cardinal_order_improve_legitimacy_modifier_desc:0 "Sob o comando de seu superior, um Cardeal trabalha para reforçar a legitimidade dos soberanos na Arquidiocese local."
 pam_cardinal_order_increase_control_modifier:0 "Ordem Cardinal de Aumento de Controle de Condado"
 pam_cardinal_order_increase_control_modifier_desc:0 "Sob o comando de seu superior, um Cardeal trabalha para pacificar a população dentro da Arquidiocese local."
 pam_cardinal_order_undermine_legitimacy_modifier:0 "Ordem Cardinalícia para Minar a Legitimidade"
 pam_cardinal_order_undermine_legitimacy_modifier_desc:0 "Sob as ordens de seu superior, um cardeal trabalha para minar a legitimidade dos governantes na Arquidiocese local."
 pam_cathedral_bell_bronze_torture_implements_modifier:0 "Instrumentos de Tortura de Bronze"
 pam_cathedral_bell_bronze_torture_implements_modifier_desc:0 "Retalhos de bronze de um sino de catedral mal fundido foram refeitos em instrumentos de terror, e o fundidor de sinos foi sua primeira vítima."
 pam_cathedral_bell_cracked_lesson_modifier:0 "Lições do Sino Rachado"
 pam_cathedral_bell_cracked_lesson_modifier_desc:0 "Os pedreiros deste condado trabalham com mais cautela para compensar a vergonha de uma fundição de sino fracassada."
 pam_cathedral_cantoria_scam_modifier:0 "Artimanha Exposta"
 pam_cathedral_cantoria_scam_modifier_desc:0 "Tendo exposto uma artimanha fraudulenta, os construtores trabalham com nova parcimônia e pressa."
 pam_cathedral_famed_choir_boy_modifier:0 "Voz Angélica na Corte"
 pam_cathedral_famed_choir_boy_modifier_desc:0 "Um coroinha de voz sobrenatural empresta graça a esta corte."
 pam_cathedral_founder_crypt_modifier:0 "Patrono da Cripta da Catedral"
 pam_cathedral_founder_crypt_modifier_desc:0 "Este personagem financiou uma cripta para sua dinastia sob uma Grande Catedral."
 pam_cathedral_sermon_charity_county_modifier:0 "Sermão de Caridade"
 pam_cathedral_sermon_charity_county_modifier_desc:0 "A pregação de um governante no portal de uma nova catedral afrouxou os cordões dos bolsos e aqueceu corações neste condado."
 pam_cathedral_sermon_charity_ruler_modifier:0 "Guiado para a Caridade"
 pam_cathedral_sermon_charity_ruler_modifier_desc:0 "Este governante foi comovido por um sermão de catedral sobre a misericórdia generosa."
 pam_cathedral_sermon_diligence_county_modifier:0 "Sermão de Diligência"
 pam_cathedral_sermon_diligence_county_modifier_desc:0 "A pregação de um governante no portal de uma nova catedral estimulou construtores de igrejas e pedreiros a um trabalho industrioso."
 pam_cathedral_sermon_diligence_ruler_modifier:0 "Guiado para a Indústria"
 pam_cathedral_sermon_diligence_ruler_modifier_desc:0 "Este governante foi comovido por um sermão de catedral sobre o trabalho piedoso."
 pam_cathedral_sermon_peace_county_modifier:0 "Sermão de Paz"
 pam_cathedral_sermon_peace_county_modifier_desc:0 "A pregação de um governante no portal de uma nova catedral deixou este condado mais contente, e os peregrinos podem viajar por suas estradas com maior segurança."
 pam_cathedral_sermon_peace_ruler_modifier:0 "Guiado para a Paz"
 pam_cathedral_sermon_peace_ruler_modifier_desc:0 "Este governante foi comovido por um sermão de catedral sobre a paz de Cristo."
 pam_cathedral_sermon_perseverance_county_modifier:0 "Sermão de Perseverança"
 pam_cathedral_sermon_perseverance_county_modifier_desc:0 "A pregação de um governante no portal de uma nova catedral renovou o esforço piedoso e o crescimento ordenado neste condado."
 pam_cathedral_sermon_perseverance_ruler_modifier:0 "Guiado para o Zelo"
 pam_cathedral_sermon_perseverance_ruler_modifier_desc:0 "Este governante foi comovido por um sermão de catedral sobre correr a corrida da fé."
 pam_cathedral_sermon_rejoice_county_modifier:0 "Sermão de Regozijo"
 pam_cathedral_sermon_rejoice_county_modifier_desc:0 "A pregação de um governante no portal de uma nova catedral elevou os fiéis com esperança no amor infalível do Senhor."
 pam_cathedral_sermon_rejoice_ruler_modifier:0 "Guiado para a Alegria"
 pam_cathedral_sermon_rejoice_ruler_modifier_desc:0 "Este governante foi comovido por um sermão de catedral sobre regozijar-se no Senhor."
 pam_cathedral_sermon_unity_county_modifier:0 "Sermão de Unidade"
 pam_cathedral_sermon_unity_county_modifier_desc:0 "A pregação de um governante no portal de uma nova catedral estabilizou a obediência comunitária neste condado."
 pam_cathedral_sermon_unity_ruler_modifier:0 "Guiado para a Concórdia"
 pam_cathedral_sermon_unity_ruler_modifier_desc:0 "Este governante foi comovido por um sermão de catedral sobre a comunhão cristã."
 pam_cathedral_treadwheel_crane_modifier:0 "Guindaste de Roda de Passo"
 pam_cathedral_treadwheel_crane_modifier_desc:0 "Um enorme guindaste de roda de passo de um canteiro de obras de catedral foi erguido na capital."
 pam_ch_hof_penitent_road_modifier:0 "Voto de Penitência"
 pam_ch_hof_penitent_road_modifier_desc:0 "Este personagem jurou fazer penitência após ser julgado em uma guerra pelo [head_of_faith|E]."
 pam_ch_hof_sacred_bloodguilt_modifier:0 "Culpa de Sangue"
 pam_ch_hof_sacred_bloodguilt_modifier_desc:0 "Este personagem matou alguém em uma guerra pelo [head_of_faith|E]."
 pam_denied_new_pope_modifier:0 "Rejeitou o Novo Papa"
 pam_denied_new_pope_modifier_desc:0 "Este personagem recusou-se a reconhecer o recém-eleito Papa."
 pam_deposed_pontiff_modifier:0 "Chefe da Fé Deposto"
 pam_deposed_pontiff_modifier_desc:0 "Este personagem foi deposto como o [head_of_faith|E]."
 pam_dulia_new_saint_modifier:0 "Um Novo Intercessor"
 pam_dulia_new_saint_modifier_desc:0 "Este personagem é inspirado pela proclamação recente de um novo santo."
 pam_dulia_relic_learning_per_piety_modifier:0 "Devoção Iluminada"
 pam_dulia_relic_monthly_piety_modifier:0 "Manancial de Graça"
 pam_dulia_relic_piety_level_impact_modifier:0 "Posição Santificada"
 pam_dulia_relic_piety_per_dread_modifier:0 "Aura do Mártir"
 pam_dulia_relic_piety_per_knight_modifier:0 "Bênção do Hosspedeiro"
 pam_dulia_relic_piety_per_legitimacy_modifier:0 "Ungido pelos Santos"
 pam_dulia_relic_stress_loss_per_piety_modifier:0 "Graça Consolidadora"
 pam_ecumenical_council_creed_arbiter_modifier:0 "Árbitro do Credo"
 pam_ecumenical_council_creed_arbiter_modifier_desc:0 "Este personagem resolveu uma disputa sobre a redação do Credo antes mesmo de um Concílio Ecumênico abrir seus debates."
 pam_ecumenical_council_primacy_upheld_modifier:0 "Primazia Sustentada"
 pam_ecumenical_council_primacy_upheld_modifier_desc:0 "Foi perguntado a este personagem em conselho aberto a qual cargo as igrejas da fé respondem, e ele resolveu a questão a partir da cátedra."
 pam_grand_cathedral_02_completed_modifier:0 "Expansão da Grande Catedral Concluída"
 pam_grand_cathedral_02_completed_modifier_desc:0 "Este personagem supervisionou a expansão de uma Grande Catedral."
 pam_grand_cathedral_02_started_modifier:0 "Construção de Grande Catedral Expandida"
 pam_grand_cathedral_02_started_modifier_desc:0 "Este personagem mobilizou os recursos para elevar uma Grande Catedral existente a novos patamares. Este projeto que atravessa gerações é uma grande evidência de sua devoção a Deus."
 pam_grand_cathedral_completed_modifier:0 "Construção de Grande Catedral Concluída"
 pam_grand_cathedral_completed_modifier_desc:0 "Este personagem mobilizou os recursos necessários para concluir a construção de uma Grande Catedral. Este projeto que atravessa gerações é uma grande evidência de sua devoção a Deus."
 pam_grand_cathedral_family_contributed_north_modifier:0 "$pam_grand_cathedral_family_contributed_south_modifier$"
 pam_grand_cathedral_family_contributed_north_modifier_desc:0 "$pam_grand_cathedral_family_contributed_south_modifier_desc$"
 pam_grand_cathedral_family_contributed_south_modifier:0 "Financiou uma Capela de Grande Catedral"
 pam_grand_cathedral_family_contributed_south_modifier_desc:0 "Esta dinastia teve um membro que financiou a construção de uma capela para uma Grande Catedral. Este projeto que atravessa gerações é uma grande evidência de sua devoção a Deus."
 pam_grand_cathedral_started_modifier:0 "Construção de Grande Catedral Iniciada"
 pam_grand_cathedral_started_modifier_desc:0 "Este personagem mobilizou os recursos necessários para iniciar a construção de uma Grande Catedral. Este projeto que atravessa gerações já é uma grande evidência de sua devoção a Deus."
 pam_holy_weapon_1_artifact_modifier:0 "Batizada em Sangue"
 pam_holy_weapon_1_artifact_modifier_desc:0 "Este [holy_relic|E] foi levado à vitória contra os inimigos de sua [faith|E]. Os devotos começaram a prestar atenção nisso."
 pam_holy_weapon_2_artifact_modifier:0 "Provada na Guerra"
 pam_holy_weapon_2_artifact_modifier_desc:0 "Tantas batalhas vencidas contra outras [religions|E] que os fiéis já não chamam isso de sorte."
 pam_holy_weapon_3_artifact_modifier:0 "Relíquia Renomada"
 pam_holy_weapon_3_artifact_modifier_desc:0 "Seu nome a precede. Os zelosos se animam ao vê-la."
 pam_holy_weapon_4_artifact_modifier:0 "Instrumento da Providência"
 pam_holy_weapon_4_artifact_modifier_desc:0 "Acredita-se que seu portador cumpre a vontade de seu deus, e os cavaleiros ao seu redor golpeiam com mais força por causa disso."
 pam_house_martyred_pontiff_modifier:0 "Mártir da Casa"
 pam_house_martyred_pontiff_modifier_desc:0 "Um membro desta casa morreu após uma guerra pelo [head_of_faith|E]."
 pam_house_schismatic_sponsor_modifier:0 "Patrono Cismático"
 pam_house_schismatic_sponsor_modifier_desc:0 "Esta casa apoiou um [challenger_hof|E] fracassado."
 pam_khachkar_ancestral_county:0 "Khachkar Ancestral"
 pam_khachkar_ancestral_county_custom_desc:0 "Erguido para [SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.GetTitledFirstNameNicknamed] por [SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.GetHerHis] [SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.Custom2('RelationToMeShort', SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_commissioner').Char)]"
 pam_military_order_improvement_modifier:0 "Braços Abençoados"
 pam_military_order_improvement_modifier_desc:0 "Guerreiros da ordem sagrada treinam os recrutas locais e endurecem a disciplina neste condado."
 pam_monastic_order_improvement_modifier:0 "Auxílio Monástico"
 pam_monastic_order_improvement_modifier_desc:0 "Uma ordem monástica auxilia este condado com trabalho e conselhos."
 pam_moving_faithfuls_to_frontiers:0 "Migração de Fiéis"
 pam_moving_faithfuls_to_frontiers_desc:0 "Este condado está recebendo pessoas de diferentes [faith|E] que se mudam para cá e proselitam.\n#weak Isso torna a #V [GetPlayer.GetPlayerInteractionName('feudalize_holding_interaction')]#! [interaction|E] mais barata.#!"
 pam_pilgrim_of_every_holy_site_modifier:0 "Peregrino de Todos os Assentos"
 pam_pilgrim_of_every_holy_site_modifier_desc:0 "Este personagem manteve vigília em todos os locais sagrados de sua fé."
 pam_recently_baptized_at_domicile_modifier:0 "Recentemente Batizado"
 pam_recently_baptized_at_domicile_modifier_desc:0 "Este personagem foi batizado no Batistério do Complexo da Catedral de sua Arquidiocese."
 pam_relocating_faithfuls_to_frontiers:0 "Realocar Fiéis para as Fronteiras"
 pam_relocating_faithfuls_to_frontiers_desc:0 "Este condado incentiva pessoas da mesma [rite|E] a se mudarem para um [realm|E] diferente para proselitar."
 pam_stone_for_god_estate_build_discount_modifier:0 "Pedra para a Casa de Deus"
 pam_stone_for_god_estate_build_discount_modifier_desc:0 "O olhar perspicaz de arquiteto deste personagem tornou o acesso à pedra possível."
 pam_tithes_or_mercy_harsh_tithes_modifier:0 "Dízimos Forçados"
 pam_tithes_or_mercy_harsh_tithes_modifier_desc:0 "Os dízimos foram extraídos com rigor, deixando as comunidades locais amarguradas com seu suserano."
 pam_tithes_or_mercy_show_mercy_modifier:0 "Dízimos Misericordiosos"
 pam_tithes_or_mercy_show_mercy_modifier_desc:0 "A leniência na arrecadação de impostos melhorou a confiança e a boa vontade entre as comunidades locais."
 reckless_convert_modifier:0 "Conversu Irresponsável"
 reckless_convert_modifier_desc:0 "Esta pessoa decidiu se converter a uma [rite|E] com um sistema de crenças diferente sem a preparação adequada, e está tendo dificuldades para se adaptar à sua nova vida espiritual."
 study_faith_cautious_studies:0 "EstudosCautelosos"
 study_faith_cautious_studies_desc:0 "Esta [rite|E] é melhor estudada em ritmo mais lento, dedicando tempo suficiente para reformular visões incômodas em partes mais digeríveis e se acostumar com seu modo de pensar alienígena."
 study_faith_cramming_side_studies:0 "Horas Extras de Estudo"
 study_faith_cramming_side_studies_desc:0 "O estudante está tão imerso no funcionamento interno desta [rite|E] que é frequentemente encontrado rabiscando anotações em seus estudos... mesmo quando ocupado com outras coisas."
 study_faith_learning_mannerism:0 "Aprendendo os trejeitos"
 study_faith_learning_mannerism_desc:0 "Embora menos eficiente, aprender os trejeitos e rituais externos ligados a uma [rite|E] pode render resultados concretos a longo prazo."
 study_faith_newfound_coherence:0 "Coerência Recém-Encontrada"
 study_faith_newfound_coherence_desc:0 "As inconsistências encontradas até agora no estudo desta [rite|E] provaram ser um recurso em vez de um obstáculo. Ao juntar as diferenças entre dois sistemas de crença, você compreende melhor o verdadeiro significado por trás da [core_tenets|E] e das [doctrines|E] do alvo."
 study_faith_slow_and_steady:0 "Aprendiz Lento"
 study_faith_slow_and_steady_desc:0 "Esta pessoa ficou sobrecarregada com a quantidade de práticas desconhecidas às quais foi exposta, e os esforços feitos para digerir o conhecimento estão cobranço seu preço de sua proeza mental."
 suspicions_of_heresy_modifier:0 "Suspeitas de Heresia"
 suspicions_of_heresy_modifier_desc:0 "Este personagem é frequentemente visto lendo textos teológicos estrangeiros, deixando outros de sua fé desconfiados de sua devoção."
 tenet_apostolic_succession_episcopate_modifier:0 "Cadeia de Ordenação"
 tenet_apostolic_succession_episcopate_modifier_desc:0 "A fé deste personagem ordena cada bispo por meio de uma linha ininterrupta de bispos anteriores: uma fonte histórica de legitimidade honrada."
 tenet_divine_liturgy_choirs_modifier:0 "Coros dos Fiéis"
 tenet_divine_liturgy_choirs_modifier_desc:0 "As igrejas deste personagem cantam as mesmas palavras nas mesmas horas, inalteradas por gerações."
 tenet_divine_liturgy_officiant_modifier:0 "Oficiado com Dignidade"
 tenet_divine_liturgy_officiant_modifier_desc:0 "Este personagem leva a Liturgia Divina de sua fé extremamente a sério."
 tenet_divine_liturgy_schola_cantorum_modifier:0 "Schola Cantorum"
 tenet_divine_liturgy_schola_cantorum_modifier_desc:0 "Um suserano que mantém uma escola de canto sagrado mantém um liturgista que vale a pena ouvir."
 tenet_harmonious_society_five_bonds_modifier:0 "Um Laço Mantido"
 tenet_harmonious_society_five_bonds_modifier_desc:0 "Governante e súdito, pais e filhos, marido e mulher, mais velho e mais jovem, amigo e amigo. Este personagem mantém uma dessas cinco relações em boa ordem."
 tenet_original_sin_sinners_insight_modifier:0 "Perspicácia do Pecador"
 tenet_original_sin_sinners_insight_modifier_desc:0 "Quem carrega o peso do pecado sabe exatamente onde ele se esconde nos outros."
 tenet_pentarchy_holy_site_modifier:0 "Sé Patriarcal"
 tenet_pentarchy_holy_site_modifier_desc:0 "O local sagrado deste condado floresce sob a administração dos fiéis."
 tenet_polyamory_new_beloved_modifier:0 "Radiante com Novo Amor"
 tenet_polyamory_new_beloved_modifier_desc:0 "Um novo amado deixa este personagem nas nuvens."
 tenet_purgatory_sin_penalty_modifier:0 "Dívida de Punição"
 tenet_purgatory_sin_penalty_modifier_desc:0 "Um pecado confessado é um pecado perdoado, mas a dívida de punição que ele acarretou não é por isso cancelada. O que não é pago nesta vida é cobrado na próxima, e os fiéis podem ver muito bem qual dos dois este personagem escolheu."
