l_spanish:
 tgp_appreciative_populace_modifier:0 "População Apreciativa"
 tgp_appreciative_populace_modifier_desc:0 "Magistrados virtuosos são sempre apreciados pelo povo."
 tgp_army_reconstruction:0 "Reconstrução Assistida pelo Exército"
 tgp_army_reconstruction_desc:0 "Os soldados podem reclamar de serem colocados em projetos de trabalho, mas sua eficácia não pode ser negada."
 tgp_compelled_labor_modifier:0 "Trabalho Forçado"
 tgp_compelled_labor_modifier_desc:0 "O povo foi colocado para trabalhar e, embora não esteja necessariamente animado com a perspectiva, é eficaz no que faz."
 tgp_consolidated_population:0 "População Consolidada"
 tgp_consolidated_population_desc:0 "Consolidar a população de vilarejos dispersos em um único local aumentou significativamente o desenvolvimento da região."
 tgp_converted_storyteller:0 "Contador de Histórias Convertido"
 tgp_converted_storyteller_desc:0 "Poucos pregam com o fervor de um convertido, e parece que isso se aplica aos contadores de histórias tanto quanto aos sacerdotes."
 tgp_convict_labor_modifier:0 "Trabalho de Presidiários"
 tgp_convict_labor_modifier_desc:0 "Quando se trata de construção, prisioneiros são uma solução tradicional para a escassez de mão de obra."
 tgp_delayed_taxes_modifier:0 "Impostos Adiados"
 tgp_delayed_taxes_modifier_desc:0 "A população desta província pôde adiar o pagamento de impostos — prejudicial ao tesouro da administração, mas apreciado pelo povo."
 tgp_disrespected_elderly_modifier:0 "Desrespeitou os Idosos"
 tgp_disrespected_elderly_modifier_desc:0 "Um idoso insatisfeito pode causar uma quantidade surpreendente de problemas."
 tgp_doddering_magistrate_modifier:0 "Magistrado Débil"
 tgp_doddering_magistrate_modifier_desc:0 "É realmente impressionante o quanto de caos burocrático pode ser causado por apenas uma pessoa."
 tgp_emperors_notice_modifier:0 "Aviso do Filho do Céu"
 tgp_emperors_notice_modifier_desc:0 "Este personagem foi notado entre a multidão, apesar de sua baixa origem, pelo Filho do Céu durante um Exame Metropolitano."
 tgp_empowered_merchants_association:0 "Associação de Mercadores Fortalecida"
 tgp_empowered_merchants_association_desc:0 "Conceder privilégios especiais a um grupo específico de mercadores pode resolver muitos problemas do mercado, mas pode criar um precedente perigoso."
 tgp_enforced_justice_on_official_modifier:0 "Justiça Rigorosa"
 tgp_enforced_justice_on_official_modifier_desc:0 "A administração que trata os seus tão rigorosamente quanto trata os outros é digna de respeito."
 tgp_expelled_popular_peddler_modifier:0 "Mercador Popular Expulso"
 tgp_expelled_popular_peddler_modifier_desc:0 "O mercado lamenta a perda de um elixir tão eficaz."
 tgp_ferry_crossing:0 "Travessia por Balsa"
 tgp_ferry_crossing_desc:0 "Problemas difíceis frequentemente exigem soluções inovadoras, e uma balsa é um substituto eficiente para uma ponte."
 tgp_harem_medical_treatment_modifier:0 "Cuidado do Harém"
 tgp_harem_medical_treatment_modifier_desc:0 "As flores do harém são tão delicadas quanto belas, e sua saúde deve ser protegida tão cuidadosamente quanto sua fidelidade."
 tgp_harsh_cultivation_modifier:0 "Cultivo Rigoroso"
 tgp_harsh_cultivation_modifier_desc:0 "A competição acirrada com o outro discípulo de seu mentor cria um ambiente de estudo difícil, mas com muita atenção."
 tgp_hastily_rebuilt_bridge:0 "Ponte Reconstruída às Pressas"
 tgp_hastily_rebuilt_bridge_desc:0 "A pressa nem sempre é a melhor opção na construção, mas às vezes a necessidade é grande demais para esperar."
 tgp_imprisoned_poor_modifier:0 "Prisão dos Pobres"
 tgp_imprisoned_poor_modifier_desc:0 "Parece que a prisão dos pobres é surpreendentemente impopular."
 tgp_market_regulation:0 "Mercado Bem Regulamentado"
 tgp_market_regulation_desc:0 "A mão firme do estado garante que os negócios sejam conduzidos de forma adequada e de acordo com as regulamentações."
 tgp_pardoned_prisoners_modifier:0 "Prisioneiros Libertados"
 tgp_pardoned_prisoners_modifier_desc:0 "Os menos culpados ainda eram culpados de algo — e alguns rapidamente retornaram aos velhos hábitos."
 tgp_potent_physick:0 "Elixir Potente"
 tgp_potent_physick_desc:0 "O filtro do mercador se mostrou #EMP revigorante#! de mais de uma forma."
 tgp_purchased_land:0 "Aquisição de Terras"
 tgp_purchased_land_desc:0 "Uma carreira no governo frequentemente oferece amplas oportunidades de enriquecimento pessoal."
 tgp_reassured_populace:0 "População Tranquilizada"
 tgp_reassured_populace_desc:0 "Um líder confiável é uma grande fonte de tranquilidade para um povo preocupado."
 tgp_reduced_taxes_modifier:0 "Redução da Carga Tributária"
 tgp_reduced_taxes_modifier_desc:0 "Reduzir impostos pode não enriquecer o estado, mas sem dúvida faz maravilhas para sua popularidade."
 tgp_settled_caravans:0 "Caravanas Comerciais Estabelecidas"
 tgp_settled_caravans_desc:0 "Convencer caravanas comerciais a se estabelecer permanentemente provou ser um benefício para a economia local."
 tgp_state_annexed_land:0 "Terras Anexadas pelo Estado"
 tgp_state_annexed_land_desc:0 "O que o estado quer, o estado frequentemente toma, e poucos estão em posição de protestar."
 tgp_state_sponsored_storytellers:0 "Contadores de Histórias Patrocinados pelo Estado"
 tgp_state_sponsored_storytellers_desc:0 "O povo aqui é regularmente entretido com histórias de magistrados benevolentes e soldados heroicos."
 tgp_strict_supervision_modifier:0 "Supervisão Rigorosa"
 tgp_strict_supervision_modifier_desc:0 "Inúmeros olham para os céus. Poucos recebem o olhar de volta. E apenas este personagem sob escrutínio particular."
 tgp_suppressed_popular_storyteller:0 "Contador de Histórias Popular Suprimido"
 tgp_suppressed_popular_storyteller_desc:0 "Silenciar uma voz expressiva pode acalmar a agitação, mas também pode causá-la."
 tgp_well_planned_bridge:0 "Ponte Bem Planejada"
 tgp_well_planned_bridge_desc:0 "Uma ponte louvável foi recentemente construída aqui."
