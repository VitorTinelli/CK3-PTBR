l_spanish:
 aggressive_eagle_story_modifier:0 "Águia Agressiva"
 aggressive_eagle_story_modifier_desc:0 "A águia de caça deste personagem é particularmente combativa, e frequentemente ataca coisas que percebe como ameaças sem aviso."
 brave_eagle_story_modifier:0 "Águia Corajosa"
 brave_eagle_story_modifier_desc:0 "A águia de caça deste personagem é particularmente corajosa e não se afasta de qualquer perigo suspeito\n[hunt_success_chance|E] para $hunt_type_falconry$: #P +10%#!."
 calm_eagle_story_modifier:0 "Águia Calma"
 calm_eagle_story_modifier_desc:0 "A águia de caça deste personagem é calma e serena, nunca ficando excessivamente excitada ou assustada.\n[hunt_success_chance|E] para $hunt_type_falconry$: #P +10%#!"
 cat_coitus_interrupted_modifier:0 "Interrupção Felina"
 cat_coitus_interrupted_modifier_desc:0 "Este personagem teve seus encontros amorosos interrompidos pela presença de um gato excessivamente amigável."
 cat_dopey_modifier:0 "Gato Desajeitado"
 cat_dopey_modifier_desc:0 "O gato deste personagem é, digamos, um pouco desajeitado."
 cat_ill_modifier:0 "Enfermeiro Felino"
 cat_ill_modifier_desc:0 "Este personagem teve a companhia de seu amigável gato durante a convalescença."
 cat_killing_rodents_modifier:0 "Livre de Ratos"
 cat_killing_rodents_modifier_desc:0 "A residência deste personagem está quase completamente livre de ratos"
 cat_lover_modifier:0 "Amante de Gatos"
 cat_lover_modifier_desc:0 "Este personagem é absolutamente dedicado ao seu companheiro peludo, a ponto de causar alguma leve irritação em seu conselho."
 cat_rejection_modifier:0 "Rejeição Felina"
 cat_rejection_modifier_desc:0 "Este personagem descobriu, para sua consternação, que seu gato prefere a companhia de outros."
 cat_story_allergy_modifier:0 "Sensibilidade a gatos"
 cat_story_allergy_modifier_desc:0 "Este personagem está sofrendo sintomas incômodos da presença de um gato"
 cat_story_fur_mittens_modifier:0 "Luvas de pele"
 cat_story_fur_mittens_modifier_desc:0 "Este personagem tem um par de luvas de pele para manter as mãos aquecidas quando está frio"
 cat_story_modifier:0 "Gato de estimação"
 cat_story_modifier_desc:0 "Este personagem aprecia a companhia de um companheiro felino"
 cat_wrangler_modifier:0 "Domador de Gatos"
 cat_wrangler_modifier_desc:0 "Este personagem provou ser um especialista na arte complicada de lidar com gatos."
 cunning_eagle_story_modifier:0 "Águia Astuta"
 cunning_eagle_story_modifier_desc:0 "A águia de caça deste personagem é astuta e frequentemente engana suas presas\n[hunt_success_chance|E] para $hunt_type_falconry$: #P +10%#!."
 curious_eagle_story_modifier:0 "Águia Curiosa"
 curious_eagle_story_modifier_desc:0 "A águia de caça deste personagem é tão curiosa quanto uma criança, e frequentemente investiga coisas que chamam sua atenção.\n[hunt_success_chance|E] para $hunt_type_falconry$: #P +10%#!"
 dog_story_fur_carpet_modifier:0 "Tapete de Pele"
 dog_story_fur_carpet_modifier_desc:0 "Este personagem tem um lindo tapete de pele"
 dog_story_modifier:0 "Cachorro de estimação"
 dog_story_modifier_desc:0 "Um cachorro leal segue este personagem onde quer que vá"
 dog_story_walking_modifier:0 "Caminhada com cachorro"
 dog_story_walking_modifier_desc:0 "Este personagem gosta de caminhar frequentemente com seu cachorro"
 eagle_hunter_childhood_modifier:0 "Falcoeiro Destinado"
 eagle_hunter_childhood_modifier_desc:0 "Este personagem treina com águias desde jovem, e tem potencial para se tornar um falcoeiro habilidoso.\n[hunt_success_chance|E]: #P +5%#!"
 eagle_personality_level_desc:0 "Sem Treinamento"
 eagle_story_modifier:0 "Águia de Caça"
 eagle_story_modifier_desc:0 "Este personagem tem uma águia majestosa como companheira para caçar e explorar a estepe.\n[hunt_success_chance|E] para $hunt_type_falconry$: #P +10%#!"
 hunt_success_chance.eagle_hunter_childhood_modifier:0 "[GetModifier('eagle_hunter_childhood_modifier').GetNameWithTooltip]"
 loyal_eagle_story_modifier:0 "Águia Leal"
 loyal_eagle_story_modifier_desc:0 "A águia de caça deste personagem é ferozmente leal e nunca deixará o lado de seu dono.\n[hunt_success_chance|E] para $hunt_type_falconry$: #P +10%#!"
 observant_eagle_story_modifier:0 "Águia Observadora"
 observant_eagle_story_modifier_desc:0 "A águia de caça deste personagem é particularmente perceptiva, e frequentemente nota coisas que seu dono pode perder."
 protective_eagle_story_modifier:0 "Águia Protetora"
 protective_eagle_story_modifier_desc:0 "A águia de caça deste personagem é defensiva com seu dono, e frequentemente intervém para evitar que ele seja prejudicado."
 rat_hunting_cat_modifier:0 "Gato caçador de ratos"
 rat_hunting_cat_modifier_desc:0 "O gato deste personagem é um caçador prolífico de roedores."
 rat_hunting_dog_modifier:0 "Cachorro caçador de ratos"
 rat_hunting_dog_modifier_desc:0 "O cachorro deste personagem é um caçador prolífico de roedores."
 skilled_eagle_modifier:0 "Falcoeiro Habilidoso"
 skilled_eagle_modifier_desc:0 "Este personagem é um falcoeiro habilidoso, e sua águia de caça é particularmente bem treinada."
 strong_eagle_modifier:0 "Águia Forte"
 strong_eagle_modifier_desc:0 "A águia de caça deste personagem é excepcionalmente saudável e forte."
 very_weak_eagle_modifier:0 "Águia Débil"
 very_weak_eagle_modifier_desc:0 "A águia de caça deste personagem está doente e à beira da morte."
 weak_eagle_modifier:0 "Águia Fraca"
 weak_eagle_modifier_desc:0 "A águia de caça deste personagem é fraca e frequentemente tem dificuldades para pegar suas presas."
 wise_eagle_story_modifier:0 "Águia Sábia"
 wise_eagle_story_modifier_desc:0 "A águia de caça deste personagem é mais sábia do que aparenta, e frequentemente toma decisões que surpreendem seu dono.\n[hunt_success_chance|E] para $hunt_type_falconry$: #P +10%#!"
