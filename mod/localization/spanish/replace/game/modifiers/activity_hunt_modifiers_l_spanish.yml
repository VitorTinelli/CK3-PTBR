l_spanish:
 crushed_by_boulder_modifier:0 "Esmagado por Pedra"
 crushed_by_boulder_modifier_desc:0 "Esta personagem exibiu bravata que se voltou contra ela quando foi esmagada pela pedra que tentava pular."
 dog_story_beasthound_modifier:0 "Cão de Feras"
 dog_story_beasthound_modifier_desc:0 "Um cão leal, treinado para lutar contra feras perigosas, segue este personagem onde quer que ele vá.\n#weak Aumenta ligeiramente a [hunt_success_chance|E]#! contra feras [Concept('hunt_dangerous', 'Perigosas')|E]"
 dog_story_scenthound_modifier:0 "Cão de Faro"
 dog_story_scenthound_modifier_desc:0 "Um cão leal, treinado para rastrear presas selvagens, segue este personagem onde quer que ele vá.\n#weak Aumenta ligeiramente a [hunt_success_chance|E]#!"
 held_hunt_modifier:0 "Caçou Recentemente"
 held_hunt_modifier_desc:0 "Este personagem organizou recentemente uma Caçada e não pode fazê-lo novamente até a data especificada."
 hunt_aided_peasants_modifier:0 "Camponeses ajudados"
 hunt_aided_peasants_modifier_desc:0 "As pessoas mais pobres deste Condado receberam ajuda de caridade significativa."
 hunt_blooming_garden_modifier:0 "Jardim Florido"
 hunt_blooming_garden_modifier_desc:0 "O jardim deste personagem foi bem decorado com flores selvagens encontradas durante uma caçada recente."
 hunt_captive_beast_modifier:0 "Fera Cativa"
 hunt_captive_beast_modifier_custom_desc:0 "Este personagem mantém o(a) [ROOT.Char.Custom('GetAnimalTypeCaptive')] [ROOT.Char.Custom('GetAnimalAdjectiveCaptive')] para exibição e entretenimento.\n#weak Pode ser usado para [GetActivityType('activity_hunt').GetName] do(a) [ROOT.Char.Custom('GetAnimalTypeCaptive')|V] com uma #P alta#! [hunt_success_chance_no_prefix|E]"
 hunt_captive_beast_modifier_desc:0 "Este personagem capturou uma fera perigosa viva para exibição e entretenimento.\n#weak Pode ser usado para [GetActivityType('activity_hunt').GetName] essa fera com uma alta [hunt_success_chance_no_prefix|E]#!\n"
 hunt_carving_into_bark_modifier:0 "Amor Eterno"
 hunt_carving_into_bark_modifier_desc:0 "Este personagem gravou as iniciais de seu ente querido na casca de uma árvore majestosa."
 hunt_chose_truth_modifier:0 "Honestidade Humilde"
 hunt_chose_truth_modifier_desc:0 "Este personagem falou a verdade em detrimento de si mesmo."
 hunt_dangerous_beast_slain_modifier:0 "Fera Perigosa Abatida"
 hunt_dangerous_beast_slain_modifier_desc:0 "As mentes da população local ficam aliviadas com o conhecimento de que há uma ameaça a menos vagando pelas terras selvagens."
 hunt_disrespected_locals_modifier:0 "Desrespeito aos Locais"
 hunt_disrespected_locals_modifier_desc:0 "Os sentimentos dos camponeses deste condado foram pisoteados pelos caçadores."
 hunt_disturbed_locals_modifier:0 "Moradores Perturbados"
 hunt_disturbed_locals_modifier_desc:0 "Os moradores deste condado só querem ser deixados em paz."
 hunt_ending_dog_suffering_modifier:0 "Amigos Até o Fim"
 hunt_ending_dog_suffering_modifier_desc:0 "Este personagem tomou a difícil decisão de encerrar a vida de seu companheiro leal, que estava à beira da morte."
 hunt_faith_desecrated_place_of_worship:0 "Local de Culto Profanado"
 hunt_faith_desecrated_place_of_worship_desc:0 "Este personagem profanou um local de culto."
 hunt_falconry_practiced_modifier:0 "Falcoaria Praticada"
 hunt_falconry_practiced_modifier_desc:0 "Este personagem praticou falcoaria antes de sua caçada."
 hunt_focused_attention_modifier:0 "Atenção Focada"
 hunt_focused_attention_modifier_desc:0 "Este personagem sabe como se concentrar nas coisas que exigem atenção imediata."
 hunt_focused_effort_modifier:0 "Esforço Concentrado na Caça"
 hunt_focused_effort_modifier_desc:0 "Este personagem está muito focado na caça."
 hunt_fresh_air_and_exercise_modifier:0 "Ar fresco e Exercícios"
 hunt_fresh_air_and_exercise_modifier_desc:0 "Este personagem tem praticado exercícios rigorosos durante suas caçadas."
 hunt_guide_local_madman_modifier:0 "Guia Local"
 hunt_guide_local_madman_modifier_custom_desc:0 "Este personagem recebeu um tour guiado por um pântano pelo seu proprietário durante a caça.\n#weak Enquanto este modificador estiver ativo, sua chance de [sucesso_na_caca|E] será #positive_value ligeiramente melhor#! na [SCOPE.sTitle('activity_place').GetNameNoTier]#!\n"
 hunt_guide_local_madman_modifier_desc:0 "Este personagem recebeu um tour guiado por um pântano pelo seu proprietário durante a caça.\n#weak $hunt_modifier_success_slightly_improved_location_tt$#!\n"
 hunt_happy_hounds_modifier:0 "Cães Felizes"
 hunt_happy_hounds_modifier_desc:0 "Os cães de caça deste personagem são bem recompensados.\n#weak $hunt_modifier_success_slightly_improved_tt$#!\n\n"
 hunt_heir_murder_exposed_modifier:0 "Justiça Camponesa"
 hunt_heir_murder_exposed_modifier_desc:0 "Este personagem priorizou a justiça em detrimento da reputação de um cortesão."
 hunt_killed_local_madman_modifier:0 "Local Morto"
 hunt_killed_local_madman_modifier_desc:0 "Um habitante notável do pântano deste condado foi morto por um caçador excessivamente zeloso."
 hunt_left_in_trap_modifier:0 "Preso em Armadilha"
 hunt_left_in_trap_modifier_desc:0 "Este personagem ficou preso em uma armadilha de caça por um tempo muito maior do que era bom para sua saúde."
 hunt_mediated_fight_modifier:0 "Mediador"
 hunt_mediated_fight_modifier_desc:0 "Este personagem negociou com sucesso entre duas pessoas em conflito- uma lição valiosa."
 hunt_medicinal_herbs_modifier:0 "$useful_herbs$"
 hunt_medicinal_herbs_modifier_desc:0 "$useful_herbs_desc$"
 hunt_mismanaged_game_modifier:0 "Caça Mal Gerenciada"
 hunt_mismanaged_game_modifier_custom_desc:0 "Este personagem capturou um filhote de cervo e o criou domesticado para enganar seus primos selvagens.\n#weak No futuro, a [hunt_success_chance|E] para esse tipo de animal será #negative_value ligeiramente pior#! neste [county|E]#!"
 hunt_mismanaged_game_modifier_desc:0 "A caça de cervas reduziu os estoques de animais deste condado.\n#weak Futura [hunt_success_chance|E] contra este animal serão #negative_value um pouco piores#! neste [county|E]#!"
 hunt_mystical_animal_modifier:0 "Caçou Animal Místico"
 hunt_mystical_animal_modifier_desc:0 "Este personagem caçou e matou uma criatura mística."
 hunt_peasants_denied_forest_modifier:0 "Camponeses proibidos de Pastar nas Florestas"
 hunt_peasants_denied_forest_modifier_desc:0 "Aos camponeses deste Condado foi negado o direito de pastar nas florestas."
 hunt_peasants_hunted_modifier:0 "Camponeses caçados"
 hunt_peasants_hunted_modifier_desc:0 "Os camponeses têm medo de se instalar neste Condado, devido às coisas indescritíveis que aconteceram aqui."
 hunt_poacher_training_modifier:0 "Treinamento com Caçadores Ilegais"
 hunt_poacher_training_modifier_desc:0 "Este personagem foi treinado por caçadores ilegais para caçar."
 hunt_poet_romance_aptitude_modifier:0 "Caçando Enquanto Observava"
 hunt_poet_romance_aptitude_modifier_desc:0 "Este personagem teve um encontro amoroso durante a caçada que inspirou sua poesia."
 hunt_poisonous_herbs_modifier:0 "$poisonous_plants$"
 hunt_poisonous_herbs_modifier_desc:0 "$poisonous_plants_desc$"
 hunt_protected_peasants_modifier:0 "Proteção aos Camponeses"
 hunt_protected_peasants_modifier_desc:0 "Os camponeses deste condado se sentem seguros."
 hunt_protected_their_secret_modifier:0 "Protetor de Segredos"
 hunt_protected_their_secret_modifier_desc:0 "Este personagem está guardando suas cartas a sete chaves."
 hunt_punished_locals_modifier:0 "Puniu Caçadores Ilegais"
 hunt_punished_locals_modifier_desc:0 "As pessoas neste Condado carregam o fardo de compensar os caçadores furtivos nas florestas.\n#weak $hunt_modifier_success_slightly_improved_location_tt$#!\n"
 hunt_punished_trappers_modifier:0 "Caçadores Punidos"
 hunt_punished_trappers_modifier_desc:0 "As armadilhas de caça dos camponeses deste condado sofreram a ira de seu dono."
 hunt_savage_hounds_modifier:0 "Cães Selvagens"
 hunt_savage_hounds_modifier_desc:0 "Os cães deste personagem têm a reputação de derrubar grandes presas.\n#weak $hunt_modifier_success_slightly_improved_tt$#!\n\n"
 hunt_savaged_hounds_modifier:0 "Cães Destroçados"
 hunt_savaged_hounds_modifier_desc:0 "Os canis deste personagem foram esvaziados ao lançar os cães contra as feras.\n#weak $hunt_modifier_success_slightly_worse_tt$#!\n\n"
 hunt_sighting_dangerous_modifier:0 "Avistamento de Fera"
 hunt_sighting_dangerous_modifier_custom_desc:0 "Uma fera feroz de um(a) [SCOPE.sTitle('sighting_county').Custom('GetAnimalType')] tem aterrorizado este condado.\n#weak Aumenta a [hunt_success_chance_no_prefix|E] das caçadas de um(a) [SCOPE.sTitle('sighting_county').Custom('GetAnimalType')|U]#!"
 hunt_sighting_dangerous_modifier_desc:0 "Uma fera feroz tem aterrorizado este condado.\n#weak A chance de sucesso na caça é aumentada neste condado#!"
 hunt_sighting_falconry_modifier:0 "Avistamento de Aves"
 hunt_sighting_falconry_modifier_custom_desc:0 "Avistamentos de [SCOPE.sTitle('sighting_county').Custom('GetAnimalPlural')] migratórias ou em reprodução tornam este condado ideal para a prática da falcoaria.\n#weak Aumenta a [hunt_success_chance_no_prefix|E] das caçadas de um(a) [SCOPE.sTitle('sighting_county').Custom('GetAnimalType')]#!"
 hunt_sighting_falconry_modifier_desc:0 "Avistamentos recentes de aves migratórias ou em reprodução tornam este condado ideal para a prática da falcoaria.\n#weak A [hunt_success_chance|E] na $hunt_type_falconry$ é aumentada neste condado#!"
 hunt_sighting_legendary_modifier:0 "Avistamento de Lendário"
 hunt_sighting_legendary_modifier_custom_desc:0 "Um [SCOPE.sTitle('sighting_county').Custom('GetLegendaryColor')] animal mítico de um(a) [SCOPE.sTitle('sighting_county').Custom('GetAnimalType')] foi avistado neste condado.\n#weak [SCOPE.sTitle('sighting_county').Custom('GetAnimalType')|V] [SCOPE.sTitle('sighting_county').Custom('GetLegendaryColor')|V] Lendário pode ser caçado neste [county|E]#!"
 hunt_sighting_legendary_modifier_desc:0 "Um animal mítico foi avistado neste condado.\n#weak Uma [GetActivityType('activity_hunt').GetTextIcon][GetActivityType('activity_hunt').GetName] de $hunt_type_legendary$ pode ser realizada neste condado#!"
 hunt_sighting_standard_modifier:0 "Avistamento de Caça"
 hunt_sighting_standard_modifier_custom_desc:0 "Muitos(a) [SCOPE.sTitle('sighting_county').Custom('GetAnimalPlural')] foram avistados neste condado.\n#weak Aumenta a [hunt_success_chance_no_prefix|E] das caçadas de um(a) [SCOPE.sTitle('sighting_county').Custom('GetAnimalType')|U]#!"
 hunt_sighting_standard_modifier_desc:0 "Uma grande quantidade de animais promissores foi avistada neste condado.\n#weak A chance de sucesso na caça é aumentada neste condado#!"
 hunt_stocked_medicus_modifier:0 "Médico Abastecido"
 hunt_stocked_medicus_modifier_desc:0 "O médico deste personagem possui estoques abundantes de ervas medicinais, tanto raras quanto comuns."
