 bhakti_hinduism_saraswati:0 "Devoto de Saraswati"
 bhakti_hinduism_saraswati_desc:0 "A bhakti deste personagem é por Saraswati, deusa do aprendizado, música, arte e sabedoria."
 bhakti_shaivism_dakshinamoorthy:0 "Devoto de Dakshinamoorthy"
