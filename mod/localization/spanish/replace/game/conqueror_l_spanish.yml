l_spanish:
 conqueror.0001.a:0 "Que a conquista comece!"
 conqueror.0001.b:0 "Eu preferiria ficar aqui e sentir o cheiro do [ROOT.Char.GetCapitalLocation.Custom('get_region_flower_type_plural')]..."
 conqueror.0001.desc.temujin:0 "\n\nDe um lobo azul-acinzentado e uma corça marrom, eu só oferecerei ruína ou submissão."
 conqueror.0001.desc:0 "Está cada vez mais claro. Desde o mais humilde camponês até o mais nobre dos meus vassalos — todos sussurram meu nome, sussurram sobre meu poder, sussurram sobre a #EMP guerra!#! Há apoio para minha causa, pois meu povo me vê como um governante digno do mundo.\n\nA força d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetPrimaryTitle.GetBaseName] é minha para empunhar — e empunhá-la-ei. Avançar é o que esperam de mim, reivindicar pela força o que me pertence. Estou destinado a reinar, a subjugar aqueles ao meu redor e torná-los parte de [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\nCom meu povo ao meu lado, não posso falhar."
 conqueror.0001.t:0 "Dominar o Mundo"
 conqueror.0002.a:0 "Era bom demais para ser verdade..."
 conqueror.0002.count:0 "\"[root_scope.GetFirstName], um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] mer[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]... patétic[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]!\" Meus súditos sussurram. \"Esse título não vale #EMP nada#!, queremos seguir [Select_CString( ROOT.Char.IsFemale, 'uma rainha', 'um rei' )] — não um pobre!\""
 conqueror.0002.debt_level:0 "\"[root_scope.GetSheHe|U] arruinou [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]!\" Meus súditos exclamam zombeteiramente. \"O tesouro está completamente vazio, como [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip] poderia deixar isso acontecer!\""
 conqueror.0002.incapable:0 "\"Sua mente se foi, não há ninguém lá dentro para nos liderar.\" Meus súditos sussurram. \"Foi bom enquanto durou...\""
 conqueror.0002.independence:0 "\"Nenhum #EMP verdadeiro#! conquistador se prostraria diante de outro.\" Meus súditos comentam entre si em sussurros. \"É fraqueza, e bem verdadeira. Nada mais que fraqueza.\""
 conqueror.0002.intro:0 "Acabou. Antigos amigos voltam-se contra mim, o fluxo constante de apoio está se quebrando, e meus soldados abandonam suas espadas em desapontamento.\n\n"
 conqueror.0002.lost_wars:0 "\"[Select_CString( ROOT.Char.IsFemale, 'A', 'O' )] [ROOT.Char.GetTitleAsNameNoTooltip] é frac[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )].\" As vozes dos meus súditos ecoam. \"[root_scope.GetSheHe|U] perdeu guerra após guerra, quem seguiria um comandante tão incompetente?\""
 conqueror.0002.outro:0 "As palavras doem em meus ouvidos.\n\nParece que minhas conquistas acabaram. Por enquanto."
 conqueror.0002.peace:0 "\"Um 'grande' conquistador que não conquista, que piada!\" As vozes dos meus súditos ecoam em meus salões. \"Não queríamos paz, queríamos #EMP glória!#!\""
 conqueror.0002.prestige:0 "\"Seu nome não vale mais que sujeira!\" Meus súditos dizem, zombeteiramente. \"Quem seguiria alguém que se envergonhou?\""
 conqueror.0002.t:0 "Um Conquistador Fracassado"
 conqueror.1000.a:0 "Este ouro é muito bem-vindo."
 conqueror.1000.b:0 "Use o ouro para atrair mercenários!"
 conqueror.1000.c:0 "Agradeça a [generous_vassal.GetSheHe] de maneira muito graciosa, mas não preciso de presentes!"
 conqueror.1000.desc:0 "\"Para o cofre de guerra.\" A mensagem de [generous_vassal.GetTitledFirstNamePossessive] lê. \"Use esses fundos sabiamente, ó [ROOT.Char.GetTitleAsNameNoTooltip] — use-os para abastecer os armazéns, alimentar os soldados ou reforçar suas fileiras com mercenários. Mal posso esperar para ver a glória que você trará ao [ROOT.Char.GetPrimaryTitle.GetBaseName]!\"\n\nPosso usar isso com sabedoria."
 conqueror.1000.t:0 "$conqueror_prefix$ Para o Cofrinho de Guerra"
 conqueror.1100.a:0 "Vou providenciar acomodações para você!"
 conqueror.1100.b:0 "Divida os homens entre meus regimentos."
 conqueror.1100.c:0 "[generous_vassal.GetFirstNameNoTooltip] é generoso, mas não preciso de você."
 conqueror.1100.desc:0 "\"Saudações, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip].\" Diz o $knight_culture_player_no_tooltip$, anunciando a presença [maa_leader.GetHerHim]. \"Sou [maa_leader.GetFirstName], enviad[Select_CString( maa_leader.IsFemale, 'a', 'o' )] por [generous_vassal.GetTitledFirstName] para servi-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] — trago comigo um séquito dos melhores soldados que a [generous_vassal.GetCapitalLocation.GetTitle.GetName] pode reunir!\"\n\n\"Tudo o que [Select_CString( generous_vassal.IsFemale, 'minha', 'meu' )] [generous_vassal.GetTitleAsNameNoTooltip] pede é que você nos coloque para um bom uso e nos direcione em direção à glória!\" [maa_leader.GetSheHe|U] fica em posição de sentido."
 conqueror.1100.t:0 "$conqueror_prefix$ Fileiras Reforçadas"
 conqueror.1200.a:0 "Não os decepcionarei!"
 conqueror.1200.b:0 "Se eles querem guerra, então preciso de soldados."
 conqueror.1200.desc:0 "Os gritos ecoam por meus salões, minha capital, minhas terras — por todo o meu reino; \"Guerra! Guerra! Guerra!\" Eles dizem.\n\nMeus vassalos sedentos de glória clamam pelo sangue de nossos inimigos, para que eu traga sobre nós a renome que é meu destino.\n\nTenho seu apoio inabalável."
 conqueror.1200.t:0 "$conqueror_prefix$ Libere os Caçadores de Glória"
 conqueror.1300.a:0 "Presentes maravilhosos, agradeço a todos vocês!"
 conqueror.1300.b:0 "Quando ver meus soldados — alimentem-nos."
 conqueror.1300.c:0 "Deixem seus campos permanecerem áridos por um pouco mais, preciso de vocês."
 conqueror.1300.desc:0 "\"[Select_CString( root_scope.IsFemale, 'Minha', 'Meu' )] [root_scope.GetLadyLord], [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|l], indiscutível — [Select_CString( root_scope.IsFemale, 'a', 'o' )] #EMP senhor[Select_CString( root_scope.IsFemale, 'a', 'o' )] feudal!#! mais [root_scope.Custom('ComplimentAdjective')]\" O camponês gagueja, prostrando-se [portrait_peasant.GetHerselfHimself] diante de mim.\n\n\"Nós, das humildes aldeias do [peasant_barony.GetBaseName], viemos trazendo presentes — grãos, caça e ouro. Trabalhamos arduamente, mas sabemos que você trará prosperidade!\" [portrait_peasant.GetSheHe|U] continua.\n\nEles podem ser os mais humildes dos meus súditos, mas fariam qualquer coisa que eu pedisse."
 conqueror.1300.t:0 "$conqueror_prefix$ Apoio Popular"
 conqueror_end_flavor:0 "Você não receberá mais apoio de seus vassalos e povo."
 conqueror_feed_angry_vassal:0 "Vassalo Irritado Impressionado"
 conqueror_feed_angry_vassal_desc:0 "Seu [vassal|E] [angry_vassal.GetFullName] está impressionad[Select_CString( angry_vassal.IsFemale, 'a', 'o' )] com suas conquistas."
 conqueror_feed_county_gift:0 "[county_target.GetNameNoTooltip] Envia Ouro"
 conqueror_feed_county_gift_desc:0 "Os camponeses de [county_target.GetName] estão entusiasmados com suas conquistas e lhe enviam ouro."
 conqueror_feed_county_gift_desc_herd:0 "Os comuns pastores de [county_target.GetName] estão em admiração d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] grande [ROOT.Char.GetTitleAsName], e lhe apresentam belos animais."
 conqueror_feed_county_gift_herd:0 "[county_target.GetNameNoTooltip] Envia Rebanhos"
 conqueror_feed_generous_courtier:0 "[generous_courtier.GetFirstName] Dona Ouro"
 conqueror_feed_generous_courtier_desc:0 "Seu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('generous_courtier'))] [generous_courtier.GetFullName] doa ouro para sua causa!"
 conqueror_feed_knight_joins:0 "$knight_culture_player_no_tooltip$ Se Junta à Sua Causa"
 conqueror_feed_knight_joins_desc:0 "O $knight_culture_player_no_tooltip$ [knight.GetFullName] promete sua lealdade a você! (@skill_prowess_icon![knight.GetProwess])"
 conqueror_feed_siege_engineer:0 "Engenheiro de Cerco Se Junta"
 conqueror_feed_siege_engineer_desc:0 "O [GetTrait('military_engineer').GetName( GetNullCharacter )] [new_commander.GetFullName] se junta às suas fileiras!"
 conqueror_flavor:0 "Você começará a receber apoio de seus vassalos e seu povo, mas cuidado — seu apoio diminuirá se você permanecer em paz por muito tempo, perder guerras demais, tornar-se o súdito de outro reino ou cair em desgraça...\n\nSe você morrer, seus filhos são esperados para assumir o manto da conquista."
 conqueror_prefix:0 "Conquistador:"
 conqueror_title:0 "Você não receberá mais apoio de seus vassalos e povo."
 glory_hound_contribution:0 "Apoio dos Caçadores de Glória"
 glory_hound_contribution_desc:0 "Este personagem está ganhando apoio inabalável de seus vassalos [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName]."
 maa_recruitment_boon:0 "Recrutamento Eficaz de Soldados"
 maa_recruitment_boon_desc:0 "Este personagem está recebendo assistência de seus vassalos na recrutamento de soldados profissionais."
 mercenary_bolstering:0 "Fileiras Reforçadas por Mercenários"
 mercenary_bolstering_desc:0 "Este personagem atraiu a atenção de muitos mercenários, que afluem a eles em busca de glória."
 peasant_draft:0 "Recrutamento de Camponeses"
 peasant_draft_desc:0 "Camponeses afluem para as bandeiras deste personagem, mais do que dispostos a empunhar armas na milícia."
 peasant_supplies:0 "Apoio Generalizado dos Camponeses"
 peasant_supplies_desc:0 "Este personagem é amplamente popular entre os camponeses, que se dispõem a ceder mais suprimentos do que o habitual."
 war_war_war_opinion:0 "Guerra, Guerra, Guerra!"
