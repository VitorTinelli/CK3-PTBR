 setting_historicity_extra_admin_arabia_gameplay_not_administrative_desc:0 "O Império Árabe não terá um [government|E] [administrative|E] em nenhuma data de início, alinhado ao gameplay esperado."
 setting_historicity_extra_admin_arabia_historic_867:0 "#high Administrativo em 867#!"
 setting_historicity_extra_admin_arabia_historic_867_desc:0 "O Império Árabe começará com um [government|E] [administrative|E] em 867 para refletir melhor sua organização histórica, embora possa não funcionar tão bem no jogo."
