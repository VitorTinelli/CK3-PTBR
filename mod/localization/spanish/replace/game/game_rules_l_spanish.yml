 setting_historicity_extra_admin_kabulistan_gameplay_not_administrative_desc:0 "Os Gaznévidas não terão um [government|E] [administrative|E] em nenhuma data de início, alinhado ao gameplay esperado."
 setting_historicity_extra_admin_kabulistan_historic_always:0 "#high Sempre Administrativo#!"
 setting_historicity_extra_admin_kabulistan_historic_always_desc:0 "Os Gaznévidas sempre começarão com um [government|E] [administrative|E] para refletir melhor sua organização histórica, embora possa não funcionar tão bem no jogo."
 setting_historicity_extra_admin_maghreb_alt_historic_always:0 "#high Sempre Administrativo#!"
 setting_historicity_extra_admin_maghreb_alt_historic_always_desc:0 "O Magreb sempre começará com um [government|E] [administrative|E], o que não reflete sua organização histórica em 867."
 setting_historicity_extra_admin_maghreb_gameplay_not_administrative:0 "Não Administrativo"
 setting_historicity_extra_admin_maghreb_gameplay_not_administrative_desc:0 "O Magreb não terá um [government|E] [administrative|E] em nenhuma data de início, alinhado ao gameplay esperado."
 setting_historicity_extra_admin_maghreb_historic_post_1066:0 "#high Administrativo pós-1066#!"
 setting_historicity_extra_admin_maghreb_historic_post_1066_desc:0 "O Magreb começará com um [government|E] [administrative|E] em 1066 e 1178 para refletir melhor sua organização histórica, embora possa não funcionar tão bem no jogo."
 setting_historicity_extra_admin_persia_alt_historic_always:0 "#high Sempre Administrativo#!"
 setting_historicity_extra_admin_persia_alt_historic_always_desc:0 "O Império da Pérsia e o Reino da Pérsia sempre começarão com um [government|E] [administrative|E], o que não reflete sua organização histórica."
 setting_historicity_extra_admin_persia_gameplay_not_administrative:0 "Não Administrativo"
 setting_historicity_extra_admin_persia_gameplay_not_administrative_desc:0 "A Pérsia não terá um [government|E] [administrative|E] em nenhuma data de início, alinhado ao gameplay esperado."
 setting_historicity_extra_admin_persia_historic_1178:0 "#high Administrativo em 1178#!"
 setting_historicity_extra_admin_persia_historic_1178_desc:0 "O Reino da Pérsia começará com um [government|E] [administrative|E] em 1178 para refletir melhor sua organização histórica, embora possa não funcionar tão bem no jogo."
 setting_historicity_extra_admin_player_wherever_alt_historic_always:0 "#high Sempre#!"
 setting_historicity_extra_admin_player_wherever_alt_historic_always_desc:0 "Jogadores que começarem com pelo menos um [realm|E] de [title_tier|E] [kingdom|E] automaticamente o converterão para um [government|E] [administrative|E] no início do jogo."
 setting_historicity_extra_admin_player_wherever_alt_historic_with_august_trait:0 "#high Com @august_trait_icon!Traço de Agosto#!"
 setting_historicity_extra_admin_player_wherever_alt_historic_with_august_trait_desc:0 "Jogadores que possuírem o [trait|E] [GetTrait('august').GetName( GetNullCharacter )] e começarem com pelo menos um [realm|E] de [title_tier|E] [kingdom|E] automaticamente o converterão para um [government|E] [administrative|E] no início do jogo (destinado aos $game_concept_governments$ assíncronos em multiplayer)."
 setting_historicity_extra_admin_player_wherever_gameplay_not_administrative:0 "Sem Alterações Especiais"
 setting_historicity_extra_admin_player_wherever_gameplay_not_administrative_desc:0 "Os jogadores serão [administrative|E] apenas se selecionarem um [realm|E] que já tenha o [government|E] apropriado."
 setting_historicity_extra_admin_tamilakam_alt_historic_always:0 "#high Sempre Administrativo#!"
 setting_historicity_extra_admin_tamilakam_alt_historic_always_desc:0 "Os Cholas sempre começarão com um [government|E] [administrative|E], o que não é consistentemente reflexivo de sua organização histórica."
 setting_historicity_extra_admin_tamilakam_gameplay_not_administrative:0 "Não Administrativo"
 setting_historicity_extra_admin_tamilakam_gameplay_not_administrative_desc:0 "Os Cholas não terão um [government|E] [administrative|E] em nenhuma data de início, alinhado ao gameplay esperado."
 setting_historicity_extra_admin_tamilakam_historic_1066:0 "#high Administrativo em 1066#!"
 setting_historicity_extra_admin_tamilakam_historic_1066_desc:0 "Os Cholas começarão com um [government|E] [administrative|E] em 1066 para refletir melhor sua organização histórica, embora possa não funcionar tão bem no jogo."
 setting_historicity_frankokratia_blocked:0 "Nenhum"
 setting_historicity_frankokratia_blocked_desc:0 "Cruzados católicos não serão desviados para atacar o Império Bizantino."
 setting_historicity_frankokratia_default:0 "Equilibrado"
 setting_historicity_frankokratia_default_desc:0 "A Cruzada Fragmentada, desviando os católicos para atacar Bizâncio, é imediatamente possível a partir da data de início de 1178. Se usando uma data de início anterior, isso só pode acontecer #EMP após#! a primeira [crusade|E] católica."
 setting_historicity_frankokratia_fourth_crusade:0 "Quarta Cruzada"
 setting_historicity_frankokratia_fourth_crusade_desc:0 "A partir de datas de início anteriores, pelo menos 3 [crusades|E] católicas devem acontecer antes da Cruzada Fragmentada. A partir de 1178, os católicos podem atacar Bizâncio apenas #EMP após#! 1 [crusade|E]."
 setting_historicity_frankokratia_high:0 "Alta"
 setting_historicity_frankokratia_high_desc:0 "Qualquer [crusade|E] católica pode se tornar uma Cruzada Fragmentada, se dividindo para lançar uma guerra contra Bizâncio."
 setting_historicity_norman_conquest_default_random:0 "Mecânico"
 setting_historicity_norman_conquest_default_random_desc:0 "O resultado da Conquista é decidido puramente por mecânicas do jogo."
 setting_historicity_norman_conquest_determined_aelfwine:0 "#high Aelfwine Knytling#!"
 setting_historicity_norman_conquest_determined_aelfwine_desc:0 "A Conquista terminará com a morte de seus beligerantes e a surpreendente eleição de Aelfwine Haraldson, neto do Rei Canuto, o Grande — apesar de sua total falta de interesse."
 setting_historicity_norman_conquest_determined_cadoc:0 "#high Cadoc da Cornualha#!"
 setting_historicity_norman_conquest_determined_cadoc_desc:0 "A Conquista terminará com a morte de seus beligerantes e a surpreendente eleição do Conde Cadoc da Cornualha, cuja dinastia detém quase um milênio de contínua governança nas Ilhas Britânicas."
 setting_historicity_norman_conquest_determined_edgar:0 "#high Eadgar de Wessex#!"
 setting_historicity_norman_conquest_determined_edgar_desc:0 "A Conquista terminará com a morte de seus beligerantes e a eleição de Eadgar, o Atheling, sobrinho-neto e herdeiro escolhido do último rei."
 setting_historicity_norman_conquest_determined_harald:0 "#high Haraldr Yngling da Noruega#!"
 setting_historicity_norman_conquest_determined_harald_desc:0 "A Conquista será vencida à força por Haraldr Yngling, o último rei viking a tentar conquistar a Inglaterra pela força."
 setting_historicity_norman_conquest_determined_harold:0 "#high Harold Godwin da Inglaterra#!"
 setting_historicity_norman_conquest_determined_harold_desc:0 "A Conquista será vencida à força por Harold Godwin, o senhor da guerra ambicioso no topo do trono inglês."
 setting_historicity_norman_conquest_determined_margaret:0 "#high Margarida de Wessex#!"
 setting_historicity_norman_conquest_determined_margaret_desc:0 "A Conquista terminará com a morte de seus beligerantes e a surpreendente eleição de Margarida de Wessex, sobrinha-neta do último rei."
 setting_historicity_norman_conquest_determined_svend:0 "#high Svend da Dinamarca#!"
 setting_historicity_norman_conquest_determined_svend_desc:0 "A Conquista terminará com a morte de seus beligerantes e a surpreendente eleição do Rei Svend da Dinamarca, cuja família frequentemente deteve a realeza."
 setting_historicity_norman_conquest_determined_william:0 "#high Guilherme da Normandia#!"
