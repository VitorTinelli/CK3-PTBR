 game_rule.1101.a:0 "A Inglaterra não verá mais o domínio viking!"
 game_rule.1101.desc.cirencester:0 "ao redor das muralhas da antiga Cirencester,"
 game_rule.1101.desc.coastal:0 "ao longo das costas de [new_location.GetName],"
 game_rule.1101.desc.combat.commander:0 "e eu me encontro no meio da batalha."
 game_rule.1101.desc.combat.locale.cirencester:0 "$game_rule.1101.desc.combat.locale.london$"
 game_rule.1101.desc.combat.locale.dover:0 "Tão perto da perigosa beira, ambos os exércitos manobram simplesmente para forçar o inimigo a cair do precipício — com efeito limitado.\n\nO fedor de sangue polui o ar, o barulho da batalha certamente se espalha milhas adentro. Um observador azarado pode até distinguir a ocasional mancha de um corpo caindo pela encosta calcária.\n\nIsso não pode continuar, isso #EMP não#! pode continuar, ou nós nos esgotaremos. Com um grito, eu impulso meus soldados para frente, rumo à vitória, para —"
 game_rule.1101.desc.combat.locale.forest_of_dean:0 "Sob estas árvores selvagens, nos matagais e bosques desta antiga floresta, o sangue rega o chão com facilidade, e a visibilidade é tão ruim que ninguém pode dizer como a batalha se desenrola.\n\nA floresta parece absorver som e vida, conferindo nossa luta uma qualidade estranhamente abafada pela quantidade de caos e morte que se espalha pelas fileiras. Ainda assim, eu penso, talvez, as coisas estejam mudando a nosso favor—"
 game_rule.1101.desc.combat.locale.guildford:0 "A colina sinuosa, com nenhum dos exércitos controlando bem seu pico, proporciona uma luta espetacular. Longa e estreita, ambas as forças empurram com força para forçar a outra a descer pela crista oposta, onde a vantagem de elevação certamente os levará à vitória.\n\nAinda assim, sei que são #EMP meus#! tropas que levarão isso, #EMP minhas#! forças que saborearão a doçura da vitória! Para frente, #EMP para frente, cães!#! Para frente! Estamos a apenas um empurrão sólido da vitória, um empurrão de —"
 game_rule.1101.desc.combat.locale.hastings:0 "O mundo inteiro está em chamas com o estrondo do metal no madeira, a fragmentação de escudos, o relinchar de cavalos, o ritmo constante #EMP thwip#! das flechas arqueando para o céu aos milhares.\n\nTudo é reduzido a gritos, sangue e tripas. Os gritos dos feridos e moribundos, as maldições dos vingativos, as risadas alegres dos vitoriosos cavalgando seu adrenaline ainda mais para a luta.\n\nO destino balança na ponta de uma faca, e com um grito de #EMP RALLY!#! eu empurro minhas tropas para a frente."
 game_rule.1101.desc.combat.locale.isle_of_wight:0 "Longe do continente, não há para onde correr, e ambos os exércitos lutam com a desesperação de quem entende que devem vencer ou morrer. Se você não for levado às marés do Medina, então a ilha não é grande o suficiente para se esconder por muito tempo.\n\nDe alguma forma, eu me tornei isolado de meus soldados, apenas alguns guardas lutando ao meu lado na confusão. Se eu pudesse apenas virar isso a meu favor, se eu pudesse apenas virar a luta um pouco —"
 game_rule.1101.desc.combat.locale.lands_end:0 "Terras rochosas e pequenas falésias irregulares aqui dão lugar ao oceano congelante, e o terreno quebrado torna a batalha extremamente caótica, mais grupos pequenos de combate do que um confronto unificado frente a frente.\n\nMesmo assim, meu estandarte traz tropas até mim, e faço o meu melhor para avançar na confusão. Reúnam-se a mim! #EMP Reúnam-se#! Meu grito ecoa de um lado a outro da linha, ecoado e ecoado até—"
 game_rule.1101.desc.combat.locale.lindisfarne:0 "As ondas do mar queimam os olhos, ventos amargos vindos do Mar do Norte rasgam o tecido e o escudo, e os gritos dos mortos e moribundos chegam até os monges que choram no mosteiro, que uivam e rasgam suas batinas diante da carnificina que se desenrola.\n\nSe eu cair aqui, que seja porque [ROOT.Char.GetFaith.HighGodName] assim o deseja, pois caso contrário [ROOT.Char.GetFaith.HighGodNameSheHe|U] certamente apoia meu direito à Inglaterra! Avante, meus soldados, avante e tragam-me minha coroa! Lute até o seu último, a menos que —"
 game_rule.1101.desc.combat.locale.london:0 "Apesar das melhores tentativas dos defensores de cima das muralhas para influenciar a situação, ambos os lados estão simplesmente se desgastando em um impasse incessante.\n\nO ar fede a sangue, o ruído dos moribundos e de seus algozes cobre o ar, e o miasma de poeira e suor torna impossível dizer quem está ganhando.\n\nAinda assim, eu não posso abandonar minhas tropas a esta #EMP anarquia#!, e com um grito, eu me lanço mais uma vez contra o inimigo. Este é o nosso momento, nós triunfaremos, nós os quebraremos, nós —"
 game_rule.1101.desc.combat.locale.riverside:0 "Com mal apenas espaço para meia dúzia de soldados ficarem lado a lado, a batalha é menos uma questão de táticas habilidosas e mais de atrito brutal, a pressão dos corpos ajudando e dificultando os esforços para arrastar os feridos de volta da linha de frente.\n\nAinda assim, se conseguirmos apenas romper a linha, apenas dispersar suas forças, teremos conseguido! Lançando a cautela ao vento, luto caminho até a vanguarda, espada pronta e—"
 game_rule.1101.desc.combat.locale.southwark:0 "Com a cidade mais rica da Inglaterra tão perto, há tudo a lutar. Seja por lares ou saques, glória ou piedade, ambos os exércitos se chocam um contra o outro repetidamente.\n\nA margem sul do Tâmisa espuma e borbulha com nosso sangue, mas não desistirei, não #EMP desistirei#!.\n\nA Inglaterra já é minha, esta batalha provará isso, e tudo o que requer é um último #EMP empurrão#! para provar que—"
 game_rule.1101.desc.combat.locale.stamford_bridge:0 "Durante toda a manhã, nossas tropas têm avançado e recuado pelo ponte, grupos fragmentados atravessando o Rio Derwent para lutar contra seus inimigos na margem oposta a cada outra hora.\n\nÉ... carnificina. Nada além de gritos e morte, pontuados pelo impacto dos corpos atingindo a água. O Derwent flui vermelho, e deve fazer isso por milhas ainda. Com a espada erguida, me lanço em um ataque final para quebrar o impasse, avançando pela ponte com minhas tropas pessoais e —"
 game_rule.1101.desc.combat.locale.stonehenge:0 "Em teoria, essas vastas e planas terras fazem um lugar ideal para a guerra. Espaço abundante para os exércitos se confrontarem, e ainda assim... há algo absolutamente #EMP estranho#! sobre o lugar. Algo não está certo.\n\nLutamos e morremos, e bradamos nossa ira aos altos céus, mas algo no ar parece absorver nossa malícia tão rápido quanto ela vem. Ainda assim, não posso desacelerar, devo liderar, devo—"
 game_rule.1101.desc.combat.not_present:0 "embora eu não possa estar lá para ver pessoalmente."
 game_rule.1101.desc.combat.random.absent.1:0 "Por boa parte de um dia, nossos exércitos se atiram uns aos outros. Primeiro dezenas morrem, depois centenas, a conta do açougueiro lentamente subindo a cada hora que passa, enquanto soldados jogam suas vidas por minha causa.\n\nCertamente, certamente tudo isso valerá a pena. Certamente essa quantidade de morte deve ter algum retorno, alguma compensação pelas vidas enviadas para a fria abraços de [ROOT.Char.GetFaith.DeathDeityNamePossessive]."
 game_rule.1101.desc.combat.random.absent.2:0 "O conflito é brutal. O estrondo de escudos estilhaçados e os gritos dos moribundos rasgam o ar, toda semblante de organização perdida sob o caos de meia dúzia de cargas quebradas e linhas de batalha mais emaranhadas do que não.\n\nAinda assim, as tropas continuam a lutar, lutando por seu [ROOT.Char.GetTitleAsNameNoTooltip], lutando para garantir que seus direitos e privilégios inatos não sejam pisoteados, mesmo que isso custe suas vidas."
 game_rule.1101.desc.combat.random.absent.3:0 "Vidas são ceifadas em centenas, caindo como trigo sob a foice, tantos fios cortados sob as expressões carrancudas de assassinos contratados cumprindo seu trabalho sangrento.\n\nSeu sacrifício será, com certeza, #EMP com certeza#!, válido, uma condição necessária para minha glória futura. Cada um é um paralelepípedo no caminho do destino, colocado em prol de um único objetivo."
 game_rule.1101.desc.combat.random.present.1:0 "Nossos exércitos se atiram uns aos outros, e todo o mundo se reduz a escudos estilhaçados, metal gritando e os gemidos de homens e cavalos morrendo.\n\nA guerra pode ser brutal, mas isso é menos guerra e mais mero abate. Veteranos e mercenários de ambos os lados colocando as novas milícias a gritar sob a espada com uma alegria sombria.\n\nRelutante em deixar esse pesadelo continuar, avanço, minha guarda pressionada bem perto de mim, e—"
 game_rule.1101.desc.combat.random.present.2:0 "Nossas duas forças colidem e giram uma ao redor da outra, ambos os lados procurando fraquezas. Lutamos, depois recuamos, apenas para nos atirarmos uns aos outros mais adiante na linha.\n\nAs baixas são leves, no momento, mas há um peso no ar. Todos nós sabemos que essa dança não pode continuar para sempre, que a verdadeira batalha deve se iniciar em breve.\n\nMelhor controlar o campo do que se submeter a ele. Erguendo minha espada bem alta e gritando para [ROOT.Char.GetFaith.WarGodName], atiro-me para frente, todos os exércitos de [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] atrás de mim e—"
 game_rule.1101.desc.combat.random.present.3:0 "A luz do dia já está morrendo, desperdiçada ao nos massacrarmos um ao outro hora após hora. Os braços que empunham espadas ficam pesados com o desgaste, as mentes embaçadas pelo cansaço, e conforme o sol começa a se pôr no horizonte, a batalha ameaça terminar em um impasse.\n\nNão.\n\nNão permitirei isso. Isso termina, aqui e agora, com minha vitória, e verei isso realizado ou que [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself|U] me atinja #EMP d—#!"
 game_rule.1101.desc.dover:0 "no topo dos próprios Falésias Brancas de Dover,"
 game_rule.1101.desc.fallback:0 "em um campo sem graça perto de [new_location.GetName],"
 game_rule.1101.desc.farmlands:0 "nas exuberantes terras agrícolas de [new_location.GetName],"
 game_rule.1101.desc.forest:0 "nas florestas de [new_location.GetName],"
 game_rule.1101.desc.forest_of_dean:0 "nas florestas sombrias da Floresta de Dean,"
 game_rule.1101.desc.france:0 "em solo francês,"
 game_rule.1101.desc.guildford:0 "ao longo da crista do Hog's Back, fora de Guildford,"
 game_rule.1101.desc.hastings:0 "em uma colina perto da cidade de Hastings,"
 game_rule.1101.desc.hills:0 "nas colinas ondulantes de [new_location.GetName],"
 game_rule.1101.desc.isle_of_wight:0 "ao longo das margens do Rio Medina na isolada Ilha de Wight,"
 game_rule.1101.desc.lands_end:0 "aos pés de Land's End, quase na imensidão do Atlântico,"
 game_rule.1101.desc.lincoln:0 "perto da antiga cidade de Lincoln,"
 game_rule.1101.desc.lindisfarne:0 "do outro lado da costa do mosteiro insular de Lindisfarne, um dos espaços mais sagrados da Grã-Bretanha,"
 game_rule.1101.desc.london:0 "fora das próprias muralhas de Londres,"
 game_rule.1101.desc.normandy:0 "na própria Normandia,"
 game_rule.1101.desc.norway:0 "na própria Noruega,"
 game_rule.1101.desc.opposing_army:0 "Encontramos o host viking de [loser.GetTitledFirstNamePossessive]"
 game_rule.1101.desc.outro.absent:0 "Finalmente, as linhas do inimigo se despedaçam e as forças [loser.GetHerHim] são postas em rota: este dia pertence a [winner.GetTitledFirstNameNicknamedNoTooltip]!"
 game_rule.1101.desc.outro.present:0 "O pensamento me abandona enquanto o mundo se torna um borrão de cortes e golpes, meus moradores apertados ao meu redor enquanto esmagamos o exército de [loser.GetTitledFirstNamePossessive]. Sob minha lâmina, o inimigo foge."
 game_rule.1101.desc.oxford:0 "perto da insignificante cidade de Oxford,"
 game_rule.1101.desc.plains:0 "através das planícies de [new_location.GetName],"
 game_rule.1101.desc.riverside:0 "atravessando uma estreita ponte de pedra que cruza um rio em [new_location.GetName],"
 game_rule.1101.desc.scotland:0 "no solo hostil da vizinha Escócia,"
 game_rule.1101.desc.southwark:0 "perto das ruínas da Ponte de Londres e da travessia de Southwark,"
 game_rule.1101.desc.stamford_bridge:0 "em Stamford Bridge, um estreito caminho de pedra mal largo o suficiente para uma pessoa atravessar por vez,"
 game_rule.1101.desc.stonehenge:0 "através da ampla Salisbury Plain sob a sombra de Stonehenge,"
 game_rule.1101.desc.wales:0 "nas colinas e vales do País de Gales,"
 game_rule.1101.desc.wetlands:0 "nos pântanos fetidos de [new_location.GetName],"
 game_rule.1101.desc.winchester:0 "perto da antiga capital saxônica de Winchester,"
 game_rule.1101.desc.york:0 "perto de York, a fortaleza-romana da Eboracum,"
 game_rule.1101.t.boilerplate.battle_1:0 "A Batalha de"
 game_rule.1101.t.boilerplate.battle_2:0 "A Segunda Batalha de"
 game_rule.1101.t.boilerplate.location.cirencester:0 "Cirencester"
 game_rule.1101.t.boilerplate.location.fallback:0 "[new_location.GetNameNoTooltip]"
 game_rule.1101.t.boilerplate.location.forest_of_dean:0 "a Floresta de Dean"
 game_rule.1101.t.boilerplate.location.lands_end:0 "Land's End"
 game_rule.1101.t.boilerplate.location.stamford_bridge:0 "Stamford Bridge"
 game_rule.1101.t.boilerplate.location.stonehenge:0 "Salisbury Plain"
 game_rule.1102.a:0 "Como isso pode acontecer!?"
 game_rule.1102.b:0 "Eu #DIE1 estou...#! #DIE2 desfeito...#!"
 game_rule.1102.desc.opposing_army:0 "Saxões de [winner.GetTitledFirstNamePossessive] colidem conosco"
 game_rule.1102.desc.outro.alive:0 "No final, porém, tudo é em vão. Minhas forças se quebram, o inimigo avança para o espaço, e com sua destruição, minhas ambições são totalmente esmagadas."
 game_rule.1102.desc.outro.dead:0 "A dor surge em meu peito. Não, não, #BER não#!, quem poderia ter... onde... o mundo se agita de forma estranha enquanto eu caio no chão, o sangue florescendo da ferida. Lentamente, a morte me toma."
 game_rule.1103.a:0 "Vitória sobre aquele bastardo pretensioso!"
 game_rule.1103.desc.opposing_army:0 "A batalha é iniciada com os normandos de [loser.GetTitledFirstNamePossessive]"
 game_rule.1103.desc.outro.absent:0 "$game_rule.1101.desc.outro.absent$"
 game_rule.1103.desc.outro.present:0 "$game_rule.1101.desc.outro.present$"
 game_rule.1104.a:0 "Mas — o Confessor me prometeu a Inglaterra!"
 game_rule.1104.b:0 "Que o reino traga... #DIE1 você...#! #DIE2 miséria...#!"
 game_rule.1104.desc.opposing_army:0 "Os saxões de [winner.GetTitledFirstName] lutam contra nós"
 game_rule.1104.desc.outro.alive:0 "$game_rule.1102.desc.outro.alive$"
 game_rule.1104.desc.outro.dead:0 "$game_rule.1102.desc.outro.dead$"
 game_rule.1111.a:0 "Outra vitória para as sagas!"
 game_rule.1111.desc.opposing_army:0 "Saxões de [loser.GetFirstNamePossessive] colidem conosco"
 game_rule.1111.desc.outro.absent:0 "$game_rule.1101.desc.outro.absent$"
 game_rule.1111.desc.outro.present:0 "$game_rule.1101.desc.outro.present$"
 game_rule.1112.a:0 "Não, não, não, NÃO, #BER NÃO#!"
 game_rule.1112.b:0 "Maldito... #DIE1 você...#! #DIE2 Tostig...#!"
 game_rule.1112.desc.opposing_army:0 "Encontramos o host viking de [winner.GetTitledFirstNamePossessive]"
