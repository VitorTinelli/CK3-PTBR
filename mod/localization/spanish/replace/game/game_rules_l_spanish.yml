 setting_historicity_extra_admin_carolingians_alt_historic_all_administrative_desc:0 "A França Ocidental, Lotharingia, França Oriental e Itália começarão como [governments|E] [administrative|E] em 867, o que não reflete sua organização histórica (mas não está tão longe — ainda)."
