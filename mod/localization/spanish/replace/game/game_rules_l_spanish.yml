 setting_faster_faith_conversion_speed:0 "#high muito Rápido#!"
 setting_faster_faith_conversion_speed_desc:0 "$setting_faster_culture_conversion_speed_desc$"
 setting_faster_hybrid_and_divergence_cooldowns:0 "#high Mais Rápido#!"
 setting_faster_hybrid_and_divergence_cooldowns_desc:0 "As [cultures|E] só podem [diverge|E] após terem existido por #V 50#! anos, e [hybridize|E] após terem existido por #V 25#! anos."
 setting_few_conquerors_frequency:0 "#high 50% Reduzido#!"
 setting_few_conquerors_frequency_desc:0 "A cada #V 5#! anos, há uma pequena chance de que [rulers|E] [Concept('independent', 'Independentes')|E] com certos [traits|E] e [personalities|E] se tornem [ai_conquerors_personality|E] [conqueror_i]. A chance é reduzida em #V 50%#!."
 setting_fewer_branched_rite_amount:0 "#high Menos#!"
 setting_fewer_branched_rite_amount_desc:0 "Um por #V 100#! [counties|E], o primeiro em #V 200#!."
 setting_fewer_minor_disease_frequency:0 "#high Muito Pouco#!"
 setting_fewer_minor_disease_frequency_desc:0 "Enfermidade menores aparecerão de forma menos frequente."
 setting_fp1_scandi_adventurers_apocalyptic:0 "Apocalíptico"
 setting_fp1_scandi_adventurers_apocalyptic_desc:0 "Os aventureiros escandinavos tentarão atacar a Rússia e o Mar do Norte todos os anos, personagens da IA não precisam de traços específicos para lançar [varangian_adventures|E]."
 setting_fp1_scandi_adventurers_frequent:0 "Frequente"
 setting_fp1_scandi_adventurers_frequent_desc:0 "Os aventureiros escandinavos tentarão atacar a Rússia e o Mar do Norte a cada 5 anos."
 setting_fp1_scandi_adventurers_occasional:0 "Ocasional"
 setting_fp1_scandi_adventurers_occasional_desc:0 "Os aventureiros escandinavos tentarão atacar a Rússia e o Mar do Norte a cada 10 anos."
 setting_fp1_scandi_adventurers_off:0 "Desligado"
 setting_fp1_scandi_adventurers_off_desc:0 "Os aventureiros escandinavos nunca tentarão atacar a Rússia ou o Mar do Norte."
 setting_fp1_scandi_adventurers_rare:0 "Raro"
 setting_fp1_scandi_adventurers_rare_desc:0 "Os aventureiros escandinavos tentarão atacar a Rússia e o Mar do Norte a cada 15 anos."
 setting_full_faith_acceptance:0 "#high Total#!"
 setting_full_faith_acceptance_desc:0 "Todas as Crenças são totalmente aceitas por outras Crenças. Não tendo nenhuma penalidade de Opinião por ter uma Crença diferente."
 setting_full_gender_equality:0 "#high Igualitário#!"
 setting_full_gender_equality_desc:0 "Todas as Doutrinas de Gêneros e Leis são definidas como Iguais. As mesmas regras e direitos são aplicados para todos os personagens, independente do gênero."
 setting_hard_difficulty:0 "#high Difícil#!"
 setting_hard_difficulty_desc:0 "Governantes controlados pela IA receberão bônus, como menos estresse e domínios mais estáveis. @alert_icon! #alert_trial Isso tornará os domínios da IA muito mais estáveis e ricos, o que deixará o jogo menos equilibrado.#!"
 setting_harm_dangerous:0 "Perigoso"
 setting_harm_dangerous_desc:0 "Acidentes, má sorte e os caprichos imprevisíveis do Destino podem resultar em [character_death_death|E], o [trait|E] [GetTrait('incapable').GetName(GetNullCharacter)] e perda de [health|E] de forma aleatória."
 setting_harm_illusion_of_safety:0 "#high Ilusão de Segurança#!"
 setting_harm_illusion_of_safety_desc:0 "Eventos aleatórios de [character_death_death|E] ou incapacitação são muito mais raros. Até que não sejam."
 setting_harm_safe:0 "#high Seguro#!"
 setting_harm_safe_desc:0 "Eventos aleatórios prejudiciais não matarão nem incapacitarão os [characters|E]. Eles ainda podem morrer prematuramente em outros eventos, especialmente se estiverem em situações perigosas."
 setting_harm_spiteful:0 "[game_rule_extreme_i|e] #high Malicioso#!"
 setting_harm_spiteful_desc:0 "O Destino direciona sua crueldade implacável aos [characters|E] de destaque: aqueles com [skills|E] altas, [traits|E] herdáveis, conquistas notáveis e assim por diante."
 setting_harm_target_ai_only:0 "Apenas a IA"
 setting_harm_target_ai_only_desc:0 "$setting_random_harm_boilerplate$ a IA apenas."
 setting_harm_target_all:0 "Qualquer um"
 setting_harm_target_all_desc:0 "$setting_random_harm_boilerplate$ qualquer $game_concept_character$."
 setting_harm_target_player_only:0 "Apenas o Jogador"
 setting_harm_target_player_only_desc:0 "$setting_random_harm_boilerplate$ apenas jogadores."
 setting_harm_tragic:0 "#high Trágico#!"
 setting_harm_tragic_desc:0 "Não apenas os bons morrem jovens — agora você também pode, com chances aumentadas de eventos aleatórios prejudiciais para todos!"
 setting_harm_tragically_spiteful:0 "[game_rule_extreme_i|e] #high Tragicamente Malicioso#!"
 setting_harm_tragically_spiteful_desc:0 "A chance de eventos aleatórios prejudiciais é significativamente aumentada para todos, mas principalmente para aqueles de #EMP destaque#!."
 setting_higher_realm_stability:0 "#high Maior#!"
 setting_higher_realm_stability_ai_only:0 "#high Somente IA: Maior#!"
 setting_higher_realm_stability_ai_only_desc:0 "Uma quantidade menor de [factions|E] surgirá, mas apenas para governantes da IA."
 setting_higher_realm_stability_desc:0 "Uma quantidade menor de [factions|E] surgirá."
