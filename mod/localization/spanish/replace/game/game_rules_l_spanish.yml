 game_rule.1113.a:0 "[loser.GetSheHe|U] não era [Select_CString( loser.IsFemale, 'uma verdadeira', 'um verdadeiro' )] [loser.Custom('GetDaughterSon')] do Norte!"
 game_rule.1113.desc.opposing_army:0 "A batalha é iniciada com os normandos de [loser.GetTitledFirstNamePossessive]"
