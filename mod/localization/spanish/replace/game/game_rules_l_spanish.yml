 setting_historicity_extra_admin_carolingians_gameplay_not_administrative_desc:0 "Nenhum dos estados sucessores carolíngios terão [governments|E] [administrative|E] em 867, refletindo que grande parte do antigo império se tornou feudal na última geração ou duas."
 setting_historicity_extra_admin_egypt_gameplay_not_administrative:0 "Não Administrativo"
 setting_historicity_extra_admin_egypt_gameplay_not_administrative_desc:0 "O Egito não terá um [government|E] [administrative|E] em nenhuma data de início, em conformidade com a jogabilidade esperada."
 setting_historicity_extra_admin_egypt_historic_always:0 "#high Sempre Administrativo#!"
 setting_historicity_extra_admin_egypt_historic_always_desc:0 "O Egito sempre começará com um [government|E] [administrative|E] para melhor refletir sua organização histórica, embora possa não funcionar tão bem no jogo."
