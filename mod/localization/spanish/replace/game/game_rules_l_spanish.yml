 setting_ai_limited_exclave_independence:0 "#high Limitado (apenas IA)#!"
 setting_ai_limited_exclave_independence_desc:0 "Enclaves de governantes independentes de IA em paz serão removidos na sucessão, a menos que estejam conectados à área da capital por um Condado, via um caminho naval ou parte do território de De Jure."
 setting_ai_significant_exclave_independence:0 "Significativo (apenas IA)"
 setting_ai_significant_exclave_independence_desc:0 "Enclaves de governantes independentes de IA em paz serão removidos na sucessão, a menos que estejam conectados via um caminho naval ou parte do território de De Jure."
 setting_ai_total_exclave_independence:0 "#high Total (apenas IA)#!"
 setting_ai_total_exclave_independence_desc:0 "Enclaves de governantes independentes de IA em paz serão removidos na sucessão, a menos que estejam conectados via um caminho naval."
 setting_arabia_nomad_region_off:0 "Padrão"
 setting_arabia_nomad_region_off_desc:0 "A região da Arábia não é alterada."
 setting_arabia_nomad_region_on:0 "#high Nômade#!"
 setting_arabia_nomad_region_on_desc:0 "A região da Arábia usa mecânicas Nômades, projetadas para os Nômades da Estepe. Esta regra não terá efeito a menos que você possua a expansão #V $DLC020_CE2$#!."
 setting_bd_frequency_never:0 "#high Nunca#!"
 setting_bd_frequency_never_desc:0 "A Peste Negra nunca ocorrerá."
 setting_bd_frequency_once:0 "Uma Vez"
 setting_bd_frequency_once_desc:0 "A Peste Negra só pode ocorrer uma vez durante sua jogatina."
 setting_bd_frequency_unlimited:0 "[game_rule_extreme_i|e] #high Ilimitada#!"
 setting_bd_frequency_unlimited_desc:0 "A Peste Negra pode aparecer um número ilimitado de vezes em uma campanha."
 setting_bd_occurrence_historical:0 "Histórica"
 setting_bd_occurrence_historical_desc:0 "A Peste Negra começará na Ásia Central no século XIV e se espalhará organicamente por rotas comerciais historicamente populares. Milão, os Pirenéus, a Polônia e outras regiões históricas serão menos afetadas por ela."
 setting_bd_occurrence_organic:0 "#high Orgânica#!"
 setting_bd_occurrence_organic_desc:0 "A Peste Negra ocorrerá em um cenário historicamente plausível que reage ao estado atual do jogo."
 setting_bd_occurrence_random:0 "#high Aleatória#!"
 setting_bd_occurrence_random_desc:0 "A Peste Negra se originará em uma província completamente aleatória no mapa."
 setting_coronation_laws_no_imperial_uncrowned:0 "#high Acesso Imperial Coroado#!"
 setting_coronation_laws_no_imperial_uncrowned_desc:0 "[kings|E] não se tornarão [GetLaw('uncrowned').GetName] ao ascenderem ao [title_tier|E] de [emperor|E]."
 setting_coronation_laws_off:0 "#high Sem Leis de Coroação#!"
 setting_coronation_laws_off_desc:0 "[rulers|E] de [title_tier|E] alto não possuem a [law|E] [GetLaw('uncrowned').GetName] e não são obrigados a realizar [coronations|E]. A IA realizará [coronations|E] com menos frequência. Isso torna o jogo mais fácil."
 setting_coronation_laws_on:0 "Padrão"
 setting_coronation_laws_on_desc:0 "A [law|E] [GetLaw('uncrowned').GetName] prejudicará a [legitimacy|E] e a [opinion|E] de [kings|E] e [emperors|E] até que realizem uma [coronation|E]."
 setting_default_adoption:0 "Padrão"
 setting_default_adoption_desc:0 "[adoption|E] é desbloqueada pelo [trait|E] [GetTrait('compassionate').GetName(GetNullCharacter)], certas [culture_traditions|E], ser infértil e sem filhos, ou estar em um casamento do mesmo sexo."
 setting_default_branched_rite_amount:0 "Padrão"
 setting_default_branched_rite_amount_desc:0 "Uma [faith|E] apoia um(a) [rite|E] extra por #V 70#! [counties|E], fundando o primeiro em #V 140#!."
 setting_default_branched_rite_frequency:0 "Padrão"
 setting_default_branched_rite_frequency_desc:0 "Após fundar um(a) [rite|E], um(a) [faith|E] espera de #V 3#! a #V 18#! anos antes de fundar outro(a)."
 setting_default_casus_belli_costs:0 "Padrão"
 setting_default_casus_belli_costs_desc:0 "Casus Bellis custa recursos para ser declarado, como Prestigio ou Devoção."
 setting_default_conquerors_bonuses:0 "Padrão"
 setting_default_conquerors_bonuses_desc:0 "[conqueror_i] [ai_conquerors_personality|E] ganham o [trait|E] #V [GetTrait('conqueror').GetName( GetNullCharacter )]#!."
 setting_default_conquerors_frequency:0 "Padrão"
 setting_default_conquerors_frequency_desc:0 "A cada #V 5#! anos, há uma pequena chance de que [rulers|E] [Concept('independent', 'Independentes')|E] com certos [traits|E] e [personalities|E] se tornem [ai_conquerors_personality|E] [conqueror_i]."
 setting_default_conquerors_inheritance:0 "#high Todos os Herdeiros#!"
 setting_default_conquerors_inheritance_desc:0 "A personalidade e os bônus de [ai_conqueror_personality|E] [conqueror_i] serão herdados por todos os [heirs|E] que se tornarem [rulers|E] [Concept('independent', 'Independentes')|E] na [succession|E]."
 setting_default_culture_conversion_speed:0 "Padrão"
 setting_default_culture_conversion_speed_desc:0 "Velocidade de Conversão esta inalterada."
 setting_default_diplomatic_range:0 "Padrão"
 setting_default_diplomatic_range_desc:0 "O alcance da Diplomacia é inalterado."
 setting_default_divergent_culture_ai_frequency:0 "Padrão"
 setting_default_divergent_culture_ai_frequency_desc:0 "A quantidade padrão de [divergent_cultures|E] aparecerá."
 setting_default_elderly_health:0 "Padrão"
 setting_default_elderly_health_desc:0 "Personagens idosos receberão [traits|E] como [GetTrait('clouded_eyes').GetName( GetNullCharacter )], [GetTrait('faltering_heart').GetName( GetNullCharacter )], [GetTrait('withering_mind').GetName( GetNullCharacter )], [GetTrait('fragile_bones').GetName( GetNullCharacter )], ou [GetTrait('infirm').GetName( GetNullCharacter )]."
 setting_default_faith_acceptance:0 "Padrão"
 setting_default_faith_acceptance_desc:0 "A atitude de uma Crenças sobre outra Crenças é ditada por sua própria doutrina."
 setting_default_faith_conversion_speed:0 "Padrão"
 setting_default_faith_conversion_speed_desc:0 "$setting_default_culture_conversion_speed_desc$"
 setting_default_gender_equality:0 "Padrão"
 setting_default_gender_equality_desc:0 "Regras de Gêneros são determinadas por Leis de Gêneros e doutrinas."
 setting_default_heresy_outbreak_frequency:0 "Padrão"
 setting_default_heresy_outbreak_frequency_desc:0 "Heresias eclodem em [faiths|E] cuja [fervor|E] caiu abaixo de #V 40#!, e quanto mais afunda, mais propensas estão a eclodir."
 setting_default_hybrid_and_divergence_cooldowns:0 "Padrão"
 setting_default_hybrid_and_divergence_cooldowns_desc:0 "As [cultures|E] só podem [diverge|E] após terem existido por #V 100#! anos, e [hybridize|E] após terem existido por #V 50#! anos."
 setting_default_hybrid_culture_ai_frequency:0 "Padrão"
 setting_default_hybrid_culture_ai_frequency_desc:0 "A quantidade padrão de [hybrid_cultures|E] aparecerá."
 setting_default_hybrid_culture_ai_restrictions:0 "Padrão"
 setting_default_hybrid_culture_ai_restrictions_desc:0 "[hybrid_cultures|E] não criadas pelo jogador serão significativamente restritas #weak (por exemplo, nenhum híbrido de duas culturas híbridas existentes emergirá)#!"
 setting_default_matrilineal_marriages:0 "Padrão"
 setting_default_matrilineal_marriages_desc:0 "Pers. da IA arranjarão casamentos [Concept('matrilineal', 'Matrilineares')|E] se pertencerem à família próxima do jogador, a uma [dynasty_prestige_level_4|L] [dynasty|E], a um reino com [GetLaw('equal_law').GetName], ou se forem [rulers|E] fortes. Reinos com a doutrina [GetFaithDoctrine('doctrine_gender_female_dominated').GetBaseName] têm como padrão os casamentos matrilineares."
 setting_default_minor_disease_frequency:0 "Padrão"
 setting_default_minor_disease_frequency_desc:0 "Enfermidade menores aparecerão de forma normal."
 setting_default_mongol_invasion:0 "Padrão"
 setting_default_mongol_invasion_desc:0 "Os Mongóis invadirão por volta do ano 1200, desativando permanentemente a [decision|E] $mpo_become_greatest_of_khans_decision$. Se Temüjin morrer sem formar o Império Mongol, a Invasão será atrasada em pelo menos #high 50 anos#!."
 setting_default_multiplayer_murder_schemes:0 "Padrão"
 setting_default_multiplayer_murder_schemes_desc:0 "Esquemas Hostis pode ser usado contra jogadores e suas Famílias."
 setting_default_name_of_byzantium:0 "$e_byzantium$"
 setting_default_name_of_byzantium_desc:0 "O nome $e_byzantium$ permanecerá inalterado."
 setting_default_realm_stability:0 "Padrão"
 setting_default_realm_stability_ai_only_desc:0 "A quantidade padrão de [factions|E] surgirá."
 setting_default_realm_stability_desc:0 "A quantidade padrão de [factions|E] surgirá."
 setting_default_regional_heresy:0 "Padrão"
 setting_default_regional_heresy_desc:0 "Surto de Heresia em certas regiões são mais parecidas com as históricas, como a de Lollardy na Inglaterra."
 setting_default_same_sex_marriage:0 "Padrão"
 setting_default_same_sex_marriage_desc:0 "O casamento entre pessoas do mesmo sexo não está disponível"
 setting_default_same_sex_relations:0 "Padrão"
 setting_default_same_sex_relations_desc:0 "A visão da Relação de Mesmo sexo depende de cada Religião $doctrine_homosexuality_name$ Doutrina."
 setting_default_seljuk_invasion:0 "Padrão"
 setting_default_seljuk_invasion_desc:0 "Os Seljúcidas invadirão em algum momento após o ano de 945."
 setting_dissolution_after_caliph_death:0 "#high Morte do Califado#!"
 setting_dissolution_after_caliph_death_desc:0 "A [dissolution_faction|E] só pode atacar o Reino de Al-Andalus após a morte de Sultan Muhammad $Abd-al-Rahman$"
 setting_dissolution_historical_date:0 "#high Momento Histórico#!"
 setting_dissolution_historical_date_desc:0 "A [dissolution_faction|E] só é ativada após o ano de 1020 para o Reino de Al-Andalus."
 setting_dissolution_unconstrained:0 " Sem Limitações"
 setting_dissolution_unconstrained_desc:0 "A [dissolution_faction|E] pode atacar o Reino de Al-Andalus desde o início do jogo."
 setting_domain_limit_default:0 "Padrão"
 setting_domain_limit_default_desc:0 "O [domain_limit|E] permanece inalterado para todos os [rulers|E]."
