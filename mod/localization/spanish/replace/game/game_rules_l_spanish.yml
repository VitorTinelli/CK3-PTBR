 game_rule.1121.a:0 "Em seu lugar, usurpador."
 game_rule.1121.desc.opposing_army:0 "Os saxões de [loser.GetFullNameNoTooltip] [loser.GetHouseGetName] lutam contra nós"
 game_rule.1121.desc.outro.absent:0 "$game_rule.1101.desc.outro.absent$"
 game_rule.1121.desc.outro.present:0 "$game_rule.1101.desc.outro.present$"
 game_rule.1122.a:0 "Maldito aquele bastardo ladrão!"
 game_rule.1122.b:0 "Flechas! Escudo levantado, saraivada a caminho! Saraivada a—"
 game_rule.1122.desc.opposing_army:0 "A batalha é iniciada com os normandos de [winner.GetTitledFirstNamePossessive]"
 game_rule.1122.desc.outro.alive:0 "$game_rule.1102.desc.outro.alive$"
 game_rule.1122.desc.outro.dead:0 "Algo assobia do céu, direcionado, aparentemente inexoravelmente, diretamente para meu olho."
 game_rule.1123.a:0 "De volta ao frio com vocês, cães do norte!"
 game_rule.1123.desc.opposing_army:0 "Encontramos o host viking de [loser.GetTitledFirstNamePossessive]"
 game_rule.1123.desc.outro.absent:0 "$game_rule.1101.desc.outro.absent$"
 game_rule.1123.desc.outro.present:0 "$game_rule.1101.desc.outro.present$"
 game_rule.1124.a:0 "Meus sonhos são cinzas..."
 game_rule.1124.b:0 "Hah, a maior #DIE1 empreitada#! #DIE2 aguarda...#!"
 game_rule.1124.desc.opposing_army:0 "A batalha é iniciada com os normandos de [winner.GetTitledFirstNamePossessive]"
 game_rule.1124.desc.outro.alive:0 "$game_rule.1102.desc.outro.alive$"
 game_rule.1124.desc.outro.dead:0 "$game_rule.1102.desc.outro.dead$"
 game_rule.1131.a:0 "$game_rule.1101.a$"
 game_rule.1131.b:0 "Eu estava... #DIE1 tão...#! #DIE2 perto...#!"
 game_rule.1131.desc.conquest_finished.die_battlefield:0 "$game_rule.1102.desc.outro.dead$"
 game_rule.1131.desc.conquest_finished.die_home:0 "Quando a notícia chega até mim de que vencemos a batalha, sinto uma alegria imensa! Meu coração salta de alegria, se contorcendo, virando, #EMP espasmos#!, #BER gritando!#!\n\nO que está... acontecendo... comigo... não consigo... #DIE1 respirar... não consigo...#!"
 game_rule.1131.desc.opposing_army:0 "$game_rule.1101.desc.opposing_army$"
