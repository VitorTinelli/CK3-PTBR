 setting_sami_nomad_region_on_desc:0 "A região de Sápmi usa mecânicas Nômades, projetadas para os Nômades da Estepe. Esta regra não terá efeito a menos que você possua a expansão #V $DLC020_CE2$#!."
 setting_sexuality_distribution_default:0 "Heterossexualidade"
 setting_sexuality_distribution_default_desc:0 "Heterossexualidade é a sexualidade mais comum, enquanto homossexualidade, Bissexualidade, e Assexualidade são menos comuns."
 setting_sexuality_distribution_equal:0 "#high Igual#!"
 setting_sexuality_distribution_equal_desc:0 "Todas as Sexualidades no jogo são igualmente comuns."
 setting_sexuality_distribution_most_common_asexuality:0 "#high Assexualidade#!"
 setting_sexuality_distribution_most_common_asexuality_desc:0 "Assexualidade é a sexualidade mais comum, enquanto Heterossexualidade, homossexualidade e Bissexualidade são menos comuns."
 setting_sexuality_distribution_most_common_bisexuality:0 "#high Bissexualidade#!"
 setting_sexuality_distribution_most_common_bisexuality_desc:0 "Bissexualidade é a sexualidade mais comum, enquanto Heterossexualidade, homossexualidade e Assexualidade são menos comuns."
 setting_sexuality_distribution_most_common_homosexuality:0 "#high Homossexualidade#!"
 setting_sexuality_distribution_most_common_homosexuality_desc:0 "homossexualidade é a sexualidade mais comum, enquanto Heterossexualidade, Bissexualidade e Assexualidade são menos comuns."
 setting_significant_exclave_independence:0 "#high Significativo#!"
 setting_significant_exclave_independence_desc:0 "Enclaves de governantes independentes em paz serão removidos na sucessão, a menos que estejam conectados via um caminho naval ou parte do território de De Jure."
 setting_significantly_faster_culture_conversion_speed:0 "#high Extremamente Rápido#!"
 setting_significantly_faster_culture_conversion_speed_desc:0 "A velocidade foi significativamente aumentada, fazendo a conversão aproximadamente em um quarto do tempo."
 setting_significantly_faster_faith_conversion_speed:0 "#high Extremamente Rápido#!"
 setting_significantly_faster_faith_conversion_speed_desc:0 "$setting_significantly_faster_culture_conversion_speed_desc$"
 setting_significantly_slower_culture_conversion_speed:0 "#high Extremamente Lento#!"
 setting_significantly_slower_culture_conversion_speed_desc:0 "A velocidade foi significativamente reduzida, fazendo a conversão aproximadamente ser quatro vezes menor."
 setting_significantly_slower_faith_conversion_speed:0 "#high Extremamente Lento#!"
 setting_significantly_slower_faith_conversion_speed_desc:0 "$setting_significantly_slower_culture_conversion_speed_desc$"
 setting_silk_road_starting_innovations_preset:0 "Predefinido"
 setting_silk_road_starting_innovations_preset_desc:0 "As [silk_road_innovations|E] iniciais serão as mesmas predefinidas em cada marco histórico."
 setting_silk_road_starting_innovations_random:0 "Aleatório"
 setting_silk_road_starting_innovations_random_desc:0 "As [silk_road_innovations|E] iniciais serão selecionadas aleatoriamente entre as possibilidades da [era|E]."
 setting_situation_the_great_steppe_toggle_off:0 "#high Desativado#!"
 setting_situation_the_great_steppe_toggle_off_desc:0 "[situation|E] [the_great_steppe|E] não está ativado no início do jogo, o que significa que a Estepe será tratada como qualquer outra parte normal do mapa."
 setting_situation_the_great_steppe_toggle_on:0 "Ativado"
 setting_situation_the_great_steppe_toggle_on_desc:0 "Os governantes [GetGovernment( 'nomad_government' ).GetName] da Grande Estepe estarão envolvidos em uma [situation|E] com suas próprias [steppe_seasons|E] e lutarão para se tornar o [gurkhan|E]."
 setting_slower_culture_conversion_speed:0 "#high muito Lento#!"
 setting_slower_culture_conversion_speed_desc:0 "A velocidade foi reduzida, fazendo a conversão aproximadamente ser duas vezes menor."
 setting_slower_faith_conversion_speed:0 "#high muito Lento#!"
 setting_slower_faith_conversion_speed_desc:0 "$setting_slower_culture_conversion_speed_desc$"
 setting_slower_hybrid_and_divergence_cooldowns:0 "#high Mais Lento#!"
 setting_slower_hybrid_and_divergence_cooldowns_desc:0 "As [cultures|E] só podem [diverge|E] após terem existido por #V 200#! anos, e [hybridize|E] após terem existido por #V 100#! anos."
 setting_strict_regional_heresy:0 "#high Rigoroso#!"
 setting_strict_regional_heresy_desc:0 "Surto de Heresia em certas regiões serão sempre como as históricas."
 setting_strong_default_conquerors_frequency:0 "#high Padrão: Apenas Fortes#!"
 setting_strong_default_conquerors_frequency_desc:0 "A cada #V 5#! anos, há uma pequena chance de que [rulers|E] [Concept('independent', 'Independentes')|E] já poderosos, com um [realm_size|E] significativo e certos [traits|E] e [personalities|E], se tornem [ai_conquerors_personality|E] [conqueror_i]."
 setting_strong_few_conquerors_frequency:0 "#high Reduzido: Apenas Fortes#!"
 setting_strong_few_conquerors_frequency_desc:0 "A cada #V 5#! anos, há uma pequena chance de que [rulers|E] [Concept('independent', 'Independentes')|E] já poderosos, com um [realm_size|E] significativo e certos [traits|E] e [personalities|E], se tornem [ai_conquerors_personality|E] [conqueror_i]. A chance é reduzida em #V 50%#!."
 setting_strong_many_conquerors_frequency:0 "#high 100% Aumentado: Apenas Fortes#!"
 setting_strong_many_conquerors_frequency_desc:0 "A cada #V 5#! anos, há uma pequena chance de que [rulers|E] [Concept('independent', 'Independentes')|E] já poderosos, com um [realm_size|E] significativo e certos [traits|E] e [personalities|E], se tornem [ai_conquerors_personality|E] [conqueror_i]. A chance é aumentada em #V 100%#!."
 setting_strong_very_few_conquerors_frequency:0 "#high 90% Reduzido: Apenas Fortes#!"
 setting_strong_very_few_conquerors_frequency_desc:0 "A cada #V 5#! anos, há uma pequena chance de que [rulers|E] [Concept('independent', 'Independentes')|E] já poderosos, com um [realm_size|E] significativo e certos [traits|E] e [personalities|E], se tornem [ai_conquerors_personality|E] [conqueror_i]. A chance é reduzida em #V 90%#!."
 setting_struggle_iberia_toggle_off:0 "#high Desabilitado#!"
 setting_struggle_iberia_toggle_off_desc:0 "O [struggle|E] não é iniciado quando o jogo começa, significando que a Ibéria joga como qualquer outra parte normal do mapa."
 setting_struggle_iberia_toggle_on:0 "Habilitado"
 setting_struggle_iberia_toggle_on_desc:0 "Os muitos senhores da Ibéria começarão o jogo envolvidos em um [struggle|E], uma complexa dança de diferentes fatores que os empurram através da [struggle_phase|E] com regras de jogo variantes, até que alguém consiga uma conclusão dramática."
 setting_struggle_persia_toggle_off:0 "#high Desabilitado#!"
 setting_struggle_persia_toggle_off_desc:0 "O [struggle|E] não é iniciado quando o jogo começa, significando que a Pérsia, Afeganistão e Iraque jogam como qualquer outra parte normal do mapa."
 setting_struggle_persia_toggle_on:0 "Habilitado"
 setting_struggle_persia_toggle_on_desc:0 "Em 867, os governantes da Pérsia, Afeganistão e Iraque estarão envolvidos em um [struggle|E] climático para decidir o destino do Califado Abássida e o que resta do Império Árabe."
 setting_tibet_nomad_region_off:0 "Padrão"
 setting_tibet_nomad_region_off_desc:0 "A região do Tibete permanece inalterada."
 setting_tibet_nomad_region_on:0 "#high Nômade#!"
 setting_tibet_nomad_region_on_desc:0 "A região do Tibete utiliza mecânicas Nômades, projetadas para Nômades das Estepes. Esta regra não terá efeito a menos que você possua a expansão #V $DLC020_CE2$#!."
 setting_title_creation_imperial_power_projection_any_power_advantage:0 "#high Qualquer Vantagem de Poder#!"
 setting_title_creation_imperial_power_projection_any_power_advantage_desc:0 "Criar um [empire|E] requer um [strong_hook|E], [marriage|E] da [close_family|E] ou 50% mais tropas do que #BER cada#! [realm|E] de [title_tier|E] $game_concept_empire$ adjacente."
 setting_title_creation_imperial_power_projection_any_power_strict:0 "#high Qualquer Vantagem de Poder Estrita#!"
 setting_title_creation_imperial_power_projection_any_power_strict_desc:0 "Criar um [empire|E] requer um [strong_hook|E], [marriage|E] da [close_family|E] ou 50% mais tropas do que #BER cada#! [realm|E] de [title_tier|E] $game_concept_empire$ que faz fronteira com um [character|E] ou compartilha qualquer [de_jure|E] com eles."
 setting_title_creation_imperial_power_projection_hard_power_only:0 "#high Apenas Vantagem de Poder Duro#!"
 setting_title_creation_imperial_power_projection_hard_power_only_desc:0 "Criar um [empire|E] requer 50% mais tropas do que #BER cada#! [realm|E] de [title_tier|E] $game_concept_empire$ adjacente."
 setting_title_creation_imperial_power_projection_hard_power_only_strict:0 "#high Vantagem de Poder Duro Estrita#!"
 setting_title_creation_imperial_power_projection_hard_power_only_strict_desc:0 "Criar um [empire|E] requer 50% mais tropas do que #BER cada#! [realm|E] de [title_tier|E] $game_concept_empire$ que faz fronteira com um [character|E] ou compartilha qualquer [de_jure|E] com eles."
 setting_title_creation_imperial_power_projection_none:0 "Nenhum"
 setting_title_creation_imperial_power_projection_none_desc:0 "[empires|E] podem ser criados livremente por qualquer [character|E] que atenda aos seus requisitos."
 setting_title_creation_imperial_power_projection_soft_power_only:0 "#high Apenas Vantagem de Poder Brando#!"
 setting_title_creation_imperial_power_projection_soft_power_only_desc:0 "Criar um [empire|E] requer um [strong_hook|E] sobre ou [marriage|E] da [close_family|E] com #BER cada#! [realm|E] de [title_tier|E] $game_concept_empire$ adjacente."
 setting_title_creation_imperial_power_projection_targeting_ai_only:0 "Apenas IA"
 setting_title_creation_imperial_power_projection_targeting_ai_only_desc:0 "Restrições extras na criação de [titles|E] de [title_tier|E] [empire|E] se aplicarão apenas à IA."
 setting_title_creation_imperial_power_projection_targeting_both:0 "#high Qualquer um#!"
 setting_title_creation_imperial_power_projection_targeting_both_desc:0 "Restrições extras na criação de [titles|E] de [title_tier|E] [empire|E] se aplicarão a todos os [characters|E]."
 setting_title_creation_imperial_power_projection_targeting_player_only:0 "#high Apenas Jogador#!"
 setting_title_creation_imperial_power_projection_targeting_player_only_desc:0 "Restrições extras na criação de [titles|E] de [title_tier|E] [empire|E] se aplicarão apenas aos jogadores."
 setting_total_exclave_independence:0 "#high Total#!"
 setting_total_exclave_independence_desc:0 "Enclaves de governantes independentes em paz serão removidos na sucessão, a menos que estejam conectados via um caminho naval."
 setting_unholy_roman_empire_name_of_byzantium:0 "#high $e_unholy_roman_empire$#!"
 setting_unholy_roman_empire_name_of_byzantium_desc:0 "O nome $e_byzantium$ será alterado para $e_unholy_roman_empire$."
 setting_unrestricted_diplomatic_range:0 "[game_rule_unique_i|e] #high Irrestrito#!"
 setting_unrestricted_diplomatic_range_desc:0 "O alcance da Diplomacia é desligado, habilitando que ninguém no mapa possa interagir com ninguém."
 setting_unrestricted_dynasty_legacies_all:0 "Todos os Governantes"
 setting_unrestricted_dynasty_legacies_all_desc:0 "Todos os [rulers|E] podem visualizar e desbloquear todas as trilhas do [dynasty_perk|E], ignorando os requisitos normais culturais, governamentais e regionais. Os requisitos de DLC ainda se aplicam."
 setting_unrestricted_dynasty_legacies_default:0 "Padrão"
 setting_unrestricted_dynasty_legacies_default_desc:0 "As trilhas do [dynasty_perk|E] usam seus requisitos normais culturais, governamentais e regionais."
 setting_unrestricted_dynasty_legacies_player_only:0 "Somente Jogador"
 setting_unrestricted_dynasty_legacies_player_only_desc:0 "[rulers|E] controlados pelo jogador podem visualizar e desbloquear todas as trilhas do [dynasty_perk|E], ignorando os requisitos normais culturais, governamentais e regionais. Os requisitos de DLC ainda se aplicam."
 setting_very_easy_difficulty:0 "#high Muito Fácil#!"
 setting_very_easy_difficulty_desc:0 "Você receberá bônus significativos, como redução do impacto de doenças, conspirações hostis e estresse. Também será muito mais fácil lidar com facções."
 setting_very_few_conquerors_frequency:0 "#high 90% Reduzido#!"
 setting_very_few_conquerors_frequency_desc:0 "A cada #V 5#! anos, há uma pequena chance de que [rulers|E] [Concept('independent', 'Independentes')|E] com certos [traits|E] e [personalities|E] se tornem [ai_conquerors_personality|E] [conqueror_i]. A chance é reduzida em #V 90%#!."
 setting_very_hard_difficulty:0 "#high Muito Difícil#!"
 setting_very_hard_difficulty_desc:0 "Governantes controlados pela IA receberão bônus significativos, como menos estresse e domínios mais estáveis. @warning_icon! #X Isso tornará os domínios da IA extremamente estáveis e ricos, o que deixará o jogo menos equilibrado.#!"
 setting_very_relaxed_hybrid_culture_ai_restrictions:0 "#high Muito Relaxada#!"
 setting_very_relaxed_hybrid_culture_ai_restrictions_desc:0 "[hybrid_cultures|E] não criadas pelo jogador têm apenas restrições nominais."
