 game_rule.1141.a.aelfwine:0 "Eu nunca pedi por isso!"
 game_rule.1141.a.cadoc:0 "Mesmo quinhentos anos a partir de agora, eles conhecerão meu nome!"
 game_rule.1141.a.edgar:0 "Meu direito de nascimento, devolvido!"
 game_rule.1141.a.margaret:0 "A primeira Rainha da Inglaterra!"
 game_rule.1141.a.svend:0 "Eu sempre soube que acabaria assim."
 game_rule.1141.choice.aelfwine:0 "Possuído por alguma loucura arcana, o Witengamot implorou para que #EMP eu#! voltasse para casa e governasse o reino de meu pai e avô, rejeitando o herdeiro esperado [jiltee.GetFullNameNoTooltip].\n\nEu... eu não tinha ambição por isso. Não queria. Afastei-me do poder o máximo que pude, mas está claro que não há como escapar da vontade de [elect.GetFaith.HighGodNamePossessive] de que eu retorne às terras que deixei felizes para sempre."
 game_rule.1141.choice.cadoc:0 "Discutindo, como de costume, o Witengamot chegou a uma decisão curiosa. Indispostos a suportar outro rei estrangeiro e desconfiados uns dos outros, escolheram #EMP mim#! para governar a Inglaterra, pensando claramente que sou um fraco fantoche que podem moldar à sua vontade.\n\nTalvez estejam certos, talvez não, só posso acolher essa inesperada oportunidade para me provar!"
 game_rule.1141.choice.edgar:0 "Em um momento de competência não visto na política inglesa há muitos, muitos anos, o Witengamot decidiu reconhecer que #EMP eu#! sou o legítimo herdeiro de [GetScriptedCharacterByHistoryID( '114' ).GetTitledFirstNameNicknamedPossessive] e me nomeou para governar o reino, rejeitando o herdeiro esperado [jiltee.GetFullNameNoTooltip].\n\nNão posso dizer o que fiz para ganhar o favor de [ROOT.Char.GetFaith.FateGodNamePossessive] assim, mas estou extremamente feliz por ter conseguido."
 game_rule.1141.choice.margaret:0 "Por algum milagre confuso, o Witengamot concordou em #EMP comigo#! como um candidato de compromisso, rejeitando o herdeiro esperado [jiltee.GetFullNameNoTooltip]. Os grandes condes claramente acreditam que podem me controlar, pensando que sou algum fantoche para suas ambições.\n\nNão sou nada disso, mas acolho essa inesperada ascensão ao poder — afinal, sou o primogênito de meu pai."
 game_rule.1141.choice.svend:0 "Cansado da morte e destruição trazidas por todos os outros pretendentes, o Witengamot — sensatamente pela primeira vez — se voltou para #EMP mim#! como o próximo candidato mais natural para trazer ordem, rejeitando o herdeiro esperado [jiltee.GetFullNameNoTooltip].\n\nMais uma vez, a Dinamarca ocupará seu lugar natural governando sobre a Inglaterra."
 game_rule.1141.intro.battlefield:0 "[winner.GetTitledFirstName] pereceu no campo de batalha, morto lutando contra o pretendente usurpador [loser.GetTitledFirstNameNicknamed].\n\n"
 game_rule.1141.intro.home:0 "[winner.GetTitledFirstName] morreu inesperadamente, vítima de um ataque cardíaco ao receber a boa notícia da derrota de [loser.GetTitledFirstNameNicknamedPossessive].\n\n"
 game_rule.1141.t:0 "O Witengamot elege: [elect.GetFirstNameNoTooltip] de [elect.GetHouse.GetNameNoTooltip]"
 game_rule.1142.a:0 "Isso é um ultraje, o trono é meu!"
 game_rule.1142.b:0 "A vontade do conselho é adamante."
 game_rule.1142.c:0 "Tão perto de reinar, e ainda tão longe..."
 game_rule.1142.choice.aelfwine:0 "neto de [GetScriptedCharacterByHistoryID( '101510' ).GetTitledFirstNameNicknamed], que tem estado em exílio autoimposto como um pobre clérigo na Occitânia"
 game_rule.1142.choice.cadoc:0 "um nobre cornish de alguma linhagem indescritível"
 game_rule.1142.choice.edgar:0 "[GetScriptedCharacterByHistoryID( '114' ).GetTitledFirstNameNicknamedPossessive] sobrinho, o herdeiro escolhido antes de [winner.GetFirstNameNoTooltip] tomar o poder, e filho do errante [GetScriptedCharacterByHistoryID( '110' ).GetTitledFirstNameNicknamed]"
 game_rule.1142.choice.margaret:0 "[GetScriptedCharacterByHistoryID( '114' ).GetTitledFirstNameNicknamedPossessive] sobrinha-neta e filha do errante [GetScriptedCharacterByHistoryID( '110' ).GetTitledFirstNameNicknamed]"
 game_rule.1142.choice.preamble:0 "Contra todas as probabilidades, no lugar [winner.GetHerHim], o Witengamot escolheu eleger [elect.GetFirstName] de [elect.GetHouse.GetName] —"
 game_rule.1142.choice.svend:0 "[GetScriptedCharacterByHistoryID( '101505' ).GetTitledFirstNameNicknamedPossessive] neto e [elect.GetTitleAsNameNoTooltip] de [elect.GetPrimaryTitle.GetBaseNameNoTier], que optou por ficar de fora das fases iniciais do conflito"
 game_rule.1142.intro.battlefield:0 "[winner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] pereceu no campo de batalha, morto lutando contra o pretendente usurpador [loser.GetTitledFirstNameNicknamed].\n\n"
 game_rule.1142.intro.home:0 "[winner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] morreu inesperadamente, vítima de um ataque cardíaco ao receber a boa notícia da derrota de [loser.GetTitledFirstNameNicknamedPossessive].\n\n"
 game_rule.1142.outro:0 "— como o novo governante do reino em vez de #EMP mim#!.\n\nParece que a Inglaterra escorregou imediatamente de minhas mãos."
 game_rule.1142.t:0 "$game_rule.1141.t$"
 game_rule.4.a:0 "Só preciso de mais tempo!"
 game_rule.4.b:0 "Adeus, doce império..."
 game_rule.4.desc:0 "Não posso negar que meu amado império, o [falling_empire.GetBaseName], caiu, e caiu muito...\n\nEu mal controlo qualquer um de seus territórios tradicionais. Uma mera sombra de si mesmo, meu império está lentamente, mas seguramente, desaparecendo na obscuridade."
 game_rule.4.t:0 "Obscuridade do [falling_empire.GetBaseNameNoTooltip]"
