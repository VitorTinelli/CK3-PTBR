 give_sky_burial_vassals:0 "Cada Vassalo que acredita nos Enterros do Céu"
 go_on_hajj_decision:0 "Faça o Hajj"
 go_on_hajj_decision_confirm:0 "$go_on_pilgrimage_decision_confirm$"
 go_on_hajj_decision_desc:0 "#F O Hajj para Meca é um dos pilares da minha fé. Chegou a hora de eu cumprir o meu dever como Muçulmano.#!"
 go_on_hajj_decision_tooltip:0 "Faça uma [pilgrimage|E] a Meca, para cumprir seu dever com Alá"
