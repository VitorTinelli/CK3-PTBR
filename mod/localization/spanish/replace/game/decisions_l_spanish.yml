 major_decisions.3200.a:0 "E assim continua o governo do tirano [rightful_liege.GetCulture.GetNameNoTooltip]..."
 major_decisions.3200.b:0 "Para o bem de todos em [rightful_title.GetNameNoTierNoTooltip]."
 major_decisions.3200.desc:0 "Como [rightful_liege.Custom('GetQueenKing')|l] dos tronos de [rightful_title.GetNameNoTier] e [destroyed_title.GetNameNoTier], [rightful_liege.GetTitledFirstName] decidiu que é hora de governá-los ambos de [rightful_liege.GetCapitalLocation.GetTitle.GetNameNoTier].\n\nNão mais serão vistos os vassalos de [rightful_liege.GetHerHis] como duas pessoas governadas por um [rightful_liege.Custom('GetQueenKing')|l], mas sim como o povo de um único reino."
 major_decisions.3200.t:0 "[rightful_title.GetNameNoTierNoTooltip] como Um"
 major_decisions.3300.a:0 "Abraçarei os costumes antigos."
 major_decisions.3300.b:0 "Moldarei o império conforme minha visão."
 major_decisions.3300.desc:0 "Da terra salgada surge um novo império, restaurado à sua antiga glória. Em pouco tempo, os navios mercantes encherão os portos de riquezas e o domínio do Mar Mediterrâneo será nosso.\n\nOnde o grande Aníbal caiu em amarga derrota, eu me levantarei para reivindicar nosso legado. Mais uma vez o mundo conhecerá o verdadeiro poder de Cartago.\n\nMuito trabalho ainda precisa ser feito, mas por ora eu permaneço #EMP vitorioso! #!"
 major_decisions.3300.t:0 "O Ressurgimento de Cartago"
 major_decisions.3400.a:0 "Este é apenas o primeiro passo."
 major_decisions.3400.desc:0 "As proclamações do meu governo se espalham pelos vales de Carantânia até as montanhas brancas dos Alpes.\n\nMeu povo não será mais controlado por reis e imperadores estrangeiros, agora que a Casa [ROOT.Char.GetHouse.GetName] protege estas terras. Os antigos estandartes foram derrubados, e agora tudo que resta é o que realmente é nosso."
 major_decisions.3400.t:0 "Domínio Carantânico Restaurado"
 major_decisions.3500.a:0 "Pelo meu povo, e pela Casa [ROOT.Char.GetHouse.GetNameNoTooltip]!"
 major_decisions.3500.desc:0 "As colinas varridas pelo vento da Cumbria agora ecoam com a notícia: as terras renascem sob minha mão.\n\nPor tempo demais o povo sussurrou apenas sobre o que foi perdido; agora a Casa [ROOT.Char.GetHouse.GetName] dá voz novamente a esta terra. Que aqueles que outrora reivindicaram domínio sobre nós olhem para este reino e compreendam que nosso destino é novamente nosso."
 major_decisions.3500.t:0 "As Terras da Cumbria"
 major_decisions.3600.a:0 "Nós, Cossacos, viveremos livres sob céus infinitos."
 major_decisions.3600.b:0 "Eu governarei sobre eles, mas respeitarei os antigos costumes."
 major_decisions.3600.desc:0 "Por gerações, homens e mulheres livres, sejam aventureiros, exilados ou criminosos, encontraram seu caminho para as estepes do Cáspio.\n\nÀs vezes chamados de 'Kazak', viveram segundo suas próprias leis. No entanto, os Cumans mantiveram esses homens livres sob seu domínio, controlando as estepes. Os [founder_culture.GetCollectiveNoun] sob meu governo veem esses Kazak como parentes, e a cada dia recebemos mais deles em nosso meio.\n\nTalvez seja hora de abraçarmos um novo destino juntos?"
 major_decisions.3600.t:0 "Ascensão dos Cossacos"
 meditate_in_seclusion_decision:0 "Medite em Reclusão"
 meditate_in_seclusion_decision_confirm:0 "Medite em Reclusão"
 meditate_in_seclusion_decision_desc:0 "Apenas através da meditação podemos chegar a entender a verdadeira natureza do universo.\n\nEmbora isso signifique negligenciar minhas outras responsabilidades, recuando para a reclusão para a meditação, posso aprender mais sobre mim e no universo que eu habito."
 meditate_in_seclusion_decision_tooltip:0 "Afaste-se da vida pública para se concentrar em seu eu interior"
 meditate_in_seclusion_tooltip:0 "Você pode perder [stress|E], ganhar [traits|E], ou mesmo aumentar a sua habilidade de [learning|E]"
 mend_the_great_schism_decision:0 "Consertar a Grande Cisma"
 mend_the_great_schism_decision_confirm:0 "Um Deus, Uma Igreja!"
 mend_the_great_schism_decision_desc:0 "A Grande Cisma separou a Igreja Cristã e dividiu em duas partes, mas se todas as cinco Sedes Episcopais da Pentarquia pudessem ser restauradas sob o governo de um único Império sob a liderança iluminada de um governante santo, pode haver uma chance de finalmente reunir a Cristandade."
 mend_the_great_schism_decision_effect_tooltip:0 "A Igreja [THIS.Char.GetFaith.GetAdjective] consertará o Cisma e se estabelecerá como o único ramo legítimo do Cristianismo."
