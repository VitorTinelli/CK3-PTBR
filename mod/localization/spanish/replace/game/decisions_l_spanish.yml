 form_cumbria_decision:0 "Formar o Reino da Cumbria"
 form_cumbria_decision_confirm:0 "Cumbria para os Cumbrianos"
 form_cumbria_decision_de_jure_duchy:0 "[GetTitleByKey('d_cumbria').GetName] torna-se senhor [de_jure|E] de [GetTitleByKey('c_westmorland').GetName], [GetTitleByKey('c_cumberland').GetName] e [GetTitleByKey('c_annandale').GetName]"
 form_cumbria_decision_desc:0 "É hora de que o povo da Cumbria esteja sob o governo de sua própria gente, em vez dos invasores do sul e do norte."
 form_cumbria_decision_house_modifier:0 "Governantes da Cumbria"
 form_cumbria_decision_house_modifier_desc:0 "Governantes comprovados do povo da Cumbria, respeitados e honrados por toda a região.\n\n"
 form_cumbria_decision_tooltip:0 "Forme um reino verdadeiro para os cumbrianos"
 form_dai_viet_empire_decision:0 "Fundar o Império Viet"
 form_dai_viet_empire_decision_confirm:0 "Eu sou o Imperador do Sul!"
 form_dai_viet_empire_decision_desc:0 "Um dia, os nortistas tremerão diante do nobre povo que antes desprezaram como bandidos dependentes. Eu juro uni-los sob uma única bandeira."
 form_dai_viet_empire_decision_effects_de_jure_tt_a:0 "Se mantidos, os seguintes [kingdoms|E] se tornarão parte [de_jure|E] de [vietnamese_dai_viet_empire.GetName]:\n[vietnamese_viet.GetName], [vietnamese_champa.GetName]"
 form_dai_viet_empire_decision_effects_de_jure_tt_b:0 "Se mantidos, os seguintes [duchies|E] se tornarão parte [de_jure|E] de [vietnamese_viet.GetName]:\n[vietnamese_d_hai_dong.GetNameNoTier], [vietnamese_d_lam_tay.GetNameNoTier], [vietnamese_d_nghe_an.GetNameNoTier], [vietnamese_hai_dong.GetNameNoTier]"
 form_dai_viet_empire_decision_effects_de_jure_tt_c:0 "Se mantidos, os seguintes [duchies|E] se tornarão parte [de_jure|E] de [vietnamese_champa.GetName]:\n[vietnamese_d_indrapura.GetNameNoTier], [vietnamese_d_vijaya.GetNameNoTier], [vietnamese_d_baigaur.GetNameNoTier]"
