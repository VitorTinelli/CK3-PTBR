 minor_decisions.0002.desc:0 "[claimant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] atendeu ao meu chamado e chegou à corte como meu convidado"
 minor_decisions.0002.t:0 "O requerente chegou"
 minor_decisions.0003.a:0 "Claro! Bem-vindo à nobreza, [barrel_character.GetNameNoTooltip]!"
 minor_decisions.0003.b:0 "Apenas o ofício de execução convém a esta #EMP criatura#!."
 minor_decisions.0003.c:0 "[ROOT.Char.GetFaith.HighGodName], traga-me outra pessoa!"
 minor_decisions.0003.d:0 "Uhhh, ainda não estamos tão desesperados..."
 minor_decisions.0003.desc.bride_2:0 "foi-me trazido à atenção que [barrel_character.GetSheHe] é habilidoso"
 minor_decisions.0003.desc.bridge_1:0 "\n\nApesar da aflição [barrel_character.GetHerHim], "
 minor_decisions.0003.desc.charismatic:0 "diplomata com habilidades na língua [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] que rivalizam com as de qualquer nobre! A sua carismática subversão e aparência incomum sem dúvida chamarão a atenção de qualquer nobre estrangeiro visitando minha corte."
 minor_decisions.0003.desc.criminal:0 "Este miserável foi arrastado das masmorras; preso por crimes indizíveis contra a coroa, esperando por perdão em troca de suas habilidades."
 minor_decisions.0003.desc.criminal_bridge:0 "\n\nEmbora [barrel_character.GetSheHe] seja um traidor culpado,"
 minor_decisions.0003.desc.cunning:0 "golpista, fazendo fortuna enganando os habitantes locais. Sua astúcia e habilidade manual seriam úteis ao meu lado, ouvindo os muitos sussurros que circulam na corte e fazendo justiça àqueles que prejudicam a Coroa."
 minor_decisions.0003.desc.diseased:0 "Diante de mim está um camponês doente coberto de sujeira, vômito seco e um olhar em seus olhos escassos de consciência."
 minor_decisions.0003.desc.educated:0 "erudito, de alguma forma educado na linguagem escrita apesar de sua baixa posição na vida. Sinto que [barrel_character.GetNameNoTooltip] serviria bem à corte em assuntos de religião, erudição ou saúde."
 minor_decisions.0003.desc.ewan:0 "O que sou forçado a ver é um pesadelo maligno de um[Select_CString( barrel_character.IsFemale, 'a', '' )] [barrel_character.GetWomanMan], mal parecendo um ser humano. A criatura miserável está tão doente, malformada e machucada que é um ato de bruxaria que [barrel_character.GetSheHe] ainda consiga ficar em pé!"
 minor_decisions.0003.desc.maimed:0 "[Select_CString( barrel_character.IsFemale, 'A', 'O' )] [barrel_character.GetWomanMan] parece ter visto mais do que sua justa parcela de conflitos e crueldades neste mundo e carrega as lembranças de cada punho e lâmina que a derrubou."
 minor_decisions.0003.desc.opening:0 "Minha busca por [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] trouxe [barrel_character.GetName] para me ver!"
 minor_decisions.0003.desc.organised:0 "mercador com compreensão de finanças e organização muito acima do que eu esperaria de um camponês comum. Sem dúvida, est[Select_CString( barrel_character.IsFemale, 'a', 'e' )] [barrel_character.GetWomanMan] é desperdiçada como uma plebeia e foi escolhida por [ROOT.Char.GetFaith.HighGodName] para ser elevada à nobreza e servir-me na corte."
 minor_decisions.0003.desc.outro:0 "Meu conselho determinou o papel que melhor se adequa a [barrel_character.GetNameNoTooltip], a única questão que resta é se estou realmente disposto a prosseguir com isso ou não."
 minor_decisions.0003.desc.physical:0 "O que vejo diante de mim é um camponês de aparência incomum, olhando para mim com choque e admiração como se eu fosse o próprio [ROOT.Char.GetFaith.HighGodName]. Claramente, as condições de seu nascimento causaram a ele dor e ostracismo pelos camponeses de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 minor_decisions.0003.desc.strong:0 "líder, vencendo inúmeras escaramuças e liderando seu grupo de bandidos de ataque em ataque. Sem dúvida, [barrel_character.GetSheHe] é desperdiçada rolando na lama e no sangue cometendo pequenos furtos no campo e deve, em vez disso, vestir as roupas reais e se juntar à minha fina corte!"
 minor_decisions.0003.t:0 "Raspando o fundo do tacho"
