 zoroastrian_restore_high_priesthood_decision:0 "Restaurar o [ROOT.Char.GetFaith.AltPriestTermPlural]"
 zoroastrian_restore_high_priesthood_decision_confirm:0 "Estabeleça um novo chefe religioso"
 zoroastrian_restore_high_priesthood_decision_desc:0 "Desde a queda do Império Sassânida e o advento do domínio muçulmano, o verdadeiro sacerdócio [ROOT.Char.GetFaith.GetAdjective] tem definhou no obscuro. É hora de pôr fim a essa vergonha, acender os fogos sagrados por toda nossa terra e trazer o [ROOT.Char.GetFaith.AltPriestTermPlural] de volta ao destaque como os leais aliados de um [ROOT.Char.GetTitleTierName] legítimo."
 zoroastrian_restore_high_priesthood_decision_effect_tooltip:0 "O sacerdócio [THIS.Char.GetFaith.GetAdjective] é estabelecido"
