 form_switzerland_kingdom_decision:0 "Forme a Confederação Suíça"
 form_switzerland_kingdom_decision_confirm:0 "Nossas reivindicações não podem ser negadas!"
 form_switzerland_kingdom_decision_desc:0 "Se todos os Cantões Alpinos forem reunidos, o Império terá que reconhecer sua reivindicação como uma Confederação unificada."
