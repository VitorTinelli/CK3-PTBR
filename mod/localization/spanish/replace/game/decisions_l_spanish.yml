 bwow_esotericism_desc:0 "Nossas raízes pagãs têm se expressado como um conjunto de práticas espirituais esotéricas"
 bwow_esotericism_tooltip:0 "Sua fé se tornará mais justa e mística"
 bwow_fundementalist:0 "Fundamentalismo"
