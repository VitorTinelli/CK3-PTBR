 form_portugal_decision:0 "Formar Portugal"
 form_portugal_decision_confirm:0 "Formar Portugal"
 form_portugal_decision_desc:0 "Assim que eu tiver controle da costa oeste da Península Ibérica, poderei formar o Reino de Portugal e estabelecer nossa própria cultura única."
 form_portugal_decision_effects_de_jure_tt:0 "[title_d_porto.GetNameNoTier], [title_d_coimbra.GetNameNoTier], [title_d_beja.GetNameNoTier] e [title_d_algarve.GetNameNoTier] se tornam parte [de_jure|E] de #V [title_k_portugal.GetName]#! "
