 court_already_has_a_fashion_tend_tt:0 "A corte já possui uma tendência de moda em andamento."
 court_amenities_interactions.0010.a.tt_failure:0 "A multidão discorda de você e acha que a roupa de [actor.GetNamePossessiveNoTooltip] é a nova tendência da moda."
 court_amenities_interactions.0010.a.tt_success:0 "Você convence a multidão de que a roupa de [actor.GetNamePossessiveNoTooltip] é estúpida."
 court_amenities_interactions.0010.a:0 "\"Que #EMP está# usando?\""
 court_amenities_interactions.0010.a_flag_big_collar:0 "\"Você parece um pássaro que engoliu um prato!\""
 court_amenities_interactions.0010.b:0 "Morder meu lábio e tentar não rir."
 court_amenities_interactions.0010.b_turned_down:0 "Todos adoram o novo estilo!"
 court_amenities_interactions.0010.desc.flag_big_collar:0 "[actor.GetSheHe|U] usou uma roupa adornada com uma gola com circunferência de uma roda de carro."
 court_amenities_interactions.0010.desc.flag_commoner_clothes:0 "[actor.GetSheHe|U] entrou em [debate_locale.GetNameNoTierNoTooltip] vestindo roupas de um camponês de baixa classe."
 court_amenities_interactions.0010.desc.flag_gold_boots:0 "[actor.GetSheHe|U] andou pesadamente pelo grande salão de [debate_locale.GetNameNoTierNoTooltip], suas botas sólidas de metal adornadas com incrustações de ouro praticamente dividindo o chão com seu peso tremendo."
 court_amenities_interactions.0010.desc.flag_head_dress:0 "[actor.GetSheHe|U] está usando um adereço de cabeça tradicional inclinado para um lado da cabeça em uma zombaria retorcida da cultura [actor.GetCulture.GetName]."
 court_amenities_interactions.0010.desc.flag_sleeveless:0 "[actor.GetSheHe|U] removeu as mangas de suas roupas nobres."
 court_amenities_interactions.0010.desc_intro:0 "[actor.GetNameNoTooltip|U] entrou na corte, chamando a atenção de todos os senhores e damas do reino com suas vestimentas peculiares."
 court_amenities_interactions.0010.desc_outro:0 "e ousou declarar isso como a última moda no reino! Todos os tolos da corte parecem estar se rendendo a isso, mas devo levantar minha mão para acabar com essa loucura?"
 court_amenities_interactions.0010.t:0 "Uma Nova Moda na Corte"
 court_amenities_interactions.0011.a_lost:0 "Eles simplesmente não me #EMP entendem#!"
 court_amenities_interactions.0011.a_won:0 "Eu sempre sei o que é melhor!"
 court_amenities_interactions.0011.desc.flag_big_collar:0 "minhas vestes adornadas com uma enorme gola redonda para todos admirarem."
 court_amenities_interactions.0011.desc.flag_commoner_clothes:0 "questionando por que a nobreza deve se vestir tão diferente dos plebeus quando a simplicidade é tão elegante."
 court_amenities_interactions.0011.desc.flag_gold_boots:0 "minhas pesadas botas douradas cintilando na luz do salão de [debate_locale.GetNameNoTierNoTooltip]."
 court_amenities_interactions.0011.desc.flag_head_dress:0 "minha habitual tiara inclinada para um lado da minha cabeça, trazendo algo novo e fresco a um item de vestuário, de outra forma, velho e sem graça."
 court_amenities_interactions.0011.desc.flag_sleeveless:0 "minha nova vestimenta sem mangas, exibindo meus braços para todos verem!"
 court_amenities_interactions.0011.desc_bridge:0 "[recipient.Custom2('MyCharacterIntroduction', ROOT.Char)] grita para mim de outro lado do salão. \n\nNós trocamos insultos, eu defendendo o que é, obviamente, uma moda muito acima da cabeça de uma mente simples."
 court_amenities_interactions.0011.desc_intro:0 "Eu ando de um lado para o outro em minha corte, orgulhoso da minha nova e ousada declaração de moda à frente do seu tempo,"
 court_amenities_interactions.0011.desc_lost:0 "Enquanto a nobreza de [debate_locale.GetNameNoTierNoTooltip] rapidamente se junta a [recipient.GetNameNoTooltip] em zombar da minha roupa, sei que minha declaração de moda é cruelmente subvalorizada em seu próprio tempo."
 court_amenities_interactions.0011.desc_won:0 "Enquanto a nobreza local se reúne ao meu redor, posso considerar minha declaração de moda um sucesso retumbante!"
 court_amenities_interactions.0011.t:0 "De Moda e Rivalidade"
 court_amenities_interactions.0012.a_lost:0 "Estou cercado de bajuladores e tolos!"
 court_amenities_interactions.0012.desc_intro:0 "\"Bem, alguns de nós são seguidores e outros líderes.\" [actor.GetNameNoTooltip] mantém firme em seu compromisso com aquela roupa ridícula.\n\nPassamos as próximas horas debatendo a natureza da alta moda, com uma pequena multidão de cortesãos assistindo enquanto eu lanço insulto após insulto neste tolo."
 court_amenities_interactions.0012.desc_lost.kof:0 "Não apenas isso, mas muitos passaram a se referir a [actor.GetSheHe] como [Select_CString( actor.IsFemale, 'a', 'o' )] \"[actor.GetTitleAsNameNoTooltip] da Moda.\""
 court_amenities_interactions.0012.desc_lost:0 "Infelizmente, a multidão não parecia ter sido persuadida pelos meus argumentos e, dentro de dias, eu sou a única na corte #EMP que não#! se veste como [actor.GetNameNoTooltip]."
 court_amenities_interactions.0012.desc_won:0 "Em pouco tempo, muitos outros cortesãos começam a se juntar a mim para zombar de [actor.GetNameNoTooltip], e eu sei que meu trabalho está feito."
 court_amenities_interactions.0013.a:0 "Viva [Select_CString( actor.IsFemale, 'a', 'o' )] [actor.GetTitleAsNameNoTooltip]!"
 court_amenities_interactions.0013.desc:0 "Com o tempo, muitos em [debate_locale.GetNameNoTierNoTooltip] começaram a me chamar de [actor.GetTitleAsNameNoTooltip] da Moda!"
