 accept_cannibalism_decision_desc:0 "Nosso criador [ROOT.Char.GetFaith.CreatorName] nós fez a sua imagem. Ao absorver o reflexo do divino, nos aproximamos de [ROOT.Char.GetFaith.HighGodNameAlternate]."
