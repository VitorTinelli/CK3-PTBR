 form_rum_sultanate_decision_tooltip:0 "Estabeleça o Sultanato de Rum independente."
 form_ryukyu_empire_decision:0 "Fundar um Império Ryukyuano"
 form_ryukyu_empire_decision_confirm:0 "Pelas Três Montanhas!"
 form_ryukyu_empire_decision_desc:0 "Unirei os clãs Ryukyu e colocarei fim às suas disputas inúteis. Focando em um futuro mais brilhante juntos, nos tornaremos uma potência influente e respeitada; uma força a ser reconhecida."
 form_ryukyu_empire_decision_effects_de_jure_tt_a:0 "Se possuído, [ryukyuan_ruucuu_kingdom.GetName] se tornará parte [de_jure|E] de [ryukyuan_ruucuu_empire.GetName]"
 form_ryukyu_empire_decision_effects_de_jure_tt_b:0 "Se possuído, [ryukyuan_ruucuu_duchy.GetName] se tornará parte [de_jure|E] de [ryukyuan_ruucuu_kingdom.GetName]"
 form_ryukyu_empire_decision_tooltip:0 "Ruucuu se torna um [empire|E] [de_jure|E]"
 form_siam_kingdom_decision:0 "Fundar o Reino de Sião"
 form_siam_kingdom_decision_confirm:0 "Pela terra dos livres!"
 form_siam_kingdom_decision_desc:0 "Após séculos de peregrinação, acredito que meu povo finalmente encontrou um lugar para chamar de lar, firmes entre as tribos da terra e do mar. Eles só precisam de um governante confiável para alcançar seu potencial."
 form_siam_kingdom_decision_effects_de_jure_tt_a:0 "Se possuídos, [sukhotai_duchy.GetNameNoTier] e [lop_buri_duchy.GetNameNoTier] se tornarão parte [de_jure|E] de [siam_kingdom.GetName]"
