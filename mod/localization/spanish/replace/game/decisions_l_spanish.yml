 form_brunei_kingdom_decision_confirm:0 "Prepare a khutbah em meu nome"
 form_brunei_kingdom_decision_desc:0 "Nosso povo esteve envolvido por muito tempo em práticas pagãs sombrias. Devo estabelecer a ordem do Profeta e iluminar as ovelhas perdidas, guiando-as de volta ao caminho reto do Sempre-Vivo, para que não se desviem novamente."
