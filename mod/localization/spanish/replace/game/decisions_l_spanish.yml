 form_rum_sultanate_decision:0 "Forme o Sultanato de Rum"
 form_rum_sultanate_decision_confirm:0 "Uma nova, Roma [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]!"
 form_rum_sultanate_decision_desc:0 "Ao trazer o coração Romano a Ásia Menor sob o controle [ROOT.Char.GetFaith.GetAdjective], vamos criar uma nova e melhor Roma sob a luz orientadora de [ROOT.Char.GetFaith.HighGodName]."
