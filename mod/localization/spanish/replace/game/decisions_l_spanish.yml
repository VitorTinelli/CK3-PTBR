 appoint_a_righteous_caliph_decision.tt.you_become_caliph:0 "Você se torna o novo [head_of_faith|E]"
 appoint_a_righteous_caliph_decision:0 "Nomear um Califa Justo"
 appoint_a_righteous_caliph_decision_confirm:0 "Sou guiado por [ROOT.Char.GetFaith.PositiveAfterLife|U]!"
 appoint_a_righteous_caliph_decision_desc:0 "[ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] é uma figura distante e indigna, mal preparada para liderar a Ummah. Sendo [ROOT.Char.GetFaith.GetReligiousHead.GetFaith.GetAdjective], [ROOT.Char.GetFaith.GetReligiousHead.GetSheHe] simplesmente não #EMP entende#! muitas das sutis verdades do pensamento [ROOT.Char.GetFaith.GetAdjective].\n\n[ROOT.Char.GetFaith.GetReligiousHead.GetSheHe|U] pode não, mas #EMP eu#! sim..."
 appoint_a_righteous_caliph_decision_general_iranian_variant:0 "Rompimento com o Califado"
 appoint_a_righteous_caliph_decision_general_iranian_variant_desc:0 "Embora o Islã tenha sido trazido à Pérsia pela força, ninguém pode negar nossa crença na Unicidade de [ROOT.Char.GetFaith.HighGodNameAlternate]. Mas nossos caminhos e os caminhos árabes se distanciaram e devemos romper com [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] de uma vez por todas. Doravante, eu liderarei pessoalmente os [ROOT.Char.GetFaith.GetAdjective]."
 appoint_a_righteous_caliph_decision_maliki_variant:0 "Restaurar a Escola Maluqui"
 appoint_a_righteous_caliph_decision_maliki_variant_desc:0 "Os estudiosos da escola maluqui têm sido por muito tempo os guardiões da tradição, mantendo as práticas do povo de Medina como o caminho mais verdadeiro. Contudo, os aspirantes a califa negligenciaram nossos caminhos. Tomarei para mim a tarefa de restaurar a jurisprudência maluqui ao seu devido lugar no coração do pensamento islâmico."
 appoint_a_righteous_caliph_decision_mutazila_variant:0 "Restaurar Mu'tazila"
 appoint_a_righteous_caliph_decision_mutazila_variant_desc:0 "Desde o fim da Mihna, aqueles que defendem a criação do Alcorão têm sido perseguidos ou negligenciados pelos supostos califas. Eu tomarei para mim a vingança pelos desrespeitos que sofremos e mais uma vez colocarei a doutrina Mu'tazila no centro do pensamento islâmico."
 appoint_a_righteous_caliph_decision_tooltip:0 "Levar o [ROOT.Char.GetFaith.GetNameNoTooltip] para longe do caminho [ROOT.Char.GetFaith.GetReligiousHead.GetFaith.GetAdjectiveNoTooltip]"
 assimilate_local_traditions_decision:0 "Adotar as tradições locais"
 assimilate_local_traditions_decision_confirm:0 "Vamos nos adaptar"
 assimilate_local_traditions_decision_desc:0 "Embora a aventura esteja sempre em nosso sangue, reconhecemos que estamos longe de nosso lar escandinavo frígido. As tradições locais adequam-se bem ao seu povo, eles são mestres de sua terra e seus deuses são fortes - respeitamos isso. Com o tempo, nos tornaremos como eles."
 assimilate_local_traditions_decision_tooltip:0 "Converta você e todos os seus [vassals|E] nórdicos para a [culture|E] e [faith|E] da sua [capital|E]"
 at_least_10_jewish_counties_tt:0 "Você deve controlar pelo menos 10 [counties|E] judaicos da sua [culture|E]"
 avenge_the_battle_of_tours_decision:0 "Vingar a Batalha de Tours"
 avenge_the_battle_of_tours_decision_confirm:0 "Vingar a Batalha de Tours"
 avenge_the_battle_of_tours_decision_desc:0 "Em 732, as forças Umayyad foram derrotadas pelos Francos na estrada para Tours. Se as coisas tivessem sido diferentes, toda a Europa estaria sob o domínio muçulmano hoje.\n\nEu vingarei nossos mártires caídos e tornarei seu sonho realidade."
 avenge_the_battle_of_tours_decision_tooltip:0 "Marche pela Estrada dos Mártires e corrija as injustiças"
 become_saoshyant_decision:0 "Torne-se o Saoshyant"
 become_saoshyant_decision_confirm:0 "Eu sou um!"
 become_saoshyant_decision_decendant_trait_tooltip:0 "Seus descendentes ganharão a [trait|E] [GetTrait('saoshyant_descendant').GetName( GetNullCharacter )|LV]"
 become_saoshyant_decision_desc:0 "Ao expulsar os Muçulmanos e restaurar o domínio Zoroastriano sobre todo o Império Persa, um governante piedoso pode ser reconhecido como o profetizado Saoshyant de Zoroastro — salvador escolhido do mundo."
 become_saoshyant_decision_effect_tooltip:0 "Torne-se o Saoshyant"
 become_saoshyant_decision_tooltip:0 "Torne-se o Saoshyant."
 black_sea_coast_region:0 "Mar Negro"
 borrow_from_holy_order_decision:0 "Peça ouro da Ordem Sagrada"
 borrow_from_holy_order_decision_confirm:0 "Escreva as perguntas!"
 borrow_from_holy_order_decision_desc:0 "Estou precisando de dinheiro, e quem melhor para pedir ajuda do que os servos de [ROOT.Char.GetFaith.HighGodName]? Posso enviar cartas, e espero obter uma resposta."
 borrow_from_holy_order_decision_effect_tooltip:0 "Você pede emprestado [SCOPE.ScriptValue('holy_order_gold_value')|P00] [gold|E][gold_i] a partir de uma [holy_order|E]\n\n@warning_icon! A [holy_order|E] começará a fazer demandas se você não pagar o empréstimo\n@warning_icon! Você não pode pedir mais dinheiro emprestado novamente até que tenha pago este empréstimo"
