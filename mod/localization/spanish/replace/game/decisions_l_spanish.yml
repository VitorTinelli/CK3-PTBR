 unify_burgundy_kingdom_decision:0 "Unifique a Borgonha"
 unify_burgundy_kingdom_decision_confirm:0 "Deixe o reino ser inteiro novamente!"
 unify_burgundy_kingdom_decision_desc:0 "Desde que caíram sob o domínio Franco, as terras dos Borgonheses foram fragmentadas, divididas por Reis estrangeiros. Se todos os Burgundies estivessem unidos sob a mesma bandeira, eles poderiam finalmente reivindicar seu lugar como um poder soberano na Europa."
 unify_burgundy_kingdom_decision_effect_tooltip:0 "O Reino da Borgonha é restaurado e recupera sua independência"
 unify_burgundy_kingdom_decision_tooltip:0 "O Reino da Borgonha é restaurado e recupera sua independência."
 unify_italian_empire_decision:0 "Unificar Itália"
 unify_italian_empire_decision_confirm:0 "A península será unificada"
 unify_italian_empire_decision_desc:0 "Se as disputas de cidades-estado e os reinos bárbaros da Itália forem trazidos mais uma vez sob o domínio imperial, toda a península recuperará sua dignidade e poder."
 unify_italian_empire_decision_effect_tooltip:0 "Sicília e Croácia são trazidas de volta ao [de_jure|E] de Itália"
 unify_italian_empire_decision_tooltip:0 "Sicília e Croácia são trazidas de volta ao [de_jure|E] de Itália."
 unisolate_capital_decision:0 "Encerrar Isolamento da Capital"
 unisolate_capital_decision_confirm:0 "$unisolate_capital_decision$"
 unisolate_capital_decision_desc:0 "Seja a praga tiver diminuído ou não, o impacto do isolamento está se mostrando muito grande e as portas devem ser destrancadas mais uma vez."
 unisolate_capital_decision_tooltip:0 "Encerrar as medidas de isolamento em sua [capital|E], diminuindo sua [epidemic_resistance|E]"
 unisolate_capital_decision_tt:0 "Sua capital deve estar atualmente isolada"
 unisolate_family_decision:0 "Emergir da Seclusão"
 unisolate_family_decision_confirm:0 "$unisolate_family_decision$"
 unisolate_family_decision_desc:0 "Não posso mais governar de longe, é imperativo que eu saia da seclusão e retorne ao meu lugar legítimo na capital."
 unisolate_family_decision_tooltip:0 "Você e seus [close_family_members|E] deixarão de se isolar"
 unisolate_family_disaster_decision:0 "Sair do Refúgio"
 unisolate_family_disaster_decision_confirm:0 "$unisolate_family_disaster_decision$"
 unisolate_family_disaster_decision_desc:0 "Não posso mais governar de longe, é imperativo que eu saia deste refúgio e retorne ao meu assento legítimo."
 unisolate_family_disaster_decision_tooltip:0 "Você e seus [close_family_members|E] deixarão a segurança do refúgio"
 unite_africa_decision:0 "Unir a África"
 unite_africa_decision_ancestors_desc:0 "Por tempo demais, nossas belas terras foram exploradas por invasores estrangeiros. Chegou a hora de unir os povos africanos e voltar ao caminho de nossos Antepassados."
 unite_africa_decision_confirm:0 "Unir a África"
 unite_africa_decision_generic_desc:0 "Os povos da África são orgulhosos, corajosos e fortes. No entanto, muitos são enganados e adoram falsos deuses. Chegou a hora de unir todos eles sob [ROOT.Char.GetFaith.HighGodName]."
 unite_africa_decision_spirits_desc:0 "Por tempo demais, os espíritos de nossas belas terras foram desrespeitados por infiéis estrangeiros. Chegou a hora de unir os povos africanos sob [ROOT.Char.GetFaith.HighGodName]."
 unite_africa_decision_tooltip:0 "Reunir os povos africanos em nome de [ROOT.Char.GetFaith.HighGodName]"
 unite_the_slavs_decision:0 "Unir os Eslavos"
 unite_the_slavs_decision_confirm:0 "Fundar a Slavia"
 unite_the_slavs_decision_desc:0 "Se todos os povos Eslavos se unirem, não haverá ninguém que possa nos parar. Eu trarei o mais poderoso império que o mundo já conheceu!"
 unite_the_slavs_decision_effects_innovations_tt:0 "Todas as culturas Eslavas em seu reino descobrirão até 3 [innovations|E] de outras culturas Eslavas"
 unite_the_slavs_decision_titles_tt:0 "Cada [title|E] de reino eslavo se tornará [de_jure|E] do [slavia.GetName]"
 unite_the_slavs_decision_tooltip:0 "Unir os povos Eslavos e fundar o [empire|E] da Slavia"
 unite_the_southern_slavs_decision:0 "Unir os Eslavos do Sul"
 unite_the_southern_slavs_decision_confirm:0 "Unir os Eslavos do Sul"
 unite_the_southern_slavs_decision_desc:0 "Éramos um povo quando chegamos a estas terras. Com o tempo, nos espalhamos e dividimos em muitas tribos.\n\nAgora, estamos cercados por poderosos Impérios com costumes estranhos. Devido à influência deles, nossa própria forma de vida está desaparecendo lentamente. Não podemos permitir que isso aconteça - chegou a hora de nos unir novamente."
 unite_the_southern_slavs_decision_titles_tt:0 "Cada [title|E] de reino eslavo do sul que você possua (exceto seu [primary_title|E]) será destruído e seus territórios se tornarão [de_jure|E] do seu Título Primário ([THIS.Char.GetPrimaryTitle.GetNameNoTier])"
 unite_the_southern_slavs_decision_tooltip:0 "Unir os Eslavos do Sul sob um único governante"
 unite_the_spanish_thrones_decision:0 "Unir os Tronos Espanhóis"
 unite_the_spanish_thrones_decision_confirm:0 "Unir os Tronos"
 unite_the_spanish_thrones_decision_desc:0 "Os Tronos Espanhóis serão unidos novamente, desta vez sob a bandeira do [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 unite_the_spanish_thrones_decision_primary:0 "Seu [primary_title|E] é um [kingdom|E] Ibérico"
 unite_the_spanish_thrones_decision_titles_tt:0 "Todos os seus [titles|E] de [kingdom|E] espanhol (exceto seu [primary_title|E]) serão destruídos e seus territórios se tornarão [de_jure|E] de seu Título Primário ([THIS.Char.GetPrimaryTitle.GetNameNoTier])"
 unite_the_spanish_thrones_decision_tooltip:0 "Os Tronos Espanhóis serão unidos novamente"
 unite_the_western_slavs_decision:0 "Unir os Eslavos Ocidentais"
 unite_the_western_slavs_decision_confirm:0 "Unir os Eslavos Ocidentais"
 unite_the_western_slavs_decision_desc:0 "Éramos um só povo quando chegamos a estas terras. Com o passar dos anos, nos dispersamos, dividindo-nos em muitas tribos. Com forças estrangeiras à nossa porta, é hora de nos unirmos novamente."
 unite_the_western_slavs_decision_titles_empire_tt:0 "Cada [kingdom|E] eslavo ocidental receberá o [de_jure|E] de suas terras pelo seu [primary_title|E]"
 unite_the_western_slavs_decision_titles_tt:0 "Você receberá o [title|E] $e_west_slavia$"
 unite_the_western_slavs_decision_tooltip:0 "Unir os Eslavos Ocidentais sob um só governante"
 unite_the_western_slavs_decision_tt_1:0 "Seu Título Primário é o Reino da Polônia, Pomerânia, Sorbia, Boêmia ou Grande Morávia"
 unite_the_western_slavs_decision_tt_2:0 "Você é um Imperador e possui o Reino da Polônia, Pomerânia, Sorbia, Boêmia ou Grande Morávia"
 unlocks_black_sea_naval_conquest:0 "Desbloqueia o [casus_belli|E] #emp Expansão de Condado#! e #emp Expansão Naval de Condado#! na [region|E] do [GetGeographicalRegion('black_sea_coast_region').GetName] durante a duração do [modifier|E] da [house|E]"
 write_muwashshah_poem_decision:0 "Escrever Poema Muwashshah"
 write_muwashshah_poem_decision_confirm:0 "Vamos trabalhar"
 write_muwashshah_poem_decision_desc:0 "Com todas as grandes mentes que mantenho ao meu redor, escrever um novo poema no popular estilo Muwashshah seria bastante simples. Com tantos ansiosos para ler minhas obras, tenho várias opções para seu local final também."
 write_muwashshah_poem_decision_tooltip:0 "Escreva um novo poema para vender por dinheiro, manter para si ou distribuir gratuitamente.\n\n$EFFECT_LIST_BULLET$Vender o poema trará uma quantia de [gold_i][gold|E]\n$EFFECT_LIST_BULLET$Manter o poema adiciona um modificador ao Tomo da Dupla Lua [artifact|E]\n$EFFECT_LIST_BULLET$Distribuir o poema resultará em [prestige_i][prestige|E] extra"
