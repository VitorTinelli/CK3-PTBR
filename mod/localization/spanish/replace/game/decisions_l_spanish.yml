 fp2_champion_of_the_old_ways_modifier:0 "Campeão dos Velhos Caminhos"
 fp2_champion_of_the_old_ways_modifier_desc:0 "Este personagem é considerado um defensor de tudo que é bom e sagrado por sua fé."
 fp2_friend_of_the_old_ways_modifier:0 "Amigo dos Velhos Caminhos"
 fp2_friend_of_the_old_ways_modifier_desc:0 "Este personagem gastou muito tempo e energia defendendo crenças antigas, com algumas revisões leves."
 gain_weight_decision:0 "Ganhar Peso"
 gain_weight_decision_confirm:0 "Traga a manteiga!"
 gain_weight_decision_desc:0 "As falácias do meu corpo estão ficando muito perceptíveis - eu mal tenho forças para sobreviver ao dia!\n\nUma dieta contendo, entre outras coisas, como leite, manteiga e tâmaras foi sugerida para mim, e acho que é hora de experimentá-la."
 gain_weight_decision_tooltip:0 "Você vai se dedicar a ganhar peso"
 give_sky_burial_decision:0 "Dê [Select_CString( ancestor_to_bury.IsFemale, 'a sua', 'ao seu' )] [ROOT.Char.Custom2('RelationToMe', ROOT.Var('ancestor_to_bury').Char)|U] um Enterro do Céu"
 give_sky_burial_decision_confirm:0 "Dar o Enterro do Céu"
 give_sky_burial_decision_desc:0 "#F [ROOT.Var('ancestor_to_bury').Char.Custom2('MyCharacterIntroduction', ROOT.Char)|U] faleceu. A tradição dita que [ROOT.Var('ancestor_to_bury').Char.GetSheHe] deveria dar um enterro no céu, [ROOT.Var('ancestor_to_bury').Char.GetSheHe] permanece para que os restos deixados para carniceiros se destacarem para que [ROOT.Var('ancestor_to_bury').Char.GetSheHe] pode alimentar o mundo que uma vez alimentou [ROOT.Var('ancestor_to_bury').Char.GetSheHe].#!"
