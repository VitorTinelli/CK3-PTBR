 redistribute_realm_wealth_decision_desc:0 "#F [ROOT.Char.GetFaith.HighGodName] preparou o suficiente para todos e não nomeou nenhum [ROOT.Char.GetWomanMan] para guardar [ROOT.Char.GetFaith.HighGodHerHis] generosidade. Cada tesouro e baú trancado nesta terra, incluindo o meu próprio, guarda o que é devido a um estranho. Isso não pode continuar.\n\nQuebre os selos e escancare os portões, e que todos recebam a sua justa parte. Os poderosos podem me desprezar, mas o desdém de sanguessugas e lobos é uma honra para os justos.#!"
