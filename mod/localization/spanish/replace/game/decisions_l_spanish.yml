 commit_suicide_decision:0 "Tentar suicídio"
 commit_suicide_decision_confirm:0 "Minha hora chegou"
 commit_suicide_decision_desc:0 "Só há escuridão e dor. As pessoas me dizem que vai melhorar, mas como eles sabem? E como isso me ajuda neste momento? É hora de me livrar das amarras deste mundo mortal."
 commit_suicide_decision_desc_cancer:0 "Sinto a doença se espalhando dentro de mim. O que começou como um pequeno incômodo agora se tornou uma luta diária. A morte é inevitável. Só quero que a dor pare."
 commit_suicide_decision_desc_cannibal:0 "Que sociedade retrógrada em que vivemos. Me banquetear com a deliciosa iguaria que é a carne humana é a única coisa que me traz alegria. Não quero continuar vivendo em um mundo que a proíbe!"
 commit_suicide_decision_desc_criminal:0 "Não posso escapar do meu passado. Onde quer que eu vá, sinto os olhares de julgamento sobre mim. Como isso pôde ter acontecido? Por que deixei as coisas chegarem a esse ponto? Espero que meus crimes sejam perdoados depois que eu partir."
 commit_suicide_decision_desc_demoted:0 "Poucos sofreram humilhação como eu. Eu, que costumava estar no topo, agora sou forçado a me humilhar como o resto desses tolos. Talvez eu deva tomar as coisas em minhas próprias mãos e sair do jeito que escolhi."
 commit_suicide_decision_desc_depressed:0 "$commit_suicide_decision_desc$"
 commit_suicide_decision_desc_deviant:0 "Quem são eles para me julgar? Minhas explorações lascivas podem ter me levado por muitos caminhos surpreendentes, mas todos levam a um prazer intenso. Sem esses deleites carnais, não tenho nada pelo que viver."
 commit_suicide_decision_desc_divorce:0 "Eu passo meus dias afogado em arrependimento. O que eu poderia ter feito para evitar essa separação dolorosa? Como posso restaurar o amor que foi perdido? É desesperador. Sem meu casamento, eu não sou nada."
 commit_suicide_decision_desc_doomed:0 "Não restou luz em mim. Deus está em silêncio, e cantei vitória à espera da Sua voz. É hora de abandonar as amarras deste reino mortal."
 commit_suicide_decision_desc_friend:0 "A vida é muito sombria se não posso compartilhá-la com um verdadeiro amigo. Momentos que teriam feito eu e [ROOT.Var('mourning_friend').Char.GetFirstName] rir por horas agora só me enchem de desespero. Esse caminho de solidão não é para mim."
 commit_suicide_decision_desc_great_pox:0 "As pústulas agora cobrem meu corpo, cada úlcera maior e mais dolorosa que a anterior. Vejo apenas medo e repugnância nos olhos dos meus súditos. Só vai piorar..."
 commit_suicide_decision_desc_incapable:0 "Eu sobrevivo, mas não realmente vivo. Meu estado atual me obriga a depender dos outros para realizar as tarefas mais simples. Eu não escolhi isso, talvez seja mais fácil se eu acabar com tudo..."
 commit_suicide_decision_desc_leper:0 "A podridão tomou conta de meu ser mortal. Alguns dos meus dedos do pé já se foram e o pus escorre das minhas feridas. Por quanto tempo devo sofrer com esse destino horrendo?"
 commit_suicide_decision_desc_lunatic:0 "Não consigo escapar dos murmúrios constantes de ódio e decepção. Eles estão me dizendo para fazer coisas que não deveria. Nada faz sentido, a realidade se contradiz. Só a morte me libertará?"
 commit_suicide_decision_desc_parent:0 "Não há como seguir em frente. Estou preso ao luto pelo meu filho perdido. [ROOT.Var('mourning_parent').Char.Custom2('MyCharacterIntroduction', ROOT.Char)|U] significava o mundo para mim. Qual é o sentido de viver quando a vida perdeu sua única fonte de alegria e riso?"
 commit_suicide_decision_desc_sodomite:0 "O destino me tratou de forma cruel. Por que devo ser perseguido pelos desejos do meu coração? Não posso evitar ter nascido assim. Se me condenam em vida, serei aceito apenas na morte?"
 commit_suicide_decision_desc_soulmate:0 "Não posso mais suportar o vazio em minha alma. A vida sem você, meu amado [ROOT.Var('mourning_soulmate').Char.GetFirstName], tem sido nada mais que um fardo. Se a única maneira de voltar para seus braços é partir deste mundo, que assim seja."
 commit_suicide_decision_desc_stressed:0 "Dia após dia, a pressão aumenta. Onde quer que eu vá, seja o que eu faça, logo fica demais. Tudo está fora de controle. Isso deve acabar!"
 commit_suicide_decision_desc_witch:0 "Minha fascinação pelo oculto me levou por um caminho solitário e perigoso. Mas minha curiosidade teve um custo terrível. Sou rejeitado por minhas crenças. Tenho medo de que nunca aceitem quem eu sou."
 commit_suicide_decision_effect_tooltip:0 "@warning_icon! Você tentará acabar com sua vida. Tem certeza de que é isso que deseja?"
 commit_suicide_decision_tooltip:0 "Chegou a hora de partir deste mundo"
