 tribal_challenge_ruler_decision_desc:0 "[ROOT.Char.GetLiege.GetFirstName] carrega o título d[Select_CString( ROOT.Char.GetLiege.IsFemale, 'a', 'o' )] [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip] como se fosse inquestionavelmente [ROOT.Char.GetLiege.GetHerHim]; como se não fosse habilidade e força apenas que deveriam decidir nosso líder.\n\nEu, [ROOT.Char.GetFullNameNoTooltip], questiono o direito [ROOT.Char.GetLiege.GetHerHim] ao título, a toda [ROOT.Char.GetLiege.GetPrimaryTitle.GetNameNoTier], e não ficarei mais em silêncio!"
