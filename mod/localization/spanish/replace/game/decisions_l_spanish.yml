 mozarabic_break_with_rome_decision:0 "Quebrar com Roma"
 mozarabic_break_with_rome_decision_confirm:0 "Um caminho justo e piedoso!"
 mozarabic_break_with_rome_decision_desc:0 "O que [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] sabe sobre nossas vidas ou terras? Roma é um soberano distante, que não se importa ou entende nossas necessidades espirituais.\n\nSomente liberando-nos das correntes do [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetBaseName] e purgando as últimas mentiras, [ROOT.Char.GetFaith.GetName] pode alcançar a perfeição."
