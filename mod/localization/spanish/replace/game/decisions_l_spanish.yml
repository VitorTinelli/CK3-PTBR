 bp3_bosporan_kingdom_modifier:0 "Governantes do Mar Negro"
 bp3_bosporan_kingdom_modifier_desc:0 "Esta família ganhou uma presença significativa no Mar Negro e visa tomar o controle de toda sua riqueza e tesouros.\n\n"
 bp3_conqueror_black_sea_modifier:0 "Conquistador do Mar Negro"
 bp3_conqueror_black_sea_modifier_desc:0 "O Mar Negro aguarda o retorno de seu rei legítimo."
 break_with_the_old_ways_decision:0 "Romper com os Velhos Caminhos"
 break_with_the_old_ways_decision_confirm:0 "Comprometemo-nos com o Judaísmo!"
 break_with_the_old_ways_decision_desc:0 "A fé $kabarism_adj$ tem sido praticada juntamente com tradições locais por muito tempo, mas não mais. Devemos rejeitar os velhos caminhos e abraçar o Judaísmo ao máximo."
 break_with_the_old_ways_decision_tooltip:0 "Nada mais de religião folclórica!"
 build_grand_church_decision:0 "Construir uma Grande Igreja"
 build_grand_church_decision_confirm:0 "Iniciar a construção #EMP imediatamente#!!"
 build_grand_church_decision_desc:0 "Existe um terreno em Barcelona onde a fraternidade com [ROOT.Char.GetFaith.HighGodName] supostamente flui mais fácil; construir um[ROOT.Char.GetFaith.HouseOfWorship] sobre este terreno em homenagem [ROOT.Char.GetFaith.HighGodName] e a Sagrada Família.\n\nQue o edifício pronto sirva de testemunho da [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] grandiosidade!"
 build_grand_church_decision_tooltip:0 "O fundamento para uma grande igreja está estabelecido"
 build_holy_pilgrim_roads_decision:0 "Construir Estradas de Peregrinação"
 build_holy_pilgrim_roads_decision_confirm:0 "Financiar a construção"
 build_holy_pilgrim_roads_decision_construction_notif.desc:0 "Estradas foram construídas por todo [chosen_location_for_pilgrim_roads.GetName] levando ao [chosen_holy_site_for_pilgrim_roads.GetNameNoTier], onde um [holy_site|E] [ROOT.Char.GetFaith.GetAdjective] aguarda futuros peregrinos."
 build_holy_pilgrim_roads_decision_construction_notif.t:0 "Estradas de peregrinação construídas em [chosen_location_for_pilgrim_roads.GetNameNoTierNoTooltip]"
 build_holy_pilgrim_roads_decision_desc:0 "Não pode haver peregrinação sem um caminho para os nossos locais sagrados, portanto, é imperativo que nós, [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip], construamos estradas para permitir o acesso aos nossos locais mais sagrados."
 build_holy_pilgrim_roads_decision_hardcoded_trigger_text.a:0 "Há um [holy_site|E] em seu [realm|E] sem o [modifier|E] estradas dos peregrinos"
 build_holy_pilgrim_roads_decision_tooltip:0 "Construa estradas até um local sagrado mantido por você"
