 epidemic_events.0100.aa:0 "\"Não confie em [ROOT.Char.GetFaith.HighGodName]. Confie em sua vontade de sobreviver.\""
 epidemic_events.0100.b:0 "Tanto desespero só pode ser aplacado pelo amor."
 epidemic_events.0100.c:0 "Aqui, há poucos ouvidos indiscretos..."
 epidemic_events.0100.d:0 "O campo tranquilo — onde a alma floresce!"
 epidemic_events.0100.desc:0 "Levados para longe do fedor do coração da capital tarde da noite, eu e minha família podemos permanecer distantes do povo do reino até que chegue o momento certo de emergir.\n\nA comunicação será limitada, e minha ausência sentida, mas devemos permanecer seguros da morte e decadência além de nossas quatro modestas paredes."
 epidemic_events.0100.desc_amidst_plague:0 "Minha comitiva monta em cavalos e carroças, e meus [ROOT.Char.Custom('GetFighterTermPlural')] espantam a multidão cinzenta que se ajunta: #EMP \"Afastem-se! Abram caminho para o [ROOT.Char.GetTitleAsName]!\"#!\n\nViajamos para fora de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] como quem foge de [ROOT.Char.GetFaith.NegativeAfterLife]. Mendigos jazem mortos nas sargetas. Desgraçados marcados por [plague.GetName] cambaleiam na escuridão.\n\n\"[ROOT.Char.GetFaith.HighGodName] tenha piedade de todos nós!\" clamam meus entes queridos, enquanto buscamos a segurança relativa — e o anonimato — de nosso refúgio no campo."
 epidemic_events.0100.t:0 "Isolamento"
 epidemic_events.0101.a:0 "Como estou feliz em estar de volta!"
 epidemic_events.0101.b:0 "Feche a porta! Está com corrente de ar!"
 epidemic_events.0101.desc:0 "O sol parece desconhecido e hostil em minha pele, o vento parece frio e violador.\n\nQual foi a última vez que eu respirei o ar como [ROOT.Char.GetFaith.HighGodName|U] o fez?"
