 admiring_birds_decision_tooltip:0 "Passar um tempo admirando pássaros."
 adopt_han_culture_decision:0 "Adotar Cultura Chinesa"
 adopt_han_culture_decision_confirm:0 "Vamos cultivar a cultura Chinesa"
 adopt_han_culture_decision_desc:0 "Nosso contato com os costumes chineses nos permitiu começar a adotar rapidamente seus pilares culturais. Talvez eu e minha família possamos nos converter adequadamente à sua cultura."
