 accuse_krstjani_of_heresy_decision:0 "Acusar a $bosnian_church$ de heresia"
 accuse_krstjani_of_heresy_decision_confirm:0 "Primeiro a pena, depois a espada!"
 accuse_krstjani_of_heresy_decision_desc:0 "As selvagens montanhas da Bósnia abrigam, há anos, uma seita que não pertence verdadeiramente ao Oriente ou ao Ocidente, mas ambos parecem contentes em ignorar essa crescente desvio.\n\nNão mais! Faremos com que o [ROOT.Char.GetFaith.ReligiousHeadName] os declare formalmente hereges, e eles não terão mais onde se esconder!"
 accuse_krstjani_of_heresy_decision_tooltip:0 "O mundo cristão não tolerará mais esses cismáticos!"
 accuse_krstjani_of_heresy_flavour_effect.tt:0 "Você envia uma carta para o [GetPlayer.GetFaith.ReligiousHeadName], implorando para que [GetPlayer.GetFaith.GetReligiousHead.GetSheHe] investigue o assunto da $bosnian_church$..."
 admiring_birds_decision:0 "Admirar pássaros"
 admiring_birds_decision_confirm:0 "Ir dar um passeio"
