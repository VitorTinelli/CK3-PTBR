 rightful_king_opinion:0 "Senhor Feudal Legítimo"
 roman_restoration.1211.a:0 "Estamos ligados para sempre aos nossos irmãos do norte."
 roman_restoration.1211.b:0 "O destino da Sicília está, como sempre esteve, do outro lado do mar."
 roman_restoration.1211.c.tt:0 "Você deve ter um [title|E] primário de nível [empire|E] que não seja [GetTitleByKey('e_italy').GetNameNoTier] ou [GetTitleByKey('e_maghreb').GetNameNoTier]."
 roman_restoration.1211.c:0 "Por que, com [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], claro!"
 roman_restoration.1211.desc.body.emperor_absent:0 "Não há nem mesmo um imperador para protestar minha proclamação. Patético."
 roman_restoration.1211.desc.body.emperor_exists:0 "[emperor.GetTitledFirstNameNicknamed] pode se irritar e rugir o quanto quiser — se [emperor.GetSheHe] se importar em notar uma província separatista longe do seu confortável palácio — mas [emperor.GetSheHe] não pode fazer nada para me parar."
 roman_restoration.1211.desc.intro:0 "Por centenas de anos, os bizantinos se agarraram a seus últimos redutos na Península Italiana, fincando unhas ensanguentadas na terra e se recusando a soltar, não importa o quanto chutemos neles.\n\nNão mais. Hoje, seu controle finalmente está solto o suficiente para ser arrancado de uma vez por todas, e eu assegurarei que todo o mundo saiba.\n\n"
 roman_restoration.1211.desc.outro:0 "\n\nA única questão é... para onde vejo a justa [GetTitleByKey('k_sicily').GetNameNoTier] pertencendo agora?"
 roman_restoration.1211.t:0 "O Sonho de Justiniano Desfeito"
 roman_restoration.1212.a:0 "Aquele presunçoso!"
 roman_restoration.1212.desc.intro:0 "Após centenas de anos de resistência obstinada e determinada contra hordas bárbaras de um tipo ou de outro, saqueando os últimos vestígios de nossa antiga pátria, [taker.GetTitledFirstName] finalmente teve sucesso onde tantos outros falharam.\n\nO cachorro eliminou os últimos remanescentes do controle romano na península ocidental,"
 roman_restoration.1212.desc.new_empire.italia:0 "alinhando fortemente o território com [GetTitleByKey('e_italy').GetNameNoTier]."
 roman_restoration.1212.desc.new_empire.maghreb:0 "trazendo-o para a esfera africana junto com [GetTitleByKey('e_maghreb').GetNameNoTier]."
 roman_restoration.1212.desc.new_empire.own:0 "absorvendo o território em seu próprio reino de [taker.GetPrimaryTitle.GetBaseNameNoTier]."
 roman_restoration.1212.desc.outro.no_territory_left:0 "\n\nCom não mais do que um único porto ao sul em nosso nome, não há nada que possamos fazer para resistir a essa injustiça."
 roman_restoration.1212.desc.outro.territory_left:0 "\n\nOs poucos postos avançados dispersos que temos restantes não oferecem resistência real a essa travessura."
 roman_restoration.1212.t:0 "$roman_restoration.1211.t$"
 roman_restoration.1213.a:0 "Boa viagem!"
 roman_restoration.1213.b:0 "Quais tempos sombrios vivemos..."
 roman_restoration.1213.desc.body.emperor_absent:0 "Sem sequer um imperador para expressar oposição, a Itália romana morre com um gemido."
 roman_restoration.1213.desc.body.emperor_exists:0 "[emperor.GetTitledFirstName] protesta o quanto se pode esperar pela perda de uma província menor, mas não mais do que isso."
 roman_restoration.1213.desc.intro:0 "Apesar de derramar um oceano de sangue por seus territórios italianos ao longo dos séculos, [taker.GetTitledFirstNameNicknamed] finalmente forçou os romanos a admitir que [GetTitleByKey('k_sicily').GetNameNoTier] está perdido para eles.\n\nEm vez disso, as terras agora olham para"
 roman_restoration.1213.desc.new_empire.italia:0 "o resto da península em busca de socorro."
 roman_restoration.1213.desc.new_empire.maghreb:0 "seus vizinhos africanos do outro lado do oceano, vendo-se como parte de seus antigos primos do [GetTitleByKey('e_maghreb').GetNameNoTier]."
 roman_restoration.1213.desc.new_empire.own:0 "Seu próprio [taker.GetPrimaryTitle.GetBaseName] como o #EMP novo#! império."
 roman_restoration.1213.desc.outro.no_territory_left:0 "\n\nSem sequer uma única cidade romana restante nas terras perdidas, simplesmente não há ninguém para lamentar a morte do sonho de Justiniano."
 roman_restoration.1213.desc.outro.territory_left:0 "\n\nOs poucos remanescentes do império deixados do outro lado do Adriático agora parecem mais ameaçados do que nunca."
 roman_restoration.1213.t:0 "$roman_restoration.1211.t$"
