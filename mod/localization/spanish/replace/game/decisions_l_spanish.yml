 mozarabic_bind_the_faith_to_rome_decision.tt.hof_and_ecumenism_warning:0 "Você manterá o [GetFaithDoctrine('special_doctrine_ecumenical_christian').GetBaseName], mas #X manterá permanentemente#! o [head_of_faith|E] [religious_leader.GetFaith.GetReligiousHead.GetFaith.GetAdjective]"
 mozarabic_bind_the_faith_to_rome_decision:0 "Unir a Fé a Roma"
 mozarabic_bind_the_faith_to_rome_decision_confirm:0 "Nosso lugar é dentro do Grande Cristianismo."
 mozarabic_bind_the_faith_to_rome_decision_desc:0 "Embora [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] ainda seja nosso único Papa verdadeiro, o isolamento da vontade do Vigário de Cristo nos levou por caminhos estranhos. Já se foram os dias em que os grandes conclaves do clero europeu percorriam os corredores de Toledo.\n\nMas eles não precisam ser assim... se nossa fé se desviou, não poderia um pastor forte trazê-la de volta ao rebanho?"
 mozarabic_bind_the_faith_to_rome_decision_tooltip:0 "Reunir a [faith|E] [ROOT.Char.GetFaith.GetAdjective] desviante ao [ROOT.Char.GetFaith.GetReligiousHead.GetFaith.GetName]"
