 form_brunei_empire_decision:0 "Fundar o Império de Brunei"
 form_brunei_empire_decision_confirm:0 "Cunhem as moedas do meu império!"
 form_brunei_empire_decision_desc:0 "Desde que o Darussalam foi estabelecido, nosso desejo de espalhar a mensagem de Allah e oferecer refúgio aos fracos contra o Shaytaan só aumentou. Aspiro seguir o exemplo dos Sahabah e ser lembrado como um líder firme de Bornéu e além."
