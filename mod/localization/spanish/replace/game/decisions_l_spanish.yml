 form_majapahit_empire_decision:0 "Fundar o Império Majapahit"
 form_majapahit_empire_decision_confirm:0 "Até que as estrelas se curvem, estaremos unidos"
 form_majapahit_empire_decision_desc:0 "Surgidos da ilha de Java, meu povo, com diferentes segredos em seus corações, cantará poemas de unidade na diversidade — estando em pedaços, mas unidos em propósito."
 form_majapahit_empire_decision_effects_de_jure_tt_a:0 "Se mantido, [javanese_yavakadvipa.GetNameNoTier] se tornará parte [de_jure|E] de [javanese_majapahit_empire.GetName]"
 form_majapahit_empire_decision_effects_de_jure_tt_b:0 "Se mantido, [javanese_palembang.GetNameNoTier] se tornará parte [de_jure|E] de [javanese_yavakadvipa.GetNameNoTier]"
