 form_switzerland_kingdom_decision_tooltip:0 "A Confederação Suíça será fundada."
 form_the_kingdom_of_aragon_decision.tt.drift.d_barcelona:0 "Se você [completely_controls|E] [d_barcelona.GetDefinitiveName], ela será [de_jure_drift_drifted|E] para [k_aragon.GetDefinitiveName]."
 form_the_kingdom_of_aragon_decision.tt.drift.d_navarra:0 "Se você [completely_controls|E] [d_navarra.GetDefinitiveName], ela será [de_jure_drift_drifted|E] para [k_aragon.GetDefinitiveName]."
 form_the_kingdom_of_aragon_decision.tt.drift.d_valencia:0 "Se você [completely_controls|E] [d_valencia.GetDefinitiveName], ela será [de_jure_drift_drifted|E] para [k_aragon.GetDefinitiveName]."
 form_the_kingdom_of_aragon_decision.tt.form_aragonese:0 "Você poderá escolher se deseja ou não copiar [culture_pillars|E] da [founder_culture.GetName] para [aragonese_culture.GetName]."
 form_the_kingdom_of_aragon_decision:0 "Fundar o Reino de Aragão"
 form_the_kingdom_of_aragon_decision_confirm:0 "Nosso lar, nosso reino!"
 form_the_kingdom_of_aragon_decision_desc:0 "Os filhos do grande rio Ebro têm sido deixados de lado por séculos. Pelos romanos, pelos visigodos, pelos francos, pelos árabes. Enquanto trabalharem para conquistadores estrangeiros e capitais distantes, suas terras não são realmente suas, e o povo clama por um reino local próprio."
 form_the_kingdom_of_aragon_decision_tooltip:0 "Fundar o Reino de Aragão"
 formalise_the_daneland_decision.must_be_after_1100.tt:0 "A data é 1100.1.1 ou posterior"
 formalise_the_daneland_decision:0 "Formalizar o Daneland"
 formalise_the_daneland_decision_confirm:0 "Essa rivalidade não nos convém."
 formalise_the_daneland_decision_desc:0 "O que nossas pessoas se importam com $k_england$? Temos muito mais do que apenas nossas próprias leis: temos nossos próprios costumes, línguas, tradições, nossa própria #EMP cultura#! Eles não têm mais direito à nossa terra do que nós à deles."
 formalise_the_daneland_decision_tooltip:0 "Abandonar a luta por uma $k_england$ unida"
 found_duchy_decision:0 "Fundar um Novo Ducado"
 found_duchy_decision_confirm:0 "É meu direito governar"
 found_duchy_decision_desc:0 "Olho para os meus vizinhos, meus pares, meus chamados iguais. Eu sou maior do que eles, e é hora de o mundo reconhecer meu valor. Vou forjar um reino para que todos se curvem à minha legítima regra."
 found_duchy_decision_tooltip:0 "Vou fundar um novo [duchy|E] para governar as terras de [ROOT.Char.GetPrimaryTitle.GetNameNoTier]"
 found_empire_decision:0 "Fundar um Novo Império"
 found_empire_decision_confirm:0 "Unir o reino"
 found_empire_decision_desc:0 "Eu criarei um império para superar todos os outros e resistir à passagem do tempo."
 found_empire_decision_tooltip:0 "Criar um título de império inteiramente novo"
 found_empire_of_hindustan_decision_effects_de_jure_tt:0 "Qualquer [kingdom|E] possuído nos [GetTitleByKey('e_rajastan').GetName], [GetTitleByKey('e_bengal').GetName] e [GetTitleByKey('e_deccan').GetName] se tornará [de_jure|E] de Hindustão."
 found_kingdom_decision:0 "Fundar um Novo Reino"
 found_kingdom_decision_advanced_succesion:0 "Não tem a Lei de Sucessão Avançada"
 found_kingdom_decision_confirm:0 "Unir o reino"
 found_kingdom_decision_desc:0 "Eu vou unir meu reino sob um novo título de reino, para pertencer à minha dinastia para todo o sempre."
 found_kingdom_decision_elective_succesion:0 "Não tem a Lei de Sucessão Eletiva"
 found_kingdom_decision_tooltip:0 "Criar um título de reino inteiramente novo"
 found_kingdom_of_albania_decision:0 "Fundar o Reino da Albânia"
 found_kingdom_of_albania_decision_confirm:0 "[ROOT.Char.GetLadyLord|U] de toda a Albânia!"
 found_kingdom_of_albania_decision_desc:0 "Senhores distantes detêm nossos portos. Senhores da guerra pressionam do norte. A riqueza de nosso povo escoa por nossas costas, como se nossa terra fosse uma barraca de mercado. Expulsamos esses estrangeiros das terras altas albanesas, e um novo futuro agita-se tanto nas montanhas quanto nos portos..."
 found_kingdom_of_albania_decision_tooltip:0 "A Albânia torna-se um [de_jure|E] [kingdom|E]"
 found_kingdom_of_bosnia_decision:0 "Fundar Reino da Bósnia"
 found_kingdom_of_bosnia_decision_confirm:0 "[ROOT.Char.GetLadyLord|U] de toda a Bósnia!"
 found_kingdom_of_bosnia_decision_desc:0 "As montanhas e florestas da Bósnia central flutuam incessantemente entre senhores do norte e do sul. Talvez não por muito mais tempo..."
 found_kingdom_of_bosnia_decision_tooltip:0 "A Bósnia se torna um [kingdom|E] [de_jure|E]"
 found_kingdom_of_livonia_decision:0 "Proclamar Terra Mariana"
 found_kingdom_of_livonia_decision_confirm:0 "[ROOT.Char.GetLadyLord|U] de todos os bálticos!"
 found_kingdom_of_livonia_decision_desc:0 "Os bálticos, por séculos, estão sem um reino para chamar de seu. Esta terra selvagem e indomada de tribos e crenças pagãs díspares tem sido por muito tempo sem identidade, mas talvez eu mude tudo isso..."
 found_kingdom_of_livonia_decision_tooltip:0 "A Livônia se torna um [realm|E] [de_jure|E]"
 found_the_empire_of_hindustan_decision:0 "Fundar o Império de Hindustão"
 found_the_empire_of_hindustan_decision_confirm:0 "al-sultan zill allah fi arḍih!"
 found_the_empire_of_hindustan_decision_desc:0 "Embora o Islã tenha chegado às terras do Hind há centenas de anos, o subcontinente tem sido dominado por dinastias nativas. Vamos lançar as bases de um novo legado imperial, um estado islâmico enraizado nas grandes planícies do norte da Índia!"
 found_the_empire_of_hindustan_decision_effects_vassal_opinion.tt:0 "Todos os vassalos diretos"
 found_the_empire_of_hindustan_decision_tooltip:0 "Hindustão se torna um [empire|E] [de_jure|E]."
 found_the_empire_of_hindustan_opinion:0 "Fundou o Império de $e_hindustan$"
 found_university_decision:0 "Fundar Universidade"
 found_university_decision_confirm:0 "Estabelecer a fundação!"
 found_university_decision_custom:0 "Em um Barão adequado"
 found_university_decision_desc:0 "Sábios estudiosos têm se reunido em meu reino ultimamente. Muitos são procurados como professores, mas para reunir — e transmitir — seus conhecimentos, eles precisam de algum lugar para reunir."
 found_university_decision_tooltip:0 "Espaço de [special_building|E]: [GetBuilding('generic_university').GetName] será disponibilizado"
 found_witch_coven_decision:0 "Fundar o Covil das Bruxas"
 found_witch_coven_decision_confirm:0 "Fundar o covil da [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 found_witch_coven_decision_desc:0 "Nossa nobre casa é unida pelo sangue, mas a verdade nos divide. Anseio pelo dia em que não viveremos mais com medo, mas seremos completamente abertos uns com os outros. Nossos filhos e filhas serão criados para abraçar seus poderes e a vontade de [ROOT.Char.GetFaith.WitchGodName]. Que possamos servir [ROOT.Char.GetFaith.WitchGodSheHe|U] bem!"
 found_witch_coven_decision_effects.children.tt:0 "Todos os filhos do covil [founder.GetHouse.GetBaseName] que são educados por um [GetTrait('witch').GetName( GetPlayer )] se tornam uma bruxa"
 found_witch_coven_decision_effects.convert.tt:0 "Todos os Bruxos da seita [founder.GetHouse.GetBaseName] têm mais sucesso ao converter outros para a bruxaria"
 found_witch_coven_decision_effects.grand_rite.tt:0 "O [house_head|E] do coven da Casa [founder.GetHouse.GetBaseName] pode realizar uma [activity|E] de [GetActivityType('activity_witch_ritual').GetName]"
 found_witch_coven_decision_tooltip:0 "Inicie uma nova tradição familiar"
