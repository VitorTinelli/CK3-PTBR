 court_astrologer_events.0001.desc:0 "Meus olhos seguem [astrologer.GetFirstName] enquanto [astrologer.GetSheHe] coloca dois juncos no chão, a certa distância um do outro. Os lábios [astrologer.GetHerHim] mal parecem se mover enquanto [astrologer.GetSheHe] recita encantamentos, observando os juncos se aproximarem um do outro, tocados pelo vento.\n\nUm deles conquista o outro — o peso que carrega é muito maior que seu corpo. O céu falou."
