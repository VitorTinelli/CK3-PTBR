l_spanish:
 east_europe.0001.a:0 "Glória a [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
 east_europe.0001.desc:0 "As velhas tribos se uniram novamente. Eu as reuni, assim como Samo fez há séculos. Seu império morreu com ele, mas tenho certeza de que o futuro de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] é próspero. Isso é apenas o começo!"
 east_europe.0001.t:0 "Os Eslovenos Ocidentais Unidos"
 east_europe.0002.desc:0 "Assim como Samo uniu as tribos vêndias séculos atrás, [western_slav_uniter.Custom2('MyCharacterIntroduction', ROOT.Char)] reuniu os povos eslavos ocidentais sob uma bandeira. Será que essa união resistirá ao teste do tempo ou desmoronará assim como o império de Samo? Somente [ROOT.Char.GetFaith.FateGodName] sabe."
 east_europe.0005.desc:0 "Eu uni as tribos antigas sob uma bandeira. Juntos, somos mais fortes do que nunca. Não seremos conquistados! Não seremos apagados!"
 east_europe.0005.t:0 "Os Eslovenos do Sul Unidos"
 east_europe.0006.desc:0 "[southern_slav_uniter.Custom2('MyCharacterIntroduction', ROOT.Char)|U] reuniu os povos eslavos do sul sob uma bandeira. Será que essa união resistirá ao teste do tempo ou antigas disputas e costumes a despedaçarão? Somente [ROOT.Char.GetFaith.FateGodName] sabe."
 east_europe.0010.a:0 "Glória à Slávia!"
 east_europe.0010.desc:0 "Fiz o impossível - neste dia, todos os eslavos estão unidos sob uma bandeira. Meu novo império se estende desde o coração da Europa, no oeste, até as tundras congeladas, no leste!\n\nApenas alguns heróis na história já conseguiram tal feito! Agora, sou um deles, e meu nome viverá para sempre."
 east_europe.0010.t:0 "O Nascimento da Slávia"
 east_europe.0011.desc:0 "[slav_uniter.Custom2('MyCharacterIntroduction', ROOT.Char)|U] realizou o impossível - [slav_uniter.GetSheHe] uniu todos os povos eslavos sob uma bandeira. Será que esse vasto império continuará a prosperar, ou antigas disputas e costumes o despedaçarão? Somente [ROOT.Char.GetFaith.FateGodName] sabe."
 east_europe.0015.a:0 "... [target_list_member_a.GetNameNoTierNoTooltip]."
 east_europe.0015.b:0 "... [target_list_member_b.GetNameNoTierNoTooltip]."
 east_europe.0015.c:0 "... [target_list_member_c.GetNameNoTierNoTooltip]."
 east_europe.0015.d:0 "... [target_list_member_d.GetNameNoTierNoTooltip]."
 east_europe.0015.desc:0 "A Sala dos Heróis foi construída em..."
 east_europe.0015.t:0 "Defensores de [defender_of_highgod.GetFaith.HighGodName]"
 east_europe.0015.tooltip:0 "O domínio ganha a [special_building|E] [GetBuilding('hall_of_heroes_01').GetName]"
 east_europe.0016.a:0 "Salve [defender_of_highgod.GetFaith.WarGodName]!"
 east_europe.0016.desc:0 "Sob minha liderança, os clãs se uniram para erguer um grande salão de guerra em [holy_site.GetNameNoTierNoTooltip]. Dentro de suas espessas paredes de pedra, nos preparamos para a guerra...\n\nPor gerações, saqueadores estrangeiros têm cobiçado nossas terras. Deixem que venham, eu digo! Deixem que testem seu poder contra nossos bravos heróis [defender_of_highgod.GetFaith.GetAdjectiveNoTooltip]! Deixem que seu sangue embeba a terra e colore os rios de vermelho!"
 east_europe.0017.desc:0 "[defender_of_highgod.Custom2('MyCharacterIntroduction', ROOT.Char)|U] uniu os clãs em defesa contra invasores estrangeiros em seu reino. Um grande salão de guerra foi construído em [holy_site.GetNameNoTierNoTooltip], onde os orgulhosos heróis [defender_of_highgod.GetFaith.GetAdjectiveNoTooltip] já se reuniram."
 east_europe.0030.a:0 "Todos são bem-vindos!"
 east_europe.0030.desc:0 "Ao permitir que comerciantes experientes, fazendeiros e artesãos dos reinos ocidental e meridional, [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] em breve se tornará um centro próspero de comércio e finalmente deixará suas raízes tribais.\n\nEsperançosamente, esses novos colonos cristãos também ajudarão a acalmar os últimos descontentes pagãos entre meus súditos e solidificarão [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] como um reino [scoped_ruler.GetFaith.GetAdjective] adequado."
 east_europe.0030.t:0 "Novo Começo"
 east_europe.0031.a:0 "Bom, eu não confio neles!"
 east_europe.0031.b:0 "Entendo..."
 east_europe.0031.desc.others:0 "[scoped_ruler.GetTitledFirstName] decidiu dar as boas-vindas a colonos estrangeiros dos reinos [scoped_ruler.GetFaith.GetReligion.GetAdjectiveNoTooltip] vizinhos de [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\n[scoped_ruler.GetSheHe|U] espera que essas novas chegadas ajudem a povoar suas terras mais rapidamente e aumentem o comércio com seus aliados."
 east_europe.0031.desc.vassals:0 "[scoped_ruler.GetTitledFirstName] decidiu dar as boas-vindas a colonos estrangeiros dos reinos vizinhos [scoped_ruler.GetFaith.GetReligion.GetAdjectiveNoTooltip].\n\n[scoped_ruler.GetSheHe|U] espera que essas novas chegadas ajudem a povoar nossas terras mais rapidamente e aumentem o comércio com nossos aliados."
 east_europe.0031.t:0 "Os Novos Colonos"
 east_europe.0032.a:0 "Retornamos às Velhas Maneiras, sem manchas."
 east_europe.0032.b:0 "Talvez - talvez possamos manter alguns dos novos ensinamentos..."
 east_europe.0032.c:0 "Crânios para [ROOT.Char.GetFaith.WarGodName]!"
 east_europe.0032.d:0 "Nossa fé obstinada em velhas tradições, de qualquer tipo, é uma fraqueza."
 east_europe.0032.desc:0 "Meus predecessores abraçaram [old_faith.GetNameNoTooltip] em uma tentativa equivocada de levar [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] à era moderna, mas isso só trouxe rebelião, penúria e conflito.\n\nCom a imensa influência temporal e eclesiástica que tenho agora em meu reino, vou corrigir esse erro e retornar à verdadeira fé $magyar_pagan$.\n\nNo entanto, este é um momento crucial, e embora um retorno às Velhas Maneiras seja absolutamente necessário, talvez sua interpretação exata possa ser alterada um pouco?"
 east_europe.0032.t:0 "Os Velhos Ritos"
 east_europe.0034.a:0 "Finalmente! Glória a [ROOT.Char.GetFaith.HighGodName]!"
 east_europe.0034.b:0 "Talvez o vento sopre em direção a [scoped_ruler.GetFaith.HighGodName]..."
 east_europe.0034.c:0 "Que paganismo vil é este!?"
 east_europe.0034.d:0 "Não é da minha conta nem do meu problema."
 east_europe.0034.desc.conversion_bloodthirsty:0 "Pior ainda, [scoped_ruler.GetTitledFirstNameNoTooltip] afirma que os deuses raivosos só perdoarão a fraqueza do povo [scoped_ruler.GetCulture.GetNameNoTooltip] em se converter se oferecerem sacrifícios humanos frequentes!"
 east_europe.0034.desc.conversion_syncretic:0 "Apesar disso, a nova fé [scoped_ruler.GetFaith.GetAdherentNameNoTooltip] parece reter muitas características distintas de [old_faith.GetNameNoTooltip], fundindo visivelmente os Velhos Caminhos com os Novos."
 east_europe.0034.desc.conversion_vanilla:0 "Embora politicamente dormente por algum tempo, $magyar_pagan$ continuou a ter muitos seguidores no campo, e [scoped_ruler.GetTitledFirstNameNoTooltip] teve pouca dificuldade em restabelecer os Velhos Caminhos."
 east_europe.0034.desc.intro:0 "[scoped_ruler.GetTitledFirstName] mostrou-se um apóstata!\n\nNum ato público de desafio, [scoped_ruler.GetSheHe] renunciou a [old_faith.HighGodName], expulsou [old_faith.PriestNeuterPlural] de alto escalão de [old_faith.GetAdherentNameNoTooltip] e retirou [old_faith.GetNameNoTooltip] de sua posição como a fé do estado. Mesmo agora, muitos [scoped_ruler.GetCulture.GetCollectiveNounNoTooltip] rurais se juntam a [scoped_ruler.GetSheHe].\n\n"
 east_europe.0034.desc.outsiders:0 "Depois de acumular uma força quase ilimitada dentro de [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip],"
 east_europe.0034.desc.vassals:0 "Depois de acumular uma força quase ilimitada dentro do reino,"
 east_europe.0034.desc_conversion_adaptive:0 "Com as muitas mudanças que o povo [scoped_ruler.GetCulture.GetNameNoTooltip] e sua fé passaram nos últimos séculos, esse ressurgimento dos Velhos Caminhos parece notavelmente aberto e pragmático."
 east_europe.0034.t:0 "O Renascimento do [scoped_ruler.GetFaith.GetAdherentNameNoTooltip]"
 east_europe.0101.a:0 "Minha herança será lembrada por séculos!"
 east_europe.0101.b:0 "[founder.GetFaith.HighGodName] nos abençoa!"
 east_europe.0101.c:0 "Sinceramente, contanto que eu seja [founder.GetTitleAsNameNoTooltip] em #EMP algum lugar#!..."
 east_europe.0101.desc:0 "A montanhosa Bósnia tem sido jogada de um lado para o outro entre todas as potências em guerra nos Bálcãs por séculos. Companheiros eslavos do norte e do sul, os senhores dos cavalos dos Cárpatos do momento, imperadores da Bulgária ou Constantinopla, até mesmo os príncipes-mercadores do Adriático.\n\nA partir de hoje, não mais.\n\nCom minha coroação, a Bósnia é um reino próprio e força e glória aguardam!"
 east_europe.0101.t:0 "Primeiro [founder.GetTitleAsNameNoTooltip] de toda a Bósnia"
 east_europe.0102.a:0 "Um iniciante patético, no máximo."
 east_europe.0102.b:0 "Viva [founder.GetShortUINameNoTooltip]!"
 east_europe.0102.c:0 "Veremos quanto tempo isso dura..."
 east_europe.0102.desc:0 "Meus arautos trazem notícias dos vales dos Alpes Dináricos: aparentemente, [founder.GetShortUIName] foi aclamado [founder.GetTitleAsNameNoTooltip] de [founder.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nCom os vales montanhosos defensáveis e as florestas escuras das terras altas da Bósnia sob o controle [founder.GetHerHim] e o apoio do povo local, o reino de [founder.GetTitledFirstNamePossessiveNoTooltip] parece firmemente seguro.\n\nPor enquanto."
 east_europe.0102.t:0 "$east_europe.0101.t$"
 east_europe.0111.a.tt:0 "Uma carta é escrita"
 east_europe.0111.a:0 "Traga-me [ROOT.Char.Custom('WritingInstrument')] e [ROOT.Char.Custom('GetWritingMaterial')]!"
 east_europe.0111.b:0 "Tenho coisas melhores para fazer..."
 east_europe.0111.desc:0 "Quem pode dizer há quanto tempo estes chamados [heretic.GetFaith.GetAdherentNamePluralNoTooltip] têm passado despercebidos? Uma década? Um século? Desde a visita do abençoado São Martinho?\n\nNo entanto tempo este heresia foi permitida a fermentar nos bosques da Bósnia, a leniência dos nossos antepassados tem gerado frutos podres, e eu não posso suportar! Ver tal [heretic.Custom2('InsultNoun', ROOT.Char)] como [heretic.GetTitledFirstName] ostentando [accuser.GetFaith.HighGodName] abertamente!\n\nO mundo ignora que eles são basicamente bons, se rurais, [accuser.GetFaith.GetAdherentNamePluralNoTooltip]. Talvez, com algumas palavras criativas para [hof.GetTitledFirstName], isso não precise ser assim..."
 east_europe.0111.t.setup:0 "Hereges Entre Nós"
 east_europe.0111.t:0 "$east_europe.0111.t.setup$: Escrevendo [hof.GetTitledFirstNameNoTooltip]"
 east_europe.0111.tt.announce_failure:0 "Sua tentativa de acusar a $bosnian_church$ de heresia falhou!"
 east_europe.0111.tt.cancellation_cooldown:0 "A $bosnian_church$ não pode ser acusada de heresia novamente por [EmptyScope.ScriptValue('accuse_the_krstjani_of_heresy_cancellation_cooldown_value')|0] anos"
 east_europe.0111.tt.critical_cooldown:0 "A $bosnian_church$ não pode ser acusada de heresia novamente por [EmptyScope.ScriptValue('accuse_the_krstjani_of_heresy_critical_failure_cooldown_value')|0] anos"
 east_europe.0111.tt.regular_cooldown:0 "A $bosnian_church$ não pode ser acusada de heresia novamente por [EmptyScope.ScriptValue('accuse_the_krstjani_of_heresy_failure_cooldown_value')|0] anos"
 east_europe.0112.a:0 "Que tolo cego!"
 east_europe.0112.desc.culture:0 "[accuser.GetTitledFirstName] é um país[accuser.GetWomanMan] meu, e você simplesmente é ignorante em relação às nossas maneiras."
 east_europe.0112.desc.fallback:0 "Tais alegações espúrias não convêm a [Select_CString( accuser.IsFemale, 'uma', 'um' )] [accuser.GetWomanMan] da sua posição."
 east_europe.0112.desc.intro:0 "Sua insistência de que os [heretic.GetFaith.GetAdherentNamePluralNoTooltip] são hereges é ridícula."
 east_europe.0112.desc.negative_opinion:0 "Talvez se eu respeitasse um pouco mais sua opinião, eu daria crédito aos seus pensamentos. Infelizmente, não o faço."
 east_europe.0112.desc.outro:0 "\n\nEspero que este seja o fim da questão e que, da próxima vez, você pense antes de escrever."
 east_europe.0112.desc.rival:0 "Sinceramente, se #EMP qualquer pessoa#! é provavelmente culpada de heresia, é você, s[Select_CString( accuser.IsFemale, 'ua', 'eu' )] [accuser.Custom2('InsultAdjective', SCOPE.sC('hof'))], [accuser.Custom2('InsultAdjective', SCOPE.sC('hof'))], [accuser.Custom2('InsultNoun', SCOPE.sC('hof'))] [accuser.Custom2('InsultAdjective', SCOPE.sC('hof'))]!"
 east_europe.0112.desc.sinful:0 "Seus pecados são praticamente incontáveis, e você tem a audácia de criticar os outros?"
 east_europe.0112.t:0 "[hof.Custom2('AppropriateGreeting',accuser)]"
 east_europe.0113.a.tt:0 "[hof.GetTitledFirstNameNoTooltip] escreve para [heretic.GetTitledFirstNameNoTooltip]..."
 east_europe.0113.a:0 "As rodas da justiça divina giram!"
 east_europe.0113.desc:0 "Suas palavras me preocupam muito. Pense, tal corrupção profunda pode estar escondida tão perto do coração do Cristianismo!\n\nConsultarei [heretic.GetTitledFirstNameNoTooltip] e determinarei a verdade nessa questão."
 east_europe.0113.t:0 "[hof.Custom2('AppropriateGreeting',accuser)]"
 east_europe.0114.a.tt_failure.tt:0 "As acusações de heresia são verdadeiras..."
 east_europe.0114.a.tt_failure:0 "Seu argumento não convence"
 east_europe.0114.a.tt_success.tt:0 "As acusações de heresia são evitadas!"
 east_europe.0114.a.tt_success:0 "[hof.GetTitledFirstNameNoTooltip] é convencido"
 east_europe.0114.a:0 "Talvez um ensaio teológico astuto?"
 east_europe.0114.b.tt:0 "[hof.GetTitledFirstName] será obrigado a tomar o seu lado!"
 east_europe.0114.b:0 "Acho que um pequeno lembrete será suficiente..."
 east_europe.0114.c.tt_failure:0 "O argumento continua sendo teológico"
 east_europe.0114.c.tt_success:0 "A narrativa muda para o cinismo político"
 east_europe.0114.c:0 "Se [hof.GetSheHe] puder ser convencido disso politicamente..."
 east_europe.0114.d.tt:0 "Você terá que decidir se quer se converter sinceramente ou cinicamente"
 east_europe.0114.d:0 "Não podemos nos opor à Igreja em geral: eu #EMP devo#! me converter."
 east_europe.0114.desc:0 "A carta de [hof.GetTitledFirstName] está em suas mãos trêmulas, embora você não consiga dizer se o tremor vem do medo ou da fúria: através das maquinações [Select_CString( accuser.IsFemale, 'da astuta', 'do astuto' )] [accuser.GetName], [hof.GetTitledFirstNameNoTooltip] ameaça declarar todos os [heretic.GetFaith.GetAdherentNamePluralNoTooltip] como hereges!\n\nEsse terrível ato certamente traria seus colegas cristãos para cima de você em uma enxurrada de guerras santas, a menos que você possa convencer [hof.GetTitledFirstNameNoTooltip] do contrário.\n\nUma resposta deve ser elaborada."
 east_europe.0114.e.tt:0 "[hof.GetTitledFirstName] certamente declarará a $bosnian_church$ herética!"
 east_europe.0114.e:0 "Nossa fé é tão válida quanto a deles! Uma carta de desafio!"
 east_europe.0114.t:0 "$east_europe.0111.t.setup$: Inquisição [hof.GetFaith.GetAdjectiveNoTooltip]"
 east_europe.0115.a:0 "Droga, eu desisto!"
 east_europe.0115.b.toast:0 "[accuser.GetShortUIName] Irritado com sua evasão"
 east_europe.0115.b:0 "Uma vez herege, #EMP sempre#! herege!"
 east_europe.0115.desc.intro:0 "Maldito seja seu olhar infernal, [heretic.GetTitledFirstName] converteu-se!\n\n"
 east_europe.0115.desc.outro:0 "\n\nPor enquanto, a questão está resolvida. Hereges ou não, [hof.GetTitledFirstNameNoTooltip] está convencido de que a $bosnian_church$ está suficientemente sob o controle [hof.GetHerHim]."
 east_europe.0115.desc.political:0 "Embora [hof.GetTitledFirstName] pareça totalmente convencido, é transparente para mim que isso é um gesto político meio coração: [heretic.GetFirstNameNoTooltip] #EMP sozinho#! afirmou sua lealdade à fé do [hof.GetFaith.GetNameNoTooltip]. Nenhum vassalo ou membro da família ao lado [heretic.GetHerHim]."
 east_europe.0115.desc.wholehearted:0 "A ação parece ser de coração inteiro, e [heretic.GetSheHe] trouxe sua família imediata e vários magnatas importantes para a crença [hof.GetFaith.GetAdjective] com [heretic.GetSheHe]. Quase faz isso mais irritante."
 east_europe.0115.t:0 "$east_europe.0116.t$"
 east_europe.0116.a:0 "Não, uma conversão pessoal será suficiente."
 east_europe.0116.b:0 "Chega, todos nós seremos devotos [hof.GetFaith.GetAdherentNamePluralNoTooltip]!"
 east_europe.0116.desc:0 "[hof.GetTitledFirstName] exige um ato completo de contrição: uma conversão, abraçando completamente o [hof.GetFaith.GetNameNoTooltip].\n\nNo entanto, eu sei que meus companheiros [heretic.GetFaith.GetAdherentNamePluralNoTooltip] são fortes. Talvez, se apenas #EMP I#! me converter, isso seria suficiente.\n\nPor outro lado, isso simplesmente atrasaria a questão. Talvez seja melhor abraçarmos essa mudança agora, enquanto podemos fazê-lo pacificamente?"
 east_europe.0116.t:0 "$east_europe.0111.t.setup$: Uma mudança de coração"
 east_europe.0117.a:0 "Ah, um desperdício de tempo e esforço."
 east_europe.0117.b:0 "Isso é um ultraje!"
 east_europe.0117.c.toast:0 "$east_europe.0115.b.toast$"
 east_europe.0117.c:0 "[accuser.GetFaith.HighGodName] pode perdoar, mas eu não!"
 east_europe.0117.d:0 "Recusa #EMP me#! comunhão? Então vou fundar minha própria igreja #EMP maldita#!"
 east_europe.0117.desc.critical_success:0 "Ainda pior, de alguma forma, [heretic.GetTitledFirstName] persuadiu o [hof.GetFaith.ReligiousHeadName] a me excomungar! Que feitiçaria maldita ou segredo obscuro levou a isso, somente [heretic.GetFirstNameNoTooltip] pode saber, mas agora todos os senhores cristãos me olham com uma repulsa geralmente reservada para pagãos e cismáticos."
 east_europe.0117.desc.intro:0 "Infelizmente, [hof.GetTitledFirstName] optou #EMP não#! denunciar a $bosnian_church$ por heresia.\n\n"
 east_europe.0117.desc.outro:0 "\n\nPor enquanto, os hereges conseguiram algum espaço para respirar. Futuros [hof.GetFaith.ReligiousHeadName] podem não ser tão gentis com eles..."
 east_europe.0117.desc.political_leverage:0 "As circunstâncias que cercam isso são duvidosas no mínimo, já que as descobertas dos inquisidores enviados a [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip] são publicamente conhecidas e totalmente condenáveis. Parece que algum #EMP outro#! fator influenciou a mente do [hof.GetFaith.ReligiousHeadName]."
 east_europe.0117.desc.political_manoeuvrings:0 "Várias semanas de intensa troca de correspondência, depoimentos forjados e suborno dos inquisidores enviados para investigar [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip] deixaram o [hof.GetFaith.ReligiousHeadName] convencido de que minhas acusações foram motivadas apenas por um possível ganho político e minhas acusações totalmente falsas."
 east_europe.0117.desc.theological_debate:0 "Várias semanas de intenso debate acadêmico entre [hof.GetSheHe] e [heretic.GetTitledFirstName] fizeram com que o [hof.GetFaith.ReligiousHeadName] gradualmente se inclinasse para o modo de pensar de [heretic.GetFirstNamePossessiveNoTooltip], concordando que os [heretic.GetFaith.GetAdherentNamePluralNoTooltip] são simplesmente [hof.GetFaith.GetAdherentNamePluralNoTooltip] um pouco atrasados."
 east_europe.0117.t:0 "$east_europe.0111.t.setup$: Um adiamento temporário"
 east_europe.0118.a:0 "[heretic.GetFaith.FateGodName] sorri por nós!"
 east_europe.0118.b:0 "Alegro-me que esta questão esteja certamente resolvida."
 east_europe.0118.desc.critical_success:0 "De fato, com a aplicação da minha alavanca excessiva sobre o [hof.GetFaith.ReligiousHeadTitleName], até consegui virar o jogo contra o [accuser.Custom2('InsultAdjective', ROOT.Char)] [accuser.GetTitledFirstName].\n\nPor suas acusações espúrias contra os cristãos fiéis, [hof.GetTitledFirstNameNoTooltip] concordou em excomungar [accuser.GetSheHe]!"
 east_europe.0118.desc.intro:0 "Levou algumas semanas de negociações e cartas cuidadosamente redigidas, mas, finalmente, [hof.GetTitledFirstName] foi convencido do meu ponto de vista.\n\n"
 east_europe.0118.desc.outro:0 "\n\nOs fiéis [heretic.GetFaith.GetAdherentNamePluralNoTooltip] em todo lugar podem respirar aliviados."
 east_europe.0118.desc.political_leverage:0 "Todo o processo me custou a alavanca que eu tinha sobre o [hof.GetFaith.ReligiousHeadTitleName], mas [hof.GetTitledFirstNameNoTooltip] concordou relutantemente que não somos hereges, mas apenas ignorantes."
 east_europe.0118.desc.political_manoeuvrings:0 "O processo envolveu não poucas acusações recíprocas, cartas falsificadas do [accuser.GetTitledFirstName], e subornos criteriosos aos inquisidores visitantes, mas o [hof.GetFaith.ReligiousHeadTitleName] declarou formalmente que somos inocentes e que toda a questão é um assunto local."
 east_europe.0118.desc.theological_debate:0 "Embora o [hof.GetFaith.ReligiousHeadTitleName] ainda nos considere como selvagens atrasados, eles reconhecem que, embora desorientados, não somos hereges."
 east_europe.0118.t:0 "$east_europe.0111.t.setup$: Espaço para Respirar"
 east_europe.0119.a:0 "Vindicação!"
 east_europe.0119.desc.intro:0 "Previsivelmente, assim que [hof.GetSheHe] começou a investigar o assunto seriamente, [hof.GetTitledFirstName] descobriu uma grande quantidade de evidências de heresia entre os [heretic.GetFaith.GetAdherentNamePluralNoTooltip].\n\n"
 east_europe.0119.desc.outro:0 "\n\nCartas formais foram enviadas a todos os cristãos próximos de todas as crenças justas, denunciando [heretic.GetFirstNameNoTooltip] e sua fé blasfema."
 east_europe.0119.desc.political_manoeuvrings:0 "[heretic.GetTitledFirstName] tentou alegar que minha carta era movida por motivos egoístas, mas esse estratagema político grosseiro não encontrou simpatia no [hof.GetFaith.ReligiousHeadName], que o denunciou como uma tentativa de desviar a atenção do assunto em questão."
 east_europe.0119.desc.theological_debate:0 "[heretic.GetTitledFirstName], naturalmente, tentou se esquivar, mas o [hof.GetFaith.ReligiousHeadName] rejeitou seus argumentos teológicos pobres com desprezo."
 east_europe.0119.desc.unrepentant_heretics:0 "Quando confrontado, [heretic.GetTitledFirstName] não fez nenhum esforço para esconder seu desprezo pelo [hof.GetFaith.ReligiousHeadTitleName], zombando abertamente do [hof.GetFaith.ReligiousHeadName] enquanto defendia a validade de sua fé depravada!"
 east_europe.0119.t:0 "$east_europe.0111.t.setup$: Tolerância removida"
 east_europe.0120.a.tt:0 "Famintos [hof.GetFaith.GetAdherentNameNoTooltip] estão se voltando para suas terras..."
 east_europe.0120.a:0 "Isso é um desastre!"
 east_europe.0120.desc.intro:0 "Lamento informar que considero sua fé desviante em extremo, e não, como eu esperava, apenas retrógrada e corrigível.\n\n"
 east_europe.0120.desc.outro:0 "\n\nA partir deste dia em diante, os [heretic.GetFaith.GetAdherentNamePluralNoTooltip] serão considerados hereges por todos os cristãos justos. Que sua podridão apodreça no inferno!"
 east_europe.0120.desc.political_manoeuvrings:0 "Suas tentativas de classificar isso como uma manobra política puramente cínica são obviamente as mentiras desesperadas de um herege depravado, e não vou permitir que questione os motivos dos bons [hof.GetFaith.GetAdherentNamePluralNoTooltip]."
 east_europe.0120.desc.theological_debate:0 "Suas desculpas mal formuladas caem em ouvidos moucos. Esses argumentos teológicos infundados apenas #EMP provam#! sua culpa, e não posso tolerar tal pensamento heterodoxo."
 east_europe.0120.desc.unrepentant_heretics:0 "Que você admita sua culpa tão abertamente me confunde e entristece, pois mostra que não há chance de redenção para você. Eu rezo pelas almas desesperadas de seus súditos perdidos, mas é necessário fazer o que precisa ser feito."
 east_europe.0120.t:0 "[hof.Custom2('SaudaçãoApropriada',heretic)]"
 east_europe.0121.a:0 "Hereges? Em nosso meio?!"
 east_europe.0121.b:0 "Eu realmente não me importo."
 east_europe.0121.c:0 "Nós só queríamos ser deixados em paz!"
 east_europe.0121.desc.intro:0 "As últimas semanas foram marcadas por uma feroz guerra de palavras entre [accuser.GetFullName], [heretic.GetFullName] e [hof.GetTitledFirstName] sobre o status ecumênico da $bosnian_church$.\n\n"
 east_europe.0121.desc.outro:0 "Por decreto de [hof.GetTitledFirstNameNoTooltip], os [heretic.GetFaith.GetAdherentNamePluralNoTooltip] serão considerados hereges por todos os cristãos ecumênicos a partir deste dia!"
 east_europe.0121.desc.political_manoeuvrings:0 "Apesar dos melhores esforços de [heretic.GetFirstNameNoTooltip] para pintar a acusação de [accuser.GetFirstNamePossessiveNoTooltip] como uma manobra política, o [hof.GetFaith.ReligiousHeadName] se posicionou contra [heretic.GetSheHe].\n\n"
 east_europe.0121.desc.theological_debate:0 "A maior parte das discussões foi de natureza teológica, com [heretic.GetFirstNameNoTooltip] tentando tranquilizar [hof.GetTitledFirstNameNoTooltip] de que os [heretic.GetFaith.GetAdherentNamePluralNoTooltip] são bons [hof.GetFaith.GetAdherentNamePluralNoTooltip], simplesmente rurais em seus costumes.\n\nInfelizmente para [heretic.GetSheHe], isso não funcionou."
 east_europe.0121.desc.unrepentant_heretics:0 "No final, parece que a posição de [heretic.GetFirstNamePossessiveNoTooltip] estava fadada ao fracasso desde o início, pois [heretic.GetSheHe] optou por admitir as acusações de heterodoxia enquanto tentava pintar a sua fé como válida mesmo assim.\n\n"
 east_europe.0121.t:0 "$east_europe.0119.t$"
 east_europe.0123.a:0 "Não era para terminar assim!"
 east_europe.0123.desc.fallback:0 "$east_europe.0124.desc.fallback$"
 east_europe.0123.desc.heretic_died:0 "Com a morte de [heretic.GetTitledFirstName], [hof.GetTitledFirstName] parece estar satisfeito em assumir que qualquer heresia significativa também morreu, e a inquisição em [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip] foi cancelada."
 east_europe.0123.desc.heretic_not_independent_ruler:0 "Como [heretic.GetTitledFirstName] já não é um poder cristão independente, [hof.GetTitledFirstName] já não vê [heretic.GetSheHe] como alguém que vale a pena investigar como uma fonte de heresia."
 east_europe.0123.desc.heretic_now_different_heresy:0 "Com a conversão de [heretic.GetTitledFirstNamePossessive] para o [heretic.GetFaith.GetName], a questão da heresia mudou de um \"se\" para um \"qual\": os inquisidores do [hof.GetFaith.ReligiousHeadName] são incapazes de investigar a heterodoxia em um reino abertamente governado por um herege."
 east_europe.0123.desc.heretic_now_ecumenical_christian:0 "Com a conversão de [heretic.GetTitledFirstNamePossessive] para o [heretic.GetFaith.GetName], [hof.GetTitledFirstName] foi convencido da sincera devoção [heretic.GetHerHim] a [hof.GetFaith.HighGodName]."
 east_europe.0123.desc.heretic_now_heathen:0 "Com a conversão de [heretic.GetTitledFirstNamePossessive] para o [heretic.GetFaith.GetName], [heretic.GetSheHe] passou de potencial herege para pagão aberto. Na sequência deste tapa nu na cara de [hof.GetFaith.HighGodNamePossessive], o status ecumênico da $bosnian_church$ parece bastante irrelevante."
 east_europe.0123.desc.heretic_now_infidel:0 "Com a conversão de [heretic.GetTitledFirstNamePossessive] para o [heretic.GetFaith.GetName], [heretic.GetSheHe] passou de potencial herege para infiel certo. Desnecessário dizer que os inquisidores do [hof.GetFaith.ReligiousHeadName] foram expulsos sem cerimônia de [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 east_europe.0123.desc.hof_died:0 "Com a morte de [hof.GetTitledFirstName], a força eclesiástica motriz por trás da inquisição em [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip] desapareceu."
 east_europe.0123.desc.hof_no_longer_hof:0 "$east_europe.0124.desc.hof_no_longer_hof$"
 east_europe.0123.desc.intro:0 "$east_europe.0124.desc.intro$"
 east_europe.0123.desc.outro:0 "$east_europe.0124.desc.outro$"
 east_europe.0123.t:0 "$east_europe.0124.t$"
 east_europe.0124.a:0 "Bem, pelo menos isso está resolvido."
 east_europe.0124.desc.fallback:0 "Mudanças de circunstâncias além do nosso controle impediram qualquer chance de sucesso na inquisição contra [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 east_europe.0124.desc.heretic_died:0 "Após a morte de [heretic.GetTitledFirstName], [hof.GetTitledFirstName] parece satisfeito que quaisquer desvios importantes entre os $bosnian_church_adherent_plural$ logo desaparecerão, já que o suspeito heresiarca está, aparentemente, certo de ter ido para [hof.GetFaith.NegativeAfterLife|U]."
 east_europe.0124.desc.heretic_not_independent_ruler:0 "Agora que [Select_CString(heretic.IsLocalPlayer,'eu sou',heretic.GetShortUIName)][Select_CString(heretic.IsLocalPlayer,'',' é')] mais um governante cristão independente, [hof.GetTitledFirstName] não vê mais [Select_CString(heretic.IsLocalPlayer,'mim','eles')] como valendo a pena investigar."
 east_europe.0124.desc.heretic_now_different_heresy:0 "Com minha recente conversão ao [heretic.GetFaith.GetName], [hof.GetTitledFirstName] #JÁ!# me considera um herege, e está ocupado demais denunciando minha base falta de fé para apoiar seriamente a própria inquisição [hof.GetHerHim] investigando uma potencial heresia menor."
 east_europe.0124.desc.heretic_now_ecumenical_christian:0 "Com minha recente conversão ao [heretic.GetFaith.GetName], [hof.GetTitledFirstName] não tem mais motivos para duvidar da minha fé em [hof.GetFaith.HighGodName]."
 east_europe.0124.desc.heretic_now_heathen:0 "Com minha recente conversão para o [heretic.GetFaith.GetName], [hof.GetTitledFirstName] me proclamou um [hof.Custom('GetDerogatoryNonbeliever')] desalmado e apóstata do pior tipo. Se eu ainda me importasse um pouco com o deus morto [hof.GetHerHim], eu poderia até me sentir um pouco magoado."
 east_europe.0124.desc.heretic_now_infidel:0 "Com minha recente conversão ao [heretic.GetFaith.GetName], [hof.GetTitledFirstName] me declarou um [hof.Custom('GetDerogatoryNonbeliever')] e traidor perante [hof.GetFaith.HighGodName]. Os crimes potenciais dos $bosnian_church_adherent_plural$ devem parecer bastante leves em comparação."
 east_europe.0124.desc.hof_died:0 "Após a morte de [hof.GetTitledFirstName], a inquisição sobre [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip] se desfez, com muitos importantes dignitários da igreja chamados para lidar com a sucessão eclesiástica."
 east_europe.0124.desc.hof_no_longer_hof:0 "Com a expulsão do antigo [absolute_faith.ReligiousHeadName] [hof.GetFirstName], o caos envolveu a inquisição sobre [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip], e qualquer chance de um veredicto útil evaporou."
 east_europe.0124.desc.intro:0 "A fortuna parece estar com os $bosnian_church_adherent_plural$.\n\n"
 east_europe.0124.desc.outro:0 "\n\nPor enquanto, a [absolute_faith.ReligiousHeadTitleName] abandonou o caso, insistindo que tem assuntos mais urgentes para atender."
 east_europe.0124.t:0 "$east_europe.0111.t.setup$: O Caso Falha"
 east_europe.0141.a.tt:0 "Você pode usar o caso especial de invasão húngara única [hungarian_invasion_casus_belli|E] contra qualquer governante em Pannonia."
 east_europe.0141.a:0 "Para Pannonia!"
 east_europe.0141.desc:0 "A vida nas estepes pode ser difícil mesmo nos melhores momentos. Recentemente, no entanto, ela se tornou ainda mais difícil, com muitas outras tribos nômades invejosas buscando nos perseguir por nosso sucesso. Pechenegues, Khazars e outros viajam de longe para assediar nossa confederação.\n\nEm séculos passados, povos inteiros deixaram essa vida pelos campos férteis e reinos fracos da Europa.\n\nHoje, decidi emular o sucesso desses nômades antigos e esculpir um novo lar para o $mogyer_collective_noun$ em distante Pannonia, desarraigando todo o meu reino no processo.\n\nLogo, cruzaremos os Cárpatos como um só e abriremos um novo capítulo para o nosso povo."
 east_europe.0141.t:0 "Último suspiro das grandes migrações"
 east_europe.0142.a.tt:0 "O $mogyer_collective_noun$ começa a [hungarian_invasion|E]"
 east_europe.0142.a:0 "Uma missão imprudente!"
 east_europe.0142.desc:0 "Em uma jogada inesperada, meu vassalo, [mogyer_invader.GetShortUIName], enviou emissários para me informar que [mogyer_invader.GetSheHe] pretende tirar seu povo do seu reino atual e se mudar completamente para Pannonia.\n\nSe isso for bem-sucedido, meu controle na área provavelmente irá se desintegrar."
 east_europe.0142.t:0 "$east_europe.0141.t$"
 east_europe.0143.a.tt:0 "$east_europe.0142.a.tt$"
 east_europe.0143.a:0 "Certamente eles nunca atravessarão os Cárpatos?"
 east_europe.0143.desc.fallback:0 "Más notícias da estepe! Vassalos aflitos encaminharam relatórios"
 east_europe.0143.desc.outro:0 "que [mogyer_invader.GetShortUIName], um senhor da guerra $mogyer$, está reunindo toda a força de seu reino para lançar uma invasão conquistadora de Pannonia. \n\nAté agora, as hordas $mogyer$ estão se reunindo, preparando-se para inundar a planície em cima de seus corcéis demoníacos e derrubar toda a ordem local!"
 east_europe.0143.desc.pannonian_capital:0 "Terríveis notícias da estepe! Traders e espiões trazem a palavra"
 east_europe.0143.desc.pannonian_territory:0 "Notícias preocupantes da estepe! Senhores locais afirmam"
 east_europe.0143.t:0 "$east_europe.0141.t$"
 east_europe.0200.a:0 "Meu legado durará além da minha vida!"
 east_europe.0200.b:0 "Pela [founder.GetFaith.HighGodName] e glória!"
 east_europe.0200.desc.christian:0 "Os Bálticos têm sido, por séculos, primitivos e selvagens, habitados por várias heresias e adoradores do diabo. Com a coroação de um [founder.GetTitleAsNameNoTooltip] [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] da Livônia, o poder de [founder.GetFaith.HighGodName] aquece esta terra úmida e fria.\n\nCom a missão [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] tendo sucesso nos Bálticos, eu sou livre para proclamar a Livônia; um título para unir a todos por trás da nossa missão compartilhada de espalhar a palavra de [founder.GetFaith.random_GoodGodNames]."
 east_europe.0200.desc.nonchristian:0 "Os Bálticos têm sido desprovidos de um reino para seu próprio povo por séculos, enquanto vikings devastavam nossas vilas costeiras e missionários estrangeiros de terras distantes nos chamavam de primitivos e selvagens — mas não mais. Os diferentes povos bálticos agora se ajoelham juntos perante a coroa da Livônia.\n\nCom minha coroação como [founder.GetTitleAsNameNoTooltip], eu trarei uma era de ouro não só para o povo [founder.GetCulture.GetName], mas para todos os bálticos na costa."
 east_europe.0200.desc.outro:0 "\n\nEu tenho o destino dos Bálticos em minhas mãos, e com a fundação deste reino, eu trarei uma nova era de ouro de fé e glória sob o comando de [founder.GetFaith.HighGodName]."
 east_europe.0200.t:0 "O [founder.GetTitleAsNameNoTooltip] da Livônia"
 east_europe.0201.a:0 "Eles ainda são bárbaros."
 east_europe.0201.b:0 "Salve [founder.GetShortUINameNoTooltip]!"
 east_europe.0201.c:0 "Unidos ou divididos, os bálticos não podem durar para sempre."
 east_europe.0201.desc:0 "Heralds trazem notícias das frias costas da Livônia: [founder.GetShortUIName] foi proclamado [founder.GetTitleAsNameNoTooltip] de [founder.GetPrimaryTitle.GetNameNoTier].\n\nCom todos os bálticos agora unidos sob uma única bandeira, parece que o povo da Livônia finalmente tem uma identidade unificadora para se unir, sem mais dispersos e confusos na defesa de sua terra natal.\n\nCom este ato de unificação, a Livônia parece estar em mãos seguras... por enquanto."
 east_europe.0201.t:0 "$east_europe.0101.t$"
