l_spanish:
 FACTION_CEREMONIAL_CLAIMANT_INVITE:0 "[faction_invite_from.Custom2('AppropriateGreeting', ROOT.Char)]"
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPT:0 "Finalmente!"
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED:0 "[faction_claimant.Custom2('AppropriateGreeting', ROOT.Char)]"
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED_DESC:0 "Finalmente! [faction_target.GetName] não passa de um bobo fantasiado de [faction_target.GetTitleAsNameNoTooltip], e estou certo de que o reino se erguerá pela minha causa. Aqueles que me ajudarem não serão esquecidos."
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED_OPT:0 "É apenas uma questão de tempo..."
 FACTION_CEREMONIAL_CLAIMANT_INVITE_DESC:0 "[faction_target.GetName] ocupa um trono que por direito deveria ser seu! Estou disposto a apoiar sua reivindicação com palavra e espada, e tenho certeza de que outros no reino também defenderão essa causa legítima. Tudo o que precisa fazer é aceitar."
 FACTION_CEREMONIAL_CLAIMANT_INVITE_REFUSE:0 "Não é certo..."
 FACTION_CLAIMANT_EVERY_FACTION_MEMBER:0 "Cada membro da facção"
 FACTION_CLAIMANT_INVITE:0 "[faction_invite_from.Custom2('AppropriateGreeting', ROOT.Char)]"
 FACTION_CLAIMANT_INVITE_ACCEPT:0 "Finalmente!"
 FACTION_CLAIMANT_INVITE_ACCEPTED:0 "[faction_claimant.Custom2('AppropriateGreeting', ROOT.Char)]"
 FACTION_CLAIMANT_INVITE_ACCEPTED_DESC:0 "Finalmente! [faction_target.GetName] nada mais é do que um bobo da corte agindo [faction_target.GetTitleAsNameNoTooltip], e tenho certeza de que o reino se levantará à minha causa. Aqueles que me ajudam não serão esquecidos."
 FACTION_CLAIMANT_INVITE_ACCEPTED_OPT:0 "É apenas uma questão de tempo..."
 FACTION_CLAIMANT_INVITE_DESC:0 "[faction_target.GetName] ocupa um trono que deveria ser seu! Estou disposto a apoiar sua reivindicação com a palavra e a espada, e tenho certeza de que outros no reino também defenderão esta justa causa. Tudo que você precisa fazer é aceitar."
 FACTION_CLAIMANT_INVITE_REFUSE:0 "Não é certo..."
 FACTION_CLAIMANT_INVITE_REFUSED:0 "[faction_claimant.Custom2('AppropriateGreeting', ROOT.Char)]"
 FACTION_CLAIMANT_INVITE_REFUSED_ALLY_DESC:0 "Minha afirmação é justa, isso eu sei. Mas minha aliança com [faction_target.GetTitledFirstName] me impede de ir para a guerra. Eu estarei com você em espírito."
 FACTION_CLAIMANT_INVITE_REFUSED_CHILD_DESC:0 "Estou feliz que você também pense isso [faction_target.GetTitledFirstName] é um verdadeiro malvado, e que eu seria um governante muito melhor do que [faction_target.GetSheHe]!\n\nEstou ocupado(a) brincando com meus novos brinquedos agora ... mas se você ganhar prometo que os compartilharei com você!"
 FACTION_CLAIMANT_INVITE_REFUSED_DESC:0 "Embora aprecie seu entusiasmo por minha reivindicação, não posso deixar de sentir que esse esforço está fadado ao fracasso. Não vou lhe dar meu apoio como resultado, mas se você de alguma forma conseguir ter sucesso de qualquer maneira, aceitarei meu lugar no trono."
 FACTION_CLAIMANT_INVITE_REFUSED_HOOK_DESC:0 "Embora minha reivindicação seja justa, eu simplesmente não posso me juntar a você. [faction_target.GetTitledFirstName] tem esse... #emphasis 'charme inegável'#! que me impede de levantar a mão contra [faction_target.GetSheHe]. Sim, é isso. Desejo-lhe boa sorte."
 FACTION_CLAIMANT_INVITE_REFUSED_INSIGNIFICANT_DESC:0 "Finalmente! [faction_target.GetName] nada mais é do que um bobo da corte agindo [faction_target.GetTitleAsNameNoTooltip], e tenho certeza de que o reino se levantará à minha causa.\n\nDevido ao meu atual status humilde, não posso ajudá-lo. Mas saiba disso – #emphasis quando#! você é vitorioso, eu o verei recompensado generosamente!"
 FACTION_CLAIMANT_INVITE_REFUSED_OPT:0 "Infelizmente."
 FACTION_CLAIMANT_INVITE_REFUSED_PREDICAMENT_DESC:0 "Mesmo estando feliz em ver o reino se erguer contra o falso [faction_target.GetTitledFirstName] minha situação atual me impede de me juntar a você neste esforço justo. Se você conseguir, estarei em dívida com você."
 FACTION_CLAMAINT_DYNAMIC_NAME:0 "Instalar [ROOT.Faction.GetSpecialCharacter.GetTitledFirstName] no Trono [ROOT.Faction.GetSpecialTitle.GetAdjective]"
 FACTION_DEMAND_ACCEPT:0 "Acho que não tenho escolha ..."
 FACTION_DEMAND_ACCEPTED_OPT:0 "Uma decisão sábia"
 FACTION_DEMAND_BRIBE_CO_EMPEROR:0 "Certamente um presente de cargo pode forçar a cooperação deles?"
 FACTION_DEMAND_BRIBE_CO_EMPEROR_REASON:0 "[faction_leader.GetShortUIName|U] deve ser o [claimant|E] de [faction|E] #weak ([faction.GetSpecialCharacter.GetTitledFirstName])#!"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT:0 "Exigência do Reivindicante Cerimonial"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_ACCEPTED:0 "Exigências do Reivindicante Cerimonial Aceitas"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_ACCEPTED_DESC:0 "Está claro para mim que você veria o reino arder antes de abandonar essa empresa tola. Pelo bem do reino, devo aceitar suas exigências, mas saiba que aqui foi feita uma grande injustiça. Isto não ficará impune!"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_DESC:0 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nNinguém pode negar que [faction_claimant.GetName], e não [faction_targeted_title.GetHolder.GetFirstName], é o soberano legítimo de [faction_targeted_title.GetNameNoTier].\n\nAceite este fato pacificamente ou nós o faremos aceitar pela força!"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_DESC_ME:0 "[faction_targeted_title.GetDefinitiveName|U] me pertence por direito divino, e finalmente tenho os meios para torná-lo assim. Aceite este fato pacificamente ou eu o farei aceitar pela força!"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_REFUSED:0 "Exigências do Reivindicante Cerimonial Recusadas"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_REFUSED_DESC:0 "Seu apoio à reivindicação de [faction_claimant.GetShortUIName|U] sobre [faction_targeted_title.GetDefinitiveName|l] é uma afronta à dignidade do nosso legítimo [faction_targeted_title.GetHolder.GetTitleAsName]!\n\nSua traição e desonra logo encontrarão julgamento divino, infame traidor!"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_SEND_DEMAND_NOTIFICATION:0 "Uma Reivindicação Justa!"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_SEND_DEMAND_NOTIFICATION_DESC:0 "Chegou o momento! Todos os que apoiam [faction_claimant.GetName] como o legítimo [faction_targeted_title.GetHolder.GetTitleAsName] agora se erguerão como um só e farão com que [faction_claimant.GetSheHe] ocupe o lugar que lhe é devido em [faction_targeted_title.GetDefinitiveName|l]. Veremos isso acontecer, pela espada e pelo fogo se necessário!"
 FACTION_DEMAND_CLAIMANT:0 "Demanda Reclamante"
 FACTION_DEMAND_CLAIMANT_ACCEPTED:0 "Demanda dos Reclamantes aceita"
 FACTION_DEMAND_CLAIMANT_ACCEPTED_DESC:0 "É claro para mim que você veria o reino queimar antes de desistir dessa aventura tola. Pelo bem do [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], devo aceitar suas demandas, mas saiba que uma grande injustiça foi cometida aqui hoje. Isso não vai ficar!"
 FACTION_DEMAND_CLAIMANT_DESC:0 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nO direito de governar [faction_targeted_title.GetNameNoTier] pertence a [faction_claimant.GetName] por direito divino, e reunimos o apoio necessário para fazê-lo. Aceite este fato pacificamente ou faremos com que o faça pela força!"
 FACTION_DEMAND_CLAIMANT_DESC_ME:0 "O direito de governar [faction_targeted_title.GetNameNoTier] pertence a mim por direito divino, e finalmente tenho os meios para fazê-lo. Aceite este fato pacificamente ou farei com que o faça à força!"
 FACTION_DEMAND_CLAIMANT_REFUSED:0 "Demanda dos Reclamantes recusada"
 FACTION_DEMAND_CLAIMANT_REFUSED_DESC:0 "A reivindicação de [faction_claimant.GetShortUINamePossessive|U] sobre meu título não é mais real do que as histórias que contamos para crianças à noite. Não importa quantos tolos equivocados você tenha reunido para ajudar a realizar seu plano, eu não vou ceder a tal coleção de porcarias. Prefiro morrer do que ver meu direito de nascimento cair para alguém tão baixo!"
 FACTION_DEMAND_CLAIMANT_SEND_DEMAND_NOTIFICATION:0 "Um direito legítimo!"
 FACTION_DEMAND_CLAIMANT_SEND_DEMAND_NOTIFICATION_DESC:0 "Chegou o momento! Todos que apoiam [faction_claimant.GetName] como o governante legítimo de [faction_targeted_title.GetNameNoTier] agora se levantarão como um só para garantir que [faction_claimant.GetSheHe] possa assumir seu lugar de direito no trono. Veremos isso realizado, pela espada e pelo fogo, se necessário!"
 FACTION_DEMAND_COLLAPSE:0 "Demanda de Dissolução de [faction_target.GetPrimaryTitle.GetNameNoTier]"
 FACTION_DEMAND_COLLAPSE_ACCEPTED:0 "Demandas de Dissolução Aceitas"
 FACTION_DEMAND_COLLAPSE_ACCEPTED_DESC:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nSuas demandas equivocadas só servirão para nos enfraquecer a todos. De qualquer forma, para poupar o reino de um derramamento de sangue fútil, sou forçado a aceitar seu pedido de independência."
 FACTION_DEMAND_COLLAPSE_DESC:0 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nÉ hora de você reconhecer que não é capaz de manter a unidade de [faction_target.GetPrimaryTitle.GetNameNoTier]. É hora de acabar com o seu reinado ou de qualquer outro: a região precisa de mais liberdade. Aceite nossas demandas ou enfrente nossas espadas no campo de batalha!"
 FACTION_DEMAND_COLLAPSE_REFUSED:0 "Demandas de Dissolução Recusadas"
 FACTION_DEMAND_COLLAPSE_REFUSED_DESC:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nSua tentativa vergonhosa de chantagem não obteve sucesso. Não importa quantas almas corrompidas você tenha atraído para ajudar a realizar seu plano, eu não vou ceder sem lutar. Eu prefiro morrer defendendo o que é legitimamente meu!"
 FACTION_DEMAND_COLLAPSE_SEND_DEMAND_NOTIFICATION:0 "Fim de [faction_target.GetPrimaryTitle.GetNameNoTier]!"
 FACTION_DEMAND_COLLAPSE_SEND_DEMAND_NOTIFICATION_DESC:0 "Chegou o momento! As vozes unificadas da [faction.GetName] concordam que [faction_target.GetName] perdeu qualquer direito de governar que [faction_target.GetSheHe] possa ter tido. Seremos dados a nossa independência ou a tomaremos à força!"
 FACTION_DEMAND_COUNTER_OFFER_CORULE:0 "Contraoferta da Facção"
 FACTION_DEMAND_COUNTER_OFFER_CORULE_ACCEPT:0 "Uma oferta que não posso recusar..."
 FACTION_DEMAND_COUNTER_OFFER_CORULE_DESC:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nSuas demandas têm mérito — talvez até mostrando erros no meu próprio julgamento. Baixe suas armas e junte-se a mim como meu Co-[faction_target.GetTitleAsNameNoTooltip], e nós governaremos [faction_target.GetPrimaryTitle.GetDefinitiveName] juntos!"
 FACTION_DEMAND_COUNTER_OFFER_CORULE_MEMBER_NOTIFICATION:0 "Líder da Facção Elevado"
 FACTION_DEMAND_COUNTER_OFFER_CORULE_MEMBER_NOTIFICATION_DESC:0 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nEstou feliz em informar que [faction_target.GetTitledFirstName] se voltou para o nosso modo de pensar. [faction_target.GetSheHe|U] nomeou #EMP a mim#! como Co-[faction_target.GetTitleAsNameNoTooltip], e concordei que devemos deitar nossas espadas. Com efeito imediato."
 FACTION_DEMAND_COUNTER_OFFER_CORULE_REJECT:0 "Bah, nada mais que um cálice envenenado!"
 FACTION_DEMAND_COUNTER_OFFER_MEMBER_NOTIFICATION.A:0 "Estivemos tão perto..."
 FACTION_DEMAND_COUNTER_OFFER_MEMBER_NOTIFICATION.B:0 "Aquele tolo egoísta!"
 FACTION_DEMAND_IMPERIAL_POLICY:0 "Política Imperial"
 FACTION_DEMAND_IMPERIAL_POLICY_ACCEPTED:0 "Exigências de Política Imperial Aceitas"
 FACTION_DEMAND_IMPERIAL_POLICY_ACCEPTED_DESC:0 "Está claro para mim que você preferiria ver o reino em chamas a desistir dessa tolice. Pelo bem de [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], devo aceitar suas exigências — mas saiba que uma grande injustiça foi cometida aqui hoje. Isso não ficará assim!"
 FACTION_DEMAND_IMPERIAL_POLICY_DESC:0 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nOs súditos leais do reino suportaram suas políticas equivocadas por tempo demais. A [faction.GetName] exige que você consinta em uma nova direção para [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], ou nós forçaremos uma sobre você!"
 FACTION_DEMAND_IMPERIAL_POLICY_REFUSED:0 "Exigências de Política Imperial Recusadas"
 FACTION_DEMAND_IMPERIAL_POLICY_REFUSED_DESC:0 "Seu desrespeito arrogante e petulante pelas políticas sensatas do meu governo apenas prova o quão inapto você é para tomar tais decisões!\n\nSua traição e desonra em breve encontrarão julgamento divino, vil traidor!"
 FACTION_DEMAND_IMPERIAL_POLICY_SEND_DEMAND_NOTIFICATION:0 "Mudando o Rumo"
 FACTION_DEMAND_IMPERIAL_POLICY_SEND_DEMAND_NOTIFICATION_DESC:0 "O momento chegou! Todos que apoiam abortar as políticas equivocadas de [faction_target.GetTitledFirstName] agora se erguerão como um só e garantirão que o reino seja conduzido em uma nova direção. Faremos isso acontecer, pela espada e pelo fogo, se necessário!"
 FACTION_DEMAND_INDEPENDENCE:0 "Demanda de Independência"
 FACTION_DEMAND_INDEPENDENCE_ACCEPTED:0 "Demandas de independência aceitas"
 FACTION_DEMAND_INDEPENDENCE_ACCEPTED_DESC:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nSuas demandas equivocadas só servirão para nos enfraquecer a todos. No entanto, para poupar o reino de derramamento de sangue fútil, sou obrigado a aceitar seu pedido de independência."
 FACTION_DEMAND_INDEPENDENCE_DESC:0 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nÉ hora de você reconhecer a total independência de [faction_leader.GetPrimaryTitle.GetNameNoTier] e os outros estados no [faction.GetName]. Aceite nossas demandas ou enfrente nossas espadas no campo de batalha!"
 FACTION_DEMAND_INDEPENDENCE_REFUSED:0 "Demandas de independência recusada"
 FACTION_DEMAND_INDEPENDENCE_REFUSED_DESC:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nSua vergonhosa tentativa de chantagem não teve sucesso. Não importa quantas almas corrompidas você tenha seduzido para ajudar a realizar seu plano, não vou desistir sem lutar. Prefiro morrer defendendo o que é meu por direito!"
 FACTION_DEMAND_INDEPENDENCE_SEND_DEMAND_NOTIFICATION:0 "Independência!"
 FACTION_DEMAND_INDEPENDENCE_SEND_DEMAND_NOTIFICATION_DESC:0 "Chegou o momento! As vozes unificadas de [faction.GetName] concorda que [faction_target.GetName] perdeu qualquer direito de regra que [faction_target.GetSheHe] poderia ter tido. Devemos ter nossa independência ou tomá-la à força!"
 FACTION_DEMAND_LIBERTY:0 "Demanda de Liberdade"
 FACTION_DEMAND_LIBERTY_ACCEPTED:0 "Demanda de Liberdade aceita"
 FACTION_DEMAND_LIBERTY_ACCEPTED_DESC:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nSuas noções egoístas de 'liberdade' enfraquecerão o Reino como um todo. No entanto, para evitar derramamento de sangue desnecessário, aceitarei suas demandas."
 FACTION_DEMAND_LIBERTY_DESC:0 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nÉ hora de você reconhecer os direitos antigos e inalienáveis de seus vassalos! Aceite as demandas de [faction.GetName] ou enfrente nossas espadas no campo de batalha!"
 FACTION_DEMAND_LIBERTY_REFUSED:0 "Demanda de Liberdade recusada"
 FACTION_DEMAND_LIBERTY_REFUSED_DESC:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nSua tentativa ridícula de intimidação nunca terá sucesso. Eu sou [Select_CString( faction_target.IsFemale, 'a', 'o' )] [faction_target.GetTitleAsNameNoTooltip]! Seu miserável bando de traidores aprenderá seu lugar no campo de batalha!"
 FACTION_DEMAND_LIBERTY_SEND_DEMAND_NOTIFICATION:0 "Liberdade ou morte!"
 FACTION_DEMAND_LIBERTY_SEND_DEMAND_NOTIFICATION_DESC:0 "Chegou o momento! Os senhores da [faction.GetName] concordo que [faction_target.GetName] é um déspota que deve ceder sua autoridade tirânica sobre nós... na ponta da espada, se necessário."
 FACTION_DEMAND_NOMADIC:0 "[Select_CString( ROOT.Char.IsFemale, 'A', 'Ao' )] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('peasant_leader'))] [ROOT.Char.GetTitledFirstName]"
 FACTION_DEMAND_NOMADIC_ACCEPT_GRANT_INDEPENDENCE:0 "Tudo bem! Meu reino não tem lugar para seus rebanhos imundos."
 FACTION_DEMAND_NOMADIC_DESC:0 "Não nos curvaremos mais sob o seu jugo de opressão! Nós, os orgulhosos [GetGovernment( 'nomad_government' ).GetName] [peasant_leader.GetCulture.GetCollectiveNoun], nascemos para vagar livres sob esses céus infinitos.\n\nCom [peasant_leader.GetFaith.WarGodName] guiando nossos cavaleiros, quebraremos seu governo patético e reconquistaremos nosso lugar na vasta estepe!"
 FACTION_DEMAND_NOMADIC_VASSAL_DESC:0 "Não toleraremos mais sua vileza em oprimir os orgulhosos [peasant_leader.GetFaith.GetAdherentNamePlural] [peasant_leader.GetCulture.GetName]. Nascemos para vagar livres sob esses céus abertos, rejeitamos sua tirania — nossa hora chegou!\n\nDesafiaremos o seu governo e o de seu senhor, [faction_target.GetTitledFirstName], uma vez por todas!!"
 FACTION_DEMAND_NOMADIC_VASSAL_JOIN_WAR:0 "Então me encontrarei com você no campo de batalha, #EMP vagabundo#!!"
 FACTION_DEMAND_PEASANT:0 "Ao [ROOT.Char.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.GetTitledFirstName]"
 FACTION_DEMAND_PEASANT_ACCEPT:0 "Acho que poderia conceder uma garantia fiscal ..."
 FACTION_DEMAND_PEASANT_DESC:0 "Temos sido oprimidos por suas leis opressivas por muito tempo. Não mais! Paramos de pagar seus impostos.\n\nAssim que seus cofres secarem e suas despensas estiverem vazias, você desejará ter nos tratado com mais justiça."
 FACTION_DEMAND_PEASANT_REFUSE:0 "Nunca! O destino do camponês é servir ao seu senhor!"
 FACTION_DEMAND_POPULIST:0 "Ao [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('peasant_leader'))] [ROOT.Char.GetTitledFirstName]"
 FACTION_DEMAND_POPULIST_ACCEPT_CONVERT:0 "Agora espere ... e se eu adotasse seus métodos em vez disso?"
 FACTION_DEMAND_POPULIST_ACCEPT_CONVERT_STATE_FAITH:0 "[peasant_leader.GetFaith.GetNameNoTooltip|U] receberá esta honra."
 FACTION_DEMAND_POPULIST_ACCEPT_GRANT_INDEPENCE_TT:0 "#N Isso vai deixar você sem terra!#!"
 FACTION_DEMAND_POPULIST_ACCEPT_GRANT_INDEPENDENCE:0 "Tudo bem, não preciso de assuntos tão briguentos!"
 FACTION_DEMAND_POPULIST_DESC:0 "Não vamos tolerar sua opressão vil dos bons [peasant_leader.GetFaith.GetAdherentNamePlural] [peasant_leader.GetCulture.GetName] não mais. Nosso tempo agora está próximo!\n\nCom [peasant_leader.GetFaith.WarGodName] nos guiando, vamos nos levantar e nos libertar de suas [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)] regras!"
 FACTION_DEMAND_POPULIST_DESC_ADMIN:0 "Não permitiremos mais opressão sob o seu domínio [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)]. [peasant_leader.GetFaith.GetName|U] deve ser reconhecido como a fé preeminente do [ROOT.Char.GetPrimaryTitle.GetName]!\n\nDê à nossa fé o status que merece, ou prepare-se para enfrentar a ira de nossos muitos fiéis!"
 FACTION_DEMAND_POPULIST_DESC_CULTURE:0 "Não vamos tolerar a opressão estrangeira de [peasant_leader.GetCulture.GetName] tradições mais. Nosso tempo agora está próximo!\n\nDê-nos o direito de nos governarmos como quisermos, ou enfrentaremos a ira combinada de todos os meus compatriotas!"
 FACTION_DEMAND_POPULIST_DESC_FAITH:0 "Não vamos tolerar sua opressão vil de fiéis [peasant_leader.GetFaith.GetAdherentNamePlural] não mais. Nosso tempo agora está próximo!\n\nCom [peasant_leader.GetFaith.WarGodName] nos guiando, vamos nos levantar e nos libertar de suas [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)] regras!"
 FACTION_DEMAND_POPULIST_REFUSE:0 "Você quer liberdade? Você o terá na morte!"
 FACTION_DEMAND_POPULIST_REFUSE_ADMIN:0 "Tais mudanças não são suas para fazer, [peasant_leader.Custom2('InsultNoun', ROOT.Char)] insolente!"
 FACTION_DEMAND_POPULIST_REFUSE_TT:0 "#high [peasant_leader.GetTitledFirstName]#! e a #high [faction.GetName]#! declaram [war|E] a você"
 FACTION_DEMAND_POPULIST_VASSAL_CONVERTS:0 "Espere! E se eu adotasse seus caminhos e #EMP ajudasse#! vocês?"
 FACTION_DEMAND_POPULIST_VASSAL_CONVERTS_TT:0 "Você ajudará os rebeldes contra seu [liege|E]"
 FACTION_DEMAND_POPULIST_VASSAL_DESC:0 "Não toleraremos mais a opressão vil contra os bons [peasant_leader.GetFaith.GetAdherentNamePlural] [peasant_leader.GetCulture.GetName]. Nosso tempo chegou!\n\nNos libertaremos do seu domínio e da tirania do seu senhor feudal, [faction_target.GetTitledFirstName]!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_CULTURE:0 "Não toleraremos mais a opressão estrangeira às tradições [peasant_leader.GetCulture.GetName]. Nosso tempo chegou!\n\nNão exigiremos nada menos do que total liberdade do seu senhor feudal, [faction_target.GetTitledFirstName]!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_FAITH:0 "Não toleraremos mais a sua opressão vil contra os [peasant_leader.GetFaith.GetAdherentNamePlural] fiéis. Nosso tempo chegou!\n\nCom [peasant_leader.GetFaith.WarGodName] nos guiando, nos levantaremos e nos libertaremos do domínio do seu senhor feudal, [faction_target.GetTitledFirstName]!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_SAME_CULTURE_AND_FAITH:0 "Você pode compartilhar nossas tradições e crenças, mas não podemos mais tolerar você ou o [faction_target.Custom2('InsultAdjective', SCOPE.sC('peasant_leader'))] [faction_target.GetTitledFirstName]!\n\nOu você fica de lado, ou nos ajuda a obter a liberdade que merecemos!"
 FACTION_DEMAND_POPULIST_VASSAL_JOIN_REBELS:0 "Deixe-me unir-me à sua causa!"
 FACTION_DEMAND_POPULIST_VASSAL_JOIN_WAR:0 "Então eu vou encontrá-los no campo de batalha, #EMP traidor#!!"
