 great_project_type_minister_project_culture_desc:0 "Como podemos ser realmente unificados se não compartilhamos valores comuns? Diferenças podem causar conflitos e agitação. Podemos resolver essas questões, ao menos parcialmente, com um esforço de integração a longo prazo. Um reino, um povo."
