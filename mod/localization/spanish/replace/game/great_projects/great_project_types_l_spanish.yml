 great_project_type_great_wall_desc:0 "A Grande Muralha é um testemunho da habilidade e engenhosidade de nossos predecessores em deter invasores potenciais. No entanto, como tudo mais, o tempo deixou suas marcas. A muralha precisa urgentemente de melhorias."
