 great_project_type_great_wall_extend_to_shanhai_pass_contribution_personnel_dig:0 "Equipe de Escavação"
 great_project_type_great_wall_extend_to_shanhai_pass_desc:0 "A Grande Muralha já é bastante impressionante, mas pode se tornar ainda mais e oferecer melhor proteção. Ao estender a muralha mais para o leste, até Shanhai Pass e a costa, podemos bloquear todo acesso do norte."
 great_project_type_great_wall_possessive:0 "da Grande Muralha"
 great_project_type_great_wall_province_gains_great_wall:0 "As [provinces|E] que tiveram suas [great_project_contributions|E] financiadas terão seus segmentos de [building|E] [GetBuilding('the_great_wall_04').GetName] aprimoradas"
 great_project_type_great_wall_province_has_great_wall:0 "[province.GetNameNoTooltip] contém um segmento de [GetBuilding('the_great_wall_01').GetName]"
 great_project_type_mandala_capital_01:0 "$building_type_mandala_capital_01$"
 great_project_type_mandala_capital_01_contribution_family_shrine:0 "Santuário Familiar"
 great_project_type_mandala_capital_01_contribution_family_shrine_desc:0 "Um Santuário dedicado à descendência de nossos grandes governantes será erguido."
 great_project_type_mandala_capital_01_contribution_laterite_blocks:0 "Blocos de Laterita"
 great_project_type_mandala_capital_01_contribution_laterite_blocks_desc:0 "O solo de laterita é necessário para uma fundação sólida, assim como para decoração."
 great_project_type_mandala_capital_01_contribution_ornate_reliefs:0 "Relevos Ornamentados"
 great_project_type_mandala_capital_01_contribution_ornate_reliefs_desc:0 "Relevos com devatas, apsaras e momentos divinos preencherão este lugar, para espanto de seus adoradores."
 great_project_type_mandala_capital_01_contribution_rite_of_worthiness:0 "Rito de Valor"
 great_project_type_mandala_capital_01_contribution_rite_of_worthiness_desc:0 "Provar-nos-emos dignos de construir um [GetBuilding('mandala_capital_01').GetTypeName], competindo pela devoção dos habitantes deste [kingdom|E] [de_jure|E]!"
 great_project_type_mandala_capital_01_contribution_sanctified_domes:0 "Cúpulas Sagradas"
 great_project_type_mandala_capital_01_contribution_sanctified_domes_desc:0 "Erigiremos cúpulas — construções humanas que nos permitem refletir sobre nossa própria engenhosidade."
 great_project_type_mandala_capital_01_contribution_slabs_of_sandstone:0 "Lajes de Arenito"
 great_project_type_mandala_capital_01_contribution_slabs_of_sandstone_desc:0 "Este templo venerará o divino, mas sua construção exige recursos terrenos. Fornecer ao [great_project|E] os materiais necessários é uma das maiores contribuições possíveis."
 great_project_type_mandala_capital_01_contribution_timber:0 "Madeira"
 great_project_type_mandala_capital_01_contribution_timber_desc:0 "Usaremos toda a madeira necessária para sustentar a estrutura com vigas, telhados, portas pivotantes — e também para painéis decorativos."
 great_project_type_mandala_capital_01_contribution_woodcarvings:0 "Entalhes em Madeira"
 great_project_type_mandala_capital_01_contribution_woodcarvings_desc:0 "Além dos painéis decorativos, criaremos entalhes e gravações para venerar o divino e trazer bênçãos ao nosso povo."
 great_project_type_mandala_capital_01_contribution_work_force:0 "Força de Trabalho"
 great_project_type_mandala_capital_01_contribution_work_force_desc:0 "Pedras não se movem sozinhas! Forneceremos ao [great_project|E] a mão de obra necessária para completar esta gloriosa tarefa."
 great_project_type_mandala_capital_01_desc:0 "Chegou a hora de deixar nossa marca para as gerações futuras. Erigiremos um poderoso templo para honrar nosso Devaraja!"
 great_project_type_mandala_capital_01_possessive:0 "do $building_type_mandala_capital_01$"
 great_project_type_mandala_capital_02:0 "Atualização do $building_type_mandala_capital_01$"
 great_project_type_mandala_capital_02_contribution_brick:0 "Tijolo"
 great_project_type_mandala_capital_02_contribution_brick_desc:0 "Nada pode ser criado do nada. Forneceremos ao [great_project|E] todos os tijolos necessários para concluir o trabalho no $building_mandala_capital_02$."
 great_project_type_mandala_capital_02_contribution_decorated_domes:0 "Cúpulas Decoradas"
 great_project_type_mandala_capital_02_contribution_decorated_domes_desc:0 "Uma boa cúpula é uma cúpula redonda. Elas serão redondas, com cristas e motivos interessantes em pouco tempo."
 great_project_type_mandala_capital_02_contribution_decorative_tiles:0 "Telhas Decorativas"
 great_project_type_mandala_capital_02_contribution_decorative_tiles_desc:0 "Vamos nos permitir e adicionar telhas decorativas aos telhados. Bordas curvas. Entalhes intrincados. Mais magnificência para agradar tanto aos olhos quanto ao divino."
 great_project_type_mandala_capital_02_contribution_family_statues:0 "Estátua Sagrada do Herdeiro"
 great_project_type_mandala_capital_02_contribution_family_statues_desc:0 "Os herdeiros de nossa linhagem divina terão seus visuais sagrados esculpidos em estátuas de pedra, para que sejam lembrados para sempre."
 great_project_type_mandala_capital_02_contribution_rite_of_worthiness:0 "Rito de Valor"
 great_project_type_mandala_capital_02_contribution_rite_of_worthiness_desc:0 "Provar-nos-emos dignos de expandir nosso [GetBuilding('mandala_capital_01').GetTypeName], competindo pela devoção dos habitantes deste [kingdom|E] [de_jure|E]!"
 great_project_type_mandala_capital_02_contribution_shallow_pools:0 "Piscinas Rasas"
 great_project_type_mandala_capital_02_contribution_shallow_pools_desc:0 "Elementos aquáticos são essenciais tanto para refrescar quanto para nos conectar ao plano divino."
 great_project_type_mandala_capital_02_contribution_tiles:0 "Pilha de Telhas"
 great_project_type_mandala_capital_02_contribution_tiles_desc:0 "Um telhado funcional é um telhado de telhas. Enviaremos nossas melhores telhas ao [great_project|E] para protegê-lo da umidade!"
 great_project_type_mandala_capital_02_contribution_work_force:0 "$great_project_type_mandala_capital_01_contribution_work_force$"
 great_project_type_mandala_capital_02_contribution_work_force_desc:0 "Grandes feitos exigem grande labor! Devemos fornecer mais mão de obra para o [great_project|E] terminar as reformas neste $building_mandala_capital_02$."
 great_project_type_mandala_capital_02_desc:0 "Agora temos capacidade para expandir nosso poderoso templo! Vamos criar uma maravilha que resistirá através das eras!"
 great_project_type_mandala_capital_02_possessive:0 "do $building_mandala_capital_02$"
 great_project_type_mandala_capital_03:0 "$great_project_type_mandala_capital_02$"
 great_project_type_mandala_capital_03_contribution_corbel_gateways:0 "Portais com Consolos"
 great_project_type_mandala_capital_03_contribution_corbel_gateways_desc:0 "Ao expandirmos o templo, precisamos de estruturas adequadas para sustentar a construção. Esses portais guiarão aqueles que percorrem os terrenos em busca de iluminação."
 great_project_type_mandala_capital_03_contribution_creation_aspect:0 "Estátuas da Criação"
 great_project_type_mandala_capital_03_contribution_creation_aspect_desc:0 "Estas cabeças gigantes olham para o horizonte, ocupadas planejando, organizando — sustentando a vida neste plano e no próximo. Elas têm uma semelhança marcante com nosso governante divino."
 great_project_type_mandala_capital_03_contribution_destruction_aspect:0 "Estátuas da Destruição"
 great_project_type_mandala_capital_03_contribution_destruction_aspect_desc:0 "Estas cabeças gigantes exibem uma expressão temível, prontas para atacar inimigos que ousarem invadir estes terrenos sagrados. Elas têm uma semelhança marcante com nosso governante divino."
 great_project_type_mandala_capital_03_contribution_divine_statues:0 "Estátuas Divinas"
 great_project_type_mandala_capital_03_contribution_divine_statues_desc:0 "Essas cabeças gigantes podem parecer imponentes, mas em essência santificam este lugar, instilando atmosfera e virtude."
 great_project_type_mandala_capital_03_contribution_family_temple_compound:0 "Complexo do Templo Familiar"
 great_project_type_mandala_capital_03_contribution_family_temple_compound_desc:0 "Um complexo sagrado para a adoração dos filhos do governante divino que construiu estes grandes templos."
 great_project_type_mandala_capital_03_contribution_gilded_domes:0 "Cúpulas Douradas"
 great_project_type_mandala_capital_03_contribution_gilded_domes_desc:0 "Para realmente irradiar seu esplendor, as cúpulas do $building_mandala_capital_03$ devem ser cobertas com o ouro mais fino que puder ser oferecido."
 great_project_type_mandala_capital_03_contribution_rite_of_worthiness:0 "Rito de Valor"
 great_project_type_mandala_capital_03_contribution_rite_of_worthiness_desc:0 "Provar-nos-emos dignos de expandir nosso [GetBuilding('mandala_capital_01').GetTypeName], ascendendo ainda mais nos anais da história!"
 great_project_type_mandala_capital_03_contribution_serenity_aspect:0 "Estátuas da Serenidade"
 great_project_type_mandala_capital_03_contribution_serenity_aspect_desc:0 "Estas cabeças gigantes transmitem paz e tranquilidade, aparentemente tendo alcançado a iluminação. Elas têm uma semelhança marcante com nosso governante divino."
 great_project_type_mandala_capital_03_contribution_trickery_aspect:0 "Estátuas da Astúcia"
 great_project_type_mandala_capital_03_contribution_trickery_aspect_desc:0 "Estas cabeças gigantes possuem um sorriso travesso e transmitem a sensação de que enxergam através de você — tanto no sentido literal quanto filosófico. Elas têm uma semelhança marcante com nosso governante divino."
 great_project_type_mandala_capital_03_contribution_volcanic_stone:0 "Pedra Vulcânica"
 great_project_type_mandala_capital_03_contribution_volcanic_stone_desc:0 "As ambições mais elevadas precisam das bases mais sólidas. Forneceremos ao [great_project|E] a rocha vulcânica necessária para construir fundações sólidas que durarão para sempre."
 great_project_type_mandala_capital_03_contribution_work_force:0 "$great_project_type_mandala_capital_01_contribution_work_force$"
 great_project_type_mandala_capital_03_contribution_work_force_desc:0 "Para alcançar o divino, devemos trabalhar arduamente. Mais homens são necessários para construir o $building_mandala_capital_03$, e nossa contribuição será ricamente recompensada."
 great_project_type_mandala_capital_03_desc:0 "$great_project_type_mandala_capital_02_desc$"
 great_project_type_mandala_capital_03_possessive:0 "do $building_mandala_capital_03$"
 great_project_type_mandala_capital_04:0 "$great_project_type_mandala_capital_02$"
 great_project_type_mandala_capital_04_contribution_bejeweled_domes:0 "Cúpulas Ajuadadas"
 great_project_type_mandala_capital_04_contribution_bejeweled_domes_desc:0 "Os céus devem brilhar sobre este $building_mandala_capital_04$, e forneceremos ao [great_project|E] as joias necessárias para que pareça que as próprias estrelas repousam entre os pilares deste complexo divino."
 great_project_type_mandala_capital_04_contribution_bell_stupas:0 "Stupas com Sino"
 great_project_type_mandala_capital_04_contribution_bell_stupas_desc:0 "O mármore mais fino será oferecido para o $building_mandala_capital_05$, para que ele descanse sobre as fundações mais elegantes."
 great_project_type_mandala_capital_04_contribution_family_temple_complex:0 "Complexo do Templo Familiar"
 great_project_type_mandala_capital_04_contribution_family_temple_complex_desc:0 "A prole do nosso grande Devaraja será honrada com seu próprio complexo de templo dentro da cidade real. Aqui eles serão adorados muito antes de assumirem o poder."
 great_project_type_mandala_capital_04_contribution_gilded_shrines:0 "Santuários Dourados"
 great_project_type_mandala_capital_04_contribution_gilded_shrines_desc:0 "Teremos santuários com ídolos; e cada divindade contida em cada ídolo nos mostrará misericórdia e auxiliará nosso governante divino."
 great_project_type_mandala_capital_04_contribution_rite_of_worthiness:0 "Rito de Valor"
 great_project_type_mandala_capital_04_contribution_rite_of_worthiness_desc:0 "Provar-nos-emos indubitavelmente dignos de expandir nosso [GetBuilding('mandala_capital_01').GetTypeName], deixando nossa marca no mundo!"
 great_project_type_mandala_capital_04_contribution_slabs_of_granite:0 "Lajes de Granito"
 great_project_type_mandala_capital_04_contribution_slabs_of_granite_desc:0 "A única imagem imortal é aquela esculpida em alvenaria. Forneceremos a melhor pedra para criar arte para o $building_mandala_capital_04$, que durará uma eternidade."
 great_project_type_mandala_capital_04_contribution_work_force:0 "$great_project_type_mandala_capital_01_contribution_work_force$"
 great_project_type_mandala_capital_04_contribution_work_force_desc:0 "Uma obra tão grandiosa exige não apenas força e suor, mas olhos atentos, ferramentas delicadas e a mente de um artesão. O trabalho que fornecemos não moverá apenas materiais básicos, mas criará as intrincadas obras de arte que o [great_project|E] tanto necessita."
 great_project_type_mandala_capital_04_contribution_zaungdans:0 "Zaungdans"
 great_project_type_mandala_capital_04_contribution_zaungdans_desc:0 "Escadarias divinas são parte importante de se elevar e assim se aproximar da divindade. É também um excelente local para barracas de mercado e outras necessidades."
 great_project_type_mandala_capital_04_desc:0 "$great_project_type_mandala_capital_02_desc$"
 great_project_type_mandala_capital_04_possessive:0 "do $building_mandala_capital_04$"
 great_project_type_mandala_capital_05:0 "$great_project_type_mandala_capital_02$"
 great_project_type_mandala_capital_05_contribution_bejeweled_reliefs:0 "Relevos Ajuadados"
 great_project_type_mandala_capital_05_contribution_bejeweled_reliefs_desc:0 "Dançarinos celestiais cobrirão as paredes, projetando graça em seus movimentos, completos com seus magníficos trajes adornados com joias."
 great_project_type_mandala_capital_05_contribution_bunga_mas_forest:0 "Floresta de Bunga Mas"
 great_project_type_mandala_capital_05_contribution_bunga_mas_forest_desc:0 "A veneração de um monumento tão augusto e justo requer presentes refinados e profundos. Forneceremos ao $building_mandala_capital_05$ uma exibição de árvores e flores feitas de ouro, habilmente criadas pelos melhores artesãos."
 great_project_type_mandala_capital_05_contribution_divine_barays:0 "Barays Divinos"
 great_project_type_mandala_capital_05_contribution_divine_barays_desc:0 "Nossa estrutura terá os mais profundos espelhos d’água, que nos protegem dos inimigos e nos conectam ao plano espiritual."
 great_project_type_mandala_capital_05_contribution_dynastic_temple_complex:0 "Área do Templo Dinástico"
 great_project_type_mandala_capital_05_contribution_dynastic_temple_complex_desc:0 "Uma seção do complexo do templo da capital para nosso Devaraja será dedicada à adoração de nossa linhagem e seus descendentes."
 great_project_type_mandala_capital_05_contribution_marble_foundation:0 "Fundação de Mármore"
 great_project_type_mandala_capital_05_contribution_marble_foundation_desc:0 "O mármore mais fino será oferecido para o $building_mandala_capital_05$, para que ele descanse sobre as fundações mais elegantes."
 great_project_type_mandala_capital_05_contribution_rite_of_worthiness:0 "Rito de Valor"
 great_project_type_mandala_capital_05_contribution_rite_of_worthiness_desc:0 "Provar-nos-emos indubitavelmente dignos de expandir nosso [GetBuilding('mandala_capital_01').GetTypeName], transformando-o em algo verdadeiramente transcendente!"
