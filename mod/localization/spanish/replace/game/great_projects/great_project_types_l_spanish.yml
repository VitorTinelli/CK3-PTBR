 great_project_type_great_wall_extend_to_liaodong_desc:0 "À medida que expandimos nossas fronteiras, também devemos expandir a Grande Muralha para abranger a costa. Todas as partes de nosso reino, seja em terra ou mar, devem ser protegidas."
