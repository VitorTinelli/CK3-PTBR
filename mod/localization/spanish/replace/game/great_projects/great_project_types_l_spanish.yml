 great_project_type_mandala_capital_05_contribution_work_force_desc:0 "Forneceremos trabalhadores de todas as habilidades, do camponês mais humilde ao estudioso mais sábio, vindos de todos os cantos do reino, para auxiliar na construção do $building_mandala_capital_05$."
