 great_project_type_strengthen_capital_desc:0 "A capital não é apenas a sede do meu governo. É o centro do reino e deve ser um símbolo majestoso do meu reinado. Ao renovar toda a cidade, melhorar ruas, financiar uma universidade, erguer estátuas e outros monumentos, esta bela cidade se tornará um reflexo da minha dinastia."
