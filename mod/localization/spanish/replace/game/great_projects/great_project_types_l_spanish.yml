 great_project_type_minister_project_development_contribution_infrastructure:0 "Expandir Infraestrutura"
 great_project_type_minister_project_development_contribution_personnel:0 "Enviar Equipe de Construção"
 great_project_type_minister_project_development_desc:0 "Uma corrente de ferro só é tão forte quanto seu elo mais fraco. Se um elo falhar, a corrente se torna inútil. As regiões do nosso grande reino não são diferentes. Cada canto de [GetPlayer.GetPrimaryTitle.GetNameNoTier] deve prosperar para que nossa prosperidade perdure. Construção de canais e estradas, acesso à água melhorado, cidades bem planejadas — construiremos tudo."
