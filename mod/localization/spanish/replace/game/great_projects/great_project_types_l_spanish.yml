 great_project_type_minister_project_train_troops:0 "Operação de Treinamento Militar"
 great_project_type_minister_project_train_troops_contribution_equipment_check:0 "Verificação de Equipamentos"
 great_project_type_minister_project_train_troops_contribution_levy_bootcamp:0 "Campo de Treinamento para Levas"
 great_project_type_minister_project_train_troops_contribution_military_academy:0 "Cursos da Academia Militar"
 great_project_type_minister_project_train_troops_contribution_natural_disaster_test:0 "Teste de Desastre Natural"
 great_project_type_minister_project_train_troops_contribution_siege_exercise:0 "Exercício de Cerco"
