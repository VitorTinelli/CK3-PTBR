 pam_great_projects_events.0002.f:0 "Cristo lavando os pés dos Apóstolos."
 pam_great_projects_events.0002.learning_xp:0 "Uma vez concluída a [grand_cathedral|E], seu [point_of_interest|E] fornecerá @skill_learning_icon![learning|E] [lifestyle_experience|lE] e [spiritual_fulfillment|E] aos fiéis"
 pam_great_projects_events.0002.mystic_xp:0 "Uma vez concluída a [grand_cathedral|E], seu [point_of_interest|E] proporcionará [trait_level_track_xp|E] aprimorado para aqueles com a [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [trait|E]"
 pam_great_projects_events.0002.piety:0 "Uma vez concluída a [grand_cathedral|E], seu [point_of_interest|E] fornecerá @piety_icon![piety|E]"
 pam_great_projects_events.0002.pilgrim_xp:0 "Uma vez concluída a [grand_cathedral|E], seu [point_of_interest|E] proporcionará [trait_level_track_xp|E] para aqueles com a [GetTrait('pilgrim').GetName( GetNullCharacter )] [trait|E]"
 pam_great_projects_events.0002.scholar_xp:0 "Uma vez concluída a [grand_cathedral|E], seu [point_of_interest|E] proporcionará [trait_level_track_xp|E] para aqueles com a [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] [trait|E]"
 pam_great_projects_events.0002.stress_loss:0 "Uma vez concluída a [grand_cathedral|E], seu [point_of_interest|E] fornecerá @stress_loss_icon![stress_loss|E]"
 pam_great_projects_events.0002.t:0 "$game_concept_grand_cathedral$: Afrescos Sagrados para [province.GetNameNoTooltip]"
 pam_great_projects_events.0003.a.flavor:0 "[Glossary('Tree of Jesse','TREE_OF_JESSE_GLOSS')]"
 pam_great_projects_events.0003.a.tt:0 "Uma vez concluída a [grand_cathedral|E], seu [point_of_interest|E] fornecerá @dynasty_prestige_icon![dynasty_prestige|E] aos membros da [dynasty|E] que visitarem como [travel|E]"
 pam_great_projects_events.0003.a:0 "Uma Árvore de Jessé, sustentando a legitimidade de [ROOT.Char.GetDynastyNameNoTooltip]."
 pam_great_projects_events.0003.b.tt:0 "Uma vez concluída a [grand_cathedral|E], seu [point_of_interest|E] fornecerá @prestige_icon![prestige|E] aos visitantes"
 pam_great_projects_events.0003.b:0 "Um painel de doador com seu retrato e brasão."
 pam_great_projects_events.0003.c.tt:0 "Uma vez concluída a [grand_cathedral|E], seu [point_of_interest|E] proporcionará [trait_level_track_xp|E] aprimorado para aqueles com a [GetTrait('pilgrim').GetName( GetNullCharacter )] [trait|E]"
 pam_great_projects_events.0003.c:0 "Cenas de milagres de peregrinos, para atrair fiéis de longe."
 pam_great_projects_events.0003.d.dulia.tt:0 "Ter [GetTenetType('tenet_dulia').GetBaseName] como [personal_tenet|E] concede maior [spiritual_fulfillment|E] na visita"
 pam_great_projects_events.0003.d.flavor:0 "Ele manterá uma lâmpada de óleo e velas acesas diante da imagem em vidro de [blessed_mary.GetTitledFirstName]."
 pam_great_projects_events.0003.d.tt:0 "Uma vez concluída a [grand_cathedral|E], seu [point_of_interest|E] fornecerá @stress_loss_icon![stress_loss|E] e [spiritual_fulfillment|E]"
 pam_great_projects_events.0003.d:0 "Uma janela mariana, com uma lâmpada perpétua diante dela."
 pam_great_projects_events.0003.desc:0 "\"#EMP Brilhante é aquilo que se une brilhantemente ao que é brilhante, e brilhante será a obra nobre impregnada pela nova luz.#!\" diz [religion_buddy.GetTitledFirstName] ao contemplar o vidro lapidado, reluzindo ao sol.\n\nO vidraceiro [glazier.GetTitledFirstName] colocou fragmentos de [Glossary('pot metal','POT_METAL_GLOSS')] sobre mesas caiadas para melhor examinarmos os projetos em potencial.\n\nEu declaro: \"Esta janela será vista tanto da nave quanto de toda [province.GetNameNoTooltip], ela deve retratar...\""
 pam_great_projects_events.0003.e.owner_msg.desc:0 "[contributor.GetTitledFirstName] encomendou um ciclo de vitrais de martírio para a [grand_cathedral|E]. O tema o comove a uma devoção mais profunda."
 pam_great_projects_events.0003.e.owner_msg.title:0 "Martírio em Vidro"
 pam_great_projects_events.0003.e.tt:0 "Uma vez concluída a [grand_cathedral|E], seu [point_of_interest|E] concede a visitantes zelosos @piety_icon![piety|E] e @stress_loss_icon![stress_loss|E] extras."
 pam_great_projects_events.0003.e:0 "Um ciclo de martírio pelas mãos de um rei."
 pam_great_projects_events.0003.t:0 "$game_concept_grand_cathedral$: Luz Pintada Sobre [province.GetNameNoTooltip]"
 pam_great_projects_events.0005.a:0 "\"Nossos filhos verão isso realizado.\""
 pam_great_projects_events.0005.desc.contributor:0 "\n\nNotavelmente, a contribuição de [optional_contributor.GetTitledFirstNamePossessive] [contribution.GetName] imortalizará ainda mais nossa [cathedral_building.GetName]."
 pam_great_projects_events.0005.desc.intro:0 "A primeira pedra é lançada! Como uma bolota que antecede um carvalho, a sede de [owner.GetTitledFirstName] crescerá em um monumento edificante. Cada pedra e madeira irradiará a glória de [ROOT.Char.GetFaith.HighGodName] para todos os [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] na [owner.GetPrimaryTitle.GetNameNoTier] e na cristandade em geral.\n\nA magnanimidade de [CharMyFirstNames(founder)|U] ao financiar a construção ecoará nos sinos e estará na boca de cada fiel."
 pam_great_projects_events.0005.desc.outro:0 "Que a grande obra comece!"
 pam_great_projects_events.0005.t:0 "$game_concept_grand_cathedral$: A Primeira Pedra Lançada"
 pam_great_projects_events.0006.a.tt:0 "Uma [GetDomicileBuilding('cathedral_crypt_01').GetName|V] é construída no [cathedral_complex|E] de [owner.GetShortUINamePossessive], honrando a [founder.GetDynastyName] [dynasty|E]"
 pam_great_projects_events.0006.a:0 "Cavaj uma cripta para os ancestrais de [founder.GetDynastyNameNoTooltip]."
 pam_great_projects_events.0006.b.tt:0 "Uma vez concluída a [grand_cathedral|E], seu [point_of_interest|E] fornecerá [GetTrait('pilgrim').GetName( GetNullCharacter )] [trait_level_track_xp|E] aprimorado e @piety_icon![piety|E] para os peregrinos visitantes"
 pam_great_projects_events.0006.b:0 "Estender a nave para acomodar os peregrinos."
 pam_great_projects_events.0006.c:0 "Só Deus pode guiar os procedimentos."
 pam_great_projects_events.0006.desc.ad_quadratum_ref:0 "empregando [Glossary('ad quadratum','AD_QUADRATUM_GLOSS')]! O Senhor nos proporcionou a ordem divina; com o uso de um esquadro podemos extrapolar as proporções para um edifício mais grandioso do que qualquer [ROOT.Char.Custom('ResidenceBuilding')].\""
 pam_great_projects_events.0006.desc.architect_explanation:0 "\n\n\"Nós estamos $pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 pam_great_projects_events.0006.desc.foundations:0 "\n\nVejo que as escavações para as fundações começarão em breve."
 pam_great_projects_events.0006.desc.intro:0 "uma série de estacas de madeira, com cordas esticadas entre elas formando o contorno de uma cruz enorme; uma visão do edifício cruciforme que está por vir."
 pam_great_projects_events.0006.desc.intro_architect:0 "Meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))] [architect.GetFirstName] aponta para"
 pam_great_projects_events.0006.desc.intro_no_architect:0 "Eu contemplo"
 pam_great_projects_events.0006.desc.steward_architect:0 "\n\n\"Mas como se planeja um edifício tão grandioso?\" eu pergunto."
 pam_great_projects_events.0006.desc.steward_founder:0 "\n\nEu vi este processo em meus estudos!\n\n\"Você deve estar $pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 pam_great_projects_events.0006.t:0 "$game_concept_grand_cathedral$: Traçado Com Ordem Divina"
 pam_great_projects_events.0007.a.tt:0 "Assim que a [grand_cathedral|E] for concluída, seu [point_of_interest|E] fornecerá [trait_level_track_xp|E] aprimorado para aqueles com a [trait|E] de [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]"
 pam_great_projects_events.0007.a:0 "Ornamentar as abóbodas com o céu noturno."
 pam_great_projects_events.0007.b.tt:0 "Sua [faith|E] ganha @fervor_icon!#P [EmptyScope.ScriptValue('trivial_fervor_value')|1]#! [fervor|E]"
 pam_great_projects_events.0007.b:0 "Pregar um sermão de arrependimento estilo Jonas."
 pam_great_projects_events.0007.c:0 "Deixar os pedreiros continuarem com o trabalho."
 pam_great_projects_events.0007.desc.architect:0 "\n\n\"Uma vez concluídas, estas abóbodas protegerão os fiadores dos elementos e guiarão nossas preces aos altos céus.\""
 pam_great_projects_events.0007.desc.architect_says:0 "diz [architect.GetSheHe]."
 pam_great_projects_events.0007.desc.intro_architect:0 "Meu/minha [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))] [architect.GetFirstName] me conduz através de uma grande floresta de vigas. Os andaimes da catedral erguem-se como uma igreja de madeira por direito próprio, sustentando os pedreiros que trabalham arduamente nas abóbodas de pedra."
 pam_great_projects_events.0007.desc.intro_no_architect:0 "Caminho por uma grande floresta de vigas. Os andaimes da catedral erguem-se como uma igreja de madeira por direito próprio, sustentando os pedreiros que trabalham nas abóbodas."
 pam_great_projects_events.0007.desc.outro:0 "\n\nEnquanto descanso meu olhar sobre um vão de abóboda concluída, eles trazem à mente as costelas do grande peixe que engoliu Jonas. Tal é a glória da Casa de Deus, que se pode ser transportado para baixo do mar ou até as estrelas."
 pam_great_projects_events.0007.t:0 "$game_concept_grand_cathedral$: As Costelas Arjantes dos Céus"
 pam_great_projects_events.0008.a.tt:0 "Se a fundição falhar, você executará [bell_maker_son.GetShortUIName]"
 pam_great_projects_events.0008.a:0 "Se ele falhar, eu o matarei."
 pam_great_projects_events.0008.aa:0 "Se ele falhar, arrancarei a carne do seu corpo."
 pam_great_projects_events.0008.b.flavor:0 "Não era Davi apenas um jovem pastor quando derrotou Golias?"
 pam_great_projects_events.0008.b.tt:0 "Você deposita sua fé em [bell_maker_son.GetShortUIName] para fundir o sino"
 pam_great_projects_events.0008.b:0 "Ele pode ser um instrumento do Senhor."
 pam_great_projects_events.0008.belltower_may.tt:0 "Um/uma [GetDomicileBuilding('cathedral_belltower_02').GetName|V] pode ser construído(a) em [owner.GetShortUINamePossessive] [cathedral_complex|E]"
 pam_great_projects_events.0008.c:0 "Encontrar uma aposta segura, mesmo que ele não seja filho de um mestre."
 pam_great_projects_events.0008.desc.architect:0 "\n\n[architect.GetFirstName] me diz que devemos fundir um grande sino de bronze!"
 pam_great_projects_events.0008.desc.intro:0 "A construção progride bem, mas a Catedral está sem uma voz para convocar os fiéis de todo o [owner.GetPrimaryTitle.GetNameNoTier]."
 pam_great_projects_events.0008.desc.need_bell:0 "Um empreendimento arriscado e caro; os cofres de [founder.GetPrimaryTitle.GetNameNoTier] ainda sofrem com o custo apenas das matérias-primas."
 pam_great_projects_events.0008.desc.no_architect:0 "\n\nDevemos fundir um sino!"
 pam_great_projects_events.0008.desc.ordinary_body:0 "\n\n[bell_maker_son.GetFirstName], um jovem fundidor de bronze ambicioso treinado por um mestre local, apresentou-se. [bell_maker_son.GetSheHe|U] anseia por provar o [bell_maker_son.GetHerHis] valor fundindo um sino digno da [cathedral_building.GetName] de [owner.GetPrimaryTitle.GetNameNoTier]."
 pam_great_projects_events.0008.desc.outro:0 "Seu filho, [bell_maker_son.GetFirstName], assegura-me que o conhecimento secreto foi passado a [bell_maker_son.GetHerHim] no leito de morte do/da [bell_maker_son.GetHerHis] pai e que pode fundir o sino."
 pam_great_projects_events.0008.desc.plague_generic:0 "\n\nInfelizmente, o fundidor de sinos pereceu na pestilência recente."
 pam_great_projects_events.0008.desc.plague_named:0 "\n\nInfelizmente, o fundidor de sinos pereceu no/na [epidemic.GetName]."
 pam_great_projects_events.0008.duel.failure:0 "A fundição falha... você deve decidir como proceder"
 pam_great_projects_events.0008.duel.success:0 "A fundição é bem-sucedida! Um/uma [GetDomicileBuilding('cathedral_belltower_02').GetName|V] será construído(a) em [owner.GetShortUINamePossessive] [cathedral_complex|E]"
 pam_great_projects_events.0008.t:0 "$game_concept_grand_cathedral$: Fundindo a Voz de Deus"
 pam_great_projects_events.0009.a:0 "Deixe o/a [province.Custom('GetTerrainType')|l] de [province.GetNameNoTooltip] ouvir a voz de Deus."
 pam_great_projects_events.0009.desc.body.architect:0 "Eu e [architect.GetFirstName] observamos enquanto [bell_maker_son.GetFirstName] corre de um lado para o outro, organizando os trabalhadores.\n\n[bell_maker_son.GetSheHe|U] desafia constantemente a antiga equipe de [bell_maker_son.GetHerHis] pai, insistindo na [bell_maker_son.GetHerHis] própria maneira de escolher a localização da cova, a argila adequada para o molde e a queima dos fornos."
 pam_great_projects_events.0009.desc.body:0 "Observo enquanto [bell_maker_son.GetFirstName] corre de um lado para o outro, organizando os trabalhadores.\n\n[bell_maker_son.GetSheHe|U] desafia constantemente a antiga equipe de [bell_maker_son.GetHerHis] pai, insistindo na [bell_maker_son.GetHerHis] própria maneira de escolher a localização da cova, a argila adequada para o molde e a queima dos fornos."
 pam_great_projects_events.0009.desc.success_end:0 "\n\nO bronze fundido desliza para dentro do molde como se guiado pela mão de Deus, e emerge completo. É então içado e ressoa um clarim para todos os [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]:\n\n\"Vinde à casa do Senhor!\""
 pam_great_projects_events.0009.t:0 "$game_concept_grand_cathedral$: E Deus Falou"
 pam_great_projects_events.0010.a.tt:0 "[bell_maker_son.GetShortUIName|U] é executado(a)"
 pam_great_projects_events.0010.a:0 "Promessas devem ser cumpridas."
 pam_great_projects_events.0010.b.faith:0 "O Senhor ainda tem um plano para ele."
 pam_great_projects_events.0010.b:0 "O sino rachado já é punição suficiente."
 pam_great_projects_events.0010.c.intrigue_xp.tt:0 "Em vez disso, você ganha [intrigue_lifestyle|E] [experience|E]"
 pam_great_projects_events.0010.c.tt:0 "O sino rachado é refeito em um instrumento de tortura; [bell_maker_son.GetShortUIName] é sua primeira vítima. Futuros artesãos em [founder.GetCapitalLocation.GetNameNoTooltip] aprenderão a obediência."
 pam_great_projects_events.0010.c:0 "Derreta o bronze. Forge algo mais afiado."
 pam_great_projects_events.0010.d:0 "Que isso sirva de lição de humildade."
 pam_great_projects_events.0010.desc.body.architect:0 "$pam_great_projects_events.0009.desc.body.architect$"
 pam_great_projects_events.0010.desc.body:0 "$pam_great_projects_events.0009.desc.body$"
 pam_great_projects_events.0010.desc.failure_end:0 "\n\nO bronze fundido grita no molde, mas emerge completo. É então içado, puxado para trás, mas quando o badalo atinge a borda sonora, apenas um baque surdo é ouvido, seguido por uma rachadura. Um arauto da perdição!"
 pam_great_projects_events.0010.t:0 "$game_concept_grand_cathedral$: Um Arauto da Perdição!"
 pam_great_projects_events.0011.a.tt:0 "Sua [culture|E] ganha @culture_icon!#P [EmptyScope.ScriptValue('pam_cathedral_treadwheel_fascination_progress_value')|0]#! de progresso em direção à sua [cultural_fascination|E] atual"
 pam_great_projects_events.0011.a:0 "Nós, os [founder.GetCulture.GetCollectiveNounNoTooltip], devemos colher o que pudermos da grande roda."
 pam_great_projects_events.0011.b:0 "Muitos projetos em [founder.GetCapitalLocation.GetNameNoTooltip] poderiam se beneficiar disto!"
 pam_great_projects_events.0011.c:0 "Impressionante, mas eu deixaria tais feitos para o Senhor."
 pam_great_projects_events.0011.desc.architect:0 "\n\n[architect.GetFirstName] aponta para a roda de passo gigante, com um par de operários caminhando dentro."
 pam_great_projects_events.0011.desc.intro:0 "Verificando o progresso da construção do/da [cathedral_building.GetName] de [province.GetNameNoTooltip], meus ouvidos são agredidos pelo rangido estridente de uma estrutura de madeira maciça em rotação."
 pam_great_projects_events.0011.desc.no_architect:0 "\n\nAvisto a origem do barulho, uma roda de passo gigante, com um par de operários caminhando dentro."
 pam_great_projects_events.0011.desc.outro:0 "\n\nComo pela mão de Deus, suas cordas e polias içam pedaços massivos de [Glossary('ashlar','ASHLAR_GLOSS')] recém-cortado e baldes de argamassa até o telhado em construção. Olho com admiração para a carga que teria quebrado as costas dos carregadores no pátio abaixo."
 pam_great_projects_events.0011.t:0 "$game_concept_grand_cathedral$: Como Pela Mão do Senhor"
 pam_great_projects_events.0012.a.flavor:0 "\"[Glossary('...for they will be called children of God.','MATTHEW_5_9_GLOSS')]\""
 pam_great_projects_events.0012.a.tt:0 "Cada [owner.GetFaith.GetAdjective] [county|E] em [owner.GetPrimaryTitle.GetNameNoTier] ganha [GetModifier('pam_cathedral_sermon_peace_county_modifier').GetNameWithTooltip|V] por #V 10 anos#!\n$pam_cathedral_sermon_peace_ai_behavior_tt$"
 pam_great_projects_events.0012.a:0 "\"Bem-aventurados os pacificadores...\""
 pam_great_projects_events.0012.b.flavor:0 "\"[Glossary('...consider its ways and be wise.','PROVERBS_6_6_GLOSS')]\""
 pam_great_projects_events.0012.b.tt:0 "Todo [owner.GetFaith.GetAdjective] [county|E] em [owner.GetPrimaryTitle.GetNameNoTier] ganha [GetModifier('pam_cathedral_sermon_diligence_county_modifier').GetNameWithTooltip|V] por #V 10 anos#!\n$pam_cathedral_sermon_diligence_ai_behavior_tt$"
 pam_great_projects_events.0012.b:0 "\"Vai ter com a formiga, ó preguiçoso...\""
 pam_great_projects_events.0012.c.flavor:0 "\"[Glossary('...by the name of our Lord Jesus Christ, that all of you be in agreement and that there be no divisions among you, but that you be knit together in the same mind and the same purpose.','1_CORINTHIANS_1_10_GLOSS')]\""
 pam_great_projects_events.0012.c.tt:0 "Todo [owner.GetFaith.GetAdjective] [county|E] em [owner.GetPrimaryTitle.GetNameNoTier] ganha [GetModifier('pam_cathedral_sermon_unity_county_modifier').GetNameWithTooltip|V] por #V 10 anos#!\n$pam_cathedral_sermon_unity_ai_behavior_tt$"
 pam_great_projects_events.0012.c:0 "\"Agora, rogo-vos, irmãos e irmãs...\""
 pam_great_projects_events.0012.d.flavor:0 "\"[Glossary('...give thanks in all circumstances, for this is the will of God in Christ Jesus for you. Do not quench the Spirit. Do not despise prophecies.','1_THESSALONIANS_5_16_20_GLOSS')]\""
 pam_great_projects_events.0012.d.tt:0 "Todo [owner.GetFaith.GetAdjective] [county|E] em [owner.GetPrimaryTitle.GetNameNoTier] ganha [GetModifier('pam_cathedral_sermon_rejoice_county_modifier').GetNameWithTooltip|V] por #V 10 anos#!\n$pam_cathedral_sermon_rejoice_ai_behavior_tt$"
 pam_great_projects_events.0012.d:0 "\"Alegrai-vos sempre, orai sem cessar...\""
 pam_great_projects_events.0012.desc:0 "A fachada oeste está concluída! Seu portal está pronto para receber os fiéis através do [Glossary('narthex','NARTHEX_GLOSS')]. O [cathedral_building.GetName] pode levar uma vida inteira para ser totalmente terminado, mas os bons cristãos de [owner.GetPrimaryTitle.GetNameNoTier] devem ter fé no futuro do amor infalível do Senhor. Meu sermão começa...\n\n#EMP \"[ROOT.Char.Custom('RandomBibleQuote')]\"#!\n\n...e deixarei com eles esta lição das escrituras."
 pam_great_projects_events.0012.e.flavor:0 "\"[Glossary('Let us also lay aside every weight and the sin that clings so closely, and let us run with perseverance the race that is set before us.','HEBREWS_12_1_GLOSS')]\""
 pam_great_projects_events.0012.e.tt:0 "Todo [owner.GetFaith.GetAdjective] [county|E] em [owner.GetPrimaryTitle.GetNameNoTier] ganha [GetModifier('pam_cathedral_sermon_perseverance_county_modifier').GetNameWithTooltip|V] por #V 10 anos#!\n$pam_cathedral_sermon_perseverance_ai_behavior_tt$"
 pam_great_projects_events.0012.e:0 "\"Corramos com perseverança a carreira que nos está proposta...\""
 pam_great_projects_events.0012.f.flavor:0 "\"[Glossary('...and reaches out her hands to the needy.','PROVERBS_31_20_GLOSS')]\""
 pam_great_projects_events.0012.f.tt:0 "Todo [owner.GetFaith.GetAdjective] [county|E] em [owner.GetPrimaryTitle.GetNameNoTier] ganha [GetModifier('pam_cathedral_sermon_charity_county_modifier').GetNameWithTooltip|V] por #V 10 anos#!\n$pam_cathedral_sermon_charity_ai_behavior_tt$"
 pam_great_projects_events.0012.f:0 "\"Ela estende a mão ao pobre...\""
 pam_great_projects_events.0012.t:0 "$game_concept_grand_cathedral$: Seu Amor Infalível"
 pam_great_projects_events.0013.a:0 "Expandir o coro, quanto mais vozes, melhor."
 pam_great_projects_events.0013.b:0 "Este anjo deve adornar minha corte."
 pam_great_projects_events.0013.c:0 "Essas teatralidades são um truque para me espremer!"
 pam_great_projects_events.0013.castrato.tt:0 "[choir_boy.GetShortUIName|U] é castrado para que a [choir_boy.GetHerHis] voz não mude"
 pam_great_projects_events.0013.castrato:0 "Preservar esta voz para a cantoria do Senhor."
 pam_great_projects_events.0013.d:0 "Estou sobrecarregado e devo me retirar."
 pam_great_projects_events.0013.desc:0 "O som surdo dos malhetes dos carpinteiros ecoa acima de nós, um presságio da acústica que em breve banhará os fiéis na Palavra de Deus.\n\n[architect.GetFirstName] explica: \"Será um coro modesto onde os cônegos liderarão a liturgia, nosso próprio [Glossary('cantoria','CANTORIA_GLOSS')]! De fato, devemos usar uma voz diferente quando nos dirigimos ao nosso Senhor do que quando falamos aos homens.\" [architect.GetSheHe|U] então chama um jovem coroinha, [choir_boy.GetFirstName], para frente.\n\nA criança soa pelo andaime e solta uma nota angélica; enquanto ela ecoa pelas paredes e entra em meu corpo, é como se Deus tivesse passado por mim."
 pam_great_projects_events.0013.t:0 "$game_concept_grand_cathedral$: Um Chamado Superior"
 pam_great_projects_events.0020.a:0 "De perto e de longe, vinde adorar ao nosso lado!"
 pam_great_projects_events.0020.desc:0 "Enfim, as cruzes são afixadas nas torres, cada uma como a de Cristo há tanto tempo naquela colina em [Glossary('Golgotha','GOLGOTHA_GLOSS')]. Elas permanecem como um lembrete de Seu sofrimento por nossa salvação, e uma promessa de Seu sangue fluindo a cada sábado, lá para nos purificar de nossos pecados.\n\nDesde que a construção começou, filhos se tornaram pais, e pais velhos mortos na terra. No entanto, seu nobre labor, seu suor e sangue, está imortalizado na pedra.\n\nImpérios podem cair, mas a [cathedral_building.GetName] de [province.GetName] permanecerá eterna como o amor de Deus."
