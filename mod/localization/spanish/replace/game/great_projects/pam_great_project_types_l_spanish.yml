l_spanish:
 AD_QUADRATUM_GLOSS:0 "#EMP Ad quadratum#! — Latim para \"pelo quadrado.\" Mestres de obras medievais projetavam canteiros de obras com sistemas proporcionais simples. Eles usavam a proporção do lado de um quadrado para sua diagonal. Um retângulo com esses dois comprimentos como lados era visto como possuidor de uma forma harmoniosa. A partir desta única unidade base, o pedreiro podia derivar uma cadeia de quadrados e retângulos maiores e menores, garantindo que cada parte do plano se encaixasse na seguinte."
 ASHLAR_GLOSS:0 "A pedra de silhar é cortada e aparelhada com precisão, esquadrejada e alisada no chão. O planejamento preciso era necessário para que as pedras combinassem assim que fossem içadas às alturas necessárias para a construção de catedrais."
 CANTORIA_GLOSS:0 "Uma cantoria é um coro elevado em uma igreja, frequentemente situado acima do coro ou próximo ao cruzeiro, onde os cantores, e posteriormente os órgãos, conduziam a liturgia."
 GOLGOTHA_GLOSS:0 "Golgota, derivado do latim #EMP Calvariae locus#! ou \"lugar da caveira\", era uma colina em formato de crânio na Jerusalém romana e o local da Crucificação de Jesus. A execução ocorreu fora das muralhas da cidade, não muito longe do túmulo onde ele foi sepultado. O local agora está contido na Igreja do Santo Sepulcro, perto de [GetBuilding('dome_of_the_rock_01').GetName|V]"
 NARTHEX_GLOSS:0 "O nártex é o hall de entrada de uma igreja, situado entre as portas ocidentais e a nave. Ele dava as boas-vindas aos fiéis ao espaço sagrado e, em ritos mais rigorosos, mantinha penitentes e catecúmenos separados da congregação na Missa."
 POT_METAL_GLOSS:0 "O vidro de metal de cadinho é colorido no cadinho de fusão misturando óxidos metálicos ao lote, de modo que a tonalidade atravessa todo o painel em vez de ficar apenas na superfície. Mestres vidreiros cortavam as folhas resfriadas em pedaços e os dispunham sobre tábuas caiadas para ver como a luz incidiria antes de aplicar chumbo à janela."
 TREE_OF_JESSE_GLOSS:0 "A Árvore de Jesse retrata a ancestralidade de Cristo a partir da figura reclinada de Jesse, pai de Davi. Os vitrais de igrejas retratavam a linhagem real bíblica em relação a uma dinastia reinante, denotando a realeza divina. Exemplos fundamentais podem ser vistos em Chartres e Saint-Denis."
