 court_fashion:0 "Moda da Corte"
 court_fashion_acceptable:0 "Moda Antiquada"
 court_fashion_acceptable_desc:0 "Os cortesãos chamam a atenção quando visitam cidades e vilas."
 court_fashion_decent:0 "Moda Decente"
 court_fashion_decent_desc:0 "Os cortesãos atualizam habilmente seu guarda-roupa com as estações, abandonando roupas antigas quando um novo estilo é adotado."
 court_fashion_default:0 "Moda do Último Século"
 court_fashion_default_desc:0 "Os cortesãos se vestem de acordo com a convenção, o que é seguro, mas não muito criativo."
 court_fashion_fantastic:0 "Moda Alta Costura"
 court_fashion_fantastic_desc:0 "Esta corte é considerada uma inovadora estilística. Os servos se vestem como os governantes de outras terras, e seu senhor feudal será imortalmente conhecido por seu senso de moda."
 court_fashion_good:0 "Moda Estilosa"
 court_fashion_good_desc:0 "Frequentemente, os estilos desta corte se espalham pelo mundo e influenciam outras cortes."
 court_food_quality:0 "Qualidade da Comida"
 court_food_quality_decent:0 "Comida Decente"
 court_food_quality_decent_desc:0 "Esta corte é capaz de fornecer ocasionalmente iguarias novas e interessantes."
 court_food_quality_default:0 "Comida Insossa"
 court_food_quality_default_desc:0 "Ninguém espera comer bem nesta corte, mas dizem que a companhia compensa."
 court_food_quality_exotic:0 "Comida Exótica"
 court_food_quality_exotic_desc:0 "Servos são enviados a terras estrangeiras e retornam com uma grande variedade de comidas exóticas. Não há nenhuma delícia culinária que não tenha passado por esses salões."
 court_food_quality_lavish:0 "Comida Luxuosa"
 court_food_quality_lavish_desc:0 "Uma equipe de chefs fornece um suprimento constante de iguarias saborosas. Um servo com um prato de comida segue qualquer grupo de convidados reunidos."
 court_food_quality_modest:0 "Comida Modesta"
 court_food_quality_modest_desc:0 "Os convidados são bem alimentados com cozinha local adequada."
 court_lodging_standards:0 "Padrões de Hospedagem"
 court_lodging_standards_default:0 "Alojamentos Mínimos"
 court_lodging_standards_default_desc:0 "Ocorrem incidentes diplomáticos ocasionais quando os hóspedes são solicitados a compartilhar alojamentos."
 court_lodging_standards_grand:0 "Alojamentos Grandiosos"
 court_lodging_standards_grand_desc:0 "Os hóspedes sabem que podem solicitar todos os luxos dentro de seus alojamentos. Qualquer livro para seu estudo, qualquer bebida tarde da noite - os quartos são atendidos a cada hora."
 court_lodging_standards_middling:0 "Alojamentos Médios"
 court_lodging_standards_middling_desc:0 "O quarto de cada cortesão é bem provido."
 court_lodging_standards_small:0 "Alojamentos Pequenos"
 court_lodging_standards_small_desc:0 "Há espaço para que qualquer cortesão tenha seu próprio quarto."
 court_lodging_standards_spacious:0 "Alojamentos Espaçosos"
 court_lodging_standards_spacious_desc:0 "Todos os habitantes desta corte podem esperar uma suíte de quartos."
 court_lodgings_grand_inspirations:0 "Ótima chance de melhoria na qualidade das [inspiration|E] concluídas"
 court_lodgings_middling_inspirations:0 "Chance de melhoria na qualidade das [inspiration|E] concluídas"
 court_lodgings_small_inspirations:0 "Pequena chance de melhoria na qualidade das [inspiration|E] concluídas"
 court_lodgings_spacious_inspirations:0 "Boa chance de melhoria na qualidade das [inspiration|E] concluídas"
 court_servants:0 "Servos da Corte"
 court_servants_default:0 "Muito Poucos Servos"
 court_servants_default_desc:0 "O punhado de servos desta corte está exausto em atender todas as demandas dos hóspedes."
 court_servants_endless:0 "Servos Infinitos"
 court_servants_endless_desc:0 "Esta corte tem mais servos do que se sabe o que fazer. É necessário um esforço concertado para realizar a tarefa mais simples sem que os servos solicitem realizá-la para você."
 court_servants_endless_guest_recruitment:0 "Custo de recrutamento de [guest|E]: #P -50%#!"
 court_servants_few:0 "Poucos Servos"
 court_servants_few_desc:0 "Esta corte tem servos que podem fornecer quase todo o conforto crucial."
 court_servants_few_guest_recruitment:0 "Custo de recrutamento de [guest|E]: #P -20%#!"
 court_servants_many:0 "Muitos Servos"
 court_servants_many_desc:0 "Esta corte tem um servo para cada propósito que se possa conceber."
 court_servants_many_guest_recruitment:0 "Custo de recrutamento de [guest|E]: #P -40%#!"
 court_servants_some:0 "Alguns Servos"
 court_servants_some_desc:0 "Esta corte tem servos especializados que se orgulham de seu trabalho."
 court_servants_some_guest_recruitment:0 "Custo de recrutamento de [guest|E]: #P -30%#!"
