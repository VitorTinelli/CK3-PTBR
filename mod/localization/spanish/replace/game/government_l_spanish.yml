 war_declaration_rights_allowed_desc:0 "#emphasis #bold Privilégios do [vassal|E]:#!#!\n$EFFECT_LIST_BULLET$ O [vassal|E] pode declarar [war|E] independentemente da [crown_authority|E] do [liege|E]\n$EFFECT_LIST_BULLET$ O [vassal|E] paga #high [EmptyScope.ScriptValue('war_declaration_rights_allowed_cost_reduction_tooltip')|0]%#! a menos por [casus_bellis|E] dentro do [realm|E]\n\n#flavor O [vassal] não precisa gastar um [hook] caso a [crown_authority] de seu [liege] o impeça de travar guerra. Esse tratamento especial também facilita para o [vassal] declarar guerras dentro do [realm|E], reduzindo o custo em #high [EmptyScope.ScriptValue('war_declaration_rights_allowed_cost_reduction_tooltip')|0]%#!.#!"
