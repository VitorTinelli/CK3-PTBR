 investiture_marriage_no:0 "Fechado à Família Imperial"
 investiture_marriage_yes:0 "Convidado para a Família Imperial"
 investiture_marriage_yes_desc:0 "#emphasis #bold Privilégios do [tributary|E]:#!#!\n$EFFECT_LIST_BULLET$ Aceitação de [marriage|E] aumentada com a [dynasty|E] governante de [GetTitleByKey('h_china').GetDefinitiveNamePossessive]\n$EFFECT_LIST_BULLET$ Penalidades de Aceitação de [marriage|E] anuladas devido à #BOLD $tradition_cultural_primacy_name$#!\n\n#flavor A família imperial de [GetTitleByKey('h_china').GetDefinitiveName] é frequentemente impenetrável para estranhos. Um convite formal para a família concede bônus de Aceitação relativo a [imperial_grace|E] e remove as penalidades usuais aplicáveis a estrangeiros.#!"
 investiture_marriage_yes_short:0 "Acesso à Família"
 investiture_politics_no:0 "Fechado ao Palácio Imperial"
 investiture_politics_yes:0 "Acesso ao Palácio Imperial"
 investiture_politics_yes_desc:0 "#emphasis #bold Privilégios do [tributary|E]:#!#!\n$EFFECT_LIST_BULLET$ Torna-se participante ativo do [dynastic_cycle|E]\n$EFFECT_LIST_BULLET$ Ganha [movement_power|E] relativo a [imperial_grace|E]\n\n#flavor Enquanto a maioria dos [tributaries|E] de [GetTitleByKey('h_china').GetDefinitiveName] é esperada apenas para observar a ordem celestial, alguns raros podem receber voz ativa em seu andamento. O acesso ao palácio imperial envolve o $game_concept_tributary$ privilegiado no $game_concept_dynastic_cycle$, permitindo que participe de um [movement|E] e influencie sua [situation_dynastic_cycle_phase|E].#!"
 investiture_politics_yes_short:0 "Acesso ao Palácio"
 investiture_trade_no:0 "Fechado aos Mercados Imperiais"
 investiture_trade_yes:0 "Acesso aos Mercados Imperiais"
 investiture_trade_yes_desc:0 "#emphasis #bold Privilégios do [tributary|E]:#!#!\n$EFFECT_LIST_BULLET$ Crescimento anual de [development_growth|E] (até [EmptyScope.ScriptValue('celestial_investiture_trade_bonus_max')|v0]) na [province|E] da [capital|E] [tributary_possessive|E]\n\n#flavor O acesso aos movimentados mercados de [GetTitleByKey('h_china').GetDefinitiveNamePossessive] beneficia a prosperidade dos [tributaries|E] privilegiados. O impacto aumenta com a diferença de [development|E] entre os $game_concept_capitals$ e a quantidade de [imperial_grace|E] que um $game_concept_tributary$ privilegiado acumulou.#!"
 investiture_trade_yes_short:0 "Acesso ao Mercado"
