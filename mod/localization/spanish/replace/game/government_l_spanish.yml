 unity_improve_logistics_decision:0 "Exigir Logística Compartilhada do Exército"
 unity_improve_logistics_decision_confirm:0 "Exigir logística compartilhada"
 unity_improve_logistics_decision_desc:0 "As guerras são decididas por uma infinidade de fatores diferentes. Boas logísticas e suprimentos são tão importantes quanto ter soldados capazes. Posso impor novas políticas dentro de nossa casa e exigir que todos compartilhem suprimentos e equipamentos, aumentando consideravelmente as capacidades do exército."
 unity_improve_logistics_decision_tooltip:0 "Exigir dos membros de sua casa a compartilhar logísticas e suprimentos para melhor atender às necessidades do exército"
 unity_improve_taxation_decision:0 "Melhorar Tributação"
 unity_improve_taxation_decision_confirm:0 "Vamos organizar uma reunião"
 unity_improve_taxation_decision_desc:0 "Minha casa possui muitos membros eficientes na arrecadação de impostos e na gestão de um reino. Compartilhando ideias e pessoas capacitadas, todos podemos se beneficiar de um aumento na renda."
 unity_improve_taxation_decision_tooltip:0 "Trabalhar ao lado dos membros de sua casa para melhorar a tributação e a renda do reino"
 unity_organize_house_for_war_decision:0 "Organizar Membros da Casa para a Guerra"
 unity_organize_house_for_war_decision_confirm:0 "Promover guerra e conflito!"
 unity_organize_house_for_war_decision_desc:0 "Aprimorar um reino requer dedicação e, na maioria das vezes, muitas conquistas. Emitindo éditos específicos e guiando os membros de nossa casa, posso torná-los mais propensos a guerrear e conquistar novas terras."
 unity_organize_house_for_war_decision_tooltip:0 "Guiar os membros de sua casa para guerrear com mais frequência"
 unity_placate_vassals_decision:0 "Acalmar Vassalos"
 unity_placate_vassals_decision_confirm:0 "Acalmar vassalos"
 unity_placate_vassals_decision_desc:0 "Até uma casa harmoniosa enfrenta seus desafios. Ao exercer minha influência como chefe da casa, posso suavizar essas tensões sociais antes que se transformem em rachaduras."
 unity_placate_vassals_decision_tooltip:0 "Lembrar aos membros de sua casa da sua autoridade como seu senhor feudal"
 unity_promote_development_decision:0 "Promover Desenvolvimento"
 unity_promote_development_decision_confirm:0 "Promover desenvolvimento"
 unity_promote_development_decision_desc:0 "Nossa cultura tem uma longa história de excelentes habilidades administrativas. Existem muitos supervisores e inspetores habilidosos empregados em nossa casa. Podemos usar isso a nosso favor e continuar desenvolvendo o reino."
 unity_promote_development_decision_tooltip:0 "Promover os membros de sua casa para desenvolver e aprimorar o reino"
 unity_reinforce_army_decision:0 "Reforçar Exército com Oficiais Leais"
 unity_reinforce_army_decision_confirm:0 "Enviar as ordens"
 unity_reinforce_army_decision_desc:0 "Um exército é tão forte quanto os oficiais que o lideram. Ao solicitar soldados habilidosos dos membros da minha casa, ganho acesso a soldados com muita experiência. Soldados que posso promover para posições de liderança em meu exército para fortalecer a eficácia das tropas. Todos os membros contribuem para nossa casa pelo bem maior, e todos se beneficiam!"
 unity_reinforce_army_decision_tooltip:0 "Solicitar que os membros de sua casa enviem oficiais capazes"
 unity_search_for_administrators_decision.msg.desc:0 "Um novo administrador, chamado [new_administrator.GetName], chegou ao seu tribunal e está pronto para ser contratado."
 unity_search_for_administrators_decision.msg.t:0 "Administrador Chegou"
 unity_search_for_administrators_decision:0 "Procurar Coletores de Impostos"
 unity_search_for_administrators_decision_confirm:0 "Ordene a busca"
 unity_search_for_administrators_decision_desc:0 "Os impostos são a espinha dorsal de qualquer reino. Dedique tempo para buscar administradores habilidosos e ex-soldados para empregar como coletores de impostos, valerá a pena."
 unity_search_for_administrators_decision_tooltip:0 "Buscar administradores e soldados competentes para fortalecer minha equipe de coletores de impostos"
 unity_send_bailiffs_decision:0 "Enviar Bailiffs"
 unity_send_bailiffs_decision_confirm:0 "Chamar os bailiffs"
 unity_send_bailiffs_decision_desc:0 "Posso aproveitar a atitude cooperativa dos membros da minha casa enviando meus almotacéis a eles, executando minhas ordens para manter a paz por todo o reino."
 unity_send_bailiffs_decision_tooltip:0 "Cooperar com os membros de sua casa para aumentar o controle pelo reino"
 unity_steer_house_direction_decision:0 "Direcionar Unidade da Casa"
 unity_steer_house_direction_decision_confirm:0 "$unity_steer_house_direction_decision$"
 unity_steer_house_direction_decision_desc:0 "Como chefe da casa, minhas palavras carregam muito peso entre os membros da minha casa. Com palavras e ações cuidadosas, posso incentivar meus colegas a se comportarem de certas maneiras, afetando grandemente nossa unidade combinada."
 unity_steer_house_direction_decision_second_tooltip:0 "$DESC$\n"
 unity_steer_house_direction_decision_tooltip:0 "Escolha uma direção para direcionar sua [house_unity|E]"
