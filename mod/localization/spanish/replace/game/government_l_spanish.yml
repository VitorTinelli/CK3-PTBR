 jizya_special_rights_tax_collector_desc:0 "#emphasis #bold Privilégios do [vassal|E]:#!#!\n$EFFECT_LIST_BULLET$ O [liege|E] não pode [demand_conversion|E] do [vassal|E]\nO [liege|E] não pode usar [convert_county|E] nas terras dos [vassals|E]\n$EFFECT_LIST_BULLET$ O [liege|E] não pode usar [faith|E] como motivo para evitar [tyranny|E] ao revogar títulos\n$EFFECT_LIST_BULLET$ O [liege|E] não pode revogar os [titles|E] [vassals_possessive|E]\n\n#flavor O [vassal|E] tem a posse de seus [titles] garantida, impedindo o [liege|E] de revogá-los — independentemente de o $game_concept_liege$ ter um [revoke_title_reason|E] ou não.\n\nO $game_concept_vassal$ também recebe um status especial de proteção, com o reino reconhecendo oficialmente seu direito de praticar sua própria [faith|E].#!"
