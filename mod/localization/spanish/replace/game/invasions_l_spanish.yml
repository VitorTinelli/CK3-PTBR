l_spanish:
 almohad.1001.a.flavor:0 "Quando um grupo religioso marginal nas províncias já causou problemas para alguém?"
 almohad.1001.a:0 "Por que isso me preocuparia?"
 almohad.1001.b.conversion_tt:0 "Se você já está convertendo a fé em [almohad_county.GetName], o progresso pode ser perdido se você escolher esta opção!"
 almohad.1001.b:0 "Vamos erradicá-lo antes que se estabeleça de fato..."
 almohad.1001.desc:0 "Parece que uma crença marginal está se espalhando no [almohad_county.GetName]. O movimento religioso se chama Almóadas e fala da necessidade de purificar o Magrebe de hereges e equivocados.\n\nOs magistrados locais estão preocupados, mas certamente um grupo religioso marginal liderado por um teólogo desonrado não é motivo de preocupação, certo?"
 almohad.1001.player_warning:0 "@warning_icon! #X Se você não converter [almohad_county.GetNameNoTier] para longe de [masmudi.GetName] rapidamente, a ascensão dos Almóadas ocorrerá. Esteja preparado.#!"
 almohad.1001.t:0 "Ascensão dos Almóadas"
 almohad.1002.a.not_target.tt:0 "Os Almóadas vão à guerra contra o seu senhor feudal!"
 almohad.1002.a.target.tt:0 "Os Almóadas vão à guerra contra você!"
 almohad.1002.a:0 "Como se este humilde [ibn_tumart.GetFaith.PriestNeuter] fosse uma ameaça!"
 almohad.1002.b.flavor:0 "Difícil eu me considerar um fiel digno..."
 almohad.1002.b:0 "[ibn_tumart.GetSheHe|U] tem alguns pontos muito bons, na verdade."
 almohad.1002.desc:0 "O movimento religioso conhecido como Almóadas saiu de sua sede, determinado a 'reconquistar o Magrebe dos incrédulos', pela força se necessário!\n\nSeu líder, [ibn_tumart.GetTitledFirstName], já foi rejeitado por várias escolas por ser - francamente - irritante em sua insistência em práticas dogmáticas, porém [ibn_tumart.GetSheHe] encontrou um núcleo forte de seguidores e se declarou nada menos que o Madhi!"
 almohad.1003.a.tt:0 "Os Almóadas retornam, mais fortes do que nunca."
 almohad.1003.a:0 "Esses fanáticos simplesmente não param!"
 almohad.1003.desc:0 "O fundador dos Almóadas, [ibn_tumart.GetTitledFirstName], faleceu e com isso esperávamos que seu movimento fosse relegado à história. Se ao menos tivéssemos tanta sorte.\n\nEm vez disso, um novo líder surgiu! [al_mumin.GetTitledFirstName] não só manteve as tribos unidas, [al_mumin.GetSheHe] reuniu #EMP mais#! pessoas sob sua bandeira!"
 almohad.1004.a:0 "Nós faremos dela nossa nova capital, [masmudi.GetAdjective]!"
 almohad.1004.b:0 "Vamos construir uma nova cidade ainda mais grandiosa!"
 almohad.1004.c:0 "Talvez esta não seja a melhor opção..."
 almohad.1004.desc:0 "Fundada como uma capital imperial, a [marrakesh.GetTitle] agora está sob meu controle, como deve ser. No entanto, ela carrega influências [old_faith.GetAdjective] intermináveis, e meus [masmudi.GetName] estão ansiosos para vê-la ser transformada à minha imagem.\n\nParece uma pena destruir tantos palácios e templos perfeitamente bons, mas pode ser necessário para concretizar minha ambição de trazer a iluminação ao Magrebe."
 almohad.1004.t:0 "Controle de Marrakesh"
