l_spanish:
 aspiring_flatulist:0 "Aspirante a Flatulento"
 aspiring_flatulist_desc:0 "Este personagem está perseguindo a arte refinada e nobre do flatulismo.\n#flatulence Pum#!"
 court_jester_prefix:0 "Bobo da Corte: "
 covered_in_feces:0 "Coberto de Fezes"
 covered_in_feces_desc:0 "Este personagem foi coberto da cabeça aos pés de excrementos."
 death_heart_attack:0 "morreu de um ataque cardíaco"
 death_laughter:0 "morreu de tanto rir"
 death_nailed_in_cabinet:0 "foi pregado em um móvel e deixado para morrer de fome"
 death_nailed_in_cabinet_killer:0 "foi pregado em um móvel e deixado para morrer de fome por [TARGET_CHARACTER.GetUIName]"
 faceplant:0 "batendo o rosto audivelmente no chão!\n\n"
 fall_into_sculpture:0 "batendo de cara no meu [furniture_to_crash_into.GetName]!\n\n"
 forceful_tumble:0 "cair violentamente!\n\n"
 jester.100.a:0 "Um brinde a você, caro [jester.GetFirstNameNoTooltip]!"
 jester.100.desc:0 "Outro dia estressante... enquanto eu me sento para ter um pouco de paz e sossego, as portas do meu quarto de repente se abrem.\n\nÉ o meu rival-transformado-em-bobo-da-corte [jester.GetTitledFirstName], vestido com uma [jester.Custom('GetClothingArticle')] encharcada de sujeira com um adereço incrivelmente berrante [jester.Custom('GetAccessory')|l]!? Agora [jester.GetSheHe] parece tão excremento por fora quanto eu sei que [jester.GetSheHe] é por dentro!\n\n\"Seu [ROOT.Char.Custom('GetExpensiveDrink_Singular')]... meu #EMP Senhor#!\" [jester.GetSheHe] diz, com uma grande carranca no rosto.\n\nÀs vezes, a vida é boa, afinal de contas."
 jester.100.t:0 "$court_jester_prefix$Meu Rival Tolo, Coberto de Fezes"
 jester.1000.a:0 "[jester.GetSheHe|U] até faz diferentes vozes para os personagens!"
 jester.1000.b:0 "[jester.GetFirstNameNoTooltip], por que você não me conta sobre você em vez disso?"
 jester.1000.c:0 "Eu prefiro que você leia de #EMP [my_book.GetNameNoTooltip]!#!"
 jester.1000.c_flavor:0 "Oh, eu amo tanto [my_book.GetName]!"
 jester.1000.desc:0 "\"Você parece cansado, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [Select_CString( jester.IsFemale, 'minha', 'meu' )] bobo da corte [jester.GetFirstName] diz.\n\n\"Eu conheço a cura para isso - chama-se '[SCOPE.Custom('RandomEntertainmentTextName')]'. O que você acha? Devo começar a ler?\" [jester.GetFirstNameNoTooltip] me convida para sentar.\n\nÉ #EMP uma#! texto divertido... Eu realmente preciso dessa pausa."
 jester.1000.t:0 "$court_jester_prefix$Uma Boa História"
 jester.1100.a:0 "Ha! Quase me pegou!"
 jester.1100.b:0 "Por [ROOT.Char.GetFaith.HighGodName]... e se você fosse um assassino!?"
 jester.1100.c:0 "Meu pobre coração..!"
 jester.1100.d:0 "Guardas, tragam um martelo e pregos..."
 jester.1100.d_flavor:0 "Se [jester.GetFirstNameNoTooltip] é realmente o 'fantasma do [hiding_place.GetNameNoTooltip]', então [jester.GetSheHe] se sentirá em casa dentro dele... pelo resto de sua vida."
 jester.1100.desc:0 "Por que há barulho vindo de dentro do meu [hiding_place.GetName]? Eu olho ao redor da sala, não há mais ninguém aqui. Está vazio e escuro.\n\n#EMP Creeeeak#!\n\nPoderia ser um espírito? Algum tipo de duende malicioso?\nDe repente, ele irrompe - revelando meu bobo da corte [jester.GetFirstName], pulando e agitando os braços!\n\n\"Cuidado com o fantasma do [hiding_place.GetNameNoTooltip]! Eu vim para fazer você rir!\" [jester.GetSheHe] grita alegremente."
 jester.1100.t:0 "$court_jester_prefix$O Fantasma do [hiding_place.GetNameNoTooltip]"
 jester.1200.a:0 "Que fofoca deliciosa!"
 jester.1200.b:0 "Espere... o que foi isso sobre [secret_holder.GetTitledFirstNameNoTooltip]!?"
 jester.1200.desc:0 "\"Oh, meu senhor, você ouviu que [vassal_1.GetTitledFirstName] mostrou o [vassal_1.Custom('ObjectifiedFeature')] em público ontem! Inacreditável, não é?\" [jester.GetFirstName] sussurra em meu ouvido.\nMeu bobo da corte certamente ouve muito.\n\n\"E - ho ho! É verdade! [Select_CString( vassal_2_spouse.IsFemale, 'A', 'O' )] [vassal_2_spouse.GetWifeHusband] de [vassal_2.GetTitledFirstName] chamou [vassal_2.GetSheHe] de #EMP [vassal_2.Custom2('InsultNoun', SCOPE.sC('jester'))] [vassal_2.Custom2('InsultAdjectiveArticle', SCOPE.sC('jester'))]!#! Que drama!\" [jester.GetSheHe] continua.\n\n\"Oh, e você sabia que [secret_holder.GetTitledFirstName] é secretamente [secret_holder.Custom('GetSecretCrimeDescIndef')]?\""
 jester.1200.t:0 "$court_jester_prefix$A Fofoca"
 jester.1300.notification:0 "[jester.GetFirstName] faz piadas sobre [jester.Custom('RandomObjectPlural')]"
 jester.1400.notification:0 "[jester_from_task.GetFirstName] entretem s[Select_CString( first_de_stress_target.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('first_de_stress_target'))|U] [first_de_stress_target.GetFirstName]"
 jester.1410.notification:0 "[jester_from_task.GetFirstName] entretem s[Select_CString( second_de_stress_target.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('second_de_stress_target'))|U] [second_de_stress_target.GetFirstName]"
 jester.200.a:0 "Vá em frente, conte!"
 jester.200.b:0 "Foi divertido, hora de voltar ao trabalho!"
 jester.200.desc:0 "\"Você já ouviu aquela sobre o [ROOT.Char.GetTitleTierName] e o [ROOT.Char.Custom('lowly_servant_type')], [ROOT.Char.Custom('FormOfAddressForLiege')]? É assim que vai!\" [Select_CString( jester.IsFemale, 'minha', 'meu' )] bobo-da-corte [jester.GetTitledFirstName] musa felimente.\n\nMeu rosto está vermelho e lágrimas de riso estão correndo pelas minhas bochechas, de onde [jester.GetSheHe] tira todas as piadas? [jester.GetSheHe|U] é hilário!\n\nTalvez seja hora de voltar ao trabalho, antes que eu #EMP morra#! de tanto rir!"
 jester.200.t:0 "$court_jester_prefix$Rir é o Melhor Remédio"
 jester.300.a:0 "Agora sim, algo que não se vê todos os dias!"
 jester.300.b:0 "Bom, hora de levá-lo à masmorra!"
 jester.300.desc:0 "\"Venha até o grande salão, [Select_CString( ROOT.Char.IsFemale, 'minha senhora', 'meu senhor' )]! Você precisa ver isso!\" um servo exclama repentinamente.\n\nAo chegar, vejo meu bobo da corte, [jester.GetTitledFirstName], no meio da sala, dominando a arte de equilibrar [ROOT.Char.Custom('DeviantObjectArticle')], meu [ROOT.Char.Custom('RandomPrivateObject')], uma garrafa de [ROOT.Char.Custom('GetExpensiveDrink_Singular')],"
 jester.300.desc_2:0 "[ROOT.Char.Custom('GetLivestockFowlIndef')], e [ROOT.Char.Custom('GetSmallFoodIndef')].\n\nTodos os servos estão olhando boquiabertos. E eu também."
 jester.300.desc_child:0 "[child_to_juggle.GetFirstName],"
 jester.300.t:0 "$court_jester_prefix$Habilidade com Malabarismo"
 jester.400.a:0 "Um poeta #EMP e#! um flatulento!? Suas habilidades são maravilhosas!"
 jester.400.b:0 "Eu adorei! Você pode me ensinar seus truques?"
 jester.400.desc:0 "\"Meu Senhor, o senhor parece tão desanimado! Deixe-me animá-lo com um poema que eu refinei!\" meu bobo da corte diz, com os sinos tilintando.\n\n\"Ahem, [jester.Custom('GeneratePoem_Title')]\"\n#flatulence Pum pum#!, [jester.GetSheHe] solta um pum.\n\"[jester.Custom('GeneratePoem_Intro_Rhyming')]\"\n#flatulence Pum pum pum#!, [jester.GetSheHe] solta outro pum, ritmicamente.\n\"[jester.Custom('GeneratePoem_Outro_Rhyming')]\"\n#flatulence Puum#!, o último pum ecoa.\n\n\"O senhor gostou?\" [jester.GetSheHe] pergunta, rindo baixinho."
 jester.400.t:0 "$court_jester_prefix$Um Flatulento e um Cavalheiro[jester.GetWomanMan]"
 jester.500.a:0 "Har har! Era exatamente o que eu precisava ver!"
 jester.500.b:0 "Não importa o quão divertido isso seja, devolva as roupas d[courtier.GetSheHe]!"
 jester.500.desc:0 "Enquanto estou prestes a me aposentar para a noite, uma cena de hilaridade inacreditável ocorre diante dos meus olhos - meu [SCOPE.sC('you').Custom2('RelationToMeShort', SCOPE.sC('courtier'))] [courtier.GetFirstName], nu como o dia em que [courtier.GetSheHe] nasceu, perseguindo [Select_CString( jester.IsFemale, 'minha', 'meu' )] bobo da corte com um machado!\n\n\"Vem cá! Devolva minhas roupas, ou eu te divido em dois!\" [courtier.GetFirstNameNoTooltip] grita.\n\n\"Oooh, você nunca vai me pegar! Preciso de suas roupas para construir meu pequeno ninho aconchegante de bobo da corte!\" [jester.GetFirstName] ri, carregando um monte de roupas roubadas."
 jester.500.t:0 "$court_jester_prefix$O Ladrão de Roupas"
 jester.600.a:0 "Tão clássico!"
 jester.600.b:0 "Deixe-me ajudar a limpar, [courtier.GetFirstNameNoTooltip]!"
 jester.600.c:0 "Só isso..? Agora #EMP lute!#!"
 jester.600.desc:0 "\"Meu Senhor, eu sei de algo que vai te animar - observe atentamente enquanto eu me aproximo da minha presa...\" meu bobo da corte [jester.GetFirstName] sussurra para mim.\nO que [jester.GetSheHe] está aprontando?\n\n\"Com fome?\" [jester.GetFirstNameNoTooltip] grita, atirando [ROOT.Char.Custom('GetExpensiveDessertInTheFace')] no rosto de [SCOPE.sC('you').Custom2('RelationToMeShort', SCOPE.sC('courtier'))] [courtier.GetFirstName]!\n\nQue expressão impagável! Ah, e [courtier.GetFirstNameNoTooltip] parece ter levado isso muito bem. Que alegria, que diversão!"
 jester.600.t:0 "$court_jester_prefix$ Luta de comida"
 jester.700.a:0 "Isso foi um bom insulto, muito bom mesmo!"
 jester.700.b:0 "Não fique chateado [courtier.GetFirstNameNoTooltip]! Você ainda é muito [courtier.Custom('ComplimentAdjective')]!"
 jester.700.desc:0 "Meu bobo da corte, [jester.GetFirstName], está de frente para m[Select_CString( courtier.IsFemale, 'inha', 'eu' )] [SCOPE.sC('you').Custom2('RelationToMeShort', SCOPE.sC('courtier'))] [courtier.GetFirstName] — cheguei a tempo de ouvir uma #EMP particularmente#! ácida zombaria!\n\n\"[Select_CString( courtier.IsFemale, 'Sua', 'Seu' )] [courtier.Custom2('InsultNounSexual', SCOPE.sC('jester'))] [courtier.Custom2('InsultAdjective', SCOPE.sC('jester'))] e [courtier.Custom2('InsultNoun', SCOPE.sC('jester'))] [courtier.Custom2('InsultAdjective', SCOPE.sC('jester'))], [Select_CString( courtier.IsFemale, 'sua', 'seu' )] [courtier.Custom('PointOfRidicule')] e [courtier.Custom('InsultBehavior')] são coisa de lenda! [courtier.Custom('InsultSentence')|U], [Select_CString( courtier.IsFemale, 'sua', 'seu' )] [courtier.Custom('InsultNounSexual')]!\" diz [jester.GetFirstNameNoTooltip], como se possuído por [ROOT.Char.GetFaith.DevilName]!\n\nO rosto de [courtier.GetFirstNamePossessiveNoTooltip] está vermelho, mas [courtier.GetSheHe] sabe que estou observando, então [courtier.GetSheHe] consegue dar uma risada forçada."
 jester.700.t:0 "$court_jester_prefix$ Assado de domingo"
 jester.800.a:0 "Ha! Cair sem se machucar, impressionante!"
 jester.800.b:0 "Bah! Não é divertido se não houver sangue. Faça de novo. #EMP Mais forte!#!"
 jester.800.desc:0 "Oh não! Parece que estou caindo de novo!\" meu bobo da corte [jester.GetFirstName] exclama com um tom cômico, "
 jester.800.desc_2:0 "\"Sou tão, tão desajeitado! Espero poder ficar de pé desta vez!\" [jester.GetSheHe] diz, "
 jester.800.desc_3:0 "\"[jester.Custom('CulturalCurse')|U]. Minha sorte é péssima!\" [jester.GetSheHe] ri, "
 jester.800.desc_4:0 "Depois de tudo isso, nem um arranhão em seu corpo!"
 jester.800.t:0 "$court_jester_prefix$HumorFísico"
 jester.900.a:0 "Ninguém vai notar se eu ficar com apenas #EMP um#! deles..."
 jester.900.b:0 "Ah! Este filhote agitado se juntará a mim em muitas caçadas!"
 jester.900.bird:0 "descobrindo [ROOT.Char.Custom('GetLivestockFowlIndef')], e mais um, e mais um, e mais um, #EMP e mais um!#!\n\n"
 jester.900.c:0 "Oh que espetáculo! Delicioso!"
 jester.900.cat:0 "revelando uma ninhada de gatinhos! Deve haver pelo menos trinta deles ali - miando e espalhando tudo por todos os lados!\n\n"
 jester.900.d:0 "Eu vou domar essa jovem águia e torná-la minha!"
 jester.900.desc:0 "Hmm. Eu não me lembro [Select_CString( jester.IsFemale, 'da minha', 'do meu' )] [jester.Custom('ComplimentAdjective')] bobo da corte sendo tão... #EMP corpulento.#!\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetLadyLord|U], me desculpe, sabe... Eu comi demais e parece que meu estômago não está concordando comigo!\" diz [jester.GetFirstName], com uma expressão de dor no rosto.\n\n#flatulence Pum#!\n\nDe repente, o colorido casaco de [jester.GetFirstNamePossessiveNoTooltip] se abre,"
 jester.900.dog:0 "liberando pelo menos doze filhotes felizes, que imediatamente começam a atacar meus cortesãos com o nariz e as patas!\n\n"
 jester.900.eagle:0 "revelando uma majestosa águia jovem, que decola animadamente e começa a circular pela sala!\n\n"
 jester.900.t:0 "$court_jester_prefix$Vários Bobos em um Casaco"
 jester_decision_rewards:0 "Seu Bobo da Corte é trazido até você:\n$EFFECT_LIST_BULLET$Você perde um pouco de [stress_loss_i] [stress|E]\n$EFFECT_LIST_BULLET$Um evento de [stress|E] pode aparecer #weak (Bobos da Corte com maior [aptitude|E] oferecem melhores eventos)#!"
 jester_entertainment_decision:0 "Seja Entretido pelo Bobo da Corte"
 jester_entertainment_decision_confirm:0 "Entretenha-me!"
 jester_entertainment_decision_desc:0 "Piadas, acrobacias, poesia! Traga o entretenimento!"
 jester_entertainment_decision_tooltip:0 "Faça com que seu Bobo da Corte o entretenha, diminuindo seu [stress|E]."
 reinvigorating_reading_modifier:0 "Leitura Revigorante"
 reinvigorating_reading_modifier_desc:0 "Este personagem teve um de seus livros preciosos lido em voz alta para ele, inspirando-o."
 somersault_into_sculpture:0 "quase dando uma cambalhota no meu [furniture_to_crash_into.GetName]!\n\n"
 suspicious_of_furniture:0 "Desconfiado de móveis"
 suspicious_of_furniture_desc:0 "Este personagem sempre chuta qualquer móvel grande que encontra. Repetidamente."
 walk_into_wall:0 "cair diretamente na parede com um thud alto!\n\n"
 weapon_plummet:0 "cair perigosamente perto da minha [weapon_pratfall.GetName]!\n\n"
 weapon_pratfall:0 "escorregar em minha [weapon_pratfall.GetName]!\n\n"
