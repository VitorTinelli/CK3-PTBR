 become_greatest_of_khans_decision_desc:0 "#F Estou pronto para convocar cada líder de clã de todo o meu vasto reino para uma reunião. Eles vão me proclamar o Cã dos Khans, [ROOT.Char.GetLadyLord|U] de tudo que está sob o céu. A partir daí, conquistaremos.#!"
