 establish_bactrian_supremacy_decision:0 "Estabelecer Supremacia Bactriana"
 establish_bactrian_supremacy_decision_confirm:0 "Reivindicar as terras antigas!"
 establish_bactrian_supremacy_decision_desc:0 "#F Por gerações, os reis báctrios dominaram a encruzilhada das civilizações. É hora de assumir seu manto e deixar que a palavra se espalhe de caravanserai a oásis que aqui, sob os quatro cantos do céu, somos nós que governamos.#!"
