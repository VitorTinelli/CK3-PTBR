l_spanish:
 WAR_DECLARED_OVERVIEW_DISMISS:0 "Reúna as tropas!"
 WAR_DECLARED_OVERVIEW_FLAVOR:0 "[WAR.Custom('WarDeclaredOpening')][WAR.Custom('WarDeclaredFlavor')]"
 is_war_overview_tab_open_trigger:0 "A aba de visão geral da guerra está aberta"
 war_declared_flavor.byzantine_imperial:0 "Conheça seu lugar sob a púrpura. Ajoelhe-se, ou ensinarei a lição da Cidade mais uma vez no campo de batalha!"
 war_declared_flavor.callous:0 "Poupe-me de suas súplicas. Não me importo com seu sofrimento — apenas com o que tomarei de você."
 war_declared_flavor.claimant:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('NegativeSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] Você é um usurpador e um tirano. É hora de restaurar o monarca legítimo ao trono!"
 war_declared_flavor.conquest:0 "Você é um governante fraco e não merece as terras que possui. Eu mostrarei o que é um verdadeiro soberano quando tomar essas terras de você!"
 war_declared_flavor.dejure:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] Sua ocupação de terras que pertencem legitimamente a mim não pode mais ser tolerada. É hora de vê-las retornar à minha posse!"
 war_declared_flavor.fallback:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] Parece que não há outra solução para nossa disputa além de resolvê-la no campo de batalha."
 war_declared_flavor.greedy:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] Eu tenho cobiçado suas terras por muito tempo, apenas para ser impedido de possuí-las. Não mais! Chegou a hora de finalmente conseguir o que mereço!"
 war_declared_flavor.holy_war:0 "Sua falsa religião manteve seus súditos na escuridão por tempo demais. Em nome de [ROOT.War.GetActiveCB.GetAttacker.GetFaith.HighGodName], eu trarei a verdadeira fé para eles e os libertarei do seu sacrilégio!"
 war_declared_flavor.imprisonment_refused:0 "Eu te nomeio tirano e me recuso a me submeter à sua autoridade! O reino se erguerá contra seu governo maligno!"
 war_declared_flavor.independence.tyrant:0 "Você é um tirano, e não ficaremos mais de braços cruzados. Por sangue e aço, seremos livres!"
 war_declared_flavor.independence:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('NegativeSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] Vivemos sob seu domínio por tempo demais. Não podemos mais tolerar isso - pelo sangue e pelo aço, seremos livres!"
 war_declared_flavor.just:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] O direito e o costume estão do meu lado. Entregue o que é legitimamente meu, ou enfrente o julgamento das armas!"
 war_declared_flavor.kinstrife:0 "O fato de compartilharmos o mesmo sangue não torna isto menos necessário. Parentes ou não, você não me deixou outro caminho senão a guerra!"
 war_declared_flavor.liberty:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('NegativeSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] Não podemos mais tolerar as leis severas que violam nossos antigos direitos. Pela espada, essas leis serão derrubadas!"
 war_declared_flavor.naughty:0 "Você tem sido muito [Select_CString( ROOT.War.GetActiveCB.GetDefender.IsFemale, 'malvada', 'malvado' )], [ROOT.War.GetActiveCB.GetDefender.Custom('GirlBoy')]. Tal comportamento não pode ser ignorado! Prepare-se, pois no campo de batalha, infligirei o castigo que você tão ricamente merece!"
 war_declared_flavor.norse_ravens:0 "Em nome do Pai de Todos, o Enforcado, o Olho Flamejante, declaro minha intenção de invadir suas terras e subjugar seu povo. Que os corvos se fartem!"
 war_declared_flavor.peasant:0 "Sua arrogância não tem limites. Não se preocupe, em breve você receberá uma lição de humildade!"
 war_declared_flavor.populist:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('NegativeSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] Se é guerra que você quer, então é guerra que terá! Não deixaremos ninguém nos impedir de formar um novo reino para nós mesmos!"
 war_declared_flavor.retraction_refused:0 "$char_interaction.0221.desc$"
 war_declared_flavor.revocation_refused:0 "$char_interaction.0201.desc$"
 war_declared_flavor.rival:0 "Nossa contenda já festerou por tempo demais. O aço resolverá o que as palavras não puderam!"
 war_declared_flavor.subjugation.arrogant:0 "Tanta impudência, você finge ser um[ROOT.War.GetActiveCB.GetDefender.Custom('ES_XA')] soberan[ROOT.War.GetActiveCB.GetDefender.Custom('ES_OA')] igual a mim quando está claro que sou superior a você! Eu esmagarei suas patéticas armadas no campo de batalha e o forçarei a se ajoelhar diante de mim!"
 war_declared_flavor.subjugation.tribal:0 "Você é fraco, e eu sou forte. Não há outra justificativa necessária para que eu venha e tome o que desejo de você!"
 war_declared_flavor.subjugation:0 "Eu decidi incorporar suas terras em meu reino. Submeta-se agora e eu terei misericórdia de você... Resista, e eu o obrigarei a se ajoelhar e se curvar diante de mim!"
 war_declared_flavor.tyrant:0 "Sua tirania tornou você motivo de zombaria entre homens honestos. Venho para derrubá-lo!"
 war_declared_flavor.vengeful:0 "Contei cada ofensa que você me causou, e repay-as todas dez vezes mais, em sangue!"
 war_declared_flavor.wrathful:0 "Minha paciência se esgotou. Sacue sua espada — esculpirei a resposta da sua carne!"
 war_declared_flavor.zealous.christian_judgment:0 "[ROOT.Char.GetFaith.HighGodName] pesará sua alma, e minha espada proferirá o veredito!"
 war_declared_flavor.zealous.dharma_judgment:0 "Você se desviou do caminho da retidão. Venho para endireitar o mundo!"
 war_declared_flavor.zealous.fallback:0 "Eu não posso perder, pois [ROOT.Char.GetFaith.HighGodName] está comigo!"
 war_declared_flavor.zealous.islamic_judgment:0 "Por [ROOT.Char.GetFaith.HighGodName], seu governo termina sob as bandeiras dos fiéis!"
 war_declared_flavor.zealous.jewish_judgment:0 "A Lei e os Profetas o condenam — e meu exército fará cumprir o veredito deles!"
 war_declared_flavor.zealous.mercifulgod:0 "[ROOT.Char.GetFaith.HighGodName] tenha misericórdia de você, pois eu não terei nenhuma!"
 war_declared_flavor.zealous.norse_ravens:0 "Que os corvos se fartem!"
 war_declared_flavor.zealous.pagan_gods:0 "Os deuses clamam por vingança — e eu sou o instrumento deles!"
 war_declared_flavor.zealous.reincarnation:0 "Que sua próxima vida seja menos miserável do que esta."
 war_declared_flavor.zealous.zoroastrian:0 "A luz varrerá a escuridão que você abriga. Fuja, ou queime!"
 war_declared_flavor.zealous:0 "Suas más ações permaneceram impunes por tempo demais. Isso muda hoje, pois eu vim para entregar a retribuição divina sobre você! [ROOT.War.GetActiveCB.GetAttacker.Custom('ZealousDoW')]"
 war_declared_opening.negative:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateGreetingNegative',ROOT.War.GetActiveCB.GetDefender)]\n\n"
 war_declared_opening.neutral:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateGreeting',ROOT.War.GetActiveCB.GetDefender)]\n\n"
