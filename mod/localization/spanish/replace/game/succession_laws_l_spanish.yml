 scandinavian_elective_succession_law:0 "Eleição Escandinava"
 scandinavian_elective_succession_law_effects:0 "O [ruler|E] e todos os [vassals|E] [de_jure|E] (exceto Barões) podem indicar um [title_heir|E] entre a [extended_family|E] do governante e quaisquer [claimants|E] disponíveis. O [voting_power|E] nesta [succession_law|E] é influenciado pelo [county_development|E] do [domain|E] do [elector|E] e pela [county_opinion|E] da [capital|E]."
