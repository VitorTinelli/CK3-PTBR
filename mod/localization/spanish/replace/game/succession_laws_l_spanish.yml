 princely_elective_candidates_tooltip:0 "Para ser um candidato válido sob o sistema de Eleição Principesca, um personagem deve cumprir uma das seguintes condições:\n$EFFECT_LIST_BULLET$Ser um membro legítimo da [close_family|E] do governante atual, que não esteja na linha de sucessão para herdar uma Teocracia ou República. Os filhos de um candidato não podem ser nomeados\n$EFFECT_LIST_BULLET$Ser um [claimant|E] ao título, que não esteja na linha de sucessão para herdar uma Teocracia ou República\n$EFFECT_LIST_BULLET$Ser um [elector|E] feudal válido para o título"
 princely_elective_electors:0 "Eleitores Príncipes"
 princely_elective_electors_tooltip:0 "Além do [SuccessionElectionWindow.GetTitle.GetHolder.GetTitleAsNameNoTooltip], os detentores dos seguintes [titles|E] são favorecidos como [electors|E] sob [SuccessionElectionWindow.GetSuccessionLaw.GetName]:[SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector1')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector2')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector3')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector4')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector5')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector6')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector7')]\n\nSe algum dos acima não for criado, não for detido por um [vassal|E] [de_jure|E] imperial, já for detido por outro eleitor, ou a [faith|E] do detentor for diferente da do imperador, outro título de jure detido por um vassalo imperial direto ou [independent_ruler|E] será selecionado com base nesses critérios:\n$EFFECT_LIST_BULLET$Os governantes da [faith|E] e da [culture|E] do imperador são favorecidos\n$EFFECT_LIST_BULLET$Governantes [Concept('theocratic', 'Teocráticos')|E] e [Concept('feudal', 'Feudais')|E] são favorecidos"
 princely_elective_succession_law:0 "Eleição Principesca"
 princely_elective_succession_law_effects:0 "O Imperador e os sete Príncipes-Eleitores podem indicar um [title_heir|E] entre eles, quaisquer filhos [Concept('legitimate', 'Legítimos')|E] e irmãos do [ruler|E], bem como qualquer outro [vassal|E] [de_jure|E] importante do Império. Se um [title|E] eleitor histórico for mantido por infiéis ou não existir, outro vassalo [de_jure|E] assumirá seu lugar. Essa [succession_law|E] atribui grande importância à [faith|E] e à [piety|E].\n\nOs títulos eleitorais deste reino são os Condados de Colônia, Mainz e Trier, e os Ducados da Boêmia, Franconia Oriental, Ostfalen e Ostmark."
