 partition_base_desc:0 "#weak Na sucessão, todos os [titles|E] detidos pelo falecido [ruler|E] serão divididos entre suas [eligible_children|E], sendo que o [player_heir|E] sempre receberá o [primary_title|E], a [realm_capital|E] e quaisquer títulos [de_jure|E] diretos associados a ele.\n\nOs filhos mais novos receberão títulos começando com os da mesma [rank|E] que o Título Principal; se nenhum estiver disponível, eles receberão títulos de nível inferior. Seu Herdeiro do Jogador não pode receber antecipadamente títulos dos quais não tenha direito de herdar.\n#!"
