 celestial_appointment_succession_law:0 "Sucessão Celestial por Nomeação"
 celestial_appointment_succession_law_effects:0 "\nA [succession|E] é baseada no [merit_level|E] e nos [merit_pools|E]\n\n#high Um tipo de [appointment_succession_law|E]. Sob a $celestial_appointment_succession_law$, o [title|E] e suas [holdings|E] associadas serão herdadas pelo candidato com o maior [candidate_score|E]. Qualquer [adult|E] no [realm|E] pode tentar alcançar um [governorship|E] por diversos meios, como possuir um alto [merit_level|E] ou gastar [influence|E].#!\n\n"
 celestial_appointment_succession_law_subname:0 "O Candidato com Maior Pontuação Herda"
 celestial_grand_marshal_appointment_succession_law:0 "Nomeação do Grande Marechal"
 celestial_grand_marshal_appointment_succession_law_effects:0 "\n[succession|E] é baseada em [merit_level|E] e [merit_pools|E]\n\n#high Um tipo de [appointment_succession_law|E] usado apenas pelo [minister_grand_marshal|E], um cargo reservado para comandantes de altíssimos [merit_levels|E]. Sob $celestial_grand_marshal_appointment_succession_law$, o [title|E] será herdado pelo candidato com o maior [candidate_score|E]. A pontuação é principalmente afetada por [martial_skill|E], obtenção de [commander_traits|E] ou gasto de [influence|E].#!"
 celestial_grand_marshal_appointment_succession_law_subname:0 "$celestial_military_appointment_succession_law_subname$"
 celestial_military_appointment_allowed_desc:0 "Sua [GetPlayer.Custom('GetProvinceAdministrationConcept')] é #bold não#! uma [governorship|E] militar"
 celestial_military_appointment_succession_law:0 "Sucessão Celestial do Comandante"
 celestial_military_appointment_succession_law_effects:0 "\nA [succession|E] é baseada no [merit_level|E] e nos [merit_pools|E]\n\n#high Um tipo de [appointment_succession_law|E]. Sob a $celestial_military_appointment_succession_law$, o [title|E] e suas [holdings|E] associadas serão herdadas pelo candidato com o maior [candidate_score|E]. Qualquer [adult|E] no [realm|E] pode buscar um [governorship|E] militar possuindo uma boa [martial_skill|E], adquirindo [commander_traits|E] ou gastando [influence|E].#!\n\n"
 celestial_military_appointment_succession_law_subname:0 "O candidato com maiores capacidades de [martial|E] herda"
 celestial_ministry_appointment_cannot_remove_desc:0 "Este [title|E] #bold não#! pode ter sua [succession_law|E] removida"
 celestial_ministry_appointment_succession_law:0 "Nomeação Ministerial"
 celestial_ministry_appointment_succession_law_effects:0 "\n[succession|E] é baseada em [merit_level|E] e [merit_pools|E]\n\n#high Um tipo de [appointment_succession_law|E]. $celestial_appointment_succession_law$ é a sucessão para [titles|E] ministeriais. São cargos altamente valorizados, reservados para aqueles com os mais altos [merit_levels|E]. [movements|E], [merit|E] e [influence|E] desempenham um papel importante em aumentar o [candidate_score|E] de um candidato.#!"
 celestial_ministry_appointment_succession_law_subname:0 "O candidato com a maior pontuação herda"
