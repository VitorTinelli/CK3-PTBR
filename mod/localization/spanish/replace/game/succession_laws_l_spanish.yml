 saxon_elective_candidates_tooltip:0 "Para ser um candidato válido sob o Witenagemot, um personagem deve cumprir uma das seguintes condições:\n$EFFECT_LIST_BULLET$Ser um filho legítimo do governante atual, que não esteja na linha de sucessão para herdar uma Teocracia ou República\n$EFFECT_LIST_BULLET$Ser um [claimant|E] ao título, que não esteja na linha de sucessão para herdar uma Teocracia ou República. Os filhos de um candidato não podem ser nomeados\n$EFFECT_LIST_BULLET$Ser um Vassalo [powerful_vassal_powerful|E] Feudal do título [de_jure]"
 saxon_elective_electors:0 "$feudal_elective_electors$"
 saxon_elective_electors_tooltip:0 "Para ser um [elector|E] válido sob o Witenagemot, um vassalo deve cumprir todas as seguintes condições:\n$EFFECT_LIST_BULLET$Ser um vassalo [de_jure|E] do título\n$EFFECT_LIST_BULLET$Ser um vassalo direto do título\n$EFFECT_LIST_BULLET$Ser adulto\n$EFFECT_LIST_BULLET$NÃO estar incapacitado"
 saxon_elective_succession_law:0 "Eleição Saxônica"
 saxon_elective_succession_law_effects:0 "O [ruler|E] e todos os vassalos [de_jure|E] adultos e diretos, de uma ou duas [ranks|E] abaixo do [title|E], podem indicar um [title_heir|E] entre os [powerful_vassals|E] dentre eles, os filhos [Concept('legitimate', 'Legítimos')|E] do governante e qualquer outro [claimant|E] válido."
 saxon_elective_succession_law_subname:0 "Witenagemot"
