 tribal_elective_candidates_tooltip:0 "Para ser um Candidato válido sob a Jirga, um personagem deve atender a uma das seguintes condições:\n$EFFECT_LIST_BULLET$Ser um membro legítimo da [dynasty|E] do governante, que não está na linha para herdar uma Teocracia ou República. Filhos de um candidato não podem ser indicados\n$EFFECT_LIST_BULLET$Ser um [claimant|E] ao título, que não está na linha para herdar uma Teocracia ou República\n$EFFECT_LIST_BULLET$Ser um [vassal|E] direto do título"
