 single_heir_succession_kurultai_law:0 "Curiltai"
 single_heir_succession_kurultai_law_effects:0 "Sob a sucessão Curiltai, o [council|E] desempenha um papel importante em decidir quem será o próximo na linha de sucessão. Se houver vozes discordantes entre os [kurultai|E], isso levará a uma Sucessão Caótica.\n\nSob uma Sucessão Caótica, a linha de sucessão fica incerta, e o [heir|E] sofrerá alguns efeitos negativos no início do seu reinado.\n\nSe todos os Curiltai concordarem, o reino experimentará uma Sucessão Estável, onde o [heir|E] assumirá o trono com o apoio de todos os seus apoiadores mais poderosos."
