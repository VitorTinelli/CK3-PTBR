 trait_strategist:0 "Estrategista"
 trait_strategist_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] é um estudante apaixonado pela arte da guerra, que consegue tirar vantagem de qualquer situação."
