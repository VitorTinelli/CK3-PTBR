 lifestyle_gardener:0 "Jardineiro"
 lifestyle_gardener_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] sabe tudo o que há para saber sobre jardins, plantas e como cuidar delas."
 lifestyle_gardener_desc:0 "Este personagem sabe tudo o que há para saber sobre jardins, plantas e como cuidar delas."
 lifestyle_herbalist:0 "Herborista"
