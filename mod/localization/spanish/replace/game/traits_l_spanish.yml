 trait_violet_poet:0 "Poeta Violeta"
 trait_violet_poet_desc:0 "O que mais faz um coração cantar e uma voz trovejar do que o próprio amor? [ROOT.GetCharacter.GetFirstNameNoTooltip] sabe disso, e sabe com maestria."
 trait_wali:0 "Wali"
