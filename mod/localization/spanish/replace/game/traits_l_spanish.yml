 game_concept_clouded_eyes_mitigation:0 "Mitigar Olhos Turvos"
 game_concept_clouded_eyes_mitigation_desc:0 "Embora não seja possível impedir que [GetTrait('clouded_eyes').GetName( GetNullCharacter )] progrida, você pode retardar seu avanço:\n$EFFECT_LIST_BULLET$Evitando [travel|E]\n$EFFECT_LIST_BULLET$Evitando locais com [GetTerrain( 'desert' ).GetName] ou [GetTerrain( 'desert_mountains' ).GetName] [terrain|E]\n$EFFECT_LIST_BULLET$Evitando locais com [winter_severity_normal|E] ou [winter_severity_harsh|E]"
 game_concept_elder_traits:0 "Traços de Saúde do Idosos"
 game_concept_elder_traits_desc:0 "À medida que [characters|E] envelhecem, podem adquirir [traits|E] relacionados à idade, como [GetTrait('faltering_heart').GetName( GetNullCharacter )] ou [GetTrait('fragile_bones').GetName( GetNullCharacter )]. Esses normalmente aparecem por volta dos #V 50#! anos, mas podem surgir antes.\n\nVocê tem menos chances de adquirir esses traços se tiver:\n$BULLET_WITH_TAB$Boa [health|E]\n$BULLET_WITH_TAB$[GetTrait('athletic').GetName( GetNullCharacter )], [GetTrait('physique_good_1').GetName( GetNullCharacter )] ou [GetTrait('whole_of_body').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$#indent_newline:6 Para [GetTrait('withering_mind').GetName( GetNullCharacter )]: [GetTrait('family_first').GetName( GetNullCharacter )], [GetTrait('seducer').GetName( GetNullCharacter )], conhecer [languages|E], muitos [friends|E] e [lovers|E]#!\n\nVocê tem mais chances de adquiri-los se tiver:\n$BULLET_WITH_TAB$Má [health|E]\n$BULLET_WITH_TAB$[GetTrait('drunkard').GetName( GetNullCharacter )] ou [GetTrait('reclusive').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetModifier( 'obese_modifier' ).GetNameWithTooltip] ou [GetModifier( 'malnourished_modifier' ).GetNameWithTooltip]\n$BULLET_WITH_TAB$Alto [stress|E]\n$BULLET_WITH_TAB$Pais ou avós com os traços"
 game_concept_excommunicated_recovery:0 "Recuperar-se da Excomunhão"
 game_concept_excommunicated_recovery_absolution_NO_PAM:0 "$EFFECT_LIST_BULLET$Usando #high $declaration_of_repentance_interaction$#! com sua [head_of_faith|E] ou um clérigo qualificado\n$EFFECT_LIST_BULLET$Vencer uma [excommunication_war|E] como defensor\n$EFFECT_LIST_BULLET$Converter-se a outra [faith|E]\n\n"
 game_concept_excommunicated_recovery_absolution_PAM:0 "$EFFECT_LIST_BULLET$Duques e abaixo (excomunhão local): #high $declaration_of_repentance_interaction$#! com um clérigo válido #weak (seu [head_of_faith|E] se nenhum clérigo inferior tiver patente superior à sua)#!\n$EFFECT_LIST_BULLET$Todos [rulers|E] excomungados por seu [head_of_faith|E], ou governando um reino ou império: petitione seu [head_of_faith|E] pessoalmente e escolha #high $petition_head_of_faith_decision_option_repentance$#!\n$EFFECT_LIST_BULLET$Vencer uma [excommunication_war|E] como defensor\n$EFFECT_LIST_BULLET$Converter-se a outra [faith|E]\n\n"
 game_concept_excommunicated_recovery_antipope:0 "Após a absolvição, patrocinar um [challenger_hof|E] pode proteger um [ruler|E] de futuras [excommunication|E] pelo [mainline_rite|E] [head_of_faith|E]."
 game_concept_excommunicated_recovery_desc:0 "[character|E][excommunicated|E] \n\n\n$EFFECT_LIST_BULLET$[legitimacy|E]\n$EFFECT_LIST_BULLET$[piety_level|E]\n$EFFECT_LIST_BULLET$#N #![piety|E][trait|E]\n[AddLocalizationIf( HasDlcFeature( 'by_god_alone' ), 'game_concept_excommunicated_recovery_spiritual_fulfillment' )]\n\n[excommunicated|E]\n$EFFECT_LIST_BULLET$[coronation|E]\n$EFFECT_LIST_BULLET$#high $seek_indulgences_interaction$#![interaction|E]\n$EFFECT_LIST_BULLET$[divorce|E]\n$EFFECT_LIST_BULLET$[holy_orders|E]\n\n\n$EFFECT_LIST_BULLET$[GetModifier('recent_excommunication').GetNameWithTooltip][modifier|E]\n$EFFECT_LIST_BULLET$[excommunication_war|E][rulers|E][faith|E][independent|E][ruler|E]\n\n\n[SelectLocalization( HasDlcFeature( 'by_god_alone' ), 'game_concept_excommunicated_recovery_absolution_PAM', 'game_concept_excommunicated_recovery_absolution_NO_PAM' )][AddLocalizationIf( HasDlcFeature( 'by_god_alone' ), 'game_concept_excommunicated_recovery_antipope' )]"
 game_concept_excommunicated_recovery_spiritual_fulfillment:0 "$EFFECT_LIST_BULLET$Perda de [spiritual_fulfillment|E]\n"
 game_concept_fragile_bones_mitigation:0 "Mitigar Ossos Frágeis"
 game_concept_fragile_bones_mitigation_desc:0 "Embora não seja possível impedir que [GetTrait('fragile_bones').GetName( GetNullCharacter )] progrida, você pode evitar grandes aumentos do [trait_level_track|E] fazendo:\n$EFFECT_LIST_BULLET$Evitando [travel|E] e [activities|E]\n$EFFECT_LIST_BULLET$Evitando [Concept( 'commander', 'Comandar Exércitos' )|E]"
 game_concept_infirm_mitigation:0 "Mitigar Enfermidade"
 game_concept_infirm_mitigation_desc:0 "Manter-se saudável é a principal forma de retardar a enfermidade.\n\nO [trait|E] [GetTrait('infirm').GetName( GetNullCharacter )] progride um nível completo ao contrair uma [illness|E], e progride um pouco a cada ano.\n\nSe você estiver doente por um longo período, o [trait_level_track|E] avançará muito mais rápido a cada ano. Também progride mais rápido se você tiver mais de 65 anos."
 game_concept_withering_mind_mitigation:0 "Mitigar Mente Definhante"
 game_concept_withering_mind_mitigation_desc:0 "Embora não seja possível impedir que [GetTrait('withering_mind').GetName( GetNullCharacter )] progrida, você pode retardar seu avanço:\n$EFFECT_LIST_BULLET$Ter [friends|E] #weak (quanto mais, melhor)#!\n$EFFECT_LIST_BULLET$Ter [lovers|E] #weak (quanto mais, melhor)#!\n$EFFECT_LIST_BULLET$Manter seu [stress|E] baixo\n$EFFECT_LIST_BULLET$Possuir os [traits|E] [GetTrait('family_first').GetName( GetNullCharacter )] ou [GetTrait('seducer').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[traveling|E] e participando de [activities|E]\n\nMuitos desses fatores também reduzem a chance de adquirir o [trait|E] inicialmente."
 genetic_desc:0 "Este traço é [congenital|E]"
