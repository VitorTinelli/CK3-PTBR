 trait_administrative_court_2_desc:0 "Este personagem passou pelo menos [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] anos vivendo em uma grandiosa [GetCourtType('court_administrative').GetName], observando o trabalho diário de burocratas eficientes e oficiais influentes."
