 lifestyle_herbalist_desc:0 "Esse personagem tem muito conhecimento sobre ervas, botânica e práticas médicas relacionadas a plantas."
 nomadic_philosophy_ender:0 "Eu contra meus irmãos — meus irmãos e eu contra meus primos — meus irmãos, meus primos e eu contra as outras tribos — todas as tribos contra o mundo."
 norman_opinion:0 "Opinião Normanda"
 the_wake:0 "O Despertar"
 the_wake_1:0 "Exilado"
 the_wake_1_desc:0 "Pobre jovem Hereweard, o nobre exilado. Um homem sem propósito, um errante sem destino. Tanto potencial, deixado tão não realizado."
 the_wake_2:0 "O Fora da Lei"
 the_wake_2_desc:0 "Um propósito encontrado, mas muito trabalho ainda precisa ser feito. Trabalho sangrento, até que os pântanos lamacentos fiquem vermelhos com o sangue dos forasteiros."
 the_wake_3:0 "O Açougueiro"
 the_wake_3_desc:0 "Homens menores se afundam e se afogam nos pântanos pegajosos e fétidos de onde este vem. Alguns até sussurram que ele pode andar na superfície de qualquer pântano, tal é seu domínio sobre os pântanos."
 the_wake_4:0 "O Ankou"
 the_wake_4_desc:0 "Crianças aterrorizadas ouvem histórias sobre a besta que perambula pelos pântanos, para que não se afastem muito da segurança."
 the_wake_5:0 "$the_wake$"
 the_wake_5_desc:0 "A sombra escura no crepúsculo perambula pela terra, sempre vigilante, sempre alerta. Hereweard, o Sanguinário, Hereweard, o Temido. Hereweard, o Despertar."
 trait_administrative_court:0 "Cortesãos Administrativos"
 trait_administrative_court_1:0 "Cortesão Administrativo"
 trait_administrative_court_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] passou pelo menos [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] anos vivendo em uma organizada [GetCourtType('court_administrative').GetName], lar de muitos burocratas e oficiais."
 trait_administrative_court_1_desc:0 "Este personagem passou pelo menos [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] anos vivendo em uma organizada [GetCourtType('court_administrative').GetName], lar de muitos burocratas e oficiais."
