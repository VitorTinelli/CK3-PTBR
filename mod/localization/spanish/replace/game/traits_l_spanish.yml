 trait_warlike_court_1:0 "Cortesão Guerreiro"
 trait_warlike_court_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] passou pelo menos [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] anos vivendo em uma agitada [GetCourtType('court_warlike').GetName], povoado por guerreiros e estrategistas."
