 trait_temperate:0 "Moderado"
 trait_temperate_character_desc:0 "De acordo com [ROOT.GetCharacter.GetFirstNameNoTooltip], é melhor aproveitar as coisas com moderação."
 trait_temperate_desc:0 "De acordo com esse personagem, é melhor aproveitar as coisas com moderação."
 trait_theologian:0 "Teólogo"
 trait_theologian_desc:0 "O divino contém a resposta para todas as perguntas, desde o que reside no coração dos homens até os mistérios da vida."
 trait_torturer:0 "Torturador"
 trait_torturer_desc:0 "infligir a dor e ter uma vida nas mãos, esse é o verdadeiro poder!"
 trait_tourney_participant:0 "Competidor de Justa"
 trait_tourney_participant_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] participou de jogos marciais, aprimorando suas habilidades em guerra e combate pessoal."
 trait_tourney_participant_desc:0 "Este personagem participou de jogos marciais, aprimorando suas habilidades em guerra e combate pessoal."
 trait_track_aggressive_attacker:0 "Especialista Ofensivo"
 trait_track_aggressive_attacker_desc:0 "#help Você ganha experiência nesse ramo ao iniciar ataques em combate.#!\n\nA melhor defesa é um ataque rápido e brutal."
 trait_track_bandit:0 "Bandido"
 trait_track_bandit_desc:0 "A luz da lei não se estende muito além dos muros da cidade; aqui fora, a força faz o direito."
 trait_track_bow:0 "Arco"
 trait_track_bow_desc:0 "Os músculos tanto da corda do arco quanto do arqueiro, unidos para enviar a flecha atingindo o alvo."
 trait_track_cautious_leader:0 "Comandante Tradicional"
 trait_track_cautious_leader_desc:0 "#help Você ganha experiência nesse ramo ao lutar contra exércitos maiores que o seu.#!\n\nPaciência e precisão garantem que cada movimento conte e cada perda seja minimizada."
 trait_track_clouded_eyes:0 "Olhos Turvos"
 trait_track_clouded_eyes_desc:0 "A visão se apaga e a luz se retira."
 trait_track_confucian_education:0 "Confucionismo"
 trait_track_confucian_education_desc:0 "Através da abstinência e da benevolência, construímos uma sociedade melhor, juntos.\n\n#weak Este [trait|E] pode ser aprimorado através da [character_interaction|E] #V $request_mentoring_interaction$#! ou [court_position_tasks|E] de #V $grand_mentor_court_position$#! ou [court_positions|E] #V $court_tutor_court_position$#!"
 trait_track_desert_warrior:0 "Especialista em Deserto"
 trait_track_desert_warrior_desc:0 "#help Você ganha experiência nesse ramo ao lutar em terrenos de deserto, montanhas desérticas, oásis ou terras áridas.#!\n\nNo deserto vasto e implacável, aqueles que resistem se elevam acima de todos."
 trait_track_falconer:0 "Falcoeiro"
 trait_track_falconer_desc:0 "Não há busca mais nobre do que a prática da caça com falcões e gaviões."
 trait_track_faltering_heart:0 "Coração Debilitado"
 trait_track_faltering_heart_desc:0 "Cada batida parece mais fraca que a anterior."
 trait_track_flexible_leader:0 "Improvisador"
 trait_track_flexible_leader_desc:0 "#help Você ganha experiência nesse ramo ao lutar contra exércitos em combate.#!\n\nA adaptação é a chave para a sobrevivência em qualquer campo de batalha."
 trait_track_foot:0 "Pé"
 trait_track_foot_desc:0 "O corpo humano é a ferramenta definitiva, e dominá-lo abrirá o mundo para você."
 trait_track_forder:0 "Especialista em Rios"
 trait_track_forder_desc:0 "#help Você ganha experiência nesse ramo ao lutar em províncias costeiras ou próximas a rios.#!\n\nOnde outros veem rios e córregos, alguns enxergam caminhos para a vitória."
 trait_track_forest_fighter:0 "Especialista em Floresta"
 trait_track_forest_fighter_desc:0 "#help Você ganha experiência nesse ramo ao lutar em terrenos de floresta ou taiga.#!\n\nEntre as árvores, cada sombra se torna um escudo, cada galho um aliado."
 trait_track_fragile_bones:0 "Ossos Frágeis"
 trait_track_fragile_bones_desc:0 "A cada dia o corpo se aproxima de se quebrar."
 trait_track_governor:0 "$trait_governor$"
 trait_track_governor_desc:0 "Impostos. Terras. Tropas. Tudo pode e deve ser administrado à perfeição.\n\n#weak Este [trait|E] pode ser aprimorado por ações que melhorem os [counties|E] mantidos ou beneficiem o [realm|E], como completar [governance_issues|E], construir [buildings|E], ou escolher certas opções em eventos.#!"
 trait_track_holy_warrior:0 "Fanático"
 trait_track_holy_warrior_desc:0 "#help Você ganha experiência nesse ramo ao lutar contra pessoas de outras fés.#!\n\nCom um coração fortalecido pela fé, nenhum inimigo é grande demais, nenhuma batalha é intimidadora demais."
 trait_track_horse:0 "Cavalo"
 trait_track_horse_desc:0 "Besta e cavaleiro em perfeita harmonia, gloriosos e livres sob o céu azul infinito."
 trait_track_hunter:0 "Caçador"
 trait_track_hunter_desc:0 "O som dos chifres, dos cães, da presa! Com arco ou estável, não há emoção que se compare a derrubar uma fera selvagem!"
 trait_track_infirm:0 "Enfermidade"
 trait_track_infirm_desc:0 "A inevitável degradação de carne e osso."
 trait_track_jungle_stalker:0 "Especialista em Selva"
 trait_track_jungle_stalker_desc:0 "#help Você ganha experiência nesse ramo ao lutar em terrenos de selva.#!\n\nA selva densa esconde aqueles que dominam suas profundezas, prontos para atacar das sombras."
 trait_track_knight_errant:0 "Justo"
 trait_track_knight_errant_desc:0 "Não é suficiente afirmar ser justo, é preciso demonstrar isso.\n\n#weak Este [trait|E] pode ser aprimorado ao completar [task_contracts|E] de Justiciar, Prowess ou Martial que demonstrem qualidades honoráveis."
 trait_track_lifestyle_blademaster:0 "Mestre das Armas"
 trait_track_lifestyle_blademaster_desc:0 "Anos de vida dedicados ao domínio de uma arma, para que sua graça resultante possa um dia salvar uma vida e pôr fim a outra."
 trait_track_lifestyle_mystic:0 "Místico"
 trait_track_lifestyle_mystic_desc:0 "Os mistérios do mundo, tanto físicos quanto espirituais, são revelados com reflexão suficiente."
 trait_track_lifestyle_physician:0 "Médico"
 trait_track_lifestyle_physician_desc:0 "Estanque o fluxo de sangue aqui, abra uma veia ali. Logo os humores estarão equilibrados!"
 trait_track_lifestyle_poet:0 "Poesia"
 trait_track_lifestyle_poet_desc:0 "Palavras podem conquistar fama eterna e a pena pode cortar mais fundo que a lâmina mais afiada."
 trait_track_lifestyle_reveler:0 "Festeiro"
 trait_track_lifestyle_reveler_desc:0 "Uma bebida e uma risada, tudo na companhia certa. O que mais há na vida?"
 trait_track_lifestyle_scholar:0 "Estudioso Religioso"
 trait_track_lifestyle_scholar_desc:0 "A divindade concede conhecimento generosamente a todos sem censura.\n\n#weak Este [trait|E] pode ser elevado participando de um [GetActivityType( 'activity_ecumenical_council').GetName].\n\nNo Nível 3, o [trait|E] começa a conceder imunidade ao [ecclesiastic_transfer_land_interaction|E] [interaction|E].#!"
 trait_track_logistician:0 "Fornecedor"
 trait_track_logistician_desc:0 "#help Você ganha experiência nesse ramo ao liderar um exército enquanto se move pelo mapa.#!\n\nDominar o suprimento é dominar a guerra, garantindo que um exército nunca vacile quando mais importa."
 trait_track_marauder:0 "Saqueador"
 trait_track_marauder_desc:0 "É menos glamoroso sequestrar e matar fora da alta sociedade, mas não necessariamente menos lucrativo."
 trait_track_military_engineer:0 "Cerqueiro"
 trait_track_military_engineer_desc:0 "#help Você ganha experiência nesse ramo ao completar cercos com sucesso.#!\n\nNa guerra, obstáculos são apenas desafios a serem superados."
 trait_track_monastic:0 "Antiguidade Monástica"
 trait_track_monastic_desc:0 "Este devoto obedeceu a uma Regra enquanto vivia em uma comunidade pia de seus semelhantes, e avançou dentro da hierarquia protegida de sua Ordem. \n\n#weak Este [trait|E] aumenta ao pertencer a um [monastic_holy_order|E], e é elevado por [piety|E], [learning|E] e laços influentes com [rulers|E] seculares e [clergy|E]"
 trait_track_open_terrain_expert:0 "Especialista em Terreno Aberto"
 trait_track_open_terrain_expert_desc:0 "#help Você ganha experiência nesse ramo ao lutar em terrenos de planícies, terras agrícolas ou estepes.#!\n\nO campo aberto oferece oportunidades ilimitadas para manobrar e dominar o inimigo."
 trait_track_organizer:0 "Marchador"
 trait_track_organizer_desc:0 "#help Você ganha experiência nesse ramo ao liderar um exército enquanto se move pelo mapa.#!\n\nUma força bem coordenada se move rapidamente e ataca com precisão."
 trait_track_pilgrim:0 "Peregrino"
 trait_track_pilgrim_desc:0 "Pés calosos, membros doloridos, rosto envelhecido. É um pequeno preço a pagar por cumprir seu dever sagrado."
 trait_track_poacher:0 "Caçador Furtivo"
 trait_track_poacher_desc:0 "Não há mal se é apenas um animal. Certo?"
 trait_track_reaver:0 "Saqueador"
 trait_track_reaver_desc:0 "Onde o Saqueador pisa, o mundo é remodelado pelo fogo e pela conquista."
 trait_track_reckless:0 "Comandante Experimental"
 trait_track_reckless_desc:0 "#help Você ganha experiência nesse ramo ao lutar contra exércitos maiores que o seu.#!\n\nA sorte favorece aqueles ousados o suficiente para arriscar tudo pela grandeza."
 trait_track_rough_terrain_expert:0 "Especialista em Terreno Difícil"
 trait_track_rough_terrain_expert_desc:0 "#help Você ganha experiência nesse ramo ao lutar em terrenos de colinas, montanhas ou pântanos.#!\n\nNos terrenos mais difíceis, a vitória vem para aqueles que enfrentam o desafio."
 trait_track_scarred:0 "Cicatrizado"
 trait_track_scarred_desc:0 "Uma cicatriz é frequentemente vista como um sinal de coragem, mas sempre há um ponto de virada para esse atrativo..."
 trait_track_the_wake:0 "Perseguidor do Pântano"
 trait_track_the_wake_desc:0 "O destino tece sua sutil teia. O que é meu por direito será recuperado pela força.\n\n#weak Este traço pode ser aprimorado ao derrotar [characters|E] da cultura #BOL $norman$#! em [battle|E] ou em [single_combat_duel_plural|E].#!"
 trait_track_thief:0 "Ladrão"
 trait_track_thief_desc:0 "A posse é nove décimos da lei, afinal."
 trait_track_trickster:0 "Trapaceiro"
 trait_track_trickster_desc:0 "Uma mente lenta não é apenas uma tragédia — para os astutos, é uma #EMP oportunidade#!."
 trait_track_unyielding_defender:0 "Especialista Defensivo"
 trait_track_unyielding_defender_desc:0 "#help Você ganha experiência nesse ramo ao defender em combate.#!\n\nUma fortaleza é tão forte quanto a determinação daqueles que estão dentro dela."
 trait_track_violet_poet:0 "Rapsodista"
 trait_track_violet_poet_desc:0 "A expressão mais verdadeira de um poeta não pode ser apenas por palavras, mas também pela alma e pelo corpo.\n\n#weak Este [trait|E] pode ser aprimorado de duas maneiras: ou escrevendo poesias, ou por métodos mais #UND amorosos#!."
 trait_track_winter_soldier:0 "Rastreio Invernal"
 trait_track_winter_soldier_desc:0 "#help Você ganha experiência nesse ramo ao lutar em províncias afetadas pelo inverno.#!\n\nO frio congelante não é um inimigo — torna-se um aliado para aqueles que resistem e perseveram."
 trait_track_wit:0 "Inteligência"
 trait_track_wit_desc:0 "A força desaparece, a beleza murcha, mas uma mente afiada o levará através das situações mais sombrias."
 trait_track_withering_mind:0 "Mente Definhante"
 trait_track_withering_mind_desc:0 "A lenta descida ao esquecimento."
 trait_trusting:0 "Confiante"
 trait_trusting_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] não hesita em confiar nos outros."
 trait_trusting_desc:0 "Este personagem não hesita em confiar nos outros."
