 inspection_conclusion_success_piety_key_title:0 "Inspeção Devocional"
 inspection_conclusion_success_popular_opinion_key:0 "[host.GetShortUIName] viu um aumento em sua popularidade após [host.GetSheHe] ter visitado [province.GetName]."
 inspection_conclusion_success_popular_opinion_key_title:0 "Governante Popular"
 inspection_conclusion_success_salary_key:0 "[host.GetShortUIName] ganhou bastante ouro e um significativo bônus salarial após realizar uma inspeção bem-sucedida."
 inspection_conclusion_success_salary_key_title:0 "Bônus Salarial Generoso"
 inspection_conclusion_success_tax_key:0 "[host.GetShortUIName] melhorou e removeu muitas das brechas fiscais em [province.GetName]."
 inspection_conclusion_success_tax_key_title:0 "Impostos Ajustados"
 inspection_empty_lands_border_modifier:0 "Pequeno Posto Avançado"
 inspection_empty_lands_border_modifier_desc:0 "Um pequeno posto avançado de fronteira foi construído como um primeiro passo para colonizar a área.\n#emp Será convertido em uma [fortification_building|E] se uma [holding|E] for construída#!"
 inspection_empty_lands_domain_modifier:0 "Estrada de Pedágio"
 inspection_empty_lands_domain_modifier_desc:0 "Esta região remota viu melhorias em suas estradas locais.\n#emp Será convertida em uma [economic_building|E] se uma [holding|E] for construída#!"
 inspection_empty_lands_populace_modifier:0 "Visita do Governante"
 inspection_empty_lands_populace_modifier_desc:0 "Os pastores de cabras locais tiveram a honra de conhecer seu senhor feudal pessoalmente."
 inspection_expanding_walls_new_desc:0 "\t#weak Aumenta para cada espaço livre de [building|E]#!"
 inspection_expanding_walls_new_modifier:0 "Espaço para Expansão"
 inspection_expanding_walls_new_modifier_desc:0 "Esta cidade encontrou espaço para expansão, após mover uma seção das suas muralhas."
 inspection_expanding_walls_old_desc:0 "\t#weak Aumenta para cada [building|E]#!"
 inspection_expanding_walls_old_modifier:0 "Investido nas Guildas"
 inspection_expanding_walls_old_modifier_desc:0 "As guildas locais tiveram um pequeno impulso em suas fortunas, após um pequeno investimento ser alocado para a manutenção do distrito comercial."
