 inspection_conclusion_failure_salary_key_title:0 "Bônus Salarial Modesto"
 inspection_conclusion_impressed_neighbors_key:0 "Devido aos esforços diplomáticos [host.GetHerHim], [host.GetSheHe] melhorou as relações com alguns dos seus vizinhos."
 inspection_conclusion_impressed_neighbors_key_title:0 "Vizinhos Impressionados"
 inspection_conclusion_success_acceptance_key:0 "[host.GetShortUIName] impressionou vários de seus vizinhos com sua diplomacia."
 inspection_conclusion_success_acceptance_key_title:0 "Diplomacia Bem-Sucedida"
 inspection_conclusion_success_claim_key:0 "[host.GetShortUIName] conseguiu estabelecer sua reivindicação sobre as terras de fronteira de [province.GetName]."
 inspection_conclusion_success_claim_key_title:0 "Reivindicação Bem-Sucedida"
 inspection_conclusion_success_control_key:0 "A guarnição local foi reforçada e recondicionada para lidar com quaisquer problemas em [province.GetName]."
 inspection_conclusion_success_control_key_title:0 "Controle Reforçado"
 inspection_conclusion_success_development_key:0 "As estradas e pontes de [province.GetName] receberam uma quantia significativa de dinheiro para renovação."
 inspection_conclusion_success_development_key_title:0 "Infraestrutura Melhorada"
 inspection_conclusion_success_governor_experience_key:0 "[host.GetShortUIName] ganhou experiência valiosa em seu papel como [host.Custom('GetGovernorConceptNoTooltip')] após [host.GetSheHe] visitar [province.GetName]."
 inspection_conclusion_success_governor_experience_key_title:0 "Experiência de [host.Custom('GetGovernorConceptNoTooltip')]"
 inspection_conclusion_success_levy_key:0 "As milícias locais em [province.GetName] tiveram um aumento significativo após serem visitados por [host.GetShortUIName]."
 inspection_conclusion_success_levy_key_title:0 "Milícias Melhoradas"
