 activity_survey_conclusion_desc:0 "Esta jornada me deu uma ótima chance de ver mais do meu reino, mas eu só posso ficar aqui por tanto tempo. Meu trabalho aqui está feito, é hora de voltar para casa."
 activity_survey_desc:0 "Realize uma inspeção minuciosa de suas terras para garantir que seu reino seja uma máquina bem funcional e procure oportunidades para melhorar a atual burocracia e situação."
 activity_survey_destination_selection:0 "\n[inspections|E] se beneficiam ao ocorrer em [counties|E] com baixo [county_control|E] ou ao longo da fronteira com [realms|E] estrangeiros, onde a burocracia local está falhando. Essas áreas podem oferecer mais oportunidades e têm uma chance aumentada de [inspection_success_chance_no_prefix|E]."
