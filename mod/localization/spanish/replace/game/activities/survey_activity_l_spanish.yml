 inspection_bandits_in_x_border_negative_modifier:0 "Bandidos Implacáveis"
 inspection_bandits_in_x_border_negative_modifier_desc:0 "Criminosos têm um controle rígido sobre o condado, administrando grande parte dos negócios do dia a dia nos bastidores."
 inspection_bandits_in_x_border_positive_modifier:0 "Ruas Seguras"
 inspection_bandits_in_x_border_positive_modifier_desc:0 "As pessoas da área se sentem seguras sabendo que bandidos não são um grande problema ou ameaça."
 inspection_bandits_in_x_domain_modifier:0 "Guarnição Mercenária"
 inspection_bandits_in_x_domain_modifier_desc:0 "Um grupo de mercenários e bandidos foi contratado para reforçar a guarnição local."
 inspection_bandits_in_x_populace_modifier:0 "Governante Protetor"
 inspection_bandits_in_x_populace_modifier_desc:0 "Este personagem se esforçou para proteger seu povo, até colocando sua própria vida em risco."
