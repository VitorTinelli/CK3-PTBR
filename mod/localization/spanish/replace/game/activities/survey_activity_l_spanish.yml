 bp3_survey.0005.a.tt:0 "A [inspection|E] tentará:$SurveyArrivalIntroClaims$ $SurveyARrivalIntroVassals$"
 bp3_survey.0005.a:0 "Expandir minhas fronteiras."
 bp3_survey.0005.b.tt:0 "A [inspection|E] tentará:$SurveyArrivalIntroTax$ $SurveyArrivalIntroDevelopment$ $SurveyArrivalIntroControl$"
 bp3_survey.0005.b:0 "Melhorar a burocracia aqui em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]."
 bp3_survey.0005.c.tt:0 "A [inspection|E] tentará:$SurveyArrivalIntroLevy$ $SurveyArrivalIntroOpinion$ $SurveyArrivalIntroPopularOpinion$"
 bp3_survey.0005.c:0 "Garantir que o povo aqui lembre-se do porquê sou seu senhor feudal."
 bp3_survey.0005.desc.holder:0 "Ao chegar em [ROOT.Char.GetCurrentLocation.GetName], sou levad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a um pequeno escritório onde [Select_CString( county_holder.IsFemale, 'a', 'o' )] [county_holder.GetTitledFirstName] me recebe. Enviei um mensageiro anteriormente, então não deve ser surpresa que eu esteja aqui, mas [county_holder.GetSheHe] está claramente curioso quanto aos motivos de minha visita. Todo o alvoroço [county_holder.GetHerHim], é por culpa de uma consciência pesada ou são apenas palavras vazias?\n\nNão importa, não estou aqui para lidar com [county_holder.GetSheHe] agora, estou aqui para..."
 bp3_survey.0005.desc.no_holder:0 "Ao chegar em [ROOT.Char.GetCurrentLocation.GetName], sou levad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ao escritório. Um grupo de criados atende a todas as minhas necessidades e fica correndo ao meu redor por um tempo, até que eu peço para saírem. Como posso focar no que tenho que fazer, se estão correndo pela sala?\n\nCom eles fora de cena, finalmente posso começar a trabalhar nos meus planos, que são..."
 bp3_survey.0005.t:0 "Chegada"
 bp3_survey.0010.a:0 "Como planejado."
 bp3_survey.0010.acceptance.positive:0 "Aumento da Aceitação de [offer_vassalization|E] de [THIS.Char.GetName]: "
 bp3_survey.0010.acceptance.success:0 "$bp3_survey.0010.acceptance.positive$ #p +10#!"
 bp3_survey.0010.b:0 "Voltarei e corrigirei isso em algum outro momento."
 bp3_survey.0010.desc.border.failure:0 "Apesar de nossos melhores esforços, cada tentativa de reivindicar as terras fronteiriças de [province.GetName] falhou, ou até foi embaraçosamente infrutífera. Alguns dos locais das terras fronteiriças começaram a dizer 'tão bem-sucedido quanto [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitledFirstName]' como um idiomatismo para jovens rejeitados.\n\nEstou começando a me arrepender de tudo isso..."
 bp3_survey.0010.desc.border.success:0 "Nossos esforços ao longo da fronteira de [province.GetName] foram um grande sucesso. Definimos claramente a área como uma que deve estar sob a supervisão do [ROOT.Char.GetPrimaryTitle.GetName], e isso é refletido em como as pessoas falam sobre ela.\n\nMuitos locais supostamente falam de mim como se eu já fosse o seu governante."
 bp3_survey.0010.desc.bureaucracy.failure:0 "Às vezes, parecia que talvez houvesse um fim para a corrupção que assola [province.GetName], mas a cada virada, algo novo precisava ser corrigido. Sempre havia outro grupo de bandidos saqueando, outro nobre corrupto escondendo impostos, ou outro edifício que precisava de renovação.\n\nEmbora tenha sido um esforço heroico de minha parte, há um limite para o que um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] pode fazer..."
 bp3_survey.0010.desc.bureaucracy.success:0 "Parecia impossível no início, mas de alguma forma consegui encontrar uma maneira de começar a colocar as coisas no lugar em [province.GetName], encerrando parte da corrupção local e os bandidos. Embora seja apenas o primeiro passo na direção certa, é crucial para o futuro do condado.\n\nAgora precisamos garantir que permaneçamos no caminho certo no futuro próximo."
 bp3_survey.0010.desc.people.failure:0 "Não importa o quanto eu tenha falado ou interagido com os locais em [province.GetName], o condado tem uma constante sensação de descontentamento. Apesar de meus melhores esforços, não sei como abordar ou resolver esse problema.\n\nTalvez não seja para ser, pelo menos não agora."
 bp3_survey.0010.desc.people.success:0 "Vimos um aumento significativo na popularidade entre os locais em [province.GetName], a ponto de alguns aparentemente usarem 'ser como [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetFirstName]' como um ditado. Era só uma questão de tempo até que aprendessem a apreciar seus superiores.\n\nEspero que se lembrem disso da próxima vez que algum problema insignificante surgir."
 bp3_survey.0010.t:0 "Conclusão"
 bp3_survey.0020.a.tt:0 "Recompensa de Aceitação de [offer_vassalization|E] melhorada se a [inspection|E] for bem-sucedida\n"
 bp3_survey.0020.a:0 "Vamos encontrar algum tipo de compromisso com est[Select_CString( neighboring_lord.IsFemale, 'a', 'e' )] [neighboring_lord.GetFirstNameNoTooltip]."
 bp3_survey.0020.acceptance.great_success:0 "$bp3_survey.0020.acceptance.positive$ #p +10#!"
 bp3_survey.0020.acceptance.positive:0 "Aceitação de [offer_vassalization|E] aumentada de [neighboring_lord.GetName]: "
 bp3_survey.0020.acceptance.success:0 "$bp3_survey.0020.acceptance.positive$ #p +5#!"
 bp3_survey.0020.b.tt:0 "Recompensa de [claims|e] melhorada se a [inspection|E] for bem-sucedida\n"
 bp3_survey.0020.b:0 "É hora de tornar essas terras minhas."
 bp3_survey.0020.desc:0 "Viajo para as terras de fronteira de [province.GetName], vendo as bordas do meu reino. Um deserto vazio, esperando por um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetLadyLord] com alguma ambição para assumir as rédeas. Alguém com visão para o potencial.\n\n"
 bp3_survey.0020.desc_no_neighbor:0 "Com ninguém mais de destaque nas proximidades, estabelecer domínio e reivindicar estas terras não deve ser um problema."
 bp3_survey.0020.desc_weak_neighbor:0 "Supostamente, um certo [neighboring_lord.GetName] é a coisa mais próxima de um nobre responsável por estas terras. Um[Select_CString( neighboring_lord.IsFemale, 'a', '' )] [neighboring_lord.GetWomanMan] fraco esperando que alguém diga a [neighboring_lord.GetSheHe] o que fazer, pelo que ouvi."
 bp3_survey.0020.t:0 "Planos para Expansão"
 bp3_survey.0030.a.tt:0 "Recompensa de [tax|E] melhorada se a [inspection|E] for bem-sucedida\n"
 bp3_survey.0030.a:0 "Corrigir as brechas fiscais locais se pagará com o tempo."
 bp3_survey.0030.b.tt:0 "Recompensa de [development|E] melhorada se a [inspection|E] for bem-sucedida\n"
 bp3_survey.0030.b:0 "A [province.Custom('SurveyMidDomainInfrastructureOptionsLoc')] [province.GetNameNoTooltip] precisa da ajuda."
 bp3_survey.0030.c.tt:0 "Recompensa de [control|E] melhorada se a [inspection|E] for bem-sucedida\n"
 bp3_survey.0030.c:0 "A guarnição local tem enfrentado dificuldades ultimamente."
 bp3_survey.0030.d:0 "Na verdade... #emp Eu#! preciso desse dinheiro."
 bp3_survey.0030.desc:0 "Após examinar minuciosamente todos os documentos que pude encontrar, consegui obter um orçamento extra que posso realocar para aliviar alguns dos problemas de infraestrutura local que afligem o condado. Só preciso descobrir qual seção da burocracia mais precisa de algum auxílio adicional."
 bp3_survey.0030.t:0 "Supervisionando [province.GetNameNoTooltip]"
 bp3_survey.0040.a.tt:0 "Recompensa de [levy|E] melhorada se a [inspection|E] for bem-sucedida\n"
 bp3_survey.0040.a:0 "As milícias e a guarnição local."
 bp3_survey.0040.b.tt:0 "Recompensa de [opinion|E] melhorada se a [inspection|E] for bem-sucedida\n"
 bp3_survey.0040.b:0 "O quanto fiquei impressionad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com o trabalho que [Select_CString( county_holder.IsFemale, 'a', 'o' )] [county_holder.GetFirstNameNoTooltip] está fazendo."
 bp3_survey.0040.c.tt:0 "Recompensa de [county_opinion|E] melhorada se a [inspection|E] for bem-sucedida\n"
 bp3_survey.0040.c:0 "A ótima impressão que tenho de [province.GetNameNoTooltip]."
 bp3_survey.0040.desc:0 "Como parte dos meus esforços para melhorar nossa posição com o povo de [province.GetName], reservei o dia para viajar pela cidade e me encontrar com os locais."
 bp3_survey.0040.mid:0 "Apesar das objeções [county_holder.GetHerHim], trouxe [Select_CString( county_holder.IsFemale, 'a', 'o' )] [county_holder.GetFirstName] para que [county_holder.GetSheHe] veja como deve ser feito."
 bp3_survey.0040.outro:0 "\n\nEmbora tenham algumas reservas no início, vemos um grande grupo de locais querendo nos contar sobre seus problemas. Se eu tiver oportunidade, falarei sobre..."
 bp3_survey.0040.t:0 "O Povo de [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip]"
 bp3_survey.0050.a.tt:0 "[host.GetName] está realizando uma [inspection|E] em [province.GetName]"
 bp3_survey.0050.a:0 "Bem-vindo a [province.GetNameNoTooltip], m[Select_CString( host.IsFemale, 'inha', 'eu' )] [host.GetTitleAsNameNoTooltip]."
 bp3_survey.0050.desc:0 "Embora [host.GetSheHe] tenha enviado um mensageiro com antecedência, ainda é um pouco de surpresa quando vejo [Select_CString( host.IsFemale, 'minha senhora feudal', 'meu senhor feudal' )], [host.GetFirstName], chegar pessoalmente à minha corte em [province.GetName]. [host.GetSheHe|U] explicou que [host.GetSheHe] está aqui para \"supervisionar\" as coisas [host.GetSheHe] mesm[Select_CString( host.IsFemale, 'a', 'o' )], sem entrar em detalhes.\n\nTento por bastante tempo ver se há algo em particular que [host.GetSheHe] quer de mim, mas [host.GetSheHe] diz que [host.GetSheHe] tem tudo o que precisa. Espero que [host.GetSheHe] não encontre nada que [host.GetSheHe] não deveria..."
 bp3_survey.0050.t:0 "Senhor Feudal na Corte"
 bp3_survey.1000.a:0 "Enviar algumas pessoas para estabelecer um pequeno posto avançado na região."
 bp3_survey.1000.b:0 "Investir em algumas estradas para a área, para que eu possa enviar pessoas para cá."
 bp3_survey.1000.c:0 "Preciso entrar em contato com os locais."
 bp3_survey.1000.desc:0 "Enquanto fazemos o levantamento das regiões mais obscuras de [province.GetName], [guest_1.GetFirstName] e eu encontramos uma pequena área chamada de [empty_province.Custom('HoldingNoHoldingTerrainRoamingTooltip')]."
 bp3_survey.1000.desc_border:0 "Se eu quiser expandir meu domínio, preciso garantir que tenho vassalos que possam refletir meu poder até os cantos do meu reino."
 bp3_survey.1000.desc_bureaucracy:0 "Se eu quiser garantir meu controle sobre [province.GetNameNoTooltip], preciso ter um melhor controle sobre a população, mesmo nessas terras remotas."
 bp3_survey.1000.desc_continuation:0 "Além de alguns pastores de cabras, não parece haver ninguém morando aqui. Sempre que passamos por eles, olham para nós com desconfiança nos olhos.\n\n"
 bp3_survey.1000.desc_domain:0 "Se eu quiser inspirar minha população, preciso garantir que até as pessoas que vivem nesse local isolado conheçam meu rosto e nome."
 bp3_survey.1000.desc_lonely:0 "Enquanto faço o levantamento das regiões mais obscuras de [province.GetName], encontro uma pequena área chamada de [empty_province.Custom('HoldingNoHoldingTerrainRoamingTooltip')]."
 bp3_survey.1000.t:0 "Terras Vazias"
 bp3_survey.1010.a.lose:0 "A situação piora ainda mais"
 bp3_survey.1010.a.lose_short:0 "Pernas de ferro entrincheiradas"
 bp3_survey.1010.a.win:0 "Reúna a guarnição local e se livre dos bandidos"
 bp3_survey.1010.a.win_short:0 "Guarnição reunida"
 bp3_survey.1010.a:0 "Faça a guarnição expulsá-los da cidade."
 bp3_survey.1010.b.flavor:0 "Parece que eles sabem lidar com os locais, afinal."
 bp3_survey.1010.b:0 "Talvez eles aceitem uma proposta de trabalho..."
 bp3_survey.1010.c.lose:0 "Ferido pelo vagabundo"
 bp3_survey.1010.c.win:0 "Afugentar o vagabundo"
 bp3_survey.1010.c.win_short:0 "Vagabundo afugentado"
 bp3_survey.1010.c:0 "Preciso intervir!"
 bp3_survey.1010.d.flavor:0 "[bandit_character.GetSheHe|U] está ocupado roubando outra pessoa, corra!"
 bp3_survey.1010.d:0 "Afaste [bandit_character.GetSheHe] de mim!"
 bp3_survey.1010.desc:0 "Enquanto viajo pelas ruas de [province.GetName], de repente me vejo diante de um[Select_CString( peasant_character.IsFemale, 'a', '' )] [peasant_character.GetWomanMan] sendo ameaçad[Select_CString( peasant_character.IsFemale, 'a', 'o' )] por algum tipo de vagabundo no meio do dia. [peasant_character.GetSheHe|U] grita por ajuda, enquanto [peasant_character.GetSheHe] me olha e olha para meus guardas.\n\nAlguns mercenários na cidade têm se voltado para a bandidagem e o crime para se sustentar ultimamente, mas eu não sabia que as coisas tinham chegado a esse ponto. Quero intervir e ajudar est[Select_CString( peasant_character.IsFemale, 'a', 'e' )] pobre [peasant_character.GetWomanMan]?"
 bp3_survey.1010.t:0 "Os Vagabundos em [province.GetNameNoTooltip]"
 bp3_survey.1020.a:0 "Alocarei os fundos necessários para isso."
 bp3_survey.1020.b:0 "Cobrar dos cidadãos."
 bp3_survey.1020.c:0 "A guarnição pode cuidar disso."
 bp3_survey.1020.d:0 "Não é um grande problema."
 bp3_survey.1020.desc:0 "Enquanto viajo pela [province.Custom('HoldingNoHoldingTerrainRoamingTooltip')], reflito sobre um problema muito comum. Assim que saímos da cidade, nos vemos presos em valas lamacentas, seguindo caminhos que não levam a lugar algum.\n\nEssas velhas estradas mal são úteis, se é que são úteis. A menos que eu tome providências para alocar homens para começar os reparos, provavelmente começará a afetar os cidadãos locais e os comerciantes estrangeiros, se já não estiver afetando."
 bp3_survey.1020.t:0 "As Velhas Estradas de [province.GetCounty.GetName]"
 bp3_survey.1030.a.loss:0 "Isso se transforma em uma luta pelo poder que afeta toda [city_province.GetNameNoTooltip]"
 bp3_survey.1030.a.loss_short:0 "Eles se recusam a chegar a um acordo"
 bp3_survey.1030.a.win:0 "Eles encontram um compromisso"
 bp3_survey.1030.a:0 "Há espaço para ambos!"
 bp3_survey.1030.b:0 "Apoiar a [city_province.Custom('InspectionFightingGuilds1Loc')]."
 bp3_survey.1030.c:0 "Ajudar a [city_province.Custom('InspectionFightingGuilds2Loc')]."
 bp3_survey.1030.d:0 "[city_province.Custom('InspectionFightingGuilds1Loc')]? [city_province.Custom('InspectionFightingGuilds2Loc')]?! Ora, esse ouro é meu!"
 bp3_survey.1030.desc:0 "Enquanto estou no meio de uma discussão com um dos meus burocratas, sou repentinamente interrompido por dois grupos gritando um com o outro a poucos passos de distância. Meus guardas conseguem separá-los, mal e mal, enquanto os representantes das duas facções continuam se insultando.\n\nApós várias tentativas de acalmá-los, finalmente entendo que isso é uma disputa entre a [city_province.Custom('InspectionFightingGuilds1Loc')] e a [city_province.Custom('InspectionFightingGuilds2Loc')] por direitos de propriedade na parte mais importante do centro da cidade."
 bp3_survey.1030.t:0 "Conflito Entre as Guildas"
 bp3_survey.1040.a.death:0 "Preso nas chamas"
 bp3_survey.1040.a.loss:0 "O fogo se espalha apesar das suas melhores intenções"
 bp3_survey.1040.a.win:0 "Você ajuda a apagar o fogo"
 bp3_survey.1040.a:0 "As pessoas precisam ser salvas!"
 bp3_survey.1040.b:0 "Vou reservar fundos mais tarde, vamos focar em salvar o que pudermos."
 bp3_survey.1040.c.loss:0 "As pessoas sabem o que você realmente fez"
 bp3_survey.1040.c.win:0 "As pessoas acreditam que você tentou ajudar"
 bp3_survey.1040.c:0 "Um fogo ainda maior colocará [Select_CString( county_owner.IsFemale, 'a', 'o' )] [county_owner.GetFirstNameNoTooltip] em seu devido lugar."
 bp3_survey.1040.d:0 "Não há mais nada que eu possa fazer aqui..."
 bp3_survey.1040.desc:0 "Enquanto ando pelas ruas de [province.GetName], meu séquito e eu deparamos com um incêndio que devasta um dos distritos mais antigos da cidade. Muitos estão parados, boquiabertos em choque ou chorando baixinho por algum corpo estendido na calçada.\n\nUma dúzia de soldados tenta desesperadamente conter o fogo antes que ele consuma o restante da cidade e deixe apenas cinzas em seu rastro."
 bp3_survey.1040.destroyed_building:0 "O fogo se espalha"
 bp3_survey.1040.t:0 "O Fogo se Espalha"
 bp3_survey.1050.a:0 "Vamos focar nas antigas muralhas em ruínas de [province.GetNameNoTooltip]."
 bp3_survey.1050.b:0 "Os comerciantes têm razão."
 bp3_survey.1050.c:0 "Não temos ouro suficiente para distribuir para qualquer um."
 bp3_survey.1050.desc:0 "Encontro-me, mais uma vez, em conversa com alguns locais sobre como devo priorizar a reestruturação de [province.GetName]. 'Mova e reconstrua as antigas muralhas da cidade, meu senhor feudal', diz o Capitão [soldier_character.GetNameNoTooltip] da guarnição local, com um piscar de olhos, 'Pense em quanto espaço teríamos para um novo distrito residencial!'\n\n'Não, não! O antigo distrito comercial está em necessidade urgente de uma reforma.' [merchant_character.GetNameNoTooltip], um representante das guildas locais, interrompe a conversa sem hesitação. 'Imagine como a cidade será mais animada com um distrito comercial ativo!'"
 bp3_survey.1050.t:0 "Expandindo as Muralhas da Cidade"
 bp3_survey.1060.a:0 "O que estamos esperando? Cavem! CAVEM!"
 bp3_survey.1060.desc.copper:0 "\"Meu senhor,\" exclama de repente um dos meus soldados, [soldier_character.GetFirstNameNoTooltip], \"Isso não é uma veia de cobre?\""
 bp3_survey.1060.desc.gold:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" exclama um dos meus soldados com os olhos arregalados, [soldier_character.GetFirstNameNoTooltip], \"Isso é um pedaço de ouro?\""
 bp3_survey.1060.desc.silver:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" exclama de repente um dos meus soldados, [soldier_character.GetFirstNameNoTooltip], \"Esse brilho deve ser prata!\""
 bp3_survey.1060.desc:0 "Enquanto inspeciono as terras ao redor de [province.GetName], meu séquito e eu nos deparamos com uma antiga estrada oculta. Embora bem escondida, ela leva a uma pequena elevação, e especificamente a uma caverna onde encontramos equipamentos de mineração abandonados espalhados pelo chão da caverna.\n\n"
 bp3_survey.1060.t:0 "Cuide da Sua Própria Mina"
 bp3_survey.1070.a.flavor:0 "Dê um exemplo daqueles responsáveis, para que os outros saibam o que está em jogo."
 bp3_survey.1070.a:0 "Os nobres #emp vão#! pagar o que devem, de um jeito ou de outro."
 bp3_survey.1070.b.flavor:0 "Os locais não vão apreciar, mas o dinheiro é necessário."
 bp3_survey.1070.b:0 "Um imposto único sobre os locais compensará essas perdas."
 bp3_survey.1070.c.flavor:0 "Mostrar clemência será apreciado, espero."
 bp3_survey.1070.c:0 "Vou deixar passar, desta vez..."
 bp3_survey.1070.desc.intro.personal:0 "Ao revisar os impostos arrecadados pelos meus administradores e vice-reis locais, noto discrepâncias claras entre o que foi registrado em certas áreas e o que recebi.\n\n"
 bp3_survey.1070.desc.intro.vassal:0 "Ao revisar os impostos recebidos enquanto [province.GetName] estava sob o domínio d[Select_CString( county_owner.IsFemale, 'a', 'o' )] [county_owner.GetFirstNamePossessive], noto uma clara discrepância entre o que me era devido e o que foi entregue. Embora [Select_CString( county_owner.IsFemale, 'a', 'o' )] [county_owner.GetFirstNameNoTooltip] devesse ter percebido isso, os números incorretos foram adicionados antes de chegarem à mesa [county_owner.GetHerHim] em primeiro lugar.\n\n"
 bp3_survey.1070.desc:0 "Independentemente de quem exatamente seja o culpado, é claro que alguém precisa pagar. Os locais já pagaram sua parte, mas são mais fáceis de pressionar do que os verdadeiros responsáveis por esses 'erros'."
 bp3_survey.1070.t:0 "Irregularidades Regulares"
 bp3_survey.1080.a:0 "Vou recrutar uma pequena patrulha para proteger os viajantes."
 bp3_survey.1080.b:0 "Deixe que os cidadãos cuidem de seus visitantes."
 bp3_survey.1080.c:0 "Eles podem se defender."
 bp3_survey.1080.desc.holy_poi:0 "Parece que [ROOT.GetCharacter.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip] de todas as partes viajaram até [location_province.GetName] para ver o local mais sagrado, [location_province.Custom('GetSpecialBuildingPrefix')][location_province.GetHolding.GetSpecialBuildingType.GetName], apenas para serem interceptados por criminosos."
 bp3_survey.1080.desc.holy_site:0 "Parece que [ROOT.GetCharacter.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip] de todas as partes vieram até [location_province.GetName] para ver o local sagrado, apenas para serem interceptados por criminosos."
 bp3_survey.1080.desc.outro:0 "Se permitirmos que bandidos e ladrões continuem atacando os visitantes... É apenas uma questão de tempo até que comecem a buscar outros alvos."
 bp3_survey.1080.desc.poi:0 "Parece que pessoas de todas as partes viajaram até aqui para ver [location_province.Custom('GetSpecialBuildingPrefix')][location_province.GetHolding.GetSpecialBuildingType.GetName], apenas para serem interceptadas por criminosos."
 bp3_survey.1080.desc:0 "\"Não é nada seguro, [ROOT.Char.Custom('FormOfAddressForLiege')]\", diz um viajante de aparência exausta. \"Mal sobrevivi com minha vida.\" Fiel à palavra [traveler_character.GetHerHim], parece que [traveler_character.GetSheHe] passou por uma experiência e tanto\n\n"
 bp3_survey.1080.t:0 "Um Lugar que Vale a Pena Visitar"
 bp3_survey.1090.a:0 "Contrataremos alguns guardas para patrulhar as terras."
 bp3_survey.1090.b:0 "Recrute os caçadores locais que já conhecem a área."
 bp3_survey.1090.c:0 "Quem se importa com um ou dois caçadores furtivos?"
 bp3_survey.1090.desc:0 "\"Está aqui para pegar alguns caçadores furtivos, é?\" Grita um caçador de aparência desleixada, enquanto nos aproximamos de um pequeno acampamento [hunter_character.GetHerHim] durante uma de minhas inspeções nas terras de [province.GetName]. \"Há muitos para serem pegos, mesmo que não seja terra realmente real. Aqui em [poaching_province.GetName], é cada um por si.\"\n\n\"Se você quer reivindicar essas terras, precisa de alguém que possa aparecer em seu nome regularmente, se é que me entende.\" [hunter_character.GetSheHe|U] continua com uma piscadela, antes de morder um pedaço de carne assada. Um grupo que possa mostrar a todos aqui que a terra realmente me pertence? Talvez não seja uma má ideia..."
 bp3_survey.1090.t:0 "As Terras Escondidas"
 bp3_survey.1200.a:0 "Espero que esses sejam os últimos dos meus desafios aqui."
 bp3_survey.1200.desc:0 "Apesar dos muitos problemas e dificuldades que enfrentei aqui em [province.GetName], sinto que comecei a ter uma boa compreensão de como lidar com a situação. Os proprietários de terras, as guildas locais, todos estão começando a aceitar meu modo de fazer as coisas.\n\nAgora só preciso traçar um caminho para o futuro deste condado e encontrar as pessoas certas para liderá-lo até lá."
 bp3_survey.1200.t:0 "Avanço"
 bp3_survey.1210.a:0 "O primeiro de muitos passos."
 bp3_survey.1210.desc:0 "Após uma noite de discussões com os proprietários locais, finalmente consegui fechar um acordo com uma das guildas de comerciantes locais.\n\nEspero que este seja apenas o começo de colocar este condado onde eu gostaria que estivesse. Se ao menos eu pudesse encontrar algumas vozes mais amigáveis para apoiar meus esforços aqui."
 bp3_survey.1210.t:0 "Um Passo na Direção Certa"
 bp3_survey.1220.a:0 "Apenas #bold conversem#! entre si!"
 bp3_survey.1220.desc:0 "Após uma noite de discussões com os proprietários locais, eles ainda não conseguiram encontrar um compromisso. Apesar dos meus melhores esforços, sinto minha motivação para tentar manter as coisas unidas aqui lentamente desaparecer.\n\nPor que eles simplesmente não podem se dar bem, pelo menos uma vez?"
 bp3_survey.1220.t:0 "Um Passo em Falso"
 bp3_survey.1230.a:0 "Será que eles realmente #emp querem#! que as coisas melhorem?!"
 bp3_survey.1230.desc:0 "Após um longo dia conversando com os proprietários locais, encontro-me envolvido em uma pequena disputa entre guildas de comerciantes, seguida por mais discussões entre nobres.\n\nNão importa onde eu olhe, sinto que há outro problema esperando pela minha atenção. Qual é o problema com as pessoas que vivem aqui em [province.GetName]?!"
 bp3_survey.1230.t:0 "Erro Após Erro"
