 clan_unity_coronation_nepotism.desc:0 "apoiou o nepotismo favorecendo a própria [house|E] [unity_character.GetHerHim] durante a Coroação [unity_character.GetHerHim]"
 coronation_events.1000.bribe:0 "Pagar para que façam uma canção me louvando."
 coronation_events.1000.desc_fallback:0 "O bardo termina a animada melodia com um floreio e então proclama:\n\n\"Esta canção é para [ROOT.Char.GetName], intitulada '[ROOT.Char.GetFirstNameNoTooltip], [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.Custom('InsultNoun')|U]!'\n\nUm silêncio cai sobre o salão, seguido de uma explosão de risadas que percorre a multidão. A melodia é surpreendentemente empolgante."
 coronation_events.1000.epic_rap_battle.tt.failure:0 "Você se envergonha em sua tentativa de conquistar a coroa"
 coronation_events.1000.epic_rap_battle.tt.success:0 "Você consegue conquistar a multidão"
 coronation_events.1000.epic_rap_battle:0 "Minha sagacidade será meu traje!"
 coronation_events.1000.guards:0 "Guardas, prendam est[Select_CString( bard.IsFemale, 'a', 'e' )] [bard.Custom('InsultNoun')]!"
 coronation_events.1000.low_county_opinion.desc:0 "Um bardo observa os presentes com um sorriso irônico.\n\n\"Esta canção é dedicada a [ROOT.Char.GetName], em nome do povo de [ROOT.Char.GetCurrentLocation.GetName]. Intitula-se '[Select_CString( ROOT.Char.IsFemale, 'A', 'O' )] [ROOT.Char.GetTitledFirstNameNoTooltip], Amado de Nossos Corações!'\n\nA melodia é animada, mas à medida que avança, percebo um brilho de travessura nos olhos do cantor e o riso contido de vários convidados.\n\nAmado, de fato..."
 coronation_events.1000.rival.desc:0 "Entre a festividade, avisto [Select_CString( rival.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival'))], [rival.GetName], passando moedas a um bardo. Momentos depois, o músico declara:\n\n\"Esta composição é um presente de [rival.GetNameNoTooltip] para seu querido amigo [ROOT.Char.GetName]! Chama-se '[ROOT.Char.GetFirstNameNoTooltip], [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.Custom('InsultNoun')|U]!'\n\nProcuro a multidão e lá está [rival.GetFirstNameNoTooltip], com o rosto pintado de alegria [rival.Custom('InsultAdjective')]. A canção, infelizmente, é bastante animadora."
 coronation_events.1000.t:0 "Zombaria Assombrosa"
 coronation_events.1000.tyrant.desc:0 "Um bardo, com o rosto corado de desafio, avança e começa uma balada:\n\n\"Contemple [ROOT.Char.GetName], o Punho de Ferro!\"\n\nCada verso cortante, repleto de elogios sarcásticos, ecoa pelo salão. Cerro os dentes enquanto a melodia zombeteira aumenta, retratando meu governo como nada além de tirania mesquinha."
 coronation_events.1002.accuse.flavor:0 "Leve isto!"
 coronation_events.1002.accuse:0 "Agora você passou dos limites, s[Select_CString( rival.IsFemale, 'ua', 'eu' )] [rival.Custom('InsultNoun')] [rival.Custom('InsultAdjective')]!"
 coronation_events.1002.counterfeit:0 "Felizmente, era apenas uma cópia."
 coronation_events.1002.desc:0 "Embora famosa por muitas coisas, minha casa não é conhecida por sua organização. O vestíbulo zune com desculpas sussurradas enquanto os servos atrapalham-se com mantos e preparativos de última hora. Supérfluo. Os objetos mais preciosos e importantes estão seguramente protegidos, como minha coroa. Espera.\n\nOnde está minha coroa?!"
 coronation_events.1002.find:0 "Hora de organizar essa bagunça!"
 coronation_events.1002.friend:0 "Felizmente, tenho [helper.GetFirstNameNoTooltip] ao meu lado."
 coronation_events.1002.hold:0 "Miseráveis! Vou mandá-los chicotear por isso!"
 coronation_events.1002.rival.desc:0 "Momentos antes da coroação, alcanço minha coroa — e ela desapareceu! O pânico me toma ao avistar m[Select_CString( rival.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival'))] [rival.GetName] parado em um canto, seu olhar vagando pelo suporte vazio, aquele sorriso [rival.Custom('InsultAdjective')] desafiando-me a acusar [rival.GetSheHe].\n\nAo meu lado, m[Select_CString( helper.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('helper'))] [helper.GetName] avança, percebendo a situação alarmante. Não há tempo para dúvidas — devo agir!"
 coronation_events.1002.t:0 "Onde Está?"
 coronation_events.1004.bribe:0 "\"Quanto pelo seu silêncio?\""
 coronation_events.1004.desc:0 "Em voz baixa, eu e [confidant.Custom2('MyCharacterIntroduction', ROOT.Char)] estamos discutindo confidências longe da multidão. Quando [confidant.GetFirstNameNoTooltip] diz claramente que [confidant.GetSheHe] [secret_to_reveal.Custom('SecretDescriptionThirdPerson')], vejo [Select_CString( spy.IsFemale, 'uma misteriosa', 'um misterioso' )] [spy.GetWomanMan] inclinando-se em nossa direção, esforçando-se para captar cada palavra.\n\nQuem sabe que maldade [spy.GetSheHe] espera alcançar. [spy.GetSheHe|U] não deve descobrir isso. Tal violação não será tolerada."
 coronation_events.1004.guards:0 "\"Arrastem est[Select_CString( spy.IsFemale, 'a', 'e' )] [spy.Custom2('InsultNoun', ROOT.Char)] para as masmorras!\""
 coronation_events.1004.intimidation.tt.failure:0 "Suas ameaças não convencem [spy.GetTitledFirstNameNoTooltip]"
 coronation_events.1004.intimidation.tt.success:0 "Sua demonstração terrível amedronta [spy.GetTitledFirstNameNoTooltip]"
 coronation_events.1004.intimidation:0 "#EMP Encara [spy.GetSheHe] com intenção assassina.#!"
 coronation_events.1004.opt-out:0 "\"Isso não é da minha conta.\""
 coronation_events.1004.recruit:0 "\"Eu poderia usar alguém como você...\""
 coronation_events.1004.t:0 "Um Sussurro no Banquete"
 coronation_events.1007.appease:0 "Vamos, discutamos uma solução..."
 coronation_events.1007.bigger:0 "Por favor, [second_guest.GetFirstNameNoTooltip], fique à vontade."
 coronation_events.1007.demand:0 "É meu direito, pois sou o mais [first_guest.Custom('ComplimentAdjective')]!"
 coronation_events.1007.desc:0 "Quando a procissão está prestes a começar, ouço m[Select_CString( first_guest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('first_guest'))], [first_guest.GetFirstName], e m[Select_CString( second_guest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('second_guest'))], [second_guest.GetFirstName], discutindo sobre quem liderará a entrada na cerimônia.\n\nA briga deles ecoa pelo vestíbulo, um insiste em ser [Select_CString( first_guest.IsFemale, 'a', 'o' )] mais [first_guest.Custom('ComplimentAdjective')], portanto o mais merecedor, enquanto o outro afirma que deve ser [Select_CString( second_guest.IsFemale, 'a', 'o' )] mais [second_guest.Custom('ComplimentAdjective')].\n\nSinto-me definitivamente lisonjeado."
 coronation_events.1007.first_guest:0 "M[Select_CString( first_guest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('first_guest'))] deve ser [Select_CString( first_guest.IsFemale, 'a primeira', 'o primeiro' )]!"
 coronation_events.1007.guest.desc:0 "Estou à porta, pronto para liderar a procissão da coroação, quando [second_guest.GetFirstName] avança e escarnece.\n\n“Meu serviço à coroa exige que eu tenha precedência!”\n\nO desafio rude [second_guest.GetHerHim] perturba a santidade de nossos preparativos."
 coronation_events.1007.opt_out:0 "Por que eu deveria me envolver?"
 coronation_events.1007.second_guest:0 "[second_guest.GetFirstNameNoTooltip], você conquistou esse direito."
 coronation_events.1007.t:0 "Uma Questão de Precedência"
 coronation_events.1011.desc:0 "No silêncio antes da minha coroação, os funcionários revelam o [ancestor_artifact.GetName]! Seu brilho canta os triunfos de meus antepassados.\n\nRecordo-me [Select_CString( previous_holder.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('previous_holder'))], [previous_holder.GetTitledFirstNameRegnal], cuja maestria em [previous_holder.Custom('education_focus')] moldou o abençoado reinado [previous_holder.GetHerHim]. Assim também meu próprio reinado será marcado por feitos de [ROOT.Char.Custom('education_focus')]. Minhas ações, por sua vez, impregnarão o [ancestor_artifact.GetName] e ele cantará novas canções, sobre um tema confiável."
 coronation_events.1011.previous:0 "Este artefato honra o legado de [previous_holder.GetFirstNamePossessiveNoTooltipRegnal]."
 coronation_events.1011.previous_reward.tt:0 "Permitir que a coroa mantenha seu propósito anterior fortalece o artefato com Modifiers que honram a Educação de seu Antecessor."
 coronation_events.1011.refit:0 "Minha reputação é minha para forjar."
 coronation_events.1011.root_reward.tt:0 "#weak A nova [skill|E] do [modifier|E] do [artifact|E] é derivada do tipo de [education|E]#!"
 coronation_events.1011.t:0 "Pesada é a Coroa"
 coronation_events.1012.back:0 "Servo! Leve isto de volta à cozinha!"
 coronation_events.1012.complain:0 "[host.GetTitledFirstNameNoTooltip], isso é uma piada?"
 coronation_events.1012.eat_it:0 "Você vai comer, e vai gostar!"
 coronation_events.1012.guest.desc:0 "O prato principal chega: esta pièce de résistance será lembrada pelos grandes e importantes!\n\nEnquanto nosso anfitrião corta a carne, minha fome se transforma em cinzas na boca, o assado espirrando sangue sobre a mesa. O banquete se transforma em um campo de batalha. Luto contra o impulso de vomitar enquanto sussurros de nojo se espalham ao meu redor."
 coronation_events.1012.host.desc:0 "O prato principal chega: a pièce de résistance do meu banquete será lembrada pelos grandes e importantes!\n\nAo fatiar o [guest.Custom('GetExpensiveMeal')], minha fome se transforma em cinzas na boca, o assado espirrando sangue sobre a mesa. O banquete se torna um campo de batalha. Luto contra o impulso de vomitar enquanto sussurros de nojo surgem ao meu redor.\n\nPerguntando-me se deveria ter gasto mais com o serviço de cozinha, observo [guest.GetName] afastar o prato em horror — ação rápida é necessária!"
 coronation_events.1012.munch:0 "Parece bom o suficiente para mim!"
 coronation_events.1012.t:0 "Uma Porção Crua"
 coronation_events.1012.trend:0 "Como assim? É a última tendência!"
 coronation_events.1013.burn:0 "Bom. Que [guest.GetSheHe] queime."
 coronation_events.1013.douse:0 "Jogue um barril de [ROOT.Char.Custom('RegionalDrink')] para apagar o fogo!"
 coronation_events.1013.guest.desc:0 "As festividades de meus convidados trazem um sorriso ao meu rosto. Dou uma risada abafada enquanto suas folias barulhentas os fazem tropeçar uns nos outros.\n\nUm gesto obsceno de repente solta uma tocha, que cai sobre as cortinas!\n\nChamas sobem pelas paredes enquanto os convidados gritam e fogem. Mergulho em busca de abrigo, coração acelerado, enquanto o salão se enche de fumaça e pânico."
 coronation_events.1013.hero:0 "Vou conter o fogo! Por aqui!"
 coronation_events.1013.host.desc:0 "Dou uma risada abafada enquanto a folia barulhenta dos meus convidados os faz tropeçar uns nos outros.\n\nUm gesto obsceno de repente solta uma tocha, que cai sobre as cortinas! Chamas sobem pelas paredes enquanto os convidados gritam e fogem.\n\nDistraído(a) pelo(a) [guest.Custom('GetExpensiveDrink_Singular')] [guest.GetHerHim], m[Select_CString( guest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] [guest.GetName] não percebeu o fogo. Devo agir rapidamente!"
 coronation_events.1013.run:0 "Como saio daqui?!"
 coronation_events.1013.snuff_out:0 "Se apenas cortarmos o suprimento de ar..."
 coronation_events.1013.t:0 "Uma Noite Incendiária"
 coronation_events.1014.calm:0 "Contenha esses tolos!"
 coronation_events.1014.guest.desc:0 "Enquanto devoro meu suculento [guest.Custom('GetExpensiveMeal')], levanto os olhos e vejo gritos de indignação.\n\nParece que nosso anfitrião não previu comida suficiente para todos os convidados. Senhores brandem pratos vazios, seu orgulho ferido dando origem a palavras afiadas e cotoveladas ainda mais afiadas. Desvio de uma enxurrada de insultos enquanto dignitários ofendidos disputam sobras.\n\n[guest.GetName] está preso(a) no meio da confusão."
 coronation_events.1014.host.desc:0 "Enquanto devoro meu suculento [guest.Custom('GetExpensiveMeal')], levanto os olhos e vejo gritos de indignação.\n\nParece que esqueci de prever comida suficiente para todos os meus convidados. Senhores brandem pratos vazios, seu orgulho ferido dando origem a palavras afiadas e cotoveladas ainda mais afiadas. Desvio de uma enxurrada de insultos enquanto dignitários ofendidos disputam sobras.\n\n[guest.GetName] está preso(a) no meio da confusão."
 coronation_events.1014.join:0 "Não encostem! O último é meu!"
 coronation_events.1014.run:0 "Cansei desta farsa!"
 coronation_events.1014.t:0 "Alimentando o Pânico"
 coronation_events.1015.cherish:0 "Você é muito gentil, [guest.GetFirstNameNoTooltip]!"
 coronation_events.1015.desc:0 "Um silêncio reverente cai quando o hino do coro termina, uma aura de santidade se estabelece sobre o salão. Minha reputação de [GetPietyLevelName(ROOT.Char.GetPietyLevel)|L] parece chamar m[Select_CString( guest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))], [guest.GetName], que se levanta e proclama com fervor:\n\n\"Que a luz de [ROOT.Char.GetFaith.DivineRealm|U] ilumine seu reinado, e que [ROOT.Char.GetFaith.HighGodName] guie seu caminho! Que [ROOT.Char.GetFaith.CreatorName] lhe conceda sabedoria, e que [ROOT.Char.GetFaith.DevilName] nunca escureça sua porta!\""
 coronation_events.1015.divine:0 "Louvado seja [ROOT.Char.GetFaith.HighGodName]!"
 coronation_events.1015.hush:0 "Concordo. Agora fiquem em silêncio."
 coronation_events.1015.t:0 "Um Brinde Abençoado"
 coronation_events.1016.desc:0 "O salão fica em silêncio. Meus convidados aguardam ansiosos minhas palavras. Baixo meu cálice e deixo meu olhar pousar sobre m[Select_CString( guest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] [guest.Custom('InsultAdjective')], [guest.GetFirstName], e m[Select_CString( guest_2.IsFemale, 'inha', 'eu' )] igualmente cautelos[Select_CString( guest_2.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_2'))] [guest_2.Custom('InsultAdjective')], [guest_2.GetFirstName].\n\nDevo cobri-los de elogios melosos que alimentam seu orgulho, ou propor um brinde envenenado que lembre exatamente quem detém o poder aqui?"
 coronation_events.1016.embarrass:0 "\"[guest.GetFirstNameNoTooltip] e [guest_2.GetFirstNameNoTooltip], devo lembrá-los...\""
 coronation_events.1016.great.tt.failure:0 "Você falha em convencê-los"
 coronation_events.1016.great.tt.success:0 "Você consegue conquistá-los"
 coronation_events.1016.great:0 "\"Ouçam minhas palavras, pois são verdadeiras!\""
 coronation_events.1016.nah:0 "... ou eu poderia tomar mais [guest.Custom('GetExpensiveDrink_Singular')] em vez disso."
 coronation_events.1016.t:0 "Ergam o Cálice"
 coronation_events.1017.desc:0 "Pelo salão, nobres exibem vasos com as melhores bebidas de seus domínios. M[Select_CString( supporter.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))] [supporter.Custom('ComplimentAdjective')], [supporter.GetFirstName], oferece uma prova de [supporter.Custom('RegionalDrink')], exalando um doce aroma de mel.\n\nDo outro lado, m[Select_CString( detractor.IsFemale, 'inha', 'eu' )] [detractor.Custom('InsultAdjective')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('detractor'))], [detractor.GetFirstName], oferece uma fina [detractor.Custom('RegionalDrink')], cujo forte bouquet promete um gosto certamente amargo.\n\nOs aromas sozinhos aceleram meus sentidos. Todos aguardam meus julgamentos."
 coronation_events.1017.diplo:0 "Que meu reinado seja digno de tal abundância e destreza!"
 coronation_events.1017.empower:0 "Por favor, me forneça mais, [supporter.GetFirstName]!"
 coronation_events.1017.isolate:0 "Sim, [detractor.GetFirstNameNoTooltip], bebida adequada para meus servos."
 coronation_events.1017.nah:0 "Que meus convidados bebam primeiro, e eu depois."
 coronation_events.1017.t:0 "Oportunidade na Bebida"
 coronation_events.1018.deal:0 "Mantenha seus amigos por perto..."
 coronation_events.1018.desc.diplo:0 "\n\nO protocolo exige que eu mantenha a cabeça erguida e sorria."
 coronation_events.1018.desc.wrathful:0 "\n\nO decoro impede minha ação, mas o melhor curso é claramente lançar [detractor.GetFirstName] e sua cadeira o mais longe possível de mim."
 coronation_events.1018.desc:0 "Enquanto observo o banquete, ouço m[Select_CString( supporter.IsFemale, 'inha', 'eu' )] [supporter.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))], [supporter.GetFirstName], chamar do outro lado da mesa: \"Vossa Graça, certamente [detractor.GetFirstName] não deveria sentar tão perto!\" Eu olho para m[Select_CString( detractor.IsFemale, 'inha', 'eu' )] [detractor.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('detractor'))], [detractor.GetFirstName], acomodad[Select_CString( detractor.IsFemale, 'a', 'o' )] à minha esquerda."
 coronation_events.1018.switch:0 "Mantenha ess[Select_CString( detractor.IsFemale, 'a', 'e' )] [detractor.Custom2('InsultNoun', ROOT.Char)] longe de mim."
 coronation_events.1018.t:0 "Um Jogo de Cadeiras"
 coronation_events.1019.both:0 "Ambos são igualmente merecedores."
 coronation_events.1019.desc:0 "Olho para meus aliados firmes: m[Select_CString( supporter.IsFemale, 'inha', 'eu' )] [supporter.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))] [supporter.GetFirstName], cujo valor quando [supporter_memory.GetThirdPerspectiveDescription] foi inegável, e m[Select_CString( supporter_2.IsFemale, 'inha', 'eu' )] [supporter_2.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter_2'))] [supporter_2.GetFirstName], que esteve ao meu lado quando [supporter_2_memory.GetThirdPerspectiveDescription]. Seus rostos brilham de expectativa, pois sabem que sua lealdade me trouxe até aqui.\n\nComo posso aproveitar tal fidelidade sem aproveitar cada oportunidade de retribuir...?"
 coronation_events.1019.memory_reward.tt:0 "Os efeitos desta opção dependem do tipo de Memória."
 coronation_events.1019.nah:0 "Palavras terão de bastar."
 coronation_events.1019.supporter:0 "\"[supporter.GetFirstNameNoTooltip], tenho algo para você.\""
 coronation_events.1019.supporter_2:0 "\"[supporter_2.GetFirstNameNoTooltip], por favor, aceite isto.\""
 coronation_events.1019.t:0 "Símbolos de Lealdade"
 coronation_events.1020.a.flavor:0 "Reúno ambos os vassalos e escuto com atenção, buscando acalmar os ânimos e reafirmar os laços que mantêm nossa casa unida."
 coronation_events.1020.a:0 "Ouça-os e busque um terreno comum."
 coronation_events.1020.b.custom:0 "Todo [vassal|E] da mesma [dynasty|E]"
 coronation_events.1020.b.tt:0 "Seus parentes vão ressentir você por ficar do lado desse estrangeiro para ganhar a lealdade [not_dynasty_vassal.GetHerHim]."
 coronation_events.1020.b:0 "Apoie as preocupações de [not_dynasty_vassal.GetFirstNamePossessiveNoTooltip]."
 coronation_events.1020.c:0 "Tal insolência não pode ser tolerada."
 coronation_events.1020.d:0 "Meu dever é primeiro com meu sangue."
 coronation_events.1020.desc:0 "À medida que o banquete da coroação chega ao fim, vozes elevadas cortam o salão. \"A Casa [ROOT.Char.GetDynastyName] é a força do reino,\" insiste [dynasty_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U]. \"Nosso sangue deve liderar, como a tradição exige.\"\n\nDo outro lado da mesa, [not_dynasty_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] retruca: \"E o resto de nós? Devemos pagar seus primos e ficar em silêncio?\""
 coronation_events.1020.embrace_supporters.tt:0 "#EMP #low Os [characters|E] afetados são [coronation_supporters|E]#!#!"
 coronation_events.1020.embrace_supporters:0 "Eu favorecerei o leal."
 coronation_events.1020.t:0 "Preocupações Entre os Clãs"
 coronation_events.1020.weaken_detractors.tt:0 "#weak #EMP Os [characters|E] que ganham [stress|E] são [coronation_detractors|E]#!#!"
 coronation_events.1020.weaken_detractors:0 "E por que, diga-me, eu deveria ouvi-lo?"
 coronation_events.1021.a.flavor:0 "Não me curvarei ao ouro enquanto a coroa não estiver usada. Que todos vejam quem comanda quem."
 coronation_events.1021.a:0 "[taxman.GetTitledFirstNameNoTooltip] presume demais."
 coronation_events.1021.b.flavor:0 "Deixe [taxman.GetSheHe] coletar o que [taxman.GetSheHe] quiser, enquanto eu reinar."
 coronation_events.1021.b:0 "Concederei — pelo bem da estabilidade."
 coronation_events.1021.c.flavor:0 "Se ouro pavimenta o caminho para o poder, que seja empilhado alto e profundo. Dê liberdade total a [taxman.GetFirstNameNoTooltip]."
 coronation_events.1021.c:0 "Meu cofre vem primeiro. Encham-no."
 coronation_events.1021.desc:0 "Mesmo antes que a coroa toque minha testa, as preocupações do reino já pesam em minha mente. M[Select_CString( taxman.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('taxman'))], [taxman.GetTitledFirstName], avança e declara: \"Vossa Graça, devo pedir permissão para cobrar integralmente o dízimo que me é devido — sem interferência dos magísteres da sua corte — ou meus deveres fiscais se tornarão um fardo injusto para mim.\"\n\nAo lado [taxman.GetHerHim], m[Select_CString( supporter.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))], [supporter.GetName] observa atentamente, os olhos [supporter.GetHerHim] perguntando: cederei diante dessa demonstração descarada de ganância? Serão os coletores de impostos como [taxman.GetFirstNameNoTooltip] os que decidirão sobre minha justiça?"
 coronation_events.1021.embrace_supporters.flavor:0 "Meus verdadeiros apoiadores estão comigo... aqueles embriagados pela avareza ficam atrás de minhas costas, com os dedos em minha bolsa!"
 coronation_events.1021.embrace_supporters:0 "\"[supporter.GetFirstNameNoTooltip], por favor, vigie cuidadosamente esse demônio.\""
 coronation_events.1021.impress_attendees.flavor:0 "Honre as tradições de nosso clã, reconheça cada convidado, e deixe ninguém certo de onde realmente me posiciono."
 coronation_events.1021.impress_attendees:0 "\"Honre meu povo com sua justiça.\""
 coronation_events.1021.t:0 "O Ouro Antes da Coroa"
 coronation_events.1022.a:0 "Um presente gracioso e um conselho sensato!"
 coronation_events.1022.b:0 "\"Aumente sua oferta, e serei seu devedor!\""
 coronation_events.1022.c:0 "Devemos lucrar com isso!"
 coronation_events.1022.desc:0 "[Select_CString( supporter.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))], [supporter.GetName], ajoelha-se diante de mim, erguendo um baú de vestimentas bordadas, dizendo:\n\n\"Vossa Graça, minha mente é um jardim que floresce com as memórias que compartilhamos. Como um tributo à beleza do passado, ofereço estas vestes de seda, suficientes para prover todo o seu cortejo. Peço apenas que vista os nobres [ROOT.Char.Custom('KnightCulturePluralNoTooltip')] de sua comitiva, sempre, com esplendor inigualável.\""
 coronation_events.1022.t:0 "Uma Oferta de Seda"
 coronation_events.1023.a:0 "\"Fiquem tranquilos, meu reinado será de fato [ROOT.Char.Custom('ComplimentAdjective')]!\""
 coronation_events.1023.b:0 "\"E devo tudo ao apoio de [supporter.GetFirstNamePossessiveNoTooltip]!\""
 coronation_events.1023.c:0 "\"Guardas — prendam est[Select_CString( detractor.IsFemale, 'a', 'e' )] [detractor.Custom('InsultNoun')] [detractor.Custom('InsultAdjective')]!\""
 coronation_events.1023.d:0 "\"[detractor.GetFirstNameNoTooltip], seu acolhimento terminou!\""
 coronation_events.1023.desc:0 "M[Select_CString( detractor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('detractor'))], [detractor.GetName], ergue-se com um cálice elevado. Em um tom [detractor.Custom('InsultAdjective')], [detractor.GetSheHe] proclama:\n\n\"Vossa Graça, sob essa resplandecente coroa, vejo um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] tão [ROOT.Char.Custom('ComplimentAdjective')] — poucos podem reivindicar tantos #EMP súditos adoradores #! mesmo que alguns ousassem questionar a sabedoria de suas decisões. Sim, onde estaríamos sem tal [ROOT.Char.Custom('ComplimentAdjectiveArticle')] [ROOT.Char.GetTitleAsNameNoTooltip] para bajular e adular?\"\n\nAs palavras [detractor.GetHerHim], vazias de bondade, enviam um arrepio pelo salão."
 coronation_events.1023.e:0 "Reconheço as palavras [detractor.GetHerHim] com uma reverência educada — nada mais."
 coronation_events.1023.supporter.desc:0 "Sinto todos os olhares sobre mim — especialmente [Select_CString( supporter.IsFemale, 'minha chocada', 'meu chocado' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))], [supporter.GetName]."
 coronation_events.1023.t:0 "Salve [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]"
 coronation_events.1024.a:0 "\"#EMP Hah!#! Não preciso de bugigangas.\""
 coronation_events.1024.b:0 "\"Aceito graciosamente, e prometo minha boa vontade.\""
 coronation_events.1024.desc:0 "Segurando um baú incrustado de joias, [foreign.GetFirstNameNicknamedNoTooltip] dirige-se ao salão:\n\n\"Vossa Graça, aceite este símbolo de boa vontade do meu [foreign.GetPrimaryTitle.GetTierAsNameNoTooltip|l]. Que ele simbolize um vínculo duradouro entre seu povo e o meu.\""
 coronation_events.1024.detractor.desc:0 "\n\nM[Select_CString( guest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))], [guest.GetName], inclina-se, sussurrando maliciosamente: \"Tais presentes frequentemente escondem interesses obscuros, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsName]...\""
 coronation_events.1024.embrace_supporters:0 "\"[foreign.GetFirstNameNoTooltip], que nossos laços nunca sejam quebrados!\""
 coronation_events.1024.exalt_crown:0 "\"E assim... você se torna tributário da coroa, sim?\""
 coronation_events.1024.impress_attendees:0 "\"Um momento glorioso para nossos povos!\""
 coronation_events.1024.intro_diff_culture:0 "Com alguns floreios cerimoniais estranhos, os [foreign.GetCulture.GetName] d[Select_CString( foreign.IsFemale, 'a', 'o' )] [foreign.GetTitleAsNameNoTooltip] de [foreign.GetPrimaryTitle.GetNameNoTier] gesticula, pedindo um momento da minha atenção."
 coronation_events.1024.intro_diff_faith:0 "Com deferência polida, o [foreign.GetFaith.GetAdherentName] [foreign.GetTitleAsNameNoTooltip] de [foreign.GetPrimaryTitle.GetNameNoTier] aproxima-se de mim."
 coronation_events.1024.intro_diff_neither:0 "Com cerimônia praticada, [Select_CString( foreign.IsFemale, 'a', 'o' )] [foreign.Custom('ComplimentAdjective')] [foreign.GetTitleAsName] de [foreign.GetPrimaryTitle.GetNameNoTier] apresenta-se a mim."
 coronation_events.1024.supporter.desc:0 "\n\nM[Select_CString( guest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))], [guest.GetName], aproxima-se ao meu lado e sussurra: \"Este presente pode se tornar o início de algo duradouro, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsName]!\""
 coronation_events.1024.t:0 "Amigos por Todo Lado"
 coronation_events.1024.weaken_detractors:0 "\"[guest.GetFirstNameNoTooltip] difama seu presente, [foreign.GetFirstNameNoTooltip]!\""
 coronation_events.1025.a:0 "\"Apoio [supporter.GetFirstNameNoTooltip], totalmente e sempre!\""
 coronation_events.1025.b:0 "\"Venham, venham! Devemos festejar como um só!\""
 coronation_events.1025.c:0 "[supporter.GetFirstNameNoTooltip] tem meu apoio."
 coronation_events.1025.d:0 "A culpa é toda de [detractor.GetFirstNameNoTooltip]."
 coronation_events.1025.desc.detractor:0 "\n\n[detractor.GetTitledFirstName], por outro lado, senta-se #EMP acima#! da mesa, envolto/a abundantemente em [detractor.Custom('RegionalFabric')] e desafio. [detractor.GetSheHe|U] lidera seu grupo de detratores com ideias semelhantes, zombando [supporter.GetFirstNameNoTooltip] de '[supporter.Custom('InsultAdjective')]'."
 coronation_events.1025.desc.intro:0 "A tensão envolve [supporter.GetName] e m[Select_CString( detractor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('detractor'))] [detractor.GetName]. Eles se sentam separados, encarando-se e gesticulando amargamente um para o outro. Ouço os ecos de rancores que só minha coroa pode apaziguar.\n\n"
 coronation_events.1025.desc.supporter:0 "Mesmo em meio a palavras duras, [supporter.GetTitledFirstNameNoTooltip] ainda sorri lealmente quando [supporter.GetSheHe] percebe meu olhar sobre [supporter.GetSheHe]."
 coronation_events.1025.e:0 "\"Por favor, pensem no nosso futuro!\""
 coronation_events.1025.f:0 "[detractor.GetFirstNameNoTooltip] está certo nisso, na verdade."
 coronation_events.1025.t:0 "Olhares Frios"
 coronation_events.1026.a:0 "Agora, vamos deslumbrar todos com um discurso!"
 coronation_events.1026.b:0 "[token_finder.GetFirstName], aceite seu prêmio!"
 coronation_events.1026.c:0 "[token_finder.GetFirstName], você será [Select_CString( token_finder.IsFemale, 'a primeira', 'o primeiro' )] a ajoelhar-se."
 coronation_events.1026.d:0 "Que este momento fique para sempre em nome de [ROOT.Char.GetDynastyNameNoTooltip]!"
 coronation_events.1026.desc:0 "Finalmente, o bolo chega — imponente, glorioso, a joia da coroa do banquete. Exaustos, mas orgulhosos, os cozinheiros passaram a noite intercalando [ROOT.Char.Custom('FavoriteTreatDemand')] e [ROOT.Char.Custom('GetFoodDetail')], cada camada perfumada com [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')]. Em algum lugar dentro repousa o pequeno token, que escondi pessoalmente!"
 coronation_events.1026.detractor_desc:0 "\n\n[token_finder.GetNameNoTooltip] pega o token do bolo com um sorriso de lado, sua vitória inconfundível. Um murmúrio percorre o salão — a sorte parece favorecer até mesmo os críticos da coroa, pelo menos por esta noite."
 coronation_events.1026.e:0 "Mal posso esperar para comer esse bolo!"
 coronation_events.1026.f:0 "Minha fatia vai para meus camponeses!"
 coronation_events.1026.fallback_desc:0 "\n\n[token_finder.GetNameNoTooltip] triunfantemente retira o token, ganhando aplausos e a promessa de fortuna futura."
 coronation_events.1026.special:0 "Eu o encontrei! Louvem-me!"
 coronation_events.1026.special_desc:0 "\n\nCom um floreio, mergulho minha faca e retiro o token pessoalmente. Um silêncio cai antes que o salão exploda em aplausos — o anfitrião conquistou o prêmio!"
 coronation_events.1026.supporter_desc:0 "\n\n[token_finder.GetNameNoTooltip] triunfantemente retira o token das ricas camadas do bolo, a alegria [token_finder.GetHerHim] é tanta que [token_finder.GetSheHe] quase bate nas minhas costas [ROOT.Char.Custom('GetTitleTierAdjective')]. O salão irrompe em aplausos — um apoiador leal, tocado pela fortuna, também é favorecido pela coroa."
 coronation_events.1026.t:0 "Um Bolo para Recordar"
 coronation_events.1027.a:0 "Aplaudo a performance com graça cortesã."
 coronation_events.1027.b:0 "Elogie [highlighted_guest.GetFirstNameNoTooltip] abertamente — lealdade merece recompensa."
 coronation_events.1027.c:0 "Minar o momento de [highlighted_guest.GetFirstNamePossessiveNoTooltip]."
 coronation_events.1027.d:0 "Faça um discurso sobre tradição e a Casa [ROOT.Char.GetDynastyNameNoTooltip]."
 coronation_events.1027.desc:0 "A nobreza inicia uma cuidadosamente coreografada [ROOT.Char.Custom('GetMedievalDance')]. Portando adereços simbólicos, encenam cenas da ascensão, triunfos e aspirações da minha dinastia. Todos os olhares se voltam para a figura central do espetáculo..."
 coronation_events.1027.detractor_desc:0 "\n\nPara minha surpresa, m[Select_CString( highlighted_guest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('highlighted_guest'))] [highlighted_guest.GetFirstNameNoTooltip] avança, conforme a cerimônia exige um ato simbólico de homenagem. A audiência se move, dividida entre risos e aplausos nervosos, sem saber se tratar aquilo como brincadeira, performance... ou aviso."
 coronation_events.1027.e:0 "Sorria calorosamente e compartilhe da alegria."
 coronation_events.1027.f:0 "Desapareça ao fundo e deixe o momento passar."
 coronation_events.1027.fallback_desc:0 "\n\nM[Select_CString( highlighted_guest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('highlighted_guest'))] [highlighted_guest.GetFirstNameNoTooltip] desempenha o papel do próprio reino — envolto nas cores régias de [ROOT.Char.GetPrimaryTitle.GetNamePossessiveNoTooltip], adornado com fitas douradas, declarando lealdade com solenidade. Os convidados acenam em aprovação, desfrutando da pompa e cerimônia."
 coronation_events.1027.special:0 "Hora de ocupar meu lugar ao lado deles."
 coronation_events.1027.special_desc:0 "\n\nE percebo, com um lampejo de surpresa, que sou eu que eles retratam como o Herói do [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] — verdadeiramente glorioso, um bastião do nome [ROOT.Char.GetDynastyName]. Um espaço se abre no centro da coreografia. Eles me chamam para entrar na dança. Os convidados explodem em aplausos, sua admiração tão intoxicante quanto o vinho."
 coronation_events.1027.supporter_desc:0 "\n\nM[Select_CString( highlighted_guest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('highlighted_guest'))] [highlighted_guest.GetFirstName] assume o papel de um ancestral aclamado, arrancando aplausos com uma recitação apaixonada do poder da minha linhagem. A mensagem é clara: meu direito de governar é um legado carregado com orgulho."
 coronation_events.1027.t:0 "Momento de [highlighted_guest.GetTitledFirstNamePossessiveNoTooltip|U]"
 coronation_events.1028.a.tt3:0 "Todo participante da [faith|E] de [clergy_representative.GetShortUINamePossessive]"
 coronation_events.1028.a.tt:0 "Todo participante [GetTrait('zealous').GetName( GetNullCharacter )] da mesma [faith|E]"
 coronation_events.1028.a:0 "Aceitar a bênção no espírito de tolerância."
 coronation_events.1028.b.tt:0 "Todo participante [GetTrait('zealous').GetName( GetNullCharacter )] da mesma [faith|E]"
 coronation_events.1028.b:0 "Recusar educadamente as bênçãos heréticas."
 coronation_events.1028.c.tt:0 "Todo participante [GetTrait('zealous').GetName( GetNullCharacter )] da mesma [faith|E]"
 coronation_events.1028.c:0 "\"Mas isto é claramente heresia!\""
 coronation_events.1028.d:0 "Evite a questão completamente."
 coronation_events.1028.detractor.desc:0 "M[Select_CString( clergy_representative.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('clergy_representative'))], [clergy_representative.GetFirstName], um/a fervoroso/a [clergy_representative.GetFaith.GetAdjective], aproxima-se com lenta reverência.\n\n\"[clergy_representative.GetFaith.HouseholdGodName] clama por paz além das fronteiras e crenças,\" diz [clergy_representative.GetSheHe]. \"Posso oferecer-lhe uma bênção de [clergy_representative.GetFaith.CreatorName] durante sua coroação?\"\n\nDa plateia, [guest.GetFirstName], um/a crítico/a vocal do meu governo, estreita os olhos em clara desaprovação."
 coronation_events.1028.detractor.tt:0 "Todo participante não-[GetTrait('cynical').GetName( GetNullCharacter )] da mesma [faith|E]"
 coronation_events.1028.detractor:0 "Aponte [guest.GetFirstNameNoTooltip] como simpatizante [clergy_representative.GetFaith.GetAdjectiveNoTooltip]."
 coronation_events.1028.fallback.desc:0 "À medida que a coroação prossegue, [clergy_representative.GetFirstName], um[Select_CString( clergy_representative.IsFemale, 'a', '' )] visitante [clergy_representative.GetFaith.GetAdherentName], avança com as mãos levantadas em solene reverência.\n\n\"[clergy_representative.GetFaith.HouseholdGodName] ensina paz e compreensão entre as fés,\" diz [clergy_representative.GetSheHe] suavemente. \"Aceitará uma bênção de [clergy_representative.GetFaith.CreatorName] para marcar seu reinado?\"\n\n[guest.GetFirstName], um/a dos/as nobres presentes, inclina a cabeça — impassível, atento/a."
 coronation_events.1028.supporter.desc:0 "M[Select_CString( clergy_representative.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('clergy_representative'))], [clergy_representative.GetFirstName], um/a devoto/a [clergy_representative.GetFaith.GetAdjective], avança, sua expressão solene e serena.\n\n\"[clergy_representative.GetFaith.HouseholdGodName] sorri sobre a unidade entre os governantes,\" proclama [clergy_representative.GetSheHe]. \"Permita-me oferecer-lhe uma bênção em nome de [clergy_representative.GetFaith.CreatorName], como gesto de harmonia.\"\n\n[guest.GetFirstName], um/a dos/as meus/minhas apoiadores/as leais, observa atentamente, intrigado/a com o gesto."
 coronation_events.1028.supporter:0 "Chamo [guest.GetFirstNameNoTooltip] ao meu lado."
 coronation_events.1028.t:0 "Uma Bênção de [clergy_representative.GetFaith.HighGodName]"
 coronation_events.1029.a:0 "De fato, meu reinado é ordenado por [ROOT.Char.GetFaith.HighGodName]!"
 coronation_events.1029.b:0 "[guest.GetFirstNameNoTooltip], que nosso voto esteja à altura dos antigos."
 coronation_events.1029.c:0 "Faça com que seja sobre a lealdade de [guest.GetFirstNamePossessiveNoTooltip] a mim."
 coronation_events.1029.d:0 "Proclame o texto perdido a todos!"
 coronation_events.1029.desc:0 "Ouço o distinto desdobrar de um pergaminho antigo. \"[Select_CString( priest.IsFemale, 'Minha senhora', 'Meu senhor' )],\" [priest.GetFirstName], m[Select_CString( priest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))], diz, curvando-se levemente, \"encontrei isto entre os registros mais antigos de [primary_title.GetAdjective]. Fala de um voto jurado por [ROOT.GetCharacter.Custom('GetMythicalFounder')], concedendo aos governantes vindouros direitos e privilégios que o tempo esqueceu.\"\n\n[guest.GetFirstName], m[Select_CString( guest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))], inclina-se com curiosidade visível. \"Uma promessa esquecida? Isto pode ser... interessante,\" murmura [guest.GetSheHe]."
 coronation_events.1029.detractor.desc:0 "[priest.GetFirstName], m[Select_CString( priest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))], desenrola um pergaminho envelhecido. \"Meu/soberano/a,\" [priest.GetSheHe] anuncia, \"este é o voto de [ROOT.GetCharacter.Custom('GetMythicalFounder')], uma declaração de autoridade soberana sobre todas as terras! Foi recentemente descoberto nos arquivos de [primary_title.GetNameNoTier]. Este voto afirma seu direito de comandar lealdade — e punir a desobediência.\"\n\n[guest.GetFirstName], m[Select_CString( guest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] e crítico/a declarado/a, debocha em voz alta. \"Palavras antigas, e mortas, ainda por cima!\""
 coronation_events.1029.e:0 "Que o passado permaneça enterrado."
 coronation_events.1029.supporter.desc:0 "O cheiro de um pergaminho envelhecido atinge minhas narinas. \"[Select_CString( priest.IsFemale, 'Minha senhora', 'Meu senhor' )],\" [priest.GetFirstName], m[Select_CString( priest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))], declara, \"este é um voto jurado por [ROOT.GetCharacter.Custom('GetMythicalFounder')], ligando governante e súditos leais em dever e recompensa mútuos, dos nossos arquivos mais antigos! E certamente destinado a tempos como este.\"\n\n[guest.GetFirstName], m[Select_CString( guest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] e apoiador/a leal, sorri amplamente. \"Um momento perfeito para renovar antigas promessas.\""
 coronation_events.1029.t:0 "O Voto Esquecido"
 coronation_events.1030.a:0 "\"Sim, sim, um esplendor duradouro!\""
 coronation_events.1030.b:0 "\"Por favor, enfatize a alegria de meus convidados.\""
 coronation_events.1030.c:0 "\"Que suas palavras sejam dignas de sua lealdade.\""
 coronation_events.1030.d:0 "\"Que a escória seja desprezada para sempre.\""
 coronation_events.1030.detractors.desc:0 "[scholar.GetTitledFirstName], m[Select_CString( scholar.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scholar'))], inclina-se com ar conspiratório, falando em tons baixos.\n\n\"Seus detratores estavam desconfortavelmente silenciosos... ou amargamente ruidosos. Meus escribas registrarão sua desobediência, e as gerações futuras julgarão seus inimigos apropriadamente...\""
 coronation_events.1030.e:0 "\"Não, o registro deve reverenciar [ROOT.Char.GetFaith.HighGodName].\""
 coronation_events.1030.exalt.desc:0 "[scholar.GetTitledFirstName], m[Select_CString( scholar.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scholar'))], aproxima-se com um sorriso ansioso.\n\n\"Vossa majestade,\" [scholar.GetSheHe] diz, \"a grandeza de sua coroação merece um lugar nos anais da história. Posso pedir a um de meus escribas que registre o esplendor de seus trajes reais, o poder de [ROOT.Char.GetPrimaryTitle.GetNameNoTier], e a admiração que inspirou aqui?\""
 coronation_events.1030.impress.desc:0 "[scholar.GetTitledFirstName], m[Select_CString( scholar.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scholar'))], gesticula em minha direção.\n\n\"Que audiência dedicada!\" [scholar.GetSheHe] exclama. \"Se me permitir, pedirei a um de meus escribas que registre a reação de seus convidados — os aplausos, os suspiros, até as lágrimas. Que ninguém esqueça como sua coroação nos comoveu a todos.\""
 coronation_events.1030.supporters.desc:0 "[scholar.GetTitledFirstName], m[Select_CString( scholar.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scholar'))], cumprimenta-me com olhos brilhantes.\n\n\"O que mais me impressionou,\" [scholar.GetSheHe] diz, \"foi a lealdade de seus súditos. Se aprovar, pedirei ao meu escriba que escreva uma [scholar.Custom('GetChronicleSaga')] deste evento, e suas palavras serão apenas para seus apoiadores, por sua fidelidade e força unida.\""
 coronation_events.1030.t:0 "Registrado para a Posteridade"
 coronation_events.1030.tt.failure:0 "A [scholar.Custom('GetChronicleSaga')] é zombada"
 coronation_events.1030.tt.success:0 "A [scholar.Custom('GetChronicleSaga')] é aclamada"
 coronation_events.1031.a:0 "\"Cante minha glória!\""
 coronation_events.1031.b:0 "\"Que o hino clame por paz e união.\""
 coronation_events.1031.c:0 "\"Faça dele um aviso aos inimigos da Casa [ROOT.Char.GetDynastyNameNoTooltip].\""
 coronation_events.1031.d:0 "\"Nenhum hino. Que o silêncio fale hoje.\""
 coronation_events.1031.detractors.desc:0 "[priest.GetFirstName], m[Select_CString( priest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))], aproxima-se com a voz baixa e um olhar cauteloso ao redor.\n\n\"Nem todos que se reúnem aplaudirão seu nome,\" [priest.GetSheHe] alerta. \"Quando os hinos chegarem, que carreguem peso — autoridade que os demônios que se opõem a você não podem ignorar. Encha os ouvidos dessas criaturas com o poder de sua coroa!\"\n\nO mestre de coro está pronto, aguardando minha escolha de tom e mensagem."
 coronation_events.1031.e:0 "\"Tenho uma composição perfeita para isso!\""
 coronation_events.1031.exalt.desc:0 "Enquanto o grande salão ecoa com o movimento dos preparativos, [priest.GetFirstName], m[Select_CString( priest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))], aproxima-se de mim com uma coleção de hinários gastos debaixo do braço [priest.GetHerHim].\n\n\"Vossa Majestade,\" [priest.GetSheHe] diz com orgulho contido, \"o coro aguarda sua orientação. Que suas vozes se elevem para proclamar seu direito divino e o esplendor do [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]?\"\n\nImagino a cerimônia que se aproxima — cada nota elevando o reino aos olhos da audiência."
 coronation_events.1031.impress.desc:0 "Enquanto os servos ajustam decorações e os escudeiros ensaiam seus sinais, [priest.GetFirstName], m[Select_CString( priest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))], me encontra no meio dos preparativos.\n\n\"O reino estará ouvindo atentamente,\" [priest.GetSheHe] diz com um sorriso sábio. \"Deixe que o coro cante um hino que toque corações e conquiste seus tolos detratores.\"\n\nÉ um pensamento agradável: o salão cheio de som, e cada voz fazendo parte da minha performance."
 coronation_events.1031.supporters.desc:0 "Entre o emaranhado de escribas e cozinheiros correndo pelos corredores, [priest.GetFirstName], m[Select_CString( priest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))], me detém com um gesto gentil.\n\n\"Seus seguidores leais estarão observando,\" [priest.GetSheHe] diz. \"Que os hinos lhes lembrem por que o seguem: canções que unem corações voluntários e aprofundam a fé em seu governo.\"\n\nO coro aguarda minhas escolhas, ansioso para iniciar os ensaios."
 coronation_events.1031.t:0 "O Coro se Eleva"
 coronation_events.1032.a.flavor:0 "Faça seus servos soltarem bandos de aves cativas no ar; que todas as gaiolas sejam esvaziadas!"
 coronation_events.1032.a:0 "Que os próprios céus se juntem à celebração!"
 coronation_events.1032.b:0 "\"[supporter.GetFirstNameNoTooltip]: vamos declarar nossa fidelidade eterna.\""
 coronation_events.1032.c.flavor:0 "[supporter.GetFirstNameNoTooltip] preparará a declaração de uma nova Ordem Sagrada."
 coronation_events.1032.c:0 "Com uma nova Ordem, reúno os fiéis!"
 coronation_events.1032.d.flavor:0 "[detractor.GetFirstNameNoTooltip] será destacado para punição pública durante a cerimônia. Dissidência não será tolerada."
 coronation_events.1032.d:0 "\"Olhos curiosos devem ser — #EMP arrancados!#!\""
 coronation_events.1032.desc:0 "A ocasião, embora solene e apropriada, ainda parece... incompleta. É apenas uma reunião rotineira, algum banquete casual? Ou é um momento para uma grande ação política, para uma mudança histórica? M[Select_CString( supporter.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))], [supporter.GetTitledFirstName], sussurra em meu ouvido.\n\n\"Os governantes não se tornam grandes por palavras... mas por feitos,\" [supporter.GetSheHe] insiste. \"Feitos! Feitos que abalem o [ROOT.Char.GetPrimaryTitle.GetTierAsName] em seus alicerces!\"\n\nM[Select_CString( detractor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('detractor'))] [detractor.GetFirstName], que não dá valor a esta ocasião, observa com desprezo."
 coronation_events.1032.e:0 "Eu só espero que isso termine logo..."
 coronation_events.1032.t:0 "Um Gesto Audacioso"
 coronation_events.1033.a:0 "\"Por direito divino.\""
 coronation_events.1033.b:0 "Aproveitar a chance para reconciliação pública."
 coronation_events.1033.c:0 "Mandar [rival.GetSheHe] ser arrastado em correntes!"
 coronation_events.1033.d:0 "Deixe o roedor extravasar a raiva [rival.GetHerHim]..."
 coronation_events.1033.desc:0 "\"Esta #EMP total#! farsa zombeteira ridiculariza [ROOT.Char.GetPrimaryTitle.GetNameNoTier], difama seu povo e profana as sepulturas daqueles que nos precederam!\" brada [rival.GetFirstName], m[Select_CString( rival.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival'))].\n\nO gosto forte de [ROOT.Char.Custom('RegionalDrink')] está no hálito [rival.GetHerHim]: o beberrão já está embriagado! O olhar [rival.GetHerHim] oscila pelos nobres, [ROOT.Char.GetFaith.PriestNeuterPlural] e enviados estrangeiros, desafiando-os a contestar este espetáculo grosseiro. \"Por qual direito [ROOT.Char.GetFirstName] reivindica esta coroa? #EMP Hmm?#! Que direito?!?\"\n\nSuspiros percorrem a assembleia."
 coronation_events.1033.t:0 "Uma Voz Dissonante"
 coronation_events.1034.a.tt:0 "As consequências desta escolha serão decididas por [host.GetTitledHouseNameOrFirstName]"
 coronation_events.1034.a:0 "Minha túnica brilhará mais que a de [host.GetTitledHouseNameOrFirstName]!"
 coronation_events.1034.b:0 "Vou igualar as cores de [host.GetTitledHouseNameOrFirstName] como um discreto sinal de lealdade."
 coronation_events.1034.c:0 "Vestirei o que os ritos prescrevem."
 coronation_events.1034.d:0 "Deixe-me ecoar a paleta da capital."
 coronation_events.1034.desc:0 "\"Então [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsName] ousa vestir [detractor.Custom('GetComplexColor')] [detractor.Custom('RegionalFabric')]?\" [detractor.Custom2('MyCharacterIntroduction', ROOT.Char)] resmunga, estreitando os olhos. \"Essas cores são reservadas para virtude e posição — não para vaidade. Se eu usasse tal tom sem permissão, enfrentaria censura.\"\n\n\"Censura?\" [supporter.Custom2('MyCharacterIntroduction', ROOT.Char)] interrompe. \"Essa túnica é sancionada. Honra ritos mais antigos que nossos bisavós. Harmonia, equilíbrio, governo legítimo — isso não é vaidade, é legitimidade.\"\n\nSuas palavras cortam o ar, silenciosas, mas intensas. Olho para minhas próprias mangas. A decisão final ainda é minha... mas agora me pergunto: o que ela proclamará quando eu entrar no salão?"
 coronation_events.1034.t:0 "Trajes Cerimoniais"
 coronation_events.1035.a.toast:0 "[host.GetTitledHouseNameOrFirstName] ignorou a transgressão"
 coronation_events.1035.a:0 "Deixe que [offending_guest.GetSheHe] tenha seu momento."
 coronation_events.1035.b.toast:0 "[host.GetTitledHouseNameOrFirstName] sentiu-se ofendido"
 coronation_events.1035.b:0 "A infração [offending_guest.GetHerHim] não passará despercebida."
 coronation_events.1035.c.toast:0 "[host.GetTitledHouseNameOrFirstName] deu um aviso privado"
 coronation_events.1035.c:0 "Falarei com [offending_guest.GetSheHe] em particular. Um aviso pode ser suficiente."
 coronation_events.1035.desc:0 "Quando [offending_guest.Custom2('MyCharacterIntroduction', ROOT.Char)] aparece, os murmúrios foram instantâneos. A túnica [offending_guest.GetHerHim] — luxuosa, brilhante e acima da posição [offending_guest.GetHerHim] — violou mais do que o costume. Quebrou a lei.\n\n[offending_guest.GetSheHe|U] se aproxima de mim com um sorriso presunçoso. \"O que acha, [ROOT.Char.Custom('FormOfAddressForLiege')]?\""
 coronation_events.1035.t:0 "O Tom Proibido"
 coronation_events.1036.a:0 "\"Vou corresponder ao tom e louvar [host.GetPrimaryTitle.GetTierAsNameNoTooltip] d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNamePossessive].\""
 coronation_events.1036.b:0 "\"Tenho uma linha em mente... um eco pontiagudo de um lamento de um velho mestre.\""
 coronation_events.1036.c:0 "\"Que minhas palavras sejam elegantes e apropriadas — um verso formal, pela formalidade.\""
 coronation_events.1036.china.desc:0 "[host.Custom('GetExpensiveDrink_Singular')|U] flui, xícaras tilintam, e o salão vibra com risadas até que uma voz se faz ouvir.\n\n\"Vamos transformar este banquete em versos,\" declara [verse_initiator.Custom2('MyCharacterIntroduction', ROOT.Char)], tendo acabado de apresentar um [Glossary('lüshi', 'GLOSS_LUSHI')] polido em louvor a [host.Custom2('MyCharacterIntroduction', ROOT.Char)]. \"Tais concursos testam o [Glossary('wen', 'CONFUCIAN_WEN')], como os estudiosos gostam de mostrar.\"\n\nA companhia se agita — alguns ansiosos para exibir aprendizado, outros cautelosos com possíveis farpas ocultas nos versos."
 coronation_events.1036.d:0 "\"A peça d[Select_CString( verse_initiator.IsFemale, 'a', 'o' )] [verse_initiator.GetFirstNamePossessiveNoTooltip] foi adorável. Farei isso ser reconhecida.\""
 coronation_events.1036.desc:0 "À medida que o banquete avança, uma voz se eleva acima do burburinho — segura e graciosa.\n\n\"Que cada um compartilhe um verso,\" proclama [verse_initiator.Custom2('MyCharacterIntroduction', ROOT.Char)] após uma recitação polida em honra a [host.Custom2('MyCharacterIntroduction', ROOT.Char)]. \"Na poesia revelamos o que valorizamos — seja virtude, ordem ou esplendor.\"\n\nUma onda passa pelo salão. Nem toda poesia é lisonja; algumas palavras carregam cortes mais afiadas."
 coronation_events.1036.e:0 "\"Houve falhas. Oferecerei algumas sugestões gentis.\""
 coronation_events.1036.japan.desc:0 "A fragrância de [host.Custom('GetExpensiveDrink_Singular')] e o farfalhar de [host.Custom('RegionalFabric')] preenchem o salão, quando uma voz se eleva com graça deliberada.\n\n\"Não deveríamos compor versos para esta reunião?\" propõe [verse_initiator.Custom2('MyCharacterIntroduction', ROOT.Char)], recitando um [Glossary('waka', 'GLOSS_waka')] em honra a [host.Custom2('MyCharacterIntroduction', ROOT.Char)]. \"Tais poemas revelam o [Glossary('miyabi', 'JAPANESE_MIYABI')] do coração, como bem sabem os cortesãos.\"\n\nSorrisos passam entre os convidados — pois um poema pode louvar ou picar com sutileza."
 coronation_events.1036.korea.desc:0 "À medida que o banquete avança, xícaras de [host.Custom('GetExpensiveDrink_Singular')] são erguidas e risadas enchem o salão. Então, uma voz pede silêncio.\n\n\"Vamos oferecer versos em honra ao anfitrião,\" declara [verse_initiator.Custom2('MyCharacterIntroduction', ROOT.Char)], completando um par de versos dignos exaltando [host.Custom2('MyCharacterIntroduction', ROOT.Char)]. \"Com isso, mostramos [Glossary('mun', 'KOREAN_MUN')], o aprendizado cultivado estimado desde os sábios.\"\n\nAlguns assentem em concordância, outros se preparam — nem todo verso é apenas elogio."
 coronation_events.1036.t:0 "Versos à Mesa"
 coronation_events.1037.a:0 "\"Os que vieram antes de mim suportaram pior.\""
 coronation_events.1037.b:0 "\"Deixe que [Select_CString( respected_elder.IsFemale, 'a', 'o' )] [respected_elder.GetTitledFirstNameNoTooltip] fale.\""
 coronation_events.1037.c:0 "\"Fora com este espalhador de medo!\""
 coronation_events.1037.d:0 "\"[ROOT.Char.GetFaith.HighGodName|U] se move, mas seguimos em frente.\""
 coronation_events.1037.desc:0 "Um murmúrio baixo percorre a corte. O [omen_happening.GetNameNoTooltip] acaba de ser reportado, línguas se movendo como se o próprio [ROOT.Char.GetFaith.HighGodName] tivesse falado.\n\nCom um olhar preocupado, [skeptical_guest.Custom2('MyCharacterIntroduction', ROOT.Char)] se aproxima: \"A notícia se espalha rapidamente, [ROOT.Char.Custom('FormOfAddressForLiege')]. Muitos aqui estão inquietos. Perguntam-se se [ROOT.Char.GetFaith.HighGodName] envia um aviso.\""
 coronation_events.1037.t:0 "[ROOT.Char.GetFaith.HighGodName|U] Fala"
 coronation_events.1038.a:0 "Zombar da impropriedade de [rite_official.GetFirstNamePossessiveNoTooltip]."
 coronation_events.1038.b:0 "\"[rite_official.GetFirstNameNoTooltip], por favor, junte-se a mim.\""
 coronation_events.1038.c:0 "Fazer um grande sacrifício, digno de ser lembrado."
 coronation_events.1038.d:0 "\"Que este sacrifício traga honra à Casa [ROOT.Char.GetDynastyNameNoTooltip]!\""
 coronation_events.1038.desc:0 "Como é tradição, o Filho do Céu deve cuidar da realização de uma série de sacrifícios, como o primeiro Huangdi fez antes de ascender aos céus como um imortal.\n\nLembro-me dessa história enquanto tomo meu lugar diante dos quatro altares do Céu, da Terra, do Trono Imperial e dos Deuses da Agricultura, enquanto [rite_official.Custom2('MyCharacterIntroduction', ROOT.Char)] continua com as tarefas mais simples. O cheiro de incenso queima meu nariz e posso sentir uma presença divina sustentando esta cerimônia."
 coronation_events.1038.e.flavor:0 "E abençoem esta terra nesta era e nas que virão."
 coronation_events.1038.e:0 "\"Que o Céu e a Terra guiem minha mão à virtude...\""
 coronation_events.1038.t:0 "Sacrifício aos Quatro Altares"
 coronation_events.1039.a:0 "Faço um apelo pelo bem dos meus súditos leais."
 coronation_events.1039.b:0 "Meu apelo é para que [ROOT.Char.GetFaith.HighGodName|U] testemunhe minha glória!"
 coronation_events.1039.c:0 "Serei vago e ambíguo."
 coronation_events.1039.d.flavor:0 "\"Em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], uma flor solitária floresce...\""
 coronation_events.1039.d.tt:0 "Você receberá um poema [artifact|E]"
 coronation_events.1039.d:0 "Desenrolar um pergaminho com um poema piedoso."
 coronation_events.1039.desc:0 "Sei que, para que minha entronização seja verdadeiramente bem-sucedida, espera-se que eu compartilhe comida e palavras com os deuses no [Glossary('Daijō-sai', 'DAIJO_SAI')].\n\nCom [supporter.Custom2('MyCharacterIntroduction', ROOT.Char)] ao meu lado, avanço em direção ao altar, preparando-me para fazer o apelo público. \"Não se preocupe, [ROOT.Char.Custom('FormOfAddressForLiege')]\", diz [supporter.GetSheHe]. \"Tenho certeza de que suas palavras ecoarão as necessidades do reino.\""
 coronation_events.1039.t:0 "Um Apelo aos Deuses"
 coronation_events.1040.a:0 "\"Nenhuma despesa será poupada em meu sinal divino!\""
 coronation_events.1040.b:0 "\"Torne-o significativo, mas simples.\""
 coronation_events.1040.c:0 "\"Os [ROOT.Char.GetFaith.HouseOfWorshipPlural] podem poupar recursos. Eu não.\""
 coronation_events.1040.desc:0 "\"Como vão os preparativos para o Mandala, meu [ROOT.Char.GetTitleAsNameNoTooltip]?\" perguntou [tributary_1.Custom2('MyCharacterIntroduction', ROOT.Char)] em tom sério. É costume que um [Glossary('sand mandala', 'GLOSS_MANDALA')] seja feito em honra ao novo [ROOT.Char.GetTitleAsNameNoTooltip], apenas para ser destruído imediatamente após os ritos apropriados.\n\nA questão tem ocupado minha mente incessantemente, pois o rito é bastante simbólico, mas ver uma obra de arte dessas ser destruída logo depois parece quase... um desperdício."
 coronation_events.1040.special:0 "\"Ordenar que o mandala do [ROOT.Char.GetFaith.HouseOfWorship] seja trazido até aqui.\""
