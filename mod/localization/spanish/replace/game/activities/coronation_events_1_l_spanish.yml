l_spanish:
 CONFUCIAN_WEN:0 "Refere-se ao refinamento cultural, ao poder civilizador da literatura, do ritual e da eloquência no pensamento chinês."
 DAIJO_SAI:0 "Uma cerimônia que ocorre após a entronização do Imperador do Japão em um palácio construído especificamente para esse propósito e demolido logo após o término da cerimônia. Após um período de autopurificação, o Imperador faz uma oferenda aos kami e participa dela ele mesmo."
 GLOSS_LUSHI:0 "É uma forma de verso regulada, com padrões tonais estritos e paralelismo. Dominar o lüshi é um marco do aprendizado culto."
 GLOSS_MANDALA:0 "Mandala de areia são cuidadosamente confeccionados por monges treinados e depois destruídos ritualmente para transmitir a impermanência. Cada um representa uma divindade ou qualidade divina em seu centro, cercada por imagens harmonizadoras, refletindo como um reino mandala se organiza."
 GLOSS_WAKA:0 "É uma forma poética de 31 sílabas (5-7-5-7-7), popular entre a nobreza japonesa."
 JAPANESE_MIYABI:0 "Refere-se à elegância e refinamento cortesão, um ideal de beleza e sensibilidade central na cultura aristocrática japonesa."
 KOREAN_MUN:0 "Refere-se ao refinamento literário e ao aprendizado, uma marca de erudição entre os nobres."
 ach_maintenance_events.0100.a:0 "Que [ROOT.Char.GetFaith.HighGodName] tenha misericórdia de [host.GetPrimaryTitle.GetNameNoTooltip]."
 ach_maintenance_events.0100.desc:0 "[host.GetName] [host.GetDeathReason] na véspera da ascensão [host.GetHerHim] ao trono. Pouco me resta a fazer além de reunir meu séquito e partir."
 ach_maintenance_events.0100.t:0 "Morte d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNamePossessiveNoTooltip]"
 ach_maintenance_events.0101.a:0 "$ach_maintenance_events.0100.a$"
 ach_maintenance_events.0101.desc:0 "Na véspera da ascensão [host.GetHerHim] ao trono, [host.GetName] foi preso por [gaoler.GetName]. Os detalhes desse ato audacioso ainda são desconhecidos; as intenções [gaoler.GetHerHim] com seu novo prisioneiro também permanecem envoltas em mistério. Pouco me resta a fazer além de reunir meu séquito e partir."
 ach_maintenance_events.0101.t:0 "[host.GetTitleAsNameNoTooltip] Tornou-se Prisioneiro"
 ach_maintenance_events.0102.a:0 "$ach_maintenance_events.0100.a$"
 ach_maintenance_events.0102.desc:0 "Aquel[Select_CString( ROOT.Char.IsFemale, 'a', 'e' )] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('hostage'))] [ROOT.Char.Custom('InsultAdjective')], [gaoler.Custom('GetDaughterSon')] de [ROOT.Char.Custom('InsultAdjective')] [ROOT.Char.Custom('InsultNounPlural')] me prendeu durante #EMP minha própria coroação!#! A cerimônia está cancelada e meu destino incerto."
 ach_maintenance_events.0102.t:0 "$ach_maintenance_events.0101.t$"
 ach_maintenance_events.0103.a:0 "$ach_maintenance_events.0100.a$"
 ach_maintenance_events.0103.desc:0 "Ninguém compareceu à minha coroação! Sem meus súditos testemunhando minha ascensão, sou apenas um [host.GetTitleAsNameNoTooltip] para mim mesmo e para minha ilusão.\n\nPreciso cancelar as cerimônias. Esta afronta não será esquecida."
 ach_maintenance_events.0103.t:0 "Solidão de [host.GetTitleAsNamePossessiveNoTooltip]"
 ach_maintenance_events.0104.a:0 "$ach_maintenance_events.0100.a$"
 ach_maintenance_events.0104.desc:0 "[officiator.GetName], o Oficiante da coroação, [officiator.GetDeathReason] na véspera da ascensão de [host.GetNamePossessive] ao trono. Tomado pelo pesar, [host.GetTitledFirstName] cancelou a coroação. Pouco me resta a fazer além de reunir meu séquito e partir."
 ach_maintenance_events.0104.t:0 "Morte do Oficiante"
 ach_maintenance_events.0105.a:0 "$ach_maintenance_events.0100.a$"
 ach_maintenance_events.0105.desc:0 "Na infinita sabedoria [hof.GetHerHim], guiado pela vontade divina de [hof.GetFaith.HighGodNamePossessive], [hof.GetName] decidiu excomungar [host.GetName] na véspera da ascensão [host.GetHerHim] ao trono. Pouco me resta a fazer além de reunir meu séquito e partir."
 ach_maintenance_events.0105.t:0 "Excomunhão de [host.GetTitleAsNamePossessiveNoTooltip]"
 ach_maintenance_events.0106.a:0 "$ach_maintenance_events.0100.a$"
 ach_maintenance_events.0106.desc:0 "Aquel[Select_CString( ROOT.Char.IsFemale, 'a', 'e' )] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('hostage'))] [ROOT.Char.Custom('InsultAdjective')], [hof.Custom('GetDaughterSon')] de [ROOT.Char.Custom('InsultNounPlural')] [ROOT.Char.Custom('InsultAdjective')] me excomungou #EMP na véspera da minha unção#! Não foi a vontade divina de [hof.GetFaith.HighGodNamePossessive], mas um sussurro de [ROOT.Char.GetFaith.DevilName] que guiou [hof.GetSheHe] neste ato insultuoso e blasfemo.\n\nPreciso cancelar as cerimônias. Esta afronta não será esquecida."
 ach_maintenance_events.0106.t:0 "$ach_maintenance_events.0105.t$"
