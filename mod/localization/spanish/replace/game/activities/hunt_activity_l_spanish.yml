 hunt_type_falconry:0 "Falcoaria"
 hunt_type_falconry_desc:0 "$EFFECT_LIST_BULLET$ Escolha uma presa entre uma variedade de aves de caça\n$EFFECT_LIST_BULLET$ Aumenta a [trait_level_track_xp|E] $trait_track_falconer$ de [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ Participação para ambos os sexos\n#weak Embora custosas, a falcoaria proporciona uma alegria na maestria da natureza incomparável entre as atividades nobres.#!"
 hunt_type_legendary:0 "Lendária"
 hunt_type_legendary_desc:0 "$EFFECT_LIST_BULLET$ Procure um animal mítico avistado na área\n$EFFECT_LIST_BULLET$ Aumenta a [trait_level_track_xp|E] $trait_track_hunter$ de [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ Maior [hunt_danger_no_prefix|E] concede mais [prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$ Participação para sexos marciais\n$EFFECT_LIST_BULLET$ Espectadores para sexos não marciais\n#weak Criaturas míticas frequentemente são descartadas como lendas pelos sábios, mas as florestas ainda podem guardar muito mistério.#!"
