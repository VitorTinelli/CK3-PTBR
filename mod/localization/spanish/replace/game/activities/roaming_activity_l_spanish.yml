 bp3_roaming.0005.a:0 "Ah, finalmente, paz."
 bp3_roaming.0005.b:0 "Que vista!"
 bp3_roaming.0005.c:0 "Espero ter trazido roupas suficientes..."
 bp3_roaming.0005.d:0 "Que timing..."
 bp3_roaming.0005.desc:0 "Minha comitiva e eu finalmente chegamos a [province.GetName]. E, por um momento, sou tomado pela vista. [province.Custom('RoamingIntroTerrainSnippet')]\n\n[province.Custom('RoamingIntroSecondHalf')]"
 bp3_roaming.0005.t:0 "Chegada"
 bp3_roaming.0010.a:0 "Ah, assim é a vida..."
 bp3_roaming.0010.desc:0 "Com um último passo, finalmente deixo o [province.Custom('HoldingNoHoldingTerrainRoaming')]. Olho para trás, pela última vez, relembrando minha jornada através do [province.GetTerrain.GetNameNoTooltip|l]. [ROOT.Char.Custom('RoamingOutroStressLoss')]\n\n[ROOT.Char.Custom('RoamingOutroReturningHome')]"
 bp3_roaming.0010.t:0 "Retorno para Casa"
 bp3_roaming.0050.a:0 "Que visão para os olhos e pernas cansados."
 bp3_roaming.0050.desc:0 "Continuamos subindo a ladeira, lentamente, um passo de cada vez. Tem sido um longo dia e posso sentir as coxas queimando. Estou apenas tentando me concentrar em colocar um pé à frente do outro neste ponto, quando um dos meus guardas me ajuda nos últimos passos.\n\nDe repente, nos encontramos em um platô, e posso ver o vale se estendendo abaixo de nós, um tapete de verde e marrom. Eu havia perdido completamente a noção de quão alto havíamos subido devido ao cansaço e ao esforço da jornada, mas agora... Agora tudo valeu a pena."
 bp3_roaming.0050.t:0 "A Vista de Tirar o Fôlego"
 bp3_roaming.0060.a:0 "Que lugar bonito aqui no meio da natureza."
 bp3_roaming.0060.desc:0 "Após caminhar pela wasteland dourada por horas, começamos a ver os sinais de um oásis à distância. A princípio, me preocupo achando que possa ser uma miragem, mas conforme nos aproximamos, vemos alguns animais pastando ao redor.\n\nEncontro um pequeno lugar à sombra, onde meus guardas e eu finalmente podemos descansar nossos pés. Um lugar para descansar, por agora. É o ponto de parada perfeito antes de começarmos a procurar um caminho de volta."
 bp3_roaming.0060.t:0 "O Pequeno Oasis"
 bp3_roaming.0070.a:0 "Que lugar curioso."
 bp3_roaming.0070.desc.intro:0 "Estamos seguindo uma antiga trilha pela floresta há horas, enquanto ela lentamente desaparece e some por completo. Olhando ao redor, encontro-me em uma pequena clareira, e não há nada aqui. Apenas... o silêncio da natureza selvagem.\n\n"
 bp3_roaming.0070.desc.landed:0 "Estar aqui já parecia distante da minha vida em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], mas, de alguma forma, agora parece que cruzamos a fronteira entre o reino humano e o desconhecido. É hora de deixar essa pequena clareira para trás e começar a caminhada de volta para casa. Pergunto-me se algum dia a verei novamente."
 bp3_roaming.0070.desc.landless:0 "Não sou estranho à vida nos ermos, mas, de alguma forma, agora parece que cruzamos a fronteira entre o reino humano e o desconhecido. É hora de deixar essa pequena clareira para trás e viajar de volta ao acampamento. Pergunto-me se algum dia a verei novamente."
 bp3_roaming.0070.t:0 "O Fim do Caminho"
 bp3_roaming.0080.a:0 "Que vida tranquila."
 bp3_roaming.0080.desc:0 "Muito antes de o vermos, ouvimos os gritos das gaivotas sobrevoando e percebemos o cheiro salgado no ar. Então, ele se abre à nossa frente, um vasto mar azul se estendendo até onde os olhos podem ver. Sentamo-nos à beira d'água, observando as ondas chegarem suavemente.\n\nPor um momento, parece que todas as minhas preocupações podem ser deixadas de lado. Um momento em que posso apenas aproveitar essa experiência. Sei que terei que voltar para casa em breve, mas por agora, estou aqui."
 bp3_roaming.0080.t:0 "O Cheiro do Oceano"
 bp3_roaming.0090.a:0 "Um bom ponto de parada, acho."
 bp3_roaming.0090.desc:0 "Está ficando tarde, quando finalmente chegamos a um pequeno rio, sem ponte à vista. Olho o melhor que posso, mas não há nada visível do outro lado. De certa forma, parece a fronteira entre os últimos vestígios de civilização e a natureza selvagem do outro lado.\n\nTomo um momento para me sentar e descansar meus pés. Ocasionalmente, sinto como se algo se movesse do outro lado da água, ou como se alguém estivesse me observando, mas não consigo distinguir nada."
 bp3_roaming.0090.t:0 "O Rio no Fim da Jornada"
 bp3_roaming.0100.a.flavor:0 "Parece um lugar fantástico para pensar, afinal."
 bp3_roaming.0100.a:0 "Agora, o que será que o [ancient_traveler.GetSheHe] estava pensando aqui no meio da natureza?"
 bp3_roaming.0100.b:0 "Finalmente, uma chance de sentar e descansar."
 bp3_roaming.0100.c.flavor:0 "Talvez o [ancient_traveler.GetSheHe] tenha alguma sabedoria para compartilhar?"
 bp3_roaming.0100.c.loss:0 "[ancient_traveler.GetNameNoTooltip] não tem interesse em conversar"
 bp3_roaming.0100.c.neutral:0 "Convenco [ancient_traveler.GetNameNoTooltip] a se juntar à minha corte"
 bp3_roaming.0100.c.win:0 "Tenho uma conversa frutífera com [ancient_traveler.GetNameNoTooltip]"
 bp3_roaming.0100.c:0 "Espere, velh[Select_CString( ancient_traveler.IsFemale, 'a', 'o' )]!"
 bp3_roaming.0100.d:0 "\"E quando olhei para o lado por um segundo, [ancient_traveler.GetSheHe] simplesmente desapareceu..."
 bp3_roaming.0100.desc.companion:0 "\n\n[special_guest.GetFirstName] senta-se na rocha envelhecida, soltando um pequeno suspiro de alívio, mais interessado em uma pausa do que em conversar com [Select_CString( ancient_traveler.IsFemale, 'a', 'o' )] [ancient_traveler.GetWomanMan]."
 bp3_roaming.0100.desc:0 "Enquanto caminho pelo [activity.GetCurrentPhase.GetLocation.Custom('GetTerrainType')], encontro um[Select_CString( ancient_traveler.IsFemale, 'a', '' )] [ancient_traveler.GetWomanMan] idos[Select_CString( ancient_traveler.IsFemale, 'a', 'o' )] sentad[Select_CString( ancient_traveler.IsFemale, 'a', 'o' )] sobre uma rocha desgastada na borda do caminho. Momentos passam em silêncio enquanto [Select_CString( ancient_traveler.IsFemale, 'a', 'o' )] [ancient_traveler.GetWomanMan] parece profundamente imerso em seus pensamentos antes de finalmente perceber minha presença.\n\nDando-me um pequeno aceno de cabeça, [ancient_traveler.GetSheHe] se levanta lentamente, cada movimento seguido pelo som de ossos rangendo, e segue rumo ao desconhecido."
 bp3_roaming.0100.t:0 "Encontrando um Estranho"
 bp3_roaming.0110.a:0 "Talvez seja hora de preparar uma caça."
 bp3_roaming.0110.b.hunter:0 "Que coisa curiosa!"
 bp3_roaming.0110.b.weakling:0 "Ufa! Fiquei preocupado por um segundo."
 bp3_roaming.0110.c:0 "\"Após uma luta feroz, a enorme besta virou-se e fugiu...\""
 bp3_roaming.0110.desc.companion:0 "Ao meu lado, ouço [Select_CString( special_guest.IsFemale, 'a', 'o' )] [special_guest.GetFirstName] soltar um suspiro de alívio."
 bp3_roaming.0110.desc:0 "À medida que o clima piora, de repente avisto algo surgindo da vegetação à frente. Um(a) [sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalType')] surpreendentemente grande a apenas alguns passos à minha frente, seu olhar se encontra com o meu quando percebe minha presença.\n\nDura apenas um momento, antes que o animal repentinamente se afaste de volta para a selva."
 bp3_roaming.0110.t:0 "[sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalType')|U] em [sighting_province.GetNameNoTooltip]"
 bp3_roaming.0120.a:0 "Deve ser meu!"
 bp3_roaming.0120.b:0 "Que visão!"
 bp3_roaming.0120.c:0 "\"Então a enorme besta veio em minha direção...\""
 bp3_roaming.0120.desc.companion:0 "$bp3_roaming.0110.desc.companion$"
 bp3_roaming.0120.desc:0 "Enquanto sigo pelo mau tempo, de repente vejo algo se movendo na periferia da minha visão. Por um segundo, a imagem clareia e vejo um(a) [sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalType')] [sighting_province.GetTitle.GetDeJureLiege.Custom('GetLegendaryColor')] me encarando.\n\nMeus pensamentos correm para lembrar as poucas histórias que ouvi sobre o enigmático animal mítico, enquanto ele permanece ali bem à minha frente. Mas, tão rapidamente quanto apareceu, desaparece de volta para a [activity.GetCurrentPhase.GetLocation.Custom('RoamingLegendaryBeastProvinceWeather')]."
 bp3_roaming.0120.t:0 "Um(a) [sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalType')|U] das Lendas"
 bp3_roaming.0130.a:0 "Deveria oferecer uma pequena oração pelos mortos."
 bp3_roaming.0130.b:0 "Vamos ver se consigo encontrar algo valioso."
 bp3_roaming.0130.c:0 "\"E então vi os mortos se erguerem do chão...\""
 bp3_roaming.0130.desc.companion:0 " [special_guest.GetFirstName] faz careta ao ver tudo isso e segue para longe da área."
 bp3_roaming.0130.desc:0 "Ouço os corvos ao longe muito antes de vê-lo com meus próprios olhos. Um pequeno campo de batalha cheio de corpos mortos, claramente deixados para apodrecer por algum tempo.\n\nOs corvos, com bicos ensanguentados, ocasionalmente olham para cima de suas refeições enquanto passo."
 bp3_roaming.0130.t:0 "Um Campo de Batalha Esquecido"
 bp3_roaming.0140.a:0 "Não pense nisso, apenas feche os olhos e reze."
 bp3_roaming.0140.b.1:0 "Você passa a noite toda procurando por ameaças."
 bp3_roaming.0140.b.2:0 "Você espanta qualquer coisa que estivesse por aí."
 bp3_roaming.0140.b.3:0 "Você adormece esperando que os guardas façam o trabalho deles."
 bp3_roaming.0140.b:0 "\"Guardas! Vasculhem as florestas em busca de qualquer besta; mítica ou comum!\""
 bp3_roaming.0140.c:0 "\"Eu vi pequenas criaturas não-humanas dançando na borda da luz...\""
 bp3_roaming.0140.d:0 "Um momento perfeito para pensar."
 bp3_roaming.0140.desc.companion:0 "\n\nEnquanto faço isso, ouço [Select_CString( special_guest.IsFemale, 'a', 'o' )] [special_guest.GetFirstName] roncar um pouco perto. Não parece que mais alguém esteja tendo dificuldade para descansar..."
 bp3_roaming.0140.desc:0 "O escuro silêncio envolve o acampamento enquanto nos preparamos para dormir. Um guarda fica de sentinela, mas não há descanso a ser encontrado. Os sons de criaturas se mexendo, rastejando e se agitando na escuridão pontuam o silêncio.\n\nAcima, o céu noturno é um tapete infinito de pequenas luzes. Por um momento, tento simplesmente ignorar o barulho de fundo, enquanto me concentro naquela visão."
 bp3_roaming.0140.t:0 "Uma Noite nas Terras Selvagens"
 bp3_roaming.0150.a:0 "Ah, um momento para descansar."
 bp3_roaming.0150.b:0 "\"Eu parti quando ouvi uma melodia encantadora ecoar através da água...\""
 bp3_roaming.0150.desc.companion:0 "Sentamos à beira d'água, descansamos os pés e ouço [Select_CString( special_guest.IsFemale, 'a', 'o' )] [special_guest.GetFirstName] soltar um suspiro pesado."
 bp3_roaming.0150.desc.no_companion:0 "Sento-me à beira d'água, descanso os pés e dou um profundo suspiro."
 bp3_roaming.0150.desc:0 "Após um longo dia caminhando pelas [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')], de repente encontro um lago tranquilo no meio da selva. Além de alguns pássaros tranquilos bebendo da água, não há homem ou besta à vista.\n\n"
 bp3_roaming.0150.t:0 "Um Lago Tranquilo"
 bp3_roaming.0160.a:0 "Encontre os restos e dê-lhes o descanso adequado."
 bp3_roaming.0160.b:0 "Guardas, limpem o local."
 bp3_roaming.0160.c:0 "\"Tentamos várias vezes invadir o edifício em chamas, mas sem sucesso...\""
 bp3_roaming.0160.desc.companion:0 "Ouço [Select_CString( special_guest.IsFemale, 'a', 'o' )] [special_guest.GetFirstName] conversando com meus guardas; não há mais ninguém ou nada para salvar aqui."
 bp3_roaming.0160.desc.no_companion:0 "Meus guardas levam apenas um momento para apontar que não há mais ninguém ou nada para salvar aqui."
 bp3_roaming.0160.desc.outro:0 "O que restou são as cinzas de um lar e de quem ali viveu."
 bp3_roaming.0160.desc:0 "Muito antes de vê-la, sinto o cheiro de madeira e carne queimando. Ao chegarmos, tudo o que vejo é o esqueleto fumegante do que deve ter sido uma grande fazenda.\n\n"
 bp3_roaming.0160.t:0 "A Fazenda Ardente"
 bp3_roaming.0170.a:0 "Talvez isso seja exatamente o que eu precisava."
 bp3_roaming.0170.desc.companion:0 "Gradualmente, porém, começo a apreciar o tempo que passo com [Select_CString( special_guest.IsFemale, 'a', 'o' )] [special_guest.GetFirstName]. Nada de importante acontece, mas é agradável mesmo assim."
 bp3_roaming.0170.desc.no_companion:0 "Gradualmente, porém, começo a apreciar a simplicidade da caminhada em si. Torna-se um momento apenas para mim e meus pensamentos."
 bp3_roaming.0170.desc:0 "Apesar das minhas muitas expectativas, o dia se desenrolou de maneira surpreendentemente simples e tranquila. Inicialmente, me vi atento a cada visão e som. No entanto, com o passar do tempo, nada se destacou como particularmente memorável, e minha atenção começou a desviar.\n\n"
 bp3_roaming.0170.t:0 "Um Dia Tranquilo"
 bp3_roaming.0180.a:0 "Não se preocupe, é logo ali!"
 bp3_roaming.0180.a_short:0 "Você continua!"
 bp3_roaming.0180.b:0 "Talvez seja hora de uma pausa..."
 bp3_roaming.0180.desc:0 "Eu realmente estou aproveitando nossa caminhada em [ROOT.Char.GetCurrentLocation.GetName], mas para minha decepção, o mesmo não pode ser dito para meu companheiro de viagem. [special_guest.GetFirstName] começou a ficar para trás, e ouço xingamentos ocasionais vindos [special_guest.GetHerHim], às vezes até com meu nome envolvido. Com voz frustrada, [special_guest.GetSheHe] finalmente fala 'Já chegamos?'\n\nTenho bastante certeza de que ainda estamos longe do nosso objetivo, e ainda há uma longa caminhada pela frente. [special_guest.GetSheHe|U] me olha esperando uma resposta."
 bp3_roaming.0180.t:0 "Murmúrios Cansados"
 bp3_roaming.0190.a:0 "Não acredito que [Select_CString( random_courtier.IsFemale, 'a', 'o' )] [random_courtier.GetFirstNameNoTooltip] disse isso! Que hilário!"
 bp3_roaming.0190.desc:0 "Enquanto atravessamos as terras selvagens ao redor de [ROOT.Char.GetCurrentLocation.GetName], [special_guest.GetFirstName] e eu temos muito tempo para conversar. Eu esperava que aproveitássemos o tempo juntos, mas fico surpreso positivamente com o quão bem está indo.\n\n[special_guest.GetFirstNameNoTooltip] tem uma vasta gama de tópicos interessantes, seja sobre pessoas em [ROOT.Char.GetCapitalLocation.GetName], fofocas locais ou histórias memoráveis. Horas passam antes que eu perceba, e parece que foi apenas um momento."
 bp3_roaming.0190.t:0 "Uma Chance para Conversar"
 bp3_roaming.0200.a:0 "Que visão!"
 bp3_roaming.0200.desc:0 "Várias horas se passaram desde o pôr do sol quando os céus de repente se transformam nas mais belas tonalidades de roxo, azul e laranja. É como se o próprio [ROOT.Char.GetFaith.HighGodName] estivesse usando os céus como uma tela.\n\nEm admiração e medo, todos nós observamos o espetáculo se desenrolar em silêncio. Só depois que termina é que todos começam a falar sobre o que vimos, tanto em reverência quanto com medo."
 bp3_roaming.0200.t:0 "A Tela no Céu"
 bp3_roaming.0210.a:0 "Bem, um para tristeza, dois para sorte."
 bp3_roaming.0210.desc:0 "Enquanto viajamos por [province.GetName], dois pássaros nos seguem por horas. Eles apenas nos cercam lentamente, pousando longe demais para serem uma ameaça, e cantando para nós de longe. Quando se aproximam por um momento, vejo suas penas pretas e brancas.\n\nDepois de um tempo, eles fazem uma volta e então voam embora. Mesmo depois de irem, ainda podemos ouvir seus cantos ao longe."
 bp3_roaming.0210.t:0 "Os Pássaros Acima"
 bp3_roaming.0220.a.landless:0 "Vamos ver o que eles têm por aqui..."
 bp3_roaming.0220.a:0 "Espera, elas não me devem muitos impostos?"
 bp3_roaming.0220.b.mystic:0 "Aprendido com o Místico da Vila"
 bp3_roaming.0220.b:0 "Eu preciso aprender tudo sobre essas pessoas!"
 bp3_roaming.0220.c:0 "Que curioso! Isso vai ser uma boa história."
 bp3_roaming.0220.desc:0 "\"#emp Existe uma vila aqui?!#\" Eu me pego dizendo, profundamente confuso.\n\nEla não estava em nenhum mapa, e ninguém jamais mencionou nada sobre ela. E ainda assim, aqui está. Quando pergunto o nome da vila, as pessoas simplesmente dizem: \"A vila? É a vila.\" Com um sotaque espesso que nunca ouvi antes.\n\nQuem são essas pessoas?! Por que nunca ouvi falar delas antes?"
 bp3_roaming.0220.t:0 "A Vila Esquecida"
 bp3_roaming.0230.a.hermit:0 "Falou com o Eremita"
 bp3_roaming.0230.a:0 "Você tem umas ideias curiosas, [hermit_character.GetNameNoTooltip]."
 bp3_roaming.0230.b.tooltip:0 "Você se converte secretamente para [hermit_faith.GetName]"
 bp3_roaming.0230.b:0 "#emp Conte-me mais...#!"
 bp3_roaming.0230.c:0 "O que você disse sobre [ROOT.Char.GetFaith.HighGodName]? Inaceitável, herege!"
 bp3_roaming.0230.desc:0 "Enquanto viajamos pelas terras distantes de [province.GetName], meus guardas e eu de repente encontramos um[Select_CString( hermit_character.IsFemale, 'a', '' )] [hermit_character.GetWomanMan] vestido com roupas sujas sentado sozinh[Select_CString( hermit_character.IsFemale, 'a', 'o' )]. Assim que [hermit_character.GetSheHe] nos nota, [hermit_character.GetSheHe] exclama em voz alta: 'Vocês são a última prova enviada por [hermit_character.GetFaith.HighGodName]?!'\n\n'Com licença?' Eu consigo dizer, confuso, e um pouco insultado.\n\n'Venham, eu contarei tudo sobre as provas e lamentações de [hermit_character.GetName] o Sábio...'"
 bp3_roaming.0230.t:0 "O Eremita"
 bp3_roaming.0240.a:0 "Vou lembrar disso por toda a minha vida."
 bp3_roaming.0240.desc:0 "Enquanto nos acomodamos para a noite, vemos o céu inteiro se iluminar com estrelas. É uma das noites mais claras que já vimos desde que saímos de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier].\n\nEstá quieto, não se ouve nenhum som, seja de pessoas ou animais. É como se os [province.GetTerrain.GetNameNoTooltip|l] estivessem prendendo a respiração, enquanto todos nós estamos absorvendo o céu noturno. Eu deveria ir para a cama e descansar para amanhã, mas... Talvez eu possa ficar acordado por mais uma ou duas horas."
 bp3_roaming.0240.t:0 "Uma Noite para Lembrar"
 bp3_roaming.0250.a:0 "Fazer algumas orações."
 bp3_roaming.0250.artifact:0 "Você desenterra um [artifact|E]"
 bp3_roaming.0250.b:0 "Desenterrar qualquer valioso que tenha sido escondido na sepultura."
 bp3_roaming.0250.desc:0 "Enquanto viajamos por [province.Custom('HoldingNoHoldingTerrainRoaming')], encontramos o que parece ser uma sepultura. Ela tem [province.Custom('RoamingGraveVariants')]. Não há nada que indique o motivo dessa sepultura estar aqui, tão longe da civilização.\n\nApesar da localização remota, muito esforço foi feito para tornar a área agradável. Considerando a situação, eu deveria..."
 bp3_roaming.0250.t:0 "Uma Pequena Sepultura"
 breathtaking_view_key:0 "[host.GetShortUIName] chegou ao ponto mais alto de [province.GetName], o que proporcionou uma vista deslumbrante, e decidiu que era hora de começar a voltar para casa."
