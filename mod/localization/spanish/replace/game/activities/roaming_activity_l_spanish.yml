 roaming_old_man_key:0 "Em [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')], [host.GetShortUIName|U] encontrou um[Select_CString( ancient_traveler.IsFemale, 'a', '' )] [ancient_traveler.GetWomanMan] velh[Select_CString( ancient_traveler.IsFemale, 'a', 'o' )] enrugad[Select_CString( ancient_traveler.IsFemale, 'a', 'o' )]."
 roaming_old_man_key_title:0 "Viajante Ancião"
 roaming_option_travel_length:0 "Duração da Viagem"
 roaming_outro_snippet_returning_home:0 "Virando-me, com um pequeno suspiro para mim mesmo, começo o meu retorno."
 roaming_outro_snippet_returning_home_2:0 "Relutantemente, viro-me, deixo as memórias de lado e começo a seguir para casa, para as responsabilidades que certamente me aguardam."
 roaming_outro_snippet_returning_home_3:0 "Respiro fundo, saboreando os últimos momentos neste refúgio, antes de embarcar na jornada de volta."
 roaming_outro_snippet_returning_home_4:0 "Com um coração mais calmo do que esteve por um bom tempo, finalmente me despeço deste lugar, é hora de voltar para casa."
 roaming_outro_snippet_stress_loss_medium:0 "Sinto como se um peso tivesse sido tirado dos meus ombros."
 roaming_outro_snippet_stress_loss_medium_2:0 "Aqui, abraçado pela natureza e longe das pessoas, meus problemas parecem menos assustadores."
 roaming_outro_snippet_stress_loss_medium_3:0 "Sinto como se uma sensação de calma tivesse tomado conta de mim, e meus problemas habituais parecem uma sombra de seu antigo eu. Pelo menos por agora."
 roaming_outro_snippet_stress_loss_strong:0 "Sinto-me revigorado, como se tivesse me livrado de uma capa pesada de preocupações e aflições."
 roaming_outro_snippet_stress_loss_strong_2:0 "Deixo essas terras sentindo-me profundamente renovado, minha mente clara e meu coração mais leve."
 roaming_outro_snippet_stress_loss_strong_3:0 "O estresse, que antes parecia esmagador, agora parece distante, como nuvens escuras afastadas pelo sol."
 roaming_outro_snippet_stress_loss_very_strong:0 "Sozinho na natureza, encontrei clareza e um entendimento mais profundo do meu caminho."
 roaming_outro_snippet_stress_loss_very_strong_2:0 "O estresse derreteu, e sinto que encontrei um novo significado para a vida."
 roaming_outro_snippet_stress_loss_very_strong_3:0 "Neste lugar tranquilo, pude deixar todas as minhas preocupações de lado e voltar como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] renovad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] e transformad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 roaming_outro_snippet_stress_loss_weak:0 "Essas terras acalmaram minha mente cansada, embora de forma sutil. Um leve descanso dos tumultos da vida."
 roaming_outro_snippet_stress_loss_weak_2:0 "Neste refúgio, encontrei alguns momentos de alívio, aliviando meu espírito um pouco."
 roaming_outro_snippet_stress_loss_weak_3:0 "Este lugar ofereceu uma breve fuga das minhas responsabilidades. Foi um conforto modesto, mas ainda assim um conforto."
