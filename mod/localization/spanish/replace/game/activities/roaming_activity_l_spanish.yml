 roaming_forgotten_village_modifier:0 "$bp3_roaming.0220.t$"
 roaming_forgotten_village_modifier_desc:0 "Uma vila esquecida na área recentemente se reconectou com muitos de seus vizinhos, compartilhando seus conhecimentos e tradições."
 roaming_grave_variant_burial_mound:0 "um pequeno montículo de sepultura com várias pedras cuidadosamente colocadas no topo"
 roaming_grave_variant_cross:0 "uma pequena e bela cruz erguida do solo"
 roaming_grave_variant_stone:0 "uma pequena pedra, com um nome gravado nela"
 roaming_intro_second_half_generic:0 "Finalmente, posso deixar todas aquelas lutas do passado para trás e apenas me concentrar em encontrar um momento para relaxar — uma oportunidade de deixar tudo de lado e realmente descansar."
 roaming_intro_second_half_monsoon:0 "Com a monção sobre nós, talvez este tenha sido um momento ruim para deixar para trás as dificuldades da nobreza. Eu meio que sinto falta de estar em um lugar fechado agora."
 roaming_intro_second_half_winter:0 "Eu esperava que este fosse um momento de relaxamento longe do estresse da corte, mas... está mais frio do que eu imaginei."
 roaming_intro_terrain_snippet_desert:0 "Uma vasta extensão de areias douradas se estende infinitamente diante de mim, com o sol pendendo baixo no céu."
 roaming_intro_terrain_snippet_desert_2:0 "A vastidão dourada se desenrola em todas as direções, até onde os olhos podem ver, quieta e implacável."
 roaming_intro_terrain_snippet_desert_monsoon:0 "As areias cederam brevemente às intensas chuvas, e por um momento há vida a ser vista neste ambiente normalmente árido."
 roaming_intro_terrain_snippet_desert_mountains:0 "Picos escarpados se erguem contra o céu, como sentinelas silenciosas dessa terra árida."
 roaming_intro_terrain_snippet_desert_mountains_2:0 "Vais ocultas entre as gigantescas montanhas, com pequenas oases proporcionando um momento de alívio para os cansados viajantes."
 roaming_intro_terrain_snippet_desert_mountains_monsoon:0 "Rios de água abrem novos caminhos pelas encostas das montanhas durante a chuva, suavizando a paisagem por este breve momento."
 roaming_intro_terrain_snippet_farmlands:0 "Fileiras intermináveis de colheitas se estendem até onde os olhos podem ver, com camponeses ou servos trabalhando ao sol."
 roaming_intro_terrain_snippet_farmlands_2:0 "Os fazendeiros cuidam de seus campos enquanto os animais pastam tranquilamente em campos verdes."
 roaming_intro_terrain_snippet_farmlands_monsoon:0 "Os campos explodem de vida durante as intensas chuvas, com os fazendeiros locais aproveitando ao máximo a situação."
 roaming_intro_terrain_snippet_farmlands_winter:0 "Campos vazios cobertos pelo frio e pela neve, sem camponeses ou animais à vista."
 roaming_intro_terrain_snippet_farmlands_winter_2:0 "Campos vazios cobertos de geada, e o frio é um lembrete da época do ano."
 roaming_intro_terrain_snippet_forest:0 "Árvores imponentes, com a luz do sol brincando sobre o solo musgoso, e o aroma fresco da natureza no ar."
 roaming_intro_terrain_snippet_forest_2:0 "Pássaros cantando nas copas das árvores altas, e animais se movendo pela vegetação rasteira."
 roaming_intro_terrain_snippet_forest_monsoon:0 "O som rítmico da chuva pode ser ouvido ao nosso redor, gotas pesadas caindo das copas das árvores."
 roaming_intro_terrain_snippet_forest_winter:0 "Uma paisagem tranquila onde as árvores permanecem como sentinelas estoicas, quebradas ocasionalmente pelo suave estalar da neve."
 roaming_intro_terrain_snippet_forest_winter_2:0 "Uma vasta extensão silenciosa, com o solo delicadamente coberto pela neve, e as árvores adornadas pela geada."
 roaming_intro_terrain_snippet_hills:0 "As colinas se estendem como um mar verde e marrom à nossa frente."
 roaming_intro_terrain_snippet_hills_2:0 "Consigo ver os pequenos picos das colinas, um após o outro, cada um deles um pequeno objetivo a ser conquistado nos próximos dias."
 roaming_intro_terrain_snippet_hills_monsoon:0 "As chuvas esculpem pequenos riachos de água pelas encostas das colinas, passageiros, mas uma visão impressionante."
 roaming_intro_terrain_snippet_hills_winter:0 "As colinas estão adornadas por geada e neve delicada, estendendo-se pela distância."
 roaming_intro_terrain_snippet_hills_winter_2:0 "As colinas estão cobertas de branco pelo frio. Há um silêncio nessas colinas, quebrado apenas pelo ocasional estalar suave da neve sob meus pés."
 roaming_intro_terrain_snippet_mountain:0 "Olho para as imponentes montanhas ao nosso redor, com seus picos elevados que parecem alcançar os céus."
 roaming_intro_terrain_snippet_mountain_2:0 "Uma vista deslumbrante se desenrola diante de nós, com animais e pessoas quase invisíveis à distância."
 roaming_intro_terrain_snippet_mountain_monsoon:0 "Rios e pequenas cachoeiras caem pela montanha, transformando os vales abaixo em exuberantes refúgios de vida."
 roaming_intro_terrain_snippet_mountain_winter:0 "Os picos das montanhas estão cobertos por um manto de neve, e o clima é afiado e frio com o inverno."
 roaming_intro_terrain_snippet_oasis:0 "Palmeiras balançando suavemente ao redor de uma pequena oase, com um grupo de animais bebendo tranquilamente da água."
 roaming_intro_terrain_snippet_oasis_2:0 "A vegetação cerca as águas claras de uma pequena oase, oferecendo descanso para um grupo de viajantes."
 roaming_intro_terrain_snippet_oasis_monsoon:0 "A oase e seus arredores estão florescendo sob as intensas chuvas, com a vegetação se estendendo muito além dos limites usuais da própria oase."
 roaming_intro_terrain_snippet_plains:0 "Um horizonte sem fim sob os vastos céus, com a grama ondulando formando um mar suave de verde."
 roaming_intro_terrain_snippet_plains_2:0 "Planícies infinitas, com um animal ocasional pastando suavemente à distância."
 roaming_intro_terrain_snippet_plains_monsoon:0 "Planícies enlameadas molhadas por chuvas intensas até onde os olhos podem ver."
 roaming_intro_terrain_snippet_plains_winter:0 "Ventos cortantes e a neve cobrindo a terra, até onde a vista alcança."
 roaming_intro_terrain_snippet_plains_winter_2:0 "O silêncio tranquilo do inverno envolveu a terra, interrompido apenas por animais errantes em busca de alimento."
 roaming_intro_terrain_snippet_wetlands:0 "Pântanos até onde os olhos podem ver, com um pequeno grupo de pessoas cuidadosamente utilizando os pequenos canais enquanto se movem pelo local."
 roaming_intro_terrain_snippet_wetlands_2:0 "A água reflete o céu, e as plantas aquáticas balançam lentamente ao vento. Há um zumbido constante de insetos e o balido de animais."
 roaming_intro_terrain_snippet_wetlands_monsoon:0 "O pântano se transformou, com o aumento do nível da água, quase impossível de se mover pela área. Enquanto pondero sobre como atravessar a paisagem, vejo um homem lentamente caminhando pela água, com o nível alcançando seu peito."
 roaming_legendary_sighting_key:0 "[host.GetShortUIName] encontrou um animal lendário enquanto viajava pela [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')]."
