 activity_local_examination_not_available_tt:0 "#T [GetActivityType( 'activity_local_examination' ).GetNameNoTooltip]#!\nNesta [activity|E], os participantes podem realizar:\n@provincial_exam_icon! Exame Provincial\n\n$activity_local_examination_expected_frequency$"
 activity_local_examination_plural:0 "Exames Locais"
