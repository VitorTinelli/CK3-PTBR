 activity_local_examination_guest_desc:0 "\n$BULLET_WITH_TAB$Uma oportunidade de completar o @provincial_exam_icon! #V Exame Provincial#!\n$BULLET_WITH_TAB$Pode aumentar sua [trait_level_track_xp|E] [GetTrait('confucian_education').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$Pode aumentar seu [merit|E]\n$BULLET_WITH_TAB$ @alert_icon! #alert_trial Se você não sabe a [language|E] [host.GetCulture.GetLanguage.GetName], suas chances de sucesso são drasticamente reduzidas!"
 activity_local_examination_guest_help_text:0 "Qualquer [activity_guests|E] convidado será submetido aos exames; e uma nota de aprovação significa mais [merit|E] para o Convidado, assim como mais [prestige|E] para o [activity_host|E]\n\nExames também são uma ótima ocasião para criar conexões e conhecer oficiais importantes."
 activity_local_examination_guest_rewards:0 "\n$BULLET_WITH_TAB$Pode recrutar um personagem altamente qualificado\n$BULLET_WITH_TAB$Participantes podem ganhar [trait_level_track_xp|E] de [GetTrait('confucian_education').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$Participantes podem ganhar [merit|E]"
