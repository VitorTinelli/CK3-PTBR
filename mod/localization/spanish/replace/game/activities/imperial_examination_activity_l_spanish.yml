 activity_imperial_examination:0 "Exame da Capital"
 activity_imperial_examination_can_complete_tt:0 "$activity_imperial_examination_not_available_tt$"
 activity_imperial_examination_conclusion_desc:0 "O [GetActivityType( 'activity_imperial_examination' ).GetName] foi concluído."
 activity_imperial_examination_desc:0 "É nossa honra e dever manter a estrutura e organizar estes exames. Eles nos permitem avaliar, determinar e premiar com [merit|E] os indivíduos mais aptos — garantindo a prosperidade futura do reino."
 activity_imperial_examination_destination_selection:0 "Você só pode sediar um $activity_imperial_examination$ em sua [capital|E]."
 activity_imperial_examination_expected_frequency:0 "Esperado a cada #V 5#! anos"
 activity_imperial_examination_guest_desc:0 "\n$BULLET_WITH_TAB$Uma oportunidade de completar o @metropolitan_exam_icon! #V Exame Metropolitano#!\n$BULLET_WITH_TAB$Uma oportunidade de completar o @palace_exam_icon! #V Exame Palaciano#!\n$BULLET_WITH_TAB$Pode aumentar sua [trait_level_track_xp|E] [GetTrait('confucian_education').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$Pode aumentar seu [merit|E]\n$BULLET_WITH_TAB$ @alert_icon! #alert_trial Se você não sabe a [language|E] [host.GetCulture.GetLanguage.GetName], suas chances de sucesso são drasticamente reduzidas!#![SelectLocalization( Scope.HasFlag('passed_provincial_exam'), 'blank_line', 'activity_imperial_examination_warning' )]"
 activity_imperial_examination_guest_help_text:0 "Qualquer [activity_guests|E] elegível para o exame pode tentar a prova. Uma nota de aprovação significa mais [merit|E] para o participante e mais [prestige|E] para o [activity_host|E]. Embora os convidados não possam entrar na sala de exames, eles podem usar sua influência para apoiar os candidatos de várias maneiras.\n\nOs exames são a ocasião perfeita para formar conexões e impressionar os examinadores, talvez garantindo um elder."
 activity_imperial_examination_guest_rewards:0 "\n$BULLET_WITH_TAB$Pode recrutar um personagem altamente habilidoso\n$BULLET_WITH_TAB$Participantes podem ganhar [trait_level_track_xp|E] [GetTrait('confucian_education').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$Participantes podem ganhar [merit|E]"
 activity_imperial_examination_host_desc:0 "$activity_imperial_examination_host_rewards$$activity_imperial_examination_guest_rewards$"
 activity_imperial_examination_host_rewards:0 "\n$BULLET_WITH_TAB$[legitimacy_i] [legitimacy|E]\n$BULLET_WITH_TAB$[prestige_i|E] [prestige|E]"
 activity_imperial_examination_not_available_tt:0 "#T [GetActivityType( 'activity_imperial_examination' ).GetNameNoTooltip]#!\nNeste [activity|E], os participantes podem completar:\n@metropolitan_exam_icon! Exame Metropolitano\n@palace_exam_icon! Exame do Palácio\n\n$activity_imperial_examination_expected_frequency$"
 activity_imperial_examination_not_hegemon:0 "Você #bold não#! detém um [title|E] de nível [hegemony|E]"
 activity_imperial_examination_plural:0 "Exames da Capital"
 activity_imperial_examination_predicted_cost:0 "O custo de um [GetActivityType( 'activity_imperial_examination' ).GetNameNoTooltip] é afetado principalmente pelo [activity_options|E] que você selecionar."
 activity_imperial_examination_province_examination_hall_desc:0 "\n#P ++ $building_type_examination_hall_01$#!"
 activity_imperial_examination_province_kaifeng_palace_desc:0 "\n#P ++ $building_type_kaifeng_palace_01$#!"
 activity_imperial_examination_selection_tooltip:0 "Sediar o [GetActivityType('activity_imperial_examination').GetName] para avaliar a habilidade e o [merit|E] de seus súditos $activity_imperial_examination_host_rewards$"
 activity_imperial_examination_warning:0 "\n#indent_newline:8 $BULLET_WITH_TAB$ @warning_icon! #color_red Como você não passou no @provincial_exam_icon! [provincial_examination|E], provavelmente irá falhar!#!"
