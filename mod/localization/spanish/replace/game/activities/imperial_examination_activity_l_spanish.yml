 apa_boasting_calligraphy_title:0 "A caligrafia de [first.GetShortUINamePossessive|U] foi elogiada pelos examinadores"
 apa_brought_huangdi_gift_title:0 "[first.GetShortUIName|U] enviou um presente requintado a [second.GetShortUIName|U]"
 apa_burning_midnight_oil_title:0 "[first.GetShortUIName|U] passou a noite toda se preparando para o teste"
 apa_confucian_fervor_title:0 "[first.GetShortUIName|U] chorou de alegria com o elogio do examinador"
 apa_entrant_disagreement_title:0 "[first.GetShortUIName|U] e [second.GetShortUIName|U] discutiram sobre semântica"
 apa_floating_poetry_title:0 "[first.GetShortUIName|U] circulou suas poesias entre os examinadores"
 apa_found_disciple_title:0 "[second.GetShortUIName|U] tornou-se o Ancião de [first.GetShortUINamePossessive|U]"
 apa_friendly_discussions_title:0 "[first.GetShortUIName|U] e [second.GetShortUIName|U] participaram de debate amigável"
 apa_fruitful_debate_title:0 "[first.GetShortUIName|U] e [second.GetShortUIName|U] compartilharam anotações antes do teste"
 apa_high_tempers_title:0 "[first.GetShortUIName|U] brigou com seus pares nos campos de prova"
 apa_impressed_examiner_title:0 "[first.GetShortUIName|U] impressionou o examinador [second.GetShortUIName|U]"
 apa_impressive_shot_title:0 "[first.GetShortUIName|U] demonstrou técnicas de arco impressionantes"
 apa_overcome_with_stress_title:0 "[first.GetShortUINamePossessive|U] desmaiou por falta de ar, seus nervos dominaram [first.GetSheHe]"
 imperial_examination_ace_archery_log:0 "[CHARACTER.GetShortUIName|U] foi o melhor arqueiro no concurso de tiro com arco em [PROVINCE.GetBaronyNameExplicitly]"
 imperial_examination_ace_archery_log_title:0 "Tiro Impressionante"
 imperial_examination_ace_classics_log:0 "[CHARACTER.GetShortUIName|U] superou todos no exame de clássicos em [PROVINCE.GetBaronyNameExplicitly]"
 imperial_examination_ace_classics_log_title:0 "Clássicos Brilhantes"
 imperial_examination_ace_essay_log:0 "[CHARACTER.GetShortUIName|U] superou todos na redação em [PROVINCE.GetBaronyNameExplicitly]"
 imperial_examination_ace_essay_log_title:0 "Ensaio Extraordinário"
 imperial_examination_ace_poetry_log:0 "[CHARACTER.GetShortUIName|U] superou todos na composição poética em [PROVINCE.GetBaronyNameExplicitly]"
 imperial_examination_ace_poetry_log_title:0 "Poesia Estupenda"
 imperial_examination_ace_polearm_log:0 "[CHARACTER.GetShortUIName|U] demonstrou habilidade notável na demonstração de lanças em [PROVINCE.GetBaronyNameExplicitly]"
 imperial_examination_ace_polearm_log_title:0 "Mestre da Lança"
 imperial_examination_ace_riding_log:0 "[CHARACTER.GetShortUIName|U] demonstrou grande habilidade em arco e flecha a cavalo durante o exame"
 imperial_examination_ace_riding_log_title:0 "Prodígio da Montaria com Arco"
 imperial_examination_base_cost:0 "Custo Base"
 imperial_examination_breadth:0 "Amplitude do Exame"
 imperial_examination_breadth_exclusive:0 "Convite Exclusivo"
 imperial_examination_breadth_exclusive_desc:0 "$EFFECT_LIST_BULLET$ A atividade está aberta a poucos selecionados, excluindo o público em geral\n$EFFECT_LIST_BULLET$Você ganhará #EMP menos#! [merit|E] ao completar\n\n#weak Permitirei que os filhos mais distinguidos de meus súditos sirvam em #EMP meu#! reino.#!"
 imperial_examination_breadth_open:0 "Convite Aberto"
 imperial_examination_breadth_open_desc:0 "$EFFECT_LIST_BULLET$ A atividade é organizada em grande escala, introduzindo muitos candidatos ansiosos\n$EFFECT_LIST_BULLET$Você ganhará #EMP mais#! [legitimacy|E] ao completar\n\n#weak A sabedoria pode vir de todas as áreas. Vamos lançar uma rede ampla e ver quem se destacará."
 imperial_examination_breadth_restricted:0 "Convite Restrito"
 imperial_examination_breadth_restricted_desc:0 "$EFFECT_LIST_BULLET$ Os candidatos são limitados a um público modesto, permitindo alguns membros do público em geral.\n\n#weak Governantes futuros podem surgir das raízes mais humildes.#!"
 imperial_examination_conclusion.entrant_failee:0 "\n\nO exame terminou em grande decepção. Terei que me esforçar mais na próxima vez."
 imperial_examination_conclusion.entrant_passed:0 "\n\nPassei no Exame Metropolitano, e minha família pode se orgulhar das minhas realizações."
 imperial_examination_conclusion.entrant_passed_palace:0 "\n\nO império agora me reconhece como um dos melhores estudiosos, e as oportunidades à minha frente são vastas."
 imperial_examination_conclusion.general:0 "\n\nDe um conjunto inicial de #BOL [activity.MakeScope.Var('num_initial_entrants').GetValue]#! [entrants|E], #BOL [activity.MakeScope.Var('num_final_failees').GetValue]#! #EMP falharam#! no Exame.\n\n[activity.MakeScope.Var('first_place_entrant').Char.GetShortUIName] foi o mais bem-sucedido dos [entrants|E], com uma nota [activity.Custom('ActivityGetExamScoreAdjective')] de #BOL [activity.MakeScope.Var('first_place_entrant_score').GetValue|0]#!, seguido por [activity.MakeScope.Var('second_place_entrant').Char.GetShortUIName] e [activity.MakeScope.Var('third_place_entrant').Char.GetShortUIName]."
 imperial_examination_conclusion.intro.breadth.grand:0 "\n\nA #BOL $imperial_examination_breadth_restricted$#! do convite significou que tivemos um #BOL Decente#! número total de [entrants|E]."
 imperial_examination_conclusion.intro.breadth.imperial:0 "\n\nA #BOL $imperial_examination_breadth_open$#! do convite significou que tivemos um #BOL Grande#! número total de [entrants|E]."
 imperial_examination_conclusion.intro.breadth.palace:0 "\n\nA #BOL $imperial_examination_breadth_exclusive$#! do convite significou que tivemos um #BOL Pequeno#! número total de [entrants|E]."
 imperial_examination_conclusion.intro.passing_grade.extreme:0 "\n\nAs restrições de #BOL $imperial_examination_passing_grade_extreme$#! concederam uma quantidade #BOL Extraordinária#! de [merit|E] a um #BOL Pequeno#! número de [entrants|E]."
 imperial_examination_conclusion.intro.passing_grade.high:0 "\n\nAs restrições de #BOL $imperial_examination_passing_grade_high$#! concederam uma quantidade #BOL Alta#! de [merit|E] a um #BOL Médio#! número de [entrants|E]."
 imperial_examination_conclusion.intro.passing_grade.low:0 "\n\nAs restrições de #BOL $imperial_examination_passing_grade_low$#! concederam uma quantidade #BOL Baixa#! de [merit|E] a um #BOL Muito Alto#! número de [entrants|E]."
 imperial_examination_conclusion.intro.passing_grade.mediocre:0 "\n\nAs restrições de #BOL $imperial_examination_passing_grade_mediocre$#! concederam uma quantidade #BOL Média#! de [merit|E] a um #BOL Grande#! número de [entrants|E]."
 imperial_examination_conclusion.intro:0 "Os Exames finalmente chegaram ao fim."
 imperial_examination_entrant_rewards:0 "Recompensas Interessantes para os Participantes"
 imperial_examination_entrant_rewards_title:0 "Exame Realizado"
 imperial_examination_focus:0 "Foco do Exame"
 imperial_examination_focus_learning:0 "Estudiosos Perspicazes"
 imperial_examination_focus_learning_desc:0 "Os exames concederão mais mérito aos candidatos que se destacam em [learning|E]\n\n#weak \"É nosso prazer aprender e colocar esse aprendizado em prática.\"#!"
 imperial_examination_focus_martial:0 "Estratégas Militares"
 imperial_examination_focus_martial_desc:0 "Os exames concederão mais mérito aos candidatos que se destacam em [martial|E]\n\n#weak \"Estratégia militar é tão virtuosa quanto qualquer outro aprendizado.\"#!"
 imperial_examination_focus_stewardship:0 "Governo Eficiente"
 imperial_examination_focus_stewardship_desc:0 "Os exames concederão mais mérito aos candidatos que se destacam em [stewardship|E]\n\n#weak \"Há uma diferença clara entre quem vive de falar e pessoas realmente úteis.\"#!"
 imperial_examination_host_rewards:0 "Recompensas do Anfitrião"
 imperial_examination_host_rewards_title:0 "$activity_imperial_examination$ Realizado"
 imperial_examination_passing_grade:0 "Nota de Aprovação do Exame"
 imperial_examination_passing_grade_extreme:0 "Nota Extrema"
 imperial_examination_passing_grade_extreme_desc:0 "$EFFECT_LIST_BULLET$ A nota de aprovação para os exames é muito alta, eliminando #EMP muitos#! candidatos\n$EFFECT_LIST_BULLET$ Você ganhará #EMP muito mais#! [legitimacy|E] ao concluir\n\n#weak Apenas os melhores dos melhores alcançarão a nota de aprovação e se tornarão #EMP meus#! futuros oficiais do governo.#!"
 imperial_examination_passing_grade_high:0 "Nota Alta"
 imperial_examination_passing_grade_high_desc:0 "$EFFECT_LIST_BULLET$ A nota de aprovação para os exames é regular, eliminando a quantidade esperada de candidatos\n$EFFECT_LIST_BULLET$ Recompensas de [legitimacy|E] ao concluir não são afetadas\n\n#weak Meus padrões são altos, mas não irrazoáveis. Se queremos oficiais baseados no mérito, eles precisam alcançar um certo nível de excelência.#!"
 imperial_examination_passing_grade_low:0 "Nota Baixa"
 imperial_examination_passing_grade_low_desc:0 "$EFFECT_LIST_BULLET$ A nota de aprovação para os exames é muito baixa, eliminando uma #EMP ínfima#! quantidade de candidatos\n$EFFECT_LIST_BULLET$ Você ganhará #EMP muito menos#! [legitimacy|E] ao concluir\n\n#weak Precisamos desses oficiais qualificados #EMP agora#!. Eu estabeleço as regras e determino os padrões; eles obedecem. Este é meu mandato.#!"
 imperial_examination_passing_grade_mediocre:0 "Nota Mediana"
 imperial_examination_passing_grade_mediocre_desc:0 "$EFFECT_LIST_BULLET$ A nota de aprovação para os exames é um pouco relaxada, eliminando uma #EMP menor#! quantidade de candidatos\n$EFFECT_LIST_BULLET$ Você ganhará #EMP menos#! [legitimacy|E] ao concluir\n\n#weak Por que impedir que candidatos de origens humildes aprendam no trabalho? Contanto que tenham boas bases, deixemos que passem.#!"
 imperial_examination_phase_assembly:0 "Assembleia"
 imperial_examination_phase_assembly_desc:0 "Procurando em todos os lugares, todos os candidatos elegíveis estão a caminho das salas de exame."
 imperial_examination_phase_examination:0 "Exame Metropolitano"
 imperial_examination_phase_examination_desc:0 "O exame metropolitano começa. Que os resultados sejam os que vierem."
 imperial_examination_phase_palace_examination:0 "Exame do Palácio"
 imperial_examination_phase_palace_examination_desc:0 "O exame do palácio começa. É quando os estudiosos mais destacados se provam perante o Imperador."
 imperial_examination_phase_preparation:0 "Preparação"
 imperial_examination_phase_preparation_desc:0 "Os candidatos, assim como o anfitrião, aguardam, correndo para realizar as preparações possíveis para os exames."
 local_examination_conclusion.entrant_passed:0 "\n\nPassei no Exame Provincial hoje, e minha família pode se orgulhar das minhas realizações."
 no_available_family_candidates:0 "Nenhum candidato da família ou discípulo disponível"
 take_exam_tooltip:0 "#alert_trial Para deixar de ser governador, selecione a [GetDecision('renounce_governorship_decision').GetName] [decision|E]#!"
