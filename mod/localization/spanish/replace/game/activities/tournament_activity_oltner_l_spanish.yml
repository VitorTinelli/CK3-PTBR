l_spanish:
 a_rock:0 "uma pedra"
 a_stick_simple:0 "um graveto"
 an_empty_cup:0 "uma xícara vazia"
 as_bright_as_a_rain_cloud:0 "tão brilhante quanto uma nuvem de chuva"
 as_fast_as_a_mountain:0 "tão rápido quanto uma montanha"
 as_thick_as_you:0 "tão grosso quanto você"
 available_because_of_intent:0 "Esta opção está disponível por causa da sua [intent|E]"
 barely_a_fledgeling:0 "mal um filhote"
 cheery_disposition_modifier:0 "Disposição Alegre"
 cheery_disposition_modifier_desc:0 "Esse personagem é animado e convidativo."
 graceful_as_a_goose:0 "gracioso como um ganso"
 grim_disposition_modifier:0 "Disposição Sombria"
 grim_disposition_modifier_desc:0 "Esse personagem é sério e determinado."
 heavy_as_a_stone:0 "pesado como uma pedra"
 lifestyle_experience_increased:0 "Experiência de Estilo de Vida Aumentada"
 round_as_an_egg:0 "redondo como um ovo"
 shaped_like_a_brick:0 "com formato de tijolo"
 they_share_some_tricks:0 "Eles compartilham alguns truques"
 tournament_events.9000.a:0 "Ah, que relaxante!"
 tournament_events.9000.b:0 "Um lugar perfeito para treinar em paz."
 tournament_events.9000.desc:0 "Passeando pelas redondezas do torneio, sou envolvido pela pura beleza que me cerca aqui em [tournament_province.GetName].\n\nCaminho por [tournament_province.Custom('TerrainTypeProvince')] salpicado de manchas de [tournament_province.Custom('get_region_flower_type_plural')], decidindo parar apenas para tocar a casca de uma árvore impecável de [tournament_province.Custom('GetRandomAppropriateTree')]. Olho para cima e vejo um grupo de [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')]s voando sobre mim.\n\n"
 tournament_events.9000.desc_home:0 "Deveria fazer isso com mais frequência, afinal, este é meu lar."
 tournament_events.9000.desc_not_home:0 "Espero ter a oportunidade de retornar no futuro."
 tournament_events.9000.impatient:0 "Bobagem sentimental! #EMP Preciso me exercitar!#!"
 tournament_events.9000.t:0 "Os Encantos de [tournament_province.GetNameNoTooltip]"
 tournament_events.9001.a:0 "\"Você pode se juntar aos meus $knight_culture_player_plural_no_tooltip_lowercase$.\""
 tournament_events.9001.b:0 "\"Vou recompensá-lo generosamente se você prestar juramento de fidelidade a mim!\""
 tournament_events.9001.c:0 "\"Vá embora, mal confio em você.\""
 tournament_events.9001.d:0 "\"Tenho muito a aprender com você!\""
 tournament_events.9001.desc:0 "Enquanto estou explorando os terrenos, uma figura bem-armada se aproxima de mim.\n\n\"[ROOT.Char.GetTitledFirstName], é uma honra.\" [Select_CString( liegeless_knight.IsFemale, 'A', 'O' )] [liegeless_knight.GetWomanMan] se curva brevemente e [liegeless_knight.Custom('quirk_pos_present')]. \"Eu sou [liegeless_knight.GetFullName], um $knight_culture_player_no_tooltip_lowercase$ em busca de emprego. Sou um[Select_CString( liegeless_knight.IsFemale, 'a', '' )] [liegeless_knight.Custom('FormalComplimentAdjective')], [liegeless_knight.Custom('ComplimentAdjective')], leal, e minha casa é forte — #EMP [liegeless_knight.GetHouse.GetMotto]!#!\" [liegeless_knight.GetSheHe] grita e fica em posição de sentido.\n\nÉ óbvio que essa nobreza menor está exagerando em suas virtudes, mas [liegeless_knight.GetSheHe] parece competente. E desesperad[Select_CString( liegeless_knight.IsFemale, 'a', 'o' )]."
 tournament_events.9001.t:0 "Um Cavaleiro $knight_culture_player_no_tooltip$ Sem Senhor"
 tournament_events.9002.a:0 "Uau! Como é empolgante!"
 tournament_events.9002.b.failure:0 "Você não consegue aprender nada"
 tournament_events.9002.b.success:0 "Você se inspira nos lutadores"
 tournament_events.9002.b:0 "Hmm, devo estudar suas técnicas..."
 tournament_events.9002.c:0 "Você, o vencedor — aqui estão algumas moedas!"
 tournament_events.9002.desc:0 "Ouvindo ruídos animados, descubro uma arena improvisada montada pelos camponeses locais, onde dois lutadores robustos estão fazendo um show. Eles trocam golpes, tecem, desviam e circulam um ao redor do outro — até que um deles faz um movimento audacioso:\n\n\"Eu chamo este de #EMP [strongman_1.Custom('GetDescriptorManeuver')] [strongman_1.Custom('GetManeuver')]!#!\" [strongman_1.GetSheHe] grita antes de levantar seu oponente e lançá-lo ao chão — fazendo com que [strongman_2.GetSheHe] se renda imediatamente. \"[strongman_1.GetFirstName] [Select_CString( strongman_1.IsFemale, 'a', 'o' )] [strongman_1.Custom('ComplimentAdjective')|U] e [strongman_1.Custom('RandomPositiveLookAdjective')|U], vitorioso mais uma vez!\" o vencedor se gaba."
 tournament_events.9002.t:0 "Um Show de Força"
 tournament_events.9002.whole_of_body:0 "É tão relaxante assistir às técnicas profissionais!"
 tournament_events.9003.a:0 "Passamos um pelo outro em silêncio."
 tournament_events.9003.b:0 "Um lugar perfeito para treinar em paz."
 tournament_events.9003.desc:0 "Procurando refúgio do burburinho e do barulho dos terrenos do torneio, tropeço em um pequeno caminho escondido entre algumas árvores de [tournament_province.Custom('GetRandomRegionalWood')]. Vagando pela [tournament_province.Custom('GetProvinceFoliageDesc')], avisto cama após cama de belas [tournament_province.Custom('get_region_flower_type_plural')].\n\n"
 tournament_events.9003.friend:0 "De repente, avisto [Select_CString( intent_target_character.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('intent_target_character'))] [intent_target_character.GetFirstName] se aproximando na direção oposta, a sorte sorri para mim! Eu queria encontrar [intent_target_character.GetSheHe] sozinh[Select_CString( intent_target_character.IsFemale, 'a', 'o' )], talvez eu possa puxar assunto?"
 tournament_events.9003.friend_attempt.critical_success:0 "[intent_target_character.GetSheHe|U] gosta muito da sua companhia"
 tournament_events.9003.friend_attempt.failure:0 "[intent_target_character.GetSheHe|U] se afasta silenciosamente..."
 tournament_events.9003.friend_attempt.success:0 "[intent_target_character.GetSheHe|U] está entretid[Select_CString( intent_target_character.IsFemale, 'a', 'o' )] com a conversa"
 tournament_events.9003.friend_attempt:0 "\"É chato andar sozinho, vamos conversar sobre [intent_target_character.Custom('MatchingConversationSubject')]?\""
 tournament_events.9003.lover:0 "Enquanto levanto os olhos da minha solidão, avisto a flor mais bonita de todas. [Select_CString( intent_target_character.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('intent_target_character'))] [intent_target_character.GetFirstName], o objeto dos meus sonhos, encontrou o mesmo caminho que eu!"
 tournament_events.9003.lover_attempt.critical_success:0 "[intent_target_character.GetSheHe|U] se apaixona perdidamente por você"
 tournament_events.9003.lover_attempt.fail:0 "[intent_target_character.GetSheHe|U] está completamente confus[Select_CString( intent_target_character.IsFemale, 'a', 'o' )]"
 tournament_events.9003.lover_attempt.minor_success:0 "[intent_target_character.GetSheHe|U] acha o gesto fofo"
 tournament_events.9003.lover_attempt.success:0 "[intent_target_character.GetSheHe|U] acha o gesto muito romântico"
 tournament_events.9003.lover_attempt:0 "\"Você é mais bonit[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] do que qualquer uma dessas flores.\""
 tournament_events.9003.t:0 "Um Passeio Fortuito"
 tournament_events.9004.a:0 "Isso é um excelente entretenimento!"
 tournament_events.9004.b:0 "Hm, deve exigir muita preparação para fazer isso."
 tournament_events.9004.c.failure:0 "Você perde a aposta"
 tournament_events.9004.c.success:0 "Você ganha a aposta"
 tournament_events.9004.c:0 "Dobro ou nada, vamos de novo!"
 tournament_events.9004.d:0 "Não tenho tempo para isso."
 tournament_events.9004.desc:0 "\"Vai, #EMP [falconer_1.Custom('GetBirdName')|U]#!, vá mais rápido!\" Ouço a voz de um[Select_CString( falconer_1.IsFemale, 'a', '' )] [falconer_1.GetWomanMan] ecoar pelos terrenos. Olho para cima e vejo uma pequena criatura voando pelo céu como um pequeno raio negro. Logo ela mergulha em direção a uma linha de chegada.\n\n\"Bah, você deve ter trapaceado! Seu pássaro não pode voar tão rápido, olhe só para ela — ela é [falconer_1.Custom('GetBirdInsult')]!\" o perdedor irritado grita, enquanto o vencedor exibe um sorriso de satisfação."
 tournament_events.9004.hunter:0 "Eu poderia aprender algumas coisas com isso..."
 tournament_events.9004.t:0 "Entretenimento Alado"
 tournament_events.9005.a:0 "Eles estão agitados... mas eu realmente #EMP preciso disso#! $knight_culture_player_plural_no_tooltip_lowercase$..."
 tournament_events.9005.b:0 "Vocês se importam se eu me juntar a vocês para tomar uma xícara de [tournament_host.Custom('RegionalDrink')]?"
 tournament_events.9005.c:0 "Eles estão completamente bêbados... deve ser fácil provocá-los!"
 tournament_events.9005.d:0 "Nojento."
 tournament_events.9005.desc:0 "Comida e bebida são abundantes durante o torneio, para deleite dos participantes. Três camponeses em particular parecem estar compartilhando o que parece ser um barril inteiro de [tournament_host.Custom('RegionalDrink')].\n\n\"Ahwi... ahwigetcha' para 'disso, [Select_CString( peasant_2.IsFemale, 'sua', 'seu' )] [peasant_2.Custom2('InsultNoun', SCOPE.sC('peasant_1'))]!\" um deles balbucia embriagado, jogando fracamente [peasant_1.Custom('ThrowableObjectArticle')] no vizinho.\n\n\"[peasant_1.GetFirstName], ahmas... ah me desculpa! [peasant_1.Custom('GetLaughType')]\" a vítima cobre o rosto, desviando o ataque. \"Me ajude, [peasant_3.GetFirstName]! #EMP hic#!\"\n\n\"Você está por conta própria, [peasant_2.GetName]!\" o último exclama, virando um copo inteiro em um único gole."
 tournament_events.9005.t:0 "Festa Barulhenta"
 tournament_events.9006.a:0 "Isso vai me ajudar na próxima competição!"
 tournament_events.9006.b:0 "Acho que aprendi algo com isso."
 tournament_events.9006.death:0 "\"O verdadeiro sucesso nasce de uma mente focada.\" [memory_holder.GetSheHe|U] [memory_holder.Custom('quirk_pos_present')]. \"Suprima as memórias que te distraem e use as fraquezas do seu oponente contra ele. Deixe-me contar a história de quando [story_memory.GetDescription]...\""
 tournament_events.9006.desc:0 "Uma pequena multidão se reuniu ao redor de um[Select_CString( memory_holder.IsFemale, 'a', '' )] [memory_holder.GetTitledFirstName] que está falando apaixonadamente, eles parecem estar ouvindo atentamente.\n\n"
 tournament_events.9006.desc_end:0 "\n\nQuase meia hora se passa, mas parece apenas alguns segundos — [memory_holder.GetSheHe] realmente sabe contar uma história!"
 tournament_events.9006.family:0 "\"A glória pessoal é uma coisa, mas a verdadeira glória está em outro lugar.\" [memory_holder.GetSheHe|U] [memory_holder.Custom('quirk_pos_present')]. \"Sua família é sua força — sem eles você não é nada! Isso me lembra da época em que [story_memory.GetDescription]...\""
 tournament_events.9006.impatient:0 "Que desperdício de teeeempo!"
 tournament_events.9006.martial:0 "\"A força do braço é importante, mas mais importante ainda é a força da #EMP mente#!\" [memory_holder.GetSheHe|U] [memory_holder.Custom('quirk_pos_present')]. \"Tornar-se um tático habilidoso envolve ouvir os fracassos e sucessos dos outros, o que me leva à época em que [story_memory.GetDescription]...\""
 tournament_events.9006.relationships:0 "\"Sua própria habilidade só te levará até certo ponto em um torneio.\" [memory_holder.GetSheHe|U] [memory_holder.Custom('quirk_pos_present')]. \"São aqueles que te apoiam, ou não te apoiam, que decidem seu destino — deixe-me contar a você sobre quando [story_memory.GetDescription]...\""
 tournament_events.9006.shy:0 "Eu gostaria de poder falar em público assim..."
 tournament_events.9006.t:0 "Contos do Torneio"
 tournament_events.9006.travel:0 "\"A jornada é tão importante quanto o destino, sempre arrisque!\" [memory_holder.GetSheHe|U] [memory_holder.Custom('quirk_pos_present')]. \"Eu nunca teria chegado tão longe sem aproveitar todas as oportunidades no caminho — por exemplo, quando [story_memory.GetDescription]...\""
 tournament_events.9006.war:0 "\"Como consegui tudo isso impressionante, você pergunta?\" [memory_holder.GetSheHe|U] [memory_holder.Custom('quirk_pos_present')]. \"Eu lutei em guerras e liderei exércitos contra inimigos poderosos — deixe-me contar a você sobre quando [story_memory.GetDescription]...\""
 tournament_events.9007.a:0 "Eu me sinto imparável!"
 tournament_events.9007.ambitious:0 "Silêncio, [hype_knight.Custom('RaunchyComplimentNoun')] — eu já sei disso!"
 tournament_events.9007.b:0 "Eu não seria nada sem meus gloriosos apoiadores!"
 tournament_events.9007.c:0 "Agradeço a [ROOT.Char.GetFaith.HighGodName] por minha futura vitória."
 tournament_events.9007.desc:0 "\"Você vai vencer isso!\" [Select_CString( hype_knight.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hype_knight'))] [hype_knight.GetFirstName] exclama. \"Será fácil, como quando [hype_memory.GetSecondPerspectiveDescription] — você é muito [ROOT.Char.Custom('FormalComplimentAdjective')] e [ROOT.Char.Custom('ComplimentAdjective')] para falhar!\"\n\nÉ bom saber que meus $knight_culture_player_plural_no_tooltip_lowercase$ estão me apoiando!"
 tournament_events.9007.t:0 "Fanfarra de Cavaleiros"
 tournament_events.9008.a:0 "Nada de histórias chatas — quero te ver malabarizar!"
 tournament_events.9008.b:0 "Me conte o conto alegre!"
 tournament_events.9008.c:0 "A história sombria vai criar o clima certo."
 tournament_events.9008.desc:0 "\"Venham todos, venham ver o [tournament_fool.Custom2('DescriptorPositive', SCOPE.sC('tournament_fool') )|U] de [tournament_fool.GetFirstName]!\" Um[Select_CString( tournament_fool.IsFemale, 'a', '' )] [tournament_fool.GetWomanMan] vestid[Select_CString( tournament_fool.IsFemale, 'a', 'o' )] com cores vibrantes grita, equilibrando precariamente um [tournament_fool.Custom('GetObjectToBalanceOnNose')] no seu nariz.\n\n\"Eu também conheço histórias! Talvez você queira ouvir algo alegre, como o conto de quando [memory_story.GetThirdPerspectiveDescription]?\" [tournament_fool.GetSheHe|U] diz enquanto fazendo um handstand.\n\n\"Ou talvez [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord] prefira ouvir uma história #EMP sombria#!, como aquela de quando [memory_story_negative.GetThirdPerspectiveDescription]?\""
 tournament_events.9008.schemer:0 "Eu #EMP sei#! que você já ouviu algo mais suculento..."
 tournament_events.9008.t:0 "A Performance de um Bobo"
 wobbly_like_a_duck:0 "instável como um pato"
 you_get_drunk:0 "Você fica bêbad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]"
 you_have_a_good_time:0 "Você se diverte, mas nada mais"
 you_learn_a_little:0 "Você aprende um pouco"
 you_learn_a_lot:0 "Você aprende muito"
