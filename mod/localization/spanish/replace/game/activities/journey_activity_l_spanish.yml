 activity_journey:0 "Expedição Monumental"
 activity_journey_conclusion_desc:0 "A expedição permitiu que você refletisse e aprimorasse suas habilidades como governante."
 activity_journey_desc:0 "Empreenda uma expedição a um monumento ou marco famoso para melhorar a si mesmo, mergulhando na história, conhecimento e mistérios que ali residem."
 activity_journey_destination_selection:0 "Destinos válidos devem ter uma [special_building|E] construída que não seja um local sagrado genérico #weak (como um [GetBuilding('holy_site_cathedral_01').GetName])#! ou uma [GetBuilding('generic_university').GetName] genérica. Cada destino pode ser visitado apenas uma vez.\n\n[intrigue_i|E][diplomacy_i|E][martial_i|E][learning_i|E][stewardship_i|E][skill|E] Aumentos são baseados no tipo de [point_of_interest|E] da [special_building|E] visitada."
 activity_journey_guest_desc:0 ""
 activity_journey_guest_help_text:0 "[activity_guests|E] terão oportunidades para aumentar suas [skills|E]. Especialmente se forem importantes para você, como seu [player_heir|E]."
 activity_journey_host_desc:0 "#indent_newline:8 $BULLET_WITH_TAB$[intrigue_i|E][diplomacy_i|E][martial_i|E][learning_i|E][stewardship_i|E]#V 1#! Ponto de [skill|E] Garantido, #V 1#! Potencial Ponto Extra de [skill|E]\n#weak (As recompensas de Ponto de Habilidade são baseadas na [special_building|E] visitada)#!#!\n$BULLET_WITH_TAB$[aptitude|E] Excelente da [court_position_i][court_positions|E]\n$BULLET_WITH_TAB$[prestige_i|E][prestige|E]\n\n#weak Você trará suas [children|E] e [spouses|E] em sua [entourage|E].#!"
 activity_journey_predicted_cost:0 "O custo de uma [monument_expedition|E] é primariamente influenciado pela distância até a [special_building|E] escolhida."
 activity_journey_province_desc:0 "Você viaja para [ROOT.Province.GetName]"
