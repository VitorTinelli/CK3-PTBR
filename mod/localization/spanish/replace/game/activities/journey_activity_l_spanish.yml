 cats_sleeping_religious_02:0 "em cima dos muitos altares"
 cats_sleeping_religious_03:0 "sobre os venerados túmulos"
 chance_of_food_poisoning:0 "Chance de envenenamento alimentar #weak ([GetTrait('ill').GetName( GetPlayer )])#!: #N [SCOPE.ScriptValue('food_poison_value')|0]%#!"
 choose_on_arrival:0 "#weak #size:14 Decidido na Chegada#!#!"
 chronicler_court_position_job:0 "\"Eu croniclei as lendas da Casa [former_employer.GetHouse.GetName], trabalhei dia e noite, com as mãos manchadas de tinta... Mas assim que o livro ficou pronto, [Select_CString( former_employer.IsFemale, 'minha empregadora', 'meu empregador' )] [former_employer.GetTitledFirstName] teve a audácia de me chamar de #EMP 'redundante'#! e me jogou para a rua sem cerimônia!"
 court_poet_court_position_job:0 "\"Eu costumava criar belas poesias para [Select_CString( former_employer.IsFemale, 'a', 'o' )] [former_employer.GetTitledFirstName], louvando as virtudes e o bom caráter [former_employer.GetHerHim]! Toda a Casa [former_employer.GetHouse.GetName] amava meus versos e prosas, mas à medida que o conteúdo dos cofres foi desaparecendo – também desapareceu o amor deles pela poesia, e agora estou aqui, pobre e sozinho."
 court_tutor_court_position_job:0 "\"Eu costumava educar as crianças da Casa [former_employer.GetHouse.GetName] a serviço d[Select_CString( former_employer.IsFemale, 'a', 'o' )] [former_employer.Custom2('InsultAdjective', SCOPE.sC('local_character'))] d[Select_CString( former_employer.IsFemale, 'a', 'o' )] [former_employer.GetTitledFirstName]. Eu era bom no meu trabalho, ensinando aos jovens sobre [ROOT.Char.Custom('highest_skill_noun')] – mas alas! Meus serviços foram #EMP 'não mais necessários'#! depois que os pequenos cresceram, e agora vivo nas ruas!"
 cupbearer_court_position_job:0 "\"Eu costumava servir bebidas no conselho d[Select_CString( former_employer.IsFemale, 'a', 'o' )] [former_employer.GetTitledFirstName], e me certificava de que nenhum copo jamais ficasse vazio! Um dia fui acusado de envenenar um convidado – mas foi só uma carne estragada no jantar, ele ficou completamente bem no dia seguinte! Claro, isso não impediu que me despojassem de minha dignidade e sustento..."
 defaced_monument_opinion:0 "Monumento Profanado"
 diplomacy_skill_focus_tt:0 "Você ganhará [skill|E] de [diplomacy_i|E][diplomacy|E] na [activity|E]"
 diplomatic_diplomat:0 "Diplomata"
 diplomatic_noble:0 "Nobre"
 diplomatic_scribe:0 "Escriba"
 drill_order_10:0 "Mantenham a posição, imaginem que a terra treme sob a carga de uma cavalaria fantasmagórica!"
 drill_order_11:0 "Desengajem e regroupem, como se o ar que cortam com suas lâminas risse de volta!"
 drill_order_1:0 "Ao meu comando, marchem para frente, firmes como se o próprio chão guiasse seus passos!"
 drill_order_2:0 "Formem fileiras, fiquem ombro a ombro, como se o próprio vento não ousasse passar!"
 drill_order_3:0 "Virem para a esquerda, deixem os ecos dos nossos passos soarem como trovões para assustar os corvos!"
 drill_order_4:0 "Relaxem, soldados, mas que sua vigilância seja como um guardião silencioso, sempre alerta."
 drill_order_5:0 "Levantem seus escudos, como se o céu estivesse lançando flechas ao invés de chuva sobre nós!"
 drill_order_6:0 "Dêem um passo para trás em formação, como se a terra mesma se movesse sob seus pés!"
 drill_order_7:0 "Formem-se, escudos erguidos, é apenas um exercício para ficarem firmes contra inimigos imaginários!"
 drill_order_8:0 "Avancem com lanças preparadas, como se enfrentassem um inimigo em brincadeira, e não em batalha real!"
 drill_order_9:0 "Círculem e se reagrupem, zombem da investida do inimigo, uma dança de guerra sem inimigo à vista!"
 economic_artisan:0 "Artesão"
 economic_caravan_leader:0 "Líder de Caravana"
 economic_merchant:0 "Comerciante"
 economic_trader:0 "Negociante"
 event_song_ancient_wonders_01:0 "À sombra eterna do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], onde a história repousa, antigas histórias permanecem, em um silêncio que preserva."
 event_song_ancient_wonders_02:0 "Contemplando o [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], maravilhas de outrora, contos antigos, sussurros de lendas e tradições."
 event_song_ancient_wonders_03:0 "Eterno como as estrelas, o [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] se ergue, um testemunho do tempo, moldado por mãos antigas."
 event_song_diplomatic_01:0 "Sob o olhar do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], onde alianças são tecidas, palavras moldam o futuro, até o pôr do sol."
 event_song_diplomatic_02:0 "Nos salões eloquentes do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], onde vozes sobem e descem, na dança da diplomacia, uma palavra pode mudar tudo."
 event_song_diplomatic_03:0 "Nos grandiosos tribunais do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], entre sussurros e intrigas, cada gesto conta, no reino de reis e rainhas."
 event_song_economic_01:0 "No coração pulsante do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], onde o comércio prospera, o pulso das transações e acordos, onde a prosperidade chega."
 event_song_economic_02:0 "A canção animada do mercado preenche o ar do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], uma sinfonia de empreendimento, riqueza incomparável."
 event_song_economic_03:0 "Artes e mercadorias abundam nos salões do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], onde as chamadas dos mercadores ressoam, e a fortuna chega."
 event_song_learning_01:0 "Em meio a tomos empoeirados e antigos saberes, o [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] sussurra sabedoria, segredos e muito mais."
 event_song_learning_02:0 "Onde mentes convergem nos salões do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], a busca pelo conhecimento quebra as barreiras da ignorância."
 event_song_learning_03:0 "Sob os arcos do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], estudiosos debatem, desvendando mistérios que o tempo não apagará."
 event_song_martial_01:0 "Entre as sombras do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], onde soldados treinam e trabalham, o clangor do aço ecoa, neste solo consagrado."
 event_song_martial_02:0 "À sombra do poder do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], nossas espadas são erguidas pela justiça, defendendo lar e família até o amanhecer."
 event_song_martial_03:0 "Sob o olhar atento do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], onde bandeiras bravejam com coragem, o eco de juramentos prestados, na arte da antiga guerra."
 event_song_mines_01:0 "Nas profundezas do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], onde tesouros se escondem, mineiros trabalham na escuridão, com o orgulho como guia."
 event_song_mines_02:0 "Sob a terra em [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], picaretas ressoam, perseguindo veios de riqueza, trazendo grande fortuna."
 event_song_mines_03:0 "Nas profundezas do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], onde ecos habitam, esculpimos os segredos da pedra, suas histórias para contar."
 event_song_natural_wonders_01:0 "Oh, a grandeza da natureza, tão vasta e tão ampla, onde águias voam alto, e segredos se escondem. No coração da terra, ou onde as águas fluem, há uma beleza indomada que poucos realmente conhecem."
 event_song_natural_wonders_02:0 "Sob o céu infinito, sobre o solo antigo, onde sussurros do passado no vento se encontram. Entre picos elevados, ou por margens tão límpidas, o espírito da terra canta para aqueles que ouvem."
 event_song_natural_wonders_03:0 "No abraço da natureza, onde os seres selvagens vagueiam, em meio à beleza robusta, encontramos nosso lar. Pela força da montanha, ou pelo lago sereno, em cada folha e pedra, as maravilhas da natureza são vistas."
 event_song_religious_01:0 "Sob as abóbadas do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], onde a fé e o silêncio residem, nos reunimos na luz, nossos espíritos nunca morrem."
 event_song_religious_02:0 "Nos salões de paz sagrada, o [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ergue-se alto, suas torres alcançam o céu, enquanto orações e vozes ecoam."
 event_song_religious_03:0 "Onde os sinos do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] tocam, seus ecos puros e claros, encontramos nossa paz aqui, em adoração, esperança e oração."
 extra_skill_gained_tt:0 "Você ganhou um Ponto Extra de [skill|E] #weak ([activity.MakeScope.Var('skill_chance').GetValue|0]% chance)#!"
 food_prefix_berry:0 "fruta"
 food_prefix_honey:0 "mel"
 food_prefix_salt:0 "sal"
 friend_bonded_by_monument:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUIName] tornaram-se amigos enquanto exploravam [PROVINCE.Custom('GetSpecialBuildingPrefix')][PROVINCE.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] em [PROVINCE.GetName] juntos."
 friend_bonded_by_monument_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] e [CHARACTER.GetShortUIName] tornaram-se amigos enquanto exploravam [PROVINCE.Custom('GetSpecialBuildingPrefix')][PROVINCE.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] em [PROVINCE.GetName] juntos."
 get_lost:0 "Você é assaltado, mas aprende algo"
 grafitti_rock.desc:0 "Esta rocha foi removida do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] e possui uma inscrição que diz: #EMP '[ancient_vandal.GetFullName] esteve aqui, contemple meu nome e saiba que sou [ancient_vandal.Custom('FormalComplimentAdjective')]!'#!"
 grafitti_rock:0 "Rocha Esculpida de [location.GetNameNoTooltip]"
 guide_ancient_wonders_1:0 "Dizem que sussurrar um desejo nas fendas de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ao amanhecer fará com que ele se realize."
 guide_ancient_wonders_2:0 "Uma lenda afirma que as sombras de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ao pôr do sol apontam o caminho para um tesouro enterrado de antigos governantes."
 guide_ancient_wonders_3:0 "Há uma história de que o verdadeiro arquiteto de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] deixou uma sala secreta que guarda a chave para a imortalidade."
 guide_ancient_wonders_4:0 "Uma velha história sugere que dar voltas em [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ao contrário à meia-noite revela a entrada para um submundo oculto."
 guide_ancient_wonders_5:0 "Sussurram que as pedras de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] vibram com feitiços antigos no momento do solstício de inverno, abrindo portais para reinos esquecidos."
 guide_diplomatic_1:0 "Um rumor sussurrado entre os cortesãos é que o verdadeiro poder de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] está em uma câmara secreta onde todos os tratados do mundo são magicamente vinculados e podem ser alterados pelos dignos."
 guide_diplomatic_2:0 "Dizem que um passageiro secreto dentro de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] leva a uma sala que ecoa com os pensamentos dos dignitários visitantes, revelando suas verdadeiras intenções."
 guide_diplomatic_3:0 "A lenda diz que os espelhos no grande salão de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] refletem não apenas aparências, mas a verdadeira natureza da alma, revelando aliados e inimigos."
 guide_diplomatic_4:0 "Uma velha história entre diplomatas é que as estátuas nos jardins de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] sussurram segredos de negociações passadas para aqueles que ouvem atentamente ao anoitecer."
 guide_diplomatic_5:0 "Há uma história de que a fonte no pátio de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] concede eloquência e persuasão àqueles que bebem suas águas sob a lua cheia."
 guide_economic_1:0 "Rumores dizem que a verdadeira riqueza de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] não são seus bens comerciais, mas um cofre oculto sob seus mercados, cheio de riquezas incontáveis."
 guide_economic_2:0 "Lendas contam de um livro secreto dentro de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] que registra as dívidas de reis e imperadores, concedendo poder sobre nações ao seu leitor."
 guide_economic_3:0 "Dizem que o fundador de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] enterrou um mapa dentro de suas paredes que leva a um esconderijo de pedras preciosas."
 guide_economic_4:0 "Há uma história de que um comerciante fantasma vaga pelos corredores de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] à noite, oferecendo trocar segredos pelas almas dos gananciosos."
 guide_economic_5:0 "Sussurros entre os locais sugerem que bater em um certo padrão nas pedras de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] no pátio revela um compartimento secreto com moedas antigas."
 guide_learning_1:0 "Dizem que escondido nas paredes de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] há um livro que só pode ser lido à luz de uma lua cheia."
 guide_learning_2:0 "A lenda diz que uma câmara secreta sob [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] foi um lugar de reunião para uma sociedade de pensadores iluminados, invisível para os iniciados."
 guide_learning_3:0 "Um rumor persiste que a árvore mais antiga do pátio foi plantada exatamente no local onde o fundador de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] teve uma visão de sua futura grandeza."
 guide_learning_4:0 "Sussurros falam de um manuscrito escondido em [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] que pode conceder sabedoria incomparável àqueles que decifrarem seu script antigo."
 guide_learning_5:0 "Dizem que dar três voltas ao redor de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] à meia-noite revela o fantasma de um erudito longínquo, ansioso para compartilhar seu conhecimento."
 guide_martial_1:0 "Há uma lenda de que as paredes de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] contêm uma pedra que sangra quando inimigos se aproximam das fronteiras do reino."
 guide_martial_2:0 "Sussurram que um arsenal secreto de armas invencíveis está escondido sob [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], acessível apenas durante um eclipse lunar."
 guide_martial_3:0 "Soldados antigos contam uma história de um túnel oculto sob [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], usado por um rei antigo para escutar seus inimigos."
 guide_martial_4:0 "Um mito entre os guardas fala de um sentinela fantasma que caminha pelos muros à noite, protegendo [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] de perigos invisíveis."
 guide_martial_5:0 "O folclore diz que os construtores originais gravaram uma maldição nas portas de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] que faria os invasores se voltarem uns contra os outros."
 guide_mines_1:0 "O folclore local afirma que o túnel mais profundo leva ao submundo, onde espíritos guiam os mineiros até as veias mais ricas de minério."
 guide_mines_2:0 "Um conto antigo de mineiro fala de uma veia de ouro tão pura que brilha com sua própria luz, mas apenas os puros de coração podem vê-la."
 guide_mines_3:0 "Lendas sussurram sobre uma câmara secreta cheia da riqueza intocada de reis antigos, selada e guardada por mineiros espectrais."
 guide_mines_4:0 "Dizem que bater três vezes em uma certa rocha sem marca na mina abrirá um passagem para tesouros além da imaginação."
 guide_mines_5:0 "Circulam rumores sobre uma pedra misteriosa que concede visões do futuro, enterrada em algum lugar no labirinto de túneis."
 guide_natural_wonder_1:0 "Os locais acreditam que as águas de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] podem curar qualquer enfermidade se tomados banho sob a primeira luz da aurora."
 guide_natural_wonder_2:0 "Uma lenda entre alpinistas diz que alcançar o pico de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] concede uma visão do destino de alguém, mas apenas para aqueles que ascendem sozinhos e sem olhar para trás."
 guide_natural_wonder_3:0 "Dizem que o eco da sua voz do topo de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] pode levar uma mensagem aos falecidos, trazendo paz aos espíritos inquietos."
 guide_natural_wonder_4:0 "Um antigo mito conta sobre uma caverna secreta dentro de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] que transporta aqueles que entram para um paraíso jamais visto por uma alma viva."
 guide_natural_wonder_5:0 "Sussurram que as flores mais raras que crescem na base de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] florescem apenas uma vez a cada século, e seu cheiro concede sonhos proféticos."
 guide_religious_1:0 "Dizem que as sombras dentro de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] se movem por conta própria, revelando a presença de espíritos divinos aos fiéis."
 guide_religious_2:0 "Uma lenda local afirma que os sinos de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] tocam uma melodia que só é ouvida por aqueles destinados à grandeza na vida após a morte."
 guide_religious_3:0 "Sussurram que uma câmara secreta sob [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] guarda uma relíquia que pode transformar as orações mais devotas em realidade."
 guide_religious_4:0 "A lenda diz que o altar de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] foi miraculosamente esculpido a partir de um único meteorito divino, imbuindo-o com poder celestial."
 guide_religious_5:0 "Uma velha história conta que as janelas de vitrais de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] mudam sua história para refletir o coração de quem as observa."
