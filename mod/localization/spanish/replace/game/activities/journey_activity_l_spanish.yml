 journey_curiosity_intent:0 "Curiosidade"
 journey_curiosity_intent_desc:0 "Há muito a descobrir, não apenas nos próprios monumentos, mas nas pessoas que vivem próximas a eles. Você ganhará mais [cultural_acceptance|E] e [strong_hooks|E] sobre aqueles que recrutar."
 journey_curiosity_intent_idesc2:0 "A vibrante movimentação ao redor do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] promete um mosaico de encontros e aprendizados."
 journey_curiosity_intent_idesc3:0 "A atração de descobrir as facetas desconhecidas do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] pelos olhos de seu povo é estimulante."
 journey_curiosity_intent_idesc:0 "Mal posso esperar para me misturar com as pessoas ao redor do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName], ouvindo suas histórias e testemunhando suas vidas diárias."
 journey_knowledge_hoarding_intent:0 "Acumulação de Conhecimento"
 journey_knowledge_hoarding_intent_desc:0 "Você tem apenas um propósito – reunir o máximo de conhecimento possível. Você pode escolher aumentar sua chance de ganhar um Ponto Extra de [skill|E] em troca de [stress|E]."
 journey_knowledge_hoarding_intent_idesc2:0 "Cada pedra, cada entalhe no [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] sussurra conhecimentos antigos, me chamando para explorar mais a fundo."
 journey_knowledge_hoarding_intent_idesc3:0 "A atração pela sabedoria antiga escondida no [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] é um chamado irresistível para meu coração de estudioso."
 journey_knowledge_hoarding_intent_idesc:0 "A empolgação de desvendar os segredos guardados pelo [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] me enche de uma sede insaciável de conhecimento."
