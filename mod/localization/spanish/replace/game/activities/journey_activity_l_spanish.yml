 cats_sleeping_diplomatic_02:0 "no colo dos diplomatas"
 cats_sleeping_diplomatic_03:0 "nos luxuosos tapetes"
 cats_sleeping_economic_01:0 "entre as barracas movimentadas do mercado"
 cats_sleeping_economic_02:0 "em cima dos barris de mercadorias nos postos comerciais agitados"
 cats_sleeping_economic_03:0 "nos cantos das prósperas casas dos mercadores"
 cats_sleeping_learning_01:0 "em cima das pilhas de manuscritos bem manuseados"
 cats_sleeping_learning_02:0 "no colo dos estudiosos profundamente concentrados"
 cats_sleeping_learning_03:0 "nos parapeitos das janelas banhadas pelo sol"
 cats_sleeping_martial_01:0 "na sombra das ameias"
 cats_sleeping_martial_02:0 "no colo dos guardas atentos"
