 wet_nurse_court_position_job:0 "\"Eu cuidei dos pequeninos da Casa [former_employer.GetHouse.GetName]. Vi-os crescer, alimentei-os, troquei suas roupas, ensinei-os a andar... e eles me amavam! Agora estou perdida e desamparada, pois [Select_CString( former_employer.IsFemale, 'a', 'o' )] implacável e cruel [former_employer.GetTitledFirstName] me chamou de #EMP 'fardo sem utilidade'#! quando as crianças cresceram!"
