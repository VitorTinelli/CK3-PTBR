 spread_legend_intent_idesc2:0 "À sombra do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName], imagino [me_scope.GetPromotedLegend.GetName] ecoando pelas ruas, uma história para impressionar os locais!"
 spread_legend_intent_idesc3:0 "Caminho em direção ao [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName], o cenário perfeito para gravar [me_scope.GetPromotedLegend.GetName] nos anais da história, uma lenda a ser contada pelos locais por gerações."
