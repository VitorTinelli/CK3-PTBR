 bp3_journey.0005.a:0 "Vou buscar aprimorar minhas habilidades diplomáticas!"
 bp3_journey.0005.b:0 "Estratégias, táticas, fortificações – tudo me interessa!"
 bp3_journey.0005.c:0 "Há muito a aprender neste lugar."
 bp3_journey.0005.d:0 "Como eles gerenciam as coisas aqui? Preciso saber."
 bp3_journey.0005.desc:0 "[location.Custom('GetTouristHoldingIntro')] [ROOT.Char.Custom('IntentDesc')]\n\n[location.Custom('GetTouristStartEventOutro')]"
 bp3_journey.0005.e:0 "Me pergunto o que acontece nos bastidores..."
 bp3_journey.0005.t:0 "As Vistas do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
 bp3_journey.0010.a:0 "Nunca devo esquecer o que aprendi aqui."
 bp3_journey.0010.desc:0 "Chegou a hora de arrumar minhas coisas e voltar para casa.\n\nPercorri os terrenos do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] e vi muitas paisagens, fiz anotações e desenhos, e encontrei o local dos [location.GetCulture.GetCollectiveNounNoTooltip]. Não acredito que esquecerei desta jornada tão cedo!\n\nAdeus, [location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] – adeus, [location.Custom('ProvinceCompliment')] [location.GetNameNoTooltip]!"
 bp3_journey.0010.t:0 "Uma Despedida ao [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
 bp3_journey.0015.a:0 "Vou procurar aprimorar minhas habilidades diplomáticas!"
 bp3_journey.0015.b:0 "Estratégias, táticas, obras de engenharia – tudo me interessa!"
 bp3_journey.0015.c:0 "Há muito a aprender neste lugar."
 bp3_journey.0015.d:0 "Como eles administram as coisas aqui? Preciso saber."
 bp3_journey.0015.desc:0 "[ROOT.Char.Custom('MonumentViewIntro')]\n\n[location.Custom('GetSpecialBuildingTouristDescriptor')]"
 bp3_journey.0015.e:0 "Eu me pergunto o que acontece nos bastidores..."
 bp3_journey.0015.friend:0 "Estou tão feliz por poder compartilhar este momento com [Select_CString( potential_friend.IsFemale, 'a', 'o' )] [potential_friend.GetFirstNameNoTooltip]!"
 bp3_journey.0015.journey_curiosity_intent:0 "Vou me misturar com os locais!"
 bp3_journey.0015.knowledge_hoarding:0 "Hora de fazer anotações!"
 bp3_journey.0015.lover:0 "#EMP *Inclinando-se discretamente e beijando [Select_CString( potential_lover.IsFemale, 'a', 'o' )] [potential_lover.GetFirstNameNoTooltip]*#!"
 bp3_journey.0015.prestige:0 "Estou aqui para ser visto!"
 bp3_journey.0015.spread_legend_intent:0 "Pessoas! Vocês já ouviram a lenda de [ROOT.Char.GetPromotedLegend.GetNameNoTooltip]?"
 bp3_journey.0015.t:0 "As Paisagens de [location.GetNameNoTooltip]"
 bp3_journey.1000.a:0 "Vou levar um!"
 bp3_journey.1000.b:0 "Posso aproveitar suas habilidades no [ROOT.Char.Custom('GetCourtType')]."
 bp3_journey.1000.c:0 "Sou um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] #EMP [ROOT.Char.GetTitleAsNameNoTooltip|U]#!, pare de desperdiçar meu tempo!"
 bp3_journey.1000.curiosity:0 "Vocês [local_character.GetCulture.GetNameNoTooltip] artesãos são incríveis! Junte-se a mim!"
 bp3_journey.1000.desc:0 "\"Miniatura do [location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]!\" – a voz do vendedor ecoa pelo mercado.\n\nAo me aproximar, noto que os pequenos ornamentos de argila têm uma qualidade #EMP impressionante#!. Tudo está lá, até o menor detalhe. É honestamente inacreditável.\n\n\"Feitos à mão, [ROOT.Char.Custom('FormOfAddressForLiege')|U]! Gostaria de comprar um?\""
 bp3_journey.1000.knowledge_hoarding:0 "Você precisa me mostrar como os fez."
 bp3_journey.1000.lechery:0 "Aceita... encomendas personalizadas?"
 bp3_journey.1000.t:0 "Venda Arquitetônica"
 bp3_journey.1100.a:0 "Bem, seria uma pena que as pessoas não lembrassem do #EMP meu#! nome!"
 bp3_journey.1100.b:0 "Isso daria uma boa lembrança..."
 bp3_journey.1100.c:0 "Prefiro permanecer anônimo."
 bp3_journey.1100.curiosity:0 "\"[ROOT.Char.GetFirstNameNoTooltip], amig[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] dos [location.GetCulture.GetCollectiveNounNoTooltip], caminhou aqui.\""
 bp3_journey.1100.desc_first:0 "Está intocado, à vista de todos que passam... apenas esperando alguém para eternizar seu nome."
 bp3_journey.1100.desc_intro:0 "Enquanto caminho pelos terrenos, avisto uma marca peculiar em [location.Custom('GetSpecialBuildingSurface')].\n\n"
 bp3_journey.1100.desc_name:0 "Ao me aproximar, leio: #EMP '[ancient_vandal.GetFullName] esteve aqui, contemple meu nome e saiba que sou [ancient_vandal.Custom('FormalComplimentAdjective')]!'#! Hm, se [ancient_vandal.GetSheHe] pode gravar o nome [ancient_vandal.GetHerHim] para que curiosos o admirem por toda a eternidade, então talvez..."
 bp3_journey.1100.desc_outro:0 "\n\nOlho para baixo e vejo uma pedra em forma de cinzel me chamando."
 bp3_journey.1100.knowledge_hoarding:0 "Deve haver sabedoria oculta entre as inscrições!"
 bp3_journey.1100.t:0 "Um Nome, Eterno"
 bp3_journey.1200.a:0 "Um corte de cabelo, por favor!"
 bp3_journey.1200.b:0 "Eu poderia usar esse Barbeiro-Cirurgião no [ROOT.Char.Custom('GetCourtType')]."
 bp3_journey.1200.c:0 "Uma perda de tempo."
 bp3_journey.1200.curiosity:0 "Faça um corte no estilo #EMP '[location.GetNameNoTooltip]'#!, depois se junte a mim!"
 bp3_journey.1200.desc:0 "Em um canto do mercado, vejo um portão com uma placa que diz #EMP '[local_character.GetFirstNameNicknamed] – Barbeir[Select_CString( local_character.IsFemale, 'a', 'o' )] & Cirurgiã[Select_CString( local_character.IsFemale, '', 'o' )]'#!, com uma longa fila de pessoas esperando do lado de fora. Parece ser um lugar #EMP muito#! popular.\n\nAo me aproximar, vejo [Select_CString( local_character.IsFemale, 'a', 'o' )] [local_character.GetWomanMan] cortando cabelos com uma destreza e precisão que nunca vi antes! Emaranhados e fios opacos transformando-se nas madeixas mais brilhantes e sedosas imagináveis."
 bp3_journey.1200.knowledge_hoarding:0 "Como [local_character.GetSheHe] se move com tanta graça?"
 bp3_journey.1200.t:0 "Barba e Cabelo"
 bp3_journey.1300.a:0 "[Select_CString( local_character.IsFemale, 'A boba', 'O bobo' )] é majestos[Select_CString( local_character.IsFemale, 'a', 'o' )], preciso [local_character.GetHerHim]!"
 bp3_journey.1300.b:0 "Essa música deve encher meus aposentos em casa!"
 bp3_journey.1300.c:0 "Delicioso!"
 bp3_journey.1300.curiosity:0 "Por que não se juntam ao meu [ROOT.Char.Custom('GetCourtType')]?"
 bp3_journey.1300.desc:0 "Uma melodia tentadora chega aos meus ouvidos enquanto estou fora do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]. Um músico, brandindo um instrumento local ornamentado, está tocando uma melodia magistral enquanto um bobo colorido – igualmente impressionante em sua performance – canta e dança:\n\n#EMP \"[location.Custom('GetSpecialBuildingSong')]\"#!"
 bp3_journey.1300.knowledge_hoarding:0 "Deve haver um significado mais profundo nesta canção..."
 bp3_journey.1300.spread_legend_intent:0 "Você deveria cantar sobre [ROOT.Char.GetPromotedLegend.GetNameNoTooltip]!"
 bp3_journey.1300.t:0 "Canções do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
 bp3_journey.1400.a:0 "Deixe-me comprar o [newly_created_artifact.GetNameNoTooltip]."
 bp3_journey.1400.b:0 "Você deveria ser meu Mestre de Caça!"
 bp3_journey.1400.c:0 "Essa carne é realmente digna de realeza para mim!"
 bp3_journey.1400.curiosity:0 "Você poderia me ensinar algumas coisas!"
 bp3_journey.1400.desc:0 "Aproximo-me de um[Select_CString( local_character.IsFemale, 'a', '' )] [local_character.GetWomanMan] de aparência bruta, carregando uma impressionante coleção de peles em sua barraca. [local_character.GetSheHe|U] parece um caçador prolífico. 'Tenho [local_character.Custom('GetRandomRegionalSmallGame')], [local_character.Custom('GetRandomRegionalWildDaytimeBird')], [local_character.Custom('GetRegionalDeerType')] – compre suas carnes e peles aqui!' [local_character.GetSheHe] grita.\n\nDe repente, [local_character.GetSheHe] olha diretamente em meus olhos, seu olhar tão penetrante quanto um [local_character.Custom('GetRegionalWolfType')]. 'Ah, um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] #EMP [ROOT.Char.GetTitleAsNameNoTooltip|U]#!, para você tenho a carne mais real de todas: #EMP [ROOT.Char.Custom('RegionalOnlyFerociousAnimal')]#!.'"
 bp3_journey.1400.knowledge_hoarding:0 "Você conhece bem o local, por favor, me mostre."
 bp3_journey.1400.t:0 "Vendendo Carne"
 bp3_journey.1500.a:0 "Preciso que você distribua esmolas por mim em [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]."
 bp3_journey.1500.b:0 "Meus servos nunca são pontuais – por favor, organize meu [ROOT.Char.Custom('GetCourtType')]!"
 bp3_journey.1500.c:0 "Então é assim que eles organizam as coisas por aqui..."
 bp3_journey.1500.curiosity:0 "Vocês são ambos muito [local_character.Custom('ComplimentAdjective')], aceitariam me agraciar com sua presença em meu [ROOT.Char.Custom('GetCourtType')]?"
 bp3_journey.1500.curiosity_2:0 "Dos [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] aos [local_character.GetCulture.GetCollectiveNounNoTooltip] – uma doação de amizade!"
 bp3_journey.1500.desc:0 "Enquanto exploro, ouço uma conversa entre dois locais instruídos. 'Nunca foi tão fácil distribuir esmolas desde que você organizou o terreno. [local_character.GetFaith.HighGodName|U] certamente o abençoará, [local_character_2.GetFirstName]', diz um[Select_CString( local_character.IsFemale, 'a', '' )] [local_character.GetWomanMan].\n\n'Estou honrado, caro [local_character.GetFirstName], mas você é um servo muito amado e [local_character.Custom('ComplimentAdjective')] do divino – estou apenas cumprindo meu dever como zelador do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]', responde o outro."
 bp3_journey.1500.knowledge_hoarding:0 "Se eu doar esmolas, você me mostrará o terreno?"
 bp3_journey.1500.t:0 "Locais Sábios"
 bp3_journey.1600.a:0 "Eles não dariam falta de apenas #EMP um#! gatinho..."
 bp3_journey.1600.b:0 "Saia daqui, pequeno incômodo!"
 bp3_journey.1600.curiosity:0 "Os locais amam seus gatos, então vou alimentar todos eles!"
 bp3_journey.1600.desc:0 "Há gatos #EMP em todos os lugares#! por estas partes – não há um canto, recanto ou fresta sem um gato dormindo! Há até mesmo gatos dormindo [location.Custom('GetSpecialBuildingCatSleepingSpot')] do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]...\n\nDe repente, um gatinho brincalhão se aconchega entre minhas pernas, quase me convidando a seguir para um beco que eu não tinha visto antes. Que curioso."
 bp3_journey.1600.knowledge_hoarding:0 "Que segredos aguardam, pequeno amigo?"
 bp3_journey.1600.t:0 "Cidade dos Gatos"
 bp3_journey.1700.b:0 "Hm, eu poderia usar dois novos guarda-costas."
 bp3_journey.1700.c:0 "Oferecerei emprego para toda a guarnição em meu exército."
 bp3_journey.1700.curiosity:0 "Eu poderia fazer uso de vocês três em meu [ROOT.Char.Custom('GetCourtType')]!"
 bp3_journey.1700.d:0 "#EMP *Saúdem os guardas*#!"
 bp3_journey.1700.desc:0 "'[local_character.Custom('GetMilitaryDrillSentence')]', grita o comandante para seus dois vigias. Parece que há uma demonstração militar perto do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]."
 bp3_journey.1700.desc_different_culture:0 "Observar as manobras e táticas desses guardas [location.GetCulture.GetName] me enche de respeito e admiração. Certamente há algo que nós, [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip], podemos aprender com essa demonstração."
 bp3_journey.1700.desc_same_culture:0 "Observar as manobras e táticas dos guardas me enche de respeito e admiração. Certamente há algo que eu posso aprender com essa demonstração."
 bp3_journey.1700.knowledge_hoarding:0 "O comandante #EMP deve#! me ensinar essas táticas!"
 bp3_journey.1700.t:0 "Exercícios de [location.GetCulture.GetNameNoTooltip]"
 bp3_journey.1800.a:0 "Isso é bobagem – me mostre algo real!"
 bp3_journey.1800.b:0 "Pare com suas encenações, posso lhe oferecer mais do que esta vida."
 bp3_journey.1800.c:0 "Vá vender suas mentiras para outra pessoa."
 bp3_journey.1800.curiosity:0 "Mostre-me como a vida é vivida aqui em [location.GetNameNoTooltip] ao invés!"
 bp3_journey.1800.desc:0 "'[location.Custom('GetSpecialBuildingNonsensicalClaim')]' afirma o guia local de aparência duvidosa. 'É a verdade ou meu nome não é [local_character.GetFirstNameNicknamed]!' \n\n'Venha, deixe-me mostrar! Só preciso de uma pequena taxa – é nada para um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip|U] como você!'"
 bp3_journey.1800.knowledge_hoarding:0 "Será que é verdade!? Você deve me mostrar!"
 bp3_journey.1800.spread_legend_intent:0 "Você #EMP já#! ouviu a verdadeira história de [ROOT.Char.GetPromotedLegend.GetNameNoTooltip]?"
 bp3_journey.1800.t:0 "Confie em Mim"
 bp3_journey.1800.trusting:0 "Com certeza, isso soa legítimo!"
 bp3_journey.1900.a:0 "Tome estas moedas e me conte sua história."
 bp3_journey.1900.b:0 "Eu posso te dar mais do que moedas – posso te oferecer um trabalho!"
 bp3_journey.1900.c:0 "Desapareça, mendigo imundo!"
 bp3_journey.1900.curiosity:0 "Pobre alma, junte-se a mim e eu cuidarei de você!"
 bp3_journey.1900.desc:0 "\"Tenha pena d[Select_CString( local_character.IsFemale, 'a', 'o' )] pobre [local_character.GetFirstName], só preciso de algumas moedas!\" [Select_CString( local_character.IsFemale, 'a', 'o' )] [local_character.GetWomanMan] implora com voz trêmula.\n\n[ROOT.Char.Custom('FormerJob')]"
 bp3_journey.1900.knowledge_hoarding:0 "O que você sabe sobre este lugar? Me conte tudo!"
 bp3_journey.1900.t:0 "Pobre [local_character.GetFirstNameNoTooltip]"
 bp3_journey.2000.a:0 "Onde estão esses músicos? Eu gostaria de patrociná-los..."
 bp3_journey.2000.b:0 "Ficarei encantad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] em contar para você!"
 bp3_journey.2000.c:0 "Tenho coisas mais importantes para fazer."
 bp3_journey.2000.desc:0 "\"Saudações, acredito que você seja [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitledFirstName]?\" [Select_CString( new_promoter.IsFemale, 'a', 'o' )] [new_promoter.GetWomanMan] me chama.\n\n\"Eu sou [new_promoter.GetFirstNameNicknamed], [Select_CString( new_promoter.IsFemale, 'a', 'o' )] [new_promoter.GetTitleAsNameNoTooltip|U] de [new_promoter.GetPrimaryTitle.GetBaseNameNoTier], e ouvi a lenda de [ROOT.Char.GetPromotedLegend.GetName]!\" [new_promoter.GetSheHe] continua. \"Alguns músicos perto de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] atraíram uma grande multidão cantando sobre as aventuras de [ROOT.Char.GetPromotedLegend.GetProtagonist.GetShortUINamePossessive], o que despertou meu interesse – você me concederia a honra de recontar essa história com suas próprias palavras?\""
 bp3_journey.2000.t:0 "Uma Lenda Ambulante"
 bp3_journey.2100.a:0 "Uma caneca de [local_character.Custom('RegionalDrink')] e um espetinho de [local_character.Custom('RegionalEdibleMeat')], por favor."
 bp3_journey.2100.b:0 "Você parece ser um excelente provador de alimentos."
 bp3_journey.2100.c:0 "Não, estou aqui para explorar."
 bp3_journey.2100.curiosity:0 "Eu adoro a comida [local_character.GetCulture.GetNameNoTooltip], deixe-me provar tudo!"
 bp3_journey.2100.curiosity_2:0 "Você deveria provar a comida [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetAdjectiveNoTooltip] no meu [ROOT.Char.Custom('GetCourtType')]!"
 bp3_journey.2100.desc:0 "\"Compre sua comida aqui!\" grita o vendedor de rua. \"Tenho espetinhos de [local_character.Custom('RegionalEdibleMeat')] grelhados, tenho [local_character.Custom('GetFoodDetail')]-recheado com [local_character.Custom('GetRandomRegionalSmallGame')], tenho [local_character.Custom('FavoriteTreatDemand')] – e por que não uma caneca de [local_character.Custom('RegionalDrink')] para acompanhar!\n\n\"Na verdade!\" [local_character.GetSheHe] se vira para mim. \"Que tal experimentar minha especialidade [location.GetCounty.GetTitle.GetAdjectiveNoTooltip] de [local_character.Custom('FunFoodPrefix')]-[local_character.Custom('GetLocalStreetFood')]? É muito saudável e tem efeitos mágicos: vai deixar você ainda mais [ROOT.Char.Custom('ComplimentAdjective')]!\""
 bp3_journey.2100.knowledge_hoarding:0 "Efeitos mágicos? Hm, me dê um."
 bp3_journey.2100.t:0 "Uma Especialidade [location.GetCounty.GetTitle.GetAdjectiveNoTooltip]"
 bp3_journey.2200.a:0 "Eu vou dar a [local_character.GetSheHe] uma boa diversão!"
 bp3_journey.2200.a_2:0 "Óleos quentes soam bem..."
 bp3_journey.2200.b:0 "Alguém com seus talentos está sendo desperdiçado aqui."
 bp3_journey.2200.c:0 "Deixe-me em paz, [local_character.Custom2('InsultNounSexual', ROOT.Char)]."
 bp3_journey.2200.curiosity:0 "Você é notável! Abandone esta vida e junte-se a mim."
 bp3_journey.2200.curiosity_2:0 "Que beleza – seja [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )], [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [local_character.Custom('RaunchyComplimentNoun')] [location.GetCounty.GetTitle.GetAdjectiveNoTooltip]!"
 bp3_journey.2200.desc:0 "\"Você deseja companhia, [ROOT.Char.Custom('FormOfAddressForLiege')]?\" um[Select_CString( local_character.IsFemale, 'a', '' )] [local_character.GetWomanMan] sussurra de maneira sedutora, passando um dedo por seu [local_character.Custom('ObjectifiedFeature')]. \"Não importa o seu desejo, tenho certeza de que agradarei –\" [local_character.GetSheHe] continua suavemente.\n\n\"Eu posso relaxar seu corpo com óleos quentes, ou agradar sua mente lendo [SCOPE.Custom('RandomEntertainmentTextName')], ou se seus desejos forem mais... carnais, então posso ser [Select_CString( local_ruler.IsFemale, 'sua', 'seu' )] por esta noite.\""
 bp3_journey.2200.knowledge_hoarding:0 "Eu desejo companhia – na forma de conversa!"
 bp3_journey.2200.spread_legend_intent:0 "Posso ler algo para você: [ROOT.Char.GetPromotedLegend.GetNameNoTooltip]!"
 bp3_journey.2200.t:0 "[Select_CString( local_character.IsFemale, 'A', 'O' )] [local_character.Custom('RaunchyComplimentNoun')|U] de [location.GetCounty.GetTitle.GetNameNoTierNoTooltip]"
 bp3_journey.2300.a:0 "Com a bênção d[Select_CString( local_ruler.IsFemale, 'a', 'o' )] [local_ruler.GetFirstNamePossessiveNoTooltip], eu também poderia comandar [regiment.GetNameNoTooltip]!"
 bp3_journey.2300.b:0 "Um desses [regiment.GetNameNoTooltip] seria um grande campeão."
 bp3_journey.2300.c:0 "Eu deveria ser visto ao lado d[Select_CString( local_ruler.IsFemale, 'a', 'o' )] [local_ruler.GetFirstNameNoTooltip]."
 bp3_journey.2300.curiosity:0 "Você governa os [location.GetCulture.GetCollectiveNounNoTooltip] de maneira admirável!"
 bp3_journey.2300.curiosity_2:0 "Eu ficaria profundamente honrado se pudesse levar um campeão, [local_ruler.GetFirstNameNoTooltip]!"
 bp3_journey.2300.desc:0 "Na entrada de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], avisto uma procissão de [regiment.GetName] fazendo um desfile triunfal para [Select_CString( local_ruler.IsFemale, 'a', 'o' )] [local_ruler.GetLadyLord|U] local, [local_ruler.GetTitledFirstName].\n\n\"Você é o orgulho dessas terras!\" a voz d[Select_CString( local_ruler.IsFemale, 'a', 'o' )] [local_ruler.GetFirstNamePossessiveNoTooltip] ecoa pelo pátio. \"Meus gloriosos guerreiros [location.GetCulture.GetNameNoTooltip] – os [regiment.GetNameNoTooltip] escolhidos d[Select_CString( local_ruler.IsFemale, 'a', 'o' )] [local_ruler.GetFirstNamePossessiveNoTooltip] – e eternos protetores de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]!\""
 bp3_journey.2300.knowledge_hoarding:0 "Vamos conversar sobre esse lugar fascinante, [local_ruler.GetLadyLord|U] [local_ruler.GetFirstNameNoTooltip]."
 bp3_journey.2300.t:0 "[regiment.GetNameNoTooltip] d[Select_CString( local_ruler.IsFemale, 'a', 'o' )] [local_ruler.GetTitledFirstNamePossessiveNoTooltip]"
 bp3_journey.option.spread_legend_intent:0 "Você já ouviu a lenda de [ROOT.Char.GetPromotedLegend.GetNameNoTooltip]?"
 cat_help:0 "O gato guia você até uma interessante tábua de pedra"
