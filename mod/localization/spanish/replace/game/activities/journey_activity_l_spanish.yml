 royal_architect_court_position_job:0 "\"Eu costumava projetar grandes coisas para [Select_CString( former_employer.IsFemale, 'a', 'o' )] [former_employer.GetTitledFirstName], torres, mansões, até castelos! Quando meu último projeto no nome [former_employer.GetHerHim] foi terminado, [former_employer.GetSheHe] roubou a glória e me banhou! Agora vivo na sombra de [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], sonhando com o dia em que poderei construir novamente..."
