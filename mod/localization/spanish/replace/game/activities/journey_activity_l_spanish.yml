 antiquarian_court_position_job:0 "\"Eu cuidava dos artefatos [former_employer.GetPrimaryTitle.GetAdjective] a serviço d[Select_CString( former_employer.IsFemale, 'a', 'o' )] [former_employer.Custom2('InsultAdjective', SCOPE.sC('local_character'))] d[Select_CString( former_employer.IsFemale, 'a', 'o' )] [former_employer.GetTitledFirstName]. Polia urnas e baús, tratava armas e joias com óleos lustrosos, dobrava sedas e lençóis com o maior cuidado – e o que eu recebi em troca? Fui mandado para as ruas! Oh, como eu queria cuidar dessas relíquias novamente..."
