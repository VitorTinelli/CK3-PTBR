 cats_sleeping_mines_01:0 "nas pedras frescas na entrada"
 cats_sleeping_mines_02:0 "acomodados nos vagões de mineração"
 cats_sleeping_mines_03:0 "nas saliências rochosas próximas ao poço da mina"
 cats_sleeping_natural_wonders_01:0 "sob a sombra das árvores próximas"
