 coronation_embrace_supporters_desc:0 "Seu regime será construído pelos leais, colaborando para ganhar [prestige|E], formar [relations|E] e enriquecer seus [realms|E].\n#EMP #low Esta [intent|E] agrada [coronation_supporters|E], especialmente [vassals|E] [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName] e [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName].#!#!"
 coronation_empire_req:0 "[title_tier|E] de [empire|E] ou superior"
 coronation_events.0100.alliances:0 "$GetAllianceOathText$"
 coronation_events.0100.alliances_flavor:0 "Faço um juramento de construir alianças por toda parte."
 coronation_events.0100.buildings:0 "$GetBuildingOathText$"
 coronation_events.0100.buildings_flavor:0 "Faço um juramento de reconstruir o reino."
 coronation_events.0100.children:0 "$GetChildrenOathText$"
 coronation_events.0100.children_flavor:0 "Faço um juramento de fortalecer minha casa com novos membros da família"
 coronation_events.0100.conquest:0 "$GetConquestOathText$"
 coronation_events.0100.conquest_flavor:0 "Faço um juramento de conquistar novas terras para o povo de [ROOT.Char.GetPrimaryTitle.GetNameNoTier]"
 coronation_events.0100.conquest_opinion:0 "$BULLET$Todo [ruler|E] Vizinho [activity_attending|E]"
 coronation_events.0100.desc.first_ruler:0 "Como governarei como [Select_CString( ROOT.Char.IsFemale, 'a primeira', 'o primeiro' )] [ROOT.Char.GetTitleAsNameNoTooltip|l] destas terras?"
 coronation_events.0100.desc.opening:0 "A assembleia me observa. Alguns com esperança, outros com dúvida, todos aguardando que eu fale sobre meu reinado e faça um juramento ao futuro. Posso ouvir as perguntas que eles não pronunciam. Serei justo? Serei equitativo?"
 coronation_events.0100.desc.outro:0 "\n\nNão estou aqui, como [ROOT.Char.GetTitleAsNameNoTooltip|l], para ecoar suas expectativas. Vim para escolher meu próprio caminho, e um rumo para o [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l].\n\nSeja o que [ROOT.Char.GetPrimaryTitle.GetNameNoTier] se tornar — seja o que eu me tornar — começa neste exato momento."
 coronation_events.0100.desc.previous_ruler_close_family:0 "Estarei à altura [Select_CString( previous_ruler.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2( 'RelationToMeShort', previous_ruler )]?"
 coronation_events.0100.desc.previous_ruler_not_family:0 "Superarei [Select_CString( previous_ruler.IsFemale, 'minha predecessora', 'meu predecessor' )], [previous_ruler.GetFullNameNoTooltip]?"
 coronation_events.0100.desc.previous_ruler_not_family_no_house:0 "Superarei [Select_CString( previous_ruler.IsFemale, 'minha predecessora', 'meu predecessor' )], [previous_ruler.GetFirstNameNicknamed]?"
 coronation_events.0100.end_the_struggle:0 "$GetEndTheStruggleOathText$"
 coronation_events.0100.end_the_struggle_flavor:0 "Faço um juramento de pôr fim à Luta."
 coronation_events.0100.greatest_hunter:0 "$GetGreatestHunterOathText$"
 coronation_events.0100.greatest_hunter_flavor:0 "Faço um juramento de me tornar o maior caçador."
 coronation_events.0100.heir_preparation:0 "$GetHeirPreparationOathText$"
 coronation_events.0100.heir_preparation_flavor:0 "Faço um juramento de preparar meu herdeiro para o futuro."
 coronation_events.0100.install_claimants:0 "Instalar Pretendentes"
 coronation_events.0100.install_claimants_flavor:0 "Faço um juramento de levar os legítimos pretendentes a seus tronos e derrubar os usurpadores."
 coronation_events.0100.mend_the_fracture:0 "Consertar a Fratura"
 coronation_events.0100.mend_the_fracture_flavor:0 "Faço um juramento de reparar a fratura cultural no reino e trazer paz à terra."
 coronation_events.0100.opt_out:0 "Não faço nenhum juramento."
 coronation_events.0100.peace:0 "$GetPeaceOathText$"
 coronation_events.0100.peace_flavor:0 "Faço um juramento de garantir a paz para o [ROOT.Char.GetPrimaryTitle.GetTierAsName]."
 coronation_events.0100.provide_for_the_faithful:0 "Prover os Fiéis"
 coronation_events.0100.provide_for_the_faithful_flavor:0 "Faço um juramento de patronato aos fiéis [ROOT.Char.GetPrimaryTitle.GetAdjective]."
 coronation_events.0100.provide_for_the_poor:0 "Prover os Pobres"
 coronation_events.0100.provide_for_the_poor_flavor:0 "Juro minha beneficência aos pobres de [ROOT.Char.GetPrimaryTitle.GetNameNoTier]."
 coronation_events.0100.provide_for_the_warriors:0 "Apoiar Meus [ROOT.Char.Custom('KnightCulturePluralNoTooltip')]"
 coronation_events.0100.provide_for_the_warriors_flavor:0 "Juro minha generosidade aos guerreiros de [ROOT.Char.GetPrimaryTitle.GetNameNoTier]."
 coronation_events.0100.purge_pretenders:0 "$GetPurgePretendersOathText$"
 coronation_events.0100.purge_pretenders_flavor:0 "Faço um juramento de purgar os falsos pretendentes ao trono."
 coronation_events.0100.reconquest:0 "Consolidar o [host.GetPrimaryTitle.GetTierAsNameNoTooltip]"
 coronation_events.0100.reconquest_flavor:0 "Faço um juramento de focar meus esforços em restaurar as terras de [ROOT.Char.GetPrimaryTitle.GetNameNoTier]"
 coronation_events.0100.reconquest_opinion:0 "$BULLET$Todo [ruler|E] Estrangeiro [activity_attending|E] Detentor de um [county|E] em [root_scope.GetPrimaryTitle.GetNameNoTier]"
 coronation_events.0100.repent:0 "$GetRepentOathText$"
 coronation_events.0100.repent_flavor:0 "Faço um juramento de me arrepender dos meus pecados."
 coronation_events.0100.t:0 "Um Juramento para as Eras"
 coronation_events.0100.university:0 "$GetUniversityOathText$"
 coronation_events.0100.university_flavor:0 "Faço um juramento de apoiar um círculo acadêmico no reino."
 coronation_events.0110.desc.diplomacy_oath_1:0 "#emp \"Nenhum reino prospera sozinho. O poder não reside apenas nos exércitos, mas nos laços de confiança, nos pactos forjados com palavra e vontade.\n\nDe [activity.GetHost.GetCapitalLocation.GetName], estenderei a mão da amizade, tecendo alianças que salvaguardarão [activity.GetHost.GetPrimaryTitle.GetNameNoTier] por gerações.\"#!"
 coronation_events.0110.desc.diplomacy_oath_2:0 "#emp \"A força de um reino não está apenas nas alianças conquistadas, mas na silenciosa promessa de continuidade. Ao garantir que [activity.GetHost.GetHouse.GetName] perdure, proporcionarei ao reino uma base tão firme quanto a pedra.\n\nAtravés de nossos filhos, a linha dos [activity.GetHost.GetHouse.GetName] permanecerá inquebrantável, preservando a estabilidade e guiando nosso reino através de tudo que virá.\"#!"
 coronation_events.0110.desc.end_the_struggle_oath:0 "#emp \"A [activity.GetHost.MakeScope.Var('end_the_struggle_oath_type_var').Struggle.GetName] tem drenado lentamente gerações de bons [activity.GetHost.GetCulture.GetCollectiveNoun]. Não mais. Trarei um fim definitivo a esse desperdício inútil de recursos e inaugurarei uma nova era de prosperidade unida na região, assim me ajude [activity.GetHost.GetFaith.HighGodName].\"#!"
 coronation_events.0110.desc.fallback:0 "#emp \"Eu juro, sob meu governo, fortuna a [activity.GetHost.GetPrimaryTitle.GetNameNoTier], deferência aos costumes de seu povo e glória ao [activity.GetHost.GetPrimaryTitle.GetTierAsNameNoTooltip].\"#!"
 coronation_events.0110.desc.fallback_compassionate:0 "#emp \"Eu juro observar todas as leis e costumes justos do povo [activity.GetHost.GetPrimaryTitle.GetAdjective]; governar com sabedoria gentil e julgar com graça misericordiosa.\"#!"
 coronation_events.0110.desc.fallback_feckless:0 "#emp \"Eu... uh... juro os devidos juramentos de [activity.GetHost.GetPrimaryTitle.GetNameNoTierPossessive] [activity.GetHost.GetTierAsName]... doravante farei como os [activity.GetHost.GetFaith.AltPriestTermPlural] exigirem, e responderei quando o reino clamar por seu [activity.GetHost.GetTierAsNameNoTooltip], e assim por diante...\"#!"
 coronation_events.0110.desc.fallback_honorable:0 "#emp \"Eu juro manter a paz e a concórdia dos [activity.GetHost.GetFaith.AltPriestTermPlural] de [activity.GetHost.GetFaith.HighGodNamePossessive] em [activity.GetHost.GetPrimaryTitle.GetNameNoTier], e preservar por minha honra as liberdades e direitos do meu povo.\"#!"
 coronation_events.0110.desc.greatest_hunter_oath:0 "#emp \"A caça não é apenas um teste de habilidade, mas uma celebração da vida e da natureza. Tornar-me-ei o maior caçador, mestre da vida selvagem, o verdadeiro soberano das terras indomadas de [activity.GetHost.GetPrimaryTitle.GetNameNoTier].\"#!"
 coronation_events.0110.desc.heir_preparation_oath:0 "#emp \"Sem um herdeiro adequado, [activity.GetHost.GetDynasty.GetName] está condenado ao esquecimento. Guiar-ei a educação de meu herdeiro, instilando os valores e a sabedoria necessários para elevar os [activity.GetHost.GetDynasty.GetName] a novos patamares.\"#!"
 coronation_events.0110.desc.install_claimants_oath:0 "#emp \"O direito legítimo ao trono não é apenas uma questão de sangue, mas de justiça. Instalarei os legítimos pretendentes em seus tronos, derrubando usurpadores e restaurando a ordem.\"#!"
 coronation_events.0110.desc.intro:0 "[activity.GetHost.GetFirstName] se posiciona diante da multidão, enquanto todos aguardam o juramento de [activity.GetHost.GetHerHim].\n\n"
 coronation_events.0110.desc.learning_oath_1:0 "#emp \"Que nenhum governante confunda ignorância com força. Um reino guiado pela visão perdurará mais do que qualquer um construído apenas sobre o medo.\n\nDe [activity.GetHost.GetCapitalLocation.GetName], reunirei as melhores mentes e, através de seus conselhos, moldarei o futuro de [activity.GetHost.GetPrimaryTitle.GetNameNoTier].\"#!"
 coronation_events.0110.desc.martial_oath_1:0 "#emp \"Hoje me ergo não apenas para governar, mas para construir. Não apenas para preservar o que existe, mas para criar o que pode existir. [activity.GetHost.GetPrimaryTitle.GetNameNoTier] não pode ser confinado à memória ou ao mapa, deve crescer.\n\nPelo nosso futuro e pelo futuro do nosso povo.\"#!"
 coronation_events.0110.desc.martial_oath_2:0 "#emp \"Por muito tempo, terras que pertencem ao [activity.GetHost.GetPrimaryTitle.GetNameNoTier] sofreram sob mãos inferiores. Daquelas que confundiam posse com legitimidade.\n\nIsso termina agora. De [activity.GetHost.GetCapitalLocation.GetName], eles conhecerão o verdadeiro governo. Por mim.\"#!"
 coronation_events.0110.desc.mend_the_fracture_oath:0 "#emp \"A fratura cultural no reino causou conflitos por tempo demais. Unirei os povos sob uma bandeira comum de [activity.GetHost.GetHouse.GetName], preservando, ao mesmo tempo, suas identidades.\"#!"
 coronation_events.0110.desc.outro:0 ""
 coronation_events.0110.desc.provide_for_the_faithful_oath:0 "#emp \"Os fiéis de [activity.GetHost.GetPrimaryTitle.GetNameNoTier] são a espinha dorsal do meu reino. Garantirei que suas necessidades terrenas sejam atendidas, permitindo que se concentrem em servir [ROOT.Char.GetFaith.HighGodName] com devoção, focados na salvação de meu [activity.GetHost.GetPrimaryTitle.GetTierAsNamePossessive].\"#!"
 coronation_events.0110.desc.provide_for_the_poor_oath:0 "#emp \"Os pobres de [activity.GetHost.GetPrimaryTitle.GetNameNoTier] são o sal da terra, a luz do mundo. Trabalham silenciosamente para o benefício de todos. Garantirei que mesmo os mais pobres do meu reino possam viver com dignidade e esperança.\"#!"
 coronation_events.0110.desc.provide_for_the_warriors_oath:0 "#emp \"Os guerreiros de [activity.GetHost.GetPrimaryTitle.GetNameNoTier] são minha espada e escudo. Garantirei que estejam bem equipados e prontos para defender nossas terras.\"#!"
 coronation_events.0110.desc.purge_pretenders_oath:0 "#emp \"Falsos pretendentes ao [activity.GetHost.GetPrimaryTitle.GetName] têm se multiplicado como ratos nos esgotos. E como pragas, todos devem ser exterminados.\"#!"
 coronation_events.0110.desc.repent_oath:0 "#emp \"O que pode mudar a natureza de um[Select_CString( activity.GetHost.IsFemale, 'a', '' )] [activity.GetHost.GetWomanMan]? Minha vontade é suficiente? Posso convencer outros [activity.GetHost.GetFaith.GetAdherentNamePlural], posso convencer [activity.GetHost.GetFaith.HighGodName] de que realmente me arrependo de meus pecados? Talvez seja tolice tentar, mas seria o maior pecado não fazê-lo.\"#!"
 coronation_events.0110.desc.stewardship_oath_1:0 "#emp \"Um governante deve fazer mais do que defender fronteiras, deve tornar a vida dentro delas digna de ser vivida. Guardarei a paz, cuidarei do reino e planejarei não para a guerra, mas para o crescimento.\n\nDe [activity.GetHost.GetCapitalLocation.GetName], guiarei [activity.GetHost.GetPrimaryTitle.GetNameNoTier] através de uma nova era dourada.\"#!"
 coronation_events.0110.desc.stewardship_oath_2:0 "#emp \"Nem todos os legados nascem da guerra. Alguns são forjados em pedra, com suor e propósito. Remodelarei [activity.GetHost.GetPrimaryTitle.GetNameNoTier] com monumentos dignos do futuro.\n\nDe [activity.GetHost.GetCapitalLocation.GetName], levantarei um reino não apenas para durar, mas para entrar em uma era dourada moldada pelo cuidado e pela visão.\"#!"
 coronation_events.0110.no_oath:0 "Palavras de cerimônia, não de história."
 coronation_events.0110.regular:0 "Veremos se [activity.GetHost.GetSheHe] consegue cumprir essas palavras..."
 coronation_events.0110.t:0 "O Juramento"
 coronation_events.0150.a:0 "Um embaraço..."
 coronation_events.0150.a_deceitful:0 "É o que é."
 coronation_events.0150.a_honest:0 "Como poderei viver com essa vergonha?"
 coronation_events.0150.desc:0 "Ouço seus sussurros a portas fechadas. Vejo a decepção estampada em seus olhos. E sinto o peso da vergonha me pressionando.\n\nTodos sabem — eu falhei. Quebrei o juramento que prometi cumprir, uma promessa feita a todos os meus súditos.\n\nComo enfrentá-los agora? Como carregar essa desgraça?"
 coronation_events.0150.desc_deceitful:0 "Que sussurrem. Que olhem com orgulho ferido e decepção vazia. Eu vejo. Sinto seu julgamento como uma lâmina nas minhas costas.\n\nMas vergonha? Não, a vergonha é para aqueles que algum dia pretendiam cumprir suas promessas.\n\nUm juramento é sagrado apenas para tolos."
 coronation_events.0150.desc_honest:0 "O poder veio com a promessa. Estive diante do reino e jurei um juramento em que acreditavam — um juramento #emp em que eu#! acreditava.\n\nAgora o trono parece mais um túmulo do que um assento. Uma jaula fria e dourada que me zomba a cada respiração. E a pior parte é saber que tudo é culpa minha."
 coronation_events.0150.t:0 "Juramento Quebrado: [SCOPE.Custom('GetOathSpecific')|V]"
 coronation_events.0175.a:0 "E um [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] mais forte está pronto para enfrentá-lo!"
 coronation_events.0175.desc:0 "Meu trabalho está concluído, exatamente como prometi. Ouvi o desprezo de meus detratores, sua certeza de que eu falharia quando jurei meu juramento.\n\nMas os provei errados. As vozes de meus duvidosos mudaram, e agora me concedem a honra que antes julgavam além do meu alcance.\n\nUm novo dia se aproxima..."
 coronation_events.0175.t:0 "Juramento Cumprido: [SCOPE.Custom('GetOathSpecific')|V]"
 coronation_events.0200.a:0 "Sejam todos bem-vindos!"
 coronation_events.0200.b:0 "Agora então, quem mais está presente?"
 coronation_events.0200.desc.guest:0 "A reunião é tão grandiosa quanto esperado. Rostos familiares e estrangeiros se misturam, e ouço cumprimentos apenas quentes o suficiente para serem educados. Quando o anfitrião fala, a sala silencia por instinto.\n\n\"Meus amigos, meus vassalos, meus parentes, sua presença me honra mais do que qualquer coroa poderia. Até que a cerimônia comece, comam, bebam, falem à vontade... e saibam que vejo cada um de vocês, e não esquecerei quem esteve aqui comigo hoje.\"\n\nUma promessa gentil, ou um aviso silencioso, dependendo de como se escolhe ouvir."
 coronation_events.0200.desc.host:0 "Os convidados chegaram. De perto, de longe, por lealdade ou curiosidade. A multidão se expande com rostos marcados pela expectativa, cálculo e, em alguns casos, pelo mais leve calor.\n\nElevo minha voz apenas o suficiente para acalmar os presentes e dar-lhes as boas-vindas à minha coroação."
 coronation_events.0200.t:0 "O Prelúdio"
 coronation_events.0205.a:0 "O maior dos momentos se aproxima."
 coronation_events.0205.a_high_magnificence:0 "E minha coroação está #EMP apenas começando!#!"
 coronation_events.0205.a_low_magnificence:0 "[ROOT.Char.GetFaith.HighGodName], guie-me através desta ralé..."
 coronation_events.0205.a_low_magnificence_east_admin:0 "Nem o favor dos vivos, nem o dos mortos..."
 coronation_events.0205.aachen:0 "O lendário palácio de Aquisgrano de Carlos Magno."
 coronation_events.0205.b:0 "Este [ROOT.Char.GetTitleAsNameNoTooltip|l] deve ser um espetáculo horrível..."
 coronation_events.0205.b_flavor_infirm:0 "...mal tendo vida suficiente para ir montado até sua coroação."
 coronation_events.0205.b_improved:0 "Mas, felizmente, poucos notarão em meio a tanto esplendor!"
 coronation_events.0205.c:0 "Sou a própria imagem de um grande [activity.GetHost.GetTitleAsNameNoTooltip|l]!"
 coronation_events.0205.c_low_magnificence:0 "Olhem mais de perto, plebeus! Sou cada centímetro de um [activity.GetHost.GetTitleAsNameNoTooltip|l]."
 coronation_events.0205.c_low_magnificence_east_admin:0 "Aqueles com olhos vivos sabem mais!"
 coronation_events.0205.cheers:0 "\n\nAo som de aplausos e exaltação,"
 coronation_events.0205.d:0 "Agora vemos a verdadeira medida deste [activity.GetHost.GetTitleAsNameNoTooltip]."
 coronation_events.0205.desc.guest:0 "A procissão de [host.GetTitledFirstNamePossessive] parte a multidão, e minha comitiva segue em nosso lugar de honra."
 coronation_events.0205.desc.guest_east_asian:0 "a procissão [ROOT.Char.Custom('GetTitleTierAdjective')] de [host.GetTitledFirstNamePossessive] passa por fileira após fileira de seus [host.Custom('GetFighterTermPlural')] e oficiais. Atrás de nós, deixamos o santuário ancestral de [host.GetTitleAsNameNoTooltip], onde os primeiros ritos do dia foram realizados."
 coronation_events.0205.desc.high_magnificence:0 "Trombetas ressoam! Bandeiras se erguem, em ousadas cores [host.GetPrimaryTitle.GetAdjective]! [host.Custom('GetLocalCommonerTermPlural')|U] louvam o [host.GetTitleAsNameNoTooltip|l], e mulheres choram de êxtase diante deste glorioso desfile."
 coronation_events.0205.desc.high_magnificence_east_asian:0 "\n\nUma reverência maravilhosa elevou os rituais matinais, levada pelo alto incenso perfumado e nascida do orgulho certo dos ancestrais [host.GetDynastyHouseName]."
 coronation_events.0205.desc.host:0 "minha procissão parte a multidão que lota [ROOT.Char.Custom('SettlementCity')|l]: meus melhores [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] avançam à frente, meu lar [ROOT.Char.Custom('GetTitleTierAdjective')] os segue."
 coronation_events.0205.desc.host_east_asian:0 "minha procissão [ROOT.Char.Custom('GetTitleTierAdjective')] passa por fileira após fileira de meus [host.Custom('GetFighterTermPlural')] e oficiais. Atrás de nós, deixamos o santuário ancestral da minha família, onde os primeiros ritos do dia foram realizados."
 coronation_events.0205.desc.low_magnificence:0 "Alguns [host.Custom('GetLocalCommonerTermPlural')] nos encaram sem reação; outros murmuram com desdém. Um grita #EMP \"O falso [host.GetTitleAsName]!\"#! e a multidão avança, contida apenas pelos poucos [host.Custom('GetFighterTermPlural')] alinhados ao caminho."
 coronation_events.0205.desc.low_magnificence_east_asian:0 "\n\nUm mau presságio pairou sobre os rituais. Como os ancestrais [host.GetDynastyHouseName] não ficariam envergonhados por esta ascensão incerta...?"
 coronation_events.0205.desc.medium_magnificence:0 "[host.Custom('GetLocalCommonerTermPlural')|U] se aglomeram para ver o futuro [host.GetTitleAsNameNoTooltip|l]. Sobre os ombros de seus pais, em meio à multidão, crianças de [location.GetCulture.GetName] sorriem."
 coronation_events.0205.desc.medium_magnificence_east_asian:0 "\n\nUm sentimento esperançoso paira no ar. A longa veneração ritual da manhã cumpriu seu papel auspicioso e vinculou esta cerimônia ao passado ancestral."
 coronation_events.0205.e.toast:0 "[host.GetShortUIName] Não Poupa Despesas na Cerimônia"
 coronation_events.0205.e.tt:0 "Um [ROOT.Char.CustomFixedRandom('GetKnightErrantAnimal')] é trazido, vestido em tecido dourado, [ROOT.Char.CustomFixedRandom('GetExpensiveDrink_Singular')] jorra de cada fonte; músicos, sentados diante do pavilhão, cantam sua glória."
 coronation_events.0205.e:0 "O brilho do ouro restaurará o esplendor de hoje."
 coronation_events.0205.e_east_admin:0 "O brilho da moeda restaurará os auspícios do dia!"
 coronation_events.0205.east_admin_description:0 "\n\nCom o rufar de grandes tambores,"
 coronation_events.0205.east_admin_location:0 "a serenidade tranquila do complexo palaciano de [location.GetTitle.GetNameNoTierPossessive]."
 coronation_events.0205.f.failure:0 "Seus esforços foram em vão"
 coronation_events.0205.f.success:0 "O público está maravilhado"
 coronation_events.0205.f.toast:0 "[host.GetShortUIName] Proferiu um Discurso Inspirador"
 coronation_events.0205.f.tt:0 "Você proferiu um discurso verdadeiramente inspirador ao povo."
 coronation_events.0205.f:0 "O povo sabe quem é [Select_CString( ROOT.Char.IsFemale, 'sua', 'seu' )] [ROOT.Char.GetTitleAsNameNoTooltip]."
 coronation_events.0205.f_east_admin:0 "Eu #EMP devo#! me dirigir a esta assembleia."
 coronation_events.0205.great:0 "Todos os preparativos estão completos. A grande assembleia cerimonial agora aguarda em"
 coronation_events.0205.hagia_sophia:0 "a Hagia Sophia, lugar da Santa Sabedoria de Deus."
 coronation_events.0205.meager:0 "Todos os preparativos estão completos. A modesta assembleia cerimonial aguarda em"
 coronation_events.0205.reims:0 "Nossa Senhora de Reims, a catedral dos reis."
 coronation_events.0205.saint_denis:0 "a Basílica de São Dênis, túmulo do santo padroeiro do povo francês."
 coronation_events.0205.silence:0 "\n\nEm silêncio frio,"
 coronation_events.0205.st_peters:0 "a Basílica de São Pedro, lar do principal vigário de Cristo."
 coronation_events.0205.t:0 "A Cerimônia"
 coronation_events.0205.temple:0 "o alto [host.GetFaith.HouseOfWorship] de [location.GetTitle.GetNameNoTierPossessive]."
 coronation_events.0205.wawel:0 "a Catedral de Wawel, bela e duradoura."
 coronation_events.0205.westminster:0 "a graciosa Abadia de Westminster."
 coronation_events.0210.a:0 "Finalmente, comida!"
 coronation_events.0210.b:0 "Finalmente, a cerimônia terminou."
 coronation_events.0210.desc.guest:0 "As formalidades terminaram, e com elas, a quietude que mantinha a reunião em suspenso. Alguns murmúrios surgem quando o anfitrião se levanta novamente, desta vez para marcar o fim da cerimônia e o início de algo mais descontraído.\n\nO [host.GetTitleAsName] eleva sua voz apenas o suficiente para alcançar a todos: \"Meus amigos, os ritos estão completos. Que as mesas sejam abastecidas, que os copos sejam erguidos, e que este salão se lembre da alegria assim como do dever.\"\n\nAs palavras são bem recebidas e, a cada momento que passa, a reunião [ROOT.Char.Custom('GetTitleTierAdjective')] torna-se mais uma celebração animada."
 coronation_events.0210.desc.host:0 "A cerimônia está completa: cada uma das honras [ROOT.Char.Custom('GetTitleTierAdjective')] foi conferida a mim. Ergo-me mais uma vez, não para prometer e comandar, mas para oferecer prazeres suntuosos.\n\n\"Que estas mesas sejam abastecidas. Que os copos sejam erguidos, e que este salão se lembre da alegria assim como do dever.\"\n\nA assembleia, faminta após sua longa vigília sobre os elaborados rituais, murmura em aprovação. Por ora, ao menos, todos têm algo diante de si que não sou eu."
 coronation_events.0210.t:0 "O Banquete"
 coronation_events.0300.a:0 "[chaplain.GetFirstNameNoTooltip] é o único que pode fazer isso."
 coronation_events.0300.b:0 "Talvez [alternative_1.GetFirstNameNoTooltip]?"
 coronation_events.0300.c:0 "Confio em [alternative_2.GetFirstNameNoTooltip]."
 coronation_events.0300.d:0 "É uma honra que só pode recair sobre mim."
 coronation_events.0300.desc:0 "Antes que a coroação possa prosseguir, devo decidir quem presidirá os ritos sagrados. Se desejo garantir o favor dos [ROOT.Char.GetFaith.AltPriestTermPlural|U], seria sábio permitir que um deles supervisionasse a cerimônia, conferindo a santidade e a bênção que só eles podem proporcionar.\n\nAinda assim, uma parte de mim se pergunta: não seria uma história mais grandiosa se eu mesmo levantasse a coroa com minhas próprias mãos, declarando meu direito de governar diante de todos sem intercessão?"
 coronation_events.0300.t:0 "Uma Posição Honrada"
 coronation_events.0301.a.c:0 "Não deixarei que a morte [dead_officiator.GetHerHim] interrompa a cerimônia."
