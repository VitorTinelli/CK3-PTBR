 coronation_events.0310.d:0 "Condenar todas as facções."
 coronation_events.0310.desc.embrace_supporters:0 "Sempre que tive oportunidade, favoreci aqueles mais leais a mim e à minha coroa. Juntos, meus apoiadores e eu planejamos e celebramos, valorizando as credenciais uns dos outros. [first_char.GetName], [second_char.GetName] e os demais se tornaram meu círculo interno.\n\nA confiança deles pode se tornar algo mais substancial."
 coronation_events.0310.desc.exalt_crown:0 "Mantive-me fiel à minha crença de que a glória da coroa é tudo. As provas que enfrentei neste local, as pequenas intrigas — problemas passageiros, mas [ROOT.Char.GetPrimaryTitle.GetNameNoTier] persistirá! Transmiti essa grande crença aos meus convidados, e a fé deles no reino cresceu.\n\nMas a que fim se destina toda essa exaltação?"
 coronation_events.0310.desc.high_magnificence:0 "Trabalhei incansavelmente para promover a glória, para fomentar a grandeza da minha coroação. Os convidados estão imbuídos da inspiração do que presenciaram aqui, irradiando admiração. Foi um início apropriado para meu reinado como [ROOT.Char.GetTitleAsNameNoTooltip|l].\n\n"
 coronation_events.0310.desc.impress_attendees:0 "Do início ao fim, não poupei esforços para impressionar todos os meus convidados — amigos e inimigos! Mas minha presença justa, meu foco absoluto no sucesso desta grande reunião...\n\nPara quê foi tudo isso?"
 coronation_events.0310.desc.low_magnificence:0 "As celebrações estão chegando ao fim. Houve muitos sussurros sobre o caos, a tensão e os serviços apressados. Posso estar agora com calúnias ecoando em meus ouvidos e comida estragada no estômago... mas o que importa é que finalmente sou um verdadeiro [ROOT.Char.GetTitleAsNameNoTooltip|l].\n\n"
 coronation_events.0310.desc.mid_magnificence:0 "Agora sou um verdadeiro [ROOT.Char.GetTitleAsNameNoTooltip|l]. Minha coroação se mostrou digna do meu posto, um belo espetáculo para os convidados, muitos dos quais ainda permanecem na esperança de ouvir algumas últimas palavras [ROOT.Char.Custom('GetTitleTierAdjective')].\n\n"
 coronation_events.0310.desc.weaken_detractors:0 "Detratores impertinentes e [first_char.Custom('InsultAdjective')], [first_char.GetName] e [second_char.GetName] entre eles, tiveram a audácia de comparecer à minha coroação... e eu os recebi com a biliosa [ROOT.Char.Custom('GetTitleTierAdjective')] que merecem! Vieram para explorar minhas fraquezas, mas encontraram apenas desprezo frio e firmeza de ferro.\n\nTalvez eu deva dar um último golpe contundente..."
