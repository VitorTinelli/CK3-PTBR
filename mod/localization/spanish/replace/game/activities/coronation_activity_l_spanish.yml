 coronation_events.0301.a:0 "Santo [ROOT.Char.Custom('GetCatholicSaint')], encomende a alma [dead_officiator.GetHerHim] a [ROOT.Char.GetFaith.PositiveAfterLife]."
 coronation_events.0301.b.tooltip:0 "[second_candidate.GetFirstNameNoTooltip] será o novo oficiante da cerimônia"
 coronation_events.0301.b:0 "[second_candidate.GetTitledFirstNameNoTooltip] está mais próximo de [first_candidate.GetFaith.HighGodName]."
 coronation_events.0301.c.tooltip:0 "#N @warning_icon! Sua [activity|E] de [coronation|E] será cancelada.#!"
 coronation_events.0301.c.tooltip_second:0 "Você poderá realizar um [funeral|E] para [dead_officiator.GetFirstName]."
 coronation_events.0301.c.tooltip_third:0 "Você poderá realizar a [coronation|E] novamente imediatamente após o [funeral|E] [dead_officiator.GetHerHim]."
 coronation_events.0301.c:0 "[dead_officiator.GetSheHe|U] merece meu máximo respeito. Cancele as cerimônias."
 coronation_events.0301.d.tooltip:0 "[first_candidate.GetFirstNameNoTooltip] será o novo oficiante da cerimônia. A morte de [dead_officiator.GetTitledFirstNamePossessive] durante sua coroação é amplamente considerada um mau presságio para seu reinado."
 coronation_events.0301.d:0 "Não deixarei que uma morte impeça #EMP minha#! [coronation|E]."
 coronation_events.0301.desc:0 "O oficiante da minha coroação, meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('dead_officiator'))] [dead_officiator.GetFirstName], [dead_officiator.GetDeathReason]. O assento [dead_officiator.GetHerHim] permanece vazio, e o ritual sagrado não foi cumprido.\n\n[first_candidate.GetFirstName], um respeitado [first_candidate.GetFaith.GetAdherentName] [first_candidate.GetFaith.PriestNeuter], avança. \"[first_candidate.GetFaith.HighGodName] não vacila com a passagem de uma alma\", diz [first_candidate.GetSheHe] solenemente. \"Se desejar, completarei o rito.\""
 coronation_events.0301.e.tooltip:0 "#N @warning_icon! Sua [activity|E] de [coronation|E] será cancelada.#!"
 coronation_events.0301.e.tooltip_second:0 "Você não poderá realizar outra coroação pelos próximos 12 meses."
