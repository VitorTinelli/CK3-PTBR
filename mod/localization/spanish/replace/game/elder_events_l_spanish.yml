l_spanish:
 EVENT_WINDOW_OPTION_AVAILABLE_BODYGUARD:0 "Esta opção está disponível porque você possui um [GetCourtPositionType('bodyguard_court_position').GetName()]"
 EVENT_WINDOW_OPTION_AVAILABLE_TUTOR:0 "Esta opção está disponível porque você possui um [GetCourtPositionType('court_tutor_court_position').GetName()]"
 death_best_sex_of_their_life:0 "sofreu um ataque cardíaco durante a melhor transa da vida [CHARACTER.GetHerHim]"
 elder_events.1000.a:0 "Por favor, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('elder'))] — eu sou [ROOT.Char.GetFirstNameNoTooltip]!"
 elder_events.1000.b:0 "O-oi... sim, também é bom vê-lo..."
 elder_events.1000.desc:0 "\"[confusion_target.GetFirstName], [Select_CString( confusion_target.IsFemale, 'minha querida', 'meu querido' )] [elder.Custom2('RelationToMeShort', SCOPE.sC('confusion_target'))] — que bom vê-l[Select_CString( confusion_target.IsFemale, 'a', 'o' )]!\" [Select_CString( elder.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('elder'))] [elder.GetFirstName] me olha nos olhos, um lampejo de incerteza por trás de seu sorriso. \"Você sempre foi o [confusion_target.Custom('ComplimentAdjective')]. É por isso que mais te amo.\"\n\nEm [GetTrait('withering_mind').GetName( GetNullCharacter )] [elder.GetHerHim], hoje eu sou [Select_CString( confusion_target.IsFemale, 'minha', 'meu' )] [confusion_target.Custom('SisterBrother')]...\n\nAmanhã, talvez eu seja um estranho."
 elder_events.1000.t:0 "Você Me Conhecia"
 elder_events.1100.a:0 "Aaargh!"
 elder_events.1100.bodyguard:0 "Socorro! Salvem-me!"
 elder_events.1100.desc:0 "Tantas vezes subi estas escadas. Então, por que hoje parece escalar as montanhas de [mountain_reference.GetName]?\n\nMinhas pernas tremem. Meus joelhos falham. Não há nada que segure minha queda.\n\nCaio em direção ao fundo."
 elder_events.1100.t:0 "A Escadaria Para..."
 elder_events.1200.a:0 "..."
 elder_events.1200.desc:0 "Ataca sem aviso. O lado esquerdo do meu corpo fica dormente. Tento sorrir, mas meus lábios não se movem.\n\nTento falar. Não consigo.\n\nEventualmente, minha voz retorna. Mas o medo de [ROOT.Char.GetFaith.NegativeAfterLife] permanece."
 elder_events.1200.t:0 "Dormência"
 elder_events.1300.a:0 "Não poderia ter sido tão importante..."
 elder_events.1300.desc:0 "Li estes pergaminhos sobre [ROOT.Char.Custom('education_scroll_subject')]? Eu... não consigo lembrar. Talvez tenha lido?\n\nCertamente faziam parte dos meus estudos, da minha educação...\n\nSim. Minha... educação..."
 elder_events.1300.t:0 "Lições Não Aprendidas"
 elder_events.1300.tutor:0 "Preciso de ajuda para lembrar."
 elder_events.1400.a:0 "Mil cavalos não poderiam me parar!"
 elder_events.1400.b:0 "[ROOT.Char.GetFaith.HighGodName] me salve dest[Select_CString( lover.IsFemale, 'a', 'e' )] [lover.GetWomanMan]."
 elder_events.1400.desc:0 "\"Venha para a cama, meu [ROOT.Char.Custom('RomanticComplimentAdjective')] [ROOT.Char.Custom('RaunchyComplimentNoun')],\" [Select_CString( lover.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('lover'))] [lover.GetFirstName] [lover.Custom('PurrGrowl')], com os olhos ardendo de desejo. \"Você não está nem um pouco curioso sobre o que seu [lover.Custom('GetRaunchyPrefix')] [lover.Custom('RaunchyComplimentNoun')] aprendeu?\"\n\nCom um sorriso malicioso, [lover.GetSheHe] morde o próprio lábio e se deita nos lençóis.\n\n\"Me tome. Agora.\""
 elder_events.1400.t:0 "Uma Boa Queda"
 elder_events.1500.a:0 "Vou dar a [lover.GetSheHe] a transa da vida!"
 elder_events.1500.b:0 "É melhor não."
 elder_events.1500.desc:0 "\"Eles me chamavam de '[lover.Custom('GetRaunchyPrefix')] [lover.Custom('RaunchyComplimentNoun')]',\" suspira [Select_CString( lover.IsFemale, 'minha', 'meu' )] [lover.GetWifeHusband] [lover.GetFirstName], um leve sorriso nos lábios. \"Agora mal consigo subir as escadas sem ficar sem fôlego...\"\n\nCom meu vigor juvenil, posso ajudar [lover.GetSheHe] a lembrar como é ser desejado.\n\nMas... poderia seu [GetTrait('faltering_heart').GetName( GetNullCharacter )] aguentar?"
 elder_events.1500.t:0 "Uma Queda de Morrer Por"
 elder_events.1600.a:0 "Meus dias de corrida acabaram."
 elder_events.1600.b:0 "Eu #EMP devo#! superar a dor."
 elder_events.1600.desc:0 "Corro. Tenho que parar. Já estou sem fôlego.\nCostumava correr voltas em torno do [ROOT.Char.Custom('ResidenceBuilding')]...\n\nComeço de novo. Quase caio. Paro, novamente.\n\nMaldito corpo frágil."
 elder_events.1600.t:0 "Não Dá Para Escapar do Tempo"
