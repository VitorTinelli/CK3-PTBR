 building_konasamudram_mines_04:0 "Complexo de Mineração de Konasamudram"
 building_konasamudram_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_kora_kora_yards_01:0 "Galpões de Canoas"
 building_kora_kora_yards_01_desc:0 "Rampas cobertas para canoas a remo com balancins; as tripulações treinam para incursões costeiras e viagens entre ilhas."
 building_kora_kora_yards_02:0 "Estaleiro de Clã"
 building_kora_kora_yards_02_desc:0 "Depósitos de toras, amarras de fibra e balancins sobressalentes aceleram os reparos; invasores retornam com troféus e bens de troca."
 building_kora_kora_yards_03:0 "Estaleiro Kora-Kora"
 building_kora_kora_yards_03_desc:0 "Cascos maiores, plataformas de combate e tambores de sinalização; patrulhas costeiras e expedições sazonais tornam-se um ritmo de vida (e renda)."
 building_kora_kora_yards_04:0 "Grande Arsenal de Canoas de Guerra"
 building_kora_kora_yards_04_desc:0 "Mestres de estaleiro equipam frotas inteiras; rampas de lançamento, oficinas de aparelhamento e plataformas de reunião inspiram medo nos vizinhos."
 building_krakatoa_01:0 "Krakatoa"
 building_krakatoa_01_desc:0 "Krakatoa é um vulcão imponente situado em um pequeno arquipélago próximo à costa."
 building_kremnica_mines_01:0 "Assentamento de Mineração Kremnica"
 building_kremnica_mines_01_desc:0 "$building_type_kremnica_mines_01_desc$"
 building_kremnica_mines_02:0 "Mina Kremnica"
 building_kremnica_mines_02_desc:0 "$building_rammelsberg_mines_02_desc$"
 building_kremnica_mines_03:0 "Grande Mina Kremnica"
 building_kremnica_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_kremnica_mines_04:0 "Complexo Mineiro Kremnica"
 building_kremnica_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_kutna_hora_mines_01:0 "Assentamento de Mineração Kutná Hora"
 building_kutna_hora_mines_01_desc:0 "$building_rammelsberg_mines_01_desc$"
 building_kutna_hora_mines_02:0 "Mina Kutna Hora"
