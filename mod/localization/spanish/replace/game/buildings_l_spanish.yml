 building_phocaea_mines_02:0 "Mina de Focéia"
 building_phocaea_mines_02_desc:0 "$building_rammelsberg_mines_02_desc$"
 building_phocaea_mines_03:0 "Grande Mina de Focéia"
 building_phocaea_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_phocaea_mines_04:0 "Complexo de Mineração de Focéia"
 building_phocaea_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_plain_of_jars_01:0 "Planície dos Jarros"
 building_plain_of_jars_01_desc:0 "A Planície dos Jarros é um vasto planalto coberto por enormes vasos de pedra, cujo propósito permanece envolto em mistério. Outrora usados em rituais antigos, eles persistem como relíquias de um povo esquecido, inspirando admiração e reverência local."
 building_plantations_01:0 "Pequenas Plantações"
 building_plantations_01_desc:0 "Apesar da falta de água, essas pequenas plantações conseguem produzir frutas particularmente resistentes."
 building_plantations_02:0 "Feitorias"
 building_plantations_02_desc:0 "Nômades resistentes do deserto viajam entre feitorias, levando comida para onde quer que seja mais necessária."
 building_plantations_03:0 "Tecelões"
 building_plantations_03_desc:0 "Tecelões fiam tecidos em suas oficinas, que depois comercializam com os nômades do deserto."
 building_plantations_04:0 "Fontes"
 building_plantations_04_desc:0 "Com água limitada, um novo poço certamente fará a área prosperar. Várias dessas fontes foram descobertas, e poços adequados foram construídos."
 building_plantations_05:0 "Caravançarais"
 building_plantations_05_desc:0 "As caravanas comerciais maiores precisam de um lugar para ficar para que seus animais possam descansar. O caravançarai oferece o espaço de que precisam e também é um excelente local para tributar suas mercadorias."
 building_plantations_06:0 "Bosques de Data"
 building_plantations_06_desc:0 "Com mais terras sendo adequadas para plantações, os bosques de tâmaras estão sendo cultivados. As tâmaras doces duram muito tempo e são um bem valioso para os comerciantes."
 building_plantations_07:0 "Irrigação"
 building_plantations_07_desc:0 "Ao inundar os campos com a água dos poços, eles podem sustentar algo mais do que a agricultura de subsistência pura. Esta é uma grande tarefa, no entanto, fazer o deserto florescer não é fácil."
 building_plantations_08:0 "Grandes Plantações"
 building_plantations_08_desc:0 "Essas plantações agora produzem um excedente definitivo, que pode ser comercializado e vendido com lucro."
 building_pleasure_dome:0 "Cúpula do Prazer"
 building_pleasure_dome_desc:0 "Um palácio mongol que serve tanto como centro militar quanto cultural em igual medida. Sua maior glória é uma fonte em forma de árvore de prata, de onde diferentes tipos de vinho fluem das serpentes que se entrelaçam na estátua."
 building_po_klong_garai_01:0 "Templo Po Klong Garai"
 building_po_klong_garai_01_desc:0 "Um ápice da arquitetura Cham, o templo Po Klong Garai teria sido construído para homenagear o lendário rei de mesmo nome. Possui três torres de tijolos distintas e uma impressionante escultura do deus Shiva como sua principal peça de arte."
 building_powder_magazine_01:0 "Depósito de Pólvora"
 building_powder_magazine_01_desc:0 "Depósitos onde a pólvora pode ser mantida protegida dos elementos, minimizando o risco de acidentes."
 building_powder_magazine_02:0 "Escritório de Logística de Pólvora"
 building_powder_magazine_02_desc:0 "A contratação de oficiais que supervisionem uma força de trabalho dedicada ao manuseio da complexa logística da pólvora garantirá que ela seja armazenada corretamente e transportada pelo reino sem incidentes."
 building_powder_magazine_03:0 "Mina de Enxofre"
 building_powder_magazine_03_desc:0 "O enxofre, às vezes chamado de enxofre-bravo, existe em abundância, mas pode ser difícil de produzir em grandes quantidades. Uma mina dedicada garantirá um suprimento constante desse precioso mineral."
 building_powder_magazine_04:0 "Oficina de Salitre"
 building_powder_magazine_04_desc:0 "Um componente essencial na criação da pólvora, o salitre requer mãos habilidosas em um ambiente controlado para ser produzido em grande quantidade sem incendiar todo o prédio."
 building_powder_magazine_05:0 "Armazéns de Pólvora"
 building_powder_magazine_05_desc:0 "O armazenamento de pólvora exige edifícios dedicados com paredes reforçadas, localizados com segurança longe de áreas habitadas e valiosas."
 building_powder_magazine_06:0 "Guarita"
 building_powder_magazine_06_desc:0 "A pólvora é perigosa por si só, mas pode ser ainda mais se cair em mãos erradas. Um grande número de guardas pode agora ser empregado para manter a pólvora segura de olhares curiosos."
 building_powder_magazine_07:0 "Sala de Refinamento de Pólvora"
 building_powder_magazine_07_desc:0 "Um edifício separado onde os diferentes componentes são combinados para criar pólvora. Caso ocorra um acidente, espera-se que ele não destrua toda a instalação."
 building_powder_magazine_08:0 "Oficina de Canhões de Mão"
 building_powder_magazine_08_desc:0 "Canhões de mão podem ser pouco confiáveis e trincar durante o uso. Devemos, portanto, obter o melhor equipamento possível e contratar os artesãos mais habilidosos disponíveis para produzir armas da mais alta qualidade."
 building_qanats_01:0 "Yakchāl"
 building_qanats_01_desc:0 "Estas casas de gelo em forma de cúpula combinam uma área de armazenamento subterrânea com materiais de construção resistentes ao calor para criar um espaço isolado que funciona como um resfriador por evaporação."
 building_qanats_02:0 "Cisterna"
 building_qanats_02_desc:0 "Chamadas de #italic Ab anbar#! em persa, essas estruturas abobadadas, meio subterrâneas, são usadas para armazenar grandes volumes de água."
 building_qanats_03:0 "Torres de Ventilação"
 building_qanats_03_desc:0 "Uma invenção persa, essas altas torres estão conectadas a cisternas e outros edifícios. Através de aberturas na direção dos ventos predominantes, captam correntes de ar que são então circuladas em seus interiores para fornecer resfriamento."
 building_qanats_04:0 "Kārīz"
 building_qanats_04_desc:0 "O primeiro estágio de um sistema de aquedutos subterrâneos, o kārīz é uma série de poços verticais, conectados por um túnel levemente inclinado, que acessa uma fonte de água subterrânea e a entrega para a superfície."
 building_qanats_05:0 "Pequenos Qanats"
 building_qanats_05_desc:0 "Qanats são aquedutos subterâneos projetados para mitigar a perda de água por evaporação. Embora bastante pequeno nesta fase, este sistema ainda oferece um benefício significativo para a agricultura."
 building_qanats_06:0 "Qanats"
 building_qanats_06_desc:0 "Os aquedutos subterrâneos foram expandidos, conectando-os a cisternas locais, armazéns de gelo e sistemas de irrigação."
 building_qanats_07:0 "Grandes Qanats"
 building_qanats_07_desc:0 "Este amplo sistema de aquedutos subterrâneos se estende por vários #italic parasangs#!, fornecendo um suprimento de água formidável tanto para os agricultores quanto para os moradores das cidades."
 building_qanats_08:0 "Sistema Massivo de Qanats"
 building_qanats_08_desc:0 "Fluindo em inúmeras cisternas subterrâneas, canais de irrigação, casas de gelo, banhos, fontes e poços de água potável, este formidável sistema de aquedutos subterrâneos é um verdadeiro testemunho da engenhosidade e glória persas."
 building_qianling_mausoleum_01:0 "Mausoléu de Qianling"
 building_qianling_mausoleum_01_desc:0 "O Mausoléu de Qianling é principalmente o túmulo do Imperador Gaozong e da Imperatriz Wu Zetian, embora vários outros membros da família Li também estejam enterrados aqui. O monte funerário é protegido por um muro retangular, e as muitas estátuas de pedra que adornam a paisagem são uma das características mais reconhecíveis do mausoléu."
 building_quanzhou_seaport_01:0 "Porto de Quanzhou"
 building_quanzhou_seaport_01_desc:0 "O porto de Quanzhou atrai mercadores estrangeiros de lugares distantes. Comerciantes são conhecidos por vir da Arábia e da Anatólia, do Japão e da Coreia, e de todas as regiões entre eles. Esse fluxo de navios comerciais garante que as indústrias locais prosperem e tornou Quanzhou o principal construtor naval da região."
 building_quarries_01:0 "Pedreiras Simples"
 building_quarries_01_desc:0 "A pedra extraída de fácil acesso fornece materiais de construção para construções próximas."
 building_quarries_02:0 "Minas Rasas de Minério"
 building_quarries_02_desc:0 "Minas simples alinham-se ao pé da montanha, coletando minério de depósitos de minério de superfície facilmente acessíveis."
 building_quarries_03:0 "Moinhos de Água"
 building_quarries_03_desc:0 "Ao encaminhar a água para os locais de mineração, sua energia pode ser aproveitada por moinhos de água para ferramentas elétricas que ajudam na escavação."
 building_quarries_04:0 "Grandes Pedreiras"
 building_quarries_04_desc:0 "À medida que a demanda por materiais de construção aumenta, as pedreiras atraem cada vez mais trabalhadores. As pedreiras estão ficando maiores e mais profundas com o passar do ano."
 building_quarries_05:0 "Grandes Minas"
 building_quarries_05_desc:0 "A necessidade de metais continua crescendo, e novas técnicas não são tudo - a produção deve ser aumentada, e mais minas estão abrindo!"
 building_quarries_06:0 "Pedreiras Maciças"
 building_quarries_06_desc:0 "Em várias minas enormes a céu aberto, os trabalhadores esculpem blocos de pedra em um nível quase industrial. Pedreiras esgotadas se estendem como bocas abertas por toda a província, seu conteúdo agora formando vários castelos e paredes."
 building_quarries_07:0 "Poço de Minas"
 building_quarries_07_desc:0 "Com o advento de novas técnicas, os trabalhadores podem alcançar metais mais profundos, escondidos além da superfície. O mais importante deles é uma nova maneira de drenar poços inundados."
 building_quarries_08:0 "Bombeamento Mecanizado de Água"
 building_quarries_08_desc:0 "Bombas de água de madeira, movidas por um moinho de vento ou cavalos acima, podem remover água dos poços de mineração muito mais rapidamente do que alguns baldes de couro."
 building_rainbow_mountains_01:0 "$building_type_rainbow_mountains_01$"
 building_rainbow_mountains_01_desc:0 "$building_type_rainbow_mountains_01_desc$"
 building_rammelsberg_mines_01:0 "Assentamento de Mineração de Rammelsberg"
 building_rammelsberg_mines_01_desc:0 "Um pequeno assentamento de mineração surgiu perto de onde estão os veios de minério. Os colonizadores começaram a abrir os veios e a extrair o minério, mas até agora estão apenas arranhando a superfície."
 building_rammelsberg_mines_02:0 "Mina Rammelsberg"
 building_rammelsberg_mines_02_desc:0 "Conforme o assentamento cresce, mais e mais minério está sendo extraído. O afluxo de engenheiros competentes permite a construção de uma mina real."
 building_rammelsberg_mines_03:0 "Grande Mina Rammelsberg"
 building_rammelsberg_mines_03_desc:0 "Conforme as operações de mineração crescem, o mesmo acontece com as próprias minas. Mais entradas são construídas e grandes poços são cavados para permitir a extração de minério profundo."
 building_rammelsberg_mines_04:0 "Complexo de Mineração Rammelsberg"
 building_rammelsberg_mines_04_desc:0 "À medida que a produção de minério aumenta, várias fundições e fundições são instaladas ao redor do assentamento. O processamento de metal se tornou uma segunda natureza para os habitantes, e sua habilidade é conhecida em todo o mundo."
 building_ramparts_01:0 "Fortes de Toras"
 building_ramparts_01_desc:0 "Pequenos fortes de madeira fazem parte da floresta, usando árvores como paliçada natural."
 building_ramparts_02:0 "Muralhas de Terra"
 building_ramparts_02_desc:0 "Longas margens de terra formam um limite defensivo ao redor do forte, impedindo os avanços do inimigo."
 building_ramparts_03:0 "Armadilhas e Valas"
 building_ramparts_03_desc:0 "Embora um inimigo possa se sentir seguro ao se aproximar das fortificações, eles logo se verão presos ou empalados nos muitos perigos ocultos pela floresta."
 building_ramparts_04:0 "Paredes de Muralha"
 building_ramparts_04_desc:0 "As paredes de pedra e paliçada agora protegem os fortes dos inimigos que se aproximam, dificultando significativamente qualquer avanço pela floresta."
 building_ramparts_05:0 "Canhoneiras"
 building_ramparts_05_desc:0 "Ao construir canhoneiras nas paredes, podemos facilmente ver e disparar flechas nos inimigos que vêm em nossa direção."
 building_ramparts_06:0 "Trabalhos de campo"
 building_ramparts_06_desc:0 "Ao construir rapidamente terraplenagens onde prevemos que os inimigos passarão, podemos ser mais espertos e flanqueadores enquanto eles tentam se mover pelas florestas."
 building_ramparts_07:0 "Paredes de muralha com ameias"
 building_ramparts_07_desc:0 "Ao melhorar as ameias com ameias, temos uma vantagem clara em qualquer cerco, com os nossos soldados capazes de se mover em relativa segurança e retaliar da mesma forma a qualquer ataque."
 building_ramparts_08:0 "Fortalezas Florestais"
 building_ramparts_08_desc:0 "Essas grandes fortalezas de pedra se destacam como montanhas da floresta, protegendo uma grande faixa de terra."
 building_ratnapura_mines_01:0 "Escavações de Mineração de Ratnapura"
 building_ratnapura_mines_01_desc:0 "$building_type_ratnapura_mines_01_desc$"
 building_ratnapura_mines_02:0 "Mina de Ratnapura"
 building_ratnapura_mines_02_desc:0 "As escavações de mineração foram expandidas, e engenheiros foram contratados para aumentar verdadeiramente a extração de gemas."
 building_ratnapura_mines_03:0 "Grande Mina de Ratnapura"
 building_ratnapura_mines_03_desc:0 "Uma vila surgiu ao redor das muitas escavações de mineração, e os trabalhadores encontram gemas enormes regularmente."
 building_ratnapura_mines_04:0 "Complexo de Mineração de Ratnapura"
 building_ratnapura_mines_04_desc:0 "A extração de gemas atingiu uma escala quase industrial, com a quantidade de trabalhadores agora variando na casa dos milhares. Riquezas aparentemente infinitas fluem das minas."
 building_regimental_grounds_01:0 "Clareira Regimental"
 building_regimental_grounds_01_desc:0 "Grandes extensões de terra são preparadas para a chegada de milícias, proporcionando amplo espaço para barracas e prática."
 building_regimental_grounds_02:0 "Escritórios do Contramestre"
 building_regimental_grounds_02_desc:0 "Os administradores da casa do contramestre garantem que cada soldado recrutado tenha um lugar, um local para dormir e uma arma para apontar para o inimigo."
 building_regimental_grounds_03:0 "Habitação Semi-permanente"
 building_regimental_grounds_03_desc:0 "Barracas de madeira não são muito resistentes, mas mantêm as milícias locais secas e aquecidas — na maioria das vezes."
 building_regimental_grounds_04:0 "Quartel Regimental"
 building_regimental_grounds_04_desc:0 "Quartéis de pedra robustos se alinham nas bordas dos campos de treinamento militar dedicados. Quantidades verdadeiramente impressionantes de milícias podem ser preparadas aqui."
 building_regimental_grounds_05:0 "Celeiros Militares"
 building_regimental_grounds_05_desc:0 "Os celeiros dedicados a alimentar as milícias estão prontos o ano todo, tornando o levantamento de tropas quase sem esforço."
 building_regimental_grounds_06:0 "Ferreiros"
 building_regimental_grounds_06_desc:0 "Várias ferrarias são construídas nos arredores do terreno, apoiando as milícias com armas e reparos."
 building_regimental_grounds_07:0 "Alojamentos de Oficiais"
 building_regimental_grounds_07_desc:0 "Os alojamentos dos oficiais são construídos com padrões mais elevados do que os quartéis regulares, tanto como reconhecimento do valor dos oficiais quanto como um objetivo a que as tropas devem aspirar a alcançar."
 building_regimental_grounds_08:0 "Terrenos Expandidos"
 building_regimental_grounds_08_desc:0 "$building_type_regimental_grounds_01_desc$"
 building_requirements_header:0 "#S Requisitos:#!\n"
 building_rock_of_gibraltar_01:0 "$building_type_rock_of_gibraltar_01$"
 building_rock_of_gibraltar_01_desc:0 "$building_type_rock_of_gibraltar_01_desc$"
 building_roman_wall_of_lugo_01:0 "$building_type_roman_wall_of_lugo_01$"
 building_roman_wall_of_lugo_01_desc:0 "$building_type_roman_wall_of_lugo_01_desc$"
 building_royal_armory_01:0 "Depósitos de armas"
 building_royal_armory_01_desc:0 "Em tempos de guerra, milícias camponesas podem receber uma arma do depósito. São principalmente machados velhos e enferrujados, lanças esfareladas e lâminas cegas, mas com um pouco de manutenção eles podem ser mais eficientes do que as ferramentas agrícolas comuns com as quais as milícias costumam ser armadas."
 building_royal_armory_02:0 "Arsenais de Coroa"
 building_royal_armory_02_desc:0 "Armerias administradas pela coroa coletam e mantêm armas e armaduras para uso em guerras. Estas são de qualidade decente e podem fazer com que qualquer bêbado pareça um soldado de verdade, se não agir como um."
 building_royal_armory_03:0 "Arsenal Real"
 building_royal_armory_03_desc:0 "Um Arsenal Real abriga e mantém uma grande quantidade de armas, o suficiente para mobilizar incontáveis milícias camponesas em curto prazo e atrair os melhores mercenários da região."
 building_royal_forest_01:0 "Florestas Reais"
 building_royal_forest_01_desc:0 "Grandes áreas de floresta neste ducado são reservadas para uso pela família real. Os camponeses estão proibidos de viver na floresta, caçar qualquer um de seus animais ou derrubar árvores para a agricultura. Atacar os assessores de impostos da coroa quando eles estão de passagem é especialmente proibido."
 building_royal_forest_02:0 "Vastas Florestas da Coroa"
 building_royal_forest_02_desc:0 "Cidades inteiras agora são subsumidas por esta floresta real, e assentamentos próximos muitas vezes descobrem que os homens do monarca \"descobriram\" mapas que colocam suas habitações firmemente dentro do bosque da coroa local."
 building_royal_forest_03:0 "Tribunais da Coroa"
 building_royal_forest_03_desc:0 "A lei é tão boa quanto o sistema que a sustenta, e agora esta floresta real tem todo um sistema de tribunais, guardas e escrivães, respaldados por magistrados treinados, todos prontos para fazer cumprir os ditames da coroa."
 building_royal_garden_01:0 "Jardim Fechado"
 building_royal_garden_01_desc:0 "Um pequeno jardim cercado por paredes de pedra. Ele fornece um pequeno refúgio de paz e conforto ao excluir o mundo agitado lá fora."
 building_royal_garden_02:0 "Complexo de Jardins"
 building_royal_garden_02_desc:0 "Um jardim amplo e impressionante que abriga flores, ervas, árvores frutíferas e tudo mais. Mantido por um grande número de jardineiros, o jardim está sob constante cuidado."
 building_royal_garden_03:0 "Parque Real"
 building_royal_garden_03_desc:0 "O parque real é uma paisagem vasta e deslumbrante cuidadosamente criada para se adequar ao terreno e à arquitetura circundante. Aberto e disponível para todos, ele traz admiração aos visitantes de longe."
 building_rudnik_mines_01:0 "Assentamento de Mineração de Rudnik"
 building_rudnik_mines_01_desc:0 "$building_type_rudnik_mines_01_desc$"
 building_rudnik_mines_02:0 "Mina de Rudnik"
 building_rudnik_mines_02_desc:0 "$building_rammelsberg_mines_02_desc$"
 building_rudnik_mines_03:0 "Grande Mina de Rudnik"
 building_rudnik_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_rudnik_mines_04:0 "Complexo de Mineração de Rudnik"
 building_rudnik_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_sacred_pool_01:0 "Lagoa de Lótus"
 building_sacred_pool_01_desc:0 "Uma lagoa harmoniosa, que encanta seus observadores com sua beleza e tranquilidade, sendo considerada o cenário de eventos espirituais significativos."
 building_sacred_pool_02:0 "Reservatório Sagrado"
 building_sacred_pool_02_desc:0 "Com o aumento da escala, este $building_sacred_pool_02$ também atrai vida selvagem ocasional; flora e fauna trabalhando em harmonia para inspirar seus visitantes com o sentido do ciclo da vida."
 building_sacred_pool_03:0 "Bacia"
 building_sacred_pool_03_desc:0 "Um local para cerimônias e rituais ocasionais, este corpo d'água reflete o esplendor crescente de seu governante."
 building_sacred_pool_04:0 "Fosso"
 building_sacred_pool_04_desc:0 "Agora cercando o local de adoração, seus habitantes se sentem mais seguros, pois o $building_type_sacred_pool_01$ oferece alguma fortificação entre eles e possíveis forças hostis."
 building_sacred_pool_05:0 "Pequeno Baray"
 building_sacred_pool_05_desc:0 "Uma coleção de leões guardiões vigia o Baray, fazendo com que qualquer intruso pense duas vezes antes de atravessar suas águas imóveis."
 building_sacred_pool_06:0 "Baray"
 building_sacred_pool_06_desc:0 "O $building_sacred_pool_06$ que se estende de leste a oeste é uma visão magnífica. Estátuas de serpentes ajudam a proteger suas bordas externas."
 building_sacred_pool_07:0 "Grande Baray"
 building_sacred_pool_07_desc:0 "Estátuas, vegetação exuberante e uma paisagem esplêndida marcam este majestoso corpo d'água, trazendo alívio refrescante e hidratação durante períodos de calor extremo."
 building_sacred_pool_08:0 "Baray Sagrado"
 building_sacred_pool_08_desc:0 "Viajantes e outros visitantes que passam frequentemente ficam maravilhados com este corpo d’água artificial — sua largura torna difícil enxergar a borda oposta. Um verdadeiro testemunho da ligação divina deste local."
 building_sado_mines_01:0 "Minas de Ouro de Sado"
 building_sado_mines_01_desc:0 "Antigo local de exílio, poucos imaginavam que a distante ilha de Sado escondia sob sua superfície tamanha riqueza em ouro."
 building_sado_mines_02:0 "Mina de Ouro de Sado"
 building_sado_mines_02_desc:0 "Os poços de mineração foram ampliados e engenheiros foram trazidos para aumentar significativamente a extração de ouro."
 building_sado_mines_03:0 "Grande Mina de Ouro de Sado"
 building_sado_mines_03_desc:0 "Uma vila surgiu ao redor dos muitos poços de mineração, e os trabalhadores encontram novas veias de ouro regularmente."
 building_sado_mines_04:0 "Complexo de Mineração de Ouro de Sado"
 building_sado_mines_04_desc:0 "A extração de ouro atingiu uma escala quase industrial, com o número de trabalhadores chegando aos milhares. Riquezas sem fim parecem fluir das minas."
 building_saint_catherine:0 "Mosteiro de Santa Catarina"
 building_saint_catherine_desc:0 "Um mosteiro modesto no meio do deserto, mas com uma pesada história. A primeira estrutura monástica foi, na verdade, ordenada pela mãe do Imperador Constantino no local da aparição da Sarça Ardente a Moisés. O Imperador Justiniano financiou sua expansão no atual mosteiro fortificado, também cercando o Poço de Moisés. Apenas séculos após sua fundação, os despojos de Santa Catarina chegaram ao mosteiro, mudando seu nome.\nO mosteiro sempre foi um dos mais antigos e prolíficos centros de scriptoria e de produção de ícones."
 building_saint_lazarus:0 "Igreja de São Lázaro"
 building_saint_lazarus_desc:0 "Segundo a tradição, Lázaro de Betânia, uma vez ressuscitado por Cristo, foi enterrado na cidade de Larnaca após sua segunda morte.\nO túmulo foi perdido por séculos, mas, após sua recuperação, o Imperador Leão VI mandou que os restos do santo fossem trasladados para Constantinopla e esta imponente igreja construída em cima do túmulo."
 building_sankore_university:0 "$building_type_sankore_university$"
 building_sankore_university_desc:0 "$building_type_sankore_university_desc$"
 building_schwaz_mines_01:0 "Acordo de Mineração de Schwaz"
 building_schwaz_mines_01_desc:0 "$building_type_schwaz_mines_01_desc$"
 building_schwaz_mines_02:0 "Mina de Schwaz"
 building_schwaz_mines_02_desc:0 "$building_rammelsberg_mines_02_desc$"
 building_schwaz_mines_03:0 "Grande Mina Schwaz"
 building_schwaz_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_schwaz_mines_04:0 "Complexo de Mineração Schwaz"
 building_schwaz_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_scriptorium_01:0 "Bibliotecas"
 building_scriptorium_01_desc:0 "A biblioteca do mosteiro está repleta de livros, que variam de pequenos tratados a vastos tomos de teologia. Verdadeiramente um tesouro de conhecimento é mantido dentro de suas paredes."
 building_scriptorium_02:0 "Salas de Cópia"
 building_scriptorium_02_desc:0 "Escrebas devotados trabalham o dia todo copiando textos sagrados nas salas de cópia. Mesmo à noite, eles trabalham, iluminados apenas por velas e pela lua, tudo em sua busca por conhecimento."
 building_scriptorium_03:0 "Casa de Tradução"
 building_scriptorium_03_desc:0 "Tradutores dedicados se reúnem neste scriptorium para converter obras escritas em línguas antigas ou estrangeiras para a língua litúrgica do templo, expandindo grandemente a acessibilidade de inúmeras obras."
 building_scriptorium_04:0 "Casa dos Escribas"
 building_scriptorium_04_desc:0 "Um grande número de escribas reside aqui para permitir que autores potenciais ditem suas obras, sem a necessidade de registrá-las em papel por suas próprias mãos."
 building_scriptorium_05:0 "Sistema Continental"
 building_scriptorium_05_desc:0 "As obras agora são estritamente organizadas de acordo com o continente de onde se originaram, aumentando grandemente a capacidade de um estudioso de encontrar sabedoria, onde quer que ela tenha vindo."
 building_scriptorium_06:0 "Grandes Arquivos"
 building_scriptorium_06_desc:0 "Obras literárias de todo o mundo são traduzidas e preservadas aqui, para que sua sabedoria seja preservada para toda a eternidade."
 building_scriptorium_07:0 "Escola de Tradução"
 building_scriptorium_07_desc:0 "Os devotos são educados em idiomas antigos e estrangeiros, expandindo a capacidade do Scriptorium de preservar obras de sabedoria e conhecimento."
 building_scriptorium_08:0 "Arquivos Secretos"
 building_scriptorium_08_desc:0 "Este templo é agora lar de uma vasta rede subterrânea de arquivos contendo não apenas as obras deste templo, mas muitas obras que foram recuperadas do exterior."
 building_shah_i_zinda_01:0 "$building_type_shah_i_zinda_01$"
 building_shah_i_zinda_01_desc:0 "$building_type_shah_i_zinda_01_desc$"
 building_shah_i_zinda_02:0 "Necrópole Shah-i-Zinda"
 building_shah_i_zinda_02_desc:0 "Uma vasta necrópole de mausoléus, altos portões e passagens abobadadas revestidas de azulejos turquesa, #italic O Rei Vivo#! é o local de sepultamento do primo do profeta e muitos outros grandes senhores do passado. O complexo está sempre se expandindo e é sublime, sinistro e impressionante na mesma medida."
 building_shaolin_monastery_01:0 "Mosteiro Shaolin"
 building_shaolin_monastery_01_desc:0 "O Mosteiro Shaolin é talvez mais famoso por ser o berço do kung fu Shaolin e por formar monges altamente habilidosos em artes marciais. No entanto, também é um local de aprendizado e estudo, e de tradução de textos budistas."
 building_shigu_academy_01:0 "Academia Shigu"
 building_shigu_academy_01_desc:0 "Esta academia atraiu estudiosos que estudavam os Clássicos nas colinas tranquilas de Hunan. Um centro de poesia e filosofia, manteve vivas as tradições Tang durante a dinastia Song."
 building_shwedagon_pagoda_01:0 "Pagode Shwedagon"
 building_shwedagon_pagoda_01_desc:0 "$building_type_shwedagon_pagoda_01_desc$"
 building_siderokausia_mines_01:0 "Assentamento de Mineração Siderokausia"
 building_siderokausia_mines_01_desc:0 "$building_type_siderokausia_mines_01_desc$"
 building_siderokausia_mines_02:0 "Mina Siderokausia"
 building_siderokausia_mines_02_desc:0 "$building_rammelsberg_mines_02_desc$"
 building_siderokausia_mines_03:0 "Grande Mina Siderokausia"
 building_siderokausia_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_siderokausia_mines_04:0 "Complexo Mineiro Siderokausia"
 building_siderokausia_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_siege_works_01:0 "Oficinas de Cerco"
 building_siege_works_01_desc:0 "Oficinas de cerco fornecem um fluxo mais rápido e constante de armas de cerco através de procedimentos de construção especializados e padronizados."
 building_siege_works_02:0 "Engenheiros de Catapulta"
 building_siege_works_02_desc:0 "Engenheiros especializados são necessários para operar as armas mais avançadas da guerra de cerco: os trabucos."
 building_siege_works_03:0 "Fundições de Canhão"
 building_siege_works_03_desc:0 "Os canhões são as armas mais recentes a surgir na cena da guerra. Altos, pesados e difíceis de manobrar, eles são ainda assim letais contra fortificações de pedra. Ser capaz de produzir e operar canhões nos coloca em vantagem indiscutível contra nossos inimigos."
 building_siena_university:0 "$building_type_siena_university$"
 building_siena_university_desc:0 "$building_type_siena_university_desc$"
 building_smiths_01:0 "Fundição"
 building_smiths_01_desc:0 "Por todo o campo, fumaça sobe das fundições, estruturas simples com paredes feitas de argila resistente ao calor e pedras, onde uma mistura de carvão e minério de ferro triturado é adicionada por cima para fazer ferro esponja."
 building_smiths_02:0 "Foles"
 building_smiths_02_desc:0 "Feitos de pele resistente de animais, os foles são geralmente operados por um aprendiz de ferreiro, bombeando constantemente uma corrente forte de ar para dentro das fornalhas."
 building_smiths_03:0 "Lamina de Tração"
 building_smiths_03_desc:0 "Um dispositivo que auxilia os ferreiros na fabricação de arame para cota de malha. Pedacos de ferro aquecido são puxados através de furos cada vez menores, uma maneira muito mais fácil de trabalhar do que martelar exaustivamente na forja."
 building_smiths_04:0 "Distritos de Ferreiros"
 building_smiths_04_desc:0 "Ferreiros são fortemente encorajados a exercer sua arte fora de áreas densamente povoadas. À medida que inovações na produção de metal permitem que eles trabalhem quase constantemente, a insatisfação da população próxima aumenta a cada batida de martelo e cada fogo rugindo na noite."
 building_smiths_05:0 "Martelos a Vapor"
 building_smiths_05_desc:0 "Movidos por uma roda d'água ou aprendizes azarados, um simples came rotativo levanta o martelo e o deixa cair naturalmente em um ritmo constante."
 building_smiths_06:0 "Ourivesarias"
 building_smiths_06_desc:0 "A adição de salas para fundir e trabalhar ouro e prata, cada uma com suas próprias bancadas e fornalhas especialmente projetadas, torna o trabalho com joias e revestimento com metais preciosos muito mais fácil."
 building_smiths_07:0 "Alto-Fornos"
 building_smiths_07_desc:0 "Altos-fornos funcionam quentes o dia todo, fundindo ferro, chumbo e cobre. A qualidade do metal que produzem é excelente."
 building_smiths_08:0 "Ferro Fundido"
 building_smiths_08_desc:0 "Um pouco mais fraco, mas muito mais barato de produzir do que com outros métodos, o ferro fundido é usado para produzir uma ampla variedade de ferramentas como lâminas de arado, pregos ou grades."
 building_sofia_ohrid:0 "Igreja de Santa Sofia"
 building_sofia_ohrid_desc:0 "A catedral de Ohrid foi primeiro destruída quando os eslavos desceram a essas terras e não foi reconstruída até que a área estivesse novamente sob os braços da fé cristã.\nSua última forma é uma basílica com cúpula ricamente decorada com ciclos de afrescos dos melhores artistas da época."
 building_soltaniyeh_01:0 "$building_type_soltaniyeh_01$"
 building_soltaniyeh_01_desc:0 "$building_type_soltaniyeh_01_desc$"
 building_special_greenhouse_01:0 "Monumento de Vidro"
 building_special_greenhouse_01_desc:0 " Este edifício é aparentemente excelente para o cultivo de vegetais."
 building_special_sicilian_parliament_01:0 "Parlamento"
 building_special_sicilian_parliament_01_desc:0 " Representantes dos Três Estados se reúnem regularmente neste edifício para deliberar sobre os assuntos do reino e aconselhar o governante atual."
 building_spice_plantation_01:0 "Coleta de Especiarias"
 building_spice_plantation_01_desc:0 "As especiarias são produzidas naturalmente por diversas árvores, arbustos e flores. O segredo é #italic encontrar#! essas plantas em primeiro lugar."
 building_spice_plantation_02:0 "Bosques Cultivados de Especiarias"
 building_spice_plantation_02_desc:0 "As especiarias mais procuradas podem ser cultivadas sob as condições certas, com o trabalho adequado e a supervisão apropriada dos encarregados."
 building_spice_plantation_03:0 "Pomares de Especiarias"
 building_spice_plantation_03_desc:0 "Plantar as colheitas em um método geométrico e em larga escala permite produzir uma quantidade mais previsível de especiarias, ano após ano."
 building_spice_plantation_04:0 "Secagem de Especiarias"
 building_spice_plantation_04_desc:0 "Reservar um espaço próximo às plantações para secar as especiarias antes do transporte permite processar mais da colheita antes que estrague, economizando na produção geral."
 building_spice_plantation_05:0 "Moinhos de Especiarias"
 building_spice_plantation_05_desc:0 "Moer as especiarias pode torná-las mais suscetíveis a estragar, mas também torna o armazenamento muito mais eficiente. Os moinhos também auxiliam na separação das impurezas, resultando em uma colheita mais pura."
 building_spice_plantation_06:0 "Propriedades de Especiarias"
 building_spice_plantation_06_desc:0 "Consolidar as moradias dos trabalhadores, o processamento das colheitas e o armazenamento dos produtos em um único local, próximo às plantações, aumenta significativamente a eficiência da produção e reduz os custos."
 building_spice_plantation_07:0 "Gestão de Terras das Plantações"
 building_spice_plantation_07_desc:0 "A própria terra pode ser remodelada para abrir mais espaço para o cultivo. Terraços e canais criam novas oportunidades para aumentar a produção."
 building_spice_plantation_08:0 "Produção Industrial de Especiarias"
 building_spice_plantation_08_desc:0 "Com a orientação adequada, toda a terra pode ser dedicada à produção das especiarias mais lucrativas. Cada árvore plantada, cada arbusto cultivado, cada folha colhida e cada noz seca representa mais uma moeda no cofre."
 building_srebrenica_mines_01:0 "Assentamento de Mineração de Srebrenica"
 building_srebrenica_mines_01_desc:0 "$building_type_srebrenica_mines_01_desc$"
 building_srebrenica_mines_02:0 "Mina de Srebrenica"
 building_srebrenica_mines_02_desc:0 "$building_rammelsberg_mines_02_desc$"
 building_srebrenica_mines_03:0 "Grande Mina de Srebrenica"
 building_srebrenica_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_srebrenica_mines_04:0 "Complexo de Mineração de Srebrenica"
 building_srebrenica_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_stables_01:0 "Estábulos Pequenos"
 building_stables_01_desc:0 "Um prédio pequeno adequado para alguns cavalos é o centro natural de qualquer propriedade, sendo o primeiro e último ponto de parada para qualquer visitante montado."
 building_stables_02:0 "Curral de Cavalos"
 building_stables_02_desc:0 "Um curral ao ar livre permite que os cavalos alojados estiquem as pernas, pastem e desfrutem de ar fresco."
 building_stables_03:0 "Celeiros de Feno"
 building_stables_03_desc:0 "Um conjunto de simples depósitos de feno garante um suprimento constante de alimentos para os cavalos fora do período de pastagem."
 building_stables_04:0 "Estações de Correio"
 building_stables_04_desc:0 "Com cavalos e diligências suficientes espalhados pela região, é possível viajar dia e noite com mensagens importantes, produtos perecíveis e outras necessidades urgentes."
 building_stables_05:0 "Quartos para Tratadores"
 building_stables_05_desc:0 "A adição de alojamentos simples nos quais os trabalhadores podem dormir mantém-os fora dos cercados dos cavalos, tornando a vida mais confortável tanto para o homem quanto para o animal."
 building_stables_06:0 "Canais de Drenagem"
 building_stables_06_desc:0 "Canais escavados no solo dos estábulos mantêm os cavalos secos e confortáveis, quase sem esforço."
 building_stables_07:0 "Guildas de Ferradores"
 building_stables_07_desc:0 "A quantidade de trabalho e habilidade necessária para cuidar adequadamente dos cascos incentiva o crescimento das guildas de ferradores, que fazem, ajustam e reparam ferraduras incansavelmente."
 building_stables_08:0 "Haras"
 building_stables_08_desc:0 "A adição de instalações dedicadas para o cuidado e preparação dos exemplares mais preciosos da perfeição equina apoia a criação de novos cavalos magníficos, tornando aqueles que temos quase brilhantes."
 building_stilted_granaries_01:0 "Celeiro Elevado"
 building_stilted_granaries_01_desc:0 "Um celeiro simples de quatro pilares mantém sementes e tributos secos; os guardas da aldeia se alimentam melhor durante as campanhas."
 building_stilted_granaries_02:0 "Fileira de Celeiros"
 building_stilted_granaries_02_desc:0 "Uma linha de celeiros sobre estacas, com bloqueadores de ratos e degraus cobertos. As taxas de grãos tornam-se mais estáveis e a recuperação das levas melhora."
 building_stilted_granaries_03:0 "Celeiros Esculpidos em Estacas"
 building_stilted_granaries_03_desc:0 "Entalhes de prestígio marcam o excedente; os administradores rotacionam estoques e rações para marchas mais longas."
 building_stilted_granaries_04:0 "Distrito dos Celeiros"
 building_stilted_granaries_04_desc:0 "Um agrupamento cercado com abrigo para vigias e galpão de contagem; a segurança alimentar estabiliza todo o condado."
 building_stonehenge_01:0 "$building_type_stonehenge_01$"
 building_stonehenge_01_desc:0 "$building_type_stonehenge_01_desc$"
 building_sumela_monastery_01:0 "$building_type_sumela_monastery_01$"
 building_sumela_monastery_01_desc:0 "O mosteiro caiu em ruínas e foi subsequentemente restaurado e ampliado por vários imperadores; o principal contribuinte para a encarnação atual tem sido o Imperador Justiniano através da intervenção do General Belisário."
 building_sumela_monastery_02:0 "Renovado $building_type_sumela_monastery_01$"
 building_sumela_monastery_02_desc:0 "Muitos séculos se passaram desde a última vez que este mosteiro foi renovado. A intervenção mais recente lhe concedeu mais terras hereditárias e dependentes, isenções fiscais e financiamentos imperiais para erguer novos edifícios. A Igreja da Rocha foi a mais beneficiada, pois recebeu um novo ciclo de afrescos."
 building_sunday_bazaar_01:0 "Bazar de Domingo"
 building_sunday_bazaar_01_desc:0 "Alguns locais dizem que, antes mesmo de existir dinheiro, Kashgar já tinha o Bazar de Domingo. Caminhar entre as barracas do mercado realmente dá essa sensação — é impossível imaginar um tempo em que este lugar não existia."
 building_sunday_bazaar_02:0 "Grande Bazar de Domingo"
 building_sunday_bazaar_02_desc:0 "Embora o grande Bazar de Domingo de Kashgar exista desde tempos imemoriais, a prosperidade que vive agora certamente será lembrada por gerações futuras."
 building_suvarnadvipa_mines_01:0 "Assentamento de Mineração de Suvarnadvipa"
 building_suvarnadvipa_mines_01_desc:0 "$building_type_suvarnadvipa_mines_01_desc$"
 building_suvarnadvipa_mines_02:0 "Mina de Suvarnadvipa"
 building_suvarnadvipa_mines_02_desc:0 "$building_rammelsberg_mines_02_desc$"
 building_suvarnadvipa_mines_03:0 "Grande Mina de Suvarnadvipa"
 building_suvarnadvipa_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_suvarnadvipa_mines_04:0 "Complexo de Mineração de Suvarnadvipa"
 building_suvarnadvipa_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_swahili_port_lamu:0 "Portos Comerciais de Lamu"
 building_swahili_port_lamu_desc:0 "As quentes areias brancas de suas praias e o vibrante azul das águas que tocam suas margens escondem o intenso comércio que serve como fonte de vida de Lamu. Conectada há muito tempo ao comércio oceânico, bens dos extremos ocidentais e orientais do mundo conhecido podem ser comprados e vendidos aqui."
 building_swahili_port_mombasa:0 "Porto de Mombasa"
 building_swahili_port_mombasa_desc:0 "Empoleirada no topo de uma ilha rochosa cercada por penhascos íngremes, Mombasa desfruta de uma posição naturalmente defensável que ainda permanece singularmente acessível ao tráfego marítimo."
 building_swahili_port_pate:0 "Portos Comerciais da Ilha de Pate"
 building_swahili_port_pate_desc:0 "Localizada na borda norte das terras centrais suahíli, a Ilha de Pate foi uma das primeiras regiões suahíli introduzidas ao Islã e, portanto, às redes comerciais do Oriente Médio."
 building_swahili_port_pemba:0 "Portos Comerciais de Pemba"
 building_swahili_port_pemba_desc:0 "Os recifes, praias e florestas de mangue da Ilha de Pemba oferecem uma abundância de enseadas e recursos para o povo de Pemba, tornando-a um entreposto natural de Zanj."
 building_swahili_port_zanzibar:0 "Portos Comerciais de Zanzibar"
 building_swahili_port_zanzibar_desc:0 "As praias arenosas da ilha de Unguja, protegidas por ilhotas de coral, fazem dela um refúgio perfeito para navios. Comerciantes de todo o Oceano Índico vêm aproveitar as forças naturais de Unguja como centro de comércio marítimo."
 building_tada_mines_01:0 "Minas de Cobre de Tada"
 building_tada_mines_01_desc:0 "Sob a vila de Tada, aninhada nas montanhas Hokusetsu, repousa uma riqueza de metais preciosos à espera de ser extraída. Diz-se que o revestimento do Grande Buda do Tōdai-ji veio deste lugar."
 building_tada_mines_02:0 "Mina de Cobre de Tada"
 building_tada_mines_02_desc:0 "Os poços de mineração foram ampliados e engenheiros foram trazidos para aumentar significativamente a extração de cobre."
 building_tada_mines_03:0 "Grande Mina de Cobre de Tada"
 building_tada_mines_03_desc:0 "Uma vila surgiu ao redor dos muitos poços de mineração, e os trabalhadores encontram novas veias de cobre regularmente."
 building_tada_mines_04:0 "Complexo de Mineração de Cobre de Tada"
 building_tada_mines_04_desc:0 "A extração de cobre atingiu uma escala quase industrial, com o número de trabalhadores chegando aos milhares. Riquezas sem fim parecem fluir das minas."
 building_taghaza_mines_01:0 "Poços de Mineração de Taghaza"
 building_taghaza_mines_01_desc:0 "$building_type_taghaza_mines_01_desc$"
 building_taghaza_mines_02:0 "Mina de Taghaza"
 building_taghaza_mines_02_desc:0 "À medida que o assentamento cresce, mais e mais sal é extraído. A chegada de engenheiros competentes permite a construção de uma mina real."
 building_taghaza_mines_03:0 "Grande Mina de Taghaza"
 building_taghaza_mines_03_desc:0 "Conforme as operações de mineração crescem, as próprias minas também se expandem. Mais entradas são construídas e poços grandes são escavados para permitir a extração de mais sal."
 building_taghaza_mines_04:0 "Complexo de Mineração de Taghaza"
 building_taghaza_mines_04_desc:0 "À medida que a produção de sal aumenta, atrai comerciantes e artesãos de todo o mundo."
 building_takkeda_mines_01:0 "Assentamento de Mineração de Takkeda"
 building_takkeda_mines_01_desc:0 "$building_type_takkeda_mines_01_desc$"
 building_takkeda_mines_02:0 "Mina de Takkeda"
 building_takkeda_mines_02_desc:0 "$building_rammelsberg_mines_02_desc$"
 building_takkeda_mines_03:0 "Grande Mina de Takkeda"
 building_takkeda_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_takkeda_mines_04:0 "Complexo de Mineração de Takkeda"
 building_takkeda_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_tax_assessor_01:0 "Assessores Fiscais"
 building_tax_assessor_01_desc:0 "É dever de todo camponês pagar à coroa um imposto proporcional em moedas ou produtos. Nossos assessores de impostos garantem que o que eles pagam é suficientemente \"proporcional\" às nossas necessidades e, felizmente para nós, a maioria dos camponeses é analfabeta."
 building_tax_assessor_02:0 "Gabinete do Oficial de Justiça"
 building_tax_assessor_02_desc:0 "Uma excelente maneira de garantir que os camponeses paguem seus impostos é a ameaça de serem jogados na masmorra, caso não o façam. Este é o trabalho do oficial de justiça, sempre #emphasis nosso #! lado!"
 building_tax_assessor_03:0 "Tribunal de Magistrados"
 building_tax_assessor_03_desc:0 "Enquanto os camponeses podem ser fáceis de tributar, os proprietários de terras mais ricos são mais difíceis de coagir. Ao estabelecer uma complexa rede administrativa administrada por magistrados leais, podemos garantir que até o mais rico de nossos súditos pague suas dívidas."
 building_temple_01:0 "Santuário"
 building_temple_01_desc:0 "$building_type_temple_01_desc$"
 building_temple_02:0 "Terreno do Templo"
 building_temple_02_desc:0 " Um templo que fica no centro da vila, cuidadosamente construído por artesãos locais para mostrar sua dedicação à fé."
 building_temple_03:0 "Casa de Adoração"
 building_temple_03_desc:0 " Embora o templo possa receber muitos adoradores, esse não é seu único propósito — também abriga o clero, sustenta uma grande biblioteca e protege as relíquias. Com a adição da casa de oração sempre tem espaço pros fieis orarem."
 building_temple_04:0 "Grande Templo"
 building_temple_04_desc:0 " Não satisfeitos com um templo pequeno e modesto, artesãos e arquitetos locais trabalharam juntos para criar uma verdadeira obra de arte. Este grande templo aparentemente invoca o poder do próprio céu para qualquer adorador que entre em seus salões gloriosos"
 building_temple_citadel_01:0 "Fortaleza do Templo"
 building_temple_citadel_01_desc:0 "$building_type_temple_citadel_01_desc$"
 building_temple_citadel_02:0 "Mosteiro Fortificado"
 building_temple_citadel_02_desc:0 "A Cidadela possui maior capacidade e organização, abrigando os fiéis locais e também oferecendo alojamentos militares adequados para responder a qualquer ataque."
 building_temple_citadel_03:0 "Complexo do Templo"
 building_temple_citadel_03_desc:0 "Edifícios adicionais são fornecidos para conforto e eficiência; este local de culto está preparado para a maioria das eventualidades. Seus cidadãos são obrigados a vigiar as muralhas, além de orar nos santuários locais."
 building_temple_citadel_04:0 "Fortaleza do Santuário"
 building_temple_citadel_04_desc:0 "Este santuário é bem protegido por fortalezas, muralhas, trincheiras, postos militares e aparentemente também possui proteção divina do alto, fazendo com que seus cidadãos e a grande população devota se sintam seguros."
 building_temple_in_jerusalem_01:0 "O Terceiro Templo"
 building_temple_in_jerusalem_01_desc:0 " Centenas de anos após a destruição do Segundo Templo, finalmente chegou a hora de restaurar o Templo de Jerusalém! Este Terceiro Templo resistirá ao teste do tempo, vigilantemente guardado de todos os que desejam vê-lo destruído."
 building_temple_of_uppsala_01:0 "$building_type_temple_of_uppsala_01$"
 building_temple_of_uppsala_01_desc:0 "$building_type_temple_of_uppsala_01_desc$"
 building_temple_of_uppsala_02:0 "Catedral de Uppsala"
 building_temple_of_uppsala_02_desc:0 "Uma catedral imponente construída para rivalizar com as construções mais esplêndidas do sul da Europa, a Catedral de Uppsala serve como local de sepultamento de alguns dos mais proeminentes monarcas da Suécia e contém várias relíquias santas."
 building_the_colosseum_01:0 "$building_type_the_colosseum_01$"
 building_the_colosseum_01_desc:0 "$building_type_the_colosseum_01_desc$"
 building_the_friday_mosque_01:0 "$building_type_the_friday_mosque_01$"
 building_the_friday_mosque_01_desc:0 "$building_type_the_friday_mosque_01_desc$"
 building_the_great_wall_01:0 "A Grande Muralha"
 building_the_great_wall_01_desc:0 "Esta é a parte mais antiga da Grande Muralha, construída em grande parte pela dinastia Qin. As areias do tempo podem ter desgastado pedra, tijolo e argamassa, mas ainda é uma estrutura de fortificação formidável."
 building_the_great_wall_02:0 "A Grande Muralha"
 building_the_great_wall_02_desc:0 "A dinastia Han expandiu amplamente as muralhas existentes construídas por seus predecessores. Eles criaram algumas das seções mais extensas, estendendo-se por desertos e montanhas por centenas de milhas."
 building_the_great_wall_03:0 "A Grande Muralha"
 building_the_great_wall_03_desc:0 "As dinastias Wei, Qi e Sui adicionaram seções à muralha durante os séculos V e VI d.C., melhorando várias partes com fortificações reforçadas."
 building_the_great_wall_04:0 "A Grande Muralha"
 building_the_great_wall_04_desc:0 "Um feito impressionante de engenharia, esta gigantesca muralha foi ampliada muitas vezes desde sua construção inicial no século VII a.C. Agora se estende por milhares de milhas e inclui um grande número de torres de vigia, quartéis e postos de guarnição. Certamente, nenhum invasor bárbaro jamais superará este poderoso obstáculo."
 building_the_great_wall_liaodong:0 "$building_the_great_wall_04$"
 building_the_great_wall_liaodong_desc:0 "$building_the_great_wall_04_desc$"
 building_the_great_wall_shanhai_pass:0 "$building_the_great_wall_04$"
 building_the_great_wall_shanhai_pass_desc:0 "$building_the_great_wall_04_desc$"
 building_the_pyramids_01:0 "$building_type_the_pyramids_01$"
 building_the_pyramids_01_desc:0 "$building_type_the_pyramids_01_desc$"
 building_the_tower_of_london_01:0 "A Torre de Londres"
 building_the_tower_of_london_01_desc:0 "$building_type_the_tower_of_london_01_desc$"
 building_theodosian_walls_01:0 "Paredes Teodósicas"
 building_theodosian_walls_01_desc:0 "$building_type_theodosian_walls_01_desc$"
 building_tiantai_monasteries_01:0 "Mosteiros Tiantai"
 building_tiantai_monasteries_01_desc:0 "Instituição acadêmica da escola Tiantai, esta academia se especializa no ensino de filosofia e meditação."
 building_tomb_of_cyrus_01:0 "$building_type_tomb_of_cyrus_01$"
 building_tomb_of_cyrus_01_desc:0 "$building_type_tomb_of_cyrus_01_desc$"
 building_tower_of_hercules_01:0 "$building_type_tower_of_hercules_01$"
 building_tower_of_hercules_01_desc:0 "$building_type_tower_of_hercules_01_desc$"
 building_tower_of_silence_01:0 "Grande Torre do Silêncio"
 building_tower_of_silence_01_desc:0 "Construída em uma parte tranquila do ducado, esta torre plana e aberta é onde os moradores depositam seus mortos para o descanso. Os corpos dentro são expostos a aves de rapina e aos rigores do sol, enviando suas almas falecidas com segurança para a vida após a morte e mantendo os vivos livres de corrupção. Proibições religiosas exigem a torre em vez do local tradicional na natureza, mas sua presença une a comunidade com firmeza."
 building_trepca_mines_01:0 "Assentamento de Mineração de Trepča"
 building_trepca_mines_01_desc:0 "$building_type_trepca_mines_01_desc$"
 building_trepca_mines_02:0 "Mina de Trepča"
 building_trepca_mines_02_desc:0 "$building_rammelsberg_mines_02_desc$"
 building_trepca_mines_03:0 "Grande Mina de Trepča"
 building_trepca_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_trepca_mines_04:0 "Complexo de Mineração de Trepča"
 building_trepca_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_tribe_01:0 "Fortaleza Tribal"
 building_tribe_01_desc:0 "Construído com toras e pedra bruta, este porão é imponente apesar de seu pequeno tamanho."
 building_tribe_02:0 "Fortaleza Tribal Fortificada"
 building_tribe_02_desc:0 "A fortaleza é inspirada nos castelos feudais, adicionando muitos novos elementos defensivos."
 building_trosky_castle_01:0 "Castelo de Trosky"
 building_trosky_castle_01_desc:0 "O Castelo de Trosky é construído entre duas formações rochosas de basalto de um vulcão extinto há muito tempo. O castelo deriva seu nome do formato das rochas, que se assemelha às ruínas de um castelo desmoronado."
 building_tsushima_mines_01:0 "Minas de Prata de Tsushima"
 building_tsushima_mines_01_desc:0 "A ilha de Tsushima é famosa por seus depósitos de prata, descobertos no final do século VII, durante o reinado do Imperador Tenmu. Rica em galena, os minérios negros do Mar do Japão produzem grandes riquezas."
 building_tsushima_mines_02:0 "Mina de Prata de Tsushima"
 building_tsushima_mines_02_desc:0 "Os poços de mineração foram ampliados e engenheiros foram trazidos para aumentar significativamente a extração de prata."
 building_tsushima_mines_03:0 "Grande Mina de Prata de Tsushima"
 building_tsushima_mines_03_desc:0 "Uma vila surgiu ao redor dos muitos poços de mineração, e os trabalhadores encontram novas veias de prata regularmente."
 building_tsushima_mines_04:0 "Complexo de Mineração de Prata de Tsushima"
 building_tsushima_mines_04_desc:0 "A extração de prata atingiu uma escala quase industrial, com o número de trabalhadores chegando aos milhares. Riquezas sem fim parecem fluir das minas."
 building_turda_mines_01:0 "Poços de Mineração de Turda"
 building_turda_mines_01_desc:0 "$building_type_turda_mines_01_desc$"
 building_turda_mines_02:0 "Mina de Turda"
 building_turda_mines_02_desc:0 "À medida que o assentamento cresce, mais e mais sal está sendo extraído. A chegada de engenheiros competentes permite a construção de uma mina real."
 building_turda_mines_03:0 "Grande Mina de Turda"
 building_turda_mines_03_desc:0 "À medida que as operações de mineração crescem, as próprias minas também se expandem. Mais entradas são construídas e grandes poços são escavados para permitir a extração de mais sal."
 building_turda_mines_04:0 "Complexo de Mineração de Turda"
 building_turda_mines_04_desc:0 "À medida que a produção de sal aumenta, atrai comerciantes e artesãos de todo o mundo."
 building_type_al_azhar_university:0 "A Universidade Al-Azhar"
 building_type_al_azhar_university_desc:0 " $building_type_generic_university_desc$\n\nO Al-Azhar é uma homenagem a Fátima, filha de Maomé, que costumava ser chamada de 'al-Zahra' (a Resplandecente)."
 building_type_alamut_castle_01:0 "Castelo Alamut"
 building_type_alamut_castle_01_desc:0 "Este ninho de águia, situado no alto de um penhasco, foi construído pelos Justanidas para servir como uma fortaleza reduto de seu reino sitiado. Com sua localização impressionante e fortes muralhas, é quase inexpugnável por todos os relatos e poderia ser um reduto ideal para qualquer facção ou seita guerreira que prosperasse em um local tão isolado."
 building_type_alamut_castle_02:0 "Fortaleza Alamut"
 building_type_alamut_castle_02_desc:0 "Situado no alto de um penhasco, este castelo serviu por muito tempo como reduto remoto nas montanhas. Agora foi reconstruído em uma formidável fortaleza #italic fedayeen#!, abrigando bibliotecas, laboratórios e jardins tranquilos entre as imponentes fortificações. Para alguns, é um local de derramamento de sangue e guerra, para outros, um local de repouso espiritual - ou talvez ambos."
 building_type_alcazar_of_segovia_01:0 "Alcázar de Segóvia"
 building_type_alcazar_of_segovia_01_desc:0 "Erguendo-se como a proa de um navio a partir de um penhasco rochoso, esta fortaleza é uma visão impressionante. Tão majestosa quanto impenetrável, é o maior de todos os castelos no reino dos castelos — Castela."
 building_type_alhambra_01:0 "A Alhambra"
 building_type_alhambra_01_desc:0 " A Alhambra é uma fortaleza construída sobre as ruínas de uma antiga fortificação romana. Embora seja útil como uma estrutura defensiva, com os investimentos certos pode ser transformada em algo mais..."
 building_type_aljaferia_palace_01:0 "Aljafería"
 building_type_aljaferia_palace_01_desc:0 "Um grande palácio-fortaleza construído na planície de Saría, a Aljafería é um testemunho do poder e riqueza de Zaragoza. Imponente e esplêndido em igual medida; é tanto uma fortificação intimidante quanto o ápice da arquitetura ibérica."
 building_type_allaq_mines_01:0 "Minas de Wadi al-Allaq"
 building_type_allaq_mines_01_desc:0 "Conhecida pelos cronistas simplesmente como o país das minas, as montanhas do deserto oriental do Egito abrigam depósitos profundos de ouro. O principal centro desta região é Wadi al-Allaq e suas minas."
 building_type_ananda_temple_01:0 "Templo Ananda"
 building_type_ananda_temple_01_desc:0 " Embora Pagãos tenha milhares de pagodes, templos e santuários espalhados por toda a cidade e nas planícies ao redor, o Templo Ananda se destaca como uma realização culminante entre eles. A estrutura perfeitamente dimensionada contém muitas placas e imagens de pedra exclusivas. É um local de culto e um centro de aprendizagem para educar as pessoas no espírito religioso."
 building_type_angkor_wat_01:0 "$building_angkor_wat_01$"
 building_type_angkor_wat_01_desc:0 "$building_angkor_wat_01_desc$"
 building_type_apollinare_nuovo:0 "$building_apollinare_nuovo$"
 building_type_apollinare_nuovo_desc:0 "$building_apollinare_nuovo_desc$"
 building_type_archery_ranges_01:0 "Campo de Tiro com Arco"
 building_type_archery_ranges_01_desc:0 " Estâncias de tiro com arco dedicadas permitem que o povo comum treine com arcos e arqueiros experientes para aprimorar suas habilidades."
 building_type_argentiera_mines_01:0 "As Mina de Argentiera"
 building_type_argentiera_mines_01_desc:0 " A Argentaria del Sigerro é rica em veios de prata subterrâneos. Com incentivo e desenvolvimento suficientes, esta área poderia ser explorada para grandes quantidades de prata preciosa."
 building_type_ark_of_bukhara_01:0 "Arca de Bucara"
 building_type_ark_of_bukhara_01_desc:0 "Diz-se que o príncipe Siyavusha construiu esta imensa fortaleza quando o mundo era jovem. Três mil anos depois, foi restaurada pelos Bukhara Khudas, os antigos governantes desta região, e tem sido usada desde então. Viajantes vêm de perto e de longe para admirar a construção, com sete grandes pilares refletindo as sete estrelas do Carro Grande, mas é uma fortificação em primeiro lugar, imponente em seu esplendor."
 building_type_assassin_castle_01:0 "$holy_order_hashshashin$ $building_castle_04$"
 building_type_assassin_castle_01_desc:0 "$building_type_alamut_castle_02_desc$"
 building_type_aurelian_walls_01:0 "As Muralhas Aurelianas"
 building_type_aurelian_walls_01_desc:0 " As Muralhas Aurelianas foram construídas durante o reinado dos imperadores romanos Aureliano e Probo. Até hoje eles fornecem uma defesa formidável, envolvendo completamente as sete colinas de Roma."
 building_type_baofeng_mines_01:0 "Minas de Prata de Baofeng"
 building_type_baofeng_mines_01_desc:0 "A prata tem sido extraída nesta área por centenas de anos, e com muitas veias ainda não exploradas, este local promete ser uma das principais fontes de prata por muitos séculos ainda."
 building_type_barracks_01:0 "Quartel"
 building_type_barracks_01_desc:0 " Quartéis são construções robustas com o único propósito de abrigar e preparar milícias locais para a guerra."
 building_type_besakih_temple_01:0 "$building_besakih_temple_01$"
 building_type_besakih_temple_01_desc:0 "$building_besakih_temple_01_desc$"
 building_type_blacksmiths_01:0 "Forjas da Coroa"
 building_type_blacksmiths_01_desc:0 " Ferreiros a serviço da coroa forjam armas e armaduras para a guarda real, garantindo um suprimento constante de armamentos superiores."
 building_type_borobudur_01:0 "$building_borobudur_01$"
 building_type_borobudur_01_desc:0 "$building_borobudur_01_desc$"
 building_type_breweries_01:0 "Cervejarias"
 building_type_breweries_01_desc:0 "Este edifício é dedicado à fabricação, fermentação e armazenamento de diversos tipos de cerveja, ale e outras bebidas fermentadas. Ele desempenha um papel crucial na cultura e economia locais."
 building_type_brihadeeswarar_temple_01:0 "O Templo de Brihadisvara"
 building_type_brihadeeswarar_temple_01_desc:0 " O Templo de Brihadisvara é dedicado à divindade hindu Shiva e é um dos maiores templos do sul da Índia construído no ornamentado estilo arquitetônico dravidiano. O nome do templo é uma palavra composta em sânscrito que se traduz aproximadamente como \"Templo do Grande Senhor Shiva.\""
 building_type_buddhas_of_bamian_01:0 "Budas de $c_bamian$"
 building_type_buddhas_of_bamian_01_desc:0 " Esculpidos na encosta da montanha, os enormes Budas de Bamian pairam sobre qualquer visitante. Embora a área ao redor deles não seja mais o centro próspero do aprendizado budista como antes, ainda há vários peregrinos e estudiosos budistas visitando as estátuas. Astuto $rf_eastern$ governante pode até mesmo ser capaz de extrair lucro dos peregrinos, além de obter algumas percepções pessoais."
 building_type_burial_site_01:0 "Local de Sepultamento"
 building_type_burial_site_01_desc:0 "Ao criar um vasto local de sepultamento para nossos mortos, vamos tanto manter o miasma longe da população quanto dar um lugar de veneração e lembrança para nossos ancestrais."
 building_type_burkhan_khaldun_01:0 "Burkhan Khaldun"
 building_type_burkhan_khaldun_01_desc:0 "O Burkhan Khaldun é o mais imponente dos Montes Khentii.\nDizem que é o local de nascimento de muitos heróis mongóis; suas encostas são cobertas de ovoos e muitos sacrifícios são feitos na esperança de obter seu favor."
 building_type_byeokran_port_01:0 "$building_byeokran_port_01$"
 building_type_byeokran_port_01_desc:0 "$building_byeokran_port_01_desc$"
 building_type_camel_farms_01:0 "Camelo"
 building_type_camel_farms_01_desc:0 " Essas fazendas são dedicadas à criação e desenvolvimento de camelos para uso militar, assim como pelos camponeses locais em seus afazeres diários. Os camelos são montagens flexíveis e resistentes, ideais para um clima desértico rigoroso."
 building_type_capital_bureau_01:0 "Magistratura da Capital"
 building_type_capital_bureau_01_desc:0 "Um ramo dedicado do governo, que dedica todos os seus recursos para gerenciar a capital. Uma multidão de escrivães e funcionários reside dentro destas paredes, prontos para servir sob o comando do eparca."
 building_type_caravanserai_01:0 "Caravanserai"
 building_type_caravanserai_01_desc:0 "Um abrigo localizado em terrenos inóspitos que recebe viajantes cansados enquanto tenta manter afastados os indesejáveis."
 building_type_castle_01:0 "Castelo"
 building_type_castle_01_desc:0 " Uma fortaleza projetada não apenas para abrigar uma família nobre respeitável, mas também para proteger a cidade e as fazendas vizinhas."
 building_type_cattolica_stilo:0 "$building_cattolica_stilo$"
 building_type_cattolica_stilo_desc:0 "$building_cattolica_stilo_desc$"
 building_type_celestial_great_barracks_01:0 "$building_celestial_great_barracks_01$"
 building_type_celestial_great_barracks_01_desc:0 "$building_celestial_great_barracks_01_desc$"
 building_type_cereal_fields_01:0 "Fazendas & Campos"
 building_type_cereal_fields_01_desc:0 " Fazendas e campos são a espinha dorsal de qualquer economia. Abastecendo o homem, a besta, o exército e a festa - não há como subestimar o poder de um simples grão."
 building_type_cevennes_mines_01:0 "As Minas dos Cévennes"
 building_type_cevennes_mines_01_desc:0 "As minas profundas das montanhas dos Cévennes foram construídas para extrair os depósitos de prata à base de cobre da região."
 building_type_changan_market_01:0 "$building_changan_market_01$"
 building_type_changan_market_01_desc:0 "$building_changan_market_01_desc$"
 building_type_charnel_grounds_01:0 "Campos de Cremação"
 building_type_charnel_grounds_01_desc:0 "Tanto locais de purificação espiritual quanto áreas para os mortos descansarem, esses terrenos ao ar livre fornecem um local para corpos se decompor."
 building_type_chihu_mines_01:0 "Minas de Ferro de Chihu"
 building_type_chihu_mines_01_desc:0 "As minas de Chihu estão ativas desde a era dos Três Reinos, quando o reino de Wu forjava armas aqui. Com ricos depósitos de ferro e cobre, elas são uma grande fonte de produção de armas e também de cunhagem."
 building_type_chinjufu_01:0 "$building_chinjufu_01$"
 building_type_chinjufu_01_desc:0 "$building_chinjufu_01_desc$"
 building_type_church_of_the_theotokos:0 "$building_church_of_the_theotokos$"
 building_type_church_of_the_theotokos_desc:0 "$building_church_of_the_theotokos_desc$"
 building_type_cilician_gates:0 "$building_cilician_gates$"
 building_type_cilician_gates_desc:0 "$building_cilician_gates_desc$"
 building_type_citadel_of_aleppo_01:0 "$building_citadel_of_aleppo_01$"
 building_type_citadel_of_aleppo_01_desc:0 " A Cidadela de Aleppo é uma fortificação antiga, tendo sido usada por várias potências desde a sua construção. A cidadela funciona como residência real, retiro fortificado, templo e prisão."
 building_type_citadel_shrine_01:0 "Santuário da Cidadela"
 building_type_citadel_shrine_01_desc:0 "Uma $building_type_temple_citadel_01$ não está completa sem um local para adorar seu panteão. Sejam cidadãos comuns ou forças guarnecidas, a santidade que emana de suas paredes acalma qualquer alma inquieta."
 building_type_citadel_thang_long_01:0 "Cidadela de Thăng Long"
 building_type_citadel_thang_long_01_desc:0 "$building_citadel_thang_long_01_desc$"
 building_type_city_01:0 "Cidade"
 building_type_city_01_desc:0 " Uma cidade populosa que abriga um grande número de burgueses, mercadores e cidadãos trabalhadores."
 building_type_city_wall_of_toledo_01:0 "Muralhas de Toledo"
 building_type_city_wall_of_toledo_01_desc:0 "Originalmente construídas pelos romanos nos tempos antigos, essas enormes muralhas foram significativamente expandidas sob o reinado de Wamba, rei dos visigodos. Os primeiros governantes árabes as ampliaram ainda mais, criando um sistema defensivo adequado para a Cidade dos Reis."
 building_type_common_tradeport_01:0 "Porto Comercial"
 building_type_common_tradeport_01_desc:0 "Galeras mercantes carregam e descarregam sua carga neste porto."
 building_type_culai_academy_01:0 "$building_culai_academy_01$"
 building_type_culai_academy_01_desc:0 "$building_culai_academy_01_desc$"
 building_type_curtain_walls_01:0 "Paredes e Torres"
 building_type_curtain_walls_01_desc:0 " Paredes de pedra e torres de bastiões intimidantes oferecem excelente proteção contra ataques e cercos. Quanto mais fortificações construídas, mais impenetrável se torna o castelo que protegem."
 building_type_danevirke_01:0 "Danevirke"
 building_type_danevirke_01_desc:0 "O Danevirke é uma extensa fortificação de terra construída para impedir incursões do continente em territórios dinamarqueses e foi expandido várias vezes desde sua construção original."
 building_type_dau_temple_01:0 "$building_dau_temple_01$"
 building_type_dau_temple_01_desc:0 "$building_dau_temple_01_desc$"
 building_type_dazaifu_01:0 "$building_dazaifu_01$"
 building_type_dazaifu_01_desc:0 "$building_dazaifu_01_desc$"
 building_type_dean_mines_01:0 "Minas da Floresta de Dean"
 building_type_dean_mines_01_desc:0 "A Floresta de Dean é o centro mais notável de mineração e forjamento de ferro nas Ilhas Britânicas. As muitas forjas aqui têm fornecido a região com produtos de ferro desde muito antes das primeiras botas romanas pisarem o solo britânico."
 building_type_despot_palace:0 "$building_despot_palace$"
 building_type_despot_palace_desc:0 "$building_despot_palace_desc$"
 building_type_dieng_plateau_01:0 "$building_dieng_plateau_01$"
 building_type_dieng_plateau_01_desc:0 "$building_dieng_plateau_01_desc$"
 building_type_doges_palace_01:0 "O Palácio Ducal"
 building_type_doges_palace_01_desc:0 " O Palácio Ducal serve de residência para o governo da República de Veneza. Uma estrutura impressionante, que abriga várias câmaras dedicadas a coisas como o Conselho, Senado, administração e justiça."
 building_type_dome_of_the_rock_01:0 "O Templo em Jerusalém"
 building_type_dome_of_the_rock_01_desc:0 " A Cúpula da Rocha está situada no centro do Monte do Templo, no local onde ficava o Templo de Salomão e o Segundo Templo Judaico. Diz-se que a pedra fundamental do templo é o lugar onde Deus criou o mundo e o primeiro ser humano, Adão. O Domo da Rocha e a vizinha Igreja do Santo Sepulcro atraem peregrinos abraâmicos de todo o mundo."
 building_type_dragon_kiln_01:0 "Forno do Dragão"
 building_type_dragon_kiln_01_desc:0 "Construído na encosta de uma colina íngreme, este complexo de fornos pode produzir os fogos de altíssima temperatura necessários para criar cerâmicas exóticas altamente valorizadas como mercadorias e presentes."
 building_type_dunhuang_market_01:0 "$building_dunhuang_market_01$"
 building_type_dunhuang_market_01_desc:0 "$building_dunhuang_market_01_desc$"
 building_type_dushan_mines_01:0 "As Minas de Dushan"
 building_type_dushan_mines_01_desc:0 "Uma das quatro grandes jades da China, Dushan tem sido um local de mineração de jade desde a dinastia Han. Diferente de outros tipos de jade por possuir uma coloração mais rica, que geralmente é mais mesclada do que em outras variedades."
 building_type_dvin_shuka_01:0 "$building_dvin_shuka_01$"
 building_type_dvin_shuka_01_desc:0 "$building_dvin_shuka_01_desc$"
 building_type_elephant_pens_01:0 "Elefantaria"
 building_type_elephant_pens_01_desc:0 " Os elefantes são mantidos e treinados aqui. Eles são excelentes bestas de carga, úteis tanto para o trabalho quanto para a guerra."
 building_type_enryaku_ji_01:0 "$building_enryaku_ji_01$"
 building_type_enryaku_ji_01_desc:0 "$building_enryaku_ji_01_desc$"
 building_type_etchmiadzin_cathedral:0 "$building_etchmiadzin_cathedral$"
 building_type_etchmiadzin_cathedral_desc:0 "$building_etchmiadzin_cathedral_desc$"
 building_type_event_tower_of_silence_01:0 "Torre do Silêncio"
 building_type_event_tower_of_silence_01_desc:0 "$building_tower_of_silence_01_desc$"
 building_type_examination_hall_01:0 "Salão de Exames"
 building_type_examination_hall_01_desc:0 "Os exames imperiais não podem ser realizados sem um local apropriado para isso. É responsabilidade do governador local garantir que os oficiais tenham todos os recursos necessários para conduzir os exames adequadamente e que os candidatos recebam o suporte necessário, minimizando as oportunidades de trapaça."
 building_type_fairy_chimneys:0 "$building_fairy_chimneys$"
 building_type_fairy_chimneys_desc:0 "$building_fairy_chimneys_desc$"
 building_type_falak_ol_aflak_citadel_01:0 "Falak-ol-Aflak"
 building_type_falak_ol_aflak_citadel_01_desc:0 "Aninhada no topo de uma colina acima da cidade de Khorramabad, esta fortaleza de tijolos de barro sassânida permanece uma visão impressionante. Os habitantes do vale a chamam de #italic Falak-ol-Aflak#!, \"O Paraíso dos Paraísos\", pois lhes parece repousar no topo do mundo, e dentro de suas fortes muralhas, frequentemente encontram refúgio."
 building_type_falun_mines_01:0 "A Mina de Falun"
 building_type_falun_mines_01_desc:0 " Também conhecido como “Stora Kopparberget” #italic (A Grande Montanha de Cobre)#! esta mina produz grandes quantidades de cobre."
 building_type_farm_estates_01:0 "Casas Senhoriais"
 building_type_farm_estates_01_desc:0 "Os Senhores e Senhoras do solar empregam centenas de camponeses para arar seus campos e cuidar de seu gado. Quanto mais poder eles detêm, mais terra seus súditos podem trabalhar e, o mais importante, mais impostos eles irão gerar."
 building_type_fengtian_mines_01:0 "Minas de Jade de Fengtian"
 building_type_fengtian_mines_01_desc:0 "Aninhadas ao longo das elevações centrais da ilha, as Minas de Jade de Fengtian facilitam o comércio marítimo de pedras preciosas. Preferida por autoridades, locais e comerciantes de terras distantes, essa jade verde luminosa ocupa um lugar especial na receita do condado."
 building_type_forbidden_city_01:0 "$building_forbidden_city_01$"
 building_type_forbidden_city_01_desc:0 "$building_forbidden_city_01_desc$"
 building_type_generic_copper_mines_01:0 "Minas de Cobre"
 building_type_generic_copper_mines_01_desc:0 "Uma importante mina de cobre, fornecendo minério de cobre incrivelmente lucrativo para quem tiver sorte o suficiente para possuí-la."
 building_type_generic_gold_mines_01:0 "Minas de Ouro"
 building_type_generic_gold_mines_01_desc:0 "Uma mina de ouro incrivelmente valiosa e rara, muito cobiçada por todos os nobres da região."
 building_type_generic_silver_mines_01:0 "Minas de Prata"
 building_type_generic_silver_mines_01_desc:0 "Uma rica mina de prata, fornecendo um fluxo constante de prata valiosa."
 building_type_generic_university:0 "Universidade"
 building_type_generic_university_desc:0 " Uma universidade é um local de ensino superior, reservado para aqueles de boa posição e riqueza que são considerados dignos o suficiente. Atrai acadêmicos e cientistas que debatem, estudam, escrevem e, por fim, agrupam seus conhecimentos dentro de suas paredes."
 building_type_giant_wild_goose_pagoda_01:0 "$building_giant_wild_goose_pagoda_01$"
 building_type_giant_wild_goose_pagoda_01_desc:0 "$building_giant_wild_goose_pagoda_01_desc$"
 building_type_golden_gate_of_kiev_01:0 "Portão Dourado de Kiev"
 building_type_golden_gate_of_kiev_01_desc:0 "Modelado e nomeado após um portão em Constantinopla, o Portão Dourado de Kiev serve como uma entrada para a cidade e um arco triunfal. A cúpula dourada da igreja construída no topo do portão pode ser vista de longe e o torna um símbolo proeminente de Kiev."
 building_type_gongsanseong_fortress_01:0 "$building_gongsanseong_fortress_01$"
 building_type_gongsanseong_fortress_01_desc:0 "$building_gongsanseong_fortress_01_desc$"
 building_type_great_megalith_01:0 "Grande Megalito"
 building_type_great_megalith_01_desc:0 "Uma versão extremamente ambiciosa do Megalito, o projeto do Grande Megalito envolve cobrir a paisagem do campo em pequenas construções megalíticas centradas em uma única construção gigantesca."
 building_type_great_project_cathedral_01:0 "$building_great_project_cathedral_01$"
 building_type_great_project_cathedral_02:0 "$building_great_project_cathedral_02$"
 building_type_great_project_cathedral_03:0 "$building_great_project_cathedral_03$"
 building_type_great_project_cathedral_under_construction:0 "Catedral"
 building_type_great_wall_of_gorgan_01:0 "Grande Muralha de Gorgan"
 building_type_great_wall_of_gorgan_01_desc:0 "Um vasto sistema de fortificação construído pelos antigos reis como uma muralha contra os Hunos Hefthalitas, a Grande Muralha de Gorgan é envolta em lendas. Diz-se que até mesmo Alexandre, o Grande, passou por seus portões em sua marcha para conquistar o Oriente."
 building_type_guild_halls_01:0 "Guildas"
 building_type_guild_halls_01_desc:0 " A cidade oferece a todas as grandes guildas e famílias burguesas um amplo local para organizar e praticar seu artesanato."
 building_type_guiyang_mines_01:0 "As Minas de Guiyang"
 building_type_guiyang_mines_01_desc:0 "Guiyang tem abrigado casas da moeda imperiais por mais de mil anos. Dinastia após dinastia protegeu as minas de prata locais e emitiu moedas usando sua produção como padrão."
 building_type_hadrians_wall_01:0 "A Muralha de Adriano"
 building_type_hadrians_wall_01_desc:0 " A Muralha de Adriano foi construída durante a época romana para manter os pictos do norte fora da província da Britânia. Hoje em dia não tem nenhum propósito defensivo, mas as pedras são uma fonte barata e conveniente de material de construção!"
 building_type_hagia_sophia_01:0 "A Santa Sofia"
 building_type_hagia_sophia_01_desc:0 " A Santa Sofia é uma verdadeira maravilha da engenharia, com uma enorme cúpula se destacando como a característica mais impressionante. Concluída em 537 DC pelo imperador Justiniano I, agora abriga o Patriarca Ecumênico e é um monumento ao Cristianismo.\n\nE assim permanecerá por toda a eternidade, pois certamente nada poderia derrubar o poder de Roma."
 building_type_hagios_demetrios:0 "$building_hagios_demetrios$"
 building_type_hagios_demetrios_desc:0 "$building_hagios_demetrios_desc$"
 building_type_hakata_port_01:0 "$building_hakata_port_01$"
 building_type_hakata_port_01_desc:0 "$building_hakata_port_01_desc$"
 building_type_hall_of_heroes_01:0 "Salão dos Heróis"
 building_type_hall_of_heroes_01_desc:0 "Uma grande sala onde guerreiros heróicos podem se encontrar e organizar sua próxima aventura."
 building_type_hamadan_bazaar_01:0 "Bazar de Hamadan"
 building_type_hamadan_bazaar_01_desc:0 "$building_hamadan_bazaar_01_desc$"
 building_type_hanging_temple_01:0 "$building_hanging_temple_01$"
 building_type_hanging_temple_01_desc:0 "$building_hanging_temple_01_desc$"
 building_type_hanxing_mines_01:0 "Minas de Hanxing"
 building_type_hanxing_mines_01_desc:0 "Esta área tem sido uma fonte de ferro desde os tempos da dinastia Han e continua sendo um centro ativo de metalurgia e mineração."
 building_type_heddal_stave_church_01:0 "Igreja de Madeira de Heddal"
 building_type_heddal_stave_church_01_desc:0 "A Igreja de Madeira de Heddal é a maior igreja de madeira na Noruega e possui um interior belíssimo de madeira. A lenda diz que a igreja foi construída por um troll da montanha em apenas três dias."
 building_type_heian_palace_01:0 "$building_heian_palace_01$"
 building_type_heian_palace_01_desc:0 "$building_heian_palace_01_desc$"
 building_type_herat_bazaar_01:0 "$building_herat_bazaar_01$"
 building_type_herat_bazaar_01_desc:0 "$building_herat_bazaar_01_desc$"
 building_type_hetian_mines_01:0 "As Minas de Khotan"
 building_type_hetian_mines_01_desc:0 "Khotan tem sido a fonte da jade de Hetian desde o início dos tempos. Essa preciosa pedra branca é a mais valorizada de todas as jades, considerada mais valiosa que o ouro ou a prata por muitos. A jade é minerada tanto diretamente da montanha quanto coletada em poços abertos e leitos de rios."
 building_type_hill_farms_01:0 "Fazendas da colina"
 building_type_hill_farms_01_desc:0 " As colinas desta província estão cobertas de campos. Enquanto cultivar em uma encosta ajuda a manter as safras regadas, a área limitada significa rendimentos menores."
 building_type_hill_forts_01:0 "Fortes de Colina"
 building_type_hill_forts_01_desc:0 " Construídas sobre uma colina ou penhasco íngreme, essas fortificações maciças se mantêm firmes contra qualquer exército sitiante que não tenha a habilidade de voar!"
 building_type_hillside_grazing_01:0 "Terras de Pastejo nas Encostas"
 building_type_hillside_grazing_01_desc:0 "Inadequadas para a agricultura e amplamente cobertas por grama e outras plantas consumidas por cavalos, essas colinas foram principalmente destinadas ao pastoreio."
 building_type_holy_site_basilica_santiago_01:0 "Catedral de Santiago de Compostela"
 building_type_holy_site_basilica_santiago_01_desc:0 "Construída sobre o túmulo de Tiago Maior, esta esplêndida edificação é o ponto final do Caminho de Santiago e a coroa de um dos grandes locais do cristianismo. Peregrinos de toda a Europa Ocidental e Setentrional chegam em grande número, falando dezenas de línguas - embora muitos fiquem mudos com o assombro."
 building_type_holy_site_buddhist_grand_temple_01:0 "Grande Templo"
 building_type_holy_site_buddhist_grand_temple_01_desc:0 "O [holy_site|E] nesta área atrai inúmeros peregrinos humildes que buscam purificar suas almas. No centro do complexo há uma grande Estupa, lar de diversas Relíquias do próprio Buda."
 building_type_holy_site_canterbury_cathedral_01:0 "$building_type_holy_site_canterbury_cathedral_03$"
 building_type_holy_site_canterbury_cathedral_01_desc:0 " Agostinho, missionário romano e mais tarde arcebispo, construiu a Catedral de Cantuária após escolher a cidade como seu centro para a sede episcopal de Kent. Esta nova catedral reavivou a importância da cidade, conferindo-lhe autoridade sobre a igreja inglesa."
 building_type_holy_site_canterbury_cathedral_02:0 "$building_type_holy_site_canterbury_cathedral_03$"
 building_type_holy_site_canterbury_cathedral_02_desc:0 "A catedral não está imune à passagem do tempo e a circunstâncias inclementes. O estilo normando foi escolhido para reparar os danos causados por um incêndio. A nova nave em formato de cruz substituiu a basílica anterior, e um campanário independente foi adicionado posteriormente."
 building_type_holy_site_canterbury_cathedral_03:0 "Catedral de Canterbury"
 building_type_holy_site_canterbury_cathedral_03_desc:0 "Danos graves causaram a necessidade de um novo projeto de reconstrução para a catedral. Embora a estrutura normanda tenha sido mantida em certas partes, o estilo gótico florescente foi escolhido para elevar a estrutura."
 building_type_holy_site_cathedral_01:0 "A Grande Catedral"
 building_type_holy_site_cathedral_01_desc:0 " O [holy_site|E] nesta área atrai peregrinos cristãos de todo o mundo conhecido. A grande catedral não é apenas uma maravilha de engenharia e beleza, mas também um refúgio seguro para os viajantes e um monumento de prestígio ao seu patrocinador."
 building_type_holy_site_chinese_temple_01:0 "$building_holy_site_chinese_temple_01$"
 building_type_holy_site_chinese_temple_01_desc:0 "$building_holy_site_chinese_temple_01_desc$"
 building_type_holy_site_cologne_cathedral_01:0 "A Catedral de Colônia"
 building_type_holy_site_cologne_cathedral_01_desc:0 " A Catedral de Colônia abriga relíquias dos Reis Magos, que chamam a atenção de peregrinos de todo o mundo cristão. A catedral foi construída com arquitetura gótica e é ricamente adornada com torres e detalhes intrincados."
 building_type_holy_site_fire_temple_01:0 "Grande Templo do Fogo"
 building_type_holy_site_fire_temple_01_desc:0 "Dentro deste grandioso edifício queima um #italic Atash Behram#!, um Fogo da Vitória, o maior e mais puro de todos os chamas, coletadas de relâmpagos, velas reais, pira funerária, fornos de ourives e lareiras de ascetas. Peregrinos de terras distantes vêm contemplar esta maravilha, enquanto os magos realizam rituais de purificação aparentemente intermináveis."
 building_type_holy_site_great_mosque_of_cordoba_01:0 "A Grande Mesquita de Córdoba"
 building_type_holy_site_great_mosque_of_cordoba_01_desc:0 " A Grande Mesquita de Córdoba foi erguida após a conquista islâmica do Reino Visigótico, sobre a fundação de uma igreja cristã. Originalmente, o local era compartilhado, com muçulmanos e cristãos usando-o, mas a metade cristã foi eventualmente comprada e demolida para dar lugar à Grande Mesquita."
 building_type_holy_site_great_mosque_of_djenne_01:0 "A Grande Mesquita de Djenné"
 building_type_holy_site_great_mosque_of_djenne_01_desc:0 " A Grande Mesquita de Djenné fica às margens do rio Bani. Construída inteiramente em tijolos de barro, requer muitos cuidados, que os fiéis estão mais do que dispostos a prestar. Todos os anos, grandes grupos de pessoas convergem para consertar e melhorar a mesquita."
 building_type_holy_site_great_mosque_of_mecca_01:0 "A Grande Mesquita de Meca"
 building_type_holy_site_great_mosque_of_mecca_01_desc:0 " A Grande Mesquita de Meca é uma estrutura enorme e antiga cujas paredes circundam a sagrada Kaaba. Muitos grandes sultões expandiram a mesquita e seus arredores desde sua construção. Todo muçulmano deve visitar este local durante o Hajj."
 building_type_holy_site_great_mosque_of_samarra_01:0 "A Grande Mesquita de Samarra"
 building_type_holy_site_great_mosque_of_samarra_01_desc:0 " A Grande Mesquita de Samarra foi concluída em 851 DC pelo califa abássida Al-Mutawakkil, que reinou em Samarra. Sua característica mais proeminente é a Torre Malwiya, um magnífico minarete em espiral, que se eleva em direção aos céus a uma altura impressionante."
 building_type_holy_site_imam_ali_mosque_01:0 "A Mesquita Imam Ali"
 building_type_holy_site_imam_ali_mosque_01_desc:0 " A mesquita Imam Ali abriga o túmulo de Ali, primo de Maomé e o primeiro Imam xiita depois dele. Milhares de peregrinos vêm prestar homenagem a cada ano, saudados pela magnífica cúpula verde da mesquita."
 building_type_holy_site_indian_grand_temple_01:0 "O Grande Templo"
 building_type_holy_site_indian_grand_temple_01_desc:0 " O [holy_site|E] nesta área atrai muitos peregrinos humildes que procuram limpar suas almas. O grande templo é coberto da fundação à torre com estátuas e ídolos aos deuses, recontando lendas antigas e a vida de nobres profetas."
 building_type_holy_site_japanese_temple_01:0 "$building_holy_site_japanese_temple_01$"
 building_type_holy_site_japanese_temple_01_desc:0 "$building_holy_site_japanese_temple_01_desc$"
 building_type_holy_site_mahabodhi_temple_01:0 "O Templo Mahabodhi"
 building_type_holy_site_mahabodhi_temple_01_desc:0 " O Templo Mahabodhi marca o local onde Buda atingiu a iluminação. O local é um destino importante para a peregrinação de budistas e hindus. A construção do templo foi iniciada por volta do ano 200 pelo imperador Ashoka e, desde então, foi melhorada e restaurada várias vezes."
 building_type_holy_site_mosque_01:0 "A Grande Mesquita"
 building_type_holy_site_mosque_01_desc:0 " O [holy_site|E] nesta área é um destino popular para peregrinos devotos. A grande mesquita oferece a eles um lugar para orar, descansar e prestar homenagem antes de continuar sua jornada. Suas belas cúpulas e grandes torres intrincadas sinalizam a grandeza de Deus para que todos vejam."
 building_type_holy_site_other_grand_temple_01:0 "O Grande Templo"
 building_type_holy_site_other_grand_temple_01_desc:0 " O [holy_site|E] nesta área é um ponto de encontro para os devotos e dedicados. O grande templo é uma homenagem nobre aos poderes superiores, suas paredes e cúpulas alisadas e pintadas em cores resplandecentes que honram o divino."
 building_type_holy_site_pagan_grand_temple_01:0 "O Grande Templo"
 building_type_holy_site_pagan_grand_temple_01_desc:0 " O [holy_site|E] nesta área atrai os fiéis em massa. O grande templo é coberto por esculturas ornamentadas que exibem feitos heróicos de deuses e semideuses. Grandes fogueiras enviam nuvens de fumaça para os próprios deuses, com homens santos administrando bênçãos a todos os que veneram os espíritos."
 building_type_holy_site_prophetic_mosque_01:0 "A Mesquita do Profeta"
 building_type_holy_site_prophetic_mosque_01_desc:0 " A Mesquita do Profeta, ou Al-Masjid an-Nabawi, é uma mesquita ao ar livre criada pelo próprio profeta Maomé. Foi uma das primeiras mesquitas que ele construiu, e o local ficava perto de onde ele residia."
 building_type_holy_site_se_asia_pagan_temple_01:0 "$building_holy_site_other_grand_temple_01$"
 building_type_holy_site_se_asia_pagan_temple_01_desc:0 "$building_type_holy_site_other_grand_temple_01_desc$"
 building_type_horse_pastures_01:0 "Manadas de Cavalos"
 building_type_horse_pastures_01_desc:0 "Qualquer pessoa pode empunhar uma arma rudimentar e atacar seu semelhante. Quase qualquer pessoa pode reunir uma multidão de camponeses armados com armas rudimentares. Mas somente a partir da delicada harmonia entre um cavalo bem-cuidado, um guerreiro habilidoso e uma arma adequada, liderados pelos melhores comandantes, pode surgir uma força de combate sem igual para varrer a Terra."
 building_type_hoshi_ryokan_01:0 "$building_hoshi_ryokan_01$"
 building_type_hoshi_ryokan_01_desc:0 "$building_hoshi_ryokan_01_desc$"
 building_type_hosios_loukas:0 "$building_hosios_loukas$"
 building_type_hosios_loukas_desc:0 "$building_hosios_loukas_desc$"
 building_type_hospices_01:0 "Hospitais"
 building_type_hospices_01_desc:0 "Um hospital oferece um lugar de descanso para os doentes e cansados, onde podem receber cuidados de pessoas santas dedicadas."
 building_type_hotin_fort_01:0 "Fortificação de Hotin"
 building_type_hotin_fort_01_desc:0 "A Fortificação de Hotin é uma pequena fortaleza construída às margens do rio Dniester. Sua localização permite proteger as rotas comerciais locais e conceder ao proprietário o controle do rio."
 building_type_house_of_wisdom_01:0 "A Casa da Sabedoria"
 building_type_house_of_wisdom_01_desc:0 " A Casa da Sabedoria contém uma vasta coleção de livros, e os escribas trabalham incansavelmente, dia e noite, para traduzir ainda mais grandes obras da literatura. As fontes variam de grego, persa, indiano e muitos mais - na verdade, ele contém todo o conhecimento do mundo!, Um farol brilhante de conhecimento humano!, E confortavelmente longe dos analfabetos cavaleiros da estepe..."
 building_type_hpakant_mines_01:0 "Minas de Jade de Hpakant"
 building_type_hpakant_mines_01_desc:0 "Nas profundezas das colinas florestadas, veios de jadeíta brilhante cintilam entre rios sinuosos e cordilheiras de calcário. Por muitos anos, esses depósitos ficaram escondidos de transeuntes e comerciantes estrangeiros, oferecendo aos locais inúmeras rochas da valiosa pedra verde."
 building_type_hunting_grounds_01:0 "Área de Caça"
 building_type_hunting_grounds_01_desc:0 " Espalhados por essas terras estão várias grandes cabanas onde os caçadores de animais selvagens podem se reunir e planejar suas excursões."
 building_type_hwangnyongsa_01:0 "$building_hwangnyongsa_01$"
 building_type_hwangnyongsa_01_desc:0 "$building_hwangnyongsa_01_desc$"
 building_type_idjang_forts_01:0 "Fortalezas Idjang"
 building_type_idjang_forts_01_desc:0 "Cidadelas tribais em terraços, pontos fortificados em esporões ou colinas."
 building_type_ijil_mines_01:0 "Minas de Sal de Ijil"
 building_type_ijil_mines_01_desc:0 "Ijil é uma das mais antigas minas de sal da África e, de muitas formas, um dos primeiros entrepostos da rede de comércio transaariana."
 building_type_imam_reza_shrine_01:0 "Santuário do Imam Reza"
 building_type_imam_reza_shrine_01_desc:0 "Este santuário abriga os restos de Ali ar-Rida, celebrado por alguns xiitas como o oitavo imã, que foi martirizado nesta terra. O complexo em constante expansão inclui seu santuário, bem como salas de oração, uma biblioteca e um bazar, crescendo de maneira eclética, porém gloriosa, com o fluxo de peregrinos e caravanas."
 building_type_iron_pillar_of_delhi_01:0 "O Pilar de Ferro de Déli"
 building_type_iron_pillar_of_delhi_01_desc:0 " O poderoso Pilar de Ferro de Déli é um símbolo da glória do Rei Chandragupta II, embora os governantes subsequentes também tenham gravado seus nomes nele. Apesar de ter ficado muito tempo parado, não há vestígios de ferrugem - uma prova da habilidade dos ferreiros indianos!"
 building_type_iron_pillar_of_dhar_01:0 "A Borda do Pilar de Ferro"
 building_type_iron_pillar_of_dhar_01_desc:0 " O Pilar de Ferro de Déli foi construído com as armas derretidas de um exército inteiro. O acabamento é realmente incrível e trará glória à dinastia que o possui."
 building_type_ise_jingu_01:0 "$building_ise_jingu_01$"
 building_type_ise_jingu_01_desc:0 "$building_ise_jingu_01_desc$"
 building_type_itoigawa_mines_01:0 "Minas de Jade de Itoigawa"
 building_type_itoigawa_mines_01_desc:0 "O rio Kotakigawa atravessa o desfiladeiro na base do Monte Myojo e é rico em grandes depósitos de jade. Esses depósitos produzem algumas das jades mais requintadas da região e além, encantando o olhar com sua vibrante cor verde."
 building_type_itsukushima_jinja_01:0 "$building_itsukushima_jinja_01$"
 building_type_itsukushima_jinja_01_desc:0 "$building_itsukushima_jinja_01_desc$"
 building_type_jiaodong_mines_01:0 "Minas de Jiaodong"
 building_type_jiaodong_mines_01_desc:0 "Eventualmente uma das principais regiões mineradoras da China, a península de Jiaodong é a fonte de vastas quantidades de ouro, esperando para ser plenamente explorada."
 building_type_jizu_shan_temples_01:0 "$building_jizu_shan_temples_01$"
 building_type_jizu_shan_temples_01_desc:0 "$building_jizu_shan_temples_01_desc$"
 building_type_jousting_lists_01:0 "Motivos de Justa"
 building_type_jousting_lists_01_desc:0 " Por ter um terreno dedicado para justas, mais montadores e cavaleiros são incentivados a treinar e se juntar às bandeiras."
 building_type_jvari_monastery:0 "$building_jvari_monastery$"
 building_type_jvari_monastery_desc:0 "$building_jvari_monastery_desc$"
 building_type_kaibao_mines_01:0 "As Minas de Kaibao"
 building_type_kaibao_mines_01_desc:0 "Em uma região com sede insaciável por cunhagem, sempre há necessidade de minas de prata. Esta área forneceu matéria-prima às casas da moeda imperiais por gerações."
 building_type_kaifeng_palace_01:0 "$building_kaifeng_palace_01$"
 building_type_kaifeng_palace_01_desc:0 "$building_kaifeng_palace_01_desc$"
 building_type_kassiopi_castle:0 "$building_kassiopi_castle$"
 building_type_kassiopi_castle_desc:0 "$building_kassiopi_castle_desc$"
 building_type_khajuraho_01:0 "O Conjunto de Templos de Khajuraho"
 building_type_khajuraho_01_desc:0 " Os templos de Khajuraho são dedicados à coexistência entre hindus e jainistas, onde suas diversas visões religiosas são celebradas. As paredes do templo são cobertas com arte e esculturas intrincadas, tornando o lugar verdadeiramente resplandecente e atraente para peregrinos e acadêmicos."
 building_type_khetri_mines_01:0 "As Minas de Cobre de Khetri"
 building_type_khetri_mines_01_desc:0 "As colinas de Khetri contêm alguns dos depósitos de cobre mais extensamente explorados na Índia e têm sido uma fonte de trabalho de cobre por tanto tempo."
 building_type_khiva_bazaar_01:0 "$building_khiva_bazaar_01$"
 building_type_khiva_bazaar_01_desc:0 "$building_khiva_bazaar_01_desc$"
 building_type_kofuku_ji_01:0 "$building_kofuku_ji_01$"
 building_type_kofuku_ji_01_desc:0 "$building_kofuku_ji_01_desc$"
 building_type_koganeyama_mines_01:0 "$building_koganeyama_mines_02$"
 building_type_koganeyama_mines_01_desc:0 "$building_koganeyama_mines_01_desc$"
 building_type_kollur_mines_01:0 "As Minas de Kollur"
 building_type_kollur_mines_01_desc:0 " As minas de Kollur exploram a maior fenda de diamantes de todo o subcontinente indiano. O trabalho é extremamente perigoso, mas as riquezas são inimagináveis."
 building_type_konasamudram_mines_01:0 "Minas de Konasamudram"
 building_type_konasamudram_mines_01_desc:0 "No norte de Telingana, o ferro está frequentemente disponível em pedaços muito próximos à superfície e pode ser facilmente minerado em grandes quantidades. O que é excepcional, no entanto, é a alta qualidade do ferro, que é incomparável no subcontinente e reconhecida além das fronteiras da Índia."
 building_type_kora_kora_yards_01:0 "Estaleiros Kora-Kora"
 building_type_kora_kora_yards_01_desc:0 "Galpões e rampas de clãs para canoas de guerra com balancins."
 building_type_krakatoa_01:0 "$building_krakatoa_01$"
 building_type_krakatoa_01_desc:0 "$building_krakatoa_01_desc$"
 building_type_kremnica_mines_01:0 "As Minas de Kremnica"
 building_type_kremnica_mines_01_desc:0 " As montanhas Kremnican são abundantes em ouro. Com sangue, suor e a ajuda de algumas centenas de mineiros alemães experientes, esse ouro será cunhado em Florins em pouco tempo!"
 building_type_kutna_hora_mines_01:0 "A Mina de Kutná Hora"
 building_type_kutna_hora_mines_01_desc:0 " A mina Kutná Hora é uma grande mina de prata localizada nas terras do Mosteiro de Sedlec. Com o apoio dos Abades locais #italic (e mineiros Alemães)#! a indústria na área está prosperando."
 building_type_lahur_bazaar_01:0 "$building_lahur_bazaar_01$"
 building_type_lahur_bazaar_01_desc:0 "$building_lahur_bazaar_01_desc$"
 building_type_lantian_mines_01:0 "Minas de Jade de Lantian"
 building_type_lantian_mines_01_desc:0 "As colinas de Lantian têm sido uma fonte de jade de alta qualidade por milhares de anos. Essa pedra pálida, historicamente esculpida em selos imperiais e celebrada por poetas da dinastia Tang, é valorizada não por sua abundância, mas por sua beleza distinta e status."
 building_type_leisure_palace_01:0 "Palácios de Lazer"
 building_type_leisure_palace_01_desc:0 " Embora ficar em um castelo suntuosamente exuberante é bom, ter mais alguns para escolher nunca é demais."
 building_type_leshan_giant_buddha_01:0 "$building_leshan_giant_buddha_01$"
 building_type_leshan_giant_buddha_01_desc:0 "$building_leshan_giant_buddha_01_desc$"
 building_type_lhasa_market_01:0 "$building_lhasa_market_01$"
 building_type_lhasa_market_01_desc:0 "$building_lhasa_market_01_desc$"
 building_type_liangzhe_mines_01:0 "As Minas de Liangzhe"
 building_type_liangzhe_mines_01_desc:0 "Uma importante região de mineração de prata por séculos, as minas de Liangzhe ainda possuem muitas veias a serem exploradas."
 building_type_lingyin_temple_01:0 "$building_lingyin_temple_01$"
 building_type_lingyin_temple_01_desc:0 "$building_lingyin_temple_01_desc$"
 building_type_liuhe_pagoda_01:0 "$building_liuhe_pagoda_01$"
 building_type_liuhe_pagoda_01_desc:0 "$building_liuhe_pagoda_01_desc$"
 building_type_lize_academy_01:0 "$building_lize_academy_01$"
 building_type_lize_academy_01_desc:0 "$building_lize_academy_01_desc$"
 building_type_logging_camps_01:0 "Silvicultura"
 building_type_logging_camps_01_desc:0 " Grandes quantidades de madeira, resina, carvão e outros recursos são colhidos dessas florestas, proporcionando uma excelente fonte próxima de material de construção para as cidades vizinhas."
 building_type_london_bridge_01:0 "Ponte de Londres"
 building_type_london_bridge_01_desc:0 "Existem pontes sobre o Rio Tâmisa desde tempos imemoriais, mas esta — feita de poderosa pedra — se ergue mais grandiosa que todas as anteriores. As correntes turbulentas abaixo levaram à aceitação comum de que a ponte é para que homens sábios a atravessem e para que tolos passem por baixo."
 building_type_longhouses_01:0 "Salas de Reunião"
 building_type_longhouses_01_desc:0 " Chefes tribais, anciãos e senhores da guerra, todos conferem no grande salão ao tomar decisões. Os poderosos salões trazem prestígio a quem quer que seja o anfitrião do encontro"
 building_type_lund_cathedral_01:0 "Catedral de Lund"
 building_type_lund_cathedral_01_desc:0 "A Catedral de Lund é uma magnífica igreja ricamente decorada com esculturas de pedra. Construída com influências da arquitetura românica, a igreja tem muitas semelhanças com igrejas na Alemanha. O edifício é dedicado a São Lourenço, que é o santo padroeiro de Lund."
 building_type_maharloo_lake_01:0 "Lago Maharloo"
 building_type_maharloo_lake_01_desc:0 "Embora este lago sazonal às vezes seja apenas um deserto salgado, no meio do verão suas águas alcançam uma tonalidade exuberante, avermelhada e pálida. Jovens poetas se reúnem na margem para contemplar a estranha água e ponderar sobre a beleza e os mistérios da Terra."
 building_type_maiden_tower:0 "$building_maiden_tower$"
 building_type_maiden_tower_desc:0 "$building_maiden_tower_desc$"
 building_type_mali_mines_01:0 "As Minas de Ouro de Mali"
 building_type_mali_mines_01_desc:0 " As minas de Mali estão realmente transbordando de ouro. Riqueza sem fim flui de suas profundezas para os tesouros dos governantes locais, que se adornam com o metal precioso."
 building_type_mandala_capital_01:0 "Complexo do Templo Capital"
 building_type_mandala_capital_01_desc:0 "Este [great_project|E] não é apenas um templo. É um testemunho de nossa coragem. De nossas conquistas. De nossa #EMP grandeza#!. Um templo como este simboliza o domínio e a benevolência de nosso divino e poderoso Devaraja."
 building_type_maoshan_academy_01:0 "$building_maoshan_academy_01$"
 building_type_maoshan_academy_01_desc:0 "$building_maoshan_academy_01_desc$"
 building_type_march_01:0 "Marchas"
 building_type_march_01_desc:0 " Os senhores da marcha protegem as fronteiras com fortificações e guarnições locais."
 building_type_market_villages_01:0 "Mercados"
 building_type_market_villages_01_desc:0 " Uma série de pequenas aldeias mercantis surgiu em torno das partes mais conhecidas dessas terras. Aqui, os homens da tribo negociam e barganham com mercadores viajantes."
 building_type_megalith_01:0 "Megalito"
 building_type_megalith_01_desc:0 "Esta estrutura é uma disposição ao ar livre de pedras normalmente alinhadas com estrelas e constelações. Fé que acredita em construções megalíticas fornecem locais de adoração regulares e de baixo custo para os fiéis, atraindo viajantes e peregrinos."
 building_type_meteora_01:0 "Meteora"
 building_type_meteora_01_desc:0 "Meteora é o nome dado pelos locais a uma deslumbrante formação rochosa feita de pilares naturais que se elevam ao lado do Monte Pidnos."
 building_type_military_academy_01:0 "Academias Militares"
 building_type_military_academy_01_desc:0 " Instalações dedicadas ao treinamento de oficiais e cavaleiros, melhorando sua eficiência no combate."
 building_type_military_camps_01:0 "Acampamentos de Milícia"
 building_type_military_camps_01_desc:0 "Um simples campo de treinamento onde infantaria levemente armada é preparada para a guerra."
 building_type_minarets_and_remains_of_jam_01:0 "Minarete de Jam"
 building_type_minarets_and_remains_of_jam_01_desc:0 "Esta estrutura se ergue sobre o vale do rio Hari, coberta de estuque e decorações em azulejo esmaltado e faixas alternadas de caligrafia, um monumento requintado ao que a fé e a riqueza podem alcançar mesmo nessas terras remotas e acidentadas."
 building_type_mogok_mines_01:0 "As Minas do Vale de Mogok"
 building_type_mogok_mines_01_desc:0 "O Vale de Mogok é famoso por seus rubis e safiras, além de pedras menos valiosas como espinélio e granada.\nO que torna o 'vale dos rubis' ainda mais notável do que a quantidade é a qualidade das pedras. À medida que as pedras vermelho-profundo são extraídas da terra, elas brilham sob o sol escaldante de uma forma que não tem igual em nenhum outro lugar."
 building_type_monastic_schools_01:0 "Mosteiros"
 building_type_monastic_schools_01_desc:0 " Esta escola ensina muitas disciplinas e é um raro centro de ensino superior, mas os alunos matriculados aqui estudam principalmente para se prepararem para futuras carreiras no clero."
 building_type_mount_apo_01:0 "$building_mount_apo_01$"
 building_type_mount_apo_01_desc:0 "$building_mount_apo_01_desc$"
 building_type_mount_athos_01:0 "Monte Athos"
 building_type_mount_athos_01_desc:0 "Segundo a tradição, a Virgem Maria estava navegando da Palestina para Chipre para visitar o amigo de seu filho, Lázaro, que estava evangelizando a ilha, quando o navio foi desviado e forçado a aterrissar aqui, próximo ao Monte Athos. Quando Maria desembarcou, ela ficou maravilhada com a beleza natural da área, então abençoou-a e pediu-a como seu próprio jardim. Uma voz do Céu atendeu seu desejo; desde então, a área é considerada sagrada e é proibida a qualquer outra mulher."
 building_type_mount_baekdu_01:0 "Monte Baekdu"
 building_type_mount_baekdu_01_desc:0 "O elevado pico do Monte Baekdu é considerado a origem de todas as montanhas da península coreana, e suas alturas são um local sagrado entre as muitas fés e povos da região."
 building_type_mount_damavand_01:0 "Monte Damavand"
 building_type_mount_damavand_01_desc:0 "Um grande pico coberto de neve mergulhado em antigas lendas, diz-se que o Monte Damavand é a prisão do monstruoso tirano Zahhāk, onde ele permanecerá até o fim do mundo. Muitos heróis antigos realizaram grandes feitos nesta montanha e para aqueles que viajam para lá hoje, sua poderosa presença parece tocar suas almas. Um vulcão adormecido, suas encostas são pontilhadas por fontes termais onde viajantes cansados podem parar e relaxar, ponderando sobre as proezas dos antigos."
 building_type_mount_fuji_01:0 "Monte Fuji"
 building_type_mount_fuji_01_desc:0 "O solitário e imponente pico nevado do Fujisan marca a passagem para o leste do Japão e é uma visão famosa em todas as ilhas, atraindo viajantes e peregrinos, e trazendo serenidade a todos que o contemplam. Entre as mais sagradas montanhas xintoístas, o Fuji é lar de #EMP Konohanasakuya-hime#!, deusa dos vulcões, das flores de cerejeira e da efêmera delicadeza da vida."
 building_type_mozu_tombs:0 "$building_mozu_tombs$"
 building_type_mozu_tombs_desc:0 "$building_mozu_tombs_desc$"
 building_type_muaro_jambi_01:0 "$building_muaro_jambi_01$"
 building_type_muaro_jambi_01_desc:0 "$building_muaro_jambi_01_desc$"
 building_type_murex_farm_01:0 "Pesqueiros de Murex"
 building_type_murex_farm_01_desc:0 "O púrpura imperial está sempre em alta demanda. Os caramujos dos quais este luxuoso corante é feito são colhidos e processados aqui."
 building_type_nalanda_university:0 "A Universidade de Nalanda"
 building_type_nalanda_university_desc:0 " $building_type_generic_university_desc$\n\nA Universidade de Nalanda é um importante centro de estudos védicos e atrai estudantes de lugares distantes como o Tibete e a China."
 building_type_nanhua_temple_01:0 "$building_nanhua_temple_01$"
 building_type_nanhua_temple_01_desc:0 "$building_nanhua_temple_01_desc$"
 building_type_nishapur_mines_01:0 "As Minas de Nishapur"
 building_type_nishapur_mines_01_desc:0 "A turquesa é uma pedra que pode ser encontrada em muitos lugares, mas em nenhum lugar ela é tão abundante e de alta qualidade quanto nas montanhas perto de Nishapur. As pedras também são muito acessíveis, mesmo sem poços muito profundos."
 building_type_notre_dame_01:0 "$building_notre_dame_01$"
 building_type_notre_dame_01_desc:0 " Também conhecida como 'Nossa Senhora de Paris', esta magnífica catedral é dedicada à Virgem Maria. Construída em estilo gótico, impressiona com inúmeras estátuas e enormes rosáceas coloridas.\n\nOn por fora, a catedral é coberta com esculturas que recontam vividamente as histórias bíblicas, permitindo que até camponeses analfabetos entendam a glória de Deus!"
 building_type_oath_faithful_building_01:0 "Monumentos Religiosos"
 building_type_oath_faithful_building_01_desc:0 "O soberano destas terras jurou, em seu coronamento, prover os fiéis."
 building_type_oath_poor_building_01:0 "Casas de Caridade Oficiais"
 building_type_oath_poor_building_01_desc:0 "O soberano destas terras jurou, em seu coronamento, prover os pobres."
 building_type_oath_warriors_building_01:0 "Concessões Marciais"
 building_type_oath_warriors_building_01_desc:0 "O soberano destas terras jurou, em seu coronamento, prover os guerreiros."
 building_type_offas_dyke_01:0 "O Dique de Offa"
 building_type_offas_dyke_01_desc:0 " O Dique de Offa, que é um longo fosso flanqueado por uma parede de terra, foi construído pelo rei anglo-saxão da Mércia para defender a fronteira com o País de Gales. Este trabalho de terraplenagem oferece uma vantagem para quem está ao lado da parede, já que qualquer atacante tem que lutar uma batalha difícil a partir da vala."
 building_type_orchards_01:0 "Pomares"
 building_type_orchards_01_desc:0 " Graças às propriedades únicas do solo, esses pomares produzem frutas e bagas particularmente doces e deliciosas."
 building_type_outposts_01:0 "Postos Avançados"
 building_type_outposts_01_desc:0 " Uma série de postos avançados contorna todos os assentamentos significativos nesta província, fornecendo um sistema de alerta precoce em caso de invasões ou ataques de animais."
 building_type_paddy_fields_01:0 "Campos de Arroz"
 building_type_paddy_fields_01_desc:0 "O mundo marcha sobre o próprio estômago. O humilde grão de arroz pode parecer insignificante sozinho, mas tem alimentado nações desde tempos imemoriais."
 building_type_pagoda_of_fogong_temple_01:0 "$building_pagoda_of_fogong_temple_01$"
 building_type_pagoda_of_fogong_temple_01_desc:0 "$building_pagoda_of_fogong_temple_01_desc$"
 building_type_palace_of_aachen_01:0 "$building_palace_of_aachen_01$"
 building_type_palace_of_aachen_01_desc:0 " O Palácio de Aquisgrão foi escolhido por Carlos Magno para ser o centro do poder do Império Carolíngio. Serviu a um propósito político e religioso, e ainda é um excelente local para receber reuniões importantes."
 building_type_palace_of_ctesiphon_01:0 "Ruínas do Palácio de Ctesifonte"
 building_type_palace_of_ctesiphon_01_desc:0 "Este antigo edifício foi o assento cerimonial dos reis dos reis sassânidas, mas o silêncio caiu sobre seus salões outrora gloriosos, e as flores nos jardins não florescem mais. Muito material foi levado para a fundação de Bagdá, e o povo se dispersou. No entanto, um esplendor inquietante permanece, a glória persistente do passado."
 building_type_palace_of_ctesiphon_02:0 "Grande Palácio de Ctesifonte"
 building_type_palace_of_ctesiphon_02_desc:0 "Agora reconstruído, o assento dos reis antigos foi restaurado em toda a sua glória. Os jardins florescem de novo, e os salões são novamente preenchidos com música e esplendor. Visitantes vêm de perto e de longe para contemplar o grande arco da sala do trono aberto, uma maravilha há muito esquecida do mundo antigo, que finalmente encontrou seu lugar nas canções."
 building_type_palisades_01:0 "Paliçada"
 building_type_palisades_01_desc:0 "Camadas de palisades de madeira protegem os assentamentos tribais dispersos, protegendo-os de ameaças simples como animais selvagens ou ataques menores."
 building_type_pansjhir_mines_01:0 "As Minas de Pansjhir"
 building_type_pansjhir_mines_01_desc:0 "O vale de Pansjhir tem sido uma conhecida fonte de prata e esmeraldas desde os dias de Alexandre, o Grande. Hindus, budistas e eventualmente dinastias muçulmanas mineraram prata e cunharam suas moedas nesta área."
 building_type_parthenon:0 "$building_parthenon$"
 building_type_parthenon_desc:0 "$building_parthenon_desc$"
 building_type_pastures_01:0 "Pastagens de Gado"
 building_type_pastures_01_desc:0 " Uma parte significativa desta província é dedicada à pecuária e pastagem para rebanhos de animais pastoris."
 building_type_patras_castle:0 "$building_patras_castle$"
 building_type_patras_castle_desc:0 "$building_patras_castle_desc$"
 building_type_peat_quarries_01:0 "Fazendas Pantanosas"
 building_type_peat_quarries_01_desc:0 " Embora os pântanos nunca ofereçam as mesmas oportunidades de cultivo que as planícies, um excesso sazonal de vegetação permite a criação de animais. Também existem oportunidades para extrair turfa e sal."
 building_type_petra_01:0 "Petra"
 building_type_petra_01_desc:0 " A cidade de Petra é uma verdadeira maravilha do mundo antigo. Esculpida diretamente na rocha cor de rosa de ocorrência natural, a cidade é uma curiosidade que intriga até o mais poderoso sultão."
 building_type_phnom_dek_mines_01:0 "Minas de Phnom Dek"
 building_type_phnom_dek_mines_01_desc:0 "Phnom Dek, ou 'Montanha de Ferro', é uma das fontes mais abundantes de ferro no Sudeste Asiático, um metal que de outra forma é raro nesta parte do mundo. Nas forjas daqui, armas e ferramentas podem ser produzidas para armar um império."
 building_type_phocaea_mines_01:0 "As Minas de Alúmen de Focéia"
 building_type_phocaea_mines_01_desc:0 "Os depósitos de alúmen de Focéia estão entre os mais abundantes do mundo conhecido. O raro alúmen é muito procurado por tintureiros e fabricantes de tecidos em todo o continente europeu."
 building_type_plain_of_jars_01:0 "$building_plain_of_jars_01$"
 building_type_plain_of_jars_01_desc:0 "$building_plain_of_jars_01_desc$"
 building_type_plantations_01:0 "Agricultura do Deserto"
 building_type_plantations_01_desc:0 " Essas plantações se concentram no cultivo de frutas e vegetais que são resistentes o suficiente para suportar o clima rigoroso."
 building_type_pleasure_dome:0 "$building_pleasure_dome$"
 building_type_pleasure_dome_desc:0 "$building_pleasure_dome_desc$"
 building_type_po_klong_garai_01:0 "$building_po_klong_garai_01$"
 building_type_po_klong_garai_01_desc:0 "$building_po_klong_garai_01_desc$"
 building_type_powder_magazine_01:0 "Fábrica de Pólvora"
 building_type_powder_magazine_01_desc:0 "A pólvora exige produção, armazenamento e manutenção dedicados para permanecer funcional. Para recrutar [GetMaA('handgunners').GetName] e outras unidades que dependem dessa poderosa força, edifícios especializados devem ser construídos."
 building_type_qanats_01:0 "$building_qanats_06$"
 building_type_qanats_01_desc:0 "$building_qanats_05_desc$"
 building_type_qianling_mausoleum_01:0 "$building_qianling_mausoleum_01$"
 building_type_qianling_mausoleum_01_desc:0 "$building_qianling_mausoleum_01_desc$"
 building_type_quanzhou_seaport_01:0 "$building_quanzhou_seaport_01$"
 building_type_quanzhou_seaport_01_desc:0 "$building_quanzhou_seaport_01_desc$"
 building_type_quarries_01:0 "Pedreiras"
 building_type_quarries_01_desc:0 " As montanhas desta província proporcionam à construção local um excelente abastecimento de material de construção."
 building_type_rainbow_mountains_01:0 "Montanhas Arco-íris"
 building_type_rainbow_mountains_01_desc:0 "O Criador parece ter pintado essas cristas em um arco-íris de cores. Faixas de vermelho, branco, amarelo, cinza, laranja e cores ainda mais estranhas tingem a paisagem rochosa e tranquila. Os governantes locais frequentemente levam convidados para caçar aqui, para ver essa maravilha sublime."
 building_type_rammelsberg_mines_01:0 "A Mina de Rammelsberg"
 building_type_rammelsberg_mines_01_desc:0 " Na base do Monte Rammelsberg há uma mina de prata lucrativa e sempre procurada."
 building_type_ramparts_01:0 "Fortes Florestais"
 building_type_ramparts_01_desc:0 " Essas fortificações são construídas de forma que façam parte da floresta que protegem. Os exércitos em avanço encontram-se impedidos por fortificações, mas também presos na vegetação rasteira."
 building_type_ratnapura_mines_01:0 "As Minas de Ratnapura"
 building_type_ratnapura_mines_01_desc:0 "Ratnapura, a cidade das Gemas, é uma das fontes mais significativas do mundo de rubis e safiras. Por centenas de anos, essas riquezas têm sido mineradas e negociadas com comerciantes do subcontinente indiano, Sudeste Asiático e China."
 building_type_regimental_grounds_01:0 "Campos Regimentais"
 building_type_regimental_grounds_01_desc:0 " Os campos regimentais não apenas contém vários edifícios projetados para abrigar grandes quantidades de milícias, mas também está conectado a uma vasta faixa de terra para que eles possam treinar para a guerra."
 building_type_rock_of_gibraltar_01:0 "Rochedo de Gibraltar"
 building_type_rock_of_gibraltar_01_desc:0 "O monolítico Rochedo de Gibraltar tem vista para um estreito que é a porta de entrada para o Mar Mediterrâneo. Na antiguidade, era um dos Pilares de Hércules, considerado como o fim do mundo conhecido. Olhando para ele agora, não se pode deixar de se perguntar o que há além."
 building_type_roman_wall_of_lugo_01:0 "Muralhas Romanas de Lugo"
 building_type_roman_wall_of_lugo_01_desc:0 "Construídas pelos romanos há muito tempo, as grandes muralhas de Lugo permanecem como um espetáculo impressionante. Peregrinos passam por suas cinco portas na estrada para Santiago de Compostela, tornando a jornada ainda mais profunda."
 building_type_royal_armory_01:0 "Arsenais Reais"
 building_type_royal_armory_01_desc:0 "Armerias financiadas pela coroa garantem um suprimento constante e manutenção de armas em funcionamento para o exército."
 building_type_royal_forest_01:0 "Reservas Reais"
 building_type_royal_forest_01_desc:0 " Uma floresta real é uma fonte valiosa de riqueza, permitindo que você ignore a lei da terra em uma província, tire os direitos dos moradores e depois os venda de volta. Nem é preciso dizer que a caça também é excelente."
 building_type_royal_garden_01:0 "Jardins Reais"
 building_type_royal_garden_01_desc:0 "Poucos lugares permitem que as pessoas relaxem e socializem tão bem quanto um belo jardim. Embora um jardim pequeno e pessoal seja suficiente para a maioria, apenas as criações mais espetaculares são boas o suficiente para os ricos e poderosos!"
 building_type_rudnik_mines_01:0 "As Minas de Rudnik"
 building_type_rudnik_mines_01_desc:0 "Rudnik, a montanha das Minas, é rica em prata, chumbo e cobre e tem visto mineração contínua por centenas de anos."
 building_type_sacred_pool_01:0 "Lago Sagrado"
 building_type_sacred_pool_01_desc:0 "Um grande corpo d'água pode ter muitos propósitos; mas é claro que, com o passar do tempo e a mudança das estações, os fenômenos visuais refletidos na piscina às vezes se tornam verdadeiramente transcendentes. Fonte de fortificação e hidratação, essas piscinas são uma parte importante da vida cotidiana de seus habitantes."
 building_type_sado_mines_01:0 "$building_sado_mines_02$"
 building_type_sado_mines_01_desc:0 "$building_sado_mines_01_desc$"
 building_type_saint_catherine:0 "$building_saint_catherine$"
 building_type_saint_catherine_desc:0 "$building_saint_catherine_desc$"
 building_type_saint_lazarus:0 "$building_saint_lazarus$"
 building_type_saint_lazarus_desc:0 "$building_saint_lazarus_desc$"
 building_type_sankore_university:0 "A Universidade de Sancoré"
 building_type_sankore_university_desc:0 " $building_type_generic_university_desc$\n\nA Universidade de Sancoré, que começou como uma mesquita, se transformou em um centro de aprendizagem depois de adquirir uma riqueza de livros de comerciantes viajantes."
 building_type_schwaz_mines_01:0 "A Mina de Schwaz"
 building_type_schwaz_mines_01_desc:0 " A mina de prata Schwaz fica na base das montanhas Kellerjoch e Eiblschrofen, no meio de um vale. A oportunidade de mineração significa que muitas pessoas são atraídas para a área."
 building_type_scriptorium_01:0 "Scriptorium"
 building_type_scriptorium_01_desc:0 "Os scriptoriums oferecem um lugar de aprendizado para os santos e os educados registrarem sua sabedoria em papel para toda a eternidade."
 building_type_shah_i_zinda_01:0 "Shah-i-Zinda"
 building_type_shah_i_zinda_01_desc:0 "O nome deste complexo de túmulos significa #italic O Rei Vivo#!, referindo-se a Quham ibn Abbas, primo de Maomé, que se diz estar sepultado aqui. Os mausoléus são bastante pequenos e humildes, mas possuem uma beleza solene que faz com que muitos permaneçam entre os túmulos silenciosos, para ponderar sobre a transitoriedade da vida."
 building_type_shaolin_monastery_01:0 "$building_shaolin_monastery_01$"
 building_type_shaolin_monastery_01_desc:0 "$building_shaolin_monastery_01_desc$"
 building_type_shigu_academy_01:0 "$building_shigu_academy_01$"
 building_type_shigu_academy_01_desc:0 "$building_shigu_academy_01_desc$"
 building_type_shwedagon_pagoda_01:0 "O Pagode Shwedagon"
 building_type_shwedagon_pagoda_01_desc:0 " O Pagode Shwedagon é uma estupa budista sagrada construída pelo povo Mon por volta do ano 500. Ele abriga muitas relíquias famosas, como o cajado de Kakusandha, o filtro de água de Koṇāgamana, um pedaço do manto de Kassapa e oito fios de cabelo da cabeça de Gautama."
 building_type_siderokausia_mines_01:0 "As Minas de Siderokausia"
 building_type_siderokausia_mines_01_desc:0 " As minas da Siderokausia são ricas em prata e ouro, e são exploradas por doze aldeias separadas, cada uma administrando uma parte das minas."
 building_type_siege_works_01:0 "Obras de Cerco"
 building_type_siege_works_01_desc:0 " Trabalhos de cerco dedicados permitem ao governante colocar em campo e manter armas de cerco de qualidade superior."
 building_type_siena_university:0 "A Universidade de Siena"
 building_type_siena_university_desc:0 " $building_type_generic_university_desc$\n\nA Universidade de Siena e os maestri que trabalham nela são inteiramente financiados por impostos do próprio Siena, mais especificamente um imposto cobrado de quem aluga quartos para seus alunos."
 building_type_smiths_01:0 "Ferrarias"
 building_type_smiths_01_desc:0 "Fundindo minério em fornalhas e martelando metal em formas desejadas, as ferrarias fornecem às comunidades vizinhas ferramentas e armas essenciais."
 building_type_sofia_ohrid:0 "$building_sofia_ohrid$"
 building_type_sofia_ohrid_desc:0 "$building_sofia_ohrid_desc$"
 building_type_soltaniyeh_01:0 "Cúpula de Soltaniyeh"
 building_type_soltaniyeh_01_desc:0 "Tanto templo quanto mausoléu, a grande escala e a simetria requintada deste edifício certamente inspirarão muitas grandes obras a surgir. Sua grande cúpula dupla é revestida de turquesa e é de uma escala tal que quase parece um desafio aos céus."
 building_type_special_greenhouse_01:0 "Monumento de Vidro"
 building_type_special_greenhouse_01_desc:0 " Este edifício é aparentemente excelente para o cultivo de vegetais."
 building_type_special_sicilian_parliament_01:0 "Parlamento"
 building_type_special_sicilian_parliament_01_desc:0 "$building_special_sicilian_parliament_01_desc$"
 building_type_spice_plantation_01:0 "Plantações de Especiarias"
 building_type_spice_plantation_01_desc:0 "As fragrâncias mais finas e os sabores mais delicados podem ser extraídos de plantas que crescem apenas em regiões muito específicas do mundo. Sua raridade e qualidade as tornam excepcionalmente lucrativas de produzir, se o solo puder sustentá-las."
 building_type_srebrenica_mines_01:0 "Mina de Srebrenica"
 building_type_srebrenica_mines_01_desc:0 "Minada na antiguidade por seus enormes depósitos de prata, Srebrenica, a Cidade de Prata, está pronta para ser explorada novamente usando técnicas modernas de mineração."
 building_type_stables_01:0 "Estábulos"
 building_type_stables_01_desc:0 "Rounceys, cavalos de carga e outros animais de carga precisam de um prédio dedicado. Estábulos também garantem que montarias frescas estejam disponíveis para quem puder pagar por elas."
 building_type_stilted_granaries_01:0 "Celeiros Sobre Estacas"
 building_type_stilted_granaries_01_desc:0 "Celeiros elevados sobre quatro ou mais pilares, à prova de ratos, perfeitos para armazenar tributos e prover bandos guerreiros."
 building_type_stonehenge_01:0 "O Stonehenge"
 building_type_stonehenge_01_desc:0 " Stonehenge é uma estrutura antiga e mística que inspirou muitos estudiosos. Ainda hoje, nestes tempos iluminados, homens eruditos de toda a Grã-Bretanha se reúnem para estudá-lo. Qual é realmente o seu propósito?"
 building_type_sumela_monastery_01:0 "Mosteiro de Sumela"
 building_type_sumela_monastery_01_desc:0 "As origens deste mosteiro, construído em um penhasco íngreme na Montanha Negra, são tão remotas que quase estão envoltas em mistério; segundo alguns, foi erguido pela ordem do Imperador Teodósio no século IV, mas a fonte sagrada e os antigos afrescos podem ser ainda mais antigos.\nA joia do mosteiro é um afresco da Mãe de Deus, que se diz ter sido pintado pelo próprio Apóstolo Lucas."
 building_type_sunday_bazaar_01:0 "Bazar de Domingo"
 building_type_sunday_bazaar_01_desc:0 "$building_sunday_bazaar_01_desc$"
 building_type_suvarnadvipa_mines_01:0 "As Minas de Suvarnadvipa"
 building_type_suvarnadvipa_mines_01_desc:0 "Também chamada de Ilha do Ouro, as cavernas das Montanhas Barisan contêm inúmeras veias do valioso mineral. Pequenos postos de mineração estão espalhados por suas encostas, cavando fundo e largo em busca do precioso ouro."
 building_type_swahili_port_lamu:0 "$building_swahili_port_lamu$"
 building_type_swahili_port_lamu_desc:0 "$building_swahili_port_lamu_desc$"
 building_type_swahili_port_mombasa:0 "$building_swahili_port_mombasa$"
 building_type_swahili_port_mombasa_desc:0 "$building_swahili_port_mombasa_desc$"
 building_type_swahili_port_pate:0 "$building_swahili_port_pate$"
 building_type_swahili_port_pate_desc:0 "$building_swahili_port_pate_desc$"
