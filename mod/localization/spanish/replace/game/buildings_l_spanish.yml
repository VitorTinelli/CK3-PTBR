 building_type_swahili_port_pemba_desc:0 "$building_swahili_port_pemba_desc$"
 building_type_swahili_port_pembas:0 "$building_swahili_port_pemba$"
 building_type_swahili_port_zanzibar:0 "$building_swahili_port_zanzibar$"
 building_type_swahili_port_zanzibar_desc:0 "$building_type_swahili_port_zanzibar_desc$"
 building_type_tada_mines_01:0 "$building_tada_mines_02$"
 building_type_tada_mines_01_desc:0 "$building_tada_mines_01_desc$"
 building_type_taghaza_mines_01:0 "A Salina de Taghaza"
 building_type_taghaza_mines_01_desc:0 "As Minas de Sal de Taghaza são o ponto de origem da maioria do sal do Magrebe e da África Ocidental."
 building_type_takkeda_mines_01:0 "Minas de Takkeda"
 building_type_takkeda_mines_01_desc:0 "As montanhas de Air possuem ricos depósitos de cobre e têm sido mineradas em Takkeda desde tempos pré-históricos."
 building_type_tax_assessor_01:0 "Repartições Fiscais"
 building_type_tax_assessor_01_desc:0 " Arrecadar dinheiro do campesinato é um empreendimento \"tributário\". Ao atribuir cargos a um grupo de funcionários responsáveis pela cobrança de impostos, temos a certeza de obter o que é devido!"
 building_type_temple_01:0 "Templo"
 building_type_temple_01_desc:0 " Um local de culto governado pelo clero, rodeado por uma cidade de camponeses fiéis."
 building_type_temple_citadel_01:0 "Cidadela do Templo"
 building_type_temple_citadel_01_desc:0 "Um lugar em partes iguais de adoração e proteção, enormes muralhas cercam esses terrenos sagrados."
 building_type_temple_of_uppsala_01:0 "Templo de Uppsala"
 building_type_temple_of_uppsala_01_desc:0 "O templo em Uppsala serve como um centro religioso para grande parte da Escandinávia. Uma árvore sagrada fica perto do templo, ao lado de um poço, semelhante à lendária Yggdrasil."
 building_type_the_colosseum_01:0 "O Coliseu"
 building_type_the_colosseum_01_desc:0 " O Coliseu é um dos maiores anfiteatros já construídos e já recebeu inúmeros espetáculos, como combates de gladiadores, caça a animais e até batalhas navais reconstruídas. Sua construção foi iniciada pelo imperador romano Vespasiano em 72 DC e concluída em 80 DC sob seu sucessor, Titus.\n\nDespite com sua história vibrante, seu uso principal hoje é a colheita de mármore e bronze para uso em outros lugares."
 building_type_the_friday_mosque_01:0 "A Mesquita de Sexta-feira"
 building_type_the_friday_mosque_01_desc:0 " A Mesquita de Sexta-feira, ou Mesquita Jame' de Isfahan, foi construído durante a dinastia omíada. Diz-se que o califa construiu pessoalmente um dos pilares da mesquita. Antes de se tornar uma mesquita, diz-se que costumava ser uma casa de culto para os Zoroastristas."
 building_type_the_great_wall_01:0 "$building_the_great_wall_01$"
 building_type_the_great_wall_01_desc:0 "$building_the_great_wall_01_desc$"
 building_type_the_great_wall_02:0 "$building_the_great_wall_01$"
 building_type_the_great_wall_02_desc:0 "$building_the_great_wall_02_desc$"
 building_type_the_great_wall_03:0 "$building_the_great_wall_01$"
 building_type_the_great_wall_03_desc:0 "$building_the_great_wall_03_desc$"
 building_type_the_great_wall_04:0 "$building_the_great_wall_01$"
 building_type_the_great_wall_04_desc:0 "$building_the_great_wall_04_desc$"
 building_type_the_great_wall_liaodong:0 "$building_the_great_wall_01$"
 building_type_the_great_wall_liaodong_desc:0 "$building_the_great_wall_04_desc$"
 building_type_the_great_wall_shanhai_pass:0 "$building_the_great_wall_01$"
 building_type_the_great_wall_shanhai_pass_desc:0 "$building_the_great_wall_04_desc$"
 building_type_the_pyramids_01:0 "As pirâmides"
 building_type_the_pyramids_01_desc:0 " As pirâmides, principalmente a de Quéops, são as maravilhas do mundo antigo. Vastos e impressionantes, eles realçam a imagem de qualquer governante que os controle."
 building_type_the_tower_of_london_01:0 "A Torre de Londres"
 building_type_the_tower_of_london_01_desc:0 " A Torre de Londres é um castelo que serve tanto como fortificação vital quanto como prisão. A torre central é chamada de 'Torre Branca' e abriga a classe dominante. A posição da Torre de Londres significa que é vital para a defesa de todo o Condado."
 building_type_theodosian_walls_01:0 "As Paredes Teodosianas"
 building_type_theodosian_walls_01_desc:0 " As Muralhas de Teodósio foram construídas durante o reinado do Imperador Teodósio II no início do século V, mas ainda permanecem algumas das fortificações mais formidáveis construídas por mãos humanas."
 building_type_tiantai_monasteries_01:0 "$building_tiantai_monasteries_01$"
 building_type_tiantai_monasteries_01_desc:0 "$building_tiantai_monasteries_01_desc$"
 building_type_tomb_of_cyrus_01:0 "Túmulo de Batsheba"
 building_type_tomb_of_cyrus_01_desc:0 "Este antigo túmulo de calcário branco diz-se ser o local de descanso de Batsheba, mãe do rei Salomão, exaltada por muitas fés. Mulheres cuidam do local e apenas mulheres são permitidas a entrar no interior escuro do túmulo. Raramente falam do que viram lá dentro. Diz-se que as águas próximas são abençoadas e podem curar aqueles que foram mordidos por cães raivosos."
 building_type_tower_of_hercules_01:0 "Farol de Hércules"
 building_type_tower_of_hercules_01_desc:0 "Este antigo farol é dito ter sido baseado em sua irmã mais famosa em Alexandria. Tendo guiado marinheiros por séculos incalculáveis, ele ainda é importante para o comércio costeiro da Galícia. Alguns afirmam que se pode vislumbrar a costa verde da Irlanda do topo desta torre solitária, mas ao olhar para fora, você vê apenas mar sem fim."
 building_type_tower_of_silence_01:0 "Grande Torre do Silêncio"
 building_type_tower_of_silence_01_desc:0 "Nossa fé nos ensina a dispor dos cadáveres dos fiéis justos, deixando-os para os animais e o céu aberto. Assim, a alma é mantida pura e a comunidade livre da corrupção da carne em decomposição.\n\nQuando os forasteiros não permitem nossos rituais, devemos construir estas torres para resguardar tais restos mortais e simbolizar nossa crença duradoura."
 building_type_trepca_mines_01:0 "As Minas de Trepča"
 building_type_trepca_mines_01_desc:0 "Localizada nas encostas de Kopaonik, Trepča é uma área que tem sido minerada por prata desde os tempos romanos. Embora tenha sido fechada no início da Idade Média, ainda possui depósitos muito ricos de metais preciosos."
 building_type_tribe_01:0 "Fortaleza Tribal"
 building_type_tribe_01_desc:0 " Um controle tribal simples, mas eficaz, montando guarda sobre uma aldeia tribal."
 building_type_trosky_castle_01:0 "$building_trosky_castle_01$"
 building_type_trosky_castle_01_desc:0 "$building_trosky_castle_01_desc$"
 building_type_tsushima_mines_01:0 "$building_tsushima_mines_02$"
 building_type_tsushima_mines_01_desc:0 "$building_tsushima_mines_01_desc$"
 building_type_turda_mines_01:0 "Minas de Sal de Turda"
 building_type_turda_mines_01_desc:0 "Os maciços de sal de Turda têm sido centrais para a economia da Transilvânia por séculos. As minas e o mercado de sal continuam sendo uma grande fonte de renda para a região."
 building_type_university_01:0 "Universidade"
 building_type_university_01_desc:0 "Um local de aprendizado superior para aqueles com influência e ouro suficientes para obter admissão."
 building_type_verespatak_mines_01:0 "As Minas de Verespatak"
 building_type_verespatak_mines_01_desc:0 "A Transilvânia tem sido minerada por ouro desde os tempos romanos e continua propícia para uma reexploração contemporânea."
 building_type_vihara_halls_01:0 "Salões Vihara"
 building_type_vihara_halls_01_desc:0 "Um edifício monástico, construído para abrigar monges durante a estação das chuvas, é um local de meditação silenciosa, oração e recuperação. Expandir os salões contribui para o vigor e a devoção dos seguidores religiosos que ali residem."
 building_type_visby_ringmur_01:0 "Visby Ringmur"
 building_type_visby_ringmur_01_desc:0 " As Muralhas de Visby protege a cidade de ameaças externas, como invasores ou dinamarqueses. Ele também afasta com eficiência os coletores de impostos enviados por Gotland! Para obter as riquezas internas, os assaltantes devem primeiro lidar com uma infinidade de torres, todas tripuladas por arqueiros."
 building_type_walls_of_benin_01:0 "Muros do Benim"
 building_type_walls_of_benin_01_desc:0 " As Muralhas do Benim são uma série massiva de terraplenagens #low (Iya na linguagem Edo)#!, que circundam todo o Benim. As paredes são constituídas por uma estrutura de vala e dique, com fosso interior e muralha exterior."
 building_type_walls_of_genoa_01:0 "As Muralhas de Gênova"
 building_type_walls_of_genoa_01_desc:0 " As Muralhas de Gênova foram construídas no século 9, depois que a cidade recebeu uma autonomia significativa. As paredes, juntamente com a proteção da linha de costa, permitem que a área se desenvolva e prospere."
 building_type_wantilan_01:0 "Wantilan"
 building_type_wantilan_01_desc:0 "Grandes salões e pavilhões comunitários abertos, sem paredes, usados para assembleias, rituais e apresentações."
 building_type_war_camps_01:0 "Campos de Guerra"
 building_type_war_camps_01_desc:0 " Guerreiros tribais ferozes se reúnem nos campos de guerra quando o chifre os chama para a guerra. Mesmo em tempos de paz, eles podem ser encontrados lutando, preparando-se para a inevitabilidade do conflito."
 building_type_warrior_lodges_01:0 "Salões de Guerreiros"
 building_type_warrior_lodges_01_desc:0 "Laços pessoais forjados nos campos de batalha merecem salões de comemoração, onde guerreiros do passado podem compartilhar suas histórias maravilhosas e ainda plausíveis com jovens sonhadores."
 building_type_watchtowers_01:0 "Torres de Vigia"
 building_type_watchtowers_01_desc:0 " Várias grandes torres de vigilância vigiam o camponês trabalhador, proporcionando excelentes pontos de observação para os arqueiros."
 building_type_water_temples_01:0 "Templos d'Água Subak"
 building_type_water_temples_01_desc:0 "Cooperativas de irrigação voltadas para o interior, ancoradas por santuários e templos da água; calendários rituais coordenam o plantio e a manutenção dos canais."
 building_type_watermills_01:0 "Moinhos de Água"
 building_type_watermills_01_desc:0 "Moinhos de água transformam todos os tipos de movimento da água, desde marés até cachoeiras, em rotação usada para moer, serrar, esmagar e fulgurar. Permissões para operar um moinho de água são uma fonte fácil e confiável de imposto adicional para o proprietário da propriedade."
 building_type_waterworks_01:0 "Gestão da Água"
 building_type_waterworks_01_desc:0 "A água é a base sobre a qual toda vida depende. Manter um fornecimento constante e utilizá-la de forma eficiente é essencial para sustentar um reino forte e um governo próspero."
 building_type_white_deer_grotto_academy_01:0 "$building_white_deer_grotto_academy_01$"
 building_type_white_deer_grotto_academy_01_desc:0 "$building_white_deer_grotto_academy_01_desc$"
 building_type_wind_furnace_01:0 "Fornos a Vento"
 building_type_wind_furnace_01_desc:0 "Localizados em terrenos montanhosos na costa do oceano, onde os ventos de monção primeiro atingem a terra, os fornos a vento fundem aço mundialmente famoso de qualidade impecável."
 building_type_windmills_01:0 "Moinhos de Vento"
 building_type_windmills_01_desc:0 "Os moinhos de vento são localizados em áreas onde os ventos costumam ser mais fortes, como em colinas ou próximos às costas. Ao contrário dos moinhos de água, os moinhos de vento não são impedidos pelo congelamento dos rios e podem moer durante todo o ano."
 building_type_workshops_01:0 "Oficinas"
 building_type_workshops_01_desc:0 "Fletchers, arqueiros e carpinteiros trabalham nessas oficinas para construir armas de cerco e fornecer suprimentos para as tropas durante campanhas prolongadas."
 building_type_wudang_mountain_temples_01:0 "$building_wudang_mountain_temples_01$"
 building_type_wudang_mountain_temples_01_desc:0 "$building_wudang_mountain_temples_01_desc$"
 building_type_wulingyuan_01:0 "$building_wulingyuan_01$"
 building_type_wulingyuan_01_desc:0 "$building_wulingyuan_01_desc$"
 building_type_xiuyan_mines_01:0 "Minas de Jade de Xiuyan"
 building_type_xiuyan_mines_01_desc:0 "Essa antiga pedreira tem fornecido jade de alta qualidade à sua comunidade por vários milênios. O povo de Hongshan descobriu e apreciou inúmeros tipos de artesanato feitos dela — como pulseiras, ferramentas e artefatos simbólicos — enriquecendo os usos sociais e a reputação familiar."
 building_type_yungang_grottoes_01:0 "$building_yungang_grottoes_01$"
 building_type_yungang_grottoes_01_desc:0 "$building_yungang_grottoes_01_desc$"
 building_type_zawar_mines_01:0 "As Minas de Zawar"
 building_type_zawar_mines_01_desc:0 "Por milhares de anos, as minas de Zawar têm sido uma fonte rica de Chumbo, Zinco e Prata. Os depósitos em Zawar são únicos não apenas em sua abundância, mas também na forma como são claramente separados, tornando possível separar os minérios manualmente sem a necessidade de processos metalúrgicos mais avançados."
 building_type_zigong_mines_01:0 "Poços de Sal de Ziliujing & Gongjing"
 building_type_zigong_mines_01_desc:0 "Devido às suas vantagens únicas para a extração de sal, esta área tem sido um ponto de mineração profunda desde os tempos da dinastia Shang, milhares de anos atrás. Hoje, e por todo o futuro previsível, continua sendo um fator essencial na economia regional."
 building_type_zijinshan_mines_01:0 "Minas de Zijinshan"
 building_type_zijinshan_mines_01_desc:0 "Embora inicialmente remotas e selvagens, essas montanhas abrigam riquezas imensas em ouro e cobre. Com a direção adequada, a mineração local em pequena escala pode transformar-se em uma grande fonte de metais preciosos."
 building_university_01:0 "Universidadey I"
 building_university_01_desc:0 "$building_type_university_01_desc$"
 building_university_02:0 "Universidade II"
 building_university_02_desc:0 "$building_type_university_01_desc$"
 building_university_03:0 "Universidade III"
 building_university_03_desc:0 "$building_type_university_01_desc$"
 building_university_04:0 "Universidade IV"
 building_university_04_desc:0 "$building_type_university_01_desc$"
 building_university_05:0 "Universidade V"
 building_university_05_desc:0 "$building_type_university_01_desc$"
 building_university_06:0 "Universidade VI"
 building_university_06_desc:0 "$building_type_university_01_desc$"
 building_verespatak_mines_01:0 "Assentamento de Mineração de Verespatak"
 building_verespatak_mines_01_desc:0 "$building_rammelsberg_mines_01_desc$"
 building_verespatak_mines_02:0 "Mina de Verespatak"
 building_verespatak_mines_02_desc:0 "$building_rammelsberg_mines_02_desc$"
 building_verespatak_mines_03:0 "Grande Mina de Verespatak"
 building_verespatak_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_verespatak_mines_04:0 "Complexo de Mineração de Verespatak"
 building_verespatak_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_vihara_halls_01:0 "Santuário de Oração"
 building_vihara_halls_01_desc:0 "A adição do $building_vihara_halls_01$ oferece aos visitantes um local de adoração e contemplação."
 building_vihara_halls_02:0 "Biblioteca de Escrituras"
 building_vihara_halls_02_desc:0 "Antigas e novas escrituras são guardadas dentro das paredes do Hor Trai. Devotos visitantes podem estudá-las e aprofundar seu esclarecimento à vontade."
 building_vihara_halls_03:0 "Capelas Colunadas"
 building_vihara_halls_03_desc:0 "Majestosas colunatas se erguem sobre essas capelas, oferecendo inscrições intrincadas e várias representações religiosas aos fiéis em seu interior."
 building_vihara_halls_04:0 "Mandapa"
 building_vihara_halls_04_desc:0 "O tamanho impressionante deste salão com pilares é ideal para a realização de rituais públicos e outras cerimônias religiosas."
 building_vihara_halls_05:0 "Pavilhão Shala"
 building_vihara_halls_05_desc:0 "Um pavilhão no meio da vegetação; a beleza desta estrutura só é igualada por sua aura de espiritualidade."
 building_vihara_halls_06:0 "Pedras Sima"
 building_vihara_halls_06_desc:0 "As pedras de fronteira ajudam os guardiões do $building_type_vihara_halls_01$ a determinar o tamanho e a distância adequados dos espaços necessários para que os monges realizem sua adoração de forma apropriada."
 building_vihara_halls_07:0 "Torre do Sino"
 building_vihara_halls_07_desc:0 "Uma majestosa $building_vihara_halls_07$ coroa estes $building_type_vihara_halls_01$, refletindo a luz do sol durante o dia e destacando-se à distância durante a noite."
 building_vihara_halls_08:0 "Grandes Salões"
 building_vihara_halls_08_desc:0 "O conforto e as comodidades desses salões fazem monges viajarem de longe para visitá-los, consolidando e disseminando ensinamentos e ideias em uma valiosa rede de informação, espalhando harmonia pelos reinos vizinhos."
 building_visby_ringmur_01:0 "$building_type_visby_ringmur_01$"
 building_visby_ringmur_01_desc:0 "$building_type_visby_ringmur_01_desc$"
 building_walls_of_benin_01:0 "$building_type_walls_of_benin_01$"
 building_walls_of_benin_01_desc:0 "$building_type_walls_of_benin_01_desc$"
 building_walls_of_genoa_01:0 "$building_type_walls_of_genoa_01$"
 building_walls_of_genoa_01_desc:0 "$building_type_walls_of_genoa_01_desc$"
 building_wantilan_01:0 "Pequeno Wantilan"
 building_wantilan_01_desc:0 "O salão da aldeia abriga alistamentos, juramentos e ensaios; os anciãos arbitram disputas antes que se acendam."
 building_wantilan_02:0 "Pavilhão Wantilan"
 building_wantilan_02_desc:0 "Um amplo salão com telhado em camadas acolhe festivais e iniciações, onde ritos compartilhados elevam o moral e o prestígio."
 building_wantilan_03:0 "Wantilan do Templo"
 building_wantilan_03_desc:0 "Um espaço cerimonial ligado ao santuário local, com amplo espaço para oferendas e procissões."
 building_wantilan_04:0 "Grande Wantilan"
 building_wantilan_04_desc:0 "Um pavilhão monumental onde tambores, dançarinos e capitães dividem o mesmo teto."
 building_war_camps_01:0 "Campos de Treino"
 building_war_camps_01_desc:0 "Equipamento de treinamento, arenas e paredes de madeira definem os campos de treinamento. Guerreiros vêm aqui para aprimorar suas habilidades."
 building_war_camps_02:0 "Guerreiros"
 building_war_camps_02_desc:0 "Apenas os maiores lutadores têm permissão para entrar em uma cabana de guerreiros, e sua mera presença é inspiradora."
 building_warrior_lodges_01:0 "Salões de Troféus"
 building_warrior_lodges_01_desc:0 "A vida no campo de batalha e a memória humana são coisas passageiras, enquanto uma parede onde cada membro do salão pode pendurar seus troféus valiosos permanecerá por muito, muito mais tempo."
 building_warrior_lodges_02:0 "Alojamentos de Escudeiros"
 building_warrior_lodges_02_desc:0 "Um modesto depósito de equipamentos e uma agenda rigorosa de treinamento estabelecida são tudo o que é necessário para aqueles que são jovens demais para lembrar das batalhas do passado aprenderem com aqueles que são velhos demais para se juntar às fileiras no futuro."
 building_warrior_lodges_03:0 "Salões de Festas"
 building_warrior_lodges_03_desc:0 "A adição de salões de festas, sempre cheios de comida e risadas, aborda o crescente número de batalhas comemoradas neste salão de guerreiros."
 building_warrior_lodges_04:0 "Campos de Luta em Formação"
 building_warrior_lodges_04_desc:0 "Em campos dedicados que reproduzem os terrenos onde os exércitos se enfrentam, grupos de guerreiros podem aprender a lutar e manobrar como uma unidade coesa. As tropas treinadas aqui são uma força formidável, tendo aprendido a confiar tanto em seus comandantes quanto nos homens nas fileiras ao lado deles."
 building_warrior_lodges_05:0 "Túmulos dos Guerreiros"
 building_warrior_lodges_05_desc:0 "Com terrenos sagrados reservados para sepultamento, os membros venerados deste salão de guerreiros podem descansar em paz para sempre, não mais confinados ao solo estrangeiro e frio de um campo de batalha... ao mesmo tempo em que servem de inspiração para as gerações de guerreiros que virão."
 building_warrior_lodges_06:0 "Salões de Comemoração"
 building_warrior_lodges_06_desc:0 "Nesses salões, trovadores e poetas bem remunerados louvam as façanhas dos mais corajosos guerreiros. Quando multidões suficientes se reúnem - ou quando um patrono suficientemente rico deseja -, espetáculos completos acontecem, reencenando as famosas e vitoriosas batalhas do passado."
 building_warrior_lodges_07:0 "Biblioteca dos Guerreiros"
 building_warrior_lodges_07_desc:0 "Gerações de jovens aprendizes têm aprendido aqui, mas apenas com os guerreiros sobreviventes e ainda presentes. Agora, os tesouros de conhecimento acumulado, às vezes conflitantes, podem ser acessados por quase qualquer pessoa, mediante o pagamento de uma pequena taxa."
 building_warrior_lodges_08:0 "Alojamentos para Visitantes"
 building_warrior_lodges_08_desc:0 "Esses salões se tornaram um destino venerado de peregrinações profanas, conhecidos e sonhados por guerreiros aspirantes e experientes de todos os lugares."
 building_watchtowers_01:0 "Torres de Tijolos de Barro"
 building_watchtowers_01_desc:0 "Essas torres feitas de tijolos fornecem uma defesa simples, mas eficaz."
 building_watchtowers_02:0 "Casas-Torre"
 building_watchtowers_02_desc:0 "As casas-torre são feitas para proteção e habitação, e ocupam locais estratégicos."
 building_watchtowers_03:0 "Torres de Vigia de Madeira"
 building_watchtowers_03_desc:0 "Várias torres de vigia de madeira têm vista para os camponeses enquanto trabalham em seus campos. De seus pontos de vista, os arqueiros oferecem excelente proteção."
 building_watchtowers_04:0 "Pequenos Tijolos de Barro"
 building_watchtowers_04_desc:0 "O barro refinado mantém, embora pequeno, oferece proteção superior para torres de vigia mais mundanas. Em tempos de guerra, eles podem proteger uma série de camponeses de invasores e até mesmo conter um pequeno celeiro para tempos de escassez."
 building_watchtowers_05:0 "Torres de Vigia de Pedra"
 building_watchtowers_05_desc:0 "Essas torres de vigia oferecem um ponto de vista magnífico, não apenas para arqueiros, mas também para senhores que inspecionam seus camponeses."
 building_watchtowers_06:0 "Brechas"
 building_watchtowers_06_desc:0 "Ao construir torres para que haja uma série de buracos de onde as flechas possam ser disparadas, o alcance e a proteção dos arqueiros aumentam significativamente."
 building_watchtowers_07:0 "Torres de Casca"
 building_watchtowers_07_desc:0 "Essas pequenas casas-torre são formidavelmente fortificadas e sinalizam o prestígio de seus proprietários. Em caso de invasão, rebanhos inteiros de gado podem ser cercados e protegidos pelas torres."
 building_watchtowers_08:0 "Torres Abobadadas"
 building_watchtowers_08_desc:0 "Estas imponentes torres são feitas inteiramente de pedra, encimadas por uma cúpula. As técnicas de construção envolvidas os tornam quase inexpugnáveis por invasores."
 building_water_temples_01:0 "Comportas e Santuários de Campo Subak"
 building_water_temples_01_desc:0 "Pequenas comportas e canais de terra conectam os arrozais; um santuário supervisiona oferendas e turnos de trabalho. O excedente confiável começa a fluir — e também os ritos."
 building_water_temples_02:0 "Santuários do Conselho Subak"
 building_water_temples_02_desc:0 "Múltiplos santuários coordenam um “subak” mais amplo com partilha de água calendarizada; disputas e reparos são tratados de forma comunitária, melhorando o controle e os rendimentos."
 building_water_temples_03:0 "Rede de Templos d'Água"
 building_water_temples_03_desc:0 "Um circuito adequado de templos d'água supervisiona o plantio e os ciclos de pousio sincronizados; as pragas diminuem, a produção aumenta e a piedade ritual cresce."
 building_water_temples_04:0 "Grande Paisagem dos Templos d'Água"
 building_water_temples_04_desc:0 "Toda a drenagem é organizada por assembleias lideradas pelos templos; terraços, comportas e celebrações tornam esta província um piedoso celeiro."
 building_watermills_01:0 "Rodas d'Água Submersas"
 building_watermills_01_desc:0 "Uma roda simples colocada no rio de fluxo rápido pode realizar muito mais do que um moinho acionado por humano ou cavalo, e, o mais importante, nunca ficará cansada ou pedirá pagamento."
 building_watermills_02:0 "Manivelas e Hastes de Ligação"
 building_watermills_02_desc:0 "Com uma simples engrenagem de madeira, a velocidade de rotação das mós do moinho não está mais diretamente ligada aos caprichos do clima."
 building_watermills_03:0 "Rodas d'Água Superiores"
 building_watermills_03_desc:0 "Utilizar a diferença de níveis de água, formada naturalmente ou alcançada com um pouco de engenhosidade humana, é uma maneira muito mais eficiente e confiável de gerar torque."
 building_watermills_04:0 "Moinhos Industriais"
 building_watermills_04_desc:0 "O que começou como um simples moinho de malte, processando principalmente produtos agrícolas, agora atrai outros ofícios. Portadores da guilda aguardam até que os moinhos moam seu mostarda, lancem suas roupas ou esmaguem seus minérios."
 building_watermills_05:0 "Estradas Organizadas"
 building_watermills_05_desc:0 "Executores contratados, abrigos, passagens rodoviárias e até mesmo pousadas, colocados ao longo das estradas que levam aos moinhos, organizam e atendem àqueles que estão esperando na fila. Carrinhos puxados por cavalos ou humanos, cheios de produtos prestes a serem moídos, como madeira, cânhamo ou peles de animais, estão se alinhando dia e noite."
 building_watermills_06:0 "Moinhos de Embarcação"
 building_watermills_06_desc:0 "Barcaças ancoradas permanentemente no meio dos rios estão aproveitando as correntes mais fortes. Em rios sinuosos, as barcaças podem ser reposicionadas nas curvas externas sem muito esforço."
 building_watermills_07:0 "Diques e Barragens"
 building_watermills_07_desc:0 "Um conjunto de diques, barragens e canais artificiais, tanto para rodas d'água submersas quanto para rodas d'água superiores, acomoda as crescentes necessidades de moagem. Com quase todos os locais naturais adequados já ocupados, novas vias navegáveis ​​escavadas estão atravessando o campo."
 building_watermills_08:0 "Moinhos de Pólvora"
 building_watermills_08_desc:0 "Um moinho separado, colocado longe de outras indústrias, é totalmente dedicado à moagem eficiente e #EMP um tanto#! segura de carvão vegetal e enxofre."
 building_waterworks_01:0 "Lagos Artificiais"
 building_waterworks_01_desc:0 "O primeiro passo na gestão da água é garantir que haja água para ser gerida. Uma simples depressão no solo, revestida com argila para retenção, cria um local natural para acumular água para uso posterior."
 building_waterworks_02:0 "Cisternas"
 building_waterworks_02_desc:0 "Cavidades mais profundas, revestimentos menos permeáveis e coberturas simples ajudam a armazenar mais água por mais tempo, reduzindo perdas por poluição ou evaporação."
 building_waterworks_03:0 "Canais Nivelados"
 building_waterworks_03_desc:0 "Cavar valas entre os locais de armazenamento torna a água gerida muito mais acessível para muito mais pessoas. Esse processo alivia a pressão de enchentes quando há excesso de água, ao mesmo tempo em que fornece água para pessoas, animais e plantações durante a seca. Planejados corretamente, esses canais podem até permitir o tráfego de pequenos barcos."
 building_waterworks_04:0 "Tanques de Irrigação"
 building_waterworks_04_desc:0 "Qualquer tipo de colina, elevação ou desnível pode ser transformado em um reservatório de água, se forem feitas as contenções adequadas. Conectados por canais, esses tanques abertos podem alimentar uns aos outros, oferecendo maior controle sobre a quantidade de água armazenada e utilizada em cada momento."
 building_waterworks_05:0 "Poços em Degraus"
 building_waterworks_05_desc:0 "O controle da água pode ser combinado com técnicas básicas de escavação de poços para criar grandes estruturas subterrâneas que, em todos os momentos, terão alguma água proveniente do solo. Essas construções subterrâneas podem ser conectadas a canais e comportas na superfície, que as alimentam com mais água ou a redirecionam conforme necessário."
 building_waterworks_06:0 "Eclusas de Canal"
 building_waterworks_06_desc:0 "A própria profundidade de um curso d’água pode ser controlada com portões e drenos. A água armazenada atrás dessas eclusas pode tornar os canais vias navegáveis para barcaças e pequenos navios, transformando-os em excelentes rotas de transporte."
 building_waterworks_07:0 "Lagos Artificiais Monumentais"
 building_waterworks_07_desc:0 "Um reservatório monumental pode conter uma quantidade monumental de água. Alimentados por rios e canais, esses lagos artificiais fornecem água para vastas áreas agrícolas e inúmeras aldeias. Sua grandiosidade também os torna locais de prestígio, ideais tanto para culto quanto para administração."
 building_waterworks_08:0 "Sistemas de Abastecimento e Esgoto"
 building_waterworks_08_desc:0 "Com canos e bombas, a água pode fluir para cima e para baixo, levando água às torres mais altas e removendo resíduos até as fossas mais distantes. Nenhum lugar ficará sem água, e qualquer excesso pode ser drenado antes que se transforme em uma enchente perigosa."
 building_white_deer_grotto_academy_01:0 "Academia Gruta do Cervo Branco"
 building_white_deer_grotto_academy_01_desc:0 "Fundada pelo eremita Li Bo, onde cervos brancos vagavam livremente, a academia floresceu como um centro do neoconfucionismo."
 building_wind_furnace_01:0 "Pequenos Fornos a Vento"
 building_wind_furnace_01_desc:0 "Fornos orientados diretamente para o oeste, para que possam captar e utilizar o máximo possível do vento incidente."
 building_wind_furnace_02:0 "Tuyeres Reutilizáveis"
 building_wind_furnace_02_desc:0 "Tuyeres, as entradas de ar metálicas para o forno, são cuidadosamente ajustadas no meio para proporcionar uma medida de estabilidade do ar no interior, anulando os efeitos das rajadas de vento. Para a próxima fusão, eles são reutilizados sendo colocados no fundo das paredes frontais, permitindo que a escória flua para fora dos fornos."
 building_wind_furnace_03:0 "Paredes Frontais de Argila"
 building_wind_furnace_03_desc:0 "As paredes frontais de argila dos fornos são projetadas para resistir ao calor e à formação de escória durante a fusão, ao mesmo tempo em que são facilmente quebradas ao final do processo de fusão."
 building_wind_furnace_04:0 "Procedimentos de Pré-Aquecimento"
 building_wind_furnace_04_desc:0 "Um longo pré-aquecimento, que permite que o carvão queime adequadamente, seguido da adição gradual de uma mistura de minério e carvão, é finalizado com uma adição adicional de carvão."
 building_wind_furnace_05:0 "Paredes Traseiras Curvas"
 building_wind_furnace_05_desc:0 "Apoiada pelas duas pedras verticais, a curvatura da parede traseira permanente limita o contato com a escória quente e corrosiva, permitindo que o forno funcione por mais tempo sem precisar de uma reconstrução completa."
 building_wind_furnace_06:0 "Paredes Frontais Mais Longas"
 building_wind_furnace_06_desc:0 "Paredes frontais alongadas permitem um aumento na quantidade de aço produzido em cada fusão, mantendo as outras dimensões iguais e, portanto, as propriedades superiores dos fornos e do aço."
 building_wind_furnace_07:0 "Carbonizadores"
 building_wind_furnace_07_desc:0 "Mais distante da costa do que os fornos, uma linha de carbonizadores está constantemente aquecendo madeira para abastecer a indústria em expansão."
 building_wind_furnace_08:0 "Processamento de Minério de Ferro"
 building_wind_furnace_08_desc:0 "Ao triturar o minério de forma mais completa e torrá-lo antes de colocá-lo nos fornos, é possível obter maiores rendimentos de qualidade ainda maior."
 building_windmills_01:0 "Moinhos de Vento Simples"
 building_windmills_01_desc:0 "Velas verticais simples, adicionadas no topo de um moinho acionado por animais, não apenas aumentam o poder do moinho, mas também preservam a força da besta de carga por mais tempo."
 building_windmills_02:0 "Panemones"
 building_windmills_02_desc:0 "Os panemones são moinhos de vento posicionados verticalmente, com metade do moinho protegido do vento. Isso garante que as velas do lado a favor do vento não estejam empurrando contra a rotação."
 building_windmills_03:0 "Velames Rotativos"
 building_windmills_03_desc:0 "Com um pouco de engenhosidade no design, os velames retornantes giram rapidamente contra o vento."
 building_windmills_04:0 "Rodas de Água do Moinho de Vento"
 building_windmills_04_desc:0 "Utilizando a energia eólica para girar uma roda d'água, gerando assim o fluxo de água em um canal ou em um simples tubo de madeira, as pedras de moagem podem ser colocadas em locais mais acessíveis."
 building_windmills_05:0 "Moinhos de Vento Horizontais"
 building_windmills_05_desc:0 "Com cada vela empurrando na direção certa, mais energia pode ser direcionada para múltiplas pedras de moagem. No entanto, o trabalho é frequentemente interrompido por mudanças na direção do vento, exigindo um ajuste manual de todo o moinho de vento."
 building_windmills_06:0 "Moinhos de Poste"
 building_windmills_06_desc:0 "Com todo o moinho de vento colocado em um poste resistente, ele pode facilmente girar em direção ao vento. Mudanças na intensidade do vento exigem ajuste manual, dobrando as velas e pesando as asas para manter a rotação estável."
 building_windmills_07:0 "Caixas de Engrenagens"
 building_windmills_07_desc:0 "A lenta rotação das poderosas velas do moinho de vento é acelerada pela adição de um simples conjunto de engrenagens de madeira, permitindo que o moinho gire mais rápido. Isso o torna muito mais adequado para a maioria dos materiais trazidos para processamento."
 building_windmills_08:0 "Moinhos de Torre"
 building_windmills_08_desc:0 "O corpo do moinho de vento é uma bela obra de alvenaria, com apenas o topo ainda sendo de madeira, permitindo que as velas estejam voltadas para o vento. Nenhuma tempestade ou cavaleiro desorientado pode derrubar esta torre e interromper a moagem."
 building_workshops_01:0 "Campos de Tiro"
 building_workshops_01_desc:0 "Uma grande área foi limpa de obstáculos para acomodar arqueiros ou engenheiros de cerco, proporcionando um espaço para testar suas armas e aprimorar suas habilidades."
 building_workshops_02:0 "Tecelagens de Cordas"
 building_workshops_02_desc:0 "Dia e noite, em uma vala estreita parcialmente protegida dos elementos, os trabalhadores estão tecendo e trançando cordas e fios, tanto de origem vegetal quanto animal."
 building_workshops_03:0 "Depósitos de Cordas"
 building_workshops_03_desc:0 "Uma instalação de armazenamento dedicada mantém um estoque pronto para uso de cordas para arcos, bestas e armas de cerco por torção."
 building_workshops_04:0 "Guilda dos Escavadores"
 building_workshops_04_desc:0 "Embora pareça enganosamente simples, cavar túneis durante cercos é uma ocupação que requer muita dedicação e expertise. Aqueles que sobreviveram ao seu primeiro cerco podem compartilhar o conhecimento e as habilidades práticas com voluntários ansiosos."
 building_workshops_05:0 "Guilda dos Fletchers"
 building_workshops_05_desc:0 "Não mais parte da guilda dos arqueiros devido à demanda crescente tanto por armas quanto por munições, uma guilda separada de fletchers fornece incansavelmente todas as flechas necessárias para sustentar as tropas no campo."
 building_workshops_06:0 "Salões dos Matemáticos"
 building_workshops_06_desc:0 "Ajustes repetidos de parâmetros do mecanismo de torção, feitos em tentativa e erro para obter melhor precisão e alcance, levaram alguns de nossos engenheiros de cerco a começar a escrever seus métodos bem-sucedidos. Seus pergaminhos agora preenchem salões inteiros, repletos de movimento e discussão."
 building_workshops_07:0 "Dimensões Padronizadas de Armas"
 building_workshops_07_desc:0 "Com registros preenchidos com comprimentos desejados de vários feixes de madeira, finalmente podemos garantir que um projétil com peso de 90 quilogramas seja lançado exatamente a 300 metros. Sob condições climáticas ideais. Na maior parte do tempo."
 building_workshops_08:0 "Armazéns de Pólvora"
 building_workshops_08_desc:0 "Um prédio separado e resistente, com uma política de entrada rigorosa, serve como um armazenamento para quantidades assustadoras de pólvora, a ser usada tanto em poderosas cargas explosivas na guerra de túneis quanto como propelente para bombardas."
 building_wudang_mountain_temples_01:0 "Templos da Montanha Wudang"
 building_wudang_mountain_temples_01_desc:0 "As montanhas Wudang são uma das várias montanhas sagradas do Taoismo. Elas também abrigam um grande complexo de templos, famoso pela prática do tai chi."
 building_wulingyuan_01:0 "Wulingyuan"
 building_wulingyuan_01_desc:0 "Estas montanhas são repletas de milhares de imponentes pilares de arenito que se erguem muito acima do solo. Embora os pilares sejam a característica mais marcante, a área também é cheia de ravinas, riachos, pequenos lagos e cavernas."
