 building_iron_pillar_of_dhar_01:0 "$building_type_iron_pillar_of_dhar_01$"
 building_iron_pillar_of_dhar_01_desc:0 "$building_type_iron_pillar_of_dhar_01_desc$"
 building_ise_jingu_01:0 "Santuário Ise"
 building_ise_jingu_01_desc:0 "O Ise-jingū é sagrado para a deusa do sol, #EMP Amaterasu#!, e está entre os locais xintoístas mais venerados. O santuário abriga as insígnias imperiais de Yamato e é supervisionado por uma sacerdotisa Saigū vestal, escolhida entre a dinastia imperial."
 building_itoigawa_mines_01:0 "Assentamento de Mineração de Itoigawa"
 building_itoigawa_mines_01_desc:0 "$building_type_itoigawa_mines_01_desc$"
 building_itoigawa_mines_02:0 "Mina de Itoigawa"
 building_itoigawa_mines_02_desc:0 "$building_hetian_mines_02_desc$"
 building_itoigawa_mines_03:0 "Grande Mina de Itoigawa"
 building_itoigawa_mines_03_desc:0 "$building_hetian_mines_03_desc$"
 building_itoigawa_mines_04:0 "Complexo de Mineração de Itoigawa"
 building_itoigawa_mines_04_desc:0 "$building_hetian_mines_04_desc$"
 building_itsukushima_jinja_01:0 "Santuário Itsukushima"
 building_itsukushima_jinja_01_desc:0 "Fundado no século VI e dedicado às deusas xintoístas do mar e das tempestades, as galerias do Itsukushima-jinja se erguem sobre as águas, voltadas para o famoso portão torii que parece flutuar sobre as águas da baía de Matsushima."
 building_itsukushima_jinja_02:0 "$building_itsukushima_jinja_01$"
 building_itsukushima_jinja_02_desc:0 "$building_itsukushima_jinja_01_desc$"
 building_jiaodong_mines_01:0 "Assentamento de Mineração de Jiaodong"
 building_jiaodong_mines_01_desc:0 "$building_type_jiaodong_mines_01_desc$"
 building_jiaodong_mines_02:0 "Mina de Jiaodong"
 building_jiaodong_mines_02_desc:0 "$building_rammelsberg_mines_02_desc$"
 building_jiaodong_mines_03:0 "Grande Mina de Jiaodong"
 building_jiaodong_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_jiaodong_mines_04:0 "Complexo de Mineração de Jiaodong"
 building_jiaodong_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_jizu_shan_temples_01:0 "Templos Jizu Shan"
 building_jizu_shan_temples_01_desc:0 "O complexo monástico budista da montanha serviu como bastião do budismo esotérico. Peregrinos o comparavam ao Pico dos Abutres, na Índia."
 building_jousting_lists_01:0 "Campos de Justa"
 building_jousting_lists_01_desc:0 "Uma clareira é mantida aberta o ano todo para facilitar o treinamento de montadores e cavaleiros."
 building_jousting_lists_02:0 "Campos de Torneio"
 building_jousting_lists_02_desc:0 "Com listas de justas e stands para o público, esses campos de torneio atraem uma grande quantidade de competidores."
 building_jousting_lists_03:0 "Arenas do Torneio Real"
 building_jousting_lists_03_desc:0 "Atualizado com assentos para convidados reais e um recinto de feiras maior, a arena do torneio é verdadeiramente impressionante."
 building_jvari_monastery:0 "Mosteiro de Jvari"
 building_jvari_monastery_desc:0 "Um antigo mosteiro erguido exatamente no local onde Santa Nino plantou uma cruz milagrosa enquanto evangelizava a Geórgia.\nO edifício sagrado atrai peregrinos de todo o Cáucaso."
 building_kaibao_mines_01:0 "Assentamento de Mineração de Kaibao"
 building_kaibao_mines_01_desc:0 "$building_type_kaibao_mines_01_desc$"
 building_kaibao_mines_02:0 "Mina de Guiyang"
 building_kaibao_mines_02_desc:0 "$building_rammelsberg_mines_02_desc$"
 building_kaibao_mines_03:0 "Grande Mina de Guiyang"
 building_kaibao_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_kaibao_mines_04:0 "Complexo de Mineração de Guiyang"
 building_kaibao_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_kaifeng_palace_01:0 "Palácio Imperial de Kaifeng"
 building_kaifeng_palace_01_desc:0 "O palácio imperial em Kaifeng foi construído quando a dinastia Song estabeleceu sua capital na cidade. Um governo forte e eficiente governa dentro dessas muralhas, garantindo que a cidade e o império como um todo prosperem."
 building_kassiopi_castle:0 "Castelo de Kassiopi"
 building_kassiopi_castle_desc:0 "Uma fortificação imponente na costa. Sua posição estratégica, supervisionando o canal que separa a ilha do continente, torna-a um ponto de controle vital na área do Jônico."
 building_khajuraho_01:0 "Khajuraho"
 building_khajuraho_01_desc:0 "$building_type_khajuraho_01_desc$"
 building_khetri_mines_01:0 "Assentamento de Mineração de Khetri"
 building_khetri_mines_01_desc:0 "$building_type_khetri_mines_01_desc$"
 building_khetri_mines_02:0 "Mina de Khetri"
 building_khetri_mines_02_desc:0 "$building_rammelsberg_mines_02_desc$"
 building_khetri_mines_03:0 "Grande Mina de Khetri"
 building_khetri_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_khetri_mines_04:0 "Complexo de Mineração de Khetri"
 building_khetri_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_khiva_bazaar_01:0 "Bazar de Khiva"
 building_khiva_bazaar_01_desc:0 "Portal para as estepes, a modesta cidade de Khiva se destaca por sua abundância de comerciantes e viajantes em busca de lucro ou fortuna na fronteira."
 building_khiva_bazaar_02:0 "Grande Bazar de Khiva"
 building_khiva_bazaar_02_desc:0 "Sob o sol escaldante, nômades, mercadores e aventureiros conquistam fortunas e trocam sussurros sobre a riqueza da longínqua China, por entre as exóticas moedas do Huángdì."
 building_kofuku_ji_01:0 "Templo Kōfuku"
 building_kofuku_ji_01_desc:0 "Datado do século VII, o Kōfuku-ji é um dos Sete Grandes Templos de Nara, entre os mais antigos e importantes centros de pensamento e poder budista do Japão."
 building_koganeyama_mines_01:0 "Minas de Ouro de Kinka"
 building_koganeyama_mines_01_desc:0 "A ilha de Kinka e seu Santuário Koganeyama associado são famosos pelos primeiros depósitos de ouro descobertos no Japão, na forma de pó de ouro. Estabelecido pelo Imperador Shōmu no século VIII, o santuário é dedicado a #EMP Kanayama#!, deus da mineração."
 building_koganeyama_mines_02:0 "Mina de Ouro de Kinka"
 building_koganeyama_mines_02_desc:0 "As escavações foram ampliadas, e engenheiros foram trazidos para realmente aumentar a extração de ouro."
 building_koganeyama_mines_03:0 "Grande Mina de Ouro de Kinka"
 building_koganeyama_mines_03_desc:0 "Uma vila surgiu ao redor das várias escavações, e os trabalhadores encontram novas veias de ouro regularmente."
 building_koganeyama_mines_04:0 "Complexo de Mineração de Ouro de Kinka"
 building_koganeyama_mines_04_desc:0 "A extração de ouro atingiu uma escala quase industrial, com o número de trabalhadores agora chegando a milhares. Riquezas sem fim parecem fluir das minas."
 building_kollur_mines_01:0 "Poços de Mineração Kollur"
 building_kollur_mines_01_desc:0 "Apenas um poço de argila e cascalho, trabalhadores vestidos de tanga labutam aqui noite e dia para extrair diamantes."
 building_kollur_mines_02:0 "Minas Kollur"
 building_kollur_mines_02_desc:0 "Os poços de mineração foram expandidos e engenheiros foram trazidos para realmente serem capazes de acelerar a extração de diamantes."
 building_kollur_mines_03:0 "Grande Mina Kollur"
 building_kollur_mines_03_desc:0 "Uma aldeia surgiu em torno de muitos poços de mineração, e os trabalhadores encontram diamantes enormes regularmente."
 building_kollur_mines_04:0 "Complexo de Mineração Kollur"
 building_kollur_mines_04_desc:0 "A extração de diamantes atingiu uma escala quase industrial, com a quantidade de trabalhadores agora na casa dos milhares. Riquezas infinitas aparentemente fluem das minas."
 building_konasamudram_mines_01:0 "Assentamento de Mineração de Konasamudram"
 building_konasamudram_mines_01_desc:0 "$building_type_konasamudram_mines_01_desc$"
 building_konasamudram_mines_02:0 "Mina de Konasamudram"
