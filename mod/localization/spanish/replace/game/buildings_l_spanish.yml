 building_hpakant_mines_04:0 "Complexo de Mineração de Hpakant"
 building_hpakant_mines_04_desc:0 "$building_hetian_mines_04_desc$"
 building_hunting_grounds_01:0 "Alojamentos do Caçador"
 building_hunting_grounds_01_desc:0 "Os caçadores se reúnem nesses alojamentos para planejar suas excursões ao deserto e também servem como lugares para guardar troféus e se encontrar após uma caçada bem-sucedida."
 building_hunting_grounds_02:0 "Canil"
 building_hunting_grounds_02_desc:0 "Os canis criam cães ágeis que são excelentes companheiros para a caça. Geralmente, uma grande variedade de cães é levada para cada caçada."
 building_hunting_grounds_03:0 "Aviários"
 building_hunting_grounds_03_desc:0 "O segundo companheiro mais importante para um caçador são as aves de rapina, muitas das quais são mantidas nos aviários."
 building_hunting_grounds_04:0 "Torres de Caça"
 building_hunting_grounds_04_desc:0 "Para rastrear e localizar as presas, as sentinelas vigiam em torres por todas as terras, relatando seus avistamentos aos caçadores."
 building_hunting_grounds_05:0 "Estábulos do Caçador"
 building_hunting_grounds_05_desc:0 "Um caçador bem-sucedido está sempre precisando de uma montaria rápida, resistente e destemida. Os estábulos do caçador fornecem raças especializadas que se saem bem em longas jornadas."
 building_hunting_grounds_06:0 "Cabanas dos Guardas Florestais"
 building_hunting_grounds_06_desc:0 "Guardas florestais percorrem os terrenos de caça em busca de presas. Embora trabalhem sozinhos, eles são mais do que capazes de abater presas menores sozinhos."
 building_hunting_grounds_07:0 "Reservas de Caça"
 building_hunting_grounds_07_desc:0 "Uma grande faixa de terra é designada como reserva, o que impede que caçadores não autorizados caçem em seu interior. Isso garante que haja sempre muitas presas para os caçadores oficiais, embora alguns caçadores às vezes escapem ..."
 building_hunting_grounds_08:0 "Cabanas do Guarda-Caça"
 building_hunting_grounds_08_desc:0 "Os guarda-caça são responsáveis pelo bem-estar das terras e de todos os animais nelas contidos. Sempre que os nobres decidem ir caçar, os guarda-caça sabem para onde enviá-los para que a caça encontre uma presa."
 building_hwangnyongsa_01:0 "Templo Hwangnyong"
 building_hwangnyongsa_01_desc:0 "Concluído no século VII, o Hwangnyongsa, ou 'Templo do Dragão Imperial', é um vasto complexo construído pelo Rei Jin-heung de Silla como um centro de ensino e poder budista, e ostenta uma das mais altas pagodes do mundo."
 building_idjang_forts_01:0 "Idjang com Estacada"
 building_idjang_forts_01_desc:0 "Uma paliçada de madeira coroa uma elevação defensável; fogueiras de vigia e fossos secos dissuadem invasores."
 building_idjang_forts_02:0 "Idjang com Muralha de Pedra"
 building_idjang_forts_02_desc:0 "Revestimentos de entulho substituem a madeira nas faces principais; caminhos cobertos permitem que os defensores se desloquem com segurança."
 building_idjang_forts_03:0 "Idjang em Terraços"
 building_idjang_forts_03_desc:0 "Acessos em degraus, escadas de surtida e plataformas de tiro criam ângulos mortais para flechas e lanças."
 building_idjang_forts_04:0 "Cidadela Idjang"
 building_idjang_forts_04_desc:0 "Portão, torre interna e cisterna; a guarnição pode resistir por estações inteiras."
 building_ijil_mines_01:0 "Poços de Mineração de Ijil"
 building_ijil_mines_01_desc:0 "$building_type_ijil_mines_01_desc$"
 building_ijil_mines_02:0 "Mina de Ijil"
 building_ijil_mines_02_desc:0 "À medida que o assentamento cresce, mais e mais sal está sendo extraído. A chegada de engenheiros competentes permite a construção de uma mina real."
 building_ijil_mines_03:0 "Grande Mina de Ijil"
 building_ijil_mines_03_desc:0 "À medida que as operações de mineração crescem, as próprias minas também se expandem. Mais entradas são construídas e grandes poços são escavados para permitir a extração de mais sal."
 building_ijil_mines_04:0 "Complexo de Mineração de Ijil"
 building_ijil_mines_04_desc:0 "À medida que a produção de sal aumenta, atrai comerciantes e artesãos de todo o mundo."
