 building_farm_estates_01:0 "Mansões"
 building_farm_estates_01_desc:0 "As mansões abrigam famílias de proprietários de terras, seus funcionários e os camponeses que trabalham em seus campos."
 building_farm_estates_02:0 "Jardins e Plantações de Vegetais"
 building_farm_estates_02_desc:0 "Ligados aos solares estão grandes jardins e campos de vegetais maduros, tornando-os essencialmente autossustentáveis."
 building_farm_estates_03:0 "Propriedades Agrícolas"
 building_farm_estates_03_desc:0 "As propriedades agrícolas têm jurisdição sobre os campos, florestas e edifícios anexos que as cercam."
 building_farm_estates_04:0 "Campos de Cem Acres"
 building_farm_estates_04_desc:0 "Os enormes campos de cem acres empregam muitos camponeses e trazem vasta riqueza para a família que possui a terra."
 building_farm_estates_05:0 "Propriedades"
 building_farm_estates_05_desc:0 "As propriedades são enormes, com vastas terras ao seu redor - à medida que são transmitidas de forma hereditária, as famílias que abrigam têm tempo suficiente para otimizar o rendimento de suas terras."
 building_farm_estates_06:0 "Moinhos de Vento"
 building_farm_estates_06_desc:0 "Os moinhos de vento consomem a maior parte do trabalho de moagem da farinha, aumentando enormemente a eficiência."
 building_farm_estates_07:0 "Propriedades Consolidadas"
 building_farm_estates_07_desc:0 "As famílias mais ricas compram as mais pobres, consolidando suas posses em propriedades expansivas, todas trabalhando sob a mesma direção e, o mais importante, pagando seus impostos juntas."
 building_farm_estates_08:0 "Grandes Propriedadess"
 building_farm_estates_08_desc:0 "Vastas propriedades de uma escala raramente vista, esses grandes complexos podem manter uma família de milhares."
