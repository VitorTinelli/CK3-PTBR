 building_kutna_hora_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_lahur_bazaar_01:0 "Bazar de Lahur"
 building_lahur_bazaar_01_desc:0 "A antiga cidade de Lahur foi construída em torno de dois grandes mercados, cercados por residências e protegidos por um longo muro de barro. Esse vibrante conjunto de mercados tem fervilhado de atividade desde tempos imemoriais — e provavelmente continuará assim por muitas gerações."
 building_lahur_bazaar_02:0 "Grande Bazar de Lahur"
 building_lahur_bazaar_02_desc:0 "O comércio flui por Lahur tão naturalmente quanto a água por um leito de rio. Seus mercados abarrotados transbordam de mercadorias, e seus mercadores carregam o saber da rica história da cidade por trás de seus olhos atentos."
 building_lantian_mines_01:0 "Assentamento de Mineração de Lantian"
 building_lantian_mines_01_desc:0 "$building_type_lantian_mines_01_desc$"
 building_lantian_mines_02:0 "Mina de Lantian"
 building_lantian_mines_02_desc:0 "$building_hetian_mines_02_desc$"
 building_lantian_mines_03:0 "Grande Mina de Lantian"
 building_lantian_mines_03_desc:0 "$building_hetian_mines_03_desc$"
 building_lantian_mines_04:0 "Complexo de Mineração de Lantian"
 building_lantian_mines_04_desc:0 "$building_hetian_mines_04_desc$"
 building_leisure_palace_01:0 "Chateau"
 building_leisure_palace_01_desc:0 "Quando o fardo da responsabilidade se torna excessivo (ou uma multidão de camponeses furiosos está invadindo os portões), não há lugar como o castelo distante e rural para um relaxamento improvisado!"
 building_leisure_palace_02:0 "Palácio de Verão"
 building_leisure_palace_02_desc:0 "O palácio de verão está localizado em uma parte pitoresca do ducado, longe das vidas servis de nossos súditos labutantes. Realmente não há melhor maneira de mostrar o poder real e prestígio, e o simples fato de que somos #emphasis melhor#! do que todo mundo."
 building_leisure_palace_03:0 "Palácio de Inverno"
 building_leisure_palace_03_desc:0 "O palácio de inverno foi projetado para abrigar a família real durante os meses mais difíceis do ano. Com uma despensa bem abastecida e uma posição defensável, domina qualquer sujeito trêmulo que tenha o privilégio de trabalhar nas proximidades."
 building_leshan_giant_buddha_01:0 "Grande Buda de Leshan"
 building_leshan_giant_buddha_01_desc:0 "Esculpida na lateral de um penhasco, esta estátua de Buda encara a confluência dos rios Min e Dadu, saudando os viajantes cansados em sua jornada."
 building_lhasa_market_01:0 "Khrom de Lhasa"
 building_lhasa_market_01_desc:0 "Num cruzamento privilegiado entre a Índia e a China, os mercadores de Lhasa competem pela atenção dos viajantes sob a sombra do imponente palácio Potala."
 building_lhasa_market_02:0 "Grande Khrom de Lhasa"
 building_lhasa_market_02_desc:0 "Não há nada de novo sob o sol — ou é o que os mercadores de Lhasa querem que você acredite — pois não existe bugiganga ou joia que não tenha passado por suas mãos ao longo da Rota da Seda."
 building_liangzhe_mines_01:0 "Assentamento de Mineração de Liangzhe"
 building_liangzhe_mines_01_desc:0 "$building_type_liangzhe_mines_01_desc$"
 building_liangzhe_mines_02:0 "Mina de Liangzhe"
 building_liangzhe_mines_02_desc:0 "$building_type_zijinshan_mines_01_desc$"
 building_liangzhe_mines_03_desc:0 "$building_type_zijinshan_mines_01_desc$"
 building_liangzhe_mines_04:0 "Complexo de Mineração de Liangzhe"
 building_liangzhe_mines_04_desc:0 "$building_type_zijinshan_mines_01_desc$"
 building_liangzhen_mines_03:0 "Grande Mina de Liangzhe"
 building_lingyin_temple_01:0 "Templo Lingyin"
 building_lingyin_temple_01_desc:0 "O Templo Lingyin foi fundado por um monge e peregrino indiano em 328 d.C. para espalhar o budismo. Desde então, o templo cresceu imensamente. Possui vários pavilhões, um grande número de grutas e pagodes, além de dormitórios suficientes para abrigar milhares de monges."
 building_liuhe_pagoda_01:0 "Pagode Liuhe"
 building_liuhe_pagoda_01_desc:0 "Um pagode imponente erguido por reis para acalmar as marés e honrar o Buda. Seu farol brilha sobre a terra, um símbolo de harmonia entre o homem e o Céu."
 building_lize_academy_01:0 "Academia Lize"
 building_lize_academy_01_desc:0 "A Academia Lize promove o estudo entre as águas e juncos de Hebei, servindo como um bastião setentrional da ordem confucionista em meio a fronteiras em mudança."
 building_logging_camps_01:0 "Acampamentos Madeireiros"
 building_logging_camps_01_desc:0 "Lenhadores montaram acampamento nas margens da floresta, garantindo uma produção constante de toras."
 building_logging_camps_02:0 "Coletores de Resina"
 building_logging_camps_02_desc:0 "Ao longo de toda a floresta, a resina está sendo coletada para uso como adesivo ou para ser vendida ao clero para uso em diversos rituais."
 building_logging_camps_03:0 "Queimadores de Carvão"
 building_logging_camps_03_desc:0 "Os carvoeiros trabalham incansavelmente em meio à fumaça para produzir o valioso material para os ferreiros locais."
 building_logging_camps_04:0 "Pastagens de Madeira"
 building_logging_camps_04_desc:0 "Algumas áreas da floresta são reservadas como pasto. Os animais podem pastar entre as árvores e engordar com as inúmeras nozes, frutas e folhas."
 building_logging_camps_05:0 "Campos Cultivados"
 building_logging_camps_05_desc:0 "Onde antes havia árvores, agora existem campos. A antiga floresta torna-se uma formidável área de cultivo."
 building_logging_camps_06:0 "Pastagens de Mel"
 building_logging_camps_06_desc:0 "Na borda da floresta, apiários são colocados para capitalizar sobre a agora abundante quantidade de flores silvestres que apareceram onde a floresta estava."
 building_logging_camps_07:0 "Vidraria Florestal"
 building_logging_camps_07_desc:0 "A floresta é o lugar perfeito para o soprador de vidro trabalhar. Com fácil acesso à maioria dos materiais de que precisam, vidro valioso pode ser produzido e comercializado com."
 building_logging_camps_08:0 "Serrarias"
 building_logging_camps_08_desc:0 "As serrarias são uma melhoria significativa em relação aos machados. A floresta pode ser consumida quase que instantaneamente, com sua valiosa madeira abastecendo nossas cidades e vilas."
 building_london_bridge_01:0 "Ponte de Londres"
 building_london_bridge_01_desc:0 "$building_type_london_bridge_01_desc$ Ampliada"
 building_longhouses_01:0 "Casas Longas"
 building_longhouses_01_desc:0 "As casas longas são grandes o suficiente para acomodar reuniões importantes entre os anciãos. As leis e políticas são determinadas aqui."
 building_longhouses_02:0 "Grandes Salões"
 building_longhouses_02_desc:0 "Grandes salões hospedam um palco central, onde um chefe ou senhor da guerra pode fazer discursos estimulantes."
 building_lund_cathedral_01:0 "$building_type_lund_cathedral_01$"
 building_lund_cathedral_01_desc:0 "$building_type_lund_cathedral_01_desc$"
 building_maharloo_lake_01:0 "$building_type_maharloo_lake_01$"
 building_maharloo_lake_01_desc:0 "$building_type_maharloo_lake_01_desc$"
 building_maiden_tower:0 "Torre da Donzela"
 building_maiden_tower_desc:0 "Esta rocha em frente à costa já hospedava uma estação de costumes na época de Alcibíades, o ateniense, graças à sua posição ideal na entrada do estreito de Bósforo.\nUma torre fortificada na mesma pequena ilha agora é capaz de controlar todo o tráfego naval que vem e vai para o Mar Negro; além disso, uma grande corrente pode ser levantada até o nível do mar entre a torre e Constantinopla, bloqueando efetivamente a passagem de qualquer navio perigoso ou indesejado."
 building_mali_mines_01:0 "Assentamento de Mineração de Ouro"
 building_mali_mines_01_desc:0 "$building_type_mali_mines_01_desc$"
 building_mali_mines_02:0 "Mina de Ouro"
 building_mali_mines_02_desc:0 "$building_rammelsberg_mines_02_desc$"
 building_mali_mines_03:0 "Grande Mina de Ouro"
 building_mali_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_mali_mines_04:0 "Complexo de Mineração de Ouro"
 building_mali_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_mandala_capital_01:0 "Templo Ornado"
 building_mandala_capital_01_desc:0 "Um começo humilde para um grande legado, este templo ornamentado é um lugar para adorar e orar ao governante Devaraja."
 building_mandala_capital_02:0 "Templo Majestoso"
 building_mandala_capital_02_desc:0 "Aprimorando o edifício original, o templo capital foi ampliado com santuários adicionais, mobiliário e decorações."
 building_mandala_capital_03:0 "Terrenos do Templo"
 building_mandala_capital_03_desc:0 "Mais alojamentos foram adicionados para expandir o templo em terrenos em crescimento.\nAgora abriga vários santuários para adoração, bem como abrigo para adoradores, servos e o clero."
 building_mandala_capital_04:0 "Grande Complexo do Templo"
 building_mandala_capital_04_desc:0 "O complexo do templo agora tem o tamanho de uma pequena vila e tornou-se amplamente autossuficiente em suas necessidades.\nUm pequeno relicário e piscinas de reflexão se estendem de leste a oeste, aumentando ainda mais a conexão com o plano espiritual."
 building_mandala_capital_05:0 "Palácio Divino do Templo"
 building_mandala_capital_05_desc:0 "Uma joia arquitetônica raramente vista, o palácio do templo foi expandido com magníficos alojamentos para o divino Devaraja.\nMonumentos, relíquias, tesouros — viajantes vêm de todas as partes para admirar o esplendor deste palácio divino."
 building_maoshan_academy_01:0 "Academia Maoshan"
 building_maoshan_academy_01_desc:0 "Uma academia que ensina ritual, meditação e textos sagrados, servindo como um contraponto espiritual às academias confucionistas da era Song."
 building_march_01:0 "Marchas Estratégicas"
 building_march_01_desc:0 "As marchas são construídas nas áreas mais vulneráveis e remotas do ducado, protegendo contra ataques. Embora poucos e distantes entre si, eles servem como um sistema de alerta útil e também pegam o contrabandista ocasional."
 building_march_02:0 "Fronteiras"
 building_march_02_desc:0 "O sistema de senhores de fronteira é expandido ao longo de toda a fronteira, proporcionando uma linha sólida de defesa."
 building_march_03:0 "Grandes Marchas"
 building_march_03_desc:0 "Grandes fortificações de marcha são construídas em todo o ducado, dificultando significativamente qualquer força de ataque."
 building_market_villages_01:0 "Postos Comerciais Avançados"
 building_market_villages_01_desc:0 "Postos comerciais avançados oferecem a oportunidade para os homens das tribos e comerciantes se encontrarem e negociarem."
 building_market_villages_02:0 "Aldeias de Mercado"
 building_market_villages_02_desc:0 "Em tempos determinados, estas aldeias realizam mercados públicos que atraem comerciantes de toda a região e aumentam a riqueza local."
 building_megalith_01:0 "Megalito Menor"
 building_megalith_01_desc:0 "Esta grande disposição ao ar livre de pedras opera como um lugar permanente e aberto de adoração. Esta construção modesta feita de pedras comuns em uma disposição simples facilita alguns adoradores."
 building_megalith_02:0 "Mausoléu Megalítico"
 building_megalith_02_desc:0 "O local foi expandido com várias disposições de pedras para facilitar mais adoradores. Juntamente com uma expansão do próprio Megalito, um mausoléu subterrâneo foi construído nas proximidades para permitir que pessoas importantes sejam enterradas no local."
 building_megalith_03:0 "Altares Megalíticos"
 building_megalith_03_desc:0 "Esta grande disposição ao ar livre de pedras opera como um lugar permanente e aberto de adoração. Este Megalito foi construído com pedras caras e exóticas de toda a localidade e foi equipado com altares para uso em cerimônias."
 building_megalith_04:0 "Megalito Grande"
 building_megalith_04_desc:0 "Além de inúmeros altares e itens cerimoniais, este Megalito foi expandido para incluir algumas pedras monolíticas verdadeiramente impressionantes e grandes, esculpidas com símbolos sagrados de forma intricada."
 building_megalith_05:0 "Templos Locais"
 building_megalith_05_desc:0 "Pequenos santuários e locais de adoração foram erguidos entre os Megálitos, para fornecer lugares tranquilos de contemplação para o viajante sagrado."
 building_megalith_06:0 "Túmulos Megalíticos"
 building_megalith_06_desc:0 "Grandes líderes, guerreiros e pessoas santas são sepultados dentro desses altares acima do solo. Esses locais dão aos peregrinos e adoradores um lugar para venerar os antepassados caídos que vieram antes deles."
 building_megalith_07:0 "Montes dos Peregrinos"
 building_megalith_07_desc:0 "Pequenos montes foram erguidos para espalhar a paisagem selvagem ao redor do local megalítico, guiando peregrinos e viajantes aos altares onde podem procurar adoração."
 building_megalith_08:0 "Megalito Lendário"
 building_megalith_08_desc:0 "Este Megálito cresceu tanto que seu status é algo como uma lenda local. Adoradores afirmam sentir uma conexão profunda com sua fé enquanto estão neste local."
 building_meteora_01:0 "$building_type_meteora_01$"
 building_meteora_01_desc:0 "As cavernas e cavidades naturais de Meteora têm sido habitadas por eremitas ascéticos desde o início do século IX, mas nenhum edifício feito pelo homem jamais alterou a paisagem."
 building_meteora_02:0 "$building_type_meteora_01$"
 building_meteora_02_desc:0 "À medida que mais e mais monges eremitas buscavam refúgio nos picos ocos de Meteora, mais e mais mosteiros começaram a aparecer.\nO domínio do homem sobre a natureza hostil aqui ainda é muito frágil; os mosteiros são extremamente difíceis de alcançar, dependendo principalmente de escadas, cordas, transporte manual e #EMP orações#!, pois a queda em caso de falha do equipamento é letal."
 building_military_academy_01:0 "Escolas Militares"
 building_military_academy_01_desc:0 "Oficiais aspirantes são examinados com base no mérito na escola militar. Naturalmente, a escola só aceita alunos com linhagem nobre."
 building_military_academy_02:0 "Academias de Oficiais"
 building_military_academy_02_desc:0 "Oficiais de níveis intermediário a alto são treinados aqui, onde adquirem um maior entendimento sobre movimentação de tropas, preparativos de campo e condições de batalha."
 building_military_academy_03:0 "Grandes Academias Militares"
 building_military_academy_03_desc:0 "Uma Grande Academia Militar é o coração pulsante de um aparato militar avançado. Os oficiais treinados aqui aprendem tudo sobre estratégia de campo, organização do exército e os mais recentes avanços tecnológicos na guerra."
 building_military_camps_01:0 "Tendas de Couro"
 building_military_camps_01_desc:0 "Ao convocar milícias, eles são reunidos em acampamentos rudimentares onde dormem em tendas simples. Embora não sejam as mais confortáveis, é um tipo de acampamento barato e portátil."
 building_military_camps_02:0 "Cozinheiros de Acampamento"
 building_military_camps_02_desc:0 "Ao destinar uma parte das milícias para coletar e preparar comida para o resto, mais homens são atraídos do campo - atraídos pelo cheiro da comida."
 building_military_camps_03:0 "Campos de Treinamento"
 building_military_camps_03_desc:0 "Alvos de arco e flecha e manequins fornecem as milícias distração e um mínimo de treinamento, antes de serem lançados no calor da batalha."
 building_military_camps_04:0 "Postos de Observação"
 building_military_camps_04_desc:0 "Postes de observação atuam como balizas, visões e pontos de encontro naturais. Mesmo quando não é em tempos de reunião, os guardas estão sempre posicionados aqui."
 building_military_camps_05:0 "Ferreiros de Acampamento"
 building_military_camps_05_desc:0 "Os ferreiros do acampamento fazem reparos simples e mantêm os cavalos calçados."
 building_military_camps_06:0 "Salões de Reunião"
 building_military_camps_06_desc:0 "Salas de reunião dedicadas colocadas em cada aldeia tornam muito mais fácil colocar milícias em serviço."
 building_military_camps_07:0 "Quartel da Milícia"
 building_military_camps_07_desc:0 "Cada cidade agora tem seu próprio quartel da milícia, onde as armas são armazenadas caso sejam necessárias. O quartel também funciona como ponto de encontro para os oficiais responsáveis pela reunião."
 building_military_camps_08:0 "Praças de Recrutamento"
 building_military_camps_08_desc:0 "As praças de recrutamento maiores fornecem não apenas um local para os soldados se reunirem, mas também um para treinarem para as batalhas que estão por vir."
 building_minarets_and_remains_of_jam_01:0 "$building_type_minarets_and_remains_of_jam_01$"
 building_minarets_and_remains_of_jam_01_desc:0 "$building_type_minarets_and_remains_of_jam_01_desc$"
 building_mogok_mines_01:0 "Poços de Mineração de Mogok"
 building_mogok_mines_01_desc:0 "$building_type_mogok_mines_01_desc$"
 building_mogok_mines_02:0 "Mina de Mogok"
 building_mogok_mines_02_desc:0 "Os poços de mineração foram expandidos, e engenheiros foram trazidos para realmente aumentar a extração de gemas."
 building_mogok_mines_03:0 "Grande Mina de Mogok"
 building_mogok_mines_03_desc:0 "Uma vila surgiu ao redor dos muitos poços de mineração, e os trabalhadores encontram gemas massivas regularmente."
 building_mogok_mines_04:0 "Complexo de Mineração de Mogok"
 building_mogok_mines_04_desc:0 "A extração de gemas atingiu uma escala quase industrial, com a quantidade de trabalhadores agora chegando aos milhares. Riquezas intermináveis parecem fluir das minas."
 building_monastic_schools_01:0 "Capela"
 building_monastic_schools_01_desc:0 "Um lugar humilde de adoração silenciosa para os devotos rezarem e contemplarem."
 building_monastic_schools_02:0 "Salões de Oração"
 building_monastic_schools_02_desc:0 "Os salões de oração hospedam sermões e proporcionam um lugar de contemplação silenciosa."
 building_monastic_schools_03:0 "Escolas Monásticas"
 building_monastic_schools_03_desc:0 "$building_type_monastic_schools_01_desc$"
 building_monastic_schools_04:0 "Jardins Monásticos"
 building_monastic_schools_04_desc:0 "Os jardins do mosteiro oferecem um lugar tranquilo de contemplação para os devotos se deleitarem na beleza da criação."
 building_monastic_schools_05:0 "Universidade Monástica"
 building_monastic_schools_05_desc:0 "A universidade oferece uma educação extensiva em uma variedade de assuntos sagrados, incluindo teologia, tradução e legalismo."
 building_monastic_schools_06:0 "Departamento de Filosofia"
 building_monastic_schools_06_desc:0 "Educação no assunto da filosofia antiga é ensinada aqui, e os monges frequentemente aplicam essas ideias à vida diária."
 building_monastic_schools_07:0 "Observatório"
 building_monastic_schools_07_desc:0 "Os monges aqui observam as estrelas e, a partir delas, eles deduzem o tempo adequado e correto para observar datas importantes no calendário religioso e avançam seu entendimento da criação."
 building_monastic_schools_08:0 "Claustros"
 building_monastic_schools_08_desc:0 "O claustro forma uma barreira sólida contra o mundo exterior, separando efetivamente a vida dos que vivem dentro de seus muros da vida dos camponeses de fora.."
 building_mount_apo_01:0 "Monte Apo"
 building_mount_apo_01_desc:0 "Erguendo-se acima do Lago Venado, o nome do Monte Apo significa “ancião reverenciado” nas línguas Lumad. É uma forma abreviada de Apo Sandawa, o espírito da montanha sagrada, também chamado de “Ancião Sandawa” ou “Avô Sandawa”. Rituais dedicados a Apo Sandawa são conduzidos pelo xamã da tribo, considerado um mediador entre os espíritos ancestrais."
 building_mount_athos_01:0 "$building_type_mount_athos_01$"
 building_mount_athos_01_desc:0 "Comunidades cristãs habitam este promontório desde pelo menos os tempos do Imperador Constantino I, e monges do Monte Athos já participaram do Sétimo Concílio de Niceia. No entanto, nenhuma comunidade monástica propriamente dita ou edifícios permanentes existem ainda."
 building_mount_athos_02:0 "$building_type_mount_athos_01$"
 building_mount_athos_02_desc:0 "A chegada de um monge chamado Atanásio ao Monte Athos desencadeia a fundação de vários mosteiros ao longo da península: primeiro o Grande Lavra e Vatopedi, ambos dedicados à Anunciação. Com mosteiros adequados, a vida monástica local ganha ordem e regras."
 building_mount_athos_03:0 "$building_type_mount_athos_01$"
 building_mount_athos_03_desc:0 "A popularidade do Monte Athos como centro monástico, baseada nas muitas concessões oferecidas a ele pelo poder secular, sua autonomia estatutária, o estilo de vida verdadeiramente isolado e sua próspera produção de ícones, garantiu um fluxo contínuo de novos monges se juntando por séculos.\nÀ medida que o número de monges cresceu, também aumentou o número de mosteiros. Vinte mosteiros atualmente existem no Monte Athos, tornando-o uma das maiores e mais influentes comunidades monásticas da área."
 building_mount_baekdu_01:0 "$building_type_mount_baekdu_01$"
 building_mount_baekdu_01_desc:0 "$building_type_mount_baekdu_01_desc$"
 building_mount_damavand_01:0 "$building_type_mount_damavand_01$"
 building_mount_damavand_01_desc:0 "$building_type_mount_damavand_01_desc$"
 building_mount_fuji_01:0 "$building_type_mount_fuji_01$"
 building_mount_fuji_01_desc:0 "$building_type_mount_fuji_01_desc$"
 building_mozu_tombs:0 "Tumbas de Mozu"
 building_mozu_tombs_desc:0 "Os montes em formato de fechadura em Mozu dizem abrigar antigos imperadores do passado. Para os navios na baía próxima, eles são um marco notável, além de um lembrete de tempos antigos."
 building_muaro_jambi_01:0 "Complexos de Muaro Jambi"
 building_muaro_jambi_01_desc:0 "Localizado ao longo do rio Batang Hari, os extensos complexos de tijolos de Muaro Jambi protegiam tanto o comércio quanto a fé. Como um reduto de Srivijaya, oferecia refúgio a governantes e mobilizava exércitos no coração de Sumatra."
 building_murex_farm_01:0 "Colhedores de Murex"
 building_murex_farm_01_desc:0 "Uma próspera indústria de pesca de Murex foi estabelecida ao longo da costa do Mediterrâneo. Ela fornece uma renda modesta, mas constante, através da venda de caramujos colhidos."
 building_murex_farm_02:0 "Centro de Processamento de Murex"
 building_murex_farm_02_desc:0 "Este centro processa eficientemente os caramujos de Murex, melhorando a extração de suas secreções valiosas. O resultado é uma qualidade superior do cobiçado corante roxo."
 building_murex_farm_03:0 "Destilaria de Corantes"
 building_murex_farm_03_desc:0 "A destilaria especializada refina as secreções de Murex em um potente corante roxo. Sua operação aumenta significativamente a vivacidade e o valor do corante."
 building_murex_farm_04:0 "Pátios de Secagem"
 building_murex_farm_04_desc:0 "Um pátio ao ar livre acelera o processo de oxidação do corante. Isso reduz o tempo de produção do corante roxo, garantindo um fluxo de trabalho mais eficiente."
 building_murex_farm_05:0 "Guilda dos Mestres Tingidores"
 building_murex_farm_05_desc:0 "A Guilda dos Mestres Tingidores, renomada por alcançar o tom perfeito de púrpura tiriano, aprimora a precisão da coloração têxtil. Isso resulta em vestimentas de púrpura consistentemente de alta qualidade."
 building_murex_farm_06:0 "Ateliê de Tecelagem de Seda"
 building_murex_farm_06_desc:0 "Este ateliê se especializa em tecer tecidos luxuosos como seda para tingimento. Ele desbloqueia a capacidade de produzir vestimentas de qualidade excepcional, aumentando seu valor comercial."
 building_murex_farm_07:0 "Oficina Têxtil Imperial"
 building_murex_farm_07_desc:0 "A oficina imperial foca na produção em massa de têxteis tingidos de púrpura tiriano, aumentando significativamente a renda com a venda dessas vestimentas prestigiosas."
 building_murex_farm_08:0 "Palácio Real do Púrpura"
 building_murex_farm_08_desc:0 "Um magnífico palácio adornado com decorações temáticas de púrpura tiriano se ergue como um símbolo de riqueza e poder. Ele demonstra a maestria local na produção de púrpura tiriano."
 building_nalanda_university:0 "$building_type_nalanda_university$"
 building_nalanda_university_desc:0 "$building_type_nalanda_university_desc$"
 building_nanhua_temple_01:0 "Templo Nanhua"
 building_nanhua_temple_01_desc:0 "Sede do Sexto Patriarca Huineng do Budismo Chan. Continua sendo um centro vibrante de ensinamentos Chan."
 building_nishapur_mines_01:0 "Escavações de Mineração de Nishapur"
 building_nishapur_mines_01_desc:0 "$building_type_nishapur_mines_01_desc$"
 building_nishapur_mines_02:0 "Mina de Nishapur"
 building_nishapur_mines_02_desc:0 "As escavações de mineração foram expandidas, e engenheiros foram contratados para aumentar verdadeiramente a extração de turquesa."
 building_nishapur_mines_03:0 "Grande Mina de Nishapur"
 building_nishapur_mines_03_desc:0 "Uma vila surgiu ao redor das muitas escavações de mineração, e os trabalhadores encontram turquesa de alta qualidade regularmente."
 building_nishapur_mines_04:0 "Complexo de Mineração de Nishapur"
 building_nishapur_mines_04_desc:0 "A extração de turquesa atingiu uma escala quase industrial, com a quantidade de trabalhadores agora variando na casa dos milhares. Riquezas aparentemente infinitas fluem das minas."
 building_notre_dame_01:0 "Notre-Dame"
 building_notre_dame_01_desc:0 "$building_type_notre_dame_01_desc$"
 building_oath_faithful_building_01:0 "Ermidas à Beira da Estrada"
 building_oath_faithful_building_01_desc:0 "Pequenos abrigos à beira da estrada abrigam ícones sagrados simples."
 building_oath_faithful_building_02:0 "Portões Sagrados"
 building_oath_faithful_building_02_desc:0 "Acima das entradas e por todo o assentamento, detalhadas obras religiosas inspiram reverência e prometem passagem segura."
 building_oath_faithful_building_03:0 "Santuários de Templos"
 building_oath_faithful_building_03_desc:0 "Os complexos de templos locais foram ampliados com jardins abobadados, lugares serenos que abrigam poços de água potável."
 building_oath_faithful_building_04:0 "Praças Monumentais"
 building_oath_faithful_building_04_desc:0 "Investimento considerável foi feito em praças centrais massivas, cheias de obras religiosas, mantidas livres de excesso e usura, e fornecendo água aos habitantes."
 building_oath_poor_building_01:0 "Costumes Caridosos"
 building_oath_poor_building_01_desc:0 "Pessoas com recursos são incentivadas pelas autoridades a doar alimentos e riqueza excedentes aos menos afortunados, normalmente durante dias sagrados."
 building_oath_poor_building_02:0 "Casas de Pobres"
 building_oath_poor_building_02_desc:0 "Os muito pobres, viúvas e idosos recebem hospedagem modesta e algum cuidado em acomodações simples."
 building_oath_poor_building_03:0 "Ministérios Benevolentes"
 building_oath_poor_building_03_desc:0 "Albergues e outras necessidades cívicas que atendem os desamparados são bem-servidos por ministros oficiais com algum recurso."
 building_oath_poor_building_04:0 "Instituições de Caridade"
 building_oath_poor_building_04_desc:0 "Por toda a terra, os necessitados não carecem de nada. Acomodações generosas abrigam possíveis vagabundos, hospitais cuidam dos doentes e idosos, e generosas ajudas são fornecidas aos camponeses pobres."
 building_oath_warriors_building_01:0 "Pequenas Propriedades de Veteranos"
 building_oath_warriors_building_01_desc:0 "Lutadores aristocráticos de longa experiência receberam generosas propriedades locais, e o interesse em servir lealmente aumentou aqui como resultado."
 building_oath_warriors_building_02:0 "Estâncias Marciais"
 building_oath_warriors_building_02_desc:0 "Os membros da classe guerreira aristocrática que sobrevivem ao campo de batalha vivem confortavelmente, e suas propriedades concedidas permitem recrutar e armar-se adequadamente."
 building_oath_warriors_building_03:0 "Feudos de Vila"
 building_oath_warriors_building_03_desc:0 "Muitas vilas locais são entregues a oficiais cavaleiros como propriedades pessoais, permitindo-lhes acumular força e riqueza às custas das outras classes."
 building_oath_warriors_building_04:0 "Vastos Domínios Marciais"
 building_oath_warriors_building_04_desc:0 "Uma parcela considerável dos impostos locais é entregue a pequenos aristocratas guerreiros, titulares de títulos de campo e assentamento. Suas poderosas comitivas, no entanto, ainda servem."
 building_offas_dyke_01:0 "$building_type_offas_dyke_01$"
 building_offas_dyke_01_desc:0 "$building_type_offas_dyke_01_desc$"
 building_orchards_01:0 "Pomares de Frutas"
 building_orchards_01_desc:0 "Pomares de frutas especializados, embora pequenos, produzem uma colheita mais abundante e de maior qualidade."
 building_orchards_02:0 "Bosques de Baga"
 building_orchards_02_desc:0 "Fileiras de arbustos de bagas quebram a monotonia das árvores frutíferas."
 building_orchards_03:0 "Plantações de árvores frutíferas"
 building_orchards_03_desc:0 "Uma área grande e bem espaçada, cheia de árvores bem podadas, todas com frutas ou nozes."
 building_orchards_04:0 "Apicultores(as)"
 building_orchards_04_desc:0 "Intercale colmeias entre as árvores para obter mel e tornar todo o pomar mais produtivo."
 building_orchards_05:0 "Fileiras de Nogueiras"
 building_orchards_05_desc:0 "Além de árvores frutíferas, fileiras de árvores com nozes alcançam a distância."
 building_orchards_06:0 "Jardins Mistos"
 building_orchards_06_desc:0 "Todos os tipos de árvores, nacionais e importadas, são distribuídas dentro do pomar - garantindo um rendimento frutífero independente das circunstâncias."
 building_orchards_07:0 "Grandes Pomares"
 building_orchards_07_desc:0 "Até onde a vista alcança, há fileiras e mais fileiras de árvores frutíferas."
 building_orchards_08:0 "Árvores Enxertadas"
 building_orchards_08_desc:0 "Ao enxertar certas árvores, a propagação de frutas e nozes de crescimento lento é muito melhorada."
 building_outposts_01:0 "Torres de Vigia"
 building_outposts_01_desc:0 "Para rastrear animais (e invasões), uma série de pontos de vista são controlados por guardas vigilantes. Se um animal perigoso for avistado, não demorará muito para que a notícia se espalhe para que o gado vulnerável possa ser levado para a segurança."
 building_outposts_02:0 "Postos Militares Avançados"
 building_outposts_02_desc:0 "Ao longo das muitas estradas e caminhos sinuosos, existem vários postos avançados, operados por guardas a serviço dos mercadores locais. A presença deles garante que a área permaneça tranquila e segura, livre de salteadores."
 building_outposts_03:0 "Caches de Armas Ocultas"
 building_outposts_03_desc:0 "Uma vantagem de viver em terrenos acidentados é a capacidade de camuflar quase tudo. Se uma invasão passar, os habitantes locais podem se armar com armas de vários esconderijos escondidos."
 building_outposts_04:0 "Postos Avançados da Paliçada"
 building_outposts_04_desc:0 "Os velhos postos avançados frágeis foram substituídos por torres de paliçada resistentes e resistentes. Além disso, eles estão quase perfeitamente escondidos no terreno acidentado."
 building_outposts_05:0 "Postos de Levantamento"
 building_outposts_05_desc:0 "Perto de cada torre agora existe um posto de levantamento. Em tempos de reunião, os camponeses contratados podem se reunir com segurança perto de onde possam encontrar armas e proteção."
 building_outposts_06:0 "Postos Avançados de Fronteira"
 building_outposts_06_desc:0 "Ao contrário dos postos avançados bem escondidos, a variedade da fronteira serve como um impedimento. Construídas com materiais mais resistentes, o tamanho dessas torres é suficiente para fazer qualquer invasor virar os calcanhares."
 building_outposts_07:0 "Estações de Escotismo"
 building_outposts_07_desc:0 "Para garantir que nossos batedores estejam bem alimentados e possam viajar com pouca bagagem, erguemos uma série de postos avançados de batedores estrategicamente posicionados. Bem escondidos dos olhos curiosos do inimigo, esses edifícios permitem que uma inteligência incomparável seja reunida em tempos de invasão."
 building_outposts_08:0 "Postos Avançados Fortificados"
 building_outposts_08_desc:0 "Imponentes postos avançados talhados em pedra agora se erguem em direção aos céus, fazendo sua presença ser sentida pelos soldados e guardas de caravana alojados dentro."
 building_paddy_fields_01:0 "Campos Alagados"
 building_paddy_fields_01_desc:0 "O cultivo de arroz é comum nas regiões mais úmidas do mundo. Normalmente, as sementes são plantadas no solo e depois regadas e cuidadas, mas sem ficarem totalmente submersas — no entanto, é exatamente assim que se deve cultivar arroz."
 building_paddy_fields_02:0 "Lavoura de Arrozais"
 building_paddy_fields_02_desc:0 "Água e solo sozinhos não bastam para cultivar arroz de forma eficaz. O terreno, mesmo submerso, precisa ser preparado — arado com enxadas e nivelado com ancinhos."
 building_paddy_fields_03:0 "Terraços Irrigados"
 building_paddy_fields_03_desc:0 "A água pode ser instável. Ela precisa ser controlada para se manter constante, e no cultivo do arroz, a consistência da água é absolutamente #italic essencial#!."
 building_paddy_fields_04:0 "Celeiros de Arroz"
 building_paddy_fields_04_desc:0 "Um cultivo aprimorado exige um armazenamento aprimorado. Mais arroz é inútil se apodrecer em uma pilha abandonada. Um edifício dedicado, construído sobre suportes para manter o piso afastado do chão, ajuda a secar e armazenar o arroz colhido."
 building_paddy_fields_05:0 "Cultivo de Mudas"
 building_paddy_fields_05_desc:0 "Nem todo arroz plantado precisa ser colhido para alimentação. Às vezes, é útil colher as mudas recém-brotadas antes que amadureçam, a fim de preservar uma determinada variedade e aumentar o estoque de sementes para o futuro."
 building_paddy_fields_06:0 "Grãos de Arroz Diversificados"
 building_paddy_fields_06_desc:0 "'Demais de uma boa coisa' vale tanto para a agricultura quanto para qualquer outra área. Cultivar apenas um tipo de arroz pode causar perdas desastrosas se um ano for um pouco mais seco, úmido, nublado ou apresentar qualquer outro desequilíbrio. É muito mais seguro manter uma mistura variada de grãos de arroz e se precaver contra o futuro."
 building_paddy_fields_07:0 "Colheita de Soqueira"
 building_paddy_fields_07_desc:0 "Os caules restantes das plantas de arroz colhidas podem ser estimulados a produzir novos brotos, gerando uma segunda safra na mesma estação. Nem todas as variedades de arroz respondem bem à soqueira, mas quando funciona, só há vantagens no cultivo."
 building_paddy_fields_08:0 "Moinhos de Arroz Industriais"
 building_paddy_fields_08_desc:0 "O arroz não é simplesmente colhido e jogado nas tigelas. Há toda uma cadeia de processamento — limpeza, secagem, descascamento e classificação. Fornos e fogueiras controladas podem acelerar a secagem, e pilões de arroz podem ser conectados a rodas d’água para mecanizar o processo de descascamento."
 building_pagoda_of_fogong_temple_01:0 "Pagode do Templo Fogong"
 building_pagoda_of_fogong_temple_01_desc:0 "O Pagode do Templo Fogong é uma alta estrutura de madeira construída sem pregos. Com nove andares, abriga relíquias e estátuas sagradas, e seu engenhoso design permanece um marco da engenharia e um símbolo de fé."
 building_palace_of_aachen_01:0 "Palácio de Aquisgrão"
 building_palace_of_aachen_01_desc:0 "$building_type_palace_of_aachen_01_desc$"
 building_palace_of_ctesiphon_01:0 "$building_type_palace_of_ctesiphon_01$"
 building_palace_of_ctesiphon_01_desc:0 "$building_type_palace_of_ctesiphon_01_desc$"
 building_palace_of_ctesiphon_02:0 "$building_type_palace_of_ctesiphon_02$"
 building_palace_of_ctesiphon_02_desc:0 "$building_type_palace_of_ctesiphon_02_desc$"
 building_palisades_01:0 "Paliçada Simples"
 building_palisades_01_desc:0 "Paliçadas simples oferecem proteção limitada, embora sejam eficazes contra escaramuças, são menos confiáveis contra grupos maiores de inimigos."
 building_palisades_02:0 "Paredes e Valas"
 building_palisades_02_desc:0 "Valas externas combinadas com paredes de paliçada reforçadas com pedra oferecem proteção decente contra cercos."
 building_pansjhir_mines_01:0 "Assentamento de Mineração de Pansjhir"
 building_pansjhir_mines_01_desc:0 "$building_type_pansjhir_mines_01_desc$"
 building_pansjhir_mines_02:0 "Mina de Pansjhir"
 building_pansjhir_mines_02_desc:0 "$building_rammelsberg_mines_02_desc$"
 building_pansjhir_mines_03:0 "Grande Mina de Pansjhir"
 building_pansjhir_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_pansjhir_mines_04:0 "Complexo de Mineração de Pansjhir"
 building_pansjhir_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_parthenon:0 "Partenon"
 building_parthenon_desc:0 "O templo sagrado da poderosa Atena se ergue orgulhosamente novamente, incontaminado por superstições tolas.\nEssas majestosas colunas e paredes, erguidas há mais de 1000 anos, resistiram ao teste do tempo e ainda protegem os lares dos fiéis de cima, um símbolo silencioso da bênção da Deusa Virgem que nomeou a cidade."
 building_pastures_01:0 "Pastos Simples"
 building_pastures_01_desc:0 "As pastagens são usadas pelos camponeses locais para manter pequenos animais, como ovelhas ou cabras."
 building_pastures_02:0 "Herdades"
 building_pastures_02_desc:0 "As Herdades abrigam camponeses, que cultivam grãos e criam animais para seu próprio uso."
 building_pastures_03:0 "Prado"
 building_pastures_03_desc:0 "Os prados são usados para pastar e para produzir feno para épocas mais difíceis."
 building_pastures_04:0 "Gaiolas"
 building_pastures_04_desc:0 "Gaiolas abrigam aves fáceis de manter, apreciadas tanto por seus ovos quanto por sua carne."
 building_pastures_05:0 "Currais de Gado"
 building_pastures_05_desc:0 "Os currais são resistentes o suficiente para manter animais maiores contidos e seguros."
 building_pastures_06:0 "Apiários"
 building_pastures_06_desc:0 "Entre a floresta e os campos, as abelhas alojadas em apiários produzem o tão procurado mel."
 building_pastures_07:0 "Currais"
 building_pastures_07_desc:0 "Os grandes currais abrigam cavalos e outras bestas de carga, mantendo-os seguros e felizes."
 building_pastures_08:0 "Fazendas de Gado"
 building_pastures_08_desc:0 "Fazendas são ideais para abrigar rebanhos maiores de gado, pois proporcionam amplo pasto e espaço abundante para se movimentar."
 building_patras_castle:0 "Castelo de Patras"
 building_patras_castle_desc:0 "A arcaica acrópole da cidade de Patras, erguendo-se em uma colina das montanhas Vodias, foi substituída por uma fortificação durante o reinado do Imperador Justiniano.\nO castelo tem sido utilizado ininterruptamente desde então, sempre sob a proteção do patrono local, São André, e do #EMP gênio loci#! Patrinella, a estátua romana de uma donzela."
 building_peat_quarries_01:0 "Terras de Gado"
 building_peat_quarries_01_desc:0 "A fertilidade das terras úmidas torna-as excelentes áreas de pastagem para animais pastoris de todos os tamanhos."
 building_peat_quarries_02:0 "Pedreiras de Turfa"
 building_peat_quarries_02_desc:0 "Uma quantidade significativa de turfa é extraída aqui. Sua presença auxilia no desenvolvimento de novas fazendas e campos."
 building_peat_quarries_03:0 "Prados de Feno"
 building_peat_quarries_03_desc:0 "Ao redor das terras úmidas, cresce uma grande quantidade de grama; uma vez colhida, pode ser usada como alimento para os animais durante o inverno."
 building_peat_quarries_04:0 "Poços de Sal"
 building_peat_quarries_04_desc:0 "Os trabalhadores usam grandes panelas para aquecer a água e extrair o sal dos pântanos. Esse sal é então usado para conservar a carne, que é comercializada."
 building_peat_quarries_05:0 "Pantanal Murada"
 building_peat_quarries_05_desc:0 "Ao isolar os pântanos, os camponeses podem controlar mais facilmente o crescimento das plantas e proteger a valiosa colheita nelas."
 building_peat_quarries_06:0 "Campos Pantanosos"
 building_peat_quarries_06_desc:0 "As propriedades únicas dos pântanos permitem que os camponeses cultivem com sucesso muitas plantas que de outra forma não seriam capazes, como cânhamo ou linho."
 building_peat_quarries_07:0 "Grandes Pedreiras de Turfa"
 building_peat_quarries_07_desc:0 "Mais e mais turfa está sendo extraída aqui, com a maior parte sendo exportada como fertilizante."
 building_peat_quarries_08:0 "Grandes Fazendas de Pântanos"
 building_peat_quarries_08_desc:0 "Grandes rebanhos de animais se alimentam da abundante vida vegetal dos pântanos, crescendo e crescendo."
 building_petra_01:0 "$building_type_petra_01$"
