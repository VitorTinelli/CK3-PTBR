 building_holy_site_chinese_temple_01_desc:0 "O [holy_site|E] nesta área é um ponto focal para os fiéis. Edifícios templários palacianos e pagodes em cores simbólicas são organizados em harmonia ao redor de um pátio simétrico. O layout equilibrado do complexo irradia uma reverência pacífica."
