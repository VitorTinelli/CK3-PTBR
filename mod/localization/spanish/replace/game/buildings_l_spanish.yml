 building_horse_pastures_01:0 "Domesticação de Cavalos Selvagens"
 building_horse_pastures_01_desc:0 "Cavalos que conseguem sobreviver por conta própria em terrenos árduos têm instintos notáveis. Então, em vez de domá-los, usaremos sua aptidão para ajudar nossos guerreiros."
 building_horse_pastures_02:0 "Chicotes de Couro para Cavalos"
 building_horse_pastures_02_desc:0 "Em vez de ferir os cavalos com ferramentas rudimentares como esporas, nossos guerreiros usam chicotes com uma alça de couro amarrada nos pulsos dos cavaleiros. Após usar o chicote, o guerreiro o deixa pendurado solto, liberando suas mãos."
 building_horse_pastures_03:0 "Selas de Arqueiro a Cavalo"
 building_horse_pastures_03_desc:0 "Selas com estribos altos, assentos profundos, arções altos e arreios permitem que nossos guerreiros continuem a montar enquanto se concentram completamente em disparar flechas contra nossos inimigos."
 building_horse_pastures_04:0 "Pontas de Flecha Perfurantes"
 building_horse_pastures_04_desc:0 "Derrubar as montarias normalmente desprotegidas é muito mais fácil do que mirar e ferir os cavaleiros inimigos."
 building_horse_pastures_05:0 "Armaduras de Couro para Cavalos"
 building_horse_pastures_05_desc:0 "Trajes de armadura leve protegem todo o animal sem limitar o movimento e a resistência do cavalo."
 building_horse_pastures_06:0 "Arcos Compostos Recurvados"
 building_horse_pastures_06_desc:0 "Arcos compostos, feitos de madeira, chifre de animal e tendão, unidos por cola de animal, são as armas perfeitas para nossos supremos arqueiros a cavalo."
 building_horse_pastures_07:0 "Cavalos Reservas"
 building_horse_pastures_07_desc:0 "Quando o cavalo de guerra fica cansado, o cavaleiro desmonta e troca por outro. O cavalo usado continua a acompanhar o cavaleiro e o resto dos cavalos reservas, embora sem o peso do cavaleiro. Esse abordagem permite que nossos exércitos cubram enormes distâncias e possam constantemente fazer reconhecimento à frente da força principal."
 building_horse_pastures_08:0 "Regras da Guerra Equina"
 building_horse_pastures_08_desc:0 "\"Garanta que seus homens mantenham a rédea solta em suas montarias e o freio da brida fora da boca, exceto quando permitir que eles cacem. Dessa forma, eles não conseguirão galopar à vontade. Após estabelecer essas regras, certifique-se de capturar e punir qualquer homem que as quebre. Qualquer homem que ignorar este decreto, corte sua cabeça onde ele estiver.\""
 building_hoshi_ryokan_01:0 "Hōshi Ryokan"
 building_hoshi_ryokan_01_desc:0 "Hōshi Ryokan é uma antiga pousada tradicional e um negócio familiar. Oferece aos viajantes descanso em sua jornada, com alimentação e acesso a banhos de fontes termais."
 building_hosios_loukas:0 "Hosios Loukas"
 building_hosios_loukas_desc:0 "O mosteiro é dedicado à preservação das relíquias do Venerável Lucas de Steiris, o monge eremita.\nOs santos restos são ditos exalar um óleo milagroso, e atraem incontáveis peregrinos que dormem ao lado da tumba para serem curados pela incubação. A decoração interior é elogiada por todo o Mediterrâneo Oriental por sua qualidade e esplendor, pois os melhores artistas da época a enriqueceram com mosaicos, ícones, candelabros, esculturas e tecidos."
 building_hospices_01:0 "Quartos de Peregrinos"
 building_hospices_01_desc:0 "Peregrinos diversos podem ficar e descansar nos quartos de peregrinos caso busquem abrigo durante suas longas jornadas. Aqui, eles também são tratados com comida, bebida e às vezes até um banho."
 building_hospices_02:0 "Casa dos Doentes"
 building_hospices_02_desc:0 "Uma modesta casa dos doentes foi construída aqui, para manter o ar ruim dos enfermos longe dos saudáveis e proporcionar um lugar tranquilo de cura para os enfermos."
 building_hospices_03:0 "Enfermarias"
 building_hospices_03_desc:0 "Em tempos de guerra ou peste, as enfermarias oferecem uma segunda chance para pobres vítimas afligidas, presumindo que cheguem lá a tempo."
 building_hospices_04:0 "Hospitais"
 building_hospices_04_desc:0 "Os hospitais oferecem cuidados de longo prazo para aqueles que de outra forma não sobreviveriam. Os cronicamente doentes, os deficientes e às vezes até aqueles afligidos por demônios são bem-vindos."
 building_hospices_05:0 "Jardins Hospitalares"
 building_hospices_05_desc:0 "Um jardim de flores foi plantado ao redor dos hospitais. Cada flor possui um aroma potente e agradável para contrabalançar o miasma criado pelos enfermos."
 building_hospices_06:0 "Hospital"
 building_hospices_06_desc:0 "Um prédio hospitalar central existe para fornecer cuidados e um local central para todos os hospitais. Enfermeiros e pessoas santas permanecem aqui para fornecer esmolas e cuidados para os moradores locais e viajantes enfermos."
 building_hospices_07:0 "Colônia de Lepra"
 building_hospices_07_desc:0 "Nos arredores selvagens perto do Hospício, uma pequena comunidade foi construída onde podem cultivar suas próprias colheitas e viver seus últimos dias entre si, não representando nenhum risco para os saudáveis na sociedade mais ampla."
 building_hospices_08:0 "Grande Hospital"
 building_hospices_08_desc:0 "Os hospitais oferecem esmolas e cuidados para os idosos e enfermos, e tratamento para os doentes e cansados. Aqui, eles são separados do resto da sociedade e cuidados por pessoas santas dedicadas."
 building_hotin_fort_01:0 "Fortaleza de Hotin"
 building_hotin_fort_01_desc:0 "$building_type_hotin_fort_01_desc$"
 building_hotin_fort_02:0 "Fortaleza de Hotin"
 building_hotin_fort_02_desc:0 "Uma impressionante fortaleza que faz a antiga fortaleza parecer insignificante. As fortificações foram expandidas ao longo dos séculos, incluindo altas paredes de pedra, um grande fosso e várias torres maciças. Esta estrutura defensiva vai manter a maioria dos sitiadores longe com facilidade."
 building_house_of_wisdom_01:0 "$building_type_house_of_wisdom_01$"
 building_house_of_wisdom_01_desc:0 "$building_type_house_of_wisdom_01_desc$"
