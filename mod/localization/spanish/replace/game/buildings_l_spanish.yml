 building_giant_wild_goose_pagoda_01:0 "Pagode do Grande Ganso Selvagem"
 building_giant_wild_goose_pagoda_01_desc:0 "O Pagode do Grande Ganso Selvagem foi originalmente construído em 652 d.C. como um local para guardar e conservar textos, entalhes e diversas figuras. Posteriormente, foi reconstruído com impressionantes dez andares, até que várias reformas e restaurações o reduziram a sete andares."
 building_golden_gate_of_kiev_01:0 "$building_type_golden_gate_of_kiev_01$"
 building_golden_gate_of_kiev_01_desc:0 "$building_type_golden_gate_of_kiev_01_desc$"
 building_gongsanseong_fortress_01:0 "Fortaleza Gongsanseong"
 building_gongsanseong_fortress_01_desc:0 "A Fortaleza Gongsanseong coroa as colinas acima do Rio Geum. Construída como a cidadela real de Baekje, suas longas muralhas e portões de pedra protegiam reis e súditos, sendo um bastião montanhoso de poder e defesa dinástica."
 building_great_megalith_01:0 "Grande Megalito"
 building_great_megalith_01_desc:0 "O Grande Megalith é um vasto e impressionante círculo de pedras que se estende pela paisagem, com inúmeros locais menores espalhados pelo campo. Aberto e disponível para todos, ele aproxima fiéis e peregrinos de todo o mundo do divino."
 building_great_project_cathedral_01:0 "Grande Catedral Românica"
 building_great_project_cathedral_01_desc:0 "Uma catedral primitiva em pé, sede de um bispo e farol para peregrinos cristãos. Sob pesados arcos arredondados e abóbadas imponentes, relíquias sagradas e altares aguardam os fiéis.\n\n[building|E] Efeitos: [GetDomicileBuilding('ecclesiastical_domicile_main_02').GetName] em [cathedral_complex|E]"
 building_great_project_cathedral_02:0 "Grande Catedral Gótica"
 building_great_project_cathedral_02_desc:0 "Construída sobre o legado da já imponente [GetBuilding('great_project_cathedral_01').GetName], abóbadas altaneiras e janelas rendilhadas elevam o olhar às alturas do céu. Rendas de pedra e arcos ogivais coroam um telhado renascido na sensibilidade de uma nova era.\n\n[building|E] Efeitos: [GetDomicileBuilding('ecclesiastical_domicile_main_03').GetName] em [cathedral_complex|E]"
 building_great_project_cathedral_03:0 "Grande Catedral Flamejante"
 building_great_project_cathedral_03_desc:0 "Construída sobre a já resplandecente [GetBuilding('great_project_cathedral_02').GetName], rendilhados em forma de chama e pedra esculpida coroam esta catedral como uma grande igreja da Cristandade.\n\n[building|E] Efeitos: [GetDomicileBuilding('ecclesiastical_domicile_main_04').GetName] em [cathedral_complex|E]"
 building_great_project_cathedral_under_construction:0 "Catedral em Construção"
 building_great_project_cathedral_under_construction_desc:0 "Erguendo-se entre guindastes de roda de piso e incontáveis andaimes, este edifício incompleto de pedra bruta prepara-se para um dia abrigar uma sé sagrada."
 building_great_wall_of_gorgan_01:0 "$building_type_great_wall_of_gorgan_01$"
 building_great_wall_of_gorgan_01_desc:0 "$building_type_great_wall_of_gorgan_01_desc$"
 building_guild_halls_01:0 "Salões da Guilda"
 building_guild_halls_01_desc:0 "$building_type_guild_halls_01_desc$"
 building_guild_halls_02:0 "Guilda de Escultores"
 building_guild_halls_02_desc:0 "Os escultores produzem itens de madeira ou osso, como molduras, decorações ou ferramentas. Eles também esculpem escudos heráldicos, tornando a guilda popular entre a nobreza."
 building_guild_halls_03:0 "Guilda de Carpinteiros"
 building_guild_halls_03_desc:0 "Os carpinteiros trabalham com construção, usando principalmente a madeira como material de escolha. Seus serviços são procurados tanto por nobres como pelo clero, especialmente pela bela jointery ornamentada que eles fazem para igrejas e propriedades."
 building_guild_halls_04:0 "Guilda dos Caçadores"
 building_guild_halls_04_desc:0 "Os caçadores comercializam carne e peles, e seus serviços permitem que açougueiros e curtidores façam seus artesanatos. As melhores peles naturalmente atingem as famílias nobres mais prestigiosas."
 building_guild_halls_05:0 "Guildas de Maçons"
 building_guild_halls_05_desc:0 "Os maçons trabalham com pedra, tanto para construção quanto para escultura. Sua habilidade é amplamente procurada, já que sua experiência é inestimável na construção de fortificações."
 building_guild_halls_06:0 "Guilda dos Alfaiates"
 building_guild_halls_06_desc:0 "Alfaiates usam agulha, linha e tecido como suas armas preferidas. Com suas habilidades incomparáveis, eles produzem belas roupas para a nobreza."
 building_guild_halls_07:0 "Guilda dos Viticultores"
 building_guild_halls_07_desc:0 "Os vidreiros criam itens fascinantes de vidro, de taças a vidros de janela. Ter artigos feitos de vidro é muito prestigioso, tornando seus serviços altamente desejáveis."
 building_guild_halls_08:0 "Guildas de Artesãos"
 building_guild_halls_08_desc:0 "Os artesãos usam uma grande variedade de materiais não apenas para produzir obras de arte, mas também inovações totalmente novas. Sua engenhosidade e habilidade refinada estão chamando a atenção de altos nobres em todos os lugares."
