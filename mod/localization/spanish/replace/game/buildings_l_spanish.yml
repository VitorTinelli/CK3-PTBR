 building_holy_site_japanese_temple_01:0 "Grande Santuário"
 building_holy_site_japanese_temple_01_desc:0 "O [holy_site|E] nesta área é um ponto de encontro para os devotos e dedicados. Um telhado impressionante compõe quase metade do edifício principal do templo e pode ser visto de longe. Dentro, um grande salão único pode abrigar quantos visitantes piedosos forem necessários."
