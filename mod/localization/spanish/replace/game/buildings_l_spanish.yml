 building_baofeng_mines_04:0 "Complexo de Mineração de Baofeng"
 building_baofeng_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_barracks_01:0 "Barracas de Madeira"
 building_barracks_01_desc:0 "Essas simples barracas de madeira oferecem proteção básica contra os elementos para as milícias enquanto treinam para a guerra."
 building_barracks_02:0 "Levantamento de Terras"
 building_barracks_02_desc:0 "Ao limpar uma grande faixa de terra de quaisquer obstruções, podemos reunir nossos soldados em um lugar para a divisão em unidades. A visão clara também permite a localização mais fácil de desertores."
 building_barracks_03:0 "Quartel de Pedra"
 building_barracks_03_desc:0 "As barracas de pedra mais robustas oferecem significativamente mais proteção contra os elementos, e o transporte das pedras é um ótimo treinamento para nossos homens."
 building_barracks_04:0 "Acampamentos Móveis"
 building_barracks_04_desc:0 "Embora as barracas permanentes sejam úteis para o treinamento, a disponibilidade de acampamentos móveis feitos de tendas aumenta nossa eficácia em tempos de guerra, já que as barracas podem se mover junto com o exército."
 building_barracks_05:0 "Forja"
 building_barracks_05_desc:0 "Ao contratar ferreiros para manter as lanças enferrujadas e os garfos tortos de nossas milícias, podemos tornar nossas tropas mais eficazes e um pouco mais letais."
 building_barracks_06:0 "Campos de Treinamento"
 building_barracks_06_desc:0 "Colocando manequins de treinamento e pistas de obstáculos, podemos peneirar o joio do trigo - e assim saberemos quais homens colocar na frente das formações ..."
 building_barracks_07:0 "Centros de Conscrição"
 building_barracks_07_desc:0 "Ao construir centros de recrutamento dedicados em todas as aldeias próximas, garantimos um fluxo constante de encrenqueiros mal-intencionados e alcoólatras para aumentar nossas fileiras."
 building_barracks_08:0 "Quartel Permanente"
 building_barracks_08_desc:0 "Embora muitas vezes tenhamos que mover nossas milícias a qualquer momento, a construção de barracas permanentes e bem construídas nos permite ter um local para abrigar os soldados e oficiais mais elitizados."
 building_besakih_temple_01:0 "Templo Besakih"
 building_besakih_temple_01_desc:0 "Conhecido como o “Templo Mãe de Bali”, Besakih é o complexo hindu mais importante e sagrado da ilha. Está localizado nas encostas do Monte Agung, o vulcão mais alto e montanha sagrada de Bali. É o coração religioso e cultural da ilha, sediando grandes cerimônias para todos."
 building_blacksmiths_01:0 "Ferreiros da Coroa"
 building_blacksmiths_01_desc:0 "Os melhores e mais produtivos ferreiros são empregados pela coroa e encarregados de produzir espadas, cota de malha e lanças para a guarda real."
 building_blacksmiths_02:0 "Guilda dos Ferreiros"
 building_blacksmiths_02_desc:0 "Ao colaborar com as várias guildas, grandes quantidades de equipamento podem ser feitas de forma barata sob encomenda."
 building_blacksmiths_03:0 "Forjas Reais"
 building_blacksmiths_03_desc:0 "Grandes forjas são construídas com o único propósito de fornecer armas à coroa, apenas os melhores ferreiros são empregados para trabalhar nelas."
 building_borobudur_01:0 "Borobudur"
 building_borobudur_01_desc:0 "Borobudur é um enorme templo budista composto por nove plataformas de pedra empilhadas umas sobre as outras, coroado por uma cúpula central. O templo é decorado com milhares de relevos e centenas de estátuas de Buda."
 building_breweries_01:0 "Casa de Cerveja"
 building_breweries_01_desc:0 "O coração de qualquer cervejaria, onde o processo de fabricação começa. Aqui, os ingredientes são misturados, fervidos e preparados para fermentação."
 building_breweries_02:0 "Adega de Armazenamento"
 building_breweries_02_desc:0 "Um local fresco e escuro onde as bebidas fermentadas são armazenadas para envelhecer, garantindo que desenvolvam os sabores e qualidades desejados."
 building_breweries_03:0 "Caldron de Fermentação"
 building_breweries_03_desc:0 "Grandes recipientes onde o mosto é fervido e ervas ou lúpulo são adicionados, uma etapa crítica no processo de fabricação para conferir amargor e aroma."
 building_breweries_04:0 "Celeiro de Grãos"
 building_breweries_04_desc:0 "Um celeiro para manter grandes quantidades de grãos secos e protegidos de pragas, garantindo um fornecimento constante de ingredientes para a fabricação."
 building_breweries_05:0 "Poço"
 building_breweries_05_desc:0 "Um poço feito para garantir uma fonte de água limpa e confiável, essencial para a produção de cervejas de alta qualidade."
 building_breweries_06:0 "Sala de Barris"
 building_breweries_06_desc:0 "Uma área onde a cerveja fermentada é cuidadosamente armazenada em barris, devidamente selados e prontos para distribuição."
 building_breweries_07:0 "Sala de Envasamento"
 building_breweries_07_desc:0 "Um espaço dedicado para encher barris. Estes são usados geralmente para grandes quantidades e são preferidos por tavernas e estalagens."
 building_breweries_08:0 "Sala de Degustação"
 building_breweries_08_desc:0 "Uma sala onde cervejeiros e convidados podem degustar as diferentes cervejas, oferecendo uma oportunidade para apreciar as últimas criações."
 building_brihadeeswarar_temple_01:0 "$building_type_brihadeeswarar_temple_01$"
 building_brihadeeswarar_temple_01_desc:0 "$building_type_brihadeeswarar_temple_01_desc$"
 building_buddhas_of_bamian_01:0 "$building_type_buddhas_of_bamian_01$"
 building_buddhas_of_bamian_01_desc:0 "$building_type_buddhas_of_bamian_01_desc$"
 building_burial_site_01:0 "Grande Local de Sepultamento"
 building_burial_site_01_desc:0 "Este vasto local de sepultamento está cheio de espaços para sepulturas comuns e alguns pequenos mausoléus para figuras mais significativas."
 building_burial_site_02:0 "Mausoléu"
 building_burial_site_02_desc:0 "Um grande mausoléu foi construído, cheio de locais para sepulturas comuns e lar de alguns túmulos para homens santos e guerreiros venerados."
 building_burial_site_03:0 "Mausoléu Grandioso"
 building_burial_site_03_desc:0 "O mausoléu foi expandido para se tornar um imponente monumento aos mortos. O interior está repleto de sepulturas e salas de oração para venerar os mortos."
 building_burkhan_khaldun_01:0 "$building_type_burkhan_khaldun_01$"
 building_burkhan_khaldun_01_desc:0 "$building_type_burkhan_khaldun_01_desc$"
 building_byeokran_port_01:0 "Porto de Byeokran"
 building_byeokran_port_01_desc:0 "Localizado a oeste da cidade de Gaeseong, na foz do rio Ryeseong, o porto de Byeokran é a rota mais direta para que mercadorias e viajantes estrangeiros entrem na península coreana, evitando as fronteiras e cadeias montanhosas do norte."
 building_camel_farms_01:0 "Criadores de Camelos"
 building_camel_farms_01_desc:0 "$building_type_camel_farms_01_desc$"
 building_camel_farms_02:0 "Postos de Escotismo"
 building_camel_farms_02_desc:0 "Os pilotos de camelo viajam regularmente entre os postos de reconhecimento, levando suprimentos e notícias sobre o que está acontecendo.."
 building_camel_farms_03:0 "Fabricantes de Arcos"
 building_camel_farms_03_desc:0 "A cavalaria de camelos se sai bem quando os cavaleiros estão equipados com arcos, e os fabricantes de arcos locais garantem um suprimento constante de equipamentos de arquearia."
 building_camel_farms_04:0 "Mercados de Camelos"
 building_camel_farms_04_desc:0 "O mercado está sempre agitado, com comerciantes negociando centenas de camelos por dia. Isso garante que nossos criadores tenham acesso ao espécime mais resistente e duradouro."
 building_camel_farms_05:0 "Campos de Recrutamento Nômades"
 building_camel_farms_05_desc:0 "Os ferozes nômades do deserto são excelentes soldados, mas não trabalham de graça. Ao fornecer a eles valores superiores como forma de pagamento, garantimos sua lealdade em conflitos futuros."
 building_camel_farms_06:0 "Estábulos Militares"
 building_camel_farms_06_desc:0 "Estábulos grandes e robustos abrigam nossos valiosos camelos de guerra, protegendo-os tanto de ladrões quanto da dureza do deserto."
 building_camel_farms_07:0 "Armeiros"
 building_camel_farms_07_desc:0 "Fazer armaduras para camelos não é uma tarefa fácil, mas a recompensa vale a pena. Uma investida de temíveis camelos totalmente blindados pode fazer qualquer exército baseado em cavalos virar a cauda e fugir."
 building_camel_farms_08:0 "Criadores Avançados"
 building_camel_farms_08_desc:0 "Aqui, verdadeiros especialistas em criação de camelos produzem e criam os estoques mais robustos e ferozes de camelos na região."
 building_can_benefit_requirements:0 "#S Se você cumprir os requisitos:#!\n"
 building_capital_bureau_01:0 "Tribunal"
 building_capital_bureau_01_desc:0 "A lei é o que faz uma cidade prosperar e crescer, e a lei só pode ser mantida no tribunal."
 building_capital_bureau_02:0 "Escritório de Segurança"
 building_capital_bureau_02_desc:0 "Este escritório emprega uma grande força policial, que mantém a cidade segura de criminosos e apreende infratores da lei."
 building_capital_bureau_03:0 "Sede dos Bombeiros"
 building_capital_bureau_03_desc:0 "Incêndios são uma ameaça constante que paira sobre qualquer área densamente populada. Uma equipe de bombeiros bem treinada apagará um incêndio antes que ele se espalhe."
 building_capital_bureau_04:0 "Administração das Guildas"
 building_capital_bureau_04_desc:0 "Nomear oficiais para supervisionar as várias guildas dentro da cidade garantirá que cada guilda seja eficiente, mantenha a qualidade e siga todos os procedimentos necessários."
 building_capital_bureau_05:0 "Departamento Judicial"
 building_capital_bureau_05_desc:0 "Um departamento expandido para assuntos judiciais é uma necessidade em uma cidade grande e crescente. Um exército de oficiais, escrivães e juízes trabalha sem esforço para manter a lei e a ordem."
 building_capital_bureau_06:0 "Cadeia Municipal"
 building_capital_bureau_06_desc:0 "Embora existam várias pequenas prisões espalhadas pela cidade, uma cadeia maior garantirá que qualquer pessoa que quebre a lei tenha uma cela esperando por ela."
 building_capital_bureau_07:0 "Faculdade de Comércio"
 building_capital_bureau_07_desc:0 "O comércio é um negócio muito lucrativo para não ser melhor regulamentado pela lei. Ao supervisionar as tarifas e bens que entram na cidade, podemos administrar os recursos da capital de maneira mais eficiente e, talvez, até ganhar um pouco mais de ouro."
 building_capital_bureau_08:0 "Palácio Urbano"
 building_capital_bureau_08_desc:0 "Uma residência grande e majestosa, espetacular o suficiente para envergonhar a maioria dos palácios, garante que o principal administrador possa estar sempre próximo e disponível. Pois, enquanto a cidade nunca dorme de verdade, seu administrador certamente o faz."
 building_caravanserai_01:0 "Caravanserai Pequeno"
 building_caravanserai_01_desc:0 "Um prédio retangular simples que oferece comodidades básicas para viajantes e comerciantes, para que possam descansar e recuperar-se durante longas jornadas."
 building_caravanserai_02:0 "Barracas de Mercador"
 building_caravanserai_02_desc:0 "Pequenas barracas de comerciantes, vendendo suprimentos básicos para a estrada. Com um ponto garantido de reabastecimento, as caravanas podem transportar mais mercadorias comerciais."
 building_caravanserai_03:0 "Quartéis da Guarda"
 building_caravanserai_03_desc:0 "A adição de quartéis permanentes da guarda e um conjunto de torres de vigia, ocupadas por sentinelas vigilantes, protege ativamente contra perigos ocultos nas vastidões da noite."
 building_caravanserai_04:0 "Salões de Comerciantes"
 building_caravanserai_04_desc:0 "Nesses salões, comerciantes de todos os cantos da Terra estão trocando mercadorias comerciais e compartilhando histórias das terras pelas quais viajaram."
 building_caravanserai_05:0 "Escritório de Alfândega"
 building_caravanserai_05_desc:0 "No calor intenso do sol, funcionários de rostos severos pesam, registram e taxam adequadamente todas as mercadorias comerciais que passam por este caravanserai. Nas sombras, indivíduos de rostos amigáveis oferecem maneiras de movimentar as mercadorias por uma taxa ainda mais... #EMP apropriada#!."
 building_caravanserai_06:0 "Oficinas de Artesãos"
 building_caravanserai_06_desc:0 "Com a abundância de matérias-primas e patronos ricos, os artesãos são capazes de criar e vender magníficos artefatos."
 building_caravanserai_07:0 "Banheiros"
 building_caravanserai_07_desc:0 "Banheiros espaçosos satisfazem até os desejos mais luxuosos. Para aqueles que viajam com bolsos mais leves, eles fornecem um refresco simples, porém bem-vindo."
 building_caravanserai_08:0 "Aposentos Reais"
 building_caravanserai_08_desc:0 "A adição de aposentos adequados acomoda de forma adequada os indivíduos importantes e honrosos que frequentemente visitam, tanto deste reino quanto de além."
 building_castle_01:0 "Bosque"
 building_castle_01_desc:0 "Esta pequena, mas formidável fortificação está situada sobre uma construção elevada de terra."
 building_castle_02:0 "Guarda"
 building_castle_02_desc:0 "A Fortaleza #weak (ou Donjon) é uma grande torre que serve como residência fortificada e última linha de defesa.#!"
 building_castle_03:0 "Castelo Concêntrico"
 building_castle_03_desc:0 "O Castelo Concêntrico é cercado por duas ou mais paredes, a interna mais alta que a externa."
 building_castle_04:0 "Fortaleza"
 building_castle_04_desc:0 "A Fortaleza é o epítome da defesa, capaz de repelir ataques inimigos e abrigar um grande exército."
 building_cattolica_stilo:0 "Cattolica di Stilo"
 building_cattolica_stilo_desc:0 "A influência bizantina neste edifício é forte: uma pequena igreja com batistério, em tijolos vermelhos aninhados sobre rochas nuas, com um plano de 'cruz inscrita' e uma rica decoração de ciclos de afrescos, dominando o vale do riacho Stilaro.\nA igreja é uma joia isolada no meio da natureza hostil, onde o homem pode se sentir mais próximo de Deus."
 building_celestial_great_barracks_01:0 "Grande Quartel"
 building_celestial_great_barracks_01_desc:0 "Este enorme quartel e fortaleza fornecem ao governador local soldados para reforçar seus exércitos e melhoram significativamente as defesas da região."
 building_cereal_fields_01:0 "Campos de Cultivo"
 building_cereal_fields_01_desc:0 "Os campos agrícolas, a espinha dorsal da economia feudal, cada um deles administrado por uma pequena, mas generosa família de camponeses - todos dispostos a entregar a maior parte do que produzem em dízimo à coroa!"
 building_cereal_fields_02:0 "Aldeias"
 building_cereal_fields_02_desc:0 "A construção de mais vilarejos significa que mais camponeses podem ser colocados para trabalhar nos campos, aumentando a produção e a tributação local."
 building_cereal_fields_03:0 "Crianças & Armazéns"
 building_cereal_fields_03_desc:0 "A construção de celeiros e armazéns maiores permite que os camponeses preservem feno e palha, fornece um local para guardar suas ferramentas e atua como um teto improvisado para exércitos em movimento e vagabundos."
 building_cereal_fields_04:0 "Fazendas"
 building_cereal_fields_04_desc:0 "Propriedades rurais maiores apoiam famílias camponesas maiores. Quando as famílias têm espaço e meios para crescer, gerarão mais filhos que podem trabalhar nos campos."
 building_cereal_fields_05:0 "Celeiros"
 building_cereal_fields_05_desc:0 "Celeiros permitem que os agricultores armazenem cereais, carne seca e outros tipos de alimentos ao longo do inverno. Embora não sejam imunes a ratos e outras pragas, pelo menos mantêm seu conteúdo seco."
 building_cereal_fields_06:0 "Granjas e Celeiros de Dízimo"
 building_cereal_fields_06_desc:0 "Os agricultores coletam com segurança a parte de sua produção devida ao clero em celeiros de dízimo — é claro, isso também facilita nossa tributação sobre eles."
 building_cereal_fields_07:0 "Vastas Plantações"
 building_cereal_fields_07_desc:0 "Ao incentivar os camponeses a cultivar campos maiores e mais próximos entre si, podemos aumentar a produtividade, embora invadir as terras uns dos outros possa causar conflitos entre os agricultores."
 building_cereal_fields_08:0 "Silos de Grão"
 building_cereal_fields_08_desc:0 "Esses silos enormes armazenam grãos em quantidades vastas ao longo de todo o ano e até entre anos, e podem sustentar uma população verdadeiramente grande."
 building_cevennes_mines_01:0 "Assentamento de Mineração dos Cévennes"
 building_cevennes_mines_01_desc:0 "$building_type_cevennes_mines_01_desc$"
 building_cevennes_mines_02:0 "Mina dos Cévennes"
 building_cevennes_mines_02_desc:0 "$building_rammelsberg_mines_02_desc$"
 building_cevennes_mines_03:0 "Grande Mina dos Cévennes"
 building_cevennes_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_cevennes_mines_04:0 "Complexo de Mineração dos Cévennes"
 building_cevennes_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_changan_market_01:0 "Mercado de Cháng'ān"
 building_changan_market_01_desc:0 "Os mercados da grandiosa cidade de Cháng'ān, #EMP Paz Perpétua#!, fervilham com todo tipo de comércio e são uma parada essencial para praticamente toda troca de mercadorias que entra ou sai da China."
 building_changan_market_02:0 "Grande Mercado de Cháng'ān"
 building_changan_market_02_desc:0 "Os prósperos mercadores de Cháng'ān já não se impressionam com as maiores maravilhas conhecidas pela humanidade — pois já as viram todas antes, e provavelmente possuem algumas delas."
 building_charnel_grounds_01:0 "Armazenamento de Cadáveres"
 building_charnel_grounds_01_desc:0 "Branqueados pelo sol e devorados por aves de rapina, os corpos se putrefazem no topo da colina."
 building_charnel_grounds_02:0 "Campos de Exocarnação"
 building_charnel_grounds_02_desc:0 "Parte local religioso, parte cemitério, os corpos em decomposição dos mortos são mantidos bem longe dos vivos aqui."
 building_charnel_grounds_03:0 "Escarpa Ritualística"
 building_charnel_grounds_03_desc:0 "Corpos jazem pela paisagem, sachês perfumados parcialmente cobrindo o cheiro ao redor dos caminhos onde os ainda vivos preparam novas oferendas aos elementos."
 building_chihu_mines_01:0 "Assentamento de Mineração de Chihu"
 building_chihu_mines_01_desc:0 "$building_type_baofeng_mines_01_desc$"
 building_chihu_mines_02:0 "Mina de Chihu"
 building_chihu_mines_02_desc:0 "$building_rammelsberg_mines_02_desc$"
 building_chihu_mines_03:0 "Grande Mina de Chihu"
 building_chihu_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_chihu_mines_04:0 "Complexo de Mineração de Chihu"
 building_chihu_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_chinjufu_01:0 "Distrito Chinjufu"
 building_chinjufu_01_desc:0 "Originalmente baseado em Taga, o Chinjufu é o centro fortificado dos esforços imperiais de pacificação no norte do Japão, supervisionado por um comandante especial responsável pela defesa e tributação da região."
 building_church_of_the_theotokos:0 "Templo da Theotokos"
 building_church_of_the_theotokos_desc:0 "A Santa Cruz há muito conquistou esta magnífica estrutura, derrotando o culto pagão à virgem deusa Atena.\nHoje em dia, abriga os santuários a Maria Parthenos, Mãe de Deus e única Virgem digna do nome #EMP Santo#!."
 building_cilician_gates:0 "Portões Cilicianos"
 building_cilician_gates_desc:0 "Os Portões Cilicianos são um passo pelas Montanhas Taurus que conecta as planícies cilicianas com o planalto anatólio.\nDesde tempos imemoriais, o passo tem sido fortificado, e controlá-lo significava controlar uma das principais artérias comerciais e militares da Ásia Menor e do Oriente Médio."
 building_citadel_of_aleppo_01:0 "Cidadela de Aleppo"
 building_citadel_of_aleppo_01_desc:0 "$building_type_citadel_of_aleppo_01_desc$"
 building_citadel_of_aleppo_02:0 "Cidadela de Aleppo Reconstruída"
 building_citadel_of_aleppo_02_desc:0 "Depois de passar por uma grande reconstrução, a Cidadela de Aleppo foi significativamente fortificada e transformada em uma cidade palaciana adequada!"
 building_citadel_shrine_01:0 "Torre Prasada"
 building_citadel_shrine_01_desc:0 "A Prasada coroa a $building_type_temple_citadel_01$, formando uma silhueta régia à distância. Ela permite que seus adoradores admirem o Santuário de longe."
 building_citadel_shrine_02:0 "Torre Prang"
 building_citadel_shrine_02_desc:0 "Coberta por delicadas esculturas, a Prang se eleva em cascatas estruturais, ampliando a impressão de altura. É um agradável ponto de contemplação enquanto as preces são entoadas — em palavras ou em silêncio reflexivo."
 building_citadel_shrine_03:0 "Estátuas Divinas"
 building_citadel_shrine_03_desc:0 "A coleção de estátuas contempla perpetuamente o éter, refletindo sobre a eternidade e frequentemente evocando emoções complexas em seus devotos."
 building_citadel_shrine_04:0 "Estátuas Singha"
 building_citadel_shrine_04_desc:0 "Com dentes à mostra e olhos penetrantes, esses ferozes leões guardiões oferecem sua bênção de proteção aos habitantes da $building_type_temple_citadel_01$."
 building_citadel_shrine_05:0 "Guardas Nāga"
 building_citadel_shrine_05_desc:0 "Cuidadosamente esculpidas em arenito, com o mandala inscrito em seus peitos, essas serpentes de sete cabeças oferecem paz e prosperidade aos moradores do Santuário."
 building_citadel_shrine_06:0 "Baixo-Relevos"
 building_citadel_shrine_06_desc:0 "Os cidadãos frequentemente param para admirar os minuciosos detalhes desses baixos-relevos, que retratam períodos dramáticos de batalhas, planos divinos e mitos de criação."
 building_citadel_shrine_07:0 "Relicários"
 building_citadel_shrine_07_desc:0 "Um tesouro de diversas estátuas e objetos religiosos e cerimoniais, esta $building_type_temple_citadel_01$ abriga uma coleção maior do que qualquer outra existente."
 building_citadel_shrine_08:0 "Imagem Devaraja"
 building_citadel_shrine_08_desc:0 "O Ser Divino, congelado no tempo em uma pose majestosa, permitindo que seus adoradores orem e prestem homenagens devotas em busca de suas bênçãos."
 building_citadel_thang_long_01:0 "Cidadela Đai La"
 building_citadel_thang_long_01_desc:0 "Uma cidadela que serve como base militar para os exércitos locais e é fortemente fortificada para ajudar a repelir invasores."
 building_citadel_thang_long_02:0 "Cidadela Imperial de Thăng Long"
 building_citadel_thang_long_02_desc:0 "A Cidadela Imperial atua como fortaleza e residência real. O complexo da cidadela inclui três setores: a fortificação principal, a cidade imperial e a Cidade Proibida."
 building_city_01:0 "Centro da Vila"
 building_city_01_desc:0 "$building_type_city_01_desc$"
 building_city_02:0 "Cidade Grande"
 building_city_02_desc:0 "Esta cidade atraiu a atenção de comerciantes e artesãos de todos os cantos, com comerciantes ricos abrindo lojas e artesãos diligentes construindo novas casas quase que diariamente."
 building_city_03:0 "Centro da Cidade"
 building_city_03_desc:0 "Não mais contente em apenas ocupar sua área original, a cidade agora inclui as terras agrícolas próximas em seu próspero centro. A cidade é vasta e cheia de riquezas e oportunidades."
 building_city_04:0 "Metrópole Movimentada"
 building_city_04_desc:0 "Esta cidade é conhecida em toda a parte pelas oportunidades abundantes que existem - diz-se que até o mais humilde camponês pode encontrar fortuna aqui. Casas se alinham nas ruas até onde a vista alcança, com carroças e animais transportando mercadorias para onde você olhar."
 building_city_wall_of_toledo_01:0 "$building_type_city_wall_of_toledo_01$"
 building_city_wall_of_toledo_01_desc:0 "$building_type_city_wall_of_toledo_01_desc$"
 building_common_tradeport_01:0 "Porto Pequeno"
 building_common_tradeport_01_desc:0 "Um porto humilde situado na costa, permitindo que os navios carreguem e descarreguem sua carga sem muito esforço."
 building_common_tradeport_02:0 "Tecelões de Rede de Pesca"
 building_common_tradeport_02_desc:0 "Uma oficina onde as redes de pesca são tecidas foi montada aqui. Dia após dia, as redes são feitas e reparadas incansavelmente."
 building_common_tradeport_03:0 "Porto Comercial"
 building_common_tradeport_03_desc:0 "O porto tornou-se um centro de comércio e viagens na área. Navios de toda a costa vêm aqui para negociar."
 building_common_tradeport_04:0 "Armadores"
 building_common_tradeport_04_desc:0 "Construtores navais habilidosos se reúnem neste porto para construir e consertar navios para o lance mais alto."
 building_common_tradeport_05:0 "Docas Expandidas"
 building_common_tradeport_05_desc:0 "Docas mais numerosas e maiores sustentam um número cada vez maior de embarcações comerciais."
 building_common_tradeport_06:0 "Estaleiros"
 building_common_tradeport_06_desc:0 "A aparição de edifícios dedicados à manutenção de navios marca um passo importante na transformação de um porto simples em um centro movimentado de poder marítimo."
 building_common_tradeport_07:0 "Porto Grande"
 building_common_tradeport_07_desc:0 "Este grande porto oferece docas abundantes, estaleiros e os melhores marinheiros da região. Todas as mercadorias necessárias para viajantes de longa distância podem ser encontradas aqui, e mercadores, pescadores e o exército têm todo o apoio de que necessitam."
 building_common_tradeport_08:0 "Docas Secas"
 building_common_tradeport_08_desc:0 "Nos estaleiros secos, o navio é navegado por um corredor estreito, onde a água é bombeada para fora. O navio é então suspenso em blocos de pedra e pode ser reparado e mantido com maior facilidade."
 building_culai_academy_01:0 "Academia Culai"
 building_culai_academy_01_desc:0 "Estudiosos construíram uma academia entre os picos do Monte Culai para estudar textos confucionistas em reclusão. Seus salões ecoavam com debates sobre a harmonia entre natureza e governo."
 building_curtain_walls_01:0 "Bastiões e Paredes Cortina"
 building_curtain_walls_01_desc:0 "O primeiro passo para qualquer fortificação respeitável é a construção de baluartes e paredes de cortina. Eles fazem um trabalho decente em manter inimigos (e camponeses rebeldes) à distância."
 building_curtain_walls_02:0 "Pátio"
 building_curtain_walls_02_desc:0 "A pátio é o local mais defensável para armazenar suprimentos críticos para sobreviver a um cerco: armas, armaduras e cabeças de porco em conserva."
 building_curtain_walls_03:0 "Torres de Parede"
 building_curtain_walls_03_desc:0 "As torres das muralhas atuam como excelentes pontos de observação, permitindo que nossos soldados atinjam exércitos que se aproximam com segurança. Quando não estão em guerra, eles são excelentes para se gabar dos camponeses de."
 building_curtain_walls_04:0 "Segunda Parede Cortina"
 building_curtain_walls_04_desc:0 "A adição de uma segunda parede cortina cria uma posição defensiva insuperável. Se um exército inimigo conseguir romper a primeira parede, eles serão saudados por mais uma - o suficiente para desmoralizar qualquer agressor!"
 building_curtain_walls_05:0 "Zwinger"
 building_curtain_walls_05_desc:0 "Quando um exército inimigo consegue romper as paredes externas, eles inconscientemente serão canalizados para o 'Zwinger' - também conhecido como o #emphasis killing fields#!. Diabolicamente inteligente!"
 building_curtain_walls_06:0 "Pátio Externo"
 building_curtain_walls_06_desc:0 "Mais paredes significam mais pátio e, por extensão, armazenamento mais seguro para suprimentos. Com tantos baileys, podemos até armazenar um estábulo inteiro de montarias de cavaleiro dentro das paredes - uma coisa excelente, se acabarmos com as cabeças de javali em conserva ..."
 building_curtain_walls_07:0 "Traço Italiano"
 building_curtain_walls_07_desc:0 "O traço italiano, ou forte baluarte, é um tipo de estrutura defensiva que pode resistir até mesmo ao implacável golpe dos canhões. Bem, não por muito tempo, mas pelo menos o suficiente para permitir uma fuga segura pelos túneis secretos ..."
 building_curtain_walls_08:0 "Ravelins & Cavaleiros"
 building_curtain_walls_08_desc:0 "O cavaleiro é uma plataforma elevada que permite que nossos soldados atirem sobre o parapeito principal, direto nos inimigos! Infelizmente, isso também significa que os inimigos sabem exatamente para onde apontar seus tiros ... Embora os soldados posicionados nos revelins, que são estruturas triangulares que dividem os inimigos sitiados, possam fazer o possível para evitar que isso aconteça."
 building_danevirke_01:0 "$building_type_danevirke_01$"
 building_danevirke_01_desc:0 "$building_type_danevirke_01_desc$"
 building_dau_temple_01:0 "Templo Dâu"
 building_dau_temple_01_desc:0 "Um templo venerado em Luy Lâu, marca o local onde monges de terras distantes se reuniram pela primeira vez. A torre de tijolos, as relíquias e os mestres mumificados que permanecem lá incorporam séculos de devoção ao budismo."
 building_dazaifu_01:0 "Escritório Dazaifu"
 building_dazaifu_01_desc:0 "A cidade de Dazaifu é o centro administrativo da corte imperial na distante Kyūshū. Criada para supervisionar a defesa da ilha, facilitar o comércio exterior e receber dignitários estrangeiros, o governo de Dazaifu é um passo comum na carreira de burocratas ambiciosos."
 building_dean_mines_01:0 "Assentamento de Mineração da Floresta de Dean"
 building_dean_mines_01_desc:0 "$building_type_dean_mines_01_desc$"
 building_dean_mines_02:0 "Mina da Floresta de Dean"
 building_dean_mines_02_desc:0 "$building_rammelsberg_mines_02_desc$"
 building_dean_mines_03:0 "Grande Mina da Floresta de Dean"
 building_dean_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_dean_mines_04:0 "Complexo de Mineração da Floresta de Dean"
 building_dean_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_despot_palace:0 "Palácio dos Déspotas"
 building_despot_palace_desc:0 "Um palácio grandioso em uma localização segura no Monte Taygetos, logo acima da cidade fortificada de Mistras.\nO palácio possui todos os luxos para competir com a grandeza dos salões constantinopolitanos, e é digno apenas dos governadores mais ricos e influentes."
 building_dieng_plateau_01:0 "Planalto Dieng"
 building_dieng_plateau_01_desc:0 "O Planalto Dieng é uma bacia vulcânica coberta por névoa, onde poças de enxofre e saídas de gás pontuam a paisagem. Antigos templos espalhados e lendas rituais o tornam tanto temido quanto reverenciado — uma terra sagrada onde antigas divindades do bem e do mal um dia vagaram."
 building_doges_palace_01:0 "$building_type_doges_palace_01$"
 building_doges_palace_01_desc:0 "$building_type_doges_palace_01_desc$"
 building_dome_of_the_rock_01:0 "Cúpula da Rocha"
 building_dome_of_the_rock_01_desc:0 "$building_type_dome_of_the_rock_01_desc$"
 building_dragon_kiln_01:0 "Forno Ascendente"
 building_dragon_kiln_01_desc:0 "Este forno longo puxa a corrente de ar do fogo horizontalmente, produzindo o calor intenso necessário para que os oleiros criem tigelas, vasos e outras cerâmicas valiosas."
 building_dragon_kiln_02:0 "Forno de Saggar"
 building_dragon_kiln_02_desc:0 "A produção de cerâmica é facilitada com o uso de saggars — simples recipientes que ajudam a proteger as peças em queima contra impurezas e danos, como fumaça, cinzas e detritos resultantes da produção em escala industrial."
 building_dragon_kiln_03:0 "Forno com Câmaras"
 building_dragon_kiln_03_desc:0 "Fechar o fogo principal do forno em uma série de câmaras regula a temperatura e facilita o carregamento e descarregamento das peças, permitindo a produção de cerâmicas de maior qualidade e em maior escala, que mais pessoas estão dispostas a pagar preços mais altos por elas."
 building_dunhuang_market_01:0 "Mercado de Dūnhuáng"
 building_dunhuang_market_01_desc:0 "Às margens reluzentes do rio Shule, a cidade de Dūnhuáng marca o portal entre o Corredor de Hexi e a bacia do Tarim, sendo um ponto de parada fundamental para todos os viajantes entre essas regiões."
 building_dunhuang_market_02:0 "Grande Mercado de Dūnhuáng"
 building_dunhuang_market_02_desc:0 "As ruas queimadas pelo sol de Dūnhuáng conhecem apenas o passo constante e preguiçoso de incontáveis camelos, mulas e homens carregados, cruzando caminhos entre o leste e o oeste."
 building_dushan_mines_01:0 "Assentamento de Mineração de Dushan"
 building_dushan_mines_01_desc:0 "$building_type_dushan_mines_01_desc$"
 building_dushan_mines_02:0 "Mina de Dushan"
 building_dushan_mines_02_desc:0 "$building_hetian_mines_02_desc$"
 building_dushan_mines_03:0 "Grande Mina de Dushan"
 building_dushan_mines_03_desc:0 "$building_hetian_mines_03_desc$"
 building_dushan_mines_04:0 "Complexo de Mineração de Dushan"
 building_dushan_mines_04_desc:0 "$building_hetian_mines_04_desc$"
 building_dvin_shuka_01:0 "Shuka de Dvin"
 building_dvin_shuka_01_desc:0 "O venerável mercado de Dvin tem servido como o grande centro do comércio armênio desde tempos imemoriais. Suas paredes são decoradas com azulejos coloridos e rebocos tingidos, refletindo a riqueza e o prestígio deste antigo mercado."
 building_dvin_shuka_02:0 "Grande Shuka de Dvin"
 building_dvin_shuka_02_desc:0 "O tempo não esgotou a vitalidade do augusto e antigo mercado de Dvin — na verdade, o venerável shuka parece mais vibrante do que nunca."
 building_effects_header:0 "#S Efeitos:#!\n"
 building_elephant_pens_01:0 "Pensões de Elefante"
 building_elephant_pens_01_desc:0 "Estes estábulos resistentes podem manter até o elefante mais rebelde protegido."
 building_elephant_pens_02:0 "Armadilhas para Elefantes"
 building_elephant_pens_02_desc:0 "Os novos elefantes são coletados ao prendê-los usando vários meios, como fossos ou armadilhas. Às vezes, uma elefanta pode até ser usada como isca."
 building_elephant_pens_03:0 "Campos de Treinamento de Elefantes"
 building_elephant_pens_03_desc:0 "Os elefantes não são feras fáceis de ensinar, mas nos campos de treinamento, os treinadores mais experientes fazem o possível para fornecer feras de guerra para a coroa."
 building_elephant_pens_04:0 "Campos de Passeio de Elefante"
 building_elephant_pens_04_desc:0 "Nos campos de equitação, os elefantes são testados, carregando a tripulação, a armadura e o equipamento."
 building_elephant_pens_05:0 "Gabinetes do Supervisor"
 building_elephant_pens_05_desc:0 "Os supervisores são responsáveis pelo bem-estar dos elefantes e, ao construir escritórios adequados para eles, sua eficiência é garantida."
 building_elephant_pens_06:0 "Hospitais de Elefantes"
 building_elephant_pens_06_desc:0 "Os hospitais especializados em elefantes são grandes o suficiente para acomodar até mesmo o maior dos machos, salvando a vida de animais que de outra forma certamente seriam perdidos."
 building_elephant_pens_07:0 "Santuários de Elefantes"
 building_elephant_pens_07_desc:0 "Ao designar grandes áreas da selva como santuários para os elefantes, garantimos que perderemos menos animais para a caça furtiva e que a população permaneça estável."
 building_elephant_pens_08:0 "Criadores de Elefantes"
 building_elephant_pens_08_desc:0 "Os criadores de elefantes garantem que novos bezerros nasçam e sejam criados apenas com o melhor e mais saudável estoque."
 building_enryaku_ji_01:0 "Templo Enryaku"
 building_enryaku_ji_01_desc:0 "Fundado por $SaichO_$ no final do século VIII, o Enryaku-ji está situado no Monte Hiei, com vista para a capital do Imperador Kanmu, Heian-kyō, sendo o centro do budismo Pundarika, ou Tendai, no Japão."
 building_etchmiadzin_cathedral:0 "Catedral de Vagarshapat"
 building_etchmiadzin_cathedral_desc:0 "Esta antiga catedral é o centro histórico do Cristianismo Apostólico Armênio. Originalmente fundada por São Gregório, o Iluminador, sobre um templo pagão para simbolizar o triunfo da nova religião adotada pelo Reino da Armênia, a igreja foi quase completamente destruída durante a invasão sasânida e reconstruída do zero alguns anos depois.\nApós o século VII, no entanto, a catedral foi repetidamente saqueada e abandonada, caindo em um estado de deterioração. Apenas uma intervenção drástica e cara poderia devolvê-la ao seu esplendor anterior."
 building_event_tower_of_silence_01:0 "Torre do Silêncio"
 building_event_tower_of_silence_01_desc:0 "$building_type_tower_of_silence_01_desc$"
 building_examination_hall_01:0 "Salas de Prova"
 building_examination_hall_01_desc:0 "Para avaliar os candidatos aos cargos governamentais, é necessário um local apropriado para realizar as provas. Uma sala dedicada a exames é o mínimo necessário — mas é um começo."
 building_examination_hall_02:0 "Templo Wenwu"
 building_examination_hall_02_desc:0 "Uma pequena prece pode dar a alguns candidatos mais confiança do que todos os estudos e preparações do mundo."
 building_examination_hall_03:0 "Academia Imperial"
 building_examination_hall_03_desc:0 "Um complexo com salas de aula, áreas de prova, escritórios de professores e depósitos fornece o suporte abrangente necessário para conduzir todas as etapas do exame imperial com máxima eficiência e qualidade."
 building_fairy_chimneys:0 "Assentamentos Trogloditas"
 building_fairy_chimneys_desc:0 "As rochas são extremamente maleáveis nesta área, formando naturalmente cones, picos e cavernas.\nOs humanos aproveitaram essas estruturas por séculos, construindo estábulos, armazéns e refúgios, depois casas e edifícios de produção, e finalmente igrejas dentro dos cones de rocha, formando assim assentamentos inteiros."
 building_falak_ol_aflak_citadel_01:0 "$building_type_falak_ol_aflak_citadel_01$"
 building_falak_ol_aflak_citadel_01_desc:0 "$building_type_falak_ol_aflak_citadel_01_desc$"
