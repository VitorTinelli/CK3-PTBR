 building_forbidden_city_01:0 "A Cidade Proibida"
 building_forbidden_city_01_desc:0 "A Cidade Proibida é um vasto palácio imperial, composto por quase mil edifícios distintos. Todo o complexo é cercado por uma alta muralha e um profundo fosso, protegendo o governo e os muitos oficiais que trabalham incansavelmente em seu interior."
