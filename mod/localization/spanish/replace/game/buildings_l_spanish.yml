 building_hall_of_heroes_04:0 "Salão dos Heróis IV"
 building_hall_of_heroes_04_desc:0 "$building_type_hall_of_heroes_01_desc$"
 building_hall_of_heroes_05:0 "Salão dos Heróis V"
 building_hall_of_heroes_05_desc:0 "$building_type_hall_of_heroes_01_desc$"
 building_hamadan_bazaar_01:0 "Bazar de Hamadan"
 building_hamadan_bazaar_01_desc:0 "No coração da antiga terra dos medos, Hamadan tem sido um centro de comércio desde a época das tábuas de argila e inscrições cuneiformes. Centenas de gerações de mercadores já venderam suas mercadorias e praticaram seus ofícios entre as bancas do grande bazar da cidade."
 building_hamadan_bazaar_02:0 "Grande Bazar de Hamadan"
 building_hamadan_bazaar_02_desc:0 "O grandioso bazar de Hamadan prospera como nunca antes, alcançando novos patamares de riqueza e atividade, inigualáveis em sua longa e digna história."
 building_hanging_temple_01:0 "Templo Suspenso"
 building_hanging_temple_01_desc:0 "O Templo Suspenso é um mosteiro pendurado em um penhasco no Monte Heng. Segundo a lenda, sua construção começou há séculos com um monge chamado Liaoran. Seus salões de madeira, construídos sobre estacas, abrigam santuários dedicados a sábios budistas, taoistas e confucionistas, unindo crenças e desafiando a gravidade com serena graça."
 building_hanxing_mines_01:0 "Assentamento de Mineração de Hanxing"
 building_hanxing_mines_01_desc:0 "$building_type_hanxing_mines_01_desc$"
 building_hanxing_mines_02:0 "Mina de Hanxing"
 building_hanxing_mines_02_desc:0 "$building_rammelsberg_mines_02_desc$"
 building_hanxing_mines_03:0 "Grande Mina de Hanxing"
 building_hanxing_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_hanxing_mines_04:0 "Complexo de Mineração de Hanxing"
 building_hanxing_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_heddal_stave_church_01:0 "$building_type_heddal_stave_church_01$"
 building_heddal_stave_church_01_desc:0 "$building_type_heddal_stave_church_01_desc$"
 building_heian_palace_01:0 "Palácio Heian"
 building_heian_palace_01_desc:0 "Construído pelo Imperador Kanmu como o ponto central de sua grande cidade de Heian-kyō, ou 'Capital da Paz', o vasto complexo do palácio abriga a corte imperial, a residência e os principais escritórios burocráticos do Japão. Seus corredores são centros movimentados de cerimônias, política e intrigas, onde antigas famílias aristocráticas disputam influência."
 building_herat_bazaar_01:0 "Bazar de Herat"
 building_herat_bazaar_01_desc:0 "Os movimentados mercados de Herat são renomados desde a época dos antigos aquemênidas, quando era chamada de #italic Haraiva#!. As caravanas que entram e saem da cidade diariamente fazem dos bazares de Herat a Pérola de Coração (Khorasan)."
 building_herat_bazaar_02:0 "Grande Bazar de Herat"
 building_herat_bazaar_02_desc:0 "Os bazares de Herat transbordam de comércio e troca. A Pérola de Coração brilha mais do que a joia mais polida de qualquer coroa."
 building_hetian_mines_01:0 "Assentamento de Mineração de Khotan"
 building_hetian_mines_01_desc:0 "$building_type_hetian_mines_01_desc$"
 building_hetian_mines_02:0 "Mina de Khotan"
 building_hetian_mines_02_desc:0 "À medida que o assentamento minerador cresce, mais e mais jade é extraída. Com a fama das pedras preciosas aumentando, um influxo crescente de engenheiros e comerciantes competentes melhora muito a lucratividade da operação."
 building_hetian_mines_03:0 "Grande Mina de Khotan"
 building_hetian_mines_03_desc:0 "Conforme as operações de mineração crescem, as próprias minas também se expandem. Mais pessoas são empregadas na extração, e o tráfego constante entre os diversos locais de mineração de jade tornou-se uma característica marcante da paisagem."
 building_hetian_mines_04:0 "Complexo de Mineração de Khotan"
 building_hetian_mines_04_desc:0 "Com o tempo, a jade passou a ser não apenas a principal exportação da região, mas também o sustento de muitos de seus artesãos. Uma verdadeira indústria de oficinas e revendedores agora se estende pelas ruas."
 building_hill_farms_01:0 "Campos de Encosta"
 building_hill_farms_01_desc:0 "Ao longo das encostas das muitas colinas existem numerosos pequenos campos, cultivando safras e sustentando uma pequena população de camponeses."
 building_hill_farms_02:0 "Pastagens Derrubadas"
 building_hill_farms_02_desc:0 "O gado é levado para as terras altas não cultivadas, ou campos, e permite que pastem nas abundantes gramíneas que crescem lá."
 building_hill_farms_03:0 "Adegas de Raiz"
 building_hill_farms_03_desc:0 "As adegas de raízes permitem o armazenamento de vegetais durante todo o ano, algo que é de extrema importância nas colinas pouco férteis."
 building_hill_farms_04:0 "Campos de Vegetais"
 building_hill_farms_04_desc:0 "Grandes campos de vegetais fornecem às fazendas esparsas os alimentos tão necessários."
 building_hill_farms_05:0 "Linchadores"
 building_hill_farms_05_desc:0 "Ao desviar água de um córrego próximo para um terraço, podemos aumentar massivamente a fertilidade dos campos nas encostas das colinas."
 building_hill_farms_06:0 "Estradas e Escadas"
 building_hill_farms_06_desc:0 "Estradas e escadas adequadas conectam as fazendas e povoados dispersos, permitindo uma comunicação mais fácil e viagens mais rápidas de pessoas, notícias e mercadorias."
 building_hill_farms_07:0 "Celeiros de Inverno"
 building_hill_farms_07_desc:0 "Grandes quantidades de animais de fazenda e pessoas podem ser alimentadas durante todo o inverno com os alimentos preservados nesses celeiros."
 building_hill_farms_08:0 "Pomares de Maçã"
 building_hill_farms_08_desc:0 "As colinas fornecem o ambiente perfeito para pomares, principalmente da variedade de maçã."
 building_hill_forts_01:0 "Pequeno Forte"
 building_hill_forts_01_desc:0 "O forte da colina ergue-se orgulhosamente no topo de uma colina, forçando qualquer sitiante a lutar uma batalha difícil."
 building_hill_forts_02:0 "Terraplenagem Simples"
 building_hill_forts_02_desc:0 "O forte é cercado de aterros, formando paredes impenetráveis de solo que podem fazer o soldado mais endurecido perder o ânimo.."
 building_hill_forts_03:0 "Valas"
 building_hill_forts_03_desc:0 "Grandes valas são escavadas ao redor do topo defensivo da colina. Devido às paredes lamacentas e escorregadias das valas, atacantes imprudentes podem se encontrar presos no fundo, afogados na lama pelo avanço de seus colegas soldados."
 building_hill_forts_04:0 "Paliçadas"
 building_hill_forts_04_desc:0 "Grandes paredes feitas de troncos afiados cercam o forte, fornecendo mais um obstáculo antes de chegar aos tesouros dentro."
 building_hill_forts_05:0 "Guardas"
 building_hill_forts_05_desc:0 "Em torno do forte, guardas são colocados, com guardas alertas prontos a qualquer momento, caso um ataque comece."
 building_hill_forts_06:0 "Paredes Externas"
 building_hill_forts_06_desc:0 "Grandes paredes de pedra agora cercam o forte da colina, de uma vez por todas cimentando sua natureza impenetrável."
 building_hill_forts_07:0 "Grande Forte de Colina"
 building_hill_forts_07_desc:0 "O forte central foi ampliado e melhorado significativamente, agora sobe muito em direção aos céus de uma maneira imponente."
 building_hill_forts_08:0 "Terraplenagem Complexa"
 building_hill_forts_08_desc:0 "A terraplenagem ao redor do forte da colina é tão complexa e confusa que os exércitos inimigos mal sabem qual entrada eles devem invadir, algo que funciona a nosso favor - especialmente visto que metade deles leva a armadilhas mortais ..."
 building_hillside_grazing_01:0 "Pastos nas Colinas"
 building_hillside_grazing_01_desc:0 "Grandes áreas externas abertas são ideais para serem utilizadas como pastos para cavalos de todos os tamanhos e tipos. Qualquer pessoa com um cavalo tem o direito de utilizar essas terras de pastagem, apoiando a agricultura, bem como os cavaleiros locais."
 building_hillside_grazing_02:0 "Pastores"
 building_hillside_grazing_02_desc:0 "Conforme a criação de cavalos se torna ainda mais importante para a economia local, estas terras de pastagem agora apoiam um grande grupo de pessoas envolvidas na criação dos animais."
 building_hillside_grazing_03:0 "Área de Pastagem Expandida"
 building_hillside_grazing_03_desc:0 "Embora esta seja uma área naturalmente adequada para pastagem, ainda existem maneiras de expandir a área disponível. Árvores podem ser derrubadas e pedras removidas, a recuperação de terras da natureza nunca realmente para."
 building_hillside_grazing_04:0 "Fazendas de Cavalos"
 building_hillside_grazing_04_desc:0 "Qualquer terra cultivável nesta área é eventualmente comprada pelos criadores de cavalos, para quem os vegetais e pequenas produções ajudam a sustentar sua força de trabalho em crescimento."
 building_hillside_grazing_05:0 "Pequenas Fazendas de Cavalos"
 building_hillside_grazing_05_desc:0 "Com o tempo, um número de fazendas dedicadas, onde cavalos são criados, alimentados e treinados, tornaram-se parte integrante da economia local."
 building_hillside_grazing_06:0 "Mercados de Cavalos"
 building_hillside_grazing_06_desc:0 "A negociação de cavalos é uma parte natural da criação e reprodução de montarias. Conforme o negócio se desenvolve, um número mais ou menos permanente de cidades de mercado de cavalos começará a se formar de temporada em temporada."
 building_hillside_grazing_07:0 "Marechais de Cavalos"
 building_hillside_grazing_07_desc:0 "Para criar e alimentar cavalos de guerra de alta qualidade, é necessário alguém que cuide de seus diversos problemas e lesões, bem como avalie sua qualidade de maneira sistemática. Conforme a criação de cavalos se torna cada vez mais importante nesta área, o marechal de cavalos responsável pelos cuidados com as montarias também se torna essencial."
 building_hillside_grazing_08:0 "Grandes Fazendas de Cavalos"
 building_hillside_grazing_08_desc:0 "Com o tempo, todas as terras de pastagem foram consolidadas sob um número de grandes fazendas, responsáveis pela criação e treinamento de grandes quantidades de cavalos de guerra fortes."
