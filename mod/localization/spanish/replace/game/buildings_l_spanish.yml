 building_hadrians_wall_01:0 "$building_type_hadrians_wall_01$"
 building_hadrians_wall_01_desc:0 "$building_type_hadrians_wall_01_desc$"
 building_hagia_sophia_01:0 "Catedral Santa Sofia"
 building_hagia_sophia_01_desc:0 "$building_type_hagia_sophia_01_desc$"
 building_hagia_sophia_02:0 "Mesquita Santa Sofia"
 building_hagia_sophia_02_desc:0 " A Santa Sofia é uma verdadeira maravilha da engenharia, com uma enorme cúpula e quatro minaretes impressionantes que se destacam como as características mais impressionantes. Iniciado em 537 DC pelo imperador Justiniano I, desde então foi transformado em uma mesquita inspiradora.\n\nE assim permanecerá por toda a eternidade, pois certamente nada poderia derrubar o poder de Roma."
 building_hagios_demetrios:0 "Hagios Demetrios"
 building_hagios_demetrios_desc:0 "A igreja de São Demétrio é o santuário mais importante da cidade.\nErguida pela primeira vez quando a fé em Cristo ainda era jovem, incorpora o banheira romana em que o Santo, junto com muitos outros primeiros crentes, foi preso, martirizado e enterrado."
 building_hakata_port_01:0 "Porto de Hakata"
 building_hakata_port_01_desc:0 "Desde os primeiros dias de Yamato, a cidade portuária de Hakata, na costa norte de Kyūshū, tem sido um portal naval — um movimentado ponto de conexão supervisionado pelo escritório de Dazaifu próximo, onde comerciantes vendem bens de terras distantes e delegações diplomáticas pisam nas margens do Japão."
 building_hakata_port_02:0 "$building_hakata_port_01$"
 building_hakata_port_02_desc:0 "$building_hakata_port_01_desc$"
 building_hall_of_heroes_01:0 "Salão dos Heróis I"
