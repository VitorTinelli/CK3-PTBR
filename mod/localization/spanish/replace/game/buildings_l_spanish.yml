 building_yungang_grottoes_01:0 "Grutas de Yungang"
 building_yungang_grottoes_01_desc:0 "Um grande complexo de grutas-templo, contendo várias dezenas de cavernas maiores e centenas de menores. As cavernas estão repletas de milhares e milhares de estátuas de Buda."
