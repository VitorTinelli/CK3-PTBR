 building_alhambra_01_desc:0 "$building_type_alhambra_01_desc$"
 building_alhambra_02:0 "Palácio Real de $building_type_alhambra_01$"
 building_alhambra_02_desc:0 "A Alhambra, desde os seus dias como uma simples ruína romana, foi transformada em um palácio real digno de um imperador! Um exemplo brilhante da arquitetura local, a cor dos edifícios em contraste com as florestas ao redor levou poetas a descrevê-la como 'uma pérola incrustada em esmeraldas'."
 building_aljaferia_palace_01:0 "$building_type_aljaferia_palace_01$"
 building_aljaferia_palace_01_desc:0 "$building_type_aljaferia_palace_01_desc$"
 building_allaq_mines_01:0 "Assentamento de Mineração de Wadi al-Allaq"
 building_allaq_mines_01_desc:0 "$building_type_allaq_mines_01_desc$"
 building_allaq_mines_02:0 "Mina de Wadi al-Allaq"
 building_allaq_mines_02_desc:0 "$building_rammelsberg_mines_02_desc$"
 building_allaq_mines_03:0 "Grande Mina de Wadi al-Allaq"
 building_allaq_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_allaq_mines_04:0 "Complexo de Mineração de Wadi al-Allaq"
 building_allaq_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_ananda_temple_01:0 "$building_type_ananda_temple_01$"
 building_ananda_temple_01_desc:0 "$building_type_ananda_temple_01_desc$"
 building_angkor_wat_01:0 "Angkor Wat"
 building_angkor_wat_01_desc:0 "Angkor Wat é um imenso complexo de templos dedicado à divindade Vishnu. Ele foi projetado para representar o Monte Meru, morada dos deuses na mitologia hindu. O complexo é cercado por um impressionante fosso e possui vários templos com galerias, repletos de arte religiosa, esculturas e relevos."
 building_apollinare_nuovo:0 "Sant'Apollinare Nuovo"
 building_apollinare_nuovo_desc:0 "A Basílica de Sant'Apollinare Nuovo só ganhou seu nome atual recentemente, quando as relíquias de São Apolinário foram transferidas da Basílica vizinha em Classe. Sua história, no entanto, é muito mais longa.\nPrimeiramente consagrada no início do século VI pelo Rei Teodorico dos Ostrogodos como uma igreja ariana, o edifício passou por muitas renovações tanto em estrutura quanto em decoração, mantendo seu estilo único — uma elegante mistura de arte ocidental e oriental — e seus impressionantes mosaicos bizantinos."
 building_archery_ranges_01:0 "Campos de Tiro com Arco"
 building_archery_ranges_01_desc:0 "Todos são bem-vindos no campo de tiro com arco, independentemente de serem ricos ou pobres. A razão é dupla; camponeses que podem disparar um arco são mais úteis na guerra, e atiradores experientes se mantêm em sua melhor forma quando podem competir em torneios."
 building_archery_ranges_02:0 "Arqueiros Reais"
 building_archery_ranges_02_desc:0 "Os melhores arcos são empregados pela coroa e preparados para fabricar os arcos da mais alta qualidade que puderem em instalações construídas especificamente para a tarefa."
 building_archery_ranges_03:0 "Alcance do Atirador"
 building_archery_ranges_03_desc:0 "Para inspirar o campesinato e fornecer um amplo desafio para nossos atiradores, esses campos especiais são projetados para treinar nossos arqueiros em tiro com arco de longa distância."
 building_argentiera_mines_01:0 "Acordo de Mineração Argentiera"
 building_argentiera_mines_01_desc:0 "$building_type_argentiera_mines_01_desc$"
