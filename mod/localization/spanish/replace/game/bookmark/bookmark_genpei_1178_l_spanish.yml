l_spanish:
 bm_1178_genpei:0 "Ascensão dos Bushi"
 bm_1178_genpei_desc:0 "Pouco a pouco, os samurais tomaram o poder da capital, governando as províncias do Japão como seus próprios feudos, enriquecendo a si mesmos e seus seguidores.\n\nNas últimas décadas, os orgulhosos Minamoto foram repetidamente derrotados pelos imparáveis Taira. Lançam-se sobre seus ferimentos enquanto Kiyomori domina a capital. Medo e força agora governam, enquanto o Kampaku e a família imperial observam impotentes.\n\n#bold Os Minamoto conseguirão pôr fim à ascensão dos Taira, ou algum outro destino aguarda estas ilhas?#!"
 bookmark_genpei_hidehira:0 "$Hidehira$ $dynn_Fujiwara$"
 bookmark_genpei_hidehira_desc:0 "Enquanto a maioria dos [Glossary('Fujiwara', 'FUJIWARA_GLOSS')] escrevia poesia na capital, os descendentes do General Hidesato se estabeleceram no severo norte, pacificando tribos e competindo com outros bushi.\n\nO avô de Hidehira foi adotado pela família Kiyohara, governantes de Ōshū. Destruindo todos os rivais à herança daquele clã, ele restaurou o nome Fujiwara e ampliou o controle sobre o norte.\n\n#BOLD A complacência cortesã dos Fujiwara deu origem à ameaça dos [Glossary('Minamoto', 'MINAMOTO_GLOSS')] e [Glossary('Taira', 'TAIRA_GLOSS')]. A espada que conquistou o norte; poderá restaurar a primazia Fujiwara?#!"
 bookmark_genpei_hidehira_hidehisa:0 "$Hidehisa$"
 bookmark_genpei_hidehira_subheading:0 "Senhor de Mutsu"
 bookmark_genpei_hidehira_yasuhira:0 "$Yasuhira$"
 bookmark_genpei_kiyomori:0 "$emperor_daijo_daijin_male_japanese_feudal$ $Kiyomori$ $dynn_Taira$"
 bookmark_genpei_kiyomori_desc:0 "Os [Glossary('Kanmu Taira', 'TAIRA_GLOSS')] se estabeleceram como a família samurai mais poderosa do Japão, tendo conseguido marginalizar seus ferozes rivais bushi, os [Glossary('Minamoto', 'MINAMOTO_GLOSS')], e os burocratas [Glossary('Fujiwara', 'FUJIWARA_GLOSS')].\n\nCom sua filha casada com o Imperador Norihito da dinastia [Glossary('Yamato', 'YAMATO_GLOSS')], Kiyomori espera um neto. Um príncipe nascido Taira na linha de sucessão consolidará a supremacia da família na corte. Esta pedra angular do poder não será facilmente estabelecida enquanto inimigos invejosos abundarem.\n\n#BOLD Você estabelecerá um domínio duradouro dos Taira sobre o Japão, ou cairá no último obstáculo?#!"
 bookmark_genpei_kiyomori_shigemori:0 "$Shigemori$"
 bookmark_genpei_kiyomori_subheading:0 "$BOOKMARK_SUBHEADING_RULING_REGENT$"
 bookmark_genpei_kiyomori_tsunemori:0 "$Tsunemori$"
 bookmark_genpei_motofusa:0 "$Motofusa$ $dynn_Fujiwara$"
 bookmark_genpei_motofusa_desc:0 "Oficialmente servindo como [Glossary('regentes', 'KAMPAKU_GLOSS')], a família [Glossary('Fujiwara', 'FUJIWARA_GLOSS')] governou o Japão nas sombras por séculos, dominando a burocracia da capital e casando-se com a dinastia [Glossary('Yamato', 'YAMATO_GLOSS')].\n\nNo entanto, longe da capital, os samurais construíram feudos privados. Sua riqueza e armas agora superam em muito as dos nobres burocratas. Os bushi mais poderosos, os [Glossary('Taira', 'TAIRA_GLOSS')], liderados por Kiyomori, tomaram o controle da capital.\n\n#BOLD Você pode deter a ascensão dos samurais e reacender a glória de uma corte liderada pelos Fujiwara?#!"
 bookmark_genpei_motofusa_kanezane:0 "$Kanezane$"
 bookmark_genpei_motofusa_subheading:0 "$game_concept_governor$ de $c_oki$"
 bookmark_genpei_motofusa_takatada:0 "$Takatada$"
 bookmark_genpei_yoritomo:0 "$Yoritomo$ $dynn_Minamoto$"
 bookmark_genpei_yoritomo_desc:0 "A outrora poderosa família [Glossary('Seiwa Minamoto', 'MINAMOTO_GLOSS')] sofreu incontáveis reveses, sucumbindo a lutas internas enquanto seus antigos rivais, os [Glossary('Kanmu Taira', 'TAIRA_GLOSS')], recolhiam os cacos.\n\nCom Minamoto Yorimasa oferecendo pouca resistência, Yoritomo e os outros filhos sobreviventes do famoso General Yoshitomo são talvez tudo o que separa Taira Kiyomori da dominação total do Japão.\n\n#BOLD Em breve, os Taira serão poderosos demais para serem enfrentados. Você sucumbirá a pequenos golpes, ou unirá o país e trará uma paz duradoura?#!"
 bookmark_genpei_yoritomo_noriyori:0 "$Noriyori$"
 bookmark_genpei_yoritomo_subheading:0 "Senhor de $c_izu$"
 bookmark_genpei_yoritomo_yoshitsune:0 "$Yoshitsune$"
 bookmark_genpei_yoshinaka:0 "$Yoshinaka$ $dynn_Minamoto$"
 bookmark_genpei_yoshinaka_desc:0 "Divididos sobre a liderança e herança dos Kawachi [Glossary('Minamoto', 'MINAMOTO_GLOSS')], o filho mais velho Yoshitomo mandou matar seu irmão Yoshikata nos combates seguintes.\n\nA família Nakahara acolheu o filho fugido de Yoshikata nas montanhas de Shinano, e embora Yoshitomo esteja há muito falecido, Yoshinaka, agora adulto, não esqueceu seu direito de nascimento perdido.\n\n#BOLD Você vingará seu pai sobre seu primo Yoritomo, herdeiro de Yoshitomo, ou ajudará a família contra um inimigo maior?#!"
 bookmark_genpei_yoshinaka_subheading:0 "Senhor de $c_shinano$"
 bookmark_genpei_yoshinaka_tomoe:0 "$Tomoe$ $Gozen$"
 bookmark_genpei_yoshinaka_yoshitaka:0 "$Yoshitaka_2$"
