l_spanish:
 bm_867_mandalas:0 "Deuses Vivos na Terra"
 bm_867_mandalas_desc:0 "Não há lugar onde o poder régio e espiritual esteja tão entrelaçado quanto no Sudeste Asiático. Por centenas de anos, as fés Dhármicas ganharam maior influência sobre seu povo, mas apenas no último século aqueles que antes eram Reis começaram a assumir o título de Devaraja, Reis-Deuses.\n\n#bold Quais desses Reis-Deuses construirão um legado de devoção, e quem será derrotado e esquecido?#!"
 bookmark_mandalas_867_indra:0 "Indra"
 bookmark_mandalas_867_indra_desc:0 "O pequeno reino de Kutai foi um dos primeiros no arquipélago a convidar sacerdotes hindus para apoiar seu governo.\n\nNo entanto, a dinastia Segara não conseguiu transformar essa aliança em autoridade como visto em outros lugares, governando um reino que se baseia tanto em lealdades tribais quanto em cerimônias religiosas.\n\n#bold Indra continuará no caminho de se tornar um Mandala, ou retornará às suas raízes, abraçando os modos dos estados tribais da ilha?#!"
 bookmark_mandalas_867_indra_subheading:0 "Raja de Kutai"
 bookmark_mandalas_867_jayavarman_angkor:0 "Jayavarman III"
 bookmark_mandalas_867_jayavarman_angkor_desc:0 "Angkor tem sido um poder novo e em ascensão desde a época de Jayavarman II, o primeiro desta linhagem a assumir o título de Devaraja. Após sua morte, o reino dificilmente é reconhecível como o grande império que foi, reduzido a pouco mais do que uma cidade-estado.\n\nAinda assim, ser o deus dos Khmer não é um papel fácil de dominar. Jayavarman III tem tido dificuldades em superar seu predecessor e tornar-se um grande arquiteto por si próprio.\n\n#bold Os Varmans conseguirão viver à altura de seu legado divino? Ou serão superados por outros que reivindicam a soberania sobre esta terra?#!"
 bookmark_mandalas_867_jayavarman_angkor_subheading:0 "Sdach de Angkor"
 bookmark_mandalas_867_lokapala:0 "Lokapala"
 bookmark_mandalas_867_lokapala_desc:0 "Lokapala tomou o controle de toda a parte oriental de Java e agora desfruta de grande controle direto. No entanto, a parte ocidental da ilha ainda paga tributo aos rivais imperadores de Srivijaya.\n\n#bold O destino dos Sanjayas é expandir seu domínio sobre as outras ilhas? Ou acabarão como um tributo periférico do império naval de Srivijaya?#!"
 bookmark_mandalas_867_lokapala_subheading:0 "Raja de Mataram"
 bookmark_mandalas_867_padumaraja:0 "Padumaraja"
 bookmark_mandalas_867_padumaraja_desc:0 "Ainda não tão promissor quanto as metrópoles em ascensão de Pagan ou Angkor, a pequena cidade-estado Mon de Haripunjaya muitas vezes desempenhou o papel de vassalo submisso, apesar de sua posição privilegiada entre esses reinos.\n\nPadumaraja é o último de Haripunjaya, uma dinastia com grandes ambições que, até agora, não conseguiu alcançar uma posição mais elevada.\n\n#bold Padumaraja será finalmente aquele que elevará sua dinastia aos deuses?#!"
 bookmark_mandalas_867_padumaraja_subheading:0 "Sdach de Haripuñjaya"
 bookmark_mandalas_867_pyinbya:0 "Pyinbya"
 bookmark_mandalas_867_pyinbya_desc:0 "Uma das várias cidades concorrentes no vale do Irrawaddy, Pagan é agora um poder regional, comandando um vasto número de tributários.\n\nPyinbya de Pagan vem de uma longa linhagem de reis locais, mas é ele quem transformou uma cidade em um reino aspirante.\n\n#bold Pyinbya transformará Pagan na grandiosa capital que está destinado a ser?#!"
 bookmark_mandalas_867_pyinbya_subheading:0 "Raja de Pagan"
 bookmark_mandalas_867_saladu:0 "Saladu"
 bookmark_mandalas_867_tanet:0 "Tanet"
