l_spanish:
 bm_1066_nomads:0 "Às Portas"
 bm_1066_nomads_desc:0 "Desde tempos imemoriais, povos migraram pelas estepes e seguiram os caminhos dos nômades por incontáveis gerações. Agora, o mundo além avança sobre suas terras natais. Impérios sedentários expandem suas fronteiras cada vez mais a cada ano.\n\n#bold Será possível reverter a maré do assentamento? Deveriam os modos nômades ser abandonados? Em cidades e fazendas, os povos da estepe podem encontrar novas vidas... mas, se uma nova era de grandes conquistadores surgir, os velhos caminhos poderão ser salvos!#!"
 bookmark_nomads_cumans:0 "Cã Saru da Cumania"
 bookmark_nomads_cumans_desc:0 "Recém-chegado à liderança, Saru comanda as vastas hordas da Cumania. Em suas fronteiras repousam ricos principados, prontos para serem conquistados, mas será que Saru possui a habilidade necessária para manter a horda unida em novas campanhas?\n\nA Cumania pode ser vasta, mas seu povo pode ser tanto uma responsabilidade quanto um trunfo — atrás de cada boca a ser alimentada há um ego igualmente faminto.\n\n#bold Você conseguirá manter seus vizinhos sob controle e seu status elevado enquanto cavalga à frente da horda cumana?#!"
 bookmark_nomads_cumans_subheading:0 "$BOOKMARK_SUBHEADING_KHAN$"
 bookmark_nomads_eastern_karakhanids:0 "Muhmud dos Karluks"
 bookmark_nomads_eastern_karakhanids_desc:0 "As hordas dos Caracânidas — os #italic Cãs Negros#! — da Transoxiana já controlaram a Rota da Seda, mas esses dias de glória ficaram para trás. Divididos entre as casas de Ali e Hasan, as duas metades de seu império agora lutam pela supremacia.\n\nNo leste, os Alidas abandonaram suas raízes nômades, mas os Hasanidas no oeste permanecem fiéis às suas tradições.\n\n#bold Os Caracânidas estão divididos — o futuro do Caganato repousa em uma sela ou em um palácio?#!"
 bookmark_nomads_eastern_karakhanids_subheading:0 "$BOOKMARK_SUBHEADING_KHAN$"
 bookmark_nomads_keraits:0 "Grande Chefe Inanch"
 bookmark_nomads_keraits_desc:0 "Exilados da China por decreto do Imperador Wuzong dois séculos atrás, missionários nestorianos encontraram um público receptivo entre os Keraits. Impulsionado por ambição e fé, o senhor Kerait Inanch agora tenta reunir os povos da estepe sob sua bandeira — uma bandeira coroada por uma cruz.\n\n#bold Una os nômades do leste e espalhe a fé nestoriana pelas estepes!#!"
 bookmark_nomads_keraits_hongji:0 "Grão-cã Hongji"
 bookmark_nomads_keraits_margus:0 "Margus"
 bookmark_nomads_keraits_subheading:0 "$BOOKMARK_SUBHEADING_HIGH_CHIEFTAIN$"
 bookmark_nomads_late_kirghiz:0 "Kokotoy dos Quirguizes"
 bookmark_nomads_late_kirghiz_desc:0 "Mencionados outrora com temor por todos os que viviam nas estepes do norte, os Quirguizes hoje vivem dias de decadência — seu império está em ruínas, e apenas um frágil sopro do Caganato Quirguiz persiste no norte.\n\n#bold As últimas centelhas da glória quirguiz se apagarão, ou sua chama voltará a brilhar mais forte que o Sol?#!"
 bookmark_nomads_late_kirghiz_subheading:0 "$BOOKMARK_SUBHEADING_HIGH_CHIEFTAIN$"
 bookmark_nomads_pechenegs:0 "Tatus dos Pechenegues"
 bookmark_nomads_pechenegs_desc:0 "Os nômades Pechenegues estão cercados por povos sedentários: ao sul, a política conturbada dos bizantinos oferece oportunidades tanto para saqueadores quanto para mercenários. A oeste, os magiares já se estabeleceram na Panônia — mas outros também se assentaram ali antes, apenas para serem consumidos pelos próximos invasores. Ao norte, os príncipes da Rus' vivem em constantes rivalidades.\n\n#bold Conduza os Pechenegues para uma nova era, crescendo e se transformando para cumprir qualquer destino que os aguarde!#!"
 bookmark_nomads_pechenegs_subheading:0 "$BOOKMARK_SUBHEADING_KHAN$"
