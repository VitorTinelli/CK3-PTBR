l_spanish:
 bm_867_china:0 "Outono da Virtude"
 bm_867_china_desc:0 "Por dois séculos e meio, a Grande Tang governou a China. Nesse tempo, conheceu e suportou enormes conflitos e inúmeras calamidades, não menos que uma rebelião que ceifou incontáveis vidas, e ainda assim sobreviveu, e até prosperou.\n\nMas a sobrevivência sempre tem um preço. Para melhor defender o império, os Tang concederam poderes extraordinários aos governadores militares, que em sua recém-descoberta liberdade viram a oportunidade de fundar estados próprios, pequenos despotados que prestavam apenas um respeito superficial ao trono.\n\n#bold A queda de uma única folha pode anunciar a chegada do outono. Os sábios buscam calor e abrigo para o inverno que virá. Os audaciosos traçam seus planos.#!"
 bookmark_china_867_gao_pian:0 "Comandante Gāo Piān"
 bookmark_china_867_gao_pian_desc:0 "Descendente dos antigos reis de Qí e neto de um general celebrado, muitos assumem que Gāo Piān está destinado a grandes feitos, e seu feito de derrubar duas águias com uma única flecha parece confirmar suas habilidades sobrenaturais.\n\nDespachado para as fronteiras do sul para defender contra incursões estrangeiras, os sucessos de Gāo Piān lhe renderam a inimizade daqueles que o veem como uma ameaça às próprias ambições.\n\n#bold Um destino augusto aguarda Gāo Piān, ou ele cairá à terra como as próprias águias que derrubou?#!"
 bookmark_china_867_gao_pian_subheading:0 "$BOOKMARK_SUBHEADING_MILITARY_GOVERNOR$"
 bookmark_china_867_he_quanhao:0 "Comandante Hé Quánhào"
 bookmark_china_867_he_quanhao_desc:0 "A família de Hé Quánhào governa como senhores da guerra independentes em tudo, menos no nome, desde a época de seu avô, oferecendo aos Tang submissão apenas nominal.\n\nQuánhào foi aclamado como governador pelo exército após a morte de seu pai, mas não sem alguma apreensão – há uma veia de crueldade na natureza deste jovem.\n\n#bold Hé Quánhào conseguirá superar sua natureza para continuar o trabalho de seus ancestrais, ou seus impulsos se provarão sua ruína?#!"
 bookmark_china_867_he_quanhao_subheading:0 "$BOOKMARK_SUBHEADING_MILITARY_GOVERNOR$"
 bookmark_china_867_huang_chao:0 "Huáng Chāo"
 bookmark_china_867_huang_chao_desc:0 "Nascido em uma longa linha de contrabandistas de sal, Huáng Chāo possui a ousadia e a riqueza adquiridas de uma vida à margem da lei, mas ainda anseia pela única coisa que lhe escapou – o status que acompanha um cargo governamental.\n\nIncapaz de passar no exame imperial apesar de seus melhores esforços, a cada ano que passa sua frustração aumenta à medida que suas perspectivas de sucesso diminuem.\n\n#bold Huáng Chāo alcançará seu sonho, ou a ambição frustrada o levará a uma jogada desesperada?#!"
 bookmark_china_867_huang_chao_subheading:0 "$BOOKMARK_SUBHEADING_LANDLESS_ADMIN$"
 bookmark_china_867_zhang_huaishen:0 "Jiédùshǐ Zhāng Huáishèn"
 bookmark_china_867_zhang_huaishen_desc:0 "Após conquistar e anexar vastas extensões de terra em nome da dinastia Tang, o senhor da guerra Zhāng Yìchāo assumiu um lugar de honra na corte imperial e nomeou seu sobrinho, Huáishèn, para governar esses territórios em seu nome.\n\nMas Huáishèn, comandante astuto e capaz, não está sem suas próprias ambições, e pouco inclinado a ceder seu lugar aos primos quando chegar o momento.\n\n#bold Zhāng Huáishèn conseguirá prevalecer na disputa sucessória e reivindicar uma posição de destaque em sua família?#!"
 bookmark_china_867_zhang_huaishen_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_china_867_zhuye_chixin:0 "Comandante Zhūyè Chìxīn"
 bookmark_china_867_zhuye_chixin_desc:0 "Há muito os tribais Shatuo são cortejados pelos Tang por sua coragem e destreza marcial, e neste Zhūyè Chìxīn não se desvia da tradição de seus ancestrais.\n\nHonrado por seu papel em um ousado resgate da tia do imperador anos atrás, a ascensão constante do general Shatuo ao favor imperial faz alguns se perguntarem até onde vão suas ambições.\n\n#bold Agora que a estrela dos Tang está em declínio, Zhūyè Chìxīn será ousado o suficiente para aproveitá-la?#!"
 bookmark_china_867_zhuye_chixin_subheading:0 "$BOOKMARK_SUBHEADING_MILITARY_GOVERNOR$"
