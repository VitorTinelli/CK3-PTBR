l_spanish:
 challenge_character_aba_socotra:0 "Emir Aba"
 challenge_character_aba_socotra_desc:0 "O isolamento de Socotra permitiu que ela permanecesse uma ilha de nestorianismo por séculos, seus habitantes raramente eram bem-vindos além de suas próprias costas rochosas.\n\n#bold Você pode liderar seu povo de seu precário refúgio para alcançar uma fama imperecível além do horizonte?#!"
 challenge_character_aella_northumberland:0 "Rei Menor Ælla"
 challenge_character_aella_northumberland_desc:0 "Suas terras cercadas por invasores estrangeiros, a morte de Ælla pelas mãos deles marcou o fim de uma resistência significativa, com seu sucessor sendo pouco mais que um fantoche nórdico.\n\n#bold Você pode virar a maré e salvar a Nortúmbria do flagelo viking?#!"
 challenge_character_ahmad_egypt:0 "Sultão Ahmad"
 challenge_character_ahmad_egypt_desc:0 "Ahmad surgiu de origens humildes para alcançar o domínio sobre o Egito, mas seus herdeiros não provaram ser seus iguais, e seu reino entrou em colapso apenas vinte e um anos após sua morte.\n\n#bold Com a riqueza e o poder do Egito sob seu comando, você pode se tornar o mestre do Mediterrâneo?#!"
 challenge_character_alfonsu_asturias:0 "Rei Alfonsu"
 challenge_character_alfonsu_asturias_desc:0 "Perto do fim de sua vida, Alfonsu sucumbiu às ambições de seus filhos e foi destituído de sua coroa, forçado a dividir seu reino entre três deles.\n\n#bold Você pode evitar o destino de Alfonsu e garantir que os cristãos da Ibéria permaneçam unidos contra a ameaça Omíada?#!"
 challenge_character_algimantas_lithuanians:0 "Alto Chefe Algimantas"
 challenge_character_algimantas_lithuanians_desc:0 "Algimantas e seus herdeiros conseguiram manter um principado pagão por mais tempo do que qualquer outro povo na Europa, resistindo com sucesso à conversão ao cristianismo até o final do século XIV.\n\n#bold Como os cristãos estão tão determinados a converter seu povo, você pode, em vez disso, abrir os olhos deles para a verdade do Vidilismo?#!"
 challenge_character_ali_siracusa:0 "Sheikh Ali"
 challenge_character_ali_siracusa_desc:0 "Entre os últimos a resistir à invasão normanda da Sicília, Ali mergulhou no oceano e se afogou ao tentar saltar a bordo do navio de seu inimigo.\n\n#bold Os normandos chegaram, mas ainda não conquistaram tudo – você pode reverter seus ganhos e reivindicar a Sicília para si?#!"
 challenge_character_ali_taizz:0 "Emir Ali"
 challenge_character_ali_taizz_desc:0 "Filho de um magistrado, Ali partiu com um modesto grupo de seguidores e conquistou um reino, mas recebeu maior louvor pela sabedoria de sua esposa, Asma, a quem ele confiou a administração de seu estado.\n\n#bold Com uma parceira tão capaz ao seu lado, tudo parece possível. Juntos, toda a Arábia é sua para conquistar!#!"
 challenge_character_alusian_vidin:0 "Conde Alusian"
 challenge_character_alusian_vidin_desc:0 "O segundo filho do último imperador da Bulgária pode ter recebido honrarias de seus novos mestres bizantinos, mas não perdeu a oportunidade de ressuscitar o império de seu pai, embora tenha retornado à lealdade.\n\n#bold Você pode se livrar do jugo bizantino e recuperar seu direito de nascimento?#!"
 challenge_character_amoghavarsha_karnata:0 "Maharaja Amoghavarsha"
 challenge_character_amoghavarsha_karnata_desc:0 "Ascendendo ao trono aos catorze anos de idade, Amoghavarsha teve um dos reinados mais longos da história e foi renomado por sua benevolência e realizações literárias e culturais.\n\n#bold Você pode garantir que as realizações de Amoghavarsha sejam preservadas para as gerações futuras?#!"
 challenge_character_anawrahta_pagan:0 "Rei Anawrahta"
 challenge_character_anawrahta_pagan_desc:0 "Fundador de Pagan, Anawrahta governou prudentemente e suprimiu implacavelmente qualquer ameaça ao seu novo reino, e seu patrocínio ao budismo Theravada contribuiu grandemente para a disseminação da fé.\n\n#bold Os sucessores de Anawrahta foram tão capazes quanto seu progenitor, mas os mongóis provaram ser um inimigo forte demais para os Pagan – você pode resistir melhor à tempestade que se aproxima?#!"
 challenge_character_ashot_armenia:0 "Príncipe Ashot"
 challenge_character_ashot_armenia_desc:0 "Embora seu reinado tenha sido próspero para seu povo, Ashot devia seu trono e seu reino à graça do califa e permaneceu seu subordinado até a morte.\n\n#bold Você será capaz de se libertar de seu suserano estrangeiro e provar-se um soberano por conta própria?#!"
 challenge_character_badr_acre:0 "Sheikh Badr"
 challenge_character_badr_acre_desc:0 "Um soldado fatímida de origem armênia, Badr subiu nas fileiras até se tornar o supremo ditador militar do califado, reduzindo o próprio califa a pouco mais que uma figura decorativa.\n\n#bold Badr e seus sucessores dominaram a política egípcia por mais de sessenta anos – você pode superar seus feitos e eliminar o califa completamente?#!"
 challenge_character_berenguer_barcelona:0 "Duque Berenguer"
 challenge_character_berenguer_barcelona_desc:0 "Na busca pela justiça, Berenguer orquestrou a codificação dos costumes de seu reino como os Usatges de Barcelona, que forneceriam a base para o direito catalão por séculos.\n\n#bold Os descendentes de Berenguer, com o tempo, viriam a controlar grande parte do Mediterrâneo. Você pode construir sobre suas conquistas e fazer o mesmo?#!"
 challenge_character_dawit_dembiya:0 "Ras Dawit"
 challenge_character_dawit_dembiya_desc:0 "Embora nunca numerosos e muitas vezes em perigo, os Beta Israelitas resistiram com sucesso à assimilação por seus vizinhos maiores e mais poderosos.\n\n#bold Você pode superar as adversidades e construir uma pátria próspera e segura para os Beta Israelitas?#!"
 challenge_character_dumnarth_cornwall:0 "Rei Menor Dumnarth"
 challenge_character_dumnarth_cornwall_desc:0 "Dumnarth tem a honra duvidosa de ser lembrado principalmente por ser o último dos reis da Cornualha e por ter encontrado um fim aquático por azar em um rio.\n\n#bold Sob seu governo, Cornwall pode enfrentar os desafios anglo-saxões e nórdicos e prevalecer?#!"
 challenge_character_dyre_kiev:0 "Jarl Dyre"
 challenge_character_dyre_kiev_desc:0 "Um aventureiro nórdico em busca de deixar sua marca no leste, o ousado empreendimento de Dyre terminou com sua usurpação ignominiosa e morte nas mãos de Oleg, o Sábio.\n\n#bold Você pode reescrever a dolorosa história de Dyre em uma saga que ecoará através das eras?#!"
 challenge_character_eadgar_warwickshire:0 "Eadgar"
 challenge_character_eadgar_warwickshire_desc:0 "Nascido no exílio, o último descendente da casa de Wessex retornou à Inglaterra justo a tempo de ver seu direito de nascimento usurpado pela segunda vez por Harold Godwinson, e então irrevogavelmente perdido para um conquistador normando.\n\n#bold A luz da casa de Wessex pisca fracamente, mas ainda não foi extinta. Você pode restaurar sua fortuna?#!"
 challenge_character_erik_svealand:0 "Príncipe Erik"
 challenge_character_erik_svealand_desc:0 "Um governante pagão que renunciou ao cristianismo e voltou às suas raízes, Erik estava entre os últimos de uma raça em extinção em uma Escandinávia cada vez mais cristianizada.\n\n#bold Você pode provar a todos que os velhos caminhos são superiores a esses estranhos padres e seu novo deus?#!"
 challenge_character_fariburz_shirvan:0 "Shirvanshah Fariburz"
 challenge_character_fariburz_shirvan_desc:0 "Os Shirvanshahs são lembrados como patronos e benfeitores de poetas e filósofos, a arte e a vida intelectual frequentemente florescendo sob seu domínio.\n\n#bold Você pode fazer de sua corte um farol brilhante de cultura para que todo o mundo admire?#!"
 challenge_character_gregorios_napoli:0 "Conde Gregorios"
 challenge_character_gregorios_napoli_desc:0 "À medida que a influência bizantina na Itália diminuía, os governantes de Nápoles procuraram o mundo muçulmano como aliados contra a invasão lombarda, para grande consternação do papa.\n\n#bold Você pode explorar o vazio deixado pelos bizantinos para fundar um império próprio?#!"
 challenge_character_gudrod_western_isles:0 "Rei Menor Gudröd"
 challenge_character_gudrod_western_isles_desc:0 "Um ousado senhor de guerra hebrideano de origem mercenária, Gudröd expandiu seu alcance para se tornar o senhor de Dublin, Mann e do Mar da Irlanda, mas as disputas internas entre seus descendentes diminuíram muito suas conquistas.\n\n#bold Você pode estabelecer um domínio mais permanente sobre estas belas ilhas?#!"
 challenge_character_gunda_orangallu:0 "Samanta Gunda"
 challenge_character_gunda_orangallu_desc:0 "Não foi até que os Kakatiyas se converteram do Jainismo para o Hinduísmo que conseguiram obter terras suficientes para se autodenominar reis, um feito talvez facilitado sem o compromisso estrito dos jainistas com a não-violência.\n\n#bold Você pode conquistar um trono próprio, mantendo-se fiel aos princípios da sua fé?#!"
 challenge_character_haraldr_vestfold:0 "Chefe Haraldr"
 challenge_character_haraldr_vestfold_desc:0 "Um herói das sagas, Haraldr é lembrado como um grande rei que reuniu os chefes rivais da Noruega sob uma única bandeira.\n\n#bold Você pode acabar com a discórdia e unir a Noruega sob seu domínio?#!"
 challenge_character_heinrich_angria:0 "Heinrich, o Leão"
 challenge_character_heinrich_angria_desc:0 "Rival amargo do Imperador do Sacro Império Romano, Heinrich foi o magnata mais poderoso do império em seu tempo, mas sua inimizade imperial acabaria provando ser sua ruína.\n\n#bold Você pode prevalecer onde o histórico Heinrich falhou e triunfar sobre seu nêmesis Hohenstaufen?#!"
 challenge_character_henri_champagne:0 "Duque Henri"
 challenge_character_henri_champagne_desc:0 "Educado nas artes liberais, o governo iluminado de Henri trouxe grande prosperidade ao seu povo, com as célebres feiras de Champagne atraindo mercadores e suas valiosas mercadorias de toda a Europa.\n\n#bold Você pode fazer de Champagne um sinônimo de paz e prosperidade?#!"
 challenge_character_herbert_vermandois:0 "Conde Herbert"
 challenge_character_herbert_vermandois_desc:0 "Embora a linhagem de Carlos Magno já não fosse mais de reis, seu sangue viveu em Herbert de Vermandois, embora a próxima geração visse suas terras saírem da família.\n\n#bold Você pode voltar no tempo e engenheirar um retorno ao poder, por meio de trapaças ou não, para os Karlings?#!"
 challenge_character_ishaq_baalbek:0 "Sheikh Ishaq"
 challenge_character_ishaq_baalbek_desc:0 "Apesar de seu pequeno número e da perseguição por aqueles que consideravam suas crenças heréticas, os drusos resistiram através dos séculos refugiando-se nas montanhas acidentadas do Levante.\n\n#bold Você pode liderar os drusos além das montanhas para encontrar uma pátria serena para eles?#!"
 challenge_character_john_ulster:0 "Conde John"
 challenge_character_john_ulster_desc:0 "Pelo direito da espada ao seu lado e com a ajuda de alguns homens leais, John de Courcy tornou-se senhor sobre o leste de Ulster até sua queda e prisão nas mãos de um rei inglês desconfiado de suas ambições.\n\n#bold Você pode terminar o que John começou e garantir que o estandarte dos Courcy seja hasteado sobre toda a Irlanda?#!"
 challenge_character_khusraw_malik_punjab:0 "Sultão Khusraw Malik"
 challenge_character_khusraw_malik_punjab_desc:0 "Apertado por inimigos de todos os lados, Khusraw Malik lutou bravamente para preservar o reino de seus ancestrais, mas sua linhagem foi logo extinta pelas mãos de um executor Ghurid.\n\n#bold Você pode lutar para recuperar uma posição de força e repetir as conquistas de Mahmud de Ghazni?#!"
 challenge_character_krutoj_nordmark:0 "Duque Krutoj"
 challenge_character_krutoj_nordmark_desc:0 "Um devoto adepto dos modos tradicionais de seu povo, Krutoj liderou uma revolta e assassinou seu senhor Cristão, assumindo o trono para si, mas seu plano para eliminar o filho de seu senhor terminou em sua própria morte.\n\n#bold Você pode superar seus rivais e legitimar seu governo, apesar de seu começo sangrento?#!"
 challenge_character_kulin_bosna:0 "Doux Kulin"
 challenge_character_kulin_bosna_desc:0 "Espremido entre as ambições bizantinas e húngaras nos Bálcãs, Kulin habilmente explorou o conflito entre as duas potências maiores para preservar sua autonomia e expandir sua influência.\n\n#bold Você pode se libertar de seu suserano e inaugurar uma era dourada de paz e prosperidade para a Bósnia?#!"
 challenge_character_lambert_spoleto:0 "Duque Lambert"
 challenge_character_lambert_spoleto_desc:0 "Convidado a participar da consagração do papa, Lambert infamemente saqueou a cidade, pilhando mansões e mosteiros em igual medida, e ninguém foi poupado de sua rapacidade.\n\n#bold Sem respeitar as leis dos homens nem de Deus, até onde você irá em busca de suas ambições?#!"
 challenge_character_maghan_sibi:0 "Maghan Kon Fatta"
 challenge_character_maghan_sibi_desc:0 "As lendas dizem que um caçador uma vez profetizou que, se Maghan se casasse com uma mulher feia, seu filho seria um grande e poderoso rei. Seja qual for a verdade do conto, o filho de Maghan, Sunjata, de fato fundou o império do Mali.\n\n#bold Você pode transformar a profecia do humilde caçador em realidade e fundar um novo império?#!"
 challenge_character_mohammed_azerbaijan:0 "Jahan Pahlavan Mohammed"
 challenge_character_mohammed_azerbaijan_desc:0 "Criador de reis para o último dos sultões seljúcidas, Mohammed governou o império efetivamente em tudo, menos no nome, embora seus descendentes não tenham conseguido resistir ao avanço dos Khwarazmshah.\n\n#bold Você segura o próprio sultão em seu punho – use-o bem, e toda a Pérsia se curvará à sua vontade!#!"
 challenge_character_muhammad_africa:0 "Sultão Muhammad"
 challenge_character_muhammad_africa_desc:0 "Apesar de seu breve reinado ser lembrado principalmente por sua dissipação e extravagância, os generais de Muhammad foram tão bem-sucedidos que forçaram o próprio Papa a pagar tributo a este governante decadente.\n\n#bold Tendo provado a riqueza da Itália, você a consumirá inteiramente para saciar seus desejos?#!"
 challenge_character_nur_al_din_muhammed_nizari:0 "Imã Muhammed"
 challenge_character_nur_al_din_muhammed_nizari_desc:0 "De fortalezas formidáveis nas montanhas da Pérsia, Muhammed desfrutou de um longo governo como imã hereditário dos Nizaris, que o reconheciam como o único legítimo guardião de sua fé por sua descendência de Nizar.\n\n#bold Você pode propagar sua doutrina e alcançar uma ampla aceitação de sua fé?#!"
 challenge_character_piarres_albarracin:0 "Conde Piarres"
 challenge_character_piarres_albarracin_desc:0 "Outrora vassalo de um potentado muçulmano, Piarres cristianizou seu domínio e declarou sua independência, não reconhecendo nenhum senhor além de Santa Maria.\n\n#bold Tendo se declarado igual a reis e califas, você pode agora cumprir sua promessa e erguer um novo reino para rivalizar com qualquer um que já existiu?#!"
 challenge_character_pierre_piedmonte:0 "Duque Pierre"
 challenge_character_pierre_piedmonte_desc:0 "A casa de Savoie deve grande parte de seu território à herança da mãe de Pierre, Adelaide de Turim, cuja influência foi fundamental na corte de seu filho, quase certamente para o melhor.\n\n#bold Você pode sair da sombra de sua famosa mãe e provar-se um governante digno por seus próprios méritos?#!"
 challenge_character_prithviraja_rajputana:0 "Maharaja Prithviraja"
 challenge_character_prithviraja_rajputana_desc:0 "Prithviraja lutou valentemente contra incursões repetidas dos Ghurids, triunfando sobre os invasores em pelo menos uma grande batalha, mas encontrou seu fim como prisioneiro dos Ghurids.\n\n#bold Você pode repelir a ameaça Ghurid e garantir o futuro da dinastia Chauhan?#!"
 challenge_character_raoul_valois:0 "Conde Raoul"
 challenge_character_raoul_valois_desc:0 "Embora no início da vida tenha sido um opositor dos Capetos, Raoul mais tarde mudou de lado e tornou-se um fiel servo da coroa francesa, eventualmente casando-se com a viúva do próprio rei que ele havia combatido.\n\n#bold Com a mãe de seu jovem senhor feudal como sua esposa, você pode converter sua influência em algo maior?#!"
 challenge_character_renaud_kerak:0 "Conde Renaud"
 challenge_character_renaud_kerak_desc:0 "O mais feroz e virulento oponente de Salāh al-Dīn no reino de Jerusalém, o ataque de Renaud a uma caravana de peregrinos muçulmanos trouxe a perda de Jerusalém e sua própria execução nas mãos do Sultão do Egito.\n\n#bold A história lembrou-se de Renaud como um saqueador rapace – você pode garantir um legado mais nobre para ele?#!"
 challenge_character_rhodri_gwynedd:0 "Príncipe Rhodri"
 challenge_character_rhodri_gwynedd_desc:0 "Herdando o trono de um pequeno reino galês às vésperas das invasões vikings, a coroa de Rhodri pesava em sua cabeça, mas ele jogou habilmente com as cartas que lhe foram dadas.\n\n#bold Você pode navegar com segurança pelas águas desta era tumultuada e garantir que Gwynedd emerja vitoriosa?#!"
 challenge_character_richard_capua:0 "Duque Richard"
 challenge_character_richard_capua_desc:0 "Embora a casa de Hauteville tenha conquistado a supremacia sobre a Sicília, os Drengots estavam inegavelmente lá primeiro, tendo sido um dos primeiros livre-comerciantes normandos a pisar na península.\n\n#bold Você pode colocar os emergentes Hauteville em seu lugar e provar a preeminência dos Drengot?#!"
 challenge_character_richard_poitiers:0 "Príncipe Richard"
 challenge_character_richard_poitiers_desc:0 "Nascido como o terceiro filho, os caprichos do destino colocaram Richard no trono da Inglaterra, e suas campanhas subsequentes na Terra Santa lhe renderam glória eterna como #italic Ricardo Coração de Leão#!.\n\n#bold Apesar de toda sua fama, as batalhas de Richard conquistaram poucos ganhos permanentes. Você pode aproveitar sua segunda chance para vencer uma vitória digna de seu nome?#!"
 challenge_character_rogier_albi:0 "Conde Rogier"
 challenge_character_rogier_albi_desc:0 "Embora talvez não tenham abraçado abertamente a doutrina, os Trencavels eram conhecidos por sua controversa tolerância e simpatia pelos hereges cátaros que se espalharam por suas terras.\n\n#bold Você pode proteger os cátaros da perseguição e garantir que sua fé floresça?#!"
 challenge_character_rostislav_tmutarakan:0 "Conde Rostislav"
 challenge_character_rostislav_tmutarakan_desc:0 "Despojado de seu patrimônio pela morte prematura de seu pai, Rostislav conquistou a distante península de Tmutarakan e a fez seu reduto, mas foi envenenado antes que pudesse realizar suas ambições.\n\n#bold Você pode superar a hostilidade de seus parentes e obter um principado digno de sua linhagem?#!"
 challenge_character_sargis_greater_armenia:0 "Duque Sargis"
 challenge_character_sargis_greater_armenia_desc:0 "Um formidável vassalo armênio do rei da Geórgia, as lealdades de Sargis podem ter sido às vezes duvidosas, mas sua influência e poder eram tais que ele não podia ser ignorado.\n\n#bold Você pode agir por conta própria para restaurar a Grande Armênia de seus antigos antecessores?#!"
 challenge_character_shisnand_coimbra:0 "Conde Shisnand"
 challenge_character_shisnand_coimbra_desc:0 "Um aristocrata moçárabe que passou do serviço Abbadid para o leonês, Shisnand governou Coimbra quase autonomamente por mais de vinte anos e foi sucedido por seu genro após sua morte.\n\n#bold Tendo servido senhores tanto muçulmanos quanto cristãos, você pode construir uma ponte entre as fés e trazer paz à Ibéria?#!"
 challenge_character_siemowit_wielkopolska:0 "Alto Chefe Siemowit"
 challenge_character_siemowit_wielkopolska_desc:0 "Filho do lendário Piast, o Rodador de Roda, Siemowit e seu pai iniciaram uma dinastia que governaria a Polônia até o final do século XIV.\n\n#bold Você pode conduzir a Polônia com segurança através dos séculos e torná-la a inveja tanto do leste quanto do oeste?#!"
 challenge_character_vicayalaya_chola_nadu:0 "Raja Vicayalaya"
 challenge_character_vicayalaya_chola_nadu_desc:0 "Originalmente um vassalo da dinastia Pallava, Vicayalaya viu uma oportunidade e se lançou sozinho para fundar um império que viria a unir todo o sul da Índia sob suas bandeiras.\n\n#bold Você pode levar as ambições de Chola à sua conclusão natural e trazer toda a Índia sob seu domínio?#!"
 challenge_character_werner_aargau:0 "Conde Werner"
 challenge_character_werner_aargau_desc:0 "Enquanto os Habsburgos ainda não haviam deixado sua marca na época de Werner, a política astuta veria seus descendentes sentados em muitos tronos por séculos a fio.\n\n#bold Você consegue obter a Áustria para os Habsburgos e fazer com que todo o mundo reconheça sua ascensão?#!"
 challenge_character_werner_worms:0 "Conde Werner"
 challenge_character_werner_worms_desc:0 "Embora o nome saliano ainda não fosse famoso nos dias de Werner, seus descendentes contariam com quatro imperadores do Sacro Império Romano e até mesmo um papa.\n\n#bold Você pode reivindicar o legado de Carlos Magno para si e reconstruir seu império fragmentado?#!"
