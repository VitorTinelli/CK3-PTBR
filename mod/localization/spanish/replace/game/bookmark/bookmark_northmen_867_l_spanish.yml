l_spanish:
 bm_867_northmen:0 "Ira Dos Nórdicos"
 bm_867_northmen_desc:0 "Dois anos atrás, Rei Ælla da Nortúmbria jogou o grande herói viking Ragnarr Loðbrók em um poço de cobras para morrer. Ao ouvir a notícia, os filhos de Ragnarr embarcaram para a Inglaterra para vingar seu pai.\n\nThe irmãos desde então estabeleceram uma base sólida em York e nas ilhas. Os reis anglo-saxões perderam batalha após batalha - seu futuro parece realmente sombrio.\n\nBut toda esperança não está perdida, e um grande herói ainda pode virar a maré da história.\n\n#bold Você vai colocar toda a Inglaterra sob o domínio nórdico ou derrotar o Grande Exército Heathen do solo anglo-saxão?#!"
 bookmark.0002.a:0 "Eu rezo para nunca decepcioná-los."
 bookmark.0002.desc:0 "A primeira vez que um vassalo me saudou com uma \"longa vida [ROOT.Char.GetFirstNameNoTooltip] ao Grande!\", Fiquei profundamente honrado. Não pensei mais nisso, mas desde aquele dia, o epíteto cresceu em popularidade.\n\nWherever eu vou, de [capital.GetNameNoTooltip] para [province.GetNameNoTooltip], meus assuntos agora me chamam [ROOT.Char.GetFirstNameNoTooltip] o Grande."
 bookmark.0002.t:0 "O Grande"
 bookmark.0004.a.custom:0 "Cada [close_family_member|E] de [dead.GetShortUIName]"
 bookmark.0004.a:0 "Vou arrancar suas costelas e transformá-las em asas de sangue!"
 bookmark.0004.b:0 "Est[Select_CString( prisoner.IsFemale, 'a', 'e' )] [prisoner.GetWomanMan] é s[Select_CString( prisoner.IsFemale, 'ua', 'eu' )], grande [ROOT.Char.GetFaith.HighGodName]!"
 bookmark.0004.c:0 "Tenho outros planos para [prisoner.GetSheHe]..."
 bookmark.0004.desc:0 "Finalmente, depois de todo esse tempo, tenho [prisoner.GetName] nas minhas mãos, [Select_CString( prisoner.IsFemale, 'a', 'o' )] [prisoner.Custom2('InsultAdjective', ROOT.Char)]. Quando soube da morte [Select_CString( dead.IsFemale, 'da minha', 'do meu' )] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('dead'))] [dead.GetNamePossessive] pelas mãos [prisoner.GetHerHim], jurei que teria minha vingança. E eu sou uma pessoa de palavra."
 bookmark.0004.desc_unknown:0 "Ao ser trazido diante de mim, [prisoner.Custom2('MyCharacterIntroduction', ROOT.Char)] se prostra imediatamente e suplica pelo meu perdão por #EMP ter matado meu [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('dead'))]#!?!\n\n\"Eu... Eu pensei que você soubesse! Esqueça o que eu disse,\" [prisoner.GetSheHe] ri nervosamente. \"Obviamente, devo ter batido minha cabeça quando fui capturado. Ou algo assim. Eu não sei do que estou falando!\"\n\nQuando soube da morte do meu [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('dead'))] [dead.GetNamePossessive], jurei que teria minha vingança. E sou uma [ROOT.Char.GetWomanMan] de palavra."
 bookmark.0004.t:0 "Vingança"
 bookmark_northmen_bjorn_ironside:0 "Björn Ironside"
 bookmark_northmen_bjorn_ironside_alt_eirikr:0 "$Eirikr$"
 bookmark_northmen_bjorn_ironside_alt_eirikr_desc:0 "alt desc"
 bookmark_northmen_bjorn_ironside_alt_ingrid:0 "$Ingrid$"
 bookmark_northmen_bjorn_ironside_alt_ingrid_desc:0 "alt desc"
 bookmark_northmen_bjorn_ironside_desc:0 "Björn viveu uma verdadeira vida de aventura na escandinavia. Um assaltante temível que pilhou pela França, Península Ibérica e Itália, junto com seu amigo Hæsteinn de Nantes. Agora, tas forças da Escandinávia se reúnem para atacar as costas britânicas mais uma vez.\n\n#bold Embora Björn tenha prometido vingar a morte de seu pai na Inglaterra, seus descendentes governarão a Suécia pelos próximos dois séculos. De que lado do Mar do Norte está o seu destino?#!"
 bookmark_northmen_bjorn_ironside_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_northmen_earl_alfred:0 "Conde Alfred"
 bookmark_northmen_earl_alfred_alt_aethelred:0 "$E_thelred$"
 bookmark_northmen_earl_alfred_alt_aethelred_desc:0 "alt desc"
 bookmark_northmen_earl_alfred_desc:0 "Enquanto os vikings avançam mais ao sul, o Conde Alfred de Dorset está preparando suas tropas.\n\nNos próximos anos, Alfredo lutará diversas batalhas contra os nórdicos e por fim à invasão. Quando herda o trono de seu irmão, ele se torna um dos maiores reis ingleses da história.\n\n#bold Você irá cumprir o grande destino de Alfredo ou será esmagado pelo Grande Exército Pagão?#!"
 bookmark_northmen_earl_alfred_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_northmen_halfdan_whiteshirt:0 "Halfdan Whiteshirt"
 bookmark_northmen_halfdan_whiteshirt_alt_gudfrid:0 "$GuT_friT_$"
 bookmark_northmen_halfdan_whiteshirt_alt_saga:0 "$Saga$ $nick_the_truthspeaker$"
 bookmark_northmen_halfdan_whiteshirt_desc:0 "A primeira onda da invasão correu muito bem para o Halfdan Whiteshirt. Com a ajuda de seu irmão Ivar, ele lutou pelo controle mãos de York de Rei Ælla. E ele vai levar muito mais.\n\n#bold Você seguirá os passos da história e terá sua vingança sangrenta ou traçará um novo caminho para Halfdan?#!"
 bookmark_northmen_halfdan_whiteshirt_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_northmen_ivar_the_boneless:0 "Ivar o sem Osso"
 bookmark_northmen_ivar_the_boneless_alt_barid:0 "$Barid$"
 bookmark_northmen_ivar_the_boneless_alt_barid_desc:0 "alt desc"
 bookmark_northmen_ivar_the_boneless_alt_sigfroth:0 "$SigfroT_$"
 bookmark_northmen_ivar_the_boneless_alt_sigfroth_desc:0 "alt desc"
 bookmark_northmen_ivar_the_boneless_desc:0 "Dizem os rumores que Ivar é fraco de corpo, mas ninguém pode afirmar que ele seja fraco de mente. Com astúcia e confiança, ele uniu um grande número de bandos de guerra nórdicos sob seu estandarte e conquistou grandes vitórias nestas terras estrangeiras. Mas nem mesmo o maior dos vikings pode enganar a morte. Em 870, Ivar desaparecerá da história para sempre...\n\n#bold Você conseguirá vencer as guerras de Ivar e mantê-lo vivo para governar por muitos anos?#!"
 bookmark_northmen_ivar_the_boneless_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT_WITH_THE$"
 bookmark_northmen_sigurdr_snake_in_the_eye:0 "Sigurd Olho de Cobra"
 bookmark_northmen_sigurdr_snake_in_the_eye_alt_alof:0 "$Alof$"
 bookmark_northmen_sigurdr_snake_in_the_eye_alt_alof_desc:0 "alt desc"
 bookmark_northmen_sigurdr_snake_in_the_eye_alt_knud:0 "$Knud$"
 bookmark_northmen_sigurdr_snake_in_the_eye_alt_knud_desc:0 "alt desc"
 bookmark_northmen_sigurdr_snake_in_the_eye_desc:0 "Enquanto seus irmãos navegavam para a Inglaterra para exigir sua vingança, Sigurd Olho de Cobra ficou para trás para governar as terras de seu falecido pai. Ragnarr Loðbrók deixou-lhe algumas botas muito grandes para encher.\n\n#bold Os descendentes de Sigurd serão os reis da Dinamarca, Noruega e Inglaterra há mais de um século. Você pode cumprir o destino de sua dinastia?#!"
 bookmark_northmen_sigurdr_snake_in_the_eye_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
