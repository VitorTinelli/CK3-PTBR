l_spanish:
 bm_1066_iberia:0 "Iberia em pedaços"
 bm_1066_iberia_desc:0 "Quando o velho rei Ferdinand I faleceu, seus três filhos herdaram um pedaço de seu reino ibérico. Ganância, ambição e guerras santas logo empurram a Península Ibérica para ferver, e os laços entre os membros da família começam a se desgastar.\n\n#bold Algum dos irmãos Fernandez é forte, ou astuto, o suficiente para sair vitorioso sobre o resto? Como a guerra e a diplomacia moldarão a Península Ibérica?#!"
 bookmark_iberia_infanta_urraca:0 "Infanta Urraca"
 bookmark_iberia_infanta_urraca_alt_elvira:0 "$Elvira$"
 bookmark_iberia_infanta_urraca_desc:0 "A mais velha dos filhos de Fernando, Urraca tinha uma influência generalizada sobre seus irmãos e a Igreja. Ela e sua irmã Elvira receberam a senhoria sobre todos os mosteiros nos três reinos, e ela não ficou ociosa enquanto seus irmãos se dilaceravam.\n\n#bold Para superar seus irmãos e garantir seu lugar na história, Urraca precisa de paciência e coragem - você será bem-sucedido?#!"
 bookmark_iberia_infanta_urraca_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_iberia_king_alfonso:0 "Rei Alfonso VI"
 bookmark_iberia_king_alfonso_alt_nuno:0 "$NuN_o$"
 bookmark_iberia_king_alfonso_alt_sancha:0 "$Sancha$"
 bookmark_iberia_king_alfonso_desc:0 "O filho do meio, e favorito de seu pai, Alfonso herdou o rico reino do meio de Léon. Ele passou a ser mais esperto e subjugar os dois irmãos e governou o reino reunido de seu pai.\n\n#bold Através da diplomacia política e familiar e da agressão, você tem o que é preciso para unir os três reinos sob uma bandeira?#!"
 bookmark_iberia_king_alfonso_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_iberia_king_antso:0 "Rei Antso IV"
 bookmark_iberia_king_antso_alt_ramiro:0 "$Ramiro$"
 bookmark_iberia_king_antso_alt_sancho:0 "$Sancho$"
 bookmark_iberia_king_antso_desc:0 "Muitos senhores no oeste do reino abandonaram o rei Antso depois que ele ascendeu ao trono após a morte de seus pais. Ele logo se envolveu em uma guerra com seu primo Rei Sancho que viu Antso derrotado, e depois de um reinado marcado pela guerra e derrota, ele foi assassinado por seus próprios irmãos.\n\n#bold Reescreva a história, seja mais esperto que sua família e proteja seu domínio e herança!#!"
 bookmark_iberia_king_antso_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_iberia_king_garcia:0 "Rei García"
 bookmark_iberia_king_garcia_desc:0 "Dado o reino mais problemático dos três irmãos, García tentou muitos remédios extremos para estabilizar seu governo. No entanto, a frágil terra logo se tornou muito tentadora para seu irmão Alfonso, que a invadiu em 1071. Esse ataque deu início a muitas guerras que se seguiram entre os irmãos, mas García passaria a maior parte desse tempo atrás das grades.\n\n#bold Pegue as armas contra seus irmãos e conduza este reino instável para a glória e vitória!#!"
 bookmark_iberia_king_garcia_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_iberia_king_sancho:0 "Rei Sancho II"
 bookmark_iberia_king_sancho_alt_rodrigo:0 "$Rodrigo$"
 bookmark_iberia_king_sancho_desc:0 "Sancho foi roubado de sua herança total pela divisão das terras de seu pai entre os três irmãos. Um homem de oportunidade, ele rapidamente levantou armas contra seus irmãos assim que a paz começou a ruir, mas apenas por um breve período conseguiu governar o reino reunido antes de ser assassinado.\n\n#bold Por meio de ação militar e planejamento, você pode restaurar todo o reino à sua glória sob o governante de direito e manter o poder?#!"
 bookmark_iberia_king_sancho_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
