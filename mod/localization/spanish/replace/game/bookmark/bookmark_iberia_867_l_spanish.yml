l_spanish:
 bm_867_iberia:0 "A Luta pela Ibéria"
 bm_867_iberia_desc:0 "Os antigos poderes da Ibéria estão se desintegrando.\n\nNo norte, Astúrias está repleta de vassalos ambiciosos, ansiosos para serem livres.\n\nNo sul, al-Andalus se fortalece, mas enfrenta murmúrios de descontentamento. Os distritos militares da fronteira murmuram sobre independência e a intriga assola os governantes Umayyads.\n\nPoderes estrangeiros famintos cobiçam as ricas terras da Ibéria.\n\n#bold Séculos em formação, o $game_concept_iberian_struggle$ entra em uma nova fase, e se terminará em sangue ou fraternidade depende de um lance de dados."
 bookmark_fp2_iberia_adanis_ibn_awsaga:0 "Emir Adanis"
 bookmark_fp2_iberia_adanis_ibn_awsaga_desc:0 "Encarregada pelo sultão omíada de proteger a costa oeste dos ataques vikings, a dinastia berbere Banu Danis cresceu rapidamente em influência e poder. O emir Adanis construiu fortes fortalezas em Alcácer e Coimbra, mas está preocupado com os moçárabes sob seu domínio, que prefeririam se unir ao seu inimigo, Ibn Marwan.\n\n#bold Você pode proteger suas terras e liderar os berberes para um grande futuro em Al-Andalus?#!"
 bookmark_fp2_iberia_adanis_ibn_awsaga_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_fp2_iberia_bernat_of_gothia:0 "$Bernat$"
 bookmark_fp2_iberia_ibn_awsaga_alt_masud:0 "Mas'ud ibn Adanis"
 bookmark_fp2_iberia_ibn_awsaga_alt_yahya:0 "Yahya ibn Adanis"
 bookmark_fp2_iberia_ibn_marwan:0 "Ibn Marwan"
 bookmark_fp2_iberia_ibn_marwan_alt_rahman:0 "Abd al-Rahman"
 bookmark_fp2_iberia_ibn_marwan_alt_surunbaqi:0 "Emir Sa'dun de Porto"
 bookmark_fp2_iberia_ibn_marwan_desc:0 "Um aventureiro por natureza, Abd al-Rahman ibn Marwan tem uma relação tumultuada com seu senhor, o sultão omíada, mas desfruta de forte apoio dos moçárabes em seu domínio, e pode, na verdade, ter mais em comum com eles e sua fé. Ele construiu uma fortaleza em Badajoz, mas, no oeste, o clã zeloso Banu Danis se opõe cada vez mais ao seu domínio sobre a Baixa Marca.\n\n#bold Uma aliança com Alfonso III, o rei sempre oportunista de Astúrias, pode ajudá-lo a ganhar uma coroa própria?#!"
 bookmark_fp2_iberia_ibn_marwan_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_fp2_iberia_lubb_ibn_musa_alt_mohamed:0 "Mohamed"
 bookmark_fp2_iberia_lubb_ibn_musa_alt_oria:0 "Oria"
 bookmark_fp2_iberia_lupp_ibn_musa:0 "$Lubb$ Muzez"
 bookmark_fp2_iberia_lupp_ibn_musa_desc:0 "A poderosa dinastia dos Banu Qasi, os Filhos de Cassius, outrora dominava todo o Vale do Ebro. Tempos difíceis se abateram sobre eles desde o reinado do glorioso pai de $Lubb$, e os recém-renomeados Banu Musa apenas murmuram e lambem suas feridas de sua antiga sede em Tudela, planejando recuperar seus domínios do sul.\n\n#bold Você será capaz de retomar o que pertencia aos Banu Qasi e trazer a dinastia de volta à sua antiga glória?#!"
 bookmark_fp2_iberia_lupp_ibn_musa_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_fp2_iberia_mendo_guterres:0 "Conde $Hermenexildo$ Gutierrez"
 bookmark_fp2_iberia_mendo_guterres_alt_arias:0 "$Arias$"
 bookmark_fp2_iberia_mendo_guterres_alt_ermesinda:0 "Hermesinda Gatónez"
 bookmark_fp2_iberia_mendo_guterres_desc:0 "Um poderoso vassalo do rei Adelfonso III, $Hermenexildo$ controla as terras do sul da Galícia com uma administração impecável. Uma lealdade inquestionável para com seu monarca o ajudou a expandir o domínio ancestral de sua família - mas será suficiente?\n\n#bold Com o crescente interesse no Sul, você será capaz de conquistar as terras de Portucale e iniciar uma de suas dinastias mais influentes?#!"
 bookmark_fp2_iberia_mendo_guterres_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_fp2_iberia_sunyer:0 "$Sunyer$"
 bookmark_fp2_iberia_wilfred_the_hairy:0 "$GuifrE_$ $nick_the_hairy$"
 bookmark_fp2_iberia_wilfred_the_hairy_desc:0 "Quando seu pai e tio foram assassinados pelo Duque de Toulouse, o rei franco tomou suas terras, deixando $GuifrE_$ e seus primos desamparados.\n\nJá se passaram vinte anos, e a roda gira. Recomposto em suas terras paternas, o primo conspirador de $GuifrE_$ também recuperou seus direitos de nascimento, e seu novo senhor é um primo do homem que matou seus pais.\n\n#bold Você, acima de todas as pessoas, sabe que as fortunas podem mudar num piscar de olhos, e anseia por um prêmio mais seguro — $d_barcelona$.#!"
 bookmark_fp2_iberia_wilfred_the_hairy_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 war_867_Vimara_conquest_Portucale:0 "Guerra pela [claim|E] de Vimara em $d_porto$"
 war_Andalusian_Rebellion:0 "Rebelião dos Distritos da Fronteira"
