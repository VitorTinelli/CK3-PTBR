l_spanish:
 ABANDONED_SPOUSE_MODIFIER:0 "Você tem [GetModifier('abandoned_marriage_modifier').GetNameWithTooltip]: $VALUE|=+0$"
 abandoned_marriage_modifier:0 "Casamento Abandonado"
 abandoned_marriage_modifier_desc:0 "Este personagem abandonou seu cônjuge, com quem ainda está tecnicamente casado...\nAceitação do [marriage|E]: #N -150#!"
 armies_hampered:0 "Exércitos Prejudicados"
 armies_unhampered:0 "Exércitos Sem Prejuízo"
 bm_1066_rags_to_riches:0 "Dos Trapos a Seda"
 bm_1066_rags_to_riches_desc:0 "#V #font:TitleFont #size:20 @legends_of_ck_icon! Lendas do Crusader Kings III#!#!#!\n\nPor toda a Europa, famílias lutam e conspiram pelo poder. Muitas terras estão disputadas, enquanto batalhas são vencidas e perdidas, e dinastias surgem e desaparecem, conforme seus governantes são superados.\n\n#bold Reis de outrora estão sendo substituídos, enquanto recém-chegados alcançam as estrelas. Qual deles você será?#!"
 bookmark.1066.a:0 "Jesus morreu pelos nossos pecados; um a mais não fará mal."
 bookmark.1066.a_flavor:0 "[hunchback.GetFirstName] não é um exemplo de saúde, ele só precisa de um pequeno empurrão em direção à sepultura..."
 bookmark.1066.b:0 "Evitarei ele até o dia em que morrer."
 bookmark.1066.b_flavor:0 "Se eu evitar encontrá-lo para sempre, sua casa não poderá reivindicar minhas terras."
 bookmark.1066.c:0 "Embora o divórcio seja impossível, ainda tenho influência com o Papa..."
 bookmark.1066.c_flavor:0 "Ao fazer alguns acordos, posso tornar nosso casamento [matrilineal|E], garantindo que nossos filhos sejam de minha [house|E] e [dynasty|E]."
 bookmark.1066.d:0 "Aceito minha sorte na vida..."
 bookmark.1066.desc:0 "Onze anos atrás, minha mãe [mum.GetFirstName] orquestrou meu noivado com [hunchback.GetFirstNameNicknamed], meu meio-irmão e filho do novo marido de minha mãe, [hunchbacks_father.GetTitledFirstNameNicknamed].\n\nEmbora a aliança com [hunchbacks_father.GetPrimaryTitle.GetBaseNameNoTier] seja vantajosa, será este o futuro que Deus enxerga para a prestigiosa Casa [ROOT.Char.GetHouse.GetBaseName]?\n\n#EMP Eu#! devo agir para garantir o futuro de minha linhagem!"
 bookmark.1066.t:0 "O Dilema Conjugal de Matilda"
 bookmark.1067.a:0 "Ensine-me tudo, que os [ROOT.Char.GetFaith.PriestMalePlural] se danem!"
 bookmark.1067.a_flavor:0 "@warning_icon! #X Esta opção lhe dará um [secret|E] de [crime|E]!#!"
 bookmark.1067.b:0 "Não, isso é pensamento herético."
 bookmark.1067.b_flavor:0 "Minha fé em [ROOT.Char.GetFaith.HighGodName] é tudo que eu preciso."
 bookmark.1067.desc:0 "O fogo crepita e cintila enquanto [witch.GetFirstName] retira um livro de sua bolsa. O cheiro de ervas secas doces permeia o ar da noite.\n\n\"Meus segredos não são frequentemente dados livremente.\" Ela trava os olhos nos meus. \"Como uma jovem governante e mulher, as probabilidades estão contra você: este, meu conhecimento mais precioso, ajudará você a prosperar em um mundo que, de outra forma, veria sua ruína.\"\n\nA mulher misteriosa parece determinada a compartilhar sua sabedoria... mas isso é exatamente o que os padres me avisaram."
 bookmark.1067.t:0 "Sussurros de Bruxaria"
 bookmark.1068.a:0 "Essas terras serão minhas, pela força!"
 bookmark.1068.a_flavor:0 "Para adicionar os [titles|E] ao seu [realm|E], você provavelmente terá que ir para a [war|E] usando a [claim|E] de [casus_belli|E]."
 bookmark.1068.b:0 "Desfrutarei do favor d[Select_CString( emperor.IsFemale, 'a', 'o' )] [emperor.GetTitleAsNameNoTooltip]."
 bookmark.1068.b_flavor:0 "[Select_CString( emperor.IsFemale, 'A', 'O' )] [emperor.GetTitleAsNameNoTooltip], seu [liege|E], lhe deverá um [hook|E] que pode ser usado para uma infinidade de coisas — como exigir um [marriage|E] benéfico."
 bookmark.1068.desc:0 "[GetTitleByKey('d_meissen').GetNameNoTier] e [GetTitleByKey('d_lausitz').GetNameNoTier], como cobiço aquelas terras férteis e prósperas!\n\nM[Select_CString( emperor.IsFemale, 'inha', 'eu' )] senhor[Select_CString( emperor.IsFemale, 'a', '' )] feudal, [emperor.GetTitledFirstNameNicknamed], prometeu-as para mim em troca de minha lealdade. Mas sei que são apenas palavras vazias, [emperor.GetSheHe] não será capaz de me concedê-las.\n\nPosso aceitar as palavras d[Select_CString( emperor.IsFemale, 'a', 'o' )] [emperor.GetTitleAsNameNoTooltip] pelo que são — elogios ao meu caráter elevado, mas nada mais — ou posso tomar as rédeas da situação."
 bookmark.1068.t:0 "As Marcas Eslavas"
 bookmark.1069.a:0 "Eu expulsarei [jaromir.GetFirstNameNoTooltip], [Select_CString( jaromir.IsFemale, 'minha nova', 'meu novo' )] [jaromir.GetTitleAsNameNoTooltip] será [john_monk.GetFirstNameNoTooltip]!"
 bookmark.1069.a_flavor:0 "Ter um [councillor|E] com [skills|E] elevadas que é seu [friend|E] é muito benéfico, pois as [councillor_tasks|E] serão concluídas mais rapidamente — mas irritar seu [head_of_faith|E] é sempre arriscado, pois eles podem negar suas solicitações por [claims|E] ou [gold|E]."
 bookmark.1069.b:0 "[jaromir.GetFirstNameNoTooltip] é família afinal de contas... e ouro é mais espesso que sangue."
 bookmark.1069.b_flavor:0 "Acabar com a [Concept('rival', 'rivalidade')|E] entre você e seu irmão reduzirá significativamente o risco de ser [Concept('murder', 'assassinado')|E]."
 bookmark.1069.c:0 "Devo cuidar de assuntos não espirituais..."
 bookmark.1069.c_flavor:0 "Às vezes, não fazer nada é a melhor opção."
 bookmark.1069.desc:0 "Sempre a espinha em meu lado, m[Select_CString( jaromir.IsFemale, 'inha', 'eu' )] 'querid[Select_CString( jaromir.IsFemale, 'a', 'o' )]' irm[Select_CString( jaromir.IsFemale, 'ã', 'ão' )] [jaromir.GetFirstName] se opõe à minha autoridade a cada turno.\n\nEle não é nada como meu bom amigo [john_monk.GetFirstName] de Břevnov — um monge piedoso e #EMP não-turbulento#!, que serve [ROOT.Char.GetFaith.HighGodName] em meu nome. Ah, se fosse [john_monk.GetFirstNameNoTooltip] quem servisse como meu [jaromir.GetCouncilTitle|U]...\n\nTalvez ele pudesse?"
 bookmark.1069.t:0 "Meu Irmão [jaromir.GetFirstNameNoTooltip]"
 bookmark.1070.a:0 "Tudo isso, e mais, será meu!"
 bookmark.1070.b:0 "Talvez eu devesse ficar fora do Império."
 bookmark.1070.c:0 "Tanto o Papa quanto o Imperador podem ficar com suas terras..."
 bookmark.1070.desc:0 "A vida como Duque é preferível à vida de bandido... mas a vida como Rei me cairia melhor.\n\nPela graça de Deus e São Pedro, governo [GetTitleByKey('d_apulia').GetNameNoTier] e [GetTitleByKey('d_calabria').GetNameNoTier] — mas com a graça de alguns #EMP velhos amigos#! de meus dias como salteador, eu poderia governar toda a [GetTitleByKey('k_sicily').GetName]. Não importa o que o Papa ou o Imperador pensam.\n\nHora de começar a trabalhar."
 bookmark.1070.t:0 "Uma Sicília Normanda"
 bookmark.1071.a:0 "Eu o colocarei no trono em Constantinopla!"
 bookmark.1071.b:0 "Honestamente, eu só quero reivindicar alguns portos para mim mesmo..."
 bookmark.1071.c:0 "Não estou em posição de ajudá-lo."
 bookmark.1071.desc:0 "\"...e é por isso que você deveria apoiar minha reivindicação sobre [GetTitleByKey('e_byzantium').GetNameNoTier]!\" diz o monge, prostrando-se diante de mim. \"Você ganhará um aliado em quem pode confiar, e todo o apoio de que possa precisar!\"\n\nEste monge é claramente uma fraude. Ele não é um suposto #EMP 'Imperador injustamente deposto do Império Romano'#!, mas ele #EMP é#! útil.\n\nApesar de ser um camponês de origem humilde com uma reivindicação inventada, uma desculpa para a guerra é uma desculpa para a guerra..."
 bookmark.1071.t:0 "O Monge Pretendente"
 bookmark.1072.a:0 "As guerras são vencidas com palavras e punhais bem colocados..."
 bookmark.1072.b:0 "Devo confiar no poder militar."
 bookmark.1072.c:0 "[GetTitleByKey('c_cordoba').GetNameNoTierNoTooltip] pode esperar."
 bookmark.1072.desc:0 "Ah, bela [GetTitleByKey('c_cordoba').GetNameNoTier]! Antiga sede da autoridade califal em [GetTitleByKey('e_spain').GetNameNoTier] durante o reinado dos Omíadas. Um prêmio digno para qualquer governante buscar.\n\nAgora, estou diante de uma escolha — devo confiar no poder militar, ou devo usar minha astúcia para semear o descontentamento em suas fileiras?\n\nA abordagem que escolho será aquela que utilizarei daqui para frente."
 bookmark.1072.t:0 "Conquistando Córdoba"
 bookmark_rags_to_riches_duchess_matilda:0 "Duquesa Matilda"
 bookmark_rags_to_riches_duchess_matilda_desc:0 "[learning_lifestyle_i] #V #font:TitleFont #size:15 Lendas do Crusader Kings III#!#!#!\nNo intricado cenário do norte da Itália do século XI, Matilda de Canossa se vê governando um reino substancial após várias mortes infelizes na família. As lendas sobre a piedade de Matilda e os sussurros de bruxaria acrescentam um toque de mistério ao seu reinado.\n\n#bold Você pode proteger seu governo, garantindo que a linhagem Canossa perdure por gerações no cenário sempre mutável da Itália medieval?#!"
 bookmark_rags_to_riches_duchess_matilda_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_rags_to_riches_duke_robert:0 "Duque Robert"
 bookmark_rags_to_riches_duke_robert_alt_bohemond:0 "$Bohemond$"
 bookmark_rags_to_riches_duke_robert_alt_roger:0 "$Roger$"
 bookmark_rags_to_riches_duke_robert_desc:0 "[martial_lifestyle_i] #V #font:TitleFont #size:15 Lendas do Crusader Kings III#!#!#!\nRobert começou sua carreira como ladrão e líder de uma gangue de salteadores. Sendo um dos muitos irmãos, o filho aventureiro nunca foi previsto para se tornar um brilhante estrategista e estadista, governando vastas áreas de terra — no entanto, aqui está ele, um poderoso Duque do sul da Itália, pronto para trilhar o caminho da história, que permitirá aos Hautevilles terem uma base na Sicília por mais de cem anos.\n\n#bold Se você puder consolidar o poder no reino, o Reino da Sicília aguarda seu governante!#!"
 bookmark_rags_to_riches_duke_robert_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_rags_to_riches_duke_vratislav:0 "Duque Vratislav"
 bookmark_rags_to_riches_duke_vratislav_alt_judita:0 "$Judita$"
 bookmark_rags_to_riches_duke_vratislav_alt_ota:0 "$Ota$ $nick_the_handsome$"
 bookmark_rags_to_riches_duke_vratislav_desc:0 "[stewardship_lifestyle_i] #V #font:TitleFont #size:15 Lendas do Crusader Kings III#!#!#!\nA família Přemyslid governa a região da Boêmia há centenas de anos. Eles têm dependido muito da Senioridade para sua sucessão, o que, no caso do Duque Vratislav, eventualmente levará a sérios conflitos com seus irmãos.\n\n#bold Para se tornar Rei da Boêmia, Vratislav precisará ser estratégico com seus recursos, tanto materiais quanto não materiais — você está preparado para a tarefa?#!"
 bookmark_rags_to_riches_duke_vratislav_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_rags_to_riches_emir_yahya:0 "Emir Yahya"
 bookmark_rags_to_riches_emir_yahya_alt_yahya2:0 "$Yahya$"
 bookmark_rags_to_riches_emir_yahya_alt_zahida:0 "$Zahida$"
 bookmark_rags_to_riches_emir_yahya_desc:0 "[intrigue_lifestyle_i] #V #font:TitleFont #size:15 Lendas do Crusader Kings III#!#!#!\nO Reino de Toledo será estabelecido no final do século XI, quando o Rei de Leão assume o controle da cidade epônima. Esta erradicação de Emir Yahya e sua influência significa que a família Dhunnunid perderá seu domínio sobre a região, onde reinaram por gerações.\n\n#bold Manipulando seus rivais e encontrando mais aliados, você tem o que é preciso para desafiar os Reis da Península Ibérica e mudar a história para a casa Dhunnunid?#!"
 bookmark_rags_to_riches_emir_yahya_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_rags_to_riches_petty_king_murchad:0 "Rei Menor Murchad"
 bookmark_rags_to_riches_petty_king_murchad_alt_bebinn:0 "$BE_binn$"
 bookmark_rags_to_riches_petty_king_murchad_alt_brian:0 "$Brian$"
 bookmark_rags_to_riches_petty_king_murchad_desc:0 "[diplomacy_lifestyle_i] #V #font:TitleFont #size:15 Lendas do Crusader Kings III#!#!#!\nNo início do século XI, a Alta Realeza da Irlanda escapou e retornou ao controle da Casa Briain, enquanto as casas nobres irlandesas guerreavam por território, entre si e contra os colonizadores vikings. No entanto, apesar de descender de uma linhagem de homens considerados destinados à realeza, pouco se sabe sobre o breve reinado de Murchad sobre a pequena área de Munster.\n\n#bold Com sua ajuda, talvez um membro da Casa de Briain possa se sentar no trono da Irlanda mais uma vez?#!"
 bookmark_rags_to_riches_petty_king_murchad_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
