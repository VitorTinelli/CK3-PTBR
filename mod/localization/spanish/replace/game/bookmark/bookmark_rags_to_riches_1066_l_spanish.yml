 raiktor_vassal_backup_desc:0 "Você toma os [counties|E] de [GetTitleByKey('c_dyrrachion').GetNameNoTier], [GetTitleByKey('c_avlonas').GetNameNoTier] e [GetTitleByKey('c_buthrotum').GetNameNoTier]"
 raiktor_vassal_desc:0 "[vassal_to_be.GetShortUIName] ganha os [counties|E] de [GetTitleByKey('c_dyrrachion').GetNameNoTier], [GetTitleByKey('c_avlonas').GetNameNoTier] e [GetTitleByKey('c_buthrotum').GetNameNoTier] e se torna seu [vassal|E]"
 start_cordoba_war:0 "Você inicia uma [war|E] contra [cordoba_holder.GetShortUIName] para conquistar o [county|E] de [GetTitleByKey('c_cordoba').GetNameNoTier] #weak (e [GetTitleByKey('c_cabra').GetNameNoTier] se [cordoba_holder.GetSheHe] o possuir)#!"
