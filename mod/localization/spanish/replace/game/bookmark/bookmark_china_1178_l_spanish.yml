l_spanish:
 bm_1178_china:0 "Céu em Turbulência"
 bm_1178_china_desc:0 "A China está dilacerada. O Filho do Céu foi expulso das Planícies Centrais pelos invasores Jurchen, e as lideranças do império optaram por uma política de apaziguamento absoluto em vez de reivindicar as terras de seus ancestrais.\n\nTigres e lobos vagueiam livremente e rios correm vermelhos com o sangue dos justos. Para permitir que tal destino calamitoso recaísse sobre o império, o desagrado do Céu deve ser profundo.\n\n#bold O povo clama por um herói que ponha fim à desordem – quem atenderá ao chamado?#!"
 bookmark_china_1178_li_renxiao:0 "Nínglìng Ngwemi Renxiao"
 bookmark_china_1178_li_renxiao_desc:0 "Após quase quatro décadas no trono, o povo de Renxiao afirma que seu é o reinado mais grandioso e próspero que o reino Tangut já conheceu. Glorioso como é o presente, seu futuro, no entanto, permanece incerto.\n\nNão se passaram nem dez anos desde que Renxiao executou seu próprio primeiro-ministro e generais após uma tentativa de golpe fracassada, e as relações entre o rei e o exército nunca mais foram as mesmas.\n\n#bold Você conseguirá proteger a Grande Xia das investidas de seus vizinhos?#!"
 bookmark_china_1178_li_renxiao_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_china_1178_tudan_xixian:0 "Comandante Túdān Xíxiǎn"
 bookmark_china_1178_tudan_xixian_desc:0 "Descendente de um dos clãs Jurchen mais nobres e esposo de uma princesa da casa imperial Jin, a linhagem de Xíxiǎn é tão impecável quanto sua habilidade em arco e equitação.\n\nTaciturno, de princípios morais rígidos e experiente em assuntos militares, sua reputação é tal que se diz ser equivalente a um exército de dez mil homens.\n\n#bold A dinastia Jin ocupou as Planícies Centrais, mas o sul ainda resiste. Quem melhor para completar a conquista senão o maior general Jurchen?#!"
 bookmark_china_1178_tudan_xixian_subheading:0 "$BOOKMARK_SUBHEADING_GOVERNOR$"
 bookmark_china_1178_xin_qiji:0 "Intendente Xīn Qìjí"
 bookmark_china_1178_xin_qiji_desc:0 "Orfão na infância, Xīn Qìjí foi criado por seu avô, que lhe incutiu um fervoroso desejo de expulsar os invasores Jurchen das Planícies Centrais.\n\nXīn Qìjí ganhou fama ao vingar o assassinato de seu comandante, mas aí suas conquistas se encerram – seu sonho de repelir os Jurchen foi repetidamente frustrado pela política de apaziguamento dos Song.\n\n#bold Xīn Qìjí terá sucesso em reconquistar o norte, ou direcionará sua energia para outros empreendimentos?#!"
 bookmark_china_1178_xin_qiji_subheading:0 "$BOOKMARK_SUBHEADING_GOVERNOR$"
 bookmark_china_1178_zhang_shi:0 "Governador Zhāng Shì"
 bookmark_china_1178_zhang_shi_desc:0 "Filho de um herói militar, Zhāng Shì é tão realizado como estudioso e filósofo quanto seu pai foi como general.\n\nEmbora respeitado por seus escritos, seu futuro político é incerto devido à sua fervorosa defesa da recuperação dos territórios do norte da dinastia Jin; uma perspectiva profundamente impopular entre aqueles que preferem a paz à guerra.\n\n#bold Zhāng Shì será aquele que moverá o mundo, ou, como tantos outros, apenas seguirá o fluxo?#!"
 bookmark_china_1178_zhang_shi_subheading:0 "$BOOKMARK_SUBHEADING_MILITARY_GOVERNOR$"
 bookmark_china_1178_zhu_xi:0 "Prefeito Zhū Xī"
 bookmark_china_1178_zhu_xi_desc:0 "Renomado como prodígio juvenil, Zhū Xī provou que suas conquistas não são glórias passageiras – rejeitando o Taoismo e o Budismo, dedicou-se ao estudo da filosofia Confucionista; agora seus escritos são amplamente divulgados enquanto aspirantes a estudiosos competem pelo privilégio de assistir a uma de suas palestras.\n\n#bold Amplamente aclamado por suas obras escritas e reflexões filosóficas, talvez a busca pelo poder possa melhor posicionar Zhū Xī para realizar sua sociedade ideal?#!"
 bookmark_china_1178_zhu_xi_subheading:0 "$BOOKMARK_SUBHEADING_GOVERNOR$"
