l_spanish:
 bm_867_christianity:0 "Pais dos Fiéis"
 bm_867_christianity_desc:0 "A Cristandade está em solo incerto. Por toda a Europa, patriarcas escrevem sobre primazia, bispos contendem amargamente por autoridade, enquanto reis e imperadores curvam a fé aos seus próprios fins ambiciosos.\n\nNo oeste, o orgulho carolíngio choca-se com a ambição romana. No leste, Constantinopla guarda seus antigos direitos com resoluta inabalabilidade. Entre eles jazem reinos recém-convertidos e fronteiras pagãs, onde a autoridade da igreja é tanto requisitada quanto repelida.\n\n#bold Você guiará o Cristianismo rumo à unidade, renunciando à luxúria pelo poder? Ou liderará o Grande Cisma da Igreja?#!"
 bookmark_adalwin_salzburg:0 "Príncipe-Arcebispo Adalwin"
 bookmark_adalwin_salzburg_desc:0 "Adalwin comanda Salzburgo, uma sede da igreja incrivelmente poderosa: rivalizada apenas por Constantinopla e os Estados Pontifícios. Sua maestria no direito canônico é seu principal instrumento de poder. Com ele, ele espera atrelar cada cargo eclesiástico à sua chancelaria.\n\n#bold Você consegue manipular tanto o rei quanto a igreja, concentrar a autoridade em sua sé e reivindicar a sede mais poderosa de toda a Cristandade?#!"
 bookmark_adalwin_salzburg_subheading:0 "Arcebispo de Salzburgo"
 bookmark_bulgaria_boris:0 "Rei Boris"
 bookmark_bulgaria_boris_alt_son:0 "Vladimir-Rasate"
 bookmark_bulgaria_boris_alt_wife:0 "Marija"
 bookmark_bulgaria_boris_desc:0 "Apenas alguns anos se passaram desde que Boris foi batizado em Pliska, atando a elite búlgara à Igreja Cristã. Muitos boiardos poderosos, liderados pelo herdeiro real Vladimir-Rasate, ainda se apegam aos velhos costumes e buscam um retorno ao Céu Azul do Tengriismo.\n\nE, à sua porta, uma horda de cavaleiros está pronta para atacar. A guerra é iminente.\n\n#bold Você consegue honrar seu santo batismo e sobreviver à turbulência que ameaça despedaçar o reino?#!"
 bookmark_bulgaria_boris_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_hamburg_rimbert:0 "Príncipe-Arcebispo Rimbert"
 bookmark_hamburg_rimbert_desc:0 "Junto com o Arcebispado de Hamburgo, Rimbert herdou o manto do 'Apóstolo do Norte' e a sagrada missão de converter a Escandinávia pagã. De sua sé na própria borda da Cristandade, ele contempla a Escandinávia pagã: onde reis dinamarqueses e suecos ainda adoram ídolos pagãos, onde apenas as primeiras sementes do batismo foram semeadas.\n\n#bold Você consegue seguir os passos do Arcebispo Ansgar, trazer os nórdicos para o rebanho e transformar Hamburgo na sé metropolitana de um Norte cristão forte?#!"
 bookmark_hamburg_rimbert_subheading:0 "Arcebispo de Hamburgo"
 bookmark_lupus_aquileia:0 "Príncipe-Arcebispo Lupus"
 bookmark_lupus_aquileia_desc:0 "Dentro de um Príncipe-Bispado sufocado pelas ambições brutais de potentados seculares, Lupus recorre à advocacia doutrinária e a intrigas cortesãs como seus meios para alcançar o poder.\n\n#bold Você consegue superar seus rivais em sabedoria, tramar melhor que seus vizinhos e estabelecer um lugar duradouro em Aquileia para homens da Igreja... e homens de sua Casa?#!"
 bookmark_lupus_aquileia_subheading:0 "Patriarcado de Aquileia"
 bookmark_moravia_rostislav:0 "Rei Rostislav"
 bookmark_moravia_rostislav_alt_svatopluk:0 "Svatopluk"
 bookmark_moravia_rostislav_desc:0 "A Grande Morávia fica entre Roma e Constantinopla, e clérigos ávidos por poder discutem pela autoridade sobre sua corte. Desconfiado do controle estrangeiro, Rostislav busca sua própria tradição cristã.\n\n#bold Você consegue defender a visão de Rostislav e estabelecer um cristianismo eslavo duradouro? Consegue manter a Morávia unida contra todos que tentariam quebrá-la?#!"
 bookmark_moravia_rostislav_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
