l_spanish:
 BOOKMARK_0211_MICHAEL_III_DEATH_GLOSS:0 "Historicamente, Michael III foi assassinado em 24 de setembro de 867, em vez de 31 de dezembro de 866. Sua data de morte foi antecipada em Crusader Kings 3 por motivos de jogabilidade."
 bm_867_adventurers:0 "Origens Humildes"
 bm_867_adventurers_desc:0 "Cada dinastia começa de forma humilde. A escalada ao poder geralmente é um processo lento, com cada geração avançando alguns degraus na escada, através de casamentos cuidadosamente planejados e guerras incessantes.\n\n#bold Mas estes são tempos de grandes mudanças e tumultos. Com muita coragem, e talvez um pouco de sorte, um herói pode elevar o nome de sua família da obscuridade à lenda. Você está pronto para aceitar o desafio?#!"
 bookmark.0101.a.tt:0 "[bewo.GetUIName] se tornará seu [player_heir|E]"
 bookmark.0101.a:0 "[bewo.GetFirstNameNoTooltip] deve carregar as tradições da [ROOT.Char.GetCulture.GetNameNoTooltip] para uma nova era."
 bookmark.0101.b.tt:0 "#warning @warning_icon! Esta opção pode deixá-lo sem um [player_heir|E]!#!"
 bookmark.0101.b:0 "Meu filho é meu filho, seja qual for seu nome ou cultura."
 bookmark.0101.c.tt:0 "Sua irmã [shawata.GetUIName] permanecerá seu [player_heir|E]"
 bookmark.0101.c:0 "A Magajiya não precisa de homens para continuar seu legado!"
 bookmark.0101.desc_dead:0 "Meu filho, [bewo.GetTitledFirstName], era a menina dos olhos de seu pai. Embora ainda um bebê, eu me pergunto se ele se identificaria mais com a lenda de seu pai aventureiro, ou com o meu legado tradicional?"
 bookmark.0101.desc_intro:0 "Por gerações, [hausaland.GetNameNoTier] tem sido governada pela Magajiya, uma linhagem de governantes matriarcais, da qual sou a mais recente.\n\nNossas tradições têm nos servido bem, mas o mundo está mudando. As proezas heróicas do meu [ROOT.Char.Custom2('RelationToMeShort', bayajidda)] [bayajidda.GetFirstName] lhe renderam grande riqueza e respeito... embora, como [bayajidda.GetSheHe] vem de terras distantes, os sucessos [bayajidda.GetHerHim] também prenunciam grandes mudanças para o meu povo.\n\n"
 bookmark.0101.desc_living:0 "Meu filho, [bewo.GetTitledFirstName], é a menina dos olhos de seu pai. Embora ainda um bebê, eu me pergunto se ele se identificará mais com o pai aventureiro, ou com o meu legado tradicional?"
 bookmark.0101.t:0 "O que há em um nome?"
 bookmark.0211.a.flavour:0 "Você e sua prole caluniarão [michael.GetFirstNameNoTooltip] por décadas após sua morte, fazendo dele um bêbado e um perdulário."
 bookmark.0211.a:0 "Ele morreu bêbado, ele permanecerá um bêbado!"
 bookmark.0211.b.flavour:0 "Você permite que a reputação de [michael.GetFirstNamePossessiveNoTooltip] se recupere, considerando a restauração das práticas iconofílicas por sua mãe durante sua regência como quase sagrada."
 bookmark.0211.b:0 "O tolo me deu sua família, seu trono e sua vida. Isso é suficiente."
 bookmark.0211.c.flavour:0 "Você permite que a memória de [michael.GetFirstNamePossessiveNoTooltip] desapareça naturalmente — na maior parte."
 bookmark.0211.c:0 "Este realmente é um vinho particularmente fino..."
 bookmark.0211.desc:0 "[michael.GetFirstNamePossessive] corpo jaz fetal no chão diante de mim, o fluxo inicial de sangue de seu membro cortado agora reduzido a um fio tênue. Uma boa noite, mesmo que tenhamos [Glossary( 'atacado mais cedo do que o pretendido', 'BOOKMARK_0211_MICHAEL_III_DEATH_GLOSS' )].\n\n#EMP Sênior#! imperador. Pah, um tolo ingênuo sem talento nem estômago para a política. Todas as vantagens que Deus pode dar a um homem e ele ainda perdeu tudo para um desconhecido das províncias.\n\nNão que eu seja mais um mero provincial. A partir de hoje à noite, eu sou #EMP o#! imperador, [basil.GetTitledFirstName], o primeiro da certamente gloriosa dinastia dos [basil.GetDynasty.GetName].\n\nEsvaziando o último de meu cálice — um dos vinhos favoritos de [michael.GetFirstNamePossessiveNoTooltip] — pondero como a história lembrará do jovem. Como eu irei #EMP permitir#! que a história o lembre."
 bookmark.0211.t:0 "Em Memória do Seu Bom Gosto"
 bookmark_adventurers_almos_arpad:0 "Álmos Árpád"
 bookmark_adventurers_almos_arpad_alt_linutika:0 "$LinU_tika$"
 bookmark_adventurers_almos_arpad_alt_son_arpad:0 "$A_rpA_d$"
 bookmark_adventurers_almos_arpad_desc:0 "Quando as sete tribos húngaras se uniram para eleger um líder supremo, suas escolhas recaíram sobre o corajoso Álmos. Um dia, seu filho Árpád assumirá o manto - mas somente se os húngaros puderem manter sua independência. Perigos se aproximam no horizonte Oriental.\n\n#bold Você pode defender os húngaros e conduzi-los à grandeza? Esta é sua chance de contar as aventuras da dinastia Árpád!#!"
 bookmark_adventurers_almos_arpad_subheading:0 "$BOOKMARK_SUBHEADING_KHAN_WITH_THE$"
 bookmark_adventurers_count_eudes:0 "Conde Eudes"
 bookmark_adventurers_count_eudes_alt_robert:0 "$Robert$"
 bookmark_adventurers_count_eudes_alt_robert_desc:0 "alt desc"
 bookmark_adventurers_count_eudes_alt_uncle_eudes:0 "$Eudes$"
 bookmark_adventurers_count_eudes_alt_uncle_eudes_desc:0 "alt desc"
 bookmark_adventurers_count_eudes_desc:0 "Em julho de 866, o invasor viking Hæsteinn matou o pai de Eudes, Roberto, o Forte. Poucos meses depois, sua mãe Adelais morreu dando à luz seu irmão Roberto. O mundo é cruel e o futuro pode parecer incerto, mas esses meninos órfãos estão destinados a sentar no trono francês. Seus descendentes, os Capetos, governarão a França por séculos.\n\n#bold Você consegue navegar pelas políticas traiçoeiras da França medieval e cumprir o destino dos irmãos Robertine?#!"
 bookmark_adventurers_count_eudes_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_adventurers_daurama_daura:0 "Daurama Daura"
 bookmark_adventurers_daurama_daura_alt_bawo:0 "$Bawo$"
 bookmark_adventurers_daurama_daura_desc:0 "Como a última Magajiya de Daura, Daurama é um símbolo dos velhos costumes do povo Hausa. Seu novo marido, Bayajiddah (originalmente do Iraque), representa a mudança, à medida que mais e mais estrangeiros se aglomeram em Hausaland, trazendo suas estranhas religiões e culturas...\n\n#bold Daurama está destinada a ser lembrada como a Última Magajiva, mas será que precisa ser assim?#!"
 bookmark_adventurers_daurama_daura_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_adventurers_jarl_haesteinn:0 "Jarl Hæsteinn"
 bookmark_adventurers_jarl_haesteinn_alt_ragnarr:0 "$Ragnarr$"
 bookmark_adventurers_jarl_haesteinn_alt_ragnarr_desc:0 "alt desc"
 bookmark_adventurers_jarl_haesteinn_desc:0 "Com astúcia e coragem, Jarl Hæsteinn tornou-se um homem rico. Depois de liderar uma invasão lucrativa pelo Mediterrâneo junto com Björn Ironside, Hæsteinn se estabeleceu na Bretanha. Os francos têm cofres prontos para serem saqueados, e um poderoso guerreiro viking é um grande aliado em tempos de turbulência política.\n\n#bold No entanto, a fortuna não vem sem inimigos. A ganância de Hæsteinn vai superá-lo, ou sua dinastia prosperará sob sua orientação?#!"
 bookmark_adventurers_jarl_haesteinn_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_adventurers_rurik_rurikid:0 "Rurik Rurikid"
 bookmark_adventurers_rurik_rurikid_alt_helgi:0 "$Helgi$ $nick_the_seer$"
 bookmark_adventurers_rurik_rurikid_desc:0 "Poucos se elevaram do nada à grandeza como o bravo Rurik! Juntamente com seus irmãos, ele trouxe ordem para a selva oriental e, desde a morte deles, é o único governante de um grande Principado. Mas isso é apenas o começo.\n\n#bold Um dia, os descendentes de Rurik fundarão o Tsardom da Rússia. Ou será que não? O destino dessa grande dinastia está em suas mãos.#!"
 bookmark_adventurers_rurik_rurikid_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 war_867_Aghlabid_Conquest_of_Sicily:0 "Conquista Aglábida da Sicília"
