l_spanish:
 RITSURYO_GLOSS:0 "#bold Ritsuryō#! foi um sistema legal e administrativo centralizado, instituído no Japão no final do século VII, com a intenção de estender a autoridade da corte imperial. Em profundo declínio no século XI, suas funções foram gradualmente usurpadas por indivíduos privados e famílias poderosas."
 bm_1066_japan:0 "Uma Lua Sempre Cheia"
 bm_1066_japan_desc:0 "Quase meio século se passou desde que Fujiwara Michinaga, Kampaku do Japão, escreveu seu famoso poema: #EMP 'Considero este mundo como meu mundo, e a lua cheia como sempre cheia.'#!\n\nAmplamente interpretadas como uma declaração da posição inabalável da família Fujiwara como regentes imperiais, suas palavras até agora parecem verdadeiras. O filho de Michinaga está prestes a passar sua posição todo-poderosa para a próxima geração.\n\n#bold Os Fujiwara manterão seu domínio sobre a corte imperial, contra os protestos de outras casas aristocráticas e da família imperial?#!"
 bookmark_japan_go_reizei:0 "$king_tenno_male_japanese$ $Chikahito$"
 bookmark_japan_go_reizei_desc:0 "$Chikahito$ cresceu como peão na disputa entre seu pai, o Imperador aposentado [Glossary('Go-Suzaku', 'JOKO_GLOSS')], e o regente [Glossary('Fujiwara', 'FUJIWARA_GLOSS')], $Yorimichi$. Agora, como [Glossary('Imperador', 'TENNO_GLOSS')], $Chikahito$ faz o possível para afirmar a autoridade imperial, mas ainda desempenha principalmente um papel cerimonial.\n\nObligado pela família de sua consorte a negar o reconhecimento de seu único filho, agora é o irmão de $Chikahito$, $Takahito$, quem está destinado a herdar o Trono de Crisântemo.\n\n#BOLD Você pode conter a influência dos Fujiwara, restaurar o [Glossary('Yamato', 'YAMATO_GLOSS')] e governar como imperador, não apenas de nome, mas exercendo poder verdadeiro e duradouro?#!"
 bookmark_japan_go_reizei_go_sanjo:0 "$Takahito$"
 bookmark_japan_go_reizei_subheading:0 "$game_concept_ceremonial_liege$ do Japão"
 bookmark_japan_go_reizei_tameyuki:0 "$Tameyuki$"
 bookmark_japan_morofusa:0 "$Morofusa$ $dynn_Minamoto$"
 bookmark_japan_morofusa_akifusa:0 "$Akifusa$"
 bookmark_japan_morofusa_desc:0 "Netos do Imperador $Murakami$, $Morofusa$ é um raro exemplo de burocrata competente [Glossary('Minamoto', 'MINAMOTO_GLOSS')], ascendendo rapidamente sob a tutela de seu pai adotivo, [Glossary('Kampaku', 'KAMPAKU_GLOSS')] $dynn_Fujiwara$ $Yorimichi$.\n\nEmbora as relações entre os [Glossary('Fujiwara', 'FUJIWARA_GLOSS')] e os Murakami Minamoto permaneçam amistosas, outras casas nobres e a família imperial esperam que $Morofusa$ se torne um contrapeso à influência Fujiwara.\n\n#BOLD Você pode tomar a regência dos Fujiwara, trazendo o poder aos descendentes diretos do imperador?#!"
 bookmark_japan_morofusa_subheading:0 "$game_concept_governor$ de $c_iyo$"
 bookmark_japan_morofusa_toshifusa:0 "$Toshifusa$"
 bookmark_japan_takenori:0 "$Takenori$ $dynn_Kiyohara$"
 bookmark_japan_takenori_desc:0 "Na recente Guerra Zenkunen, $Takenori$ ajudou os [Glossary('Minamoto', 'MINAMOTO_GLOSS')] a tomar o controle do norte do antigo clã Abe. Como agradecimento por esse serviço, a corte imperial liderada pelos [Glossary('Fujiwara', 'FUJIWARA_GLOSS')] recompensou os Kiyohara com o domínio bushi sobre as terras do norte.\n\nEste status invejável, envolvendo pouca supervisão imperial, é tolerado desde que a riqueza de Mutsu continue a fluir para a capital.\n\n#BOLD Você conseguirá manter sua posição conquistada com esforço e fundar um domínio Kiyohara duradouro, ou a discórdia de seus herdeiros destruirá tudo o que você construiu?#!"
 bookmark_japan_takenori_mitsuyori:0 "$Mitsuyori$"
 bookmark_japan_takenori_subheading:0 "Senhor de Mutsu"
 bookmark_japan_takenori_takehira:0 "$Takehira$"
 bookmark_japan_yorimichi:0 "Kampaku $Yorimichi$ $dynn_Fujiwara$"
 bookmark_japan_yorimichi_desc:0 "O nono de uma longa linha de regentes [Glossary('Fujiwara', 'FUJIWARA_GLOSS')], Yorimichi governou o Japão por quase meio século. Cedendo à velhice, agora está prestes a passar o bastão para seu filho, Morozane — mas a incerteza é grande.\n\nO Imperador Chikahito se ressente da [Glossary('regência', 'KAMPAKU_GLOSS')] e deseja recentrar o poder ao redor de seu [Glossary('Trono do Crisântemo', 'CHRYSANTHEMUM_THRONE_GLOSS')]. Longe da capital, as províncias distantes se afastaram da burocracia central, sendo governadas por aristocratas elevados como feudos próprios.\n\n#BOLD Você pode reafirmar o domínio dos Fujiwara e resistir à desintegração do sistema [Glossary('Ritsuryō', 'RITSURYO_GLOSS')]?#!"
 bookmark_japan_yorimichi_morozane:0 "$Morozane$"
 bookmark_japan_yorimichi_sadatsuna:0 "$Sadatsuna$"
 bookmark_japan_yorimichi_subheading:0 "$BOOKMARK_SUBHEADING_RULING_REGENT$"
 bookmark_japan_yoriyoshi:0 "$Yoriyoshi$ $dynn_Minamoto$"
 bookmark_japan_yoriyoshi_desc:0 "$Yoriyoshi$ lidera os mais poderosos dos [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )], aqueles que descendem do Imperador $Seiwa$. Sua influência cresceu depois que ele e seu filho, $Yoshi_ie$, serviram como generais para os [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )] na Guerra Zenkunen, lutando ao lado da família Kiyohara.\n\nSua vitória tornou os Minamoto figuras centrais entre as famílias samurais da região de Bandō, incluindo os poderosos [Glossary( 'Taira', 'TAIRA_GLOSS' )].\n\n#BOLD Você afirmará sua posição como líder das casas samurais e construirá uma coalizão capaz de desafiar os aparentemente inabaláveis Fujiwara?#!"
 bookmark_japan_yoriyoshi_subheading:0 "Senhor de Kawachi"
 bookmark_japan_yoriyoshi_yorisue:0 "$Yorisue$"
 bookmark_japan_yoriyoshi_yoshiie:0 "$Yoshi_ie$"
