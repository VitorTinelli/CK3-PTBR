l_spanish:
 bm_867_persia:0 "O Intermezzo Iraniano"
 bm_867_persia_desc:0 "Duzentos anos se passaram desde que o Califado Rashidun conquistou a Pérsia, absorvendo o vasto planalto para o poderoso Império Árabe.\n\nDuzentos anos de servidão — no entanto, todas as coisas se transformam com o tempo.\n\nAgora, os Senhores da Arábia enfraquecem, enquanto a antiga nobreza da Pérsia cresce mais forte e mais plena do que em séculos, florescendo no meio do despedaçamento da outrora todo-poderosa Ummah Islâmica unida.\n\nA oeste, o Califado Abbasid controla apenas as terras centrais do antigo império Rashidun, seus grandes governadores da Península Ibérica à Índia independentes em tudo, exceto no nome, a sucessão envolvida em uma confusão anárquica de traição, assassinato e rebelião.\n\nAo leste, aventureiros islâmicos e mercenários, isolados pelo Hindu Kush, observam com avidez os despojos de Rajastan e Delhi.\n\nA Pérsia se encontra em uma encruzilhada. Aqueles leais ao Califa confrontam os seguidores remanescentes do Zoroastrismo e Budismo, senhores da guerra ambiciosos disputam com chefes de montanha, e mercenários turcos lutam contra invasores árabes.\n\n#Bold O mundo gira: para onde isso te levará #Italic você?#!"
 bookmark_persia_amir_yaqub:0 "Amir Ya'qub"
 bookmark_persia_amir_yaqub_desc:0 "Filho de um humilde ourives, Ya'qub é um homem autodidata cuja desfiguração por um golpe de espada não o desacelerou nem o impediu.\n\nTendo conquistado um grande reino em Sistan, ele está agora envolvido em guerra com os Tahirids, antigos lacaios do califa. No front interno, os mesmos comandantes que apoiaram a usurpação de Ya'qub sussurram sobre mudar suas lealdades novamente.\n\n#Bold Parece que você está prestes a forjar um novo destino para a Pérsia — você ousa desafiar o duradouro poder dos Abbasids?#!"
 bookmark_persia_amir_yaqub_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_persia_ismail_alt_nasr:0 "Amir Nasr"
 bookmark_persia_ismail_samani:0 "Ismail Samani"
 bookmark_persia_ismail_samani_desc:0 "Por décadas, a família de Ismail tem dominado os governos de Transoxiana. A ruptura do Califado quebrou essa autoridade central, deixando os Samanids brigarem entre si pelo poder.\n\nA chance de Ismail competir pelo poder surge quando ele é aclamado como governante de Bukhara, recentemente saqueada pelos exércitos dos ferozes Corásmios do oeste. Apesar de seus talentos prodigiosos, o restante de sua família espera completa e leal submissão.\n\n#Bold Você pode superar seus irmãos e restaurar a glória da Pérsia?"
 bookmark_persia_ismail_samani_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_persia_muhammad_ibn_abdallah:0 "Muhammad ibn Abdallah"
 bookmark_persia_muhammad_ibn_abdallah_alt_caliph:0 "Califa al-Mu'tazz"
 bookmark_persia_muhammad_ibn_abdallah_alt_muhammad_ibn_tahir:0 "Muhammad ibn Tahir"
 bookmark_persia_muhammad_ibn_abdallah_desc:0 "Um administrador consumado e profissional, Muhammad serviu fielmente aos Abbasids ao longo de sua longa carreira como governador do Iraque, das Cidades Sagradas e até mesmo de Bagdá.\n\nAinda assim, os recentes tumultos têm testado até mesmo sua astúcia política, pois escapou por pouco da morte após se aliar ao califa errado. Mesmo agora, sua saúde começa a enfraquecer.\n\n#Bold Você passará seus anos crepusculares apoiando seu sobrinho aflito, o Amir de Corasão, ou se concentrará em redimir sua família aos olhos do califa?#!"
 bookmark_persia_muhammad_ibn_abdallah_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_persia_rostam:0 "Rostam I"
 bookmark_persia_rostam_alt_hasan:0 "Hasan, o Missionário"
 bookmark_persia_rostam_alt_shervin:0 "Sharvin"
 bookmark_persia_rostam_desc:0 "A família de Rostam tem uma linhagem quase inigualável no mundo conhecido: a linha de seu pai são alguns dos últimos dos Sassânidas, enquanto sua esposa traça sua descendência até os Arsácidas da Armênia, quase milenares.\n\nDinastias antigas e fé antiga perduram bem nas montanhas de Tabaristan, onde os senhores das montanhas Daylamites se agarram a rixas de gerações e muitos, Rostam entre eles, ainda lidam com a \"nova\" dominação do Islã sobre as tradições de outrora.\n\n#Bold Você pode recuperar as glórias veneráveis de sua herança, ou abraçará o mundo moderno?#!"
 bookmark_persia_rostam_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_persia_suri_of_mandesh:0 "Sūrī de Mandesh"
 bookmark_persia_suri_of_mandesh_alt_abdullah:0 "Abdullah bin Umar"
 bookmark_persia_suri_of_mandesh_alt_farhana:0 "Farhana de Bamian"
 bookmark_persia_suri_of_mandesh_desc:0 "Como o último senhor budista a oeste do Indo, Sūrī está em uma encruzilhada — rico em prata e ferro, suas terras podem facilmente se tornar o núcleo de um império poderoso, mas os senhores da guerra famintos de Corasão ao norte e Makran ao sul apreciam isso tanto quanto ele.\n\nDescendente dos reis de Guzgan nos dias de antigamente, Sūrī sente o peso da herança e a pressão da política atual mais intensamente do que a maioria.\n\n#Bold Você pode unir as tribos afegãs briguentas e defender sua herança espiritual antiga, ou finalmente abraçará a vontade de Allah?#!"
 bookmark_persia_suri_of_mandesh_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_persia_yaqub_alt_amr:0 "Amr ibn al-Layth"
 bookmark_persia_yaqub_alt_sebuk_eri:0 "Sebük-eri"
