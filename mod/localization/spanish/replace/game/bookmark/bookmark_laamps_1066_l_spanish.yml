l_spanish:
 bm_1066_laamps:0 "Os Exilados Errantes"
 bm_1066_laamps_desc:0 "Senhores e Damas rasgam o mundo ao meio com seus jogos mesquinhos de poder. Enquanto isso, grandes aventureiros se levantam de origens humildes para gravar seus nomes no edifício do tempo. Desvinculados do dever, sem títulos ou coroas, seus lares estão na estrada, e seus destinos, ilimitados.\n\n#bold Com grande coragem, astúcia e ambição, você pode enfrentar as disputas da nobreza e explorar seus planos vaidosos para avançar sua própria glória! Você tem o que é preciso para lutar na lama e poeira para se tornar uma lenda?#!"
 bm_story_content_available_copy:0 "#font:TitleFont #size:15 Conteúdo Especial de História Disponível#!#!#!"
 bm_story_content_available_icon:0 "@story_content_icon!"
 bookmark.1073.a:0 "É meu destino fundar um #EMP novo#! reino seljúcida!"
 bookmark.1073.b:0 "O trono seljúcida pertence a #EMP mim#!."
 bookmark.1073.desc:0 "Faz três anos desde que [tughril.GetTitledFirstName] morreu sem deixar herdeiros, mergulhando [GetTitleByKey('k_persia').GetBaseNameNoTier] no caos, com apenas seu primo, meu justo pai, [qutalmish.GetTitledFirstName], para manter a ordem.\n\nO ambicioso sobrinho de Tughril, [alp_arslan.GetFirstName], desceu de Corasão para usurpar a coroa enquanto os lealistas se reuniam em torno de meu pai e de mim, mas nosso destino foi selado na Batalha de [GetTitleByKey('b_damghan').GetNameNoTier]: meu pai morto; eu capturado...\n\nPerdoado, mas exilado por meus parentes desonrados, meus irmãos e eu lideramos os fiéis restantes, ganhando a vida de maneira modesta nas montanhas. Eu #EMP sei#! que grandes coisas nos aguardam — mesmo agora os exércitos oguzes avançam sobre [GetTitleByKey('e_byzantium').GetNameNoTier|l], terras ricas, prontas para serem colhidas!"
 bookmark.1073.t:0 "O Seljúcida Legítimo"
 bookmark_laamps_alt_alp_arslan:0 "Alp Arslan"
 bookmark_laamps_alt_boudewijn_v:0 "Boudewijn V"
 bookmark_laamps_alt_konstantinos_x:0 "Konstantinos X"
 bookmark_laamps_alt_mensur_qutalmishoglu:0 "Mensur"
 bookmark_laamps_alt_roussel_de_baeilleul:0 "Roussel de Bailleul"
 bookmark_laamps_el_cid:0 "Rodrigo Díaz 'o Campeador'"
 bookmark_laamps_el_cid_desc:0 "[Concept( 'story_content_el_cid', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_el_cid', '$bm_story_content_available_copy|q$' )|E]\nDescendente de uma linhagem nobre, Rodrigo entrou no conselho real muito jovem. A serviço de Sancho II de Castela, Rodrigo treinou tanto em questões de corte quanto em assuntos marciais, sob o cuidadoso olhar do rei.\n\nNo entanto, a guerra de Sancho contra seu irmão Afonso VI de Leão levaria à sua morte prematura e, então, Afonso exilaria Rodrigo, inadvertidamente iniciando sua lenda.\n\n#bold Rodrigo se tornará O Cid, \"o senhor\", e emergirá como rei por mérito próprio, ou permanecerá um nobre comum?#!"
 bookmark_laamps_el_cid_subheading:0 "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_laamps_hassan_sabbah:0 "Hasan Sabbah"
 bookmark_laamps_hassan_sabbah_desc:0 "[Concept( 'story_content_hasan', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hasan', '$bm_story_content_available_copy|q$' )|E]\nHasan Sabbah nasceu em uma família de pouca notoriedade, mas sua constante devoção ao Islã e resistência fanática à ocupação seljúcida o colocariam em um caminho para alterar a história para sempre.\n\nDe suas origens humildes, Hasan estava destinado a fundar os Assassinos em sua fortaleza nas montanhas de Alamut. Ele se tornaria uma lenda, e todos temeriam o temido Velho da Montanha.\n\n#bold Você tem a astúcia e a fé absoluta para reunir os devotos e derrubar impérios?#!"
 bookmark_laamps_hassan_sabbah_subheading:0 "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_laamps_hereweard_the_wake:0 "Hereweard 'o Desperto'"
 bookmark_laamps_hereweard_the_wake_desc:0 "[Concept( 'story_content_hereward', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hereward', '$bm_story_content_available_copy|q$' )|E]\nExilado e considerado fora da lei por Eduardo, o Confessor, Hereweard viajou para Flandres em busca de fama e fortuna.\n\nHereweard um dia retornaria à Inglaterra e lideraria uma resistência determinada contra os invasores normandos, tornando-se um herói popular de grande renome.\n\n#bold Sob sua orientação, Hereweard permanecerá um vilão notório ou se tornará o herói que nasceu para ser?#!"
 bookmark_laamps_hereweard_the_wake_subheading:0 "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_laamps_robert_crispin:0 "Robert 'Phrangopoulos'"
 bookmark_laamps_robert_crispin_desc:0 "Como segundo filho, sem direito a herança, Robert Crispin abraçou o espírito aventureiro normando.\n\nJá um veterano experiente no conflito na Península Ibérica, Robert entrou para o serviço do Imperador Bizantino e agora lidera um contingente de mercenários normandos para lutar contra os turcos.\n\n#bold Robert encontrará a glória que busca como um grande comandante, ou será vítima do ninho de cobras que é a corte bizantina?#!"
 bookmark_laamps_robert_crispin_subheading:0 "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_laamps_suleyman_qutalmishoglu:0 "Suleyman Qutalmishoglu"
 bookmark_laamps_suleyman_qutalmishoglu_desc:0 "Na luta pelo trono seljúcida, Suleyman foi derrotado por seu primo, Alp Arslan, e levado ao exílio junto com seus irmãos. Humilhado, mas não quebrado, ele conseguiu ganhar a lealdade das tribos turcomanas locais nas Montanhas Taurus.\n\nSuleyman acabaria por criar o Sultanato de Rum em meio ao tumulto na Anatólia e se envolver nas guerras dos pretendentes bizantinos.\n\n#bold Sua força será suficiente para lançar as bases de um novo império?#!"
 bookmark_laamps_suleyman_qutalmishoglu_subheading:0 "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_laamps_wallada_bint_al_mustakfi:0 "Wallada bint al-Mustakfi"
 bookmark_laamps_wallada_bint_al_mustakfi_desc:0 "[Concept( 'story_content_wallada', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_wallada', '$bm_story_content_available_copy|q$' )|E]\nFilha do Califa de Córdoba e uma das últimas dos Omíadas, Wallada dedicou sua vida à erudição e ao aprendizado. Preocupando-se pouco com as expectativas impostas às mulheres na sociedade andaluza, Wallada caminhava sem véu por um mundo austero, afiando as mentes de mulheres de todas as camadas.\n\nA vida de Wallada não tem fronteiras, e seu potencial é infinito.\n\n#bold Adote e treine mulheres inteligentes de todo o mundo para sua causa. Você pode romper as limitações da tradição e herdar o legado do Califado Omíada?#!"
 bookmark_laamps_wallada_bint_al_mustakfi_subheading:0 "$BOOKMARK_SUBHEADING_ADVENTURER$"
