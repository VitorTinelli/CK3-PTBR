l_spanish:
 bm_1178_call_of_the_empire:0 "Chamado do Império"
 bm_1178_call_of_the_empire_desc:0 "Um imperador envelhecido, um herdeiro juvenil e uma derrota recente no campo de batalha nas mãos dos Seljúcidas da Anatólia deixaram Bizâncio vulnerável, e a história provou repetidas vezes que as maiores ameaças ao império vêm de dentro com tanta frequência quanto de fora.\n\n#bold Os herdeiros de Roma enfrentarão seu último crepúsculo, ou sobreviverão à longa noite até uma nova aurora?#!"
 bookmark_call_of_the_empire_angelos:0 "Strategos Andronikos"
 bookmark_call_of_the_empire_angelos_alexios:0 "Alexios"
 bookmark_call_of_the_empire_angelos_desc:0 "Neto do Basileus Alexios Komnenos, Andronikos desfrutou de uma carreira distinta a serviço do império, mas à medida que mais e mais de seus irmãos e filhos sobem a pirâmide do poder, eles se aproximam de alturas perigosas, onde um passo em falso pode ser fatal para todos.\n\n#bold A dinastia Komnenos foi construída sobre os laços entre irmãos, e você tem abundância de parentes de sangue. Você pode tirar vantagem de seus laços familiares para ascender ainda mais?#!"
 bookmark_call_of_the_empire_angelos_ioannes:0 "Ioannes"
 bookmark_call_of_the_empire_angelos_subheading:0 "$BOOKMARK_SUBHEADING_GOVERNOR$"
 bookmark_call_of_the_empire_ioannes_kantakouzenos:0 "Strategos Ioannes"
 bookmark_call_of_the_empire_ioannes_kantakouzenos_desc:0 "Um dos comandantes mais experientes de Basileus Manuel, a estatura hercúlea e a bravura de Ioannes no campo de batalha só são iguais à sua arrogância impressionante e impetuosidade desenfreada, traços que raramente conduzem a uma vida longa e saudável na arena política bizantina.\n\n#bold A ousadia de Ioannes levará a família Kantakouzenos além de sua posição atual, ou sua arrogância acabará sendo sua ruína?#!"
 bookmark_call_of_the_empire_ioannes_kantakouzenos_michael:0 "Michael"
 bookmark_call_of_the_empire_ioannes_kantakouzenos_subheading:0 "$BOOKMARK_SUBHEADING_GOVERNOR$"
 bookmark_call_of_the_empire_kilij_arslan:0 "Sultão Kilij Arslan"
 bookmark_call_of_the_empire_kilij_arslan_desc:0 "Recém-saído da vitória sobre os bizantinos na batalha de Myriokephalon, Kilij Arslan provou ser uma força a ser reconhecida na Anatólia.\n\nDado o tempo, ele pode marchar com seus exércitos até as próprias muralhas de Constantinopla, mas a disputa de seus muitos filhos pela sucessão pode ser uma distração mortal, pois até o próprio pai de Kilij Arslan ascendeu ao trono sobre o corpo de seu irmão.\n\n#bold Quem entre seus filhos se mostrará digno de continuar seus esforços, e Rum sobreviverá às suas rivalidades?#!"
 bookmark_call_of_the_empire_kilij_arslan_kaykhusraw:0 "Kaykhusraw"
 bookmark_call_of_the_empire_kilij_arslan_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_call_of_the_empire_kilij_arslan_suleyman:0 "Suleyman"
 bookmark_call_of_the_empire_palaiologos:0 "Strategos Alexios"
 bookmark_call_of_the_empire_palaiologos_desc:0 "A família de Alexios é distinta até mesmo entre os nomes poderosos e influentes do Império Bizantino, tendo mantido um assento na mesa proverbial por mais de um século, e seus ancestrais contribuíram grandemente para a ascensão dos Komnenos.\n\nSua lealdade ao trono tem sido inabalável, mas a proximidade do poder muitas vezes leva a tentações poderosas: por quanto tempo os Palaiologos continuarão contentes em servir?\n\n#bold Alexios e sua família continuarão a apoiar o trono, ou cobiçarão ele para si?#!"
 bookmark_call_of_the_empire_palaiologos_eirene:0 "Eirene"
 bookmark_call_of_the_empire_palaiologos_subheading:0 "$BOOKMARK_SUBHEADING_GOVERNOR$"
 bookmark_call_of_the_empire_tamar:0 "Princesa Tamar"
 bookmark_call_of_the_empire_tamar_desc:0 "Apesar da oposição veemente da nobreza georgiana, o Rei da Geórgia deixou claro que sua filha mais velha, Tamar, o sucederá ao trono, um ato sem precedentes na longa história do reino.\n\nO caminho a seguir será difícil e poucos de seus futuros vassalos ficariam satisfeitos em vê-la suceder, mas aqueles que conhecem bem a princesa têm plena confiança de que ela estará à altura da ocasião.\n\n#bold Você pode provar que aqueles que duvidam de seu valor estão errados e liderar a Geórgia para uma era de ouro gloriosa?#!"
 bookmark_call_of_the_empire_tamar_giorgi:0 "Rei Giorgi da Geórgia"
 bookmark_call_of_the_empire_tamar_rusudan:0 "Rusudan"
 bookmark_call_of_the_empire_tamar_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
