l_spanish:
 EMPRESS_WU_GLOSS:0 "Wǔ Zétiān (624–705) quebrou tradições e depôs seus próprios filhos após a morte do marido, declarando #EMP a si mesma#! como fundadora de uma nova dinastia Zhao."
 bm_1066_china:0 "Canção do Esplendor"
 bm_1066_china_desc:0 "Das ruínas dos Tang nasceu a glória dos Song. Grandeza tal não se via há quase dois séculos – tributos fluem para a capital imperial de longe como um poderoso rio, rebeliões são raras e rapidamente suprimidas, e o governo está firmemente nas mãos dos capazes e meritórios.\n\nNo entanto, com grande prosperidade vem grande tentação. Nômades cobiçaram as riquezas das Planícies Centrais desde tempos imemoriais, enquanto até mesmo dentro do império os inescrupulosos muitas vezes se revestem de nobreza fingida para desviar sua riqueza para os próprios bolsos.\n\n#bold O Filho do Céu segura o mundo na palma da mão, mas e quanto àqueles que podem compelir até o Filho do Céu a agir de acordo com sua vontade?#!"
 bookmark.0400.a.tt:0 "[emperor.GetTitledFirstName] #EMP tristemente#! falecerá devido aos ferimentos e você assumirá o controle total do [realm|E] com s[Select_CString( brother.IsFemale, 'ua', 'eu' )] [brother.Custom('SisterBrother')] [brother.GetTitledFirstName] como [emperor.GetCouncillor('councillor_chancellor').GetCouncilTitle]."
 bookmark.0400.a:0 "Seu governo será lembrado... como o prelúdio do meu reinado."
 bookmark.0400.b.tt:0 "Dado o estado enfraquecido e a capacidade diminuída [emperor.GetHerHim], você assumirá o papel de [regent|E] para [emperor.GetTitledFirstName] com [brother.GetTitledFirstName] como [emperor.GetCouncillor('councillor_chancellor').GetCouncilTitle] [emperor.GetHerHim]."
 bookmark.0400.b:0 "Enquanto [emperor.GetSheHe] respira, eu governarei por trás da cortina."
 bookmark.0400.c.tt:0 "[emperor.GetTitledFirstName] #EMP tristemente#! falecerá devido aos ferimentos e você assumirá o papel de [regent|E] para s[Select_CString( child.IsFemale, 'ua', 'eu' )] [child.Custom('GetDaughterSon')] [child.GetTitledFirstName] com s[Select_CString( brother.IsFemale, 'ua', 'eu' )] [brother.Custom('SisterBrother')] [brother.GetTitledFirstName] como [emperor.GetCouncillor('councillor_chancellor').GetCouncilTitle] [child.GetHerHim]."
 bookmark.0400.c:0 "Educarei noss[Select_CString( child.IsFemale, 'a', 'o' )] [child.Custom('GetDaughterSon')] para ser maior do que [Select_CString( emperor.IsFemale, 'a', 'o' )] [emperor.GetMotherFather] [child.GetHerHim] jamais foi."
 bookmark.0400.desc:0 "Uma única flecha é suficiente para desfazer anos de planejamento. M[Select_CString( emperor.IsFemale, 'inha', 'eu' )] [emperor.GetWifeHusband] [emperor.GetFirstName] jaz ferid[Select_CString( emperor.IsFemale, 'a', 'o' )], enfraquecendo a cada dia, abatido por um arqueiro Song após se aproximar imprudentemente da batalha.\n\nDepois de tudo que suportei, não deixarei que tudo escape de minhas mãos. Mulheres governaram antes; se não através de seus maridos, então através de seus filhos, e a [Glossary('Imperatriz Wu', 'EMPRESS_WU_GLOSS')] até fundou sua própria #EMP dinastia#!.\n\nCom a influência que acumulei e o firme apoio [Select_CString( brother.IsFemale, 'da minha', 'do meu' )] [brother.Custom('SisterBrother')] [brother.GetTitledFirstName], o futuro de [xia.GetNameNoTierNoTooltip] está #EMP em minhas mãos#!."
 bookmark.0400.t:0 "O Poder por Trás da Cortina"
 bookmark.0500.a:0 "A forma mais segura de promover mudanças é por dentro."
 bookmark.0500.b:0 "Meu tempo é agora; a era do [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] está #EMP acabada#!!"
 bookmark.0500.c:0 "Ricas oportunidades aguardam aqueles ousados o suficiente para aproveitá-las."
 bookmark.0500.d:0 "O povo anseia por um salvador, e esse salvador sou #EMP eu#!."
 bookmark.0500.desc:0 "Fracasso #EMP novamente#!. Quantas vezes devo me humilhar nesses exames miseráveis, recitando versos vazios sob os olhares zombeteiros dos fiscais? Quem são #EMP eles#! para medir o valor de #EMP mim#!? Pregam virtude, mas eu os vejo como realmente são – porcos se empanturrando no cocho chamado burocracia.\n\nSuas crias mimadas entram nos exames já sabendo as respostas antes mesmo de serem escritas, protegidas por tutores comprados com moedas arrancadas daqueles tão pobres que mal conseguem manter um teto sobre suas cabeças.\n\nO [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier] foi abandonado pelo Céu; quando alguém sabe o que é certo, permanecer inerte é covardia. Que assim seja. Que os deuses testemunhem e que os poderosos tremam, #EMP pois agora sou eu quem julga#!."
 bookmark.0500.t:0 "O Definhamento da Retidão"
 bookmark_china_1066_duan_silian:0 "Sīlián Wáng"
 bookmark_china_1066_duan_silian_desc:0 "Como descendente distante do fundador de Dali, poucos imaginariam ao nascer que Duan Sīlián um dia se sentaria no trono, mas o destino é caprichoso e imprevisível.\n\nA ordem natural das coisas foi subvertida pela poderosa família Gao, segunda apenas à linhagem imperial em influência, que depôs o débil imperador reinante e instalou Sīlián em seu lugar.\n\n#bold Sīlián Wáng escapará do controle da família Gao para governar por direito próprio, ou cairá vítima de suas ambições?#!"
 bookmark_china_1066_duan_silian_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_china_1066_empress_liang:0 "$king_female$ $Luoyao_843D_7464$ $dynn_Liang_6881$"
 bookmark_china_1066_empress_liang_desc:0 "Antes apenas nora do poderoso estadista Xia $Epang_8BB9_5E9E$ $dynn_Mozang_6C92_85CF$, as ambições veladas de $Luoyao_843D_7464$ $dynn_Liang_6881$ se mostraram ainda maiores do que as do clan de seu marido indolente.\n\nCompletamente encantado por sua beleza e sagacidade, o jovem governante Tangut $king_male_tangut$ $Liangcha_5169_5C94$ exterminou o clã $dynn_Mozang_6C92_85CF$, incluindo sua própria esposa, e a assentou ao seu lado como rainha.\n\n#bold O estado Xia ainda é jovem e frágil – você tomará seu futuro em suas próprias mãos?#!"
 bookmark_china_1066_empress_liang_subheading:0 "Imperatriz Consorte de $k_xia$"
 bookmark_china_1066_ly_thanh_tong:0 "Nhật Tôn Vương"
 bookmark_china_1066_ly_thanh_tong_desc:0 "Como governante do Viet, Ly Nhật Tôn exibe a autoconfiança inabalável que apenas aqueles criados para governar desde o nascimento possuem. Comprovado em batalha, benevolente na governança e diligente na justiça, para seu povo sua palavra é absoluta.\n\nMesmo a única sombra pairando sobre seu glorioso reinado, a ausência de um herdeiro, foi recentemente dissipada com o nascimento de seu primeiro filho, Can Duc.\n\n#bold Nhất Tôn Vương conseguirá elevar o Viet a um império capaz de rivalizar com o vizinho do norte, ou suas conquistas serão efêmeras?#!"
 bookmark_china_1066_ly_thanh_tong_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_china_1066_new_noble_family:0 "Personagem Personalizado"
 bookmark_china_1066_new_noble_family_desc:0 "Crie um novo personagem e uma [noble_family|E] com uma pequena propriedade na Capital Imperial.\n\n#bold Você conseguirá começar do fundo da hierarquia burocrática e fazer um nome para si e para sua família nascente?#!"
 bookmark_china_1066_qin_guan:0 "Qín Guān"
 bookmark_china_1066_qin_guan_desc:0 "Sua família empobrecida pela morte de seu pai, as dificuldades não diminuíram as aspirações do jovem Qín Guān; pelo contrário, elas ardem ainda mais intensamente em suas circunstâncias reduzidas.\n\nCom cada livro que consegue emprestar, ele se mergulha em poesia e estratégia militar, sonhando com o dia em que igualará os feitos imortalizados nessas páginas.\n\n#bold Sonhar em alcançar grandeza é uma coisa; torná-la realidade é outra completamente diferente. Para qual destino sua mão o guiará?#!"
 bookmark_china_1066_qin_guan_subheading:0 "$BOOKMARK_SUBHEADING_LANDLESS_ADMIN$"
 bookmark_china_1066_su_shi:0 "Prefeito Sū Shì"
 bookmark_china_1066_su_shi_desc:0 "O pai de Sū Shì, apesar de ter falhado nos exames imperiais, ganhou fama por seus escritos em sua quinta década, reputação reforçada pelo desempenho exemplar e celebrado de Sū Shì em seus próprios exames.\n\nTendo atraído a atenção e o favor tanto do historiador mais eminente do império quanto do próprio imperador, a recente morte de seu pai é a única nuvem que obscurece o que se espera ser um futuro auspicioso.\n\n#bold Sū Shì conseguirá corresponder às pesadas expectativas que recaem sobre ele?#!"
 bookmark_china_1066_su_shi_subheading:0 "$BOOKMARK_SUBHEADING_GOVERNOR$"
 faithful_followers:0 "Seguidores Fiéis"
