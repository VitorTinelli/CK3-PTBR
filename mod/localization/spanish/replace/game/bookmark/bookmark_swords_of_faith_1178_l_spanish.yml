l_spanish:
 bm_1178_swords_of_faith:0 "Espadas da Fé"
 bm_1178_swords_of_faith_desc:0 "Impulsionados pelo fervor religioso e pela promessa de recompensas tanto espirituais quanto temporais, príncipes e plebeus marcharam para o leste em nome de Deus, ouro e glória eterna.\n\nSua guerra santa lhes rendeu o reino de Jerusalém e agora, quase um século depois, seus herdeiros lutam para manter o legado dos cruzados diante de poderosos potentados muçulmanos como Salah ad-Din Yusuf, o novo Sultão do Egito.\n\n#bold Esta é a era das cruzadas, no cruzamento entre o zelo religioso e a ambição mundana. Escolha seu caminho com sabedoria, pois qual prêmio é maior que a Terra Santa?#!"
 bookmark.0300.a:0 "Eu criarei [baby_baudouin.GetFirstNameNoTooltip] para se ver primeiro como um [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 bookmark.0300.b.tt:0 "#warning @warning_icon! Esta opção deixará você com um [player_heir|E] que não será de sua dinastia!#!"
 bookmark.0300.b:0 "Não, devemos honrar a memória de [dead_husband.GetFirstNamePossessiveNoTooltip]."
 bookmark.0300.desc:0 "Meu falecido marido, [dead_husband.GetFirstName], morreu meses antes de nosso filho nascer. Esta criança nunca conhecerá seu pai, e uma certa distância nos separa de seus parentes paternos.\n\nGeneroso e corajoso, embora seu pai tenha sido, nosso casamento #italic foi#! breve, e seu nome carrega pouco peso aqui...\n\nSe [baby_baudouin.GetFirstName] um dia usar uma coroa, poderá ser benéfico para ele se eu permitir que a memória de seu pai desvaneça e criá-lo de acordo com as tradições de minha própria linhagem real."
 bookmark.0300.t:0 "O Filho do Pai?"
 bookmark_swords_of_faith_gokbori:0 "Muzaffar al-Dīn Gökböri"
 bookmark_swords_of_faith_gokbori_desc:0 "Privado de seu patrimônio e banido ao exílio em favor de um irmão mais novo, Gökböri emprestou sua lâmina e bravura a um príncipe zênguida e ganhou para si um novo feudo em Harran.\n\nSeu serviço a seu novo senhor feudal tem sido constante, mas o príncipe que ele serve está acometido de uma doença da qual dificilmente sobreviverá, e Gökböri sabe bem que a lealdade deve ter seus limites, e que um futuro incerto muitas vezes anuncia oportunidades.\n\n#bold O Sultão do Egito provou até onde um homem de vontade e habilidade pode ascender: você pode seguir seus passos e fundar uma nova dinastia?#!"
 bookmark_swords_of_faith_gokbori_ghazi:0 "Sayf al-Dīn Ghazi"
 bookmark_swords_of_faith_gokbori_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_swords_of_faith_gokbori_yusuf:0 "Zayn al-Dīn Yusuf"
 bookmark_swords_of_faith_levon:0 "Conde Levon"
 bookmark_swords_of_faith_levon_desc:0 "Duas vezes a morte desceu sobre a família de Levon: primeiro levou seu pai, vítima da traição bizantina, e depois retornou para seu tio, um apóstata tirânico assassinado por seus próprios cortesãos, temerosos de serem os próximos a experimentar suas crueldades.\n\nAgora o irmão mais velho de Levon, Roupen, governa a Cilícia, um homem de temperamento santo presidindo um ninho de intrigas e ambição, e pode ser apenas uma questão de tempo até que a morte ataque pela terceira vez.\n\n#bold Você será capaz de superar o legado de conflitos de sua família e tornar a Cilícia um reino por direito próprio?#!"
 bookmark_swords_of_faith_levon_roupen:0 "Príncipe Roupen da Cilícia"
 bookmark_swords_of_faith_levon_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_swords_of_faith_raimon:0 "Duque Raimon"
 bookmark_swords_of_faith_raimon_desc:0 "Privado de seu pai em tenra idade por assassinos nizáris, Raimon tem lutado contra invasores turcomanos desde os dezessete anos, contratou corsários para devastar as costas bizantinas e suportou quase uma década de cativeiro em uma prisão zênguida.\n\nApós sua libertação, ele foi uma escolha natural como regente para o jovem rei Baudouin, mas esse jovem leproso agora atingiu a maioridade, e Raimon retornou às suas terras para contemplar o futuro do reino, assim como o seu próprio.\n\n#bold Você provou e abdicou do poder de um rei, e ainda assim permanece como um pilar do reino. O que você fará com sua influência?#!"
 bookmark_swords_of_faith_raimon_eschiva:0 "Eschiva"
 bookmark_swords_of_faith_raimon_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_swords_of_faith_saladin:0 "Salāh al-Dīn Yusuf"
 bookmark_swords_of_faith_saladin_ali:0 "Ali"
 bookmark_swords_of_faith_saladin_desc:0 "O último vizir dos Fatímidas provou ser um sucessor enérgico e capaz da dinastia que derrubou, apesar de uma recente derrota nas mãos do jovem Rei leproso de Jerusalém.\n\nEmbora formalmente investido pelo Califa Abbasida como Sultão do Egito e da Síria, enquanto os descendentes dos cruzados teimosamente se apegarem às conquistas de seus antepassados, seu reino nunca estará verdadeiramente completo.\n\n#bold Os aiúbidas podem triunfar sobre o reino de Jerusalém e reconquistar a Terra Santa, ou a queda desta nova dinastia será tão repentina quanto sua ascensão?#!"
 bookmark_swords_of_faith_saladin_saphadin:0 "Sayf al-Dīn Ahmad"
 bookmark_swords_of_faith_saladin_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_swords_of_faith_sibylla:0 "Princesa Sibylla"
 bookmark_swords_of_faith_sibylla_baudouin:0 "Rei Baudouin de Jerusalém"
 bookmark_swords_of_faith_sibylla_baudouin_son:0 "Baudouin"
 bookmark_swords_of_faith_sibylla_desc:0 "Jerusalém já conheceu uma rainha em sua breve história e parece que em breve verá outra. O irmão de Sibylla, o Rei Baudouin, governou habilmente, apesar de sua lepra, mas é apenas uma questão de tempo até que a enfermidade tire sua vida.\n\nViúva jovem e herdeira reconhecida de seu irmão, a mão de Sibylla é avidamente disputada por muitos, e uma aliança forte contribuiria muito para fortalecer sua posição.\n\n#bold A posição de Jerusalém é precária e seu rei não viverá por muito tempo. Você pode ascender ao trono e garantir não apenas sua sobrevivência, mas também seu florescimento?#!"
 bookmark_swords_of_faith_sibylla_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
