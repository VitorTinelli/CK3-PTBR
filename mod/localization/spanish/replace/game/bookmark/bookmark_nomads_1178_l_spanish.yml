l_spanish:
 bm_1178_nomads:0 "O Céu Sem Fim"
 bm_1178_nomads_desc:0 "O movimento migratório de um povo nômade é um espetáculo incrível de se ver — um mar vivo e pulsante de vidas e rebanhos, aventurando-se por vastas distâncias em busca de pastagens.\n\nAs batidas aparentemente intermináveis dos cascos de seus rebanhos soam como um tambor de guerra, um lembrete para os vizinhos sedentários de que as hordas podem atacar a qualquer momento! Pois o que são tais tribos errantes, senão exércitos eternamente em marcha?\n\n#bold O mundo cultivado está maduro para qualquer chefe corajoso o suficiente para reivindicar sua fartura. Você liderará sua tribo além da imensidão sem fim e forjará um império a cavalo?#!"
 bookmark_nomads_duolubu:0 "Chefe Duolubu"
 bookmark_nomads_duolubu_desc:0 "Outrora um Bagahatur devoto dos Kara Khitai, Duolubu sofreu uma traição vinda de seu próprio sangue. Sua esposa jaz morta, acolhida nos braços de seu próprio irmão, e o sobrinho dela agora ocupa o trono.\n\nEnquanto seu pai agoniza em seu leito de morte, a hora de agir se aproxima. Se o jovem Zhílugu não puder ser convencido, talvez seja a hora de abandoná-lo de vez.\n\n#bold Seus dias mais sombrios ficaram para trás, e o sol nasce novamente. Você irá recuperar sua honra, ou será para sempre lembrado como o tolo?#!"
 bookmark_nomads_duolubu_subheading:0 "$BOOKMARK_SUBHEADING_CHIEFTAIN$"
 bookmark_nomads_duolubu_wolila:0 "Wolila"
 bookmark_nomads_inanch_bilge:0 "Cã Inanch Bilge"
 bookmark_nomads_inanch_bilge_desc:0 "Reivindicando descendência mítica dos Magos Bíblicos, Inanch Bilge provou sua linhagem ao conquistar a independência dos Kara Khitai.\n\nMas um destino sombrio o aguarda: o filho e herdeiro do Cã, Tayang, enfrentará o poderoso Temujin em batalha — e fracassará. Sua esposa Gürbesu então terminará seus dias como concubina do vencedor...\n\n#bold Você conseguirá desafiar esse destino e garantir uma sucessão forte? Ou a fraqueza de seu filho condenará sua linhagem à vergonha eterna?#!"
 bookmark_nomads_inanch_bilge_gurbesu:0 "Gürbesu"
 bookmark_nomads_inanch_bilge_subheading:0 "$BOOKMARK_SUBHEADING_KHAN_WITH_THE$"
 bookmark_nomads_inanch_bilge_tayang:0 "Tayang, o Fraco"
 bookmark_nomads_jamukha:0 "Chefe Jamukha"
 bookmark_nomads_jamukha_desc:0 "Um guerreiro formidável por mérito próprio, Jamukha atravessou a infância com a ajuda de Temüjin, formando um laço mais forte que o de sangue. Seu orgulho nato complementa o crescente apetite de Temüjin pelo poder... mas raramente concordam nas questões de liderança.\n\n#bold Espada dos Altai, você submeterá seu #EMP anda#! ou perecerá à sua sombra?#!"
 bookmark_nomads_jamukha_subheading:0 "$BOOKMARK_SUBHEADING_CHIEFTAIN$"
 bookmark_nomads_koncek:0 "Cã Könçek"
 bookmark_nomads_koncek_desc:0 "Do Mar Negro às Terras Áridas de Altin — todos conhecem seu nome. Unificar os cumanos sob uma só bandeira não é tarefa fácil, e é preciso muita tolerância para se manter no poder nessas terras voláteis.\n\nOs príncipes da Rússia procuram manchar sua imagem mais uma vez, e em sua velhice, Könçek deve investir nas batalhas que virão, pois um Cã não reina para sempre.\n\n#bold Seus parentes dependem de você. Será você quem manterá a unidade, ou seu povo voltará a sucumbir à discórdia e ao caos?#!"
 bookmark_nomads_koncek_kotyan:0 "Kotyan"
 bookmark_nomads_koncek_subheading:0 "$BOOKMARK_SUBHEADING_KHAN$"
 bookmark_nomads_koncek_svoboda:0 "Svoboda"
 bookmark_nomads_temujin:0 "Grande Chefe Temüjin"
 bookmark_nomads_temujin_borte:0 "Borte"
 bookmark_nomads_temujin_desc:0 "Temüjin nasceu com um coágulo de sangue em sua mão direita — um sinal de destino extraordinário. Ainda jovem, já enfrentou provações terríveis: o assassinato de seu pai, a fome devastadora e a prisão por tribos rivais. Mesmo assim, sua determinação permanece inabalável, e agora ele reúne cavaleiros audazes sob sua bandeira.\n\n#bold Que a terra estremeça sob os cascos trovejantes de suas hordas sem fim, e que o mundo se curve à sua vontade!#!"
 bookmark_nomads_temujin_hoelun:0 "Hoelun"
 bookmark_nomads_temujin_subheading:0 "$BOOKMARK_SUBHEADING_HIGH_CHIEFTAIN$"
 bookmark_nomads_togrul:0 "Grande Chefe Togrul"
 bookmark_nomads_togrul_desc:0 "O assassinato de seus meio-irmãos pode ter trazido a Togrul o comando dos Keraits, mas foi apenas graças à ajuda de seu amigo e aliado Yesügei que ele conseguiu mantê-lo. Duas vezes Togrul foi forçado ao exílio, e duas vezes Yesügei o reconduziu ao poder.\n\nMas não haverá uma terceira vez, pois Yesügei jaz morto, assassinado por uma tribo rival, e os inimigos de Togrul estão bem cientes da perda de seu protetor.\n\n#bold Seus inimigos cercam como lobos — onde encontrar força para enfrentá-los a todos?#!"
 bookmark_nomads_togrul_oghuul:0 "Oghuul"
 bookmark_nomads_togrul_subheading:0 "$BOOKMARK_SUBHEADING_HIGH_CHIEFTAIN$"
 bookmark_nomads_wolila:0 "Chefe Wolila"
 bookmark_nomads_wolila_desc:0 "Wolila teve dois filhos fortes. O primeiro, o firme Duolubu, o Pacificador do Oriente, casou-se com a Imperatriz de Kara Kitai. O segundo, o desonesto Puguzi, tornou-se amante dela. Esposa e irmão: juntos, eles tramaram a morte de Duolubu. Enraivecido por seu fratricídio, Wolila levou os amantes à justiça, à morte. Zhilugu de Yelü encontrou então seu caminho para o trono de Kara Kitai.\n\n#bold A última tempestade está chegando para os kitanos. Você consegue falar pelo seu povo, defender sua honra mais uma vez e mudar o destino deles?#!"
 bookmark_nomads_wolila_subheading:0 "$BOOKMARK_SUBHEADING_CHIEFTAIN$"
 bookmark_nomads_wolila_zhilugu:0 "Cã Zhilugu"
