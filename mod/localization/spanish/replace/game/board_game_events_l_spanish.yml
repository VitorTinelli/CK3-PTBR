 board_games.0001.c.tt:0 "Em jogos de [SCOPE.Custom('BG_GameType')], [stewardship|E] é anulada por [SCOPE.Custom('BG_CounterSkill_Stewardship')]"
 board_games.0001.d.random.a:0 "Você nunca verá meus movimentos chegando..."
 board_games.0001.d.random.b:0 "Sim, #EMP sim#!, exatamente como planejado..."
 board_games.0001.d.random.c:0 "É preciso uma mente sutil para jogar [SCOPE.Custom('BG_GameType')]..."
 board_games.0001.d.random.d:0 "*assobio inocente*"
