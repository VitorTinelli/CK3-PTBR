 board_games.0001.b.random.a:0 "Minha mente marcial me faz #EMP invencível#!."
 board_games.0001.b.random.b:0 "Eu jogo [SCOPE.Custom('BG_GameType')] como se eu lutasse. Descontroladamente."
 board_games.0001.b.random.c:0 "Um jogo de [SCOPE.Custom('BG_GameType')], como na guerra, é uma questão de #EMP logíca#!."
 board_games.0001.b.random.d:0 "O braço que é forte com a espada também é forte com [SCOPE.Custom('BG_GameDecider')]!"
