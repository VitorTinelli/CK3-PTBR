 board_games.0021.trigger_failure.bg_attacker:0 "As circunstâncias interrompem sua partidade com [bg_defender.GetFirstName]"
 board_games.0021.trigger_failure.bg_defender:0 "As circunstâncias interrompem sua partidade com [bg_attacker.GetFirstName]"
