 board_games.0000.t:0 "O maior de todos os jogos: [SCOPE.Custom('BG_GameType')|U]"
 board_games.0001.a.random.a:0 "[SCOPE.Custom('BG_GameType')|U] é ganho primeiro com palavras, depois com [SCOPE.Custom('BG_GamePiecePlural')]."
 board_games.0001.a.random.b:0 "Raciocínio rápido, jogador rápido."
 board_games.0001.a.random.c:0 "Você tem as melhores mãos de [bg_opponent.GetFirstNameNoTooltip]..."
 board_games.0001.a.random.d:0 "Você já jogou [SCOPE.Custom('BG_GameType')] antes? Não sei dizer."
