 board_games.0001.d.tt:0 "Em jogos de [SCOPE.Custom('BG_GameType')], [intrigue|E] é anulada por [SCOPE.Custom('BG_CounterSkill_Intrigue')]"
 board_games.0001.desc.actual_victory.both_close:0 "e qualquer um de nós pode vencer a partida a qualquer momento.\n\n"
 board_games.0001.desc.actual_victory.i_am_close:0 "e a vitória está tão perto que posso sentir o gosto.\n\n"
 board_games.0001.desc.actual_victory.neither_close:0 "embora nenhum de nós esteja nem perto da vitória.\n\n"
 board_games.0001.desc.actual_victory.sudden_death:0 "e este jogo está quase chegando ao fim.\n\n"
 board_games.0001.desc.actual_victory.they_are_close:0 "e meu oponente pode triunfar a qualquer segundo.\n\n"
 board_games.0001.desc.i_am_countered:0 "Droga, #EMP não sei como#!, [Select_CString( bg_opponent.IsFemale, 'essa', 'esse' )] [bg_opponent.GetWomanMan] é capaz de #color_blue_gray contra atacar#! todas as minhas jogadas.\n\n"
 board_games.0001.desc.i_am_winning.diplomacy.high:0 "\"Parece\", rosna meu oponente, \"que você me tem em uma pequena vantagem. Por enquanto.\""
 board_games.0001.desc.i_am_winning.diplomacy.low:0 "Eu não... eu não posso... me dê uma moeda!\" grita meu oponente, claramente frustrado e incapaz de encontrar as palavras certas."
 board_games.0001.desc.i_am_winning.diplomacy.medium:0 "Meu oponente não diz nada, apenas tamborila os dedos na mesa em um ataque de ressentimento."
 board_games.0001.desc.i_am_winning.hook_on.strong:0 "\"[bg_opponent.GetFaith.random_GoodGodNames]! Você não pode me deixar ter um pingo de controle, pode?\" lamenta meu oponente."
 board_games.0001.desc.i_am_winning.hook_on.weak:0 "$board_games.0001.desc.i_am_winning.hook_on.strong$"
 board_games.0001.desc.i_am_winning.hooked_by.strong:0 "Se não fosse um desperdício reclamar aqui o que você #EMP me deve#!», meu oponente franze a testa, eu ficaria tentado a #EMP forçá-lo #! a perder."
 board_games.0001.desc.i_am_winning.hooked_by.weak:0 "$board_games.0001.desc.i_am_winning.hooked_by.strong$"
 board_games.0001.desc.i_am_winning.intrigue.high:0 "'Você pode pensar que está ganhando', meu oponente canta, 'mas você só pensa assim porque eu quero. E eu sei que você sabe que eu sei que você sabe...'"
 board_games.0001.desc.i_am_winning.intrigue.low:0 "'Você poderia relaxar um pouco com os seus truques atrevidos?' rosna meu oponente."
 board_games.0001.desc.i_am_winning.intrigue.medium:0 "'Suspeito que minha estratégia requer um pouco mais de... astúcia', murmura meu oponente, olhando para o tabuleiro com frustração."
 board_games.0001.desc.i_am_winning.learning.high:0 "Eu sabia que não deveria ter começado com [bg_opponent.Custom('BG_RandomMoveType')]\", meu oponente reclama. \"Eu praticamente já perdi. \""
 board_games.0001.desc.i_am_winning.learning.low:0 "\"Isso é completamente injusto, eu nem mesmo #EMP entendo#! metade dessas regras\", bufa meu oponente. \"Você está claramente inventando enquanto jogamos.\""
 board_games.0001.desc.i_am_winning.learning.medium:0 "\"Você está usando o [bg_myself.Custom('BG_RandomRankPossessive')] [bg_myself.Custom('BG_RandomMoveType')] #EMP novamente#!?\" murmura meu oponente. \"Você é #EMP tão#! falso.\""
 board_games.0001.desc.i_am_winning.martial.high:0 "\"Se este fosse um campo de batalha real,\" declara meu oponente, \"as coisas seriam diferentes.\""
 board_games.0001.desc.i_am_winning.martial.low:0 "'Não consigo fazer minhas jogadas', murmura meu oponente, 'não consigo nem jogar um jogo de [SCOPE.Custom('BG_GameType')]. Será que sou bom nisso?'."
 board_games.0001.desc.i_am_winning.martial.medium:0 "Meu oponente coça o queixo pensativamente. Eu tinha certeza que esse truque funcionaria..."
 board_games.0001.desc.i_am_winning.match_history.recently_lost_against.county:0 "Meu oponente limpa uma gota de suor de seu rosto mascarado, seus olhos bem abertos, sem dúvida, relembrando mentalmente o jogo que custou a ele [bg_myself.MakeScope.Var('bg_recent_land_less_stake').Title.GetNameNoTier], enquanto jogamos."
 board_games.0001.desc.i_am_winning.match_history.recently_lost_against.default:0 "\"Não, não, não!\" lamenta meu oponente. \"Não #EMP novamente#!, não para #EMP você ainda...#!!\""
 board_games.0001.desc.i_am_winning.match_history.recently_lost_against.gamble:0 "\"Eu só preciso de uma vitória, eu só preciso de uma vitória, eu só preciso...\" murmura meu oponente, repetidamente sem parar."
 board_games.0001.desc.i_am_winning.match_history.recently_won_against.county:0 "\"Se você tivesse jogado tão bem quando [bg_myself.MakeScope.Var('bg_recent_land_loss_stake').Title.GetNameNoTier] estava na linha,\" sorri meu oponente."
 board_games.0001.desc.i_am_winning.match_history.recently_won_against.default:0 "\"Bem,\" resmunga meu oponente, \"parece #EMP que este#! jogo não está indo do jeito que eu queria.\""
 board_games.0001.desc.i_am_winning.match_history.recently_won_against.gamble:0 "\"Ahhh,\" suspira meu oponente. \"Você ganha alguns, você perde alguns. Desta vez é a sua vez de ganhar, eu acho.\""
 board_games.0001.desc.i_am_winning.relation.best_friend:0 "\"Não a nada melhor, eu sempre digo,\" diz meu melhor amigo, \"do que bater em alguém no [SCOPE.Custom('BG_GameType')]. Eu te invejo!"
 board_games.0001.desc.i_am_winning.relation.bully:0 "\"Se você me vencer, eu vou bater em você, simples assim,\" rosna meu oponente."
 board_games.0001.desc.i_am_winning.relation.crush:0 "Minha paixão é... Oh não! [bg_opponent.GetSheHe|U] está [bravbg_opponent.GetHerHim] comigo, eu sei disso, posso ver no seu olhar!"
 board_games.0001.desc.i_am_winning.relation.friend:0 "'Droga', meu amigo ri, 'você não se facilita pra ninguém, não é?'"
 board_games.0001.desc.i_am_winning.relation.guardian:0 "Eu vejo que você está aprendendo,\" meu tutor observa melancolicamente. \"Ou pelo menos, você tentar me imitar de forma mais eficaz.\""
 board_games.0001.desc.i_am_winning.relation.lover:0 "\"Nós não #EMP precisamos#! jogar [SCOPE.Custom('BG_GameType')], [bg_myself.GetFirstNameNoTooltip]\", sussurra m[bg_myself.GetHerselfHimself] amante. \"Tenho certeza de que existem outras maneiras de nos divertirmos...\""
 board_games.0001.desc.i_am_winning.relation.nemesis:0 "$board_games.0001.desc.opponent_winning.relation.nemesis$"
 board_games.0001.desc.i_am_winning.relation.rival:0 "\"Você simplesmente #EMP me ama não é?#! gosta de me humilhar, não é?\" cospe meu rival, sempre um mau perdedor."
 board_games.0001.desc.i_am_winning.relation.soulmate:0 "$board_games.0001.desc.opponent_winning.relation.soulmate$"
 board_games.0001.desc.i_am_winning.relation.victim:0 "Minha vítima está em silêncio, mas parece que está à beira das lágrimas."
 board_games.0001.desc.i_am_winning.relation.ward:0 "Minha pupila claramente está magoada com o quão mal [bg_opponent.GetSheHe] está perdendo, um olhar severo estampado [bg_opponent.Custom('MaskFace_BehindAcross')] sua [bg_opponent.Custom('MaskFace')]."
 board_games.0001.desc.i_am_winning.stewardship.high:0 "\"Dói-me dizer isso\", reclama meu oponente, \"mas as chances não parecem boas para mim."
 board_games.0001.desc.i_am_winning.stewardship.low:0 "\"Por que os números #EMP sempre#! são tão difíceis?\" choraminga meu oponente. \"Em um jogo de [SCOPE.Custom('BG_GameType')] você precisa pensar a longo prazo e eu simplesmente #EMP não consigo#!."
 board_games.0001.desc.i_am_winning.stewardship.medium:0 "Meu oponente está olhando para o tabuleiro. Devo… devo ter calculado mal em algum lugar…."
 board_games.0001.desc.i_am_winning.trait.ambitious:0 "\"Estava esperando...\" meu oponente pausa, sem palavras, \"muito mais deste jogo...\""
 board_games.0001.desc.i_am_winning.trait.arbitrary:0 "Não vejo por que não podemos usar minhas regras\", lamenta meu oponente. \"Estou lhe dizendo, é assim que todos jogam em [bg_opponent.GetCurrentLocation. GetNameNoTooltip].\""
 board_games.0001.desc.i_am_winning.trait.arrogant:0 "\"Você não está realmente me derrotando, sabia?\" meu oponente se gaba. \"Você pode #EMP até pensar#! que você vai ganhar, mas isso é impossível.\""
 board_games.0001.desc.i_am_winning.trait.bossy:0 "\"Hmm, se tivéssemos jogado pelas minhas regras as coisas teriam sido #EMP muito#! diferentes!\", murmura meu oponente."
 board_games.0001.desc.i_am_winning.trait.brave:0 "'Eu tenho um plano', gaba-se meu oponente, 'e isso mudará todo este jogo!'"
 board_games.0001.desc.i_am_winning.trait.callous:0 "\"Hmm, então é assim que é perder?\" meu oponente se pergunta. \"Não é algo que eu goste particularmente.\""
 board_games.0001.desc.i_am_winning.trait.calm:0 "\"A postura normalmente serena do meu oponente está... destorcida. A uma leve torção de raiva em seu rosto."
 board_games.0001.desc.i_am_winning.trait.charming:0 "Você não vai facilitar nem um pouco pra mim?\" pergunta meu oponente, com uma voz insuportavelmente doce."
 board_games.0001.desc.i_am_winning.trait.chaste:0 "Este é o problema com jogos [SCOPE.Custom('BG_GameType')]\", meu oponente grita, gesticulando descontroladamente. Os sentidos! É excesso carnal bruto em seu nível mais baixo."
 board_games.0001.desc.i_am_winning.trait.compassionate:0 "Sabe,\" meu oponente reflete, \"o objetivo de jogar um jogo de [SCOPE.Custom('BG_GameType')] deveria ser #EMP para se divertir #!, não ganhar a qualquer custo."
 board_games.0001.desc.i_am_winning.trait.content:0 "'Ah bem,' meu oponente suspira, 'Talvez eu não ganhe, mas fiz o meu melhor.'"
 board_games.0001.desc.i_am_winning.trait.craven:0 "Meu oponente está constantemente se debatendo e parece estar prestes a fugir."
 board_games.0001.desc.i_am_winning.trait.curious:0 "Espere… como você está ganhando?. Meu oponente parece curioso."
 board_games.0001.desc.i_am_winning.trait.cynical:0 "\"Bem #EMP é claro#! que você está ganhando,\" murmura meu oponente tristemente. \"Ninguém nunca me deixa ganhar uma partida de [SCOPE.Custom('BG_GameType')]\"."
 board_games.0001.desc.i_am_winning.trait.deceitful:0 "\"Parece que você precisa ir ao banheiro,\" meu oponente sugere, simpaticamente. \"Não se prive; eu vou cuidar do seu jogo.\""
 board_games.0001.desc.i_am_winning.trait.diligent:0 "'Sim, você está à frente por enquanto', diz meu oponente, 'mas com um pouco de esforço, posso alcançá-lo!'"
 board_games.0001.desc.i_am_winning.trait.fickle:0 "\"Este jogo de [SCOPE.Custom('BG_GameType')] é tão tedioso\", meu oponente reclama. \"Não podemos jogar outra coisa?\"."
 board_games.0001.desc.i_am_winning.trait.forgiving:0 "Meu oponente parece totalmente otimista, sem nenhum traço de medo de perder em seu rosto."
 board_games.0001.desc.i_am_winning.trait.generous:0 "Meu oponente sorri gentilmente para mim. \"Vocês está indo muito bem continue assim!\"."
 board_games.0001.desc.i_am_winning.trait.gluttonous:0 "Meu oponente mastiga preguiçosamente um muffin, perdido em uma névoa de migalhas e concentração."
 board_games.0001.desc.i_am_winning.trait.greedy:0 "Meu oponente joga uma moeda entre os dedos. O metal frio parece confortar [bg_opponent.GetSheHe] enquanto [bg_opponent.GetSheHe] contempla sua derrota iminente."
 board_games.0001.desc.i_am_winning.trait.gregarious:0 "\"Você é muito melhor do que meus parceiros habituais\", meu oponente me admira, \"e #EMP jogo#! muitos jogos de [SCOPE.Custom('BG_GameType')].\""
 board_games.0001.desc.i_am_winning.trait.honest:0 "\"Eu não esperava que fosse tão...\" meu oponente faz uma pausa por um momento,\"#EMP Díficil#! jogar com você\"."
 board_games.0001.desc.i_am_winning.trait.humble:0 "As orelhas do meu oponente estão #EMP visivelmente#! vermelhas de desgosto. \"Não há como negar que suas técnicas são...\" \"impecáveis\"."
 board_games.0001.desc.i_am_winning.trait.impatient:0 "Por [bg_opponent.GetFaith.HighGodName], você já ganhou, #EMP ok#!?\" meu oponente franze a testa. \"#EMP Acabe...#! de uma vez.\""
 board_games.0001.desc.i_am_winning.trait.just:0 "Não posso provar\", murmura meu oponente, \"mas tenho certeza que você está me sabotando."
 board_games.0001.desc.i_am_winning.trait.lazy:0 "'Oh minha vez?' boceja meu oponente. 'Desculpe, eu não consigo prestar muita atenção.'"
 board_games.0001.desc.i_am_winning.trait.lustful:0 "Meu oponente não parece estar prestando atenção no jogo, mas está fixado na… forma de seus [SCOPE.Custom('BG_GamePiecePlural')]."
 board_games.0001.desc.i_am_winning.trait.paranoid:0 "Você planejou isso, não foi? rosna meu oponente. Você planejou essas jogadas #EMP para me humilhar#! com um jogo manipulado!."
 board_games.0001.desc.i_am_winning.trait.patient:0 "\"Você pode ter a vantagem agora\", observa meu oponente, \"mas você cometerá um erro no final. Vocês sempre cometem.\""
 board_games.0001.desc.i_am_winning.trait.pensive:0 "\"Ah não, eu sabia que não deveria ter jogado... agora eu perdi seu tempo...\" murmura meu oponente."
 board_games.0001.desc.i_am_winning.trait.rowdy:0 "'Deixe você pensar que pode ganhar de mim', meu oponente sussurra, 'se eu perder, vou jogar este jogo estúpido na sua cabeça.'"
 board_games.0001.desc.i_am_winning.trait.sadistic:0 "Meu oponente permanece em silêncio, seu olhar revela respeito pelas as minhas habilidades e pela minha vitória iminente."
 board_games.0001.desc.i_am_winning.trait.shy:0 "Meu oponente está em silêncio e ainda franzindo sua testa enquanto pondera como virar o jogo a seu favor."
 board_games.0001.desc.i_am_winning.trait.stubborn:0 "\"Você não vai me vencer\", meu oponente cospe com os dentes cerrados. \"Ninguém me vence #EMP nunca#!\"."
 board_games.0001.desc.i_am_winning.trait.temperate:0 "'Hum', rosna meu oponente. 'Correr esse tipo de risco certamente vai te chatear um dia desses.'"
 board_games.0001.desc.i_am_winning.trait.trusting:0 "\"Por [bg_opponent.GetFaith.KnowledgeGodName],\" lamenta meu oponente. \"Você acha que eu dei muito trabalho para você? Eu não esperava perder tão mal tão cedo.\""
 board_games.0001.desc.i_am_winning.trait.vengeful:0 "A expressão do meu oponente é gelada. Seus dedos agarram a borda do tabuleiro, como se estivessem o segurando."
 board_games.0001.desc.i_am_winning.trait.wrathful:0 "Uma veia particularmente feia está inchando o rosto do meu oponente. \"Se você continuar ganhando, eu vou vomitar sangue #EMP literalmente#! você está trapaceando, [bg_myself.Custom2('InsultNoun', SCOPE.sC('bg_opponent'))]!."
 board_games.0001.desc.i_am_winning.trait.zealous:0 "\"Por [bg_opponent.GetFaith.KnowledgeGodName]! Livrai-me dessa ameaça\", murmura meu oponente entre os dentes."
 board_games.0001.desc.i_have_countered:0 "Naturalmente, minhas jogadas frustram meu oponente.#!\n\n"
 board_games.0001.desc.intro.diplomacy.crit_failure:0 "um esforço falho de tentar me confundir."
 board_games.0001.desc.intro.diplomacy.crit_success:0 "um conjunto de movimentos irritantemente ousados, se não arriscados."
 board_games.0001.desc.intro.diplomacy.failure:0 "várias tentativas mal disfarçadas de me prender."
 board_games.0001.desc.intro.diplomacy.success:0 "uma jogada competente e uma piada inteligente."
 board_games.0001.desc.intro.intrigue.crit_failure:0 "uma jogada simplesmente patética."
 board_games.0001.desc.intro.intrigue.crit_success:0 "um jogadas díficies e complicadas, que me deixam sem palavras."
 board_games.0001.desc.intro.intrigue.failure:0 "uma armadilha óbvia."
 board_games.0001.desc.intro.intrigue.success:0 "uma série de jogadas astutas."
 board_games.0001.desc.intro.learning.crit_failure:0 "uma tentativa desajeitada de replicar os movimentos dos melhores jogadores."
 board_games.0001.desc.intro.learning.crit_success:0 "Uma jogada digna de uma lenda."
 board_games.0001.desc.intro.learning.failure:0 "vários movimentos suaves e normais."
 board_games.0001.desc.intro.learning.success:0 "algumas táticas tradicionais e bem usadas."
 board_games.0001.desc.intro.martial.crit_failure:0 "uma estratégia de fato, bem #EMP hilária#!..."
 board_games.0001.desc.intro.martial.crit_success:0 "uma série de movimentos estratégicos devastadores."
 board_games.0001.desc.intro.martial.failure:0 "uma…sólida tentativa de colocar sua estratégia consistente."
 board_games.0001.desc.intro.martial.success:0 "várias estratégias de adaptação bem executadas."
 board_games.0001.desc.intro.opening.attacker:0 "[bg_opponent.GetTitledFirstName] ocupa o assento em frente a mim. Nosso pequeno jogo de [SCOPE.Custom('BG_GameType')] está prestes a começar, e uma expressão facial #color_blue_gray [SCOPE.Custom('BG_RandomFacialExpression')]#! me diz exatamente o quão confiante está meu [bg_myself.Custom2('RelationToMeShort', bg_opponent)].\n\n[bg_opponent.GetSheHe|U] começa, abrindo com"
 board_games.0001.desc.intro.opening.defender:0 "[bg_opponent.GetTitledFirstName] já está me esperando para iniciarmos nossa partida de [SCOPE.Custom('BG_GameType')], sentado esperando com um #color_blue_gray [bg_myself.Custom('BG_RandomFacialExpression')]#! escrito em seu rosto."
 board_games.0001.desc.intro.prowess.crit_failure:0 "uma tentativa de força tão patética que quase o derruba."
 board_games.0001.desc.intro.prowess.crit_success:0 "Um belo enredo percussivo e convincente."
 board_games.0001.desc.intro.prowess.failure:0 "uma jogada ruim e um golpe ainda pior."
 board_games.0001.desc.intro.prowess.success:0 "um movimento decente e uma mão firme."
 board_games.0001.desc.intro.stewardship.crit_failure:0 "uma série de tentativas ruins de adivinhar as probabilidades."
 board_games.0001.desc.intro.stewardship.crit_success:0 "uma série de movimentos que são matematicamente perfeitos."
 board_games.0001.desc.intro.stewardship.failure:0 "uma série de movimentos sem graça e mal calculados."
 board_games.0001.desc.intro.stewardship.success:0 "uma sequência de movimentos bem cronometrados."
 board_games.0001.desc.intro.subsequent:0 "Nossa partida continua. [bg_opponent.GetFirstName] continua com"
 board_games.0001.desc.no_counters:0 "\n\n"
 board_games.0001.desc.opponent_winning.diplomacy.high:0 "\"Honestamente, não sei o que é mais fácil\", lamenta meu oponente, \"ganhá-lo em um jogo de [SCOPE.Custom('BG_GameType')] ou dizer a história de sua derrota embaraçosa."
 board_games.0001.desc.opponent_winning.diplomacy.low:0 "Sabe,\" meu oponente pensa, \"eu posso não falar muito, mas eu sou muito bom em jogar [SCOPE.Custom('BG_GameType')].\""
 board_games.0001.desc.opponent_winning.diplomacy.medium:0 "Ah, se falar em público fosse tão fácil quanto vencê-lo em um jogo de [SCOPE.Custom('BG_GameType')]\", diz meu oponente."
 board_games.0001.desc.opponent_winning.hook_on.strong:0 "\"É bom virar o jogo contra você, sabe,\" comenta meu oponente, \"é claro...\""
 board_games.0001.desc.opponent_winning.hook_on.weak:0 "«$board_games.0001.desc.opponent_winning.hook_on.strong$»"
 board_games.0001.desc.opponent_winning.hooked_by.strong:0 "\"Você não está jogando o jogo de verdade, está?\" pergunta meu oponente, coçando o queixo pensativo. \"Porque com essas jogadas so parece que você está tentando perder."
 board_games.0001.desc.opponent_winning.hooked_by.weak:0 "«$board_games.0001.desc.opponent_winning.hooked_by.strong$»"
 board_games.0001.desc.opponent_winning.intrigue.high:0 "'Cuidado', meu oponente sorri, 'mais um movimento como esse e você acionará minha [SCOPE.Custom('BG_GamePiece')]-armadilha'."
 board_games.0001.desc.opponent_winning.intrigue.low:0 "Você vê, é por isso que eu gosto de jogos [SCOPE.Custom('BG_GameType')]\", diz meu oponente. \"Sem subterfúgios ou mentiras, apenas jogo justo de engenhosidade . Um onde, bem…\""
 board_games.0001.desc.opponent_winning.intrigue.medium:0 "Você sabia que pode dizer #EMP exatamente#! como alguém está mentindo olhando para o seu rosto durante um jogo de [SCOPE .Custom ('BG_GameType')]?\" pergunta meu oponente. \"Ah, eu não quis dizer… foi só um comentário…\""
 board_games.0001.desc.opponent_winning.learning.high:0 "Estudei minuciosamente muitos jogos de [SCOPE.Custom('BG_GameType')]\", explica meu oponente, \"e lamento dizer que neste momento eu simplesmente não acho que há uma maneira de você vencer."
 board_games.0001.desc.opponent_winning.learning.low:0 "'Eles me dizem que preciso de #EMP livros#! para provar que sou inteligente', pontifica meu oponente, 'mas acho que agora está bem claro que não sou tão desajeitado.'"
 board_games.0001.desc.opponent_winning.learning.medium:0 "'Honestamente', elogia meu oponente, 'Estou impressionado que você jogue tão bem, considerando quem você está enfrentando.'"
 board_games.0001.desc.opponent_winning.martial.high:0 "'O campo de batalha, o tabuleiro, é tudo uma questão de saber o que é mais importante', diz meu oponente. Ele bate na testa para dar ênfase."
 board_games.0001.desc.opponent_winning.martial.low:0 "Se a guerra fosse tão fácil quanto um jogo de [SCOPE.Custom('BG_GameType')], eu já dominaria o mundo\", ri meu oponente. \"Bem, eu sou assim.\""
 board_games.0001.desc.opponent_winning.martial.medium:0 "'Hmm… estratégia não é sua praia, é?' vangloria-se meu oponente."
 board_games.0001.desc.opponent_winning.match_history.recently_lost_against.county:0 "'Desde [bg_opponent.MakeScope.Var('bg_recent_land_loss_stake').Title.GetNameNoTier], não posso vencê-lo', resmunga meu oponente, ainda está dolorido nosso último jogo.."
 board_games.0001.desc.opponent_winning.match_history.recently_lost_against.default:0 "Este jogo, comenta o meu adversário, é muito melhor do que aquele outro que jogamos»."
 board_games.0001.desc.opponent_winning.match_history.recently_lost_against.gamble:0 "\"Parece que desta vez a aposta será do meu jeito, não é?\", ri meu oponente."
 board_games.0001.desc.opponent_winning.match_history.recently_won_against.county:0 "\"[bg_myself.MakeScope.Var('bg_recent_land_loss_stake').Title.GetNameNoTier] está indo bem, você sabe,\" meu oponente fala. Especialmente desde que eu assumi o lugar.\""
 board_games.0001.desc.opponent_winning.match_history.recently_won_against.default:0 "Aaah, quantas vezes eu já venci você?\" ri meu oponente. \"O #EMP certo#!, perdi a conta.\""
 board_games.0001.desc.opponent_winning.match_history.recently_won_against.gamble:0 "'Outro jogo', diz meu oponente, 'outra vitória para minha conta. Você vai ficar sem ouro, você sabe.'"
 board_games.0001.desc.opponent_winning.other.avlf:0 "\"Você um mestre? Não se gabe [bg_myself.GetFirstNameNoTooltip]. Você nem é um jogador.\""
 board_games.0001.desc.opponent_winning.other.pro_gamer:0 "\"É melhor você prestar atenção às minhas técnicas\", diz meu oponente. \"Estou prestes a fazer o que é chamado de uma jogada de mestre.\""
 board_games.0001.desc.opponent_winning.relation.best_friend:0 "\"Pelo que vale, ganhe ou perca,\" diz meu melhor amigo, \"não há ninguém no mundo que eu preferi-se mais para jogar um um jogo de [SCOPE.Custom('BG_GameType')]\"."
 board_games.0001.desc.opponent_winning.relation.bully:0 "Viu?\" meu oponente ri. \"É por isso que eu bati em você, porque você é tolo."
 board_games.0001.desc.opponent_winning.relation.crush:0 "Espere, [bg_opponent.GetSheHe] disse alguma coisa? Acho que sim!, às vezes me distraio olhando para [bg_opponent.GetSheHe] e agora estraguei tudo."
 board_games.0001.desc.opponent_winning.relation.friend:0 "\"Anime-se, cara de vinagre\", ri meu oponente. \"É apenas um jogo entre amigos, certo?\"."
 board_games.0001.desc.opponent_winning.relation.guardian:0 "'Dê uma boa olhada em mim, [bg_myself.GetFirstName],' diz meu professor. 'Estude o jogo e você poderá aprender muitas coisas.'"
 board_games.0001.desc.opponent_winning.relation.lover:0 "Sem quebrar o contato visual, meu amante começa a acariciar sua [SCOPE.Custom('BG_GamePiece')] com a ponta do dedo e… oh. #EMP Oops# !."
 board_games.0001.desc.opponent_winning.relation.nemesis:0 "Meu inimigo não diz nada. Ele apenas olha para mim, com um fogo de puro ódio em seu olhar."
 board_games.0001.desc.opponent_winning.relation.rival:0 "'Por [bg_opponent.GetFaith.FateGodName], você é tão ruim no [SCOPE.Custom('BG_GameType')] quanto em governar\", ri meu rival."
 board_games.0001.desc.opponent_winning.relation.soulmate:0 "Minha alma gêmea não esta prestando atenção ao nosso jogo de [SCOPE.Custom('BG_GameType')]. Acima de tudo, [bg_opponent.GetSheHe] parece apenas se concentrar em me encarar."
 board_games.0001.desc.opponent_winning.relation.victim:0 "Os olhos da minha vítima se iluminam com uma fúria justa, feliz que pela primeira vez algo está acontecendo."
 board_games.0001.desc.opponent_winning.relation.ward:0 "Meu aprendiz sorri para mim. \"Podemos jogar mais jogos de [SCOPE.Custom('BG_GameType')]? #EMP Porfavor#!!\"."
 board_games.0001.desc.opponent_winning.stewardship.high:0 "Sempre acreditei que jogando [SCOPE.Custom('BG_GameType')] você pode aprender muito sobre como administrar um senhorio,\" meu oponente pontifica. \" E vice-versa naturalmente."
 board_games.0001.desc.opponent_winning.stewardship.low:0 "\"Gostaria que as questões de dinheiro fossem tão fáceis quanto jogar um jogo de [SCOPE.Custom('BG_GameType')]\", observa meu oponente. \"Eu nadaria por prata.\""
 board_games.0001.desc.opponent_winning.stewardship.medium:0 "Você acha que jogar jogos de [SCOPE.Custom('BG_GameType')] é uma boa prática para o verdadeiro gerenciamento?\" implicar qualquer coisa sobre isso.'"
 board_games.0001.desc.opponent_winning.trait.ambitious:0 "Você sabe se existe um título de… #EMP Rei#! dos jogos?\" meu oponente pergunta, coçando o queixo \"Porque como você pode ver, eu acho que estou ganhando."
 board_games.0001.desc.opponent_winning.trait.arbitrary:0 "Em geral, não gosto muito das regras\", diz meu oponente, \"mas vejo algo atraente no jogos de [SCOPE.Custom('BG_GameType')]. Eles permitem que você #EMP force#! os outros a admitir que às vezes alguem é melhor que eles.\""
 board_games.0001.desc.opponent_winning.trait.arrogant:0 "Não se sinta mal, [bg_myself.GetFirstNameNoTooltip],\" meu oponente me lisonjeia, recostando-se vagarosamente em seu assento. \"Nem todos tem esse talento natural."
 board_games.0001.desc.opponent_winning.trait.bossy:0 "'Depois de te derrotar', diz meu pequeno oponente, 'Quero um pãozinho. Como pagamento.'"
 board_games.0001.desc.opponent_winning.trait.brave:0 "\"Você me permite rir um pouco\", diz meu oponente. \"Você terá que jogar com mais #EMP coragem#! se quiser #EMP ganhar de mim#!!\""
 board_games.0001.desc.opponent_winning.trait.callous:0 "'Por [bg_opponent.GetFaith.HouseholdGodName], você não joga muito, não é?' meu oponente exclama sem rodeios."
 board_games.0001.desc.opponent_winning.trait.calm:0 "Sempre achei que a chave para jogos de [SCOPE.Custom('BG_GameType')] é uma mente clara e uma cabeça fria\", pondera meu oponente. Um dia você vai aprender."
 board_games.0001.desc.opponent_winning.trait.charming:0 "Devemos jogar um jogo de [SCOPE.Custom('BG_GameType')] todos os dias, [bg_myself.GetFirstNameNoTooltip]\", diz meu pequeno adversário. «É sempre muito divertido!»."
 board_games.0001.desc.opponent_winning.trait.chaste:0 "'Disciplina doméstica cria disciplina no tabuleiro, você sabe,' meu oponente pontifica. 'Um pouco de contenção e você vai longe.'"
 board_games.0001.desc.opponent_winning.trait.compassionate:0 "Desculpe colocá-lo em uma situação tão ruim, [bg_myself.GetFirstNameNoTooltip]\", diz meu oponente, cuja voz soa genuinamente calma. \"Eu jogo jogos de [SCOPE.Custom ('BG_GameType')] por diversão, mas acho que é mais gratificante quando #EMP ambos#! as pessoas se divertem.\""
 board_games.0001.desc.opponent_winning.trait.content:0 "'Que jogo lindo', diz meu oponente. 'Não poderíamos pedir nada melhor, não é? Além de sua sorte, é claro.'"
 board_games.0001.desc.opponent_winning.trait.craven:0 "'Estou... ganhando? Estou ganhando!' grita meu oponente. Ele parece realmente surpreso, mas afinal, [bg_opponent.GetSheHe] passou metade do jogo cobrindo o rosto."
 board_games.0001.desc.opponent_winning.trait.curious:0 "Sabe,\" pensa meu pequeno oponente, \"Estou aprendendo muito com minhas vitórias contra você.\""
 board_games.0001.desc.opponent_winning.trait.cynical:0 "\"Naturalmente, não estou facilitando para você\", comenta meu oponente, me dando um olhar malicioso. Vai ficar irritado?"
 board_games.0001.desc.opponent_winning.trait.deceitful:0 "\"Não se sinta tão mal\", meu oponente me tranquiliza, com sua voz doce como mel e cáustica como pecado. \"Nem mesmo [bg_opponent.GetFaith.TricksterGodName] poderia seguir meus movimentos .\""
 board_games.0001.desc.opponent_winning.trait.diligent:0 "É por isso que você tem que trabalhar duro\", meu oponente me conforta com um tom verdadeiramente insuportável. \"Não há substituto para o trabalho duro, nem mesmo em vida, nem no [SCOPE.Custom('BG_GameType')]."
 board_games.0001.desc.opponent_winning.trait.fickle:0 "\"Eu realmente adoro como, não importa qual estratégia eu escolha, você sempre perde tão facilmente,\" brinca meu oponente."
 board_games.0001.desc.opponent_winning.trait.forgiving:0 "Para ser honesto, meu oponente reclama. \"Mas tudo bem. Pelo menos você me serve para praticar."
 board_games.0001.desc.opponent_winning.trait.generous:0 "Olha, eu posso estar ganhando, mas se você me pedir com jeitinho, eu aceitaria... deixo você ganhar,\" meu oponente explica, sua voz cheia de bondade e compaixão . \"Há mais na vida do que ganhar um jogo de [SCOPE.Custom('BG_GameType')].\""
 board_games.0001.desc.opponent_winning.trait.gluttonous:0 "\"Acho que vou comemorar minha vitória com uma festa\", pondera meu oponente. \"Gostaria de algo doce, para acompanhar a vitória\"."
 board_games.0001.desc.opponent_winning.trait.greedy:0 "A única coisa mais doce que o tilintar do ouro é o suave tamborilar das lágrimas [Select_CString( bg_myself.IsFemale, 'da sua', 'do seu' )] [bg_myself.GetWomanMan] contra um jogo de [SCOPE.Custom('BG_GameType')]\" sorri meu oponente. \"Você não concorda?"
 board_games.0001.desc.opponent_winning.trait.gregarious:0 "Não se sinta mal\", diz meu oponente, puxando as palavras enquanto estala os dedos. \"Eu ganho jogos de [SCOPE.Custom('BG_GameType')] assim como faço amigos. Com uma certa facilidade."
 board_games.0001.desc.opponent_winning.trait.honest:0 "\"Nossa, isso está indo um #EMP tanto#! melhor do que eu esperava!\" exclama meu oponente. Não queria ser rude, estou apenas sendo honesto."
 board_games.0001.desc.opponent_winning.trait.humble:0 "\"Honestamente, você está indo muito bem\", diz meu oponente. \"Eu geralmente não sou tão bom nisso, então acho que você está apenas tendo azar \""
 board_games.0001.desc.opponent_winning.trait.impatient:0 "\"Suas jogadas de [SCOPE.Custom('BG_GameType')] estão muito lentas, [bg_myself.Custom2('GetYoungMiddleAgedOld',bg_opponent)],\" murmura meu oponente, fazendo uma musica no tabuleiro com os dedos."
 board_games.0001.desc.opponent_winning.trait.just:0 "Olha\", meu oponente explica, acenando para uma pilha de papéis na minha frente. \"Desculpe, vocês continuam tentando fazer jogadas ilegais, mas se #EMP você pudesse ler as regras#!, seria melhor para você."
 board_games.0001.desc.opponent_winning.trait.lazy:0 "Meu oponente boceja descaradamente. \"Honestamente, eu esperava um desafio maior, [bg_myself.GetFirstNameNoTooltip]. Mal consigo ficar acordado."
 board_games.0001.desc.opponent_winning.trait.lustful:0 "Como o melhor amante #EMP e #! jogador de [SCOPE.Custom('BG_GameType')] do mundo, eu não me culpo por perder para mim\", ri meu oponente."
 board_games.0001.desc.opponent_winning.trait.paranoid:0 "\"Eu sei que você ainda tem um truque na manga\", meu oponente franze a testa. \"Ninguém pode ser #EMP tão#! fácil de vencer.\""
 board_games.0001.desc.opponent_winning.trait.patient:0 "'A maioria das pessoas', diz meu oponente, 'não aprecia quanto custa fazer [bg_opponent.Custom('BG_RandomMoveType')] [bg_opponent.Custom('BG_RandomArticleDirection')] [bg_opponent.Custom('BG_RandomRankPossessive')]. Muito menos se defender contra tal movimento."
 board_games.0001.desc.opponent_winning.trait.pensive:0 "Eu tinha lido muito sobre como jogar [SCOPE.Custom('BG_GameType')]\", diz meu pequeno oponente, \"mas eu não imaginava como seria fácil!\""
 board_games.0001.desc.opponent_winning.trait.rowdy:0 "Meu pequeno oponente lança uma série de ameaças mal planejadas em mim e quase derruba o tabuleiro de emoção."
 board_games.0001.desc.opponent_winning.trait.sadistic:0 "É #EMP muito#! mais divertido jogar com um inimigo machucado, diz o meu adversário, tentando me distrair com seu veneno, \"Você não concorda, [bg_myself.GetFirstNameNoTooltip]?"
 board_games.0001.desc.opponent_winning.trait.shy:0 "\"Tanta prática está valendo a pena!\" canta meu oponente, sorrindo com orgulho das suas jogadas no tabuleiro."
 board_games.0001.desc.opponent_winning.trait.stubborn:0 "\"Como é bom ganhar tão facilmente, para variar,\" meu oponente brinca. \"Eu normalmente tenho que discutir por horas antes que meu oponente admita que eu ganhei.\""
 board_games.0001.desc.opponent_winning.trait.temperate:0 "\"Posso até me permitir um copo de água com aroma de rosas depois deste jogo,\" pensa meu oponente. Eu ganhei."
 board_games.0001.desc.opponent_winning.trait.trusting:0 "\"Eu posso ir ao banheiro na sua vez,\" sorri meu oponente. \"Não vá trapacirar com minhas jogadas!"
 board_games.0001.desc.opponent_winning.trait.vengeful:0 "Claro, isso é uma vingança,\" meu oponente fala. \"E você claramente sabe o motivo.\""
 board_games.0001.desc.opponent_winning.trait.wrathful:0 "Meu oponente está estranhamente calmo. \"Ah, não há muito pelo que se irritar\", diz [bg_opponent.GetSheHe] vendo meu olhar, quando as coisas vão tão bem."
 board_games.0001.desc.opponent_winning.trait.zealous:0 "\"Eu gostaria de receber o crédito por essa vitória\", meu oponente relaxa, \"mas é tudo obra de [bg_opponent.GetFaith.KnowledgeGodName].\""
 board_games.0001.desc.relative_victory.drawing:0 "Estamos lado a lado,"
 board_games.0001.desc.relative_victory.losing_heavily:0 "Meu oponente está muito à minha frente,"
 board_games.0001.desc.relative_victory.losing_somewhat:0 "[bg_opponent.GetSheHe|U] está começando a vencer,"
 board_games.0001.desc.relative_victory.winning_heavily:0 "Estou vencendo [bg_opponent.GetSheHe] com facilidade,"
 board_games.0001.desc.relative_victory.winning_somewhat:0 "Estou na frente por enquanto,"
 board_games.0001.e.random.a:0 "Eu sou incomparável na teoria de [SCOPE.Custom('BG_GameType')]!"
 board_games.0001.e.random.b:0 "Li todos os manuais de [SCOPE.Custom('BG_GameType')]."
 board_games.0001.e.random.c:0 "Eu conheço todas as regras [ROOT.Char.GetHerHim] [SCOPE.Custom('BG_GameType')] como a palma da minha mão."
 board_games.0001.e.random.d:0 "Você acha que pode me vencer?"
