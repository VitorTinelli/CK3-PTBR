 board_games.0031.a.a:0 "Uma partida excelente!"
 board_games.0031.a.tt.failure:0 "Seu oponente faz um gesto obsceno e vai embora"
 board_games.0031.a.tt.success:0 "Seu oponente concorda que foi um bom jogo"
 board_games.0031.a:0 "Bom jogo!"
 board_games.0031.b.a:0 "Ajoelhe-se diante de mim, s[Select_CString( bg_loser.IsFemale, 'ua', 'eu' )] [bg_loser.Custom2('InsultNoun', ROOT.Char)]!"
 board_games.0031.b.b:0 "Não se sinta #EMP tão#! mal, nem todos podem ser tão inteligentes como eu."
 board_games.0031.b.progress_towards_rival:0 "[bg_loser.GetTitledFirstName] leva para o lado pessoal"
 board_games.0031.b:0 "Como é perder, pequeno [bg_loser.GetWomanMan]?"
 board_games.0031.c:0 "Adoraria jogar novamente algum dia..."
 board_games.0031.desc.end.01:0 "\n\nUm [bg_loser.GetFirstName] desolado permanece sentado, com as mãos nas coxas, tentando compreender onde errou."
 board_games.0031.desc.end.02:0 "\n\nNada além do vazio de uma [bg_loser.GetWomanMan] restou de [bg_loser.GetFirstName]. [bg_loser.GetSheHe|U] não pode acreditar que eu venci."
 board_games.0031.desc.end.03:0 "\n\n[bg_loser.GetFirstName] mal consegue conter sua raiva. Eu superei e humilhei [bg_loser.GetHerHim]."
 board_games.0031.desc.intro.01:0 "Com um rugido de triunfo, levanto-me, espalhando [SCOPE.Custom('BG_GamePiecePlural')] por toda parte."
 board_games.0031.desc.intro.02:0 "Com um sorriso presunçoso, coloco minha última [SCOPE.Custom('BG_GamePiece')] no tabuleiro."
 board_games.0031.desc.intro.03:0 "Ambos observamos a última [SCOPE.Custom('BG_GamePiece')]. Eu consegui. Eu venci."
 board_games.0031.desc.middle.01:0 "Este jogo de [SCOPE.Custom('BG_GameType')] é meu, mais uma bela vitória em minha incontestável ascensão ao posto de Rei dos Jogos."
 board_games.0031.desc.middle.02:0 "Mais uma vez, minha superioridade intelectual triunfa sobre tudo."
 board_games.0031.desc.middle.03:0 "[ROOT.Char.GetFaith.HighGodName] testemunhou meu triunfo hoje. Desde o início, tive total confiança de que [ROOT.Char.GetFaith.HighGodName] me veria como o vencedor, não poderia haver outra forma."
 board_games.0031.desc.result.skill:0 "#BOL Resultado:#! Eu venço o [board_game_match|E] contra [bg_loser.GetFirstNameNoTooltip] devido à minha pontuação estar [board_game_winning|E]"
 board_games.0031.desc.result.sudden_death:0 "#BOL Resultado:#! Eu venço o [board_game_match|E] contra [bg_loser.GetFirstNameNoTooltip] devido ao [board_game_winning_sudden_death|E]"
 board_games.0031.t:0 "$board_games.0000.t$"
 board_games.0041.a:0 "Veremos quem vence da próxima vez..."
 board_games.0041.b.b:0 "Continue celebrando e por [ROOT.Char.GetFaith.HighGodName], você provará o sabor do meu pé!"
 board_games.0041.b:0 "Você criou um inimigo hoje."
 board_games.0041.c:0 "Bem, o melhor [bg_victor.GetWomanMan] venceu!"
 board_games.0041.desc.end.01:0 "\n\nEu sou tão #EMP ruim#! em [SCOPE.Custom('BG_GameType')]?"
 board_games.0041.desc.end.02:0 "\n\nMinhas palmas ficam suadas e meus joelhos fracos ao perceber que o melhor da minha habilidade simplesmente não é suficiente para vencer [bg_victor.GetFirstName]."
 board_games.0041.desc.end.03:0 "\n\n[Select_CString( recipient.IsFemale, 'Aquela', 'Aquele' )] [recipient.Custom2('InsultNoun', ROOT.Char)]! [Select_CString( recipient.IsFemale, 'Aquela', 'Aquele' )] [recipient.Custom('InsultNoun')]! Não há como eles não terem trapaceado, como #EMP eu#! poderia perder?!"
 board_games.0041.desc.intro.01:0 "Uivando em triunfo bestial, [bg_victor.GetFirstName] salta para os pés.\n\nEu... Eu perdi. Minhas mãos escorregam até os joelhos, procurando apoio."
 board_games.0041.desc.intro.02:0 "Um sorriso presunçoso se estende de uma bochecha à outra no rosto de [bg_victor.GetFirstName]. [bg_victor.GetSheHe] venceu, enquanto eu perdi.\n\n"
 board_games.0041.desc.intro.03:0 "Não há maior decepção do que aquela que sinto ao olhar as [SCOPE.Custom('BG_GamePiecePlural')] neste tabuleiro, sua disposição claramente indica que fui derrotado."
 board_games.0041.desc.middle.01:0 "Com [ROOT.Char.GetFaith.HighGodName] como minha testemunha, fiz tudo o que pude..."
 board_games.0041.desc.middle.02:0 "Pensar que um tolo como [bg_victor.GetFirstName] pôde me superar."
 board_games.0041.desc.middle.03:0 "\n\n[SCOPE.Custom('BG_GameType')|U] é apenas uma imitação barata de #EMP guerra real#!, algo em que sou indubitavelmente superior em comparação ao meu humilde oponente. Enquanto [bg_loser.GetSheHe] estudava [SCOPE.Custom('BG_GameType')], #EMP eu estudava a espada.#! Mesmo assim..."
 board_games.0041.desc.result.skill:0 "#BOL Resultado:#! Eu perco o [board_game_match|E] para [bg_victor.GetFirstNameNoTooltip] devido à sua pontuação estar [board_game_winning|E]"
 board_games.0041.desc.result.sudden_death:0 "#BOL Resultado:#! Eu perco o [board_game_match|E] para [bg_victor.GetFirstNameNoTooltip] devido a [board_game_winning_sudden_death|E]"
 board_games.0041.t:0 "$board_games.0000.t$"
 board_games.0051.a:0 "Ah, com certeza vai me trazer sorte para sempre!"
 board_games.0051.b:0 "Mais algumas peças e terei um conjunto #EMP verdadeiramente único..."
 board_games.0051.c:0 "Eu não preciso de brinquedos especiais."
 board_games.0051.desc:0 "Mesmo agora, às vezes recordo com carinho a forma como derrotei [bg_loser.GetFirstName] tão completamente em uma partida de [SCOPE.Custom('BG_GameType')] há alguns meses. A expressão no seu [bg_loser.Custom('MaskFace')] foi #EMP impagável#!.\n\nAcho que talvez ainda tenha o tabuleiro em que jogamos em algum lugar. Um tabuleiro sólido, um tabuleiro de sorte, com [SCOPE.Custom('BG_GamePiecePlural')] que testemunharam um jogo tão bom como nunca antes foi visto.\n\nSem dúvida [bg_victor.GetFaith.KnowledgeGodName] já sorri para ele; seria tolice deixá-lo desaparecer."
 board_games.0051.t:0 "Um golpe de sorte"
 board_games.0102.a:0 "Jogo normal, por favor."
 board_games.0102.b:0 "Inimigo só usa configurações para ganhar, por favor."
 board_games.0102.c:0 "Inimigo só usa configurações para perder por favor."
 board_games.0102.desc:0 "O BGE é todos os seus jogos de tabuleiro favoritos reunidos em um: xadrez, pachisi, hnefaffettefflelfae, tabula.\n\nQue outros jogos você gosta?\n\nPoderia ter esses outros jogos também, so que melhor!\n\n#EMP E séculos antes, e legalmente.#!\n\nDevemos chamá-los de jogos de tabuleiro... Estou entediado. Vamos aos Jogos."
 board_games.0102.t:0 "O Jogo dos Jogos"
