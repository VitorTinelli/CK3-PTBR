 board_games.0001.b.tt:0 "No [SCOPE.Custom('BG_GameType')], [martial|E] é anulado por [SCOPE.Custom('BG_CounterSkill_martial')]"
 board_games.0001.c.random.a:0 "Agora vamos ver o que pode me ajudar..."
 board_games.0001.c.random.b:0 "Matematicamente falando, o movimento correto seria..."
 board_games.0001.c.random.c:0 "[bg_myself.GetFaith.FateGodName] me ama!"
 board_games.0001.c.random.d:0 "Este é um jogo exaustivo."
