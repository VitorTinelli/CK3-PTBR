 board_games.0001.e.tt:0 "Em jogos de [SCOPE.Custom('BG_GameType')], [learning|E] é anulado por [SCOPE.Custom('BG_CounterSkill_Learning')]"
 board_games.0001.f.random.a:0 "Isto não está funcionando. Devo forçar?"
 board_games.0001.f.random.b:0 "Se você tentar mover aquela [SCOPE.Custom('BG_GamePiece')], você será derrotado."
 board_games.0001.f.random.c:0 "*esfaqueie o tabuleiro*"
 board_games.0001.f.random.d:0 "#BER Eu vou te salvar!#!"
