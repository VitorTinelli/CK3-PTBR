 char_interaction.0300.a:0 "É assim?"
 char_interaction.0300.desc:0 "Não vejo benefício em pegar s[Select_CString( secondary_actor.IsFemale, 'ua', 'eu' )] [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))], [secondary_actor.GetFirstName], como meu refém neste momento."
 char_interaction.0301.a:0 "Tol[Select_CString( recipient.IsFemale, 'a', 'o' )]."
 char_interaction.0301.desc:0 "Só posso rejeitar sua demanda imprudente de pegar m[Select_CString( secondary_recipient.IsFemale, 'inha', 'eu' )] [recipient.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetFirstName], como seu refém."
 char_interaction.0311.a:0 "Então seja assim."
 char_interaction.0311.desc:0 "Por favor, pare suas tentativas de propor uma trégua entre nós; não posso concordar com uma troca de reféns com você neste momento."
 char_interaction.0320.a:0 "[secondary_recipient.GetSheHe|U] está de volta!"
 char_interaction.0320.desc:0 "Não consegui encontrar razão para manter s[Select_CString( secondary_recipient.IsFemale, 'ua', 'eu' )] [recipient.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetFirstName], como m[Select_CString( secondary_recipient.IsFemale, 'inha', 'eu' )] refém [actor.GetPrimaryTitle.GetAdjectiveNoTooltip] por mais tempo."
 char_interaction.0320.opening:0 "[actor.Custom2('AppropriateGreetingPositive', recipient )]"
 char_interaction.0330.a:0 "Muito bem."
 char_interaction.0330.desc:0 "Ficarei feliz em pegar s[Select_CString( hostage.IsFemale, 'ua', 'eu' )] [hostage_sender.Custom2('RelationToMeShort', SCOPE.sC('hostage'))], [hostage.GetFirstName], como m[Select_CString( hostage.IsFemale, 'inha', 'eu' )] refém.\n\nAguardarei sua chegada em [hostage_taker.GetCapitalLocation.GetNameNoTooltip]."
 char_interaction.0331.a:0 "Excelente."
 char_interaction.0331.desc:0 "Não vejo escolha senão aceitar sua demanda de pegar m[Select_CString( hostage.IsFemale, 'inha', 'eu' )] [hostage_sender.Custom2('RelationToMeShort', SCOPE.sC('hostage'))], [hostage.GetFirstName], como s[Select_CString( hostage.IsFemale, 'ua', 'eu' )] refém.\n\n[hostage.GetSheHe|U] partirá para [hostage_taker.GetCapitalLocation.GetNameNoTooltip] imediatamente."
 char_interaction.0332.a:0 "Perfeito."
 char_interaction.0332.desc:0 "Devo aceitar sua proposta de trocar m[Select_CString( hostage_2.IsFemale, 'inha', 'eu' )] [hostage_sender_2.Custom2('RelationToMeShort', SCOPE.sC('hostage_2'))], [hostage_2.GetTitledFirstName], e s[Select_CString( hostage_1.IsFemale, 'ua', 'eu' )] [hostage_sender_1.Custom2('RelationToMeShort', SCOPE.sC('hostage_1'))], [hostage_1.GetTitledFirstName], como reféns."
 char_interaction.0340.a:0 "Agradeço [ROOT.Char.GetFaith.HighGodNameAlternate]."
 char_interaction.0340.desc:0 "Aceito seu pedido para devolver [Select_CString( hostage.IsFemale, 'a', 'o' )] [hostage.GetFirstNamePossessive] de s[Select_CString( hostage.IsFemale, 'ua', 'eu' )] [home_court.Custom2('RelationToMeShort', SCOPE.sC('hostage'))].\n\nConfio que isso não vai prejudicar nosso relacionamento."
