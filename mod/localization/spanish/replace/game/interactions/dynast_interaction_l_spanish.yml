 call_dynasty_member_to_war_interaction:0 "Chame um membro da dinastia para a guerra"
 call_dynasty_member_to_war_interaction_desc:0 "Chamar [recipient.GetShortUINameNoTooltip] para servir sua [dynasty|E] na guerra"
 call_dynasty_member_to_war_interaction_extra_icon:0 "$hook_extra_icon$"
 courtly_vassal_disapproves_disinheriting:0 "Cada [vassal|E] [GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName] ([actor.MakeScope.ScriptValue('number_of_courtly_vassals')|V0]) perde #N 20#! [opinion|E] de [actor.GetShortUIName] por #V 10 anos#! #weak (Desaprova deserdar herdeiros não disputados)#!"
 denounce_interaction:0 "Denunciar"
 denounce_interaction_desc:0 "$dynasty_interaction_header$[denounce|E] [recipient.GetShortUINameNoTooltip]\n\n#weak Isso dará a todos os membros da nossa [dynasty|E] uma [imprisonment_reason|E] contra [recipient.GetSheHe]#!"
 denounce_interaction_notification:0 "Membro da Dinastia denunciado"
 denounced_change_to_forgiven:0 "A #V $denounced_opinion$ Opinião#! #weak (-50)#! muda para #V $forgave_denounced_opinion$#! #weak (-25)#! (#P +25#! [opinion|E])"
 disinherit_interaction:0 "Deserdar"
 disinherit_interaction_desc:0 "$dynasty_interaction_header$Remover [recipient.GetShortUINameNoTooltip] da [line_of_succession|E]"
 disinherit_interaction_notification:0 "Membro da dinastia deserdado"
 dynast_claim_title_interaction:0 "Título de reivindicação"
 dynast_claim_title_interaction_desc:0 "$dynasty_interaction_header$[claim|EU] um [title|E] realizado por [recipient.GetShortUINameNoTooltip] você mesmo"
 dynast_claim_title_interaction_notification:0 "Título Reivindicado"
 dynast_end_dynasty_wars_interaction:0 "Fim das guerras da dinastia"
 dynast_end_dynasty_wars_interaction_desc:0 "$dynasty_interaction_header$Exija que [recipient.GetShortUINameNoTooltip] termina imediatamente todas as suas guerras ofensivas contra qualquer outro membro da nossa [dynasty|E]"
 dynast_end_dynasty_wars_interaction_notification:0 "Guerra da dinastia finalizada"
 dynast_legitimize_bastard_interaction:0 "Legitimar bastardo #weak (Dynasty)#!"
 dynast_legitimize_bastard_interaction_desc:0 "$dynasty_interaction_header$Declarar [recipient.GetShortUINameNoTooltip] ser um $game_concept_legitimized_bastard$\n\n#weak Isso está disponível porque [recipient.GetSheHe] é um [bastard|E] da minha [dynasty|E]#!"
 dynast_legitimize_bastard_interaction_notification:0 "Bastardo legitimado"
 dynasty_interaction_header:0 "[dynast_interaction|E]\n"
 forgive_interaction:0 "Perdoar"
 forgive_interaction_desc:0 "$dynasty_interaction_header$Retratar a [denouncement|E] de [recipient.GetShortUINameNoTooltip]"
 forgive_interaction_notification:0 "Perdoou membro da dinastia"
 forgiven_changed_to_denounced:0 "A #V $forgave_denounced_opinion$ Opinião#! #weak (-25)#! muda para #V $denounced_opinion$#! #weak (-50)#! (#N -25#! [opinion|E])"
 recipient_secondary_legitimize_bastard_interaction:0 "Bastardo"
 restore_inheritance_interaction:0 "Restaurar a herança"
 restore_inheritance_interaction_desc:0 "$dynasty_interaction_header$Restaurar [recipient.GetShortUINameNoTooltip] para a natural [line_of_succession|E]\n\n#weak Isso está disponível porque [recipient.GetSheHe] foi [disinherited|E]#!"
 restore_inheritance_interaction_notification:0 "Herança restaurada"
 send_to_varangian_guard_interaction:0 "Enviar para a Guarda Varangiana #weak (Dinastia)#!"
 send_to_varangian_guard_interaction_desc:0 "$dynasty_interaction_header$Enviar [recipient.GetShortUINameNoTooltip] para ganhar glória e fortuna na Guarda Varangiana. Quem sabe, pode até ajudar a construir o caráter!"
 send_to_varangian_guard_interaction_toast:0 "[recipient.GetShortUIName] partiu para a Guarda Varangiana"
 send_to_varangian_guard_interaction_toast_desc:0 "Fama e glória o aguardam!"
