l_spanish:
 DEMAND_CHURCH_SUCCESSION_NOTIFICATION:0 "[actor.GetTitledFirstName] exige que, caso [recipient.GetTitledFirstName] morra sem herdeiros, o domínio de [recipient.GetHerHis] passe para [actor.GetPrimaryTitle.GetName]."
 DEMAND_CHURCH_SUCCESSION_SEND_NAME:0 "Exigir Sucessão da Igreja"
 defied_church_succession_opinion:0 "Desafiou minha Reivindicação de Sucessão"
 demand_church_succession.0001.a:0 "Assim está escrito. Assim será."
 demand_church_succession.0001.b:0 "É melhor eu [ROOT.Char.GetMotherFather] um herdeiro, então."
 demand_church_succession.0001.c.tt:0 "Você cancela o arranjo de [fallback_heir_title|E] e fica protegido contra novas exigências de sucessão da Igreja por dez anos, mas [actor.GetTitledFirstName] não perdoará a ofensa tão cedo"
 demand_church_succession.0001.c:0 "[actor.GetTitledFirstNameNoTooltip] extrapola os limites."
 demand_church_succession.0001.desc.archbishop:0 "Da minha arquidiocese, que vigia suas terras, escrevo sobre um assunto de herança."
 demand_church_succession.0001.desc.bishop:0 "Seu pastor escreve a você sobre o assunto da herança."
 demand_church_succession.0001.desc.head_of_faith_generic:0 "Como [actor.GetTitleAsNameNoTooltip] da fé, escrevo a você sobre um assunto de herança."
 demand_church_succession.0001.desc.pope:0 "Pela graça de [actor.GetFaith.HighGodNamePossessive], Nós escrevemos a você sobre o assunto da herança."
 demand_church_succession.0001.desc.theocrat_generic:0 "Do altar de [actor.GetFaith.HighGodName], escrevo sobre um assunto de herança."
 demand_church_succession.0001.flavour.ambitious:0 "\n\nSejamos francos:"
 demand_church_succession.0001.flavour.compassionate:0 "\n\nPerdoe a necessidade, [recipient.GetTitledFirstName], mas"
 demand_church_succession.0001.flavour.deceitful:0 "\n\nSem dúvida isto o conforta:"
 demand_church_succession.0001.flavour.default:0 "\n\nDeixe-me falar claramente:"
 demand_church_succession.0001.flavour.greedy:0 "\n\n serei claro:"
 demand_church_succession.0001.flavour.zealous:0 "\n\nNão se engane:"
 demand_church_succession.0001.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 demand_church_succession.0001.recipient.childless:0 "você não tem filhos vivos. Caso [actor.GetFaith.HighGodName] não mude isso, suas terras servirão à fé."
 demand_church_succession.0001.recipient.default:0 "os anos invejam todas as promessas. Se a sua falhar, suas terras passarão para nós, para serem governadas em nome de [actor.GetFaith.HighGodNamePossessive]."
 demand_church_succession.0001.recipient.elderly_childless:0 "o berço junto à sua lareira está vazio, e sua linhagem termina com você. Os fiéis esperarão e, com o tempo, herdarão."
 demand_church_succession.0001.recipient.one_child:0 "uma única criança é tudo o que o separa do fim. Caso [actor.GetFaith.HighGodName] a leve, os fiéis estarão prontos para governar."
 demand_church_succession.0002.a:0 "A insolência não será esquecida."
 demand_church_succession.0002.desc:0 "Sua exigência foi lida e recusada. Meu domínio jamais cairá nas mãos da Igreja. Cuide do seu altar, [actor.GetTitledFirstName], e eu cuidarei das minhas terras."
 demand_church_succession.0002.opening:0 "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 demand_church_succession_actor_toast:0 "[recipient.GetTitledFirstName] está vinculado à [faith|E]"
 demand_church_succession_actor_toast_desc:0 "Caso [recipient.GetSheHe] morra sem um herdeiro, [actor.GetPrimaryTitle.GetName] herdará o domínio de [recipient.GetHerHis]."
 demand_church_succession_actor_toast_desc_puppeteer:0 "Caso [recipient.GetSheHe] morra sem um herdeiro, [puppet_or_actor.GetPrimaryTitle.GetName] herdará o domínio de [recipient.GetHerHis]."
 demand_church_succession_actor_toast_puppeteer:0 "[puppet_or_actor.GetShortUIName] vinculou [recipient.GetTitledFirstName] à [faith|E]"
 demand_church_succession_fertility_modifier:0 "Disposto a Gerar um Herdeiro"
 demand_church_succession_fertility_modifier_desc:0 "Determinado a manter seu domínio longe das mãos clericais, este personagem redobrou seus esforços no leito conjugal."
 demand_church_succession_interaction:0 "Exigir Sucessão da Igreja"
 demand_church_succession_interaction_desc:0 "Caso [recipient.GetTitledFirstName] deixe este mundo sem um herdeiro legítimo, as terras mantidas por [recipient.GetSheHe] passarão para o detentor de [actor.GetPrimaryTitle.GetName] como um [fallback_heir|E]."
 demand_church_succession_no_elective:0 "[recipient.GetTitledFirstName] possui [recipient.GetHerHis] [primary_title|E] sob uma [elective_succession|E] ou [advanced_succession|E]"
 demand_church_succession_no_existing_fallback:0 "[recipient.GetTitledFirstName] já prometeu a sucessão de [recipient.GetHerHis] a outro clérigo ou [fallback_heir|E]"
 demand_church_succession_recently_refused_tt:0 "[recipient.GetTitledFirstName] desafiou recentemente uma exigência de sucessão da Igreja e está protegido contra novas exigências semelhantes por dez anos"
 demand_church_succession_religious_head_interaction:0 "Decretar Sucessão da Igreja"
 demand_church_succession_religious_head_interaction_desc:0 "Como [head_of_faith|E] da [actor.GetFaith.GetAdjective] [faith|E], decrete que o reino de [recipient.GetTitledFirstName] passará para [actor.GetPrimaryTitle.GetName] caso [recipient.GetSheHe] morra sem herdeiro."
 demand_church_succession_target_in_reach:0 "O [realm|E] de [recipient.GetShortUINamePossessive] não faz fronteira com o [realm|E] de [actor.GetShortUINamePossessive] e não está dentro de [actor.GetShortUINamePossessive] [archdiocese|E]"
 meddling_church_opinion:0 "Interferência na minha Sucessão"
