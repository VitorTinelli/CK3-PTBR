 external_theocratic_puppet_reqs_tt:0 "[actor.GetShortUIName|U] deve:\n$EFFECT_LIST_BULLET$Ter um @weak_hook_icon![hook|E] sobre [recipient.GetShortUIName], ou um @unspent_strong_hook_icon![strong_hook|E] se [recipient.GetSheHe] for de categoria [king|E] ou superior\n$EFFECT_LIST_BULLET$Ser [recipient.GetShortUINamePossessive] [religious_superior|E] ou superior\n$EFFECT_LIST_BULLET$Ter [puppeted|E] [recipient.GetShortUIName] anteriormente\n$EFFECT_LIST_BULLET$Ser [house_head|E] de [recipient.GetShortUINamePossessive] [house|E]\n$EFFECT_LIST_BULLET$Ser [liege|E] ou superior de [recipient.GetShortUIName] e fazer [recipient.GetHerHim] [terrified_i] [cowed|E]\n$EFFECT_LIST_BULLET$Ser [friends|E], [lovers|E] ou [soulmates|E] com [recipient.GetShortUIName]\n$EFFECT_LIST_BULLET$Estar @prison_icon! [imprisoning|E] por [recipient.GetShortUIName]"
