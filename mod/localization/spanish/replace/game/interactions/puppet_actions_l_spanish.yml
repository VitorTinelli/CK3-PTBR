 request_ecclesiastical_title_split_interaction_desc:0 "Peticione seu [head_of_faith|E] para esculpir um novo [title|E] eclesiástico a partir de um [clerical_region|E] existente\n\nSe você for um [ruler|E] secular, ele é fundado em sua [capital|E] e concedido a um [holder|E] de sua escolha; se você for clero titulado, você é nomeado seu primeiro [holder|E]\n\n#weak A divisão segue as fronteiras do domínio: o novo [title|E] abrange apenas os [counties|E] dentro deste [clerical_region|E] detidos por você (ou, se você for clero, pelo seu [liege|E]), então um [realm|E] maior retira mais#!"
 request_ecclesiastical_title_split_interaction_notification:0 "Nenhum pastor isolado pode vigiar um rebanho tão amplo. Crie uma nova sé a partir destas terras, e nenhuma alma dentro delas precisará voltar a ficar sem guia."
