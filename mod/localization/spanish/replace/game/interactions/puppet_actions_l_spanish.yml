 request_ecclesiastical_title_creation_interaction_desc:0 "Peticione seu [head_of_faith|E] para estabelecer um novo [clerical_title|E] dentro de seu [realm|E]\n\nVocê escolhe o [title|E] que o abriga e seu primeiro [holder|E]\n\n#weak O novo [clerical_region|E] abrange todo [de_jure|E] [county|E] da sede do [de_jure|E] [kingdom|E] que nenhum [clerical_region|E] possui ainda#!"
