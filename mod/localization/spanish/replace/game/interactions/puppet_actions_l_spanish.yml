 pam_empire_dread_or_strong_hook_tt:0 "[actor.GetShortUIName|U] deve:\n$EFFECT_LIST_BULLET$Ter um @unspent_strong_hook_icon![strong_hook|E] sobre [recipient.GetShortUIName]\n$EFFECT_LIST_BULLET$Fazer [recipient.GetShortUIName] [terrified_i] [cowed|E]\n$EFFECT_LIST_BULLET$Ser [recipient.GetShortUINamePossessive] [head_of_faith|E] ou [challenger_hof|E]"
 pam_interactions_events.0120.a:0 "Todas as minhas preces, ó [recipient.GetTitleAsNameNoTooltip]!"
 pam_interactions_events.0120.desc:0 "Abençoado sou em meu dever, pois devo ministrar às almas tanto ao comando de [recipient.GetFaith.HighGodNamePossessive] quanto ao seu? Esforçar-me-ei para fazer tudo o que puder.\n\n"
 pam_interactions_events.0120.desc_dread:0 "Destruamos quem deve ser destruído: aqueles a quem [recipient.GetFaith.HighGodName] abandonou... assim como [recipient.GetFaith.HighGodNameSheHe|U] me abandonou.\n\n"
 pam_interactions_events.0120.desc_friendly:0 "Meu amor pelo meu [recipient.Custom2('RelationToMe', SCOPE.sC('actor'))], minha confiança absoluta, guiar-me-ão através do que está por vir.\n\n"
 pam_interactions_events.0120.desc_lunacy:0 "Pois temo que meu próprio espírito esteja morrendo... e nenhum conselho senão o seu traz qualquer conforto...\n\n"
 pam_interactions_events.0120.desc_piety:0 "Pois [recipient.GetFaith.HighGodName|U] [recipient.GetFaith.HighGodHerselfHimself|U] nos imbuiu de um propósito sagrado!\n\n"
 pam_interactions_events.0120.desc_religious_head_actor:0 "Na verdade, desde que [recipient.GetFaith.CreatorName] gerou o primeiro de [recipient.GetWomenMen], nunca conhecemos um [recipient.GetTitleAsName] do seu jaez! Conforme comanda, é meu privilégio obedecer.\n\n"
 pam_interactions_events.0120.desc_religious_head_recipient:0 "Não posso liderar os fiéis sozinho. Até mesmo o primeiro entre [recipient.GetFaith.HighGodNamePossessive] povo, o [recipient.GetTitleAsName] [recipient.GetHerselfHimself], deve curvar-se aos caminhos deste mundo. Assim, vou ajudá-lo e obedecê-lo, ó [actor.GetTitleAsName].\n\n"
 pam_interactions_events.0120.desc_skill:0 "Sob sua hábil direção... espero participar de grandes feitos.\n\n"
 pam_interactions_events.0120.opening:0 "Ao [recipient.GetFaith.GetReligion.GetAdjective] luminar [recipient.GetFirstName],"
 pam_interactions_events.0120.outro:0 "Quais de suas preces serão atendidas?"
 pam_interactions_events.0121.a:0 "[recipient.GetTitleAsNameNoTooltip|U] embora [recipient.GetSheHe] possa ser, [recipient.GetSheHe] serve a [recipient.GetHerHis] igreja."
 pam_interactions_events.0121.desc:0 "O [recipient.GetTitleAsName] de [recipient.GetPrimaryTitle.GetNameNoTier] desempenhará [recipient.GetHerHis] papel em seus jogos de poder, e o ajudará a intrometer-se neste mundo mortal.\n\n"
 pam_interactions_events.0121.desc_dread:0 "Sou uma arma colocada em sua mão. Sem dúvidas, sem escrúpulos.\n\n"
 pam_interactions_events.0121.desc_friendly:0 "Meu [recipient.Custom2('RelationToMe', SCOPE.sC('actor'))], confio plenamente em você e juro que não o falharei.\n\n"
 pam_interactions_events.0121.desc_honor:0 "Por meio desta, ponho de lado o orgulho que conheci como [recipient.GetTitleAsName] de [recipient.GetPrimaryTitle.GetNameNoTier], e apegarei-fervorosamente ao seu conselho.\n\n"
 pam_interactions_events.0121.desc_lunacy:0 "É como dizeis: minha corte é um lugar de tagarelas e mentirosos. Meus sonhos são sombrios. Apenas suas palavras fazem sentido para mim, apenas seus remédios podem curar...\n\n"
 pam_interactions_events.0121.desc_piety:0 "Livre-me de minhas dúvidas e mostre-me os caminhos pelos quais posso conquistar o amor de [recipient.GetFaith.HighGodNamePossessive]!\n\n"
 pam_interactions_events.0121.desc_skill:0 "Confio que, vigiando atentamente os assuntos do meu domínio, não permitirá que eu falhe.\n\n"
 pam_interactions_events.0121.opening:0 "Ó Respeitável [ROOT.Char.GetTitleAsName],"
 pam_interactions_events.0121.outro:0 "Vejamos seus planos."
