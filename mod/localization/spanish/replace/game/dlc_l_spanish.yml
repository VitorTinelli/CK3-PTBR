 dlc_001:0 "$DLC001_PREORDER$"
 dlc_001_desc:0 "Mergulhe no Sacro Império Romano com uma coleção de trajes para plebeus, guerreiros e governantes da Europa Central."
 dlc_002:0 "$DLC002_SP_DAY1$"
 dlc_002_desc:0 "Dê ao sua corte um visual elegante com um conjunto de trajes e opções de roupas cosméticas para o Oriente Médio e Norte da África."
 dlc_003:0 "$DLC003_FP1$"
 dlc_003_desc:0 "Ferozes saqueadores do norte frio ou uma sociedade complexa cheia de exploradores, comerciantes e poetas? Descubra a verdadeira riqueza do mundo nórdico com Crusader Kings III: Os Senhores do Norte, o primeiro pacote de sabor detalhado para o aclamado Crusader Kings III."
 dlc_004:0 "$DLC004_EP1$"
 dlc_004_desc:0 "A expansão A Corte Real para Crusader Kings III adiciona novas maneiras de interagir com os personagens em seu reino ou império, além de grandes mudanças no sistema cultural do jogo, adicionando maior dinamismo e fluidez histórica."
 dlc_005:0 "$DLC005_FP2$"
 dlc_005_desc:0 "As terras ensolaradas da Ibéria aguardam seu glorioso governo com Crusader Kings III: O Destino da Ibéria. Profundamente rica em história, cultura e pessoas, o destino medieval da península está pronto para ser moldado por sua mão majestosa, seja ela coberta de veludo conciliador ou como um punho de ferro."
 dlc_006:0 "$DLC006_BP1$"
 dlc_006_desc:0 "Cuidado, governante - pise com cuidado com aqueles que você chama de amigo ou inimigo; eles são dois lados da mesma moeda. Seus relacionamentos importam mais do que nunca, e com Crusader Kings III: Amigos & Inimigos, testemunhe aqueles mais próximos de você ganharem vida nos detalhes mais íntimos."
 dlc_007:0 "$DLC007_EP2$"
 dlc_007_desc:0 "Reescreva a história enquanto você viaja por terras medievais traiçoeiras para desfrutar da glória obtida ao sediar e participar de Grandes Torneios, Grandes Casamentos e Grandes Excursões."
 dlc_008:0 "$DLC008_SP2$"
 dlc_008_desc:0 "Vista seus governantes com o mais fino dos trajes com este pacote de roupas. Baseado nas vestimentas e insígnias do Imperador Henrique II e da Imperatriz Cunegunda, este pacote inclui não apenas novas túnicas e vestidos, mas também coroas historicamente adequadas e outros itens. Exclusivamente disponível para proprietários do Capítulo II."
 dlc_009:0 "$DLC009_BP2$"
 dlc_009_desc:0 "Em Filhos e Guardiões, governantes jovens e seus tutores estão no centro das atenções. Crie príncipes e nobres jovens em um mundo onde a glória eterna está a uma batalha de distância e o perigo espreita em cada sombra."
 dlc_010:0 "$DLC010_FP3$"
 dlc_010_desc:0 "O Império Sassânida já se foi, e o Califado Abássida está pressionando as dinastias iranianas remanescentes para se renderem. Você vai se alinhar, ou forjar um novo Império? O futuro da Pérsia está em suas mãos!"
 dlc_011:0 "$DLC011_CE1$"
 dlc_011_desc:0 "A palavra de suas façanhas se espalha longe e amplamente: escreva-se nos anais da história e construa monumentos para a sua própria glória! Tecere a rica tapeçaria de sua lenda e crie as histórias que serão cantadas sobre você por toda a vida."
 dlc_012:0 "$DLC012_CP1$"
 dlc_012_desc:0 "Este pacote de roupas para culturas norte-africanas inclui novos itens para os personagens usarem, incluindo tops, leggings, capas, acessórios para a cabeça e muito mais, com novos designs e padrões. 'Vestimentas Norte-Africanas' é o primeiro feito em cooperação e dirigido por um criador da comunidade."
 dlc_013:0 "$DLC013_SP3$"
 dlc_013_desc:0 "Inspirado nas modas da corte francesa na Alta Idade Média, este pacote cosmético traz novos estilos e padrões para o Crusader Kings III. Vista-se com novos mantos, novos tipos de acessórios para a cabeça, estilos de barba e cabelo - tudo para combinar com suas roupas luxuosas e régias. Exclusivamente disponível para proprietários do Capítulo III."
 dlc_014:0 "$DLC014_EP3$"
 dlc_014_desc:0 "Lidere uma família nobre em um império antigo, usando influência e intriga para garantir seu lugar, ou seja um mercenário errante, construindo uma reputação como solucionador de problemas ou fora da lei. Novos eventos, sistemas de governo, esquemas e estilos de vida estão à sua disposição para explorar em Estradas para o Poder."
 dlc_015:0 "$DLC015_BP3$"
 dlc_015_desc:0 "Traz novos conteúdos para vários sistemas queridos: viagens, atividades e estilos de vida. Envie seu governante em emocionantes jornadas, seja em busca de riqueza, prestígio ou crescimento pessoal. Não os deixe ficar ociosos — a aventura aguarda a cada esquina!"
 dlc_016:0 "$DLC016_CP2$"
 dlc_016_desc:0 "Este Pacote de Criador de Conteúdo é inspirado nas vestimentas eslavas ocidentais na Idade Média. Inclui novas roupas, vestuário, chapéus grandiosos e uma variedade de padrões para escolher."
 dlc_017:0 "$DLC017_CP3$"
 dlc_017_desc:0 "Descubra as grandes conquistas arquitetônicas da Idade Média com o Pacote de Criador de Conteúdo Monumentos Medievais.\n\nCriado em colaboração com o renomado modder de Crusader Kings III PiGu, Monumentos Medievais traz 20 novos monumentos variados e culturalmente significativos para o jogo."
 dlc_018:0 "$DLC018_CP4$"
 dlc_018_desc:0 "Enfrente o frio das terras do norte com estilo com o Pacote de Criador de Conteúdo Traje Ártico, feito em colaboração com o renomado modder de Crusader Kings III Aj. Trajes Árticos adiciona cosméticos inspirados nas estéticas Sami e Khanty."
 dlc_019:0 "$DLC019_SP4$"
 dlc_019_desc:0 "Imponha um toque régio ao seu reinado com Coroas do Mundo, uma coleção real de opções cosméticas para melhorar a aparência do seu governante. Disponível exclusivamente para os proprietários do Capítulo IV."
 dlc_020:0 "$DLC020_CE2$"
 dlc_020_desc:0 "Governe ou Seja Governado. Migre ou Pereça. Em Cãs das Estepes, apenas os mais fortes sobreviverão às duras realidades da vida nas Estepes. Você se erguerá à grandeza, esculpindo um legado de conquista, ou seu povo desaparecerá nos anais da história? A escolha é sua."
 dlc_021:0 "$DLC021_BP4$"
 dlc_021_desc:0 "Comece seu reinado com majestade! Legitime seu poder por meio de cerimônias impressionantes que conquistam o respeito de vassalos e rivais. Desde o primeiro toque da coroa, seu legado é forjado em grandeza com as Coroações."
 dlc_022:0 "$DLC022_EP4$"
 dlc_022_desc:0 "Com Todo o Céu, a vasta e dinâmica história da Ásia Oriental ganha vida. Reivindique o Mandato, una seu povo e molde o futuro dos impérios nesta expansão monumental!"
 dlc_023:0 "$DLC023_CP5$"
 dlc_023_desc:0 "Prepare-se para a batalha com novos e elegantes equipamentos em Trajes de Guerra da Alta Idade Média. Este Creator Pack do modder JedNick inclui uma ampla variedade de elmos, capacetes e armaduras da Europa Ocidental do Período da Alta Idade Média."
 dlc_024:0 "$DLC024_CP6$"
 dlc_024_desc:0 "Adicione maior variedade e detalhe histórico ao seu mapa com Edifícios Sagrados. Este Creator Pack do modder Kefir úr inclui novos modelos 3D para edifícios religiosos: de igrejas humildes a monumentos magníficos, Edifícios Sagrados traz ainda mais diversidade regional e religiosa para o seu jogo!"
 dlc_025:0 "$DLC025_CP7$"
 dlc_025_desc:0 "Descubra as vestimentas, armaduras e assentamentos distintos do Pacífico Norte, inspirados nas culturas Ainu, Nivkh e Emishi."
 dlc_026:0 "$DLC026_CP8$"
 dlc_026_desc:0 "Aprimore o mapa-múndi com construções monumentais e locais sagrados inspirados nas maravilhas arquitetônicas do Leste Asiático."
 dlc_027:0 "$DLC027_CP9$"
 dlc_027_desc:0 "Adorne seus governantes com trajes refinados e vestimentas cerimoniais inspiradas no esplendor das cortes imperiais."
 dlc_028:0 "$DLC028_SP5$"
 dlc_028_desc:0 "Símbolos de Autoridade inclui sete novos penteados e adornos reais para a cabeça, inspirados em modelos históricos, para acentuar a majestade de seus personagens."
 dlc_029:0 "$DLC029_MP1$"
 dlc_029_desc:0 "Canções do Reino possui 13 faixas para acompanhar seu governo, desde melodias cortesãs pacíficas até temas de batalha empolgantes. Clássicos remasterizados de Crusader Kings tocam ao lado de novos arranjos de danças folclóricas europeias, tornando este Pacote Musical a trilha sonora perfeita para sua ambição dinástica."
 dlc_030:0 "$DLC030_CE3$"
 dlc_030_desc:0 "Nnavegue por uma era medieval com uma vida religiosa rica em Apenas por Deus, uma Expansão Principal para Crusader Kings III. Lute contra o pecado enquanto seus governantes tentam viver de acordo com os princípios de sua fé, enquanto você lida com autoridades da igreja que têm poder na terra e no céu. Instigue ou resolva debates religiosos, negocie os limites da coroa e da autoridade papal, e pondere sobre a vida após a morte."
 subscription_active:0 "Assinatura Ativa"
 subscription_available:0 "Assinatura Disponível"
