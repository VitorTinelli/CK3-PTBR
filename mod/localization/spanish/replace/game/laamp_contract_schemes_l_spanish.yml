 laamp_base_contract_schemes.2044.tt.destination_list.3_destinations:0 "Você imediatamente começa [traveling|E] para [destination_1.GetNameNoTier], depois [destination_2.GetNameNoTier], e finalmente [destination_3.GetNameNoTier]"
 laamp_base_contract_schemes.2044.tt.destination_list.4_destinations:0 "Você imediatamente começa [traveling|E] para [destination_1.GetNameNoTier], depois [destination_2.GetNameNoTier], depois [destination_3.GetNameNoTier], e finalmente [destination_4.GetNameNoTier]"
 laamp_base_contract_schemes.2044.tt.destination_list.5_destinations:0 "Você imediatamente começa [traveling|E] para [destination_1.GetNameNoTier], depois [destination_2.GetNameNoTier], depois [destination_3.GetNameNoTier], depois [destination_4.GetNameNoTier], e finalmente [destination_5.GetNameNoTier]"
 laamp_base_contract_schemes.2044.tt.destination_list.6_destinations:0 "Você imediatamente começa [traveling|E] para [destination_1.GetNameNoTier], depois [destination_2.GetNameNoTier], depois [destination_3.GetNameNoTier], depois [destination_4.GetNameNoTier], depois [destination_5.GetNameNoTier], e finalmente [destination_6.GetNameNoTier]"
 laamp_base_contract_schemes.2044.tt.explanation:0 "#TUT Para completar o [task_contract|E]:\n$EFFECT_LIST_BULLET$Complete um desafio de [stewardship|E], [intrigue|E], ou [aptitude|E] de [GetCourtPositionType('master_bard_camp_officer').GetName()] em cada destino\n$EFFECT_LIST_BULLET$Ganhe um terço dos seus desafios para um $label_success_qualified$\n$EFFECT_LIST_BULLET$Ganhe dois terços dos seus desafios para um sucesso comum\n$EFFECT_LIST_BULLET$Ganhe todos os seus desafios para um $label_success_critical$\n$EFFECT_LIST_BULLET$@warning_icon! #N Falhar #BOL dois#! ou mais desafios em qualquer momento falha o $game_concept_task_contract$#!\n$EFFECT_LIST_BULLET$@alert_icon! #alert_trial Cada desafio completado com sucesso aumenta ligeiramente a dificuldade de todos os testes subsequentes — mais ainda para o [skill|E] ou $game_concept_aptitude$ testado#!#!"
 laamp_base_contract_schemes.2301.a.tt:0 "Você imediatamente inspeciona as propriedades de [person_a.GetFirstNamePossessive]"
 laamp_base_contract_schemes.2301.a:0 "Começarei com você, [person_a.GetFirstNameNoTooltip]."
 laamp_base_contract_schemes.2301.b.tt:0 "Você imediatamente inspeciona as propriedades de [person_b.GetFirstNamePossessive]"
 laamp_base_contract_schemes.2301.b:0 "Talvez os negócios de [person_b.GetFirstNamePossessiveNoTooltip] para começar?"
 laamp_base_contract_schemes.2301.c.tt:0 "Você imediatamente inspeciona as propriedades de [person_c.GetFirstNamePossessive]"
 laamp_base_contract_schemes.2301.c:0 "Vamos inspecionar [person_c.GetFirstNameNoTooltip] primeiro."
 laamp_base_contract_schemes.2301.d.tt:0 "Você imediatamente inspeciona as propriedades de [person_d.GetFirstNamePossessive]"
 laamp_base_contract_schemes.2301.d:0 "[person_d.GetFirstNameNoTooltip], por favor, lidera o caminho."
 laamp_base_contract_schemes.2301.desc.intro.has_quartermaster:0 "Meu [GetCourtPositionType('quartermaster_camp_officer').GetName()] [quartermaster.GetFirstName] balança atrás de mim, alerta e pronto para ajudar."
 laamp_base_contract_schemes.2301.desc.intro:0 "\"[ROOT.Char.GetTitledFirstNameNoTooltip], bem-vindo!\" grita [person_a.GetTitledFirstName] enquanto meu grupo e eu entramos na cidade [person_a.GetHerHim]."
 laamp_base_contract_schemes.2301.desc.liar.honest_or_good:0 "quando dizemos que simplesmente não podemos arcar com os impostos extras que [Select_CString( person_a.IsFemale, 'nossa senhora', 'nosso senhor' )] [person_a.GetTitledFirstName] imporia,\" murmura [person_a.GetFirstNameNoTooltip].\n\nA entrega [person_a.GetHerHim|U] é suave e uniforme. A palavra de um[Select_CString( person_a.IsFemale, 'a', '' )] [person_a.GetWomanMan] honest[Select_CString( person_a.IsFemale, 'a', 'o' )] ou de [Select_CString( person_a.IsFemale, 'uma mentirosa', 'um mentiroso' )] muito consumad[Select_CString( person_a.IsFemale, 'a', 'o' )]."
 laamp_base_contract_schemes.2301.desc.liar.not_lying:0 "quando protestamos contra esse imposto injusto. Somos apenas simples cidadãos, e já entregamos tudo o que podemos a [employer.GetTitledFirstName].\"\n\nTalvez seja verdade, talvez não. Logo saberemos."
 laamp_base_contract_schemes.2301.desc.liar.other_liars_lying:0 "$laamp_base_contract_schemes.2301.desc.liar.not_lying$"
 laamp_base_contract_schemes.2301.desc.liar.poor_liar_lying:0 "q-quando dizemos que simplesmente n-não poderíamos, não, #EMP não poderíamos#!, esconder nada de [employer.GetTitledFirstName]!\" gagueja [person_a.GetFirstNameNoTooltip]."
 laamp_base_contract_schemes.2301.desc.midtro:0 "\n\nEm pouco tempo, sou apresentado aos outros magnatas da cidade — [person_b.GetFirstName], [person_c.GetFirstName] e [person_d.GetFirstName].\n\n\"Estamos #EMP certos#! de que você concordará conosco"
 laamp_base_contract_schemes.2301.t:0 "$laamp_base_contract_schemes.2004.t$: Portões da Cidade"
 laamp_base_contract_schemes.2311.a:0 "Olhe os registros financeiros [char_current.GetHerHim]."
 laamp_base_contract_schemes.2311.b:0 "Tente pegar [char_current.GetSheHe] em uma mentira."
 laamp_base_contract_schemes.2311.c:0 "Procure sinais reveladores de delitos."
 laamp_base_contract_schemes.2311.d:0 "Revise tudo em detalhes exaustivos."
 laamp_base_contract_schemes.2311.desc.business.armory:0 "[char_current.GetFirstName] nos leva à fonte da riqueza [char_current.GetHerHim]: um arsenal bem abastecido — com uma forja anexada — que fornece armas e munições para a milícia e as caravanas que passam."
 laamp_base_contract_schemes.2311.desc.business.bath_house:0 "Um local de luxo, [char_current.GetFirstName] administra um próspero banho dentro dos muros de [destination_1.GetBaseNameNoTierPossessive]. Não há tolo vivo que não possa apreciar um bom banho, lavando a poeira e a sujeira do mundo moderno, e algumas moedas pelo privilégio valem bem o custo."
 laamp_base_contract_schemes.2311.desc.business.bp1_kitchen_western:0 "O negócio de [char_current.GetFirstNamePossessive] gira em torno do armazenamento e fornecimento de alimentos, tanto exóticos quanto em grande quantidade. Os camponeses obtêm cereais baratos em tempos de necessidade, a elite local tem alguém a quem recorrer para obter alimentos da capital distante."
 laamp_base_contract_schemes.2311.desc.business.council_chamber:0 "Os quartos de [char_current.GetFirstNamePossessive] como [char_current.GetTitleAsNameNoTooltip] da cidade são surpreendentemente extensos. [char_current.GetSheHe|U] me leva a uma sala que claramente serve para conferências das pessoas mais importantes da colônia, me acomodando na cabeceira da mesa."
 laamp_base_contract_schemes.2311.desc.business.docks:0 "O dinheiro de [char_current.GetFirstNamePossessive] claramente vem dos docks da cidade, onde [char_current.GetSheHe] mantém um pequeno escritório bem equipado com vista para os cais mais movimentados. Um par de amplas janelas permite que [char_current.GetSheHe] se incline para fora e grite com os estivadores preguiçosos de tempos em tempos."
 laamp_base_contract_schemes.2311.desc.business.dungeon:0 "Parece que [char_current.GetFirstName] controla uma pequena prisão, ganhando sua riqueza mantendo devedores, vagabundos e criminosos trancafiados em nome de outros. Uma quantia considerável em impostos e multas dos confinados complementa a operação."
 laamp_base_contract_schemes.2311.desc.business.market:0 "[char_current.GetFirstName] administra a praça principal do mercado de [destination_1.GetBaseNameNoTierPossessive], um empreendimento simples, mas lucrativo. [char_current.GetSheHe|U] gerencia os espaços dos estandes, cobra impostos, coleta impostos para [person_a.GetTitleAsNameNoTooltip] e todas as outras trappings esperadas."
 laamp_base_contract_schemes.2311.desc.business.physicians_study:0 "Os negócios de [char_current.GetFirstNamePossessive] parecem estar fortemente ligados a medicamentos, cura e à prestação de boas parteiras. Uma ocupação incomum para um magnata, mas certamente uma com ampla demanda."
 laamp_base_contract_schemes.2311.desc.business.study:0 "A comunidade acadêmica em [destination_1.GetBaseNameNoTier] é pequena, mas tenaz. A maioria dos escribas locais parece trabalhar para [char_current.GetFirstName] de alguma forma, que mantém um negócio organizado com seu quase monopólio sobre cartas na cidade."
 laamp_base_contract_schemes.2311.desc.business.tavern:0 "Como muitos outros, a receita de [char_current.GetFirstNamePossessive] vem diretamente das mãos sedentas dos humildes trabalhadores de [destination_1.GetBaseNameNoTier]. Boa comida para viajantes, música para os locais e uma atmosfera convivial fazem de um estabelecimento lucrativo."
 laamp_base_contract_schemes.2311.desc.business.temple:0 "[char_current.GetFirstName] parece obter a maior parte de sua riqueza alugando albergues para os que visitam um santuário local e operando uma pequena caridade — ficando com apenas uma fração para [char_current.GetHerselfHimself], é claro."
 laamp_base_contract_schemes.2311.desc.loot.courtier_opinion:0 "[char_current.GetSheHe|U] fala enquanto caminhamos, e não posso deixar de notar que passamos por um depósito cheio de luxos..."
 laamp_base_contract_schemes.2311.desc.loot.gold:0 "Enquanto [char_current.GetSheHe] fala, minha mente se volta para um grande baú do que parecia ser prata que passamos no caminho para dentro..."
 laamp_base_contract_schemes.2311.desc.loot.piety:0 "[char_current.GetSheHe|U] continua a tagarelar, mas não consigo deixar de notar que passamos por um nicho repleto de artigos preciosos de fé..."
 laamp_base_contract_schemes.2311.desc.loot.provisions:0 "[char_current.GetSheHe|U] continua conversando, mas não consigo esquecer a cozinha bem abastecida pela qual passamos para chegar aqui..."
 laamp_base_contract_schemes.2311.desc.personality.ai_boldness:0 "\"Eu me considero um[Select_CString( char_current.IsFemale, 'a', '' )] [char_current.GetWomanMan] pragmática, falo de forma clara e espero que os outros falem da mesma forma comigo. O #EMP imposto#! de [employer.GetTitleAsNamePossessive] é injusto e não podemos pagá-lo. É tudo o que há para isso.\""
 laamp_base_contract_schemes.2311.desc.personality.ai_compassion:0 "\"Você parece um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] razoável, [ROOT.Char.GetTitledFirstNameNoTooltip]. Por favor, entenda que estamos fazendo o nosso melhor aqui, mas estamos sempre a um ano ruim de problemas, até mesmo de fome.\""
 laamp_base_contract_schemes.2311.desc.personality.ai_energy:0 "\"Sou um[Select_CString( char_current.IsFemale, 'a', '' )] [char_current.GetWomanMan] ocupad[Select_CString( char_current.IsFemale, 'a', 'o' )], você é um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] ocupad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], então serei direto. Se tivéssemos o dinheiro, pagaríamos de bom grado, mas não temos, então não pagaremos. Isso é suficiente, sim?\""
 laamp_base_contract_schemes.2311.desc.personality.ai_greed:0 "\"Eu faço a minha parte justa? Sim, é claro. Mas é isso, é a minha parte. Eu pago os impostos que sou obrigado a pagar, mas isso não é um imposto adequado, é apenas uma capricho sem sentido do [employer.GetTitleAsName] e todos sabemos disso.\""
 laamp_base_contract_schemes.2311.desc.personality.ai_honor:0 "\"Como você pode ver, minhas propriedades são bem-sucedidas, mas de forma alguma extensas. Fazemos um bom trabalho honesto aqui, mas não podemos arcar com um aumento tão acentuado na taxa de [employer.GetTitleAsNamePossessive].\""
 laamp_base_contract_schemes.2311.desc.personality.ai_personality_fallback:0 "\"Então... como vamos lidar com isso? Eu não mantenho um controle de tudo, você sabe. Isso seria proibitivamente caro. Muito disso são apertos de mão, contratos mantidos em outro lugar, sabe como é...\""
 laamp_base_contract_schemes.2311.desc.personality.ai_rationality:0 "\"Eu sei, eu sei, parece que estamos indo bem, mas esta não é a primeira #EMP obrigação#! extra que o [employer.GetTitleAsName] nos impôs este ano, e suspeito que não será a última. Você deve entender nossa relutância.\""
 laamp_base_contract_schemes.2311.desc.personality.ai_sociability:0 "\"Veja, vamos deixar toda essa feia situação para trás e tomar um drink. Por que não ficar um pouco? Raramente recebemos visitantes tão interessantes em nossa pequena cidade, tenho certeza de que você não precisaria reabastecer seu copo por pelo menos uma semana.\""
 laamp_base_contract_schemes.2311.desc.personality.ai_vengefulness:0 "\"Gosto de jogar de forma justa, [ROOT.Char.GetTitledFirstNameNoTooltip], tanto nos negócios, com meus inferiores, quanto com meus superiores. Mas a justiça só é garantida se todos participam dela, caso contrário, bem, é assim que algumas pessoas adquirem má vontade.\""
 laamp_base_contract_schemes.2311.desc.personality.ai_zeal:0 "\"Fazemos um trabalho [char_current.GetFaith.HealthGodNamePossessive] aqui, [ROOT.Char.GetTitledFirstNameNoTooltip], sem erro. Outro dízimo nos paralisaria, isso deve ser óbvio o suficiente.\""
 laamp_base_contract_schemes.2311.desc.personality.mayor:0 "\"Honorável [ROOT.Char.GetTitleAsNameNoTooltip], com certeza você deve ver que a avareza de [employer.GetTitleAsNamePossessive] é... mal direcionada. [employer.GetSheHe|U] confiou a você sua autoridade. Ajude-nos nesta questão, e faremos com que o mundo conheça sua generosidade.\""
 laamp_base_contract_schemes.2311.diplomacy.tt.failure:0 "Cada palavra consistente"
 laamp_base_contract_schemes.2311.diplomacy.tt.success:0 "Um erro tolo da parte [char_current.GetHerHim]"
 laamp_base_contract_schemes.2311.e.courtier_opinion:0 "Aquelas finuras — estou levando-as para #EMP inspeção#!."
 laamp_base_contract_schemes.2311.e.gold:0 "Aquela moeda — estou confiscando-a por #EMP suspeita#!."
 laamp_base_contract_schemes.2311.e.piety:0 "Aqueles talismãs — estou #EMP confiscando#! eles."
 laamp_base_contract_schemes.2311.e.provisions:0 "Aquelas provisões — estou levando-as como garantia."
 laamp_base_contract_schemes.2311.f.quartermaster_dnae_exist:0 "Se ao menos eu tivesse trazido um $quartermaster_camp_officer$..."
 laamp_base_contract_schemes.2311.f.quartermaster_exists:0 "[quartermaster.GetFirstNameNoTooltip|U], comece sua investigação."
 laamp_base_contract_schemes.2311.intrigue.tt.failure:0 "Mais inteligente do que você por metade"
 laamp_base_contract_schemes.2311.intrigue.tt.success:0 "Não é tão inteligente quanto [char_current.GetSheHe] pensa que é"
 laamp_base_contract_schemes.2311.learning.tt.failure:0 "Você olha em todo lugar, mas não encontra nada"
 laamp_base_contract_schemes.2311.learning.tt.success:0 "Você sabe onde olhar"
 laamp_base_contract_schemes.2311.stewardship.tt.failure:0 "Confuso e sem valor"
 laamp_base_contract_schemes.2311.stewardship.tt.success:0 "Você encontra o que procura"
 laamp_base_contract_schemes.2311.t:0 "$laamp_base_contract_schemes.2004.t$: [char_current.GetFirstNameNoTooltip]"
 laamp_base_contract_schemes.2311.tt.chars_checked:0 "#TUT Você investigou [task_contract.MakeScope.Var('chars_checked').GetValue|0] [characters|E] de um total possível de 4#!"
 laamp_base_contract_schemes.2311.tt.current_clues:0 "#TUT Você coletou [task_contract.MakeScope.Var('clues_gathered').GetValue|0] peças de evidência de um total possível de 4#!"
 laamp_base_contract_schemes.2311.tt.failure_gives_no_score:0 "Nenhuma peça de evidência adquirida"
 laamp_base_contract_schemes.2311.tt.success_increases_score:0 "Você ganha #P +1#! peça de evidência"
 laamp_base_contract_schemes.2312.a:0 "[person_a.GetFirstNameNoTooltip] é o próximo."
 laamp_base_contract_schemes.2312.b:0 "Avante, para as propriedades de [person_b.GetFirstNamePossessiveNoTooltip]."
 laamp_base_contract_schemes.2312.c:0 "Ainda temos [person_c.GetFirstNameNoTooltip]..."
 laamp_base_contract_schemes.2312.d:0 "Veremos se [person_d.GetFirstNameNoTooltip] está escondendo algo."
 laamp_base_contract_schemes.2312.desc.method.diplomacy:0 "Nossa conversa dura bem mais de uma hora, revisitando cada pequeno detalhe remoto dos negócios de [char_current.GetTitledFirstNamePossessive] em [destination_1.GetBaseNameNoTier], onde aconteceram, com quem estavam, quanto foi ganho e assim por diante."
 laamp_base_contract_schemes.2312.desc.method.intrigue:0 "Levo a conversa por todos os caminhos habituais, garantindo que deixamos pausas suficientes e pensamentos inconclusivos para dar a [char_current.GetTitledFirstName] bastante oportunidade de cometer erros."
 laamp_base_contract_schemes.2312.desc.method.learning:0 "Conversamos por aquilo que #EMP parece#! a melhor parte do dia, discutindo todos os aspectos possíveis dos negócios de [char_current.GetTitledFirstNamePossessive] em [destination_1.GetBaseNameNoTier]. Nenhuma pedra deixada sobre a outra, nenhuma pergunta deixada sem resposta."
 laamp_base_contract_schemes.2312.desc.method.quartermaster:0 "Com [quartermaster.GetFirstName] liderando a entrevista, [char_current.GetTitledFirstName] se senta para responder a um bombardeio aparentemente sem fim de perguntas. A princípio pacientemente, depois cada vez menos conforme o tempo passa."
 laamp_base_contract_schemes.2312.desc.method.stewardship:0 "Analisamos minuciosamente as notas [Select_CString( char_current.IsFemale, 'da', 'do' )] [char_current.GetTitledFirstName], recibos e as testemunhas que [char_current.GetSheHe] consegue reunir rapidamente relacionadas aos negócios [char_current.GetHerHim] em grande detalhe."
 laamp_base_contract_schemes.2312.desc.method.thief.courtier_opinion:0 "[char_current.GetTitledFirstName|U] se mostra nada feliz com minha #EMP aquisição#!, mas esse é o problema [char_current.GetHerHim]: meus gratos seguidores, sem dúvida, não devolverão suas novas luxúrias facilmente."
 laamp_base_contract_schemes.2312.desc.method.thief.gold:0 "Claro, [char_current.GetTitledFirstName] reclama e se agita sobre sua prata perdida, mas uma vez que meus seguidores a garantem, não há muito que [char_current.GetSheHe] possa fazer."
 laamp_base_contract_schemes.2312.desc.method.thief.piety:0 "[char_current.GetTitledFirstName|U] pode reclamar e tagarelar o quanto quiser sobre as maldições de [char_current.GetFaith.FateGodName] sobre os ladrões e tal, mas acho que sei quem está mais próximo da santidade agora."
 laamp_base_contract_schemes.2312.desc.method.thief.provisions:0 "[char_current.GetTitledFirstName|U] nos ataca verbalmente, lança alguns insultos, mas acaba se mostrando sábio o suficiente para não se meter entre um bando faminto de [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] e sua refeição recém-adquirida."
 laamp_base_contract_schemes.2312.desc.result.failure:0 "Apesar de nossas melhores tentativas, [char_current.GetSheHe] parece completamente além de reprovação — uma atitude da qual [char_current.GetSheHe] está absolutamente muito satisfeito."
 laamp_base_contract_schemes.2312.desc.result.ignored:0 "Um pássaro na mão vale mais que dois voando, e os ganhos provavelmente mal adquiridos dest[Select_CString( char_current.IsFemale, 'a', 'e' )] [char_current.GetWomanMan] estão tão confortavelmente em minha mão — mesmo que tomá-los tenha cortado nossa capacidade de investigar [char_current.GetSheHe]."
 laamp_base_contract_schemes.2312.desc.result.outro.all_done:0 "E com isso, seguimos todas as pistas que temos. Só há uma coisa a fazer."
 laamp_base_contract_schemes.2312.desc.result.outro.failure:0 "Esperamos fazer melhor no próximo."
 laamp_base_contract_schemes.2312.desc.result.outro.ignored:0 "Que o próximo seja tão lucrativo."
 laamp_base_contract_schemes.2312.desc.result.outro.success:0 "Que nossa sorte se mantenha para o próximo."
 laamp_base_contract_schemes.2312.desc.result.success:0 "Não leva muito esforço para arrancar a verdade [char_current.GetHerHim] — algo que [char_current.GetSheHe] parece estar surpreendentemente ciente."
 laamp_base_contract_schemes.2312.e:0 "Eu tomei minha decisão."
 laamp_base_contract_schemes.2312.t.failure:0 "$laamp_base_contract_schemes.2004.t$: Falha!"
 laamp_base_contract_schemes.2312.t.ignored:0 "$laamp_base_contract_schemes.2004.t$: Tarefa Ignorada"
 laamp_base_contract_schemes.2312.t.success:0 "$laamp_base_contract_schemes.2004.t$: Sucesso!"
 laamp_base_contract_schemes.2312.tt.boilerplate.continue_investigation:0 "Você continua coletando peças de evidência"
 laamp_base_contract_schemes.2312.tt.boilerplate.end_investigation:0 "Você decide qual será seu veredicto final"
 laamp_base_contract_schemes.2321.a.tt.failure_standard:0 "Se você não tiver evidência e os locais se levantarem"
 laamp_base_contract_schemes.2321.a.tt.success_qualified:0 "Se você não tiver evidência, mas os locais recuarem"
 laamp_base_contract_schemes.2321.a.tt.success_standard:0 "Se você coletou peças suficientes de evidência"
 laamp_base_contract_schemes.2321.a.tt:0 "Você decide a favor de [employer.GetTitledFirstName], contra [person_a.GetTitledFirstName]"
 laamp_base_contract_schemes.2321.a:0 "Você pagará na íntegra."
 laamp_base_contract_schemes.2321.b.tt:0 "Você decide a favor de [employer.GetTitledFirstName], mas alivia a carga tributária sobre [person_a.GetTitledFirstName] mesmo assim."
 laamp_base_contract_schemes.2321.b:0 "Você pagará — metade."
 laamp_base_contract_schemes.2321.c.tt:0 "Você decide a favor de [person_a.GetTitledFirstName], contra [employer.GetTitledFirstName]."
 laamp_base_contract_schemes.2321.c:0 "Claramente [destination_1.GetBaseNameNoTierNoTooltip] realmente não pode arcar com isso."
 laamp_base_contract_schemes.2321.desc.clues_gathered.four:0 "e minhas investigações mostram que isso é inteiramente verdade."
 laamp_base_contract_schemes.2321.desc.clues_gathered.one_or_less:0 "mas não tenho evidências para provar isso."
 laamp_base_contract_schemes.2321.desc.clues_gathered.two_to_three:0 "e minhas investigações confirmaram isso em grande parte."
 laamp_base_contract_schemes.2321.desc.intro:0 "Nos reunimos nas câmaras de [person_a.GetTitledFirstNamePossessive], um lugar suficientemente dramático para proferir meu veredicto. Com a palavra do [employer.GetTitleAsNamePossessive] ao meu lado, isso será vinculativo. De uma forma ou de outra.\n\n[person_b.GetFirstName], [person_c.GetFirstName] e [person_d.GetFirstName] aguardam a pronunciação de seu destino com a respiração suspensa, enquanto [person_a.GetFirstNameNoTooltip] parece nervoso pela primeira vez desde minha chegada.\n\nMeu instinto me diz que"
 laamp_base_contract_schemes.2321.desc.tax_status.has_cash:0 "eles poderiam pagar, simplesmente não querem,"
 laamp_base_contract_schemes.2321.desc.tax_status.no_cash:0 "eles realmente não têm moeda para pagar,"
 laamp_base_contract_schemes.2321.desc.tax_status.partial_cash:0 "eles poderiam provavelmente pagar pelo menos alguma parte disso,"
 laamp_base_contract_schemes.2321.t:0 "$laamp_base_contract_schemes.2004.t$: Proclamação"
 laamp_base_contract_schemes.2321.tt.clue_total.exceptional_achievable:0 "Tendo coletado todas as peças possíveis de evidência, sua investigação foi detalhada o suficiente para forçar um $label_success_critical$ se você os obrigar a pagar."
 laamp_base_contract_schemes.2321.tt.clue_total.failure_possible:0 "Como você coletou peças insuficientes de evidência, sua investigação superficial pode levar à resistência dos locais se você os obrigar a pagar o valor total."
 laamp_base_contract_schemes.2321.tt.clue_total.normal_achievable:0 "Com peças suficientes de evidência coletadas, sua investigação provavelmente concluirá com um $label_success_standard$ se você os obrigar a pagar o valor total."
 laamp_base_contract_schemes.2322.a:0 "[employer.GetTitledFirstNameNoTooltip] ficará extasiado!"
 laamp_base_contract_schemes.2322.b:0 "Desempenhei bem minhas funções."
 laamp_base_contract_schemes.2322.c:0 "Bem, isso foi fácil o suficiente."
 laamp_base_contract_schemes.2322.d.tt.failure:0 "Um massacre ocorre."
 laamp_base_contract_schemes.2322.d.tt.need_troops:0 "Você precisa de pelo menos #V 500#! tropas disponíveis para conter o motim."
 laamp_base_contract_schemes.2322.d.tt.success:0 "Suas tropas na cidade contêm o motim."
 laamp_base_contract_schemes.2322.d:0 "Ignorantes, às armas!"
 laamp_base_contract_schemes.2322.desc.success_critical:0 "Com minha investigação tendo sido inegavelmente minuciosa, nem [person_a.GetTitledFirstName] nem qualquer um de seus capangas pode contestar seus resultados.\n\nMesmo que esses resultados #EMP favoreçam inteiramente#! o que [employer.GetTitledFirstName] achar conveniente o suficiente para jogar como um bônus."
 laamp_base_contract_schemes.2322.desc.success_qualified_insufficient_evidence:0 "Por um breve e tenso momento, parece que [person_a.GetFirstNameNoTooltip] e seus capangas pretendem protestar minha declaração — com força se necessário — mas quando ninguém toma a dianteira, o momento passa.\n\n'Muito... bem... você pode avisar ao [employer.GetTitleAsName] que o #EMP 'imposto'#! será pago. Não iremos resistir mais. Queiramos que você não esteja aqui para ver as consequências sobre nós no próximo ano.'"
 laamp_base_contract_schemes.2322.desc.success_standard:0 "Eu tenho evidência suficiente do meu lado para formar um caso convincente de que os locais #EMP podem#! pagar sua conta mais recente, e enquanto eu expô-la, os suspiros derrotados e cansados de todo lado me dizem que o [person_a.GetTitleAsNameNoTooltip] e seus companheiros sabem disso.\n\n'Pare, pare, por favor', acena [person_a.GetFirstName] resignadamente, 'você deixou seu ponto claro o suficiente. Pagaremos ao [employer.GetTitleAsName] o que [employer.GetSheHe] deve.'"
 laamp_base_contract_schemes.2322.desc.tax_status.has_cash:0 "O que quer que digam, [destination_1.GetBaseNameNoTier] seguramente tem riqueza para spare, não importa as negações de seus magnatas."
 laamp_base_contract_schemes.2322.desc.tax_status.no_cash:0 "Claro, a cidade sofrerá por isso. Provavelmente de maneira bastante intensa, mas assim é a vida."
 laamp_base_contract_schemes.2322.desc.tax_status.partial_cash:0 "Os tempos serão difíceis para eles por um tempo, mas são habitantes da cidade, encontrarão uma maneira de fazer isso funcionar."
 laamp_base_contract_schemes.2322.desc.violence:0 "Um silêncio se instala na sala.\n\nUm silêncio tenso e desconfortável, enquanto os locais se observam, descontentamento contorcendo seus lábios em quase rosnados.\n\nCom um súbito rangido de madeira sobre pedra, [aggressor.GetTitledFirstName] lança sua cadeira para trás: 'se você pretende dispensar justiça tão mal, criatura, prepare-se para sentir nossa justiça em troca!'\n\nOs próximos minutos são um borrão, enquanto dois dos meus seguidores irrompem na sala, seguidos por um punhado de soldados de [person_a.GetTitledFirstNamePossessive]. As lâminas são desembainhadas, ameaças gritam, e a cidade rapidamente mergulha em um tumulto completo."
 laamp_base_contract_schemes.2322.e:0 "Fuja!"
 laamp_base_contract_schemes.2322.t.success_critical:0 "$laamp_base_contract_schemes.2004.t$: Pago na Íntegra"
 laamp_base_contract_schemes.2322.t.success_qualified_insufficient_evidence:0 "$laamp_base_contract_schemes.2004.t$: Pago Amargamente"
 laamp_base_contract_schemes.2322.t.success_standard:0 "$laamp_base_contract_schemes.2004.t$: Pago"
 laamp_base_contract_schemes.2322.t.violence:0 "$laamp_base_contract_schemes.2004.t$: Violência Eclode"
 laamp_base_contract_schemes.2323.a.tt.failure.filler:0 "Você não recebe nenhuma recompensa extra."
 laamp_base_contract_schemes.2323.a.tt.failure:0 "[person_a.GetFirstNameNoTooltip] carece de gratidão."
 laamp_base_contract_schemes.2323.a.tt.success:0 "[person_a.GetFirstNameNoTooltip] recebe bem."
 laamp_base_contract_schemes.2323.a:0 "Uma conclusão justa, eu acho."
 laamp_base_contract_schemes.2323.b:0 "Toque minha mão e perca a sua, plebeu."
 laamp_base_contract_schemes.2323.desc:0 "Os locais não estão totalmente felizes com minha decisão, isso é claro a partir de seus murmúrios repentinos — ainda assim, duvido que [employer.GetTitledFirstName] esteja muito alegre também.\n\nAinda assim, compromissos muitas vezes envolvem deixar alguém (às vezes todos) infelizes, e [person_a.GetTitledFirstName] e seus capangas sabem que esta é a melhor resolução que provavelmente conseguirão.\n\n\"Eu... suponho que é isso, então. Obrigado pelo seu tempo, [ROOT.Char.GetTitledFirstNameNoTooltip]\", resmunga [person_a.GetFirstNameNoTooltip].\n\nSua mão se estende para pegar a minha."
 laamp_base_contract_schemes.2323.t:0 "$laamp_base_contract_schemes.2004.t$: Pago em Parte"
 laamp_base_contract_schemes.2324.a:0 "Espero que você se lembre disso, [person_a.GetFirstNameNoTooltip]."
 laamp_base_contract_schemes.2324.b:0 "Que o povo sorria para o meu nome!"
 laamp_base_contract_schemes.2324.desc.second_option:0 "\n\nUma noite amigável se segue, até que [person_a.GetFirstNameNoTooltip] consegue me puxar de lado para uma conversa tranquila.\n\n\"Você fez o que era certo por nós, [ROOT.Char.GetTitledFirstNameNoTooltip], como eu sabia que faria. Eu respeito isso em um líder. Se você quiser, tenho conexões em outros lugares que poderia usar para... #EMP reforçar#! seu bom nome em [claim_duchy.GetDefinitiveName]?\""
 laamp_base_contract_schemes.2324.desc:0 "Um coro de aplausos irrompe de [person_a.GetTitledFirstName], de seus capangas e até mesmo dos servos que evidentemente estavam escutando pela fechadura enquanto eu digo que eles estão dispensados de pagar.\n\n[employer.GetTitledFirstName|U] provavelmente não será fã, claro, o que significa que provavelmente não verei nenhuma moeda por tudo isso — mas que tipo de preço se pode colocar na adulação, afinal?"
 laamp_base_contract_schemes.2324.t:0 "$laamp_base_contract_schemes.2004.t$: Nulo e Vazio"
 laamp_base_contract_schemes.2331.a:0 "Eu aceito. Encontre um tent para [hopeful.GetSheHe]!"
 laamp_base_contract_schemes.2331.b:0 "Você seria um desperdício de sal."
 laamp_base_contract_schemes.2331.desc:0 "\"[ROOT.Char.GetTitledFirstNameNoTooltip]?\"\n\nEu olho para cima, longe da minha refeição noturna, para descobrir que um par de meus sentinelas me trouxe... um[Select_CString( hopeful.IsFemale, 'a', '' )] [hopeful.GetWomanMan] [hopeful.GetCulture.GetName] um tanto familiar? De onde eu conheço [hopeful.GetSheHe]...\n\n\"Sou [hopeful.GetTitledFirstName], [ROOT.Char.Custom('MistressMaster')]. Você adjudicou um assunto na minha cidade natal, [destination_1.GetBaseNameNoTier], alguns anos atrás, e achei que você fez isso com dignidade e bravura.\"\n\n\"De qualquer forma, meus negócios colapsaram há algum tempo, e me vejo à procura de outro trabalho. Pensei que você poderia... ter algo para mim...\""
 laamp_base_contract_schemes.2331.t:0 "$laamp_base_contract_schemes.2004.t$: Um Líder Digno"
 laamp_base_contract_schemes.2332.a:0 "Às vezes, é necessário."
 laamp_base_contract_schemes.2332.b:0 "Isto... isto saiu do controle."
 laamp_base_contract_schemes.2332.c:0 "#EMP Eh.#!"
 laamp_base_contract_schemes.2332.d:0 "Deixando o pagamento de lado, que excelente conclusão para os procedimentos!"
 laamp_base_contract_schemes.2332.desc.massacre:0 "O que se segue é nada menos que um massacre.\n\nO povo de [destination_1.GetBaseNameNoTierPossessive] é tenaz e zangado, mas não é páreo para os matadores vagantes de [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] uma vez que seu sangue ferve.\n\nEm pouco tempo, começa uma pilhagem. Gritos atravessam o céu noturno, corpos começam a se acumular, e [person_a.GetTitledFirstName], [person_b.GetTitledFirstName], [person_c.GetTitledFirstName] e [person_d.GetTitledFirstName] são todos massacrados na luta.\n\nIsso não é o que [employer.GetTitledFirstName] ordenou, e duvido que [employer.GetSheHe] pretenda pagar por isso."
 laamp_base_contract_schemes.2332.desc.quelled:0 "Apesar das más intenções de [person_a.GetTitledFirstName] e de seus capangas e milícias pagas, minhas tropas de [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] são mais do que suficientes para qualquer grupo de rabugentos [destination_1.GetAdjective] mal equipados.\n\nEm pouco tempo, o motim é contido. Há mortes, é claro, e até algum saque leve, mas eles trouxeram isso sobre si mesmos ao pegarem em armas contra mim. O cadáver de [aggressor.GetTitledFirstName|U] prova isso.\n\nCom a situação agora um pouco mais #EMP controlada#!, eu faço uma sugestão firme a [person_a.GetFirstNameNoTooltip] para que pague. Seu. Imposto.\n\n#BOL Agora#!."
 laamp_base_contract_schemes.2332.t:0 "$laamp_base_contract_schemes.2004.t$: Sangue e Corpos"
 laamp_base_contract_schemes.2541.a.tt.easier.easier_admiration:0 "#WEAK Um pouco mais fácil devido à atitude dos locais em relação ao seu [liege|E]#!"
 laamp_base_contract_schemes.2541.a.tt.easier.happiness:0 "#WEAK Muito mais fácil devido à atitude dos locais em relação ao seu [liege|E]#!"
 laamp_base_contract_schemes.2541.a.tt.failure.tt:0 "+1 levantamentos #N falhados#!"
 laamp_base_contract_schemes.2541.a.tt.failure:0 "Inexatidões óbvias"
 laamp_base_contract_schemes.2541.a.tt.success.tt:0 "+1 levantamentos #P bem-sucedidos#!"
 laamp_base_contract_schemes.2541.a.tt.success:0 "Um levantamento abrangente"
 laamp_base_contract_schemes.2541.a:0 "Certo, vamos fazer isso."
 laamp_base_contract_schemes.2541.b.tt:0 "$laamp_base_contract_schemes.2541.a.tt.success.tt$ #WEAK (ser desonesto possibilita um $label_failure_critical$)#!"
 laamp_base_contract_schemes.2541.b:0 "Parece uma cidade fácil de forjar..."
 laamp_base_contract_schemes.2541.c.tt.explicit_odds_note:0 "#WEAK Este desafio é um pouco mais fácil no geral do que testar [stewardship|E]#!"
 laamp_base_contract_schemes.2541.c.tt.failure.tt:0 "$laamp_base_contract_schemes.2541.a.tt.failure.tt$ #WEAK (ser desonesto possibilita um $label_failure_critical$)#!"
 laamp_base_contract_schemes.2541.c.tt.failure:0 "Suas fabricações são óbvias"
 laamp_base_contract_schemes.2541.c.tt.success.tt:0 "$laamp_base_contract_schemes.2541.b.tt$"
 laamp_base_contract_schemes.2541.c.tt.success:0 "Você forja crível o censo local"
 laamp_base_contract_schemes.2541.c:0 "Penso que não precisamos nos esforçar muito aqui..."
 laamp_base_contract_schemes.2541.d.officer_exists:0 "[officer.GetFirstNameNoTooltip], você pode começar."
 laamp_base_contract_schemes.2541.d.officer_unexists:0 "Se ao menos eu tivesse um intendente..."
 laamp_base_contract_schemes.2541.desc.fluff_type.admiration:0 "A população de [location.GetBaseNameNoTierPossessive|U] parece suficientemente dócil.\n\nNão há preocupações com impostos iminentes ou uma nova guerra aqui, apenas pessoas levando suas vidas e aceitando seu destino. Quando um representante de seu senhor vem chamar, eles prestam a devida atenção a [ROOT.Char.GetSheHe].\n\nO selo de [employer.GetTitledFirstNamePossessive] nos ajuda a passar pela maioria dos obstáculos locais mesquinhos, mas as pessoas estão tão contentes que mal precisamos usá-lo."
 laamp_base_contract_schemes.2541.desc.fluff_type.boredom:0 "As pessoas aqui parecem desinteressadas em nossa tarefa, não importa que venha de seu [employer.GetTitleAsNameNoTooltip], com o nome e o sigilo de [employer.GetFirstNamePossessive] mal os despertando do mínimo exigido pela legalidade e pela decência.\n\nUm lugar lento e frustrante para fazer anotações, mas a determinação exige resistência, e nós #EMP estamos#! determinados a ganhar nossa prata."
 laamp_base_contract_schemes.2541.desc.fluff_type.disgust:0 "Parece que [location.GetNameNoTier] não é gentil com os servos de [employer.GetTitledFirstName].\n\nNossa chegada é recebida com escárnio absoluto, nossas perguntas são ignoradas ou abertas para zombarias. Embora os locais possam ser frustrantes, se não conseguirmos colocá-los sob controle, arriscamos preciosas moedas, e isso não pode acontecer."
 laamp_base_contract_schemes.2541.desc.fluff_type.happiness:0 "Em [location.GetNameNoTier], os habitantes nos cumprimentam com aplausos, cestos de comida e toda a alegria de uma família recebendo seus parentes de volta de alguma guerra distante.\n\nParece que, nestas terras, o nome de [employer.GetTitledFirstName] é lendário entre seus súditos, o suficiente para que qualquer mensagem de seu amado [employer.GetTitleAsNameNoTooltip] seja motivo de celebração.\n\nDesnecessário dizer que estão ansiosos para fornecer nossa missão com toda a ajuda e apoio que puderem."
 laamp_base_contract_schemes.2541.desc.fluff_type.paranoia:0 "O povo de [location.GetNameNoTier] reage à nossa chegada com uma hostilidade mal contida.\n\nEstá claro que eles consideram a atualização dos registros de [employer.GetTitledFirstNamePossessive] como um #EMP sinal#! certo de algo ruim no horizonte, seja conflito ou um imposto sobre a população, e nossas perguntas frequentemente são rechaçadas.\n\nAinda assim, temos um trabalho a fazer e nenhum camponês enrolador vai nos impedir de receber nosso pagamento."
 laamp_base_contract_schemes.2541.desc.fluff_type.worry:0 "Por qualquer motivo, [location.GetNameNoTier] acha que tem boas razões para duvidar das intenções de [employer.GetTitledFirstName] — pelo menos, o suficiente para torná-los apenas #EMP relutantemente#! cooperativos conosco.\n\nÉ cansativo, mas pelo menos é viável. Isso apenas significa que arrancar informações de cada lar de seus ocupantes é um trabalho maçante, se não ativamente desagradável."
 laamp_base_contract_schemes.2541.e.failure.tt:0 "$laamp_base_contract_schemes.2541.c.tt.failure.tt$"
 laamp_base_contract_schemes.2541.e.failure:0 "Mentiras óbvias"
 laamp_base_contract_schemes.2541.e.success.tt:0 "$laamp_base_contract_schemes.2541.b.tt$"
 laamp_base_contract_schemes.2541.e.success:0 "Gibberish crível"
 laamp_base_contract_schemes.2541.e.tt.employer_has_trait.diligent:0 "#WEAK Mais provável porque [employer.GetTitledFirstName] é [GetTrait('diligent').GetName( GetNullCharacter )]#!"
 laamp_base_contract_schemes.2541.e.tt.employer_has_trait.lazy:0 "#WEAK Mais provável porque [employer.GetTitledFirstName] é [GetTrait('lazy').GetName( GetNullCharacter )]#!"
 laamp_base_contract_schemes.2541.e.tt.employer_has_trait.paranoid:0 "#WEAK Mais provável porque [employer.GetTitledFirstName] é [GetTrait('paranoid').GetName( GetNullCharacter )]#!"
 laamp_base_contract_schemes.2541.e.tt.employer_has_trait.trusting:0 "#WEAK Mais provável porque [employer.GetTitledFirstName] é [GetTrait('trusting').GetName( GetNullCharacter )]#!"
 laamp_base_contract_schemes.2541.e:0 "Ah, apenas escreva qualquer coisa velha, quem se importa?"
 laamp_base_contract_schemes.2541.t:0 "$laamp_base_contract_schemes.2011.t$: [location.GetBaseNameNoTierNoTooltip]"
 laamp_base_contract_schemes.2542.a.crit_fail:0 "De fato, isso foi uma perda de nosso tempo."
 laamp_base_contract_schemes.2542.a.crit_win:0 "Uma grande vitória!"
 laamp_base_contract_schemes.2542.a.fail:0 "Bah, vamos deixar esses ingratos."
 laamp_base_contract_schemes.2542.a.win:0 "Um ótimo trabalho que fizemos."
 laamp_base_contract_schemes.2542.desc.intro:0 "Um representante de [employer.GetTitledFirstName] nos encontra em [location.GetBaseNameNoTier] quando terminamos, levando nosso grosso maço de anotações coletadas com interesse.\n\n"
 laamp_base_contract_schemes.2542.desc.method.combi_own_skill_and_quartermasters.loss:0 "Com desconfiança, o oficial examina os registros que [officer.GetTitledFirstName] e eu compilamos meticulosamente. Folheando cada página com crescente desdém, [dummy_gender.GetSheHe] acaba fazendo uma demonstração de jogar o caro [ROOT.Char.Custom('GetWritingMaterial')] no chão antes de sair em silêncio."
 laamp_base_contract_schemes.2542.desc.method.combi_own_skill_and_quartermasters.win:0 "\"Que servos diligentes vocês dois fazem!\" ri o servo para [officer.GetTitledFirstName] e eu, \"esses registros são adequadamente detalhados para o [employer.GetTitleAsNamePossessiveNoTooltip], até sua caligrafia é excelente. Vou buscar seu pagamento merecido imediatamente.\""
 laamp_base_contract_schemes.2542.desc.method.combi_own_skill_dishonest_and_guessed.loss:0 "Não demora muito para [dummy_gender.GetSheHe] notar nossas... soluções #EMP empreendedoras#! para circunstâncias desafiadoras. Após uma breve reprimenda por nossa audácia descarada, [Select_CString( dummy_gender.IsFemale, 'a', 'o' )] [dummy_gender.GetWomanMan] [Select_CString( employer.IsFemale, 'da', 'do' )] [employer.GetTitleAsNamePossessiveNoTooltip] marcha para longe."
 laamp_base_contract_schemes.2542.desc.method.combi_own_skill_dishonest_and_guessed.win:0 "\"Meu Deus, esses são fatos #EMP impressionantes#! que você reuniu... devo confessar que não tinha ideia de muito disso. Parece que as terras do [employer.GetTitleAsNamePossessiveNoTooltip] são muito mais diversas do que imaginávamos. No entanto, é um bom trabalho que você fez, o [employer.GetTitleAsNameNoTierNoTooltip] ficará satisfeito!\""
 laamp_base_contract_schemes.2542.desc.method.mixed.loss:0 "\"Olha, sendo honesto, isso é... uma bagunça. Não consigo entender nem um pouco do que você até #EMP tentou#! fazer aqui, e acho que ambos sabemos que você não merece um único centavo pelo que quer que seja\", [dummy_gender.GetSheHe] faz um gesto desdenhoso, \"#EMP isso#! é.\""
 laamp_base_contract_schemes.2542.desc.method.mixed.win:0 "\"Bem, uhhh, vejo que seus... registros... parecem estar em ordem. Eles são um pouco ecléticos — como exatamente você fez isso? Ou, bem, nunca mindo, suponho. O [employer.GetTitleAsNameNoTooltip] ficará feliz e isso é tudo que importa.\""
 laamp_base_contract_schemes.2542.desc.method.own_skill.dishonest.loss:0 "Após um momento de inspeção, [dummy_gender.GetSheHe] levanta o olhar: \"você acha que somos #EMP idiotas#! em [employer.GetCapitalLocation.GetTitle.GetNameNoTier]? Tolos que você pode simplesmente mentir e não vamos perceber nada, não importa quão tolas sejam suas falsificações? Você não receberá pagamento por essa charlatanice!\""
 laamp_base_contract_schemes.2542.desc.method.own_skill.dishonest.win:0 "\"Por [employer.GetFaith.KnowledgeGodName], que riqueza de informações você descobriu! E #EMP tanto#! disso é tão totalmente inesperado... se eu não tivesse lido com meus próprios olhos, mal acreditaria. O [employer.GetTitleAsNameNoTooltip] ficará muito satisfeito com seus esforços!\""
 laamp_base_contract_schemes.2542.desc.method.own_skill.guessed.loss:0 "\"Que ... você... você #EMP claramente#! acabou de inventar um absoluto gibberish. O que te levou a pensar que poderia escapar com isso, você é louc[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]?\"\n\n[Select_CString( dummy_gender.IsFemale, 'A', 'O' )] [dummy_gender.GetWomanMan] [Select_CString( employer.IsFemale, 'da', 'do' )] [employer.GetTitleAsNamePossessiveNoTooltip] já tinha ido antes que pudéssemos começar a protestar nossa inocência."
 laamp_base_contract_schemes.2542.desc.method.own_skill.guessed.win:0 "\"Querido, querido, se esses registros seus são #EMP qualquer coisa#! parecidos com precisão, então parece que nosso conhecimento das terras do [employer.GetTitleAsNamePossessiveNoTooltip] está tão lamentavelmente deficiente que talvez tenhamos que encomendar um censo mais detalhado imediatamente. Trabalho de primeira!\""
 laamp_base_contract_schemes.2542.desc.method.own_skill.honest.loss:0 "\"Bem, posso ver que você #EMP tentou#! pelo menos, mas há muitos, muitos erros óbvios nesses registros, mesmo à primeira vista, para serem utilizáveis pelo [employer.GetTitleAsName]. Sinto muito, mas você não receberá nada por um trabalho tão descuidado, não importa o esforço que você colocou nisso.\""
 laamp_base_contract_schemes.2542.desc.method.own_skill.honest.win:0 "\"Trabalho estupendo, [ROOT.Char.GetTitledFirstNameNoTooltip]! Mesmo uma olhada superficial mostra grande cuidado e atenção aos detalhes — o [employer.GetTitleAsNameNoTooltip] ficará radiante!\" Graciosamente, inclino minha cabeça ligeiramente em agradecimento ao elogio, e o servo sinaliza para que nossa recompensa seja trazida."
 laamp_base_contract_schemes.2542.desc.method.quartermasters_skill_sans_stress.loss:0 "\"Olha, posso ver que você tentou, mas quem quer que você tenha pago para fazer essas anotações... você está pagando demais para eles.\"\n\nAo meu lado, [officer.GetTitledFirstName] ri alto."
 laamp_base_contract_schemes.2542.desc.method.quartermasters_skill_sans_stress.win:0 "\"Quem quer que tenha feito este trabalho para você, [ROOT.Char.GetTitledFirstNameNoTooltip], fez um #EMP excelente#! trabalho\", assobia o servo, \"o [employer.GetTitleAsNameNoTooltip] ficará muito satisfeito\". Ao meu lado, [officer.GetTitledFirstName] se endireita um pouco, transbordando de orgulho silencioso, enquanto nossa recompensa é trazida até nós."
 laamp_base_contract_schemes.2542.desc.method.quartermasters_stressed_and_wreckt.loss:0 "\"Eu... não sei quem você teve ditando suas notas ou fazendo suas perguntas, mas devo perguntar: eles são consanguíneos ou apenas simples?\"\n\nEm algum lugar atrás de mim, [officer.GetTitledFirstName] desata a chorar."
 laamp_base_contract_schemes.2542.desc.method.quartermasters_stressed_and_wreckt.win:0 "\"Quem quer que tenha feito este trabalho para você, [ROOT.Char.GetTitledFirstNameNoTooltip], fez um #EMP tremendo#! trabalho\", assobia o servo, \"o [employer.GetTitleAsNameNoTooltip] ficará extasiado\". Atrás de mim, [officer.GetTitledFirstName] esfrega a testa, claramente cansado de seu trabalho mesmo enquanto nossa recompensa é buscada."
 laamp_base_contract_schemes.2542.desc.outro.loss:0 "\n\nHoje, [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] sai de mãos vazias."
 laamp_base_contract_schemes.2542.desc.outro.win:0 "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] recebe o que lhe é devido: um grande baú de moedas de prata por nossos esforços."
 laamp_base_contract_schemes.2542.t.crit_fail:0 "$laamp_base_contract_schemes.2011.t$: Falha Excepcional"
 laamp_base_contract_schemes.2542.t.crit_win:0 "$laamp_base_contract_schemes.2011.t$: Sucesso Excepcional"
 laamp_base_contract_schemes.2542.t.fail:0 "$laamp_base_contract_schemes.2011.t$: Falha!"
 laamp_base_contract_schemes.2542.t.win:0 "$laamp_base_contract_schemes.2011.t$: Sucesso!"
 laamp_base_contract_schemes.2661.a:0 "Isso parece um problema simples o suficiente..."
 laamp_base_contract_schemes.2661.b.tt.failure:0 "As discussões falham"
 laamp_base_contract_schemes.2661.b.tt.success:0 "Você encontra um compromisso adequado"
 laamp_base_contract_schemes.2661.b:0 "Acho que posso resolver isso..."
 laamp_base_contract_schemes.2661.c:0 "Suspeito que a precisão importe menos aqui do que a clareza."
 laamp_base_contract_schemes.2661.d.no_valid_char:0 "Você não tem um [follower|E] disponível com pelo menos [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_other_skill_threshold_value')|0] [intrigue|E] para designar temporariamente a [court|E] de [employer.GetFirstNamePossessive]"
 laamp_base_contract_schemes.2661.d.sacrifice_exists:0 "[sacrifice.GetFirstNameNoTooltip|U] ficará para trabalhar nesta disputa."
 laamp_base_contract_schemes.2661.d.sacrifice_unexists:0 "Infelizmente, não tenho servos habilidosos o suficiente para deixar com você."
 laamp_base_contract_schemes.2661.d.tt.courtier_stays_here:0 "[sacrifice.GetFirstName|U] será emprestado a [court|E] de [employer.GetTitledFirstNamePossessive] — [sacrifice.GetSheHe] retornará a você após entre [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_sacrifice_loan_length_min_value')|0] e [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_sacrifice_loan_length_max_value')|0] anos"
 laamp_base_contract_schemes.2661.desc.outro:0 "\n\n[employer.GetTitledFirstName|U] faz questão de nos informar que nosso pagamento depende de acalmar essa situação de forma rápida e discreta."
 laamp_base_contract_schemes.2661.desc:0 "A disputa em [employer.GetPrimaryTitle.GetBaseNameNoTier] decorre de um pequeno caso legal local: nosso empregador imprudentemente decidiu que um determinado marco natural tinha um limite ligeiramente diferente do que era tradicional.\n\nImediatamente, dezenas de casos surgiram por parte de pequenos proprietários de terras e camponeses privilegiados, todos os quais tinham alguma queixa agora levantada pela mudança na definição."
 laamp_base_contract_schemes.2661.e.officer_exists:0 "[officer.GetTitledFirstNameNoTooltip|U], isso parece ser sua área?"
 laamp_base_contract_schemes.2661.e.officer_unexists:0 "Hrmph, não tenho um oficial adequado para delegar."
 laamp_base_contract_schemes.2661.f:0 "Uma chance para um debate esclarecedor, você diz!"
 laamp_base_contract_schemes.2661.g:0 "Posso resolver qualquer coisa se me dedicar a isso!"
 laamp_base_contract_schemes.2661.t:0 "$laamp_base_contract_schemes.2031.t$: Marco Local"
 laamp_base_contract_schemes.2662.a:0 "Outro $game_concept_contact_list_contact$ feliz."
 laamp_base_contract_schemes.2662.desc.outro:0 "\n\n[employer.GetTitledFirstName] parece simplesmente grato que toda a confusão tenha acabado."
 laamp_base_contract_schemes.2662.desc.resolution_type.camp_purpose:0 "As boas pessoas de [employer.GetPrimaryTitle.GetBaseNameNoTier] podem ser fervorosos defensores de si mesmas, mas não contaram com a fúria acadêmica total de [ROOT.Char.GetPrimaryTitle.GetDefinitiveName].\n\nNossas discussões ocupam grande parte do dia, algo que considero estimulante, mas que eles parecem evitar cada vez mais à medida que a hora avança.\n\nNão chegamos a conclusões reais, mas eventualmente os locais simplesmente desistem. Questões são encontradas com questões, cada assunto revisitado várias vezes, pontos se arrastam indefinidamente..."
 laamp_base_contract_schemes.2662.desc.resolution_type.left_sacrifice:0 "Deixando [sacrifice.GetTitledFirstName] para trabalhar com os locais irritados, [employer.GetTitledFirstName] e eu vamos dar um passeio.\n\nOs gritos e clamores de injustiça vão gradualmente se afastando para o fundo, e quando nos aproximamos de uma pequena varanda para sentir o ar da tarde, [employer.GetFirstNameNoTooltip] sorri pela primeira vez desde que chegamos.\n\n\"Muito gentil da sua parte nos emprestar um orador tão habilidoso, [ROOT.Char.GetFirstNameNoTooltip], realmente muito gentil. Vou garantir que seu retorno seja rápido e seguro. Seu pagamento está esperando por você nos portões.\""
 laamp_base_contract_schemes.2662.desc.resolution_type.officer:0 "Um caçador nato, a avaliação de [officer.GetTitledFirstNamePossessive] sobre a localização do marco é rápida, precisa e indiscutível.\n\nIsso não impede, é claro, que os cidadãos de [employer.GetPrimaryTitle.GetBaseNameNoTier] tentem, mas [officer.GetFirstNameNoTooltip] tem uma resposta para cada um deles, desmontando seus argumentos à medida que vêm até [officer.GetSheHe].\n\nÉ meio-dia quando eles terminam, mas a multidão de litigantes em potencial acaba se dissipando."
 laamp_base_contract_schemes.2662.desc.resolution_type.secondary_skill:0 "Um pouco de trabalho verbal criativo é tudo o que leva para semear as sementes da dúvida nas pessoas irritadas de [employer.GetPrimaryTitle.GetBaseNameNoTier].\n\nSugira que isso foi dito em vez daquilo, que uma frase realmente significava outra, coloque uma ou duas pessoas contra as outras, e #EMP et voila#!: todos estão muito incertos sobre quem está certo e o que é verdade para oferecer qualquer tipo de resistência significativa.\n\nA questão não está realmente resolvida, mas o problema está diluído o suficiente agora para que sua raiva diminua e suas objeções se dissipem."
 laamp_base_contract_schemes.2662.desc.resolution_type.stewardship:0 "As boas pessoas de [employer.GetPrimaryTitle.GetBaseNameNoTier] têm muitos pontos, alguns válidos, outros não, mas #EMP nenhum#! coerente.\n\nNão demora muito para eu contornar seus argumentos, mostrando cada um deles, por sua vez, como facetioso, tolo, ou ambos.\n\nCom apenas algumas horas de trabalho, consigo reverter a situação para nosso empregador, até que a nova decisão [employer.GetHerHim] parece — muito para a consternação e aborrecimento de seus súditos — totalmente de acordo com a tradição."
 laamp_base_contract_schemes.2662.desc.resolution_type.stress:0 "Uma teimosia pura pode não ser uma maneira eficiente de resolver todos os problemas, certamente sinto o peso de engajar em gritos rigorosos com tantos locais irritados, mas é eficaz.\n\nApós poucas horas de gritos e pressão psicológica, as pessoas de [employer.GetPrimaryTitle.GetBaseNameNoTier] eventualmente, envergonhadamente, se rendem.\n\nComo eu sabia que fariam, se eu mostrasse minha vontade."
 laamp_base_contract_schemes.2662.t:0 "$laamp_base_contract_schemes.2031.t$: Sucesso!"
 laamp_base_contract_schemes.2663.a:0 "Fizemos o nosso melhor..."
 laamp_base_contract_schemes.2663.desc.officer:0 "Apesar dos melhores esforços de [officer.GetTitledFirstNamePossessive], o povo de [employer.GetPrimaryTitle.GetBaseNameNoTier] está em uproar.\n\nParece que as tentativas de meu caçador de esclarecer os limites do marco apenas resultaram em um #EMP terceiro#! conjunto de definições para contestar os dois primeiros."
 laamp_base_contract_schemes.2663.desc.outro:0 "\n\nA partir daí, parece que cada velha mágoa em [employer.GetPrimaryTitle.GetDeJureLiege.GetBaseNameNoTier] está sendo desenterrada à medida que o sangue ruim e as demandas questionáveis se espalham pelos locais, com todo o [employer.GetPrimaryTitle.GetDeJureLiege.GetTierAsNameNoTooltip] ameaçando transbordar por causa disso.\n\nCom raiva, [employer.GetTitledFirstName] nos expulsa do assentamento, sem um centavo por nossos problemas."
 laamp_base_contract_schemes.2663.desc.stewardship:0 "Parece que minhas habilidades administrativas estão... não #EMP quite#! onde eu imaginava que estivessem.\n\nPensei que uma opinião informada de um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] de prestígio seria útil para esclarecer as coisas. Em vez disso, minhas tentativas de esclarecer os limites do marco apenas criaram um #EMP terceiro#! padrão para contestar os dois primeiros, enviando os vários beligerantes a uma frenesi de argumentos."
 laamp_base_contract_schemes.2663.t:0 "$laamp_base_contract_schemes.2031.t$: Falha!"
 laamp_base_contract_schemes.2666.a:0 "$laamp_base_contract_schemes.2661.a$"
 laamp_base_contract_schemes.2666.b.tt.failure:0 "$laamp_base_contract_schemes.2661.b.tt.failure$"
 laamp_base_contract_schemes.2666.b.tt.success:0 "$laamp_base_contract_schemes.2661.b.tt.success$"
 laamp_base_contract_schemes.2666.b:0 "$laamp_base_contract_schemes.2661.b$"
 laamp_base_contract_schemes.2666.c:0 "Isso parece um problema de comunicação."
 laamp_base_contract_schemes.2666.d.no_valid_char:0 "Você não possui um [follower|E] disponível com pelo menos [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_other_skill_threshold_value')|0] [diplomacy|E] para designar temporariamente a [court|E] de [employer.GetTitledFirstNamePossessive]"
 laamp_base_contract_schemes.2666.d.sacrifice_exists:0 "$laamp_base_contract_schemes.2661.d.sacrifice_exists$"
 laamp_base_contract_schemes.2666.d.sacrifice_unexists:0 "$laamp_base_contract_schemes.2661.d.sacrifice_unexists$"
 laamp_base_contract_schemes.2666.d.tt.courtier_stays_here:0 "$laamp_base_contract_schemes.2661.d.tt.courtier_stays_here$"
 laamp_base_contract_schemes.2666.desc.outro:0 "$laamp_base_contract_schemes.2661.desc.outro$"
 laamp_base_contract_schemes.2666.desc:0 "[employer.GetPrimaryTitle.GetBaseNameNoTier] está em uproar muito antes de nossa chegada — aparentemente, anos de erros por parte de nosso empregador e de seus semelhantes levaram a muitas propriedades e negócios locais sendo tributados #EMP duas vezes ou mais#!, apenas por diferentes coletores com diferentes deveres.\n\nApós muitas reclamações e tentativas de reparo educado, as coisas estão finalmente ameaçando transbordar para algo mais sangrento."
 laamp_base_contract_schemes.2666.e.officer_exists:0 "$laamp_base_contract_schemes.2661.e.officer_exists$"
 laamp_base_contract_schemes.2666.e.officer_unexists:0 "$laamp_base_contract_schemes.2661.e.officer_unexists$"
 laamp_base_contract_schemes.2666.f:0 "Devemos simplesmente redesenhar os limites!"
 laamp_base_contract_schemes.2666.g:0 "$laamp_base_contract_schemes.2661.g$"
 laamp_base_contract_schemes.2666.t:0 "$laamp_base_contract_schemes.2031.t$: Duplo Pagamento"
 laamp_base_contract_schemes.2667.a:0 "$laamp_base_contract_schemes.2662.a$"
 laamp_base_contract_schemes.2667.desc.outro:0 "\n\nDeixamos a cidade mais tarde naquele dia, bolsas cheias de moedas frescas."
 laamp_base_contract_schemes.2667.desc.resolution_type.camp_purpose:0 "[ROOT.Char.GetPrimaryTitle.GetDefinitiveName|U] têm experiência na área de cartografia, e entre histórias meio inventadas e pronunciamentos ousados sobre a #EMP new#! maneira de fazer as coisas, eles cedem totalmente a nós.\n\nO bom povo de [employer.GetPrimaryTitle.GetBaseNameNoTier] está tão aliviado com a perspectiva de um fim à dupla tributação que parece tacitamente disposto a ignorar os impostos extras já aplicadas — algo que deixo claro para [employer.GetTitledFirstName] é uma vitória que [employer.GetSheHe] deve simplesmente aceitar."
 laamp_base_contract_schemes.2667.desc.resolution_type.left_sacrifice:0 "Um pouco angustiado com a perspectiva de ser deixado para trás, [sacrifice.GetTitledFirstName] no entanto se acomoda para começar a ouvir as mil e uma objeções do povo de [employer.GetPrimaryTitle.GetBaseNameNoTier].\n\n[employer.GetTitledFirstName|U] agradecidamente me leva para longe, deixando nossos inferiores em seu trabalho.\n\n\"Muito gentil da sua parte nos deixar um servo tão promissor — asseguro que [sacrifice.GetSheHe] será bem cuidado durante a estadia [sacrifice.GetHerHim]! Agora, acredito que havia a questão do seu pagamento...\""
 laamp_base_contract_schemes.2667.desc.resolution_type.officer:0 "Felizmente, a habilidade do Quartermaster [officer.GetFirstNamePossessive] com a gestão prova ser suficiente para vencer o dia.\n\nLeva horas de debate intenso e auditoria verbal, mas [officer.GetSheHe] consegue encontrar dívidas antigas, impostos não pagos, favores ainda não reivindicados e similares para fazer parecer que a maior parte das cobranças extras eram simplesmente rotuladas incorretamente.\n\nIsso não resolve o mau hábito de [employer.GetTitledFirstNamePossessive] de sobrecarregar tributariamente a longo prazo, mas é o suficiente para satisfazer nosso empregador por agora."
 laamp_base_contract_schemes.2667.desc.resolution_type.secondary_skill:0 "O povo de [employer.GetPrimaryTitle.GetBaseNameNoTier] claramente se considera sofisticado, mas não contaram com a língua de um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] dos [ROOT.Char.GetHouse.GetName].\n\nHabilidosamente, eu amarro suas pequenas objeções em nós, semeando a semente da dúvida em seu meio, lembrando-os de todo o bom trabalho que [employer.GetTitledFirstName] faz para mantê-los seguros enquanto #EMP subtly#! lembrando-os de quem possui o monopólio local da força.\n\nNo final, talvez eu tenha exagerado um pouco, mas... quando você está se divertindo..."
 laamp_base_contract_schemes.2667.desc.resolution_type.stewardship:0 "A tributação é contabilidade, e contabilidade é uma forma de arte subestimada nos dias de hoje.\n\nCom uma lista de deveres locais fornecida, leva a maior parte do dia para revisar cada incidente de #EMP alleged#! sobrecarga tributária e demonstrar que isso era simplesmente um dever não pago em outro lugar. O povo de [employer.GetPrimaryTitle.GetBaseNameNoTier] murmura, naturalmente, mas a maioria acaba se conformando.\n\nPara os poucos que conseguem apresentar álibis substanciais, o lançamento de uma isenção ocasional dos impostos do próximo ano garante seu silêncio cúmplice — apesar das queixas murmuradas de [employer.GetTitledFirstName]."
 laamp_base_contract_schemes.2667.desc.resolution_type.stress:0 "Falar com os pequenos magnatas de [employer.GetPrimaryTitle.GetBaseNameNoTier] é absolutamente, absolutamente exaustivo.\n\nExaustivo, mas não impossível, e através de coragem e determinação, acabo conseguindo convencer #EMP most#! deles. Não é uma solução permanente, mas pressionar a maioria ao silêncio parece ser o suficiente para agradar [employer.GetTitledFirstName], e, no final, isso é tudo o que realmente estamos aqui para."
 laamp_base_contract_schemes.2667.t:0 "$laamp_base_contract_schemes.2031.t$: Sucesso!"
 laamp_base_contract_schemes.2668.a:0 "$laamp_base_contract_schemes.2663.a$"
 laamp_base_contract_schemes.2668.desc.officer:0 "Os métodos do Quartermaster [officer.GetFirstNamePossessive] se mostram... insuficientes.\n\n[officer.GetSheHe|U] tenta fazer uma contabilidade completa e franca dos impostos — pagos, não pagos e pagos a mais — mas é interrompido a cada passo por um [employer.GetTitledFirstName] irritado e pela população frustrada e angustiada da cidade.\n\nLogo, tudo desce para mais uma discussão acalorada, toda a aparência de controle perdida."
 laamp_base_contract_schemes.2668.desc.outro:0 "\n\nSomos forçados a deixar [employer.GetPrimaryTitle.GetBaseNameNoTier] de mãos vazias."
 laamp_base_contract_schemes.2668.desc.stewardship:0 "Parece que não era um problema simples o suficiente.\n\nMinhas tentativas de resolver a situação, acalmando os locais e prometendo algo como reparação, foram imediatamente minadas pela negação beligerante de [employer.GetTitledFirstNamePossessive] de qualquer erro.\n\nA partir daí, a situação rapidamente saiu do meu controle, com todas as partes gritando umas com as outras e a cidade à beira da completa anarquia."
 laamp_base_contract_schemes.2668.t:0 "$laamp_base_contract_schemes.2031.t$: Falha!"
 laamp_base_contract_schemes.2671.a:0 "$laamp_base_contract_schemes.2661.a$"
 laamp_base_contract_schemes.2671.b.tt.failure:0 "$laamp_base_contract_schemes.2661.b.tt.failure$"
 laamp_base_contract_schemes.2671.b.tt.success:0 "$laamp_base_contract_schemes.2661.b.tt.success$"
 laamp_base_contract_schemes.2671.b:0 "$laamp_base_contract_schemes.2661.b$"
 laamp_base_contract_schemes.2671.c:0 "Ah, você só precisa de algumas costas fortes!"
 laamp_base_contract_schemes.2671.d.no_valid_char:0 "Você não possui um [follower|E] disponível com pelo menos [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_other_skill_threshold_value')|0] [prowess|E] para atribuir temporariamente a [court|E] de [employer.GetFirstNamePossessive]"
 laamp_base_contract_schemes.2671.d.sacrifice_exists:0 "$laamp_base_contract_schemes.2661.d.sacrifice_exists$"
 laamp_base_contract_schemes.2671.d.sacrifice_unexists:0 "$laamp_base_contract_schemes.2661.d.sacrifice_unexists$"
 laamp_base_contract_schemes.2671.d.tt.courtier_stays_here:0 "$laamp_base_contract_schemes.2661.d.tt.courtier_stays_here$"
 laamp_base_contract_schemes.2671.desc.outro:0 "$laamp_base_contract_schemes.2661.desc.outro$"
 laamp_base_contract_schemes.2671.desc:0 "O problema subjacente em [employer.GetPrimaryTitle.GetBaseNameNoTier] é bastante aparente mesmo do lado de fora dos portões em decomposição — suas paredes estão em um estado terrível.\n\nO principal problema parece ser não reconhecer isso, mas descobrir quem aqui realmente vai #EMP pay#! para restaurá-las. Uma proposta cara que todos concordam ser necessária, e também, o problema de alguém #EMP else's#!."
 laamp_base_contract_schemes.2671.e.officer_exists:0 "$laamp_base_contract_schemes.2661.e.officer_exists$"
 laamp_base_contract_schemes.2671.e.officer_unexists:0 "$laamp_base_contract_schemes.2661.e.officer_unexists$"
 laamp_base_contract_schemes.2671.f:0 "Onde você diria que os muros estão... #EMP weakest#!..."
 laamp_base_contract_schemes.2671.g:0 "$laamp_base_contract_schemes.2661.g$"
 laamp_base_contract_schemes.2671.t:0 "$laamp_base_contract_schemes.2031.t$: Muros em Colapso"
 laamp_base_contract_schemes.2672.a.city_sacked:0 "Caveat emptor."
 laamp_base_contract_schemes.2672.a:0 "$laamp_base_contract_schemes.2662.a$"
 laamp_base_contract_schemes.2672.desc.outro:0 "\n\n[employer.GetTitledFirstName] está feliz o suficiente com nossa solução, entregando alegremente sua moeda."
 laamp_base_contract_schemes.2672.desc.resolution_type.camp_purpose:0 "A cidade de [employer.GetPrimaryTitle.GetBaseNameNoTier] arde.\n\nBem, a maior parte. Não as partes que meus seguidores estão levando de volta para o acampamento de [ROOT.Char.GetPrimaryTitle.GetDefinitiveName], não, essas permanecerão #EMP agradáveis e seguras#! sob meus cuidados.\n\nFoi honroso da minha parte saquear um assentamento que veio até mim em busca de ajuda apenas porque eu podia? Talvez não.\n\nMas então, mais tolos eles por oferecerem tal pagamento a alguém que não conhecem nem um pouco..."
 laamp_base_contract_schemes.2672.desc.resolution_type.left_sacrifice:0 "Parecendo já cansado, [sacrifice.GetTitledFirstName] já está tentando direcionar as pessoas argumentativas de [employer.GetPrimaryTitle.GetBaseNameNoTier] quando [employer.GetTitledFirstName] e eu deixamos a sala.\n\n\"Não se preocupe, [ROOT.Char.GetTitledFirstNameNoTooltip], vamos cuidar bem de [Select_CString( sacrifice.IsFemale, 'sua', 'seu' )] [sacrifice.GetWomanMan] e enviar [sacrifice.GetSheHe] de volta em uma peça.\"\n\nAh, é só empilhar algumas pedras uma sobre a outra. Quão difícil pode ser? Agradecidamente, aceito o pagamento e me preparo para sair."
 laamp_base_contract_schemes.2672.desc.resolution_type.officer:0 "[officer.GetTiledFirstNamePossessive|U] posição como meu $head_porter_camp_officer$"
 laamp_base_contract_schemes.2672.desc.resolution_type.secondary_skill:0 "Envergonhados e despertados para a ação pelo meu exemplo — e com a ajuda de alguns seguidores de [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] — as boas pessoas de [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] e eu vamos trabalhar para reparar suas defesas.\n\nFelizmente, as paredes parecem substancialmente piores do que realmente são. Um bom progresso é feito, e a um custo de apenas alguns dias de trabalho facilmente compensados por um pequeno tributo."
 laamp_base_contract_schemes.2672.desc.resolution_type.stewardship:0 "Algumas isenções menores, um passe para isso ou aquilo, o selo de [employer.GetTitleAsNamePossessiveNoTooltip] para algum projeto, e de repente todos estão #EMP muito#! mais agradáveis a um leve dever extra para pagar pelas paredes.\n\nNão importa que a reorganização de seus impostos e fardos signifique que estão pagando a mesma quantia que originalmente foi pedida, não, por enquanto é mais importante que as boas pessoas de [employer.GetPrimaryTitle.GetBaseNameNoTier] sintam que jogaram o jogo bem."
 laamp_base_contract_schemes.2672.desc.resolution_type.stress:0 "Impor ordem ao povo de [employer.GetPrimaryTitle.GetBaseNameNoTier] requer uma pesada mistura de gritos, cajoladas e culpas.\n\nÉ um trabalho cansativo, que desgasta a mente, mas um a um, os magnatas locais se alinham e concordam amargamente em pagar sua parte justa. Talvez não seja uma solução elegante, mas se funciona, funciona."
 laamp_base_contract_schemes.2672.t:0 "$laamp_base_contract_schemes.2031.t$: Sucesso!"
 laamp_base_contract_schemes.2673.a:0 "$laamp_base_contract_schemes.2663.a$"
 laamp_base_contract_schemes.2673.desc.officer:0 "Talvez [officer.GetTitledFirstName] não seja tão excelente um $head_porter_camp_officer$ quanto eu imaginei.\n\nNão passou meia hora desde os planos sugeridos [officer.GetHerHim] para reconstruir as paredes e o povo de [employer.GetPrimaryTitle.GetBaseNameNoTier] já está se atacando, gritando, berrando, chutando, mordendo, absolutamente #EMP desesperado#! para evitar a tarefa em mãos."
 laamp_base_contract_schemes.2673.desc.outro:0 "\n\nUm [employer.GetTitledFirstName] angustiado nem sequer fala comigo após essa trapalhada.\n\nFomos expulsos da cidade, sem uma única moeda por nossos problemas."
 laamp_base_contract_schemes.2673.desc.stewardship:0 "Meu plano parecia sensato o suficiente para mim, dividindo o custo primeiro igualmente entre os locais e depois ajustando um pouco para riqueza e renda, mas os magnatas reagiram com choque e horror.\n\nDe alguma forma, cada um deles estava convencido de que estava pagando demais, mesmo por este bem comum, não importa sua riqueza ou posição."
 laamp_base_contract_schemes.2673.t:0 "$laamp_base_contract_schemes.2031.t$: Falha!"
 laamp_base_contract_schemes.2676.a:0 "$laamp_base_contract_schemes.2661.a$"
 laamp_base_contract_schemes.2676.b.tt.failure:0 "$laamp_base_contract_schemes.2661.b.tt.failure$"
 laamp_base_contract_schemes.2676.b.tt.success:0 "$laamp_base_contract_schemes.2661.b.tt.success$"
 laamp_base_contract_schemes.2676.b:0 "$laamp_base_contract_schemes.2661.b$"
 laamp_base_contract_schemes.2676.c:0 "Pastagem, hein? Isso parece ser meu campo de atuação."
 laamp_base_contract_schemes.2676.d.no_valid_char:0 "Você não possui um [follower|E] disponível com pelo menos [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_other_skill_threshold_value')|0] [martial|E] para designar temporariamente para o [court|E] de [employer.GetFirstNamePossessive]"
 laamp_base_contract_schemes.2676.d.sacrifice_exists:0 "$laamp_base_contract_schemes.2661.d.sacrifice_exists$"
 laamp_base_contract_schemes.2676.d.sacrifice_unexists:0 "$laamp_base_contract_schemes.2661.d.sacrifice_unexists$"
 laamp_base_contract_schemes.2676.d.tt.courtier_stays_here:0 "$laamp_base_contract_schemes.2661.d.tt.courtier_stays_here$"
 laamp_base_contract_schemes.2676.desc.outro:0 "$laamp_base_contract_schemes.2661.desc.outro$"
 laamp_base_contract_schemes.2676.desc:0 "As ruas de [employer.GetPrimaryTitle.GetBaseNameNoTierPossessive] estão tomadas por uma febre de fofocas e escândalos — uma complicada questão de casamento, herança e arranjos comerciais que deram errado resultou em uma vasta seção das melhores terras locais para pastagem de cavalos indo para algum tolo sem dinheiro ou habilidade.\n\nConsequentemente, os magnatas locais estão ameaçando se despedaçar sobre como (e quem deve) dividir a terra."
 laamp_base_contract_schemes.2676.e.officer_exists:0 "$laamp_base_contract_schemes.2661.e.officer_exists$"
 laamp_base_contract_schemes.2676.e.officer_unexists:0 "$laamp_base_contract_schemes.2661.e.officer_unexists$"
 laamp_base_contract_schemes.2676.f:0 "Sim, sabemos uma coisa ou duas sobre cavalos."
 laamp_base_contract_schemes.2676.g:0 "$laamp_base_contract_schemes.2661.g$"
 laamp_base_contract_schemes.2676.t:0 "$laamp_base_contract_schemes.2031.t$: Pastagem Favorável"
 laamp_base_contract_schemes.2677.a:0 "$laamp_base_contract_schemes.2662.a$"
 laamp_base_contract_schemes.2677.desc.outro:0 "\n\n[employer.GetTitledFirstName|U] parece mais do que satisfeito com nossa resolução, e alegremente entrega sua moeda."
 laamp_base_contract_schemes.2677.desc.resolution_type.camp_purpose:0 "Claro, na linha de trabalho de [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessive], você aprende uma coisa ou duas sobre boas terras de pastagem.\n\nCom uma facilidade quase casual, conseguimos afastar as preocupações dos locais e dividir a terra de forma justa e adequada.\n\nA lembrança casual de um grupo de mercenários acampados nas proximidades a serviço de sua cidade [employer.Custom('MistressMaster')] também não pode prejudicar."
 laamp_base_contract_schemes.2677.desc.resolution_type.left_sacrifice:0 "[employer.GetTitledFirstName|U] e eu deixamos [sacrifice.GetTitledFirstName] nas carinhosas mãos dos magnatas locais. Mesmo enquanto nos afastamos, os gritos começam — aumentando de volume mais rápido do que conseguimos nos distanciar.\n\n\"Não era o que eu esperava como solução\", acena [employer.GetFirstNameNoTooltip] pensativamente, \"mas não posso culpá-lo por sua minuciosidade. Você tem certeza de que [sacrifice.GetSheHe] ficará bem aqui?\"\n\nLevanto uma sobrancelha.\n\n\"Ah, claro, o que estou dizendo\", balbucia o [employer.GetTitleAsNameNoTooltip], \"Vou me colocar de volta na mesma confusão a esse ritmo. Aqui, seu pagamento por nos emprestar um[Select_CString( sacrifice.IsFemale, 'a', '' )] [sacrifice.GetWomanMan] tão habilidos[Select_CString( sacrifice.IsFemale, 'a', 'o' )]."
 laamp_base_contract_schemes.2677.desc.resolution_type.officer:0 "A experiência de [officer.GetTitledFirstNamePossessive|U] com cavalos nos serve muito bem hoje.\n\nSolto sobre os locais e instruído a falar sobre uma das grandes paixões [officer.GetHerHim], [Select_CString( officer.IsFemale, 'a', 'o' )] [officer.GetWomanMan] consegue lentamente sobrepujá-los com vergonha sobre como eles cuidam de seus animais e bestas de carga, entrando em detalhes exaustivos sobre como criar animais melhores e mais saudáveis sem simplesmente discutir sobre as melhores terras de pastagem.\n\nAo final, eles estão assentindo envergonhadamente a cada crítica e detalhe, todas as discussões esquecidas."
 laamp_base_contract_schemes.2677.desc.resolution_type.secondary_skill:0 "Tenho experiência suficiente em assuntos de guerra para saber que a melhor terra nem sempre cria os melhores cavalos, nem os melhores cavalos precisam da melhor terra.\n\nCalmamente, cuidadosamente e de maneira um #EMP pouco#! condescendente, explico os erros em seu raciocínio aos magnatas de [employer.GetPrimaryTitle.GetBaseNameNoTierPossessive]. Eles estão... relutantes em ouvir, a princípio — a terra ainda é terra, afinal — mas um bom argumento sempre prevalece no final."
 laamp_base_contract_schemes.2677.desc.resolution_type.stewardship:0 "Mais uma vez, a orgulhosa habilidade familiar da Casa [ROOT.Char.GetHouse.GetName] prevalece!\n\nApesar de suas posturas, cada um dos magnatas só quer sua parte do bolo, e dentro da tarde consigo elaborar uma divisão justa da terra que deixa todos apenas um #EMP pouco#! desapontados.\n\nAté mesmo o tolo proprietário receberá alguma compensação, permitindo que as discussões diminuam para um nível gerenciável."
 laamp_base_contract_schemes.2677.desc.resolution_type.stress:0 "Com uma mente justa, muito trabalho e toda a maldita tenacidade que um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] da Casa [ROOT.Char.GetHouse.GetName] pode reunir, tudo é possível.\n\nLeva horas de discussões exaustivas chegar a algo como uma divisão justa da terra. Justa para todos, exceto para o tolo que está perdendo, realmente, mas o idiota está recebendo mais recompensas do que receberia se eu não estivesse aqui para negociar.\n\nO importante é que os magnatas estão felizes o suficiente — ou pelo menos apenas levemente resmungões — com minhas sugestões."
 laamp_base_contract_schemes.2677.t:0 "$laamp_base_contract_schemes.2031.t$: Sucesso!"
 laamp_base_contract_schemes.2678.a:0 "$laamp_base_contract_schemes.2663.a$"
 laamp_base_contract_schemes.2678.desc.officer:0 "Eu pensava que [officer.GetTitledFirstName] deveria ser #EMP bom#! com tais assuntos.\n\nInfelizmente, ou [officer.GetSheHe] sabe demais e o povo de [employer.GetPrimaryTitle.GetBaseNameNoTier] se importa muito pouco, ou [officer.GetFirstNameNoTooltip] sabe de menos e os locais se importam demais.\n\nDiscussões, acusações e batidas furiosas na mesa se seguem."
 laamp_base_contract_schemes.2678.desc.outro:0 "À noite, um [employer.GetTitledFirstName] muito angustiado nos expulsa rude, totalmente frustrado com nossa falta de progresso.\n\nParece que não teremos pagamento por hoje."
 laamp_base_contract_schemes.2678.desc.stewardship:0 "Depois de horas e horas de negociações, parece que estamos mais longe do que quando começamos.\n\nCada pequeno magnata mesquinho e sedento de poder em [employer.GetPrimaryTitle.GetBaseNameNoTier] quer a #EMP sua#! fatia de terra de valor ligeiramente acima da média, e está disposto a gritar até o teto para conseguir isso.\n\n"
 laamp_base_contract_schemes.2678.t:0 "$laamp_base_contract_schemes.2031.t$: Falha!"
 laamp_base_contract_schemes.2681.a:0 "$laamp_base_contract_schemes.2661.a$"
 laamp_base_contract_schemes.2681.b.tt.failure:0 "$laamp_base_contract_schemes.2661.b.tt.failure$"
 laamp_base_contract_schemes.2681.b.tt.success:0 "$laamp_base_contract_schemes.2661.b.tt.success$"
 laamp_base_contract_schemes.2681.b:0 "$laamp_base_contract_schemes.2661.b$"
 laamp_base_contract_schemes.2681.c:0 "Permita-me inspecionar esse mapa seu."
 laamp_base_contract_schemes.2681.d.no_valid_char:0 "Você não tem um [follower|E] disponível com pelo menos [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_other_skill_threshold_value')|0] [learning|E] para designar temporariamente para a [court|E] de [employer.GetFirstNamePossessive]"
 laamp_base_contract_schemes.2681.d.sacrifice_exists:0 "$laamp_base_contract_schemes.2661.d.sacrifice_exists$"
 laamp_base_contract_schemes.2681.d.sacrifice_unexists:0 "$laamp_base_contract_schemes.2661.d.sacrifice_unexists$"
 laamp_base_contract_schemes.2681.d.tt.courtier_stays_here:0 "$laamp_base_contract_schemes.2661.d.tt.courtier_stays_here$"
 laamp_base_contract_schemes.2681.desc:0 "Nossa chegada em [employer.GetPrimaryTitle.GetBaseNameNoTier] é recebida com pouca pompa — os locais estão em crise por causa de algum mapa antigo que foi desenterrado e #EMP completamente#! redesenha os limites entre dois dos assentamentos satélites da cidade.\n\nSem uma resolução em breve, o melhor cenário é um imposto interrompido, enquanto o pior pode ser uma pequena guerra local.$laamp_base_contract_schemes.2661.desc.outro$"
 laamp_base_contract_schemes.2681.e.officer_exists:0 "$laamp_base_contract_schemes.2661.e.officer_exists$"
 laamp_base_contract_schemes.2681.e.officer_unexists:0 "$laamp_base_contract_schemes.2661.e.officer_unexists$"
 laamp_base_contract_schemes.2681.f:0 "Um mero #EMP mapa?#! É tudo o que vocês têm?"
 laamp_base_contract_schemes.2681.g:0 "$laamp_base_contract_schemes.2661.g$"
 laamp_base_contract_schemes.2681.t:0 "$laamp_base_contract_schemes.2031.t$: Linhas em Mapas"
 laamp_base_contract_schemes.2682.a:0 "$laamp_base_contract_schemes.2662.a$"
 laamp_base_contract_schemes.2682.desc.outro:0 "\n\nOh, com certeza, alguns argumentam no início, mas à medida que as evidências continuam se acumulando, eventualmente um conspirador #EMP quebra#! sob pressão e aponta o dedo para um magnata local como o culpado.\n\nUma simples prisão depois e [employer.GetPrimaryTitle.GetBaseNameNoTier] tem algo novo para fofocar, enquanto os assentamentos satélites são forçados a se afastar um do outro.\n\nCom as tensões dissolvidas e as coisas voltando ao normal, [employer.GetTitledFirstName] agradecidamente nos entrega nosso pagamento."
 laamp_base_contract_schemes.2682.desc.resolution_type.camp_purpose:0 "Eu... talvez tenha exagerado um pouco ao explicar a relação que um frágil pedaço de pergaminho tinha com um verdadeiro, legítimo direito a algo tão importante quanto a terra.\n\nDepois da primeira hora, os locais simplesmente me encaram em estado de choque, seus rostos máscaras de vergonha, confusão e, ocasionalmente, uma admiração extasiada.\n\nA questão mesquinha do documento 'antigo' deles é deixada de lado, e um silêncio constrangedor se instala na sala.\n\n[employer.GetTitledFirstName|U] me conduz discretamente para fora e, aparentemente satisfeito, nos entrega nosso pagamento."
 laamp_base_contract_schemes.2682.desc.resolution_type.left_sacrifice:0 "Enquanto [sacrifice.GetTitledFirstName] se acomoda cansado para o longo, longo, #EMP longo#! processo de ouvir todos os lados neste debate antes de encontrar algum tipo de verdade, [employer.GetTitledFirstName] me puxa para o lado.\n\n\"Bom trabalho, [ROOT.Char.GetTitledFirstNameNoTooltip], quem diria que você tinha um[Select_CString( sacrifice.IsFemale, 'a', '' )] [sacrifice.GetWomanMan] de erudição disponível para emprestar à minha humilde cidade!\"\n\nAo fundo, [sacrifice.GetFirstNameNoTooltip] silencia uma voz estridente gritando sobre direito de nascimento.\n\n\"Não tenho dúvidas de que resolveremos isso, pelo menos a tempo. Seu pagamento está esperando do lado de fora.\""
 laamp_base_contract_schemes.2682.desc.resolution_type.officer:0 "A habilidade com a palavra falada de [officer.GetTitledFirstNamePossessive|U] é tal que [officer.GetSheHe] consegue incitar os locais #EMP apenas#! o suficiente sobre a potencial autenticidade do mapa. [officer.GetSheHe|U] os guia de um tópico para outro, até que muito da sala esteja denunciando-o como uma óbvia falsificação e explicando o porquê."
 laamp_base_contract_schemes.2682.desc.resolution_type.secondary_skill:0 "O mapa parece genuíno o suficiente — se você é um #EMP idiota#! Eu, no entanto, sou um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] de grande erudição, e demonstrar sua origem falha é uma questão tão simples quanto vestir uma túnica."
 laamp_base_contract_schemes.2682.desc.resolution_type.stewardship:0 "Felizmente, tenho um [ROOT.Char.Custom('SenseObserve_SenseEye')] aguçado para detalhes, e não leva muito tempo para apontar uma dúzia de maneiras pelas quais o mapa é uma óbvia falsificação."
 laamp_base_contract_schemes.2682.desc.resolution_type.stress:0 "Depois de horas e horas de debate, acusações e ameaças ocasionais, finalmente identifico vários indicadores-chave de que o mapa é provavelmente uma falsificação — e, portanto, sem valor."
 laamp_base_contract_schemes.2682.t:0 "$laamp_base_contract_schemes.2031.t$: Sucesso!"
 laamp_base_contract_schemes.2683.a:0 "$laamp_base_contract_schemes.2663.a$"
 laamp_base_contract_schemes.2683.desc.officer:0 "Eu esperava que a língua prateada de [officer.GetTitledFirstNamePossessive] fosse suficiente para acalmar os locais em um clima onde a razão pudesse prevalecer um pouco mais facilmente.\n\nEm vez disso, o povo de [employer.GetPrimaryTitle.GetBaseNameNoTier] se polarizou com as tentativas [officer.GetHerHim] de desarmar a situação, com até mesmo ricos magnatas dentro da própria cidade tomando lados nas disputas de suas cidades subordinadas."
 laamp_base_contract_schemes.2683.desc.outro:0 "\n\nO mapa certamente foi esquecido, mas, se alguma coisa, o povo está discutindo #EMP mais#! do que menos.\n\n[employer.GetTitledFirstName] nos informa friamente que nosso pagamento não será entregue."
 laamp_base_contract_schemes.2683.desc.stewardship:0 "Acreditei que questionar a veracidade do mapa seria o movimento certo, mas, infelizmente, fazer isso apenas gerou mais problemas: com este novo elemento de intriga, o povo de [employer.GetPrimaryTitle.GetBaseNameNoTier] começou a tomar lados em uma disputa que antes era parochial.\n\nTalvez metade acredita que meus argumentos são convincentes, indicando que #EMP alguém#! é culpado de extrema má conduta, enquanto a outra metade considera meus pontos totalmente espúrios. Ao anoitecer, toda a cidade está em pé de guerra contra si mesma."
 laamp_base_contract_schemes.2683.t:0 "$laamp_base_contract_schemes.2031.t$: Falha!"
 laamp_base_contract_schemes.2781.a:0 "Engane [local_char.GetSheHe] com números."
 laamp_base_contract_schemes.2781.b:0 "Apresento o selo de '[task_contract.GetEmployer.GetTitledFirstNamePossessiveNoTooltip]'."
 laamp_base_contract_schemes.2781.c.bard_dnae_exist:0 "Se ao menos tivéssemos um canalha de língua prateada..."
 laamp_base_contract_schemes.2781.c.bard_exists:0 "[bard.GetTitledFirstNameNoTooltip], use sua língua prateada!"
 laamp_base_contract_schemes.2781.d:0 "Passe rapidamente pela conversa."
 laamp_base_contract_schemes.2781.desc.local_mood.admiration:0 "\"Ah! Você deve ser [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetWomanMan] [Select_CString( task_contract.IsFemale, 'da', 'do' )] [task_contract.GetEmployer.GetTitleAsNamePossessiveNoTooltip]\", [local_char.GetSheHe] diz, \"posso dizer pelo seu porte honesto! Você chegou um #EMP pouco#! mais cedo do que esperávamos, mas não importa, estamos preparados.\""
 laamp_base_contract_schemes.2781.desc.local_mood.anger:0 "\"Você tem cara de pau!\" [local_char.GetSheHe] rosna, \"chegando cedo assim! Pagamos nossos tributos, assim como a próxima cidade, mas temos direito a um aviso razoável antes de você vir se aproveitar do nosso trabalho.\""
 laamp_base_contract_schemes.2781.desc.local_mood.disapproval:0 "\"Hrmph,\" [local_char.GetSheHe] resmunga, \"suponho que você acha que está sendo inteligente, chegando cedo assim. Bem, não estamos impressionados e não pagaremos nenhuma taxa por atrasá-lo.\""
 laamp_base_contract_schemes.2781.desc.local_mood.dismissal:0 "\"Oh, você chegou tão cedo?\" [local_char.GetSheHe] diz desdenhosamente, \"muito bem, siga-me. Preparamos seu... #EMP tributo#!, conforme instruído, mas não um centavo a mais.\""
 laamp_base_contract_schemes.2781.desc.local_mood.thinking:0 "\"Você... é [Select_CString( task_contract.IsFemale, 'a', 'o' )] [ROOT.Char.GetWomanMan] [Select_CString( task_contract.IsFemale, 'da', 'do' )] [task_contract.GetEmployer.GetTitleAsNamePossessiveNoTooltip]? Tão cedo?\" [local_char.GetSheHe] pergunta, \"não pensei que o esperássemos por pelo menos mais um mês... ainda assim, suponho que você parece confiável...\""
 laamp_base_contract_schemes.2781.desc.outro:0 "\n\nMais um tolo ingênuo entre nós e nosso pagamento."
 laamp_base_contract_schemes.2781.desc.surroundings.alley_day:0 "Levando nosso tempo para perambular pelas ruas do assentamento — garantindo que parecemos ocupados e auto-importantes frustrados à medida que vamos, é claro — leva algum tempo até encontrarmos [Select_CString( local_char.IsFemale, 'a', 'o' )] [local_char.GetWomanMan] infeliz eleito para gerenciar o tributo."
 laamp_base_contract_schemes.2781.desc.surroundings.alley_night:0 "Está tarde quando finalmente chegamos ao assentamento, mas não quero ficar aqui mais tempo do que precisamos. Encontramos [Select_CString( local_char.IsFemale, 'a', 'o' )] [local_char.GetWomanMan] infeliz eleito para gerenciar o tributo justo quando [local_char.GetSheHe] está fechando a loja para a noite."
 laamp_base_contract_schemes.2781.desc.surroundings.condemned_village:0 "Com a doença devastando a área, o assentamento está em péssimas condições, para dizer o mínimo. Com um pano preso a nossas bocas para manter o miasma afastado, encontramos o pobre escolhido para gerenciar o tributo, no entanto."
 laamp_base_contract_schemes.2781.desc.surroundings.docks:0 "Certificando-nos de parecer o mais pomposamente oficial possível, caminhamos em direção aos docks. Como esperado, conseguimos encontrar [Select_CString( local_char.IsFemale, 'a', 'o' )] [local_char.GetWomanMan] infeliz eleito para gerenciar o tributo lá, gritando com os marinheiros e direcionando a carga do dia."
 laamp_base_contract_schemes.2781.desc.surroundings.tavern:0 "Talvez não seja surpreendente, encontramos [Select_CString( local_char.IsFemale, 'a', 'o' )] [local_char.GetWomanMan] infeliz eleito para gerenciar o tributo em uma taverna, bebendo suas tristezas antes de nossa chegada."
 laamp_base_contract_schemes.2781.intrigue.tt.failure:0 "Isto é uma clara falsificação!"
 laamp_base_contract_schemes.2781.intrigue.tt.success:0 "Parece genuíno o suficiente."
 laamp_base_contract_schemes.2781.stewardship.tt.failure:0 "Que diabos você está falando?"
 laamp_base_contract_schemes.2781.stewardship.tt.success:0 "Claro, claro, tudo está em ordem."
 laamp_base_contract_schemes.2781.t:0 "$laamp_base_contract_schemes.2044.t$: [ROOT.Char.GetCurrentLocation.GetTitle.GetBaseNameNoTierNoTooltip]"
 laamp_base_contract_schemes.2781.tt.boost_difficulty.bard:0 "O próximo desafio de aptidão de [bard.GetFirstNamePossessive] será ainda mais difícil."
 laamp_base_contract_schemes.2781.tt.boost_difficulty.intrigue:0 "Seu próximo desafio de [intrigue|E] será ainda mais difícil."
 laamp_base_contract_schemes.2781.tt.boost_difficulty.stewardship:0 "Seu próximo desafio de [stewardship|E] será ainda mais difícil."
 laamp_base_contract_schemes.2781.tt.boost_difficulty.stress:0 "Esta opção custará ainda mais [stress|E] na próxima vez."
 laamp_base_contract_schemes.2781.tt.contract_failed:0 "#N O contrato falhou#!"
 laamp_base_contract_schemes.2781.tt.current_total.sub_t1:0 "#TUT Você tem uma pontuação de [task_contract.MakeScope.Var('wins_tally').GetValue], de [task_contract.MakeScope.Var('win_t1_threshold').GetValue] em direção a um $label_success_qualified$#!"
 laamp_base_contract_schemes.2781.tt.current_total.sub_t2:0 "#TUT Você tem uma pontuação de [task_contract.MakeScope.Var('wins_tally').GetValue], de [task_contract.MakeScope.Var('win_t2_threshold').GetValue] em direção a um $label_success_standard$ #WEAK (atualmente você ganhou um $label_success_qualified$)#!#!"
 laamp_base_contract_schemes.2781.tt.current_total.sub_t3:0 "#TUT Você tem uma pontuação de [task_contract.MakeScope.Var('wins_tally').GetValue], de [task_contract.MakeScope.Var('win_t3_threshold').GetValue] em direção a um $label_success_critical$ #WEAK (atualmente você ganhou um Sucesso)#!#!"
 laamp_base_contract_schemes.2781.tt.progress_towards_failure:0 "#N +1#! ponto em direção à falha do [task_contract|E]."
 laamp_base_contract_schemes.2781.tt.progress_towards_success:0 "#P +1#! ponto em direção à conclusão bem-sucedida do [task_contract|E]."
 laamp_base_contract_schemes.2782.a:0 "Quem disse que [ROOT.Char.Custom('GetLaampDescribeTypeSelfArticle')] [ROOT.Char.Custom('GetLaampDescribeTypeSelf')] precisa de terras para ganhar dinheiro!"
 laamp_base_contract_schemes.2782.b.tt.travel_onwards:0 "Você continua tentando um resultado melhor para seu [task_contract|E]."
 laamp_base_contract_schemes.2782.b:0 "Sem coragem, sem glória, sem ouro! Avante!"
 laamp_base_contract_schemes.2782.c:0 "Vamos jogar seguro e encerrar por aqui."
 laamp_base_contract_schemes.2782.d.tt:0 "@alert_icon! #alert_trial Esta opção é forçada porque você atingiu o melhor resultado que pode obter com o número de falhas que você acumulou#!"
 laamp_base_contract_schemes.2782.d:0 "Certo, este é o melhor que podemos fazer por enquanto."
 laamp_base_contract_schemes.2782.desc.nothing_yet:0 "Bem, estamos indo bem, mas isso é uma mera migalha comparado ao que esperamos ganhar.\n\nSe quisermos realmente levar nossa parte injusta da riqueza de [task_contract.GetEmployer.GetTitledFirstNamePossessive], devemos seguir em frente e convencer mais súditos [task_contract.GetEmployer.GetHerHim] sobre nossas... credenciais."
 laamp_base_contract_schemes.2782.desc.success_critical:0 "Hah! Que grande desventura — um [task_contract.GetEmployer.GetTitleAsNameNoTooltip] tolosamente ganancioso, um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] deslumbrantemente bonito com olho para oportunidades, e dezenas de contribuintes ingênuos que provavelmente desejam ter aprendido suas letras um pouco melhor.\n\nCom os cofres do acampamento transbordando, ponderamos nosso próximo trabalho."
 laamp_base_contract_schemes.2782.desc.success_qualified:0 "Fizemos uma boa arrecadação, mas ainda há muito dinheiro a ser extraído dos tolos súditos de [task_contract.GetEmployer.GetTitledFirstNamePossessive].\n\nSe partirmos agora, podemos provavelmente nos manter à frente do coletor de impostos que vem atrás de nós — embora, por outro lado, se formos pegos, seremos forçados a fugir e perder tudo."
 laamp_base_contract_schemes.2782.desc.success_standard:0 "Até agora, fizemos #EMP muito#! bem em nossa pequena incursão no mundo da administração.\n\nSuficiente do dinheiro de [task_contract.GetEmployer.GetTitledFirstNamePossessive] está em nossa pequena carroça de impostos falsificados (repleta de brasões mal pintados de cada lado) para saciar a avareza de mais [ROOT.Char.GetWomenMen].\n\nE ainda assim... não posso deixar de me perguntar se podemos extrair um pouco mais de sangue dessa pedra..."
 laamp_base_contract_schemes.2782.t:0 "$laamp_base_contract_schemes.2044.t$: Sucesso!"
 laamp_base_contract_schemes.2783.a:0 "Mas meu plano era perfeito!"
 laamp_base_contract_schemes.2783.b.tt.travel_onwards:0 "$laamp_base_contract_schemes.2782.b.tt.travel_onwards$"
 laamp_base_contract_schemes.2783.b:0 "É apenas um pequeno contratempo, avante!"
 laamp_base_contract_schemes.2783.c:0 "Melhor prata e viva do que ouro e morto."
 laamp_base_contract_schemes.2783.d.tt:0 "$laamp_base_contract_schemes.2782.d.tt$"
 laamp_base_contract_schemes.2783.d:0 "Vamos... vamos deixar assim..."
 laamp_base_contract_schemes.2783.desc.losing:0 "Isso foi por pouco — talvez muito por pouco.\n\nNão tinha ideia de que o povo de [ROOT.Char.GetCurrentLocation.GetTitle.GetBaseNameNoTier] era tão desconfiado. Não tenho certeza do que foi dito para excitar a dúvida deles, mas começaram a fazer perguntas, e não demorou muito até que eu ficasse sem respostas.\n\nAinda assim, pelo menos conseguimos evitar a captura com nossa colheita atual de saques, mesmo que não tenhamos conseguido mais deles."
 laamp_base_contract_schemes.2783.desc.lost:0 "Damn e explode toda a população de [ROOT.Char.GetCurrentLocation.GetTitle.GetBaseNameNoTier]! A desconfiança irracional deles e a falta de bondade com estranhos desfez tudo.\n\nEu só queria um #EMP pouco#! mais de dinheiro, mas os tolos ficaram céticos, depois alarmados, e então tomaram nossa carroça em uma fúria de cidadãos enfurecidos.\n\nFiquei com menos do que nada."
 laamp_base_contract_schemes.2783.t:0 "$laamp_base_contract_schemes.2044.t$: Falha!"
 laamp_base_contract_schemes.3001.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.3001.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.3001.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.3001.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.3001.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.3001.desc:0 "[employer.GetTitledFirstNamePossessive] pede relatórios informados sobre os acontecimentos ao redor da sua capital, atraindo todo tipo de charlatães, ansiosos para ganhar dinheiro fácil com rumores distorcidos ou fabricações óbvias.\n\nFelizmente para [employer.GetSheHe], meu grupo e eu não somos os mesmos tolos comuns que lotam o seu salão, e podemos trocar histórias #EMP interessantes#! sobre terras vizinhas — embora quão úteis elas serão dependa do bom [employer.GetTitleAsNameNoTooltip]..."
 laamp_base_contract_schemes.3001.t:0 "Reconhecimento Proativo"
 laamp_base_contract_schemes.3002.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.3002.desc:0 "Um olhar e um ouvido atentos revelarão muitas coisas à medida que o grupo viaja, com pouco esforço extra exigido além da disposição para observar e de uma memória para detalhes.\n\nUm princípio simples, mas facilmente falho pelos imprudentes e os apressados. Como esperado, nossos relatórios #EMP provam#! ser informativos o suficiente para nos garantir não apenas nosso pagamento, mas também um pouco de hospitalidade estendida.\n\nMuito para a frustração dos outros aspirantes a agentes."
 laamp_base_contract_schemes.3002.t:0 "$laamp_base_contract_schemes.3001.t$: Sucesso!"
 laamp_base_contract_schemes.3003.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.3003.desc:0 "Quando entramos em [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier], eu estava certo de que nossas histórias eram verdadeiras, relatos detalhados e úteis... não eram? Nós... estávamos tão confiantes.\n\nNo entanto, nossa estadia com [employer.GetTitledFirstName], apesar de começar amigavelmente, rapidamente se tornou problemática. Espiões enviados para seguir as pistas que criamos voltaram amargos ou não voltaram, resultando em acusações de sabotagem e malícia deliberadas, discussões que duraram muito e em alto volume.\n\nSuficiente para dizer que este não é mais um lugar seguro para nós."
 laamp_base_contract_schemes.3003.t:0 "$laamp_base_contract_schemes.3001.t$: Falha!"
 laamp_base_contract_schemes.3004.a:0 "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.3004.b:0 "$travel.mobile_domicile.option.t$"
 laamp_base_contract_schemes.3004.desc:0 "$laamp_base_contract_schemes.3001.desc$\n\nPrimeiro, porém, precisaremos visitar discretamente alguns lugares que [employer.GetFirstNameNoTooltip] está interessado em saber mais."
 laamp_base_contract_schemes.3004.t:0 "$laamp_base_contract_schemes.3001.t$"
 laamp_base_contract_schemes.3004.tt.destination_list:0 "Você imediatamente começa [viajando|E] para [destination_1.GetNameNoTier], depois [destination_2.GetNameNoTier], e depois [destination_3.GetNameNoTier]"
 laamp_base_contract_schemes.3004.tt.explanation:0 "#TUT Para completar o [task_contract|E]:\n$EFFECT_LIST_BULLET$Complete um desafio de [intrigue|E] ou [diplomacy|E] em cada destino\n$TAB$$EFFECT_LIST_BULLET$Você será desafiado pelo melhor do [ruler|E] local ou do seu [spymaster|E]\n$EFFECT_LIST_BULLET$Alternativamente, você pode garantir o sucesso queimando [prestígio|E] e [opinião|E] com eles\n$TAB$$EFFECT_LIST_BULLET$Os custos de [prestígio|E] aumentam proporcionalmente ao [title_tier|E] do [ruler|E]\n$EFFECT_LIST_BULLET$Zero sucessos resulta em um $label_failure_standard$\n$EFFECT_LIST_BULLET$Um sucesso resulta em $label_success_qualified$\n$EFFECT_LIST_BULLET$Dois sucessos resultam em $label_success_standard$\n$EFFECT_LIST_BULLET$Três sucessos resultam em $label_success_critical$#!"
 laamp_base_contract_schemes.3011.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.3011.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.3011.c:0 "$laamp_base_contract_schemes.0000.generic_option.secrecy$"
 laamp_base_contract_schemes.3011.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.3011.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.3011.desc:0 "\"Eu não preciso que seja devagar, apenas entregue [target.GetTitledFirstName] ao abraço de [employer.GetFaith.DeathDeityNamePossessive] para que eu possa parar de pensar [Select_CString( target.IsFemale, 'nela', 'nele' )], estamos claros?\" rosna [employer.GetTitledFirstName].\n\nEu aceno. Há muito que não foi dito — por que [employer.GetSheHe] quer est[Select_CString( target.IsFemale, 'a', 'e' )] [target.GetWomanMan] mort[Select_CString( target.IsFemale, 'a', 'o' )], o que está amarrando suas mãos de métodos mais comuns — mas nada disso é da minha conta.\n\nUma vida cortada e é dia de pagamento."
 laamp_base_contract_schemes.3011.t:0 "Quadrar o Círculo"
 laamp_base_contract_schemes.3012.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.3012.desc:0 "\"Seu recibo, [employer.GetTitleAsNameNoTooltip],\" digo, deixando o saco úmido no chão de [employer.GetFirstNameNicknamedPossessive]. O tecido ensopado se inclina para o lado, expondo uma mecha desgrenhada de cabelo de [target.GetTitledFirstNamePossessive].\n\n\"Você levou 'traga-me a cabeça [target.GetHerHim]' um pouco ao pé da letra,\" grunhe [employer.GetSheHe], \"deve ter sido um inferno fazer isso e tudo. Ainda assim, um trabalho bem feito. Seu pagamento está com o servo lá fora.\"\n\nEu inclino a cabeça respeitosamente e parto."
 laamp_base_contract_schemes.3012.t:0 "$laamp_base_contract_schemes.3011.t$: Sucesso!"
 laamp_base_contract_schemes.3013.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.3013.desc:0 "\"Então agora [target.GetTitledFirstName] sabe que alguém está atrás da cabeça [target.GetHerHim]? Seu idiota!\" rosna [employer.GetTitledFirstName], \"por que eu #EMP confiei#! em você? Gah!\"\n\nEu encolho os ombros, abrindo a boca para explicar o... erro que viu nossa presa escapar da ruína [target.GetHerHim], mas a mão de [employer.GetFirstNamePossessiveNoTooltip] se move rapidamente, o dedo apontando para o pátio lá fora.\n\n\"Você não receberá pagamento por um trabalho não concluído. Saia do meu [employer.Custom('FortifiedBuilding')] antes que eu descarregue minha decepção em #EMP você#!.\""
 laamp_base_contract_schemes.3013.t:0 "$laamp_base_contract_schemes.3011.t$: Falha!"
 laamp_base_contract_schemes.3021.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.3021.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.3021.c:0 "$laamp_base_contract_schemes.0000.generic_option.secrecy$"
 laamp_base_contract_schemes.3021.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.3021.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.3021.desc:0 "As instruções de [employer.GetTitledFirstName] são claras: encontre um momento em que [target.GetTitledFirstName] esteja vulnerável, elimine quaisquer guardas que [target.GetSheHe] possa ter e traga [target.GetSheHe] de volta a [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier] vivo e acorrentado.\n\nSimples o suficiente. O bom [employer.GetTitleAsNameNoTooltip] não entrou em grandes detalhes sobre exatamente #EMP por que#! [employer.GetSheHe] quer que est[Select_CString( target.IsFemale, 'a', 'e' )] [target.GetWomanMan] em particular seja sequestrado por bandidos clandestinos, mas não é realmente nosso lugar perguntar."
 laamp_base_contract_schemes.3021.t:0 "Aquisições Hostis"
 laamp_base_contract_schemes.3022.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.3022.desc:0 "\"[employer.GetTitledFirstName],\" cospe [target.GetTitledFirstName] enquanto eu puxo o saco em sua cabeça, \"eu deveria ter sabido que era #EMP você#!.\"\n\n[employer.GetFirstNameNoTooltip] [employer.Custom('Saying_3p_SmilesSeems')] e faz um gesto para que o prisioneiro se ajoelhe. Sem cerimônia, eu dou um chute [Select_CString( target.IsFemale, 'nela', 'nele' )] na parte baixa das costas, fazendo com que [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetWomanMan] se espatife no chão.\n\n\"Um trabalho excelente, [ROOT.Char.GetFirstNameNoTooltip],\" exulta meu empregador enquanto [employer.GetSheHe] me joga uma bolsa pesada, \"vale cada moeda.\""
 laamp_base_contract_schemes.3022.t:0 "$laamp_base_contract_schemes.3021.t$: Sucesso!"
 laamp_base_contract_schemes.3023.a:0 "Deixar o escritório."
 laamp_base_contract_schemes.3023.desc:0 "\"Estou vendo uma falta distinta de [target.GetFirstName], [ROOT.Char.GetFirstNameNoTooltip],\" alfineta [employer.GetTitledFirstName] gesticulando ao redor do escritório [employer.GetHerHim]. \"Tínhamos um contrato em que você traria o idiota até mim, e ainda não estou vendo o idiota que pedi, estou?\"\n\nEu cerro os dentes e sacudo a cabeça.\n\n\"Você tem sorte de eu estar focado em outra presa, [ROOT.Char.Custom('GetLaampDescribeTypeInsult')]. Agora saia, antes que você desperdice mais da minha boa vontade.\""
 laamp_base_contract_schemes.3023.t:0 "$laamp_base_contract_schemes.3021.t$: Falha!"
 laamp_base_contract_schemes.3031.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.3031.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.3031.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.3031.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.3031.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.3031.desc:0 "A conversa com [employer.GetTitledFirstName] foi... iluminadora. [employer.GetSheHe|U] parece incandescentemente furioso por algum pequeno insulto de [target.GetFirstNameNoTooltip], real ou imaginário, e ansioso para colocar [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetWomanMan] em seu lugar, mas ainda não preparado para derramar muito sangue.\n\nO plano do [employer.GetTitleAsNamePossessiveNoTooltip] é que incendeiem algum patrimônio menor pertencente a [target.GetFirstNameNoTooltip]. Satisfazer o pedido sem dúvida inflará as tensões, mas um trabalho é um trabalho."
 laamp_base_contract_schemes.3031.t:0 "Conversas Incendiárias"
 laamp_base_contract_schemes.3032.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.3032.desc:0 "Minha equipe e eu estamos mais do que felizes em relatar nosso incêndio bem-sucedido a [employer.GetTitledFirstName], cuja [employer.Custom('PartAglow_EyesFaceBody')] enquanto [employer.GetSheHe] ouve nossa história de subterfúgio e fogo.\n\n\"#EMP Bom#!, bom! Excelente trabalho, [ROOT.Char.GetFirstName],\" ri o [employer.GetTitleAsNameNoTooltip], \"[target.GetFirstName] vai sentir isso por um bom tempo.\"\n\nCom um gesto, um servo entra, trazendo nosso pagamento em prata."
 laamp_base_contract_schemes.3032.t:0 "$laamp_base_contract_schemes.3031.t$: Sucesso!"
 laamp_base_contract_schemes.3033.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.3033.desc:0 "Nossa tentativa de incêndio logo se transformou em um banho de sangue em pânico: um servo nos pegou e levantou o alarme antes que pudéssemos perfurar o bastardo.\n\nNa luta que se seguiu, embora tenhamos manchado nossas espadas com mais sangue deles do que eles com o nosso, a única pequena chama que havíamos acendido foi apagada.\n\n[employer.GetTitledFirstName] se recusa até a nos ver para que possamos explicar. Muito ocupado para nos punir, mas também sem chance de pagamento."
 laamp_base_contract_schemes.3033.t:0 "$laamp_base_contract_schemes.3031.t$: Falha!"
 laamp_base_contract_schemes.3034.a:0 "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.3034.b:0 "$travel.mobile_domicile.option.t$"
 laamp_base_contract_schemes.3034.desc:0 "A carta de [employer.GetTitledFirstName] foi... iluminadora. [employer.GetSheHe|U] parece incandescentemente furioso por algum pequeno insulto de [target.GetFirstNameNoTooltip], real ou imaginário, e ansioso para colocar [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetWomanMan] em seu lugar, mas ainda não preparado para derramar muito sangue.\n\nO plano do [employer.GetTitleAsNamePossessiveNoTooltip] é que incendeiem algum patrimônio menor com o qual [target.GetFirstNameNoTooltip] esteja envolvido, ou então reduzi-lo da maneira que parecer mais adequada.\n\nSatisfazer o pedido sem dúvida inflará as tensões, mas um trabalho é um trabalho."
 laamp_base_contract_schemes.3034.t:0 "$laamp_base_contract_schemes.3031.t$"
 laamp_base_contract_schemes.3034.tt.destination_list:0 "Você imediatamente começa [traveling|E] para [destination_1.GetNameNoTier]"
 laamp_base_contract_schemes.3034.tt.explanation:0 "#TUT Para completar o [task_contract|E]:\n$EFFECT_LIST_BULLET$Complete um desafio de [intrigue|E], [martial|E] ou [prowess|E], ou vários tipos de desafio de [officer|E] [aptitude|E] no destino\n$EFFECT_LIST_BULLET$[intrigue|E] está sempre disponível\n$EFFECT_LIST_BULLET$Se você pode testar [martial|E] ou [prowess|E] depende do alvo\n$EFFECT_LIST_BULLET$Seu melhor [officer|E] válido também estará disponível, dependendo do alvo\n$EFFECT_LIST_BULLET$Você poderá desistir apenas por um $label_failure_qualified$ ao chegar, se achar que os desafios são muito difíceis#!"
 laamp_base_contract_schemes.3041.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.3041.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.3041.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.3041.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.3041.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.3041.desc:0 "O reconhecimento preliminar em [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier] sugere que #EMP talvez#! consigamos escapar com isso: não é o único lugar que [employer.GetTitledFirstName] guarda suas moedas, mas as posses [employer.GetHerHim] aqui definitivamente têm #EMP bastante#!, e os guardas não parecem esperar hostilidades.\n\nEm outras palavras, arriscado, mas viável.\n\nTudo o que precisamos é de um plano astuto..."
 laamp_base_contract_schemes.3041.t:0 "Um Pouco de Roubo"
 laamp_base_contract_schemes.3042.a:0 "[employer.GetTitledFirstNameNoTooltip], que idiota!"
 laamp_base_contract_schemes.3042.b.tt.current_earnings:0 "#TUT Seus ganhos com o contrato já foram assegurados e permanecerão seus, independentemente#!"
 laamp_base_contract_schemes.3042.b.tt.explanation:0 "#TUT Ao retornar, você irá:\n$EFFECT_LIST_BULLET$Sempre poder testar sua [intrigue|E] para roubar mais\n$EFFECT_LIST_BULLET$Testar um dos seguintes aleatoriamente:\n$TAB$$EFFECT_LIST_BULLET$[martial|E], [prowess|E] ou [stewardship|E]\n$TAB$$EFFECT_LIST_BULLET$O [prowess|E] ou [intrigue|E] de um de seus [agents|E]\n$TAB$$EFFECT_LIST_BULLET$A aptidão de seu [GetCourtPositionType('master_thief_camp_officer').GetName()] ou [GetCourtPositionType('master_of_spoils_camp_officer').GetName()]\n$EFFECT_LIST_BULLET$Assumir [stress|E] para passar automaticamente em um teste\n$EFFECT_LIST_BULLET$Escapar com seus ganhos\n$EFFECT_LIST_BULLET$Se falhar duas vezes, você será preso e seus ganhos serão confiscados#!\n$EFFECT_LIST_BULLET$Você ganha experiência extra de [GetTrait('gallowsbait').GetName( GetNullCharacter )] proporcional ao quanto roubar"
 laamp_base_contract_schemes.3042.b.tt.possible_haul:0 "[employer.GetTitledFirstName] tem até [gold_i][varcheck.MakeScope.Var('haul_possible').GetValue|P0] de [gold|E] e acessórios saqueáveis restantes, que podem ser roubados em incrementos de [gold_i][varcheck.MakeScope.Var('haul_increment').GetValue|P0]"
 laamp_base_contract_schemes.3042.b.tt.you_go_back_for_more:0 "Volte para o [employer.Custom('ResidenceBuilding')|l], pronto para saquear!"
 laamp_base_contract_schemes.3042.b:0 "Sabe... ainda tem muito mais lá dentro..."
 laamp_base_contract_schemes.3042.desc:0 "Como diabretes cutucando o nariz de [ROOT.Char.GetFaith.WealthGodName], meu bando e eu nos esgueiramos para dentro do tesouro.\n\nUma fechadura aberta silenciosamente aqui, um sentinela esfaqueado prudentemente ali, e de repente... a riqueza de [employer.GetPrimaryTitle.GetNameNoTier] revelada diante de nós.\n\nNossos sacos são enchidos o mais rápido possível, e nós partimos. Que se danem as consequências.\n\nSó esperamos que não nós."
 laamp_base_contract_schemes.3042.t:0 "$laamp_base_contract_schemes.3041.t$: Sucesso!"
 laamp_base_contract_schemes.3043.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.3043.desc:0 "Droga e maldição!\n\nO tesouro de [employer.GetFirstNamePossessiveNoTooltip|U] tinha mais guardas do que pensávamos, em patrulhas diferentes das que esperávamos — até a lua nos traiu com uma noite intensamente iluminada...\n\nNossa infiltração se deteriorou em um desastre sangrento logo após escalarmos o muro externo. Não temos prata para mostrar, apenas criados em perseguição feroz e feridas ardentes para recompensar nossos esforços."
 laamp_base_contract_schemes.3043.t:0 "$laamp_base_contract_schemes.3041.t$: Falha!"
 laamp_base_contract_schemes.3301.a.tt.failure:0 "[intrigue_duellist.GetFirstNameNoTooltip] te atrapalha"
 laamp_base_contract_schemes.3301.a.tt.success:0 "Vários detalhes úteis"
 laamp_base_contract_schemes.3301.a:0 "Vou colocar meu ouvido no chão..."
 laamp_base_contract_schemes.3301.b.tt.failure:0 "[diplomacy_duellist.GetFirstNameNoTooltip] mantém o tribunal em silêncio"
 laamp_base_contract_schemes.3301.b.tt.success:0 "Palavras que não deveriam ter sido compartilhadas"
 laamp_base_contract_schemes.3301.b:0 "Hora de usar meus encantos!"
 laamp_base_contract_schemes.3301.c:0 "Interrogue quem pudermos e vamos embora."
 laamp_base_contract_schemes.3301.d.tt.skip_the_attempt:0 "Você não coleta #N nenhuma#! inteligência aqui"
 laamp_base_contract_schemes.3301.d:0 "Não vamos brincar com [current_char.GetFirstNameNoTooltip]."
 laamp_base_contract_schemes.3301.desc.mundane_feast:0 "Toda a empolgação em [current_barony.GetNameNoTier] está, no momento, direcionada exclusivamente para um banquete menor que [current_char.GetTitledFirstName] pretende realizar.\n\nInfelizmente, o evento será #EMP apenas#! grandioso o suficiente para capturar a imaginação de cada espalhador de rumores de meia moeda, fofoqueiro tagarela e vigarista que escuta pela cidade.\n\nToda a conversa gira em torno de quem provavelmente será convidado e quem não, que comida será servida, que entretenimento o [current_char.GetTitleAsNameNoTooltip] proporcionará... não exatamente o melhor ambiente para investigar mais informações #EMP estratégicas#!."
 laamp_base_contract_schemes.3301.desc.mundane_nothing:0 "Infelizmente, há pouco talk de qualquer coisa de importância em [current_barony.GetNameNoTier] no momento.\n\nAh, há a habitual gama de dramas mesquinhos entre os plebeus, mas nada especialmente escandaloso ou interessante — o que é um problema, porque faz com que estranhos aparecendo e fazendo perguntas sejam uma ocorrência incomum.\n\nAinda assim, temos que buscar qualquer informação que pudermos obter nesta cidade monótona."
 laamp_base_contract_schemes.3301.desc.rumblings_affair:0 "A fofoca se espalha entre os plebeus mais rápido que fogo por uma cidade antiga, e não há fofoca que se espalhe mais rápido do que rumores sobre [Select_CString( current_char.IsFemale, 'a', 'o' )] [current_char.GetLadyLord|U] de [current_barony.GetNameNoTier] suspeitando de adultério.\n\nClaro, ninguém ousaria voar algo tão ousado completamente abertamente — mas atrás de portas fechadas, após uma taça de vinho ou duas, e com figuras misteriosas vistas pelo tribunal...\n\nAs pessoas estão reservadas, mas sua sede por escândalos ainda as torna vulneráveis a um pouco de questionamento tático."
 laamp_base_contract_schemes.3301.desc.rumblings_murder:0 "Embora ninguém possa afirmar com certeza, a palavra que paira nos lábios de todos aqui em [current_barony.GetNameNoTier] é #EMP assassinato#!.\n\nAlguns dizem que é [current_char.GetTitledFirstName] [current_char.GetHerselfHimself], a paciência desgastada fazendo [current_char.GetSheHe] desejar a morte prematura de algum pobre tolo. Outros dizem que o enredo rumoroso é na verdade #EMP contra#! o [current_char.GetTitleAsNameNoTooltip], ou meramente a disputa política de alguns dos cortesãos mais cruéis [current_char.GetHerHim] uns contra os outros.\n\nQualquer que seja a verdade, todo mundo é um ávido fofoqueiro agora.\n\nÚtil, isso."
 laamp_base_contract_schemes.3301.desc.rumblings_war:0 "As ruas de [current_barony.GetNameNoTier] estão em polvorosa com sussurros de guerra e sangue, com muitos locais absolutamente #EMP convencidos#! de que [current_char.GetTitledFirstName] planeja um conflito — em breve.\n\nClaro, a guerra não é uma ocorrência rara, o que torna ainda mais fácil para os fofoqueiros e espalhadores de rumores agitar medos quando não há muito mais para preencher as longas noites.\n\nVerdade ou não, isso gera muitos faladores que estão positivamente #EMP ansiosos#! para compartilhar suas opiniões e o que ouviram com um estranho empreendedor."
 laamp_base_contract_schemes.3301.desc.scandal_affair:0 "Talvez não consigamos entrar na corte de [current_char.GetTitledFirstNamePossessive] sem levantar algumas sobrancelhas, mas parece que mal precisamos: os locais estão agitados com rumores de infidelidade.\n\nNinguém #EMP muito#! alto, mas um caso inesperado adiciona um pouco de tempero à monotonia da vida cotidiana em [current_barony.GetNameNoTier].\n\nFelizmente para nós, com tantas línguas soltas, deve ser relativamente fácil trabalhar com os servos e os cortesãos menores em busca de migalhas de fofoca útil."
 laamp_base_contract_schemes.3301.desc.scandal_bribery:0 "Todo o papo em [current_barony.GetNameNoTier] é sobre algum oficial em [current_char.GetTitledFirstNamePossessive] pego aceitando uma #EMP quantia verdadeiramente#! estonteante de subornos contraditórios.\n\nUm pouco de corrupção aqui e ali não é nada incomum, para muitos funcionários públicos é uma parte esperada de seu salário, mas essas coisas têm limites.\n\nAqui, esses limites foram esticados muito além do breaking point.\n\nMás notícias para o [current_char.GetTitleAsNameNoTooltip], excelentes notícias para quem tem interesse em locais agitados com histórias para contar."
 laamp_base_contract_schemes.3301.desc.scandal_loan:0 "Baixos murmúrios e lamentações parecem preencher [current_barony.GetNameNoTier], a conversa irritada dos levemente escandalizados.\n\nParece que um credor local está cobrando várias dívidas por toda a cidade, perturbando os locais mais do que um imposto inesperado. Pior, isso está sendo feito com a aprovação tácita de [current_char.GetTitledFirstName] — para muitos, uma traição imperdoável.\n\nNão é a melhor atmosfera para fazer perguntas incisivas, mas longe de ser a pior para encontrar servos amargurados com a língua solta."
 laamp_base_contract_schemes.3301.desc.scandal_manslaughter:0 "Há sangue nas ruas de [current_barony.GetNameNoTier], e embora [current_char.GetTitledFirstName] não tenha empunhado a lâmina, foi a palavra [current_char.GetHerHim] que a pôs em movimento.\n\nUma ordem local — estabelecida de acordo com a especificação exata do [current_char.GetTitleAsNameNoTooltip] — se mostrou assustadoramente impopular. Um humilde oficial tentando aplicá-la, razoavelmente bem visto por sua mente justa e cabeça clara, foi abatido há apenas dois dias em um lamentável crime passional.\n\nCom tantas conversas acaloradas e acusações de culpa abundando, segredos devem ser fáceis de extrair dos locais."
 laamp_base_contract_schemes.3301.desc.scandal_torture:0 "Mesmo sem obter acesso direto à corte de [current_char.GetTitledFirstNamePossessive], o burburinho interno é o assunto mais comentado em [current_barony.GetNameNoTier].\n\nParece que um magnata local, buscando a recuperação de dívidas ou a vingança de algum insulto, se entregou em excesso à tortura de seu rival e deixou para trás apenas a casca quebrada de uma pessoa.\n\nO [current_char.GetTitleAsNameNoTooltip] foi convocado para intervir e aplicar a punição, mas parece relutante por alguma razão.\n\nInfelizmente para a vítima, mas uma #EMP atmosfera perfeita#! para fazer perguntas salientes sem levantar suspeitas."
 laamp_base_contract_schemes.3301.t:0 "$laamp_base_contract_schemes.3004.t$: [current_barony.GetNameNoTierNoTooltip]"
 laamp_base_contract_schemes.3301.tt.plus_one_success:0 "#P +1#! inteligência coletada"
 laamp_base_contract_schemes.3302.a:0 "Tal recompensa por alguns sussurros!"
 laamp_base_contract_schemes.3302.desc.intro:0 "Os agentes de [employer.GetTitledFirstNamePossessive] nos encontram em [current_barony.GetNameNoTier], ansiosos para levar nosso relatório [Select_CString( employer.IsFemale, 'a sua', 'ao seu' )] [employer.GetLadyLord].\n\n"
 laamp_base_contract_schemes.3302.desc.outro:0 "os espiões do [employer.GetTitleAsNamePossessiveNoTooltip] trazem nosso pagamento acordado.\n\nDiscretamente, é claro."
 laamp_base_contract_schemes.3302.desc.win.critical:0 "E realmente temos #EMP um#! relatório preparado, um levantamento minucioso de cada transação, rumor e segredo revelado de [destination_1.GetNameNoTier] até [destination_2.GetNameNoTier] — mais do que suficiente para manter o mestre de espiões de [employer.GetFirstNamePossessiveNoTooltip] ocupado com pistas e intrigas por meses a fio.\n\nGratos pelo nosso trabalho de campo,"
 laamp_base_contract_schemes.3302.desc.win.qualified:0 "É... não muito. Com nossos rumores e boatos coletados sendo tão escassos, há comparativamente pouco aqui para o mestre de espiões de [employer.GetFirstNamePossessiveNoTooltip] trabalhar. Pouco, mas não exatamente #EMP nada#!.\n\nUma curta conversa resmungada depois,"
 laamp_base_contract_schemes.3302.desc.win.standard:0 "Felizmente, conseguimos extrair informações suficientes para atraí-los. Talvez não tudo o que poderíamos, mas o suficiente para proporcionar bastante trabalho ao mestre de espiões de [employer.GetFirstNamePossessiveNoTooltip], e elicitar murmúrios satisfeitos de nossos contatos.\n\nGratos pelo nosso trabalho de campo,"
 laamp_base_contract_schemes.3302.t:0 "$laamp_base_contract_schemes.3004.t$: Sucesso!"
 laamp_base_contract_schemes.3303.a:0 "[employer.GetSheHe|U] que negocia rumores carrega um estoque pobre."
 laamp_base_contract_schemes.3303.desc:0 "Os agentes de [employer.GetTitledFirstNamePossessive] nos encontram em [current_barony.GetNameNoTier], mas apenas brevemente — assim que nossas desculpas pela total falta de informações confiáveis a compartilhar começam a fluir, os espiões percebem que falhamos.\n\nFomos rapidamente informados para não perder o tempo do [employer.GetTitleAsNamePossessiveNoTooltip] com nossas palhaçadas, nem buscar a ajuda [employer.GetHerHim] no futuro, antes de sua rápida desaparição.\n\nTalvez a espionagem não seja o jogo certo para [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] como nós..."
 laamp_base_contract_schemes.3303.t:0 "$laamp_base_contract_schemes.3004.t$: Falha!"
 laamp_base_contract_schemes.3661.a:0 "Fique em silêncio: estaremos longe assim que o fogo pegar."
 laamp_base_contract_schemes.3661.b:0 "Pares habituais, todos. Cubra as saídas, mantenha a calma."
 laamp_base_contract_schemes.3661.c:0 "Dois atrás, quatro de cada lado, vamos nos mover."
 laamp_base_contract_schemes.3661.d:0 "Machados prontos e vamos ficar #EMP sangrentos!#!"
 laamp_base_contract_schemes.3661.desc.business.bridge:0 "uma ponte de pedágio, com torres de pedra se projetando longe ao redor do rio que flanqueiam."
 laamp_base_contract_schemes.3661.desc.business.docks:0 "um amplo armazém de madeira ao lado dos cais, positivamente cheio de lenha."
 laamp_base_contract_schemes.3661.desc.business.fallback:0 "uma pequena mas próspera oficina, com uma placa recém-pintada pendurada do lado de fora para indicar o patrocínio."
 laamp_base_contract_schemes.3661.desc.business.inn_exterior:0 "uma estalagem à beira da estrada, logo fora da cidade, claramente algo de um favorito local. Por enquanto."
 laamp_base_contract_schemes.3661.desc.business.kennels:0 "um canil fedido, cheio até a borda com cães latindo."
 laamp_base_contract_schemes.3661.desc.business.market:0 "uma pequena praça de mercado, cercada por uma multidão de casas densamente agrupadas."
 laamp_base_contract_schemes.3661.desc.business.mews:0 "uma horta próspera, com suas muitas aves de caça já devidamente contidas para a noite."
 laamp_base_contract_schemes.3661.desc.business.relaxing_room:0 "uma casa de bem-estar, talvez a segunda residência de um lord ou lady."
 laamp_base_contract_schemes.3661.desc.business.shrine:0 "um[target.GetFaith.HouseOfWorship] humilde à fé [target.GetFaith.GetAdjective], claramente construído recentemente e com carinho."
 laamp_base_contract_schemes.3661.desc.business.tavern:0 "uma taverna movimentada, cheia de fregueses rindo. Uma taverna que precisa queimar."
 laamp_base_contract_schemes.3661.desc.business.winery:0 "uma vinícola bem abastecida, repleta de barril após barril de vinhos finos. São os barris, o doce vinho, que estamos aqui para destruir."
 laamp_base_contract_schemes.3661.desc.intro:0 "[destination_1.GetBaseNameNoTier] parece um lugar agradável — uma pena visitá-lo sob tais circunstâncias desagradáveis.\n\nPerto do anoitecer, um pequeno grupo de meus seguidores e eu aguardamos nas sombras não muito longe de nosso alvo:"
 laamp_base_contract_schemes.3661.desc.outro:0 "\n\n[employer.GetTitledFirstName] não achou necessário explicar se sua vítima, [target.GetTitledFirstName], possuía o lugar, tinha interesses ali ou apenas nutria algum afeto por ele.\n\nLogo não importará de qualquer forma."
 laamp_base_contract_schemes.3661.e:0 "Espero que todos estejam prontos para isso, #EMP ataque!#!"
 laamp_base_contract_schemes.3661.f:0 "[officer.GetFirstNameNoTooltip], você tem algo venenoso?"
 laamp_base_contract_schemes.3661.g:0 "[officer.GetFirstNameNoTooltip], acha que consegue entrar sem ser visto?"
 laamp_base_contract_schemes.3661.h:0 "[officer.GetFirstNameNoTooltip], acha que consegue acertar uma flecha incendiária naquela parte?"
 laamp_base_contract_schemes.3661.i.dog_on_birds:0 "[officer.GetFirstNameNoTooltip], solte seus cães sobre eles."
 laamp_base_contract_schemes.3661.i.poison_barrels:0 "[officer.GetFirstNameNoTooltip], você tem algo para... #EMP contaminar#! os barris?"
 laamp_base_contract_schemes.3661.i.steal_dogs:0 "[officer.GetFirstNameNoTooltip], traga-me aqueles cães!"
 laamp_base_contract_schemes.3661.j:0 "[officer.GetFirstNameNoTooltip], onde pegará fogo mais facilmente?"
 laamp_base_contract_schemes.3661.k:0 "[officer.GetFirstNameNoTooltip], leve seu grupo pelo outro lado."
 laamp_base_contract_schemes.3661.l:0 "[officer.GetFirstNameNoTooltip], prepare seu grupo."
 laamp_base_contract_schemes.3661.m:0 "[officer.GetFirstNameNoTooltip], você pegue o outro caminho — vamos saquear depois."
 laamp_base_contract_schemes.3661.n:0 "[officer.GetFirstNameNoTooltip], acha que podemos envenenar tudo?"
 laamp_base_contract_schemes.3661.o.lacking_officers.forager_kenneler_cook:0 "Você não tem nem um [GetCourtPositionType('chief_forager_camp_officer').GetName()], nem um [GetCourtPositionType('kennelperson_camp_officer').GetName()], nem um [GetCourtPositionType('camp_cook_camp_officer').GetName()]"
 laamp_base_contract_schemes.3661.o.lacking_officers.moa_mos_man_haggler:0 "Você não tem nem um [GetCourtPositionType('master_of_arms_camp_officer').GetName()], nem um [GetCourtPositionType('master_of_spoils_camp_officer').GetName()], nem um [GetCourtPositionType('person_haggler_camp_officer').GetName()]"
 laamp_base_contract_schemes.3661.o.lacking_officers.thief_huntsman_engineer:0 "Você não tem nem um [GetCourtPositionType('master_thief_camp_officer').GetName()], nem um [GetCourtPositionType('huntperson_camp_officer').GetName()], nem um [GetCourtPositionType('chief_engineer_camp_officer').GetName()]"
 laamp_base_contract_schemes.3661.o:0 "Se ao menos eu tivesse um oficial adequado para isso..."
 laamp_base_contract_schemes.3661.p:0 "Eu... não acho que quero fazer isso..."
 laamp_base_contract_schemes.3661.t:0 "$laamp_base_contract_schemes.3031.t$: [destination_1.GetBaseNameNoTierNoTooltip]"
 laamp_base_contract_schemes.3661.tt.duel_failure:0 "Contrato falhou"
 laamp_base_contract_schemes.3661.tt.duel_success:0 "Tarefa concluída"
 laamp_base_contract_schemes.3661.tt.stealth_foregone_extra_gallowsbait:0 "#TUT Este método irá #N revelar sua identidade#!, aumentando o [GetTrait('gallowsbait').GetName( GetNullCharacter )] ganho — mas é #P mais fácil no geral#!#!"
 laamp_base_contract_schemes.3661.tt.stealth_maintained_no_gallowsbait:0 "#TUT Este método irá #P preservar sua anonimidade#!, reduzindo [GetTrait('gallowsbait').GetName( GetNullCharacter )]#!"
 laamp_base_contract_schemes.3662.a:0 "Uma vitória digna merece uma bolsa gorda!"
 laamp_base_contract_schemes.3662.b:0 "Hah, deixem-os saber que fui eu, de qualquer forma!"
 laamp_base_contract_schemes.3662.desc.business.bridge:0 "as torres em chamas da ponte de pedágio provam isso de forma inegável."
 laamp_base_contract_schemes.3662.desc.business.docks:0 "a fachada ainda ardente do armazém, lentamente tombando na água à sua frente, apenas demonstra isso."
 laamp_base_contract_schemes.3662.desc.business.fallback:0 "casco em chamas da pequena oficina é um testemunho em ruínas disso."
 laamp_base_contract_schemes.3662.desc.business.inn_exterior:0 "casco despojado da estalagem incendiada testemunha esse fato."
 laamp_base_contract_schemes.3662.desc.business.kennels:0 "o completo silêncio dos antigos canis é simplesmente a confirmação disso."
 laamp_base_contract_schemes.3662.desc.business.market:0 "a carnificina silenciosa no mercado mostra isso de forma indiscutível."
 laamp_base_contract_schemes.3662.desc.business.mews:0 "a horta agora silenciosa é um testemunho mudo disso."
 laamp_base_contract_schemes.3662.desc.business.relaxing_room:0 "ruína fumegante da casa simplesmente demonstra a verdade daquele velho ditado."
 laamp_base_contract_schemes.3662.desc.business.shrine:0 "um[target.GetFaith.HouseOfWorship] profanado queimando preguiçosamente à beira da estrada oferece ampla prova disso."
 laamp_base_contract_schemes.3662.desc.business.tavern:0 "ruína em chamas da taverna é uma prova simples disso."
 laamp_base_contract_schemes.3662.desc.business.winery:0 "vinícola saqueada é uma prova suficiente disso."
 laamp_base_contract_schemes.3662.desc.intro:0 "Um bom plano gera uma vitória rápida, e o"
 laamp_base_contract_schemes.3662.desc.method.armsman:0 "$laamp_base_contract_schemes.3662.desc.method.haggler$"
 laamp_base_contract_schemes.3662.desc.method.cook:0 "$laamp_base_contract_schemes.3662.desc.method.forager$"
 laamp_base_contract_schemes.3662.desc.method.engineer:0 "[officer.GetTitledFirstName] rapidamente identificou várias vulnerabilidades-chave na estrutura, nos pedindo para colocar piche e tocha em cada lugar escolhido por [officer.GetSheHe]. O edifício pegou fogo em minutos, e fugimos antes que os primeiros gritos começassem a sair de dentro.\n\n"
 laamp_base_contract_schemes.3662.desc.method.forager:0 "Uma vez dentro, não demora muito para [officer.GetTitledFirstName] fazer seu trabalho sórdido — um pouco de veneno vai longe, e parece que [officer.GetSheHe] trouxe bastante da substância. Eu deveria, talvez, me preocupar com isso, mas é um problema para outro dia.\n\nSe [target.GetTitledFirstName] esperava conseguir algo aqui, então [target.GetSheHe] terá uma surpresa infeliz, embora"
 laamp_base_contract_schemes.3662.desc.method.haggler:0 "Entre um súbito ataque de meus soldados e o grupo de [officer.GetTitledFirstNamePossessive], cada um atacando de lados diferentes, os defensores surpresos não tiveram chance. Nós simplesmente os cortamos, de ponta a ponta, derrubando cada um em sequência como milho maduro e colocando o pequeno estabelecimento em chamas depois.\n\n"
 laamp_base_contract_schemes.3662.desc.method.huntperson:0 "O alvo de [officer.GetTitledFirstNamePossessive] é verdadeiro e a flecha [officer.GetHerHim] se crava firmemente em uma viga de madeira seca e rachada, bem alta nas vigas, longe de qualquer lugar que possa ser facilmente apagado. Silenciosamente, esperamos e observamos, desejando que a chama lentamente comece a tomar conta até que o cheiro de fumaça comece a encher nossas narinas.\n\nBom o suficiente para deixar, certo da convicção de que"
 laamp_base_contract_schemes.3662.desc.method.intrigue:0 "Com velocidade e furtividade — sem mencionar a falta de oposição sóbria — meus seguidores e eu rapidamente acendemos vários incêndios e recuamos com agilidade. As chamas fizeram o trabalho, e nós simplesmente tivemos que voltar pela manhã para checar os resultados.\n\nPelo que parece,"
 laamp_base_contract_schemes.3662.desc.method.kenneler.dog_on_birds:0 "Os métodos de [officer.GetTitledFirstNamePossessive] são barulhentos, mas eficazes. Segurando vários cães rosnando e mordendo, [officer.GetSheHe] desaparece na horta. Por um minuto ou dois, o mundo ganha vida com os sons de latidos, mordidas e rasgos, aves de rapina morrendo em grande quantidade enquanto algumas sortudas fogem pelas portas abertas.\n\nQuando meu $kennelperson_camp_officer$ emerge, estamos prestes a deixar [officer.GetSheHe], com os locais alertados #EMP bem#! a caminho até nós. Algumas flechas bem colocadas os afastam, e fugimos para a escuridão.\n\n"
 laamp_base_contract_schemes.3662.desc.method.kenneler.poison_barrels:0 "[officer.GetTitledFirstName] parece não ter problemas em #EMP sujar#! barril após barril de excelente vinho, enquanto o resto de nós mantinha a vigilância ou transportava isso e aquilo sob a direção [officer.GetHerHim]. O trabalho foi... positivamente alegre, no final, com vários de meus seguidores ajudando-se a um dos barris antes de estragá-lo. Melhor assim.\n\nClaro, isso não seria exatamente óbvio à primeira vista — então deixamos uma taça nova com uma pequena surpresa flutuando dentro e uma trilha de volta à sua fonte.\n\n"
 laamp_base_contract_schemes.3662.desc.method.kenneler.steal_dogs:0 "[officer.GetTitledFirstName] entra nos canis, e tudo permanece... mais ou menos completamente silencioso. Mais de dez minutos depois, assim que estávamos começando a perder a esperança e a elaborar planos para incendiar o lugar de qualquer maneira, [Select_CString( officer.IsFemale, 'a', 'o' )] [officer.GetWomanMan] reaparece segurando literalmente #EMP dezenas#! de cães firmemente por uma seleção de coleiras.\n\nComo [officer.GetSheHe] conseguiu convencer os animais a permanecerem em grande parte silenciosos, ofegantes e gemendo como se este fosse um grande jogo, é um milagre. Cada um de nós pega quantas guias conseguimos e fugimos pela noite —"
 laamp_base_contract_schemes.3662.desc.method.martial:0 "É preciso ter estômago forte para fazer um massacre a sangue frio, mas a promessa de prata torna muitas coisas toleráveis. Depois de esvaziarmos o interior, empilhamos os corpos, acendemos um fogo e fugimos pela noite.\n\nNenhum testemunha se mostra corajosa o suficiente para intervir, e"
 laamp_base_contract_schemes.3662.desc.method.prowess:0 "Liderando a luta pessoalmente, meus seguidores e eu nos livramos rapidamente daqueles que tiveram a infelicidade de se encontrar dentro, abatendo-os sem pensar ou ter misericórdia. Deixamos os corpos onde caem, jogando tochas nos lugares mais prováveis e empilhando materiais inflamáveis sobre as chamas resultantes.\n\nTrabalho bagunçado, mas eficaz.\n\n"
 laamp_base_contract_schemes.3662.desc.method.spoiler:0 "$laamp_base_contract_schemes.3662.desc.method.haggler$"
 laamp_base_contract_schemes.3662.desc.method.thief:0 "Como um gato, [officer.GetTitledFirstName] força seu caminho através de um par solto de persianas no andar de cima. Por alguns minutos, tudo fica em silêncio dentro — até que uma porta se abre e [officer.GetFirstNameNoTooltip] sai, segurando uma faca ensanguentada em uma mão. Parece que [officer.GetSheHe] não teve #EMP muito#! problema dentro do edifício.\n\nConfigurar o incêndio depois disso é brincadeira de criança, o que significa"
 laamp_base_contract_schemes.3662.desc.outro:0 "[employer.GetTitledFirstName] certamente ficará mais do que feliz em entregar nosso pagamento."
 laamp_base_contract_schemes.3662.t:0 "$laamp_base_contract_schemes.3031.t$: Sucesso!"
 laamp_base_contract_schemes.3663.a:0 "Devemos ir embora..."
 laamp_base_contract_schemes.3663.b:0 "Bah, deixe [target.GetFirstNameNoTooltip] saber que fui eu mesmo."
 laamp_base_contract_schemes.3663.desc.business.bridge:0 "a ponte de pedágio continua a colher sua colheita constante de moedas de viajantes."
 laamp_base_contract_schemes.3663.desc.business.docks:0 "o armazém à beira do cais permanece não queimado."
 laamp_base_contract_schemes.3663.desc.business.fallback:0 "a pequena oficina permanece de pé."
 laamp_base_contract_schemes.3663.desc.business.inn_exterior:0 "a estalagem permanece em grande parte intacta."
 laamp_base_contract_schemes.3663.desc.business.kennels:0 "os canis estão tão cheios de latidos caninos como sempre."
 laamp_base_contract_schemes.3663.desc.business.market:0 "o mercado continua a fazer seus negócios animados e ágeis."
 laamp_base_contract_schemes.3663.desc.business.mews:0 "o ar ainda ressoa com os gritos e clamores das águias do mews."
 laamp_base_contract_schemes.3663.desc.business.relaxing_room:0 "a casa ainda se mantém impávida."
 laamp_base_contract_schemes.3663.desc.business.shrine:0 "um[target.GetFaith.HouseOfWorship] ainda se aconchega ao lado da estrada."
 laamp_base_contract_schemes.3663.desc.business.tavern:0 "a taverna ainda faz bons negócios."
 laamp_base_contract_schemes.3663.desc.business.winery:0 "a reserva da vinícola permanece intacta."
 laamp_base_contract_schemes.3663.desc.intro:0 "Dizem que nenhum plano sobrevive ao contato com o inimigo. O nosso certamente não sobreviveu: por agora,"
 laamp_base_contract_schemes.3663.desc.method.armsman:0 "$laamp_base_contract_schemes.3663.desc.method.haggler$"
 laamp_base_contract_schemes.3663.desc.method.cook:0 "$laamp_base_contract_schemes.3663.desc.method.forager$"
 laamp_base_contract_schemes.3663.desc.method.engineer:0 "[officer.GetTitledFirstName] passou tanto tempo hesitando, tentando descobrir onde #EMP precisamente#! seria o melhor lugar para começar um incêndio, que alguém nos notou vagando! Assim que fomos vistos, soube que tudo estava acabado. Um grito confuso acorda outro, e a fuga logo se torna nossa única opção.\n\n"
 laamp_base_contract_schemes.3663.desc.method.forager:0 "[officer.GetTitledFirstName] não passou muito tempo dentro do lugar, [officer.GetSheHe] simplesmente depositou generosamente seu veneno nas áreas chave e saiu. Confiantes em nosso sucesso, partimos, apenas para retornar ao local do crime pela manhã para verificar nosso trabalho.\n\nInfelizmente, embora a invasão tenha sido notada, [officer.GetFirstNameNoTooltip] #EMP aparentemente#! usou a erva errada! Agora a guarda deles está em alerta sem nenhuma vantagem."
 laamp_base_contract_schemes.3663.desc.method.haggler:0 "Meu grupo e [officer.GetTitledFirstNamePossessive] vêm de direções opostas, mas parece que podemos ter... subestimado a determinação dos locais. Nosso ataque é avistado e, longe de entrar em pânico, os defensores pegam qualquer arma improvisada que têm à mão e se atiram de volta contra nós, cheios de indignação justa e gritando #EMP BANDIDOS!#! aos altos céus.\n\nLonge de ser um massacre, seu número superior ameaça nos sobrecarregar, e somos forçados a fugir —"
 laamp_base_contract_schemes.3663.desc.method.huntperson:0 "Não só a flecha de [officer.GetTitledFirstNamePossessive] falha em atingir seu alvo, como a maldita coisa acerta uma persiana fechada e consegue ricochetear com um forte #EMP baque#!. Segundos depois, as tábuas de madeira são abertas e um rosto sonolento espreita de forma incerta da penumbra.\n\nA vista de nós, em nossas roupas discretas, [officer.GetFirstNameNoTooltip] ainda segurando seu arco, com a flecha caída suavemente fumegando aos nossos pés, deixa claro que estávamos tramando algo. Com o alarme soando, fugimos —"
 laamp_base_contract_schemes.3663.desc.method.intrigue:0 "Nossas tentativas de acender um fogo discretamente atraíram um grupo de bêbados que passava, bravura inflamada pelo vinho e certos — injustamente e sem evidências — de que estávamos tramando algo criminoso. Os malditos vagabundos começaram a agir com tal fúria e causaram tanto barulho que os idiotas atraíram ajuda, rapidamente fazendo com que meus seguidores e eu fugíssemos.\n\n"
 laamp_base_contract_schemes.3663.desc.method.kenneler.dog_on_birds:0 "Oh, com certeza, [officer.GetTitledFirstName] entrou no lugar — dois cães amarrados em cada mão se esforçando para serem soltos — mas os malditos cães começaram a latir freneticamente assim que avistaram os pássaros. Ao ouvir os latidos dos cães vindos do valioso mews, um grito ecoa próximo e fica claro que devemos correr.\n\n"
 laamp_base_contract_schemes.3663.desc.method.kenneler.poison_barrels:0 "[officer.GetTitledFirstName] tinha uma tarefa simples — nós a colocamos dentro, [officer.GetSheHe] #EMP estraga#! os barris, saímos com alguns itens de pouco valor para parecer que era um roubo comum.\n\nInfelizmente, o idiota conseguiu derrubar completamente o primeiro barril enquanto tentava abri-lo, quebrando-o e fazendo-o despencar no chão. Gritos de alarme de perto sinalizaram que nosso disfarce estava completamente arruinado, e nós fugimos."
 laamp_base_contract_schemes.3663.desc.method.kenneler.steal_dogs:0 "Por um breve momento após [officer.GetTitledFirstName] entrar nos canis, os uivos dentro diminuem. Então há... conversas abafadas? Um rosnado — vários rosnados — latidos, grunhidos e sons de tumulto!\n\n[officer.GetFirstNameNoTooltip] sai correndo do pequeno prédio, perseguido por dois enormes e ferozes cães, e um grito de alarme próximo indica que os gritos de aviso dos cães foram ouvidos. Assim como [officer.GetFirstNameNoTooltip], nós fugimos, mas"
 laamp_base_contract_schemes.3663.desc.method.martial:0 "Mantenham a calma, eu disse aos meus seguidores. Quando o brilho de nossas armas nos fez ser vistos antes do esperado, isso não deveria ter sido um problema. Um grito de alarme ecoa, e uma variedade de locais armados improvisadamente logo aparece para nos enfrentar.\n\nNúmeros importam, mas a preparação também — ou deveria ter importado. Quando percebo que apenas metade do meu bando ainda está comigo, sou forçado a soar uma retirada."
 laamp_base_contract_schemes.3663.desc.method.prowess:0 "Apesar de nossas tentativas de destruir o lugar, não conseguimos entrar pela porta sem causar um barulho infernal. Quando finalmente conseguimos acesso, gritos e clamores de alarme começaram a surgir nas proximidades — considerando nosso pequeno número, optamos por fugir em vez de ficar e ser considerados bandidos.\n\n"
 laamp_base_contract_schemes.3663.desc.method.spoiler:0 "$laamp_base_contract_schemes.3663.desc.method.haggler$"
 laamp_base_contract_schemes.3663.desc.method.thief:0 "Entrar nos lugares não é um problema para [officer.GetTitledFirstName] — fazê-lo sem ser visto, por outro lado, é um pouco mais problemático. Meros momentos após sua entrada, um grito de alarme ecoa de dentro, seguido pelos sons de uma luta.\n\nAntes de muito tempo, uma porta se abre com força e [officer.GetFirstNameNoTooltip] sai rolando. Puxando [Select_CString( officer.IsFemale, 'a', 'o' )] [officer.GetWomanMan] com uma mão, fugimos antes que a comoção e os gritos crescentes de #EMP PARE! LADRÃO#! tragam ajuda."
 laamp_base_contract_schemes.3663.desc.outro:0 "[employer.GetTitledFirstName] não pagará nada por esse erro."
 laamp_base_contract_schemes.3663.t:0 "$laamp_base_contract_schemes.3031.t$: Falha!"
 laamp_base_contract_schemes.3781.a:0 "Fique baixo, #EMP facas à mão#!"
 laamp_base_contract_schemes.3781.b:0 "Aquela porta parece importante, destrua-a!"
 laamp_base_contract_schemes.3781.c:0 "Patrulha se aproximando — pegue-os dos dois lados."
 laamp_base_contract_schemes.3781.d:0 "Eu avisto um baú..."
 laamp_base_contract_schemes.3781.desc.cta:0 "ainda há objetos de valor a serem saqueados no corredor..."
 laamp_base_contract_schemes.3781.desc.ending:0 "E isso é... tudo?\n\nPor [ROOT.Char.GetFaith.WealthGodName], levamos literalmente #EMP tudo#! que pode ser saqueado dentro do [employer.GetTitledFirstNamePossessive] [employer.Custom('FortifiedBuilding')], dividindo tudo em um saco ou outro e empacotando de forma grosseira para fazer o mínimo de barulho, guardando apenas os artefatos mais preciosos.\n\nO [employer.GetTitleAsNameNoTooltip] terá uma manhã #EMP muito#! pobre quando [employer.GetSheHe] acordar.\n\nAgora não há nada mais a fazer além de ir embora."
 laamp_base_contract_schemes.3781.desc.failure.method.agent_intrigue:0 "Como se vê, [old_rollee.GetTitledFirstName] não encontrou nada para nós — [old_rollee.GetSheHe] conseguiu acordar um grupo de guardas de seu jogo de dados.\n\nSendo assim, bato no idiota em sua orelha e murmuro uma ordem para ser mais #EMP cuidadoso#! na próxima vez, para que [old_rollee.GetSheHe] não traga toda a ira de [employer.GetPrimaryTitle.GetBaseNameNoTier] sobre nós.\n\nFalha ou não,"
 laamp_base_contract_schemes.3781.desc.failure.method.agent_prowess:0 "Mesmo com toda a força [old_rollee.GetHerHim], [old_rollee.GetTitledFirstName] não consegue romper a porta que nos impede de acessar um quarto de finarias caras.\n\nFrustrado, sinalizo para deixá-la. Com certeza há saques mais fáceis por aí, estou certo disso, e quanto mais irritados ficamos com este ou aquele problema, mais arriscamos cometer erros.\n\nJá estávamos altos demais com isso — especialmente quando"
 laamp_base_contract_schemes.3781.desc.failure.method.intrigue:0 "As facas à mão provaram ser uma excelente precaução, pois encontramos muitos sentinelas problemáticos espalhados pelo local durante nosso avanço.\n\nAlguns estavam aqui o tempo todo, outros atraídos pelo barulho de nossa entrada inicial, mas de qualquer forma, a presença deles é um indicador de que estamos começando a chamar a atenção. Muita, muita atenção.\n\nBalançando a cabeça, foco no que é importante por enquanto:"
 laamp_base_contract_schemes.3781.desc.failure.method.martial:0 "A patrulha realmente cai — e mais importante, cai #EMP silenciosamente#!.\n\nApenas... não silenciosamente o suficiente, parece. O agito frenético e os gorgolejos molhados dos retentores morrendo podem ser bem altos, e embora ninguém pareça ter nos ouvido desta vez, com certeza não seremos tão sortudos na próxima.\n\nAinda assim, a avareza nos chama adiante. Parece que"
 laamp_base_contract_schemes.3781.desc.failure.method.master_thief:0 "[old_rollee.GetTitledFirstName] conseguiu rapidamente e silenciosamente inspecionar uma área surpreendentemente ampla do [employer.Custom('FortifiedBuilding')] — infelizmente, de acordo com [old_rollee.GetSheHe], há muito pouco que possa ser roubado sem arriscar levantar o alarme.\n\nPior, a expressão culpada [old_rollee.GetHerHim] sugere que [old_rollee.GetSheHe] #EMP pode#! já ter arriscado isso sem meu conhecimento. Precisamos ficar atentos.\n\nFalhas de [old_rollee.GetFirstNamePossessiveNoTooltip] ou não,"
 laamp_base_contract_schemes.3781.desc.failure.method.mos:0 "Aparentemente, as rações de sal de [old_rollee.GetTitledFirstNamePossessive] estão prestes a ser cortadas, pois [Select_CString( old_rollee.IsFemale, 'a', 'o' )] [old_rollee.GetWomanMan] retorna minutos depois, completamente de mãos vazias.\n\nEu teria pensado que meu $master_of_spoils_camp_officer$ provaria ser capaz de saquear pelo menos um pouco mais por [old_rollee.GetHerselfHimself], mas em vez disso sou forçado a ouvir com horror crescente enquanto o idiota relata quase ter esbarrado em uma patrulha.\n\nOutro erro como esse nos verá todos enforcados, ainda assim,"
 laamp_base_contract_schemes.3781.desc.failure.method.prowess:0 "Apesar de nossas melhores tentativas de arrombar o que #EMP parece#! ser um depósito de algum tipo, a maldita porta simplesmente não cede.\n\nO golpe furioso que ousamos tentar não produz mais do que um rangido de madeira surdo, e o murmúrio de alguém dormindo nas proximidades se mexendo com o barulho.\n\nO que quer que esteja lá dentro não vale o risco, mas"
 laamp_base_contract_schemes.3781.desc.failure.method.stewardship:0 "O que quer que esteja nesta maldita máquina é pesado — pesado demais para mover à mão — e a fechadura é #EMP frustrantemente#! competente.\n\nTentar abrir pode levar horas, e uma única tentativa de forçar produz um pesado #EMP clang#! metálico que é uma maravilha não termos sido pegos imediatamente. O próximo barulho alto que fizermos certamente será o nosso último.\n\nMesmo que tenhamos falhado aqui,"
 laamp_base_contract_schemes.3781.desc.intro.yes:0 "Já enchermos nossos bolsos com moedas de prata roubadas diretamente do tesouro de [employer.GetTitledFirstNamePossessive], mas ainda há muito mais valor a ser encontrado em sua [employer.Custom('FortifiedBuilding')]: castiçais de ouro, tapeçarias elaboradas, roupas de linho finíssimo, textos sagrados e mais.\n\nTodos os muitos adereços que o bom [employer.GetTitleAsNameNoTooltip] provavelmente considera garantidos, mas que para um humilde [ROOT.Char.Custom('GetLaampDescribeTypeSelf')] representam #EMP lucro#!.\n\nTudo o que precisamos fazer é saquear o lar e a lareira d[Select_CString( employer.IsFemale, 'a', 'o' )] [employer.GetWomanMan] antes que sejamos descobertos e escapar pela noite."
 laamp_base_contract_schemes.3781.desc.success.method.agent_intrigue:0 "[old_rollee.GetTitledFirstName] encontrou bastante, conforme se revela, sussurrando alegremente um breve inventário dos itens que [old_rollee.GetSheHe] roubou apressadamente em sua corrida para saquear o lugar.\n\nUma boa contagem, bastante para a pilhagem, e a adrenalina do roubo deve nos ajudar a seguir a noite. Calmamente, levanto uma tapeçaria cara e a dobro em meu próprio saco. Não seria bom deixar meus seguidores me superarem #EMP demais#!, afinal.\n\nTalvez"
 laamp_base_contract_schemes.3781.desc.success.method.agent_prowess:0 "Um empurrão firme faz com que [old_rollee.GetTitledFirstName] arranque completamente a porta de um cofre. A partir daí, corremos para pegar a coisa antes que ela possa cair e fazer mais barulho, mas conseguimos.\n\nO saque dentro vale bem o risco — um tesouro de moedas e tributos do adorável povo do [employer.GetTitleAsNamePossessive], parece. Agora passado para nós, graças aos esforços de [old_rollee.GetFirstNamePossessiveNoTooltip].\n\nTudo isso e mais é nosso, e"
 laamp_base_contract_schemes.3781.desc.success.method.intrigue:0 "Cortando a garganta de um sentinela que acordou tarde, pego o corpo e o guio suavemente, silenciosamente para o chão — antes de chutá-lo para a sombra mais profunda que posso encontrar.\n\nLimpando o sangue da lâmina, jogo algumas coisas do pobre tolo em seu posto. Um bordado elegante aqui, um pouco de prata ali, tudo soma. A morte por uma boa causa.\n\nSe o resto dos defensores tiver sorte, eles estarão em ambientes menos auspiciosos, pois suspeito"
 laamp_base_contract_schemes.3781.desc.success.method.martial:0 "[employer.GetTitledFirstNamePossessive] guardas desavisados são abatidos rápida e silenciosamente, com apenas um #EMP mínimo#! de gemidos de morte. Um alcove conveniente se torna uma parada antes de seu próximo enterro, e estamos livres para continuar saqueando o lugar sem piedade.\n\nClaro, armazenar os corpos lá significa que somos forçados a tirar as decorações e os móveis luxuosos do recess, mas isso é apenas cortesia.\n\nSeguindo em frente, é claro que"
 laamp_base_contract_schemes.3781.desc.success.method.master_thief:0 "[old_rollee.GetTitledFirstName] não diz nada, [old_rollee.GetSheHe] simplesmente sorri e ergue [old_rollee.Custom('Hand_ArticleTwo')] [old_rollee.Custom('HandHands')] enfeitados com anéis frescos e cintilantes, talvez três ou quatro por dedo.\n\nSatisfeito, aceno e deixo meu $master_thief_camp_officer$ continuar sua pilhagem em outro lugar. [old_rollee.GetSheHe|U] provavelmente deveria removê-los, não posso imaginar que eles estejam ajudando na sua destreza, mas não vou parar para uma palestra agora.\n\nNão quando"
 laamp_base_contract_schemes.3781.desc.success.method.mos:0 "Sorrindo, [old_rollee.GetTitledFirstName] abre seu saco grosso para revelar um #EMP monte#! de moedas, coberto de forma rudimentar por algumas almofadas muito caras.\n\nMeu $master_of_spoils_camp_officer$ toca seu [old_rollee.Custom('ActionTaps_ForeheadNose')] de forma significativa: \"a chave não está em ver o saque óbvio, mas em perceber os lugares óbvios para #EMP esconder#! as coisas\".\n\nBem verdade, e"
 laamp_base_contract_schemes.3781.desc.success.method.prowess:0 "Levo algumas tentativas para bater na porta suficientemente #EMP e#! fazer isso sem fazer muito barulho, mas consigo no final, empurrando a coisa de suas dobradiças desgastadas para revelar uma sala compacta sendo usada para... armazenamento amplamente diversificado.\n\nHmmm. Não é ideal, mas como estou aqui agora de qualquer maneira, procuro por aqui e encontro o suficiente para roubar que valeu a pena meu tempo, afinal.\n\nAinda,"
 laamp_base_contract_schemes.3781.desc.success.method.stewardship:0 "Sob a pressão certa, as dobradiças da caixa-forte cedem e seu conteúdo brilhante explode em um spray ruidoso.\n\nPor um momento, congelo, esperando para ver se o barulho atrai alguém e... nada. Permitindo-me uma risada, agacho para reunir meu prêmio, catando cada moeda como uma galinha cata grãos.\n\nSatisfeito por ter a maioria das moedas de prata, volto minha atenção para fora —"
 laamp_base_contract_schemes.3781.desc.success.method.stress:0 "Foco, foco, #EMP foco#!, preciso me concentrar.\n\nSe formos pegos aqui, certamente serei o primeiro a ser enforcado — e pior ainda, por mais tempo. Não há espaço para deslizes, literais ou metafóricos. Precisamos ser rápidos, prudentes e implacáveis enquanto nos movemos de sala em sala e de prédio em prédio, levando tudo que tenha mesmo um valor remoto.\n\nAinda assim, a canção de sereia de mais moedas nos atrai cada vez mais. Afinal,"
 laamp_base_contract_schemes.3781.e:0 "[rollee.GetFirstNameNoTooltip], o que você encontrou?"
 laamp_base_contract_schemes.3781.f:0 "[rollee.GetFirstNameNoTooltip], coloque seu ombro nisso!"
 laamp_base_contract_schemes.3781.g:0 "Alguma sorte na sua busca, [rollee.GetFirstNameNoTooltip]?"
 laamp_base_contract_schemes.3781.h:0 "Certo, [rollee.GetFirstNameNoTooltip], mostre-me que você vale seu sal."
 laamp_base_contract_schemes.3781.i:0 "Apenas... mais um pouco..."
 laamp_base_contract_schemes.3781.j.stole_everything:0 "Cuidado com os sacos e vamos nos mover!"
 laamp_base_contract_schemes.3781.j.tt.flee_with_earnings:0 "Leve seu saque atual e fuja"
 laamp_base_contract_schemes.3781.j:0 "Já temos o suficiente, fuja!"
 laamp_base_contract_schemes.3781.t:0 "$laamp_base_contract_schemes.3041.t$: Só Mais Um Pouco"
 laamp_base_contract_schemes.3781.tt.duel_failure.agent:0 "Seu agente falha com você"
 laamp_base_contract_schemes.3781.tt.duel_failure.skill:0 "Você chama muita atenção"
 laamp_base_contract_schemes.3781.tt.duel_success.agent:0 "[rollee.GetFirstNameNoTooltip] triunfa"
 laamp_base_contract_schemes.3781.tt.duel_success.skill:0 "Suas habilidades o recomendam"
 laamp_base_contract_schemes.3781.tt.foul_warning.increment:0 "Ganhe #N +1#! brecha"
 laamp_base_contract_schemes.3781.tt.foul_warning.pot_lost:0 "Seus ganhos até agora estão perdidos"
 laamp_base_contract_schemes.3781.tt.fouls_remaining:0 "#TUT [varcheck.MakeScope.Var('heist_failures').GetValue] de 2 brechas antes de sermos pegos#!"
 laamp_base_contract_schemes.3781.tt.haul_details:0 "#TUT [gold_i][varcheck.MakeScope.Var('haul_actual').GetValue|P0] [gold|E] de um possível [gold_i][varcheck.MakeScope.Var('haul_possible').GetValue|V0] atualmente no saque#!"
 laamp_base_contract_schemes.3781.tt.increment_haul:0 "Adicione [gold_i][varcheck.MakeScope.Var('haul_increment').GetValue|P0] ao seu saque"
 laamp_base_contract_schemes.3782.a:0 "Heh, agora vamos vender esse saque..."
 laamp_base_contract_schemes.3782.desc.haul_amount.grabbed_everything:0 "contrastando de forma magra contra o absoluto #EMP saque#! de bens roubados que encontramos em nossos colos, um verdadeiro tesouro de troféus negociáveis e metais preciosos."
 laamp_base_contract_schemes.3782.desc.haul_amount.grabbed_lots:0 "de pouco interesse quando encontramos tamanha riqueza abundante repentinamente em nossos colos. Claro, [employer.GetTitledFirstName] certamente tinha mais objetos valiosos a serem saqueados, mas ir longe demais é o primeiro — e muitas vezes o último — erro do ladrão amador.\n\nO delicioso peso de nossos ganhos é mais que suficiente para nos sobrecarregar enquanto seguimos alegres de volta para casa."
 laamp_base_contract_schemes.3782.desc.haul_amount.grabbed_most:0 "facilmente ignorados enquanto avaliamos nosso glorioso saque, a riqueza coletada de [employer.GetPrimaryTitle.GetBaseNameNoTier] despida de seus salões de [employer.GetLadyLord] e desordenadamente empacotada a nossos pés."
 laamp_base_contract_schemes.3782.desc.haul_amount.grabbed_nothing:0 "ressoando em nossos ouvidos enquanto fazemos nosso caminho suado de volta ao ponto de encontro.\n\nPara todas as minhas grandes proclamações de moedas extras a serem ganhas, saímos dos salões de [employer.GetTitledFirstNamePossessive] sem um único cobre para mostrar pelo risco extra.\n\nEsta noite, parece que teremos que nos contentar com nosso saque inicial."
 laamp_base_contract_schemes.3782.desc.haul_amount.grabbed_some:0 "avisando-nos que talvez nossos ganhos extras venham com um custo maior.\n\nAinda assim, o que está feito está feito, e temos um respeitável saquinho de prata, ouro e pedras preciosas para mostrar por nossos esforços. Deveria render uma quantia considerável, no total."
 laamp_base_contract_schemes.3782.desc.intro:0 "Como sombras na noite, estamos fora.\n\nOs primeiros rugidos de alarme e indignação são simplesmente ecos distantes quando chegam aos nossos ouvidos, o som surdo de consequências distantes."
 laamp_base_contract_schemes.3782.desc.outro:0 "\n\nNada mal para um trabalho noturno."
 laamp_base_contract_schemes.3782.t:0 "$laamp_base_contract_schemes.3041.t$: Sucesso!"
 laamp_base_contract_schemes.3783.a.tt.a_cold_cell_awaits:0 "Uma cela fria aguarda..."
 laamp_base_contract_schemes.3783.a:0 "Maldição e explosão dessas paredes infernais!"
 laamp_base_contract_schemes.3783.desc.haul_amount.grabbed_everything:0 "Tínhamos tudo — #EMP tudo#! — de qualquer tipo de valor nesta maldita [employer.Custom('FortifiedBuilding')], cada prato de prata, cada moeda de ouro, cada livro dourado, e agora está tudo perdido, tudo... perdido..."
 laamp_base_contract_schemes.3783.desc.haul_amount.grabbed_lots:0 "Havíamos acumulado um respeitável saque quando eles nos pegaram. Que pena, realmente... toda aquela prata teria sido vendida incrivelmente bem em uma cidade ou duas adiante..."
 laamp_base_contract_schemes.3783.desc.haul_amount.grabbed_most:0 "Tanto dinheiro, tanto #EMP saque#!, perdido. Tínhamos a riqueza coletada de [employer.GetPrimaryTitle.GetBaseNameNoTier] em nossas mãos e deixamos tudo apenas... escorregar..."
 laamp_base_contract_schemes.3783.desc.haul_amount.grabbed_nothing:0 "Nós nem sequer havíamos levado nada ainda."
 laamp_base_contract_schemes.3783.desc.haul_amount.grabbed_some:0 "Não havíamos pegado muito ainda, mas claro, poucos proprietários consideram #EMP a quantidade#! quando confrontados com um ladrão — geralmente, eles simplesmente se perguntam se devem cortar a mão esquerda, a direita ou ambas."
 laamp_base_contract_schemes.3783.desc.intro:0 "O mundo noturno ganha vida em uma enxurrada de gritos, clamores e brados. Quem soou o alarme, nunca saberemos, mas uma vez despertados, os defensores de [employer.GetTitledFirstNamePossessive] eram muitos demais para nós.\n\n"
 laamp_base_contract_schemes.3783.desc.outro:0 "\n\nFomos arrastados de maneira pouco cerimoniosa, segundo os gritos enfurecidos de [employer.GetTitleAsNameNoTooltip], diretamente para a masmorra."
 laamp_base_contract_schemes.3783.t:0 "$laamp_base_contract_schemes.3041.t$: Falha!"
 laamp_base_contract_schemes.3783.tt.haul_lost:0 "Todo o seu saque extra é perdido, devolvido a [employer.GetTitledFirstName]"
 laamp_base_contract_schemes.4001.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.4001.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.4001.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.4001.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.4001.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.4001.desc:0 "\"Claro, se não for #EMP muito#! trabalho para você,\" sorri [employer.GetTitledFirstName], colocando um maço de [ROOT.Char.Custom('GetWritingMaterial')] encadernado sobre a mesa. \"Apenas esses.\"\n\nApós um momento, [employer.GetSheHe] adiciona um par de rolos de [ROOT.Char.Custom('GetWritingMaterial')]. E outro monte de [ROOT.Char.Custom('GetWritingMaterial')]. E um pequeno livro.\n\nLevanto uma sobrancelha, e o [employer.GetTitleAsNameNoTooltip] retira um volume um pouco mais pesado de uma gaveta, colocando-o sobre a pilha.\n\n\"Bem, apenas #EMP esses#!.\""
 laamp_base_contract_schemes.4001.t:0 "Penas à Venda"
 laamp_base_contract_schemes.4002.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.4002.desc:0 "Eu retorno ao salão de [employer.GetTitledFirstNamePossessive] de bom humor, com os dedos manchados de tinta e os olhos avermelhados pela falta de sono, mas com o trabalho concluído.\n\nUm de meus companheiros traz a pilha de trabalhos concluídos atrás de mim, arrastando-se sob o peso da pilha desorganizada.\n\n\"Já terminou? Suponho que poderia ter lhe dado um pouco mais,\" brinca o [employer.GetTitleAsNameNoTooltip], antes de nos mandar sair. \"Não os deixe aqui; meus servos encontrarão alguém para ler os frutos de sua alfabetização e providenciarão seu pagamento.\""
 laamp_base_contract_schemes.4002.t:0 "$laamp_base_contract_schemes.4001.t$: Sucesso!"
 laamp_base_contract_schemes.4003.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.4003.desc:0 "\"Sente-se,\" comanda um [employer.GetTitledFirstName] irritado, segurando uma folha de pergaminho manchada de tinta, coberta de rabiscos indistintos. \"Você sabe o que isso diz?\"\n\nEu balanço a cabeça.\n\n\"Nem eu, porque #EMP isso não são palavras#!. Seu bando de malfeitores esteve escrevendo sabe-se lá por quanto tempo e #EMP isso#! é tudo que vocês têm para mostrar? Eu não vou pagar por tinta derramada descuidadamente. Pegue suas 'cópias' e vá embora!\""
 laamp_base_contract_schemes.4003.t:0 "$laamp_base_contract_schemes.4001.t$: Falha!"
 laamp_base_contract_schemes.4011.a:0 "Quão ruins eles podem ser?"
 laamp_base_contract_schemes.4011.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.4011.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.4011.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.4011.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.4011.desc:0 "\"... e esse é o resumo da questão,\" finaliza [employer.GetTitledFirstName]. \"Você tem algo a acrescentar, [chaplain.GetTitledFirstName]?\"\n\nO [chaplain.GetCouncilTitle] balança sua cabeça; \"você resumiu bem, [employer.GetLadyLord] — se minhas obrigações não me chamassem para outro lugar, eu arbitraria com prazer, mas...\"\n\nO [employer.GetTitleAsNameNoTooltip] levanta a mão para interromper [chaplain.GetSheHe]. \"Não se preocupe, tenho certeza de que [ROOT.Char.GetFirstName] lidará bem com nossos [employer.GetFaith.PriestNeuterPlural] argumentativos.\""
 laamp_base_contract_schemes.4011.t:0 "Resolvendo Teologia"
 laamp_base_contract_schemes.4012.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.4012.desc:0 "O debate acabou sendo surpreendentemente simples de resolver no final: ambas as partes estavam tão ocupadas jogando lama uma na outra que até mesmo um vago apelo ao espírito de unidade de [ROOT.Char.GetFaith.GetReligion.GetName] conquistou o meio descontente.\n\nOs [employer.GetFaith.PriestNeuterPlural] no centro da discussão ainda estão furiosos uns com os outros, mas com tão poucos ainda envolvidos, há pouco risco de que isso se transforme em algo pior.\n\nDe qualquer forma, [employer.GetTitledFirstName] parece satisfeito."
 laamp_base_contract_schemes.4012.t:0 "$laamp_base_contract_schemes.4011.t$: Sucesso!"
 laamp_base_contract_schemes.4013.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.4013.desc:0 "Isso foi... muito mais sangrento do que um debate verbal deveria ser.\n\nA discussão escalou para gritos, os gritos para fervor, o fervor para insultos, e então foi apenas uma questão de tempo até que alguém desse um soco. Mesmo agora, o desastre continua a se descontrolar atrás de nós.\n\nBasta dizer que não receberemos nenhum pagamento por isso."
 laamp_base_contract_schemes.4013.t:0 "$laamp_base_contract_schemes.4011.t$: Falha!"
 laamp_base_contract_schemes.4021.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.4021.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.4021.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.4021.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.4021.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.4021.desc:0 "Minha discussão com [employer.GetTitledFirstName] foi... esclarecedora.\n\nParece que o que [employer.GetSheHe] quer é um livreto espirituoso sobre aforismos e sabedorias tradicionais de [ROOT.Char.GetCulture.GetName], algo para fazer [employer.GetSheHe] parecer um verdadeiro patrono das artes.\n\nQuão difícil isso pode ser?"
 laamp_base_contract_schemes.4021.t:0 "Frutos da Mente"
 laamp_base_contract_schemes.4022.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.4022.desc:0 "Outro tribunal, outro patrono feliz!\n\nO livreto, \"Sobre as Muitas Astúcias e Mistérios de [ROOT.Char.GetCulture.GetName]\", é artisticamente conciso, mas #EMP apenas#! espirituoso o suficiente para agitar o tribunal com seus temas tradicionalistas e pensamentos de bom senso.\n\nÉ improvável que dure muito, muito menos receba muitas cópias, mas por agora rendeu nosso pagamento e isso é o suficiente."
 laamp_base_contract_schemes.4022.t:0 "$laamp_base_contract_schemes.4021.t$: Sucesso!"
 laamp_base_contract_schemes.4023.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.4023.desc:0 "\"Tolo! O que é essa #EMP tolice#! que você produziu, [ROOT.Char.GetFirstName]?\" grita [employer.GetTitledFirstName], folheando as páginas que meu grupo e eu preparamos. \"O... 'o verdadeiro valor do coração de um homem não é maior que o suor de sua testa'? O que isso #EMP significa#!?\"\n\nAbro a boca para responder, para explicar o aforismo, mas o indignado [employer.GetTitleAsNameNoTooltip] joga o manuscrito em mim e faz sinal para que eu saia.\n\nParece que já falei o suficiente."
 laamp_base_contract_schemes.4023.t:0 "$laamp_base_contract_schemes.4021.t$: Falha!"
 laamp_base_contract_schemes.4031.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.4031.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.4031.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.4031.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.4031.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.4031.desc:0 "Convencer nossa entrada para ver [employer.GetTitledFirstName] felizmente se mostra surpreendentemente fácil, com apenas um toque de mistério intrigante sobre nosso propósito para facilitar as coisas.\n\nUma vez concedida a audiência, nosso propósito se torna claro rapidamente. Como [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] eruditos, dependemos da generosidade de governantes #EMP esclarecidos#! para continuar fazendo nosso bom trabalho, e assim o [employer.GetTitleAsNameNoTooltip] relutantemente concorda em nos deixar ficar por um tempo — mas é só isso!\n\n... por enquanto."
 laamp_base_contract_schemes.4031.t:0 "Pedindo Esmolas"
 laamp_base_contract_schemes.4032.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.4032.desc:0 "Nossa estadia com [employer.GetTitledFirstName] foi, no fim, muito frutífera: o charme sustentado e a sagacidade erudita lentamente derrubam as suspeitas de [employer.GetTitleAsNamePossessive], atraindo [employer.GetSheHe] a um estado de interesse cativado, e então os dons de patronagem começam realmente a fluir.\n\nUm empreendimento abundante, sem dúvida, mas essa boa vontade não durará para sempre, então naturalmente partiremos antes de ultrapassarmos nossa acolhida.\n\nO [employer.GetCapitalLocation.GetTitle.GetName] foi muito generoso com nossos cofres."
 laamp_base_contract_schemes.4032.t:0 "$laamp_base_contract_schemes.4031.t$: Sucesso!"
 laamp_base_contract_schemes.4033.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.4033.desc:0 "Ao longo de nossa estadia, a atitude de [employer.GetTitledFirstNamePossessive] em relação a nós só piora — não ajudada por nossas tentativas de arrancar presentes e promessas [employer.GetHerHim] a cada oportunidade.\n\nCom o passar dos dias, a irritação de [employer.GetTitleAsNamePossessiveNoTooltip] aumenta. À medida que meu erro de cálculo se torna aparente, também se torna inevitável a acusação de vadiagem que nos espera se continuarmos a perder tempo aqui."
 laamp_base_contract_schemes.4033.t:0 "$laamp_base_contract_schemes.4031.t$: Falha!"
 laamp_base_contract_schemes.4041.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.4041.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.4041.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.4041.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.4041.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.4041.desc:0 "\"E este aqui,\" diz [employer.GetTitledFirstName], examinando uma pequena pedra esculpida de tonalidade azul-esverdeada, \"bom para gota? Bastante variedade que você tem aqui, [ROOT.Char.GetFirstName].\"\n\n\"Se [Select_CString( employer.IsFemale, 'minha', 'meu' )] [employer.GetLadyLord] quiser, posso mandar buscar alguns de nossos itens mais exóticos da bagagem?\" as palavras saem suavemente e com confiança da minha boca, \"como pode ver, temos muitos ativos a oferecer para você e sua corte.\"\n\nO [employer.GetTitleAsName] assente, dando seu consentimento para ficarmos por um tempo."
 laamp_base_contract_schemes.4041.t:0 "Cada Bugiganga é um Tesouro"
 laamp_base_contract_schemes.4042.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.4042.desc:0 "Nosso tempo no [employer.GetCapitalLocation.GetTitle.GetName] é imensamente lucrativo! Comerciar com o selo tácito de aprovação de [employer.GetTitledFirstNamePossessive] confere uma legitimidade ao nosso estoque que toda a lábia do mundo não poderia alcançar.\n\nTalismãs, remédios, bugigangas e quinquilharias — cortesãos e convidados compram tudo, sem fazer perguntas.\n\nAinda não, pelo menos. Estaremos longe quando suas preocupações começarem a surgir."
 laamp_base_contract_schemes.4042.t:0 "$laamp_base_contract_schemes.4041.t$: Sucesso!"
 laamp_base_contract_schemes.4043.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.4043.desc:0 "Os cortesãos de [employer.GetTitledFirstNamePossessive] são mais espertos do que parecem... um por um, nossas pequenas mentiras são primeiro suspeitadas e depois desfeitas, lentamente destruindo nossa reputação como vendedores de curas exóticas.\n\nPior, nossa evidente duplicidade faz com que o [employer.GetTitleAsNameNoTooltip] pareça mal: ou [employer.GetSheHe] nos permitiu ou foi enganado por nós, e nenhuma das opções nos agrada ao regime.\n\nDe qualquer forma, é melhor partirmos — mesmo sem lucro — antes que a ira de [employer.GetFirstNamePossessiveNoTooltip] se transforme em violência física."
 laamp_base_contract_schemes.4043.t:0 "$laamp_base_contract_schemes.4041.t$: Falha!"
 laamp_base_contract_schemes.5001.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.5001.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.5001.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.5001.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.5001.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.5001.desc:0 "O decreto de [employer.GetTitledFirstName] é simples: levar as cabeças d[employer.Custom('GetOutOfControlAnimalTypePlural')] quantos pudermos e, se nossa contagem for impressionante, ganhar o direito de caçar nas terras [employer.GetHerHim] por um tempo.\n\nToda aquela terra para perseguir... isso significa carne para salgar, peles para curtir, chifre e casco para entalhar, um tesouro de riquezas por toda parte.\n\nUm encontro emocionante e lucrativo, sem dúvida."
 laamp_base_contract_schemes.5001.t:0 "Para o Abate d[employer.Custom('GetOutOfControlAnimalTypePlural')|U]"
 laamp_base_contract_schemes.5002.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.5002.desc:0 "Meu grupo e eu nos envolvemos em glória nesta caçada: muitos d[employer.Custom('GetOutOfControlAnimalTypePlural')] caíram em nossas mãos, tornando-nos populares entre os camponeses e [employer.GetTitledFirstName], e a colheita que fizemos na natureza é realmente abundante.\n\nCom nossa bagagem cheia de peles e alimentos, ganhamos o suficiente para reabastecer nossas flechas perdidas e lanças quebradas."
 laamp_base_contract_schemes.5002.t:0 "$laamp_base_contract_schemes.5001.t$: Sucesso!"
 laamp_base_contract_schemes.5003.a:0 "Deixe que as tropas de [employer.GetFirstNamePossessiveNoTooltip] sejam despedaçadas!"
 laamp_base_contract_schemes.5003.desc:0 "[employer.Custom('GetOutOfControlAnimalTypePlural')|U], #EMP [employer.Custom('GetOutOfControlAnimalTypePlural')]!#! Noite após noite, ouvimos seus rugidos, e noite após noite nossos grupos de caça voltam com menos algumas mãos.\n\nNão importa quantos desses malditos animais matemos, sempre parece haver mais dessas feras amaldiçoadas. Não é de admirar que [employer.GetTitledFirstName] não pôde lidar com eles.\n\nEstá claro que precisamos reduzir nossas perdas e abandonar este contrato maldito antes que a natureza nos consuma a todos."
 laamp_base_contract_schemes.5003.t:0 "$laamp_base_contract_schemes.5001.t$: Falha!"
 laamp_base_contract_schemes.5011.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.5011.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.5011.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.5011.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.5011.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.5011.desc:0 "Se o ataque que [employer.GetTitledFirstName] espera contra a propriedade deste comerciante é real ou imaginário, a guarda do lado de fora é monótona, mesmo que a maior parte seja realizada pelo grupo.\n\nAinda assim, estamos sendo pagos para estar alertas e visíveis. Uma demonstração de força e proteção do guardião das terras.\n\nMesmo que isso signifique ficar parado em todas as condições climáticas."
 laamp_base_contract_schemes.5011.t:0 "Sentinela"
 laamp_base_contract_schemes.5012.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.5012.desc:0 "#EMP Ataque#!. Quase parece um termo grandioso demais para alguns bandidos sujos atacando ao anoitecer em uma onda mal planejada, certamente quando tudo acaba em questão de minutos. Mais como um confronto ou briga de beco.\n\nAinda assim, [employer.GetTitledFirstName] parece satisfeito.\n\nA autoridade [employer.GetHerHim|U] permanece absoluta, e isso é tudo o que importa — o que significa que seremos bem pagos."
 laamp_base_contract_schemes.5012.t:0 "$laamp_base_contract_schemes.5011.t$: Sucesso!"
 laamp_base_contract_schemes.5013.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.5013.desc:0 "\"Pagamos você para proteger o local, e agora não passa de madeira queimada e sangue seco, [ROOT.Char.GetFirstName]!\" late [employer.GetTitledFirstName]. \"Como você foi pego de surpresa por um bando de ladrões insignificantes? Você tinha #EMP um#! trabalho!\"\n\nAbro a boca para responder, mas [employer.GetTitleAsNameNoTooltip] me interrompe.\n\n\"Silêncio, não quero suas desculpas. Apenas vá embora.\""
 laamp_base_contract_schemes.5013.t:0 "$laamp_base_contract_schemes.5011.t$: Falha!"
 laamp_base_contract_schemes.5021.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.5021.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.5021.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.5021.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.5021.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.5021.desc:0 "\"Então, você entende por que preciso de alguns... olhos extras espalhados por [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier],\" diz [employer.GetTitledFirstName]. \"Você fornecerá uma camada extra de segurança, para que, se algo passar pelos meus guarda-costas habituais — ou se esses guarda-costas falharem em sua lealdade — eu ainda tenha bom aço protegendo minhas costas.\"\n\nEu aceno. Uma situação ruim, quando você não pode confiar em seus guardas, mas boa para os negócios, pelo menos.\n\n\"Excelente, então você começará imediatamente.\""
 laamp_base_contract_schemes.5021.t:0 "Chaperão de [employer.GetTitleAsNamePossessiveNoTooltip]"
 laamp_base_contract_schemes.5022.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.5022.desc:0 "\"Trabalho magnífico, [ROOT.Char.GetFirstName], verdadeiramente,\" exclama [employer.GetTitledFirstName], \"cada um dos cães foi despachado com graça e eficiência! Nem um fio de cabelo meu foi tocado pelos traidores.\"\n\n\"Graça pode ser um exagero, [Select_CString( employer.IsFemale, 'minha', 'meu' )] [employer.GetLadyLord],\" comento. Um servo atrás de nós trabalha vigorosamente para limpar o sangue pegajoso do cimento da parede.\n\n\"Bah, melhor as tripas deles no tapete do que as minhas. Seu pagamento será entregue prontamente.\""
 laamp_base_contract_schemes.5022.t:0 "$laamp_base_contract_schemes.5021.t$: Sucesso!"
 laamp_base_contract_schemes.5023.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.5023.desc:0 "Assim que os assassinos passaram por nós, soube que tínhamos que fugir, e fugir rápido.\n\nNão podemos alcançá-los a tempo de fazer diferença, e embora os guarda-costas de [employer.GetTitledFirstNamePossessive] possam salvar [employer.GetSheHe], ou talvez não, de qualquer forma... alguém será punido por isso.\n\nQuanto mais demorarmos aqui, mais provável que essa pessoa seja eu."
 laamp_base_contract_schemes.5023.t:0 "$laamp_base_contract_schemes.5021.t$: Falha!"
 laamp_base_contract_schemes.5031.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.5031.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.5031.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.5031.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.5031.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.5031.desc:0 "Há uma arte em roubar animais em massa: você precisa saber para onde os levará, não pode ser sutil, mas #EMP tem#! que parecer que pertence ao lugar, e quando encontra resistência, a brutalidade precisa ser rápida.\n\nO risco de uma debandada ou até mesmo perder o controle do rebanho coloca toda a operação em perigo, e quando as coisas dão errado, o lucro afunda mais rápido que um navio em meio à tempestade.\n\nEsperemos que [employer.GetTitledFirstName] não esteja guardando bem o gado [employer.GetHerHim]."
 laamp_base_contract_schemes.5031.t:0 "Ladrão de Gado"
 laamp_base_contract_schemes.5032.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.5032.desc:0 "Uma operação belíssima! Após muita preparação — traçando rotas, organizando compradores e explorando pastos — nossos ladrões lançam uma série de ataques noturnos devastadores, levando grandes grupos de animais ao longo de uma semana.\n\n[employer.GetTitledFirstName] não precisa se preocupar, os animais [employer.GetHerHim] estão certamente indo para lares melhores. Seus novos donos têm bolsos fundos e uma atitude #EMP muito#! generosa, afinal."
 laamp_base_contract_schemes.5032.t:0 "$laamp_base_contract_schemes.5031.t$: Sucesso!"
 laamp_base_contract_schemes.5033.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.5033.desc:0 "Parecia... parecia que tudo estava indo tão bem.\n\nSabíamos a rota, tínhamos nossos ataques planejados, mas ou o cheiro de sangue assustou os animais, ou o barulho, ou a mudança na rotina...\n\nA minha equipe e eu somos forçados a nos dispersar, com os cães de [employer.GetTitledFirstNamePossessive] nos perseguindo ferozmente, e com pouquíssimos animais roubados para mostrar."
 laamp_base_contract_schemes.5033.t:0 "$laamp_base_contract_schemes.5031.t$: Falha!"
 laamp_base_contract_schemes.5034.a:0 "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.5034.b:0 "$travel.mobile_domicile.option.t$"
 laamp_base_contract_schemes.5034.desc:0 "$laamp_base_contract_schemes.5031.desc$"
 laamp_base_contract_schemes.5034.t:0 "Roubo de Gado"
 laamp_base_contract_schemes.5034.tt.destination_list.2:0 "Você imediatamente começa [viajando|E] para [destination_1.GetNameNoTier], depois para [destination_2.GetNameNoTier]"
 laamp_base_contract_schemes.5034.tt.destination_list.3:0 "Você imediatamente começa [viajando|E] para [destination_1.GetNameNoTier], depois para [destination_2.GetNameNoTier] e finalmente para [destination_3.GetNameNoTier]"
 laamp_base_contract_schemes.5034.tt.destination_list.4:0 "Você imediatamente começa [viajando|E] para [destination_1.GetNameNoTier], depois para [destination_2.GetNameNoTier], depois para [destination_3.GetNameNoTier] e finalmente para [destination_4.GetNameNoTier]"
 laamp_base_contract_schemes.5034.tt.destination_list.5:0 "Você imediatamente começa [viajando|E] para [destination_1.GetNameNoTier], depois para [destination_2.GetNameNoTier], depois para [destination_3.GetNameNoTier], depois para [destination_4.GetNameNoTier] e finalmente para [destination_5.GetNameNoTier]"
 laamp_base_contract_schemes.5034.tt.explanation:0 "#TUT Para completar o [task_contract|E]:\n$EFFECT_LIST_BULLET$Complete um desafio de [proeza|E], [arte marcial|E] ou [administração|E] em cada destino\n$EFFECT_LIST_BULLET$Se você os tiver, poderá testar a aptidão do melhor de seus [GetCourtPositionType('head_groom_camp_officer').GetName], [GetCourtPositionType('huntperson_camp_officer').GetName], [GetCourtPositionType('kennelperson_camp_officer').GetName], ou [GetCourtPositionType('master_of_spoils_camp_officer').GetName] [oficiais|E] em vez disso\n$EFFECT_LIST_BULLET$Para ter sucesso —\n$TAB$$EFFECT_LIST_BULLET$Vença todos os desafios para um $label_success_critical$\n$TAB$$EFFECT_LIST_BULLET$Vença mais da metade dos desafios para um $label_success_standard$\n$TAB$$EFFECT_LIST_BULLET$Vença pelo menos um desafio para um $label_success_qualified$\n$TAB$$EFFECT_LIST_BULLET$Perca todos os desafios para um $label_failure_standard$#!"
 laamp_base_contract_schemes.5041.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.5041.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.5041.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.5041.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.5041.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.5041.desc:0 "Parece que as terras de [employer.GetTitledFirstNamePossessive] estão sobrecarregadas com uma abundância de caça, tanto que [employer.GetSheHe] já está tendo alguns problemas com caçadores furtivos.\n\nBem, dado o meu alegre bando de [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')], seria rude deixar o bom [employer.GetTitleAsNameNoTooltip] tão sobrecarregado. Teremos que ajudar tirando apenas #EMP alguns#! suculentos pássaros, talvez esfolando apenas #EMP alguns#! animais..."
 laamp_base_contract_schemes.5041.t:0 "Caçador Furtivo"
 laamp_base_contract_schemes.5042.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.5042.desc:0 "Ahhh, uma caça emocionante em [employer.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTier]! Que os empregados de [employer.GetTitledFirstNamePossessive] nos chamem de caçadores furtivos, eles tinham mais carne de veado do que sabiam o que fazer, e [ROOT.Char.GetFaith.WealthGodName] abomina o desperdício.\n\nSaímos daqui gordos e felizes, com a barriga cheia e os pulsos livres de algemas."
 laamp_base_contract_schemes.5042.t:0 "$laamp_base_contract_schemes.5041.t$: Sucesso!"
 laamp_base_contract_schemes.5043.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.5043.desc:0 "Maldição e praga nos vira-latas de [employer.GetTitledFirstName]!\n\nEles não #EMP precisam#! de tantos animais, mas sua perseguição implacável destrói caça após caça, e, para piorar, coloca vários dos meus em ferros.\n\nEu sei quando é hora de cortar minhas perdas. Quanto mais tempo ficarmos aqui, maior a chance de #EMP nos tornarmos#! a caça, em vez das malditas aves."
 laamp_base_contract_schemes.5043.t:0 "$laamp_base_contract_schemes.5041.t$: Falha!"
 laamp_base_contract_schemes.5051.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.5051.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.5051.c:0 "$laamp_base_contract_schemes.0000.generic_option.secrecy$"
 laamp_base_contract_schemes.5051.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.5051.desc:0 "Os avisos que [employer.GetTitledFirstName] havia pendurado se mostraram mais verdadeiros do que o esperado: [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier] parece estar enfrentando uma onda de crimes pequenos.\n\nMesmo ao apenas entrarmos na cidade, conseguimos contar uma dúzia de batedores de carteira e um assalto completo, trabalho demais para os sobrecarregados moradores do [employer.GetTitleAsNameNoTooltip] lidarem.\n\nUm ambiente absolutamente perfeito para empreendedores como nós [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] ganharmos um pouco de #EMP moeda#!."
 laamp_base_contract_schemes.5051.t:0 "Roubo de Beco"
 laamp_base_contract_schemes.5052.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.5052.desc:0 "Graças à total incapacidade de [employer.GetTitledFirstNamePossessive] em impor ordem nas ruas de sua própria capital, [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] conseguem extorquir mais do que o conjunto dos cidadãos de [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier] pode oferecer.\n\nNão é uma maneira honrada de ganhar a vida, talvez, mas lucrativa? Extremamente.\n\nAinda assim, a primeira lição que qualquer criminoso aspirante aprende é quando desistir. Com nossas moedas feitas, é hora de sair — antes que o [employer.GetTitleAsNameNoTooltip] descubra e venha atrás de nós."
 laamp_base_contract_schemes.5052.t:0 "$laamp_base_contract_schemes.5051.t$: Sucesso!"
 laamp_base_contract_schemes.5053.a:0 "Bah, encontraremos presas mais ricas em outro lugar."
 laamp_base_contract_schemes.5053.desc:0 "Apesar de nossas melhores intenções, parece que [employer.GetTitledFirstName] resolve os problemas com criminosos pequenos mais rápido do que [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] conseguem capitalizar sobre eles.\n\nCom os guardas de [employer.GetTitleAsNamePossessiveNoTooltip] patrulhando as ruas e nossa janela de oportunidade se fechando, apesar dos ganhos até agora, sou forçado a escapar de [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier] com meu bando antes que a lei nos alcance.\n\nParece que não encontraremos mais saques aqui."
 laamp_base_contract_schemes.5053.t:0 "$laamp_base_contract_schemes.5051.t$: Falha!"
 laamp_base_contract_schemes.5661.a.tt.failure:0 "Os locais conseguem se opor a você com sucesso"
 laamp_base_contract_schemes.5661.a.tt.success:0 "Sua crueldade compensa"
 laamp_base_contract_schemes.5661.a:0 "Cortem qualquer tolo que se oponha a nós!"
 laamp_base_contract_schemes.5661.b.tt.failure:0 "Suas tropas estão muito separadas"
 laamp_base_contract_schemes.5661.b.tt.success:0 "Sua disciplina se mantém firme"
 laamp_base_contract_schemes.5661.b:0 "Lembre-se, mantenham-se juntos, concentrem-se nas bestas."
 laamp_base_contract_schemes.5661.c.tt.failure:0 "Seus raiders se mostram exigentes demais"
 laamp_base_contract_schemes.5661.c.tt.success:0 "Você rouba os animais mais escolhidos"
 laamp_base_contract_schemes.5661.c:0 "Levem apenas os melhores, deixem o razoável para esses cães."
 laamp_base_contract_schemes.5661.d.tt.failure:0 "$option_boilerplate.tt.officer_aptitude.failure$"
 laamp_base_contract_schemes.5661.d.tt.success:0 "$option_boilerplate.tt.officer_aptitude.success$"
 laamp_base_contract_schemes.5661.d:0 "[officer.GetFirstNameNoTooltip], isso é... adjacente ao seu campo, não é?"
 laamp_base_contract_schemes.5661.desc.intro.constantinople:0 "Nos encontramos do lado de fora das poderosas muralhas da venerável [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.desert:0 "Nesta manhã, partimos para os desertos de [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.desert_mountains:0 "Determinados a encontrar #EMP algo#!, meus raiders e eu exploramos as áridas montanhas de [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.drylands:0 "Levantando uma poeira sem fim, meu grupo e eu nos espalhamos pelas terras áridas de [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.farmlands:0 "Meu grupo e eu nos movemos pelas densas terras agrícolas de [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.floodplains:0 "Sem outra escolha, meu grupo é forçado a entrar nas úmidas planícies alagadas de [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.forest:0 "Debaixo da ampla cobertura arbórea de [ROOT.Char.GetCurrentLocation.GetName], seguimos adiante,"
 laamp_base_contract_schemes.5661.desc.intro.hills:0 "Facilmente, minhas forças se deslizam entre as colinas de [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.jungle:0 "Cobertos por árvores sombreadas, avançamos para as selvas de [ROOT.Char.GetCurrentLocation.Get.Name],"
 laamp_base_contract_schemes.5661.desc.intro.mountains:0 "Nesta noite, subimos as baixas encostas e sopés entre as montanhas de [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.oasis:0 "Sob o sol ardente do amanhecer, minhas tropas se espalham pela verde oásis de [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.plains:0 "Nosso ataque noturno nos leva para o interior das planícies de [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.postamble:0 "buscando rebanhos vulneráveis d[ROOT.Char.Custom('RegionalFarmAnimalPlural')] para levar de volta ao nosso acampamento itinerante."
 laamp_base_contract_schemes.5661.desc.intro.steppe:0 "Como têm feito por dias, minhas tropas se espalham pela vasta estepe de [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.taiga:0 "Entre os robustos pinheiros de [ROOT.Char.GetCurrentLocation.GetName], minhas forças se espalham,"
 laamp_base_contract_schemes.5661.desc.intro.wetlands:0 "No auge do meio-dia, nossos soldados de melhor visão entram nos pântanos de [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.opportunity.01:0 "Vários candidatos prováveis chamaram minha atenção durante nossas recentes incursões na região, mas até agora temos feito apenas reconhecimento leve."
 laamp_base_contract_schemes.5661.desc.opportunity.02:0 "Até agora, as opções aqui têm sido um tanto escassas, com a resistência muito feroz para reunir números significativos de animais roubados. Finalmente, porém, encontramos fazendas mal defendidas com rebanhos amplos."
 laamp_base_contract_schemes.5661.desc.opportunity.03:0 "Embora esta área tenha parecido comparativamente fácil de brutalizar até agora, nos abstivemos de fazê-lo — esperando encontrar o alvo perfeito antes de liberar nosso pior. Esta noite, com a descoberta de uma propriedade cheia de gado gordo, encontramos nosso alvo."
 laamp_base_contract_schemes.5661.desc.opportunity.04:0 "Embora haja poucas grandes propriedades por aqui, as pequenas fazendas na área parecem adequadamente prósperas. Saquear elas exigirá mais esforço, mas o rendimento final ainda deve justificar o esforço."
 laamp_base_contract_schemes.5661.desc.opportunity.05:0 "Os locais — pelo menos, aqueles que ousam se mostrar para nós — afirmam estar em pobreza, mas eu também diria isso em seu lugar se [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] viesse bater à minha porta. Eles parecem ter rebanhos amplos para nossas necessidades, pelo menos."
 laamp_base_contract_schemes.5661.desc.opportunity.06:0 "Não há espaço para pena, nenhuma oportunidade de reconhecer o mal que estamos causando a esses humildes camponeses. Os animais deles irão para nós, ou os colocaremos à espada — isso é simplesmente tudo o que há a fazer."
 laamp_base_contract_schemes.5661.desc.outro:0 "\n\nAgora chega o momento da violência."
 laamp_base_contract_schemes.5661.e.tt.failure:0 "$option_boilerplate.tt.officer_aptitude.failure$"
 laamp_base_contract_schemes.5661.e.tt.success:0 "$option_boilerplate.tt.officer_aptitude.success$"
 laamp_base_contract_schemes.5661.e:0 "[officer.GetFirstNameNoTooltip], conduza essas bestas para frente."
 laamp_base_contract_schemes.5661.f.tt.failure:0 "$option_boilerplate.tt.officer_aptitude.failure$"
 laamp_base_contract_schemes.5661.f.tt.success:0 "$option_boilerplate.tt.officer_aptitude.success$"
 laamp_base_contract_schemes.5661.f:0 "[officer.GetFirstNameNoTooltip], soltem seus cães!"
 laamp_base_contract_schemes.5661.g.tt.failure:0 "$option_boilerplate.tt.officer_aptitude.failure$"
 laamp_base_contract_schemes.5661.g.tt.success:0 "$option_boilerplate.tt.officer_aptitude.success$"
 laamp_base_contract_schemes.5661.g:0 "[officer.GetFirstNameNoTooltip], você consegue lidar com isso?"
 laamp_base_contract_schemes.5661.h.tt.need_groom_hunter_kenneler_or_spoiler:0 "Você não tem um [GetCourtPositionType('head_groom_camp_officer').GetName()], [GetCourtPositionType('huntperson_camp_officer').GetName()], [GetCourtPositionType('kennelperson_camp_officer').GetName()], nem um [GetCourtPositionType('master_of_spoils_camp_officer').GetName()]"
 laamp_base_contract_schemes.5661.h:0 "Se ao menos eu tivesse um oficial adequado..."
 laamp_base_contract_schemes.5661.i:0 "Não haverá #EMP erros#!, de #EMP nenhum#! de vocês."
 laamp_base_contract_schemes.5661.t:0 "$laamp_base_contract_schemes.5034.t$: [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 laamp_base_contract_schemes.5661.tt.current_successes:0 "#TUT Você atualmente tem [task_contract.MakeScope.Var('wins_tally').GetValue|0] sucessos em raptos#!"
 laamp_base_contract_schemes.5661.tt.encounter_tally:0 "#TUT Este é o encontro [task_contract.MakeScope.Var('encounter_tally').GetValue|0] de [task_contract.MakeScope.Var('encounter_max').GetValue|0]#!"
 laamp_base_contract_schemes.5661.tt.no_score_gain:0 "Você não consegue roubar uma quantidade significativa de animais"
 laamp_base_contract_schemes.5661.tt.score_gained:0 "#P +1#! sucesso em rapto"
 laamp_base_contract_schemes.5662.a:0 "Comemos como reis esta noite!"
 laamp_base_contract_schemes.5662.desc:0 "Apesar das melhores tentativas dos muitos lacaios de [employer.GetTitledFirstNamePossessive], [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] recuperou uma verdadeira horda de bestas das ignominiosas garras [employer.GetHerHim].\n\nTalvez não sejam naturalmente nossas, mas o que isso importa para nós? Com espada e machado, tomamos o que queremos, e qualquer um que se opusesse a nós jaz morto em seus pastos.\n\nQue seus corpos forneçam um bom alimento para os corvos."
 laamp_base_contract_schemes.5662.t:0 "$laamp_base_contract_schemes.5034.t$: Sucesso!"
 laamp_base_contract_schemes.5663.a:0 "Bah, velho tolo..."
 laamp_base_contract_schemes.5663.desc:0 "Embora tenhamos dado o nosso melhor, as tropas de [employer.GetTitledFirstNamePossessive] parecem ter nos atrapalhado em cada esquina. Avisos enviados para vilarejos remotos, rebanhos abundantes movidos para longe, novas guardas e torres de vigia reconstruídas em cada parada...\n\nHoje, a vitória vai para o [employer.GetTitleAsNameNoTooltip]."
 laamp_base_contract_schemes.5663.t:0 "$laamp_base_contract_schemes.5034.t$: Falha!"
 laamp_base_contract_schemes.5901.a.tt.failure:0 "[Select_CString( victim.IsFemale, 'A', 'O' )] [victim.GetWomanMan] foge antes que você possa encurralar [victim.GetSheHe]"
 laamp_base_contract_schemes.5901.a.tt.success:0 "Você intimida [victim.GetFirstNameNoTooltip]"
 laamp_base_contract_schemes.5901.a:0 "Facas para fora, vamos fazer isso de forma silenciosa, mas clara."
 laamp_base_contract_schemes.5901.b.tt.failure:0 "[victim.GetFirstNameNoTooltip] te nota e corre"
 laamp_base_contract_schemes.5901.b.tt.success:0 "[victim.GetSheHe|U] não percebe"
 laamp_base_contract_schemes.5901.b:0 "Siga [victim.GetSheHe] e corte a bolsa [victim.GetHerHim] silenciosamente."
 laamp_base_contract_schemes.5901.c.tt.failure:0 "Seu agente falha com você"
 laamp_base_contract_schemes.5901.c.tt.success:0 "[rollee.GetFirstNameNoTooltip] triunfa"
 laamp_base_contract_schemes.5901.c:0 "[rollee.GetFirstNameNoTooltip], mostre a [victim.GetSheHe] o verdadeiro medo!"
 laamp_base_contract_schemes.5901.d.tt.failure:0 "$laamp_base_contract_schemes.5901.c.tt.failure$"
 laamp_base_contract_schemes.5901.d.tt.success:0 "$laamp_base_contract_schemes.5901.c.tt.success$"
 laamp_base_contract_schemes.5901.d:0 "[rollee.GetFirstNameNoTooltip], veja o que você pode fazer."
 laamp_base_contract_schemes.5901.desc.intro.1:0 "Com o trabalho da noite quase terminado, meus agentes e eu ponderamos se devemos voltar para casa um pouco mais cedo — uma conversa decidida para nós pela chegada de um alvo promissor..."
 laamp_base_contract_schemes.5901.desc.intro.2:0 "À medida que a tarde se transforma em noite, eu reprimo um bocejo. O crime pode render bem, mas muito dele envolve simplesmente #EMP esperar#! — embora, espere, ess[Select_CString( victim.IsFemale, 'a', 'e' )] [victim.GetWomanMan] parece promissora..."
 laamp_base_contract_schemes.5901.desc.intro.3:0 "Colheitas mistas têm atormentado nosso trabalho diário, com bolsas amplas levadas, mas poucas delas particularmente #EMP gordas#!. Embora, pelo jeito dess[Select_CString( victim.IsFemale, 'a', 'e' )] [victim.GetWomanMan], isso pode estar prestes a mudar..."
 laamp_base_contract_schemes.5901.desc.intro.4:0 "O trabalho de hoje já foi bastante lucrativo, com vários bons cidadãos gentilmente doando sua prata para nossa #EMP causa#!. Est[Select_CString( victim.IsFemale, 'a', 'e' )] [victim.GetWomanMan] pode ser a mais rica até agora..."
 laamp_base_contract_schemes.5901.desc.intro.5:0 "Após um dia em grande parte infrutífero, sem que um único camponês rico passasse por nossas áreas de colheita, finalmente pegamos um pouco de sorte com um[Select_CString( victim.IsFemale, 'a', '' )] [victim.GetWomanMan] de meios claros."
 laamp_base_contract_schemes.5901.desc.outro.1:0 "Meus agentes começam a surgir de seus esconderijos, impacientes para atacar essa presa fresca."
 laamp_base_contract_schemes.5901.desc.outro.2:0 "As sombras se movem suavemente, figuras encapuzadas sob meu comando se preparando para avançar a qualquer momento."
 laamp_base_contract_schemes.5901.desc.outro.3:0 "Embora quase imperceptível, ouço o som de adagas bem lubrificadas sendo desembainhadas ao redor da pequena viela."
 laamp_base_contract_schemes.5901.desc.outro.4:0 "Com máscaras cobrindo a maior parte de seus rostos, deixando apenas os olhos visíveis, meus agentes olham para mim em busca do sinal para começar."
 laamp_base_contract_schemes.5901.desc.outro.5:0 "Tudo o que preciso fazer é dar a ordem, e o pobre tolo aprenderá o significado do arrependimento."
 laamp_base_contract_schemes.5901.desc.victim_type.bad_relation:0 "Ora, ora, ora, se não é minha velha [victim.Custom2('RelationToMeShort',ROOT.Char)] [victim.GetTitledFirstName]. E sem escolta, também. Como... #EMP fortuito#!."
 laamp_base_contract_schemes.5901.desc.victim_type.baron:0 "Isso é... sim, [victim.GetFirstName], [victim.GetTitleAsNameNoTooltip] de [victim.GetPrimaryTitle.GetBaseNameNoTier]! [victim.GetSheHe|U] deve estar visitando a capital em assuntos pessoais. Muito pessoais, para viajar sem escolta e tomar atalhos tão #EMP desonrosos#!."
 laamp_base_contract_schemes.5901.desc.victim_type.baron_courtier:0 "Não posso dizer que reconheço [victim.GetSheHe], mas pela roupa, [victim.GetSheHe] parece rico, mas sem importância. Talvez o cortesão de algum governante local menor."
 laamp_base_contract_schemes.5901.desc.victim_type.consort:0 "Essa é [victim.GetFirstName], minha #EMP [victim.Custom2('RelationToMeShort',ROOT.Char)]#!! Mesmo que estejamos separados agora, certamente não posso fazer isso com [victim.GetSheHe], com alguém que considero tão querido?"
 laamp_base_contract_schemes.5901.desc.victim_type.courtier:0 "Hmmm, isso #EMP parece#! ser [victim.GetTitledFirstName] — um cortesão de [target.GetTitledFirstName]. Para todo o bem que isso faz [victim.GetHerHim] aqui e agora, cercado inconscientemente por [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]."
 laamp_base_contract_schemes.5901.desc.victim_type.fallback:0 "Reconheço [victim.GetSheHe] como [victim.GetFirstName], um magnata local de alguma pequena riqueza e #EMP perfeitamente#! alvo adequado, se talvez não o mais rico disponível."
 laamp_base_contract_schemes.5901.desc.victim_type.family:0 "Não pode ser... [victim.GetFirstName|U], meu(a) [victim.Custom2('RelationToMeShort',ROOT.Char)]. Sem escolta, quase pulando para o perigo, tão feliz quanto você pode imaginar. A sua tolice mancha o nome dos [ROOT.Char.GetHouse.GetName]."
 laamp_base_contract_schemes.5901.desc.victim_type.good_relation:0 "É... minha [victim.Custom2('RelationToMeShort',ROOT.Char)] [victim.GetTitledFirstName]? O que [victim.GetSheHe] está pensando, vagando por essas ruas perigosas sem escolta! Claro que [victim.GetSheHe] provavelmente será roubado, como pode [victim.GetSheHe] ser tão descuidado?"
 laamp_base_contract_schemes.5901.desc.victim_type.traveller:0 "A roupa e o comportamento incerto [victim.GetHerHim] o marcam como um claro estrangeiro, pelo menos para a cidade. Provavelmente um visitante de curto prazo, ou um viajante apenas de passagem."
 laamp_base_contract_schemes.5901.e.tt.failure:0 "$option_boilerplate.tt.officer_aptitude.failure$"
 laamp_base_contract_schemes.5901.e.tt.success:0 "$option_boilerplate.tt.officer_aptitude.success$"
 laamp_base_contract_schemes.5901.e:0 "[rollee.GetFirstNameNoTooltip], pegue o bolso [victim.GetHerHim]!"
 laamp_base_contract_schemes.5901.f.tt:0 "Você abre mão da oportunidade de aliviar [victim.GetTitledFirstName] de sua riqueza."
 laamp_base_contract_schemes.5901.f:0 "Muito arriscado, deixe essa passar."
 laamp_base_contract_schemes.5901.t:0 "$laamp_base_contract_schemes.5051.t$: [victim.GetTitledFirstNameNoTooltip]"
 laamp_base_contract_schemes.5901.tt.muggings_tally_and_max:0 "#TUT Você recebeu [scheme.MakeScope.Var('special_muggings_tally').GetValue|0] assaltos especiais de um total possível de [scheme.MakeScope.Var('special_muggings_max').GetValue|0]#!"
 laamp_base_contract_schemes.5901.tt.victim_escapes:0 "[victim.GetTitledFirstName] escapa"
 laamp_base_contract_schemes.6001.a:0 "Devemos garantir a segurança deles!"
 laamp_base_contract_schemes.6001.b:0 "Não há tempo a perder."
 laamp_base_contract_schemes.6001.c:0 "Sem razões para comprometer."
 laamp_base_contract_schemes.6001.desc:0 "\"Animais, bandidos e brutamontes!\"\n\nO mero pensamento parece ser suficiente para perturbar o comportamento de [employer.GetTitledFirstNamePossessive].\n\n\"O povo comum da [employer.GetPrimaryTitle.GetTierAsNameNoTooltip|l] está tão agitado que temo que possam se levantar em armas a qualquer momento. Aqueles com famílias jovens têm rebatido meus oficiais, perguntando por que não os protegemos.\""
 laamp_base_contract_schemes.6001.t:0 "$laamp_base_6001_contract_scheme$"
 laamp_base_contract_schemes.6002.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.6002.desc:0 "Três... quatro... e lá se vai o quinto [ROOT.Char.MakeScope.Var('animal_type').GetFlagName] esta manhã. Coloquei o cadáver na carroça, bem a tempo para [employer.GetTitledFirstName] chegar com alguns de seus servos.\n\n\"Que trabalho magnífico!\" [employer.GetSheHe] aplaude. \"Chega de gado assassinado, chega de crianças perdidas. Aqui, tenha seu pagamento, e se o povo comum reclamar mais uma vez, eu sei a quem chamar.\""
 laamp_base_contract_schemes.6002.t:0 "$laamp_base_6001_contract_scheme$: Sucesso!"
 laamp_base_contract_schemes.6003.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.6003.desc:0 "\"Chega!\" [employer.GetTitledFirstName] grita, balançando a cabeça. \"Não vi uma exibição tão lamentável de força desde que treinamos os pajens com espadas de madeira.\"\n\n\"Meu povo sofre, desprotegido. Você talvez imagina que eles pagariam seus impostos assim?\" [employer.GetSheHe] pergunta com desdém.\n\n\"Você já me fez perder ouro demais. Não continue desperdiçando meu tempo.\""
 laamp_base_contract_schemes.6003.t:0 "$laamp_base_6001_contract_scheme$: Falha!"
 laamp_base_contract_schemes.6011.a:0 "Um[Select_CString( dummy_gender.IsFemale, 'a', '' )] [dummy_gender.GetWomanMan] just[Select_CString( dummy_gender_soldier.IsFemale, 'a', 'o' )]? Para o resgate!"
 laamp_base_contract_schemes.6011.b:0 "Devemos apressar-nos!"
 laamp_base_contract_schemes.6011.c:0 "Uma abordagem equilibrada é a melhor."
 laamp_base_contract_schemes.6011.desc:0 "Um cansado [employer.GetTitledFirstName] se aproxima do acampamento com [Select_CString( dummy_gender_soldier.IsFemale, 'suas', 'seus' )] [dummy_gender_soldier.GetWomenMen]. Os cavalos param bem diante da minha tenda enquanto me levanto para cumprimentá-los.\n\n\"...aquel[Select_CString( dummy_gender.IsFemale, 'a', 'e' )] [dummy_gender.GetWomanMan] [Select_CString( dummy_gender.IsFemale, 'maldita', 'maldito' )],\" ouço o [employer.GetTitleAsNameNoTooltip|l] murmurar.\n\n\"Desejo-lhe bom dia, [ROOT.Char.GetFirstNameNoTooltip],\" [employer.GetSheHe] diz, limpando o suor da testa. \"Parece que um[Select_CString( dummy_gender.IsFemale, 'a', '' )] [dummy_gender.GetWomanMan] #EMP mais bel[Select_CString( dummy_gender.IsFemale, 'a', 'o' )]#! se perdeu na floresta e meus cortesãos não pararão de lamentar até que eu traga [dummy_gender.GetSheHe] de volta.\""
 laamp_base_contract_schemes.6011.t:0 "$laamp_base_6011_contract_scheme$"
 laamp_base_contract_schemes.6012.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.6012.b.tt.failure:0 "[beautiful_peasant.GetShortUIName] se sente insultado"
 laamp_base_contract_schemes.6012.b.tt.success:0 "[beautiful_peasant.GetShortUIName] se sente honrado"
 laamp_base_contract_schemes.6012.b:0 "\"Não precisamos #EMP nos separar#!\""
 laamp_base_contract_schemes.6012.desc:0 "\"De volta!\" Um grito agudo atravessa o dossel de árvores, e eu sigo o som.\n\nParado no meio de uma clareira está [Select_CString( beautiful_peasant.IsFemale, 'uma das', 'um dos' )] [beautiful_peasant.GetWomenMen] mais [Select_CString( beautiful_peasant.IsFemale, 'belas', 'belos' )] que já vi. [beautiful_peasant.GetSheHe|U] empunha um bastão como uma lança e tenta manter sua distância de um feroz [ROOT.Char.MakeScope.Var('animal_type').GetFlagName].\n\nCom um golpe rápido da minha lâmina, eu ataco a besta, e o animal solta um jato de sangue, manchando a grama enquanto cai.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [Select_CString( beautiful_peasant.IsFemale, 'a', 'o' )] [beautiful_peasant.GetWomanMan] grita, caindo de joelhos."
 laamp_base_contract_schemes.6012.t:0 "$laamp_base_6011_contract_scheme$: Sucesso!"
 laamp_base_contract_schemes.6013.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.6013.desc:0 "\"Você se importaria de explicar o que é isso?\" [employer.GetTitledFirstName] entra na minha tenda, jogando um lenço ensanguentado sobre a minha mesa.\n\n\"Os guardas o encontraram enquanto patrulhavam as florestas, e tem um emblema que suponho que você achará familiar.\" [employer.GetSheHe|U] esfrega as sobrancelhas. \"Agora eu tenho que lidar com cortesãos agitados e oficiais de coração partido. Não espere receber o pagamento total.\""
 laamp_base_contract_schemes.6013.t:0 "$laamp_base_6011_contract_scheme$: Falha!"
 laamp_base_contract_schemes.6021.a:0 "Vamos fazer do jeito #EMP mais fácil#!"
 laamp_base_contract_schemes.6021.b:0 "Quanto mais cedo, melhor."
 laamp_base_contract_schemes.6021.c:0 "Isso deve ser divertido."
 laamp_base_contract_schemes.6021.desc.employer_child:0 "\"[employer_child.GetFirstName], isso é suficiente.\" [employer.GetTitledFirstName] pede a [employer_child.GetSheHe] que volte para o lado [employer.GetHerHim]. \"Eu disse que encontraria um verdadeiro herói para a peça e... veja quem acaba de chegar.\" [employer.GetFirstNameNoTooltip] olha diretamente para mim."
 laamp_base_contract_schemes.6021.desc.intro:0 "A praça do mercado de [ROOT.Char.GetCurrentLocation.GetName] está mais movimentada do que nunca, com uma trupe de cantores fazendo preparativos.\n\n\"Uma #EMP espada de madeira#!\" uma das crianças se inclina sobre o estrado, fazendo uma cara de nojo.\n\n"
 laamp_base_contract_schemes.6021.desc.outro:0 "\"Um ganho fácil, não acha? Você só precisa impressionar esses camponeses.\""
 laamp_base_contract_schemes.6021.desc.random_child:0 "Os camponeses alertados rapidamente se juntam a [dummy_gender.GetSheHe]: \"É isso que nossa Majestade tem a oferecer?\"\n\nMas o murmúrio termina assim que [employer.GetTitledFirstName] entra na praça, parando seu cavalo diante de mim:"
 laamp_base_contract_schemes.6021.t:0 "$laamp_base_6021_contract_scheme$"
 laamp_base_contract_schemes.6022.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.6022.desc:0 "$laamp_base_contract_schemes.6022_6023.common_desc$A cabeça rola para fora do palco e o público explode em aplausos. Sentado no estrado elevado, [employer.GetTitledFirstName] acena com a cabeça."
 laamp_base_contract_schemes.6022.t:0 "$laamp_base_6021_contract_scheme$: Sucesso!"
 laamp_base_contract_schemes.6022_6023.common_desc:0 "\"...e então [ROOT.Char.GetSheHe] matou um feroz [ROOT.Char.MakeScope.Var('animal_type').GetFlagName]!\" os tambores ficam mais altos enquanto caminho pelo palco, tentando lembrar de todas as peças que já assisti. Com minha arma levantada acima da cabeça, ataco a marionete colorida.\n\n"
 laamp_base_contract_schemes.6023.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.6023.desc:0 "$laamp_base_contract_schemes.6022_6023.common_desc$Eu falho no golpe e minha espada fica presa na madeira. O público explode em risadas, mas não demora muito até que a frustração tome conta.\n\nDou uma olhada no estrado elevado e encontro [employer.GetTitledFirstName] balançando sua cabeça."
 laamp_base_contract_schemes.6023.t:0 "$laamp_base_6021_contract_scheme$: Falha!"
 laamp_base_contract_schemes.6031.a:0 "Eu quebrarei trezentas lanças!"
 laamp_base_contract_schemes.6031.b:0 "Vai levar alguns dias."
 laamp_base_contract_schemes.6031.c:0 "Para a ponte!"
 laamp_base_contract_schemes.6031.desc:0 "[employer.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('employer'))] enquanto [employer.GetSheHe] avança pelo acampamento.\n\n\"Maravilhosa manhã que temos aqui,\" [employer.GetSheHe] começa, \"uma oportunidade perfeita para mostrar a esses rufiões o valor de um verdadeiro $knight_culture_player_no_tooltip$. Você vê, há uma ponte que vai direto para [ROOT.Char.GetCurrentLocation.GetName]. Todo tipo de malfeitores, tolos e idiotas ficam por lá.\"\n\n\"Alguém deve cuidar disso.\""
 laamp_base_contract_schemes.6031.t:0 "$laamp_base_6031_contract_scheme$"
 laamp_base_contract_schemes.6032.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.6032.desc:0 "Ofegante, bato no meu cavalo nas costas. Calma, agora. Acabou.\n\nProteger esta ponte se tornou minha única tarefa nas últimas duas semanas, armadura brilhando sob a lua. O mar de lanças quebradas que foram empurradas para um lado é um testemunho do meu desempenho.\n\n\"[ROOT.Char.GetFirstNameNoTooltip],\" [employer.GetTitledFirstName] me cumprimenta, enviando alguns de [Select_CString( dummy_gender_soldier.IsFemale, 'suas', 'seus' )] [dummy_soldier.GetWomenMen] para pegar os despojos, \"que visão.\""
 laamp_base_contract_schemes.6032.t:0 "$laamp_base_6031_contract_scheme$: Sucesso!"
 laamp_base_contract_schemes.6033.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.6033.desc:0 "#EMP \"Arghhhh!\"#!\n\nEu caio de joelhos, sangue escorrendo pelo meu cotovelo.\n\n\"Deixe [ROOT.Char.GetSheHe] lá,\" ouço um dos bandidos murmurar antes de se afastarem, \"não vale a pena lutar contra um #EMP $knight_culture_player_no_tooltip$#!, alguém virá pegar [ROOT.Char.GetSheHe].\"\n\nMinha cabeça... tudo vai se apagando, lentamente."
 laamp_base_contract_schemes.6033.t:0 "$laamp_base_6031_contract_scheme$: Falha!"
 laamp_base_contract_schemes_0301_doubtful_stories_modifier:0 "Histórias Duvidosas"
 laamp_base_contract_schemes_0301_doubtful_stories_modifier_desc:0 "Algo não está exatamente certo com as coisas que eles dizem."
 laamp_base_contract_schemes_0311_hates_other_faiths_modifier:0 "Detesta Fés Estranhas"
 laamp_base_contract_schemes_0311_hates_other_faiths_modifier_desc:0 "Este personagem não tem ideia de como tantas pessoas podem estar tão, tão erradas."
 laamp_base_contract_schemes_0311_likes_other_faiths_modifier:0 "Aprecia Fés Errôneas"
 laamp_base_contract_schemes_0311_likes_other_faiths_modifier_desc:0 "Este personagem teve a oportunidade de apreciar as simples alegrias dos teologicamente desafiados."
 laamp_base_contract_schemes_0551_impressive_at_court_modifier:0 "Impressionante na Corte"
 laamp_base_contract_schemes_0551_impressive_at_court_modifier_desc:0 "Existem pessoas influentes em cada corte — aqui, eles olham para você."
 laamp_base_contract_schemes_0551_pathetic_at_court_modifier:0 "Espectáculo Patético"
 laamp_base_contract_schemes_0551_pathetic_at_court_modifier_desc:0 "Se há uma coisa na política pior do que a morte, é a humilhação."
 laamp_base_contract_schemes_0561_bored_insider_modifier:0 "Insider Entediado"
 laamp_base_contract_schemes_0561_bored_insider_modifier_desc:0 "Existem coisas piores do que ser notavelmente monótono. Não muitas, porém."
 laamp_base_contract_schemes_0561_bribed_insider_modifier:0 "Insider Comprado"
 laamp_base_contract_schemes_0561_bribed_insider_modifier_desc:0 "Pode não ser honesto, mas #EMP é#! eficaz."
 laamp_base_contract_schemes_0561_charmed_insider_modifier:0 "Insider Encantado"
 laamp_base_contract_schemes_0561_charmed_insider_modifier_desc:0 "Um pouco de fascínio vai longe."
 laamp_base_contract_schemes_0561_intimidated_insider_modifier:0 "Insider Intimidado"
 laamp_base_contract_schemes_0561_intimidated_insider_modifier_desc:0 "Nada aconteceria, mas e se #EMP pudesse#!?"
 laamp_base_contract_schemes_0561_spooked_insider_modifier:0 "Insider Assustado"
 laamp_base_contract_schemes_0561_spooked_insider_modifier_desc:0 "Palavras ruins de alguém errado podem ser piores que veneno."
 laamp_base_contract_schemes_0791_plentiful_horses_modifier:0 "Cavalos Abundantes"
 laamp_base_contract_schemes_0791_plentiful_horses_modifier_desc:0 "Minha, que curiosamente grande número de montarias em excesso!"
 laamp_base_contract_schemes_0791_suspicious_officers_modifier:0 "Oficiais Suspeitos"
 laamp_base_contract_schemes_0791_suspicious_officers_modifier_desc:0 "Estranhas figuras e acompanhantes duvidosos raramente emprestam credibilidade."
 laamp_base_contract_schemes_0801_target_good_graces_modifier:0 "Bons Favoritos"
 laamp_base_contract_schemes_0801_target_good_graces_modifier_desc:0 "Quando as pessoas certas gostam de você, as outras importam menos."
 laamp_base_contract_schemes_0801_target_irritated_modifier:0 "Irritação"
 laamp_base_contract_schemes_0801_target_irritated_modifier_desc:0 "Algumas pessoas são como moscas, sempre zumbindo ao redor."
 laamp_base_contract_schemes_1301.b.tt.failure:0 "[recidivist.GetFirstNameNoTooltip] escapa da armadilha"
 laamp_base_contract_schemes_1301.b.tt.success:0 "Seu grupo é devastado"
 laamp_base_contract_schemes_1301.b.tt.success_crit:0 "Seu grupo é aniquilado"
 laamp_base_contract_schemes_1301.c.tt.failure:0 "$laamp_base_contract_schemes_1301.b.tt.failure$"
 laamp_base_contract_schemes_1301.c.tt.success:0 "Uma estratégia inteligente prevalece"
 laamp_base_contract_schemes_1301.c.tt.success_crit:0 "Você derrota todo o grupo [recidivist.GetHerHim]"
 laamp_contract_scheme_desc_general_boilerplate:0 "\n\n#WEAK [contract_schemes|E] envolvem a realização de vários deveres para os [rulers|E] do mundo em troca de pagamento. Completar um $game_concept_task_contract$ para um $game_concept_ruler$ automaticamente os adiciona à sua [contact_list|E].#!"
 laamp_contract_scheme_desc_success_boilerplate:0 "Completar com sucesso este [contract_scheme|E] resultará em seu pagamento — #EMP se#! o [contractor|E] estiver satisfeito."
 laamp_contracts.tt.job_for_count:0 "[scheme_target|E] é [count|E]: $VALUE|=+0$"
 laamp_contracts.tt.job_for_duke:0 "[scheme_target|E] é [duke|E]: $VALUE|=+0$"
 laamp_contracts.tt.job_for_emperor:0 "[scheme_target|E] é [emperor|E]: $VALUE|=+0$"
 laamp_contracts.tt.job_for_king:0 "[scheme_target|E] é [king|E]: $VALUE|=+0$"
 laamp_extra_contract_schemes.0001.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_extra_contract_schemes.0001.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_extra_contract_schemes.0001.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_extra_contract_schemes.0001.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_extra_contract_schemes.0001.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_extra_contract_schemes.0001.desc_culture:0 "Eu alcanço um quórum com meus compatriotas. Nós, do [ROOT.Char.GetPrimaryTitle.GetName], somos os mais adequados para ajudar os [task_contract_employer.GetCulture.GetCollectiveNoun] ao nos envolvermos em [scheme.GetName].\n\n"
 laamp_extra_contract_schemes.0001.desc_diplomacy:0 "[task_contract_employer.GetTitledFirstName] começa a organizar uma série de audiências: nesse processo, minhas habilidades oratórias serão colocadas à prova. Negociar bem com os representantes de [task_contract_target.GetTitledFirstNamePossessive] pode garantir a meu empregador seus privilégios."
 laamp_extra_contract_schemes.0001.desc_faith:0 "Eu alcanço um quórum com meus compatriotas. Nós, do [ROOT.Char.GetPrimaryTitle.GetBaseName], somos os mais adequados para ajudar os [task_contract_employer.GetFaith.GetAdherentNamePlural] ao nos envolvermos em [scheme.GetName].\n\n"
 laamp_extra_contract_schemes.0001.desc_intrigue:0 "[task_contract_target.GetTitledFirstName] não pode ser imune aos prazeres deste mundo, nem tão orgulhoso e poderoso que [task_contract_target.GetSheHe] não se sentiria envergonhado por ter seus erros expostos... um chantagem escolhida poderia até assegurar o futuro do povo de [task_contract_target.GetTitledFirstNamePossessive]."
 laamp_extra_contract_schemes.0001.desc_learning:0 "Como todos os corpos de lei, o código do [task_contract_target.GetPrimaryTitle.GetBaseNameNoTier] deve ter algumas regras e isenções obscuras, uma das quais poderia ser feita para acomodar o povo de [task_contract_employer.GetTitledFirstNamePossessive]. Eu só preciso encontrar algo que eles possam usar."
 laamp_extra_contract_schemes.0001.desc_martial:0 "[task_contract_target.GetTitledFirstName] parece um[Select_CString( task_contract_target.IsFemale, 'a', '' )] [task_contract_target.GetWomanMan] razoável. Quando meus seguidores endurecidos começarem a machucar os funcionários locais [task_contract_target.GetHerHim], [task_contract_target.GetSheHe] ficará incomodado? Quando começarmos a liderar as massas de camponeses para gritar e queimar, [task_contract_target.GetSheHe] lutará contra isso? Não, melhor simplesmente concordar com os termos do [task_contract_employer.GetTitledFirstNamePossessive]..."
 laamp_extra_contract_schemes.0001.t_culture:0 "$ep3_contract_event.0020.t$"
 laamp_extra_contract_schemes.0001.t_faith:0 "$ep3_contract_event.0021.t$"
 laamp_extra_contract_schemes.0002.a:0 "O povo de [task_contract_employer.GetCapitalLocation.GetNameNoTooltip] pode se alegrar!"
 laamp_extra_contract_schemes.0002.desc_diplomacy:0 "No próprio salão de [task_contract_target.GetName], argumento a causa de [task_contract_employer.GetTitledFirstName]. Com boas notícias a relatar, com os aplausos ainda ecoando em meus ouvidos, retorno ao meu empregador. \n\n'Uma coisa menor, facilmente corrigida', [task_contract_target.GetSheHe] chamou isso!\" [task_contract_employer.GetSheHe] sorri. \"Como você defendeu a 'coisa menor' da liberdade do meu povo! Nossas proteções em breve serão oficialmente proclamadas, e eu mal posso estar mais satisfeito."
 laamp_extra_contract_schemes.0002.desc_intrigue:0 "[task_contract_target.GetName] é um[Select_CString( task_contract_target.IsFemale, 'a', '' )] [task_contract_target.GetWomanMan] bastante complex[Select_CString( task_contract_target.IsFemale, 'a', 'o' )] — sua moral, não seu intelecto! Juntei uma rica quantidade de rumores verdadeiramente venenosos; algumas palavras cuidadosamente planejadas, e o [task_contract_target.GetTitleAsNameNoTooltip] estará ciente de toda a dignidade que [task_contract_target.GetHerHe] perderá ao se opor a [task_contract_employer.GetTitledFirstName].\n\n\"Quão facilmente a corte de meu senhor feudal poderia se tornar um vil ninho de víboras!\" exulta [task_contract_employer.GetTitledFirstName]. \"Serei misericordioso e darei a ele a chance de conceder os direitos do meu povo... antes que eu envie seus assuntos a espiral fora de controle."
 laamp_extra_contract_schemes.0002.desc_learning:0 "Eu estudo tudo que posso encontrar sobre a lei [task_contract_target.GetPrimaryTitle.GetAdjectiveNoTooltip]: canônica do [task_contract_target.GetFaith.GetName], princípios da [task_contract_target.GetCulture.GetName]... oh sim, coletei um verdadeiro arsenal de precedentes e nuances.\n\n\"Explique novamente...\" pergunta [task_contract_employer.GetTitledFirstName]. \"Devo invocar [task_contract_target.GetFaith.WarGodName] quando levantar a questão da honra inviolável, sim? Ah, não importa — nosso caso está mais forte do que nunca! O consentimento de [task_contract_target.GetTitledFirstNamePossessive] é apenas uma formalidade."
 laamp_extra_contract_schemes.0002.desc_martial:0 "Como esperado, meus seguidores endurecidos semeiam medo no reino de [task_contract_target.GetTitledFirstNamePossessive], forçando [task_contract_target.GetSheHe] a, finalmente — e de uma posição de fraqueza — vir à mesa de negociações.\n\n\"Você causou um estrago que os opressores de [task_contract_employer.GetPrimaryTitle.GetNameNoTier] lembrarão por muito tempo!\" admira [task_contract_employer.GetTitledFirstNameNoTooltip]. \"Deveria ser #EMP eles#! implorando por direitos de proteção! Mas, de qualquer forma: as novas obrigações do meu senhor feudal logo estarão em vigor. Uma grande vitória!"
 laamp_extra_contract_schemes.0002.t_diplomacy:0 "Sucesso: Esquema de $protect_minority_vassal_contract_diplomacy_scheme$"
 laamp_extra_contract_schemes.0002.t_intrigue:0 "Sucesso: Esquema de $protect_minority_vassal_contract_intrigue_scheme$"
 laamp_extra_contract_schemes.0002.t_learning:0 "Sucesso: Esquema de $protect_minority_vassal_contract_learning_scheme$"
 laamp_extra_contract_schemes.0002.t_martial:0 "Sucesso: Esquema de $protect_minority_vassal_contract_martial_scheme$"
 laamp_extra_contract_schemes.0003.a:0 "Não melhorei as coisas para [task_contract_employer.GetTitledFirstNameNoTooltip]..."
 laamp_extra_contract_schemes.0003.desc_diplomacy:0 "[task_contract_target.GetNamePossessive] não me dá nada, nenhuma folga ou simpatia. Não importa minhas palavras, os representantes [task_contract_target.GetPrimaryTitle.GetAdjective] simplesmente gargalharam na minha cara\n\n\"Fui informado de que meu senhor feudal já teve #EMP o bastante#! da sua insistência!\" grita [task_contract_employer.GetTitledFirstNameNoTooltip]. \"Seu coração mole — e meu povo lamentável — são zombados por todo [task_contract_employer.GetPrimaryTitle.GetNameNoTierNoTooltip]! O seu foi um truque óbvio... e agora #EMP nós#! arcaremos com as consequências."
 laamp_extra_contract_schemes.0003.desc_intrigue:0 "[task_contract_target.GetName] se revela ser um[Select_CString( task_contract_target.IsFemale, 'a', '' )] [task_contract_target.GetWomanMan] [Select_CString( task_contract_target.IsFemale, 'muito esperta e muito discreta', 'muito esperto e muito discreto' )]. Ao não encontrar nenhuma sujeira substancial, tentei espalhar rumores na corte [task_contract_target.GetHerHim], mas todos são contestados e esmagados no ato.\n\n\"Seus agentes tagarelam como crianças!\" insulta meu empregador. \"Você diz que suas intrigas blindarão meu povo, mas você nos envolve com sombras e sussurros — que se dissipam ao serem falados em voz alta! Esse truque sempre foi fútil..."
 laamp_extra_contract_schemes.0003.desc_learning:0 "Eu estudo tudo que posso encontrar sobre a lei [task_contract_target.GetPrimaryTitle.GetAdjectiveNoTooltip]: canônica do [task_contract_target.GetFaith.GetName], princípios da [task_contract_target.GetCulture.GetName]... acumulo alguns argumentos frágeis, mas meu jargão criativo pouco impressiona [task_contract_employer.GetName].\n\n\"#EMP Isso#! é o que você conseguiu? Você acha que meu povo deve ser tratado legalmente como #EMP crianças#! dentro de [task_contract_target.GetPrimaryTitle.GetName]?!?\" grita o [task_contract_employer.GetTitleAsNameNoTooltip]. \"Um truque mesquinho e humilhante, e um que [task_contract_target.GetTitledFirstName] verá facilmente! Não — estamos sem esperança."
 laamp_extra_contract_schemes.0003.desc_martial:0 "Enquanto meus seguidores correm soltos em [task_contract_target.GetPrimaryTitle.GetName], [task_contract_target.GetName] não vacila. Todo o assédio ao povo [task_contract_target.GetHerHim] é retribuído a [task_contract_employer.GetTitledFirstNamePossessive].\n\n\"Já tivemos o suficiente!\" diz meu empregador. \"Esses tempos sórdidos nos destruirão! Mande seus capangas embora, ou meus [task_contract_employer.Custom('KnightCulturePluralNoTooltip')|l] e o de meu senhor feudal se unirão contra você!"
 laamp_extra_contract_schemes.0003.t_diplomacy:0 "Falha: Esquema de $protect_minority_vassal_contract_diplomacy_scheme$"
 laamp_extra_contract_schemes.0003.t_intrigue:0 "Falha: Esquema de $protect_minority_vassal_contract_intrigue_scheme$"
 laamp_extra_contract_schemes.0003.t_learning:0 "Falha: Esquema de $protect_minority_vassal_contract_learning_scheme$"
 laamp_extra_contract_schemes.0003.t_martial:0 "Falha: Esquema de $protect_minority_vassal_contract_martial_scheme$"
 laamp_extra_contract_schemes.0011.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_extra_contract_schemes.0011.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_extra_contract_schemes.0011.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_extra_contract_schemes.0011.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_extra_contract_schemes.0011.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_extra_contract_schemes.0011.desc:0 "[task_contract_employer.GetTitledFirstName] foi sábio ao recorrer a mim, um [ROOT.Char.GetLiege.Custom('KnightCultureNoTooltip')|l] livre com pouco a perder, para tal empreendimento imprudente... há maneiras de passar pelas paredes de [task_contract_target.GetCapitalLocation.GetName], mas nenhuma sem grande risco. Por algum pretexto inteligente, precisarei de olhos amistosos até a cela de [task_contract_object.GetTitledFirstNamePossessive]...\n\n[task_contract_employer.Custom2('HerHisCharacterIntroduction', task_contract_object)|U] chamaria atenção mesmo com o menor envolvimento. Não, a liberdade d[Select_CString( task_contract_target.IsFemale, 'a', 'o' )] [task_contract_object.GetWomanMan] depende apenas d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetPrimaryTitle.GetBaseName]."
 laamp_extra_contract_schemes.0011.t:0 "$ep3_contract_event.0030.t$"
 laamp_extra_contract_schemes.0012.a:0 "\"Gosto dessa atitude... junte-se a nós!\""
 laamp_extra_contract_schemes.0012.b:0 "\"[task_contract_employer.GetTitledFirstNameNoTooltip] aguarda ansiosamente por você.\""
 laamp_extra_contract_schemes.0012.desc:0 "Eu faço um sinal para [task_contract_object.GetFirstNameNoTooltip], guiando [task_contract_object.GetSheHe] para fora nas sombras."
 laamp_extra_contract_schemes.0012.desc_free:0 "Nós nos esgueiramos até nossos cavalos, pulamos na sela e esporeamos forte.\n\n\"Você salvou minha vida, verdadeiramente!\" [task_contract_object.GetNameNoTooltip] diz, quando finalmente desaceleramos. \"E que emoção foi essa!\""
 laamp_extra_contract_schemes.0012.desc_infiltrator:0 "De volta pelo meu ponto de entrada — uma janela deixada aberta por [agent_infiltrator.GetFirstName] — vamos."
 laamp_extra_contract_schemes.0012.desc_lookout:0 "[agent_lookout.GetFirstName] vigilante sinaliza que estamos livres."
 laamp_extra_contract_schemes.0012.desc_no_infiltrator:0 "De volta pelo meu ponto de entrada — um corredor aparentemente desprotegido — vamos."
 laamp_extra_contract_schemes.0012.desc_no_lookout:0 "Então olho freneticamente ao redor em busca de guardas, parece que estamos livres para ir."
 laamp_extra_contract_schemes.0012.desc_no_thief:0 "$laamp_extra_contract_schemes.0013.desc_intro$ Meus dedos estão escorregadios com o suor nervoso, mas ainda assim minha chave de fenda clica com precisão."
 laamp_extra_contract_schemes.0012.desc_thief:0 "$laamp_extra_contract_schemes.0013.desc_intro$ O astuto [agent_thief.GetFirstName] rapidamente destranca a fechadura que nos impede de [task_contract_object.GetTitledFirstName]."
 laamp_extra_contract_schemes.0012.t:0 "Sucesso: $laamp_prison_break_contract_contract$ Esquema"
 laamp_extra_contract_schemes.0013.a:0 "[task_contract_object.GetSheHe|U] com certeza será colocado sob constante vigilância..."
 laamp_extra_contract_schemes.0013.desc:0 "$laamp_extra_contract_schemes.0012.desc_no_thief$ $laamp_extra_contract_schemes.0012.desc$ $laamp_extra_contract_schemes.0012.desc_no_infiltrator$\n\nMas os guardas [task_contract_object.GetHerHim] armam sua armadilha: #EMP eles previram o resgate!#!\n\n\"Pelo [task_contract_object.GetFaith.HighGodName]! Eu sabia que era fácil demais!\" grita [task_contract_object.GetFirstNameNoTooltip]. \"Corra, bravo [ROOT.Char.GetLiege.Custom('KnightCultureNoTooltip')|l]!\"\n\nOs guardas se lançam em nossa direção, e não há tempo, nenhuma esperança de vitória — então eu corro! Por algum milagre, consigo despistar meus perseguidores e chego em segurança à parede externa... mas [task_contract_object.GetFirstNameNoTooltip] nunca chega."
 laamp_extra_contract_schemes.0013.desc_intro:0 "No meio da noite, eu me deslizo para onde [task_contract_object.GetTitledFirstName] está preso."
 laamp_extra_contract_schemes.0013.desc_no_infiltrator:0 "$laamp_extra_contract_schemes.0012.desc_no_thief$ $laamp_extra_contract_schemes.0012.desc$ De volta ao meu ponto de entrada — um corredor aparentemente desprotegido — vamos. Mas sua porta agora está trancada!\n\nEnquanto a abro com esforço, um guarda aparece atrás de nós!\n\n\"Eu o segurarei!\" grita [task_contract_object.GetFirstNameNoTooltip]. \"Vá!\"\n\nCom outras vozes soando por perto, eu faço a única escolha prática — fujo. Se alguém deve morrer pel[Select_CString( task_contract_object.IsFemale, 'a', 'o' )] [task_contract_object.GetWomanMan]... não deveria ser [task_contract_employer.GetTitledFirstName]?..."
 laamp_extra_contract_schemes.0013.desc_no_lookout:0 "$laamp_extra_contract_schemes.0012.desc_no_thief$ Mas, no chão, há um lampejo de luz de lamparina — os guardas estão perto! Como eu gostaria de ter olhos nas costas! Eu agarro [task_contract_object.GetFirstNameNoTooltip] para uma corrida alucinada.\n\n\"Quem está aí?\" grita o carcereiro. \"#EMP Alarme! Alarme!#!\n\nPerseguidores armados rapidamente se lançam sobre nós e, no pior momento, [task_contract_object.GetFirstNameNoTooltip] tropeça e cai no chão. Em um instante, [task_contract_object.GetSheHe] é empilhado; com pouco mais a fazer, eu faço uma fuga solitária."
 laamp_extra_contract_schemes.0013.desc_no_thief:0 "$laamp_extra_contract_schemes.0013.desc_intro$ Por algum tempo, eu mexo na porta com uma chave de fenda. Talvez um ladrão conseguisse abrir. Mas eu não consigo. Sem outra opção, lanço um chute barulhento. E vozes soam por perto — carcereiros!\n\n\"Perdoe-me, mas preciso ir, [Select_CString( task_contract_object.IsFemale, 'minha', 'meu' )] [task_contract_object.GetLadyLord]. Isso está um pouco... além de mim,\" sussurro, ao me despedir.\n\n\"#EMP Bah!#! Obrigado por nada!\" retorque uma voz que certamente é de [task_contract_object.GetFirstNamePossessiveNoTooltip].\n\n\"Huh? Quem vai aí?\" grita um guarda. Felizmente... estou bem escondido enquanto escorrego para o escuro."
 laamp_extra_contract_schemes.0013.t:0 "Falha: $laamp_prison_break_contract_contract$ Esquema"
 laamp_extra_contract_schemes.0022.a:0 "Vou manter esta obrigação para mim."
 laamp_extra_contract_schemes.0022.b:0 "Um gancho perfeito para o [councillor_liege.GetTitleAsNameNoTooltip]."
 laamp_extra_contract_schemes.0022.c:0 "Não posso me rebaixar tanto."
 laamp_extra_contract_schemes.0022.t:0 "$ep3_contract_event.0100.t$"
 laamp_extra_contract_schemes.0023.a:0 "Vou simplesmente pegar o ouro. Tente não pensar sobre isso."
 laamp_extra_contract_schemes.0023.desc:0 "\"Meu senhor feudal está satisfeito com as percepções que você obteve. Você encontrou, o quê? [secrets_found_value]? Não é uma tarefa pequena...\" [task_contract_councillor.GetName] se inclina para a luz, expondo que [task_contract_councillor.GetSheHe] está de alguma forma comigo na minha tenda.\n\n\"Como você chegou aqui sem ser notado?\" eu pergunto, confuso, mas antes que eu possa chamar meus guardas — não há mais ninguém lá. Apenas um saco considerável de moedas deixado para trás."
 laamp_extra_contract_schemes.0023.t:0 "$ep3_contract_event.0100.t$"
 laamp_extra_contract_schemes.0024.a:0 "Que desperdício de tempo!"
 laamp_extra_contract_schemes.0024.desc:0 "\"Estive aguardando seu relatório, mas nada veio. Estava preocupado... talvez você tenha esquecido nosso acordo?\" [task_contract_councillor.GetName] me despreza — enquanto me aproximo do privy! Que audácia! Como [task_contract_councillor.GetSheHe] chegou aqui sem ser notado?\n\n\"Tive meus agentes em cada esquina de [task_contract_target.GetCapitalLocation.GetName], sem sucesso,\" eu explico. \"Ou os cortesãos de [task_contract_target.GetTitledFirstNamePossessive] são leais ou simplesmente não há nada digno de rumores.\"\n\n\"Uma desculpa infantil... pensei que você poderia fazer melhor. Pelo menos uma mentira mais agradável. Considere nosso acordo encerrado.\" Balançando a cabeça, [task_contract_councillor.GetFirstNameNoTooltip] desaparece tão rapidamente quanto [task_contract_councillor.GetSheHe] veio."
 laamp_extra_contract_schemes.0024.t:0 "$ep3_contract_event.0100.t$"
 laamp_extra_contract_schemes.0030.a:0 "Vou ficar com uma cópia para mim."
 laamp_extra_contract_schemes.0030.b:0 "[target.GetNameNoTooltip] estará em melhores mãos!"
 laamp_extra_contract_schemes.0030.c:0 "Não confio mais em você..."
 laamp_extra_contract_schemes.0030.desc:0 "As notícias sobre minha nova reivindicação rapidamente chegam a [task_contract_councillor.GetName].\n\n\"Parabéns! Um trabalho bem feito.\" [task_contract_councillor.GetSheHe|U] diz, como se estivesse se batendo nas costas.\n\n\"[task_contract_councillor_liege.GetTitledFirstName] ficará bastante satisfeito e com certeza o recompensará adequadamente. Eu levarei nosso precioso documento daqui... se você apenas me entregar?\" [task_contract_councillor.GetFirstNameNoTooltip] rapidamente fica agitado. \"Vamos lá! Dê-o para mim!\" [task_contract_councillor.GetSheHe] diz, estalando os dedos."
 laamp_extra_contract_schemes.0030.t:0 "$ep3_contract_event.0080.t$"
 laamp_help_find_secrets_scheme:0 "Encontrar Segredos"
 laamp_help_find_secrets_scheme_action:0 "Encontrar Segredos sobre"
 laamp_help_find_secrets_scheme_desc:0 "Descubra os segredos dos [vassals|E] [contractor|E], permitindo que você os chantageie por [hooks|E] ou relate ao seu [contractor|E]."
 laamp_help_find_secrets_scheme_desc_general:0 "$laamp_help_find_secrets_scheme_desc$"
 laamp_help_find_secrets_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_prison_break_scheme:0 "Fuga da Prisão"
 laamp_prison_break_scheme_action:0 "Resgatar da Prisão de"
 laamp_prison_break_scheme_desc:0 "Planeje e execute um assalto ao [spouse|E], [family|E], [best_friend|E] ou [soulmate|E] do [contractor|E] de uma [prison|E]."
 laamp_prison_break_scheme_desc_general:0 "$laamp_prison_break_scheme_desc$"
