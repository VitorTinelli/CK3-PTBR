 laamp_base_contract_schemes.0001.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.0001.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.0001.desc:0 "Não é incomum que governantes estabelecidos como [employer.GetFirstName] recebam viajantes notáveis como eu — por alguns presentes e acomodações decentes, [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] como os nossos oferecem entretenimento, inteligência e uma distração adequada para seus muitos cortesãos.\n\nClaro, isso é #EMP se#! eu e meu [ROOT.Char.Custom('GetCourtierTypePlural')|l] pudermos garantir nosso sustento com nossas histórias."
 laamp_base_contract_schemes.0001.t:0 "Contando histórias na Corte de [employer.GetTitledFirstNamePossessiveNoTooltip]"
 laamp_base_contract_schemes.0002.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.0002.desc:0 "Os cortesãos de [employer.GetFirstNamePossessive] praticamente desmaiaram sobre mim e meu grupo nos últimos meses.\n\nDia após dia, noite após noite, enchemos suas cabeças com histórias fantásticas e nossos estômagos com iguarias ricas, deixando o bom [employer.GetTitleAsNameNoTooltip] mais do que satisfeito com nossa performance.\n\nAinda assim, todas as coisas boas devem chegar ao fim, e é melhor para nós sairmos em alta."
 laamp_base_contract_schemes.0002.t:0 "$laamp_base_contract_schemes.0001.t$: Sucesso!"
 laamp_base_contract_schemes.0003.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.0003.desc:0 "Esses cães ignorantes! Eles nos convidam aqui, fornecem nada além de #EMP comida de lixo#!, cama feita de palha que já estava velha quando meu avô/avó [ROOT.Char.GetMotherFather] era jovem, e provocam e picam nossas histórias de estrada.\n\nA hospitalidade em exibição é... bem, que hospitalidade?\n\nTudo isso por nada. [employer.GetTitledFirstName] está furioso, e claramente a única coisa que nos mantém fora da masmorra é a sensação de que seria mais problema do que vale a pena.\n\nNosso tempo em [employer.GetCapitalLocation.GetTitle.GetNameNoTier] acabou."
 laamp_base_contract_schemes.0003.t:0 "$laamp_base_contract_schemes.0001.t$: Falha!"
 laamp_base_contract_schemes.0011.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.0011.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.0011.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.0011.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.0011.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.0011.desc:0 "Não é segredo que a reputação de [employer.GetTitledFirstNamePossessive] não é tudo que poderia ser. Vassalos infelizes, murmúrios preocupantes sobre comportamento tirânico, uma escassez de prestígio intangível — todos sinais que podem apontar para um controle mais frágil sobre o poder do que a maioria dos [employer.Custom('LadiesLords')] gostaria.\n\nPagar alguém para esclarecer tais mal-entendidos não será barato, claro. Pelo menos, não se eu puder dizer alguma coisa sobre isso."
 laamp_base_contract_schemes.0011.t:0 "Melhorando o Nome de [employer.GetTitleAsNamePossessiveNoTooltip]"
 laamp_base_contract_schemes.0012.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.0012.desc:0 "É surpreendente como algumas poucas palavras em cantos silenciosos podem mudar uma situação. Um sussurro aqui, um comentário ali, uma ação defendida no jantar...\n\nClaro, não teria quase o mesmo significado vindo de um magnata de terras. Poder demais, muito em jogo, muito risco de insinceridade — mas um humilde [ROOT.Char.Custom('GetLaampDescribeTypeSelf')], parando brevemente na corte enquanto [ROOT.Char.GetSheHe] e seu grupo seguem seu caminho pelo mundo, bem.\n\nAgora isso é um jogo totalmente diferente.\n\nDesnecessário dizer que [employer.GetTitledFirstName] está mais do que satisfeito com nossos esforços, e devemos seguir em frente."
 laamp_base_contract_schemes.0012.t:0 "$laamp_base_contract_schemes.0011.t$: Sucesso!"
 laamp_base_contract_schemes.0013.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.0013.desc:0 "Como eu #EMP poderia#! ter sucesso nisso? Um [ROOT.Char.Custom('GetLaampDescribeTypeSelf')] viajante sem influência com o povo ou a nobreza.\n\nEra uma tarefa absurda me designar, ainda assim [employer.GetTitledFirstName] parece determinado a me responsabilizar pelo fiasco de seu povo despejando a culpa [employer.GetHerHim] por desdéns imaginários e abusos teóricos de poder.\n\n[employer.GetCapitalLocation.GetTitle.GetNameNoTier] não é mais um lugar seguro para meu grupo."
 laamp_base_contract_schemes.0013.t:0 "$laamp_base_contract_schemes.0011.t$: Falha!"
 laamp_base_contract_schemes.0021.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.0021.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.0021.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.0021.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.0021.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.0021.desc:0 "[employer.GetTitledFirstName] é um[Select_CString( employer.IsFemale, 'a', '' )] [employer.GetWomanMan] solitári[Select_CString( employer.IsFemale, 'a', 'o' )] em uma posição de poder, tornando perversamente difícil para [employer.GetSheHe] conhecer pessoas que não #EMP queiram#! nada [employer.GetHerHim].\n\nMinha companhia deve ser diferente, uma chance de fazer uma conexão real. Não é, claro — eu quero tanto quanto qualquer outro aproveitador — mas é uma boa fantasia acreditar nisso por um tempo.\n\nMeus [ROOT.Char.Custom('GetCourtierTypePlural')|l] e eu estaremos longe antes que [employer.GetSheHe] suspeite de algo."
 laamp_base_contract_schemes.0021.t:0 "Fazendo Amigos em Altos Círculos"
 laamp_base_contract_schemes.0022.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.0022.desc:0 "Naturalmente, [employer.GetTitledFirstName] se deixou levar pelo meu charme, pela canção das florestas e a vida romântica de um(a) [ROOT.Char.Custom('GetLaampDescribeTypeSelf')] viajante, assim como eu sabia que [employer.GetSheHe] faria.\n\nFinalmente fazemos nossos preparativos para partir, [employer.GetFirstNameNoTooltip] triste por nos ver ir, mas feliz pelo pequeno alívio que nossa companhia deu a [employer.GetSheHe].\n\nClaro, não é tudo unilateral. Eu garanti um rico pagamento em presentes e suprimentos para o grupo, mais do que suficiente para justificar nosso tempo passado aqui."
 laamp_base_contract_schemes.0022.t:0 "$laamp_base_contract_schemes.0021.t$: Sucesso!"
 laamp_base_contract_schemes.0023.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.0023.desc:0 "Talvez... talvez [employer.GetTitledFirstName] não esteja tão solitário(a) assim? Certamente [employer.GetSheHe] não parece querer #EMP minha#! companhia, uma 'suja e fedorenta [ROOT.Char.Custom('GetLaampDescribeTypeInsult')] com a estrutura [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('employer'))] de um criminoso'.\n\nA ousadia de tudo isso, me convidar a ficar e depois me tratar como... como #EMP isto#!. Indelicado, para dizer o mínimo, e não condizente com um[Select_CString( employer.IsFemale, 'a', '' )] [employer.GetWomanMan] de suposta estatura nobre.\n\nDesnecessário dizer que meu pagamento não virá, e meu grupo e eu temos até o anoitecer para deixar [employer.GetCapitalLocation.GetTitle.GetNameNoTier]."
 laamp_base_contract_schemes.0023.t:0 "$laamp_base_contract_schemes.0021.t$: Falha!"
 laamp_base_contract_schemes.0031.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.0031.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.0031.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.0031.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.0031.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.0031.desc:0 "A interminável briga de locais mesquinhos é uma das poucas experiências compartilhadas tanto pelos governantes do mundo quanto por [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] como eu.\n\nÉ suficiente para deixar um[Select_CString( employer.IsFemale, 'a', '' )] [employer.GetWomanMan] louc[Select_CString( employer.IsFemale, 'a', 'o' )], ou pelo menos fazer [employer.GetHerHim] tão frustrad[Select_CString( employer.IsFemale, 'a', 'o' )] que [employer.GetSheHe] recorra a estranhos para ajuda — o que é exatamente o que [employer.GetTitledFirstName] fez.\n\nSe meus [ROOT.Char.Custom('GetCourtierTypePlural')|l] e eu pudermos acalmar alguns dos sujeitos mais irritados [employer.GetHerHim], seremos bem pagos."
 laamp_base_contract_schemes.0031.t:0 "Um Partido Neutro"
 laamp_base_contract_schemes.0032.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.0032.desc:0 "Problemas locais são problemas mesquinhos. Não para os envolvidos, claro, mas para um estranho sem interesse em suas intermináveis disputas, eles geralmente são eminente solucionáveis.\n\nNão posso dizer que satisfiz #EMP todos#!, mas essa não era minha tarefa. Apenas acalmá-los o suficiente para deixar [employer.GetTitledFirstName] feliz, e [employer.GetSheHe] está feliz — o suficiente para abrir sua bolsa de moedas, de qualquer forma.\n\nUm trabalho bem feito."
 laamp_base_contract_schemes.0032.t:0 "$laamp_base_contract_schemes.0031.t$: Sucesso!"
 laamp_base_contract_schemes.0033.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.0033.desc:0 "Esses ignorantes diabos são simplesmente impossíveis!\n\nNenhum[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] viv[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] poderia resolver sua interminável lista de problemas, rixas e disputas de fronteira. Eu sou [ROOT.Char.Custom('GetLaampDescribeTypeSelfArticle')] [ROOT.Char.Custom('GetLaampDescribeTypeSelf')], droga, não algum funcionário mesquinho. Claro, [employer.GetTitledFirstName] não se importa muito com minha situação. No que [employer.GetSheHe] se refere, isso é uma simples falha de habilidade e nada mais.\n\n\"Talvez se você fosse mais capaz, estaria sendo pago. Mas não está, então não está. Agora saia\"."
 laamp_base_contract_schemes.0033.t:0 "$laamp_base_contract_schemes.0031.t$: Falha!"
 laamp_base_contract_schemes.0034.a:0 "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.0034.b:0 "$travel.mobile_domicile.option.t$"
 laamp_base_contract_schemes.0034.desc:0 "Com o mandado de autorização de [employer.GetTitledFirstNamePossessive] em mãos, partimos em nossa jornada.\n\nA viagem nos levará a [destination_3.GetNameNoTier], depois a [destination_2.GetNameNoTier], antes de finalmente retornar a [destination_1.GetNameNoTier].\n\nA única pergunta restante é se queremos viajar leve ou viajar em pleno."
 laamp_base_contract_schemes.0034.t:0 "$laamp_base_contract_schemes.0031.t$: Partindo"
 laamp_base_contract_schemes.0034.tt.destination_list:0 "Você imediatamente começa [traveling|E] para [destination_3.GetNameNoTier], depois [destination_2.GetNameNoTier], depois [destination_1.GetNameNoTier]"
 laamp_base_contract_schemes.0034.tt.explanation:0 "#TUT Para completar o [task_contract|E]:\n$EFFECT_LIST_BULLET$Complete um desafio de [skill|E] em cada destino\n$EFFECT_LIST_BULLET$Você deve vencer dois desafios para um $label_success_standard$\n$EFFECT_LIST_BULLET$Se você vencer os três desafios, ganhará um $label_success_critical$\n$EFFECT_LIST_BULLET$@warning_icon! #N Falhar em um desafio em qualquer ponto falha o $game_concept_task_contract$#!\n$EFFECT_LIST_BULLET$@alert_icon! #alert_trial Você pode testar cada [skill|E] apenas uma vez por [task_contract|E]#!#!"
 laamp_base_contract_schemes.0041.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.0041.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.0041.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.0041.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.0041.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.0041.desc:0 "Pobre, crédulo(a) [employer.GetFirstName]: [employer.GetSheHe] pode ser o(a) [employer.GetTitleAsNameNoTooltip], mas [employer.GetSheHe] não é mais inteligente que o(a) bêbado(a) médio(a) de uma taverna perdida. Apenas mais rico(a).\n\nUm convite aberto para notáveis viajantes ficarem na casa [employer.GetHerHim] por um tempo é tudo que minha [ROOT.Char.Custom('GetCourtierTypePlural')|l] e eu precisamos, e antes que [employer.GetSheHe] perceba, a boa riqueza de [employer.GetTitleAsNamePossessiveNoTooltip] estará em meu bolso, e nós estaremos longe."
 laamp_base_contract_schemes.0041.t:0 "Confie em Mim"
 laamp_base_contract_schemes.0042.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.0042.desc:0 "Que presentes adoráveis [employer.GetTitledFirstName] dá, quando [employer.GetSheHe] está de bom humor! Um retorno muito válido pelo meu tempo, embora infelizmente #EMP talvez#! não para [employer.GetSheHe].\n\nAh bem, não pode ser ajudado. Um tolo e seu dinheiro e tudo isso.\n\nClaro, [employer.GetSheHe] descobrirá isso em breve, ou alguém finalmente conseguirá explicar o que aconteceu com o(a) bom(boa) [employer.GetTitleAsNameNoTooltip|l], mas não importa. Conseguimos o que queríamos e estaremos fora antes do amanhecer."
 laamp_base_contract_schemes.0042.t:0 "$laamp_base_contract_schemes.0041.t$: Sucesso!"
 laamp_base_contract_schemes.0043.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.0043.desc:0 "[employer.GetTitledFirstName] não é tão lento(a) quanto [employer.GetSheHe] parece! Não sei o que deu o jogo — um olhar fora de lugar, uma frase suspeita, um sorriso no momento errado — mas [employer.GetSheHe] está atento(a) a nós.\n\nNão haverá moeda dest[Select_CString( employer.IsFemale, 'a', 'e' )] [employer.GetWomanMan], e nem mais alojamento também.\n\nAo contrário de [employer.GetFirstNameNoTooltip], eu não sou tol[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], e posso ver quando os ventos se voltaram contra mim; minha [ROOT.Char.Custom('GetCourtierTypePlural')|l] e eu partiremos de [employer.GetCapitalLocation.GetTitle.GetNameNoTier] dentro de uma hora."
 laamp_base_contract_schemes.0043.t:0 "$laamp_base_contract_schemes.0041.t$: Falha!"
 laamp_base_contract_schemes.0301.a.tt.failure:0 "Suas palavras soam vazias"
 laamp_base_contract_schemes.0301.a.tt.success:0 "Seus feitos são encantadores"
 laamp_base_contract_schemes.0301.a:0 "Acho que conheço algumas dessas histórias..."
 laamp_base_contract_schemes.0301.b.f:0 "As chances disso são controladas pelo seu [prestige_level|E]"
 laamp_base_contract_schemes.0301.b.tt.failure:0 "Ela não fala"
 laamp_base_contract_schemes.0301.b.tt.success:0 "Ela fala"
 laamp_base_contract_schemes.0301.b:0 "Não fala minha reputação por si mesma?"
 laamp_base_contract_schemes.0301.c.tt.failure:0 "Uma obvia enganação"
 laamp_base_contract_schemes.0301.c.tt.success:0 "Histórias exageradas são as melhores histórias"
 laamp_base_contract_schemes.0301.c:0 "Todas as histórias crescem na contação!"
 laamp_base_contract_schemes.0301.d:0 "Coma a comida grátis e deixe assim."
 laamp_base_contract_schemes.0301.desc:0 "Um jantar na corte de [target.GetTitledFirstNamePossessive] é o momento ideal para impressionar seus cortesãos com minhas ousadas escapadas.\n\nQuanto mais felizes eles estiverem, mais cheia é a minha bolsa.\n\nClaro, isso exige menos sutileza e mais histórias de grandes empreendimentos, repletas de heroísmo e vilania — com precisão ou não."
 laamp_base_contract_schemes.0301.e:0 "Encha seus bolsos com pãezinhos grátis."
 laamp_base_contract_schemes.0301.t:0 "Histórias e Glórias"
 laamp_base_contract_schemes.0311.a.tt.failure.cultural_acceptance:0 "As histórias de um estranho sobre a barbárie distante"
 laamp_base_contract_schemes.0311.a.tt.failure:0 "Um discurso horrível"
 laamp_base_contract_schemes.0311.a.tt.success.cultural_acceptance:0 "As histórias de um aventureiro sobre maravilhas estrangeiras"
 laamp_base_contract_schemes.0311.a.tt.success:0 "Um conto fascinante"
 laamp_base_contract_schemes.0311.a:0 "Deixe-me contar sobre a vida em [exotic_culture.GetNameNoTooltip]!"
 laamp_base_contract_schemes.0311.b.tt.failure:0 "Depravação confusa"
 laamp_base_contract_schemes.0311.b.tt.success:0 "Exoticismos atraentes"
 laamp_base_contract_schemes.0311.b:0 "Ahhhh, [exotic_faith.GetNameNoTooltip] é uma coisa misteriosa..."
 laamp_base_contract_schemes.0311.c.tt.failure:0 "Mentiras mais óbvias"
 laamp_base_contract_schemes.0311.c.tt.success:0 "Mentiras tão doces"
 laamp_base_contract_schemes.0311.c:0 "Eu irei pintar para você... uma #EMP imagem#!..."
 laamp_base_contract_schemes.0311.d:0 "As nuances se perderiam para você, receio."
 laamp_base_contract_schemes.0311.desc.both_exotic:0 "Sendo tanto [exotic_culture.GetName] quanto [exotic_faith.GetAdherentName], meu modo de vida alienígena é infinitamente fascinante para os cortesãos de [target.GetTitledFirstNamePossessive].\n\nMuitos deles nunca viram um de minha espécie antes. Talvez nunca mais verão depois que partirmos, embora eu não possa dizer como a história se desenrolará."
 laamp_base_contract_schemes.0311.desc.only_exotic_culture:0 "Para os [target.GetCulture.GetCollectiveNoun] como [target.GetTitledFirstName], [Select_CString( ROOT.Char.IsFemale, 'uma orgulhos', 'um orgulhoso' )] [ROOT.Char.GetWomanMan] [exotic_culture.GetName] como eu é uma curiosidade estrangeira, talvez até algo raro: quem sabe quando terão a chance de falar com um como eu e ouvir as histórias da minha terra distante?"
 laamp_base_contract_schemes.0311.desc.only_exotic_faith:0 "A palavra de [exotic_faith.HighGodName] — certamente na forma [exotic_faith.GetAdjective] apropriada — é tristemente escassa na terra de [target.GetTitledFirstNamePossessive].\n\nUma situação lamentável, mas que #EMP faz#! com que meus hábitos e rituais tenham uma certa exótica alienação, que fascina muitos na corte."
 laamp_base_contract_schemes.0311.desc.outro:0 "\n\nEles não são exatamente... #EMP educados#! em suas opiniões, mas isso apenas os torna mais fáceis de provocar e, assim, entreter."
 laamp_base_contract_schemes.0311.t:0 "Costas Distantes e Terras Remotas"
 laamp_base_contract_schemes.0321.a:0 "Nós vamos te levar, [courtier_1.GetFirstNameNoTooltip]."
 laamp_base_contract_schemes.0321.b:0 "Talvez [courtier_2.GetFirstNameNoTooltip] esteja interessado..."
 laamp_base_contract_schemes.0321.c:0 "[courtier_3.GetFirstName] seria útil."
 laamp_base_contract_schemes.0321.d:0 "#EMP Você#!? Com certeza você está brincando!"
 laamp_base_contract_schemes.0321.desc.intro:0 "Durante nossa estadia na corte de [target.GetTitledFirstNamePossessive], fizemos o nosso melhor para cumprir nossa missão de entreter e ocupar seus retentores.\n\n"
 laamp_base_contract_schemes.0321.desc.one_courtier:0 "Parece que fizemos nosso trabalho satisfatoriamente, pois o seu cortesão [courtier_1.GetFirstName] se aproximou de mim em particular e pediu para se juntar ao nosso acampamento.\n\n[target.GetTitledFirstNameNoTooltip] certamente não nos negaria um único de seus retentores, se eu permitisse que [courtier_1.GetFirstNameNoTooltip] se inscrevesse."
 laamp_base_contract_schemes.0321.desc.three_courtiers:0 "Parece que fizemos nosso trabalho um pouco #EMP demais#! bem, pois vários dos cortesãos [target.GetHerHim] se aproximaram de mim em particular, pedindo para se juntar ao nosso acampamento!\n\n[courtier_1.GetFirstName] está mais interessado, mas [courtier_2.GetFirstName] e [courtier_3.GetFirstName] não ficam atrás [courtier_1.GetHerHim].\n\nCertamente [target.GetTitledFirstNameNoTooltip] não permitiria que os três partissem conosco, mas talvez pudéssemos levar um."
 laamp_base_contract_schemes.0321.desc.two_courtiers:0 "Parece que fizemos nosso trabalho um pouco #EMP demais#! bem, pois dois dos cortesãos [target.GetHerHim] se aproximaram de mim em particular, pedindo para se juntar ao nosso acampamento!\n\n[courtier_1.GetFirstName] está mais interessado, mas [courtier_2.GetFirstName] não ficou muito atrás [courtier_1.GetHerHim].\n\nCertamente [target.GetTitledFirstNameNoTooltip] não permitiria que ambos partissem conosco, mas talvez pudéssemos levar um."
 laamp_base_contract_schemes.0321.e:0 "Lamentavelmente, nossa companhia está cheia."
 laamp_base_contract_schemes.0321.t:0 "Um Voluntário"
 laamp_base_contract_schemes.0331.a.tt.failure:0 "Sua formulação é insípida"
 laamp_base_contract_schemes.0331.a.tt.success:0 "Suas palavras são eloquentes"
 laamp_base_contract_schemes.0331.a:0 "Precisa haver uma única razão?"
 laamp_base_contract_schemes.0331.b.tt.failure:0 "Quão sem rumo"
 laamp_base_contract_schemes.0331.b.tt.success:0 "Doce liberdade"
 laamp_base_contract_schemes.0331.b:0 "Um caminho aberto deve ser percorrido."
 laamp_base_contract_schemes.0331.c.tt.failure:0 "Comum e vulgar"
 laamp_base_contract_schemes.0331.c.tt.success:0 "Duro, mas justo"
 laamp_base_contract_schemes.0331.c:0 "Glória, morte e amigos feitos sobre sangue derramado."
 laamp_base_contract_schemes.0331.d.tt.failure:0 "Sem sentido e impraticável"
 laamp_base_contract_schemes.0331.d.tt.success:0 "Aprender é sua própria recompensa"
 laamp_base_contract_schemes.0331.d:0 "A Busca pelo Conhecimento não tem fim, apenas entendimento."
 laamp_base_contract_schemes.0331.desc:0 "\"Eu tenho me perguntado, meu caro [ROOT.Char.GetFirstNameNoTooltip]\", comenta [target.GetTitledFirstName] em um jantar ocioso, \"você conta essas histórias de sua vida e feitos, mas vive sob a aba de uma tenda lamacenta, mal abrigado da chuva torrencial e do sol escaldante\".\n\nEu aceno. Não há razão para negar isso.\n\n\"Com tantos dos confortos básicos da vida negados a você, qual é a coisa que te motiva a se levantar de manhã? Por que continuar marchando quando no dia seguinte você terá que fazer tudo de novo?\""
 laamp_base_contract_schemes.0331.e.tt.failure:0 "Sim, e não valem a pena"
 laamp_base_contract_schemes.0331.e.tt.success:0 "Quão romântico"
 laamp_base_contract_schemes.0331.e:0 "Simples: há visões ainda não vistas."
 laamp_base_contract_schemes.0331.f.tt.failure:0 "Um bandido por outro nome"
 laamp_base_contract_schemes.0331.f.tt.success:0 "Ambição impiedosa pode ser impressionante"
 laamp_base_contract_schemes.0331.f:0 "Uma chance de fazer negócios e saciar meus #EMP apetites.#!"
 laamp_base_contract_schemes.0331.g.tt.failure:0 "Sonhos malfadados"
 laamp_base_contract_schemes.0331.g.tt.success:0 "Ambição magnética"
 laamp_base_contract_schemes.0331.g:0 "Você precisa até perguntar, [target.GetFirstNameNoTooltip]?"
 laamp_base_contract_schemes.0331.h:0 "Mexa na sua comida e ignore a pergunta."
 laamp_base_contract_schemes.0331.t:0 "O que nos Impulsiona Adiante"
 laamp_base_contract_schemes.0541.a:0 "Minha habilidade com diplomacia certamente impressionará!"
 laamp_base_contract_schemes.0541.b:0 "Minha habilidade em questões marciais certamente impressionará!"
 laamp_base_contract_schemes.0541.c:0 "Minha habilidade com preocupações financeiras certamente impressionará!"
 laamp_base_contract_schemes.0541.d:0 "Minha habilidade em atos sombrios tem um mistério atraente!"
 laamp_base_contract_schemes.0541.desc:0 "Impressionar [target.GetTitledFirstName] parece ser um trabalho de uma temporada inteira, às vezes.\n\nApesar de não ser o maior nobre do mundo, [target.GetSheHe] tem noções #EMP muito#! curiosas sobre os padrões que outras pessoas devem seguir.\n\nEm situações como essas, a coisa mais segura a fazer é provavelmente voltar ao que eu faço de melhor, escolher algo que eu faça bem e deixar minhas habilidades brilharem.\n\nEmbora, para alguém tão frequentemente errático quanto [target.GetFirstNameNoTooltip], eu também poderia tentar triunfar em algo que se pensa ser menos a minha praia."
 laamp_base_contract_schemes.0541.duel.tt.failure:0 "Uma exibição vergonhosa"
 laamp_base_contract_schemes.0541.duel.tt.success:0 "Você é suficientemente impressionante"
 laamp_base_contract_schemes.0541.e:0 "Minha mente culta certamente impressionará!"
 laamp_base_contract_schemes.0541.f:0 "Minha destreza com a lâmina fala por si!"
 laamp_base_contract_schemes.0541.g:0 "Talvez eu possa tentar a diplomacia..."
 laamp_base_contract_schemes.0541.h:0 "Talvez eu possa me mostrar um verdadeiro comandante..."
 laamp_base_contract_schemes.0541.i:0 "Eu mal sou o #EMP pior#! com dinheiro..."
 laamp_base_contract_schemes.0541.j:0 "Eu poderia exibir minha astúcia..."
 laamp_base_contract_schemes.0541.k:0 "Eu poderia exibir meu grande conhecimento..."
 laamp_base_contract_schemes.0541.l:0 "Eu poderia exibir minha habilidade com a lâmina..."
 laamp_base_contract_schemes.0541.m:0 "Permaneça distante."
 laamp_base_contract_schemes.0541.t:0 "Um Hábil"
 laamp_base_contract_schemes.0541.tt.highest_skill_weaker_results:0 "Testar sua melhor [skill|E] dará menos recompensas"
 laamp_base_contract_schemes.0541.tt.lowest_skill_stronger_results:0 "Testar sua pior [skill|E] dá melhores recompensas"
 laamp_base_contract_schemes.0551.a:0 "[diplomacy_candidate.GetFirstNameNoTooltip] parece ser persuadível."
 laamp_base_contract_schemes.0551.b:0 "Eu poderia facilmente impressionar [martial_candidate.GetFirstNameNoTooltip]."
 laamp_base_contract_schemes.0551.c:0 "[stewardship.GetFirstNameNoTooltip] e eu temos muito em comum."
 laamp_base_contract_schemes.0551.d:0 "Eu me pergunto o que [intrigue_candidate.GetFirstNameNoTooltip] está fazendo?"
 laamp_base_contract_schemes.0551.desc:0 "Sempre há aqueles na corte com mais influência do que outros, e os salões de [target.GetTitledFirstNamePossessive] não são diferentes.\n\nAlgumas pessoas atravessam os corredores com confiança, outras se apressam para sair do caminho.\n\nSe eu realmente quero causar uma impressão, não faria mal ter um dos elites sociais locais ao meu lado, mas quem escolher..."
 laamp_base_contract_schemes.0551.duel.tt.failure:0 "Você é mais monótono do que pensa"
 laamp_base_contract_schemes.0551.duel.tt.success:0 "Você causa uma figura impressionante"
 laamp_base_contract_schemes.0551.e:0 "[learning_candidate.GetFirstNameNoTooltip] parece interessante."
 laamp_base_contract_schemes.0551.f:0 "Heh, aposto que [prowess_candidate.GetFirstNameNoTooltip] estaria a fim de uma luta."
 laamp_base_contract_schemes.0551.g:0 "Isso não seria sábio."
 laamp_base_contract_schemes.0551.t:0 "Os Grandes e os Bons"
 laamp_base_contract_schemes.0561.a.tt.failure:0 "Suado e desarticulado"
 laamp_base_contract_schemes.0561.a.tt.success:0 "Suave e tranquilo"
 laamp_base_contract_schemes.0561.a:0 "[insider.GetFirstNameNoTooltip] não consegue resistir ao meu charme!"
 laamp_base_contract_schemes.0561.b:0 "Um pouco de ouro suaviza todas as amizades."
 laamp_base_contract_schemes.0561.c.tt.failure:0 "Você é menos que sutil"
 laamp_base_contract_schemes.0561.c.tt.success:0 "Você é compreendido"
 laamp_base_contract_schemes.0561.c:0 "Talvez uma #EMP implicação#! sutil..."
 laamp_base_contract_schemes.0561.d.tt.failure:0 "$laamp_base_contract_schemes.0561.c.tt.failure$"
 laamp_base_contract_schemes.0561.d.tt.success:0 "$laamp_base_contract_schemes.0561.c.tt.success$"
 laamp_base_contract_schemes.0561.d:0 "$laamp_base_contract_schemes.0561.c$"
 laamp_base_contract_schemes.0561.desc:0 "[insider.GetTitledFirstName] é claramente um dos mais próximos e queridos de [target.GetTitledFirstNamePossessive], ocupando uma posição alta na hierarquia social e com #EMP muita#! influência sobre o bom [target.GetTitleAsNameNoTooltip].\n\nTer [insider.GetWomanMan] cantando meus louvores, por qualquer motivo que seja, com certeza só ajudará minha causa."
 laamp_base_contract_schemes.0561.e:0 "Vamos deixar as coisas como estão."
 laamp_base_contract_schemes.0561.t:0 "O Elo Mais Fraco"
 laamp_base_contract_schemes.0571.a:0 "Por [ROOT.Char.GetFaith.WealthGodName], eu terei meu dinheiro!"
 laamp_base_contract_schemes.0571.b:0 "Uma doação generosa é mais do que suficiente."
 laamp_base_contract_schemes.0571.c:0 "Melhor ordenhar a cabra do que matá-la."
 laamp_base_contract_schemes.0571.d:0 "Jogue totalmente seguro."
 laamp_base_contract_schemes.0571.desc:0 "Não há garantia de que [target.GetTitledFirstName] acabará mesmo me dando os presentes que anseio, não importa o quanto eu me humilhe aos pés [target.GetHerHim].\n\nÉ claro que devo agir, aplicando toda a pressão que posso para adquirir um empréstimo antecipadamente. Assim, se [target.GetSheHe] me agraciar ainda mais, estarei rindo, e se não, meus esforços estão pré-recompensados."
 laamp_base_contract_schemes.0571.duel.tt.failure:0 "Seus avanços são rejeitados"
 laamp_base_contract_schemes.0571.duel.tt.success:0 "Você consegue uma doação"
 laamp_base_contract_schemes.0571.t:0 "Pago Antecipadamente"
 laamp_base_contract_schemes.0661.a:0 "Vamos conversar sobre isso."
 laamp_base_contract_schemes.0661.b:0 "Logística, hein? Parece solucionável."
 laamp_base_contract_schemes.0661.c:0 "Hmmm, o que os dados dizem..."
 laamp_base_contract_schemes.0661.desc:0 "O problema nesta área parece simples o suficiente — os locais de um lado da disputa afirmam que são obrigados a enviar muit[Select_CString( dummy_soldier.IsFemale, 'as', 'os' )] [dummy_soldier.GetWomenMen] para o serviço militar, enquanto o outro diz o oposto.\n\nObter mais detalhes deles inevitavelmente degenera em gritos e forquilhas levantadas. Ambos os lados parecem mais do que dispostos a matar uns aos outros disputando quem deve contribuir mais para sua defesa coletiva."
 laamp_base_contract_schemes.0661.diplomacy.tt.failure:0 "Sua diplomacia falha"
 laamp_base_contract_schemes.0661.diplomacy.tt.success:0 "Sua diplomacia prevalece"
 laamp_base_contract_schemes.0661.intrigue.tt.failure:0 "Sua intriga falha"
 laamp_base_contract_schemes.0661.intrigue.tt.success:0 "Sua intriga prevalece"
 laamp_base_contract_schemes.0661.learning.tt.failure:0 "Seu aprendizado falha"
 laamp_base_contract_schemes.0661.learning.tt.success:0 "Seu aprendizado prevalece"
 laamp_base_contract_schemes.0661.martial.tt.failure:0 "Seu talento marcial falha"
 laamp_base_contract_schemes.0661.martial.tt.success:0 "Seu talento marcial prevalece"
 laamp_base_contract_schemes.0661.prowess.tt.failure:0 "Seu poder falha"
 laamp_base_contract_schemes.0661.prowess.tt.success:0 "Seu poder prevalece"
 laamp_base_contract_schemes.0661.stewardship.tt.failure:0 "Sua administração falha"
 laamp_base_contract_schemes.0661.stewardship.tt.success:0 "Sua administração prevalece"
 laamp_base_contract_schemes.0661.t.preface:0 "Mediador Pago"
 laamp_base_contract_schemes.0661.t:0 "$laamp_base_contract_schemes.0661.t.preface$: Dever Desigual"
 laamp_base_contract_schemes.0661.tt.contract_failed:0 "Você falha em seu [task_contract|E] imediatamente"
 laamp_base_contract_schemes.0661.tt.full_success_achieved:0 "Você alcançou todos os sucessos necessários"
 laamp_base_contract_schemes.0661.tt.need_additional_success:0 "Você precisa de pelo menos mais um sucesso para entregar seu contrato"
 laamp_base_contract_schemes.0661.tt.progress_towards_success:0 "Você faz um bom progresso em seu [task_contract|E]"
 laamp_base_contract_schemes.0661.tt.skill_used.diplomacy:0 "Você já usou sua [diplomacy|E] neste [task_contract|E] e não pode usá-lo novamente"
 laamp_base_contract_schemes.0661.tt.skill_used.intrigue:0 "Você já usou sua [intrigue|E] neste [task_contract|E] e não pode usá-lo novamente"
 laamp_base_contract_schemes.0661.tt.skill_used.learning:0 "Você já usou seu [learning|E] neste [task_contract|E] e não pode usá-lo novamente"
 laamp_base_contract_schemes.0661.tt.skill_used.martial:0 "Você já usou seu [martial|E] neste [task_contract|E] e não pode usá-lo novamente"
 laamp_base_contract_schemes.0661.tt.skill_used.prowess:0 "Você já usou sua [prowess|E] neste [task_contract|E] e não pode usá-lo novamente"
 laamp_base_contract_schemes.0661.tt.skill_used.stewardship:0 "Você já usou sua [stewardship|E] neste [task_contract|E] e não pode usá-lo novamente"
 laamp_base_contract_schemes.0662.a:0 "Tudo isso parece apenas rumores maldosos..."
 laamp_base_contract_schemes.0662.b:0 "Bandidos? Um problema facilmente resolvível!"
 laamp_base_contract_schemes.0662.c:0 "Estou certo de que posso detectar o mentiroso aqui."
 laamp_base_contract_schemes.0662.d:0 "Aposto que posso lidar com seu problema."
 laamp_base_contract_schemes.0662.desc:0 "Aparentemente, a disputa em [location.GetName] gira em torno de um grupo local de criminosos comuns, escondendo-se nas selvas.\n\nOs residentes estão divididos em cerca de uma dúzia de facções em conflito, cada uma #EMP convencida#! de que uma ou mais das outras estão secretamente em conluio com os saqueadores, fornecendo-lhes ajuda e socorro.\n\nNenhum deles está disposto a trabalhar junto para resolver a questão."
 laamp_base_contract_schemes.0662.t:0 "$laamp_base_contract_schemes.0661.t.preface$: Acusador & Acusado"
 laamp_base_contract_schemes.0663.a:0 "Vamos nos manter calmos e lembrar de nossos votos, certo?"
 laamp_base_contract_schemes.0663.b:0 "Parece uma revolta para mim, podemos #EMP resolver#! isso."
 laamp_base_contract_schemes.0663.c:0 "Deixe-me explicar algumas coisas para todos vocês..."
 laamp_base_contract_schemes.0663.desc:0 "Pelo que pude reunir, o povo de [location.GetName] está #EMP tão#! perto de se matarem por uma disputa teológica tão menor que lutam para explicar a relevância para os de fora.\n\nNada deixa as pessoas tão agitadas como questões de fé, para o bem ou para o mal, mas preciso que parem, respirem e se acalmem. Preferencialmente sem derramamento de sangue."
 laamp_base_contract_schemes.0663.t:0 "$laamp_base_contract_schemes.0661.t.preface$: Coisas Celestiais"
 laamp_base_contract_schemes.0664.a:0 "Pessoal! Vocês são vizinhos, sejam civis!"
 laamp_base_contract_schemes.0664.b:0 "Se vocês não se acalmarem, podem ser acalmados à força."
 laamp_base_contract_schemes.0664.c:0 "Vocês vão apertar as mãos, ou vão perder as mãos. Escolham."
 laamp_base_contract_schemes.0664.desc:0 "Em [location.GetName], o povo escolheu trilhar um caminho de sede de sangue e vingança.\n\nNão estou claro sobre o que causou a espiral inicial — todas as partes acusam todas as outras partes de #EMP vários#! assassinatos, roubos e a ocasional queima de propriedade — mas não há nada além de má vontade esperando para ser derramada aqui agora.\n\nNão é a melhor das coisas para as receitas fiscais locais."
 laamp_base_contract_schemes.0664.t:0 "$laamp_base_contract_schemes.0661.t.preface$: Vendeta Local"
 laamp_base_contract_schemes.0665.a:0 "Isso para, #EMP agora#! — entendi?"
 laamp_base_contract_schemes.0665.b:0 "Talvez o fardo pudesse ser reduzido um pouco..."
 laamp_base_contract_schemes.0665.c:0 "Vocês me dirão quem fez isso. De bom grado ou não."
 laamp_base_contract_schemes.0665.desc:0 "Parece que algum tolo recente emboscou vários oficiais locais importantes. Ninguém ficou seriamente ferido, mas o tolo saiu correndo gritando sobre tributação antes que pudesse ser apreendido.\n\nDesnecessário dizer, toda e qualquer queixa mesquinha #EMP imediatamente#! surgiu com minha chegada, enquanto os locais se voltam uns contra os outros em uma tentativa frenética de evitar punição coletiva.\n\nAinda assim, um valente tolo é pelo menos sábio o suficiente para sugerir que isso pode ser um resultado dos recentes aumentos de impostos."
 laamp_base_contract_schemes.0665.t:0 "$laamp_base_contract_schemes.0661.t.preface$: Lidando com Impostos"
 laamp_base_contract_schemes.0666.a:0 "Estou certo de que isso é apenas um mal-entendido."
 laamp_base_contract_schemes.0666.b:0 "Ah, acho que vejo o problema..."
 laamp_base_contract_schemes.0666.c:0 "Esses números parecem não bater?"
 laamp_base_contract_schemes.0666.desc:0 "A coisa mais importante que qualquer comunidade pode contribuir é, do ponto de vista de seus senhores, seu imposto regular.\n\nÉ preocupante, então, que o povo de [location.GetName] não tenha conseguido pagar o seu, pelo menos na íntegra.\n\nAh, eles têm todo tipo de desculpas e razões pelas quais isso pode ter acontecido, mas na maior parte é apenas os maiores assentamentos conspirando para prejudicar uma cidade rica em ascensão."
 laamp_base_contract_schemes.0666.t:0 "$laamp_base_contract_schemes.0661.t.preface$: Problemas de Dívida"
 laamp_base_contract_schemes.0667.a:0 "Vocês #EMP deixarão#! os oficiais de fora disso."
 laamp_base_contract_schemes.0667.b:0 "Vocês têm ideia de qual será a multa na próxima vez?"
 laamp_base_contract_schemes.0667.c:0 "Vocês param por escolha, ou eu #EMP farei#! vocês pararem."
 laamp_base_contract_schemes.0667.desc:0 "Uma certa quantidade de derramamento de sangue é permitida em qualquer comunidade antes que um poder superior se envolva. Assassinato mesquinho, banditismo leve, talvez um animal premiado de um rival injustamente assassinado à noite — se os impostos fluírem, a justiça local geralmente pode lidar com tais coisas.\n\nOnde esse privilégio para de se estender imediatamente é quando algum idiota decide envolver autoridades externas com suas queixas triviais.\n\nOs tolos de [location.GetName] cometeram esse erro, alegando que um coletor de impostos local estava a serviço do inimigo de alguém. A verdade é irrelevante, mas a execução é."
 laamp_base_contract_schemes.0667.t:0 "$laamp_base_contract_schemes.0661.t.preface$: Na Palma"
 laamp_base_contract_schemes.0668.a:0 "Um verdadeiro [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdherentNameNoTooltip] é amado por todos!"
 laamp_base_contract_schemes.0668.b:0 "Morto? Ou deixado para enganar em outro lugar?"
 laamp_base_contract_schemes.0668.c:0 "Suas discussões não são piedosas."
 laamp_base_contract_schemes.0668.desc:0 "A morte de uma figura local reverenciada, algum eremita piedoso ou outro, causou muito lamento e ranger de dentes em [location.GetName], a ponto de completamente paralisar a administração diária.\n\nA consternação decorre da falta de um corpo. Embora várias testemunhas afirmem ter visto o último suspiro do eremita, o cadáver desapareceu.\n\nVários locais notáveis estão acusando uns aos outros de tê-lo roubado, outros afirmam que isso é um sinal divino, e os mais cínicos não acreditam na coisa inteira."
 laamp_base_contract_schemes.0668.t:0 "$laamp_base_contract_schemes.0661.t.preface$: O Mártir de Todos"
 laamp_base_contract_schemes.0669.a:0 "Nunca tema um fora da lei mais do que a própria lei."
 laamp_base_contract_schemes.0669.b:0 "Posso mostrar a vocês o significado do medo!"
 laamp_base_contract_schemes.0669.c:0 "Diga-me onde eles se escondem, e eu resolvo isso."
 laamp_base_contract_schemes.0669.desc:0 "O povo de [location.GetName] afirma não ter problemas, não saber por que seus impostos estão atrasados ou quem apresentou reclamações ao seu governante.\n\nSeria preciso ser um tolo para não notar o medo em seus olhos ou o suor em suas testas. Essas pessoas estão sendo coagidas por alguém e permanecem caladas por medo de represálias."
 laamp_base_contract_schemes.0669.t:0 "$laamp_base_contract_schemes.0661.t.preface$: Sob o Controle"
 laamp_base_contract_schemes.0670.a:0 "Por favor, não somos todos amigos?"
 laamp_base_contract_schemes.0670.b:0 "Permita-me explicar..."
 laamp_base_contract_schemes.0670.c:0 "Pare. De. Falar. Besteiras."
 laamp_base_contract_schemes.0670.desc:0 "Em [location.GetName], todos falam de uma coisa e uma coisa só: um artigo peculiar do [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetName] que parece ter surgido de debates teológicos primitivos.\n\nIsso seria um assunto bom — se seco — para os piedosos de classe baixa se envolverem, mas os tolos parecem ter se deixado levar demais pelo espírito do debate.\n\nCom os insultos voando mais espessos e mais rápidos a cada dia que passa, é apenas uma questão de tempo até que suas teorias empoeiradas se transformem em facadas nas ruas."
 laamp_base_contract_schemes.0670.t:0 "$laamp_base_contract_schemes.0661.t.preface$: Crise da Alma"
 laamp_base_contract_schemes.0671.a.tt:0 "Você entrega o contrato pela recompensa regular"
 laamp_base_contract_schemes.0671.a:0 "Bem, o suficiente é bom o bastante!"
 laamp_base_contract_schemes.0671.b.tt:0 "Você arrisca o último desafio, esperando ganhar o bônus total — #X você não ganhará nada se falhar#!"
 laamp_base_contract_schemes.0671.b:0 "O trabalho está concluído quando estiver #EMP feito#!."
 laamp_base_contract_schemes.0671.desc:0 "Já fizemos trabalho suficiente para ganhar a maior parte do pagamento que [employer.GetTitledFirstName] nos prometeu.\n\nSe conseguirmos resolver o último problema, garantimos nosso bônus, mas se apenas piorarmos as coisas, bem... lá se vai #EMP todo#! nosso pagamento.\n\nDevemos enviar uma mensagem ou não?"
 laamp_base_contract_schemes.0671.t:0 "$laamp_base_contract_schemes.0661.t.preface$: Um Trabalho Quase Concluído"
 laamp_base_contract_schemes.0781.a.tt.failure:0 "Suas artimanhas falham"
 laamp_base_contract_schemes.0781.a.tt.success:0 "Você convence [target.GetFirstNameNoTooltip] a fazer um presente generoso"
 laamp_base_contract_schemes.0781.a:0 "Sem dúvida podemos conseguir um adiantamento antecipado..."
 laamp_base_contract_schemes.0781.b.tt.failure:0 "Quase pego"
 laamp_base_contract_schemes.0781.b.tt.success:0 "Dedos pegajosos, bolsas gordas"
 laamp_base_contract_schemes.0781.b:0 "[target.GetSheHe|U] não pode vigiar #EMP tudo#!."
 laamp_base_contract_schemes.0781.c.tt.failure:0 "Falsificação óbvia"
 laamp_base_contract_schemes.0781.c.tt.success:0 "O crime perfeito"
 laamp_base_contract_schemes.0781.c:0 "Culpe um roubo flagrante em [stooge.GetFirstNameNoTooltip]"
 laamp_base_contract_schemes.0781.d.tt.failure:0 "Sentinelas te afastam"
 laamp_base_contract_schemes.0781.d.tt.success:0 "Você retorna após o anoitecer"
 laamp_base_contract_schemes.0781.d:0 "Certamente as paredes são facilmente escaladas?"
 laamp_base_contract_schemes.0781.desc:0 "Eu aprecio que, a longo prazo, há mais dinheiro a ser ganho quando você o extrai de mãos dispostas do que quando o tira de mãos descuidadas. Eu sei disso, eu entendo.\n\nAinda assim, enquanto caminho pelo tribunal de [target.GetTitledFirstNamePossessive], olhando para a riqueza que [target.GetSheHe] armazenou tão casualmente, sem mencionar a segurança precária, não posso deixar de me perguntar se não podemos mergulhar #EMP apenas um pouco#! em maneiras alternativas de ganhar."
 laamp_base_contract_schemes.0781.e:0 "Vamos manter isso (relativamente) honesto."
 laamp_base_contract_schemes.0781.t:0 "Tentações da Bolsa"
 laamp_base_contract_schemes.0791.a:0 "Comigo [second.GetFirstNameNoTooltip], vamos manter [target.GetSheHe] ocupado."
 laamp_base_contract_schemes.0791.b:0 "Para o armazém, [quartermaster.GetFirstNameNoTooltip]."
 laamp_base_contract_schemes.0791.c:0 "[armourer.GetFirstNameNoTooltip] provavelmente pode entrar no arsenal!"
 laamp_base_contract_schemes.0791.d:0 "[chief_forager.GetFirstNameNoTooltip], vá atrás dos jardins deles."
 laamp_base_contract_schemes.0791.desc:0 "[target.GetTitledFirstName] tem sua corte, e eu tenho a minha.\n\nA diferença é que, onde os retentores de [target.GetFirstNamePossessiveNoTooltip] estão contentes em viver da generosidade [target.GetHerHim], #EMP meus#! seguidores estão determinados a me ajudar a me apropriar um pouco daquela mesma riqueza.\n\nEu passo meu tempo trabalhando em direção ao nosso eventual dia de pagamento, e eles, por sua vez, podem roubar [target.GetFirstNameNoTooltip] às cegas enquanto [target.GetSheHe] está ocupado. É sempre bom saber que você tem pessoas nas quais pode confiar."
 laamp_base_contract_schemes.0791.e:0 "[master_thief.GetFirstNameNoTooltip] sabe #EMP exatamente#! o que fazer."
 laamp_base_contract_schemes.0791.f:0 "[head_groom.GetFirstNameNoTooltip], para os estábulos."
 laamp_base_contract_schemes.0791.g:0 "[huntperson.GetFirstNameNoTooltip] pode saquear suas casas de caça."
 laamp_base_contract_schemes.0791.h:0 "[witness.GetFirstNameNoTooltip] pode espalhar meu bom nome enquanto eu..."
 laamp_base_contract_schemes.0791.i:0 "[camp_cook.GetFirstNameNoTooltip], os depósitos, #EMP vá#!."
 laamp_base_contract_schemes.0791.j:0 "[master_bard.GetFirstNameNoTooltip] é uma distração habilidosa."
 laamp_base_contract_schemes.0791.k:0 "Contanto que [stooge.GetFirstNameNoTooltip] leve a culpa..."
 laamp_base_contract_schemes.0791.l:0 "[master_of_spoils.GetFirstNameNoTooltip], saqueie tudo que não está preso."
 laamp_base_contract_schemes.0791.m:0 "Muito arriscado, é melhor não."
 laamp_base_contract_schemes.0791.t:0 "A Arte da Delegação"
 laamp_base_contract_schemes.0791.tt.failure:0 "Seu oficial falha"
 laamp_base_contract_schemes.0791.tt.success:0 "Seu oficial vence"
 laamp_base_contract_schemes.0801.a.tt.failure:0 "Você precisa sair"
 laamp_base_contract_schemes.0801.a.tt.success:0 "Você se ingratiou"
 laamp_base_contract_schemes.0801.a:0 "Podemos fazer muito mais se [target.GetSheHe] gostar de nós."
 laamp_base_contract_schemes.0801.b:0 "Um pouco de capital social não faria mal..."
 laamp_base_contract_schemes.0801.c.tt.failure:0 "Um charlatão irritante"
 laamp_base_contract_schemes.0801.c.tt.success:0 "[bard.GetFirstNameNoTooltip] encanta [target.GetFirstName]"
 laamp_base_contract_schemes.0801.c:0 "[bard.GetFirstNameNoTooltip] pode cuidar disso!"
 laamp_base_contract_schemes.0801.d:0 "Isso está abaixo de mim."
 laamp_base_contract_schemes.0801.desc:0 "Nosso objetivo final é, sem dúvida, roubar [target.GetTitledFirstName] de toda a riqueza que conseguirmos convencê-[Select_CString( target.IsFemale, 'la', 'lo' )] a nos dar, mas até lá, quanto melhor [target.GetSheHe] pensar de nós, maiores serão nossas chances futuras.\n\nIsso não requer nada #EMP muito#! óbvio. Alguns elogios sinceros, risadas bem colocadas, o ocasional suspiro chocado, apenas o suficiente para fazer [target.GetFirstNameNoTooltip] se sentir poderoso ao nosso redor."
 laamp_base_contract_schemes.0801.t:0 "Aliciando para Lucro"
 laamp_base_contract_schemes.0811.a.tt.failure:0 "Fraudes desesperadas"
 laamp_base_contract_schemes.0811.a.tt.success:0 "Vocês dois ganham um pouco de dinheiro"
 laamp_base_contract_schemes.0811.a:0 "Que empreendedor! Claro, vamos dividir seus ganhos."
 laamp_base_contract_schemes.0811.b:0 "Continue, continue."
 laamp_base_contract_schemes.0811.c.tt.failure:0 "Fraude desesperada"
 laamp_base_contract_schemes.0811.c.tt.success:0 "[agent.GetFirstNameNoTooltip] ganha um pouco de dinheiro"
 laamp_base_contract_schemes.0811.c:0 "Pare com isso, seu tolo! Você arrisca meu trabalho!"
 laamp_base_contract_schemes.0811.desc:0 "Parece que [agent.GetFirstName] tem trabalhado em coisas #EMP diferentes#! do nosso objetivo com [target.GetTitledFirstName].\n\n[agent.GetSheHe|U] usou seu tempo na corte para preparar o terreno para enganar uma quantia considerável de [target.GetFirstNameNoTooltip] — algo que [agent.GetSheHe] se esqueceu de me contar antes que eu o ouvisse se gabando sobre isso para um dos ajudantes do acampamento."
 laamp_base_contract_schemes.0811.t:0 "Trabalho Paralelo"
 laamp_base_contract_schemes.1001.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.1001.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.1001.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.1001.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.1001.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.1001.desc:0 "\"Esse bando de...\" [employer.GetTitledFirstName] enruga seu nariz com desgosto, \"#EMP descontentes#! têm atormentado minhas propriedades privadas. Eles queimam, matam e roubam com quase impunidade, escapando antes que meus retentores possam prendê-los com as algemas que tão #EMP ricamente#! merecem.\"\n\nEu aceno. A gangue deve ser escorregadia para justificar uma recompensa tão particular.\n\n\"Traga a escória para mim antes que outra de minhas propriedades pegue fogo, e você terá seu pagamento.\""
 laamp_base_contract_schemes.1001.t:0 "Caçando Criminosos"
 laamp_base_contract_schemes.1002.a:0 "Parece que o(a) bom(boa) [employer.GetTitleAsNameNoTooltip] está recebendo o valor de seu dinheiro."
 laamp_base_contract_schemes.1002.desc:0 "\"Bom, #EMP bom#!,\" ri [employer.GetFirstName], girando a faca na mão [employer.GetHerHim] de maneira casual. \"Um excelente trabalho, [ROOT.Char.GetFirstNameNoTooltip], você e seu grupo valem cada moeda naquele bolso.\"\n\nAs formas machucadas dos bandidos capturados estão em suas jaulas atrás do [employer.GetTitleAsNameNoTooltip] ligeiramente maníaco. Deve ter sido emocionante incendiar a propriedade d[Select_CString( employer.IsFemale, 'a', 'o' )] [employer.GetWomanMan] e roubar suas riquezas quando estavam livres, provocando alguém tão poderoso, mas todas as boas coisas devem chegar ao fim.\n\nEu me retiro, dinheiro na mão. Esses infelizes bandidos estão prestes a ganhar os verdadeiros salários do pecado."
 laamp_base_contract_schemes.1002.t:0 "$laamp_base_contract_schemes.1001.t$: Sucesso!"
 laamp_base_contract_schemes.1003.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.1003.desc:0 "\"#EMP Você falhou também?!#!\" grita [employer.GetFirstName], apoplético de frustração. \"Pode alguém me livrar desses bandidos odiosos? Preciso fazer isso eu mesmo, o(a) [employer.GetTitleAsNameNoTooltip] sujando suas [employer.Custom('HandHands')] com o sangue de algum fora da lei?\"\n\nEu mordo meu lábio o melhor que posso, ciente de que uma reprimenda verbal pode não ser lucrativa, mas pelo menos não termina com minha ida para a masmorra. Provavelmente.\n\n\"Bem? O que você está esperando? Saia da minha vista, [ROOT.Char.Custom('GetLaampDescribeTypeInsult')]! Vou encontrar alguém #EMP outro#! para lidar com meus problemas, alguém #EMP capaz#!.\""
 laamp_base_contract_schemes.1003.t:0 "$laamp_base_contract_schemes.1001.t$: Falha!"
 laamp_base_contract_schemes.1004.a:0 "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.1004.b:0 "$travel.mobile_domicile.option.t$"
 laamp_base_contract_schemes.1004.desc:0 "\"Esse bando de...\" [employer.GetTitledFirstName] enruga seu nariz com desgosto, \"#EMP descontentes#! têm atormentado minhas propriedades privadas. Eles queimam, matam e roubam com quase impunidade, escapando antes que meus retentores possam prendê-los com as algemas que tão #EMP ricamente#! merecem.\"\n\nEu aceno. A gangue deve ser escorregadia para justificar uma recompensa tão particular.\n\n\"O líder deles é um(a) [recidivist.GetFirstNameNicknamed] — traga-me a cabeça [recidivist.GetHerHim] antes que [recidivist.GetSheHe] possa escapar para sempre, e você terá seu pagamento.\""
 laamp_base_contract_schemes.1004.t:0 "Traga-Me a Cabeça [recidivist.GetHerHim|U]"
 laamp_base_contract_schemes.1004.tt.destination_list:0 "Você imediatamente começa a viajar para [destination_1.GetBaseNameNoTier], depois [destination_2.GetBaseNameNoTier], então [destination_3.GetBaseNameNoTier]"
 laamp_base_contract_schemes.1004.tt.explanation:0 "#TUT Para completar o [task_contract|E]:\n$EFFECT_LIST_BULLET$Acumule #P 2#! pontos de vitória contra [recidivist.GetFirstName]\n$EFFECT_LIST_BULLET$Pontos de vitória podem ser ganhos 1-2 por vez de qualquer uma das seguintes formas —\n$TAB$$EFFECT_LIST_BULLET$Um [single_combat_duel|E]\n$TAB$$EFFECT_LIST_BULLET$Um desafio de [prowess|E] (se você não puder duelar pessoalmente)\n$TAB$$EFFECT_LIST_BULLET$Um desafio de [martial|E]\n$TAB$$EFFECT_LIST_BULLET$Arriscando seus [men_at_arms|E] (dos quais você deve ter pelo menos [EmptyScope.ScriptValue('laamp_base_contract_schemes_1301_min_troops_value')|0] e nenhum pode ser levantado ou eles são inelegíveis para a opção)\n$EFFECT_LIST_BULLET$Você recebe #P 3 chances#! para matar seu alvo, após as quais ele escapa e você recebe um resultado de $label_failure_standard$#!"
 laamp_base_contract_schemes.1011.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.1011.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.1011.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.1011.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.1011.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.1011.desc:0 "\"Minhas necessidades são simples,\" explica [employer.GetFirstName], \"Há certos espinhos na rosa de [employer.GetCapitalLocation.GetTitle.GetNameNoTier], e eu gostaria que você removesse esses... personagens espinhosos. Não posso ser visto removendo-os diretamente, então você vai lidar com eles para mim.\"\n\nEu arrasto um polegar pelo meu pescoço, intrigado.\n\n\"Não, não,\" esclarece meu empregador. \"Nada de derramamento de sangue sério, apenas mantenha-os em silêncio sem matá-los até que eles entendam o que é desrespeitar [Select_CString( employer.IsFemale, 'a', 'o' )] [employer.GetTitleAsNameNoTooltip].\"\n\nParece simples o suficiente."
 laamp_base_contract_schemes.1011.t:0 "Músculos Contratados"
 laamp_base_contract_schemes.1012.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.1012.desc:0 "\"Trabalho maravilhoso, [ROOT.Char.GetFirstNameNoTooltip]! O jardim de [employer.GetCapitalLocation.GetTitle.GetNameNoTier] está lindamente, maravilhosamente silencioso, e posso descansar um pouco mais fácil à noite.\"\n\n[employer.GetSheHe|U] me joga um saquinho de prata.\n\n\"Por favor, fique conosco da próxima vez que passar pela área! Tenho certeza de que podemos encontrar acomodações adequadas — sem mencionar um #EMP emprego#! — para um(a) [ROOT.Char.Custom2('GetYoungOld',employer)] tão empreendedor(a) [ROOT.Char.Custom('GetLaampDescribeTypeSelf')].\""
 laamp_base_contract_schemes.1012.t:0 "$laamp_base_contract_schemes.1011.t$: Sucesso!"
 laamp_base_contract_schemes.1013.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.1013.desc:0 "\"Você tinha um trabalho, [ROOT.Char.GetFirstNameNoTooltip]\", suspira [employer.GetFirstNameNoTooltip]. \"Silencie alguns idiotas faladores, mantenha-os quietos por alguns meses e depois volte para coletar sua prata.\"\n\nMinha [ROOT.Char.Custom('MaskFace')] permanece estoica. Pode ser irritante, mas é melhor deixar o(a) [employer.GetTitleAsNameNoTooltip] expressar suas frustrações verbalmente, a menos que [employer.GetSheHe] recorra a fazer isso com a força das armas.\n\n\"Talvez eu seja um tolo por esperar algo melhor de um(a) [ROOT.Char.Custom('GetLaampDescribeTypeInsult')] como você. Não há nada a ser feito, suponho.\"\n\nHá uma pausa... enquanto espero para ver se [Select_CString( employer.IsFemale, 'a', 'o' )] [employer.GetWomanMan] tem mais algo a dizer.\n\n\"Você pode ir. #EMP Agora#!, se você por favor.\""
 laamp_base_contract_schemes.1013.t:0 "$laamp_base_contract_schemes.1011.t$: Falha!"
 laamp_base_contract_schemes.1021.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.1021.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.1021.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.1021.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.1021.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.1021.desc:0 "[employer.GetFirstNamePossessive] tropas pessoais já são um grupo temível, mas é raro um(a) [employer.GetTitleAsNameNoTooltip] estar satisfeito(a) apenas com #EMP temível#!. A espinha dorsal de [employer.GetPrimaryTitle.GetDefinitiveName] é, como na maioria dos reinos, seu soldado, afinal.\n\nInspecionar seu equipamento e entrevistar seus melhores guerreiros é iluminador, pelo menos o suficiente para saber que há trabalho a ser feito aqui."
 laamp_base_contract_schemes.1021.t:0 "Treinar [ROOT.Char.Custom('MistressMaster')]"
 laamp_base_contract_schemes.1022.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.1022.desc:0 "Inspecionar as fileiras serradas das tropas de [employer.GetTitledFirstNamePossessive] me dá uma sensação de satisfação pessoal. Sim, eles eram guerreiros antes de eu chegar até eles, mas com meu treinamento, eles certamente foram elevados a heróis.\n\nCertamente, meu empregador parece satisfeito, já que [employer.GetSheHe] me dá um tapinha nas costas com uma risada calorosa.\n\n\"Um ótimo trabalho, nobre [ROOT.Char.Custom('GetLaampDescribeTypeSelf')]! Você pegou ferro bruto e me devolveu aço. Seu pagamento espera nas portas.\""
 laamp_base_contract_schemes.1022.t:0 "$laamp_base_contract_schemes.1021.t$: Sucesso!"
 laamp_base_contract_schemes.1023.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.1023.desc:0 "Não posso ser culpado por esses... esses #EMP renegados#! e sua desordem!\n\nEles são as tropas de [employer.GetTitledFirstNamePossessive], mas assim que seu pagamento[employer.Custom('MistressMaster')] sai de vista, todo vestígio de disciplina desmorona e eles se transformam em uma horda barulhenta e saqueadora de gafanhotos que consome cada pedaço de comida e gota de bebida ao seu alcance.\n\nClaro, seus comandantes culpam tudo isso em mim. Meus métodos estranhos, minhas maneiras estrangeiras de fazer guerra, confundiram as mentes simples de seus retentores.\n\nProtestei minha inocência o melhor que pude, mas [employer.GetFirstNameNoTooltip] não quer ouvir. Não haverá pagamento por nada disso."
 laamp_base_contract_schemes.1023.t:0 "$laamp_base_contract_schemes.1021.t$: Falha!"
 laamp_base_contract_schemes.1031.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.1031.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.1031.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.1031.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.1031.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.1031.desc:0 "É... dificilmente o trabalho mais estimulante, fornecendo algumas espadas extras para [employer.GetTitledFirstNamePossessive] propriedades, mas é pelo menos estável.\n\nAlém disso, onde as armas estão envolvidas, #EMP trabalho estimulante#! nem sempre é o melhor. No campo de batalha, mercenários descartáveis são sempre os primeiros a entrar na briga, mas atrás de uma parede? Bem, é difícil transformar lutadores robustos em carne de canhão então.\n\n\"... realmente não esperando nenhum problema sério, é claro, mas você está aqui como precaução, afinal. Está tudo claro?\" finaliza o(a) [employer.GetTitleAsNameNoTooltip]. Eu aceno, voltando à conversa com um choque."
 laamp_base_contract_schemes.1031.t:0 "Dever de Guarnição"
 laamp_base_contract_schemes.1032.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.1032.desc:0 "\"Excelente trabalho, [ROOT.Char.GetFirstNameNoTooltip]!\" exalta [employer.GetFirstName]. \"Meus espiões relatam que sua defesa exemplar deste local afastou os intrusos que eu temia.\"\n\nO(a) [employer.GetTitleAsNameNoTooltip] me dá um tapinha nas costas.\n\n\"Imagino que eles não quisessem se enredar com um guerreiro robusto como você, não é? Seus serviços são apreciados, e seu pagamento está a caminho.\"\n\nEu aceno em gratidão, feliz pelo longo descanso, mas aliviado que acabou."
 laamp_base_contract_schemes.1032.t:0 "$laamp_base_contract_schemes.1031.t$: Sucesso!"
 laamp_base_contract_schemes.1033.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.1033.desc:0 "\"Você só tinha que guardar o lugar, seu(a) ignorante [ROOT.Char.Custom('GetLaampDescribeTypeInsult')]! Olhe para isso, fumaça subindo de cada maldito janela, isso #EMP parece#! guardado para você?\" grita [employer.GetTitledFirstName].\n\nEu... não sei o que aconteceu. Estávamos aqui, estávamos de serviço, estávamos vigilantes... não estávamos? Será que os intrusos escorregaram sobre as paredes ou através dos portões? Mesmo assim, para iniciar os incêndios que conseguiram, é embaraçoso.\n\nO(a) irado(a) [employer.GetTitleAsNameNoTooltip] não parece se importar com minhas desculpas ou protestos. Somos retirados de forma cerimoniosa do pátio, toda esperança de pagamento há muito extinta."
 laamp_base_contract_schemes.1033.t:0 "$laamp_base_contract_schemes.1031.t$: Falha!"
 laamp_base_contract_schemes.1041.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.1041.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.1041.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.1041.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.1041.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.1041.desc:0 "[employer.GetFirstName|U] deve ser um(a) [employer.GetTitleAsNameNoTooltip] verdadeiramente descuidado(a). Imagine colocar um aviso pedindo ajuda assim?\n\nSua perda, nosso ganho. Meu grupo e eu já começamos a explorar os caminhos secundários mais movimentados para começar a armar emboscadas. Vamos roubar esses comerciantes à luz do dia e voltar à estrada o mais rápido que conseguimos.\n\nPosso praticamente sentir o dinheiro."
 laamp_base_contract_schemes.1041.t:0 "Atacando Viajantes"
 laamp_base_contract_schemes.1042.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.1042.desc:0 "Exatamente como planejado — [employer.GetTitledFirstName] não consegue proteger seus comerciantes ou suas riquezas.\n\nCada moeda que capturamos torna nosso bando mais ousado, e suas caravanas mais nervosas. Nós nos empanturramos com o ouro da terra o suficiente para ver que eles estão ativamente desacelerando, tentando encontrar rotas alternativas ou negociando em outro lugar completamente.\n\nInfelizmente, isso sinaliza o fim de nossas atividades aqui. É importante sair enquanto as coisas ainda vão bem, e o(a) [employer.GetTitleAsName] ainda está lutando para nos alcançar."
 laamp_base_contract_schemes.1042.t:0 "$laamp_base_contract_schemes.1041.t$: Sucesso!"
 laamp_base_contract_schemes.1043.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.1043.desc:0 "[employer.GetTitledFirstName] parece ter um #EMP muito#! controle mais firme sobre as estradas dessas terras do que pensávamos.\n\nMeu bando e eu tentamos emboscada após emboscada, esperando tempo e novamente, mas ou as caravanas não vêm de forma alguma ou estão tão fortemente guardadas que se tornam alvos inúteis.\n\nAs poucas lutas que #EMP conseguimos#! são sangrentas e completamente não lucrativas.\n\nQuanto mais cedo sairmos desta terra horrível, melhor — algo que [employer.GetFirstNameNoTooltip] parece concordar plenamente."
 laamp_base_contract_schemes.1043.t:0 "$laamp_base_contract_schemes.1041.t$: Falha!"
 laamp_base_contract_schemes.1044.a:0 "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.1044.b:0 "$travel.mobile_domicile.option.t$"
 laamp_base_contract_schemes.1044.desc:0 "[employer.GetFirstName|U] deve ser um(a) [employer.GetTitleAsNameNoTooltip] verdadeiramente descuidado(a). Imagine colocar um aviso pedindo ajuda assim e #EMP não#! esperar atrair mais problemas?\n\nSua perda, nosso ganho. Meu grupo e eu já começamos a explorar os caminhos secundários mais movimentados para começar a armar emboscadas — parece que a rota mais natural para assediar é a estrada [destination_1.GetBaseNameNoTier]-[destination_2.GetBaseNameNoTier].\n\nVamos roubar esses comerciantes e viajantes à luz do dia e fugir para a noite o mais rápido que conseguimos.\n\nPosso praticamente sentir o dinheiro."
 laamp_base_contract_schemes.1044.t:0 "$laamp_base_contract_schemes.1041.t$"
 laamp_base_contract_schemes.1044.tt.destination_list:0 "Você imediatamente começa a viajar para [destination_1.GetBaseNameNoTier], depois em direção a [destination_2.GetBaseNameNoTier]"
 laamp_base_contract_schemes.1044.tt.explanation:0 "#TUT Para completar o [task_contract|E]:\n$EFFECT_LIST_BULLET$Viaje para o destino final\n$EFFECT_LIST_BULLET$Ao longo do caminho, complete desafios de [skill|E] de [prowess|E], [martial|E] ou [intrigue|E] contra outros viajantes\n$EFFECT_LIST_BULLET$Ganhe qualquer quantia de [gold|E] para um $label_success_standard$#!"
 laamp_base_contract_schemes.1044.tt.number_of_encounters:0 "#TUT Você terá [task_contract.MakeScope.Var('encounters_max').GetValue|0] vítimas potenciais#!"
 laamp_base_contract_schemes.1044.tt.path_warning:0 "#TUT Embora alongar seu caminho de viagem não dê mais vítimas potenciais, encurtá-lo pode reduzir a quantia que você recebe#!"
 laamp_base_contract_schemes.1301.a.tt.duel_begins:0 "#X @warning_icon! Você imediatamente desafia [recidivist.GetFirstName] para um duelo até a [character_death_death|E]#!"
 laamp_base_contract_schemes.1301.a:0 "Ataca-te, [recidivist.Custom2('InsultNoun', ROOT.Char)]!"
 laamp_base_contract_schemes.1301.b.tt.failure.tt:0 "[recidivist.GetFirstName] escapa"
 laamp_base_contract_schemes.1301.b:0 "Guardas, matem [recidivist.GetSheHe]!"
 laamp_base_contract_schemes.1301.c:0 "Sinalize uma emboscada para atacar por trás."
 laamp_base_contract_schemes.1301.d.tt.not_enough_troops:0 "Você precisa de pelo menos [EmptyScope.ScriptValue('laamp_base_contract_schemes_1301_min_troops_value')|0] [men_at_arms|E]"
 laamp_base_contract_schemes.1301.d:0 "Deixe as tropas sobrepujarem esses bandidos."
 laamp_base_contract_schemes.1301.desc.encounters.first.family:0 "\"[ROOT.Char.GetFirstNameNoTooltip], meu [recidivist.Custom2('RelationToMeShort',ROOT.Char)], meu próprio sangue — por que você me persegue aqui? Esperando vingar as ofensas que fiz ao nome da família [ROOT.Char.GetHouse.GetName]?\""
 laamp_base_contract_schemes.1301.desc.encounters.first.general_reaction.angry:0 "\"Seu cachorrinho choroso e ignorante!\", grita [recidivist.GetFirstNameNoTooltip], \"aqui fora para fazer a vontade de [employer.GetTitledFirstNamePossessive], não é? Venha então, cão, enfrente-me e prove que não é mais do que um cachorro latindo!\""
 laamp_base_contract_schemes.1301.desc.encounters.first.general_reaction.doleful:0 "\"Queria que não tivéssemos nos encontrado sob tais circunstâncias desfavoráveis, [ROOT.Char.GetFirstNameNoTooltip], pois não tenho nenhuma rixa com você\", opina [recidivist.GetFirstNameNoTooltip], \"infelizmente, temo que você pretende seguir seu dever até seu amargo fim.\""
 laamp_base_contract_schemes.1301.desc.encounters.first.general_reaction.haughty:0 "\"Vamos lá, vamos ver — ah, #EMP lá [ROOT.Char.GetSheHe] está#!,\" brada [recidivist.GetFirstNameNoTooltip] enquanto [recidivist.GetSheHe] se empurra para a frente da multidão, \"[Select_CString( ROOT.Char.IsFemale, 'a pequena', 'o pequeno' )] [ROOT.Char.Custom('FormOfAddressForLiege')] perdid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] que pensa que [ROOT.Char.GetSheHe] vai me colocar no lugar! Bem, venha então, [ROOT.Char.GetFirstNameNoTooltip]! Aqui estou!\""
 laamp_base_contract_schemes.1301.desc.encounters.first.general_reaction.merry:0 "\"Ha!\", ri [recidivist.GetFirstNameNoTooltip], \"é isso que você trouxe? Excelente, #EMP excelente#!, um pouco de esporte fino finalmente! E você está aqui pessoalmente também — vou adorar te colocar no chão, [ROOT.Char.GetFirstNameNoTooltip].\""
 laamp_base_contract_schemes.1301.desc.encounters.first.general_reaction.taciturn:0 "\"Hmm\", murmura [recidivist.GetFirstNameNoTooltip], acariciando seu queixo. \"Eu... esperava mais, se sou honesto. Claramente o bom orçamento de [employer.GetTitleAsNamePossessive] está sofrendo. Então, vamos?\""
 laamp_base_contract_schemes.1301.desc.encounters.first.relation.bad:0 "\"Ahhhh [ROOT.Char.GetFirstNameNoTooltip], que outro tolo cabeça de vento estaria tão ansioso para me perseguir?\", abre [recidivist.GetFirstNameNoTooltip], avançando. \"Para ser sincero, estou aliviado. Matar a maioria d[Select_CString( ROOT.Char.IsFemale, 'as', 'os' )] [ROOT.Char.GetWomenMen] é entediante, mas despedaçar você será um #EMP prazer#!.\""
 laamp_base_contract_schemes.1301.desc.encounters.first.relation.good:0 "\"[ROOT.Char.GetFirstNameNoTooltip], meu [recidivist.Custom2('RelationToMeShort',ROOT.Char)]\", abre [recidivist.GetFirstNameNoTooltip], quebrando o silêncio. \"Eu... não esperava você. De todas as pessoas que poderiam vir por mim, alguém tão querido...\""
 laamp_base_contract_schemes.1301.desc.encounters.second:0 "\"De volta tão cedo, [ROOT.Char.GetFirstNameNoTooltip]? Depois da última vez, pensei que você teria aprendido a lição, mas parece que teremos que te ensinar da maneira mais difícil.\""
 laamp_base_contract_schemes.1301.desc.encounters.third:0 "\"Maldição e queima a sua persistência infernal, [ROOT.Char.GetFirstNameNoTooltip], você não vai parar de nos perseguir? Procure algum outro trabalho, pois não haverá prata do nosso sangue!\""
 laamp_base_contract_schemes.1301.desc.intro.desert:0 "os desertos escaldantes de [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.desert_mountains:0 "as montanhas áridas e implacáveis de [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.drylands:0 "as áridas terras secas de [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.farmlands:0 "as férteis terras agrícolas de [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.floodplains:0 "as úmidas planícies de inundação de [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.forest:0 "as florestas sombrias de [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.hills:0 "as colinas acidentadas de [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.jungle:0 "as densas florestas tropicais de [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.mountains:0 "as montanhas imponentes de [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.oasis:0 "a exuberante oásis em [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.plains:0 "as planícies onduladas de [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.postamble:0 "[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] se espalhou em direção e ao redor do seu pequeno bando de desajustados, todos nós tensos e prontos para o derramamento de sangue."
 laamp_base_contract_schemes.1301.desc.intro.preamble.first:0 "Encontramos [recidivist.GetFirstNameNicknamed] pela primeira vez em"
 laamp_base_contract_schemes.1301.desc.intro.preamble:0 "Estamos com [recidivist.GetFirstNameNicknamed] em"
 laamp_base_contract_schemes.1301.desc.intro.steppe:0 "a estepe sem fim de [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.taiga:0 "as amplas florestas de pinheiros de [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.wetlands:0 "os pântanos fétidos de [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.outro.1:0 "O momento equilibra-se na ponta de uma faca. Se eu não agir, alguém o fará, e tudo escapará completamente do meu controle."
 laamp_base_contract_schemes.1301.desc.outro.2:0 "O grupo de [recidivist.GetFirstNamePossessiveNoTooltip] está claramente em menor número, mas parece resoluto, disposto a defender seu líder ou morrer na tentativa."
 laamp_base_contract_schemes.1301.desc.outro.3:0 "Uma terrível quietude domina nossas forças reunidas. Ninguém disposto a romper o silêncio, por medo do que pode vir a seguir."
 laamp_base_contract_schemes.1301.desc.outro.4:0 "Ambos os lados esperam com a respiração suspensa, inseguros sobre o que vou dizer a seguir e torcendo para que não seja uma ordem para matar."
 laamp_base_contract_schemes.1301.desc.outro.5:0 "[recidivist.GetFirstNameNoTooltip] não pode vencer aqui, e [recidivist.GetSheHe] sabe disso, pelo menos não abertamente. Mas se puderem apenas escapar do meu alcance..."
 laamp_base_contract_schemes.1301.e.tt.failure.tt:0 "[recidivist.GetSheHe|U] usa sua demora para fugir"
 laamp_base_contract_schemes.1301.e.tt.failure:0 "[recidivist.GetFirstNameNoTooltip] não tem nada a ver com você"
 laamp_base_contract_schemes.1301.e.tt.success:0 "[recidivist.GetFirstNameNoTooltip] se junta a [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]"
 laamp_base_contract_schemes.1301.e:0 "Você sabe, admiro um[Select_CString( recidivist.IsFemale, 'a', '' )] [recidivist.GetWomanMan] de vontade..."
 laamp_base_contract_schemes.1301.f:0 "Você sabe, eu poderia usar um[Select_CString( recidivist.IsFemale, 'a', '' )] [recidivist.GetWomanMan] como você..."
 laamp_base_contract_schemes.1301.t:0 "$laamp_base_contract_schemes.1004.t$"
 laamp_base_contract_schemes.1301.tt.chances_remaining:0 "#TUT Este é o encontro [task_contract.MakeScope.Var('encounters_tally').GetValue|0] de até 3 #!"
 laamp_base_contract_schemes.1301.tt.insta_win:0 "#P +2#! pontos de vitória, uma vitória instantânea $label_success_standard$"
 laamp_base_contract_schemes.1301.tt.score_increased:0 "#P +1#! pontos de vitória"
 laamp_base_contract_schemes.1301.tt.success_score_and_threshold:0 "#TUT Você tem [task_contract.MakeScope.Var('wins_tally').GetValue|0] dos 2 pontos de vitória necessários para uma $label_success_standard$#!"
 laamp_base_contract_schemes.1302.a.tt:0 "$laamp_base_contract_schemes.0000.f.contract_concluded$"
 laamp_base_contract_schemes.1302.a:0 "Um trabalho bem feito."
 laamp_base_contract_schemes.1302.desc.intro:0 "Eu jogo a cabeça decapitada de [recidivist.GetFirstNameNicknamedPossessive] para o agente de [employer.GetTitledFirstNamePossessive], a carne vermelho-púrpura caindo molhadinha ao lado deles.\n\n"
 laamp_base_contract_schemes.1302.desc.method.martial:0 "\"Golpe magistral conseguir eliminar esse bastardo sem sofrer perdas significativas, [ROOT.Char.Custom('FormOfAddressForLiege')] — não tenho certeza se muitos poderiam ter concebido isso\""
 laamp_base_contract_schemes.1302.desc.method.meat:0 "\"Muito sábio deixar suas tropas lidarem com essa escória, [ROOT.Char.Custom('FormOfAddressForLiege')] — [recidivist.GetSheHe] era astuto demais para ter qualquer chance de escapar\""
 laamp_base_contract_schemes.1302.desc.method.prowess_non_sce:0 "\"Movimento sensato ter seus guardas despachando [recidivist.GetSheHe], [ROOT.Char.Custom('FormOfAddressForLiege')] — quem sabe o que poderia ter acontecido se [recidivist.GetSheHe] se aproximasse mais?\""
 laamp_base_contract_schemes.1302.desc.method.prowess_sce:0 "\"Você matou [recidivist.GetSheHe] em combate singular? Minha, quão #EMP feroz#!\""
 laamp_base_contract_schemes.1302.desc.outro:0 "observa o servo de [employer.GetTitleAsNamePossessiveNoTooltip], entregando cuidadosamente nosso pagamento ao mesmo tempo.\n\nAs palavras são de pouca consequência, mas o peso delicioso da bolsa cheia de moedas e seu carregamento de prata tornam nossa pequena caçada completamente valiosa."
 laamp_base_contract_schemes.1302.t:0 "$laamp_base_contract_schemes.1004.t$: Sucesso!"
 laamp_base_contract_schemes.1303.a.tt:0 "$laamp_base_contract_schemes.0000.f.contract_concluded$"
 laamp_base_contract_schemes.1303.a:0 "Droga, aquele tumor de [recidivist.GetWomanMan]!"
 laamp_base_contract_schemes.1303.desc.intro:0 "Com isso, [recidivist.GetFirstNameNicknamed] finalmente consegue se livrar da nossa perseguição,"
 laamp_base_contract_schemes.1303.desc.method.diplo_bandit:0 "fugindo silenciosamente sob o pretexto de considerar se juntar ao bando [recidivist.GetHerHim] com nossos próprios [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')]."
 laamp_base_contract_schemes.1303.desc.method.diplo_non_bandit:0 "escapando sob a aparência de estar ponderando minha generosa oferta."
 laamp_base_contract_schemes.1303.desc.method.martial:0 "perfurando a emboscada e fugindo com agilidade."
 laamp_base_contract_schemes.1303.desc.method.prowess_non_sce:0 "apesar das melhores tentativas dos meus guardas de capturar [recidivist.GetSheHe]."
 laamp_base_contract_schemes.1303.desc.outro:0 "Os agentes de [employer.GetTitledFirstNamePossessive] ficam desapontados quando conseguem me alcançar, mas dificilmente surpresos. Mesmo com sua compreensão, sem uma cabeça para entregar a [employer.Custom('MistressMaster')], eles não têm intenção de nos pagar."
 laamp_base_contract_schemes.1303.t:0 "$laamp_base_contract_schemes.1004.t$: Falha!"
 laamp_base_contract_schemes.1304.a.tt:0 "$laamp_base_contract_schemes.0000.f.contract_concluded$"
 laamp_base_contract_schemes.1304.a:0 "[employer.GetFirstNameNoTooltip] pode se danar para eu me importar."
 laamp_base_contract_schemes.1304.desc:0 "[recidivist.GetFirstNameNicknamed] responde... surpreendentemente bem à minha oferta, e depois que começamos a conversar, consigo convencer [recidivist.GetSheHe] de que não apenas sou genuíno, mas que posso oferecer um futuro melhor e mais brilhante tanto para [recidivist.GetSheHe] quanto para todo o seu bando.\n\nConsequentemente, todos eles se juntaram a [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l].\n\nClaro, [employer.GetTitledFirstName] pode não me perdoar por trair sua confiança, mas, no final das contas, resolvi o problema à minha maneira, não foi?"
 laamp_base_contract_schemes.1304.t:0 "$laamp_base_contract_schemes.1004.t$: Falha Especial!"
 laamp_base_contract_schemes.1782.a.tt.failure:0 "$laamp_base_contract_schemes.1782.c.tt.failure$"
 laamp_base_contract_schemes.1782.a.tt.success:0 "Você dispersa o comboio e saqueia suas bagagens"
 laamp_base_contract_schemes.1782.a:0 "Atacai esses tolos!"
 laamp_base_contract_schemes.1782.b.tt.failure:0 "$laamp_base_contract_schemes.1782.c.tt.failure$"
 laamp_base_contract_schemes.1782.b.tt.success:0 "Superados, eles se rendem"
 laamp_base_contract_schemes.1782.b:0 "Cercai-os e vamos ver o que eles vão pagar."
 laamp_base_contract_schemes.1782.c.tt.easier_against_most_but_less_rewards:0 "#TUT Isso é geralmente mais fácil, mas oferece menos [gold|E]#!"
 laamp_base_contract_schemes.1782.c.tt.failure:0 "Suas tropas são ineficazes"
 laamp_base_contract_schemes.1782.c.tt.success:0 "Uma emboscada bem-sucedida"
 laamp_base_contract_schemes.1782.c:0 "Esperai — atacaremos após o crepúsculo..."
 laamp_base_contract_schemes.1782.d.tt:0 "Você abre mão da oportunidade de tirar [victim.GetTitledFirstName] de sua riqueza"
 laamp_base_contract_schemes.1782.d:0 "Deixai esses de lado."
 laamp_base_contract_schemes.1782.desc.connection.family_or_consort:0 "parecem ser liderados por ninguém menos que [victim.GetTitledFirstName], meu [victim.Custom2('RelationToMeShort',ROOT.Char)]!"
 laamp_base_contract_schemes.1782.desc.connection.negative:0 "parece que eles são liderados por [victim.GetTitledFirstName], um [victim.Custom2('RelationToMeShort',ROOT.Char)] meu."
 laamp_base_contract_schemes.1782.desc.connection.none:0 "à frente deles está [victim.GetTitledFirstName], pelo menos de acordo com meus escoteiros, liderando os demais em seu caminho sinuoso."
 laamp_base_contract_schemes.1782.desc.connection.positive:0 "liderando-os está [victim.GetTitledFirstName], meu [victim.Custom2('RelationToMeShort',ROOT.Char)] que eu reluto em ferir."
 laamp_base_contract_schemes.1782.desc.intro.1:0 "Nesta manhã, avistamos um distante comboio de pessoas —"
 laamp_base_contract_schemes.1782.desc.intro.2:0 "Várias horas antes do pôr do sol, encontramos uma gangue de viajantes —"
 laamp_base_contract_schemes.1782.desc.intro.3:0 "Por volta do meio-dia, alcançamos uma caravana que estamos seguindo há dias —"
 laamp_base_contract_schemes.1782.desc.intro.4:0 "Pouco depois do amanhecer, um pequeno grupo de viajantes aparece no horizonte —"
 laamp_base_contract_schemes.1782.desc.intro.5:0 "Logo antes do final da luz, começamos a nos aproximar da parte de trás de um longo comboio —"
 laamp_base_contract_schemes.1782.desc.outro:0 "[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] apenas aguarda meu sinal para atacar."
 laamp_base_contract_schemes.1782.desc.victim_type.baron:0 "Com um [victim.GetTitleAsNameNoTooltip] à frente, o grupo obviamente tem #EMP alguma#! riqueza, mas não está exatamente transbordando de moedas. Ainda assim, uma presa valiosa, caso queiramos."
 laamp_base_contract_schemes.1782.desc.victim_type.fallback:0 "Embora [Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetWomanMan] que lidera use roupas mais finas do que a maioria do resto do bando, é claro que, no final das contas, [victim.GetSheHe] é uma verdadeira ninguém. Qualquer moeda que [victim.GetSheHe] tenha consigo é provavelmente todo o dinheiro que [victim.GetSheHe] possui no mundo."
 laamp_base_contract_schemes.1782.desc.victim_type.laamp:0 "É patente que, assim como nós, este é um grupo de aventureiros à procura de novas acomodações para a noite. Eles podem ser mais ricos que reis ou mais pobres que camponeses, um estado que nós mesmos conhecemos muito bem."
 laamp_base_contract_schemes.1782.desc.victim_type.pool:0 "À primeira vista, o grupo não é nada mais do que vagabundos itinerantes, a única riqueza que possuem é o que conseguem carregar e o que seu bom nome pode garantir em presentes."
 laamp_base_contract_schemes.1782.desc.victim_type.travelling_nobody:0 "Faltando os exorbitantes adornos do poder ou a dureza desgastada pelo tempo dos verdadeiros itinerantes, este grupo parece estar... mal preparado para a estrada. Quanto a moedas eles têm, é uma incógnita."
 laamp_base_contract_schemes.1782.desc.victim_type.travelling_ruler:0 "Liderados por um ilustre [victim.GetTitleAsNameNoTooltip] viajando fora de sua [victim.Custom('FortifiedBuilding')], embora felizmente com muito menos guardas do que seria razoavelmente esperado para alguém de [victim.GetFirstNamePossessiveNoTooltip] posição, este grupo #EMP sem dúvida#! possui riqueza suficiente para ser tomada."
 laamp_base_contract_schemes.1782.t:0 "$laamp_base_contract_schemes.1041.t$: [victim.GetTitledFirstNameNoTooltip]"
 laamp_base_contract_schemes.1782.tt.victim_escapes:0 "[victim.GetTitledFirstNameNoTooltip] escapa em meio ao caos"
 laamp_base_contract_schemes.1783.a:0 "As estradas realmente são a fonte de toda riqueza..."
 laamp_base_contract_schemes.1783.desc:0 "Quem diz que viajar é difícil, complicado e perigoso?\n\nDo ponto de vista de [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessive|l], parece uma empreitada bastante fácil e relativamente lucrativa. Com nossas mochilas pesadas de moedas, chegamos alegremente — se desconfiados — em [destination_2.GetBaseNameNoTier], com nossos ânimos elevados e nossas bolsas cheias.\n\nVamos simplesmente torcer para que nenhum de nossos vítimas nos alcance antes de partirmos."
 laamp_base_contract_schemes.1783.t:0 "$laamp_base_contract_schemes.1041.t$: Sucesso!"
 laamp_base_contract_schemes.1784.a:0 "Tudo parecia tão fácil na época..."
 laamp_base_contract_schemes.1784.desc:0 "Infelizmente, às vezes [ROOT.Char.GetFaith.FateGodName] sorri para um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan], e às vezes [ROOT.Char.GetFaith.FateGodSheHe] não sorri.\n\nHoje, parece que não fizemos o suficiente para conquistar o favor da Fortuna, pois [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] não ganharam uma única moeda brilhante desde que começamos essa empreitada.\n\nCom nossa jornada chegando ao fim, parece que devemos reconhecer nossas falhas e seguir em frente."
 laamp_base_contract_schemes.1784.t:0 "$laamp_base_contract_schemes.1041.t$: Falha!"
 laamp_base_contract_schemes.2001.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.2001.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.2001.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.2001.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.2001.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.2001.desc:0 "\"... e, claro, o imposto sobre a terra adicional. Está tudo claro?\" diz [employer.GetTitledFirstName]. É uma longa lista de cobranças em falta, deveres e outras tarifas diversas, mas a coleta parece simples o suficiente.\n\n\"Bom, #EMP bom#!! Agora, estou correndo o risco de confiar em você em vez dos meus costumeiros cobradores, mas espero que você consiga mostrar a esses idiotas como se faz e colocar o temor de [employer.GetFaith.WealthGodName] de volta em meus súditos. Faça seu trabalho honestamente, rapidamente e bem, e você será mais do que compensado.\"\n\nPor um segundo, parece que pode haver mais instruções, mas [employer.GetFirstNameNoTooltip] me gesticula para sair do escritório com um aceno."
 laamp_base_contract_schemes.2001.t:0 "Impostos, Dízimos e Impostos"
 laamp_base_contract_schemes.2002.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.2002.desc:0 "\"Ótimo trabalho, [ROOT.Char.GetFirstNameNoTooltip]!\" exulta [employer.GetFirstName], assobiando suavemente para [employer.GetHerselfHimself] enquanto meu bando traz bolsa após bolsa de impostos atrasados.\n\n\"O dinheiro e a carga são excelentes, claro, mas isso deve ensinar meus cobradores de impostos a #EMP apreciar#! seus trabalhos no futuro.\"\n\nEu aceno, satisfeito com o conhecimento de que a gratidão do(a) [employer.GetTitleAsNamePossessiveNoTooltip] significa que nosso pagamento será rápido. Fico apenas feliz em aceitar o pesado saco que me foi jogado momentos depois."
 laamp_base_contract_schemes.2002.t:0 "$laamp_base_contract_schemes.2001.t$: Sucesso!"
 laamp_base_contract_schemes.2003.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.2003.desc:0 "\"Idiota! Isso é menos da metade do que você #EMP deveria#! ter coletado!\" troveja [employer.GetTitledFirstName].\n\n\"Se eu não tivesse mandado vasculhar seu miserável acampamento de cima a baixo, pensaria que você estava me roubando, mas está claro que isso é apenas incompetência,\" [employer.GetSheHe] mal para para respirar, \"agora [employer.Custom('Saying_1p_SightAway')] antes que eu desperdice o punhado de moedas que você realmente conseguiu coletar em [employer.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip|l] mais precária coleção de forca!\"\n\nA tirada faz meus pelos se erguerem, minha mandíbula clicando na articulação enquanto contenho a raiva crescente.\n\nNão é hora para uma briga, não quando ainda posso sair com minha cabeça."
 laamp_base_contract_schemes.2003.t:0 "$laamp_base_contract_schemes.2001.t$: Falha!"
 laamp_base_contract_schemes.2004.a:0 "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.2004.b:0 "$travel.mobile_domicile.option.t$"
 laamp_base_contract_schemes.2004.desc:0 "[employer.GetTitledFirstNamePossessive] representante é rápido e direto: a cidade de [destination_1.GetBaseNameNoTier] falhou, parece, em pagar um imposto adicional imposto pelo bom(a) [employer.GetTitleAsNameNoTooltip].\n\nOs residentes resistiram a novas demandas, mas não #EMP ainda#! marcharam para uma revolta aberta. [employer.GetFirstNameNoTooltip] quer o que é seu por direito, mas é cauteloso quanto aos potenciais custos de uma rebelião aberta.\n\nUma terceira parte neutra é uma ficção conveniente para intimidar o líder da assentamento recalcitrante, um(a) [person_a.GetTitledFirstName], a se submeter.\n\nTudo que resta é a jornada para [destination_1.GetBaseNameNoTierNoTooltip]."
 laamp_base_contract_schemes.2004.t:0 "Entregar a [employer.GetFirstNameNoTooltip]"
 laamp_base_contract_schemes.2004.tt.destination_list:0 "Você imediatamente começa a viajar para [destination_1.GetBaseNameNoTier]"
 laamp_base_contract_schemes.2004.tt.explanation:0 "#TUT Para completar o [task_contract|E]:\n$EFFECT_LIST_BULLET$Complete 4 desafios para descobrir evidências:\n$TAB$$EFFECT_LIST_BULLET$2 peças de evidência garantem um $label_success_standard$\n$TAB$$EFFECT_LIST_BULLET$4 peças de evidência dão um $label_success_critical$\n$TAB$$EFFECT_LIST_BULLET$1 peça de evidência pode levar a um $label_success_standard$, um $label_success_qualified$, ou um $label_failure_standard$\n$EFFECT_LIST_BULLET$Os desafios podem ser:\n$TAB$$EFFECT_LIST_BULLET$Testando [stewardship|E]\n$TAB$$EFFECT_LIST_BULLET$Testando a [aptitude|E] do [officer|E] [GetCourtPositionType('quartermaster_camp_officer').GetName()]\n$TAB$$EFFECT_LIST_BULLET$Testando uma das [diplomacy|E], [intrigue|E] & [learning|E]#!"
 laamp_base_contract_schemes.2011.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.2011.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.2011.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.2011.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.2011.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.2011.desc:0 "É talvez um pouco não ortodoxo contratar [ROOT.Char.Custom('GetLaampDescribeTypeSelfArticle')] [ROOT.Char.Custom('GetLaampDescribeTypeSelf')] e seu bando para realizar um censo, mas às vezes as necessidades exigem, como [ROOT.Char.GetFaith.random_EvilGodNames] direciona, suponho, e mal posso reclamar por conseguir o trabalho.\n\nO dinheiro é tão bom quanto, e qualquer que seja a razão pela qual [employer.GetTitledFirstName] desconfia de seus escrivães claramente não se estende a nós, então deve ser um trabalho simples e agradável.\n\nCerto?"
 laamp_base_contract_schemes.2011.t:0 "Fazendo um Registro"
 laamp_base_contract_schemes.2012.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.2012.desc:0 "Realizar um censo não está isento de suas emoções: há os fazendeiros tentando esconder gado e colheitas armazenadas, os comerciantes disfarçando lucros, até mesmo a nobreza menor cujas terras parecem ficar menores e mais pobres à medida que você se aproxima enquanto faz anotações.\n\nFelizmente, no entanto, não encontramos nada que o selo de [employer.GetTitledFirstNamePossessive] e nossa própria inteligência não consigam contornar facilmente.\n\nOs resultados podem não ser exaustivos, mas servirão bem por anos a fio, e isso é tudo que nosso contrato estipulou.\n\nHora de receber o pagamento."
 laamp_base_contract_schemes.2012.t:0 "$laamp_base_contract_schemes.2011.t$: Sucesso!"
 laamp_base_contract_schemes.2013.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.2013.desc:0 "Claro que não era um trabalho simples.\n\nSe fosse, [employer.GetTitledFirstName] teria deixado seus oficiais habituais lidarem com isso: em vez disso, meu bando e eu acabamos de gastar [ROOT.Char.GetFaith.HealthGodName]-sabe-se lá quanto do nosso precioso tempo nesta Terra lidando com os mais estúpidos, recalcitrantes, #EMP insuportavelmente idiotas peões#! que a infinita sabedoria de [ROOT.Char.GetFaith.CreatorName] já produziu.\n\nEsta terra e seu povo devem ser terminalmente consanguíneos, pois nada menos que isso poderia produzir tamanha falta de inteligência.\n\nInfelizmente, o censo resultante não é nem remotamente crível, e nosso pagamento não virá."
 laamp_base_contract_schemes.2013.t:0 "$laamp_base_contract_schemes.2011.t$: Falha!"
