 laamp_base_contract_schemes.2014.tt.destination_list.11_destinations:0 "Você imediatamente começa a [viajar|E], na ordem, para:\n$EFFECT_LIST_BULLET$[destination_1.GetNameNoTier] #FRACO ([destination_1.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_2.GetNameNoTier] #FRACO ([destination_2.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_3.GetNameNoTier] #FRACO ([destination_3.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_4.GetNameNoTier] #FRACO ([destination_4.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_5.GetNameNoTier] #FRACO ([destination_5.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_6.GetNameNoTier] #FRACO ([destination_6.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_7.GetNameNoTier] #FRACO ([destination_7.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_8.GetNameNoTier] #FRACO ([destination_8.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_9.GetNameNoTier] #FRACO ([destination_9.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_10.GetNameNoTier] #FRACO ([destination_10.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_11.GetNameNoTier] #FRACO ([destination_11.GetDeJureLiege.GetName])#!"
 laamp_base_contract_schemes.2014.tt.destination_list.12_destinations:0 "Você imediatamente começa a [viajar|E], na ordem, para:\n$EFFECT_LIST_BULLET$[destination_1.GetNameNoTier] #FRACO ([destination_1.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_2.GetNameNoTier] #FRACO ([destination_2.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_3.GetNameNoTier] #FRACO ([destination_3.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_4.GetNameNoTier] #FRACO ([destination_4.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_5.GetNameNoTier] #FRACO ([destination_5.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_6.GetNameNoTier] #FRACO ([destination_6.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_7.GetNameNoTier] #FRACO ([destination_7.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_8.GetNameNoTier] #FRACO ([destination_8.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_9.GetNameNoTier] #FRACO ([destination_9.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_10.GetNameNoTier] #FRACO ([destination_10.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_11.GetNameNoTier] #FRACO ([destination_11.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_12.GetNameNoTier] #FRACO ([destination_12.GetDeJureLiege.GetName])#!"
 laamp_base_contract_schemes.2014.tt.explanation:0 "#TUT Para completar o [task_contract|E]:\n$EFFECT_LIST_BULLET$Conclua um desafio de [stewardship|E], [intrigue|E] ou [aptitude|E] de [GetCourtPositionType('quartermaster_camp_officer').GetName()] em cada destino\n$EFFECT_LIST_BULLET$Vença todos os desafios para obter um $label_success_critical$\n$EFFECT_LIST_BULLET$Se você testar apenas [stewardship|E] ou sua [GetCourtPositionType('quartermaster_camp_officer').GetName()], poderá falhar até duas vezes e ainda assim obter um $label_success_standard$ — desde que vença ao menos metade dos desafios\n$EFFECT_LIST_BULLET$Se você fizer um desafio de [intrigue|E] ou simplesmente falsificar os resultados, poderá falhar apenas uma vez e ainda assim obter um $label_success_standard$ — além disso, se falhar, será um $label_failure_critical$#!"
 laamp_base_contract_schemes.2021.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.2021.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.2021.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.2021.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.2021.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.2021.desc:0 "Os planos para a construção de [employer.GetTitledFirstNamePossessive] são... talvez um pouco faltando em planejamento. Pelo menos, é assim que parece para mim e meu bando; não é de admirar que os desenhistas [employer.GetHerHim] tenham enfrentado problemas.\n\nAinda assim, isso não deve ser um problema para nós. Sabemos o que [employer.GetSheHe] estava tentando construir, só precisamos descobrir como #EMP fazer#! isso, e somos semi-profissionais habilidosos.\n\nDe um tipo, pelo menos."
 laamp_base_contract_schemes.2021.t:0 "Arquitetura Amadora"
 laamp_base_contract_schemes.2022.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.2022.desc:0 "Como sempre, meu bando e eu somos modelos de eficiência. A construção foi rápida, o resultado robusto e memorável, e embora [employer.GetTitledFirstName] precise continuar nosso bom trabalho, já fornecemos a [employer.GetSheHe] tudo que [employer.GetSheHe] precisa para fazê-lo.\n\nPesados com nosso pagamento bem merecido, nos preparamos para partir."
 laamp_base_contract_schemes.2022.t:0 "$laamp_base_contract_schemes.2021.t$: Sucesso!"
 laamp_base_contract_schemes.2023.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.2023.desc:0 "Há alguns edifícios finamente decorados em [employer.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTier].\n\nSó não o nosso.\n\nDada a inclinação, os materiais de baixa qualidade, as madeiras salientes — sem mencionar os incêndios durante a construção — somos sortudos por não estarmos enfrentando acusações criminais.\n\nAinda assim, isso pode mudar junto com os caprichos de [employer.GetTitledFirstNamePossessive] a qualquer momento, o que significa que é melhor partirmos."
 laamp_base_contract_schemes.2023.t:0 "$laamp_base_contract_schemes.2021.t$: Falha!"
 laamp_base_contract_schemes.2031.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.2031.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.2031.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.2031.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.2031.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.2031.desc:0 "O impasse político é um fenômeno interessante: dois ou três poderosos partidos locais dentro de [employer.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTier], disputando ativamente entre si, mas incapazes ou unwilling de avançar por conta própria.\n\nA disputa sobre exatamente onde se encontra uma fronteira interna precisa de alguém sem viés para ouvir os fatos e inspecionar a terra. Se nossa resposta for satisfatória o suficiente, seremos bem pagos."
 laamp_base_contract_schemes.2031.t:0 "Arbitragem"
 laamp_base_contract_schemes.2032.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.2032.desc:0 "Conseguimos realmente resolver a disputa de fronteira em [employer.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTier]?\n\nTalvez não, mas o veredicto que alcançamos #EMP teve#! fez com que seus murmúrios diminuíssem para níveis aceitáveis. Do ponto de vista de [employer.GetTitledFirstNamePossessive], isso é realmente tudo que fomos contratados para fazer, e assim nosso trabalho está devidamente concluído.\n\nO pagamento chega rapidamente."
 laamp_base_contract_schemes.2032.t:0 "$laamp_base_contract_schemes.2031.t$: Sucesso!"
 laamp_base_contract_schemes.2033.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.2033.desc:0 "Gritos, berros, acusações de suborno e conspiração... tentar gerenciar um fim amigável para a disputa de fronteira em [employer.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTier] foi uma #EMP experiência#!.\n\nDesnecessário dizer que não receberemos pagamento por esta, mas pelo menos não seremos multados.\n\nPelo menos se nos movermos rapidamente."
 laamp_base_contract_schemes.2033.t:0 "$laamp_base_contract_schemes.2031.t$: Falha!"
 laamp_base_contract_schemes.2041.a:0 "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.2041.b:0 "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.2041.c:0 "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.2041.d.tt:0 "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.2041.d:0 "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.2041.desc:0 "Tenho certeza de que as boas pessoas das terras de [employer.GetTitledFirstNamePossessive] estão bem acostumadas a [employer.GetSheHe] impor pedágios e dízimos sobre elas sem aviso prévio, então mais uma taxinha — e com aviso prévio do [employer.GetTitleAsNameNoTooltip], nada menos — não deveria causar tanto quanto levantar uma sobrancelha.\n\nPreparamos nosso selo falso de ofício e ensaiamos nossa história mais uma vez, prontos para avançar na primeira comunidade com nossos cofres se abrindo.\n\nIsso deve render um #EMP lucro limpo#!."
 laamp_base_contract_schemes.2041.t:0 "Um Imposto Especial"
 laamp_base_contract_schemes.2042.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.2042.desc:0 "É disturbadoramente fácil separar as pessoas de sua riqueza quando elas pensam que você tem o direito de fazê-lo, e o respaldo de seu [employer.GetTitleAsNameNoTooltip] para completar. Alguns são suspeitos a princípio, mas um comportamento suficientemente severo e ameaças vagas de autoridades superiores desmoronam cada um com o tempo.\n\nA palavra sobre nossas escapadas, sem dúvida, vai circular — o que importa é que não fomos descobertos enquanto isso estava #EMP acontecendo#!.\n\nNesse meio tempo, provavelmente não devemos demorar. Seria uma pena que [employer.GetFirstName] soubesse que [employer.GetSheHe] tem alguns \"impostos\" oficiais fora do tesouro."
 laamp_base_contract_schemes.2042.t:0 "$laamp_base_contract_schemes.2041.t$: Sucesso!"
 laamp_base_contract_schemes.2043.a:0 "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.2043.desc:0 "Talvez... talvez haja uma razão pela qual as pessoas não tentam isso com mais frequência.\n\nVez após vez, os locais nos expulsam da área, nos chamando de estranhos e estrangeiros, exigindo mais provas de identidade, recusando-se a acreditar que seu [employer.GetTitleAsNameNoTooltip] imporia um imposto extra sem aviso ou anúncio.\n\nSeria melhor se fôssemos embora, mesmo sem ganhos reais, antes que [employer.GetFirstName] ouça sobre o que aconteceu aqui."
 laamp_base_contract_schemes.2043.t:0 "$laamp_base_contract_schemes.2041.t$: Falha!"
 laamp_base_contract_schemes.2044.a:0 "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.2044.b:0 "$travel.mobile_domicile.option.t$"
 laamp_base_contract_schemes.2044.desc:0 "$laamp_base_contract_schemes.2041.desc$"
