l_spanish:
 boilerplate.paragraph:0 "\n\n"
 contract_invalidated_desc:0 "O [task_contract|E] em andamento foi invalidado"
 contract_invalidated_title:0 "Contrato Encerrado"
 friendly_face_on_the_road_opinion:0 "Rosto Amigável na Estrada"
 gallowsbait_scum_opinion:0 "Escória do Galo"
 laamp_base_0001_contract_scheme:0 "Corte Regale"
 laamp_base_0001_contract_scheme_action:0 "Regale a Corte de"
 laamp_base_0001_contract_scheme_desc:0 "Neste [scheme|E], a [court|E] [contractor_possessive|E] se torna seca de fofocas e, consequentemente, inquieta. Para trazer notícias frescas, oferecem presentes e alojamentos a viajantes de fama suficiente, atraindo-os a ficar com eles por um tempo.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_0001_contract_scheme_desc_general:0 "$laamp_base_0001_contract_scheme_desc$"
 laamp_base_0001_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_0001_desc:0 "Fale sobre [TaskContract.GetEmployer.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] e assuntos mundanos e conheça a recompensa! Todos com histórias a contar estão cordialmente convidados a desfrutar da hospitalidade do [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier]."
 laamp_base_0001_desc_title:0 "Palestrantes interessantes procurados!"
 laamp_base_0001_failure_employer_modifier:0 "Acompanhantes Cansativos"
 laamp_base_0001_failure_employer_modifier_desc:0 "Viajantes cansativos e rogues desonestos povoam a corte deste personagem, tornando-a um lugar tedioso para viver."
 laamp_base_0001_success_employer_modifier:0 "Cortesãos Entretenidos"
 laamp_base_0001_success_employer_modifier_desc:0 "A corte deste personagem está agitada com contos mirabolantes de climas estrangeiros e uma vida exótica na estrada."
 laamp_base_0011.tt.success_standard.employer_reward.remove_potential_rivals:0 "Remove [THIS.Char.MakeScope.ScriptValue('laamp_base_0011_num_removable_potential_rivals_value')] potenciais [rivals|E]"
 laamp_base_0011_contract_scheme:0 "Melhorar a Reputação do Governante"
 laamp_base_0011_contract_scheme_action:0 "Melhorar a Reputação de"
 laamp_base_0011_contract_scheme_desc:0 "Um [contractor|E] encontra sua posição insatisfatória: ou seu nome é uma má fama, muitos [vassals|E] os odeiam, ou simplesmente lhes falta o [prestige|E] para justificar algo que desejam. O que eles precisam é de um terceiro \"neutro\" para ajudar... #EMP a reforçar#! sua reputação.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_0011_contract_scheme_desc_general:0 "$laamp_base_0011_contract_scheme_desc$"
 laamp_base_0011_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_0011_desc:0 "A todos os homens respeitáveis e confiáveis: um bom emprego em serviço do [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] pode ser encontrado. Apenas consultas sérias."
 laamp_base_0011_desc_title:0 "Emissários eloquentes desejados,"
 laamp_base_0021_contract_scheme:0 "Socializar com o Governante"
 laamp_base_0021_contract_scheme_action:0 "Socializar com"
 laamp_base_0021_contract_scheme_desc:0 "Quando um [contractor|E] está claramente faminto por atenção, se tornam vulneráveis a oportunistas. Oportunistas que podem comer seu pão, esvaziar sua adega, levantar alguns \"empréstimos\" e desaparecer antes que os gritos de um contador levantem o alarme.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_0021_contract_scheme_desc_general:0 "$laamp_base_0021_contract_scheme_desc$"
 laamp_base_0021_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_0021_desc:0 "Que fique conhecido que o munificente [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] estende a sua generosa hospitalidade a viajantes mundanos e merecedores."
 laamp_base_0021_desc_title:0 "Estrangeiros divertidos procurados,"
 laamp_base_0031_contract_scheme:0 "Medie em Nome"
 laamp_base_0031_contract_scheme_action:0 "Medie para"
 laamp_base_0031_contract_scheme_challenge_diplomacy_intrigue_learning_modifier:0 "$laamp_base_contract_schemes.0668.t$"
 laamp_base_0031_contract_scheme_challenge_diplomacy_intrigue_learning_modifier_desc:0 "Este [modifier|E] pode ser removido pelo [adventurer|E] encarregado de resolvê-lo por meio de verificações de diplomacia, intriga ou aprendizado."
 laamp_base_0031_contract_scheme_challenge_diplomacy_intrigue_prowess_modifier:0 "$laamp_base_contract_schemes.0669.t$"
 laamp_base_0031_contract_scheme_challenge_diplomacy_intrigue_prowess_modifier_desc:0 "Este [modifier|E] pode ser removido pelo [adventurer|E] encarregado de resolvê-lo por meio de verificações de diplomacia, intriga ou poder."
 laamp_base_0031_contract_scheme_challenge_diplomacy_learning_prowess_modifier:0 "$laamp_base_contract_schemes.0670.t$"
 laamp_base_0031_contract_scheme_challenge_diplomacy_learning_prowess_modifier_desc:0 "Este [modifier|E] pode ser removido pelo [adventurer|E] encarregado de resolvê-lo por meio de verificações de diplomacia, aprendizado ou poder."
 laamp_base_0031_contract_scheme_challenge_diplomacy_martial_intrigue_modifier:0 "$laamp_base_contract_schemes.0662.t$"
 laamp_base_0031_contract_scheme_challenge_diplomacy_martial_intrigue_modifier_desc:0 "Este [modifier|E] pode ser removido pelo [adventurer|E] encarregado de resolvê-lo por meio de verificações de diplomacia, marcial ou intriga."
 laamp_base_0031_contract_scheme_challenge_diplomacy_martial_learning_modifier:0 "$laamp_base_contract_schemes.0663.t$"
 laamp_base_0031_contract_scheme_challenge_diplomacy_martial_learning_modifier_desc:0 "Este [modifier|E] pode ser removido pelo [adventurer|E] encarregado de resolvê-lo por meio de verificações de diplomacia, marcial ou aprendizado."
 laamp_base_0031_contract_scheme_challenge_diplomacy_martial_prowess_modifier:0 "$laamp_base_contract_schemes.0664.t$"
 laamp_base_0031_contract_scheme_challenge_diplomacy_martial_prowess_modifier_desc:0 "Este [modifier|E] pode ser removido pelo [adventurer|E] encarregado de resolvê-lo por meio de verificações de diplomacia, marcial ou poder."
 laamp_base_0031_contract_scheme_challenge_diplomacy_martial_stewardship_modifier:0 "$laamp_base_contract_schemes.0661.t$"
 laamp_base_0031_contract_scheme_challenge_diplomacy_martial_stewardship_modifier_desc:0 "Este [modifier|E] pode ser removido pelo [adventurer|E] encarregado de resolvê-lo por meio de verificações de diplomacia, marcial ou administração."
 laamp_base_0031_contract_scheme_challenge_diplomacy_stewardship_intrigue_modifier:0 "$laamp_base_contract_schemes.0665.t$"
 laamp_base_0031_contract_scheme_challenge_diplomacy_stewardship_intrigue_modifier_desc:0 "Este [modifier|E] pode ser removido pelo [adventurer|E] encarregado de resolvê-lo por meio de verificações de diplomacia, administração ou intriga."
 laamp_base_0031_contract_scheme_challenge_diplomacy_stewardship_learning_modifier:0 "$laamp_base_contract_schemes.0666.t$"
 laamp_base_0031_contract_scheme_challenge_diplomacy_stewardship_learning_modifier_desc:0 "Este [modifier|E] pode ser removido pelo [adventurer|E] encarregado de resolvê-lo por meio de verificações de diplomacia, administração ou aprendizado."
 laamp_base_0031_contract_scheme_challenge_diplomacy_stewardship_prowess_modifier:0 "$laamp_base_contract_schemes.0667.t$"
 laamp_base_0031_contract_scheme_challenge_diplomacy_stewardship_prowess_modifier_desc:0 "Este [modifier|E] pode ser removido pelo [adventurer|E] encarregado de resolvê-lo por meio de verificações de diplomacia, administração ou poder."
 laamp_base_0031_contract_scheme_desc:0 "Quando amargas recriminações locais são lançadas através das terras de um [contractor], e eles mesmos são considerados ineptos ou parciais demais para resolver a disputa, podem oferecer o papel de mediador imparcial a viajantes adequados.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_0031_contract_scheme_desc_general:0 "$laamp_base_0031_contract_scheme_desc$"
 laamp_base_0031_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_0031_desc:0 "Arbitragens imparciais são buscadas pelo [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] para resolver justa e adequadamente uma disputa paroquial. Bônus disponível para resolução completa."
 laamp_base_0031_desc_title:0 "Viajantes bem-nascidos procurados,"
 laamp_base_0031_failure_employer_modifier:0 "Abdicou da Responsabilidade"
 laamp_base_0031_failure_employer_modifier_desc:0 "Este personagem tentou encontrar um bode expiatório para suportar a ira de seus súditos, mas apenas conseguiu piorar tudo."
 laamp_base_0031_success_employer_modifier:0 "Mediadores Especialistas"
 laamp_base_0031_success_employer_modifier_desc:0 "Este personagem trouxe talentos consideráveis para resolver uma controvérsia em seu reino."
 laamp_base_0041_contract_scheme:0 "Trambiqueiro"
 laamp_base_0041_contract_scheme_action:0 "Fraudar"
 laamp_base_0041_contract_scheme_desc:0 "Um tolo e sua riqueza são facilmente separados. Nenhum [contractor|E] pediria formalmente #EMP isso#! — não, eles cometem o erro de engajar um fraudador em conversa, apenas para descobrir após a conclusão do contrato que foram enganados (ou até roubados) e o viajante duplicitário se foi.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_0041_contract_scheme_desc_general:0 "$laamp_base_0041_contract_scheme_desc$"
 laamp_base_0041_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_0041_desc:0 "O sábio, sagaz e perspicaz [TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] deseja entretenimento por uma temporada. #EMP Acomodações limitadas#! disponíveis, #EMP se#! você atender aos padrões exigentes [TaskContract.GetEmployer.GetHerHim]."
 laamp_base_0041_desc_title:0 "Pessoas fascinantes desejadas,"
 laamp_base_0041_failure_employer_modifier:0 "Vigilante Contra Mentiras"
 laamp_base_0041_failure_employer_modifier_desc:0 "Este personagem sabe que ninguém vem à corte a menos que queira algo, e age de acordo."
 laamp_base_0041_success_employer_modifier:0 "Ingênuo"
 laamp_base_0041_success_employer_modifier_desc:0 "Apesar de seus melhores esforços, este personagem acredita um pouco demais no que lhe dizem."
 laamp_base_1001_contract_scheme:0 "Caçar Criminosos"
 laamp_base_1001_contract_scheme_action:0 "Caçar Criminosos para"
 laamp_base_1001_contract_scheme_desc:0 "Um grupo empreendedor de infratores pode causar muitos danos à propriedade, [prestige|E], e até mesmo à [legitimacy|E] com o tempo. Grande o suficiente para ser uma preocupação, pequeno o suficiente para ser difícil de capturar, esses transgressores se tornam perfeitos [contract_scheme_contract|E] a serem contratados.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_1001_contract_scheme_desc_general:0 "$laamp_base_1001_contract_scheme_desc$"
 laamp_base_1001_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_1001_desc:0 "Fique de olho em renegados e reprobados assombrando as estradas secundárias!\n\nSe seu braço de espada é forte e seu olhar é verdadeiro, [TaskContract.GetEmployer.GetTitledFirstName] promete recompensas generosas em troca da cabeça de um determinado bandido."
 laamp_base_1001_desc_title:0 "Viajantes próximos ao [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier],"
 laamp_base_1001_success_employer_modifier:0 "Criminosos Capturados"
 laamp_base_1001_success_employer_modifier_desc:0 "Este condado está positivamente desprovido de elementos reincidentes — por enquanto."
 laamp_base_1011_contract_scheme:0 "Músculos Contratados"
 laamp_base_1011_contract_scheme_action:0 "Impor para"
 laamp_base_1011_contract_scheme_desc:0 "Quando um [contractor|E] precisa de um pouco mais de força aplicada discretamente e em curto prazo, um mercenário pode fornecer muito mais discrição do que os retentores comuns.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_1011_contract_scheme_desc_general:0 "$laamp_base_1011_contract_scheme_desc$"
 laamp_base_1011_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_1011_desc:0 "O [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] busca urgentemente espadachins discretos para um trabalho breve. Recompensa generosa oferecida por trabalho rápido e limpo."
 laamp_base_1011_desc_title:0 "Espadachins de boa reputação,"
 laamp_base_1021_failure_employer_modifier:0 "Rabble Desleixado"
 laamp_base_1021_failure_employer_modifier_desc:0 "#EMP Tropas?#! A casa deste personagem parece mais com bêbados nascidos nas ruas do que com guerreiros."
 laamp_base_1021_success_employer_modifier:0 "Tropas Bem Treinadas"
 laamp_base_1021_success_employer_modifier_desc:0 "Um instrutor especialista moldou os soldados da casa deste personagem em uma máquina bem lubrificada."
 laamp_base_1031_failure_employer_modifier:0 "Terra em Turmoil"
 laamp_base_1031_failure_employer_modifier_desc:0 "Discussões e pequenos confrontos são uma característica constante da vida aqui, e os habitantes sabem a quem culpar."
 laamp_base_1031_success_employer_modifier:0 "Terra Pacífica"
 laamp_base_1031_success_employer_modifier_desc:0 "Este condado está atualmente desfrutando de um período de relativa calma."
 laamp_base_1041.tt.gold_rewards_depend_on_travellers:0 "#alert_trial O potencial [gold|E] que você ganha depende inteiramente de quais viajantes você encontra e assalta na estrada — você pode encontrar [dukes|E] exorbitantemente ricos, ou [courtiers|E] empobrecidos em peregrinação."
 laamp_base_1041.tt.haul_actual:0 "Você ganhou um total de [gold_i][task_contract.MakeScope.Var('haul_actual').GetValue|P0]"
 laamp_base_1041_contract_scheme:0 "Emboscar Viajantes"
 laamp_base_1041_contract_scheme_action:0 "Emboscar nas terras de"
 laamp_base_1041_contract_scheme_desc:0 "Quão perigosas podem ser algumas terras [contractors_possessive|E]! Eles fazem um pedido de ajuda e, em vez disso, algum [adventurer|E] empreendedor aparece e começa a emboscar todos os comerciantes gordos e caravanas suculentas que consegue encontrar.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_1041_contract_scheme_desc_general:0 "$laamp_base_1041_contract_scheme_desc$"
 laamp_base_1041_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_1041_desc:0 "[TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier|U] está atormentado por ladrões, fora da lei e vagabundos de todos os tipos. Lutadores proficientes são procurados #EMP urgentemente#!. Direcione todos os negócios ao [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier]."
 laamp_base_1041_desc_title:0 "Espadachins de confiança,"
 laamp_base_1041_failure_employer_modifier:0 "Estradas Seguras"
 laamp_base_1041_failure_employer_modifier_desc:0 "Apesar das melhores tentativas de certos criminosos de carreira, os caminhos deste condado permanecem bem guardados."
 laamp_base_1041_success_employer_modifier:0 "Viajantes Atacados"
 laamp_base_1041_success_employer_modifier_desc:0 "Seja coletor de impostos, peregrino ou comerciante, as estradas deste condado não são seguras para ninguém."
 laamp_base_2001_contract_scheme:0 "Coletar Impostos"
 laamp_base_2001_contract_scheme_action:0 "Coletar Impostos para"
 laamp_base_2001_contract_scheme_desc:0 "Os impostos são a alma de qualquer [realm|E]. Quando sua entrega se torna lenta, [contractors|E] podem solicitar mais #EMP exigentes#! coletores.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_2001_contract_scheme_desc_general:0 "$laamp_base_2001_contract_scheme_desc$"
 laamp_base_2001_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_2001_desc:0 "Indivíduos firmes são procurados para o trabalho honesto de coletar o imposto [TaskContract.GetEmployer.GetPrimaryTitle.GetTierAsNameNoTooltip|l] em nome do [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier]. Habilidade em lidar com plebeus obstinados é necessária."
 laamp_base_2001_desc_title:0 "Viajantes bem-educados de boa linhagem,"
 laamp_base_2011_contract_scheme:0 "Conduzir Censo"
 laamp_base_2011_contract_scheme_action:0 "Conduzir Censo para"
 laamp_base_2011_contract_scheme_desc:0 "É difícil administrar um [realm|E] quando você não sabe quem está #EMP dentro#! dele. [contractors|E] com esse problema frequentemente recorrem a terceiros neutros para inventariar seus súditos e, mais importante, a riqueza de seus súditos.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_2011_contract_scheme_desc_general:0 "$laamp_base_2011_contract_scheme_desc$"
 laamp_base_2011_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_2011_desc:0 "Os registros do [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTierPossessive] mostram lacunas substanciais. Viajantes instruídos de boa mente e corpo forte são desejados para realizar um censo, e serão reembolsados a partir dos rendimentos do censo."
 laamp_base_2011_desc_title:0 "Atenção, pesquisadores e magistrados:"
 laamp_base_2021_contract_scheme:0 "Construir Edifício"
 laamp_base_2021_contract_scheme_action:0 "Construir Edifício para"
 laamp_base_2021_contract_scheme_desc:0 "Muitos [contractors|E] descobrem que sua ambição por arquitetura supera sua habilidade — colocar o trabalho de construção em licitação é uma maneira fácil de compensar tais... excessos.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_2021_contract_scheme_desc_general:0 "$laamp_base_2021_contract_scheme_desc$"
 laamp_base_2021_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_2021_desc:0 "O [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] necessita de mãos competentes e artesãos para supervisionar um projeto de construção. Materiais e pagamento justo serão fornecidos."
 laamp_base_2021_desc_title:0 "Supervisor atento e de mente firme procurado,"
 laamp_base_2021_failure_employer_modifier:0 "Construção Malfeita"
 laamp_base_2021_failure_employer_modifier_desc:0 "A infraestrutura deste condado está em completa desordem, tornando a construção extremamente cara."
 laamp_base_2031_contract_scheme:0 "Resolver Disputa de Fronteira"
 laamp_base_2031_contract_scheme_action:0 "Arbitrar Fronteiras para"
 laamp_base_2031_contract_scheme_desc:0 "Fronteiras são poder, o que muitas vezes as torna contenciosas — quando uma disputa mesquinha entre pessoas importantes sai do controle, muitas vezes é mais eficaz para [contractors|E] contratar um terceiro neutro para verificar os fatos.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_2031_contract_scheme_desc_general:0 "$laamp_base_2031_contract_scheme_desc$"
 laamp_base_2031_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_2031_desc:0 "Um árbitro experiente é procurado pelo [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] para resolver uma disputa de fronteira. Educação em [TaskContract.GetEmployer.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] seria... útil. Mas até mesmo uma ajuda satisfatória será paga."
 laamp_base_2031_desc_title:0 "Viajantes de boa linhagem,"
 laamp_base_2031_failure_employer_modifier:0 "Ponto de Ebulição"
 laamp_base_2031_failure_employer_modifier_desc:0 "As tensões aqui aumentaram tanto que as pessoas passam mais tempo discutindo do que trabalhando."
 laamp_base_2031_success_employer_modifier:0 "Tudo Calmo"
 laamp_base_2031_success_employer_modifier_desc:0 "Apesar de problemas internos com as fronteiras exatas, os residentes deste condado estão atualmente contentes."
 laamp_base_2041_contract_scheme:0 "Imitar Coletor de Impostos"
 laamp_base_2041_contract_scheme_action:0 "Roubar Impostos de"
 laamp_base_2041_contract_scheme_desc:0 "Os impostos financiam o governante de qualquer [realm|E] — mas eles #EMP precisam#! mesmo? Quando um confidente fora da lei aparece com um selo oficial e músculos contratados, isso é #EMP tão#! diferente do oficial apropriado?$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_2041_contract_scheme_desc_general:0 "$laamp_base_2041_contract_scheme_desc$"
 laamp_base_2041_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_2041_desc:0 "[TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] lembra firmemente a todos sobre a iminente cobrança de impostos — pague prontamente assim que seu cobrador chegar. Qualquer e toda falta será severamente punida."
 laamp_base_2041_desc_title:0 "Todos os súditos de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier]"
 laamp_base_2041_failure_employer_modifier:0 "Funcionários Confiáveis"
 laamp_base_2041_failure_employer_modifier_desc:0 "Os súditos deste personagem sabem que, sem os selos adequados, ninguém que afirma ter um cargo realmente o possui."
 laamp_base_2041_success_employer_modifier:0 "Falsos Representantes"
 laamp_base_2041_success_employer_modifier_desc:0 "É um fato bem conhecido que os coletores de impostos deste personagem foram imitados antes, complicando sem fim seu trabalho."
 laamp_base_2071_failure_employer_modifier:0 "Trabalho de Reparo Malfeito"
 laamp_base_2071_failure_employer_modifier_desc:0 "As paredes de um grande assentamento neste condado caíram em ruínas e, pior, foram danificadas durante uma tentativa de reparo."
 laamp_base_2071_success_employer_modifier:0 "Muros Reforçados"
 laamp_base_2071_success_employer_modifier_desc:0 "Um importante assentamento aqui recentemente se dedicou a reforçar suas paredes."
 laamp_base_2076_failure_employer_modifier:0 "Cavalos Magros"
 laamp_base_2076_failure_employer_modifier_desc:0 "Esta comarca, por qualquer razão, produz cavalos notoriamente ruins de todos os tipos."
 laamp_base_2076_success_employer_modifier:0 "Cavalos de Qualidade"
 laamp_base_2076_success_employer_modifier_desc:0 "Os animais desta comarca são a inveja da região."
 laamp_base_3001_contract_scheme:0 "Espionagem Improvisada"
 laamp_base_3001_contract_scheme_action:0 "Relatar a"
 laamp_base_3001_contract_scheme_desc:0 "Relatórios recentes sobre eventos distantes de sua capital são frequentemente inestimáveis para [contractors|E]: o suficiente para valer a pena comprá-los de viajantes habilidosos.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_3001_contract_scheme_desc_general:0 "$laamp_base_3001_contract_scheme_desc$"
 laamp_base_3001_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_3001_desc:0 "O [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] deseja que se saiba que [TaskContract.GetEmployer.GetSheHe] está convidando revelações úteis de todo o [TaskContract.GetEmployer.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip], e além."
 laamp_base_3001_desc_title:0 "Escutadores confiáveis e estrangeiros empreendedores,"
 laamp_base_3001_success_employer_modifier:0 "Inteligência Robusta"
 laamp_base_3001_success_employer_modifier_desc:0 "Este personagem recebeu relatórios detalhados sobre os acontecimentos em outros reinos."
 laamp_base_3011_contract_scheme:0 "Matar Inimigo"
 laamp_base_3011_contract_scheme_action:0 "Matar"
 laamp_base_3011_contract_scheme_desc:0 "Há momentos em que um [contractor|E] precisa que alguém esteja morto, mas não arrisca orquestrar isso sozinho ou está muito preocupado com outros assuntos. Felizmente, o assassinato pode ser facilmente terceirizado para o tipo certo de pessoas.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_3011_contract_scheme_desc_general:0 "$laamp_base_3011_contract_scheme_desc$"
 laamp_base_3011_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_3011_desc:0 "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] oferece uma recompensa abundante para mãos de caráter inquestionável e experiência comprovada para trabalho delicado e exigente."
 laamp_base_3011_desc_title:0 "Sellswords honestos de firme vontade,"
 laamp_base_3021_contract_scheme:0 "Abduzir Inimigo"
 laamp_base_3021_contract_scheme_action:0 "Abduzir"
 laamp_base_3021_contract_scheme_desc:0 "A prisão pode ser uma experiência sóbria e informativa para descontentes e rivais, assim como uma experiência lucrativa ou gratificante para seu carcereiro. O suficiente para valer o risco de pagar um terceiro para organizar uma visita, pelo menos.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_3021_contract_scheme_desc_general:0 "$laamp_base_3021_contract_scheme_desc$"
 laamp_base_3021_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_3021_desc:0 "Caçadores discretos e habilidosos são procurados pelo [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] para capturar presas incomuns e retorná-las vivas. Uma remuneração generosa está em oferta."
 laamp_base_3021_desc_title:0 "Manipuladores resolutos de animais problemáticos,"
 laamp_base_3031_contract_scheme:0 "Queimar Propriedade"
 laamp_base_3031_contract_scheme_action:0 "Cometer Incêndio Florestal para"
 laamp_base_3031_contract_scheme_desc:0 "A coisa maravilhosa sobre um edifício desatendido é que, com esforço suficiente, eles #EMP sempre#! queimam. Uma excelente ferramenta para [contractors|E] que precisam enviar uma mensagem, mas simplesmente desejam disparar e esquecer.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_3031_contract_scheme_desc_general:0 "$laamp_base_3031_contract_scheme_desc$"
 laamp_base_3031_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_3031_desc:0 "Uma remuneração generosa é oferecida para limpeza urgente do solo. A confidencialidade é uma necessidade. Apressa-se para o [TaskContract.GetEmployer.GetPrimaryTitle.GetAdjectiveNoTooltip] [TaskContract.GetEmployer.GetTitleAsNamePossessiveNoTooltip] [TaskContract.GetEmployer.Custom('ResidenceBuilding')|l]."
 laamp_base_3031_desc_title:0 "Itinerantes diligentes de caráter adequado,"
 laamp_base_3041.tt.chance_for_more:0 "Se desejar, você pode tentar #P roubar ainda mais [gold|E]#!"
 laamp_base_3041_contract_scheme:0 "Roubo do Tesouro"
 laamp_base_3041_contract_scheme_action:0 "Roubar o Tesouro de"
 laamp_base_3041_contract_scheme_desc:0 "Alguns [contractors|E] são simplesmente tolos sinalizando sua abundância de riqueza — riqueza que é muito mais fácil de extrair diretamente do que por meio de algum #EMP trabalho#!.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_3041_contract_scheme_desc_general:0 "$laamp_base_3041_contract_scheme_desc$"
 laamp_base_3041_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_3041_desc:0 "[TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] lembra #EMP a todos#! sobre as punições por roubo ou conspiração para cometer roubo, e as recompensas para aqueles suspeitos de tal. Apenas #EMP eu#! posso acessar o tesouro."
 laamp_base_3041_desc_title:0 "Todos os viajantes dentro, e súditos de, [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier]"
 laamp_base_3041_failure_employer_modifier:0 "Tesouro Protegido"
 laamp_base_3041_failure_employer_modifier_desc:0 "Este personagem conseguiu repelir uma tentativa de roubo de sua prata acumulada."
 laamp_base_3041_success_employer_modifier:0 "Tesouro Roubado"
 laamp_base_3041_success_employer_modifier_desc:0 "Sussurros ao vento dizem que este personagem não consegue manter seu dinheiro seguro."
 laamp_base_3661_stole_dogs_modifier:0 "Melhor da Raça"
 laamp_base_3661_stole_dogs_modifier_desc:0 "Este personagem tem tantos, tantos, #EMP tantos#! cães finos à sua disposição."
 laamp_base_4001_contract_scheme:0 "Transcrever Textos"
 laamp_base_4001_contract_scheme_action:0 "Escrever para"
 laamp_base_4001_contract_scheme_desc:0 "A arte de copiar e traduzir manuscritos pode ser ingrata, mesmo em [realms|E] eruditos, o trabalho potencial facilmente supera o número de escribas qualificados. Assim, um viajante educado oferece [task_contracts|E] uma oportunidade valiosa para reproduzir um pedido especial.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_4001_contract_scheme_desc_general:0 "$laamp_base_4001_contract_scheme_desc$"
 laamp_base_4001_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_4001_desc:0 "Escritores bem-letrados são procurados para copiar textos de [TaskContract.GetEmployer.GetCulture.GetNameNoTooltip]. O [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] promete justo pagamento por trabalho pontual."
 laamp_base_4001_desc_title:0 "Vocês que desejam preservar o conhecimento"
 laamp_base_4001_failure_employer_modifier:0 "Registros Confusos"
 laamp_base_4001_failure_employer_modifier_desc:0 "Algum incompetente idiota interferiu nos arquivos deste personagem, complicando sua administração."
 laamp_base_4001_success_employer_modifier:0 "Documentos em Ordem"
 laamp_base_4001_success_employer_modifier_desc:0 "O papel pode ser caro, mas a burocracia ainda é essencial, e este personagem tem montanhas dela."
 laamp_base_4011_contract_scheme:0 "Resolver Disputas Teológicas"
 laamp_base_4011_contract_scheme_action:0 "Arbitrar Teologia para"
 laamp_base_4011_contract_scheme_desc:0 "Disputas sobre doutrinas podem ser extremamente específicas, até interpretações exatas de palavras singulares, e curiosamente vagas, como discutir a incompatibilidade mútua de tradições antigas sobrepostas. Quando tais disputas sagradas começam a se intensificar, muitos [contractors|E] preferem enviar um terceiro para arbitrar em seu lugar.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_4011_contract_scheme_desc_general:0 "$laamp_base_4011_contract_scheme_desc$"
 laamp_base_4011_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_4011_desc:0 "Um teólogo erudito será generosamente recompensado por resolver disputas religiosas locais sobre a doutrina [TaskContract.GetEmployer.GetFaith.GetAdjective].\n\nAtraia a atenção do [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier], mas apenas se você for um estudioso da gravidade."
 laamp_base_4011_desc_title:0 "Discípulos leais de [TaskContract.GetEmployer.GetFaith.KnowledgeGodName],"
 laamp_base_4021_contract_scheme:0 "Criar Obra de Aprendizado"
 laamp_base_4021_contract_scheme_action:0 "Estudar para"
 laamp_base_4021_contract_scheme_desc:0 "Viajantes eruditos trazem consigo um certo senso de misticismo, muitas vezes até um toque do exótico — contratantes [contractors|E] engenhosos frequentemente tentam capturar algumas dessas sabedorias passageiras encomendando pequenos livros de aforismos e contos moralizantes.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_4021_contract_scheme_desc_general:0 "$laamp_base_4021_contract_scheme_desc$"
 laamp_base_4021_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_4021_desc:0 "Escritores de toda a terra são direcionados ao [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTierPossessive] [TaskContract.GetEmployer.Custom('ResidenceBuilding')|l] para trabalho de escrita lucrativo."
 laamp_base_4021_desc_title:0 "Eruditos de letras belas,"
 laamp_base_4021_failure_employer_modifier:0 "Patrono Fora de Moda"
 laamp_base_4021_failure_employer_modifier_desc:0 "Este personagem é conhecido por gastar seu dinheiro em drivel confuso."
 laamp_base_4021_success_employer_modifier:0 "Texto da Moda"
 laamp_base_4021_success_employer_modifier_desc:0 "Uma frivolidade fantasiosa encomendada por este personagem é atualmente bastante popular na corte."
 laamp_base_4031_contract_scheme:0 "Solicitar Caridade"
 laamp_base_4031_contract_scheme_action:0 "Suplicar a"
 laamp_base_4031_contract_scheme_desc:0 "Oferecer presentes e moedas a estudiosos que passam faz com que [contractors|E] pareçam generosos e eruditos — mesmo que o estudioso em questão lhes dê um pouco de #EMP incentivo#! primeiro.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_4031_contract_scheme_desc_general:0 "$laamp_base_4031_contract_scheme_desc$"
 laamp_base_4031_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_4031_desc:0 "Que se saiba entre vocês: o [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] oferece patrocínio [TaskContract.GetEmployer.GetFaith.GetAdjectiveNoTooltip] àqueles que são piedosos, cultos ou sábios o suficiente para merecê-lo. Informe-se em [TaskContract.GetEmployer.Custom('ResidenceBuilding')|l]."
 laamp_base_4031_desc_title:0 "Pessoas justas e santas & mendigos lamentáveis,"
 laamp_base_4041_contract_scheme:0 "Vender Talismãs"
 laamp_base_4041_contract_scheme_action:0 "Oferecer Bijuterias a"
 laamp_base_4041_contract_scheme_desc:0 "Quem pode dizer o que é magia, o que é sagrado e o que é exótico? Se um [contractor|E] for tolo o suficiente para acreditar nisso, e #EMP pagar#! por isso, então isso é o suficiente. Provavelmente.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_4041_contract_scheme_desc_general:0 "$laamp_base_4041_contract_scheme_desc$"
 laamp_base_4041_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_4041_desc:0 "Você tem um olhar para o verdadeiro valor das raridades [TaskContract.GetEmployer.GetFaith.GetAdjectiveNoTooltip]? O [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] oferece pagamento justo — #EMP se#! os bens forem genuínos."
 laamp_base_4041_desc_title:0 "[TaskContract.GetEmployer.GetWomenMen] [Select_CString( TaskContract.IsFemale, 'Companheiras', 'Companheiros' )] do saber!"
 laamp_base_4041_failure_employer_modifier:0 "Padrões Sagrados"
 laamp_base_4041_failure_employer_modifier_desc:0 "Este personagem é conhecido por adotar uma postura firme contra relíquias falsas."
 laamp_base_4041_success_employer_modifier:0 "Divindade Falsificada"
 laamp_base_4041_success_employer_modifier_desc:0 "De talismãs a relíquias, é bem sabido que se você quiser algo sagrado, pode comprá-lo no reino deste personagem."
 laamp_base_5001_failure_employer_modifier:0 "Selvageria em Liberdade"
 laamp_base_5001_failure_employer_modifier_desc:0 "As bestas se reproduzem livremente e vagam ferozmente aqui, colocando em risco vidas e membros."
 laamp_base_5001_success_employer_modifier:0 "Animais Eliminados"
 laamp_base_5001_success_employer_modifier_desc:0 "A população animal deste condado está completamente sob controle."
 laamp_base_5011_failure_employer_modifier:0 "Em Fumaça"
 laamp_base_5011_failure_employer_modifier_desc:0 "Os investimentos aqui estão em grande risco de se tornarem lenha."
 laamp_base_5011_success_employer_modifier:0 "Confidente dos Comerciantes"
 laamp_base_5011_success_employer_modifier_desc:0 "A classe mercantil aqui sabe que suas propriedades estão a salvo de danos."
 laamp_base_5021_failure_employer_modifier:0 "Fuga Apertada"
 laamp_base_5021_failure_employer_modifier_desc:0 "O último encontro deste personagem com a morte foi #EMP próximo#!, e o próximo provavelmente será ainda mais próximo."
 laamp_base_5021_success_employer_modifier:0 "Bem Protegido"
 laamp_base_5021_success_employer_modifier_desc:0 "Este personagem está bem protegido contra ameaças de qualquer tipo."
 laamp_base_5031_contract_scheme:0 "Roubar Animais"
 laamp_base_5031_contract_scheme_action:0 "Roubar de"
 laamp_base_5031_contract_scheme_desc:0 "Rebanhos de cavalos, gado, até mesmo cabras ou ovelhas: animais roubados são incrivelmente lucrativos para aqueles ousados o suficiente para levá-los, e quando alguns [contractors|E] tornam isso tão fácil...$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_5031_contract_scheme_desc_general:0 "$laamp_base_5031_contract_scheme_desc$"
 laamp_base_5031_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_5031_desc:0 "Seu [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] lhes lembra, mais uma vez, que o roubo de gado #EMP será#! punido severamente, não importa a contagem ou a razão. Vocês foram avisados."
 laamp_base_5031_desc_title:0 "Pessoas de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier],"
 laamp_base_5031_failure_employer_modifier:0 "Rebanhos Protegidos"
 laamp_base_5031_failure_employer_modifier_desc:0 "O gado aqui está a salvo até mesmo dos criminosos mais empreendedores."
 laamp_base_5031_success_employer_modifier:0 "Gado Desaparecido"
 laamp_base_5031_success_employer_modifier_desc:0 "O governante deste condado não consegue garantir nem a segurança de seus rebanhos."
 laamp_base_5041_failure_employer_modifier:0 "Selvas Protegidas"
 laamp_base_5041_failure_employer_modifier_desc:0 "Os caçadores furtivos serão enforcados."
 laamp_base_5041_success_employer_modifier:0 "Um Pouco Cortado"
 laamp_base_5041_success_employer_modifier_desc:0 "Os animais neste condado são... menos do que o esperado, por algum motivo."
 laamp_base_5051_contract_scheme:0 "Assaltar a Cidadania Rica"
 laamp_base_5051_contract_scheme_action:0 "Pegar a Cidadania de"
 laamp_base_5051_contract_scheme_desc:0 "[contractors|E] com capitais particularmente ricos produzem [courtiers|E] abastados. Um ataque em um beco permite que [adventurers|E] transfiram essa riqueza para outro lugar.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_5051_contract_scheme_desc_general:0 "$laamp_base_5051_contract_scheme_desc$"
 laamp_base_5051_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_5051_desc:0 "Sejam avisados que estamos enfrentando uma #EMP praga#! de pequenos furtos. Leve um firme bastão com você ao caminhar pelas ruas e fique dentro de casa após o anoitecer — o [TaskContract.GetEmployer.GetTitleAsName] lidará com esses reprováveis."
 laamp_base_5051_desc_title:0 "Bons cidadãos de [TaskContract.GetEmployer.GetCapitalLocation.GetTitle.GetBaseNameNoTier],"
 laamp_base_6001_contract_scheme:0 "Proteger os Inocentes"
 laamp_base_6001_contract_scheme_action:0 "Proteger os súditos de"
 laamp_base_6001_contract_scheme_desc:0 "As estradas estão cheias de perigos. Bandidos, animais e mau tempo afetaram os súditos de [contractor_possessive|E], e eles estão implorando por ajuda.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_6001_contract_scheme_desc_general:0 "$laamp_base_6001_contract_scheme_desc$"
 laamp_base_6001_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_6001_desc:0 "Os trabalhadores de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] precisam de ajuda. O [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] oferece recompensas generosas a aventureiros altruístas."
 laamp_base_6001_desc_title:0 "Proteja os fracos!"
 laamp_base_6011_contract:0 "$laamp_base_6011_contract_scheme$"
 laamp_base_6011_contract_scheme:0 "Resgatar um sujeito justo"
 laamp_base_6011_contract_scheme_action:0 "Resgatar um sujeito justo de"
 laamp_base_6011_contract_scheme_desc:0 "A selva não conhece misericórdia. Encontre e resgate o súdito indefeso de [contractor_possessive|E].$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_6011_contract_scheme_desc_general:0 "$laamp_base_6011_contract_scheme_desc$"
 laamp_base_6011_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_6011_desc:0 "Um dos mais justos cortesãos de [TaskContract.GetEmployer.GetTitledFirstNamePossessiveNoTooltip] não retornou de uma incursão nas florestas de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier]. O tribunal do [TaskContract.GetEmployer.GetTitleAsNamePossessiveNoTooltip] oferece uma recompensa ansiosamente."
 laamp_base_6011_desc_title:0 "[TaskContract.GetEmployer.Custom('KnightCulturePluralNoTooltip')|U] de verdadeira virtude!"
 laamp_base_6011_request:0 "Esta [task_contract|E] requer que você complete um [scheme|E] de [GetScheme('laamp_base_6011_contract_scheme').GetTypeName]"
 laamp_base_6012_success_employer_modifier:0 "Inocente Resgatado"
 laamp_base_6012_success_employer_modifier_desc:0 "Este personagem pagou a um aventureiro cavalheiresco para resgatar um de seus súditos mais justos de um animal perigoso."
 laamp_base_6021_contract:0 "$laamp_base_6021_contract_scheme$"
 laamp_base_6021_contract_scheme:0 "Atuar em uma Peça"
 laamp_base_6021_contract_scheme_action:0 "Atuar na Peça de"
 laamp_base_6021_contract_scheme_desc:0 "As pessoas estão ansiosas para encontrar um #EMP verdadeiro#! cavaleiro. O [contractor|E] precisa de um verdadeiro herói.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_6021_contract_scheme_desc_general:0 "$laamp_base_6021_contract_scheme_desc$"
 laamp_base_6021_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_6021_desc:0 "O povo de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] está organizando uma peça que imita velhas histórias heroicas. [TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] está desesperado para encontrar um cavaleiro cavalheiresco que satisfaça seus desejos."
 laamp_base_6021_desc_title:0 "Um herói é procurado,"
 laamp_base_6021_request:0 "Esta [task_contract|E] requer que você complete um [scheme|E] de [GetScheme('laamp_base_6021_contract_scheme').GetTypeName]"
 laamp_base_6021_success_employer_modifier:0 "Peça de Cavalheirismo"
 laamp_base_6021_success_employer_modifier_desc:0 "Este personagem patrocinou um aventureiro errante para atuar em uma peça e satisfazer as demandas da multidão."
 laamp_base_6031_contract:0 "$laamp_base_6031_contract_scheme$"
 laamp_base_6031_contract_scheme:0 "Realizar um Ato de Armas"
 laamp_base_6031_contract_scheme_action:0 "Realizar um Ato de Armas para"
 laamp_base_6031_contract_scheme_desc:0 "Aventureiro valoroso necessário para defender uma passagem de ponte. O [contractor|E] oferece recompensas generosas.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_6031_contract_scheme_desc_general:0 "$laamp_base_6031_contract_scheme_desc$"
 laamp_base_6031_contract_scheme_desc_success:0 "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_6031_desc:0 "A ponte de [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] permanece desprotegida. Um demonstração de força é necessária para manter os bandidos afastados. [TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] recompensará quem os dissuadir."
