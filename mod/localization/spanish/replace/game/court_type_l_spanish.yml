 DIPLOMATIC_COURT_ACCEPTANCE_INCREASE_REASON:0 "[recipient.GetShortUIName|U] está [Select_CString( recipient.IsFemale, 'impressionada', 'impressionado' )] com a [court_grandeur|E] da sua $court_diplomatic$: $VALUE|+=0$"
 INTRIGUE_COURT_AGENT_ACCEPTANCE_REASON:0 "Sua $court_intrigue$ é persuasivo: $VALUE|+=0$"
 TT_COURT_TYPE_BUTTON:0 "#T [court_type|E]: [CourtTypeWindow.GetActiveCourtTypeItem.GetNameNoTooltip]\n#!#I Clique para mudar#!"
 accept_culture_task_more_effective_desc:0 "Eficácia de [accept_culture|E]: #P +[EmptyScope.ScriptValue('court_administrative_steward_task_bonus')|0]%#!"
 court_administrative:0 "Corte Administrativa"
 court_administrative_desc:0 "#low Somente uma corte eficiente e bem gerida fará com que nosso reino prospere. \n\nOs cortesões adquirem as características [GetTrait('administrative_court_1').GetName(GetNullCharacter )]#!"
 court_administrative_tooltip_desc:0 "Uma $court_administrative$ é uma corte focada no desenvolvimento do reino."
 court_diplomatic:0 "Corte Diplomática"
 court_diplomatic_acceptance_bonus_desc:0 "Aumento de #V na aceitação de $offer_vassalization_interaction$#! Aceitação escalada pela [grandeur|E]"
 court_diplomatic_desc:0 "#low A Diplomacia é fundamental para conquistar o respeito de nossos pares e manter o reino em paz. Um vassalo satisfeito é um vassalo leal. \n\nOs cortesões adquirem as características [GetTrait('diplomatic_court_1').GetName( GetNullCharacter )]#!"
 court_diplomatic_tooltip_desc:0 "Em uma $court_diplomatic$, há muita ênfase em relacionamentos e na resolução pacífica de conflitos."
 court_intrigue:0 "Corte de Intrigas"
 court_intrigue_agent_acceptance_desc:0 "Aceitação aumentada dos [agents|E] para [hostile_schemes|E]"
 court_intrigue_desc:0 "#low Deixar as pessoas na corte sem supervisão é perigoso, e devemos garantir que ninguém possa fazer nada de errado sem que saibamos. \n\nOs cortesões adquirem as características [GetTrait('intrigue_court_1').GetName( GetNullCharacter )]#!"
 court_intrigue_tooltip_desc:0 "Em uma $court_intrigue$, você deve estar atento; um segredo pode ser tão mortal quanto uma faca na noite, e nessa corte ambos são comuns."
 court_nomadic:0 "Corte Nômade"
 court_nomadic_desc:0 "#low Nossa corte cavalga com a força de mil cascos, onde o arco e a lâmina reinam supremas. A glória é conquistada através da guerra, e nosso povo prospera com os despojos da batalha. \n\nCortesãos ganham os traços [GetTrait('warlike_court_1').GetName( GetNullCharacter )].#!"
 court_nomadic_tooltip_desc:0 "Bravura marcial e resiliência são valorizadas em uma $court_nomadic$."
 court_scholarly:0 "Corte Acadêmica"
 court_scholarly_desc:0 "#low Uma corte é toda sobre atrair mentes cultas e pessoas de habilidade excepcional. \n\nOs cortesões adquirem as características [GetTrait('scholarly_court_1').GetName( GetNullCharacter )]#!"
 court_scholarly_tooltip_desc:0 "Conhecimento e estudo diligente são valorizados em uma $court_scholarly$."
 court_tribal:0 "Corte Tribal"
 court_tribal_desc:0 "#low Na corte, o poder é o que vale - e os salões devem ser enfeitados com saques e pilhagens! \n\nOs cortesões adquirem as características [GetTrait('warlike_court_1').GetName( GetNullCharacter )]#!"
 court_tribal_tooltip_desc:0 "A bravura marcial e a resiliência são valorizadas em uma $court_tribal$."
 court_warlike:0 "Corte Guerreira"
 court_warlike_desc:0 "#low Uma demonstração de força é a única maneira de comandar admiração e respeito! Nossos cavaleiros e soldados são famosos por sua destreza. \n\nOs cortesões adquirem as características [GetTrait('warlike_court_1').GetName( GetNullCharacter )]#!"
 court_warlike_tooltip_desc:0 "Em uma $court_warlike$, um corpo forte e uma mente estratégica são altamente valorizados."
 scholarly_inspiration_discount_desc:0 "Custo de [inspiration|E]: #P -[EmptyScope.ScriptValue('court_scholarly_inspiration_discount')|0]%#!"
 scholarly_inspiration_frequency_desc:0 "[characters|E] [inspired|E] chegam à [court|E] com mais frequência"
 support_schemes_task_more_effective_desc:0 "Eficácia de $task_support_schemes$: #P +[EmptyScope.ScriptValue('court_intrigue_spymaster_task_bonus')|0]%#!"
