 SETTING_ADAPTIVE_FRAMERATE:0 "Taxa de quadros adaptável"
 SETTING_ADAPTIVE_FRAMERATE_TOOLTIP:0 "#T $SETTING_ADAPTIVE_FRAMERATE$#!\nReduz a taxa de atualização da tela se a velocidade de atualização do jogo diminuir, para melhorar o desempenho da jogabilidade."
 SETTING_ADVANCED_SHADERS:0 "Efeitos Avançados de Shader"
 SETTING_ADVANCED_SHADERS_TOOLTIP:0 "#T Efeitos Avançados de Shader\n#! Essa opção vai habilitar efeitos avançados de shader.\n\n Desliga-la pode aumentar o desempenho ao custo de fazer alguns efeitos (como terreno e água) aparentarem pior"
 SETTING_Ambience:0 "Ambientação"
 SETTING_Ambience_TOOLTIP:0 "#T Ambience Volume\n#!Define o volume da ambientação."
 SETTING_BEAUTIFY_DEAD:0 "Beleza a personagens falecidos"
 SETTING_BEAUTIFY_DEAD_TOOLTIP:0 "#T $SETTING_BEAUTIFY_DEAD$#!\nAlterna a representação de personagens falecidos: no auge de sua vida ou consumidos pela idade, doença e ferimentos."
 SETTING_COURT_SCENE_LOW_PRIORITY_CHARACTERS:0 "Personagens de fundo da corte real"
 SETTING_COURT_SCENE_LOW_PRIORITY_CHARACTERS_TOOLTIP:0 "#T $SETTING_RESET_CAMERA_ROTATION$#!\nDetermina se a cena 3D da corte real deve exibir personagens de fundo menos importantes."
 SETTING_DEBUG_SAVES:0 "Número de salvamentos com debug"
 SETTING_DISABLED_HINTS:0 "Dicas Desativadas"
 SETTING_HAS_CLOUD_SHADOW_ENABLED:0 "Sombra das nuvens"
 SETTING_HAS_CLOUD_SHADOW_ENABLED_TOOLTIP:0 "#T $SETTING_HAS_CLOUD_SHADOW_ENABLED$#!\nDefine se os efeitos de sombra das nuvens devem ser exibidos no terreno"
 SETTING_HAS_TREE_DITHERING_ENABLED:0 "Suavização das árvores"
 SETTING_HAS_TREE_DITHERING_ENABLED_TOOLTIP:0 "#T $SETTING_HAS_TREE_DITHERING_ENABLED$#!\nDefine se os efeitos de suavização devem ser aplicados às árvores para suavizar as bordas"
 SETTING_HIDE_COAST_BORDER_ON_ZOOM:0 "Fronteiras Costais"
 SETTING_HIDE_COAST_BORDER_ON_ZOOM_TOOLTIP:0 "#T $SETTING_HIDE_COAST_BORDER_ON_ZOOM$#!\n Essa opção vai controlar quando as fronterias costais do reino devem ser mostradas.\n Se $BASED_ON_ZOOM_LEVEL$ então elas serão escondidas baseado no nível de detalhe do zoom.\n\n Escolhendo $ALWAYS_SHOW$ ou $ALWAYS_HIDE$ pode aumentar o desempenho ao custo que as fronteiras costais do reino não desapareçam de forma dinâmica."
 SETTING_HIDE_MAP_TABLE:0 "Ocultar Mesa do Mapa"
 SETTING_HIDE_MAP_TABLE_TOOLTIP:0 "#T $SETTING_HIDE_MAP_TABLE$#!\nOculta a geometria da mesa do mapa."
 SETTING_HUD_SKIN:0 "Tema do HUD"
 SETTING_HUD_SKIN_TOOLTIP:0 "#T $SETTING_HUD_SKIN$#!\nDefine o tema visual da interface do HUD - a interface em 2D exibida na tela principal do jogo.\n\nSe selecionado $hud_skin_auto$, o HUD irá mudar dependendo da cultura, fé e capital do reino do jogador."
 SETTING_MAP_BRIGHTNESS:0 "Brilho do mapa em papel"
 SETTING_MAP_BRIGHTNESS_TOOLTIP:0 "#T $SETTING_MAP_BRIGHTNESS$#!\nDetermina a intensidade do brilho do mapa em papel"
 SETTING_MAP_HIGHLIGHT:0 "Destaque do cursor no mapa"
 SETTING_MAP_HIGHLIGHT_TOOLTIP:0 "#T $SETTING_MAP_HIGHLIGHT$#!\nDetermina a intensidade do destaque do cursor no mapa"
 SETTING_MAP_OVERLORD_HIGHLIGHT:0 "Destaque do Soberano no Mapa"
 SETTING_MAP_OVERLORD_HIGHLIGHT_TOOLTIP:0 "#T $SETTING_MAP_OVERLORD_HIGHLIGHT$#!\nDetermina quando o suserano principal de um reino é destacado, ao selecionar um reino."
 SETTING_MAP_TABLE_STYLE:0 "Estilo da Tabela de Mapa"
 SETTING_MAP_TABLE_STYLE_TOOLTIP:0 "#T $SETTING_MAP_TABLE_STYLE$#!\nDefine o estilo visual da tabela de mapa - o mapa e o ambiente 3D mostrados ao afastar o zoom.\n\nSe $map_table_style_auto$ for selecionado, um estilo de tabela de mapa será escolhido com base no Jogador atual e seu personagem."
 SETTING_PAPER_MAP_STYLE:0 "Estilo do mapa em papel"
 SETTING_PAPER_MAP_STYLE_TOOLTIP:0 "#T $SETTING_PAPER_MAP_STYLE$#!\nDefine o estilo do mapa exibido quando o mapa está afastado.\n\nSe $paper_map_style_auto$ estiver selecionado, o mapa em papel seguirá o estilo usado por \"$SETTING_MAP_TABLE_STYLE$\"."
 SETTING_REACTIVE_TUTORIAL:0 "Mostrar Aviso Reativo"
 SETTING_REACTIVE_TUTORIAL_TOOLTIP:0 "#T $SETTING_REACTIVE_TUTORIAL$#!\n Define se o jogo deve mostrar Avisos de tutorial reagindo à como você joga. Útil para jogadores novos ao Crusader Kings III."
 SETTING_RESET_CAMERA_ROTATION:0 "Redefinição de rotação de câmera"
 SETTING_RESET_CAMERA_ROTATION_TOOLTIP:0 "#T $SETTING_RESET_CAMERA_ROTATION$#!\nDetermina se a câmera deve ser automaticamente redefinida para a posição padrão após ser girada pelo usuário"
 SETTING_RICH_PRESENCE:0 "Presença Rica"
 SETTING_RICH_PRESENCE_TOOLTIP:0 "#T $SETTING_RICH_PRESENCE$#!\nMostra informações sobre a sua sessão de jogo atual para seus amigos, se a sua plataforma suportar."
 SETTING_ROYAL_COURT_ANIMATE_CAMERA_IDLE:0 "Passeio de Câmara Ociosa na Corte Real"
 SETTING_ROYAL_COURT_ANIMATE_CAMERA_IDLE_TOOLTIP:0 "#T $SETTING_ROYAL_COURT_ANIMATE_CAMERA_IDLE$#!\nDetermina se a câmera na Corte Real deve passear suavemente pela sua corte quando ociosa.\n\nSe Personagens Animados estiver desativado, esta configuração não terá efeito."
 SETTING_ROYAL_COURT_ANIMATE_CAMERA_TRANSITION:0 "Transições suaves na Corte Real"
 SETTING_ROYAL_COURT_ANIMATE_CAMERA_TRANSITION_TOOLTIP:0 "#T $SETTING_ROYAL_COURT_ANIMATE_CAMERA_TRANSITION$#!\nDetermina se a câmera na Corte Real deve se mover suavemente para uma nova localização.\n\nSe Personagens Animados estiver desativado, esta configuração não terá efeito."
 SETTING_SHOW_CONTENT_SOURCE:0 "Mostrar DLC do evento"
 SETTING_SHOW_CONTENT_SOURCE_TOOLTIP:0 "#T $SETTING_SHOW_CONTENT_SOURCE$#!\nDefine se os eventos mostrarão de qual DLC eles são provenientes."
 SETTING_SHOW_DETAILED_BARTER_MAP_ICON:0 "Ícones detalhados de [barter|E]"
 SETTING_SHOW_DETAILED_BARTER_MAP_ICON_TOOLTIP:0 "#T $SETTING_SHOW_DETAILED_RAID_MAP_ICON$#!\nDefine se os ícones de [barter|E] no mapa devem exibir ícones simplificados ou detalhados\n\n#I Se ativado, segure Alt para exibir todas as possessões com saque nas quais você pode [barter|E].#!"
 SETTING_SHOW_DETAILED_RAID_MAP_ICON:0 "Ícones detalhados de [raid|E]"
 SETTING_SHOW_DETAILED_RAID_MAP_ICON_TOOLTIP:0 "#T $SETTING_SHOW_DETAILED_RAID_MAP_ICON$#!\nDefine se os ícones de [raid|E] no mapa devem exibir ícones simplificados ou detalhados\n\n#I Se ativado, segure Alt para exibir todas as possessões com saque que você pode [raid|E].#!"
 SETTING_SHOW_DISTURBING_PORTRAIT_MODIFIERS:0 "Mostrar doenças e ferimentos gráficos"
 SETTING_SHOW_DISTURBING_PORTRAIT_MODIFIERS_TOOLTIP:0 "#T $SETTING_SHOW_DISTURBING_PORTRAIT_MODIFIERS$#!\nDefine se doenças e ferimentos gráficos serão visíveis nos retratos dos personagens."
 SETTING_SHOW_EPIDEMIC_MAP_GRAPHICS:0 "Gráficos de Doenças"
 SETTING_SHOW_EPIDEMIC_MAP_GRAPHICS_TOOLTIP:0 "#T $SETTING_SHOW_EPIDEMIC_MAP_GRAPHICS$#!\nDefine se os efeitos das doenças devem ser mostrados no mapa."
 SETTING_SHOW_EVENT_NAME_PLATES:0 "Mostrar Placas de Nome de Evento"
 SETTING_SHOW_EVENT_NAME_PLATES_TOOLTIP:0 "#T $SETTING_SHOW_EVENT_NAME_PLATES$#!\nMostra nomes de personagens, relações e opiniões nos eventos.\nAlém disso, as dicas de ferramenta dos personagens aparecerão sobre as placas de nome em vez dos retratos, facilitando a seleção.\nAplica-se apenas a eventos comuns, desativado para duelos e atividades."
 SETTING_SHOW_EVENT_SHORTCUTS:0 "Mostrar Atalhos de Opções de Evento"
 SETTING_SHOW_EVENT_SHORTCUTS_TOOLTIP:0 "#T $SETTING_SHOW_EVENT_SHORTCUTS$#!\nDefine onde mostrar os números de atalho para opções de evento.\nAtalhos:\n#i Shift+número para selecionar uma opção\nAlt+número para pré-visualizar e confirmar uma\nAlt+E para pré-visualizar todas as opções#!"
 SETTING_SHOW_LEGEND_MAP_GRAPHICS:0 "Gráficos de Lendas"
 SETTING_SHOW_LEGEND_MAP_GRAPHICS_TOOLTIP:0 "#T $SETTING_SHOW_LEGEND_MAP_GRAPHICS$#!\nDefine se os efeitos das lendas devem ser mostrados no mapa."
 SETTING_SHOW_NUDITY:0 "Mostrar nudez"
 SETTING_SHOW_NUDITY_TOOLTIP:0 "#T $SETTING_SHOW_NUDITY$#!\nDefine se os personagens podem ser mostrados nus."
 SETTING_SHOW_SUGGESTIONS:0 "Mostrar Sugestões"
 SETTING_SHOW_SUGGESTIONS_TOOLTIP:0 "#T $SETTING_SHOW_SUGGESTIONS$#!\n Define se o jogo deve sugerir algo para fazer em intervalos regulares. Útil para jogadores novos ao Crusader Kings III."
 SETTING_STREAM_ILLUSTRATIONS:0 "Transmissão de Ilustrações"
 SETTING_STREAM_ILLUSTRATIONS_TOOLTIP:0 "#T $SETTING_STREAM_ILLUSTRATIONS$\n#!Mantém ilustrações carregadas apenas quando visíveis para melhorar o tempo de carregamento inicial e reduzir o uso de memória."
 SETTING_STREAM_MESHES:0 "Transmissão de Malhas"
 SETTING_STREAM_MESHES_TOOLTIP:0 "#T $SETTING_STREAM_MESHES$\n#!Atrasa o carregamento de malhas 3D até que sejam necessárias para melhorar o tempo de carregamento inicial e reduzir o uso de memória."
 SETTING_STYLIZE_DEAD:0 "Estilizar personagens falecidos"
 SETTING_STYLIZE_DEAD_TOOLTIP:0 "#T $SETTING_STYLIZE_DEAD$#!\nDefine se os retratos idealizados de personagens falecidos usam um estilo \"pintado\", mostrando de relance que essa não era sua aparência real.\n\nAplica-se apenas enquanto $SETTING_BEAUTIFY_DEAD$ estiver ativado."
 SETTING_Sound_Effects:0 "Todos os Efeitos Sonoros"
 SETTING_Sound_Effects_TOOLTIP:0 "#T Sound Effects Volume\n#!Define o volume de TODOS os efeitos sonoros."
 SETTING_TILT_CAMERA_ON_ZOOM_OUT:0 "Inclinar a câmera ao afastar"
 SETTING_TILT_CAMERA_ON_ZOOM_OUT_TOOLTIP:0 "#T $SETTING_TILT_CAMERA_ON_ZOOM_OUT$#!\nDetermina se a câmera deve inclinar em direção à inclinação padrão ao afastar."
 SETTING_TOOLTIP_DELAY:0 "Atraso na Aba de Dicas"
 SETTING_TOOLTIP_DELAY_TOOLTIP:0 "#T $SETTING_TOOLTIP_DELAY$#!\n Define o atraso antes que a aba apareça."
 SETTING_TOOLTIP_LOCK_TIME:0 "Atraso de Trava"
 SETTING_TOOLTIP_LOCK_TIME_TOOLTIP:0 "#T $SETTING_TOOLTIP_LOCK_TIME$#!\n Define o atraso antes que a aba seja travada."
 SETTING_TOOLTIP_MODE:0 "Modo de Configuração de Abas"
 SETTING_TOOLTIP_MODE_LOCK_ON_ACTION:0 "Tranca de Ação"
 SETTING_TOOLTIP_MODE_LOCK_ON_ACTION_TOOLTIP:0 "#T $SETTING_TOOLTIP_MODE_LOCK_ON_ACTION$#!\n Pressione #V Botão do Meio do Mouse#! para travar e destravar abas."
 SETTING_TOOLTIP_MODE_LOCK_ON_TIMER:0 "Tempo para Travamento"
 SETTING_TOOLTIP_MODE_LOCK_ON_TIMER_TOOLTIP:0 "#T $SETTING_TOOLTIP_MODE_LOCK_ON_TIMER$#!\n Abas travam em seu lugar se o cursos não se mover por um curto periodo. #weak (Configuração padrão.)#!"
 SETTING_TOOLTIP_MODE_MOUSE_TENDENCY:0 "Tendencia do Mouse"
 SETTING_TOOLTIP_MODE_MOUSE_TENDENCY_TOOLTIP:0 "#T $SETTING_TOOLTIP_MODE_MOUSE_TENDENCY$#!\n Abas automaticamente travam no lugar até que o cursor saia delas."
 SETTING_TOOLTIP_MODE_TOOLTIP:0 "#T $SETTING_TOOLTIP_MODE$#!\n Define a maneira que as abas \"travam,\" permitindo abas dentro de abas."
 SETTING_TOOLTIP_OPEN_TIME_WHEN_ANOTHER_LOCKED:0 "Atraso de Aba Travada"
 SETTING_TOOLTIP_OPEN_TIME_WHEN_ANOTHER_LOCKED_TOOLTIP:0 "#T $SETTING_TOOLTIP_OPEN_TIME_WHEN_ANOTHER_LOCKED$#!\n Define o atraso antes da aba ser travada quando outra aba ja está aberta."
 SETTING_TOOLTIP_UNLOCK_TIME:0 "Atraso do Destravamento"
 SETTING_TOOLTIP_UNLOCK_TIME_TOOLTIP:0 "#T $SETTING_TOOLTIP_UNLOCK_TIME$#!\n Define o atraso antes que a aba seja liberada."
 SETTING_TUTORIAL:0 "Tutorial"
 SETTING_USE_DYNASTY_NAMED_REALMS:0 "Reinos com Nomes de Dinastia"
 SETTING_USE_DYNASTY_NAMED_REALMS_TOOLTIP:0 "#T $SETTING_USE_DYNASTY_NAMED_REALMS$#!\nAlgumas culturas nomearão seu título principal de acordo com sua dinastia (por exemplo: Abbasids)."
 SETTING_WINTER_PARTICLE_EFFECTS:0 "Efeitos de partículas de inverno"
 SETTING_WINTER_PARTICLE_EFFECTS_TOOLTIP:0 "#T $SETTING_WINTER_PARTICLE_EFFECTS$#!\nDetermina se os efeitos de partículas serão exibidos ou não quando o inverno estiver ativo em algumas áreas do mapa.\n\nDesativar esta opção pode aumentar o desempenho do jogo"
