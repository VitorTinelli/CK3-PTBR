 scheme_apa_negative_8101_modifier:0 "$scheme_apa_negative.8101.t$"
 scheme_apa_negative_8101_modifier_desc:0 "Estava tudo tão claro no começo, mas as coisas parecem estar desmoronando..."
 scheme_apa_negative_8111_modifier:0 "$scheme_apa_negative.8111.t$"
 scheme_apa_negative_8111_modifier_desc:0 "Uma palavra bem colocada é desfeita por uma réplica. Teremos que tentar novamente."
 scheme_apa_negative_8121_modifier:0 "$scheme_apa_negative.8121.t$"
 scheme_apa_negative_8121_modifier_desc:0 "Uma grande história precisa estar cheia de exageros grandiosos, mas também deve ser internamente consistente."
 scheme_apa_negative_8131_modifier:0 "$scheme_apa_negative.8131.t$"
 scheme_apa_negative_8131_modifier_desc:0 "Embora se espere que tenha sido encerrado para sempre, as coisas podem ressurgir de forma inesperada."
