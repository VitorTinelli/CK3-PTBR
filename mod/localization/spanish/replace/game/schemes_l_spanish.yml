 sway_desc_general:0 "O Esquema de Influência é um [personal_scheme|E] que visa melhorar a [opinion|E] de outro personagem sobre você. Este esquema depende principalmente da sua própria [diplomacy|E]. Como não é um [hostile_scheme|E], não é [secret_scheme_single|E] e não utiliza [agents|E].\n\nAo contrário da maioria dos Esquemas, a Influência reinicia após a conclusão. A Opinião que você ganha a partir dele se acumula, portanto, mantê-lo ativo fará com que o [scheme_target|E] goste cada vez mais de você."
