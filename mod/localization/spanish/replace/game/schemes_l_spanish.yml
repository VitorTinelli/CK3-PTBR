 scheme_apa_negative_5001_modifier:0 "$scheme_apa_negative.5001.t$"
 scheme_apa_negative_5001_modifier_desc:0 "Como um plano pode esperar ter sucesso sem circunstâncias consistentes?"
 scheme_apa_negative_5011_modifier:0 "$scheme_apa_negative.5011.t$"
 scheme_apa_negative_5011_modifier_desc:0 "Alguém, em algum lugar, está certo de que há algo errado com um dos conspiradores."
 scheme_apa_negative_5021_modifier:0 "$scheme_apa_negative.5021.t$"
 scheme_apa_negative_5021_modifier_desc:0 "Tantos olhos, sempre observando, sempre curiosos, sempre questionando educadamente, e ainda assim..."
 scheme_apa_negative_5031_modifier:0 "$scheme_apa_negative.5031.t$"
 scheme_apa_negative_5031_modifier_desc:0 "O melhor momento para agir claramente já passou."
 scheme_apa_negative_5041_modifier:0 "$scheme_apa_negative.5041.t$"
 scheme_apa_negative_5041_modifier_desc:0 "É impossível tramar quando alguns dos conspiradores nunca parecem escapar de guardiões, amigos e acompanhantes suspeitos."
 scheme_apa_negative_5051_modifier:0 "$scheme_apa_negative.5051.t$"
 scheme_apa_negative_5051_modifier_desc:0 "Essas ferramentas foram deixadas aqui por #EMP alguém#!, e para qual propósito..."
 scheme_apa_negative_5061_modifier:0 "$scheme_apa_negative.5061.t$"
 scheme_apa_negative_5061_modifier_desc:0 "Os conspiradores estão sempre lá, sempre no caminho, sempre interrompendo."
 scheme_apa_negative_5071_modifier:0 "$scheme_apa_negative.5071.t$"
 scheme_apa_negative_5071_modifier_desc:0 "Palavras falsas não são apenas uma perda de tempo, são um veneno no ar."
 scheme_apa_negative_5081_modifier:0 "$scheme_apa_negative.5081.t$"
 scheme_apa_negative_5081_modifier_desc:0 "Um elogio mal formulado vale menos do que o silêncio."
 scheme_apa_negative_5091_modifier:0 "$scheme_apa_negative.5091.t$"
 scheme_apa_negative_5091_modifier_desc:0 "Desespero é uma das qualidades menos atraentes."
 scheme_apa_negative_5101_modifier:0 "$scheme_apa_negative.5101.t$"
 scheme_apa_negative_5101_modifier_desc:0 "Há algo... estranho em tudo isso, eles pensam."
 scheme_apa_negative_5111_modifier:0 "$scheme_apa_negative.5111.t$"
 scheme_apa_negative_5111_modifier_desc:0 "É arrogantemente audacioso até mesmo #EMP tentar#! apresentar essa bagunça como credível."
 scheme_apa_negative_5121_modifier:0 "$scheme_apa_negative.5121.t$"
 scheme_apa_negative_5121_modifier_desc:0 "A sutil arte do duplo sentido escapou da compreensão de alguns dos conspiradores."
 scheme_apa_negative_5131_modifier:0 "$scheme_apa_negative.5131.t$"
 scheme_apa_negative_5131_modifier_desc:0 "Quem me dera que #EMP esse#! comentário pudesse ser retirado."
 scheme_apa_negative_5141_modifier:0 "$scheme_apa_negative.5141.t$"
 scheme_apa_negative_5141_modifier_desc:0 "Infelizmente para você, piadas devem ser engraçadas."
 scheme_apa_negative_5151_modifier:0 "$scheme_apa_negative.5151.t$"
 scheme_apa_negative_5151_modifier_desc:0 "Zumbindo, zumbindo, zumbindo: um humano alegadamente ambiante e monótono."
 scheme_apa_negative_5161_modifier:0 "$scheme_apa_negative.5161.t$"
 scheme_apa_negative_5161_modifier_desc:0 "Eles se expressaram de forma abundante."
 scheme_apa_negative_5171_modifier:0 "$scheme_apa_negative.5171.t$"
 scheme_apa_negative_5171_modifier_desc:0 "Algo sobre este assunto simplesmente não combina com seus pensamentos."
 scheme_apa_negative_5181_modifier:0 "$scheme_apa_negative.5181.t$"
 scheme_apa_negative_5181_modifier_desc:0 "Toda suposição lógica que você faz #EMP parece#! sensata. Ainda está errada, porém."
 scheme_apa_negative_5191_modifier:0 "$scheme_apa_negative.5191.t$"
 scheme_apa_negative_5191_modifier_desc:0 "A confusão gera caos."
 scheme_apa_negative_5201_modifier:0 "$scheme_apa_negative.5201.t$"
 scheme_apa_negative_5201_modifier_desc:0 "Ou sono, ou, se esse estudo infernal continuar, potencialmente a borda de um penhasco alto."
 scheme_apa_negative_5211_modifier:0 "$scheme_apa_negative.5211.t$"
 scheme_apa_negative_5211_modifier_desc:0 "O tempo voa quando você não consegue se concentrar de forma alguma."
 scheme_apa_negative_5221_modifier:0 "$scheme_apa_negative.5221.t$"
 scheme_apa_negative_5221_modifier_desc:0 "Um curso político sutil é aquele que não pode ser visto do condado vizinho."
 scheme_apa_negative_5231_modifier:0 "$scheme_apa_negative.5231.t$"
 scheme_apa_negative_5231_modifier_desc:0 "Um servo tão obviamente no payroll é um servo incapaz de sutileza."
 scheme_apa_negative_5241_modifier:0 "$scheme_apa_negative.5241.t$"
 scheme_apa_negative_5241_modifier_desc:0 "As coisas não deveriam ter acontecido assim."
 scheme_apa_negative_5251_modifier:0 "$scheme_apa_negative.5251.t$"
 scheme_apa_negative_5251_modifier_desc:0 "A convicção em suas habilidades é uma bênção. Até que não seja."
 scheme_apa_negative_5261_modifier:0 "$scheme_apa_negative.5261.t$"
 scheme_apa_negative_5261_modifier_desc:0 "Os conspiradores pensaram em tudo! Certo?"
 scheme_apa_negative_5271_modifier:0 "$scheme_apa_negative.5271.t$"
 scheme_apa_negative_5271_modifier_desc:0 "Seria impressionante quão desinteressantes alguns conspiradores podem ser — se alguém conseguisse suportar prestar atenção neles."
 scheme_apa_negative_5281_modifier:0 "$scheme_apa_negative.5281.t$"
 scheme_apa_negative_5281_modifier_desc:0 "As coisas sempre começam tão monótonas e, então, sem falhas, alguns minutos depois..."
 scheme_apa_negative_5291_modifier:0 "$scheme_apa_negative.5291.t$"
 scheme_apa_negative_5291_modifier_desc:0 "Não importa o que seja dito, as pessoas parecem #EMP convencidas#! de que um dos conspiradores está do #EMP outro#! lado."
 scheme_apa_negative_5301_modifier:0 "$scheme_apa_negative.5301.t$"
 scheme_apa_negative_5301_modifier_desc:0 "Palavras não podem ser sinceras quando vêm de um cachorro tagarela sem opiniões próprias."
 scheme_apa_negative_5311_modifier:0 "$scheme_apa_negative.5311.t$"
 scheme_apa_negative_5311_modifier_desc:0 "O perímetro mais bem protegido é inútil se uma entrada secreta passa despercebida."
 scheme_apa_negative_5321_modifier:0 "$scheme_apa_negative.5321.t$"
 scheme_apa_negative_5321_modifier_desc:0 "Para ter sucesso no trabalho de sentinela, a primeira luta é contra as longas e solitárias horas da noite."
 scheme_apa_negative_5331_modifier:0 "$scheme_apa_negative.5331.t$"
 scheme_apa_negative_5331_modifier_desc:0 "Explique para mim mais uma vez: escapou? O que você quer dizer com 'escapou'? Você os tinha!"
 scheme_apa_negative_5341_modifier:0 "$scheme_apa_negative.5341.t$"
 scheme_apa_negative_5341_modifier_desc:0 "O tempo é facilmente desperdiçado em exercícios inúteis, e, posteriormente, limpando lições erradas das mentes."
 scheme_apa_negative_5351_modifier:0 "$scheme_apa_negative.5351.t$"
 scheme_apa_negative_5351_modifier_desc:0 "Seja por saudade de casa, ressentimento ou simplesmente indisciplina, é um trabalho ensinar um aluno relutante."
 scheme_apa_negative_5361_modifier:0 "$scheme_apa_negative.5361.t$"
 scheme_apa_negative_5361_modifier_desc:0 "Mau tempo, agendas lotadas ou ataques constantes podem limitar o tempo de treinamento em campo."
 scheme_apa_negative_5371_modifier:0 "$scheme_apa_negative.5371.t$"
 scheme_apa_negative_5371_modifier_desc:0 "Nunca na minha vida tive que tolerar uma turma tão heterogênea de tolos sangrentos."
 scheme_apa_negative_5381_modifier:0 "$scheme_apa_negative.5381.t$"
 scheme_apa_negative_5381_modifier_desc:0 "Para sobreviver, devemos escolher nossas batalhas com sabedoria, é simplesmente uma questão de números."
 scheme_apa_negative_5391_modifier:0 "$scheme_apa_negative.5391.t$"
