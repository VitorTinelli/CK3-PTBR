 study_faith_desc_general:0 "O $study_faith$ [scheme|E] é um [personal_scheme|E] onde você tenta aprender mais sobre o [rite|E] de [scheme_target|E].\n\nCada fase concluída ensina algo a você. Uma fase bem-sucedida concede [agnostic_knowledge|E] de todo o [rite|E] em um único avanço. Uma fase menos bem-sucedida concede apenas o conhecimento de um [core_tenet|E] ou [doctrine|E] priorizado. O [scheme|E] termina automaticamente quando não houver mais nada a aprender. $study_faith_desc_general_shared$"
 study_faith_desc_general_shared:0 "Este Plano baseia-se principalmente no seu [learning|E], e secundariamente no [piety_level|E].\n\nO seu [success_chance|E] determina a probabilidade de uma fase terminar em um avanço bem-sucedido e de um [rite|E] ser aprendido por completo. Em caso de falha, você ainda obterá uma compreensão menor."
