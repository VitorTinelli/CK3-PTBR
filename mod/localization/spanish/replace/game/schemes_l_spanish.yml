 scheme_apa_positive_0001_modifier:0 "$scheme_apa_positive.0001.t$"
 scheme_apa_positive_0001_modifier_desc:0 "Uma espada, um machado, uma adaga — um pouco de metal vai longe quando alguém acha que está seguro."
 scheme_apa_positive_0011_modifier:0 "$scheme_apa_positive.0011.t$"
 scheme_apa_positive_0011_modifier_desc:0 "Uma compreensão clara de onde cada peça do jogo pode estar a qualquer momento é vital para o sucesso."
 scheme_apa_positive_0021_modifier:0 "$scheme_apa_positive.0021.t$"
 scheme_apa_positive_0021_modifier_desc:0 "Uma coisa tão pequena, deixar um fecho solto, e ainda assim..."
 scheme_apa_positive_0031_modifier:0 "$scheme_apa_positive.0031.t$"
 scheme_apa_positive_0031_modifier_desc:0 "Um pouco de prata vai longe por um bom tempo."
 scheme_apa_positive_0041_modifier:0 "$scheme_apa_positive.0041.t$"
 scheme_apa_positive_0041_modifier_desc:0 "É surpreendente quantas poucas palavras precisam ser ditas antes que alguém esteja disposto a comprometer sua moral."
 scheme_apa_positive_0051_modifier:0 "$scheme_apa_positive.0051.t$"
 scheme_apa_positive_0051_modifier_desc:0 "É necessário um pouco de habilidade, uma dose de sorte e um olhar atento, mas oportunidades podem ser #EMP criadas#! para surgir."
 scheme_apa_positive_0061_modifier:0 "$scheme_apa_positive.0061.t$"
 scheme_apa_positive_0061_modifier_desc:0 "O coração sabe o que quer, independentemente do que a cabeça ou o instinto tenham a dizer."
 scheme_apa_positive_0071_modifier:0 "$scheme_apa_positive.0071.t$"
 scheme_apa_positive_0071_modifier_desc:0 "Com algumas pessoas, adulação vai te levar a todo lugar."
 scheme_apa_positive_0081_modifier:0 "$scheme_apa_positive.0081.t$"
 scheme_apa_positive_0081_modifier_desc:0 "Dedicar tempo para mostrar que você aprecia alguém vale mais do que ouro. Geralmente."
 scheme_apa_positive_0091_modifier:0 "$scheme_apa_positive.0091.t$"
 scheme_apa_positive_0091_modifier_desc:0 "Uma enxurrada de correspondência oferece oportunidades tão emocionantes para humor e charme."
 scheme_apa_positive_0111_modifier:0 "$scheme_apa_positive.0111.t$"
 scheme_apa_positive_0111_modifier_desc:0 "Aprender a entender alguém pode ser difícil, mas #EMP demonstrar#! que você entende é bastante fácil."
 scheme_apa_positive_0121_modifier:0 "$scheme_apa_positive.0121.t$"
 scheme_apa_positive_0121_modifier_desc:0 "Uma mão amiga, um ombro para chorar, um momento de alívio — assistência é ainda mais valiosa quando inesperada."
 scheme_apa_positive_0131_modifier:0 "$scheme_apa_positive.0131.t$"
 scheme_apa_positive_0131_modifier_desc:0 "Realmente uma obra rara de erudição, uma que se alinha tão perfeitamente com os objetivos da conspiração."
 scheme_apa_positive_0141_modifier:0 "$scheme_apa_positive.0141.t$"
 scheme_apa_positive_0141_modifier_desc:0 "Um sinal de um poder superior é uma coisa maravilhosamente maleável."
 scheme_apa_positive_0151_modifier:0 "$scheme_apa_positive.0151.t$"
 scheme_apa_positive_0151_modifier_desc:0 "Cativante, fácil de aprender e, melhor de tudo: escrito pelos conspiradores."
 scheme_apa_positive_0161_modifier:0 "$scheme_apa_positive.0161.t$"
 scheme_apa_positive_0161_modifier_desc:0 "Um elogio com o fogo de significado por trás brilha ainda mais intensamente."
 scheme_apa_positive_0171_modifier:0 "$scheme_apa_positive.0171.t$"
 scheme_apa_positive_0171_modifier_desc:0 "Reservar tempo para conversar, tempo para visitar ou apenas tempo para ouvir pode ser alarmantemente eficaz."
 scheme_apa_positive_0181_modifier:0 "$scheme_apa_positive.0181.t$"
 scheme_apa_positive_0181_modifier_desc:0 "Encontre um terreno comum e, em seguida, agarre-o."
 scheme_apa_positive_0191_modifier:0 "$scheme_apa_positive.0191.t$"
 scheme_apa_positive_0191_modifier_desc:0 "Saber quando algo não é sobre você é apenas metade do caminho."
 scheme_apa_positive_0201_modifier:0 "$scheme_apa_positive.0201.t$"
 scheme_apa_positive_0201_modifier_desc:0 "Lembrar os tempos passados mantém os pensamentos maravilhosamente cativos."
 scheme_apa_positive_0211_modifier:0 "$scheme_apa_positive.0211.t$"
 scheme_apa_positive_0211_modifier_desc:0 "Quando chega ao ponto, há pouco substituto para tinta, pergaminho e tempo."
 scheme_apa_positive_0221_modifier:0 "$scheme_apa_positive.0221.t$"
 scheme_apa_positive_0221_modifier_desc:0 "Outros podem chamá-los de rabiscos dos loucos, mas para seu proprietário, estes são um tesouro pessoal."
 scheme_apa_positive_0231_modifier:0 "$scheme_apa_positive.0231.t$"
 scheme_apa_positive_0231_modifier_desc:0 "Algumas referências são tão cruciais que podem mudar toda a nossa compreensão sobre um assunto."
 scheme_apa_positive_0241_modifier:0 "$scheme_apa_positive.0241.t$"
 scheme_apa_positive_0241_modifier_desc:0 "Aprender é uma experiência íntima, com muitas variações para muitas pessoas diferentes."
 scheme_apa_positive_0251_modifier:0 "$scheme_apa_positive.0251.t$"
 scheme_apa_positive_0251_modifier_desc:0 "É lindo quando as coisas simplesmente se encaixam."
 scheme_apa_positive_0261_modifier:0 "$scheme_apa_positive.0261.t$"
 scheme_apa_positive_0261_modifier_desc:0 "Metade da batalha é convencer os outros, então o que isso diz quando suas mentes já estão feitas?"
 scheme_apa_positive_0271_modifier:0 "$scheme_apa_positive.0271.t$"
 scheme_apa_positive_0271_modifier_desc:0 "Um bando de secretárias pode mover montanhas de papéis úteis."
 scheme_apa_positive_0281_modifier:0 "$scheme_apa_positive.0281.t$"
 scheme_apa_positive_0281_modifier_desc:0 "Contingências, tramas e jogadas para cada permutação concebível de uma conspiração."
 scheme_apa_positive_0291_modifier:0 "$scheme_apa_positive.0291.t$"
 scheme_apa_positive_0291_modifier_desc:0 "Preparar o tabuleiro é a parte mais vital do jogo."
 scheme_apa_positive_0301_modifier:0 "$scheme_apa_positive.0301.t$"
 scheme_apa_positive_0301_modifier_desc:0 "Quando tudo já está amarrado, a oposição murcha."
 scheme_apa_positive_0311_modifier:0 "$scheme_apa_positive.0311.t$"
 scheme_apa_positive_0311_modifier_desc:0 "Modismos percorrem os tribunais como pragas entre os pobres, e agora isso atende às necessidades do esquema."
 scheme_apa_positive_0321_modifier:0 "$scheme_apa_positive.0321.t$"
 scheme_apa_positive_0321_modifier_desc:0 "Ajuda não apenas ter um bom orador público à disposição, mas alguém que as pessoas cancelam compromissos para ver."
 scheme_apa_positive_0331_modifier:0 "$scheme_apa_positive.0331.t$"
 scheme_apa_positive_0331_modifier_desc:0 "Não importa se é verdade, importa quantas pessoas #EMP falam#! sobre isso."
 scheme_apa_positive_0341_modifier:0 "$scheme_apa_positive.0341.t$"
 scheme_apa_positive_0341_modifier_desc:0 "Quando as pessoas confiam em alguém para permanecer sensato e equilibrado, a medida exata dessa pessoa importa mais do que a maioria."
 scheme_apa_positive_0351_modifier:0 "$scheme_apa_positive.0351.t$"
 scheme_apa_positive_0351_modifier_desc:0 "Todos têm preconceitos, mas os detalhes da contagem tendem a variar."
 scheme_apa_positive_0361_modifier:0 "$scheme_apa_positive.0361.t$"
 scheme_apa_positive_0361_modifier_desc:0 "Respeito pode não ser muito mais fácil de aproveitar do que amor ou ódio, mas é muito mais versátil."
 scheme_apa_positive_0371_modifier:0 "$scheme_apa_positive.0371.t$"
 scheme_apa_positive_0371_modifier_desc:0 "Nenhuma porta, portão ou passagem pode ser superada ou fortalecida contra essa eventualidade."
 scheme_apa_positive_0381_modifier:0 "$scheme_apa_positive.0381.t$"
 scheme_apa_positive_0381_modifier_desc:0 "Um plano maligno é mais facilmente interrompido se for desfeito antes de ganhar pernas."
 scheme_apa_positive_0391_modifier:0 "$scheme_apa_positive.0391.t$"
 scheme_apa_positive_0391_modifier_desc:0 "Fraquezas desconhecidas podem ser reveladas apenas se você planejar, planejar e planejar novamente."
 scheme_apa_positive_0401_modifier:0 "$scheme_apa_positive.0401.t$"
 scheme_apa_positive_0401_modifier_desc:0 "É muito mais fácil manter a atenção daqueles cujo respeito já foi conquistado."
 scheme_apa_positive_0411_modifier:0 "$scheme_apa_positive.0411.t$"
 scheme_apa_positive_0411_modifier_desc:0 "Uma turba indisciplinada não vale nada no campo de batalha a menos que seja ensinada a obedecer primeiro."
 scheme_apa_positive_0421_modifier:0 "$scheme_apa_positive.0421.t$"
 scheme_apa_positive_0421_modifier_desc:0 "Estudantes comprometidos e dispostos são a bênção mais apreciada de um professor."
 scheme_apa_positive_0431_modifier:0 "$scheme_apa_positive.0431.t$"
 scheme_apa_positive_0431_modifier_desc:0 "Quando feito corretamente, o simples ato de ficar em pé pode ser um show magistral de força."
 scheme_apa_positive_0441_modifier:0 "$scheme_apa_positive.0441.t$"
 scheme_apa_positive_0441_modifier_desc:0 "Às vezes, você só precisa mostrar a essas pessoas que está falando sério."
 scheme_apa_positive_0451_modifier:0 "$scheme_apa_positive.0451.t$"
 scheme_apa_positive_0451_modifier_desc:0 "Embelezada ou justificada, nossa reputação nos precede e clareia nosso caminho."
 scheme_apa_positive_0461_modifier:0 "$scheme_apa_positive.0461.t$"
 scheme_apa_positive_0461_modifier_desc:0 "O elemento surpresa é incomparável, e uma emboscada bem planejada é inescapável."
 scheme_apa_positive_0471_modifier:0 "$scheme_apa_positive.0471.t$"
 scheme_apa_positive_0471_modifier_desc:0 "Nossa presa avança inconscientemente para a armadilha, enquanto nos preparamos para puxar a corda."
 scheme_apa_positive_0481_modifier:0 "$scheme_apa_positive.0481.t$"
 scheme_apa_positive_0481_modifier_desc:0 "Uma presa astuta pode tentar enganar um predador, e um predador astuto pode ver através disso."
 scheme_apa_positive_0491_modifier:0 "$scheme_apa_positive.0491.t$"
 scheme_apa_positive_0491_modifier_desc:0 "Por que razão não podemos dizer, as pessoas aqui são incomumente agradáveis."
 scheme_apa_positive_0501_modifier:0 "$scheme_apa_positive.0501.t$"
 scheme_apa_positive_0501_modifier_desc:0 "A súbita aparição de novas informações pode fazer toda a diferença."
 scheme_apa_positive_0511_modifier:0 "$scheme_apa_positive.0511.t$"
 scheme_apa_positive_0511_modifier_desc:0 "O compartilhamento amigável e aberto de direções e informações torna nossa tarefa muito mais fácil."
 scheme_apa_positive_0521_modifier:0 "$scheme_apa_positive.0521.t$"
 scheme_apa_positive_0521_modifier_desc:0 "Um argumento impenetrável, bem fundamentado, é difícil de parar."
 scheme_apa_positive_0531_modifier:0 "$scheme_apa_positive.0531.t$"
 scheme_apa_positive_0531_modifier_desc:0 "Às vezes, um caso simplesmente já foi feito antes, e suas respostas são aplicáveis."
 scheme_apa_positive_0541_modifier:0 "$scheme_apa_positive.0541.t$"
 scheme_apa_positive_0541_modifier_desc:0 "Acordos honestos, sem trapaças ou má vontade, são um alívio."
 scheme_apa_positive_0551_modifier:0 "$scheme_apa_positive.0551.t$"
 scheme_apa_positive_0551_modifier_desc:0 "Materiais abundantes e baratos tornaram a construção de uma estrutura uma tarefa fácil."
 scheme_apa_positive_0561_modifier:0 "$scheme_apa_positive.0561.t$"
 scheme_apa_positive_0561_modifier_desc:0 "Um plano de construção bem documentado garante que a equipe trabalhe em conjunto e no prazo."
 scheme_apa_positive_0571_modifier:0 "$scheme_apa_positive.0571.t$"
 scheme_apa_positive_0571_modifier_desc:0 "O plano para nosso ataque é uma coisa, mas nada sem uma fuga bem-sucedida."
 scheme_apa_positive_0581_modifier:0 "$scheme_apa_positive.0581.t$"
 scheme_apa_positive_0581_modifier_desc:0 "Fomos abençoados: apenas alguns guardas estão presentes, e aqueles são tolos!"
