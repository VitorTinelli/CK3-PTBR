l_spanish:
 EVENT_WINDOW_OPTION_AVAILABLE_RULER_OBJECTIVES:0 "Esta opção está disponível devido aos objetivos ativos do governante"
 advice_become_house_head_description:0 "Um [house_head|E] geralmente mantém esse papel pelo resto da vida. Embora matar membros da própria família em massa seja sempre uma opção, pode ser mais rápido criar uma nova casa.\n\n#help $EFFECT_LIST_BULLET$ Abra '$DECISIONS_AND_CONTRACTS_BUTTON$' à sua direita.\n$EFFECT_LIST_BULLET$ Em '#S $DECISIONS_VIEW_MAJOR_DECISIONS$#!' você encontrará a decisão '#S $create_cadet_branch_decision$#!'#!"
 advice_become_house_head_summary:0 "Tornar-se o [house_head|E] da sua Casa"
 custom_ireland_development_growth:0 "$MOD_MONTHLY_DEVELOPMENT_GROWTH_FACTOR$ na [region|E] [GetGeographicalRegion('custom_ireland').GetName]"
 enable_unify_region_decision_tt:0 "Habilita [decision|E] [GetDecisionWithKey('unify_region_decision').GetName]"
 hint_allies_benefits:0 "\n\n#help Quando estiver em [war|E] contra [holder.GetName], use a [character_interaction|E] #HIGH $call_ally_interaction$#! com seus aliados. Eles podem se juntar e usar seus exércitos para ajudar na guerra.#!"
 hint_ask_for_claim:0 "Use a [character_interaction|E] #HIGH $hof_ask_for_claim_interaction$#! com seu [head_of_faith|E] [hof.GetFullName] para pagar [piety|E] por uma [claim|E] sobre este [title|E].\n\n#help Será uma [pressed_claim|E], então suas [children|E] herdarão a reivindicação e poderão usar o mesmo casus belli.$hint_claim_benefits$#!"
 hint_claim_benefits:0 "\n\nTer uma reivindicação desbloqueia uma #HIGH [casus_belli|E] de Reivindicação#! permitindo tomar o [title.GetName] em uma guerra."
 hint_conquest_war:0 "$hint_declare_war_intro$ concederá o [title.GetName] ao seu [domain|E]. $hint_declare_war_outro$"
 hint_create_title:0 "Criar um [title|E] [de_jure|E] superior: [de_jure_title.GetName].\n\n#help Isso desbloqueará [casus_bellis|E] [de_jure|E] ou aumentará a aceitação de [character_interaction|E] #HIGH $offer_vassalization_interaction$#!.#!"
 hint_declare_war_intro:0 "Declare [war|E] usando [casus_belli|E] #HIGH [cb.GetName]#!. Vencer a guerra irá"
 hint_declare_war_outro:0 "\n\n#help Verifique [alliances|E], [levies|E], [knights|E] e [men_at_arms|E] de [holder.GetName] e compare com os seus para garantir a vitória.#!"
 hint_dev_example_description:0 "#D Descrição significativamente mais longa do que o jogador deve estar fazendo, ou possivelmente já está fazendo, e, mais importante, por quê.#!"
 hint_dev_example_summary:0 "#D Resumo curto do conselho #!"
 hint_fabricate_claim:0 "Fabrique uma [claim|E] usando a [councillor_task|E] do [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] [chaplain.GetFirstName] #HIGH $task_fabricate_claim$#!.\n\n#help [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] com maior [learning_skill|E] tem mais chance de conseguir a reivindicação sobre [title_duchy.GetName]. Será sempre uma [unpressed_claim|E], então seus [children|E] não a herdarão; você deve agir rápido. $hint_claim_benefits$#!"
 hint_get_knights:0 "Use a [decision|E] [GetDecisionWithKey('invite_knights_decision').GetName] para obter novos [guests|E] que você pode recrutar como [knights|E] usando a [character_interaction|E] #HIGH $recruit_guest_interaction$#!.\n\nUse a [character_interaction|E] #HIGH $invite_to_court_interaction$#! em qualquer personagem [unlanded|E] com alta [prowess|E] que encontrar, verificando os [courts|E] de outros [rulers|E].\n\nUse a [character_interaction|E] #HIGH $arrange_marriage_interaction$#! para [marry|E] seus [courtiers|E] com outros cortesãos sem terras com alta bravura.\n\n#help Dependendo do seu [martial_custom|E], você pode precisar usar casamento [matrilineal|E] para trazê-los à sua [court|E]. Use o localizador de personagens e filtre por Bravura.#!"
 hint_help_help_ask_for_claim:0 "Use a [character_interaction|E] #HIGH $sway_interaction$#!, #HIGH $befriend_interaction$#! ou #HIGH $seduce_interaction$#! em [hof.GetName] para melhorar a [opinion|E] deles sobre você.\n\n#help Isso fará com que [hof.GetTitledFirstNameNoTooltip] fique mais disposto a aceitar a [character_interaction|E] #HIGH $hof_ask_for_claim_interaction$#!.$hint_opinion_schemes_benefits$#!"
 hint_help_help_ask_for_claim_interactions:0 "Use a [character_interaction|E] #HIGH $gift_interaction$#!, #HIGH $seek_indulgences_interaction$#!, #HIGH $offer_ward_interaction$#! ou #HIGH $gift_artifact_interaction$#! em [hof.GetName] para melhorar a [opinion|E] deles sobre você.\n\n#help Isso fará com que [hof.GetTitledFirstNameNoTooltip] fique mais disposto a aceitar a [character_interaction|E] #HIGH $hof_ask_for_claim_interaction$#!.\n\n#HIGH $seek_indulgences_interaction$#! e $hint_opinion_interaction_benefits$#!"
 hint_help_offer_vassalization:0 "Use #HIGH $sway_interaction$#!, #HIGH $befriend_interaction$#! ou a [character_interaction|E] #HIGH $seduce_interaction$#! em [holder.GetName] para melhorar a [opinion|E] deles sobre você.\n\n#help Isso fará com que [holder.GetTitledFirstNameNoTooltip] fique mais disposto a aceitar a [character_interaction|E] #HIGH $offer_vassalization_interaction$#!.$hint_opinion_schemes_benefits$#!"
 hint_help_offer_vassalization_interactions:0 "Use #HIGH $gift_interaction$#!, #HIGH $offer_ward_interaction$#! ou a [character_interaction|E] #HIGH $gift_artifact_interaction$#! em [holder.GetName] para melhorar a [opinion|E] deles sobre você.\n\n#help Isso fará com que [holder.GetTitledFirstNameNoTooltip] fique mais disposto a aceitar a [character_interaction|E] #HIGH $offer_vassalization_interaction$#!. $hint_opinion_interaction_benefits$#!"
 hint_marry_allies:0 "Use a [character_interaction|E] #HIGH $arrange_marriage_interaction$#! para [marry|E] você ou sua [close_family|E] com outros [rulers|E] ou suas famílias próximas com alta força militar para obter poderosas [alliances|E] (use a ordenação: Poder de Aliança na janela de interação).$hint_allies_benefits$"
 hint_marry_into_succession:0 "Use a [character_interaction|E] #HIGH $arrange_marriage_interaction$#! para arranjar um casamento entre os [heirs|E] de [holder.GetName] ou [holder.GetHerHis] e você ou seus [dynasty_members|E], para que suas [children|E] herdem o [title|E] no futuro.\n\n#help Preste atenção às [succession_laws|E] do [title.GetName] e à opção de [marriage|E] [matrilineal|E] em #HIGH $arrange_marriage_interaction$#! para garantir que o título será herdado pelos filhos da sua dinastia. Depois que uma criança nascer, você pode acelerar a herança usando o [scheme|E] #HIGH $start_murder_interaction$#! em todos da linha de sucessão antes de seu filho.#!"
 hint_murder_successors:0 "Matar os sucessores na linha antes de você ou do seu filho"
 hint_murder_top_liege:0 "Use a [character_interaction|E] #HIGH $start_murder_interaction$#! em [holder.GetName] para matá-los.\n\n#help Isso fará com que o [heir|E] de [title.GetName], [title_heir.GetName], se torne o novo [holder|E]. Novos governantes tendem a ter reinos mais fracos, devido à divisão do reino entre outros [heirs|E] ou penalidade de [short_reign|E], reduzindo a opinião dos vassalos e, consequentemente, diminuindo [taxes|E] e [levies|E].#!"
 hint_negotiate_allies:0 "Use a [character_interaction|E] #HIGH $perk_alliance_interaction$#! para [ally|E] outro [ruler|E] sem a necessidade de [marry|E].$hint_allies_benefits$"
 hint_offer_vassalization:0 "Vassalize pacificamente usando a [character_interaction|E] #HIGH $offer_vassalization_interaction$#!.\n\n#help Isso fará de [holder.GetTitledFirstName] seu [vassal|E]."
 hint_opinion_interaction_benefits:0 "#HIGH $gift_interaction$#! pode ser usado sempre que você tiver [gold_i][gold|E] suficiente. #HIGH $offer_ward_interaction$#! apenas se você tiver uma [child|E] não-adulta sem [guardian|E]. #HIGH $gift_artifact_interaction$#! apenas se você possuir um [artifact|E]."
 hint_opinion_schemes_benefits:0 "\n\n#HIGH $sway_interaction$#! pode ser usado sempre e em qualquer pessoa dentro do seu [diplomatic_range|E]. #HIGH $befriend_interaction$#! apenas se você possuir o [perk|E] [GetPerk('befriend_perk').GetName(GetPlayer)] ou a [tradition|E] [GetCultureTradition('tradition_fp2_ritualised_friendship').GetName]. #HIGH $seduce_interaction$#! apenas se você tiver uma [sexuality|E] compatível."
 hint_perk_negotiate_allies:0 "Selecione [diplomacy_lifestyle|E] e obtenha pontos suficientes de [experience|E] para desbloquear o [perk|E] [GetPerk('defensive_negotiations_perk').GetName(GetPlayer)].\n\n#help Isso desbloqueará a [character_interaction|E] #HIGH $perk_alliance_interaction$#!, permitindo que você [ally|E] outros [rulers|E] sem necessidade de [marry|E].$hint_allies_benefits$#!"
 hint_recruit_maa:0 "Use [gold_i][gold|E] para criar [regiments|E] de [men_at_arms|E] bem equipados e treinados para fortalecer seu [army|E]. Vá até a janela militar e selecione um tipo de [men_at_arms|E].\n\n#help Escolha o tipo com base em qual é o melhor [men_at_arms_counter|E] para os [men_at_arms|E] de [holder.GetName]. Você pode ver isso na janela de personagem [holder.GetHerHim] na dica de ferramenta de força militar.#!"
 hint_recruit_mercenaries:0 "Use [gold_i][gold|E] para recrutar [mercenaries|E] e fortalecer seu [army|E]. Vá até a janela militar e selecione a aba de mercenários.\n\n#help [mercenaries|E] trabalharão para você com base em um [mercenary_contract|E] de 3 anos. Você pode estender o contrato por mais 3 anos pagando a mesma quantia de ouro.\n\nEscolha o tipo com base em quanto [gold|E] você possui (é possível entrar em [debt|E] para contratá-los, mas estar em dívida reduz [advantage|E] e bloqueia reforços de [men_at_arms|E]) e qual é o melhor [counter|E] para os [men_at_arms|E] de [holder.GetName]. Você pode ver isso na janela de personagem [holder.GetHerHim] na dica de ferramenta de força militar.#!"
 hint_summary_ask_for_claim:0 "Pedir reivindicação sobre [title.GetNameNoTier]"
 hint_summary_conquer_vassal:0 "Forçar [holder.GetTitledFirstName] a ser seu vassalo"
 hint_summary_fabricate_claim:0 "Fabricar uma reivindicação sobre [title.GetNameNoTier]"
 hint_summary_get_knights:0 "Contratar [ROOT.Char.Custom('KnightCulturePluralNoTooltip')]"
 hint_summary_get_succession:0 "Obter [title.GetNameNoTier] por sucessão"
 hint_summary_get_title:0 "Criar o título de jure [title.GetNameNoTier]"
 hint_summary_get_war:0 "Conquistar [title.GetNameNoTier] por guerra"
 hint_summary_help_ask_for_claim:0 "Melhorar a opinião de [hof.GetTitledFirstName] por esquemas"
 hint_summary_help_ask_for_claim_interactions:0 "Melhorar a opinião de [hof.GetTitledFirstName] por interações"
 hint_summary_help_offer_vassal:0 "Melhorar relações com [holder.GetTitledFirstName] através de esquemas"
 hint_summary_help_offer_vassal_interactions:0 "Melhorar relações com [holder.GetTitledFirstName] através de interações"
 hint_summary_marry_allies:0 "Casar com governantes poderosos"
 hint_summary_murder_top_liege:0 "Matar [holder.GetTitledFirstName]"
 hint_summary_negotiate_allies:0 "Negociar alianças"
 hint_summary_offer_vassal:0 "Pedir que [holder.GetTitledFirstName] se torne seu vassalo"
 hint_summary_perk_negotiate_allies:0 "Obter o benefício $defensive_negotiations_perk_name$"
 hint_summary_recruit_maa:0 "Criar Homens de Armas"
 hint_summary_recruit_mercenaries:0 "Recrutar Mercenários"
 hint_summary_take_decision:0 "Completar o Objetivo do Governante"
 hint_take_decision:0 "Você cumpriu todos os requisitos da [decision|E] [GetDecisionWithKey('unify_region_decision').GetName], tome-o para completar o Objetivo do Governante."
 hint_vassalization_war:0 "$hint_declare_war_intro$ lhe concederá [holder.GetName] como [vassal|E]. $hint_declare_war_outro$"
 opted_into_tutorial_objectives_tt:0 "#EMP Aceitar os Objetivos do Governante#!"
 ruler_objective_region_conquered_modifier:0 "Filhos da Terra"
 ruler_objective_region_conquered_modifier_desc:0 "Esta dinastia conquistou uma presença esmagadora em sua região natal e pretende governá-la por séculos."
 tutorial.1001.a:0 "Sim, me guie [councillor.GetNameNoTooltip]!"
 tutorial.1001.b:0 "[councillor.GetSheHe] está bêbado? Não preciso da ajuda [councillor.GetHerHim]."
 tutorial.1001.desc:0 "[councillor.GetName] me encontra no [ROOT.Char.Custom('GetCourtyard')]:\n\n\"[councillor.Custom2('AppropriateGreetingPositive', ROOT.Char)] você tem prestado um grande serviço a todos os povos do nosso domínio.\" [councillor.GetSheHe|U] começa a me bajular, claramente querendo algo em troca.\n\n\"Você já considerou governar toda a região [region.GetName]? Tenho planos, grandes planos!\""
 tutorial.1001.t:0 "$tutorial_event_prefix$ $unify_region_decision$"
 tutorial.1002.a:0 "Gostaria que [councillor.GetNameNoTooltip] pudesse ver isso."
 tutorial.1002.a_councillor:0 "Sim, fizemos isso por eles!"
 tutorial.1002.desc:0 "Enquanto estou sentado no meu trono, observo pela janela, ao longe, como se pudesse ver todas as minhas terras em [region.GetName] — e elas são vastas."
 tutorial.1002.desc_alive:0 "Chamo [councillor.GetName].\n\n\"Conseguimos, [councillor.GetFirstNameNoTooltip], mas ainda não consigo acreditar! Seus planos ambiciosos #EMP realmente#! funcionaram.\" Pulo do trono para abraçar [councillor.GetSheHe].\n\n\"Sempre soube que você conseguiria!\" diz [councillor.GetFirstNameNoTooltip], me abraçando. \"Fizemos isso pelo povo.\""
 tutorial.1002.desc_dead:0 "\n\nAquele desgraçado [councillor.GetName], seus planos ambiciosos #EMP realmente#! funcionaram."
 tutorial.1002.t:0 "$tutorial_event_prefix$ Região Conquistada"
 tutorial_event_prefix:0 "Objetivos do Governante:"
 unify_region_decision:0 "Unificar a Região da Capital"
 unify_region_decision_confirm:0 "Unificar a Região"
 unify_region_decision_desc:0 "Unificar todos os povos na minha região #EMP é um esforço digno e justo!"
 unify_region_decision_tooltip:0 "Solidifique seu domínio sobre a região da sua capital"
