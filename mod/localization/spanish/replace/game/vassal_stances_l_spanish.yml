 glory_hound_desc:0 "Os [vassals|E] $glory_hound$ se importam com posição e prestígio, e com mostrar ao mundo a força do reino do qual fazem parte. Vassalos ousados ou impiedosos frequentemente adotam esta [vassal_stance|E].\n\n#low $glory_hound$ Vassalos gostam quando seu Suserano:#!\n$EFFECT_LIST_BULLET$Tem qualquer [succession_law|E] de Partição\n$EFFECT_LIST_BULLET$Conquistar [Concept('victory', 'Vitórias')|E] em [wars|E] ofensivas\n$EFFECT_LIST_BULLET$Os convida para [activities|E] de [GetActivityType('activity_hunt').GetName]\n\n#low $glory_hound$ Vassalos não gostam quando seu Senhor Feudal:#!\n$EFFECT_LIST_BULLET$Tem uma alta [crown_authority|E]\n$EFFECT_LIST_BULLET$Assina [defeat|E] ou [white_peace|E] nas Guerras\n$EFFECT_LIST_BULLET$[marry|E] com um personagem [lowborn|E] como [primary_spouse|E]\n\nEles preferem [heirs|E] ousados e corajosos com alta habilidade [martial_i][martial|E]."
