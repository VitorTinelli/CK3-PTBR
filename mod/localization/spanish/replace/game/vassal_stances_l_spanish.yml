 zealot_desc:0 "Os [vassals|E] $zealot$ estão focados em assuntos de fé e são influenciados por ações piedosas. Vassalos zelosos ou vingativos frequentemente adotam essa [vassal_stance|E], assim como o [clergy|E].\n\n#low Vassalos $zealot$ gostam quando seu Senhor Feudal:#!\n$EFFECT_LIST_BULLET$Constrói ou melhora as [holdings|E] do [temple|E]\n$EFFECT_LIST_BULLET$Tem sucesso com o [scheme|E] de [GetScheme('learn_language').GetTypeName]\n$EFFECT_LIST_BULLET$Possui [traits|E] [Concept('virtuous', 'Virtuosos')|E]\n$EFFECT_LIST_BULLET$Faz uma [activity|E] de [pilgrimage|E]\n\n#low Vassalos $zealot$ não gostam quando seu Senhor Feudal:#!\n$EFFECT_LIST_BULLET$Pede ao [head_of_faith|E] por [gold_i][gold|E]\n$EFFECT_LIST_BULLET$Possui [traits|E] [Concept('sinful', 'Pecaminosos')|E]\n\nEles preferem herdeiros zelosos e virtuosos com habilidade [learning_i][learning|E] alto."
