 minority_desc:0 "Os [vassals|E] da $minority$ sentem que sua [faith|E] ou [culture|E] são marginalizadas por seu [liege|E]. Vassalos de [faiths|E] ou [cultures|E] hostis com menos de 30% de [cultural_acceptance|E] frequentemente adotam essa [vassal_stance|E].\n\n#low Os vassalos da $minority$ gostam quando seu Senhor Feudal:#!\n$EFFECT_LIST_BULLET$Utiliza a [councillor_task|E] de $task_accept_culture$\n#weak (pois frequentemente mudarão de postura quando atingirem mais de 30% de Aceitação Cultural)#!\n\n#low Os vassalos da $minority$ não gostam quando seu Senhor Feudal:#!\n$EFFECT_LIST_BULLET$Converte a fé ou cultura de um [county|E]\n$EFFECT_LIST_BULLET$Possui uma alta [crown_authority|E]\n\nEles preferem herdeiros honrosos e compassivos, de preferência de outra fé ou cultura diferente de seu atual Senhor Feudal."
