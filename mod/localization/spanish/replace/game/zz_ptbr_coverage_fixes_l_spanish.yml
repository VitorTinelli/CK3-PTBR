 intrigue_temptation.3100.d:0 "Acho que isso merece uma exibição pública."
 intrigue_temptation.3100.end_desc:0 "retratando uma figura de [propositioning_courtier.GetWomanMan] com atributos generosos, em uma pose \"sedutora\".\n\nOlho ao redor do [ROOT.Char.Custom('GetRoom')], sem acreditar, e vejo [propositioning_courtier.GetTitledFirstNameNoTooltip] me encarando. [propositioning_courtier.GetSheHe|U] sorri, e suas sobrancelhas começam a se mover como lagartas frenéticas."
 intrigue_temptation.3100.start_desc:0 "Um [ROOT.Char.Custom('lowly_servant_type')] deixa discretamente um pacote ao meu lado. Bocejo, mal suportando este banquete tedioso, e começo a abri-lo.\n\nDentro há"
 intrigue_temptation.3100.stone_c:0 "Ora, como [propositioning_courtier.GetSheHe] parece #EMP firme#!..."
 intrigue_temptation.3100.stone_desc:0 "uma fina placa de pedra, gravada de forma rudimentar,"
 intrigue_temptation.3100.stone_t:0 "Que Bela... Gravação"
 intrigue_temptation.3100.vellum_c:0 "Então, [propositioning_courtier.GetSheHe] gosta de fazer bagunça..."
 intrigue_temptation.3100.vellum_desc:0 "uma folha de pergaminho com um esboço de tinta borrado"
 intrigue_temptation.3100.vellum_t:0 "Que Belo... Desenho"
 intrigue_temptation.3100.wax_c:0 "Ora, a cera ainda está quente..."
 intrigue_temptation.3100.wax_desc:0 "uma tabuinha de cera malcheirosa, gravada sem esmero,"
 intrigue_temptation.3100.wax_t:0 "Que Bela... Gravura"
 intrigue_temptation.3100.wood_c:0 "[propositioning_courtier.GetSheHe|U] parece simplesmente irresistível..."
 intrigue_temptation.3100.wood_desc:0 "uma placa de madeira, entalhada de forma desajeitada,"
 intrigue_temptation.3100.wood_t:0 "Que Belo... Entalhe"
 intrigue_temptation.3110.0_desc:0 "sobre o amor proibido entre uma cabra e um texugo,"
 intrigue_temptation.3110.1_desc:0 "sobre o desejo melancólico pelo próprio reflexo inalcançável,"
 intrigue_temptation.3110.2_desc:0 "sobre uma relação muito improvável envolvendo um cavalo,"
 intrigue_temptation.3110.3_desc:0 "sobre um senhor que amava suas terras um pouco #EMP demais#!,"
 intrigue_temptation.3110.4_desc:0 "envolvendo três [ROOT.Char.GetFaith.PriestNeuterPlural] lascivos e um chapéu de feltro extremamente gasto,"
 intrigue_temptation.3110.5_desc:0 "sobre as aventuras amorosas do meu avô com um peixe astuto,"
 intrigue_temptation.3110.6_desc:0 "sobre um doce de curvas bastante atraentes,"
 intrigue_temptation.3110.7_desc:0 "envolvendo um toco de árvore muito amado por um bandido,"
 intrigue_temptation.3110.8_desc:0 "sobre os encantos sedutores de monstros marinhos exóticos,"
 intrigue_temptation.3110.9_desc:0 "relatando as inclinações naturais de certas culturas bárbaras,"
 intrigue_temptation.3110.a:0 "Conheço algumas outras histórias assim..."
 intrigue_temptation.3110.a.tt_fail:0 "[potential_deviant.GetShortUINameNoTooltip] sente repulsa pela minha lascívia"
 intrigue_temptation.3110.a.tt_success:0 "[potential_deviant.GetShortUINameNoTooltip] descobre um novo passatempo"
 intrigue_temptation.3110.b:0 "Isso já é #EMP mais#! que suficiente por enquanto, obrigado."
 intrigue_temptation.3110.end_desc:0 "quando percebo um brilho suspeito nos olhos de minha companhia.\n\nIdeias de chantagem me vêm à mente sem que eu as procure. Talvez [potential_deviant.GetTitledFirstNameNoTooltip] tenha mais interesse neste assunto do que imagina?"
 intrigue_temptation.3110.start_desc:0 "Uma longa noite de assuntos de Estado com [potential_deviant.GetTitledFirstNameNoTooltip] acabou, aos poucos, em nós dois embriagados, trocando histórias picantes com a voz arrastada.\n\nAcabo de terminar uma história"
 intrigue_temptation.3110.t:0 "Um Pouco de Experimentação"
 intrigue_temptation.3120.a:0 "Deixe-me mostrar #EMP exatamente#! como posso ser hospitaleiro."
 intrigue_temptation.3120.a.tt_fail:0 "[tempted_guest.GetShortUINameNoTooltip] sente repulsa"
 intrigue_temptation.3120.a.tt_success:0 "[tempted_guest.GetShortUINameNoTooltip] fica encantado"
 intrigue_temptation.3120.b:0 "Basta pedir, e eu buscarei até a própria lua."
 intrigue_temptation.3120.c:0 "Um brinde à boa companhia, ainda que passageira!"
 intrigue_temptation.3120.desc:0 "Esta noite, pela enésima vez, estou descansando junto a uma fogueira que se apaga, na companhia de [tempted_guest.GetTitledFirstName]. Sua presença parece tão natural, tão agradável, como se estivesse em [capital.GetNameNoTooltip] há anos, e não semanas.\n\nSe [tempted_guest.GetFirstNameNoTooltip] concordasse em ficar de vez, estas longas noites tranquilas poderiam durar para sempre. É claro que, com o incentivo certo..."
 intrigue_temptation.3120.t:0 "Corações Errantes"
 intrigue_temptation.3130.a:0 "Meu bem, você já beijou um [ROOT.Char.GetWomanMan] #EMP de verdade#!?"
 intrigue_temptation.3130.a.tt_fail:0 "[rival_spouse.GetFirstNameNoTooltip] se afasta"
 intrigue_temptation.3130.a.tt_success:0 "Um beijo, depois outro..."
 intrigue_temptation.3130.b:0 "Não consigo fazer isso."
 intrigue_temptation.3130.desc:0 "[rival_main.Custom2('MyCharacterIntroduction', ROOT.Char)|U] desperta em mim uma raiva tão cega que, em certos dias, mal lembro por que somos rivais. Agora isso pouco importa: tenho [rival_spouse.GetFirstName], [rival_main.GetHerHis] [rival_spouse.GetWifeHusband], em meus braços, com as paixões à flor da pele.\n\nEm breve, entre meus sorrisos maliciosos e alguns fofoqueiros bem pagos, [rival_main.GetFirstNameNoTooltip] ficará sabendo. Farei #EMP questão#! de que saiba.\n\nUm beijo proibido selará esta rivalidade."
 intrigue_temptation.3130.t:0 "De Coração Frio"
 intrigue_temptation.3140.a:0 "Acho que poderia olhar um pouco mais nos olhos..."
 intrigue_temptation.3140.b:0 "Um toque demorado provoca a alma."
 intrigue_temptation.3140.c:0 "Só meu olhar poderia encantar até [ROOT.Char.GetFaith.DevilName]!"
 intrigue_temptation.3140.d:0 "Tudo isso está abaixo de mim."
 intrigue_temptation.3140.desc:0 "Esta manhã, tive um encontro delicioso com uma pessoa jovem e encantadora que trabalha como [ROOT.Char.Custom('OppositeGenderedLowlyServantType')]. Brincamos, rimos e nos despedimos de coração leve, tudo porque fiz um esforço para ser um pouco mais agradável.\n\nTalvez eu possa usar essa confiança para flertar em algo além de meus assuntos pessoais?"
 intrigue_temptation.3140.t:0 "Exibindo os Encantos"
 intrigue_temptation.3150.a:0 "Ora, [primary_seducee.GetFirstNameNoTooltip], não tinha visto você aí!"
 intrigue_temptation.3150.b:0 "Já estávamos de saída. Para um lugar mais #EMP reservado#!."
 intrigue_temptation.3150.b.tt_failure:0 "O clima é arruinado"
 intrigue_temptation.3150.b.tt_success:0 "[primary_seducee.GetFirstNameNoTooltip] sorri com malícia e segue você"
 intrigue_temptation.3150.c:0 "... [secondary_seducee.GetFirstNameNoTooltip], feche a porta."
 intrigue_temptation.3150.c.tt_failure:0 "Seguem-se acusações amargas"
 intrigue_temptation.3150.c.tt_success:0 "Você leva os dois para a cama"
 intrigue_temptation.3150.c.tt_success.lovers:0 "Torno-me amante de ambos."
 intrigue_temptation.3150.desc:0 "O aposento está mal iluminado, e [primary_seducee.GetTitledFirstName] e eu estamos colados, com os lábios quase se tocando. O ar da noite é frio, mas seu corpo parece arder ao toque, e sua respiração é curta e entrecortada.\n\nJustamente no pior momento possível, [secondary_seducee.Custom2('MyCharacterIntroduction', ROOT.Char)] entra no [ROOT.Char.Custom('GetRoom')], já esbravejando.\n\n"
 intrigue_temptation.3150.t:0 "Flagrados no Ato"
 intrigue_temptation.3160.a:0 "Avanço e beijo [sometime_rival.GetHerHim]."
 intrigue_temptation.3160.a.tt_fail:0 "Com repulsa, [sometime_rival.GetShortUINameNoTooltip] afasta você"
 intrigue_temptation.3160.a.tt_success:0 "Apesar da surpresa, [sometime_rival.GetShortUINameNoTooltip] corresponde"
 intrigue_temptation.3160.a.tt_success.tt:0 "Depois, esclarecemos nossos sentimentos."
 intrigue_temptation.3160.b:0 "Você não merece nem a atenção do cachorro, quanto mais a minha."
 intrigue_temptation.3160.desc:0 "\"[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('sometime_rival'))|U] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('sometime_rival'))]!\", grita [sometime_rival.GetTitledFirstName], cuspindo saliva daquela boca imunda. Parece ter desenvolvido uma verdadeira vendeta, mas a discussão de hoje está especialmente acalorada. E cheia de perdigotos.\n\nEnquanto [sometime_rival.GetTitledFirstNameNoTooltip] se enfurece, de rosto vermelho e respiração pesada, juro que seu olhar desce por meu corpo por um instante antes de voltar a encontrar o meu.\n\nSerá #EMP mesmo#! raiva o que vejo em seu rosto?"
 intrigue_temptation.3160.t:0 "Extremos da Paixão"
 intrigue_temptation.3161.a:0 "Talvez nós dois sempre tenhamos desejado isso?"
 intrigue_temptation.3161.b:0 "Já tive noites melhores sentado na latrina!"
 intrigue_temptation.3161.b_flavour:0 "Pego suas roupas e saio do quarto gargalhando."
 intrigue_temptation.3161.c:0 "Sufoco [sometime_rival.GetHerHim] enquanto [sometime_rival.GetSheHe] dorme."
 intrigue_temptation.3161.desc:0 "Horas depois, nós dois estamos na cama, completamente exaustos, cercados por lençóis rasgados e móveis quebrados. Pela primeira vez em uma semana, [sometime_rival.GetTitledFirstNameNoTooltip] e eu finalmente paramos de discutir.\n\nSeu peito sobe e desce em um ritmo cada vez mais lento; a qualquer momento, [sometime_rival.GetSheHe] certamente adormecerá."
