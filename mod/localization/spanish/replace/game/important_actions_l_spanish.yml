 action_grant_vassal_to_rightful_liege_HELP:0 "\n\n#help [vassals|E] de quem você não é o Senhor Feudal Legítimo fornecem menos recursos e têm uma [opinion|E] reduzida de você. Às vezes, é melhor conceder esses Vassalos ao seu Senhor Feudal Legítimo, presumindo que eles também sejam seus Vassalos.\n\nÀs vezes, conceder um Vassalo ao seu Senhor Feudal Legítimo significa que você ganhará menos, mas geralmente vale a pena concedê-los - o Senhor Feudal Legítimo terá uma grande penalidade de Opinião em relação a você por manter um Vassalo que eles acham que é deles.\n\nManter uma boa estrutura de vassalos é a chave para um reino estável.#!"
