 TLFR_CROWN_AUTHORITY_TIP:0 "#help A maneira mais confiável de evitar isso é aumentando a sua [crown_authority|E] para [GetLaw('crown_authority_2').GetName]. Dito isso, pode ser que o vassalo em questão não tenha filhos legítimos. Se eles estiverem [Concept('married', 'Casados')|E] e férteis, o problema pode se resolver por si só.#!"
 TLFR_FOREIGN_RULER_SUCCESSION_TIPS:0 "#help Se um Vassalo obtiver um título em um reino estrangeiro de uma [title_rank|E] superior ao seu [primary_title|E] atual, ele deixará de ser seu Vassalo.\n\nÉ possível evitar que as terras do Vassalo saiam do seu reino fazendo o seguinte:\n$BULLET_WITH_TAB$[Concept( 'revoke', 'Revogando' )|E] os Títulos do Vassalo\n$BULLET_WITH_TAB$Concedendo ao Vassalo um Título equivalente em [Concept('title_tier', 'Nível do Título')|E] ao que ele herdará#!"
 USING_CB_TRIGGER:0 "[casus_belli|E] é $CASUS_BELLI$"
 WAR_DAYS_TRIGGER:0 "Dias gastos em [war|E] é $COMPARATOR$ $NUM|V0$"
 action_above_domain_limit:0 "@domain_icon! Acima do [domain_limit|E]"
 action_above_domain_limit_click:0 "#I Clique para mostrar seus Títulos#!"
 action_above_domain_limit_desc:0 "Você está [actor.GetDomainLimitOverrunWithoutGracePeriod|V] [holdings|E] acima do seu limite de [domain|E] de [actor.GetDomainLimit|V], o que reduzirá seus [taxes|E] e [levies|E].\n\n#help Como um [ruler|E], você só pode manter uma quantidade limitada de Propriedades. O resto das Propriedades em seu [realm|E] deve ser mantido por seus [vassals|E].\n\nVocê deve conceder alguns dos seus [titles|E] com Propriedades. [courtiers|E] e [guests|E] são uma boa escolha, já que serão fracos. Vassalos existentes também podem aceitar Títulos, mas então se tornarão mais fortes e podem apresentar uma ameaça no futuro!#!"
 action_above_domain_limit_label:0 "@domain_icon! Acima do [domain_limit|E]"
