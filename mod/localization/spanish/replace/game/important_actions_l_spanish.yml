 action_excommunicated_recovery_desc:0 "Você está [excommunicated|E]. O [GetModifier('recent_excommunication').GetNameWithTooltip] [modifier|E] bloqueia a absolvição por um ano após a excomunhão.\n\n$EFFECT_LIST_BULLET$Duques e abaixo (excomunhão local): use #high Fazer Declaração de Arrependimento #! com um clérigo #weak válido (seu [head_of_faith|E] se nenhum clérigo inferior estiver acima de você)#!\n$EFFECT_LIST_BULLET$Todos [rulers|E] excomungados por seu [head_of_faith|E], ou governando um reino ou império: peticione pessoalmente e escolha #high Retirar Excomunhão #![AddLocalizationIf( GetPlayer.IsIndependentRuler, 'action_excommunicated_recovery_independent_help' )]\n\nConsulte [Concept( 'excommunicated_recovery', 'recovery options' )|E] para todos os detalhes."
