 ARMY_SUPPLY_TRIGGER:0 "[supply|E] é: $COMPARATOR$ $NUM|V0$"
 CALL_TO_WAR_HELP:0 "\n\n#help Chamar outros [rulers|E] para a sua guerra significa que é mais provável que você vença, mas esteja ciente de que você deve gastar [prestige|E] para cada [ally|E] que se juntar. Convocar membros da [dynasty|E] custa [dynasty_prestige|E], enquanto membros da [house|E] se juntarão a você gratuitamente - se aceitarem seu chamado.#!"
 CREATE_USURP_TITLE_PROS_CONS:0 "\n$BULLET_WITH_TAB$Você pode aumentar sua [rank|E]\n$BULLET_WITH_TAB$Você obterá [casus_bellis|E] [de_jure|E]\n$BULLET_WITH_TAB$Seus [vassals|E] podem considerá-lo seu [rightful_liege|E]\n$BULLET_WITH_TAB$Você ganhará [prestige|E]\n\nNo entanto, existem algumas desvantagens:\n$BULLET_WITH_TAB$Seus vassalos podem desejar o Título\n$BULLET_WITH_TAB$Seu [realm|E] possui uma [succession_law|E] com múltiplos [realm_heirs|E], isso afetará quem herda quais Títulos."
 GENERAL_MARRIAGE_ACTION_HEIR_HELP:0 "#help Se você não tem um [player_heir|E], o jogo terminará quando você morrer. Arranjar um bom casamento para seu herdeiro garante a continuidade de sua linhagem a longo prazo. Também pode lhe dar uma [alliance|E] com outro [realm|E]#!"
 GENERAL_MARRIAGE_ACTION_HELP:0 "#help Se você não tem um [player_heir|E], o jogo terminará quando você morrer. Ser casado garante que haja filhos [Concept('legitimate', 'Legítimos')|E] suficientes. Um bom cônjuge também pode ajudá-lo a governar seu [realm|E] ou fornecer uma [alliance|E] forte.#!"
 HAS_CB_ON_TARGET_TRIGGER:0 "Tem um $CASUS_BELLI$ em [TARGET_CHARACTER.GetShortUIName|U]"
 IMPORTANT_ACTION_CLICK_TO_DISMISS:0 "#I Clique com o botão direito para dispensar tudo#!"
 IMPORTANT_ACTION_CLICK_TO_EXPAND:0 "#I Clique para mostrar tudo#!"
 IMPORTANT_ACTION_CLICK_TO_HIDE:0 "#I Clique para esconder tudo#!"
