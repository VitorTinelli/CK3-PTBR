 action_has_any_display_cb_on_HELP:0 "\n\n#help Se o seu exército e [allies|E] forem mais fortes do que o seu inimigo, a guerra pode ser muito benéfica. Você pode conquistar [titles|E], expandir seu [realm|E] e ganhar [prestige_experience|E].\n\nNo entanto, as guerras são custosas, especialmente se você tiver que admitir a [defeat|E]. Vizinhos ambiciosos podem aproveitar-se do enfraquecimento do seu reino.#!"
