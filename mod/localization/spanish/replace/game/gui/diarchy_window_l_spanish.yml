 diarch.succession_offence.medium_succession.guts:0 "A pontuação de sucessão medíocre de [ROOT.Char.GetShortUINamePossessiveNoTooltip|U] irá ofender um pouco [Select_CString(ROOT.Char.GetLiege.IsLocalPlayer, 'seu', 'seu' )] ([ROOT.Char.GetLiege.MakeScope.ScriptValue('number_of_courtly_vassals')|V0]) [vassals|E] [GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName], fazendo com que eles percam [EmptyScope.ScriptValue('courtly_offence_somewhat_offend_value')|N0] [opinion|E] de [Select_CString(ROOT.Char.GetLiege.IsLocalPlayer, 'você', ROOT.Char.GetLiege.GetHerHim )]"
