 papabile_filter_tag_desc:0 "Interações de [cardinal|E]"
 theocratic_elective_pious:0 "O Piedoso"
 theocratic_elective_pious_desc:0 "#flavor O Colégio deve apresentar um nome que ninguém possa chamar de indigno, um cardeal cuja vida já pareça a de um santo.#!\n\nPara se tornar #EMP $theocratic_elective_pious$#!, destaque-se acima de qualquer outro [cardinal|E] em santidade. A [piety_level|E] tem de longe o maior peso, seguida pela [learning|E] e pelo quanto você avançou como [GetTrait('lifestyle_scholar').GetName( GetPlayer )], [GetTrait('pilgrim').GetName( GetPlayer )] ou [GetTrait('lifestyle_mystic').GetName( GetPlayer )]. Uma única [sin|E] em seu nome custa mais do que uma [virtue|E] rende.[GetPlayer.Custom('GetPamPapabileOwnScorePious')]"
 theocratic_elective_populist:0 "O Populista"
 theocratic_elective_populist_desc:0 "#flavor Um Papa a quem os fiéis não seguem não é Papa algum, então o Colégio apresenta um nome já aclamado nas ruas.#!\n\nPara se tornar #EMP $theocratic_elective_populist$#!, destaque-se acima de qualquer outro [cardinal|E] em fama. Aumente seu [prestige_level|E] e [diplomacy|E], mantenha a [friends|E] dentro da [college_of_cardinals|E], tenha [personal_tenets|E] com alta [tenet_popularity|E] e use a [GetDecision('pam_promulgate_word_of_pious_deeds_decision').GetName] [decision|E].[GetPlayer.Custom('GetPamPapabileOwnScorePopulist')]"
 theocratic_elective_powerful:0 "O Poderoso"
 theocratic_elective_powerful_desc:0 "#flavor O Trono de São Pedro tem inimigos assim como seguidores, então o Colégio apresenta um prelado com os meios necessários para mantê-lo.#!\n\nPara se tornar #EMP $theocratic_elective_powerful$#!, destaque-se acima de qualquer outro [cardinal|E] em peso mundano. Veja sua [rite|E] se espalhar por mais [counties|E], detenha [holy_sites|E], aumente sua [dynasty_prestige_level|E] — ou use a #V #TOOLTIP:tt_increase_papabile_score_interaction [GetPlayer.GetPlayerInteractionName('increase_papabile_score_interaction')|L]#!#! [character_interaction|E] para comprar seu caminho até a frente.[GetPlayer.Custom('GetPamPapabileOwnScorePowerful')]"
 tt_increase_papabile_score_interaction:0 "[GetPlayer.GetPlayerInteractionTooltip('increase_papabile_score_interaction')]"
