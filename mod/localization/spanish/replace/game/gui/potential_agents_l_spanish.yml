 agent_alchemist:0 "Alquimista"
 agent_alchemist_desc:0 "#WEAK Este mundo é apenas um turbilhão de substâncias estranhas! Um vórtice de forças incognoscíveis! Com entendimento, a Criação pode vir a estar sob o comando de alguém...#!\n$EFFECT_LIST_BULLET$ Fornece [success_chance_max_i] [scheme_potential|E]\n$EFFECT_LIST_BULLET$ Requer [learning_i] [learning|E]\n$EFFECT_LIST_BULLET$ #P Se beneficia#! de [traits|E] como [GetTrait('lifestyle_physician').GetName( GetNullCharacter )] e [GetTrait('eccentric').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Sofre#! com [traits|E] como [GetTrait('content').GetName( GetNullCharacter )] e [GetTrait('cynical').GetName( GetNullCharacter )]"
 agent_alchemist_i:0 "[success_chance_max_i]"
 agent_alibi:0 "Álibi"
 agent_alibi_desc:0 "#WEAK Absurdo! Eles estavam comigo a noite toda, posso jurar isso. Você sabe que minha palavra é boa.#!\n$EFFECT_LIST_BULLET$ Fornece [secrecy_i] [secrecy|E]\n$EFFECT_LIST_BULLET$ Requer [diplomacy_i] [diplomacy|E] & [learning_i] [learning|E]\n$EFFECT_LIST_BULLET$ #P Se beneficia#! de [traits|E] como [GetTrait('honest').GetName( GetNullCharacter )] e [GetTrait('loyal').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Sofre#! com [traits|E] como [GetTrait('deceitful').GetName( GetNullCharacter )] e [GetTrait('disloyal').GetName( GetNullCharacter )]"
 agent_alibi_i:0 "[secrecy_i]"
 agent_amanuensis:0 "Amanuense"
 agent_amanuensis_desc:0 "#WEAK Um secretário está sempre presente, sempre ignorado, sempre rabiscando em um canto algo ou outro...#!\n$EFFECT_LIST_BULLET$ Fornece [secrecy_i] [secrecy|E]\n$EFFECT_LIST_BULLET$ Requer [learning_i] [learning|E] & [stewardship_i] [stewardship|E]\n$EFFECT_LIST_BULLET$ #P Se beneficia#! de [traits|E] como [GetTrait('paranoid').GetName( GetNullCharacter )] e [GetTrait('diligent').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Sofre#! com [traits|E] como [GetTrait('lazy').GetName( GetNullCharacter )] e [GetTrait('profligate').GetName( GetNullCharacter )]"
 agent_amanuensis_i:0 "[secrecy_i]"
 agent_ambusher:0 "Embuscador"
 agent_ambusher_desc:0 "#WEAK Acertar primeiro, acertar forte, acertar inesperadamente, e se tudo der certo, você não precisará acertar duas vezes.#!\n$EFFECT_LIST_BULLET$ Fornece [success_chance_max_i] [scheme_potential|E]\n$EFFECT_LIST_BULLET$ Requer [intrigue_i] [intrigue|E] & [martial_i] [martial|E]\n$EFFECT_LIST_BULLET$ #P Se beneficia#! de [traits|E] como [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] e [GetTrait('schemer').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Sofre#! com [traits|E] como [GetTrait('compassionate').GetName( GetNullCharacter )] e [GetTrait('just').GetName( GetNullCharacter )]"
 agent_ambusher_i:0 "[success_chance_max_i]"
 agent_assassin:0 "Assassino"
 agent_assassin_desc:0 "#WEAK Faca, veneno ou garrote de camponês — desde que não respirem até o amanhecer, tanto faz pra mim.#!\n$EFFECT_LIST_BULLET$ Fornece [success_chance_max_i] [scheme_potential|E]\n$EFFECT_LIST_BULLET$ Requer [prowess_i] [prowess|E] & [intrigue_i] [intrigue|E]\n$EFFECT_LIST_BULLET$ #P Se beneficia#! de [traits|E] como [GetTrait('sadistic').GetName( GetNullCharacter )] e [GetTrait('patient').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Sofre#! de [traits|E] como [GetTrait('compassionate').GetName( GetNullCharacter )] e [GetTrait('impatient').GetName( GetNullCharacter )]"
 agent_assassin_i:0 "[success_chance_max_i]"
 agent_bailiff:0 "Oficial de Justiça"
 agent_bailiff_desc:0 "#WEAK Nossa função não é avaliar o que é certo — simplesmente aplicar o que está escrito.#!\n$EFFECT_LIST_BULLET$ Fornece [success_chance_max_i] [scheme_potential|E]\n$EFFECT_LIST_BULLET$ Requer [diplomacy_i] [diplomacy|E] & [learning_i] [learning|E]\n$EFFECT_LIST_BULLET$ #P Se beneficia#! de [traits|E] como [GetTrait('just').GetName( GetNullCharacter )] e [GetTrait('overseer').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Sofre#! com [traits|E] como [GetTrait('content').GetName( GetNullCharacter )] e [GetTrait('shy').GetName( GetNullCharacter )]"
 agent_bailiff_i:0 "[success_chance_max_i]"
 agent_bodyguard:0 "Guarda Costas"
 agent_bodyguard_desc:0 "#WEAK Uma boa espada ao alcance é muito mais eficaz se já houver um braço segurando-a.#!\n$EFFECT_LIST_BULLET$ Fornece [success_chance_max_i] [scheme_potential|E]\n$EFFECT_LIST_BULLET$ Requer [prowess_i] [prowess|E] & [martial_i] [martial|E]\n$EFFECT_LIST_BULLET$ #P Se beneficia#! de [traits|E] como [GetTrait('strong').GetName( GetNullCharacter )] e [GetTrait('physique_good_3').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Sofre#! com [traits|E] como [GetTrait('craven').GetName( GetNullCharacter )] e [GetTrait('weak').GetName( GetNullCharacter )]"
 agent_bodyguard_i:0 "[success_chance_max_i]"
 agent_bookkeeper:0 "Contador"
 agent_bookkeeper_desc:0 "#WEAK Oh, as contas? Sim, elas conferem. Claro, claro...#!\n$EFFECT_LIST_BULLET$ Fornece [success_chance_max_i] [scheme_potential|E]\n$EFFECT_LIST_BULLET$ Requer [learning_i] [learning|E] & [stewardship_i] [stewardship|E]\n$EFFECT_LIST_BULLET$ #P Se beneficia#! de [traits|E] como [GetTrait('scholar').GetName( GetNullCharacter )] e [GetTrait('theologian').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Sofre#! com [traits|E] como [GetTrait('arbitrary').GetName( GetNullCharacter )] e [GetTrait('lazy').GetName( GetNullCharacter )]"
 agent_bookkeeper_i:0 "[success_chance_max_i]"
 agent_bureaucrat:0 "Burocrata"
 agent_bureaucrat_desc:0 "#WEAK Conhecimento do processo adequado e do arquivamento correto oferece oportunidades irrestritas para desonestidade construtiva.#!\n$EFFECT_LIST_BULLET$ Reduz a [scheme_speed_i] [scheme_speed|E]\n$EFFECT_LIST_BULLET$ Requer [learning_i] [learning|E] & [stewardship_i] [stewardship|E]\n$EFFECT_LIST_BULLET$ #P Se beneficia#! de [traits|E] como [GetTrait('architect').GetName( GetNullCharacter )] e [GetTrait('paranoid').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Sofre#! com [traits|E] como [GetTrait('lazy').GetName( GetNullCharacter )] e [GetTrait('impatient').GetName( GetNullCharacter )]"
 agent_bureaucrat_i:0 "[scheme_speed_i]"
 agent_bureaucrat_title:0 "$agent_bureaucrat$"
 agent_bureaucrat_title_desc:0 "$agent_bureaucrat_desc$"
 agent_bureaucrat_title_i:0 "$agent_bureaucrat_i$"
 agent_changeling:0 "Mudança"
 agent_changeling_desc:0 "Um agente conhecido por seu dinamismo."
 agent_cleric:0 "Clérigo"
 agent_cleric_desc.flavour:0 "#WEAK A fé exige fogo como a terra anseia por chuva. Eles podem existir à parte, mas um é mais pobre por isso.#!"
 agent_cleric_desc.requirements:0 "$EFFECT_LIST_BULLET$ Requer [diplomacy_i] [diplomacy|E] & [learning_i] [learning|E]\n$EFFECT_LIST_BULLET$ #P Se beneficia#! de [traits|E] como [GetTrait('zealous').GetName( GetNullCharacter )] e [GetTrait('diligent').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Sofre#! com [traits|E] como [GetTrait('cynical').GetName( GetNullCharacter )] e [GetTrait('lazy').GetName( GetNullCharacter )]"
 agent_cleric_desc:0 "$agent_cleric_desc.flavour$\n$EFFECT_LIST_BULLET$ Reduz a [scheme_speed_i] [scheme_speed|E]\n$agent_cleric_desc.requirements$"
 agent_cleric_i:0 "[scheme_speed_i]"
 agent_cleric_success:0 "$agent_cleric$"
 agent_cleric_success_desc:0 "$agent_cleric_desc.flavour$\n$EFFECT_LIST_BULLET$ Fornece [success_chance_max_i] [scheme_potential|E]\n$agent_cleric_desc.requirements$"
 agent_cleric_success_i:0 "[success_chance_max_i]"
 agent_comrade_in_arms:0 "Camarada de Armas"
 agent_comrade_in_arms_desc:0 "#WEAK Depois de alguns minutos, vou \"lembrar\" que deixei meu medalhão cair e sairei, deixando vocês dois para... conversar em particular.#!\n$EFFECT_LIST_BULLET$ Fornece [success_chance_max_i] [scheme_potential|E]\n$EFFECT_LIST_BULLET$ Requer [diplomacy_i] [diplomacy|E] & [intrigue_i] [intrigue|E]\n$EFFECT_LIST_BULLET$ #P Se beneficia#! de [traits|E] como [GetTrait('gregarious').GetName( GetNullCharacter )] e [GetTrait('deceitful').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Sofre#! de [traits|E] como [GetTrait('shy').GetName( GetNullCharacter )] e [GetTrait('honest').GetName( GetNullCharacter )]"
 agent_comrade_in_arms_i:0 "[success_chance_max_i]"
 agent_courtesan:0 "Cortesã"
 agent_courtesan_desc:0 "#WEAK Você pensaria que os Grandes e os Bons já teriam aprendido a ter cuidado com quem revelam segredos. Eles não aprenderam.#!\n$EFFECT_LIST_BULLET$ Fornece [secrecy_i] [secrecy|E]\n$EFFECT_LIST_BULLET$ Requer [diplomacy_i] [diplomacy|E] & [intrigue_i] [intrigue|E]\n$EFFECT_LIST_BULLET$ #P Se beneficia#! de [traits|E] como [GetTrait('beauty_good_3').GetName( GetNullCharacter )] e [GetTrait('lustful').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Sofre#! com [traits|E] como [GetTrait('beauty_bad_3').GetName( GetNullCharacter )] e [GetTrait('chaste').GetName( GetNullCharacter )]"
 agent_courtesan_i:0 "[secrecy_i]"
 agent_decoy:0 "Isca"
 agent_decoy_desc:0 "#WEAK Um cálice derramado, uma piada bem-timed, um desafio ousado para um duelo. Todos os olhares são desviados, ninguém suspeitando da verdadeira jogada se desenrolando nas sombras.#!\n$EFFECT_LIST_BULLET$ Fornece [secrecy_i] [secrecy|E]\n$EFFECT_LIST_BULLET$ Requer [intrigue|E] & [diplomacy|E]\n$EFFECT_LIST_BULLET$ #P Se beneficia#! de [traits|E] como [GetTrait('gregarious').GetName( GetNullCharacter )] e [GetTrait('eccentric').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Sofre#! com [traits|E] como [GetTrait('lazy').GetName( GetNullCharacter )] e [GetTrait('content').GetName( GetNullCharacter )]"
 agent_decoy_i:0 "[secrecy_i]"
 agent_devotee:0 "Devoto"
 agent_devotee_desc:0 "#WEAK Você já ouviu falar do meu líder, meu bravo e justo senhor? Meu benevolente soberano? Onde quer que eles vão, eu os seguirei.#!\n$EFFECT_LIST_BULLET$ Fornece [success_chance_max_i] [scheme_potential|E]\n$EFFECT_LIST_BULLET$ Requer [intrigue_i] [intrigue|E] & [diplomacy_i] [diplomacy|E]\n$EFFECT_LIST_BULLET$ #P Se beneficia#! de [traits|E] como [GetTrait('gregarious').GetName( GetNullCharacter )] e [GetTrait('eccentric').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Sofre#! com [traits|E] como [GetTrait('shy').GetName( GetNullCharacter )] e [GetTrait('callous').GetName( GetNullCharacter )]"
 agent_devotee_i:0 "[success_chance_max_i]"
 agent_diplomat:0 "Diplomata"
 agent_diplomat_desc:0 "#WEAK Algumas situações exigem um toque delicado, e não há nada mais sutil do que palavras sussurradas em particular.#!\n$EFFECT_LIST_BULLET$ Fornece [success_chance_max_i] [scheme_potential|E]\n$EFFECT_LIST_BULLET$ Requer [diplomacy_i] [diplomacy|E] & [intrigue_i] [intrigue|E]\n$EFFECT_LIST_BULLET$ #P Se beneficia#! de [traits|E] como [GetTrait('deceitful').GetName( GetNullCharacter )] e [GetTrait('gregarious').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Sofre#! com [traits|E] como [GetTrait('honest').GetName( GetNullCharacter )] e [GetTrait('shy').GetName( GetNullCharacter )]"
 agent_diplomat_i:0 "[success_chance_max_i]"
 agent_draughtsman:0 "Desenhista"
 agent_draughtsman_desc:0 "#WEAK Um arquiteto de máquinas, um engenheiro extraordinário que pode tornar qualquer uma de suas ideias uma realidade... pelo menos, no papel.#!\n$EFFECT_LIST_BULLET$ Fornece [success_chance_max_i] [scheme_potential|E]\n$EFFECT_LIST_BULLET$ Requer [learning_i] [learning|E] & [stewardship_i] [stewardship|E]\n$EFFECT_LIST_BULLET$ #P Se beneficia#! de [traits|E] como [GetTrait('architect').GetName( GetNullCharacter )] e [GetTrait('journaller').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Sofre#! com [traits|E] como [GetTrait('content').GetName( GetNullCharacter )] e [GetTrait('lazy').GetName( GetNullCharacter )]"
 agent_draughtsman_i:0 "[success_chance_max_i]"
 agent_drillmaster:0 "Mestre de Drill"
 agent_drillmaster_desc:0 "#WEAK Lembre-se: treinamos no nosso melhor para que possamos lutar no nosso pior.#!\n$EFFECT_LIST_BULLET$ Reduz a [scheme_speed_i] [scheme_speed|E]\n$EFFECT_LIST_BULLET$ Requer [martial_i] [martial|E]\n$EFFECT_LIST_BULLET$ #P Se beneficia#! de [traits|E] como [GetTrait('diligent').GetName( GetNullCharacter )] e [GetTrait('patient').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Sofre#! com [traits|E] como [GetTrait('content').GetName( GetNullCharacter )] e [GetTrait('lazy').GetName( GetNullCharacter )]"
 agent_drillmaster_i:0 "[scheme_speed_i]"
 agent_eunuch:0 "Eunucos"
 agent_eunuch_desc:0 "#WEAK Silencioso como a passagem da lua, ele se move pelos corredores de mármore, um guardião de segredos em uma terra onde as palavras são moeda. Na sombra dos imperadores, ele sussurra, moldando o destino do império com nada além do mais suave murmúrio.#!\n$EFFECT_LIST_BULLET$ Fornece [success_chance_max_i] [scheme_potential|E]\n$EFFECT_LIST_BULLET$ Requer [intrigue_i] [intrigue|E] & [learning_i] [learning|E]\n$EFFECT_LIST_BULLET$ #P Se beneficia#! de [traits|E] como [GetTrait('deceitful').GetName( GetNullCharacter )] e [GetTrait('patient').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Sofre#! com [traits|E] como [GetTrait('compassionate').GetName( GetNullCharacter )] e [GetTrait('honest').GetName( GetNullCharacter )]"
 agent_eunuch_i:0 "[success_chance_max_i]"
 agent_eunuch_speed:0 "Eunuco"
 agent_eunuch_speed_desc:0 "#WEAK Silencioso como a passagem da lua, ele se move pelos salões de mármore, um guardião de segredos em uma terra onde as palavras são moeda. À sombra dos imperadores, ele sussurra, moldando o destino do império com nada além do mais suave murmúrio.#!\n$EFFECT_LIST_BULLET$ Fornece [secrecy_i] [secrecy|E]\n$EFFECT_LIST_BULLET$ Requer [intrigue_i] [intrigue|E] & [learning_i] [learning|E]\n$EFFECT_LIST_BULLET$ #P Se beneficia#! de [traits|E] como [GetTrait('deceitful').GetName( GetNullCharacter )] e [GetTrait('patient').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Sofre#! com [traits|E] como [GetTrait('compassionate').GetName( GetNullCharacter )] e [GetTrait('honest').GetName( GetNullCharacter )]"
