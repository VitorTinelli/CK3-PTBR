 COURT_GRANDEUR_TOOLTIP_AT_EXPECTATION_IGNORE_GRACE:0 "Em [CourtGrandeurData.GetGracePeriodEndDate.GetTimeDiffFromNow], este tribunal cairá para o seu [court_grandeur_level|E] esperado, removendo os efeitos positivos de estar acima das expectativas"
 COURT_GRANDEUR_TOOLTIP_BELOW_EXPECTATION:0 "@warning_icon! #X Esta Corte está [Subtract_int32( CourtGrandeurData.GetMinimumExpectedLevel, CourtGrandeurData.GetCurrentLevel )] [Select_CString( EqualTo_int32( Subtract_int32( CourtGrandeurData.GetMinimumExpectedLevel, CourtGrandeurData.GetCurrentLevel ), '(int32)1' ), 'nível', 'níveis' )] abaixo do nível de Grandeza esperado, causando os seguintes efeitos:\n#!$COURT_GRANDEUR_EXPECTATION_EFFECTS$"
 COURT_GRANDEUR_TOOLTIP_BELOW_EXPECTATION_IGNORE_GRACE:0 "@warning_icon! #X Em [CourtGrandeurData.GetGracePeriodEndDate.GetTimeDiffFromNow], este tribunal cairá para [Subtract_int32(CourtGrandeurData.GetMinimumExpectedLevel, CourtGrandeurData.GetCurrentLevelIgnoreGrace)] [Select_CString(EqualTo_int32(Subtract_int32(CourtGrandeurData.GetMinimumExpectedLevel, CourtGrandeurData.GetCurrentLevelIgnoreGrace), '(int32)1' ), 'nível', 'níveis' )] abaixo do seu [court_grandeur_level|E] esperado, causando os seguintes efeitos:\n#!$COURT_GRANDEUR_EXPECTATION_EFFECTS_IGNORE_GRACE$"
 ELLIPSIS:0 "..."
 EXPECTED_LEVEL_MARKER_ABOVE:0 "$EXPECTED_LEVEL_MARKER_DIFFERENCE_ABS$ Acima das expectativas"
