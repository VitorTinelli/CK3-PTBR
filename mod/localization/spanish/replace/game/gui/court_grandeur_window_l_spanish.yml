 COURT_GRANDEUR_TOOLTIP_ABOVE_EXPECTATION:0 "Esta Corte está [Subtract_int32(CourtGrandeurData.GetCurrentLevel, CourtGrandeurData.GetMinimumExpectedLevel )] [Select_CString( EqualTo_int32( Subtract_int32( CourtGrandeurData.GetCurrentLevel, CourtGrandeurData.GetMinimumExpectedLevel ), '(int32)1' ), 'nível', 'níveis' )] acima do seu [court_grandeur_level|E] esperado, causando os seguintes efeitos:\n$COURT_GRANDEUR_EXPECTATION_EFFECTS$"
