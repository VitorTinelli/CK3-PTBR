l_spanish:
 AOV_APPLY:0 "$BARBERSHOP_APPLY$"
 AOV_AUTOMATED:0 "Automatizado"
 AOV_COMPANION_OFF_WARNING:0 "@alert_icon! Essas configurações não têm efeito enquanto $ARMY_AUTOMATION_FEATURE_NAME$ estiver desativado"
 AOV_HEADING:0 "Configurações de $ARMY_AUTOMATION_FEATURE_NAME$"
 AOV_MANUAL:0 "Manual"
 AOV_OPT_BARTERING:0 "Comércio"
 AOV_OPT_BARTERING_AUTOMATED_TT:0 "#T Comércio Automatizado\n#!Seus [barterer|E] [armies|E] irão recrutar e realizar missões de $game_concept_barter$ por conta própria"
 AOV_OPT_BARTERING_MANUAL_TT:0 "#T Comércio Manual\n#!Você controla e recruta seus próprios [barterer|E] [armies|E]"
 AOV_OPT_COMMANDERS:0 "Atribuir Comandantes"
 AOV_OPT_COMMANDERS_AUTOMATED_TT:0 "#T Atribuição Automatizada do $game_concept_commander$\n#![commanders|E] são atribuídos automaticamente aos seus [armies|E]"
 AOV_OPT_COMMANDERS_MANUAL_TT:0 "#T Atribuição Manual do $game_concept_commander$\n#!Você deve atribuir [commanders|E] manualmente aos seus [armies|E]"
 AOV_OPT_COMMANDERS_NOT_PLAYERS:0 "Limitado"
 AOV_OPT_COMMANDERS_NOT_PLAYERS_TT:0 "#T Atribuição Limitada do $game_concept_commander$\n#![commanders|E] são atribuídos automaticamente aos seus [armies|E], mas você nunca é atribuído como $game_concept_commander$"
 AOV_OPT_HIRING:0 "Contratação de Tropas"
 AOV_OPT_HIRING_EXTEND:0 "Somente Estender"
 AOV_OPT_HIRING_EXTEND_TT:0 "#T Extensão Automatizada de Contratos de Mercenários\n#![mercenary_contracts|E] serão estendidos se necessário para o esforço de guerra"
 AOV_OPT_HIRING_FULL:0 "Contratar e Estender"
 AOV_OPT_HIRING_FULL_TT:0 "#T Contratação Automatizada\n#![mercenaries|E], [holy_orders|E] e [provincial_armies|E] serão pagos automaticamente, e [mercenary_contracts|E] serão estendidos se necessário para o esforço de guerra"
 AOV_OPT_HIRING_MANUAL_TT:0 "#T Contratação Manual\n#!Você deve pagar manualmente para [mercenaries|E], [holy_orders|E] e [provincial_armies|E]"
 AOV_OPT_RAIDING:0 "Saques"
 AOV_OPT_RAIDING_AUTOMATED_TT:0 "#T Saques Automatizados\n#!Seus [armies|E] de [raiders|E] serão levantadas e realizarão $game_concept_raids$ por conta própria"
 AOV_OPT_RAIDING_MANUAL_TT:0 "#T Comércio Manual\n#!Você controla e recruta seus próprios [barterer|E] [armies|E]"
 AOV_OPT_WAR_STANCE:0 "Postura de Guerra"
 AOV_OPT_WAR_STANCE_DEFAULT:0 "Adaptativa"
 AOV_OPT_WAR_STANCE_DEFAULT_TT:0 "#T Postura Adaptativa\n#!Seus [armies|E] agirão de forma ofensiva ou defensiva dependendo da situação"
 AOV_OPT_WAR_STANCE_DEFENSIVE:0 "Defensiva"
 AOV_OPT_WAR_STANCE_DEFENSIVE_TT:0 "#T Postura Defensiva\n#!Seus [armies|E] agirão sempre de forma defensiva"
 AOV_OPT_WAR_STANCE_OFFENSIVE:0 "Ofensiva"
 AOV_OPT_WAR_STANCE_OFFENSIVE_TT:0 "#T Postura Ofensiva\n#!Seus [armies|E] agirão sempre de forma ofensiva"
 AOV_SET_TO_DEFAULT:0 "$CHARACTER_RESET_FILTERS$"
 AOV_SET_TO_DEFAULT_TT:0 "[AddLocalizationIf( ArmyAutomationOptionsView.AreDisplayedSettingsDefault, 'AOV_SET_TO_DEFAULT_TT_CONTENT' )]"
 AOV_SET_TO_DEFAULT_TT_CONTENT:0 "@warning_icon! #X Configurações já estão no padrão#!"
 ARMY_AUTOMATION_FEATURE_NAME:0 "Exércitos Automatizados"
 MV_AUTOMATION_SETTINGS_TT:0 "#T Abrir $AOV_HEADING$\n#!Alterar o comportamento padrão para $ARMY_AUTOMATION_FEATURE_NAME$"
 MV_AUTOMATION_TOGGLE_TT:0 "[SelectLocalization( GetPlayer.HasCompanionAI, 'MV_AUTOMATION_TOGGLE_TT_ON', 'MV_AUTOMATION_TOGGLE_TT_OFF' )]"
 MV_AUTOMATION_TOGGLE_TT_CUSTOM_DESC:0 "Se ativado, seus [armies|E] agirão por conta própria, mas são limitadas pelas configurações que você escolheu."
 MV_AUTOMATION_TOGGLE_TT_DEFAULT_DESC:0 "Se ativado, seus [armies|E] serão levantadas e lutarão contra o inimigo por conta própria, e atribuirão seus próprios [commanders|E].\n\nVocê ainda será responsável por comprar [men_at_arms|E], contratar [mercenaries|E] e realizar [raids|E].\n\n#help Exércitos automatizados são destinados a jogadores que não estão familiarizados com a guerra ou que preferem focar sua atenção em outras áreas. Se você é um jogador experiente, recomendamos que controle seus exércitos pessoalmente.#!"
 MV_AUTOMATION_TOGGLE_TT_DESC:0 "[SelectLocalization(GetPlayer.HasDefaultCompanionAISettings, 'MV_AUTOMATION_TOGGLE_TT_DEFAULT_DESC' , 'MV_AUTOMATION_TOGGLE_TT_CUSTOM_DESC')]"
 MV_AUTOMATION_TOGGLE_TT_OFF:0 "#T $ARMY_AUTOMATION_FEATURE_NAME$: #V Desativado#!\n#!$MV_AUTOMATION_TOGGLE_TT_DESC$\n\n#I Clique para ativar a automação#!"
 MV_AUTOMATION_TOGGLE_TT_ON:0 "#T $ARMY_AUTOMATION_FEATURE_NAME$: #V Ativado#!\n#!$MV_AUTOMATION_TOGGLE_TT_DESC$\n\n#I Clique para desativar a automação#!"
