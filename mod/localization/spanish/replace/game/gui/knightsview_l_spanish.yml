 KNIGHTS_VIEW_TITLE_FORBID_TT:0 "#T Proibir que [Character.GetShortUIName] se torne um $knight_culture_player$#!\n\n[Character.GetShortUIName] #emphasis nunca#! poderá se juntar aos seus [armies|E] como um $knight_culture_player_no_tooltip$. Isso mantém [Character.GetSheHe] seguro de morrer em [battle|E]."
