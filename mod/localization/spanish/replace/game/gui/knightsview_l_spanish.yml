l_spanish:
 COURT_POSITIONS_KP:0 "Posições na Corte"
 COURT_POSITIONS_TT:0 "Não permitir posições não-combativas.\n[GetCourtPositionType('bodyguard_court_position').GetName] e [GetCourtPositionType('garuda_court_position').GetName] estão excluídas e sempre podem ser [knights|e], já que são destinadas a ajudar em batalhas"
 CREATE_ACCOLADE_BY_PROWESS_TT:0 "#T Permitir que [CreateAccoladeView.GetSelectedKnight.GetShortUIName] seja um $knight_culture_player$#!\n\n[CreateAccoladeView.GetSelectedKnight.GetShortUIName] pode se juntar aos seus [armies|E] como um $knight_culture_player_no_tooltip$ se a [prowess|E] [CreateAccoladeView.GetSelectedKnight.GetHerHim] estiver entre os maiores do [realm|E]."
 CREATE_ACCOLADE_FORBID_TT:0 "#T Proibir [CreateAccoladeView.GetSelectedKnight.GetShortUIName] de ser um $knight_culture_player$#!\n\n[CreateAccoladeView.GetSelectedKnight.GetShortUIName] pode #emphasis nunca#! se juntar aos seus [armies|E] como um $knight_culture_player_no_tooltip$. Isso mantém [CreateAccoladeView.GetSelectedKnight.GetSheHe] seguro de morrer em [battle|E]."
 CREATE_ACCOLADE_FORCE_TT:0 "#T Forçar [CreateAccoladeView.GetSelectedKnight.GetShortUIName] a ser um $knight_culture_player$#!\n\n[CreateAccoladeView.GetSelectedKnight.GetShortUIName] #emphasis deve#! se juntar aos seus [armies|E] como um $knight_culture_player_no_tooltip$, independentemente da [prowess|E] de [CreateAccoladeView.GetSelectedKnight.GetHerHim]. [CreateAccoladeView.GetSelectedKnight.GetSheHe|U] pode ocupar o lugar de um $knight_culture_player_no_tooltip$ com maior Bravura."
 DECREASE_MIN_PROWESS_KP:0 "Diminuir a [prowess|e] mínima necessária para [knights|e]\n#i Clique com o botão direito para diminuir em 10"
