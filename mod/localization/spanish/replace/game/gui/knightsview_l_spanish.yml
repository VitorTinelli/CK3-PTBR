 KNIGHT_RESTRICTIONS:0 "Outras restrições se aplicam"
 KNIGHT_RESTRICTIONS_TT:0 "#T Restrições de Cavaleiro#!\nApenas seus [vassals|e], [courtiers|e] ou [followers|e] diretos podem servir como [knights|e].\nSua [culture|e] ou [faith|e] determina quais gêneros podem atuar como [knights|e].\n\nUm Cavaleiro não pode ser:\n - Jogador, [child|e], [prisoner|e] ou [GetTrait('incapable').GetName(GetPlayer.Self)]\n - Membro do [clergy|e] (a menos que sua [faith|e] ou [culture|e] permita)\n - [master_assassin|e] ou [GetTrait('blind').GetName(GetPlayer.Self)] (a menos que sua [culture|e] permita ou sejam [GetTrait('order_member').GetName(GetPlayer.Self)])\n - [diarch|e] ou [ceremonial_liege|e]\n - [governor|e] de um [duchy|e] (ou [title|e] superior) ou [house_head|e] de uma [noble_family|e]\n\n[traditions|e] culturais e eventos podem remover algumas restrições"
 KP_CULTURE_ADMIN_FAMILY_KNIGHTS:0 "@check_icon! Sua [culture|e] remove algumas restrições de gênero para [wars|e] defensivas"
 KP_CULTURE_HIGH_PROWESS:0 "@check_icon! Sua [culture|e] remove a maioria das restrições para [knights|e] com pelo menos 10 [prowess|e]"
 KP_CULTURE_MINIMUM_PROWESS:0 "@alert_icon! Sua [culture|e] exige pelo menos 12 [prowess|e]"
