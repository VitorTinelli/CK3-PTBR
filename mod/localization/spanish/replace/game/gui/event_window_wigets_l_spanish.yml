l_spanish:
 event_window_widget_enter_text_prompt:0 "Digite o texto:"
 event_window_widget_harrying:0 "[harrying_resistance|E] Atual: [Character.MakeScope.Var('resistance_gui').GetValue|1V]\n[harrying_pacification|E] Atual: [Character.MakeScope.Var('pacification_gui').GetValue|1V]"
 event_window_widget_harrying_tooltip:0 "O concurso em andamento entre o novo e o antigo resultou em uma guerra não declarada que eclodiu em toda a Inglaterra, com os novos governantes normandos reagindo com severas recriminações às provocações dos nobres anglo-saxões depostos.\n\nÀ medida que a situação avança, as ações que eles e outros personagens tomarem irão governar os níveis de [harrying_resistance|E] e [harrying_pacification|E] da região.\n\n#TS Maior #EMP [harrying_resistance|E]#! levará a:#!\n$EFFECT_LIST_BULLET$Menor [cultural_acceptance|E]\n$EFFECT_LIST_BULLET$Menor [county_control|E]\n$EFFECT_LIST_BULLET$Uma maior chance de [claimant_factions|E] ou até mesmo uma [civil_war|E].\n\n#TS Maior #EMP [harrying_pacification|E]#! levará a:#!\n$EFFECT_LIST_BULLET$Maior [cultural_acceptance|E]\n$EFFECT_LIST_BULLET$Maior [county_control|E]\n$EFFECT_LIST_BULLET$Uma menor chance de [claimant_factions|E]."
 event_window_widget_harrying_tooltip_widget:0 "O [harrying_widget_i]Harrying do Norte rastreia os valores de [harrying_resistance|E] e [harrying_pacification|E]. Esses têm efeitos sobre os dois grupos principais envolvidos na região: o governante normando da Inglaterra e quaisquer vassalos anglo-saxões de nível [duke|E] que possam ter.\n\nMaior [harrying_resistance|E] representa a resistência anglo-saxônica à ocupação normanda, e níveis mais altos podem levar a uma menor aceitação cultural anglo-saxônica/normanda, menor [county_control|E], uma maior chance de [claimant_factions|E] ou até mesmo uma [civil_war|E].\n\nMaior [harrying_pacification|E] pode levar a uma maior aceitação cultural anglo-saxônica/normanda, maior [county_control|E], e menor chance de [claimant_factions|E]."
 event_window_widget_max_stress:0 "#X Maior nível de [stress_level|E] alcançado#!"
