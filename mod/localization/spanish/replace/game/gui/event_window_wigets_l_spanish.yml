 event_window_widget_peasant_leader_tooltip:0 "Os camponeses locais estão em uma luta constante contra seus soberanos. Como um [adventurer|E], você é apenas um espectador. No entanto, se desejar, você pode tomar as rédeas. Decida quem está certo e quem está errado, escolha um lado e apoie-o."
 event_window_widget_peasant_leader_tooltip_widget:0 "Lembrete de quantos [counties|E] você decidiu apoiar ou controlar. Se acabar em guerra, camponeses de todos os condados apoiados se juntarão às suas bandeiras!"
