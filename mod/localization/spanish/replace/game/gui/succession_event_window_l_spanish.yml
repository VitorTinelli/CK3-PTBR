 RANDOM_DESTINY_CHARACTER_TYPE_NAME_random_descendant:0 "um Descendente Aleatório"
 RANDOM_DESTINY_CHARACTER_TYPE_NAME_random_dynasty_member:0 "um Membro da Dinastia Aleatório"
 RANDOM_DESTINY_CHARACTER_TYPE_NAME_random_landed:0 "um Governante Aleatório"
 RANDOM_DESTINY_CHARACTER_TYPE_NAME_random_landed_child:0 "uma Criança de Propriedade Aleatória"
