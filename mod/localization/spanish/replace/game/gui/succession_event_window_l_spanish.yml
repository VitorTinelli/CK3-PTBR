 RANDOM_DESTINY_CHARACTER_TYPE_TOOLTIP_boilerplate_adventurer:0 "A chance de se tornar um [adventurer|E] é de aproximadamente #V 50%#!\n\n"
 RANDOM_DESTINY_CHARACTER_TYPE_TOOLTIP_dlc_boilerplate:0 "#weak [SelectLocalization( HasDlcFeature( 'landless_playable' ), 'RANDOM_DESTINY_CHARACTER_TYPE_TOOLTIP_boilerplate_adventurer', 'blank_line' )]#!"
 RANDOM_DESTINY_CHARACTER_TYPE_TOOLTIP_random_adventurer:0 "Clique para selecionar um membro aleatório da [dynasty|E] [GetPlayer.GetDynasty.GetBaseName] que seja, ou se tornará, um [adventurer|E].\n\n$RANDOM_DESTINY_CHARACTER_TYPE_TOOLTIP_boilerplate$"
 RANDOM_DESTINY_CHARACTER_TYPE_TOOLTIP_random_close_family:0 "Clique para selecionar um membro da [close_family|E] aleatório do seu personagem anterior que faz parte da [dynasty|E] [GetPlayer.GetDynasty.GetBaseName].\n\n$RANDOM_DESTINY_CHARACTER_TYPE_TOOLTIP_dlc_boilerplate$$RANDOM_DESTINY_CHARACTER_TYPE_TOOLTIP_boilerplate$"
 RANDOM_DESTINY_CHARACTER_TYPE_TOOLTIP_random_close_or_extended_family:0 "Clique para selecionar um membro da [close_family|E] ou [extended_family|E] aleatório do seu personagem anterior que faz parte da [dynasty|E] [GetPlayer.GetDynasty.GetBaseName].\n\n$RANDOM_DESTINY_CHARACTER_TYPE_TOOLTIP_dlc_boilerplate$$RANDOM_DESTINY_CHARACTER_TYPE_TOOLTIP_boilerplate$"
 RANDOM_DESTINY_CHARACTER_TYPE_TOOLTIP_random_descendant:0 "Clique para selecionar um Descendente Aleatório: um #V filho#!, #V neto#!, ou #V bisneto#! do seu personagem anterior que faz parte da [dynasty|E] [GetPlayer.GetDynasty.GetBaseName].\n\n$RANDOM_DESTINY_CHARACTER_TYPE_TOOLTIP_dlc_boilerplate$$RANDOM_DESTINY_CHARACTER_TYPE_TOOLTIP_boilerplate$"
 RANDOM_DESTINY_CHARACTER_TYPE_TOOLTIP_random_dynasty_member:0 "Clique para selecionar um membro aleatório da [dynasty|E] [GetPlayer.GetDynasty.GetBaseName].\n\n$RANDOM_DESTINY_CHARACTER_TYPE_TOOLTIP_dlc_boilerplate$$RANDOM_DESTINY_CHARACTER_TYPE_TOOLTIP_boilerplate$"
 RANDOM_DESTINY_CHARACTER_TYPE_TOOLTIP_random_landed:0 "Clique para selecionar um membro aleatório da [dynasty|E] [GetPlayer.GetDynasty.GetBaseName] que seja um [ruler|E] [landed|E].\n\n$RANDOM_DESTINY_CHARACTER_TYPE_TOOLTIP_boilerplate$"
 RANDOM_DESTINY_CHARACTER_TYPE_TOOLTIP_random_landed_child:0 "Clique para selecionar uma Criança de Propriedade Aleatória: uma #V criança#! do seu personagem anterior que é um [ruler|E] e parte da [dynasty|E] [GetPlayer.GetDynasty.GetBaseName].\n"
 SUCCESSION_DYNASTY_INFO:0 "[Dynasty.GetName]\n[SuccessionEventWindow.GetStartDate.GetYear] - [SuccessionEventWindow.GetEndDate.GetYear]\n[Dynasty.GetNumberOfMembers] Membros ([SuccessionEventWindow.GetNumberOfPlayed] Jogados)\n[Dynasty.GetPrestigeLevelName]\n[GetDataModelSize( Dynasty.GetDynastyHouses )] [Select_CString( EqualTo_int32( GetDataModelSize( Dynasty.GetDynastyHouses ), '(int32)1' ), 'Casa', 'Casas' )]"
 SUCCESSION_EVENT_RETURN_TO_DYNASTY:0 "Retornar à sua Dinastia"
 SUCCESSION_EVENT_RETURN_TO_DYNASTY_TT:0 "#T Retornar à sua Dinastia#!\nVoltar a jogar como um Governante de sua Dinastia"
 SUCCESSION_EVENT_WINDOW_CANCEL_SELECT_DESTINY:0 "Voltar"
 SUCCESSION_EVENT_WINDOW_CANCEL_SELECT_DESTINY_TT:0 "#T Selecione seu Destino\n#!Cancelar a seleção de um personagem e retornar ao seu herdeiro normal."
 SUCCESSION_EVENT_WINDOW_CHANGE_CHARACTER:0 "Escolha um novo personagem"
 SUCCESSION_EVENT_WINDOW_CLOSE:0 "Continue como [SuccessionEventWindow.GetContinueAsCharacter.GetShortUINameNotMeNoTooltip]"
 SUCCESSION_EVENT_WINDOW_DEAD_DESC:0 "[Character.Custom('DeathMessageIntro')][Character.Custom('NicknameReason')] [Character.Custom('DeathMessageReason')] [Character.Custom('DeathMessageOutro')]"
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_CHRISTIANITY_1:0 "[ROOT.Char.GetFullNameNoTooltip] encontrou a paz no abraço de Cristo aos [ROOT.Char.GetAge] anos de idade."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_CHRISTIANITY_2:0 "[ROOT.Char.GetFullNameNoTooltip] descansa nos braços do Senhor aos [ROOT.Char.GetAge] anos de idade."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_DEFAULT_1:0 "[ROOT.Char.GetFullNameNoTooltip] Desistiu transformando-se num fantasma aos [ROOT.Char.GetAge] devido à idade."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_DEFAULT_2:0 "[ROOT.Char.GetFullNameNoTooltip] abandonou sua mortalidade aos [ROOT.Char.GetAge] anos de idade."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_DEFAULT_3:0 "[ROOT.Char.GetFullNameNoTooltip] partiu aos [ROOT.Char.GetAge] anos de idade."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_DEFAULT_4:0 "[ROOT.Char.GetFullNameNoTooltip] deixou este mundo aos [ROOT.Char.GetAge] anos de idade."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_DEFAULT_5:0 "[ROOT.Char.GetFullNameNoTooltip] partiu aos [ROOT.Char.GetAge] anos de idade e [ROOT.Char.Custom('GetAfterLifeDestination')]."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_EASTERN_1:0 "[ROOT.Char.GetFullNameNoTooltip] transcendeu sua forma material aos [ROOT.Char.GetAge] anos de idade."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_HELLENIC_1:0 "[ROOT.Char.GetFullNameNoTooltip] cruzou o Rio Styx aos [ROOT.Char.GetAge] anos de idade."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_ISLAM_1:0 "[ROOT.Char.GetFullNameNoTooltip] deixou a casa transitória ao chamado do Verdadeiro aos [ROOT.Char.GetAge] anos de idade."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_ISLAM_2:0 "[ROOT.Char.GetFullNameNoTooltip] abandonou este mundo transitório e voou para [ROOT.Char.GetFaith.PositiveAfterLife] aos [ROOT.Char.GetAge] anos de idade."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_ISLAM_3:0 "[ROOT.Char.GetFullNameNoTooltip] partiu para a eternidade aos [ROOT.Char.GetAge] anos de idade."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_NORSE_1:0 "[ROOT.Char.GetFullNameNoTooltip] se juntou ao banquete em [ROOT.Char.GetFaith.PositiveAfterLife] aos [ROOT.Char.GetAge] anos de idade."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_PIOUS:0 "O espírito de [ROOT.Char.GetFullNameNoTooltip] voou para [ROOT.Char.GetFaith.PositiveAfterLife] aos [ROOT.Char.GetAge] anos de idade."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_TRIBAL_1:0 "[ROOT.Char.GetFullNameNoTooltip] cruzou a porta para o mundo dos espíritos aos [ROOT.Char.GetAge] anos de idade."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_WICKED:0 "A alma de [ROOT.Char.GetFullNameNoTooltip] finalmente foi lançada para [ROOT.Char.GetFaith.NegativeAfterLife] aos [ROOT.Char.GetAge] anos de idade."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_WOUNDED:0 "[ROOT.Char.GetFullNameNoTooltip] finalmente encontrou a paz aos [ROOT.Char.GetAge] anos de idade."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_ACCOMPLISHMENT_CRUSADER:0 "Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] devot[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] zelos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], [ROOT.Char.GetSheHe] lutou pela glória de [ROOT.Char.GetFaith.HighGodName] contra os [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] em uma das maiores guerras santas da história recente."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_ACCOMPLISHMENT_RESTORER_ROME:0 "Ao restaurar o antigo poder do Império, [ROOT.Char.GetSheHe] garantiu que seu nome viverá em glória até o fim dos tempos."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_ACCOMPLISHMENT_SAOSHYANT:0 "O sagrado restaurador do Império Persa, sua ascensão à glória será imortalizada nos sermões de todos os [ROOT.Char.GetFaith.PriestMalePlural]. Certamente, el[Select_CString( ROOT.Char.IsFemale, 'a', 'e' )] está sentad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ao lado de [ROOT.Char.GetFaith.HighGodName] agora."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_AGE_CHILD:0 "Com sua vida encurtada tão cedo, é difícil dizer que tipo de governante [ROOT.Char.GetSheHe] teria se tornado."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_AGE_IMMORTAL:0 "Considerado imortal, [ROOT.Char.GetSheHe] surpreendeu muitos com sua morte inesperada."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_AGE_OLD:0 "Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] velh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], [ROOT.Char.GetSheHe] viveu uma vida longa e gratificante."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_AGE_PREGNANT:0 "Morta antes de dar à luz seu bebê, [ROOT.Char.GetSheHe] não caminhará sozinha na terra do além."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_DISFIGURED:0 "Terrivelmente desfigurado, [ROOT.Char.GetSheHe] gastou seus últimos anos incapaz de mostrar seu rosto em público."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_DWARF:0 "Nascid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] em circunstâncias infelizes, [ROOT.Char.GetSheHe] foi frequentemente ridicularizado por sua pequena estatura."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_GIANT:0 "Nascid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] em circunstâncias infelizes, [ROOT.Char.GetSheHe] foi frequentemente ridicularizado por suas proporções gigantescas."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_HUNCHBACK:0 "Nascid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] em circunstâncias infelizes, [ROOT.Char.GetSheHe] foi frequentemente ridicularizado por seu posto para trás."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_INCAPABLE:0 "Reduzido a uma casca oca de seu antigo eu, incapaz de falar ou se mover, [ROOT.Char.GetSheHe] finalmente deixou os restos quebrados de seu corpo."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_LEPER:0 "Seu corpo putrescente finalmente sucumbiu ao flagelo da lepra."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_MANGLED:0 "Mutilado em um terrível acidente, [ROOT.Char.GetSheHe] gastou seus últimos anos mal conseguindo andar."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_PRETTY_OLD:0 "Uma vez famos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por sua beleza, o destino amaldiçoou [ROOT.Char.GetSheHe] com uma vida longa o suficiente para testemunhar sua a beleza murchar lentamente."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_PRETTY_YOUNG:0 "Mort[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] no auge da sua vida, [ROOT.Char.GetSheHe] sempre será lembrado por sua beleza estonteante."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_STRONG:0 "Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan|U] de destreza incomparável, [ROOT.Char.GetSheHe] finalmente encontrou um oponente que [ROOT.Char.GetSheHe] não poderia dominar."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_UGLY:0 "Renome por sua feiura, era dito que um simples olhar para [ROOT.Char.GetSheHe] poderia dar pesadelos por dias."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_WEAK:0 "Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] de constituição frágil, [ROOT.Char.GetSheHe] foi frequentemente ridicularizado por seus pares."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_ADMINISTRATOR:0 "Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] consciente, [ROOT.Char.GetSheHe] era renomad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por suas excelentes habilidades como administrador[Select_CString( ROOT.Char.IsFemale, 'a', '' )] e governante."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_BLADEMASTER:0 "Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] d[Select_CString( ROOT.Char.IsFemale, 'as', 'os' )] melhores lutadores de sua época, [ROOT.Char.GetSheHe] era imbatível em combates corpo a corpo."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_DIPLOMAT:0 "Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] diplomata inveterad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], não havia argumento que [ROOT.Char.GetSheHe] não pudesse resolver pacificamente."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_ERUDITE:0 "Conhecido(a) por ser um(a) estudioso(a) respeitado(a), [ROOT.Char.GetSheHe] passou a maior parte de [ROOT.Char.GetHerHis] dias estudando na biblioteca de [ROOT.Char.GetHerHis], saindo raramente de [ROOT.Char.GetHerHis] [ROOT.Char.Custom('ResidenceBuilding')]."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_FAMILY_FIRST:0 "Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] que sempre colocava o bem de sua família acima de tudo, [ROOT.Char.GetSheHe] passou sua vida tentando garantir um futuro glorioso para todos os seus descendentes."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_GALLANT:0 "Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] exemplo de valor e cavalheirismo, [ROOT.Char.GetSheHe] sempre será lembrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por sua natureza cortês e justa diante de todas as adversidades."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_GENERAL:0 "Conhecid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por ser um estrategista excepcional, [ROOT.Char.GetSheHe] passava a maior parte de seus dias examinando campos e treinando suas tropas."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_HERBALIST:0 "Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] herborista renomad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], dizia-se que [ROOT.Char.GetSheHe] poderia curar todas as doenças com a mistura certa."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_HUNTER:0 "Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] caçador[Select_CString( ROOT.Char.IsFemale, 'a', '' )] ávid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] e dedicad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], [ROOT.Char.GetSheHe] adorava passar semanas inteiras na natureza, em busca das presas mais esquivas."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_MYSTIC:0 "Conhecid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por passar a maioria de suas noites em seu laboratório, [ROOT.Char.GetSheHe] era considerad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por muitos como nada mais do que um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] brux[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], criando feitiços profanos no segredo de seu [ROOT.Char.Custom('ResidenceBuilding')]."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_PHYSICIAN:0 "Dedicad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ao entendimento do corpo e da mente humana, [ROOT.Char.GetSheHe] era um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] médic[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] respeitad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], procurad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por muitos jovens estudiosos por seu conhecimento enciclopédico sobre a natureza e os humores."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_REVELER:0 "Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] encantador[Select_CString( ROOT.Char.IsFemale, 'a', '' )], [ROOT.Char.GetSheHe] ficou famos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por seus banquetes elaborados e bailes grandiosos."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_SCHEMER:0 "Conhecid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por sua mente retorcida e ardilosa, [ROOT.Char.GetSheHe] nunca revelava suas verdadeiras intenções para ninguém, nem mesmo para seus amigos mais próximos."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_SCHOLAR:0 "Conhecid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] respeitad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] estudios[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], [ROOT.Char.GetSheHe] passava a maior parte de seus dias estudando em sua biblioteca, raramente deixando seu [ROOT.Char.Custom('ResidenceBuilding')]."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_SEDUCER:0 "Conhecid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] libertin[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] sedutor[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], [ROOT.Char.GetSheHe] possuía uma língua de prata capaz de encantar qualquer pessoa e levá-la para a cama."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_TORTURER:0 "Conhecid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por sua tendência sadista, [ROOT.Char.GetSheHe] transformava tortura e mutilação em arte."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_DEPRESSED:0 "Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] atormentad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], [ROOT.Char.GetSheHe] há muito tempo desejava o doce abraço da morte."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_DUMB:0 "Conhecid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por ser frac[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] de espírito, [ROOT.Char.GetSheHe] frequentemente confiava em seu conselho para tomar decisões importantes."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_GENIUS:0 "Embora bastante famos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por seu intelecto afiado, [ROOT.Char.GetSheHe] ainda poderia ser mais espert[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetFaith.DeathDeityName]."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_INFIRM:0 "Uma concha oca de seu antigo eu, [ROOT.Char.GetSheHe] tinha perdido há muito tempo sua inteligência na hora de sua morte final."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_LUNATIC:0 "Amaldiçoad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com uma mente perturbada, [ROOT.Char.GetSheHe] era conhecido em todas as suas terras como [Select_CString( ROOT.Char.IsFemale, 'uma lunática', 'um lunático' )] delirante."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_POSSESSED_NEGATIVE:0 "Atormentad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por demônios, [ROOT.Char.GetSheHe] frequentemente delirou sobre sua desgraça iminente."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_POSSESSED_POSITIVE:0 "Após falar através [ROOT.Char.GetHerHim] por anos, [ROOT.Char.GetFaith.HighGodName] finalmente chamou de volta para casa."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_APATHETIC:0 "Se há algo que se pode dizer [ROOT.Char.GetHerHim] é que [ROOT.Char.GetSheHe] nunca causou uma impressão duradoura em quem quer que tenha conhecido [ROOT.Char.GetSheHe]."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_ARROGANT:0 "Sempre cheio de si mesmo e pront[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] para exercer sua autoridade sobre seus [ROOT.Char.Custom('GetSubjectPlural')], [ROOT.Char.GetSheHe] era [Select_CString( ROOT.Char.IsFemale, 'uma', 'um' )] [ROOT.Char.GetWomanMan] completamente apaixonad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] pelo som de sua própria voz."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_BENEVOLENT:0 "Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] de disposição agradável, [ROOT.Char.GetSheHe] será lembrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por seu governo benevolente."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_CHASTE:0 "[ROOT.Char.GetSheHe|U] será lembrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] para quem a lealdade era um valor inabalável."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_COMPASSIONATE:0 "Conhecid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por ser uma alma bondosa e compassiva, [ROOT.Char.GetSheHe] será lembrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com carinho por seus amigos."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_DILIGENT:0 "Um exemplo brilhante de diligência, [ROOT.Char.GetSheHe] nunca negligenciava seus deveres."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_DOMINANT:0 "Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] com quem não se brinca, [ROOT.Char.GetSheHe] incorporava a dignidade e o poder de seu título como poucos governantes podem."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_FICKLE:0 "Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] volúvel, quase ninguém sabia o que [ROOT.Char.GetSheHe] pensaria ou faria em qualquer ocasião."
