 ECCLESIASTICAL_RULER_SUCCESSION_DESCRIPTION:0 "#T Continuar Jogando#!\n#TUT Ao morrer como membro de uma Organização, seu Herdeiro será a próxima pessoa a receber seu Título Primário. Geralmente, esta não é uma pessoa de sua Dinastia.#!"
