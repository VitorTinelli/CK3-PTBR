 boldness_adj:0 "[Select_CString( CHARACTER.IsFemale, 'Corajosa', 'Corajoso' )]"
 boldness_explanation:0 "Este personagem é #Bold um tanto corajoso#! e é mais propenso a declarar [war|E] contra [rulers|E] próximos em força, aceitar e propor [single_combat_duel_plural|E], e correr riscos (por exemplo, ao realizar [medical_treatments|E]). Eles são menos afetados pelo [dread|E]."
 boldness_neg_adj:0 "Sem caráter"
 boldness_neg_explanation:0 "Este personagem é #Bold um tanto covarde#! e é mais propenso a declarar [war|E] a [rulers|E] mais fracos, ceder às [factions|E] sem lutar, evitar ser um [agent|E], evitar [imprison|E] [vassals|E] fortes, ou oferecer um [hostage|E] para evitar guerra. [dread|E] tem um efeito maior sobre eles, e eles evitam riscos para a [health|E] ou o [realm|E] em geral."
 boldness_neg_noun:0 "Covarde"
 boldness_noun:0 "Audácia"
