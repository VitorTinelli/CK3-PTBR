 single_combat.0001.pocket_silver:0 "Sinta o gosto da prata, [my_foe.Custom2('InsultNoun', ROOT.Char)]!"
 single_combat.0001.probing_attack:0 "Você terá que abaixar a guarda eventualmente, covarde!"
