l_spanish:
 debug_log.single_combat_setup.attacker_and_defender_same_person.notice:0 "Luta Singular Até Demais"
 debug_log.single_combat_setup.attacker_and_defender_same_person:0 "Tentativa de iniciar um duelo onde o atacante e o defensor são a mesma pessoa; isso precisa ser filtrado na configuração de conteúdo do duelo, caso contrário, pode causar falhas. Escopos registrados no debug.log em \"$debug_log.single_combat_setup.attacker_and_defender_same_person.notice$\"."
 single_combat.0000.t:0 "Combate Individual:"
 single_combat.0001.attempt_disarm:0 "Vamos ver como você se sai sem sua [my_foe.Custom('signature_weapon')]!"
 single_combat.0001.blade_dance:0 "Sou a lâmina mais rápida de [myself.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
 single_combat.0001.blade_dance_unlanded:0 "Sou a lâmina mais rápida dos [myself.GetCulture.GetCollectiveNounNoTooltip]!"
 single_combat.0001.butchery:0 "Acho que preciso dar um #EMP exemplo#! de você..."
 single_combat.0001.confident_attack:0 "Vou te mostrar como #EMP eu#! [myself.Custom('SignatureWeaponAction')] [myself.Custom('SignatureWeaponArticle')] [myself.Custom('signature_weapon')]!"
 single_combat.0001.desc.capstone.intro.deadly:0 "Apenas um de nós sairá daqui hoje, e eu pretendo ser eu."
 single_combat.0001.desc.capstone.intro.first_blood:0 "Essa luta pode ser apenas até o primeiro sangue, mas isso não alivia meus nervos."
 single_combat.0001.desc.injury_check.opponent.likely:0 "e a postura [Select_CString( my_foe.IsFemale, 'da', 'do' )] [my_foe.GetFirstNameNoTooltip] está falhando."
 single_combat.0001.desc.injury_check.opponent.moderate:0 "e a postura [Select_CString( my_foe.IsFemale, 'da', 'do' )] [my_foe.GetFirstNameNoTooltip] é aceitável."
 single_combat.0001.desc.injury_check.opponent.unlikely:0 "e a postura [Select_CString( my_foe.IsFemale, 'da', 'do' )] [my_foe.GetFirstNameNoTooltip] é formidável."
 single_combat.0001.desc.injury_check.opponent.very_likely:0 "e a postura [Select_CString( my_foe.IsFemale, 'da', 'do' )] [my_foe.GetFirstNameNoTooltip] é um desastre."
 single_combat.0001.desc.injury_check.opponent.very_unlikely:0 "e a postura [Select_CString( my_foe.IsFemale, 'da', 'do' )] [my_foe.GetFirstNameNoTooltip] é incrível."
 single_combat.0001.desc.injury_check.personal.likely:0 "\n\nMinha forma está deteriorando rapidamente, com numerosas brechas exploráveis,"
 single_combat.0001.desc.injury_check.personal.moderate:0 "\n\nMinha forma está decente, com algumas falhas,"
 single_combat.0001.desc.injury_check.personal.unlikely:0 "\n\nMinha forma está boa, com apenas pequenos erros,"
 single_combat.0001.desc.injury_check.personal.very_likely:0 "\n\nMinha forma não existe, meu próximo movimento arriscado poderia significar derrota,"
 single_combat.0001.desc.injury_check.personal.very_unlikely:0 "\n\nMinha forma está excelente, com pouca chance de erro,"
 single_combat.0001.desc.my_feedback.attempt_disarm:0 "Um colossal [myself.Custom('SignatureWeaponAttemptedHeavy')] do meu [myself.Custom('signature_weapon')] quase é suficiente para arrancar a [my_foe.Custom('signature_weapon')] [Select_CString( my_foe.IsFemale, 'da', 'do' )] [my_foe.GetFirstNameNoTooltip] [my_foe.GetHerHim], mas [my_foe.GetSheHe] #EMP só#! consegue se recuperar."
 single_combat.0001.desc.my_feedback.blade_dance:0 "Na batalha, sou um artista. Cada golpe é uma pincelada, cada inimigo caído ou jorro de sangue é uma explosão de tinta. Enquanto empunho minha [myself.Custom('signature_weapon')], alternando perfeitamente entre floreio e golpe, eu pinto uma imagem de agonia em meu inimigo."
 single_combat.0001.desc.my_feedback.butchery:0 "Eu não posso contar quantas pessoas eu [myself.Custom('SignatureWeaponKillTypePastParticiple')] com minha [myself.Custom('signature_weapon')]. Talvez [my_foe.GetFirstName] seja o próximo, talvez não, mas minha chuva de golpes selvagens deve tê-lo preocupado com isso."
 single_combat.0001.desc.my_feedback.confident_attack:0 "Minha [myself.Custom('signature_weapon')] flui ao redor [Select_CString( my_foe.IsFemale, 'da', 'do' )] [my_foe.GetFirstNameNoTooltip] como água, cada golpe encadeando fluidamente no próximo, uma série de ataques perfeitamente cronometrados."
 single_combat.0001.desc.my_feedback.desert_warrior:0 "Aqui no calor, é preciso ser um [myself.GetWomanMan] resistente para lutar. [my_foe.GetFirstNameNoTooltip] #EMP transpira#!, e sua respiração está completamente ofegante; é brincadeira de criança exaurir [my_foe.GetSheHe] com ocasionais [myself.Custom('SignatureWeaponAttemptedLightPlural')]."
 single_combat.0001.desc.my_feedback.enthusiastic_onslaught:0 "Eu tenho [myself.Custom('SignatureWeaponArticle')] [myself.Custom('signature_weapon')], eu tenho um inimigo, e estou determinado a apresentá-los de qualquer maneira. Balanços selvagens, golpes de costas, golpes descontrolados do meu [myself.Custom('SignatureWeaponEndType')], qualquer coisa para golpear meu oponente."
 single_combat.0001.desc.my_feedback.expert_onslaught:0 "Eu pulo para a ação, lançando uma série de [myself.Custom('SignatureWeaponAttemptedLightPlural')], me empurrando contra a guarda [Select_CString( my_foe.IsFemale, 'da', 'do' )] [my_foe.GetFirstNameNoTooltip], desgastando [my_foe.GetSheHe] com cada golpe perfeitamente cronometrado."
 single_combat.0001.desc.my_feedback.feint_and_stab:0 "Minha [myself.Custom('signature_weapon')] faz um [myself.Custom('SignatureWeaponAttemptedLight')] em uma direção, apenas para eu sacar uma adaga fresca com minha mão desocupada e avançar em [my_foe.GetFirstNameNoTooltip] enquanto [my_foe.GetSheHe] tenta se defender."
 single_combat.0001.desc.my_feedback.forest_fighter:0 "A floresta oferece muitas oportunidades de vantagem. Eu me esquivo para trás, colocando um pedaço de espinhos entre mim e [my_foe.GetFirstNameNoTooltip], depois volto para lançar um golpe feroz, um [myself.Custom('SignatureWeaponAttemptedLight')] n[my_foe.GetSheHe]."
 single_combat.0001.desc.my_feedback.guard:0 "Com balanços habilidosos da minha [myself.Custom('signature_weapon')], eu bato de lado vários ataques tentados, mantendo [my_foe.GetFirstNameNoTooltip] a uma distância segura."
 single_combat.0001.desc.my_feedback.hail_mary:0 "[myself.Custom('SignatureWeaponFlourishPresentParticiple')|U] minha [myself.Custom('signature_weapon')] loucamente, eu avanço direto para [my_foe.GetFirstNameNoTooltip]. Se eu for morrer, farei uma luta difícil, e [my_foe.GetFirstNameNoTooltip] é afastado pelo meu entusiasmo desesperado."
 single_combat.0001.desc.my_feedback.hard_grit:0 "Com facilidade praticada, eu evito um golpe [Select_CString( my_foe.IsFemale, 'da', 'do' )] [my_foe.GetFirstNameNoTooltip], avançando no golpe e trazendo minha [myself.Custom('signature_weapon')] para um [myself.Custom('SignatureWeaponAttemptedHeavy')], antes de recuar rapidamente para uma distância segura."
 single_combat.0001.desc.my_feedback.hurt_me_better:0 "Nada faz o sangue bombear como a picada da doce agonia, e ninguém entende a dor como eu. Impulsionado pelas minhas feridas, eu me lanço sobre [my_foe.GetFirstNameNoTooltip], desferindo uma saraivada de golpes selvagens, [myself.Custom('SignatureWeaponAttemptedLightPlural')] com minha [myself.Custom('signature_weapon')]."
 single_combat.0001.desc.my_feedback.is_that_a_crocodile:0 "Com um rugido, a fera surge da água, nos atacando. Eu me afasto rapidamente, deixando [my_foe.GetFirstNameNoTooltip] [myself.Custom('SignatureWeaponFlourishPresentParticiple')] nela com seu(a) [my_foe.Custom('signature_weapon')] em pânico. Quando o crocodilo recua, estou me aproximando das costas [my_foe.GetHerHim]."
 single_combat.0001.desc.my_feedback.jungle_stalker:0 "A densa folhagem da selva torna o movimento lento na melhor das hipóteses, impossível na pior, e as sombras raramente estão a mais do que um rápido movimento de pés de distância. On[Select_CString( my_foe.IsFemale, 'da', 'do' )] [my_foe.GetFirstNameNoTooltip] luta, eu me destaco, desaparecendo apenas para reaparecer com um [myself.Custom('SignatureWeaponAttemptedHeavy')]."
 single_combat.0001.desc.my_feedback.lightning_assault:0 "Colocando toda a minha força no meu primeiro golpe, eu salto diretamente para [my_foe.GetFirstNameNoTooltip], [myself.Custom('SignatureWeaponActionPresentParticiple')] minha [myself.Custom('signature_weapon')] alto em um [myself.Custom('SignatureWeaponAttemptedHeavy')] que faz [my_foe.GetSheHe] recuar."
 single_combat.0001.desc.my_feedback.like_a_viper:0 "Com toda a minha força, eu passo pela guarda [Select_CString( my_foe.IsFemale, 'da', 'do' )] [my_foe.GetFirstNameNoTooltip] e lanço um golpe fervoroso com minha [myself.Custom('signature_weapon')], mirando em [myself.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('my_foe'))]. Apenas a margem mais estreita me impede de reivindicar uma vitória sangrenta."
 single_combat.0001.desc.my_feedback.martial_voice:0 "Comandar a ralé na batalha é um exercício de gritos e intimidação, e eu demonstro isso para [my_foe.GetFirstNameNoTooltip] gritando obscenidades no topo dos meus pulmões consideráveis."
 single_combat.0001.desc.my_feedback.mocking_boast:0 "Minhas palavras cortam fundo no ego [Select_CString( my_foe.IsFemale, 'da', 'do' )] [my_foe.GetFirstNameNoTooltip]. #EMP Todos#! sabem da minha fama, meu prestígio, e a reputação [my_foe.GetHerHim] #EMP empalidece#! em comparação."
 single_combat.0001.desc.my_feedback.nut_em:0 "Desviando o [my_foe.Custom('signature_weapon')] [Select_CString( my_foe.IsFemale, 'da', 'do' )] [my_foe.GetFirstNameNoTooltip] por um instante crucial, eu dou um passo para dentro da guarda [my_foe.GetHerHim] e trago meu crânio para baixo sobre [my_foe.GetSheHe] com um estalo doentio."
 single_combat.0001.desc.my_feedback.onslaught:0 "[myself.Custom('signature_weapon')|U] em mãos, eu desfiro uma chuva de [myself.Custom('SignatureWeaponAttemptedLightPlural')] sobre [my_foe.GetFirstNameNoTooltip], não dando trégua entre os golpes."
 single_combat.0001.desc.my_feedback.open_terrain_expert:0 "Com todo o espaço do mundo para lutar, eu corro círculos languidos ao redor [Select_CString( my_foe.IsFemale, 'da', 'do' )] [my_foe.GetFirstNameNoTooltip], cedendo terreno sem valor a cada golpe que [my_foe.GetSheHe] faz e recuando facilmente após cada ataque meu."
 single_combat.0001.desc.my_feedback.pocket_sand:0 "Apanhando um punhado de [sc_defender.Custom('GritType')], eu o atiro diretamente no [my_foe.Custom('MaskFace')] [Select_CString( my_foe.IsFemale, 'da', 'do' )] [my_foe.GetFirstNameNoTooltip], fazendo [my_foe.GetSheHe] tossir para trás."
 single_combat.0001.desc.my_feedback.pocket_silver:0 "Agarrando uma bolsa pesada de dinheiro em minha cintura, eu a lanço em [my_foe.GetFirstNameNoTooltip]. Acertando [my_foe.GetSheHe] em cheio no [my_foe.Custom('MaskFace')], me dando uma breve abertura para um [myself.Custom('SignatureWeaponAttemptedLight')] com minha [myself.Custom('signature_weapon')]."
 single_combat.0001.desc.my_feedback.probing_attack:0 "Escolhendo meus momentos cuidadosamente, eu realizo vários golpes rápidos, empurrando [my_foe.GetFirstNameNoTooltip] para cá e para lá, gradualmente alargando a guarda [my_foe.GetHerHim]."
 single_combat.0001.desc.my_feedback.put_the_boot_in:0 "Com um [myself.Custom('SignatureWeaponAttemptedHeavy')] da minha [myself.Custom('signature_weapon')], eu faço [my_foe.GetFirstNameNoTooltip] recuar, então avanço sobre o golpe e chuto [my_foe.GetSheHe] diretamente no peito."
 single_combat.0001.desc.my_feedback.raaargh:0 "Cuspo voando, [myself.Custom('signature_weapon')] [myself.Custom('SignatureWeaponFlourishPresentParticiple')] de forma maníaca, eu me lanço contra o meu inimigo. Uma névoa vermelha rasga minha mente, e tudo é raiva, sangue e catarse bem-aventurada."
 single_combat.0001.desc.my_feedback.reason_you_suck_speech:0 "Alguns podem me chamar de louco por criticar todos os aspectos da vida [Select_CString( my_foe.IsFemale, 'da', 'do' )] [my_foe.GetFirstNameNoTooltip] em detalhes enquanto [my_foe.GetSheHe] me ataca. Eles não conhecem a #EMP satisfação#! de uma plateia cativa."
 single_combat.0001.desc.my_feedback.rough_terrain_expert.boggy:0 "Pântanos são traiçoeiros notoriamente, e este não é exceção. Embora eu ainda não tenha conseguido empurrar [my_foe.GetFirstNameNoTooltip] para a água salgada, [my_foe.GetSheHe] chegou #EMP muito#! perto."
 single_combat.0001.desc.my_feedback.rough_terrain_expert.rocky:0 "A paisagem rochosa em que lutamos é perigosa. Qualquer um de nós poderia tropeçar e cair para a morte, e um empurrão violento aqui é tão perigoso quanto a ponta de uma espada. Eu me deleito em demonstrar isso para [my_foe.GetFirstNameNoTooltip] repetidamente."
 single_combat.0001.desc.my_feedback.something_to_hide:0 "Por um momento, [my_foe.GetFirstNameNoTooltip] fica imóvel. Então, algo parece ticar na cabeça [my_foe.GetHerHim], e o corpo [my_foe.GetHerHim] mostra visíveis sinais de desconforto ao lembrar do meu controle sobre [my_foe.GetSheHe]."
 single_combat.0001.desc.my_feedback.special_fallback:0 "Percebendo um momento de oportunidade, eu desfero um chute feroz bem no tornozelo [Select_CString( my_foe.IsFemale, 'da', 'do' )] [my_foe.GetFirstNameNoTooltip], quase deixando [my_foe.GetSheHe] mancando."
 single_combat.0001.desc.my_feedback.stoic_veteran:0 "A Guarda Varangiana não incentiva a laxidão. É preciso um olhar vigilante e um braço firme para se destacar como um dos guarda-costas do Imperador, e a cada golpe, eu mostro a [my_foe.GetFirstNameNoTooltip] como os Portadores de Machado lutam."
 single_combat.0001.desc.my_feedback.strict_guard:0 "Minha [myself.Custom('signature_weapon')] é uma proteção melhor do que qualquer escudo, parando, contra-atacando e defendendo contra cada movimento [Select_CString( my_foe.IsFemale, 'da', 'do' )] [my_foe.GetFirstNameNoTooltip]. Onde quer que [my_foe.GetSheHe] mova seu(a) [my_foe.Custom('signature_weapon')], minha [myself.Custom('signature_weapon')] está lá, esperando."
 single_combat.0001.desc.my_feedback.surprise_attack:0 "Identificando uma fraqueza, eu me lanço contra [my_foe.GetFirstNameNoTooltip], [myself.Custom('SignatureWeaponActionPresentParticiple')] minha [myself.Custom('signature_weapon')] e empurrando [my_foe.GetSheHe] para trás com um [my_foe.Custom('SignatureWeaponAttemptedHeavy')]."
 single_combat.0001.desc.my_feedback.taunt:0 "\"Além disso\", eu grito, \"você é [my_foe.Custom2('InsultAdjectiveArticle', ROOT.Char)], [my_foe.Custom2('InsultNoun', ROOT.Char)] [my_foe.Custom2('InsultAdjective', ROOT.Char)] cujo [my_foe.Custom2('PointOfRidicule', ROOT.Char)] é motivo de riso na terra!\"."
 single_combat.0001.desc.my_feedback.technique_from_legend:0 "Faço o meu melhor para lembrar das lendas no calor do momento e tento [myself.Custom('SignatureWeaponAction')] minha [myself.Custom('signature_weapon')] como os heróis do passado. É o suficiente para um golpe sólido contra meu surpreso oponente."
 single_combat.0001.desc.my_feedback.tire_opponent:0 "Vez após outra, eu recuo, esquivo e teclo, sempre mantendo-me a uma distância tentadora: em breve, [my_foe.GetFirstNameNoTooltip] mostrando sinais de exaustão."
 single_combat.0001.desc.my_feedback.unsure_attack:0 "Eu tento alguns [myself.Custom('SignatureWeaponAttemptedLightPlural')] perfunctórios, focando principalmente em não perder minha [myself.Custom('signature_weapon')], mas nada realmente chega perto do meu oponente."
 single_combat.0001.desc.my_feedback.wait_and_hope.will_die:0 "Eu travo. Eu poderia morrer aqui. Se eu não fizer algo, eu #EMP vou#! morrer aqui. Não consigo me mover, tremendo enquanto rezo para que [my_foe.GetFirstNameNoTooltip] tropece e caia para que eu tenha uma abertura."
 single_combat.0001.desc.my_feedback.wait_and_hope.will_live:0 "Eu aguardo meu tempo, esperando. Eu posso não ser o melhor lutador, mas talvez, dando corda suficiente, [my_foe.GetFirstNameNoTooltip] se enforque [my_foe.GetHerselfHimself]."
 single_combat.0001.desc.my_feedback.wrath_of_highgod:0 "[myself.GetFaith.HighGodName] é sábio, e a sua ira está do #EMP meu#! lado. Eu grito minha devoção aos céus, para que [my_foe.GetFirstNameNoTooltip] possa tremer de medo diante da minha fé."
 single_combat.0001.desc.opponent_response.attempt_disarm:0 "Com surpreendente velocidade, [my_foe.GetFirstNameNoTooltip] desfere um golpe poderoso com seu(a) [my_foe.Custom('signature_weapon')], quase fazendo meu [myself.Custom('signature_weapon')] escapar."
 single_combat.0001.desc.opponent_response.blade_dance:0 "[my_foe.GetFirstNameNoTooltip] é famoso por suas habilidades com [my_foe.Custom('SignatureWeaponArticle')] [my_foe.Custom('signature_weapon')], e [my_foe.GetSheHe] me lembra disso com uma perfeita sequência de [my_foe.Custom('SignatureWeaponAttemptedLightPlural')], pontuada pelo ocasional e aterrorizante [my_foe.Custom('SignatureWeaponAttemptedHeavy')]."
 single_combat.0001.desc.opponent_response.butchery:0 "Um sorriso cruel se espalha pelos lábios [Select_CString( my_foe.IsFemale, 'da', 'do' )] [my_foe.GetFirstNameNoTooltip], e antes que eu possa ajustar minha guarda, estou quase cedendo sob uma chuva selvagem de [my_foe.Custom('SignatureWeaponAttemptedLightPlural')]."
 single_combat.0001.desc.opponent_response.confident_attack:0 "[my_foe.GetFirstNameNoTooltip] retaliando com uma série suave de [my_foe.Custom('SignatureWeaponAttemptedLightPlural')] e [my_foe.Custom('SignatureWeaponAttemptedHeavyPlural')], cada golpe me empurrando um pouco mais para trás."
 single_combat.0001.desc.opponent_response.desert_warrior:0 "Enquanto eu me canso lutando nesse calor, [my_foe.GetFirstNameNoTooltip] parece se manter fresco e ágil, contente em oferecer apenas [my_foe.Custom('SignatureWeaponAttemptedLight')] ocasionalmente."
 single_combat.0001.desc.opponent_response.enthusiastic_onslaught.banned_house:0 "\"#EMP [my_foe.GetFullNameNoTooltip]!#!\" $single_combat.0001.desc.opponent_response.enthusiastic_onslaught.epilogue$"
 single_combat.0001.desc.opponent_response.enthusiastic_onslaught.epilogue:0 "grita meu oponente, [my_foe.Custom('SignatureWeaponFlourishPresentParticiple')] seu(a) [my_foe.Custom('signature_weapon')] furiosamente em minha direção, ao meu redor e perto de mim."
 single_combat.0001.desc.opponent_response.enthusiastic_onslaught.motto:0 "\"#EMP [my_foe.GetHouse.GetMotto]#!, verme!\" $single_combat.0001.desc.opponent_response.enthusiastic_onslaught.epilogue$"
 single_combat.0001.desc.opponent_response.enthusiastic_onslaught.own_house:0 "\"Você é uma vergonha para o nome [my_foe.GetHouse.GetNameNoTooltip]!\" $single_combat.0001.desc.opponent_response.enthusiastic_onslaught.epilogue$"
 single_combat.0001.desc.opponent_response.expert_onslaught:0 "[my_foe.GetFirstNameNoTooltip] contra-ataca com uma feroz saraivada de [my_foe.Custom('SignatureWeaponAttemptedLightPlural')], quase me [my_foe.Custom('SignatureWeaponKillTypeFirstPersonPresentParticiple')] repetidamente."
 single_combat.0001.desc.opponent_response.feint_and_stab:0 "[my_foe.GetFirstNameNoTooltip] tenta fingir para a esquerda com seu(a) [my_foe.Custom('signature_weapon')], apenas para atacar meu coração com uma adaga escondida em sua mão secundária."
 single_combat.0001.desc.opponent_response.forest_fighter:0 "Um habilidoso lutador nas matas, [my_foe.GetFirstNameNoTooltip] parece passar por espinhos e arbustos sem problemas, deixando-me forçar meu caminho pelos perigos após [my_foe.GetSheHe]."
 single_combat.0001.desc.opponent_response.guard:0 "[my_foe.GetFirstNameNoTooltip] adota uma postura defensiva, fazendo o seu melhor absoluto para me afastar. Os [my_foe.Custom('EyeEyes')] do [my_foe.GetWomanMan] estão acompanhando cada um dos meus movimentos."
 single_combat.0001.desc.opponent_response.hail_mary:0 "Bem ciente de que [my_foe.GetSheHe] está completamente superado, [my_foe.GetFirstNameNoTooltip] se lança contra mim fisicamente, me forçando para trás com toda a desesperança dos condenados."
 single_combat.0001.desc.opponent_response.hard_grit:0 "[my_foe.GetFirstNameNoTooltip] é um lutador preocupantemente competente, pois repetidamente evita ou defende até mesmo golpes sólidos, para depois contra-atacar."
 single_combat.0001.desc.opponent_response.hurt_me_better:0 "Um filete de sangue escorre do couro cabeludo [Select_CString( my_foe.IsFemale, 'da', 'do' )] [my_foe.GetFirstNameNoTooltip]; onde encontra seu lábio superior, [my_foe.GetSheHe] o lambe, sorrindo diabolicamente."
 single_combat.0001.desc.opponent_response.is_that_a_crocodile:0 "Um sibilo reptiliano inesperado revela um crocodilo enfurecido, recém-saído de um riacho próximo, e é só com vários [my_foe.Custom('SignatureWeaponAttemptedHeavyPlural')] que eu consigo afastá-lo."
 single_combat.0001.desc.opponent_response.jungle_stalker:0 "[my_foe.GetFirstNameNoTooltip] se prova um adversário escorregadio, desaparecendo dos meus ataques e movendo-se pela densa vegetação com uma facilidade que eu simplesmente não tenho."
 single_combat.0001.desc.opponent_response.lightning_assault:0 "[my_foe.GetFirstNameNoTooltip] não perde tempo, me enfrentando com uma intensa série de [my_foe.Custom('SignatureWeaponAttemptedHeavyPlural')] que me forçam a recuar passo a passo."
 single_combat.0001.desc.opponent_response.like_a_viper:0 "Antes que eu perceba, [my_foe.GetFirstNameNoTooltip] está de alguma forma #EMP dentro#! da minha guarda, seu(a) [my_foe.Custom('signature_weapon')] acelerando em direção ao meu coração. Só por uma margem estreita eu consigo me esquivar para trás."
 single_combat.0001.desc.opponent_response.martial_voice:0 "[my_foe.GetFirstNameNoTooltip] [my_foe.Custom('signature_weapon')] assume uma postura defensiva preguiçosa, e [my_foe.GetSheHe] começa a gritar comigo, seu tom sendo o que se usaria para um servo desobediente, não para um [myself.GetTitleAsNameNoTooltip]."
 single_combat.0001.desc.opponent_response.mocking_boast:0 "[my_foe.GetFirstNameNoTooltip] se afasta de mim, criando uma pequena pausa. A calma temporária é preenchida com alegações sobre a fama [my_foe.GetHerHim] e ataques ao meu valor, o suficiente para me enfurecer."
 single_combat.0001.desc.opponent_response.nut_em:0 "Aproveitando uma oportunidade, [my_foe.GetFirstNameNoTooltip] avança e me dá uma cabeçada forte no [myself.Custom('MaskFace')]. Eu recuo, desorientado."
 single_combat.0001.desc.opponent_response.onslaught:0 "[my_foe.GetFirstNameNoTooltip] estala o pescoço, então começa a desferir golpes contra a minha guarda, uma maratona de [my_foe.Custom('SignatureWeaponAttemptedHeavyPlural')] que quase me quebram com sua ferocidade implacável."
 single_combat.0001.desc.opponent_response.open_terrain_expert:0 "[my_foe.GetFirstNameNoTooltip] faz excelente uso do ambiente aberto, desferindo [my_foe.Custom('SignatureWeaponAttemptedLightPlural')] antes de recuar para o espaço amplo."
 single_combat.0001.desc.opponent_response.pocket_sand:0 "Em um momento estamos lutando, no próximo, há um grito de \"#EMP Huyah!#!\", meus olhos ardem, minha visão fica turva, e minha boca tem gosto de [sc_defender.Custom('GritType')] arremessado."
 single_combat.0001.desc.opponent_response.pocket_silver:0 "Do nada, [my_foe.GetFirstNameNoTooltip] arremessa uma bolsa pesada em meu [myself.Custom('MaskFace')], que se choca com um #EMP estrondo#!. Quando me recupero, [my_foe.GetSheHe] está pressionando sua vantagem contra mim."
 single_combat.0001.desc.opponent_response.probing_attack:0 "A retaliação [Select_CString( my_foe.IsFemale, 'da', 'do' )] [my_foe.GetFirstNameNoTooltip] é cuidadosamente calculada, esperando o momento exato para responder com vários [my_foe.Custom('SignatureWeaponAttemptedLightPlural')] [my_foe.Custom('signature_weapon')] [my_foe.GetHerHim]."
 single_combat.0001.desc.opponent_response.put_the_boot_in:0 "[my_foe.GetFirstNameNoTooltip] avança rapidamente, me forçando para trás com um [my_foe.Custom('SignatureWeaponAttemptedLight')] antes de desferir um chute alto em meu peito. Eu quase caio."
 single_combat.0001.desc.opponent_response.raaargh:0 "[my_foe.GetFirstNameNoTooltip] parece vibrar por um segundo, e então [my_foe.GetSheHe] explode com fúria, gritando alto o suficiente para abalar a Terra e se jogando em mim com uma rara #EMP ferocidade#!."
 single_combat.0001.desc.opponent_response.reason_you_suck_speech:0 "Numa tentativa de me humilhar, [my_foe.GetFirstNameNoTooltip] simplesmente se afasta sempre que me aproximo, insultando-me em detalhes, #EMP bem ciente#! de que eu não posso ignorá-lo."
 single_combat.0001.desc.opponent_response.rough_terrain_expert.boggy:0 "Melhor acostumado a lutar nesses pântanos lamacentos do que eu, [my_foe.GetFirstNameNoTooltip] tenta repetidamente me forçar a entrar na água salobra, quase conseguindo com sucesso."
 single_combat.0001.desc.opponent_response.rough_terrain_expert.rocky:0 "Um especialista em lutar em encostas rochosas, [my_foe.GetFirstNameNoTooltip] não perde tempo em reivindicar o terreno elevado, uma vantagem que [my_foe.GetSheHe] #EMP quase#! remove várias das minhas extremidades."
 single_combat.0001.desc.opponent_response.something_to_hide:0 "\"Você esqueceu sua #EMP dívida#! comigo, [myself.GetFirstNameNoTooltip]?\" sorri [my_foe.GetFirstNameNoTooltip]. Quando percebo do que [my_foe.GetSheHe] está falando, meus ombros caem."
 single_combat.0001.desc.opponent_response.special_fallback:0 "Inesperadamente, [my_foe.GetFirstNameNoTooltip] consegue desferir um chute brutal na minha canela, momentaneamente me mancando."
 single_combat.0001.desc.opponent_response.stoic_veteran:0 "O tempo [Select_CString( my_foe.IsFemale, 'da', 'do' )] [my_foe.GetFirstNameNoTooltip] na Guarda Varangiana o deixou estoico, brutal e mortal com [my_foe.Custom('SignatureWeaponArticle')] [my_foe.Custom('signature_weapon')], desferindo [my_foe.Custom('SignatureWeaponAttemptedHeavy')] após [my_foe.Custom('SignatureWeaponAttemptedHeavy')] em meu torso."
 single_combat.0001.desc.opponent_response.strict_guard:0 "[my_foe.GetFirstNameNoTooltip] adota uma postura defensiva, seu(a) [my_foe.Custom('signature_weapon')] formando uma parede quase impenetrável de defesas perfeitas entre mim e [my_foe.GetSheHe]."
 single_combat.0001.desc.opponent_response.surprise_attack:0 "De repente, [my_foe.GetFirstNameNoTooltip] muda de direção, jogando [my_foe.GetHerselfHimself] para o lado e em um [my_foe.Custom('SignatureWeaponAttemptedHeavy')] que eu mal consigo evitar."
 single_combat.0001.desc.opponent_response.taunt:0 "[my_foe.GetFirstNameNoTooltip], aparentemente desdenhando da luta real, escolhe fazer uma série de comentários prejudiciais e pessoais sobre mim, minha família e a forma como eu como aspargos."
 single_combat.0001.desc.opponent_response.technique_from_legend:0 "[my_foe.GetFirstNameNoTooltip] [my_foe.Custom('SignatureWeaponActionThirdPerson')] seu(a) [my_foe.Custom('signature_weapon')] de maneira estranhamente familiar, em seguida, executa um quase perfeito [my_foe.Custom('SignatureWeaponAttemptedHeavy')] que eu poderia jurar já ter visto antes."
 single_combat.0001.desc.opponent_response.tire_opponent:0 "[my_foe.GetFirstNameNoTooltip] recua a cada golpe meu, me deixando atacar sem receber outro golpe sólido. Não demora muito para eu sentir meu cansaço se instalar."
 single_combat.0001.desc.opponent_response.unsure_attack:0 "[my_foe.GetFirstNameNoTooltip] tenta, hesitante, lançar um [myself.Custom('SignatureWeaponAttemptedLight')] em minha direção, mas o golpe é facilmente afastado."
 single_combat.0001.desc.opponent_response.wait_and_hope:0 "[my_foe.GetFirstNameNoTooltip] fica completamente imóvel, aparentemente esperando que eu simplesmente largue minha [myself.Custom('signature_weapon')]."
 single_combat.0001.desc.opponent_response.wrath_of_highgod:0 "\"Pelas bênçãos de [my_foe.GetFaith.HighGodNameAlternate] e [my_foe.GetFaith.WarGodNameAlternate], sofra, blasfemo!\" grita [my_foe.GetFirstNameNoTooltip], [my_foe.Custom('SignatureWeaponActionPresentParticiple')] seu(a) [my_foe.Custom('signature_weapon')] aos céus."
 single_combat.0001.desc.sc_attacker.intro.epilogue:0 "\n\nCom um movimento repentino, nosso duelo começa.\n\n"
 single_combat.0001.desc.sc_attacker.intro:0 "Por alguns breves momentos, [sc_defender.GetTitledFirstName] e eu circulamos em meios-círculos preguiçosos, cada um observando uma abertura. Eu [sc_attacker.Custom('SignatureWeaponAction')] minha [sc_attacker.Custom('SignatureWeaponNameOrType')], pronto para me defender, enquanto [sc_defender.GetSheHe] segura sua [sc_defender.Custom('SignatureWeaponNameOrType')] firmemente na mão."
 single_combat.0001.desc.sc_defender.intro:0 "[sc_attacker.GetTitledFirstName] e eu nos cercamos, cada um avaliando nossas opções. [sc_attacker.GetSheHe|U] [sc_attacker.Custom('SignatureWeaponActionThirdPerson')] uma temível [sc_attacker.Custom('SignatureWeaponNameOrType')], enquanto seguro firmemente minha própria [sc_defender.Custom('SignatureWeaponNameOrType')]. A arma mortal parece fria e pesada em minhas mãos.\n\n"
 single_combat.0001.desc.success_check.almost_certain:0 "\n\nNão posso estar a mais do que um golpe bem colocado de alcançar a vitória."
 single_combat.0001.desc.success_check.almost_impossible:0 "\n\nAinda não consegui abrir a guarda do meu oponente, e não vejo nenhuma maneira de reivindicar a vitória."
 single_combat.0001.desc.success_check.likely:0 "\n\nTenho meu oponente na defensiva, mas ainda preciso consolidar minha vitória."
 single_combat.0001.desc.success_check.moderate:0 "\n\nEstamos igualmente equilibrados, com a vitória pendendo por um fio."
 single_combat.0001.desc.success_check.unlikely:0 "\n\nMeu oponente ainda está segurando bem os meus golpes, mas parece próximo de vacilar."
 single_combat.0001.desc.success_check.very_likely:0 "\n\nMeu oponente está recuando diante de mim, a vitória tão próxima que posso praticamente senti-la."
 single_combat.0001.desc.success_check.very_unlikely:0 "\n\nA guarda do meu oponente é feroz, e estou longe da vitória."
