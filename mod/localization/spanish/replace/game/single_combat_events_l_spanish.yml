 single_combat.0001.wait_and_hope:0 "Talvez se eu esperar, [my_foe.GetSheHe] tropeçará em sua [my_foe.Custom('signature_weapon')]?"
 single_combat.0001.wound_threshold.major_bonus.tt:0 "Torna-se muito mais difícil [single_combat_injury_chance_injure|E] a mim mesmo"
 single_combat.0001.wound_threshold.major_malus.tt:0 "Torna-se muito mais fácil para meu oponente [single_combat_injury_chance_injure|E] [my_foe.GetHerselfHimself]"
 single_combat.0001.wound_threshold.medium_bonus.tt:0 "Torna-se mais difícil [single_combat_injury_chance_injure|E] a mim mesmo"
 single_combat.0001.wound_threshold.medium_malus.tt:0 "Torna-se mais fácil para meu oponente [single_combat_injury_chance_injure|E] [my_foe.GetHerselfHimself]"
 single_combat.0001.wound_threshold.minor_bonus.tt:0 "Torna-se ligeiramente mais difícil [single_combat_injury_chance_injure|E] a mim mesmo"
 single_combat.0001.wound_threshold.minor_malus.tt:0 "Torna-se ligeiramente mais fácil para meu oponente [single_combat_injury_chance_injure|E] [my_foe.GetHerselfHimself]"
 single_combat.0001.wrath_of_highgod:0 "Pela [myself.GetFaith.HighGodNameAlternate] e [myself.GetFaith.WarGodName], sofra blasfemo!"
 single_combat.0011.t:0 "$single_combat.0000.t$ [sc_defender.GetTitledFirstNameNoTooltip]"
 single_combat.0031.a.best_friend:0 "[sc_loser_best_friend.GetFirstNameNoTooltip], #DIE1 vinga-me#! #DIE2..."
 single_combat.0031.a.choking:0 "Grk-hrk-#EMP GRK#!-#DIE1 grk#!..."
 single_combat.0031.a.killed_by_another_head_of_faith:0 "[sc_loser.GetFaith.HighGodName] #DIE1 sorri para mim,#! #DIE2 [sc_victor.GetTitleAsNameNoTooltip], você pode dizer o mesmo#!..."
 single_combat.0031.a.killed_by_best_friend:0 "Você foi... #DIE1 minha [Select_CString(sc_victor.IsFemale,'irmã','irmão')] [sc_victor.GetFirstNameNoTooltip]#!... #DIE2 Eu te amava#!..."
 single_combat.0031.a.killed_by_close_or_extended_family:0 "Você não é #DIE1 [sc_loser.Custom2('RelationToMeShort', sc_victor)]#! #DIE2 de mim#!..."
 single_combat.0031.a.killed_by_cultural_head:0 "Você não é um #DIE1 verdadeiro#! #DIE2 [sc_loser.GetCulture.GetNameNoTooltip]#!..."
 single_combat.0031.a.killed_by_dynasty_head:0 "Melhor #DIE1 [sc_loser.GetHouse.GetName]#! #DIE1 do que [sc_loser.GetDynasty.GetBaseNameNoTooltip]#!..."
 single_combat.0031.a.killed_by_friend_or_lover:0 "Mas, #DIE1 [sc_victor.GetFirstNameNoTooltip]#!... #DIE2 por quê?!..."
 single_combat.0031.a.killed_by_house_head:0 "Você levará #DIE1 a Casa [sc_loser.GetHouse.GetName]#! #DIE2 à ruína#!..."
 single_combat.0031.a.killed_by_nemesis:0 "Eu te amaldiçoo, [sc_victor.GetFirstNameNoTooltip]. Você #DIE1 e a sua#! #DIE2 casa toda#!..."
 single_combat.0031.a.killed_by_rival:0 "Eu sempre... #DIE1 te odiei#! #DIE2 [sc_victor.GetFirstNameNoTooltip]#!..."
 single_combat.0031.a.killed_by_soulmate:0 "Nosso amor... #DIE1 deveria ser#!... #DIE2 eterno#!..."
 single_combat.0031.a.killed_by_spouse:0 "Morte... #DIE1 nos separa,#! #DIE2 né?#!"
 single_combat.0031.a.killed_by_your_head_of_faith:0 "É isso #DIE1 [sc_victor.GetFaith.HighGodName]#! #DIE2 desejo?#!"
 single_combat.0031.a.legend:0 "Vivo #DIE1 para sempre#! #DIE2 na lenda#!..."
 single_combat.0031.a.muffled:0 "Mrrm! #EMP MRRRMMM!#! #DIE2 Mrrrm#!..."
 single_combat.0031.a.pleading:0 "Não, não, #EMP não, NÃO! Apela-#! #BOL AAARGH!#!"
 single_combat.0031.a.saint:0 "[sc_loser.GetFaith.PositiveAfterLife]! #DIE1 Belo#!..."
 single_combat.0031.a.scream:0 "#EMP AAAARGH!#!"
 single_combat.0031.a.sinner:0 "Verei você no [sc_loser.GetFaith.NegativeAfterLife], bastardo!"
 single_combat.0031.a.soulmate:0 "[sc_loser_soulmate.GetFirstNameNoTooltip], #DIE1 perdoa-me#! #DIE2..."
 single_combat.0031.a.valhalla:0 "Valhala #DIE1 aguarda...#!"
 single_combat.0031.a.wordless:0 "..."
 single_combat.0031.b:0 "Me rendo! Me rendo!"
 single_combat.0031.c:0 "Você vai se arrepender do dia em que derrotou [sc_loser.GetTitledFirstNameNoTooltip]!"
 single_combat.0031.desc.opponent_response.attempt_disarm.fatality:0 "Antes que eu possa protestar, [sc_victor.GetFirstNameNoTooltip] lança um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] na minha caixa torácica, e tudo se reduz a uma dor ardente.\n\nSinto os próximos golpes, mas vagamente, como se através de uma névoa ou cortina espessa. Minha visão desaparece."
 single_combat.0031.desc.opponent_response.attempt_disarm.injury:0 "Ficamos nos encarando por um momento. É um silêncio tenso e constrangedor, ambos esperando o próximo movimento do outro.\n\n[sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponFlourishThirdPersonPresentParticiple')] seu(a) [sc_victor.Custom('signature_weapon')] ameaçadoramente e ergue uma sobrancelha."
 single_combat.0031.desc.opponent_response.attempt_disarm:0 "[sc_victor.GetFirstNameNoTooltip] desfere um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] no meu [sc_loser.Custom('signature_weapon')], o golpe forte realmente o enviando voando para longe da minha mão.\n\n"
 single_combat.0031.desc.opponent_response.blade_dance.fatality:0 "entalhando golpes sanguinolentos em meu antebraço e peito superior, sugando meu sangue como água de poço.\n\nSó fica claro que sou um brinquedo para [sc_victor.GetSheHe] quando [sc_victor.GetSheHe] termina de brincar.\n\nExaurido, morrendo, eu caio de joelhos. Uma poça do meu próprio sangue me aquece enquanto eu luto para olhar para o meu assassino.\n\n[sc_victor.GetFirstNameNoTooltip] retorna meu olhar com desinteresse vazio. Seu(a) [sc_victor.Custom('signature_weapon')] começa a descer terrivelmente para baixo."
 single_combat.0031.desc.opponent_response.blade_dance.injury:0 "dançando em direção aos meus golpes apenas para recuar no último instante.\n\nEstou quase hipnotizado, então, minha [sc_loser.Custom('signature_weapon')] desaparece num piscar de olhos. A arma cai no chão, me deixando impotente enquanto [sc_victor.GetFirstNameNoTooltip] se prepara para [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')]."
 single_combat.0031.desc.opponent_response.blade_dance:0 "[sc_victor.GetFirstNameNoTooltip] seria belo de se ver, não fosse por seu uso de seu(a) [sc_victor.Custom('signature_weapon')] em mim, tecendo-o dessa forma e daquela,"
 single_combat.0031.desc.opponent_response.butchery.fatality:0 "Não demora muito para eu me tornar um destroço tremendo, [sc_loser.Custom('EyeEyes')] selvagens de dor. Eu queria sentir dormência, mas parece que isso fica mais intenso a cada golpe [Select_CString( sc_victor.IsFemale, 'da', 'do' )] [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('signature_weapon')].\n\nÉ praticamente uma misericórdia quando [sc_victor.GetSheHe] me agarra pela parte de trás da cabeça e [sc_victor.Custom('SignatureWeaponKillTypeHead2ThirdPersonActive')]; pelo menos eu morro mais rápido."
 single_combat.0031.desc.opponent_response.butchery.injury:0 "Sinto quase ossos menores se quebrando, o sangue correndo pelas artérias machucadas, empurrando contra a carne machucada. Minha visão fica turva, embaralhada. Quanto tempo nós estamos lutando? Quando eu caí no chão?\n\n[sc_victor.GetFirstNameNoTooltip] se ergue sobre mim, [sc_victor.Custom('signature_weapon')] erguida, pronta para [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]."
 single_combat.0031.desc.opponent_response.butchery:0 "[sc_victor.GetFirstNameNoTooltip] não perde tempo desferindo [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] em mim, cada um cuidadosamente calculado para causar a máxima angústia.\n\n"
 single_combat.0031.desc.opponent_response.confident_attack.fatality:0 "até que um golpe inesperado me rasga bem no estômago.\n\nO golpe me joga para trás, algo carnudo e vermelho profundo escorregando para fora da ferida enquanto eu desabo no [sc_defender.Custom('GroundType')].\n\nA dor me domina. Será que já sangrei tanto antes? Minha [sc_loser.Custom('signature_weapon')] é chutada para longe, mas eu não consigo me importar.\n\nAcima de mim, [sc_victor.GetFirstNameNoTooltip] se prepara para o [sc_victor.Custom('signature_weapon')] final."
 single_combat.0031.desc.opponent_response.confident_attack.injury:0 "trabalhando em cima de mim até minha guarda fraquejar o suficiente para que [sc_victor.GetSheHe] tenha a #EMP abertura perfeita#!.\n\nCom um golpe poderoso, o [sc_victor.GetWomanMan] me faz recuar, enviando meu [sc_loser.Custom('signature_weapon')] voando. Um passo em falso agora significa a morte."
 single_combat.0031.desc.opponent_response.confident_attack:0 "[sc_victor.GetFirstNameNoTooltip] traz seu(a) [sc_victor.Custom('signature_weapon')] para uma série de [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')],"
 single_combat.0031.desc.opponent_response.desert_warrior.fatality:0 "habilmente derrubando meus joelhos.\n\nLançado ao [sc_defender.Custom('GroundType')], eu luto para me levantar, completamente sem ar.\n\n[sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponWoundVerb2ThirdPersonPresent')] no meu peito de cima, e, assim como isso, acabou. Meus membros tremem pateticamente, mas a luta deixou meu corpo."
 single_combat.0031.desc.opponent_response.desert_warrior.injury:0 "fazendo uma série de [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] precisos que me derrubam, exausto, no [sc_defender.Custom('GroundType')].\n\nEu rolo para o lado e vejo [sc_victor.GetFirstNameNoTooltip] se preparando para [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')], [sc_victor.Custom('signature_weapon')] já erguida."
 single_combat.0031.desc.opponent_response.desert_warrior:0 "[sc_victor.GetFirstNameNoTooltip] aproveita o calor, deixando-me exausto, antes de"
 single_combat.0031.desc.opponent_response.enthusiastic_onslaught.fatality:0 "que parecem risíveis. Pelo menos, até que uma delas acerta minha mão com [sc_loser.Custom('signature_weapon')], fazendo minha arma voar para longe.\n\nEu tenho apenas tempo suficiente para erguer uma mão protetora quando [sc_victor.GetFirstNameNoTooltip] se aproxima e [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive')] com seu(a) [sc_victor.Custom('signature_weapon')], [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive_Aftermath')].\n\nMinha boca se move sem palavras, a dor é intensa demais para fazer mais do que engasgar."
 single_combat.0031.desc.opponent_response.enthusiastic_onslaught.injury:0 "que quase arranca minha mão do punho do meu [sc_loser.Custom('signature_weapon')].\n\nUm último golpe é tudo o que [sc_victor.GetSheHe] precisa para me fazer ajoelhar. Antes que eu consiga levantar minha guarda novamente, a [sc_victor.GetFirstNameNoTooltip] extasiada já está pressionando seu(a) [sc_victor.Custom('signature_weapon')]-[sc_victor.Custom('SignatureWeaponTipType')] contra minha garganta."
 single_combat.0031.desc.opponent_response.enthusiastic_onslaught:0 "[sc_victor.GetFirstNameNoTooltip] grita algo incoerente e depois parte para uma série de [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] desajeitados."
 single_combat.0031.desc.opponent_response.expert_onslaught.fatality:0 "me espanca, me forçando ao chão em um amontoado de gritos e ossos quebrados.\n\nMinha visão fica turva, a visão recuando sob a dor, mas ainda consigo ver pedaços da minha carne martelada grudados no [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('signature_weapon')].\n\nO próximo golpe me pega pela garganta, cortando meus gritos curtos com misericórdia sangrenta."
 single_combat.0031.desc.opponent_response.expert_onslaught.injury:0 "me derruba com cada golpe, machucando meus ossos com cada defesa, até eu colapsar no chão em um amontoado quase quebrado.\n\nSinto-me tão frio, tão tonto, como se minha cabeça estivesse martelando, mas minha mente estivesse em outra sala. O que... estamos girando? Estou girando?\n\nUm pedaço de catarro ensanguentado força seu caminho para fora da minha boca em uma tosse rouca; o espasmo faz com que [sc_loser.Custom('signature_weapon')] escorregue da minha mão. [sc_victor.GetFirstNameNoTooltip] chuta-o para longe, em seguida, encosta o metal frio de seu(a) [sc_victor.Custom('signature_weapon')] contra minha garganta."
 single_combat.0031.desc.opponent_response.expert_onslaught:0 "[sc_victor.GetFirstNameNoTooltip] investe #EMP com força#! em mim, uma chuva interminável de [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] que"
 single_combat.0031.desc.opponent_response.feint_and_stab.fatality:0 "O golpe se aprofunda no meu peito, e uma verdadeira fonte de sangue jorra da ferida.\n\nTalvez tenha sido uma loucura enfrentar um [sc_victor.GetWomanMan] que mata por esporte com tanta regularidade? Talvez sim, talvez não. De qualquer forma, a dormência que se espalha rapidamente em meus membros me diz que não tenho muito tempo para lamentar meus erros."
 single_combat.0031.desc.opponent_response.feint_and_stab.injury:0 "Tento mudar para uma defesa apropriada, mas é tarde demais, e a empunhadura da adaga me acerta com força na bochecha.\n\nMinha pegada na minha arma relaxa, e sinto ela cair da minha mão, minha visão embaralhada pelo golpe."
 single_combat.0031.desc.opponent_response.feint_and_stab:0 "[sc_victor.GetFirstNameNoTooltip] faz um [sc_victor.Custom('SignatureWeaponAttemptedLight')] em minha direção com seu(a) [sc_victor.Custom('signature_weapon')] de um jeito, e depois muda habilmente o ímpeto para uma adaga na outra mão, pegando minha guarda completamente de surpresa.\n\n"
 single_combat.0031.desc.opponent_response.forest_fighter.fatality:0 "o galho da árvore antes de tropeçar nele, caindo na vegetação.\n\nEspinhos e sarças raspam meu [sc_loser.Custom('MaskFace')], algo resistente puxa minha [sc_loser.Custom('signature_weapon')] quase para longe do meu alcance. Luto para libertá-lo, dobrado no chão, quando algo frio como a morte [sc_victor.Custom('SignatureWeaponKillTypeRearTorsoThirdPersonActive')].\n\nMeu colapso é imediato, terra e plantas apodrecidas enchendo minha boca. Não consigo sentir minhas pernas e meus braços se tornaram moles.\n\n[sc_victor.GetFirstNameNoTooltip] me chuta de costas para o golpe final."
 single_combat.0031.desc.opponent_response.forest_fighter.injury:0 "o toco de árvore para trás para onde [sc_victor.GetSheHe] me empurra.\n\nEu tropeço de costas, [sc_loser.Custom('signature_weapon')] voando para a mata. Antes que eu possa me endireitar, um chute forte me derruba entre as folhas, e um [sc_victor.Custom('signature_weapon')] de metal frio pressiona com força contra a minha garganta."
 single_combat.0031.desc.opponent_response.forest_fighter:0 "[sc_victor.GetFirstNameNoTooltip] luta como se fosse parte da floresta, enquanto mal consigo enxergar"
 single_combat.0031.desc.opponent_response.guard.fatality:0 "até que um golpe mal direcionado da minha própria [sc_loser.Custom('signature_weapon')] torce a arma para fora do meu alcance.\n\n[sc_victor.GetFirstNameNoTooltip] não perde tempo em desencadear uma série de [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')], cada um rasgando tiras ensanguentadas da minha carne.\n\nEu caio de joelhos, ofegando, tossindo grossos cordões vermelhos de cuspe. [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('MaskFace')] é impassível enquanto [sc_victor.GetSheHe] se prepara para o golpe mortal."
 single_combat.0031.desc.opponent_response.guard.injury:0 "então, com um #EMP flash#!-parry-riposte, torce meu [sc_loser.Custom('signature_weapon')] direto da minha mão.\n\nEu mal tive tempo de piscar.\n\nEsbanjando confiança, meu adversário assume uma postura ofensiva, se preparando para [sc_loser.Custom('SignatureWeaponKillTypeFirstPersonFuture')]."
 single_combat.0031.desc.opponent_response.guard:0 "[sc_victor.GetFirstNameNoTooltip] avança, [sc_victor.Custom('signature_weapon')] bloqueando qualquer contra-ataque,"
 single_combat.0031.desc.opponent_response.hail_mary.fatality:0 "seu objetivo está muito alto para tal tática, um amador! Eu sinto pena [sc_victor.GetHerHim], realmente. Se algo, um golpe como esse me acertaria na testa-"
 single_combat.0031.desc.opponent_response.hail_mary.injury:0 "Por um momento, estou divertido com a impudência [sc_victor.GetHerHim], até sentir algo agarrar a parte de trás da minha perna.\n\nNum piscar de olhos, estou no chão, e [sc_victor.GetFirstNameNoTooltip] fica de pé sobre mim, exatamente tão surpreso quanto eu. O braço de seu(a) [sc_victor.Custom('signature_weapon')], no entanto, permanece firme e ameaçador."
 single_combat.0031.desc.opponent_response.hail_mary:0 "[sc_victor.GetFirstNameNoTooltip] sabe que está em desvantagem e se lança desesperadamente para a frente, [sc_victor.Custom('signature_weapon')] pronta para [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')].\n\n"
 single_combat.0031.desc.opponent_response.hard_grit.fatality:0 "Não demora muito para eu me tornar um destroço tremendo, [sc_loser.Custom('EyeEyes')] selvagens de dor. Eu queria sentir dormência, mas parece que isso fica mais intenso a cada golpe [Select_CString( sc_victor.IsFemale, 'da', 'do' )] [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('signature_weapon')].\n\nÉ praticamente uma misericórdia quando [sc_victor.GetSheHe] me agarra pela parte de trás da cabeça e [sc_victor.Custom('SignatureWeaponKillTypeHead2ThirdPersonActive')]; pelo menos eu morro mais rápido."
 single_combat.0031.desc.opponent_response.hard_grit.injury:0 "Com competência profissional, [sc_victor.GetFirstNameNoTooltip] me conduz para cá e para lá, cada golpe me jogando até [sc_victor.GetSheHe] conseguir torcer [sc_loser.Custom('signature_weapon')] diretamente da minha [sc_loser.Custom('HandHands')].\n\nPor um instante, fico atordoado."
 single_combat.0031.desc.opponent_response.hard_grit:0 "O comportamento [Select_CString( sc_victor.IsFemale, 'da', 'do' )] [sc_victor.GetFirstNameNoTooltip] permanece passivo enquanto lutamos, mas seu(a) [sc_victor.Custom('signature_weapon')] cobra um amargo tributo, me forçando para trás com uma série bem colocada de [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')].\n\n"
 single_combat.0031.desc.opponent_response.hurt_me_better.fatality:0 "culminando em uma série de [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] que me atingem como um filhote recém-nascido.\n\nCada um dos meus contra-ataques parece ineficaz, meu oponente disposto a receber uma quantidade absurda de castigo, desde que [sc_victor.GetSheHe] possa devolvê-lo com juros.\n\nEu não vejo o golpe fatal, apenas sinto [sc_victor.Custom('SignatureWeaponWoundVerb2PresentParticiple')] em meu lado. Sangue quente e úmido começa a pulsar pela minha cintura enquanto eu caio no [sc_defender.Custom('GroundType')]."
 single_combat.0031.desc.opponent_response.hurt_me_better.injury:0 "culminando em um rugido gutural e uma saraivada de [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] que me forçam a ficar de joelhos.\n\nTento erguer minha [sc_loser.Custom('signature_weapon')] para bloquear outro golpe devastador, apenas para levar um rápido joelho diretamente no [sc_loser.Custom('MaskFace')].\n\nEu caio para trás no [sc_defender.Custom('GroundType')], a visão nadando, assim que o brilho da [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('signature_weapon')]-[sc_victor.Custom('SignatureWeaponTipType')] entra em foco."
 single_combat.0031.desc.opponent_response.hurt_me_better:0 "[sc_victor.GetFirstNameNoTooltip] parece positivamente #EMP atraído#! pelos meus esforços, cada golpe que entreguei alimentando a paixão [sc_victor.GetHerHim] pela batalha, eventualmente"
 single_combat.0031.desc.opponent_response.is_that_a_crocodile.fatality:0 "se choca contra mim, me derrubando no chão.\n\nMinha [sc_loser.Custom('signature_weapon')] sai voando. Por um instante, eu encaro o abdômen aberto do terrível réptil.\n\nEntão tudo fica escuro, úmido e doloroso: eu luto, engasgo, tento gritar, mas nenhum som escapa da boca da fera, apenas o som de ossos esmagados e medula esguichando."
 single_combat.0031.desc.opponent_response.is_that_a_crocodile:0 "[sc_victor.GetFirstNameNoTooltip] se afasta, e é um instante antes de eu saber por quê. De lugar nenhum, um temível crocodilo"
 single_combat.0031.desc.opponent_response.jungle_stalker.fatality:0 "me acerta em cheio no olho com a [sc_victor.Custom('SignatureWeaponEndType')] de seu(a) [sc_victor.Custom('signature_weapon')].\n\nSurpreso e já lutando contra a vegetação, minha própria [sc_loser.Custom('signature_weapon')] se solta da minha mão.\n\nSem defesa, sou presa fácil para [sc_victor.GetFirstNameNoTooltip], e uma série de [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] me eviscera rapidamente."
 single_combat.0031.desc.opponent_response.jungle_stalker.injury:0 "me acertando #EMP com força#! na virilha, me derrubando com um grito.\n\nNo chão, eu me debato por alguns segundos, tentando me livrar do que quer que seja essa maldita planta-demoníaca, amaldiçoando a dor ardente nas minhas partes baixas, apenas para parar abruptamente quando sinto o metal frio de [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')]-[sc_victor.Custom('SignatureWeaponTipType')] pressionado contra a minha testa."
 single_combat.0031.desc.opponent_response.jungle_stalker:0 "[sc_victor.GetFirstNameNoTooltip] usa bem a selva, esperando até uma videira me enredar antes"
 single_combat.0031.desc.opponent_response.like_a_viper.fatality:0 "O tempo parece desacelerar. Consigo sentir meu braço com [sc_loser.Custom('signature_weapon')] se movendo, mas é muito lento para intervir, mas minha visão se prende na arma mortal se preparando para [sc_victor.Custom('SignatureWeaponWoundVerb3')] meu peito.\n\nEntão ela atinge.\n\nA carne se rasga. Os ossos se partem e, em seguida, se esmigalham. Sinto algo perfurando minhas costas, mas não sei se é parte de mim ou metal. Eu não consigo... Eu não consigo respirar. Eu não consigo sentir. Eu não consigo."
 single_combat.0031.desc.opponent_response.like_a_viper.injury:0 "Tento desviar o golpe desta víbora, mas é inútil. Meu oponente aproveita a oportunidade para enganar meu [sc_loser.Custom('signature_weapon')] e dobrá-lo na direção errada, arremessando a arma pateticamente para longe do meu alcance.\n\n[sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('signature_weapon')] repousa no meu peito, logo na frente do meu coração que bate rapidamente."
 single_combat.0031.desc.opponent_response.like_a_viper:0 "[sc_victor.GetFirstNameNoTooltip] quase parece reluzir, então [sc_victor.GetSheHe] está sobre mim, [sc_victor.Custom('signature_weapon')] indo direto ao meu coração.\n\n"
 single_combat.0031.desc.opponent_response.martial_voice.fatality:0 "Há algo naquela voz que me paralisa, como um veado ao som do chifre do caçador. O golpe deveria ser fácil de bloquear, ou esquivar, ou... qualquer coisa, na verdade.\n\nMas eu não faço isso.\n\nEm vez disso, ele [sc_victor.Custom('SignatureWeaponWoundVerb2ThirdPersonPresent')] fundo no meu ombro, separando os ossos e nos banhando ambos com sangue arterial."
 single_combat.0031.desc.opponent_response.martial_voice.injury:0 "Dando um salto para trás tão rápido que quase deixo minha pele para trás, é questão de segundos antes de eu perceber que meu [sc_loser.Custom('signature_weapon')] não saltou comigo, girando pelo ar onde o larguei, me deixando indefeso enquanto [sc_victor.GetFirstNameNoTooltip] prepara um segundo golpe."
 single_combat.0031.desc.opponent_response.martial_voice:0 "[sc_victor.GetFirstNameNoTooltip] grita comigo, com seu tom completamente inadequado para um nobre, apenas para mudar para um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] com seu(a) [sc_victor.Custom('signature_weapon')] no meio do grito.\n\n"
 single_combat.0031.desc.opponent_response.mocking_boast.fatality:0 "bate [sc_loser.Custom('signature_weapon')] da minha mão como se fosse um brinquedo de criança.\n\n[sc_loser.Custom('EyeEyes')|U] arregalados de medo, eu entro em pânico, mas já é tarde demais. Seu(a) [sc_victor.Custom('signature_weapon')] está avançando, pronta para [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] com um único golpe rápido."
 single_combat.0031.desc.opponent_response.mocking_boast.injury:0 "acerto um golpe sólido na minha mão que segura a [sc_loser.Custom('signature_weapon')] com o [sc_victor.Custom('SignatureWeaponEndType')] de sua própria [sc_loser.Custom('signature_weapon')], fazendo a arma girar para longe do meu alcance.\n\nMeu oponente se prepara para [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] com um floreio e um sorriso irônico.\n\n\"Agora, o que o perdedor diz?\""
 single_combat.0031.desc.opponent_response.mocking_boast:0 "[sc_victor.GetFirstNameNoTooltip] lança insulto após insulto na minha direção, usando minha momentânea contração para"
 single_combat.0031.desc.opponent_response.nut_em.fatality:0 "e tudo fica escuro. Meus [sc_loser.Custom('EyeEyes')] simplesmente... param de funcionar. Eu agito minha [sc_loser.Custom('signature_weapon')] desesperadamente, tentando afastar o [sc_victor.GetWomanMan] hostil que tenta me matar.\n\nNão adianta, pois sinto algo [sc_victor.Custom('SignatureWeaponWoundVerb1')] profundamente no meu ombro, abrindo um caminho sangrento pelo meu corpo.\n\nEu cambaleio e balanço, tossindo uma mistura de catarro de sabor metálico: [sc_victor.GetFirstNameNoTooltip] deve ter atingido um pulmão."
 single_combat.0031.desc.opponent_response.nut_em.injury:0 "e eu caio como um saco de tijolos.\n\nPor #EMP [sc_loser.GetFaith.HighGodName]#!, [sc_victor.GetWomanMan] tem uma cabeça #EMP absurdamente#! dura.\n\nMeu mundo ainda está girando, raios brancos de agonia rasgando pequenos rasgos na minha visão, quando olho para cima e vejo [sc_victor.GetFirstNameNoTooltip] se preparando para [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] com um único golpe rápido."
 single_combat.0031.desc.opponent_response.nut_em:0 "[sc_victor.GetFirstNameNoTooltip] se lança à frente inesperadamente, me acertando com um cabeceio direto na [sc_loser.Custom('MaskFace')],"
 single_combat.0031.desc.opponent_response.onslaught.fatality:0 "muitos para defender. Eu bloqueio os primeiros dois ou três, mas o quarto golpe [sc_victor.GetHerHim] derruba a [sc_loser.Custom('signature_weapon')] da minha [sc_loser.Custom('HandHands')], e o quinto tira o fôlego dos meus pulmões.\n\nTenho apenas um momento para entender o que está acontecendo antes [Select_CString( sc_victor.IsFemale, 'da', 'do' )] [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponWoundVerb2ThirdPersonPresent')] profundamente na minha caixa torácica, quebrando ossos e rasgando carne.\n\nEu caio para trás, ofegando, morrendo. Meu peito está queimando de calor e meus membros já estão frios, minha própria consciência parecendo esvair-se pela ferida aberta."
 single_combat.0031.desc.opponent_response.onslaught.injury:0 "me forçando de volta vez após vez.\n\nNão demora muito até eu desmoronar, caindo para trás com um estrondo. [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponActionThirdPerson')] seu(a) [sc_victor.Custom('signature_weapon')] uma última vez sobre minha forma caída, pronto para me encerrar em um instante."
 single_combat.0031.desc.opponent_response.onslaught:0 "[sc_victor.GetFirstNameNoTooltip] lança [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] após [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] em minha direção,"
 single_combat.0031.desc.opponent_response.open_terrain_expert.fatality:0 "Não é até que eu me estenda demais que vejo o que [sc_victor.GetSheHe] está fazendo. Minha [sc_loser.Custom('signature_weapon')] foi arremessada muito longe na minha frente, [sc_victor.GetFirstNameNoTooltip] gira seu(a) [sc_victor.Custom('signature_weapon')] de volta e uma dor ardente e intensa explode no meu lado.\n\nEu desabo, ofegando e tossindo, engolindo suspiros estrangulados de ar. Tudo é inútil.\n\n[sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponActionThirdPerson')] seu(a) [sc_victor.Custom('signature_weapon')] para o golpe final."
 single_combat.0031.desc.opponent_response.open_terrain_expert.injury:0 "Não demora muito até eu cambalear, exausto, e meu oponente me faz tombar no chão com um único [sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\nEu tento me levantar, mas a bota [Select_CString( sc_victor.IsFemale, 'da', 'do' )] [sc_victor.GetFirstNameNoTooltip] desce sobre o meu peito, e [sc_victor.GetSheHe] ergue seu(a) [sc_victor.Custom('signature_weapon')] para [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]."
 single_combat.0031.desc.opponent_response.open_terrain_expert:0 "[sc_victor.GetFirstNameNoTooltip] usa o amplo espaço a seu favor com uma série avassaladora de [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')], apenas para girar para fora do meu alcance após cada ataque.\n\n"
 single_combat.0031.desc.opponent_response.pocket_sand.fatality:0 "há uma explosão de puro tormento direto nas minhas entranhas.\n\nEu caio para trás, e algo me pega sob o queixo, cortando profundamente o osso da minha mandíbula. Sangue arterial jorra livremente da ferida, minha vida escorrendo para o [sc_defender.Custom('GroundType')] enquanto eu desabo no chão."
 single_combat.0031.desc.opponent_response.pocket_sand.injury:0 "algo pesado derruba meus joelhos.\n\nEu pestanejo rapidamente, tentando clarear minha visão, e a imagem nebulosa que surge à vista é de [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')] se preparando para [sc_victor.Custom('SignatureWeaponKillTypeGroinFirstPersonFuture')]."
 single_combat.0031.desc.opponent_response.pocket_sand:0 "[sc_victor.GetFirstNameNoTooltip] se abaixa por um instante. Na próxima coisa que sei, meu [sc_loser.Custom('MaskFace')] está coberto de [sc_defender.Custom('GritType')], e"
 single_combat.0031.desc.opponent_response.pocket_silver.fatality:0 "há [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')]-[sc_victor.Custom('SignatureWeaponTipType')] se erguendo para me encontrar.\n\nA arma me atinge em cheio na boca, em uma explosão de dentes e pedaços carnudos de carne. Minha mandíbula pende flácida e inútil. Eu cambaleio, tentando gritar, mas só soluços engasgados saem.\n\nEu nem mesmo vejo o golpe de misericórdia [Select_CString( sc_victor.IsFemale, 'da', 'do' )] [sc_victor.GetFirstNameNoTooltip]."
 single_combat.0031.desc.opponent_response.pocket_silver.injury:0 "[sc_victor.GetSheHe] trouxe seu(a) [sc_victor.Custom('signature_weapon')] rapidamente #EMP por dentro#! da minha guarda, bem sob a minha garganta.\n\nEu espasmo meu [sc_loser.Custom('signature_weapon')] reflexivamente, avaliando minhas opções em um silêncio constrangedor.\n\n[sc_victor.GetFirstNameNoTooltip] franze a testa para mim, e seus músculos se contraem prontos para atacar."
 single_combat.0031.desc.opponent_response.pocket_silver:0 "[sc_victor.GetFirstNameNoTooltip] arremessa algo pesado e parecido com uma bolsa na minha direção. Quando me esquivo,"
 single_combat.0031.desc.opponent_response.probing_attack.fatality:0 "me empurrando sutilmente mais e mais para fora de equilíbrio até que um golpe errante me faça tombar.\n\nEu nunca chego ao chão, [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponKillTypeRearTorsoPresentParticiple')] com um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]."
 single_combat.0031.desc.opponent_response.probing_attack.injury:0 "cada vez minando minha determinação com um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] calculado.\n\nFaço o meu melhor para mantê-lo afastado, mas eventualmente [sc_victor.GetSheHe] derruba o [sc_loser.Custom('signature_weapon')] limpo da minha mão.\n\nTenho apenas questão de segundos antes de ser [sc_loser.Custom('SignatureWeaponKillTypePastParticiple')]."
 single_combat.0031.desc.opponent_response.probing_attack:0 "[sc_victor.GetFirstNameNoTooltip] traz seu(a) [sc_victor.Custom('signature_weapon')] várias vezes, escolhendo seus momentos com cuidado,"
 single_combat.0031.desc.opponent_response.put_the_boot_in.fatality:0 "Usando a abertura com maestria, [sc_victor.GetFirstNameNoTooltip] se move suavemente em um [sc_victor.Custom('SignatureWeaponAttemptedLight')] que arranca a [sc_loser.Custom('signature_weapon')] da minha mão.\n\n[sc_victor.GetSheHe|U] está em seu balanço de volta antes que eu possa desviar, [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponWoundVerb1PresentParticiple')] letalmente no meu peito."
 single_combat.0031.desc.opponent_response.put_the_boot_in.injury:0 "faço o meu melhor, mas meu oponente parte direto para um desfile de [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')], e não demora muito até eu estar no chão, atordoado e ofegante.\n\nEmbora ainda tenha minha [sc_loser.Custom('signature_weapon')] à mão, [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('signature_weapon')] está pronto para [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]."
 single_combat.0031.desc.opponent_response.put_the_boot_in:0 "[sc_victor.GetFirstNameNoTooltip] desfere um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] feroz de seu(a) [sc_victor.Custom('signature_weapon')], seguido de um chute forte no meu peito que me faz cambalear.\n\n"
 single_combat.0031.desc.opponent_response.raaargh.fatality:0 "[sc_loser.Custom('SignatureWeaponBreaksVerbPresentParticiple')] da minha [sc_loser.Custom('signature_weapon')] com um único [sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\n[sc_victor.GetFirstNameNoTooltip] avança, me socando tão forte no [sc_loser.Custom('MaskFace')] que engulo vários dentes e sou arremessado para trás, girando sobre a minha cabeça.\n\nEu caio no [sc_defender.Custom('GroundType')] com força, totalmente incapaz de processar o que está acontecendo. Quando volto aos meus sentidos, há uma bota descendo rapidamente sobre o [sc_loser.Custom('MaskFace')].\n\nE novamente e novamente e novamente..."
 single_combat.0031.desc.opponent_response.raaargh.injury:0 "me arremessando como um boneco de trapos.\n\nEu caio para trás, perdendo minha [sc_victor.Custom('signature_weapon')], e [sc_victor.GetSheHe] se ergue sobre mim, ódio #EMP bestial#! em seu(s) [sc_victor.Custom('EyeEyes')]. Isso... isso é como eu morro.\n\nTão rapidamente quanto veio, a raiva desaparece, deixando [sc_victor.GetFirstNameNoTooltip] oscilando suavemente, ainda quase pronto para [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] apesar da calma momentânea."
 single_combat.0031.desc.opponent_response.raaargh:0 "Num momento, [sc_victor.GetFirstNameNoTooltip] está normal, no próximo, [sc_victor.GetSheHe] é uma máquina de fúria aterrorizante, aniquilando minha guarda e"
 single_combat.0031.desc.opponent_response.reason_you_suck_speech.fatality:0 "Eu grito de frustração.\n\nParece que foi exatamente isso o que [sc_victor.GetFirstNameNoTooltip] estava esperando, pois é essa distração momentânea que [sc_victor.GetSheHe] usa para passar pela minha guarda e [sc_victor.Custom('SignatureWeaponWoundVerb5')] seu(a) [sc_victor.Custom('signature_weapon')] na minha garganta.\n\nEu começo a engasgar e sufocar quase imediatamente, mas o ar nunca vem. Apenas sangue. Coágulos de sangue espesso e cheio de cuspe, subindo pela minha garganta e saindo pela minha boca."
 single_combat.0031.desc.opponent_response.reason_you_suck_speech.injury:0 "minha guarda se quebra de pura frustração.\n\nNesse #EMP exato#! momento [sc_victor.GetSheHe] ataca, um [sc_victor.Custom('SignatureWeaponAttemptedLight')] arrancando meu [sc_loser.Custom('signature_weapon')] da minha mão com um floreio praticado.\n\n\"Não se preocupe, [sc_victor.GetFirstNameNoTooltip]; você ainda tem um melhor controle sobre sua [sc_loser.Custom('signature_weapon')] do que seu [sc_loser.GetPrimaryTitle.GetTierAsNameNoTooltip]\"."
 single_combat.0031.desc.opponent_response.reason_you_suck_speech:0 "[sc_victor.GetFirstNameNoTooltip] se afasta de cada um dos meus golpes, contrapondo cada ataque com uma provocação vil sobre mim, até que"
 single_combat.0031.desc.opponent_response.rough_terrain_expert.fatality.boggy:0 "Eu escorrego e caio em uma poça profunda de água salobra.\n\nMinha [sc_loser.Custom('signature_weapon')] é perdida imediatamente, e enquanto eu luto, uma bota pesada desce sobre a parte de trás do meu pescoço, me segurando sob a poça fétida.\n\nToda minha luta é recebida com um balanço casual [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('signature_weapon')], até que eu não tenha mais forças nem para tentar afastá-lo de mim."
 single_combat.0031.desc.opponent_response.rough_terrain_expert.fatality.rocky:0 "Eu tropeço, escorrego e caio pela encosta, membros desordenados.\n\nAlgo afiado, uma pedra ou arma, me atinge na espinha, e minha metade inferior fica dormente enquanto minha metade superior grita de agonia. O mundo para de repente. Meu braço está dobrado na direção errada, sangue está enchendo meu olho, e estou tão frio.\n\n[sc_victor.GetFirstNameNoTooltip] se ergue sobre mim, pronto para encerrar meu sofrimento."
 single_combat.0031.desc.opponent_response.rough_terrain_expert.injury.boggy:0 "Eu caio para trás direto em uma poça de lama lamacenta.\n\nMinha [sc_loser.Custom('signature_weapon')] escapa da minha mão imediatamente, e eu me debato para colocar minha cabeça acima da água, para inspirar ar e cuspir a água fétida do pântano.\n\nUma bota pisa suavemente no meu [sc_loser.Custom('MaskFace')], mantendo-me apenas um pouco acima da superfície, ameaçando me afundar."
 single_combat.0031.desc.opponent_response.rough_terrain_expert.injury.rocky:0 "Eu caio para trás sobre uma pequena elevação, aterrissando mal entre as pedras, escapando por pouco da minha própria [sc_loser.Custom('signature_weapon')].\n\nEu me arrasto até ficar de pé como posso, mas o metal frio de [sc_victor.Custom('signature_weapon')] [Select_CString( sc_victor.IsFemale, 'da', 'do' )] [sc_victor.GetFirstNameNoTooltip] já está pressionado na nuca do meu pescoço."
 single_combat.0031.desc.opponent_response.rough_terrain_expert:0 "[sc_victor.GetFirstNameNoTooltip] parece entender bem a área, me fazendo tropeçar repetidamente, até que"
 single_combat.0031.desc.opponent_response.something_to_hide.injury:0 "me sacudindo de volta para a dolorosa realidade.\n\nAntes que eu consiga levantar minha guarda, o golpe de acompanhamento [Select_CString( sc_victor.IsFemale, 'da', 'do' )] [sc_victor.GetFirstNameNoTooltip] arranca a [sc_loser.Custom('signature_weapon')] da minha mão, me deixando aberto e vulnerável."
 single_combat.0031.desc.opponent_response.something_to_hide:0 "[sc_victor.GetFirstNameNoTooltip] sibila um dos meus segredos mais #EMP profanos#!. Compelido e distraído, permito que o próximo golpe me atinja,"
 single_combat.0031.desc.opponent_response.special_fallback.fatality:0 "[sc_victor.Custom('SignatureWeaponEndType')] [Select_CString( sc_victor.IsFemale, 'da', 'do' )] [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('signature_weapon')] voando direto para o meu [sc_loser.Custom('MaskFace')]. Eu caio de bruços com um suspiro, minha [sc_loser.Custom('signature_weapon')] se afastando enquanto eu desabo, e meu oponente me chuta de costas.\n\nAntes que eu tenha tempo de protestar, [sc_victor.GetSheHe] [sc_victor.Custom('SignatureWeaponKillTypeThirdPersonActive')] com seu(a) [sc_victor.Custom('signature_weapon')]. Meu estômago #EMP canta#! de agonia, meus membros ficam dormentes, meu rosto fica frio.\n\nIsso... isso é isso."
 single_combat.0031.desc.opponent_response.special_fallback.injury:0 "[sc_victor.Custom('SignatureWeaponTipType')] da seu(a) [sc_victor.Custom('signature_weapon')] pressionada contra o meu [sc_loser.Custom('MaskFace')], inevitavelmente próxima."
 single_combat.0031.desc.opponent_response.special_fallback:0 "[sc_victor.GetFirstNameNoTooltip] semicerra os olhos por uma fração de segundo, depois me chuta, com violência, na canela.\n\nEu tropeço, apenas para me encontrar encarando"
 single_combat.0031.desc.opponent_response.stoic_veteran.fatality:0 "até um último esforço contra minha [sc_loser.Custom('signature_weapon')] [sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent2')].\n\nNão sou deixado muito tempo para contemplar meu infortúnio, já que o próximo golpe me atinge em cheio no peito e [sc_victor.Custom('SignatureWeaponKillTypeTorsoThirdPersonActive')].\n\nEu desabo no chão, a vida se esvaindo a cada segundo, a boca se movendo mais por acidente do que por escolha. [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('signature_weapon')] ainda está cravada em mim."
 single_combat.0031.desc.opponent_response.stoic_veteran.injury:0 "cada um rasgando o [sc_loser.Custom('SignatureWeaponEndMaterial')] da minha [sc_loser.Custom('signature_weapon')] até que a arma se [sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent')].\n\nDepois disso, é moleza para [sc_victor.GetFirstNameNoTooltip] me desarmar da minha [sc_loser.Custom('signature_weapon')] quebrada, me deixando nu e vulnerável ao próximo golpe que possa vir."
 single_combat.0031.desc.opponent_response.stoic_veteran:0 "[sc_victor.GetFirstNameNoTooltip] é implacável, enviando uma onda cerrada de [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] em minha direção,"
 single_combat.0031.desc.opponent_response.strict_guard.fatality:0 "rasga minha guarda. Outro envia uma onda de dor gélida pelo meu peito, e meu braço com [sc_loser.Custom('signature_weapon')] pende inutilmente ao meu lado.\n\nNão consigo sentir o membro, não consigo mover minhas pernas, não consigo fazer nada.\n\nOutro [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] [sc_victor.Custom('SignatureWeaponCriticalPresent')] no meu peito, e eu vacilo, cambaleando no lugar.\n\n[sc_victor.GetFirstNameNoTooltip] prepara seu(a) [sc_victor.Custom('signature_weapon')] para o golpe final."
 single_combat.0031.desc.opponent_response.strict_guard.injury:0 "me faz cambalear.\n\nAntes que eu possa me endireitar, [sc_victor.GetFirstNameNoTooltip] está sobre mim novamente, [sc_victor.Custom('signature_weapon')] voando em direção à minha cabeça [sc_victor.Custom('SignatureWeaponEndType')]-primeiro, até eu levar uma [sc_loser.Custom('MaskFace')] cheia de [sc_victor.Custom('SignatureWeaponEndMaterial')] contundente. Mal percebo [sc_loser.Custom('signature_weapon')] escorregando da minha mão."
 single_combat.0031.desc.opponent_response.strict_guard:0 "[sc_victor.GetFirstNameNoTooltip] avança, [sc_victor.Custom('signature_weapon')] formando uma barreira impermeável, até um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]"
 single_combat.0031.desc.opponent_response.surprise_attack.fatality:0 "fazendo minha [sc_loser.Custom('signature_weapon')] girar para longe da minha mão.\n\nEu recuo rapidamente, mas não tão rapidamente quanto [sc_victor.GetFirstNameNoTooltip] pode avançar, [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonPresentParticiple')] em um movimento rápido.\n\nA vida se esvai de mim, eu desabo, com lucidez suficiente para olhar meu assassino nos olhos."
 single_combat.0031.desc.opponent_response.surprise_attack.injury:0 "pegando-me de surpresa. O golpe me faz girar tão rapidamente que quase caio no chão.\n\nAntes que eu possa me recuperar, [sc_victor.GetSheHe] reposicionou seu(a) [sc_victor.Custom('signature_weapon')] pronto para um golpe mortal. Ambos congelamos, contemplando o movimento, e fica claro que meu golpe [sc_victor.GetFirstNameNoTooltip] irá [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] antes que eu possa desviar ou aparar."
 single_combat.0031.desc.opponent_response.surprise_attack:0 "[sc_victor.GetFirstNameNoTooltip] faz um blefe em uma direção, apenas para se mover na outra com um [sc_victor.Custom('SignatureWeaponAttemptedLight')],"
 single_combat.0031.desc.opponent_response.taunt.fatality:0 "abandono minha guarda e me jogo em direção a [sc_victor.GetSheHe].\n\nNão é surpresa quando meu ataque imprudente dá a [sc_victor.GetFirstNameNoTooltip] uma chance aberta em minha barriga."
 single_combat.0031.desc.opponent_response.taunt.injury:0 "jogo [sc_loser.Custom('signature_weapon')] no chão e tento sufocar [sc_victor.GetSheHe] eu mesmo.\n\nSó quando [sc_victor.GetFirstNameNoTooltip] balança seu(a) [sc_victor.Custom('signature_weapon')] que percebo o que fiz."
 single_combat.0031.desc.opponent_response.taunt:0 "[sc_victor.GetFirstNameNoTooltip] me atinge com uma série de comentários incrivelmente pessoais, até que eu"
 single_combat.0031.desc.opponent_response.technique_from_legend.fatality:0 "Tento bloquear, mas erro... algo. Meu mundo gira, e sinto um movimento vertiginoso e nauseante me dominando até que minha cabeça se choca com algo com um #EMP tum# carnudo!\n\nNão consigo sentir nada. Não consigo falar. Eu... eu vejo meu corpo deitado a alguns metros de distância, jorrando sangue do toco do pescoço."
 single_combat.0031.desc.opponent_response.technique_from_legend.injury:0 "Em uma cena tão pitoresca que poderia ser tirada diretamente da lenda, meu oponente afasta minha guarda, arrancando meu [sc_loser.Custom('signature_weapon')] da minha mão antes de desferir um golpe devastador que me derruba no chão.\n\n[sc_victor.Custom('signature_weapon')|U] erguida, sem se importar com a minha mandíbula caída, [sc_victor.GetSheHe] se prepara para [sc_victor.Custom('SignatureWeaponKillTypeGroinFirstPersonFuture')]."
 single_combat.0031.desc.opponent_response.technique_from_legend:0 "[sc_victor.GetFirstNameNoTooltip] parece hesitar por um momento, antes de adotar uma pose dramática e [sc_victor.Custom('SignatureWeaponFlourishPresentParticiple')] em minha direção com seu(a) [sc_victor.Custom('signature_weapon')].\n\n"
 single_combat.0031.desc.opponent_response.tire_opponent.fatality:0 "uma abertura adequada aparece na minha guarda.\n\nO próximo golpe rasga uma ferida enorme no meu estômago, fazendo com que sangue, bile e comida meio digerida escorram sobre minhas botas.\n\nEu grito, a dor é inimaginável, agarrando minhas vísceras expostas. Talvez tudo seja apenas em minha mente, mas eu imagino um lampejo de piedade passando pelo [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('MaskFace')] enquanto [sc_victor.GetSheHe] se prepara para acabar com meu sofrimento."
 single_combat.0031.desc.opponent_response.tire_opponent.injury:0 "Sinto meu controle sobre minha [sc_loser.Custom('signature_weapon')] enfraquecer.\n\nMeu oponente deve ter lido algo em minha postura, pois uma varredura firme de seu(a) [sc_victor.Custom('signature_weapon')] envia minha arma voando. Estou à mercê [sc_victor.GetHerHim]."
 single_combat.0031.desc.opponent_response.tire_opponent:0 "[sc_victor.GetFirstNameNoTooltip] luta com a inércia da própria Terra, me deixando cansar repetidamente, até que"
 single_combat.0031.desc.opponent_response.unsure_attack.fatality:0 "e eu recuo para trás.\n\n[sc_victor.GetSheHe|U] deve ter me pego em algum lugar, mas a dor súbita é intensa demais para identificar exatamente onde. Sinto o sangue quente e úmido jorrando do meu peito, a agonia se espalhando em nós, se espalhando pelo meu torso superior.\n\n[sc_victor.GetFirstNameNoTooltip] empunha seu(a) [sc_victor.Custom('signature_weapon')], avançando para [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')]."
 single_combat.0031.desc.opponent_response.unsure_attack.injury:0 "e apesar da timidez do golpe, ele me atinge da maneira errada e eu caio para o lado.\n\nEmbora eu me esforce para me levantar, uma [sc_victor.GetFirstNameNoTooltip] extasiada já tem seu(a) [sc_victor.Custom('signature_weapon')] posicionada, pronta para [sc_victor.Custom('SignatureWeaponKillTypeGroinFirstPersonFuture')] com apenas um movimento."
 single_combat.0031.desc.opponent_response.unsure_attack:0 "[sc_victor.GetFirstNameNoTooltip] traz seu(a) [sc_victor.Custom('signature_weapon')] para um [sc_victor.Custom('SignatureWeaponAttemptedLight')],"
 single_combat.0031.desc.opponent_response.wait_and_hope.fatality:0 "que de alguma forma passa direto pela minha guarda e [sc_victor.Custom('SignatureWeaponKillTypeTorsoThirdPersonActive')].\n\nEu recuo, a [sc_victor.Custom('signature_weapon')] do meu oponente se soltando com um som molhado enquanto eu recuo. O sangue começa a jorrar da ferida, encharcando o chão aos meus pés, e minha boca se move sem palavras.\n\n[sc_victor.GetFirstNameNoTooltip] parece tão chocado quanto eu."
 single_combat.0031.desc.opponent_response.wait_and_hope.injury:0 "que me pega diretamente nas juntas da mão do meu [sc_loser.Custom('signature_weapon')].\n\nReflexivamente, meus dedos se abrem, deixando minha arma cair no chão.\n\nNós nos olhamos #EMP incrédulos#! por alguns segundos até que [sc_victor.GetFirstNameNoTooltip] ergue seu(a) [sc_victor.Custom('signature_weapon')] hesitantemente.\n\n\"R-render-se ou morrer!\""
 single_combat.0031.desc.opponent_response.wait_and_hope:0 "[sc_victor.GetFirstNameNoTooltip] fica congelado por um instante, antes de tentar um golpe cauteloso."
 single_combat.0031.desc.opponent_response.wrath_of_highgod.fatality:0 "um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] que atinge com tanta força que minha [sc_loser.Custom('signature_weapon')] [sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent')].\n\nAtordoado, eu congelo, deixando a arma inútil cair no [sc_defender.Custom('GroundType')]. Isso dura apenas um segundo, mas um segundo é tudo que [sc_victor.GetFirstNameNoTooltip] precisa para [sc_loser.Custom('SignatureWeaponKillTypeFirstPersonFuture')]."
 single_combat.0031.desc.opponent_response.wrath_of_highgod.injury:0 "um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] inesperado que desequilibra completamente.\n\n[sc_victor.GetFirstNameNoTooltip] avança, trazendo seu(a) [sc_victor.Custom('signature_weapon')] a centímetros do meu [sc_loser.Custom('MaskFace')].\n\n\"Renda-se, pelo [sc_victor.GetFaith.WarGodName], ou morra!\""
 single_combat.0031.desc.opponent_response.wrath_of_highgod:0 "[sc_victor.GetFirstNameNoTooltip] grita sua devoção a [sc_victor.GetFaith.HighGodName] aos céus, seguindo com"
 single_combat.0031.desc.result.mistake:0 "#BOL Resultado:#! Eu perco o [single_combat_fight|E] para [sc_victor.GetFirstNameNoTooltip] devido à minha pontuação de [single_combat_injury_chance_injury_risk|E]"
 single_combat.0031.desc.result.skill:0 "#BOL Resultado:#! Eu perco o [single_combat_fight|E] para [sc_victor.GetFirstNameNoTooltip] devido à pontuação de sua [single_combat_success_chance_skill|E]"
 single_combat.0031.desc.result.sudden_death:0 "#BOL Resultado:#! Eu perco o [single_combat_fight|E] para [sc_victor.GetFirstNameNoTooltip] devido a [single_combat_fight_sudden_death|E]"
 single_combat.0031.desc.sc_attacker.attempt_disarm.fatality:0 "realmente [sc_loser.Custom('SignatureWeaponBreaksVerbPresentParticiple')].\n\nÉ brincadeira de criança para [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] com seu(a) [sc_victor.Custom('signature_weapon')] depois disso, e meu mundo se reduz a pequenos pontos de luz e dor."
 single_combat.0031.desc.sc_attacker.attempt_disarm.injury:0 "enviando a arma voando.\n\nImpotente, tenho apenas um momento para admitir a derrota antes que [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponKillTypeThirdPersonActive')]."
 single_combat.0031.desc.sc_attacker.attempt_disarm:0 "Calculando que este seja meu melhor momento para uma vitória fácil, tento varrer a [sc_victor.Custom('signature_weapon')] da mão do meu oponente com um [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] poderoso. É quase uma surpresa quando [sc_victor.GetSheHe] pega minha [sc_loser.Custom('signature_weapon')] no ângulo errado,"
 single_combat.0031.desc.sc_attacker.blade_dance.fatality:0 "O que esse petulante jovem pensa que [sc_victor.GetSheHe] está fazendo, eu-\n\nEu tenho [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')] alojada no meu peito. Como. De onde. Mas eu sou... sou um artista."
 single_combat.0031.desc.sc_attacker.blade_dance.injury:0 "Preciso me concentrar, preciso me recuperar, posso vencer, só preciso, eu só, eu- Estou encarando um [sc_victor.GetFirstNameNoTooltip] decididamente arrogante, que [sc_victor.Custom('SignatureWeaponActionThirdPerson')] o [sc_victor.Custom('signature_weapon')] ainda #EMP muito#! em sua(s) [sc_victor.Custom('HandHands')] com um ar de ameaça deliberada."
 single_combat.0031.desc.sc_attacker.blade_dance:0 "Na batalha, sou um artista. Cada golpe é uma pincelada, cada oponente caído é... #EMP caramba#!, ai, caramba, minha mão com a [sc_loser.Custom('signature_weapon')], [sc_victor.GetSheHe] me atingiu #EMP bem#! na minha mão com a [sc_loser.Custom('signature_weapon')], isso não deveria acontecer!\n\n"
 single_combat.0031.desc.sc_attacker.butchery.fatality:0 "entra dentro da minha guarda e [sc_victor.Custom('SignatureWeaponKillTypeHead2FirstPersonFuture')].\n\nEu tropeço para a frente, sem palavras, engasgando com meu próprio sangue, até mesmo deixando minha [sc_loser.Custom('signature_weapon')] cair para me concentrar em tentar tapar o ferimento que jorra meu sangue para o [sc_defender.Custom('GroundType')].\n\nIsso é... é assim que foi? Tantas vezes..."
 single_combat.0031.desc.sc_attacker.butchery.injury:0 "me desarma com facilidade alarmante.\n\nMinha postura e intimidação agora soam vazias, qualquer posição dramática facilmente contrariada por um movimento rápido do [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('signature_weapon')]."
 single_combat.0031.desc.sc_attacker.butchery:0 "Aparentemente, matar camponeses aterrorizados à frente de um exército de saqueadores profissionais é algo um tanto diferente de um combate individual contra um único inimigo obstinado.\n\nTécnicas que aterrorizam crianças, doentes e idosos simplesmente não têm o mesmo efeito no meu oponente, que aproveita minha confiança fácil para"
 single_combat.0031.desc.sc_attacker.confident_attack.fatality:0 "consegue um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] sólido no meu estômago, rasgando a carne frágil e derramando minhas vísceras no chão.\n\nEu escorrego na bagunça das minhas próprias entranhas, tropeçando para trás com um grito, o corpo em chamas de angústia.\n\nO golpe de misericórdia não pode chegar rápido o suficiente."
 single_combat.0031.desc.sc_attacker.confident_attack.injury:0 "rebate minha própria arma de volta para mim com uma parada bem colocada.\n\nDesviando minha [sc_loser.Custom('signature_weapon')], eu fico bem no caminho da [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('signature_weapon')], e embora o golpe pare no ponto de não causar dano letal, ele ainda me lança para o chão. Minha arma voa quando eu caio."
 single_combat.0031.desc.sc_attacker.confident_attack:0 "Eu empunho minha [sc_loser.Custom('signature_weapon')] com perícia e elegância, mas mesmo um especialista comete erros. No meio de um [sc_loser.Custom('SignatureWeaponAttemptedLight')] calculadamente arriscado, meu oponente"
 single_combat.0031.desc.sc_attacker.desert_warrior.fatality:0 "É apenas quando eu paro para enxugar uma gota de suor dos #EMP meus#! [sc_loser.Custom('EyeEyes')] que as coisas começam a dar terrivelmente errado: [sc_victor.GetFirstNameNoTooltip] escolhe exatamente esse #EMP exato#! momento para me atingir com um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]. Sou derrubado antes que possa me reerguer, e o próximo golpe [sc_victor.Custom('SignatureWeaponWoundVerb5ThirdPersonPresent')] desajeitadamente em meu pescoço.\n\nEu gorgolejo através da minha garganta destroçada, soprando bolhas sangrentas enquanto tento dizer algo, qualquer coisa. Apesar do calor, me sinto tão frio."
 single_combat.0031.desc.sc_attacker.desert_warrior.injury:0 "Vários [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] inesperados [Select_CString( sc_victor.IsFemale, 'da', 'do' )] [sc_victor.GetFirstNameNoTooltip] depois, tropeço e caio de rosto no [sc_defender.Custom('GroundType')]. Seu(a) [sc_victor.Custom('signature_weapon')] está na parte de trás do meu pescoço instantaneamente."
 single_combat.0031.desc.sc_attacker.desert_warrior:0 "Espero e espero e espero que meu oponente se canse do calor do deserto, mas [sc_victor.GetSheHe] parece apenas continuar suando, continuando a lutar, e minha consternação enfraquece minha guarda.\n\n"
 single_combat.0031.desc.sc_attacker.enthusiastic_onslaught.fatality:0 "Não passam de alguns golpes quando algo [sc_victor.Custom('SignatureWeaponWoundVerb2ThirdPersonPresent')] fundo no meu peito. Eu giro, completamente sem equilíbrio, e vejo [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('signature_weapon')] se soltar do meu corpo em uma explosão de fragmentos sangrentos e ósseos.\n\nA dor chega uma fração de segundo depois que a incredulidade para. Uma agonia agonizante e ardente rapidamente superada por uma dormência que se espalha inexoravelmente a partir do ferimento fatal no meu peito."
 single_combat.0031.desc.sc_attacker.enthusiastic_onslaught.injury:0 "Eu não vejo tanto o golpe de [sc_victor.Custom('SignatureWeaponEndType')] na lateral da minha cabeça quanto sinto, uma explosão de dor escaldante em minha têmpora acompanhada por uma súbita mudança de perspectiva quando eu tomba de lado.\n\nOs pés [Select_CString( sc_victor.IsFemale, 'da', 'do' )] [sc_victor.GetFirstNameNoTooltip] entram em vista na minha frente, mudando para uma postura de combate após uma pausa cheia de pena.\n\nTenho forças apenas para emitir uma única linha."
 single_combat.0031.desc.sc_attacker.enthusiastic_onslaught:0 "Eu me lanço contra meu oponente, [sc_loser.Custom('signature_weapon')] [sc_loser.Custom('SignatureWeaponFlourishPresentParticiple')], determinado a derrubar [sc_loser.GetSheHe] com o máximo de ataques selvagens que forem necessários.\n\n"
 single_combat.0031.desc.sc_attacker.expert_onslaught.fatality:0 "Até que uma surpreendente deflexão desvia em direção ao meu [sc_loser.Custom('MaskFace')], [sc_loser.Custom('SignatureWeaponWoundVerb6PresentParticiple')] uma ferida até o osso e me faz cambalear para trás. Solto um grito de agonia surpreso, afastando-me das armas colidindo, quando meus pés são varridos por baixo de mim.\n\nHá tempo apenas o suficiente para gritar uma protesto antes que [sc_victor.GetSheHe] [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive')], [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive_Aftermath')].\n\nA morte é um alívio."
 single_combat.0031.desc.sc_attacker.expert_onslaught.injury:0 "No entanto, quando eu tomo um momento para desfrutar da doce sensação, um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] vindo do nada me atinge com força na têmpora. Momentaneamente atordoado, eu vacilo, e o próximo golpe me deixa sem arma, totalmente à mercê [Select_CString( sc_victor.IsFemale, 'da', 'do' )] [sc_victor.GetFirstNameNoTooltip].\n\nExausto mas triunfante, meu oponente [sc_victor.Custom('SignatureWeaponActionThirdPerson')] sua [sc_victor.Custom('signature_weapon')] para o golpe fatal."
 single_combat.0031.desc.sc_attacker.expert_onslaught:0 "Com habilidade mortal, lanço uma verdadeira barragem de [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] em meu oponente, forçando [sc_victor.GetSheHe] a recuar passo a passo. A vitória está tão perto que posso senti-la!\n\n"
 single_combat.0031.desc.sc_attacker.feint_and_stab.fatality:0 "o que me distrai o tempo suficiente para que eu não perceba o [sc_victor.Custom('SignatureWeaponAttemptedLight')] subsequente antes que ele [sc_victor.Custom('SignatureWeaponKillTypeTorso2PresentParticiple')].\n\nEu vacilo e então caio para trás no [sc_defender.Custom('GroundType')], convulsionando, tentando gritar, mas incapaz de fazer mais do que um sussurro rouco. Como alguém poderia sobreviver a tanta dor de #EMP#!?\n\nEles não poderiam."
 single_combat.0031.desc.sc_attacker.feint_and_stab.injury:0 "apenas para que #EMP que#! arma seja arremessada para longe de mim pelo movimento de retorno [Select_CString( sc_victor.IsFemale, 'da', 'do' )] [sc_victor.GetFirstNameNoTooltip].\n\nDesarmado, sem arma reserva e com meu oponente se preparando para [sc_victor.Custom('SignatureWeaponKillTypeGroinFirstPersonFuture')], só há uma coisa a fazer."
 single_combat.0031.desc.sc_attacker.feint_and_stab:0 "Dividir minha atenção entre dois golpes provou ser... ambicioso. Só percebo que o [sc_loser.Custom('signature_weapon')] foi arrancado da minha mão quando minha adaga secundária é puxada involuntariamente em direção a ele,"
 single_combat.0031.desc.sc_attacker.forest_fighter.fatality:0 "se lança em um turbilhão de [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')].\n\nNão sei exatamente qual deles acerta uma artéria em algum lugar, mas não demora muito para eu diminuir a velocidade, encharcado em meu próprio sangue dos ombros até o pulso. Sem muita cerimônia, caio para trás. Estou tão cansado. Não consigo mais... não consigo mais..."
 single_combat.0031.desc.sc_attacker.forest_fighter.injury:0 "me pega com um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] devastador que quase me deixa inconsciente.\n\nQuando meus sentidos retornam, minha [sc_loser.Custom('signature_weapon')] se foi e há uma arma pressionada firmemente contra minha garganta."
 single_combat.0031.desc.sc_attacker.forest_fighter:0 "Às vezes, as florestas são tão densas e ameaçadoras que apenas um tolo pensa em pisar nelas sozinho. Às vezes, elas são tão idílicas que crianças desmaiam só de pensar em brincar lá.\n\nNosso trecho atual de floresta tende para a última opção, e enquanto busco algum obstáculo ambiental para tirar vantagem, meu oponente"
 single_combat.0031.desc.sc_attacker.guard.fatality:0 "um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] do meu oponente que penetra profundamente na carne da minha coxa.\n\nNós trocamos vários golpes, até que eu percebo uma sensação alarmante de umedecimento na altura da cintura. Por um momento, acho que minha coragem me abandonou no meio da batalha, até que um olhar para baixo mostra minha perna #EMP encharcada#! de sangue.\n\nTudo de uma vez, isso me atinge e eu caio no chão, ainda tremendo."
 single_combat.0031.desc.sc_attacker.guard.injury:0 "vários [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')], com o golpe final derrubando minha arma.\n\n[sc_victor.GetFirstNameNoTooltip] não perde tempo em preparar sua própria [sc_victor.Custom('signature_weapon')] para um golpe mortal."
 single_combat.0031.desc.sc_attacker.guard:0 "Faço o meu melhor para manter uma postura defensiva sólida, mas não adianta. Uma brecha evidente em meus bloqueios me deixa vulnerável a"
 single_combat.0031.desc.sc_attacker.hail_mary.fatality:0 "É uma derrota tão rápida que nem tenho certeza se meu primeiro golpe acertou.\n\nEm um momento, estou atacando [sc_victor.GetFirstNameNoTooltip] com tudo o que tenho, no próximo, não consigo sentir minha mão com a [sc_loser.Custom('signature_weapon')]. Algo... algo na minha coluna, talvez? Não consigo mexer um músculo enquanto caio no [sc_defender.Custom('GroundType')].\n\nSou chutado de costas, pelo menos me é dada a dignidade de olhar nos olhos do meu assassino.\n\nEntão seu(a) [sc_victor.Custom('signature_weapon')] mergulha."
 single_combat.0031.desc.sc_attacker.hail_mary.injury:0 "uma sucessão de trapalhadas.\n\nGolpes erram ou ricocheteiam nas defesas [Select_CString( sc_victor.IsFemale, 'da', 'do' )] [sc_victor.GetFirstNameNoTooltip] para me atingir, eu perco o equilíbrio e até mesmo consigo me bater na [sc_loser.Custom('MaskFace')] com minha própria mão descontrolada.\n\nÉ praticamente uma misericórdia quando meu oponente gentilmente arranca a [sc_loser.Custom('signature_weapon')] da minha mão."
 single_combat.0031.desc.sc_attacker.hail_mary:0 "Às vezes, quando se está lutando, você simplesmente sabe que está em desvantagem. Esse é o caso aqui, já que minha tentativa desesperada se transforma em uma enxurrada selvagem de [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] em"
 single_combat.0031.desc.sc_attacker.hard_grit.fatality:0 "Leva um tempo até que um de nós cometa um erro que o outro possa explorar, mas eventualmente acontece. Eu me comprometo demais com um [sc_loser.Custom('SignatureWeaponAttemptedLight')], e antes que eu possa desviar, [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')] está cravada em minhas entranhas.\n\nAssim é a vida."
 single_combat.0031.desc.sc_attacker.hard_grit.injury:0 "É uma luta tensa, mas eventualmente, caio em um desses blefes difíceis de se recuperar. Em vez disso, fico caído no chão, sem arma."
 single_combat.0031.desc.sc_attacker.hard_grit:0 "No combate, tenho o hábito fácil de explorar a arrogância do meu adversário. Confiança injustificada é melhor punida com uma derrota rápida. Meu oponente agora, no entanto, parece determinado a igualar cada golpe meu e nada mais, deixando brechas apenas para me atrair a me estender demais.\n\n"
 single_combat.0031.desc.sc_attacker.hurt_me_better.fatality:0 "Não importa quem, qualquer [sc_loser.GetWomanMan] só pode derramar tanto sangue, e parece que eu simplesmente derramei muito.\n\n[sc_victor.GetFirstNameNoTooltip] prepara seu(a) [sc_victor.Custom('signature_weapon')] para [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]."
 single_combat.0031.desc.sc_attacker.hurt_me_better.injury:0 "Neste ponto, com minha mente preocupada, não é preciso muito para que [sc_victor.GetFirstNameNoTooltip] desvie meus golpes, me desarme e force uma rendição."
 single_combat.0031.desc.sc_attacker.hurt_me_better:0 "Eu não sou estranho à dor e faço o meu melhor para aproveitar as lesões que meu oponente me causou. Mesmo para mim, no entanto, essas provam ser demais, e minha mente se concentra menos na doce picada da agonia e mais na sensação puramente desconfortável de carne rasgada.\n\nÀ medida que minha concentração se dissipa, o que deveria ser um ataque entusiasmado se transforma em uma triste sequência de [sc_loser.Custom('SignatureWeaponAttemptedLightPlural')].\n\n"
 single_combat.0031.desc.sc_attacker.is_that_a_crocodile.fatality:0 "Um mergulho oportunista [Select_CString( sc_victor.IsFemale, 'da', 'do' )] [sc_victor.GetFirstNameNoTooltip] vai direto através da minha guarda, permitindo que [sc_victor.Custom('SignatureWeaponWoundVerb3')] a metade superior do meu corpo com um golpe poderoso.\n\nEu caio para trás, pedaços de carne rasgada e tiras de vísceras voando enquanto a arma é retirada de mim. O que é. Eu não fiz. Isso não pode ser. Ajuda.\n\n#EMP Ajuda.#!"
 single_combat.0031.desc.sc_attacker.is_that_a_crocodile:0 "Eu recuo, cedendo terreno rapidamente para me colocar fora do alcance da fera. Exceto que ela não se move.\n\nÉ uma pedra. É apenas uma maldita #EMP pedra#!, não um maldito crocodilo, e agora meu oponente me desequilibrou e me deixou cambaleando.\n\n"
 single_combat.0031.desc.sc_attacker.jungle_stalker.fatality:0 "O olhar acaba sendo minha ruína. [sc_victor.GetFirstNameNoTooltip] aproveita a oportunidade com alegria, e quando olho para cima meio segundo depois, [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')]-[sc_victor.Custom('SignatureWeaponTipType')] está prestes a [sc_victor.Custom('SignatureWeaponWoundVerb1')] em minha barriga.\n\nEu grito de dor, mas é tarde demais. Mesmo que o primeiro ferimento não tenha sido fatal, [sc_victor.GetFirstNameNoTooltip] parece acertar com mais precisão no próximo golpe."
 single_combat.0031.desc.sc_attacker.jungle_stalker.injury:0 "Tento me libertar com minha [sc_loser.Custom('signature_weapon')], mas não sou rápido o suficiente, e [sc_victor.GetFirstNameNoTooltip] me atinge com um [sc_victor.Custom('SignatureWeaponAttemptedLight')] que enterra minha arma no chão da selva.\n\nTenho talvez alguns segundos antes que o duelo acabe para mim."
 single_combat.0031.desc.sc_attacker.jungle_stalker:0 "A selva torna muitos aspectos da luta difíceis, mas um amador paciente pode superar alguns de seus piores obstáculos simplesmente mantendo a calma. Foi enquanto esperava pelo temperamento do meu oponente se romper que senti algo começar a se enrolar em torno da minha perna e olhei para baixo para ver que fiquei enroscado em uma videira pesada.\n\n"
 single_combat.0031.desc.sc_attacker.like_a_viper.fatality:0 "o arco da [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('signature_weapon')], que ceifa meu peito lateralmente, [sc_victor.Custom('SignatureWeaponKillTypeTorsoPresentParticiple')] com um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\nJogado para longe pelo contra-ataque e pelo meu próprio impulso, eu caio no [sc_defender.Custom('GroundType')]. Meus braços ainda funcionam, mas já se sentem... tão fracos. Tão pesados. É tudo o que posso fazer para virar, o sangue vermelho e pegajoso inundando para fora do meu peito."
 single_combat.0031.desc.sc_attacker.like_a_viper.injury:0 "A pura #EMP tenacidade [sc_victor.GetHerHim]!\n\nInclinando-se contra o meu ataque, não para longe dele, [sc_victor.GetFirstNameNoTooltip] é capaz de me redirecionar apenas o suficiente para #EMP por muito pouco#! errar, me deixando aberto para um rápido golpe no estômago.\n\nEu caio, e há [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')]-[sc_victor.Custom('SignatureWeaponTipType')] pressionada contra minha garganta antes que eu possa pensar em me recuperar."
 single_combat.0031.desc.sc_attacker.like_a_viper:0 "Eu me lanço, com força, em direção à brecha na guarda do meu oponente, [sc_loser.Custom('signature_weapon')]-[sc_loser.Custom('SignatureWeaponTipType')] cintilando, pronto para acabar com isso. O que eu falhei em considerar foi"
 single_combat.0031.desc.sc_attacker.martial_voice.fatality:0 "dá um passo à frente e calmamente [sc_victor.Custom('SignatureWeaponWoundVerb4ThirdPersonPresent')] a minha garganta com um movimento rápido.\n\nO fim é quase... anticlimático. Não há floreios, gritos ou sinais do sobrenatural vindo me buscar.\n\nApenas dor florescente, meu gorgolejo úmido e os olhos impassíveis [Select_CString( sc_victor.IsFemale, 'da', 'do' )] [sc_victor.GetFirstNameNoTooltip] [my_foe.Custom('EyeEyes')] assistindo-me morrer."
 single_combat.0031.desc.sc_attacker.martial_voice.injury:0 "lança um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] tremendo.\n\nSurpreendido e sem fôlego, eu sou derrubado sem dificuldade. [sc_victor.GetFirstNameNoTooltip] passa por cima de mim, preparando seu(a) [sc_victor.Custom('signature_weapon')] para [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]."
 single_combat.0031.desc.sc_attacker.martial_voice:0 "Comandar a ralé e comandar soldados de alta linhagem provam ser conjuntos de habilidades deprimentemente diferentes. Mais enfurecido do que surpreso com os meus gritos, meu oponente espera até que eu fique sem fôlego e depois"
 single_combat.0031.desc.sc_attacker.mocking_boast.fatality:0 "lanço em um ardil astuto, girando as costas para encarar [sc_victor.GetFirstNameNoTooltip] enquanto tento aparar na direção errada.\n\nMenos de um segundo depois, a arma de meu adversário [sc_victor.Custom('SignatureWeaponKillTypeRearTorsoThirdPersonActive')] com um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]. Eu me dobro, dobrado da maneira errada sobre minhas pernas, a agonia percorrendo qualquer pedaço de carne e osso destroçados que ainda conseguem se conectar aos meus nervos destroçados."
 single_combat.0031.desc.sc_attacker.mocking_boast.injury:0 "me atingem no peito com um [sc_victor.Custom('SignatureWeaponAttemptedLight')]. Surpreso e sem fôlego, eu ofereço pouca resistência ao próximo golpe, que pega minha [sc_loser.Custom('signature_weapon')], e [sc_victor.GetFirstNameNoTooltip] se prepara para [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] com seu próximo ataque."
 single_combat.0031.desc.sc_attacker.mocking_boast:0 "\"Sabe o que é uma boa maneira de ganhar uma reputação?\" pergunta meu oponente, [my_foe.Custom('EyeEyes')] estreitando em resposta aos meus deboches, \"matar alguém famoso\".\n\nEu... [sc_victor.GetSheHe] não está errado. Minha hesitação dá a [sc_victor.GetSheHe] #EMP justamente#! a oportunidade certa para"
 single_combat.0031.desc.sc_attacker.nut_em.fatality:0 "ao redor do queixo, [sc_victor.Custom('SignatureWeaponKillTypeHead2PresentParticiple')].\n\n[sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('signature_weapon')] sai ensopada no meu sangue. Eu meio que grito, meio que gorgolejo um grito de horror, mas meus braços ainda funcionam muito bem para meu inimigo considerar uma morte misericordiosa.\n\nEm vez disso, eu cambaleio por momentos torturantes, ainda segurando reflexivamente minha própria [sc_loser.Custom('signature_weapon')] por segurança, até que não consigo mais."
 single_combat.0031.desc.sc_attacker.nut_em.injury:0 "com força na barriga, me fazendo cair de cara no chão.\n\nEu me esforço para me levantar, mas vários chutes violentos rapidamente me mostram o erro do meu caminho. A [sc_victor.Custom('signature_weapon')] gentilmente pressionada contra a nuca do meu pescoço também não ajuda."
 single_combat.0031.desc.sc_attacker.nut_em:0 "Eu poderia jurar que vi uma brecha na guarda do meu oponente, mas, quando me lanço para enfiar minha cabeça no seu [sc_loser.Custom('MaskFace')], algo me pega"
 single_combat.0031.desc.sc_attacker.onslaught.fatality:0 "Algo estala no meu joelho e eu caio no chão. Embora role o mais rápido que posso, agitando minha [sc_loser.Custom('signature_weapon')] para afastar [sc_victor.GetFirstNameNoTooltip], não consigo #EMP ver#! [sc_victor.GetSheHe] em lugar nenhum. Onde [sc_victor.GetSheHe] foi, [sc_victor.GetSheHe] tem que estar aqui em algu-"
 single_combat.0031.desc.sc_attacker.onslaught.injury:0 "Em vez disso, minha [sc_loser.Custom('signature_weapon')] ceifa o vazio absoluto, e sinto algo pesado enganchar atrás do meu joelho e puxar. Desajeitadamente, meio me viro, tentando usar minha arma, e acabo levando um soco no [sc_loser.Custom('MaskFace')] por minha causa.\n\nEnquanto cambaleio, um golpe firme arranca minha [sc_loser.Custom('signature_weapon')], e fica imediatamente claro que perdi."
 single_combat.0031.desc.sc_attacker.onslaught:0 "Eu lanço [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] após [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] em meu oponente, uma chuva ininterrupta de golpes que conectam de forma devastadora. Até que não conectam mais.\n\n"
 single_combat.0031.desc.sc_attacker.open_terrain_expert.fatality:0 "Aterrissei suavemente, mas o pé [Select_CString( sc_victor.IsFemale, 'da', 'do' )] [sc_victor.GetFirstNameNoTooltip] na minha virilha não foi, e eu ainda estou atordoado por um instante vital. Isso é tudo o que é preciso para [sc_victor.Custom('SignatureWeaponKillTypeTorsoFirstPersonFuture')] com seu(a) [sc_victor.Custom('signature_weapon')].\n\nO sangue do meu coração bombeia furiosamente para cima e para fora do meu peito, escorrendo pelas minhas costelas, formando uma poça no [sc_defender.Custom('GroundType')] ao meu redor.\n\nPelo menos eu morro onde posso ver o céu aberto."
 single_combat.0031.desc.sc_attacker.open_terrain_expert.injury:0 "Minha [sc_loser.Custom('signature_weapon')] voa para fora do meu alcance, e o pé [Select_CString( sc_victor.IsFemale, 'da', 'do' )] [sc_victor.GetFirstNameNoTooltip] vem sobre meu pescoço antes que eu possa sequer ver onde ele pousa."
 single_combat.0031.desc.sc_attacker.open_terrain_expert:0 "Com muito espaço para lutar, eu recuo e recuo e recuo, trocando terreno pela frustração do meu oponente. Só percebo que tropecei quando registro que [sc_victor.GetSheHe] estava me cercando de alguma coisa. Vejo a pedra pela primeira vez quando caio para trás.\n\n"
 single_combat.0031.desc.sc_attacker.pocket_sand.fatality:0 "A distração permite que [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('signature_weapon')] se choque contra meu torso, [sc_victor.Custom('SignatureWeaponKillTypeTorsoPresentParticiple')] com eficiência brutal.\n\nMeu corpo explode em agonia e eu recuo. O quê? Como isso aconteceu? Eu...\n\nO sangue jorra do meu peito em jatos quentes e úmidos. Eu gorgolejo algo ininteligível através dos meus pulmões destruídos; mesmo #EMP assim,#! não tenho certeza do quê. O golpe de misericórdia vem lentamente demais."
 single_combat.0031.desc.sc_attacker.pocket_sand.injury:0 "Engasgando e tossindo, eu sou uma presa fácil para [sc_victor.GetFirstNameNoTooltip], que me acerta em cheio na garganta com a [sc_victor.Custom('SignatureWeaponEndType')] seu(a) [sc_victor.Custom('signature_weapon')], catapultando-me para o [sc_defender.Custom('GroundType')].\n\nEu mal recuperei o fôlego quando sinto a arma [sc_victor.GetHerHim] repousar contra minha barriga exposta."
 single_combat.0031.desc.sc_attacker.pocket_sand:0 "Agarrando um punhado de [sc_defender.Custom('GritType')], eu o atiro em meu oponente, apenas para que uma rajada de vento me desloque e faça com que o [sc_defender.Custom('GritType')] voe direto para #EMP o#! [sc_loser.Custom('MaskFace')].\n\n"
 single_combat.0031.desc.sc_attacker.pocket_silver.fatality:0 "[sc_victor.GetFirstNameNoTooltip] se move rápido, me derrubando no chão antes que eu possa ver o que está acontecendo. Um terrível momento depois, e [sc_victor.GetSheHe] [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive')], [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive_Aftermath')].\n\nEu grito no começo, mas meus pulmões falham mais rápido do que eu esperava, e logo tudo o que posso fazer é suportar em silêncio."
 single_combat.0031.desc.sc_attacker.pocket_silver.injury:0 "[sc_victor.GetFirstNameNoTooltip] aproveita sua vantagem, arrancando a [sc_loser.Custom('signature_weapon')] das minhas mãos. Agora indefeso, eu gentilmente cuspo uma moeda de prata."
 single_combat.0031.desc.sc_attacker.pocket_silver:0 "Com toda a destreza que posso reunir, pego uma bolsa de moedas da minha cintura e a lanço diretamente para o meu oponente. Infelizmente, [sc_victor.GetSheHe] reage por instinto mais rápido do que eu imaginava, destruindo a bolsa com um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] reflexivo que me cobre de moedas de prata pesadas.\n\nApesar da surpresa,"
 single_combat.0031.desc.sc_attacker.probing_attack.fatality:0 "a [sc_loser.Custom('signature_weapon')] [sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent')].\n\nTenho apenas tempo suficiente para perceber exatamente o quão ruins são as coisas antes que [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponKillTypeThirdPersonActive')] com uma série de [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')].\n\nA carne rasgada chora, eu cambaleio. Eu seguro nas minhas feridas, mas a mão só sai molhada com o meu próprio sangue.\n\nIsso... isso é o fim."
 single_combat.0031.desc.sc_attacker.probing_attack.injury:0 "Eu perco o controle.\n\nMinha [sc_loser.Custom('signature_weapon')] descreve uma elegante trajetória, final sobre final, me deixando desarmado em combate próximo.\n\n[sc_victor.GetFirstNameNoTooltip] só precisa [sc_victor.Custom('SignatureWeaponAction')] sua própria [sc_victor.Custom('signature_weapon')] para deixar claro quem venceu este combate."
 single_combat.0031.desc.sc_attacker.probing_attack:0 "Minha tentativa de economizar minha força dá errado rapidamente quando um dos meus ataques exploratórios é defendido tão pesadamente que"
 single_combat.0031.desc.sc_attacker.put_the_boot_in.fallback:0 "Embora meu [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] desequilibre meu oponente, o chute de acompanhamento falha completamente, e um [sc_victor.Custom('SignatureWeaponAttemptedLight')] retaliatório depois me deixa sem fôlego no chão.\n\n"
 single_combat.0031.desc.sc_attacker.put_the_boot_in.fatality:0 "[sc_victor.GetFirstNameNoTooltip] não me dá tempo para me recuperar, seu(a) [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponKillTypeTorso2PresentParticiple')] com um [sc_victor.Custom('SignatureWeaponAttemptedLight')]. O sangue jorra pela minha garganta e sai pela minha boca, respingando de volta no meu [sc_loser.Custom('MaskFace')] em uma mancha pegajosa.\n\nEm algum lugar sob camadas e camadas de dor, eu sinto meu coração ainda batendo, ainda bombeando sangue por veias rompidas e artérias despedaçadas. Não há volta a dar a partir disso."
 single_combat.0031.desc.sc_attacker.put_the_boot_in.injury:0 "Eu balanço para o lado, tentando me levantar, mas um golpe cruel da [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('signature_weapon')] me atinge na espinha e me derruba.\n\nEm algum lugar atrás e acima de mim, ouço [sc_victor.GetSheHe] se preparando para um golpe mortal com um risinho audível."
 single_combat.0031.desc.sc_attacker.put_the_boot_in.peg_leg:0 "Embora meu [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] desequilibre meu oponente, [sc_victor.GetSheHe] retaliou antes que meu chute sequer conectasse: um [sc_victor.Custom('SignatureWeaponAttemptedLight')] tão brutal que arranca minha perna falsa e me faz cair no chão.\n\n"
 single_combat.0031.desc.sc_attacker.raaargh.fatality:0 "Estou de pé alarmantemente perto [Select_CString( sc_victor.IsFemale, 'da', 'do' )] [sc_victor.GetFirstNameNoTooltip].\n\nFaço um esforço para estender meus braços em direção a [sc_victor.GetSheHe], notando com apenas interesse passageiro que deixei cair minha [sc_loser.Custom('signature_weapon')], mas... nada. De onde veio todo esse sangue? É aquele pedaço de carne meu? Por que me sinto tão... tão entorpecido?\n\nAh."
 single_combat.0031.desc.sc_attacker.raaargh.injury:0 "que eu consegui [sc_loser.Custom('SignatureWeaponBreaksVerbPastTense')] da minha [sc_loser.Custom('signature_weapon')]!\n\n[sc_victor.GetFirstNameNoTooltip] fica um pouco afastado, não muito pior do que quando eu fiquei enfurecido, me observando com cautela. Crucialmente, [sc_victor.GetSheHe] ainda tem uma arma, e não muito longe para um sólido golpe."
 single_combat.0031.desc.sc_attacker.raaargh:0 "Gritando como um louco, me lanço contra meu oponente, gesticulando, golpeando, mordendo, chutando, uma tempestade de raiva e violência que parece durar para sempre.\n\nQuando ela cessa, percebo"
 single_combat.0031.desc.sc_attacker.reason_you_suck_speech.fatality:0 "[sc_victor.GetFirstNameNoTooltip] aproveita o meu foco distraído para alinhar um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] sólido que [sc_victor.Custom('SignatureWeaponKillTypeHead2ThirdPersonActive')].\n\nEu recuo, jorrando como uma fonte macabra. Isso não pode ser. Não deveria terminar assim. Eu poderia ter... eu ainda poderia... eu posso...\n\nEu não posso fazer nada. Eu cambaleio até minha cova escorregadia de sangue."
 single_combat.0031.desc.sc_attacker.reason_you_suck_speech.injury:0 "[sc_victor.GetSheHe] me acerta no pescoço com um tapa de [sc_victor.Custom('SignatureWeaponEndType')].\n\nEnquanto eu engasgo e tossi, tentando puxar ar pela minha garganta machucada, [sc_victor.GetFirstNameNoTooltip] tem todo o tempo do mundo para preparar o golpe perfeito.\n\nEm apenas um segundo, [sc_victor.GetSheHe] certamente [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]."
 single_combat.0031.desc.sc_attacker.reason_you_suck_speech:0 "Alguns podem me chamar de tolo por criticar o estilo de vida do meu oponente enquanto ambos empunham armas mortais. Eles certamente se sentiriam vindicados quando"
 single_combat.0031.desc.sc_attacker.rough_terrain_expert.boggy:0 "Mesmo para um veterano como eu, pântanos e brejos oferecem muitos perigos difíceis de avaliar. Cada poça para a qual eu empurro meu oponente acaba sendo rasa a ponto de ser inofensiva, mas na primeira vez que dou um passo na água, afundo até o joelho!\n\n"
 single_combat.0031.desc.sc_attacker.rough_terrain_expert.fatality.boggy:0 "Foi apenas com o mais desesperado esforço da minha vida que consegui me libertar, mas minha sorte se mostrou de curta duração. Ao sair de uma poça, caio em outra, de cara. Algo lá em cima [sc_victor.Custom('SignatureWeaponKillTypeRearTorsoThirdPersonActive')].\n\nEu não consigo me mover. Não posso lutar. Tento gritar, mas a água verde enche meus pulmões, e eu afundo ainda mais no abismo pantanoso e profundo."
 single_combat.0031.desc.sc_attacker.rough_terrain_expert.fatality.rocky:0 "No final, isso prova ser minha ruína. Um empurrão a mais me faz cair de um pequeno precipício, aterrissando pesadamente em apenas uma perna e a mutilando completamente.\n\nQuando [sc_victor.GetFirstNameNoTooltip] finalmente desce pela encosta para se juntar a mim, eu quase desmaiei de dor. Não há como lutar neste estado. Meu adversário levanta seu(a) [sc_victor.Custom('signature_weapon')]: pelo menos meu sofrimento terminará rapidamente."
 single_combat.0031.desc.sc_attacker.rough_terrain_expert.injury.boggy:0 "É moleza para [sc_victor.GetFirstNameNoTooltip] me desarmar depois disso, me deixando totalmente à mercê dela."
 single_combat.0031.desc.sc_attacker.rough_terrain_expert.injury.rocky:0 "Infelizmente, um [sc_victor.Custom('SignatureWeaponAttemptedLight')] causa minha queda para cima no declive. Gentil, pelos padrões, mas tudo o que [sc_victor.GetFirstNameNoTooltip] precisa para [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] se permitido."
 single_combat.0031.desc.sc_attacker.rough_terrain_expert.rocky:0 "Apesar de meu oponente não estar nem perto de estar acostumado a lutar em um ambiente tão acidentado e rochoso quanto eu, [sc_victor.GetSheHe] mantém sua postura extremamente bem, permitindo que meus empurrões não façam nada além de bagunçar #EMP meu#! equilíbrio.\n\n"
 single_combat.0031.desc.sc_attacker.something_to_hide.injury:0 "cospindo pedaços de sangue de um lábio completamente partido.\n\nO próximo golpe me atinge no estômago, me derrubando pesadamente no chão. Sem fôlego, eu ofego e vomito, sentindo minha [sc_loser.Custom('signature_weapon')] saindo das minhas mãos no último momento."
 single_combat.0031.desc.sc_attacker.something_to_hide:0 "Estou apenas um pouco mais da metade do meu sutil comentário sobre as dívidas do meu oponente quando a [sc_victor.Custom('SignatureWeaponEndType')] da arma [sc_victor.Custom('signature_weapon')] [sc_victor.GetHerHim] atinge em cheio minha mandíbula. Dou passos para trás,"
 single_combat.0031.desc.sc_attacker.special_fallback.fatality:0 "Com acesso desimpedido às minhas costas, é fácil para [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] com um frenesi de [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')].\n\nEu caio no [sc_defender.Custom('GroundType')], pousando de lado, tossindo e ofegando através de ossos quebrados e órgãos rasgados. Tanta dor. Tanta dor. Desvanecendo para o frio, desvanecendo para a insensibilidade, desvanecendo..."
 single_combat.0031.desc.sc_attacker.special_fallback.injury:0 "[sc_victor.GetFirstNameNoTooltip] aproveita facilmente, deixando-me voar para a frente antes de chutar minha perna restante. Eu caio emaranhado, e um par de chutes maliciosos depois me mantêm assim."
 single_combat.0031.desc.sc_attacker.special_fallback:0 "Com toda a fúria que posso reunir, desferi um chute ardente na canela do meu oponente, apenas para sentir meu equilíbrio se desfazer completamente quando eu #EMP completamente#! erro, enviando meu corpo se lançando atrás do pé errante.\n\n"
 single_combat.0031.desc.sc_attacker.stoic_veteran.fatality:0 "São necessários mais do que alguns repostos bem-sucedidos antes de finalmente fraquejar, com sangue escorrendo de meia dúzia de feridas rasgadas e cortes por todo o meu torso. Se nada mais, ninguém pode dizer que eu desisti facilmente, mas cada [sc_loser.GetWomanMan] tem seus limites.\n\nEu caio de joelhos, pronto para o golpe mortal [Select_CString( sc_victor.IsFemale, 'da', 'do' )] [sc_victor.GetFirstNameNoTooltip]. Parece que atingi o meu."
 single_combat.0031.desc.sc_attacker.stoic_veteran.injury:0 "Dou o meu melhor, mas era apenas questão de tempo antes que algo desse errado, e [sc_victor.GetFirstNameNoTooltip] eventualmente consegue fazer um contragolpe que tira a [sc_loser.Custom('signature_weapon')] das minhas mãos.\n\nCom isso, o combate está decidido."
 single_combat.0031.desc.sc_attacker.stoic_veteran:0 "Na Guarda, principalmente protegíamos o Imperador contra assassinos, mas a maioria dos assassinos foge ao ver um Varangiano fortemente armado. Para seu crédito, meu imponente visual parece não incomodá-lo, e meu comportamento estoico é correspondido com paradas determinadas após paradas determinadas.\n\n"
 single_combat.0031.desc.sc_attacker.strict_guard.fatality:0 "No final, isso pouco importa. A minha garganta destroçada é testemunho suficiente de que aconteceu, e o como é irrelevante.\n\nEu vacilo, a vida se esvai. Em um momento estou aqui, no próximo..."
 single_combat.0031.desc.sc_attacker.strict_guard.injury:0 "Tudo o que realmente importa é que, após apenas alguns golpes de [sc_victor.Custom('signature_weapon')], a arma [Select_CString( sc_victor.IsFemale, 'da', 'do' )] [sc_victor.GetFirstNameNoTooltip] repousa friamente contra minha garganta, a [sc_victor.Custom('SignatureWeaponTipAdjective')] [sc_victor.Custom('SignatureWeaponTipType')] pressionando contra minha jugular.\n\nEnquanto contemplo minhas opções, [sc_victor.GetFirstNameNoTooltip] fica impaciente e treme."
 single_combat.0031.desc.sc_attacker.strict_guard:0 "Há poucos que argumentariam que minha guarda é algo menos do que quase impossível de quebrar, mas de alguma forma meu oponente consegue, talvez pela habilidade, talvez pela sorte.\n\n"
 single_combat.0031.desc.sc_attacker.surprise_attack.fatality:0 "Tento recuperar um pouco de controle, mas seu próximo golpe consegue arrancar a [sc_loser.Custom('signature_weapon')] da minha mão. Por um instante, tudo é pânico, e então o duelo é decidido.\n\nA [sc_victor.Custom('signature_weapon')] [Select_CString( sc_victor.IsFemale, 'da', 'do' )] [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponWoundVerb2ThirdPersonPresent')] profundamente no meu ombro, cortando a clavícula e arrancando algo vital. A dormência é imediata: o pânico, a dor, tudo simplesmente... deixa de ser um fator."
 single_combat.0031.desc.sc_attacker.surprise_attack.injury:0 "Antes de eu conseguir girar minha [sc_loser.Custom('signature_weapon')] para me defender contra a retaliação inevitável, sou atingido por um inesperado joelho no estômago. Dobrando de dor, só ganho um cotovelo adicional na parte de trás da cabeça, e caio, quase cego de dor, no chão."
 single_combat.0031.desc.sc_attacker.surprise_attack:0 "Embora tenha velado minhas ações da melhor forma possível, meu oponente vê através do meu ataque surpresa, me defendendo inesperadamente e me colocando na defensiva.\n\n"
 single_combat.0031.desc.sc_attacker.taunt.fatality:0 "me atinge.\n\nEu apenas sinto a dor ricocheteando pelo meu corpo, mil terminações nervosas gritando de agonia enquanto eu cambaleio e morro."
 single_combat.0031.desc.sc_attacker.taunt.injury:0 "me acertam em cheio, e caio com um pesado #EMP estrondo#!.\n\nDe bruços no [sc_defender.Custom('GroundType')], mal consigo murmurar uma ou duas frases."
 single_combat.0031.desc.sc_attacker.taunt:0 "Eu recuo, pronto para insultar meu oponente até não poder mais, mas me permito ser momentaneamente distraído.\n\nEu nem mesmo vejo o [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]"
 single_combat.0031.desc.sc_attacker.technique_from_legend.fatality:0 "Longe de ser uma vitória instantânea, eu me vejo catapultado para o chão de frente. Mal tenho tempo de me contorcer antes que [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponKillTypeRearTorsoThirdPersonActive')].\n\nA adrenalina anula muita da dor, mas não toda, e eu grito quando sou chutado para as costas para o golpe de morte inevitável."
 single_combat.0031.desc.sc_attacker.technique_from_legend.injury:0 "Longe de ser um golpe mestre que encerra a luta, eu me vejo fazendo uma pose dramática e perdendo completamente o controle da minha [sc_loser.Custom('signature_weapon')]! A arma descreve uma trajetória elegante em direção à distância.\n\nDivertido, mas um pouco confuso, [sc_victor.GetFirstNameNoTooltip] simplesmente balança sua própria [sc_victor.Custom('signature_weapon')] vagamente na minha direção."
 single_combat.0031.desc.sc_attacker.technique_from_legend:0 "Muitas vezes me perguntei se a palavra escrita de [Select_CString( sc_loser.IsFemale, 'uma', 'um' )] [sc_loser.GetLadyLord] ou a espada afiada é mais poderosa. Pelo menos para o meu oponente, parece ser o seu(a) [sc_victor.Custom('signature_weapon')], já que [sc_victor.GetSheHe] faz pouco caso da minha imitação lendária.\n\n"
 single_combat.0031.desc.sc_attacker.tire_opponent.fatality:0 "me jogam totalmente desequilibrado.\n\nTrombando e tropeçando, um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] sólido me lança direto para o [sc_defender.Custom('GroundType')]. Mesmo com uma arma quebrada, consigo afastar o próximo golpe [Select_CString( sc_victor.IsFemale, 'da', 'do' )] [sc_victor.GetFirstNameNoTooltip], mas o seguinte [sc_victor.Custom('SignatureWeaponKillTypeHead2ThirdPersonActive')].\n\nMeus gritos horrendos não duram muito, já que a dor reivindica minha consciência antes que a morte o faça."
 single_combat.0031.desc.sc_attacker.tire_opponent.injury:0 "me desequilibram com tanta força que eu simplesmente caio.\n\n[sc_victor.GetFirstNameNoTooltip] não dá trégua e em breve fica de pé sobre mim, pronto para [sc_victor.Custom('SignatureWeaponKillTypeGroinFirstPersonFuture')]."
 single_combat.0031.desc.sc_attacker.tire_opponent:0 "Jogando pelo tempo, recuo para longe do meu oponente, tentando desviar dos golpes [sc_victor.GetHerHim] até que [sc_victor.GetSheHe] se canse. Uma estratégia perigosa mesmo nos melhores momentos, me vejo pego por vários [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] que"
 single_combat.0031.desc.sc_attacker.unsure_attack.fatality:0 "avança inesperadamente para cima de mim.\n\nUm [sc_victor.Custom('SignatureWeaponAttemptedLight')] de lado atinge um ponto fraco no meu peito, [sc_victor.Custom('SignatureWeaponKillTypeTorso2PresentParticiple')] diagonalmente. Sinto uma dor incapacitante e uma dormência avassaladora ao mesmo tempo em que meu corpo começa instantaneamente a falhar devido a meia dúzia de órgãos fatalmente danificados.\n\nA única coisa que me mantém estável é a [sc_victor.Custom('signature_weapon')] alojada na minha cavidade torácica."
 single_combat.0031.desc.sc_attacker.unsure_attack.injury:0 "avanço com um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] que me desequilibra completamente.\n\nAntes que eu possa me reerguer, um chute de seguimento me envia de cabeça para o chão, e olho para cima com [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')] pronto para descer em meu pescoço."
 single_combat.0031.desc.sc_attacker.unsure_attack:0 "Com mais esperança do que habilidade, tento um [sc_loser.Custom('SignatureWeaponAttemptedLight')] hesitante que não me leva a lugar nenhum. Meu oponente tem pouco problema em se esquivar do meu golpe, apenas para"
 single_combat.0031.desc.sc_attacker.wait_and_hope.fatality:0 "[sc_victor.Custom('SignatureWeaponWoundVerb1ThirdPersonPresent')] diretamente na minha garganta. Observo horrorizado por um ou dois segundos enquanto o sangue da minha vida esguicha em jatos molhados, antes de diminuir para um pulso fraco que rapidamente molha meu peito.\n\nEu caio de joelhos. O mundo está tão escuro. Sempre foi tão escuro assim?\n\nTão entorpecido."
 single_combat.0031.desc.sc_attacker.wait_and_hope.injury:0 "me joga no [sc_defender.Custom('GroundType')]. Eu me recomponho, mas quando recupero o equilíbrio, há uma [sc_victor.Custom('SignatureWeaponTipAdjective')] [sc_victor.Custom('signature_weapon')]-[sc_victor.Custom('SignatureWeaponTipType')] pressionando fortemente contra minha garganta.\n\nMais uma vez, eu travo."
 single_combat.0031.desc.sc_attacker.wait_and_hope:0 "Esperar que meu oponente faça [sc_victor.GetHerselfHimself] acabou sendo uma má ideia.\n\nCongelado na indecisão, sou presa fácil para um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] que"
 single_combat.0031.desc.sc_attacker.wrath_of_highgod.fatality:0 "me acerta na [sc_loser.Custom('MaskFace')] com o [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponEndType')].\n\nEu recuo, rosno de raiva cega pela blasfêmia, mas minha raiva também é interrompida quando [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponWoundVerb5ThirdPersonPresent')] sua arma no meu pulmão. Eu engasgo, sufocando, mal conseguindo fazer um som enquanto o sangue começa a encher minha cavidade torácica."
 single_combat.0031.desc.sc_attacker.wrath_of_highgod.injury:0 "direciona um chute forte em minha virilha, e eu caio como um saco de repolhos.\n\nOfegante de raiva com sua blasfêmia não me ajuda em nada, e antes que eu possa me recuperar, estou [sc_loser.Custom('MaskFace')] a face com a [sc_victor.Custom('SignatureWeaponTipType')] de uma [sc_victor.Custom('signature_weapon')]."
 single_combat.0031.desc.sc_attacker.wrath_of_highgod:0 "Não tenho dúvidas de que [sc_loser.GetFaith.HighGodName] pretende que eu vença este combate, e eu digo isso em minha prece gritada. Infelizmente, meu oponente aproveita minha atenção dividida para"
 single_combat.0031.desc.sc_defender.attempt_disarm:0 "Minha tentativa de desarmar quase faz com que #EMP minha#! [sc_loser.Custom('signature_weapon')] voe."
 single_combat.0031.desc.sc_defender.blade_dance:0 "Minhas tentativas de floreio se mostram equivocadas, com meu oponente contra-atacando cada uma delas."
 single_combat.0031.desc.sc_defender.butchery:0 "Posso ser um carniceiro habilidoso, mas isso não me ajuda aqui."
 single_combat.0031.desc.sc_defender.confident_attack:0 "Meu oponente é capaz de bloquear meus golpes com firmeza."
 single_combat.0031.desc.sc_defender.desert_warrior:0 "Mesmo suado como está, meu oponente parece incansável."
 single_combat.0031.desc.sc_defender.enthusiastic_onslaught:0 "Minha selvagem [sc_loser.Custom('SignatureWeaponFlourishPresentParticiple')] é inútil, apenas me cansando."
 single_combat.0031.desc.sc_defender.expert_onslaught:0 "Mesmo os meus melhores [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] parecem não ter efeito."
 single_combat.0031.desc.sc_defender.feint_and_stab:0 "Meu oponente percebe meu blefe, tornando o ataque com a punhalada inútil."
 single_combat.0031.desc.sc_defender.forest_fighter:0 " Nem todos lutam bem em uma floresta, mas meu oponente mantém o ritmo, golpe por golpe."
 single_combat.0031.desc.sc_defender.guard:0 "Meu oponente força seu caminho através da minha guarda."
 single_combat.0031.desc.sc_defender.hail_mary:0 "Meu ataque desesperado de tudo ou nada não leva a lugar algum."
 single_combat.0031.desc.sc_defender.hard_grit:0 "Por toda a minha experiência, meu oponente impede cada um dos meus golpes."
 single_combat.0031.desc.sc_defender.hurt_me_better:0 "A dor frequentemente foi minha aliada, mas hoje, ela me abandona."
 single_combat.0031.desc.sc_defender.is_that_a_crocodile:0 "O crocodilo para no meio de sua carga, reconsiderando seu ataque."
 single_combat.0031.desc.sc_defender.jungle_stalker:0 "A selva normalmente é difícil de lutar, mas meu oponente continua."
 single_combat.0031.desc.sc_defender.like_a_viper:0 "Eu avanço em direção ao que pensei ser uma brecha, apenas para me encontrar atacando o ar vazio."
 single_combat.0031.desc.sc_defender.martial_voice:0 "Minha tentativa de intimidar meu oponente afunda imediatamente."
 single_combat.0031.desc.sc_defender.mocking_boast:0 "Meus fanfarrões caem em ouvidos moucos, meu oponente ignorando completamente minha provocação."
 single_combat.0031.desc.sc_defender.nut_em:0 "Minha cabeçada abortada apenas dá ao meu oponente uma grande abertura."
 single_combat.0031.desc.sc_defender.onslaught:0 "Meus [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] não fazem muita coisa."
 single_combat.0031.desc.sc_defender.open_terrain_expert:0 "Mesmo com todo o espaço que eu poderia pedir, meu oponente se mostra incansável."
 single_combat.0031.desc.sc_defender.pocket_sand:0 "Meu oponente esquiva facilmente do meu arremesso de [sc_defender.Custom('GritType')]."
 single_combat.0031.desc.sc_defender.pocket_silver:0 "Meu oponente esquiva facilmente da minha bolsa lançada, sem se impressionar."
 single_combat.0031.desc.sc_defender.probing_attack:0 "Meu oponente bate de lado nos meus golpes cronometrados."
 single_combat.0031.desc.sc_defender.put_the_boot_in:0 "Meu [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] inicial conecta, mas meu chute me desequilibra."
 single_combat.0031.desc.sc_defender.raaargh:0 "Uma pausa em meu acesso de fúria me deixa quase catatônico; meu oponente está ileso, mas eu me sinto esgotado."
 single_combat.0031.desc.sc_defender.reason_you_suck_speech:0 "Meu oponente range os dentes e ignora meu discurso."
 single_combat.0031.desc.sc_defender.rough_terrain_expert:0 "Apesar do local desagradável, meu oponente acompanha o ritmo dos meus ataques."
 single_combat.0031.desc.sc_defender.something_to_hide:0 "Meu oponente ou não ouve ou não se importa com minhas ameaças implícitas."
 single_combat.0031.desc.sc_defender.special_fallback:0 "Meu oponente não tem problemas em se esquivar do meu chute."
 single_combat.0031.desc.sc_defender.stoic_veteran:0 "O que quer que eu tenha aprendido em Miklagarðr, não foi suficiente, meu oponente me defendendo repetidamente."
 single_combat.0031.desc.sc_defender.strict_guard:0 "Apesar dos meus melhores esforços, meu oponente quebra minha guarda."
 single_combat.0031.desc.sc_defender.surprise_attack:0 "Meu oponente enxerga através do meu ataque surpresa."
 single_combat.0031.desc.sc_defender.taunt:0 "Meu deboche cai em ouvidos moucos."
 single_combat.0031.desc.sc_defender.technique_from_legend:0 "Na realidade, as façanhas da lenda são difíceis, e eu falho em fazer muita coisa."
 single_combat.0031.desc.sc_defender.tire_opponent:0 "Minha tentativa de atrair meu oponente falha, já que [sc_victor.GetSheHe] ignora minhas esquivas teatrais."
 single_combat.0031.desc.sc_defender.unsure_attack:0 "Meus ataques fracos não fazem absolutamente nada."
 single_combat.0031.desc.sc_defender.wait_and_hope:0 "Esperar meu oponente agir primeiro não me ajuda em nada, simplesmente entregando a vantagem a [sc_victor.GetSheHe]."
 single_combat.0031.desc.sc_defender.wrath_of_highgod:0 "Minha oração gritada apenas fornece oportunidades ao meu oponente."
 single_combat.0031.t:0 "$single_combat.0000.t$ Derrota!"
 single_combat.0041.a:0 "Adeus, [sc_loser.GetTitledFirstNameNoTooltip]."
 single_combat.0041.b:0 "Eu sou o vencedor!"
 single_combat.0041.desc.opponent_response.attempt_disarm.fatality:0 "a [sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent')].\n\nCom sua arma inútil, [sc_loser.GetFirstNameNoTooltip] é facilmente [sc_victor.Custom('SignatureWeaponKillTypePastTense')]."
 single_combat.0041.desc.opponent_response.attempt_disarm.injury:0 "basta um pequeno movimento meu para enviar a [sc_loser.Custom('signature_weapon')] [sc_loser.GetHerHim] voando como uma flecha absurdamente grande.\n\nA rendição envergonhada vem assim que [sc_loser.GetFirstNameNoTooltip] processa o que acabou de acontecer."
 single_combat.0041.desc.opponent_response.attempt_disarm:0 "[sc_loser.GetFirstNameNoTooltip] salta em minha direção, um único e poderoso [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] quase arrancando a [sc_victor.Custom('signature_weapon')] da minha mão, mas eu resisto e me inclino para dentro do golpe.\n\nEvidentemente, peguei a arma [sc_loser.GetHerHim] em um ângulo errado, porquê"
 single_combat.0041.desc.opponent_response.blade_dance.fatality:0 "enquanto já estou no meu movimento de retorno.\n\nA indignação se espalha pelos traços [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip], presumivelmente por minha impudência, mas não tenho interesse em deixar isso ir mais longe.\n\nMinha [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponWoundVerb1ThirdPersonPresent')] fatalmente no peito do mestre das lâminas."
 single_combat.0041.desc.opponent_response.blade_dance.injury:0 "sua arma arqueando longe do alcance.\n\nMestre da [sc_loser.Custom('signature_weapon')] ou não, o pânico ainda se espalha pelas características [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] quando [sc_loser.GetSheHe] percebe que [sc_loser.GetSheHe] não tem arma. \n\nDando um pouco de tempo para meu oponente processar o que acabou de acontecer, eu simplesmente poso de forma presunçosa com minha [sc_victor.Custom('signature_weapon')]. A rendição resultante é gaguejada em pura incredulidade."
 single_combat.0041.desc.opponent_response.blade_dance:0 "[sc_loser.GetFirstNameNoTooltip] pode ser renomado por sua habilidade com [sc_loser.Custom('SignatureWeaponArticle')] [sc_loser.Custom('signature_weapon')], mas [sc_loser.GetSheHe] claramente está um pouco impressionado demais com sua própria destreza.\n\nUm oportunista-[sc_victor.Custom('SignatureWeaponAttemptedLight')] para a mão de seu(a) [sc_loser.Custom('signature_weapon')], e sua postura é despedaçada,"
 single_combat.0041.desc.opponent_response.butchery.fatality:0 "Cautelosamente, atento a uma armadilha, eu me posiciono em uma abertura óbvia na guarda [sc_loser.GetHerHim] e ataco com um [sc_victor.Custom('SignatureWeaponAttemptedLight')] que cruelmente [sc_victor.Custom2('SignatureWeaponKillTypeHead2ThirdPersonActiveGendered',SCOPE.sC('sc_loser'))].\n\n[sc_loser.GetFirstNameNoTooltip] começa imediatamente a engasgar com a fonte de sangue resultante, largando seu(a) [sc_loser.Custom('signature_weapon')] para segurar o ferimento.\n\n[sc_loser.GetSheHe|U] ainda está segurando quando [sc_loser.GetSheHe] expira, um minuto inteiro depois."
 single_combat.0041.desc.opponent_response.butchery.injury:0 "No meio de um [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] particularmente chamativo, eu passo facilmente pela guarda [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] e arranco a [sc_loser.Custom('signature_weapon')] da mão [sc_loser.GetHerHim] com um [sc_victor.Custom('SignatureWeaponAttemptedLight')].\n\n[sc_loser.GetSheHe|U] tenta desesperadamente manter uma aura intimidante, mas é inútil quando eu ainda tenho minha [sc_victor.Custom('signature_weapon')].\n\nQuando [sc_loser.GetSheHe] se rende, não tenho vergonha de admitir que é #EMP incrivelmente#! satisfatório."
 single_combat.0041.desc.opponent_response.butchery:0 "Apesar da temível reputação [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip], seus [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] ferozes parecem... desajeitados, falta uma palavra melhor. São facilmente aparados, e embora cada golpe doa como [sc_victor.GetFaith.NegativeAfterLife], ter uma arma em mãos torna o temido saqueador muito mais gerenciável.\n\n"
 single_combat.0041.desc.opponent_response.confident_attack.fatality:0 "consigo um golpe sólido no abdômen [sc_loser.GetHerHim].\n\nO golpe rasga a pele, a gordura e o músculo, derramando intestinos em cordas no [sc_defender.Custom('GroundType')] ensanguentado, e [sc_loser.GetFirstNameNoTooltip] escorrega e tropeça para trás com um grito.\n\nEu dou um passo à frente, [sc_victor.Custom('signature_weapon')] erguida para encerrar o sofrimento do meu inimigo."
 single_combat.0041.desc.opponent_response.confident_attack.injury:0 "consigo parar com força o suficiente para empurrar a própria arma [sc_loser.GetHerHim] diretamente de volta para [sc_loser.GetSheHe].\n\nPara evitar a [sc_loser.Custom('signature_weapon')] de sua própria [sc_loser.GetFirstNameNoTooltip], [sc_loser.GetFirstNameNoTooltip] tem que colocar [sc_loser.GetHerselfHimself] no caminho da minha própria [sc_victor.Custom('signature_weapon')]. Não é exatamente um golpe mortal, mas derruba [sc_loser.GetSheHe] mesmo assim.\n\nCom a arma [sc_loser.GetHerHim] perdida na queda, [sc_loser.GetFirstNameNoTooltip] não tem escolha senão se render."
 single_combat.0041.desc.opponent_response.confident_attack:0 "[sc_loser.GetFirstNameNoTooltip] é um habilidoso portador de [sc_loser.Custom('signature_weapon')], mas todo guerreiro precisa correr riscos para vencer, e é no meio de um [sc_loser.Custom('SignatureWeaponAttemptedLight')] particularmente arriscado que eu"
 single_combat.0041.desc.opponent_response.desert_warrior.fatality:0 "Me lanço em um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] que derruba [sc_loser.GetSheHe] diretamente ao chão. O golpe seguinte [sc_victor.Custom('SignatureWeaponWoundVerb5ThirdPersonPresent')] em seu pescoço, de forma desorganizada.\n\nLonge de ser uma morte agradável ou digna, mas pelo menos é rápida."
 single_combat.0041.desc.opponent_response.desert_warrior.injury:0 "Eu desferi uma saraivada de [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')], surpreendendo tanto meu oponente que [sc_loser.GetSheHe] cai de cara na [sc_defender.Custom('GroundType')].\n\nCravando minha [sc_victor.Custom('signature_weapon')] no pescoço [sc_loser.GetHerHim], eu rapidamente obtenho uma rendição abafada."
 single_combat.0041.desc.opponent_response.desert_warrior:0 "Este calor, este calor #EMP drenante#!, #EMP exaurindo#!! Está me matando lentamente, mas eu persevero apenas com força de vontade pura. [sc_loser.GetFirstNameNoTooltip] parece quase não afetado, mas fica cada vez mais surpreso com minha tenacidade.\n\nQuando a guarda [sc_loser.GetHerHim] afrouxa um pouco,"
 single_combat.0041.desc.opponent_response.enthusiastic_onslaught.fatality:0 "Encontro a carga com um [sc_victor.Custom('SignatureWeaponAttemptedLight')] bem calculado que atinge meu oponente no peito, [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))], antes de se soltar em um spray de fragmentos de ossos e tiras de carne ensanguentada.\n\n[sc_loser.GetFirstNameNoTooltip] gira, mais por causa do ímpeto do que qualquer outra coisa, girando em direção a um amontoado emaranhado. O choque ainda está se misturando com a dor nas espasmos desesperados [sc_loser.GetHerHim], cada movimento rápido meio tentando encontrar alguma saída, enquanto o coração [sc_loser.GetHerHim] bate pela última vez."
 single_combat.0041.desc.opponent_response.enthusiastic_onslaught.injury:0 "Escolhendo o momento certo, eu consigo dar um golpe afiado na têmpora [sc_loser.GetHerHim] com o [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponEndType')], e [sc_loser.GetSheHe] cai como uma ovelha atingida na cabeça.\n\nEu levo um ou dois segundos para observar a cena lamentável do [sc_loser.GetWomanMan] gemendo no [sc_defender.Custom('GroundType')] diante de mim e, em seguida, me preparo para o golpe mortal.\n\n[sc_loser.GetFirstNameNoTooltip] solta um gemido de rendição com segundos de sobra."
 single_combat.0041.desc.opponent_response.enthusiastic_onslaught:0 "[sc_loser.GetFirstNameNoTooltip] voa em minha direção, gritando incoerentemente e [sc_loser.Custom('SignatureWeaponFlourishPresentParticiple')] seu(a) [sc_loser.Custom('signature_weapon')] com todo o entusiasmo de um amador desesperado.\n\n"
 single_combat.0041.desc.opponent_response.expert_onslaught.fatality:0 "Consigo realizar uma defesa surpreendentemente firme. O bloqueio desvia seu(a) [sc_loser.Custom('signature_weapon')] de volta para seu(a) [sc_loser.Custom('MaskFace')], [sc_loser.Custom('SignatureWeaponWoundVerb6PresentParticiple')] até o osso.\n\nNão perco tempo, varrendo os pés [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] com uma perna enganchada e avançando diretamente para [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))], [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonPresentParticipleGendered_Aftermath',SCOPE.sC('sc_loser'))].\n\nOs gritos do [sc_loser.GetWomanMan] demoram um pouco demais para desaparecer."
 single_combat.0041.desc.opponent_response.expert_onslaught.injury:0 "Consigo acertar um golpe desesperado na têmpora [sc_loser.GetHerHim] com a [sc_victor.Custom('SignatureWeaponEndType')] da minha [sc_victor.Custom('signature_weapon')].\n\n[sc_loser.GetFirstNameNoTooltip] recua, atordoado, me dando uma sólida abertura para afastar o(a) seu(a) [sc_loser.Custom('signature_weapon')] com um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\nSem arma, meu oponente está à minha mercê, e [sc_loser.GetSheHe] sabe disso. Uma rendição amarga é minha em questão de momentos."
 single_combat.0041.desc.opponent_response.expert_onslaught:0 "[sc_loser.GetFirstNameNoTooltip] luta como um [sc_loser.GetWomanMan] possuído, desferindo uma tempestade interminável de [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] que me forçam para trás, para trás e para trás.\n\nSó não é até [sc_loser.GetHerHe] tirar um segundo para se regozijar em sua iminente vitória que"
 single_combat.0041.desc.opponent_response.feint_and_stab.fatality:0 "\n\nAntes que [sc_loser.GetFirstNameNoTooltip] possa empunhar sua arma secundária, eu balanço minha própria [sc_victor.Custom('signature_weapon')] em direção a [sc_victor.Custom2('SignatureWeaponKillTypeTorso2ThirdPersonSimplePresentGendered',SCOPE.sC('sc_loser'))]. O corpo machucado [sc_loser.GetHerHim|U] é arremessado para trás, espasmando e sangrando no [sc_defender.Custom('GroundType')].\n\nDentro de um minuto, todo movimento cessa."
 single_combat.0041.desc.opponent_response.feint_and_stab.injury:0 "Pensando rapidamente, eu golpeio com a [sc_victor.Custom('signature_weapon')] no seu outro braço na minha retaguarda durante o meu movimento de recuo, fazendo a lâmina escondida voar para longe.\n\nSem querer arriscar mais trapaças, eu parto para [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]. [sc_loser.GetFirstNameNoTooltip] apenas evita uma morte desagradável com uma das rendições mais rápidas que já vi."
 single_combat.0041.desc.opponent_response.feint_and_stab:0 "[sc_loser.GetFirstNameNoTooltip] arremessa um [sc_loser.Custom('SignatureWeaponAttemptedLight')] em minha direção com seu(a) [sc_loser.Custom('signature_weapon')], mas parece mal direcionado.\n\nNão leva muito esforço para derrubar a arma da mão do meu oponente, e só então percebo o brilho de uma adaga na mão oposta [sc_loser.GetHerHim]."
 single_combat.0041.desc.opponent_response.forest_fighter.fatality:0 "\n\nAvanço em direção a [sc_loser.GetHerHim] com uma saraivada de [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')]. A princípio, parece que meu oponente me defende bem, até que [sc_loser.GetSheHe] começa a desacelerar, sangue jorrando de... algum lugar. Devo ter acertado uma artéria.\n\nDentro de um minuto, [sc_loser.GetFirstNameNoTooltip] desmaia. Eu acabo rapidamente com [sc_loser.GetSheHe]."
 single_combat.0041.desc.opponent_response.forest_fighter.injury:0 "Dedicando segundos cruciais extras para mirar, eu desferi um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] que quase deixa meu oponente atordoado.\n\nCaído, é fácil chutar seu(a) [sc_loser.Custom('signature_weapon')] para dentro da vegetação. A compreensão começa a voltar à [my_foe.Custom('EyeEyes')] [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] logo depois de eu pressionar a [sc_victor.Custom('SignatureWeaponTipAdjective')] [sc_victor.Custom('SignatureWeaponTipType')] da minha arma contra a jugular [sc_loser.GetHerHim], e a rendição chega rapidamente."
 single_combat.0041.desc.opponent_response.forest_fighter:0 "Apesar [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] ser supostamente um hábil lutador de bosques[sc_loser.GetWomanMan], nem todas as florestas oferecem muita vantagem.\n\nA clareira atual em que estamos parece ser bastante idílica, e procurar alguma maneira de aproveitar a experiência [sc_loser.GetHerHim] obviamente é uma grande distração para [sc_loser.GetFirstNameNoTooltip]."
 single_combat.0041.desc.opponent_response.guard.fatality:0 "desfere um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] que rasga a coxa interna [sc_loser.GetHerHim], rompendo uma artéria.\n\nMovido pela adrenalina, [sc_loser.GetFirstNameNoTooltip] luta por vinte a trinta segundos antes de a perda de sangue começar a se estabelecer.\n\n[sc_loser.GetSheHe|U] não percebe o que aconteceu inicialmente e olha para baixo para encontrar [sc_loser.GetHerselfHimself] cada vez mais ensopado em seu próprio gore. A incredulidade dá lugar ao sono, e meu oponente cai sem cerimônia no chão. Eliminar [sc_loser.GetSheHe] é rápido e indolor."
 single_combat.0041.desc.opponent_response.guard.injury:0 "abro um buraco bem grande na guarda [sc_loser.GetHerHim].\n\nA partir daí, é apenas uma pequena sequência de [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] antes de eu conseguir derrubar a [sc_loser.Custom('signature_weapon')] da mão [sc_loser.GetHerHim].\n\nMe preparo para um golpe fatal, mas [sc_loser.GetFirstNameNoTooltip] se rende antes que seja necessário."
 single_combat.0041.desc.opponent_response.guard:0 "[sc_loser.GetFirstNameNoTooltip] mantém uma guarda decente, mas não impenetrável. Leva tempo, mas eventualmente consigo"
 single_combat.0041.desc.opponent_response.hail_mary.fatality:0 "Não arrisco, girando para fora do caminho do primeiro golpe e rodopiando minha [sc_victor.Custom('signature_weapon')] para [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] com um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\nA paralisia é imediata, meu oponente tombando no [sc_defender.Custom('GroundType')] enquanto suas pernas perdem a função. Chuto [sc_loser.GetSheHe] para o lado, dando ao [sc_loser.GetWomanMan] um último aceno de reconhecimento antes de [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))]."
 single_combat.0041.desc.opponent_response.hail_mary.injury:0 "desespero e ineptidão são companheiros de cama desajeitados. A maioria dos golpes [sc_loser.GetHerHim|U] erram, e os que não erram são facilmente aparados ou desviados da minha [sc_victor.Custom('signature_weapon')], fazendo com que [sc_loser.GetFirstNameNoTooltip] perca rapidamente o equilíbrio.\n\nQuando [sc_loser.GetSheHe] acidentalmente se atinge no [sc_loser.Custom('MaskFace')] com a própria mão trôpega, tenho pena e tiro a arma da mão [sc_loser.GetHerHim].\n\nA rendição vem rapidamente."
 single_combat.0041.desc.opponent_response.hail_mary:0 "[sc_loser.GetFirstNameNoTooltip] se lança em um ataque tudo ou nada, [sc_loser.Custom('signature_weapon')] empunhada, pronta para vencer ou morrer com uma barragem de [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')].\n\nInfelizmente para [sc_loser.GetSheHe],"
 single_combat.0041.desc.opponent_response.hard_grit.fatality:0 "finjo um [sc_victor.Custom('SignatureWeaponAttemptedLight')] que se aloja em seu estômago.\n\nUma morte dolorosa, [sc_loser.GetFirstNameNoTooltip] a aceita com dignidade, lutando contra a dor até o fim."
 single_combat.0041.desc.opponent_response.hard_grit.injury:0 "pressiono o ataque.\n\nÉ uma batalha árdua e exaustiva de vontades e detalhes menores, mas eventualmente consigo derrubar o [sc_loser.Custom('ShieldPersonFemaleMale')] ao chão e desarmar [sc_loser.GetSheHe] no mesmo movimento.\n\nA rendição é relutante, mas respeitosa."
 single_combat.0041.desc.opponent_response.hard_grit:0 "[sc_loser.GetFirstNameNoTooltip] luta bem, não dando quartel e não tolerando erros. Cada brecha é explorada, cada fraqueza cobra um preço em dor e esforço.\n\nSomente jogando de forma conservadora, igualando [sc_loser.GetSheHe] golpe por golpe e nada mais, posso acompanhar, esperando até que #EMP [sc_loser.GetSheHe]#! cometa um erro antes de eu"
 single_combat.0041.desc.opponent_response.hurt_me_better.fatality:0 "e acredito que ambos sabemos que [sc_loser.GetSheHe] não pode representar uma grande ameaça nem me impedir de retaliar.\n\nUm único golpe firme e eu [sc_victor.Custom2('SignatureWeaponKillTypeHeadThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]."
 single_combat.0041.desc.opponent_response.hurt_me_better.injury:0 "e quase sinto uma onda de piedade ao tirar a [sc_loser.Custom('signature_weapon')] da mão [sc_loser.GetHerHim].\n\nLeva um bom tempo para focar [sc_loser.GetFirstNameNoTooltip] o suficiente para uma rendição formal, mas conseguimos."
 single_combat.0041.desc.opponent_response.hurt_me_better:0 "Apenas [sc_victor.GetFaith.HealthGodName] sabe exatamente que expressão [sc_loser.GetFirstNameNoTooltip] está fazendo agora. Medo? Dor? Luxúria? Confusão? Provavelmente nunca saberei.\n\nSeja o que for, isso se transforma em uma série de [sc_loser.Custom('SignatureWeaponAttemptedLightPlural')] bem inofensivas,"
 single_combat.0041.desc.opponent_response.is_that_a_crocodile.fatality:0 "\n\nMeu [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] atravessa diretamente a guarda [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] e atinge seu peito superior. Entre força, acaso e a concentração quebrada do meu oponente, o golpe é #EMP devastador#!, lançando sangue e ossos para todos os lados.\n\n[sc_loser.GetFirstNameNoTooltip] cai para trás, convulsionando, tremendo, uma ruína de um [sc_loser.GetWomanMan]. Leva muito tempo antes de [sc_loser.GetSheHe] realmente morrer."
 single_combat.0041.desc.opponent_response.is_that_a_crocodile:0 "Sem aviso, [sc_loser.GetFirstNameNoTooltip] começa a recuar rapidamente, parecendo que [sc_loser.GetSheHe] viu um fantasma. Suspeitando de um ardil, eu pressiono a oportunidade sem ser dissuadido."
 single_combat.0041.desc.opponent_response.jungle_stalker.fatality:0 "A distração é tudo o que preciso para lançar um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] diretamente no estômago desprotegido [sc_loser.GetHerHim], fazendo [sc_loser.GetSheHe] gritar ao cair no chão.\n\nA luta que se segue é breve, mas sangrenta. Pelo menos, para [sc_loser.GetFirstNameNoTooltip]."
 single_combat.0041.desc.opponent_response.jungle_stalker.injury:0 "Aproveitando a oportunidade, eu faço a [sc_loser.Custom('signature_weapon')] do meu adversário voar para a mata com um arriscado [sc_victor.Custom('SignatureWeaponAttemptedLight')], depois me posiciono para [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))].\n\n[sc_loser.GetFirstNameNoTooltip] se rende imediatamente."
 single_combat.0041.desc.opponent_response.jungle_stalker:0 "Apesar de a selva ser um caos para lutar, [sc_loser.GetFirstNameNoTooltip] faz parecer #EMP fácil#!. Pelo menos, até [sc_loser.GetSheHe] ficar com o pé preso em uma videira.\n\n"
 single_combat.0041.desc.opponent_response.like_a_viper.fatality:0 "Rápido como um relâmpago, varro meu [sc_victor.Custom('signature_weapon')] para trás e diretamente em direção a [sc_loser.GetFirstNameNoTooltip]. A arma [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonActiveGendered',SCOPE.sC('sc_loser'))] de uma vez, jogando [sc_loser.GetSheHe] para longe em direção ao [sc_defender.Custom('GroundType')].\n\nMeu oponente luta no começo, tentando se levantar, se mover, resistir. [sc_loser.GetSheHe|U] não consegue ir além de rolar para as costas antes que a perda de sangue o domine."
 single_combat.0041.desc.opponent_response.like_a_viper.injury:0 "Agindo por instinto, eu me inclino no golpe com toda a minha força, apenas #EMP por pouco#! conseguindo redirecionar o golpe para passar por cima do meu ombro e seguir com um rápido joelho no estômago.\n\n[sc_loser.GetFirstNameNoTooltip] desaba. Meu fôlego sai em ofegantes e irregulares golfadas, o cérebro ainda processando meu encontro literal com a morte, mas ainda consigo pressionar minha [sc_victor.Custom('signature_weapon')] contra a garganta [sc_loser.GetHerHim] antes que [sc_loser.GetSheHe] possa se recuperar.\n\nEsta luta é minha."
 single_combat.0041.desc.opponent_response.like_a_viper:0 "Movendo-se tão rápido que mal registro o plano [sc_loser.GetHerHim], [sc_loser.GetFirstNameNoTooltip] se lança #EMP por dentro#! da minha guarda, [sc_loser.Custom('signature_weapon')] voando direto para o meu coração. Tenho apenas um momento para reagir antes de uma morte certa.\n\n"
 single_combat.0041.desc.opponent_response.martial_voice.fatality:0 "Então, simplesmente dou um passo à frente e [sc_victor.Custom('SignatureWeaponWoundVerb4')] a garganta [sc_loser.GetHerHim] com um golpe da minha [sc_victor.Custom('signature_weapon')].\n\n[sc_loser.GetFirstNameNoTooltip] parece... confuso. Assustado. Com raiva. É difícil expressar uma emoção quando seu pescoço é um arruinado ensanguentado.\n\nApenas observo [sc_loser.GetSheHe] enquanto ele lentamente se sufoca com seu próprio sangue."
 single_combat.0041.desc.opponent_response.martial_voice.injury:0 "Então, e somente então, eu avanço com um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] que derruba [sc_loser.GetSheHe] diretamente de bruços.\n\nEmbora atordoado, [sc_loser.GetFirstNameNoTooltip] parece disposto a continuar lutando a princípio. Quando fica claro que estou prestes a [sc_victor.Custom2('SignatureWeaponKillTypeHeadThirdPersonFutureGendered',SCOPE.sC('sc_loser'))], no entanto, [sc_loser.GetSheHe] se rende."
 single_combat.0041.desc.opponent_response.martial_voice:0 "[sc_loser.GetFirstNameNoTooltip], seja por raiva ou arrogância, se lança sobre mim, me recriminando como se eu fosse um camponês sujo. Minha paciência começa a se esgotar, mas me seguro até [sc_loser.GetSheHe] pausar para respirar fundo.\n\n"
 single_combat.0041.desc.opponent_response.mocking_boast.fatality:0 "Fingo, faço [sc_loser.GetSheHe] girar suas costas para mim, então [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonFutureGendered',SCOPE.sC('sc_loser'))].\n\nMeu inimigo desaba instantaneamente, e o choque leva [sc_loser.GetSheHe] pouco tempo depois disso."
 single_combat.0041.desc.opponent_response.mocking_boast.injury:0 "ataco com um [sc_victor.Custom('SignatureWeaponAttemptedLight')] direto no peito [sc_loser.GetHerHim].\n\nCom o vento expulso do corpo [sc_loser.GetHerHim], [sc_loser.GetFirstNameNoTooltip] não consegue oferecer muita resistência quando eu afasto seu(a) [sc_loser.Custom('signature_weapon')] com meu próximo golpe.\n\nA rendição resultante é igualmente humilhante e amarga."
 single_combat.0041.desc.opponent_response.mocking_boast:0 "[sc_loser.GetFirstNameNoTooltip] mantém sua distância, recuando de cada um dos meus golpes. Em vez disso, [sc_loser.GetSheHe] faz comentário sarcástico após comentário sarcástico sobre minha fama mundial até que minha paciência se esgote completamente.\n\n\"Sabe qual é uma boa maneira de ganhar uma reputação?\" eu pergunto, sem obter resposta. \"Matando alguém famoso\".\n\nO choque momentâneo [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] é tudo o que eu preciso para"
 single_combat.0041.desc.opponent_response.nut_em.fatality:0 "Audacioso, mas [sc_victor.GetFaith.WarGodName] recompensa a cautela. Levanto minha [sc_victor.Custom('signature_weapon')] para um [sc_victor.Custom('SignatureWeaponAttemptedLight')] que [sc_victor.Custom2('SignatureWeaponKillTypeHead2ThirdPersonActiveGendered',SCOPE.sC('sc_loser'))].\n\nA subsequente #EMP explosão#! de gore é acompanhada por um grito meio estridente, meio borbulhante [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip], que continua cambaleando para a frente.\n\nEnquanto seu(a) [sc_loser.Custom('signature_weapon')] ainda está em sua mão, não posso arriscar um golpe de misericórdia. Em vez disso, [sc_loser.GetFirstNameNoTooltip] e eu simplesmente nos encaramos até que a maré de sangue derramado apague a luz do(s) [my_foe.Custom('EyeEyes')] [sc_loser.GetHerHim]."
 single_combat.0041.desc.opponent_response.nut_em.injury:0 "Sem pensar duas vezes, eu enfio meu joelho na barriga [sc_loser.GetHerHim], e o idiota desaba.\n\nPara seu crédito, [sc_loser.GetFirstNameNoTooltip] cai tão bem quanto poderia ser esperado e já está se esforçando para seus pés no momento em que giro após [sc_loser.GetSheHe].\n\nAlguns chutes violentos e meu [sc_victor.Custom('signature_weapon')] pressionando as costas [sc_loser.GetHerHim] convencem [sc_loser.GetSheHe] a ficar parado e se render, no entanto."
 single_combat.0041.desc.opponent_response.nut_em:0 "Desafiadoramente, [sc_loser.GetFirstNameNoTooltip] se lança contra mim, [sc_loser.Custom('signature_weapon')] pendurada frouxamente, claramente tentando me dar uma forte cabeçada.\n\n"
 single_combat.0041.desc.opponent_response.onslaught.fatality:0 "reflexivamente seguindo com um [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] na parte de trás do joelho [sc_loser.GetHerHim] que derruba [sc_loser.GetSheHe].\n\nA habilidade nos pés me mantém atrás do meu oponente enquanto [sc_loser.GetSheHe] cambaleia para os pés, e com um golpe bem colocado, eu [sc_victor.Custom2('SignatureWeaponKillTypeRearHeadThirdPersonPresentGendered',SCOPE.sC('sc_loser'))].\n\n[sc_loser.GetFirstNameNoTooltip] morre instantaneamente."
 single_combat.0041.desc.opponent_response.onslaught.injury:0 "deixando a arma do meu adversário, a [sc_loser.Custom('signature_weapon')], cortando o ar sem resistência. Eu dou um chute na parte de trás do joelho [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] e empurro, socando [sc_loser.GetSheHe] direto na mandíbula quando [sc_loser.GetSheHe] gira de forma descuidada para me encarar.\n\nCom [sc_loser.GetFirstNameNoTooltip] cambaleando, tudo o que é necessário é um [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] para lançar a arma [sc_loser.GetHerHim] voando. Eu dou generosamente alguns segundos para que o [sc_loser.GetWomanMan] se recomponha antes de [sc_loser.GetSheHe] se render."
 single_combat.0041.desc.opponent_response.onslaught:0 "[sc_loser.GetFirstNameNoTooltip] parte pesadamente para o ataque, despejando [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] sobre mim, tornando um pesadelo aparar cada um.\n\nApenas ao dar um passo de lado, afortunadamente no meio do piscar de olhos, eu escapo da chuva de golpes,"
 single_combat.0041.desc.opponent_response.open_terrain_expert.fatality:0 "Quando [sc_loser.GetSheHe] tropeça, [sc_loser.GetSheHe] tropeça com força, e estou em cima [sc_loser.GetHerHim] instantaneamente.\n\nUm chute rápido na virilha mantém [sc_loser.GetFirstNameNoTooltip] no chão tempo suficiente para eu [sc_victor.Custom2('SignatureWeaponKillTypeTorso2ThirdPersonSimplePresentGendered',SCOPE.sC('sc_loser'))] com minha [sc_victor.Custom('signature_weapon')].\n\n[sc_loser.GetSheHe|U] luta por um tempo, mas eventualmente se deita e permite que a morte leve [sc_loser.GetSheHe]."
 single_combat.0041.desc.opponent_response.open_terrain_expert.injury:0 "[sc_loser.GetSheHe|U] não suspeita de nada e tropeça exatamente como eu esperava.\n\nUm [sc_victor.Custom('SignatureWeaponAttemptedLight')] cuidadosamente colocado transforma o tropeção em uma queda completa, com seu(a) [sc_loser.Custom('signature_weapon')] voando enquanto [sc_loser.GetSheHe] cai.\n\nMeu pé no pescoço [sc_loser.GetHerHim] transforma a queda em uma rendição."
 single_combat.0041.desc.opponent_response.open_terrain_expert:0 "[sc_loser.GetFirstNameNoTooltip] luta melhor em campo aberto, e [sc_loser.GetSheHe] sabe disso, recuando sempre que lhe convém. Isso torna a luta frustrante, até eu avistar uma grande pedra afiada próxima, com #EMP cerca#! de uma altura da canela.\n\nPacientemente, eu empurro meu inimigo em direção ao pequeno perigo, contando com o reposicionamento arrogante [sc_loser.GetHerHim]."
 single_combat.0041.desc.opponent_response.pocket_sand.fatality:0 "Não perco a oportunidade, e martelo minha [sc_victor.Custom('signature_weapon')] no peito [sc_loser.GetHerHim], [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))], em um único movimento rápido.\n\nMeu oponente recua, jatos de sangue espirrando erraticamente de seu torso destroçado.\n\nArranco minha arma do corpo [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] para um golpe de misericórdia: [sc_loser.GetSheHe] já está morto, não há necessidade de prolongar o sofrimento."
 single_combat.0041.desc.opponent_response.pocket_sand.injury:0 "[sc_loser.GetSheHe|U] está ocupado demais tossindo para notar ou evitar o [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponEndType')] enquanto eu o enfio em sua garganta, e ele cai imediatamente no [sc_defender.Custom('GroundType')].\n\nDeixo minha arma descansando suavemente em cima do estômago [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip], esperando pacientemente que [sc_loser.GetSheHe] perceba e se renda. Não demora muito."
 single_combat.0041.desc.opponent_response.pocket_sand:0 "[sc_loser.GetFirstNameNoTooltip] se abaixa para pegar um punhado de [sc_defender.Custom('GritType')] do chão, mas, quando [sc_loser.GetSheHe] tenta jogá-lo em mim, uma rajada de vento o faz voltar diretamente para o [sc_loser.Custom('MaskFace')] [sc_loser.GetHerHim].\n\n"
 single_combat.0041.desc.opponent_response.pocket_silver.fatality:0 "Ajo rapidamente, empurrando [sc_loser.GetSheHe] para o chão.\n\nAntes que [sc_loser.GetSheHe] possa se recuperar, me preparo para a brutalidade e começo a [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))].\n\nOs gritos cessam muito antes [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] morrer."
 single_combat.0041.desc.opponent_response.pocket_silver.injury:0 "Eu me lanço diretamente no ataque, desferindo um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] que arranca a [sc_loser.Custom('signature_weapon')] da mão [sc_loser.GetHerHim].\n\n[sc_loser.GetFirstNameNoTooltip] fica atordoado. Com delicadeza, [sc_loser.GetSheHe] cospe uma única moeda de prata e se submete a uma rendição."
 single_combat.0041.desc.opponent_response.pocket_silver:0 "[sc_loser.GetFirstNameNoTooltip] arranca algo de sua cintura e joga em mim. Antes mesmo de processar o que é, eu o aniquilo reflexivamente com um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], causando uma verdadeira chuva de moedas de prata pesadas sobre meu inimigo.\n\nCom meu oponente momentaneamente cegado,"
 single_combat.0041.desc.opponent_response.probing_attack.fatality:0 "[sc_loser.Custom('SignatureWeaponBreaksVerbPastTense')] da [sc_loser.Custom('signature_weapon')] [sc_loser.GetHerHim].\n\nA partir daí, é apenas um turbilhão de [sc_loser.Custom('SignatureWeaponAttemptedLightPlural')] até que eu seja capaz de [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))].\n\nNão é uma morte rápida."
 single_combat.0041.desc.opponent_response.probing_attack.injury:0 "arranco a [sc_loser.Custom('signature_weapon')] da mão [sc_loser.GetHerHim]. A arma navega lindamente pelo ar, deixando apenas eu, [sc_loser.GetFirstNameNoTooltip], e #EMP a minha#! [sc_victor.Custom('signature_weapon')].\n\nA rendição vem assim que eu mexo o meu braço."
 single_combat.0041.desc.opponent_response.probing_attack:0 "[sc_loser.GetFirstNameNoTooltip] tenta me manter à distância com [sc_loser.Custom('SignatureWeaponAttemptedLightPlural')] cuidadosos. Inteligente por um tempo, mas tolo a longo prazo, já que isso me dá controle sobre o ritmo do nosso combate.\n\nEventualmente, sou capaz de parar um deles com força o suficiente para"
 single_combat.0041.desc.opponent_response.put_the_boot_in.fallback:0 "[sc_loser.GetFirstNameNoTooltip] me atinge com um [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] furioso, seguindo o golpe bem-sucedido ao tentar me chutar. Eu me esquivo para o lado, acertando suas costas com um [sc_victor.Custom('SignatureWeaponAttemptedLight')] enquanto [sc_loser.GetSheHe] passa, e meu oponente cai no chão.\n\n"
 single_combat.0041.desc.opponent_response.put_the_boot_in.fatality:0 "Mantendo a ofensiva, eu [sc_victor.Custom2('SignatureWeaponKillTypeTorso2ThirdPersonSimplePresentGendered',SCOPE.sC('sc_loser'))] com um golpe firme de minha [sc_victor.Custom('signature_weapon')].\n\n[sc_loser.GetFirstNameNoTooltip] vomita imediatamente um jato espesso de sangue e ácido gástrico, sufocando e cuspindo sua última respiração enquanto a mistura chove sobre [sc_loser.GetSheHe], escorrendo de volta para sua boca e narinas. Não demora muito antes de a sufocação parar."
 single_combat.0041.desc.opponent_response.put_the_boot_in.injury:0 "\n\nO [sc_loser.GetWomanMan] tenta se levantar, mas um golpe rápido da minha [sc_victor.Custom('signature_weapon')] o mantém no chão. Eu solto um riso audível para deixar [sc_loser.GetSheHe] saber que o tempo dele acabou, e recebo uma rendição abafada por meus problemas."
 single_combat.0041.desc.opponent_response.put_the_boot_in.peg_leg:0 "[sc_loser.GetFirstNameNoTooltip] me atinge com um [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] furioso, seguindo o golpe bem-sucedido ao tentar me chutar com sua perna de pau.\n\nSem pensar, eu trago meu [sc_victor.Custom('signature_weapon')]'s [sc_victor.Custom('SignatureWeaponEndType')] tão forte que a perna de pau se solta e meu oponente cai no chão."
 single_combat.0041.desc.opponent_response.raaargh.fatality:0 "Mantenho minha distância, avançando apenas quando [sc_loser.GetFirstNameNoTooltip] se lança para esculpir pedaços de carne, e dançamos assim por um tempo.\n\nEventualmente, porém, a fúria [sc_loser.GetHerHim] diminui, e o [sc_loser.GetWomanMan], não o berserker, vacila na minha frente, o número e a gravidade das feridas [sc_loser.GetHerHim] se abatendo sobre [sc_loser.GetSheHe] uma por uma até..."
 single_combat.0041.desc.opponent_response.raaargh.injury:0 "Apesar de toda a fúria [sc_loser.GetHerHim], [sc_loser.GetSheHe] na verdade não é #EMP tão#! difícil de se esquivar: um excesso de raiva também cria um déficit de finesse, e recuar é uma opção em um duelo que simplesmente não é em um tumulto furioso.\n\nQuando [sc_loser.GetFirstNameNoTooltip] emerge de sua transe, é quase um anti-clímax. Em algum lugar de sua raiva, [sc_loser.GetSheHe] parece ter [sc_loser.Custom('SignatureWeaponBreaksVerbPastTense2')] de seu(a) [sc_loser.Custom('SignatureWeaponTipType')]. A rendição é entregue entre os dentes cerrados."
 single_combat.0041.desc.opponent_response.raaargh:0 "[sc_loser.GetFirstNameNoTooltip] treme, pausando no local por alguns segundos tensos, antes de #EMP explodir#! de raiva.\n\nTodo medo pela segurança [sc_loser.GetHerHim] desaparece, o berserker se lança em minha direção, um turbilhão de [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] incontrolados, socos, chutes e dentes rangendo.\n\n"
 single_combat.0041.desc.opponent_response.reason_you_suck_speech.fatality:0 "Avançando, lanço um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] que [sc_victor.Custom2('SignatureWeaponKillTypeHead2ThirdPersonActiveGendered',SCOPE.sC('sc_loser'))].\n\n[sc_loser.GetFirstNameNoTooltip] é arremessado para trás, sangue jorrando de sua garganta destroçada. Por um momento, parece que [sc_loser.GetSheHe] pode se recuperar [sc_loser.GetHerselfHimself], talvez até continuar lutando de alguma forma.\n\nEntão [sc_loser.GetSheHe] se desmorona."
 single_combat.0041.desc.opponent_response.reason_you_suck_speech.injury:0 "Dando um passo à frente, eu bato no pescoço [sc_loser.GetHerHim] com a [sc_victor.Custom('SignatureWeaponEndType')] da minha arma. [sc_loser.GetFirstNameNoTooltip] imediatamente começa a sufocar, tentando forçar o ar através de uma traqueia que acabei de bloquear manualmente.\n\nDepois disso, é fácil desferir um golpe que obviamente [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] e forçar uma rendição."
 single_combat.0041.desc.opponent_response.reason_you_suck_speech:0 "Todo mundo sabe que [sc_loser.GetFirstNameNoTooltip] é um orador, e está claro a partir de sua postura que [sc_loser.GetSheHe] está prestes a aproveitar essa oportunidade para lançar uma palestra. Bem, é hora de mostrar a [sc_loser.GetSheHe] o quão bem uma língua afiada se sai contra uma [sc_victor.Custom('signature_weapon')] de aço.\n\n"
 single_combat.0041.desc.opponent_response.rough_terrain_expert.boggy:0 "Em áreas pantanosas, [sc_loser.GetFirstNameNoTooltip] luta como se fosse [sc_victor.GetFaith.DevilName] [sc_victor.GetFaith.DevilHerselfHimself], e me leva repetidamente para as águas fétidas da região. Felizmente para mim, nenhum poço se mostra especialmente profundo.\n\nÉ quase irônico, então, que o primeiro passo [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] na água do pântano engula sua perna até o joelho.\n\n"
 single_combat.0041.desc.opponent_response.rough_terrain_expert.fatality.boggy:0 "Eu circulo, procurando um bom local para atacar. [sc_loser.GetFirstNameNoTooltip] consegue se soltar, apenas para mergulhar de cara em outra poça mais profunda, e eu percebo o momento certo: um golpe rápido na [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonFutureGendered',SCOPE.sC('sc_loser'))].\n\nA paralisia é instantânea, [sc_loser.GetFirstNameNoTooltip] afundando ainda mais no pântano fétido. Leva um bom tempo antes que as bolhas parem."
 single_combat.0041.desc.opponent_response.rough_terrain_expert.fatality.rocky:0 "mas eu permaneço de pé.\n\nQuando [sc_loser.GetFirstNameNoTooltip] não nota uma pequena escarpa atrás [sc_loser.GetHerHim], tento um contra-impulso, e o lutador veterano de colinas tomba duramente para trás.\n\nOuço um estalo e um grito quando [sc_loser.GetSheHe] cai pela borda e, correndo atrás, encontro [sc_loser.GetSheHe] meio empalado em seu próprio fêmur quebrado. A morte misericordiosa não demora muito."
 single_combat.0041.desc.opponent_response.rough_terrain_expert.injury.boggy:0 "Felizmente, tanto a distração quanto a situação tornam a desarmar [sc_loser.GetSheHe] quase que com um toque cômico, especialmente em contraste com o tumulto anterior.\n\nUma rendição raramente teve um sabor tão doce."
 single_combat.0041.desc.opponent_response.rough_terrain_expert.injury.rocky:0 "mas eu consigo manter meu lugar com dificuldade.\n\nQuando surge a oportunidade para um contra-golpe, eu a aproveito, empurrando [sc_loser.GetFirstNameNoTooltip] morro acima com um [sc_victor.Custom('SignatureWeaponAttemptedLight')].\n\nNão é muito, em termos de quedas, mas [sc_loser.GetSheHe] está vulnerável o suficiente para que eu possa [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] facilmente.\n\nEu obtenho minha rendição."
 single_combat.0041.desc.opponent_response.rough_terrain_expert.rocky:0 "[sc_loser.GetFirstNameNoTooltip] é um veterano em lutas em declives, habilidoso em batalhar em montanhas e colinas, e [sc_loser.GetSheHe] faz questão de demonstrar isso. Vez após outra, tenho que me preparar contra um empurrão firme projetado para me fazer rolar,\n\n"
 single_combat.0041.desc.opponent_response.something_to_hide.injury:0 "desabando atordoado no chão, vomitando o tempo todo.\n\nChuto a [sc_loser.Custom('signature_weapon')] da mão [sc_loser.GetHerHim], e [sc_loser.GetSheHe] solta uma rendição #EMP imediatamente#!."
 single_combat.0041.desc.opponent_response.something_to_hide:0 "[sc_loser.GetFirstNameNoTooltip] está no meio de uma tentativa pateticamente arqueada de me desestabilizar, completa com voz assustadora e ameaças floridas, quando eu perco a paciência e acerto [sc_loser.GetSheHe] no queixo com o [sc_victor.Custom('signature_weapon')] no final do [sc_victor.Custom('SignatureWeaponEndType')].\n\n[sc_loser.GetSheHe|U] vacila imediatamente,"
 single_combat.0041.desc.opponent_response.special_fallback.fatality:0 "Com um tiro completamente claro nas costas [sc_loser.GetHerHim], solto uma chuva de [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] em [sc_loser.GetFirstNameNoTooltip], batendo [sc_loser.GetSheHe] no chão.\n\n[sc_loser.GetSheHe|U] cai com força de lado, tossindo gobbets de sangue por um tempo até [sc_loser.GetSheHe] expelir um suspiro de morte exausto."
 single_combat.0041.desc.opponent_response.special_fallback.injury:0 "Vendo um bom momento para encerrar o combate, eu coloco o pé na pilha resultante, chutando furiosamente até ouvir uma rendição sufocada."
 single_combat.0041.desc.opponent_response.special_fallback:0 "Do nada, [sc_loser.GetFirstNameNoTooltip] voa para a frente, mirando um chute cruel exatamente onde minha canela #EMP estava#! um momento atrás. Surpreendido pela minha mudança inesperada, meu adversário passa por mim, completamente desequilibrado.\n\n"
 single_combat.0041.desc.opponent_response.stoic_veteran.fatality:0 "Entramos em um padrão tenso de ataque-parada-riposta, comigo gradualmente ganhando a vantagem, desgastando [sc_loser.GetFirstNameNoTooltip] golpe após golpe, até que [sc_loser.GetSheHe] acumule ferimentos e vergões suficientes para matar a maioria dos [sc_loser.GetWomenMen] duas vezes.\n\nAté mesmo [sc_loser.GetSheHe] tem limites, no entanto. E, à medida que o Varangiano cai de joelhos, pronto para o golpe mortal, fica claro que ambos sabemos disso."
 single_combat.0041.desc.opponent_response.stoic_veteran.injury:0 "Nossa luta se transforma em uma competição de resistência, cada um desejando que o outro ceda primeiro. Felizmente para mim, [sc_loser.GetFirstNameNoTooltip] escorrega antes de mim, abrindo [sc_loser.GetHerselfHimself] para um contra-ataque que faz seu(a) [sc_loser.Custom('signature_weapon')] escorregar para longe.\n\nEstóico mesmo na derrota, seus músculos relaxam e [sc_loser.GetSheHe] se rende imediatamente."
 single_combat.0041.desc.opponent_response.stoic_veteran:0 "[sc_loser.GetFirstNameNoTooltip] usa seu(a) [sc_loser.Custom('signature_weapon')] com toda a competência típica de um Varangiano, desferindo golpes longos e uniformes de sua arma em minha direção. É difícil, mas nada que eu não possa aparar bem o suficiente.\n\n"
 single_combat.0041.desc.opponent_response.strict_guard.fatality:0 "enganar um [sc_victor.Custom('SignatureWeaponAttemptedLight')] entre a parede de defesas.\n\nUm único golpe acaba sendo tudo o que é necessário, minha [sc_victor.Custom('signature_weapon')] [sc_victor.Custom2('SignatureWeaponKillTypeHead2ThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))].\n\n[sc_loser.GetFirstNameNoTooltip] parece tão incapaz de processar o sangue jorrando da jugular rasgada [sc_loser.GetHerHim] que [sc_loser.GetSheHe] realmente ainda se defende reflexivamente do meu próximo golpe.\n\nEu tenho apenas tempo suficiente para ficar surpreso com a pura tenacidade antes que a luz se apague do(s) seu(s) [my_foe.Custom('EyeEyes')] para sempre."
 single_combat.0041.desc.opponent_response.strict_guard.injury:0 "rompo com um [sc_victor.Custom('SignatureWeaponAttemptedLight')], pressionando a [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponTipType')] contra a garganta [sc_loser.GetHerHim].\n\nNós dois ficamos congelados por tempo demais enquanto [sc_loser.GetFirstNameNoTooltip] avalia suas opções. É preciso um olhar selvagem e um repentino espasmo para forçar uma rendição do teimoso [sc_loser.GetWomanMan]."
 single_combat.0041.desc.opponent_response.strict_guard:0 "Seja lá o que [sc_loser.GetFirstNameNoTooltip] seja, [sc_loser.GetSheHe] é malditamente bom em manter sua guarda. É mais sorte do que habilidade quando finalmente consigo"
 single_combat.0041.desc.opponent_response.surprise_attack.fatality:0 "\n\nMinha riposta arranca a [sc_loser.Custom('signature_weapon')] da mão [sc_loser.GetHerHim], e [sc_loser.GetFirstNameNoTooltip] congela em pânico.\n\nIsso sela o destino do [sc_loser.GetWomanMan], enquanto eu [sc_victor.Custom('SignatureWeaponWoundVerb5')] minha [sc_loser.Custom('signature_weapon')] em seu ombro. Algo vital se rasga, e [sc_loser.GetFirstNameNoTooltip] fica mole instantaneamente.\n\n[sc_loser.GetSheHe|U] está morto antes de [sc_loser.GetSheHe] atingir o [sc_defender.Custom('GroundType')]."
 single_combat.0041.desc.opponent_response.surprise_attack.injury:0 "Em vez de seguir com um contra-ataque, eu enfio meu joelho na barriga [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip], dobrando [sc_loser.GetSheHe] enquanto o ar é expulso dos pulmões [sc_loser.GetHerHim].\n\nIsso me apresenta a parte de trás da cabeça do meu adversário, e eu junto meu golpe no estômago com um cotovelo brutal na parte de trás da cabeça.\n\n[sc_loser.GetFirstNameNoTooltip] desaba no [sc_defender.Custom('GroundType')]. Estou quase surpreso por [sc_loser.GetSheHe] ser capaz de soltar uma rendição sem vomitar."
 single_combat.0041.desc.opponent_response.surprise_attack:0 "[sc_loser.GetFirstNameNoTooltip] tenta mudar o arco do seu próximo golpe no meio do ataque, claramente esperando me pegar de surpresa, mas consigo fazer uma defesa sólida que faz [sc_loser.GetSheHe] cambalear."
 single_combat.0041.desc.opponent_response.taunt.fatality:0 "O golpe o atinge no torso, mais forte do que eu esperava, e sou banhado por uma chuva de vísceras e costelas quebradas.\n\n[sc_loser.GetFirstNameNoTooltip] nunca chega a zombar. [sc_loser.GetSheHe|U] apenas muda seu peso e dá alguns passos até cair morto."
 single_combat.0041.desc.opponent_response.taunt.injury:0 "É tão eficaz quanto precisa ser, deixando meu oponente atordoado no chão.\n\nUma rendição um pouco grogue segue logo depois."
 single_combat.0041.desc.opponent_response.taunt:0 "[sc_loser.GetFirstNameNoTooltip] recua, o começo de um sorriso cruel sem dúvida prestes a começar a se formar em seu rosto. Qualquer provocaçãozinha que [sc_loser.GetSheHe] tenha a dizer, eu não quero ouvir, e eu avanço com um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] quase por reflexo.\n\n"
 single_combat.0041.desc.opponent_response.technique_from_legend.fatality:0 "\n\nNão tenho certeza #EMP por que#! [sc_loser.GetSheHe] está de pé assim, mas recompenso a estranheza com uma rápida derrubada seguida pelo meu [sc_victor.Custom('signature_weapon')] [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))].\n\nNão há mestria ou armadilha oculta aqui, então suponho que a postura estranha era apenas... estranha.\n\nCom um encolher de ombros, eu chuto [sc_loser.GetFirstNameNoTooltip] para trás para o golpe final."
 single_combat.0041.desc.opponent_response.technique_from_legend.injury:0 "Por um momento, fico confuso, sem ter certeza do que está acontecendo, até ouvir um barulho atrás de mim e entender.\n\n[sc_loser.GetFirstNameNoTooltip] mudou de postura de forma tão dramática e tão #EMP desajeitada#! que [sc_loser.GetSheHe] realmente #EMP perdeu#! seu(a) [sc_loser.Custom('signature_weapon')] no processo.\n\nMal consigo conter minha risada estridente, eu simplesmente balanço minha própria arma um pouco para induzir uma rendição."
 single_combat.0041.desc.opponent_response.technique_from_legend:0 "[sc_loser.GetFirstNameNoTooltip] faz uma pose dramaticamente desajeitada."
 single_combat.0041.desc.opponent_response.tire_opponent.fatality:0 "Assim que [sc_loser.GetFirstNameNoTooltip] parece instável, libero um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] que derruba [sc_loser.GetSheHe] completamente.\n\nPara o crédito [sc_loser.GetHerHim], [sc_loser.GetSheHe] defende o próximo golpe. O seguinte [sc_victor.Custom2('SignatureWeaponKillTypeHead2ThirdPersonActiveGendered',SCOPE.sC('sc_loser'))]: o grito estrangulado dá lugar à calma rapidamente."
 single_combat.0041.desc.opponent_response.tire_opponent.injury:0 "Desequilibrado, [sc_loser.GetFirstNameNoTooltip] tropeça e gira desajeitadamente até cair no [sc_defender.Custom('GroundType')].\n\nMantendo-me sobre meu oponente, eu desfiro uma série de [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] [sc_victor.Custom('signature_weapon')].\n\nMeu oponente permanece firme a princípio, apenas cedendo quando fica claro que estou prestes a [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]."
 single_combat.0041.desc.opponent_response.tire_opponent:0 "[sc_loser.GetFirstNameNoTooltip] finge avançar repetidamente, aparentemente me dando oportunidades para atacar, apenas para se esquivar. Sentindo a oportunidade, pressiono mais e com mais força a cada [sc_victor.Custom('SignatureWeaponAttemptedLight')], eventualmente pegando [sc_loser.GetSheHe] várias vezes.\n\n"
 single_combat.0041.desc.opponent_response.unsure_attack.fatality:0 "Como [sc_loser.GetSheHe] ainda parece estar tentando entender as coisas, arrisco um rápido golpe. A [sc_victor.Custom('SignatureWeaponAttemptedLight')] atinge um ponto fraco no peito [sc_loser.GetHerHim], [sc_victor.Custom2('SignatureWeaponKillTypeTorso2ThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))] em um ângulo e penetra profundamente na cavidade torácica do [sc_loser.GetWomanMan].\n\n[sc_loser.GetFirstNameNoTooltip] congela imediatamente, todo movimento perdido na agonia deve estar consumindo [sc_loser.GetSheHe].\n\nQuando finalmente retiro minha [sc_victor.Custom('signature_weapon')], [sc_loser.GetSheHe] se foi, e o corpo [sc_loser.GetHerHim] cai desajeitadamente no [sc_defender.Custom('GroundType')]."
 single_combat.0041.desc.opponent_response.unsure_attack.injury:0 "Apostando na timidez [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip], eu avanço com um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] que desequilibra totalmente [sc_loser.GetSheHe]. Sem parar para respirar, eu chuto [sc_loser.GetSheHe], com força, no joelho, e [sc_loser.GetFirstNameNoTooltip] cai com um pesado #EMP estrondo#!\n\nIsso me dá tempo de sobra para me posicionar para um assassinato horrendo. [sc_loser.GetSheHe|U] se rende em questão de segundos."
 single_combat.0041.desc.opponent_response.unsure_attack:0 "[sc_loser.GetFirstNameNoTooltip] tenta alguns [sc_loser.Custom('SignatureWeaponAttemptedLightPlural')] perfunctórios, mas nada que eu não possa facilmente esquivar.\n\n"
 single_combat.0041.desc.opponent_response.wait_and_hope.fatality:0 "O golpe atinge meu oponente na garganta, rasgando um ferimento sangrento e roxo em sua traqueia. Sangue carmesim começa a jorrar do ferimento, [sc_loser.GetFirstNameNoTooltip] inclina o rosto para baixo para assistir horrorizado enquanto a vida [sc_loser.GetHerHim] se esvai de seu pescoço e desce pelo peito.\n\n[sc_loser.GetFirstNameNoTooltip] desaba de joelhos. Não demora muito para que [sc_loser.GetSheHe] fique imóvel."
 single_combat.0041.desc.opponent_response.wait_and_hope.injury:0 "Nenhum bloqueio me encontra, nenhum esquiva me escapa, e eu tenho que recuar no último instante para evitar [sc_victor.Custom2('SignatureWeaponKillTypeHeadThirdPersonPresentGendered',SCOPE.sC('sc_loser'))].\n\nEm vez disso, eu simplesmente encosto minha [sc_victor.Custom('signature_weapon')] nela. Mais uma vez, [sc_loser.GetFirstNameNoTooltip] congela, mas está claro que eu venci."
 single_combat.0041.desc.opponent_response.wait_and_hope:0 "Quando [sc_loser.GetFirstNameNoTooltip] simplesmente congela no lugar, eu quase fico atordoado! Mas, se [sc_loser.GetSheHe] não vai lutar, isso não vai me impedir, e avanço com [sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\n"
 single_combat.0041.desc.opponent_response.wrath_of_highgod.fatality:0 "cravo o [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponEndType')] em seu(a) [sc_loser.Custom('MaskFace')].\n\nGritando de raiva por essa blasfêmia, [sc_loser.GetFirstNameNoTooltip] tropeça para trás, uma maldição repugnante em seus lábios até o momento em que eu [sc_victor.Custom('SignatureWeaponWoundVerb5')] minha arma em seu pulmão.\n\nDepois disso, tudo é soluços, engasgos e, em seguida, silêncio."
 single_combat.0041.desc.opponent_response.wrath_of_highgod.injury:0 "chuto [sc_loser.GetSheHe] diretamente na virilha.\n\nA prece gritada [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] se torna um grito agudo, e [sc_loser.GetSheHe] desaba em um monte de membros se debatendo. O monte resultante de [sc_loser.GetWomanMan] raivosos sibila e grita repreensões pela minha blasfêmia, mas eu simplesmente encosto minha [sc_victor.Custom('signature_weapon')] ao lado do [sc_loser.Custom('MaskFace')] [sc_loser.GetHerHim] e espero que [sc_loser.GetFaith.HighGodName] me castigue.\n\nA justiça divina nunca chega completamente, mas uma rendição furiosa certamente acontece."
 single_combat.0041.desc.opponent_response.wrath_of_highgod:0 "Gritando sua devoção a [sc_loser.GetFaith.HighGodName], [sc_loser.GetFirstNameNoTooltip] deixa sua atenção se desviar completamente da nossa luta.\n\nCom um aceno rápido para reconhecer a absurda arrogância do meu adversário, dou um passo à frente e"
 single_combat.0041.desc.result.mistake:0 "#BOL Resultado:#! Eu venço o [single_combat_fight|E] contra [sc_loser.GetFirstNameNoTooltip] devido à pontuação de sua [single_combat_injury_chance_injury_risk|E]"
 single_combat.0041.desc.result.skill:0 "#BOL Resultado:#! Eu venço o [single_combat_fight|E] contra [sc_loser.GetFirstNameNoTooltip] devido à minha pontuação de [single_combat_success_chance_skill|E]"
 single_combat.0041.desc.result.sudden_death:0 "#BOL Resultado:#! Eu venço o [single_combat_fight|E] contra [sc_loser.GetFirstNameNoTooltip] devido a [single_combat_fight_sudden_death|E]"
 single_combat.0041.desc.sc_attacker.attempt_disarm.fatality:0 "Sem dar quartel, lanço-me em um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] que atravessa limpo a caixa torácica [sc_loser.GetHerHim].\n\nContinuo a atacar [sc_loser.GetFirstNameNoTooltip] enquanto [sc_loser.GetSheHe] cambaleia para o chão, lento e apático, parando apenas quando os únicos movimentos que o cadáver fazem são devido aos meus golpes."
 single_combat.0041.desc.sc_attacker.attempt_disarm.injury:0 "Isso... correu surpreendentemente bem, considerando todas as coisas. [sc_loser.GetFirstNameNoTooltip] e eu simplesmente ficamos encarando um ao outro: [sc_loser.GetSheHe], inseguro se deve correr atrás da arma ou se render, eu, despreparado para uma execução tão perfeita.\n\nFalando nisso, eu acabo com qualquer pensamento que [sc_loser.GetFirstNameNoTooltip] possa ter de continuar lutando com uma sobrancelha erguida e um [sc_victor.Custom('SignatureWeaponAction')] da minha [sc_victor.Custom('signature_weapon')].\n\nA rendição é constrangedora, mas rápida."
 single_combat.0041.desc.sc_attacker.attempt_disarm:0 "Vendo a oportunidade perfeita para desarmar meu oponente, eu desço meu [sc_victor.Custom('signature_weapon')] em um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] que arranca seu(a) [sc_loser.Custom('signature_weapon')] de seu alcance.\n\n"
 single_combat.0041.desc.sc_attacker.blade_dance.fatality:0 "Golpe a golpe, minha sinfonia de dor toma forma sobre todos os nervos [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip], arrancando gritos como um coro pontuado pelo som do aço contra aço.\n\nQuando minha inspiração começa a esgotar, eu encerro minha dança, permitindo que meu adversário caia de joelhos. Sangue jorra [sc_loser.GetHerHim], a ponto [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] mal conseguir reunir energia para me olhar.\n\nEu faço a gentileza de retribuir o olhar [sc_loser.GetHerHim], então preparo minha [sc_victor.Custom('signature_weapon')] para a nota final da sinfonia."
 single_combat.0041.desc.sc_attacker.blade_dance.injury:0 "Há uma arte na verdadeira luta, e eu sou nada se não artístico.\n\nSó quando [sc_loser.GetFirstNameNoTooltip] foi espancado até quase perder os sentidos, eu entrego o golpe final, desarmado [sc_loser.GetSheHe] com um único [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] que faz a [sc_loser.GetWomanMan]'s [sc_loser.Custom('signature_weapon')] voar.\n\nEu me preparo mental e fisicamente para [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))], fazendo uma pausa perfeita no momento em que meu adversário se rende."
 single_combat.0041.desc.sc_attacker.blade_dance:0 "Giro meu [sc_victor.Custom('signature_weapon')] com um floreio mortal, tecendo uma canção de dor em meu oponente a cada golpe."
 single_combat.0041.desc.sc_attacker.butchery.fatality:0 "Pouco a pouco, o espírito [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] se quebra, cada toque de agonia arrancando qualquer senso de destemida bravura que [sc_loser.GetSheHe] poderia ter tentado reter. Eu reduzo [sc_loser.GetSheHe] a uma bagunça trêmula, gritando e jorrando sangue no [sc_defender.Custom('GroundType')].\n\nAté para mim, eventualmente, é o suficiente. Um último [sc_victor.Custom('SignatureWeaponAttemptedLight')] apressa significativamente a morte [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip], mas não #EMP tão#! significativamente."
 single_combat.0041.desc.sc_attacker.butchery.injury:0 "[sc_loser.GetFirstNameNoTooltip] cambaleia e se curva com cada golpe, mas cada ondulação de dor deliciosa que percorre [sc_loser.GetSheHe] só me estimula a lutar mais forte.\n\nQuando [sc_loser.GetSheHe] finalmente cai, [sc_loser.GetSheHe] está ofegante e cuspindo grossas cordas de sangue.\n\nEu me preparo para [sc_victor.Custom2('SignatureWeaponKillTypeRearHeadThirdPersonPresentGendered',SCOPE.sC('sc_loser'))] sem pressa. Fico quase decepcionado ao ouvir uma rendição torturada antes que minha [sc_victor.Custom('signature_weapon')] possa cair."
 single_combat.0041.desc.sc_attacker.butchery:0 "Um sorriso sombrio se forma em meus lábios enquanto eu me lanço em uma série abrasadora de [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')], cada golpe focando mais na dor do que na vitória.\n\n"
 single_combat.0041.desc.sc_attacker.confident_attack.fatality:0 "Quando julgo que é o momento certo, mudo meu padrão com um golpe surpresa que atinge [sc_loser.GetFirstNameNoTooltip] diretamente no ventre.\n\nO golpe lança meu inimigo para trás, algo vermelho e vital escorregando sem vida pelo novo buraco enquanto [sc_loser.GetSheHe] tomba no chão.\n\nAproximo-me com alguma cautela, mas logo fica claro que o choque está se instalando. Levando um momento para chutar seu(a) [sc_loser.Custom('signature_weapon')] para longe apenas por precaução, preparo-me para tirar [sc_loser.GetFirstNameNoTooltip] do sofrimento."
 single_combat.0041.desc.sc_attacker.confident_attack.injury:0 "[sc_loser.GetFirstNameNoTooltip] faz o melhor para me afastar, mas [sc_loser.GetSheHe] está completamente na defensiva, e sua guarda está ficando cada vez mais fraca e desleixada a cada golpe.\n\nQuando a oportunidade se apresenta, eu jogo seu(a) [sc_loser.Custom('signature_weapon')] voando com um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]. E assim, o combate está decidido.\n\nRecebo minha rendição antes mesmo de terminar meu balanço de volta."
 single_combat.0041.desc.sc_attacker.confident_attack:0 "A confiança é metade de qualquer luta, e eu lanço fluidamente [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] com toda a confiança do especialista experiente."
 single_combat.0041.desc.sc_attacker.desert_warrior.fatality:0 "e tudo o que tenho que fazer é derrubar os joelhos [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip].\n\nAssim que [sc_loser.GetSheHe] está no [sc_defender.Custom('GroundType')], acabou. Um [sc_victor.Custom('SignatureWeaponAttemptedLight')] [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonActiveGendered',SCOPE.sC('sc_loser'))].\n\nDepois disso, não há mais nada para [sc_loser.GetFirstNameNoTooltip] fazer além de morrer."
 single_combat.0041.desc.sc_attacker.desert_warrior.injury:0 "deixando [sc_loser.GetFirstNameNoTooltip] vacilando à beira da exaustão.\n\nEu só ataco quando o calor opressivo já derrotou [sc_loser.GetSheHe] quase inteiramente, voando em uma série de [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] que catapultam meu oponente para o [sc_defender.Custom('GroundType')].\n\nQuando [sc_loser.GetFirstNameNoTooltip] finalmente se virou de costas, eu já tinha preparado minha [sc_victor.Custom('signature_weapon')] para [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]. [sc_loser.GetSheHe|U] cospe um bocado de [sc_defender.Custom('GroundType')] e se rende."
 single_combat.0041.desc.sc_attacker.desert_warrior:0 "Eu conheço bem esse jogo e simplesmente danço para longe do meu oponente quando [sc_loser.GetSheHe] se aproxima, mantendo-me perto o suficiente para atacar, mas nunca perto o suficiente para acertar. Não demora até o deserto fazer o meu trabalho por mim,"
 single_combat.0041.desc.sc_attacker.enthusiastic_onslaught.fatality:0 "O entusiasmo pode compensar muitas coisas, e aqui consegue superar completamente a habilidade, arrancando a [sc_loser.Custom('signature_weapon')] da mão [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] apenas com a força bruta.\n\nNão perco tempo em me aproximar do meu oponente desarmado, já protegendo [sc_loser.GetHerselfHimself] com sua(s) [sc_loser.Custom('HandHands')], e, com eficiência implacável, [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))].\n\nOs gritos param muito antes que a maré de gore o faça."
 single_combat.0041.desc.sc_attacker.enthusiastic_onslaught.injury:0 "Previsivelmente, não demora muito até eu forçar [sc_loser.GetFirstNameNoTooltip] a ficar de joelhos, e a partir daí é apenas um balanço preguiçoso e longo para trazer a [sc_victor.Custom('signature_weapon')] até a garganta [sc_loser.GetHerHim].\n\nA rendição chega no momento em que o metal frio toca o pescoço [sc_loser.GetHerHim]."
 single_combat.0041.desc.sc_attacker.enthusiastic_onslaught:0 "Rugindo minha desafio, eu me jogo de corpo e alma em um grupo de [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')], desferindo golpe após golpe em meu oponente.\n\n"
 single_combat.0041.desc.sc_attacker.expert_onslaught.fatality:0 "Sinceramente, é admirável que [sc_loser.GetFirstNameNoTooltip] seja capaz de resistir a tantos golpes de [sc_victor.Custom('signature_weapon')] quanto [sc_loser.GetSheHe] faz, enquanto despejo sobre [sc_loser.GetSheHe] toda a fúria de uma tempestade trovejante.\n\nLeva um minuto ou dois, mas eventualmente eu derroto [sc_loser.GetSheHe] em um monte ensanguentado, retorcido e #EMP gritante#!.\n\nSomente quando estou satisfeito de que não haverá nenhuma chance de vingança no último segundo é que desfero o golpe mortal."
 single_combat.0041.desc.sc_attacker.expert_onslaught.injury:0 "Golpe por golpe, eu espanco meu oponente até uma submissão sangrenta e concussa, martelando [sc_loser.GetSheHe] no chão com toda a fúria que [sc_victor.GetFaith.WarGodName] pode me emprestar.\n\nQuando tudo o que resta é uma pilha trêmula [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetWomanMan] ensanguentad[Select_CString( sc_loser.IsFemale, 'a', 'o' )], eu me pergunto se fui longe demais. Então [sc_loser.GetFirstNameNoTooltip] tosse com força o suficiente para perder o controle de seu(a) [sc_loser.Custom('signature_weapon')], e eu me permito um suspiro de alívio.\n\nCom a preocupação fora de cena, eu chuto a arma do meu inimigo para longe e coloco a minha contra a garganta [sc_loser.GetHerHim]. Leva algumas tentativas, mas [sc_loser.GetFirstNameNoTooltip] consegue dar a rendição eventualmente."
 single_combat.0041.desc.sc_attacker.expert_onslaught:0 "Meu braço com [sc_victor.Custom('signature_weapon')] se move rápido como um raio e golpeia tão forte quanto pedra quebrada."
 single_combat.0041.desc.sc_attacker.feint_and_stab.fatality:0 "navegando pela guarda [sc_loser.GetHerHim] e diretamente em seu peito.\n\n[sc_loser.GetFirstNameNoTooltip] recua, minha adaga da mão livre se soltando enquanto [sc_loser.GetSheHe] faz isso, espalhando sangue e fragmentos de osso por todo o chão.\n\n[sc_loser.GetSheHe|U] sangra rapidamente, embora não exatamente sem dor."
 single_combat.0041.desc.sc_attacker.feint_and_stab.injury:0 "voando com o punho primeiro em direção ao seu(a) [sc_loser.Custom('MaskFace')].\n\nO golpe atinge [sc_loser.GetFirstNameNoTooltip] com #EMP força#!, batendo tão profundamente que eu juro que posso sentir o osso machucado, e [sc_loser.GetSheHe] recua atordoado.\n\nQuando a [sc_loser.Custom('signature_weapon')] cai da mão [sc_loser.GetHerHim], meu oponente balbucia uma rendição sem que eu precise fazer nada."
 single_combat.0041.desc.sc_attacker.feint_and_stab:0 "Giro meu [sc_victor.Custom('signature_weapon')] em uma finta quase preguiçosa. Meu oponente não vê minha adaga da mão secundária até ser tarde demais, quando já está"
 single_combat.0041.desc.sc_attacker.forest_fighter.fatality:0 "acossando [sc_loser.GetSheHe] através da linha de árvores como um demônio.\n\nQuando [sc_loser.GetFirstNameNoTooltip] tropeça, eu tenho minha melhor chance de vencer, e avanço rapidamente. Minha [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponWoundVerb5ThirdPersonPresent')] para baixo, [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))] com um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\nEu chuto [sc_loser.GetSheHe] pelas costas. [sc_loser.GetFirstNameNoTooltip] está vivo o suficiente para me olhar nos [sc_victor.Custom('EyeEyes')], enquanto eu mato [sc_loser.GetSheHe]."
 single_combat.0041.desc.sc_attacker.forest_fighter.injury:0 "tecendo por entre os espinhos e árvores da floresta com abandono selvagem.\n\n[sc_loser.GetFirstNameNoTooltip] nem mesmo vê o toco apodrecido em que eu o guio, tropeçando nele para trás com um grito surpreso, fazendo seu(a) [sc_loser.Custom('signature_weapon')] deslizar pela vegetação.\n\nUm chute firme no peito e um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] final são tudo o que é necessário para obter uma rendição depois disso."
 single_combat.0041.desc.sc_attacker.forest_fighter:0 "Há uma arte na luta na floresta, uma intercalação do sutil e do selvagem que só vem com experiência amarga. Fico mais do que feliz em ajudar meu oponente a construir essa experiência,"
 single_combat.0041.desc.sc_attacker.guard.fatality:0 "até um golpe mal calculado me permitir afastar seu(a) [sc_loser.Custom('signature_weapon')].\n\nAntes que [sc_loser.GetFirstNameNoTooltip] possa protestar, inicio uma série de [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')], extraindo um preço em sangue e dor pelo julgamento pobre [sc_loser.GetHerHim].\n\nNão demora muito para que meu inimigo seja forçado a ficar de joelhos, [sc_loser.Custom('MaskFace')] coberto de saliva ensanguentada. Com toda a sobriedade de um carrasco, finalmente [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]."
 single_combat.0041.desc.sc_attacker.guard.injury:0 "até que eu tenha a #EMP perfeita#! abertura momentânea.\n\nCom uma parada e resposta relâmpago, consigo torcer o [sc_loser.Custom('signature_weapon')] da mão [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip], fazendo-o voar.\n\nMeu oponente fica pasmo enquanto me preparo para um segundo golpe, desta vez pronto para matar. Mais violência se mostra desnecessária, já que recebo minha rendição assim que [sc_loser.GetFirstNameNoTooltip] percebe quantas opções [sc_loser.GetSheHe] tem."
 single_combat.0041.desc.sc_attacker.guard:0 "[sc_victor.Custom('signature_weapon')|U] mantido vigilante à minha frente, eu avanço, aparando golpe após golpe do meu oponente,"
 single_combat.0041.desc.sc_attacker.hail_mary.fatality:0 "Só percebo que estou atacando muito alto quando já me comprometi com meu movimento. Em pânico, tento abaixar minha arma, e o espasmo surpresa do movimento passa pela guarda [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] e diretamente em seu crânio.\n\nO golpe [sc_victor.Custom('SignatureWeaponWoundVerb1ThirdPersonPresent')] atravessa o osso e entra no cérebro, matando [sc_loser.GetSheHe] instantaneamente.\n\nPor um momento, o cadáver [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] cambaleia e balança, sustentado pelo meu braço com [sc_victor.Custom('signature_weapon')], antes de desabar desajeitadamente no [sc_defender.Custom('GroundType')]."
 single_combat.0041.desc.sc_attacker.hail_mary.injury:0 "[sc_loser.GetFirstNameNoTooltip] observa, com escárnio nos [my_foe.Custom('EyeEyes')], sem fazer movimento para esquivar, mas girando seu(a) [sc_loser.Custom('signature_weapon')] para parar minha arma.\n\nÉ quase por instinto que eu varro um pé em volta de um dos joelhos [sc_loser.GetHerHim] e puxo, mas realmente funciona! Meu oponente tomba e eu me apresso para me preparar para um golpe fatal.\n\nUma rendição assustada e surpresa chega quando eu começo a balançar minha [sc_victor.Custom('signature_weapon')]."
 single_combat.0041.desc.sc_attacker.hail_mary:0 "Esta não é uma luta que espero vencer. Com isso em mente, não tenho motivo para jogar com segurança e me jogo para frente, [sc_victor.Custom('signature_weapon')]-primeiro.\n\n"
 single_combat.0041.desc.sc_attacker.hard_grit.fatality:0 "Sem chance de recuperar o controle do combate, a morte [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] é uma questão de quando, não se.\n\nEventualmente, [sc_loser.GetSheHe] comete um erro crucial, e sua guarda se abre por um segundo. É tudo o que preciso, pois um golpe finalmente [sc_victor.Custom('SignatureWeaponWoundVerb4ThirdPersonPresent')] o pescoço [sc_loser.GetHerHim].\n\n[sc_loser.GetFirstNameNoTooltip] morre sufocado em pouco tempo."
 single_combat.0041.desc.sc_attacker.hard_grit.injury:0 "Não demora muito, e eu sou capaz de arrancar a [sc_loser.Custom('signature_weapon')] da mão [sc_loser.GetHerHim] com um golpe bem colocado de [sc_victor.Custom('SignatureWeaponAttemptedLight')].\n\n[sc_loser.GetFirstNameNoTooltip] fica atordoado brevemente, mas balbucia uma rendição antes de eu [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]."
 single_combat.0041.desc.sc_attacker.hard_grit:0 "No calor da batalha, não há perdão. Cada erro que meu adversário comete é punido dez vezes, cada erro descuidado é pago com juros. Meus [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] esculpem meu oponente, cada um forçando [sc_loser.GetSheHe] mais perto do precipício da derrota.\n\n"
 single_combat.0041.desc.sc_attacker.hurt_me_better.fatality:0 "Enquanto o transe de batalha me domina, eu me lanço em um frenesi de [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')], alternando perfeitamente entre defesas impiedosas e golpes quase letais, minha tolerância à dor desconcertando cada cálculo [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip].\n\nNão demora muito para eu conseguir um ataque mortal, perfurando um terrível buraco no lado do meu inimigo.\n\n[sc_loser.GetSheHe|U] sangra até a morte em questão de minutos."
 single_combat.0041.desc.sc_attacker.hurt_me_better.injury:0 "Lentamente, a agonia e a adrenalina se elevam até um clímax, eu solto um rugido poderoso e avanço em uma onda de [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] que faz [sc_loser.GetFirstNameNoTooltip] cair de joelhos.\n\nMeu adversário tenta bloquear, falhando completamente em perceber que meu joelho vai direto no(a) seu(a) [sc_loser.Custom('MaskFace')]. [sc_loser.GetSheHe|U] cai para trás, ofegante por ar.\n\n[sc_loser.GetFirstNameNoTooltip] ainda está ofegando quando [sc_loser.GetSheHe] balbucia uma rendição segundos depois, olhos fixos na minha [sc_victor.Custom('signature_weapon')]."
 single_combat.0041.desc.sc_attacker.hurt_me_better:0 "Meu oponente parece pensar que [sc_loser.GetSheHe] está me ferindo com seus golpes insignificantes, mas cada pontada de dor simplesmente me impulsiona a lutar com mais força, mais rápido.\n\n"
 single_combat.0041.desc.sc_attacker.is_that_a_crocodile.fatality:0 "avança até derrubar [sc_loser.GetSheHe] no chão, fazendo o [sc_loser.Custom('signature_weapon')] [sc_loser.GetHerHim] sair voando no processo.\n\nO tempo parece se abrir lenta e amplamente como a mandíbula da fera, [sc_loser.GetFirstNameNoTooltip] encarando aquela boca fedorenta pelo que parece uma eternidade.\n\nEntão o tempo, e a boca do crocodilo, se fecham.\n\nEu imagino que ouço os gritos de pânico [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] de dentro do leviatã muito tempo depois que seus membros foram decepados por seus dentes."
 single_combat.0041.desc.sc_attacker.is_that_a_crocodile:0 "Eu recuo, com meu oponente quente em meus calcanhares o tempo todo, pressionando seu ataque o tempo todo. Atrás [sc_loser.GetHerHim], o monstro reptiliano"
 single_combat.0041.desc.sc_attacker.jungle_stalker.fatality:0 "Arremessando a [sc_victor.Custom('SignatureWeaponEndType')] da minha [sc_victor.Custom('signature_weapon')] no olho [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip], é quase fácil demais afastar sua própria [sc_loser.Custom('signature_weapon')].\n\nSem nenhuma maneira de se defender, eu termino rapidamente com [sc_loser.GetFirstNameNoTooltip]."
 single_combat.0041.desc.sc_attacker.jungle_stalker.injury:0 "Um chute rápido na virilha derruba meu oponente, gritando, na vegetação densa. [sc_loser.GetFirstNameNoTooltip] se debate no início, mas rapidamente se acalma quando eu encosto a [sc_victor.Custom('signature_weapon')] com [sc_victor.Custom('SignatureWeaponTipType')] no(a) seu(a) [sc_loser.Custom('MaskFace')].\n\nA rendição não demora nada."
 single_combat.0041.desc.sc_attacker.jungle_stalker:0 "A selva é uma aliada sólida em qualquer luta, e eu só tenho que esperar que ela enrede de alguma forma meu inimigo. Quando [sc_loser.GetSheHe] pega o pé em uma videira, eu ataco.\n\n"
 single_combat.0041.desc.sc_attacker.like_a_viper.fatality:0 "[sc_loser.GetFirstNameNoTooltip] se apressa para se defender, mas está longe de me impedir.\n\nEu passo direto pelo fraco bloqueio [sc_loser.GetHerHim], [sc_victor.Custom('signature_weapon')]-[sc_victor.Custom('SignatureWeaponTipType')] mergulhando no peito do [sc_loser.GetWomanMan].\n\nEstalos fortes e sons úmidos marcam ossos quebrando e órgãos perfurando por uma eternidade, até que minha arma perfura limpa para o outro lado.\n\nÉ quase impossível dizer em que momento [sc_loser.GetFirstNameNoTooltip] morreu."
 single_combat.0041.desc.sc_attacker.like_a_viper.injury:0 "[sc_loser.GetFirstNameNoTooltip], presumivelmente vendo a vida [sc_loser.GetHerHim] passar diante dos olhos enquanto minha arma mergulha em direção ao coração [sc_loser.GetHerHim], se apressa para aparar.\n\nEu me permito um sorriso torto, enganchando minha arma n[sc_loser.GetSheHe] desajeitadamente e, com um movimento vigoroso, transformo um golpe fatal em um desarmamento. O [sc_loser.Custom('signature_weapon')] [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] voa para longe.\n\nA luta ganha, faço questão de encostar a [sc_victor.Custom('SignatureWeaponTipType')] da minha arma no coração do meu adversário. A rendição é quase tão rápida quanto meu primeiro golpe de [sc_victor.Custom('signature_weapon')]."
 single_combat.0041.desc.sc_attacker.like_a_viper:0 "Com precisão infalível, eu me atiro [sc_victor.Custom('signature_weapon')]-primeiro em um ponto cego na guarda do meu oponente."
 single_combat.0041.desc.sc_attacker.martial_voice.fatality:0 "Sem aviso prévio, meus obscenidades gritadas se transformam em um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]. [sc_loser.GetFirstNameNoTooltip] ainda está tão perdido no horror das minhas palavras que [sc_loser.GetSheHe] nem tenta parar o golpe.\n\nMetal encontra carne e osso, [sc_victor.Custom('SignatureWeaponWoundVerb2PresentParticiple')] profundamente no ombro do meu inimigo. Nós dois sabemos que o fluxo de sangue que resulta é muito intenso para ser sobrevivido."
 single_combat.0041.desc.sc_attacker.martial_voice.injury:0 "[sc_loser.GetFirstNameNoTooltip] fica completamente surpreso quando eu mudo de um rugido estrondoso para [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], dando um salto para trás com medo reflexo.\n\nO instinto é rápido, mas falta finesse, e meu oponente mostra isso deixando cair seu(a) [sc_loser.Custom('signature_weapon')] enquanto [sc_loser.GetSheHe] se afasta.\n\nEu já estou no meio da preparação para um golpe fatal quando [sc_loser.GetFirstNameNoTooltip] se rende apressadamente."
 single_combat.0041.desc.sc_attacker.martial_voice:0 "Comandar os incautos é uma arte ligeiramente diferente de comandar os de nascimento mais elevada, mas as ferramentas que me foram dadas provam ser eficazes mesmo assim, enquanto eu trovejo insultos e ameaças no topo dos meus pulmões."
 single_combat.0041.desc.sc_attacker.mocking_boast.fatality:0 "Mate-os. [sc_loser.GetFirstNameNoTooltip] fica tão atordoado com meus comentários que [sc_loser.GetSheHe] falha em me impedir de arrancar o [sc_loser.Custom('signature_weapon')] de sua mão.\n\nMeu inimigo tem apenas tempo suficiente para perceber exatamente como as coisas vão terminar antes que eu [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]."
 single_combat.0041.desc.sc_attacker.mocking_boast.injury:0 "abrem uma brecha na guarda deles. A definição de uma profecia auto-realizável, embora com um pouco de ajuda.\n\nA partir daí, um único golpe sólido na mão do [sc_loser.GetFirstNameNoTooltip] com [sc_loser.Custom('signature_weapon')] faz sua arma se soltar. Eu giro a minha própria [sc_victor.Custom('signature_weapon')] com um floreio, preparando-me para [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]. Não consigo resistir à vontade de dar um último cutucão.\n\n\"Agora, o que o perdedor diz?\"\n\nRendição, como acaba sendo. Rendição, rendição, rendição."
 single_combat.0041.desc.sc_attacker.mocking_boast:0 "É lindo, na verdade, usar a vergonha de alguém por sua própria inadequação para"
 single_combat.0041.desc.sc_attacker.nut_em.fatality:0 "Como em cada cabeçada, é quase tão doloroso para mim quanto para [sc_loser.GetSheHe], mas [sc_loser.GetFirstNameNoTooltip] parece... diferente depois. Como se o golpe tivesse embaralhado a mente [sc_loser.GetHerHim].\n\nApós alguns [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] para testar a guarda do meu oponente, arrisco um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]. O golpe [sc_victor.Custom('SignatureWeaponWoundVerb1ThirdPersonPresent')] fundo no ombro [sc_loser.GetHerHim], perfurando até as partes vitais da cavidade torácica.\n\nSangue e osso quebrado espirram da ferida enquanto retiro minha [sc_victor.Custom('signature_weapon')]. [sc_loser.GetFirstNameNoTooltip] cambaleia, balança, tomba e fica imóvel."
 single_combat.0041.desc.sc_attacker.nut_em.injury:0 "Alguns podem considerar isso um movimento arriscado ou tolo, mas um golpe na cara rouba a maioria dos detratores de seus melhores argumentos, mesmo que doa para mim também.\n\nNão importa o quão mal me sinta, [sc_loser.GetFirstNameNoTooltip] claramente se sente pior, se contorcendo no chão, ofegante e agarrando seu(a) [sc_loser.Custom('MaskFace')].\n\nTenho que me estabilizar um pouco, mas ainda consigo preparar minha [sc_victor.Custom('signature_weapon')] para [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] a tempo de forçar uma rendição."
 single_combat.0041.desc.sc_attacker.nut_em:0 "Vendo uma brecha #EMP perfeita#! na guarda do meu oponente, eu dou um passo à frente e trago meu(a) [sc_victor.Custom('MaskFace')] para baixo sobre [sc_loser.GetSheHe] com #EMP força#!."
 single_combat.0041.desc.sc_attacker.onslaught.fatality:0 "Cada golpe rouba algo [sc_loser.GetHerHim]: a postura [sc_loser.GetHerHim], o ar nos pulmões [sc_loser.GetHerHim], seu(a) [sc_loser.Custom('signature_weapon')], pedaços de sua carne.\n\nÉ apenas quando [sc_loser.GetSheHe] está quase totalmente indefeso que deixo minha arma [sc_victor.Custom('SignatureWeaponWoundVerb2')] letalmente no peito [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip].\n\n[sc_loser.GetSheHe|U] parece não apreciar completamente a misericórdia, convulsionando em espasmos fracos enquanto [sc_loser.GetSheHe] cai para trás na poça crescente de sangue [sc_loser.GetHerHim]."
 single_combat.0041.desc.sc_attacker.onslaught.injury:0 "Cada golpe cobra um pedágio assustador, exigindo paradas tão duras que o suor está começando a escorrer pelo [sc_loser.GetWomanMan]'s [sc_loser.Custom('MaskFace')] apenas por se defender [sc_loser.GetHerselfHimself] sozinho.\n\nNinguém pode manter esse nível de esforço por tanto tempo, e, eventualmente, [sc_loser.GetFirstNameNoTooltip] desaba no [sc_defender.Custom('GroundType')].\n\nEu [sc_victor.Custom('SignatureWeaponAction')] minha [sc_victor.Custom('signature_weapon')], e recebo uma rendição exausta pelos meus problemas."
 single_combat.0041.desc.sc_attacker.onslaught:0 "[sc_victor.Custom('signature_weapon')|U] voando, eu lanço uma saraivada de [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] no meu oponente."
 single_combat.0041.desc.sc_attacker.open_terrain_expert.fatality:0 "Inevitavelmente, [sc_loser.GetFirstNameNoTooltip] se estende demais, e, quando [sc_loser.GetSheHe] faz isso, eu rapidamente aproveito a oportunidade com um [sc_victor.Custom('SignatureWeaponAttemptedLight')] extremamente rápido no lado [sc_loser.GetHerHim].\n\nA [sc_victor.Custom('signature_weapon')] da minha [sc_victor.Custom('signature_weapon')] volta molhada de sangue e rastros de vísceras. Meu oponente desaba em questão de segundos, dominado pela dor excruciante.\n\nEu levanto minha arma para o golpe final."
 single_combat.0041.desc.sc_attacker.open_terrain_expert.injury:0 "Eventualmente, [sc_loser.GetFirstNameNoTooltip] tropeça de pura exaustão, e eu entro em ação com um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] que joga [sc_loser.GetSheHe] no chão.\n\nMeu oponente tenta se levantar, mas a luta se transforma em pânico quando eu coloco minha bota em cima da cabeça [sc_loser.GetHerHim].\n\nEu levanto minha [sc_victor.Custom('signature_weapon')] para [sc_victor.Custom2('SignatureWeaponKillTypeHeadThirdPersonFutureGendered',SCOPE.sC('sc_loser'))], e recebo uma rendição grogue pelos meus problemas."
 single_combat.0041.desc.sc_attacker.open_terrain_expert:0 "O espaço é tradicionalmente uma das commodities mais valiosas em um duelo, mas eu dou espaço ao meu oponente como água à pedra. E, como a água na pedra, eu desgasto [sc_loser.GetSheHe] com golpe após golpe.\n\n"
 single_combat.0041.desc.sc_attacker.pocket_sand.fatality:0 "E aproveito a brecha momentânea para enfiar minha [sc_victor.Custom('signature_weapon')] na barriga do [sc_loser.GetWomanMan] com toda a força que posso.\n\nConforme [sc_loser.GetFirstNameNoTooltip] tomba para trás, cego e ensanguentado, avanço com um golpe mortal que corta fundo no pescoço [sc_loser.GetHerHim]. A carne se rasga como carne de açougueiro, nos borrifando com sangue quente.\n\n[sc_loser.GetSheHe|U] está morto dentro de um minuto após atingir o chão."
 single_combat.0041.desc.sc_attacker.pocket_sand.injury:0 "tosse e engasgo enquanto desce metade do caminho pela traqueia [sc_loser.GetHerHim].\n\nNão perco tempo derrubando os joelhos [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] com um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], e [sc_loser.GetWomanMan] cai, ainda se contorcendo e tentando limpar o [sc_defender.Custom('GritType')] de seu(s) [sc_defender.Custom('EyeEyes')].\n\nNo momento em que [sc_loser.GetSheHe]'s consegue, estou me preparando para [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))].\n\nA rendição é bastante rápida."
 single_combat.0041.desc.sc_attacker.pocket_sand:0 "Me abaixando, eu pego um punhado de [sc_defender.Custom('GritType')] e atiro diretamente no [sc_loser.Custom('MaskFace')] do meu oponente. [sc_loser.GetSheHe|U] fica totalmente surpreso,"
 single_combat.0041.desc.sc_attacker.pocket_silver.fatality:0 "[sc_loser.GetFirstNameNoTooltip] desvia a bolsa, mas não vê meu golpe de acompanhamento.\n\nO [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] atinge [sc_loser.GetSheHe] em cheio na mandíbula, arrancando carne solta, dentes e osso. [sc_loser.GetSheHe|U] tenta gritar, mas não consegue através da ruína de sua boca.\n\nÉ discutivelmente uma gentileza quando eu ponho [sc_loser.GetSheHe] fora de seu sofrimento."
 single_combat.0041.desc.sc_attacker.pocket_silver.injury:0 "\n\nEmbora [sc_loser.GetFirstNameNoTooltip] consiga desviar o projétil, eu aproveito o tempo para posicionar minha [sc_victor.Custom('signature_weapon')] #EMP dentro#! da guarda [sc_loser.GetHerHim], enfiando seu [sc_victor.Custom('SignatureWeaponTipAdjective')] [sc_victor.Custom('SignatureWeaponTipType')] contra a garganta do [sc_loser.GetWomanMan].\n\n[sc_loser.GetFirstNameNoTooltip] não se rende imediatamente. Por um instante, até parece que [sc_loser.GetSheHe] pode tentar algo com a [sc_loser.Custom('signature_weapon')] própria, mas uma carranca e uma mudança de meu peso deixam claro que só pode terminar de uma maneira.\n\nEu recebo a rendição."
 single_combat.0041.desc.sc_attacker.pocket_silver:0 "Pegando uma bolsa pesada de prata do meu cinto, eu a arremesso no [sc_loser.Custom('MaskFace')] do meu oponente."
 single_combat.0041.desc.sc_attacker.probing_attack.fatality:0 "Aos poucos, vou minando a forma [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] até conseguir fazê-lo voar com um [sc_victor.Custom('SignatureWeaponAttemptedLight')].\n\nAssim que meu inimigo está no ar, coloco todo o meu peso em um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] que acerta no instante em que [sc_loser.GetSheHe] toca o chão, [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))] com um golpe feroz.\n\n[sc_loser.GetFirstNameNoTooltip] morre rapidamente."
 single_combat.0041.desc.sc_attacker.probing_attack.injury:0 "\n\nO resultado é uma batalha de atrito desagradável, pelo menos do ponto de vista [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip], que eventualmente termina comigo tirando o [sc_loser.Custom('signature_weapon')] da mão cansada [sc_loser.GetHerHim].\n\nFelizmente para [sc_loser.GetFirstNameNoTooltip], ambos pudemos ver como essa luta acabaria algum tempo atrás, e [sc_loser.GetSheHe] age rapidamente com uma rendição assim que é desarmado."
 single_combat.0041.desc.sc_attacker.probing_attack:0 "Lutando taticamente, mantenho a maioria dos meus ataques como fintas, apenas inclinando-me para os golpes que atingirão com mais força."
 single_combat.0041.desc.sc_attacker.put_the_boot_in.fallback:0 "Determinado a ver meu oponente derrubado, eu lanço todo o meu peso em um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] que faz [sc_loser.GetSheHe] cambalear, seguido de um chute violento.\n\n"
 single_combat.0041.desc.sc_attacker.put_the_boot_in.fatality:0 "O golpe duplo despedaça a guarda [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip], e sou capaz de primeiro desarmar [sc_loser.GetSheHe] com um [sc_victor.Custom('SignatureWeaponAttemptedLight')], depois fazer a transição rapidamente para um tiro letal no peito que abre uma cunha sangrenta direto até o coração [sc_loser.GetHerHim].\n\nExistem mortes mais lentas para serem realizadas."
 single_combat.0041.desc.sc_attacker.put_the_boot_in.injury:0 "[sc_loser.GetFirstNameNoTooltip] é lançado para trás, e não deixo a oportunidade escapar, voando em uma tempestade de [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] que faz [sc_loser.GetSheHe] gritar ao [sc_defender.Custom('GroundType')].\n\nFraco, meu oponente treme seu(a) [sc_loser.Custom('signature_weapon')]-mão, tentando reunir a vontade para me desafiar ainda mais.\n\nEu simplesmente preparo minha arma para [sc_victor.Custom2('SignatureWeaponKillTypeHeadThirdPersonFutureGendered',SCOPE.sC('sc_loser'))], pelo menos até ouvir uma rendição trêmula."
 single_combat.0041.desc.sc_attacker.put_the_boot_in.peg_leg:0 "Determinado a ver meu oponente derrubado, não importa o risco, eu lanço todo o meu peso em um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] que faz [sc_loser.GetSheHe] cambalear, seguido de um chute violento da minha perna falsa.\n\n"
 single_combat.0041.desc.sc_attacker.raaargh.fatality:0 "Uma névoa vermelha encobre minha visão, tanto que vejo cenas quase paradas das minhas ações mais do que os feitos reais. A arma [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] é inútil à medida que [sc_victor.Custom('SignatureWeaponBreaksThirdPersonSingularPresent')]. Os seus [sc_loser.Custom('ArmArms')] quase se partem ao meio quando eu os desvio. Seu rosto é uma bagunça ensanguentada gotejando dentes quebrados e gengivas rasgadas enquanto eu recuo meu punho para outro golpe.\n\nQuando volto a mim, há algo pegajoso e molhado sob meu calcanhar. Um olhar confirma que é o que restou do crânio [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip]."
 single_combat.0041.desc.sc_attacker.raaargh.injury:0 "Avançando como um [sc_victor.GetWomanMan] possuído, eu quebro a guarda do meu inimigo e arranco a [sc_loser.Custom('signature_weapon')] da mão [sc_loser.GetHerHim] com um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\nMais rápido do que eu posso ver, forte o suficiente para #EMP meus#! ossos tremerem, eu despejo uma saraivada de golpes cheios de ódio que jogam [sc_loser.GetSheHe] ao chão com facilidade.\n\nTão rápido quanto me sobreveio, minha raiva evapora, deixando-me abalado, mas compos mentis. [sc_loser.GetFirstNameNoTooltip] quase grita uma rendição enquanto [sc_loser.GetSheHe] ainda pode."
 single_combat.0041.desc.sc_attacker.raaargh:0 "Rage, raiva e a necessidade insaciável de #BER matar#! se acumulam dentro de mim, rasgando um #BER buraco sangrento#! na minha psique. Sinto o #EMP frenesi de berserker#! #BER me dominando#!, #EMP mas é uma#! #BER boa dor! RAAARGH!#!\n\n"
 single_combat.0041.desc.sc_attacker.reason_you_suck_speech.fatality:0 "Os golpes [sc_loser.GetHerHim|U] ficam cada vez mais apressados, a frustração se torna visível na falta de cuidado dos seus golpes, até que [sc_loser.GetFirstNameNoTooltip] solta um grito de frustração.\n\nNaquele exato momento, eu passo pela guarda [sc_loser.GetHerHim], [sc_victor.Custom('SignatureWeaponWoundVerb5PresentParticiple')] minha [sc_victor.Custom('signature_weapon')] profundamente na garganta [sc_loser.GetHerHim].\n\nA bagunça ensanguentada e rasgada que fica depois é dolorosa só de olhar. Felizmente, [sc_loser.GetFirstNameNoTooltip] cai morto de cara para baixo, poupando-nos de ambos os tormentos."
 single_combat.0041.desc.sc_attacker.reason_you_suck_speech.injury:0 "Linha por linha, eu me insinuo dentro do ego [sc_loser.GetHerHim] e faço um festim das inseguranças [sc_loser.GetHerHim], até que sua guarda fique descuidada de pura irritação.\n\nSomente quando a irritação [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] atinge o seu auge é que eu salto para a frente, arrancando seu(a) [sc_loser.Custom('signature_weapon')] com um [sc_victor.Custom('SignatureWeaponAttemptedLight')].\n\nUm comentário final sobre a firmeza [sc_loser.GetHerHim] sob pressão, e então eu espero pela amarga e amarga rendição. Lágrimas salgadas nunca tiveram um gosto tão doce."
 single_combat.0041.desc.sc_attacker.reason_you_suck_speech:0 "Eu encontro cada golpe do [sc_loser.Custom('signature_weapon')] do meu oponente com uma observação mordaz e um salto para trás.\n\n"
 single_combat.0041.desc.sc_attacker.rough_terrain_expert.boggy:0 "Pântanos e charcos são difíceis de lutar nas melhores circunstâncias, mas minha experiência com essas áreas torna esta luta absolutamente miserável para meu oponente.\n\n"
 single_combat.0041.desc.sc_attacker.rough_terrain_expert.fatality.boggy:0 "Com empurrões suficientes, eventualmente consigo fazer [sc_loser.GetFirstNameNoTooltip] cair de cara em uma poça profunda de água fétida.\n\nA arma [sc_loser.GetHerHim|U] é perdida imediatamente, e com habilidade deliberada eu coloco a bota na parte de trás do pescoço do [sc_loser.GetWomanMan].\n\nLutando o quanto [sc_loser.GetSheHe] pode, entre minha [sc_victor.Custom('signature_weapon')] e meu pé, [sc_loser.GetFirstNameNoTooltip] não consegue trazer a cabeça acima da água. Não demora muito para que sua luta cesse completamente."
 single_combat.0041.desc.sc_attacker.rough_terrain_expert.fatality.rocky:0 "Leva mais esforço do que eu gostaria, mas eventualmente consigo forçar [sc_loser.GetFirstNameNoTooltip] para trás sobre uma pequena queda, fazendo [sc_loser.GetSheHe] cair pela inclinação em uma cacofonia de membros repentinamente quebrados.\n\nQuando finalmente alcanço [sc_loser.GetSheHe], a mordida da minha [sc_victor.Custom('signature_weapon')] é mais um alívio bem-vindo do que qualquer outra coisa."
 single_combat.0041.desc.sc_attacker.rough_terrain_expert.injury.boggy:0 "São necessárias várias tentativas, mas finalmente consigo empurrar [sc_loser.GetFirstNameNoTooltip] para uma poça de pântano com água fétida até os joelhos. [sc_loser.GetSheHe|U] escorrega, perdendo seu(a) [sc_loser.Custom('signature_weapon')] no processo, e cai sob a superfície com um estrondo fedorento.\n\nÉ fácil o suficiente manter uma bota sobre o [sc_loser.Custom('MaskFace')] [sc_loser.GetHerHim] a partir de um terreno sólido, e a ameaça de sufocamento no pântano fétido me rende uma rendição rápida, embora parcialmente borbulhante."
 single_combat.0041.desc.sc_attacker.rough_terrain_expert.injury.rocky:0 "Vez após outra, eu empurro [sc_loser.GetFirstNameNoTooltip] para trás, e vez após outra, [sc_loser.GetSheHe] consegue se recuperar no último segundo. Pelo menos, até que [sc_loser.GetSheHe] não consegue mais, e é arremessado para trás sobre uma pequena elevação.\n\nEu corro atrás do meu oponente e coloco minha [sc_victor.Custom('signature_weapon')] na nuca [sc_loser.GetHerHim] antes que [sc_loser.GetSheHe] possa se recuperar. Uma rendição um pouco machucada é oferecida sem hesitação."
 single_combat.0041.desc.sc_attacker.rough_terrain_expert.rocky:0 "Colinas e montanhas são difíceis de lutar nas melhores circunstâncias, mas minha experiência com essas áreas torna esta luta absolutamente miserável para meu oponente.\n\n"
 single_combat.0041.desc.sc_attacker.something_to_hide.injury:0 "Enquanto [sc_loser.GetFirstNameNoTooltip] fica perdido em pensamentos, lanço um [sc_victor.Custom('SignatureWeaponAttemptedLight')] que joga [sc_loser.GetSheHe] para trás, e depois um segundo golpe que arranca a [sc_loser.Custom('signature_weapon')] da mão [sc_loser.GetHerHim].\n\nSem arma, a uma distância fácil para [sc_victor.Custom('SignatureWeaponWoundVerb1PresentParticiple')], e segundos antes da morte nas minhas mãos, [sc_loser.GetFirstNameNoTooltip] se rende."
 single_combat.0041.desc.sc_attacker.something_to_hide:0 "A voz apenas acima de um sussurro rangente, eu sibilo um lembrete inconfundível do controle que tenho sobre meu oponente, fazendo com que [sc_loser.GetSheHe] congele imediatamente.\n\n"
 single_combat.0041.desc.sc_attacker.special_fallback.fatality:0 "[sc_loser.GetFirstNameNoTooltip] tropeça, tempo suficiente para eu trazer o [sc_victor.Custom('signature_weapon')] em direção ao seu rosto.\n\nSeu tropeço se transforma em uma queda completa, a arma rolando enquanto [sc_loser.GetSheHe] cai. Eu chuto o [sc_loser.GetWomanMan] atordoado para as costas e, com um golpe impiedoso, [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]."
 single_combat.0041.desc.sc_attacker.special_fallback.injury:0 "Parece pegar [sc_loser.GetSheHe] desprevenido, e [sc_loser.GetSheHe] tropeça, com força.\n\nAproveito a oportunidade para gentilmente apoiar a [sc_victor.Custom('signature_weapon')] da minha [sc_victor.Custom('SignatureWeaponTipType')] contra o rosto [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip].\n\nRecebo uma rendição assim que o choque passa."
 single_combat.0041.desc.sc_attacker.special_fallback:0 "Percebendo uma falha momentânea na guarda do meu oponente, eu miro um chute cruel na canela [sc_loser.GetHerHim]."
 single_combat.0041.desc.sc_attacker.stoic_veteran.fatality:0 "\n\nUm olhar perspicaz encontra oportunidades na batalha, e o meu me presenteia com a chance de [sc_loser.Custom('SignatureWeaponBreaksVerbPastTense')] da [sc_loser.GetFirstNameNoTooltip] [sc_loser.Custom('signature_weapon')]. Desarmado, meu inimigo representa pouco perigo, e meu próximo golpe é livre para [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonFutureGendered',SCOPE.sC('sc_loser'))].\n\nCom isso, [sc_loser.GetFirstNameNoTooltip] está morto, [sc_loser.GetSheHe] apenas ainda não morreu completamente.\n\nPermito que o corpo [sc_loser.GetHerHim] prestes a morrer caia para trás com minha [sc_victor.Custom('signature_weapon')] ainda cravada em seu peito."
 single_combat.0041.desc.sc_attacker.stoic_veteran.injury:0 "Tudo o que [sc_loser.GetFirstNameNoTooltip] pode fazer é manter o ritmo comigo, até que um dos meus golpes atinge seu(a) [sc_loser.Custom('signature_weapon')] com tanta força que ele realmente [sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent2')].\n\nGaguejando, desarmado, meu adversário recua alguns passos enquanto a realidade se estabelece.\n\nÉ uma rendição rápida."
 single_combat.0041.desc.sc_attacker.stoic_veteran:0 "[sc_victor.Custom('signature_weapon')|U] em mãos, eu retalho meu oponente, golpes longos e uniformes que forçam [sc_loser.GetSheHe] recuar repetidamente."
 single_combat.0041.desc.sc_attacker.strict_guard.fatality:0 "O primeiro golpe cria um buraco enorme na guarda [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip], o segundo rouba [sc_loser.GetHerHim] o uso do [sc_loser.Custom('signature_weapon')]-braço. Meu oponente tropeça, com a lucidez desaparecendo em meio a uma avalanche de dor.\n\nLevo meu tempo alinhando o próximo golpe, [sc_victor.Custom('SignatureWeaponWoundVerb1PresentParticiple')] profundamente no peito do [sc_loser.GetWomanMan] com minha [sc_victor.Custom('signature_weapon')].\n\nO próximo ataque simplesmente encerra a dor rapidamente."
 single_combat.0041.desc.sc_attacker.strict_guard.injury:0 "Enquanto [sc_loser.GetFirstNameNoTooltip] recua, eu recuo com [sc_loser.GetSheHe], trazendo o [sc_victor.Custom('signature_weapon')]'s [sc_victor.Custom('SignatureWeaponEndType')] para baixo no(a) seu(a) [sc_loser.Custom('MaskFace')]. Há poucas #EMP pancadas#! tão visceralmente satisfatórias quanto #EMP essa#!.\n\nAtordoado e enfraquecido, meu oponente desaba no chão, perdendo sua arma no processo. [sc_loser.GetSheHe]'s está tão cansado que leva um pouco de chute estudioso para obter uma rendição oficial."
 single_combat.0041.desc.sc_attacker.strict_guard:0 "Nenhum inimigo quebra minha guarda, e meu oponente hoje não é exceção. Forço [sc_loser.GetSheHe] de volta repetidamente com uma sequência de defesas perfeitas, apenas oferecendo um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] devastador quando [sc_loser.GetSheHe] está completamente exausto.\n\n"
 single_combat.0041.desc.sc_attacker.surprise_attack.fatality:0 "Tanto assim, aparentemente, que [sc_loser.GetSheHe] perde o controle de sua [sc_loser.Custom('signature_weapon')], que desliza para longe no [sc_defender.Custom('GroundType')]. Não desperdiço uma vantagem, pulo à frente, [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))] em um movimento suave.\n\n[sc_loser.GetFirstNameNoTooltip] desaba no chão, a vida se esvai rapidamente. [sc_loser.GetSheHe|U] mantém o olhar em mim até o fim."
 single_combat.0041.desc.sc_attacker.surprise_attack.injury:0 "O ataque acerta mais forte do que eu havia antecipado, quase girando [sc_loser.GetFirstNameNoTooltip] completamente e #EMP quase#! derrubando [sc_loser.GetSheHe] por completo.\n\n[sc_loser.GetSheHe|U] se recompõe no último momento, mas eu já posicionei minha [sc_victor.Custom('signature_weapon')] para [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] [sc_loser.GetHerHim].\n\nSegue-se um impasse tenso enquanto [sc_loser.GetFirstNameNoTooltip] avalia suas opções, mas eventualmente [sc_loser.GetSheHe] solta uma rendição amarga entre dentes cerrados."
 single_combat.0041.desc.sc_attacker.surprise_attack:0 "Um movimento dramático do meu [sc_victor.Custom('signature_weapon')] em uma direção dá lugar a uma mudança de arco e um [sc_victor.Custom('SignatureWeaponAttemptedLight')] que pega meu oponente de surpresa.\n\n"
 single_combat.0041.desc.sc_attacker.taunt.fatality:0 "tão enfurecido que sua guarda quebra completamente em um acesso de raiva.\n\nDado um caminho aberto para o ventre [sc_loser.GetHerHim], recompensarei sua impaciência com uma morte lenta."
 single_combat.0041.desc.sc_attacker.taunt.injury:0 "que [sc_loser.GetSheHe] eventualmente fica tão enfurecido que [sc_loser.GetSheHe] ignora as armadilhas do combate sensato e joga seu(a) [sc_loser.Custom('signature_weapon')] no chão, determinado a me matar com as suas próprias [sc_loser.Custom('HandHands')].\n\nSó precisa de um pequeno balanço da minha [sc_victor.Custom('signature_weapon')] para lembrar [sc_loser.GetFirstNameNoTooltip] onde [sc_loser.GetSheHe] está, e rapidamente recebo uma rendição sufocada entre dentes cerrados."
 single_combat.0041.desc.sc_attacker.taunt:0 "Com total desdém, eu lanço insultos, zombarias e desprezo ao meu oponente.\n\nNão é de admirar, então,"
 single_combat.0041.desc.sc_attacker.technique_from_legend.fatality:0 "Com mais esperança do que crença, eu avanço em direção a [sc_loser.GetFirstNameNoTooltip], [sc_victor.Custom('signature_weapon')] em perfeita imitação das histórias, olhos fechados por reflexo.\n\nHá uma súbita força dura como pedra na minha [sc_victor.Custom('signature_weapon')], o som de carne úmida sendo cortada ao meio, e um espasmo passa pelo meu braço. Abro os olhos, quase certo de que verei minha própria ruína, apenas para me deparar com o toco de pescoço #EMP aniquilado#! [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip], jorrando sangue no ar com total abandono.\n\nQuando finalmente localizo a cabeça [sc_loser.GetHerHim], a luz já se foi há muito tempo dos [sc_loser.GetWomanMan]'s [sc_loser.Custom('EyeEyes')]."
 single_combat.0041.desc.sc_attacker.technique_from_legend.injury:0 "Então, de alguma forma, tudo simplesmente... funciona. Eu escovo de lado a guarda [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] com facilidade, tiro o [sc_loser.Custom('signature_weapon')] da mão [sc_loser.GetHerHim] e faço [sc_loser.GetSheHe] despencar no chão.\n\nAntes que eu perceba, estou me preparando para [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]. Surpreso, confuso e cada vez mais aterrorizado, é tudo o que [sc_loser.GetFirstNameNoTooltip] pode fazer para balbuciar uma rendição."
 single_combat.0041.desc.sc_attacker.technique_from_legend:0 "Eu comando meu corpo para corresponder à vívida imagem mental da lenda, mudando para uma postura desconfortável enquanto [sc_victor.Custom('SignatureWeaponFlourishPresentParticiple')] meu [sc_victor.Custom('signature_weapon')].\n\n"
 single_combat.0041.desc.sc_attacker.tire_opponent.fatality:0 "Leva um bom tempo até que uma brecha adequada se abra na guarda [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip], mas quando isso acontece, é tudo o que eu preciso. Com um único [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] da minha [sc_victor.Custom('signature_weapon')], eu rasgo através do ventre [sc_loser.GetHerHim] e chego ao seu estômago.\n\nSangue, bile e a última refeição do meu oponente jorram, banhando minha metade inferior, e [sc_loser.GetSheHe] solta um grito ensurdecedor.\n\nÉ, talvez, uma gentileza quando ponho fim ao sofrimento [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] mais cedo."
 single_combat.0041.desc.sc_attacker.tire_opponent.injury:0 "Para o crédito [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip], leva mais tempo do que eu imaginava, mas eventualmente a mera duração de nossa luta começa a deixar uma marca visível n[sc_loser.GetSheHe].\n\nEu deixo mais um tempo apenas para ter certeza, provocando meu oponente para continuar atacando com [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] ocasionais, e então tiro o [sc_loser.Custom('signature_weapon')] de sua mão com um único [sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\nEsgotado, [sc_loser.GetFirstNameNoTooltip] se rende e então cai [sc_loser.Custom('MaskFace')]-primeiro no [sc_defender.Custom('GroundType')]."
 single_combat.0041.desc.sc_attacker.tire_opponent:0 "Tomando meu tempo, mantendo a calma, misturando paradas implacáveis com esquivas irritantes, eu inexoravelmente corroo a energia do meu oponente.\n\n"
 single_combat.0041.desc.sc_attacker.unsure_attack.fatality:0 "Por mais que eu tente, não consigo apontar exatamente onde pegou [sc_loser.GetFirstNameNoTooltip], mas deve ter pego, porque [sc_loser.GetSheHe] recua do golpe. O sangue jorra de algum lugar no peito [sc_loser.GetHerHim], sangue que [sc_loser.GetSheHe] pausa para olhar com incredulidade.\n\nEu sei como isso termina, e recuso arriscar que meu oponente me leve para o túmulo com [sc_loser.GetSheHe]. [sc_victor.Custom('signature_weapon')|U] erguida, eu avanço para o golpe mortal."
 single_combat.0041.desc.sc_attacker.unsure_attack.injury:0 "Milagre dos milagres, o golpe realmente se conecta com [sc_loser.GetFirstNameNoTooltip] em um ângulo desajeitado, derrubando [sc_loser.GetSheHe]!\n\nQuando o [sc_loser.GetWomanMan] se levanta às pressas, eu já posicionei minha [sc_victor.Custom('signature_weapon')] para [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]. A rendição vem rapidamente."
 single_combat.0041.desc.sc_attacker.unsure_attack:0 "A melhor defesa é um ataque sólido, mas mesmo um ataque hesitante ajuda. Com isso em mente, eu tento um [sc_victor.Custom('SignatureWeaponAttemptedLight')] hesitante.\n\n"
 single_combat.0041.desc.sc_attacker.wait_and_hope.fatality:0 "ainda assim, passa direto pela guarda [Select_CString( sc_loser.IsFemale, 'da', 'do' )] [sc_loser.GetFirstNameNoTooltip] e [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonActiveGendered',SCOPE.sC('sc_loser'))].\n\nMeu inimigo recua desajeitadamente, puxando minha [sc_victor.Custom('signature_weapon')] com um som repugnante. O sangue jorra, depois inunda, da ferida, encharcando o chão ao redor [sc_loser.GetHerHim]. A boca do [sc_loser.GetWomanMan] treme e cai, espasmando como se estivesse tentando formar palavras através da dor.\n\n[sc_loser.GetFirstNameNoTooltip] parece tão atordoado quanto eu."
 single_combat.0041.desc.sc_attacker.wait_and_hope.injury:0 "ainda pega [sc_loser.GetFirstNameNoTooltip] nos nós dos dedos da mão segurando seu(a) [sc_loser.Custom('signature_weapon')]. Reflexivamente, os nós dos dedos se abrem, e a arma [sc_loser.GetHerHim] cai no chão.\n\n[sc_loser.GetFirstNameNoTooltip] e eu nos encaramos de olhos arregalados; claramente, [sc_loser.GetSheHe] está tão surpreso quanto eu com isso.\n\nParece uma eternidade antes de eu lembrar de exigir uma rendição."
 single_combat.0041.desc.sc_attacker.wait_and_hope:0 "Eu espero, pacientemente, esperando que um momento perfeito se apresente.\n\nQuando isso não acontece, eu tento positivamente #EMP morno#! [sc_victor.Custom('SignatureWeaponAttemptedLight')] que"
 single_combat.0041.desc.sc_attacker.wrath_of_highgod.fatality:0 "Antes que [sc_loser.GetFirstNameNoTooltip] tenha a chance de aproveitar meu momento piedoso, eu me lanço em um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], que [sc_loser.Custom('SignatureWeaponBreaksVerbPresentParticiple')] do(a) seu(a) [sc_loser.Custom('signature_weapon')].\n\nMeu adversário fica mudo diante dessa evidência da proteção de [sc_victor.GetFaith.WarGodName]. Isso dura apenas um segundo, mas é tudo o que preciso para [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]."
 single_combat.0041.desc.sc_attacker.wrath_of_highgod.injury:0 "Meu inimigo aparentemente acha que a oração vai ser mais longa do que é, porque [sc_loser.GetSheHe] fica totalmente surpreso quando eu mudo sem problemas para um [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] que quase faz [sc_loser.GetSheHe] cair no chão.\n\nEnquanto [sc_loser.GetFirstNameNoTooltip] se endireita [sc_loser.GetHerselfHimself], eu avanço, deslizando a [sc_victor.Custom('SignatureWeaponTipType')] da minha [sc_victor.Custom('signature_weapon')] até a poucos centímetros do seu(a) [sc_loser.Custom('MaskFace')].\n\nUma rendição nunca parece tão satisfatória quanto quando é dedicada a [sc_victor.GetFaith.HighGodName]."
 single_combat.0041.desc.sc_attacker.wrath_of_highgod:0 "Eu brado minha devoção a [sc_victor.GetFaith.HighGodName], [sc_victor.Custom('signature_weapon')] erguido como uma oferenda votiva."
 single_combat.0041.desc.sc_defender.attempt_disarm:0 "Eu esperava desconcertar meu oponente, mas minha tentativa de desarme foi muito melhor."
 single_combat.0041.desc.sc_defender.blade_dance:0 "Luto como a água flui: flexível, mas inevitável."
 single_combat.0041.desc.sc_defender.butchery:0 "Meus ataques impiedosos cobram um terrível tributo."
 single_combat.0041.desc.sc_defender.confident_attack:0 "A confiança empresta competência, como dizem, e meus golpes provam isso."
 single_combat.0041.desc.sc_defender.desert_warrior:0 "O calor parece cobrar um pesado tributo ao meu oponente."
 single_combat.0041.desc.sc_defender.enthusiastic_onslaught:0 "Meu [sc_victor.Custom('SignatureWeaponFlourishPresentParticiple')] fervoroso parece fazer o truque."
 single_combat.0041.desc.sc_defender.expert_onslaught:0 "Poucos [sc_loser.GetWomenMen] conseguem resistir ao meu bombardeio de [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')], e meu oponente não é exceção."
 single_combat.0041.desc.sc_defender.feint_and_stab:0 "Embora eles recuem no momento certo, meu golpe de punhal quase encerra isso."
 single_combat.0041.desc.sc_defender.forest_fighter:0 "A floresta diminui a velocidade do meu oponente de forma agradável."
 single_combat.0041.desc.sc_defender.guard:0 "Minha guarda se mantém firme, mantendo-me seguro do meu oponente."
 single_combat.0041.desc.sc_defender.hail_mary:0 "Evidentemente, meu ataque total foi exatamente o suficiente."
 single_combat.0041.desc.sc_defender.hard_grit:0 "A experiência conquistada com dificuldade rende dividendos quando usada com sabedoria, e eu a uso com sabedoria, de fato."
 single_combat.0041.desc.sc_defender.hurt_me_better:0 "A dor é a melhor aliada em uma luta, e ela está do meu lado #EMP."
 single_combat.0041.desc.sc_defender.is_that_a_crocodile:0 "Meu oponente mal consegue se livrar do atacante reptiliano [sc_loser.GetHerHim]."
 single_combat.0041.desc.sc_defender.jungle_stalker:0 "A selva frustra meu oponente repetidamente."
 single_combat.0041.desc.sc_defender.like_a_viper:0 "Avanço em direção ao coração do meu oponente, quase terminando isso com um golpe."
 single_combat.0041.desc.sc_defender.martial_voice:0 "Meu oponente está positivamente #EMP horrorizado#! com as obscenidades que grito."
 single_combat.0041.desc.sc_defender.mocking_boast:0 "Meu oponente range os dentes #EMP com força#! com meus comentários."
 single_combat.0041.desc.sc_defender.nut_em:0 "Dar uma cabeçada no meu oponente parece desestabilizá-lo."
 single_combat.0041.desc.sc_defender.onslaught:0 "Minha série de [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] se mostra eficaz."
 single_combat.0041.desc.sc_defender.open_terrain_expert:0 "A área em que lutamos me dá um controle fácil sobre o combate."
 single_combat.0041.desc.sc_defender.pocket_sand:0 "Atirar [sc_defender.Custom('GritType')] acaba sendo distração suficiente."
 single_combat.0041.desc.sc_defender.pocket_silver:0 "Uma boa dose de prata no [sc_loser.Custom('MaskFace')] parece fazer maravilhas."
 single_combat.0041.desc.sc_defender.probing_attack:0 "Meus ataques de sondagem abrem várias brechas."
 single_combat.0041.desc.sc_defender.put_the_boot_in:0 "Desferir um chute é baixo, mas funciona."
 single_combat.0041.desc.sc_defender.raaargh:0 "Poucos podem resistir ao meu berserkergang, e meu oponente não é exceção."
 single_combat.0041.desc.sc_defender.reason_you_suck_speech:0 "As penas do meu oponente parecem se eriçar mais com o meu discurso do que com minha [sc_victor.Custom('signature_weapon')]."
 single_combat.0041.desc.sc_defender.rough_terrain_expert:0 "Este terreno acidentado se mostra problemático para meu oponente lutar."
 single_combat.0041.desc.sc_defender.something_to_hide:0 "Meu oponente parece aterrorizado com minhas insinuações."
 single_combat.0041.desc.sc_defender.special_fallback:0 "Poucos oponentes esperam o chute tático na canela."
 single_combat.0041.desc.sc_defender.stoic_veteran:0 "A Guarda não quebra, não aqui, nunca."
 single_combat.0041.desc.sc_defender.strict_guard:0 "Nada quebrou minha guarda antes, e nada a quebra hoje."
 single_combat.0041.desc.sc_defender.surprise_attack:0 "Em combate, a surpresa muitas vezes prevalece, e isso se confirma aqui."
 single_combat.0041.desc.sc_defender.taunt:0 "Parece que minha provocação levou a melhor do meu oponente."
 single_combat.0041.desc.sc_defender.technique_from_legend:0 "Derrotar meu oponente é tão fácil quanto recontar uma história."
 single_combat.0041.desc.sc_defender.tire_opponent:0 "Fazer meu oponente se esgotar parece funcionar bem."
 single_combat.0041.desc.sc_defender.unsure_attack:0 "Meus ataques tímidos acabam sendo desnecessários."
 single_combat.0041.desc.sc_defender.wait_and_hope:0 "Aguardar meu oponente tomar a iniciativa acaba sendo surpreendentemente eficaz."
 single_combat.0041.desc.sc_defender.wrath_of_highgod:0 "Claramente [sc_victor.GetFaith.HighGodName] sorri para mim."
 single_combat.0041.t:0 "$single_combat.0000.t$ Vitória!"
