l_spanish:
 TRUCE_SIGNED_PARTITION:0 "\nPaz assinada como parte da partilha do reino"
 british_isles.0001.a:0 "Louvados sejam os ancestrais!"
 british_isles.0001.custom:0 "Todos os [counties|E] em Britannia"
 british_isles.0001.desc:0 "Por tempo demais esta grande ilha nossa esteve sob o domínio estrangeiro - finalmente está de volta às mãos celtas! Olho para os campos e é como se o sol brilhasse pela primeira vez em anos; é como se a terra da abundância e saúde, Tír na nÓg, tivesse retornado para nos saudar. As colinas e vales de nossos ancestrais são abraçados mais uma vez pela cultura [ROOT.Char.GetCulture]."
 british_isles.0001.t:0 "[reclaimer.GetCulture.GetNameNoTooltip|U] Britannia"
 british_isles.0002.a:0 "Um flagelo [reclaimer.GetCulture.GetNameNoTooltip] sobre as terras..."
 british_isles.0002.b:0 "Britannia é nossa mais uma vez!"
 british_isles.0002.desc:0 "O [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('reclaimer'))] [reclaimer.GetName] anunciou oficialmente o renascimento de uma Britannia Celta.\n\nApós séculos de domínio estrangeiro, as Ilhas voltaram ao controle de seus proprietários originais."
 british_isles.1001.a:0 "Uma nova era desponta!"
 british_isles.1001.desc:0 "O Danelaw renasce por meus esforços; este reino conhecerá novamente o domínio [restorer.GetCulture.GetName]!\n\nEstou seguindo os passos de lendas como Guðrum e Eric Bloodaxe, campeões do passado, e pelo [restorer.GetFaith.WarGodName], não permitirei que o reino caia nas mãos dos anglo-saxões novamente!"
 british_isles.1001.t:0 "As Leis Restauradas"
 british_isles.1002.a:0 "Um flagelo [restorer.GetCulture.GetNameNoTooltip] sobre a terra."
 british_isles.1002.b:0 "Uma vitória para os [restorer.GetCulture.GetNameNoTooltip]!"
 british_isles.1002.c:0 "Hm, [restorer.GetCulture.GetNameNoTooltip], você diz? Conte comigo!"
 british_isles.1002.desc:0 "O [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('restorer'))] [restorer.GetName] e seus saqueadores vis criaram um novo reino nas Ilhas e o proclamaram como o renascimento do Reino do Danelaw.\n\nResta saber se esta tentativa de restaurar o domínio [restorer.GetCulture.GetName] sobre a Inglaterra será mais bem-sucedida do que a última..."
 british_isles.1002.desc_same_culture:0 "O Danelaw renasce graças aos esforços de [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('restorer'))] [restorer.GetName]! Mais uma vez, a grande ilha está sob o domínio [restorer.GetCulture.GetName]."
 british_isles.1002.t:0 "O Danelaw"
 british_isles.1011.a.tt:0 ""
 british_isles.1011.a:0 "Hmm. Envie a carta."
 british_isles.1011.b.above_applies.tt:0 "#BOL Todos os efeitos do acordo acima se aplicam.#!"
 british_isles.1011.b.offer_faith.tt:0 "Você também oferece compartilhar sua [faith|E] e se tornar [friends|E]"
 british_isles.1011.b:0 "A carta, e uma mão aberta de amizade."
 british_isles.1011.brit:0 "A cada ano, as depredações nórdicas pioram. Eles enviam mais colonos, saqueiam ainda mais nossas costas e matam mais de nosso clero.\n\nApesar disso, unir-se contra a ameaça estrangeira é difícil. Entre os conquistadores nórdicos e o orgulho amargo dos senhores $anglo_saxon$, parece que nunca teremos uma [ntd_actor.Custom('QueenKing')] de $k_england$."
 british_isles.1011.c.tt:0 ""
 british_isles.1011.c:0 "A diplomacia é a saída dos covardes!"
 british_isles.1011.nord:0 "$k_england$ é uma terra difícil, mas fértil: os invernos são amenos e os verões úmidos, um lugar perfeito para colonos e guerreiros prosperarem.\n\nNo entanto, a competição de outros nórdicos e a resistência das polities nativas remanescentes se intensificam a cada ano. Todos nós estamos lutando por uma posição, cavando nossos próprios feudos e pequenos reinos [ntd_actor.Custom('QueenKing')], incapazes de alcançar uma verdadeira dominação."
 british_isles.1011.outro:0 "\n\n[Select_CString( ntd_recipient.IsFemale, 'Minha inimiga', 'Meu inimigo' )] [ntd_recipient.GetTitledFirstName] está à frente dos meus concorrentes pelo domínio da terra. Se [ntd_recipient.GetSheHe] concordar em #EMP partilhar#! o país, em vez de competir por ele, há poucos que possam contestar nosso poder combinado..."
 british_isles.1011.t:0 "Um Acordo Impensável"
 british_isles.1021.a.accepted.tt:0 "Você e [ntd_recipient.GetTitledFirstNameNoTooltip] dividem o Reino entre vocês"
 british_isles.1021.a.accepted:0 "O Acordo é Aceito"
 british_isles.1021.a:0 "Uma coroa que ninguém pode negar, você diz?"
 british_isles.1021.b.above_applies.tt:0 "$british_isles.1011.b.above_applies.tt$"
 british_isles.1021.b.accepted.critical.tt:0 "$british_isles.1021.a.accepted.tt$"
 british_isles.1021.b.accepted.critical:0 "O Acordo #EMP e#! a Amizade são Aceitos"
 british_isles.1021.b:0 "Talvez... talvez seja hora de uma mudança..."
 british_isles.1021.brit:0 "Meu inimigo me oferece reconhecimento como [ntd_recipient.Custom('QueenKing')] da $k_england$, se apenas eu concordar em apoiar o autogoverno nórdico e a posição igual a [ntd_actor.GetHerHim] em territórios onde [ntd_actor.GetSheHe] já possui terras."
 british_isles.1021.c.rejected.tt:0 "Todo o mundo sabe de sua perfídia"
 british_isles.1021.c.rejected:0 "O Acordo é Rejeitado"
 british_isles.1021.c:0 "Que absurdo! Deixe todo o mundo ver a sua covardia."
 british_isles.1021.intro:0 "[ntd_actor.GetTitledFirstName] é, talvez, minha maior concorrente pelo domínio da $k_england$.\n\nAssim, uma carta escrita à mão por com seu selo, oferecendo dividir o reino comigo, é uma das últimas coisas que eu esperava hoje.\n\n"
 british_isles.1021.invalidation.t:0 "Seu Acordo foi Invalidado"
 british_isles.1021.invalidation.tt:0 "Ele pode ser proposto novamente através da interface Decisions"
 british_isles.1021.nord:0 "Meu inimigo me oferece reconhecimento e apoio para o autogoverno nórdico, e um reino meu, igual em seu nível. Terras onde eu ou aqueles da minha espécie governamos ficariam sob #EMP minha#! jurisdição."
 british_isles.1021.outro:0 "\n\nDevo admitir que a ideia de uma coroa real sobre minha cabeça é... intrigante."
 british_isles.1021.t:0 "$british_isles.1011.t$"
 british_isles.1022.a.tt:0 "$k_england$ e $k_danelaw_article$$k_danelaw$ serão [de_jure_partitioned|E]"
 british_isles.1022.a:0 "Que traição descarada [Select_CString( dummy_gender.IsFemale, 'as suas', 'aos seus' )] compatriotas é essa?"
 british_isles.1022.desc:0 "Em uma tentativa de solidificar seu próprio poder pessoal, parece que [ntd_actor.GetTitledFirstName] e [ntd_recipient.GetTitledFirstName] assinaram um tratado diabólico, dividindo o reino de $k_england$ entre eles!\n\nDaqui para frente, áreas atualmente sob controle nórdico estarão sujeitas ao $k_danelaw_article$$k_danelaw$, enquanto os demais estados nativos são reconhecidos como território $k_england_adj$."
 british_isles.1022.t:0 "$british_isles.1011.t$"
 british_isles.1051.a.tt:0 "A [de_jure_partition|E] entre $k_england$ e $k_danelaw_article$$k_danelaw$ é encerrada"
 british_isles.1051.a:0 "Um reino, um[Select_CString( victor.IsFemale, 'a', '' )] [victor.GetTitleAsNameNoTooltip]!"
 british_isles.1051.desc:0 "Finalmente, ninguém pode contestar meu domínio como [Select_CString( victor.IsFemale, 'a verdadeira', 'o verdadeiro' )] [victor.GetTitleAsNameNoTooltip] de [england.GetNameNoTierNoTooltip]. Com o estado pretendente lidado, minha hegemonia final sobre toda a Britânia está praticamente assegurada."
 british_isles.1051.t:0 "Um [partition_winner.GetTierAsNameNoTooltip] Unificado"
 british_isles.1052.a.tt:0 "$british_isles.1051.a.tt$"
 british_isles.1052.a:0 " #EMP Haverá#! um acerto de contas por esta afronta."
 british_isles.1052.desc:0 "[loser.GetFaith.FateGodName|U] me pregou uma peça cruel hoje, concedendo uma vitória decisiva [Select_CString( victor.IsFemale, 'a', 'ao' )] [victor.GetTitledFirstName] na batalha pela $k_england$.\n\nEmbora eu não possa mais reivindicar governar as terras que um dia foram minhas, essa questão não está resolvida enquanto minha linhagem ainda respirar."
 british_isles.1052.t:0 "$british_isles.1051.t$"
 british_isles.1053.a.tt:0 "$british_isles.1051.a.tt$"
 british_isles.1053.a:0 "Estabilidade para $k_england$ afinal?"
 british_isles.1053.desc:0 "Acontecimentos recentes deixaram [victor.GetTitledFirstName] como [Select_CString( victor.IsFemale, 'a única', 'o único' )] concorrente séri[Select_CString( victor.IsFemale, 'a', 'o' )] ao trono $k_england_adj$. Embora nem todos se curvem voluntariamente ao monarca exultante, pelo menos pode-se dizer que $k_england$ está, em espírito, unificado novamente."
 british_isles.1053.t:0 "$british_isles.1051.t$"
 british_isles.1061.a:0 "Vamos escrevê-la juntos."
 british_isles.1061.desc:0 "Já se passaram muitos anos desde que os escandinavos chegaram a estas terras férteis. Muitos anos de derramamento de sangue, violência e conflitos, mas também de trocas, desenvolvimento e fusão.\n\nOs descendentes desses colonizadores iniciais já não são verdadeiramente nórdicos, assim como os habitantes locais não são mais os mesmos $anglo_saxon_collective_noun$ que eram quando os escandinavos chegaram.\n\nQuem somos agora é, talvez, difícil de dizer.\n\nExceto que somos todos aqueles que vieram antes de nós, bons e maus, e que nossa história será $k_daneland_adj$ daqui para frente."
 british_isles.1061.t:0 "Lei da Terra"
 british_isles.1062.a:0 "Sua terra já foi $k_england_adj$, e #EMP será#! $k_england_adj$ novamente."
 british_isles.1062.desc:0 "Aquel[Select_CString( founder.IsFemale, 'a', 'e' )] infame! [Select_CString( founder.IsFemale, 'Aquela vilã', 'Aquele vilão' )]! Aquel[Select_CString( founder.IsFemale, 'a', 'e' )] [founder.Custom('InsultAdjective')], [founder.Custom('InsultNoun')] #EMP [founder.Custom('InsultAdjective')]!#!\n\nEmbora os reinos da $k_england$ e $k_danelaw_article$$k_danelaw$ tenham sido divididos por tempo demais, #EMP todos#! sabiam que, um dia, eles seriam reunidos.\n\nAté hoje.\n\nNuma grande e pomposa declaração, [founder.GetTitledFirstName] renunciou formalmente a qualquer pretensão de controle sobre $k_england$, e, por consequência, eliminou qualquer esperança de reunificar facilmente meu reino com as terras de $k_danelaw_article$$k_danelaw$!"
 british_isles.1062.t:0 "$british_isles.1061.t$"
 british_isles.1063.a.tt:0 "$british_isles.1051.a.tt$"
 british_isles.1063.a:0 "Talvez isso acalme alguns ânimos..."
 british_isles.1063.desc:0 "Há anos, $k_england$ tem sido dividida entre as terras d[Select_CString( england.IsFemale, 'a', 'o' )] [england.GetTitledFirstName] e [founder.GetTitledFirstName]. Embora ambos sejam nominalmente iguais em posição, o entendimento tácito sempre foi que cada reino deseja eliminar o outro e elevar seu monarca como o único governante de um $k_england$ unificado.\n\nIsso não é mais válido.\n\nDe maneira dramática, [founder.GetTitledFirstNameNoTooltip] anunciou que [founder.GetSheHe] está abdicando de qualquer pretensão de domínio sobre o restante do reino, e que [founder.GetSheHe] governará daqui em diante um reino independente e soberano."
 british_isles.1063.t:0 "$british_isles.1061.t$"
 british_isles.2001.a:0 "Viva a Inglaterra!"
 british_isles.2001.desc:0 "O tempo em que nós, [embracer.GetCulture.GetCollectiveNounNoTooltip], considerávamos a França nossa terra natal já passou. Nossos filhos nascem aqui, cercados pelos saxões, e para eles, a Normandia será sempre uma linha borrada além das costas nebulosas de Britannia.\n\nE, à medida que adotamos alguns costumes locais como nossos, o legado de nossa cultura se espalha pelas terras saxãs, dando origem a uma nova identidade inglesa."
 british_isles.2001.t:0 "Nada de [embracer_former_culture.GetNameNoTooltip|U]"
 british_isles.2002.a:0 "Era apenas questão de tempo."
 british_isles.2002.b:0 "Traidores!"
 british_isles.2002.desc:0 "O [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('embracer'))] [embracer.GetName], seus vassalos e toda a sua família responderam ao chamado de Albion e abraçaram a cultura inglesa."
 british_isles.3001.a:0 "Prepare nossa frota!"
 british_isles.3001.desc:0 "Seu desejo de estender o domínio sagrado da Igreja Universal às tribos bárbaras da Irlanda é uma causa piedosa e justa. Como tal, a Santa Igreja Romana ordena que você tome posse desta ilha e execute a Vontade de Deus lá. \n\nSe por algum infortúnio você partir antes do fim desta campanha sagrada, estendemos este mandato sagrado aos seus sucessores legítimos. Que a Casa [scoped_ruler.GetHouse.GetBaseNameNoTooltip] leve esta santa empreitada perpetuamente, até que a vontade divina se realize e a Irlanda esteja unida sob o domínio [scoped_ruler.GetCulture.GetNameNoTooltip]."
 british_isles.3001.t:0 "Declarar Laudavelmente,"
 british_isles.3002.a:0 "Veremos sobre isso!"
 british_isles.3002.b:0 "Entendo..."
 british_isles.3002.desc.irish:0 "Por Graça de Sua Santidade, Vigário de Cristo e herdeiro do trono de São Pedro, [scoped_ruler.GetFullName] recebeu o direito de governar divinamente a Eire e todas as tribos lá presentes.\n\nQualquer senhor irlandês que desobedecer a ordem papal e se recusar a se submeter enfrentará a ira de [scoped_ruler.GetTitledFirstName], os exércitos [scoped_ruler.GetCulture.GetName] e o Deus Todo-Poderoso."
 british_isles.3002.t:0 "A Reivindicação da Irlanda"
 british_isles.4001.a:0 "Sou como Corineus renascido!"
 british_isles.4001.b:0 "Meu reino é o único título que importa."
 british_isles.4001.desc:0 "[founder.GetPrimaryTitle.GetNameNoTierNoTooltip] não aceita invasores, de nenhum tipo. Por séculos, lutamos contra eles, batalhando para reconquistar nosso lar. Com grande astúcia e habilidade, finalmente consegui retomar as terras da antiga Dumnonia, refundando o Reino do [founder.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nA ameaça estrangeira foi resistida, o desaparecimento da antiga Britannia superado, e agora estou pronto para enfrentar quaisquer desafios que [founder.GetFaith.DevilName] possa nos lançar. Venha o que vier, [founder.GetPrimaryTitle.GetNameNoTierNoTooltip] prevalecerá."
 british_isles.4001.t:0 "[founder.GetPrimaryTitle.GetAdjectiveNoTooltip] Reino Restaurado"
 british_isles.4002.a:0 "Onen hag oll!"
 british_isles.4002.b:0 "Vamos empurrá-los de volta até o Fim da Terra."
 british_isles.4002.c:0 "Pequenos reinos vêm e vão."
 british_isles.4002.desc:0 "Após séculos de luta, [founder.GetFullName] restaurou o antigo reino de Dumnonia, chamado do [founder.GetPrimaryTitle.GetNameNoTier] por seus habitantes, e repeliu os invasores estrangeiros de sua ilha.\n\nEmbora os outros senhores das Ilhas Britânicas não estejam dispostos a permitir que esse poder recém-surgido invada o que consideram suas terras ancestrais, o povo [founder.GetPrimaryTitle.GetAdjective] já enfrentou invasões piores do que qualquer coisa que esta era moderna possa reunir. Já se preparam para resistir à inevitável retaliação sombria..."
 formalise_the_daneland_effect.adjust_de_jures.tt:0 "Todas as partes [de_jure|E] de $k_danelaw_article$$k_danelaw$ são [Concept('de_jure_drift_drifted', 'Transferidos')|E] para $k_daneland$"
 formalise_the_daneland_effect.all_claimants:0 "Todos os Reivindicantes"
 formalise_the_daneland_effect.partition_status.tt:0 "$k_england$ e $k_danelaw_article$$k_danelaw$ não são mais considerados [de_jure_partitioned|E]"
 negotiate_the_danelaw_accept_effect.de_jure_holdings_recognised.tt:0 "Todos os [duchies|E] $k_england_adj$ que [ntd_nord.GetTitledFirstName] possui pelo menos um [county|E] se tornam parte [de_jure|E] de $k_danelaw_article$$k_danelaw$"
 negotiate_the_danelaw_accept_effect.independent_holdings_recognised.tt:0 "Todos os [duchies|E] $k_england_adj$ independentes com um governante de [culture|E] $north_germanic_group$ ou [faith|E] $germanic_religion$ se tornam parte [de_jure|E] de $k_danelaw_article$$k_danelaw$"
 negotiate_the_danelaw_accept_effect.partition_active.tt:0 "$k_england$ e $k_danelaw_article$$k_danelaw$ estão sendo [de_jure_partitioned|E]"
 negotiate_the_danelaw_accept_effect.riled_independents_list:0 "Todos os governantes independentes dentro da $k_england$"
 negotiate_the_danelaw_each-way_effect.rejected:0 "Se o acordo for rejeitado"
 negotiate_the_danelaw_each_way_effect.accepted:0 "Se o acordo for aceito"
 resolve_danelaw_partition_effect.adjust_de_jures.tt:0 "Todas as partes [de_jure|E] de $k_danelaw_article$$k_danelaw$ são [Concept('de_jure_drift_drifted', 'Transferidos')|E] para $k_england$"
 resolve_danelaw_partition_effect.all_claimants:0 "Todos os Reivindicantes"
 resolve_danelaw_partition_effect.coa_changed.tt:0 "$k_england$ usará o Brasão de Armas de $k_danelaw_article$$k_danelaw$"
