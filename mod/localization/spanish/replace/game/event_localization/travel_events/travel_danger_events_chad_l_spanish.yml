l_spanish:
 entourage_member_one_leaves.tt:0 "[entourage_member_one.GetFirstNameNoTooltip] deixa o seu séquito"
 entourage_member_two_leaves.tt:0 "[entourage_member_two.GetFirstNameNoTooltip] deixa o seu séquito"
 travel_danger_events.5000.a.failure:0 "[entourage_member_one.GetFirstNameNoTooltip] e [entourage_member_two.GetFirstNameNoTooltip] não conseguem resolver suas diferenças"
 travel_danger_events.5000.a.success:0 "Você convence [entourage_member_one.GetFirstNameNoTooltip] e [entourage_member_two.GetFirstNameNoTooltip] a resolverem suas diferenças"
 travel_danger_events.5000.a:0 "Vamos lá, com certeza vocês dois podem se entender."
 travel_danger_events.5000.b:0 "Não temos tempo para as suas brigas mesquinhas!"
 travel_danger_events.5000.brave:0 "\"Anime-se, seu chorãozinho [entourage_member_two.Custom2('InsultNoun', SCOPE.sC('entourage_member_one'))], e #EMP enfrente-me#!! Mostre o seu valor! Um covarde como você não tem o direito de estar nessa jornada!\" [entourage_member_one.GetFirstNameNoTooltip] cospe no chão.\n\n[entourage_member_two.GetFirstNameNoTooltip] apenas se encolhe de medo, chorando silenciosamente para [entourage_member_two.GetHerselfHimself]."
 travel_danger_events.5000.c.failure:0 "[entourage_member_two.GetFirstNameNoTooltip] vence"
 travel_danger_events.5000.c.success:0 "[entourage_member_one.GetFirstNameNoTooltip] vence"
 travel_danger_events.5000.c:0 "Só há uma maneira de resolver isso."
 travel_danger_events.5000.chaste:0 "\"Você vai parar de tagarelar sobre suas... #EMP empreitadas#! luxuriosas, s[Select_CString( entourage_member_two.IsFemale, 'ua', 'eu' )] [entourage_member_two.Custom2('InsultNounSexual', SCOPE.sC('entourage_member_one'))]! Não quero ouvir mais nada disso!\" [entourage_member_one.GetFirstNameNoTooltip] cobre o rosto de vergonha.\n\n\"Vai catar coquinho, [entourage_member_one.GetFirstNameNoTooltip]! Não vou ter vergonha das minhas necessidades...\" responde [entourage_member_two.GetFirstNameNoTooltip], indignado."
 travel_danger_events.5000.craven:0 "\"Por que você me atormenta, [entourage_member_two.GetFirstNameNoTooltip]? Odeio ser surpreendido por trás, especialmente enquanto viajamos por essas [location.Custom('GetTerrainLandPlural')]!\"\n\n\"Ah, vamos lá, foi só uma brincadeira! Ganhe um pouco de coragem — pelo bem de todos nós..."
 travel_danger_events.5000.fallback:0 "\"Não quero mais ouvir sua idiotice, s[Select_CString( entourage_member_one.IsFemale, 'ua', 'eu' )] [entourage_member_two.Custom2('InsultNoun', SCOPE.sC('entourage_member_one'))] [entourage_member_two.Custom2('InsultAdjective', SCOPE.sC('entourage_member_one'))]!\" [entourage_member_one.GetFirstNameNoTooltip] bate o pé no [location.Custom('GetProvinceGroundDesc')].\n\n\"Você é quem tem choramingado durante toda essa jornada! Berrando '#EMP Já chegamos?#!' a cada encruzilhada!\" [entourage_member_two.GetFirstNameNoTooltip] retruca."
 travel_danger_events.5000.generous:0 "\"Pela última vez, [entourage_member_two.GetFirstNameNoTooltip], não tenho mais nada para oferecer! Como ousa pedir mais ouro depois de eu ter deixado você me esvaziar completamente!\" [entourage_member_one.GetFirstNameNoTooltip] grita com raiva.\n\n\"Mas eu preciso de mais! Não seja tão mesquinho, [entourage_member_one.GetFirstNameNoTooltip]!\""
 travel_danger_events.5000.gregarious:0 "\"Vamos lá, [entourage_member_two.GetFirstNameNoTooltip], estou só tentando passar o tempo. Não deveríamos nos conhecer um pouco mais?\" [entourage_member_one.GetFirstNameNoTooltip] exclama, com uma expressão sombria no rosto [entourage_member_one.GetHerHim].\n\n[entourage_member_two.GetFirstNameNoTooltip] treme de desconforto, aparentemente pronto para correr de volta para [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]."
 travel_danger_events.5000.impatient:0 "[entourage_member_one.GetFirstNameNoTooltip] está reclamando alto. \"Será que vamos #EMP algum dia#! chegar a [next_destination.GetName]? Não consigo dar mais um passo sequer!\"\n\n\"Chegaremos quando chegarmos! Sua reclamação ingrata só traz um mau humor para o resto do séquito. Se dependesse de mim, já teríamos deixado você em [random_visited_province.GetNameNoTooltip]!"
 travel_danger_events.5000.intro.land:0 "Enquanto atravessamos [location.GetName], nossa caravana parou em uma clareira cercada por [location.Custom('GetProvinceFoliageDesc')]. Avanço em direção à comoção, apenas para encontrar [entourage_member_one.GetFirstName] e [entourage_member_two.GetFirstName] em uma discussão irritada.\n\n"
 travel_danger_events.5000.intro.sea:0 "Ouvindo vários sons abafados e gritos de raiva vindo de fora, saio às pressas do convés apenas para encontrar [entourage_member_one.GetFirstName] e [entourage_member_two.GetFirstName] em uma discussão tensa.\n\n"
 travel_danger_events.5000.just:0 "\"Como você se atreve a me derrubar do cavalo, [entourage_member_one.GetFirstNameNoTooltip]! S[Select_CString( entourage_member_one.IsFemale, 'ua', 'eu' )] [entourage_member_one.Custom2('InsultNoun', SCOPE.sC('entourage_member_two'))] [entourage_member_one.Custom2('InsultAdjective', SCOPE.sC('entourage_member_two'))]!\" [entourage_member_two.GetFirstNameNoTooltip] exclama, prostrado no [location.Custom('GetProvinceGroundDesc')].\n\n\"Não posso ser responsável por sua completa falta de habilidade,\" [entourage_member_one.GetFirstNameNoTooltip] responde com um sorriso convencido."
 travel_danger_events.5000.paranoid:0 "\"Você foi enviado aqui para me eliminar! Não minta para mim, s[Select_CString( entourage_member_one.IsFemale, 'ua', 'eu' )] agente de subterfúgio [entourage_member_two.Custom2('InsultAdjective', SCOPE.sC('entourage_member_one'))]!\" [entourage_member_one.GetFirstNameNoTooltip] grita em um estado de pânico total.\n\n\"Se acalme, [entourage_member_one.GetFirstNameNoTooltip]! Sou apenas eu! Como você pode pensar uma coisa dessas?\" [entourage_member_two.GetFirstNameNoTooltip] responde na tentativa de acalmar [Select_CString( entourage_member_one.IsFemale, 'a', 'o' )] [entourage_member_one.GetWomanMan]."
 travel_danger_events.5000.patient:0 "\"...e foi assim que consegui sair de uma situação tão desesperadora quando visitei [location.GetNameNoTooltip] antes. Isso na verdade me lembra de outra história...\"\n\n\"#EMP Não diga mais uma palavra, [entourage_member_one.GetFirstNameNoTooltip]!#!\" [entourage_member_two.GetFirstNameNoTooltip] interrompe."
 travel_danger_events.5000.shy:0 "[entourage_member_one.GetFirstNameNoTooltip], perturbado, se vira para mim e explica, \"[entourage_member_two.GetFirstNameNoTooltip] não me deixa em paz! Diga a ess[Select_CString( entourage_member_one.IsFemale, 'a', 'e' )] [entourage_member_one.Custom2('InsultNoun', SCOPE.sC('entourage_member_two'))] [entourage_member_one.Custom2('InsultAdjective', SCOPE.sC('entourage_member_two'))] que eu preciso de paz!\"\n\n\"Eu estava só fazendo uma brincadeira sobre o pequeno [entourage_member_one.Custom('PointOfRidicule')] d[Select_CString( entourage_member_one.IsFemale, 'a', 'o' )] [entourage_member_one.GetFirstNamePossessiveNoTooltip], juro!\""
 travel_danger_events.5000.stubborn:0 "\"Eu juro que estamos indo na direção errada! Não darei mais um único passo até resolvermos isso!\" [entourage_member_one.GetFirstNameNoTooltip] grita.\n\n\"#EMP Teimoso velho teimoso!#! Você não vê que todo esse séquito está exausto por sua causa e por sua [entourage_member_one.Custom2('PointOfRidicule', ROOT.Char)]?\""
 travel_danger_events.5000.t:0 "$travel_danger_prefix$ Um Grupo Briguento"
 travel_danger_events.5000.temperate:0 "\"Seu pecador, glutão! Você não consegue pensar em nada além de comida por uma única hora!\"\n\n \"Mas estou #EMP tãoooo#! com fome! Só consigo pensar em todas as [entourage_member_two.Custom('GetExpensiveDessert')] que deixamos para trás em [ROOT.Char.GetCapitalLocation.GetNameNoTooltip],\" lamenta [entourage_member_two.GetFirstNameNoTooltip], uma corrente de saliva escorrendo lentamente de sua boca."
 travel_danger_events.5000.zealous:0 "[entourage_member_one.GetFirstNameNoTooltip] parece estar exaltando as virtudes do [entourage_member_one.GetFaith.GetNameNoTooltip]. \"...mas você falha em entender a importância de [entourage_member_one.GetFaith.HighGodName] para se ter uma boa vida. É fundamental que — \"\n\n\"#EMP Não isso de novo!#!\" [entourage_member_two.GetFirstNameNoTooltip] revira os olhos. \"[entourage_member_two.GetFaith.HighGodName], se você está ouvindo, me salve dess[Select_CString( entourage_member_one.IsFemale, 'a', 'e' )] [entourage_member_one.Custom2('InsultNoun', SCOPE.sC('entourage_member_two'))], eu imploro!\""
 travel_danger_events.5010.a:0 "Não se preocupe, vamos encontrar acomodação em outro lugar."
 travel_danger_events.5010.a_again:0 "#EMP De novo?#! Maldito seja ess[Select_CString( angry_char.IsFemale, 'a', 'e' )] [angry_char.Custom2('InsultNoun', ROOT.Char)]!"
 travel_danger_events.5010.a_seriously:0 "[angry_char.GetFirstNameNoTooltip] vai se arrepender..."
 travel_danger_events.5010.b.failure:0 "Estalajadeiro se defende"
 travel_danger_events.5010.b.flavor:0 "Você tenta entrar à força na estalagem com violência"
 travel_danger_events.5010.b.success:0 "Estalajadeiro é dominado"
 travel_danger_events.5010.b:0 "Ninguém nega [Select_CString( ROOT.Char.IsFemale, 'a', 'ao' )] [ROOT.Char.GetTitledFirstNameNoTooltip] seu descanso."
 travel_danger_events.5010.b_seriously:0 "#EMP ME. DEIXEM. ENTRAR!#!"
 travel_danger_events.5010.c.failure:0 "Estalajadeiro não se convence"
 travel_danger_events.5010.c.flavor:0 "Você tenta convencer o estalajadeiro a permitir que você e o seu séquito fiquem"
 travel_danger_events.5010.c.success:0 "Estalajadeiro é convencido"
 travel_danger_events.5010.c:0 "Vou falar com o estalajadeiro."
 travel_danger_events.5010.desc.again:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], mais uma vez, o proprietário desta pousada diz que está #EMP absolutamente lotado!#! Parece que [angry_char.GetName] espalhou a notícia da nossa chegada por estas bandas.\""
 travel_danger_events.5010.desc.intro:0 "Após vários dias de viagem cansativa, paramos em uma estalagem aqui em [location.GetName] em busca de acomodação para a noite. Envio m[Select_CString( travel_leader.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', travel_leader )] [travel_leader.GetName] para perguntar sobre possíveis quartos. A expressão sombria no rosto [travel_leader.GetHerHim] quando ele retorna para o séquito não é um bom sinal, no entanto.\n\n"
 travel_danger_events.5010.desc.seriously:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], como você pode ter adivinhado...\"\n\n[travel_leader.GetSheHe|U] simplesmente abaixa a cabeça em desespero. Aquel[Select_CString( angry_char.IsFemale, 'a', 'e' )] [angry_char.Custom2('InsultNoun', ROOT.Char)] [angry_char.Custom2('InsultAdjective', ROOT.Char)], [angry_char.GetTitledFirstName], está determinado a transformar esta jornada em um verdadeiro inferno para mim!"
 travel_danger_events.5010.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], o proprietário da pousada diz que está cheio até a borda, embora houvesse poucos clientes na sala comum. Suspeito que ele tenha recusado porque estas terras pertencem a [angry_char.GetName]...\""
 travel_danger_events.5010.t:0 "$travel_danger_prefix$ Sem Vagas"
