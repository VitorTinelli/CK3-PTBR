 YATRA_GLOSS:0 "Sânscrito para 'jornada, procissão'. Membros de tal peregrinação são chamados Yatri."
 due_to_activity_options_tt:0 "Devido às suas [activity_options|E]:"
 playdate_blocked_tt:0 "Todos os seus filhos ou pupilos convidados para [host.GetInvolvedActivity.GetName]"
 playdate_depart_tt:0 "[THIS.Char.GetTitledFirstName] parte para [host.GetInvolvedActivity.GetName]"
 playdate_forbidden_single_tt:0 "[carer.GetTitledFirstName] proibiu [child_1.GetFirstName] de participar do seu $activity_playdate$"
