 playdate_forbidden_tt:0 "[carer.GetTitledFirstName] proibiu [child_1.GetFirstName] e outros de participar do seu $activity_playdate$"
 tgp_wrong_examination_gender_female_modifier:0 "Participação Repudiada"
 tgp_wrong_examination_gender_female_modifier_desc:0 "Este personagem decidiu participar de um Exame, apesar de seu gênero."
 tgp_wrong_examination_gender_male_modifier:0 "$tgp_wrong_examination_gender_female_modifier$"
 tgp_wrong_examination_gender_male_modifier_desc:0 "$tgp_wrong_examination_gender_female_modifier_desc$"
 travel_destination_activity:0 "Você está indo para [location.GetName], para [host.GetInvolvedActivity.GetName]"
 travel_destination_location:0 "Você está indo para [location.GetName]"
 travel_start_event.1000.a:0 "Mal posso esperar!"
 travel_start_event.1000.a_craven:0 "Espero que dê certo..."
 travel_start_event.1000.a_cynical:0 "Suponho que devemos..."
 travel_start_event.1000.a_hajj:0 "Esperei por isso a minha vida toda."
 travel_start_event.1000.a_hajj_revisit:0 "Mal posso esperar para ver as muralhas brilhantes novamente."
 travel_start_event.1000.desc:0 "Tudo empacotado e em ordem, finalmente chegamos ao ponto em que podemos iniciar nossa jornada de [ROOT.Char.GetCurrentLocation.GetName] para o próximo destino em [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName].\n\nConforme partimos da propriedade e nossas montarias começam a pisar em terreno novo, tenho certeza de que voltaremos em breve e inteiros."
 travel_start_event.1000.desc_migrating:0 "Todo o acampamento soa como uma cachoeira estrondosa: crianças correndo, animais protestando e grunhindo, adultos terminando de empacotar.\n\nDezenas e dezenas de memórias organizadas de forma desleixada em feixes e cargas.\n\nDou uma última olhada em [ROOT.Char.GetCurrentLocation.GetName] enquanto dou um leve toque na lateral do meu cavalo. Só posso torcer para que [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] nos receba tão bem quanto este lugar nos recebeu."
 travel_start_event.1000.desc_sick:0 "Eu estou bem ciente de que sair na estrada na minha condição, doente, é considerar um risco adicional além do perigo regular que vem com a viagem. No entanto, mesmo no meu estado desfavorável, o show deve continuar.\n\nVamos partir em direção a [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] e que [ROOT.Char.GetFaith.HighGodName] cuide de nossas viagens."
 travel_start_event.1000.intro_activity:0 "M[Select_CString( host.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))] [host.GetTitledFirstName] está organizando um [ROOT.Char.GetInvolvedActivity.GetShortName] em [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] e chegou a hora de partirmos."
 travel_start_event.1000.intro_my_activity:0 "Eu estarei organizando um [ROOT.Char.GetInvolvedActivity.GetShortName] em [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] e chegou a hora de partirmos."
 travel_start_event.1000.t:0 "Um Novo Começo"
 travel_start_event.1000.t_migrating:0 "Rumo a Pastos Mais Verdes"
 travel_start_event.1000.t_murder:0 "Um Começo Macabro"
 travel_start_event.1000.t_sick:0 "Um Começo Tentativo"
 travel_start_event.1000.take_test:0 "Preciso provar meu mérito nos exames."
 travel_start_event.1000.take_test_tt:0 "Como [governors|E] [landed|E] não podem fazer exames, você precisa se aposentar para desbloquear novos [merit_levels|E]."
 travel_start_event.1010.desc_my_tournament:0 "Com rostos frescos e atentos, os membros do meu séquito estão ansiosos para seguir para a competição de [ROOT.Char.GetInvolvedActivity.GetShortName] que estou organizando em [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName]."
 travel_start_event.1010.desc_my_tournament_outro:0 "Nós iremos lá e seremos vitoriosos.\n\nMostrar nossa riqueza e prestígio a todos os meus estimados convidados não é um benefício tão terrível assim."
 travel_start_event.1010.desc_my_tournament_outro_shy:0 "Isso deve ser um evento bem-sucedido e também próspero para o condado.\n\nEsperançosamente, todos terão um bom tempo e apreciarão o esforço do evento."
 travel_start_event.1010.desc_sick_my_tournament:0 "Incerto quanto ao tempo que me resta, é importante para mim finalmente participar da competição de [ROOT.Char.GetInvolvedActivity.GetShortName] que levei tanto tempo organizando. Olhando para trás, desejo ter planejado na minha capital em vez de hospedar em [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName]\n\nEmbora perceba que minha saúde debilitada será um risco se eu escolher competir, certamente terei muitos [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] capazes de lutar em meu lugar."
 travel_start_event.1010.desc_sick_tournament:0 "\n\nEmbora meu corpo debilitado afete minha saúde, eu me condenaria se não participasse deste — o que promete ser — um evento espetacular, que será falado por anos."
 travel_start_event.1010.desc_tournament:0 "\n\nNós representaremos a casa de [ROOT.Char.GetHouse.GetName] e faremos o povo [ROOT.Char.GetCulture.GetNameNoTooltip] se orgulhar."
 travel_start_event.1010.desc_tournament_intro:0 "M[Select_CString( host.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))] [ROOT.Char.GetInvolvedActivity.GetHost.GetTitledFirstName] está organizando uma competição de [ROOT.Char.GetInvolvedActivity.GetShortName] nas proximidades de [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] e chegou a hora de partirmos."
 travel_start_event.1010.desc_tournament_outro_negative:0 "\n\nEsperançosamente, o restante de [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] não será tão podre quanto [host.GetTitledFirstNameNoTooltip], mas ainda devemos estar atentos ao que acontece quando estivermos na toca do leão."
 travel_start_event.1010.desc_tournament_outro_positive:0 "\n\nEstando longe de casa, também devemos aproveitar a oportunidade para expandir nossos horizontes e desfrutar de qualquer hospitalidade."
 travel_start_event.1010.desc_tournament_outro_positive_culture:0 "\n\nEnquanto estivermos lá, também devemos aproveitar a oportunidade para experimentar a cultura de [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetCulture.GetNameNoTooltip]."
 travel_start_event.1010.t_sick_tournament:0 "$activity_tournament$: $travel_start_event.1000.t_sick$"
 travel_start_event.1010.t_tournament:0 "$activity_tournament$: $travel_start_event.1000.t$"
 travel_start_event.1010.tt.tournament.every_knight:0 "Como você está participando de um [GetActivityType( 'activity_tournament' ).GetName], cada [knight|E] [unlanded|E] disponível que você tem irá acompanhá-lo para competir"
 travel_start_event.1020.desc_sick_tour:0 "Será interessante conhecer as pessoas.\n\nApesar de estar com a saúde debilitada, tenho certeza de que este [ROOT.Char.GetInvolvedActivity.GetShortNameNoTooltip] será falado por anos."
 travel_start_event.1020.desc_tour_dread:0 "Estou ansioso para incutir medo em meus patéticos súditos, um domínio de cada vez.\n\nVou garantir que os súditos do [ROOT.Char.GetPrimaryTitle.GetNamePossessiveNoTooltip] nunca esqueçam deste [ROOT.Char.GetInvolvedActivity.GetShortNameNoTooltip], de fato..."
 travel_start_event.1020.desc_tour_intro:0 "Chegou a hora de partir para a minha [ROOT.Char.GetInvolvedActivity.GetShortName] de [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]. Minha corte está empacotada, pronta e ansiosa para ir.\n\nNosso primeiro destino será [Select_CString( next_stop_liege.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('next_stop_liege'))] [next_stop_liege.GetTitledFirstNamePossessive], [next_stop_liege.Custom('FortifiedBuilding')], localizado em [next_stop_liege.GetCapitalLocation.GetName];"
 travel_start_event.1020.desc_tour_majesty:0 "Estou ansioso para visitar [next_stop_liege.GetSheHe] e ver meu reino, um domínio de cada vez.\n\nTenho certeza de que os súditos do [ROOT.Char.GetPrimaryTitle.GetNamePossessiveNoTooltip] falarão de minha benevolência por muito tempo."
 travel_start_event.1020.desc_tour_tax:0 "Estou ansioso para ajudar as pessoas a contribuírem para a riqueza da nação, de todas as formas possíveis.\n\nOs súditos do [ROOT.Char.GetPrimaryTitle.GetNamePossessiveNoTooltip] certamente não devem esconder nenhum excedente da coroa após o término deste passeio."
 travel_start_event.1020.t_sick_tour:0 "$activity_tour$: $travel_start_event.1000.t_sick$"
 travel_start_event.1020.t_tour_dread:0 "$activity_tour$: Um Começo Temível"
 travel_start_event.1020.t_tour_majesty:0 "$activity_tour$: Um Começo Majestoso"
 travel_start_event.1020.t_tour_tax:0 "$activity_tour$: Um Começo Lucrativo"
 travel_start_event.1030.desc_host_wedding:0 "M[Select_CString( host.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))] [host.GetTitledFirstName] está organizando seu próprio [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName] em [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] e chegou a hora de partirmos.\n\n[host.GetSheHe|U] estará entrando em [host.Custom('GetCulturallyAppropriateMarriageReference')] com [host_spouse_to_be.GetTitledFirstName]"
 travel_start_event.1030.desc_host_wedding_default:0 "e o casamento deve ser bom, como a maioria dos casamentos é."
 travel_start_event.1030.desc_host_wedding_negative:0 "e eu estarei lá para zombar deles."
 travel_start_event.1030.desc_host_wedding_outro_default:0 "\n\nEstou ansioso para relaxar e desfrutar das celebrações que acompanham tal ocasião."
 travel_start_event.1030.desc_host_wedding_outro_negative:0 "\n\nQue a união deles seja tão podre quanto um peixe de um mês atrás — e se nada mais, poderei abusar da hospitalidade de [host.GetTitledFirstNamePossessiveNoTooltip] para aproveitar boa comida e bebidas."
 travel_start_event.1030.desc_host_wedding_outro_positive:0 "\n\nQue o casamento deles seja tão fértil quanto uma colheita no outono; e duas vezes mais doce."
 travel_start_event.1030.desc_host_wedding_positive:0 "e eu estarei lá, desejando-lhes bem em sua união."
 travel_start_event.1030.desc_my_spouse_wedding:0 "Eu estarei organizando minha própria [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName] em [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] e chegou a hora de partirmos.\n\nAtravés desta união, eu serei casado com [my_spouse_to_be.GetTitledFirstName], e isso será de fato uma celebração memorável."
 travel_start_event.1030.desc_my_spouse_wedding_outro_default:0 "\n\nTenho certeza de que vou gostar muito de passar o resto da minha vida junto com [my_spouse_to_be.GetTitledFirstNameNoTooltip]."
 travel_start_event.1030.desc_my_spouse_wedding_outro_negative:0 "\n\nEmbora eu não seja particularmente fã de [my_spouse_to_be.GetTitledFirstNameNoTooltip], tenho certeza de que nos daremos bem."
 travel_start_event.1030.desc_my_spouse_wedding_outro_positive:0 "\n\nEstou muito animado para passar o resto da minha vida junto com o meu [ROOT.Char.Custom('PartnerOpinionHighDescription')] [my_spouse_to_be.GetTitledFirstNameNoTooltip]."
 travel_start_event.1030.desc_my_wedding:0 "$travel_start_event.1000.intro_my_activity$\n\nUniremos m[Select_CString( first_spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('first_spouse'))] [first_spouse.GetTitledFirstName] e m[Select_CString( second_spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('second_spouse'))] [second_spouse.GetTitledFirstName] em [ROOT.Char.Custom('GetCulturallyAppropriateMarriageReference')], para o benefício de todos os envolvidos."
 travel_start_event.1030.desc_my_wedding_outro_default:0 "\n\nSerá uma cerimônia agradável, e nossos convidados devem ficar impressionados."
 travel_start_event.1030.desc_my_wedding_outro_negative:0 "\n\nAgora, o casal feliz melhor estar grato por isso."
 travel_start_event.1030.desc_my_wedding_outro_positive:0 "\n\nEu não poderia estar mais animado para ver esses dois acabarem juntos."
 travel_start_event.1030.desc_my_wedding_outro_sick:0 "\n\nEmbora minha saúde esteja me traindo, ainda farei um esforço para garantir que todos os convidados fiquem impressionados e se sintam cuidados."
 travel_start_event.1030.desc_red_wedding:0 "Assim como chegou a hora de mim e do meu séquito partir para o meu [ROOT.Char.GetInvolvedActivity.GetShortName] em [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName]; também chegou a hora dos convidados do [ROOT.Char.GetInvolvedActivity.GetNameNoTooltip] partir deste mundo.\n\nCom esse evento feito da maneira certa, essas núpcias não serão esquecidas em breve... pelos que ficaram vivos."
 travel_start_event.1030.desc_sick_red_wedding:0 "O sino toca para muitas pessoas, incluindo a mim. Chegou a hora de partir para o [ROOT.Char.GetInvolvedActivity.GetShortName] que organizei em [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName].\n\nMinha doença não me impedirá do que precisa acontecer e este [ROOT.Char.GetInvolvedActivity.GetNameNoTooltip] irá e deve acontecer. Eu vou garantir que todos que sobreviverem realmente se lembrem dessas núpcias."
 travel_start_event.1030.desc_wedding:0 "M[Select_CString( host.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))] [host.GetTitledFirstName] está organizando um [ROOT.Char.GetInvolvedActivity.GetShortName] em [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] e chegou a hora de partirmos.\n\nA cerimônia unirá s[Select_CString( first_spouse.IsFemale, 'ua', 'eu' )] [host.Custom2('RelationToMe', SCOPE.sC('first_spouse'))] [first_spouse.GetTitledFirstName] e [host.Custom2('RelationToMe', SCOPE.sC('second_spouse'))] [second_spouse.GetTitledFirstName] em [host.Custom('GetCulturallyAppropriateMarriageReference')]."
 travel_start_event.1030.desc_wedding_outro_default:0 "$travel_start_event.1030.desc_host_wedding_outro_default$"
 travel_start_event.1030.desc_wedding_outro_negative:0 "$travel_start_event.1040.desc_feast_outro_negative$"
 travel_start_event.1030.desc_wedding_outro_positive:0 "\n\nTenho certeza de que [host.GetTitledFirstNameNoTooltip] organizou uma festa memorável; e estou ansioso para participar."
 travel_start_event.1030.desc_wedding_outro_sick:0 "\n\nComo minha saúde está em declínio, ainda aguardo ansiosamente este evento para relaxar e apreciar as festividades."
 travel_start_event.1030.t_red_wedding:0 "$activity_wedding$: $travel_start_event.1000.t_murder$"
 travel_start_event.1030.t_sick_wedding:0 "$activity_wedding$: $travel_start_event.1000.t_sick$"
 travel_start_event.1030.t_wedding:0 "$activity_wedding$: $travel_start_event.1000.t$"
 travel_start_event.1040.a:0 "É o que eles teriam querido."
 travel_start_event.1040.desc_feast:0 "M[Select_CString( host.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))] [host.GetTitledFirstName] está organizando uma [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName] em [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] e chegou a hora de partirmos."
 travel_start_event.1040.desc_feast_celebration:0 "\n\nO [ROOT.Char.GetInvolvedActivity.GetNameNoTooltip|l] é para celebrar as últimas realizações e feitos de [celebratory_guest.GetTitledFirstNamePossessive]."
 travel_start_event.1040.desc_feast_outro_default:0 "\n\nEstou ansioso para experimentar a [host.Custom('RegionalDrink')] da região de [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip], além de desfrutar da culinária local."
 travel_start_event.1040.desc_feast_outro_negative:0 "\n\nPreciso cuidar das minhas costas e da minha comida durante esta visita, já que [host.GetTitledFirstNameNoTooltip] é uma criatura traiçoeira."
 travel_start_event.1040.desc_feast_outro_positive:0 "\n\nEstou ansioso para passar mais tempo com [host.GetTitledFirstNameNoTooltip] durante este [ROOT.Char.GetInvolvedActivity.GetShortNameNoTooltip]."
 travel_start_event.1040.desc_feast_outro_sick:0 "\n\nMesmo que minha saúde esteja me traindo, acredito que participar deste evento pode ser uma boa maneira de tirar minha mente disso e aliviar um pouco o estresse."
 travel_start_event.1040.desc_murder_feast:0 "Eu apresentarei aos meus convidados o meu conjunto específico de festividades quando eu organizar [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName] [ROOT.Char.GetInvolvedActivity.GetShortName] em [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName].\n\nTudo está preparado com o máximo de detalhes, e tenho certeza de que eles se sentirão bem-vindos. Será um banquete para lembrar... para aqueles que ficarem vivos."
 travel_start_event.1040.desc_my_feast:0 "$travel_start_event.1000.intro_activity$"
 travel_start_event.1040.desc_my_feast_celebration:0 "\n\nEste [ROOT.Char.GetInvolvedActivity.GetShortNameNoTooltip|l] é em homenagem a [celebratory_guest.GetTitledFirstName], um ser humano verdadeiramente notável que merece reverência adicional."
 travel_start_event.1040.desc_my_feast_celebration_host:0 "\n\nO [ROOT.Char.GetInvolvedActivity.GetShortNameNoTooltip|l] é em minha homenagem e a todas as minhas magníficas realizações e feitos."
 travel_start_event.1040.desc_my_feast_outro:0 "\n\nEstou ansioso para um bom banquete e para relaxar um pouco!"
 travel_start_event.1040.desc_my_feast_outro_extrovert:0 "\n\nVou garantir que este [ROOT.Char.GetInvolvedActivity.GetShortNameNoTooltip|l] seja um evento para ser lembrado; algo sobre o qual as pessoas falarão por muitos anos!"
 travel_start_event.1040.desc_my_feast_outro_introvert:0 "\n\nEmbora eu não goste particularmente desse tipo de evento, eles são um mal necessário de vez em quando."
 travel_start_event.1040.desc_my_feast_outro_sick:0 "\n\nNão tenho me sentido bem ultimamente, mas este banquete certamente distrairá minha mente das coisas."
 travel_start_event.1040.desc_sick_murder_feast:0 "Chegou a hora da prestação de contas dos meus convidados para o meu [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName] [ROOT.Char.GetInvolvedActivity.GetShortName].\n\nAgora partiremos para [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName], onde meu próprio tipo de festa acontecerá — e eu devo me apressar antes que eu mesmo deixe este mundo."
 travel_start_event.1040.t_feast:0 "$activity_feast$: $travel_start_event.1000.t$"
 travel_start_event.1040.t_murder_feast:0 "$activity_feast$: $travel_start_event.1000.t_murder$"
 travel_start_event.1040.t_sick_feast:0 "$activity_feast$: $travel_start_event.1000.t_sick$"
 travel_start_event.1050.desc_my_playdate:0 "$travel_start_event.1000.intro_my_activity$"
 travel_start_event.1050.desc_my_playdate_bossy:0 "\n\nEssas crianças aprenderão que em minha propriedade, minha vontade é lei. Mas tenho certeza de que nos daremos bem."
 travel_start_event.1050.desc_my_playdate_default:0 "\n\nMeus cortesãos e eu planejamos muitas atividades para nós participarmos, e estou ansioso para receber meus pares."
 travel_start_event.1050.desc_my_playdate_learning:0 "\n\nTenho planos intrigantes para nós sermos educados e possivelmente fazer novos amigos."
 travel_start_event.1050.desc_my_playdate_outro:0 "\n\nDeve ser muito divertido e uma ótima oportunidade para eu mostrar a propriedade de [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip], também."
 travel_start_event.1050.desc_my_playdate_pensive:0 "\n\nEnfrentar meus pares realmente não é algo que estou no clima de fazer agora ou... bem, nunca.\n\nMas embora não seja especialmente favorável a esse acordo, suponho que preciso mostrar uma face corajosa e brincar com esses caprichos para manter meu status social intacto."
 travel_start_event.1050.desc_my_playdate_victim:0 "\n\n[playdate_victim.GetTitledFirstName|U] estará lá, então isso promete ser um bom momento... pelo menos para mim.\n\nMostrar a propriedade de [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] deve ser divertido também."
 travel_start_event.1050.desc_playdate:0 "$travel_start_event.1000.intro_activity$"
 travel_start_event.1050.desc_playdate_default:0 "\n\nEstou ansioso para passar um tempo com meus pares e explorar a propriedade em [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]."
 travel_start_event.1050.desc_playdate_negative:0 "\n\nEmbora não seja um grande fã de [host.GetTitledFirstName], estou ansioso para passar um tempo com meus pares."
 travel_start_event.1050.desc_playdate_outro:0 "\n\nE quem sabe, talvez até mesmo eu [ROOT.Char.Custom('ChildhoodTraitActivity')]."
 travel_start_event.1050.desc_playdate_positive:0 "\n\nEstou ansioso para passar um tempo com m[Select_CString( host.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))] [host.GetTitledFirstName], mal posso esperar para chegarmos!"
 travel_start_event.1050.desc_sick_playdate:0 "\n\nEmbora não esteja me sentindo bem ultimamente, as coisas provavelmente funcionarão bem e eu me divertirei de qualquer maneira."
 travel_start_event.1050.t_playdate:0 "$activity_playdate$: $travel_start_event.1000.t$"
 travel_start_event.1050.t_sick_playdate:0 "$activity_playdate$: $travel_start_event.1000.t_sick$"
 travel_start_event.1051.a.multiple:0 "Divirtam-se, crianças!"
 travel_start_event.1051.a:0 "Divirta-se, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))]!"
 travel_start_event.1051.a_cynical:0 "Muito bem..."
 travel_start_event.1051.b:0 "Acho que não!"
 travel_start_event.1051.desc:0 "foi convidado para um encontro com colegas [Select_CString( host.IsFemale, 'pela', 'pelo' )] [host.GetTitledFirstName]."
 travel_start_event.1051.many:0 "M[Select_CString( child_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child_1'))], [child_1.GetTitledFirstName], junto com [child_2.GetTitledFirstName] e as outras crianças,"
 travel_start_event.1051.multiple:0 "\n\nEles estão prontos e empolgados para partir para [host.GetCapitalLocation.GetNameNoTooltip]."
 travel_start_event.1051.one:0 "M[Select_CString( child_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child_1'))], [child_1.GetTitledFirstName],"
 travel_start_event.1051.single:0 "\n\n[child_1.GetSheHe|U] está pronto e empolgado para partir para [host.GetCapitalLocation.GetNameNoTooltip]."
 travel_start_event.1051.t:0 "$activity_playdate$: Hora de Brincar"
 travel_start_event.1051.three:0 "M[Select_CString( child_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child_1'))], [child_1.GetTitledFirstName], junto com [child_2.GetTitledFirstName] e [child_3.GetTitledFirstName],"
 travel_start_event.1051.two:0 "M[Select_CString( child_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child_1'))], [child_1.GetTitledFirstName], junto com [child_2.GetTitledFirstName],"
 travel_start_event.1060.desc_hajj_pilgrimage:0 "Chegou a hora de eu fazer a peregrinação a Meca. Foi me ordenado, como foi para todos os muçulmanos, mostrar minha submissão a [ROOT.Char.GetFaith.HighGodName]."
 travel_start_event.1060.desc_pilgrimage:0 "Enquanto me preparava para a minha jornada, tinha essa sensação de serenidade e de que tudo ficaria bem.\n\nEstou ansioso para embarcar nessa [ROOT.Char.GetInvolvedActivity.GetShortName] para [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetCounty.GetTitle.GetNameNoTier] para me aproximar ainda mais de [ROOT.Char.GetFaith.HighGodName]; e agora mais do que nunca sinto que [ROOT.Char.GetFaith.HighGodNameSheHe] vai me vigiar em minhas viagens."
 travel_start_event.1060.desc_sick_pilgrimage:0 "Eu posso sentir em meu corpo; a dor sutil e o lento declínio que vêm com minha doença. Em meus dias mais sombrios, a única coisa que me mantém vivo é saber que [ROOT.Char.GetFaith.HighGodName] tem um plano para nós.\n\nDesde a falta da sua presença, ficou claro para mim agora que devo empreender essa [ROOT.Char.GetInvolvedActivity.GetShortName] para [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetCounty.GetTitle.GetNameNoTier] para me aproximar de [ROOT.Char.GetFaith.HighGodNameAlternate]. Isso também é um cobertor calmante para minha alma, para que quando eu eventualmente passar, não tenha nada a temer."
 travel_start_event.1060.desc_yatra_pilgrimage:0 "Quando parto em [Glossary('Yatra', 'YATRA_GLOSS')] sou tomado por um sentimento de empolgação e apreensão. Recordo a mim mesmo que a jornada é tão importante quanto o destino. Quaisquer dificuldades que eu possa suportar são, por si mesmas, um ato de devoção.\n\nTenho esperança de que ao realizar este [ROOT.Char.GetInvolvedActivity.GetShortName] para [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetCounty.GetTitle.GetNameNoTier] eu me aproxime ainda mais de [ROOT.Char.GetFaith.HighGodName]."
 travel_start_event.1060.t_hajj:0 "O Hajj"
 travel_start_event.1060.t_pilgrimage:0 "$activity_pilgrimage$: $travel_start_event.1000.t$"
 travel_start_event.1060.t_sick_pilgrimage:0 "$activity_pilgrimage$: $travel_start_event.1000.t_sick$"
 travel_start_event.1060.tt.random_pilgrim_counter:0 "Você adicionou [THIS.Char.MakeScope.Var('rando_pilgrim_counter').GetValue] potenciais [THIS.Char.Custom('GetPilgrimSingularPlural')] à sua [THIS.Char.GetInvolvedActivity.GetShortName] para [THIS.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetCounty.GetTitle.GetNameNoTier]"
 travel_start_event.1070.desc_hunt:0 "$travel_start_event.1000.intro_activity$"
 travel_start_event.1070.desc_hunt_default:0 "Deveria poder representar orgulhosamente a casa de [ROOT.Char.GetHouse.GetName]."
 travel_start_event.1070.desc_hunt_negative:0 "Terei que ser cuidadoso com essa viagem; não confio [Select_CString( host.IsFemale, 'na', 'no' )] [host.GetTitledFirstNameNoTooltip] mais do que eu poderia julgar [host.GetSheHe]."
 travel_start_event.1070.desc_hunt_outro_dangerous:0 "\n\nVamos caçar bestas perigosas; destreza e astúcia são de extrema importância."
 travel_start_event.1070.desc_hunt_outro_falconry:0 "\n\nCaçar com aves é uma busca nobre; tenho certeza de que vou me destacar."
 travel_start_event.1070.desc_hunt_outro_legendary:0 "\n\nNossa presa é uma besta lendária, e a presa será minha..."
 travel_start_event.1070.desc_hunt_outro_standard:0 "\n\nIsso deveria ser um bom esporte, se o evento for devidamente organizado."
 travel_start_event.1070.desc_hunt_positive:0 "Estou ansioso para passar mais tempo com [host.GetSheHe]."
 travel_start_event.1070.desc_my_hunt:0 "$travel_start_event.1000.intro_my_activity$"
 travel_start_event.1070.desc_my_hunt_arrogant:0 "Não tenho dúvida de que em breve estarei voltando para casa, coberto de glória."
 travel_start_event.1070.desc_my_hunt_humble:0 "Estou ansioso para passar tempo ao ar livre."
 travel_start_event.1070.desc_my_hunt_hunter:0 "Finalmente, uma chance de seguir minha paixão e praticar minhas habilidades."
 travel_start_event.1070.desc_my_hunt_outro_dangerous:0 "\n\nNossa presa será feroz; com certeza atrairá os audaciosos para a festa."
 travel_start_event.1070.desc_my_hunt_outro_falconry:0 "\n\nA habilidade das minhas aves mostrará aos outros como manter um viveiro."
 travel_start_event.1070.desc_my_hunt_outro_legendary:0 "\n\nA presa que buscamos é algo lendário, se é real..."
 travel_start_event.1070.desc_my_hunt_outro_standard:0 "\n\nÉ verdade, nada se compara a uma boa e velha caçada!"
 travel_start_event.1070.desc_sick_hunt_outro:0 "\n\nE à medida que minha saúde está falhando, espero que essa caçada ajude a tirar minha mente das coisas e aliviar um pouco do meu estresse."
 travel_start_event.1070.desc_sick_my_hunt_outro:0 "\n\nEmbora não esteja com saúde no auge, farei o meu melhor para entreter meus convidados. Tenho certeza de que esse evento será agradável para todos os envolvidos."
 travel_start_event.1070.t_hunt:0 "$activity_hunt$: $travel_start_event.1000.t$"
 travel_start_event.1070.t_sick_hunt:0 "$activity_hunt$: $travel_start_event.1000.t_sick$"
 travel_start_event.1080.desc_my_witch_ritual:0 "$travel_start_event.1000.intro_my_activity$"
 travel_start_event.1080.desc_my_witch_ritual_default:0 "\n\nSerei um ótimo anfitrião para todas as minhas irmãs e irmãos que viajaram de perto e de longe para se reunirem, se unirem e celebrarem nosso [ROOT.Char.GetFaith.WitchGodMistressMaster]!"
 travel_start_event.1080.desc_my_witch_ritual_health:0 "\n\nSendo conhecedor do corpo e das doenças, minhas instruções devem garantir que o restante de meus irmãos também possa viver vidas longas e saudáveis."
 travel_start_event.1080.desc_my_witch_ritual_learned:0 "\n\nSendo um [ROOT.Char.Custom('MagicUserTerm')] altamente instruído, certificarei-me de compartilhar meu conhecimento com minhas irmãs e irmãos para que todos nós possamos viver vidas mais instruídas."
 travel_start_event.1080.desc_my_witch_ritual_mystic:0 "\n\nComo um místico e vidente, prevejo coisas boas em nosso futuro e minha sabedoria deve ser muito apreciada por meus irmãos na celebração de nossa [ROOT.Char.GetFaith.WitchGodMistressMaster]."
 travel_start_event.1080.desc_my_witch_ritual_outro:0 "$travel_start_event.1080.desc_witch_ritual_outro$"
 travel_start_event.1080.desc_sick_my_witch_ritual_outro:0 "$travel_start_event.1080.desc_sick_witch_ritual_outro$"
 travel_start_event.1080.desc_sick_witch_ritual_outro:0 "\n\nEnquanto minha saúde está fraca, certamente não quero perder este evento."
 travel_start_event.1080.desc_witch_ritual:0 "$travel_start_event.1000.intro_activity$"
 travel_start_event.1080.desc_witch_ritual_default:0 "\n\nTer a oportunidade de passar tempo com meus colegas costuma ser uma ocasião rara, e estou ansioso para encontrar minhas irmãs e irmãos, aprimorar minhas habilidades e compartilhar meu conhecimento."
 travel_start_event.1080.desc_witch_ritual_negative:0 "\n\nEmbora eu não seja fã d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNameNoTooltip], estou ansioso para ter a oportunidade de compartilhar conhecimento e aprender coisas com outros irmãos."
 travel_start_event.1080.desc_witch_ritual_outro:0 "\n\nIsso tem todos os elementos de um grande evento, de fato, um que as luas lembrarão por muito tempo!"
 travel_start_event.1080.desc_witch_ritual_positive:0 "\n\nSendo [host.Custom('MagicUserTerm')] excelente, aguardo ansiosamente para passar tempo com [host.GetSheHe] e meus irmãos para compartilhar meu conhecimento e aprimorar minhas habilidades."
 travel_start_event.1080.t_sick_witch_ritual:0 "$activity_witch_ritual$: $travel_start_event.1000.t_sick$"
 travel_start_event.1080.t_witch_ritual:0 "$activity_witch_ritual$: $travel_start_event.1000.t$"
 travel_start_event.1100.desc_exam:0 "$travel_start_event.1000.intro_activity$\n\nEsta rodada de exames diz-se focar em "
 travel_start_event.1100.desc_exam_learning:0 "conhecimento acadêmico, então certifiquei-me de retomar contato com os clássicos em preparação."
 travel_start_event.1100.desc_exam_martial:0 "estratagemas de guerra, então passei meus dias examinando registros militares como preparação."
 travel_start_event.1100.desc_exam_outro:0 "\n\nPergunto-me se serei capaz de me destacar entre os demais."
 travel_start_event.1100.desc_exam_stewardship:0 "governança, então revisei todo meu conhecimento sobre os assuntos de Estado."
 travel_start_event.1100.desc_exam_wrong_gender:0 "\n\nEu sei que meu lugar neste exame será questionado, mas eu #EMP vou#! conquistar meu mérito."
 travel_start_event.1100.desc_my_exam_imperial:0 "$travel_start_event.1000.intro_my_activity$\n\nComo [ROOT.Char.GetTitleAsName], espero ver estudiosos virtuosos de todos os cantos do reino, competindo para provar-se dignos de governar todos aqueles que contemplam os céus."
 travel_start_event.1100.desc_my_exam_local:0 "$travel_start_event.1000.intro_my_activity$\n\nEspero que os mais capazes habitantes se juntem a mim prontamente em [location.GetName], prontos para provar seu valor."
 travel_start_event.1100.desc_my_exam_outro:0 "\n\nQuem irá se destacar entre os demais, eu me pergunto?"
 travel_start_event.1100.desc_sick_exam_outro:0 "\n\nApesar de meu corpo debilitado, não quero perder este evento."
 travel_start_event.1100.t_exam:0 "$activity_imperial_examination$: $travel_start_event.1000.t$"
 travel_start_event.1100.t_exam_local:0 "$activity_local_examination$: $travel_start_event.1000.t$"
 travel_start_event.1100.t_sick_exam:0 "$activity_imperial_examination$: $travel_start_event.1000.t_sick$"
 travel_start_event.1100.t_sick_exam_local:0 "$activity_local_examination$: $travel_start_event.1000.t_sick$"
 travel_start_event.1110.desc:0 "A estrada chama! Devo seguir adiante e guiar meus seguidores em [contract_location.GetName], garantindo que sintam-se acolhidos por minha benevolência."
 travel_start_event.1110.desc_outro:0 "\n\nVamos ver o que eles têm a oferecer."
 travel_start_event.1110.desc_sick_outro:0 "\n\nApesar de meu corpo debilitado, preciso reunir forças e resistir."
 travel_start_event.1110.t:0 "Ritual Mandala: $travel_start_event.1000.t$"
 travel_start_event.1110.t_sick:0 "Ritual Mandala: $travel_start_event.1000.t_sick$"
 travel_start_event.1120.a_leader:0 "Veremos quem possui a astúcia para triunfar."
 travel_start_event.1120.advancement.tt:0 "Você se junta ao [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey( 'advancement_movement' ).GetName]"
 travel_start_event.1120.advancement:0 "O [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey( 'advancement_movement' ).GetNameNoTooltip] chama minha atenção."
 travel_start_event.1120.bye:0 "Não desejo me juntar a nenhum(a) deles(as)."
 travel_start_event.1120.conservatives.tt:0 "Você se junta ao [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey( 'conservative_movement' ).GetName]"
 travel_start_event.1120.conservatives:0 "Devo me juntar ao [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey( 'conservative_movement' ).GetNameNoTooltip]."
 travel_start_event.1120.desc.undecided:0 "\n\nNo entanto, fui informad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] de que se espera que eu pertença a um dos movimentos dominantes para poder participar."
 travel_start_event.1120.desc_debate:0 "$travel_start_event.1000.intro_activity$"
 travel_start_event.1120.desc_debate_outro:0 "\n\nÉ meu dever garantir que o futuro de [primary_title.GetName] seja conduzido na direção correta."
 travel_start_event.1120.desc_my_debate:0 "$travel_start_event.1000.intro_my_activity$"
 travel_start_event.1120.desc_sick_debate_outro:0 "\n\nMesmo que meu corpo esteja me abandonando, o futuro de [primary_title.GetName] tem precedência."
 travel_start_event.1120.desc_special_guest:0 "[Select_CString( host.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))] [host.GetTitledFirstName] deseja debater comigo sobre a liderança do [ROOT.Char.Custom('GetMyMovement')]."
 travel_start_event.1120.expansionists.tt:0 "Você se junta ao [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey( 'expansion_movement' ).GetName]"
 travel_start_event.1120.expansionists:0 "O [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey( 'expansion_movement' ).GetNameNoTooltip] é o mais razoável."
 travel_start_event.1120.pro_hegemon.tt:0 "Você se junta ao [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey( 'pro_hegemon_movement' ).GetName]"
 travel_start_event.1120.pro_hegemon:0 "O [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey( 'pro_hegemon_movement' ).GetNameNoTooltip] irá nos guiar!"
 travel_start_event.1120.t_debate:0 "Debate: $travel_start_event.1000.t$"
 travel_start_event.1120.t_sick_debate:0 "Debate: $travel_start_event.1000.t_sick$"
 travel_start_event.1120.t_special_guest:0 "Debate: O Desafio"
 travel_starts:0 "A Viagem Começa"
 wrong_examination_gender_tt:0 "@warning_icon! #X Devido à [gender_law|E] do reino#!"
