 sacred_water_modifier_desc:0 "Dizem que esta água milagrosa cura todas as doenças."
 satiated_curiosity:0 "Curiosidade Satisfeita"
 sent_assassin_back_modifier:0 "Agentes Descobertos"
 tour_travel.3110.a.tt:0 "Você aceita o convite para o banquete"
 tour_travel.3110.a:0 "\"Aceitarei com prazer seu convite.\""
 tour_travel.3110.b:0 "\"Isso... não está de acordo com os meus padrões. Precisamos continuar nossa jornada.\""
 tour_travel.3110.c:0 "\"Nada me faria mais feliz! Eu até trouxe meu próprio $court_jester_court_position$."
 tour_travel.3110.desc:0 "Viajando pelas ruas lamacentas de [ghino_di_tacco_location.GetName], as pessoas são uma visão rara. Casas vazias, abandonadas. Uma criança brinca com um cachorro em silêncio, depois se esconde quando vê nosso séquito. Um padre local aponta para a casa da [ghino_di_tacco_scope.GetLadyLord], e seguimos.\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Minha admirada', 'Meu admirado' )] [ROOT.Char.GetTitledFirstNameNoTooltip]!\" [ghino_di_tacco_scope.GetTitledFirstName] nos recebe em um corredor empoeirado.\n\n\"É uma grande honra tê-lo visitando nosso humilde domínio. Se desejar, por favor, fique para a noite e junte-se a nós para o jantar!\""
 tour_travel.3110.t:0 "Uma Parada no Caminho"
 tour_travel.3111.a:0 "\"Aqui, pegue isso e nunca mais roube.\""
 tour_travel.3111.b:0 "\"Vamos todos esquecer que isso aconteceu.\""
 tour_travel.3111.c:0 "\"Agora #EMP você#! vai pagar por isso.\""
 tour_travel.3111.d:0 "\"Meus guardas vão conversar com você.\""
 tour_travel.3111.desc_breaking_down:0 "[ghino_di_tacco_scope.GetSheHe|U] cai em um choro imediatamente depois, enterrando seu rosto nas mãos. \"Eu... devo ser honesto com você. Minha intenção ao convidá-lo aqui era roubar de você, [Select_CString( ROOT.Char.IsFemale, 'querida', 'querido' )] [ROOT.Char.GetLadyLord]. Espero que você possa me perdoar.\""
 tour_travel.3111.desc_committed:0 "[ghino_di_tacco_scope.GetSheHe|U] se desculpa prontamente [ghino_di_tacco_scope.GetHerselfHimself] para ir ao banheiro, esbarrando acidentalmente em mim no caminho."
 tour_travel.3111.desc_intro:0 "As lamparinas a óleo projetam uma luz tão fraca que é quase imperceptível. Um servo idoso nos serve comida: peixe. Sem tempero.\n\n[ghino_di_tacco_scope.GetTitledFirstNameNoTooltip] parece um pouco nervoso, falando sobre as dificuldades de governar uma área tão pobre, a tributação impossível. \"O último padre que tivemos saiu depois de apenas alguns meses,\" [ghino_di_tacco_scope.GetSheHe] murmura, guardando o vinho aguado.\n\n"
 tour_travel.3111.e.failure:0 "Você não percebe que [ghino_di_tacco_scope.GetFirstNameNoTooltip] te roubou"
 tour_travel.3111.e.success:0 "Você percebe que [ghino_di_tacco_scope.GetFirstNameNoTooltip] está tentando roubar seus bolsos"
 tour_travel.3111.e:0 "\"Espere... o que você está fazendo?\""
 tour_travel.3111.t:0 "Uma Parada no Caminho: O Banquete"
 travel_events.3000.a.tt:0 "Você continuará procurando por essas criaturas"
 travel_events.3000.a:0 "Eu devo ver essas criaturas. #EMP Agora!#!"
 travel_events.3000.b:0 "Por favor, [traveller_monk.GetFirstNameNoTooltip], me conte mais sobre elas."
 travel_events.3000.c:0 "E quanto a elas? Já temos bastantes bizarrices em casa."
 travel_events.3000.d:0 "Eu devo vê-las e reportar minhas descobertas."
 travel_events.3000.desc:0 "Raramente vi [traveller_monk.Custom2('MyCharacterIntroduction', ROOT.Char)] tão animado. Seus olhos parecem devorar um livro ricamente adornado — às vezes consigo dar uma olhada nos mapas em seu interior.\n\nUma manhã, [traveller_monk.GetSheHe] finalmente se aproxima de mim sobre suas descobertas:\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], há rumores de que a terra de [ROOT.Char.GetCurrentLocation.GetName] abriga pessoas extraordinárias! Dizem que [ROOT.Char.Custom('GetGrotesquePlural')] vagam por essas cidades.\""
 travel_events.3000.t:0 "Criaturas Grotescas"
 travel_events.3000_interest_modifier:0 "Interesse nas Grotescas"
 travel_events.3001.a:0 "Oh... tudo bem..."
 travel_events.3001.b:0 "Você me #EMP prometeu#! que haveria monstros."
 travel_events.3001.b_sadistic:0 "Eu vou te ensinar a não mentir para o seu senhor."
 travel_events.3001.c:0 "Hah! Eu sabia!"
 travel_events.3001.d:0 "Elas #EMP devem#! estar em algum lugar."
 travel_events.3001.desc.fallback:0 "A curiosidade é simplesmente muito grande."
 travel_events.3001.desc.outro:0 "\n\nQuando chegamos em [grotesque_place.GetNameNoTooltip], [traveller_monk.GetSheHe] se aproxima de mim, segurando seu livro firmemente.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]... seguimos todas as indicações, mas essas criaturas não foram encontradas em lugar algum. Ocorreu-me que talvez elas sejam, talvez, nada mais do que uma invenção.\""
 travel_events.3001.desc_cynical:0 "Uma chance de provar que [traveller_monk.GetSheHe] está errado."
 travel_events.3001.desc_intro:0 "Cada vez que chegamos a um novo assentamento, eu tiro um momento para olhar ao redor, tentando encontrar as criaturas grotescas que vi nos mapas de [traveller_monk.GetTitledFirstNamePossessiveNoTooltip]. "
 travel_events.3001.e.failure:0 "Ninguém acredita em suas aventuras grotescas"
 travel_events.3001.e.success:0 "Você convence as pessoas sobre o que viu"
 travel_events.3001.e:0 "Como as pessoas em casa vão saber que elas #EMP não estavam#! aqui?"
 travel_events.3001.t:0 "Uma Decepção Grotesca"
 travel_events.3010.a.failure:0 "[pet_rescuer.GetTitledFirstNameNoTooltip] se perde ao tentar encontrar seu animal de estimação"
 travel_events.3010.a.failure_toast:0 "[pet_rescuer.GetTitledFirstNameNoTooltip] se perdeu tentando encontrar seu animal de estimação"
 travel_events.3010.a.success:0 "[pet_rescuer.GetTitledFirstNameNoTooltip] encontra seu animal de estimação"
 travel_events.3010.a_cat:0 "Não, [ROOT.Char.Custom( 'CatStoryName' )]! [pet_rescuer.GetTitledFirstNameNoTooltip], siga [ROOT.Char.Custom('CatStorySheHe')]!"
 travel_events.3010.a_dog:0 "Não! [ROOT.Char.Custom( 'DogStoryName' )]! [pet_rescuer.GetTitledFirstNameNoTooltip], siga [ROOT.Char.Custom('DogStorySheHe')]!"
 travel_events.3010.a_exotic:0 "[pet_rescuer.GetTitledFirstNameNoTooltip], pegue meu animal de estimação antes que alguém acabe machucado!"
 travel_events.3010.alone:0 "Espere! Onde está [ROOT.Char.Custom( 'DogStoryName' )]? Não vi [ROOT.Char.Custom( 'DogStorySheHe' )] há... Eu respiro fundo, ao avistar movimento no [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] além do caminho!\n\nO que parece ser um pequeno roedor está correndo em direção à mata"
 travel_events.3010.b.tt1:0 "Seu animal de estimação nunca mais será visto"
 travel_events.3010.b.tt2:0 "Seu animal de estimação encontrará o caminho de volta"
 travel_events.3010.b.tt3:0 "Você encontra seu animal de estimação e algo mais"
 travel_events.3010.b.tt:0 "Pode voltar por conta própria..."
 travel_events.3010.b_cat:0 "[ROOT.Char.Custom( 'CatStoryName' )] é mais esperto do que todos nós, [ROOT.Char.Custom('CatStorySheHe')]'vai encontrar o caminho de volta."
 travel_events.3010.b_dog:0 "[ROOT.Char.Custom( 'DogStoryName' )] é mais esperto do que todos nós, [ROOT.Char.Custom('DogStorySheHe')]'vai encontrar o caminho de volta."
 travel_events.3010.b_exotic:0 "#EMP Pft!#! Se algo, são as pessoas dessas terras que deveriam se preocupar."
 travel_events.3010.c.failure:0 "Você se perde ao tentar encontrar seu animal de estimação"
 travel_events.3010.c.failure_toast:0 "Você se perdeu tentando encontrar seu animal de estimação"
 travel_events.3010.c.success:0 "Você encontra seu animal de estimação"
 travel_events.3010.c_cat:0 "$ill_find_you$ [ROOT.Char.Custom( 'CatStoryName' )]!"
 travel_events.3010.c_dog:0 "$ill_find_you$ [ROOT.Char.Custom( 'DogStoryName' )]!"
 travel_events.3010.c_exotic:0 "Embora perigoso, ele ainda é o meu menino perdido! Eu vou te encontrar!"
 travel_events.3010.cat:0 "e, após ele, uma figura [ROOT.Char.Custom('CatFurColor')] que reconheço facilmente."
 travel_events.3010.d:0 "Algumas almas nunca foram destinadas a ser mantidas em cativeiro. Vá, meu amigo."
 travel_events.3010.desc:0 "\"Cuidado!\" grita [pet_rescuer.Custom2('MyCharacterIntroduction', ROOT.Char)], apontando para o [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] além do caminho que seguimos.\n\nO que parece ser um pequeno roedor está correndo em direção à mata,"
 travel_events.3010.dog:0 "e, após ele, uma figura [ROOT.Char.Custom('DogFurColor')] que reconheço facilmente."
 travel_events.3010.e_cat:0 "$after_him$ [ROOT.Char.Custom('CatStoryHerHim')]!"
 travel_events.3010.e_dog:0 "$after_him$ [ROOT.Char.Custom('DogStoryHerHim')]!"
 travel_events.3010.e_exotic:0 "$after_him$ dele!"
 travel_events.3010.exotic:0 "e algo #EMP perigosamente familiar#! segue logo atrás."
 travel_events.3010.intro:0 "Após um longo dia de viagem, o horizonte começa a tingir-se com cores quentes. Eu tiro um momento para pausar, fechar os olhos, respirar.\n\n"
 travel_events.3010.t:0 "Rumo à Terra Natal"
 travel_events.3011.a:0 "Hah! Eu sabia que você teria sucesso! Bem feito!"
 travel_events.3011.b:0 "Nunca vou tirar os olhos de você novamente."
 travel_events.3011.cat:0 "[ROOT.Char.Custom( 'CatStoryName' )] está sentado sobre uma folhagem, lambendo suas patas [ROOT.Char.Custom('CatFurColor')] ensanguentadas de sua vítima.\n\nO esquilo está quase irreconhecível, bem ao lado [ROOT.Char.Custom( 'CatStoryHerHim' )]."
 travel_events.3011.dog:0 "[ROOT.Char.Custom( 'DogStoryName' )] está sentado sobre uma folhagem, lambendo suas patas [ROOT.Char.Custom('DogFurColor')] ensanguentadas de sua vítima.\n\nO esquilo está quase irreconhecível, bem ao lado [ROOT.Char.Custom( 'DogStoryHerHim' )]."
 travel_events.3011.exotic:0 "Meu querido caçador está sentado sobre uma folhagem, lambendo as patas ensanguentadas de sua vítima.\n\nO esquilo está quase irreconhecível, bem ao lado dele."
 travel_events.3011.intro:0 "Não é preciso muito para rastrear os rosnados e galhos quebrados até sua origem. "
 travel_events.3011.t:0 "Aqui Você Está!"
 travel_events.3012.a:0 "Vejo que você encontrou um lar melhor para você. Você está livre para ir."
 travel_events.3012.c:0 "Eu não esperava menos de você, meu amigo."
 travel_events.3012.cat:0 "\n\n[ROOT.Char.Custom( 'CatStorySheHe' ) |U] levanta seus olhos [ROOT.Char.Custom('CatEyeColor')] para mim. Exceto que parece não ser capaz de me reconhecer."
 travel_events.3012.dog:0 "\n\n[ROOT.Char.Custom('DogStorySheHe')|U] levanta seus olhos [ROOT.Char.Custom('DogEyeColor')] para mim. Exceto que parece não ser capaz de me reconhecer."
 travel_events.3012.exotic:0 "\n\nEle levanta os olhos para mim. Exceto que parece não ser capaz de me reconhecer."
 travel_events.3012.t:0 "Rumo à Terra Natal: Aqui Você Está...?"
 travel_events.3020.a:0 "Poderíamos usar ajuda em nossa jornada para [next_province.GetNameNoTooltip]."
 travel_events.3020.a_home:0 "Poderíamos usar ajuda em nossa jornada de volta para casa."
 travel_events.3020.b.failure:0 "[foreign_ruler.GetTitledFirstNameNoTooltip] fica insultado com suas exigências"
 travel_events.3020.b.success:0 "Você persuade [foreign_ruler.GetTitledFirstNameNoTooltip] a lhe emprestar alguns suprimentos extras"
 travel_events.3020.b:0 "Estamos um pouco carentes de suprimentos, agora que você mencionou..."
 travel_events.3020.c.success:0 "Você persuade [foreign_ruler.GetTitledFirstNameNoTooltip] a lhe emprestar alguns guardas extras"
 travel_events.3020.c:0 "Alguns guardas a mais são sempre uma boa ideia."
 travel_events.3020.d.tt:0 "Você aproveitará a hospitalidade de [foreign_ruler.GetTitledFirstNameNoTooltip] por mais duas semanas"
 travel_events.3020.d:0 "Eu adoraria aproveitar sua companhia por um pouco mais de tempo."
 travel_events.3020.desc:0 "Música está tocando para nós quando chegamos, e bobos da corte fazem malabarismos perigosamente perto do fogo. Crianças ficam em silêncio no momento em que nos veem e apontam timidamente para nós atrás de seus pais. [foreign_ruler.GetTitledFirstName] sorri do palanque.\n\n\"Meu amigo admirado!,\" [foreign_ruler.GetSheHe] vem até mim, seus braços abertos em um gesto convidativo. \"Estamos esperando por você desde o momento em que soubemos de sua chegada. Por favor, eu imploro a você, fique conosco pelo tempo que desejar, e diga uma palavra se precisar de algo.\""
 travel_events.3020.e.failure:0 "[foreign_ruler.GetFirstNameNoTooltip] rejeita seus avanços"
 travel_events.3020.e.success:0 "[foreign_ruler.GetFirstNameNoTooltip] aceita seus avanços"
 travel_events.3020.e:0 "Poderíamos discutir esses assuntos melhor... em seus aposentos."
 travel_events.3020.f:0 "Você não vai me enganar com sua falsa hospitalidade! Estou fora!"
 travel_events.3020.t:0 "Um Caloroso Bem-Vindo"
 travel_events.3021.a.failure:0 "[foreign_theologian.GetTitledFirstNameNoTooltip] apresenta um argumento mais forte"
 travel_events.3021.a.success:0 "Você convence [foreign_theologian.GetTitledFirstNameNoTooltip] em um duelo dialético"
 travel_events.3021.a:0 "Eu aceito prontamente este desafio."
 travel_events.3021.b.success:0 "[your_theologian.GetTitledFirstNameNoTooltip] convence [foreign_theologian.GetTitledFirstNameNoTooltip] em um duelo dialético"
 travel_events.3021.b:0 "Deixarei hábil [your_theologian.GetTitledFirstNameNoTooltip] assumir esse desafio."
 travel_events.3021.c:0 "Eu não tenho tempo para essa absurda discussão."
 travel_events.3021.d.tt:0 "Você suborna [foreign_theologian.GetTitledFirstNameNoTooltip] para deixá-lo vencer."
 travel_events.3021.d:0 "Ouro sempre vence qualquer discussão..."
 travel_events.3021.different_faiths:0 "Diga-me, por que alguém deveria considerar o [ROOT.Char.GetFaith.GetName] mais verdadeira do que o [foreign_theologian.GetFaith.GetName]?"
 travel_events.3021.intro:0 "\"Ah, aí está você!\" [foreign_ruler.GetTitledFirstName] faz um gesto para se aproximar [foreign_ruler.GetHerHim] no momento em que entro na sala do trono.\n\n\"Estávamos esperando por você! [foreign_theologian.GetTitledFirstName] é meu cortesão mais virtuoso e eu realmente gostaria de ouvir ambos discutirem assuntos mais elevados."
 travel_events.3021.same_faith:0 "Vamos falar sobre a natureza do [ROOT.Char.GetFaith.HighGodName]."
 travel_events.3021.t:0 "Sobre Assuntos Religiosos"
 travel_events.3022.a:0 "Com prazer, vou me juntar a vocês!"
 travel_events.3022.b.failure:0 "Você faz papel de bobo diante da corte de [foreign_ruler.GetTitledFirstNameNoTooltip]"
 travel_events.3022.b.success:0 "Você impressiona a corte de [foreign_ruler.GetTitledFirstNameNoTooltip] com seus passos de dança"
 travel_events.3022.b:0 "#EMP Aha!#! Eu estava esperando por um momento assim!"
 travel_events.3022.c:0 "Prefiro apenas ouvir algumas conversas..."
 travel_events.3022.d:0 "Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] não dança: [ROOT.Char.GetSheHe] assiste."
 travel_events.3022.desc:0 "Guirlandas de flores extravagantes enfeitam a sala do trono; na luz suave das velas do salão, os convidados cantam com vozes animadas.\n\n\"Ah, aí está você!\" [foreign_ruler.GetTitledFirstName] bate suas mãos, fazendo com que os cantores e músicos parem imediatamente.\n\n\"Estávamos prestes a começar uma dança em sua honra, [ROOT.Char.GetTitledFirstNameNoTooltip]. Todos, deem as mãos! Formem um círculo!\""
 travel_events.3022.t:0 "Uma Celebração"
 travel_events.3030.a:0 "Quem sou eu para interferir em assuntos superiores?"
 travel_events.3030.b:0 "Você está vindo para casa #EMP comigo#!."
 travel_events.3030.c.failure:0 "Suas palavras o abandonam."
 travel_events.3030.c.success:0 "Você convence [fleeing_knight.GetSheHe] a ficar."
 travel_events.3030.c:0 "Não temos tempo para essas infatuações juvenis."
 travel_events.3030.d:0 "Temos espaço suficiente em nosso [ROOT.Char.Custom('GetCourt')] para receber ambos."
 travel_events.3030.desc:0 "Não é a primeira vez que vejo [fleeing_knight.Custom2('MyCharacterIntroduction', ROOT.Char)] mexendo com algumas flores que [fleeing_knight.GetSheHe] tem colhido ao longo do caminho. Às vezes, eu até juro que ouço [fleeing_knight.GetSheHe] suspirando, olhando para as terras de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip].\n\n\"Minha [ROOT.Char.Custom('GetCourtOwner')],\" [fleeing_knight.GetSheHe] diz. \"Não é segredo que meu coração encontrou um novo lar longe de casa. Ah, minha alma dói por [foreign_lady_scope.GetTitledFirstName], meus desejos não conhecem limites, seus olhos, seu cabelo... Eu anseio por apenas um gesto, morreria por uma palavra. Por favor, eu imploro, deixe-me ficar com [foreign_lady_scope.GetSheHe].\""
 travel_events.3030.e:0 "Os olhos [foreign_lady_scope.GetHerHim] são certamente belos, e o cabelo [foreign_lady_scope.GetHerHim] parece tão macio..."
 travel_events.3030.f:0 "Eu #EMP odeio#! amor. Cortem-lhes as cabeças."
 travel_events.3030.t:0 "Um Agrado Estrangeiro"
 travel_events.3040.a:0 "A cerimônia foi certamente impressionante..."
 travel_events.3040.b:0 "Isso é um #EMP absurdo!#!"
 travel_events.3040.c.failure:0 "[bishop.GetFirstNameNoTooltip] está irritado com a sua mente estreita."
 travel_events.3040.c.success:0 "Você convence [bishop.GetFirstNameNoTooltip] de que só há uma verdade."
 travel_events.3040.c:0 "Há espaço para um debate tranquilo aqui."
 travel_events.3040.d.failure:0 "[bishop.GetShortUIName] está irritado com a sua violência."
 travel_events.3040.d.success:0 "Seus braços fortes convencem [bishop.GetShortUIName]."
 travel_events.3040.d:0 "Não há espaço para tranquilidade aqui! Desembainhe sua espada!"
 travel_events.3040.desc:0 "Todas as manhãs desde que chegamos a [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], [bishop.Custom2('MyCharacterIntroduction', ROOT.Char)] deixa seus escritos e se afasta silenciosamente da minha vista. Desta vez, decido seguir seu caminho e o encontro conversando animadamente com o [foreign_bishop.Custom('GetActualBishopTitle')] local [foreign_bishop.GetFirstName].\n\nA cerimônia começa e a luz das velas ilumina [foreign_bishop.GetFirstNameNoTooltip], enquanto sombras dançam nas paredes como folhas de outono. \"[bishop.GetFirstNameNoTooltip],\" eu o chamo após o serviço. \"O que você está fazendo?\"\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], acabei de perceber que pode haver mais de uma verdade.\""
 travel_events.3040.t:0 "Interesses Perigosos"
 travel_events.3060.a:0 "Um eremita seria uma ótima adição ao meu séquito."
 travel_events.3060.b:0 "Que sorte! Por favor, me fale sobre o meu futuro."
 travel_events.3060.c:0 "Vamos... vamos embora."
 travel_events.3060.desc.intro:0 "Uma gruta emerge da vegetação como um arco de pedra em uma catedral. Na entrada, há uma pequena mesa de madeira e uma barraca; alguém deixou uma lanterna acesa sobre ela."
 travel_events.3060.desc.on_your_own:0 " Um exilado, talvez, ou talvez um esconderijo de bandidos?\n\n\"Não tema, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip],\" uma figura fracamente iluminada aparece na entrada da gruta. \"Sou apenas um eremita, buscando sabedoria nestas antigas florestas."
 travel_events.3060.desc.travel_leader:0 "\n\n\"Cuide-se, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [travel_leader.GetTitledFirstName] levanta seu braço à minha frente. \"Há bandidos nestas terras.\"\n\n\"Você é rápido em fazer acusações,\" uma figura fracamente iluminada aparece na entrada da gruta. \"Sou apenas um eremita, e você... bem, carrega o título de [ROOT.Char.GetTitleAsNameNoTooltip]."
 travel_events.3060.t:0 "O Eremita"
 travel_events.3061.a.tt:0 "Você se lembrará disso"
 travel_events.3061.a:0 "Que perspicaz."
 travel_events.3061.desc_bad:0 "\"A água passará, mas você não passará.\""
 travel_events.3061.desc_good:0 "\"Você encontrará aquele que procura.\""
 travel_events.3061.desc_normal:0 "\"O fogo falará e prata fluirá do casco do gado mugindo.\""
 travel_events.3061.intro:0 "O eremita leva um segundo antes de responder. [hermit_scope.GetSheHe|U] levanta e espera até eu segui-lo. Algumas ervas estão espalhadas ao redor e o que parece ser uma cama rudimentar. [hermit_scope.GetSheHe|U] se vira para mim quando estamos longe do meu séquito e, com uma voz estranhamente mais profunda, responde:\n\n"
 travel_events.3061.t:0 "O Eremita: Uma Profecia"
 travel_events.3062.a:0 "Não era minha intenção roubar seu cortesão."
 travel_events.3062.b.tt:0 "[hermit_scope.GetShortUIName] será mais barato para contratar como $cave_hermit_court_position$ pelos próximos #bold 5 anos#!"
 travel_events.3062.b:0 "Bem, agora [hermit_scope.GetSheHe] é #EMP meu#! $cave_hermit_court_position$."
 travel_events.3062.c.failure:0 "[hermit_scope.GetShortUINameNoTooltip] permanecerá na corte de [hermit_owner.GetShortUINameNoTooltip]"
 travel_events.3062.c.success:0 "Você convence [hermit_scope.GetShortUINameNoTooltip] a ficar com você"
 travel_events.3062.c:0 "Por que não deixamos [hermit_scope.GetSheHe] decidir a quem servir?"
 travel_events.3062.desc:0 "[hermit_owner.GetTitledFirstName] nos recebe calorosamente quando chegamos a sua fortaleza. No entanto, os guardas [hermit_owner.GetHerHim] parecem rir e murmurar quando nos veem, apontando para o nosso séquito.\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Minha cara', 'Meu caro' )] [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetFirstNameNoTooltip]! É uma honra receber você na minha...\" [hermit_owner.GetFirstNameNoTooltip] para no meio da frase, seu rosto lívido. \"O que você está fazendo com o #EMP meu#! eremita?"
 travel_events.3062.t:0 "Onde Está Meu Eremita?"
 travel_events.3070.a:0 "Eu entendo."
 travel_events.3070.b.failure:0 "Os bandidos atacam [knight_scope.GetShortUINameNoTooltip]"
 travel_events.3070.b.success:0 "[knight_scope.GetShortUINameNoTooltip] derrota os bandidos"
 travel_events.3070.b:0 "Corajoso de sua parte até mesmo sugerir isso. [knight_scope.GetTitledFirstNameNoTooltip], mostre a [bandit_scope.GetSheHe]."
 travel_events.3070.c.failure:0 "Os bandidos não acreditam em você"
 travel_events.3070.c.success:0 "Você intimida os bandidos"
 travel_events.3070.c:0 "Com quem você pensa que está falando? Eu sou #EMP o [ROOT.Char.GetTitleAsNameNoTooltip]#!!"
 travel_events.3070.desc:0 "O suave murmúrio do rio que temos seguido por um tempo fica mais forte agora. Alguns membros do séquito falam sobre fazer uma pequena parada, pegar água fresca, descansar os pés.\n\nHá uma ponte de pedra quando o caminho vira. Alguns homens descansam com as costas apoiadas no parapeito; um bate no outro de lado e aponta para o nosso grupo. Um terceiro [bandit_scope.GetWomanMan] surge da margem, outro nos olha depois de cuspir no rio.\n\n\"Sabe,\" [bandit_scope.GetSheHe] diz, \"na verdade, esta é uma ponte de pedágio.\""
 travel_events.3070.t:0 "$travel_danger_prefix$ Bandidos na Ponte"
 travel_events.3080.a.tt:0 "Você segue o [knight_errant.Custom('KnightCultureNoTooltipLowercase')]"
 travel_events.3080.a:0 "Eu nunca deixaria um [knight_errant.Custom('KnightCultureNoTooltipLowercase')] desamparado. Liderarei o caminho!"
 travel_events.3080.b.failure:0 "O [knight_errant.Custom('KnightCultureNoTooltipLowercase')] parte, sem convencer"
 travel_events.3080.b.success:0 "Você convence o [knight_errant.Custom('KnightCultureNoTooltipLowercase')]"
 travel_events.3080.b:0 "Una-se a mim e esqueça toda essa tolice."
 travel_events.3080.c:0 "\"Uma armadura realmente bonita que você tem aí... que tal compartilhar uma moeda?\""
 travel_events.3080.d:0 "\"[same_culture_companion.GetFirstNameNoTooltip], faça [knight_errant.GetSheHe] ver a razão e junte-se à nossa corte.\""
 travel_events.3080.desc_anagnorisis:0 "\n\n[same_culture_companion.GetTitledFirstName] é rápido em interromper: \"Espera, [ROOT.Char.Custom('FormOfAddressForLiege')]! Eu conheço esse [knight_errant.Custom('KnightCultureNoTooltipLowercase')], é [knight_errant.GetFirstName]!\""
 travel_events.3080.desc_intro:0 "É sabido que o povo de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] parece professar uma devoção especial por seus [knight_errant.Custom('KnightCulturePluralNoTooltipLowercase')] e suas lendas.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" o [knight_errant.Custom('KnightCultureNoTooltipLowercase')] diz, curvando a cabeça [knight_errant.GetHerHim]. \"É muito afortunado que você e eu tenhamos nos encontrado neste cruzamento, pois estou em busca de uma fonte maravilhosa cuja água se diz curar todas as doenças. Se você me ajudar em minha busca, eu prestarei homenagem a você.\""
 travel_events.3080.t:0 "Um [knight_errant.Custom('KnightCultureNoTooltip')]-Errante"
 travel_events.3081.a.failure:0 "A besta te fere"
 travel_events.3081.a.success:0 "Você mata a besta"
 travel_events.3081.a:0 "\"Não tenha medo! Eu vou lutar contra ela\""
 travel_events.3081.b.success:0 "Sua distração funciona"
 travel_events.3081.b:0 "\"Eu vou distraí-la, pegue a água!\""
 travel_events.3081.c:0 "\"Agora, #EMP você#! será uma ótima distração.\""
 travel_events.3081.d:0 "Que aventura! Tão inspirador!"
 travel_events.3081.desc:0 "O [knight_errant.Custom('KnightCultureNoTooltipLowercase')] nos conduz até uma pequena clareira onde uma fonte natural brilha. A luz reflete na sua superfície com um brilho agradável e faz com que a água pareça tão brilhante que dá a sensação de ser um segundo sol.\n\n\"Cuidado, uma besta! Um guardião!\" o [knight_errant.Custom('KnightCultureNoTooltipLowercase')] aponta para um(a) [ROOT.Char.Custom('GetAnimalType')], que está entre nós e a fonte."
 travel_events.3081.t:0 "Um [knight_errant.Custom('KnightCultureNoTooltip')]-Errante: A Busca"
 travel_events.3090.a.failure:0 "Você falha em suas tentativas de persuasão"
 travel_events.3090.a.success:0 "Você convence o padre local a abrir o [church_visit_holder.Custom('GetFaithTemple')]"
 travel_events.3090.a:0 "Eu vim até aqui para vê-lo #EMP e vou#!."
 travel_events.3090.b.failure:0 "Você é pego tentando entrar sorrateiramente no [church_visit_holder.Custom('GetFaithTemple')]"
 travel_events.3090.b.success:0 "Você entra com sucesso no [church_visit_holder.Custom('GetFaithTemple')]"
 travel_events.3090.b.success_desc:0 "Você descobre alguns documentos que não deveria ter visto..."
 travel_events.3090.b:0 "Podemos simplesmente esperar até não haver ninguém por perto..."
 travel_events.3090.c:0 "Homens, arrombem a porta se for necessário."
 travel_events.3090.d:0 "Bem, isso é infeliz. Vamos continuar nossa viagem."
 travel_events.3090.desc_cynical:0 "\n\nPelo menos é bonito de uma perspectiva estética."
 travel_events.3090.desc_intro:0 "Ah, como me lembro das histórias do [church_visit_location.GetNameNoTooltip]'s [church_visit_holder.Custom('GetFaithTemple')], o quão alto ele se ergueria, uma fortaleza imponente de [ROOT.Char.GetFaith.HighGodName]. Pedras que poderiam construir um paraíso inteiro. Silêncio — e oração.\n\nUma paisagem desolada em tons de marrom da aldeia está diante de nós; ruas enlameadas, pavimento desgastado. Mas o [church_visit_holder.Custom('GetFaithTemple')] está lá. Como prometido."
 travel_events.3090.desc_outro:0 "\n\n\"Er... [ROOT.Char.Custom('FormOfAddressForLiege')],\" um padre larga um feixe de madeira perto de uma das paredes, \"minhas desculpas, mas o [church_visit_holder.Custom('GetFaithTemple')] está fechado em preparação para [activity.GetNameNoTooltip].\""
 travel_events.3090.desc_zealous:0 "\n\nSuas cores beligerantes me fazem esquecer todos os sépias e a melancolia. Um desejo iminente de visitá-lo toma conta de mim."
 travel_events.3090.t:0 "Portas Fechadas"
 travel_events.3100.a:0 "Que sorte! Me dê seus melhores garanhões!"
 travel_events.3100.b.failure:0 "Seus cavalos precisam parar constantemente"
 travel_events.3100.b.success:0 "Seus cavalos sobrevivem à viagem"
 travel_events.3100.b:0 "Eles terão que aguentar. Sem mais despesas."
 travel_events.3100.c.failure:0 "O mercador obriga você a pagar pelo roubo"
 travel_events.3100.c.success:0 "Você consegue roubar os cavalos"
 travel_events.3100.c:0 "Talvez possamos pegá-los de #EMP graça#!..."
 travel_events.3100.d:0 "Hah! #EMP Esses#! cavalos já viram coisas piores!"
 travel_events.3100.desc_intro:0 "Sabíamos que viajar pelas estepes de [horses_steppe_location.GetName] não seria fácil. Marchamos até a noite sem parar, chegando ao nosso próximo destino tão tarde que nem jantamos. Nossos cavalos relincham, recusando-se a sair da água sempre que encontramos um riacho."
 travel_events.3100.desc_outro:0 "\n\nUm mercador local se aproxima de nós logo depois de ouvir nossas reclamações, apontando para um celeiro de madeira atrás [local_merchant.GetHerHim], cheio de cavalos locais.\n\n\"Eu tenho as melhores montarias que você encontrará. Resistentes e duráveis.\""
 travel_events.3100.desc_steppe:0 "Embora estejam acostumados com a estepe em casa, eles ainda são animais e precisam de descanso."
 travel_events.3100.t:0 "$travel_danger_prefix$ Montarias Frágeis"
 travel_events.3120.a.big_success:0 "[endangered_character.GetFirstNameNoTooltip] é resgatad[Select_CString( endangered_character.IsFemale, 'a', 'o' )]"
 travel_events.3120.a.failure:0 "[endangered_character.GetFirstNameNoTooltip] não é resgatad[Select_CString( endangered_character.IsFemale, 'a', 'o' )]"
 travel_events.3120.a.success:0 "[endangered_character.GetFirstNameNoTooltip] é resgatad[Select_CString( endangered_character.IsFemale, 'a', 'o' )] com grande dificuldade"
 travel_events.3120.a:0 "\"[travel_leader.GetFirstNameNoTooltip], salve [endangered_character.GetSheHe]!\""
 travel_events.3120.b:0 "Não há nada que possamos fazer..."
 travel_events.3120.c:0 "Eu vou salvar [endangered_character.GetFirstNameNoTooltip] eu mesmo!"
 travel_events.3120.d.big_success:0 "[prowess_entourage_member.GetFirstNameNoTooltip] resgata [endangered_character.GetFirstNameNoTooltip] ileso"
 travel_events.3120.d.failure:0 "[prowess_entourage_member.GetFirstNameNoTooltip] não consegue resgatar [endangered_character.GetFirstNameNoTooltip]"
 travel_events.3120.d.success:0 "[prowess_entourage_member.GetFirstNameNoTooltip] consegue resgatar [endangered_character.GetFirstNameNoTooltip] com grande dificuldade"
 travel_events.3120.d:0 "\"[prowess_entourage_member.GetFirstNameNoTooltip], vá você!\""
 travel_events.3120.desc:0 "Um passeio agradável pela [wooded_location.GetNameNoTooltip] [wooded_location.GetTerrain.GetNameNoTooltip|l] me faz realmente apreciar a paisagem ao nosso redor: o verde luminoso, saturado como o vestido de uma dama feito do mais fino tecido — os raios de sol, filtrados pela copa das árvores como um ícor líquido.\n\nUm cheiro vibrante. Talvez uma fogueira. Eu me viro para minha comitiva e observo o rosto furioso do mestre da caravana [travel_leader.GetFirstNameNoTooltip]. \"#EMP FOGO!#!\" [travel_leader.GetSheHe] grita, apontando para as chamas não tão distantes onde [endangered_character.GetNameNoTooltip] está preso."
 travel_events.3120.t:0 "$travel_danger_prefix$ Incêndio na [wooded_location.GetTerrain.GetNameNoTooltip]"
 travel_events.3130.a.failure:0 "O assassino te fere e escapa"
 travel_events.3130.a.success:0 "Seus guardas executam o assassino"
 travel_events.3130.a:0 "\"Tolo! Farei você pagar por isso!\""
 travel_events.3130.b.success:0 "Você vence o assassino e o envia de volta com uma carta"
 travel_events.3130.b:0 "\"Guardas! Peguem [sexy_assassin.GetSheHe]!\""
 travel_events.3130.c:0 "\"Ou você poderia se juntar #EMP aos meus#! agentes...\""
 travel_events.3130.d:0 "\"Circunstâncias agradáveis, você diz...?\""
 travel_events.3130.desc:0 "Viajar pelas terras [Select_CString( rival_scope.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival_scope'))] [rival_scope.GetTitledFirstName] deixa meu séquito nervoso, até mesmo em pânico. Com um único barulho desconhecido, pulamos para as armas e... uma silhueta misteriosa está entre nossas carroças!\n\n\"Boa noite!\" sorri o intruso, coquete, brincando com uma lâmina. \"Se #EMP somente#! tivéssemos nos encontrado em circunstâncias mais agradáveis...\" [sexy_assassin.GetSheHe] faz um biquinho. \"Ainda assim! [rival_scope.GetTitledFirstNameNoTooltip] deseja que eu a #EMP receba#! você.\""
 travel_events.3130.e:0 "\"Vá. Eu não quero te ver novamente.\""
 travel_events.3130.t:0 "$travel_danger_prefix$ Encanto Assassino"
 travel_events.3140.a.failure:0 "O comandante se recusa a ouvir"
 travel_events.3140.a.success:0 "Você convence o comandante"
 travel_events.3140.a:0 "Olhe para nossas bandeiras, nós não somos o inimigo."
 travel_events.3140.b.failure:0 "O comandante vence a luta"
 travel_events.3140.b.success:0 "Você vence a luta"
 travel_events.3140.b:0 "Você terá que me levar para levar [entourage_member.GetSheHe]!"
 travel_events.3140.c:0 "Talvez possamos chegar a um entendimento?"
 travel_events.3140.desc:0 "Colheitas queimadas, campos estéreis. Os despojos da guerra. Nosso ritmo fica mais rápido depois de vermos os primeiros corpos.\n\nO único caminho possível passa por um acampamento militar. Olho para trás: não há outra opção. Aceno para meus guardas e eles acenam de volta, apertando o cabo de suas espadas.\n\nUm comandante do exército fica na entrada do acampamento: \"Aliados do inimigo, hein?\" [hostile_commander.GetSheHe] pergunta, coçando o nariz, \"quer poupar um prisioneiro?\" [hostile_commander.GetSheHe|U] claramente aponta para [entourage_member.GetTitledFirstName]."
 travel_events.3140.t:0 "$travel_danger_prefix$ Uma Travessia Ruim"
 travel_events.3150.a.failure:0 "[rival_scope.GetFirstNameNoTooltip] vence a luta e vai embora"
 travel_events.3150.a.success:0 "Você vence a luta contra [rival_scope.GetFirstNameNoTooltip] e faz [rival_scope.GetSheHe] ir embora"
 travel_events.3150.a:0 "Você quer saber como é? Eu vou te mostrar!"
 travel_events.3150.b.success:0 "[travel_leader.GetFirstNameNoTooltip] vence a luta e faz [rival_scope.GetFirstNameNoTooltip] ir embora"
 travel_events.3150.b.tt:0 "[travel_leader.GetFirstName] adverte [rival_scope.GetFirstName]"
 travel_events.3150.b:0 "Mestre de Caravana [travel_leader.GetFirstNameNoTooltip], cuide disso."
 travel_events.3150.c:0 "Você vai terminar seus dias em uma masmorra."
 travel_events.3150.d:0 "Saia da minha vista. #EMP Agora.#!"
 travel_events.3150.desc:0 "Notei que [rival_scope.GetTitledFirstName] me evita mais do que o normal. [rival_scope.GetSheHe|U] sempre se senta na extremidade oposta da mesa quando somos convidados para um banquete e consistentemente recusa minha companhia durante o acampamento.\n\nNossa relação pode não ser a melhor, mas essa atitude está começando a me cansar, especialmente quando ouço [rival_scope.GetSheHe] me difamando: \"[ROOT.Char.GetFirstNameNoTooltip] é um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rival_scope'))] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival_scope'))], eu seria um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] muito melhor do que [ROOT.Char.GetSheHe].\" "
 travel_events.3150.e:0 "É o vento que eu estou ouvindo?"
 travel_events.3150.t:0 "Sussurros Estranhos"
 travel_events.3160.a:0 "[travel_leader.GetFirstNameNoTooltip]! Me ajude!"
 travel_events.3160.b:0 "Pegue esse pão! Me deixe em paz!"
 travel_events.3160.c.failure:0 "Os corvos conseguem te ferir"
 travel_events.3160.c.success:0 "Você espanta os corvos"
 travel_events.3160.c:0 "Eu vou mostrar para você!"
 travel_events.3160.desc_battle:0 "A terra está encharcada de sangue. Nossos passos se tornam mais lentos, como se estivéssemos atravessando um pântano. Cadáveres ainda estão espalhados, esperando para serem recolhidos. A maioria deles certamente perdeu suas posses mais importantes agora, mas alguns dos homens insistem em revistá-los.\n\nConforme nos aproximamos dos corpos, vemos que não somos os únicos tentando fazê-lo, e um grupo de corvos grasnam ruidosamente para nós, mergulhando então no ar para me atacar."
 travel_events.3160.desc_fallback:0 "A floresta continua sem fim. Assim como o caminho. Assim como eu. Passamos pelas primeiras árvores e é como se estivéssemos invadindo um domínio diferente; as criaturas, a noite. Abrimos caminho pela vegetação e conversamos animadamente sobre nossas viagens, vemos pássaros e vemos frutas.\n\nO ar agita as folhas e continuamos. Agora há mais ninhos nesses galhos.\n\nUm grupo de corvos grasna ruidosamente e mergulha no ar em direção a #EMP mim#!."
 travel_events.3160.desc_outro:0 "Cubro meu rosto com os braços e grito quando sinto seus bicos tentando entrar na minha pele."
 travel_events.3160.t:0 "$travel_danger_prefix$ Um Grupo de Corvos"
 travel_humiliation_modifier:0 "Humilhação de Insurreição"
 vigorous_dancer_modifier.desc:0 "O domínio deslumbrante deste personagem sobre as danças mais animadas os inspira a praticar frequentemente e a impressionar sempre que possível."
 vigorous_dancer_modifier:0 "Dançarino Vigoroso"
