l_spanish:
 every_faith_vassal:0 "Todo Vassalo [local_faith.GetAdjective]"
 travel_events.fp3.0020.a.flavor:0 "Investigar as cavernas pode trazer perigo ou revelar seus segredos"
 travel_events.fp3.0020.b.flavor:0 "[travel_leader.GetNameNoTooltip] nos insta a deixar essas cavernas para trás. Elas não são seguras"
 travel_events_fp3.0010.a.failure:0 "Os magos nos vencem"
 travel_events_fp3.0010.a.lightning.desc:0 "Lutar em uma tempestade pode ser perigoso e imprevisível"
 travel_events_fp3.0010.a.success:0 "Eu apago a chama deles"
 travel_events_fp3.0010.a:0 "Agrupe-os e apague a heresia deles!"
 travel_events_fp3.0010.b.failure:0 "Os magos nos vencem"
 travel_events_fp3.0010.b.success:0 "Você confisca a braseira"
 travel_events_fp3.0010.b:0 "Confisque a Braseira, o fogo estará mais seguro em minhas mãos!"
 travel_events_fp3.0010.c.failure:0 "O fogo se apaga"
 travel_events_fp3.0010.c.flavor:0 "Se conseguirmos proteger os peregrinos, eles mostrarão sua gratidão"
 travel_events_fp3.0010.c.success.desc:0 "Você ganha a gratidão dos Magos"
 travel_events_fp3.0010.c.success:0 "As brasas sobrevivem à tempestade"
 travel_events_fp3.0010.c:0 "Você pode se abrigar conosco!"
 travel_events_fp3.0010.d.flavor:0 "Você deixa os viajantes para a fé deles"
 travel_events_fp3.0010.d:0 "Esta tempestade é o julgamento de [ROOT.Char.GetFaith.HighGodName]."
 travel_events_fp3.0010.desc.intro:0 "Enquanto minha comitiva avança por uma tempestade repentina, vejo um grupo de magos armados caminhando na direção oposta. Eles carregam um palanquim com uma braseira de brasas moribundas entre eles. O vento e a chuva estão atingindo as chamas sagradas, arriscando apagá-las.\n\nEmbora suas mãos pairam cansadas sobre suas armas, os sacerdotes nos chamam, esperando que possamos ajudar a proteger suas brasas sagradas."
 travel_events_fp3.0010.t:0 "Brasas Moribundas"
 travel_events_fp3.0011.a:0 "Todos devem conhecer o poder inegável de [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]!"
 travel_events_fp3.0011.b:0 "Vou carregar esse milagre irrefutável secretamente em meu coração."
 travel_events_fp3.0011.c:0 "Isso é mera coincidência!"
 travel_events_fp3.0011.desc.intro:0 "Os magos travam uma luta corajosa, tentando proteger suas brasas sagradas enquanto nos afastamos. Mas, quando vejo uma chance, chuto o palanquim de suas mãos e a braseira rola para a lama, as brasas se apagando.\n\nZombamos e debochamos dos sacerdotes derrotados, mas nossa alegria é cortada abruptamente, enquanto o mundo se enche de luz e barulho furiosos. A imagem residual de um raio pisca diante de mim. Ao me levantar de um torpor atordoado, vejo que uma chama brilhante irrompe da braseira sagrada reacendida. Meus homens já estão fugindo em pânico extasiado."
 travel_events_fp3.0011.t:0 "Brasas Moribundas"
 travel_events_fp3.0012.a.failure:0 "Você é pego pelos Magos e exposto como ladrão"
 travel_events_fp3.0012.a.success:0 "Roubamos suas brasas enquanto eles dormiam"
 travel_events_fp3.0012.a:0 "Vou pegar suas brasas preciosas enquanto eles descansam..."
 travel_events_fp3.0012.b:0 "Sua sabedoria pode me servir bem."
 travel_events_fp3.0012.c:0 "Boa viagem."
 travel_events_fp3.0012.desc.intro:0 "Você e os magos encontram abrigo adequado em uma estrutura em ruínas. Depois de torcer suas roupas molhadas e garantir que a braseira e suas brasas estejam vivas e bem, o grupo relaxa. Parece que vocês vão esperar a tempestade juntos.\n\nO líder dos sacerdotes, [fp3_zoroastrian_armed_pilgrim.GetName], é uma pessoa conhecedora e tem muitas histórias para compartilhar."
 travel_events_fp3.0012.t:0 "Brasas Moribundas"
 travel_events_fp3.0020.a.failure.title:0 "Você cai e se machuca nos túneis escuros"
 travel_events_fp3.0020.a.failure:0 "Você perde o rastro da criança e acaba perdido nos túneis por dias"
 travel_events_fp3.0020.a.success.tooltip:0 "Você segue a criança e descobre segredos subterrâneos"
 travel_events_fp3.0020.a.success:0 "Você encontra a criança"
 travel_events_fp3.0020.a:0 "Siga aquela criança!"
 travel_events_fp3.0020.b.tt:0 "Sua jornada continua."
 travel_events_fp3.0020.b:0 "Devemos deixar este lugar."
 travel_events_fp3.0020.desc.intro:0 "Evitando o sol forte do meio-dia, montamos acampamento temporário dentro de uma caverna peculiar e muito úmida.\n\n\"Você ouviu isso, meu [ROOT.GetCharacter.GetTitleTierName|U]?\" [travel_leader.GetName] parece desconfortável com nosso abrigo escuro.\n\nAo me virar, me deparo subitamente com um[Select_CString( fp3_young_rascal.IsFemale, 'a', '' )] jovem [fp3_young_rascal.Custom('GirlBoy')] que de alguma forma conseguiu passar direto por [travel_leader.GetNameNoTooltip]. A criança assustada desaparece imediatamente mais fundo nas cavernas."
 travel_events_fp3.0020.t:0 "Um Encontro Incomum"
 travel_events_fp3.0021.a.artifact:0 "Encontro um artefato antigo"
 travel_events_fp3.0021.a.failure.desc:0 "Você quase se afoga em água parada"
 travel_events_fp3.0021.a.failure.t:0 "A única coisa que peguei foi um resfriado"
 travel_events_fp3.0021.a.success.desc:0 "Você encontra um tesouro antigo"
 travel_events_fp3.0021.a.success.t:0 "Você trouxe à tona um [newly_created_artifact.GetName]"
 travel_events_fp3.0021.a:0 "Vamos mergulhar em busca do tesouro escondido nessas águas."
 travel_events_fp3.0021.b.failure.desc:0 "Isso está além de você"
 travel_events_fp3.0021.b.failure.t:0 "O problema escapa de você"
 travel_events_fp3.0021.b.success.desc:0 "Você estuda o Qanat"
 travel_events_fp3.0021.b.success.t:0 "Você aprende alguns segredos de irrigação"
 travel_events_fp3.0021.b:0 "Posso aprender algo estudando esta estrutura."
 travel_events_fp3.0021.c:0 "[fp3_young_rascal.Custom('GirlBoy')|U], você deve aprender a respeitar seus superiores!"
 travel_events_fp3.0021.desc:0 "Adentramos cada vez mais fundo na terra, deixando para trás a paisagem iluminada pelo sol para túneis cada vez mais úmidos e escuros.\n\nQuando finalmente alcanço [Select_CString( fp3_young_rascal.IsFemale, 'a', 'o' )] [fp3_young_rascal.Custom('GirlBoy')], sou distraído por uma visão esplêndida. Um antigo sistema de canais subterrâneos se estende até onde a vista alcança.\n\n\"Bem-vindo, [ROOT.Char.GetTitleAsName], ao meu próprio palácio. Provavelmente é maior do que o seu.\" [fp3_young_rascal.GetSheHe|U] me olha desafiadoramente, claramente chateado por eu ter conseguido seguir [fp3_young_rascal.GetSheHe] até aqui."
 travel_events_fp3.0021.t:0 "Qanats de [ROOT.Char.GetCurrentLocation.GetCounty.GetName]"
 travel_events_fp3.0030.a:0 "Isso é bárbaro, vamos enterrar esses corpos!"
 travel_events_fp3.0030.b:0 "Espero que eu vá assim, com o Nasu purificado de meu corpo..."
 travel_events_fp3.0030.c:0 "Imagine ascender aos céus, levado por essas asas poderosas..."
 travel_events_fp3.0030.d:0 "A morte vem para todos nós."
 travel_events_fp3.0030.d_flavor:0 "Passe um tempo refletindo sobre a morte e depois saia do local"
 travel_events_fp3.0030.desc.intro:0 "Aves de rapina circulam acima, lançando sombras sombrias sobre a paisagem castigada pelo sol. Enquanto eu subo a encosta de uma colina imponente, o cheiro de carne estragada domina meus sentidos.\n\nVejo corpos dispostos ordenadamente nas rochas. Abutres e falcões puxam a carne, pedaços ensanguentados e fibrosos penduram-se de seus bicos. Um homem vestido de maneira simples supervisiona o sepultamento celestial. Ele faz gestos para mim.\n\n\"Por favor, retire-se, [ROOT.Char.GetTitleAsNameNoTooltip], este lugar é apenas para Nusessalars...\""
 travel_events_fp3.0030.e.tooltip:0 "Você terá a chance de treinar a ave."
 travel_events_fp3.0030.e:0 "Encontre-me o falcão mais jovem, eu o treinarei para usos melhores."
 travel_events_fp3.0030.t:0 "Um Banquete para Falcões"
 travel_events_fp3.0031.a.failure.desc:0 "O pássaro permanece feroz"
 travel_events_fp3.0031.a.failure.t:0 "O falcão mantém seu apetite por carne humana"
 travel_events_fp3.0031.a.success.desc:0 "O treinamento é bem-sucedido"
 travel_events_fp3.0031.a.success.t:0 "O pássaro da Torre do Silêncio se torna um falcão de caça"
 travel_events_fp3.0031.a:0 "Tenho certeza de que posso corrigir esse comportamento."
 travel_events_fp3.0031.b:0 "Posso nutrir essas tendências..."
 travel_events_fp3.0031.c:0 "É melhor eu me livrar dessa besta."
 travel_events_fp3.0031.d.tt:0 "Esta opção está disponível devido à sua cultura ter a [culture_tradition|E] $tradition_ep2_avid_falconers_name$"
 travel_events_fp3.0031.d:0 "Qualquer [ROOT.Char.GetWomanMan] [ROOT.Char.GetCulture.GetPrefixNoTooltip] sabe como domar até mesmo a ave mais feroz."
 travel_events_fp3.0031.desc.intro:0 "Decidi treinar o falcão que encontrei no local do sepultamento no céu. Para isso, nos reunimos no campo com um pequeno séquito, incluindo [falcon_victim.GetName], m[Select_CString( falcon_victim.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', falcon_victim)], que está pronto com uma lebre capturada. O jovem pássaro encapuzado espera expectante em minha mão enluvada.\n\n[falcon_victim.GetNameNoTooltip] solta a presa, que corre pelo campo aberto. Retiro a capa do falcão, e ele rapidamente alça voo. No entanto, em vez de mergulhar pela presa, ele se lança em direção à cabeça de [falcon_victim.GetNameNoTooltip]. Antes que possa ser afastado, o falcão morde e arranha [falcon_victim.GetSheHe], deixando garras ensanguentadas."
 travel_events_fp3.0031.t:0 "Banquete para Falcões"
 travel_events_fp3.0040.a:0 "Agradeço a eles em sua língua nativa, à nossa saúde!"
 travel_events_fp3.0040.ab.tt:0 "Esta opção está disponível porque você fala [fp3_turkic_traveler.GetCulture.GetLanguage.GetNameNoTooltip]"
 travel_events_fp3.0040.b:0 "Em sua língua nativa, ordeno que sejam aprisionados."
 travel_events_fp3.0040.c.failure.t:0 "Eu fui sedado e roubado!"
 travel_events_fp3.0040.c.failure:0 "Você é sedado e roubado"
 travel_events_fp3.0040.c.success.t:0 "O kumis estava delicioso!"
 travel_events_fp3.0040.c.success:0 "O kumis é delicioso"
 travel_events_fp3.0040.c:0 "Não deveria ser tão desconfiado"
 travel_events_fp3.0040.d:0 "Leite de égua? Isso é repulsivo."
 travel_events_fp3.0040.desc.intro.a:0 "\n\"Por que estamos desperdiçando bom #EMP kumis#! com esse estranho?\"\n\nEles claramente acreditam que não consigo entender sua fala, mas pelo menos não estão me servindo veneno."
 travel_events_fp3.0040.desc.intro.b:0 "\n\"Eu vou pegar primeiro as coisas dele! Aqueles bons sapatos me servem muito bem.\"\n\nEles claramente acreditam que não consigo entender sua fala. Pena para eles: agora sei suas intenções malignas."
 travel_events_fp3.0040.desc.intro.c:0 "Mas eu não entendo a língua estranha deles. Espero que tenham boas intenções..."
 travel_events_fp3.0040.desc.intro:0 "Nosso caminho nos leva a um acampamento considerável de viajantes turcos. O grupo nos faz um gesto amigável para que nos aproximemos. Um[Select_CString( fp3_turkic_traveler.IsFemale, 'a', '' )] [fp3_turkic_traveler.GetWomanMan] durão mexe um líquido espesso e branco em uma panela. [fp3_turkic_traveler.GetSheHe|U] despeja um pouco em uma tigela pequena e me entrega.\n\n\"#EMP Kumis!#! É ótimo para os intestinos!\"\n\nOutros dois me observam e sussurram entre si em sua própria língua, com o volume suficientemente alto para que eu consiga ouvi-los."
 travel_events_fp3.0040.e:0 "Vamos pedir para que est[Select_CString( fp3_turkic_traveler.IsFemale, 'a', 'e' )] [fp3_turkic_traveler.GetWomanMan] nos ensine suas maneiras."
 travel_events_fp3.0040.t:0 "Leite de Égua"
 travel_events_fp3.0050.a:0 "Não há futuro para aqueles que desconsideram o passado."
 travel_events_fp3.0050.b.entourage:0 "S[Select_CString( entourage_helper.IsFemale, 'ua', 'eu' )] companheir[Select_CString( entourage_helper.IsFemale, 'a', 'o' )] de viagem [entourage_helper.GetName] o ajuda a examinar o saque."
 travel_events_fp3.0050.b.failure.desc:0 "Nada especial chama sua atenção"
 travel_events_fp3.0050.b.failure.t:0 "Você conseguiu alguns bibelôs valiosos"
 travel_events_fp3.0050.b.success.desc:0 "Você escolhe um tesouro precioso"
 travel_events_fp3.0050.b.success.tooltip:0 "Você adquire um tesouro antigo"
 travel_events_fp3.0050.b:0 "[Select_CString( ROOT.Char.IsFemale, 'A', 'O' )] [ROOT.Char.GetTitleAsNameNoTooltip] merece a sua parte!"
 travel_events_fp3.0050.c:0 "Não tenho tempo para camponeses."
 travel_events_fp3.0050.desc.intro:0 "Ao virar uma curva no caminho, encontramos um grupo de pessoas cobertas de poeira, saindo do que deve ter sido uma impressionante tumba. Eles carregam sacos de estopa que tilintam e fazem barulho, pesados pelos objetos que desenterraram do antigo edifício.\n\n\"Os tempos estão difíceis, poderoso [ROOT.Char.GetTitleAsNameNoTooltip]! Nossas famílias precisam ser alimentadas e não estamos prejudicando ninguém entre os vivos.\""
 travel_events_fp3.0050.t:0 "Saqueadores de Túmulos"
 zoroastrian_brazier_desc:0 "Um $zoroastrian_brazier_name$ resgatado de magos incompetentes no meio de uma tempestade feroz, as brasas daquele dia ainda estão acesas"
 zoroastrian_brazier_name:0 "Braseiro [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdjective]"
