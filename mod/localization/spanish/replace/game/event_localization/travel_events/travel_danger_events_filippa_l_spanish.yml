l_spanish:
 every_patient_entourage_tt:0 "Cada membro do séquito [GetTrait('patient').GetName( GetNullCharacter )]"
 travel_danger_events.4000.a.failure.desc:0 "[overboard_character.GetShortUIName] afoga-se"
 travel_danger_events.4000.a.failure.t:0 "Morte"
 travel_danger_events.4000.a.saved.desc:0 "A tripulação vasculha as ondas e salva [overboard_character.GetShortUIName]"
 travel_danger_events.4000.a.saved.t:0 "Salvo"
 travel_danger_events.4000.a.wounded.desc:0 "A tripulação salva [overboard_character.GetShortUIName], mas [overboard_character.GetSheHe] ficou ferido na queda"
 travel_danger_events.4000.a.wounded.t:0 "Salvo, Mas Ferido"
 travel_danger_events.4000.a:0 "Precisamos salvar [overboard_character.GetSheHe]!"
 travel_danger_events.4000.a_again:0 "Não de novo! Salve [overboard_character.GetSheHe]!"
 travel_danger_events.4000.a_seriously:0 "Sério? [overboard_character.GetFirstNameNoTooltip], aguente firme!"
 travel_danger_events.4000.b.flavor:0 "[overboard_character.GetFirstNameNoTooltip] #EMP precisa#! sobreviver a isso!"
 travel_danger_events.4000.b:0 "Não há tempo! Eu vou salvar [overboard_character.GetSheHe] eu mesmo!"
 travel_danger_events.4000.b_travel_leader:0 "[travel_leader.GetFirstNameNoTooltip], rápido!"
 travel_danger_events.4000.c.flavor:0 "Os ventos favoráveis nos farão ir mais rápido!"
 travel_danger_events.4000.c:0 "É tarde demais."
 travel_danger_events.4000.desc.again:0 "O mar não está sendo gentil conosco em nosso caminho para [destination.GetNameNoTooltip]. À medida que continuamos a enfrentar turbulências em nossa travessia marítima, assim que o capitão grita o aviso, as pessoas se apressam para se mover abaixo do convés desta vez.\n\nNo entanto, [overboard_character.GetTitledFirstName] ficou tempo demais e cai ao mar com um baixo #EMP splash#!!"
 travel_danger_events.4000.desc.seriously:0 "De alguma forma, devemos ter invocado a fúria de [ROOT.Char.GetFaith.WaterGodName]; o mar está novamente furioso e as pessoas se apressam para se abrigar abaixo do convés, antes mesmo que o capitão tenha tempo para gritar o aviso.\n\nEnquanto eu me apresso para o convés inferior, vejo [overboard_character.GetTitledFirstName] tropeçar em uma corda solta da amurada. Um membro da tripulação corre para o lado [overboard_character.GetHerHim], mas é tarde demais e, com o próximo balanço da embarcação, [overboard_character.GetFirstNameNoTooltip] mergulha nas profundezas!"
 travel_danger_events.4000.desc:0 "As águas agitadas seriam suficientes para deixar qualquer marinheiro experiente enjoado. Enquanto balançamos para frente e para trás nas ondas, as pessoas no navio estão lentamente buscando abrigo abaixo.\n\nEu percebo [overboard_character.GetTitledFirstName] olhando sobre a amurada antes de se dirigir ao convés inferior — mas antes que alguém tenha tempo para reagir, o navio se inclina de lado e [overboard_character.GetSheHe] cai nas águas escuras."
 travel_danger_events.4000.t:0 "$travel_danger_prefix$ [overboard_character.GetWomanMan|U] Cai ao Mar!"
 travel_danger_events.4010.a:0 "Devemos deixar [ill_character.GetSheHe] descansar e se recuperar totalmente."
 travel_danger_events.4010.a_sea:0 "Encontre um porto para que [ill_character.GetFirstNameNoTooltip] possa descansar e se recuperar totalmente."
 travel_danger_events.4010.b.cured.desc:0 "[ill_character.GetSheHe|U] está totalmente recuperado"
 travel_danger_events.4010.b.cured.t:0 "Curado"
 travel_danger_events.4010.b.flavor:0 "Um ramo disso, uma pitada daquilo..."
 travel_danger_events.4010.b.tt:0 "[ill_character.GetShortUINamePossessive] desenvolve [GetTrait('pneumonic').GetName( GetNullCharacter )]"
 travel_danger_events.4010.b.worsened.desc:0 "A condição [ill_character.GetHerHim|U] piora"
 travel_danger_events.4010.b.worsened.t:0 "Condição Piorou"
 travel_danger_events.4010.b:0 "Acho que sei uma cura."
 travel_danger_events.4010.c:0 "[medicine_person.GetTitledFirstNameNoTooltip], você pode tratar [ill_character.GetSheHe]?"
 travel_danger_events.4010.d.failure.desc:0 "[ill_character.GetSheHe|U] descobre"
 travel_danger_events.4010.d.failure.t:0 "Descoberto"
 travel_danger_events.4010.d.flavor:0 "Uma oportunidade para se livrar [ill_character.GetHerHim] de uma vez por todas!"
 travel_danger_events.4010.d.poisoned.desc:0 "Você envenena [ill_character.GetSheHe] com sucesso"
 travel_danger_events.4010.d.poisoned.t:0 "Morte"
 travel_danger_events.4010.d:0 "Bem, agora, eu tenho exatamente #EMP o que é necessário...#!"
 travel_danger_events.4010.desc:0 "Viajar por ambientes, por vezes, hostis tem efeitos revigorantes pelo menos no #EMP meu#! estado mental e vigor.\n\nAo olhar para [ill_character.GetTitledFirstName], no entanto, [ill_character.GetSheHe] não parece estar tão bem. Seu movimento é difícil, sua respiração pesada e surtos espontâneos de tosse percorrem seu corpo — claramente [ill_character.GetSheHe] não está bem."
 travel_danger_events.4010.desc_again:0 "Estamos prestes a desarmar o acampamento pela manhã, a caminho de [destination.GetNameNoTooltip], quando encontro [ill_character.GetTitledFirstName] em seu alojamento, respirando pesadamente e pálido como um lençol. [ill_character.GetSheHe|U] faz uma careta sob minha análise, e solta uma tosse estrondosa.\n\nSerá que [ill_character.GetFirstNameNoTooltip] também contraiu algo? Isso é uma epidemia?"
 travel_danger_events.4010.desc_sea:0 "À medida que navegamos em direção a [destination.GetNameNoTooltip], o ar fresco do mar está fazendo maravilhas pelo menos na minha #EMP saúde e bem-estar. No entanto, nem todos têm tanta sorte.\n\nTenho percebido como [ill_character.GetTitledFirstName] tem se deteriorado nos últimos dias, e agora não há dúvida de que [ill_character.GetSheHe] contraiu alguma doença."
 travel_danger_events.4010.desc_sea_again:0 "Estamos fazendo bom progresso em direção a [destination.GetNameNoTooltip], o que eu acho muito revigorante. No entanto, parece que m[Select_CString( ill_character.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('ill_character'))], [ill_character.GetTitledFirstName], está experimentando o oposto.\n\nEsta manhã, encontrei [ill_character.GetSheHe] — apoiado pesadamente na amurada, com uma tosse rouca — e claramente [ill_character.GetSheHe] também parece ter contraído algo. Isso é uma epidemia?"
 travel_danger_events.4010.e.flavor:0 "Já vi piores."
 travel_danger_events.4010.e.no_change.t:0 "Sem Mudança"
 travel_danger_events.4010.e.pneumonic.t:0 "Pneumonia"
 travel_danger_events.4010.e:0 "É só uma pequena tosse."
 travel_danger_events.4010.t:0 "$travel_danger_prefix$ Tudo Está Bem"
