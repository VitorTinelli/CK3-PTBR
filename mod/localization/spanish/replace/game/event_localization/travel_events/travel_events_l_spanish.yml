 travel_event_prefix:0 "Viagem:"
 travel_events.0010.a:0 "[predecessor.GetSheHe|U] não merecia morrer tão longe de casa..."
 travel_events.0010.at_destination:0 "[predecessor.GetSheHe|U] estava em [predecessor_location.GetName] "
 travel_events.0010.desc:0 "$travel_events.0011.desc$\""
 travel_events.0010.from_activity:0 "[predecessor.GetSheHe|U] estava voltando para casa na província de [predecessor_location.GetName] após visitar [travel_destination.GetNameNoTooltip] "
 travel_events.0010.intro:0 "Estou sentado à minha mesa, prestes a quebrar meu jejum, mas toda a fome me abandonou. Algo parece errado e sei que é verdade quando vejo m[Select_CString( messenger.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe',messenger)], [messenger.GetFirstNameNoTooltip], se aproximando sombriamente.\n\n\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip], um mensageiro chegou na noite trazendo notícias dolorosas,\" diz [messenger.GetSheHe] suavemente.\n\n\"Eu temo... eu temo que s[Select_CString( predecessor.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('RelationToMe',predecessor)], [predecessor.GetTitledFirstNameNoTooltip], [predecessor.GetDeathReason]. "
 travel_events.0010.t:0 "Fim da Estrada"
 travel_events.0010.to_activity:0 "[predecessor.GetSheHe|U] estava em [predecessor_location.GetName] na estrada em direção a [travel_destination.GetNameNoTooltip] "
 travel_events.0011.desc:0 "quando [predecessor.GetSheHe] faleceu. Minhas sinceras condolências, [ROOT.Char.Custom('FormOfAddressForLiege')]."
 travel_events.0011.desc_opening:0 "[messenger.Custom2('AppropriateGreeting', ROOT.Char)]"
 travel_events.0011.intro:0 "Lamento escrever com notícias tão graves, mas acabamos de receber a informação de que s[Select_CString( predecessor.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('RelationToMe',predecessor)], [predecessor.GetTitledFirstNameNoTooltip], [predecessor.GetDeathReason].\n\n"
 travel_events.0050.a:0 "Aqui fora, eu sou verdadeiramente livre."
 travel_events.0050.adventurer:0 "Desde que parti de [ROOT.Char.GetTravelPlan.GetData.GetDepartureLocation.GetName] [ROOT.Char.Custom('GetPeriodOfTimeWord')] atrás"
 travel_events.0050.desc:0 "Vi altos e baixos ― me regozijei com o vento soprando através dos meus cabelos e lamentei as pedras nos meus sapatos.\n\nHá tantos lugares, tantas coisas que ainda tenho para ver. Lá fora, na estrada aberta, me sinto livre da confinamento da [ROOT.Char.Custom('GetCourt')], ainda que por um pouco de tempo.\n\nAs estradas estão cheias de peregrinos e vagabundos, talvez seja entre #EMP eles#! que encontrarei paz de espírito.\n\n"
 travel_events.0050.landed:0 "Desde que deixei minha casa [ROOT.Char.Custom('GetPeriodOfTimeWord')] atrás"
 travel_events.0050.t:0 "Chamado da Estrada"
 travel_events.1000.a:0 "Arranje sapatos para [shoeless_peasant.GetSheHe]!"
 travel_events.1000.b:0 "Talvez [shoeless_peasant.GetSheHe] gostaria de se juntar a nós?"
 travel_events.1000.c:0 "Não é realmente um problema meu, não é mesmo?"
 travel_events.1000.desc:0 "Enquanto a procissão segue pelo [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], avisto um camponês caminhando ao lado da estrada sem sapatos. Os pés [shoeless_peasant.GetHerHim|U] estão ensanguentados e inchados: [shoeless_peasant.GetSheHe|U] claramente deve ter caminhado por muito tempo.\n\nAo passar por [shoeless_peasant.GetSheHe], olho atentamente para o rosto [shoeless_peasant.GetHerHim], os olhos tristes, a careta de dor. Talvez eu possa ajudar de alguma forma? "
 travel_events.1000.t:0 "Alma Desafortunada"
 travel_events.1001.a:0 "Eu aceito com gratidão."
 travel_events.1001.c:0 "Vamos seguir adiante como amigos!"
 travel_events.1001.desc.outro.poet:0 "\n\nParece que ess[Select_CString( shoeless_peasant.IsFemale, 'a', 'e' )] [shoeless_peasant.GetWomanMan] não é [Select_CString( shoeless_peasant.IsFemale, 'uma camponesa', 'um camponês' )] afinal, mas sim um poeta de grande renome!"
 travel_events.1001.desc.outro:0 "\n\nParece que ess[Select_CString( shoeless_peasant.IsFemale, 'a', 'e' )] [shoeless_peasant.GetWomanMan] não é um camponês afinal, mas sim um nobre de grande riqueza!"
 travel_events.1001.desc:0 "Agora com sapatos cobrindo os pés calejados [shoeless_peasant.GetHerHim], o camponês me dá um sorriso de sabedoria e anda ao meu lado.\n\n\"Você é um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip|U] bo[Select_CString( ROOT.Char.IsFemale, 'a', 'm' )] e gentil, e essa bondade será recompensada! Eu sou [shoeless_peasant.GetName] da casa [shoeless_peasant.GetDynastyName] e sempre recompensarei aqueles de corações bondosos.\""
 travel_events.1001.title:0 "Um Nobre Disfarçado!"
 travel_events.1002.a:0 "Como eu poderia saber?"
 travel_events.1002.desc:0 "Enquanto passamos, o camponês agarra minhas roupas com suas mãos sujas e olha profundamente em meus olhos.\n\n\"Esse não é um comportamento condizente com um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip|U], não é mesmo? Se você soubesse quem eu sou, não teria me deixado prosseguir assim!\"\n\n[shoeless_peasant.GetSheHe|U] revela [shoeless_peasant.GetHerselfHimself] como um nobre da casa [shoeless_peasant.GetDynastyName] e parece agora me olhar com o mais alto desdém."
 travel_events.1002.title:0 "$travel_events.1001.title$"
 travel_events.1003.a.failure:0 "Você ainda terá que lutar para seguir em frente."
 travel_events.1003.a.success:0 "Intimidados, eles permitem que você passe."
 travel_events.1003.a:0 "Ah, claro, o pedágio."
 travel_events.1003.b:0 "Talvez vocês aceitem pagamento em sangue?"
 travel_events.1003.c:0 "Pedágios são para camponeses e eu sou um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip]."
 travel_events.1003.desc:0 "Nós ficamos na estrada um pouco tempo demais e o sol está começando a se pôr abaixo do horizonte. Figuras enfurecidas e armadas começam a se formar a partir do terreno ao redor.\n\n\"Esta estrada tem um pedágio, pague logo\", diz o maior e francamente o mais feio do grupo.\n\nM[Select_CString( travel_leader.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('travel_leader'))] [travel_leader.GetFirstName] avança com a arma erguida e olha para mim em busca de direção."
 travel_events.1003.t:0 "$travel_danger_prefix$ Cobradores de Pedágio"
 travel_events.1005.a.tt.failure:0 "Seu Mestre de Caravana morre tentando salvar o artefato."
 travel_events.1005.a.tt.success:0 "Seu Mestre de Caravana salva com sucesso o artefato."
 travel_events.1005.a:0 "Salve-o!"
 travel_events.1005.b:0 "Não vale o risco."
 travel_events.1005.desc:0 "Fortes rajadas e chuvas persistentes mantiveram o navio balançando por horas e, enquanto estou de pé no convés, segurando firmemente o mastro, vejo o baú contendo meu [overboard_artifact.GetName] solto!\n\nEstou muito longe para salvá-lo sozinho, mas [travel_leader.GetFirstName] está ao alcance. No entanto, [travel_leader.GetSheHe] estaria em risco de cair na água."
 travel_events.1005.t:0 "$travel_danger_prefix$ Pedágio do [ROOT.Char.GetFaith.WaterGodNamePossessive]"
 travel_events.1010.a.aptitude:0 "A [aptitude|E] de [great_travel_leader_option.GetFirstNameNoTooltip] [great_travel_leader_option.GetCourtPositionAptitude( GetCourtPositionType( 'travel_leader_court_position' ) )]"
 travel_events.1010.a:0 "[great_travel_leader_option.GetNameNoTooltip] é uma ótima escolha."
 travel_events.1010.b.aptitude:0 "A [aptitude|E] de [good_travel_leader_option.GetFirstNameNoTooltip] [good_travel_leader_option.GetCourtPositionAptitude( GetCourtPositionType( 'travel_leader_court_position' ) )]"
 travel_events.1010.b:0 "[good_travel_leader_option.GetNameNoTooltip] servirá."
 travel_events.1010.c:0 "Nenhuma dessas escolhas é adequada."
 travel_events.1010.desc:0 "Conforme minha solicitação, meus servos reuniram duas opções para que eu considere para o papel de Mestre de Caravana. Diz-se que [great_travel_leader_option.GetName] é o mais experiente dos dois, mas é claro que [good_travel_leader_option.GetName] é mais barato."
 travel_events.1010.t:0 "[GetCourtPositionType('travel_leader_court_position').GetNameNoTooltip()]"
 travel_events.1020.a.aptitude:0 "A [aptitude|E] de [temp_caravan_master_option_1.GetFirstNameNoTooltip] [temp_caravan_master_option_1.GetCourtPositionAptitude( GetCourtPositionType( 'travel_leader_court_position' ) )]"
 travel_events.1020.a:0 "Vou escolher [temp_caravan_master_option_1.GetFirstNameNoTooltip]."
 travel_events.1020.b.aptitude:0 "A [aptitude|E] de [temp_caravan_master_option_2.GetFirstNameNoTooltip] [temp_caravan_master_option_2.GetCourtPositionAptitude( GetCourtPositionType( 'travel_leader_court_position' ) )]"
 travel_events.1020.b:0 "[temp_caravan_master_option_2.GetFirstNameNoTooltip|U] servirá perfeitamente."
 travel_events.1020.desc.fallback:0 "Infelizmente, não confiaria a nenhum desses incompetentes para encontrarem o caminho de casa do mercado, quanto mais para liderar uma jornada até [next_destination.GetName]. Felizmente, dois moradores locais ofereceram seus serviços."
 travel_events.1020.desc.one_entourage_member:0 "Há apenas um em minha comitiva que poderia assumir o cargo: [temp_caravan_master_option_1.GetFirstName], m[Select_CString( temp_caravan_master_option_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort',temp_caravan_master_option_1)]. Um local chamado [temp_caravan_master_option_2.GetName] também ofereceu seus serviços, no entanto."
 travel_events.1020.desc.two_entourage_members:0 "De fato, há dois que poderiam facilmente preencher o lugar de [old_travel_leader.GetFirstNameNoTooltip]: ou [temp_caravan_master_option_1.GetName], m[Select_CString( temp_caravan_master_option_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort',temp_caravan_master_option_1)], ou [temp_caravan_master_option_2.GetName], m[Select_CString( temp_caravan_master_option_2.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort',temp_caravan_master_option_2)], ambos me serviriam bem em caso de necessidade."
 travel_events.1020.intro.fallback:0 "Com a posição de [GetCourtPositionType('travel_leader_court_position').GetName()] agora vaga, olho para minha comitiva. Há alguém que possa servir bem, pelo menos até eu estar de volta e possa procurar um substituto adequado?\n\n"
 travel_events.1020.intro.prev_leader_dead:0 "Meu antigo [GetCourtPositionType('travel_leader_court_position').GetName()] [old_travel_leader.GetFirstName] deixou esta mortalha quando [old_travel_leader.GetSheHe] [old_travel_leader.GetDeathReason]. É meu dever escolher alguém para liderar minha comitiva.\n\n"
 travel_events.1020.t:0 "Um Novo [GetCourtPositionType('travel_leader_court_position').GetNameNoTooltip()]"
 travel_events.2200.a.desc:0 "Sua comitiva inteira atropela [local_knight.GetName]"
 travel_events.2200.a.failure.tt:0 "[adult_victim.GetName] foi acidentalmente atropelado por sua comitiva"
 travel_events.2200.a.failure:0 "Carga quase bem-sucedida!"
 travel_events.2200.a.success.tt:0 "[local_knight.GetName] foi rapidamente atropelado por sua comitiva"
 travel_events.2200.a.success:0 "Carga bem-sucedida!"
 travel_events.2200.a:0 "Eu não tenho interesse em você nem em uma luta justa."
 travel_events.2200.b.failure:0 "[local_knight.GetName] vence a luta!"
 travel_events.2200.b.success:0 "Você vence a luta!"
 travel_events.2200.b:0 "Você pode ser menos valioso depois que eu ganhar!"
 travel_events.2200.c.failure:0 "[local_knight.GetNameNoTooltip] vence a luta!"
 travel_events.2200.c.success:0 "[travel_duel_champion.GetName] vence a luta!"
 travel_events.2200.c:0 "[travel_duel_champion.GetTitledFirstNameNoTooltip] mostrará a você como é feito."
 travel_events.2200.desc:0 "Um[Select_CString( local_knight.IsFemale, 'a', '' )] [local_knight.GetWomanMan] imponente está parado na estrada à nossa frente.\n\n\"Eu sou [local_knight.GetName], de [local_knight.GetCurrentLocation.GetNameNoTooltip]! Eu venci dezenas de [ROOT.Char.GetWomenMen] em combate! E honestamente, todas aquelas lutas foram entediantes. Então, aqui estou eu, nesta estrada, procurando alguém melhor do que eu, alguém de quem eu possa aprender.\n\nSe você puder me vencer em combate, eu me tornarei um servo valioso e leal. E assim, neste dia, exijo encontrar um de vocês em um combate justo!\""
 travel_events.2200.t:0 "Um Duelo Exigido"
 travel_events.4000.a:0 "Me diga meu futuro, sábio."
 travel_events.4000.b:0 "Venha experimentar o futuro #EMP comigo#!."
 travel_events.4000.c:0 "Não estou interessado."
 travel_events.4000.d:0 "Feche a tenda e queime essa bruxa!"
 travel_events.4000.desc.intro:0 "Viajando por [ROOT.Char.GetCurrentLocation.GetName], passo por uma tenda de aparência peculiar aberta com seu ainda mais peculiar ocupante dentro.\n\n\"Entre, oh poderos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip|U]."
 travel_events.4000.desc.mid.long_to_go:0 "Posso ver que você tem muitas milhas a percorrer,"
 travel_events.4000.desc.mid.travelled_far:0 "Posso ver que você veio de muito longe,"
 travel_events.4000.desc.outro:0 "e posso lhe oferecer uma leitura de suas futuras viagens, por um preço modesto.\"\n\n[Select_CString( mystic_scope.IsFemale, 'A', 'O' )] [mystic_scope.GetWomanMan] estranh[Select_CString( mystic_scope.IsFemale, 'a', 'o' )] despertou o interesse do meu séquito, mas estou disposto a pagar por uma 'leitura'?"
 travel_events.4000.t:0 "Das Viagens que Virão"
 travel_events.4001.a:0 "Junte-se a mim."
 travel_events.4001.b:0 "Aqui, um pouco de moedas por sua lealdade."
 travel_events.4001.c:0 "Volte para a sarjeta de onde você veio."
 travel_events.4001.desc:0 "Meu séquito passa por [ROOT.Char.GetCurrentLocation.GetName] sem problemas, até que ouço alguma comoção vindo de perto dos meus guardas. Eventualmente, um estranho consegue se abrir caminho e ficar ao meu lado, sorrindo como se fosse abençoado por [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself].\n\n\"Por [loyal_fan_scope.GetFaith.random_GoodGodNames]! Por [loyal_fan_scope.GetFaith.random_GoodGodNames]! Por [loyal_fan_scope.GetFaith.random_GoodGodNames]! É [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip|U] do [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]! Desejo nada mais do que servi-lo incondicionalmente pelo resto da minha vida!\"\n\nMeus guardas estão prontos para jogar [loyal_fan_scope.GetSheHe] de volta na lama, mas [loyal_fan_scope.GetSheHe] certamente se tornaria um cortesão leal."
 travel_events.4001.t:0 "O Fanático"
 travel_events.4002.a:0 "Minha nova paixão."
 travel_events.4002.b:0 "[local_beauty_scope.GetSheHe|U] deve estar ao meu lado para sempre."
 travel_events.4002.c:0 "Nós devemos nos casar imediatamente!"
 travel_events.4002.d:0 "Infelizmente, não posso dar meu amor tão facilmente."
 travel_events.4002.desc:0 "Eu vi o mundo e testemunhei suas muitas maravilhas em minhas viagens, mas nunca vi tamanhas belezas como as que vi em [ROOT.Char.GetCurrentLocation.GetName]. Verdadeiramente, [local_beauty_scope.GetWomenMen] da [local_beauty_scope.GetCulture.GetName] são um corte acima de todos os outros.\n\nUm espécime particularmente fascinante chamou minha atenção ultimamente, um[Select_CString( local_beauty_scope.IsFemale, 'a', '' )] [local_beauty_scope.GetWomanMan] pelo nome de [local_beauty_scope.GetName].\n\nUma bela [local_beauty_scope.Custom('LoverPetName')], [local_beauty_scope.GetSheHe] é muito agradável aos meus olhos para passar seus dias trabalhando duro em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]."
 travel_events.4002.t:0 "[local_beauty_scope.GetWomenMen|U] [local_beauty_scope.GetCulture.GetNameNoTooltip]"
 travel_events.4003.a:0 "Nós os enfrentaremos!"
 travel_events.4003.b:0 "Deixe-os levar o que quiserem."
 travel_events.4003.c:0 "Tente perdê-los na neblina!"
 travel_events.4003.d:0 "Minha lábia fará deles meus aliados!"
 travel_events.4003.defeated_by_vikings:0 "Você foi derrotado por [viking_scope.GetFirstName]"
 travel_events.4003.defeated_vikings:0 "Você derrotou [viking_scope.GetFirstName]"
 travel_events.4003.desc.berber_pirate:0 "Um grande navio carregado de espólios emerge no horizonte, com uma tripulação de piratas berberes brandindo suas lâminas, pronta para atacar!"
 travel_events.4003.desc.intro:0 "Os mares estão envoltos em neblina, rochas e ondas materializando e desaparecendo em um piscar de olhos. Uma silhueta monstruosa aparece no horizonte, e tudo parece calmo até que a grande besta emerge da névoa para a visão clara.\n\n"
 travel_events.4003.desc.regular_pirate:0 "Um navio cheio até a borda de bandidos e ladrões esfarrapados se aproxima de nós, seus sorrisos desdentados ansiosos para pegar nossas riquezas."
 travel_events.4003.desc.viking:0 "A cabeça de um dragão se aproxima de nosso navio, com uma tripulação feroz de nortenhos torcendo em suas costas!"
 travel_events.4003.offer_accepted:0 " [viking_scope.GetFirstName] aceita sua oferta"
 travel_events.4003.offer_refused:0 " [viking_scope.GetFirstName] recusa sua oferta"
 travel_events.4003.t:0 "Um Monstro no Horizonte"
 travel_events.4004.a:0 "Nós comeremos bem esta noite!"
 travel_events.4004.b:0 "Seus peixes ou sua vida, marinheiro!"
 travel_events.4004.c:0 "Não hoje."
 travel_events.4004.desc:0 "Ouvi dizer que os pescadores [fishermen_county_scope.GetCountyData.GetCulture.GetName] são famosos em todo o mundo por sua habilidade em saquear o oceano de seus mais abundantes e deliciosos despojos. Hoje, nas margens de [fishermen_county_scope.GetNameNoTierNoTooltip], tenho a sorte de encontrar uma frota de pesca [fishermen_county_scope.GetCountyData.GetCulture.GetNameNoTooltip]!\n\nNosso séquito navega perto de um membro isolado da frota, e sou imediatamente saudado pelo odor pungente de seu capitão.\n\n\"Uma honra, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord]. Posso lhe interessar em nossas melhores capturas do dia?\""
 travel_events.4004.t:0 "Peixes no Mar"
 travel_events.4005.a:0 "E será meu!"
 travel_events.4005.b:0 "Eu vou roubá-lo!"
 travel_events.4005.c:0 "Infelizmente, não posso justificar tal gasto imprudente."
 travel_events.4005.desc:0 "Os mares ao redor estão cheios de comerciantes [merchant_character_scope.GetCulture.GetName] fazendo seu comércio usual, transportando bens raros e exóticos de um porto para outro.\n\nUm desses navios mercantes guarda um item que imediatamente chama minha atenção. No momento em que coloco os olhos no [merchant_artifact_scope.GetName], sei que nunca encontrarei algo parecido no [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] e ele simplesmente deve ser meu."
 travel_events.4005.t:0 "Bugigangas Raras"
 travel_events.4006.a:0 "Mostrarei misericórdia."
 travel_events.4006.b:0 "Nada me impedirá de matar este maldito pássaro!"
 travel_events.4006.desc:0 "Sou despertado de minha viagem relaxante pelo grande mar azul por um grito repentino! Corro para os porões do convés e fico horrorizado ao encontrar um [ROOT.Char.Custom('GetRandomMigratoryBird')] ao lado dos restos rasgados de nossos suprimentos, suas penas esticadas contra sua barriga inchada e nojenta.\n\nEm minha raiva, eu poderia ter matado a maldita praga alada ali mesmo, mas sou impedido por [superstituous_caravan_member.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n\"Escute! Detenha sua mão, s[Select_CString( ROOT.Char.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('superstitious_caravan_member'))] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('superstitious_caravan_member'))]! Você não sabe que é azar matar um pássaro no mar?\""
 travel_events.4006.t:0 "Um Ladrão Alado"
 travel_events.4007.a:0 "Confio em nosso capitão."
 travel_events.4007.b:0 "Por [ROOT.Char.GetFaith.WaterGodName], assumirei o leme!"
 travel_events.4007.c:0 "Siga alguns navios locais pela tempestade."
 travel_events.4007.desc:0 "[ROOT.Char.GetFaith.WaterGodName] claramente não favorece nossa viagem, já que ondas do tamanho de castelos caem sobre nosso humilde navio! O navio é balançado para frente e para trás, homens e mulheres se agarram ao que podem para evitar cair ao mar, à medida que o navio fica cada vez mais perto de virar.\n\nÉ claro que estou escondido com os outros nobres na parte mais segura do navio, mas à medida que o céu queima com trovões e o mar desaba sobre nós com toda a sua força, temo que não sobreviverei para ver outro dia se tentar sobreviver apenas pela fé."
 travel_events.4007.t:0 "$travel_danger_prefix$ Tempo Tempestuoso"
 travel_events.4008.a:0 "Vamos investigar."
 travel_events.4008.b:0 "Só há morte por aquele caminho."
 travel_events.4008.desc:0 "O mar está calmo e amigável hoje, parado como uma rocha e com um vento poderoso às nossas costas. Parece que será um dia fácil para os remadores abaixo, mas então eu avisto o corpo mutilado de um navio enterrado na proa em algumas rochas pontiagudas logo à frente.\n\nNão parece haver sobreviventes, e as rochas não seriam algo trivial de navegar, no entanto, sinto-me compelido a ir e investigar este misterioso naufrágio."
 travel_events.4008.t:0 "Navio Abandonado"
 travel_events.4009.a:0 "Uma coisa esplêndida!"
 travel_events.4009.desc:0 "Como suspeitava, os destroços não contêm vida, exceto por algumas aves bicando os cadáveres meio comidos dos viajantes que vieram antes de nós.\n\nAo olhar mais de perto, vejo algo brilhando no bico ensanguentado de um pássaro. Com um guincho agudo, ele solta o objeto nos destroços e voa para longe, deixando-me pegar este objeto intrigante."
 travel_events.4009.t:0 "Navio Abandonado:Uum Adorno"
 travel_events.4010.a:0 "Uma boa descoberta!"
 travel_events.4010.desc:0 "Assim como todos haviam suposto, não houve sobreviventes do naufrágio, no entanto, as roupas e bens deixados nos cadáveres indicam que este já foi um navio comercial de riqueza!\n\nEntre os destroços, vejo bens exóticos e roupas luxuosas ainda intactas, exceto por estarem um pouco molhadas. Sem dúvida, esses itens renderão um bom preço assim que chegarmos à costa."
 travel_events.4010.t:0 "Navio Abandonado: Riquezas"
 travel_events.4011.a:0 "Nós o ajudaremos a chegar à costa."
 travel_events.4011.b:0 "Junte-se a nós em nossas viagens!"
 travel_events.4011.c:0 "Tem receio, não posso ouvi-lo..."
 travel_events.4011.desc:0 "Para minha grande surpresa, começo a ouvir uma voz saudando nosso navio enquanto nos aproximamos dos destroços. [Select_CString( castaway_scope.IsFemale, 'A', 'O' )] [castaway_scope.GetWomanMan] parece ser um nobre rico flutuando nos restos de uma porta.\n\n\"Salve! Eu pensei que nunca veria outra alma novamente antes que o mar me reivindicasse, como fez com meus companheiros.\"\n\n[castaway_scope.GetSheHe|U] se apresenta como [castaway_scope.GetName], afirma ser um nobre da [nearby_coast_scope.GetName] e ofereceu pagar por uma passagem segura e companhia."
 travel_events.4011.t:0 "Navio Abandonado: Um Sobrevivente"
 travel_events.4012.a:0 "Eu vou treinar [Select_CString( feral_child_scope.IsFemale, 'a', 'o' )] [feral_child_scope.Custom('GirlBoy')]!"
 travel_events.4012.b:0 "Apenas ignore [feral_child_scope.GetSheHe]."
 travel_events.4012.c:0 "Siga [feral_child_scope.GetSheHe] de volta para seu amigo(a) [feral_child_scope.Custom('GetAnimalType')]."
 travel_events.4012.desc:0 "Enquanto viajamos pelas terras selvagens de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], sinto a distintiva sensação de estar sendo observado. Escondido, embora de maneira precária, vejo um[Select_CString( feral_child_scope.IsFemale, 'a', '' )] [feral_child_scope.Custom('GirlBoy')] frágil e suj[Select_CString( feral_child_scope.IsFemale, 'a', 'o' )], observando nosso séquito.\n\nUm membro de nosso comboio me informa que os locais dizem que essas terras são assombradas por alguém a quem chamam [feral_child_scope.GetFirstNameNoTooltip], que dizem ter sido criado longe da sociedade humana pelo(a) [feral_child_scope.Custom('GetAnimalType')].\n\nAparentemente, a pobre criatura tem se fascinado conosco e até começou a falar algumas frases básicas [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip], embora não com muita proficiência."
 travel_events.4012.t:0 "[feral_child_scope.GetFirstNameNoTooltip], [Select_CString( feral_child_scope.IsFemale, 'a', 'o' )] [feral_child_scope.Custom('GirlBoy')|U] [feral_child_scope.Custom('GetAnimalType')|U]"
 travel_events.4013.a:0 "[feral_child_scope.GetSheHe|U] é um[Select_CString( feral_child_scope.IsFemale, 'a', '' )] [feral_child_scope.Custom('GetDaughterSon')] para mim, com sangue ou sem."
 travel_events.4013.b:0 "Que triunfo!"
 travel_events.4013.desc:0 "Embora ninguém jamais tenha ousado sonhar com isso, parece que houve um avanço no desenvolvimento de [feral_child_scope.GetFirstNamePossessive]!\n\nUma vez uma criança simples, criada por nada além de feras selvagens, [feral_child_scope.GetFirstNameNoTooltip] finalmente está mostrando progresso. [feral_child_scope.GetFirstNameNoTooltip] fala em frases completas e brinca com outras crianças da mesma idade como se [feral_child_scope.GetSheHe] sempre tivesse sido uma delas.\n\nHoje, depois de nossas aulas habituais, [feral_child_scope.GetSheHe] até me pediu para ser [Select_CString( ROOT.Char.IsFemale, 'sua', 'seu' )] [ROOT.Char.GetMotherFather]."
 travel_events.4013.t:0 "[feral_child_scope.GetFirstNameNoTooltip], um Avanço"
 travel_events.4014.a:0 "Espere! Dê-me mais uma chance!"
 travel_events.4014.b:0 "Nunca vou esquecer você, [feral_child_scope.GetFirstNameNoTooltip]."
 travel_events.4014.desc:0 "[feral_child_scope.GetFirstName] tem sido um verdadeiro desafio para orientar, isso é certo. [feral_child_scope.GetSheHe|U] mal consegue formar uma frase e ainda vagueia como uma fera. A vida interior parece causar a [feral_child_scope.GetSheHe] muito estresse, e quando [feral_child_scope.GetSheHe] decide falar, [feral_child_scope.GetSheHe] fala quase exclusivamente em voltar para a natureza.\n\nObservo enquanto [feral_child_scope.GetSheHe] fica desconfortável sobre duas pernas e faz um gesto para sair, e de alguma forma eu sei que desta vez, [feral_child_scope.GetSheHe] está partindo para sempre."
 travel_events.4014.t:0 "[feral_child_scope.GetFirstNameNoTooltip], Anseio pela Natureza"
 travel_events.4015.a:0 "Deixe-me tentar."
 travel_events.4015.b:0 "Felizmente, sou fluente em [ROOT.Char.GetCurrentLocation.GetCulture.GetLanguage.GetNameNoTooltip]!"
 travel_events.4015.desc:0 "Parece que nosso comboio se perdeu um pouco nessas terras estrangeiras.\n\n[travel_leader_scope.GetName] tem nos seguido por [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] por horas, e embora [travel_leader_scope.GetSheHe] finalmente tenha engolido seu orgulho e pedido direções, [travel_leader_scope.GetSheHe] não parece ser um especialista na língua [ROOT.Char.GetCurrentLocation.GetCulture.GetLanguage.GetNameNoTooltip]."
 travel_events.4015.t:0 "a Barreira da Linguagem"
 travel_events.4016.a:0 "Sol, faça o seu pior!"
 travel_events.4016.b:0 "Preciso de água!"
 travel_events.4016.desc.intro:0 "Estou longe de casa, e os ventos gelados foram deixados para trás. Embora a mudança de clima tenha sido agradável e maravilhosa para minha pele no início,"
 travel_events.4016.desc.mid.dry_heat:0 "minha pele começou a ficar vermelha e a água passa por mim como areia por um peneira."
 travel_events.4016.desc.mid.humid_heat:0 "o ar espesso de umidade faz-me sentir como se estivesse respirando através de um pano úmido."
 travel_events.4016.desc.outro:0 "\n\nA água está refrescante e revigorante, e ajuda muito a aliviar essa exaustão pelo calor, mas simplesmente não é suficiente."
 travel_events.4016.t:0 "$travel_danger_prefix$ Calor Excessivo"
 travel_events.4017.a:0 "E o preço certo [warrior_scope.GetSheHe] terá!"
 travel_events.4017.b:0 "Tenho certeza de que podemos negociar isso."
 travel_events.4017.c:0 "Talvez possamos usar essa conexão para um acordo futuro..."
 travel_events.4017.d:0 "Acho que não."
 travel_events.4017.desc.intro:0 "Ouvi dizer das proezas militares dos lendários mercenários [ROOT.Char.GetCurrentLocation.GetCulture.GetName], e ao passar por [ROOT.Char.GetCurrentLocation.GetName], sou suficientemente afortunado para encontrar um comandante de mercenários altamente habilidoso!\n\n"
 travel_events.4017.desc.mid.nomad:0 "[warrior_scope.GetName] alardeia que [warrior_scope.GetHerselfHimself] é o guerreiro mais aterrorizante de toda a estepe"
 travel_events.4017.desc.mid.swordsman:0 "[warrior_scope.GetName] afirma que [warrior_scope.GetSheHe] é o melhor espadachim [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] do mundo"
 travel_events.4017.desc.outro:0 "e estaria honrado em servir, pelo preço certo."
 travel_events.4017.t:0 "Espadas à Venda"
 travel_events.4018.a:0 "Sou um mestre debatedor."
 travel_events.4018.b:0 "[mystic_scope.GetSheHe|U] até faz alguns bons pontos..."
 travel_events.4018.c:0 "Tenho certeza de que eles partirão eventualmente."
 travel_events.4018.d:0 "Uma boa queima de hereges está em ordem!"
 travel_events.4018.desc.intro:0 "Ouvimos dizer que o [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetHolder.GetPrimaryTitle.GetNameNoTierNoTooltip] é uma terra repleta de homens santos viajando em condições empobrecidas, vivendo muitas vezes apenas pela fé.\n\nUm desses mendicantes se aproximou de nosso comboio,"
 travel_events.4018.desc.mid.mystic:0 "pregando sua própria filosofia mística esotérica a quem quiser ouvir."
 travel_events.4018.desc.mid.preacher:0 "falando de sua interpretação da vontade de [mystic_scope.GetFaith.HighGodName] e como levar uma vida piedosa."
 travel_events.4018.desc.outro:0 "\n\nA criatura empobrecida parece relutante em deixar nosso grupo, mas talvez eu possa me livrar [mystic_scope.GetHerHim]..."
 travel_events.4018.t:0 "Um Mendicante [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip]"
 travel_events.4019.a:0 "Eu sou [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip] e quero a minha [ROOT.Char.Custom('GetLocalStreetFood')]!"
 travel_events.4019.b:0 "Eu não acredito que quase comi essa porcaria!"
 travel_events.4019.c:0 "Talvez eu possa conseguir a receita!"
 travel_events.4019.desc:0 "Em nossa passagem por [ROOT.Char.GetCurrentLocation.GetName], parece que tropeçamos em um mercado de comida local! Em todos os lugares, camponeses e nobres de todas as culturas e línguas se aglomeram em volta de barracas de comida exótica, o ar espesso com fragrâncias que eu nunca poderia imaginar.\n\nMeu nariz é atraído para uma barraca humilde empilhada com um prato que eu só poderia sonhar. Sou tirado de minha perplexidade pelo aperto hesitante de [pompous_courtier.GetName].\n\n\"Não desperdice seu paladar com essa porcaria, [ROOT.Char.Custom('FormOfAddressForLiege')]. [ROOT.Char.Custom('GetLocalStreetFoodPlural')|U] são para camponeses, temos comidas muito mais refinadas em casa.\""
 travel_events.4019.t:0 "Uma Delícia Humilde"
 travel_events.4020.a:0 "[strong_believer_scope.GetWomanMan] Tol[Select_CString( strong_believer_scope.IsFemale, 'a', 'o' )], é você que é herege!"
 travel_events.4020.b:0 "É mais fácil se apenas pagarmos."
 travel_events.4020.c:0 "Queimem esses lunáticos."
 travel_events.4020.desc:0 "É sabido que o povo [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetName] é ardente em sua fé [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdjective] e não tem simpatia por não-crentes. No entanto, [ROOT.Char.GetCurrentLocation.GetName] está em nossa rota, então devemos passar por aqui.\n\nRapidamente, os olhares vingativos dos aldeões se fixam sobre nós como um(a) [ROOT.Char.Custom('GetAnimalType')] rondando sua refeição. Antes de termos a chance de reagir, o [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuter] local desce sobre nós com uma multidão de fanáticos furiosos, gritando sobre nossas alegadas \"crenças heréticas\" e exigindo que paguemos expiação por passar por estas \"terras sagradas\"."
 travel_events.4020.t:0 "$travel_danger_prefix$ [ROOT.Char.GetFirstNameNoTooltip], [Select_CString( ROOT.Char.IsFemale, 'a Estrangeira', 'o Estrangeiro' )]"
 travel_events.4021.a.sadist:0 "Vou tentar não perder um momento disso!"
 travel_events.4021.a:0 "Devo simplesmente desviar o olhar."
 travel_events.4021.b:0 "Talvez eu possa comprar a liberdade desse infeliz!"
 travel_events.4021.c:0 "Pare! Leve [rival_to_sacrifice.GetNameNoTooltip] em vez disso!"
 travel_events.4021.desc.intro:0 "Eu havia sido avisado de que os [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdherentNamePlural] praticavam o sacrifício humano, mas nunca imaginei que testemunharia um sacrifício desse tipo. Em um altar de pedra, vejo um[Select_CString( sacrificed_person_scope.IsFemale, 'a', '' )] [sacrificed_person_scope.GetWomanMan] nu[Select_CString( sacrificed_person_scope.IsFemale, 'a', '' )], laminada à superfície com cordas firmemente enroladas.\n\n"
 travel_events.4021.desc.mid.sadist:0 "Sou verdadeiramente afortunado por testemunhar este barbarismo sagrado com meus próprios olhos. [sacrificed_person_scope.GetSheHe|U] se contorce e luta tão prazerosamente, lamento não poder atravessar o coração [sacrificed_person_scope.GetHerHim] com a faca e entregar [sacrificed_person_scope.GetSheHe] a [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] eu mesmo!\n\n"
 travel_events.4021.desc.mid:0 "Simplesmente não consigo acreditar no que estou testemunhando. [sacrificed_person_scope.GetSheHe|U] pulsa rapidamente a cada respiração rápida, seus olhos ensanguentados implorando para que eu interfira.\n\n"
 travel_events.4021.desc.outro.cannibal:0 "Só posso esperar que eu tenha a oportunidade de me banquetear com a carne [sacrificed_person_scope.GetHerHim] quando tudo isso acabar."
 travel_events.4021.desc.outro.sadist:0 "Assisto alegremente, meus olhos fixos na faca enquanto ela entrega [sacrificed_person_scope.GetSheHe] ao esquecimento."
 travel_events.4021.desc.outro:0 "Assisto impotente, desejando ficar com a faca e adiar a jornada [sacrificed_person_scope.GetHerHim] ao esquecimento."
 travel_events.4021.t:0 "O Altar de [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]"
 travel_events.4022.a.ignore_heretics:0 "Não devo me envolver nos negócios dos hereges."
 travel_events.4022.a.not_so_different:0 "Não somos tão diferentes."
 travel_events.4022.a:0 "Fascinante."
 travel_events.4022.b:0 "Queimem a árvore!"
 travel_events.4022.c:0 "Devo participar da celebração!"
 travel_events.4022.desc:0 "Dizem que a natureza é venerada aqui em [ROOT.Char.GetCurrentLocation.GetName] como uma extensão da vontade d[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PantheonTerm].\n\nVemos os locais enfeitando uma árvore antiga com materiais finos e joias, como se a estivessem cortejando. Muitos em meu séquito estão satisfeitos em assistir de longe, mas sinto-me compelido a fazer algo a mais..."
 travel_events.4022.t:0 "A Árvore Sagrada"
 travel_events.4023.a:0 "Eu devo encontrar [prester_john_scope.GetSheHe] imediatamente!"
 travel_events.4023.b:0 "[prester_john_scope.GetSheHe|U] deve ser lembrado de seu dever de combater a heresia!"
 travel_events.4023.c:0 "O [prester_john_scope.GetFaith.GetNameNoTooltip] é mera perversão do [ROOT.Char.GetFaith.GetNameNoTooltip]!"
 travel_events.4023.d:0 "Fascinante. Seguindo em frente."
 travel_events.4023.desc.intro:0 "Existem lendas sobre um distante [ROOT.Char.GetFaith.GetReligion.GetAdjective] [prester_john_scope.GetPrimaryTitle.GetTierAsNameNoTooltip] cercado por hereges e descrentes. Um dia, o lendário [prester_john_scope.GetPrimaryTitle.GetTierAsNameNoTooltip] [prester_john_scope.GetTitleAsNameNoTooltip] pegará em armas contra os ímpios e os atingirá com fúria divina!\n\n"
 travel_events.4023.desc.mid.joan:0 "As lendas o nomeiam de 'Prester João', mas talvez quisessem dizer 'Prester Joan'! De qualquer forma,"
 travel_events.4023.desc.mid.john:0 "As lendas o nomeiam de 'Prester João', e"
 travel_events.4023.desc.mid:0 "Esse figura lendária permanece sem nome, mas"
 travel_events.4023.desc.outro:0 "à medida que passo mais tempo em [prester_john_scope.GetPrimaryTitle.GetNameNoTierNoTooltip], fico cada vez mais convencido de que [prester_john_scope.GetName] é o lendário [prester_john_scope.GetTitleAsNameNoTooltip]!"
 travel_events.4023.t:0 "O [prester_john_scope.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip|U] Perdido"
 travel_events.4024.a:0 "[foreign_visitor.GetSheHe|U] será uma lenda para nós também!"
 travel_events.4024.b:0 "O [foreign_visitor.GetFaith.GetNameNoTooltip]? Parece heresia!"
 travel_events.4024.c:0 "Talvez [chaplain_scope.GetNameNoTooltip] possa ensiná-los sobre o [ROOT.Char.GetFaith.GetName]!"
 travel_events.4024.d:0 "Que legal..."
 travel_events.4024.desc.intro:0 "Recebi uma carta escrita em uma língua exótica de alguém que afirma ser um[Select_CString( foreign_visitor.IsFemale, 'a', '' )] [foreign_visitor.GetTitleAsNameNoTooltip] distante, lar dos '[foreign_visitor.GetFaith.GetAdherentNamePluralNoTooltip]', um grupo distante de [ROOT.Char.GetFaith.GetReligion.GetAdherentNameNoTooltip]."
 travel_events.4024.desc.mid:0 "\n\n[foreign_visitor.GetSheHe|U] afirma que eu sou uma figura lendária para esses [foreign_visitor.GetFaith.GetAdherentNamePluralNoTooltip], [Select_CString( ROOT.Char.IsFemale, 'uma verdadeira', 'um verdadeiro' )] [ROOT.Char.GetTitleAsNameNoTooltip|U] [ROOT.Char.GetFaith.GetReligion.GetAdjective] cercado por hereges ímpios."
 travel_events.4024.t:0 "Um [ROOT.Char.GetFaith.GetReligion.GetAdherentNameNoTooltip|U] Estrangeiro"
 travel_events.4025.a:0 "Claro que [ROOT.Char.GetFaith.HighGodNameSheHe|U] iria!"
 travel_events.4025.b:0 "Existem muitos caminhos para [ROOT.Char.GetFaith.PositiveAfterLife]"
 travel_events.4025.desc.mid:0 "[foreign_visitor.GetSheHe|U] afirma que eu sou uma figura lendária destinada a empunhar a espada contra os não-crentes em nome de [ROOT.Char.GetFaith.HighGodName] e entregar os miseráveis ao [ROOT.Char.GetFaith.NegativeAfterLife] a que pertencem.\n\nTenho muitos vizinhos de todas as espécies de fé, será que [ROOT.Char.GetFaith.HighGodName] realmente deseja que eu cometa violência em seu nome?"
 travel_events.4025.different_religion_neighbors_and_vassals:0 "Cada [vassal|E] e [ruler|E] vizinho de uma [religion|E] diferente"
 travel_events.4025.t:0 "Pegue a Espada Sagrada"
 travel_events.4026.a:0 "Isso parece maravilhoso!"
 travel_events.4026.b:0 "Relacionamentos de longa distância realmente não funcionam para mim."
 travel_events.4026.desc:0 "[prester_john_scope.GetName] devolveu minha carta e expressou sua admiração mútua por mim e pela fé [ROOT.Char.GetFaith.GetAdjective].\n\n[prester_john_scope.GetSheHe|U] prossegue dizendo que, se [ROOT.Char.GetFaith.HighGodName] desejar, poderemos nos encontrar novamente, e enquanto isso, devemos permanecer admiradores mútuos de longe."
 travel_events.4026.t:0 "Amigos de Longe"
 travel_events.4027.a:0 "Que fundamentalista pomposo! Veremos quem zomba de quem!"
 travel_events.4027.desc:0 "Um grupo de [foreign_visitor.GetFaith.GetAdherentNamePlural] viajantes está passando por [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] e hoje, um[Select_CString( foreign_visitor.IsFemale, 'a', '' )] [foreign_visitor.GetTitleAsNameNoTooltip|U] proeminente [foreign_visitor.GetFaith.GetAdherentNameNoTooltip] em meio às suas fileiras me acusou de heresia!\n\n[foreign_visitor.GetSheHe|U] afirma que não apenas estou pervertendo a vontade de [ROOT.Char.GetFaith.HighGodNamePossessive], mas que toda a fé [ROOT.Char.GetFaith.GetAdjective] é uma feia zombaria de [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]!"
 travel_events.4027.t:0 "Visitando Hereges"
 travel_events.4028.a:0 "Vou tentar!"
 travel_events.4028.b:0 "Esse símbolo profano deve ser destruído!"
 travel_events.4028.c:0 "Não tenho tempo para isso."
 travel_events.4028.desc:0 "O campo de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] é conhecido por estar cheio de pedras rúnicas: monólitos imponentes gravados com registros escritos de eventos, tanto lendários quanto históricos.\n\nEm nossas viagens, encontramos uma pedra rúnica particularmente grandiosa adornada com padrões complexos e, sem dúvida, uma lenda escrita em um idioma que não posso entender.\n\nTalvez com tempo e paciência, eu possa decifrar o significado..."
 travel_events.4028.t:0 "Uma Pedra Rúnica"
 travel_events.4029.a:0 "Tenha piedade dessa criatura!"
 travel_events.4029.b:0 "[brainless_character.GetSheHe|U] é claramente um criminoso."
 travel_events.4029.c:0 "Deixe [brainless_character.GetSheHe]."
 travel_events.4029.desc.intro:0 "Passear pela zona rural de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] não é exatamente o passeio tranquilo que eu tinha imaginado. O céu está negro de nuvens e os campos agrícolas estão mortalmente silenciosos.\n\nIsso até ouvirmos gemidos de agonia vindos de profundamente dentro dos campos. À medida que nos aproximamos, encontramos um[Select_CString( brainless_character.IsFemale, 'a', '' )] [brainless_character.GetWomanMan] amarrad[Select_CString( brainless_character.IsFemale, 'a', 'o' )] a um poste, como se [brainless_character.GetSheHe] fosse um espantalho.\n\n"
 travel_events.4029.desc.mid.christian:0 "[brainless_character.GetSheHe|U] é a própria imagem do sofrimento de Cristo, pendurad[Select_CString( brainless_character.IsFemale, 'a', 'o' )] em sua cruz de fazenda."
 travel_events.4029.desc.mid:0 "Pelos lábios secos e pele pálida [brainless_character.GetHerHim], fica evidente que [brainless_character.GetSheHe] está aqui há algum tempo."
 travel_events.4029.desc.outro:0 "Alguns membros da minha comitiva imploram para que eu [Select_CString( brainless_character.IsFemale, 'a', 'o' )] derrube, mas será que isso realmente é minha preocupação?"
 travel_events.4029.t:0 "O Espantalho Macabro de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 travel_events.4030.a:0 "[brainless_character.GetSheHe|U] está claramente em perigo aqui, venha comigo!"
 travel_events.4030.b:0 "Uma boa recompensa por uma boa ação."
 travel_events.4030.c:0 "Não preciso de recompensa."
 travel_events.4030.desc.intro:0 "[Select_CString( brainless_character.IsFemale, 'A', 'O' )] [brainless_character.GetWomanMan] se prostra piedosamente a meus pés, sujando o solo com suas mãos ensanguentadas. Em breve, membros da minha comitiva erguem [brainless_character.GetSheHe] para seus pés instáveis, suplicando para ouvir como [brainless_character.GetSheHe] chegou ali.\n\n"
 travel_events.4030.desc.mid.lowborn:0 "\"Ah, foi minha mãe, entende? Ela diz que sou tão lento e inútil que eu faria um espantalho melhor do que um trabalhador agrícola, então ela me amarrou. Eu pensei que ficaria tudo bem, mas foi tortura.\""
 travel_events.4030.desc.mid.noble:0 "\"Ah, eu estava apenas aqui para cobrar impostos. Os camponeses me disseram que o ouro estava enterrado aqui fora, e antes que eu percebesse, eles caíram sobre mim e me penduraram como um espantalho!\""
 travel_events.4030.desc.outro:0 "\n\nA inteligência claramente não é o forte [brainless_character.GetHerHim], mas [brainless_character.GetSheHe] me oferece uma pequena quantia de riqueza por minha ajuda, independente disso."
 travel_events.4030.t:0 "$travel_events.4029.t$"
 travel_events.4031.a:0 "Considere a armadura fora, por um preço."
 travel_events.4031.b:0 "Ofereça a [heartless_knight_scope.GetSheHe] escudeiros leais, em troca de sua fidelidade."
 travel_events.4031.c:0 "Deixo [heartless_knight_scope.GetHerHim] à [heartless_knight_scope.GetHerHis] sorte."
 travel_events.4031.desc.intro:0 "Verdadeiramente, um passeio por [ROOT.Char.GetCurrentLocation.GetName] é um presente de [ROOT.Char.GetFaith.CreatorName]. A tranquilidade deste lugar é subitamente quebrada pelos grunhidos furiosos e pelo tilintar de armaduras!\n\n\"Ouça! Tire-me desta prisão de metal! Meu escudeiro se ofendeu com minha maneira, indo tão longe a ponto de me chamar de 'sem coração', e me abandonou!\"\n\n"
 travel_events.4031.desc.mid.callous:0 "Tento sufocar minha risada, mas a imagem desse tolo tilintando pelos campos é simplesmente demais."
 travel_events.4031.desc.mid:0 "Seja lá o que ess[Select_CString( heartless_knight_scope.IsFemale, 'a', 'e' )] estranh[Select_CString( heartless_knight_scope.IsFemale, 'a', 'o' )] [heartless_knight_scope.GetWomanMan] fez, não pode ter sido o suficiente para justificar estar pres[Select_CString( heartless_knight_scope.IsFemale, 'a', 'o' )] para sempre em sua armadura."
 travel_events.4031.desc.outro:0 "É claro que eu poderia pedir a alguém que ajude [heartless_knight_scope.GetSheHe], mas isso realmente vale a pena?"
 travel_events.4031.t:0 "[Select_CString( heartless_knight_scope.IsFemale, 'A', 'O' )] [heartless_knight_scope.GetWomanMan|U] Metálic[Select_CString( heartless_knight_scope.IsFemale, 'a', 'o' )]"
 travel_events.4032.a:0 "Est[Select_CString( cowardly_knight_scope.IsFemale, 'a', 'e' )] [cowardly_knight_scope.GetWomanMan] merece minha ajuda!"
 travel_events.4032.b:0 "Ajude [cowardly_knight_scope.GetSheHe] [entourage_helper.GetFirstNameNoTooltip]!"
 travel_events.4032.c:0 "Eu não vou arriscar minha vida por isso."
 travel_events.4032.desc:0 "Nossa jornada é violentamente interrompida pelo som de carne sendo rasgada e mandíbulas trincando, e os gritos desesperados de um[Select_CString( cowardly_knight_scope.IsFemale, 'a', '' )] [cowardly_knight_scope.GetWomanMan] prestes a encontrar seu fim! O barulho é tão horrível que deve ter vindo das profundezas do [ROOT.Char.GetFaith.NegativeAfterLife]!\n\nTentando rastrear a origem, encontramos um[Select_CString( cowardly_knight_scope.IsFemale, 'a', '' )] [cowardly_knight_scope.GetWomanMan] desesperad[Select_CString( cowardly_knight_scope.IsFemale, 'a', 'o' )] lutando com [ROOT.Char.Custom('GetAnimalType')] selvagem! A espada [cowardly_knight_scope.GetHerHim|U] está presa entre as mandíbulas da fera, mas sua aderência está começando a falhar."
 travel_events.4032.t:0 "Luta com [ROOT.Char.Custom('GetAnimalType')]"
 travel_events.4033.a:0 "Eles precisam entender que [witch_scope.Custom('MagicPracticeTerm')] é um pecado."
 travel_events.4033.b:0 "Tenho muito a aprender, me ensine!"
 travel_events.4033.c:0 "Isso realmente não é da minha preocupação."
 travel_events.4033.d:0 "[witch_scope.Custom('MagicPracticeTerm')|U]! [witch_scope.GetSheHe|U] se arrependerá, ou [witch_scope.GetSheHe] queimará!"
 travel_events.4033.desc.intro:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip] é uma terra de costumes estranhos e obscuros para mim. As práticas da fé [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdjective] são estranhas e incrivelmente diferentes do [ROOT.Char.GetFaith.GetName], e em nenhum lugar isso é mais evidente do que em sua atitude em relação à prática da magia.\n\nBem no meio da cidade, há um[Select_CString( witch_scope.IsFemale, 'a', '' )] [witch_scope.GetWomanMan] entoando encantamentos e oferecendo bênçãos como se [witch_scope.GetSheHe] fosse um [ROOT.Char.GetFaith.PriestNeuter]!"
 travel_events.4033.desc.mid.zealous:0 "A própria visão desta heresia degenerada é suficiente para me deixar enjoado e posso sentir minha mão de queimador de bruxas começar a tremer de raiva."
 travel_events.4033.desc.mid:0 "É estranho para mim, mas as pessoas parecem estar positivamente jubilantes por estar na presença [witch_scope.GetHerHim]."
 travel_events.4033.t:0 "O [witch_scope.Custom('MagicUserTerm')|U] de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 travel_events.4034.a:0 "Uma ótima adição à minha coleção."
 travel_events.4034.desc.intro:0 "A perversa [witch_scope.Custom('MagicUserTerm')] de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] foi queimada justamente por seus crimes contra [ROOT.Char.GetFaith.HighGodName], e à medida que a fumaça se dissipa, vejo que est[Select_CString( witch_scope.IsFemale, 'a', 'e' )] [witch_scope.GetWomanMan] [witch_scope.Custom2('InsultAdjective', ROOT.Char)] deixou algo para trás.\n\n"
 travel_events.4034.desc.mid.bones:0 "Entre as cinzas estão os ossos [witch_scope.GetHerHim], imaculadamente preservados apesar da intensidade das chamas. Sem dúvida, isso foi algum ato final de magia vil."
 travel_events.4034.desc.mid:0 "Brilhando nas cinzas está um objeto maravilhoso, milagrosamente poupado das chamas intensas. Talvez isso seja um presente de [ROOT.Char.GetFaith.HighGodName] por meu serviço, ou algum ato final de magia da bruxa vil."
 travel_events.4034.desc.outro:0 "O artefato é recuperado das cinzas e limpo por um membro da minha comitiva, para ser meu para sempre."
 travel_events.4034.t:0 "Cinzas para Tesouros"
 travel_events.4035.a:0 "Talvez [zealous_priest_scope.GetSheHe] ouça a razão?"
 travel_events.4035.b:0 "Eu me arrependo dos meus caminhos malignos!"
 travel_events.4035.c:0 "Fuja!"
 travel_events.4035.d:0 "Vou lutar para sair dessa!"
 travel_events.4035.desc.intro:0 "Como um servo leal de [ROOT.Char.GetFaith.WitchGodName], viajar significa realizar rituais e encantamentos para proteger minha comitiva contra espíritos malignos.\n\nAqui em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip],"
 travel_events.4035.desc.mid.zealous:0 "os hereges vis"
 travel_events.4035.desc.mid:0 "as pessoas"
 travel_events.4035.desc.outro:0 "acreditam que toda magia e milagres feitos por qualquer um além de seus clérigos sejam bruxaria.\n\nConsequentemente, o [zealous_priest_scope.GetFaith.PriestNeuter] local agora se aproxima da minha procissão como uma fera, apagando meus símbolos protetores e delirando sobre o suposto mal dos meus caminhos."
 travel_events.4035.t:0 "Não mais no [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 travel_events.4036.a:0 "Vou pagar o que você quiser!"
 travel_events.4036.b:0 "Vou roubar isso!"
 travel_events.4036.c:0 "Não estou interessado em bugigangas [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetNameNoTooltip]."
 travel_events.4036.d:0 "Talvez possamos fazer um acordo."
 travel_events.4036.desc:0 "À medida que percorremos as redondezas de [ROOT.Char.GetCurrentLocation.GetCounty.GetName], vejo uma trilha de camelos de caravana ao longe e logo nos encontramos com seu estranho líder.\n\n\"Boa noite para você, amigo digno. Venha! Venha! Eu lhe prometo que o que tenho em minha barraca, como [kingdom_scope.GetBaseNameNoTierNoTooltip] ela mesma, vale mais do que parecem,\" diz [merchant_character_scope.GetSheHe], exibindo inúmeras bugigangas brilhantes diante dos meus olhos."
 travel_events.4036.t:0 "Caravaneiros [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetNameNoTooltip]"
 travel_events.4037.a:0 "Eu os ensinarei!"
 travel_events.4037.b:0 "Estou mais interessado em ouvir sobre o [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetNameNoTooltip]."
 travel_events.4037.c:0 "Afastem-se, [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')]!"
 travel_events.4037.desc:0 "Eu ouvira dizer que as pessoas de [ROOT.Char.GetCurrentLocation.GetCounty.GetName] praticam [ROOT.Char.GetFaith.GetReligion.GetName] em conjunto com suas próprias crenças [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdjective], e agora que estou aqui, posso ver essa interligação religiosa por toda parte.\n\nUm camponês peculiar e entusiástico, que se chama [fanboy_character_scope.GetHerselfHimself] [fanboy_character_scope.GetFirstName], aborda minha comitiva com entusiasmo e começa a estudar nossa iconografia religiosa com vigor.\n\n\"Pelo [fanboy_character_scope.GetFaith.HighGodName], um grupo de [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] aqui de todos os lugares! Diga-me, [ROOT.Char.Custom('FormOfAddressForLiege')], você ensinaria a nós os caminhos [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] de adoração?\""
 travel_events.4037.t:0 "[ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] e o [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetNameNoTooltip]"
 travel_events.4038.a:0 "Eu simplesmente devo assistir!"
 travel_events.4038.b:0 "Talvez eu possa interessá-los em nossos caminhos!"
 travel_events.4038.c:0 "Não estou interessado."
 travel_events.4038.desc:0 "Na fé [ROOT.Char.GetAdjective], observamos nossos próprios rituais e crenças, mas ainda consideramos [ROOT.Char.GetCurrentLocation.GetCounty.GetReligion.GetName] acima de todas as outras religiões e expressamos uma afinidade por suas crenças.\n\nÉ bastante comum que [ROOT.Char.GetAdherentNamePluralNoTooltip] pratiquem [ROOT.Char.GetCurrentLocation.GetCounty.GetReligion.GetNameNoTooltip] em conjunto com a adoração tradicional [ROOT.Char.GetAdjectiveNoTooltip], e agora que estou aqui em [ROOT.Char.GetCurrentLocation.GetCounty.GetName], tenho a oportunidade de assistir a um sermão e aprender tudo sobre a fé [ROOT.Char.GetAdjective]."
 travel_events.4038.t:0 "[ROOT.Char.GetCurrentLocation.GetCounty.GetAdherentNamePluralNoTooltip] Entre Nós"
 travel_events.4039.a:0 "Talvez apenas um curto descanso..."
 travel_events.4039.b:0 "Eu devo continuar!"
 travel_events.4039.desc:0 "A jornada foi longa e cansativa, e meus pés doem tanto que meus ancestrais devem sentir isso. Quando sinto que estou prestes a desmaiar de exaustão, sinto algo pesado no meu pescoço!\n\nLogo em seguida, estou adornado da cabeça aos pés com vestimentas tradicionais [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetName], as ruas vivas de jubilação! Cada chefe de casa me convida a entrar e descansar minhas cansadas pernas. Levaria apenas um momento para recuperar minha energia, e eu seria recebido como o convidado de honra.\n\nA hospitalidade [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetNameNoTooltip] é lendária, será que posso realmente #EMP não#! vê-la por mim mesmo?"
 travel_events.4039.t:0 "Hospitalidade por um Dia"
 travel_events.4040.a:0 "A honra é toda sua."
 travel_events.4040.b:0 "Me ensine sobre #EMP seu#! povo."
 travel_events.4040.desc:0 "Desde que entrei em [ROOT.Char.GetCurrentLocation.GetCounty.GetName], tenho sido tratado como um animal em um jardim espetacular. As pessoas olham com admiração para a mera maneira como falo e me comporto.\n\nEnquanto seguimos nosso caminho, sou abordado subitamente por um[Select_CString( fanboy_character_scope.IsFemale, 'a', '' )] peculiar e entusiástic[Select_CString( fanboy_character_scope.IsFemale, 'a', 'o' )] [fanboy_character_scope.GetWomanMan] que, ao contrário do resto da multidão, parece falar a língua [ROOT.Char.GetCulture.GetLanguage.GetName].\n\n\"Minha palavra, então é verdade! Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetCulture.GetNameNoTooltip] aqui de todos os lugares! Tenho admirado as tradições [ROOT.Char.GetCulture.GetNameNoTooltip] há muito tempo, e até aprendi [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] por minha própria conta! Que honra é!\""
 travel_events.4040.t:0 "Uma Fascinação Cultural"
 travel_events.4050.a:0 "Um talento a ser cultivado."
 travel_events.4050.b.tt:0 "A criança pertence à minha corte - ao meu povo."
 travel_events.4050.b:0 "Devo acabar com isso..."
 travel_events.4050.c.interpreter:0 "[friendly_child.Custom('GirlBoy')|U]! Venha nos encantar em [friendly_child.GetCulture.GetLanguage.GetNameNoTooltip]."
 travel_events.4050.c.religious:0 "[friendly_child.Custom('GirlBoy')|U]! Venha impressionar esses [friendly_child.GetFaith.GetAdherentNamePluralNoTooltip]."
 travel_events.4050.c.singing:0 "[friendly_child.Custom('GirlBoy')|U]! Venha divertir esses [friendly_child.GetCulture.GetCollectiveNounNoTooltip]."
 travel_events.4050.c.tt:0 "\"Faça-me orgulhoso, [friendly_child.Custom('GetLassLad')]!\""
 travel_events.4050.interpreter:0 "Concedi uma audiência improvisada a um grupo de notáveis ​​[foreign_county.GetAdjective] na estrada, alguns momentos para prestar seus respeitos.\n\nFico distraído por [friendly_child.GetName]: m[Select_CString( friendly_child.IsFemale, 'inha', 'eu' )] jovem [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friendly_child'))] está atuando como tradutor para alguns companheiros, alternando entre idiomas e maneiras com sutileza e facilidade, promovendo um intercâmbio animado.\n\nPelo que entendi, [Select_CString( friendly_child.IsFemale, 'a', 'o' )] [friendly_child.Custom('GirlBoy')] está se tornando algo como um embaixador natural."
 travel_events.4050.religious:0 "Concedi uma audiência improvisada a um grupo de [friendly_child.GetFaith.AltPriestTermPlural] [foreign_county.GetAdjective], alguns momentos para compartilhar bênçãos e sabedoria [friendly_child.GetFaith.GetAdjective].\n\nFico distraído por [friendly_child.GetName], pois m[Select_CString( friendly_child.IsFemale, 'inha', 'eu' )] jovem [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friendly_child'))] reuniu uma multidão de devotos juniores, e no meio deles explica com sabedoria a natureza de sua fé comum.\n\nPelo que entendi, ter sido ensinado tanto nos caminhos da minha fé quanto nos seus próprios deu [Select_CString( friendly_child.IsFemale, 'à', 'ao' )] [friendly_child.Custom('GirlBoy')] algumas perspectivas."
 travel_events.4050.singing:0 "Concedi uma audiência improvisada a alguns proprietários de terras [foreign_county.GetAdjective], alguns momentos para exercitar suas maneiras enquanto me olham nervosamente.\n\nFico distraído por [friendly_child.GetName]: m[Select_CString( friendly_child.IsFemale, 'inha', 'eu' )] jovem [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friendly_child'))] está se divertindo muito, cantando músicas populares, dançando jigs e elogiando heróis [friendly_child.GetCulture.GetHeritage.GetName] do passado com alguns jovens [friendly_child.GetCulture.GetName].\n\nEstar envolvido em minha corte parece ter aprofundado ainda mais o interesse d[Select_CString( friendly_child.IsFemale, 'a', 'o' )] [friendly_child.Custom('GirlBoy')] em praticar sua própria cultura."
 travel_events.4050.t:0 "Quase em Casa"
 travel_events.5001.a:0 "Vou adotar esse conto!"
 travel_events.5001.b.flavor:0 "Pelo menos será uma história divertida para qualquer pessoa que eu possa encontrar em minhas viagens!"
 travel_events.5001.b:0 "Com certeza acabarei falando sobre isso."
 travel_events.5001.c:0 "Isso é um absurdo."
 travel_events.5001.desc:0 "Esta é a terceira vez hoje que ouço um local falar sobre um certo conto enquanto passamos por eles. [travelling_character.GetFirstName] percebe minha confusão.\n\n\"É uma história regional, [ROOT.Char.Custom('FormOfAddressForLiege')]. Chamam-na de [potential_legend.GetName].\" [travelling_character.GetSheHe|U] confidencia.\n\nBem. Certamente parece bastante interessante..."
 travel_events.5001.t:0 "Histórias Sussurradas"
 you_drown_tt:0 "Você se afoga"
 you_find_nothing_tt:0 "Você não encontra nada"
