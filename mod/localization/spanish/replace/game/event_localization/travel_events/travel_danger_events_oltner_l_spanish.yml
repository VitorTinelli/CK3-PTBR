l_spanish:
 9050_found:0 "[victim.GetFirstName] está abalado, mas foi encontrado"
 9050_lost:0 "[victim.GetFirstName] está perdido para sempre"
 9060_wounded:0 "[victim.GetFirstName] foi ferido"
 EVENT_WINDOW_OPTION_AVAILABLE_CARAVAN_MASTER:0 "Esta opção está disponível por causa do seu [GetCourtPositionType('travel_leader_court_position').GetName()]"
 cannibalicus_maximus:0 "Você e todos os membros do séquito receberão o [secret|E] Canibal, se ainda não forem Canibais"
 death_lost:0 "se perdeu e nunca mais foi visto"
 drained_by_mosquitoes_modifier:0 "Esgotado por Mosquitos"
 drained_by_mosquitoes_modifier_desc:0 "Este personagem foi atacado por um enxame de insetos sugadores de sangue, esgotando uma quantidade significativa de sua essência sanguínea."
 emaciated_modifier:0 "Emaciação"
 emaciated_modifier_desc:0 "Este personagem viajou por uma longa distância sem nenhuma comida."
 low_aptitude_caravan_master_reason_tooltip:0 "A [aptitude|E] de [travel_leader.GetFirstNamePossessive|U] como [GetCourtPositionType('travel_leader_court_position').GetName()] é apenas [travel_leader.GetCourtPositionAptitude( GetCourtPositionType( 'travel_leader_court_position' ) )]"
 travel_danger_events.9000.a:0 "Continuemos, são apenas #EMP insetos!#!"
 travel_danger_events.9000.b:0 "[mosquito_victim.GetFirstNameNoTooltip]! Despindo-se, você irá à frente."
 travel_danger_events.9000.desc:0 "Os [location.Custom('GetTerrainTypePlural')] de [location.GetName] estão #EMP infestados#! de minúsculos insetos escuros e sugadores de sangue. Não importa o que façamos, ou para onde vamos, eles estão lá — sugando nosso sangue como uma nuvem torturante enviada por [ROOT.Char.GetFaith.DevilName] [ROOT.Char.GetFaith.DevilHerselfHimself]!\n\nNão apenas os cavalos estão ficando agitados e temperamentais, mas meu séquito também... especialmente m[Select_CString( mosquito_victim.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('mosquito_victim'))] [mosquito_victim.GetFirstName], que está agitadamente agitando seus braços cobertos de sangue."
 travel_danger_events.9000.deviant:0 "#EMP Delicioso!#! Todos, se desvistam!"
 travel_danger_events.9000.herbalist:0 "Acho que essa erva pode nos ajudar..."
 travel_danger_events.9000.t:0 "$travel_danger_prefix$ Um Flagelo Zumbindo"
 travel_danger_events.9010.a:0 "[root_scope.Custom('CulturalCurse')|U]... vamos atrasar."
 travel_danger_events.9010.b:0 "Redistribua os suprimentos, eu vou guiar com força daqui para frente..."
 travel_danger_events.9010.desc:0 "\"[location.Custom('GetRandomRegionalDanger')|U]!\" Ouço [irritated_character.GetFirstName] gritar em pânico. Logo depois, ouço um alto som de estalo — como o som de madeira quebrando, ou de minha paciência finalmente se esgotando.\n\nEu saio no [location.Custom('GetProvinceGroundDesc')] para ver os restos de uma roda de carroça quebrada... #EMP minha#! roda de carroça!\n\n\"Peço desculpas, m[Select_CString( root_scope.IsFemale, 'inha', 'eu' )] [irritated_character.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))]. Era minha vez de vigiar, e eu adormeci nas rédeas...\""
 travel_danger_events.9010.strong:0 "#EMP *Suspiro alto enquanto ergo a carroça do chão*#!"
 travel_danger_events.9010.t:0 "$travel_danger_prefix$ Pausa nas Rodas"
 travel_danger_events.9020.a:0 "Gostaria que pudéssemos comer essas palavras..."
 travel_danger_events.9020.b:0 "O pouco que temos vai para #EMP mim!#!"
 travel_danger_events.9020.cannibal:0 "Oh [emaciated_character.GetFirstNameNoTooltip], você daria sua vida por [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]?"
 travel_danger_events.9020.desc.first:0 "\"Nós... nós estamos #EMP completamente#! sem [ROOT.Char.Custom('GetExpensiveDessert')]!\" M[Select_CString( emaciated_character.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('emaciated_character'))] [emaciated_character.GetFirstName] gagueja nervosamente. \"E [ROOT.Char.Custom('GetExpensiveMeal')], e [ROOT.Char.Custom('GetExpensiveMealAlt')], e [ROOT.Char.Custom('GetLocalStreetFoodPlural')], e até mesmo #EMP [ROOT.Char.Custom('get_region_root_vegetable_plural')]!#!\"\n\n"
 travel_danger_events.9020.desc.last.alt:0 "\n\nMas... eu estive comendo como um ratinho, como isso é justo?"
 travel_danger_events.9020.desc.last:0 "\n\nTalvez eu não devesse ter comido três porções de [ROOT.Char.Custom('GetExpensiveMeal')] com molho [ROOT.Char.Custom('GetFoodDetail')] ontem?"
 travel_danger_events.9020.desc.other:0 "\"Deveríamos ter empacotado mais comida — não sobrou #EMP nem um único pedaço#!, e não há nada para comer até onde a vista alcança!\" [emaciated_character.GetSheHe|U] chora. \"Vamos passar fome!\""
 travel_danger_events.9020.desc.war:0 "\"Aqueles soldados saqueadores levaram tudo o que tínhamos durante a noite! Não sobrou #EMP nem um único pedaço#!\" [emaciated_character.GetSheHe|U] chora. \"Vamos passar fome!\""
 travel_danger_events.9020.hunter:0 "Deve haver presas em algum lugar!"
 travel_danger_events.9020.t:0 "$travel_danger_prefix$ Emaciação Emergente"
 travel_danger_events.9030.a:0 "Maldito tempo."
 travel_danger_events.9030.caravan_master:0 "Meu [GetCourtPositionType('travel_leader_court_position').GetNameNoTooltip()] consegue lidar com um pouco de lama."
 travel_danger_events.9030.desc:0 "A chuva de hoje não é forte, mas é constante — a estrada à frente está virando lama espessa. As carroças estão afundando, e a neblina dificulta enxergar.\n\nNão vamos a lugar nenhum por um tempo."
 travel_danger_events.9030.t:0 "$travel_danger_prefix$ Preso na Lama"
 travel_danger_events.9040.a:0 "Que [ROOT.Char.GetFaith.HighGodName] tenha misericórdia de [victim.GetFirstNameNoTooltip]."
 travel_danger_events.9040.caravan_master:0 "[travel_leader.GetFirstNameNoTooltip], encontre [victim.GetSheHe]!"
 travel_danger_events.9040.desc:0 "Não consigo ver nada — a chuva está forte demais. Estamos encharcados até os ossos, e cada trovão faz os cavalos entrarem em pânico.\n\nEntão percebo algo terrível...\n\nOnde está meu/minha [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim'))], [victim.GetFirstName]?"
 travel_danger_events.9040.t:0 "$travel_danger_prefix$ Tempestade"
 travel_danger_events.9050.a:0 "[victim.GetFirstNameNoTooltip] está perdido, precisamos seguir."
 travel_danger_events.9050.b:0 "Pare! Precisamos procurar [victim.GetFirstNameNoTooltip]."
 travel_danger_events.9050.caravan_master:0 "Meu Mestre da Caravana [travel_leader.GetFirstNameNoTooltip] pode encontrar [victim.GetSheHe]."
 travel_danger_events.9050.desc:0 "Viajar com [Select_CString( victim.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim'))], [victim.GetFirstName], tem se tornado um desafio — a mente [victim.GetHerHim] afetada por [GetTrait('withering_mind').GetName( GetNullCharacter )] piora a cada dia.\n\nEu continuo tendo que lembrar [victim.GetSheHe]: #EMP \"Estamos indo para [ROOT.Char.GetTravelPlan.GetData.GetFinalDestination.GetProvince.GetName]! O(a) [ROOT.Char.GetTravelPlan.GetData.GetActivity.GetShortName], lembra?\"#! Mas nunca adianta.\n\nE agora o velho tolo desapareceu, não há sinal dele..."
 travel_danger_events.9050.t:0 "$travel_danger_prefix$ Mente Errante"
 travel_danger_events.9060.a:0 "Não vamos parar."
 travel_danger_events.9060.b:0 "Precisamos considerar o conforto de [victim.GetFirstNamePossessiveNoTooltip]."
 travel_danger_events.9060.desc:0 "\"Ai, ai! Por favor, pare a carruagem — eu imploro!\" [Select_CString( victim.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim'))] [victim.GetFirstName] grita ao cocheiro. \"[Select_CString( elder_trait.IsFemale, 'Minha', 'Meu' )] [elder_trait.GetName(GetNullCharacter)] não aguenta mais os solavancos, pedras e tremores!\"\n\nAs estradas irregulares de [location.GetName] estão desgastando o corpo frágil [victim.GetHerHim].\n\nTalvez devêssemos diminuir o ritmo, só um pouco."
 travel_danger_events.9060.sadistic:0 "#EMP ...precisamos ir mais rápido.#!"
 travel_danger_events.9060.t:0 "$travel_danger_prefix$ Passageiro Frágil"
 traveling_slowly_modifier:0 "Viagem Dolorosamente Lenta"
 traveling_slowly_modifier_desc:0 "Este grupo está viajando muito lentamente, tornando-se um alvo fácil para salteadores."
