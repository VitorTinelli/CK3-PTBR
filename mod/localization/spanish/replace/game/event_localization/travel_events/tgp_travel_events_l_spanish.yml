l_spanish:
 cultural_acceptance_taught_methods:0 "A [cultural_acceptance|E] entre os [foreign_county.GetCulture.GetCollectiveNoun] e os [foreign_county.GetCulture.GetCollectiveNoun] aumenta em [minor_cultural_acceptance_gain]."
 lover_travel_bond:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUIName] criaram laços durante uma viagem juntos. O fogo do lar foi caloroso naquela noite."
 soulmate_travel_bond:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUIName] criaram laços durante uma viagem juntos. O fogo do lar foi caloroso naquela noite."
 tgp_travel_events.0025.a.tt:0 "Seu relacionamento com [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetTitledFirstName] ganha fertilidade aprimorada."
 tgp_travel_events.0025.a:0 "Como [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetTitleAsNameNoTooltip] desejar."
 tgp_travel_events.0025.b.failure:0 "Você falha em descobrir o que [crusty_person.GetTitledFirstName] está realmente escondendo"
 tgp_travel_events.0025.b.flavor:0 "Eu preciso vigiar [crusty_person.GetSheHe] com cuidado."
 tgp_travel_events.0025.b.success:0 "Você descobre o que [crusty_person.GetTitledFirstName] está realmente escondendo"
 tgp_travel_events.0025.b:0 "[crusty_person.GetTitledFirstName] está tentando criar intriga entre nós?"
 tgp_travel_events.0025.c:0 "Querida(o), você pode ir atrás."
 tgp_travel_events.0025.d:0 "Silêncio, todos vocês!"
 tgp_travel_events.0025.desc:0 "\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetTitleAsNameNoTooltip], eu quero ver as paisagens! Não vai me deixar ir à frente com minha carruagem? Minha visão fica terrivelmente obstruída atrás da sua,\" [spouse.GetTitledFirstName] me pede durante uma parada em [ROOT.Char.GetCurrentLocation.GetName]. [spouse.GetSheHe|U] reprime um bocejo atrás de sua mão e me olha com olhos cansados.\n\nAntes que eu possa responder, [crusty_person.GetTitledFirstName] intervém com um sorriso açucarado. \"Certamente, não devemos esquecer a ordem que um cônjuge adequado deve seguir. A etiqueta exige que [Select_CString( spouse.IsFemale, 'sua', 'seu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('spouse'))] permaneça em seu lugar designado.\""
 tgp_travel_events.0025.t:0 "Família em Primeiro Lugar"
 tgp_travel_events.0030.a.failure:0 "Você falha em interpretar o poema"
 tgp_travel_events.0030.a.success:0 "Você interpreta o poema com sucesso"
 tgp_travel_events.0030.a:0 "Tentar extrair ensinamentos de um poema."
 tgp_travel_events.0030.b:0 "Que gracioso!"
 tgp_travel_events.0030.desc.diplomacy_poem:0 "uma terrível disputa entre duas famílias nobres, dilaceradas por uma briga de herança."
 tgp_travel_events.0030.desc.fallback:0 "$tgp_travel_events.0030.desc.wanderer_poem$"
 tgp_travel_events.0030.desc.intrigue_poem:0 "um intenso caso de amor entre dois filhos de famílias em guerra."
 tgp_travel_events.0030.desc.learning_poem:0 "uma representação particularmente impressionante do campo. Claramente escrita por um poeta magistral."
 tgp_travel_events.0030.desc.martial_poem:0 "as muitas guerras lutadas pelo poeta, um guerreiro que manejava com maestria tanto a espada quanto a pena."
 tgp_travel_events.0030.desc.stewardship_poem:0 "as muitas provações de um nobre que lutou contra secas e fome."
 tgp_travel_events.0030.desc.wanderer_poem:0 "as muitas jornadas que o poeta percorreu em sua vida, e a riqueza que o ar livre concede à alma."
 tgp_travel_events.0030.desc:0 "Ao alcançar um cruzamento, encontro inúmeros poemas colados nas estelas de fronteira.\n\nParecem ter sido escritos por outros viajantes, alguns mencionando lugares tão remotos quanto [poem_province.GetName] e seu(s) [poem_province.Custom('TerrainInspirationLoc')].\n\nUm poema em particular chama minha atenção. Ele descreve "
 tgp_travel_events.0030.t:0 "Poesia à Beira da Estrada"
 tgp_travel_events.0035.a:0 "Parar e ajudar [farmer_char.GetSheHe]."
 tgp_travel_events.0035.b:0 "Eu deveria melhorar as condições para meus camponeses."
 tgp_travel_events.0035.c:0 "Não tenho tempo!"
 tgp_travel_events.0035.desc.farmlands:0 "as colinas onduladas de [farming_county.GetProvince.GetName] abrirem-se diante de mim."
 tgp_travel_events.0035.desc.outro:0 "\n\nUm camponês está parado ao lado da estrada, curvado sobre uma roda que caiu de sua carroça. [farmer_char.GetSheHe|U] me vê e meu séquito, e sua expressão se torna a de um pai severo. \"Você recrutou meu filho para lutar em sua guerra. Se ele estivesse aqui, eu não precisaria trabalhar assim.\" \n\nObservando os campos, noto o quão poucos camponeses restam. Eles devem compartilhar este mesmo destino."
 tgp_travel_events.0035.desc.ricefields:0 "os terraços de arroz de [farming_county.GetProvince.GetName] espalharem-se diante de mim."
 tgp_travel_events.0035.desc:0 "Após atravessar [ROOT.Char.Custom('TerrainStruggleLoc')], vejo "
 tgp_travel_events.0035.t:0 "A Raiz é Fraca"
 tgp_travel_events.0040.a:0 "Executar [Select_CString( parent.IsFemale, 'a', 'o' )] [parent.GetMotherFather] [farmer_child.GetHerHim] como exemplo."
 tgp_travel_events.0040.b:0 "A criança pode trabalhar a dívida na corte."
 tgp_travel_events.0040.c:0 "Deixe passar."
 tgp_travel_events.0040.desc.farmlands:0 "um muro de pedra, vejo um camponês brincando de forma bruta com uma criança no campo próximo, ao lado de um boi particularmente grande."
 tgp_travel_events.0040.desc.outro:0 "\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetTitleAsNameNoTooltip]!\" o fazendeiro grita para mim. \"Esse boi é meu. Foi roubado do meu estábulo na noite passada! Deve ser aquel[Select_CString( parent.IsFemale, 'a', 'e' )] inútil [Select_CString( parent.IsFemale, 'da', 'do' )] [parent.GetMotherFather] [farmer_child.GetHerHim] aprontando de novo. [Select_CString( parent.IsFemale, 'A', 'O' )] [parent.GetMotherFather] [farmer_child.GetHerHim] é [Select_CString( parent.IsFemale, 'uma bêbada e ladra', 'um bêbado e ladrão' )], e ess[Select_CString( farmer_child.IsFemale, 'a', 'e' )] [farmer_child.Custom('GirlBoy')] sempre encobre os crimes [parent.GetHerHim].\" \n\nEu olho para a criança. [farmer_child.GetSheHe] fica visivelmente pálid[Select_CString( farmer_child.IsFemale, 'a', 'o' )] e treme por inteiro."
 tgp_travel_events.0040.desc.ricefields:0 "uma curva nos arrozais, vejo um camponês brincando de forma bruta com uma criança dentro d’água, ao lado de um boi particularmente grande."
 tgp_travel_events.0040.desc:0 "A monotonia da minha jornada é agravada pelo zumbido das cigarras entre as ervas daninhas. Porém, ao contornar "
 tgp_travel_events.0040.t:0 "Os Pelos de um Boi"
 tgp_travel_events.0041.a:0 "Tenho certeza de que [farmer_child.GetSheHe] fará o bem ao voltar para casa."
 tgp_travel_events.0041.c:0 "[farmer_child.GetTitledFirstName] deve permanecer como meu Mestre de Cavalos."
 tgp_travel_events.0041.d:0 "[farmer_child.GetTitledFirstName] deve permanecer como meu Copeiro."
 tgp_travel_events.0041.desc.alive:0 "[farmer_child.GetSheHe|U] claramente aprendeu muito durante sua estadia. \n\nAgora, é hora de devolver [farmer_child.GetSheHe] [Select_CString( parent.IsFemale, 'a', 'ao' )] [parent.GetMotherFather] bêbad[Select_CString( parent.IsFemale, 'a', 'o' )] e às terras de [thieving_county.GetProvince.GetName]."
 tgp_travel_events.0041.desc.court_position:0 "depois avançou para a posição [Select_CString( farmer_child.IsFemale, 'da', 'do' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('farmer_child'))]. O trabalho árduo [farmer_child.GetHerHim] aprimorou sua educação e transformou [farmer_child.GetSheHe] em um[Select_CString( farmer_child.IsFemale, 'a', '' )] [farmer_child.GetWomanMan] formidável!"
 tgp_travel_events.0041.desc.dead:0 "\n\n[Select_CString( parent.IsFemale, 'Sua', 'Seu' )] [parent.GetMotherFather] bêbad[Select_CString( parent.IsFemale, 'a', 'o' )] faleceu, e agora é dever [Select_CString( farmer_child.IsFemale, 'da', 'do' )] [farmer_child.GetTitledFirstName] retornar e cuidar das terras da família."
 tgp_travel_events.0041.desc.fallback:0 "$tgp_travel_events.0041.desc.study$"
 tgp_travel_events.0041.desc.kitchens:0 "depois passou a trabalhar com os chefs nas cozinhas, esfregando panelas e descascando incontáveis vegetais."
 tgp_travel_events.0041.desc.knight:0 "depois avançou para se tornar cavaleiro(a) em meu exército."
 tgp_travel_events.0041.desc.stables:0 "e trabalhou próximo dos cavalos ao longo dos anos, criando muitas excelentes montarias."
 tgp_travel_events.0041.desc.study:0 "depois passou a servir os estudiosos da corte, carregando cartuchos de tinta e mantendo os arquivos."
 tgp_travel_events.0041.desc:0 "À medida que as estações mudam, também chega ao fim a estadia [Select_CString( farmer_child.IsFemale, 'da', 'do' )] [farmer_child.GetTitledFirstName] na corte. \n\nPrimeiro, [farmer_child.GetSheHe] serviu como um(a) forte e confiável tratador(a) de estábulos, "
 tgp_travel_events.0041.e:0 "[farmer_child.GetTitledFirstName] deve permanecer como meu Poeta da Corte."
 tgp_travel_events.0041.f:0 "[farmer_child.GetTitledFirstName] deve permanecer na corte como Tutor."
 tgp_travel_events.0041.g.tt:0 "[farmer_child.GetTitledFirstName] continua servindo como [Select_CString( farmer_child.IsFemale, 'sua', 'seu' )] [THIS.Char.Custom2('RelationToMeShort', SCOPE.sC('farmer_child'))]."
 tgp_travel_events.0041.g:0 "[farmer_child.GetTitledFirstName] permanecerá em meu serviço!"
 tgp_travel_events.0041.t:0 "Uma Dívida Paga"
 tgp_travel_events.0041.tt_pay_first:0 "#weak... mas devo prestar homenagem à família como compensação.#!"
 tgp_travel_events.0045.a:0 "Talvez eu possa organizar um comércio com o governante deles."
 tgp_travel_events.0045.b.failure:0 "A troca gera alguma fascinação, mas falho em transmitir meu ponto"
 tgp_travel_events.0045.b.flavor:0 "Gestos com as mãos e desenhos vívidos devem, espero, atravessar a barreira linguística."
 tgp_travel_events.0045.b.success:0 "Demonstro a superioridade de uma cultura confuciana educada e inovadora"
 tgp_travel_events.0045.b:0 "Posso tentar ensiná-los nossos métodos."
 tgp_travel_events.0045.c:0 "Isso não é problema meu."
 tgp_travel_events.0045.desc:0 "Do topo de uma colina com vista para os campos de [foreign_county.GetName], percebo agricultores trabalhando a terra e quebrando as costas enquanto plantam sementes à mão. \n\nDesde que me entendo por gente, utilizamos semeadores mecânicos em nossa terra natal. Parece que esses ocidentais ainda não chegaram a tais descobertas."
 tgp_travel_events.0045.t:0 "Métodos Agrícolas Subdesenvolvidos"
