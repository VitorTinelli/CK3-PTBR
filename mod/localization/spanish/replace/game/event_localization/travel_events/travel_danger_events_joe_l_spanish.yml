 regional_ship_longship_plural:0 "navios longos"
 travel_danger_events.6000.a.wounded.desc:0 "A tripulação salva [overboard_character.GetShortUIName], mas [overboard_character.GetSheHe] ficou ferido na queda"
 travel_danger_events.6000.a.wounded.t:0 "Salvo, mas ferido"
 travel_danger_events.6000.a:0 "Dêem licença, vou cuidar disso!"
 travel_danger_events.6000.a_again:0 "Vou te enviar para se juntar ao outro!"
 travel_danger_events.6000.a_seriously:0 "Deixem-me #EMP PASSAR#!!"
 travel_danger_events.6000.b:0 "Mate isso, [beast_victim.GetFirstNameNoTooltip]! Agora!"
 travel_danger_events.6000.b_again:0 "É sua vez, [beast_victim.GetFirstNameNoTooltip]!"
 travel_danger_events.6000.b_seriously:0 "Essa é #EMP sua#!, [beast_victim.GetFirstNameNoTooltip]!"
 travel_danger_events.6000.b_travel_leader:0 "[travel_leader.GetFirstNameNoTooltip], faça alguma coisa!"
 travel_danger_events.6000.body:0 "\n\nA fera [ROOT.Char.Custom('GetAnimalColor')] [ROOT.Char.Custom('GetAnimalChargePresent')] sobre a trilha, suas grandes [ROOT.Char.Custom('GetAnimalTrackPlural')] levantando [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')]. Ladeada por árvores [ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')] aleatórias, ela bloqueia completamente nosso caminho para [destination.GetBaronyNameExplicitlyNoTooltip]."
 travel_danger_events.6000.c:0 "#EMP FUJAM#!! FUJAM PELAS SUAS #EMP VIDAS#!!"
 travel_danger_events.6000.desc.again:0 "Piso na trilha [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] lentamente, cauteloso após meu encontro recente com uma fera selvagem. Meu coração afunda quando ouço um [ROOT.Char.Custom('GetAnimalSound')] no [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] — [ROOT.Char.GetFaith.FateGodName] zomba de mim! [ROOT.Char.Custom('GetAnimalType')|U]!"
 travel_danger_events.6000.desc.seriously:0 "Marcado por nossa recente infortúnio, atravessamos os caminhos do [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] com extrema cautela. Justo quando começo a relaxar, um [ROOT.Char.Custom('GetAnimalSound')] irrompe da [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]! Maldit[ROOT.Char.Custom('GetAnimalType')]!"
 travel_danger_events.6000.desc:0 "Caminhamos pela trilha [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] a um bom ritmo, aproveitando a atmosfera tranquila. No canto do olho, tenho certeza de que vejo a [ROOT.Char.Custom('GetAnimalFeature')] de...! Um alto [ROOT.Char.Custom('GetAnimalSound')] confirma, um(a) [ROOT.Char.Custom('GetAnimalType')]!"
 travel_danger_events.6000.failure:0 "[ROOT.Char.Custom('GetAnimalType')|U] mata [beast_victim.GetShortUINameNoTooltipNoFormat]"
 travel_danger_events.6000.failure_root:0 "[ROOT.Char.Custom('GetAnimalType')|U] mata [root_scope.GetShortUINameNoTooltipNoFormat]"
 travel_danger_events.6000.success:0 "[ROOT.Char.Custom('GetAnimalType')|U] morre pelas mãos de [beast_victim.GetShortUINamePossessiveNoTooltipNoFormat]"
 travel_danger_events.6000.success_root:0 "[ROOT.Char.Custom('GetAnimalType')|U] morre pelas mãos de [root_scope.GetShortUINamePossessiveNoTooltipNoFormat]"
 travel_danger_events.6000.t:0 "$travel_danger_prefix$ Uma Fera Temível!"
 travel_danger_events.6000.victim:0 "\n\n[beast_victim.GetFirstName] sussurra, \"Apenas olhe para aqueles #EMP [ROOT.Char.Custom('GetAnimalDanger')]#!..."
 travel_danger_events.6000.wound:0 "[ROOT.Char.Custom('GetAnimalType')|U] mutila [beast_victim.GetShortUINameNoTooltipNoFormat]"
 travel_danger_events.6000.wound_root:0 "[ROOT.Char.Custom('GetAnimalType')|U] mutila [root_scope.GetShortUINameNoTooltipNoFormat]"
 travel_danger_events.6010.a.failure:0 "Eles percebem sua elegância"
 travel_danger_events.6010.a.success:0 "Você passa despercebido"
 travel_danger_events.6010.a:0 "Vamos nos misturar com os camponeses..."
 travel_danger_events.6010.ally_owner:0 "Tenho certeza de que meu aliado será vindicado e porá as coisas em ordem com [siege_victim.GetTitledFirstName]."
 travel_danger_events.6010.ally_victim:0 "Só posso assistir enquanto os domínios [Select_CString( siege_victim.IsFemale, 'da minha aliada', 'do meu aliado' )], [siege_victim.GetTitledFirstNamePossessive], são lenta mas seguramente devastados."
 travel_danger_events.6010.b.failure:0 "Eles não se impressionam"
 travel_danger_events.6010.b.flavor:0 "#EMP Você tem#! alguma #EMP ideia de quem eu sou?!#!"
 travel_danger_events.6010.b.friend:0 "Me leve para [siege_commander.GetTitledFirstNameNoTooltip], somos bons amigos."
 travel_danger_events.6010.b.success:0 "Sua posição os confunde"
 travel_danger_events.6010.b:0 "Eu sou [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitledFirstNameNoTooltip]! Eles vão nos deixar passar."
 travel_danger_events.6010.c.failure:0 "Eles desafiam você"
 travel_danger_events.6010.c.success:0 "Você é deixado sozinho"
 travel_danger_events.6010.c.wound:0 "Um membro aleatório do séquito está ferido"
 travel_danger_events.6010.c:0 "Uma demonstração de força os deterá."
 travel_danger_events.6010.capture_toast:0 "Viajante Capturado"
 travel_danger_events.6010.closing:0 "Um grupo de soldados mal-humorados e esfarrapados está vindo pela trilha - eles não parecem ser o tipo mais brilhante, ou honesto..."
 travel_danger_events.6010.d:0 "Eles só precisam ser comprados."
 travel_danger_events.6010.owner:0 "Minhas forças devem resolver rapidamente a situação desse desculpa de [siege_victim.Custom('FortifiedBuilding')]."
 travel_danger_events.6010.peace:0 "Essa pequena briga entre [siege_owner.GetTitledFirstName] e [siege_victim.GetTitledFirstName] é certamente um incômodo."
 travel_danger_events.6010.raid:0 "Ao nos aproximarmos de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], colunas de fumaça e grupos de camponeses passando deixam claro que o lugar está sendo saqueado. Os fortes podem pegar o que quiserem...\n\n"
 travel_danger_events.6010.raid_end:0 "Entre as cabanas em chamas, figuras vasculham as ruínas, comparando o saque e trocando histórias de coragem.\n\nUm grupo de saqueadores mal-humorados e esfarrapados está vindo pela trilha - eles não parecem ser o tipo mais brilhante, ou honesto..."
 travel_danger_events.6010.relation_owner:0 "M[Select_CString( siege_owner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('siege_owner'))], [siege_owner.GetTitledFirstName], está claramente determinado a derrubar [siege_victim.GetTitledFirstName], a qualquer custo."
 travel_danger_events.6010.relation_victim:0 "M[Select_CString( siege_victim.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('siege_victim'))], [siege_victim.GetTitledFirstName], está claramente tendo dificuldades para defender este lugar das forças de [siege_owner.GetTitledFirstNamePossessive]."
 travel_danger_events.6010.siege:0 "Um acampamento de cerco domina as redondezas de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], as cores [siege_owner.GetPrimaryTitle.GetAdjectiveNoTooltip] tremulando languidamente, prenúncios de uma [siege_war.Custom('WarCasusBelliShort')].\n\n"
 travel_danger_events.6010.siege_end:0 "No meio dos [siege_owner.Custom('RegionalArtilleryPlural')], soldados distantes se aquecem em fogueiras modestas de acampamento.\n\n$travel_danger_events.6010.closing$"
 travel_danger_events.6010.sieger_liege:0 "[Select_CString( siege_owner.IsFemale, 'Minha vassala', 'Meu vassalo' )], [siege_owner.GetTitledFirstName], está claramente determinado a derrubar [siege_victim.GetTitledFirstName], a qualquer custo."
 travel_danger_events.6010.t:0 "$travel_danger_prefix$ Fumaça à Frente"
 travel_danger_events.6010.victim:0 "Dói-me ver minhas terras devastadas assim, mas esta não é uma luta que posso vencer."
 travel_danger_events.6010.war_owner:0 "Com sorte, os atacantes triunfarão e arrastarão [siege_victim.GetTitledFirstName] a pontapés e gritos."
 travel_danger_events.6010.war_victim:0 "Se ao menos eu pudesse fazer algo para ajudar [siege_victim.GetTitledFirstName] e nos livrar [Select_CString( siege_owner.IsFemale, 'dessa maldita', 'desse maldito' )] [siege_owner.GetTitledFirstName]."
 travel_danger_events.6011.ally_battle_1:0 "Exércitos carregando as cores do meu aliado, [battle_owner_1.GetTitledFirstName], e [battle_owner_2.GetTitledFirstName] $travel_danger_events.6011.clash$"
 travel_danger_events.6011.ally_battle_2:0 "Exércitos carregando as cores do meu aliado, [battle_owner_2.GetTitledFirstName], e de [battle_owner_1.GetTitledFirstName] $travel_danger_events.6011.clash$"
 travel_danger_events.6011.b:0 "Eles não interferirão com um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip]!"
 travel_danger_events.6011.battle_both:0 "Exércitos carregando as cores dos meus inimigos, [battle_owner_1.GetTitledFirstName] e [battle_owner_2.GetTitledFirstName], $travel_danger_events.6011.clash$"
 travel_danger_events.6011.clash:0 "colidem nos distantes [ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')],"
 travel_danger_events.6011.d:0 "O ouro é sua única linguagem."
 travel_danger_events.6011.end:0 "\n\nUm grupo desanimado - desertores talvez, ou mercenários - estão saindo sorrateiramente e vindo diretamente na nossa direção."
 travel_danger_events.6011.hostile:0 "resolvendo alguma disputa trivial."
 travel_danger_events.6011.intro:0 "Os avisos dos moradores assustados mal são necessários, está claro que uma batalha está acontecendo à frente; destroços da guerra, vítimas e acampamentos improvisados estão por toda parte.\n\n"
 travel_danger_events.6011.peace:0 "Exércitos carregando as cores [battle_owner_1.GetPrimaryTitle.GetAdjectiveNoTooltip] e [battle_owner_2.GetPrimaryTitle.GetAdjectiveNoTooltip] $travel_danger_events.6011.clash$"
 travel_danger_events.6011.raid:0 "um para saquear, e outro para guardar."
 travel_danger_events.6011.raid_both:0 "lutando por pedaços de saque."
 travel_danger_events.6011.relation_battle_1:0 "Exércitos carregando as cores [Select_CString( battle_owner_1.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('battle_owner_1'))], [battle_owner_1.GetTitledFirstName], e [battle_owner_2.GetTitledFirstName] $travel_danger_events.6011.clash$"
 travel_danger_events.6011.relation_battle_2:0 "Exércitos carregando as cores [Select_CString( battle_owner_2.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('battle_owner_2'))], [battle_owner_1.GetTitledFirstName], e [battle_owner_2.GetTitledFirstName] $travel_danger_events.6011.clash$"
 travel_danger_events.6011.t:0 "$travel_danger_prefix$ Batalha à Frente"
 travel_danger_events.6011.war:0 "acertando suas [battle_war.Custom('WarCasusBelliShort')]."
 travel_danger_events.6011.war_battle_1:0 "Exércitos carregando as cores do meu inimigo, [battle_owner_1.GetTitledFirstName], e [battle_owner_2.GetTitledFirstName] $travel_danger_events.6011.clash$"
 travel_danger_events.6011.war_battle_2:0 "Exércitos carregando as cores do meu inimigo, [battle_owner_2.GetTitledFirstName], e [battle_owner_1.GetTitledFirstName] $travel_danger_events.6011.clash$"
 travel_danger_events.6012.ally:0 "A visão [Select_CString( army_owner.IsFemale, 'da minha aliada', 'do meu aliado' )], [army_owner.GetTitledFirstNamePossessive], exército é muito bem-vinda,"
 travel_danger_events.6012.clash:0 "colidindo nos distantes [ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')],"
 travel_danger_events.6012.end:0 "\n\nUm grupo de soldados desgrenhados está vindo na direção oposta. Eles têm a aparência de desertores."
 travel_danger_events.6012.intro:0 "As estradas estão movimentadas com as carroças e reforços de um exército que passa. Ao longe, bandeiras coloridas de [army_owner.GetPrimaryTitle.GetAdjectiveNoTooltip] brilham ao sol, fazendo um progresso lento através dos [ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')].\n\n"
 travel_danger_events.6012.other:0 "conforme ele segue em direção a algum objetivo distante."
 travel_danger_events.6012.peace:0 "A visão deste exército preocupa o grupo,"
 travel_danger_events.6012.raid:0 "a caminho de saquear alguma vila infeliz."
 travel_danger_events.6012.relation:0 "A visão [Select_CString( army_owner.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('army_owner'))], [army_owner.GetTitledFirstNamePossessive], exército me faz hesitar,"
 travel_danger_events.6012.t:0 "$travel_danger_prefix$ Passagem da Guerra"
 travel_danger_events.6012.war:0 "A visão [Select_CString( army_owner.IsFemale, 'da minha inimiga', 'do meu inimigo' )], [army_owner.GetTitledFirstNamePossessive], exército me enche de temor,"
 travel_danger_events.6013.ally_owner:0 "[Select_CString( occupy_owner.IsFemale, 'Minha aliada', 'Meu aliado' )], [occupy_owner.GetTitledFirstName], claramente tem obtido vantagens contra [occupy_victim.GetTitledFirstName],"
 travel_danger_events.6013.ally_victim:0 "[Select_CString( occupy_victim.IsFemale, 'Minha aliada', 'Meu aliado' )], [occupy_victim.GetTitledFirstName], claramente teve alguns contratempos contra [occupy_owner.GetTitledFirstName],"
 travel_danger_events.6013.end:0 "\n\nÀ medida que continuamos em direção a [destination.GetNameNoTooltip], um grupo temível de veteranos se aproxima na direção oposta."
 travel_danger_events.6013.hostile:0 "embora, quem sabe o resultado final."
 travel_danger_events.6013.intro:0 "As cicatrizes da guerra estão por toda parte ao passarmos por [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], onde as bandeiras foram substituídas apressadamente pelas cores [occupy_owner.GetPrimaryTitle.GetAdjectiveNoTooltip].\n\n"
 travel_danger_events.6013.peace:0 "Tivemos a sorte de não presenciar o conflito em si, pelo menos"
 travel_danger_events.6013.relation_owner:0 "M[Select_CString( occupy_owner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('occupy_owner'))], [occupy_owner.GetTitledFirstName], claramente tem obtido vantagens contra [occupy_victim.GetTitledFirstName],"
 travel_danger_events.6013.relation_victim:0 "M[Select_CString( occupy_victim.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('occupy_victim'))], [occupy_victim.GetTitledFirstName], claramente teve alguns contratempos contra [occupy_owner.GetTitledFirstName],"
 travel_danger_events.6013.t:0 "$travel_danger_prefix$ Terreno Contestado"
 travel_danger_events.6013.war:0 "embora a [occupy_war.Custom('WarCasusBelliShort')] continue em outro lugar."
 travel_danger_events.6013.war_owner:0 "[Select_CString( occupy_owner.IsFemale, 'Minha inimiga', 'Meu inimigo' )], [occupy_owner.GetTitledFirstName], claramente tem obtido vantagens contra [occupy_victim.GetTitledFirstName],"
 travel_danger_events.6013.war_victim:0 "[Select_CString( occupy_victim.IsFemale, 'Minha inimiga', 'Meu inimigo' )], [occupy_victim.GetTitledFirstName], claramente teve alguns contratempos contra [occupy_owner.GetTitledFirstName],"
 travel_danger_events.6020.a:0 "ArghghghGHHghghh!"
 travel_danger_events.6020.desc:0 "Nuvens malignas se reúnem e eu sinto o medo por trás das reassurances do capitão. Uma tempestade terrível em breve nos envolve, chicoteando os convés com chuva abrasadora enquanto o [ROOT.Char.Custom('RegionalShipType')] rola como um brinquedo.\n\nUm ruído estrondoso, mais alto que o trovão, como se o próprio mundo fosse rasgado ao meio por um gigante terrível, perfura nossos ouvidos enquanto a embarcação cede sob nossos pés.\n\n"
 travel_danger_events.6020.director:0 "Observo maravilhado enquanto [director.GetTitledFirstName] fica de pé, gritando ordens que ninguém pode ouvir, alheio à enorme onda que está prestes a engolir [director.GetSheHe]!"
 travel_danger_events.6020.diver:0 "[diver.GetTitledFirstName] segura as têmporas, gritando \"[diver.GetFaith.DevilNamePossessive] horror vem nos pegar! Não há escapatória!\" antes de se jogar na enorme onda que cobre o navio!"
 travel_danger_events.6020.fallback:0 "Me espremo em um canto, observando horrorizado enquanto marinheiros são lançados nas profundezas escuras e uma enorme onda engole o navio."
 travel_danger_events.6020.hugger:0 "[hugger.GetTitledFirstName] e eu nos agarramos aterrorizados, observando com olhos arregalados enquanto uma enorme onda corre em direção ao navio!"
 travel_danger_events.6020.prayer:0 "Eu observo [prayer.GetTitledFirstName], ajoelhada com os braços estendidos para o céu rasgado por relâmpagos, chorando, \"[prayer.GetFaith.HighGodName]! [prayer.GetFaith.WaterGodName]! Nos salve!\" enquanto uma grande ondulação rola sobre o convés!"
 travel_danger_events.6020.t:0 "$travel_danger_prefix$ Perigos do Profundo"
 travel_danger_events.6030.a:0 "É apenas um pouco de mofo!"
 travel_danger_events.6030.b.critical:0 "Você come a planta errada"
 travel_danger_events.6030.b.death:0 "Você come a pior planta"
 travel_danger_events.6030.b.failure:0 "Você não encontra nada"
 travel_danger_events.6030.b.success:0 "Você encontra algum alimento"
 travel_danger_events.6030.b:0 "A natureza nos proverá!"
 travel_danger_events.6030.c:0 "Os moradores da região devem ter algo."
 travel_danger_events.6030.d:0 "Teremos que substituir tudo."
 travel_danger_events.6030.desc:0 "\n\nPedaços de mofo cobrem o pão e os vegetais, e rapidamente consumimos os alimentos secos restantes. O grupo começa a sentir fome enquanto o crepúsculo começa a cair."
 travel_danger_events.6030.fallback:0 "Mal posso acreditar, mas nossos suprimentos de comida para a viagem estão praticamente inúteis, pois foram mal armazenados..."
 travel_danger_events.6030.leader:0 "[travel_leader.GetFirstName] está encarregado de nossos suprimentos de comida e revelou timidamente que nossas provisões agora estão quase todas inutilizáveis, devido ao armazenamento inadequado..."
 travel_danger_events.6030.t:0 "$travel_danger_prefix$ Provisões Problemáticas"
 travel_danger_events.6040.a:0 "Preciso voltar."
 travel_danger_events.6040.b:0 "Agradeço a [ROOT.Char.GetFaith.HealthGodName] que o $court_physician_court_position$ está aqui."
 travel_danger_events.6040.c:0 "Devemos continuar pressionando..."
 travel_danger_events.6040.desc:0 "\nComeço a me sentir fraco, ficando para trás em relação ao resto do grupo quando normalmente dito o ritmo... Alguma coisa está errada..."
 travel_danger_events.6040.t:0 "$travel_danger_prefix$ Debaixo do Tempo"
 travel_danger_events.6040.war:0 "Os [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] estão marcados pela guerra, espalhados com suas vítimas e os acampamentos de seus agentes. As condições são terríveis, e nossos encontros com soldados são frequentes."
 travel_danger_events.6040.wet:0 "Nossa passagem por este maldito [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] tem sido tensa, fraturando os nervos e a energia enquanto avançamos pelo úmido pegajoso, espantando insetos e tentando ficar secos."
 travel_stealing_food_modifier:0 "Provisões Roubadas"
 travel_stealing_food_modifier_desc:0 "Nobres que viajaram por este condado se serviram dos produtos de seus súditos."
