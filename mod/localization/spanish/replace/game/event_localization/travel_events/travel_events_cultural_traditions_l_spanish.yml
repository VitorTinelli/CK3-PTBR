 fishing_logistics_modifier:0 "Logística de Pesca"
 fishing_logistics_modifier_desc:0 "Este personagem está aplicando conhecimentos de pesca à logística naval."
 healthy_vegetarian_meal_modifier:0 "Refeição Vegetariana Saudável"
 healthy_vegetarian_meal_modifier_desc:0 "Este personagem comeu uma refeição vegetariana saudável durante a viagem."
 living_simply_modifier:0 "Vida Simples"
 living_simply_modifier_desc:0 "Este personagem está vivendo de maneira simples."
 loyal_attitudes_modifier:0 "Atitudes Leais"
 loyal_attitudes_modifier_desc:0 "Este personagem está inspirando lealdade em si mesmo e nos outros."
 musically_inspired_modifier:0 "Inspirado Musicalmente"
 musically_inspired_modifier_desc:0 "Este personagem foi inspirado pela música e muitas vezes pratica para seus prisioneiros."
 mystic_wisdom_modifier:0 "Sabedoria Mística"
 mystic_wisdom_modifier_desc:0 "Este personagem recentemente recebeu sabedoria compartilhada por um místico."
 pacifist_mindset_modifier:0 "Mentalidade Pacifista"
 pacifist_mindset_modifier_desc:0 "Este personagem está tentando adotar uma mentalidade mais pacifista."
 personal_chivalry_modifier:0 "Cavalheirismo Pessoal"
 personal_chivalry_modifier_desc:0 "Este personagem recentemente tem se concentrado em seu próprio cavalheirismo pessoal."
 philosophical_musings_modifier:0 "Reflexões Filosóficas"
 philosophical_musings_modifier_desc:0 "Este personagem teve recentemente muitas reflexões filosóficas."
 told_good_story_modifier:0 "Contou uma Boa História"
 told_good_story_modifier_desc:0 "Este personagem contou recentemente uma boa história."
 tradition_travel_discount_desc:0 "Você experimentou esta Tradição Cultural durante a viagem."
 trained_in_warrior_culture_modifier:0 "Treinado na Cultura Guerreira"
 trained_in_warrior_culture_modifier_desc:0 "Este personagem recentemente recebeu treinamento em uma cultura guerreira."
 training_hard_modifier:0 "Treinando Duro"
 training_hard_modifier_desc:0 "Este personagem está atualmente treinando duro."
 travel_events.1200.a.tt:0 "Reduz o custo de estabelecer a tradição [GetCultureTradition('tradition_xenophilic').GetName] em [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"
 travel_events.1200.a:0 "Devo conversar com eles e aprender mais."
 travel_events.1200.b:0 "Vamos aproveitar todos os benefícios que pudermos."
 travel_events.1200.desc:0 "Enquanto paramos para acampar fora de uma pequena vila em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], os habitantes locais vêm investigar nossa caravana.\n\nA princípio, acho que estão tentando negociar conosco, mas logo fica claro que vieram nos dar presentes e aprender tudo o que podem sobre nossa cultura!\n\nUm dos locais em particular, [local_peasant.GetNameNoTooltip], tem um milhão de perguntas sobre de onde viemos."
 travel_events.1200.t:0 "Locais Amigáveis"
 travel_events.1201.a.tt:0 "Reduz o custo de estabelecer a tradição [GetCultureTradition('tradition_chivalry').GetName] em [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"
 travel_events.1201.a:0 "Eu adoraria trazer essa tradição para casa."
 travel_events.1201.b:0 "Devo tentar ser mais pessoalmente cavalheiresco."
 travel_events.1201.desc:0 "Enquanto viajamos por [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], nos deparamos com alguns [GetPlayer.Custom('KnightCulturePlural')] [ROOT.Char.GetCurrentLocation.GetCulture.GetName]. Eles são profundamente respeitosos e aparentemente grandes amantes de poesia, pois insistem em recitá-la em todas as oportunidades que têm.\n\nO código de conduta que eles seguem tem vários méritos e não posso deixar de admirá-lo. Um dos [GetPlayer.Custom('KnightCulturePlural')], [local_knight.GetNameNoTooltip], é particularmente impressionante."
 travel_events.1201.t:0 "A Cavalaria Está Viva"
 travel_events.1202.a.tt:0 "Reduz o custo de estabelecer a tradição [GetCultureTradition('tradition_hard_working').GetName] em [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"
 travel_events.1202.a:0 "Devo conversar com eles e aprender mais."
 travel_events.1202.b:0 "Talvez eu possa aplicar alguns desses princípios em casa."
 travel_events.1202.desc:0 "Enquanto viajamos por [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], não posso deixar de notar que todas as pessoas que vejo trabalham com uma intensidade tranquila que raramente noto em minha própria terra.\n\nParo um dos trabalhadores para perguntar a ele sobre isso e [random_peasant.GetSheHe] compartilha alguma sabedoria concisa:\n\n “Bem, você vê, o truque é se dedicar a isso e não parar até que o trabalho esteja bem feito.”"
 travel_events.1202.t:0 "Trabalhadores Dedicados"
 travel_events.1203.a.tt:0 "Reduz o custo de estabelecer a tradição [GetCultureTradition('tradition_loyal_soldiers').GetName] de Soldados Leais em [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"
 travel_events.1203.a:0 "Devo conversar com eles e aprender mais."
 travel_events.1203.b:0 "Farei meus súditos serem igualmente leais."
 travel_events.1203.desc:0 "Ao passar pelas aldeias de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], passo um tempo conversando com os habitantes locais. Uma coisa que se destaca é a intensa lealdade deles ao seu senhor.\n\nUm morador fala com tanta paixão que eu pensaria que ele estava descrevendo um amante em vez de seu governante."
 travel_events.1203.t:0 "Laços Fortes"
 travel_events.1204.a.tt:0 "Reduz o custo de estabelecer a tradição [GetCultureTradition('tradition_pacifism').GetName] em [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"
 travel_events.1204.a:0 "Devo conversar com eles e aprender mais."
 travel_events.1204.b:0 "Vou tentar esse pacifismo."
 travel_events.1204.desc:0 "Enquanto viajo por [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], tenho a chance de observar alguns habitantes locais discutindo sobre quem é o dono de um determinado gado. Apesar do tópico da disputa parecer bastante sério, ambas as partes permanecem calmas e tranquilas, e ninguém recorre a agressões.\n\nImagine o que poderíamos realizar se tivéssemos esse nível de paz e razão em casa."
 travel_events.1204.t:0 "Discussão Civilizada"
 travel_events.1205.a.tt:0 "Reduz o custo de estabelecer a tradição [GetCultureTradition('tradition_spartan').GetName] em [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"
 travel_events.1205.a:0 "Poderíamos aprender algo com isso em casa."
 travel_events.1205.b:0 "Devo tentar viver de forma simples."
 travel_events.1205.desc:0 "Ao viajar pelo [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], não posso deixar de notar o quão simples são as vestimentas, as moradias e até mesmo as expressões dos rostos dos habitantes locais [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip].\n\nNo entanto, ao perguntar sobre a pobreza desta área em particular, fui informado de que tudo isso é uma escolha e eles estão mais focados em questões práticas do que em aparências."
 travel_events.1205.t:0 "Vidas Simples"
 travel_events.1206.a.tt:0 "Reduz o custo de estabelecer a tradição [GetCultureTradition('tradition_hunters').GetName] em [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"
 travel_events.1206.a:0 "Por que meu povo não pode ser mais assim?"
 travel_events.1206.b:0 "Talvez eles possam me treinar?"
 travel_events.1206.c:0 "Eu sou o caçador!"
 travel_events.1206.desc:0 "Ao viajar pelo [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], deparo-me com um grupo de caçadores. Eles me permitem acompanhar a caçada por um tempo, apontando algumas técnicas específicas e algumas pistas de rastreamento únicas desta área."
 travel_events.1206.t:0 "Alegria da Caçada"
 travel_events.1207.a.tt:0 "Reduz o custo de estabelecer a tradição [GetCultureTradition('tradition_vegetarianism').GetName] em [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"
 travel_events.1207.a:0 "Eu quero algumas receitas!"
 travel_events.1207.b:0 "Talvez uma segunda porção?"
 travel_events.1207.desc:0 "Enquanto viajo por [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], um dos anciãos da vila nos para e insiste que nos juntemos para uma refeição. Enquanto como, percebo que nem um pedaço é feito de carne. O ancião fica feliz em entrar em detalhes sobre como é feito, os ingredientes usados e como eles realmente não comem carne."
 travel_events.1207.t:0 "Carne da Terra"
 travel_events.1208.a.tt:0 "Reduz o custo de estabelecer a tradição [GetCultureTradition('tradition_seafaring').GetName] em [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"
 travel_events.1208.a:0 "Deveríamos conversar com eles e aprender mais."
 travel_events.1208.b:0 "Chega de ouvir, hora de aplicar esse conhecimento."
 travel_events.1208.desc:0 "Enquanto navego por [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], ancoramos para conversar com um barco cheio de habitantes locais. O que deveria ser uma parada rápida acaba sendo uma longa discussão sobre nós, correntes locais e navegação geral.\n\n\"Bem, você vê, o albatroz é o rei de todas as aves, e matá-lo bem. Isso é o maior de todos os crimes.\""
 travel_events.1208.t:0 "Navegação Marítima"
 travel_events.1209.a.tt:0 "Reduz o custo de estabelecer a tradição [GetCultureTradition('tradition_storytellers').GetName] em [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"
 travel_events.1209.a:0 "Devo incentivar mais narrativas em casa."
 travel_events.1209.b:0 "Se você gosta de histórias, vai adorar esta."
 travel_events.1209.desc:0 "Os contadores de histórias [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] são muito renomados e, quando finalmente os conheço, eles não decepcionam!\n\nPassamos muitas horas sentados ao redor do fogo ouvindo suas histórias e é uma verdadeira alegria ouvi-los falar."
 travel_events.1209.t:0 "A História Está na Narrativa"
 travel_events.1210.a.tt:0 "Reduz o custo de estabelecer a tradição [GetCultureTradition('tradition_music_theory').GetName] em [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"
 travel_events.1210.a:0 "Deveríamos levar essa tradição para casa."
 travel_events.1210.b:0 "Eu quero aprender a tocar!"
 travel_events.1210.desc:0 "Enquanto viajo pelo [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], ouço uma melodia flutuando suavemente pela paisagem.\n\nUma rápida diversão fora do caminho me leva a um grupo de músicos tocando com todo o coração o que deve ser alguma música local [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip]. Parando para ouvir a bela música, sinto meu coração se enchendo de alegria."
 travel_events.1210.t:0 "Música [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip|U]"
 travel_events.1211.a.tt:0 "Reduz o custo de estabelecer a tradição [GetCultureTradition('tradition_poetry').GetName] em [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"
 travel_events.1211.a:0 "Deveríamos conversar com eles e aprender mais."
 travel_events.1211.b:0 "Eu gostaria de fazer uma tentativa."
 travel_events.1211.c:0 "Você chama isso de poesia?"
 travel_events.1211.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], [ROOT.Char.Custom('FormOfAddressForLiege')], por favor, apenas um momento do seu tempo para ouvir meu poema mais recente!\"\n\nEste não é o primeiro [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] que tenta me apresentar sua poesia e, considerando a estrada à frente, certamente não será o último. Deve haver uma verdadeira fascinação por poesia aqui, para que todo outro sonhador tenha um poema em seus corações."
 travel_events.1211.t:0 "Povo da Poesia"
 travel_events.1212.a.tt:0 "Reduz o custo de estabelecer a tradição [GetCultureTradition('tradition_fishermen').GetName] em [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"
 travel_events.1212.a:0 "Deveríamos conversar com eles e aprender mais."
 travel_events.1212.b:0 "E se aplicássemos essas táticas de pesca à navegação marítima?"
 travel_events.1212.desc:0 "Não passa um dia em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] em que não encontro um pescador que tenha uma nova informação para me dar, seja sobre o tipo de isca a usar, onde pescar ou até mesmo como preparar o peixe depois de capturado.\n\nAté tenho a chance de pescar sozinho, com os pescadores me mostrando as dicas e truques. Todos aplaudem quando finalmente pego um."
 travel_events.1212.t:0 "Amigos da Pesca"
 travel_events.1213.a.tt:0 "Reduz o custo de estabelecer a tradição [GetCultureTradition('tradition_mendicant_mystics').GetName] em [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"
 travel_events.1213.a:0 "Estou mais interessado em conhecer seu povo."
 travel_events.1213.b:0 "Que sabedoria você pode compartilhar comigo?"
 travel_events.1213.desc:0 "Os místicos estão por toda parte aqui em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: eles pregam e compartilham seu conhecimento.\n\nUm dia, entro em uma conversa bastante profunda sobre o significado da vida com um deles enquanto espero que uma pedra seja removida do caminho."
 travel_events.1213.t:0 "Viajantes Místicos"
 travel_events.1214.a.tt:0 "Reduz o custo de estabelecer a tradição [GetCultureTradition('tradition_warrior_culture').GetName] em [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"
 travel_events.1214.a:0 "Deveríamos conversar com eles e aprender mais."
 travel_events.1214.b:0 "Você pode me mostrar alguns movimentos?"
 travel_events.1214.desc:0 "Durante minhas viagens, percebi que os locais da cultura [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] aqui em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] valorizam os guerreiros acima de tudo.\n\nAs disputas são resolvidas com violência e aqueles que colocam a vida em risco pelo seu reino são considerados os mais corajosos. Passei grande parte de uma tarde discutindo com eles alguns pontos finos de sua cultura guerreira."
 travel_events.1214.t:0 "Guerreiros Respeitados"
 travel_events.1215.a.tt:0 "Reduz o custo de estabelecer a tradição [GetCultureTradition('tradition_martial_admiration').GetName] em [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"
 travel_events.1215.a:0 "Devo descobrir por que eles os consideram tão altamente."
 travel_events.1215.b:0 "Eu posso ser assim se treinar!"
 travel_events.1215.desc:0 "Paramos para descansar uma noite em uma taverna e enquanto estou sentado no canto, desfrutando pacificamente de alguma música [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip], a porta se abre abruptamente e uma grande silhueta aparece.\n\nUm [GetPlayer.Custom('KnightCultureNoTooltipLowercase')] entra e a atmosfera muda imediatamente. As pessoas abaixam a cabeça em reverência, algumas desmaiam e o dono do bar imediatamente derrama as bebidas grátis aparentemente famosas do [GetPlayer.Custom('KnightCultureNoTooltipLowercase')].\n\nSer um [GetPlayer.Custom('KnightCultureNoTooltipLowercase')] é realmente tão especial aqui?"
 travel_events.1215.t:0 "O Admirável [GetPlayer.Custom('KnightCultureNoTooltip')] "
 travel_events.1216.a.tt:0 "Reduz o custo de estabelecer a tradição [GetCultureTradition('tradition_philosopher_culture').GetName] em [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"
 travel_events.1216.a:0 "Devo aprender mais sobre como funciona sua cultura."
 travel_events.1216.b:0 "O que posso aprender pessoalmente?"
 travel_events.1216.desc:0 "Uma coisa que eu percebo enquanto passamos por [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] é que todo outro viajante [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] afirma ser um filósofo.\n\nInicialmente, sou cético em relação a isso, mas depois de ser amplamente superado em minha terceira conversa consecutiva, começo a pensar que talvez haja algo em suas afirmações.\n\nO último filósofo, [local_philosopher.GetNameNoTooltip], está praticamente rindo das minhas mais recentes tentativas de argumento lógico."
 travel_events.1216.t:0 "Pensadores Viajantes"
 villager_gifts_modifier:0 "Presentes dos Aldeões"
 villager_gifts_modifier_desc:0 "Este personagem recebeu vários presentes dos aldeões."
