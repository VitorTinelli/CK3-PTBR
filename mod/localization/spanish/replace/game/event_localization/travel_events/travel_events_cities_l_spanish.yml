l_spanish:
 AQUEDUCT_OF_VALENS_GLOSS:0 "O #EMP Aqueduto de Valente#! foi construído no século IV e continuou a fornecer água fresca para a cidade de Constantinopla por mais de mil anos. Uma combinação de cisternas a céu aberto e enormes subterrâneas permite que a cidade armazene mais de um milhão de metros cúbicos de água."
 AUGUSTAION_GLOSS:0 "A Augustaion é a praça logo fora do portão Chalke da área palaciana imperial de Constantinopla. No extremo da praça está o [Glossary('Milion', 'MILION_GLOSS')], diante do Hipódromo, e ao lado ficam os banhos monumentais de Zeuxippos e a Catedral de Santa Sofia."
 BYZANTINE_COINAGE_GLOSS:0 "As moedas de cobre e ouro eram a principal moeda do Império Bizantino. O Solidus de Ouro e, mais tarde, o Hyperpyron, foram as moedas mais valiosas e também muito procuradas no ocidente, onde eram conhecidas como #EMP Bezantes#!."
 FALLBACK_COIN:0 "moeda"
 HYPERPYRON:0 "[Glossary('Hyperpyra', 'BYZANTINE_COINAGE_GLOSS')]"
 PROSPHORION_GLOSS:0 "O porto comercial do norte de [GetTitleByKey('b_constantinople').GetNameNoTier], a cidade também possuía vários outros portos militares, comerciais e imperiais."
 SOLIDUS:0 "[Glossary('Solidi', 'BYZANTINE_COINAGE_GLOSS')]"
 book_artifact_loc:0 "[souvenir.GetDesc]\n\nNa última página alguém escreveu uma nota sobre tê-lo comprado nos mercados de livros de [city_province.GetName]."
 book_souvenir_bought:0 "[souvenir.GetName] foi comprado nos Mercados de Livros de [city_province.GetNameNoTooltip]"
 book_souvenir_companion_tooltip:0 "As chances de encontrar um livro melhor são aumentadas pelo meu companheiro de viagem [sightseeing_companion.GetName]"
 book_souvenir_tooltip:0 "Um artefato de livro será adquirido nos mercados de livros"
 crown_artifact_loc:0 "[souvenir.GetDesc]\n\nNa parte interna da coroa há um pequeno carimbo da oficina em [city_province.GetName] que a produziu."
 duel_companion_tooltip:0 "[sightseeing_companion.GetName] melhorou as chances de um resultado positivo desta opção"
 regalia_artifact_loc:0 "[souvenir.GetDesc]\n\nO ornamento está envolta em um pedaço de pano onde alguém escreveu uma nota sobre tê-la comprado de um dos artesãos em [city_province.GetName]."
 souvenir_bought:0 "[souvenir.GetName] foi comprado em [city_province.GetNameNoTooltip]"
 souvenir_bought_companion:0 "[sightseeing_companion.GetName] me ajudou a adquirir [souvenir.GetName]"
 souvenir_companion_tooltip:0 "As chances de encontrar um artefato melhor são aumentadas pelo meu companheiro de viagem [sightseeing_companion.GetName]"
 souvenir_tooltip:0 "Um artefato será adquirido nos mercados de [city_province.GetNameNoTooltip]"
 travel_city_baghdad_cemeteries:0 "Navegando pela cidade, noto muitas ruínas e monumentos antigos. Eventualmente, me encontro nos cemitérios, entre os túmulos de califas e estudiosos legais de tempos já passados."
 travel_city_baghdad_cemeteries_title:0 "[city_province.GetNameNoTooltip] dos Tempos Passados"
 travel_city_baghdad_companion_reflection:0 "\n\nM[Select_CString( sightseeing_companion.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', sightseeing_companion)] [sightseeing_companion.GetName] observa que estes são homens que conheceram um Bagdá diferente, quase irreconhecível nos dias de hoje."
 travel_city_baghdad_intro:0 "Passando pelas portas de [city_province.GetNameNoTooltip], é difícil não refletir sobre ter chegado ao centro tradicional do mundo árabe e islâmico.\n\n"
 travel_city_baghdad_royal_enclosure:0 "Nos arredores da cidade interna, me vejo cercado por palácios menores, cozinhas e padarias. Se erguendo sobre nós o tempo todo está a cúpula verde do Palácio da Porta Dourada."
 travel_city_baghdad_royal_enclosure_title:0 "[city_province.GetNameNoTooltip]: o Bairro Real"
 travel_city_baghdad_suq_al_warraqin:0 "À medida que me aproximo da cidade interna, o ar se enche de discurso literário intelectual. Toda esta rua, incluindo suas pontes, é dominada por centenas de livrarias movimentadas e salões literários."
 travel_city_baghdad_suq_al_warraqin_title:0 "[city_province.GetNameNoTooltip]: Suq al-Warraqin"
 travel_city_center_of_the_world_reflection:0 "\n\nCercado por edifícios monumentais, não é difícil acreditar nas alegações deles. Minha própria existência de repente parece menos significativa."
 travel_city_companion_center_of_the_world_reflection:0 "\n\n“[ROOT.Char.Custom2('RelationToMeAddress', sightseeing_companion)|U], este é um lugar como nenhum outro que você já esteve. Estamos diante de mais de milênios de história.”"
 travel_city_companion_idea:0 "\n\nM[Select_CString( sightseeing_companion.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', sightseeing_companion)] [sightseeing_companion.GetFirstName] reflete pensativamente: “[ROOT.Char.Custom2('RelationToMeAddress', sightseeing_companion)|U], poderíamos passar um tempo aqui estudando os costumes deles.”"
 travel_city_companion_impressed:0 "\n\nM[Select_CString( sightseeing_companion.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', sightseeing_companion)] murmura para mim enquanto aprecia este espetáculo acadêmico: “Eu realmente poderia passar uma vida inteira aqui, [ROOT.Char.Custom2('RelationToMeAddress', sightseeing_companion)|U]”\n"
 travel_city_constantinople_aqueduct_valens:0 "Impulsionados pela curiosidade, seguimos um [Glossary('enorme aqueduto', 'AQUEDUCT_OF_VALENS_GLOSS')] até a entrada de uma cisterna subterrânea. Um guarda nos conta que foi a fonte de água da cidade por gerações e se oferece para nos mostrar o interior enorme por um pequeno valor.\n"
 travel_city_constantinople_aqueducts_title:0 "[city_province.GetBaronyNameExplicitlyNoTooltip]: Aquedutos e Cisternas"
 travel_city_constantinople_augustaion:0 "Ao meio-dia, descansamos no calor perto de um curioso edifício na deslumbrante praça de [Glossary('Augustaion', 'AUGUSTAION_GLOSS')]. A estrutura abriga um marco dourado que os locais insistem que marca o centro do mundo."
 travel_city_constantinople_augustaion_title:0 "[city_province.GetBaronyNameExplicitlyNoTooltip]: Centro do Mundo"
 travel_city_constantinople_goldsmiths_moneychangers:0 "Eventualmente, fazemos uma pausa no distrito dos ourives. Este é o coração financeiro da cidade, onde o dinheiro é trocado, emprestado e depositado. [ROOT.Char.GetCurrentLocation.Custom('GetByzantineCoinWithGloss')] dourados com imperadores há muito esquecidos trocam de mãos, junto com moedas de cobre e eletro."
 travel_city_constantinople_goldsmiths_moneychangers_title:0 "[city_province.GetBaronyNameExplicitlyNoTooltip]: Ourives e Cambistas"
 travel_city_constantinople_intro:0 "Era impossível não ver [city_province.GetBaronyNameExplicitlyNoTooltip] no horizonte, com suas enormes muralhas se erguendo sobre a paisagem e subindo pela [Glossary('Mese', 'MESE_GLOSS')] as massas de pessoas são igualmente humilhantes.\n\n"
 travel_city_constantinople_intro_chalcedon:0 "Acostumados com visitantes exóticos, os Constantinopolitanos mal notam nossa presença no [Glossary('Prosphorion', 'PROSPHORION_GLOSS')] Porto. #EMP Encontramos#! as muralhas do mar de [city_province.GetBaronyNameExplicitlyNoTooltip] impressionantes mesmo do cais de [last_visited_location.GetBaronyNameExplicitlyNoTooltip].\n\n"
 travel_city_constantinople_intro_sea:0 "Ao desembarcarmos no porto de [Glossary('Prosphorion', 'PROSPHORION_GLOSS')], ficamos maravilhados com o tamanho de [city_province.GetBaronyNameExplicitlyNoTooltip], tendo avistado torres, cúpulas e muralhas do mar de uma grande distância.\n\n"
 travel_city_contemplated_life_and_death:0 "Eu contemplo a vida e a morte"
 travel_city_contemplated_life_and_death_companion:0 "[sightseeing_companion.GetName] e eu discutimos sobre a vida e a morte"
 travel_city_contemplated_religion_tooltip:0 "Passo um tempo contemplando a natureza de Cristo"
 travel_city_duel_history_fail:0 "[sightseeing_companion.GetName] falha em me ensinar a história de [city_province.GetNameNoTooltip]"
 travel_city_duel_learning_fail:0 "Eu falho em aprender com a história"
 travel_city_duel_teaching_fail:0 "Eu faço uma impressão razoável"
 travel_city_duel_teaching_fail_no_companion:0 "Eu falho em aprender qualquer coisa de valor em [city_province.GetNameNoTooltip]"
 travel_city_duel_teaching_great_fail:0 "Eu me humilho ao interagir com os locais em [city_province.GetNameNoTooltip]"
 travel_city_duel_teaching_great_success:0 "Eu ganho grandes insights de minha estadia em [city_province.GetNameNoTooltip]"
 travel_city_duel_teaching_success:0 "Eu aprendo coisas novas em [city_province.GetNameNoTooltip]"
 travel_city_gained_money:0 "Encontrei financiadores no bairro do Agiota de Constantinopla"
 travel_city_major_windfall:0 "Ganhei pouco, mas aprendi muito no bairro do Agiota em [city_province.GetNameNoTooltip]"
 travel_city_new_dessert:0 "O [ROOT.Char.Custom('FavoriteTreat')] de [city_province.GetNameNoTooltip] me impressionou"
 travel_city_new_techniques:0 "Eu vou trazer para casa novas técnicas e moda de [city_province.GetNameNoTooltip]"
 travel_city_option_earn_money:0 "Esta é uma oportunidade de #EMP ganhar#! dinheiro!"
 travel_city_option_learn_local_history:0 "Eu preciso saber mais sobre a cidade que já foi."
 travel_city_option_learning:0 "Uma ótima oportunidade para uma conversa instrutiva."
 travel_city_option_opt_out:0 "Não vou perder tempo neste lugar."
 travel_city_option_opt_out_tooltip:0 "Gaste apenas o tempo necessário em [city_province.GetNameNoTooltip] para preparar a jornada contínua"
 travel_city_option_party_hard:0 "Eu aproveitarei tudo o que este lugar tem a oferecer!"
 travel_city_option_reflection_on_existance:0 "Vale a pena pensar como a vida é frágil."
 travel_city_option_reflection_on_existance_tooltip:0 "Passo um tempo contemplando a natureza frágil da vida"
 travel_city_option_souvenir:0 "Encontrarei algo para trazer para casa daqui."
 travel_city_option_study_aqueducts:0 "Devemos mapear e documentar essas profundezas."
 travel_city_option_study_fortifications:0 "Vamos estudar essas construções notáveis."
 travel_city_option_study_locals:0 "Vamos aprender o máximo que pudermos aqui."
 travel_city_religious_mystic:0 "Eu me conecto com o lado místico da minha fé"
 travel_city_resupplied:0 "Consegui ganhar dinheiro e reabastecer em [city_province.GetNameNoTooltip]"
 travel_city_rome_alone_reflection:0 "\nNão consigo deixar de refletir sobre a imensa idade desta cidade."
 travel_city_rome_caesars_needle:0 "Enquanto paramos diante de um grande obelisco, um local conta que no topo repousam as cinzas de Júlio César em uma pequena caixa redonda.\n\n#EMP \"Na morte, assim como na vida, César está acima de todos os romanos.\"#!"
 travel_city_rome_caesars_needle_title:0 "[city_province.GetNameNoTooltip]: Agulha de César"
 travel_city_rome_companion_reflection:0 "\nM[Select_CString( sightseeing_companion.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', sightseeing_companion)|U] [sightseeing_companion.GetName] sugere que devemos aproveitar esta oportunidade para aprender sobre a cidade."
 travel_city_rome_fortified_monuments:0 "Ao atravessar a cidade, percebo como as ruínas foram cuidadosamente fortificadas por casas em conflito. Nesse estilo, o Mausoléu de Adriano e até mesmo o Coliseu agora são fortalezas."
 travel_city_rome_fortified_monuments_title:0 "[city_province.GetNameNoTooltip]: Monumentos Fortificados"
 travel_city_rome_intro:0 "À distância, a cidade de [city_province.GetNameNoTooltip] é uma floresta de torres e um labirinto de edifícios de pedra. Conforme nos aproximamos, a paisagem muda: ruínas de monumentos, muralhas e igrejas antigas coexistem com fazendas e animais pastando.\n\n"
 travel_city_rome_pilgrims_and_shrines:0 "Parece que os peregrinos estão por toda parte. Negociando, conversando e formando filas para os santuários e túmulos dos santos da cidade. Mansões de aristocratas esquecidos agora servem como albergues para os fiéis."
 travel_city_rome_pilgrims_and_shrines_title:0 "[city_province.GetNameNoTooltip]: Santuários e Peregrinos"
 travel_city_well_rested:0 "Tive uma estadia tranquila em [city_province.GetNameNoTooltip]"
 travel_city_well_supplied:0 "Bem Suprido"
 travel_city_well_supplied_desc:0 "Este personagem recentemente se abasteceu de todos os itens essenciais necessários para a viagem."
