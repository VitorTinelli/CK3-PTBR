l_spanish:
 holding_blueprint:0 "Desenho do Arquiteto"
 holding_blueprint_desc:0 "Um pergaminho contendo um desenho com conhecimento sobre como construir eficientemente certos edifícios."
 insane_bodyguard_salary_mod:0 "Guarda-Costas Insano"
 lucky_rabbits_paw:0 "Pata de Coelho Sortudo"
 lucky_rabbits_paw_desc:0 "Uma pata de um coelho imaculado único, abatido em uma caçada amigável com [entourage_character.GetTitledFirstName] nos terrenos de caça de [ROOT.Char.GetCurrentLocation.GetName]."
 manhunt_skull_cup:0 "Taça de Caveira de Caçada ao Homem"
 manhunt_skull_cup_desc:0 "Este cálice de crânio é um troféu da bem-sucedida caçada a [new_skull_cup.MakeScope.Var('skull_origin').Char.GetUIName] em [ROOT.Char.GetCurrentLocation.GetName] [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]."
 manhunt_skull_cup_desc_fallback:0 "Esta taça de caveira é um troféu da bem-sucedida caçada ao homem de uma presa humana."
 trainee_salary_mod:0 "Salário para Inexperientes"
 travel.competent_guide:0 "$travel_competent_guide_tt$"
 travel_competent_guide_tt:0 "Você é um guia competente"
 travel_events.2000.a:0 "Isso é um bom presságio."
 travel_events.2000.a_sadist:0 "Isso é bobagem."
 travel_events.2000.b.tt:0 "Você segue o pato por um tempo"
 travel_events.2000.b:0 "Siga aquele pato!"
 travel_events.2000.b_sadist:0 "Acho que eu poderia segui-lo..."
 travel_events.2000.c.tt:0 "Você joga uma pedra no som do grasnado."
 travel_events.2000.c:0 "Ick, ave irritante! Fora!"
 travel_events.2000.desc:0 "O dia na estrada tem sido bastante calmo e não muito descritivo até agora. Estamos em algum lugar fora de [ROOT.Char.GetCurrentLocation.GetName] e eu fecho os olhos enquanto minha montaria me leva adiante, um passo firme de cada vez.\n\nEnquanto o vento toca uma magnífica melodia através das copas das árvores, outro som é carregado pela brisa, e não é de nosso grupo. Isso é... grasnando?\n\n"
 travel_events.2000.desc_bad_memory:0 "Eu hesito por um momento, lembrando da última vez que segui um pato na natureza. Não terminou bem."
 travel_events.2000.desc_default:0 "Eu isolo o som vindo de um arbusto ao meu lado direito."
 travel_events.2000.desc_delicious_memory:0 "Da última vez que segui um pato na natureza, tive uma refeição #EMP deliciosa#!. Talvez este seja meu dia de sorte?"
 travel_events.2000.desc_good_memory:0 "Recordo com carinho a última vez que encontrei um pato na natureza. Ele me levou a um ninho de #EMP tantos#! patinhos fofos."
 travel_events.2000.desc_meh_memory:0 "Eu observo meus arredores em busca do pássaro. Da última vez que segui um pato na natureza, as coisas ficaram... constrangedoras."
 travel_events.2000.t:0 "O que é um Pato?"
 travel_events.2001.a:0 "Isso é... #EMP demais!#!"
 travel_events.2001.a_tt:0 "#EMP Delicioso#!"
 travel_events.2001.a_tt_death:0 "A fofura é demais para o seu pobre coração"
 travel_events.2001.b:0 "Estes dariam um assado perfeito..."
 travel_events.2001.b_failure.tt:0 "Engasgado"
 travel_events.2001.b_success.tt:0 "Uma Boa Refeição"
 travel_events.2001.c:0 "Isso é #EMP ruim!#!"
 travel_events.2001.c_critical_failure:0 "A fera te machuca gravemente"
 travel_events.2001.c_failure.tt:0 "Ferido"
 travel_events.2001.c_hit_and_ran:0 "Você é atingido, mas consegue escapar"
 travel_events.2001.c_ran:0 "Você consegue escapar com sucesso"
 travel_events.2001.c_success.tt:0 "Sucesso"
 travel_events.2001.d:0 "En garde!"
 travel_events.2001.d_beast_hit:0 "A fera revida mas foge"
 travel_events.2001.d_scare_beast:0 "Você assusta a fera e ela foge"
 travel_events.2001.desc:0 "\n\nDe repente, o pato para e inclina a cabeça na minha direção, claramente confuso sobre por que atraiu um seguidor humano.\n\nSorrio para o pato, tentando aliviar a tensão, mas o pato de repente se contorce, bate as asas e voa para longe."
 travel_events.2001.desc_negative:0 "\n\nÀ medida que me afasto cada vez mais do meu grupo, um arrepio percorre minha espinha. Algo está me observando?\n\nDe repente, um[ROOT.Char.Custom('RegionalFerociousAnimal')] aparece na borda do matagal! Ele resmunga e me olha com olhos raivosos."
 travel_events.2001.desc_positive:0 "\n\nConforme continuo avançando, o suave grasnado é lentamente acompanhado por um coro — a princípio fraco, mas cada vez mais forte — de pequenos piados. Quando viro a próxima moita, vejo não apenas um pato, mas uma #EMP infinidade#! de patos e ninhos de patinhos!"
 travel_events.2001.desc_positive_default:0 "\n\nSinto meus joelhos enfraquecerem ao contemplar toda aquela fofura."
 travel_events.2001.desc_positive_sadist:0 "\n\nSinto meu estômago roncar ao observar os patos tenros e os patinhos."
 travel_events.2001.e:0 "Que perseguição selvagem de um... #EMP pato#!?"
 travel_events.2001.intro:0 "Eu desmonto e localizo o pato na vegetação próxima. Ele começa a se afastar pela natureza, e eu o sigo a pé."
 travel_events.2001.t:0 "Quack!"
 travel_events.2001.t_negative:0 "Isso Não É um Pato!"
 travel_events.2001.t_positive:0 "Isso É..."
 travel_events.2002.a:0 "#EMP Claro#!. Encontraremos outro caminho."
 travel_events.2002.b:0 "Isso é bobagem. Vou assumir como guia!"
 travel_events.2002.c:0 "Eu tenho a cura perfeita para sua superstição."
 travel_events.2002.desc:0 "A procissão parou a uma pedra de distância de [ROOT.Char.GetCurrentLocation.GetName]. Olho para ver [guide_leader.GetFirstName], m[Select_CString( guide_leader.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guide_leader'))], desmontado e olhando atentamente para algo no chão. Os outros membros do grupo se reuniram ao redor [guide_leader.GetHerHim].\n\n[guide_leader.GetFirstNameNoTooltip] olha para cima quando me aproximo. '[ROOT.Char.Custom('FormOfAddressForLiege')|U], há um caminho de formigas aqui. Eu posso ser um pouco supersticioso, mas você nunca deve cruzar um caminho de formigas.'\n\n[guide_leader.GetSheHe|U] pausa. '[Select_CString( great_grand_parent.IsFemale, 'Minha bisavó', 'Meu bisavô' )] fez isso, e [great_grand_parent.GetSheHe] nunca voltou para casa.'"
 travel_events.2002.t:0 "O Caminho Pisoteado"
 travel_events.2003.a:0 "Não me importaria de um treinamento!"
 travel_events.2003.a_sparring_tt:0 "Você treina com sucesso com as tropas"
 travel_events.2003.a_wounded_tt:0 "Você se machuca acidentalmente"
 travel_events.2003.b:0 "O que é essa engenhoca?"
 travel_events.2003.b_cut_tt:0 "Você se corta acidentalmente no equipamento"
 travel_events.2003.b_failure_tt:0 "Descoberto"
 travel_events.2003.b_learn_tt:0 "Você aprende algo ao estudar o equipamento"
 travel_events.2003.b_spy_tt:0 "[county_liege.GetShortUIName] acha que você pode estar espionando"
 travel_events.2003.b_success_tt:0 "Aprendizado Marcial"
 travel_events.2003.c:0 "Você deveria se juntar a mim."
 travel_events.2003.c_found_out_tt:0 "[county_liege.GetShortUIName] descobre sobre sua prática de recrutamento"
 travel_events.2003.c_secret_tt:0 "[county_liege.GetShortUIName] não descobre sobre sua prática de recrutamento"
 travel_events.2003.c_success_tt:0 "Recrutamento Secreto"
 travel_events.2003.d:0 "Na verdade, tenho algum lugar para ir..."
 travel_events.2003.desc_barracks:0 "Eu rapidamente desmonto, ansioso para inspecionar o quartel local, repleto de atividade."
 travel_events.2003.desc_camp:0 "Enquanto [local_captain.GetSheHe] se afasta, rapidamente desmonto e sigo [local_captain.GetHerHim] pelos equipamentos de cerco mais recentes."
 travel_events.2003.desc_regiment:0 "Observo brevemente os terrenos do regimento e depois desmonto, enquanto grupos de soldados estão envolvidos em planos de batalha."
 travel_events.2003.intro:0 "[local_captain.GetFirstName], [Select_CString( local_captain.IsFemale, 'a capitã', 'o capitão' )] local, e alguns de seus oficiais me cumprimentam quando meu grupo entra nos acampamentos militares de [ROOT.Char.GetCurrentLocation.GetName]."
 travel_events.2003.outro:0 "\n\nEu aceno, apreciando o caos organizado que estou observando.\n\"Agora, o que [ROOT.Char.Custom('FormOfAddressForLiege')] gostaria de fazer em seguida?\" [local_captain.GetFirstNameNoTooltip] me olha com expectativa."
 travel_events.2003.t:0 "Um Estudo em Marcial"
 travel_events.2004.a:0 "Até um porco cego poderia administrar este lugar melhor, [local_farmer.GetFirstNameNoTooltip]."
 travel_events.2004.a_critique_reject_tt:0 "[local_farmer.GetShortUIName] rejeita sua crítica"
 travel_events.2004.a_critique_success_tt:0 "[local_farmer.GetShortUIName] aceita sua crítica"
 travel_events.2004.a_failure_tt:0 "Crítica Rejeitada"
 travel_events.2004.a_success_tt:0 "Crítica Aceita"
 travel_events.2004.b:0 "Preciso de seus cavalos. Agora."
 travel_events.2004.c:0 "Tenho coisas melhores para fazer."
 travel_events.2004.desc:0 "O cheiro de decadência atinge minhas narinas como um soco pungente. O gado não parece bem enquanto eu olho ao redor dos pastos imediatos em [ROOT.Char.GetCurrentLocation.GetName].\n\nOs camponeses que trabalham aqui arrastam os pés e vagueiam sem rumo, tentando parecer ocupados. Sua clara falta de motivação e moral está afetando toda a população, pelo que parece, já que o desenvolvimento da área claramente estagnou.\n\nEstremeço incrédulo enquanto [Select_CString( local_farmer.IsFemale, 'a líder', 'o líder' )] local, [local_farmer.GetFirstName], se aproxima de mim. Que buraco mal administrado!"
 travel_events.2004.t:0 "Retrato do Pasto"
 travel_events.2005.a:0 "Eu poderia aplicar algumas dessas ideias em casa!"
 travel_events.2005.a_failure_tt:0 "Conselho Mal-Interpretado"
 travel_events.2005.a_implemented_tt:0 "Seu conselho é implementado com sucesso"
 travel_events.2005.a_misinterpreted_tt:0 "Seu conselho é completamente mal-interpretado"
 travel_events.2005.a_success_tt:0 "Conselho Bem-Sucedido"
 travel_events.2005.b:0 "Vamos ver se não podemos melhorar as coisas por aqui."
 travel_events.2005.c:0 "Tenho certeza de que [Select_CString( county_liege.IsFemale, 'a', 'o' )] [county_liege.GetTitledFirstNameNoTooltip] pode cuidar de seus próprios pastos."
 travel_events.2005.desc:0 "Um dia bonito como este, o tempo está bom, os pastos de [ROOT.Char.GetCurrentLocation.GetName] parecem ótimos e o gado local está pulando e comemorando em sua própria maneira gutural. Bezerros estão caminhando ao lado de suas mães, seus pelos brilhantes e limpos.\n\nNo geral, o lugar é muito bem administrado, embora eu note algumas peculiaridades que eu administraria um pouco diferente.\n\nO [local_farmer.Custom('MatriarchPatriarch')] local se aproxima de mim. 'Uma bela manhã para você, [ROOT.Char.Custom('FormOfAddressForLiege')]! Não são essas belezas um espetáculo para os olhos?'"
 travel_events.2005.t:0 "Pastos Alheios"
 travel_events.2006.a:0 "Você e sua besta precisam aprender boas maneiras!"
 travel_events.2006.a_tt:0 "Você chicoteia a besta e seu dono."
 travel_events.2006.b:0 "A cabeça desta besta será um aviso #EMP adequado#!."
 travel_events.2006.b_tt:0 "Você decapita o camelo"
 travel_events.2006.c:0 "Uma besta é apenas uma criatura sem mente."
 travel_events.2006.desc:0 "O sol está alto sobre a fazenda de camelos em [ROOT.Char.GetCurrentLocation.GetName], e procuro sombra sob as peles protetoras estendidas sobre certas áreas da fazenda. Um grunhido repentino me assusta, e me viro.\n\nAo meu lado, uma das magníficas criaturas teve a mesma ideia e se aconchega à sombra. Me inclino para acariciar sua cabeça alongada, quando o animal #EMP em um movimento rápido me atinge na testa e cospe no meu rosto#!.\n\nQuando recupero o equilíbrio, vejo seu dono a apenas vinte passos de distância, horrorizado."
 travel_events.2006.t:0 "Camelos de Novo?"
 travel_events.2006_camel_head:0 "Cabeça de Camelo"
 travel_events.2006_camel_head_desc:0 "A cabeça de um camelo desobediente."
 travel_events.2007.a:0 "Isso não é páreo para #EMP [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]#! [ROOT.Char.GetTitleAsNameNoTooltip|U]."
 travel_events.2007.a_alright_training_tt:0 "O treinamento está bom"
 travel_events.2007.a_efficient_training_tt:0 "O treinamento ocorre esplendidamente"
 travel_events.2007.a_failed_training_tt:0 "Você tropeça em seus próprios pés"
 travel_events.2007.a_failure_tt:0 "Treinamento Terrível"
 travel_events.2007.a_soft_success_tt:0 "Treinamento Aceitável"
 travel_events.2007.a_success_tt:0 "Treinamento Eficiente"
 travel_events.2007.b:0 "Não vou perder meu tempo."
 travel_events.2007.desc_default:0 "As majestosas criaturas nos currais de elefantes em [ROOT.Char.GetCurrentLocation.GetName] são verdadeiramente impressionantes. Eu as observo carregando troncos e participando de todo tipo de exercício físico."
 travel_events.2007.desc_memory:0 "Eu observo com suspeita as enormes criaturas nos currais de elefantes em [ROOT.Char.GetCurrentLocation.GetName], ainda um pouco traumatizado quando meu "
 travel_events.2007.desc_memory_here:0 "neste exato local."
 travel_events.2007.desc_memory_nemesis:0 "nêmesis "
 travel_events.2007.desc_memory_not_here:0 "na [elephant_memory.Var('elephant_location').GetProvince.GetName] [elephant_memory.Var('elephant_location').GetTerrain.GetName]"
 travel_events.2007.desc_memory_rival:0 "rival "
 travel_events.2007.desc_memory_segway:0 "[crushing_person.GetTitledFirstName] quase me fez ser esmagado "
 travel_events.2007.desc_outro:0 "\n\nEnquanto observo os elefantes realizarem suas tarefas, ouço alguns mahouts discutindo as diferentes maneiras como treinam as criaturas.\n\nParece ser um treino intenso e, admito, isso desperta meu interesse."
 travel_events.2007.t:0 "Elefantástico"
 travel_events.2008.a:0 "[ROOT.Char.Custom('RandomElephantName')], #EMP sente-se.#!"
 travel_events.2008.a_crushed_tt:0 "[elephant_rival.GetShortUIName] é esmagado pelo elefante"
 travel_events.2008.a_failure_tt:0 "[elephant_rival.GetTitledFirstNameNoTooltip] Escapou"
 travel_events.2008.a_scotfree_tt:0 "[elephant_rival.GetShortUIName] escapa do elefante"
 travel_events.2008.a_soft_success_tt:0 "Semi-Esmagado"
 travel_events.2008.a_success_tt:0 "Esmagamento do Elefante"
 travel_events.2008.a_wounded_tt:0 "[elephant_rival.GetShortUIName] sofre ferimentos"
 travel_events.2008.b:0 "[elephant_rival.GetTitledFirstNameNoTooltip], cuidado!"
 travel_events.2008.desc:0 "Gotas de suor continuam a escorrer pelo meu rosto conforme o calor da selva me alcança. Parando para enxugar minha testa, avisto m[Select_CString( elephant_rival.IsFemale, 'inha', 'eu' )] [elephant_rival.Custom2('InsultNoun', ROOT.Char)], [elephant_rival.GetTitledFirstName], nas proximidades dos currais de elefantes locais de [ROOT.Char.GetCurrentLocation.GetName].\n\n[elephant_rival.GetSheHe|U] faz um gesto rude na minha direção e solta uma risada sonora, sem dúvida zombando de mim. Cerro os dentes.\n\nÉ quando percebo que [elephant_rival.GetTitledFirstNameNoTooltip] está parado #EMP exatamente atrás do elefante#!, e a besta está se movendo. Consigo chamar a atenção de seu mahout."
 travel_events.2008.t:0 "Dê um Assento"
 travel_events.2010.a:0 "Essas árvores são um perigo para a saúde!"
 travel_events.2010.a_flavor:0 "Queime este lugar até o chão!"
 travel_events.2010.a_tt:0 "Os ferimentos de [fallen_child.GetShortUIName] podem piorar"
 travel_events.2010.a_tt_2:0 "[ROOT.Char.GetTitledFirstName] incendiou seus pomares em [location_county.GetNameNoTier]!"
 travel_events.2010.b:0 "O que você estava pensando, [fallen_child.GetFirstNameNoTooltip]!"
 travel_events.2010.b_tt:0 "Traço Adquirido"
 travel_events.2010.c:0 "Calma, calma."
 travel_events.2010.c_physician:0 "Vamos examinar você, criança."
 travel_events.2010.c_physician_tt:0 "[court_physician.GetShortUIName] trata de [fallen_child.GetShortUIName]"
 travel_events.2010.d:0 "[fallen_child.Custom('GirlBoyPlural')|U] vão ficar bem."
 travel_events.2010.desc:0 "\n\nDe repente, um grito agudo perfura o ar. Acelero o passo apenas para encontrar "
 travel_events.2010.entourage:0 "m[Select_CString( fallen_child.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fallen_child'))] [fallen_child.GetFirstName] "
 travel_events.2010.fallback:0 "As árvores se estendem até o céu enquanto percorro as fileiras de troncos cuidadosamente posicionados no pomar local em [ROOT.Char.GetCurrentLocation.GetName]. É um bom dia para um passeio."
 travel_events.2010.outro:0 "debaixo de uma árvore, em frangalhos e soluçando violentamente.\n\nParece que [fallen_child.GetSheHe] tentou subir na árvore, antes de escorregar e cair no chão. Um dos ossos parece estar em um ângulo estranho."
 travel_events.2010.peasant:0 "uma criança camponesa "
 travel_events.2010.t:0 "Um Galho Partido"
 travel_events.2010.temperate_summer:0 "A brisa quente acaricia meu pescoço enquanto percorro os pomares de [ROOT.Char.GetCurrentLocation.GetName]. As árvores se estendem suavemente em direção ao céu, coloridas por uma mistura de novos brotos e frutos em formação."
 travel_events.2010.temperate_winter:0 "Há um frio no ar, e minha respiração se transforma em pequenas baforadas enquanto percorro os pomares de [ROOT.Char.GetCurrentLocation.GetName]. As árvores parecem estar um pouco encolhidas pelo frio, ansiando por dias mais quentes."
 travel_events.2010.tropical_summer:0 "O calor é avassalador enquanto passo pelos pomares de [ROOT.Char.GetCurrentLocation.GetName]. Ao meu redor, as árvores estão em plena floração, celebrando a estação."
 travel_events.2010.tropical_winter:0 "Finalmente é uma época amena para percorrer os pomares de [ROOT.Char.GetCurrentLocation.GetName], e aproveito a oportunidade para fazê-lo. Adormecidas, mas ainda verdes, as árvores aguardam as estações mais quentes."
 travel_events.2011.tt_healed:0 "Feridas Curadas"
 travel_events.2011.tt_healed_desc:0 "Feridas de [fallen_child.GetShortUINamePossessive] foram curadas"
 travel_events.2011.tt_worsened:0 "Feridas Pioradas"
 travel_events.2011.tt_worsened_desc:0 "Feridas de [fallen_child.GetShortUINamePossessive] pioraram"
 travel_events.2012.a:0 "[guard_type_character.GetFirstNameNoTooltip], rápido! Pegue aqueles baldes!"
 travel_events.2012.a_death:0 "Abafado, Mas Morto"
 travel_events.2012.a_death_desc:0 "[guard_type_character.GetShortUIName] abafa o fogo, mas morre no processo"
 travel_events.2012.a_scarred:0 "Abafado, Mas Marcado"
 travel_events.2012.a_scarred_desc:0 "[guard_type_character.GetShortUIName] abafa o fogo, mas fica marcado"
 travel_events.2012.a_unscathed:0 "Chamas Abafadas"
 travel_events.2012.a_unscathed_desc:0 "[guard_type_character.GetShortUIName] abafa o fogo"
 travel_events.2012.b:0 "Vamos evacuar as pessoas das casas de trabalho!"
 travel_events.2012.b_scarred:0 "Marcados"
 travel_events.2012.b_scarred_desc:0 "Você resgata os trabalhadores, mas fica marcado"
 travel_events.2012.b_tt:0 "A opinião de sua comitiva sobre você aumenta significativamente"
 travel_events.2012.b_unscathed:0 "Ilesas"
 travel_events.2012.b_unscathed_desc:0 "Você resgata os trabalhadores ilesos"
 travel_events.2012.c:0 "#EMP Bem#!, então, não é uma oportunidade..."
 travel_events.2012.c_revealed:0 "Pilhagem Descoberta"
 travel_events.2012.c_revealed_desc:0 "Sua pilhagem foi descoberta por [county_liege.GetShortUIName]"
 travel_events.2012.c_secret:0 "Pilhagem Secreta"
 travel_events.2012.c_secret_desc:0 "Sua pilhagem permaneceu em segredo"
 travel_events.2012.c_tt:0 "Os membros de sua comitiva perdem muito da opinião sobre você"
 travel_events.2012.d:0 "Nunca estivemos aqui."
 travel_events.2012.d_flavor:0 "A comitiva se afasta silenciosamente."
 travel_events.2012.d_tt:0 "Os membros de sua comitiva perdem opinião sobre você"
 travel_events.2012.desc:0 "Cruzamos terras repletas de agricultura. Nosso próximo destino é a plantação local em [ROOT.Char.GetCurrentLocation.GetName], mas quando vejo os portões a cerca de cem passos de distância, algo está errado...\n\nInalo o cheiro acre de... fumaça? Fumaça? Fogo! De repente, percebo a coluna de fumaça tomando forma sobre a plantação.\n\nA coluna é espessa e densa - grande demais para ser resultado de um dos trabalhadores queimando alguns detritos."
 travel_events.2012.t:0 "Fogo!"
 travel_events.2013.a:0 "Estou sempre pronto para um desafio!"
 travel_events.2013.a_failed:0 "O treinamento falha"
 travel_events.2013.a_failure.tt:0 "Treinamento Fracassado"
 travel_events.2013.a_reckless:0 "Você se torna imprudente"
 travel_events.2013.a_rough_terrain:0 "Você se torna um especialista em terrenos acidentados"
 travel_events.2013.a_success.tt:0 "Traço Adquirido"
 travel_events.2013.b:0 "[entourage_heir.GetFirstNameNoTooltip], junte-se ao [local_captain.GetWomanMan]."
 travel_events.2013.b_reckless:0 "[entourage_heir.GetShortUIName] $travel_events.2013.reckless$"
 travel_events.2013.b_rough_terrain:0 "[entourage_heir.GetShortUIName] $travel_events.2013.rough_terrain$"
 travel_events.2013.c:0 "M[Select_CString( guard_type_character.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guard_type_character'))] certamente se beneficiaria desse regime de treinamento."
 travel_events.2013.c_reckless:0 "[guard_type_character.GetShortUIName] $travel_events.2013.reckless$"
 travel_events.2013.c_rough_terrain:0 "[guard_type_character.GetShortUIName] $travel_events.2013.rough_terrain$"
 travel_events.2013.d:0 "Na verdade, ficarei para apreciar a vista."
 travel_events.2013.default:0 "\n\nOs soldados no vale abaixo parecem estar praticando algum tipo raro de técnica de treinamento que eu nunca vi antes. Me aproximo, incapaz de conter minha curiosidade."
 travel_events.2013.e:0 "Infelizmente, estamos com pressa."
 travel_events.2013.intro:0 "A alta altitude e o ar fresco de [ROOT.Char.GetCurrentLocation.GetName] têm uma qualidade muito revigorante enquanto percorremos o forte local."
 travel_events.2013.martial:0 "\n\nObservo os soldados treinando abaixo com um olhar atento. Suas táticas não são completamente estranhas para mim, já que sou treinado nas artes marciais."
 travel_events.2013.outro:0 "\n\nEnquanto faço isso, sou abordado pelo capitão local, [local_captain.GetFirstNameNoTooltip]: 'Gostaria de participar, [ROOT.Char.Custom('FormOfAddressForLiege')]?'"
 travel_events.2013.reckless:0 "se torna imprudente"
 travel_events.2013.rough_terrain:0 "se torna um especialista em terrenos acidentados"
 travel_events.2013.t:0 "Conhecimento Fortificado"
 travel_events.2014.a:0 "Eu seguro o cabo e #EMP Huraagh!#!"
 travel_events.2014.a_flavor:0 "Tome #EMP essa#!, estresse!"
 travel_events.2014.a_great_stress_desc:0 "Você reduz significativamente seu estresse"
 travel_events.2014.a_injured_desc:0 "Você se machuca acidentalmente"
 travel_events.2014.a_injured_tt:0 "Lesão Sofrida"
 travel_events.2014.a_stress_desc:0 "Você reduz seu estresse"
 travel_events.2014.a_stress_tt:0 "Estresse Diminuído"
 travel_events.2014.b:0 "... não, trabalho manual está abaixo de mim."
 travel_events.2014.b_flavor:0 "Você abaixa seu machado."
 travel_events.2014.desc:0 "O enorme cepo de corte no centro do acampamento de extração de madeira de [ROOT.Char.GetCurrentLocation.GetName] já foi muito usado. Parece ter estado aqui desde sempre, antes mesmo de o homem caminhar sobre esta terra.\n\nAo meu redor, trabalhadores labutam reluzindo de suor e, embora de nascimento humilde, parecem livres do peso do mundo.\n\nEu encaro o machado de rachar cravado ereto no gigantesco toco. Meus ombros tensos, carregados de estresse, imploram por uma oportunidade de alívio."
 travel_events.2014.t:0 "Taque, Taque"
 travel_events.2015.a:0 "Eu estava apenas absorvendo tudo!"
 travel_events.2015.a_convinced_desc:0 "Você consegue convencer [quarry_guide.GetShortUIName]"
 travel_events.2015.a_convinced_tt:0 "Convencido"
 travel_events.2015.a_insulted_desc:0 "[quarry_guide.GetShortUIName] fica insultado"
 travel_events.2015.a_insulted_tt:0 "Insultado"
 travel_events.2015.b:0 "Olhe para esta bolsa de moedas..."
 travel_events.2015.b_flavor:0 "Você suborna [quarry_guide.GetShortUIName]"
 travel_events.2015.desc:0 "[quarry_guide.GetTitledFirstName|U] está agitada de alegria infantil enquanto [quarry_guide.GetSheHe] guia minha visita à turfa em [ROOT.Char.GetCurrentLocation.GetName]. Por algum motivo incompreensível, [quarry_guide.GetSheHe] parece achar que este lugar é a jóia na coroa verde [quarry_guide.GetHerHim].\n\nOlho para o campo devastado, todo marrom e verde-acinzentado.\nMinhas pálpebras estão pesadas. Ultimamente, o sono tem me escapado. Elas deslizam lentamente e fecham...\n\nDe repente, eu desperto, a mão de [quarry_guide.GetFirstNamePossessiveNoTooltip] em minha manga.\n\"... eu estava te #EMP entediando#!?"
 travel_events.2015.t:0 "Turfa, Conte-me Mais..."
 travel_events.2016.a:0 "Aqui, touro [bull_loc.Custom2('InsultAdjective', ROOT.Char)]!"
 travel_events.2016.a_captured.desc:0 "Você captura o touro com sucesso"
 travel_events.2016.a_captured.tt:0 "Capturado"
 travel_events.2016.a_wounded.desc:0 "O touro é capturado, mas você fica ferido"
 travel_events.2016.a_wounded.tt:0 "$travel_events.2001.c_failure.tt$"
 travel_events.2016.b:0 "[guard_type_character.GetFirstNameNoTooltip], #EMP faça algo!#!"
 travel_events.2016.b_putdown.desc:0 "[guard_type_character.GetShortUIName] abate o touro"
 travel_events.2016.b_putdown.tt:0 "Abatido"
 travel_events.2016.b_wounded.desc:0 "[guard_type_character.GetShortUIName] é atingido"
 travel_events.2016.c:0 "É melhor não arriscar."
 travel_events.2016.c_escaped.desc:0 "[entourage_member.GetShortUIName] escapa por pouco do ataque do touro"
 travel_events.2016.c_escaped.tt:0 "Escapou"
 travel_events.2016.c_wounded.desc:0 "[entourage_member.GetShortUIName] fica ferido"
 travel_events.2016.desc:0 "Mugidos suaves e o cheiro de estrume não são tudo o que os pastos das colinas de [ROOT.Char.GetCurrentLocation.GetName] oferecem ao viajante. Também há trabalhadores da fazenda gritando, brados estentóricos e um touro solto na estrada à nossa frente.\n\nO gigantesco animal corre de um lado para o outro em grande angústia, até fixar em uma vítima: [entourage_member.GetFirstName], sobre seus cavalo em pânico.\n\nHá um portão aberto para manter a fera atrás - um de nós só precisa de coragem suficiente para atraí-lo!"
 travel_events.2016.t:0 "Valentão, Para Você?"
 travel_events.2017.a:0 "Ah, #EMP intrigante!#!"
 travel_events.2017.a_tt:0 "Você entra na mansão"
 travel_events.2017.b:0 "Isso não está acontecendo."
 travel_events.2017.b_tt:0 "Você sai da mansão"
 travel_events.2017.desc:0 "Enquanto caminhamos pelos corredores da mansão em [ROOT.Char.GetCurrentLocation.GetName], o proprietário local, [estate_character.GetTitledFirstName], se vira para mim. \"Dizem que esta parte da propriedade é assombrada, [ROOT.Char.Custom('FormOfAddressForLiege')].\"\n\nOlho hesitante ao redor. O corredor está um pouco mais escuro do que eu esperava, velas tremulando em seus postes.\n\nQuando paramos no antigo salão de jantar, [estate_character.GetFirstNameNoTooltip] se vira para mim novamente, desta vez com um sorriso. \"Você gostaria de fazer um tour pela mansão #EMP assombrada#!?\""
 travel_events.2017.t:0 "$travel_events.haunted_manor.t$"
 travel_events.2018.a:0 "É melhor seguir a rota."
 travel_events.2018.a_tt:0 "Você fica com seu séquito"
 travel_events.2018.b:0 "Agora, o que é esse recanto aqui..."
 travel_events.2018.b_tt:0 "Você pode encontrar algo interessante"
 travel_events.2018.c:0 "Estou fora daqui!"
 travel_events.2018.desc:0 "Estamos caminhando por um corredor escuro e deserto. Os poucos móveis que encontramos estão todos cobertos com lençóis, aumentando a atmosfera fantasmagórica.\n\nAquilo foi... um... rato? Eu me apresso para alcançar meu séquito.\n\n[estate_character.GetTitledFirstName|U] se vira para nós, franzindo os olhos enquanto [estate_character.GetSheHe] diz as palavras: \"... e por aqui, meus senhores e senhoras.\""
 travel_events.2018.t:0 "$travel_events.haunted_manor.t$: um Caminho a Seguir"
 travel_events.2019.a:0 "Olhe! Atrás de você!"
 travel_events.2019.a_death.desc:0 "Você morre"
 travel_events.2019.a_paid_off.effect_tt:0 "O assassino escapa"
 travel_events.2019.a_retaliate.desc:0 "O armário esmaga o crânio do assassino"
 travel_events.2019.a_retaliate.effect_tt:0 "O assassino morre"
 travel_events.2019.a_retaliate.tt:0 "Retaliação"
 travel_events.2019.a_tt:0 "Tente empurrar o armário sobre o assassino"
 travel_events.2019.b:0 "Eu posso encher seus bolsos com moedas!"
 travel_events.2019.b_paid_off.desc:0 "O assassino é subornado e escapa"
 travel_events.2019.b_paid_off.tt:0 "Subornado"
 travel_events.2019.b_tt:0 "Tente subornar o assassino"
 travel_events.2019.c:0 "En garde, canalha!"
 travel_events.2019.c_retaliate.desc:0 "Você mata o assassino"
 travel_events.2019.c_tt:0 "Enfrente o assassino"
 travel_events.2019.desc:0 "Sigo pelo caminho à esquerda, entrando por um arco baixo. À minha frente, há uma escotilha, entreaberta.\n\nA escuridão compacta é interrompida por luzes cintilantes que vêm de baixo. Subo a escada com cuidado, apenas para encontrar... #EMP uma figura oculta com uma adaga?!#!\n\nDesesperadamente, examino meus arredores enquanto o assassino se aproxima rapidamente de mim."
 travel_events.2019.expose_effect_tt:0 "Agente Exposto"
 travel_events.2019.t:0 "$travel_events.haunted_manor.t$: Traição na Mansão"
 travel_events.2020.a:0 "Eu não me importaria com um pouco desse chá."
 travel_events.2020.b:0 "Você poderia ser útil na minha corte, sabe."
 travel_events.2020.c:0 "Um gostinho de você agora; chá depois."
 travel_events.2020.d:0 "Um... por onde é o passeio?"
 travel_events.2020.desc:0 "Desvio do grupo, passando por um corredor ainda mais escuro até encontrar uma porta. Vejo luz brilhando pelas bordas.\n\nEmpurro gentilmente a porta e sou recebido por um som baixo de sibilação. No meio da sala lotada de livros, garrafas e todo tipo de ferramentas de química, está um[Select_CString( mendicant_character.IsFemale, 'a', '' )] [mendicant_character.GetWomanMan].\n\nUm cheiro ruim está saindo do caldeirão que [mendicant_character.GetSheHe] está cuidando. Sem se virar, [mendicant_character.GetSheHe] diz: \"Gostaria de um pouco? Geralmente funciona maravilhas.\""
 travel_events.2020.desc_witch:0 "De repente, sinto uma vontade de explorar a passagem estreita à minha direita. Ao caminhar pelo corredor, sou saudado por um brilho quente vindo da porta aberta.\n\nO quarto está repleto de todo tipo de utensílios. Reconheço uma certa variedade de ervas, alambiques, crisóis, frascos, potes, caldeirões... É uma gloriosa representação da alquimia.\n\nO sorriso de [mendicant_character.GetFirstNamePossessive] me cumprimenta. \"Olá, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom('SisterBrother')]. Já faz muito tempo desde que alguém cruzou minha porta. Gostaria de um drinque?\" [mendicant_character.GetSheHe|U] aponta para o caldeirão que [mendicant_character.GetSheHe] está segurando."
 travel_events.2020.t:0 "$travel_events.haunted_manor.t$: Qual Bruxa?"
 travel_events.2021.a:0 "Isso é uma excelente adição à minha coleção."
 travel_events.2021.a_bad:0 "... eu realmente tenho que?"
 travel_events.2021.b:0 "É melhor eu não."
 travel_events.2021.b_tt:0 "Você ignora o [new_trinket.GetName]"
 travel_events.2021.desc_bad:0 "\n\nExaminando a sala, grato pela luz adicional vinda da janela. Quando estou prestes a sair, percebo algo em um monte de escombros no canto.\n\nÉ... #EMP uma coisa?#! Com um propósito? Hesito por um momento."
 travel_events.2021.desc_common:0 "\n\nQuando meus olhos se acostumam ao novo ambiente, noto um item interessante em uma mesa perto da janela.\n\nO [new_trinket.GetName] pode não parecer muito para este mundo, mas reconheço a habilidade que foi empregada nele. É um trabalho sólido."
 travel_events.2021.desc_famed:0 "\n\nOlho ao redor da sala e não consigo deixar de notar um [new_trinket.GetName] habilmente trabalhado. Ele está colocado em cima do que parece ser um pedestal, chamando minha atenção.\n\nEssa peça realmente não deveria estar exposta assim, um verdadeiro alvo para saqueadores e ladrões. Me aproximo com cuidado."
 travel_events.2021.desc_illustrious:0 "\n\nImediatamente, minha atenção se volta para a impecável [new_trinket.GetName], cuidadosamente colocada em um pedestal no meio da sala. Me aproximo cautelosamente.\n\nÉ realmente uma obra de arte, cada detalhe mais espetacular que o anterior. Admiro sua beleza por um momento."
 travel_events.2021.desc_intro:0 "Entro por uma porta estreita e sou recebido por uma forma de luminosidade obscura vinda das janelas cobertas. A sala parece ter sido um antigo escritório."
 travel_events.2021.desc_masterwork:0 "\n\nBem no meio da sala, em cima de um pedestal, está o [new_trinket.GetName]. Me aproximo cautelosamente.\n\nQuem poderia ter sido o proprietário disso? Está em condições notavelmente boas, considerando o local onde está guardado."
 travel_events.2021.t:0 "$travel_events.haunted_manor.t$: Algo Emprestado"
 travel_events.2022.a:0 "Acabei de sobreviver a uma tentativa de assassinato, orquestrada por #EMP você!#!"
 travel_events.2022.a_escape.desc:0 "[estate_character.GetShortUIName] te machuca e escapa"
 travel_events.2022.a_escape.tt:0 "Culpado Escapou"
 travel_events.2022.a_slain.desc:0 "Você mata [estate_character.GetShortUIName]"
 travel_events.2022.a_slain.tt:0 "Culpado Morto"
 travel_events.2022.b:0 "Guarda! Essa pessoa está envolvida em um plano para me matar!"
 travel_events.2022.b_escape.desc:0 "[estate_character.GetShortUIName] fere [travel_leader.GetShortUIName] e escapa"
 travel_events.2022.b_slain.desc:0 "[estate_character.GetShortUIName] é morto por [travel_leader.GetShortUIName]"
 travel_events.2022.c:0 "Você pode querer procurar por bruxas na casa."
 travel_events.2022.d:0 "Na verdade, eu encontrei esta bruxa, [mendicant_character.GetFirstNameNoTooltip]."
 travel_events.2022.desc_bauble:0 "Com minha nova posse no bolso, ando pelos corredores escuros e estreitos. Eventualmente, encontro o restante do grupo na sala de jantar no final da mansão.\n\nUma grande figura escura está pendurada em um dos arcos da sala, e não consigo deixar de me perguntar qual seria o propósito disso. Além disso, os outros parecem um pouco agitados... ?\n\n[estate_character.GetTitledFirstName|U] se assusta e se vira na minha direção. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! O que você estava aprontando? Esses corredores escuros não são seguros sozinhos!\""
 travel_events.2022.desc_joshed:0 "Eu tateio na escuridão, fazendo o meu melhor para ignorar a leve sensação de pânico que a escuridão provoca em mim. Apresso-me pela próxima porta, tentando encontrar o grupo...\n\n...e #EMP de repente#! uma grande forma escura vem voando sobre mim. Solto um grito de surpresa.\n\nQuando volto aos meus sentidos, encontro o grupo na sala em que acabei de entrar. [estate_character.GetTitledFirstName] tem dificuldades para respirar devido ao riso e me aponta. \"M... m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLadyLord] #EMP *resfolegada*#! você... você se divertiu?\""
 travel_events.2022.desc_mendicant:0 "Após deixar os aposentos do mendicante, sigo facilmente o barulho de volta para a sala principal.\n\nO grupo parece agitado, mas aliviado, e vejo uma figura escura pendurada no arco acima deles. [estate_character.GetTitledFirstName|U] rapidamente se vira e dá um pulinho ao me ver.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Você estava sozinha o tempo todo? Isso não é seguro, sabe!\" [estate_character.GetSheHe|U] estreita os olhos."
 travel_events.2022.desc_mendicant_recruit:0 "Eu e meu novo companheiro, [mendicant_character.GetTitledFirstName], saímos dos aposentos [mendicant_character.GetHerHim] e voltamos para o grupo na sala principal.\n\n[mendicant_character.GetFirstNameNoTooltip] resmunga quando [mendicant_character.GetSheHe] nota uma figura escura pendurada no arco pelo qual o grupo deve ter passado, fazendo nosso guia, [estate_character.GetTitledFirstName], girar.\n\nSeus olhos se arregalam quando [estate_character.GetSheHe] nota [mendicant_character.GetFirstNameNoTooltip]. \"Quem é #EMP este!#! [Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetLadyLord], você não pode sair assim! Não é seguro!\""
 travel_events.2022.desc_murder:0 "Tontamente escapando de um assassino, me levanto cambaleante. #EMP O que acabou de acontecer?#!\n\nTremendo, subo a escada de volta e retorno pelo corredor em direção à sala de jantar. Minha raiva logo substitui o estresse. #EMP [estate_character.GetTitledFirstName] estava envolvido nisso?#!\n\nAo finalmente alcançar o grupo reunido, mal noto o esqueleto coberto pendurado no arco.\n\nMeus olhos cheios de raiva, encaro [estate_character.GetFirstNameNoTooltip], que me olha com confusão."
 travel_events.2022.desc_pack:0 "Ao atravessarmos um arco para a próxima sala, uma grande forma de repente vem balançando na nossa direção. Todo o grupo pula e grita.\n\nQuando olho para cima, a figura escura parece ser um esqueleto, envolto em um lençol escuro. Faço uma careta enquanto [estate_character.GetTitledFirstName|U] ri e sorri para nós.\n\n\"Vocês deveriam ter visto as expressões em seus rostos, meus senhores e senhoras!\" M[Select_CString( entourage_member_one.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entourage_member_one'))], [entourage_member_one.GetTitledFirstName], está visivelmente agitado e se aproxima de [estate_character.GetTitledFirstNameNoTooltip] com a mão levantada."
 travel_events.2022.e:0 "Parece uma casa perfeitamente comum para mim."
 travel_events.2022.f:0 "Cavalheiro trapaceiro!"
 travel_events.2022.f_pack:0 "Não devo interferir."
 travel_events.2022.g:0 "Oh. Haha, sim, com certeza!"
 travel_events.2022.g_pack:0 "[entourage_member_one.GetFirstNameNoTooltip], não faça isso."
 travel_events.2022.t:0 "$travel_events.haunted_manor.t$: Sã e Salva"
 travel_events.2024.a:0 "Foi tudo... um pesadelo?"
 travel_events.2024.desc:0 "[mendicant_character.GetFirstName] me encara. [mendicant_character.GetSheHe|U] continua me encarando. Tento escapar correndo pelos corredores — mas [mendicant_character.GetSheHe] me segue. Os olhos [mendicant_character.GetHerHim|U] estão por toda parte.\n\n\"Eu... sei...\" [mendicant_character.GetSheHe] sussurra. Quando viro para correr, tropeço e caio em um poço tão escuro que nem mil velas poderiam iluminá-lo. Continuo caindo, caindo...\n\nDe repente, acordo assustado, encharcado de suor."
 travel_events.2024.t:0 "$travel_events.haunted_manor.t$: Uma Praga sobre Ti"
 travel_events.2025.a:0 "... será que seu estoque de [ROOT.Char.Custom('RegionalDrink')] corresponde à sua taxa de imposto?"
 travel_events.2025.b:0 "Você foi um[Select_CString( estate_owner.IsFemale, 'a', '' )] anfitriã[Select_CString( estate_owner.IsFemale, '', 'o' )] muito gracios[Select_CString( estate_owner.IsFemale, 'a', 'o' )], [estate_owner.GetFirstNameNoTooltip]."
 travel_events.2025.c:0 "Em troca, deixe-me compartilhar algumas ideias de melhorias."
 travel_events.2025.desc:0 "Chegando antes do anoitecer às propriedades rurais em [ROOT.Char.GetCurrentLocation.GetName], [estate_owner.GetFirstName] desempenha o papel de um anfitrião muito gracioso, atendendo a todas as nossas necessidades.\n\nMais tarde à noite, é realizado um banquete em minha homenagem e o [ROOT.Char.Custom('RegionalDrink')] flui figurativamente até começarmos a ver sinais do amanhecer no céu.\n\nNa manhã seguinte, sou abordado por [estate_owner.GetFirstNameNoTooltip]: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], gostamos muito de hospedá-la, e essa festa nos aquecerá por muitas noites adiante,\" [estate_owner.GetSheHe] sorri e acena com a cabeça."
 travel_events.2025.t:0 "O Anfitrião Gracioso"
 travel_events.2026.a:0 "#EMP Você#! deveria me #EMP pagar#! pelo prestígio que trouxe à sua #EMP fazenda#!."
 travel_events.2026.b:0 "Deixe-me compensá-lo."
 travel_events.2026.c:0 "Talvez [county_liege.GetTitledFirstNameNoTooltip] e eu possamos chegar a um acordo."
 travel_events.2026.d:0 "Como você #EMP ousa#!!"
 travel_events.2026.desc_carnivore:0 "uma verdadeira miscelânea de animais assados, ensopados, sopas, pães e coisas do tipo."
 travel_events.2026.desc_intro:0 "A tarde está avançando rapidamente para o anoitecer enquanto entramos nas propriedades rurais locais de [ROOT.Char.GetCurrentLocation.GetName]. O proprietário da propriedade [estate_owner.GetFirstName] nos recebe calorosamente e promete organizar um banquete suntuoso para nós.\n\nAssim que o banquete começa, nos deliciamos com"
 travel_events.2026.desc_outro:0 "\n\nPela manhã, [estate_owner.GetFirstNameNoTooltip] se aproxima enquanto eu aproveito meu café da manhã. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], sediar uma festa tão extravagante como a de ontem pode ser #EMP caro...#!\""
 travel_events.2026.desc_vegetarians:0 "uma maravilhosa variedade de pratos à base de vegetais, alguns dos quais nunca ouvi falar antes."
 travel_events.2026.t:0 "Dar Gorjeta ao Anfitrião"
 travel_events.2027.a:0 "Trabalhadores seguros e bem alimentados são mais eficazes."
 travel_events.2027.b:0 "A fome mantém a motivação em alta."
 travel_events.2027.c:0 "Pegue a fila, #EMP camponês.#!"
 travel_events.2027.d:0 "Por que não janta com o capataz?"
 travel_events.2027.desc:0 "Ao entrar na pedreira local em [ROOT.Char.GetCurrentLocation.GetName], avisto várias crianças magras e sujas ajudando seus pais famintos no trabalho pesado. A comida parece ser escassa nesta área.\n\nUm pouco mais adiante, o capataz da pedreira, [foreman_character.GetFirstName], está tendo uma discussão com [peasant_leader.GetFirstName], que parece ser o porta-voz dos trabalhadores. \"Isso é #EMP inaceitável#!!\" [peasant_leader.GetFirstNameNoTooltip] grita.\n\n\"Nós não podemos pagar por comida suficiente e temos ido para a cama com fome há meses. Nossos filhos estão famintos e nossa força está diminuindo ao realizar esse trabalho pesado. Tudo o que precisaríamos é de um #EMP pequeno#! aumento...\" [peasant_leader.GetSheHe|U] para enquanto percebe minha presença."
 travel_events.2027.t:0 "Desavença na Pedreira"
 travel_events.2028.a:0 "Arquiteto, você diz? Vou pegar um dos desenhos!"
 travel_events.2028.a_architect:0 "Isso está bem legal. Vou pegar um!"
 travel_events.2028.b.tt:0 "[budding_architect.GetShortUIName] trabalhará por um salário menor por 20 anos"
 travel_events.2028.b:0 "Suas habilidades seriam úteis na minha corte."
 travel_events.2028.c:0 "Isso é... legal... Continue com o bom trabalho."
 travel_events.2028.desc:0 "[budding_architect.GetFirstName] está absorto em pensamentos profundos quando nosso grupo entra nas pedreiras de [ROOT.Char.GetCurrentLocation.GetName]. [budding_architect.GetSheHe|U] está inclinado sobre uma grande mesa de madeira grosseiramente cortada, concentrado em desenhar algo em um pergaminho.\n\nMe aproximo mais, sobre o ombro [budding_architect.GetHerHim], chamando a atenção [budding_architect.GetHerHim]. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Eu não a notei aí, minhas sinceras desculpas!\"\n\nPergunto sobre o que [budding_architect.GetSheHe] está fazendo, e [budding_architect.GetFirstNameNoTooltip] responde.\n\"Oh, estou delineando meus pensamentos sobre construção e a construção de fundações. Sou um verdadeiro arquiteto, sabe,\" [budding_architect.GetSheHe] sorri timidamente."
 travel_events.2028.t:0 "Digestão do Arquiteto"
 travel_events.2029.a:0 "Pare com isso, herege!"
 travel_events.2029.b:0 "Como ousa profanar a [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]!"
 travel_events.2029.c:0 "Me conte mais sobre esses #EMP verdadeiros mestres#!."
 travel_events.2029.d:0 "Umm... tudo bem."
 travel_events.2029.desc:0 "É noite e um[Select_CString( crop_circler.IsFemale, 'a', '' )] [crop_circler.GetWomanMan] está trabalhando arduamente quando chegamos aos campos de cereais ao sul de [ROOT.Char.GetCurrentLocation.GetName]. Parece que [crop_circler.GetSheHe|U] está aplainando as colheitas a uma velocidade impressionante, usando uma grande peça plana de madeira e pedras pesadas.\n\nEu franzo a testa ao observar [Select_CString( crop_circler.IsFemale, 'a', 'o' )] [crop_circler.GetWomanMan] realizando seu trabalho, e então pergunto exatamente o que [crop_circler.GetSheHe] está fazendo.\n\n[crop_circler.GetSheHe|U] faz uma careta e começa a falar sobre como todos nós precisamos acordar e encontrar nossos verdadeiros mestres, em vez de nos escondermos por trás dos falsos ensinamentos [crop_circler.GetFaith.GetReligion.GetAdjectiveNoTooltip]. Eu dou alguns passos para trás, surpreso."
 travel_events.2029.t:0 "Despertar"
 travel_events.2030.a:0 "Está tudo bem."
 travel_events.2030.b:0 "Isso é #EMP inaceitável#!!"
 travel_events.2030.desc:0 "Pela manhã, [entourage_chaplain.GetTitledFirstName] se aproxima de mim, torcendo as mãos. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U] e [entourage_chaplain.Custom2('RelationToMe', ROOT.Char)], eu tenho a confissão mais horrível a fazer.\"\n\n[entourage_chaplain.GetSheHe|U] suspira profundamente. \"Embora eu não abrace nenhum... ensinamento decididamente insano... como aquel[Select_CString( crop_circler.IsFemale, 'a', 'e' )] [crop_circler.Custom('GetLassLad')] de ontem à noite, eu tive... #EMP dúvidas.#!\" [entourage_chaplain.GetFirstNameNoTooltip] me olha atentamente, buscando simpatia com seu dilema.\n\n\"Eu simplesmente não tenho certeza se [entourage_chaplain.GetFaith.HighGodName] realmente existe e vigia sobre nós.\" [entourage_chaplain.GetSheHe|U] conclui, com uma pausa dramática."
 travel_events.2030.t:0 "Confissões de um Não Crente"
 travel_events.2031.a:0 "Isso me intriga!"
 travel_events.2031.a_down_to_earth.t:0 "Pés na Terra"
 travel_events.2031.b:0 "[Select_CString( ROOT.Char.IsFemale, 'A', 'O' )] [ROOT.Char.GetTitleAsNameNoTooltip|U]? Fazendo #EMP jardinagem#!?"
 travel_events.2031.desc:0 "Os campos de [ROOT.Char.GetCurrentLocation.GetName] são uma visão de se admirar. Cada cultivo em flor, cada folha verde, cada caule suculento.\n\nRápido, encontro a fonte da verdura, avistando um[Select_CString( gardener_character.IsFemale, 'a', '' )] [gardener_character.GetWomanMan] em um campo, aparentemente dando uma espécie de palestra para um grupo de ouvintes. \"Meu nome é [gardener_character.Custom('MistressMaster')|U] [gardener_character.GetFirstName].\"\n\n[gardener_character.GetSheHe|U] me nota à distância e se vira na minha direção. \"Meu conhecimento sobre jardinagem é vasto, sim, incomparavelmente vasto — então fique um pouco, e ouça.\""
 travel_events.2031.t:0 "O Ventre da Terra"
 travel_events.2032.a:0 "Então, o que essa erva faz?"
 travel_events.2032.a_learning.tt:0 "Habilidade Melhorada"
 travel_events.2032.a_poisonous.desc:0 "Você encontrou algumas ervas venenosas"
 travel_events.2032.a_poisonous.t:0 "Ervas Adquiridas"
 travel_events.2032.a_poisonous.tt:0 "Você adquire algumas ervas venenosas que pode aplicar em seu próximo [scheme|E] de [GetScheme('murder').GetTypeName]"
 travel_events.2032.b:0 "Você teria interesse em se tornar meu médico pessoal?"
 travel_events.2032.c:0 "Isso é um desperdício do meu tempo."
 travel_events.2032.desc:0 "A impressionante estrutura defensiva no topo de [ROOT.Char.GetCurrentLocation.GetName] [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] é algo impressionante. Enquanto eu caminho ao longo do perímetro externo, eu noto uma pessoa peculiar à distância.\n\n[herbalist_character.GetSheHe|U] parece estar murmurando para [herbalist_character.GetHerselfHimself], enquanto para de se agachar e coletar o que parecem ser ervas de vários tipos. É quase como se [herbalist_character.GetSheHe] estivesse falando com... as #EMP ervas#!?\n\nEu me aproximo [herbalist_character.GetHerHim] com cuidado, e [herbalist_character.GetSheHe] olha para cima, várias ervas exibidas na palma de sua mão. Eu noto uma centelha de curiosidade por trás dos olhos [herbalist_character.GetHerHim], propondo uma pergunta não dita."
 travel_events.2032.t:0 "Uma Erva Para Você..."
 travel_events.2033.a_accident.desc:0 "Você tropeça e quebra o seu pescoço"
 travel_events.2033.a_cannibal:0 "Ah sim, prisioneiros; a outra carne branca."
 travel_events.2033.a_caught_eaten.desc:0 "[prisoner.GetShortUIName] é capturado e comido"
 travel_events.2033.a_caught_eaten.tt:0 "Prisioneiro Comido"
 travel_events.2033.a_caught_trophy.desc:0 "[prisoner.GetShortUIName] é caçado e transformado em um troféu"
 travel_events.2033.a_escaped.desc:0 "[prisoner.GetShortUIName] escapa do seu alcance"
 travel_events.2033.a_escaped.tt:0 "Prisioneiro Escapou"
 travel_events.2033.a_killed.desc:0 "[prisoner.GetShortUIName] te mata e escapa"
 travel_events.2033.a_manhunt.desc:0 "[prisoner.GetShortUIName] é caçado e morto"
 travel_events.2033.a_manhunt.tt:0 "Caçada ao Homem Cumprida"
 travel_events.2033.a_manhunt:0 "#EMP Empolgante!#!"
 travel_events.2033.a_manhunt_tt:0 "Um alvo que escapa de uma caçada ao homem pode voltar para se vingar"
 travel_events.2033.b:0 "... Eu suponho que devemos pegar [prisoner.GetSheHe]?"
 travel_events.2033.b_caught.desc:0 "[prisoner.GetShortUIName] é capturado"
 travel_events.2033.b_caught.effect:0 "[prisoner.GetShortUIName] permanece como seu prisioneiro"
 travel_events.2033.b_caught.tt:0 "Prisioneiro Capturado"
 travel_events.2033.c:0 "Deixe [prisoner.GetFirstNameNoTooltip] fugir. A natureza vai levar [prisoner.GetSheHe] de qualquer maneira."
 travel_events.2033.desc:0 "Um pouco atordoado com a fuga da prisão, considero cuidadosamente a situação.\n\nCertamente devemos levar um prisioneiro fugitivo à justiça?"
 travel_events.2033.desc_intro:0 "Mal entramos nos terrenos de caça de [ROOT.Char.GetCurrentLocation.GetName] quando meus guardas correm até mim, ofegantes e ligeiramente apavorados. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Aquel[Select_CString( prisoner.IsFemale, 'a', 'e' )] [prisoner.Custom2('InsultAdjective', ROOT.Char)] [prisoner.GetTitledFirstName] escapou das nossas algemas!\"\n\nMeu olhar imediatamente se volta para a borda da floresta, vasculhando em busca de sinais de movimento, mas não encontro nada."
 travel_events.2033.desc_manhunt:0 "Isso só pode significar uma coisa. #EMP Caça ao Homem!#!\n\n"
 travel_events.2033.desc_manhunt_first:0 "Há muito tempo quero experimentar minha mão na presa mais elusiva e perigosa da natureza. Um sorriso brinca no canto da minha boca."
 travel_events.2033.desc_manhunt_previous:0 "Aquela faísca de alegria ao relembrar minha última caçada ao homem me deixa todo nervoso. A empolgação. O perigo. Mal posso esperar."
 travel_events.2033.t:0 "Prisioneiro Escapou!"
 travel_events.2034.a:0 "Você não precisa fazer isso!"
 travel_events.2034.a_death_desc:0 "$travel_events.2019.a_death.desc$"
 travel_events.2034.a_overpowered_desc:0 "Você domina [vengeful_prisoner.GetShortUIName]"
 travel_events.2034.a_overpowered_effect:0 "Você decide o destino de [vengeful_prisoner.GetShortUIName]"
 travel_events.2034.b:0 "#EMP [bodyguard.GetFirstNameNoTooltip]!!#!"
 travel_events.2034.b_death_desc:0 "[bodyguard.GetShortUIName] mata [vengeful_prisoner.GetShortUIName]"
 travel_events.2034.b_death_tt:0 "Prisioneiro Escapado Morto"
 travel_events.2034.b_overpowered_desc:0 "[bodyguard.GetShortUIName] domina [vengeful_prisoner.GetShortUIName]"
 travel_events.2034.desc:0 "e do canto do olho avisto [vengeful_prisoner.GetTitledFirstName], faca em punho.\n\n[vengeful_prisoner.GetSheHe|U] sorri ironicamente. \"[ROOT.Char.GetTitledFirstNameNoTooltip|U], é bom te ver novamente. Desta vez, #EMP eu#! vou fazer a caçada ao homem.\" Eu pestanejo, momentaneamente atordoado."
 travel_events.2034.desc_intro:0 "A manhã está começando a raiar no nosso acampamento em [ROOT.Char.GetCurrentLocation.GetName] [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]. Eu bocejo e me estico suavemente, rolando para o lado.\n\nSonolento, eu me levanto e me aproximo da abertura da tenda para respirar o ar fresco da manhã. De repente, os pelos da nuca se arrepiam, "
 travel_events.2034.desc_long_time:0 "e do canto do olho avisto um[Select_CString( vengeful_prisoner.IsFemale, 'a', '' )] [vengeful_prisoner.GetWomanMan], faca em punho.\n\n[vengeful_prisoner.GetSheHe|U] sorri ironicamente. \"Você não se lembra de mim, não é? Bem, eu me lembro de #EMP você#!, [ROOT.Char.GetTitledFirstNameNoTooltip] e suas práticas #EMP sádicas#! de caçada ao homem.\" Uma vaga lembrança me retorna. Prisioneiro fugitivo #EMP [vengeful_prisoner.GetTitledFirstName]#!...?"
 travel_events.2034.t:0 "O que Vai, Volta..."
 travel_events.2035.a:0 "A morte é o que você merece."
 travel_events.2035.b:0 "Você deve voltar para a prisão."
 travel_events.2035.c:0 "Eu vou virar a outra face."
 travel_events.2035.desc:0 "[vengeful_prisoner.GetTitledFirstName|U] está ajoelhado na minha frente, contido e incapaz de se mover. Depois do choque inicial, meus guardas enchem a tenda.\n\n[vengeful_prisoner.GetSheHe|U] olha obstinadamente para o chão e recusa a encontrar o meu olhar. O que devo fazer com ess[Select_CString( vengeful_prisoner.IsFemale, 'a', 'e' )] [vengeful_prisoner.Custom2('InsultNoun', ROOT.Char)]?"
 travel_events.2035.t:0 "... Volta"
 travel_events.2036.a:0 "Viva e deixe viver."
 travel_events.2036.a_criminal:0 "Acho que até criminosos podem se reformar."
 travel_events.2036.a_reformed:0 "Contanto que [peaceful_prisoner.GetSheHe] não faça outra tentativa contra a minha vida."
 travel_events.2036.b:0 "[peaceful_prisoner.GetTitledFirstNameNoTooltip|U] vem #EMP comigo#!."
 travel_events.2036.b_criminal:0 "Criminoso uma vez, criminoso sempre."
 travel_events.2036.b_reformed:0 "#EMP ...não#!, não me sinto seguro sabendo que [peaceful_prisoner.GetSheHe] está por aqui."
 travel_events.2036.desc:0 "Eu instantaneamente reconheço meu prisioneiro fugido, [peaceful_prisoner.GetTitledFirstName], compartilhando uma risada e ajudando um dos habitantes idosos da vila rural.\n\n[peaceful_prisoner.GetSheHe|U] parece contente com a sua situação."
 travel_events.2036.desc_intro:0 "Nós entramos nas portas de um vilarejo em [ROOT.Char.GetCurrentLocation.GetName]. As pessoas parecem em paz aqui, levando suas vidas diárias e ajudando uns aos outros.\n\nExaminando casualmente os aldeões, um repentino solavanco de reconhecimento passa por mim. "
 travel_events.2036.desc_reformed:0 "No santuário local, eu instantaneamente reconheço meu prisioneiro fugido, [peaceful_prisoner.GetTitledFirstName], engajado em uma conversa amigável com o líder espiritual.\n\nQue coincidência irônica é esta! Eu olho enquanto [peaceful_prisoner.GetSheHe] ajuda o clero com tarefas mundanas, aparentemente em paz."
 travel_events.2036.t:0 "Um Fim?"
 travel_events.2037.a:0 "Soa interessante o suficiente..."
 travel_events.2037.a_child:0 "Eu vou jogar!"
 travel_events.2037.a_manhunted:0 "Vamos começar."
 travel_events.2037.a_their_kill.desc:0 "[2037_manhunt_prisoner.GetShortUIName] é caçado e morto por [2037_county_liege.GetShortUIName]"
 travel_events.2037.a_their_kill.tt:0 "[2037_county_liege.GetShortUINameNoTooltip] Faz a Morte"
 travel_events.2037.a_your_kill.desc:0 "Você caça e mata [2037_manhunt_prisoner.GetShortUIName]"
 travel_events.2037.b:0 "Eu poderia usar esse prisioneiro, se você não se importar."
 travel_events.2037.b_child:0 "Eu prefiro que [2037_manhunt_prisoner.GetFirstNameNoTooltip] venha comigo."
 travel_events.2037.c:0 "Você está louco?"
 travel_events.2037.c_child:0 "Não. Isso parece ser um jogo maligno."
 travel_events.2037.desc:0 "Encontramos [2037_county_liege.GetTitledFirstName], [Select_CString( 2037_county_liege.IsFemale, 'a', 'o' )] governante de [ROOT.Char.GetCurrentLocation.GetName], e o séquito de [2037_county_liege.GetHerHis] nos terrenos de caça locais.\n\nApós uma troca de cumprimentos educados, [2037_county_liege.GetSheHe] me olha com um sorriso travesso: \"Você gostaria de se juntar a mim para o mais nobre dos esportes?"
 travel_events.2037.desc_adult:0 "m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [2037_county_liege.Custom2('RelationToMeShort', ROOT.Char)]?\" "
 travel_events.2037.desc_child:0 "pequenino?\" "
 travel_events.2037.desc_outro:0 "#EMP Caça ao homem.#! Eu estou verdadeiramente enojado... ou estou intrigado?"
 travel_events.2037.desc_outro_child:0 "\n\nMinha curiosidade está definitivamente aguçada. Que jogo isso poderia ser... ? Pega?\n\nEnquanto considero a oferta, noto que [Select_CString( entourage_character.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entourage_character'))] [entourage_character.GetTitledFirstName] busca minha atenção e balança a cabeça com cuidado."
 travel_events.2037.desc_outro_manhunter:0 "Como um caçador experiente, essa sugestão me agrada."
 travel_events.2037.desc_outro_segway_adult:0 "\n\nEu percebo logo o que é esse #EMP esporte#! a que [2037_county_liege.GetSheHe] se refere."
 travel_events.2037.desc_segway:0 "[2037_county_liege.GetSheHe|U] acena para o prisioneiro acorrentado na beira da floresta."
 travel_events.2037.t:0 "O Caçador de Homens"
 travel_events.2038.a:0 "Me parece um acordo!"
 travel_events.2038.a_their_kill.desc:0 "O coelho é morto por [entourage_character.GetShortUIName]"
 travel_events.2038.a_their_kill.tt:0 "[entourage_character.GetShortUINameNoTooltip] Mata"
 travel_events.2038.a_your_kill.desc:0 "Sua flecha perfura perfeitamente o coração do coelho"
 travel_events.2038.a_your_kill.tt:0 "Você Mata"
 travel_events.2038.b:0 "#EMP Ah não#!, o sol está no meu olho!"
 travel_events.2038.c:0 "...pft, eu não tenho tempo para isso."
 travel_events.2038.desc:0 "Cheio de toda sorte de vida selvagem, [entourage_character.GetTitledFirstName] e eu concordamos que [ROOT.Char.GetCurrentLocation.GetName] seria um lugar esplêndido para caçar.\n\nEmbora não tenhamos tempo para uma saída adequada, enquanto percorremos a área, eu avisto um coelho selvagem imaculado na beira da floresta. Ele tem marcações peculiares em sua pelagem e eu faço um sinal para [entourage_character.GetFirstNameNoTooltip] para observar o animal.\n\nQuando [entourage_character.GetSheHe] avista o coelho, [entourage_character.GetSheHe] sorri. \"O que você acha de uma aposta amigável, [entourage_character.Custom2('RelationToMeShort', ROOT.Char)]? Quem acertar esse coelho imaculado com uma flecha ganha.\""
 travel_events.2038.t:0 "Mira Verdadeira"
 travel_events.2039.a:0 "Bom tiro!"
 travel_events.2039.a_cynical:0 "Já vi pior."
 travel_events.2039.a_trinket.t:0 "Ganho de Bugiganga"
 travel_events.2039.a_win:0 "Isso foi divertido!"
 travel_events.2039.desc_child_won:0 "[entourage_character.GetTitledFirstName] se esforça atrás do coelho, arco pronto, alheio à ameaça fraca das minhas flechas mal lançadas.\n\nDepois de alguma luta com a vegetação, [entourage_character.GetTitledFirstNameNoTooltip] gorjeia triunfantemente e se apressa, pegando o cadáver do animal imaculado com uma flecha firmemente cravada em seu pequeno torso. Eu aplaudo enquanto [entourage_character.GetSheHe] sorri para mim."
 travel_events.2039.desc_lost:0 "[entourage_character.GetTitledFirstName] está alguns passos à minha frente, enquanto nos esforçamos para nos aproximarmos do coelho para o tiro. Eu luto para acompanhar, enquanto [entourage_character.GetSheHe] mira uma flecha no animal e, em um movimento rápido, a lança diretamente no pequeno corpo da criatura.\n\n[entourage_character.GetFirstNameNoTooltip] faz um gesto de vitória e grita enquanto o coelho fica mole no chão, e [entourage_character.GetSheHe] se apressa para pegar o cadáver. Eu aplaudo em apreciação."
 travel_events.2039.desc_won:0 "Coelho à vista, ambos nos movemos lentamente, mas propositadamente, em direção ao coelho, mirando em seu pequeno corpo enquanto ele mastiga um pedaço de palha. Eu puxo minha corda — e solto — enquanto a flecha vai #EMP diretamente para o corpo do animal#!.\n\nO impacto repentino o lança alguns passos, então o pequeno corpo cai no chão, imóvel. Eu rugo em triunfo, e [entourage_character.GetTitledFirstName] se junta a mim em meu júbilo. \"Bom tiro,\" [entourage_character.GetSheHe] exclama, enquanto eu avanço para pegar o troféu."
 travel_events.2039.t:0 "Mira Mais Verdadeira"
 travel_events.2040.a.flavor:0 "Quem é mais perigoso do que uma pessoa lunática?"
 travel_events.2040.a.flavor_child:0 "Tenho certeza de que [2037_manhunt_prisoner.GetSheHe] não me machucaria, certo?"
 travel_events.2040.a.tt:0 "[2037_manhunt_prisoner.GetShortUIName] trabalhará como seu [GetCourtPositionType('bodyguard_court_position').GetName()] de graça"
 travel_events.2040.a:0 "...isso é muito filosófico."
 travel_events.2040.a_child:0 "Eu também fiz coisas ruins."
 travel_events.2040.b.flavor:0 "Então é por isso que [2037_manhunt_prisoner.GetSheHe] foi aprisionado..."
 travel_events.2040.b.flavor_child:0 "[2037_manhunt_prisoner.GetTitledFirstNameNoTooltip] está me assustando..."
 travel_events.2040.b:0 "Assassinos pertencem atrás das grades."
 travel_events.2040.b_child:0 "Ferir pessoas não está certo."
 travel_events.2040.c.flavor:0 "Olho por olho."
 travel_events.2040.c:0 "#EMP Eu não posso permitir que um assassino viva!#!"
 travel_events.2040.c_death.desc:0 "Você morre"
 travel_events.2040.c_incapable.desc:0 "Você fica gravemente ferido na luta, e [2037_manhunt_prisoner.GetShortUIName] escapa"
 travel_events.2040.c_incapable.t:0 "Gravemente Ferido"
 travel_events.2040.c_slay.desc:0 "Você mata [2037_manhunt_prisoner.GetShortUIName]"
 travel_events.2040.c_slay.t:0 "Assassino Morto"
 travel_events.2040.c_wounded.desc:0 "Você mata [2037_manhunt_prisoner.GetShortUIName], mas fica ferido"
 travel_events.2040.c_wounded.t:0 "$travel_events.2001.c_failure.tt$"
 travel_events.2040.desc:0 "Eu nunca realmente perguntei a [2037_manhunt_prisoner.GetSheHe] por que [2037_manhunt_prisoner.GetSheHe] tinha sido aprisionado, percebo. Então, como se [2037_manhunt_prisoner.GetSheHe] tivesse lido minha mente, [2037_manhunt_prisoner.GetTitledFirstNameNoTooltip] murmura:"
 travel_events.2040.desc_child:0 "\"Por que aquel[Select_CString( 2037_county_liege.IsFemale, 'a', 'e' )] [2037_county_liege.GetWomanMan] terrível tentou te matar lá atrás?\" Eu falo de repente. [2037_manhunt_prisoner.GetTitledFirstNameNoTooltip] hesita por um momento, então desvia o olhar enquanto [2037_manhunt_prisoner.GetSheHe] responde:"
 travel_events.2040.intro:0 "Uma noite, enquanto estamos sentados ao redor da fogueira, olho para cima e percebo que estou sozinho com [2037_manhunt_prisoner.GetTitledFirstName]. Os olhos [2037_manhunt_prisoner.GetHerHim|U] refletem a chama tremeluzente enquanto [2037_manhunt_prisoner.GetSheHe] me encara.\n\n"
 travel_events.2040.outro:0 "\n\n\"Foi como se a carne [2040_previous_victim.GetHerHim] clamasse por libertação, entende?\" uma nostalgia sombria se insinuando na voz [2037_manhunt_prisoner.GetHerHim]."
 travel_events.2040.t:0 "Aproveitando a Oportunidade"
 travel_events.2100.a:0 "Por que devo #EMP eu#! me envolver?"
 travel_events.2100.a_nemesis:0 "#EMP Finalmente!#!"
 travel_events.2100.a_nonstealthy_entourage.desc:0 "Sua presença é notada por [murder_target.GetShortUIName]"
 travel_events.2100.a_nonstealthy_entourage.tt:0 "Séquito Exposto"
 travel_events.2100.a_nonstealthy_outcome.tt:0 "Se [murder_target.GetShortUIName] sobreviver, [murder_target.GetSheHe] lembrará disso"
 travel_events.2100.a_rival:0 "Melhor assim."
 travel_events.2100.a_stealthy_entourage.desc:0 "Você e seu séquito permanecem ocultos"
 travel_events.2100.a_stealthy_entourage.tt:0 "Séquito Oculto"
 travel_events.2100.a_stealthy_outcome.tt:0 "Se [murder_target.GetShortUIName] sobreviver, [murder_target.GetSheHe] nunca saberá que você estava aqui"
 travel_events.2100.b.tt:0 "Você intervém na tentativa de assassinato de [murder_target.GetShortUIName]"
 travel_events.2100.b:0 "Devo agir!"
 travel_events.2100.b_outcome_tt:0 "[murder_target.GetShortUIName] lembrará disso"
 travel_events.2100.desc_flats:0 "Ainda observando o grupo, parece que cavaleiros mascarados com armas erguidas estão se aproximando rapidamente do leste!"
 travel_events.2100.desc_hills:0 "Mas o que são esses cavaleiros mascarados, armas desembainhadas, se aproximando do oeste... ?"
 travel_events.2100.desc_intro:0 "Estamos progredindo bem em nossos esforços para chegar a [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName], e "
 travel_events.2100.desc_intro_flats:0 "as planícies de [ROOT.Char.GetCurrentLocation.GetName] nos permitem baixar a guarda por alguns momentos.\n\nQuando chegamos ao topo do vale e olhamos para baixo, noto outro séquito avançando diligentemente."
 travel_events.2100.desc_intro_hills:0 "o vento está a nosso favor enquanto percorremos as encostas de [ROOT.Char.GetCurrentLocation.GetName] [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l].\n\nBem à nossa frente, outro séquito também está avançando pela encosta da colina."
 travel_events.2100.desc_intro_trees:0 "a densa floresta de [ROOT.Char.GetCurrentLocation.GetName] não é páreo para a sagacidade do nosso guia local.\n\nQuando as árvores se abrem, avisto um segundo grupo de viajantes, seguindo adiante."
 travel_events.2100.desc_negative_segway:0 "[Select_CString( murder_target.IsFemale, 'a', 'o' )] [murder_target.Custom('InsultAdjectiveGeneric')]"
 travel_events.2100.desc_no_relation_liege:0 "Eles parecem estar observando a área, tirando notas e discutindo a paisagem."
 travel_events.2100.desc_no_relation_traveller:0 "Eles parecem estar apreciando a paisagem, praticamente saltitando e fazendo turismo na área local."
 travel_events.2100.desc_outro:0 "\n\nIsso parece um emboscada, e "
 travel_events.2100.desc_outro_default:0 "hesito. Será realmente minha responsabilidade proteger outros viajantes?"
 travel_events.2100.desc_outro_negative:0 "hesito. Devo intervir no que parece ser uma morte certa para [murder_target.GetTitledFirstNameNoTooltip]?"
 travel_events.2100.desc_outro_positive:0 "não há dúvida em minha mente. Devo salvar [murder_target.GetTitledFirstNameNoTooltip]!"
 travel_events.2100.desc_positive_segway:0 "m[Select_CString( murder_target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murder_target'))]"
 travel_events.2100.desc_relation_in:0 " Ao espreitar, percebo que o governante desse séquito em particular é"
 travel_events.2100.desc_relation_out:0 "[murder_target.GetTitledFirstName]."
 travel_events.2100.desc_trees:0 "Mas algo não está certo. Vasculhando a linha das árvores, também percebo um grupo de figuras suspeitas e encapuzadas, aparentemente esperando que o grupo de viajantes se aproxime."
 travel_events.2100.t:0 "$travel_events_life_or_death.t$"
 travel_events.2101.a:0 "Como ousa!"
 travel_events.2101.a_assassin_death.desc:0 "Você mata o assassino"
 travel_events.2101.a_assassin_death.tt:0 "Assassino Morto"
 travel_events.2101.a_bodyguard_kill.desc:0 "O assassino é morto por [bodyguard.GetShortUIName]"
 travel_events.2101.a_bodyguard_wounded.desc:0 "[bodyguard.GetShortUIName] mata o assassino, mas fica ferido"
 travel_events.2101.a_bodyguard_wounded.tt:0 "Guarda Ferido"
 travel_events.2101.a_death.desc:0 "Você morre"
 travel_events.2101.a_guards:0 "[bodyguard.GetNameNoTooltip]!!"
 travel_events.2101.a_ruler_assassinated.desc:0 "[murder_target.GetShortUIName] foi assassinado enquanto visitava [visiting_ruler.MakeScope.Var('assassination_location').GetProvince.GetName]"
 travel_events.2101.a_ruler_assassinated.tt:0 "[murder_target.GetShortUIName] Morreu"
 travel_events.2101.a_ruler_survived.desc:0 "[murder_target.GetShortUIName] sobreviveu à tentativa de assassinato em [visiting_ruler.MakeScope.Var('assassination_location').GetProvince.GetName]"
 travel_events.2101.a_ruler_survived.tt:0 "[murder_target.GetShortUIName] Sobreviveu"
 travel_events.2101.desc:0 "Enquanto observo as terras de [ROOT.Char.GetCurrentLocation.GetName], o sol está alto e há uma brisa leve. Olho ao redor e reflito sobre o fato de que a área é bastante desolada, exceto por algumas aves migratórias lá no alto do céu.\n\nEnquanto me inclino para ajustar minha bota, sou repentinamente erguido quando ouvimos cavaleiros se aproximando. As figuras encapuzadas parecem estar vindo de todas as direções e, antes que eu perceba, um dos vilões está bem na minha frente, com a lâmina desembainhada e avançando em minha garganta!"
 travel_events.2101.t:0 "$travel_danger_prefix$ $travel_events_life_or_death.t$, Assassinos!"
 travel_events.2102.a:0 "Isso realmente fala do caráter [visiting_ruler.GetTitledFirstNamePossessiveNoTooltip] [visiting_ruler.Custom('InsultAdjectiveGeneric')]."
 travel_events.2102.desc:0 "A luta continua por horas, mas na realidade dura apenas alguns minutos. Os assassinos são repelidos e sobrevivemos ilesos.\n\nVou procurando no campo de batalha e encontro evidências do plano de assassinato que foi tramado contra mim em um dos corpos. Em meu estado aumentado de alerta, também percebo uma bandeira desaparecendo logo fora da vista. [visiting_ruler.GetTitledFirstName]?"
 travel_events.2102.desc_default:0 "\n\n[visiting_ruler.GetSheHe|U] viu os eventos acontecendo sem me ajudar em meu momento de necessidade? Essa postura agressivamente não envolvida realmente mostra em quem você pode ou não confiar."
 travel_events.2102.desc_negative:0 "\n\nClaro. Seria insensato da minha parte esperar apoio de alguém como [visiting_ruler.GetFirstNameNoTooltip] e sua laia. Uma maldição sobre sua sepultura."
 travel_events.2102.desc_positive:0 "\n\nComo... [visiting_ruler.GetSheHe] poderia? Eu... esperava mais [visiting_ruler.GetHerHim]. Meus olhos estão meio fechados enquanto a dor desta traição me fere mais do que qualquer lâmina poderia."
 travel_events.2102.t:0 "$travel_danger_prefix$ $travel_events_life_or_death.t$, Traído"
 travel_events.2103.a:0 "Bem, [murder_target.GetSheHe] #EMP sobreviveu#! afinal."
 travel_events.2103.desc_default:0 "\n\n[ROOT.Char.GetTitledFirstName], espero decência humana regular e respeito à vida como qualquer pessoa boa e fiel. Você me deixar para morrer no meio de [ROOT.Var('assassination_location').GetProvince.GetName] [ROOT.Var('assassination_location').GetProvince.GetTerrain.GetNameNoTooltip|l] infelizmente fala sobre seu caráter como algo menos do que um [ROOT.Char.GetWomanMan] temente a Deus. Eu vou me lembrar disso."
 travel_events.2103.desc_intro:0 "[murder_target.Custom2('NegativeSupplimentaryGreeting', ROOT.Char )]"
 travel_events.2103.desc_negative:0 "\n\nEu não esperava nada menos de você do que o desejo de ver meu último suspiro se dissipar nas terras selvagens de [ROOT.Var('assassination_location').GetProvince.GetName] [ROOT.Var('assassination_location').GetProvince.GetTerrain.GetNameNoTooltip|l].\n\nVerdadeiramente, saborearei o dia em que a centelha da vida finalmente deixar aqueles antros que você chama de olhos, m[Select_CString( visiting_ruler.IsFemale, 'inha', 'eu' )] [visiting_ruler.Custom('InsultAdjectiveGeneric')] [murder_target.Custom2('RelationToMe', SCOPE.sC( 'visiting_ruler' ))]."
 travel_events.2103.desc_positive:0 "\n\nComo você pôde, m[Select_CString( visiting_ruler.IsFemale, 'inha', 'eu' )] [murder_target.Custom2('RelationToMe', SCOPE.sC( 'visiting_ruler' ))]? Como você pôde me deixar para morrer no meio de [ROOT.Var('assassination_location').GetProvince.GetName] [ROOT.Var('assassination_location').GetProvince.GetTerrain.GetNameNoTooltip|l]? Vou me lembrar disso, pode ter certeza."
 travel_events.2103.t:0 "[murder_target.Custom2('AppropriateGreetingNegative', ROOT.Char )]"
 travel_events.2104.a:0 "Esse é meu bom ato do dia."
 travel_events.2104.a_shy:0 "Era a coisa certa a fazer."
 travel_events.2104.desc:0 "Eu e meu séquito avançamos de cabeça nos assassinos em potencial, pegando-os completamente de surpresa. Quão incompetente você precisa ser para não ter uma visão clara da retaguarda?\n\nCortamos facilmente os poucos que resistem, e o resto foge para o interior das matas. Olho para cima e vejo [murder_target.GetTitledFirstName] me encarando, olhos arregalados e boca levemente aberta.\n\nQuando [murder_target.GetSheHe] se recupera, suas características faciais se ajustam, mas [murder_target.GetSheHe] ainda parece surpreso e grato por minha intervenção. [murder_target.GetSheHe|U] me chama para me aproximar."
 travel_events.2104.t:0 "$travel_danger_prefix$ $travel_events_life_or_death.t$, Como Salvar uma Vida"
 travel_events.2105.a.tt:0 "[visiting_ruler.GetShortUIName] veio em seu auxílio!"
 travel_events.2105.a:0 "Você é um verdadeiro espírito nobre!"
 travel_events.2105.a_cynical:0 "Aprecio o gesto."
 travel_events.2105.desc_default:0 "O ato de ajudar um — para todos os propósitos — estranho em necessidade realmente prova que há um plano divino. Isso deve ser um sinal de [ROOT.Char.GetFaith.HighGodName] de que nossa viagem é abençoada. Meu salvador volta para mim e acena educadamente. Sorrio em resposta e murmuro um '[ROOT.Char.GetFaith.HighGodName] te abençoe, [Select_CString( visiting_ruler.IsFemale, 'minha', 'meu' )] [visiting_ruler.GetLadyLord]!'"
 travel_events.2105.desc_intro:0 "Enquanto observo as terras de [ROOT.Char.GetCurrentLocation.GetName], somos subitamente atacados por assassinos. E, aparentemente do nada, [visiting_ruler.GetTitledFirstName] e seu séquito vêm cavalgando, de cabeça erguida e armas erguidas, direto para a multidão de assassinos!\n\n"
 travel_events.2105.desc_negative:0 "Observo com espanto enquanto meu [ROOT.Char.Custom2('GetRivalNemesis', SCOPE.sC('visiting_ruler'))] golpeia assassinos à esquerda e à direita, o resto deles fugindo aterrorizado. [visiting_ruler.GetFirstNameNoTooltip] retorna, depois para bem na minha frente: 'Parece que você precisa de ajuda,' [visiting_ruler.GetSheHe] resmunga.\n\nHesito. Embora [visiting_ruler.GetSheHe] #EMP tenha#! acabado de salvar minha pele, como posso confiar n[visiting_ruler.GetSheHe]... ? Aceno relutantemente."
 travel_events.2105.desc_positive:0 "Meus olhos se enchem de alegria enquanto observo [Select_CString( visiting_ruler.IsFemale, 'minha salvadora', 'meu salvador' )] e [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('visiting_ruler'))] [visiting_ruler.GetFirstNameNoTooltip] afastando os assassinos e, em seguida, fazendo um círculo amplo e voltando para o meu séquito: 'M[Select_CString( visiting_ruler.IsFemale, 'inha', 'eu' )] [visiting_ruler.Custom2('RelationToMe', ROOT.Char)]! Como você está se saindo?' [visiting_ruler.GetSheHe|U] sorri para mim."
 travel_events.2105.t:0 "$travel_events.2104.t$"
 travel_events.2107.a:0 "É nosso dever intervir."
 travel_events.2107.a_christian:0 "É o que qualquer bom [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] faria."
 travel_events.2107.a_outcome_tt:0 "[travelling_ruler.GetShortUIName] vai se lembrar disso"
 travel_events.2107.b:0 "Isso é muito perigoso."
 travel_events.2107.b_negative:0 "Boa viagem."
 travel_events.2107.b_outcome_tt:0 "Se [travelling_ruler.GetShortUIName] sobreviver, [travelling_ruler.GetSheHe] vai se lembrar disso."
 travel_events.2107.desc_intro:0 "O céu está praticamente sem nuvens enquanto passo a tarde nos arredores de [holding_location.GetName]. No meu caminho de volta para a fortaleza, noto um grupo de viajantes seguindo os limites da cidade. "
 travel_events.2107.desc_intro_desert:0 "Uma brisa monótona brinca nas areias do lado de fora de [holding_location.GetName], enviando pequenas nuvens de poeira rodopiando em todas as direções. Enquanto observo o sol errante fora da fortaleza, noto um grupo de viajantes caminhando diligentemente pelas areias. "
 travel_events.2107.desc_intro_forest:0 "Enquanto o sol está se pondo, a floresta ao redor de [holding_location.GetName] fica mais escura. Da segurança de minha fortaleza, estudo a luz da noite e, ao fazer isso, noto um grupo de viajantes atravessando a borda da floresta. "
 travel_events.2107.desc_intro_hills:0 "A suave inclinação das colinas ao redor de [holding_location.GetName] é suave para os olhos, enquanto olho para fora e abaixo das colinas até o pequeno lago abaixo. Um grupo de viajantes aparentemente está contornando o lago, avançando em direção ao seu destino. "
 travel_events.2107.desc_intro_jungle:0 "A selva está quente e úmida como de costume, e da segurança de minha fortaleza, olho para cima para as árvores acima de [holding_location.GetName] para dar uma olhada nos pássaros coloridos que estão nidificando lá em cima. No canto do olho, noto um grupo de viajantes atravessando a vegetação ao norte. "
 travel_events.2107.desc_intro_mountains:0 "O ar está fresco quando coloco minha cabeça para fora, olhando para o vale abaixo de [holding_location.GetName]. Aprecio a diferença de temperatura enquanto observo a vida selvagem e, percebo, um grupo de viajantes que estão fazendo diligentemente o caminho pelo vale. "
 travel_events.2107.desc_intro_plains:0 "Enquanto o sol está começando a se pôr, observo a [holding_location.GetTerrain.GetNameNoTooltip|l] de minhas dependências em [holding_location.GetName]. À distância, um grupo de viajantes está atravessando a terra gramada estendida à sua frente. "
 travel_events.2107.desc_intro_wetlands:0 "Enquanto o sol está se pondo, a [holding_location.GetTerrain.GetNameNoTooltip|l] fora de [holding_location.GetName] tem um tom distinto esta noite. Da segurança de minha fortaleza, observo as cores em mudança e a escuridão se aproximando e, ao fazer isso, percebo um grupo de viajantes muito fora da fortaleza, atravessando as estradas lamacentas. "
 travel_events.2107.desc_outro:0 "Os viajantes estão claramente prestes a serem atacados, em #EMP minha#! terra."
 travel_events.2107.desc_outro_family:0 "O sangue é mais espesso que a água, como dizem?"
 travel_events.2107.desc_outro_negative:0 "Isso deve ser interessante."
 travel_events.2107.desc_outro_positive:0 "Eu devo fazer algo!"
 travel_events.2107.desc_segway:0 "\n\nQuando olho mais de perto, percebo que o líder do grupo não é ninguém menos que [travelling_ruler.GetTitledFirstName] e seu séquito. Estudando casualmente seu movimento, instintivamente olho para cima quando um enxame de cavaleiros se aproxima rapidamente do grupo pacífico.\n\nÀ medida que os cavaleiros se aproximam, eles começam a erguer suas armas. "
 travel_events.2107.t:0 "$travel_danger_prefix$ $travel_events_life_or_death.t$, Refúgio Seguro"
 travel_events.2108.a.tt:0 "[province_liege.GetShortUIName] veio em seu auxílio!"
 travel_events.2108.a:0 "Seria uma honra!"
 travel_events.2108.a_negative:0 "É bom estar vivo, suponho."
 travel_events.2108.desc:0 "\n\nEstou muito agradavelmente surpreso pela atitude altruística d[Select_CString( province_liege.IsFemale, 'a', 'o' )] [province_liege.GetTitleAsNameNoTooltip] local, e louvo [ROOT.Char.GetFaith.HighGodName] por eles terem chegado a tempo."
 travel_events.2108.desc_intro:0 "Atravessando o [holding_location.GetTerrain.GetNameNoTooltip|l] nos arredores de [holding_location.GetName], somos subitamente atacados por um bando de cavaleiros bandidos, sedentos de sangue. Outro grupo de cavaleiros rapidamente se aproxima do povoado próximo, liderado por [province_liege.GetTitledFirstName]!"
 travel_events.2108.desc_negative:0 "\n\nPor enquanto, contenho minha surpresa, pois ser salvo por ninguém menos que m[Select_CString( province_liege.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('province_liege'))] certamente não era algo que eu esperava!"
 travel_events.2108.desc_outro:0 "\"Você deveria se juntar a nós para um pouco da hospitalidade [province_liege.GetCulture.GetNameNoTooltip] em [holding_location.GetNameNoTooltip]!\""
 travel_events.2108.desc_outro_negative:0 "\"Eu não poderia deixar que mais ninguém tivesse o prazer de pôr fim [Select_CString( ROOT.Char.IsFemale, 'a minha', 'ao meu' )] [province_liege.Custom2('RelationToMe', ROOT.Char)], não é mesmo?\" Hesito por um momento e então retruco."
 travel_events.2108.desc_outro_positive:0 "\"Você está machucado? Por favor, venha se juntar a nós para um pouco de hospitalidade em [holding_location.GetNameNoTooltip], assim que essa bagunça for resolvida.\""
 travel_events.2108.desc_positive:0 "\n\nMeu coração se aquece ao ver m[Select_CString( province_liege.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('province_liege'))] [province_liege.GetFirstNameNoTooltip] liderar a carga de frente contra a retaguarda desprotegida do bando de canalhas."
 travel_events.2108.desc_segway:0 "\n\n[province_liege.GetFirstNameNoTooltip] faz um círculo de volta com um sorriso vitorioso no rosto: "
 travel_events.2108.t:0 "$travel_danger_prefix$ $travel_events_life_or_death.t$, Salvo"
 travel_events.2109.a:0 "A terra está segura mais uma vez."
 travel_events.2109.a_first_hurt.desc:0 "[first_potential_hurt_knight.GetShortUIName] foi ferido na batalha"
 travel_events.2109.a_hurt.tt:0 "[ROOT.Char.Custom('KnightCultureNoTooltip')] Ferido"
 travel_events.2109.a_negative:0 "Eu só queria evitar ter que limpar uma bagunça maior."
 travel_events.2109.a_none_hurt.desc:0 "Nenhum dos seus [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] foi ferido na batalha"
 travel_events.2109.a_none_hurt.tt:0 "Intactos"
 travel_events.2109.a_positive:0 "Feliz em poder ajudar, [province_liege.Custom2('RelationToMe', SCOPE.sC('travelling_ruler'))]!"
 travel_events.2109.a_second_hurt.desc:0 "[second_potential_hurt_knight.GetShortUIName] foi ferido na batalha"
 travel_events.2109.a_third_hurt.desc:0 "[third_potential_hurt_knight.GetShortUIName] foi ferido na batalha"
 travel_events.2109.desc:0 "\n\n[travelling_ruler.GetTitledFirstName] nos observa atentamente enquanto limpamos os canalhas, e depois se mostra um pouco mais amigável, já que está claro que somos amigáveis."
 travel_events.2109.desc_intro:0 "Os bandidos não sabem o que os atingiu. Lidero nossos melhores guerreiros para a batalha fora de [holding_location.GetName] e cortamos o grupo como manteiga num dia quente de verão."
 travel_events.2109.desc_negative:0 "\n\nM[Select_CString( travelling_ruler.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('travelling_ruler'))] [travelling_ruler.GetTitledFirstName] fica pasmo, como se fosse atingido por um raio, observando nossa carga e defesa bem-sucedida do grupo [travelling_ruler.GetHerHim]."
 travel_events.2109.desc_outro:0 "que agora parece mais confortável com a nossa presença. \"[Select_CString( ROOT.Char.IsFemale, 'Minha amiga', 'Meu amigo' )], obrigado por nos ajudar em nosso momento de necessidade,\" [travelling_ruler.GetSheHe] diz, sorrindo para mim."
 travel_events.2109.desc_outro_negative:0 "que agora parece ter recuperado a compostura. [travelling_ruler.GetSheHe|U] acena amigavelmente na minha direção. \"Nada que não pudéssemos lidar, mas é bom não termos que nos esforçar demais,\" [travelling_ruler.GetSheHe] admite."
 travel_events.2109.desc_outro_positive:0 "que está se aproximando rapidamente de mim. \"M[Select_CString( province_liege.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('province_liege'))]! Quem dera pudéssemos ter nos reencontrado sob circunstâncias menos sombrias,\" [travelling_ruler.GetSheHe] exclama."
 travel_events.2109.desc_positive:0 "\n\n[travelling_ruler.GetTitledFirstName] e seu séquito nos aplaudem enquanto administrados o último contra-ataque bem-sucedido aos canalhas."
 travel_events.2109.desc_segway:0 "\n\nQuando os agressores finalmente fogem, faço um círculo de volta em direção [Select_CString( travelling_ruler.IsFemale, 'a', 'ao' )] [travelling_ruler.GetFirstNameNoTooltip], "
 travel_events.2109.t:0 "$travel_events.2108.t$"
 travel_events.2110.a:0 "Nós permanecemos como um."
 travel_events.2110.a_death:0 "Você é morto em batalha"
 travel_events.2110.a_injured.desc:0 "Você sobrevive à batalha, mas fica ferido"
 travel_events.2110.a_injured.tt:0 "Machucado"
 travel_events.2110.a_severely_injured.desc:0 "Você fica gravemente ferido na batalha"
 travel_events.2110.a_severely_injured.tt:0 "Gravemente Ferido"
 travel_events.2110.a_unscathed.desc:0 "Você sobrevive à batalha ileso"
 travel_events.2110.a_unscathed.tt:0 "Intacto"
 travel_events.2110.b:0 "[knight_to_sacrifice.GetFirstNameNoTooltip], você sabe o que fazer."
 travel_events.2110.b_tt:0 "[knight_to_sacrifice.GetShortUIName] fica para trás para distrair os atacantes"
 travel_events.2110.desc:0 "Atravessando o [holding_location.GetTerrain.GetNameNoTooltip|l] nos arredores de [holding_location.GetName], somos subitamente atacados por um bando de cavaleiros bandidos, sedentos de sangue. Estamos tão perto do povoado, com certeza [province_liege.GetTitledFirstName] enviará ajuda?\n\nÀ medida que o tempo se arrasta e somos perseguidos pelos canalhas, por um longo tempo evitando a batalha, torna-se dolorosamente claro que nenhuma ajuda está vindo."
 travel_events.2110.desc_negative:0 "Não tenho certeza do que esperava de um[Select_CString( travelling_ruler.IsFemale, 'a', '' )] [travelling_ruler.Custom2('InsultNoun', ROOT.Char)] como [province_liege.GetFirstNameNoTooltip]. Mas mesmo isso está abaixo [province_liege.GetHerHim]."
 travel_events.2110.desc_neutral:0 "Como um governante pode permitir que cavaleiros maliciosos como esses habitam as fronteiras [province_liege.GetHerHim]?"
 travel_events.2110.desc_outro:0 "\n\nMeu [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] [knight_to_sacrifice.GetTitledFirstName] se aproxima de mim, um olhar solene em seus olhos. Ambos sabemos a tática que praticamos no passado."
 travel_events.2110.desc_positive:0 "Sinto uma dor aguda no peito ao perceber a traição que acabou de ser cometida por [province_liege.GetTitledFirstNameNoTooltip]."
 travel_events.2110.t:0 "$travel_danger_prefix$ $travel_events_life_or_death.t$, Abandonado"
 travel_events.2111.a:0 "Táticas interessantes."
 travel_events.2111.a_compassionate:0 "O que eu fiz..."
 travel_events.2111.a_dead:0 "Isso era inevitável, afinal."
 travel_events.2111.a_sadist:0 "Divertido!"
 travel_events.2111.desc_died:0 "Enquanto o sol colore o céu de vermelho quando perece no horizonte, a batalha diante de mim colore o chão de vermelho. Observo ansiosamente, tentando discernir qual lado está em vantagem.\n\nMinha dúvida logo é esclarecida quando um cavaleiro particularmente grande e robusto ruge vitoriosamente, erguendo os braços para o céu. Uma mão segura uma lâmina, a outra... a cabeça de [travelling_ruler.GetTitledFirstName]."
 travel_events.2111.desc_negative_outro:0 "\n\nRespiro aliviado. Finalmente ess[Select_CString( travelling_ruler.IsFemale, 'a', 'e' )] [travelling_ruler.Custom2('InsultNoun', ROOT.Char)] não é mais um espinho em meu lado."
 travel_events.2111.desc_outro:0 "\n\nSinto-me surpreendentemente vazio, tendo acabado de testemunhar o assassinato de [travelling_ruler.GetTitledFirstNameNoTooltip]. Devo fazer algo sobre esses cavaleiros."
 travel_events.2111.desc_positive_outro:0 "\n\nPisco algumas vezes, sem compreender totalmente o que acabou de acontecer. Sim, suponho que este seja o fim para [travelling_ruler.GetSheHe]..."
 travel_events.2111.desc_sacrifice:0 "O sol está se pondo sobre o [holding_location.GetTerrain.GetNameNoTooltip|l] enquanto observo a cena diante de mim. Se eu estava esperando uma batalha em grande escala, eu estava errado.\n\nParece que [travelling_ruler.GetTitledFirstName] ordenou um isca e uma retirada, o que significa que um dos [travelling_ruler.Custom('KnightCulturePluralNoTooltipLowercase')] [travelling_ruler.GetHerHim] fica para trás para salvar o grupo. Enquanto isso, o grupo de viajantes se reorganiza e se dirige para o limite da cidade.\n\nParece estar funcionando, já que os cavaleiros ignoram o grupo que foge e se concentram no soldado solitário, cercando [knight_to_sacrifice.GetSheHe] completamente da minha visão. Espero que o fim tenha sido rápido."
 travel_events.2111.desc_survived:0 "Enquanto o sol se põe sobre o [holding_location.GetTerrain.GetNameNoTooltip|l], os dois grupos convergem numa massa de armas e dor. Observo enquanto o choque inicial do grupo de viajantes desaparece e eles se reerguem diligentemente, empurrando os cavaleiros armados.\n\n[travelling_ruler.GetTitledFirstName] lidera o contra-ataque, rápido e mortal, contra os canalhas sujos. Um dos canalhas parece acertar um golpe bastante severo [Select_CString( travelling_ruler.IsFemale, 'na', 'no' )] [travelling_ruler.GetFirstNameNoTooltip], porém, logo é retaliado por um dos [travelling_ruler.Custom('KnightCulturePluralNoTooltipLowercase')] [travelling_ruler.GetHerHim].\n\nOs cavaleiros que ainda estão respirando e capazes deixam a cena, tão rapidamente e repentinamente quanto apareceram. Em seu rastro, corpos e animais mortos; mas uma reunião surpreendentemente saudável de viajantes."
 travel_events.2111.desc_unscathed:0 "Enquanto o sol colore o céu de vermelho quando perece no horizonte, a batalha diante de mim colore o chão de vermelho. Parece, no entanto, que isso é vermelho apenas com o sangue dos bandidos.\n\nO grupo de viajantes está mostrando habilidade surpreendente diante do ataque repentino e está lutando com unhas e dentes — eventualmente forçando os canalhas a fugir. Eles simplesmente jogam suas armas e rapidamente recuam na direção de onde vieram.\n\n[travelling_ruler.GetTitledFirstName] faz um gesto desafiador na direção do meu povoado, e eu levanto as sobrancelhas em silenciosa surpresa. Isso foi #EMP muito#! inesperado."
 travel_events.2111.t:0 "$travel_danger_prefix$ $travel_events.2110.t$"
 travel_events.2300.a.flavor:0 "Que #EMP audácia!#!"
 travel_events.2300.a.tt:0 "Você persegue os ladrões!"
 travel_events.2300.a:0 "\"#EMP Atrás deles!#!\""
 travel_events.2300.b:0 "Tenho coisas melhores para fazer."
 travel_events.2300.desc:0 "Sou despertado do meu sono quando uma caixa cai no chão dentro da minha tenda.\n\nSons abafados vêm de fora: \"#EMP Ladrões! Eles estão fugindo!#!\"\n\nInstintivamente levo a mão aos meus emblemas, um gesto que geralmente me acalma. Até agora.\n\nO meu [stolen_badge.GetName]. #EMP Sumiu!#!"
 travel_events.2300.t:0 "Ladrões na Noite"
 travel_events.2301.a.diplomacy:0 "\"Você não quer fazer isso, amigo.\""
 travel_events.2301.a.dynasty_level:0 "\"Você sabe com quem está falando?\""
 travel_events.2301.a.intrigue:0 "\"#EMP GUARDAS!#!\""
 travel_events.2301.a.learning:0 "\"#EMP Várias#! pessoas me viram caminhando por aqui...\""
 travel_events.2301.a.martial:0 "\"Consigo ver sua jugular daqui.\""
 travel_events.2301.a.piety_level:0 "\"Eu te perdoo, meu filho.\""
 travel_events.2301.a.pilgrim:0 "$travel_events.2301.a.piety_level$"
 travel_events.2301.a.prestige_level:0 "\"Vamos, não seja tolo.\""
 travel_events.2301.a.stewardship:0 "\"Essa #EMP bugiganga#! não vale a pena ir para a prisão.\""
 travel_events.2301.b.failure:0 "[thief_character.GetShortUIName] escapa"
 travel_events.2301.b.success:0 "Você domina [thief_character.GetShortUIName]"
 travel_events.2301.b:0 "\"Entregue-os agora, e ninguém se sairá ferido.\""
 travel_events.2301.c:0 "\"Poderíamos aproveitar seu talento em minha corte!\""
 travel_events.2301.d:0 "\"Vou... eu... seguir meu caminho.\""
 travel_events.2301.desc.intro:0 "A perseguição me leva a uma caverna oculta; o esconderijo perfeito para um ladrão que espreita viajantes."
 travel_events.2301.desc.multiple:0 "\n\nO [thief_character.GetWomanMan] abre uma pequena bolsa, revelando uma coleção de insígnias,"
 travel_events.2301.desc.one:0 "\n\nO [thief_character.GetWomanMan] compara minha insígnia à de outro viajante infeliz,"
 travel_events.2301.desc.outro:0 "quando uma pedra barulhenta revela minha presença.\n\nTarde demais percebo que meus guardas ficaram para trás durante a perseguição, e o ladrão faz um gesto ameaçador em minha direção: \"Lá vem problema #EMP #!...\""
 travel_events.2301.desc:0 "\n\nO [thief_character.GetWomanMan] está empoleirado sobre o saque do meu acampamento,"
 travel_events.2301.t:0 "Ladrões: O Confronto"
 travel_events.2310.a:0 "\"Vou ficar com uma.\""
 travel_events.2310.b:0 "Não."
 travel_events.2310.desc:0 "Enquanto viajamos por [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], avisto uma barraca com pequenas lembranças não muito longe de um dos [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] locais sagrados.\n\nOlhando mais de perto, o comerciante de fato está vendendo insígnias de peregrinação para peregrinos em jornada para este lugar.\n\nQue melhor maneira de mostrar a própria dedicação a [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] do que retornar com uma insígnia tão cobiçada?"
 travel_events.2310.t:0 "Uma Insígnia de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 travel_events.haunted_manor.t:0 "Mansão 'Assombrada'"
 travel_events_life_or_death.t:0 "Vida ou Morte"
 travel_get_lost_tt:0 "Você se perde"
