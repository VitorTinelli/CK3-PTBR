l_spanish:
 faith_conversion_cost_mpo_islam_event:0 "[GetModifier('mpo_islam_conversion_modifier').GetNameWithTooltip]"
 mpo_islam_conversion_modifier:0 "Inquérito Islâmico"
 mpo_islam_conversion_modifier_desc:0 "Este personagem foi exposto aos ensinamentos do Islã e está considerando uma conversão.\n\nCusto para se converter a uma [faith|E] [GetReligionByKey('islam_religion').GetAdjective]: #p -25%#!"
 travel_events_mpo.0001.a:0 "Mãos ágeis é tudo que preciso."
 travel_events_mpo.0001.a_tt:0 "Você monta uma armadilha e espera o momento certo para capturar uma águia"
 travel_events_mpo.0001.b:0 "Temos alguns suprimentos sobrando para uma armadilha e isca..."
 travel_events_mpo.0001.b_tt:0 "Você monta uma armadilha e usa seus recursos para aumentar sua eficácia"
 travel_events_mpo.0001.c:0 "Um caçador pode cuidar disso."
 travel_events_mpo.0001.c_huntsmaster:0 "Confio essa tarefa a [huntsmaster.GetFirstNameNoTooltip]."
 travel_events_mpo.0001.c_not:0 "Você não tem um [GetCourtPositionType('master_of_hunt_court_position').GetName()] empregado ou ele não faz parte de sua [entourage|E]"
 travel_events_mpo.0001.c_noticer:0 "Por que você mesmo não faz isso, [huntsmaster.GetFirstNameNoTooltip]?"
 travel_events_mpo.0001.c_tt:0 "[huntsmaster.GetName] monta uma armadilha e [huntsmaster.GetSheHe] vai esperar em seu lugar"
 travel_events_mpo.0001.d:0 "Vou capturar uma, como [eagle_childhood_teacher.GetName] me ensinou."
 travel_events_mpo.0001.desc:0 "O ar ao nosso redor já não está mais silencioso. Ao olhar para cima, noto algumas grandes aves circulando acima, seus gritos ecoando pela estepe. [eagle_noticer.GetName] aponta que são águias douradas, uma visão rara por estas bandas.\n\n[eagle_noticer.GetSheHe|U] se entusiasma com suas habilidades de caça, dizendo que muitos as mantêm como companheiras para a vida toda. [eagle_noticer.GetSheHe|U] até sugere que deveríamos tentar capturar uma delas, pois poderia ser muito útil para nós no futuro."
 travel_events_mpo.0001.e:0 "Isso é interessante, mas não preciso de um pássaro."
 travel_events_mpo.0001.t:0 "$travel_event_prefix$ A Revoada Dourada"
 travel_events_mpo.0001_lose:0 "As águias são cautelosas demais para suas tentativas"
 travel_events_mpo.0001_win:0 "Você captura com sucesso uma águia dourada"
 travel_events_mpo.0010.a:0 "Eu poderia aproveitar parte de seu rebanho."
 travel_events_mpo.0010.a_flavor:0 "Você compra ovelhas de [camel_rider.GetName]"
 travel_events_mpo.0010.b:0 "Sua fé já é um presente por si só."
 travel_events_mpo.0010.b_flavor:0 "Com o que Allah poderia me abençoar?"
 travel_events_mpo.0010.b_islamic:0 "Bênçãos sobre você, meu amigo."
 travel_events_mpo.0010.c:0 "Tomarei o que preciso à força."
 travel_events_mpo.0010.c_tt:0 "Você tenta roubar os bens de [camel_rider.GetNamePossessive]"
 travel_events_mpo.0010.desc:0 "No horizonte, uma mancha branca se destaca contra o pano de fundo da estepe. À medida que me aproximo, distingo a figura de um camelo branco, seu pelo brilhando ao sol. Dezenas de ovelhas descem ao redor, seguindo de perto o camelo. Um[Select_CString( camel_rider.IsFemale, 'a', '' )] [camel_rider.GetWomanMan] de repente monta nele, e [Select_CString( camel_rider.IsFemale, 'a', 'o' )] cavaleir[Select_CString( camel_rider.IsFemale, 'a', 'o' )] me cumprimenta com um sorriso caloroso.\n\n\"A paz esteja contigo\", diz [camel_rider.GetSheHe]. \"Como pode ver, Allah me abençoou abundantemente, e sou capaz de compartilhar este dom com outros. Posso lhe oferecer algo?\""
 travel_events_mpo.0010.t:0 "$travel_event_prefix$ Sobre um Camelo Branco"
 travel_events_mpo.0010_lose:0 "[camel_rider.GetSheHe|U] o vence"
 travel_events_mpo.0010_win:0 "Você derrota [camel_rider.GetSheHe]"
