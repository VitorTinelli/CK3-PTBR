l_spanish:
 dehydrated_modifier:0 "Desidratado"
 dehydrated_modifier_desc:0 "Este personagem ficou desidratado após viajar pelo deserto."
 delayed_toast:0 "Você está atrasado"
 travel_danger_events.1000.a:0 "[travel_leader.GetSheHe|U] está certo. Seria sábio descansar."
 travel_danger_events.1000.b:0 "\"Não vou tolerar atrasos. Continuamos adiante!\""
 travel_danger_events.1000.desc:0 "A estrada tem se tornado incrivelmente montanhosa nas últimas horas e todos começam a se cansar. Sem um fim das colinas à vista, m[Select_CString( travel_leader.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('travel_leader'))] [travel_leader.GetFirstName] se aproxima de mim e diz:\n\n\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLadyLord], nossas montarias não aguentam continuar assim por muito mais tempo. Os pobres animais precisam de um descanso ou temo que irão desabar! Precisamos parar para descansar!\"\n\n[travel_leader.GetSheHe|U] sabe muito bem que isso atrasará nossa jornada até [destination.GetName]..."
 travel_danger_events.1000.t:0 "$travel_danger_prefix$ Tempestade em Copo d'Água"
 travel_danger_events.1001.a:0 "\"[travel_leader.GetFirstNameNoTooltip], vá até a cidade mais próxima e compre montes frescos.\""
 travel_danger_events.1001.b:0 "\"Prosseguimos a pé!\""
 travel_danger_events.1001.desc:0 "Eu continuo um pouco mais, determinado a chegar em [destination.GetName] de acordo com o plano. Ao chegarmos ao topo da maior colina até agora, penso que nossas dificuldades finalmente podem chegar ao fim, quando...\n\n#EMP THUD! ... THUD, THUD, THUD!#!\n\nEu viro para ver a fonte do barulho e gaspo ao ver todos os nossos montes caindo no chão! Parece que [travel_leader.GetFirstName] estava certo... essas pobres bestas só podem suportar tanta pressão. Deveria ter ouvido quando tive a chance."
 travel_danger_events.1001.t:0 "$travel_danger_events.1000.t$"
 travel_danger_events.1002.a.failure.desc:0 "Você paga os bandidos para permitir sua passagem"
 travel_danger_events.1002.a.failure:0 "Você não persuade os bandidos"
 travel_danger_events.1002.a.success.desc:0 "Você e seu séquito viajam livremente pelo desfiladeiro da montanha"
 travel_danger_events.1002.a.success:0 "Você persuade os bandidos"
 travel_danger_events.1002.a:0 "\"Vamos conversar sobre isso.\""
 travel_danger_events.1002.b.failure.desc:0 "$travel_danger_events.1002.a.failure.desc$"
 travel_danger_events.1002.b.failure:0 "Os bandidos te vencem"
 travel_danger_events.1002.b.success.desc:0 "$travel_danger_events.1002.a.success.desc$"
 travel_danger_events.1002.b.success:0 "Você vence os bandidos"
 travel_danger_events.1002.b:0 "\"Não vou ceder tão facilmente. #EMP À batalha!#!\""
 travel_danger_events.1002.c.tt:0 "Você envia seus guardas da [travel_option|E] para lidar com os bandidos"
 travel_danger_events.1002.c:0 "\"Guardas! Resolvam esses idiotas!\""
 travel_danger_events.1002.d:0 "\"E se eu te pagasse para nos guiar pelas montanhas?"
 travel_danger_events.1002.desc:0 "Enquanto viajamos por [current_location.GetName], aprecio a bela vista do lado da montanha. Quando desvio os olhos para focar novamente no caminho pedregoso à frente, percebo que fomos cercados por um grupo de malfeitores! Um(a) temível [bandit.GetWomanMan], presumivelmente o(a) líder deles, coloca-se à frente de nossa caravana.\n\n\"Passar por essas montanhas vai te custar. Não me importa quem você seja, qualquer um que passe pelas minhas montanhas paga.\""
 travel_danger_events.1002.e:0 "É a terra deles..."
 travel_danger_events.1002.t:0 "$travel_danger_prefix$ Encostas Traiçoeiras"
 travel_danger_events.1003.a:0 "Eu poderia enviar meu mestre de caravana, [travel_leader.GetFirstNameNoTooltip], para encontrar o retardatário."
 travel_danger_events.1003.b.failure:0 "Companheiro ausente perdido"
 travel_danger_events.1003.b.success.desc:0 "[missing_companion.GetShortUIName] retorna para o seu séquito."
 travel_danger_events.1003.b.success:0 "Companheiro ausente encontrado"
 travel_danger_events.1003.b:0 "Eles estão tão bons quanto mortos. Deixem-nos."
 travel_danger_events.1003.desc:0 "Eu sei que devemos pisar com cuidado pelos pântanos de [current_location.GetName]. Este lugar sombrio me perturba até o âmago e há uma miríade de perigos a serem guardados. Meu séquito recebeu instruções para tomar todas as precauções necessárias.\n\nOlhando para trás na cabeça da coluna, faço uma contagem dos meus companheiros...\n\n#EMP Um de nós está faltando!#!"
 travel_danger_events.1003.t:0 "$travel_danger_prefix$ Fundo Encharcado"
 travel_danger_events.1006.a.failure:0 "Você luta para encontrar o caminho certo"
 travel_danger_events.1006.a.success.desc:0 "Experiência de Perigo Adquirida"
 travel_danger_events.1006.a.success:0 "Você encontra o caminho certo"
 travel_danger_events.1006.a:0 "Eu sei #EMP exatamente#! onde estamos!"
 travel_danger_events.1006.b.hire_guide:0 "Você procura por um guia para contratar"
 travel_danger_events.1006.b:0 "Envie alguém para encontrar um guia local."
 travel_danger_events.1006.c.major_speed_decrease:0 "Sua viagem está significativamente atrasada"
 travel_danger_events.1006.c.minor_speed_decrease:0 "Sua viagem está ligeiramente atrasada"
 travel_danger_events.1006.c:0 "Envie batedores à frente."
 travel_danger_events.1006.desc:0 "\"Nós não vimos essa árvore massiva antes? Eu juro que estamos dando voltas!\" grita meu Mestre de Caravana, [travel_leader.GetName].\n\nTalvez [travel_leader.GetSheHe] esteja certo... não vemos sinal algum de sair desta floresta há horas. Nós ainda estamos #EMP em#! [current_location.GetName]? A densa cobertura de árvores torna impossível dizer a hora do dia ou até mesmo a direção para a qual estamos indo.\n\nNesse ritmo, nunca chegaremos a [destination.GetName]..."
 travel_danger_events.1006.t:0 "$travel_danger_prefix$ Árvores Familiares"
 travel_danger_events.1007.a.tt:0 "Seu plano de viagem será redirecionado para o oásis."
 travel_danger_events.1007.a:0 "Eu conheço um oásis próximo que pode ser a nossa salvação."
 travel_danger_events.1007.b.failure.desc:0 "[water_hider.GetFirstName] está severamente desidratado"
 travel_danger_events.1007.b.failure:0 "Falha em inspirar os companheiros"
 travel_danger_events.1007.b.success.desc:0 "[water_hider.GetFirstName] morre de sede"
 travel_danger_events.1007.b.success:0 "Companheiros inspirados"
 travel_danger_events.1007.b:0 "M[Select_CString( water_hider.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('water_hider'))] [water_hider.GetFirstNameNoTooltip] bebe como um #EMP cavalo#!, nada mais!"
 travel_danger_events.1007.c.failure:0 "Nenhuma água encontrada após a interrogatório"
 travel_danger_events.1007.c.success:0 "Água encontrada após a interrogatório"
 travel_danger_events.1007.c.tt:0 "Você interroga [water_hider.GetFirstName] sobre um suprimento secreto de água"
 travel_danger_events.1007.c:0 "Precisamos continuar."
 travel_danger_events.1007.d:0 "Ainda bem que trouxemos água extra!"
 travel_danger_events.1007.desc:0 "Nossa jornada até [destination.GetName] infelizmente nos trouxe diretamente pelos desertos de [current_location.GetName]. Não estávamos preparados para percorrer este trecho longo sem uma única fonte de água, e muitos dos meus companheiros começaram a parecer tão horríveis quanto [ROOT.Char.Custom('RegionalRootVegetablePlural')] secos.\n\nPreciso fazer algo... e rápido!"
 travel_danger_events.1007.t:0 "$travel_danger_prefix$ Nem Uma Gota"
 travel_danger_events.1008.a.tt:0 "[zombie.GetFirstNameNoTooltip] morto sob suas ordens"
 travel_danger_events.1008.a:0 "\"Guardas! Pare aquele(a) [zombie.GetWomanMan]!\""
 travel_danger_events.1008.b:0 "Tenho certeza de que [zombie.GetSheHe] não nos quer mal."
 travel_danger_events.1008.bad_intentions:0 "[zombie.GetFirstNameNoTooltip] tem intenções obscuras"
 travel_danger_events.1008.c:0 "\"#EMP Pare!#! Pegue isso e siga seu caminho.\""
 travel_danger_events.1008.desc:0 "Nossa jornada nos trouxe através de [current_location.GetName]. O que costumava ser uma linda [current_location_barony.Custom('BaronyTownType')] foi reduzido a um fantasma do que costumava ser.\n\nMontes de destroços que antes eram lares exalam fumaça, sufocados pela destruição causada por um exército implacável. Chorando e coberto de sujeira, um [zombie.GetWomanMan] procura o que poderia ter sido uma fazenda por algo restante de suas posses.\n\n[zombie.GetSheHe|U] nos nota, claramente fora de lugar neste deserto, e corre em direção ao nosso séquito!"
 travel_danger_events.1008.good_intentions:0 "[zombie.GetFirstNameNoTooltip] não tem más intenções"
 travel_danger_events.1008.t:0 "$travel_danger_prefix$ Consequências"
 travel_danger_events.1009.a:0 "\"Coitado de você...\""
 travel_danger_events.1009.b:0 "#EMP Mate [zombie.GetSheHe] de qualquer maneira!#!"
 travel_danger_events.1009.c:0 "\"Eu vou te proteger!\""
 travel_danger_events.1009.d:0 "Na verdade, não é meu problema, não é?"
 travel_danger_events.1009.desc:0 "O esquálido [zombie.GetWomanMan] rapidamente atravessa o espaço entre nós, sem prestar atenção nos dezenas de corpos que jazem no chão. [zombie.GetSheHe|U] abaixa a cabeça e me aborda:\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], minha casa foi reduzida a cinzas e minha subsistência arrancada de mim. Lanço-me à sua misericórdia. #EMP Por favor, me ajude!#!\""
 travel_danger_events.1009.t:0 "$travel_danger_events.1008.t$, Boas Intenções"
 travel_danger_events.1010.a.failure:0 "Ferido pelo coitado"
 travel_danger_events.1010.a.success:0 "Afastei o coitado"
 travel_danger_events.1010.a:0 "\"Eu posso lidar com isso!\""
 travel_danger_events.1010.b.failure:0 "Membro do séquito ferido"
 travel_danger_events.1010.b.success:0 "Coitado afastado"
 travel_danger_events.1010.b:0 "#EMP Guardas!#!"
 travel_danger_events.1010.desc:0 "O esquálido [zombie.GetWomanMan] rapidamente atravessa o espaço entre nós, sem prestar atenção nos dezenas de corpos que jazem no chão. [zombie.GetSheHe|U] se lança em minha direção, com uma boca rosnante e um furor selvagem nos olhos."
 travel_danger_events.1010.t:0 "$travel_danger_events.1008.t$, Más Intenções"
 travel_danger_events.1010.tt:0 "[zombie.GetFirstNameNoTooltip] se afasta rapidamente"
 travel_danger_events.1011.a.failure:0 "$travel_danger_events.1011.c.tt$"
 travel_danger_events.1011.a.success:0 "[frostbite_victim.GetTitledFirstNameNoTooltip] se sente mais quente"
 travel_danger_events.1011.a:0 "Vamos queimar o [to_be_burned.GetNameNoTooltip] para aquecer [frostbite_victim.GetSheHe]."
 travel_danger_events.1011.a_frostbite_treatment_burn_failure:0 "Talvez, queimar o [to_be_burned.GetNameNoTooltip] ajude desta vez?"
 travel_danger_events.1011.b.failure:0 "O tratamento do congelamento falha"
 travel_danger_events.1011.b.success:0 "O tratamento do congelamento é bem-sucedido"
 travel_danger_events.1011.b:0 "Li sobre um tratamento em um manuscrito uma vez."
 travel_danger_events.1011.b_frostbite_treatment_physician_failure:0 "Talvez [court_physician.GetNameNoTooltip] possa fazer um trabalho melhor desta vez?"
 travel_danger_events.1011.b_frostbite_treatment_root_failure:0 "Talvez eu tenha estragado da primeira vez, mas agora sei melhor!"
 travel_danger_events.1011.b_physician:0 "Certamente, [court_physician.GetTitledFirstNameNoTooltip] sabe como tratar isso!"
 travel_danger_events.1011.b_physician_failure:0 "$travel_danger_events.1011.a.failure$"
 travel_danger_events.1011.b_physician_knows_winter:0 "[court_physician.GetNameNoTooltip] conhece o inverno melhor do que qualquer um de nós!"
 travel_danger_events.1011.b_physician_success:0 "$travel_danger_events.1011.b.success$"
 travel_danger_events.1011.b_root_knows_winter:0 "Eu sou meio que um especialista em inverno."
 travel_danger_events.1011.c.failure:0 "O congelamento de [frostbite_victim.GetTitledFirstNamePossessiveNoTooltip] piora"
 travel_danger_events.1011.c.success:0 "[frostbite_victim.GetTitledFirstNameNoTooltip] suporta"
 travel_danger_events.1011.c.tt:0 "O congelamento de [frostbite_victim.GetTitledFirstNamePossessiveNoTooltip] permanece inalterado"
 travel_danger_events.1011.c.tt_mild:0 "[frostbite_victim.GetShortUIName] mantém o [GetModifier('travel_mild_frostbite_modifier').GetNameWithTooltip]"
 travel_danger_events.1011.c.tt_severe:0 "[frostbite_victim.GetTitledFirstNameNoTooltip] mantém o [GetModifier('travel_severe_frostbite_modifier').GetNameWithTooltip]"
 travel_danger_events.1011.c:0 "Devemos continuar nos movendo."
 travel_danger_events.1011.c_frostbite_treatment_none_failure:0 "Desta vez [frostbite_victim.GetSheHe] ficará bem, precisamos ir agora!"
 travel_danger_events.1011.c_frostbite_treatment_none_success:0 "[frostbite_victim.GetSheHe|U] suportou uma vez, [frostbite_victim.GetSheHe] suportará de novo!"
 travel_danger_events.1011.desc:0 "Tem nevado nos últimos dias e o frio é insuportável. Olho ao redor e vejo que meu séquito também está sofrendo com isso, então decido viajar a pé ao lado deles. Depois de caminharmos pela tempestade de neve por mais uma hora, [frostbite_victim.GetTitledFirstName] me puxa de lado e, tremendo, grita:\n\n\"Por favor, meu(a) [frostbite_victim.Custom2('RelationToMeShort', ROOT.Char)], não consigo mais sentir meu [frostbite_victim.Custom('GetFrostbittenBodyPart')]\""
 travel_danger_events.1011.desc_frostbite_thrice:0 "O inverno nos surpreende novamente com o tratamento severo. As estradas são sinuosas e escorregadias, a visibilidade é tão baixa quanto nossa moral. Tenho que verificar [frostbite_victim.GetTitledFirstName], já que [frostbite_victim.GetSheHe] sofreu congelamento duas vezes antes.\n\n\"Está tão frio, meu(a) [frostbite_victim.Custom2('RelationToMeShort', ROOT.Char)].\" [frostbite_victim.GetSheHe|U] sussurra para mim, enquanto [frostbite_victim.GetSheHe] desmaia, o frio atinge pobremente [frostbite_victim.GetNameNoTooltip] pela terceira vez e finalmente tira o último suspiro [frostbite_victim.GetHerHim]."
 travel_danger_events.1011.desc_frostbite_twice:0 "Mais uma vez, a viagem cobra um alto preço de nosso comboio. Tempestades de neve constantes e temperaturas extremamente baixas nos forçaram a montar um acampamento. Verifico [frostbite_victim.GetTitledFirstName], já que [frostbite_victim.GetSheHe] sofreu de congelamento uma vez antes e agora [frostbite_victim.GetSheHe] está deitado em uma cama improvisada.\n\n\"Não estou me sentindo bem, meu(a) [frostbite_victim.Custom2('RelationToMeShort', ROOT.Char)].\" Como eu esperava, o frio atingiu o pobre [frostbite_victim.GetNamePossessiveNoTooltip] [frostbite_victim.Custom('GetFrostbittenBodyPart')] novamente!"
 travel_danger_events.1011.desc_head:0 "$travel_danger_events.1011.desc$ Olho mais de perto o [frostbite_victim.Custom('GetFrostbittenBodyPart')], a ponta está coberta de gelo e um pouco inchada. Acho que isso pode piorar se eu não fizer nada!"
 travel_danger_events.1011.desc_head_thrice:0 "$travel_danger_events.1011.desc_frostbite_thrice$ O congelamento se espalhou para a outra [frostbite_victim.Custom('GetFrostbittenBodyPart')] e agora todo o rosto [frostbite_victim.GetHerHim] está profundamente azul e frio como gelo. Como isso é possível?"
 travel_danger_events.1011.desc_head_twice:0 "$travel_danger_events.1011.desc_frostbite_twice$ Desta vez, examino o [frostbite_victim.Custom('GetFrostbittenBodyPart')] [frostbite_victim.GetHerHim] e comparo com a orelha. Ele tem uma tonalidade de azul mais clara, no entanto, pode ser porque o congelamento no [frostbite_victim.Custom('GetFrostbittenBodyPart')] ainda está fresco."
 travel_danger_events.1011.desc_lower_limb:0 "$travel_danger_events.1011.desc$ Ordeno que [frostbite_victim.GetSheHe] tire a bota e dê uma olhada no [frostbite_victim.Custom('GetFrostbittenBodyPart')]. Ele já está todo azul escuro e neste ponto pode ser tarde demais para salvá-lo."
 travel_danger_events.1011.desc_lower_limb_thrice:0 "$travel_danger_events.1011.desc_frostbite_thrice$ Depois de perder a [frostbite_victim.Custom('GetFrostbittenBodyPart')] dos congelamentos anteriores, o frio foi direto para o abdômen e todo o corpo está lentamente ficando azul."
 travel_danger_events.1011.desc_lower_limb_twice:0 "$travel_danger_events.1011.desc_frostbite_twice$ Eu seguro a bota [frostbite_victim.GetHerHim] para ajudá-lo a tirá-la, lutamos por um tempo, mas eventualmente conseguimos revelar o [frostbite_victim.Custom('GetFrostbittenBodyPart')] inchado. [frostbite_victim.GetSheHe|U] perderá toda a perna em breve!"
 travel_danger_events.1011.desc_upper_limb:0 "$travel_danger_events.1011.desc$ [frostbite_victim.GetSheHe] tenta fazer um punho, mas a dor é muito forte. O [frostbite_victim.Custom('GetFrostbittenBodyPart')] [frostbite_victim.GetHerHim] está inchado e com todas as tonalidades de azul e preto."
 travel_danger_events.1011.desc_upper_limb_thrice:0 "$travel_danger_events.1011.desc_frostbite_thrice$ A [frostbite_victim.Custom('GetFrostbittenBodyPart')] perdida tornou mais fácil para o congelamento se espalhar mais pelo corpo superior, o peito e o pescoço [frostbite_victim.GetHerHim] estão ficando mais escuros a cada minuto."
 travel_danger_events.1011.desc_upper_limb_twice:0 "$travel_danger_events.1011.desc_frostbite_twice$ O velho congelamento dos dedos piorou ainda mais e agora se propagou para todo o [frostbite_victim.Custom('GetFrostbittenBodyPart')], neste ritmo [frostbite_victim.GetSheHe] perderá seu braço!"
 travel_danger_events.1011.t:0 "$travel_danger_prefix$ Mordido pelo Gelo"
 travel_danger_events.1011.t_thrice:0 "$travel_danger_prefix$ Congelamento Mortal"
 travel_danger_events.1011.t_twice:0 "$travel_danger_prefix$ Tormentos Congelantes"
 travel_danger_events.1012.a.tt:0 "Você pega a planta e a joga para longe"
 travel_danger_events.1012.a:0 "\"Espera, e se for venenosa?!\""
 travel_danger_events.1012.a_again:0 "\"Pare de colocar #EMP tudo#! na sua boca!\""
 travel_danger_events.1012.ate_delicious_plant:0 "Reaviva o corpo e a mente"
 travel_danger_events.1012.ate_poisonous_plant:0 "Causa uma dor de estômago dolorosa"
 travel_danger_events.1012.b:0 "Deixe [poisonous_plant_eater.GetFirstNameNoTooltip] comer."
 travel_danger_events.1012.c.tt:0 "Você pega a fruta e a come"
 travel_danger_events.1012.c:0 "\"Somente se eu puder experimentar primeiro!\""
 travel_danger_events.1012.desc:0 "Nossa jornada nos leva por partes traiçoeiras de [ROOT.Char.GetCurrentLocation.GetName]. Enquanto procuro por perigos à frente, um arbusto agitado chama minha atenção, poderia ser um animal selvagem? Enquanto me preparo para o impacto, [poisonous_plant_eater.GetFirstName] sai do arbusto, segurando uma planta.\n\n\"Você me assustou, [poisonous_plant_eater.GetFirstNameNoTooltip]! De qualquer forma, deixe-me ver o que você tem aqui, algum tipo de fruta?"
 travel_danger_events.1012.desc_again:0 "Mais uma vez, o caminho à frente é perigoso, então, por segurança, decidimos acampar durante a noite. Enquanto os outros montam o acampamento, eu vejo [poisonous_plant_eater.GetFirstName] pegando outra fruta desconhecida.\n\n\"Eu admiro sua curiosidade, [poisonous_plant_eater.GetFirstNameNoTooltip].\"\n\nEu sorrio, mas [poisonous_plant_eater.GetSheHe] me olha com um olhar travesso e, em seguida, explode:\n\n\"Desculpe, meu(a) [poisonous_plant_eater.Custom2('RelationToMe', ROOT.Char)], mas eu não consigo me controlar!\" enquanto [poisonous_plant_eater.GetSheHe] tenta morder a fruta."
 travel_danger_events.1012.desc_food_taster:0 "$travel_danger_events.1012.desc$ Devemos perguntar a [food_taster.GetFirstName] sobre isso.\"\n\n\"Devo dizer, é uma iguaria peculiar e nada sugere perigo imediato, no entanto...\" \"Então é seguro comer!\" [poisonous_plant_eater.GetFirstNameNoTooltip] interrompe rapidamente."
 travel_danger_events.1012.desc_unknown:0 "$travel_danger_events.1012.desc$\" Exclamo.\n\n\"Sim! Parece e cheira tão delicioso! Eu me pergunto como é o gosto? Talvez eu dê apenas uma pequena mordida?\" [poisonous_plant_eater.GetSheHe] diz."
 travel_danger_events.1012.regular_plant:0 "É apenas uma planta inofensiva afinal"
 travel_danger_events.1012.t:0 "$travel_danger_prefix$ Fruto Tentador"
 travel_danger_events.1012.touched_poisonous_plant:0 "Uma erupção cutânea aparece onde a planta tocou"
 travel_danger_events.1013.a:0 "Vamos montar uma equipe de busca por [runaway_character.GetSheHe]."
 travel_danger_events.1013.b:0 "Eu encontrarei [runaway_character.GetSheHe] sozinh[Select_CString( runaway_character.IsFemale, 'a', 'o' )]!"
 travel_danger_events.1013.c:0 "Não quero arriscar que mais pessoas se percam."
 travel_danger_events.1013.desc:0 "Ao conseguirmos atravessar um caminho perigoso em [ROOT.Char.GetCurrentLocation.GetName], de repente uma sensação estranha de que alguém está faltando me incomoda. Não lembro de ter visto [runaway_character.GetFirstName] o dia todo."
 travel_danger_events.1013.desc_child:0 "$travel_danger_events.1013.desc$ Isso é preocupante, [runaway_character.GetSheHe] ainda é apenas uma criança! E se [runaway_character.GetSheHe] estiver perdido em algum lugar na [ROOT.Char.GetCurrentLocation.Custom('TerrainTypeProvince')] ao longo do caminho? [runaway_character.GetSheHe|U] provavelmente está solitário e, mais importante, faminto!"
 travel_danger_events.1013.desc_knight:0 "$travel_danger_events.1013.desc$ Ele estava cuidando da retaguarda enquanto entrávamos em uma província devastada pela guerra. Suponho que essa não foi a melhor ideia, sabendo do destemor [runaway_character.GetHerHim], [runaway_character.GetSheHe] provavelmente já está rumando para a linha de frente! A menos que [runaway_character.GetSheHe] esteja apenas perdido em algum lugar na [ROOT.Char.GetCurrentLocation.Custom('TerrainTypeProvince')]?"
 travel_danger_events.1013.desc_lover:0 "$travel_danger_events.1013.desc$ Ao mesmo tempo, as pessoas estão repetindo um rumor de que [runaway_character.GetSheHe] queria se encontrar com [current_location_holder.GetTitledFirstName]. Eu sei que estamos passando pelas terras [current_location_holder.GetHerHim], mas não tenho certeza do porquê de [runaway_character.GetFirstNameNoTooltip] faria isso? Aposta que [runaway_character.GetSheHe] está apenas perdido em algum lugar na [ROOT.Char.GetCurrentLocation.Custom('TerrainTypeProvince')], enquanto falamos!"
 travel_danger_events.1013.desc_rival:0 "$travel_danger_events.1013.desc$ Não que eu esteja reclamando, não ter que ver o rosto do meu rival conta como um bom dia para mim. No entanto, isso pode assustar meus outros companheiros a não irem mais adiante na [ROOT.Char.GetCurrentLocation.Custom('TerrainTypeProvince')]."
 travel_danger_events.1013.failure:0 "[runaway_character.GetFirstNameNoTooltip] não pode ser encontrado"
 travel_danger_events.1013.failure_root:0 "Você vagueia pela [ROOT.Char.GetCurrentLocation.Custom('TerrainTypeProvince')] sem rumo"
 travel_danger_events.1013.runaway_joins:0 "[runaway_character.GetFirstNameNoTooltip] junta-se à sua corte"
 travel_danger_events.1013.runaway_return:0 "Retorna para a [entourage|E]"
 travel_danger_events.1013.success:0 "O grupo de busca encontra [runaway_character.GetFirstNameNoTooltip]"
 travel_danger_events.1013.success_root:0 "Você encontra [runaway_character.GetFirstNameNoTooltip]"
 travel_danger_events.1013.t:0 "$travel_danger_prefix$ Fugitivo ou Perdido?"
 travel_danger_events.1020.a.failure:0 "[ROOT.Char.Custom('WarhorseStoryName')] é arrastado para baixo"
 travel_danger_events.1020.a.success:0 "Você salva [ROOT.Char.Custom('WarhorseStoryName')]"
 travel_danger_events.1020.a:0 "\"Lute contra isso [ROOT.Char.Custom('WarhorseStoryName')]!\""
 travel_danger_events.1020.b.failure:0 "[horse_helper.GetFirstNameNoTooltip] e [ROOT.Char.Custom('WarhorseStoryName')] são arrastados para baixo"
 travel_danger_events.1020.b.success:0 "[horse_helper.GetFirstNameNoTooltip] salva [ROOT.Char.Custom('WarhorseStoryName')]"
 travel_danger_events.1020.b:0 "\"Não fiquem apenas olhando, façam #EMP alguma coisa!#!\""
 travel_danger_events.1020.c:0 "Não há nada que possamos fazer..."
 travel_danger_events.1020.desc.intro:0 "Estamos vagando há dias para alcançar nosso destino, a comitiva está cansada, e também está meu poderoso corcel, [ROOT.Char.Custom('WarhorseStoryName')]. Quando estou prestes a desmontar, algo assusta meu [ROOT.Char.Custom('HorseStoryMareStallion')], e [ROOT.Char.Custom('HorseStorySheHe')] dispara em uma direção aleatória. Tento me segurar com todas as minhas forças antes de ser arremessado ao chão com um estrondo.\n\nEnquanto me levanto lentamente da queda, [ROOT.Char.Custom('WarhorseStoryName')] começa a relinchar à distância, e toda a minha comitiva corre próximo a mim para descobrir o que está acontecendo.\n\nMeu cavalo está lutando por sua vida,#!"
 travel_danger_events.1020.floodplains:0 "pisoteando contra a correnteza em vão."
 travel_danger_events.1020.jungle:0 "a areia escorrendo pelos lados de [ROOT.Char.Custom('HorseStoryHerHis')], afundando lenta e continuamente em uma areia movediça."
 travel_danger_events.1020.t.floodplains:0 "Medo"
 travel_danger_events.1020.t.jungle:0 "Perigo"
 travel_danger_events.1020.t.taiga:0 "Terror"
 travel_danger_events.1020.t.wetlands:0 "Aflição"
 travel_danger_events.1020.t:0 "[ROOT.Char.GetCurrentLocation.Custom('TerrainTypeProvince')|U] de"
 travel_danger_events.1020.taiga:0 "tentando encontrar uma saída de um atoleiro — um esforço inútil."
 travel_danger_events.1020.wetlands:0 "o pântano consumindo [ROOT.Char.Custom('HorseStorySheHe')] aos poucos."
 travel_danger_prefix:0 "Perigo:"
 travel_hired_foreign_guide:0 "Guia Estrangeiro Contratado"
