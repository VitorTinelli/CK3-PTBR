l_spanish:
 every_victim_relation_tt:0 "Todo familiar de [snake_victim.GetName]:"
 travel_danger_events.7000.a_1:0 "Esperaremos pela melhora [snake_victim.GetHerHim]."
 travel_danger_events.7000.a_2:0 "Com sorte, com o tempo, [snake_victim.GetSheHe] irá se recuperar."
 travel_danger_events.7000.a_3:0 "É melhor deixar o corpo [snake_victim.GetHerHim] descansar."
 travel_danger_events.7000.a_dont_recover:0 "[snake_victim.GetSheHe|U] continua na mesma"
 travel_danger_events.7000.a_dont_recover_die:0 "[snake_victim.GetSheHe|U] sucumbe ao veneno"
 travel_danger_events.7000.a_recover:0 "[snake_victim.GetSheHe|U] se recupera do veneno"
 travel_danger_events.7000.b:0 "Talvez o veneno possa ser tratado..."
 travel_danger_events.7000.b_flavor:0 "Você tenta tratar o veneno por conta própria"
 travel_danger_events.7000.c:0 "Ah, talvez alguém em [current_location.GetNameNoTooltip] possa ajudar."
 travel_danger_events.7000.c_known:0 "[current_location.GetTitle.GetHolder.GetNameNoTooltip] reside aqui, [current_location.GetTitle.GetHolder.GetSheHe] pode ajudar."
 travel_danger_events.7000.c_known_tt:0 "Você usa sua relação com [current_location.GetTitle.GetHolder.GetName] para encontrar um bom curandeiro local."
 travel_danger_events.7000.c_tt:0 "Você paga alguém do local para tentar tratar o veneno"
 travel_danger_events.7000.d:0 "[treatment_giver.GetNameNoTooltip] é bem inteligente, talvez [treatment_giver.GetSheHe] possa ajudar."
 travel_danger_events.7000.d_physician:0 "[treatment_giver.GetNameNoTooltip] é um curandeiro habilidoso."
 travel_danger_events.7000.d_tt:0 "[treatment_giver.GetName] tenta tratar o veneno"
 travel_danger_events.7000.d_tt_phys:0 "[treatment_giver.GetName] cura [snake_victim.GetFirstName]"
 travel_danger_events.7000.desc:0 "\n\n[snake_victim.GetSheHe|U] foi mordido por [current_location.Custom('GetRandomRegionalPoisonousSnake')]! Eventualmente a serpente solta as presas da carne [snake_victim.GetHerHim], mas está claro que o veneno está fazendo efeito."
 travel_danger_events.7000.desc_desert:0 "Alguns caminham pelas dunas, enquanto outros descansam na sombra da caravana. O sol está no auge, e o calor é opressivo. Observo [snake_victim.GetTitledFirstName] caminhando lentamente pela areia, até que de repente [snake_victim.GetSheHe] cai de joelhos, agarrando a perna."
 travel_danger_events.7000.desc_floodplains:0 "Alguns saem para buscar água próxima, enquanto outros ficam de guarda observando a caravana e procurando terrenos secos. [snake_victim.GetName] mergulha seu cantil na água, mas logo o puxa de volta com um grito."
 travel_danger_events.7000.desc_hills:0 "Vários se reúnem ao redor da fogueira, aquecendo-se e compartilhando histórias. [snake_victim.GetName] está mais afastado, talvez procurando caça. [snake_victim.GetSheHe] alcança a grama, mas solta um grito logo em seguida."
 travel_danger_events.7000.desc_intro:0 "Enquanto seguimos em direção a [destination.GetName], paramos por um instante para descansar."
 travel_danger_events.7000.desc_mountains:0 "Muitos saem em busca de comida ou água, enquanto outros descansam à sombra das árvores. Observo [snake_victim.GetName] vasculhar o mato, até que de repente [snake_victim.GetSheHe] salta para trás com um grito."
 travel_danger_events.7000.desc_oasis:0 "A maioria está reunida ao redor do oásis, bebendo da água fresca e lavando a poeira do rosto. [snake_victim.GetName] mergulha a mão na água, e subitamente [snake_victim.GetSheHe] a puxa de volta com um grito."
 travel_danger_events.7000.desc_recent:0 "Embora a situação seja grave, [snake_victim.GetSheHe] não é estranho a esse tipo de perigo..."
 travel_danger_events.7000.e:0 "Deixe [snake_victim.GetFirstNameNoTooltip] comer uma porção extra no jantar de hoje."
 travel_danger_events.7000.e_flavor:0 "Ofereça comida a [snake_victim.GetSheHe], assim [snake_victim.GetSheHe] terá mais chances de se recuperar."
 travel_danger_events.7000.f:0 "Não quero ver [snake_victim.GetSheHe] sofrer."
 travel_danger_events.7000.f_sea:0 "Deixe a maré levar [snake_victim.GetSheHe]!"
 travel_danger_events.7000.g:0 "Já chega, vamos seguir em frente."
 travel_danger_events.7000.t:0 "$travel_danger_prefix$ Serpente!"
 travel_danger_events.7000.treatment_bad:0 "O veneno não reage ao tratamento"
 travel_danger_events.7000.treatment_good:0 "O remédio é eficaz"
