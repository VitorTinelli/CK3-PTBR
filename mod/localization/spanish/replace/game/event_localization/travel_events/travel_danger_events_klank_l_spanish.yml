l_spanish:
 travel_danger_events.3000.a.first_time:0 "Cuidado onde pisa! Devemos continuar avançando."
 travel_danger_events.3000.a.second_time:0 "Ah, [fallen_victim.GetFirstNameNoTooltip]! Eu #EMP disse#! para você prestar atenção onde pisa!"
 travel_danger_events.3000.a.tt:0 "O terreno traiçoeiro fez mais uma vítima, certamente não a primeira, com certeza não a última."
 travel_danger_events.3000.b.found_cloth:0 "Apenas um pano rasgado e ensanguentado foi encontrado."
 travel_danger_events.3000.b.found_fallen_victim:0 "Contra todas as probabilidades, [fallen_victim.GetFirstNameNoTooltip] foi encontrad[Select_CString( fallen_victim.IsFemale, 'a', 'o' )] viv[Select_CString( fallen_victim.IsFemale, 'a', 'o' )]."
 travel_danger_events.3000.b.found_nothing:0 "[fallen_victim.GetFirstNameNoTooltip] não foi encontrad[Select_CString( fallen_victim.IsFemale, 'a', 'o' )]."
 travel_danger_events.3000.b.tt:0 "Você e seu séquito tentam um resgate na montanha. #EMP #X Isto é muito perigoso.#! #!Muitos perecerão."
 travel_danger_events.3000.b:0 "[fallen_victim.GetFirstNameNoTooltip]! [fallen_victim.GetFirstNameNoTooltip]! Vamos salvá-l[Select_CString( fallen_victim.IsFemale, 'a', 'o' )]!"
 travel_danger_events.3000.c.first_time:0 "[fallen_victim.GetSheHe|U] estará em nossas preces."
 travel_danger_events.3000.c.second_time:0 "Querido [ROOT.Char.GetFaith.HighGodName], livra-nos do perigo!"
 travel_danger_events.3000.d.first_time:0 "Não poderia ter feito isso melhor sozinho!"
 travel_danger_events.3000.d.second_time:0 "É ainda mais engraçado na segunda vez!"
 travel_danger_events.3000.desc.first_time:0 "Um pé após o outro, eu me movo lentamente por um estreito caminho de montanha. De repente, ouço um estrondo e um grito rapidamente silenciado.\n\nChocado com a comoção, me viro rapidamente. Em vez de [fallen_victim.GetFirstName] caminhando atrás de mim, há apenas um rosto igualmente confuso e cansado de [char_next_in_line.GetFirstName] de pé diante de pedras recém-viradas.\n\n\"Onde está [fallen_victim.GetFirstNameNoTooltip]?\" exijo saber, minha voz mal escapando de minha boca seca.\n\nA única resposta é um leve assobio do vento."
 travel_danger_events.3000.desc.second_time:0 "Continuo caminhando pelo caminho de montanha aparentemente interminável e estreito. Sinto o véu do cansaço nublando minha mente. Ouço sussurros enganosos de memórias meio esquecidas e um vento assobiando levemente.\n\nMas há algo muito real no grito penetrante de [fallen_victim.GetFirstName]. Com calafrios subindo pela minha espinha, viro-me lentamente, e mais uma vez, vejo um intervalo do tamanho de um humano em nossa ordem de marcha.\n\n\"Será que... Nós... Acabamos de... Perder outra pessoa?\" murmuro lentamente. [char_next_in_line.GetFirstName] não precisa falar. Seu rosto congelado de terror é resposta suficiente."
 travel_danger_events.3000.t:0 "$travel_danger_prefix$ Em Um Caminho de Montanha"
 travel_danger_events.3001.a.alternate:0 "[travel_leader.GetCulture.GetCollectiveNoun] sabem como sobreviver nas montanhas."
 travel_danger_events.3001.a.flavor.alternate:0 "Meu $travel_leader_court_position$ [travel_leader.GetFirstName] tomou as precauções necessárias contra quaisquer perigos da montanha, graças à sua herança [travel_leader.GetCulture.GetName]."
 travel_danger_events.3001.a.flavor:0 "Isso não é nada comparado à avalanche própria dos [ROOT.Char.GetCulture.GetName]!"
 travel_danger_events.3001.a:0 "[ROOT.Char.GetCulture.GetCollectiveNoun] sabem como sobreviver nas montanhas."
 travel_danger_events.3001.b.failure:0 "Resgate difícil de avalanche"
 travel_danger_events.3001.b.flavor:0 "Com pessoas enterradas sob a neve, a velocidade é primordial!"
 travel_danger_events.3001.b.success:0 "Resgate rápido de avalanche"
 travel_danger_events.3001.b:0 "Aguente firme, a ajuda está chegando!"
 travel_danger_events.3001.c:0 "Vou ficar aqui dentro... por um tempo."
 travel_danger_events.3001.desc:0 "Depois de uma jornada longa e árdua entre os picos montanhosos nevados, eu me aqueço lentamente ao lado da fogueira rugindo na pousada local enquanto [first_avalanche_victim.GetFirstName] e [second_avalanche_victim.GetFirstName] cuidam de nossa caravana do lado de fora. De repente, há um estrondo distante, porém poderoso, profundo e reverberante.\n\n\"Avalanche!\" alguém grita. Antes que alguém lá dentro tenha a chance de reagir, o som fica mais alto e mais alto até crescer com uma grande força sacudindo as paredes e o chão. Depois de um batimento cardíaco ou uma eternidade, há um silêncio ainda mais terrível."
 travel_danger_events.3001.t:0 "$travel_danger_prefix$ Avalanche!"
 travel_danger_events.3002.a.default:0 "Que terrível!"
 travel_danger_events.3002.a.special:0 "Eu sei! Eu estava #EMP lá!#"
 travel_danger_events.3002.b:0 "Isso deverá ajudá-los a se recuperar."
 travel_danger_events.3002.desc:0 "Lamento informar, meu senhor, que uma avalanche terrível recentemente ocorreu em [avalanche_location.GetName].\n\nEla levou muitas almas e perturbou a vida daqueles que sobreviveram, incluindo viajantes que estavam de passagem."
 travel_danger_events.3002.opening:0 "[ROOT.Char.GetTitledFirstName],"
 travel_danger_events.3003.a.failure:0 "Meu séquito ainda está preso na neve"
 travel_danger_events.3003.a.success:0 "Meu séquito começa a se mover rapidamente novamente!"
 travel_danger_events.3003.a:0 "Ajudar os outros é sua própria recompensa!"
 travel_danger_events.3003.b:0 "É um preço justo."
 travel_danger_events.3003.c.complete_success:0 "Meu séquito começa a se mover rapidamente novamente!"
 travel_danger_events.3003.c.failure:0 "Meu séquito está preso na neve"
 travel_danger_events.3003.c.flavor:0 "Nossa experiência com inverno nos ajudará a começar a nos mover novamente... se tivermos uma."
 travel_danger_events.3003.c.partial_success:0 "Meu séquito começa a se mover lentamente novamente"
 travel_danger_events.3003.c:0 "Nós vamos nos virar sozinhos."
 travel_danger_events.3003.desc:0 "Tem nevado por dias. A estrada à frente parece completamente intransitável. No entanto, enquanto olho adiante, vejo um pequeno grupo de pessoas se aproximando rapidamente de nós através das acumulações de neve. Logo, um[Select_CString( maron_leader.IsFemale, 'a', '' )] [maron_leader.GetWomanMan] fica diante de mim e fala com um amplo sorriso:\n\n\"Parece que vocês estão em um grande apuro. Mas não temam, por um preço justo, ajudaremos vocês a retomar suas viagens.\""
 travel_danger_events.3003.t:0 "$travel_danger_prefix$ Presos na Neve"
 travel_danger_events.3004.a.failure:0 "Nós à deriva lentamente com o vento"
 travel_danger_events.3004.a.success:0 "Nosso navio navega novamente!"
 travel_danger_events.3004.a:0 "Precisamos erguer velas improvisadas de alguma forma!"
 travel_danger_events.3004.b.flavor:0 "Devido à experiência marítima do meu séquito, estávamos preparados para isso. Uma nova estrutura de velas é rapidamente erguida a partir das velas e vigas de madeira armazenadas."
 travel_danger_events.3004.b:0 "Não tenham medo! Temos mais velas."
 travel_danger_events.3004.c.failure:0 "Por dias, nenhum outro navio é avistado"
 travel_danger_events.3004.c.success:0 "Um navio que passa oferece ajuda"
 travel_danger_events.3004.c:0 "Alguém #EMP vai#! nos encontrar... Espero"
 travel_danger_events.3004.desc:0 "\"Rajada Branca! Vire à boreste!\"\n\nO grito horrível do timoneiro não combina com o tempo calmo. Mas meus ouvidos estão cheios de um rugido cada vez mais alto do vento. Em menos de um piscar de olhos, a névoa branca e úmida envolve todo o navio. Mais alto que o vento, o mastro principal racha e cai no mar.\n\nE tão repentina quanto chegou, a rajada segue adiante. Nosso barco balança preguiçosamente no mar calmo, arrastando as velas rasgadas e os remos quebrados."
 travel_danger_events.3004.t:0 "$travel_danger_prefix$ Rajada Branca"
 travel_danger_events.3005.a.failure:0 "O fogo nos alcança enquanto corremos!"
 travel_danger_events.3005.a.success:0 "Corremos para longe do fogo"
 travel_danger_events.3005.a:0 "CORRAM!"
 travel_danger_events.3005.b.c_failure:0 "O fogo envolve meu séquito!"
 travel_danger_events.3005.b.failure:0 "O fogo é detido, mas a um custo"
 travel_danger_events.3005.b.success:0 "Você consegue extinguir o fogo com sucesso"
 travel_danger_events.3005.b:0 "Apague o fogo antes que ele se espalhe muito!"
 travel_danger_events.3005.desc:0 "Estamos caminhando entre as colinas tarde da noite. A escuridão chega repentinamente, trazida pelas nuvens escuras sobre nós. Em seguida, há um estrondo distante e alto de trovão. Logo depois, outro, combinado com um deslumbrante clarão de relâmpago.\n\nE mais um raio, iluminando intensamente a área, a imagem posterior queimada em meus olhos. Pisco e vejo onde o raio atingiu: agora, há um incêndio em arbustos que se espalha rapidamente. E está se aproximando de nós!"
 travel_danger_events.3005.t:0 "$travel_danger_prefix$ Um Fogo na Noite"
