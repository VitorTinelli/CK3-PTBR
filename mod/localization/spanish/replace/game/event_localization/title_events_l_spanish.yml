l_spanish:
 title_event.0012.a:0 "Como deve ser."
 title_event.0012.desc:0 "Com a criação de [castille.GetName], e o trono do antigo [asturias.GetBaseNameNoTier] vago, o Reino de Pelagius finalmente ficou pequeno demais. Seu remanescente será conhecido para sempre como [leon.GetBaseNameNoTier], pelo menos até que isso também seja ofuscado pelo surgimento de [castille.GetBaseNameNoTierNoTooltip]."
 title_event.0012.t:0 "Dividindo a Coroa"
 title_event.0013.a:0 "Dois tronos valem mais que um!"
 title_event.0013.desc:0 "Agora que possuo os tronos de [asturias.GetBaseNameNoTier] e de um [castille.GetBaseNameNoTier] distinto, a ideia de uma [asturias.GetNameNoTooltip] unificada é considerada confusa e redundante por muitos.\n\nEm vez disso, nobres e plebeus começaram a se referir à metade ocidental de minhas terras fazendo alusão à porção dominante do interior, [leon.GetBaseNameNoTier]."
 title_event.0013.t:0 "$title_event.0012.t$"
 title_event.0014.a:0 "Separatistas!"
 title_event.0014.b:0 "Recuperaremos essas terras um dia..."
 title_event.0014.c:0 "Viva! Um #EMP reino#! inteiro de camaradas!"
 title_event.0014.desc:0 "A recente formação de um [castille.GetBaseName] independente, governado por [castille_char.Custom2('MyCharacterIntroduction' leon_char)], arruinou a reivindicação de meu reino ser [asturias.GetBaseName].\n\nCom nossas terras do leste perdidas para sempre, somos dominados pela área do interior de [leon.GetBaseNameNoTier], e pessoas de todas as classes e seitas estão deixando o antigo título de lado."
 title_event.0014.t:0 "$title_event.0012.t$"
 title_event.0015.a:0 "O poder está de volta onde sempre deveria ter estado."
 title_event.0015.b:0 "Hoje, Castela. Amanhã, #EMP Leão#!."
 title_event.0015.c:0 "Podemos estar divididos no governo, mas estamos unidos pelo sangue!"
 title_event.0015.desc:0 "Com a recente criação de [castille.GetBaseName], [leon_char.Custom2('MyCharacterIntroduction', castille_char)] não pode mais ser considerado como verdadeiramente governando um [asturias.GetBaseNameNoTier] unificado.\n\nSem a força equilibradora de minhas terras a leste, o antigo [asturias.GetBaseNameNoTierNoTooltip] é realmente pouco mais que um [leon.GetBaseName]. Camponeses, clero e até mesmo nobres começaram a se referir a ele assim, para minha decepção."
 title_event.0015.t:0 "$title_event.0012.t$"
 title_event_francia_name_change.a:0 "Uma nova era começa!"
 title_event_francia_name_change.a_tt_1:0 "[francia_title.GetName] muda de nome para #high $k_france$#!"
 title_event_francia_name_change.a_tt_2:0 "[francia_title.GetName] muda de nome para #high $k_germany$#!"
 title_event_francia_name_change.desc:0 "O reinado da dinastia Karling chegou ao fim!\n\nA [francia_title.GetName] finalmente escapou de suas mãos. Com os Karlings removidos, estas terras não fazem mais parte do antigo império deles.\n\nComigo como [Select_CString( ROOT.Char.IsFemale, 'a futura', 'o futuro' )] [ROOT.Char.GetTitleAsNameNoTooltip], temos um novo e brilhante destino à nossa frente. Portanto, é apropriado remover #EMP qualquer e todos#! os lembretes de sua influência. Incluindo o próprio #EMP nome#!!"
 title_event_francia_name_change.title:0 "Fim de uma Era"
