l_spanish:
 designated_human_sacrifice_modifier:0 "Sacrifício Humano Designado"
 designated_human_sacrifice_modifier_desc:0 "Este personagem foi marcado divinamente para o sacrifício humano. Pelo menos, de acordo com seu captor."
 designated_sacrifice_died.desc:0 "[dead_designated_sacrifice.GetShortUIName|U] morreu antes que eu pudesse sacrificar [dead_designated_sacrifice.GetSheHe] para [ROOT.Char.GetFaith.HighGodName]. Meus [ROOT.Char.GetFaith.AltPriestTermPlural] e o povo estão insatisfeitos."
 designated_sacrifice_died.t:0 "Sacrifício Designado Morreu"
 designated_sacrifice_release.t:0 "Sacrifício Designado Liberado"
 designated_sacrifice_released.desc:0 "[released_designated_sacrifice.GetShortUIName|U] foi libertado em vez de ser sacrificado para [ROOT.Char.GetFaith.HighGodName]. Meus [ROOT.Char.GetFaith.AltPriestTermPlural] e o povo estão insatisfeitos."
 flowery_war_cb_ended_invalid.desc_no_sacrificers:0 "A [war.GetName] terminou: nenhum dos principais participantes pratica abertamente o sacrifício humano."
 flowery_war_cb_ended_invalid.desc_other_sacrifices_attacker:0 "A [war.GetName] terminou: adquiri sacrifícios em outro lugar."
 flowery_war_cb_ended_invalid.desc_other_sacrifices_defender:0 "A [war.GetName] terminou: [attacker.GetShortUIName] adquiriu sacrifícios adequados em outro lugar."
 flowery_war_cb_ended_invalid.t:0 "Guerra Invalidada"
 human_sacrifice.0001.a:0 "Espere, certamente um sacrifício tardio será suficiente?"
 human_sacrifice.0001.b:0 "Suporto seu desprezo com estoicismo."
 human_sacrifice.0001.c:0 "Essa barbaridade não me convém."
 human_sacrifice.0001.desc:0 "Já se passaram vários anos desde que conduzi uma guerra pomposa em nome de [ROOT.Char.GetFaith.HighGodName], mas ainda não sacrifiquei todos os prisioneiros de alto perfil capturados no fim do conflito. Meus [ROOT.Char.GetFaith.AltPriestTermPlural] estão impacientes, e as pessoas comuns sussurram que [ROOT.Char.GetFaith.WarGodName] desviou seu olhar de mim."
 human_sacrifice.0001.t:0 "Deuses Sedentos"
 human_sacrifice_coward_modifier:0 "Deuses Sedentos Ofendidos"
 human_sacrifice_coward_modifier_desc:0 "Este personagem é conhecido por se curvar e dar desculpas diante do divino."
