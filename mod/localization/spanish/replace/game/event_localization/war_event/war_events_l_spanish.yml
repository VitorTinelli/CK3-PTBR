l_spanish:
 war_event.1001.a:0 "Mas e a minha guerra!? Maldito seja você!"
 war_event.1001.desc:0 "É estranho como uma situação pode mudar rapidamente durante uma guerra.\n\nNo meio do combate contra [recipient.Custom2('MyCharacterIntroduction', ROOT.Char)], chega uma mensagem de [liege_invalidator.Custom2('MyCharacterIntroduction', ROOT.Char)]. [liege_invalidator.GetSheHe|U] está me dizendo para abandonar minha própria causa e me unir a [liege_invalidator.GetSheHe] na guerra contra [Select_CString( recipient.IsFemale, 'a', 'o' )] [recipient.GetTitledFirstName]."
 war_event.1001.t:0 "Meu Senhor Feudal Declara Guerra"
 war_event.1901:0 "Seu [liege|E], [attacker_winner.GetUIName], venceu sua [war|E] contra [defender_loser.GetUIName]!"
 war_event.1902:0 "Seu [liege|E], [defender_loser.GetUIName], perdeu sua [war|E] contra [attacker_winner.GetUIName]!"
 war_event.1903:0 "Seu [liege|E], [attacker_white_peace.GetUIName], assinou uma [white_peace|E] com [defender_white_peace.GetUIName]!"
 war_event.1904:0 "Seu [liege|E], [defender_white_peace.GetUIName], assinou uma [white_peace|E] com [attacker_white_peace.GetUIName]!"
 war_event.1905:0 "Seu [liege|E], [attacker_loser.GetUIName], perdeu sua guerra contra [defender_winner.GetUIName]!"
 war_event.1906:0 "Seu [liege|E], [defender_winner.GetUIName], venceu sua guerra contra [attacker_loser.GetUIName]!"
 war_event.2001.a.tt:0 "A guerra continua"
 war_event.2001.a:0 "Meu objetivo continua o mesmo."
 war_event.2001.b:0 "Este não é mais o melhor curso de ação."
 war_event.2001.c.tt:0 "Solicite uma grande soma de ouro d[Select_CString( defender.IsFemale, 'a', 'o' )] [defender.GetTitledFirstName] em troca de encerrar a guerra"
 war_event.2001.c:0 "Talvez possamos fazer um acordo?"
 war_event.2001.desc:0 "Nada neste mundo é certo, especialmente em tempos de guerra. A [war.GetName] não tem sido diferente.\n\nComo esse conflito não é mais contra [previous_defender.Custom2('MyCharacterIntroduction', ROOT.Char)], mas sim contra [defender.Custom2('MyCharacterIntroduction', ROOT.Char)], pode ser prudente reavaliar a situação."
 war_event.2001.t:0 "Um Novo Oponente"
 war_event.2002.a:0 "Uma escolha sábia."
 war_event.2002.desc:0 "Infelizmente, nos encontramos em lados opostos neste conflito. Nunca foi minha intenção, e por isso retirarei minhas tropas."
 war_event.2002.t:0 "[invalidator.Custom2('AppropriateGreeting', ROOT.Char)]"
 war_event.2003.a:0 "Assim seja."
 war_event.2003.desc:0 "Uma vez que [liege_invalidator.Custom2('MyCharacterIntroduction', invalidator)] agora está em guerra contra você, minhas forças se juntarão à sua causa."
 war_event.2004.a:0 "Um bom acordo."
 war_event.2004.b:0 "Nunca!"
 war_event.2004.desc:0 "Dado que agora estamos em conflito, talvez possamos chegar a um acordo para resolver isso pacificamente?\n\nRetirarei minhas tropas, dado o valor correto em ouro..."
 war_event.2004.t:0 "[harald.Custom2('AppropriateGreeting', ROOT.Char)]"
 war_event.2005.a:0 "Excelente!"
 war_event.2005.desc:0 "Sua sabedoria o precede. Temos um acordo."
 war_event.2005.t:0 "[william.Custom2('AppropriateGreeting', ROOT.Char)]"
 war_event.2006.a:0 "Então será guerra."
 war_event.2006.desc:0 "Receio que devo rejeitar sua oferta. Nos encontraremos no campo de batalha."
 war_event.2006.t:0 "[william.Custom2('AppropriateGreeting', ROOT.Char)]"
 war_event.3001.a.tt:0 "Se eu não obtiver nenhuma [war_contribution|E] dentro de 12 meses, perderei um [prestige_level|E] e colocarei em risco minha aliança com [Select_CString( war_owner.IsFemale, 'a', 'o' )] [war_owner.GetTitledFirstNameNoTooltip]!"
 war_event.3001.a:0 "Enviarei imediatamente minhas tropas para ajudar você!"
 war_event.3001.b.tt:0 "Não serei mais obrigado a enviar soldados para lutar na [war.GetName]."
 war_event.3001.b:0 "Este baú de ouro deve compensar minha ausência..."
 war_event.3001.c:0 "Peço desculpas, não deveria ter afirmado que ajudaria."
 war_event.3001.desc:0 "Há dois anos, você prometeu me ajudar na [war.GetName], mas até agora não fez nada para me apoiar nesse empreendimento.\n\nQual é o sentido de nossa aliança se você nem ao menos levanta um dedo para me ajudar?"
 war_event.3001.t:0 "[war_owner.Custom2('AppropriateGreeting', ROOT.Char)]"
 war_event.3002.1.a:0 "Muito bem."
 war_event.3002.desc.end.1:0 "Ao quebrar seu juramento dessa maneira, você trouxe desonra a si mesmo e a sua família."
 war_event.3002.desc.start:0 "Apesar de sua promessa de enviar tropas para me ajudar, ainda não vi um único soldado seu no campo de batalha."
 war_event.3002.t:0 "[war_owner.Custom2('AppropriateGreeting', ROOT.Char)]"
 war_event.3003.2.a:0 "Vou fazer melhor da próxima vez."
 war_event.3003.2.b:0 "Talvez eu deva encerrar nossa aliança...?"
 war_event.3003.desc.end.2:0 "Seu fracasso nesse aspecto prejudicou gravemente minha confiança em você, [ROOT.Char.GetTitledFirstName]."
 war_event.3101.a:0 "Chegou a hora de baixarmos nossas espadas."
 war_event.3101.b.tt:0 "[war.GetName] continua"
 war_event.3101.b:0 "[defender.GetSheHe|U] acha que isso vai me deter? Ha!"
 war_event.3101.desc:0 "chegaram até mim notícias da conversão d[Select_CString( defender.IsFemale, 'a', 'o' )] [defender.GetTitledFirstName] para o [defender.GetFaith.GetNameNoTooltip]. Não tenho mais o direito concedido por [ROOT.Char.GetFaith.HighGodName] de fazer guerra contra [defender.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 war_event.3101.t:0 "Nova Fé Descoberta"
 war_event.3102.a:0 "[ROOT.Char.Custom('CulturalCurse')|U]!"
 war_event.3102.desc:0 "Sua recém-descoberta fé em [ROOT.Char.GetFaith.HighGodName] está longe de ser convincente. Minha causa ainda é justa - não haverá misericórdia."
 war_event.3102.t:0 "[attacker.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 war_event.neighbor_war.both_neighbors.desc:0 "[Select_CString( winner.IsFemale, 'Sua vizinha', 'Seu vizinho' )] [winner.GetTitledFirstName] venceu [Select_CString( loser.IsFemale, 'sua outra vizinha', 'seu outro vizinho' )] [loser.GetTitledFirstName] na [war.GetName]!"
 war_event.neighbor_war.both_neighbors.t:0 "Guerra entre Vizinhos Resolvida"
 war_event.neighbor_war.only_loser.desc:0 "[Select_CString( loser.IsFemale, 'Sua vizinha', 'Seu vizinho' )] [loser.GetTitledFirstName] perdeu para [winner.Custom2('YourCharacterIntroductionNoComma', this_player)] na [war.GetName]!"
 war_event.neighbor_war.only_loser.t:0 "Governante Vizinho Perdeu a Guerra"
 war_event.neighbor_war.only_winner.desc:0 "[Select_CString( winner.IsFemale, 'Sua vizinha', 'Seu vizinho' )] [winner.GetTitledFirstName] venceu [loser.Custom2('YourCharacterIntroductionNoComma', this_player)] na [war.GetName]!"
 war_event.neighbor_war.only_winner.t:0 "Governante Vizinho Venceu a Guerra"
 war_event.notification_liege_loss.t:0 "Senhor Feudal Perdeu a Guerra"
 war_event.notification_liege_win.t:0 "Senhor Feudal Venceu a Guerra"
