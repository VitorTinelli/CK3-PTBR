l_spanish:
 raiding.0002.a:0 "Capture escravos habilidosos para [raider_capital.GetNameNoTooltip]!"
 raiding.0002.a_nomad:0 "Roube cada ovelha e cada égua!"
 raiding.0002.b:0 "Traga-me um saque abundante!"
 raiding.0002.c:0 "Já saqueamos o suficiente."
 raiding.0002.desc:0 "O assentamento de [sacked_barony.GetNameNoTierNoTooltip], uma fortaleza importante dentro de [sacked_county.GetNameNoTierNoTooltip], caiu perante meus saqueadores. Temos amplo domínio sobre extensas áreas de terra e podemos escolher entre os assustados súditos e os tesouros reluzentes de [sacked_county_owner.GetTitledFirstName].\n\nAs tropas estão prontas, aguardando meu comando para receberem direções."
 raiding.0002.t:0 "Fogo e Sangue"
 raiding.0003.a:0 "Maldito seja esse canalha!"
 raiding.0003.b:0 "Vingarei essa afronta."
 raiding.0003.c:0 "Vamos reconstruir [sacked_county.GetNameNoTierNoTooltip]."
 raiding.0003.desc.admin_plundered_independent:0 "Após derrubar os portões do assentamento de [sacked_barony.GetNameNoTierNoTooltip], [raider.GetTitledFirstName] tem liberdade para percorrer grande parte de [sacked_county.GetNameNoTierNoTooltip] e aproveitou essa oportunidade para sequestrar e escravizar o maior número possível de funcionários cultos e trabalhadores habilidosos. Os camponeses arrancam os cabelos e choram por seus familiares perdidos."
 raiding.0003.desc.admin_plundered_vassal:0 "Meu senhor falhou em defender o assentamento de [sacked_barony.GetNameNoTierNoTooltip] dos estragos causados [Select_CString( raider.IsFemale, 'pela', 'pelo' )] [raider.GetTitledFirstName] e, com sua queda, vai embora uma fortificação importante para [sacked_county.GetNameNoTierNoTooltip]. Neste momento, as tropas de [raider.GetTitledFirstNamePossessiveNoTooltip] se espalham pelo campo, capturando e escravizando todos os trabalhadores habilidosos e aprendizes que encontram."
 raiding.0003.desc.gold_plundered_independent:0 "Após um cerco tenso, [raider.GetTitledFirstName] conseguiu penetrar no assentamento fortificado de [sacked_barony.GetNameNoTierNoTooltip] e ordenou que seus soldados pilhassem tudo o que tivesse valor. Em pouco tempo, eles terão esvaziado metade de [sacked_county.GetNameNoTierNoTooltip] de sua riqueza!"
 raiding.0003.desc.gold_plundered_vassal:0 "Sem ajuda de meu senhor, [sacked_barony.GetNameNoTierNoTooltip] teve poucas chances. Os saqueadores liderados [Select_CString( raider.IsFemale, 'pela', 'pelo' )] [raider.GetTitledFirstName] saquearam o assentamento, e os desgraçados levaram tudo, desde os bens mundanos dos camponeses até o meu cálice da sorte.\n\nMetade de [sacked_county.GetNameNoTierNoTooltip] está em chamas devido ao saque dos [raider.GetPrimaryTitle.GetAdjectiveNoTooltip], e [raider.GetTitledFirstNameNoTooltip] está lá fora, em algum lugar, bebendo de meu copo pessoal."
 raiding.0003.desc.spared_plundered_independent:0 "Apesar de o assentamento de [sacked_barony.GetNameNoTierNoTooltip] ter sucumbido diante dos exércitos [raider.GetHerHim], [raider.GetTitledFirstName] poupou os habitantes de [sacked_county.GetNameNoTierNoTooltip] de um saque adicional. Em vez disso, [raider.GetSheHe] parece determinad[Select_CString( raider.IsFemale, 'a', 'o' )] em adquirir o seu saque de #EMP me#!!"
 raiding.0003.desc.spared_plundered_vassal:0 "Embora meu senhor tenha falhado em quebrar o cerco a [sacked_barony.GetNameNoTierNoTooltip], [raider.GetTitledFirstName] manteve suas tropas sob controle.\n\nA maior parte do campo foi poupada de mais pilhagens do que o usual, mas olhos famintos dos [raider.GetPrimaryTitle.GetAdjectiveNoTooltip] se voltam para outros lugares..."
 raiding.0003.t_attacked:0 "O Saque em [sacked_county.GetNameNoTierNoTooltip]"
 raiding.0003.t_spared:0 "[sacked_county.GetNameNoTierNoTooltip] Poupada"
 raiding.0004.a.tribal:0 "Malditos sejam esses cães [raider.GetPrimaryTitle.GetAdjectiveNoTooltip]!"
 raiding.0004.a:0 "Amaldiçoo esses selvagens intrometidos!"
 raiding.0004.b:0 "Pague um weregeld pela perda."
 raiding.0004.c.architect:0 "Você envia s[Select_CString( architect.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('architect'))] [architect.GetTitledFirstNameNoTooltip] para supervisionar as reparações."
 raiding.0004.c.feed.desc2:0 "Meu senhor feudal enviou o Arquiteto Real para liderar equipes de arquitetos e administradores para ajudar a reparar [sacked_county.GetNameNoTierNoTooltip]."
 raiding.0004.c.feed.desc:0 "Meu senhor feudal pagou por equipes de arquitetos e administradores para ajudar a reparar [sacked_county.GetNameNoTierNoTooltip]."
 raiding.0004.c.feed.t:0 "Senhor Feudal paga pelas Reparações"
 raiding.0004.c:0 "Ajude-os a reconstruir."
 raiding.0004.desc.admin_plundered:0 "[sacked_county_owner.GetTitledFirstName] pagou o preço pela avareza de [raider.GetTitledFirstNamePossessive]. Com a queda do assentamento de [sacked_barony.GetNameNoTierNoTooltip], vastas áreas em [sacked_county.GetNameNoTierNoTooltip] ficaram indefesas. \n\nSem oposição, os saqueadores [raider.GetPrimaryTitle.GetAdjectiveNoTooltip] saquearam impiedosamente, sequestrando e escravizando todos os trabalhadores habilidosos que encontraram."
 raiding.0004.desc.gold_plundered:0 "Com a queda do assentamento de [sacked_barony.GetNameNoTierNoTooltip] perante [raider.GetTitledFirstNameNoTooltip], grande parte de [sacked_county.GetNameNoTierNoTooltip] ficou desprotegida e sujeita aos saqueadores [raider.GetPrimaryTitle.GetAdjectiveNoTooltip].\n\nComo há poucas fortalezas locais capazes de enfrentá-los, os saqueadores levaram tudo que era precioso e todo o prata que encontraram."
 raiding.0004.desc.spared_plundered:0 "Apesar de ter sitiado com sucesso o assentamento de [sacked_barony.GetNameNoTierNoTooltip], uma fortificação que protegia vastas áreas de [sacked_county.GetNameNoTierNoTooltip], [raider.GetTitledFirstName] manteve suas tropas sob controle. O saque resultante foi isolado e esporádico.\n\nEmbora seu vassalo tenha sido poupado, o olhar [raider.GetPrimaryTitle.GetAdjectiveNoTooltip] cobiça suas terras pessoais vorazmente..."
 raiding.0011.desc:0 "Seus saqueadores trazem [ROOT.Var('raid_loot').GetValue|V0] [gold_i] e [ROOT.Var('raid_loot').GetValue|V0] [prestige_i] em saque e aclamação."
 raiding.0011.desc_non_tribal:0 "Seus saqueadores trazem [ROOT.Var('raid_loot').GetValue|V0] [gold_i] em saque, custando-lhe [SCOPE.ScriptValue('non_tribal_loot_value')|V0] de aclamação."
 raiding.0011.t:0 "Saques Entregues"
 raiding.0012.a.desc:0 "[recipient.GetTitledFirstName] levou [loot_i][ROOT.Var('raid_loot').GetValue|V0] de nós!\nEssa vitória concedeu a [recipient.GetSheHe] [ROOT.Var('raid_prestige').GetValue|V0] [prestige_i]."
 raiding.0012.a.t:0 "Saques Perdidos"
 raiding.0012.b.desc:0 "Você capturou [loot_i][ROOT.Var('raid_loot').GetValue|V0] de [raider.GetTitledFirstName]!\nEssa vitória lhe concedeu [ROOT.Var('raid_prestige').GetValue|V0] [prestige_i]."
 raiding.0012.b.t:0 "Saques Recuperados"
 raiding.0023.a:0 "Ha! Deixe-os chorar ao ouvir meu nome!"
 raiding.0023.desc:0 "Por anos, tenho realizado saques devastadores, trazendo a fúria total de [raid_leader.GetFaith.HighGodName] a um mundo trêmulo, pois certamente se [raid_leader.GetFaith.HighGodNameSheHe|U] desaprovasse, [raid_leader.GetFaith.HighGodNameSheHe|U] já teria me derrubado?\n\nEm vez disso, minha casa dorme rodeada pelas finas peças roubadas de governantes estrangeiros, e escravos exóticos aquecem minha cama.\n\nVerdadeiramente, tanto nobres como camponeses estremecem diante da minha chegada, e os pais silenciam crianças chorando com a ameaça de que eu irei visitá-los."
 raiding.0023.t:0 "O Terror de [capital_province.GetNameNoTooltip]"
 rebuilding_after_sacking_modifier:0 "Reconstrução após Saqueio"
 rebuilding_after_sacking_modifier_desc:0 "Um benfeitor rico está ajudando os moradores a reparar seus assentamentos danificados."
 recently_sacked_modifier:0 "Recentemente Saqueado"
 recently_sacked_modifier_desc:0 "Os saqueadores não encontrarão mais nada para levar aqui, enquanto o medo de seu retorno mantém os camponeses na linha."
 stolen_ewes_and_mares_modifier:0 "Ovelhas e Éguas Roubadas"
 stolen_ewes_and_mares_modifier_desc:0 "Este condado está prosperando, impulsionado por uma onda de ovelhas e éguas reprodutoras de primeira linha, levadas como espólio de incursões recentes."
