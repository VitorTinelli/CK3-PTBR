 combat_event.1005.pow_toast.desc.primary:0 "Suas forças capturaram [Select_CString( valuable_prisoner.IsFemale, 'sua inimiga', 'seu inimigo' )] [valuable_prisoner.GetTitledFirstName] após a Batalha de [combat_location.GetName]."
 combat_event.1005.pow_toast.desc:0 "Suas forças capturaram [Select_CString( primary_combat_loser.IsFemale, 'a prisioneira', 'o prisioneiro' )] [valuable_prisoner.Custom2('NamePossessiveCharacterIntroduction', primary_combat_loser)] após a Batalha de [combat_location.GetName]."
 combat_event.1005.pow_toast.t:0 "Combatentes inimigos capturados"
 combat_event.1006.pow_toast.desc:0 "[combat_winner.GetTitledFirstName] capturou [valuable_prisoner.Custom2('YourCharacterIntroduction', ROOT.Char)] como [prisoner_of_war|E] após a [battle|E] de [combat_location.GetName]!"
 combat_event.1006.pow_toast.t:0 "Herdeiro Feito Prisioneiro"
 combat_event.1007.pow_toast.desc.primary:0 "[combat_winner.GetTitledFirstName] capturou [Select_CString( valuable_prisoner.IsFemale, 'sua inimiga', 'seu inimigo' )] [valuable_prisoner.GetTitledFirstName] como [prisoner_of_war|E] após a [battle|E] de [combat_location.GetName]!"
 combat_event.1007.pow_toast.desc:0 "[combat_winner.GetTitledFirstName] capturou [valuable_prisoner.Custom2('NamePossessiveCharacterIntroduction', primary_combat_loser)] como [prisoner_of_war|E] após a [battle|E] de [combat_location.GetName]!"
