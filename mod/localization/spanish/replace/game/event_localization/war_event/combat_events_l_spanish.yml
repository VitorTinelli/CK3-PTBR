l_spanish:
 combat_event.0003.a:0 "Espalhem a palavra por toda parte sobre minha habilidade!"
 combat_event.0003.b.zealous:0 "Eu sou apenas o [ROOT.Char.GetFaith.HighGodNamePossessive] [ROOT.Char.Custom('signature_weapon')], simplesmente cumpro a vontade [ROOT.Char.GetFaith.WarGodHerHim|U]."
 combat_event.0003.b:0 "Não devo cair em arrogância. Uma flecha perdida é tudo o que é preciso."
 combat_event.0003.desc.alt_ending:0 "Finalmente alcancei essa marca monumental.\n\nCom cada batalha que venci, os rumores sobre minha destreza cresceram. Agora que minhas façanhas superaram até mesmo as lendas, posso afirmar verdadeiramente ser invencível, uma força indomável que jamais poderá ser derrotada."
 combat_event.0003.desc.commander:0 "Com minha mais recente vitória contra [enemy_commander.GetTitledFirstName] e seus soldados,"
 combat_event.0003.desc.ending:0 "Finalmente alcancei essa marca monumental.\n\nNunca tendo perdido uma única batalha, há muito sussurros de que eu era invencível, uma força indomável que jamais poderia ser derrotada. Está começando a parecer que isso pode realmente ser verdade..."
 combat_event.0003.desc.no_commander:0 "Com minha mais recente vitória em batalha"
 combat_event.0003.desc.opening:0 "Cem batalhas, cem vitórias!"
 combat_event.0003.t:0 "Invencível"
 combat_event.0004.a:0 "Até mesmo as grandes lendas caem diante da minha [ROOT.Char.Custom('signature_weapon')]!"
 combat_event.0004.b.zealous:0 "Agradeço a [ROOT.GetCharacter.GetFaith.WarGodName] por humilhar aquel[Select_CString( enemy_commander.IsFemale, 'a', 'e' )] [enemy_commander.GetWomanMan]."
 combat_event.0004.b:0 "Se [enemy_commander.GetSheHe] pode ser vencido, eu também posso."
 combat_event.0004.desc:0 "[enemy_commander.Custom2('MyCharacterIntroduction', ROOT.Char)|U] é um comandante lendário, conhecido em todo o mundo por travar mais de cem batalhas em sua vida sem nunca perder uma sequer.\n\nApesar disso, hoje eu venci [enemy_commander.GetSheHe] no campo de batalha e mostrei ao mundo que [enemy_commander.GetSheHe] não é infalível!"
 combat_event.0004.t:0 "Derrubando o Colosso"
 combat_event.0005.a:0 "[friendly_commander.GetSheHe|U] merece reconhecimento por derrotar alguém como eu."
 combat_event.0005.b:0 "Inaceitável! [friendly_commander.GetSheHe|U] se arrependerá pelo dia em que me desafiou!"
 combat_event.0005.desc:0 "Hoje aconteceu algo impensável: fui vencido em batalha por [friendly_commander.Custom2('MyCharacterIntroduction', ROOT.Char)]! Eu realmente comecei a pensar que nunca poderia perder, mas agora fui derrotado e humilhado.\n\nMinha reputação ainda está um pouco intacta apesar dessa derrota, embora [friendly_commander.GetFirstName] tenha roubado parte da minha glória e fama."
 combat_event.0005.message:0 "Enfurecido pela derrota em batalha, [enemy_commander.GetTitledFirstName] jurou vingança contra mim!"
 combat_event.0005.t:0 "Derrubando o Colosso"
 combat_event.1002.pow_message.desc.double:0 "Suas forças capturaram [primary_prisoner.Custom2('YourCharacterIntroduction', ROOT.Char)|U] e [secondary_prisoner.Custom2('YourCharacterIntroduction', ROOT.Char)]"
 combat_event.1002.pow_message.desc.end:0 "após vencerem a Batalha de [combat_location.GetName]!"
 combat_event.1002.pow_message.desc.multiple:0 "Suas forças capturaram [primary_prisoner.Custom2('YourCharacterIntroduction', ROOT.Char)|U] e mais [ROOT.Var('num_other_relevant_captured_combatants').GetValue|V0] combatentes"
 combat_event.1002.pow_message.desc.single:0 "Suas forças capturaram [primary_prisoner.Custom2('YourCharacterIntroduction', ROOT.Char)|U]"
 combat_event.1002.pow_message.t:0 "Combatentes Inimigos Capturados"
 combat_event.1003.pow_message.desc.double:0 "[primary_prisoner.Custom2('YourCharacterIntroduction', ROOT.Char)|U] e [secondary_prisoner.Custom2('YourCharacterIntroduction', ROOT.Char)] foram capturados como [prisoners_of_war|E]"
 combat_event.1003.pow_message.desc.end:0 "[Select_CString( combat_winner.IsFemale, 'pela sua inimiga', 'pelo seu inimigo' )] [combat_winner.GetTitledFirstName] após a [battle|E] de [combat_location.GetName]!"
 combat_event.1003.pow_message.desc.multiple:0 "[primary_prisoner.Custom2('YourCharacterIntroduction', ROOT.Char)|U] e [ROOT.Var('num_other_relevant_captured_combatants').GetValue|V0] outros foram capturados como [prisoners_of_war|E]"
 combat_event.1003.pow_message.desc.single:0 "[primary_prisoner.Custom2('YourCharacterIntroduction', ROOT.Char)|U] foi capturado como [prisoner_of_war|E]"
 combat_event.1003.pow_message.t:0 "Combatentes Aliados Capturados"
