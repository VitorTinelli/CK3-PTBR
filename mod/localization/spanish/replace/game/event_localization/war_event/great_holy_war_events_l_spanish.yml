l_spanish:
 great_holy_war.0003.a.hooked:0 "Eu não tenho muita escolha, suponho?"
 great_holy_war.0003.a.lifted_excommunication:0 "Minha [excommunication|E] será levantada"
 great_holy_war.0003.a.tt:0 "Comprometa-se a se juntar à [ghw_sponsor.GetFaith.GHWName] convocada por [ghw_sponsor.GetTitledFirstName] assim que ela começar"
 great_holy_war.0003.a:0 "Meus guerreiros estarão prontos para lutar!"
 great_holy_war.0003.b:0 "Eu ajudarei com prazer a financiar essa causa sagrada."
 great_holy_war.0003.c:0 "Talvez eu deva considerar me juntar..."
 great_holy_war.0003.catholic.desc:0 "Um enviado Papal chegou à minha corte, trazendo notícias do Vaticano. [ghw_sponsor.GetTitledFirstName] convocou todos os governantes cristãos justos para pegarem em armas. Como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetFaith.GetAdherentNameNoTooltip], espera-se que eu prepare meus homens em apoio a essa causa sagrada, patrocinada pela própria Igreja Universal.\n\nA todos aqueles que lutarem contra os vis [target_character.Custom('GetUnbelieverNamePlural')], profanando os terrenos sagrados de [target_kingdom.GetBaseNameNoTier], a Santa Sé promete plena absolvição de todos os pecados e um lugar garantido no Paraíso."
 great_holy_war.0003.fallback.desc:0 "Notícias gloriosas chegaram à minha corte. [ghw_sponsor.GetTitledFirstName] decidiu que é hora de todos os [ghw_sponsor.GetFaith.GetAdherentNamePluralNoTooltip] justos se unirem sob uma única bandeira e marcharem contra os inimigos da fé em uma [ghw_sponsor.GetFaith.GHWName] para a glória de [ghw_sponsor.GetFaith.WarGodName].\n\nA todos aqueles que se juntarem a essa busca sagrada, o [ghw_sponsor.GetTitleTierName] garante um lugar no [ghw_sponsor.GetFaith.DivineRealm]."
 great_holy_war.0003.title:0 "Os Fiéis se Preparam para a Guerra"
 great_holy_war.0011.a:0 "Deus Vult!"
 great_holy_war.0011.b:0 "Allahu Akbar!"
 great_holy_war.0011.c:0 "[ROOT.Char.GetFaith.WarGodName|U] está conosco!"
 great_holy_war.0011.catholic.jerusalem.desc:0 "Os peregrinos cristãos à Terra Santa sofrem todo tipo de abuso, e suas rotas estão repletas de perigos.\n\nPara proteger os peregrinos e garantir Jerusalém para Cristo e os fiéis, Sua Santidade [ghw_first_sponsor.GetTitledFirstName] aceitou a possibilidade de uma invasão direta por forças cristãs conjuntas."
 great_holy_war.0011.catholic.rome.desc:0 "Roma, a cidade de São Pedro e o próprio assento do Papado, caiu nas mãos dos infiéis. Em resposta, o Papa no exílio, Sua Santidade [ghw_first_sponsor.GetTitledFirstName], declarou sua intenção de forjar uma aliança de senhores cristãos para reconquistar a cidade eterna."
 great_holy_war.0011.christian.byzantion.desc:0 "O Império Romano do Oriente. Bizâncio - o bastião firme do cristianismo contra os infiéis muçulmanos do Oriente - está em declínio. A situação desesperadora convenceu Sua Santidade [ghw_first_sponsor.GetTitledFirstName] a considerar a possibilidade de uma invasão direta por forças cristãs conjuntas."
 great_holy_war.0011.christian.europe.desc:0 "As terras sagradas do cristianismo ocidental estão sob cerco dos infiéis! Senhores cristãos desesperados persuadiram Sua Santidade [ghw_first_sponsor.GetTitledFirstName] a declarar sua intenção de forjar uma aliança justa para expulsar os pagãos em nome de [awakening_faith.WarGodName]."
 great_holy_war.0011.christian.fallback.desc:0 "Por tempo demais, os fiéis [awakening_faith.GetAdjective] têm sido brutalizados por hereges e infiéis. Não permitiremos mais que nossos locais sagrados sejam saqueados por blasfemadores, nem que nossas crenças sejam zombadas por falsos profetas. É hora dos verdadeiros seguidores de [awakening_faith.WarGodName] se unirem e contra-atacarem os descrentes!"
 great_holy_war.0011.christian.t:0 "Reis Cruzados"
 great_holy_war.0011.d:0 "[ROOT.Char.GetFaith.WarGodName|U] nos proteja!"
 great_holy_war.0011.directed.a:0 "Minhas tropas se juntarão à campanha imediatamente!"
 great_holy_war.0011.directed.b:0 "Eu defenderei meus companheiros [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]!"
 great_holy_war.0011.e:0 "Se eles dizem..."
 great_holy_war.0011.fallback.t:0 "[awakening_faith.GetAdherentNamePlural] Militantes"
 great_holy_war.0011.generic.ending.coreligionist.autonomous:0 "\n\nAs ramificações teológicas desta notícia já estão sendo discutidas por vários membros proeminentes do clero, que estão ansiosos para seguir o exemplo dos [awakening_faith.GetAdherentNamePluralNoTooltip] e iniciar uma nova era de guerra religiosa em nome do [ROOT.Char.GetFaith.GetNameNoTooltip]."
 great_holy_war.0011.generic.ending.coreligionist.head:0 "\n\nAs ramificações teológicas desta notícia já estão sendo discutidas pelo [other_pope.GetTitleTierName] e outros membros proeminentes do clero, que estão ansiosos para seguir o exemplo dos [awakening_faith.GetAdherentNamePluralNoTooltip] e iniciar uma nova era de guerra religiosa em nome do [ROOT.Char.GetFaith.GetNameNoTooltip]."
 great_holy_war.0011.generic.ending.negative:0 "\n\nIsso poderia ser o início de uma agressão [awakening_faith.GetReligion.GetAdjective] sem precedentes."
 great_holy_war.0011.generic.ending.positive:0 "\n\nIsso marca o início de uma nova era de grandes guerras santas [awakening_faith.GetReligion.GetAdjective] - as [awakening_faith.GHWNamePlural]."
 great_holy_war.0011.generic.fallback.desc:0 "Não podemos mais nos dar ao luxo de ficar parados enquanto blasfemadores nos cercam por todos os lados, profanando nossos locais sagrados e brutalizando nossos irmãos. É hora dos guerreiros de [awakening_faith.WarGodName] pegarem em armas, unidos por um único propósito."
 great_holy_war.0011.generic.fallback.head.desc:0 "Com os fiéis [awakening_faith.GetReligion.GetAdjective] assediados por blasfemadores de todos os lados, [ghw_first_sponsor.GetTitledFirstName] decidiu que é hora de todos os guerreiros de [awakening_faith.WarGodName] pegarem em armas e defenderem seus lugares sagrados planejando uma magnífica campanha de conquista religiosa."
 great_holy_war.0011.muslim.africa.desc:0 "A Casa do Islã está sob grave ameaça do avanço dos [ghw_first_sponsor.Custom('GetDerogatoryNonbelieverPlural')] na África. Em resposta, Sua Magnificência, [ghw_first_sponsor.GetTitledFirstName], declarou que uma era de Jihad renovada está sobre o mundo. As regiões ocidentais da Ummah devem ser reconquistadas a qualquer custo. Todos os fiéis muçulmanos justos devem se preparar para se juntar às fileiras dos mujahideen nas próximas batalhas."
 great_holy_war.0011.muslim.arabia.desc:0 "A Casa do Islã está sob grave ameaça do avanço dos [ghw_first_sponsor.Custom('GetDerogatoryNonbelieverPlural')] em suas próprias terras sagradas. Em resposta, Sua Magnificência, [ghw_first_sponsor.GetTitledFirstName], declarou que uma era de Jihad renovada está sobre o mundo. As regiões centrais do Dar al-Islam devem ser reconquistadas a qualquer custo. Todos os fiéis muçulmanos justos devem se preparar para se juntar às fileiras dos mujahideen nas próximas batalhas."
 great_holy_war.0011.muslim.fallback.desc:0 "A Casa do Islã está sob grave ameaça dos infiéis e apóstatas. Todos os fiéis [awakening_faith.GetAdjective] justos devem se preparar para se juntar às fileiras dos mujahideen nas próximas batalhas. Isso sinaliza uma era renovada de expansão islâmica."
 great_holy_war.0011.muslim.jerusalem.desc:0 "A Cidade Santa de Jerusalém, onde o Profeta foi levado aos céus, caiu nas mãos dos infiéis! Sua Magnificência, [ghw_first_sponsor.GetTitledFirstName], não permitirá isso e declarou que outra era de Grandes Conquistas está sobre nós, como foi o caso nos dias dos primeiros Califas. O Dar al-Islam deve ser defendido! Todos os fiéis muçulmanos justos devem se preparar para se juntar às fileiras dos mujahideen nas próximas batalhas."
 great_holy_war.0011.muslim.mecca.desc:0 "O impensável aconteceu! A cidade sagrada de Meca caiu nas mãos dos infiéis, e a Caaba está sendo profanada por sua presença. Sua Magnificência, [ghw_first_sponsor.GetTitledFirstName], declarou que uma era de Jihad renovada está sobre o mundo. A cidade sagrada deve ser reconquistada a qualquer custo. Todos os fiéis muçulmanos justos devem se preparar para se juntar às fileiras dos mujahideen nas próximas batalhas."
 great_holy_war.0011.muslim.t:0 "Jihad Renovada"
 great_holy_war.0011.pagans.t:0 "A Ira dos Velhos Deuses"
 great_holy_war.0011.tooltip.effect:0 "[faiths|E] [awakening_faith.GetReligion.GetAdjective] agora têm acesso a [awakening_faith.GHWNamePlural]"
 great_holy_war.0015.a:0 "Já era hora..."
 great_holy_war.0015.b:0 "Verdadeiramente, [scoped_pope.GetFaith.WarGodName] é misericordioso!"
 great_holy_war.0015.desc:0 "Ao oferecer seu apoio à justa luta contra os infiéis, você se redimiu aos olhos de [scoped_pope.GetFaith.WarGodName]. Como tal, consideramos você digno de participar da Santa Comunhão mais uma vez."
 great_holy_war.0015.opening:0 "[scoped_pope.Custom2('AppropriateGreeting', ROOT.Char)]"
 great_holy_war.0016.a:0 "Tenho coisas melhores com que me preocupar."
 great_holy_war.0016.b:0 "O que eu fiz?!"
 great_holy_war.0016.custom:0 "Cada vassalo [theocratic|E] [scoped_pope.GetFaith.GetAdjective]"
 great_holy_war.0016.desc.a:0 "Estamos profundamente desapontados com sua decisão de abandonar a causa justa de Nosso [scoped_pope.GetFaith.GHWName]. Não esqueceremos sua afronta contra [scoped_pope.GetFaith.WarGodName], e nem [scoped_pope.GetFaith.WarGodSheHe|U]."
 great_holy_war.0016.desc.b:0 "Estamos profundamente desapontados e perturbados ao saber de sua decisão de abandonar a causa justa de Nosso [scoped_pope.GetFaith.GHWName]. Você se envergonhou diante dos olhos de [scoped_pope.GetFaith.WarGodName] com esta blasfêmia."
 great_holy_war.0016.desc.c:0 "Não toleraremos seu comportamento blasfemo. Ao se recusar a oferecer apoio ao Nosso [scoped_pope.GetFaith.GHWName] sagrado, não nos resta escolha senão te expulsar. A partir de agora, está proibido de participar da Santa Comunhão."
 great_holy_war.0017.a:0 "Não me importo."
 great_holy_war.0017.b:0 "Talvez eu esteja sendo precipitado demais..."
 great_holy_war.0017.desc.a:0 "Abandonar meu juramento ao [scoped_pope.GetFaith.GHWName] certamente reduzirá minha posição aos olhos do clero, e poderá despertar a ira da Santa Sé. \n\nDevo considerar seriamente as possíveis consequências dessa ação antes de tomar uma decisão, pois corro o risco de ser rotulado como herege aos olhos da Igreja."
 great_holy_war.0017.desc.b:0 "Abandonar meu juramento ao [scoped_pope.GetFaith.GHWName] certamente reduzirá minha posição aos olhos do clero, e poderá despertar a ira de [scoped_pope.GetTitledFirstName]. Devo considerar seriamente as possíveis consequências dessa ação antes de tomar uma decisão, pois corro o risco de ser rotulado como blasfemo."
 great_holy_war.0017.title:0 "Abandonando o [scoped_pope.GetFaith.GHWName]"
 great_holy_war.0018.a:0 "Eu me juntarei ao exército de [scoped_pope.GetFaith.WarGodName]!"
 great_holy_war.0018.b:0 "Preciso pensar um pouco mais sobre isso..."
 great_holy_war.0018.desc:0 "Se eu me juntar ao [scoped_pope.GetFaith.GHWName], serei obrigado a levantar um exército e marchar contra os inimigos da fé quando chegar a hora. \n\nVoltar atrás em minha palavra pode atrair a ira de [scoped_pope.GetTitledFirstName], devo considerar seriamente essa decisão antes de comprometer meu reino na luta."
 great_holy_war.0023.c:0 "Eu já estou fazendo a minha parte lutando contra os [target_character.Custom('GetUnbelieverNamePlural')]!"
 great_holy_war.0023.d:0 "Essa não é a minha guerra."
 great_holy_war.0023.desc.hooked:0 "Chegou ao nosso conhecimento que você ainda não se comprometeu a apoiar a iminente [scoped_pope.GetFaith.GHWName]. Isso é inaceitável! Exijo que você imediatamente se junte à nossa grande guerra contra os incrédulos e [target_character.Custom('GetUnbelieverNamePlural')]."
 great_holy_war.0023.desc:0 "Chegou ao nosso conhecimento que você ainda não se comprometeu a apoiar a iminente [scoped_pope.GetFaith.GHWName]. Devo lembrá-lo de que é seu dever sagrado como [scoped_pope.GetFaith.GetAdjectiveNoTooltip] [ROOT.GetCharacter.GetTitleTierName] travar guerra contra os incrédulos e [target_character.Custom('GetUnbelieverNamePlural')]."
 great_holy_war.0024.dead.recipient.open:0 "[former_recipient.GetTitledFirstName] morreu, deixando [target_kingdom.GetBaseNameNoTier] para ser reivindicado pelo guerreiro mais sagrado."
 great_holy_war.0024.dead.recipient.replaced:0 "[ghw_claimant.GetTitledFirstName] é agora [Select_CString( ghw_claimant.IsFemale, 'a nova Candidata Legítima', 'o novo Candidato Legítimo' )] desta [the_faith.GHWName]."
 great_holy_war.0024.dead.recipient.title:0 "[ghw_claimant.GetFirstNameNoTooltip] Morreu"
 great_holy_war.0028.dead.beneficiary:0 "Com o falecimento [Select_CString( former_beneficiary.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] [former_beneficiary.GetFirstName], devo escolher um novo beneficiário para a atual [ROOT.Char.GetFaith.GHWName]."
 great_holy_war.0028.dead.beneficiary_title:0 "Beneficiário Falecido"
 great_holy_war.0029.converted.beneficiary:0 "A infeliz conversão [Select_CString( former_beneficiary.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] [former_beneficiary.GetFirstName] tornou-o inadequado para receber qualquer território da [ROOT.Char.GetFaith.GHWName]."
 great_holy_war.0029.invalid.beneficiary_title:0 "Beneficiário Inválido"
 great_holy_war.0030.devoted.beneficiary:0 "Já que m[Select_CString( former_beneficiary.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] [former_beneficiary.GetFirstName] decidiu fazer votos, devo escolher outra pessoa para ser [Select_CString( former_beneficiary.IsFemale, 'minha beneficiária', 'meu beneficiário' )] na atual [ROOT.Char.GetFaith.GHWName]."
 great_holy_war.0030.excommunicated.beneficiary:0 "M[Select_CString( former_beneficiary.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] [former_beneficiary.GetFirstName] foi excomungado e, portanto, não está apto a ser [Select_CString( former_beneficiary.IsFemale, 'minha beneficiária', 'meu beneficiário' )] na atual [ROOT.Char.GetFaith.GHWName]."
 great_holy_war.0030.heir.beneficiary:0 "Tendo se tornado o próximo na linha para herdar um título [former_beneficiary.GetHerHim], m[Select_CString( former_beneficiary.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] [former_beneficiary.GetFirstName] não está mais apto a ser [Select_CString( former_beneficiary.IsFemale, 'minha beneficiária', 'meu beneficiário' )]."
 great_holy_war.0030.incapable.beneficiary:0 "Infelizmente, m[Select_CString( former_beneficiary.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] [former_beneficiary.GetFirstName] não está mais em condições de ser [Select_CString( former_beneficiary.IsFemale, 'minha beneficiária', 'meu beneficiário' )]. Ou de qualquer outra coisa, na verdade."
 great_holy_war.0030.ruler.beneficiary:0 "Tendo se tornado um[Select_CString( former_beneficiary.IsFemale, 'a', '' )] governante com responsabilidades próprias, m[Select_CString( former_beneficiary.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] [former_beneficiary.GetFirstName] não está mais apto a ser [Select_CString( former_beneficiary.IsFemale, 'minha beneficiária', 'meu beneficiário' )]."
 great_holy_war.0030.sick.beneficiary:0 "M[Select_CString( former_beneficiary.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] [former_beneficiary.GetFirstName] está muito frágil e doente para ser [Select_CString( former_beneficiary.IsFemale, 'minha beneficiária', 'meu beneficiário' )], devo escolher outra pessoa."
 great_holy_war.0040.a:0 "Vou esvaziar meus cofres pela causa!"
 great_holy_war.0040.b:0 "Farei uma generosa contribuição."
 great_holy_war.0040.c:0 "Posso abrir mão de algumas moedas para esta empreitada."
 great_holy_war.0040.d:0 "Vou considerar seriamente."
 great_holy_war.0040.desc:0 "O Cofre de Guerra representa o total das doações feitas pelos apoiadores desta [ROOT.Char.GetFaith.GHWName].\n\nUma parte deste ouro será compartilhada entre os participantes quando a fase de preparação terminar, enquanto o restante será dividido entre os vencedores dependendo de sua contribuição."
 great_holy_war.0050.a:0 "[ROOT.Char.GetFaith.WarGodName] nos proteja desses [ghw_sponsor.Custom('GetUnbelieverNamePlural')]!"
 great_holy_war.0050.base.desc:0 "Os governantes [the_faith.GetAdjectiveNoTooltip], motivados por um chamado às armas de [ghw_sponsor.GetTitledFirstName], começaram a reunir um grande exército de fanáticos para travar uma [the_faith.GHWName] contra todos os inimigos da [the_faith.ReligiousSymbol] em [target_kingdom.GetBaseNameNoTierNoTooltip]. Cada vez mais fanáticos são atraídos a cada dia, em breve teremos um poderoso exército da [the_faith.ReligiousSymbol] reunido para trazer guerra às nossas terras."
 great_holy_war.0050.defender.desc:0 "\n\nCabe a mim organizar meus companheiros governantes [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] na região e preparar-nos para a maré crescente de [ghw_sponsor.Custom('GetUnbelieverNamePlural')] antes que seja tarde demais."
 great_holy_war.0050.others.desc:0 "\n\nSó podemos rezar para que [ROOT.Char.GetFaith.WarGodName] conceda [Select_CString( target_character.IsFemale, 'a', 'ao' )] [target_character.GetTitledFirstName] a coragem e a fortitude para resistir à maré de [ghw_sponsor.Custom('GetUnbelieverNamePlural')]."
 great_holy_war.0050.title:0 "[the_faith.GHWName] para [target_kingdom.GetBaseNameNoTierNoTooltip]"
 great_holy_war.0051.catholic.attackers.desc:0 "Finalmente chegou a hora de trazer a santa ira de [the_faith.WarGodNamePossessive] contra os vis [ghw_defender.Custom('GetUnbelieverNamePlural')] de [target_kingdom.GetBaseNameNoTier].\n\nInflamado por uma fúria justa e uma determinação inabalável, o grande exército de cruzados reunido [Select_CString( ghw_sponsor.IsFemale, 'pela', 'pelo' )] [ghw_sponsor.GetTitledFirstName] parte para entregar uma justiça divina aos ímpios e conquistar seu lugar no [the_faith.DivineRealm]."
 great_holy_war.0051.generic.attackers.desc:0 "Finalmente chegou a hora de consagrar as terras de [target_kingdom.GetBaseNameNoTier] com o sangue dos [ghw_defender.Custom('GetUnbelieverNamePlural')] e reivindicar esta terra para a glória de [the_faith.WarGodName].\n\nNossos guerreiros sagrados marcham com a certeza de que, estejam eles emergindo vitoriosos ou morrendo lutando contra os incrédulos, sua devoção lhes garantirá um lugar no [the_faith.PositiveAfterLife]."
 great_holy_war.0051.generic.defenders.desc:0 "As hordas de [ghw_sponsor.Custom('GetUnbelieverNamePlural')] reunidas [Select_CString( ghw_sponsor.IsFemale, 'pela', 'pelo' )] [ghw_sponsor.GetTitledFirstName] iniciaram sua marcha em direção a [target_kingdom.GetBaseNameNoTier].\n\nEsses guerreiros selvagens, claramente inspirados por [ROOT.Char.GetFaith.DevilName], devastarão nossas terras e massacrão nosso povo sem misericórdia, caso não os detenhamos! Pelo bem de todos os fiéis [ghw_defender.GetFaith.GetAdjective] em [target_kingdom.GetBaseNameNoTierNoTooltip], devemos prevalecer!"
 great_holy_war.0051.generic.start.tt:0 "Uma [the_faith.GHWName] é lançada para [target_kingdom.GetBaseNameNoTierNoTooltip] imediatamente!"
 great_holy_war.0052.a:0 "[the_faith.WarGodName] está conosco!"
 great_holy_war.0052.b:0 "[ROOT.Char.GetFaith.WarGodName], por que nos castigas?!"
 great_holy_war.0052.c:0 "As disputas dos [ghw_sponsor.Custom('GetUnbelieverNamePlural')] não nos dizem respeito."
 great_holy_war.0052.generic.attackers.desc:0 "[the_faith.WarGodName] concedeu a vitória a [title_recipient.GetShortUIName] na [the_faith.GHWName] por [target_kingdom.GetBaseNameNoTier]. Após derrotar [ghw_defender.GetTitledFirstName] e seus [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] em várias ocasiões, nossos guerreiros forçaram os inimigos da fé a admitirem sua derrota ignominiosa.\n\nCom as terras ocupadas firmemente sob o comando de um governante piedoso [the_faith.GetAdjectiveNoTooltip], podemos ter certeza de que a vontade divina de [the_faith.WarGodName] foi cumprida. Este é um dia glorioso para todos os verdadeiros seguidores da [the_faith.ReligiousSymbol|U]!"
 great_holy_war.0052.generic.defenders.desc:0 "[ghw_defender.GetFaith.WarGodName] deve ter abandonado [Select_CString( ghw_defender.IsFemale, 'a', 'o' )] [ghw_defender.GetTitledFirstName] para permitir que seus exércitos fossem tão completamente derrotados pelos soldados da [the_faith.ReligiousSymbol|U].\n\nApós o bem-sucedido [the_faith.GHWName], os [ROOT.Char.Custom('GetUnbelieverNamePlural')] ocuparam [target_kingdom.GetBaseNameNoTier] e reivindicaram as terras circundantes como seu legítimo território [the_faith.GetAdjectiveNoTooltip]."
 great_holy_war.0052.generic.outsiders.desc:0 "A [the_faith.GHWName] dos [the_faith.GetAdjectiveNoTooltip] contra [target_kingdom.GetBaseName] foi um sucesso retumbante. Os guerreiros sagrados, inspirados pelo chamado de guerra de [ghw_sponsor.GetTitledFirstName], derrotaram seus inimigos repetidamente, ocupando permanentemente suas terras.\n\nÉ difícil dizer quanto tempo seu domínio durará e se os seguidores de [ghw_defender.GetFaith.WarGodName] contra-atacarão após essa humilhação, mas, pelo menos por agora, o povo de [target_kingdom.GetBaseNameNoTierNoTooltip] terá que aprender a viver à sombra da [the_faith.ReligiousSymbol|U]."
 great_holy_war.0052.title.losers:0 "Ira da [the_faith.ReligiousSymbol|U]"
 great_holy_war.0052.title.winners:0 "[the_faith.GHWName] Vitoriosa"
 great_holy_war.0053.a:0 "[the_faith.WarGodName] nos abandonou!"
 great_holy_war.0053.b:0 "Os [attacker.Custom('GetUnbelieverNamePlural')] provaram a ira de [ghw_defender.GetFaith.WarGodName]!"
 great_holy_war.0053.generic.attackers.desc:0 "Os guerreiros de [the_faith.WarGodName] encontraram apenas morte e humilhação diante dos portões de [target_kingdom.GetBaseNameNoTier].\n\nA [the_faith.GHWName], tão ansiosamente convocada e apoiada [Select_CString( ghw_sponsor.IsFemale, 'pela', 'pelo' )] [ghw_sponsor.GetTitledFirstName], terminou em uma derrota desastrosa que só prejudicou a causa dos fiéis. Isso certamente encorajará mais blasfemos e infiéis a se afastarem ainda mais do [the_faith.GetName]."
 great_holy_war.0053.generic.defenders.desc:0 "Os soldados miseráveis de [the_faith.WarGodName] não eram páreo para nossos guerreiros.\n\nSob a liderança sábia e piedosa de [ghw_defender.GetTitledFirstName], os fiéis [ghw_defender.GetFaith.GetAdjective] repeliram os invasores e reafirmaram mais uma vez sua reivindicação sobre [target_kingdom.GetBaseNameNoTier]. Talvez da próxima vez, [ghw_sponsor.GetTitleTierName], tão ávido, não se precipite em sacrificar as vidas de seus seguidores em uma tentativa fútil de testar o poder de [ghw_defender.GetFaith.WarGodName]."
 great_holy_war.0053.generic.outsiders.desc:0 "Após vários contratempos e derrotas humilhantes, a [the_faith.GHWName] convocada [Select_CString( ghw_sponsor.IsFemale, 'pela', 'pelo' )] [ghw_sponsor.GetTitledFirstName] para conquistar [target_kingdom.GetBaseNameNoTier] terminou em um fracasso retumbante.\n\nOs fiéis [ghw_defender.GetFaith.GetAdjective] sob a bandeira de [ghw_defender.GetTitledFirstNamePossessive] expulsaram todos os invasores e forçaram seus líderes a se renderem."
 great_holy_war.0053.title:0 "[the_faith.ReligiousSymbol|U] Abalada"
 great_holy_war.0054.a:0 "Que ninguém fale sobre isso novamente."
 great_holy_war.0054.b:0 "Dormirei mais tranquilo esta noite."
 great_holy_war.0054.c:0 "Que assim seja."
 great_holy_war.0054.desc.bystander:0 " [ghw_sponsor.GetTitledFirstName] convocou os fiéis para marcharem em nome de [the_faith.WarGodName] contra [ghw_defender.GetTitledFirstName]."
 great_holy_war.0054.desc.defender:0 " [ghw_sponsor.GetTitledFirstName] convocou os fiéis para marcharem em nome de [the_faith.WarGodName] contra mim."
 great_holy_war.0054.desc.intro:0 "A [the_faith.GHWName] por [target_kingdom.GetBaseNameNoTier] chegou ao fim!\n\n"
 great_holy_war.0054.desc.outro:0 "Aqueles que atenderam ao chamado vão para casa sem nada para mostrar além da poeira da estrada."
 great_holy_war.0054.desc.sponsor:0 "Eu convoquei os fiéis para marcharem em nome de [the_faith.WarGodName] contra [ghw_defender.GetTitledFirstName]."
 great_holy_war.0054.title:0 "$great_holy_war.0056.title$"
 great_holy_war.0056.a:0 "Como nos desviamos tanto da orientação de [the_faith.WarGodNamePossessive]?"
 great_holy_war.0056.b:0 "Lamentável."
 great_holy_war.0056.c:0 "Por que isso me preocupa novamente?"
 great_holy_war.0056.desc:0 "Parece que o apelo apaixonado de [ghw_sponsor.GetTitledFirstNamePossessive] para se unir contra os inimigos da [the_faith.ReligiousSymbol] foi menos persuasivo do que [ghw_sponsor.GetSheHe] esperava. Poucos foram os fiéis que decidiram atender ao chamado para pegar em armas, muito poucos para organizar um exército adequado.\n\nSem outra escolha, o [ghw_sponsor.GetTitleTierName] foi obrigado a cancelar a [the_faith.GHWName] e denunciar todos os governantes [the_faith.GetAdjective] por sua covardia e maldade."
 great_holy_war.0056.title:0 "O Fracasso da [the_faith.GHWName]"
 great_holy_war.0057.a:0 "Que [the_faith.WarGodName] nos conduza à vitória!"
 great_holy_war.0057.crusader.desc:0 "Nossos exércitos estão prontos para participar da [the_faith.GHWName] por [target_kingdom.GetBaseNameNoTier]. Se [the_faith.WarGodName] quiser, em breve nos ergueremos vitoriosos, com o sangue dos [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] tingindo o solo de vermelho."
 great_holy_war.0057.generic.outsiders.desc:0 "Nossos exércitos estão prontos para participar da [the_faith.GHWName] por [target_kingdom.GetBaseNameNoTier]. Com [the_faith.WarGodName] ao nosso lado, certamente prevaleceremos!"
 great_holy_war.0057.mujahid.desc:0 "Nossa grande luta finalmente chegou. Nossos exércitos estão prontos para enfrentar os infiéis em batalha e, com a bênção de [the_faith.WarGodName], em breve estaremos vitoriosos nos muros de [target_kingdom.GetBaseNameNoTier]."
 great_holy_war.0057.title:0 "Soldado da [the_faith.ReligiousSymbol|U]"
 great_holy_war.0058.a:0 "Não deveria ter abandonado o campo..."
 great_holy_war.0058.base.desc:0 "Enquanto lutadores mais virtuosos ainda marcham em direção a [target_kingdom.GetBaseNameNoTier], abandonei meus exércitos em busca de um refúgio mais seguro. Enquanto eles travam uma guerra implacável contra os [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] vis, mancho meu nome e coloco em dúvida minha determinação em perseguir essa [the_faith.GHWName]."
 great_holy_war.0058.title:0 "Demonstração de Covardia"
 great_holy_war.0061.notification:0 "[scoped_beneficiary.GetFirstName] foi recompensad[Select_CString( scoped_beneficiary.IsFemale, 'a', 'o' )] pela contribuição de sua família na recente [scoped_beneficiary.GetFaith.GHWName]."
 great_holy_war.0061.title:0 "Recompensado"
 great_holy_war.0070.a:0 "Fico curios[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] para saber que tipo de governante [title_recipient.GetSheHe] será..."
 great_holy_war.0070.b:0 "É hora de me concentrar novamente em meu reino."
 great_holy_war.0070.base.desc:0 "Com o estabelecimento de um verdadeiro [title_recipient.GetTitleTierName] [the_faith.GetAdjective] em [target_kingdom.GetBaseNameNoTier], os fiéis finalmente podem descansar tranquilos, sabendo que [the_faith.WarGodName] sorri para nossas boas obras. O fato de o novo governante de [target_kingdom.GetBaseNameNoTier] pertencer à minha dinastia é apenas mais uma prova de nosso favor divino."
 great_holy_war.0070.title:0 "Um Novo Reino"
 great_holy_war.0071.generic.attackers.desc:0 "[attacker.GetTitledFirstName] convocou uma [attacker.GetFaith.GHWName] para unir todos os verdadeiros [attacker.GetFaith.GetAdherentNamePlural] sob uma única bandeira e liderá-los contra os inimigos da fé.\n\nChegou finalmente a hora de consagrar as terras de [target_kingdom.GetBaseNameNoTier] com o sangue dos [ghw_defender.Custom('GetUnbelieverNamePlural')] e reivindicar essa terra para a glória de [the_faith.WarGodName]."
 great_holy_war.0071.generic.defenders.desc:0 "[Select_CString( attacker.IsFemale, 'A vilã', 'O vil' )] [attacker.GetTitledFirstName] convocou uma [attacker.GetFaith.GHWName] contra o povo inocente de [defender.GetPrimaryTitle.GetBaseNameNoTier].\n\nDevemos nos unir contra a horda impiedosa de fanáticos sob o comando [attacker.GetHerHim] se quisermos sobreviver."
 great_holy_war.0081.a:0 "Pelo menos estamos seguros."
 great_holy_war.0081.desc:0 "Por algum motivo, a [actor.GetFaith.GHWName] desviou-se de seu alvo original e se moveu para [secondary_recipient.GetPrimaryTitle.GetBaseNameNoTier].\n\nParece que nossas terras serão poupadas da selvageria dos militantes [actor.GetFaith.GetAdjective], pelo menos por enquanto."
 great_holy_war.0081.title:0 "Um Novo [actor.GetFaith.GHWName]"
 great_holy_war.0082.a:0 "Temos apenas um pouco de tempo para nos preparar!"
 great_holy_war.0082.desc:0 "Há algum tempo, a Fé [actor.GetFaith.GetAdjective] vem reunindo forças para uma [actor.GetFaith.GHWName].\n\nNo entanto, em uma reviravolta inesperada do destino, os fanáticos que lideram esse grande exército decidiram mudar seus planos originais e marchar em direção a [secondary_recipient.GetPrimaryTitle.GetBaseNameNoTier]!"
 great_holy_war.0085.toast:0 "A conversão de [converter.GetTitledFirstNamePossessive] me obrigou a abandonar meu compromisso."
