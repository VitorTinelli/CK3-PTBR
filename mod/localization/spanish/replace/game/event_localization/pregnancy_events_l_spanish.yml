l_spanish:
 pregnancy.1001.a:0 "Ótimo!"
 pregnancy.1001.d:0 "Uma criança está crescendo em meu ventre. Meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))], [real_father.GetTitledFirstNameNoTooltip], ficará orgulhoso!"
 pregnancy.1001.t:0 "Gravidez!"
 pregnancy.1002.a:0 "Mal posso esperar para segurar o bebê em meus braços!"
 pregnancy.1002.d:0 "O destino sorri para mim! Minha [spouse.Custom2('RelationToMe', SCOPE.sC('mother'))], [mother.GetTitledFirstNameNoTooltip], está esperando meu filho!"
 pregnancy.1002.t:0 "Gravidez!"
 pregnancy.1101.a.dead:0 "Se apenas [ex_spouse.GetFirstNameNoTooltip] pudesse estar aqui para isso..."
 pregnancy.1101.a.divorced:0 "Acho que devo informar [ex_spouse.GetFirstNameNoTooltip] imediatamente."
 pregnancy.1101.desc.dead:0 "meu falecido marido [ex_spouse.GetTitledFirstName]."
 pregnancy.1101.desc.divorced:0 "meu ex-marido [ex_spouse.GetTitledFirstName]."
 pregnancy.1101.desc.end:0 "\n\nEmbora as circunstâncias em torno desta gravidez sejam lamentáveis, posso ao menos me alegrar que meu filho não será considerado um bastardo."
 pregnancy.1101.desc.start:0 "Uma criança está crescendo em meu ventre, e não tenho dúvidas de que é filho do"
 pregnancy.1101.t.dead:0 "A Vida Segue"
 pregnancy.1101.t.divorced:0 "Circunstâncias Excepcionais"
 pregnancy.1102.a:0 "Ah, que pena."
 pregnancy.1102.desc:0 "Agora está claro que minha [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))] [mother.GetTitledFirstName] está grávida, embora pelo momento em que isso ocorreu, não acredito que seja meu filho.\n\nÉ muito provável que o verdadeiro pai seja o ex-marido da [mother.GetTitledFirstNamePossessiveNoTooltip], [ex_spouse.GetTitledFirstName]."
 pregnancy.1102.t:0 "$pregnancy.1101.t.divorced$"
 pregnancy.1103.a:0 "Está bem, então."
 pregnancy.1103.desc:0 "Estou escrevendo para informar que estou grávida e que certamente o filho é seu.\n\nComo estávamos casados quando essa criança foi concebida, ela não será considerada ilegítima; quando o bebê nascer, será reconhecido como seu legítimo descendente."
 pregnancy.1103.desc_concubine:0 "Estou escrevendo para informar que estou grávida e que certamente o filho é seu.\n\nComo estávamos juntos quando essa criança foi concebida, não haverá mancha de ilegitimidade; quando o bebê nascer, ele será reconhecido como seu descendente."
 pregnancy.1103.opening:0 "Ao meu ex-marido [mother.Custom2('RelationDescriptor', ROOT.Char)],"
 pregnancy.1103.opening_concubine:0 "Ao meu ex-[ROOT.Char.GetWomanMan] [mother.Custom2('RelationDescriptor', ROOT.Char)],"
 pregnancy.2001.a:0 "Vou contar a todos quem é o pai!"
 pregnancy.2001.b:0 "[real_father.GetFirstNameNoTooltip] precisa saber, mas mais ninguém!"
 pregnancy.2001.c.tt:0 "Você espera que ninguém descubra!"
 pregnancy.2001.c:0 "Não posso contar a #EMP ninguém#!..."
 pregnancy.2001.d:0 "Preciso que uma mulher sábia prepare uma poção."
 pregnancy.2001.father_is_married:0 "\n\n[real_father.Custom2('MyCharacterIntroduction', ROOT.Char)|U] é, sem dúvida, o pai, mas [real_father.GetSheHe] é casado e certamente nunca reconhecerá meu filho como [real_father.GetHerHim]!"
 pregnancy.2001.father_is_unmarried:0 "\n\nMeu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] [real_father.GetTitledFirstName] é, sem dúvida, o pai, mas sem os laços do casamento, o que as pessoas dirão sobre meu filho?"
 pregnancy.2001.opening:0 "Refleti muito sobre isso e os sinais são claros. Estou grávida!"
 pregnancy.2001.t:0 "Fora do Casamento"
 pregnancy.2002.a:0 "Confesso minha infidelidade!"
 pregnancy.2002.b:0 "[real_father.GetFirstNameNoTooltip] saberá, em confidência."
 pregnancy.2002.c.tt:0 "#F Você espera que isso permaneça em segredo#!"
 pregnancy.2002.c:0 "Ninguém jamais deve saber."
 pregnancy.2002.d:0 "Preciso de um chá de uma mulher sábia."
 pregnancy.2002.desc.polyamorous:0 "Refleti muito sobre isso e os sinais são claros. Estou grávida!\n\nNão tenho dúvidas de que [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)] é o verdadeiro pai, em vez do meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))], [spouse.GetFirstName]."
 pregnancy.2002.desc:0 "Refleti muito sobre isso e os sinais são claros. Estou grávida!\n\nNão é motivo de alegria, pois não tenho dúvidas de que é [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)] o verdadeiro pai, em vez do meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))], [spouse.GetFirstName]!"
 pregnancy.2002.t:0 "De Outro Homem"
 pregnancy.2003.a:0 "Fiz o que precisava."
 pregnancy.2003.desc_no_notice:0 "Por muito tempo, temi que a mistura de [ROOT.Char.Custom('Abortifacient')] funcionasse, mas agora está claro.\n\nJá não estou mais grávida."
 pregnancy.2003.desc_pain:0 "A mistura de [ROOT.Char.Custom('Abortifacient')] me deu cólicas e me fez vomitar, mas é melhor assim, do que não ter efeito.\n\nJá não estou mais grávida."
 pregnancy.2003.t:0 "A Espera"
 pregnancy.2004.a:0 "Consigo superar isso."
 pregnancy.2004.desc:0 "A mistura de [ROOT.Char.Custom('Abortifacient')] pôs fim à minha gravidez, mas me deixou vomitando e com febre. A mulher sábia me alertou sobre a febre, mas a dor não termina como ela disse que seria."
 pregnancy.2004.t:0 "A Doença"
 pregnancy.2005.a:0 "Não há mais nada a ser feito."
 pregnancy.2005.desc:0 "Eu esperava que a mistura de [ROOT.Char.Custom('Abortifacient')] acabasse com os meus problemas, mas a mulher sábia me alertou que talvez não acontecesse.\n\nTemo que os receios dela tenham fundamento, pois não tenho dúvidas de que a criança ainda está crescendo em meu ventre."
 pregnancy.2005.t:0 "A Espera"
 pregnancy.2007.a:0 "Quem me receberá?"
 pregnancy.2007.desc:0 "Tudo ficou turvo desde que bebi a mistura de [ROOT.Char.Custom('Abortifacient')]. Figuras se movendo com murmúrios silenciosos ao redor da minha cama, embaçadas e cinzentas, se fundindo com as bordas escuras da minha visão. À medida que os sussurros ficam mais intensos, também aumenta a queimação em meu peito."
 pregnancy.2007.t:0 "O Falecimento"
 pregnancy.2050.desc.polyamorous:0 "Refleti muito sobre isso e os sinais são claros. Estou grávida!\n\nNão tenho dúvidas de que [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)] é o verdadeiro pai."
 pregnancy.2050.desc:0 "Refleti muito sobre isso e os sinais são claros. Estou grávida!\n\nNão é motivo de alegria, pois agora todos sabem que fui infiel ao meu [spouse.Custom2('MyCharacterIntroduction', ROOT.Char)]. Não tenho dúvidas de que [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)] é o pai..."
 pregnancy.2050.t:0 "De Outro"
 pregnancy.2101.a:0 "Não estou mais grávida."
 pregnancy.2101.desc:0 "À medida que os dias passam, minha apreensão aumenta em vez da minha barriga. Certamente deveria estar mais visível agora? Certamente a criança teria se manifestado?\n\nAlgo deve ter dado errado, pois não consigo sentir nenhuma faísca de vida dentro de mim."
 pregnancy.2101.desc_other_children:0 "À medida que minha barriga cresce, minha inquietação também aumenta. Esta não é a primeira vez que estou grávida, mas essa sensação sombria é nova; algo está errado.\n\nAs cólicas vêm durante a noite e, ao me levantar pela manhã, encontro lençóis manchados e arruinados."
 pregnancy.2101.desc_pain:0 "À medida que minha barriga cresce, minha inquietação também aumenta. Esta é a primeira vez que estou grávida, mas essa sensação sombria não pode estar certa; algo está errado.\n\nAs cólicas vêm durante a noite e, ao me levantar pela manhã, encontro lençóis manchados e arruinados."
 pregnancy.2101.t:0 "Prematuramente"
 pregnancy.2102.a:0 "[mother.GetSheHe|U] não está mais grávida."
 pregnancy.2102.desc:0 "\"A criança não estava destinada a existir.\"\n\n[mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me assegura que é assim na vida, mas sua mão permanece em sua barriga."
 pregnancy.3001.a.tt:0 "Você confronta [mother.GetFirstNameNoTooltip] sobre a criança"
 pregnancy.3001.a:0 "Preciso perguntar a [mother.GetSheHe] sobre isso pessoalmente."
 pregnancy.3001.b.tt:0 "Você não age baseado em suas suspeitas"
 pregnancy.3001.b:0 "Talvez nunca saiba, mas sempre vou me perguntar..."
 pregnancy.3001.lovers_love:0 "[mother.GetSheHe|U] não disse nada, mas isso poderia ser resultado do nosso amor?"
 pregnancy.3001.lovers_not_love:0 "[mother.GetSheHe|U] não disse nada, mas isso poderia ser resultado de nossas relações carnais?"
 pregnancy.3001.not_lovers:0 "[mother.GetSheHe|U] não disse nada, mas isso poderia ser resultado de nossa recente aventura?"
 pregnancy.3001.opening:0 "Conforme a barriga de [mother.GetTitledFirstNamePossessive] cresce, não pode haver dúvidas. [mother.GetSheHe|U] está grávida!"
 pregnancy.3001.t:0 "Indiscrições"
 pregnancy.3002.a.tt:0 "A criança de [mother.GetShortUINamePossessiveNoTooltip] nascerá sem um pai conhecido"
 pregnancy.3002.a:0 "Ah, [mother.GetFirstNameNoTooltip], se fosse apenas nós dois e nosso filho..."
 pregnancy.3002.b.not_again:0 "Como pude deixar isso acontecer de novo?!"
 pregnancy.3002.b:0 "Isso deve permanecer em segredo!"
 pregnancy.3002.c:0 "Vou revelar a verdade!"
 pregnancy.3002.lovers:0 "É claro que eu tinha minhas suspeitas quando minha [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('mother'))] [mother.GetTitledFirstName] começou a mostrar sinais de estar grávida, e agora [mother.GetSheHe] me informou que o filho é meu."
 pregnancy.3002.not_lovers:0 "[mother.GetTitledFirstName] está grávida, e [mother.GetSheHe] me informou confidencialmente que isso é resultado de nossa aventura ilícita."
 pregnancy.3002.spouse_exists:0 "\n\nFelizmente, s[Select_CString( spouse.IsFemale, 'ua', 'eu' )] [mother.Custom2('RelationToMe', SCOPE.sC('spouse'))], [spouse.GetTitledFirstName], acredita que o filho é [spouse.GetHerHim]."
 pregnancy.3002.t:0 "Indiscrições"
 pregnancy.3003.a.tt:0 "O segredo permanece oculto, por enquanto"
 pregnancy.3003.a:0 "Isso deve permanecer em segredo!"
 pregnancy.3003.b:0 "Oh, esta é uma notícia alegre!"
 pregnancy.3003.desc:0 "[mother.GetTitledFirstName] veio até mim, e imediatamente soube por quê. [mother.GetSheHe|U] está grávida, e tanto no coração [mother.GetHerHim] quanto no meu, não há dúvidas sobre quem é o pai. Uma criança nascida fora dos limites legítimos do casamento está destinada a uma vida de bastardo. É esse o destino que eu quero para meu filho?"
 pregnancy.3003.desc_no_bastards:0 "[mother.GetTitledFirstName] veio até mim, e imediatamente soube por quê. [mother.GetSheHe|U] está grávida, e tanto no coração [mother.GetHerHim] quanto no meu, não há dúvidas sobre quem é o pai. Que tipo de vida espera meu filho, nascido fora dos laços do casamento?"
 pregnancy.3003.t:0 "Uma Barriga Inchada"
 pregnancy.3004.a:0 "Nunca pensei que chegaria a isso."
 pregnancy.3004.desc:0 "[mother.GetTitledFirstName] veio até mim, e imediatamente soube por quê. [mother.GetSheHe|U] está grávida, e tanto no coração [mother.GetHerHim] quanto no meu, não há dúvidas sobre quem é o pai. No entanto, com meu casamento com [spouse.GetFirstName], não há nada que eu possa fazer além de esperar que meu envolvimento permaneça em segredo."
 pregnancy.3004.t:0 "Uma Barriga Inchada"
 pregnancy.5001.a:0 "A criança é sua, [real_father.GetFirstNameNoTooltip]."
 pregnancy.5001.b:0 "Você não é o pai do meu filho."
 pregnancy.5001.desc:0 "[real_father_inquirer.GetTitledFirstName] me procurou. Colocando uma mão em minha barriga, [real_father_inquirer.GetSheHe] me olha com uma expressão preocupada."
 pregnancy.5001.not_father:0 "\n\n\"Por favor, seja honesta comigo.\"\n\nMeus olhos se fixam no corredor atrás de [real_father.GetSheHe], preocupada que alguém nos veja juntos."
 pregnancy.5001.real_father:0 "\n\n\"Eu só quero ouvir você dizer, eu já sei que é meu.\""
 pregnancy.5001.t:0 "\"Eu Preciso Saber!\""
 pregnancy.5002.a:0 "Nós dois... Uma criança..."
 pregnancy.5002.b:0 "Esta é uma notícia alegre e deve ser compartilhada!"
 pregnancy.5002.love:0 "\"Claro que é seu, [ROOT.Char.GetFirstNameNoTooltip]!\"\n\nEu até esqueço de me preocupar se alguém pode nos ouvir. Alegria e confusão me invadem. Como se todas as minhas preces tivessem sido atendidas, nossa união foi abençoada, mesmo que haja... complicações."
 pregnancy.5002.not_love:0 "\"Claro que é seu, [ROOT.Char.GetFirstNameNoTooltip]!\"\n\nMe preocupo que alguém tenha ouvido [mother.GetSheHe], mas ficamos sozinhos no silêncio. Bom também, porque de repente tenho muito no que pensar."
 pregnancy.5002.t:0 "Nosso Sangue"
 pregnancy.5003.a.tt:0 "\"Só o tempo dirá se estou certo...\""
 pregnancy.5003.a:0 "[mother.GetSheHe] está me dizendo a verdade?"
 pregnancy.5003.desc:0 "Mesmo que eu continue pressionando o assunto, [mother.GetTitledFirstName] continua firme. \"A criança não é sua, [ROOT.Char.GetFirstNameNoTooltip].\"\n\nSerá que eu estava tão errado?"
 pregnancy.5003.t:0 "A Ideia Errada"
 pregnancy.6001.a:0 "Sempre farei o que for melhor para meu filho."
 pregnancy.6001.desc:0 "A criança que estou carregando pode ser ilegítima, mas ela crescerá sabendo quem é seu pai, não importa o que [real_father.GetTitledFirstName] [real_father.GetHerselfHimself] queira."
 pregnancy.6001.t:0 "Além de Qualquer Dúvida"
 pregnancy.6002.a:0 "O que as pessoas vão dizer?"
 pregnancy.6002.desc:0 "[mother.GetTitledFirstName] me nomeou publicamente como pai do filho que [mother.GetSheHe] está esperando!"
 pregnancy.6002.married:0 "\n\n\"Como você pôde fazer isso?!\" [spouse.GetFirstName] me observa [spouse.Custom('GeneralTemperament')]."
 pregnancy.6002.t:0 "Além de Qualquer Dúvida"
 pregnancy.6002.unmarried_sympathetic:0 "\n\nNascido fora dos laços do casamento, a criança terá uma vida difícil, mas pelo menos conhecerá a verdade."
 pregnancy.6002.unmarried_unsympathetic:0 "\n\nNão é suficiente que [mother.GetSheHe] carregue esse fardo, [mother.GetSheHe] também precisa me arrastar com [mother.GetSheHe]?"
 pregnancy.6003.a:0 "[real_father.GetFirstNameNoTooltip]?!"
 pregnancy.6003.desc:0 "Minha [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))], [mother.GetTitledFirstName], confessou que não apenas sua gravidez é resultado de uma união ilegítima, mas o verdadeiro pai de seu filho não nascido é ninguém menos que [real_father.GetTitledFirstName]!\n\nQue vergonha [mother.GetSheHe] trouxe para minha casa! Como [mother.GetSheHe] pôde fazer isso comigo? Conosco?"
 pregnancy.6003.t:0 "Além de Qualquer Dúvida"
 pregnancy.6004.a:0 "[mother.GetSheHe|U] lançou esta casa ao caos!"
 pregnancy.6004.desc:0 "Minha [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))], [mother.GetTitledFirstName], deixou claro que não apenas seu filho não nascido é produto de uma união ilícita, mas o pai é ninguém menos que [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
 pregnancy.6004.incest:0 "\n\nO que acontecerá com a criança, criada a partir de uma união tão profana?"
 pregnancy.6004.mother_married:0 "\n\nO que isso significa para o casamento [mother.GetHerHim] com [spouse.GetTitledFirstName]?"
 pregnancy.6004.mother_unmarried:0 "\n\nO que acontecerá com a criança [mother.GetHerHim], agora que o mundo todo sabe?"
 pregnancy.6004.t:0 "Além de Qualquer Dúvida"
 pregnancy.6005.a:0 "[real_father.GetFirstNameNoTooltip], como você pôde?"
 pregnancy.6005.desc:0 "[mother.GetTitledFirstName] revelou ao mundo o pai da sua gravidez ilícita. Eu queria esperar que não fosse verdade, mas é claro que eu sabia que era. Meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))], [real_father.GetTitledFirstName], é o verdadeiro pai do filho não nascido!"
 pregnancy.6005.t:0 "Além de Qualquer Dúvida"
 pregnancy.6006.a:0 "O que esse filho bastardo significará para nós?"
 pregnancy.6006.desc:0 "[real_father.Custom2('MyCharacterIntroduction', ROOT.Char)|U] foi nomeado como o verdadeiro pai do filho não nascido de [mother.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 pregnancy.6006.real_father_married:0 "\n\nSerá que [real_father.GetSheHe] não pensou na importância de seu casamento com [spouse.Custom2('HerHisCharacterIntroduction', SCOPE.sC('real_father'))]?"
 pregnancy.6006.real_father_unmarried:0 "Será que [real_father.GetSheHe] não pensou na honra de sua família?"
 pregnancy.6006.t:0 "Além de Qualquer Dúvida"
 pregnancy.6999.a:0 "Um dever que cumprirei."
 pregnancy.6999.desc:0 "Minha [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))], [mother.GetTitledFirstName], fez saber que [mother.GetSheHe] está grávida do filho de [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\nMesmo que a criança não seja minha, eu ainda sou [Select_CString( ROOT.Char.IsFemale, 'sua', 'seu' )] [ROOT.Char.Custom('WifeHusband')], e é meu dever cuidar dela nos próximos meses."
 pregnancy.6999.t:0 "De Outro Homem"
 pregnancy_announcement_my_child_will_be_a_bastard:0 "Meu filho nascerá um [bastard|E] com [real_father.GetTitledFirstNameNoTooltip] como pai"
 pregnancy_announcement_the_child_will_be_a_bastard:0 "A criança de [mother.GetTitledFirstNamePossessiveNoTooltip] nascerá um [bastard|E] com [real_father.GetTitledFirstNameNoTooltip] como pai"
 pregnancy_announcement_the_child_will_be_a_bastard_real_father:0 "A criança de [mother.GetTitledFirstNamePossessiveNoTooltip] nascerá um [bastard|E], comigo como pai conhecido"
 pregnancy_not_first_child_message:0 "Sua [spouse.Custom2('RelationToMe', SCOPE.sC('mother'))], [mother.GetTitledFirstName], está esperando seu filho"
 pregnancy_not_first_child_message_title:0 "[spouse.Custom2('RelationToMe', SCOPE.sC('mother'))|U] Fica Grávida"
 pregnancy_treatment_fails_tt:0 "O tratamento falha"
 reveal_illegitimate_pregnancy_to_real_father_tt:0 "O segredo é revelado para [real_father.GetFirstName]"
 search_for_real_father_tt:0 "#F Vou procurá-lo!#!"
