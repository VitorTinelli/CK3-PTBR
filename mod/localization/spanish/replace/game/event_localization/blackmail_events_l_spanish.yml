l_spanish:
 blackmail.0001.a:0 "Uma ameaça foi feita, e só pode haver um desfecho..."
 blackmail.0001.b:0 "Odeio admitir, mas não posso revelar esse segredo."
 blackmail.0001.desc:0 "Seja por um senso equivocado de orgulho ou medo de alguma represália maior, [recipient.GetTitledFirstName] afirma que eu não tenho influência sobre [recipient.GetSheHe]!"
 blackmail.0001.t:0 "Chantagem Recusada!"
 blackmail.0001.toast_puppeteer:0 "[recipient.GetShortUIName] recusou a chantagem de [puppet_or_actor.GetShortUINamePossessive]"
 blackmail.1001.a:0 "#EMP Todos#! eles deveriam ter medo de mim..."
 blackmail.1001.b:0 "\"Asseguro a todos vocês, nada inapropriado está acontecendo!\""
 blackmail.1001.desc:0 "Meus vassalos não sabem nada sobre minha chantagem, mas eles notaram como minha vítima, [blackmail_target.GetTitledFirstName], age ao meu redor. Eles viram o medo que passa pelos olhos [blackmail_target.GetHerHim]..."
 blackmail.1001.t:0 "Medo do Desconhecido"
 blackmail.1002.a:0 "Eu fico acordado à noite preocupado."
 blackmail.1002.b:0 "Tudo vai ficar bem, [blackmailer.GetFirstNameNoTooltip] me disse!"
 blackmail.1002.desc:0 "A ameaça de ser exposto está constantemente em minha mente. [blackmailer.GetTitledFirstName] sabe demais sobre mim, e as consequências de recusar qualquer uma de suas exigências são grandes demais para sequer contemplar.\n\nEstou seguro, mesmo se eu fizer isso?"
 blackmail.1002.t:0 "A Sombra Imponente"
