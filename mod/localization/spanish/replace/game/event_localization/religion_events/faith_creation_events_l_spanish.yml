l_spanish:
 faith_creation.1001.desc.belief.aniconism:0 "rejeitam o uso de qualquer simbolismo religioso, afirmando que meras efígies não podem capturar a grandeza de [reformed_faith.HighGodName]."
 faith_creation.1001.desc.belief.ascetic:0 "estão promovendo o ascetismo entre seus seguidores, afirmando que as buscas materialistas bloqueiam o caminho para a realização espiritual."
 faith_creation.1001.desc.belief.charity:0 "exigem que seus seguidores respondam às dificuldades com caridade, cuidando dos pobres, dos doentes e dos estrangeiros."
 faith_creation.1001.desc.belief.christology:0 "resolveram uma grande questão doutrinária, fixando a própria natureza do divino em termos que todos os fiéis são obrigados a professar."
 faith_creation.1001.desc.belief.community:0 "a nova fé fundiu-se com as tradições culturais de seus adeptos, formando comunidades próximas de [reformed_faith.GetAdherentNamePluralNoTooltip] que hesitam em aceitar estranhos."
 faith_creation.1001.desc.belief.fallback:0 "estão pedindo a todos os adeptos que deixem de lado antigas disputas e se unam em prol da nova fé."
 faith_creation.1001.desc.belief.family:0 "consideram os laços de sangue sagrados, ensinando que honrar os antepassados e criar muitos filhos é adoração em si mesma."
 faith_creation.1001.desc.belief.hierarchy:0 "ensinam que todas as coisas têm seu devido lugar, e que a harmonia só flui quando cada alma honra a ordem acima de si."
 faith_creation.1001.desc.belief.iconoclasm:0 "insistem que os ídolos terrenos que imitam as visagens divinas sejam derrubados e queimados onde quer que sejam encontrados."
 faith_creation.1001.desc.belief.incest:0 "estão sancionando casamentos entre parentes próximos, afirmando que os laços familiares são sagrados e abençoados."
 faith_creation.1001.desc.belief.indulgent:0 "estão incentivando os adeptos a se entregarem aos desejos da carne e viverem suas vidas ao máximo."
 faith_creation.1001.desc.belief.law:0 "colocam a lei sagrada acima de todas as coisas, insistindo que cada linha da doutrina seja obedecida exatamente."
 faith_creation.1001.desc.belief.learning:0 "prezam o aprendizado acima de quase tudo, ensinando que estudar o mundo é conhecer a mente de [reformed_faith.HighGodName] de forma mais verdadeira."
 faith_creation.1001.desc.belief.militant:0 "ensinam que os fiéis são soldados acima de tudo, enviados para espalhar a fé no fio da espada."
 faith_creation.1001.desc.belief.missionary:0 "juraram levar seus ensinamentos a cada canto da terra, para que nenhuma alma permaneça na escuridão."
 faith_creation.1001.desc.belief.nature:0 "têm grande respeito pela própria natureza, buscando preservá-la e protegê-la daqueles que a explorariam para seu próprio ganho."
 faith_creation.1001.desc.belief.pain:0 "ensinam que a carne deve ser humilhada por meio de dificuldades e dor, pois o sofrimento purifica a alma e aproxima os fiéis de [reformed_faith.HighGodName]."
 faith_creation.1001.desc.belief.penance:0 "ensinam que cada alma nasce com uma mancha que só é limpa por meio da confissão e da penitência."
 faith_creation.1001.desc.belief.rebirth:0 "ensinam que a alma cavalga uma grande roda de renascimento, com cada vida moldada pelos atos da anterior."
 faith_creation.1001.desc.belief.sacraments:0 "ensinam que a graça sagrada flui para a humanidade apenas através dos ritos sagrados e dos poucos ordenados."
 faith_creation.1001.desc.belief.sacred_sites:0 "constroem grandes monumentos de pedra como testamentos de sua devoção, solo sagrado feito para durar gerações."
 faith_creation.1001.desc.belief.sacrifice:0 "afirmam que a única forma de demonstrar devoção adequada é honrar [reformed_faith.HighGodName] com sacrifícios humanos!"
 faith_creation.1001.desc.belief.spirits:0 "solicitaram a ajuda dos espíritos para orientar os fiéis nestes tempos turbulentos."
 faith_creation.1001.desc.belief.superstition:0 "muitas superstições antigas e histórias míticas foram canonizadas na doutrina oficial."
 faith_creation.1001.desc.belief.syncretic:0 "tecem as crenças de seus vizinhos em seu credo, confiando que muitos caminhos levam à mesma verdade."
 faith_creation.1001.desc.belief.veneration:0 "veneram os santos falecidos como intercessores, honrando suas relíquias e invocando seus nomes em oração."
 faith_creation.1001.desc.belief.worldly:0 "adotam uma abordagem pragmática da devoção, confiando que donativos, compromissos e silêncios bem colocados servem à fé tanto quanto a oração."
 faith_creation.1001.desc.no_head:0 "\n\nO movimento crescente decidiu não estabelecer um líder religioso, preferindo permitir que cada [reformer.Custom('DefaultPriestTitle')] determine quais ensinamentos são apropriados para seu próprio [reformed_faith.HouseOfWorship]."
 faith_creation.1001.desc.no_holy_sites:0 "\n\nOs [reformed_faith.GetAdherentNamePluralNoTooltip] aguardam ansiosamente a chegada profetizada de seu [reformed_faith.ReligiousHeadName], um grande líder que reunirá todos os fiéis e trará uma nova era dourada para [reformed_faith.GetAdjectiveNoTooltip]."
 faith_creation.1001.desc.outlook.accepting:0 "\n\nEsses [reformer.Custom('DefaultPriestTitlePlural')] [reformed_faith.GetAdjectiveNoTooltip] estão incentivando a cooperação e tolerância, inclusive em relação aos não-crentes, e"
 faith_creation.1001.desc.outlook.dogmatic:0 "\n\nEsses [reformer.Custom('DefaultPriestTitlePlural')] declararam [reformed_faith.GetNameNoTooltip] como a única e verdadeira fé, e"
 faith_creation.1001.desc.outlook.fallback:0 "\n\nEsses [reformer.Custom('DefaultPriestTitlePlural')] [reformed_faith.GetAdjectiveNoTooltip] adotaram uma visão pragmática e equilibrada em relação a outras religiões e"
 faith_creation.1001.desc.outlook.ghw:0 "\n\n[reformer.Custom('DefaultPriestTitlePlural')] impassionados já estão falando em lançar [reformed_faith.GHWNamePlural] para espalhar sua nova fé pelo mundo e"
 faith_creation.1001.desc.outlook.pacifism:0 "\n\nEsses [reformer.Custom('DefaultPriestTitlePlural')] [reformed_faith.GetAdjectiveNoTooltip] condenaram a violência e derramamento de sangue, afirmando que a guerra só leva ao sofrimento e ao ódio, e"
 faith_creation.1001.desc.reformation.personal:0 "Finalmente, consegui reunir todos os importantes [reformer.Custom('DefaultPriestTitle')] do mundo para que possamos discutir nossas crenças e estabelecer uma doutrina oficial para guiar nossa fé no futuro."
 faith_creation.1001.desc.reformation:0 "[reformer.GetTitledFirstName], uma figura proeminente entre os [reformed_faith.GetAdherentNamePlural], reuniu todos os [reformer.Custom('DefaultPriestTitle')] da terra para discutir suas crenças e estabelecer uma doutrina oficial para a fé pagã."
 faith_creation.1001.desc.schism.hof:0 "[reformer.GetTitledFirstName] rejeitou a autoridade de [old_hof.GetTitledFirstName] e afasta os seguidores de [reformer.GetHerHis] de [old_faith.GetName]. Seu rito [old_rite.GetAdjective] cresceu e se tornou uma fé que agora responde apenas a si mesma."
 faith_creation.1001.desc.schism.personal.hof:0 "Não me ajoelharei mais enquanto [old_hof.GetTitledFirstName] e os [old_faith.GetAdjective] [old_faith.AltPriestTermPlural] lideram os fiéis ao erro. Reuni [reformer.Custom('DefaultPriestTitlePlural')] que compartilham de minha convicção e, a partir do rito [old_rite.GetAdjective] que mantivemos, forjamos uma fé que não deve nada a [old_faith.GetName]."
 faith_creation.1001.desc.schism.personal:0 "Os [old_faith.AltPriestTermPlural] da [old_faith.GetAdjective] perderam o rumo e não podem mais ser confiáveis para nos guiar. Para remediar isso, reuni um grupo seleto de [reformer.Custom('DefaultPriestTitlePlural')] para discutir o futuro de nossa fé."
 faith_creation.1001.desc.schism:0 "Um novo cisma dentro da [reformed_faith.GetReligion.GetName] ocorreu quando [Select_CString( reformer.IsFemale, 'a', 'o' )] [reformer.GetTitledFirstName] e seus seguidores se separaram da fé [old_faith.GetAdjective] para formar um novo movimento religioso."
 faith_creation.1001.desc.spiritual.sameold:0 "\n\nOs [reformer.Custom('DefaultPriestTitlePlural')] [reformed_faith.GetAdjectiveNoTooltip] escolheram manter [Select_CString( reformed_hof.IsFemale, 'a', 'o' )] [reformed_hof.GetFirstNameNoTooltip] como seu [reformed_faith.ReligiousHeadName], [reformer.GetSheHe] continuará a determinar a doutrina religiosa e arbitrar disputas entre diferentes religiões em todo o mundo [reformed_faith.GetAdjectiveNoTooltip]."
 faith_creation.1001.desc.spiritual:0 "\n\nOs [reformer.Custom('DefaultPriestTitlePlural')] [reformed_faith.GetAdjectiveNoTooltip] escolheram [Select_CString( reformed_hof.IsFemale, 'a', 'o' )] [reformed_hof.GetFirstNameNoTooltip] como seu novo [reformed_faith.ReligiousHeadName], que determinará a doutrina religiosa e arbitrá disputas entre diferentes religiões em todo o mundo [reformed_faith.GetAdjectiveNoTooltip]."
 faith_creation.1001.desc.temporal.personal:0 "\n\nEscolhi liderar pessoalmente este crescente movimento [reformed_faith.GetAdjectiveNoTooltip] e assumi o título de [reformed_faith.ReligiousHeadName], uma posição exaltada que passarei para meus descendentes."
 faith_creation.1001.desc.temporal:0 "\n\n[reformer.GetFirstNameNoTooltip] escolheu liderar pessoalmente este crescente movimento [reformed_faith.GetAdjectiveNoTooltip] e assumiu o título de [reformed_faith.ReligiousHeadName], uma posição exaltada que [reformer.GetSheHe] deve passar para seu herdeiro."
 faith_creation.1001.o.crusader:0 "Uma ou duas [ROOT.Char.GetFaith.GHWName] colocarão esses [second.Custom('GetUnbelieverNamePlural')] em seu lugar!"
 faith_creation.1001.o.free_holy_site_actions:0 "Ganhe #V [reformed_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#! ações gratuitas para criar, rebaixar, elevar, adotar ou abandonar [holy_sites|E]"
 faith_creation.1001.o.frightened:0 "[ROOT.Char.GetFaith.random_GoodGodNames] nos salve desses [second.Custom('GetUnbelieverNamePlural')] sedentos de sangue!"
 faith_creation.1001.o.getreaction:0 "[ROOT.Char.Custom2('GetFaithCreationReaction', reformer)]"
 faith_creation.1001.o.heretical:0 "Esses hereges pagarão pelos crimes cometidos contra [ROOT.Char.GetFaith.HighGodName]!"
 faith_creation.1001.o.interested:0 "Devemos ficar de olho nesse novo desenvolvimento..."
 faith_creation.1001.o.personal:0 "O mundo verá que [ROOT.Char.GetFaith.HighGodName] nos favorece!"
 faith_creation.1001.o.uninterested:0 "Não importa no que esses [second.Custom('GetUnbelieverNamePlural')] acreditam."
 faith_creation.1001.t.reformation:0 "A Reforma do [reformed_faith.GetAdjectiveNoTooltip]"
 faith_creation.1001.t.schism:0 "O Cisma do [reformed_faith.GetAdjectiveNoTooltip]"
 faith_creation.1002.a.founder:0 "O caminho sempre foi nosso — agora o nome também é."
 faith_creation.1002.a.free_holy_site_actions:0 "[new_faith.GetName] ganha #V [new_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#! ações gratuitas para criar, rebaixar, elevar, adotar ou abandonar [holy_sites|E]"
 faith_creation.1002.a.lost_ecumenism:0 "[new_faith.GetName] perde [GetDoctrineType('special_doctrine_ecumenical_christian').GetBaseName]"
 faith_creation.1002.a:0 "Nossa própria fé, enfim."
 faith_creation.1002.b.hof:0 "Que aprendam quão frio é o mundo fora do rebanho."
 faith_creation.1002.b:0 "Hereges, agora e para sempre."
 faith_creation.1002.consequences.tt:0 "[new_faith.GetName] é uma [faith|E] totalmente separada:\n$EFFECT_LIST_BULLET$Todos os [characters|E] e [counties|E] da [rite|E] iniciadora pertencem à nova fé\n$EFFECT_LIST_BULLET$[faith_hostility|E] se aplica entre [new_faith.GetName] e [old_faith.GetName], o que pode permitir [holy_wars|E]\n$EFFECT_LIST_BULLET$O [faiths|E] não compartilham mais um [head_of_faith|E]"
 faith_creation.1002.desc.anathema.hof:0 "\n\n[old_hof.GetTitledFirstName] profere o julgamento: o rebanho desobediente é banido, cortado pela raiz."
 faith_creation.1002.desc.anathema.no_hof:0 "\n\nOs [old_faith.AltPriestTermPlural] de [old_faith.GetName] proferem julgamento de cada altar: o rebanho desobediente é banido, cortado pela raiz."
 faith_creation.1002.desc.intro.founder:0 "Meu rito [old_rite.GetAdjective] desviou-se — oração por oração, princípio por princípio — e deixou de ser [old_faith.GetName]."
 faith_creation.1002.desc.intro.member:0 "Nosso rito [old_rite.GetAdjective] desviou-se sob [founder.GetTitledFirstName] — oração por oração, princípio por princípio — e deixou de ser [old_faith.GetName]."
 faith_creation.1002.desc.intro.observer:0 "O rito [old_rite.GetAdjective] de [founder.GetTitledFirstName] desviou-se — oração por oração, princípio por princípio — e deixou de ser [old_faith.GetName]."
 faith_creation.1002.desc.new_head.founder:0 "Aqueles a quem seguiram no exílio, continuam a seguir — [founder.GetFirstNameNoTooltip], [new_faith.ReligiousHeadName|U] de [new_faith.GetName]."
 faith_creation.1002.desc.new_head.none:0 "O novo rebanho carece de qualquer pastor; seus [new_faith.AltPriestTermPlural] respondem apenas a si mesmos."
 faith_creation.1002.desc.new_head.other:0 "[new_hof.GetTitledFirstName] agora atua como [new_faith.ReligiousHeadName|U] de [new_faith.GetName]."
 faith_creation.1002.desc.new_head.personal:0 "O fardo de tudo o que se segue é meu: sou, enquanto eu viver, [new_faith.ReligiousHeadName|U] de [new_faith.GetName]."
 faith_creation.1002.desc.outro.new_faith:0 "\n\nUma fé de nossa autoria, uma lei de nossa autoria — um credo recentemente vocalizado, mas que já pode ser respondido por [old_faith.GetAdherentNamePlural] com censura e com a espada."
 faith_creation.1002.desc.outro.old_faith:0 "\n\nTodas as terras e almas que professam [old_rite.GetName] renunciam a [old_faith.GetName] em uma única proclamação. Eles são estranhos para nós a partir de agora — e logo, talvez, inimigos também."
 faith_creation.1002.t.new_faith:0 "Uma Fé Só Nossa"
 faith_creation.1002.t:0 "Um Rito Arrancado"
 faith_creation.1010.a:0 "Glória a [faith.HighGodName]!"
 faith_creation.1010.desc.end.personal:0 "\n\nCom os fiéis finalmente unidos sob minha liderança, conduzirei [faith.GetNameNoTooltip] para uma nova era dourada!"
 faith_creation.1010.desc.end:0 "\n\nCom os fiéis finalmente unidos sob um único líder, parece que uma nova era dourada para [faith.GetNameNoTooltip] está à nossa frente."
 faith_creation.1010.desc.spiritual:0 "os [faith.AltPriestTermPlural] se reuniram para eleger [Select_CString( HoF.IsFemale, 'a', 'o' )] [HoF.GetFirstName] como o único [faith.ReligiousHeadName]."
 faith_creation.1010.desc.start:0 "Embora a retidão de nossa fé nunca estivesse em dúvida, o período em que fomos forçados a suportar a falta de um líder espiritual foi difícil. Finalmente, porém, esse sofrimento acabou, pois"
 faith_creation.1010.desc.temporal.personal:0 "Finalmente consegui convencer os [faith.AltPriestTermPlural] a me aceitarem como o único [faith.ReligiousHeadName]."
 faith_creation.1010.desc.temporal:0 "[HoF.GetTitledFirstName] conseguiu convencer os [faith.AltPriestTermPlural] a aceitá-lo como o único [faith.ReligiousHeadName]."
 faith_creation.1010.t:0 "[HoF.GetFirstNameNoTooltip] Declarad[Select_CString( HoF.IsFemale, 'a', 'o' )] [faith.ReligiousHeadName|U]"
 faith_creation.1011.message.desc:0 "Os [faith.AltPriestTermPlural] [faith.GetAdjective] proclamaram [faith.ReligiousHeadName|U] [HoF.GetFirstName] como [head_of_faith|E]."
 faith_creation.1011.message.title:0 "Líder Religioso Estabelecido"
 faith_creation.1021.a.founder:0 "Que se espalhe silenciosamente entre os devotos."
 faith_creation.1021.a:0 "Uma fé viva tem espaço para muitos ritos."
 faith_creation.1021.b.founder:0 "Que todo o reino fique sabendo."
 faith_creation.1021.b:0 "Toda heresia começa como uma novidade."
 faith_creation.1021.desc.differing.doctrine:0 "A diferença mais marcante é [differing_doctrine.GetDescriptiveName]."
 faith_creation.1021.desc.differing.fallback:0 "Nenhuma prática isolada marca a divisão."
 faith_creation.1021.desc.differing.tenet:0 "A diferença mais marcante é [differing_tenet.GetBaseName]."
 faith_creation.1021.desc.divergence.major:0 "\n\nSuas práticas distanciam-se o suficiente de [source_rite.GetAdjectiveNoTooltip] para despertar suspeitas."
 faith_creation.1021.desc.divergence.minor:0 "\n\nDifere de [source_rite.GetAdjective] apenas em pequenas coisas."
 faith_creation.1021.desc.divergence.moderate:0 "\n\nPara aqueles que seguem [source_rite.GetName], as práticas deste novo rito são bastante estranhas."
 faith_creation.1021.desc.intro.founder:0 "[new_rite.GetName] está firmemente estabelecido, e seus seguidores olham para mim. Permanecemos [old_faith.GetAdherentNamePlural], embora tenhamos nos separado de [source_rite.GetName]."
 faith_creation.1021.desc.intro.observer:0 "[founder.GetTitledFirstName] estabeleceu um novo rito dentro de [old_faith.GetName]. Conhecido por seus seguidores como [new_rite.GetName], ele mantém a fé [old_faith.GetAdjective]... à sua própria maneira."
 faith_creation.1021.desc.outro.founder.branch:0 "\n\nSempre fomos um ramo derivado; daqui em diante somos um ramo de nossa própria criação, e guiamo-nos a nós mesmos."
 faith_creation.1021.desc.outro.founder.mainline:0 "\n\nNós nos afastamos do rito principal, a própria medida pela qual [old_faith.GetNameNoTooltip] julga todos os outros. Se chamarem isso de presunção, que assim seja."
 faith_creation.1021.desc.outro.observer:0 "\n\nNovos ritos surgem com frequência suficiente. Este pode criar raízes, murchar ou degenerar em heresia; o tempo dirá."
 faith_creation.1021.t.founder:0 "Um Rito Próprio"
 faith_creation.1021.t:0 "Um Rito Dentro do Seio"
