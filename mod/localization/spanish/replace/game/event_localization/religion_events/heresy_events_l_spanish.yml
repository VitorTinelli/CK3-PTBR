l_spanish:
 heresy.0010.a.astray_faith:0 "Não entendo, mas suponho que isso os faça felizes?"
 heresy.0010.a.existing_heresy:0 "Esses hereges vis os desviaram!"
 heresy.0010.a.new_heresy:0 "Que zombaria distorcida de nossa fé é essa!?"
 heresy.0010.a.same_faith:0 "Eu sabia que eles veriam a luz eventualmente!"
 heresy.0010.b:0 "Sabe, eles têm alguns bons argumentos..."
 heresy.0010.desc.exists:0 "\n\nTendo se desiludido com os ensinamentos dos [origin_faith.PriestMalePlural] [origin_faith.GetAdjective], os nobres de [heretic_title.GetNameNoTierNoTooltip] não consideram mais os [origin_faith.AltPriestTermPlural] como justos e verdadeiros e estão se distanciando de suas antigas instituições religiosas. Eles agora se proclamam [heretic_faith.GetAdherentNamePluralNoTooltip], cujas doutrinas eles acreditam estarem mais alinhadas com a vontade de [heretic_faith.HighGodNamePossessive]."
 heresy.0010.desc.nonexistant:0 "\n\nTendo se desiludido com os ensinamentos dos [origin_faith.PriestMalePlural] [origin_faith.GetAdjective], os nobres de [heretic_title.GetNameNoTierNoTooltip] não consideram mais os [origin_faith.AltPriestTermPlural] como justos e verdadeiros. Como [heretic_faith.GetAdherentNamePluralNoTooltip], eles acreditam que sua nova fé está alinhada com a vontade de [heretic_faith.HighGodName] e estão se distanciando de suas antigas instituições religiosas."
 heresy.0010.desc.resurgent:0 "\n\nTendo se desiludido com os ensinamentos dos [origin_faith.PriestMalePlural] [origin_faith.GetAdjective], os nobres de [heretic_title.GetNameNoTierNoTooltip] não consideram mais os [origin_faith.AltPriestTermPlural] como justos e verdadeiros. Como resultado, os nobres de [heretic_title.GetNameNoTierNoTooltip] reviveram os ensinamentos abandonados dos [heretic_faith.GetAdherentNamePluralNoTooltip], cujas doutrinas eles acreditam estarem mais alinhadas com a vontade de [heretic_faith.HighGodNamePossessive]."
 heresy.0010.desc:0 "[heretic_ruler.GetTitledFirstName] de [heretic_title.GetNameNoTier] anunciou ao mundo que ele e seus vassalos se converteram à fé de [heretic_faith.GetName]."
 heresy.0010.notification.title:0 "Novo Movimento Religioso"
 heresy.0010.notification:0 "[heretic_ruler.GetFullName] fundou um novo movimento [heretic_faith.GetAdjective]!"
 heresy.0010.t:0 "Heresia: [heretic_faith.GetAdherentNamePluralNoTooltip] em [heretic_title.GetNameNoTierNoTooltip]"
 heresy.0010.tt.custom:0 "[heretic_faith.GetName|V] aparece em [heretic_title.GetName]"
 heresy.0011.notification.heresy:0 "[convert_ruler.Custom2('HierarchicalStatus', me)] Abraça a Heresia: [convert_ruler.GetShortUINameNoTooltip]"
 heresy.0011.notification.other:0 "[convert_ruler.Custom2('HierarchicalStatus', me)] Muda de Fé: [convert_ruler.GetShortUINameNoTooltip]"
 heresy.0011.notification.same_faith:0 "[convert_ruler.Custom2('HierarchicalStatus', me)] Abraça a Verdadeira Fé: [convert_ruler.GetShortUINameNoTooltip]"
