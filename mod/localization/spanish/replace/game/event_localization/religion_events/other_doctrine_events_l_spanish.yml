l_spanish:
 convert_to_crypto_religion:0 "Converter para a Fé Secreta-#D Religião#!"
 convert_to_crypto_religion_action:0 "Converter"
 convert_to_crypto_religion_desc:0 "Vou disseminar a sabedoria de [SCHEME.GetOwner.GetSecretFaith.KnowledgeGodName] para [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] e tornar [SCHEME.GetTargetCharacter.GetSheHe] um crente secreto de [SCHEME.GetOwner.GetSecretFaith.GetNameNoTooltip]."
 convert_to_crypto_religion_desc_general:0 "Ensinar um alvo a se tornar um crente secreto de [CHARACTER.GetSecretFaith.GetName]."
 convert_to_crypto_religion_general_desc:0 "Um [scheme|E] para introduzir uma fé secreta a um alvo na esperança de aumentar a congregação secreta do proprietário."
 convert_to_crypto_religion_interaction:0 "$convert_to_crypto_religion_interaction_key$ #weak (Esquema)#!"
 convert_to_crypto_religion_interaction_desc:0 "Tentar fazer de [recipient.GetShortUINameNoTooltip] um crente secreto de [actor.GetSecretFaith.GetName]"
 convert_to_crypto_religion_interaction_key:0 "Converter para a Fé Secreta de [actor.GetSecretFaith.GetNameNoTooltip]"
 convert_to_crypto_religion_interaction_notification:0 "$convert_to_crypto_religion_interaction_key$"
 convert_to_crypto_religion_invalid:0 "Não posso mais converter [target.GetShortUIName|U] para a Fé Secreta de [CHARACTER.GetSecretFaith.GetName] anymore."
 convert_to_crypto_religion_key:0 "Converter para a Fé Secreta de [ROOT.Char.GetSecretFaith.GetNameNoTooltip]"
 convert_to_crypto_religion_no_more_secret:0 "Eu não pratico mais a Fé Secreta de [CHARACTER.GetSecretFaith.GetName]."
 convert_to_crypto_religion_scheme_invalidated_title:0 "@scheme_icon! \"O Esquema $convert_to_crypto_religion$ Termina"
 event_false_convert_interface.desc:0 "[ROOT.Char.GetShortUIName] renunciou a sua fé pública pelo [ROOT.Char.GetFaith.GetName], revelando-se como um cripto-religioso."
 event_false_convert_my_liege.t:0 "Senhor Feudal Revelou Cripto-Fé"
 event_false_convert_my_vassal.t:0 "Vassalo Revelou Cripto-Fé"
 event_false_converts.t:0 "Cripto-Religiosos Revelados"
 event_false_converts_counties_only.desc:0 "[ROOT.Var('num_false_converts_counties').GetValue|V0] condados em meu reino possuíam extensas comunidades cripto-[ROOT.Char.GetFaith.GetAdherentNameNoTooltip], e muitos deles declararam sua fé ao lado da minha."
 event_false_converts_plus_counties.desc:0 "[ROOT.Var('num_false_converts_vassal').GetValue|V0] dos meus vassalos com terras renunciaram a sua fé pública.\n\n[ROOT.Var('num_false_converts_landless').GetValue|V0] personagens sem terras em minha corte renunciaram a sua fé pública.\n\n[ROOT.Var('num_false_converts_counties').GetValue|V0] dos meus condados possuíam extensas comunidades de cripto-[ROOT.Char.GetFaith.GetAdherentNameNoTooltip], e muitos deles declararam sua fé ao lado da minha."
 event_false_converts_without_counties.desc:0 "[ROOT.Var('num_false_converts_vassal').GetValue|V0] dos meus vassalos com terras renunciaram a sua fé pública.\n\n[ROOT.Var('num_false_converts_landless').GetValue|V0] personagens sem terras em minha corte renunciaram a sua fé pública."
 false_conversion.0020.a:0 "[old_faith.HighGodName] conhece meu coração!"
 false_conversion.0020.b:0 "Não, ainda não é o momento certo."
 false_conversion.0020.c:0 "$false_conversion.0020.a$"
 false_conversion.0020.desc:0 "Na minha vida pública, sigo o [ROOT.Char.GetFaith.GetNameNoTooltip] à risca. Assino os valores [ROOT.Char.GetFaith.GetAdjectiveNoTooltip], leio o [ROOT.Char.GetFaith.ReligiousText] [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] e vou aos [ROOT.Char.GetFaith.HouseOfWorshipPlural] [ROOT.Char.GetFaith.GetAdjectiveNoTooltip].\n\nNo entanto, a portas fechadas, acho difícil deixar para trás os ensinamentos de [old_faith.GetNameNoTooltip] e uma parte de mim deseja praticar abertamente os antigos caminhos.\n\nTalvez seja hora de reafirmar minha identidade como [old_faith.GetAdherentNameNoTooltip], trazendo comigo outros adeptos secretos e conversos recentes que puder encontrar?"
 false_conversion.0020.desc_landless:0 "Até este momento, tenho seguido o [ROOT.Char.GetFaith.GetNameNoTooltip] à risca. Assino os valores de [ROOT.Char.GetFaith.GetAdjectiveNoTooltip], leio a [ROOT.Char.GetFaith.ReligiousText] [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] e frequento [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetFaith.HouseOfWorshipPlural].\n\nPorém, a portas fechadas, sinto dificuldade em abandonar os ensinamentos de [old_faith.GetNameNoTooltip], e uma parte de mim anseia por retornar aos velhos costumes.\n\nTalvez agora seja a hora de reafirmar minha identidade [old_faith.GetAdherentNameNoTooltip] e enraizá-la em minha [ROOT.Char.Custom('GetCourt')|l]?"
 false_conversion.0020.t:0 "Cripto-[old_faith.GetNameNoTooltip]"
 false_conversion.0030.a.tt:0 "Serei informado quantos, se houver, cripto-religiosos aceitam minha oferta."
 false_conversion.0030.a:0 "Todos devem ser livres para adorar o divino!"
 false_conversion.0030.b_has_secret_faith:0 "Algumas coisas são melhores mantidas em segredo."
 false_conversion.0030.b_no_secret_faith:0 "Cripto-o quê? Isso é absurdo."
 false_conversion.0030.desc_end:0 "É claro que, como [ROOT.Char.GetTitleAsNameNoTooltip], eu poderia decretar uma anistia pública para todos os falsos convertidos..."
 false_conversion.0030.desc_has_secret_faith:0 "Eu mesmo tenho dificuldade em abrir mão de muitos dos rituais e crenças de [old_faith.GetNameNoTooltip]. Embora nunca admitisse minha adoração contínua em público, meu coração ainda se compadece com a situação desses grupos secretos de cripto-religiosos.\n\n"
 false_conversion.0030.desc_no_secret_faith:0 "Embora eu seja um fiel [ROOT.Char.GetFaith.GetAdherentNameNoTooltip], minha fé sempre defendeu o ideal do pluralismo, e é lamentável que alguns sintam que devem ocultar sua adoração por medo de perseguição.\n\n"
 false_conversion.0030.desc_no_secret_faith_not_pluralist:0 "Alguns desses crentes secretos podem ser [ROOT.Char.GetFaith.GetAdherentNameNoTooltip], forçados a se esconder nas sombras há muito tempo por perseguição religiosa.\n\n"
 false_conversion.0030.desc_start:0 "Chegaram aos meus ouvidos histórias sobre alguns em meu reino que praticam secretamente religiões escondidas, em parte ou completamente.\n\n"
 false_conversion.0030.t:0 "Anistia para Cripto-Religiosos"
 false_conversion.0031.a:0 "Finalmente, emergimos das sombras!"
 false_conversion.0031.b:0 "Já ouvimos mentiras de tolerância antes..."
 false_conversion.0031.desc:0 "[Select_CString( ROOT.Char.GetLiege.IsFemale, 'Minha senhora', 'Meu senhor' )], [ROOT.Char.GetLiege.GetTitledFirstName], emitiu um aviso geral em todo o [ROOT.Char.GetLiege.GetPrimaryTitle.GetNameNoTier] desejando que todos adorem o divino abertamente, independentemente da natureza de sua fé. [ROOT.Char.GetLiege.GetSheHe|U] está oferecendo anistia para aqueles que praticam suas religiões em segredo."
 false_conversion.0031.t:0 "$false_conversion.0030.t$"
 false_conversion.1000.a:0 "Os velhos costumes morrem hoje."
 false_conversion.1000.b_plural:0 "Mantemos o [actor.GetFaith.GetNameNoTooltip] em nossos lábios, mas o [ROOT.Char.GetFaith.GetNameNoTooltip] em nossos corações."
 false_conversion.1000.b_sanctioned_plural:0 "[ROOT.Char.GetFaith.HighGodName] nos perdoará por praticar o [ROOT.Char.GetFaith.GetName] em segredo."
 false_conversion.1000.b_sanctioned_single:0 "[ROOT.Char.GetFaith.HighGodName] me perdoará por praticar o [ROOT.Char.GetFaith.GetName] em segredo."
 false_conversion.1000.b_single:0 "Mantenho o [actor.GetFaith.GetNameNoTooltip] em meus lábios, mas o [ROOT.Char.GetFaith.GetNameNoTooltip] em meu coração."
 false_conversion.1000.desc_bold:0 "em desafio secreto."
 false_conversion.1000.desc_convert:0 "converta para o [actor.GetFaith.GetName].\n\n"
 false_conversion.1000.desc_cowardly:0 "por trás do véu."
 false_conversion.1000.desc_forced:0 "[actor.GetSheHe|U] praticamente colocou uma espada no meu pescoço ao exigir isso usando seu gancho contra mim. No entanto, se eu arriscar as consequências, posso continuar praticando o [ROOT.Char.GetFaith.GetName] "
 false_conversion.1000.desc_has_family:0 "e o restante da minha família"
 false_conversion.1000.desc_intro:0 "[actor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] finalmente exigiu que eu"
 false_conversion.1000.desc_outro:0 "\n\nEsta é uma decisão ponderada a ser tomada sozinho..."
 false_conversion.1000.desc_voluntary:0 "Eu aceitei as demandas [actor.GetHerHim], mais ou menos. Mas talvez haja uma maneira de pregar o [actor.GetFaith.GetNameNoTooltip] abertamente e ainda praticar o [ROOT.Char.GetFaith.GetName] "
 false_conversion.1000.t:0 "Um Fim para o [ROOT.Char.GetFaith.GetName]"
 false_conversion.1010.desc_has_no_family:0 "e [spouse.Custom2('MyCharacterIntroduction', ROOT.Char)]"
 false_conversion.1010.desc_outro_demure:0 "\n\nDevo seguir o conselho [Select_CString( spouse.IsFemale, 'da minha', 'do meu' )] "
 false_conversion.1010.desc_outro_wife_husband:0 "?"
 false_conversion.1010.desc_spouse_advises_conversion_cynical:0 "\"Se adoramos o [actor.GetFaith.GetNameNoTooltip] ou o [spouse.GetFaith.GetNameNoTooltip] faz pouca diferença para mim. Mas se [actor.GetTitledFirstNameNoTooltip] deseja que sigamos o [actor.GetFaith.GetNameNoTooltip], por que não?\""
 false_conversion.1010.desc_spouse_advises_conversion_neutral:0 "\"Embora doa dizer isso, não podemos nos dar ao luxo de praticar o [spouse.GetFaith.GetNameNoTooltip], mesmo que seja em segredo. Devemos seguir a vontade de [actor.GetTitledFirstNameNoTooltip] e converter para o [actor.GetFaith.GetNameNoTooltip].\""
 false_conversion.1010.desc_spouse_advises_secrecy:0 "\"Não podemos abandonar [spouse.GetFaith.HighGodName], não importa o que [actor.GetTitledFirstNameNoTooltip] exija. Devemos continuar adorando [spouse.GetFaith.HighGodName], mesmo que seja apenas em segredo.\""
 false_conversion.1010.desc_spouse_disliked:0 "[spouse.GetWifeHusband] [spouse.Custom2('InsultAdjective', ROOT.Char)]"
 false_conversion.1010.desc_spouse_intro:0 "[spouse.GetFirstNameNoTooltip] e eu passamos noites longas tentando evitar as exigências de [actor.GetTitledFirstNamePossessiveNoTooltip] em vão. Finalmente, [spouse.GetFirstNameNoTooltip] fala o que está em sua mente:\n\n"
 false_conversion.1010.desc_spouse_liked:0 "[spouse.Custom('ComplimentAdjective')] [spouse.GetWifeHusband]"
 false_conversion.2000.a:0 "\"[owner.GetSecretFaith.GetName] curará a sua tristeza.\""
 false_conversion.2000.a_failure:0 "[vulnerable_relation.GetTitledFirstNameNoTooltip] se sente insultado pela minha sugestão"
 false_conversion.2000.a_flavor:0 "[vulnerable_relation.GetTitledFirstNameNoTooltip] considerará converter-se secretamente para [owner.GetSecretFaith.GetNameNoTooltip]"
 false_conversion.2000.a_success:0 "[vulnerable_relation.GetTitledFirstNameNoTooltip] encontra consolo em [owner.GetSecretFaith.HighGodName]"
 false_conversion.2000.b:0 "É errado fazer mais do que confortar [vulnerable_relation.GetTitledFirstNameNoTooltip]."
 false_conversion.2000.desc_bridge:0 "se torna aparente.\n\n"
 false_conversion.2000.desc_descriptor_depression:0 "depressão"
 false_conversion.2000.desc_descriptor_grief:0 "tristeza"
 false_conversion.2000.desc_descriptor_stress:0 "estresse"
 false_conversion.2000.desc_intro:0 "Quanto mais tempo passo com [vulnerable_relation.Custom2('MyCharacterIntroduction', owner)], mais a sua avassaladora"
 false_conversion.2000.desc_outro:0 "\n\nTalvez [owner.GetSecretFaith.HighGodName] possa dar nova vida a esta casca rasa..."
 false_conversion.2000.desc_quote_depression:0 "\"Cada dia é mais difícil que o anterior,\" confidencia [vulnerable_relation.GetTitledFirstNameNoTooltip]. \"Como posso continuar assim, com minha vontade de viver lentamente se apagando dos meus olhos?\""
 false_conversion.2000.desc_quote_grief:0 "\"Mesmo as coisas mais pequenas me lembram [deceased_character.GetFirstName],\" lamenta [vulnerable_relation.GetTitledFirstNameNoTooltip]. \"Como posso viver neste mundo sem eles agora?\""
 false_conversion.2000.desc_quote_stress:0 "As aflições diárias da vida se tornaram agonizantes para mim\"\", lamenta [vulnerable_relation.GetTitledFirstNameNoTooltip]. \"Todos os dias eu rezo por algum livramento do meu destino inevitável.\""
 false_conversion.2000.t:0 "Um Momento de Fraqueza"
 false_conversion.2001.a:0 "Então, abraçarei [owner.GetSecretFaith.GetNameNoTooltip] com todo o meu coração!"
 false_conversion.2001.b:0 "O que você está insinuando, [owner.GetTitledFirstNameNoTooltip]?"
 false_conversion.2001.b_flavor:0 "[owner.GetTitledFirstNameNoTooltip] não diz mais nada... por enquanto"
 false_conversion.2001.desc_depression:0 "Os dias se arrastam sem fim com novas alegrias e tristezas de todos ao meu redor. No entanto, aqui permaneço, perdido em um mar de cinzas, afogando-me pelos últimos [vulnerable_relation.GetAge] anos."
 false_conversion.2001.desc_grief:0 "Não passa um dia em que eu não me lembre de [deceased_character.GetTitledFirstName]. Cada lembrança de sua vida neste mundo traz consigo uma nova fonte de tristeza."
 false_conversion.2001.desc_outro:0 "\n\nAssim que começo a me perguntar como posso continuar, [owner.Custom2('RelationToMeAddress', vulnerable_relation)] sussurra em meu ouvido. \"Você só precisa abraçar o poder de cura de [owner.GetSecretFaith.GetName], [vulnerable_relation.Custom2('RelationToMeAddress', owner)], e seus sofrimentos serão esquecidos.\""
 false_conversion.2001.desc_stress:0 "Desenvolvi hábitos involuntários de tremores. Roí as unhas, rangei os dentes, andei exausto antes de deitar acordado na cama. E ainda assim, me vejo sobrecarregado com um estresse além da minha compreensão."
 false_conversion.2001.t:0 "Meu Momento de Necessidade"
 false_conversion.8000.a:0 "Nunca mais duvidarei do [ROOT.Char.GetFaith.GetNameNoTooltip]!"
 false_conversion.8000.b:0 "[ROOT.Char.GetSecretFaith.GetNameNoTooltip] é a única fé verdadeira!"
 false_conversion.8000.desc_disapproving_chaplain:0 "[disapproving_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] está exigindo que eu me arrependa publicamente e me submeta diante de [disapproving_chaplain.GetFaith.HighGodName]."
 false_conversion.8000.desc_intro:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] revelou que pratico [ROOT.Char.GetSecretFaith.GetName] a portas fechadas!"
 false_conversion.8000.desc_outro:0 ""
 false_conversion.8000.desc_silent_chaplain:0 "[silent_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] fica em silêncio sobre o assunto, e assim devo lidar com as exigências de arrependimento por conta própria."
 false_conversion.8000.t:0 "Minha Fé Exposta"
 false_convert_modifier:0 "Suspeitos de Falsos Conversos"
 false_convert_modifier_desc:0 "Muitas comunidades neste condado são suspeitas de ainda praticarem sua antiga fé em segredo."
 relieved_cryptos_modifier:0 "Cripto-Religiosos Aliviados"
 relieved_cryptos_modifier_desc:0 "A população aqui está grata pela permissão para praticar sua fé abertamente mais uma vez."
