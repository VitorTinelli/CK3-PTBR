 order_spreading_tenet_tt_char_2:0 "[tenet_change_2.GetShortUIName] adota [order_tenet.GetName( order_rite )] como um [personal_tenet|E]"
 order_tenet_accepted_list_tt:0 "Alguns [rulers|E] próximos aos monastérios de [holy_order_leader.GetPrimaryTitle.GetAdjective] adotam [order_tenet.GetName( order_rite )] como um [personal_tenet|E]"
 order_took_over_capital_monastery_tt:0 "[holy_order.GetName] assumiu o [lease|E] de [taken_monastery.GetNameNoTier], absorvendo o último de [target_order.GetName]"
 order_took_over_monastery_tt:0 "[holy_order.GetName] assumiu o [lease|E] de [taken_monastery.GetNameNoTier] de [target_order.GetName]"
 recipient_clerical_puppet_req_tt:0 "[recipient.GetShortUIName] deve ser seu [external_clerical_puppet|E]"
 religious_interaction.1.a:0 "Sinto muito, [secondary_recipient.GetFirstNameNoTooltip]."
 religious_interaction.1.a_feud:0 "Seu [recipient.GetFaith.PriestNeuter] maldito! O que você fez?!?"
 religious_interaction.1.a_hook:0 "Livre de um [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))]... e preso a um [recipient.GetTitleAsNameNoTooltip]."
 religious_interaction.1.adultery:0 "com base em adultério."
 religious_interaction.1.consanguinity:0 "com base na consanguinidade."
 religious_interaction.1.desc:0 "Depois de muita oração e deliberação, decidi conceder seu pedido de divórcio de [secondary_recipient.GetFirstNameNoTooltip], [secondary_recipient.GetWifeHusband],"
 religious_interaction.1.different_faith:0 "com base em não aderirem à verdadeira fé."
 religious_interaction.1.eunuch:0 "com base na falta de capacidade adequada."
 religious_interaction.1.fallback:0 "com base em suspeita de adultério."
 religious_interaction.1.opening:0 "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.1.price_feud:0 "\n\nMas isso mal vai dividir vocês dois ao meio, não é? Portanto, enviei acusações vis contra [secondary_recipient.GetFirstName] para toda a Casa [secondary_recipient.GetHouse.GetName], em seu nome.\n\nSua família [actor.Custom2('RelationToMePossessive', SCOPE.sC('secondary_recipient'))] agora parece interessada em uma... #EMP permanente#! separação."
 religious_interaction.1.price_hook:0 "\n\nConsidere o favor que seu [recipient.GetTitleAsName] lhe fez com esta declaração suspeita. Considere também: é tão bom dar quanto receber."
 religious_interaction.1.price_lease:0 "\n\nEste falso pronunciamento tem seu preço: a concessão de [barony_to_lease.GetName] para a [lease_order.GetName]. E se você descartar estes servos da fé, assim como fez com seu [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))]... sua alma estará duplamente manchada."
 religious_interaction.1.price_none:0 "\n\nIsto é uma farsa, é claro. Uma transação sórdida que sujou minha alma. Mas não posso, em boa consciência, forçá-lo a dividir o leito conjugal com [secondary_recipient.GetFirstNameNoTooltip] por mais tempo."
 religious_interaction.1.price_vows:0 "\n\nEstes são fundamentos tênues... e por isso produzi evidências de que, antes de [secondary_recipient.GetSheHe] se tornar seu [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetFirstNameNoTooltip] fez os votos de um [joining_order_title.GetAdjective] [secondary_recipient.Custom('SisterBrother')].\n\nGarantirei pessoalmente a devoção de [secondary_recipient.GetHerHis] até a morte."
 religious_interaction.1000.negative:0 "Muito infeliz..."
 religious_interaction.1000.positive:0 "Estou contente que [recipient.GetFirstNameNoTooltip] tenha visto a sabedoria em meu pedido."
 religious_interaction.1000.strong_negative:0 "Maldição!"
 religious_interaction.1001.a.revoke_tt:0 "[actor.GetTitledFirstName] pode [revoke|E] um de meus títulos"
 religious_interaction.1001.a:0 "Se [actor.GetSheHe] não fosse meu senhor feudal, eu..."
 religious_interaction.1001.desc:0 "[Select_CString( actor.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))], [actor.GetTitledFirstName], me condenou como pecador em um decreto emitido por seus [actor.GetFaith.PriestNeuterPlural]!\n\nIsso pode ser usado como base legal para argumentar que sou inadequado para governar terras [recipient.GetFaith.GetAdjective]."
 religious_interaction.1001.t.fatwa:0 "Fatwa Emitida!"
 religious_interaction.1001.t:0 "Condenação Legal!"
 religious_interaction.1010:0 "É louvável que você procure expiar seus pecados. Aceito sua generosa doação e envio-lhe minha bênção em troca."
 religious_interaction.1010_subordinate:0 "Como seu intercessor nos ouvidos mais sagrados de [actor.GetFaith.GetAdjective], nos corações mais santos de [actor.GetFaith.GetAdjective], passo a você o alívio do fardo de seus pecados.\n\nSua generosa doação lhe rendeu o perdão."
 religious_interaction.1011:0 "Suas transgressões são graves demais para serem redimidas apenas com ouro. Se você realmente deseja expiar seus pecados, deve mudar seus caminhos e provar para mim que busca sinceramente o perdão. Somente assim aceitarei sua doação."
 religious_interaction.1020.a.tt_declaration:0 "#help Ganhe [piety|E]. Após um ano, use #high $declaration_of_repentance_interaction$#! com um clérigo válido. Veja [Concept( 'excommunicated_recovery', 'recovery options' )|E].#!"
 religious_interaction.1020.a.tt_petition:0 "#help Ganhe [piety|E]. Após um ano, peticione ao seu [head_of_faith|E] pessoalmente e escolha #high $petition_head_of_faith_decision_option_repentance$#!. Veja [Concept( 'excommunicated_recovery', 'recovery options' )|E].#!"
 religious_interaction.1020.a:0 "Aceitarei minha penitência e buscarei a absolvição"
 religious_interaction.1020.b.tt:0 "#help Perca [stress|E]. Progresso em direção a [rivalry|E] com [actor.GetShortUIName].#!"
 religious_interaction.1020.b:0 "Amaldiçoe [actor.GetFirstNameNoTooltip] por isso!"
 religious_interaction.1020.c.tt:0 "#help Perca [stress|E]. Progresso em direção a [rivalry|E] com [recipient.GetShortUIName]. [GetTrait('cynical').GetName( GetNullCharacter )], [GetTrait('wrathful').GetName( GetNullCharacter )] e [GetTrait('arbitrary').GetName( GetNullCharacter )] [courtiers|E] aprovam.#!"
 religious_interaction.1020.c:0 "Amaldiçoe o [recipient.GetTitleAsNameNoTooltip] por escutar [actor.GetHerHim]!"
 religious_interaction.1020.empire:0 "Sua reivindicação ao império dividiu a fé [recipient.GetFaith.GetAdjective]. Por insistência de [actor.GetTitledFirstNamePossessive], eu excomunguei você."
 religious_interaction.1020.requested:0 "Ouvi relatos perturbadores de [actor.GetTitledFirstName] sobre seus malfeitos. Por insistência de [actor.GetHerHis], eu o excomunguei da fé [recipient.GetFaith.GetAdjective].\n\nQue [recipient.GetFaith.HighGodName] tenha piedade de sua alma."
 religious_interaction.1020.sin:0 "Relatos perturbadores de [actor.GetTitledFirstName] falam de sua natureza [my_sinful_trait.GetName( ROOT.Char )]. Por insistência de [actor.GetHerHis], eu o excomunguei da fé [recipient.GetFaith.GetAdjective].\n\nQue [recipient.GetFaith.HighGodName] tenha piedade de sua alma."
 religious_interaction.1020:0 "Ouvi notícias perturbadoras de [actor.GetTitledFirstName] sobre suas transgressões."
 religious_interaction.1021.a:0 "Me submeto ao julgamento da Igreja."
 religious_interaction.1021.b.tt:0 "#help Perca [stress|E]. Progresso em direção a [rivalry|E] com [actor.GetShortUIName]. [GetTrait('cynical').GetName( GetNullCharacter )], [GetTrait('wrathful').GetName( GetNullCharacter )] e [GetTrait('arbitrary').GetName( GetNullCharacter )] [courtiers|E] aprovam.#!"
 religious_interaction.1021.b:0 "Minha coroa vem de [recipient.GetFaith.HighGodName], não do [actor.GetTitleAsNameNoTooltip]!"
 religious_interaction.1021.clergy_hostility:0 "Nossa inimizade não é segredo. No entanto, é pelo seu amor ao pecado, pela sua obstinação, que eu o expulso."
 religious_interaction.1021.conclusion:0 "\n\nVocê está excomungado da fé [actor.GetFaith.GetAdjective]. Que [actor.GetFaith.HighGodName] tenha piedade de sua alma."
 religious_interaction.1021.empire:0 "Neste fim dos tempos, você colocou sua ambição acima das necessidades da Cristandade. Sua reivindicação ao império é um cancro no corpo da Igreja!"
 religious_interaction.1021.generic:0 "Todos podemos errar, pois nascemos no pecado. Infelizmente, em você, não vejo sequer uma tentativa de trilhar o caminho de Cristo."
 religious_interaction.1021.sin:0 "Sua natureza [my_sinful_trait.GetName( ROOT.Char )] é conhecida por todos. Não posso permitir que seu exemplo desvie o rebanho."
 religious_interaction.1021:0 "Você pode se chamar de [actor.GetFaith.GetAdherentName], mas suas ações provam que você não segue verdadeiramente o caminho de [actor.GetFaith.HighGodName]. Como não posso permitir que seu comportamento maligno se esconda por trás da máscara da retidão [actor.GetFaith.GetAdjective], não tenho outra escolha senão excomungá-lo da fé. Que [actor.GetFaith.HighGodName] tenha misericórdia de sua alma."
 religious_interaction.1022.toast_puppeteer:0 "[recipient.GetShortUIName] atendeu ao pedido de excomunhão de [puppet_or_actor.GetShortUINamePossessive]"
 religious_interaction.1022:0 "Estou muito perturbado por essas histórias que você conta das transgressões de [secondary_recipient.GetTitledFirstNamePossessive]. Isso me dói, mas concordo que, em prol da fé [actor.GetFaith.GetAdjective], [secondary_recipient.GetSheHe] deve ser excomungado."
 religious_interaction.1023.toast_puppeteer:0 "[recipient.GetShortUIName] recusou o pedido de excomunhão de [puppet_or_actor.GetShortUINamePossessive]"
 religious_interaction.1023:0 "O que você está pensando ao tentar excomungar um companheiro [actor.GetFaith.GetAdherentName]? A fé [actor.GetFaith.GetAdjective] não é uma ferramenta para ser usada em benefício político! Considere-se sortudo por eu não excomungá-lo por fazer tal pedido."
 religious_interaction.1024.positive:0 "Estou contente que [recipient.GetFirstNameNoTooltip] tenha visto a sabedoria nessa ação."
 religious_interaction.1024.toast_puppeteer:0 "[recipient.GetShortUIName] suspendeu a excomunhão de [puppet_or_actor.GetShortUINamePossessive]"
 religious_interaction.1024:0 "Vejo que você realmente se arrependeu de seus pecados e fez grandes esforços para se redimir. Embora suas transgressões contra a fé [actor.GetFaith.GetAdjective] tenham sido graves, suas ações recentes me fazem acreditar que você merece outra chance.\n\nPortanto, eu levanto sua excomunhão e o recebo de volta à fé [actor.GetFaith.GetAdjective]."
 religious_interaction.1025.toast_puppeteer:0 "[recipient.GetShortUIName] recusou suspender a excomunhão de [puppet_or_actor.GetShortUINamePossessive]"
 religious_interaction.1025:0 "Você acha que excomungo as pessoas levianamente? Acha que um pedido de desculpas sem convicção é suficiente para se redimir? Implore o quanto quiser; você não será readmitido na fé [actor.GetFaith.GetAdjective] até provar que mudou seus caminhos malignos."
 religious_interaction.1030:0 "Após muito tempo de contemplação, concluí que suas palavras eram verdadeiras e sábias. Eu me juntarei a uma ordem monástica e começarei uma nova vida em serviço exclusivo a [actor.GetFaith.HighGodName]."
 religious_interaction.1031.toast_puppeteer:0 "[recipient.GetShortUIName] recusou o pedido de [puppet_or_actor.GetShortUINamePossessive] para tomar os votos"
 religious_interaction.1031:0 "Sua sugestão de que eu mude toda a minha vida e me retire para algum mosteiro isolado é absurda. Estou feliz onde estou, e não tenho planos de mudar isso."
 religious_interaction.2.adultery:0 "com base em sua violação da santidade do casamento ao se relacionar com outra pessoa."
 religious_interaction.2.desc:0 "Após muita deliberação, decidi que é do melhor interesse de nossa casa conceder seu pedido de divórcio de [secondary_recipient.GetFirstNameNoTooltip],"
 religious_interaction.2.infertility:0 "com base em sua recusa em consumar o casamento."
 religious_interaction.2.offensive_war:0 "Que estes fundos lhe tragam a vitória em sua guerra contra [war_target.GetTitledFirstName]!"
 religious_interaction.2002.a:0 "Louvado seja [ROOT.Char.GetFaith.HighGodName]!"
 religious_interaction.2002.desc:0 "Decidi seguir você na luz e me converter ao [ROOT.Char.GetFaith.GetName]!"
 religious_interaction.2002.toast_puppeteer:0 "[recipient.GetShortUIName] aceitou a exigência de [puppet_or_actor.GetShortUINamePossessive] para se converter"
 religious_interaction.2003.a:0 "Eu só desejava sua salvação."
 religious_interaction.2003.b:0 "Bem, você pagará o preço neste mundo!"
 religious_interaction.2003.c:0 "Não pense que vou deixar você escapar impune!"
 religious_interaction.2003.d:0 "Ah, acho que você vai acreditar exatamente no que eu disser."
 religious_interaction.2003.desc:0 "Minha fé é forte demais para ser influenciada por suas palavras terrenas. Eu prefiro alcançar minha recompensa em [recipient.GetFaith.DivineRealm]."
 religious_interaction.2003.hooking_out:0 "\n\nGostaria também de lembrá-lo de que você me deve, e é melhor não me perseguir apenas por ser um verdadeiro crente."
 religious_interaction.2003.toast_puppeteer:0 "[recipient.GetShortUIName] recusou a exigência de [puppet_or_actor.GetShortUINamePossessive] para se converter"
 religious_interaction.2011.a:0 "Qualquer coisa pela fé."
 religious_interaction.2011.b:0 "Eu não pagarei por sua salvação eterna!"
 religious_interaction.2011.c:0 "Você fará isso por algo muito mais valioso do que ouro."
 religious_interaction.2011.desc:0 "Eu gostaria de me juntar a você em sua exaltação, mas o custo elevado de reformar [recipient.GetFaith.HouseOfWorshipPlural] e proselitismo entre meus camponeses...\n\nSe você me ajudasse a pagar por esses esforços, eu ficaria mais do que disposto a rezar pelo [ROOT.Char.GetFaith.HighGodName] de você."
 religious_interaction.2011.toast_puppeteer:0 "[recipient.GetShortUIName] recusou a exigência de [puppet_or_actor.GetShortUINamePossessive] a menos que fosse pago em ouro"
 religious_interaction.2012.a:0 "Eu aceito, pelo bem dos fiéis em toda parte."
 religious_interaction.2012.b:0 "Não vou negociar por sua alma!"
 religious_interaction.2012.c:0 "Você tem outras dívidas para me pagar, primeiro."
 religious_interaction.2012.desc:0 "Vejo a sabedoria de sua fé, mas espero que você entenda que é um longo e sinuoso caminho das trevas para a luz.\n\nTalvez, se você prometesse me apoiar de qualquer forma necessária, a jornada seria mais fácil."
 religious_interaction.2012.toast_puppeteer:0 "[recipient.GetShortUIName] recusou a exigência de [puppet_or_actor.GetShortUINamePossessive] a menos que lhe fosse concedido um favor"
 religious_interaction.2015.a:0 "Vou lhe ensinar os caminhos de [actor.GetFaith.GoodGodNames]."
 religious_interaction.2015.b:0 "Você se curvará perante [actor.GetFaith.GoodGodNames] hoje!"
 religious_interaction.2015.c:0 "Talvez você aprenda melhor fazendo."
 religious_interaction.2015.desc:0 "[actor.GetRite.GetName] claramente lhe trouxe força. Procuro entender melhor o poder que você deriva de [actor.GetFaith.HighGodName]."
 religious_interaction.2015.toast_puppeteer:0 "[recipient.GetShortUIName] pediu a [puppet_or_actor.GetShortUIName] que esperasse enquanto estudam a fé"
 religious_interaction.2016.a.tt:0 "Você iniciará [GetScheme('study_faith').GetTypeName] em [actor.GetShortUINameNoTooltip]."
 religious_interaction.2016.a:0 "Vamos começar."
 religious_interaction.2016.desc:0 "Conforme solicitado, você pode estudar os ensinamentos de [actor.GetFaith.GoodGodNames], sob o meu olhar atento."
 religious_interaction.2021.a:0 "Eu... Está bem, [Select_CString( actor.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))]."
 religious_interaction.2021.desc:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]\nÉ hora de você me seguir na luz, [Select_CString( recipient.IsFemale, 'minha', 'meu' )] [actor.Custom2('RelationToMe', SCOPE.sC('recipient'))]. Levando em consideração tudo que você me deve, exijo que você se converta ao [actor.GetFaith.GetName]!"
 religious_interaction.2021.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.2100.a.believer:0 "[imprisoner.GetFaith.HighGodName|U] me julgará justamente!"
 religious_interaction.2100.a.confused:0 "Erm..."
 religious_interaction.2100.a.failure:0 "Você perece sob o sol"
 religious_interaction.2100.a.success:0 "Você sobrevive ao julgamento"
 religious_interaction.2100.a.unbeliever:0 "Você está #EMP me deixando#! aqui?!"
 religious_interaction.2100.desc:0 "Depois de não sei quanto tempo na escuridão de uma cela, a luz do dia intensa é ofuscante. Os guardas que me escoltam para fora do [imprisoner.Custom('FortifiedBuilding')] e para a natureza estão surpreendentemente solenes — até cerimoniosos.\n\n"
 religious_interaction.2100.descforest:0 "O sol brilha intensamente, filtrando-se em raios dappled através da cobertura das árvores. Logo avisto [Select_CString( imprisoner.IsFemale, 'minha captora', 'meu captor' )] [imprisoner.GetTitledFirstName] abrindo caminho pela mata, acompanhado por vários [imprisoner.Custom('DefaultPriestTitlePlural')].\n\n"
 religious_interaction.2100.deschostile:0 "Ao posar os olhos em [imprisoner.GetTitledFirstName], ladeado por uma dúzia de [imprisoner.Custom('DefaultPriestTitlePlural')], o propósito de nossa pequena jornada se torna claro.\n\n\"[ROOT.Char.GetFullNameNoTooltip]. Você será deixado aqui, amarrado a esta estaca, e [imprisoner.GetFaith.HighGodName] determinará seu destino. Se você for inocente, viverá, mas se for culpado, perecerá.\""
 religious_interaction.2100.descoasis:0 "O sol brilha no deserto, refletindo na superfície do oásis. Logo avisto [Select_CString( imprisoner.IsFemale, 'minha captora', 'meu captor' )] [imprisoner.GetTitledFirstName] se movendo entre as águas do oásis, acompanhado por vários [imprisoner.Custom('DefaultPriestTitlePlural')].\n\n"
 religious_interaction.2100.descpleasant:0 "O sol brilha intensamente, o solo onde estou parece saudável e exuberante. Logo avisto [Select_CString( imprisoner.IsFemale, 'minha captora', 'meu captor' )] [imprisoner.GetTitledFirstName] se aproximando — com certo ar de incerteza — acompanhado por vários [imprisoner.Custom('DefaultPriestTitlePlural')].\n\n"
 religious_interaction.2100.descwaterlogged:0 "Enquanto o sol brilha intensamente, o terreno pantanoso onde estou afunda e suga meus pés. Logo avisto [Select_CString( imprisoner.IsFemale, 'minha captora', 'meu captor' )] [imprisoner.GetTitledFirstName] se aproximando, ostentando uma expressão presunçosa e um tanto cautelosa sobre o terreno encharcado, acompanhado por vários [imprisoner.Custom('DefaultPriestTitlePlural')].\n\n"
 religious_interaction.2100.endforest:0 "\n\nOlho ao redor para o meu entorno verdejante."
 religious_interaction.2100.endoasis:0 "\n\nOlho para as águas abaixo."
 religious_interaction.2100.endpleasant:0 "\n\nOlho ao redor para o meu entorno agradável."
 religious_interaction.2100.endwaterlogged:0 "\n\nOlho ao redor para o meu entorno encharcado."
 religious_interaction.2100.middledefault:0 "\"Por suas transgressões, você será julgado pelo todo-poderoso [imprisoner.GetFaith.HighGodName|U].\" [imprisoner.GetSheHe|U] ressoa. Os guardas avançam e amarram meus membros a uma estaca; os [imprisoner.Custom('DefaultPriestTitlePlural')] iniciam um lamento, com os braços estendidos. A comitiva então se retira. Estou sozinho, esperado para morrer de sede."
 religious_interaction.2100.middleoasis:0 "\"Por suas transgressões, você será julgado pelo todo-poderoso [imprisoner.GetFaith.HighGodName|U].\" [imprisoner.GetSheHe|U] ressoa. Os guardas avançam e amarram meus membros a uma estaca, com a água chegando ao peito; os [imprisoner.Custom('DefaultPriestTitlePlural')] iniciam um lamento, com os braços estendidos. A comitiva então se retira. Estou sozinho, esperado para morrer de sede."
 religious_interaction.2100.t:0 "Julgamento de [imprisoner.GetFaith.HighGodNamePossessive|U]"
 religious_interaction.2101.a:0 "Sou inocente!"
 religious_interaction.2101.desc.oasis:0 "Eu quase #EMP aproveitei#! meus dias suspensos nas águas refrescantes do oásis. Embora o sol castigue intensamente, as cordas estão frouxas o suficiente para que eu possa me inclinar e beber profundamente das águas.\n\nQuando [imprisoner.GetTitledFirstName] retorna, [imprisoner.GetSheHe] claramente está irritado com minha boa saúde, mas não há escapatória dos termos que [imprisoner.GetSheHe] [imprisoner.GetHerselfHimself] havia estabelecido: o divino falou!"
 religious_interaction.2101.desc.pleasant:0 "Eu quase #EMP aproveitei#! meus dias amarrado do lado de fora. Os pássaros têm cantado, o sol aqueceu minha pele, e as gotas de chuva me refrescaram e saciaram minha sede.\n\nQuando [imprisoner.GetTitledFirstName] retorna, [imprisoner.GetSheHe] claramente está irritado com minha vivacidade e bom humor geral, mas não há escapatória dos termos que [imprisoner.GetSheHe] [imprisoner.GetHerselfHimself] havia estabelecido: o divino falou!"
 religious_interaction.2101.end.desc:0 "\n\nQuando [imprisoner.GetTitledFirstName] retorna e um frasco é pressionado contra meus lábios, o nevoeiro em minha mente se dissipa. [Select_CString( imprisoner.IsFemale, 'A', 'O' )] [imprisoner.GetTitleAsNameNoTooltip] parece um pouco desapontado por me encontrar vivo, mas o divino falou."
 religious_interaction.2101.start.desc:0 "Água, eu preciso de água! Minha garganta, minha cabeça, minha pele - está tudo ardendo!\n\nSerá que [ROOT.Char.GetFaith.DevilName] realmente estava aqui, rindo do meu sofrimento? Será que [ROOT.Char.GetFaith.WaterGodName] me ofereceu um frasco de água? Bebi e bebi, mas minha sede não foi saciada."
 religious_interaction.2101.t:0 "[imprisoner.GetFaith.HighGodNamePossessive|U] Mercy"
 religious_interaction.2102.a:0 "É a vontade de [ROOT.Char.GetFaith.HighGodNamePossessive|U]."
 religious_interaction.2102.b.failure:0 "Você é exposto como um assassino"
 religious_interaction.2102.b.success:0 "Sua intromissão passa despercebida"
 religious_interaction.2102.b.tt:0 "[ROOT.Char.GetFaith.HighGodName|U] nem sempre está #EMP sempre#! certo!"
 religious_interaction.2102.b:0 "[prisoner.GetSheHe|U] parece bem morto para mim..."
 religious_interaction.2102.desc:0 "Na véspera final do julgamento de [prisoner.GetTitledFirstNamePossessive], encontramos [prisoner.GetSheHe] inconsciente, mas ainda respirando.\n\n\"É um milagre!\" declara o [ROOT.Char.Custom('DefaultPriestTitle')], mãos erguidas para o céu. \"[ROOT.Char.GetFaith.HighGodName|U] falou! [Select_CString( prisoner.IsFemale, 'A', 'O' )] [prisoner.GetWomanMan] é inocente!\""
 religious_interaction.2102.oasis:0 "Ao me aproximar de [prisoner.GetTitledFirstName], pisando nas águas do oásis onde [prisoner.GetSheHe] estava amarrado a uma estaca, encontramos [prisoner.GetHerHim] não apenas consciente, mas completamente saudável.\n\n\"É um milagre!\" declara o [ROOT.Char.Custom('DefaultPriestTitle')], com as mãos levantadas para o céu. \"[ROOT.Char.GetFaith.HighGodName|U] falou! [Select_CString( prisoner.IsFemale, 'A', 'O' )] [prisoner.GetWomanMan] é inocente!\"\n\nRangem meus dentes de frustração enquanto os [ROOT.Char.Custom('DefaultPriestTitlePlural')] desamarram [prisoner.GetFirstNameNoTooltip]. Por que nós tivemos que deixar [prisoner.GetSheHe] #EMP aqui#!?!"
 religious_interaction.2102.pleasant:0 "Ao me aproximar de [prisoner.GetTitledFirstName], pisando nas águas do oásis onde [prisoner.GetSheHe] estava amarrado a uma estaca, encontramos [prisoner.GetHerHim] não apenas consciente, mas praticamente #EMP sorrindo#!.\n\n\"É um milagre!\" declara o [ROOT.Char.Custom('DefaultPriestTitle')], com as mãos levantadas para o céu. \"[ROOT.Char.GetFaith.HighGodName|U] falou! [Select_CString( prisoner.IsFemale, 'A', 'O' )] [prisoner.GetWomanMan] é inocente!\"\n\nRangem meus dentes de frustração enquanto os [ROOT.Char.Custom('DefaultPriestTitlePlural')] desamarram [prisoner.GetFirstNameNoTooltip]. Por que nós tivemos que deixar [prisoner.GetSheHe] #EMP aqui#!?!"
 religious_interaction.2103.a:0 "Eu... Estou tão cansado..."
 religious_interaction.2103.b:0 " #DIE1 Glu-#! #DIE2 blub...#!"
 religious_interaction.2103.desc.oasis:0 "Enquanto sirvo meu julgamento, o sol inclemente castiga minha pele. Pelo menos, sou refrescado pelo contato da água em meu peito, suspenso na posição vertical nas águas do oásis.\n\nDe repente, o mundo começa a cambalear. Imperceptivelmente a princípio, depois mais rápido e mais rápido. Levo alguns momentos para perceber que a areia macia sob minha estaca cedeu, me fazendo tombar diretamente no oásis à minha frente!\n\nAo impactar a água, me debato loucamente para escapar, mas é inútil. Todos os meus membros estão amarrados, e o peso do tronco me empurra mais fundo nas águas. Grito, mas nenhum som escapa, e a água enche minha boca para preencher o vazio."
 religious_interaction.2103.desc.pleasant:0 "Eu estava tão confiante, tão tolo. Ficar ao ar livre por tanto tempo vai brutalizar qualquer [ROOT.Char.GetWomanMan], vejo isso agora. O sol castiga durante o dia, o vento uiva e me golpeia à noite, e os céus permanecem terrivelmente, impiedosamente limpos de nuvens.\n\nÁgua, água. Está por toda parte ao meu redor, trancada no abraço da natureza, mas não há uma gota que eu possa beber. Minha cabeça balança sem esperança."
 religious_interaction.2103.desc.waterlogged:0 "Embora o vento me golpeie e o sol castigue minha pele, ao menos sou refrescado pela constante entrada de água das nuvens de chuva que inundam esta área. Sorrio para o céu enquanto outra chuvarada começa.\n\nDe repente, o mundo começa a cambalear. Imperceptivelmente a princípio, depois mais rápido e mais rápido. Levo alguns momentos para perceber que minha estaca desequilibrou e agora está tombando diretamente para a piscina à minha frente!\n\nAo impactar a água, eu me debato loucamente para escapar, mas é inútil. Todos os meus membros estão amarrados, e o peso do tronco me empurra mais fundo na piscina rasa. Grito, mas nenhum som escapa, e a água enche minha boca para preencher o vazio."
 religious_interaction.2103.end.desc:0 "\n\nSe esta é a sua vontade, talvez eu mereça isso. Talvez eu seja... malvado."
 religious_interaction.2103.t:0 "Fúria de [imprisoner.GetFaith.HighGodNamePossessive|U]"
 religious_interaction.2104.b.drowned:0 "Bem, suponho que é uma maneira de ver as coisas..."
 religious_interaction.2104.desc.drowned:0 "Conforme nos aproximamos de onde deixamos [prisoner.GetTitledFirstName] amarrado a uma estaca, fica claro rapidamente que algo está errado. A estaca [prisoner.GetHerHim|U] presumivelmente tombou para a frente, diretamente em uma poça que deixamos ao lado [prisoner.GetHerHim]. As amarras que colocamos em seus membros estavam claramente à altura da tarefa, e com o peso do tronco pressionando [prisoner.GetSheHe], [prisoner.GetSheHe] não teve a menor chance.\n\n\"[ROOT.Char.GetFaith.HighGodName|U] falou!\" O [ROOT.Char.Custom('DefaultPriestTitle')] declara, mãos erguidas aos céus. \"[Select_CString( prisoner.IsFemale, 'A', 'O' )] [prisoner.GetWomanMan] é culpad[Select_CString( prisoner.IsFemale, 'a', 'o' )]!\""
 religious_interaction.2104.desc.oasisdrowned:0 "Conforme nos aproximamos de onde deixamos [prisoner.GetTitledFirstName] amarrado a uma estaca, fica claro rapidamente que algo está errado. A estaca [prisoner.GetHerHim|U] presumivelmente tombou para a frente, diretamente no oásis que deixamos ao lado [prisoner.GetHerHim]. As amarras que colocamos em seus membros estavam claramente à altura da tarefa, e com o peso do tronco pressionando [prisoner.GetSheHe], [prisoner.GetSheHe] não teve a menor chance.\n\n\"[ROOT.Char.GetFaith.HighGodName|U] falou!\" O [ROOT.Char.Custom('DefaultPriestTitle')] declara, mãos erguidas aos céus. \"[Select_CString( prisoner.IsFemale, 'A', 'O' )] [prisoner.GetWomanMan] é culpad[Select_CString( prisoner.IsFemale, 'a', 'o' )]!\""
 religious_interaction.2104.desc:0 "Na véspera final do julgamento de [prisoner.GetTitledFirstNamePossessive], [prisoner.GetSheHe] não se mexe quando nos aproximamos. Um dos servos coloca um frasco nos lábios ressecados [prisoner.GetHerHim], mas a água escorre pelo queixo [prisoner.GetHerHim] sem resposta.\n\n\"[ROOT.Char.GetFaith.HighGodName|U] falou!\" declara o [ROOT.Char.Custom('DefaultPriestTitle')], mãos erguidas para o céu. \"[Select_CString( prisoner.IsFemale, 'A', 'O' )] [prisoner.GetWomanMan] é culpad[Select_CString( prisoner.IsFemale, 'a', 'o' )]!\""
 religious_interaction.2400.a.tt_fail:0 "[actor.GetShortUINameNoTooltip] questiona com sucesso minha fé"
 religious_interaction.2400.a.tt_success:0 "O debate público humilha [actor.GetShortUINameNoTooltip]"
 religious_interaction.2400.a:0 "Essa víbora! Desafio aceito!"
 religious_interaction.2400.b.tt:0 "[actor.GetShortUINameNoTooltip] será informado"
 religious_interaction.2400.b:0 "Não mancharei o nome de [recipient.GetFaith.HighGodName] com essa farsa."
 religious_interaction.2400.b_turned_down:0 "[recipient.GetShortUIName|U] recusou meu desafio para o debate"
 religious_interaction.2400.b_turned_down_puppeteer:0 "[recipient.GetShortUIName|U] recusou o desafio para um debate de [puppet_or_actor.GetShortUINamePossessive]"
 religious_interaction.2400.desc:0 "A paige treme de medo ao me ler a carta inflamada de [actor.GetTitledFirstNamePossessive], me desafiando para um debate público sobre as virtudes e vícios de nossa fé compartilhada, e questionando minha adesão aos preceitos básicos do [recipient.GetFaith.GetNameNoTooltip].\n\nMeu servo gagueja ao pronunciar as palavras, pois o tom da carta deixa claro a opinião de [actor.GetShortUINamePossessiveNoTooltip] sobre minha piedade."
 religious_interaction.2400.t:0 "Um Grande Debate"
 religious_interaction.2401.a_lost:0 "Essas pessoas não entendem [actor.GetFaith.GetReligion.GetNameNoTooltip]!"
 religious_interaction.2401.a_won:0 "Não sou amado pelo [actor.GetFaith.HighGodName]?"
 religious_interaction.2401.desc_intro:0 "Meu oponente e eu nos encontramos em um grande salão em [debate_locale.GetNameNoTierNoTooltip], de pé em mesas precárias a poucos metros de distância um do outro, cercados por uma multidão de espectadores ansiosos. Um silêncio abafado cai sobre a multidão, todos esperando o início do debate.\n\n"
 religious_interaction.2401.desc_lost:0 "O ataque verbal de [recipient.GetTitledFirstNamePossessive] começa imediatamente, mal me dando uma chance de refutar, e logo a multidão decide o vencedor.\n\nEu resisto por alguns minutos, enfrentando a chuva de vegetais podres, mas sou finalmente forçado a recuar quando um dos camponeses lança uma galinha viva na minha cabeça."
 religious_interaction.2401.desc_won:0 "Ao longo de uma hora, eu destruo [recipient.GetTitledFirstName], atacando a piedade [recipient.GetHerHim], o seu senso de virtude, até questionando a fidelidade [recipient.GetHerHim] a [actor.GetFaith.HighGodName]. A multidão é cruel, atirando ovos podres e repolhos mofados em [recipient.GetTitledFirstNameNoTooltip] até [recipient.GetSheHe] fugir do salão."
 religious_interaction.2402.desc_lost:0 "Embora eu faça o meu melhor, [actor.GetTitledFirstName] pesquisou claramente muito bem os argumentos [actor.GetHerHim], e a multidão logo se rende aos encantos [actor.GetHerHim]. [actor.GetSheHe|U] continua a me repreender por mais de uma hora, me acusando de todos os vícios sob o sol e até insinuando que minha lealdade a [recipient.GetFaith.HighGodName] está em questão.\n\nEventualmente, fujo, seguido por uma barragem de produtos podres da multidão."
 religious_interaction.2402.desc_won:0 "Apesar da atitude convencida de [actor.GetTitledFirstNamePossessive] ao me desafiar para um debate, a resolução [actor.GetHerHim] se desfaz diante de minha tempestade de palavras mordazes e críticas piedosas. Em pouco tempo, a multidão se junta e meu oponente recua sob uma chuva de vegetais mofados e um galo particularmente agressivo."
 religious_interaction.2403.a.low_compassion:0 "\"Tomando o caminho do covarde, vejo.\""
 religious_interaction.2403.a.stubborn:0 "\"Ei, eu ainda não terminei!\""
 religious_interaction.2403.a.tt:0 "[victim.GetShortUIName] sofre um ataque cardíaco e [character_death_dies|E]"
 religious_interaction.2403.a.zealous:0 "\"Parece que [ROOT.Char.GetFaith.PantheonTerm] [ROOT.Char.GetFaith.PantheonTermHasHave] escolhido um vencedor.\""
 religious_interaction.2403.a:0 "\"Você... Você está bem?\""
 religious_interaction.2403.conclusion_either:0 "Seu peito."
 religious_interaction.2403.conclusion_man:0 "Seu braço."
 religious_interaction.2403.conclusion_woman:0 "Seu estômago."
 religious_interaction.2403.desc:0 "[victim.GetTitledFirstName] não tem nem mesmo uma chance. Embora [victim.GetSheHe] acredite estar bem preparado, eu afasto os argumentos fracos [victim.GetHerHim] como se fossem moscas. A cada contra-argumento, [victim.GetFirstNameNoTooltip] estremece como se tivesse sido atingido. Com o passar do tempo, [victim.GetSheHe] parece tão incapaz de se defender que até a multidão fica em silêncio.\n\n\"...e é por isso que,\" eu digo enquanto levanto minha mão dramaticamente, apontando um dedo acusador para o outro lado da sala, \"você nunca—\"\nEu paro quando percebo que [victim.GetFirstNameNoTooltip] está ofegando por ar e segurando"
 religious_interaction.2500.a:0 "Louvado seja [ROOT.Char.GetFaith.HighGodName]!"
 religious_interaction.2500.desc:0 "Para você ver a luz... Deve ser um sinal de [ROOT.Char.GetFaith.HighGodNameAlternate]! Você é bem-vindo a se juntar à verdadeira fé."
 religious_interaction.2500.toast_puppeteer:0 "[recipient.GetShortUIName] aceitou a oferta de [puppet_or_actor.GetShortUINamePossessive] para se converter na guerra"
 religious_interaction.2501.desc:0 "Certamente você está brincando? Suas tentativas transparentes de escapar politicamente nunca deterão a ira de [recipient.GetFaith.HighGodName]!"
 religious_interaction.2501.toast_puppeteer:0 "[recipient.GetShortUIName] recusou a oferta de [puppet_or_actor.GetShortUINamePossessive] para se converter na guerra"
 religious_interaction.2600.a:0 "\"Vamos transcender, juntos.\""
 religious_interaction.2600.desc.actor:0 "[recipient.GetTitledFirstName|U] observa com cuidado as ferramentas da transcendência, tremendo levemente em antecipação.\n\nAgarro o pulso [recipient.GetHerHim], coloco a lâmina afiada em sua mão e a pressiono suavemente contra meu peito. \"Com toda gentileza, sim? Mão firme, agora. Estamos pisando em uma linha delicada aqui.\"\n\n[recipient.GetFirstNameNoTooltip] me encara e assente com a cabeça, depois começa a desabotoar a própria camisa, revelando um trecho de pele pura e sem cicatrizes, prestes a receber a graça de [recipient.GetFaith.HighGodName]."
 religious_interaction.2600.desc.recipient:0 "[actor.GetTitledFirstName|U] gentilmente pega minha mão para me guiar até uma variedade de objetos cortantes e contundentes que usaremos em nossa sessão. Uma das lâminas reflete a luz, e sinto uma sensação de paz tomando conta de mim.\n\nCom a ferramenta em mãos, faço sinal para que [actor.GetSheHe] se vire, enquanto [actor.GetSheHe] levanta sua camisa, expondo a pele intacta das costas. Começo o trabalho, e os gemidos e grunhidos baixos logo se transformam em um leve murmúrio vindo do fundo da garganta [actor.GetHerHim].\n\nJá sei qual ferramenta usarei para aperfeiçoar minha própria graça."
 religious_interaction.2600.t:0 "Lições de Graça"
 religious_interaction.2610.a:0 "Que pena."
 religious_interaction.2610.desc:0 "Infelizmente, tenho ações importantes que preciso atender desta vez... mas que possamos adorar com ainda mais fervor da próxima!"
 religious_interaction.2620.a:0 "Que a dor nos aproxime."
 religious_interaction.2620.desc.actor:0 "[recipient.GetTitledFirstName] ajoelha-se diante de mim enquanto ergo o chicote. A dor é graça, e através do sofrimento de [recipient.GetHerHis] aproximome de [actor.GetFaith.HighGodName]."
 religious_interaction.2620.desc.recipient:0 "Ajoelho-me perante [actor.GetTitledFirstName] enquanto [actor.GetSheHe] ergue o chicote. A dor é graça, e através do meu sofrimento [actor.GetSheHe] aproxima-se de [actor.GetFaith.HighGodName]."
 religious_interaction.2620.t:0 "Conceder Dor"
 religious_interaction.3.a:0 "Louvado seja [ROOT.Char.GetFaith.WealthGodName], aqui vem o reembolso de impostos!"
 religious_interaction.3.b:0 "Esses fundos me trarão vitória!"
 religious_interaction.3.c:0 "Usarei essa riqueza com sabedoria."
 religious_interaction.3.d:0 "Este ouro curará meus cofres vazios!"
 religious_interaction.3.defensive_war:0 "Que esses fundos o ajudem a defender a fé contra [war_target.GetTitledFirstName] e as hordas invasoras [war_target.GetFaith.GetAdjective]!"
 religious_interaction.3.desc:0 "Considerei sua situação e decidi conceder seu pedido."
 religious_interaction.3.desc_subordinate:0 "Em nome de todos os representantes de [actor.GetFaith.HighGodNamePossessive] na Terra, concedo o seu pedido."
 religious_interaction.3.fallback:0 "Que esses fundos o ajudem a espalhar a verdadeira fé em suas terras!"
 religious_interaction.3.offensive_war:0 "Que esses fundos tragam-lhe vitória em sua guerra contra [war_target.GetTitledFirstName]!"
 religious_interaction.32.a:0 "Oh não!"
 religious_interaction.32.desc:0 "Considerei seu pedido e decidi rejeitá-lo."
 religious_interaction.4.a:0 "Provarei ser um governante digno!"
 religious_interaction.4.child:0 "Como [secondary_recipient.GetTitledFirstName] é apenas uma criança, você tem o direito de intervir."
 religious_interaction.4.desc:0 "Ponderei seu pedido e decidi reconhecer sua reivindicação sobre o [target.GetName]."
 religious_interaction.4.fallback:0 "Veio à tona prova irrefutável de que seus ancestrais realmente governaram a terra em tempos antigos."
 religious_interaction.4.they_are_female:0 "Como [secondary_recipient.GetTitledFirstName] é uma mulher, você tem o direito de intervir."
 religious_interaction.4.they_are_male:0 "Como [secondary_recipient.GetTitledFirstName] é um homem, você tem o direito de intervir."
 religious_interaction.42.a:0 "Maldição!"
 religious_interaction.42.desc:0 "Considerei seu pedido de reivindicação sobre o [target.GetName] e decidi rejeitá-lo."
 religious_interaction.5.a:0 "Isso é um ultraje!"
 religious_interaction.5.child:0 "Devido à sua minoridade,"
 religious_interaction.5.fallback:0 "Devido à sua evidente falta de piedade,"
 religious_interaction.5.outro:0 "uma condição que preocupa muito a Igreja,"
 religious_interaction.5.outro_different_recipient:0 "Concedi a [actor.GetName] uma reivindicação sobre [target.GetName], a pedido [actor.GetHerHim]."
 religious_interaction.5.self:0 "Decidi prosseguir com minha reivindicação sobre [target.GetName], pois é meu direito."
 religious_interaction.5.they_are_female:0 "Devido ao seu status de mulher,"
 religious_interaction.5.they_are_male:0 "Devido ao seu status de homem,"
 religious_interaction.6.a:0 "Sinto muito, [secondary_recipient.GetFirstNameNoTooltip]."
 religious_interaction.6.adultery:0 "com base em adultério."
 religious_interaction.6.consanguinity:0 "com base na consanguinidade."
 religious_interaction.6.desc:0 "Depois de muita oração e deliberação, decidi conceder seu pedido de divórcio de [secondary_actor.GetFirstNameNoTooltip] e [Select_CString( secondary_recipient.IsFemale, 'sua', 'seu' )] [secondary_recipient.GetWifeHusband], [secondary_recipient.GetFirstNameNoTooltip],"
 religious_interaction.6.different_faith:0 "com base em não aderirem à verdadeira fé."
 religious_interaction.6.eunuch:0 "com base na falta de capacidade adequada."
 religious_interaction.6.fallback:0 "com base em suspeita de adultério."
 religious_interaction.6.opening:0 "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.6.price_feud:0 "\n\nMas isto mal separará os dois, não é? Portanto, enviei acusações vis contra [secondary_recipient.GetFirstName] para toda a Casa [secondary_recipient.GetHouse.GetName], em nome de [actor.GetFirstNamePossessiveNoTooltip].\n\n[actor.GetHerHis|U] A família de [actor.Custom2('RelationToMePossessive', SCOPE.sC('secondary_recipient'))] agora parece interessada em uma... #EMP permanente#! separação."
 religious_interaction.6.price_hook:0 "\n\nConsidere o favor que [recipient.GetTitleAsName] lhe fez com esta declaração suspeita. Considere também: é tão bom dar quanto receber."
 religious_interaction.6.price_lease:0 "\n\nEste falso pronunciamento tem o seu preço: a locação de [barony_to_lease.GetName] para a [lease_order.GetName]. E caso [secondary_recipient.GetFirstNameNoTooltip] ponha de parte estes servos da fé, tal como você fez com [actor.GetHerHis] [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))]... a alma de [actor.GetHerHis] ficará duplamente manchada."
 religious_interaction.6.price_none:0 "\n\nIsto é uma farsa, é claro. Uma transação sórdida que conspurcou a minha alma. Mas não posso, em boa consciência, forçar [actor.GetFirstNameNoTooltip] a partilhar o leito conjugal com [secondary_recipient.GetFirstNameNoTooltip] por mais tempo."
 religious_interaction.6.price_vows:0 "\n\nEstes são fundamentos frágeis... e por isso produzi provas de que, antes de [secondary_recipient.GetSheHe] se tornar [actor.GetFirstNamePossessiveNoTooltip] [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetFirstNameNoTooltip] fez os votos de [joining_order_title.GetAdjective] [secondary_recipient.Custom('SisterBrother')].\n\nGarantirei pessoalmente a devoção de [secondary_recipient.GetHerHis] até à morte."
 religious_interaction.excommunication.opening:0 "[excommunication_issuer.Custom2('AppropriateGreeting', ROOT.Char)]"
 used_literalist_debate_modifier:0 "Debate Recentemente Realizado"
 used_literalist_debate_modifier_desc:0 "Este personagem recentemente iniciou um debate sobre os fundamentos de sua fé."
