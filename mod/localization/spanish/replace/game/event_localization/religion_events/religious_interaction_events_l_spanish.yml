 order_spreading_tenet_tt:0 "#high [TopScope.GetValue('order_tenet_accepted_count')|0]#! [rulers|E], incluindo [tenet_change_1.GetShortUIName] e [tenet_change_2.GetShortUIName], adotam [order_tenet.GetName( order_rite )] como um [personal_tenet|E]"
