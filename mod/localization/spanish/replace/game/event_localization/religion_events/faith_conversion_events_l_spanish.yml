l_spanish:
 faith_conversion.1001.a:0 "Gloria a [ROOT.Char.GetFaith.HighGodName]!"
 faith_conversion.1001.b:0 "Pelo menos tenho [Select_CString( template_priest.IsFemale, 'a', 'o' )] [template_priest.GetFirstNameNoTooltip] para me guiar..."
 faith_conversion.1001.desc.compassionate:0 "Com o destino de minha alma imortal em jogo, assim como as almas de meus súditos, rezo por ter tomado a decisão correta.\n\nMetafísica à parte,"
 faith_conversion.1001.desc.cynical:0 "Embora eu não acredite de verdade nas bobagens que o [new_faith.PriestNeuter] fala, converter-se tem tantas vantagens políticas que sabia que tinha que fazê-lo antes ou depois.\n\nIndependentemente de meus motivos,"
 faith_conversion.1001.desc.reincarnation:0 "Com a vida de minha próxima encarnação em jogo, rezo por ter tomado a decisão correta.\n\nMetafísica à parte,"
 faith_conversion.1001.desc.zealous.carnal_female:0 "Enquanto [template_priest.GetSheHe] recita versos de [new_faith.ReligiousText], #EMP sinto#! como minha convicção palpita em meu interior. Em minha mente não há dúvida de que escolhi o caminho correto.\n\nPor mais forte que seja meu zelo,"
 faith_conversion.1001.desc.zealous.carnal_male:0 "Enquanto [template_priest.GetSheHe] recita versos de [new_faith.ReligiousText], #EMP sinto#! crescer minha convicção. Em minha mente não há dúvida de que escolhi o caminho correto.\n\nPor mais forte que seja meu zelo,"
 faith_conversion.1001.desc.zealous:0 "Enquanto [template_priest.GetSheHe] recita versos de [new_faith.ReligiousText], #EMP sinto#! como minha convicção arde em meu interior. Em minha mente não há dúvida de que escolhi o caminho correto.\n\nPor mais forte que seja meu zelo,"
 faith_conversion.1001.desc:0 "Com o destino de minha alma imortal em jogo, só me resta rezar por ter tomado a decisão correta.\n\nMetafísica à parte,"
 faith_conversion.1001.end.is_landless_adventurer:0 "A ideia de [new_faith.GetNameNoTooltip] se espalhando — passo a passo — a partir do meu humilde acampamento faz meu coração cantar."
 faith_conversion.1001.end.is_top_liege.convert_away:0 "Minha preocupação mais urgente é temporal, agora que a maioria de meus vassalos segue uma fé diferente, serei capaz de manter meu senhorio unido contra rebeliões internas e oportunidades estrangeiras por igual?"
 faith_conversion.1001.end.is_top_liege.convert_to:0 "Me conforta saber que a maioria do meu senhorio está unida sob o [new_faith.PantheonTerm], uma verdadeira nação [new_faith.GetAdjectiveNoTooltip]."
 faith_conversion.1001.end.is_vassal.convert_away:0 "Minha preocupação mais urgente é temporal, como [my_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] reagirá ao saber que rejeitei sua fé?"
 faith_conversion.1001.end.is_vassal.convert_to:0 "Posso respirar aliviado sabendo que [my_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] não poderá mais usar minha fé contra mim."
 faith_conversion.1001.start:0 "Tendo tomado a decisão de me converter à [new_faith.GetName], organizo que um [new_faith.PriestNeuter] venha à minha corte para realizar os ritos.\n\n"
 faith_conversion.1001.t:0 "Conversão"
 faith_conversion.1101.toast:0 "Senhor Feudal Converteu de Fé"
