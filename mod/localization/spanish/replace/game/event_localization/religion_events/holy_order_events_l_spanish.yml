l_spanish:
 INTERACTION_LEASE_DONATION:0 "Comprar Propriedades Auxiliares"
 already_has_monastic_lease_tt:0 "[target.GetNameNoTier] já está [leased|E] a uma [monastic_holy_order|E]"
 char_interaction.0001.opening_low_piety:0 "Para um ser tão [ROOT.GetCharacter.Custom('GetSinfulShameful')] como você vir rastejando até uma ordem sagrada de [ROOT.Char.GetFaith.HighGodName]... Você deve se concentrar em redimir sua alma antes de se preocupar com riquezas mundanas."
 child_in_holy_order_desc:0 "[recipient.GetShortUIName] é uma criança prometida à [recipient.GetHerHis] Ordem"
 custom.every_domain_monastic_order:0 "Cada [monastic_holy_order|E] no seu [domain|E]"
 founded_monastic_order_modifier:0 "Ordem Monástica Fundada"
 founded_monastic_order_modifier_desc:0 "Este governante sábio auxiliou na concepção e criação de uma nova ordem monástica, lançando assim um novo apelo diretamente ao divino."
 holy_order.0001.a:0 "Você irá para a [holy_order_1.GetName]."
 holy_order.0001.b:0 "O destino é a [holy_order_2.GetName]."
 holy_order.0001.c:0 "Para bem longe. A [recipient.GetSheHe]!"
 holy_order.0001.d:0 "Você é um problema para a [holy_order_4.GetName] agora."
 holy_order.0001.desc:0 "\"Então, [Select_CString( root.IsFemale, 'minha', 'meu' )] [root.GetLadyLord], para onde essa jornada me levará?\""
 holy_order.0001.desc_demand:0 "\"Suponho que haja honra nisso...\" [recipient.GetSheHe] resmunga, \"eu morrer para reivindicar alguma terra pagã estranha. Pensei que morreria lutando por [actor.GetPrimaryTitle.GetNameNoTier]...\"\n\n[recipient.GetSheHe|U] monta [recipient.GetHerHis] cavalo, perguntando: \"Para onde devo ir?\""
 holy_order.0001.desc_opening:0 "[recipient.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] está esperando do lado de fora, com suas coisas e comitiva prontas para partir.\n\n"
 holy_order.0001.desc_relation:0 "\"Então, [recipient.Custom2('RelationToMeShort', ROOT.Char)], para onde essa jornada me levará?\""
 holy_order.0001.e:0 "Eu cometi um erro - você pertence aqui!"
 holy_order.0001.t:0 "Ordem Sagrada"
 holy_order.0001.toast_puppeteer:0 "[recipient.GetShortUIName] aceitou a convocação de [puppet_or_actor.GetShortUINamePossessive] para uma ordem militar"
 holy_order.0002.a:0 "Tenho certeza de que você servirá bem a [ROOT.Char.GetFaith.HighGodName]."
 holy_order.0002.a_demand:0 "Bom. Agora vá aguardar [ROOT.Char.GetFaith.PositiveAfterLife] em silêncio."
 holy_order.0002.desc:0 "Eu responderei ao chamado para servir um poder maior, e agradeço por me colocar neste caminho de retidão."
 holy_order.0002.desc_angry:0 "Eu proferi as palavras sagradas e, assim como sua vontade me baniu, agora estou vinculado a [ROOT.Char.GetFaith.HighGodName]."
 holy_order.0002.toast_puppeteer:0 "[recipient.GetShortUIName] fez os votos a pedido de [puppet_or_actor.GetShortUINamePossessive]"
 holy_order.0200.a:0 "[ROOT.Char.GetFaith.HighGodName] sorri para mim!"
 holy_order.0200.b:0 "Mas... Mas eu preciso do dinheiro!"
 holy_order.0200.desc:0 "Ouvi seu pedido por ouro, e a [order.GetName] atenderá seu chamado."
 holy_order.0200.desc_opening:0 "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 holy_order.0202.a._not.tt:0 "@warning_icon! #X Não há ouro suficiente [gold_i][gold|E]#!"
 holy_order.0202.a:0 "Claro que honrarei nosso acordo."
 holy_order.0202.a_no:0 "Pagarei! Só deixe-me encontrar o ouro..."
 holy_order.0202.b.tt:0 "[recipient.GetTitledFirstNameNoTooltip] lhe dará mais 5 anos"
 holy_order.0202.b:0 "Como companheiro devoto... Por favor, me dê mais tempo!"
 holy_order.0202.b_christian:0 "A paciência não é uma virtude?"
 holy_order.0202.c.tt:0 "@warning_icon! #X [Select_CString( recipient.IsFemale, 'A', 'O' )] [recipient.GetTitleAsNameNoTooltip] pedirá algo em troca#!"
 holy_order.0202.c:0 "Talvez possamos encontrar uma forma alternativa de pagamento...?"
 holy_order.0202.d:0 "O ouro é mais útil em minhas mãos!"
 holy_order.0202.desc:0 "Se você não devolver o ouro, encontraremos maneiras alternativas para você nos pagar - maneiras agradáveis a [ROOT.Char.GetFaith.HighGodName], mas talvez menos agradáveis a você."
 holy_order.0202.opening:0 "Você deve #bold [ROOT.Var('loan_amount_owed').GetValue|0]#! de ouro à minha ordem."
 holy_order.0202.second_time:0 "Lembro-lhe novamente que você deve #bold [ROOT.Var('loan_amount_owed').GetValue|0]#! de ouro à minha ordem."
 holy_order.0203.a:0 "Claro, [province.GetNameNoTierNoTooltip] será seu."
 holy_order.0203.b:0 "Essa é uma exigência ridícula!"
 holy_order.0203.desc:0 "Não olho com bons olhos para aqueles que quebram sua palavra, e o mesmo acontece com [ROOT.Char.GetFaith.HighGodNameAlternate]. Para corrigir esse problema, você cederá o controle da [province.GetName] para nós, para que possamos promover o trabalho de [ROOT.Char.GetFaith.HighGodName]."
 holy_order.0204.a.tt:0 "Você não deverá mais ouro à ordem"
 holy_order.0204.a:0 "Enviarei [child.GetSheHe] em seu caminho."
 holy_order.0204.desc:0 "Não olho com bons olhos para aqueles que quebram sua palavra, e o mesmo acontece com [ROOT.Char.GetFaith.HighGodNameAlternate]. Para corrigir esse problema, você enviará para nós [Select_CString( child.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetTitledFirstName] para promover o trabalho de [ROOT.Char.GetFaith.HighGodName]."
 holy_order.0205.a:0 "Maldição!"
 holy_order.0205.desc:0 "Todo esse problema com o empréstimo foi uma exibição vergonhosa de sua ganância. Vou garantir que o [ROOT.Char.GetFaith.ReligiousHeadName] fique sabendo disso!"
 holy_order.1001.a:0 "Seu pedido foi concedido. Por [ROOT.Char.GetFaith.HighGodName]!"
 holy_order.1001.b:0 "Não serviria [alternative_barony.GetNameNoTierNoTooltip] tão bem?"
 holy_order.1001.c:0 "Não, não vou lhe conceder esta terra."
 holy_order.1001.end:0 "\n\nA [target_barony.GetName] é perfeitamente adequada para o nosso propósito, e desejamos alugá-la para o serviço da nossa causa."
 holy_order.1001.intro:0 "Conforme nossa ordem da [holy_order.GetName] cresce, precisamos de mais terras para organizar nossa defesa da fé [ROOT.Char.GetFaith.GetAdjective]."
 holy_order.1011.a:0 "A Ordem pode arrendar [target_barony.GetNameNoTierNoTooltip]."
 holy_order.1011.b:0 "Há tranquilidade em [alternative_barony.GetNameNoTierNoTooltip]?"
 holy_order.1011.c:0 "Temo que deba enviar [grandmaster.Custom('SistersBrothers')] para outro lugar."
 holy_order.1011.end:0 "\n\nAtuariam como nossos intermediários, para que a [holy_order.GetName] possa estabelecer um mosteiro ali?"
 holy_order.1011.intro:0 "No [target_barony.GetName], há boas terras a serem cultivadas, e um belo [grandmaster.GetFaith.HouseOfWorship] que seria bem servido por um claustro do meu [grandmaster.Custom('SistersBrothers')]."
 holy_order.2001.a:0 "Que [child.GetFaith.HighGodNameAlternate] guie você, m[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('DaughterSon')]."
 holy_order.2001.b:0 "Eles podem não ser grandiosos, mas tenho planos para você aqui."
 holy_order.2001.desc:0 "Quando m[Select_CString( child.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))], [child.GetFirstName], vem até mim, eu rapidamente percebo que [child.GetSheHe] tem algo muito sério para discutir.\n\n\"[ROOT.Char.Custom('MotherFather')|U], minha vida aqui sempre será liderada à sombra dos outros. Deixe-me, em vez disso, juntar-me à [holy_order.GetName] e servir [child.GetFaith.HighGodName]. Eu pensei muito sobre isso, e é o que desejo fazer.\""
 holy_order.2001.t:0 "Um Propósito Divino"
 holy_order.2002.a:0 "Eu entendo sua escolha, [sibling.Custom('SisterBrother')]."
 holy_order.2002.b:0 "Oh, você absolutamente #EMP não#! fará isso!"
 holy_order.2002.desc:0 "Quando m[Select_CString( sibling.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling'))], [sibling.GetTitledFirstName], me conta sobre os planos [sibling.GetHerHim], fica claro que [sibling.GetSheHe] tem refletido sobre isso há muito tempo.\n\n\"Não há muito para mim aqui, e se eu devo servir alguém, prefiro servir [sibling.GetFaith.HighGodName] [sibling.GetFaith.HighGodHerselfHimself]. Eu estou me juntando à [holy_order.GetName].\""
 holy_order.2003.a:0 "[child.GetSheHe|U] terá a vida de um verdadeiro [child.GetFaith.GetAdherentName]."
 holy_order.2003.alternative_child_joins_order:0 "[alternative_child.GetFirstName] adquire [GetTrait('order_member').GetName( alternative_child.Self )] e junta-se à corte d[Select_CString( grandmaster.IsFemale, 'a', 'o' )] [grandmaster.GetTitledFirstNameNoTooltip]"
 holy_order.2003.b:0 "Talvez você pudesse treinar [Select_CString( alternative_child.IsFemale, 'a', 'o' )] [alternative_child.GetFirstNameNoTooltip] em vez disso?"
 holy_order.2003.c:0 "Seu lugar é aqui comigo."
 holy_order.2003.child_joins_order:0 "[child.GetFirstName] adquire [GetTrait('order_member').GetName( child.Self )] e junta-se à corte d[Select_CString( grandmaster.IsFemale, 'a', 'o' )] [grandmaster.GetTitledFirstNameNoTooltip]"
 holy_order.2003.desc:0 "Sempre haverá a necessidade de verdadeiros guerreiros para deter qualquer ameaça à fé [grandmaster.GetFaith.GetAdjective].\nCom muitas aptidões e poucas perspectivas de herança, acredito que s[Select_CString( child.IsFemale, 'ua', 'eu' )] [child.Custom('DaughterSon')], [child.GetTitledFirstName], poderia levar uma vida melhor servindo [holy_order_scope.GetName]. Com a gente, [child.GetSheHe] treinará, aprenderá e trará grande honra ao seu nome."
 holy_order.2003.opening:0 "[grandmaster.Custom2('AppropriateGreetingPositive', ROOT.Char)|U]"
 holy_order.2004.a:0 "Bem-vindo de volta, m[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('DaughterSon')]."
 holy_order.2004.b:0 "Não. Não há mais lugar para você aqui."
 holy_order.2004.desc:0 "Dediquei minha vida a [child.GetFaith.HighGodNameAlternate], mas [child.GetFaith.HighGodNameSheHe] não gostaria que eu ignorasse minha própria família.\n\n[grandmaster.GetTitledFirstName] me deu permissão para retornar à minha vida anterior e me tornar parte de sua [ROOT.Char.Custom('GetCourt')] mais uma vez."
 holy_order.2004.opening:0 "[child.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 holy_order.2005.a:0 "Oh, você... veio para ficar?"
 holy_order.2005.desc:0 "A visita d[Select_CString( child.IsFemale, 'a', 'o' )] [child.GetTitledFirstNamePossessive] durou mais tempo do que o usual. Só depois que [child.GetHerselfHimself] se instalou em minha [ROOT.Char.Custom('GetCourt')] — se empanturrando com minha comida e importunando meus servos — é que abordei o assunto de retornar a [holy_order.GetName]. A resposta de [child.GetHerHis|U] foi, infelizmente, entusiástica.\n\n\"Você não ouviu, [ROOT.Char.Custom('MotherFather')]? [grandmaster.GetTitledFirstName] foi tão generoso que me isentou das minhas obrigações com o [child.GetFaith.GetName]! Finalmente estou em casa, com minha família.\""
 holy_order.2005.t:0 "Um Retorno ao Lar"
 holy_order.2009.a:0 "Esta nova ordem deve ser guiada por aqueles que apoio."
 holy_order.2009.b.tt:0 "...e abandonariam seus superiores pela mestria desta nova ordem, pela liberdade de escrever uma nova regra."
 holy_order.2009.b:0 "Muitos monges chafurdam sob sua ordem atual..."
 holy_order.2009.c:0 "Reúna ascetas selvagens e jovens zelosos."
 holy_order.2009.desc:0 "Em meio ao pacífico [province.GetTerrain.GetNameNoTooltip|l], em um lugar amado pelo [province.GetCulture.GetCollectiveNoun], ponho a primeira pedra que um dia sustentará o mosteiro de [province.GetName].\n\nMeus trabalhadores juntam-se a simples oblatos para erguer paredes da terra, para extrair hinos de oração de seus corpos industriosos. Os primeiros monges honrados — como [potential_leader.Custom('SisterBrother')|U] [potential_leader.GetName] — vieram caminhar por este lugar também, e elaborar planos para capelas e refeitórios.\n\nEm questão de anos, uma nova ordem nascerá aqui. E, além de pedra e [ROOT.Char.Custom('GetWritingMaterial')], esta ordem precisará de mais membros juramentados."
 holy_order.2009.t:0 "A Construção de um Mosteiro"
 holy_order.2010.4:0 "[tenet_4.GetName( order_rite )], e [monk_tenet_1.Custom('SisterBrother')|U] [monk_tenet_1.GetFirstNameNoTooltip]."
 holy_order.2010.5:0 "[tenet_5.GetName( order_rite )], e [monk_tenet_2.Custom('SisterBrother')|U] [monk_tenet_2.GetFirstNameNoTooltip]."
 holy_order.2010.6:0 "[tenet_6.GetName( order_rite )], e [monk_tenet_3.Custom('SisterBrother')|U] [monk_tenet_3.GetFirstNameNoTooltip]."
 holy_order.2010.d:0 "[tenet_1.GetName( order_rite )], e [monk_tenet_1.Custom('SisterBrother')|U] [monk_tenet_1.GetFirstNameNoTooltip]."
 holy_order.2010.desc:0 "Eremitas, místicos e discípulos descontentes de ordens mais antigas reuniram-se em [barony.GetNameNoTier] e trabalharam, durante anos, para construir seu novo lar no deserto. Um [leader.GetWomanMan] chamado [leader.Custom('SisterBrother')|U] [leader.GetFirstName] ergueu-se como o líder natural desta Ordem em crescimento, '[leader.GetPrimaryTitle.GetName]'... mas #EMP a minha#! voz augusta ainda não foi ouvida sobre este assunto. Também ainda não propus um preceito sagrado para consagrar como o coração do modo de vida desta Ordem.\n\nSobre o que este coro de devotos puros cantará em [barony.GetNameNoTierNoTooltip]? Pelo que trabalharão para viver plenamente, para pensar e escrever sobre? E quem os liderará nisso?"
 holy_order.2010.e:0 "[tenet_2.GetName( order_rite )], e [monk_tenet_2.Custom('SisterBrother')|U] [monk_tenet_2.GetFirstNameNoTooltip]."
 holy_order.2010.f:0 "[tenet_3.GetName( order_rite )], e [monk_tenet_3.Custom('SisterBrother')|U] [monk_tenet_3.GetFirstNameNoTooltip]."
 holy_order.2010.t:0 "Uma Nova Ordem Monástica"
 holy_order.2020.a.tt:0 "Nenhum lugar neste mundo mortal poderia ser mais adequado para o instruído [recipient.GetFirstNameNoTooltip]."
 holy_order.2020.a:0 "A Ordem ganhou um discípulo sábio."
 holy_order.2020.aa.tt:0 "As habilidades de intendência de [recipient.GetFirstNamePossessiveNoTooltip] servirão bem aos seus trabalhos incessantes."
 holy_order.2020.aa:0 "A Ordem ganhou uma mente industriosa."
 holy_order.2020.b:0 "O [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] do seu Patrono não é nenhuma pia de lavar pratos-[recipient.Custom('GirlBoy')]..."
 holy_order.2020.c:0 "Uma 'doação' garantirá que [recipient.GetFirstNameNoTooltip] seja mimado."
 holy_order.2020.d:0 "A vida de [recipient.GetHerHis|U] pertence à Ordem agora."
 holy_order.2020.desc:0 "Por minha insistência, [recipient.GetFirstNamePossessive] vira suas costas recém-vestidas de [recipient.GetHerHis] para longe do meu [ROOT.Char.Custom('ResidenceBuilding')], do [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] e da nobreza do mundo profano. [recipient.GetSheHe|U] é induzido em [archabbot.GetPrimaryTitle.GetName].\n\nComo os outros [recipient.Custom('SistersBrothers')] da [recipient.GetHerHis] Ordem, [recipient.GetFirstNameNoTooltip] jura dever e fidelidade à sua comunidade sagrada. [recipient.GetSheHe|U] compromete [recipient.GetHerHis] carne a [recipient.GetFaith.HighGodName], e [recipient.GetHerHis] mente à reverência de [recipient.GetFaith.PositiveAfterLife].\n\n[recipient.GetFirstNameNoTooltip] residirá em [archabbot.GetCapitalLocation.GetName], ou em outro dos santuários da Ordem, e ali começará [recipient.GetHerHis] vida de estudo e contemplação."
 holy_order.2020.t:0 "Votos Monásticos"
 holy_order.2020.toast_puppeteer:0 "[recipient.GetShortUIName] entrou em uma ordem monástica a pedido de [puppet_or_actor.GetShortUINamePossessive]"
 holy_order.2030.a:0 "Novos defensores para a minha salvação."
 holy_order.2030.desc:0 "Minhas riquezas são enviadas para os cofres dos mosteiros de [recipient.GetTitledFirstNamePossessive]. Uma doação que financiará o trabalho reverente das terras, a cópia de textos sagrados, os objetivos mundanos de [recipient.GetPrimaryTitle.GetName]...\n\n...e mil orações dedicadas à causa da minha alma imortal. Pois os monges vivem para orar, e sua devoção singular e justa — dizem — faz com que [ROOT.Char.GetFaith.random_GoodGodNames|U] preste especial atenção às suas orações.\n\n#EMP [actor.GetFaith.HighGodName|U], você ouve eles pronunciarem meu nome?#!"
 holy_order.2030.desc_desperate_plea:0 "#EMP Você sabe como eu rastejei e implorei — como um desgraçado — pela sua misericórdia?#!"
 holy_order.2030.desc_huge_donation:0 "#EMP Você sabe a fortuna de que me separei...?#!"
 holy_order.2030.t:0 "Doação: [recipient.GetPrimaryTitle.GetNameNoTooltip]"
 holy_order.2030.toast_puppeteer:0 "[recipient.GetShortUIName] aceitou a doação monástica de [puppet_or_actor.GetShortUINamePossessive]"
 holy_order.2031.a:0 "Bah! Pelo menos ainda tenho minhas moedas."
 holy_order.2031.desc:0 "Pensei e orei sobre o seu pedido, e temo que nenhuma doação possa induzir meus monges a apelar a [recipient.GetFaith.HighGodName] em seu favor. Sua salvação parece estar além até mesmo de nós."
 holy_order.2031.opening:0 "[actor.GetCustom('SisterBrother')|U],"
 holy_order.2031.toast_puppeteer:0 "[recipient.GetShortUIName] recusou a doação monástica de [puppet_or_actor.GetShortUINamePossessive]"
 holy_order.2040.a:0 "Que sua Ordem prospere!"
 holy_order.2040.desc:0 "Está feito. Um capítulo de [recipient.GetPrimaryTitle.GetNameNoTier] será anexado ao [actor.GetFaith.HouseOfWorship] em [target.GetNameNoTier], e lá, no coração de [target.GetDeJureLiegeOfTier( 'duchy' ).GetNameNoTier], guardaremos textos antigos das bibliotecas de [recipient.GetCapitalLocation.GetName].\n\n"
 holy_order.2040.desc_huge_donation:0 "Tal é a gratidão da Ordem por sua santa caridade."
 holy_order.2040.desc_monks:0 "E, lá, nossos [recipient.GetFaith.DevoteeMalePlural] entoarão preces a [actor.GetFaith.HighGodName] em seu nome."
 holy_order.2040.desc_nuns:0 "E, lá, nossas [recipient.GetFaith.DevoteeFemalePlural] entoarão preces a [actor.GetFaith.HighGodName] em seu nome."
 holy_order.2040.desc_rite:0 "\n\nSaiba que o capítulo manterá as observâncias de [recipient.GetRite.GetName], como faz cada casa de nossa ordem."
 holy_order.2040.opening:0 "[actor.GetFirstName] de [actor.GetPrimaryTitle.GetNameNoTier], Ó Benfeitor,"
 holy_order.2040.toast_puppeteer:0 "[recipient.GetShortUIName] aceitou a oferta de [puppet_or_actor.GetShortUINamePossessive] de arrendar uma baronia"
 holy_order.2041.a:0 "A 'pureza' deles — tolice!"
 holy_order.2041.desc:0 "Nós, os mais puros devotos de [recipient.GetFaith.HighGodNamePossessive], nós que trazemos a santidade absoluta de [recipient.GetFaith.PositiveAfterLife] a esta Terra miserável... tememos que uma praga tenha caído sobre o reino de [actor.GetPrimaryTitle.GetNameNoTier] que nem nossas preces conseguem dissipar.\n\nEnquanto a alma de seu reino estiver abjetamente divorciada de [recipient.GetFaith.HighGodName], [recipient.GetPrimaryTitle.GetName] não pode se aventurar em [target.GetNameNoTier]."
 holy_order.2041.opening:0 "[actor.GetFirstName] de [actor.GetPrimaryTitle.GetNameNoTier],"
 holy_order.2041.toast_puppeteer:0 "[recipient.GetShortUIName] recusou a oferta de [puppet_or_actor.GetShortUINamePossessive] de arrendar uma baronia"
 holy_order.2050.desc:0 "\"Será que [target_order.GetName] ainda sofrem... como os eremitas no deserto fizeram?\" — assim começam todas as missivas ardentes de [clerical_helper.GetNamePossessive].\n\n\"Estaria [target_lessee.GetTitledFirstName] vestindo [target_lessee.GetHerselfHimself] de ouro?\" — perguntam os sermões dos reformadores em [barony.GetNameNoTier], e eles terminam com: #EMP \"Um novo caminho! Uma nova Regra!\"#!\n\nO mosteiro está rapidamente se tornando um antro de reforma piedosa e dissidência. Seus residentes mal são [target_lessee.GetPrimaryTitle.GetAdjectiveNoTooltip] mais, e mal se contentam com conversas estéreis sobre [target_order_tenet.GetName( founder.GetRite )]. Mas o espírito reformador deles ainda deve ser direcionado a um novo princípio, e a uma só mente."
 holy_order.2050.t:0 "Um Movimento Surge em [barony.GetNameNoTierNoTooltip]"
 holy_order.destroyed_message:0 "A [title.GetName] foi destruída"
 holy_order.destroyed_title:0 "Ordem Sagrada Dissolvida"
 holy_order.hired_by_enemy:0 "[holy_order.GetName] foi convocada por [actor.GetUIName] e agora está contra nós"
 holy_order.hired_message:0 "[holy_order.GetName] foi convocada por [actor.GetUIName]"
 holy_order.new_lease:0 "[holy_order.GetName] está agora alugando [barony.GetName] d[Select_CString( former_holder.IsFemale, 'a', 'o' )] [former_holder.GetTitledFirstName]"
 holy_order_expanded:0 "Ordem Sagrada Expandiu"
 holy_order_hired_by_enemy_message:0 "Ordem Sagrada Inimiga"
 holy_order_hired_message:0 "Ordem Sagrada Contratada"
 holy_order_letter.opening:0 "Companheiro servo de [ROOT.Char.GetFaith.HighGodNameAlternate]"
 lease_title_to_existing_monastic_order_interaction:0 "Conceder um Mosteiro"
 lease_title_to_existing_monastic_order_interaction_desc:0 "[lease|E] um [temple_holding|E] para [recipient.GetPrimaryTitle.GetName], obtendo [spiritual_fulfillment|E], [piety|E] e acesso ampliado à Ordem"
 monastic_founder_become_saint_tt:0 "[chosen_leader.GetShortUIName] se tornará um [GetTrait('saint').GetName( chosen_leader.Self )] após a morte de [chosen_leader.GetHerHis], se [chosen_leader.GetSheHe] tiver #high 65+#! [GetTrait('devoted').GetName( chosen_leader.Self )] [trait_level_track_xp|E] ou uma [piety_level|E] de pelo menos @piety_level_4_icon_christian! [GetModifier( 'piety_level_4' ).GetNameWithTooltip|L]"
 monastic_holy_order_expanded:0 "Ordem Monástica Expande-se"
