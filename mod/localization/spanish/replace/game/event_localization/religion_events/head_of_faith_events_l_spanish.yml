l_spanish:
 head_of_faith.0000.desc:0 "e todos os verdadeiros crentes esperam que eu, como o membro preeminente da fé, me comprometa a um califa existente.\n\nSomente pela submissão à autoridade máxima abaixo de [ROOT.Char.GetFaith.HighGodName] posso derivar minha própria autoridade, não importando quais sejam nossas outras diferenças teológicas.\n\nA principal questão diante de mim é, é claro, a quem #EMP eu#! — embora os mais espertos entre nós também perguntem como #EMP sinceramente#! — eu farei minha promessa..."
 head_of_faith.0000.new_faith_submitted_for_hook:0 "[ROOT.Char.GetTitledFirstName] enviou uma submissão ao seu califado"
 head_of_faith.0000.t:0 "Herdeiros do Profeta"
 head_of_faith.0000.wishes_to_schism_caliphate_flag_added:0 "Abandonar o seu califado escolhido será mais fácil para o resto da sua vida"
 head_of_faith.0001.a:0 "A realinhamento com a ortodoxia sunita é a nossa única opção."
 head_of_faith.0001.b:0 "Devemos continuar seguindo a autoridade [old_caliph.GetFaith.GetAdjectiveNoTooltip]!"
 head_of_faith.0001.c:0 "[sunni_caliph.GetTitledFirstNameNoTooltip] tem a nossa #EMP presente#! lealdade..."
 head_of_faith.0001.d:0 "Seguiremos [Select_CString( old_caliph.IsFemale, 'a', 'o' )] [old_caliph.GetTitledFirstNameNoTooltip]... por enquanto..."
 head_of_faith.0001.desc:0 "Nós [ROOT.Char.GetFaith.GetAdherentNamePlural] escolhemos seguir o caminho dos herdeiros de Abu Bakr, $head_of_faith.0000.desc$"
 head_of_faith.0001.e:0 "Eu #EMP sou#! o [ROOT.Char.GetFaith.ReligiousHeadTitleName]"
 head_of_faith.0001.t:0 "$head_of_faith.0000.t$: Sunita"
 head_of_faith.0011.a:0 "O pensamento xiita tradicional nos chama."
 head_of_faith.0011.b:0 "$head_of_faith.0001.b$"
 head_of_faith.0011.c:0 "[shia_caliph.GetTitledFirstNameNoTooltip] nos comanda. Por enquanto."
 head_of_faith.0011.d:0 "$head_of_faith.0001.d$"
 head_of_faith.0011.desc:0 "O [ROOT.Char.GetFaith.GetName] segue a linha infalível de Ali, $head_of_faith.0000.desc$"
 head_of_faith.0011.t:0 "$head_of_faith.0000.t$: Xiita"
 head_of_faith.0021.a:0 "Podemos eleger nossos próprios líderes."
 head_of_faith.0021.b:0 "$head_of_faith.0001.b$"
 head_of_faith.0021.desc:0 "Rejeitando a política barata de sunitas e xiitas, o [ROOT.Char.GetFaith.GetName] aderiu ao movimento Muhakkima do Islã. Embora os membros comuns do movimento não esperem que eu me submeta a um califa existente, eles podem aceitar um se eu deixar clara a minha lealdade."
 head_of_faith.0021.t:0 "$head_of_faith.0000.t$: Muhakkima"
 head_of_faith.0031.a:0 "$head_of_faith.0021.a$"
 head_of_faith.0031.acceptance_body:0 "aceita a promessa"
 head_of_faith.0031.b.acceptance:0 "@piety_level_3_icon_islam! [sunni_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.acceptance_body$"
 head_of_faith.0031.b.rejection:0 "@piety_level_0_icon_islam! [sunni_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.rejection_body$"
 head_of_faith.0031.b:0 "$head_of_faith.0001.a$"
 head_of_faith.0031.c.acceptance:0 "@piety_level_3_icon_islam! [shia_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.acceptance_body$"
 head_of_faith.0031.c.rejection:0 "@piety_level_0_icon_islam! [shia_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.rejection_body$"
 head_of_faith.0031.c:0 "$head_of_faith.0011.a$"
 head_of_faith.0031.d.acceptance:0 "@piety_level_3_icon_islam! [old_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.acceptance_body$"
 head_of_faith.0031.d.rejection:0 "@piety_level_0_icon_islam! [old_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.rejection_body$"
 head_of_faith.0031.d:0 "$head_of_faith.0001.b$"
 head_of_faith.0031.desc:0 "Como Zandaqa, pouco nos importa como as outras seitas islâmicas traçam a linha da sucessão do Profeta, e elas também não gostam de nós. Certamente, meus companheiros [ROOT.Char.GetFaith.GetAdherentNamePlural] não esperam que eu declare nossa submissão a qualquer califa existente.\n\nContudo, talvez ao prestar lealdade a uma das grandes potências do Islã, possamos comprar uma medida de segurança e tolerância para a nossa fé..."
 head_of_faith.0031.rejection.outcome:0 "Você é forçado a seguir seu próprio caminho de qualquer maneira"
 head_of_faith.0031.rejection_body:0 "rejeita a promessa"
 head_of_faith.0031.t:0 "$head_of_faith.0000.t$: Zandaqa"
 head_of_faith.0032.a:0 "@piety_level_3_icon_islam! Claro, como poderia dizer não?"
 head_of_faith.0032.b:0 "@piety_level_0_icon_islam! Fora com vocês, mendigos vis!"
 head_of_faith.0032.desc:0 "[Select_CString( pledge_target.IsFemale, 'A', 'Ao' )] [pledge_target.GetTitledFirstNameNoTooltip], nós, os [pledgeing_individual.GetFaith.GetAdherentNamePlural], desejamos prestar lealdade a você e tê-lo como nosso [head_of_faith|E].\n\nVocê poderia nos acolher sob sua orientação?"
 head_of_faith.0032.notif.a:0 "[pledge_target.GetTitledFirstNameNoTooltip] aceitou sua promessa!"
 head_of_faith.0032.notif.b:0 "[pledge_target.GetTitledFirstNameNoTooltip] rejeitou sua promessa!"
 head_of_faith.0032.t:0 "Promessa de Fé"
 head_of_faith.0100.a:0 "Nossa fé nos une: submetemo-nos à autoridade de [hof.GetTitledFirstNamePossessiveNoTooltip]!"
 head_of_faith.0100.b:0 "Atenderemos à vontade de [hof.GetHerHis]... #EMP por ora#!."
 head_of_faith.0100.desc:0 "Hoje, [ROOT.Char.GetRite.GetName] rompeu com [ROOT.Char.GetFaith.GetName]; a divisão foi formalmente reconhecida. Onde antes orávamos como um só com [hof.GetRite.GetName], agora permanecemos separados na própria forma de nossa devoção.\n\nAinda assim, [hof.GetTitledFirstName] permanece à frente de todos que habitam sob [ROOT.Char.GetFaith.HighGodName]. Devemos curvar nossas cabeças e ainda atender à orientação de [hof.GetTitledFirstNamePossessive], ou as diferenças em nossas crenças tornaram-se grandes demais?"
 head_of_faith.0100.t:0 "A Autoridade do [ROOT.Char.GetFaith.ReligiousHeadTitleName]"
