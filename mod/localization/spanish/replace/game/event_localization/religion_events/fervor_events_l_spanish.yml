l_spanish:
 fervor.1002.b:0 "Condenar [sinful_theocrat.GetSheHe] por suas transgressões!"
 fervor.1002.c:0 "Defender publicamente o caráter [sinful_theocrat.GetHerHim], mesmo que isso me coloque em risco!"
 fervor.1002.d:0 "Talvez eu deva apenas ficar em silêncio sobre isso..."
 fervor.1002.desc.ambitious:0 "tem tramado adquirir propriedades adicionais e títulos para [sinful_theocrat.GetHerselfHimself], aparentemente insatisfeito com as muitas possessões que [sinful_theocrat.GetSheHe] já possui."
 fervor.1002.desc.arbitrary:0 "tem feito exceções em procedimentos importantes para favorecer aqueles que [sinful_theocrat.GetSheHe] pessoalmente gosta em detrimento daqueles que [sinful_theocrat.GetSheHe] não gosta."
 fervor.1002.desc.arrogant:0 "considera-se inerentemente superior aos seus pares, incapaz de cometer erros e acima de qualquer dúvida."
 fervor.1002.desc.brave:0 "tem colocado irresponsavelmente a si mesmo e seus ajudantes em perigo desnecessário, apenas por buscar alguns momentos de emoção barata!"
 fervor.1002.desc.callous:0 "tem sido incrivelmente insensível, incapaz ou desinteressado em mostrar qualquer compaixão, mesmo para aqueles em situações desesperadoras."
 fervor.1002.desc.calm:0 "é incapaz de expressar emoções fortes, preferindo permanecer estoico e impassível, mesmo quando esse comportamento é claramente inadequado!"
 fervor.1002.desc.chaste:0 "foi descoberto que não teve relações sexuais por anos! Apesar de receber inúmeras propostas, o [sinful_theocrat.Custom('GetCouncilOrTitleName')] parece totalmente desinteressado em ter relações carnais com alguém."
 fervor.1002.desc.compassionate:0 "tem sido excessivamente compreensivo, concedendo misericórdia em situações onde ela não é necessária, simplesmente porque [sinful_theocrat.GetSheHe] não suporta ver as pessoas sofrerem."
 fervor.1002.desc.content:0 "falhou em buscar diversas oportunidades para aumentar o seu poder pessoal e posses, aparentemente satisfeito com o que [sinful_theocrat.GetSheHe] já tem."
 fervor.1002.desc.craven:0 "foi descoberto como alguém covarde e dócil, preferindo ceder às demandas dos outros em vez de lutar pelo que é certo."
 fervor.1002.desc.cynical:0 "foi descoberto por não acreditar verdadeiramente nos ensinamentos [sinful_theocrat.GetFaith.GetAdjective], vendo-os apenas como uma ferramenta política conveniente."
 fervor.1002.desc.deceitful:0 "tem mentido rotineiramente para os [sinful_theocrat.Custom('DefaultPriestTitlePlural')]. [sinful_theocrat.GetSheHe|U] aparentemente os engana para agirem com base em informações falsas, a fim de avançar seus esquemas furtivos!"
 fervor.1002.desc.diligent:0 "tem trabalhado até tarde da noite para concluir um dos seus projetos pessoais!"
 fervor.1002.desc.end:0 "\n\nEmbora escândalos entre os [sinful_theocrat.GetFaith.AltPriestTermPlural] não sejam novidade, é perturbador que um deles tenha ocorrido tão perto de casa..."
 fervor.1002.desc.end_hof:0 "\n\nEmbora escândalos entre os [sinful_theocrat.GetFaith.AltPriestTermPlural] não sejam novidade, muitos estão chocados que o líder de nossa fé tenha sucumbido a essas tentações."
 fervor.1002.desc.fallback:0 "é incrivelmente impio, deixando de cumprir até mesmo os padrões básicos esperados de um [sinful_theocrat.Custom('GetCouncilOrTitleName')]."
 fervor.1002.desc.fickle:0 "é incapaz de se manter firme quando as coisas ficam difíceis, cedendo ao primeiro sinal de resistência às decisões que [sinful_theocrat.GetSheHe] tomou."
 fervor.1002.desc.forgiving:0 "regularmente falha em punir adequadamente aqueles que não cumprem suas responsabilidades, preferindo dar-lhes uma segunda ou até terceira chance antes de puni-los!"
 fervor.1002.desc.generous:0 "está secretamente usando seu próprio dinheiro para alimentar os pobres e necessitados!"
 fervor.1002.desc.gluttonous:0 "foi descoberto devorando uma festa luxuosa de [sinful_theocrat.Custom('GetExpensiveMeal')], [sinful_theocrat.Custom('GetExpensiveMealAlt')], [sinful_theocrat.Custom('GetExpensiveDessert')] e [sinful_theocrat.Custom('GetExpensiveDrink')]. O excesso da indulgência na festa lançou uma sombra escura sobre a legitimidade [sinful_theocrat.GetHerHim]."
 fervor.1002.desc.greedy:0 "está desviando o dinheiro que seus seguidores doam para caridade, usando-o para seu benefício pessoal!"
 fervor.1002.desc.gregarious:0 "foi descoberto como alguém que impõe sua presença aos outros, violando o espaço pessoal deles e desperdiçando seu tempo!"
 fervor.1002.desc.honest:0 "foi descoberto como um mentiroso absolutamente terrível, cujos esquemas e enganações são risíveis e pouco convincentes."
 fervor.1002.desc.humble:0 "foi descoberto como alguém humilde e cheio de dúvidas sobre si mesmo, acreditando que aqueles ao seu redor são sempre mais capazes e que [sinful_theocrat.GetSheHe] não merece sua posição!"
 fervor.1002.desc.impatient:0 "é incapaz de esperar que as coisas sejam feitas corretamente, pressionando constantemente seus ajudantes e servos!"
 fervor.1002.desc.just:0 "foi descoberto com um código de honra incrivelmente rígido e inflexível, do qual [sinful_theocrat.GetSheHe] se recusa a abrir mão, independentemente de quaisquer circunstâncias atenuantes!"
 fervor.1002.desc.lazy:0 "está inventando desculpas para procrastinar e evitar suas responsabilidades a todo custo!"
 fervor.1002.desc.lustful:0 "foi pego 'in flagrante delicto' com vários jovens servos em seu lar! O pobre ajudante que os descobriu teve que desviar o olhar enquanto os culpados corriam para pegar suas roupas e se vestir."
 fervor.1002.desc.paranoid:0 "foi descoberto como alguém incrivelmente paranóico e desconfiado, sempre achando que todos ao redor [sinful_theocrat.GetHerHim] estão tramando sua queda!"
 fervor.1002.desc.patient:0 "tem o hábito de vacilar e hesitar ao tomar decisões importantes, causando atrasos desnecessários em suas atividades!"
 fervor.1002.desc.sadistic:0 "foi descoberto torturando [Select_CString( sinful_theocrat.IsFemale, 'uma serva', 'um servo' )] [sinful_theocrat.Custom('GirlBoy')] em uma câmara secreta sob seus aposentos, aparentemente se deleitando com os angustiantes gritos [Select_CString( sinful_theocrat.IsFemale, 'da pobre', 'do pobre' )] [sinful_theocrat.Custom('GirlBoyPossessive')]."
 fervor.1002.desc.shy:0 "tem inventado desculpas para evitar ir a encontros sociais, preferindo ficar isolado em seu lar!"
 fervor.1002.desc.start:0 "O mundo [sinful_theocrat.Custom('GetShockedExpression')] da fé [sinful_theocrat.GetFaith.GetAdjectiveNoTooltip] quando descobriu que [sinful_theocrat.Custom2('MyCharacterIntroduction', ROOT.Char)]"
 fervor.1002.desc.start_hof:0 "O mundo da fé [sinful_theocrat.GetFaith.GetAdjectiveNoTooltip] ficou chocado ao saber que [Select_CString( sinful_theocrat.IsFemale, 'a', 'o' )] [sinful_theocrat.GetTitledFirstName] [sinful_theocrat.GetHerselfHimself]"
 fervor.1002.desc.stubborn:0 "tem jogado fora relatórios de seus ajudantes sem nem mesmo lê-los, recusando-se a considerar qualquer nova informação sobre decisões que [sinful_theocrat.GetSheHe] já tomou."
 fervor.1002.desc.temperate:0 "tem levado um estilo de vida ascético em segredo! [sinful_theocrat.GetSheHe] aparentemente evita todas as luxúrias e confortos, preferindo viver de forma simples."
 fervor.1002.desc.trusting:0 "foi descoberto como alguém incrivelmente ingênuo e confiante, incapaz de questionar mesmo as mentiras mais óbvias contadas por seus ajudantes."
 fervor.1002.desc.vengeful:0 "tem mantido uma lista de todos que já prejudicaram [sinful_theocrat.GetSheHe], detalhando as inúmeras maneiras pelas quais pretende se vingar deles e satisfazer seu desejo de vingança!"
 fervor.1002.desc.wrathful:0 "tem espancado servos que não conseguem agradá-lo, causando-lhes graves danos!"
 fervor.1002.desc.zealous:0 "foi descoberto com uma crença inabalável nos mundos sobrenaturais e espirituais, mesmo sem ter qualquer evidência racional para tais coisas."
 fervor.1002.t:0 "Sacerdote Escandaloso"
 fervor.2001.a.a:0 "[virtuous_theocrat.GetSheHe|U] é um exemplo para todos nós!"
 fervor.2001.a.b:0 "Que louvável."
 fervor.2001.a.c:0 "Mas [virtuous_theocrat.GetSheHe] está fazendo isso por [ROOT.Char.GetFaith.HighGodName] ou por fama?"
 fervor.2002.desc.ambitious:0 "Poucos buscam o favor de [ROOT.Char.GetFaith.HighGodName] com mais fervor e determinação do que [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName].\n\nA determinação incansável [virtuous_theocrat.GetHerHim] se tornou uma inspiração para inúmeros jovens [virtuous_theocrat.GetFaith.GetAdherentNamePlural] próximos e distantes."
 fervor.2002.desc.arbitrary:0 "Qualquer estudioso sensato sabe que a vontade divina é inescrutável e sempre mutável, mas poucos exemplificam sua natureza como [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName].\n\nO [virtuous_theocrat.Custom('GetCouncilOrTitleName')] de [scoped_primary_title.GetNameNoTier] ganhou reputação por seus julgamentos rápidos e enigmáticos, tanto que muitos pensam que [virtuous_theocrat.GetSheHe] foi tocado por [ROOT.Char.GetFaith.HighGodName]."
 fervor.2002.desc.arrogant:0 "Ofender um emissário de [ROOT.Char.GetFaith.HighGodName] não é diferente de blasfemar na presença da própria divindade.\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] sabe disso muito bem, e durante seu tempo no [scoped_primary_title.GetName], [virtuous_theocrat.GetSheHe] sempre mostrou pouca tolerância aos cínicos e tolos."
 fervor.2002.desc.brave:0 "Muitos pregadores aspirantes viajam todos os dias até a [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFaith.HouseOfWorship] buscando orientação deste estimado sacerdote.\n\n[virtuous_theocrat.GetFirstNamePossessiveNoTooltip] tornou-se famos[Select_CString( virtuous_theocrat.IsFemale, 'a', 'o' )] por sua determinação e coragem inabaláveis. Seja para caçar uma fera selvagem ou enfrentar hereges e blasfemadores, [virtuous_theocrat.GetFirstNameNoTooltip] está sempre pronto e ansioso para enfrentar seus inimigos de frente."
 fervor.2002.desc.callous:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] tem mostrado repetidamente a muitos de seus pares e seguidores como é importante para um piedoso [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] manter uma atitude desapegada tanto em relação à tentação quanto à dor.\n\nAs paixões inspiradas pelo mundo material são passageiras e inconsequentes quando comparadas à glória dos céus."
 fervor.2002.desc.calm:0 "Muitos consideram [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] como a personificação da serenidade divina, algo que apenas poucas pessoas podem esperar alcançar em suas vidas.\n\nUm[Select_CString( virtuous_theocrat.IsFemale, 'a', '' )] [virtuous_theocrat.GetWomanMan] extremamente disciplinad[Select_CString( virtuous_theocrat.IsFemale, 'a', 'o' )], [virtuous_theocrat.GetFirstNameNoTooltip] é um exemplo brilhante do triunfo da razão sobre a paixão."
 fervor.2002.desc.chaste:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ganhou uma reputação impecável por sua absoluta rejeição de qualquer prazer carnal.\n\nSua disciplina inabalável tem servido como exemplo a seguir para muitos jovens seguidores [virtuous_theocrat.GetFaith.GetAdherentNamePlural] que tentam resistir ao apelo sedutor da libertinagem."
 fervor.2002.desc.compassionate:0 "Uma alma verdadeiramente abençoada, [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] se tornou um verdadeiro exemplo de bondade [ROOT.Char.GetFaith.GetAdjectiveNoTooltip], liderando seu rebanho com mãos gentis, sempre pronto para ouvir e ajudar as almas menos afortunadas que vêm a [virtuous_theocrat.GetSheHe] em busca de orientação."
 fervor.2002.desc.content:0 "De acordo com muitos, [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] verdadeiramente abraçou o desapego dos assuntos mundanos, o que é central para o dogma [ROOT.Char.GetFaith.GetAdjectiveNoTooltip].\n\n[virtuous_theocrat.GetSheHe] não mostra interesse em fama ou glória, contente em viver uma vida a serviço de [ROOT.Char.GetFaith.HighGodName]."
 fervor.2002.desc.craven:0 "A vida é um presente muito precioso, e [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] tem convencido muitos de seus seguidores a abraçar a virtude da cautela e previsão para evitar riscos desnecessários e viver por muito tempo a serviço de [ROOT.Char.GetFaith.HighGodNamePossessive].\n\n[virtuous_theocrat.GetSheHe|U] raramente sai de seu [virtuous_theocrat.GetFaith.HouseOfWorship], que dizem ser mais segura do que qualquer tesouro e tão inexpugnável quanto qualquer fortaleza."
 fervor.2002.desc.cynical:0 "Em seus anos de estudo e pregação, [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] construiu uma ilustre reputação como pensador crítico.\n\n[ROOT.Char.GetFaith.HighGodName] preencheu o mundo com mistérios, e somente através do constante questionamento e uma atitude racional os fiéis podem realmente alcançar a iluminação."
 fervor.2002.desc.deceitful:0 "A razão é o maior presente de [ROOT.Char.GetFaith.KnowledgeGodName] à humanidade, nos separando das feras.\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] é um brilhante exemplo dessa verdade. Com sua mente ágil e língua afiada, [virtuous_theocrat.GetSheHe] superou e ridicularizou inúmeros cínicos, blasfemos e, dizem alguns, até mesmo demônios."
 fervor.2002.desc.diligent:0 "Muitos contos foram inspirados pelo trabalho incansável de [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstNamePossessive] em serviço de [ROOT.Char.GetFaith.HighGodName].\n\nApesar de sua posição prestigiosa, [virtuous_theocrat.GetFirstNameNoTooltip] está sempre pronto para colocar as mãos na massa e cumprir até as tarefas mais cansativas e laboriosas, sendo um verdadeiro exemplo da virtude [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]."
 fervor.2002.desc.fallback:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] é considerado por muitos um paradigma de virtude [ROOT.Char.GetFaith.GetAdjectiveNoTooltip].\n\nO comportamento impecável e trabalho incansável [virtuous_theocrat.GetHerHim] como estudioso e pregador têm ajudado a revigorar significativamente a fé nos últimos anos."
 fervor.2002.desc.forgiving:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] se tornou um símbolo do perdão infinito de [ROOT.Char.GetFaith.HighGodName].\n\nSempre pronto para oferecer uma mão amiga e uma mente aberta aos necessitados, [virtuous_theocrat.GetFirstNameNoTooltip] tem sido fundamental para manter vivo o preceito [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] de que ninguém é verdadeiramente inocente e, portanto, ninguém pode julgar os outros além de [ROOT.Char.GetFaith.HighGodName]."
 fervor.2002.desc.generous.pope:0 "Os pobres e necessitados são sempre bem-vindos na [virtuous_theocrat.GetFaith.HouseOfWorship] [Select_CString( virtuous_theocrat.IsFemale, 'a', 'o' )] [virtuous_theocrat.GetFirstNamePossessive].\n\nO [virtuous_theocrat.Custom('GetCouncilOrTitleName')] de [scoped_primary_title.GetNameNoTier] será lembrado por muito tempo por sua natureza generosa e suas muitas obras de caridade. Seu exemplo tem incentivado muitos seguidores a abandonar suas posses materiais em busca de uma recompensa divina."
 fervor.2002.desc.generous:0 "Os pobres e necessitados são sempre bem-vindos na [virtuous_theocrat.GetFaith.HouseOfWorship] d[Select_CString( virtuous_theocrat.IsFemale, 'a', 'o' )] [virtuous_theocrat.GetFirstNamePossessive].\n\nO [virtuous_theocrat.Custom('GetCouncilOrTitleName')] de [scoped_primary_title.GetNameNoTier] tornou-se famoso por sua natureza generosa e suas muitas obras de caridade. Seu exemplo tem incentivado muitos seguidores a abandonar suas posses materiais em busca de uma recompensa divina."
 fervor.2002.desc.gluttonous:0 "Muitos têm relatado maravilhosas histórias sobre os banquetes suntuosos de [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstNamePossessive]. Um[Select_CString( virtuous_theocrat.IsFemale, 'a', '' )] [virtuous_theocrat.GetWomanMan] de gosto refinado, o [virtuous_theocrat.Custom('GetCouncilOrTitleName')] de [scoped_primary_title.GetNameNoTier] abraçou verdadeiramente a virtude epicurista que todo bom seguidor de [ROOT.Char.GetFaith.WealthGodName] deveria buscar."
 fervor.2002.desc.greedy:0 "Poucas [virtuous_theocrat.GetFaith.HouseOfWorshipPlural] podem se igualar em esplendor e generosidade ao [scoped_primary_title.GetName].\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] se dedicou de corpo e alma a comprovar sua devoção eterna ao dedicar um fluxo infinito de ouro e riquezas para a glória de [ROOT.Char.GetFaith.WealthGodName]."
 fervor.2002.desc.gregarious.pope:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] demonstra regularmente um alto nível de envolvimento com a comunidade, algo que todos os [virtuous_theocrat.GetFaith.GetAdherentNamePlural] aspiram emular.\n\nSempre disposto a ouvir seu rebanho, [virtuous_theocrat.GetSheHe] personifica o espírito congregacionalista que é frequentemente pregado, mas raramente seguido por seus colegas."
 fervor.2002.desc.gregarious:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] se tornou um pilar de sua comunidade.\n\nSempre pronto para ouvir e envolver-se com seu rebanho, [virtuous_theocrat.GetSheHe] personifica o espírito congregacionalista que é frequentemente pregado, mas raramente seguido por seus colegas."
 fervor.2002.desc.honest.pope:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] será lembrado por muito tempo pela maioria dos fiéis por sua honestidade.\n\nNenhuma mentira é pequena demais, nenhuma verdade é desconfortável demais para est[Select_CString( virtuous_theocrat.IsFemale, 'a', 'e' )] [virtuous_theocrat.GetWomanMan] piedos[Select_CString( virtuous_theocrat.IsFemale, 'a', 'o' )], cujo exemplo inspira inúmeros fiéis todos os dias."
 fervor.2002.desc.honest:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] tornou-se uma figura famosa e altamente respeitada entre muitos seguidores [virtuous_theocrat.GetFaith.GetAdherentNamePlural] por sua honestidade.\n\nNenhuma mentira é pequena demais, nenhuma verdade é desconfortável demais para est[Select_CString( virtuous_theocrat.IsFemale, 'a', 'e' )] [virtuous_theocrat.GetWomanMan] piedos[Select_CString( virtuous_theocrat.IsFemale, 'a', 'o' )], cujo exemplo inspira inúmeros fiéis todos os dias."
 fervor.2002.desc.humble:0 "Todas as obras do homem palidecem em comparação à magnificência de [ROOT.Char.GetFaith.HighGodNamePossessive].\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] sabe disso melhor do que muitos outros sacerdotes: muitas histórias se espalharam sobre sua natureza humilde e modesta. Renunciando à vida confortável que seu cargo lhe daria direito, [virtuous_theocrat.GetFirstNameNoTooltip] é frequentemente visto caminhando descalço entre os membros mais pobres de seu rebanho."
 fervor.2002.desc.impatient.pope:0 "Os homens têm apenas um curto período de tempo neste mundo, e é vontade de [ROOT.Char.GetFaith.HighGodName] que não desperdicemos um segundo sequer dele.\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] será lembrado por muito tempo pela maioria dos fiéis por sua intolerância à preguiça e ao trabalho desnecessário."
 fervor.2002.desc.impatient:0 "Os homens têm apenas um curto período de tempo neste mundo, e é vontade de [ROOT.Char.GetFaith.HighGodName] que não desperdicemos um segundo sequer dele.\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] adotou esse princípio tão profundamente que se tornou famoso em todos os lugares por sua intolerância à preguiça e ao trabalho desnecessário."
 fervor.2002.desc.just:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstNamePossessive] firme e inatacável reputação lhe rendeu o respeito de muitos.\n\nFrequentemente chamado para resolver disputas, [virtuous_theocrat.GetSheHe] é percebido por muitos como a personificação da justiça divina, que é tão central para o dogma [virtuous_theocrat.GetFaith.GetAdjectiveNoTooltip]."
 fervor.2002.desc.lazy:0 "Somente através do desapego absoluto das obras grosseiras deste mundo a alma pode encontrar seu lugar legítimo no próximo. E poucas pessoas incorporam essa virtude como o [virtuous_theocrat.Custom('GetCouncilOrTitleName')] de [scoped_primary_title.GetNameNoTier].\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] passa a maior parte de seus dias em meditação serena, evitando os jogos sem sentido da política e o incômodo do trabalho manual para alcançar um estado de serenidade divina."
 fervor.2002.desc.lustful:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] tornou-se uma inspiração para inúmeras pessoas virtuosas e objeto de desejo para muitos jovens seguidores [virtuous_theocrat.GetFaith.GetAdherentNamePlural].\n\nHistórias sobre as conquistas amorosas [virtuous_theocrat.GetHerHim] se espalharam por toda parte, levando muitos a considerar [virtuous_theocrat.GetSheHe] um modelo do amor infinito de [ROOT.Char.GetFaith.FertilityGodNamePossessive]."
 fervor.2002.desc.paranoid:0 "Quando hereges e blasfemadores se escondem em cada esquina, uma mente afiada e inquisitiva é a melhor ferramenta de qualquer seguidor devoto de [ROOT.Char.GetFaith.HighGodName].\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] inspirou inúmeros pregadores com suas dissertações sobre a revelação da heresia, garantindo a contínua integridade de nossa fé."
 fervor.2002.desc.sadistic.pope:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] se tornou respeitad[Select_CString( virtuous_theocrat.IsFemale, 'a', 'o' )] e temid[Select_CString( virtuous_theocrat.IsFemale, 'a', 'o' )] em igual medida pelos fiéis. Um[Select_CString( virtuous_theocrat.IsFemale, 'a', '' )] [virtuous_theocrat.GetWomanMan] impiedos[Select_CString( virtuous_theocrat.IsFemale, 'a', 'o' )], [virtuous_theocrat.GetSheHe] passa seus dias punindo pecadores onde quer que os encontre, assegurando a purificação de suas almas por meio de uma apoteose de dor."
 fervor.2002.desc.sadistic:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] se tornou respeitad[Select_CString( virtuous_theocrat.IsFemale, 'a', 'o' )] e temid[Select_CString( virtuous_theocrat.IsFemale, 'a', 'o' )] em igual medida por seu rebanho. Um[Select_CString( virtuous_theocrat.IsFemale, 'a', '' )] [virtuous_theocrat.GetWomanMan] impiedos[Select_CString( virtuous_theocrat.IsFemale, 'a', 'o' )], [virtuous_theocrat.GetSheHe] passa seus dias punindo pecadores onde quer que os encontre, assegurando a purificação de suas almas por meio de uma apoteose de dor."
 fervor.2002.desc.shy:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] se tornou um brilhante exemplo de como o isolamento é fundamental para purificar a alma.\n\nRenunciando aos problemas da sociedade comum, este reverenciado sacerdote alcançou um estado de comunhão com o divino que a maioria dos [virtuous_theocrat.GetFaith.GetAdherentNamePlural] só pode sonhar."
 fervor.2002.desc.temperate:0 "Um exemplo de ascetismo inabalável, [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] mostrou como uma alma disciplinada pode encontrar verdadeira paz e clareza somente através da meditação e da abstinência.\n\nApesar de sua ilustre posição, [virtuous_theocrat.GetFirstNameNoTooltip] se sustenta apenas com refeições frugais para mostrar seu compromisso inabalável com o dogma [virtuous_theocrat.GetFaith.GetAdjectiveNoTooltip]."
 fervor.2002.desc.trusting:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] trabalhou arduamente nos últimos anos para difundir a verdade revelada de que todos os homens [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] são honestos e francos.\n\nSomente confiando implicitamente na palavra de seu próximo é possível fomentar a honestidade em retorno."
 fervor.2002.desc.wrathful.pope:0 "Um[Select_CString( virtuous_theocrat.IsFemale, 'a', '' )] [virtuous_theocrat.GetWomanMan] apaixonad[Select_CString( virtuous_theocrat.IsFemale, 'a', 'o' )], [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] tornou-se notório por seu temperamento rápido e natureza violenta.\n\nSomente castigando a blasfêmia de forma rápida e clara é que o pecado pode ser purificado, e [virtuous_theocrat.GetFirstNameNoTooltip] certamente impôs o temor do [ROOT.Char.GetFaith.WarGodName] em inúmeros fiéis com suas frequentes explosões de raiva."
 fervor.2002.desc.wrathful:0 "Um[Select_CString( virtuous_theocrat.IsFemale, 'a', '' )] [virtuous_theocrat.GetWomanMan] apaixonad[Select_CString( virtuous_theocrat.IsFemale, 'a', 'o' )], [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] tornou-se famoso em cidades próximas e distantes por seu temperamento rápido e natureza violenta.\n\nSomente castigando a blasfêmia de forma rápida e clara é que o pecado pode ser purificado, e [virtuous_theocrat.GetFirstNameNoTooltip] sem dúvida impôs o temor do [ROOT.Char.GetFaith.WarGodName] em inúmeros fiéis com suas frequentes explosões de raiva."
 fervor.2002.desc.zealous.pope:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] é visto pelos olhos de muitos como um baluarte protegendo a fé contra corrupção e heresia.\n\nUm[Select_CString( virtuous_theocrat.IsFemale, 'a', '' )] [virtuous_theocrat.GetWomanMan] de devoção inflexível, [virtuous_theocrat.GetSheHe] luta dia e noite para garantir a integridade do [virtuous_theocrat.GetFaith.GetName] e para que o clero siga fielmente as verdades dogmáticas do [virtuous_theocrat.GetFaith.ReligiousText]."
 fervor.2002.desc.zealous:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] é visto pelos olhos de muitos como um baluarte protegendo a fé contra corrupção e heresia.\n\nUm[Select_CString( virtuous_theocrat.IsFemale, 'a', '' )] [virtuous_theocrat.GetWomanMan] de devoção inflexível, [virtuous_theocrat.GetSheHe] luta dia e noite para garantir que todos os membros de seu rebanho sigam o dogma [virtuous_theocrat.GetFaith.GetAdjectiveNoTooltip] à risca."
 fervor.2002.t:0 "Exaltação do [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]"
