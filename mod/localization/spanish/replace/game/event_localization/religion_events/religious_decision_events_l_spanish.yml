l_spanish:
 can_never_reform_kuzarism_tt:0 "[GetFaithByKey('kabarism').GetName] manterá permanentemente seus preceitos existentes."
 fp2_opportunistic_schismatic_modifier:0 "Cismático Oportunista"
 fp2_opportunistic_schismatic_modifier_desc:0 "Este personagem está buscando uma revelação..."
 natural_primitivism.0001.a.flavor:0 "Que necessidade tem a liberdade sagrada de ostentação cortesã?"
 natural_primitivism.0001.a:0 "Que a corte permaneça como a criação a fez."
 natural_primitivism.0001.desc.decree.council:0 "Apresento ao conselho um decreto despido: exibições frívolas de hierarquia e vergonha descabida não governarão mais estes salões!"
 natural_primitivism.0001.desc.decree.court:0 "Apresento a toda a corte um decreto despido: exibições frívolas de hierarquia e vergonha descabida não governarão mais estes salões!"
 natural_primitivism.0001.desc.reaction.ashamed:0 "[naturism_councillor.GetTitledFirstName], um prumo miserável, gagueja e balbucia com desconforto.\n\nE ainda assim, ao fim do dia, a cerimônia é descartada. Os velhos costumes são desamarrados, e os novos revelados."
 natural_primitivism.0001.desc.reaction.dissent:0 "Apego-se aos seus adornos cafonas, com medo da verdade nua e crua, há aqueles que ousam dissentir.\n\nE ainda assim, ao fim do dia, a cerimônia é descartada. Os velhos costumes são desamarrados, e os novos revelados."
 natural_primitivism.0001.desc.reaction.supportive:0 "[naturism_councillor.GetTitledFirstName], uma alma simples e pura, saúda meu pronunciamento com deleite nu.\n\nAo fim do dia, a cerimônia é descartada. Os velhos costumes são desamarrados, e os novos revelados."
 natural_primitivism.0001.t:0 "A Corte Desimpedida"
 natural_primitivism.0002.a.flavor:0 "Meu decreto os levou longe o bastante."
 natural_primitivism.0002.a:0 "Esta corte retornará à ordem."
 natural_primitivism.0002.desc.no_councillor:0 "A corte tornou-se... orgulhosa demais de sua virtude nua. O odor adocicado e enjoativo do erotismo, do luxo sensorial, flutua nos salões, sobrepujando nossos humores naturais. Sim, mesmo nus somos corrompidos pela vaidade. Não foi isso que [ROOT.Char.GetFaith.HighGodName] quis para nós.\n\nAgora, estamos vestidos mais uma vez em nossa vergonha, e melhores por isso."
 natural_primitivism.0002.desc.relieved:0 "A corte tornou-se... orgulhosa demais de sua virtude nua. Conforme abandonam a nudez da minha convicção, [naturism_councillor.GetTitledFirstName] — a mais aliviada de todos — garantiu que a corte fosse adornada novamente.\n\nEstamos vestidos mais uma vez em nossa vergonha, e melhores por isso."
 natural_primitivism.0002.desc.reluctant:0 "A corte tornou-se... orgulhosa demais de sua virtude nua. Até mesmo [naturism_councillor.GetTitledFirstName], outrora um humilde amigo da simplicidade sagrada, agora ostenta [naturism_councillor.GetHerHis] carne e empurra para os outros as virtudes infladas do nosso caminho. Sim, mesmo nus somos corrompidos pela vaidade. Não foi isso que [ROOT.Char.GetFaith.HighGodName] quis para nós.\n\nAgora, estamos vestidos mais uma vez em nossa vergonha, e melhores por isso."
 natural_primitivism.0002.t:0 "Um Retorno à Ordem Cortesã"
 natural_primitivism.0003.a.flavor:0 "Há liberdade em aceitar o exemplo da corte."
 natural_primitivism.0003.a:0 "Eu me colocarei com eles."
 natural_primitivism.0003.b.flavor:0 "Minha dignidade não é deles para comandar."
 natural_primitivism.0003.b.tt:0 "[naturism_liege.GetTitledFirstName] perde #N 20#! [opinion|E] de você. Cortesãos adultos que aceitam ou apoiam a disciplina da corte perdem #N 5#! [opinion|E] de você."
 natural_primitivism.0003.b:0 "Manterei minha dignidade."
 natural_primitivism.0003.desc:0 "[naturism_liege.GetTitledFirstName] proclamou uma nova disciplina para a corte de [naturism_liege.GetHerHis]: os cortesãos devem deixar de lado a hierarquia, a ostentação e a vergonha, postando-se abertamente na simplicidade que [naturism_liege.GetSheHe] exige.\n\nA expectativa é clara. Posso aceitar este exemplo cortesão, ou recusar e arcar com o frio da desobediência."
 natural_primitivism.0003.t:0 "O Exemplo da Corte"
 natural_primitivism.every_adult_courtier:0 "Todos os Cortesãos Adultos"
 religious_decision.0001.a.tt.1:0 "Os espíritos #P certamente notarão#! essa oferenda"
 religious_decision.0001.a.tt.2:0 "Isso pode chamar a atenção de um espírito #Z poderoso#!, para o bem ou para o mal"
 religious_decision.0001.a:0 "Uma grande oferenda de caramujos, frutas e mirra."
 religious_decision.0001.b.tt:0 "Os espíritos #P provavelmente notarão#! essa oferenda"
 religious_decision.0001.b:0 "Uma libação tradicional de grãos e borassa."
 religious_decision.0001.c.tt:0 "Os espíritos #N provavelmente ficarão ofendidos#!, mas a ousadia talvez #P os impressione#!"
 religious_decision.0001.c:0 "Oferenda? Bah! Minha presença aqui não é suficiente?"
 religious_decision.0001.d.flavor:0 "Os espíritos são caprichosos. É melhor não arriscar irritá-los."
 religious_decision.0001.d:0 "Pensando melhor, vamos evitar perturbá-los..."
 religious_decision.0001.desc:0 "Meu [realm_priest.GetFirstName] [ROOT.Char.Custom('MyPriestTitle')] me leva a uma clareira pacífica perto de um pequeno riacho, o gotejar constante da água sobre as pedras criando uma atmosfera relaxante.\n\n\"Os espíritos gostam deste lugar, [ROOT.Char.GetFirstNameNoTooltip]. Este é o melhor lugar para suplicarmos sua ajuda.\"\n\nSegurando duas cestas que [realm_priest.GetFirstName] trouxe consigo, [realm_priest.GetSheHe] acrescenta: \"Agora devemos decidir qual tipo de oferenda deixaremos para eles.\""
 religious_decision.0001.desc_landless:0 "Percorrendo a natureza com minhas cestas de oferendas, rapidamente encontro um riacho sereno, escondido na entrada de uma caverna.\n\nO ar parece denso com a presença de espíritos.\n\nNo entanto, sem saber exatamente quais estão presentes, pondero sobre o conteúdo das minhas cestas. O que devo oferecer a eles?"
 religious_decision.0001.t:0 "Adorquismo"
 religious_decision.0002.bad:0 "Isso não pode estar certo..."
 religious_decision.0002.common_loot:0 "Os espíritos deixam para trás um adorno comum"
 religious_decision.0002.desc.end_changed:0 "\n\nCom a conclusão da cerimônia, sinto-me diferente. Alterado de alguma forma..."
 religious_decision.0002.desc.end_no_change:0 "\n\nA quietude e a tranquilidade retornam à caverna. Tudo parece exatamente como estava antes."
 religious_decision.0002.desc.start_no_offering:0 "[realm_priest.GetFirstName] me olha, perplexo. \"Você se oferece... a si mesmo? Acho que isso funciona...\" [realm_priest.GetSheHe] diz, enquanto começa a andar em círculos ao meu redor."
 religious_decision.0002.desc.start_no_offering_alone:0 "Hesito por um momento, enquanto considero a possível audácia de oferecer apenas a mim mesmo aos espíritos. E então começo a andar em círculos para iniciar o ritual."
 religious_decision.0002.desc.start_offering:0 "[realm_priest.GetFirstName] derrama minha oferenda no chão e começa a andar em círculos ao redor dela."
 religious_decision.0002.desc.start_offering_alone:0 "Derramo minha oferenda no chão e começo a caminhar ao redor dela em círculos."
 religious_decision.0002.desc:0 "\n\n\"Oh espíritos, ouçam-me. Eu vos invoco para conceder vossa ajuda a esta suplicante!\" [realm_priest.GetFirstNameNoTooltip] entoa.\n\n[realm_priest.GetSheHe|U] começa a se mover mais rápido, dançando agora, seus movimentos se tornando mais frenéticos, o suor brilhando em seu rosto. Eventualmente [realm_priest.GetSheHe] atinge um clímax, mal terminando a dança antes de cair exausto no chão."
 religious_decision.0002.desc_alone:0 "\n\n\"Espíritos, ouçam-me. Considerem minha oferenda e ajudem-me em meu clamor!\" exclamo no crepúsculo da caverna.\n\nEnquanto continuo a circular, uma súbita onda de energia toma conta de mim. O suor brota na minha testa, e meus membros se movem em frenesi — cada vez mais rápido. Eu me movo, me movo, #EMP me movo#! — até finalmente colapsar no chão, ofegante."
 religious_decision.0002.good:0 "Que sentimento estranho é esse?"
 religious_decision.0002.no_change.zealous:0 "Será que ofendi os espíritos de alguma forma?"
 religious_decision.0002.no_change:0 "Que desperdício de tempo."
 religious_decision.0002.possessed:0 "Sinto-me preso dentro do meu próprio corpo!"
 religious_decision.0002.shrewd:0 "Minha mente nunca esteve tão clara!"
 religious_decision.0002.strong:0 "Tanta energia! Tão vigoroso!"
 religious_decision.0002.t:0 "Adorquismo"
 religious_decision.0101.amitabha:0 "Amitābha, Buda da Luz Infinita."
 religious_decision.0101.avalokiteshvara:0 "Avalokiteshvara, bodisatva da compaixão."
 religious_decision.0101.bhaisajyaguru:0 "Bhaisajyaguru, o Buda da cura."
 religious_decision.0101.dakshinamoorthy:0 "Dakshinamoorthy, deus de todas as formas de aprendizado."
 religious_decision.0101.desc.end:0 "Dentre esses aspectos, um deve falar mais comigo do que os outros..."
 religious_decision.0101.desc.generic:0 "apenas alguns deles."
 religious_decision.0101.desc.shaivism:0 "as muitas encarnações de Shiva, o Destruidor."
 religious_decision.0101.desc.smartism:0 "os aspectos da realidade suprema."
 religious_decision.0101.desc.start:0 "Bhakti pode ser comparado a sentimentos de afeto, devoção e adoração, mas nenhum deles abrange totalmente o conceito. Ao me dedicar a um avatar da divindade, estou me comprometendo com ele em corpo e alma.\n\nO [ROOT.Char.GetFaith.GetNameNoTooltip] foca na veneração de"
 religious_decision.0101.desc.sukhavati:0 "os seres iluminados da Terra Pura, que ouvem todas as preces."
 religious_decision.0101.desc.vaishnavism:0 "as várias encarnações de Vishnu, o Preservador."
 religious_decision.0101.flavor:0 "Não há vergonha em esperar até que eu tenha certeza."
 religious_decision.0101.ganesha:0 "Ganesha, deus da sabedoria e novos começos."
 religious_decision.0101.ganga:0 "Ganga, deus da pureza e expiação."
 religious_decision.0101.hayagriva:0 "Haygriva, deus do conhecimento e sabedoria."
 religious_decision.0101.jagganath:0 "Jagganath, Senhor do Universo."
 religious_decision.0101.kali:0 "Kali, deusa da destruição do mal."
 religious_decision.0101.kubera:0 "Kubera, deus da riqueza e justiça."
 religious_decision.0101.lakishmi:0 "Lakishmi, deusa da fortuna e prosperidade."
 religious_decision.0101.munishwarar:0 "Munīshwarar, deus do lar e da família."
 religious_decision.0101.optout:0 "Ainda não estou pronto para decidir."
 religious_decision.0101.parvati:0 "Parvati, deusa da fertilidade e beleza."
 religious_decision.0101.saraswati:0 "Saraswati, deusa do conhecimento e arte."
 religious_decision.0101.shiva:0 "Shiva, o deus que caça o mal."
 religious_decision.0101.t:0 "Bhakti"
 religious_decision.0101.virabhadra:0 "Vīrabhadra, deus da ira justa."
 religious_decision.0101.vishnu:0 "Vishnu, o deus que observa a criação."
 religious_decision.0102.desc:0 "[ROOT.Char.GetFaith.PantheonTerm|U] são muitas e inscrutáveis, mas não posso negar que algumas delas têm um apelo especial para mim. Se eu me dedicar abertamente ao culto principalmente de uma dessas divindades, certamente atrairei almas semelhantes ao meu lado.\n\nSeja quais forem as bênçãos que meu patrono proporcionar, estar com outros [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] só pode trazer saúde, riqueza e glória."
 religious_decision.0102.flavor:0 "$religious_decision.0101.flavor$"
 religious_decision.0102.freyr:0 "Freyr, Senhor e Protetor!"
 religious_decision.0102.odin:0 "Odin, Chefe dos Aesir!"
 religious_decision.0102.optout:0 "$religious_decision.0101.flavor$"
 religious_decision.0102.t:0 "Decidindo sobre uma Divindade"
 religious_decision.0102.thor:0 "Thor, Amigo da Humanidade!"
 religious_decision.0102.tyr:0 "Tyr, o deus de uma mão só, guerreiro!"
 religious_decision.0102.ullr:0 "Ullr, caçador, guerreiro, Agente da Glória!"
 religious_decision.0201.desc:0 "Embarcar em uma jornada interior através da meditação não é algo trivial. Muitas preparações serão necessárias, a menor das quais é decidir onde me retirarei.\n\nO local que eu escolher para meditar influenciará muito o resultado da minha jornada."
 religious_decision.0201.desert:0 "O calor escaldante de [desert_location.GetNameNoTooltip]."
 religious_decision.0201.difficulty.easy:0 "[tooltip_loc.GetName] é um local #P seguro e fácil#! para meditar"
 religious_decision.0201.difficulty.hard:0 "[tooltip_loc.GetName] é um local #N difícil e perigoso#! para meditar"
 religious_decision.0201.difficulty.medium:0 "[tooltip_loc.GetName] é um local #Z moderadamente desafiador#! para meditar"
 religious_decision.0201.drylands:0 "As terras áridas de [drylands_location.GetNameNoTooltip]."
 religious_decision.0201.forest:0 "As florestas isoladas de [forest_location.GetNameNoTooltip]."
 religious_decision.0201.hills:0 "As colinas ondulantes de [hills_location.GetNameNoTooltip]."
 religious_decision.0201.home:0 "O conforto do meu próprio [ROOT.Char.Custom('ResidenceBuilding')]."
 religious_decision.0201.jungle:0 "As selvas cacofônicas de [jungle_location.GetNameNoTooltip]."
 religious_decision.0201.learning:0 "É mais provável que eu ganhe percepções teológicas neste local"
 religious_decision.0201.mountains:0 "As remotas montanhas de [mountains_location.GetNameNoTooltip]."
 religious_decision.0201.optout.flavor:0 "Não há pressa. O mundo não vai a lugar nenhum."
 religious_decision.0201.optout:0 "Estou muito ocupado para meditar agora."
 religious_decision.0201.plains:0 "As suaves planícies de [plains_location.GetNameNoTooltip]."
 religious_decision.0201.steppe:0 "Sob o imenso céu azul de [steppe_location.GetNameNoTooltip]."
 religious_decision.0201.stress:0 "É mais provável que eu perca [stress|e] neste local"
 religious_decision.0201.t:0 "Meditar em Seclusão"
 religious_decision.0201.trait:0 "É mais provável que eu ganhe percepções pessoais neste local"
 religious_decision.0201.wetlands:0 "Os pântanos fétidos de [wetlands_location.GetNameNoTooltip]."
 religious_decision.0210.toast:0 "Você começa a meditar"
 religious_decision.0211.a.critical_success:0 "Essa experiência ficará comigo para sempre."
 religious_decision.0211.a.failure:0 "Ai de mim..."
 religious_decision.0211.a.success:0 "Estou feliz por ter dedicado tempo para isso."
 religious_decision.0211.desc.beginning.desert:0 "Com o sol escaldante do deserto em [meditation_location.GetName] batendo em mim, olhei para dentro em busca de uma compreensão maior do meu lugar no universo."
 religious_decision.0211.desc.beginning.drylands:0 "O ar seco das terras áridas de [meditation_location.GetName] encheu meus pulmões e esfolou minha pele."
 religious_decision.0211.desc.beginning.forest:0 "Após chegar às florestas selvagens de [meditation_location.GetName], encontrei uma clareira tranquila para meditar."
 religious_decision.0211.desc.beginning.hills:0 "As vistas claras dos cumes das colinas em [meditation_location.GetName] favoreciam a reflexão pensativa."
 religious_decision.0211.desc.beginning.home:0 "Retirando-me para a privacidade de meus aposentos, comecei um longo período de jejum e meditação."
 religious_decision.0211.desc.beginning.jungle:0 "Os insetos zumbindo e os pássaros cantando das selvas de [meditation_location.GetName] forneceram um ruído de fundo constante enquanto eu procurava olhar para dentro de mim mesmo."
 religious_decision.0211.desc.beginning.mountains:0 "O ar rarefeito da montanha em [meditation_location.GetName] limpou meus pensamentos enquanto eu me concentrava para dentro."
 religious_decision.0211.desc.beginning.plains:0 "Fazendo uma viagem para as amplas planícies de [meditation_location.GetName], minha mente ficou desimpedida e livre para vagar."
 religious_decision.0211.desc.beginning.steppe:0 "Sob o imenso céu aberto da estepe de [meditation_location.GetName], minha mente ficou desimpedida e livre para vagar."
 religious_decision.0211.desc.beginning.wetlands:0 "O ar úmido dos pântanos de [meditation_location.GetName] fez com que minhas roupas grudassem na pele enquanto eu me sentava e olhava para dentro da minha alma."
 religious_decision.0211.desc.result.distraction:0 "\n\nInfelizmente, a cacofonia interminável servia como uma distração constante, e minha crescente irritação se tornou um obstáculo mental que eu não conseguia superar."
 religious_decision.0211.desc.result.epiphany:0 "\n\nMeditando em isolamento, fui repentinamente atingido por uma epifania. A presença do homem no mundo e como nos encaixamos na ordem natural... Outra peça do quebra-cabeça universal, encaixada!"
 religious_decision.0211.desc.result.fugue:0 "\n\nApós muitos dias, me vi entrando em um estado de transe, perdendo completamente minha noção de eu. Desvinculado de desejos e concepções, vi a verdade do universo escrita no próprio tecido do mundo ao meu redor. Eu podia ver tudo... entender tudo... o universo e eu, como um só.\n\nEventualmente, retornei ao meu eu antigo, embora ainda me lembre de fragmentos do que aprendi em meu transe."
 religious_decision.0211.desc.result.headache:0 "\n\nInfelizmente, pouco tempo depois, comecei a sofrer com uma forte dor de cabeça que não cessava. Logo eu não conseguia pensar em nada além da dor."
 religious_decision.0211.desc.result.hungry:0 "\n\nLogo, porém, a fome me dominou, e percebi que as provisões que trouxe eram terrivelmente insuficientes. Os dias restantes da minha viagem foram preenchidos com a luta para encontrar comida na natureza selvagem, deixando pouco tempo para contemplação."
 religious_decision.0211.desc.result.impatient:0 "\n\nLogo, porém, eu me tornei impaciente, pois, por mais imóvel que eu ficasse ou por mais que tentasse, não consegui sentir nada além de tédio."
 religious_decision.0211.desc.result.major_stress:0 "\n\nIsolado longe na natureza selvagem, percebi que os problemas que me atormentavam na corte já não tinham peso algum. Pela primeira vez em muito tempo, estava em paz."
 religious_decision.0211.desc.result.medium_stress:0 "\n\nA localização remota foi um benefício significativo, proporcionando-me um alívio bem-vindo dos problemas diários com os quais normalmente tenho que lidar na corte."
 religious_decision.0211.desc.result.minor_stress:0 "\n\nLivre das preocupações triviais da vida cotidiana na corte, logo me peguei gastando mais tempo apenas aproveitando os prazeres simples da vida."
 religious_decision.0211.desc.result.reflection:0 "\n\nOlhando profundamente para dentro de mim, percebi que essa vida que venho vivendo tem sido superficial e imperfeita, contaminada por desejos insalubres. Ao retornar de minha jornada, percebi que essas coisas já não têm o apelo que tinham antes."
 religious_decision.0211.desc.result.secret:0 "\n\nInfelizmente, eu não conseguia parar de pensar nos segredos obscuros que guardo. O que aconteceria se o mundo descobrisse? Preocupado com tais pensamentos, não consegui encontrar paz."
 religious_decision.0211.desc.result.thirsty:0 "\n\nEm pouco tempo, meus lábios racharam e uma sede crescente que não poderia saciar por muito tempo apenas com a minha cantina. Logo percebi que precisaria me abrigar para sobreviver ao calor, mas a estalagem que encontrei estava muito movimentada para que eu pudesse encontrar a paz e o silêncio que precisava."
 religious_decision.0211.experience:0 "Você melhora sua habilidade em meditação"
 religious_decision.0211.t:0 "$religious_decision.0201.t$"
 religious_decision.0291.toast:0 "Você conclui sua meditação"
 religious_decision.0302.a:0 "Descanse em paz, [ROOT.Char.Custom2('RelationToMe', ROOT.Var('ancestor_to_bury').Char)]."
 religious_decision.0302.desc.wilderness:0 "Como é tradição, um pequeno grupo de minha corte se reuniu para levar o corpo de [ROOT.Var('ancestor_to_bury').Char.GetFirstNamePossessive] para o deserto, para que possamos dar a [ROOT.Var('ancestor_to_bury').Char.GetSheHe] um enterro adequado.\n\nNotando a procissão, não demorou muito para que os abutres começassem a voar em círculos no céu. Ansiosos, mas não impacientes, eles esperavam que terminássemos nossas últimas palavras e partíssemos antes de descer para se banquetear."
 religious_decision.0302.desc.zoroastrian:0 "Para evitar a contaminação pelo demônio do cadáver, Nasu, não me é permitido entrar na Torre Dakhma onde o corpo de [ROOT.Var('ancestor_to_bury').Char.GetFirstNamePossessive] será exposto.\n\nEm vez disso, vários [ROOT.Char.GetFaith.PriestNeuterPlural] que foram especialmente treinados no manuseio de corpos mortos pegam o cadáver [ROOT.Var('ancestor_to_bury').Char.GetHerHim], conduzindo-o até o topo da torre.\n\nApós algum tempo, os [ROOT.Char.GetFaith.PriestNeuterPlural] retornam. \"Está feito, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip]. Agora os abutres vão limpar a carne do corpo [ROOT.Var('ancestor_to_bury').Char.GetHerHim] e os raios do sol vão branquear os ossos [ROOT.Var('ancestor_to_bury').Char.GetHerHim].\""
 religious_decision.0302.t:0 "Sepultamento Celeste"
 religious_decision.0401.a:0 "Fico imaginando o que mais o futuro reserva?"
 religious_decision.0401.desc.beginning:0 "Passei muitas noites olhando para o céu noturno, acompanhando os movimentos dos corpos celestes.\n\nCom o tempo, percebi um padrão, e após dias de análise, estou confiante em minha previsão. Os sinais são claros —"
 religious_decision.0401.desc.betrayal:0 "meus aliados não são quem eu pensava que fossem."
 religious_decision.0401.desc.great_battle:0 "uma grande batalha me aguarda."
 religious_decision.0401.desc.hard_work:0 "o trabalho árduo me levará a uma grande fortuna no futuro."
 religious_decision.0401.desc.new_beginnings:0 "é um momento de novos começos e mentes abertas."
 religious_decision.0401.desc.new_friends:0 "é hora de curar velhas feridas e fazer novos amigos."
 religious_decision.0401.t:0 "Adivinhando as Estrelas"
 religious_decision.0501.a:0 "Um bo[Select_CString( ROOT.Char.IsFemale, 'a', 'm' )] [ROOT.Char.GetTitleAsNameNoTooltip] permite que seu povo siga seus próprios caminhos."
 religious_decision.0501.b:0 "Talvez uma reforma moderada agrade a ambos os lados."
 religious_decision.0501.c:0 "A fé do [ROOT.Char.GetFaith.GetNameNoTooltip] deve ser evangelizada para o mundo!"
 religious_decision.0501.d:0 "O [ROOT.Char.GetFaith.GetNameNoTooltip] é a única fé verdadeira, e os [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] são mensageiros de [ROOT.Char.GetFaith.HighGodNamePossessive]."
 religious_decision.0501.desc:0 "Há gerações, a nobreza d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] tem professado devoção à fé [ROOT.Char.GetFaith.GetAdherentNameNoTooltip], mas o pluralismo religioso com deuses locais tem sido comum dentro da sociedade [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]. No entanto, com a restauração do Sacerdócio Maior, [ROOT.Char.GetFaith.ReligiousHeadTitleName] [ROOT.Char.GetFaith.ReligiousHeadName] insiste que essa prática pagã chegue ao fim e exige que todos que prestam homenagem ao Cã também prestem homenagem a Deus e o adorem da maneira correta.\n\nNo entanto, como [ROOT.Char.GetTitleAsNameNoTooltip], eu detenho a autoridade para decidir sobre o futuro da fé em meu [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] e o futuro das Estepes depende de minha palavra."
 religious_decision.0501.diff_culture.tt:0 "Cada [vassal|E] de [culture|E] Diferente"
 religious_decision.0501.jewish.tt:0 "Cada [vassal|E] Judeu"
 religious_decision.0501.nonjewish.tt:0 "Cada [vassal|E] Não Judeu"
 religious_decision.0501.t:0 "[Select_CString( ROOT.Char.IsFemale, 'A', 'O' )] [ROOT.Char.GetTitleAsNameNoTooltip] e a Fé [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]"
 religious_decision.0502.a:0 "Verdadeiramente, um dia sombrio para o [ROOT.Char.GetFaith.GetNameNoTooltip]."
 religious_decision.0502.b:0 "Já era hora!"
 religious_decision.0502.desc.body:0 "No entanto, ultimamente, [Select_CString( khazar_khan.IsFemale, 'a', 'o' )] [khazar_khan.GetTitleAsNameNoTooltip] e os rabinos do reino têm estado em acalorados debates sobre a natureza das religiões populares e dos descrentes dentro do [khazar_khan.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n[Select_CString( khazar_khan.IsFemale, 'A', 'O' )] [khazar_khan.GetTitleAsNameNoTooltip] chegou a uma decisão. "
 religious_decision.0502.desc.fundamentalist:0 "Não apenas o pluralismo religioso chegou ao fim, mas qualquer pessoa que não pratique o [ROOT.Char.GetFaith.GetNameNoTooltip] ortodoxo é considerada um inimigo do [khazar_khan.GetPrimaryTitle.GetTierAsNameNoTooltip]. [Select_CString( khazar_khan.IsFemale, 'A', 'O' )] [khazar_khan.GetTitleAsNameNoTooltip] busca espalhar o [khazar_khan.GetFaith.GetNameNoTooltip] pelas Estepes e além, declarando ser dever de todo bom [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] se unir a essa nova era de guerra religiosa."
 religious_decision.0502.desc.intro:0 "Há gerações, a nobreza d[Select_CString( khazar_khan.IsFemale, 'a', 'o' )] [khazar_khan.GetPrimaryTitle.GetNameNoTierNoTooltip] tem professado devoção à fé [ROOT.Char.GetFaith.GetAdherentNameNoTooltip], mas o pluralismo religioso com deuses locais tem sido comum dentro da sociedade [khazar_khan.GetPrimaryTitle.GetAdjectiveNoTooltip]."
 religious_decision.0502.desc.righteous:0 "Em um decreto real, aqueles que ainda adoram os antigos costumes não receberão mais tratamento preferencial dentro do [khazar_khan.GetPrimaryTitle.GetTierAsNameNoTooltip], e todos os que prestarem homenagem [Select_CString( khazar_khan.IsFemale, 'a', 'ao' )] [khazar_khan.GetTitleAsNameNoTooltip] também prestarão homenagem ao próprio [khazar_khan.GetFaith.HighGodName]."
 religious_decision.0502.t:0 "[Select_CString( khazar_khan.IsFemale, 'A', 'O' )] [khazar_khan.GetTitleAsNameNoTooltip] e a Fé [khazar_khan.GetFaith.GetAdherentNameNoTooltip]"
 religious_decision.0503.a.jewish:0 "L'chaim!"
 religious_decision.0503.a.non_jewish:0 "Melhor eu começar a praticar."
 religious_decision.0503.b:0 "Eu não consigo falar essa estranha língua!"
 religious_decision.0503.desc:0 "Como o governante mais influente da cultura [hebrew_language_adopter_scope.GetCulture.GetName], e um governante de um vasto reino judaico, [hebrew_language_adopter_scope.GetName] decretou que o hebraico é agora a língua litúrgica e comum do povo [hebrew_language_adopter_scope.GetCulture.GetNameNoTooltip]!\n\nO hebraico tem sido a língua litúrgica da fé judaica por milênios, mas agora que [hebrew_language_adopter_scope.GetNameNoTooltip] governa uma maioria judaica, a necessidade de usar outras línguas no cotidiano está diminuindo. Embora nem todos os [hebrew_language_adopter_scope.GetCulture.GetNameNoTooltip] pratiquem a fé judaica, provavelmente levará apenas uma ou duas gerações até que todos estejam falando a língua hebraica."
 religious_decision.0503.t:0 "A Língua Hebraica"
 religious_decision.0601.a:0 "Agora eu carrego este pesado fardo..."
 religious_decision.0601.b:0 "Hah, toma #EMP essa#!, [old_caliph.GetFirstNameNoTooltip]."
 religious_decision.0601.desc:0 "Sem uma liderança #EMP verdadeira#!, estamos perdidos.\n\n[old_caliph.GetTitledFirstName] não tem fornecido tal orientação para nós, [founder.GetFaith.GetAdherentNamePlural], desde que ocupou o cargo, e outros de minha fé têm sofrido pela falta de conselhos, autoridade e jurisprudência [old_caliph.GetHerHim].\n\nCom o coração pesado, e o apoio de alguns dos clérigos mais influentes do mundo [founder.GetFaith.GetAdjectiveNoTooltip], declarei que é a vontade incansável de [founder.GetFaith.HighGodName] que eu assuma o cargo de [founder.GetFaith.ReligiousHeadTitleName].\n\nMeus herdeiros e eu o manteremos a partir de hoje até o Dia do Acerto de Contas, e, sob minha mão firme, os verdadeiros crentes do mundo prosperarão!"
 religious_decision.0601.t:0 "Dividindo a Ummah: [founder.GetFaith.GetAdjectiveNoTooltip] [founder.GetFaith.ReligiousHeadTitleName|U]"
 religious_decision.0601.tt.all_rulers_stayed:0 "Nenhum governante importante [founder.GetFaith.GetAdjective] se converterá ao [old_caliph.GetFaith.GetName] em protesto."
 religious_decision.0601.tt.some_rulers_converted_away:0 "[THIS.Var('schismed_caliphate_major_ruler_converted_count').GetValue|0] [rulers|E] irão se converter ao [old_caliph.GetFaith.GetName] em protesto."
 religious_decision.0602.a.tt:0 "Você se acomoda tranquilamente à nova ordem."
 religious_decision.0602.a:0 "[founder.GetTitledFirstNameNoTooltip] certamente se provará digno."
 religious_decision.0602.b:0 "Minha lealdade [Select_CString( old_caliph.IsFemale, 'a', 'ao' )] [old_caliph.GetTitledFirstNameNoTooltip] é inabalável!"
 religious_decision.0602.c:0 "As pessoas parecem desesperadas por um verdadeiro líder..."
 religious_decision.0602.desc:0 "[founder.GetFirstName] não tem feito segredo do fato de que #EMP detesta#! como [old_caliph.GetTitledFirstName] exerce o sagrado cargo de [old_caliph.GetFaith.ReligiousHeadName], mas duvido que alguém imaginasse que [founder.GetSheHe] iria tão longe como #EMP isso#!.\n\n[Select_CString( founder.IsFemale, 'A', 'O' )] [founder.GetWomanMan] louca reuniu apoio suficiente para se #EMP declarar#! [founder.GetFaith.ReligiousHeadName], dividindo a Ummah!\n\nDe maneira angustiante, os plebeus aceitaram amplamente a decisão como parte das maquinações de seus superiores. Como uma das principais figuras do [founder.GetFaith.GetName], cabe a mim decidir se meu reino vai seguir ou discordar."
 religious_decision.0602.t:0 "$religious_decision.0601.t$"
 religious_decision.0603.a:0 "Demônio! Covarde! Blasfemador!"
 religious_decision.0603.b:0 "[old_caliph.GetTitledFirstNameNoTooltip] não consegue manter sua casa em ordem..."
 religious_decision.0603.c:0 "Ha! Que grande drama!"
 religious_decision.0603.desc:0 "As tensões entre [founder.GetFirstName] e [old_caliph.GetShortUINameNoFormat] têm aumentado ultimamente, mas [founder.GetFirstNameNoTooltip] elevou a um nível inesperadamente feroz.\n\nCom o apoio de muitos dos principais clérigos do [founder.GetFaith.GetName], [founder.GetFirstNameNoTooltip] declarou com sucesso que [founder.GetSheHe] é o #EMP verdadeiro#! [founder.GetFaith.ReligiousHeadName] de sua fé, suplantando a autoridade de [old_caliph.GetShortUINamePossessiveNoTooltipNoFormat] sobre aqueles que se afastaram da ortodoxia do [old_caliph.GetFaith.GetName].\n\nMuitos dos mais comunitários $islam_religion_adherent_plural$ do mundo choram abertamente com o aparecimento de outra divisão na Ummah."
 religious_decision.0603.t:0 "$religious_decision.0601.t$"
