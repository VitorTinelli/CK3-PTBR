l_spanish:
 global_culture.0002.a:0 "Os tempos estão mudando, e devemos mudar com eles."
 global_culture.0002.b:0 "Não abandonaremos as tradições de nossos ancestrais!"
 global_culture.0002.desc:0 "Há muito tempo, nossos ancestrais migraram para a península Ibérica e construíram seus primeiros assentamentos. Vivemos aqui por gerações desde então, a terra nos moldando tanto quanto moldamos a terra.\n\nÉ hora de nos perguntarmos, ainda somos visigodos? Ou somos algo completamente novo?"
 global_culture.0002.t:0 "Destino dos Visigodos"
 global_culture.0005.a:0 "Apenas o tempo dirá como isso afetará a região."
 global_culture.0005.desc:0 "Quando os visigodos migraram pela primeira vez para a península Ibérica, eles eram estrangeiros em uma terra nova e estranha.\n\nIsso mudou ao longo de muitas gerações, pois a terra os moldou tanto quanto eles moldaram a própria terra. Com o tempo, as diversas comunidades visigodas se tornaram distintas e separadas umas das outras.\n\nApesar de sua herança compartilhada, essas novas comunidades - [castilian.GetName], [catalan.GetName], [occitan.GetName] e [andalusian.GetName] - não reconhecem mais umas às outras como parentes."
 global_culture.0005.t:0 "$global_culture.0002.t$"
 global_culture.0012.a:0 "Devemos garantir nossa própria prosperidade em primeiro lugar."
 global_culture.0012.b:0 "Inaceitável! Os Nórdicos #EMP permanecerão#! unidos."
 global_culture.0012.desc:0 "Vivendo nas terras áridas da Escandinávia, nosso povo tem uma história de garantir nossa prosperidade e sobrevivência por meio de negociações, pilhagens e lutando como mercenários.\n\nCom o tempo, isso resultou no acúmulo de grande riqueza, fazendo com que nosso povo estabelecesse raízes e se fixasse em moradias permanentes com maior frequência.\n\nAgora, esses assentamentos começaram a se divergir culturalmente, à medida que suas tradições e até mesmo idiomas mudam para atender às demandas de seus novos estilos de vida."
 global_culture.0012.t:0 "Destino dos Nórdicos"
 global_culture.0015.a:0 "O que isso significa para o futuro da Europa?"
 global_culture.0015.b:0 "O que isso significa para o futuro do nosso povo?"
 global_culture.0015.desc:0 "Comerciantes, saqueadores e mercenários... os nórdicos têm viajado há muito tempo da Escandinávia por toda a Europa e até mesmo além, deixando sua marca por onde passam.\n\nAgora parece que essa era pode estar chegando ao fim, à medida que diferenças culturais e rivalidades entre clãs levaram ao surgimento de identidades [danish.GetName], [swedish.GetName] e [norwegian.GetName] díspares entre eles."
 global_culture.0015.desc_norse:0 "Comerciantes, saqueadores e mercenários... nossos ancestrais nórdicos têm viajado há muito tempo da Escandinávia por toda a Europa e até mesmo além, deixando sua marca por onde passam.\n\nAgora parece que essa era pode estar chegando ao fim, à medida que nossa terra natal está fragmentada por diferenças culturais e rivalidades entre clãs em identidades [danish.GetName], [swedish.GetName] e [norwegian.GetName]."
 global_culture.0015.t:0 "$global_culture.0012.t$"
 global_culture.0032.a:0 "Somos escoceses, agora e para sempre!"
 global_culture.0032.b:0 "Não devemos virar as costas para nossos conterrâneos."
 global_culture.0032.desc:0 "Embora compartilhemos origens comuns com os outros anglo-saxões, nossos clãs que vivem nas terras baixas do norte da Grã-Bretanha começaram a se divergir cultural e linguisticamente à medida que nos adaptamos à vida nas terras acidentadas.\n\nMuitos de nosso povo agora clamam por uma identidade cultural única que possamos chamar de nossa. Algo do qual podemos nos orgulhar..."
 global_culture.0032.t:0 "Ascensão dos Escoceses"
 global_culture.0035.a:0 "Serão capazes de prosperar por conta própria?"
 global_culture.0035.desc:0 "Embora compartilhem origens comuns com os outros anglo-saxões, os clãs que vivem nas terras baixas do norte da Grã-Bretanha se adaptaram à vida nas terras acidentadas.\n\nDivergindo cultural e linguisticamente de seus antigos conterrâneos, esses [scottish.GetName] têm abraçado entusiasticamente sua nova identidade cultural."
 global_culture.0035.t:0 "$global_culture.0032.t$"
 global_culture.3002.a:0 "A novos amigos e novos começos!"
 global_culture.3002.desc:0 "As terras do norte da França proporcionaram ao nosso povo um solo fértil para se estabelecer e expandir.\n\nAo adotar algumas tradições dos locais, seremos capazes de nos adaptar melhor à região."
 global_culture.3002.t:0 "Ascensão dos Normandos"
 global_culture.3003.a:0 "A partir deste dia em diante, nos chamamos Normandos!"
 global_culture.3003.desc:0 "Estamos distantes das terras que nossos ancestrais nórdicos chamavam de lar, mas são essas terras do norte da França que consideramos nosso país. Como líder do meu povo, é minha responsabilidade garantir a prosperidade futura e, se quisermos florescer, devemos nos adaptar ao nosso novo ambiente. Devemos aprender com as pessoas cujos antepassados fizeram uso dessas terras férteis.\n\nPor meio deste decreto, mudaremos nossa forma de vida para beneficiar nossa família. Forjaremos um novo caminho como nosso próprio povo."
 global_culture.3003.t:0 "$global_culture.3002.t$"
 global_culture.3005.a:0 "O que isso significa para a região?"
 global_culture.3005.desc:0 "Um grupo de colonos nórdicos vindos da Escandinávia se estabeleceu na costa do norte da França, fazendo um novo lar para si lá.\n\nS[Select_CString( norman_founder.IsFemale, 'ua', 'eu' )] líder, [norman_founder.GetTitledFirstName], decretou que seu povo adotará várias costumes e tradições locais para garantir que prosperem nesta nova terra."
 global_culture.3005.t:0 "$global_culture.3002.t$"
 global_culture.3011.a:0 "Um desenvolvimento interessante..."
 global_culture.3011.desc:0 "A mistura eclética de povos no sul da Itália e Sicília deu origem a uma cultura única, afetada pelas inúmeras influências.\n\nAgora está claro que as pessoas em [county_to_change.GetName] não se veem mais como [old_culture.GetName], mas como [sicilian.GetCollectiveNoun] nativos!"
 global_culture.3011.t:0 "Propagação da Cultura [sicilian.GetNameNoTooltip]"
 global_culture.3012.a:0 "Maravilhoso!"
 global_culture.4011.desc:0 "Os povos dos três reinos passaram a compartilhar uma identidade mais ampla após sua unificação, dando origem a uma cultura única que reflete suas múltiplas influências.\n\nAgora está claro que o povo de [county_to_change.GetName] não se vê mais como [old_culture.GetName], mas como [goryeo.GetCollectiveNoun] nativos!"
 global_culture.4011.t:0 "Disseminação da Cultura [goryeo.GetNameNoTooltip]"
 global_culture.custom.change_culture:0 "Todos os condados e personagens [old_culture.GetName] em seu reino se tornam [new_culture.GetName]"
 global_culture.custom.keep_culture:0 "Os condados e personagens [old_culture.GetName] em seu reino mantêm sua cultura."
 global_culture.custom.merge_culture:0 "Todos os condados e personagens [old_culture_1.GetName] e [old_culture_2.GetName] em seu reino se tornam [new_culture.GetName]"
 global_culture.custom.trigger:0 "Você não controla pelo menos 80% de todos os condados de [CHARACTER.GetCulture.GetName]"
