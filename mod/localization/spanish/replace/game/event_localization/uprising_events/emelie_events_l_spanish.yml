l_spanish:
 blotsven.0001.a.tt:0 "Inicie e conclua uma atividade de blot para obter uma revindicação."
 blotsven.0001.a:0 "Uma perspectiva interessante, vou investigar isso."
 blotsven.0001.b.tt:0 "Você abandona esta oportunidade de agradar aos deuses."
 blotsven.0001.b:0 "Bah, jamais!"
 blotsven.0001.desc:0 "Tarde da noite, [chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)] bate à minha porta e diz que o povo está revoltado. [ROOT.Char.GetTopLiege.GetTitledFirstName] está se recusando a fazer o blot anual, mas sem ele, conflitos e fomes recairão sobre todos nós! [chaplain.GetSheHe|U] enfatiza o quão importante este blot é, e diz que o povo verá o líder deste blot como o verdadeiro e legítimo [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip] de [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier].\n\n\"Você realizará o blot pelo povo?\""
 blotsven.0001.t:0 "Uma Visita Inesperada"
 blotsven.0002.a.tt:0 "Apedrejar missionários não é inédito."
 blotsven.0002.a:0 "Pegue a pedra mais próxima e atire nele."
 blotsven.0002.b.tt:0 "Este trovão é obviamente Thor vindo para golpear #S ele#!"
 blotsven.0002.b:0 "Pegue meu machado e mire na cabeça dele."
 blotsven.0002.c.tt:0 "Pare o blot e converta-se a [eskil.GetFaith.GetName]."
 blotsven.0002.c:0 "Algo na maneira como ele fala me encantou..."
 blotsven.0002.desc:0 "Assim que o blot está prestes a começar, um tumulto me distrai de fazer o juramento sobre o anel de ferro. Um homem de rosto vermelho e gritando e seus seguidores invadem nosso círculo sagrado.\n\n\"Parem em nome de [eskil.GetFaith.HighGodName]!\" ele grita, erguendo os braços para o céu. \"Golpeiem os pagãos que toleram este ato ímpio!\"\n\nComo se fosse por sua ordem, começa a chover e um relâmpago terrível rasga o horizonte."
 blotsven.0002.t:0 "Um Missionário Delirante"
 blotsven.0002.toast.k.tt:0 "[eskil.GetTitledFirstName] foi morto por mim."
 blotsven.0002.toast.m.tt:0 "[eskil.GetTitledFirstName] foi mutilado por mim."
 blotsven.0003.a.tt:0 "Ordene às pessoas ao meu redor que façam o que eu falhei em fazer."
 blotsven.0003.a:0 "Mate-o!"
 blotsven.0003.b.tt:0 "Pare o blot e converta-se a [eskil.GetFaith.GetName]."
 blotsven.0003.b:0 "Isto é um sinal? Talvez o deus dele seja mais forte que o meu..."
 blotsven.0003.desc:0 "[eskil.GetTitledFirstName] afasta-se pulando com um grito. Meu arremesso errou, e agora tenho um missionário ainda mais furioso em minhas mãos."
 blotsven.0003.t:0 "Um Missionário Furioso"
 blotsven.0003.toast.desc.tt:0 "Seu povo pega seu cadáver e o carrega de volta para Tuna."
 blotsven.0003.toast.tt:0 "[eskil.GetTitledFirstName] foi executado por minhas ordens."
 blotsven.0004.a:0 "É hora de ir para casa."
 blotsven.0004.desc:0 "O círculo de pessoas desapareceu, movendo-se em pequenos grupos ou sozinhos colina abaixo. Sinto-me como um novo [ROOT.Char.GetWomanMan]. Posso não ter conquistado o reino, mas minha alma eterna está salva."
 blotsven.0004.t:0 "Retorno Renascido"
 gruesome_activity_eskil_slain:0 "Eskil foi morto. Por seu sacrifício, ele foi feito santo."
 gruesome_activity_eskil_slain_title:0 "Matou Eskil"
