l_spanish:
 GNR_GLOSS:0 "Uma estrada construída pelos romanos que se estende ao longo de grande parte da espinha dorsal da Inglaterra. A Grande Estrada do Norte passa pelos seguintes [counties|E]:\n\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_middlesex').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_hertfordshire').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_bedford').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_northamptonshire').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_leicestershire').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_nottinghamshire').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_west_riding').GetBaseName]"
 all_neighbouring_villages:0 "Todas as [holdings|E] vizinhas a [offending_village.GetName]"
 artifact_church_saint_brooch_description:0 "Um antigo broche feito de estanho com incrustações de prata, que se diz ter sido usado por São [ROOT.Char.Custom('GetCatholicSaint')]. Foi roubado da capela em [neighboring_church.GetName] [Select_CString( ROOT.Char.IsFemale, 'pela', 'pelo' )] [ROOT.Char.GetFirstName]."
 artifact_church_saint_brooch_name:0 "Broche Santificado"
 county_list_tt:0 "Cada [county|E] de propriedade normanda dentro do [realm|E] d[Select_CString( william.IsFemale, 'a', 'o' )] [william.GetTitledFirstName]"
 ep3_decrease_pacification_effect_tt_negative:0 "[harrying_widget_i]#N [harrying_pacification|E] diminui#!"
 ep3_decrease_pacification_effect_tt_positive:0 "[harrying_widget_i]#P [harrying_pacification|E] diminui#!"
