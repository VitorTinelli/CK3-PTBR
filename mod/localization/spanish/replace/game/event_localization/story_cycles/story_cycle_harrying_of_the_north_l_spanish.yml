 ep3_increase_resistance_effect_tt_negative_large:0 "[harrying_widget_i]#N [harrying_resistance|E] aumenta significativamente#!"
 ep3_increase_resistance_effect_tt_positive:0 "[harrying_widget_i]#P [harrying_resistance|E] aumenta#!"
 ep3_increase_resistance_effect_tt_positive_large:0 "[harrying_widget_i]#P Resistance aumenta significativamente#!"
 ep3_story_cycle_harrying.0001.a:0 "Minha causa falhou."
 ep3_story_cycle_harrying.0001.b:0 "Minha terra não está mais dividida."
 ep3_story_cycle_harrying.0001.c:0 "Interessante."
 ep3_story_cycle_harrying.0001.desc.hereward:0 "Nenhum desafio ao trono do [england.GetName] surgirá. Os nobres anglo-saxões estão espalhados, submissos e passivos, despojados de seu título e poder. Todos se arrastam aos pés d[Select_CString( ruler_england.IsFemale, 'a', 'o' )] [ruler_england.GetTitledFirstName].\n\nMeu propósito se perdeu. Com os normandos agora estabelecidos, não há esperança para um futuro anglo-saxão. Na melhor das hipóteses, nos fundiremos e nos tornaremos parte do tecido da terra; na pior, desapareceremos da história completamente."
 ep3_story_cycle_harrying.0001.desc.therest:0 "A feroz resistência que enfrentou [Select_CString( ruler_england.IsFemale, 'a', 'o' )] [ruler_england.GetTitledFirstName] finalmente se dissolveu diante da amarga represália. O domínio normando sobre [england.GetName] agora é incontestado."
 ep3_story_cycle_harrying.0001.desc.william:0 "Estou em ascensão: ninguém se atreve a desafiar meu poder em [england.GetName]. Os nobres anglo-saxões estão espalhados, submissos e passivos, prestando homenagem a mim por medo de represálias. Cada um beijará meu anel e se submeterá a mim antes do final do ano.\n\nMeu governo é incontestado, e agora posso partir para novas ambições."
 ep3_story_cycle_harrying.0001.desc:0 "Com o último governante Ætheling removido do poder, o Massacre do Norte pode realmente ser considerado terminado.\n\n"
 ep3_story_cycle_harrying.0001.t:0 "O Martelo Cai"
 ep3_story_cycle_harrying.0002.a:0 "Que desapareça rapidamente e felizmente."
 ep3_story_cycle_harrying.0002.b:0 "Minha terra não está mais dividida."
 ep3_story_cycle_harrying.0002.c:0 "Interessante."
 ep3_story_cycle_harrying.0002.desc.hereward:0 "Nossa causa foi justa, os desafios foram grandiosos, a represália amarga. No entanto, o espírito anglo-saxão prevaleceu, e agora retornamos ao nosso lugar de direito nos assentos do poder nessas terras.\n\nDevo agora colocar minha espada para baixo. Talvez não a transforme em arado ainda, pois os inimigos do reino continuam numerosos, mas a lenda de Wake deve agora lentamente desaparecer da memória."
 ep3_story_cycle_harrying.0002.desc.ruler:0 "Os intrusos normandos derretem-se diante de nós. Alguns permanecem agarrados ao seu poder, outros retornam à sua terra natal, e muitos mais jazem sob as justas gramas da Inglaterra.\n\nNenhum deles se atreve a desafiar minha posição."
 ep3_story_cycle_harrying.0002.desc.therest:0 "A invasão bem-sucedida rapidamente se transformou em um pesadelo para os intrusos normandos, e a ascensão ao poder d[Select_CString( ruler_england.IsFemale, 'a', 'o' )] [ruler_england.GetTitledFirstName] finalmente pôs fim às ambições estrangeiras pelo trono. Por enquanto."
 ep3_story_cycle_harrying.0002.desc:0 "Com um anglo-saxão novamente no trono do [england.GetName], o Massacre do Norte pode realmente ser considerado terminado.\n\n"
 ep3_story_cycle_harrying.0002.t:0 "O Retorno"
 ep3_story_cycle_harrying.0003.a:0 "Resta saber se isso é uma melhoria..."
 ep3_story_cycle_harrying.0003.b:0 "Eu unirei essas terras díspares."
 ep3_story_cycle_harrying.0003.c:0 "Interessante."
 ep3_story_cycle_harrying.0003.desc:0 "O amargo conflito que se desenrolou entre os governantes normandos e os nobres anglo-saxões devastou ambos os lados, com resultados verdadeiramente inesperados.\n\nOs [ruler_england.GetCulture.GetCollectiveNounNoTooltip] agora controlam o trono de [england.GetName], [ruler_england.GetTitledFirstName] presidindo a partir do assento de poder sobre as terras danificadas e quebradas. O Massacre do Norte morreu à medida que os dois facções beligerantes não conseguiram mais prosseguir com suas disputas.\n\nO futuro do reino é incerto, e muito permanece incerto nesses tempos de transição."
 ep3_story_cycle_harrying.0003.t:0 "Tempos Incertos"
 ep3_story_cycle_harrying.0004.a:0 "Eles fazem parte deste reino, assim como nós."
 ep3_story_cycle_harrying.0004.b:0 "Vamos seguir em frente, em amizade."
 ep3_story_cycle_harrying.0004.c:0 "Interessante."
 ep3_story_cycle_harrying.0004.desc.anglo_saxon:0 "Aqueles que estavam por aqui há tantas décadas se foram, seus corpos fertilizantes para os campos. Até seus filhos agora são grisalhos e trôpegos. Seus filhos, por sua vez, cada vez mais colocam de lado a luta de seus antepassados em favor de uma coexistência pacífica. Por sua vez, os [ruler_england.GetCulture.GetCollectiveNounNoTooltip] no trono recuam a mão da opressão, não vendo mais o benefício de tal conflito.\n\nO Massacre do Norte acabou."
 ep3_story_cycle_harrying.0004.desc.ruler:0 "Na verdade, muitos, que os locais agora mal se lembram do porquê de sua raiva tão profunda contra meu governo. Cada vez mais eles abandonam suas espadas, não dispostos a continuar a luta de seus avós.\n\nMeu governo agora é quase incontestado, e não preciso mais continuar esta campanha de pacificação. O Massacre do Norte acabou."
 ep3_story_cycle_harrying.0004.desc.therest:0 "Tempo suficiente se passou para que a geração atual de anglo-saxões na Inglaterra mal se lembre do que está lutando. Os governantes [ruler_england.GetCulture.GetCollectiveNounNoTooltip] fazem parte do tecido da terra, e poucos de ambos os lados têm muitos motivos para continuar o conflito.\n\nO Massacre do Norte acabou."
 ep3_story_cycle_harrying.0004.desc:0 "Muitos anos se passaram desde a invasão normanda da Inglaterra.\n\n"
 ep3_story_cycle_harrying.0004.t:0 "Erros do Passado"
 ep3_story_cycle_harrying.1000.a:0 "Cada grão de comida no [crop_duchy.GetNameNoTooltip] deve ser destruído."
 ep3_story_cycle_harrying.1000.b:0 "Deixe apenas o mínimo necessário. Incendeie o resto."
 ep3_story_cycle_harrying.1000.c:0 "Se eles querem seu grão, devem pagar por isso."
 ep3_story_cycle_harrying.1000.desc:0 "Com os nobres anglo-saxões descontentes perseguindo sua causa condenada, passo muitas noites refletindo sobre maneiras de despojá-los de seu poder.\n\nIrromper e remover seus títulos causaria um alvoroço, mas a vida de um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetLadyLord] depende do trabalho dos camponeses. Nós nos sentamos acima deles, nomeados por [ROOT.Char.GetFaith.HighGodName], mas é através do trabalho árduo deles que nosso poder prospera.\n\nO grão é, por sua vez, a força vital da classe camponesa. Menos grão significa menos camponeses. Quanto menos camponeses, mais frac[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] se torna [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetLadyLord]. E quanto mais frac[Select_CString( ROOT.Char.IsFemale, 'a a', 'o o' )] [ROOT.Char.GetLadyLord]..."
 ep3_story_cycle_harrying.1000.t:0 "Em Chamas"
 ep3_story_cycle_harrying.1005.a.tt:0 "Cada [county|E] na [Glossary('Grande Estrada do Norte', 'GNR_GLOSS')]"
 ep3_story_cycle_harrying.1005.a:0 "Renove a estrada e adicione guardas armados."
 ep3_story_cycle_harrying.1005.b:0 "Precisamos que a estrada esteja em boas condições."
 ep3_story_cycle_harrying.1005.c.tt1:0 "Todos os [counties|E] sob controle anglo-saxão na [Glossary('Grande Estrada do Norte', 'GNR_GLOSS')]:"
 ep3_story_cycle_harrying.1005.c.tt2:0 "Todos os [counties|E] sob controle normando na [Glossary('Grande Estrada do Norte', 'GNR_GLOSS')]:"
 ep3_story_cycle_harrying.1005.c:0 "Destrua qualquer metro que esteja sob controle anglo-saxão."
 ep3_story_cycle_harrying.1005.desc:0 "\"O norte?\" [Select_CString( marshal.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))] [marshal.GetFirstName] pensa por um momento. \"Anos de incursões do outro lado do mar lhes deram uma cultura diferente da que você encontraria por aqui.\" [marshal.GetSheHe|U] passa um dedo sobre o mapa espalhado à nossa frente.\n\n\"Você vê esta linha? Eles a chamam de Grande Estrada do Norte.\" [marshal.GetSheHe|U] acaricia seu queixo pensativamente. \"Tradicionalmente, é a única rota terrestre confiável para o norte, mas caiu em grande degradação.\"\n\nEu vejo o dilema. Tal rota é uma bênção e uma maldição. Garantir passagem segura para nós mesmos é primordial, mas qualquer estrada pode ser usada por ambos os lados..."
 ep3_story_cycle_harrying.1005.t:0 "A Grande Estrada do Norte"
 ep3_story_cycle_harrying.1010.a:0 "\"Você escolheu [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetWomanMan] errad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] para se opor, [captured.Custom('GirlBoy')].\""
 ep3_story_cycle_harrying.1010.b:0 "\"Vou deixar você ir. Mas deixarei um lembrete da minha #EMP hospitalidade#!.\""
 ep3_story_cycle_harrying.1010.c.failure:0 "[captured.GetSheHe|U] ridiculariza sua proposta"
 ep3_story_cycle_harrying.1010.c.success:0 "[captured.GetSheHe|U] aceita sua proposta"
 ep3_story_cycle_harrying.1010.c:0 "\"Você tem uma boa postura. Uma postura #EMP [ROOT.Char.GetCulture.GetNameNoTooltip], até...\""
 ep3_story_cycle_harrying.1010.d:0 "\"Você pode apodrecer aqui até que seu resgate seja pago.\""
 ep3_story_cycle_harrying.1010.desc:0 "É realmente lamentável ser um prisioneiro de guerra. Uma criatura desse tipo me olha de forma mal-humorada por entre as barras da sua cela.\n\n\"Eu tenho valor, sabe.\" A voz [captured.GetHerHim] é fina e trêmula, quebrada por dias no calabouço. \"Eu sou [captured.GetFirstName], da Casa [captured.GetHouse.GetBaseName]. Se você enviar uma mensagem para minha família, você receberá um bom preço em resgate.\"\n\nUm resgate? Isso seria bom e tudo mais, mas nestes tempos de tribulação, um[Select_CString( captured.IsFemale, 'a', '' )] [captured.GetWomanMan] de tal estatura pode ser mais útil como mensagem do que como um ativo para mero ouro..."
 ep3_story_cycle_harrying.1010.t:0 "Decidindo um Destino"
 ep3_story_cycle_harrying.1011.a.language:0 "\"E você será [Select_CString( spouse_courtier.IsFemale, 'uma boa', 'um bom' )] [spouse_courtier.GetWifeHusband] também, uma vez que aprenda [ROOT.Char.GetCulture.GetLanguage.GetName].\""
 ep3_story_cycle_harrying.1011.a.spouselanguage:0 "\"[Select_CString( spouse_courtier.IsFemale, 'Sua nova', 'Seu novo' )] [spouse_courtier.GetWifeHusband] vai ajudar você a aprender o idioma rapidamente, também.\""
 ep3_story_cycle_harrying.1011.b:0 "\"Vá agora, e seja livre.\""
 ep3_story_cycle_harrying.1011.desc.spouse:0 "\n\nSem querer, uma ideia se materializa. [spouse_courtier.GetFirstName]! Talvez [spouse_courtier.GetSheHe] seja um cônjuge oportuno..."
 ep3_story_cycle_harrying.1011.desc:0 "Para minha surpresa, [Select_CString( captured.IsFemale, 'a', 'o' )] [captured.GetWomanMan] considera minha proposta.\n\n\"Eu me tornarei... um [ROOT.Char.GetCulture.GetName]?\" [captured.GetSheHe|U] pronuncia a palavra, considerando as implicações. \"E serei aceito como um de vocês?\"\n\nEu também levo um momento para explorar completamente as ramificações da minha proposta feita às pressas. Se eu for governar esta terra, precisarei de tantos [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] ao meu redor quanto eu puder reunir. Aceitar os antigos governantes na equipe pode acelerar a aceitação dos camponeses em relação a nós, apesar da nossa aparência estrangeira."
 ep3_story_cycle_harrying.1011.t:0 "Um Verdadeiro [ROOT.Char.GetCulture.GetNameNoTooltip]"
 ep3_story_cycle_harrying.1015.a:0 "Queime outro prédio."
 ep3_story_cycle_harrying.1015.b:0 "Eles devem aprender obediência. Reassente metade da população."
 ep3_story_cycle_harrying.1015.c.tt:0 "Afinal, que reino restaria para governar, caso contrário?"
 ep3_story_cycle_harrying.1015.c:0 "Eu devo me controlar."
 ep3_story_cycle_harrying.1015.desc:0 "#EMP Isso#!, penso enquanto o fogo sobe mais alto, é o que você recebe por sedição.\n\n[offending_village.GetName] tinha sido um ninho de agitação contra meu governo. O prédio em chamas que até recentemente havia sido um porto seguro para aqueles dissidentes agora emite uma fina pluma de fumaça no ar. Eu o observo, sentindo minha própria raiva subir com ele.\n\nComo #EMP eles se atreveram#! a me desafiar? O resto deste lugar também é cúmplice: todos eles sabiam exatamente o que aquele grupo estava tramando. Nenhum deles está livre de culpa!"
 ep3_story_cycle_harrying.1015.t:0 "Chamas Flickerantes"
 ep3_story_cycle_harrying.2000.a:0 "Pagar por importações, com meu próprio dinheiro."
 ep3_story_cycle_harrying.2000.b:0 "\"Venha comigo. Eu irei alimentá-lo.\""
 ep3_story_cycle_harrying.2000.c.failure:0 "Seus métodos não funcionam"
 ep3_story_cycle_harrying.2000.c.success:0 "Seus métodos para aumentar a produção agrícola funcionam"
 ep3_story_cycle_harrying.2000.c:0 "Talvez eu consiga descobrir uma maneira de consertar isso?"
 ep3_story_cycle_harrying.2000.desc:0 "Os habitantes da cidade de [location.GetName] estão sofrendo: as restrições de grãos impostas [Select_CString( william.IsFemale, 'pela', 'pelo' )] [william.GetTitledFirstNameRegnal] estão realmente começando a afetar, sugando a gordura de seus ossos. Uma dessas criaturas infelizes reconhece minha presença e se joga [starving_man.GetHerselfHimself] diante de mim para implorar.\n\n\"Por favor!\" [starving_man.GetSheHe|U] proclama, dedos ósseos segurando minhas pernas. \"Não comi há dois dias. Nos dois dias anteriores, só tive uma refeição. Por favor, por favor... #DIE1 você deve fazer #EMP algo...#!#!"
 ep3_story_cycle_harrying.2000.notcallous:0 "\n\nEst[Select_CString( starving_man.IsFemale, 'a', 'e' )] pobre [starving_man.GetWomanMan]."
 ep3_story_cycle_harrying.2000.t:0 "Almas Desmoronadas"
 ep3_story_cycle_harrying.2001.a:0 "Aceite-os!"
 ep3_story_cycle_harrying.2001.b.tt:0 "Mas talvez no futuro..."
 ep3_story_cycle_harrying.2001.b:0 "Não preciso de guerreiros agora."
 ep3_story_cycle_harrying.2001.desc:0 "Com a produção de alimentos na área se estabilizando, muitos dos habitantes que estavam muito fracos para trabalhar agora oferecem seus serviços.\n\nOs mais capazes entre eles se oferecem como guerreiros para sua causa!"
 ep3_story_cycle_harrying.2001.opening:0 "[marshal.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 ep3_story_cycle_harrying.2005.a:0 "Devemos mirar no alvo mais alto possível."
 ep3_story_cycle_harrying.2005.b.tt:0 "E mate todos os normandos que encontrar no [willy_vassal.GetName]."
 ep3_story_cycle_harrying.2005.b:0 "Leve este ouro, contrate alguns matadores..."
 ep3_story_cycle_harrying.2005.c:0 "Você parece um[Select_CString( murderer.IsFemale, 'a', '' )] [murderer.GetWomanMan] útil para se ter por perto."
 ep3_story_cycle_harrying.2005.desc:0 "Quando você é um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetLadyLord] da minha estatura, às vezes deve tomar decisões difíceis. Com isso em mente, quando um notório assassino local é trazido diante de mim em correntes, ordeno que [Select_CString( spymaster.IsFemale, 'a', 'o' )] [spymaster.GetFirstName] [Select_CString( murderer.IsFemale, 'a', 'o' )] leve para o arsenal para que possamos conversar em particular.\n\n[Select_CString( murderer.IsFemale, 'A', 'O' )] [murderer.GetWomanMan] me olha curios[Select_CString( murderer.IsFemale, 'a', 'o' )]. Não há dúvida de que, sem minha intervenção, [murderer.GetSheHe] estará pendurado na forca até o final da semana. Olho para [Select_CString( spymaster.IsFemale, 'a', 'o' )] [spymaster.GetFirstNameNoTooltip] em busca de confirmação e recebo um aceno de cabeça em resposta.\n\n\"Eu preciso de um[Select_CString( murderer.IsFemale, 'a', '' )] [murderer.GetWomanMan] com suas habilidades..."
 ep3_story_cycle_harrying.2005.t:0 "Suspensão da Execução"
 ep3_story_cycle_harrying.2010.a.critfailure:0 "Suas mensagens são interceptadas pelos normandos"
 ep3_story_cycle_harrying.2010.a.critsuccess:0 "A resistência escala rapidamente"
 ep3_story_cycle_harrying.2010.a.failure:0 "Seus apelos são ignorados"
 ep3_story_cycle_harrying.2010.a.success:0 "A resistência aumenta"
 ep3_story_cycle_harrying.2010.a:0 "Resistência organizada é o caminho a seguir."
 ep3_story_cycle_harrying.2010.b.failure:0 "Os nobres ignoram seus apelos"
 ep3_story_cycle_harrying.2010.b.success:0 "O ouro chega rapidamente"
 ep3_story_cycle_harrying.2010.b:0 "Farei um apelo por alguns presentes de ouro."
 ep3_story_cycle_harrying.2010.c:0 "Eles devem encorajar os pequenos a se levantarem."
 ep3_story_cycle_harrying.2010.desc:0 "Como um dos Æthelings mais poderosos, cabe a mim reunir os nobres menores em apoio à nossa causa justa. Com tais grandes apostas, todos eles estão nervosos em se comprometer plenamente, mas precisamos deles para ter sucesso em nossa missão.\n\nA única questão é, exatamente que tipo de apoio precisamos? Ouro é sempre bem-vindo, é claro, mas talvez eu pudesse fomentar uma agitação mais ativa? Talvez, até mesmo, precisemos de alguma resistência devidamente organizada?"
 ep3_story_cycle_harrying.2010.t:0 "Esforço de Guerra"
 ep3_story_cycle_harrying.2015.a.failure:0 "[william.GetSheHe|U] recusa-se obstinadamente"
 ep3_story_cycle_harrying.2015.a.success:0 "[william.GetSheHe|U] aceita com raiva"
 ep3_story_cycle_harrying.2015.a:0 "Vamos ver [william.GetSheHe] nos eliminar depois disso..."
 ep3_story_cycle_harrying.2015.b:0 "Um pouco de liberdade extra pode ajudar nossa causa."
 ep3_story_cycle_harrying.2015.c:0 "Um acordo especial, talvez..."
 ep3_story_cycle_harrying.2015.desc:0 "Enquanto os documentos que solicitei são entregues a mim, quase posso sentir minhas mãos tremendo. As falsificações são superb; ninguém poderia duvidar delas. Com isso, minha reivindicação a essas terras é inegável, e temos mais a caminho para outros Æthelings.\n\nA pergunta maior está em questão, no entanto. O que exatamente quero aproveitar com essa vantagem? Há uma infinidade de maneiras de atacar a posição d[Select_CString( william.IsFemale, 'a', 'o' )] [william.GetTitledFirstName] e, mais criticamente, fortalecer a nossa."
 ep3_story_cycle_harrying.2015.t:0 "Forjando uma Posição"
 ep3_story_cycle_harrying.3000.a:0 "...uma relíquia, você diz?"
 ep3_story_cycle_harrying.3000.b.tt:0 "...um saco de moedas, no entanto..."
 ep3_story_cycle_harrying.3000.b:0 "Não me rebaixarei a roubar uma relíquia de uma igreja."
 ep3_story_cycle_harrying.3000.c:0 "\"[bishop.GetMotherFather|U]! Fique calm[Select_CString( bishop.IsFemale, 'a', 'o' )]. Eu não sonharia em roubar de você.\""
 ep3_story_cycle_harrying.3000.desc:0 "Que linda igrejinha! Estou contente que minha visita a [neighboring_church.GetName] me trouxe até aqui. Não é uma capela humilde, julgando pelas lindas filigranas nas decorações. Sou arrancado do meu devaneio por um [bishop.GetFaith.PriestNeuter] falando.\n\n\"Eu sei quem você é.\" [bishop.GetSheHe|U] levanta a mão para evitar qualquer objeção. \"Eu sei por que você está aqui, também. Sua fama o precede, jovem [ROOT.Char.GetFirstNameNoTooltip], havia poucas chances de você não encontrar seu caminho aqui em breve.\"\n\n\"Tudo o que peço — e isso eu imploro a você, como um[Select_CString( bishop.IsFemale, 'a', '' )] [bishop.GetWomanMan] de [bishop.GetFaith.HighGodName] — por favor, deixe nossas relíquias onde estão. Leve o dinheiro se necessário.\""
 ep3_story_cycle_harrying.3000.t:0 "O Bem Maior"
 ep3_story_cycle_harrying.3005.a.failure:0 "A emboscada falha"
 ep3_story_cycle_harrying.3005.a.success:0 "A emboscada funciona perfeitamente"
 ep3_story_cycle_harrying.3005.a:0 "Atacar com força e rapidez; essas armas são nossas!"
 ep3_story_cycle_harrying.3005.b.tt:0 "Cada lâmina irá para eles."
 ep3_story_cycle_harrying.3005.b:0 "Nossos aliados precisam desse equipamento."
 ep3_story_cycle_harrying.3005.c.tt:0 "Se conseguirmos nos esgueirar e sabotar a estrada à frente, podemos atrasar significativamente sua chegada sem uma luta."
 ep3_story_cycle_harrying.3005.c:0 "Devemos usar esse clima a nosso favor."
 ep3_story_cycle_harrying.3005.desc:0 "Ajoelho-me, espada em punho, enquanto a névoa envolve a mim e meu pequeno, mas fortemente armado, grupo de [ROOT.Char.GetWomenMen]. Todos nós estamos a poucos metros da estrada, na qual um mercenário normando estreita os olhos na neblina.\n\n[norman_soldier.GetSheHe|U] está à frente do que os sussurros locais nos dizem ser uma caravana cheia de armas e armaduras, a caminho de [vassal_county.GetName]. Interceptá-la pode representar um grande golpe para o inimigo, e o saque pode até ser redistribuído para nossos aliados.\n\nA impressionante espada d[Select_CString( norman_soldier.IsFemale, 'a', 'o' )] [norman_soldier.GetWomanMan] brilha suavemente enquanto verifico a minha. Qualquer luta que esteja à frente será, de fato, um trabalho sombrio."
 ep3_story_cycle_harrying.3005.t:0 "Lâminas na Névoa"
 ep3_story_cycle_harrying.3010.a.tt:0 "#V Duelo#! [norman_noble.GetFirstName] até a morte.\nSua [prowess|E]: [prowess_i]#V [root_for_loc.GetProwess]#!\n[prowess|E] d[Select_CString( normal_noble.IsFemale, 'a', 'o' )] [normal_noble.GetFirstName]: [prowess_i]#V [norman_noble.GetProwess]#!"
 ep3_story_cycle_harrying.3010.a:0 "\"Prepare sua arma, normando imundo.\""
 ep3_story_cycle_harrying.3010.b:0 "\"Desista de suas riquezas e eu chamarei meus cavaleiros de volta.\""
 ep3_story_cycle_harrying.3010.desc:0 "O vento agita as árvores enquanto [Select_CString( norman_noble.IsFemale, 'a', 'o' )] [norman_noble.GetTitledFirstName] emerge da ponte [norman_noble.GetSheHe] está atravessando. O leve barulho não faz nada para obscurecer o assobio penetrante que emito, e de repente todo o caminho está banhado em sangue.\n\n[norman_noble.GetFirstNameNoTooltip|U] tomba de sua sela enquanto uma flecha perfura o flanco do cavalo, uma das flechas que piscam da floresta assim que a armadilha é ativada.\n\nMeus cavaleiros avançam para lutar e capturar seus equivalentes. Aproximo-me d[Select_CString( norman_noble.IsFemale, 'a', 'o' )] [norman_noble.GetTitleAsNameNoTooltip] enquanto [norman_noble.GetSheHe] luta para se levantar, desembainhando uma espada enquanto [norman_noble.GetSheHe] faz isso."
 ep3_story_cycle_harrying.3010.t:0 "Seu Dinheiro ou Sua Vida"
 ep3_story_cycle_harrying.3011.a:0 "Como vocês dois gostariam de um emprego?"
 ep3_story_cycle_harrying.3011.b:0 "\"Retornem para suas casas. Vivam bem.\""
 ep3_story_cycle_harrying.3011.desc:0 "Sangue goteja da minha espada enquanto a limpo. O dia está calmo agora, a emboscada provou ser rápida e brutal. Assim que [Select_CString( norman_noble.IsFemale, 'a', 'o' )] [norman_noble.GetFirstName] caiu, muitos [norman_noble.GetHerHim] levantaram as mãos em rendição. Proteger os nobres locais é um trabalho, afinal, não algo para se dar a vida. Um deles me chama enquanto passo.\n\n\"O que será de nós?\" [saxon_soldier_1.GetSheHe|U] pergunta, um pouco nervoso. Outro, logo à direita [saxon_soldier_1.GetHerHim], acena vigorosamente em concordância.\n\nEstudo o par. Eles são ambos tipos robustos, claramente úteis em uma luta, mas a ferocidade de nosso ataque os pegou de surpresa. Julgando pelo sotaque, eles não são normandos, também."
 ep3_story_cycle_harrying.3011.t:0 "Uma Saída"
 ep3_story_cycle_harrying.3015.a.failure:0 "[danish_king.GetFirstNameNoTooltip] se recusa a se envolver"
 ep3_story_cycle_harrying.3015.a.success:0 "[danish_king.GetFirstNameNoTooltip] usa seu pedido para garantir uma reivindicação"
 ep3_story_cycle_harrying.3015.a:0 "Um dinamarquês deve governar, se um anglo-saxão não puder."
 ep3_story_cycle_harrying.3015.b.failure:0 "[danish_king.GetFirstNameNoTooltip] não pode dispensar ninguém"
 ep3_story_cycle_harrying.3015.b.success:0 "[danish_king.GetFirstNameNoTooltip] lhe envia soldados"
 ep3_story_cycle_harrying.3015.b:0 "Pedir soldados é um bom começo."
 ep3_story_cycle_harrying.3015.c:0 "Sem cartas. Esta é nossa luta sozinha."
 ep3_story_cycle_harrying.3015.desc:0 "Não somos estranhos a incursões estrangeiras nessas terras. No entanto, os últimos estrangeiros que governaram se tornaram parte da estrutura dessas terras. Os dinamarqueses se tornaram nós e nós nos tornamos eles, e desse entrelaçamento surgiu minha família.\n\nSento-me e reflito. A Inglaterra é um prêmio e tanto, e [Select_CString( danish_king.IsFemale, 'a', 'o' )] [danish_king.GetTitledFirstName] certamente adoraria tê-la. Um dinamarquês governando a Inglaterra não seria nada novo; eles fazem parte de nós agora.\n\nMinha mão se move em direção a um pergaminho e uma pena..."
 ep3_story_cycle_harrying.3015.t:0 "Do Mar"
 ep3_story_cycle_harrying.3020.a.tt:0 "Comece a viajar para [willy_vassal_capital.GetName]"
 ep3_story_cycle_harrying.3020.a:0 "Partirei imediatamente."
 ep3_story_cycle_harrying.3020.b:0 "Devo deixar [willy_vassal.GetSheHe] apodrecer."
 ep3_story_cycle_harrying.3020.desc:0 "Os sussurros que chegam até mim em [location.GetName] agora são simplesmente altos demais para ignorar. Aquel[Select_CString( willy_vassal.IsFemale, 'a', 'e' )] rat[Select_CString( willy_vassal.IsFemale, 'a', 'o' )] [willy_vassal.GetTitledFirstName] aparentemente está se sentindo muito confortável sob o domínio estrangeiro, muito confortável.\n\nA única coisa pior do que um normando é um colaborador anglo-saxão. Talvez eu deva pagar uma visita a [willy_vassal.GetSheHe] e fazê-lo ver o erro de seus caminhos..."
 ep3_story_cycle_harrying.3020.t:0 "O Conforto de um Traidor"
 ep3_story_cycle_harrying.3021.a.tt:0 "#V Duelo#! [willy_vassal.GetFirstName] até a morte.\nSua [prowess|E]: [prowess_i]#V [root_for_loc.GetProwess]#!\n[prowess|E] d[Select_CString( willy_vassal.IsFemale, 'a', 'o' )] [willy_vassal.GetFirstName]: [prowess_i]#V [willy_vassal.GetProwess]#!"
 ep3_story_cycle_harrying.3021.a:0 "\"Desenhe sua espada, verme.\""
 ep3_story_cycle_harrying.3021.b.failure:0 "[willy_vassal.GetSheHe|U] se recusa a reconhecer seus argumentos"
 ep3_story_cycle_harrying.3021.b.success:0 "[willy_vassal.GetSheHe|U] se junta ao seu lado"
 ep3_story_cycle_harrying.3021.b:0 "\"Só quero conversar, [willy_vassal.GetFirstNameNoTooltip].\""
 ep3_story_cycle_harrying.3021.c.failure:0 "[willy_vassal.GetSheHe|U] não se deixará ameaçar"
 ep3_story_cycle_harrying.3021.c.success:0 "[willy_vassal.GetSheHe|U] se junta ao seu lado"
 ep3_story_cycle_harrying.3021.c:0 "\"Você tem medo #EMP [willy.GetHerHim]?#! Espere até ver o que posso fazer...\""
 ep3_story_cycle_harrying.3021.d.flavour:0 "Eu trocaria a vida dele pela deles mil vezes."
 ep3_story_cycle_harrying.3021.d:0 "\"Qualquer anglo-saxão leal aqui, você tem um lugar ao meu lado.\""
 ep3_story_cycle_harrying.3021.desc:0 "Os rumores eram verdadeiros. [willy_vassal.GetFirstName] está profundamente envolvido com seus soberanos normandos. Tão confiante, fazendo seu caminho de volta de algum tipo de conclave com eles, apenas alguns guardas armados com [willy_vassal.GetSheHe].\n\nDou o sinal. Pulamos das sombras, meus companheiros surpreendendo os guardas [willy_vassal.GetHerHim], segurando-os à ponta da espada. Aproximo-me d[Select_CString( willy_vassal.IsFemale, 'a', 'o' )] [willy_vassal.GetFirstNameNoTooltip] [willy_vassal.GetHerselfHimself].\n\n\"Você... você é [ROOT.Char.GetSheHe], não é?\" [willy_vassal.GetSheHe|U] balbucia. \"Aquela de quem falam. A que está nos Pântanos..."
 ep3_story_cycle_harrying.3021.t:0 "Enfrentando uma Víbora"
 ep3_story_cycle_harrying.3022.a:0 "Conheço alguém que pode gostar de um presente..."
 ep3_story_cycle_harrying.3022.b:0 "O povo deve saber da justiça que entregamos."
 ep3_story_cycle_harrying.3022.desc:0 "Eu passo sobre o corpo sem vida d[Select_CString( willy_vassal.IsFemale, 'a', 'o' )] [willy_vassal.GetFirstName]. Os guardas [willy_vassal.GetHerHim] se dispersam, sem mais razão para estar aqui.\n\n[willy_vassal.GetFirstNameNoTooltip] era um[Select_CString( willy_vassal.IsFemale, 'a', '' )] [willy_vassal.GetWomanMan] de considerável riqueza, e seria uma pena deixar isso ir para o lixo. Meus dedos vasculham os bolsos e sacolas, pegando algumas moedas aqui, [newly_created_artifact.GetName] [willy_vassal.GetHerHim] ali.\n\nEu me levanto novamente, olhando para o cadáver.\n\nÉ hora de enviar uma mensagem."
 ep3_story_cycle_harrying.3022.t:0 "Sem Mais"
 ep3_story_cycle_harrying.3050.a.tt:0 "Defina um curso para $cn_lunden$.\n#Fraco Eu estarei morto antes de chamá-la de \"#EMP $cn_londres$\"...#!#"
 ep3_story_cycle_harrying.3050.a:0 "Vou ouvir [william.GetSheHe]."
 ep3_story_cycle_harrying.3050.b:0 "Isso é claramente uma armadilha."
 ep3_story_cycle_harrying.3050.desc:0 "Tenho uma proposta para você.\n\nViaje para [london.GetNameNoTier] o mais rápido possível; você vai querer ouvir o que tenho a oferecer.\n\nNão me faça esperar."
 ep3_story_cycle_harrying.3050.opening:0 "Para Hereward, o infame rato dos Pântanos,"
 ep3_story_cycle_harrying.3051.a.failure:0 "[william.GetSheHe|U] exige seu silêncio"
 ep3_story_cycle_harrying.3051.a.success:0 "[william.GetSheHe|U] deixa passar"
 ep3_story_cycle_harrying.3051.a:0 "\"Esse trono parece um pouco grande demais para você, não parece?\""
 ep3_story_cycle_harrying.3051.b.tt:0 "Não há ponto em trocar farpas."
 ep3_story_cycle_harrying.3051.b:0 "\"Qual é sua proposta?\""
 ep3_story_cycle_harrying.3051.desc:0 "Grandes são as salas do poder. [william.GetTitledFirstNameRegnal] se empoleira rigidamente no trono enquanto sou conduzido para ver [william.GetSheHe], mas a opulência ao redor [william.GetHerHim] faz algo para aliviar aquela postura inquieta.\n\n\"[ROOT.Char.GetFirstNameNoTooltip]. [Select_CString( ROOT.Char.IsFemale, 'A', 'O' )] [ROOT.Char.GetWomanMan] que transformou a terra ao sul do Wash em tal casa de carnificina.\" Seu lábio se curva em fúria enquanto não consigo esconder completamente meu prazer com a descrição.\n\n\"Não pensei que você viria. Pensei que você ficaria escondido na sua ilha. Claramente, você é um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] de muitas surpresas.\"\n\nOlho de volta para [william.GetSheHe], o bastardo estrangeiro naquela famosa cadeira."
 ep3_story_cycle_harrying.3051.t:0 "O Bastardo no Trono"
 ep3_story_cycle_harrying.3052.a.flavor:0 "Esta é simplesmente uma oferta boa demais para recusar."
 ep3_story_cycle_harrying.3052.a.tt:0 "[william.GetFirstNameNoTooltip] convoca um escriba..."
 ep3_story_cycle_harrying.3052.a:0 "Minha casa! Minha casa ancestral..."
 ep3_story_cycle_harrying.3052.b:0 "\"...me devolva meu irmão, verme normando.\""
 ep3_story_cycle_harrying.3052.desc:0 "\"Eu conheço você, [ROOT.Char.GetFirstNameNoTooltip], [ROOT.Char.Custom('GetDaughterSon')] d[Select_CString( father.IsFemale, 'a', 'o' )] [father.GetFirstName]. Sei por que você está fazendo o que faz. Sei por que você está aqui, até mesmo.\" [william.GetFirstName] se inclina para frente enquanto [william.GetSheHe] fala, me penetrando com seu olhar.\n\n\"Eu sei o que te move e sei o que você quer.\" [william.GetSheHe|U] pega um pergaminho ao lado [william.GetHerHim] enquanto fala, entregando-o a um guarda. [william.GetSheHe|U] continua enquanto o guarda se aproxima de mim, pergaminho em mão.\n\n\"Este ato é para todo o [cambridgeshire.GetName]. Não apenas para Ely. Tudo isso.\" [william.GetFirstNameNoTooltip], o novo governante destas terras, se inclina triunfantemente.\n\n\"Isso pode ser seu, contanto que você deponha suas armas e nunca saque sua lâmina contra mim novamente.\""
 ep3_story_cycle_harrying.3052.t:0 "O Acordo do Diabo"
 ep3_story_cycle_harrying.3053.a:0 "... Eu não posso fazer isso."
 ep3_story_cycle_harrying.3053.b.tt:0 "@warning_icon! #X Isso acabará com sua oposição aos normandos e sua participação na [harrying_widget_i]Massacre do Norte!#!"
 ep3_story_cycle_harrying.3053.b:0 "\"Onde eu assino?\""
 ep3_story_cycle_harrying.3053.desc:0 "O largo e maligno sorriso que se espalha pelo rosto d[Select_CString( william.IsFemale, 'a', 'o' )] [william.GetTitledFirstName] me deixa enjoado. [william.GetSheHe|U] chama um escriba.\n\n\"Uma excelente escolha. O conforto e a prosperidade de você e sua família por gerações estarão garantidos!\" [william.GetSheHe|U] se levanta do trono, olhando-me nos olhos.\n\n\"Lembre-se. Você recebe tudo isso em troca de não levantar um dedo contra mim pelo resto de seus dias. Se eu ouvir até mesmo o menor rumor de que uma pedra de afiar está sendo usada em algo maior que uma faca de açougueiro em Cambridgeshire...\"\n\nEu aceno com a cabeça em assentimento, atordoado. Olho para a minha mão, estendendo-me pelos documentos, depois de volta para o sorriso astuto d[Select_CString( william.IsFemale, 'a', 'o' )] [william.GetFirstNameNoTooltip]."
 ep3_story_cycle_harrying.3053.t:0 "Trinta Peças de Prata"
 ep3_story_cycle_harrying.3054.a.failure:0 "Você é capturado e espancado por isso."
 ep3_story_cycle_harrying.3054.a.success:0 "Você consegue escapar!"
 ep3_story_cycle_harrying.3054.a:0 "Não vou desistir sem lutar!"
 ep3_story_cycle_harrying.3054.b.tt:0 "É melhor guardar minhas forças. Vou precisar delas."
 ep3_story_cycle_harrying.3054.b:0 "Não adianta."
 ep3_story_cycle_harrying.3054.desc:0 "O rosto d[Select_CString( william.IsFemale, 'a', 'o' )] [william.GetTitledFirstName] se contorce subitamente, repleto de raiva.\n\n\"Você é um tolo,\" [william.GetSheHe] cospe venenosamente, \"você, tolo de visão curta e cabeça oca!\" [william.GetSheHe|U] gesticula para seus guardas avançarem.\n\n\"Você não consegue ver? Você se agarra à história! Você persegue uma existência já negada a você por [ROOT.Char.GetFaith.HighGodName]! Você defende princípios que possui por nenhuma razão além de mantê-los!\"\n\nOlho ao redor freneticamente. A porta por onde entrei ainda está levemente guardada. Talvez se eu conseguir passar por eles...\n\n\"#EMP Prendam-no!#!\""
 ep3_story_cycle_harrying.3054.t:0 "O Que É Devido ao Diabo"
 ep3_story_cycle_harrying.3055.a:0 "Bem... droga."
 ep3_story_cycle_harrying.3055.desc:0 "Um soco no estômago me faz curvar, enquanto sou apreendido, e meus braços são rapidamente torcidos atrás das costas. Rostos, severos, raivosos — até mesmo um[Select_CString( sympathetic_courtier.IsFemale, 'a', '' )] [sympathetic_courtier.GetWomanMan] lá atrás com o que parece ser simpatia — flutuam pela minha visão enquanto sou levado embora.\n\nA caminhada é curta, mas traiçoeira. A luz natural diminui à medida que descemos escadas. Logo, encontro-me acorrentado à parede na minha cela.\n\n\"Considere-se sortudo por estar vivo, bandido.\" A voz d[Select_CString( william.IsFemale, 'a', 'o' )] [william.GetTitledFirstName] ecoa nas paredes de pedra úmidas. [william.GetSheHe|U] considera rapidamente o ambiente. \"Ou... talvez não tão sortudo.\"\n\n[william.GetSheHe|U] se vira nos calcanhares e marcha para fora da sala acompanhado de sua comitiva, e eu fico sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 ep3_story_cycle_harrying.3055.t:0 "Um Preço de Ferro"
 ep3_story_cycle_harrying.3056.a:0 "O quê?"
 ep3_story_cycle_harrying.3056.desc:0 "Você precisa confiar em nós.\n\nTrês noites a partir de agora, sua cela ficará destrancada após a alimentação. Permaneça lá até o anoitecer.\n\nSuba as escadas e vire à segunda esquerda, depois à primeira direita.\n\n#BOL VOCÊ NÃO ESTÁ SOZINHO.#!"
 ep3_story_cycle_harrying.3056.opening:0 "Para o corajoso Lorde Hereward,"
 ep3_story_cycle_harrying.3057.a.failure:0 "[sympathetic_courtier.GetSheHe|U] recusa você relutantemente."
 ep3_story_cycle_harrying.3057.a.success:0 "[sympathetic_courtier.GetFirstNameNoTooltip] concorda felizmente."
 ep3_story_cycle_harrying.3057.a:0 "Venha comigo!"
 ep3_story_cycle_harrying.3057.b:0 "Nunca vou me esquecer de você. Vá, rapidamente, antes que descubram você."
 ep3_story_cycle_harrying.3057.desc:0 "Como instruído, espero até que a escuridão tenha passado antes de tentar a fechadura protegida da minha cela. Ela se abre com um leve ranger, e eu imediatamente subo a escada. Segunda esquerda, primeira direita, outra escada e...\n\nEu irrompo para o ar fresco da noite. A uma curta distância, uma figura encapuzada se agacha, me observando. Reconheço [sympathetic_courtier.GetSheHe] como o rosto simpático que vi enquanto era arrastado para minha cela.\n\n\"Você conseguiu!\" [sympathetic_courtier.GetSheHe|U] me cumprimenta alegremente e indica um caminho sinuoso pela cidade. \"Esse é o caminho para o norte. Se você sair agora, estará longe antes que eles percebam.\""
 ep3_story_cycle_harrying.3057.t:0 "Liberdade"
