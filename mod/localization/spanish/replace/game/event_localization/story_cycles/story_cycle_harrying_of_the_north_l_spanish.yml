 ep3_decrease_resistance_effect_tt_negative:0 "[harrying_widget_i]#N [harrying_resistance|E] diminui#!"
 ep3_decrease_resistance_effect_tt_positive:0 "[harrying_widget_i]#P [harrying_resistance|E] diminui#!"
 ep3_decrease_resistance_effect_tt_positive_large:0 "[harrying_widget_i]#P [harrying_resistance|E] diminui significativamente#!"
