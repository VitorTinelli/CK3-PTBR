l_spanish:
 CAT_INFORMATION_STRING:0 "O nome do seu gato é #V [Story.Custom('CatStoryNameAll')].#!\nA pelagem [Story.Custom('CatStoryHerHisAll')] é [Story.Custom('CatFurColorAll')], o olho [Story.Custom('CatStoryHerHisAll')] é [Story.Custom('CatEyeColorAll')], e [Story.Custom('CatStorySheHeAll')] é [Story.Custom('CatStoryKittenOrAgeAll')].[Story.Custom('CatStupidOrNotStupidAll')]"
 CHILD_OF_DESTINY:0 "A Criança Destinada"
 COMPOSER:0 "O Compositor do seu Épico"
 CONQUEROR_STORY_PRACTICAL_INFORMATION_STRING:0 "Conquistadores recebem muitos bônus poderosos, como redução em [factions|E], acesso ao [vassalize_casus_belli|E] e eventos poderosos ocasionais.\n\nVocê deixará de ser um Conquistador se:\n$BULLET_WITH_TAB$Você não for [independent|E]\n$BULLET_WITH_TAB$Seu título for reduzido a [count|E]\n$BULLET_WITH_TAB$Você se tornar [unlanded|E]\n$BULLET_WITH_TAB$Você não estiver em [war|E] por #V 10#! anos\n$BULLET_WITH_TAB$Você estiver profundamente em [debt|E]\n$BULLET_WITH_TAB$Você perder #V 3#! ou mais [wars|E]\n$BULLET_WITH_TAB$Você se tornar [GetTrait('incapable').GetName( GetNullCharacter )]"
 DESTINY_CHILD_STORY_PRACTICAL_INFORMATION_STRING:0 "De vez em quando, nasce uma criança destinada à grandeza. Ela se desenvolve mais rápido que o normal e alcança níveis que outros não alcançarão.\n\nCuide bem de [Story.MakeScope.Var('destiny_child').Char.GetUIName], e considere trabalhar para torná-la seu [player_heir|E] — por exemplo, tornando-a seu [designated_heir|E]."
 DOG_INFORMATION_STRING:0 "O nome do seu cachorro é #V [Story.Custom('DogStoryNameAll')].#!\nA pelagem [Story.Custom('DogStoryHerHisAll')] é [Story.Custom('DogFurColorAll')], o olho [Story.Custom('DogStoryHerHisAll')] é [Story.Custom('DogEyeColorAll')], e [Story.Custom('DogStorySheHeAll')] é [Story.Custom('DogStoryPuppyOrAgeAll')].\n[Story.Custom('DogStorySheHeAll')|U] é um(a) [Story.Custom('DogStoryGirlBoyAll')] muito bom(a)."
 DOPPELGANGER:0 "Seu [Glossary( 'Doppelgänger', 'DOPPELGANGER_GLOSS' )]"
 DOPPELGANGER_GLOSS:0 "Um sósia ou duplicata de uma pessoa viva, frequentemente encontrado por acaso. No folclore alemão, é uma aparição inquietante e um mau presságio — ver o seu próprio duplo pode prenunciar doença ou morte."
 DOPPELGANGER_STORY_PRACTICAL_INFORMATION_STRING:0 "Um camponês que se parece e fala exatamente como você pode ser uma oportunidade... ou uma maldição. Por enquanto, [Story.MakeScope.Var('doppelganger_character').Char.GetUIName] reside em sua [court|E]."
 EAGLE_INFORMATION_STRING:0 "O nome da sua águia é #V [Story.Custom('EagleStoryNameAll')].#!\n[Story.Custom('EagleStorySheHeAll')|U] tem [Story.MakeScope.Var('eagle_age_variable').GetValue|0] anos de idade."
 ECCENTRIC_MAX_VALUE_LABEL:0 "Máx: #V 5#!"
 ECCENTRIC_MIN_VALUE_LABEL:0 ""
 ECCENTRIC_VALUE:0 "Progresso para adquirir [GetTrait('eccentric').GetName( GetNullCharacter )]"
 EPIC_INFORMATION_STRING:0 "Seu/Sua [Story.GetOwner.Custom('CommissionEpicScribe')][AddTextIf(Story.MakeScope.Var('composer').IsSet, Concatenate(Concatenate(', ', Story.MakeScope.Var('composer').Char.GetShortUIName), ','))] está criando um(a) [Story.Custom('CompositionTypeAll')] épico(a) para aumentar o [dynasty_prestige|E] da dinastia [Story.GetOwner.GetDynasty.GetName] e obter um [artifact|E].\n\nA chance de um(a) [Story.Custom('CompositionTypeAll')] excepcional é: [Story.MakeScope.Var('final_outcome_chance').GetValue|0+/%]"
 EUNUCH_INFORMATION_STRING:0 "Com o tempo, você terá oportunidades de conceder a [Story.MakeScope.Var('eunuch').Char.GetShortUIName] maior poder e influência. Fazer isso aumenta a força do modificador [GetModifier('admin_eunuch_liege_4_modifier').GetNameWithTooltip] [modifier|E].\n\nMas cuidado — rejeite [Story.MakeScope.Var('eunuch').Char.GetHerHim], ou dê a [Story.MakeScope.Var('eunuch').Char.GetHerHim] #EMP poder demais#! sem garantir a lealdade [Story.MakeScope.Var('eunuch').Char.GetHerHim], e as consequências podem ser graves...\n\nVocê recusou os pedidos [Story.MakeScope.Var('eunuch').Char.GetHerHim] [Story.MakeScope.Var('eunuch_refusals').GetValue|0V] vezes até agora."
 EUNUCH_LABEL:0 "O Eunuco"
 FRANKOKRATIA_STORY_PRACTICAL_INFORMATION_STRING:0 "Uma [war|E] contra [GetTitleByKey('e_byzantium').GetHolder.GetShortUIName] determinará o futuro de [GetTitleByKey('e_byzantium').GetName|l]. Ou o [claimant|E] [Story.MakeScope.Var('byz_claimant').Char.GetUIName] tomará o trono, pagando os cruzados por seus esforços — ou um novo [GetTitleByKey('e_latin_empire').GetBaseName] será estabelecido sob domínio [GetFaithByKey('catholic').GetAdjective]."
 GREATEST_OF_KHANS_INFORMATION_STRING:0 "$become_greatest_of_khans_decision_enable_gok_invasion_cb$\n$gok_enable_offer_submission_or_ruin_tt$\n\n@alert_icon! #alert_trial Se sua [dynasty|E] perder o controle de [Story.GetOwner.GetPrimaryTitle.GetName|l], deixar de ser [GetGovernment( 'nomad_government' ).GetName], ou falhar em realizar a [decision|E] #high $mpo_gok_world_conquest_decision$#! até o ano #high [Story.MakeScope.Var('gok_final_date').GetValue|0]#!, esses bônus serão perdidos e [Story.GetOwner.GetPrimaryTitle.GetName|l] ficará sujeito a se fragmentar!#!"
 HOSTAGE_STORY_PRACTICAL_INFORMATION_STRING:0 "Seu [hostage|E], [Story.MakeScope.Var('hostage_target').Char.GetUIName], está crescendo em sua [court|E], afetando a lealdade [Story.MakeScope.Var('hostage_target').Char.GetHerHim]. Mantenha a [opinion|E] [Story.MakeScope.Var('hostage_target').Char.GetHerHim] alta e escolha as opções certas nos eventos para tornar [Story.MakeScope.Var('hostage_target').Char.GetHerHim] mais propenso(a) a ser leal a você quando [Story.MakeScope.Var('hostage_target').Char.GetSheHe] se tornar adulto(a).\n\nLealdade Atual: [Story.MakeScope.Var('theon_points').GetValue|0+]"
 IMAGINARY_FRIEND_INFORMATION_STRING:0 "O nome do seu amigo imaginário é [Story.MakeScope.Var('imaginary_friend_name').Char.GetShortUINameNoTooltip]. Você ocasionalmente terá oportunidades de interagir com [Story.MakeScope.Var('imaginary_friend_name').Char.GetHerHim]."
 JEALOUS_VASSAL_LABEL:0 "Meu Vassalo Mais Invejoso"
 LEGENDARY_COUNTY_LABEL:0 "O Atual Refúgio do(a) [Story.MakeScope.Var('animal_type').GetFlagName|U] Branco(a)"
 LOYALTY_LABEL:0 "Pontos de Lealdade"
 PET_ROCK_INFORMATION_STRING:0 "O nome da sua pedra é #V [Story.GetOwner.Custom('RockStoryName')]#!.\nO exterior irregular [Story.GetOwner.Custom('RockStoryHerHim')] é [Story.GetOwner.Custom('RockColor')]."
 POETRY_BOOK_LABEL:0 "Meu Livro de Poesia"
 REAFFIRMATION_LABEL:0 "Progresso para Reafirmar sua [culture|E]"
 REAFFIRMATION_MAX_VALUE_LABEL:0 "Máx: #V 2#!"
 REAFFIRMATION_MIN_VALUE_LABEL:0 ""
 REFORMER_INFORMATION_STRING:0 "Você foi criado em [Story.MakeScope.Var('advanced_realm').Title.GetBaseName] por [Story.MakeScope.Var('foreign_educator').Char.GetShortUIName], um(a) [Story.MakeScope.Var('advanced_culture').Culture.GetName] [Story.MakeScope.Var('advanced_culture_faith').Faith.GetAdjective]. Você ficou impressionado com a [Story.MakeScope.Var('advanced_culture').Culture.GetName] [culture|E] e deseja tornar seu próprio povo mais parecido com eles.\n\nVocê começará a receber oportunidades para ganhar pontos de Reforma ou Reafirmação:\n$BULLET_WITH_TAB$#indent_newline:7 Ao buscar a Reforma, você pode obter [innovations|E], [cultural_acceptance|E], [traditions|E], ou talvez até um(a) [GetBuilding('generic_university').GetName]. Lembre-se, a Reforma é um processo longo e custoso.#!\n$BULLET_WITH_TAB$#indent_newline:7 Ao buscar a Reafirmação, você pode obter [vassal|E] [opinion|E], [dynasty_prestige|E], bônus em [war|E] na forma de [casus_bellis|E] e [special_troops|E].#!"
 REFORM_LABEL:0 "Progresso para Reformar sua [culture|E]"
 REFORM_MAX_VALUE_LABEL:0 "Máx: #V 3#!"
 REFORM_MIN_VALUE_LABEL:0 ""
 SITUATION_LIST_STORY_CYCLE_DECISIONS_HEADER:0 "Decisões"
 SITUATION_LIST_STORY_CYCLE_MODIFIERS_HEADER:0 "Modificadores"
 SLAVIC_RITE_PROGRESS_LABEL:0 "Progresso da Conversão"
 SLAVIC_RITE_PROGRESS_MAX_LABEL:0 "Condados Alvo"
 SLAVIC_RITE_PROGRESS_MIN_LABEL:0 "Condados Convertidos"
 SYCOPHANT_INFORMATION_STRING:0 "M[Select_CString( Story.MakeScope.Var('sycophant_character').Char.IsFemale, 'inha', 'eu' )] [Story.GetOwner.Custom2( 'RelationToMeShort', Story.MakeScope.Var('sycophant_character').Char )] [Story.MakeScope.Var('sycophant_character').Char.GetShortUIName] e m[Select_CString( Story.MakeScope.Var('jealous_character').Char.IsFemale, 'inha', 'eu' )] [Story.GetOwner.Custom2( 'RelationToMeShort', Story.MakeScope.Var('jealous_character').Char )] [Story.MakeScope.Var('jealous_character').Char.GetShortUIName] estão em conflito constante. Posso escolher um favorito, mas isso certamente irritará o outro. O tempo dirá como essa situação se desenrolará..."
 SYCOPHANT_LABEL:0 "O Bajulador"
 UPSET_COURTIERS:0 "Súditos que estão irritados com o Eunuco"
 WARHORSE_STORY_PRACTICAL_INFORMATION_STRING:0 "Seu cavalo de guerra se chama #V [Story.Custom('WarhorseStoryNameAll')]#!. [Story.Custom('HorseStorySheHeAll')|U] é um(a) [Story.Custom('HorseStoryMareStallionAll')]."
 WHITE_ANIMAL_INFORMATION_STRING:0 "Você está no encalço de um(a) #V [Story.MakeScope.Var('animal_type').GetFlagName|U] Branco(a)#!.\n\nCapturá-lo(a) traria grandes recompensas — mas você ganha [stress|E] toda vez que o(a) [Story.MakeScope.Var('animal_type').GetFlagName] escapa. De tempos em tempos, um [GetModifier('hunt_sighting_legendary_modifier').GetNameWithTooltip] permitirá que você continue a caçada.\n\nEncontros com [Story.MakeScope.Var('animal_type').GetFlagName] Branco(a): [Story.MakeScope.Var('encounters').GetValue|0V] #weak (desde a primeira vez)#!"
 bp2_hostage_loyalty:0 "Um Refém Leal"
 bp2_hostage_loyalty_desc:0 "Um de seus [hostages|E] está começando a se afeiçoar a você e aos seus costumes."
 cat_age_kitten:0 "um filhote"
 cat_age_proper:0 "[Story.MakeScope.Var('cat_age_variable').GetValue|0] anos de idade"
 claimant:0 "[claimant|E]"
 commission_epic_story:0 "Comissionar Épico"
 commission_epic_story_desc:0 "Você está comissionando um grande épico para registrar os feitos de sua família."
 diverted_crusaders:0 "Cruzados Desviados"
 dog_age_proper:0 "[Story.MakeScope.Var('dog_age_variable').GetValue|0] anos de idade"
 dog_age_puppy:0 "um filhote"
 dumb_but_sweet_orange_boy:0 "\n[Story.Custom('CatStorySheHeAll')|U] é um(a) [Story.Custom('CatStoryGirlBoyAll')] [Story.Custom('CatFurColorAll')] bobo(a), mas muito doce."
 frankokratia_story:0 "Frankokratia"
 frankokratia_story_desc:0 "Um pretendente a [GetTitleByKey('e_byzantium').GetName|l] atraiu oportunistas ocidentais de sua cruzada, voltando espadas gananciosas contra o próprio coração da Cristandade..."
 hostage:0 "[hostage|E]"
 not_yet_chosen:0 "ainda não escolhido"
 story_conqueror:0 "Conquistador"
 story_conqueror_desc:0 "Sua ambição não conhece limites! O mundo está diante de você, pronto para ser tomado."
 story_cycle_admin_eunuch:0 "Eunuco Eminente"
 story_cycle_admin_eunuch_desc:0 "Um eunuco de habilidade notável encontrou seu caminho até sua corte. Uma oportunidade ou uma ameaça..?"
 story_cycle_hunt_mystical_animal:0 "Caçando um Animal Místico"
 story_cycle_hunt_mystical_animal_desc:0 "Durante uma caçada, você avistou uma criatura branca e mística. Capturá-la seria como encontrar o Santo Graal!"
 story_cycle_imaginary_friend:0 "Amigo Imaginário"
 story_cycle_imaginary_friend_desc:0 "Finalmente, um amigo para brincar! Quem se importa se não é real? Para mim, é!"
 story_cycle_martial_lifestyle_warhorse:0 "Cavalo de Guerra"
 story_cycle_martial_lifestyle_warhorse_desc:0 "Você tem à sua disposição um cavalo de guerra particularmente bem treinado. Que seus inimigos tremam diante de sua investida."
 story_cycle_pet_cat:0 "Gato de Estimação"
 story_cycle_pet_cat_desc:0 "#F Um felino orgulhoso faz sua companhia, um caçador ágil que oferece afeto apenas em seus próprios termos.#!"
 story_cycle_pet_dog:0 "Cachorro de Estimação"
 story_cycle_pet_dog_desc:0 "#F Um companheiro canino fiel caminha ao seu lado, oferecendo proteção e um vínculo de lealdade que poucos humanos podem igualar.#!"
 story_cycle_pet_eagle:0 "Águia de Caça"
 story_cycle_pet_eagle_desc:0 "#F Em sua luva pousa uma águia de caça, sempre vigilante, sempre faminta, trazendo a morte do alto.#!"
 story_cycle_pet_rock:0 "Pedra de Estimação"
 story_cycle_pet_rock_desc:0 "Ao seu lado está uma pedra de estimação, seu rosto imutável sendo um reflexo perfeito do seu peculiar senso de companhia."
 story_destiny_child:0 "Criança Destinada"
 story_destiny_child_desc:0 "Uma criança de grande potencial nasceu, como se tivesse sido escolhida pelo próprio destino."
 story_doppelganger:0 "Espelho na Lama"
 story_doppelganger_desc:0 "Um camponês com aparência idêntica à sua foi encontrado — um verdadeiro [Glossary( 'doppelgänger', 'DOPPELGANGER_GLOSS' )]..."
 story_foreign_raised_reformer:0 "Reformador Criado no Exterior"
 story_foreign_raised_reformer_desc:0 "Você foi criado longe da terra que agora chama de lar.\nTão diferente... e ainda assim, e se o lar fosse mais parecido com aquilo?"
 story_greatest_of_khans:0 "O Maior dos Cãs"
 story_greatest_of_khans_desc:0 "Nos Céus há muitas grandes luzes. Nos Céus, o sol, a lua e as estrelas. Mas na terra, pode haver apenas um Cã."
 story_slavic_rite:0 "A Missão Morávia"
 story_slavic_rite_desc:0 "A seu pedido, os devotos irmãos tessalônicos Cirilo e Metódio iniciaram uma missão sagrada para ajudá-lo a evangelizar o reino e adaptar o cristianismo com uma nova escrita nativa para o seu povo."
 story_sycophant:0 "O Bajulador"
 story_sycophant_desc:0 "Um de seus cortesãos, um evidente bajulador, está irritando seus vassalos com sua mera presença."
