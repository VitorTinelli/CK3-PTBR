l_spanish:
 peasant_affair.1001.a_1:0 "Fique aqui como parte da minha corte, eu insisto!"
 peasant_affair.1001.a_2:0 "[peasant_character.GetFirstNameNoTooltip], não é? Você é bem-vindo para ficar aqui."
 peasant_affair.1001.b:0 "[peasant_child.GetFirstNameNoTooltip] merece um[Select_CString( peasant_character.IsFemale, 'a', '' )] [peasant_character.GetMotherFather]..."
 peasant_affair.1001.c:0 "Você não encontrará um lar aqui."
 peasant_affair.1001.desc:0 "Não posso acreditar no que vejo: [Select_CString( peasant_character.IsFemale, 'a bela', 'o belo' )] [peasant_character.GetWomanMan] que encontrei do lado de fora de [ROOT.Char.Custom('FortifiedBuilding')] muitas luas atrás apareceu na corte."
 peasant_affair.1001.desc_child:0 "Não posso acreditar no que vejo: [Select_CString( peasant_character.IsFemale, 'a bela', 'o belo' )] [peasant_character.GetWomanMan] com quem me entreguei muitas luas atrás, [Select_CString( peasant_character.IsFemale, 'a', 'o' )] [peasant_character.GetMotherFather] [Select_CString( peasant_child.IsFemale, 'da minha querida', 'do meu querido' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_child'))] [peasant_child.GetTitledFirstName], apareceu na corte."
 peasant_affair.1001.desc_opening:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], meu coração não saberia descanso até encontrar você novamente! Sou eu, [peasant_character.GetFirstNameNoTooltip]. Certamente você se lembra de mim, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom('LoverPetName')]?\"\n\n"
 peasant_affair.1001.desc_rakish_night:0 "Não posso acreditar no que vejo: [Select_CString( peasant_character.IsFemale, 'a bela', 'o belo' )] [peasant_character.GetWomanMan] com quem me entreguei muitas luas atrás durante uma noite selvagem de abandono apareceu na corte."
 peasant_affair.1001.desc_their_child:0 "Não posso acreditar no que vejo: [Select_CString( peasant_character.IsFemale, 'a bela', 'o belo' )] [peasant_character.GetWomanMan] com quem me entreguei muitas luas atrás apareceu na corte. Ao lado [peasant_character.GetHerHim] está o que parece ser [Select_CString( peasant_child.IsFemale, 'sua', 'seu' )] [peasant_child.Custom('GetDaughterSon')], e não posso deixar de reagir à idade [peasant_child.GetHerHim]..."
 peasant_affair.1001.t:0 "Reencontros Inesperados"
 peasant_affair.2001.a.tt:0 "#F Comece a busca imediatamente!#!"
 peasant_affair.2001.a:0 "Devo encontrar [peasant_character.GetSheHe]!"
 peasant_affair.2001.b:0 "Seria melhor se eu esquecesse [peasant_character.GetSheHe]."
 peasant_affair.2001.c:0 "Não vou vacilar, isso é um teste da minha determinação!"
 peasant_affair.2001.desc_child:0 "Especialmente porque [Select_CString( peasant_child.IsFemale, 'minha querida', 'meu querido' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_child'))] [peasant_child.GetTitledFirstName], fruto da nossa paixão, é um lembrete constante [peasant_character.GetHerHim]!"
 peasant_affair.2001.desc_known_father:0 "Muitas noites se passaram desde que compartilhei a cama com m[Select_CString( peasant_character.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_character'))], [peasant_character.GetTitledFirstName], mas meu desejo só cresce..."
 peasant_affair.2001.desc_opening:0 "Mais uma vez acordo com o coração acelerado e o resquício de um fogo ardente em minhas entranhas.\n\n"
 peasant_affair.2001.desc_rakish_night:0 "Muitas noites se passaram desde que compartilhei a cama com [Select_CString( peasant_character.IsFemale, 'a bela', 'o belo' )] [peasant_character.GetWomanMan] que encontrei durante uma das minhas excursões noturnas, mas meu desejo só cresce..."
 peasant_affair.2001.desc_unknown_peasant:0 "Muitas noites se passaram desde que compartilhei a cama com [Select_CString( peasant_character.IsFemale, 'a bela', 'o belo' )] [peasant_character.GetWomanMan] que encontrei do lado de fora do meu [ROOT.Char.Custom('FortifiedBuilding')], mas meu desejo só cresce..."
 peasant_affair.2001.t:0 "[Select_CString( peasant_character.IsFemale, 'A', 'O' )] [peasant_character.GetWomanMan|U] Que Sempre Sonhei"
 peasant_affair.2002.a:0 "Devo ter [peasant_character.GetSheHe], seja como for!"
 peasant_affair.2002.b:0 "Certamente nenhum camponês vale tanto assim."
 peasant_affair.2002.desc:0 "Mesmo enquanto m[Select_CString( searching_character.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('searching_character'))] [searching_character.GetTitledFirstName], se curva e se humilha, meus pensamentos vagam para aquela noite mágica..."
 peasant_affair.2002.desc_child:0 "Mesmo enquanto m[Select_CString( searching_character.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('searching_character'))] [searching_character.GetTitledFirstName] se curva e se humilha, meus olhos recaem sobre o rosto curioso de [peasant_child.GetTitledFirstName], minha [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_child'))]."
 peasant_affair.2002.desc_opening:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], não encontramos nenhum sinal desse camponês que você nos pediu para procurar. Com os recursos limitados à minha disposição, só posso fazer tanto...\"\n\n"
 peasant_affair.2003.a_alive:0 "Por favor, [peasant_character.GetFirstNameNoTooltip], fique aqui em [ROOT.Char.Custom('GetCourtType')|l]."
 peasant_affair.2003.a_dead:0 "Por favor, [peasant_child.GetFirstNameNoTooltip], fique aqui em [ROOT.Char.Custom('GetCourtType')|l]."
 peasant_affair.2003.b:0 "[peasant_child.GetFirstNameNoTooltip], [Select_CString( peasant_child.IsFemale, 'minha filha', 'meu filho' )], quero que conheça [Select_CString( peasant_character.IsFemale, 'sua', 'seu' )] [peasant_character.GetMotherFather]."
 peasant_affair.2003.c.tt:0 "#F Um[Select_CString( peasant_character.IsFemale, 'a', '' )] [peasant_character.GetWomanMan] com tanta influência sobre mim não pode ser deixado livre!#!"
 peasant_affair.2003.c:0 "Agora que você finalmente está aqui... detenha aquel[Select_CString( peasant_character.IsFemale, 'a', 'e' )] [peasant_character.GetWomanMan]!"
 peasant_affair.2003.d.tt:0 "#F Vamos simplesmente esquecer toda essa confusão.#!"
 peasant_affair.2003.d:0 "Mande essa criança embora!"
 peasant_affair.2003.desc:0 "Finalmente! Enquanto [peasant_character.GetSheHe] está diante de mim, sinto que o tempo que compartilhamos nunca terminou. Indo pelo sorriso caloroso [peasant_character.GetHerHim], [peasant_character.GetSheHe] também não me esqueceu."
 peasant_affair.2003.desc_dead:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], trago notícias. [Select_CString( peasant_character.IsFemale, 'A', 'O' )] [peasant_character.GetWomanMan] que nos pediu para procurar infelizmente deixou este mundo para trás.\"\n\nQue piada cruel, encontrá-l[Select_CString( peasant_character.IsFemale, 'a', 'o' )] finalmente apenas para perdê-l[Select_CString( peasant_character.IsFemale, 'a', 'o' )] para sempre!"
 peasant_affair.2003.desc_dead_brought_child:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], trago notícias. [Select_CString( peasant_character.IsFemale, 'A', 'O' )] [peasant_character.GetWomanMan] pela qual estávamos procurando infelizmente deixou este mundo para trás, mas trouxemos s[Select_CString( peasant_child.IsFemale, 'ua', 'eu' )] [peasant_child.Custom('GetDaughterSon')].\"\n\nQue piada cruel, encontrar [peasant_character.GetSheHe] finalmente apenas para perdê-lo para sempre! Mas ess[Select_CString( peasant_child.IsFemale, 'a', 'e' )] [peasant_child.Custom('GirlBoy')], poderia [peasant_child.GetSheHe] ser m[Select_CString( peasant_child.IsFemale, 'inha', 'eu' )]...?"
 peasant_affair.2003.desc_dislike:0 "[Select_CString( peasant_character.IsFemale, 'A', 'O' )] [peasant_character.GetWomanMan] camponês[Select_CString( peasant_character.IsFemale, 'a', '' )] dos meus sonhos luta contra o aperto de [searching_character.GetTitledFirstNamePossessive], com o rosto torcido em raiva e medo.\n\n\"Por favor, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLadyLord], deixe-me ir! Aquela noite foi um erro, eu só desejo ser deixad[Select_CString( peasant_character.IsFemale, 'a', 'o' )] em paz.\""
 peasant_affair.2003.desc_dislike_their_child:0 "[Select_CString( peasant_character.IsFemale, 'A', 'O' )] [peasant_character.GetWomanMan] camponês[Select_CString( peasant_character.IsFemale, 'a', '' )] dos meus sonhos luta contra o aperto de [searching_character.GetTitledFirstNamePossessive], com o rosto torcido em raiva e medo enquanto [peasant_character.GetSheHe] segura s[Select_CString( peasant_child.IsFemale, 'ua', 'eu' )] [peasant_child.Custom('GetDaughterSon')] ao lado.\n\n\"Por favor, [ROOT.Char.Custom('FormOfAddressForLiege')], deixe-nos ir! Eu só desejo criar #EMP m[Select_CString( peasant_child.IsFemale, 'inha', 'eu' )]! [peasant_child.Custom('GetDaughterSon')] sozinh[Select_CString( peasant_character.IsFemale, 'a', 'o' )].\""
 peasant_affair.2003.desc_opening:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], eu lhe apresento [peasant_character.GetTitledFirstName], trazido diante de você a seu pedido.\"\n\n"
 peasant_affair.2003.desc_their_child:0 "Finalmente! Enquanto [peasant_character.GetSheHe] está diante de mim, sinto que o tempo que compartilhamos nunca terminou. No entanto, ao lado [peasant_character.GetHerHim] está o que parece ser s[Select_CString( peasant_child.IsFemale, 'ua', 'eu' )] [peasant_child.Custom('GetDaughterSon')], e não posso deixar de reagir à idade [peasant_child.GetHerHim]..."
 peasant_affair.2003.e:0 "Que destino cruel!"
 peasant_affair.2003.f:0 "Essa criança é minha, não é?! Pegue [peasant_child.GetSheHe]!"
 peasant_affair.2003.g:0 "Largue [peasant_character.GetHerHim] imediatamente! Você está livre para ir."
 peasant_affair.2004.a:0 "Nunca mais ver [peasant_character.GetSheHe]... O tormento!"
 peasant_affair.2004.desc_opening:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], não encontramos nenhum sinal desse camponês que você nos pediu para procurar. Muito provavelmente [peasant_character.GetSheHe] já está mort[Select_CString( peasant_character.IsFemale, 'a', 'o' )]...\"\n\n"
 peasant_affair.3001.a:0 "Vou reconhecer [peasant_child.GetTitledFirstNameNoTooltip] como meu sangue e nome."
 peasant_affair.3001.available_desc:0 "M[Select_CString( peasant_character.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_character'))] [peasant_character.GetFirstName] veio até mim com o que [peasant_character.GetSheHe] acredita ser um pedido humilde.\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Minha querida', 'Meu querido' )], você sabe que [peasant_child.GetTitledFirstName] é seu filh[Select_CString( peasant_child.IsFemale, 'a', 'o' )]. Por favor, reconheça [peasant_child.GetSheHe] como parte de sua linhagem.\""
 peasant_affair.3001.b:0 "A criança pode ser do meu sangue, mas não terá o meu nome."
 peasant_affair.3001.c:0 "De fato, o bastardo é meu."
 peasant_affair.3001.d.tt:0 "Deixo claro para [peasant_character.GetTitledFirstNameNoTooltip] que isso nunca vai acontecer."
 peasant_affair.3001.d:0 "Nunca farei uma coisa dessas!"
 peasant_affair.3001.t:0 "Um Pedido Tão Pequeno"
 peasant_affair.3001.unavailable_desc:0 "\n\nSerá que [peasant_character.GetSheHe] não percebe que com m[Select_CString( other_spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('other_spouse'))] [other_spouse.GetTitledFirstName], as coisas não estão completamente em minhas mãos?"
 peasant_affair.3002.a:0 "É justo que [peasant_child.GetSheHe] saiba sua linhagem."
 peasant_affair.3002.available_desc:0 "M[Select_CString( peasant_character.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_character'))] [peasant_character.GetFirstName] veio até mim com o que [peasant_character.GetSheHe] acredita ser um pedido humilde.\n\n\"Você sabe tão bem quanto eu que [peasant_child.GetTitledFirstName] é meu. Eu lhe imploro, por favor, que isso seja conhecido.\""
 peasant_affair.3002.b:0 "Não, eu nunca poderia."
 peasant_affair.3002.t:0 "Um Pedido Tão Pequeno"
 peasant_affair.3002.unavailable_desc:0 "\n\nSerá que [peasant_character.GetSheHe] não percebe que com m[Select_CString( other_spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('other_spouse'))] [other_spouse.GetTitledFirstName], as coisas não são tão simples assim!"
 peasant_affair.3003.a:0 "[ROOT.Char.GetFaith.HighGodName] me ajude, como poderia dizer não?"
 peasant_affair.3003.b:0 "É perigoso para nós sermos vistos juntos!"
 peasant_affair.3003.desc:0 "\"Certamente você se lembra do tempo que passamos juntos tanto quanto eu?\" [peasant_character.GetTitledFirstName] me encontrou sozinho em um corredor. [peasant_character.GetSheHe|U] se inclina para sussurrar em meu ouvido. \"O que tivemos... Eu não posso abrir mão disso.\""
 peasant_affair.3003.t:0 "Uma Lembrança"
 peasant_affair.3004.a:0 "Só poderia ser você."
 peasant_affair.3004.b:0 "Nós não podemos nos casar, mas isso não significa que não podemos ficar juntos."
 peasant_affair.3004.c:0 "Você não pode ser [Select_CString( peasant_character.IsFemale, 'minha', 'meu' )] [peasant_character.Custom('WifeHusband')], mas você pertence a mim."
 peasant_affair.3004.d:0 "O casamento está fora de questão."
 peasant_affair.3004.desc:0 "[peasant_character.GetTitledFirstName] parece pensativo enquanto [peasant_character.GetSheHe] [peasant_character.Custom('quirk_pos_present')]. \"Você precisa de [Select_CString( peasant_character.IsFemale, 'uma', 'um' )] [peasant_character.Custom('WifeHusband')],\" [peasant_character.GetSheHe] diz finalmente. \"Eu sei que não tenho nascimento nobre, mas pense em tudo que compartilhamos...\""
 peasant_affair.3004.t:0 "Uma Oportunidade"
