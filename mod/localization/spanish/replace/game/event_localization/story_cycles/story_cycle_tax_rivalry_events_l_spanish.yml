l_spanish:
 tax_rivalry.0011.a.failure:0 "[forgiven_rival.GetTitledFirstNameNoTooltip] despreza minha oferta"
 tax_rivalry.0011.a.tt_ai:0 "Vou pedir [Select_CString( forgiven_rival.IsFemale, 'a', 'ao' )] [forgiven_rival.GetTitledFirstNameNoTooltip] para deixar de lado nossa inimizade."
 tax_rivalry.0011.a.tt_player:0 "[forgiven_rival.GetTitledFirstNameNoTooltip|U] decidirá como responder."
 tax_rivalry.0011.a:0 "Vamos ver o que [forgiven_rival.GetSheHe] acha da minha ideia."
 tax_rivalry.0011.b.tt:0 "Nossa amarga rivalidade será retomada."
 tax_rivalry.0011.b:0 "[forgiven_rival.GetTitledFirstNameNoTooltip|U] ainda provará da minha vingança!"
 tax_rivalry.0011.desc_compassion:0 "Certamente, não sou de brigar por períodos prolongados, mas posso confiar n[forgiven_rival.GetSheHe] ser tão mente aberta quanto eu?"
 tax_rivalry.0011.desc_fallback:0 "Posso me aproximar [forgiven_rival.GetHerHim] para fazer as pazes, mas quem sabe se [forgiven_rival.GetSheHe] aceitará meu ramo de oliveira?"
 tax_rivalry.0011.desc_intro:0 "[forgiven_rival.GetTitledFirstName|U] tem sido há muito tempo um espinho de prata ao meu lado, mas talvez não precise ser sempre assim."
 tax_rivalry.0011.desc_opinion:0 "Mal estamos em termos ruins, e com um pouco de diligência, poderíamos até nos tornar valiosos aliados se acabarmos com essa rivalidade."
 tax_rivalry.0011.desc_unity:0 "Pelo bem do clã, posso fazer as pazes com [forgiven_rival.GetSheHe], mesmo que apenas em nossas vidas públicas. Mas [forgiven_rival.GetTitledFirstNameNoTooltip] sentirá o mesmo?"
 tax_rivalry.0011.t:0 "$tax_rivalry.t$: Fazendo as Pazes"
 tax_rivalry.0012.a:0 "Se você perdoar a minha também."
 tax_rivalry.0012.b:0 "Servos, acompanhem [forgiving_rival.GetTitledFirstNameNoTooltip] até a porta."
 tax_rivalry.0012.desc_intro_friendly:0 "Embora [forgiving_rival.GetTitledFirstName] e eu não tenhamos sido próximos desde que nossas disputas começaram, ainda assim apreciei sua visita súbita ao meu pátio."
 tax_rivalry.0012.desc_intro_unfriendly:0 "Embora normalmente rejeite qualquer menção [Select_CString( forgiven_rival.IsFemale, 'a', 'ao' )] [forgiving_rival.GetTitledFirstName], um certo humor me possuíu para aceitar sua visita súbita ao meu pátio."
 tax_rivalry.0012.desc_outro:0 "Ali jantamos em um clima excepcionalmente agradável até [forgiving_rival.GetSheHe] limpar a garganta:\n\n\"Se não estivéssemos envolvidos nessa disputa, poderíamos desfrutar de muitas tardes como esta. Então, você perdoaria minha tolice passada, [ROOT.Char.GetTitledFirstNameNoTooltip]?\""
 tax_rivalry.0013.a:0 "Só podemos esperar."
 tax_rivalry.0013.desc_intro:0 "[forgiven_rival.GetTitledFirstName|U] concordou com minha proposta, e a partir de hoje, nossas disputas pecuniárias ficam no passado."
 tax_rivalry.0013.desc_outro_neutral:0 "Vamos torcer para que nossa amargura passada não afete nossas relações daqui para frente..."
 tax_rivalry.0013.desc_outro_vengeful:0 "Afinal, haverá muitas outras oportunidades de silenciar [forgiven_rival.GetSheHe] sem que [forgiven_rival.GetSheHe] saiba..."
 tax_rivalry.0014.a:0 "Veremos."
 tax_rivalry.0014.desc:0 "Parece que, pelo bem do reino, [forgiven_rival.Custom2('MyCharacterIntroduction', ROOT.Char)] e [forgiving_rival.Custom2('MyCharacterIntroduction', ROOT.Char)] deixaram de lado suas disputas mesquinhas. Só o tempo dirá se brasas perdidas poderão reacender esse fogo mais uma vez."
 tax_rivalry.1000.b.tt:0 "Ordeno que [steward.GetTitledFirstNameNoTooltip] e [tax_collector.GetTitledFirstNameNoTooltip] encerrem sua rivalidade."
 tax_rivalry.1000.b:0 "Deveria repreendê-los por essa negligência."
 tax_rivalry.1000.desc:0 "As disputas de [steward.GetTitledFirstNamePossessive|U] e [tax_collector.GetTitledFirstNamePossessive] têm prejudicado as finanças do reino. Nenhum deles deseja se corresponder com o outro, e como resultado, os pagamentos muitas vezes são anulados, extraviados e até perdidos.\n\nEnquanto resmungo sobre isso, vejo as próprias contribuições da dupla para o reino. Como seria fácil \"perder\" essa quantia e fazer com que cada um culpe o outro por seu desaparecimento..."
 tax_rivalry.1000.t:0 "$tax_rivalry.t$: Ponto Cego"
 tax_rivalry.1001.a:0 "Ess[Select_CString( other_rival.IsFemale, 'a', 'e' )] [other_rival.Custom2('InsultNoun', ROOT.Char)]!"
 tax_rivalry.1001.desc:0 "Os impostos devidos a [liege.Custom2('MyCharacterIntroduction', ROOT.Char)] desapareceram precisamente no momento em que [other_rival.Custom2('MyCharacterIntroduction', ROOT.Char)] pagou [other_rival.GetSheHe]!\n\nSem evidências que sugiram o contrário, só posso assumir que isso é um plano de [other_rival.GetTitledFirstNamePossessiveNoTooltip] para difamar meu bom nome e tesouro."
 tax_rivalry.1002.a:0 "Não acontecerá de novo."
 tax_rivalry.1002.desc:0 "\"Vocês dois estão ficando descuidados,\" [liege.Custom2('MyCharacterIntroduction', ROOT.Char)] empurra um saco de ouro em direção ao nosso lado da mesa. \"Teria sido muito fácil pegar suas contribuições e culpar o outro pelo desaparecimento, dada a pouca comunicação entre vocês. Garantam que encerrem essas disputas mesquinhas.\"\n\n[liege.GetSheHe|U] pega o saco e guarda, olhando fixamente para nós."
 tax_rivalry.3001.a.tt:0 "Uma [peasant_faction|E] se levantará contra seu senhor em [sabotaged_county.GetNameNoTierNoTooltip]"
 tax_rivalry.3001.a:0 "Chamar os arautos."
 tax_rivalry.3001.b:0 "Defender minha própria posição é mais importante."
 tax_rivalry.3001.desc_intro:0 "Enquanto pondero sobre minhas queixas com [sabotaged_rival.GetTitledFirstNameNoTooltip], um plano infame me ocorre. Com apenas um pequeno suborno, posso convencer os camponeses de [sabotaged_county.GetNameNoTierNoTooltip] de que [sabotaged_rival.GetTitledFirstNameNoTooltip] pretende quintuplicar seus impostos e inspirar uma rebelião contra [Select_CString( liege.IsFemale, 'nossa senhora', 'nosso senhor' )] [liege.GetTitledFirstName]."
 tax_rivalry.3001.desc_outro_assigned:0 "Naturalmente, a culpa recairá sobre ess[Select_CString( sabotaged_rival.IsFemale, 'a', 'e' )] [sabotaged_rival.Custom2('InsultNoun', ROOT.Char)] por má gestão do condado."
 tax_rivalry.3001.desc_outro_fallback:0 "Não importa que [sabotaged_rival.GetTitledFirstNameNoTooltip] não esteja realmente no comando do condado, o estrago estará feito."
 tax_rivalry.3001.t:0 "$tax_rivalry.t$: A Canalha"
 tax_rivalry.3002.a:0 "Tudo foi obra de [saboteur.GetTitledFirstNamePossessiveNoTooltip]!"
 tax_rivalry.3002.desc:0 "[saboteur.Custom2('InsultNoun', ROOT.Char)|U] Maldit[Select_CString( saboteur.IsFemale, 'a', 'o' )]! [saboteur.Custom2('MyCharacterIntroduction', ROOT.Char)|U] espalhou informações falsas de que estou aumentando impostos em [sabotaged_county.GetName]. Agora, uma multidão se formou contra meu senhor, e nenhuma palavra pode amenizar a ira [liege.GetHerHim]."
 tax_rivalry.3003.a.tt:0 "Uma [peasant_faction|E] se levantará contra você em [sabotaged_county.GetNameNoTierNoTooltip]"
 tax_rivalry.3003.a:0 "Às armas!"
 tax_rivalry.3003.desc:0 "Ah, a tolice... agora [sabotaged_county.GetName] formou uma turba contra meu nome, tudo porque acreditaram que [sabotaged_rival.GetTitledFirstName] aumentaria seus impostos!\n\n[sabotaged_rival.GetTitledFirstNameNoTooltip|U] está alegando que isso é obra de [saboteur.GetTitledFirstName], mas uma coisa é clara: a rivalidade da dupla está rapidamente saindo de controle."
 tax_rivalry.4000.t:0 "$tax_rivalry.t$: Clã Despedaçado"
 tax_rivalry.4010.desc_liege_friendly:0 "Isso aconteceu apesar das boas relações entre os dois."
 tax_rivalry.4010.desc_liege_unfriendly:0 "Isso aconteceu por causa das más relações entre os dois."
 tax_rivalry.4010.desc_steward_friendly:0 "Isso aconteceu apesar das minhas boas relações com [tax_collector.GetSheHe]."
 tax_rivalry.4010.desc_steward_unfriendly:0 "Isso aconteceu por causa das minhas más relações com [tax_collector.GetSheHe]."
 tax_rivalry.4010.desc_tax_collector_friendly:0 "Isso aconteceu apesar das minhas boas relações com [steward.GetSheHe]."
 tax_rivalry.4010.desc_tax_collector_unfriendly:0 "Isso aconteceu por causa das minhas más relações com [steward.GetSheHe]."
 tax_rivalry.4010.t:0 "$tax_rivalry.t$: Rixa Amarga"
 tax_rivalry.4011.desc_liege_friendly:0 "Isso aconteceu por causa das boas relações entre os dois."
 tax_rivalry.4011.desc_liege_unfriendly:0 "Isso aconteceu apesar das más relações entre os dois."
 tax_rivalry.4011.desc_steward_friendly:0 "Isso aconteceu por causa das minhas boas relações com [tax_collector.GetSheHe]."
 tax_rivalry.4011.desc_steward_unfriendly:0 "Isso aconteceu apesar das minhas más relações com [tax_collector.GetSheHe]."
 tax_rivalry.4011.desc_tax_collector_friendly:0 "Isso aconteceu por causa das minhas boas relações com [steward.GetSheHe]."
 tax_rivalry.4011.desc_tax_collector_unfriendly:0 "Isso aconteceu apesar das minhas más relações com [steward.GetSheHe]."
 tax_rivalry.4011.t:0 "$tax_rivalry.t$: Relações Descongelando"
 tax_rivalry.9000.a.tt:0 "Sua disputa com [less_fortunate_rival.GetTitledFirstNameNoTooltip] termina, por enquanto."
 tax_rivalry.9000.a:0 "É bom ser [ROOT.Char.GetTitleAsNameNoTooltip]."
 tax_rivalry.9000.desc:0 "Não mais devo suportar os [less_fortunate_rival.Custom('quirk_neg_noun')] de [less_fortunate_rival.GetTitledFirstName]. Agora sou [ROOT.Char.Custom('MistressMaster')] do meu próprio domínio, e [less_fortunate_rival.GetTitledFirstNameNoTooltip] será o alvo de uma vara muito mais poderosa caso [less_fortunate_rival.GetSheHe] ouse perturbar meu reinado novamente."
 tax_rivalry.9000.t:0 "$tax_rivalry.t$: Vitória"
 tax_rivalry.9001.a.tt:0 "Sua disputa com [fortunate_rival.GetTitledFirstNameNoTooltip] termina, por enquanto."
 tax_rivalry.9001.a_neutral:0 "Assim começa um novo capítulo..."
 tax_rivalry.9001.a_spurned:0 "Isso não acabou ainda!"
 tax_rivalry.9001.desc:0 "Como eu poderia antecipar que [fortunate_rival.GetFullName] se tornaria [fortunate_rival.GetTitleAsNameNoTooltip] de [fortunate_rival.GetPrimaryTitle.GetNameNoTierNoTooltip]? Se ao menos eu tivesse agido mais cedo, então meu destino não estaria selado agora!"
 tax_rivalry.9001.t:0 "$tax_rivalry.t$: Derrota"
 tax_rivalry.t:0 "Sangue e Ouro"
 tax_rivalry_liege_notification_desc:0 "Isso aconteceu por causa da rivalidade entre [steward.GetShortUIName] e [tax_collector.GetShortUIName]."
 tax_rivalry_steward_notification_desc:0 "Isso aconteceu por causa da sua rivalidade com [tax_collector.GetShortUIName]."
 tax_rivalry_tax_collector_notification_desc:0 "Isso aconteceu por causa da sua rivalidade com [steward.GetShortUIName]."
