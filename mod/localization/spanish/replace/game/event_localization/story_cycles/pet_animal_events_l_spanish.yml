l_spanish:
 artifact_animal_feather_name_eagle:0 "Pena de [ROOT.Char.Custom('EagleStoryNamePossessive')]"
 artifact_bird_feather_pet_description:0 "A pena de uma amada águia de caça, arrancada por [ROOT.Char.GetTitledFirstName]."
 dog_got_pregnant_tooltip:0 "Ela está esperando filhotes!"
 eagle_funny_sing_modifier:0 "Solilóquio Aviário"
 every_councillor:0 "Cada [councillor|E]"
 pet_animal.0001.a:0 "Que ótimo nome!"
 pet_animal.0001.desc:0 "Enquanto o gato descansa no meu colo, ronronando contente, eu pondero sobre o que deveria nomear [ROOT.Char.Custom('CatStorySheHe')]. Algo histórico? Algo aludindo à pelagem [ROOT.Char.Custom('CatFurColor')] [ROOT.Char.Custom('CatStoryHerHim')]? Algo para descrever a sensação reconfortante que sinto ao coçar atrás da orelha [ROOT.Char.Custom('CatStoryHerHim')]?\n\nAh, eu sei! Vou nomeá-lo de..."
 pet_animal.0001.t:0 "O Gato"
 pet_animal.0101.a_female:0 "Obrigado, bela dama!"
 pet_animal.0101.a_male:0 "Obrigado, nobre cavalheiro!"
 pet_animal.0101.desc:0 "Dois olhos [ROOT.Char.Custom('CatEyeColor')] me seguem enquanto atravesso o corredor, e um miado baixo quebra o silêncio quando [ROOT.Char.Custom('CatStoryName')] pula na direção do meu tornozelo."
 pet_animal.0101.desc_ending:0 "\n\nQuando [ROOT.Char.Custom('CatStorySheHe')] se afasta, vejo que [ROOT.Char.Custom('CatStorySheHe')] deixou um presente brilhante onde [ROOT.Char.Custom('CatStorySheHe')] estava escondido."
 pet_animal.0101.desc_middle:0 "Um gato em seu auge, [ROOT.Char.Custom('CatStorySheHe')] não deixa marcas em mim."
 pet_animal.0101.desc_old:0 "[ROOT.Char.Custom('CatStorySheHe')|U] já viu dias melhores, mas a idade nunca impediu [ROOT.Char.Custom('CatSheHe')]!"
 pet_animal.0101.desc_young:0 "[ROOT.Char.Custom('CatStorySheHe')|U] pode ser jovem, mas [ROOT.Char.Custom('CatStorySheHe')] é igualmente feroz!"
 pet_animal.0101.t:0 "[ROOT.Char.Custom('CatStoryName')]: O Doador de Presentes"
 pet_animal.0103.a:0 "Você é muito perspicaz!"
 pet_animal.0103.desc:0 "Ao sair de casa, sou recebido pela visão [Select_CString( vassal.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))] [vassal.GetTitledFirstName] agachado ao lado do meu gato [ROOT.Char.Custom('CatStoryName')], acariciando ternamente a cabeça [ROOT.Char.Custom('CatStoryHerHim')].\n\n\"Este é um gato encantador que você tem, [ROOT.Char.Custom('FormOfAddressForLiege')].\""
 pet_animal.0103.t:0 "[ROOT.Char.Custom('CatStoryName')]: Vassalo Encantado"
 pet_animal.0104.a:0 "Acho que consigo fazer isso por mais um tempo."
 pet_animal.0104.desc:0 "Depois de mais um dia estressante, eu me jogo em uma cadeira no meu quarto — por quanto tempo conseguirei suportar isso?\n\nDe repente, ouço um miado suave, e meu gato [ROOT.Char.Custom('CatStoryName')] pula no meu colo e começa a ronronar. Fico com [ROOT.Char.Custom('CatStorySheHe')] por um tempo, apenas ouvindo o som calmante e acariciando a pelagem [ROOT.Char.Custom('CatFurColor')] [ROOT.Char.Custom('CatStoryHerHim')]."
 pet_animal.0104.t:0 "[ROOT.Char.Custom('CatStoryName')]: Conforto Ronronante"
 pet_animal.0105.a:0 "Pensar que [person.GetSheHe] estava escondendo algo assim...!"
 pet_animal.0105.b:0 "O mundo precisa saber disso."
 pet_animal.0105.desc_cannibal:0 "\"... pois provei a carne de humanos...\""
 pet_animal.0105.desc_deviant:0 "\"... a devassidão que cometi...\""
 pet_animal.0105.desc_fallback:0 "\"... manter esse segredo pesa sobre mim...\""
 pet_animal.0105.desc_homosexual:0 "\"... os desejos que sinto por pessoas do mesmo gênero...\""
 pet_animal.0105.desc_incest:0 "\"... que sinto esses desejos por alguém da minha própria família...\""
 pet_animal.0105.desc_lover:0 "\"... o amor que sinto por outro...\""
 pet_animal.0105.desc_murder:0 "\"... o assassinato que cometi pesa sobre mim, e...\""
 pet_animal.0105.desc_murder_attempt:0 "\"... quando tentei tirar a vida de outro...\""
 pet_animal.0105.desc_non_believer:0 "\"... pois não acredito em [person.GetFaith.HighGodName]...\""
 pet_animal.0105.desc_opening:0 "#EMP Miau!#!\n\nOlho para baixo e vejo que meu gato [ROOT.Char.Custom('CatStoryName')] deixou um pergaminho aos meus pés — selado no estilo distinto [Select_CString( person.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('person'))] [person.GetTitledFirstNamePossessive]. Cedendo à curiosidade, leio o texto..."
 pet_animal.0105.desc_witch:0 "\"... meu coven de bruxas vai...\""
 pet_animal.0105.t:0 "[ROOT.Char.Custom('CatStoryName')]: Segredo Revelado"
 pet_animal.0106.a:0 "Vou dar [ROOT.Char.Custom('CatStorySheHe')] para [receiver_1.GetFirstNameNoTooltip]..."
 pet_animal.0106.b:0 "[receiver_2.GetFirstNameNoTooltip] poderia usar uma companhia..."
 pet_animal.0106.c:0 "[receiver_3.GetFirstNameNoTooltip] cuidará [ROOT.Char.Custom('CatStoryHerHim')]..."
 pet_animal.0106.d:0 "Eu não vou dar [ROOT.Char.Custom('CatStoryName')]..."
 pet_animal.0106.desc:0 "\"[ROOT.Char.GetFirstNameNoTooltip], esse gato tem que ir embora!\"\n\nM[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] [spouse.GetTitledFirstName] segura [ROOT.Char.Custom('CatStoryName')] pela pele do pescoço, olhos vermelhos e nariz escorrendo. \"Eu não aguento mais isso, mal consigo respirar quando [ROOT.Char.Custom('CatStorySheHe')] está por perto!\""
 pet_animal.0106.e:0 "Eu... Eu acho que tenho que me livrar [ROOT.Char.Custom('CatStoryHerHim')]..."
 pet_animal.0106.t:0 "[ROOT.Char.Custom('CatStoryName')]: Sensibilidade"
 pet_animal.0107.a:0 "Obrigado, vou cuidar [ROOT.Char.Custom('CatStoryHerHim')] com carinho!"
 pet_animal.0107.b:0 "Obrigado. Tenho certeza de que [ROOT.Char.Custom('CatStorySheHe')] será valioso."
 pet_animal.0107.desc:0 "\"M[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [giver.Custom2('RelationToMe', SCOPE.sC('spouse'))] não suportará mais a pobre companhia de [ROOT.Char.Custom('CatStoryName')], então vou confiar a você a responsabilidade de cuidar [ROOT.Char.Custom('CatStoryHerHim')] no meu lugar.\"\n\nM[Select_CString( giver.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('giver'))] [giver.GetTitledFirstName] segura um gato de pelagem [receiver.Custom('CatFurColor')] na minha direção. \"[ROOT.Char.Custom('CatStoryName')] é um excelente... um excelente companheiro."
 pet_animal.0107.t:0 "[ROOT.Char.Custom('CatStoryName')]: O Gato"
 pet_animal.0108.a:0 "Estou aliviado!"
 pet_animal.0108.b:0 "Onde está o meu gato?!"
 pet_animal.0108.desc_alive:0 "[receiver.GetSheHe|U] me encontra do lado de fora, o gato de pelagem [receiver.Custom('CatFurColor')] em seus braços. \"[receiver.Custom('CatStorySheHe')|U] está indo bem –"
 pet_animal.0108.desc_alive_1:0 "[receiver.Custom('CatStorySheHe')] gosta de caçar os pássaros locais!"
 pet_animal.0108.desc_alive_2:0 "[receiver.Custom('CatStorySheHe')] gosta de tentar limpar as galinhas!"
 pet_animal.0108.desc_alive_landed:0 "[receiver.GetSheHe|U] me encontra do lado de fora do [receiver.Custom('ResidenceBuilding')] [receiver.GetHerHim], o gato de pelagem [receiver.Custom('CatFurColor')] em seus braços. \"[receiver.Custom('CatStorySheHe')|U] está indo bem –"
 pet_animal.0108.desc_dead:0 "[receiver.GetSheHe|U] me encontra do lado de fora, nenhum gato à vista."
 pet_animal.0108.desc_dead_ending:0 "\"Oh, ele deve estar brincando em algum lugar...\" \n\n[receiver.GetSheHe|U] procura por toda parte, exceto para mim."
 pet_animal.0108.desc_dead_landed:0 "[receiver.GetSheHe|U] me encontra do lado de fora do [receiver.Custom('ResidenceBuilding')] [receiver.GetHerHim], nenhum gato à vista."
 pet_animal.0108.desc_dead_opening:0 "Visito m[Select_CString( receiver.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('receiver'))] [receiver.GetTitledFirstName] para ver como o gato está se saindo sob seu cuidado.\n\n"
 pet_animal.0108.desc_opening:0 "Visito m[Select_CString( receiver.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('receiver'))] [receiver.GetTitledFirstName] para ver como o gato está se saindo sob seu cuidado.\n\n"
 pet_animal.0108.t:0 "[receiver.Custom('CatStoryName')]: Vida Sem Você"
 pet_animal.0108.t_dead:0 "Vida Sem Você"
 pet_animal.0109.a:0 "Continue com o bom trabalho!"
 pet_animal.0109.desc:0 "Quando [ROOT.Char.Custom('CatStoryName')] se aproxima de mim com outro rato morto, só posso elogiar [ROOT.Char.Custom('CatStorySheHe')]. O [ROOT.Char.Custom('ResidenceBuilding')] nunca esteve tão livre de roedores!"
 pet_animal.0109.t:0 "[ROOT.Char.Custom('CatStoryName')]: Caçador de Roedores"
 pet_animal.0110.a:0 "Vou compensar você!"
 pet_animal.0110.b:0 "[ROOT.Char.Custom('CatStorySheHe')|U] é apenas um gato..."
 pet_animal.0110.desc:0 "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim, raiva nos olhos e um gato na mão, segurando-o pela pele do pescoço. Quando [vassal.GetSheHe] empurra o gato na minha direção, vejo que é o meu querido [ROOT.Char.Custom('CatStoryName')]!\n\n\"Encontrei esse pequeno monstro entre as minhas coisas – o que não foi arranhado está coberto de urina!\""
 pet_animal.0110.t:0 "[ROOT.Char.Custom('CatStoryName')]: O Encrenqueiro"
 pet_animal.0197.a:0 "Por favor, volte, [ROOT.Char.Custom('CatStoryName')]!"
 pet_animal.0197.desc:0 "[ROOT.Char.Custom('CatStoryName')] tem vagado cada vez mais longe de casa ultimamente e fica fora por períodos mais longos.\n\nJá se passaram semanas desde que vi [ROOT.Char.Custom('CatStorySheHe')] pela última vez, e temo que [ROOT.Char.Custom('CatStorySheHe')] tenha me deixado para sempre."
 pet_animal.0197.desc_court_5020:0 "Desde que comecei a limitar as idas e vindas de [ROOT.Char.Custom('CatStoryName')], tenho visto [ROOT.Char.Custom('CatStorySheHe')] cada vez menos.\n\nJá se passaram semanas desde que vi [ROOT.Char.Custom('CatStorySheHe')] pela última vez, e temo que [ROOT.Char.Custom('CatStorySheHe')] tenha me deixado para sempre.\n\nMeus cortesãos parecem felizes com seus quartos livres de pelos, mas meu colo nunca pareceu tão vazio..."
 pet_animal.0197.t:0 "[ROOT.Char.Custom('CatStoryName')]: Partiu"
 pet_animal.0199.a:0 "Sentirei saudades de você, [ROOT.Char.Custom('CatStoryName')]!"
 pet_animal.0199.b.tt:0 "Você recebe uma pequena pele bronzeada [court_artifact|E]"
 pet_animal.0199.b:0 "Vou garantir que você estará para sempre ao meu lado!"
 pet_animal.0199.desc:0 "[ROOT.Char.Custom('CatStoryName')] não é mais jovem como costumava ser, e enquanto [ROOT.Char.Custom('CatStorySheHe')] se aconchega no meu colo, posso sentir [ROOT.Char.Custom('CatStorySheHe')] tremendo.\n\nAcaricio gentilmente a pelagem [ROOT.Char.Custom('CatFurColor')] [ROOT.Char.Custom('CatStoryHerHim')] e ouço [ROOT.Char.Custom('CatStorySheHe')] ronronar longamente pela noite, mas à medida que o silêncio cai, sei que [ROOT.Char.Custom('CatStorySheHe')] não acordará novamente."
 pet_animal.0199.t:0 "[ROOT.Char.Custom('CatStoryName')]: Dia de Tristeza"
 pet_animal.0200.a:0 "Hah! Seu pequeno tolo!"
 pet_animal.0200.desc:0 "Estou à minha mesa, lendo relatórios que me foram enviados de todo o reino. [ROOT.Char.Custom('CatStoryName')] pula ao meu lado, perseguindo o calor de um raio de sol e se enrola contente ao lado do meu trabalho.\n\nEstendo a mão para acariciar o pelo [ROOT.Char.Custom('CatFurColor')] [ROOT.Char.Custom('CatStoryHerHim')] e [ROOT.Char.Custom('CatStorySheHe')] se estica preguiçosamente em resposta. Um alongamento poderoso!\n\n#EMP Muito#! poderoso, como se constata. [ROOT.Char.Custom('CatStoryName')] rola e cai completamente da mesa, aterrissando em pé. Com um olhar altivo — como se isso fosse de alguma forma #EMP minha#! culpa — [ROOT.Char.Custom('CatStorySheHe')] se afasta de maneira mal-humorada."
 pet_animal.0200.t:0 "[ROOT.Char.Custom('CatStoryName')]: Thunk!"
 pet_animal.0201.a.failure:0 "[cat_artifact.GetNameNoTooltip] cai no chão"
 pet_animal.0201.a.success:0 "Você consegue pegá-lo com sucesso"
 pet_animal.0201.a.tt:0 "Pegue-o!"
 pet_animal.0201.a:0 "Não!"
 pet_animal.0201.b.failure:0 "[ROOT.Char.Custom('CatStoryName')] não está feliz com você"
 pet_animal.0201.b.success:0 "Você consegue pegar [ROOT.Char.Custom('CatStoryName')]"
 pet_animal.0201.b.tt:0 "Pegue [ROOT.Char.Custom('CatStorySheHe')]!"
 pet_animal.0201.b:0 "Oh não, você não vai, seu pequeno—"
 pet_animal.0201.desc:0 "Foi um longo dia. Estico minhas pernas à minha frente enquanto relaxo na minha mesa de escrita, meus ossos cansados sendo descansados pela primeira vez hoje. Do outro lado da sala, [ROOT.Char.Custom('CatStoryName')] caminha ao longo de uma prateleira, explorando as alturas do cômodo. [ROOT.Char.Custom('CatStorySheHe')|U] gosta de estar em lugares altos...\n\nMeu [cat_artifact.GetName]! Sentado na ponta da prateleira, [ROOT.Char.Custom('CatStoryName')] está indo direto para ele, olhos felinos arregalados de interesse. Observo horrorizado enquanto uma pata se estende..."
 pet_animal.0201.t:0 "[ROOT.Char.Custom('CatStoryName')]: Vacilante"
 pet_animal.0202.a.failure:0 "[ROOT.Char.Custom('CatStoryName')] se recusa obstinadamente a sair"
 pet_animal.0202.a.success:0 "Você consegue afastar o gato com sucesso"
 pet_animal.0202.a:0 "\"Ah, pelo amor de— #EMP sai daqui!#!\""
 pet_animal.0202.b:0 "Bem, seria rude perturbar [ROOT.Char.Custom('CatStorySheHe')]..."
 pet_animal.0202.desc:0 "Velas crepitam e lençóis farfalham enquanto [cat_lover.GetFirstName] e eu nos enroscamos na cama. Tentamos ser discretos, mas às vezes os sons são um pouco ressonantes demais! Os gemidos, os suspiros, os... miados?\n\nEu me sento abruptamente para encontrar [ROOT.Char.Custom('CatStoryName')] sentado bem feliz em um travesseiro ao nosso lado, ronronando contente. Enquanto pondero o que fazer, de boca aberta, [ROOT.Char.Custom('CatStorySheHe')] começa a limpar uma pata barulhentamente.\n\n[cat_lover.GetFirstNameNoTooltip|U] me olha com altivez. Dou um empurrão sem muito entusiasmo no felino satisfeito; [ROOT.Char.Custom('CatStorySheHe')] rola para trás, pronto para brincar."
 pet_animal.0202.t:0 "[ROOT.Char.Custom('CatStoryName')]: Esforços Amorosos"
 pet_animal.0203.a:0 "Ei! Devolva meu gato aqui!"
 pet_animal.0203.b:0 "Bem, suponho que eu não seja o favorito [ROOT.Char.Custom('CatStoryHerHim')]..."
 pet_animal.0203.desc:0 "Será que estou ouvindo algum #EMP arrulho#!? E alguns... miados abafados?\n\nSentado em uma alcova está [random_courtier.GetFirstName], [ROOT.Char.Custom('CatStoryName')] aninhado nos braços [random_courtier.GetHerHim]. O felino olha para cima com adoração para [random_courtier.GetSheHe], membros dobrados como de um bebê, e [Select_CString( random_courtier.IsFemale, 'a', 'o' )] [random_courtier.GetFirstNameNoTooltip] apaixonado balança [ROOT.Char.Custom('CatStorySheHe')] com carinho.\n\nEu ofereço uma saudação, mas embora o humano responda, o gato apenas ronrona contente e enfia seu rosto em uma curva do braço. Apesar de mim mesmo, sinto algo como uma pontada de ciúmes."
 pet_animal.0203.t:0 "[ROOT.Char.Custom('CatStoryName')]: Traição!"
 pet_animal.0204.a:0 "Awn. Você veio me fazer companhia, [ROOT.Char.Custom('CatStoryName')]?"
 pet_animal.0204.desc:0 "Estremeço um pouco e puxo as cobertas mais perto de mim. Essa maldita doença me deixou sentindo miserável há dias, e não está mostrando sinais de melhora tão cedo.\n\nEnquanto brinco com as cobertas, um miado alegre anuncia a chegada do meu gato, [ROOT.Char.Custom('CatStoryName')]. [ROOT.Char.Custom('CatStorySheHe')|U] olha para mim com uma vaga expressão de preocupação, realizando uma elaborada volta na minha cama.\n\nFinalmente, com um pequeno e auto-satisfeito #EMP mrrp!#!, [ROOT.Char.Custom('CatStorySheHe')] se acomoda para amassar os cobertores, eventualmente se enrolando na curva do meu cotovelo."
 pet_animal.0204.t:0 "[ROOT.Char.Custom('CatStoryName')]: O Médico dos Gatos"
 pet_animal.0205.a:0 "Respeite [ROOT.Char.Custom('CatStoryName')], ou perca a língua."
 pet_animal.0205.b:0 "Criado! Venha buscar este gato!"
 pet_animal.0205.c.tt:0 "Venha aqui, bolinha de pelos!"
 pet_animal.0205.c:0 "Ah, venha agora, [ROOT.Char.Custom('CatStorySheHe')] não está causando problemas. [ROOT.Char.Custom('CatStorySheHe')|U] pode ficar."
 pet_animal.0205.desc:0 "Estou sentado, fazendo um gesto para o meu conselho fazer o mesmo. As pessoas mais poderosas do reino estão aqui. Abro a boca para falar e—\n\n#EMP \"Miau!\"#! Olho ao redor em busca do culpado. #EMP \"Miau!\"#!\n\n[ROOT.Char.Custom('CatStoryName')] pula na mesa comprida, ronronando contente. [ROOT.Char.Custom('CatStorySheHe')|U] encosta a cabeça [ROOT.Char.Custom('CatStoryHerHim')] na minha mão alegremente; [cat_disapprover.GetFirstName], enquanto isso, franzindo os lábios em desaprovação.\n\n\"Talvez possamos remover o animal, [ROOT.Char.Custom('FormOfAddressForLiege')]? Temos negócios de grande importância a discutir.\""
 pet_animal.0205.t:0 "[ROOT.Char.Custom('CatStoryName')]: Uma Interrupção"
 pet_animal.1001.desc:0 "Enquanto acaricio um cachorro na cabeça, [ROOT.Char.Custom('DogStorySheHe')] abana a cauda alegremente. Que nome combinaria com [ROOT.Char.Custom('DogStorySheHe')]? Algo histórico? Algo aludindo à pelagem [ROOT.Char.Custom('DogFurColor')] [ROOT.Char.Custom('DogStoryHerHim')]? É uma decisão importante, e enquanto o cachorro rola para que eu possa acariciar sua barriga, me distraio por um momento.\n\nMas espere, eu sei! Vou nomear [ROOT.Char.Custom('DogStorySheHe')]..."
 pet_animal.1001.t:0 "O cachorro"
 pet_animal.1014.a_boy:0 "Tão bom menino, [ROOT.Char.Custom('DogStoryName')]!"
 pet_animal.1014.a_girl:0 "Tão boa menina, [ROOT.Char.Custom('DogStoryName')]!"
 pet_animal.1101.a:0 "E continuamos andando!"
 pet_animal.1101.desc:0 "Tornou-se um hábito passear com [ROOT.Char.Custom('DogStoryName')] diariamente, e não tenho certeza de qual de nós dois aproveita mais o ar fresco e o sol!\n\n[ROOT.Char.Custom('DogStoryName')] pula à minha frente, olha para trás e late, como se dissesse: #EMP Acompanhe!#!"
 pet_animal.1101.t:0 "[ROOT.Char.Custom('DogStoryName')]: Pés e Patas"
 pet_animal.1102.a.tt:0 "Você tenta pegar [ROOT.Char.Custom('DogStorySheHe')]"
 pet_animal.1102.a:0 "Aqui, [ROOT.Char.Custom('DogStoryName')], eu disse aqui! Espere por mim!"
 pet_animal.1102.b.tt:0 "[ROOT.Char.Custom('DogStorySheHe')|U] voltará..."
 pet_animal.1102.b:0 "Vou ter paciência."
 pet_animal.1102.desc:0 "Estou cavalgando, com meu cachorro [ROOT.Char.Custom('DogStoryName')] ao meu lado, quando de repente [ROOT.Char.Custom('DogStorySheHe')] sai correndo em direção ao [ROOT.Char.Custom('TerrainType')].\n\nMinha comitiva me assegura que [ROOT.Char.Custom('DogStorySheHe')] vai voltar, mas e se [ROOT.Char.Custom('DogStorySheHe')] não voltar?!"
 pet_animal.1102.t:0 "[ROOT.Char.Custom('DogStoryName')]: Fugitivo"
 pet_animal.1103.a:0 "Obrigado!"
 pet_animal.1103.desc:0 "Eventualmente, [ROOT.Char.Custom('DogStoryName')] volta trotando, fingindo que nada está errado."
 pet_animal.1103.desc_ending:0 "\n\n[ROOT.Char.Custom('DogStorySheHe')|U] está segurando algo na boca, e quando [ROOT.Char.Custom('DogStorySheHe')] gentilmente coloca na minha frente, vejo que são algumas moedas de ouro."
 pet_animal.1103.desc_followed:0 "Encontro [ROOT.Char.Custom('DogStoryName')] depois de alguns minutos de busca, abanando a cauda alegremente e fingindo que nada está errado."
 pet_animal.1104.a:0 "[ROOT.Char.Custom('DogStoryName')], por que você me deixou?"
 pet_animal.1104.desc:0 "Não importa quanto tempo eu espere, [ROOT.Char.Custom('DogStoryName')] não volta."
 pet_animal.1104.desc_ending:0 "\n\nEnquanto cavalgamos de volta, o espaço vazio ao lado do meu cavalo faz algo dentro de mim doer."
 pet_animal.1104.desc_followed:0 "Procuro por muito tempo, mas não encontro sinal de [ROOT.Char.Custom('DogStoryName')]."
 pet_animal.1105.a:0 "Se [rival.GetSheHe] teve algo a ver com isso..."
 pet_animal.1105.desc_ending:0 "\n\nJusto quando estou prestes a desistir, um membro da minha comitiva retorna com notícias perturbadoras – [dummy_gender.GetSheHe] jura ter visto [rival.Custom2('MyCharacterIntroduction', ROOT.Char)] rondando por aí!"
 pet_animal.1106.a:0 "Tanta sorte! Muito obrigado!"
 pet_animal.1106.desc_ending:0 "\n\nJusto quando estou prestes a sair, [friend.Custom2('MyCharacterIntroduction', ROOT.Char)] aparece do nada, trazendo [ROOT.Char.Custom('DogStoryName')] consigo.\n\n\"Meu amigo, acho que você perdeu alguém!\""
 pet_animal.1107.a_female:0 "Ela é uma boa garota!"
 pet_animal.1107.a_male:0 "Ele é um bom garoto!"
 pet_animal.1107.desc:0 "Dou de cara com m[Select_CString( vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))] [vassal.GetTitledFirstName] agachado ao lado do meu cachorro [ROOT.Char.Custom('DogStoryName')], arranhando vigorosamente a barriga [ROOT.Char.Custom('DogStoryHerHim')].\n\n\"Esse cachorro seu é um verdadeiro charme, [ROOT.Char.Custom('FormOfAddressForLiege')]!\""
 pet_animal.1107.t:0 "[ROOT.Char.Custom('DogStoryName')]: Vassalo Encantado"
 pet_animal.1108.a:0 "O que você está fazendo aqui? Me conte!"
 pet_animal.1108.desc:0 "Estou em meus aposentos quando meu cachorro [ROOT.Char.Custom('DogStoryName')] começa a latir para a porta. Ouço um pio surpreso e, ao abrir a porta, m[Select_CString( agent.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] [agent.GetFirstName] congela no meio do caminho."
 pet_animal.1108.t:0 "[ROOT.Char.Custom('DogStoryName')]: Protetor Peludo"
 pet_animal.1109.a.tt:0 "Eu #EMP espero#! que eles fiquem bem"
 pet_animal.1109.a:0 "Tenho certeza de que eles ficarão bem."
 pet_animal.1109.desc:0 "Estou passeando com [ROOT.Char.Custom('DogStoryName')] quando, de repente, vejo [other_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] se aproximar com um belo cachorro de pelagem [other_owner.Custom('DogFurColor')].\n\nAntes que qualquer um de nós possa reagir, [ROOT.Char.Custom('DogStoryName')] e o outro cachorro saem correndo."
 pet_animal.1109.t:0 "[ROOT.Char.Custom('DogStoryName')]: O Encontro"
 pet_animal.1110.a:0 "Bem... É natural."
 pet_animal.1110.desc:0 "[other_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] e eu encontramos os dois cachorros depois de um tempo, no meio de uma cópula rigorosa.\n\n"
 pet_animal.1110.desc_their_dog:0 "\"[ROOT.Char.Custom('DogStoryName')], como você pôde deixar que essa vira-lata...!\"\n\n[other_owner.GetSheHe|U] para de falar, mas consigo ver a raiva nos olhos [other_owner.GetHerHim]."
 pet_animal.1110.desc_your_dog:0 "\"Bem, [ROOT.Char.GetTitledFirstNameNoTooltip]... acho que em breve seremos parentes!\""
 pet_animal.1111.a:0 "Não poderia concordar mais!"
 pet_animal.1111.desc:0 "[other_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] e eu encontramos os dois cachorros depois de um tempo, no meio de uma luta brincalhona.\n\n\"É bom ver [other_owner.Custom('DogStoryName')] se divertindo assim!\""
 pet_animal.1112.a:0 "Você está bem, [ROOT.Char.Custom('DogStoryName')]?"
 pet_animal.1112.desc:0 "[other_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] e eu encontramos os dois cachorros depois de um tempo, no meio de uma luta feroz.\n\n\"Chame seu vira-lata!\"\n\n"
 pet_animal.1112.desc_alive:0 "Quando finalmente consigo afastar [ROOT.Char.Custom('DogStoryName')], [other_owner.GetTitledFirstNameNoTooltip] sai sem sequer olhar para trás."
 pet_animal.1112.desc_dead:0 "Quando finalmente consigo afastar [ROOT.Char.Custom('DogStoryName')], o cachorro de [other_owner.GetFirstNamePossessiveNoTooltip] já está ficando frio."
 pet_animal.1113.a:0 "[ROOT.Char.Custom('DogStorySheHe')|U] vai se juntar a mim."
 pet_animal.1113.a_failure.tt:0 "Algo... ruim acontece"
 pet_animal.1113.a_failure:0 "[ROOT.Char.Custom('DogStoryName')] faz de tudo, exceto se comportar"
 pet_animal.1113.a_success.tt:0 "Nada de ruim acontece"
 pet_animal.1113.a_success:0 "[ROOT.Char.Custom('DogStoryName')] se comporta"
 pet_animal.1113.b.tt:0 "Você fecha a porta na frente dos olhos suplicantes do cachorro"
 pet_animal.1113.b:0 "Um cachorro não tem lugar em uma reunião do conselho."
 pet_animal.1113.b_failure:0 "[ROOT.Char.Custom('DogStoryName')] sai em aventuras"
 pet_animal.1113.b_success:0 "[ROOT.Char.Custom('DogStoryName')] espera pacientemente"
 pet_animal.1113.desc:0 "Enquanto meus conselheiros e eu nos reunimos para uma reunião, meu cachorro [ROOT.Char.Custom('DogStoryName')] se aproxima de mim com olhos suplicantes e uma cauda caída.\n\n[ROOT.Char.Custom('DogStorySheHe')|U] não gosta de ficar sozinho, mas esta é uma reunião importante..."
 pet_animal.1113.t:0 "[ROOT.Char.Custom('DogStoryName')]: A Reunião do Conselho"
 pet_animal.1114.desc:0 "\"Peço desculpas, [ROOT.Char.GetTitledFirstNameNoTooltip],\" diz meu [councillor.GetCouncilTitle] [councillor.GetTitledFirstName]. \"Eu tenho que discordar do que você acabou de dizer–\"\n\n#EMP *Grrr*#!\n\n[ROOT.Char.Custom('DogStoryName')] emite um rosnado gutural e [councillor.GetTitledFirstNameNoTooltip] recua, olhando do cachorro para mim e de volta.\n\n\"Pensando bem, acho que é uma ótima ideia!\""
 pet_animal.1115.a:0 "Cachorro malcriado!"
 pet_animal.1115.desc:0 "\"Agora, quanto ao próximo ponto,\" meu [councillor.GetCouncilTitle] [councillor.GetTitledFirstName] diz em tom monótono. \"É de extrema importância que–\"\n\n#EMP *Phhffrrt*#!\n\nO silêncio que se instala é interrompido apenas pelo som do latido alegre de [ROOT.Char.Custom('DogStoryName')], que acabou de fazer as necessidades."
 pet_animal.1116.a:0 "Hah, sim. [ROOT.Char.Custom('DogStorySheHe')|U] é incrível..."
 pet_animal.1116.desc:0 "De repente, me deparo com [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] com um cachorro praticamente no colo, arranhando vigorosamente a barriga de sua pelagem [ROOT.Char.Custom('DogFurColor')]. Um cachorro que se parece suspeitosamente com [ROOT.Char.Custom('DogStoryName')].\n\n\"Este é um companheiro precioso que você tem, [ROOT.Char.GetTitledFirstNameNoTooltip]!\""
 pet_animal.1116.desc_opening:0 "Saio da sala de reuniões apenas para descobrir que [ROOT.Char.Custom('DogStoryName')] sumiu. Procuro por [ROOT.Char.Custom('DogStorySheHe')] em todos os lugares, alto e baixo; e se [ROOT.Char.Custom('DogStorySheHe')] estiver perdido e assustado?\n\n"
 pet_animal.1117.a:0 "Eh... Ups. Cachorro travesso!"
 pet_animal.1117.desc:0 "De repente, me deparo com [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] repreendendo um cachorro; um cachorro que se parece suspeitosamente com [ROOT.Char.Custom('DogStoryName')], com papéis e tecidos rasgados ao redor [ROOT.Char.Custom('DogStoryHerHim')].\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip]! Esse... Esse #EMP animal#! destruiu completamente meus aposentos! Tudo está em pedaços!\""
 pet_animal.1118.a:0 "Vou compensar você!"
 pet_animal.1118.b:0 "[ROOT.Char.Custom('DogStorySheHe')|U] é apenas um cachorro..."
 pet_animal.1118.desc:0 "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim, com raiva nos olhos e um cachorro na mão, arrastado pelo pescoço. Ao se aproximar, vejo que é o meu querido [ROOT.Char.Custom('DogStoryName')] que [vassal.GetSheHe] está segurando!\n\n\"Encontrei essa fera entre minhas coisas – o que não foi roído estava coberto de excremento!\""
 pet_animal.1118.t:0 "[ROOT.Char.Custom('DogStoryName')]: O Encrenqueiro"
 pet_animal.1190.a:0 "Vou dar para [receiver_1.GetFirstNameNoTooltip]..."
 pet_animal.1190.b:0 "[receiver_2.GetFirstNameNoTooltip] poderia usar uma companhia..."
 pet_animal.1190.c:0 "[receiver_3.GetFirstNameNoTooltip] vai cuidar dele..."
 pet_animal.1190.d:0 "Vou vender no mercado."
 pet_animal.1190.desc:0 "[ROOT.Char.Custom('DogStoryName')] deu à luz a um filhote adorável! Por mais que eu o adore – e sua pequena cauda balançando –, eu não posso cuidar dele também..."
 pet_animal.1190.t:0 "[ROOT.Char.Custom('DogStoryName')]: Filhote"
 pet_animal.1191.a:0 "Com certeza! Me dá ele!"
 pet_animal.1191.b:0 "Eu... #EMP posso cuidar#! dele."
 pet_animal.1191.desc:0 "[giver.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim com um filhote nos braços.\n\n\"Eu não posso cuidar dele, mas talvez você possa dar um lar a ele?\""
 pet_animal.1191.t:0 "O Filhote"
 pet_animal.1192.a:0 "Estou aliviado!"
 pet_animal.1192.b:0 "Onde está [receiver.Custom('DogStoryName')]?"
 pet_animal.1192.desc:0 "[receiver.GetSheHe|U] me encontra do lado de fora do [receiver.Custom('ResidenceBuilding')], nenhum cachorro à vista. \"Oh, [receiver.Custom('DogStorySheHe')] deve estar brincando em algum lugar...\" [receiver.GetSheHe|U] olha para todos os lugares, exceto para mim."
 pet_animal.1192.desc_alive:0 "[receiver.GetSheHe|U] me encontra do lado de fora, o cachorro de pelagem [receiver.Custom('DogFurColor')] ao lado [receiver.GetHerHim]. \"[receiver.Custom('DogStorySheHe')|U] está indo bem –"
 pet_animal.1192.desc_alive_1:0 "[receiver.Custom('DogStorySheHe')] gosta de perseguir as galinhas!\""
 pet_animal.1192.desc_alive_2:0 "[receiver.Custom('DogStorySheHe')] gosta de seguir os cavalos!"
 pet_animal.1192.desc_alive_landed:0 "[receiver.GetSheHe|U] me encontra do lado de fora do [receiver.Custom('ResidenceBuilding')] [receiver.GetHerHim], o cachorro de pelagem [receiver.Custom('DogFurColor')] ao lado [receiver.GetHerHim]. \"[receiver.Custom('DogStorySheHe')|U] está indo bem –"
 pet_animal.1192.desc_opening:0 "Visito m[Select_CString( receiver.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('receiver'))] [receiver.GetTitledFirstName] para ver como o pequeno [receiver.Custom('DogStoryName')] está em seu cuidado.\n\n"
 pet_animal.1192.t:0 "[receiver.Custom('DogStoryName')]: Vida Sem Você"
 pet_animal.1199.a:0 "Vou sentir saudades de você, [ROOT.Char.Custom('DogStoryName')]!"
 pet_animal.1199.desc:0 "[ROOT.Char.Custom('DogStoryName')] tem andado ao meu lado por muitos anos, e a passagem do tempo não poupa os cães. Enquanto ajoelho ao lado [ROOT.Char.Custom('DogStoryHerHim')], [ROOT.Char.Custom('DogStorySheHe')] começa a abanar a cauda lentamente, mas não consegue erguer a cabeça.\n\nSento-me com [ROOT.Char.Custom('DogStorySheHe')] até tarde da noite, acariciando suas costas de [ROOT.Char.Custom('DogFurColor')] até que a cauda se aquiete."
 pet_animal.1199.t:0 "[ROOT.Char.Custom('DogStoryName')]: Dia de Tristeza"
 pet_animal.2001.a:0 "Eles são tão fofos juntos!"
 pet_animal.2001.desc:0 "Eu me retiro para meus aposentos quando a noite cai e encontro [ROOT.Char.Custom('CatStoryName')] e [ROOT.Char.Custom('DogStoryName')] juntos no chão! A pelagem [ROOT.Char.Custom('DogFurColor')] de [ROOT.Char.Custom('DogStoryName')] está brilhante – [ROOT.Char.Custom('CatStoryName')] obviamente esteve ocupada limpando [ROOT.Char.Custom('DogStorySheHe')]."
 pet_animal.2001.t:0 "Abraços Noturnos"
 pet_animal.2002.a.tt:0 "Tento controlar o cachorro"
 pet_animal.2002.a:0 "Parem com isso imediatamente, [ROOT.Char.Custom('DogStoryName')]!"
 pet_animal.2002.b.tt:0 "Tento controlar o gato"
 pet_animal.2002.b:0 "[ROOT.Char.Custom('CatStoryName')], chega!"
 pet_animal.2002.c.tt:0 "Tenho certeza de que eles vão resolver isso"
 pet_animal.2002.c:0 "Eu não quero ficar no meio disso..."
 pet_animal.2002.desc:0 "Estou atravessando o pátio quando [ROOT.Char.Custom('CatStoryName')] e [ROOT.Char.Custom('DogStoryName')] entram por lados opostos.\n\nNão tenho tempo para reagir – eles estão às gargantas um do outro em questão de segundos. Tufos de pelos [ROOT.Char.Custom('DogFurColor')] voam, e posso ouvir ambos rosnando. Novamente. Essa luta constante precisa acabar!"
 pet_animal.2002.t:0 "Como Cães e Gatos"
 pet_animal.2003.a:0 "Ah, não! [ROOT.Char.Custom('CatStoryName')], você não fez isso...!"
 pet_animal.2003.desc:0 "Procurei por todos os cantos do [ROOT.Char.Custom('ResidenceBuilding')], [ROOT.Char.Custom('CatStoryName')] me seguindo, mas não consigo encontrar meu cachorro [ROOT.Char.Custom('DogStoryName')] em lugar nenhum!\n\nParo para pensar, me abaixando para acariciar [ROOT.Char.Custom('CatStoryName')], quando vejo um tufo de pelo [ROOT.Char.Custom('DogFurColor')] ensanguentado preso nos dentes [ROOT.Char.Custom('CatStoryHerHim')]. Enquanto o puxo para fora, [ROOT.Char.Custom('CatStorySheHe')] sibila e pula para um canto do quintal – um canto com algo [ROOT.Char.Custom('DogFurColor')] caído no chão."
 pet_animal.2004.a:0 "Ah, não... [ROOT.Char.Custom('DogStoryName')], como você pôde?"
 pet_animal.2004.desc:0 "\n\nConforme [ROOT.Char.Custom('DogStorySheHe')] se aproxima, vejo que sua boca está pingando sangue e gore. Com o coração afundando, caminho na direção de onde [ROOT.Char.Custom('DogStorySheHe')] veio e, logo o suficiente, me deparo com o corpo inerte do meu gato [ROOT.Char.Custom('CatStoryName')]."
 pet_animal.2004.desc_female:0 "\"Oi! Quem é uma boa menina? Sim, quem é–\""
 pet_animal.2004.desc_male:0 "\"Oi! Quem é um bom menino? Sim, quem é–\""
 pet_animal.2004.desc_opening:0 "Assim que estou saindo do [ROOT.Char.Custom('ResidenceBuilding')], [ROOT.Char.Custom('DogStoryName')] se aproxima de mim, balançando a cauda alegremente.\n\n"
 pet_animal.2005.a:0 "Por que vocês simplesmente não podiam se dar bem?"
 pet_animal.2005.desc:0 "Assim que estou virando, vejo uma pequena poça de sangue no chão, e depois outra, e outra... Elas me levam a um monte de pelos ensanguentados – dois corpos rasgados enroscados no chão, e não há como confundir quem são."
 pet_animal.2005.desc_opening:0 "Não consigo encontrar nem [ROOT.Char.Custom('CatStoryName')] nem [ROOT.Char.Custom('DogStoryName')]. Vasculho o [ROOT.Char.Custom('ResidenceBuilding')] e a área circundante, mas ninguém os viu.\n\n"
 pet_animal.2006.a:0 "Ah, eles... Eles realmente resolveram isso!"
 pet_animal.2006.desc:0 "Assim que estou virando, os vejo – deitados em um monte no chão. Ah não! Eles finalmente... Mas, ao me aproximar, a cabeça de [ROOT.Char.Custom('CatStoryName')] se ergue e [ROOT.Char.Custom('CatStorySheHe')] me observa com olhos cansados antes de voltar a dormir."
 pet_animal.3001.desc:0 "Eu descanso meu novo filhote de águia na minha luva e gentilmente acaricio as penas de [ROOT.Char.Custom('EagleStoryHerHis')]. Uma criatura digna e feroz, de fato, [ROOT.Char.Custom('EagleStorySheHe')] não é um pássaro comum.\n\nSonhando acordado sobre as caçadas que virão, devo pensar no que chamarei [ROOT.Char.Custom('EagleStoryHerHim')], antes de sairmos para pegar o primeiro raposo ou lebre [ROOT.Char.Custom('EagleStoryHerHim')]."
 pet_animal.3001.t:0 "A Águia"
 pet_animal.3010.a:0 "Farei o que for preciso para encontrar [ROOT.Char.Custom('EagleStoryName')]!"
 pet_animal.3010.a_tt:0 "Mais pessoas estarão à procura da sua águia, e será mais provável que ela seja encontrada"
 pet_animal.3010.b:0 "Alguém deve ter levado [ROOT.Char.Custom('EagleStorySheHe')]..."
 pet_animal.3010.b_tt:0 "Você reúne suspeitos e começa uma investigação sobre o desaparecimento da sua águia"
 pet_animal.3010.c:0 "[ROOT.Char.Custom('EagleStorySheHe')|U] vai aparecer eventualmente."
 pet_animal.3010.c_tt:0 "Você deixa o retorno da sua águia ao acaso"
 pet_animal.3010.d:0 "Talvez seja melhor assim."
 pet_animal.3010.d_mean:0 "Eu não me importava com [ROOT.Char.Custom('EagleStoryName')] de qualquer maneira."
 pet_animal.3010.d_old:0 "[ROOT.Char.Custom('EagleStorySheHe')|U] estava envelhecendo."
 pet_animal.3010.d_tt:0 "Você abandona a busca pela águia"
 pet_animal.3010.desc:0 "[eagle_informer.GetFirstName] se aproxima de mim, com uma expressão preocupada. \"É sobre [ROOT.Char.Custom('EagleStoryName')], [ROOT.Char.Custom('FormOfAddressForLiege')]. Não consigo encontrar [ROOT.Char.Custom('EagleStorySheHe')] em nenhum lugar!\"\n\n[eagle_informer.GetSheHe|U] olha ao redor, como se [eagle_informer.GetSheHe] estivesse esperando que [ROOT.Char.Custom('EagleStoryName')] desça do céu a qualquer momento. [eagle_informer.GetFirstNameNoTooltip] me mostra o poleiro vazio [ROOT.Char.Custom('EagleStoryHerHim')], e nós dois nos perguntamos onde [ROOT.Char.Custom('EagleStorySheHe')] poderia ter ido."
 pet_animal.3010.desc_thief:0 "\n\nInspecionando o local, noto algumas penas no chão e mais algumas presas nos galhos de uma árvore próxima, será que [ROOT.Char.Custom('EagleStoryName')] saiu por conta própria?"
 pet_animal.3010.t:0 "[ROOT.Char.Custom('EagleStoryNamePossessive')|U] Desaparecimento"
 pet_animal.3011.a:0 "Bem-vinda de volta, [ROOT.Char.Custom('EagleStoryName')]!"
 pet_animal.3011.b:0 "[eagle_thief.GetName] vai pagar por isso!"
 pet_animal.3011.desc:0 "Já faz muito tempo desde que minha querida águia [ROOT.Char.Custom('EagleStoryName')] desapareceu, e eu quase havia perdido a esperança de caçar com [ROOT.Char.Custom('EagleStoryHerHim')] novamente."
 pet_animal.3011.desc_aggressive:0 "[ROOT.Char.Custom('EagleStorySheHe')|U] quase perfura minha luva com as garras [ROOT.Char.Custom('EagleStoryHerHim')], e posso ver que [ROOT.Char.Custom('EagleStorySheHe')] não deve ser subestimado."
 pet_animal.3011.desc_brave:0 "[ROOT.Char.Custom('EagleStoryName')] parece mais corajosa, como se [ROOT.Char.Custom('EagleStorySheHe')] tivesse visto o mundo e não tivesse mais medo dele."
 pet_animal.3011.desc_calm:0 "[ROOT.Char.Custom('EagleStorySheHe')|U] se preocupava e se agitava antes, mas agora [ROOT.Char.Custom('EagleStorySheHe')] se senta calmamente, até sem o capô."
 pet_animal.3011.desc_change:0 "\n\nEmbora eu esteja radiante em ver [ROOT.Char.Custom('EagleStoryName')] novamente, não posso deixar de perceber que [ROOT.Char.Custom('EagleStorySheHe')] mudou."
 pet_animal.3011.desc_cunning:0 "[ROOT.Char.Custom('EagleStorySheHe')|U] parece ter aprendido alguns truques, e [ROOT.Char.Custom('EagleStorySheHe')] não tem medo de usá-los."
 pet_animal.3011.desc_curious:0 "[ROOT.Char.Custom('EagleStorySheHe')|U] vagueia pelo acampamento, inspecionando tudo com um olhar ansioso."
 pet_animal.3011.desc_found:0 "Coincidentemente, um mensageiro chega com a notícia de uma aparição de um pássaro que corresponde à descrição [ROOT.Char.Custom('EagleStoryHerHim')]. Corro até o local, e lá está [ROOT.Char.Custom('EagleStorySheHe')], empoleirado em um galho, olhando para mim como se nada tivesse acontecido."
 pet_animal.3011.desc_freedom:0 "Começo a relembrar nosso tempo juntos e me dirijo até o poleiro habitual [ROOT.Char.Custom('EagleStoryHerHim')]. Para minha alegria, [ROOT.Char.Custom('EagleStoryName')] está lá, olhando para mim com os olhos penetrantes [ROOT.Char.Custom('EagleStoryHerHim')]. [ROOT.Char.Custom('EagleStorySheHe')|U] retornou!"
 pet_animal.3011.desc_loyal:0 "[ROOT.Char.Custom('EagleStorySheHe')|U] se agarra a mim, fazendo minha luva o poleiro pessoal [ROOT.Char.Custom('EagleStoryHerHim')]."
 pet_animal.3011.desc_observant:0 "[ROOT.Char.Custom('EagleStorySheHe')|U] voa acima, observando tudo com um olhar atento."
 pet_animal.3011.desc_protective:0 "[ROOT.Char.Custom('EagleStorySheHe')|U] bicoteia quem se aproxima demais, quando antes [ROOT.Char.Custom('EagleStorySheHe')] não se importava nem um pouco."
 pet_animal.3011.desc_stolen:0 "Encontro [ROOT.Char.Custom('EagleStoryHerHim')] nas mãos de [eagle_thief.GetName], que está tentando vender [ROOT.Char.Custom('EagleStorySheHe')] para o maior lance. Intervindo rapidamente, [ROOT.Char.Custom('EagleStoryName')] volta aos meus braços."
 pet_animal.3011.desc_wise:0 "[ROOT.Char.Custom('EagleStorySheHe')|U] me olha com um olhar de sabedoria, como se [ROOT.Char.Custom('EagleStorySheHe')] tivesse visto coisas que eu jamais poderia imaginar."
 pet_animal.3011.t:0 "[ROOT.Char.Custom('EagleStoryName')]: O Retorno"
 pet_animal.3012.a:0 "Adeus, [ROOT.Char.Custom('EagleStoryName')]."
 pet_animal.3012.desc:0 "Após meses de busca, cheguei à conclusão de que nunca verei minha querida águia [ROOT.Char.Custom('EagleStoryName')] novamente. [eagle_informer.GetName] tenta me garantir: \"Meu senhor, tenho certeza de que [ROOT.Char.Custom('EagleStorySheHe')] ainda está por aí, em algum lugar, e retornará.\" Mas eu sei melhor.\n\n[ROOT.Char.Custom('EagleStorySheHe')|U] se foi, e eu devo aceitar isso."
 pet_animal.3013.a:0 "[accused_thief_1.GetName] levou minha preciosa águia!"
 pet_animal.3013.b:0 "Ou talvez tenha sido [accused_thief_2.GetName]?"
 pet_animal.3013.d:0 "Não posso acusar ninguém sem provas."
 pet_animal.3013.desc:0 "Conhecendo [ROOT.Char.Custom('EagleStoryName')], há poucas chances de [ROOT.Char.Custom('EagleStorySheHe')] ter partido por conta própria. Inspeciono cuidadosamente os últimos locais onde [ROOT.Char.Custom('EagleStorySheHe')] esteve e pergunto por qualquer avistamento [ROOT.Char.Custom('EagleStoryHerHim')].\n\nAlguns dos interrogados parecem bastante nervosos, e me pergunto se sabem mais do que deixam transparecer. Pensando melhor, "
 pet_animal.3013.desc_thief_1:0 "Eu nomeio [accused_thief_1.GetName] como suspeito, devido à [accused_thief_1.Custom2('InsultAdjective', ROOT.Char)] natureza [accused_thief_1.GetHerHim]."
 pet_animal.3013.desc_thief_2:0 "$pet_animal.3013.desc_thief_1$ Mas [accused_thief_2.GetName] também é uma candidata provável, sendo bastante [accused_thief_2.Custom2('InsultAdjective', ROOT.Char)]..."
 pet_animal.3013.desc_thief_none:0 "Não consigo imaginar quem teria levado [ROOT.Char.Custom('EagleStoryName')]."
 pet_animal.3013.desc_thief_single:0 "Só consigo pensar em uma pessoa que poderia ter feito isso..."
 pet_animal.3013.t:0 "A Busca por [ROOT.Char.Custom('EagleStoryName')]"
 pet_animal.3013.tt:0 "Você acusa [accused_thief.GetNameNoTooltip] de roubar sua águia."
 pet_animal.3013.unknown:0 "O destino de sua águia permanece desconhecido..."
 pet_animal.3013.wrong:0 "[accused_thief.GetName] não roubou [ROOT.Char.Custom('EagleStoryName')]."
 pet_animal.3020.a_second:0 "Não, a liberdade [ROOT.Char.Custom('EagleStoryHerHim')] já está atrasada."
 pet_animal.3020.a_tt:0 "Você solta sua águia na natureza."
 pet_animal.3020.b:0 "Ainda não posso me separar [ROOT.Char.Custom('EagleStoryHerHim')] agora."
 pet_animal.3020.b_second:0 "[ROOT.Char.Custom('EagleStorySheHe')|U] tem mais alguns anos pela frente."
 pet_animal.3020.b_tt:0 "Você mantém sua águia ao seu lado por mais algum tempo, contemplando a liberação para um momento posterior."
 pet_animal.3020.c:0 "Nunca deixarei [ROOT.Char.Custom('EagleStoryName')] ir!"
 pet_animal.3020.c_tt:0 "A ideia de devolver sua águia à natureza está completamente fora de questão."
 pet_animal.3020.desc:0 "e todas as memórias que compartilhamos. Tornando-se bastante [ROOT.Char.Custom('EaglePersonalityTrait1')] ao longo dos anos, [ROOT.Char.Custom('EagleStoryName')] tem sido minha companheira, e não consigo imaginar caçar sem [ROOT.Char.Custom('EagleStorySheHe')].\n\n"
 pet_animal.3020.desc_intro:0 "Eu olho para [ROOT.Char.Custom('EagleStoryName')], lembrando o dia em que eu"
 pet_animal.3020.desc_intro_gift:0 "recebi [ROOT.Char.Custom('EagleStorySheHe')] como presente"
 pet_animal.3020.desc_intro_lure:0 "atraí [ROOT.Char.Custom('EagleStorySheHe')] para mim"
 pet_animal.3020.desc_intro_market:0 "comprei [ROOT.Char.Custom('EagleStorySheHe')] na barraca de um mercador"
 pet_animal.3020.desc_intro_none:0 "encontrei [ROOT.Char.Custom('EagleStorySheHe')]"
 pet_animal.3020.desc_intro_standard:0 "capturei [ROOT.Char.Custom('EagleStorySheHe')] do ninho [ROOT.Char.Custom('EagleStoryHerHim')]"
 pet_animal.3020.desc_intro_stolen:0 "tirei [ROOT.Char.Custom('EagleStorySheHe')] das garras de outro"
 pet_animal.3020.desc_let_go:0 "Esse dilema me foi apresentado uma vez antes, e eu escolhi manter [ROOT.Char.Custom('EagleStoryName')] ao meu lado. Sei que [ROOT.Char.Custom('EagleStorySheHe')] deveria ser livre, mas [ROOT.Char.Custom('EagleStorySheHe')] ainda não está fraca. Talvez eu deva esperar um pouco mais?"
 pet_animal.3020.desc_let_go_2:0 "No entanto, eu mantive [ROOT.Char.Custom('EagleStoryName')] em minhas garras por tempo demais. Está na hora de liberar [ROOT.Char.Custom('EagleStorySheHe')]."
 pet_animal.3020.desc_normal:0 "Mas essa criatura não foi feita para ser restrita por alguém como eu, e seria melhor se [ROOT.Char.Custom('EagleStorySheHe')] fosse liberada para criar sua própria prole. É agora o momento?"
 pet_animal.3020.t:0 "O Ciclo Continua"
 pet_animal.3020.warning:0 "#warning Isso tem uma chance de afetar a saúde da sua águia.#!"
 pet_animal.3020.warning_less:0 "#warning Isso tem uma pequena chance de afetar a saúde da sua águia.#!"
 pet_animal.3030.bad:0 "De alguma forma, eles pioram a condição da sua águia."
 pet_animal.3030.court_huntsman:0 "Você entende de animais, não é, [court_huntsman.GetFirstName]?"
 pet_animal.3030.court_physician:0 "Se [court_physician.GetFirstName] pode curar os doentes, [court_physician.GetSheHe] pode curar minha águia."
 pet_animal.3030.desc_claw:0 "Uma das garras de [ROOT.Char.Custom('EagleStoryNamePossessive')] está quebrada, e [ROOT.Char.Custom('EagleStorySheHe')] não consegue segurar minha luva com a mesma firmeza de antes. Ao inspecionar a garra, sinto que está rachada, explicando os problemas recentes [ROOT.Char.Custom('EagleStoryHerHim')]."
 pet_animal.3030.desc_eye:0 "A precisão habitual de [ROOT.Char.Custom('EagleStoryName')] tem faltado, e um dos olhos [ROOT.Char.Custom('EagleStoryHerHim')] tem ficado fechado mais do que o normal. Suspeitando o pior, aceno minha mão na frente do olho afetado, e [ROOT.Char.Custom('EagleStorySheHe')] nem sequer se mexe! Parece estar deflacionado, o que explica os problemas recentes de [ROOT.Char.Custom('EagleStoryHerHim')]."
 pet_animal.3030.desc_intro:0 "Ultimamente, percebi que [ROOT.Char.Custom('EagleStoryName')] tem ficado bastante estressada."
 pet_animal.3030.desc_outro:0 "\n\nUma lesão pode piorar se não for tratada, mas como encontrarei a cura?"
 pet_animal.3030.desc_training:0 "Após nossa última sessão de treino, percebi algo estranho em [ROOT.Char.Custom('EagleStoryName')]."
 pet_animal.3030.desc_weak:0 "Isso me preocupa ainda mais, pois [ROOT.Char.Custom('EagleStorySheHe')] já estava doente."
 pet_animal.3030.desc_wing:0 "Algumas das penas de [ROOT.Char.Custom('EagleStoryNamePossessive')] sumiram, e [ROOT.Char.Custom('EagleStorySheHe')] não consegue voar tão alto como antes. Ao tocar suavemente na asa [ROOT.Char.Custom('EagleStoryHerHim')], posso sentir que ela está caindo mais do que o normal, explicando os problemas recentes [ROOT.Char.Custom('EagleStoryHerHim')]."
 pet_animal.3030.good:0 "Eles tratam a lesão da sua águia."
 pet_animal.3030.good_self:0 "Você trata com sucesso a lesão da sua águia."
 pet_animal.3030.none:0 "Devo deixar a natureza seguir seu curso."
 pet_animal.3030.nothing:0 "Nada do que eles fazem parece ajudar."
 pet_animal.3030.random_smart_courtier:0 "[random_smart_courtier.GetFirstName] é bastante conhecedor, talvez [random_smart_courtier.GetSheHe] possa ajudar."
 pet_animal.3030.self:0 "Eu sei como tratar essa doença."
 pet_animal.3030.t_claw:0 "Garra de [ROOT.Char.Custom('EagleStoryNamePossessive')]"
 pet_animal.3030.t_eye:0 "Olho de [ROOT.Char.Custom('EagleStoryNamePossessive')]"
 pet_animal.3030.t_wing:0 "Asa de [ROOT.Char.Custom('EagleStoryNamePossessive')]"
 pet_animal.3030.very_good:0 "Eles restauram sua águia à saúde total com sucesso."
 pet_animal.3030.very_good_self:0 "Você restaura sua águia à saúde total com sucesso."
 pet_animal.3040.desc:0 "Aos [ROOT.Char.MakeScope.Var('eagle_age_variable').GetValue] anos, [ROOT.Char.Custom('EagleStoryName')] se tornou um caçador bastante habilidoso, mas sempre há espaço para melhorias. Decido passar um tempo treinando [ROOT.Char.Custom('EagleStorySheHe')], para ver se [ROOT.Char.Custom('EagleStorySheHe')] pode se tornar ainda melhor, ou se eu posso aprender algo novo sobre [ROOT.Char.Custom('EagleStorySheHe')]."
 pet_animal.3040.diplomacy:0 "Eu vou ensinar [ROOT.Char.Custom('EagleStorySheHe')] mais sobre as pessoas."
 pet_animal.3040.intrigue:0 "Para ser um bom caçador, é preciso ser capaz de enganar a presa."
 pet_animal.3040.learning:0 "O conhecimento é poder, e [ROOT.Char.Custom('EagleStoryName')] será uma ave sábia."
 pet_animal.3040.martial:0 "Uma lição no campo de batalha nunca fez mal a nenhum caçador experiente."
 pet_animal.3040.money:0 "Posso gastar um pouco de dinheiro no desenvolvimento [ROOT.Char.Custom('EagleStoryHerHim')]."
 pet_animal.3040.money_tt:0 "Você contrata um treinador para ajudar"
 pet_animal.3040.none:0 "O aprimoramento [ROOT.Char.Custom('EagleStoryHerHim')] deve ser deixado ao acaso."
 pet_animal.3040.personality:0 "Você aprende mais sobre a #bold personalidade#! de [ROOT.Char.Custom('EagleStoryNamePossessive')]"
 pet_animal.3040.personality_bonus_diplomacy:0 "@skill_diplomacy_icon! #P Mais propenso#! com o treinamento em [diplomacy|E]"
 pet_animal.3040.personality_bonus_intrigue:0 "@skill_intrigue_icon! #P Mais propenso#! com o treinamento em [intrigue|E]"
 pet_animal.3040.personality_bonus_learning:0 "@skill_learning_icon! #P Mais propenso#! com o treinamento em [learning|E]"
 pet_animal.3040.personality_bonus_martial:0 "@skill_martial_icon! #P Mais propenso#! com o treinamento em [martial|E]"
 pet_animal.3040.personality_bonus_stewardship:0 "@skill_stewardship_icon! #P Mais propensa#! com o treinamento em [stewardship|E]"
 pet_animal.3040.personality_change:0 "A #bold personalidade#! de [ROOT.Char.Custom('EagleStoryNamePossessive')] muda"
 pet_animal.3040.personality_change_tooltip:0 "Sua águia ganha um novo traço de personalidade"
 pet_animal.3040.personality_less_effective:0 "A personalidade da sua águia está #N menos útil#!"
 pet_animal.3040.personality_level:0 "A personalidade #P mais útil#! de [ROOT.Char.Custom('EagleStoryNamePossessive')] é [ROOT.Char.Custom('EaglePersonalityTraitTooltip')]"
 pet_animal.3040.personality_new_aggressive:0 "[ROOT.Char.Custom('EagleStorySheHe')|U] é bastante feroz"
 pet_animal.3040.personality_new_brave:0 "[ROOT.Char.Custom('EagleStorySheHe')|U] é bastante ousada"
 pet_animal.3040.personality_new_calm:0 "[ROOT.Char.Custom('EagleStorySheHe')|U] não é uma criatura impaciente"
 pet_animal.3040.personality_new_cunning:0 "[ROOT.Char.Custom('EagleStorySheHe')|U] faz truques astutos com você"
 pet_animal.3040.personality_new_curious:0 "[ROOT.Char.Custom('EagleStorySheHe')|U] está intrigada com seu entorno"
 pet_animal.3040.personality_new_loyal:0 "[ROOT.Char.Custom('EagleStorySheHe')|U] fica ao seu lado"
 pet_animal.3040.personality_new_observant:0 "[ROOT.Char.Custom('EagleStorySheHe')|U] é extra perceptiva"
 pet_animal.3040.personality_new_protective:0 "[ROOT.Char.Custom('EagleStorySheHe')|U] se torna muito defensiva em relação a você"
 pet_animal.3040.personality_new_wise:0 "[ROOT.Char.Custom('EagleStorySheHe')|U] é mais inteligente comparado a outras aves"
 pet_animal.3040.stewardship:0 "[ROOT.Char.Custom('EagleStorySheHe')|U] saberá sobre as terras do nosso reino e como navegar por elas."
 pet_animal.3040.t:0 "Como Treinar Sua Águia"
 pet_animal.3040.training_bad:0 "[ROOT.Char.Custom('EagleStoryName')] perde um pouco de seu vigor"
 pet_animal.3040.training_bad_desc:0 "A sessão de treinamento vai mal"
 pet_animal.3040.training_bad_title:0 "Sessão de Treinamento Falhada"
 pet_animal.3040.training_good_desc:0 "A sessão de treinamento vai bem"
 pet_animal.3040.training_good_generic:0 "Você e [ROOT.Char.Custom('EagleStoryName')] se tornam um pouco mais habilidosos"
 pet_animal.3040.training_good_title:0 "Sessão de Treinamento Bem-Sucedida"
 pet_animal.3040.training_neutral:0 "Mas felizmente, [ROOT.Char.Custom('EagleStoryName')] não se machuca"
 pet_animal.3040.training_very_bad:0 "E [ROOT.Char.Custom('EagleStoryName')] se machuca no processo"
 pet_animal.3050.a.tt:0 "Você tenta prejudicar a águia de [rival.GetFirstNamePossessiveNoTooltip]"
 pet_animal.3050.b.flavor:0 "Nada de errado em roubar por uma boa causa"
 pet_animal.3050.b.tt:0 "Você tenta roubar a águia de [rival.GetFirstNamePossessiveNoTooltip] para [token_child.GetNameNoTooltip]"
 pet_animal.3050.b:0 "Vou pegar essa ave para [token_child.GetName]!"
 pet_animal.3050.bad:0 "A águia permanece ilesa"
 pet_animal.3050.c.tt:0 "O que é bom para o ganso é bom para o ganso"
 pet_animal.3050.c:0 "Eu poderia ganhar uma boa grana com [rival.Custom('EagleStoryName')]..."
 pet_animal.3050.c_tt:0 "Você tenta vender a águia do seu rival por uma boa quantia"
 pet_animal.3050.d:0 "Que fofo!"
 pet_animal.3050.desc:0 "Enquanto passo por [rival_home.GetName] em uma tarefa, avisto uma águia [rival.Custom('EaglePersonalityTraitTooltip')] em uma gaiola. Onde já vi essa ave antes...? Ah! É a águia de [Select_CString( rival.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('rival'))] [rival.GetTitledFirstNamePossessive], [rival.Custom('EagleStoryName')]!\n\nSinto um sorriso malicioso se espalhar pelo meu rosto enquanto ela canta para mim com um olhar penetrante."
 pet_animal.3050.good:0 "Você consegue causar danos a [rival.GetFirstNameNoTooltip]"
 pet_animal.3050.steal.tt:0 "Você tenta roubar a águia de [rival.GetFirstNamePossessiveNoTooltip]"
 pet_animal.3050.steal:0 "Vou pegar essa ave para mim!"
 pet_animal.3050.t:0 "A Águia do Inimigo"
 pet_animal.3060.a:0 "Espero que [token_child.GetFirstNameNoTooltip] se torne um grande caçador algum dia!"
 pet_animal.3060.a_girl:0 "[token_child.GetFirstNameNoTooltip] se tornará uma grande caçadora algum dia!"
 pet_animal.3060.decent:0 "As habilidades de falcoaria de [token_child.GetFirstNamePossessiveNoTooltip] poderiam melhorar um pouco"
 pet_animal.3060.desc:0 "Decido usar minha águia, [ROOT.Char.Custom('EagleStoryName')], para nos ajudar, assim [ROOT.Char.Custom('EagleStorySheHe')] pode ficar mais afeiçoado a [token_child.GetFirstNameNoTooltip]."
 pet_animal.3060.desc_child:0 "Felizmente, [token_child.GetSheHe] é um aprendiz rápido, já possuindo uma águia própria. [token_child.Custom('EagleStoryName')] é o nome [ROOT.Char.Custom('EagleStoryHerHim')], e [token_child.GetNameNoTooltip] já está bastante afeiçoado a [ROOT.Char.Custom('EagleStorySheHe')]."
 pet_animal.3060.desc_intro:0 "[token_child.GetName] cresceu para se tornar bastante [token_child.Custom('ComplimentAdjective')], e não poderia estar mais orgulhoso [token_child.GetHerHim]. Apesar das suas conquistas, [token_child.GetSheHe] enfrentará muitos problemas se não for ensinado a caçar corretamente.\n\n"
 pet_animal.3060.good:0 "[token_child.GetFirstNameNoTooltip] manuseia bem a águia"
 pet_animal.3060.t:0 "Uma Caçadora em Formação"
 pet_animal.3060.t_girl:0 "Uma Caçadora em Formação"
 pet_animal.3070.a:0 "Fico feliz que alguém goste disso."
 pet_animal.3070.desc:0 "Embora eu geralmente não mantenha minha águia à vista de outros, [ROOT.Char.Custom('EagleStorySheHe')] tem cantado alto a semana toda. Não querendo ouvir esse barulho incômodo o dia todo, o novo lar temporário [ROOT.Char.Custom('EagleStoryHerHim')] é no pátio.\n\nQuando vou verificar como [ROOT.Char.Custom('EagleStorySheHe')] está, encontro [target.GetName] ouvindo a melodia de [ROOT.Char.Custom('EagleStoryNamePossessive')]. \"Essa é a sua ave?\" [target.GetFirstNameNoTooltip] pergunta, e eu aceno com a cabeça sem muito entusiasmo.\n\n\"[ROOT.Char.Custom('RandomPositiveLookAdjective')|U]!\" [target.GetSheHe] exclama, embora eu não possa dizer que concordo."
 pet_animal.3070.t:0 "A Canção de [ROOT.Char.Custom('EagleStoryNamePossessive')]"
 pet_animal.3080.a:0 "Que... doce?"
 pet_animal.3080.desc:0 "Me vejo correndo atrás de [ROOT.Char.Custom('EagleStoryName')], que de repente fugiu de mim enquanto estávamos a cavalo. Quando finalmente consigo alcançá-la, [ROOT.Char.Custom('EagleStorySheHe')] está ocupada com uma criatura peluda e contorcendo-se nas garras [ROOT.Char.Custom('EagleStoryHerHim')]! Impressionado com a caça, deixo [ROOT.Char.Custom('EagleStorySheHe')] ficar com seu prêmio.\n\n\"SQUAWWW!\" [ROOT.Char.Custom('EagleStorySheHe')] grita enquanto deixa a criatura sem vida aos meus pés."
 pet_animal.3080.t:0 "O Presente de [ROOT.Char.Custom('EagleStoryNamePossessive')]"
 pet_animal.3199.a:0 "Sentirei sua falta, [ROOT.Char.Custom('EagleStoryName')]!"
 pet_animal.3199.desc:0 "Embora me doa dizer, as penas [ROOT.Char.Custom('EagleStoryHerHim')] ficaram opacas, e [ROOT.Char.Custom('EagleStorySheHe')] já não consegue mais voar com o vigor que tinha antes."
 pet_animal.3199.desc_dying:0 "Com a saúde [ROOT.Char.Custom('EagleStoryHerHim')] se deteriorando, sei que [ROOT.Char.Custom('EagleStorySheHe')] não estará comigo por muito mais tempo."
 pet_animal.3199.desc_intro:0 "[ROOT.Char.Custom('EagleStoryName')] voou ao meu lado por muitos anos, e o tempo não poupou [ROOT.Char.Custom('EagleStorySheHe')]."
 pet_animal.3199.desc_outro:0 "\n\nRetiro o capuz dos olhos [ROOT.Char.Custom('EagleStoryHerHim')], e libero [ROOT.Char.Custom('EagleStorySheHe')] para o céu. [ROOT.Char.Custom('EagleStorySheHe')|U] alça voo alto, e depois mais alto ainda, mas sei que [ROOT.Char.Custom('EagleStorySheHe')] não voltará."
 pet_animal.3199.t:0 "[ROOT.Char.Custom('EagleStoryName')]: Último Voo"
 pet_animal.5001.a.tt:0 "É apenas um rápido golpe de faca"
 pet_animal.5001.a:0 "#EMP Psst psst#! – Eu não vou machucar você..."
 pet_animal.5001.b:0 "Vou fazer carinho no gato daquele imbecil!"
 pet_animal.5001.desc:0 "Enquanto passo por [rival_home.GetName] em uma missão, sou abordado por um gato [rival.Custom('CatFurColor')]. Onde eu já vi esse gato antes...? Ah! É o gato [rival.Custom('CatStoryName')] de [rival.GetTitledFirstNamePossessive], m[Select_CString( rival.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival'))]!\n\nEnquanto ele mia para mim e ronrona, sinto um sorriso maligno se espalhar pelo meu rosto."
 pet_animal.5001.t:0 "O Gato do Inimigo"
 pet_animal.5002.a:0 "Venha aqui, eu não vou machucar você..."
 pet_animal.5002.b:0 "Vou fazer carinho no cachorro daquele imbecil!"
 pet_animal.5002.desc:0 "Enquanto passo por [rival_home.GetName] em uma missão, sou abordado por um cachorro [rival.Custom('DogFurColor')]. Onde eu já vi esse cachorro antes...? Ah! É o cachorro [rival.Custom('DogStoryName')] de [rival.GetTitledFirstNamePossessive], m[Select_CString( rival.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival'))]!\n\nSinto um sorriso maligno se espalhar pelo meu rosto enquanto ele late feliz para mim com o rabo abanando."
 pet_animal.5002.t:0 "O Cachorro do Inimigo"
 pet_animal.6001.a:0 "Obrigado, meu amigo!"
 pet_animal.6001.desc:0 "Ao acariciar os pelos [ROOT.Char.Custom('DogFurColor')] de [ROOT.Char.Custom('DogStoryName')] sinto minhas preocupações se dissiparem. Ter a lealdade inabalável de alguém e saber que eles sempre ficarão ao meu lado... Se ao menos as pessoas ao meu redor fossem mais como você, [ROOT.Char.Custom('DogStoryName')]!\n\nSentamos juntos por muitos minutos, seu rabo balançando e meus ombros relaxando, até eu estar pronto para enfrentar o mundo novamente."
 pet_animal.6001.t:0 "Acariciando [ROOT.Char.Custom('DogStoryName')|U]"
 pet_animal.6002.desc:0 "Encontro [ROOT.Char.Custom('DogStoryName')] do lado de fora, brincando com algumas crianças. Assim que [ROOT.Char.Custom('DogStorySheHe')] me avista, [ROOT.Char.Custom('DogStorySheHe')] corre rapidamente até mim com o rabo balançando. Ao me abaixar, [ROOT.Char.Custom('DogStorySheHe')] logo se joga de costas.\n\nPasso muitos minutos acariciando a barriga [ROOT.Char.Custom('DogStoryHerHim')], e faz tempo desde que me senti tão relaxado."
 pet_animal.6003.a:0 "Bom cachorrinho, [ROOT.Char.Custom('DogStoryName')]. #EMP Bom cachorrinho!#!"
 pet_animal.6003.b:0 "[neighboring_ruler.GetTitledFirstNameNoTooltip] ficará radiante por recuperar isso!"
 pet_animal.6003.desc:0 "Ao sair, vejo [ROOT.Char.Custom('DogStoryName')] correndo em minha direção, carregando um graveto na boca. Suponho que posso dedicar alguns minutos para brincar de buscar com [ROOT.Char.Custom('DogStorySheHe')]. Sim, isso seria relaxante.\n\n#EMP Espere um minuto, o que é isso?#!\n\nAo me abaixar para pegar o graveto, vejo que não é um graveto de verdade, mas uma #EMP reivindicação do [target_county.GetName]!#! Como diabos você conseguiu isso, [ROOT.Char.Custom('DogStoryName')]!?"
 pet_animal.6004.a:0 "Isso... Deve ter sido um engano!"
 pet_animal.6004.b:0 "Seu #EMP monstro#!"
 pet_animal.6004.desc:0 "Encontro [ROOT.Char.Custom('DogStoryName')] do lado de fora, cochilando ao sol. Me abaixo ao lado [ROOT.Char.Custom('DogStoryHerHim')] e deixo minha mão passar pelos pelos [ROOT.Char.Custom('DogFurColor')], e–\n\nMeu único aviso é um rosnado baixo e um lampejo de dentes antes de sentir algo #EMP rasgar#! em meu braço. Me afasto rapidamente antes que [ROOT.Char.Custom('DogStorySheHe')] possa me atacar novamente, mas a dor...!"
 pet_animal.6051.desc:0 "Encontro [ROOT.Char.Custom('CatStoryName')] dormindo em meus aposentos, e ao me sentar ao lado [ROOT.Char.Custom('CatStoryHerHim')] sou saudado por um miado suave e confuso.\n\nNo entanto, ao começar a passar meus dedos pelos pelos [ROOT.Char.Custom('CatFurColor')], [ROOT.Char.Custom('CatStorySheHe')] rapidamente começa a ronronar de contentamento, e o som parece relaxar todo o meu ser."
 pet_animal.6051.t:0 "Acariciando [ROOT.Char.Custom('CatStoryName')|U]"
 pet_animal.6052.desc:0 "Encontro [ROOT.Char.Custom('CatStoryName')] do lado de fora, passeando pelo quintal. Assim que [ROOT.Char.Custom('CatStorySheHe')] me avista, [ROOT.Char.Custom('CatStorySheHe')] mia e se aproxima, esfregando-se em minha perna.\n\nPasso muitos minutos agachado ao lado [ROOT.Char.Custom('CatStoryHerHim')], acariciando [ROOT.Char.Custom('CatStorySheHe')] e coçando [ROOT.Char.Custom('CatStorySheHe')] embaixo do queixo, e quando me levanto novamente, sinto-me mais leve do que há muito tempo."
 pet_animal.eagle_unweak_title:0 "A saúde de [ROOT.Char.Custom('EagleStoryNamePossessive')] melhora"
 pet_animal.eagle_weak_title:0 "A saúde de [ROOT.Char.Custom('EagleStoryNamePossessive')] piora"
 rival_stole_from_me_eagle:0 "[CHARACTER.GetShortUIName|U] tentou roubar a águia de caça de [TARGET_CHARACTER.GetNamePossessive]."
 rival_stole_from_me_eagle_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] tentou roubar a águia de caça de [CHARACTER.GetNamePossessive]."
