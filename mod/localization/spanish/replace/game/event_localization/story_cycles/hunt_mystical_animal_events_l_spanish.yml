l_spanish:
 hunt_mystical_animal.1001.a:0 "Em breve não escapará de mim!"
 hunt_mystical_animal.1001.desc:0 "A fera elusiva vem até mim em um sonho, a profundidade escura de seus olhos me julgando enquanto [ROOT.Char.Custom('GetAnimalChargePresent')] ao redor, exibindo seu imaculado pelo [ROOT.Char.Custom('GetLegendaryColor')].\n\nEstamos parados no silencioso [legendary_county.GetCountyData.GetCapital.Custom('GetTerrainTypePlural')] sob uma lua inchada. Não importa o quanto eu tente, não consigo me aproximar mais da minha presa.\n\nEnquanto eu me desperto, sinto minha determinação se fortalecendo..."
 hunt_mystical_animal.1001.t:0 "[ROOT.Char.Custom('GetAnimalType')|U] [ROOT.Char.Custom('GetLegendaryColor')]"
 hunt_mystical_animal.1002.a:0 "Ela me provoca!"
 hunt_mystical_animal.1002.desc:0 "Cavalgando pelas [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] de [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip], chegamos a uma curva na estrada e eu a vejo mais uma vez, reluzindo ao sol — [ROOT.Char.Custom('GetAnimalType')] [ROOT.Char.Custom('GetLegendaryColor')].\n\nMe viro para alertar os outros, mas quando olho de volta o(a) [ROOT.Char.Custom('GetAnimalType')] já desapareceu..."
 hunt_mystical_animal.1003.a:0 "Contratarei pessoas para procurá-lo!"
 hunt_mystical_animal.1003.b.tt:0 "Abandone sua busca #V pelo(a) [THIS.Char.Custom('GetAnimalType')] [THIS.Char.Custom('GetLegendaryColor')]#!"
 hunt_mystical_animal.1003.b:0 "Essa tarefa é grande demais. Não farei isso."
 hunt_mystical_animal.1003.c:0 "Meu [steward.GetCouncilTitle] cuidará disso."
 hunt_mystical_animal.1003.d:0 "Eu posso fazer isso. Eu #EMP devo#!"
 hunt_mystical_animal.1003.desc:0 "Desde que comecei minha busca, relatos de avistamentos do(a) [ROOT.Char.Custom('GetAnimalType')] [ROOT.Char.Custom('GetLegendaryColor')] têm chegado de todos os cantos do [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nSeparar os relatos verdadeiros dos fictícios é uma tarefa enorme. Se ao menos os relatos fossem mais confiáveis..."
 hunt_mystical_animal.1003.e:0 "[m_hunt.GetTitledFirstNameNoTooltip], organize um grupo de busca!"
 hunt_mystical_animal.1004.a.success:0 "Você encontra um(a) #V [THIS.Char.Custom('GetAnimalType')] [THIS.Char.Custom('GetLegendaryColor')]#!"
 hunt_mystical_animal.1004.a.tt:0 "Desta vez não escapará de mim."
 hunt_mystical_animal.1004.a:0 "Vamos cavalgar!"
 hunt_mystical_animal.1004.b:0 "Não permitirei que me manipule assim."
 hunt_mystical_animal.1004.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [m_hunt.GetTitledFirstName] mal pode conter a emoção, \"Temos relatos de pessoas avistando um(a) [ROOT.Char.Custom('GetAnimalType')] [ROOT.Char.Custom('GetLegendaryColor')] nas [legendary_county.GetCountyData.GetCapital.Custom('GetTerrainTypePlural')] de [legendary_county.GetCountyData.GetCapital.GetNameNoTooltip]!\"\n\n\"Alguns afirmam que a doença segue em seu rastro, outros que ela traz prosperidade, mas todos parecem bem certos de que está na área.\"\n\nEstá aqui? Em [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]?!?"
 hunt_mystical_animal.1005.a:0 "Maldição! Eu #EMP vou#! pegar você, criatura!"
 hunt_mystical_animal.1005.desc:0 "\n\nNum piscar de olhos, [activity.Custom('GetAnimalType')] [activity.Custom('GetAnimalChargePresent')] para longe, desaparecendo na [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]."
 hunt_mystical_animal.1006.a:0 "EU VOU PEGAR VOCÊ, CRIATURA!"
 hunt_mystical_animal.1006.b:0 "Você! Agora você é o(a) [ROOT.Char.Custom('GetAnimalType')] [ROOT.Char.Custom('GetLegendaryColor')]! Volte aqui!"
 hunt_mystical_animal.1006.desc:0 "Eu olho para fora, na névoa da manhã, e vejo um(a) [ROOT.Char.Custom('GetAnimalType')] [ROOT.Char.Custom('GetLegendaryColor')] sentado nos limiares das [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')], #EMP zombando#! de mim.\n\nVirando-me, me deparo com o tecido das minhas colchas e, tentando me afastar delas, tropeço em uma cabeça de [ROOT.Char.Custom('GetAnimalType')] montada em uma viga.\n\nFecho os olhos, mas não há escapatória. O(a) [ROOT.Char.Custom('GetAnimalType')] [ROOT.Char.Custom('GetLegendaryColor')] está lá – rindo de mim!"
 hunt_mystical_animal.1007.a:0 "Não importa em que buraco você se esconda, eu vou te encontrar!"
 hunt_mystical_animal.1007.b.failure:0 "Ah, estou me sentindo um pouco enjoado..."
 hunt_mystical_animal.1007.b.success:0 "Delicioso!"
 hunt_mystical_animal.1007.b:0 "Ah, esses cogumelos... Parecem apetitosos."
 hunt_mystical_animal.1007.desc:0 "Eu vasculho a terra em busca de um(a) [activity.Custom('GetAnimalType')] [activity.Custom('GetLegendaryColor')] elusiva, desbravando a natureza de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] — não vou deixá-la escapar desta vez!\n\nEnquanto sigo as trilhas até a [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTree')], cada vez mais profundo na vegetação, as coisas começam a mudar de forma.\n\nVejo cogumelos do tamanho de [ROOT.Char.Custom('ResidenceBuildingPlural')], árvores do tamanho de ratos e lagartas do tamanho de cavalos."
 hunt_mystical_animal.1008.a:0 "Envie um comunicado!"
 hunt_mystical_animal.1008.b:0 "Não vou me rebaixar a isso."
 hunt_mystical_animal.1008.c:0 "Enviarei [knight.GetFirstNameNoTooltip]."
 hunt_mystical_animal.1008.desc:0 "À medida que os dias passam, não ouço nada sobre o(a) [ROOT.Char.Custom('GetAnimalType')] [ROOT.Char.Custom('GetLegendaryColor')], e fico inquieto...\n\nCertamente alguém deve tê-lo visto? E quanto a todos os camponeses que vagueiam pelas [legendary_county.GetCountyData.GetCapital.Custom('GetTerrainTypePlural')]? Talvez eu deva apelar para a ajuda deles..."
 hunt_mystical_animal.1009.a.failure:0 "\"Sobre o que você está falando?!\""
 hunt_mystical_animal.1009.a.success:0 "\"Você pode estar certo...\""
 hunt_mystical_animal.1009.a:0 "[ROOT.Char.Custom('GetAnimalType')|U] é um mensageiro de [ROOT.Char.GetFaith.HighGodName]!"
 hunt_mystical_animal.1009.b:0 "Isso não é da sua conta."
 hunt_mystical_animal.1009.c:0 "Você está certo, no que eu estava pensando?"
 hunt_mystical_animal.1009.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], essa busca sua por uma mera criatura... Tenho que admitir que isso me preocupa.\"\n\n[court_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima enquanto examino os avistamentos relatados de um(a) [ROOT.Char.Custom('GetAnimalType')] [ROOT.Char.Custom('GetLegendaryColor')].\n\n\"Evidentemente, qualquer coisa que distraia tanta atenção poderia ter sido enviada por [ROOT.Char.GetFaith.DevilName]; não assuma que sua existência seja um sinal de [ROOT.Char.GetFaith.HighGodNameAlternate]!\""
 hunt_mystical_animal.9001.a:0 "... e deixo a flecha voar."
 hunt_mystical_animal.9001.desc:0 "Sigo as pegadas cada vez mais fundo nas [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] quando o ar subitamente se aquieta ao meu redor.\n\nComo se nascida do próprio ar, [activity.Custom('GetAnimalType')] [activity.Custom('GetLegendaryColor')] fica diante de mim, pelagem reluzindo na luz do sol, olhos profundos como sonhos. Ergo meu arco..."
 hunt_mystical_animal.9002.a:0 "Isso deve ser uma piada...!"
 hunt_mystical_animal.9002.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [m_hunt.GetTitledFirstName] se aproxima hesitante, \"Um camponês local enviou um presente para você. [dummy_gender.GetSheHe|U] afirma que essa coloração [activity.Custom('GetLegendaryColor')] é natural, mas nunca vi nada parecido!\"\n\nCom crescente apreensão, me aproximo do pacote — e lá está: [activity.Custom('GetAnimalType')] [activity.Custom('GetLegendaryColor')] que passei anos caçando."
 start_hunt_mystical_animal_story_cycle_effect.tt:0 "#EMP Não descansarei até encontrá-lo!#!"
