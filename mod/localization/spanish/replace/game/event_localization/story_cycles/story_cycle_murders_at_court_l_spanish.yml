l_spanish:
 murder_at_court_movement_restricted_courtiers:0 "Cada cortesão"
 murder_at_court_movement_restricted_courtiers_craven:0 "Cada cortesão covarde"
 murder_at_court_movement_restricted_courtiers_other:0 "Cada outro cortesão"
 murders_at_court.1001.a:0 "Vou rezar pela vítima."
 murders_at_court.1001.b.tt:0 "Vou limitar os movimentos de todos na corte — esperançosamente, pressionando o assassino a se revelar."
 murders_at_court.1001.b:0 "Certifique-se de que todos estejam presentes, o tempo #EMP todo#!."
 murders_at_court.1001.c.tt:0 "Guardas extras certamente dissuadirão o assassino – ou pelo menos o impedirão."
 murders_at_court.1001.c:0 "Dobre a guarda!"
 murders_at_court.1001.d.tt:0 "Divulgarei por todo o reino que estou procurando por informações e pistas."
 murders_at_court.1001.d:0 "Alguém viu algo? Por favor, eu preciso de sua ajuda!"
 murders_at_court.1001.desc:0 "\"Partes de um corpo foram encontradas esta manhã, [ROOT.Char.Custom('FormOfAddressForLiege')],\" diz um guarda, gesticulando para a mesa à nossa frente. Piscinas de sangue rodeiam pequenos montes de carne; fios de tecido repousam em uma poça escura.\n\n\"Como você pode ver, não é um corpo inteiro... humano. Não o suficiente para identificá-los.\""
 murders_at_court.1001.desc_physician:0 "\"Partes de um corpo foram encontradas esta manhã, [ROOT.Char.Custom('FormOfAddressForLiege')],\" diz [physician.Custom2('MyCharacterIntroduction', ROOT.Char)], gesticulando para a mesa à nossa frente. Piscinas de sangue rodeiam pequenos montes de carne; fios de tecido repousam em uma poça escura.\n\n\"Como você pode ver, não é um corpo inteiro... humano. Não o suficiente para identificá-los.\""
 murders_at_court.1001.e.tt:0 "Aplicarei meu conhecimento neste caso."
 murders_at_court.1001.e:0 "Vou investigar isso. Pessoalmente."
 murders_at_court.1001.t:0 "Assassinatos na Corte: Reze pelos Mortos Sem Nome"
 murders_at_court.1002.desc:0 "Outro dia, outro corpo. É com o coração pesado que percebo que um senso de rotina se instalou no [ROOT.Char.Custom('ResidenceBuilding')] após os assassinatos recentes.\n\nO corpo — uma jovem [ROOT.Char.Custom('RandomWomanMan')] eviscerada — é rapidamente removido, e até o pôr do sol, nenhum vestígio do ato macabro pode ser encontrado."
 murders_at_court.1002.desc_named:0 "Ao nascer do sol, sou saudado com a notícia de que [victim.Custom2('MyCharacterIntroduction', ROOT.Char)] foi assassinado durante a noite. Brutalmente eviscerado e disposto para ser visto por quem quer que passasse...\n\nO corpo é rapidamente removido, e até o pôr do sol, nenhum vestígio do ato macabro pode ser encontrado."
 murders_at_court.1002.t:0 "Assassinatos na Corte: Assassinato pela Manhã"
 murders_at_court.1003.desc:0 "Eu caio no chão, segurando [spouse.GetSheHe] no meu peito."
 murders_at_court.1003.desc_end:0 "– [spouse.GetSheHe] está tão fri[Select_CString( spouse.IsFemale, 'a', 'o' )]... Oh [ROOT.Char.GetFaith.HighGodName], por que [spouse.GetSheHe] está tão fri[Select_CString( spouse.IsFemale, 'a', 'o' )]?!"
 murders_at_court.1003.desc_like:0 "Gritando, eu caio no chão, segurando [spouse.GetSheHe] no meu peito."
 murders_at_court.1003.desc_opening:0 "Eu encontro [spouse.GetTitledFirstName] em nossos aposentos, estendid[Select_CString( spouse.IsFemale, 'a', 'o' )] no chão em uma poça de sangue [spouse.GetHerHim]."
 murders_at_court.1003.t:0 "Assassinatos na Corte: Até Que a Morte Nos Separe"
 murders_at_court.1004.desc:0 "Eu encontro m[Select_CString( child.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child'))] [child.GetTitledFirstName] em sua própria cama — frio e morto. A roupa de cama está saturada de sangue, e o gotejar lento e constante de sangue atingindo o chão abaixo da cama parece ecoar na câmara."
 murders_at_court.1004.t:0 "Assassinatos na Corte: Meu Filho"
 murders_at_court.2001.desc:0 "M[Select_CString( victim.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim'))] [victim.GetTitledFirstName] está deitad[Select_CString( victim.IsFemale, 'a', 'o' )] no chão frio, sangue escorrendo dos múltiplos ferimentos de faca que cobrem seu corpo.\n\nPor que esse assassino está me provocando assim?!"
 murders_at_court.2001.t:0 "Assassinatos na Corte: Escalada"
 murders_at_court.2002.a:0 "Eu devo rezar por nosso [ROOT.Char.Custom('RealmType')]!"
 murders_at_court.2002.desc:0 "A cabeça decapitada [Select_CString( heir.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))] [heir.GetTitledFirstName] está descansando em minha mesa quando volto para meus aposentos, boca aberta em um grito silencioso. Meu herdeiro [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('heir'))]... Oh [ROOT.Char.GetFaith.HighGodName], por quê? Esse assassino nos atormentando precisa ser detido!"
 murders_at_court.2002.t:0 "Assassinatos na Corte: Um Passo à Frente"
 murders_at_court.2003.a:0 "[murderer.GetFirstNameNoTooltip]... Por quê...?"
 murders_at_court.2003.desc:0 "Uma dor aguda em minhas costas— Eu respiro, e a crescente agonia me faz gritar. Enquanto tento me virar, afundo, seguindo o gotejamento constante do meu sangue até o chão.\n\nMinha visão está se tornando escura, mas vejo m[Select_CString( murderer.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murderer'))] [murderer.GetTitledFirstName] de pé sobre mim com um largo sorriso. Tento alcançar [murderer.GetSheHe] e [murderer.GetSheHe] me retribui com um chute que faz o quarto girar; rodopio e rodopio– luz e escuridão, e mais escura, e mais escura..."
 murders_at_court.2003.t:0 "Assassinatos na Corte: Um Assassino Revelado"
 murders_at_court.2101.desc:0 "[other_heir.GetSheHe|U] parece mais surpres[Select_CString( other_heir.IsFemale, 'a', 'o' )] do que assustad[Select_CString( other_heir.IsFemale, 'a', 'o' )]... Talvez [other_heir.GetSheHe] conhecesse o assassino?"
 murders_at_court.2101.desc_family:0 "Ajoelho-me ao lado [other_heir.GetHerHim], segurando uma bochecha fria em minha mão – seus olhos estão arregalados, mas de surpresa em vez de horror. \"Será que alguém que você conhece fez isso com você?\""
 murders_at_court.2101.desc_opening:0 "Encaro o corpo sem vida [Select_CString( other_heir.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other_heir'))] [other_heir.GetTitledFirstName] e sinto tontura. Certamente é meu sangue que está revestindo o chão abaixo [other_heir.GetHerHim], pois nenhum dele está alcançando meu cérebro.\n\n"
 murders_at_court.2101.t:0 "Assassinatos na Corte: Herdeiro Assassinado"
 murders_at_court.2201.desc:0 "\"Mas... os olhos se foram! Arrancados como pedras em um campo!\" O [ROOT.GetCharacter.Custom('lowly_servant_type')] que encontrou a mais recente vítima do assassino é retirado – o rosto pálido, mãos tremendo e ainda gritando.\n\nAo olhar para os buracos vermelhos e cegos que deveriam conter olhos, arrepio-me com desconforto. Para que o assassino precisa de olhos? Algum tipo de ritual?"
 murders_at_court.2201.t:0 "Assassinatos na Corte: O Invisível"
 murders_at_court.5001.a:0 "Posso usar toda ajuda possível!"
 murders_at_court.5001.c:0 "Isso não tem nada a ver com você!"
 murders_at_court.5001.desc:0 "Um homem curioso me procurou após ouvir falar dos assassinatos que assolam minha corte.\n\n\"Eu sou [watson.GetTitledFirstName], [ROOT.Char.Custom('FormOfAddressForLiege')]. Acho que posso ser de ajuda para você.\""
 murders_at_court.5001.t:0 "Assassinatos na Corte: O Assistente"
 murders_at_court.8001.a:0 "Que você descanse em paz, [story_owner.GetFirstNameNoTooltip]."
 murders_at_court.8001.desc:0 "Enquanto damos o último adeus a [story_owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], juro que encontrarei aquele que fez isso a [story_owner.GetSheHe]. O assassino parece ter parado sua onda de crimes, e tenho que me perguntar se [Select_CString( story_owner.IsFemale, 'a', 'o' )] [story_owner.GetTitleAsNameNoTooltip] era o alvo desde o início..."
 murders_at_court.8001.t:0 "Assassinatos na Corte: Memento Mori"
 murders_at_court.8002.a:0 "Como governar o [ROOT.Char.Custom('RealmType')]!"
 murders_at_court.8002.desc:0 "Enquanto damos o último adeus a [story_owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], mal consigo conter minha risada; a expressão que [story_owner.GetSheHe] fez no final foi impagável! Um[Select_CString( story_owner.IsFemale, 'a', '' )] [story_owner.GetWomanMan] [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('story_owner'))], dizem– pfth.\n\nPelo menos as coisas deveriam se acalmar agora que o temido assassino está ocupado com outras coisas."
 murders_at_court.8003.a:0 "Que a maldição que assolou a corte tenha morrido com [predecessor.GetSheHe]."
 murders_at_court.8003.desc:0 "[predecessor.GetTitledFirstName] frequentemente falava sobre os assassinatos que atormentavam a corte; assassinatos cruéis e horripilantes.\n\nCada medida que [predecessor.GetSheHe] tomou para conter os assassinatos foi mantida, e só posso esperar que seja o suficiente..."
 murders_at_court.8003.t:0 "Assassinatos na Corte: Herança"
 murders_at_court.9001.a.tt:0 "Vou confrontar [murderer.GetTitledFirstNameNoTooltip] sobre isso"
 murders_at_court.9001.a:0 "Será que pode ser...?"
 murders_at_court.9001.b.tt:0 "Qual é o pior que pode acontecer?"
 murders_at_court.9001.b:0 "Acho que esses assassinatos permanecerão sem solução."
 murders_at_court.9001.c.tt:0 "Não acho que seja tão simples assim..."
 murders_at_court.9001.c:0 "[watson.GetFirstNameNoTooltip], o que você acha?"
 murders_at_court.9001.desc_cannibal:0 "#EMP Você não entende. Eu preciso disso para viver, para sobreviver, para encontrar #EMP alimento#!. Encerre esta busca imediatamente ou minha fome devorará tudo!#!"
 murders_at_court.9001.desc_ending:0 "\n\nEsta caligrafia... Ela se parece muito com a de [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
 murders_at_court.9001.desc_fallback:0 "#EMP Você interromperá esta busca imediatamente. Nada de bom pode surgir ao revelar minha identidade, e farei questão de que nada de bom venha a você se continuar tentando.#!"
 murders_at_court.9001.desc_heir:0 "#EMP Pelo bem do [ROOT.Char.Custom('RealmType')], você interromperá esta busca. Eu vivi minha vida inteira bem debaixo do seu nariz, e ainda assim você é tão cego. Revelar minha identidade só lhe traria dor.#!"
 murders_at_court.9001.desc_opening:0 "Uma carta está esperando por mim quando volto aos meus aposentos, escrita com tinta vermelha — não, com #EMP sangue#!.\n\n"
 murders_at_court.9001.desc_opening_watson:0 "Uma carta está esperando por mim e [watson.GetTitledFirstName] quando nos recolhemos aos meus aposentos, escrita com tinta vermelha — não, com #EMP sangue#!.\n\n"
 murders_at_court.9001.desc_rival:0 "#EMP Tornei minha missão de vida #EMP acabar#! com você — acabar com sua família e seu reinado. Nada que você faça pode me fazer parar, mas se você não interromper essa intromissão, me forçará a cometer atos ainda mais sombrios.#!"
 murders_at_court.9001.desc_vassal:0 "#EMP Pelo bem do [ROOT.Char.Custom('RealmType')], você interromperá esta busca. Sou necessário– #EMP valorizado#!, e você só se arrependerá se descobrir minha identidade.#!"
 murders_at_court.9001.desc_witch:0 "#EMP Você acha que sua intromissão pode realizar algo? As forças sombrias já estão em movimento, e ao se colocar no meu caminho, você só coloca a si mesmo e aqueles que você ama em perigo.#!"
 murders_at_court.9001.t:0 "Assassinatos na Corte: Uma Confrontação"
 murders_at_court.9002.a:0 "Pensar que um monstro desses anda livre..."
 murders_at_court.9002.desc:0 "Encontro [the_one_to_kill.Custom2('MyCharacterIntroduction', ROOT.Char)] pendurado do lado de fora do meu [ROOT.Char.Custom('ResidenceBuilding')]. O corpo de [the_one_to_kill.GetHerHim|U] está frio, pálido, imóvel... Mas o que é isso? Um pequeno bilhete foi enfiado nas dobras das roupas [the_one_to_kill.GetHerHim]!\n\n#EMP Esta é minha última vítima – meu último presente para você, [ROOT.Char.GetTitledFirstNameNoTooltip]. Mas não tema, ainda estarei por perto, te observando.#!"
 murders_at_court.9002.t:0 "Assassinatos na Corte: Consequências"
 murders_at_court.9003.a:0 "Você será punido por seus crimes!"
 murders_at_court.9003.b:0 "Olho por olho, vida por vida...!"
 murders_at_court.9003.c:0 "Vá em frente, [murderer.GetTitledFirstNameNoTooltip]."
 murders_at_court.9003.d:0 "Deve ser entediante cometer esses atos sozinho..."
 murders_at_court.9003.e:0 "Oh... Eu– Eu sinto muito."
 murders_at_court.9003.t:0 "Assassinatos na Corte: Legado Sombrio"
 murders_at_court.9004.desc:0 "\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip], [victim.GetTitledFirstName] e [murderer.GetTitledFirstName] desapareceram.\"\n\nFaco um gesto para o guarda e vejo o mesmo alarme nos olhos de [watson.GetTitledFirstNamePossessive] que sinto nos meus; [murderer.GetTitledFirstNameNoTooltip] pode estar..."
 murders_at_court.9004.desc_ending:0 "\n\nQuando finalmente encontramos [murderer.GetTitleAsNameNoTooltip], [murderer.GetSheHe] está avançando em direção a [victim.GetTitledFirstName], faca na mão.\n\n\"Pare aí mesmo!\""
 murders_at_court.9004.desc_letter_event:0 "[watson.GetTitledFirstName] e eu passamos muitas horas examinando a carta. Mas esse cheiro... Oh, ele cheira como m[Select_CString( murderer.IsFemale, 'inha', 'eu' )] [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] [murderer.GetTitledFirstName]!"
 murders_at_court.9004.t:0 "Assassinatos na Corte: Pego em Flagrante"
 murders_at_court.9021.desc:0 "Quando meus guardas e eu finalmente encontramos [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)], [murderer.GetSheHe] está ajoelhad[Select_CString( murderer.IsFemale, 'a', 'o' )] de joelhos nus na frente de um antigo tomo, testa pressionada contra o chão e braços levantados acima de sua cabeça em um ângulo quase sobrenatural.\n\n"
 murders_at_court.9021.t:0 "Assassinatos na Corte: Magia Sombria"
 murders_at_court.9031.desc:0 "Quando meus guardas e eu finalmente encontramos [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)], [murderer.GetSheHe] está roendo o que parece ser um dedo humano #EMP#!."
 murders_at_court.9031.t:0 "Assassinatos na Corte: A Fome"
 murders_at_court.9041.a:0 "Todos saberão de suas más ações!"
 murders_at_court.9041.b:0 "É melhor manter isso em segredo..."
 murders_at_court.9041.desc:0 "uma carta zombando dos meus esforços. [Select_CString( murderer.IsFemale, 'A própria', 'O próprio' )] [murderer.GetTitledFirstNameNoTooltip] não está em lugar algum."
 murders_at_court.9041.desc_cannibal:0 "pedaços de ossos que parecem ter sido roídos, e"
 murders_at_court.9041.desc_opening:0 "A única coisa que me espera quando finalmente encontro [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] é"
 murders_at_court.9041.desc_witch:0 "pedaços de ossos, algo que parece suspeitosamente com olhos humanos, e"
 murders_at_court.9041.t:0 "Assassinatos na Corte: Escapou"
 murders_at_court.9099.desc:0 "\"Olá, [ROOT.Char.GetFirstNameNoTooltip],\" [murderer.GetSheHe] diz, me olhando de cima a baixo. \"Já estava na hora de você me encontrar. Acho que você gostou dos meus... #EMP presentes#!?\"\n\n O sorriso que se espalha pelo rosto [murderer.GetHerHim] me faz tremer."
 murders_at_court.9099.desc_nothing:0 "Quando finalmente encontro [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)], [murderer.GetSheHe] nem tenta fugir de mim e dos guardas.\n\n"
 murders_at_court.9099.desc_wrong:0 "Quando finalmente encontro [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)], [murderer.GetSheHe] nem tenta fugir. Na verdade, [murderer.GetSheHe] me olha com total confusão.\n\n\"Finalmente encontrei você, assassino!\"\n\n\"Desculpe, o quê? Você acha que #EMP eu#! assassinei todas aquelas pessoas?!"
 murders_at_court.9099.t:0 "Assassinatos na Corte: Negócios Sangrentos"
 murders_at_court.9099.t_wrong:0 "Assassinatos na Corte: O Erro"
 murders_at_court.9989.a:0 "Vou ficar de olho nele."
 murders_at_court.9989.desc:0 "Entretanto, não posso deixar de notar que os assassinatos pararam assim que [murderer.GetTitledFirstName] deixou a corte..."
 murders_at_court.9999.a:0 "Agora que [murderer.GetSheHe] se foi, talvez eu nunca saiba com certeza..."
 murders_at_court.9999.desc:0 "Entretanto, não posso deixar de notar que os assassinatos pararam assim que [murderer.GetTitledFirstName] morreu..."
 murders_at_court.9999.desc_opening:0 "Com o tempo passando e nenhum corpo novo aparecendo, gradualmente relaxo novamente. O assassino parou!\n\n"
 murders_at_court.9999.t:0 "Assassinatos na Corte: Uma Maldição Levantada"
