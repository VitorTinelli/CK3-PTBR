l_spanish:
 bell_discovery_failure_effect:0 "O Sino é descoberto"
 bell_discovery_success_effect:0 "O Sino é mantido em segredo"
 bell_special_yearly.1000.a.tt:0 "Você se aproxima sorrateiramente de [faction_member_1.GetTitledFirstName] e tenta matar [faction_member_1.GetSheHe]"
 bell_special_yearly.1000.a:0 "Eu poderia matar [faction_member_1.GetSheHe] sem que ninguém visse!"
 bell_special_yearly.1000.b:0 "Devo me afastar silenciosamente."
 bell_special_yearly.1000.desc:0 "Meu [steward.GetCouncilTitle] [steward.GetFirstName] sugeriu que eu inspecionasse uma igreja abandonada nas proximidades da época dos visigodos.\n\nNo meio do teto abobadado e dos arcos de ferradura, há uma torre de sino que um dia foi bela, com vários sinos em ruínas faltando seus badalos.\n\nEnquanto eu perambulo pelas ruínas, ouço um ruído de cascos. Olhando por um buraco, vejo que [faction_member_1.GetTitledFirstName] está se aproximando. Será que [faction_member_1.GetSheHe] acha que este lugar pode ser um esconderijo para sua facção traidora?"
 bell_special_yearly.1000.t:0 "O Sino de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 bell_special_yearly.1500.a.tt:0 "Você procura por outra vítima."
 bell_special_yearly.1500.a:0 "Outro tolo briguento se juntará ao meu conjunto!"
 bell_special_yearly.1500.b.tt:0 "Você para de coletar cabeças para o sino."
 bell_special_yearly.1500.b:0 "Devo voltar para casa e descansar."
 bell_special_yearly.1500.desc:0 "Eu me escondo na antecâmara da igreja, e só posso ouvir as batidas do meu coração assassino e os passos de [faction_member_1.GetTitledFirstName].\n\nQuando [faction_member_1.GetSheHe] entra na sala, eu acerto a cabeça [faction_member_1.GetHerHim] com um pedaço de entulho, e [faction_member_1.GetSheHe] cai no chão.\n\nEnquanto eu ataco repetidamente, um devaneio passageiro nubla minhas visões tingidas de sangue. Um sonho de fazer música novamente neste velho campanário, com as cabeças de todos os meus inimigos como badalos."
 bell_special_yearly.1500.discovery.tt:0 "Suas chances de descoberta aumentam"
 bell_special_yearly.2000.a:0 "O Sino ainda não tem cabeças suficientes!"
 bell_special_yearly.2000.b:0 "Este é um crime belo — eu não deveria arriscar estragá-lo."
 bell_special_yearly.2000.desc:0 "Exijo que [Select_CString( faction_member_2.IsFemale, 'a', 'o' )] repugnante [faction_member_2.GetTitledFirstName] visite meu [ROOT.Char.Custom('FortifiedBuilding')] e me disfarce de trovador. Vestido assim, eu declamo '[ROOT.Char.GetTitledFirstName] exige que você ouça esta nova e maravilhosa composição inventada aqui na capital!'\n\nQuando [faction_member_2.GetSheHe] está dentro, eu forço [faction_member_2.GetSheHe] a entrar em um aposento sozinho. Lá, eu toco as #italic cansos# mais mundanas que posso por horas até que [faction_member_2.GetSheHe] caia no sono.\n\nEu trabalho rapidamente — estrangulo meu inimigo com uma das cordas do alaúde, escondo a cabeça [Select_CString(ROOT.Char.IsFemale,'sob meu vestido','em meu manto')], e fujo pelos corredores antes que alguém possa piscar."
 bell_special_yearly.3000.a:0 "O Sino será exquisito!"
 bell_special_yearly.3000.b:0 "Acidentes com órgãos estranhos acontecem todos os dias."
 bell_special_yearly.3000.desc:0 "Impus uma visita real a [faction_member_3.GetTitledFirstNamePossessive] [faction_member_3.Custom('FortifiedBuilding')] sob pretexto de tentar dissipar a tensão com a facção rebelde [faction_member_3.GetHerHim]. Durante uma pausa em nossas negociações, examino as salas de música [faction_member_3.GetHerHim] e peço para ficar sozinho para tocar.\n\nA sala de música tem uma grande janela acima do jardim do [faction_member_3.Custom('FortifiedBuilding')] — com um grande órgão de tubos ao lado. O momento é perfeito demais.\n\nQuando [faction_member_3.GetFirstNameNoTooltip] sai embaixo da janela para ter um momento de tranquilidade, eu empurro o órgão. Ele voa pelo ar e esmaga [faction_member_3.GetSheHe] lá embaixo. Rindo, eu me apresso para recolher a cabeça antes que a morte seja notada."
 bell_special_yearly.4000.a.tt:0 "Todos ficam cientes de seus assassinatos."
 bell_special_yearly.4000.a:0 "Devo dar um grande concerto na igreja!"
 bell_special_yearly.4000.b:0 "Ninguém precisa saber das minhas diversões particulares."
 bell_special_yearly.4000.desc:0 "Eu me espreguiço no meu jardim, brincando distraídamente com as rosas, arrancando suas cabeças uma a uma.\n\nMe pergunto o que fazer com minha torre de sino. Ela está destinada a tocar algum dia?"
 bell_special_yearly.4000.desc_discoverer:0 "\n\nEnquanto penso nisso, percebo [bell_discoverer.GetTitledFirstName], um dos sujeitos ainda lamentando uma vítima das desaparições, me encarando no jardim. Eu dou risada e quase tenho vontade de contar para [bell_discoverer.GetSheHe] ali mesmo."
 bell_special_yearly.5000.a:0 "Toque minha despedida, [bell_discoverer.GetTitledFirstNameNoTooltip]."
 bell_special_yearly.5000.desc:0 "Em uma noite, cavalgo para visitar meu sino e me banhar em sua resplandecente vilania. Para minha surpresa, tochas já estão tremeluzindo enquanto entro nas ruínas.\n\nA princípio, imagino que os fantasmas dos visigodos estejam descontentes por eu ter profanado sua igreja, mas então [bell_discoverer.GetTitledFirstName] abaixa o capuz. 'Sinto que viajei para [bell_discoverer.GetFaith.NegativeAfterLife] e estarei lá pelo resto da minha vida, depois de descobrir a abominação que você cometeu. Você se juntará às suas vítimas, criatura!'\n\nPor um breve momento, percebo um corte de aço em meu pescoço e então nada mais."
 bell_special_yearly.6000.a:0 "Que bela música!"
 bell_special_yearly.6000.b:0 "O resto de vocês se juntará a eles, se me desafiarem!"
 bell_special_yearly.6000.desc:0 "Um concerto é realizado nas ruínas visigóticas para toda a minha corte, prometendo uma noite de música em uma antiga igreja iluminada por velas.\n\nA programação usual com menestréis continua enquanto alguns convidados reclamam do cheiro peculiar. Desfrutamos de algumas melodias leves com flautas e cordas dedilhadas, e as peças se tornam mais melancólicas à medida que a noite avança.\n\nNo final, os serviçais seguem meu comando para correr e tocar os sinos no ritmo da última música. Os gritos dos membros da minha corte se juntam à voz do coral, todos contemplando minhas cabeças trêmulas e tocantes!"
