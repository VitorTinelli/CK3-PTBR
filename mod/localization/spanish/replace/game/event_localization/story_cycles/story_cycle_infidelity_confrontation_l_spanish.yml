l_spanish:
 infidelity_confrontation.1000.blackmail:0 "Certamente, você quer que isso permaneça em segredo..."
 infidelity_confrontation.1000.break_up.failure:0 "[infidelity_partner.GetFirstNameNoTooltip] se recusa a terminar o caso"
 infidelity_confrontation.1000.break_up:0 "Eu #EMP sabia#! que [infidelity_partner.GetSheHe] não era digno de minha atenção."
 infidelity_confrontation.1000.confession.apologetic_end.desc:0 "\""
 infidelity_confrontation.1000.confession.apologetic_start.desc:0 "[infidelity_partner.GetFirstNameNoTooltip] está em silêncio como se congelado no tempo, mas eu posso ver isso em seus olhos. Meus medos são verdadeiros. Eu também pareço ter congelado — exceto pelo meu coração, que está batendo forte.\n\nÀ medida que as palavras finalmente escapam dos lábios de [infidelity_partner.GetFirstNamePossessiveNoTooltip], lágrimas também caem de seus olhos.\n\n\"Oh, [infidelity_partner.Custom2('RelationToMeShort', ROOT.Char)], eu nunca quis te machucar. Eu juro! Eu... Eu vou te contar tudo. Eu compartilhei minha cama com "
 infidelity_confrontation.1000.confession.my_lovername.desc:0 "[infidelity_partners_lover.Custom2('MyCharacterIntroductionNoComma', infidelity_partner)]."
 infidelity_confrontation.1000.confession.unapologetic_end_opposite_sex.desc:0 "Eu preferiria dormir com cem [infidelity_partners_lover.GetWomenMen] do que passar uma noite com você.\""
 infidelity_confrontation.1000.confession.unapologetic_end_same_sex.desc:0 "[infidelity_partners_lover.GetSheHe|U] é duas vezes [Select_CString( infidelity_partners_lover.IsFemale, 'a', 'o' )] [infidelity_partners_lover.GetWomanMan] que você jamais será.\""
 infidelity_confrontation.1000.confession.unapologetic_start.desc:0 "[infidelity_partner.GetFirstNameNoTooltip] não esperava minha acusação, isso está claro. [infidelity_partner.GetSheHe|U] não está abalado por muito tempo, no entanto.\n\n\"Você demorou bastante para perceber, #EMP [infidelity_partner.Custom2('RelationToMeShort', ROOT.Char)]#!.\" As palavras [infidelity_partner.GetHerHim] estão pingando de veneno. \"Sim, eu me deitei com outro – "
 infidelity_confrontation.1000.confession.your_lovername.desc:0 "[infidelity_partners_lover.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)]."
 infidelity_confrontation.1000.demand_break_up.flavor:0 "[infidelity_partner.GetFirstNameNoTooltip] é mais provável que concorde se [infidelity_partner.GetSheHe] teme as consequências"
 infidelity_confrontation.1000.demand_break_up.lover:0 "Faça sua escolha. É [infidelity_partners_lover.GetSheHe] ou eu!"
 infidelity_confrontation.1000.demand_break_up.spouse:0 "Termine tudo, ou haverá consequências!"
 infidelity_confrontation.1000.demand_break_up.success:0 "[infidelity_partner.GetFirstNameNoTooltip] cede à sua demanda"
 infidelity_confrontation.1000.expose:0 "O mundo conhecerá seu caso sórdido!"
 infidelity_confrontation.1000.imprison:0 "O amor o manterá aquecido nas masmorras."
 infidelity_confrontation.1000.opt_out.blackmail.tt:0 "Eu poderia considerar [blackmail|E] [infidelity_partner.GetShortUIName], dando a [infidelity_partner.GetSheHe] um gosto de seu próprio remédio, ou perdoar [infidelity_partner.GetSheHe]"
 infidelity_confrontation.1000.opt_out.divorce.tt:0 "Eu poderia considerar [Concept( 'divorcing', 'Divorciar' )|E] de [infidelity_partner.GetShortUIName], dando a [infidelity_partner.GetSheHe] um gosto de seu próprio remédio, ou perdoar [infidelity_partner.GetSheHe]"
 infidelity_confrontation.1000.opt_out.fallback.tt:0 "Eu poderia considerar dar a [infidelity_partner.GetShortUIName] um gosto de seu próprio remédio, ou perdoar [infidelity_partner.GetSheHe]"
 infidelity_confrontation.1000.opt_out.knew:0 "Eu me canso dessa farsa."
 infidelity_confrontation.1000.opt_out:0 "Eu preciso de tempo para pensar..."
 infidelity_confrontation.1000.plead_break_up.flavor:0 "[infidelity_partner.GetFirstNameNoTooltip] é mais provável que concorde se [infidelity_partner.GetSheHe] se preocupa com você, ou tem pena de você"
 infidelity_confrontation.1000.plead_break_up.success:0 "[infidelity_partner.GetFirstNameNoTooltip] termina o caso e implora por perdão"
 infidelity_confrontation.1000.plead_break_up:0 "Meu amor, eu te suplico! Que essa loucura termine!"
 infidelity_confrontation.1000.t:0 "Infidelidade"
 infidelity_confrontation.1001.kind_start.desc:0 "As lágrimas [Select_CString( confronting_partner.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('confronting_partner'))] [confronting_partner.GetFirstNamePossessive] doem muito mais do que palavras duras jamais poderiam. Fico desolado enquanto"
 infidelity_confrontation.1001.love_end.desc:0 "[confronting_partner.GetSheHe] enterra seu rosto n[ROOT.Char.Custom('GetClothingArticle')].\n\n\"[ROOT.Char.GetFirstNameNoTooltip], como você pôde fazer isso? Eu te amo, s[Select_CString( ROOT.Char.IsFemale, 'ua', 'eu' )] [ROOT.Char.GetWomanMan] tol[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]!\" [confronting_partner.GetFirstName] solta um longo suspiro trêmulo. \"Volte para mim, meu [ROOT.Char.Custom('LoverPetName')]. Deixe aquel[Select_CString( infidelity_partners_lover.IsFemale, 'a', 'e' )] [infidelity_partners_lover.Custom2('InsultNoun', SCOPE.sC('confronting_partner'))] e tudo será perdoado.\""
 infidelity_confrontation.1001.regular_end.desc:0 "[confronting_partner.GetSheHe] limpa as bochechas com um lenço.\n\n\"Eu sei que posso não ser [Select_CString( confronting_partner.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('confronting_partner'))] perfeit[Select_CString( confronting_partner.IsFemale, 'a', 'o' )], mas mereço mais do que isso. Nós dois merecemos. Eu te imploro — volte à razão e deixe aquel[Select_CString( infidelity_partners_lover.IsFemale, 'a', 'e' )] [infidelity_partners_lover.Custom2('InsultNoun', SCOPE.sC('confronting_partner'))]. Ainda não é tarde para melhorar as coisas.\""
 infidelity_confrontation.1001.unkind_start.desc:0 "Serão genuínas as lágrimas [Select_CString( confronting_partner.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('confronting_partner'))] [confronting_partner.GetFirstNamePossessive]? Talvez isso seja nada mais do que um ato, projetado para despertar minha piedade? Solto um suspiro exasperado enquanto"
 infidelity_confrontation.1010.a:0 "Eu vou terminar, eu juro!"
 infidelity_confrontation.1010.angry.desc:0 "O grito [Select_CString( confronting_partner.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('confronting_partner'))] [confronting_partner.GetFirstNamePossessive] reverbera pelos meus ossos. Faço um esforço enorme para não vacilar.\n\n"
 infidelity_confrontation.1010.break_up.desc:0 "\"Eu não aguento mais isso, [ROOT.Char.GetFirstNameNoTooltip]. Você tem que fazer uma escolha. É [infidelity_partners_lover.GetSheHe] ou eu!\""
 infidelity_confrontation.1010.c:0 "Faça o que quiser — [infidelity_partners_lover.GetSheHe] e eu estamos destinados a ficar juntos!"
 infidelity_confrontation.1010.celibacy.desc:0 "\"Se você não deixar [infidelity_partners_lover.GetSheHe], eu nunca mais dividirei a cama com você!\""
 infidelity_confrontation.1010.imprisonment.desc:0 "\"Se você se recusar a deixar [infidelity_partners_lover.GetSheHe], eu vou separá-los com barras de ferro!\""
 infidelity_confrontation.1010.sad.desc:0 "A voz [Select_CString( confronting_partner.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('confronting_partner'))] [confronting_partner.GetFirstNamePossessive] está trêmula, lágrimas escorrendo pelas suas bochechas.\n\n"
 infidelity_confrontation.1010.start.desc:0 "\"Eu sei de tudo sobre o seu caso sórdido com [infidelity_partners_lover.GetTitledFirstName]! Não desperdice seu fôlego negando!\""
 infidelity_confrontation.1011.a:0 "As coisas nunca mais serão as mesmas entre nós?"
 infidelity_confrontation.1011.apologetic_start.desc:0 "Lágrimas escorrem pelas bochechas de [infidelity_partner.GetFirstName]. Serão lágrimas de arrependimento ou medo, eu me pergunto?\n\n\"Por favor, você deve me perdoar. Eu imploro! Eu vou terminar, é claro que vou. Foi um erro estúpido — nada mais! Eu juro!"
 infidelity_confrontation.1011.unapologetic_end.desc:0 "[ROOT.Char.GetFirstNameNoTooltip]? Tudo bem. Faça como quiser. Mas não se iluda — eu não me arrependo do que fiz. Nem por um segundo sequer.\""
 infidelity_confrontation.1011.unapologetic_love.desc:0 "amor,"
 infidelity_confrontation.1011.unapologetic_marriage.desc:0 "casamento,"
 infidelity_confrontation.1011.unapologetic_start.desc:0 "Os olhos de [infidelity_partner.GetFirstNamePossessive] ardem como fogo furioso, mas sua voz está fria como gelo.\n\n\"Você acha que ameaças repararão nosso"
 infidelity_confrontation.1012.a:0 "Tudo bem! Faça do seu jeito, [Select_CString( infidelity_partner.IsFemale, 'sua', 'seu' )] [infidelity_partner.Custom2('InsultNounSexual', ROOT.Char)] [infidelity_partner.Custom2('InsultAdjective', ROOT.Char)]!"
 infidelity_confrontation.1012.apologetic_break_up.desc:0 "Nunca quis te machucar, e por isso lamento. Mas não posso negar meus sentimentos por [infidelity_partners_lover.GetFirstName]. O que temos — nada mais se compara a isso. Nem mesmo você."
 infidelity_confrontation.1012.apologetic_imprisonment.desc:0 "Lamento, mas não posso fazer isso. Eu preferiria passar o resto dos meus dias nas masmorras a negar meus sentimentos por [infidelity_partners_lover.GetFirstName]. Se você me odeia tanto — se você quer me ver sofrer — que seja assim."
 infidelity_confrontation.1012.apologetic_start.desc:0 "[infidelity_partner.GetFirstName] permanece imóvel e silencioso enquanto faço minha demanda, lágrimas escorrendo por suas bochechas. Mas quando finalmente fala, suas palavras não são o que eu esperava.\n\n"
 infidelity_confrontation.1012.unapologetic_break_up.desc:0 "[ROOT.Char.GetFirstNameNoTooltip]? Você sempre foi um tolo. Obrigado por abrir meus olhos. Nunca o vi com mais clareza!"
 infidelity_confrontation.1012.unapologetic_imprisonment.desc:0 "[ROOT.Char.GetFirstNameNoTooltip]? Prefiro passar o resto da minha vida nas masmorras do que mais um segundo com você!"
 infidelity_confrontation.1013.a:0 "E nem mesmo uma chance de se despedir com um beijo..."
 infidelity_confrontation.1013.like.desc:0 "Querid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.Custom('LoverPetName')]. É com o coração pesado que escrevo esta carta. Tivemos um sonho, um sonho maravilhoso e alegre. Mas nunca foi mais do que isso, e por mais que doa, a resposta é óbvia. Não podemos continuar juntos.\n\nQuero agradecer por todos os bons momentos. Nunca os esquecerei. Que sua vida seja longa e feliz."
 infidelity_confrontation.1013.love.desc:0 "[ROOT.Char.Custom('LoverPetName')|U], pensei que estaríamos juntos para sempre, que nada poderia nos separar. Mas não importa o quanto eu me importe com você, não posso mais ignorar a dura realidade de nossa situação. Nossos sonhos, tão doces e perfeitos como possam ser, nunca foram mais do que isso. E agora eles nunca serão.\n\nApesar de tudo, devemos seguir em frente, meu amor. Se não podemos estar juntos nesta vida, devemos esperar pacientemente pela próxima."
 infidelity_confrontation.1013.neutral.desc:0 "Nosso caso, por mais agradável que tenha sido, não é mais uma questão privada. Foi bom enquanto durou, mas agora deve terminar.\n\nCuide-se, [ROOT.Char.GetTitledFirstNameNoTooltip]. Esta despedida pode doer hoje, mas eu garanto — logo será esquecida."
 infidelity_confrontation.1013.t:0 "[infidelity_partners_lover.Custom2('AppropriateGreeting', infidelity_partner)]"
 infidelity_confrontation.1020.a:0 "Farei qualquer coisa para merecer seu perdão!"
 infidelity_confrontation.1020.b:0 "Não posso negar meus sentimentos por [infidelity_partners_lover.GetFirstNameNoTooltip]!"
 infidelity_confrontation.1021.a:0 "Vai levar tempo, mas vamos reconstruir."
 infidelity_confrontation.1021.love.desc:0 "O alívio no rosto de [infidelity_partner.GetFirstNamePossessive] é inconfundível. Com ele vêm lágrimas, e enquanto [infidelity_partner.GetSheHe] se joga em meus braços, posso sentir a umidade contra meu pescoço.\n\n\"Eu não mereço seu perdão,\" [infidelity_partner.GetSheHe] sussurra entre soluços. \"Mas farei tudo em meu poder para mudar isso. Eu juro, meu amor. Eu juro pela minha vida.\""
 infidelity_confrontation.1021.regular.desc:0 "A vergonha no rosto de [infidelity_partner.GetFirstNamePossessive] é inconfundível. \"Eu tinha me convencido de que não fiz nada de errado, mas agora que tudo está às claras...\"\n\n[infidelity_partner.GetSheHe|U] balança a cabeça com um suspiro. \"Finalmente consigo ver o erro dos meus caminhos. Me perdoe, [ROOT.Char.GetFirstNameNoTooltip]. Vamos tentar de novo.\""
 infidelity_confrontation.1021.unapologetic_start.desc:0 "\"Deixe de fingir,\" diz [infidelity_partner.GetFirstName], [infidelity_partner.Custom('quirk_neg_pp')]. \"Nenhuma quantidade de lágrimas me fará mudar de ideia. Pare de desperdiçar seu tempo — e o meu.\"\n\nComo el[Select_CString( infidelity_partner.IsFemale, 'a', 'e' )] pode ser tão fri[Select_CString( infidelity_partner.IsFemale, 'a', 'o' )]?"
 infidelity_confrontation.1022.a:0 "Ofereço a você meu coração, e você o joga fora?"
 infidelity_confrontation.1022.apologetic_start.desc:0 "[infidelity_partner.GetFirstName] permanece imóvel e em silêncio enquanto suplico pelo seu amor, lágrimas escorrendo por suas bochechas. Mas quando el[Select_CString( infidelity_partner.IsFemale, 'a', 'e' )] finalmente fala, suas palavras não são o que eu esperava.\n\n"
 infidelity_confrontation.1030.a:0 "Se você apenas me deixasse explicar!"
 infidelity_confrontation.1030.desc:0 "Fiquei sabendo de seu pequeno e sórdido caso com [infidelity_partners_lover.GetTitledFirstName]. Obrigado por revelar sua verdadeira natureza de forma tão clara!\n\nNão há dúvida em minha mente; eu desperdicei meu tempo e atenção com um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.Custom2('InsultNounSexual', SCOPE.sC('confronting_partner'))] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('confronting_partner'))]. Você nem sequer é dign[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] da tinta da minha pena! Uma vez que esta carta seja enviada, não vou dedicar mais um pensamento a você."
 infidelity_confrontation.1030.t:0 "[confronting_partner.Custom2('AppropriateGreetingNegative', infidelity_partner)]"
 infidelity_controntation.1000.exposed_intro.desc:0 "[exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] expôs o caso [Select_CString( infidelity_partner.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('infidelity_partner'))] [infidelity_partner.GetFirstNamePossessive] com [infidelity_partners_lover.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\n"
 infidelity_controntation.1000.exposed_knew.desc:0 "Agora que toda a história está exposta, m[Select_CString( infidelity_partner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', infidelity_partner )] e s[Select_CString( infidelity_partners_lover.IsFemale, 'ua', 'eu' )] [infidelity_partners_lover.Custom2('InsultNounSexual', ROOT.Char)] estão prestes a enfrentar as consequências de suas ações."
 infidelity_controntation.1000.incest.desc:0 "m[Select_CString( infidelity_partner.IsFemale, 'inha', 'eu' )] [infidelity_partner.Custom2('InsultNoun', ROOT.Char)] de um[Select_CString( infidelity_partner.IsFemale, 'a', '' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('infidelity_partner'))] teve que compartilhar uma cama com [infidelity_partners_lover.GetSheHe] de todas as pessoas! [Select_CString( infidelity_partners_lover.IsFemale, 'Sua própria', 'Seu próprio' )] #EMP [infidelity_partner.Custom2('RelationToMeShort', SCOPE.sC('infidelity_partners_lover'))]#!!\n\nTalvez eu devesse ter sabido. Eles sempre estavam tão... próximos. Oh, [ROOT.Char.GetFaith.HighGodName]. O pensamento deles juntos... Isso me deixa enjoado."
 infidelity_controntation.1000.investigation_intro.desc:0 "Minha investigação foi bem-sucedida e meus medos foram confirmados. [infidelity_partner.GetSheHe|U] está tendo um caso com [infidelity_partners_lover.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\n"
 infidelity_controntation.1000.partner_exposed_intro.desc:0 "[infidelity_partner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] confessou ter tido um caso com [infidelity_partners_lover.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\n"
 infidelity_controntation.1000.partners_lover_exposed_intro.desc:0 "[infidelity_partners_lover.Custom2('MyCharacterIntroduction', ROOT.Char)|U] confessou ter tido um caso com [infidelity_partner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\n"
 infidelity_controntation.1000.regular.desc:0 "Como [infidelity_partner.GetTitledFirstName] pôde compartilhar a cama com outro? Como [infidelity_partner.GetSheHe] pôde me trair assim? Talvez eu nunca saiba as razões [infidelity_partner.GetHerHim], mas não parece haver dúvidas sobre a culpa [infidelity_partner.GetHerHim]."
 infidelity_controntation.1000.sodomy.desc:0 "M[Select_CString( infidelity_partner.IsFemale, 'inha', 'eu' )] [infidelity_partner.Custom2('InsultNoun', ROOT.Char)] de um[Select_CString( infidelity_partner.IsFemale, 'a', '' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('infidelity_partner'))] teve que compartilhar a cama com [infidelity_partners_lover.GetSheHe] de todas as pessoas! Outr[Select_CString( infidelity_partner.IsFemale, 'a', 'o' )] #EMP [infidelity_partner.GetWomanMan]#!!\n\nOh, [ROOT.Char.GetFaith.HighGodName]. O pensamento deles... juntos... Isso me deixa doente."
 infidelity_controntation.1000.start_lover.desc:0 "Como se ter outro amante não fosse o suficiente,"
 infidelity_controntation.1000.start_spouse.desc:0 "Como se violar a santidade de nosso casamento não fosse o suficiente,"
