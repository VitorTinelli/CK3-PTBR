l_spanish:
 central_asia.0001.a:0 "É aqui que minha conquista verdadeiramente começa."
 central_asia.0001.desc:0 "Os líderes dos clãs sabem por que foram convocados. Passamos uma longa noite isolados na tenda do palácio, e eles convocam xamãs e generais para falar diante deles. Não há debate. Eu saio da tenda quando os primeiros raios de sol rompem o horizonte, e todo o exército reunido já está acordado, aguardando.\n\nEles me saúdam, sabendo que eu não sou apenas o seu governante. Sou o governante do universo - Cã Genghis."
 central_asia.0001.mongol_invasion_cb:0 "Eu posso usar o [mongol_invasion_casus_belli|E]"
 central_asia.0001.t:0 "O Mundo Diante de Mim"
 central_asia.0002.a:0 "O mundo tremerá diante de nós!"
 central_asia.0002.desc:0 "Fui convocado pelo meu senhor feudal para um Grande Curiltai, uma reunião de todos os líderes dos clãs e vassalos no reino. Todos nós sabíamos por que, e nunca houve dúvida nas deliberações noturnas que ocorreram na tenda enfumaçada. [genghis_khan.GetFullNameNoTooltip] é [Select_CString( genghis_khan.IsFemale, 'a', 'o' )] [genghis_khan.GetLadyLord] do universo - Cã Genghis.\n\nNão houve cerimônia de coroação, pois quem poderia julgar [genghis_khan.GetSheHe]? Em vez disso, [genghis_khan.GetSheHe] fez uma declaração diante de seus exércitos reunidos.\n\n\"Hoje partimos para conquistar tudo que está sob o Grande Céu!\""
 central_asia.0002.t:0 "Cã Genghis"
 central_asia.0003.a.distant:0 "Isso tudo logo será esquecido."
 central_asia.0003.a.neighbor:0 "Devemos nos preparar. Há tempos difíceis pela frente."
 central_asia.0003.desc:0 "Heraldos nos trazem notícias de um novo governante nas estepes, alguém que se autodenomina \"Cã Genghis\", autoproclamado governante do universo. Uma horda unida de cavaleiros e guerreiros está se espalhando para subjugar aqueles que se recusam a se curvar.\n\nEssas são reivindicações ridículas, é claro, mas também chegaram até nós notícias da queda de grandes cidades diante de um conquistador feroz..."
 central_asia.0011.a:0 "Carregamos a força de muitos povos!"
 central_asia.0011.desc:0 "A herança do passado não é apenas um poderoso símbolo, mas uma força orientadora por si só. Como eram antes, os povos diversos desta terra serão unidos e liderados sob a bandeira de Báctria. Minha bandeira.\n\nCom cascos trovejantes e pés marchantes, todos aqueles que viajam entre o Oriente e o Ocidente saberão que governamos o céu aberto."
 central_asia.0011.t:0 "O Berço das Estepes"
 central_asia.0012.a:0 "Carregamos a força de muitos povos!"
 central_asia.0012.desc:0 "M[Select_CString( bactrian_emperor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('bactrian_emperor'))], [bactrian_emperor.GetTitledFirstName], reivindicou as terras antigas de Báctria e pretende governá-las como uma, assim como os reis fizeram nos tempos antigos.\n\nPara aqueles que viajam entre o Oriente e o Ocidente, esta terra pode parecer inóspita, mas sabemos que ela está verdadeiramente repleta de vida."
 central_asia.0013.a:0 "[bactrian_emperor.GetSheHe|U] pode tirá-las das minhas mãos frias e mortas!"
 central_asia.0013.desc:0 "[bactrian_emperor.GetFullName] reivindicou todas as terras da antiga Báctria e se declarou a única governante verdadeira. O tolo parece ter ignorado um pequeno detalhe, no entanto. Algumas das terras que [bactrian_emperor.GetSheHe] reivindicou são minhas!"
