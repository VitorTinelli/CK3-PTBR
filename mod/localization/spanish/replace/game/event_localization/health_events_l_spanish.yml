 disease_typhus:0 "tifóide."
 fire_court_physician_effect.tt:0 "[THIS.Char.GetShortUIName] não é mais [GetCourtPositionType('court_physician_court_position').GetName()]"
 health.0001.desc:0 "Minha Ferida Sarou"
 health.0002.a:0 "Aguardo ansiosamente minha recuperação completa."
 health.0002.desc:0 "Minhas lesões estão melhorando aos poucos, e a dor já não é mais minha constante companheira. Ainda estou enfraquecid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], mas hoje sou capaz de muitas coisas que eram impossíveis há apenas um mês."
 health.0002.t:0 "$health_wounded_title$ Cicatrização"
 health.0003.a:0 "Eu talvez consiga sobreviver a isso."
 health.0003.desc:0 "Parece que o pior já passou. Minhas feridas abertas e ossos quebrados começaram a se unir lentamente."
 health.0003.t:0 "$health_wounded_title$ Por um Triz"
 health.0004.a:0 "Agradeço a [ROOT.Char.GetFaith.HealthGodName]."
 health.0004.desc:0 "A pele ao redor está endurecida, mas a sensação de queimação em minha ferida passou. Parece que a infecção se foi."
 health.0004.t:0 "$health_wounded_title$ O Fogo Acaba"
 health.0102.a:0 "Só preciso sentar por um tempo..."
 health.0102.court_physician.desc:0 "\n\n\"Não se preocupe, [ROOT.Char.Custom('FormOfAddressForLiege')]. Sua ferida é profunda, mas meu conhecimento é mais profundo.\""
 health.0102.desc:0 "A dor percorre meu corpo a cada passo, e até o menor dos movimentos me deixa ofegante. Ao levar uma mão para tocar delicadamente minha ferida, ela sai ensanguentada, e tremo enquanto o sangue escorre pelo meu lado."
 health.0102.t:0 "$health_wounded_title$ Corte Profundo"
 health.0104.a:0 "[ROOT.Char.GetFaith.HealthGodName|U], liberte-me dessa dor!"
 health.0104.court_physician.desc:0 "\n\n\"Você está gravemente [Select_CString( ROOT.Char.IsFemale, 'ferida', 'ferido' )], [ROOT.Char.Custom('FormOfAddressForLiege')]. Precisamos cuidar de você imediatamente!\""
 health.0104.desc:0 "Será que vejo um osso embutido em minha carne, ou algo que deveria estar escondido ainda mais fundo? Enquanto minha pele se abre como as mandíbulas famintas da morte, fico hipnotizad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] pelo rio de sangue que jorra."
 health.0104.t:0 "$health_wounded_title$ Gravemente Ferid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]"
 health.0201.desc:0 "Ferida Infectada"
 health.0202.a:0 "Espero sobreviver a isso."
 health.0202.court_physician.desc:0 "\n\n\"Sua ferida está infectada, [ROOT.Char.Custom('FormOfAddressForLiege')]. Mas não se preocupe, eu vou cuidar de você.\""
 health.0202.desc:0 "Sinto como se cem facas estivessem cortando minha ferida! Com a carne escurecendo e o sangue ficando pálido, fica claro que a lesão está infectada."
 health.0202.t:0 "$health_wounded_title$ Uma Mancha Interna"
 health.0202.unintelligent:0 "É como se muitas facas cortassem minha pele ao redor da ferida sempre que a toco. A carne está sensível, e acho que o sangue está com a cor errada."
 health.0203.desc:0 "Ferida Gangrenada"
 health.0204.court_physician.desc:0 "\n\n\"Você contraiu gangrena, [ROOT.Char.Custom('FormOfAddressForLiege')]. Isso é muito sério... Devemos tratá-la imediatamente!\""
 health.0204.desc:0 "Uma ferida deve doer, e algum inchaço não é incomum, então assumi que minha ferida estava cicatrizando. No entanto, agora há bolhas marcando minha pele, e o vermelho está se tornando preto. Meu corpo está apodrecendo diante dos meus olhos!"
 health.0204.t:0 "$health_wounded_title$ Notícias Sombrias"
 health.1001.a:0 "Tudo o que quero é ficar na cama..."
 health.1001.b:0 "Eu devo voltar para casa #EMP imediatamente!#!"
 health.1001.court_physician.desc:0 "\"Ouvi esse chiado do outro lado da [ROOT.Char.Custom('GetCourt')], [ROOT.Char.Custom('FormOfAddressForLiege')]!\" [physician.GetFirstName], meu médico, põe a sua cabeça em meu [ROOT.Char.Custom('GetChamber')]. \"Se precisar, conheço uma boa quantidade de remédios adequados.\""
 health.1001.desc:0 "[ROOT.Char.GetTitleAsNameNoTooltip] ou camponês, alto ou baixo, não importa. No final, todos somos mortais.\n\nFui lembrado disso quando acordei tossindo nas primeiras horas da manhã, uma dor surda martelando minha cabeça e garganta. Meu corpo é sacudido por calafrios e fraqueza, minha cabeça vazando de todos os orifícios.\n\n"
 health.1001.nophysician.desc:0 "Certamente deve haver alguém no reino que eu possa procurar para resolver esta condição amaldiçoada..."
 health.1001.t:0 "[SCOPE.Custom('EventTitleDisease')]: Meu Corpo Mortal"
 health.1002.a:0 "Por favor, não deixe que seja o fim!"
 health.1002.court_physician.desc:0 "\n\n[Select_CString( physician.IsFemale, 'Minha médica', 'Meu médico' )] [physician.GetFirstName] me examina atentamente. \"É pneumonia, [ROOT.Char.Custom('FormOfAddressForLiege')]. Não deve ser subestimado. Como devemos proceder?"
 health.1002.desc:0 "Respirar é algo tão fácil, maravilhoso - um pequeno milagre que raramente nos damos conta. Agora, enquanto luto para manter a respiração regular e os ataques de tosse são seguidos por uma dor aguda no peito, está constantemente em minha mente."
 health.1002.t:0 "[SCOPE.Custom('EventTitleDisease')]: Afiada como uma Faca"
 health.1003.a:0 "Traga-me algumas pomadas! Rápido!"
 health.1003.court_amenities_gout.desc:0 "Minha mesa é conhecida por ter refeições luxuriantes e incessantes. Conforme meus pés começam a inchar, fica claro que muitos de nós também terão que se preparar para uma dor incessante."
 health.1003.court_physician.desc:0 "\n\n[Select_CString( physician.IsFemale, 'Minha médica', 'Meu médico' )], [physician.GetFirstName], coloca algumas pomadas ao meu lado. \"Você tem minha simpatia, [ROOT.Char.Custom('FormOfAddressForLiege')]. Tenho algumas ideias que podem diminuir os sintomas da sua gota.\""
 health.1003.desc:0 "Chamam isso de \"doença dos reis\", como se houvesse algo luxuoso ou invejável sobre minhas articulações inchadas e doloridas.\n\nMeu dedão do pé, em particular, está dolorosamente distendido, deixando-me mancando.\n\nQuando a dor atinge seu pico, não posso deixar de desejar ser apenas um simples camponês."
 health.1003.t:0 "[SCOPE.Custom('EventTitleDisease')]: O Preço da Indulgência"
 health.1004.a:0 "O que fiz para merecer essa maldição?"
 health.1004.court_physician.desc:0 "\n\n\"Sinto muito, a lepra é uma aflição permanente, [ROOT.Char.Custom('FormOfAddressForLiege')]. No entanto, tenho métodos para aliviar seus sintomas.\""
 health.1004.desc:0 "Os primeiros sintomas foram sutis, e rapidamente os coloquei de lado. Talvez eu estivesse com medo demais para ver a verdade. No entanto, essa horrenda marca no meu rosto, essa lesão... É algo que não posso mais ignorar.\n\nMeus [ROOT.Char.Custom('GetCourtierPlural')|l] ainda seguem minhas ordens, mas algo mudou no modo como olham para mim. Será que há medo em seus olhos? Piedade? Nojo?"
 health.1004.t:0 "[SCOPE.Custom('EventTitleDisease')]: Olhares Evitados"
 health.1005.a:0 "Imploro, que isso acabe!"
 health.1005.court_physician.desc:0 "\n\n\"Não se preocupe, [ROOT.Char.Custom('FormOfAddressForLiege')]! O tifo é tratável, eu lhe asseguro.\""
 health.1005.desc:0 "Ouvi histórias sobre soldados valentes morrendo como moscas antes mesmo de colocar os pés no campo de batalha. Mas eu, um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip]? Esse pesadelo doloroso e febril não é um destino que me pertence.\n\nEnquanto mais uma refeição força seu caminho pela minha garganta, rezo por redenção, minhas narinas ardem com o cheiro forte de bile."
 health.1005.t:0 "[SCOPE.Custom('EventTitleDisease')]: Febre do Acampamento"
 health.1006.a:0 "Este é o meu destino? Definhar lentamente?"
 health.1006.court_physician.desc:0 "\n\n\"Sinto muito, mas você contraiu tuberculose, [ROOT.Char.Custom('FormOfAddressForLiege')]. Vou tratá-la imediatamente.\""
 health.1006.desc:0 "Uma mancha vermelha, tão contrastante contra o tecido pálido. Eu a encaro incrédula, suprimindo outra tosse. Teria...? Eu teria...?\n\nEu limpo meus dedos nos lábios, minha mão tremendo quando a afasto. Sinto a umidade quente, mas temo olhar."
 health.1006.t:0 "[SCOPE.Custom('EventTitleDisease')]: Pouco a Pouco"
 health.1007.a:0 "Contra esse inimigo, não há vitória possível."
 health.1007.court_physician.desc:0 "\n\n\"Sim, infelizmente, é câncer. Conheço apenas um tratamento eficiente...\""
 health.1007.desc:0 "Há algo dentro de mim que não sou eu. Ele se alimenta da minha força vital, aumentando sua força enquanto eu definho.\n\nEu pressiono minhas mãos contra o crescimento sob minha pele, meus dedos doendo para arrancá-lo. A ideia de que ele está crescendo me faz querer vomitar."
 health.1007.t:0 "[SCOPE.Custom('EventTitleDisease')]: Um Estranho Interior"
 health.1008.desc:0 "A sensação de queimação em minha virilha estava se tornando insuportável, então precisei me desculpar e fugir para meus aposentos. Finalmente sozinho, pude me coçar para encontrar alívio.\n\nNo entanto, não havia alívio, pois meus dedos encontraram bolhas e as romperam!"
 health.1008.no_partner.a:0 "Como? Quem?!"
 health.1008.partner.a:0 "[infecting_partner.GetFirstNameNoTooltip]...!"
 health.1008.t:0 "[SCOPE.Custom('EventTitleDisease')]: O Fogo do Amor"
 health.1010.a:0 "[ROOT.Char.GetFaith.HealthGodName], imploro a você, ainda não! Eu não estou pronto!"
 health.1010.court_physician.desc:0 "\n\n\"De fato, essas lesões são um sinal claro de varíola. Muito perigoso se não for tratado.\""
 health.1010.desc:0 "Com a primeira onda de febre e vômito, eu esperava desesperadamente que não fosse algo pior do que a doença do suor. E eu melhorei um pouco, levantei da cama, retornei às minhas obrigações. Por uma semana, tudo estava bem - até que notei as primeiras manchas vermelhas na minha boca."
 health.1010.end.desc:0 "\n\nIsso foi há dois dias, e agora as lesões características estão se espalhando pela minha pele..."
 health.1010.t:0 "[SCOPE.Custom('EventTitleDisease')]: A Peste Vermelha"
 health.1011.a:0 "Oh, [ROOT.Char.GetFaith.HealthGodName]! Salve-me deste pesadelo!"
 health.1011.court_physician.desc:0 "\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], farei tudo que estiver ao meu alcance, mas pode ser sábio se preparar para o pior...\""
 health.1011.desc:0 "O medo da peste tem sido uma companheira constante ao longo da minha vida. Minha ama de infância contava histórias assustadoras na hora de dormir sobre ínguas inchadas e membros enegrecidos.\n\nMas a peste não é mais apenas uma história assustadora. Com cautela, pressiono meus dedos contra o caroço em minha axila. Uma força sombria e mortal está contaminando minha carne, consumindo-me enquanto ainda respiro."
 health.1011.t:0 "[SCOPE.Custom('EventTitleDisease')]: O Toque do Ceifador"
 health.1013.court_physician.desc:0 "\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]. Isso... não parece bom. Deixe-me ver o que posso fazer.\""
 health.1013.desc:0 "Pensei que fossem apenas algumas bolhas. Embora estivesse enojado, amaldiçoando minha má sorte, nunca imaginei que pioraria. Agora, uma erupção vermelha está se espalhando pelo meu corpo.\n\nEu sei o que vem a seguir. Feridas, febre, todo tipo de dor e atrofia. E no final - se eu viver o suficiente - perderei minha sanidade."
 health.1013.no_partner.a:0 "Estou amaldiçoado. Verdadeiramente e completamente amaldiçoado."
 health.1013.partner.a:0 "Você me amaldiçoou, [infecting_partner.GetFirstNameNoTooltip]."
 health.1013.t:0 "[SCOPE.Custom('EventTitleDisease')]: A Grande Peste"
 health.1014.a:0 "Não tenho medo de você. Está me ouvindo?! NÃO TENHO MEDO!"
 health.1014.desc:0 "Onde estou?\n\nEncaro o corredor vazio à minha frente, coração acelerado e mãos trêmulas. Como cheguei aqui? Minha mente está... fragmentada. Há imagens - escadas, queda, sombras nos cantos - mas não consigo juntá-las.\n\nAlguém está me observando.\n\nGiro em volta, apenas para encontrar mais vazio."
 health.1014.t:0 "[SCOPE.Custom('EventTitleDisease')]: A Descida"
 health.1101.a:0 "Estou feliz por estar bem novamente."
 health.1101.desc:0 "Ao acordar esta manhã e observar os primeiros raios de sol, levei um momento para perceber que dormi profundamente pela primeira vez em semanas. Não acordei tossindo nenhuma vez!\n\nFoi uma longa jornada de volta à saúde, mas me encontro mais uma vez em seu caloroso abraço."
 health.1101.t:0 "[SCOPE.Custom('EventTitleDisease')]: Meu Antigo Eu"
 health.1102.a:0 "Hora de conquistar o mundo!"
 health.1102.desc:0 "Devo admitir, em um certo momento eu temi por minha vida, mas agora essa angústia é apenas uma lembrança pálida. Cheio de gratidão, respiro fundo, me preparando para o dia que virá."
 health.1102.t:0 "[SCOPE.Custom('EventTitleDisease')]: Minha Força Retornando"
 health.1103.a:0 "A moderação valeu a pena!"
 health.1103.desc:0 "Eu tive que me controlar e abrir mão de muitos prazeres da vida, mas é um sacrifício que eu faria novamente. Há outras coisas para aproveitar na vida além de comida e bebida!\n\nAgora, quando minhas dores não me atrapalham mais, finalmente estou livre para persegui-las."
 health.1103.t:0 "[SCOPE.Custom('EventTitleDisease')]: Livre da Dor"
 health.1105.a:0 "Eu vivo para lutar mais um dia!"
 health.1105.desc:0 "Diferentemente de muitos antes de mim, eu fui forte o suficiente para sobreviver aos estragos da temida febre do acampamento. Foi um desafio brutal, não nego, mas eu perseverei!"
 health.1105.t:0 "[SCOPE.Custom('EventTitleDisease')]: Uma Batalha Vencida"
 health.1106.a:0 "Hora de conquistar o mundo!"
 health.1106.desc:0 "Eu fiquei magro, tossi e sangrei. Eu pensei que iria definhar até desaparecer. Certamente parecia assim quando mal conseguia sair da cama.\n\nNo entanto, minha saúde e força se recuperaram, ainda que lentamente. Finalmente, estou pronto para enfrentar o mundo e todos os seus desafios."
 health.1106.t:0 "[SCOPE.Custom('EventTitleDisease')]: Uma Segunda Chance"
 health.1107.a:0 "Vou viver a vida ao máximo!"
 health.1107.desc:0 "Dizem que sou uma maravilha, um milagre. As pessoas não deveriam se recuperar de algo assim.\n\nNo entanto, me sinto bem, e o caroço se foi. Não há outra conclusão - me recuperei do câncer."
 health.1107.t:0 "[SCOPE.Custom('EventTitleDisease')]: Um Milagre Médico"
 health.1109.a:0 "Vou viver a vida ao máximo!"
 health.1109.desc:0 "Eu temia que a Grande Praga levasse minha vida, mas parece que venci a luta. Estive sem sintomas por muitos meses. É hora de abandonar essa preocupação constante."
 health.1109.t:0 "[SCOPE.Custom('EventTitleDisease')]: Um Grande Alívio"
 health.1110.a.tt:0 "Agora sou imune à [GetTrait('smallpox').GetName(GetNullCharacter)]"
 health.1110.a:0 "Glória a [ROOT.Char.GetFaith.HealthGodName]! Estou bem!"
 health.1110.desc:0 "Embora cicatrizes possam permanecer, tanto na minha pele quanto na minha mente, parece que a aflição deixou meu corpo. Eu sobreviverei. Ainda há tempo."
 health.1110.t:0 "[SCOPE.Custom('EventTitleDisease')]: Escapando de [ROOT.Char.GetFaith.DeathDeityName]"
 health.1111.a.tt:0 "Agora estou imune à [GetTrait('bubonic_plague').GetName(GetNullCharacter)]"
 health.1111.a:0 "Louvado seja [ROOT.Char.GetFaith.HealthGodName] por este milagre!"
 health.1111.desc:0 "Parece que [ROOT.Char.GetFaith.DeathDeityName] passou pela minha porta, ficou ao lado da minha cama, mas no final decidiu me deixar viver. Nunca esquecerei os tormentos do toque [ROOT.Char.GetFaith.DeathDeityHerHim|U], mas [ROOT.Char.GetFaith.DeathDeitySheHe|U] abriu meus olhos para o milagre da vida.\n\nA praga reivindicou muitas almas, mas eu não serei uma delas."
 health.1111.t:0 "[SCOPE.Custom('EventTitleDisease')]: Contra Todas as Probabilidades"
 health.2001.a.not_sick:0 "Saia da minha cama, s[Select_CString( std_partner.IsFemale, 'ua', 'eu' )] [std_partner.Custom2('InsultNounSexual', ROOT.Char)] traiçoeir[Select_CString( std_partner.IsFemale, 'a', 'o' )]!"
 health.2001.a.sick:0 "Perdoe-me, [std_partner.GetFirstNameNoTooltip], mas não posso compartilhar sua cama assim."
 health.2001.c.not_sick:0 "A mera ideia de tocar em você... Não posso!"
 health.2001.c.sick:0 "Perdoe-me, [std_partner.GetFirstNameNoTooltip], não podemos continuar assim."
 health.2001.c.tt:0 "Continuo visitando a cama de [std_partner.GetFirstName], arriscando a infecção ao fazer isso"
 health.2001.c.tt_sick:0 "Continuo visitando a cama de [std_partner.GetFirstName]"
 health.2001.d.not_sick:0 "Eu te perdoo, [std_partner.GetFirstNameNoTooltip]."
 health.2001.d.sick:0 "Meu querido, não consigo expressar o quanto sinto muito!"
 health.2001.not_sick.desc:0 "Como [std_partner.GetSheHe] pôde trazer essa aflição repugnante para nossa cama?"
 health.2001.sick.desc:0 "Eu fiz isso com [std_partner.GetSheHe]?"
 health.2001.start.desc:0 "Ao me deitar entre os lençóis para me juntar [Select_CString( std_partner.IsFemale, 'a', 'ao' )] [std_partner.GetFirstName], fiquei horrorizad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ao encontrar bolhas exsudantes nas suas partes mais íntimas."
 health.2001.t:0 "[SCOPE.Custom('EventTitleDisease')]: Uma Desagradável Surpresa"
 health.2002.a.not_sick:0 "Afaste-se de mim!"
 health.2002.a.sick:0 "Eu... eu não posso. Isso é demais!"
 health.2002.b.not_sick:0 "Não posso estar com você assim, [std_partner.GetFirstName]!"
 health.2002.b.sick:0 "Querido, sinto muito, mas não posso..."
 health.2002.c:0 "Ficarei ao seu lado nisso, meu amor."
 health.2002.d.not_sick:0 "Isso poderia ter sido o meu fim."
 health.2002.d.sick:0 "Estamos amaldiçoados!"
 health.2002.early_great_pox.desc:0 "\n\nIsso significa...?"
 health.2002.start.desc:0 "O que [std_partner.GetFirstName] insistia que eram apenas bolhas finalmente mostrou sua verdadeira face. Uma erupção vermelha está se espalhando pela sua pele - um sinal claro da Grande Praga."
 health.2002.t:0 "[SCOPE.Custom('EventTitleDisease')]: Ainda Pior"
 health.2003.a:0 "Será que tudo será tirado de mim?"
 health.2003.consort.desc:0 "me disse para ficar longe de sua cama."
 health.2003.lover.desc:0 "terminou tudo entre nós."
 health.2003.start.desc:0 "Quando contei [Select_CString( other_partner.IsFemale, 'a', 'ao' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('other_partner'))] sobre minha aflição, busquei o conforto [other_partner.GetHerHim], mas fui rejeitad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. O nojo brilhou nos olhos de [other_partner.GetFirstNamePossessive] quando [other_partner.GetSheHe]"
 health.2003.t:0 "[SCOPE.Custom('EventTitleDisease')]: Abandonad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]"
 health.2101.a.tt:0 "A doença se espalhará livremente na minha corte."
 health.2101.a:0 "Isolar [sick_character.GetSheHe] e rezar pela redenção."
 health.2101.b:0 "[sick_character.GetTitledFirstNameNoTooltip] está [Select_CString( sick_character.IsFemale, 'banida', 'banido' )] da minha corte!"
 health.2101.bubonic_plague_outbreak.desc:0 "[ROOT.Char.GetFaith.DeathDeityName|U] ergueu sua foice sobre meu reino - um caso da temida peste bubônica foi descoberto!"
 health.2101.bubonic_plague_spreads.desc:0 "Mais uma alma está à beira da morte, os terríveis bubões deformando a sua pele."
 health.2101.c:0 "Expulsem [sick_character.GetSheHe]!"
 health.2101.consumption_outbreak.desc:0 "Tosses intensas ecoam pela corte. A tuberculose percorre os corredores, reivindicando sua primeira vítima."
 health.2101.consumption_spreads.desc:0 "Mais almas infelizes se veem nas garras da tuberculose."
 health.2101.courtier_or_guest.desc:0 "O infortúnio atingiu [Select_CString( sick_character.IsFemale, 'minha', 'meu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))] [sick_character.GetTitledFirstName]."
 health.2101.dysentery_outbreak.desc:0 "O fedor ao redor do local conta sua própria história. Disenteria foi descoberta na corte."
 health.2101.dysentery_spreads.desc:0 "Mais casos de disenteria continuam a surgir, os sanitários ocupados dia e noite."
 health.2101.ergotism_outbreak.desc:0 "O ergotismo se manifestou na corte, os movimentos espasmódicos da vítima tornando óbvio para todos presentes."
 health.2101.ergotism_spreads.desc:0 "Mais casos de ergotismo continuam a derrubar vítimas, incendiando seus membros sob a pele."
 health.2101.immune.desc:0 "\n\nEmbora eu seja imune aos estragos dessa terrível aflição, a presença de [sick_character.GetFirstNamePossessive] representa um perigo para todos os outros na minha corte."
 health.2101.imporant.desc:0 "[Select_CString( sick_character.IsFemale, 'Minha', 'Meu' )] pobre [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))] [sick_character.GetFirstName] está lutando pela vida."
 health.2101.measles_outbreak.desc:0 "A erupção que se desenvolveu na pele dos afligidos era evidente: sarampo foi descoberto na corte."
 health.2101.measles_spreads.desc:0 "Cada vez mais pessoas adoecem e desenvolvem as erupções avermelhadas na pele que denunciam a presença do sarampo."
 health.2101.not_immune.desc:0 "\n\nA contaminação que possui a carne [sick_character.GetHerHim] é um perigo para todos nós. Enquanto [sick_character.GetSheHe] permanecer doente, nenhuma vida na corte estará segura."
 health.2101.prisoner.desc:0 "A vítima infeliz é [sick_character.GetTitledFirstName], um dos meus prisioneiros."
 health.2101.smallpox_outbreak.desc:0 "A maldição da morte caiu sobre minha casa — um caso de varíola foi descoberto!"
 health.2101.smallpox_spreads.desc:0 "Mais uma alma foi amaldiçoada com varíola."
 health.2101.t:0 "[SCOPE.Custom('EventTitleDisease')]: Um Assassino em Nosso Meio"
 health.2101.typhus_outbreak.desc:0 "Um perigoso caso de tifo se infiltrou na corte. Erupções cutâneas, tosse e febre acometem os afligidos."
 health.2101.typhus_spreads.desc:0 "Outro caso de tifo surgiu."
 health.2102.1_victim.desc:0 "\n\nNo entanto, o caminho para a recuperação é longo. Perdemos [victim_1.Custom2('MyCharacterIntroduction', ROOT.Char)] e muitos outros. A vida continua, mas as cicatrizes permanecem."
 health.2102.2_victims.desc:0 "\n\nNo entanto, o caminho para a recuperação é longo. Perdemos [victim_1.Custom2('MyCharacterIntroduction', ROOT.Char)] e [victim_2.Custom2('MyCharacterIntroduction', ROOT.Char)], entre muitos outros. A vida continua, mas as cicatrizes permanecem."
 health.2102.a.dead.tt:0 "[THIS.Char.GetShortUIName] morreu durante o surto"
 health.2102.a.dead_and_survivors.tt:0 "#N [THIS.Var('dead_victims_num').GetValue|0]#! vítimas morreram e #P [THIS.Var('surviving_victims_num').GetValue|0]#! sobreviveram na corte"
 health.2102.a.no_dead.tt:0 "#P [THIS.Var('surviving_victims_num').GetValue|0]#! vítimas morreram na corte"
 health.2102.a.no_survivors.tt:0 "#N [THIS.Var('dead_victims_num').GetValue|0]#! vítimas morreram na corte"
 health.2102.a.no_victim:0 "Finalmente, estamos seguros."
 health.2102.a.surviving.tt:0 "[THIS.Char.GetShortUIName] ficou doente, mas se recuperou durante o surto"
 health.2102.a.victim:0 "Finalmente, podemos descansar. E lamentar."
 health.2102.bubonic_plague.desc:0 "peste"
 health.2102.no_physician.desc:0 "As vítimas se recuperaram ou partiram deste mundo; não há mais doença restante."
 health.2102.physician.desc:0 "As vítimas se recuperaram ou partiram deste mundo.\n\n[physician.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me garante que todos os corpos foram devidamente tratados e que a ameaça desapareceu completamente."
 health.2102.root_victim.desc:0 "\n\nAlgumas noites, ainda acordo em um suor frio, paralisad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] pelo medo. Eu sobrevivi, mas as cicatrizes — aquelas na minha pele e aquelas na minha mente — permanecerão por muitos anos."
 health.2102.smallpox.desc:0 "varíola"
 health.2102.start1.desc:0 "O surto de"
 health.2102.start2.desc:0 "que devastou minha corte finalmente acabou."
 health.2102.t:0 "[SCOPE.Custom('EventTitleDisease')]: Um Novo Dia"
 health.2201.a:0 "Este é um inimigo do qual não posso [Select_CString( sick_character.IsFemale, 'protege-la', 'protege-lo' )]."
 health.2201.court_physician.desc:0 "\n\nO médico quer saber como tratar [Select_CString( sick_character.IsFemale, 'minha', 'meu' )] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))]."
 health.2201.court_physician.desc_sick_physician:0 "\n\n[sick_character.GetSheHe|U] pode ser [Select_CString( sick_character.IsFemale, 'minha médica', 'meu médico' )], mas [sick_character.GetSheHe] ainda busca minha orientação."
 health.2201.leprosy.desc:0 "\n\nEmbora [sick_character.GetSheHe] possa viver muitos anos, a sua deformidade fará com que [sick_character.GetSheHe] seja evitad[Select_CString( sick_character.IsFemale, 'a', 'o' )] e desconfiad[Select_CString( sick_character.IsFemale, 'a', 'o' )]. Nem mesmo eu consigo suprimir meu nojo ao pensar em lesões crescendo por toda a sua pele..."
 health.2201.lethal_disease.desc:0 "\n\nA aflição mata impiedosamente, ceifando jovens e velhos, pobres e ricos, homens e mulheres. Temo que este seja o fim. Apenas um milagre pode salvar [sick_character.GetSheHe]."
 health.2201.major_disease.desc:0 "\n\nO futuro é incerto. A morte ronda de perto o leito [sick_character.GetHerHim], mas nem tudo está perdido. [sick_character.GetFirstNameNoTooltip] pode sobreviver, se a sorte estiver ao seu lado.\n\nApenas [ROOT.Char.GetFaith.FateGodName] sabe o destino [sick_character.GetHerHim]."
 health.2201.minor_disease.desc:0 "\n\nNormalmente, uma aflição tão leve não seria motivo de grande preocupação, mas a saúde de [sick_character.GetFirstName] é frágil e isso pode ser demais para [sick_character.GetSheHe]."
 health.2201.start.desc:0 "Notícias graves me alcançam. [Select_CString( sick_character.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))] [sick_character.GetFirstName] adoeceu com"
 health.2201.t:0 "[SCOPE.Custom('EventTitleDisease')]: [Select_CString( sick_character.IsFemale, 'Minha', 'Meu' )] pobre [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))|U]"
 health.2202.a.angry:0 "Que infelicidade..."
 health.2202.a.happy:0 "Ótimas notícias! Glórias a [ROOT.Char.GetFaith.HealthGodName]!"
 health.2202.a.neutral:0 "Sortudo."
 health.2202.a.relieved:0 "Minha corte está um pouco mais segura."
 health.2202.desc.angry:0 "\n\nComo isso pôde acontecer? Por que comigo, [ROOT.Char.GetFaith.HealthGodName]? #EMP Por quê!?#!"
 health.2202.desc.happy:0 "\n\n[Select_CString( sick_character.IsFemale, 'Minha amada', 'Meu amado' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))] está bem novamente! É difícil não derramar uma lágrima de alegria..."
 health.2202.desc.neutral:0 "\n\nDou a [sick_character.GetSheHe] um aceno solene."
 health.2202.desc.relieved:0 "\n\nUm peso enorme é retirado dos meus ombros quando [sick_character.GetSheHe] me cumprimenta, e eu luto para conter uma lágrima de alívio."
 health.2202.desc:0 "Enquanto caminho pelos corredores, ouço uma risada abafada. Aquela voz... não estou acostumado a ouvi-la tão clara e animada.\n\nEmpurro a porta entreaberta e lá na minha frente está [Select_CString( sick_character.IsFemale, 'minha', 'meu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))] [sick_character.GetFirstName], aparentemente recuperada de"
 health.2202.t:0 "[SCOPE.Custom('EventTitleDisease')]: Humores Equilibrados"
 health.3001.a.aptitude:0 "[aptitude|E] de [high_skill_option.GetUINamePossessive|U] é [high_skill_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_physician_court_position' ) )]"
 health.3001.a.tt:0 "Um [GetCourtPositionType('court_physician_court_position').GetName()] também tem um salário mensal de [gold_i][SCOPE.ScriptValue('court_position_physician_salary')]"
 health.3001.a:0 "Aparentemente, [high_skill_option.GetFirstNameNoTooltip] é bastante experiente."
 health.3001.already_sick.desc:0 "Finalmente, meus servos encontraram algumas pessoas que podem ser aptas a servir como meu médico. De qualquer forma, receio que não posso ser exigente agora."
 health.3001.b.aptitude:0 "[aptitude|E] de [low_skill_option.GetUINamePossessive|U] é [low_skill_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_physician_court_position' ) )]"
 health.3001.b:0 "[low_skill_option.GetFirstNameNoTooltip] parece entusiasmad[Select_CString( low_skill_option.IsFemale, 'a', 'o' )], se nada mais."
 health.3001.c.aptitude:0 "[aptitude|E] de [mystic_option.GetUINamePossessive|U] é [mystic_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_physician_court_position' ) )]"
 health.3001.c:0 "[mystic_option.GetFirstNameNoTooltip] afirma estar treinado em 'medicina alternativa'."
 health.3001.d.more:0 "Nenhum deles me impressiona."
 health.3001.d.tt:0 "Eu não recruto ninguém como [GetCourtPositionType('court_physician_court_position').GetName()]"
 health.3001.d.two:0 "Ambos não me impressionam."
 health.3001.decision.desc:0 "Este mundo está cheio de perigos, até mesmo para um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleTierName] e para seus [ROOT.Char.Custom('GetCourtierPlural')|l]. A meu pedido, meus criados fizeram consultas em busca de recomendações. Agora eles reuniram algumas opções para escolher."
 health.3001.disease.t:0 "[SCOPE.Custom('EventTitleDisease')]:"
 health.3001.e.aptitude:0 "[aptitude|E] de [excellent_skill_option.GetUINamePossessive] é [excellent_skill_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_physician_court_position' ) )]"
 health.3001.e:0 "[excellent_skill_option.GetFirstNameNoTooltip] é amplamente conhecid[Select_CString( excellent_skill_option.IsFemale, 'a', 'o' )] nos círculos acadêmicos."
 health.3001.fallback_reason.desc:0 "Este mundo está cheio de perigos, até mesmo para um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleTierName] e para sua [ROOT.Char.Custom('GetCourt')|l].\n\nPerguntei por aí por recomendações e reuni algumas opções para escolher."
 health.3001.t:0 "Médico da [ROOT.Char.Custom('GetCourt')|U]"
 health.3101.a:0 "Faça apenas o necessário."
 health.3101.b:0 "É tarde demais para cautela!"
 health.3101.c:0 "Estou [Select_CString( ROOT.Char.IsFemale, 'disposta', 'disposto' )] a... tentar coisas novas."
 health.3101.d:0 "Deixem-me em paz!"
 health.3101.e.already_looking:0 "Em breve! A ajuda está a caminho!"
 health.3101.e.tt:0 "Meus servos buscarão possíveis candidatos a [GetCourtPositionType('court_physician_court_position').GetName()]"
 health.3101.e:0 "Chamem um médico! Agora!"
 health.3101.e_sick_physician:0 "Preciso de um novo médico!"
 health.3101.end.desc:0 "a escolha é sua, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord]."
 health.3101.f:0 "Oh [ROOT.Char.GetFaith.HighGodName], vou morrer assim...!?"
 health.3101.mystic_recommendation.desc:0 "Se me permitem ser [Select_CString( physician.IsFemale, 'audaciosa', 'audacioso' )], gostaria de recomendar um... tratamento alternativo. Mas"
 health.3101.risky_recommendation.desc:0 "Eu recomendaria medidas drásticas, mas"
 health.3101.safe_recommendation.desc:0 "Embora eu esteja bastante [Select_CString( physician.IsFemale, 'certa', 'certo' )] de que um simples tônico seria suficiente,"
 health.3101.start.desc:0 "O sombrio cheiro de tônicos borbulhantes e pomadas amassadas assalta meus sentidos enquanto eu me dirijo à sala de trabalho [Select_CString( physician.IsFemale, 'da minha médica', 'do meu médico' )], [physician.GetFirstNamePossessive]. [physician.GetSheHe|U] olha para cima de uma unção que [physician.GetSheHe] está preparando.\n\n\"Chegou a hora, [ROOT.Char.Custom('FormOfAddressForLiege')]. Conheço várias maneiras de tratar o seu"
 health.3101.t:0 "[SCOPE.Custom('EventTitleDisease')]: Hora do Tratamento"
 health.3101.tutorial.tt:0 "Escolher esta opção irá mostrar como nomear um [GetCourtPositionType('court_physician_court_position').GetName()], que talvez possa curar sua doença."
 health.3102.a:0 "Seja cauteloso. Faça apenas o necessário."
 health.3102.b:0 "Chegou a hora de medidas drásticas."
 health.3102.c:0 "Apenas uma força superior pode salvar [sick_character.GetSheHe] agora."
 health.3102.c_sick_physician:0 "Apenas uma força superior pode te salvar agora."
 health.3102.d:0 "Não haverá tratamento."
 health.3102.e_adult:0 "A escolha é [Select_CString( sick_character.IsFemale, 'da minha', 'do meu' )] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))]."
 health.3102.e_child:0 "Confio em seu julgamento."
 health.3102.preamble:0 "A escuridão do ambiente é um pouco dissipada pelas chamas crepitantes. Na mesa do médico repousa [sick_character.GetFirstName], seu corpo rígido de antecipação nervosa.\n\n"
 health.3102.start.desc:0 "É hora de decidir como tratar [sick_character.GetFirstNamePossessive]"
 health.3102.start.desc_sick_physician:0 "É hora de decidir como tratar meu"
 health.3102.t:0 "[SCOPE.Custom('EventTitleDisease')]: [Select_CString( sick_character.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))|U] está Doente"
 health.3102.treatment:0 "Vários tratamentos potenciais estão disponíveis, variando do típico ao unorthodoxo. Cabe a mim decidir qual se adequa melhor às necessidades específicas de [sick_character.GetFirstNamePossessiveNoTooltip]."
 health.3103.a:0 "Excelente trabalho, [physician.GetFirstNameNoTooltip]."
 health.3103.end.desc:0 "acabou sendo exatamente o que eu precisava. Por enquanto, os piores sintomas foram aliviados, e o mundo parece um pouco mais brilhante."
 health.3103.t:0 "[SCOPE.Custom('EventTitleDisease')]: Um Pouco Melhor"
 health.3104.a:0 "Vá embora. Quero descansar..."
 health.3104.end.desc:0 "não fez nada para melhorar meu estado. Na verdade, acho que me sinto pior!"
 health.3104.t:0 "[SCOPE.Custom('EventTitleDisease')]: Ainda Pior"
 health.3105.a:0 "É um milagre!"
 health.3105.end.desc:0 "\n\nCuriosamente, eu já não sinto mais nenhum sintoma..."
 health.3105.t:0 "[SCOPE.Custom('EventTitleDisease')]: Um Milagre Médico"
 health.3106.a:0 "Viverei para ver outro dia."
 health.3106.end.desc:0 "\n\nO tratamento foi quase tão desagradável quanto os meus sintomas, mas parece ter sido eficaz. Embora eu não esteja completamente curado, me sinto muito melhor."
 health.3106.t:0 "[SCOPE.Custom('EventTitleDisease')]: Humores Equilibrados"
 health.3107.a:0 "Sinto-me... fraco..."
 health.3107.b:0 "Isso não acontecerá novamente. Você me entende?"
 health.3107.c:0 "Todos sabíamos dos riscos. Você está perdoado."
 health.3107.d.tt:0 "Uma vez na minha prisão, posso decidir o que fazer com [physician.GetTitledFirstName]"
 health.3107.d:0 "Guardas! Prendam [physician.GetSheHe] e coloquem [physician.GetSheHe] sob chave!"
 health.3107.death.desc:0 "\n\nQuando acordei, pude sentir nos meus ossos. Algo deu errado. Muito, muito errado."
 health.3107.e:0 "Esse traidor merece morrer!"
 health.3107.end.desc:0 "\n\nPensei que seria impossível me sentir pior do que já me sentia, mas [physician.GetFirstNameNoTooltip] com certeza provou que eu estava errado!"
 health.3107.f:0 "Oh [physician.GetFirstNameNoTooltip], o que você fez a si mesmo?"
 health.3107.t:0 "[SCOPE.Custom('EventTitleDisease')]: Tratamento Desastroso"
 health.3108.a:0 "Não sei como me sentir... Ou no que acreditar."
 health.3108.end.desc:0 "\n\nQuando acordei esta manhã, as dores e desconfortos aos quais me acostumei tinham desaparecido. [physician.GetSheHe]... me curou?"
 health.3108.t:0 "[SCOPE.Custom('EventTitleDisease')]: Um Poder Maior"
 health.3109.a:0 "Não sei o que eu esperava, mas não era isso."
 health.3109.end.desc:0 "\n\nAinda não tenho certeza de como me sinto em relação ao que aconteceu, mas não posso negar que a maioria dos meus sintomas desapareceu desde então."
 health.3109.t:0 "[SCOPE.Custom('EventTitleDisease')]: Sentimentos Conflitantes"
 health.3110.end.desc:0 "\n\nMinha mente deve ter sido alterada, distorcida por algum truque sombrio. Eu nunca teria concordado com isso voluntariamente. As memórias me assombram..."
 health.3110.t:0 "[SCOPE.Custom('EventTitleDisease')]: Na Escuridão"
 health.3200.death.desc:0 "Embora eu possa reconhecer que o rosto é de [sick_character.GetTitledFirstNamePossessive], ele ainda não se parece em nada com [sick_character.GetSheHe]. [sick_character.GetSheHe|U] não está mais... aqui. O restante do corpo está envolto em um sudário espesso, cobrindo os detalhes horríveis do fracasso de [physician.GetTitledFirstNamePossessive]."
 health.3200.death.tt:0 "[sick_character.GetTitledFirstName] morreu durante o tratamento."
 health.3200.end.desc:0 "\n\n[Select_CString( physician.IsFemale, 'A médica', 'O médico' )] [physician.Custom2('InsultAdjective', ROOT.Char)] está parad[Select_CString( physician.IsFemale, 'a', 'o' )] no canto da sala, ansiosamente torcendo as mãos..."
 health.3200.failure.desc:0 "Leva um momento para eu reconhecer [sick_character.GetTitledFirstName]. [sick_character.GetSheHe|U] está tão machucado e inchado que mal parece humano. Ao segurar a mão [sick_character.GetHerHim], [Select_CString( sick_character.IsFemale, 'minha', 'meu' )] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))] tenta falar, mas nenhum som sai de seus lábios."
 health.3200.failure.desc_2:0 "Ao me aproximar d[Select_CString( sick_character.IsFemale, 'a', 'o' )] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))] [ROOT.Char.Custom('GetChambersOrTent')] de [sick_character.GetTitledFirstNamePossessive], ouço um grito horrível; quase desumano e cheio de dor. Entro apressado no quarto apenas para encontrar [sick_character.GetFirstNameNoTooltip] desabado no chão, #EMP coberto#! de sangue."
 health.3200.failure.desc_3:0 "Leva um momento para eu entender a extensão completa do dano que [sick_character.Custom2('MyCharacterIntroduction', ROOT.Char)] causou em seu próprio corpo; [sick_character.GetSheHe] está cobert[Select_CString( sick_character.IsFemale, 'a', 'o' )] de uma quantidade obscena de sangue e ainda empunhando uma faca com movimentos vigorosos. Antes que eu possa intervir, [sick_character.GetSheHe] fixa um olhar desapontado na lâmina afiada antes de desmaiar."
 health.3201.c:0 "Não diga uma palavra sobre isso, [physician.GetFirstNameNoTooltip]!"
 health.3201.desc:0 "Há algo selvagem nos olhos de [sick_character.GetFirstNamePossessive]. Pergunto a [sick_character.GetSheHe] o que [sick_character.GetSheHe] viu, mas nenhuma palavra sai de seus lábios.\n\n"
 health.3201.occult.desc:0 "Um servo me diz que [physician.GetTitledFirstName] realizou algum tipo de ritual maligno, que é a causa do sofrimento de [sick_character.GetFirstNamePossessive]. A história é macabra, para dizer o mínimo."
 health.3201.occult.desc_sick_physician:0 "Um servo me diz que [physician.GetTitledFirstName] realizou algum tipo de ritual maligno, que é a causa do seu sofrimento. A história é macabra, para dizer o mínimo."
 health.3201.questionable.desc:0 "Parece que um dos \"tratamentos alternativos\" de [physician.GetFirstNamePossessive] deu terrivelmente errado."
 health.4000.a:0 "Não há nada que possa ser feito."
 health.4000.close_to_death_wounded.desc:0 "e a ferida é muito profunda. Cada respiração [sick_character.GetHerHim] é uma batalha, e receio que somente um milagre possa salvá-l[Select_CString( sick_character.IsFemale, 'a', 'o' )]."
 health.4000.gangrene.desc:0 "e sua carne está com mau cheiro e morta.\n\nA escuridão está se espalhando por sua pele, e somente [ROOT.Char.GetFaith.FateGodName] sabe se [sick_character.GetSheHe] sobreviverá."
 health.4000.infected_wound.desc:0 "e sua carne está com mau cheiro e inchada.\n\nSe o tratamento certo for administrado e [ROOT.Char.GetFaith.HealthGodName] for misericordioso, [sick_character.GetSheHe] deverá se recuperar."
 health.4000.start.desc:0 "[Select_CString( sick_character.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))] [sick_character.GetTitledFirstName] está [Select_CString( sick_character.IsFemale, 'ferida', 'ferido' )],"
 health.4000.t:0 "$health_wounded_title$ [Select_CString( sick_character.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))] [Select_CString( sick_character.IsFemale, 'Ferida', 'Ferido' )]"
 health.4000.very_wounded.desc:0 "e a ferida é profunda. Temo que o corpo [sick_character.GetHerHim] não seja forte o suficiente para lutar sozinho; sinto a morte rondando à beira de sua cama."
 health.4000.wounded.desc:0 "e [sick_character.GetSheHe] claramente está sentindo dor. A aflição é leve, mas problemas do corpo não devem ser subestimados."
 health.4001.gangrene.desc:0 "Como a morte já está se espalhando pela carne, temo que seja necessário... #EMP medidas drásticas#!, mas"
 health.4001.infection.desc:0 "Como a ferida está infectada, preciso recomendar medidas drásticas, mas"
 health.4001.risky_recommendation.desc:0 "Recomendo medidas drásticas, mas"
 health.4001.safe_recommendation.desc:0 "Tenho certeza de que um tratamento simples será suficiente, mas"
 health.4001.start.desc:0 "Chegou a hora de tratar suas feridas."
 health.4002.start.desc:0 "Chegou a hora de tratar s[Select_CString( sick_character.IsFemale, 'ua', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))]."
 health.4002.start.desc_sick_physician:0 "Chegou a hora de me tratar."
 health.4101.a:0 "Excelente trabalho, [physician.GetFirstNameNoTooltip]!"
 health.4101.desc_1:0 "Quando [physician.GetFirstName] despejou uma garrafa de vinho sobre minha ferida, a dor era maior do que tudo o que a própria lesão me causou.\n\n\"Por favor, suporte, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleTierName]. É necessário para dissipar a corrupção interior.\"\n\nE de fato, após enfaixar a ferida firmemente, isso"
 health.4101.desc_2:0 "[physician.GetFirstName] rapidamente enfiou uma agulha e começou a trabalhar em minha ferida como se estivesse fazendo costura ao redor do fogo. A visão resultante dos pontos segurando minha carne juntos era macabra! Com o passar do tempo,"
 health.4101.desc_end:0 "a ferida começou a cicatrizar."
 health.4101.desc_infection:0 "Quando [physician.GetFirstName] começou a amassar gentilmente ervas e mel juntos, pensei que [physician.GetSheHe] estava brincando - certamente vegetação não poderia me ajudar. Conforme [physician.GetSheHe] espalhava a cataplasma sobre minha ferida dolorida, isso"
 health.4101.t:0 "$health_wounded_title$ Cura"
 health.4102.a:0 "Argh...! Não me toque!"
 health.4102.desc_end:0 "não fez nada para equilibrar meus humores, e a dor só piorou."
 health.4102.desc_infection:0 "A bolsa que [physician.GetFirstName] trouxe para o meu [ROOT.Char.Custom('GetChambersOrTent')] se mexia sozinha, o interior se contorcendo como se estivesse vivo. Quando [physician.GetFirstNameNoTooltip] retirou uma sanguessuga se debatendo, senti meu rosto ficar pálido. \"Apenas fique parado agora, meu [ROOT.Char.GetTitleTierName]...\"\n\nSeja qual fosse o efeito que [physician.GetSheHe] esperava, certamente não era este; enquanto as criaturas me sangravam, isso"
 health.4102.t:0 "$health_wounded_title$ Dor"
 health.4103.end.desc:0 "\n\nPara minha surpresa, logo descobri que meu corpo estava se recuperando!"
 health.4103.risky_treatment_disfigurement.1.desc:0 "[physician.GetFirstName] viu meu horror quando [physician.GetSheHe] tirou uma faca comprida e uma agulha torta de sua bolsa. 'Para que seu corpo se cure, precisamos remover todo tecido afetado e fechar a ferida.'\n\nEu não sei o que dói mais - a dor abrasadora da carne rasgada e a sensação de puxão da agulha pela pele, ou a visão de mim mesmo depois."
 health.4103.risky_treatment_medicine.1.desc:0 "Quando [physician.GetFirstName] acendeu uma fogueira no meu [ROOT.Char.Custom('GetChambersOrTent')], presumi que [physician.GetSheHe] pretendia que o calor ajudasse a equilibrar meus humores. No entanto, quando o assistente [physician.GetHerHim] começou a me amarrar à cama, notei a barra de ferro esquentando nas chamas."
 health.4103.t:0 "$health_wounded_title$ Mãos Curativas"
 health.4104.end.desc:0 "\n\nDepois de passar por aquele tratamento, é difícil encontrar alegria na recuperação do meu corpo, mas estou em recuperação."
 health.4104.t:0 "$health_wounded_title$ Em Recuperação"
 health.4105.end.desc:0 "\n\nEu não acreditava que poderia sentir mais dor, mas logo fui provado errado."
 health.4105.t:0 "$health_wounded_title$ O Desastre Acontece"
 health.6001.a:0 "Encontrarei um prédio alto o suficiente."
 health.6001.a_tribal:0 "Encontrarei um penhasco alto o suficiente."
 health.6001.b:0 "Chá preparado com uma planta letal... Parece quase palatável."
 health.6001.c:0 "Um banho quente e uma faca afiada devem bastar."
 health.6001.d:0 "Não tenho mais certeza de que é isso que quero fazer."
 health.6001.d_tt:0 "Não farei a tentativa"
 health.6001.desc_depression:0 "O sofrimento parece interminável."
 health.6001.desc_ending:0 "\n\nO que ainda preciso decidir é como farei isso..."
 health.6001.desc_loss:0 "Não suporto mais uma perda."
 health.6001.desc_lunacy:0 "As sombras falaram, e logo me juntarei a elas."
 health.6001.desc_opening:0 "Vou acabar com a minha vida. Não consigo controlar a tristeza que cresce em meu coração pensando em tudo o que deixarei para trás, mas minha mente está decidida."
 health.6001.desc_sickness:0 "Meu corpo se tornou uma prisão, definhaldo..."
 health.6001.desc_stress:0 "Não aguento mais isso."
 health.6001.t:0 "A Tentativa"
 health.6001.warning:0 "Sempre há uma chance de que a tentativa falhe"
 health.6002.a:0 "Não há nada que você possa fazer para me impedir."
 health.6002.a_failure:0 "Sua tentativa falha"
 health.6002.a_success:0 "Sua tentativa é bem-sucedida"
 health.6002.b:0 "Você está certo. As coisas ainda podem melhorar."
 health.6002.desc_ending:0 "\n\n\"[ROOT.Char.GetFirstNameNoTooltip]! Não faça isso, [friendly_person.Custom2('RelationToMeShort', ROOT.Char)]!\"\n\nMe viro e vejo [friendly_person.GetTitledFirstName] parado lá, estendendo a mão em minha direção com uma expressão de terror. \"Por favor, este não é o caminho.\""
 health.6002.desc_fall:0 "Enquanto me aproximo da beirada, o vento agarra o tecido da minha roupa e o chicoteia ao meu redor. É uma queda longa."
 health.6002.desc_knife:0 "Sentado no banho quente, inalo o vapor enquanto alcanço a faca afiada ao meu lado."
 health.6002.desc_poison:0 "À medida que o chá ferve, o ar se enche de um odor fétido, como se me lembrasse de seu propósito. Despejo o líquido em uma xícara. Ele esfria rapidamente, e levanto a xícara em direção aos lábios."
 health.6004.a:0 "Livre, finalmente."
 health.6004.desc:0 "Um pequeno passo para fora da beirada, isso é tudo o que é necessário. Com o vento uivando ao meu redor, levanto o pé e avanço.\n\nPor um momento, parece que estou suspenso no ar, o mundo girando ao meu redor, e então tudo acontece muito rápido. O vento em meus ouvidos, a sensação de queda, o chão se aproximando..."
 health.6005.a:0 "Meus planos, arruinados..."
 health.6005.desc:0 "Um pequeno passo para fora da beirada, isso é tudo o que é necessário. Com o vento uivando ao meu redor, levanto o pé e–\n\nSou abruptamente puxado para trás, um guarda me segurando."
 health.6005.desc_ending:0 "\"Desculpe-me, [ROOT.Char.Custom('FormOfAddressForLiege')], mas você não está em seu juízo perfeito!\""
 health.6007.desc:0 "Respiro os vapores que saem da xícara de chá em minhas mãos e fecho os olhos. Lentamente, levanto a borda até meus lábios e dou um longo gole. Engulo.\n\nLogo o mundo começa a ficar cinza e indistinto, a escuridão se aproximando da borda da minha visão, e deito minha cabeça na mesa. Sinto minha respiração ficando cada vez mais curta. Fecho os olhos."
 health.6008.desc:0 "Respiro os vapores que saem da xícara de chá em minhas mãos e fecho os olhos. Lentamente, levanto a borda até meus lábios e–\n\nA xícara é arrancada da minha mão e jogada no chão, onde se despedaça. Um guarda está acima de mim, pânico em seus olhos."
 health.6010.desc:0 "O vapor do meu banho quente está pairando ao meu redor e respiro fundo enquanto pego a faca ao meu lado. A descanso suavemente em um dos meus braços e então pressiono. Com força.\n\nQuando tenho dois cortes idênticos em ambos os braços, deixo-os afundar na água que está rapidamente avermelhando. Inclino minha cabeça para trás e suspiro, pois o mundo começa a girar. Não vai demorar mais..."
 health.6011.desc:0 "Justo quando estou prestes a cortar meu braço com a faca, o vapor do banho quente pairando ao meu redor, guardas arrombam a porta e rapidamente arrancam a faca das minhas mãos."
 health.6100.a:0 "Estou melhor, obrigado."
 health.6100.b:0 "Como estou não é da sua conta."
 health.6100.desc:0 "\"Olá, [ROOT.Char.GetTitledFirstNameNoTooltip]. Eu só queria fazer uma visita, para perguntar como você está desde... o incidente algum tempo atrás.\"\n\n[friendly_person.GetTitledFirstName] me pergunta com genuíno calor, e nem mesmo a menção da minha tentativa de suicídio pode silenciar completamente isso."
 health.6200.a:0 "\"[close_person.GetFirstNameNoTooltip]... Por favor... Acabe com isso...\""
 health.6200.a_failure:0 "[close_person.GetSheHe|U] me nega"
 health.6200.a_failure_tt:0 "Você não morre"
 health.6200.a_success:0 "[close_person.GetSheHe|U] concorda em fazer isso"
 health.6200.b:0 "Não posso pedir isso a [close_person.GetSheHe]. Um serviçal deve fazer isso..."
 health.6200.b_2:0 "Um serviçal deve fazer isso..."
 health.6200.b_failure:0 "Nenhum serviçal concorda"
 health.6200.b_success:0 "Um serviçal atende ao seu desejo"
 health.6200.desc:0 "As únicas pessoas que vêm me visitar ultimamente são os serviçais, mas eu preciso de #EMP alguém#! para me libertar..."
 health.6200.desc_close_person:0 "\n\nDeve ser [Select_CString( close_person.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('close_person'))] [close_person.GetTitledFirstName], uma das poucas pessoas que vêm me visitar ultimamente. Tento alcançar [close_person.GetSheHe], mas minhas mãos nem sequer se mexem..."
 health.6200.desc_opening:0 "Em um raro momento de clareza, sinto alguém ao meu lado na cama."
 health.6203.a:0 "Eu... Eu entendo..."
 health.6203.b:0 "Não! Como você pode pedir algo assim de mim?!"
 health.6203.desc:0 "Sento-me ao lado da cama de [incapable_person.GetTitledFirstNamePossessive] quando [incapable_person.GetSheHe] de repente parece quase acordar, os olhos vagando para cima. Desde que [incapable_person.GetSheHe] ficou preso a esta cama, [incapable_person.GetSheHe] mal disse uma palavra, mas de repente o silêncio é rompido por uma voz rouca.\n\n\"[ROOT.Char.GetFirstNameNoTooltip]? [ROOT.Char.GetFirstNameNoTooltip], por favor... Acabe com isso. Misericórdia...\"\""
 health.6203.desc_murder:0 "\n\n[incapable_person.GetSheHe] não faz ideia de que está se encaixando perfeitamente nos meus planos!"
 health.6204.a:0 "Livre, finalmente..."
 health.6204.desc_1:0 "Depois de um tempo, sinto movimento e, então, sinto uma pressão suave contra o meu rosto. A pressão aumenta e descubro que não consigo respirar, e sou preenchido por nada além de... Gratidão. [close_person.GetSheHe|U] concordou. [close_person.GetSheHe|U]..."
 health.6204.desc_2:0 "Depois de um tempo, sinto movimento e, então, sinto uma pressão fria e afiada contra o meu pescoço. Mal sinto o corte. Mas ouço a inspiração [close_person.GetHerHim], ouço a faca cair no chão, ouço um ruído agudo nos meus ouvidos... E então... Nada."
 health.6204.desc_opening:0 "Não consigo entender a resposta de [close_person.GetTitledFirstName], mas [close_person.GetSheHe] não sai do meu lado.\n\n"
 health.6205.a:0 "Não... Por favor... Volte..."
 health.6205.desc_1:0 "Depois de um tempo, sinto movimento e, então, sinto uma pressão suave contra o meu rosto. A pressão aumenta e descubro que não consigo respirar, e sou preenchido por nada além de... Gratidão. Quando estou prestes a desmaiar, o ar volta correndo para os meus pulmões. Ouço choro e uma voz histérica. Ouço passos deixando o quarto."
 health.6205.desc_2:0 "Depois de um tempo, sinto movimento, e então sinto uma pressão fria e afiada contra o meu pescoço. A pressão aumenta e – e eu ouço a faca cair no chão. Ouço choros, uma voz suplicante, passos saindo do [ROOT.Char.Custom('GetRoom')]."
 health.6206.desc:0 "\"[ROOT.Char.GetFirstNameNoTooltip]...\""
 health.6207.a:0 "\"[servant.GetFirstNameNoTooltip]... Por favor... Acabe com isso...\""
 health.6207.a_failure:0 "[servant.GetSheHe|U] me nega"
 health.6207.a_success:0 "[servant.GetSheHe|U] concorda em fazer isso"
 health.6207.desc:0 "Da próxima vez que um serviçal entrar no quarto, luto para superar a névoa em minha mente, a letargia do meu corpo.\n\n\"Você... Quem...?\"\n\n\"Eu, [ROOT.Char.Custom('FormOfAddressForLiege')]?\" Passos rapidamente chegam ao meu lado na cama. \"Eu sou [servant.GetFirstName]. Há algo que eu possa fazer por você?\""
 health.6209.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Eu nunca poderia...! Como você pode sequer pedir algo assim...\""
 health.6209.desc_refusal:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Eu...\""
 health.6210.a:0 "[close_person.GetSheHe] também me abandonou?"
 health.6210.desc:0 "Estou esperando. Isso eu consigo lembrar mesmo através da névoa em minha mente - estou esperando pela ajuda que [close_person.GetTitledFirstName] pode me dar, mas ela não vem. Por quê...? Por que [close_person.GetSheHe] não vem?"
 health.7000.a.lazy:0 "Pelo menos posso ficar deitado o dia todo..."
 health.7000.a:0 "Quanto tempo terei que esperar?"
 health.7000.desc:0 "Eu sabia que envelhecer significaria fazer tudo mais devagar, mas não imaginava que tudo chegaria a uma paralisação até a minha morte. Ultimamente, sinto uma malaise constante e tudo exige mais esforço do que antes. Estou preocupado que, se eu me deitar, talvez não consiga mais me levantar. Não há dúvidas de que o meu tempo está se esgotando."
 health.7000.desc_closing:0 "\n\nSinto que só me resta aguardar o doce abraço da morte me reclamar."
 health.7000.desc_collapse:0 "Eu sei que estava me excedendo - deveria apenas ter ouvido o que meu corpo estava me dizendo, mas escolhi ignorar. 'Vou terminar isso antes de ir para a cama; só mais um pouco, e então descanso.' De repente, senti tontura e, ao levantar, minha visão escureceu.\n\nNo dia seguinte, acordei em minha cama, incapaz de me levantar, já que meu corpo se recusa a me obedecer. Talvez [ROOT.Char.GetFaith.HighGodName] tenha decidido me punir por não tratar esse vaso destinado a servir [ROOT.Char.GetFaith.HighGodNameAlternate] com respeito."
 health.7000.t:0 "Prisioneiro do Meu Próprio Corpo"
 health.7100.a:0 "Minha existência é uma tortura."
 health.7100.desc:0 "Que dia é hoje? Quanto tempo estive descansando desta vez?\n\nEncontro-me examinando os rostos dos meus frequentes visitantes em busca de qualquer indicação - rugas ou cicatrizes - #bold qualquer coisa#! que sirva como prova de que o tempo ainda passa. De alguma forma, as interações que tenho com os outros parecem estar falando #bold sobre#! mim, não #bold comigo#!.\n\nAinda sou eu, ou uma alma separada do meu corpo? Estou vivendo ou apenas existindo?"
 health.7200.a:0 "Acho que devo voltar para a cama..."
 health.7200.desc:0 "Espere um minuto, por que estou aqui? Eu não vim para cá... ou vim? Estou procurando alguma coisa?\n\nTalvez não tenha sido nada... espere, no que eu estava pensando mesmo?\n\nMinha cabeça dói..."
 health.7200.t:0 "Onde estou?"
 health.7300.a:0 "O mundo parece sem graça e sem cor."
 health.7300.desc:0 "O sol sempre foi tão brilhante assim? Seus raios ferem meus olhos como pontas de lança, é melhor eu me abrigar na sombra...\n\n...as sombras sempre foram tão fracas assim?"
 health.7300.t:0 "Visão Turva"
 health.7400.a:0 "Acho melhor ir com calma."
 health.7400.desc:0 "Meu peito está apertado — e estou sem fôlego como nunca antes, ofegante como um cachorro em um dia quente. Uma dor leve surge na minha mandíbula, depois desce pelo meu braço, e então passa...\n\nMas, eu não fiz nada?"
 health.7400.t:0 "Coração Debilitado"
 health.7500.a:0 "Devo prestar mais atenção por onde piso."
 health.7500.desc:0 "Ai! Por que minhas costas doem tanto? Eu apenas tropecei ao me levantar da cama, um pequeno deslize...\n\nSem hematomas, sem ferimentos, mas uma dor irradiando por toda a minha coluna.\n\nCom certeza vai passar."
 health.7500.t:0 "Ossos Doloridos"
 health.mystic_treatment_occult.1.desc:0 "Confinado à minha cama, os servos me disseram que a fumaça da pira funerária podia ser vista por quilômetros. A vida de mais de duas dezenas de belos animais havia sido encerrada naquela noite, em um grande sacrifício. Conforme as ordens de [physician.GetTitledFirstName], tenho esfregado minha pele com as cinzas por quinze dias."
 health.mystic_treatment_occult.2.desc:0 "[physician.GetTitledFirstName] me instruiu a entrar na banheira vazia e me deixou para me despir em particular. O retorno [physician.GetHerHim] foi anunciado por um alto \"baa!\" [physician.GetSheHe|U] foi seguido por um servo e meia dúzia de cabras. Com habilidade, [physician.GetFirstNameNoTooltip] pegou as cabras e cortou suas gargantas sobre a banheira, uma por uma.\n\nAs manchas no chão não desaparecerão."
 health.mystic_treatment_occult.3.desc:0 "[physician.GetTitledFirstName] me disse que [ROOT.Char.GetFaith.HealthGodName] exige um sacrifício. Mais tarde naquela noite, ouvi gritos.\n\nSeguindo o som, encontrei [physician.GetFirstNameNoTooltip] curvado sobre um corpo, pânico em seus olhos, sangue em suas mãos. \"Foi pelo bem do reino...!\" [physician.GetSheHe] respirou."
 health.mystic_treatment_occult.4.desc:0 "[physician.GetFirstName] me deu uma bolsa de ervas e me enviou em uma jornada, para encontrar meu \"guia espiritual\". Vaguei pela natureza selvagem por dias, comendo apenas raízes da bolsa, dormindo sob as estrelas. Finalmente, senti uma presença. Diante de mim estava uma grande besta com chifres. Virei-me e corri.\n\nDe volta em segurança em minha cama, o sono me escapa. Será que eu sou a besta?"
 health.mystic_treatment_occult.5.desc:0 "[physician.GetTitledFirstName] ficou ao final da minha cama enquanto os servos acendiam as velas. Um pote foi colocado em minhas mãos - pelo som, parecia conter um pequeno animal aterrorizado. \"A criatura carregará seus fardos em seu lugar\", [physician.GetSheHe] explicou. Então, começou o canto."
 health.mystic_treatment_occult.cannibal.desc:0 "\"Beba isso\", sussurrou [physician.GetTitledFirstName]. Mal o líquido passou pelos meus lábios antes que as sensações estranhas começassem. Meus membros ficaram entorpecidos, mas por dentro, um fogo acordou...\n\n\"Agora, coma isso.\" Os pedaços estavam quentes, úmidos e mastigáveis. O fogo gostou disso. Queria mais. Quando [physician.GetSheHe] me entregou o resto do braço pálido, eu me empanturrei até vomitar."
 health.mystic_treatment_occult.deviant.desc:0 "[physician.GetTitledFirstName] me fez despir e massageou óleo em minha pele. Quando [physician.GetSheHe] deslizou sua mão em direção ao meu lugar mais íntimo, seus olhos buscando os meus, percebi que eu queria isso. Eu assenti.\n\nLogo, mais mãos se juntaram às de [physician.GetFirstNamePossessive]. Lisas, calejadas, enrugadas, esguias, fortes. Quando meus joelhos cederam, eles me seguraram e me entreguei ao toque deles."
 health.mystic_treatment_questionable.1.desc:0 "[physician.GetFirstName] me colocou diante de um espelho alto e acendeu um círculo de velas ao meu redor. \"Precisamos entrar em contato com o outro você\", [physician.GetSheHe] declarou casualmente. Quando ergui minhas sobrancelhas para [physician.GetSheHe], [physician.GetSheHe] colocou a mão no meu ombro. \"Isso pode... alterá-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 health.mystic_treatment_questionable.2.desc:0 "O quarto estava iluminado apenas pela chama de uma vela. De frente para a janela do oeste, [physician.GetTitledFirstName] pintou minhas unhas com gotas de óleo. Senti um calor na pele conforme [physician.GetSheHe] movia minha mão em direção à chama. \"Não se preocupe, [ROOT.Char.Custom('FormOfAddressForLiege')]. Pela sabedoria de [ROOT.Char.GetFaith.HealthGodName], você será purificad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 health.mystic_treatment_questionable.3.desc:0 "\"A lua exige sua devoção\", [physician.GetTitledFirstName] disse, antes de me entregar um bolo coberto com algo de aroma picante. Poucos minutos após comer, olhei para o céu noturno e improvisei o maior poema do mundo. Mais tarde, as palavras me escapam..."
 health.mystic_treatment_questionable.4.desc:0 "[physician.GetTitledFirstName] me fez beber uma infusão especialmente forte, todas as noites antes de dormir. \"Isso afrouxa a estrutura do seu ser, permitindo que os espíritos entrem em seu corpo\", [physician.GetSheHe] me assegurou. \"Também é bastante... relaxante\", [physician.GetSheHe] admitiu, sorrindo para mim."
 health.mystic_treatment_questionable.5.desc:0 "[physician.GetFirstName] me disse que a tarefa de interpretar [ROOT.Char.GetFaith.ReligiousText] é um trabalho difícil, mas a purificação pelo fogo é uma arte tão antiga quanto o próprio mundo. Mal sabia eu que [physician.GetSheHe] me faria caminhar sobre brasas ardentes."
 health.mystic_treatment_questionable.6.desc:0 "[physician.GetTitledFirstName] me disse que [ROOT.Char.GetFaith.HealthGodName] exige um teste da minha mente. Juntos, viajamos até chegarmos a um pequeno lago. De mãos dadas, entramos na água. Fiquei chocado quando [physician.GetFirstNameNoTooltip] me segurou pelo ombro e me mergulhou. Devo ter desmaiado, pois não consigo lembrar o que aconteceu depois disso..."
 health.risky_treatment_amputation.1.desc:0 "[physician.GetTitledFirstName] apertou a última tira, me prendendo na mesa de operações. \"Não vou mentir para você, [ROOT.Char.Custom('FormOfAddressForLiege')]. Isso será extremamente doloroso, mas precisa ser feito.\"\n\nTentei protestar quando [physician.GetFirstName] trouxe a serra, mas devido à poção calmante que [physician.GetSheHe] me fez beber, minhas palavras saíram confusas."
 health.risky_treatment_disfigurement.1.desc:0 "[physician.GetTitledFirstName] me informou que [physician.GetSheHe] havia identificado o tecido contaminado que era a raiz da minha doença, e que removê-lo provavelmente me curaria. Fiquei muito satisfeito e concordei com a cirurgia.\n\nQuem me dera [physician.GetFirstName] tivesse me dito que \"o tecido\" era o meu rosto."
 health.risky_treatment_eye.1.desc:0 "[physician.GetTitledFirstName] me fez beber um preparado de papoula antes de me amarrar na mesa de operações. Quase adormeci enquanto [physician.GetSheHe] preparava seus instrumentos, mas quando [physician.GetSheHe] ergueu um bisturi em direção ao meu olho, me senti completamente desperto. \"Sinto muito, [ROOT.Char.Custom('FormOfAddressForLiege')], mas precisamos remover a raiz do problema.\""
 health.risky_treatment_medicine.1.desc:0 "O pote que [physician.GetTitledFirstName] trouxe consigo para o meu [ROOT.Char.Custom('GetChambersOrTent')] emitia um estranho som de zumbido. Antes que eu pudesse impedir [physician.GetSheHe], [physician.GetSheHe] o jogou no chão, onde ele explodiu em uma nuvem de cacos de cerâmica e um enxame de abelhas furiosas. Enquanto meu médico fugia da sala, eu permaneci como seu único alvo."
 health.risky_treatment_medicine.2.desc:0 "Eu não podia acreditar no que via quando [physician.GetTitledFirstName] tirou uma mão decepada de sua bolsa. As manchas pretas em seus dedos me arrepiaram e eu exigi saber de onde [physician.GetSheHe] a conseguiu. [physician.GetSheHe|U] apenas me acalmou e prosseguiu esfregando a mão decepada contra o meu peito."
 health.risky_treatment_medicine.3.desc:0 "[physician.GetTitledFirstName] me apresentou uma poção das mais peculiares. Ela não tinha cheiro nem sabor, possuindo a aparência de prata líquida. A mistura metálica era fácil de ingerir, mas eu não conseguia reprimir meu desconforto."
 health.risky_treatment_medicine.4.desc:0 "[physician.GetTitledFirstName] insistiu que a única cura para minha condição era correr nu à meia-noite. Durante a próxima lua cheia, [physician.GetSheHe] me obrigou a me despir e correr pela floresta. \"Não pare até suas pernas cederem sob você!\" [physician.GetSheHe] gritou atrás de mim. \"Expulse o mal através do seu suor!\""
 health.risky_treatment_medicine.5.desc:0 "O pó era amarelo e tinha um aroma delicioso. Fiquei angustiado ao ver [physician.GetTitledFirstName] misturá-lo com enxofre e polvilhá-lo sobre a vesícula biliar ainda morna de um castor. O animal havia sido encontrado raivoso, babando pela boca e exibindo sinais claros da doença. \"Nós combatemos o mal com o mal, [ROOT.Char.Custom('FormOfAddressForLiege')]."
 health.risky_treatment_medicine.6.desc:0 "[physician.GetTitledFirstName] se aproximou de mim com uma pequena faca. [physician.GetSheHe|U] segurou meu braço firme e fez uma incisão precisa, mal quebrando minha pele. Em seguida, [physician.GetSheHe|U] prosseguiu pressionando algo repugnante contra o ferimento. Um olhar rápido para a substância foi tudo o que consegui suportar."
 health.risky_treatment_medicine.7.desc:0 "[physician.GetTitledFirstName] me entregou um prato com uma substância em pó de cor cinza. Aparentemente, consistia de crostas moídas de uma pessoa em estado pior que o meu. [physician.GetTitledFirstName] não demonstrou nenhuma indicação de brincadeira quando [physician.GetSheHe] me disse para me inclinar e inalar o máximo que pudesse."
 health.risky_treatment_medicine.8.desc:0 "O pó vermelho era tentador em cor. Um servo cometeu o erro de prová-lo em sua forma pura - sua língua inchou muito e [physician.GetTitledFirstName] o repreendeu severamente por isso. [physician.GetTitledFirstName] despejou o tempero em um cálice de água e mexeu meticulosamente, antes de me dar uma colherada."
 health.risky_treatment_medicine.9.desc:0 "Meus olhos se arregalaram quando [physician.GetTitledFirstName] trouxe uma cabra para o meu [ROOT.Char.Custom('GetChambersOrTent')]. O cheiro fétido de sua flatulência me fez cobrir o nariz, mas o médico afastou minha mão. \"Peço desculpas, [ROOT.Char.Custom('FormOfAddressForLiege')], mas este é o tratamento.\" [physician.GetSheHe|U] recomendou respirações profundas."
 health.risky_treatment_surgery.1.desc:0 "[physician.GetTitledFirstName] me deu um preparado que tinha um gosto muito peculiar. Fez com que eu me sentisse entorpecido e minhas pálpebras começaram a pesar. \"Peço desculpas, [ROOT.Char.Custom('FormOfAddressForLiege')], mas você não quer estar acordado para esta próxima parte,\" [physician.GetSheHe] disse. O pânico me atingiu e tentei me levantar da mesa de operações, mas meus membros não obedeceram."
 health.risky_treatment_surgery.2.desc:0 "Assistente d[Select_CString( physician.IsFemale, 'a', 'o' )] [physician.GetTitledFirstNamePossessive] assegurou [physician.GetSheHe] que a poção me havia feito dormir. Ah, como [physician.GetSheHe] estava enganado! Eu não conseguia falar nem me mover, mas ainda estava ciente de tudo o que eles faziam comigo. Tentei gritar e me debater, mas eu era prisioneiro do meu próprio corpo. O procedimento parecia durar para sempre..."
 health.safe_treatment.1.desc:0 "[physician.GetTitledFirstName] decidiu que o melhor curso de tratamento seria um pouco de descanso. [physician.GetSheHe|U] me cercou com travesseiros macios e me cobriu cuidadosamente com várias camadas de cobertores. Antes de sair do meu [ROOT.Char.Custom('GetChambersOrTent')], [physician.GetFirstNameNoTooltip] fechou minhas cortinas. Era meio-dia.\n\nUm pouco de sono extra"
 health.safe_treatment.10.desc:0 "[physician.GetTitledFirstName] insistiu que meus humores estavam desequilibrados e que a melhor maneira de restaurá-los seria por meio de sangria. Após consultar os gráficos astronômicos, [physician.GetSheHe] decidiu que eu deveria ser sangrado nas axilas e nas têmporas.\n\nA sangria"
 health.safe_treatment.11.desc:0 "[physician.GetTitledFirstName] me pediu para me despir e depois ajoelhar com as nádegas levantadas. Aquilo já era desconfortável o suficiente, mas quando vi o instrumento em suas mãos, quase saí correndo. [physician.GetSheHe|U] deve ter percebido, pois [physician.GetSheHe] me deu um tapinha tranquilizador no ombro e disse para eu parar de me contrair.\n\nO enema"
 health.safe_treatment.12.desc:0 "[physician.GetTitledFirstName] entrou no meu [ROOT.Char.Custom('GetChambersOrTent')] com um jarro de cerâmica aninhado em seus braços e veio sentar-se ao lado da minha cama. [physician.GetSheHe|U] tirou uma sanguessuga do jarro e lhe deu um olhar muito carinhoso antes de colocá-la cuidadosamente no meu rosto. \"Permaneça imóvel, [ROOT.Char.Custom('FormOfAddressForLiege')]. Melhor não perturbar a alimentação delas.\"\n\nAs sanguessugas"
 health.safe_treatment.13.desc:0 "Quando [physician.GetTitledFirstName] entrou no meu [ROOT.Char.Custom('GetChambersOrTent')] [physician.GetSheHe] foi seguido por um ar mais fétido. A origem do mau cheiro era um jarro em suas mãos — \"uma mistura de esterco de vaca e ervas para o seu cataplasma, [ROOT.Char.Custom('FormOfAddressForLiege')].\" Quando [physician.GetFirstName] começou a espalhá-lo no meu peito, quase vomitei.\n\nNo final, o cataplasma"
 health.safe_treatment.14.desc:0 "[physician.GetTitledFirstName] me trouxe uma mistura feita de espinheiro e sene. No início, achei a poção ineficaz, mas mais tarde no mesmo dia senti um tumulto em meus intestinos que me fez correr para o banheiro. Enquanto eu gemia de angústia, [physician.GetFirstName] me assegurou que a impureza havia sido expelida junto com minhas fezes.\n\nNo final, a limpeza"
 health.safe_treatment.15.desc:0 "[physician.GetTitledFirstName] me apresentou o cadáver carbonizado de um gato e me encorajou a comer. Enquanto eu comia, [physician.GetSheHe] me contava como [physician.GetSheHe] havia perseguido o gato rechonchudo pelos meus domínios por horas. Acredito que [physician.GetSheHe] queria elogios por seu árduo trabalho, mas o gosto repugnante da refeição me manteve em silêncio.\n\nNo final, a comida gordurosa"
 health.safe_treatment.16.desc:0 "[physician.GetTitledFirstName] trouxe um balde cheio de coaxos para o meu [ROOT.Char.Custom('GetChambersOrTent')] e pediu que eu expusesse a parte superior do meu corpo. [physician.GetSheHe|U] pegou um sapo, abriu-o com mãos ágeis e procedeu a colocar a carcaça ainda se contorcendo no meu peito. [physician.GetSheHe|U] continuou até que o balde estivesse vazio e meu torso coberto.\n\nO tratamento com sapos"
 health.safe_treatment.17.desc:0 "[physician.GetTitledFirstName] veio ao meu [ROOT.Char.Custom('GetChambersOrTent')] e me ofereceu uma bebida de cor amarela. [physician.GetSheHe|U] me disse para tapar o nariz enquanto a bebia. Quando o líquido morno passou pelos meus lábios, quase imediatamente o cuspi de volta. Exigi saber o conteúdo do copo, e [physician.GetSheHe] revelou que era urina fresca de uma porca prenha.\n\nO desperdício suíno"
 health.safe_treatment.18.desc:0 "[physician.GetTitledFirstName] mergulhou a mão no balde que [physician.GetSheHe] trouxe para o meu [ROOT.Char.Custom('GetChambersOrTent')]. Quando [physician.GetSheHe] a retirou, um pequeno peixe estava se contorcendo entre os dedos [physician.GetHerHim]. \"Abra bem a boca,\" [physician.GetSheHe] disse e deixou o peixe cair na minha boca. Lutei para não vomitar enquanto ele fazia cócegas no fundo da minha garganta.\n\nSeja o que for que estava nesse peixe"
 health.safe_treatment.19.desc:0 "O líquido no cálice estava morno e azedo. \"Ele afastará o calor restante\", explicou [physician.GetTitledFirstName].\n\nA poção"
 health.safe_treatment.2.desc:0 "[physician.GetTitledFirstName] atribuiu meus problemas de saúde a uma dieta inadequada. Para revitalizar meu corpo, [physician.GetSheHe] insistiu que eu consumisse apenas vegetais crus e chás de ervas por uma semana. Para não tentar a minha vontade, [physician.GetSheHe] confiscou minha reserva de guloseimas. [physician.GetSheHe|U] nunca as devolveu.\n\nAs restrições alimentares"
 health.safe_treatment.20.desc:0 "Para equilibrar meus humores, [physician.GetTitledFirstName] me fez beber água salgada para induzir o vômito. Foi muito eficaz.\n\nEsvaziando meu estômago"
 health.safe_treatment.21.desc:0 "Para me livrar dos meus males, [physician.GetTitledFirstName] ordenou que eu dormisse de cabeça para baixo por alguns dias. \"Isso irá te reequilibrar\", [physician.GetSheHe] me assegurou. \n\nEu me sentia como um morcego.\n\nA posição estranha para dormir"
 health.safe_treatment.3.desc:0 "[physician.GetTitledFirstName] me pediu para deitar na cama e, em seguida, oferecer minhas mãos a [physician.GetSheHe]. Firmemente, [physician.GetSheHe] esfregou e deu tapas nas minhas palmas até ficarem vermelhas, e então repetiu o tratamento nas solas dos meus pés. Como toque final, [physician.GetSheHe] me beliscou gentilmente por todo o corpo.\n\nEste procedimento estranho"
 health.safe_treatment.4.desc:0 "[physician.GetTitledFirstName] me ofereceu uma poção clara em um frasco dourado. No início, fiquei preocupad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por causa dos sabores dos remédios anteriores de [physician.GetFirstNamePossessive], mas quando bebi, não senti nem odor nem sabor. Perguntei sobre os ingredientes, mas [physician.GetSheHe] me disse que era uma receita secreta.\n\nA poção misteriosa"
 health.safe_treatment.5.desc:0 "\"Relaxe sua respiração\", [physician.GetTitledFirstName] me instruiu. A pena em sua mão parecia quase etérea enquanto [physician.GetSheHe] começava a me fazer cócegas suavemente debaixo do nariz. \"Fora, mal!\" [physician.GetSheHe] incentivou enquanto eu espirrava alto.\n\nA sensação estranha de cócegas"
 health.safe_treatment.6.desc:0 "[physician.GetTitledFirstName] organizou uma pequena cerimônia em meu nome. Assim que minha família e meu círculo mais próximo estavam reunidos no salão principal, o [ROOT.Char.Custom('DefaultPriestTitle')] fez um sermão destacando minha virtude e benevolência. A cerimônia foi encerrada com uma hora de oração silenciosa.\n\nConectando-se com [ROOT.Char.GetFaith.HealthGodName]"
 health.safe_treatment.7.desc:0 "Passei muitas noites com [physician.GetTitledFirstName] sentad[Select_CString( physician.IsFemale, 'a', 'o' )] ao meu lado, recitando trechos do [ROOT.Char.GetFaith.ReligiousText].\n\nAs palavras de [ROOT.Char.GetFaith.HealthGodName]"
 health.safe_treatment.8.desc:0 "[physician.GetTitledFirstName] convocou o [ROOT.Char.Custom('DefaultPriestTitle')] para trazer o melhor cantor da corte, que acabou sendo uma criança com uma voz tenor brilhante. Por vários dias seguidos, a criança cantou para me embalar até o sono.\n\nA voz reconfortante"
 health.safe_treatment.9.desc:0 "O vapor subia da xícara enquanto [physician.GetTitledFirstName] mexia o pó verde nela. [physician.GetSheHe|U] explicou extensivamente as propriedades curativas da erva, antes de me pedir para beber. \"A raiz também está lá\", [physician.GetSheHe] revelou orgulhosamente.\n\nA erva amarga"
 health.travel.option.continue:0 "Devemos seguir em frente."
 health.travel.option.home.flavor:0 "Você abandona sua [ROOT.Char.GetInvolvedActivity.GetNameNoTooltip] e começa a viajar para casa."
