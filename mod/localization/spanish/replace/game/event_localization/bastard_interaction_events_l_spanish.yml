l_spanish:
 I_AM_HOUSE_HEAD_MODIFIER:0 "Como Chefe da Casa, sou livre para decidir"
 PRESTIGOUS_IN_OUR_HOUSE:0 "Nível de Fama: $VALUE|+0$"
 bastard_interaction.0001.a.child:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))|U] diz que isso é uma coisa boa."
 bastard_interaction.0001.a.standard:0 "Todos os meus sonhos parecem estar mais próximos agora."
 bastard_interaction.0001.desc.child:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))|U] me 'legitimou' — agora eu sou [Select_CString( secondary_recipient.IsFemale, 'a verdadeira', 'o verdadeiro' )] [secondary_recipient.Custom('DaughterSon')] [actor.GetHerHim], diz [actor.GetSheHe]. Não tenho muita certeza do que isso significa, mas percebi que algumas pessoas olham para mim de forma diferente. A maioria é mais gentil, outras nem tanto..."
 bastard_interaction.0001.desc.standard:0 "Depois de todo esse tempo, m[Select_CString( actor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))] finalmente decidiu me dar a aceitação que eu tanto ansiava. A partir deste dia, sou s[Select_CString( secondary_recipient.IsFemale, 'ua', 'eu' )] [secondary_recipient.Custom('DaughterSon')] legítim[Select_CString( secondary_recipient.IsFemale, 'a', 'o' )]. Com apenas algumas palavras, [actor.GetSheHe] alterou radicalmente o rumo do meu futuro."
 bastard_interaction.0001.t:0 "Casa [actor.GetHouse.GetBaseName]"
 bastard_interaction.0002.a:0 "Seu futuro é promissor, [legitimized_bastard.GetFullNameNoTooltip]."
 bastard_interaction.0002.approved:0 "Declarei [legitimized_bastard.GetFirstName], [Select_CString( legitimized_bastard.IsFemale, 'minha filha legítima', 'meu filho legítimo' )] e membro da Casa [actor.GetHouse.GetBaseName]. Levei muito tempo para chegar a essa conclusão, e embora alguns possam discordar, foi a coisa certa a fazer."
 bastard_interaction.0002.dynast:0 "Declarei [legitimized_bastard.GetFirstName], m[Select_CString( legitimized_bastard.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('legitimized_bastard'))], como um legítimo descendente da Dinastia [actor.GetDynasty.GetBaseName]."
 bastard_interaction.0002.house_head:0 "Declarei [legitimized_bastard.GetFirstName], m[Select_CString( legitimized_bastard.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('legitimized_bastard'))], como meu filho legítimo e membro da Casa [actor.GetHouse.GetBaseName]. Levei muito tempo para chegar a essa conclusão, e embora alguns possam discordar, foi a coisa certa a fazer."
 bastard_interaction.0002.t:0 "Bem-vindo à Família"
 bastard_interaction.0003.a:0 "Nos encha de orgulho!"
 bastard_interaction.0003.desc:0 "Levou um tempo para [actor.GetTitledFirstName] chegar a essa conclusão, mas finalmente [actor.GetSheHe] legitimou noss[Select_CString( secondary_recipient.IsFemale, 'a', 'o' )] [secondary_recipient.Custom('DaughterSon')] [secondary_recipient.GetFirstName]. Como membro da Casa [actor.GetHouse.GetBaseName], [secondary_recipient.GetFirstName] tem um futuro mais brilhante agora do que eu jamais ousaria esperar."
 bastard_interaction.0003.t:0 "Tudo está bem quando termina bem"
 bastard_interaction.0004.a:0 "Não esquecerei essa traição."
 bastard_interaction.0004.desc:0 "Tolamente, eu tinha começado a acreditar que [secondary_recipient.GetTitledFirstName] era um problema do passado, que [secondary_recipient.GetSheHe] nunca voltaria para me assombrar. Como pude deixar de prever m[Select_CString( actor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))] [actor.Custom2('InsultAdjective', ROOT.Char)] legitimando [secondary_recipient.GetSheHe]? Eu pensei que já tinha sofrido o suficiente..."
 bastard_interaction.0004.newborn_desc:0 "Não apenas [actor.GetFirstName] teve um filho bastardo, mas [actor.GetSheHe] também escolheu legitimá-lo como seu próprio!\n\nPequen[Select_CString( legitimized_bastard.IsFemale, 'a', 'o' )] [legitimized_bastard.GetTitledFirstName] assombrará minha vida para sempre..."
 bastard_interaction.0004.t:0 "O Retorno de um Fantasma Antigo"
 bastard_interaction.0005.a.approve:0 "Desejo-lhe boa sorte em sua nova vida."
 bastard_interaction.0005.a.disapprove:0 "Será que [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))] pensou em mim algum momento?"
 bastard_interaction.0005.desc.approve:0 "Este é um bom dia para [secondary_recipient.GetTitledFirstName]! Finalmente, noss[Select_CString( actor.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))] voltou a si e legitimou [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))]. Agora, [secondary_recipient.GetSheHe|U] é verdadeiramente parte da família."
 bastard_interaction.0005.desc.bastard:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))|U] decidiu legitimar [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], m[Select_CString( secondary_recipient.IsFemale, 'inha', 'eu' )] [secondary_recipient.GetTitledFirstName]. Não consigo deixar de sentir um pouco de amargura... Será que um dia conhecerei a mesma aceitação?"
 bastard_interaction.0005.desc.disapprove:0 "Não consigo acreditar - [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))] decidiu legitimar [secondary_recipient.GetTitledFirstName]! Com o tempo, eu tinha aceitado a sua presença, mas isso é demais. Será que [Select_CString( actor.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))] realmente espera que eu receba [Select_CString( secondary_recipient.IsFemale, 'minha bastarda', 'meu bastardo' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] na família?"
 bastard_interaction.0005.t:0 "O Grande Dia de [secondary_recipient.GetFirstNamePossessiveNoTooltip]"
 bastard_interaction.0006.a:0 "Finalmente, [legitimized_bastard.GetSheHe] tem uma família."
 bastard_interaction.0006.desc:0 "[legitimized_bastard.GetTitledFirstName] foi legitimad[Select_CString( legitimized_bastard.IsFemale, 'a', 'o' )] pel[Select_CString( actor.IsFemale, 'a', 'o' )] chefe de sua casa, [actor.GetTitledFirstName]!"
 bastard_interaction.0006.t:0 "[legitimized_bastard.GetFirstNameNoTooltip] Legitimad[Select_CString( legitimized_bastard.IsFemale, 'a', 'o' )]"
 bastard_interaction.0007.a:0 "Que [legitimized_bastard.GetSheHe] esteja fora da minha vida para sempre."
 bastard_interaction.0007.desc:0 "M[Select_CString( legitimized_bastard.IsFemale, 'inha', 'eu' )] [legitimized_bastard.Custom('GetDaughterSon')] bastard[Select_CString( legitimized_bastard.IsFemale, 'a', 'o' )], [legitimized_bastard.GetTitledFirstName], foi legitimad[Select_CString( legitimized_bastard.IsFemale, 'a', 'o' )] [Select_CString( actor.IsFemale, 'pela', 'pelo' )] [actor.GetTitledFirstName], [Select_CString( actor.IsFemale, 'a', 'o' )] chefe de sua casa."
 bastard_interaction.0007.newborn_desc:0 "[parent.GetTitledFirstName] trouxe uma criança bastarda a este mundo, e ela foi legitimada [Select_CString( actor.IsFemale, 'pelaa', 'pelo' )] [actor.GetTitledFirstName], s[Select_CString( actor.IsFemale, 'ua', 'eu' )] [legitimized_bastard.Custom2('RelationToMe', SCOPE.sC('actor'))]."
 bastard_interaction.0008.a:0 "Como se [legitimized_bastard.GetSheHe] fosse algum dia ser 'legítim[Select_CString( legitimized_bastard.IsFemale, 'a', 'o' )]'."
 bastard_interaction.0008.desc:0 "[legitimized_bastard.GetTitledFirstName], m[Select_CString( legitimized_bastard.IsFemale, 'inha', 'eu' )] [legitimized_bastard.Custom('GetDaughterSon')] bastard[Select_CString( legitimized_bastard.IsFemale, 'a', 'o' )], foi legitimad[Select_CString( legitimized_bastard.IsFemale, 'a', 'o' )] pel[Select_CString( actor.IsFemale, 'a', 'o' )] chefe de sua nova Casa!"
 bastard_interaction.0009.a:0 "Finalmente!"
 bastard_interaction.0009.desc:0 "[actor.GetTitledFirstName], [Select_CString( actor.IsFemale, 'a', 'o' )] líder de toda a nossa dinastia, me declarou [Select_CString( ROOT.Char.IsFemale, 'uma herdeira legítima', 'um herdeiro legítimo' )] de nosso nome!\n\nEu sempre fui [Select_CString( ROOT.Char.IsFemale, 'uma verdadeira', 'um verdadeiro' )] [ROOT.Char.GetDynasty.GetBaseName], e agora o resto do mundo deve reconhecer isso."
 bastard_interaction.0009.t:0 "Um Herdeiro para a Dinastia"
 bastard_interaction.0010.a.tt:0 "[recipient.GetShortUIName|U] agora está elegível para herdar"
 bastard_interaction.0010.a:0 "Mais um[Select_CString( recipient.IsFemale, 'a', '' )] na linha de sucessão."
 bastard_interaction.0010.desc:0 "[actor.GetTitledFirstName], [Select_CString( actor.IsFemale, 'a', 'o' )] líder de toda a nossa dinastia, declarou m[Select_CString( recipient.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('recipient'))] [Select_CString( recipient.IsFemale, 'uma herdeira legítima', 'um herdeiro legítimo' )] de nosso nome!\n\n[recipient.GetSheHe|U] agora é [Select_CString( recipient.IsFemale, 'uma herdeira tão digna', 'um herdeiro tão digno' )] da dinastia [ROOT.Char.GetDynasty.GetBaseName] quanto qualquer [Select_CString( recipient.IsFemale, 'filha legítima', 'filho legítimo' )]."
 bastard_interaction.0010.t:0 "Outro Herdeiro para a Dinastia"
 dynasty_bastard_was_legitimized:0 "Bastardo da Dinastia Legitimado"
 every_child_adult_non_bastard_dislike:0 "Todos os meus filhos adultos não bastardos que não gostam do bastardo"
 every_child_adult_non_bastard_dislike_me:0 "Todos os meus filhos adultos não bastardos que não gostam de mim"
 every_child_house_member:0 "Todos os membros da [house|E] d[Select_CString( child.IsFemale, 'a', 'o' )] [child.GetFirstNamePossessiveNoTooltip]"
 every_father_house_member:0 "Todos os membros da [house|E] d[Select_CString( father.IsFemale, 'a', 'o' )] [father.GetFirstNamePossessiveNoTooltip]"
 every_mother_house_member:0 "Todos os membros da [house|E] d[Select_CString( mother.IsFemale, 'a', 'o' )] [mother.GetFirstNamePossessiveNoTooltip]"
 every_real_father_house_member:0 "Todos os membros da [house|E] d[Select_CString( real_father.IsFemale, 'a', 'o' )] [real_father.GetFirstNamePossessiveNoTooltip]"
 house_bastard_was_legitimized:0 "Bastardo da Casa Legitimado"
 legitimize_bastard_interaction:0 "Legitimar Bastardo #weak (Casa)#!"
 legitimize_bastard_interaction_decline_notification:0 "Bastardo não Legitimado"
 legitimize_bastard_interaction_desc_house_head:0 "$house_head_interaction_header$Declare [secondary_recipient.GetShortUINameNoTooltip] como [legitimized_bastard|E]\n\n#weak Isso está disponível porque [secondary_recipient.GetSheHe] é um [bastard|E] da minha [house|E]#!"
 legitimize_bastard_interaction_desc_not_house_head:0 "Solicitar que [recipient.GetShortUINameNoTooltip] reconheça seu [bastard|E] como [legitimate|E]\n#weak ([recipient.GetShortUINameNoTooltip] é o [house_head_head|E] da sua [house|E])#!"
 legitimize_bastard_interaction_extra_icon:0 "$hook_extra_icon$"
 legitimize_bastard_interaction_notification:0 "Bastardo Legitimado"
