l_spanish:
 tribal.1001.a:0 "Coloque um pouco de coragem em suas palavras!"
 tribal.1001.a_champion:0 "[liege_champion.GetTitledFirstName] lutará por mim\n"
 tribal.1001.a_champion_failure:0 "[liege_champion.GetFirstNameNoTooltip] perde a luta"
 tribal.1001.a_champion_success:0 "[liege_champion.GetFirstNameNoTooltip] vence a luta"
 tribal.1001.a_child:0 "Coloque um pouco de coragem em suas palavras, [challenger.Custom('GirlBoy')]!"
 tribal.1001.a_failure:0 "Eu perco a luta"
 tribal.1001.a_success:0 "Eu venço a luta"
 tribal.1001.b:0 "Somente se você me vencer em um duelo de palavras!"
 tribal.1001.b_failure:0 "[challenger.GetSheHe|U] me supera"
 tribal.1001.b_success:0 "Eu tenho os melhores insultos"
 tribal.1001.c:0 "Eu não lutarei contra você por isso..."
 tribal.1001.desc:0 "chegou a hora de você se afastar!\"\n\n[challenger.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim diante de toda a tribo, proclamando o desafio para todos ouvirem.\n\n\"A partir deste dia, eu governarei o [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip].\""
 tribal.1001.desc_fallback:0 "\"Você é indign[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] de governar, [ROOT.Char.GetTitledFirstNameNoTooltip];"
 tribal.1001.desc_meak:0 "\"Você é covarde como uma enguia, [ROOT.Char.GetTitledFirstNameNoTooltip];"
 tribal.1001.desc_old:0 "\"Você envelheceu e ficou frac[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], [ROOT.Char.GetTitledFirstNameNoTooltip];"
 tribal.1001.desc_weak:0 "\"Você é #EMP frac[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]#!, [ROOT.Char.GetTitledFirstNameNoTooltip];"
 tribal.1001.t:0 "Um Desafiante"
 tribal.1002.a:0 "Eu... Eh... Obrigado(a)."
 tribal.1002.desc:0 "Eu temia que esse dia chegasse; não posso lutar contra você nisso, m[Select_CString( liege_to_challenge.IsFemale, 'inha', 'eu' )] [liege_to_challenge.Custom2('RelationToMeShort', SCOPE.sC('challenger'))].\"\n\n[liege_to_challenge.GetFirstName] abdica de seu governo para mim sem resistência, e após um breve momento de confusão, a tribo celebra minha vitória."
 tribal.1003.a:0 "...levanto minha [ROOT.Char.Custom('signature_weapon')]."
 tribal.1003.b:0 "...levanto minhas mãos e dou risada de forma constrangedora."
 tribal.1003.desc:0 "\n\n[liege_to_challenge.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [liege_to_challenge.Custom('SignatureWeaponActionThirdPerson')] seu(a) [liege_to_challenge.Custom('signature_weapon')] e dá um passo em minha direção. Toda a tribo se reúne ao nosso redor, com empolgação e medo pairando no ar, enquanto eu abro minha postura e..."
 tribal.1003.desc_liege_champion:0 "\n\nM[Select_CString( liege_to_challenge.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('liege_to_challenge'))], campeã[Select_CString( liege_to_challenge.IsFemale, '', 'o' )] escolhid[Select_CString( liege_to_challenge.IsFemale, 'a', 'o' )] d[Select_CString( liege_to_challenge.IsFemale, 'a', 'o' )] [liege_to_challenge.GetTitledFirstNamePossessive], [liege_champion.GetTitledFirstName], [liege_champion.Custom('SignatureWeaponActionThirdPerson')] seu(a) [liege_champion.Custom('signature_weapon')] e dá um passo em minha direção. Toda a tribo se reúne ao nosso redor, com empolgação e medo pairando no ar, enquanto eu abro minha postura e..."
 tribal.1003.desc_old:0 "É melhor você ser capaz de sustentar suas palavras com coragem, [challenger.Custom('GirlBoy')]!\""
 tribal.1003.desc_opening:0 "\"Então você desafia meu direito de governar?!"
 tribal.1003.desc_young:0 "É melhor você ser capaz de sustentar suas palavras com coragem!\""
 tribal.1004.a:0 "Maldito seja você!"
 tribal.1004.desc:0 "Levanto minha [ROOT.Char.Custom('signature_weapon')] e ataco. #EMP Desvio, avanço, finta... Ugh!#! Com [challenger.Custom('SignatureWeaponActionReaction')] [challenger.GetFirstNameNoTooltip] [challenger.Custom('SignatureWeaponCriticalPresent')] minha perna, e ao tropeçar percebo que acabou. A tribo não está mais torcendo por mim."
 tribal.1004.desc_opening:0 "M[Select_CString( challenger.IsFemale, 'inha', 'eu' )] [liege_to_challenge.Custom2('RelationToMeShort', SCOPE.sC('challenger'))] [challenger.GetFirstName] [challenger.Custom('SignatureWeaponActionThirdPerson')] seu(a) [challenger.Custom('signature_weapon')] e dá um passo em minha direção. Toda a tribo está reunida ao nosso redor, com empolgação e medo no ar.\n\n"
 tribal.1005.a:0 "Espero que você tenha aprendido a lição!"
 tribal.1005.desc:0 "Levanto minha [ROOT.Char.Custom('signature_weapon')] e ataco.\n\n#EMP Desvio, avanço, finta...#! Com [ROOT.Char.Custom('SignatureWeaponActionReaction')] eu [ROOT.Char.Custom('SignatureWeaponCritical')] a sua perna, e ao vê-la [challenger.GetSheHe] tropeçar, sei que acabou."
 tribal.1006.a:0 "Isso é o que você chama de insulto? Vou te mostrar!"
 tribal.1006.a_failure:0 "Você perde o flyting"
 tribal.1006.a_success:0 "Você vence o flyting"
 tribal.1006.b:0 "Isso... Isso foi um erro."
 tribal.1006.desc:0 "Assim que [liege_to_challenge.Custom2('MyCharacterIntroduction', ROOT.Char)|U] declara o flyting, toda a tribo se aproxima para testemunhar o desafio.\n\nO silêncio cai quando [Select_CString( liege_to_challenge.IsFemale, 'a', 'o' )] [liege_to_challenge.GetFirstNameNoTooltip] dá um passo à frente e limpa a garganta.\n"
 tribal.1006.desc_old:0 "É melhor você conseguir reivindicar sua posição com habilidade, [challenger.Custom('GirlBoy')]!"
 tribal.1006.desc_young:0 "É melhor você conseguir reivindicar sua posição com habilidade!"
 tribal.1007.a:0 "Maldito seja você!"
 tribal.1007.desc_ending:0 "\n\nA confusão que se segue é ensurdecedora, e eu sei que perdi."
 tribal.1008.a:0 "Isso é o que você chama de insulto? Saia daqui."
 tribal.1008.desc:0 "A tribo está reunida para testemunhar o flyting entre mim e m[Select_CString( challenger.IsFemale, 'inha', 'eu' )] [liege_to_challenge.Custom2('RelationToMeShort', SCOPE.sC('challenger'))] [challenger.GetFirstName]. Murmúrios de empolgação são ouvidos quando [Select_CString( challenger.IsFemale, 'a', 'o' )] [challenger.GetFirstNameNoTooltip] dá um passo à frente e limpa a garganta.\n"
 tribal.1008.desc_ending:0 "\n\nSegue-se um silêncio chocado e constrangedor."
 tribal.1010.a:0 "Covarde."
 tribal.1010.desc:0 "Toda a tribo está reunida para testemunhar o duelo entre eu e m[Select_CString( challenger.IsFemale, 'inha', 'eu' )] [liege_to_challenge.Custom2('RelationToMeShort', SCOPE.sC('challenger'))] [challenger.GetFirstName], mas assim que [challenger.GetSheHe] aparece, [challenger.GetSheHe] começa a inventar desculpas.\n\n\"Isso... Isso foi tudo um engano, eu não ousaria desafiá-lo. Me perdoe.\""
 tribal.1014.a:0 "Maldito seja você!"
 tribal.1014.desc:0 "[liege_champion.GetTitledFirstName] levanta [liege_champion.Custom('signature_weapon')] e ataca. #EMP Desvio, avanço, finta... Ugh!#! Com [challenger.Custom('SignatureWeaponActionReaction')] [challenger.GetFirstNameNoTooltip] [challenger.Custom('SignatureWeaponCriticalPresent')] a perna d[Select_CString( liege_champion.IsFemale, 'a', 'o' )] [liege_champion.GetFirstNamePossessive], e ao vê-lo [liege_champion.GetSheHe] tropeçar, percebo que acabou. A tribo não está mais torcendo por mim."
 tribal.1014.desc_opening:0 "M[Select_CString( challenger.IsFemale, 'inha', 'eu' )] [liege_to_challenge.Custom2('RelationToMeShort', SCOPE.sC('challenger'))] [challenger.GetFirstName] [challenger.Custom('SignatureWeaponActionThirdPerson')] seu(a) [challenger.Custom('signature_weapon')] e dá um passo em direção [Select_CString( liege_champion.IsFemale, 'a', 'ao' )] [liege_champion.GetTitledFirstName]. A tribo toda se reúne ao nosso redor, com empolgação e medo no ar.\n\n"
 tribal.1015.a:0 "Espero que você tenha aprendido a lição!"
 tribal.1015.desc:0 "[liege_champion.GetTitledFirstName] levanta [liege_champion.Custom('signature_weapon')] e ataca.\n\n#EMP Desvio, avanço, finta...#! Com [liege_champion.Custom('SignatureWeaponActionReaction')] [liege_champion.GetSheHe] [liege_champion.Custom('SignatureWeaponCriticalPresent')] a perna d[Select_CString( challenger.IsFemale, 'a', 'o' )] [challenger.GetTitledFirstNamePossessive], e ao vê-lo [challenger.GetSheHe] tropeçar, sei que acabou."
 tribal.1022.trigger_failure.challenger:0 "Meu [single_combat_duel|E] contra [Select_CString( liege_to_challenge.IsFemale, 'a', 'o' )] [liege_to_challenge.GetFirstNameNoTooltip] foi invalidado"
 tribal.1022.trigger_failure.liege_to_challenge:0 "Meu [single_combat_duel|E] contra [Select_CString( challenger.IsFemale, 'a', 'o' )] [challenger.GetFirstNameNoTooltip] foi invalidado"
 tribal.1101.a:0 "[rival.Custom2('InsultNoun', ROOT.Char)] Maldit[Select_CString( rival.IsFemale, 'a', 'o' )]! Eu te desafio para um holmgang!"
 tribal.1101.a_failure:0 "[rival.GetSheHe|U] vence"
 tribal.1101.a_success:0 "Você vence"
 tribal.1101.b:0 "Você enfrentará [Select_CString( friend.IsFemale, 'a', 'o' )] [friend.GetFirstNameNoTooltip] no holmgang!"
 tribal.1101.b_failure:0 "[rival.GetFirstNameNoTooltip] vence"
 tribal.1101.b_success:0 "[friend.GetFirstNameNoTooltip] vence"
 tribal.1101.c:0 "Vamos apenas... Deixar as coisas para trás, certo?"
 tribal.1101.desc:0 "M[Select_CString( rival.IsFemale, 'inha', 'eu' )] rival [rival.GetTitledFirstName] olha para cima quando entro no corredor. [victim.GetTitledFirstName] – [Select_CString( victim.IsFemale, 'minha própria', 'meu próprio' )] #EMP [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim'))]#! – está ensanguentado aos seus pés.\n\n\"Ah, [ROOT.Char.GetFirstNameNoTooltip]. Eu estava apenas deixando uma mensagem para você!\"\n\n[victim.GetFirstNameNoTooltip] ainda está vivo, se os gemidos de dor são algum indicativo, mas quem sabe até onde [Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetFirstNameNoTooltip] teria ido se eu não tivesse interrompido?"
 tribal.1101.t:0 "Holmgang"
 tribal.1102.a:0 "Isso é o que espera por quem me desafia!"
 tribal.1102.desc:0 "Mas ali! Uma abertura na defesa d[Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetTitledFirstName]. Eu [ROOT.Char.Custom('SignatureWeaponAction')] minha [ROOT.Char.Custom('signature_weapon')], aperto os dentes, e com [ROOT.Char.Custom('SignatureWeaponActionReaction')] eu [ROOT.Char.Custom('SignatureWeaponCritical')] a sua caixa torácica. [rival.GetSheHe|U] está morto antes mesmo de [rival.GetSheHe] tocar o chão."
 tribal.1102.desc_opening:0 "Uma multidão se reúne para ver o holmgang entre [Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetTitledFirstName] e eu; eles nos envolvem em uma massa de vozes e punhos erguidos.\n\nEu seguro minha [ROOT.Char.Custom('signature_weapon')] e avanço — logo estamos envolvidos em um frenesi de aço e sangue.\n\n"
 tribal.1103.desc:0 "De repente, [friend.GetFirstNameNoTooltip] [friend.Custom('SignatureWeaponActionThirdPerson')] seu(a) [friend.Custom('signature_weapon')] e, com [friend.Custom('SignatureWeaponActionReaction')], [friend.Custom('SignatureWeaponCriticalPresent')] a caixa torácica d[Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetTitledFirstNamePossessiveNoTooltip]. [rival.GetSheHe|U] está morto antes mesmo de [rival.GetSheHe] tocar o chão."
 tribal.1103.desc_opening:0 "Uma multidão se reuniu para ver o holmgang entre [Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetTitledFirstName] e [Select_CString( friend.IsFemale, 'a', 'o' )] [friend.GetTitledFirstName]. No meio das vozes e punhos erguidos, eu grito mais alto que todos.\n\n[friend.GetTitledFirstNameNoTooltip] segura [friend.Custom('signature_weapon')] e avança — logo estão envolvidos em um frenesi de aço e sangue.\n\n"
 tribal.1104.a:0 "Eu... Eu me rendo."
 tribal.1104.desc:0 "De repente, [rival.GetTitledFirstNameNoTooltip] [rival.Custom('SignatureWeaponActionThirdPerson')] [rival.Custom('signature_weapon')] e, antes que eu possa bloquear, [rival.GetSheHe] [rival.Custom('SignatureWeaponCriticalPresent')] meu ombro. A dor... Eu devo ter desmaiado, pois de repente [rival.GetSheHe] está de pé sobre mim.\n\n\"Renda-se.\""
 tribal.1105.a:0 "Nós... Nós nos rendemos."
 tribal.1105.desc:0 "De repente, [rival.GetTitledFirstNameNoTooltip] [rival.Custom('SignatureWeaponActionThirdPerson')] [rival.Custom('signature_weapon')] e, antes que [Select_CString( friend.IsFemale, 'a', 'o' )] [friend.GetFirstNameNoTooltip] possa bloquear, [rival.GetSheHe] [rival.Custom('SignatureWeaponCriticalPresent')] o ombro d[Select_CString( friend.IsFemale, 'a', 'o' )] [friend.GetFirstNamePossessiveNoTooltip]. [Select_CString( friend.IsFemale, 'Minha amiga', 'Meu amigo' )] cai no chão, gritando de dor, e [Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetFirstNameNoTooltip] olha diretamente em meus olhos.\n\n\"Renda-se.\""
 tribal.1201.a.tt:0 "Uma corrida traz prestígio, mas também riscos!"
 tribal.1201.a:0 "Claro que eu vou participar também!"
 tribal.1201.b:0 "Apenas vou aproveitar o espetáculo."
 tribal.1201.desc:0 "Eu chego em um dos meus cavalos mais rápidos,"
 tribal.1201.desc_ending:0 "e descubro que tanto [racer.Custom2('MyCharacterIntroduction', ROOT.Char)] quanto [villain_racer.Custom2('MyCharacterIntroduction', ROOT.Char)] vão participar da corrida."
 tribal.1201.desc_opening:0 "Os preparativos para uma grande corrida estão em andamento há semanas, e finalmente chegou a hora de competir!\n\n"
 tribal.1201.desc_warhorse:0 "Eu chego em minha confiável [ROOT.Char.Custom('HorseStoryMareStallion')] [ROOT.Char.Custom('WarhorseStoryName')],"
 tribal.1201.t:0 "A Corrida"
 tribal.1202.a:0 "\"Ei! O que você está fazendo?!\""
 tribal.1202.b.tt:0 "Venha o que vier..."
 tribal.1202.b:0 "Não é da minha conta."
 tribal.1202.c.failure:0 "[villain_racer.GetSheHe|U] percebe que alguém mexeu na rédea de seu cavalo"
 tribal.1202.c.success:0 "Eu deixo a rédea de seu cavalo quase se rompendo"
 tribal.1202.c.tt:0 "Seria uma pena se algo #EMP arrebentasse#! durante a corrida..."
 tribal.1202.c:0 "Então [Select_CString( villain_racer.IsFemale, 'a', 'o' )] [villain_racer.GetFirstNameNoTooltip] deixou o cavalo desprotegido..."
 tribal.1202.desc:0 "Danças, cantos, aplausos... A multidão está extasiada antes mesmo de a corrida começar!\n\nEu me movo pela multidão, faltando apenas minutos para os cavaleiros montarem, quando vejo m[Select_CString( villain_racer.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('villain_racer'))] [villain_racer.GetTitledFirstName] perto dos cavalos com algo afiado em sua mão..."
 tribal.1203.a:0 "Eu devo dar meia-volta e ajudar [villain_racer.GetSheHe]!"
 tribal.1203.b.tt:0 "Você se concentra na corrida."
 tribal.1203.b:0 "Ótimo! Menos competição."
 tribal.1203.b_nothing_sabotaged:0 "Apenas distrações."
 tribal.1203.c:0 "Pelo menos o cavalo não caiu em cima de mim..."
 tribal.1203.d.failure.tt:0 "Eu posso ter um desempenho pior na corrida"
 tribal.1203.d.failure:0 "Estou temporariamente mais lento"
 tribal.1203.d.success:0 "Eu #EMP acidentalmente#! colido com força demais no cavalo de [villain_racer.GetSheHe]"
 tribal.1203.d:0 "Agora é pra valer, [villain_racer.GetFirstNameNoTooltip]!"
 tribal.1203.desc:0 "Não há nada igual a isso! O vento, o som dos cascos, o... À medida que me aproximo d[Select_CString( villain_racer.IsFemale, 'a', 'o' )] [villain_racer.GetTitledFirstName], [villain_racer.GetSheHe] repentinamente se desvia em minha direção, quase desequilibrando meu cavalo!"
 tribal.1203.desc_opening:0 "Eu galopo pela estepe, acompanhando o ritmo das nuvens acima e dos cavaleiros ao meu lado.\n\n"
 tribal.1203.desc_sabotaged_racer:0 "Enquanto me aproximo d[Select_CString( villain_racer.IsFemale, 'a', 'o' )] [villain_racer.GetTitledFirstName], [villain_racer.GetSheHe] repentinamente se desvia em minha direção, e ao mesmo tempo ouço m[Select_CString( racer.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('racer'))] [racer.GetTitledFirstName] gritar de dor. Me viro na sela para ver [racer.GetSheHe] no chão, ensanguentado, seu cavalo lutando desesperadamente contra a sela que não está mais nas suas costas, mas pendurada solta sob sua barriga."
 tribal.1203.desc_sabotaged_villain:0 "De repente, ouço m[Select_CString( villain_racer.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('villain_racer'))] [villain_racer.GetTitledFirstName] gritar de dor. Me viro na sela para ver [villain_racer.GetSheHe] no chão, ensanguentado, os restos quebrados da rédea [villain_racer.GetHerHim] em sua mão."
 tribal.1203.desc_sabotaged_you:0 "#EMP *Estalo!*#!\n\nDe repente, tudo vira de cabeça para baixo; o chão acima e os céus abaixo. Luto para me manter na sela ao perceber que ela balançou sob o cavalo! Mas minhas pernas perdem a aderência... Eu caio no chão com força – nem consigo encontrar fôlego para gritar."
 tribal.1203.e:0 "Eu devo estar perto o suficiente para fazer o salto..."
 tribal.1203.failure:0 "Sou eu quem é arremessado"
 tribal.1203.success:0 "Eu consigo derrubar [villain_racer.GetSheHe] de seu cavalo"
 tribal.1204.a:0 "Sim, sou muito rápido, obrigado!"
 tribal.1204.b:0 "Vou vencer da próxima vez!"
 tribal.1204.desc_fast:0 "Sou recebido pelo rugido da multidão ao cruzar a linha de chegada.\n\n"
 tribal.1204.desc_racer:0 "M[Select_CString( racer.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('racer'))] [racer.GetTitledFirstName] já está comemorando sua vitória, cercado de pessoas e presenteado com presentes, e [racer.GetSheHe] acena feliz na minha direção."
 tribal.1204.desc_slow:0 "Leva muitos minutos longos, mas finalmente eu cruzo a linha de chegada.\n\n"
 tribal.1204.desc_villain:0 "M[Select_CString( villain_racer.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('villain_racer'))] [villain_racer.GetTitledFirstName] já está comemorando sua vitória, cercado de pessoas e presenteado com presentes, e [villain_racer.GetSheHe] sorri e acena assim que [villain_racer.GetSheHe] me vê."
 tribal.1204.desc_you:0 "Sou rapidamente abordado por pessoas me parabenizando, tentando tocar meu cavalo, dançando... Quase ninguém nota [Select_CString( racer.IsFemale, 'a', 'o' )] [racer.GetTitledFirstName] e [Select_CString( villain_racer.IsFemale, 'a', 'o' )] [villain_racer.GetTitledFirstName] chegando à meta; a multidão está ocupada demais comemorando comigo!"
 tribal.1204.desc_you_jumped_horses:0 "Sou abordado por pessoas me parabenizando, mas a confusão surge quando eles veem que estou montado no cavalo d[Select_CString( villain_racer.IsFemale, 'a', 'o' )] [villain_racer.GetTitledFirstNamePossessive], e conduzindo o meu próprio. No entanto, há dança e celebração, e quase ninguém percebe [Select_CString( racer.IsFemale, 'a', 'o' )] [racer.GetTitledFirstName] e [Select_CString( villain_racer.IsFemale, 'a', 'o' )] [villain_racer.GetTitledFirstNameNoTooltip] chegando à meta, este último a pé."
 tribal.1301.a:0 "Obrigado! Aqui, para a sua aldeia."
 tribal.1301.b:0 "Eu poderia usar uma pessoa como você, [peasant.GetWomanMan]."
 tribal.1301.c:0 "Um crocodilo? Pft! Não vi nenhum crocodilo."
 tribal.1301.d.tt:0 "Levo em consideração o seu aviso"
 tribal.1301.d:0 "Bem... Obrigado. Agora vá embora."
 tribal.1301.desc:0 "Estou visitando um dos pequenos rios perto de [capital.GetName]. Quando estou prestes a saciar minha sede, um[Select_CString( peasant.IsFemale, 'a', '' )] [peasant.GetWomanMan] local se coloca resolutamente entre mim e o rio — que audácia!\n\nJusto quando estou prestes a ordenar que [peasant.GetSheHe] seja removido, [peasant.GetSheHe] fala: 'Há um crocodilo na água, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord].'\n\n[peasant.GetSheHe|U]... [peasant.GetSheHe|U] estava #EMP me protegendo#!?"
 tribal.1301.t:0 "Encontro Mortal"
 tribal.1302.a:0 "AAAAH!! Tirem isso de cima de mim!"
 tribal.1302.desc:0 "Me aproximo da água, ignorando [Select_CString( peasant.IsFemale, 'a', 'o' )] [peasant.GetWomanMan], e me abaixo para pegar a água fresca com as mãos. Não há sinais de qualquer criatura viva além dos insetos!\n\nEnquanto me preparo para tomar mais um gole, ouço algo perturbando a superfície e então... #EMP Dor#!. Muita dor. Olho para baixo e vejo uma mandíbula gigante fechada em torno da minha perna, sangue escorrendo entre os dentes irregulares."
 tribal.1303.a:0 "Isso trará prosperidade – irrigação!"
 tribal.1303.b:0 "Use-o para irrigação, mas não de graça."
 tribal.1303.c:0 "Deixe os camponeses usarem da melhor maneira possível."
 tribal.1303.desc:0 "\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetLadyLord],\" [councillor.Custom2('MyCharacterIntroduction', ROOT.Char)] se aproxima de mim. \"Um oásis foi descoberto perto de [capital.GetName]. O que você gostaria que eu fizesse?\"\n\nUm oásis! Uma fonte de água e vida... ou dinheiro."
 tribal.1303.t:0 "O Oásis"
