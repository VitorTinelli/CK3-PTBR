l_spanish:
 clan.1001.a:0 "Você está certo - eles vão se casar!"
 clan.1001.b:0 "Isso não vai acontecer."
 clan.1001.desc:0 "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] e s[Select_CString( vassal_child.IsFemale, 'ua', 'eu' )] [vassal_child.Custom('GetDaughterSon')] [vassal_child.GetTitledFirstName] se aproximam de mim.\n\n\"A falta de uma aliança entre nós é vergonhosa, [ROOT.Char.Custom('FormOfAddressForLiege')]. Deixe [Select_CString( child.IsFemale, 'a', 'o' )] [child.GetTitledFirstName] casar com m[Select_CString( vassal_child.IsFemale, 'inha', 'eu' )] [vassal_child.Custom('GetDaughterSon')] e corrigir as coisas!\""
 clan.1001.t:0 "Filho Prometido"
 clan.1002.a:0 "Foi um erro, eu prometo!"
 clan.1002.b:0 "Não é da sua conta."
 clan.1002.desc:0 "\"[ROOT.Char.GetTitledFirstNameNoTooltip], o que significa isso?!\"\n\n[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] entra furiosamente na sala, s[Select_CString( vassal_child.IsFemale, 'ua', 'eu' )] [vassal_child.Custom('GetDaughterSon')] [vassal_child.GetTitledFirstName] ao seu lado.\n\n\"Por que você quebrou o noivado entre s[Select_CString( child.IsFemale, 'ua', 'eu' )] [child.Custom('GetDaughterSon')] e [Select_CString( vassal_child.IsFemale, 'a', 'o' )] [vassal_child.GetTitledFirstNameNoTooltip]?\""
 clan.1011.army:0 "M[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [councillor.GetCouncilTitle] [councillor.GetFirstNameNoTooltip] irá treiná-lo."
 clan.1011.b:0 "Você não terá nada disso."
 clan.1011.desc_army:0 "a experiência [Select_CString( councillor.IsFemale, 'da sua', 'do seu' )] [councillor.GetCouncilTitle] [councillor.GetTitledFirstName] por alguns anos!\""
 clan.1011.desc_diplomacy:0 "lições na arte da diplomacia.\""
 clan.1011.desc_fallback:0 "ouro.\""
 clan.1011.desc_opening:0 "\"Não posso deixar de notar o nepotismo com que você trata [allied_vassal.Custom2('YourCharacterIntroduction', ROOT.Char)], [Select_CString( ROOT.Char.IsFemale, 'minha senhora', 'meu senhor' )].\"\n\n[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me procurou, buscando resolver o que [vassal.GetSheHe] vê como um desrespeito: eu não ter uma aliança com [vassal.GetSheHe].\n\n\"Uma concessão sua acalmaria meu temperamento. Digamos..."
 clan.1011.desc_prestige:0 "algumas palavras boas nos ouvidos certos.\""
 clan.1011.desc_prowess:0 "instruções em combate!\""
 clan.1011.diplomacy:0 "É melhor afiar sua língua de prata!"
 clan.1011.fallback:0 "Pegue isso e me deixe em paz."
 clan.1011.prestige:0 "Falarei bem de você."
 clan.1011.prowess:0 "Então vamos lutar, e eu vou te ensinar."
 clan.1011.t:0 "Sem uma Aliança"
 clan.1011.tt:0 "#F Aceite ou deixe pra lá#!"
 clan.1101.a.flavor:0 "Você se esquiva de tomar qualquer ação significativa, ao mesmo tempo em que tranquiliza a mente d[Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetFirstNameNoTooltip]"
 clan.1101.a:0 "Ouço suas preocupações e as levarei em consideração."
 clan.1101.b.custom:0 "Cada membro da [dynasty|E] do [vassal|E]"
 clan.1101.b.tt:0 "Ganha uma [revoke_title_reason|E]"
 clan.1101.b:0 "Você está certo. Tomarei medidas para corrigir isso imediatamente!"
 clan.1101.c:0 "Ah, eu lhe darei algo para gerar ressentimento..."
 clan.1101.d.custom:0 "Cada [vassal|E] que não é membro da [dynasty|E]"
 clan.1101.d:0 "Não é culpa minha que você não nasceu na minha família!"
 clan.1101.desc:0 "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] veio até mim com uma reclamação. \"Seus membros da família têm poder demais no [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]. Não importa o quanto vassalos como eu trabalhem duro, nunca chegaremos nem perto deles!\n\nEu imploro que você corrija essa injustiça. Afinal, até mesmo a aparência de nepotismo pode gerar ressentimento entre seus vassalos..."
 clan.1101.t:0 "Equilíbrio de Poder"
 clan.1201.a:0 "Muito bem. A partir de agora, você governará [target_title.GetNameNoTierNoTooltip]!"
 clan.1201.b:0 "Eu poderia afrouxar as rédeas, em troca de seu serviço..."
 clan.1201.c:0 "Não vai acontecer."
 clan.1201.desc:0 "Um[Select_CString( petitioner.IsFemale, 'a', '' )] [petitioner.GetWomanMan] [culture.GetNameNoTooltip] de [target_title.GetNameNoTier] veio me fazer uma petição por maior representação em meu governo.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], somos seus súditos leais, mas não temos voz em como nossas comunidades são governadas. Seria pedir demais ter alguém de nosso próprio povo em sua administração?\""
 clan.1201.t:0 "Sem Representação"
