l_spanish:
 agent_events.0001.a:0 "Motivação, você diz..."
 agent_events.0001.b.tt.failure:0 "Você não consegue motivá-los mais"
 agent_events.0001.b.tt.success:0 "Laços de afeto se entrelaçam"
 agent_events.0001.b:0 "Talvez o relacionamento deles possa ser frutífero..."
 agent_events.0001.c:0 "Concentre-se gentilmente na tarefa em questão."
 agent_events.0001.d:0 "Bom para eles."
 agent_events.0001.desc:0 "Desde que recrutei [Select_CString( char_1.IsFemale, 'a', 'o' )] [char_1.GetTitledFirstName] e [Select_CString( char_2.IsFemale, 'a', 'o' )] [char_2.GetTitledFirstName] para meu [scheme.Custom('GetSchemeContract')], a dupla se tornou bastante amigável um com o outro.\n\nParece que tarefas compartilhadas e preocupações mútuas despertaram uma pequena faísca de reconhecimento entre os dois desajustados.\n\nA compreensão deles ainda não é nada sério, mas um pequeno empurrão poderia fazer uma verdadeira amizade florescer."
 agent_events.0001.t:0 "Cúmplices"
 agent_events.0011.a:0 "Uma amizade forjada a meu favor!"
 agent_events.0011.b:0 "[char_1.GetFirstNameNoTooltip] #EMP é#! divertid[Select_CString( char_1.IsFemale, 'a', 'o' )]..."
 agent_events.0011.c:0 "[char_2.GetFirstNameNoTooltip] poderia escolher melhor."
 agent_events.0011.d:0 "Que sejamos três amigos juntos."
 agent_events.0011.desc:0 "[char_1.GetTitledFirstName] e [Select_CString( char_2.IsFemale, 'a', 'o' )] [char_2.GetTitledFirstName] parecem estar se divertindo um pouco #EMP demais#! para o humilde papel que desempenham em meus planos.\n\nTerra comum em nosso pequeno plano para [scheme.GetName] deu lugar ao respeito mútuo, que por sua vez está claramente se tornando um vínculo firme.\n\nPor mais improvável que a origem possa ser."
 agent_events.0011.e:0 "Estou tão feliz que todos nós estamos nos dando bem!"
 agent_events.0011.f:0 "Isso não é um encontro social."
 agent_events.0011.t:0 "Condições de Trabalho Próximas"
 agent_events.0012.a:0 "E não estão eles gratos a mim por ajudar?"
 agent_events.0012.b:0 "Doubtless, suas paixões podem ser aproveitadas."
 agent_events.0012.c.tt.failure:0 "A faísca se apagou"
 agent_events.0012.c.tt.success:0 "Pombinhos fazem [scheme.GetNameNoTooltip] um jogo"
 agent_events.0012.c:0 "Talvez suas paixões pudessem ser aproveitadas..."
 agent_events.0012.d:0 "Isso não é o que estamos aqui para fazer!"
 agent_events.0012.desc:0 "[char_1.GetTitledFirstName] e [Select_CString( char_2.IsFemale, 'a', 'o' )] [char_2.GetTitledFirstName] parecem estar se divertindo um pouco #EMP demais#! para o humilde papel que desempenham em meus planos.\n\nOlhares furtivos, sussurros silenciosos, cartas trocadas sob pretexto — se eu fosse mais suspeito, poderia falhar em reconhecer isso como os sinais claros de um relacionamento inicial esperando para tomar raízes.\n\nNão #EMP quite#! o ponto de um plano para [scheme.GetName]."
 agent_events.0012.e.tt.become_lovers:0 "O início de algo mais"
 agent_events.0012.e.tt.not_lovers:0 "$agent_events.0012.c.tt.failure$"
 agent_events.0012.e:0 "Quem se importa?"
 agent_events.0012.t:0 "Condições de Trabalho Mais Próximas"
 agent_events.0021.a:0 "Excelente!"
 agent_events.0021.b:0 "Coloque essa energia no plano, seu tolo."
 agent_events.0021.c:0 "Talvez haja algo que eu possa aprender com isso..."
 agent_events.0021.desc.diplomacy:0 "as cartas, a oratória e a retórica em geral"
 agent_events.0021.desc.intrigue:0 "astúcia, malícia e negociatas implacáveis"
 agent_events.0021.desc.intro:0 "Dois dos meus agentes, [char_1.GetTitledFirstName] e [Select_CString( char_2.IsFemale, 'a', 'o' )] [char_2.GetTitledFirstName], parecem ter encontrado uma causa comum em nosso plano além do objetivo básico.\n\nImpressionado pela habilidade de seu compatriota com"
 agent_events.0021.desc.learning:0 "a sabedoria, a leitura e o conhecimento geral"
 agent_events.0021.desc.martial:0 "a logística, a vontade e a presença de liderança"
 agent_events.0021.desc.outro:0 "para [scheme.GetName], [char_2.GetFirstNameNoTooltip] começou a estudar o que [char_1.GetFirstNameNoTooltip] faz de diferente em relação a [char_2.GetHerselfHimself] na esperança de melhorar suas próprias habilidades.\n\nInofensivo o suficiente, em teoria, mas isso não ajuda nosso objetivo geral."
 agent_events.0021.desc.prowess:0 "inteligência, força e condicionamento físico"
 agent_events.0021.desc.stewardship:0 "a aritmética, a contabilidade e o olho para os detalhes"
 agent_events.0021.t:0 "Aprendendo com os Melhores"
 agent_events.0031.a.tt.failure:0 "Esforço sem efeito"
 agent_events.0031.a.tt.success:0 "Empurrado ao limite"
 agent_events.0031.a:0 "Você pode ir além disso!"
 agent_events.0031.b:0 "O crédito vai, naturalmente, ao nosso gênio."
 agent_events.0031.c:0 "O plano vai bem..."
 agent_events.0031.desc:0 "Dos que escolhi para envolver neste pequeno [scheme.Custom('GetSchemeContract')], [char_1.GetTitledFirstName] provavelmente não é o #EMP mais#! habilidoso.\n\nAinda assim, [char_1.GetSheHe] está claramente se aplicando, determinado a não deixar meus esforços irem para o lixo, com o objetivo de melhorar sua habilidade em questões de [scheme.Custom('GetSchemeType')|l].\n\nMelhorar a si mesmo é custoso, mas ajuda a todos nós no final."
 agent_events.0031.t:0 "Aprendendo na Prática"
 agent_events.0041.a.tt.failure:0 "Uma perda de tempo"
 agent_events.0041.a.tt.success:0 "Você aprende uma coisa ou outra"
 agent_events.0041.a.tt.they_attempt_to_teach_you:0 "[char_1.GetFirstName] tentará usar sua [skill|E] para te ensinar #WEAK (isso é mais fácil quanto melhor [char_1.GetSheHe] for)#!"
 agent_events.0041.a:0 "Eu aceito."
 agent_events.0041.b:0 "Que curioso! Não."
 agent_events.0041.c:0 "Coloque sua mente na tarefa, não em mim."
 agent_events.0041.desc:0 "[char_1.GetTitledFirstName] é certamente um ativo para meu [scheme.Custom('GetSchemeContract')], fornecendo habilidade, sabedoria e orientação da melhor forma que [char_1.GetSheHe] pode a cada passo.\n\nMais recentemente, isso significou oferecer ajuda para me tutorizar, em um esforço para melhorar nossas chances gerais.\n\nA oferta é... #EMP tentadora#!, se presumida."
 agent_events.0041.t:0 "Esquemas Estudiosos"
 agent_events.1001.a.tt.failure:0 "Seus argumentos caem em ouvidos surdos"
 agent_events.1001.a.tt.success:0 "Eles levam suas palavras a sério"
 agent_events.1001.a:0 "Dê uma palestra a ambos."
 agent_events.1001.b.tt.failure:0 "$agent_events.1001.a.tt.failure$"
 agent_events.1001.b.tt.success:0 "$agent_events.1001.a.tt.success$"
 agent_events.1001.b:0 "Apelo à razão."
 agent_events.1001.c:0 "O ódio não é uma ferramenta tão problemática..."
 agent_events.1001.d:0 "Vocês. Vão. Parar."
 agent_events.1001.desc:0 "Raramente ouvi duas pessoas discutirem tanto quanto [Select_CString( char_1.IsFemale, 'a', 'o' )] [char_1.GetTitledFirstName] e [Select_CString( char_2.IsFemale, 'a', 'o' )] [char_2.GetTitledFirstName], dois #EMP aliados#! nominais em nosso [scheme.Custom('GetSchemeContract')]. Algo sobre o outro parece, infelizmente, irritá-los mutuamente.\n\nNo começo, tentei deixar tudo como estava, contando com eles para se resolverem, mas está claro que se não forem parados, isso custará ao resto de nós."
 agent_events.1001.e.rivals_bicker:0 "Discussões incessantes"
 agent_events.1001.e.rivals_bicker_less:0 "Discussões ocasionais"
 agent_events.1001.e:0 "Deixe os idiotas brigarem."
 agent_events.1001.t:0 "Na Garganta Errada"
 agent_events.1011.a:0 "Force-os a trabalhar juntos."
 agent_events.1011.b:0 "Tente mantê-los afastados."
 agent_events.1011.c:0 "Deixe como está."
 agent_events.1011.desc:0 "Talvez tenha sido tolice minha escolher duas pessoas que parecem se #EMP odiar#! para agir como meus auxiliares neste [scheme.Custom('GetSchemeContract')] — certamente as constantes discussões e picuinhas entre [Select_CString( char_1.IsFemale, 'a', 'o' )] [char_1.GetTitledFirstName] e [Select_CString( char_2.IsFemale, 'a', 'o' )] [char_2.GetTitledFirstName] parecem determinadas a provar isso.\n\nAinda assim, não importa o desprezo deles, eles deveriam ser capazes de se concentrar no trabalho em questão."
 agent_events.1011.t:0 "Feridas Infectadas"
