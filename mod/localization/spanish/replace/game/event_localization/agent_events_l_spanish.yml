 agent_events.1041.t:0 "Sob Pressão"
 agent_events.2001.a:0 "Excelente notícia!"
 agent_events.2001.desc:0 "É realmente uma sorte que eu tenha a chance de planejar este [scheme.Custom('GetSchemeContract')] com [relation.Custom2('MyCharacterIntroduction', ROOT.Char)] ao meu lado.\n\nUm[Select_CString( ROOT.Char.IsFemale, 'a', '' )] ajudante melhor, mais observador[Select_CString( ROOT.Char.IsFemale, 'a', '' )], [ROOT.Char.GetWomanMan] poderia pedir, sempre disposto a ir a milha extra para nossas necessidades, sempre focado em como melhor avançar o [scheme.Custom('GetSchemeContract')].\n\nMais recentemente, o trabalho [relation.GetHerHim] resultou em um atalho que deve nos economizar uma quantidade significativa de tempo."
 agent_events.2001.t:0 "Um Prazer Trabalhar Com"
 agent_events.2011.a:0 "Aquel[Select_CString( relation.IsFemale, 'a', 'e' )] pequen[Select_CString( relation.IsFemale, 'a', 'o' )] [relation.Custom2('InsultNoun', ROOT.Char)] ardilos[Select_CString( relation.IsFemale, 'a', 'o' )]!"
 agent_events.2011.desc:0 "Que loucura me levou a trazer [relation.Custom2('MyCharacterIntroduction', ROOT.Char)] para meu [scheme.Custom('GetSchemeContract')]?\n\nO tolo imprudente tem sido apenas um problema desde o primeiro dia em que o envolvi, uma espinhosa e feia dor de cabeça.\n\nNunca sabotando-me abertamente, é claro, mas quando tudo e qualquer coisa que você toca dá errado sem motivo aparente, e alguém está sempre sorrindo a respeito disso..."
 agent_events.2011.t:0 "Agendas Pessoais"
 agent_events.2021.a:0 "Uma pequena competição amigável é boa!"
 agent_events.2021.b:0 "Uma rivalidade séria pode ter seus benefícios..."
 agent_events.2021.c:0 "Deixe-os em paz."
 agent_events.2021.desc:0 "Parece que nosso [scheme.Custom('GetSchemeContract')] se tornou uma espécie de jogo para [Select_CString( agent_1.IsFemale, 'a', 'o' )] [agent_1.GetTitledFirstName] e [Select_CString( agent_2.IsFemale, 'a', 'o' )] [agent_2.GetTitledFirstName].\n\nEmbora não tenham sido especialmente próximos ou argumentativos anteriormente, os dois estão desfrutando de uma disputa leve sobre quem pode se destacar melhor em suas tarefas, cada um tentando constantemente ofuscar o outro.\n\nÉ apenas uma pequena coisa por enquanto, mas tem as sementes de algo mais feroz."
 agent_events.2021.t:0 "Uma Pequena Competição"
 agent_events.3001.a:0 "Por favor, dê o seu #EMP tudo#!."
 agent_events.3001.b:0 "Você poderia fazer mais, muito mais!"
 agent_events.3001.c:0 "Passe um tempo comigo em vez disso, [relation.GetFirstNameNoTooltip]."
 agent_events.3001.d:0 "Descanse um pouco, [relation.GetFirstNameNoTooltip], você já fez o suficiente."
 agent_events.3001.desc:0 "Está claro que [relation.Custom2('MyCharacterIntroduction', ROOT.Char)] está sinceramente colocando tudo em meu [scheme.GetName] [scheme.Custom('GetSchemeContract')], dedicando noites sem dormir e longos dias a nossos objetivos.\n\nTalvez... talvez seja cruel da minha parte usar alguém que me é querido assim? Certamente não posso dizer que gostaria de ser usado dessa forma.\n\nAinda assim, [relation.GetSheHe] #EMP é#! eficaz, e é por uma boa causa."
 agent_events.3001.t:0 "Queimando dos Dois Lados"
 agent_events.3011.a:0 "Por você? Claro!"
 agent_events.3011.b:0 "Um[Select_CString( relation.IsFemale, 'a', '' )] #EMP verdadeir[Select_CString( relation.IsFemale, 'a', 'o' )]#! [ROOT.Char.Custom2('RelationToMeShort',SCOPE.sC('relation'))] não me pediria isso."
 agent_events.3011.c:0 "A única saída é através, [relation.GetFirstNameNoTooltip]..."
 agent_events.3011.desc:0 "\"#EMP Por favor#!, [ROOT.Char.GetFirstNameNoTooltip]. Você trabalha demais, é como se este [scheme.Custom('GetSchemeContract')] estivesse consumindo você!\" lamenta [relation.Custom2('MyCharacterIntroduction', ROOT.Char)], pela centésima vez, ou algo assim.\n\nEu #EMP tenho#! sido diligente ultimamente, isso é inegável, mas não mais do que o necessário, com certeza.\n\nA expressão desgastada de preocupação [relation.Custom('MaskFace_BehindAcross')] do [relation.Custom('MaskFace')] d[Select_CString( relation.IsFemale, 'a', 'o' )] [relation.GetFirstNamePossessiveNoTooltip] me diz que talvez não seja esse o caso."
 agent_events.3011.t:0 "Por Minha Causa"
 agent_events.3021.a:0 "Felicidade familiar..."
 agent_events.3021.desc:0 "É um pouco estranho, [relation.Custom2('MyCharacterIntroduction', ROOT.Char)] e eu sermos reunidos assim por causa deste [scheme.Custom('GetSchemeContract')] para [scheme.GetName].\n\nAinda assim, há alegria a ser encontrada em uma tarefa comum, em trabalhar juntos em direção a um objetivo. Frustrações compartilhadas são diminuídas, triunfos multiplicados, e sempre há algo sobre o que conversar.\n\nEstou feliz por ter trazido [relation.GetSheHe] para este empreendimento."
 agent_events.3021.t:0 "A Família que Fica Junta"
 agent_events.3031.a.tt.failure:0 "Suas palavras caem em ouvidos surdos"
 agent_events.3031.a.tt.success:0 "Seu apelo é adequadamente lamentável"
 agent_events.3031.a:0 "Por favor, [relation.GetFirstNameNoTooltip], não é assim."
 agent_events.3031.b:0 "Você simplesmente não entende minha visão!"
 agent_events.3031.desc:0 "\"Por [relation.GetFaith.HealthGodName], você ainda é m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [relation.Custom2('RelationToMeShort',ROOT.Char)]? A mera visão de você me enfurece nesses dias!\" dispara [relation.GetFirstName].\n\nEssa discussão é bastante típica de nossas interações ultimamente, desavenças sobre planos e práticas abundantes, turnos de frase entendidos da pior maneira, e a menor das disputas se transformando em horas de argumentos.\n\nQualquer terreno comum que eu esperava construir ao envolver [relation.GetSheHe] com este [scheme.Custom('GetSchemeContract')] parece completamente arruinado."
 agent_events.3031.t:0 "Desgarrados"
 agent_events.3041.a.tt.forced_to_stay_longer:0 "$agent_events.3041.tt.forced_to_stay$ ainda mais tempo"
 agent_events.3041.a:0 "Por favor, #EMP lembre-se#! porque você está aqui."
 agent_events.3041.b.tt.failure:0 "[relation.GetFirstNameNoTooltip] é livre para ir"
 agent_events.3041.b.tt.success:0 "[relation.GetFirstNameNoTooltip] ficará"
 agent_events.3041.b:0 "Deixe-me mudar sua mente..."
 agent_events.3041.c.tt.failure:0 "$agent_events.3041.b.tt.failure$"
 agent_events.3041.c.tt.success:0 "$agent_events.3041.b.tt.success$"
 agent_events.3041.c:0 "Você bem sabe que não pode ir."
 agent_events.3041.d:0 "Você pode ir a qualquer momento."
 agent_events.3041.desc:0 "\"[target.GetSheHe|U] é m[Select_CString( target.IsFemale, 'inha', 'eu' )] [target_relation.Custom2('RelationToMeShort',SCOPE.sC('target'))], droga!\" grita [target_relation.GetFirstName], ao lado de [target_relation.GetHerselfHimself] com frustração e preocupação por estar envolvido com meu pequeno [scheme.Custom('GetSchemeContract')].\n\nClaro, dado que estamos tramando [scheme.GetName] contra [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetFirstName], isso é talvez compreensível.\n\n\"Talvez eu pudesse... me retirar, só um pouco. Não sou bom para você nesse estado de qualquer forma\"."
 agent_events.3041.t:0 "Segundas Intenções"
 agent_events.3041.tt.forced_to_stay:0 "[relation.GetFirstName] será forçado a ficar no [scheme|E] de [scheme.GetName]"
 agent_events.3051.a:0 "Um favor por outro."
 agent_events.3051.b:0 "Talvez pudéssemos ser amigos?"
 agent_events.3051.c:0 "Por favor, passe seu tempo em nossos planos."
 agent_events.3051.desc:0 "Está claro a partir de nossas discussões mais recentes que [Select_CString( target_rival.IsFemale, 'a', 'o' )] [target_rival.GetFirstName] está se aquecendo para mim, em grande parte por respeito a como estou lidando com o [scheme.GetName] [scheme.Custom('GetSchemeContract')] contra o inimigo odiado [target_rival.GetHerHim], [target.GetTitledFirstName].\n\nUma maneira estranha de encontrar um terreno comum com alguém, mas certamente uma muito fervorosa.\n\nTão fervoros[Select_CString( target_rival.IsFemale, 'a', 'o' )], de fato, que [Select_CString( target_rival.IsFemale, 'a', 'o' )] [target_rival.GetFirstNameNoTooltip] parece determinad[Select_CString( target_rival.IsFemale, 'a', 'o' )] a retribuir meus esforços contra seu rival, até mesmo de forma preventiva!"
 agent_events.3051.t:0 "Um Inimigo Comum"
 agent_events.3061.a.tt.extra_grace:0 "Seu [scheme|E] de [scheme.GetName] recebe vários meses de [secrecy_grace|E] adicionais"
 agent_events.3061.a:0 "Uma surpresa agradável!"
 agent_events.3061.desc:0 "Uma das principais vantagens de ter [Select_CString( target_spymaster.IsFemale, 'a', 'o' )] espiã[Select_CString( target_spymaster.IsFemale, '', 'o' )] d[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName], [target_spymaster.GetFirstName] envolvid[Select_CString( target_spymaster.IsFemale, 'a', 'o' )] no nosso [scheme.GetName] [scheme.Custom('GetSchemeContract')] é que a pessoa mais provável de nos descobrir está trabalhando habilmente para nos manter em segredo.\n\nEmbora sempre útil para manter essa capa de silêncio em torno de nossos esforços, [target_spymaster.GetFirstNameNoTooltip] tem sido #EMP particularmente#! hábil ultimamente, garantindo-nos vários meses de um silêncio certo e ininterrupto."
 agent_events.3061.t:0 "Graça Salvadora"
 agent_events.3071.a:0 "Algo para melhorar nossas chances, você diz..."
 agent_events.3071.b:0 "Uma maneira de acelerar nossos planos?"
 agent_events.3071.c:0 "Ajudar-nos a permanecer em segredo me intriga."
 agent_events.3071.d:0 "Meu plano já é impecável, obrigado."
 agent_events.3071.desc.intro.councillor:0 "Sendo um dos conselheiros de confiança d[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName], as habilidades e visão d[Select_CString( agent.IsFemale, 'a', 'o' )] [agent.GetTitledFirstName] servem bem à nossa causa."
 agent_events.3071.desc.intro.nemesis:0 "O profundo ódio d[Select_CString( agent.IsFemale, 'a', 'o' )] [agent.GetTitledFirstName|U] [Select_CString( target.IsFemale, 'pela', 'pelo' )] [target.GetTitledFirstName] motiva uma #EMP verdadeiramente#! incrível criatividade quando tem a oportunidade de se expressar."
 agent_events.3071.desc.intro.spymaster:0 "Como espião d[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName], [agent.GetTitledFirstName] tem muitas oportunidades de encontrar maneiras únicas de aumentar nosso pequeno [scheme.Custom('GetSchemeContract')]."
 agent_events.3071.desc.outro:0 "\n\nHoje, isso se manifesta como uma gama de possíveis agentes que poderíamos integrar ao empreendimento. Mais de um arrisca desestabilizar nossos esforços, mas qualquer um deles ainda poderia ser um poderoso acréscimo."
 agent_events.3071.t:0 "Se Eu Puder Sugerir"
 agent_events.4001.a:0 "Você é um fardo, [distant_agent.GetTitledFirstNameNoTooltip], vá embora!"
 agent_events.4001.b:0 "Maldição..."
 agent_events.4001.desc:0 "Não importa qual seja o outro valor [distant_agent.GetHerHim] para nosso [scheme.Custom('GetSchemeContract')], não há como negar que a distância entre [distant_agent.GetTitledFirstName] e [scheme.GetTargetCharacter.GetTitledFirstName] nos causa... problemas.\n\nUm agente remoto simplesmente não pode ser tão útil quanto um que possa se mover conforme necessário.\n\nInfelizmente, agora pagamos o preço por isso."
 agent_events.4001.t:0 "Muito Longe"
 agent_events.4011.a:0 "Ganhas sutis são sempre as melhores."
 agent_events.4011.b:0 "O potencial futuro parece útil..."
 agent_events.4011.c:0 "A discrição é fundamental!"
 agent_events.4011.d:0 "Isso abre algumas portas para nós."
 agent_events.4011.desc:0 "É verdadeiramente uma bênção ter alguém como [skilled_agent.GetTitledFirstName] envolvid[Select_CString( skilled_agent.IsFemale, 'a', 'o' )] em nosso [scheme.Custom('GetSchemeContract')], alguém capaz de avançar nossos objetivos de várias maneiras, simplesmente aguardando a direção.\n\nUma combinação invejável de habilidade, acesso e proximidade com [Select_CString( scheme.GetTargetCharacter.IsFemale, 'a', 'o' )] [scheme.GetTargetCharacter.GetTitledFirstName] nos oferece uma variedade de opções sobre como explorar [skilled_agent.GetSheHe]."
 agent_events.4011.t:0 "Uma Sombra na Corte"
 agent_events_0001_agents_focused_on_scheme_modifier:0 "Trabalhe, Não Fale"
 agent_events_0001_agents_focused_on_scheme_modifier_desc:0 "Não estamos aqui para socializar, estamos aqui para #EMP realizar#!."
 agent_events_0011_friends_working_on_scheme_together_modifier:0 "Atmosfera Convivial"
 agent_events_0011_friends_working_on_scheme_together_modifier_desc:0 "Este plano tem um grupo próximo de amigos por trás dele."
 agent_events_0012_lovers_get_weird_about_scheme_modifier:0 "Tudo Parte do Jogo"
 agent_events_0012_lovers_get_weird_about_scheme_modifier_desc:0 "Amantes em potencial podem encontrar romance nos lugares mais estranhos."
 agent_events_0021_scheme_speed_boost_modifier:0 "Focado no Objetivo"
 agent_events_0021_scheme_speed_boost_modifier_desc:0 "É importante, acima de tudo, lembrar o que devemos realizar."
 agent_events_0041_better_agent_focusing_modifier:0 "Talentos Redirecionados"
 agent_events_0041_better_agent_focusing_modifier_desc:0 "Só porque você pode ensinar alguém uma lição, não significa que você deva."
 agent_events_1001_rival_agents_forced_submission_modifier:0 "Submissão Forçada"
