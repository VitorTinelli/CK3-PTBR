l_spanish:
 bastard_remains_bastard_tt:0 "[child.GetShortUIName|U] continua sendo um [bastard|E] não legitimado"
 birth.0002.a:0 "Bondade gerada pelo nascimento!"
 birth.0002.desc:0 "A cada nascimento, a cordialidade em minha direção cresce; quando seguro meu recém-nascido nos braços, sou recebido com mais calor e bondade do que nunca antes. Acho que tenho uma reunião bastante impressionante de filhos..."
 birth.0002.t:0 "Todos os Meus Filhos"
 birth.1001.a:0 "Que você cresça forte e sábio, [Select_CString( child.IsFemale, 'minha', 'meu' )] [child.Custom('GetDaughterSon')]."
 birth.1001.b:0 "Que vocês cresçam fortes e sábios, [Select_CString( child.IsFemale, 'minhas', 'meus' )] [child.Custom('TwinDaughtersSonsChildren')]."
 birth.1001.children.desc:0 "dois lindos bebês!\n\n"
 birth.1001.children.t:0 "Meus Bebês"
 birth.1001.daughters.desc:0 "duas lindas meninas!\n\n"
 birth.1001.daughters.t:0 "Minhas Filhas"
 birth.1001.desc.twin:0 "Eu dei à luz [Select_CString( child.IsFemale, 'lindas', 'lindos' )] [child.Custom('TwinDaughtersSonsChildren')]!"
 birth.1001.desc.twin_dead_father:0 "Eu dei à luz [Select_CString( child.IsFemale, 'lindas', 'lindos' )] [child.Custom('TwinDaughtersSonsChildren')]! [father.GetFirstName] teria adorado el[Select_CString( child.IsFemale, 'as', 'es' )]..."
 birth.1001.desc:0 "Eu dei à luz [Select_CString( child.IsFemale, 'uma linda', 'um lindo' )] [child.Custom('GetDaughterSon')]!"
 birth.1001.desc_dead_father:0 "Eu dei à luz [Select_CString( child.IsFemale, 'uma linda', 'um lindo' )] [child.Custom('GetDaughterSon')]! [father.GetFirstName] teria adorado el[Select_CString( child.IsFemale, 'a', 'e' )]..."
 birth.1001.end_fallback.desc:0 "Quem você se tornará, meu filho, e como devo chamá-lo?"
 birth.1001.first_birth_good.desc:0 "Quando a primeira contração começou, uma grande calma tomou conta de mim. Não havia espaço para as minhas preocupações de antes — eu estava prestes a realizar um dos maiores milagres da vida. Após uma longa, porém gloriosa luta, eu trouxe ao mundo"
 birth.1001.first_birth_scary.desc:0 "Conversei com inúmeras mães e parteiras, levei seus conselhos a sério. No entanto, quando chegou a minha hora, percebi que nenhum preparo seria suficiente.\n\nAs dores eram avassaladoras e eu temia pela minha vida. Mas superei, e agora tenho"
 birth.1001.heir.t:0 "[Select_CString( child.IsFemale, 'Minha', 'Meu' )] [child.Custom('GetDaughterSon')|U] e [Select_CString( child.IsFemale, 'Herdeira', 'Herdeiro' )]"
 birth.1001.many_births.desc:0 "A cada nascimento, fica um pouco mais fácil — mas nunca deixo de me surpreender com a intensidade da experiência e com a minha própria força. Mais uma vez, trouxe nova vida a este mundo, na forma de"
 birth.1001.not_first_birth.desc:0 "Meu alívio é imenso, e minha alegria ainda maior! Eu dei à luz"
 birth.1001.other_gender_heir.desc:0 "Um dia, [Select_CString( child.IsFemale, 'filha', 'filho' )], você continuará meu legado. Que nome seria adequado para [Select_CString( child.IsFemale, 'uma poderosa', 'um poderoso' )] [child.GetLadyLord]?"
 birth.1001.same_gender_heir.desc:0 "Um dia, [Select_CString( child.IsFemale, 'filha', 'filho' )], você continuará meu legado. Que nome seria adequado para [Select_CString( child.IsFemale, 'uma', 'um' )] [ROOT.Char.GetTitleAsNameNoTooltip]?"
 birth.1001.sondaughter.desc:0 "[Select_CString( child.IsFemale, 'uma linda', 'um lindo' )] [child.Custom('GetDaughterSon')]!\n\n"
 birth.1001.sons.desc:0 "dois lindos meninos!\n\n"
 birth.1001.sons.t:0 "Meus Filhos"
 birth.1001.t:0 "[Select_CString( child.IsFemale, 'Minha', 'Meu' )] [child.Custom('GetDaughterSon')|U]"
 birth.1001.taltos.desc:0 "O [child.Custom('GetBirthOmen')] que [Select_CString( child.IsFemale, 'minha', 'meu' )] [child.Custom('GetDaughterSon')] carrega claramente o marca como [Select_CString( child.IsFemale, 'uma', 'um' )] [child.Custom('GetTaltosTerm')], [Select_CString( child.IsFemale, 'escolhida', 'escolhido' )] pelo [child.GetFaith.PantheonTerm] para cumprir um chamado específico. Embora eu ainda não saiba qual é esse chamado, devo dar um nome adequado [Select_CString( child.IsFemale, 'a minha filha', 'ao meu filho' )]."
 birth.1001.taltos_unfaithful.desc:0 "[Select_CString( child.IsFemale, 'Minha', 'Meu' )] [child.Custom('GetDaughterSon')] tem um [child.Custom('GetBirthOmen')], que os [child.Custom('DefaultPriestTitlePlural')] [child.GetFaith.GetAdjective] afirmam marcar [child.GetSheHe] para algo especial. Eu não entendo, mas ainda assim devo decidir um nome para [Select_CString( child.IsFemale, 'a minha', 'o meu' )] [child.Custom('GetDaughterSon')]..."
 birth.1001.twins.desc:0 "Quem vocês se tornarão, meus queridos, e como devo chamá-los?"
 birth.1001.twins_heir.desc:0 "Meus queridos filhos. Um de vocês crescerá para dar continuidade ao meu legado, e o outro sempre ficará em sua sombra. Espero que vocês se amem, aconteça o que acontecer."
 birth.1002.a.tt:0 "O mundo em geral não tem conhecimento da verdadeira paternidade de [child.GetFirstNamePossessiveNoTooltip]."
 birth.1002.a:0 "Silêncio agora, [Select_CString( child.IsFemale, 'minha', 'meu' )] [child.Custom('GetDaughterSon')]."
 birth.1002.b.tt:0 "O mundo em geral não tem conhecimento da verdadeira paternidade deles."
 birth.1002.b:0 "Silêncio agora, [Select_CString( child.IsFemale, 'minhas', 'meus' )] [child.Custom('TwinDaughtersSonsChildren')]."
 birth.1002.boy_name.desc:0 "\n\nUma parte de mim quer nomear meu filho em homenagem a [real_father.GetFirstNameNoTooltip], mas receio que isso não seja prudente..."
 birth.1002.c:0 "Fico pensando onde [real_father.GetFirstNameNoTooltip] está neste momento..."
 birth.1002.girl_name.desc:0 "\n\nOh, minha pequena, qual será o seu nome?"
 birth.1002.opening.twin:0 "Eu dei à luz 2 [Select_CString( child.IsFemale, 'lindas', 'lindos' )] [child.Custom('TwinDaughtersSonsChildren')]. Eles entram neste mundo completamente alheios ao segredo que devo guardar."
 birth.1002.opening:0 "Eu dei à luz [Select_CString( child.IsFemale, 'uma linda', 'um lindo' )] [child.Custom('GetDaughterSon')]. [child.GetSheHe|U] entra neste mundo completamente alheio ao segredo que devo guardar."
 birth.1002.true_father:0 "Temo o que aconteceria se alguém descobrisse que [real_father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] é o verdadeiro pai."
 birth.1002.twin_name.desc:0 "\n\nOh, meus filhos, como devo nomeá-los?"
 birth.1002.unmarried.twin:0 "que o pai deles é, na verdade, [real_father.GetFullName]."
 birth.1002.unmarried:0 "que o pai [child.GetHerHim] é, na verdade, [real_father.GetFullName]."
 birth.1003.a:0 "Que você cresça forte e sábio, [Select_CString( child.IsFemale, 'minha', 'meu' )] [child.Custom('GetDaughterSon')]."
 birth.1003.b:0 "Que você cresça forte e sábio!"
 birth.1003.children.desc:0 "dois lindos filhos perfeitos!\n\n"
 birth.1003.daughters.desc:0 "duas lindas meninas perfeitas!\n\n"
 birth.1003.dislikes_mother.desc:0 "Louvado seja [ROOT.Char.GetFaith.FertilityGodName], [mother.GetFirstNameNoTooltip] deu à luz"
 birth.1003.likes_mother.desc:0 "Com um sorriso cansado, porém cheio de felicidade, [mother.GetFirstName] me apresenta"
 birth.1003.loves_mother.desc:0 "Oh, [mother.GetFirstName], você foi tão corajosa! Tão forte! Palavras não podem descrever meu amor por você, e agora temos"
 birth.1003.sondaughter.desc:0 "[Select_CString( child.IsFemale, 'uma linda e perfeita', 'um lindo e perfeito' )] [child.Custom('GetDaughterSon')]!\n\n"
 birth.1003.sons.desc:0 "dois lindos meninos perfeitos!\n\n"
 birth.1005.a:0 "É o fardo que devemos carregar."
 birth.1005.desc.twin:0 "Meus lindos filhos estão descansando, alheios à vida desafiadora em que nasceram. O mundo não sabe quem é o pai deles, e eles talvez nunca venham a saber."
 birth.1005.desc:0 "[Select_CString( child.IsFemale, 'Minha linda', 'Meu lindo' )] [child.Custom('GetDaughterSon')] está descansando, [Select_CString( child.IsFemale, 'alheia', 'alheio' )] à vida desafiadora em que nasceu. O mundo não sabe quem é seu pai, e [child.GetSheHe] talvez nunca venha a saber."
 birth.1005.t:0 "Sem pai"
 birth.1006.a.message_desc:0 "O Verdadeiro Pai Sabe"
 birth.1006.a.mother_message:0 "[real_father.GetTitledFirstName] descobriu que [real_father.GetSheHe] é o verdadeiro pai"
 birth.1006.a.tt:0 "Mantenha o segredo para você"
 birth.1006.a:0 "Devo ter muito cuidado com isso."
 birth.1006.b:0 "O mundo conhecerá [Select_CString( child.IsFemale, 'minha filha', 'meu filho' )]!"
 birth.1006.bastard_explanation:0 "Você soube do nascimento de [child.GetFirstName], a mãe, [mother.GetShortUIName], ganha o Segredo [secret.GetName]"
 birth.1006.desc.twin:0 "gêmeos, e ambos sabemos que eu sou o pai deles."
 birth.1006.desc:0 "[Select_CString( child.IsFemale, 'uma', 'um' )] [child.Custom('GetDaughterSon')], e ambos sabemos que eu sou o pai [child.GetHerHim]."
 birth.1006.not_known:0 "\n\nFelizmente, [spouse_of_mother.Custom2('HerHisCharacterIntroduction', SCOPE.sC('mother'))] acredita que seja [spouse_of_mother.GetHerHim]."
 birth.1006.opening:0 "Não há mais nenhuma dúvida em minha mente. [mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] deu à luz"
 birth.1006.t:0 "Nascido Bastardo"
 birth.1006.unmarried:0 "\n\nFelizmente, [mother.GetFirstNameNoTooltip] manteve segredo sobre mim, e mais ninguém sabe a verdade, pelo menos por enquanto..."
 birth.1010.desc.twin:0 "[mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] deu à luz 2 [child.Custom('TwinDaughtersSonsChildren')]!\n\nComo os pequenos fazem parte da dinastia [ROOT.Char.GetDynasty.GetName], eles devem receber nomes dignos de sua herança."
 birth.1010.desc:0 "[mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] deu à luz [Select_CString( child.IsFemale, 'uma', 'um' )] [child.Custom('GetDaughterSon')]!\n\nComo o pequeno é fruto da árvore da dinastia [ROOT.Char.GetDynasty.GetName], [child.GetSheHe] deve receber um nome digno de sua herança."
 birth.1010.t:0 "Filho do Meu Sangue"
 birth.1010.t_twins:0 "Filhos do Meu Sangue"
 birth.1100.message:0 "Os [child.Custom('DefaultPriestTitlePlural')] identificaram [child.Custom2('MyCharacterIntroduction', ROOT.Char)] como um[Select_CString( child.IsFemale, 'a', '' )] [child.Custom('GetTaltosTerm')].\n\nEscolhid[Select_CString( child.IsFemale, 'a', 'o' )] pelo [child.GetFaith.PantheonTerm] para um propósito misterioso, qual será o futuro dessa criança?"
 birth.1100.title:0 "Nascimento de [child.Custom('GetTaltosTerm')]"
 birth.2001.a.standard:0 "Vou legitimar [child.GetSheHe] como [Select_CString( child.IsFemale, 'minha', 'meu' )] [child.Custom('GetDaughterSon')]!"
 birth.2001.a.twins:0 "Vou legitimá-los!"
 birth.2001.b.no_legitimization_in_faith:0 "[Select_CString( child.IsFemale, 'Destinada', 'Destinado' )] a uma vida de [Select_CString( child.IsFemale, 'bastarda', 'bastardo' )]..."
 birth.2001.b.standard:0 "Não posso desonrar minha família legitimando [Select_CString( child.IsFemale, 'uma bastarda', 'um bastardo' )]..."
 birth.2001.desc.father.standard:0 "Fora do casamento, [mother.GetTitledFirstName] deu à luz [Select_CString( child.IsFemale, 'nossa', 'nosso' )] [child.Custom('GetDaughterSon')]. Embora eu devesse estar alegre, meu coração está pesado de dúvida e medo.\n\nAssim continuará até que eu tenha tomado minha decisão."
 birth.2001.desc.father.twins:0 "Fora do casamento, [mother.GetTitledFirstName] deu à luz nossos filhos. Embora eu devesse estar alegre, meu coração está pesado de dúvida e medo.\n\nAssim continuará até que eu tenha tomado minha decisão."
 birth.2001.desc.mother.standard:0 "[Select_CString( child.IsFemale, 'Minha', 'Meu' )] [child.Custom('GetDaughterSon')] [Select_CString( child.IsFemale, 'recém-nascida', 'recém-nascido' )] dorme tão docemente, abençoadamente inconsciente da maldição que seguirá [child.GetSheHe] pelo resto de sua vida. Ser [Select_CString( child.IsFemale, 'uma bastarda', 'um bastardo' )] não é algo fácil neste mundo, assim como ser a mãe de [Select_CString( child.IsFemale, 'uma', 'um' )].\n\nMesmo enquanto meu bebê dorme, sou [Select_CString( ROOT.Char.IsFemale, 'mantida acordada', 'mantido acordado' )] pela escolha que fiz."
 birth.2001.desc.mother.twins:0 "Meus recém-nascidos dormem tão docemente, abençoadamente inconscientes da maldição que os seguirá pelo resto de suas vidas. Ser [Select_CString( child.IsFemale, 'uma bastarda', 'um bastardo' )] não é algo fácil neste mundo, assim como ser a mãe de bastardos.\n\nMesmo enquanto meus bebês dormem, sou [Select_CString( ROOT.Char.IsFemale, 'mantida acordada', 'mantido acordado' )] pela escolha que fiz."
 birth.2001.t:0 "A Bênção da Ignorância"
 birth.2002.a:0 "O futuro ainda guarda esperança."
 birth.2002.desc.standard:0 "Não apenas fui [Select_CString( ROOT.Char.IsFemale, 'abençoada', 'abençoado' )] com [Select_CString( child.IsFemale, 'uma', 'um' )] [child.Custom('GetDaughterSon')] [Select_CString( child.IsFemale, 'recém-nascida', 'recém-nascido' )], mas [legitimizer.GetTitledFirstName], [Select_CString( legitimizer.IsFemale, 'sua', 'seu' )] [legitimizer.GetTitledFirstName], escolheu legitimar [child.GetSheHe]!"
 birth.2002.desc.twins:0 "Não apenas fui [Select_CString( ROOT.Char.IsFemale, 'abençoada', 'abençoado' )] com gêmeos recém-nascidos — [legitimizer.GetMotherFather], [legitimizer.GetTitledFirstName], escolheu legitimá-los!"
 birth.2002.end:0 "\n\nOs últimos meses têm sido repletos de dúvidas e medo, mas hoje meu coração está leve como uma pena."
 birth.2002.start:0 "Este é verdadeiramente um dia digno de celebração!"
 birth.2002.t:0 "Duplamente Abençoado"
 birth.2003.a:0 "Eu gostaria que as coisas fossem diferentes, [Select_CString( child.IsFemale, 'pequena', 'pequeno' )] [child.GetFirstNameNoTooltip]!"
 birth.2003.desc.landed_end:0 "\n\nA marca de bastardia nunca desaparece completamente, embora o reconhecimento de [Select_CString( legitimizer.IsFemale, 'uma', 'um' )] [legitimizer.GetTitleTierName] certamente teria ajudado..."
 birth.2003.desc.standard_start:0 "Eu gostaria de poder celebrar o nascimento de [Select_CString( child.IsFemale, 'nossa', 'nosso' )] [child.Custom('GetDaughterSon')], mas [legitimizer.GetTitledFirstName] deixou claro que [Select_CString( child.IsFemale, 'a', 'o' )] bebê não será considerado um membro verdadeiro da sua casa."
 birth.2003.desc.twin_start:0 "Eu gostaria de poder celebrar o nascimento de nossos filhos, mas [legitimizer.GetTitledFirstName] deixou claro que os bebês não serão verdadeiros membros da sua casa."
 birth.2003.desc.unlanded_end:0 "\n\nA marca de bastardia nunca desaparece completamente, embora o reconhecimento de [Select_CString( legitimizer.IsFemale, 'uma', 'um' )] [legitimizer.GetLadyLord] certamente teria ajudado..."
 birth.2003.t:0 "Um Começo Difícil"
 birth.2004.a.standard:0 "Orgulhe-os, [Select_CString( child.IsFemale, 'minha', 'meu' )] [child.Custom('GetDaughterSon')]."
 birth.2004.a.twins:0 "Orgulhem-se, meus filhos."
 birth.2004.desc.standard:0 "Pelo que parece, [Select_CString( child.IsFemale, 'minha', 'meu' )] [child.Custom('GetDaughterSon')] [Select_CString( child.IsFemale, 'recém-nascida', 'recém-nascido' )] pode ter um futuro brilhante pela frente, afinal. [Select_CString( secondary_legitimizer.IsFemale, 'Sua', 'Seu' )] [secondary_legitimizer.GetMotherFather], [secondary_legitimizer.GetTitledFirstName], recebeu [child.GetSheHe] na casa [secondary_legitimizer.GetDynastyName]."
 birth.2004.desc.twins:0 "Pelo que parece, meus recém-nascidos podem ter futuros brilhantes pela frente, afinal. [Select_CString( secondary_legitimizer.IsFemale, 'Sua', 'Seu' )] [secondary_legitimizer.GetMotherFather], [secondary_legitimizer.GetTitledFirstName], recebeu-os na casa [secondary_legitimizer.GetDynastyName]."
 birth.2004.t:0 "A Misericórdia [Select_CString( secondary_legitimizer.IsFemale, 'da', 'do' )] [secondary_legitimizer.GetMotherFather|U]"
 birth.2011.desc:0 "Embora concebido fora dos laços do casamento, [Select_CString( child.IsFemale, 'minha', 'meu' )] [child.Custom('GetDaughterSon')] [Select_CString( child.IsFemale, 'recém-nascida', 'recém-nascido' )] chegou a este mundo com segurança.\n\n[child.GetSheHe|U] nasceu na casa de [legitimizer.GetHouse.GetBaseName], e é assim que [child.GetSheHe] será [Select_CString( child.IsFemale, 'criada', 'criado' )]."
 birth.2011.t:0 "[Select_CString( child.IsFemale, 'Minha', 'Meu' )] [child.Custom('GetDaughterSon')]"
 birth.2102.a:0 "O que devo fazer com isso?"
 birth.2102.desc.twin:0 "Minha [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))], [mother.GetTitledFirstName], deu à luz a 2 [child.Custom('TwinDaughtersSonsChildren')] do [real_father.GetTitledFirstNamePossessive]. Eles os chamam de [child.GetFirstName] e [child_2.GetFirstName]."
 birth.2102.desc:0 "Minha [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))], [mother.GetTitledFirstName], deu à luz a uma criança gerada por outro homem. Agora, [mother.GetSheHe] está amamentando [Select_CString( child.IsFemale, 'a', 'o' )] [child.Custom('GetDaughterSon')] do [real_father.GetTitledFirstNamePossessive]. Eles [Select_CString( child.IsFemale, 'a', 'o' )] chamam de [child.GetFirstName]."
 birth.2102.t:0 "Prole do [real_father.GetTitledFirstNamePossessiveNoTooltip|U]"
 birth.2104.a:0 "O que devo fazer com isso?"
 birth.2104.desc.twin:0 "Meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))], [real_father.GetTitledFirstName], gerou filhos com a [mother.GetTitledFirstName]. Agora, [mother.GetFirstName] está amamentando a prole do meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))]."
 birth.2104.desc:0 "Meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))], [real_father.GetTitledFirstName], gerou uma criança com a [mother.GetTitledFirstName]. Agora, [mother.GetFirstName] está amamentando a prole do meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))]."
 birth.2104.t:0 "Uma Criança Estranha"
 birth.3001.a.tt:0 "@death_icon! [Select_CString( dummy_gender.IsFemale, 'Sua', 'Seu' )] [dummy_gender.Custom('DaughterSon')] nasceu [Select_CString( dummy_gender.IsFemale, 'morta', 'morto' )]"
 birth.3001.a:0 "Por que... Por que [dummy_gender.GetSheHe] não está respirando?! #EMP Façam algo!#!"
 birth.3001.desc_other_child:0 "\"Mais um empurrão, [ROOT.Char.Custom('FormOfAddressForLiege')]! O bebê está quase aqui!\" Um grito escapa dos meus lábios enquanto me esforço pela última vez. A dor está em todos os lugares, demais, avassaladora — e então, acaba. Eu... Eu consegui.\n\n\"Está tudo bem com [dummy_gender.GetSheHe]?!\" Mal reconheço minha própria voz. \"Está... É [Select_CString( dummy_gender.IsFemale, 'uma', 'um' )] [dummy_gender.Custom('GirlBoy')]?\"\"\n\nA parteira não me responde, nem mesmo olha para mim. Não, ela só tem olhos para o bebê imóvel em seus braços."
 birth.3001.t:0 "Acolhido pela Morte"
 birth.3002.a:0 "[Select_CString( dummy_gender.IsFemale, 'Minha', 'Meu' )] [dummy_gender.Custom('DaughterSon')]? No... no [ROOT.Char.GetFaith.PositiveAfterLife]?"
 birth.3002.desc:0 "Ao abrir a porta da câmara de parto, não sou [Select_CString( ROOT.Char.IsFemale, 'recebida', 'recebido' )] por parteiras sorridentes e um bebê chorando, mas sim pelos lamentos dilacerantes da [mother.GetTitledFirstNamePossessive].\n\n\"Me desculpe tanto, [ROOT.Char.Custom('FormOfAddressForLiege')].\" A parteira não olha nos meus olhos. Em seus braços está um pequeno pacote coberto. \"[Select_CString( dummy_gender.IsFemale, 'Sua', 'Seu' )] [dummy_gender.Custom('DaughterSon')]... [dummy_gender.GetSheHe|U] está no [ROOT.Char.GetFaith.PositiveAfterLife] agora.\""
 birth.3011.a:0 "Por favor... O nome [child.GetHerHim]..."
 birth.3011.adventurer:0 "Enquanto caio de volta na minha cama, o mundo escurece..."
 birth.3011.desc:0 "M[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('DaughterSon')] é perfeit[Select_CString( child.IsFemale, 'a', 'o' )]. Seu pequeno rosto, o jeito que [child.GetSheHe] cheira... Eu quero permanecer neste momento para sempre, mas a parteira só me deixa segurar [child.GetSheHe] por alguns instantes. Tento protestar quando ela tira [child.GetSheHe] de mim, mas meus braços estão fracos e luto para encontrar as palavras.\n\n\"Não se preocupe, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip]. S[Select_CString( child.IsFemale, 'ua', 'eu' )] [child.Custom('DaughterSon')] é forte e saudável. Você é nossa preocupação agora.\"\n\n"
 birth.3011.desc_twin:0 "Os gêmeos são perfeitos. Seus pequenos rostos, o jeito que eles cheiram... Eu quero permanecer neste momento para sempre, mas a parteira só me deixa segurá-los por alguns instantes. Tento protestar quando ela os tira de mim, mas meus braços estão fracos e luto para encontrar as palavras.\n\n\"Não se preocupe, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip]. Seus [child.Custom('TwinDaughtersSonsChildren')] são fortes e saudáveis. Você é nossa preocupação agora.\"\n\n"
 birth.3011.landed:0 "Enquanto minhas criadas correm freneticamente para lá e para cá, o mundo escurece..."
 birth.3011.twin.a:0 "Por favor... Os nomes deles..."
 birth.3012.a:0 "Inícios tão trágicos..."
 birth.3012.desc:0 "um novo começo. Eu devo ser forte [Select_CString( child.IsFemale, 'pela minha', 'pelo meu' )] [child.Custom('DaughterSon')]."
 birth.3012.desc_twin:0 "duas novas vidas acabaram de começar. Eu devo ser forte [Select_CString( child.IsFemale, 'pelas minhas', 'pelos meus' )] [child.Custom('TwinDaughtersSonsChildren')]."
 birth.3012.start.desc:0 "Quando a parteira finalmente sai da câmara de parto com um pacote que chora suavemente em seus braços, um alívio me invade.\n\nEntão, vejo a expressão em seu rosto.\n\n\"Sinto muito, [ROOT.Char.Custom('FormOfAddressForLiege')]. [mother.GetLadyLord|U] [mother.GetFirstNameNoTooltip]...\" As palavras falham, mas o tom de sua voz diz tudo.\n\nUma vida se apagou, mas"
 birth.3021.a:0 "Por que... [dummy_gender.GetSheHe]..."
 birth.3021.desc:0 "Minha respiração ofegante é o único som que corta o silêncio na câmara de parto. Procuro no quarto sorrisos encorajadores, qualquer coisa que me ajude a suportar a dor. Só vejo meu próprio medo refletido de volta para mim.\n\nQuando a criança finalmente chega, o esperado choro não vem. \"Por que [dummy_gender.GetSheHe] não está chorando?\" As palavras parecem pesadas na minha boca. Tudo parece pesado.\n\nForço meus lábios a formular as palavras novamente."
 birth.3022.a.buddhism:0 "O que fizemos para merecer isso?!"
 birth.3022.a:0 "Por quê?! [ROOT.Char.GetFaith.FertilityGodName|U], o que fiz para merecer isso?"
 birth.3022.desc:0 "Enquanto espero do lado de fora do [ROOT.Char.Custom('GetChamber')] de parto, cada minuto parece uma eternidade. Os gritos de [mother.GetFirstNamePossessive] cessaram, sem que o choro de um bebê os substituísse. Algo está errado; posso sentir isso nos meus ossos.\n\nA [ROOT.Char.Custom('GetDoor')] se abre. A expressão angustiada da parteira confirma todos os meus temores.\n\n\"Lamento profundamente, [ROOT.Char.Custom('FormOfAddressForLiege')]. [mother.GetLadyLord|U] [mother.GetFirstNameNoTooltip]... Seu [dummy_gender.Custom('DaughterSon')]... Ambos estão no [ROOT.Char.GetFaith.PositiveAfterLife] agora.\""
 birth.3031.a:0 "Cale-se agora, [child.GetFirstNameNoTooltip]! Por favor, não chore!"
 birth.3031.daughterson.desc:0 "\"[Select_CString( child.IsFemale, 'Sua', 'Seu' )] [child.Custom('DaughterSon')]"
 birth.3031.end.desc:0 "não está ganhando peso como deveria. Nós cuidaremos bem [child.GetHerHim], [ROOT.Char.Custom('FormOfAddressForLiege')], mas no final, a vida [child.GetHerHim] está nas mãos de [ROOT.Char.GetFaith.FateGodName]."
 birth.3031.princessprince.desc:0 "\"[Select_CString( child.IsFemale, 'A pequena', 'O pequeno' )] [child.GetLadyLord]"
 birth.3031.start.desc:0 "Todos os bebês choram, mas com [child.GetFirstName] não há fim para as lágrimas. Eu quero desesperadamente que a parteira alivie minhas preocupações, mas sua testa franzida só piora as coisas.\n\n"
 birth.3031.t:0 "[Select_CString( child.IsFemale, 'Embriagada', 'Embriagado' )] pela Doença"
 birth.3032.bastard.desc:0 "\"O pequeno/A pequena [child.GetFirstName]"
 birth.3032.start.bastard.desc:0 "Todos os bebês choram, mas com o/a pequeno(a) [child.GetFirstName] as lágrimas não têm fim. A parteira franziu a testa.\n\n"
 birth.3034.a:0 "Onde está meu [ROOT.Char.Custom('child_favorite_toy')]? Vamos brincar!"
 birth.3034.desc:0 "A maioria das outras crianças é mais forte do que eu. Quando brincamos, eu tenho que sentar e descansar muito. Mas hoje, quando estávamos correndo para os estábulos, eu ganhei!"
 birth.3034.t:0 "Crescendo Forte"
 birth.3035.a:0 "Que você cresça forte, [child.GetFirstNameNoTooltip]."
 birth.3035.desc:0 "A fraqueza que tem assolado [Select_CString( child.IsFemale, 'minha', 'meu' )] [child.Custom('GetDaughterSon')] desde o nascimento finalmente se soltou! O alívio me invade ao ver [child.GetFirstName] correndo com todas as outras crianças."
 birth.3041.a:0 "Não deveria minha força estar retornando agora?"
 birth.3041.desc_twins:0 "[child.Custom('TwinDaughtersSonsChildren')],"
 birth.3041.end:0 "mas ainda estou presa à cama. À medida que os dias passam sem muita melhora, minha alegria é consumida por um cansaço terrível."
 birth.3041.one_child.desc:0 "[Select_CString( child.IsFemale, 'pequena', 'pequeno' )] [child.GetFirstNameNoTooltip],"
 birth.3041.start.desc:0 "Já se passaram algumas semanas desde que dei à luz [Select_CString( child.IsFemale, 'minha', 'meu' )]"
 birth.3041.t:0 "Cansada"
 birth.9002.a.rename:0 "[SCOPE.GetFlagName('name_suggestion')]"
 birth.9002.a.tt.1:0 "Nomeamos [Select_CString( child.IsFemale, 'nossa filha', 'nosso filho' )] de [namesake.GetFirstNameNoTooltip]"
 birth.9002.a.tt.2:0 "Nomeamos [Select_CString( child.IsFemale, 'nossa filha', 'nosso filho' )] de [SCOPE.GetFlagName('name_suggestion')]"
 birth.9002.a1:0 "Uma ideia encantadora. [namesake.GetFirstNameNoTooltip], será."
 birth.9002.a2:0 "Uma ideia encantadora. [SCOPE.GetFlagName('name_suggestion')], será."
 birth.9002.b.tt:0 "Você irá nomear [child.GetSheHe] de algo mais adequado"
 birth.9002.b1:0 "Na verdade, eu tinha outra coisa em mente..."
 birth.9002.b2:0 "O quê?! Isso é uma ideia terrível!"
 birth.9002.calm.desc:0 "[suggester.GetTitledFirstName] olha para mim, seu rosto sereno."
 birth.9002.conviction.desc:0 "[suggester.GetTitledFirstName] olha para mim, os olhos brilhando com uma convicção ardente."
 birth.9002.creator.desc:0 "vamos nomear nosso bebê de [SCOPE.GetFlagName('name_suggestion')], em honra ao nosso Criador!"
 birth.9002.dear_spouse.desc:0 "\"[Select_CString( ROOT.Char.IsFemale, 'Querida', 'Querido' )] [ROOT.Char.GetWifeHusband|U],"
 birth.9002.devotion.desc:0 "O olhar de [suggester.GetTitledFirstNamePossessive] encontra o meu. Seus olhos transbordam de amorosa devoção."
 birth.9002.love.desc:0 "\"Meu amor,"
 birth.9002.lunatic.desc:0 "Tenho a melhor ideia! Devemos nomear [child.GetSheHe] de [SCOPE.GetFlagName('name_suggestion')]! [child.GetSheHe] não parece uma pequena [SCOPE.GetFlagName('name_suggestion')]?"
 birth.9002.namer_relative.desc:0 "talvez devêssemos nomear [child.GetSheHe] de [namesake.GetFirstNameNoTooltip]? Em homenagem [Select_CString( namesake.IsFemale, 'a sua', 'ao seu' )] [namesake.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('namesake'))]?"
 birth.9002.namers_name.desc:0 "vamos nomear [child.GetSheHe] de [ROOT.Char.GetFirstNameNoTooltip], em sua homenagem."
 birth.9002.nice_name.desc:0 "Estive pensando. Quero que nomeemos [child.GetSheHe] de [namesake.GetFirstNameNoTooltip]. Sempre amei esse nome."
 birth.9002.possessed.desc:0 "Senti a presença [child.GetHerHim]. [child.GetSheHe|U] exige que nomeamos [Select_CString( child.IsFemale, 'nossa', 'nosso' )] [child.Custom('DaughterSon')] de [SCOPE.GetFlagName('name_suggestion')]."
 birth.9002.pride.desc:0 "[suggester.GetTitledFirstName] olha para mim, cabeça erguida e olhos brilhando de orgulho."
 birth.9002.religious_apostle.desc:0 "devemos nomear [child.GetSheHe] de [SCOPE.GetFlagName('name_suggestion')], em honra ao piedoso apóstolo."
 birth.9002.religious_fallback.desc:0 "devemos nomear [child.GetSheHe] em homenagem [Select_CString( child.IsFemale, 'a gloriosa', 'ao glorioso' )] [SCOPE.GetFlagName('name_suggestion')]!"
 birth.9002.religious_god.desc:0 "devemos nomear [child.GetSheHe] de [SCOPE.GetFlagName('name_suggestion')], em honra ao grande deus!"
 birth.9002.religious_godess.desc:0 "devemos nomear [child.GetSheHe] de [SCOPE.GetFlagName('name_suggestion')], em honra à grande deusa!"
 birth.9002.religious_holy_virgin.desc:0 "devemos nomear [child.GetSheHe] de [SCOPE.GetFlagName('name_suggestion')], em honra à santa virgem."
 birth.9002.spouse.desc:0 "\"[ROOT.Char.GetWifeHusband|U],"
 birth.9002.start.desc:0 "Com o bebê embalado em seus braços,"
 birth.9002.suggester_relative.desc:0 "poderíamos nomear [child.GetSheHe] de [namesake.GetFirstNameNoTooltip], em homenagem [Select_CString( namesake.IsFemale, 'a minha', 'ao meu' )] [namesake.Custom('ComplimentAdjective')] [suggester.Custom2('RelationToMeShort', SCOPE.sC('namesake'))]?\""
 birth.9002.suggesters_name.desc:0 "Acho que devemos nomear [child.GetSheHe] de [suggester.GetFirstNameNoTooltip], em minha homenagem. O que você acha?"
 birth.9002.surprisingly_calm.desc:0 "[suggester.GetTitledFirstName] olha para mim, seu rosto surpreendentemente sereno."
 birth.9002.t:0 "O Que Há em Um Nome?"
 birth.9002.tears.desc:0 "[suggester.GetTitledFirstName] enxuga as lágrimas das bochechas e me dirige a palavra sem desviar os olhos de [Select_CString( child.IsFemale, 'minha', 'meu' )] [child.Custom('GetDaughterSon')]."
 birth.9002.worrying.desc:0 "[suggester.GetTitledFirstName] olha para mim com um brilho preocupante nos olhos."
 birth.9003.a:0 "Muito melhor."
 birth.9003.desc:0 "Pego delicadamente o bebê dos braços de [suggester.GetTitledFirstNamePossessive] e olho para os perfeitos olhinhos del[Select_CString( child.IsFemale, 'a', 'e' )]. Quem você se tornará?"
 birth.9004.a:0 "Ah, um nome #EMP muito#! melhor!"
 birth.9004.b.other:0 "Na verdade, [child.GetFirstNameNoTooltip] é muito bom, afinal..."
 birth.9004.b.tt.other:0 "[child.GetFirstNameNoTooltip] mantém seu antigo nome"
 birth.9004.b.tt:0 "Você mantém seu antigo nome"
 birth.9004.b:0 "Pensando bem, acho que [ROOT.Char.GetFirstNameNoTooltip] está bom..."
 birth.9004.desc.me:0 "[ROOT.Char.GetFirstNameNoTooltip].\n\nUm nome tão sem graça, eu penso às vezes, refletindo sobre como será lido pelos futuros historiadores.\n\nMas eu sou [Select_CString( ROOT.Char.IsFemale, 'uma', 'um' )] [ROOT.Char.GetTitleAsNameNoTooltip], e se eu desejar ser [Select_CString( ROOT.Char.IsFemale, 'chamada', 'chamado' )] de outra forma, certamente basta eu informar ao mundo?"
 birth.9004.desc:0 "[child.GetFirstNameNoTooltip].\n\nInicialmente eu gostava do nome, mas agora parece estranho aos meus ouvidos. O que [child.GetSheHe] vai pensar do seu nome quando crescer?\n\nTalvez eu deva mudá-lo para algo melhor?"
 birth.9004.t:0 "O que há em um nome?"
