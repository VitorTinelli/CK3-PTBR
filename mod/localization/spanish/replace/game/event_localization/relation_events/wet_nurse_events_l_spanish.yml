l_spanish:
 backdown_from_rite_modifier:0 "Jovem Tribal Inseguro"
 backdown_from_rite_modifier_desc:0 "Este personagem não se comprometeu adequadamente com seu rito de passagem; ele é atormentado pelo sentimento de inadequação."
 bp2_decision.0001.a.aptitude:0 "[aptitude|E] da [wet_nurse_candidate_1.GetUINamePossessive] é [wet_nurse_candidate_1.GetCourtPositionAptitude( GetCourtPositionType( 'wet_nurse_court_position' ) )]"
 bp2_decision.0001.a:0 "Prefiro a experiente [wet_nurse_candidate_1.GetFirstNameNoTooltip]."
 bp2_decision.0001.b.aptitude:0 "[aptitude|E] da [wet_nurse_candidate_2.GetUINamePossessive] é [wet_nurse_candidate_2.GetCourtPositionAptitude( GetCourtPositionType( 'wet_nurse_court_position' ) )]"
 bp2_decision.0001.b:0 "[wet_nurse_candidate_2.GetFirstNameNoTooltip] é boa o suficiente."
 bp2_decision.0001.c:0 "Nenhuma delas me agrada."
 bp2_decision.0001.desc:0 "Com o objetivo de fornecer o melhor cuidado para nossas [ROOT.Char.Custom('GetChildChildren')]$bp2_decision.0001.desc_candidates$"
 bp2_decision.0001.desc_candidates:0 ", meus funcionários procuraram mulheres capacitadas para o papel de [GetCourtPositionType('wet_nurse_court_position').GetName()].\n\nAgora, eles apresentam algumas locais para o meu julgamento."
 bp2_decision.0001.desc_widower:0 "Dado que criar uma criança de status está longe de ser uma tarefa solitária$bp2_decision.0001.desc_candidates$"
 bp2_decision.0001.t:0 "$find_wet_nurse_decision$"
 bp2_decision.0002.a.flavor:0 "Será [teentribal.Custom('GirlBoy')] contra [teentribal.GetWomanMan]!"
 bp2_decision.0002.a.lose:0 "Se a luta for perdida"
 bp2_decision.0002.a.tt:0 "Você escolherá um oponente para [single_combat_duel|E]"
 bp2_decision.0002.a.win:0 "Se a luta for vencida"
 bp2_decision.0002.a:0 "Um duelo."
 bp2_decision.0002.b.tt:0 "Exiba para todos a prova do domínio da mente sobre o corpo!"
 bp2_decision.0002.b:0 "Um ritual de escarificação."
 bp2_decision.0002.b_modifier:0 "Se a lâmina tocar apenas levemente"
 bp2_decision.0002.b_scarred.tt:0 "Ganha [GetTrait('scarred').GetName( GetNullCharacter )|LV] ou [GetTrait('wounded_1').GetName( GetNullCharacter )|LV]"
 bp2_decision.0002.b_scarred:0 "Se as cicatrizes forem profundas"
 bp2_decision.0002.backout:0 "[SelectLocalization(ObjectsEqual(teentribal, ROOT.Char),'Eu não estou',teentribal.GetFirstNameNoTooltip)] [SelectLocalization(ObjectsEqual(teentribal, ROOT.Char),'não está','')] pront[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ainda"
 bp2_decision.0002.c.destination:0 "Você escolherá um [travel_destination|E]"
 bp2_decision.0002.c.tt:0 "A natureza selvagem revela o verdadeiro eu."
 bp2_decision.0002.c:0 "Reclusão."
 bp2_decision.0002.c_lose:0 "Se a reclusão for angustiante"
 bp2_decision.0002.c_trait:0 "Ganha um [commander_trait|E] com base no terreno de destino"
 bp2_decision.0002.c_win:0 "Se a reclusão for mestra"
 bp2_decision.0002.cooldown:0 "@alert_icon! #alert_trial [decision|E] $bp2_decision.0002.t$ ficará indisponível por #V 1 ano#!"
 bp2_decision.0002.d.tt:0 "Que os privilégios da infância sejam cortados!"
 bp2_decision.0002.d:0 "Corte de Cabelo"
 bp2_decision.0002.d_artifact:0 "Ganha um [artifact|E]"
 bp2_decision.0002.d_bald:0 "Se tudo for raspado"
 bp2_decision.0002.d_shave:0 "Se apenas uma mecha de cabelo for cortada"
 bp2_decision.0002.desc:0 "O tempo traz novos adultos para uma tribo [ROOT.Char.GetCulture.GetName], mas apenas cerimônias de prova estabelecem maturidade, status e valor. [teentribal.GetFirstName], m[Select_CString( teentribal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort',teentribal)], está em uma idade adequada. Nosso povo [ROOT.Char.GetCulture.GetEthos.GetNameNoTooltip|l] tem três meios tradicionais de testar [teentribal.GetSheHe].\n\n"
 bp2_decision.0002.desc_cleansing:0 "O poder purificador do $cleansing_type_element$ só pode ser alcançado com paciência e zelo."
 bp2_decision.0002.desc_duel:0 "Em um duelo contra outr[Select_CString( teentribal.IsFemale, 'a', 'o' )] [teentribal.GetWomanMan] [ROOT.Char.GetCulture.GetName], prevalecemos pela habilidade e força."
 bp2_decision.0002.desc_end:0 "\n\nSe [Select_CString( teentribal.IsFemale, 'a', 'o' )] [teentribal.GetFirstNameNoTooltip] passar em qualquer um desses testes, [teentribal.GetSheHe] será favorecido aos olhos de [ROOT.Char.GetFaith.HighGodName], e honrado como um[Select_CString( teentribal.IsFemale, 'a', '' )] [teentribal.GetWomanMan] dign[Select_CString( teentribal.IsFemale, 'a', 'o' )] [ROOT.Char.GetCulture.GetNameNoTooltip]."
 bp2_decision.0002.desc_end_root:0 "\n\nSe eu passar em qualquer um desses testes, me tornarei digno aos olhos de [ROOT.Char.GetFaith.HighGodName], e um[Select_CString( teentribal.IsFemale, 'a', '' )] [teentribal.GetWomanMan] honrad[Select_CString( teentribal.IsFemale, 'a', 'o' )] [ROOT.Char.GetCulture.GetNameNoTooltip]."
 bp2_decision.0002.desc_hair_shaving:0 "Raspar a cabeça de cabelos cativantes prova força de vontade."
 bp2_decision.0002.desc_root:0 "Até que eu alcance a maioridade, meus companheiros [ROOT.Char.GetCulture.GetCollectiveNoun] não me respeitarão como membro pleno da minha tribo. Nosso povo orientado pela [ROOT.Char.GetCulture.GetEthos.GetNameNoTooltip|l] tem três cerimônias tradicionais para marcar a passagem para a maturidade... e provar meu valor como [ROOT.Char.GetTitleAsName].\n\n"
 bp2_decision.0002.desc_scarification:0 "Na escarificação, a determinação é marcada na pele."
 bp2_decision.0002.desc_seclusion:0 "Na reclusão, testamos a adaptabilidade e a previsão."
 bp2_decision.0002.e.full:0 "Se o elemento for completamente abraçado"
 bp2_decision.0002.e.partially:0 "Se o ritual for meio termo"
 bp2_decision.0002.e.tt:0 "A força primal do $cleansing_type_element$ purificará mente e corpo."
 bp2_decision.0002.e:0 "Uma purificação de $cleansing_type_element$."
 bp2_decision.0002.e_flip:0 "Chance de mudar um [trait|E] [sinful|E] para um [virtuous|E]"
 bp2_decision.0002.effect_modifier_tt:0 "Ganha [GetModifier('proven_adult_modifier').GetNameWithTooltip] ou [GetModifier('insecure_adult_modifier').GetNameWithTooltip] por #V 10 anos#!"
 bp2_decision.0002.effect_tt:0 "Ganha um ponto de [personality_trait|E], [lifestyle_experience|E] ou [skill|E]"
 bp2_decision.0002.f:0 "$bp2_decision.0002.backout$."
 bp2_decision.0002.t:0 "Ritos de Passagem"
 bp2_decision.0002.tt:0 "@alert_icon! #alert_trial Você não será reembolsado pelo custo desta [decision|E]#!\n@alert_icon! #alert_trial A [decision|E] dos $bp2_decision.0002.t$ ficará indisponível por #V 1 ano#!"
 bp2_yearly.7000.a.tt:0 "Você financia uma visita a um médico"
 bp2_yearly.7000.a:0 "Não se preocupe, vou cuidar de você."
 bp2_yearly.7000.b.tt:0 "A ausência do cuidado da [wet_nurse.GetFirstNamePossessiveNoTooltip] é sentida."
 bp2_yearly.7000.b:0 "Vamos torná-lo um afastamento permanente."
 bp2_yearly.7000.c:0 "Doença? Mantenha-se longe das minhas crianças!"
 bp2_yearly.7000.c_child_liege:0 "Doença? Melhor você ficar longe de mim!"
 bp2_yearly.7000.desc:0 "A ama de leite, [wet_nurse.GetFirstName], pediu uma audiência imediata comigo.\n\n\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] querid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [wet_nurse.Custom2('RelationToMe', ROOT.Char)], adoeci! Preciso implorar por alguns dias de descanso — meus humores ruins podem afetar as crianças sob os meus cuidados.\"\n\n[wet_nurse.GetSheHe|U] diz isso com uma urgência doentia."
 bp2_yearly.7000.desc_child_liege:0 "Minha ama de leite, [wet_nurse.GetFirstName], não está indo muito bem ultimamente. [wet_nurse.GetSheHe|U] percebeu minha preocupação.\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Minha querida', 'Meu querido' )] [wet_nurse.Custom2('RelationToMe', ROOT.Char)] [nursed_child.GetFirstName], embora isso pese em meu coração, preciso lhe dizer... uma doença ruim se abateu sobre mim. Preciso me afastar por algum tempo, mas não se preocupe muito! Logo estarei de volta com você.\""
 bp2_yearly.7000.healthy.tt:0 "[nursed_child.GetShortUIName] se mantém saudável"
 bp2_yearly.7000.healthy:0 "[nursed_child.GetFirstNameNoTooltip] supera uma doença"
 bp2_yearly.7000.ill:0 "[nursed_child.GetFirstNameNoTooltip] contrai uma doença"
 bp2_yearly.7000.t:0 "Licença por Doença"
 bp2_yearly.7001.a.tt:0 "Essa opção está disponível porque você tem um [lover|E]"
 bp2_yearly.7001.a:0 "Quer que eu ignore nossos filhos?!"
 bp2_yearly.7001.b.spouse_convinced:0 "Você convence [Select_CString( jealous_spouse.IsFemale, 'a', 'o' )] [jealous_spouse.GetFirstNameNoTooltip]"
 bp2_yearly.7001.b.spouse_not_convinced:0 "[jealous_spouse.GetFirstNameNoTooltip] não acredita em você"
 bp2_yearly.7001.b:0 "Absurdo, meu amor: você sabe que sou fiel!"
 bp2_yearly.7001.c:0 "Vou acalmar seus medos."
 bp2_yearly.7001.desc:0 "[wet_nurse.GetFirstName] é uma ama de leite maravilhosa para as minhas crianças, um cuidador a ser apreciado. No entanto, ultimamente, m[Select_CString( jealous_spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', jealous_spouse)] [jealous_spouse.GetFirstName] está bastante desconfiada [wet_nurse.GetHerHim].\n\n\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [jealous_spouse.Custom2('RelationToMe', ROOT.Char)], como o seu interesse em nossos filhos tem crescido desde que contratamos essa mulher, [wet_nurse.GetFirstNameNoTooltip]! Poderia ser que a #EMP generosidade#! dela esteja te inspirando?\"\n\n"
 bp2_yearly.7001.desc_lover:0 "Parece... que fui menos cuidadoso do que deveria."
 bp2_yearly.7001.desc_no_lover:0 "[jealous_spouse.GetFirstNameNoTooltip] está me atacando por nada! Certo...?"
 bp2_yearly.7001.t:0 "Desconfiança na Ama"
 bp2_yearly.7001.tt:0 "Você é conhecido por mentir"
 bp2_yearly.7002.a:0 "Incestuoso, você diz? Eu chamo de amor!"
 bp2_yearly.7002.b:0 "Nós vamos nos divorciar imediatamente."
 bp2_yearly.7002.c:0 "Talvez possamos concordar em esquecer disso...?"
 bp2_yearly.7002.desc:0 "[court_chaplain.GetFirstName] irrompe em meus aposentos, com uma expressão de preocupação em seu rosto.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], desculpe a intrusão, mas tenho algo urgente! Descobri que você [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetFirstName] tiveram a mesma ama de leite na infância. Isso torna o seu casamento altamente inadequado; vocês são irmãos de amamentação — aos olhos de [ROOT.Char.GetFaith.HighGodNamePossessive], vocês são os mais próximos da família!\"\n\nUma revelação chocante! [court_chaplain.GetFirstNameNoTooltip] continua antes que eu possa retrucar.\n\n\"Eu o aconselho a se divorciar imediatamente. Caso contrário, serei forçado a pronunciar o seu casamento como incestuoso.\""
 bp2_yearly.7002.t:0 "Cônjuge Amamentador"
 bp2_yearly.7003.a:0 "Que delícia!"
 bp2_yearly.7003.b.tt:0 "Você pressiona [Select_CString( nursed_child.IsFemale, 'a', 'o' )] [nursed_child.GetFirstNameNoTooltip] para continuar falando."
 bp2_yearly.7003.b:0 "O que mais [nursed_child.GetSheHe] pode dizer?"
 bp2_yearly.7003.c:0 "Não tenho tempo para isso."
 bp2_yearly.7003.desc:0 "\"Rápido, meu senhor, você tem que ouvir isso!\"\n\nA ama de leite, [wet_nurse.GetFirstName], me apressa para dentro dos aposentos da minha [ROOT.Char.Custom2('RelationToMePossessive', nursed_child)]. [wet_nurse.GetFirstNameNoTooltip] aponta para [nursed_child.GetFirstName] com empolgação, então eu me inclino em direção a [nursed_child.GetSheHe] e escuto.\n\n"
 bp2_yearly.7003.desc_faith:0 "\"[nursed_child.GetFaith.random_GoodGodNames].\"\n\nParece que [Select_CString( nursed_child.IsFemale, 'a', 'o' )] [nursed_child.GetFirstNameNoTooltip] já é um devoto!"
 bp2_yearly.7003.desc_father:0 "\"Pa-, pa-...\""
 bp2_yearly.7003.desc_gold:0 "[nursed_child.GetFirstNameNoTooltip] me oferece uma moeda cheia de saliva e diz:\n\n\"O-oh, o-o-ouro...\""
 bp2_yearly.7003.desc_house:0 "\"[nursed_child.GetHouse.GetNameNoTooltip].\"\n\nIncrível! [nursed_child.GetFirstNameNoTooltip] aprendeu a dizer o nome de nossa Casa."
 bp2_yearly.7003.desc_military:0 "\"Guh-bah-nuh... [nursed_child.Custom( 'KnightCultureNoTooltipLowercase' )]!\"\n\nParece que [Select_CString( nursed_child.IsFemale, 'a', 'o' )] [nursed_child.GetFirstNameNoTooltip] já tem um espírito marcial!"
 bp2_yearly.7003.desc_mother:0 "\"Ma-, ma-...\""
 bp2_yearly.7003.desc_motto:0 "\"[nursed_child.GetHouse.GetMotto].\"\n\nInacreditável: o lema de nossa casa [nursed_child.GetHouse.GetName]! [nursed_child.GetSheHe|U] o balbucia sem hesitar!"
 bp2_yearly.7003.desc_secret:0 "Enquanto pressiona um dedo em seus lábios pequenos, [nursed_child.GetFirstNameNoTooltip] sussurra para mim:\n\n\"Segredo.\""
 bp2_yearly.7003.t:0 "Palavras de $bp2_yearly.7003.title$"
 bp2_yearly.7003.title:0 "Primeiras Palavras da [nursed_child.GetFirstNamePossessiveNoTooltip]"
 bp2_yearly.7004.a:0 "\"Um passo gigante para uma criança. Um pequeno passo para um governante.\""
 bp2_yearly.7004.b.tt:0 "Você pressiona [nursed_child.GetFirstNameNoTooltip] para continuar andando."
 bp2_yearly.7004.b:0 "O que mais [nursed_child.GetSheHe] pode fazer?"
 bp2_yearly.7004.c:0 "$bp2_yearly.7003.c$"
 bp2_yearly.7004.desc:0 "Ouço uma agitação nos aposentos d[Select_CString( nursed_child.IsFemale, 'a', 'o' )] [nursed_child.GetFirstNamePossessive]. Entrando apressadamente, vejo a ama de leite, [wet_nurse.GetFirstName], brincando com [Select_CString( nursed_child.IsFemale, 'a', 'o' )] [nursed_child.GetFirstName]. \n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], momento perfeito! [nursed_child.GetFirstNameNoTooltip] deu os primeiros passos!\" [wet_nurse.GetSheHe] grita, animada.\n\nSegurando as mãos de [Select_CString( nursed_child.IsFemale, 'minha', 'meu' )] [nursed_child.Custom('GirlBoy')], ela tenta fazê-lo andar pelo quarto."
 bp2_yearly.7004.t:0 "Passos de $bp2_yearly.7003.title$"
 bp2_yearly.7005.a:0 "Encantador! Mas guarde o dente como um bom amuleto."
 bp2_yearly.7005.b.tt:0 "Você recebeu um dente"
 bp2_yearly.7005.b:0 "Aqui: um presente que combina com um presente!"
 bp2_yearly.7005.c:0 "$bp2_yearly.7003.c$"
 bp2_yearly.7005.desc:0 "Com a minha permissão, m[Select_CString( nursed_child.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', nursed_child)] [nursed_child.GetFirstName] e a ama de leite [nursed_child.GetHerHim] entram em meu aposento. [wet_nurse.GetFirstName] posa como um arauto e proclama:\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], você presencia um evento monumental! [nursed_child.GetFirstNameNoTooltip] tem um poderoso presente para oferecer-lhe.\" [wet_nurse.GetSheHe|U] empurra [nursed_child.GetSheHe] adiante. \"Adiante, [nursed_child.GetFirstNameNoTooltip], conte a [ROOT.Char.GetSheHe]!\"\n\n\"[nursed_child.Custom2('RelationToMeShort', ROOT.Char)|U], eu perdi um dente!\" M[Select_CString( nursed_child.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', nursed_child)] orgulhosamente apresenta seu sorriso desdentado, entregando-me uma bolsa com o dente caído dentro."
 bp2_yearly.7005.t:0 "Primeiro Dente de $bp2_yearly.7003.title$"
 bp2_yearly.7006.a:0 "O pequeno maroto!"
 bp2_yearly.7006.b:0 "Então, [nursed_child.GetSheHe] é um [nursed_child.Custom('GetPrincessPrince')] da Moda?"
 bp2_yearly.7006.c:0 "$bp2_yearly.7003.c$"
 bp2_yearly.7006.desc:0 "Enquanto espero pacientemente que minhas roupas sejam trazidas, um servo gagueja: '[ROOT.Char.Custom('FormOfAddressForLiege')|U], uh... ninguém consegue encontrar suas vestimentas!'\n\n\"Estou cercado de incompetência!\" murmuro, saindo enfurecido de meus aposentos.\n\nÉ na creche [Select_CString( nursed_child.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', nursed_child)], [nursed_child.GetFirstName], que descubro não apenas minhas vestimentas, mas também a ama de leite [nursed_child.Custom('GirlBoyPossessive')].\n\n\"Eu não tive parte nisso, [Select_CString( ROOT.Char.IsFemale, 'minha senhora', 'meu senhor' )] — [nursed_child.GetSheHe] se vestiu [nursed_child.GetHerselfHimself]!\" [wet_nurse.GetFirstName] responde com um riso."
 bp2_yearly.7006.t:0 "$bp2_yearly.7003.title$ Enfarpelamento"
 bp2_yearly.7008.a.tt_bad:0 "[reflecting_parent.GetFirstNameNoTooltip] oferece algo diferente em vez disso"
 bp2_yearly.7008.a.tt_good:0 "[reflecting_parent.GetFirstNameNoTooltip] concorda com você"
 bp2_yearly.7008.a:0 "\"Dê-me as suas terras, [nursed_child.Custom2('RelationToMeShort', reflecting_parent)]!\""
 bp2_yearly.7008.b:0 "\"Você me deve a sua riqueza!\""
 bp2_yearly.7008.c:0 "\"Eu te desprezo e espero nunca mais te ver!\""
 bp2_yearly.7008.c_dead_parent:0 "\"Por que você me negligenciou assim!?\""
 bp2_yearly.7008.d:0 "Prefiro focar nos meus próprios filhos."
 bp2_yearly.7008.desc:0 "$bp2_yearly.7008.desc_start$ [reflecting_parent.GetSheHe] nunca se importou comigo. Eu #EMP sei#! Os momentos divertidos [reflecting_parent.GetHerHim] sempre foram meus piores desafios."
 bp2_yearly.7008.desc_dead_parent:0 "$bp2_yearly.7008.desc_start$ minha [ROOT.Char.Custom2('RelationToMeShort', ROOT.Var('nursed_child_parent_var').Char)] [ROOT.Var('nursed_child_parent_var').Char.GetFirstName] tinha uma profunda devoção por mim e, enquanto [ROOT.Char.Custom2('RelationToMeShort', ROOT.Var('nursed_child_parent_var').Char)] [ROOT.Var('nursed_child_parent_var').Char.GetFirstName] viveu, [ROOT.Var('nursed_child_parent_var').Char.GetSheHe] também me amou intensamente."
 bp2_yearly.7008.desc_dress:0 "[ROOT.Var('nursed_child_parent_var').Char.GetSheHe|U] zombou do meu amor de criança por brincar de vestir!"
 bp2_yearly.7008.desc_end:0 "\n\nEu deveria ter o que me é devido! Ou talvez... seja melhor parar de remoer o passado?"
 bp2_yearly.7008.desc_start:0 "'Ah, quando você era apenas uma criança! Sempre vou guardar esses dias,' diz m[Select_CString( reflecting_parent.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', reflecting_parent)] [reflecting_parent.GetFirstName], completamente sem ser instigado.\n\nTudo volta em um turbilhão. Eu #EMP sei#! que"
 bp2_yearly.7008.desc_step:0 "[ROOT.Var('nursed_child_parent_var').Char.GetSheHe|U] saiu, entediado, quando dei meus primeiros passos."
 bp2_yearly.7008.desc_tooth:0 "[ROOT.Var('nursed_child_parent_var').Char.GetSheHe|U] recuou, enojado, quando perdi meu primeiro dente!"
 bp2_yearly.7008.desc_word:0 "[ROOT.Var('nursed_child_parent_var').Char.GetSheHe|U] até desprezou minhas primeiras palavras!"
 bp2_yearly.7008.e:0 "Tal tratamento é... justo."
 bp2_yearly.7008.t:0 "$bp2_yearly.7003.title$ Ressentimento"
 bp2_yearly.7008.tt:0 "[reflecting_parent.GetFirstNameNoTooltip] terá que responder"
 bp2_yearly.7009.a.tt_bad:0 "[reflecting_parent.GetFirstNameNoTooltip] quer algo em troca"
 bp2_yearly.7009.a.tt_good:0 "$bp2_yearly.7008.a.tt_good$"
 bp2_yearly.7009.a:0 "\"Eu te amo tanto, [nursed_child.Custom2('RelationToMeShort', reflecting_parent)].\""
 bp2_yearly.7009.b:0 "Vou passar o amor e o cuidado para os meus filhos!"
 bp2_yearly.7009.c:0 "Uh-huh. Família, gratidão... e assim por diante."
 bp2_yearly.7009.desc:0 "$bp2_yearly.7008.desc_start$ m[Select_CString( reflecting_parent.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', reflecting_parent)] viu o melhor em mim, sempre se esforçou para me defender. Os melhores momentos da minha infância foram aqueles com [reflecting_parent.GetSheHe]."
 bp2_yearly.7009.desc_dead_parent:0 "$bp2_yearly.7008.desc_start$ m[Select_CString( reflecting_parent.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', reflecting_parent)] tinha uma devoção profunda por mim e, enquanto [ROOT.Char.Custom2('RelationToMeShort', ROOT.Var('nursed_child_parent_var').Char)] [ROOT.Var('nursed_child_parent_var').Char.GetFirstName] estava vivo, [ROOT.Var('nursed_child_parent_var').Char.GetSheHe] também me amava intensamente."
 bp2_yearly.7009.desc_dress:0 "[ROOT.Var('nursed_child_parent_var').Char.GetSheHe|U] incentivou minha travessura, meu gosto por me vestir."
 bp2_yearly.7009.desc_end:0 "\n\nTalvez eu devesse retribuir o carinho [ROOT.Var('nursed_child_parent_var').Char.GetHerHim]?"
 bp2_yearly.7009.desc_end_dead_parent:0 "\n\nÉ tarde demais para agradecer a [ROOT.Var('nursed_child_parent_var').Char.GetSheHe], no entanto. Minha gratidão agora se volta apenas para [Select_CString( reflecting_parent.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMe', reflecting_parent)]."
 bp2_yearly.7009.desc_step:0 "[ROOT.Var('nursed_child_parent_var').Char.GetSheHe|U] me ajudou a dar meus primeiros passos."
 bp2_yearly.7009.desc_tooth:0 "[ROOT.Var('nursed_child_parent_var').Char.GetSheHe|U] até aceitou meu dente de leite em sua própria mão."
 bp2_yearly.7009.desc_word:0 "Foram [ROOT.Var('nursed_child_parent_var').Char.GetSheHe] que ouviu minhas primeiras palavras."
 bp2_yearly.7009.t:0 "$bp2_yearly.7003.title$ Laços"
 bp2_yearly.7010.a.tt:0 "$bp2_yearly.7008.a.tt_good$"
 bp2_yearly.7010.a:0 "Estou disposto a provar arrependimento."
 bp2_yearly.7010.b.tt:0 "$bp2_yearly.7008.a.tt_bad$"
 bp2_yearly.7010.b:0 "\"A partir de agora, você terá o que precisa de mim!\""
 bp2_yearly.7010.c.tt:0 "[reflecting_parent.GetFirstNameNoTooltip] não se importa muito"
 bp2_yearly.7010.c:0 "\"Cresça.\""
 bp2_yearly.7010.desc:0 "$bp2_yearly.7010.desc_start$\"[nursed_child.Custom2('RelationToMeShort', ROOT.Char)|U], você deve admitir: você nunca se importou comigo, nem mesmo quando eu era jovem."
 bp2_yearly.7010.desc_dead_parent:0 "$bp2_yearly.7010.desc_start$\"[Select_CString( ROOT.Char.IsFemale, 'A', 'O' )] [nursed_child.Custom2('RelationToMeShort', ROOT.Char)], é errado falar mal dos mortos, mas você deve admitir que meu [nursed_child.Custom2('RelationToMeShort', nursed_child.MakeScope.Var('nursed_child_parent_var').Char)] foi o pior pai que poderia existir!"
 bp2_yearly.7010.desc_dress:0 "Minhas brincadeiras de me vestir foram impiedosamente ridicularizadas."
 bp2_yearly.7010.desc_end:0 "É #EMP isso#! amor?\"\n\n[nursed_child.GetFirstNameNoTooltip] luta, tremendo de emoção, mas parece resoluto."
 bp2_yearly.7010.desc_gold:0 "$bp2_yearly.7008.b$"
 bp2_yearly.7010.desc_hate:0 "$bp2_yearly.7008.c$"
 bp2_yearly.7010.desc_hate_dead_parent:0 "$bp2_yearly.7008.c_dead_parent$"
 bp2_yearly.7010.desc_start:0 "Enquanto discuto alguns assuntos da corte com m[Select_CString( nursed_child.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', nursed_child)] [nursed_child.GetFirstName], [nursed_child.GetSheHe] começa abruptamente a falar sobre sua infância.\n\n"
 bp2_yearly.7010.desc_step:0 "Meus primeiros passos foram ignorados!"
 bp2_yearly.7010.desc_title:0 "$bp2_yearly.7008.a$"
 bp2_yearly.7010.desc_tooth:0 "Os primeiros dentes que perdi foram jogados fora!"
 bp2_yearly.7010.desc_word:0 "Minhas primeiras palavras foram ignoradas!"
 bp2_yearly.7010.t:0 "$bp2_yearly.7008.t$"
 bp2_yearly.7011.a.tt:0 "$bp2_yearly.7009.a.tt_good$"
 bp2_yearly.7011.a:0 "\"E eu te amo, [ROOT.Char.Custom2('RelationToMeShort', nursed_child)]!\""
 bp2_yearly.7011.b.tt:0 "$bp2_yearly.7009.a.tt_bad$"
 bp2_yearly.7011.b:0 "\"Tamanha devoção!\""
 bp2_yearly.7011.c.tt:0 "$bp2_yearly.7010.c.tt$"
 bp2_yearly.7011.c:0 "\"Não se detenha no passado.\""
 bp2_yearly.7011.desc:0 "$bp2_yearly.7010.desc_start$\"[nursed_child.Custom2('RelationToMeShort', ROOT.Char)|U], você cuidou de mim como a cadelinha cuida dos filhotes. Melhor ainda. Minhas primeiras e mais queridas memórias foram com você."
 bp2_yearly.7011.desc_dead_parent:0 "$bp2_yearly.7010.desc_start$\"Enquanto meu [nursed_child.Custom2('RelationToMeShort', nursed_child.MakeScope.Var('nursed_child_parent_var').Char)] estava conosco, eu realmente amava [nursed_child.MakeScope.Var('nursed_child_parent_var').Char.GetSheHe]. Sempre, [nursed_child.MakeScope.Var('nursed_child_parent_var').Char.GetSheHe] e você dedicaram tempo para mim."
 bp2_yearly.7011.desc_dress:0 "Quando eu fazia travessuras e me divertia!"
 bp2_yearly.7011.desc_end:0 "Você me segurou tão perto.\"\n\n[nursed_child.GetSheHe|U] cora, radiante.\n\n"
 bp2_yearly.7011.desc_forwarded_love:0 "\"$bp2_yearly.7011.desc_end$\"$bp2_yearly.7009.b$\""
 bp2_yearly.7011.desc_receive_love:0 "$bp2_yearly.7011.desc_end$$bp2_yearly.7009.a$"
 bp2_yearly.7011.desc_step:0 "Quando dei meus primeiros passos!"
 bp2_yearly.7011.desc_tooth:0 "Quando coloquei meu primeiro dente caído em sua mão."
 bp2_yearly.7011.desc_word:0 "Quando eu disse minhas primeiras palavras!"
 bp2_yearly.7011.t:0 "$bp2_yearly.7009.t$"
 bp2_yearly.7012.a:0 "Perdoe-me. Eu a contratarei de volta!"
 bp2_yearly.7012.b:0 "Você deve respeitar a decisão [Select_CString( ROOT.Char.IsFemale, 'da sua', 'do seu' )] [nursed_child.Custom2('RelationToMePossessive', ROOT.Char)]."
 bp2_yearly.7012.b_loss:0 "[nursed_child.GetFirstNameNoTooltip] ressente sua dominação"
 bp2_yearly.7012.b_win:0 "Você conforta e educa [Select_CString( nursed_child.IsFemale, 'a', 'o' )] [nursed_child.GetFirstNameNoTooltip]"
 bp2_yearly.7012.c:0 "Criança, cale-se!"
 bp2_yearly.7012.desc:0 "[nursed_child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] cambaleia, perturbando minha reunião no conselho, e tenta me afastar.\n\n\"[nursed_child.GetFirstNameNoTooltip]! Você não deveria estar aqui,\" eu objetei, mas [nursed_child.GetSheHe] fica vermelho e começa a gritar.\n\n\"Eu #EMP odeio#! você! Por que fazer isso?!\" [nursed_child.GetSheHe|U] faz uma pausa, fungando, com todos os olhos n[nursed_child.GetSheHe]. \"Você mandou embora minha [former_wet_nurse.GetFirstName]! Ela não é apenas uma amamentadora — eu a amo como uma mãe! #EMP Mais#! do que minha mãe!\""
 bp2_yearly.7012.t:0 "O Leite do Amor de uma Amamentadora"
 bp2_yearly.7013.a.tt:0 "Aciona $bp2_decision.0001.t$"
 bp2_yearly.7013.a:0 "\"Sua nova amamentadora vai fazer tudo ficar melhor!\""
 bp2_yearly.7013.b:0 "\"Ela certamente está em [nursed_child.GetFaith.PositiveAfterLife] agora.\""
 bp2_yearly.7013.c:0 "Morto é morto."
 bp2_yearly.7013.desc:0 "Ultimamente, [nursed_child.GetFirstName] tem andado por aí, perdido em seus pensamentos. No quarto [nursed_child.GetHerHim], encontro [nursed_child.GetSheHe] chorando em seus travesseiros.\n\n\"O que houve, m[Select_CString( nursed_child.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', nursed_child)]?\" pergunto, enquanto [nursed_child.GetSheHe] começa a se acalmar.\n\n\"O que acontece quando você morre? Só estou me perguntando... se minha amamentadora [former_wet_nurse.GetFirstName] está bem.\" [nursed_child.GetSheHe|U] solta um grande fungo, segurando as lágrimas. \"Talvez ela tenha que amamentar para [ROOT.Char.GetFaith.DevilName] agora?\"\n\nEnquanto a voz d[Select_CString( nursed_child.IsFemale, 'a', 'o' )] [nursed_child.GetFirstNamePossessiveNoTooltip] quebra, [nursed_child.GetSheHe] chora as maiores e mais orvalhadas lágrimas que já vi."
 bp2_yearly.7013.t:0 "O Luto de uma Criança"
 bp2_yearly.7014.a:0 "\"Eu gostaria que você fosse minha mãe!\""
 bp2_yearly.7014.b:0 "Eu não vou esquecer deste momento."
 bp2_yearly.7014.desc:0 "Minha amamentadora [wet_nurse.GetFirstName] me ajeita na cama, se preparando para apagar as velas para a noite.\n\n\"Espere! Eu quero dizer algo!\" Imploro. \"Gosto de você estar aqui... me sentiria tão solitário em [ROOT.Char.GetCurrentLocation.GetName] sem você.\"\n\n[wet_nurse.GetFirstNameNoTooltip] parece um pouco desconfortável com isso, mas tocada.\n\n\"Sou uma devotada"
 bp2_yearly.7014.desc_culture:0 "[wet_nurse.GetCulture.GetName], como você. Compartilhamos nossos corações [wet_nurse.GetCulture.GetEthos.GetNameNoTooltip|l]. [tradition.GetNameNoTooltip], [tradition_2.GetNameNoTooltip]... esses são nossos modos! Grandes ou pequenos, todos somos bons sujeitos.\""
 bp2_yearly.7014.desc_culture_no_trad:0 "[wet_nurse.GetCulture.GetName], como você. Compartilhamos nossos corações [wet_nurse.GetCulture.GetEthos.GetNameNoTooltip|l] e nossos antigos costumes! Grandes ou pequenos, todos somos bons sujeitos.\""
 bp2_yearly.7014.desc_faith:0 "serva de [wet_nurse.GetFaith.HighGodName], assim como você será um dia. Uma vez que você tenha uma fé forte, [wet_nurse.GetFaith.HighGodName] guiará e confortará você, e você não precisará mais de mim.\""
 bp2_yearly.7014.t:0 "Uma Presença Familiar"
 bp2_yearly.7021.a.tt:0 "[teentribal.GetFirstName] desafia s[Select_CString( family_duelist.IsFemale, 'ua', 'eu' )] [teentribal.Custom2('RelationToMeShort', family_duelist)|l] [family_duelist.GetFirstName] para um [single_combat_duel|E]"
 bp2_yearly.7021.a:0 "[teentribal.GetSheHe|U] enfrenta s[Select_CString( family_duelist.IsFemale, 'ua', 'eu' )] [teentribal.Custom2('RelationToMeShort', family_duelist)|l]!"
 bp2_yearly.7021.a_root:0 "[teentribal.Custom2('RelationToMeShort', family_duelist)|U], provarei minha capacidade contra você!"
 bp2_yearly.7021.b.tt:0 "[teentribal.GetFirstName] desafia [Select_CString( duelist_1.IsFemale, 'a', 'o' )] [duelist_1.GetFirstName] para um [single_combat_duel|E]"
 bp2_yearly.7021.b:0 "[teentribal.GetSheHe|U] duelará com m[Select_CString( duelist_1.IsFemale, 'inha', 'eu' )] [teentribal.Custom2('RelationToMeShort', duelist_1)|l], [duelist_1.GetFirstNameNoTooltip]!"
 bp2_yearly.7021.b_root:0 "Desafio m[Select_CString( duelist_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', duelist_1)], [duelist_1.GetFirstNameNoTooltip]!"
 bp2_yearly.7021.c.tt:0 "[teentribal.GetFirstName] desafia [Select_CString( duelist_2.IsFemale, 'a', 'o' )] [duelist_2.GetFirstName] para um [single_combat_duel|E]"
 bp2_yearly.7021.c:0 "[Select_CString( duelist_2.IsFemale, 'A', 'O' )] [duelist_2.Custom('ComplimentAdjective')] [duelist_2.GetFirstNameNoTooltip] — venha à frente!"
 bp2_yearly.7021.c_root:0 "Prefiro lutar com m[Select_CString( duelist_2.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', duelist_2)], [duelist_2.GetFirstNameNoTooltip]."
 bp2_yearly.7021.d.tt:0 "$bp2_decision.0002.cooldown$"
 bp2_yearly.7021.d:0 "$bp2_decision.0002.f$"
 bp2_yearly.7021.desc:0 "Um[Select_CString( teentribal.IsFemale, 'a', '' )] [teentribal.GetWomanMan] [ROOT.Char.GetCulture.GetName] deve desprezar o medo, rejeitar a fraqueza e estar preparado para conhecer a dor na vida.\n\n[Select_CString( teentribal.IsFemale, 'A', 'O' )] jovem [teentribal.GetFirstName] trocou golpes com outros jovens, mas nunca sofreu o embate de um [ROOT.Char.GetCulture.GetNameNoTooltip] adulto.\n\nSão muitos os destemidos guerreiros de nossa tribo, mas apenas um pode testar o valor [Select_CString( teentribal.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMePossessive',teentribal)]."
 bp2_yearly.7021.desc_root:0 "Um guerreiro é gerado da luta, nascido no sangue.\n\nTroquei golpes com outros jovens, mas nunca com um oponente verdadeiramente digno: um [ROOT.Char.GetCulture.GetName] adulto.\n\nSão muitos os destemidos guerreiros de nossa tribo, mas posso desafiar apenas um para provar minha prontidão."
 bp2_yearly.7021.t:0 "$bp2_decision.0002.t$: $rites_of_passage_duel$"
 bp2_yearly.7022.a:0 "Tal é a determinação do [teentribal.GetHouse.GetBaseNameNoTooltip]!"
 bp2_yearly.7022.a_loss:0 "[teentribal.GetFirstNameNoTooltip] nunca esquecerá essa derrota... e [teentribal.GetSheHe] aprenderá que sua tenacidade tem utilidade além do campo de batalha."
 bp2_yearly.7022.a_victory:0 "Vencer é ganhar confiança na arte do guerreiro e em si mesmo."
 bp2_yearly.7022.b:0 "A tribo ganhará um novo campeão."
 bp2_yearly.7022.b_loss:0 "[teentribal.GetFirstNameNoTooltip] deve se dedicar ao treinamento, aos duelos melhor travados que virão!"
 bp2_yearly.7022.b_victory:0 "Ainda há muitos truques a aprender, mas este é um bom começo!"
 bp2_yearly.7022.c:0 "Uma luta sangrenta! Uma luta #EMP muito#! sangrenta..."
 bp2_yearly.7022.c_loss:0 "Vejo um contador de suprimentos aqui, não um lutador... se [teentribal.GetFirstNameNoTooltip] quer viver muito tempo."
 bp2_yearly.7022.c_victory:0 "Um tipo de alegria surgiu, um fervor maligno despertou... com o fluxo de sangue."
 bp2_yearly.7022.desc_child_lost:0 "As libações são mal aspergidas quando [Select_CString( sc_loser.IsFemale, 'a', 'o' )] [sc_loser.GetFirstName] lança um assalto feroz! Sob a chuva de golpes, a experiência d[Select_CString( sc_victor.IsFemale, 'a', 'o' )] [sc_victor.GetFirstNamePossessive] serve: [sc_victor.GetSheHe] aguenta a tempestade. M[Select_CString( teentribal.IsFemale, 'inha', 'eu' )] jovem [ROOT.Char.Custom2('RelationToMe',teentribal)], logo cansando, dá tudo [sc_loser.GetHerHim]... mas encerra este rito com o ferro em sua garganta.\n\nVendo o fogo ainda nos olhos do oponente [sc_victor.GetHerHim], [sc_victor.GetFirstNameNoTooltip] é gracios[Select_CString( sc_victor.IsFemale, 'a', 'o' )].\n\n\"Este é um[Select_CString( sc_loser.IsFemale, 'a', '' )] [sc_loser.GetWomanMan] diante de mim! A luta, não a vitória, garante um lugar entre nós para [sc_loser.GetSheHe]. [sc_loser.GetFirstNameNoTooltip] mostrou coragem de guerreiro e mérito [ROOT.Char.GetCulture.GetName]."
 bp2_yearly.7022.desc_child_win:0 "Quando a bênção do [ROOT.Char.GetFaith.PriestNeuter] chega ao fim, as armas dos desafiantes se chocam. A experiência d[Select_CString( sc_loser.IsFemale, 'a', 'o' )] [sc_loser.GetFirstNamePossessive] permite a [sc_loser.GetSheHe] pressionar uma vantagem imediata — mas, mesmo assim, [sc_loser.GetSheHe] não consegue afastar os golpes astutos d[Select_CString( sc_victor.IsFemale, 'a', 'o' )] [sc_victor.GetFirstNamePossessive] por muito tempo.\n\nM[Select_CString( teentribal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe',teentribal)] faz [Select_CString( sc_loser.IsFemale, 'a', 'o' )] [sc_loser.GetFirstNameNoTooltip] tombar.\n\n\"Eu me rendo!\" lamenta [Select_CString( sc_loser.IsFemale, 'a', 'o' )] [sc_loser.GetWomanMan] mais velh[Select_CString( sc_loser.IsFemale, 'a', 'o' )]. \"[sc_victor.GetFirstNameNoTooltip] esmagou meus nós dos dedos e me cegou com sangue da vida: [sc_victor.GetSheHe] é um guerreiro tão completo quanto qualquer um. Um[Select_CString( sc_victor.IsFemale, 'a', '' )] [sc_victor.GetWomanMan] [ROOT.Char.GetCulture.GetName] muito merecedor!\"\n\nO rito é assim concluído."
 bp2_yearly.7022.desc_root_lost:0 "Embora eu não possa igualar a veteranice d[Select_CString( sc_victor.IsFemale, 'a', 'o' )] [sc_victor.GetFirstName]... o rito não pode terminar assim! Eu tento me erguer, me preparando, e sou desarmado. Corro atrás de minha arma, mas o inimigo bloqueia meu caminho. #EMP Não pode terminar assim!#! \n\n[sc_victor.GetFirstNameNoTooltip] me observa, divertido.\n\n\"Espere, jovem [ROOT.Char.Custom('RegionalFerociousAnimal')]! M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsName], sua ferocidade é de um [ROOT.Char.GetCulture.GetName] [ROOT.Char.Custom( 'KnightCultureNoTooltipLowercase' )]! Você lutou bravamente e — derrotado ou não — eu o honro como membro da tribo.\"\n\n\"Este resultado será aceito.\""
 bp2_yearly.7022.desc_root_win:0 "\"Chega!\" exclama [Select_CString( sc_loser.IsFemale, 'a', 'o' )] [sc_loser.GetFirstName], arremessando seu [sc_loser.Custom('SignatureWeaponNameOrType')] na terra. \"Desfira o golpe mortal como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] plenamente honrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]! Eu teria vergonha de morrer por um[Select_CString( teentribal.IsFemale, 'a', '' )] [teentribal.Custom('GirlBoy')].\"\n\n\"Mas — #EMP o que estou dizendo?#! Você já luta como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] adequad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. Como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsName]: aquele que conhecerá o poder, conhecerá a vitória! Eu falarei por você e garantirei que seus privilégios cresçam.\"\n\nEstá feito. Pela virtude de minha [ROOT.Char.Custom('SignatureWeaponNameOrType')], estou provado."
 bp2_yearly.7022.t:0 "$bp2_decision.0002.t$: O $rites_of_passage_duel$ é Lutado"
 bp2_yearly.7022.toast:0 "O duelo molda [Select_CString( teentribal.IsFemale, 'a', 'o' )] [teentribal.GetFirstNameNoTooltip]"
 bp2_yearly.7023.a.tt:0 "[priest.GetFirstNameNoTooltip] corta vigorosamente, uma e outra vez."
 bp2_yearly.7023.a:0 "Usar a prova é conhecer o orgulho."
 bp2_yearly.7023.a_nothing:0 "Os cortes são limpos"
 bp2_yearly.7023.a_scarred:0 "Os cortes deixam marcas duradouras"
 bp2_yearly.7023.a_wounded:0 "Os cortes são brutalmente profundos"
 bp2_yearly.7023.b.tt:0 "[priest.GetFirstNameNoTooltip] é gentil com a lâmina, fazendo apenas uma impressão escassa."
 bp2_yearly.7023.b:0 "Talvez isso possa ser apenas... simbólico?"
 bp2_yearly.7023.c.tt:0 "$bp2_decision.0002.cooldown$"
 bp2_yearly.7023.c:0 "$bp2_decision.0002.f$"
 bp2_yearly.7023.desc:0 "Os [ROOT.Char.GetCulture.GetCollectiveNoun] da minha tribo se reúnem para assistir ao rito da escarificação. Com a fumaça de ervas sagradas densa no ar, meu [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] [priest.GetFirstName] começa a cerimônia. Aqueles reunidos caem em silêncio.\n\n[priest.GetSheHe|U] desembainha a lâmina ritual.\n\n\"Aqui, [teentribal.GetFirstName] do clã [teentribal.GetHouse.GetName],\" entoa [Select_CString( priest.IsFemale, 'a', 'o' )] [priest.GetWomanMan] santo, \"será marcado e entalhado, dilacerado pela dor. Quando olharmos para [teentribal.GetSheHe] nos dias que virão, veremos convicção — veremos que [teentribal.GetSheHe] é um[Select_CString( teentribal.IsFemale, 'a', '' )] [teentribal.GetWomanMan]!\""
 bp2_yearly.7023.t:0 "$bp2_decision.0002.t$: $rites_of_passage_scarification$"
 bp2_yearly.7024.a.abroad:0 "[teentribal.GetFirstName] viajará para [abroad_location.GetTerrain.GetNameNoTooltip|l] de [abroad_location.GetName], dentro do reino de [foreign_ruler.GetName]"
 bp2_yearly.7024.a.tt:0 "#N Maior#! chance de perigo"
 bp2_yearly.7024.a:0 "Embarcar, para terras distantes!"
 bp2_yearly.7024.b.realm:0 "[teentribal.GetFirstName] viajará para [realm_location.GetTerrain.GetNameNoTooltip|l] de [realm_location.GetName]"
 bp2_yearly.7024.b.tt:0 "#Z Média#! chance de perigo"
 bp2_yearly.7024.b:0 "A jornada não precisa ser muito longa."
 bp2_yearly.7024.c.capital:0 "[teentribal.GetFirstName] se isolará em [rite_location.GetTerrain.GetNameNoTooltip|l] de [rite_location.GetName], a [realm_capital|E]"
 bp2_yearly.7024.c.tt:0 "#P Menor#! chance de perigo"
 bp2_yearly.7024.c:0 "A natureza local servirá."
 bp2_yearly.7024.d.tt:0 "$bp2_decision.0002.cooldown$"
 bp2_yearly.7024.d:0 "$bp2_decision.0002.f$"
 bp2_yearly.7024.desc:0 "\"O isolamento enriquece o corpo, o espírito,\" insiste [Select_CString( priest.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] [priest.GetFirstName]. \"Na tranquilidade, sagacidade! Na sobrevivência, astúcia. Escolha um lugar de harmonia... mas em algum lugar selvagem, severo.\"\n\n[priest.GetSheHe|U] empurra algumas provisões escassas.\n\n"
 bp2_yearly.7024.desc_abroad:0 "Para um teste verdadeiro, considere o estranho e distante [abroad_location.GetTerrain.GetNameNoTooltip|l] de [abroad_location.GetName]!"
 bp2_yearly.7024.desc_capital:0 "\"Um[Select_CString( teentribal.IsFemale, 'a', '' )] [teentribal.Custom('GirlBoy')] está segur[Select_CString( teentribal.IsFemale, 'a', 'o' )] em casa, no [rite_location.GetName] [rite_location.GetTerrain.GetNameNoTooltip|l]."
 bp2_yearly.7024.desc_end:0 "Agora, criança, vá — com a sabedoria de [priest.GetFaith.KnowledgeGodName]."
 bp2_yearly.7024.desc_realm:0 "Ou o que executa o rito pode viajar brevemente: para [realm_location.GetName], talvez?"
 bp2_yearly.7024.lose:0 "Pego no perigo"
 bp2_yearly.7024.t:0 "$bp2_decision.0002.t$: $rites_of_passage_seclusion$"
 bp2_yearly.7024.win:0 "Evitou todo o perigo"
 bp2_yearly.7025.a:0 "Vou me esgueirar e me esconder."
 bp2_yearly.7025.a_lose:0 "A [teentribal.MakeScope.Var('animal_type').GetFlagName], enfurecida, te ataca"
 bp2_yearly.7025.a_win:0 "Você se afasta silenciosamente da fera distraída"
 bp2_yearly.7025.b:0 "Com flechas afiadas, afugentarei o [teentribal.MakeScope.Var('animal_type').GetFlagName]!"
 bp2_yearly.7025.b_lose:0 "O [teentribal.MakeScope.Var('animal_type').GetFlagName] ileso ataca"
 bp2_yearly.7025.b_win:0 "O [teentribal.MakeScope.Var('animal_type').GetFlagName] foge, picado pelas flechas"
 bp2_yearly.7025.desc:0 "— um [teentribal.MakeScope.Var('animal_type').GetFlagName] espumante se aproxima do meu pequeno acampamento!\n\nEu não posso escapar deste animal desesperado. A fera deve ser vencida ou ludibriada. Eu tenho uma lebre recém-morta bem à mão..."
 bp2_yearly.7025.desc_abroad:0 "O amanhecer surge sobre [seclusion_location.GetName]. O desconhecido [realm_location.GetTerrain.GetNameNoTooltip|l], desprovido dos [seclusion_location.GetCounty.GetCulture.GetCollectiveNoun] local, é assustador à noite e belo à luz da manhã.\n\nMinha fogueira meio acesa e eu não estamos sozinhos aqui $bp2_yearly.7025.desc$"
 bp2_yearly.7025.desc_capital:0 "Eu rapidamente encontro um bom local para meu acampamento, bem fora do [rite_location.GetName], então eu imediatamente monto uma fogueira para me preparar para a noite e comer algo quente. $bp2_yearly.7025.desc$"
 bp2_yearly.7025.desc_fight:0 "talvez, ao lançá-la, eu possa ganhar tempo para pegar meu arco?"
 bp2_yearly.7025.desc_outwit:0 "talvez eu possa me retirar sutilmente enquanto isso satisfaz o [teentribal.MakeScope.Var('animal_type').GetFlagName]?"
 bp2_yearly.7025.desc_realm:0 "Chego rapidamente ao [realm_location.GetTerrain.GetNameNoTooltip|l] próximo de [realm_location.GetName] e imediatamente começo a me preparar para a noite. Enquanto estou montando uma fogueira para cozinhar meu jantar, $bp2_yearly.7025.desc$"
 bp2_yearly.7025.t:0 "$bp2_decision.0002.t$: $rites_of_passage_seclusion$"
 bp2_yearly.7025.tt:0 "Um [teentribal.MakeScope.Var('animal_type').GetFlagName] atacou durante o Isolamento"
 bp2_yearly.7026.a.toast:0 "O ritual de corte de cabelo foi concluído."
 bp2_yearly.7026.a.tt:0 "M[Select_CString( priest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort',priest)] passa a lâmina [priest.GetHerHim] por todo o couro cabeludo, com a vigor adequado."
 bp2_yearly.7026.a:0 "Dedicação absoluta: um corte brutal e total."
 bp2_yearly.7026.b.toast:0 "O corte de cabelo está completo"
 bp2_yearly.7026.b.tt:0 "Um pedaço fino de cabelo é cortado e colocado em um medalhão cerimonial, um símbolo de dever."
 bp2_yearly.7026.b:0 "Corte apenas uma mecha, para ser guardada para sempre!"
 bp2_yearly.7026.c.tt:0 "$bp2_decision.0002.cooldown$"
 bp2_yearly.7026.c:0 "$bp2_decision.0002.f$"
 bp2_yearly.7026.desc:0 "Entrelaçando finas tranças e balançando belos cabelos em gratidão, a tribo se reúne para o ritual de corte de cabelo.\n\nM[Select_CString( priest.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] [priest.GetFirstName] segura os cabelos d[Select_CString( teentribal.IsFemale, 'a', 'o' )] [teentribal.GetFirstNamePossessive] e pega uma faca inscrita.\n\n\"Est[Select_CString( teentribal.IsFemale, 'a', 'e' )] [teentribal.Custom('GirlBoy')] deve abandonar a infância pelo futuro da tribo! [teentribal.GetSheHe|U] perderá tudo o que existe por frivolidade, deixando sua verdadeira natureza, sua força de espírito, exposta!\"\n\nO sábio lança um olhar cauteloso em minha direção.\n\n\"...se assim desejar noss[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsName].\""
 bp2_yearly.7026.desc_child:0 "Entrelaçando finas tranças e balançando belos cabelos em gratidão, a tribo se reúne para o ritual de corte de cabelo.\n\nM[Select_CString( priest.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] [priest.GetFirstName] segura meus cabelos e pega uma faca inscrita.\n\n\"Noss[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsName] deve abandonar a infância pelo futuro da tribo! [teentribal.GetSheHe|U] perderá tudo o que existe por frivolidade, deixando sua verdadeira natureza, sua força de espírito, exposta!\"\n\nO sábio lança um olhar cauteloso em minha direção.\n\n\"...se assim desejar noss[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]."
 bp2_yearly.7026.t:0 "$bp2_decision.0002.t$: $rites_of_passage_shaving$"
 bp2_yearly.7027.a.tt:0 "O mergulho na água sagrada é... quase mortal em duração."
 bp2_yearly.7027.a:0 "Quase se afogar é conhecer a água!"
 bp2_yearly.7027.b.tt:0 "Um mergulho rápido: o simbolismo é o mestre do mundo desperto."
 bp2_yearly.7027.b:0 "O rito requer... um banho leve."
 bp2_yearly.7027.c.tt:0 "$bp2_decision.0002.cooldown$"
 bp2_yearly.7027.c:0 "$bp2_decision.0002.f$"
 bp2_yearly.7027.desc:0 "A tribo se reúne reverentemente à beira da água, enquanto [Select_CString( priest.IsFemale, 'a', 'o' )] sagrad[Select_CString( priest.IsFemale, 'a', 'o' )] [priest.GetFirstName] ergue o cálice cerimonial.\n\n\"De algumas poucas gotas começou o mar! D[Select_CString( teentribal.IsFemale, 'a', 'o' )] [teentribal.Custom('GirlBoy')], vem [Select_CString( teentribal.IsFemale, 'a', 'o' )] [teentribal.GetWomanMan]! Assim começa.\" [priest.GetSheHe|U] derrama água sagrada sobre cabelos e pele.\n\n\"Em nome de [priest.GetFaith.WaterGodName]: deixe a água purificá-lo, deixe-a lavar a criança e deixar a sabedoria da vida adulta.\"\n\nA próxima parte da cerimônia recai sobre mim — e a piscina sagrada aguarda."
 bp2_yearly.7027.t:0 "$bp2_decision.0002.t$: A Purificação"
 bp2_yearly.7027.tt:0 "A purificação $cleansing_type_element$ está completa"
 bp2_yearly.7028.a.tt:0 "Passos deliberados e cuidadosos são dados durante a caminhada pelo fogo."
 bp2_yearly.7028.a:0 "[priest.GetFaith.WarGodName|U] conduz o crente através!"
 bp2_yearly.7028.b.tt:0 "A caminhada pelo fogo é honrada, mas a pressa com que é feita é rápida como o vento."
 bp2_yearly.7028.b:0 "Pressa! Faça isso com uma corrida."
 bp2_yearly.7028.c.tt:0 "$bp2_decision.0002.cooldown$"
 bp2_yearly.7028.c:0 "$bp2_decision.0002.f$"
 bp2_yearly.7028.desc:0 "Chamas vastas iluminam os rostos sérios dos membros da minha tribo. M[Select_CString( priest.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] [priest.GetFirstName], armado com a extremidade de uma lança, derruba a fogueira e espalha brasas em um caminho resplandecente.\n\nRespire — respire calmamente, eu imploro.\n\n\"Está a juventude preparada para se juntar às suas fileiras?!\" exclama [Select_CString( priest.IsFemale, 'a', 'o' )] [priest.GetFirstNameNoTooltip]. \"[priest.GetFaith.WarGodName] julgará, enquanto [Select_CString( teentribal.IsFemale, 'a', 'o' )] [teentribal.GetFirstName] enfrenta o teste pelo fogo! Vá, criança: queime o que é indigno, e você poderá pisar na terra fria como um[Select_CString( teentribal.IsFemale, 'a', '' )] [teentribal.GetWomanMan] [ROOT.Char.GetCulture.GetName]!\""
 bp2_yearly.7028.t:0 "$bp2_decision.0002.t$: A Purificação"
 bp2_yearly.7028.tt:0 "$bp2_yearly.7027.tt$"
 bp2_yearly.7029.a.inspiration:0 "Sua história é maravilhosamente inspiradora"
 bp2_yearly.7029.a.teaching:0 "[teentribal.GetFirstNameNoTooltip] aprende muito com você"
 bp2_yearly.7029.a.tt:0 "Com suas palavras ecoando em seus ouvidos, [teentribal.GetFirstNameNoTooltip] enfrenta o teste com grande convicção."
 bp2_yearly.7029.a:0 "Minha narração do meu rito vai inspirar [teentribal.GetSheHe]!"
 bp2_yearly.7029.b.fail:0 "[teentribal.GetFirstName] realiza o rito de forma inadequada"
 bp2_yearly.7029.b.success:0 "[teentribal.GetFirstName] aprende autoconfiança"
 bp2_yearly.7029.b.tt:0 "[teentribal.GetFirstNameNoTooltip] luta sozinho, adquirindo a força de um adulto ou a vergonha de um fracasso."
 bp2_yearly.7029.b:0 "[teentribal.GetSheHe|U] deve sofrer seus próprios erros."
 bp2_yearly.7029.desc:0 "Como [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsName], dou permissão aos jovens prestes a realizar rituais de passagem. Alguns fazem promessas audaciosas, juramentos que poucos [ROOT.Char.GetCulture.GetCollectiveNoun] poderiam cumprir. Outros, como m[Select_CString( teentribal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', teentribal)] [teentribal.GetFirstName], tremem.\n\nHoje, o teste escolhido é o mesmo que eu mesmo já enfrentei:"
 bp2_yearly.7029.desc_duel:0 "Habilidade nas armas d[Select_CString( teentribal.IsFemale, 'a', 'o' )] [teentribal.GetFirstNamePossessiveNoTooltip] deve ser sua valia. Mas eu percebo... [teentribal.GetSheHe] não carrega nenhuma espada.\n\n\"O oponente nomeado é como uma montanha!\" [teentribal.GetSheHe] lamenta. \"Como eu supostamente vou vencer, a não ser por algum truque sujo?\""
 bp2_yearly.7029.desc_fire_cleanse:0 "Os pés d[Select_CString( teentribal.IsFemale, 'a', 'o' )] [teentribal.GetFirstNamePossessiveNoTooltip] estão descalços, para que possam sentir frio antes da caminhada pelo fogo. [teentribal.GetSheHe|U] olha uma pequena lâmpada de junco suspeitosamente.\n\n\"Há alguma verdade, realmente, no fogo?\" reclama [teentribal.GetSheHe]. \"Se todos vocês só querem agonia de mim, suponho que darei a vocês em abundância...\""
 bp2_yearly.7029.desc_hair_shaving:0 "O cabelo d[Select_CString( teentribal.IsFemale, 'a', 'o' )] [teentribal.GetFirstNamePossessiveNoTooltip] será raspado. [teentribal.GetSheHe|U] segura punhados dele com medo branco nas mãos.\n\n\"Dizem que meu cabelo é o mais bonito da tribo!\" protesta [teentribal.GetSheHe]. \"Não poderíamos apenas cortar o pelo de um sacrifício?!\""
 bp2_yearly.7029.desc_scarification:0 "O rosto d[Select_CString( teentribal.IsFemale, 'a', 'o' )] [teentribal.GetFirstNamePossessiveNoTooltip] será marcado com cicatrizes, marcando [teentribal.GetSheHe] para sempre como um de nós. [teentribal.GetSheHe|U] encolhe-se ao pensar na lâmina.\n\n\"Eu temo perder um olho!\" [teentribal.GetSheHe] lamenta. \"Como eu devo me preparar para algo tão terrível?\""
 bp2_yearly.7029.desc_seclusion:0 "[teentribal.GetFirstNameNoTooltip] está preparad[Select_CString( teentribal.IsFemale, 'a', 'o' )] para o caminho do isolamento, mas mal preparado. [teentribal.GetSheHe|U] demora em abraços, com olhos orvalhados.\n\n\"Isso é um mau presságio?\" pergunta [teentribal.GetSheHe]. \"Não? Ainda assim... esse mau tempo. Certamente, ninguém viaja nesse tempo?\""
 bp2_yearly.7029.desc_water_cleanse:0 "[teentribal.GetFirstNameNoTooltip] será entregue à água. [teentribal.GetSheHe|U] parece pouco ansioso para ser submerso.\n\n\"Talvez eu vou desejar que alguma criatura das profundezas venha me devorar,\" resmunga [teentribal.GetSheHe]. \"O [ROOT.Char.GetFaith.PriestNeuter] deseja me matar tanto quanto..."
 bp2_yearly.7029.t:0 "Ritos de Passagem: Um Medo Familiar"
