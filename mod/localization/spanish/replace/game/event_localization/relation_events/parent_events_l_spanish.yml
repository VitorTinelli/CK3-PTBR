l_spanish:
 child_sent_away_tt:0 "[child.GetTitledFirstName] será educad[Select_CString( child.IsFemale, 'a', 'o' )] [Select_CString( new_guardian.IsFemale, 'pela', 'pelo' )] [new_guardian.GetTitledFirstName]"
 parent.1001.a:0 "\"Então, como #EMP deveriam#! ser organizados os $knight_culture_player_plural_no_tooltip_lowercase$, [parent.Custom('MotherFather')]?\""
 parent.1001.b:0 "Somente eu decido como eles lutam!"
 parent.1001.desc:0 "M[Select_CString( parent.IsFemale, 'inha', 'eu' )] [parent.Custom('MotherFather')] tem muitas coisas a dizer sobre os $knight_culture_player_plural_no_tooltip_lowercase$ do meu reino, comentando sobre tudo, desde como eles treinam até no que eles devem se preparar no campo de batalha.\n\nAté os $knight_culture_player_plural_no_tooltip$ admitem que o que [parent.GetSheHe] diz faz muito sentido também."
 parent.1001.t:0 "Conselho [Select_CString( parent.IsFemale, 'Maternal', 'Paterno' )]"
 parent.1002.a:0 "Eu preciso de todo o conselho que puder obter, para ser sincero."
 parent.1002.b:0 "\"É #EMP minha#! [ROOT.Char.Custom('GetCourt')], não sua, [parent.Custom('MotherFather')].\""
 parent.1002.desc:0 "M[Select_CString( parent.IsFemale, 'inha', 'eu' )] [parent.Custom('MotherFather')] é uma pessoa sábia, compreensiva das necessidades e desejos das pessoas.\n\n[parent.GetSheHe|U] frequentemente me oferece orientações ao lidar com os outros."
 parent.1003.a:0 "Melhor saber do que se arrepender por não saber."
 parent.1003.b:0 "\"Eu não quero que você alimente minhas preocupações, [parent.Custom('MotherFather')].\""
 parent.1003.desc:0 "M[Select_CString( parent.IsFemale, 'inha', 'eu' )] [parent.Custom('MotherFather')] frequentemente passa horas apontando pequenos detalhes que eu deixo escapar em meu [ROOT.Char.Custom('GetCourt')].\n\nDois servos que costumavam brigar agora fofocam, os guardas parecem mais quietos que o normal, um braseiro foi movido para o outro lado do [ROOT.Char.Custom('ResidenceBuilding')]..."
 parent.1004.a:0 "\"Por favor, me guie para escolhas prudentes, [parent.Custom('MotherFather')].\""
 parent.1004.b:0 "Meu reino, meu tesouro!"
 parent.1004.desc:0 "Às vezes, penso que m[Select_CString( parent.IsFemale, 'inha', 'eu' )] [parent.Custom('MotherFather')] tem uma visão melhor do meu tesouro do que até mesmo meu Administrador. Uma moeda de ouro parece valer o dobro quando [parent.GetSheHe] me diz como gastá-la!"
 parent.1005.a:0 "\"Compartilhe sua sabedoria comigo, [parent.Custom('MotherFather')]!\""
 parent.1005.b:0 "As palavras deslumbram, mas será que são mesmo tão sábias?"
 parent.1005.desc:0 "Muitos homens e mulheres sábios enfeitam meu [ROOT.Char.Custom('GetCourt')], mas duvido que algum deles consiga vencer m[Select_CString( parent.IsFemale, 'inha', 'eu' )] [parent.Custom('MotherFather')] em um debate. [parent.GetSheHe|U] sempre tem uma perspectiva surpreendente ou outro nível de conhecimento para revelar!"
 parent.1006.a:0 "Bom trabalho, [parent.Custom('MotherFather')]."
 parent.1006.desc:0 "M[Select_CString( parent.IsFemale, 'inha', 'eu' )] [parent.Custom('MotherFather')] tem mostrado grande interesse nos acontecimentos em [county.GetNameNoTier] ultimamente.\n\n[parent.GetSheHe|U] até mesmo começou a se corresponder com barões e prefeitos, instruindo-os sobre a administração adequada!"
 parent.1006.t:0 "Uma Mão Orientadora"
 parent.1007.a:0 "A ajuda d[Select_CString( parent.IsFemale, 'a', 'o' )] [parent.Custom('MotherFather')|U] é sempre bem-vinda."
 parent.1007.b:0 "Eu mesmo irei manter essas pessoas sob controle!"
 parent.1007.courtier_1:0 "Peguei [courtier.GetSheHe] no meio de uma história sobre uma trapalhada que eu #EMP supostamente#! cometi em um evento ao qual nem sequer compareci!"
 parent.1007.courtier_2:0 "Encontrei [courtier.GetSheHe] e outro bajulador andando pelo [ROOT.Char.Custom('ResidenceBuilding')]. No momento em que [Select_CString( courtier.IsFemale, 'a', 'o' )] [courtier.GetTitledFirstNameNoTooltip] me viu, fez questão de pausar a fofoca até que eu passasse. E essa nem é a primeira vez que recebo esse tipo de insulto!"
 parent.1007.desc_end:0 "\n\nSempre a presença mediadora, m[Select_CString( parent.IsFemale, 'inha', 'eu' )] [parent.Custom('MotherFather')] ofereceu-se para resolver o mal-entendido entre nós."
 parent.1007.desc_opening:0 "M[Select_CString( courtier.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))], [courtier.GetTitledFirstName], deixou bem claro o desdém que sente por mim.\n\n"
 parent.1007.t:0 "[parent.Custom('MotherFather')|U] Mediador[Select_CString( parent.IsFemale, 'a', '' )]"
 parent.1009.a:0 "Tenho certeza de que podemos encontrar algo para [new_courtier.GetSheHe] fazer."
 parent.1009.b:0 "Não, [new_courtier.GetSheHe] não terá um lar aqui."
 parent.1009.desc:0 "[Select_CString( new_courtier.IsFemale, 'Uma das velhas conhecidas', 'Um dos velhos conhecidos' )] [Select_CString( parent.IsFemale, 'da minha', 'do meu' )] [parent.Custom('MotherFather')], [new_courtier.GetTitledFirstName], chegou a minha [ROOT.Char.Custom('GetCourt')], a convite [parent.GetHerHim].\n\nM[Select_CString( parent.IsFemale, 'inha', 'eu' )] [parent.Custom('MotherFather')] não para de insinuar a boa influência que [Select_CString( new_courtier.IsFemale, 'a', 'o' )] [new_courtier.GetFirstNameNoTooltip] poderia exercer se [new_courtier.GetSheHe] recebesse algum cargo..."
 parent.1009.t:0 "Uma Nova Relação"
 parent.1010.a:0 "Um descanso é exatamente o que eu preciso."
 parent.1010.b:0 "Este não é o momento de relaxar!"
 parent.1010.desc:0 "Ultimamente, meus encargos como [ROOT.Char.GetTitleAsNameNoTooltip] têm sido mais intensos do que o normal, e m[Select_CString( parent.IsFemale, 'inha', 'eu' )] [parent.Custom('MotherFather')] parece ter notado.\n\n[parent.GetSheHe|U] insiste que eu tire um dia de descanso, assegurando-me que [parent.GetSheHe] cuidará de minhas responsabilidades nesse meio-tempo."
 parent.1010.t:0 "Relações Relaxantes"
 parent.2002.a:0 "Você enviou m[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('DaughterSon')] para #EMP onde#!?!"
 parent.2002.desc:0 "Depois de dias sem ver [Select_CString( child.IsFemale, 'a', 'o' )] [child.GetTitledFirstName], logo descobri que m[Select_CString( parent.IsFemale, 'inha', 'eu' )] [parent.Custom('MotherFather')], que se intromete muito, sabia exatamente onde [child.GetSheHe] estava:\n\"Eu só mandei [child.GetSheHe] embora por preocupação com a educação [child.GetHerHim]. As coisas serão muito melhores para [child.GetSheHe] sob os cuidados d[Select_CString( new_guardian.IsFemale, 'a', 'o' )] [new_guardian.GetTitledFirstNamePossessive].\"\""
 parent.2002.t:0 "Uma Educação Sólida"
 parent.2003.a:0 "Como [parent.GetSheHe] ousa?! É #EMP meu#! [ROOT.Char.Custom('GetRealmOrDomicile')|l]!"
 parent.2003.b:0 "Boa riddance."
 parent.2003.desc:0 "Eu pensei que a rixa entre m[Select_CString( parent.IsFemale, 'inha', 'eu' )] [parent.Custom('MotherFather')] e m[Select_CString( hated_courtier.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hated_courtier'))], [hated_courtier.GetTitledFirstName], nunca teria fim.\n\nBem, agora ela acabou. M[Select_CString( parent.IsFemale, 'inha', 'eu' )] [parent.Custom('MotherFather')] baniu [Select_CString( hated_courtier.IsFemale, 'a', 'o' )] [hated_courtier.GetFirstNameNoTooltip] do meu [ROOT.Char.Custom('GetRealmOrDomicile')|l]!"
 parent.2003.t:0 "M[Select_CString( parent.IsFemale, 'inha', 'eu' )] [Select_CString( parent.IsFemale, 'Mãezinha', 'Paizinho' )]"
 parent.2004.a:0 "Eu ordenarei que [parent.GetSheHe] pare!"
 parent.2004.b.message:0 "Estou bem com a situação como está"
 parent.2004.b:0 "[parent.GetSheHe|U] é irritante, mas indiscutivelmente útil..."
 parent.2004.benevolent:0 "\n\n[parent.GetSheHe|U] me dá palestras sobre as virtudes da retidão, insinuando que eu tenho muito a aprender sobre o assunto."
 parent.2004.dominant:0 "\n\n[parent.GetSheHe|U] me dá lições constantemente, nunca cedendo e nunca me deixando relaxar."
 parent.2004.emotional:0 "\n\n[parent.GetSheHe|U] é propenso a explosões emocionais e [parent.GetSheHe] tira total proveito do fato de eu ouvi-lo para evitar fazer um escândalo."
 parent.2004.end:0 "Eu sei que [parent.GetSheHe] faz isso por amor, mas isso está ficando ridículo."
 parent.2004.extroverted:0 "\n\n[parent.GetSheHe|U] age assim até mesmo entre meus [ROOT.Char.Custom('GetCourtierPlural')|l]. [parent.GetSheHe|U] me incentiva a conversar com eles, criando situações constrangedoras para todos!"
 parent.2004.fallback:0 "\n\n[parent.GetSheHe|U] me importuna incessantemente com sugestões, e o [ROOT.Char.Custom('GetCourt')|l] está começando a fofocar sobre quem realmente toma as decisões no [ROOT.Char.Custom('ResidenceBuilding')]!"
 parent.2004.introverted:0 "\n\n[parent.GetSheHe|U] prega sobre as virtudes da solidão e tenta me isolar de meus [ROOT.Char.Custom('GetCourtierPlural')|l]!"
 parent.2004.levelheaded:0 "\n\n[parent.GetSheHe|U] quer debater comigo sobre tudo, afirmando que se precipitar em qualquer situação é abrir mão de toda vantagem. As longas discussões estão consumindo tempo e energia demais."
 parent.2004.malicious:0 "\n\n[parent.GetSheHe|U] me cutuca impiedosamente, afirmando que o tratamento rigoroso é para o meu próprio bem, ao mesmo tempo negando o sorriso que às vezes vejo se formando nos lábios [parent.GetHerHim]."
 parent.2004.opening:0 "M[Select_CString( parent.IsFemale, 'inha', 'eu' )] [parent.Custom('MotherFather')], [parent.GetFirstName], passou a me seguir por toda parte, expressando suas opiniões sobre tudo o que faço e tentando oferecer orientação."
 parent.2004.submissive:0 "\n\n[parent.GetSheHe|U] se transformou em minha sombra constante, escondendo todos os comentários [parent.GetHerHim] sob a capa de sugestões e insinuações."
 parent.2004.t:0 "Um Incômodo Constante"
 parent.3001.a:0 "M[Select_CString( parent.IsFemale, 'inha', 'eu' )] [parent.Custom('MotherFather')] realmente se importa com m[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('GetDaughterSon')]."
 parent.3001.b:0 "O repentino interesse [parent.GetHerHim] em m[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('GetDaughterSon')] é preocupante..."
 parent.3001.c:0 "M[Select_CString( parent.IsFemale, 'inha', 'eu' )] [parent.Custom('MotherFather')] astut[Select_CString( parent.IsFemale, 'a', 'o' )] não vai sair impune com isso!"
 parent.3001.desc:0 "Ultimamente, percebi que [Select_CString( child.IsFemale, 'minha querida', 'meu querido' )] [child.Custom('GetDaughterSon')], [child.GetTitledFirstName], tem passado muito tempo com m[Select_CString( parent.IsFemale, 'inha', 'eu' )] [parent.Custom('MotherFather')].\n\nAparentemente, [parent.GetTitledFirstName] tomou um interesse pessoal na vida d[Select_CString( child.IsFemale, 'a', 'o' )] [child.GetFirstNamePossessiveNoTooltip] e pretende ser uma parte ativa dela."
 parent.3001.t:0 "Sob Minha Asa"
 parent_meddling_decrease_tt:0 "M[Select_CString( parent.IsFemale, 'inha', 'eu' )] [parent.Custom('MotherFather')] está contente por eu seguir seu conselhos"
 parent_meddling_tt:0 "M[Select_CString( parent.IsFemale, 'inha', 'eu' )] [parent.Custom('MotherFather')] espera ter voz ativa nas minhas decisões"
