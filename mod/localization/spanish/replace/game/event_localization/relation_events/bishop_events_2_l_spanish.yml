l_spanish:
 bishop.2001.a:0 "Certamente, [scoped_prisoner.GetSheHe] poderia recitar um trecho da *minha* escolha?"
 bishop.2001.b:0 "Você não me deixa escolha."
 bishop.2001.c:0 "Não tropece na saída..."
 bishop.2001.d:0 "Est[Select_CString( scoped_prisoner.IsFemale, 'a', 'e' )] é m[Select_CString( scoped_prisoner.IsFemale, 'inha', 'eu' )] prisioneir[Select_CString( scoped_prisoner.IsFemale, 'a', 'o' )], [scoped_prisoner.GetSheHe] permanecerá na minha masmorra!"
 bishop.2001.desc.a:0 "[scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName] está furios[Select_CString( scoped_bishop.IsFemale, 'a', 'o' )]. \n\n[scoped_bishop.GetSheHe|U] afirma que não tenho o direito de manter [Select_CString( scoped_prisoner.IsFemale, 'a', 'o' )] [scoped_prisoner.GetTitledFirstName] como m[Select_CString( scoped_prisoner.IsFemale, 'inha', 'eu' )] prisioneir[Select_CString( scoped_prisoner.IsFemale, 'a', 'o' )]. \"[scoped_prisoner.GetSheHe|U] é um[Select_CString( scoped_prisoner.IsFemale, 'a', '' )] [scoped_prisoner.GetWomanMan] do clero! Seja quais forem seus crimes, nenhum governante secular tem autoridade para julgar [scoped_prisoner.GetSheHe]!\""
 bishop.2001.desc.b:0 "[Select_CString( scoped_prisoner.IsFemale, 'Minha prisioneira', 'Meu prisioneiro' )], [scoped_prisoner.GetTitledFirstName], recita um trecho da [scoped_prisoner.GetFaith.ReligiousText] com voz firme e olha para cima, esperando por seu julgamento. \"[scoped_prisoner.GetFirstNameNoTooltip] provou ser um membro do clero,\" declara [scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName], em pé ao lado d[Select_CString( scoped_prisoner.IsFemale, 'a', 'o' )] prisioneir[Select_CString( scoped_prisoner.IsFemale, 'a', 'o' )] e me lançando um olhar de desprezo. \"Como tal, [scoped_prisoner.GetSheHe] deve ser colocad[Select_CString( scoped_prisoner.IsFemale, 'a', 'o' )] sob custódia clerical.\""
 bishop.2001.desc.c:0 "[scoped_prisoner.GetTitledFirstName] recita um trecho com voz trêmula da [scoped_prisoner.GetFaith.ReligiousText] segurado à sua frente e então fica em silêncio.\n\n\"[scoped_prisoner.GetFirstNameNoTooltip] provou ser um membro do clero,\" declara [scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName], em pé ao lado d[Select_CString( scoped_prisoner.IsFemale, 'a', 'o' )] prisioneir[Select_CString( scoped_prisoner.IsFemale, 'a', 'o' )] e me lançando um olhar de desprezo. \"Como tal, [scoped_prisoner.GetSheHe] deve ser colocad[Select_CString( scoped_prisoner.IsFemale, 'a', 'o' )] sob custódia clerical.\""
 bishop.2001.failure.a.desc.tt:0 "[scoped_prisoner.GetTitledFirstName] é jogad[Select_CString( scoped_prisoner.IsFemale, 'a', 'o' )] de volta à masmorra."
 bishop.2001.failure.c.desc.tt:0 "[scoped_prisoner.GetFirstName] escapa dos meus assassinos!"
 bishop.2001.success.a.desc.tt:0 "[scoped_prisoner.GetTitledFirstName] é colocad[Select_CString( scoped_prisoner.IsFemale, 'a', 'o' )] sob custódia clerical."
 bishop.2001.success.c.desc.tt:0 "[scoped_prisoner.GetFirstName] morre após sua libertação."
 bishop.2001.t:0 "O Direito do Clero"
 bishop.2002.a:0 "Eu também tenho algumas coisas a dizer sobre [scoped_bishop.GetSheHe]..."
 bishop.2002.b:0 "Será que um gesto público de contrição ajudaria?"
 bishop.2002.c:0 "Não permitirei que um[Select_CString( scoped_bishop.IsFemale, 'a', '' )] [scoped_bishop.GetCouncilTitle|U] me submine!"
 bishop.2002.desc.a:0 "\n\nMinha própria família foi virada contra mim por aquel[Select_CString( scoped_bishop.IsFemale, 'a', 'e' )] [scoped_bishop.Custom2('InsultNoun', ROOT.Char)] [scoped_bishop.Custom2('InsultAdjective', ROOT.Char)] [scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName]. [scoped_bishop.GetSheHe|U] adotou o hábito de sussurrar mentiras nos ouvidos dos meus parentes sempre que eles recorrem a [scoped_bishop.GetSheHe] em busca de orientação espiritual, alegando que sou um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleTierName] pervers[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] e que [ROOT.GetCharacter.GetFaith.HighGodName] amaldiçoou nossa Casa."
 bishop.2002.desc.b:0 "Levanto minha mão para chamar [Select_CString( scoped_relative.IsFemale, 'a', 'o' )] [scoped_relative.GetFirstName] de um canto do salão, mas m[Select_CString( scoped_relative.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_relative'))] apenas me lança um olhar constrangido antes de sair correndo."
 bishop.2002.desc.c:0 "Olho ao redor da mesa de jantar, tentando iniciar uma conversa, mas encontro apenas olhares constrangidos e cabeças se virando para o lado."
 bishop.2002.everypiousrelative.custom:0 "Todos os [family_members|E] [scoped_bishop.GetFaith.GetAdjective] piedosos da minha família"
 bishop.2002.everyrelative.custom:0 "Todos os outros [family_members|E] [scoped_bishop.GetFaith.GetAdjective] da minha família"
 bishop.2002.failure.a.desc.tt:0 "Meus parentes se recusaram a me ouvir."
 bishop.2002.success.a.desc.tt:0 "Exponho a tentativa d[Select_CString( scoped_bishop.IsFemale, 'a', 'o' )] [scoped_bishop.GetFirstNamePossessive] de difamar-me."
 bishop.2002.t:0 "Minha Família [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]"
 bishop.2003.a:0 "Uma doação e algumas concessões acalmarão [scoped_bishop.GetSheHe]..."
 bishop.2003.b.a:0 "Tenho tudo completamente sob controle!"
 bishop.2003.b.b:0 "Bah. O que pode dar de pior?"
 bishop.2003.c.infidel:0 "Chegou a hora de calar [scoped_bishop.GetSheHe] de vez."
 bishop.2003.c:0 "Não tolerarei insubordinação de meus próprios vassalos!"
 bishop.2003.countyunrest.custom:0 "Cada [county|E] [scoped_bishop.GetFaith.GetAdjective] em meu domínio"
 bishop.2003.desc:0 "Não passa um dia sem que [scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName] zombe de mim durante seus sermões.\n\nAquel[Select_CString( scoped_bishop.IsFemale, 'a', 'e' )] [scoped_bishop.Custom2('InsultNoun', ROOT.Char)] obcecad[Select_CString( scoped_bishop.IsFemale, 'a', 'o' )] está convencid[Select_CString( scoped_bishop.IsFemale, 'a', 'o' )] de que sou um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] agente de [ROOT.Char.GetFaith.DevilName] e não descansará até ter virado o povo contra mim."
 bishop.2003.everytheocrat.custom:0 "Cada vassalo [theocratic|E] [scoped_bishop.GetFaith.GetAdjective]"
 bishop.2003.t:0 "O Sacerdote do Povo"
 bishop.2004.a:0 "Suponho que outra 'doação de boa fé' possa ajudar..."
 bishop.2004.b:0 "Bah! Deixe-os acreditar no que quiserem."
 bishop.2004.desc:0 "M[Select_CString( scoped_bishop.IsFemale, 'inha', 'eu' )] [scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName] tem reclamado da minha suposta 'falta de piedade' durante todos os sermões recentes.\n\nAparentemente, [scoped_bishop.GetSheHe] foi tão longe a ponto de me chamar de '[root_scope.Custom2('InsultNoun', SCOPE.sC('scoped_bishop'))] ímpi[Select_CString( root_scope.IsFemale, 'a', 'o' )]', e meus vassalos mais zelosos estão começando a ouvir [scoped_bishop.GetSheHe]..."
 bishop.2004.t:0 "Aos Olhos dos Fanáticos"
 bishop.2004.theologian:0 "Essas são mentiras flagrantes e calúnias!"
 tooltip.bishop.2001.a.success:0 "[scoped_prisoner.GetTitledFirstName] recita corretamente o trecho"
 tooltip.bishop.2002.a.success:0 "Convenço meus parentes de que [Select_CString( scoped_bishop.IsFemale, 'a', 'o' )] [scoped_bishop.GetTitledFirstName] está mentindo"
 tooltip.bishop.a.2001.fail:0 "[scoped_prisoner.GetTitledFirstName] não consegue ler o segundo verso"
 tooltip.bishop.a.2002.fail:0 "Minha família permanece impassível diante de minhas palavras"
 tooltip.bishop.c.2001.fail:0 "[scoped_prisoner.GetTitledFirstName] consegue sair iles[Select_CString( scoped_prisoner.IsFemale, 'a', 'o' )]"
 tooltip.bishop.c.2001.success:0 "[scoped_prisoner.GetTitledFirstName] sofre um acidente"
