l_spanish:
 adultery.0002.a.tt:0 "Eu confronto [Select_CString( lover_spouse.IsFemale, 'a', 'o' )] [lover_spouse.GetTitledFirstNameNoTooltip]"
 adultery.0002.a:0 "\"Você tem outra pessoa, [lover_spouse.GetFirstNameNoTooltip]?\""
 adultery.0002.b.failure:0 "Não encontro provas de infidelidade"
 adultery.0002.b.success.innocent:0 "[lover_spouse.GetTitledFirstName] é inocente"
 adultery.0002.b.success:0 "Descubro com sucesso sobre a vida amorosa [lover_spouse.GetHerHim]"
 adultery.0002.b.tt:0 "Se [lover_spouse.GetSheHe] tem sido infiel, vou descobrir"
 adultery.0002.b:0 "Vou investigar isso por conta própria."
 adultery.0002.c.tt:0 "Meu [spymaster|E] continuará espionando [lover_spouse.GetShortUIName]"
 adultery.0002.c:0 "Cada movimento [lover_spouse.GetHerHim|U] será observado."
 adultery.0002.consort_start.desc:0 "[lover_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)|U] está novamente ausente dos nossos [ROOT.Char.Custom('GetChamber')|l] quando a noite cai. [lover_spouse.GetSheHe|U] tem estado distante ultimamente — perdido em pensamentos e raramente visto na corte."
 adultery.0002.d.concubine_or_soulmate:0 "[lover_spouse.GetSheHe|U] nunca me desrespeitaria assim!"
 adultery.0002.d:0 "[lover_spouse.GetSheHe|U] nunca desrespeitaria a santidade do nosso casamento!"
 adultery.0002.desc:0 "\n\nSerá que não sou do agrado [lover_spouse.GetHerHim]? Será que [lover_spouse.GetSheHe] está simplesmente ocupado? Ou será que [lover_spouse.GetSheHe] está aquecendo a cama de outra pessoa...?"
 adultery.0002.soulmate_start.desc:0 "Já faz muito tempo desde que abracei [lover_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)]. [lover_spouse.GetSheHe|U] tem estado distante ultimamente — [lover_spouse.GetSheHe] me dá desculpa após desculpa para não podermos nos encontrar."
 adultery.0002.t:0 "Outra Pessoa"
 adultery.0003.a.tt_lie:0 "Espero que [spouse.GetSheHe] acredite..."
 adultery.0003.a.tt_truth:0 "Que [spouse.GetSheHe] sequer suspeite de uma coisa dessas..."
 adultery.0003.a:0 "Claro que não!"
 adultery.0003.b.tt:0 "[spouse.GetSheHe|U] pode te perdoar, ou não..."
 adultery.0003.b:0 "Eu pensei que você não tivesse percebido..."
 adultery.0003.desc:0 "[spouse.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tem estado tens[Select_CString( spouse.IsFemale, 'a', 'o' )] ultimamente, e quando nos encontramos a sós, finalmente fica aparente o motivo.\n\n\"Por favor, seja honest[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] comigo,\" [spouse.GetSheHe] diz em um tom grave. \"Há alguém mais? Você tomou um amante?\""
 adultery.0003.t:0 "Acusações"
 adultery.0004.b.malicious:0 "Por enquanto..."
 adultery.0004.b:0 "Não tenho escolha a não ser acreditar n[lover_spouse.GetSheHe]."
 adultery.0004.desc:0 "\"Como você pode dizer uma coisa dessas, [spouse.GetFirstNameNoTooltip]? Eu nunca teria um amante!\"\n\n[lover_spouse.GetTitledFirstName] parece genuinamente chatead[Select_CString( lover_spouse.IsFemale, 'a', 'o' )] enquanto [lover_spouse.GetSheHe] nega minhas acusações."
 adultery.0006.a:0 "Todos vão saber de sua traição, [lover_spouse.Custom2('InsultNounSexual', ROOT.Char)]"
 adultery.0006.apologetic_end.desc:0 "Aconteceu apenas uma vez, juro!"
 adultery.0006.apologetic_start.desc:0 "[lover_spouse.GetFirstNameNoTooltip] fica em silêncio, como se congelado no tempo, mas posso ver nos olhos [lover_spouse.GetHerHim] que meus medos são reais. Eu também pareço ter congelado — exceto pelo meu coração, que está batendo forte.\n\nConforme as palavras finalmente saem dos lábios d[Select_CString( lover_spouse.IsFemale, 'a', 'o' )] [lover_spouse.GetFirstNamePossessiveNoTooltip], lágrimas também escorrem nos olhos [lover_spouse.GetHerHim]. \"Por favor, [Select_CString( spouse.IsFemale, 'minha querida', 'meu querido' )] [lover_spouse.Custom2('RelationToMe', SCOPE.sC('spouse'))], você precisa me perdoar. Eu te imploro! Eu... Eu vou te contar tudo. Eu compartilhei minha cama com "
 adultery.0006.b:0 "Eu te perdoo. Dessa vez."
 adultery.0006.c:0 "Se eu não posso mais confiar em [lover_spouse.GetHerHim], o que nos resta?"
 adultery.0006.female_lover.desc:0 "uma mulher sem importância. Eu nem sei o nome dela."
 adultery.0006.male_lover.desc:0 "um homem sem importância. Eu nem sei o nome dele."
 adultery.0006.my_lovername.desc:0 "[sex_partner.Custom2('MyCharacterIntroductionNoComma', lover_spouse)]."
 adultery.0006.unapologetic_end.desc:0 "Aconteceu apenas uma vez, mas confie nas minhas palavras. Eu faria de novo com prazer."
 adultery.0006.unapologetic_start.desc:0 "[lover_spouse.GetFirstNameNoTooltip] não esperava minha acusação, isso está claro. [lover_spouse.GetSheHe|U] não fica abalado por muito tempo, porém.\n\n\"Você demorou muito para perceber, #EMP [lover_spouse.Custom2('RelationToMe', SCOPE.sC('spouse'))]#!.\" As palavras [lover_spouse.GetHerHim] estão impregnadas de veneno. \"Sim, eu me deitei com outra pessoa – "
 adultery.0006.your_lovername.desc:0 "[sex_partner.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)]."
 adultery.0007.end.desc:0 "Pelo que posso perceber, aconteceu apenas uma vez. É um consolo frio diante da traição [lover_spouse.GetHerHim]..."
 adultery.0007.female_lover.desc:0 "[lover_spouse.GetSheHe|U] sujou [lover_spouse.GetHerselfHimself] com uma plebeia insignificante, uma mulher sem importância."
 adultery.0007.lover_herhis.desc:0 "[Select_CString( lover_spouse.IsFemale, 'A', 'O' )] [lover_spouse.Custom2('InsultNoun', ROOT.Char)] mentiros[Select_CString( lover_spouse.IsFemale, 'a', 'o' )] deu as boas-vindas a [sex_partner.Custom2('HerHisCharacterIntroduction', lover_spouse)] em sua cama."
 adultery.0007.lover_my.desc:0 "[Select_CString( lover_spouse.IsFemale, 'A', 'O' )] [lover_spouse.Custom2('InsultNoun', ROOT.Char)] mentiros[Select_CString( lover_spouse.IsFemale, 'a', 'o' )] deu as boas-vindas a [sex_partner.Custom2('MyCharacterIntroduction', ROOT.Char)] em sua cama."
 adultery.0007.male_lover.desc:0 "[lover_spouse.GetSheHe|U] sujou [lover_spouse.GetHerselfHimself] com um plebeu insignificante, um homem sem importância."
 adultery.0007.start.desc:0 "Minhas suspeitas não eram infundadas. Encontrei evidências da infidelidade d[Select_CString( lover_spouse.IsFemale, 'a', 'o' )] [lover_spouse.GetFirstNamePossessiveNoTooltip]!\n\n"
 adultery.0008.a:0 "[ROOT.Char.Custom('CulturalCurse')|U]!"
 adultery.0008.no_sex_partner.desc:0 "Eu pensei que tinha sido tão cuidadoso, que não havia evidências do meu pequeno caso. No entanto, de alguma forma incompreensível, [spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] descobriu meu caso e o expôs para o mundo!"
 adultery.0008.sex_partner.desc:0 "Eu pensei que tinha sido tão cuidadoso, que não havia evidências do meu pequeno caso com [sex_partner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. No entanto, de alguma forma incompreensível, [spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] descobriu e expôs nosso segredo para o mundo!"
 adultery.0008.t:0 "Descoberto"
 adultery.0009.a:0 "Eu sou um tolo..."
 adultery.0009.desc:0 "As lágrimas d[Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetTitledFirstNamePossessive] doem muito mais do que palavras duras. Fico desanimado enquanto [spouse.GetSheHe] esconde o rosto em um lenço.\n\n\"Eu... Eu pensei que seríamos para sempre\", [spouse.GetSheHe] sussurra entre soluços. \"Nós prometemos. #EMP Você#! prometeu, [ROOT.Char.GetFirstNameNoTooltip] — e mesmo assim você compartilhou sua cama com outra pessoa. Nunca mais posso confiar em você. Acabou.\""
 adultery.1001.a.tt:0 "Confronte [Select_CString( mother.IsFemale, 'a', 'o' )] [mother.GetFirstNameNoTooltip] diretamente"
 adultery.1001.a:0 "[mother.GetSheHe|U] deve me dizer!"
 adultery.1001.b:0 "Vou investigar isso discretamente."
 adultery.1001.b_cannot_start_scheme:0 "#F Não tenho tempo para investigar isso agora, mas vou me lembrar...#!"
 adultery.1001.b_no_scheme:0 "Devo investigar isso mais tarde..."
 adultery.1001.c.tt:0 "#F Por que devo me preocupar com algo que não é verdade?#!"
 adultery.1001.c:0 "Eu devo ser o pai. Com certeza."
 adultery.1001.default:0 "Eu sou realmente o pai como [mother.GetSheHe] afirma, ou [mother.GetSheHe] traiu nossa união?"
 adultery.1001.desc_deceitful:0 "[mother.GetSheHe|U] afirma que sou o pai, mas [mother.GetSheHe] já mentiu para mim muitas vezes antes."
 adultery.1001.desc_lunatic:0 "[mother.GetSheHe|U] afirma que eu sou o pai, mas [mother.GetSheHe] também afirma que as sombras falam com [mother.GetSheHe]."
 adultery.1001.desc_lustful:0 "Sempre me preocupei que o apetite insaciável [mother.GetHerHim] fosse geral e não apenas por mim. Será que a criança pertence a outra pessoa?"
 adultery.1001.desc_root_lunatic:0 "Eles sussurraram para mim. Eu entendo. Eu acho que entendo. Como eu poderia ser o pai daquela coisa dentro dela? Aquela coisa cruel e aterrorizante?"
 adultery.1001.desc_root_trusting:0 "Eu suspeito que eu possa não ser o pai, mas... [mother.GetSheHe|U] nunca esconderia algo assim de mim, não é?"
 adultery.1001.desc_sadistic:0 "Não me surpreenderia se [mother.GetSheHe] tivesse concebido o filho de outra pessoa apenas para me torturar."
 adultery.1001.easy_to_believe:0 "Parece muito provável que [mother.GetSheHe] me trairia e que eu não seja o pai do filho [mother.GetHerHim]."
 adultery.1001.hard_to_believe:0 "É difícil acreditar que [mother.GetSheHe] jamais me trairia assim, mas será que eu não sou o pai?"
 adultery.1001.opening:0 "M[Select_CString( mother.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))], [mother.GetTitledFirstName], está grávida, e eu deveria estar radiante. No entanto, [mother.GetSheHe] tem agido estranho, e não consigo me livrar da sensação de que algo está errado.\n\n"
 adultery.1001.t:0 "Uma Questão de Lealdade"
 adultery.1002.a.confession_tt:0 "[adultery_spouse.GetShortUIName|U] vai descobrir a verdade"
 adultery.1002.a:0 "Eu preciso te contar a verdade."
 adultery.1002.b.tt:0 "#F [adultery_spouse.GetSheHe|U] provavelmente não fará mais perguntas.#!"
 adultery.1002.b:0 "Claro que é seu, [adultery_spouse.GetFirstNameNoTooltip]!"
 adultery.1002.c.tt:0 "#F [adultery_spouse.GetSheHe|U] deve acreditar nisso com certeza!#!"
 adultery.1002.c:0 "Claro que é seu, [adultery_spouse.GetFirstNameNoTooltip]!"
 adultery.1002.conclusion:0 "\n\nEu [ROOT.Char.Custom2('QuirkPersonalTowardsOther', SCOPE.sC('adultery_spouse'))]."
 adultery.1002.desc_chaste:0 "\"A criança que você carrega é realmente minha?\" [Select_CString( spouse.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] pergunta. \"Eu sei que minha devoção tem sido... Como um[Select_CString( spouse.IsFemale, 'a', '' )] [spouse.GetWomanMan]... A [spouse.GetFaith.HighGodName], antes de qualquer outra coisa.\""
 adultery.1002.desc_compassionate:0 "\"A criança que você carrega é realmente minha?\" m[Select_CString( adultery_spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] pergunta. \"Eu não quero que você sofra, não importa o que você tenha feito.\""
 adultery.1002.desc_craven:0 "\"A... A criança é realmente minha?\" M[Select_CString( adultery_spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] parece ter medo da resposta."
 adultery.1002.desc_lunatic:0 "\"A criança é minha?!\" Os olhos d[Select_CString( adultery_spouse.IsFemale, 'a', 'o' )] [adultery_spouse.GetTitledFirstNamePossessive] rolam violentamente em sua cabeça. \"Eles vão me dizer, você sabe!\""
 adultery.1002.desc_paranoid:0 "\"Eu sei que a criança não é realmente minha!\" Os olhos [Select_CString( spouse.IsFemale, 'da minha', 'do meu' )] [spouse.Custom('WifeHusbandPossessive')] estão arregalados com a acusação. \"Quem é?!\" [adultery_spouse.GetSheHe] insiste. \"Quem?!\""
 adultery.1002.desc_sadistic:0 "\"Você não engravidou de [Select_CString( spouse.IsFemale, 'outra', 'outro' )] [spouse.GetWomanMan], não é?\" [Select_CString( spouse.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] me observa atentamente. \"Você sabe que isso seria quase tão ruim para você quanto mentir para mim, não é?\" [spouse.GetSheHe|U] sorri."
 adultery.1002.desc_vengeful:0 "\"É verdadeiramente meu filho que você carrega?\" [Select_CString( adultery_spouse.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] pergunta. \"Eu juro pelo [adultery_spouse.GetFaith.HighGodName], se você mentir para mim...\""
 adultery.1002.t:0 "Uma Suspeita Furtiva"
 adultery.1002.worried:0 "\"Diga-me, é verdadeiramente meu?\" [adultery_spouse.GetTitledFirstName] parece angustiado. Os olhos [Select_CString( adultery_spouse.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] encontram os meus em um olhar preocupado."
 adultery.1003.a.tt:0 "#F É reconfortante saber.#!"
 adultery.1003.a:0 "Eu só precisava ouvir você dizer isso."
 adultery.1003.b:0 "Eu não acredito em você!"
 adultery.1003.desc:0 "\"Claro que a criança é sua.\" [mother.GetFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('mother'))]. \"Por que você pensaria de outra forma?\""
 adultery.1003.duel_failure:0 "Agentes descobertos"
 adultery.1003.duel_success:0 "Descobrir a verdade"
 adultery.1003.duel_success_tt:0 "Se outra pessoa for o pai da criança d[Select_CString( mother.IsFemale, 'a', 'o' )] [mother.GetFirstNamePossessiveNoTooltip], eu encontrarei evidências da infidelidade [mother.GetHerHim]"
 adultery.1004.a.tt:0 "Guardo o segredo para mim. Por enquanto."
 adultery.1004.a:0 "Como isso pode ser? Preciso de tempo para pensar."
 adultery.1004.b:0 "Esse segredo deve ficar entre nós!"
 adultery.1004.c:0 "Todos saberão da sua infidelidade!"
 adultery.1004.default_admission:0 "\n\nDepois de um longo silêncio, [mother.GetSheHe] finalmente admite. \"[real_father.GetTitledFirstName] é o verdadeiro pai da minha criança.\""
 adultery.1004.default_reaction:0 "Lágrimas brotam nos olhos d[Select_CString( mother.IsFemale, 'a', 'o' )] [mother.GetTitledFirstNamePossessive]."
 adultery.1004.reaction_callous:0 "[mother.GetTitledFirstName] me encara, o rosto imóvel."
 adultery.1004.reaction_compassionate:0 "\"Você deveria se sentar, meu querido.\" Há uma preocupação genuína nos olhos d[Select_CString( mother.IsFemale, 'a', 'o' )] [mother.GetTitledFirstNamePossessive]."
 adultery.1004.reaction_deceitful:0 "\"Estou tão cansada de mentir.\" [mother.GetTitledFirstName] parece à beira das lágrimas."
 adultery.1004.reaction_gluttonous:0 "[mother.GetTitledFirstName] tenta esconder as lágrimas que surgem em seus olhos atrás de seu pãozinho doce."
 adultery.1004.reaction_honest:0 "\"Eu não quero mentir para você, nem para ninguém.\" Os olhos d[Select_CString( mother.IsFemale, 'a', 'o' )] [mother.GetTitledFirstNamePossessive] estão vermelhos de chorar."
 adultery.1004.reaction_lunatic:0 "[mother.GetTitledFirstName] parece incomumente lúcida enquanto [mother.GetSheHe] me encara. Então seus olhos se nublam. \"As vozes já te contaram?\""
 adultery.1004.reaction_negative_opinion:0 "Os lábios d[Select_CString( mother.IsFemale, 'a', 'o' )] [mother.GetTitledFirstNamePossessive] formam uma linha fina em sua expressão rígida. \"É quase um alívio, sabe.\""
 adultery.1004.reaction_positive_opinion:0 "\"Você precisa entender, eu nunca quis te machucar.\" Lágrimas escorrem pelo rosto d[Select_CString( mother.IsFemale, 'a', 'o' )] [mother.GetTitledFirstNamePossessive]."
 adultery.1004.reaction_sadistic:0 "[mother.GetTitledFirstName] me dá um sorriso sarcástico."
 adultery.1006.a:0 "E agora, o que acontece?"
 adultery.1006.conclusion:0 "\n\nPelo menos é somente [Select_CString( adultery_spouse.IsFemale, 'a minha', 'o meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] que sabe."
 adultery.1006.fallback:0 "\"Sim, [real_father.GetTitledFirstName] é o pai...\" Fui deixado sem escolha além de confessar."
 adultery.1006.t:0 "[adultery_spouse.GetSheHe|U] Sabe"
 adultery.1006.very_negative_opinion:0 "\"Sim, [real_father.GetTitledFirstName] é o pai.\" Não pude deixar de aproveitar para esfregar isso na cara."
 adultery.1006.very_positive_opinion:0 "\"Sim, [real_father.GetTitledFirstName] é o pai.\" Foi quase um alívio não ter mais que guardar esse segredo de [adultery_spouse.GetSheHe]."
 adultery.1009.a.flavor_tt:0 "Eu apenas precisava ter certeza."
 adultery.1009.a:0 "Claro que eu sempre confiei em você, querida!"
 adultery.1009.desc:0 "Parece que meus medos podem ter sido infundados. Apesar de todos os esforços dos meus espiões, não encontrei nenhuma indicação de que a [mother.GetTitledFirstName] tenha sido infiel.\n\nInfelizmente, [mother.GetSheHe] descobriu sobre minhas suspeitas e está muito desapontada comigo."
 adultery.1009.t:0 "Suspeitas Descartadas"
 adultery.2001.a.duel_failure:0 "Fui pego tentando descobrir a verdade"
 adultery.2001.a.duel_success.tooltip:0 "Você descobre a verdade, seja ela qual for"
 adultery.2001.a.duel_success:0 "Espio com sucesso minha família"
 adultery.2001.a.tt:0 "Se [Select_CString( adultery_child.IsFemale, 'a', 'o' )] [adultery_child.GetFirstNameNoTooltip] não é [Select_CString( adultery_child.IsFemale, 'minha filha legítima', 'meu filho legítimo' )]:"
 adultery.2001.a:0 "Preciso ter certeza!"
 adultery.2001.b:0 "Claro que [adultery_child.GetSheHe] é m[Select_CString( adultery_child.IsFemale, 'inha', 'eu' )] [adultery_child.Custom('GetDaughterSon')]."
 adultery.2001.desc_dislike:0 "Às vezes, eu me pergunto sobre [Select_CString( adultery_child.IsFemale, 'a', 'o' )] [adultery_child.GetTitledFirstName]. As coisas que [adultery_child.GetSheHe] diz, sua personalidade irritante, a maneira como [adultery_child.GetSheHe] sempre me irrita... [adultery_child.GetSheHe|U] é tão estranho para mim quanto qualquer um dos meus súditos comuns."
 adultery.2001.desc_end:0 "\n\nNão questiono a linhagem [Select_CString( adultery_child.IsFemale, 'da minha', 'do meu' )] [adultery_child.Custom('GetDaughterSon')] [adultery_child.GetTitledFirstName] levianamente, mas a dúvida está corroendo minha mente."
 adultery.2001.desc_fallback:0 "Sempre que falo sobre [Select_CString( adultery_child.IsFemale, 'a', 'o' )] [adultery_child.GetTitledFirstName] com m[Select_CString( adultery_spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] [adultery_spouse.GetTitledFirstName], [adultery_spouse.GetSheHe] sempre se distancia. A princípio, não pensei nada disso, mas agora estou começando a suspeitar que [Select_CString( adultery_spouse.IsFemale, 'a', 'o' )] [adultery_spouse.GetFirstName] está escondendo algo."
 adultery.2001.desc_mother_lover:0 "Desde que descobri que m[Select_CString( adultery_spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] [adultery_spouse.GetTitledFirstName] tem sido infiel à nossa união, olho com suspeita para todos próximos a [adultery_spouse.GetSheHe]; cada cortesão que passa, meus próprios [ROOT.Char.Custom('ChildChildrenGender')]..."
 adultery.2001.desc_suspicious_mother:0 "M[Select_CString( adultery_spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] [adultery_spouse.GetTitledFirstName] está escondendo algo sobre noss[Select_CString( adultery_child.IsFemale, 'a', 'o' )] [adultery_child.Custom('GetDaughterSon')], tenho certeza disso! Os olhares furtivos, a proteção d[Select_CString( adultery_child.IsFemale, 'a', 'o' )] [adultery_child.GetTitledFirstName], a maneira como [adultery_spouse.GetSheHe] evita todas as minhas perguntas..."
 adultery.2001.t:0 "M[Select_CString( adultery_child.IsFemale, 'inha', 'eu' )] [adultery_child.Custom('GetDaughterSon')|U]"
 adultery.2002.a.tt:0 "#F Vou observar [adultery_child.GetSheHe] ainda mais de perto!#!"
 adultery.2002.a.tt_unborn:0 "#F Vou observar [adultery_spouse.GetSheHe] ainda mais de perto!#!"
 adultery.2002.a:0 "[adultery_child.GetSheHe|U] não pode me esconder nada!"
 adultery.2002.a_spouse:0 "Se eles acham que podem me esconder coisas, estão enganados!"
 adultery.2002.a_spouse_tt:0 "#F Vou observá-los ainda mais de perto!#!"
 adultery.2002.a_unborn:0 "[adultery_spouse.GetSheHe|U] não pode me esconder nada!"
 adultery.2002.b:0 "Que alívio!"
 adultery.2002.desc:0 "Aceno para [Select_CString( adultery_child.IsFemale, 'a minha', 'o meu' )] [adultery_child.Custom('GetDaughterSon')] [adultery_child.GetTitledFirstName] enquanto [adultery_child.GetSheHe] caminha pelo jardim, e tento dissipar minhas sombrias dúvidas.\n\nMinhas preocupações iniciais sobre a linhagem d[Select_CString( adultery_child.IsFemale, 'a', 'o' )] [adultery_child.GetTitledFirstNamePossessive] parecem ter sido infundadas. No entanto, eles não são propensos a esquecê-las tão cedo."
 adultery.2002.desc_no_child:0 "Aceno para [Select_CString( adultery_spouse.IsFemale, 'a', 'o' )] [adultery_spouse.GetTitledFirstName] [adultery_spouse.GetSheHe] enquanto [adultery_spouse.GetSheHe] caminha pelo jardim, mas [adultery_spouse.GetSheHe] se vira demonstrativamente.\n\nMinhas preocupações iniciais sobre a fidelidade [adultery_spouse.GetHerHim] parecem ter sido enganos. No entanto, [adultery_spouse.GetFirstNameNoTooltip] não é provável de esquecê-las tão cedo."
 adultery.2002.desc_not_born:0 "Aceno para [Select_CString( adultery_spouse.IsFemale, 'a minha', 'o meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] [adultery_spouse.GetTitledFirstName] enquanto [adultery_spouse.GetSheHe] caminha pelo jardim, mas [adultery_spouse.GetSheHe] se vira demonstrativamente.\n\nMinhas preocupações iniciais sobre a fidelidade [adultery_spouse.GetHerHim] parecem ter sido infundadas. No entanto, [adultery_spouse.GetFirstNameNoTooltip] não é provável que as esqueça tão cedo."
 adultery.2002.desc_spouse:0 "Aceno para [Select_CString( adultery_spouse.IsFemale, 'a minha', 'o meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] [adultery_spouse.GetTitledFirstName] enquanto [adultery_spouse.GetSheHe] caminha pelo jardim, mas [adultery_spouse.GetSheHe] se vira demonstrativamente.\n\nMinhas preocupações iniciais sobre a linhagem d[Select_CString( adultery_child.IsFemale, 'a', 'o' )] [adultery_child.GetTitledFirstNamePossessive] parecem ter sido infundadas. No entanto, eles não são propensos a esquecê-las tão cedo."
 adultery.2002.t_a:0 "Nosso Filho"
 adultery.2003.a:0 "Como eles puderam me enganar assim?!"
 adultery.2003.desc:0 "\"Sim, pai— [ROOT.Char.GetFirstNameNoTooltip], [real_father.GetTitledFirstName] é meu verdadeiro [real_father.Custom('MotherFather')].\" A dor da traição [Select_CString( adultery_spouse.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] [adultery_spouse.GetTitledFirstNamePossessive] é quase ofuscada pelo alívio de finalmente saber a verdade. Pense que [adultery_spouse.GetSheHe] e [Select_CString( adultery_child.IsFemale, 'a', 'o' )] [adultery_child.GetFirstName] mantiveram isso escondido de mim..."
 adultery.2006.a:0 "Como vou poder encarar [owner.GetSheHe] agora?"
 adultery.2006.desc:0 "M[Select_CString( owner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] [owner.GetTitledFirstName] descobriu que eu sou [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.Custom('GetDaughterSon')] [Select_CString( real_father.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] [real_father.GetTitledFirstName] e não dele! Pelo menos não é de conhecimento geral...ainda."
 adultery.2006.t:0 "Minha Herança"
 adultery.2008.a:0 "Deixem todos saberem — esse não é [Select_CString( adultery_child.IsFemale, 'minha filha', 'meu filho' )]!"
 adultery.2008.b.tt:0 "Guardo isso para mim por enquanto"
 adultery.2008.b:0 "Preciso de tempo para pensar."
 adultery.2008.desc:0 "Esse medo que tem crescido em meu peito sempre foi justificado!\n\nMeus espiões descobriram que eu não sou o pai d[Select_CString( adultery_child.IsFemale, 'a', 'o' )] [adultery_child.GetTitledFirstName]. [adultery_child.GetSheHe|U] é resultado de uma união ilícita entre [Select_CString( adultery_spouse.IsFemale, 'a', 'o' )] [adultery_spouse.GetFirstName] e [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
 adultery.2008.t:0 "M[Select_CString( adultery_child.IsFemale, 'inha', 'eu' )] [adultery_child.Custom('GetDaughterSon')|U]?"
 adultery.2009.a:0 "Então [adultery_child.GetSheHe] é [Select_CString( adultery_child.IsFemale, 'minha filha', 'meu filho' )], afinal."
 adultery.2009.desc:0 "Apesar de seguir [Select_CString( adultery_child.IsFemale, 'a', 'o' )] [adultery_child.GetTitledFirstName] por todos os lugares, meus espiões não encontraram nenhuma indicação de que eu deva suspeitar da linhagem del[Select_CString( adultery_child.IsFemale, 'a', 'e' )].\n\nInfelizmente, [adultery_child.GetFirstNameNoTooltip] ainda está chatead[Select_CString( adultery_child.IsFemale, 'a', 'o' )] por eu ter qualquer suspeita."
 adultery.2009.t:0 "M[Select_CString( adultery_child.IsFemale, 'inha', 'eu' )] [adultery_child.Custom('GetDaughterSon')|U]?"
 adultery.3001.a.tt:0 "#F Pelo menos não é de conhecimento geral...#!"
 adultery.3001.a:0 "Como [Select_CString( parent_with_secret.IsFemale, 'minha própria', 'meu próprio' )] [parent_with_secret.Custom('MotherFather')] pôde fazer isso comigo?!"
 adultery.3001.desc:0 "\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom('GetDaughterSon')], [Select_CString( ROOT.Char.IsFemale, 'minha querida filha', 'meu querido filho' )], eu tive que contar! Você me perdoará algum dia?\"\n\nMinha mãe está no chão, lágrimas escorrendo pelo rosto dela, e eu estou sem palavras."
 adultery.3001.desc_father:0 "[father.GetFirstName], o [father.GetWomanMan] que eu cresci achando que era meu pai, não tem relação comigo. Meu verdadeiro pai é o [real_father.GetTitledFirstName]!"
 adultery.3001.desc_no_father:0 "M[Select_CString( real_father.IsFemale, 'inha', 'eu' )] [real_father.Custom('MotherFather')] é o [real_father.GetTitledFirstName]!"
 adultery.3001.t:0 "O Segredo"
 adultery.4001.a:0 "Como posso confiar n[adultery_spouse.GetSheHe] novamente?"
