 adultery.4001.desk.desc:0 "Bem em minha própria mesa, se os sussurros forem verdadeiros!"
 adultery.4001.elephant.desc:0 "Na floresta, como um elefante em período de acasalamento!"
 adultery.4001.end.desc:0 "\n\nQuando confronto [Select_CString( adultery_spouse.IsFemale, 'a', 'o' )] [adultery_spouse.GetFirstName], [adultery_spouse.GetSheHe] insiste que \"só aconteceu uma vez\" – como se isso amenizasse a traição [adultery_spouse.GetHerHim]!"
 adultery.4001.fur.desc:0 "Dizem que [adultery_spouse.GetSheHe] foi aos aposentos [sex_partner.GetHerHim], vestindo apenas peles, e foi expulso em um instante!"
 adultery.4001.kitchen.desc:0 "Lá embaixo, nas cozinhas, se os sussurros forem verdadeiros!"
 adultery.4001.laugh.desc:0 "Dizem que [sex_partner.GetSheHe] riu na cara [adultery_spouse.GetHerHim] quando [adultery_spouse.GetSheHe] convidou [sex_partner.GetSheHe] para a cama [adultery_spouse.GetHerHim]!"
 adultery.4001.mare.desc:0 "No estábulo, como uma simples égua!"
 adultery.4001.privy.desc:0 "No cheiro sombrio do privado, se os sussurros forem verdadeiros!"
