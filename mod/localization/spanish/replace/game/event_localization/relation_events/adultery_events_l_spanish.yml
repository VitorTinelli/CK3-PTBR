 adultery.4001.another_gender.desc:0 "E ainda por cima com um[Select_CString( unknown_sex_partner.IsFemale, 'a', '' )] [unknown_sex_partner.GetWomanMan]!"
 adultery.4001.b2:0 "Você irá se arrepender disso! Guardas!"
 adultery.4001.b:0 "Guardas! Prendam [Select_CString( adultery_spouse.IsFemale, 'a', 'o' )] [adultery_spouse.Custom2('InsultNounSexual', ROOT.Char)] infame!"
 adultery.4001.bed.desc:0 "Bem na nossa própria cama, se os sussurros forem verdadeiros!"
 adultery.4001.c:0 "De uma forma ou de outra, devo tentar perdoar."
