l_spanish:
 friendship.0001.a:0 "É o jeito das coisas."
 friendship.0001.b.tt:0 "[friend_in_question.GetSheHe|U] dará outra chance ao nosso relacionamento"
 friendship.0001.b:0 "Mas... Lembre-se de todos os bons momentos!"
 friendship.0001.desc:0 "\"Sinto que não há mais amizade entre nós.\""
 friendship.0001.desc_murder:0 "\"Você cometer um assassinato... Sinto que não há mais amizade entre nós.\""
 friendship.0001.desc_opening:0 "Tempos e pessoas mudam. Às vezes, aqueles que estão mais próximos de nós parecem se tornar estranhos.\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip],\" [friend_in_question.Custom2('MyCharacterIntroduction', ROOT.Char)] sorri tristemente."
 friendship.0001.t:0 "Afastando-se"
 friendship.0002.a:0 "É o jeito das coisas."
 friendship.0002.desc:0 "Tempos e pessoas mudam. Às vezes, aqueles que estão mais próximos de nós parecem se tornar estranhos.\n\nEstá claro que [Select_CString( first_friend.IsFemale, 'a', 'o' )] [first_friend.GetTitledFirstName] e eu não podemos mais ser chamados de amigos."
 friendship.0002.t:0 "Afastando-se"
 friendship.0003.a:0 "Deveria escrever para [friend_as_potential_lover.GetSheHe], [friend_as_potential_lover.GetSheHe] sempre dá bons conselhos."
 friendship.0003.b:0 "Não, somos apenas amigos e nada mais."
 friendship.0003.desc:0 "[friend_as_potential_lover.GetTitledFirstName] é muito importante para mim. Fico pensando muito n[friend_as_potential_lover.GetSheHe], e às vezes mal suporto a distância entre nós.\n\nSerá que isso é um sinal da profundidade da nossa amizade, ou algo mais?"
 friendship.0003.desc_intro:0 "M[Select_CString( friend_as_potential_lover.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friend_as_potential_lover'))] "
 friendship.0003.goes_for_it_tooltip:0 "Você confessa seus sentimentos [Select_CString( friend_as_potential_lover.IsFemale, 'a', 'ao' )] [friend_as_potential_lover.GetTitledFirstName]"
 friendship.0003.t:0 "Algo Mais"
 friendship.0004.a:0 "Ah, não posso negar mais esse desejo!"
 friendship.0004.b:0 "Não, somos bons amigos e só isso."
 friendship.0004.desc:0 "[first_friend.GetTitledFirstName] é muito importante para mim. Fico pensando muito n[first_friend.GetSheHe], e às vezes mal suporto a distância entre nós.\nSerá que isso é um sinal da profundidade da nossa amizade, ou algo mais?"
 friendship.0004.desc_intro:0 "M[Select_CString( first_friend.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('first_friend'))] "
 friendship.0004.goes_for_it_tooltip:0 "Com o coração na mão, você decide confessar seus sentimentos"
 friendship.0005.a:0 "Tento não mostrar a dor no meu rosto. \"Oh, você entendeu errado.\""
 friendship.0005.b:0 "Por que está me afastando se sei que sente o mesmo, [friend_as_potential_lover.GetFirstNameNoTooltip]?"
 friendship.0005.c:0 "Há beleza nisso também."
 friendship.0005.desc:0 "Embora eu tenha tentado parecer ambíguo, [friend_as_potential_lover.GetTitledFirstName] entendeu exatamente o que eu estava tentando dizer, como sempre. A resposta [friend_as_potential_lover.GetHerHim] foi gentilmente formulada, cheia de cuidado, mas também doeu muito.\n\n[friend_as_potential_lover.GetSheHe|U] sente algo forte por mim, mas apenas como amigo."
 friendship.0005.t:0 "Uma Rejeição Cuidadosa"
 friendship.0007.a:0 "Oh, [friend_as_potential_lover.GetFirstNameNoTooltip]!"
 friendship.0007.desc:0 "Meu coração está acelerado quando toco a bochecha d[Select_CString( friend_as_potential_lover.IsFemale, 'a', 'o' )] [friend_as_potential_lover.GetTitledFirstNamePossessive], embora eu já saiba que [friend_as_potential_lover.GetSheHe] não vai se afastar.\n\nNosso abraço está repleto de mais amor do que já senti antes."
 friendship.0007.t:0 "Quando o Cuidado se Torna Paixão"
 friendship.0008.a:0 "Oh, [first_friend.GetFirstNameNoTooltip]!"
 friendship.0008.desc:0 "Meu coração está acelerado quando toco a bochecha d[Select_CString( first_friend.IsFemale, 'a', 'o' )] [first_friend.GetTitledFirstNamePossessive], embora eu já saiba que [first_friend.GetSheHe] não vai se afastar.\n\nNosso abraço está repleto de mais amor do que já senti antes."
 friendship.0008.t:0 "Quando o Cuidado se Torna Paixão"
 friendship.0009.a:0 "Descanse em paz, [Select_CString( friend_as_potential_lover.IsFemale, 'minha querida', 'meu querido' )] [friend_as_potential_lover.GetFirstNameNoTooltip]"
 friendship.0009.desc:0 "Após sua partida, tenho passado muitas noites sozinho, pensando [Select_CString( friend_as_potential_lover.IsFemale, 'na', 'no' )] [friend_as_potential_lover.GetFirstName]. Leal, amigável e caloroso até o fim, não consigo evitar pensar no que poderia ter sido, se [friend_as_potential_lover.GetSheHe] não tivesse sido levado de mim tão cedo."
 friendship.0009.t:0 "O Que Poderia Ter Sido"
 friendship.0010.a.failure.message:0 "Falhei em consertar meu relacionamento com [Select_CString( best_friend.IsFemale, 'a', 'o' )] [best_friend.GetTitledFirstName]."
 friendship.0010.a.failure:0 "Meus esforços foram em vão"
 friendship.0010.a.success.message:0 "[best_friend.GetTitledFirstName] e eu continuamos sendo os melhores amigos."
 friendship.0010.a.success:0 "Eu conserto nossa relação"
 friendship.0010.a:0 "Precisamos trabalhar nisso, reconstruir nossa amizade!"
 friendship.0010.b:0 "Isso não vale mais a pena."
 friendship.0010.desc:0 "Nunca esperava aquele olhar confuso no rosto d[Select_CString( best_friend.IsFemale, 'a', 'o' )] [best_friend.GetTitledFirstNamePossessive] quando contei a [best_friend.GetSheHe] sobre meus sonhos. Eu pensei que [best_friend.GetSheHe] sempre me entenderia, sempre estaria ao meu lado.\n\nEntretanto, às vezes quando nos encontramos, sinto como se estivesse falando com um estranho."
 friendship.0010.t:0 "Afastando-se"
 friendship.0011.a:0 "Tivemos bons momentos, mas é hora de deixar ir."
 friendship.0011.desc:0 "O fim é lento e sem dramatização, mas tão inevitável quanto a passagem do tempo. Algum dia, pensei que [Select_CString( other_best_friend.IsFemale, 'a', 'o' )] [other_best_friend.GetTitledFirstName] seria [Select_CString( other_best_friend.IsFemale, 'minha melhor amiga', 'meu melhor amigo' )] para sempre, mas hoje o pedido de desculpas tenso [other_best_friend.GetHerHim] não me surpreende."
 friendship.0011.t:0 "Afastando-se"
 friendship.0014.a:0 "[friend_to_rival.GetFirstName] pagará!"
 friendship.0014.desc:0 "Depois de tudo o que passamos juntos, ainda não consigo acreditar que [Select_CString( friend_to_rival.IsFemale, 'a', 'o' )] [friend_to_rival.GetTitledFirstName] faria as coisas que [friend_to_rival.GetSheHe] fez.\nÉ uma traição de todos os gestos amigáveis que compartilhamos. De fato, uma traição à nossa própria amizade! Antes, compartilhávamos pão, mas agora [friend_to_rival.GetSheHe] fez um inimigo para a vida toda."
 friendship.0014.t:0 "Uma Traição"
 friendship.0015.a:0 "Você é [Select_CString( original_friend.IsFemale, 'a tola', 'o tolo' )] aqui, [original_friend.GetFirstNameNoTooltip]."
 friendship.0015.desc:0 "Eu denuncio a amizade que você tão descuidadamente zombou!\nPor todas as suas promessas e gestos que se resolveram em desonra... Conhecendo você como conheço agora, não deveria ter ficado surpreso.\n\nVocê trouxe esse sofrimento sobre si mesmo."
 friendship.0015.opening:0 "[original_friend.Custom2('AppropriateGreeting', ROOT.Char)]"
 friendship.0018.a:0 "\"Sinto muito por estar escrevendo com notícias desafortunadas, [friend_1.GetTitledFirstNameNoTooltip]...\""
 friendship.0018.b:0 "\"Você foi bom comigo, [friend_2.GetFirstNameNoTooltip], mas...\""
 friendship.0018.c:0 "\"Não é você, sou eu, [friend_3.GetFirstNameNoTooltip]...\""
 friendship.0018.d:0 "Não decepcionarei nenhum dos meus amigos!"
 friendship.0018.desc:0 "Uma [ROOT.GetCharacter.Custom('friendship_metaphor_with_tending')].\nCom tantos amigos espalhados ao vento, mal tenho tempo para me comunicar por carta, muito menos dar a atenção que eles merecem.\nTalvez seja mais fácil para mim deixar alguém... se afastar."
 friendship.0018.e:0 "Oh não, eu consigo lidar com isso."
 friendship.0018.t:0 "Mais Amigos do que Tempo"
 friendship.0019.a_1:0 "Eu sou um dos poucos que teria respondido em sua hora de necessidade, [first_friend.GetFirstNameNoTooltip]."
 friendship.0019.a_2:0 "Também não tenho sido um melhor amigo, [first_friend.GetFirstNameNoTooltip]."
 friendship.0019.desc:0 "Estou aguardando a última carta d[Select_CString( first_friend.IsFemale, 'a', 'o' )] [first_friend.GetTitledFirstNamePossessive] há muito tempo, mas nada chegou. Enviei minhas próprias mensagens, sem resposta.\nA conclusão inevitável parece ser que [first_friend.GetSheHe] não me considera mais um amigo digno de tempo e atenção."
 friendship.0019.t:0 "Encerrando a Comunicação"
 friendship.1002.a:0 "Que nossa amizade floresça para sempre!"
 friendship.1002.desc:0 "Por favor, aceite este presente como um gesto de apreciação pela nossa amizade duradoura."
 friendship.1002.opening:0 "[sender.Custom2('AppropriateGreeting', ROOT.Char)]"
 friendship.1003.a:0 "Deixe-o vagar pelos jardins!"
 friendship.1003.b:0 "Ele fornecerá cortes de carne verdadeiramente delicados..."
 friendship.1003.desc:0 "Meus caçadores capturaram este veado vivo, e sua graça e majestade me lembraram de você!\nPor favor, aceite-o como um símbolo de nossa amizade eterna!"
 friendship.1004.a:0 "Como generoso!"
 friendship.1004.desc:0 "Como gesto de apreciação por nossa duradoura amizade, gostaria de compartilhar algo que você pode achar interessante.\nFaça o que quiser com essas informações."
 friendship.1006.a:0 "Não poderia estar mais agradecido."
 friendship.1006.b:0 "[friend.GetFirstNameNoTooltip], preciso de #EMP mais!#!"
 friendship.1006.desc:0 "Preocupado com a minha guerra atual, [Select_CString( friend.IsFemale, 'minha amiga', 'meu amigo' )] [friend.GetTitledFirstName] pagou do próprio tesouro para ajudar meus esforços!"
 friendship.1006.desc_2:0 "\n\nLiderando uma caravana de carroças carregadas com ouro, [friend.GetFirstNameNoTooltip] chegou cedo esta manhã ao meu acampamento principal e agora está ocupado pagando meus soldados. [friend.GetSheHe|U] é verdadeiramente generoso."
 friendship.1006.t:0 "Apoio"
 friendship.1007.a:0 "Desonroso!"
 friendship.1007.desc:0 "Incapaz de lidar com a sua própria guerra, [friend_at_war.GetTitledFirstName] recebeu ajuda através de um grande pagamento de ouro d[Select_CString( friend_providing_gift.IsFemale, 'a', 'o' )] [friend_providing_gift.GetTitledFirstName]!"
 friendship.1007.t:0 "Traidoria e Astúcia"
 friendship.1008.a.failure:0 "[friend_receiving_gift.GetFirstName] recusa sua oferta."
 friendship.1008.a.success:0 "[friend_receiving_gift.GetFirstName] aceita sua oferta."
 friendship.1008.a:0 "[friend_receiving_gift.GetFirstNameNoTooltip] apreciará o serviço [courtier_on_offer.GetHerHim]."
 friendship.1008.b.tt:0 "[courtier_on_offer.GetTitledFirstName] fica em sua [THIS.Char.Custom('GetCourt')]"
 friendship.1008.b:0 "Não, eu preciso d[Select_CString( courtier_on_offer.IsFemale, 'a', 'o' )] [courtier_on_offer.GetTitledFirstNameNoTooltip] aqui."
 friendship.1008.desc:0 "[courtier_on_offer.GetTitledFirstName] tem me servido bem por muito tempo e se destacado em suas funções. Isso me fez pensar que [courtier_on_offer.GetSheHe] é exatamente o tipo de pessoa que [Select_CString( friend_receiving_gift.IsFemale, 'a', 'o' )] [friend_receiving_gift.GetTitledFirstName] poderia usar ao redor de sua [friend_receiving_gift.Custom('GetCourt')]."
 friendship.1008.t:0 "Uma Figura Exemplar"
 friendship.1009.a:0 "Bem-vindo ao meu serviço, [courtier_on_offer.GetFirstNameNoTooltip]!"
 friendship.1009.b:0 "Você não pode ser tão bom se [Select_CString( first_friend.IsFemale, 'a', 'o' )] [first_friend.GetTitledFirstNameNoTooltip] pode facilmente abrir mão de você."
 friendship.1009.desc:0 "Não é a primeira vez que ouço falar de como [Select_CString( courtier_on_offer.IsFemale, 'a', 'o' )] [courtier_on_offer.GetTitledFirstName] é um[Select_CString( courtier_on_offer.IsFemale, 'a', '' )] excelente serv[Select_CString( courtier_on_offer.IsFemale, 'a', 'o' )], e agora [Select_CString( first_friend.IsFemale, 'a', 'o' )] [first_friend.GetTitledFirstName] enviou [courtier_on_offer.GetSheHe] para a minha [ROOT.Char.Custom('GetCourt')]. [courtier_on_offer.GetSheHe|U] se apresenta como um símbolo da amizade entre [Select_CString( first_friend.IsFemale, 'a', 'o' )] [first_friend.GetFirstName] e eu."
 friendship.1009.rejection_tooltip:0 "[courtier_on_offer.GetTitledFirstNameNoTooltip] é enviad[Select_CString( courtier_on_offer.IsFemale, 'a', 'o' )] de volta."
 friendship.1009.t:0 "Um Conselho"
 friendship.2001.a:0 "Venha mais perto, [friend_receiving_confession.GetFirstNameNoTooltip], tenho algo para confessar."
 friendship.2001.b:0 "Não... ninguém pode saber!"
 friendship.2001.desc:0 "Meus segredos são fardos desconfortáveis que nunca posso abandonar, mas se eu os compartilhasse com alguém, eles talvez se tornassem mais leves para carregar.\n\nSinto que [Select_CString( friend_receiving_confession.IsFemale, 'a', 'o' )] [friend_receiving_confession.GetTitledFirstName] me entenderia."
 friendship.2001.t:0 "A Necessidade de Contar"
 friendship.2002.a:0 "Você está certo em confiar em mim, [confessor.GetFirstNameNoTooltip]."
 friendship.2002.b:0 "[confessor.GetFirstNameNoTooltip], tenho uma confissão minha."
 friendship.2002.desc:0 "[confessor.GetTitledFirstName] veio até mim querendo compartilhar algo que estava perturbando seu espírito.\n\nEu mostrei a maior compreensão para [Select_CString( confessor.IsFemale, 'a minha', 'o meu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('confessor'))]. Por dentro, senti mais do que um pouco de curiosidade..."
 friendship.2002.t:0 "Um Segredo Uma Vez Contado"
 friendship.2003.a:0 "É bom que ambos saibamos."
 friendship.2003.desc:0 "Quando contei meu segredo [Select_CString( friend_receiving_confession.IsFemale, 'a', 'ao' )] [friend_receiving_confession.GetTitledFirstName], seus olhos se arregalaram. \"Por que [SCOPE.GetRootScope.GetCharacter.GetFirstName], eu também tenho algo para te contar!\"\n\nParece que [Select_CString( friend_receiving_confession.IsFemale, 'a', 'o' )] [friend_receiving_confession.GetFirstName] tinha um segredo similar!"
 friendship.2003.t:0 "Um Segredo Compartilhado"
 friendship.2004.a:0 "Devo contar a [friend_receiving_confession.GetSheHe]."
 friendship.2004.desc:0 "Não posso guardar a verdade dentro de mim assim, corroendo minha alma. Alguém precisa saber.\n\n[friend_receiving_confession.GetTitledFirstName] entenderia e ajudaria a aliviar meu fardo."
 friendship.2004.t:0 "Um Terrível Fardo"
 friendship.2005.a:0 "Você estava certo em confiar em mim, amigo."
 friendship.2005.b:0 "[confessor.GetFirstNameNoTooltip], tenho uma confissão minha..."
 friendship.2005.desc:0 "[confessor.GetTitledFirstName] me disse que era um segredo obscuro que [confessor.GetSheHe] sentia a necessidade de compartilhar comigo, mas eu nunca poderia imaginar isso!\nPelo menos meu amigo não terá mais que suportar o fardo deste conhecimento sozinho."
 friendship.2005.t:0 "Um Segredo Uma Vez Contado"
 friendship.2006.a:0 "Não consigo acreditar em quanto temos em comum, m[Select_CString( friend_receiving_confession.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('friend_receiving_confession'))]."
 friendship.2006.desc:0 "Estava preocupado que até [Select_CString( friend_receiving_confession.IsFemale, 'a', 'o' )] [friend_receiving_confession.GetTitledFirstName] não me entenderia quando contei meu segredo, mas [friend_receiving_confession.GetSheHe] entendeu melhor do que eu poderia imaginar.\n\n\"Eu sei muito bem como você se sente, [ROOT.GetCharacter.GetFirstName]. Exatamente como você, na verdade...\""
 friendship.2006.t:0 "Um Segredo Compartilhado"
 friendship.2007.a:0 "Deixe-me contar uma história sobre [Select_CString( friend_interceded_for.IsFemale, 'a', 'o' )] [friend_interceded_for.GetFirstNameNoTooltip]..."
 friendship.2007.b:0 "As pessoas deveriam estar falando sobre #EMP mim#! ao invés disso."
 friendship.2007.desc:0 "Meus caminhos se cruzaram com [Select_CString( talking_target.IsFemale, 'a', 'o' )] [talking_target.GetTitledFirstName], e para minha surpresa, parece que [talking_target.GetSheHe] não tem uma boa impressão do meu amigo, [friend_interceded_for.GetTitledFirstName]!\n\nTalvez eu deva aproveitar essa oportunidade para mudar a opinião [talking_target.GetHerHim]."
 friendship.2007.failure_tt:0 "Eu só pioro as coisas para [Select_CString( friend_interceded_for.IsFemale, 'a', 'o' )] [friend_interceded_for.GetFirstName]."
 friendship.2007.success_tt:0 "Melhoro a opinião d[Select_CString( talking_target.IsFemale, 'a', 'o' )] [talking_target.GetFirstNamePossessive] sobre [Select_CString( friend_interceded_for.IsFemale, 'a', 'o' )] [friend_interceded_for.GetFirstName]"
 friendship.2007.t:0 "Uma Palavra Gentil"
 friendship.2007.utter_failure_tt:0 "Eu prejudico desastrosamente a reputação d[Select_CString( friend_interceded_for.IsFemale, 'a', 'o' )] [friend_interceded_for.GetFirstNamePossessive]."
 friendship.2009.a:0 "Sinto muito, [friend_interceded_for.GetFirstNameNoTooltip]."
 friendship.2009.desc:0 "Oh não. Não sei o que aconteceu, mas quanto mais eu falava para [Select_CString( talking_target.IsFemale, 'a', 'o' )] [talking_target.GetTitledFirstName] sobre [Select_CString( friend_interceded_for.IsFemale, 'a', 'o' )] [friend_interceded_for.GetFirstName], mais a expressão [talking_target.GetHerHim] parecia azedar.\n\nIsso piorou tanto as coisas para [Select_CString( friend_interceded_for.IsFemale, 'a', 'o' )] [friend_interceded_for.GetFirstName] que [friend_interceded_for.GetSheHe] está se perguntando o que eu poderia ter dito para [Select_CString( talking_target.IsFemale, 'a', 'o' )] [talking_target.GetFirstNameNoTooltip]!"
 friendship.2009.t:0 "Um Constrangimento"
 friendship.2010.a:0 "Oh não. [friend_doing_interceding.GetFirstNameNoTooltip]!"
 friendship.2010.desc:0 "Enquanto passava algum tempo com [talking_target.GetSheHe], [Select_CString( friend_doing_interceding.IsFemale, 'minha amiga', 'meu amigo' )], [friend_doing_interceding.GetTitledFirstName], descobriu que [Select_CString( talking_target.IsFemale, 'a', 'o' )] [talking_target.GetTitledFirstName] e eu temos uma... relação tensa.\n\nNo entanto, ao tentar convencer [Select_CString( talking_target.IsFemale, 'a', 'o' )] [talking_target.GetFirstName] das minhas virtudes, [friend_doing_interceding.GetSheHe] parece ter piorado as coisas!"
 friendship.2010.t:0 "Um Constrangimento"
 friendship.2012.a:0 "Mas [Select_CString( friend_interceded_for.IsFemale, 'a', 'o' )] [friend_interceded_for.GetFirstNameNoTooltip] é tão incrível!"
 friendship.2012.desc:0 "Tentei pintar [Select_CString( friend_interceded_for.IsFemale, 'a', 'o' )] [friend_interceded_for.GetTitledFirstName] da melhor forma possível, mas [Select_CString( talking_target.IsFemale, 'a', 'o' )] [talking_target.GetTitledFirstName] apenas desviou o olhar sempre que mencionava o nome [friend_interceded_for.GetHerHim].\n\nSuspeito que [talking_target.GetSheHe] não ficou muito impressionado."
 friendship.2012.t:0 "Muito Esforço para Pouco Ganho"
 friendship.2013.a:0 "[friend_interceded_for.GetFirstNameNoTooltip] talvez não seja tão ruim."
 friendship.2013.desc:0 "Enquanto passava uma noite na companhia d[Select_CString( friend_doing_interceding.IsFemale, 'a', 'o' )] [friend_doing_interceding.GetTitledFirstName], [friend_doing_interceding.GetSheHe] compartilhou várias histórias sobre [Select_CString( friend_interceded_for.IsFemale, 'a', 'o' )] [friend_interceded_for.GetTitledFirstName]. Depois de ouvir sobre as ações [friend_interceded_for.GetHerHim] por horas, tenho que admitir que fui injusto em meu julgamento sobre [friend_interceded_for.GetSheHe]."
 friendship.2013.t:0 "Uma Reavaliação de Relações"
 friendship.2014.a:0 "Devo um grande agradecimento [Select_CString( friend_doing_interceding.IsFemale, 'a minha amiga', 'ao meu amigo' )]!"
 friendship.2014.desc:0 "Enquanto passava algum tempo com [talking_target.GetSheHe], [Select_CString( friend_doing_interceding.IsFemale, 'minha amiga', 'meu amigo' )], [friend_doing_interceding.GetTitledFirstName], descobriu que [Select_CString( talking_target.IsFemale, 'a', 'o' )] [talking_target.GetTitledFirstName] e eu temos uma... relação tensa.\n\nNo entanto, [friend_doing_interceding.GetFirstName] não deixou isso passar e de alguma forma convenceu [Select_CString( talking_target.IsFemale, 'a', 'o' )] [talking_target.GetFirstName] de que eu não sou tão ruim quanto [talking_target.GetSheHe] pensava!"
 friendship.2014.t:0 "Recomendações"
 friendship.2015.a:0 "Meu amigo é uma ótima pessoa!"
 friendship.2015.desc:0 "Tentei pintar [Select_CString( friend_interceded_for.IsFemale, 'a', 'o' )] [friend_interceded_for.GetTitledFirstName] da melhor forma possível, e [Select_CString( talking_target.IsFemale, 'a', 'o' )] [talking_target.GetTitledFirstName] começou a ouvir cada vez mais interessado.\n\nQuando [talking_target.GetSheHe] murmurou \"Nunca soube disso!\" para [talking_target.GetHerselfHimself], soube que tinha causado uma boa impressão."
 friendship.2015.t:0 "Mudança de Convicção"
 friendship.3001.a:0 "Há tantas pessoas boas em minha vida."
 friendship.3001.desc:0 "M[Select_CString( spouse_benefitting.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('spouse_benefitting'))] [spouse_benefitting.GetTitledFirstName] cerca [spouse_benefitting.GetHerselfHimself] de boas pessoas.\n\n[friend_being_approved.GetTitledFirstName] é um exemplo do bom gosto que [Select_CString( spouse_benefitting.IsFemale, 'minha', 'meu' )] [spouse_benefitting.GetWifeHusband] tem em amigos."
 friendship.3001.t:0 "Os Amigos Escolhidos"
 friendship.3002.a:0 "Há tantas pessoas boas em minha vida."
 friendship.3002.desc:0 "[Select_CString( first_spouse.IsFemale, 'Minha', 'Meu' )] [first_spouse.GetWifeHusband] [first_spouse.GetTitledFirstName] sorriu para mim quando [first_spouse.GetSheHe] comentou sobre as boas escolhas que faço em relação às pessoas com quem me cerco.\n\n[first_spouse.GetSheHe|U] deve estar se referindo a pessoas como [Select_CString( friend_being_approved.IsFemale, 'minha amiga', 'meu amigo' )], [friend_being_approved.GetTitledFirstName]."
 friendship.3002.t:0 "Aqueles que Escolhemos"
 friendship.3003.a:0 "Se ess[Select_CString( friend_being_disapproved.IsFemale, 'a', 'e' )] [friend_being_disapproved.GetWomanMan] nos visitar mais uma vez..."
 friendship.3003.desc:0 "[Select_CString( spouse_suffering.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('spouse_suffering'))] [spouse_suffering.GetTitledFirstName] cerca [spouse_suffering.GetHerselfHimself] de algumas pessoas terríveis.\n\nAquele amigo [spouse_suffering.GetHerHim], [friend_being_disapproved.GetTitledFirstName], está entre os piores."
 friendship.3003.t:0 "Aqueles que Escolhemos"
 friendship.3004.a:0 "Não abandonarei [friend_being_disapproved.GetSheHe] por nada."
 friendship.3004.b:0 "[spouse.GetFirstNameNoTooltip] vem em primeiro lugar."
 friendship.3004.desc:0 "Seria bem mais fácil se as pessoas em minha vida se dessem bem. Infelizmente, m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('spouse'))] [spouse.GetTitledFirstName] simplesmente não suporta [Select_CString( friend_being_disapproved.IsFemale, 'minha boa amiga', 'meu bom amigo' )] [friend_being_disapproved.GetTitledFirstName]."
 friendship.3004.t:0 "Aqueles que Escolhemos"
 friendship.3005.a:0 "Como você pôde fazer isso comigo, [spouse_suffering.GetFirstNameNoTooltip]?"
 friendship.3005.desc:0 "[Select_CString( spouse_suffering.IsFemale, 'Minha boa amiga', 'Meu bom amigo' )] - ou ex-amig[Select_CString( spouse_suffering.IsFemale, 'a', 'o' )] - [spouse_suffering.GetTitledFirstName] me informou que não sou mais bem-vindo à corte [spouse_suffering.GetHerHim]!\n\nNenhuma razão foi dada, mas eu sei que [Select_CString( spouse.IsFemale, 'sua', 'seu' )] [spouse.GetWifeHusband], [spouse.GetTitledFirstName], tem algo contra mim..."
 friendship.3005.t:0 "Escolha de Amigos"
 friendship.3006.a:0 "Obrigado, meu amigo!"
 friendship.3006.b:0 "Confio que você usará essa influência melhor do que eu, [friend_on_council.GetFirstNameNoTooltip]."
 friendship.3006.desc:0 "[Select_CString( friend_on_council.IsFemale, 'Minha boa amiga e conselheira', 'Meu bom amigo e conselheiro' )], [friend_on_council.GetTitledFirstName], tem uma dívida a receber d[Select_CString( hooked_councillor.IsFemale, 'a', 'o' )] [hooked_councillor.GetTitledFirstName]. [friend_on_council.GetSheHe|U] deixou claro para [Select_CString( hooked_councillor.IsFemale, 'a', 'o' )] [hooked_councillor.GetFirstNameNoTooltip] que ela deve ser retribuída de qualquer forma que eu pedir."
 friendship.3006.t:0 "Relações Favoráveis"
 friendship.3007.a:0 "Uma pequena pausa agradável."
 friendship.3007.b:0 "Passar tempo com [Select_CString( friend.IsFemale, 'a', 'o' )] [friend.GetFirstNameNoTooltip] sempre faz bem para mim."
 friendship.3007.benevolent:0 "\n\nCaminhamos juntos pela cidade, distribuindo moedas para os pobres e perdoando um audacioso ladrão de carteiras. Alguns atos de caridade e perdão podem realmente aliviar uma mente estressada."
 friendship.3007.c:0 "Eu não tinha percebido o quanto precisava disso."
 friendship.3007.d:0 "Eu esqueci completamente dos problemas do mundo por um tempo."
 friendship.3007.dominant:0 "\n\n[friend.GetSheHe|U] me arrastou para um lugar após o outro, e o ritmo acelerado realmente ajudou a tirar minha mente dos problemas."
 friendship.3007.emotional:0 "\n\n[friend.GetSheHe|U] me encorajou a jogar pratos e gritar em travesseiros, e depois da tempestade emocional, eu realmente me senti melhor."
 friendship.3007.end_chill:0 "\n\nDepois dessa curta pausa, eu estava novamente pronto para assumir minhas responsabilidades. Sou sortudo por ter um[Select_CString( friend.IsFemale, 'a', '' )] amig[Select_CString( friend.IsFemale, 'a', 'o' )] como [Select_CString( friend.IsFemale, 'a', 'o' )] [friend.GetTitledFirstName]!"
 friendship.3007.end_severe:0 "\n\nDepois dessa curta pausa, me senti mais tranquilo do que há muito tempo! Tenho a sorte de ter um[Select_CString( friend.IsFemale, 'a', '' )] amig[Select_CString( friend.IsFemale, 'a', 'o' )] como [Select_CString( friend.IsFemale, 'a', 'o' )] [friend.GetTitledFirstName]."
 friendship.3007.extroverted:0 "\n\nUma noite animada na cidade e muitos novos conhecidos realmente tiraram minha mente dos problemas!"
 friendship.3007.fallback:0 "\n\n[friend.GetSheHe|U] parece saber exatamente o que fazer para aliviar minha mente atribulada. Isso me ajudou muito quando [friend.GetSheHe] me convidou para sair no outro dia."
 friendship.3007.introverted:0 "\n\nRealmente aliviou minha mente ter uma noite tranquila em casa, bebendo vinho e conversando sobre nossos problemas."
 friendship.3007.levelheaded:0 "\n\n[friend.GetSheHe|U] me ouviu atentamente sobre todos os meus problemas, me ajudando a colocá-los em perspectiva, e depois de um tempo eu percebi que não era tão ruim quanto eu imaginava."
 friendship.3007.malicious:0 "\n\nPassamos uma noite incomodando os serviçais, pegando no pé deles por cada pequeno erro e reclamando de cada detalhe. Quem diria que atos mesquinhos de tormento realmente têm uma forma de aliviar uma mente atribulada!"
 friendship.3007.opening:0 "Há poucas coisas que aprecio mais do que a companhia d[Select_CString( friend.IsFemale, 'a', 'o' )] [friend.GetTitledFirstNamePossessive]."
 friendship.3007.submissive:0 "\n\nA companhia [friend.GetHerHim|U] em meu passeio pelo campo realmente aliviou minha mente atribulada, mesmo que eu tenha sido quem teve que tomar a iniciativa para a atividade."
 friendship.3007.t:0 "O Conforto de um Amigo"
 garden_stag_modifier:0 "Veado do Jardim"
 impromptu_venison_feast_modifier:0 "Banquete Improvisado de Carne de Veado"
 spouse_responds_tt:0 "[spouse_suffering.GetFirstName] pode abandonar seu amigo, ou não..."
