l_spanish:
 attempt_to_regain_affection_tt:0 "Devo tomar medidas drásticas para reconquistar o afeto [first_lover.GetHerHim]!"
 lover.0001.a:0 "Eu concordo, é hora de seguirmos caminhos separados."
 lover.0001.b.tt:0 "[lover.GetSheHe|U] dará outra chance ao nosso relacionamento"
 lover.0001.b:0 "Mas... Lembre-se de todos os bons momentos!"
 lover.0001.desc:0 "\"A chama entre nós, está... parece que se apagou.\""
 lover.0001.desc_murder:0 "\"A chama diminuindo entre nós... E pensar que você cometeria um assassinato... É demais!\""
 lover.0001.desc_opening:0 "\"Meu [ROOT.Char.Custom('LoverPetName')], isso... isso simplesmente não está funcionando mais!\"\n\nMeu amor [lover.GetTitledFirstName] se afasta de mim,"
 lover.0001.t:0 "O Fim da Paixão"
 lover.0002.a:0 "Mas por quê, meu amor..."
 lover.0002.b:0 "Não, eu preciso fazer alguma coisa!"
 lover.0002.c:0 "Isso pode ser para o melhor."
 lover.0002.d:0 "Finalmente! Louvado seja [ROOT.GetCharacter.GetFaith.FertilityGodName]!"
 lover.0002.dislike.angry:0 "Depois de assistir [Select_CString( first_lover.IsFemale, 'a', 'o' )] [first_lover.GetTitledFirstName] se contorcer e suar durante a maior parte de uma hora, não consegui mais conter minha raiva. Cada coisa maldosa que eu sempre quis dizer para ess[Select_CString( first_lover.IsFemale, 'a', 'e' )] [first_lover.GetWomanMan] miserável jorrou como lava de minha boca.\n\nA dor em seus olhos me fortaleceu, e quando [first_lover.GetSheHe] finalmente disse que terminamos, minha vitória foi completa."
 lover.0002.dislike.arrogant:0 "Mal conseguia me conter de tanto rir, tão absurdas eram as palavras d[Select_CString( first_lover.IsFemale, 'a', 'o' )] [first_lover.GetTitledFirstName]. Claro que [first_lover.GetSheHe] ainda me quer, sou tudo o que [first_lover.GetSheHe] sempre desejou! No entanto, não discuti - a perda é sua. Eu não poderia me importar menos."
 lover.0002.dislike.lustful:0 "Para minha surpresa, quando [Select_CString( first_lover.IsFemale, 'a', 'o' )] [first_lover.GetTitledFirstName] me disse que terminamos, meu primeiro sentimento foi de alívio. Finalmente pude admitir que [first_lover.GetSheHe] já não podia satisfazer meus desejos."
 lover.0002.dislike.paranoid:0 "Como [Select_CString( first_lover.IsFemale, 'a', 'o' )] [first_lover.GetTitledFirstName] me disse que não me queria mais, não foi surpresa. Eu sabia que isso estava acontecendo há muito tempo, embora [first_lover.GetSheHe] continuasse negando. Talvez [first_lover.GetSheHe] tenha prolongado tudo para me punir... Sim, tenho certeza de que ess[Select_CString( first_lover.IsFemale, 'a', 'e' )] [first_lover.GetWomanMan] vil se deleitou com o meu sofrimento!"
 lover.0002.dislike.understanding:0 "Qualquer que fosse o motivo pelo qual [Select_CString( first_lover.IsFemale, 'a', 'o' )] [first_lover.GetTitledFirstName] veio me ver, era óbvio que o afetava profundamente. Mesmo que meus sentimentos por [first_lover.GetSheHe] tivessem desaparecido, ainda me doeu vê-lo naquele estado.\n\nDepois de tranquilizá-lo de que tudo ficaria bem, [first_lover.GetSheHe] finalmente me disse que acabou entre nós."
 lover.0002.dislike.vengeful:0 "Enquanto desculpas patéticas saíam dos lábios d[Select_CString( first_lover.IsFemale, 'a', 'o' )] [first_lover.GetTitledFirstName], o desprezo gélido se espalhou no fundo do meu estômago, quebrando qualquer ternura restante que eu sentia por [first_lover.GetSheHe]. [first_lover.GetSheHe|U] vai se arrepender de me desprezar assim, pode anotar..."
 lover.0002.dislike:0 "[first_lover.GetTitledFirstName] se aproximou de mim, inseguro. Quando percebi que [first_lover.GetSheHe] estava lá para me dizer que não nos veríamos mais, não fiquei chateado. Apenas aliviado."
 lover.0002.e:0 "Nunca irei perdoar a traição [first_lover.GetHerHim]."
 lover.0002.hate:0 "[first_lover.GetTitledFirstName] se aproximou de mim, afirmando que tinha um assunto sério para discutir. Mesmo antes que [first_lover.GetSheHe] falasse, no entanto, soltei um desabafo sobre como [first_lover.GetSheHe] me decepcionou mais uma vez.\n\nFiquei quase feliz quando [first_lover.GetSheHe] disse que não queria mais me ver."
 lover.0002.like.angry:0 "Depois de assistir [Select_CString( first_lover.IsFemale, 'a', 'o' )] [first_lover.GetTitledFirstName] se contorcer e suar durante a maior parte de uma hora, sua confissão não me surpreendeu. No entanto, não esperava minha própria reação. Palavras vis derramaram-se como lava de minha boca, eu não conseguia detê-las, nem queria. Eu precisava ver minha própria dor refletida no rosto [first_lover.GetHerHim].\n\nA raiva me protegeu até [Select_CString( first_lover.IsFemale, 'a', 'o' )] [first_lover.GetFirstName] sair furiosamente da [ROOT.Char.Custom('GetRoom')]. Então, fiquei apenas com a dolorosa realidade do abandono."
 lover.0002.like.arrogant:0 "[first_lover.GetTitledFirstName]... não me quer mais? O que [first_lover.GetSheHe] disse não faz sentido. Pensei que [first_lover.GetSheHe] devia estar doente, ou talvez tenha sido forçado a pronunciar essas palavras bizarras. Eu sou... eu sou perfeito para [first_lover.GetSheHe]!"
 lover.0002.like.humble:0 "Embora a dor causada pelas palavras d[Select_CString( first_lover.IsFemale, 'a', 'o' )] [first_lover.GetTitledFirstName] fosse quase insuportável, não pude negar a verdade delas. Eu nunca fui bom o suficiente para [first_lover.GetSheHe]. Espero que [first_lover.GetSheHe|U] seja mais feliz sem mim..."
 lover.0002.like.lustful:0 "Eu sentia falta do toque das mãos ansiosas d[Select_CString( first_lover.IsFemale, 'a', 'o' )] [first_lover.GetTitledFirstName]. Sua chegada inesperada foi uma agradável surpresa. Mal podia esperar para me perder em seus abraços, mas quando tentei me aproximar, [first_lover.GetSheHe] resistiu.\n\nMal lembro das palavras que se seguiram, mas a dor lancinante que [first_lover.GetSheHe] deixou para trás ainda não desapareceu."
 lover.0002.like.paranoid:0 "Quando [Select_CString( first_lover.IsFemale, 'a', 'o' )] [first_lover.GetTitledFirstName] me disse que não me queria mais, isso não foi uma surpresa. Eu já tinha visto isso em seus olhos há muito tempo, sentido isso em suas hesitações em me tocar. Cada vez que perguntei, [first_lover.GetSheHe] negou, mas parece que [first_lover.GetSheHe] não conseguiu mais esconder. Ou talvez [first_lover.GetSheHe] simplesmente gostasse de me ver sofrer..."
 lover.0002.like.understanding:0 "Embora [Select_CString( first_lover.IsFemale, 'a', 'o' )] [first_lover.GetTitledFirstNamePossessive] lutasse para encontrar as palavras, eu o conhecia o suficiente para saber que seriam ruins. Contive minha tristeza, não querendo tornar as coisas ainda mais difíceis para [first_lover.GetSheHe], e apertei suavemente sua mão. Então, as palavras jorraram [first_lover.GetHerHim] como uma cachoeira e meu maior medo foi confirmado."
 lover.0002.like.vengeful:0 "Enquanto desculpas frágeis saíam dos lábios d[Select_CString( first_lover.IsFemale, 'a', 'o' )] [first_lover.GetTitledFirstName], o ódio começou a ferver no fundo do meu estômago, cada palavra alimentando o fogo. Então, eu não sou bom o suficiente para [first_lover.GetSheHe] agora, é isso? [first_lover.GetSheHe|U] vai se arrepender disso, pode anotar..."
 lover.0002.neutral:0 "\"Todas as coisas têm um fim\", [first_lover.GetTitledFirstName] me disse. Isso me enche de tristeza ao pensar em tudo que compartilhamos e em tudo que perdemos, mas no final, parece ser o melhor."
 lover.0002.still_in_love:0 "As palavras d[Select_CString( first_lover.IsFemale, 'a', 'o' )] [first_lover.GetTitledFirstName] ainda ecoam em meus ouvidos. Apesar do tom sombrio com o qual [first_lover.GetSheHe] me falou, não posso deixar de sentir que [first_lover.GetSheHe] estava tentando me ferir.\n\n\"Eu... mas eu te amo!\" Forçei a fala de minha garganta seca. Minhas súplicas não puderam mudar o coração [first_lover.GetHerHim]."
 lover.0002.still_likes:0 "As palavras d[Select_CString( first_lover.IsFemale, 'a', 'o' )] [first_lover.GetTitledFirstName] doeram, mas tentei engolir minha dor.\n\nSe é isso que [first_lover.GetSheHe] acha melhor para nós, não vou tornar as coisas mais difíceis para [first_lover.GetSheHe]."
 lover.0002.t:0 "O Fim da Paixão"
 lover.0003.desc.end1:0 "\n\nPor quanto tempo posso continuar assim? Esses "
 lover.0003.desc.end2men:0 "homens"
 lover.0003.desc.end2people:0 "indivíduos"
 lover.0003.desc.end2women:0 "mulheres"
 lover.0003.desc.end3:0 " serão o meu fim!"
 lover.0003.desc.intro:0 "Nunca imaginei que um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] pudesse ter excesso de [ROOT.Char.Custom('lover_reason')], mas a vida parece ter me provado o contrário. Alguns dias, sinto que todo o meu tempo livre é gasto com "
 lover.0003.desc.threelovers:0 "[lover_1.Custom('lover_activity')], [lover_2.Custom('lover_activity')] e [lover_3.Custom('lover_activity')]."
 lover.0003.desc.twolovers:0 "[lover_1.Custom('lover_activity')] e [lover_2.Custom('lover_activity')]."
 lover.0003.t:0 "Excesso de uma Coisa Boa"
 lover.0004.desc:0 "[first_lover.GetFirstName] e eu tivemos nossas dificuldades, não posso negar, mas a rejeição [first_lover.GetHerHim] veio como um choque. Embora não possa explicar o motivo, nunca pensei que terminaríamos assim.\n\nRaiva, indignação, arrependimento... apatia. As emoções inundam-me e fico atordoado, sem saber o que fazer ou sentir."
 lover.0004.t:0 "A Dor da Rejeição"
 lover.0005.desc:0 "Se eu disser que acreditei que [Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetFirstName] receberia bem minhas decisões, estaria mentindo, mas a reação [lover.GetHerHim] me surpreendeu. Sem lágrimas, súplicas ou insultos. Apenas os olhos d[Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetTitledFirstNamePossessive] traíram seus verdadeiros sentimentos, e o que vi me gelou até o âmago."
 lover.0005.t:0 "Inferno não tem Fúria"
 lover.0101.a:0 "A pessoa que amo não faria isso comigo!"
 lover.0101.b:0 "Isso é apenas mais um obstáculo para superarmos."
 lover.0101.desc_dungeon:0 "Mal consigo ver as grades devido ao véu de lágrimas que cobre meus olhos; por que m[Select_CString( lover.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] está fazendo isso comigo? [lover.GetTitledFirstName], meu [lover.Custom('LoverPetName')], por favor, deixe-me sair..."
 lover.0101.desc_house_arrest:0 "Embora eu caminhe pelos mesmos corredores que m[Select_CString( lover.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] [lover.GetTitledFirstName], nossos corações nunca estiveram tão distantes. Meu [lover.Custom('LoverPetName')], por favor, deixe-me sair..."
 lover.0101.t:0 "Capturad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por [lover.GetSheHe|U]"
 lover.0102.a:0 "O amor que [imprisoned_lover.GetSheHe] abrigava fugiu enquanto [imprisoned_lover.GetSheHe] pôde!"
 lover.0102.desc:0 "Quem poderia imaginar que chegaria a isso? M[Select_CString( imprisoned_lover.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('imprisoned_lover'))] [imprisoned_lover.GetTitledFirstName] repudia minha presença, e mesmo que [imprisoned_lover.GetSheHe] ainda esteja em minhas garras, seu afeto por mim se foi."
 lover.0102.t:0 "O Prisioneiro"
 lover.0103.a:0 "Nada vai me deter. Nem mesmo você, meu amor!"
 lover.0103.b.tt:0 "#F Não tomarei decisões precipitadas em meio a uma luta!#!"
 lover.0103.b:0 "Na guerra, a vida é o bem mais precioso, e o amor é ainda mais doce."
 lover.0103.desc:0 "Que m[Select_CString( lover.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('lover'))] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] [lover.GetTitledFirstName] declarasse guerra contra mim... Tudo o que compartilhamos — qualquer sentimento que eu tivesse por [lover.GetSheHe] – está sendo aos poucos apagado pelo som das trombetas de guerra."
 lover.0103.t:0 "Sentimentos em Guerra"
 lover.0104.a:0 "Tudo é justo no amor e na guerra."
 lover.0104.desc:0 "Desde que escolhi minha conquista pelo título de [war_title.GetName] em vez de m[Select_CString( war_lover.IsFemale, 'inha', 'eu' )] amante [war_lover.GetTitledFirstName], [war_lover.GetSheHe] se recusa até mesmo a olhar para mim, e temo que o que tínhamos tenha se perdido para sempre."
 lover.0201.a:0 "Não era assim que deveria ser."
 lover.0201.desc:0 "\"Estou tão feliz que você entenda por que tem que ser assim\", me diz meu amante.\n\nAh, [breaker.GetFirstName], como eu queria entender! Primeiro você sussurra todas aquelas palavras doces, mas agora você vai embora?"
 lover.0201.other_lover:0 "\n\nÉ por causa daquel[Select_CString( other_lover.IsFemale, 'a', 'e' )] [other_lover.Custom2('InsultNounSexual', ROOT.Char)], não é?!"
 lover.0201.t:0 "Fim de um Caso"
 lover.0202.a:0 "O que [breaker.GetSheHe] pensa que está fazendo?"
 lover.0202.desc:0 "Estou... confus[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. [Select_CString( breaker.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('breaker'))], [breaker.GetFirstName], diz que [breaker.GetSheHe] não deseja mais ser [Select_CString( breaker.IsFemale, 'minha', 'meu' )] amante. Nosso amor não é suficiente para manter a chama deste casamento acesa?"
 lover.0202.t:0 "[Select_CString( breaker.IsFemale, 'Minha Própria', 'Meu Próprio' )] [breaker.Custom('WifeHusband')]"
 lover.0203.a:0 "Sim, sim, é uma pena terrível. Vá embora agora."
 lover.0203.desc:0 "\"Não é você, sou eu...\" Na verdade, não estou prestando atenção enquanto [Select_CString( breaker.IsFemale, 'a', 'o' )] [breaker.GetFirstName] fala. Não há dúvida de que [breaker.GetSheHe] está aqui para acabar com nosso caso, mas tudo o que sinto é um alívio inundando-me."
 lover.0203.t:0 "Um Alívio"
 lover.0204.a:0 "[breaker.GetFirstNameNoTooltip] escolheu a mim. Supere isso."
 lover.0204.desc:0 "\"Como você se atreve! Como ousa terminar comigo, e por causa dess[Select_CString( other_lover.IsFemale, 'a', 'e' )] [other_lover.Custom2('InsultNounSexual', SCOPE.sC('lover'))], além disso!\"\n\nOs rumores se espalham rapidamente, e a reação dramática d[Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetFirstName] agora é reencenada na minha frente. Está claro que [lover.GetSheHe] nutre sentimentos negativos por mim, e pode buscar vingança, seja justificada ou não."
 lover.0204.t:0 "Inferno não tem Fúria"
 lover.0304.a:0 "Então é isso, então?"
 lover.0304.desc:0 "Nunca esperava que terminasse assim, mas aqui estamos. Sinto muito, mas amo outra pessoa. Não podemos mais ficar juntos.\n\nDesejo a você toda a felicidade do mundo. Que [ROOT.Char.GetFaith.HighGodName] cuide de você."
 lover.0304.opening:0 "M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] querid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetFirstNameNoTooltip],"
 lover.1001.a:0 "Isso é muito útil saber, [ROOT.GetCharacter.Custom('LoverPetName')]."
 lover.1001.desc:0 "M[Select_CString( snoopy_lover.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('snoopy_lover') )], [snoopy_lover.GetTitledFirstName], ouve muitas coisas durante suas idas e vindas na minha [ROOT.Char.Custom('GetCourt')].\n\nUltimamente, [snoopy_lover.GetSheHe] ouviu algumas histórias muito interessantes sobre o que m[Select_CString( secret_holder.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('secret_holder') )], [secret_holder.GetTitledFirstName], faz nas sombras..."
 lover.1001.t:0 "Rumor e Especulação"
 lover.1002.a:0 "Uma ótima ideia!"
 lover.1002.b:0 "Não posso me dar ao luxo de envolver [Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetFirstNameNoTooltip] nisso."
 lover.1002.desc:0 "[ROOT.GetCharacter.Custom('LoverPetName_possessive')|U], [lover.GetTitledFirstName], sabe muito sobre como navegar pelos muitos relacionamentos na minha [ROOT.Char.Custom('GetCourt')]. [lover.GetSheHe|U] sugere que [lover.GetSheHe] poderia utilizar sua experiência em minhas aproximações diplomáticas em relação [Select_CString( target.IsFemale, 'a', 'ao' )] [target.GetTitledFirstName]."
 lover.1002.t:0 "Manipule as Cordas"
 lover.1003.a:0 "O que faríamos um sem o outro, meu amor?"
 lover.1003.b:0 "É exatamente o que eu precisava!"
 lover.1003.desc:0 "O peso de ser um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] tem me sobrecarregado ultimamente, e apenas o caloroso abraço [Select_CString( lover.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('lover') )], [lover.GetTitledFirstName], parece aliviar o fardo.\n\n\"Por favor, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom('LoverPetName')], deixe-me ajudá-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a relaxar.\""
 lover.1003.t:0 "Conforto de Amante"
 lover.1004.a.tt:0 "#F Uma jornada romântica... Quem sabe o que pode acontecer?#!"
 lover.1004.a:0 "Ouvi dizer que [county.GetNameNoTierNoTooltip] é lindo nesta época do ano."
 lover.1004.b:0 "O quarto é um destino emocionante o suficiente!"
 lover.1004.desc:0 "[lover.GetTitledFirstName], m[Select_CString( lover.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('lover') )], sorri [lover.Custom('quirk_pos_adverb')] enquanto [lover.GetSheHe] me abraça, e sou lembrado mais uma vez do motivo pelo qual considero [lover.GetSheHe] tão querido.\n\nComo seria bom sair juntos por um tempo, apenas nós dois..."
 lover.1004.t:0 "Vamos Embora"
 lover.1005.a.tt:0 "#F Minha ausência pode ser notada#!"
 lover.1005.a:0 "Seu quarto mais privado por uma semana!"
 lover.1005.b:0 "Vamos aproveitar ao máximo uma noite."
 lover.1005.c:0 "Hm, esta estalagem — esta vila inteira — poderia certamente usar uma melhoria..."
 lover.1005.desc:0 "Ao ver o sorriso nos lábios d[Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetTitledFirstNamePossessive] e o entusiasmo em seus olhos, estou mais do que feliz em concordar e encontrar hospedagem em uma estalagem em [county.GetNameNoTier]."
 lover.1005.desc_object_of_importance:0 "Ao ver o sorriso nos lábios d[Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetTitledFirstNamePossessive] e o entusiasmo em seus olhos, estou mais do que feliz em concordar e encontrar hospedagem em uma estalagem em [county.GetNameNoTier] – uma estalagem adornada com [ROOT.Char.Custom2('LoverSeductionObjectIndefinite', SCOPE.sC('lover'))]."
 lover.1005.desc_opening_other_court:0 "\"Oh, [ROOT.Char.GetFirstNameNoTooltip]! Nos encontrarmos assim, longe de ambas as nossas cortes... Isso é como um sonho.\"\n\n"
 lover.1005.desc_opening_same_court:0 "\"Oh, [ROOT.Char.GetFirstNameNoTooltip]! Escapar da corte, mesmo que por um curto período de tempo... Isso é como um sonho.\"\n\n"
 lover.1006.a:0 "Claro que vou ajudar você, [lover.GetFirstNameNoTooltip]!"
 lover.1006.b:0 "Não tenho tempo para servir em um conselho."
 lover.1006.desc_chancellor:0 "Suas habilidades em questões diplomáticas são amplamente conhecidas,"
 lover.1006.desc_court_chaplain:0 "Suas habilidades em questões teológicas são amplamente conhecidas,"
 lover.1006.desc_end:0 "e eu acho que você seria o candidato perfeito para uma posição em meu conselho."
 lover.1006.desc_kurultai:0 "Suas habilidades em questões de pastoreio são amplamente conhecidas,"
 lover.1006.desc_marshal:0 "Suas habilidades em questões militares são amplamente conhecidas,"
 lover.1006.desc_opening:0 "Eu imploro para que você empreste seus talentos a mim!"
 lover.1006.desc_spymaster:0 "Suas habilidades em #EMP assuntos delicados#! são amplamente conhecidas,"
 lover.1006.desc_steward:0 "Suas habilidades em questões administrativas são amplamente conhecidas,"
 lover.1006.opening:0 "[lover.Custom2('AppropriateGreeting', ROOT.Char)]"
 lover.1007.a:0 "Você é bom demais para mim, [lover.GetFirstNameNoTooltip]!"
 lover.1007.b:0 "Apenas #EMP algumas#! mudanças, m[Select_CString( lover.IsFemale, 'inha', 'eu' )] querid[Select_CString( lover.IsFemale, 'a', 'o' )]?"
 lover.1007.b_1:0 "Fico ainda melhor!"
 lover.1007.b_2:0 "[lover.GetFirstNameNoTooltip] não aprecia minha ganância"
 lover.1007.desc:0 "\"Meu [ROOT.Char.Custom('LoverPetName')], você merece as estrelas.\" M[Select_CString( lover.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] [lover.GetTitledFirstName] passa a mão pelas minhas costas enquanto estamos deitados lado a lado na cama [lover.GetHerHim]. \"Infelizmente, só posso te conceder coisas mundanas... Amanhã, farei algumas alterações nos termos de sua vassalagem.\""
 lover.1007.t:0 "O Vassalo e Senhor Feudal [ROOT.Char.GetHerHim|U]"
 lover.1008.a:0 "Se afastem! [lover.GetSheHe|U] está aqui para me ver!"
 lover.1008.b:0 "A opinião [lover.GetHerHim|U] sobre esses assuntos seria útil..."
 lover.1008.desc:0 "Quando vou dar as boas-vindas [Select_CString( lover.IsFemale, 'a minha', 'ao meu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] [lover.GetTitledFirstName] em [capital.GetNameNoTier], [lover.GetSheHe] já está cercad[Select_CString( lover.IsFemale, 'a', 'o' )] por dignitários e oficiais, clamando por sua ajuda e opinião."
 lover.1008.t:0 "A Chegada do [lover.GetTitleTierName]"
 lover.2001.a:0 "Ninguém sabe. Certamente, ninguém sabe."
 lover.2001.desc:0 "Passo muito tempo pensando em quem pode ter descoberto sobre meu relacionamento com [Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetTitledFirstName].\n\nMeu coração bate rápido enquanto comentários inocentes se tornam carregados de significado. Tento dizer a mim mesm[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] que é tudo coisa da minha cabeça."
 lover.2001.t:0 "A Pressão do Segredo"
 lover.2002.a:0 "Não, [ROOT.GetCharacter.Custom('LoverPetName')], não é que eu não me importe!"
 lover.2002.desc:0 "Eu sou muito apaixonad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por [lover.GetSheHe], mas [Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetTitledFirstName] requer tanta atenção e cuidado, o que é difícil em um momento como este!\n[lover.GetSheHe|U] sabe o quão importante são meus deveres como [ROOT.Char.GetTitleAsNameNoTooltip], então é claro que não posso passar todas as horas restantes com [lover.GetSheHe]!"
 lover.2002.secret:0 "\n\nSimplesmente manter nosso caso em segredo é uma tarefa imensa!"
 lover.2002.t:0 "O Fardo do Amor"
 lover.2003.a:0 "Eu mereço algo melhor do que isso."
 lover.2003.desc:0 "[first_lover.GetSheHe|U] culpa todos os seus deveres como [first_lover.GetTitleAsNameNoTooltip], mas parece que [Select_CString( first_lover.IsFemale, 'a', 'o' )] [first_lover.GetTitledFirstName] nem sequer me olha do jeito que costumava.\n\nSerá que é pedir muito que alguém que diz te amar dedique pelo menos um momento de sua companhia?"
 lover.2003.t:0 "O \"Fardo\" do Amor"
 lover.2004.a.tt:0 "Você confronta [lover.GetShortUIName]"
 lover.2004.a:0 "Não vou aceitar isso — prometemos nunca amar outro alguém!"
 lover.2004.b.tt:0 "#F Meu amado não mentiria para mim!#!"
 lover.2004.b:0 "Eu confio n[lover.GetSheHe]."
 lover.2004.desc:0 "M[Select_CString( lover.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] [lover.GetTitledFirstName] insiste que seu casamento com [Select_CString( lovers_lover.IsFemale, 'a', 'o' )] [lovers_lover.GetTitledFirstName] é apenas uma necessidade política, mas alguns dos sorrisos que [lover.GetSheHe] direciona a s[Select_CString( lovers_lover.IsFemale, 'ua', 'eu' )] [lover.Custom2('RelationToMe',SCOPE.sC('lovers_lover'))] me fazem questionar..."
 lover.2004.t:0 "Promessa Quebrada"
 lover.2005.a:0 "Não se preocupe, meu amor, você é o único para mim!"
 lover.2005.b:0 "Você não tem voz ativa em meu casamento."
 lover.2005.desc:0 "\"Meu [ROOT.Char.Custom('LoverPetName')], será que os olhares carinhosos que vi entre [Select_CString( lovers_lover.IsFemale, 'a', 'o' )] [lovers_lover.GetTitledFirstName] e você são apenas um mal-entendido?\"\n\nM[Select_CString( original_lover.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('original_lover'))] [original_lover.GetTitledFirstName] tem se preocupado com a promessa de devoção pessoal que fizemos um ao outro desde que me casei..."
 lover.3002.a:0 "A única verdade é a poesia!"
 lover.3002.a_bad:0 "Uma carta de amor ruim"
 lover.3002.a_beautiful:0 "Uma bela carta de amor"
 lover.3002.a_competent:0 "Uma carta de amor competente"
 lover.3002.a_good:0 "Uma boa carta de amor"
 lover.3002.b:0 "Isso está muito mais difícil do que eu esperava..."
 lover.3002.desc:0 "Meus sentimentos [Select_CString( lover.IsFemale, 'pela', 'pelo' )] [lover.GetFirstName] estão quase explodindo em meu peito! Eu tenho uma necessidade desesperada de fazer [lover.GetSheHe] saber como me sinto!\n\nAmor, guie minha mão enquanto coloco a tinta no papel!"
 lover.3002.t:0 "Dizer com Palavras"
 lover.3003.a:0 "Essa pode ser a pior poesia que já ouvi!"
 lover.3003.desc:0 "Recebi uma carta d[Select_CString( first_lover.IsFemale, 'a', 'o' )] [first_lover.GetTitledFirstName]!\n\n[first_lover.Custom2('love_letter', ROOT.Char)]"
 lover.3003.desc_conclusion:0 "\n\nO que... é isso?"
 lover.3004.a:0 "Ela é realmente tão ruim assim?"
 lover.3004.desc:0 "Minha carta parece ter sido mal recebida. Deixe-me dar outra olhada nela...\n\n[first_lover.Custom2('love_letter', SCOPE.sC('lover'))]"
 lover.3005.a:0 "Pelo menos [first_lover.GetSheHe] está pensando em mim."
 lover.3005.desc_conclusion:0 "\n\nIsso é... agradável."
 lover.3006.a:0 "Bem, é o pensamento que conta!"
 lover.3006.desc:0 "Minha carta parece ter sido bem recebida, mesmo que tenha sido descrita como uma \"tentativa simples de poesia\":\n\n[first_lover.Custom2('love_letter', SCOPE.sC('lover'))]"
 lover.3007.a:0 "Oh, que emocionante!"
 lover.3007.desc_conclusion:0 "\n\nUm poema, só para mim!"
 lover.3008.a:0 "Minha língua afiada resolve a situação!"
 lover.3008.desc:0 "Minha carta foi bem recebida! [lover.GetTitledFirstName] parece ter recitado-a para várias pessoas.\n\n[first_lover.Custom2('love_letter', SCOPE.sC('lover'))]"
 lover.3009.a:0 "Vou guardar estas palavras em meu coração!"
 lover.3009.desc_conclusion:0 "\n\nÉ verdadeiramente bela. E escrita inteiramente para mim!"
 lover.3010.a:0 "Talvez devesse ter sido poeta, em vez d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]!"
 lover.3010.desc:0 "[lover.GetTitledFirstName] respondeu minha carta, dizendo que foi uma das coisas mais bonitas que [lover.GetSheHe] já ouviu! Olhando para ela, não posso dizer que estou surpreso:\n\n[first_lover.Custom2('love_letter', SCOPE.sC('lover'))]"
 lover.3103.a:0 "[lover.GetSheHe|U] me escolheu no final — isso é tudo o que importa."
 lover.3103.desc_married:0 "Mesmo que [Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetFirstName] seja [Select_CString( lover.IsFemale, 'a', 'o' )] [lover.Custom('WifeHusband')] daquel[Select_CString( lovers_lover.IsFemale, 'a', 'e' )] [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('lovers_lover'))] [lovers_lover.GetTitledFirstName], [lover.GetSheHe] me assegura que me ama apenas a mim.\n\n\"[lover.Custom('LoverPetName')|U], você não tem com que se preocupar. Você é meu mundo inteiro; nunca poderia amar outro alguém.\""
 lover.3104.a.tt:0 "#F Entre outros...#!"
 lover.3104.a:0 "Pelo menos [lovers_lover.GetSheHe] ainda me quer..."
 lover.3104.b:0 "Então eu vou acabar com isso!"
 lover.3104.desc_ending:0 "\n\nAs palavras d[Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetTitledFirstNamePossessive] machucam mais do que o próprio casamento; pensar que [lover.GetSheHe] me recusaria assim!"
 lover.3104.desc_married:0 "\"Não posso deixar [lovers_lover.GetSheHe] – [lovers_lover.GetSheHe] é [Select_CString( lovers_lover.IsFemale, 'minha', 'meu' )] [lovers_lover.Custom('WifeHusband')]! E mesmo se pudesse... [lovers_lover.GetSheHe] é tão querid[Select_CString( lovers_lover.IsFemale, 'a', 'o' )] para mim quanto você, [Select_CString( lover.IsFemale, 'minha', 'meu' )] [lover.Custom('LoverPetName')].\""
 lover.3105.a:0 "Pelo menos ainda tenho [Select_CString( lovers_lover.IsFemale, 'a', 'o' )] [lovers_lover.GetFirstNameNoTooltip]!"
 lover.3105.desc:0 "\"Que você me traia assim, [ROOT.Char.GetFirstNameNoTooltip]... Eu nunca deveria ter deixado alguém tão [ROOT.Char.Custom2('InsultNounSexual', SCOPE.sC('lover'))] em minha cama.\"\n\nPensar que m[Select_CString( discoverer.IsFemale, 'inha', 'eu' )] [discoverer.Custom('LoverPetName')], m[Select_CString( discoverer.IsFemale, 'inha', 'eu' )] [discoverer.GetFirstName], me deixaria por causa de um pequeno deslize!"
 lover.3105.t:0 "Uma Cama Tamanho [ROOT.Char.GetTitleTierName]"
 lover.3111.a.failure:0 "Minha sugestão deixa [lover.GetShortUIName] desconfortável"
 lover.3111.a.success:0 "[lover.GetShortUIName|U] concorda em ser exclusiv[Select_CString( lover.IsFemale, 'a', 'o' )]"
 lover.3111.a.tt:0 "#F Vou propor que juremos devoção apenas um ao outro#!"
 lover.3111.a:0 "Vamos prometer nunca amar outro!"
 lover.3111.b:0 "Ter [lover.GetSheHe] assim é tudo que preciso. Torne-se m[Select_CString( lover.IsFemale, 'inha', 'eu' )] novamente!"
 lover.3111.desc:0 "M[Select_CString( lover.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] [lover.GetTitledFirstName] me segura em seus braços, e sinto uma felicidade rara. Imagine se isso pudesse durar para sempre — se [lover.GetSheHe] pudesse ser eternamente meu, e de mais ninguém..."
 lover.3111.t:0 "Meu Único e Verdadeiro Amor"
 lover.3112.a:0 "Eu não preciso de mais ninguém além de você!"
 lover.3112.b.remain_together.tt:0 "[THIS.Char.GetShortUIName] continua sendo seu [lover|E]"
 lover.3112.b.tt:0 "#F Que mal pode fazer uma mentira alimentada pelo amor?#!"
 lover.3112.b:0 "Claro, eu #EMP com certeza#! não terei outros."
 lover.3112.c:0 "Você não pode estar falando sério?!"
 lover.3112.desc:0 "\"Nunca desejarei ninguém além de você, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom('LoverPetName')].\"\n\n[proposing_lover.GetTitledFirstName] me abraça, sua respiração em meu pescoço, enquanto [proposing_lover.GetSheHe] faz um pedido: para nunca ter outro amante além [proposing_lover.GetHerHim]."
 lover.3113.a.tt:0 "#F Nunca amarei outro como amo [Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetFirstNameNoTooltip]!#!"
 lover.3113.a:0 "Ninguém mais importa além de você!"
 lover.3113.desc:0 "\"Sim, claro que quero ser apenas sua, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom('LoverPetName')]!\"\n\nMeu coração se enche de carinho e desejo, e eu abraço [Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetTitledFirstName] e a beijo profundamente."
 lover.3114.a:0 "Como pude interpretá-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] tão mal?"
 lover.3114.desc:0 "\"Gosto muito de você, [ROOT.Char.GetFirstNameNoTooltip], mas não estou pront[Select_CString( lover.IsFemale, 'a', 'o' )] para me comprometer com você.\"\n\n[lover.GetTitledFirstName] [lover.Custom('quirk_neg_present')] enquanto caímos em um silêncio constrangedor."
 lover.3201.a:0 "Realmente é. Por favor, embrulhe bem."
 lover.3201.b:0 "De fato, é. Vou levar dez!"
 lover.3201.c.tt:0 "#F Tenho certeza de que encontrarei outra maneira de mostrar a [lover.GetSheHe] o quanto eu a amo!#!"
 lover.3201.c:0 "Isso é lixo? Me poupe."
 lover.3201.desc:0 "Olhando para [Select_CString( lover.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('LoverSeductionObject', SCOPE.sC('lover'))] com formato perfeito e imaginando o sorriso d[Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetTitledFirstNamePossessive], mal posso conter minha alegria.\n\n\"É requintado. Você não concorda, [ROOT.Char.Custom('FormOfAddressForLiege')]?\" O velho mercador aponta para o [ROOT.Char.Custom2('LoverSeductionObject', SCOPE.sC('lover'))] com um piscar de olhos. \"O presente perfeito para alguém amado.\""
 lover.3201.t:0 "O Presente Perfeito"
 lover.3202.a.tt:0 "#F E minha #EMP gratidão#! é algo que [original_lover.GetSheHe] com certeza apreciará#!"
 lover.3202.a:0 "Devo lembrar de agradecer a [original_lover.GetSheHe] por este presente!"
 lover.3202.desc_ending:0 "\n\nOh [original_lover.GetTitledFirstName], meu [original_lover.Custom('LoverPetName')], um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] não poderia desejar um[Select_CString( original_lover.IsFemale, 'a', '' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('original_lover'))] melhor!"
 lover.3202.desc_exquisite_gift:0 "Dez [ROOT.Char.Custom2('LoverSeductionObjectMultiple', SCOPE.sC('original_lover'))] arranjados na minha cama — um mistério que só pode ser resolvido pelo meu coração."
 lover.3202.desc_ordinary_gift:0 "[ROOT.Char.Custom2('LoverSeductionObjectIndefinite', SCOPE.sC('original_lover'))|U] descansando no meu travesseiro — um mistério que só pode ser resolvido pelo meu coração."
 lover.3203.a_beloved:0 "Vou me encontrar com m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('spouse'))], pois meu coração assim me diz!"
 lover.3203.a_not_beloved:0 "Vou me encontrar com m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('spouse'))], como é adequado."
 lover.3203.b.failure:0 "Fui descobert[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]"
 lover.3203.b.success:0 "Me afasto sem ser notad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]"
 lover.3203.b.tt_safe:0 "[spouse.GetFirstNameNoTooltip] não faz ideia."
 lover.3203.b:0 "Estou indo, [lover.GetFirstNameNoTooltip]!"
 lover.3203.c:0 "Sou mais forte do que esses impulsos!"
 lover.3203.desc:0 "Um dia produtivo deveria terminar com um bom momento. Pensar que sou abençoad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] o suficiente para ter acesso aos aposentos d[Select_CString( lover.IsFemale, 'a', 'o' )] [lover.Custom('ComplimentAdjective')] [lover.GetTitledFirstName] e [Select_CString( spouse.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('spouse'))] [spouse.GetTitledFirstName]!"
 lover.3203.t:0 "Meu Amado"
 lover.3204.a.tt:0 "#F Não tomarei nenhuma ação, o que quer que aconteça estava destinado a acontecer#!"
 lover.3204.a:0 "Tudo acontece conforme a vontade do [ROOT.Char.GetFaith.HighGodName]."
 lover.3204.b:0 "De que adianta estarmos separados assim?"
 lover.3204.desc:0 "A cada dia que passa, sinto a distância para m[Select_CString( lover.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] [lover.GetTitledFirstName] de forma mais aguda. Se ao menos pudesse ver o [lover.Custom('quirk_pos_adjective')] sorriso [lover.GetHerHim], sentir seu calor contra mim, provar o que [lover.GetSheHe] tem a oferecer...\n\nCom meu desejo queimando tão intensamente, é exaustivo ficar separado assim."
 lover.3204.t:0 "Anseio Distante"
 lover.3205.a.tt:0 "#F [original_lover.GetSheHe|U] parte meu coração com uma carta #EMP assim?!?!#!"
 lover.3205.a:0 "Então é assim que termina..."
 lover.3205.desc:0 "M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom('LoverPetName')], [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitledFirstName].\n\nTemo que essa distância que me impede de estar em seus braços tenha tomado conta de mim. Perdoe-me, meu amor, e saiba que ainda anseio por sua doçura e seu calor, mesmo que eu precise dar fim ao que tivemos."
 lover.3205.opening:0 "[original_lover.Custom2('AppropriateGreeting', ROOT.Char)]"
 lover.3206.a:0 "Tudo é justo no amor e na guerra — não há nada que eu possa fazer."
 lover.3206.b.tt:0 "#F Farei o que for preciso para manter m[Select_CString( lover.IsFemale, 'inha', 'eu' )] [lover.GetFirstNameNoTooltip] segur[Select_CString( lover.IsFemale, 'a', 'o' )]!#!"
 lover.3206.b:0 "Vou dificultar os esforços d[Select_CString( attacker.IsFemale, 'a', 'o' )] [attacker.GetFirstNamePossessiveNoTooltip]!"
 lover.3206.desc:0 "Oh [lover.GetTitledFirstName], meu amor, sobreviveremos ambos a essa guerra?\n\nQue m[Select_CString( attacker.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('attacker'))] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('attacker'))] [attacker.GetTitledFirstName] me chame para a guerra é uma coisa, mas me fazer erguer armas contra [Select_CString( lover.IsFemale, 'minha amada', 'meu amado' )]..."
 lover.3206.t:0 "Através do Campo de Batalha"
 lover.3207.a.tt:0 "Se [Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetFirstNameNoTooltip] apreciar o poema:"
 lover.3207.a:0 "Compondrei um poema que capture meus sentimentos por [lover.GetSheHe]!"
 lover.3207.a_object:0 "Um poema e [ROOT.Char.Custom2('LoverSeductionObjectIndefinite', SCOPE.sC('lover'))], para transmitir meus sentimentos!"
 lover.3207.c.tt:0 "#F Claro que [lover.GetSheHe] sabe...!#!"
 lover.3207.c:0 "[lover.GetSheHe|U] já sabe o que significa para mim!"
 lover.3207.desc:0 "Mesmo que esteja longe [Select_CString( lover.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] [lover.GetTitledFirstName], nossos corações estão unidos. Se eu relembrar a [lover.GetSheHe] meus sentimentos, talvez isso traga o [lover.Custom('quirk_pos_adjective')] sorriso que tanto adoro para o rosto [lover.GetHerHim]..."
 lover.3207.t:0 "Amor à Distância"
 lover.3208.a:0 "Isso é tão doce!"
 lover.3208.a_amazing:0 "#F Ler esse poema me faz me apaixonar por [writing_lover.GetSheHe] novamente!#!"
 lover.3208.a_great:0 "#F [writing_lover.GetSheHe|U] consegue até escrever poemas eloquentes!#!"
 lover.3208.a_okay:0 "#F Mesmo que os poemas [writing_lover.GetHerHim] precisem melhorar...#!"
 lover.3208.a_terrible:0 "#F Eu sei que [writing_lover.GetSheHe] queria o melhor, mas aquele #EMP poema#!...#!"
 lover.3208.b:0 "Isso é a coisa mais boba que já li!"
 lover.3208.desc_object:0 "Este [ROOT.Char.Custom2('LoverSeductionObject', SCOPE.sC('writing_lover'))] é apenas um lembrete do meu desejo e devoção\n"
 lover.3208.opening:0 "[writing_lover.Custom2('AppropriateGreeting', ROOT.Char)]"
 lover.3209.a:0 "Oh [lover.GetFirstNameNoTooltip], como sinto sua falta!"
 lover.3209.desc:0 "O poema que você me enviou iluminou meu dia e meu desejo por você; saber que você também está pensando em mim é a única coisa que torna tudo suportável."
 lover.3209.opening:0 "[lover.Custom2('AppropriateGreeting', ROOT.Char)]"
 lover.3210.a:0 "Talvez eu não seja tão bom poeta afinal..."
 lover.3210.desc:0 "Por favor, não me envie tamanha baboseira novamente. Ainda penso com carinho em você apesar da distância que nos separa e gostaria de manter assim."
 lover.3211.a.tt:0 "#F Tenho certeza de que [lover.GetSheHe] entenderá as insinuações sutis!#!"
 lover.3211.a:0 "A escuridão de uma ruela antes do amanhecer, cheia de simbolismo!"
 lover.3211.appreciate:0 "Se [Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetFirstNameNoTooltip] apreciar o gesto:"
 lover.3211.b.tt:0 "#F Espero que [lover.GetSheHe] aprecie o simbolismo religioso!#!"
 lover.3211.b:0 "Abraão e Sara, lado a lado."
 lover.3211.c.tt:0 "#F Nada fala de amor como lutar pelo que se tem caro!#!"
 lover.3211.c:0 "Para retratar meu ardente desejo — uma batalha dramática!"
 lover.3211.d.tt:0 "#F [lover.GetSheHe|U] com certeza apreciará a cena animada, cheia de oportunidades.#!"
 lover.3211.d:0 "Um mercado movimentado é o tema perfeito!"
 lover.3211.desc:0 "Um talentoso pintor chegou a [capital.GetNameNoTier], e meus pensamentos imediatamente foram para m[Select_CString( lover.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] [lover.GetTitledFirstName] quando vi as belas obras de arte.\n\nUm quadro seria um presente adorável, se eu pudesse decidir sobre o assunto perfeito para representar..."
 lover.3211.e.tt:0 "#F Que melhor forma de honrar nosso amor do que retratar uma das primeiras discussões registradas sobre o assunto?#!"
 lover.3211.e:0 "Um quadro retratando o diálogo entre Sócrates e Fedro!"
 lover.3211.f:0 "Não tenho tempo para tais indulgências."
 lover.3211.t:0 "Representar o Amor"
 lover.3212.a.perfect:0 "#F Nunca antes vi um quadro que fala tão profundamente comigo!#!"
 lover.3212.a:0 "É adorável!"
 lover.3212.b:0 "Este quadro é horrível, jogue-o fora!"
 lover.3212.desc_lifestyle_administrator:0 "O quadro retrata um mercado movimentado, cheio de pessoas e mercadorias, assim como estou cheio de afeição por você. Que a imagem lembre você das muitas oportunidades que enfrentamos todos os dias, assim como meus sentimentos!"
 lover.3212.desc_lifestyle_diplomat:0 "O quadro é uma interpretação do diálogo entre Sócrates e Fedro, discutindo sobre o amor e a retórica, inspirado no amor que sinto por você."
 lover.3212.desc_lifestyle_general:0 "O quadro retrata uma batalha magnífica; heróis gloriosos triunfando sobre o mal. Assim como o quadro é suficiente para me deixar empolgad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], assim também é a mera menção do seu nome, [Select_CString( ROOT.Char.IsFemale, 'minha querida', 'meu querido' )] [ROOT.Char.GetFirstNameNoTooltip]!"
 lover.3212.desc_lifestyle_schemer:0 "O quadro retrata uma ruela sombria em [capital.GetNameNoTier] antes do amanhecer, mas deixarei o simbolismo e as insinuações ocultas na escuridão para que você possa descobrir por si mesmo."
 lover.3212.desc_lifestyle_scholar:0 "O quadro retrata Abraão e Sara lado a lado, unidos como estamos, prontos para enfrentar o futuro juntos. É minha esperança que você aprecie o significado simbólico do quadro."
 lover.3212.desc_opening:0 "Um presente para m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom('LoverPetName')] [ROOT.Char.GetFirstNameNoTooltip],\n\n"
 lover.3213.a:0 "Fico feliz que [lover.GetSheHe] tenha apreciado o presente!"
 lover.3213.desc:0 "O quadro que você me enviou é muito apreciado. O pensamento e talento que nele foram colocados são evidentes,"
 lover.3213.desc_lifestyle_administrator:0 "e o movimentado mercado, cheio de pessoas e oportunidades, pareceu tão vivo!"
 lover.3213.desc_lifestyle_diplomat:0 "e ver o famoso diálogo retratado dessa forma é verdadeiramente inspirador!"
 lover.3213.desc_lifestyle_general:0 "e a batalha retratada realmente me animou, mal posso esperar para te ver, meu amor!"
 lover.3213.desc_lifestyle_schemer:0 "e os detalhes sutis e simbolismos ocultos nos cantos mais escuros da ruela realmente aludem a um significado mais profundo!"
 lover.3213.desc_lifestyle_scholar:0 "e a escolha de Abraão e Sara como motivo foi um golpe de gênio!"
 lover.3213.desc_perfect:0 "Nunca antes vi uma obra de arte como o quadro que você me enviou. Ele me comoveu profundamente,"
 lover.3214.a:0 "Ahaha... sim. Uma piada."
 lover.3214.desc:0 "Agradeço o gesto, mas os quadros que você me enviou estão entre as peças de arte mais horríveis que já vi. Foi uma piada?"
 lover.3215.a.tt:0 "Um [lover.Custom('MusicalPerformer')] a meu serviço se juntará à [THIS.Char.Custom('GetCourt')] em [court_location.GetNameNoTier]"
 lover.3215.a:0 "Enviarei o melhor, imediatamente!"
 lover.3215.b:0 "Qualquer pessoa serve, certo?"
 lover.3215.c.tt:0 "#F Tenho certeza de que terei outras oportunidades, mais pessoais!#!"
 lover.3215.c:0 "Não vou depender de um menestrel para cortejar por mim."
 lover.3215.desc:0 "Já que não posso estar ao lado [Select_CString( lover.IsFemale, 'da minha amada', 'do meu amado' )] [lover.GetTitledFirstNamePossessive], temo que [lover.GetSheHe] possa esquecer o quão forte são meus sentimentos por [lover.GetSheHe].\n\nEnviar um [lover.Custom('MusicalPerformer')] como meu avatar na arte do amor, cortejando [lover.GetSheHe] com poemas, canções e palavras doces escritas em meu nome, certamente lembraria [lover.GetHerHim]!"
 lover.3215.t:0 "Cante os Louvores"
 lover.3216.a:0 "Que delícia!"
 lover.3216.b:0 "Por que [original_lover.GetSheHe] enviaria outra pessoa para cortejar em seu lugar?!"
 lover.3216.desc:0 "Um [lover.Custom('MusicalPerformer')] chegou à corte, oficialmente para entreter e divertir, mas logo se aproxima de mim para revelar o verdadeiro motivo de sua visita."
 lover.3216.desc_ending:0 "\n\n\"[original_lover.GetTitledFirstName] me enviou, para assegurar-lhe de seu amor e para me apresentar, [ROOT.Char.Custom('FormOfAddressForLiege')].\""
 lover.3216.desc_fancy_troubadour:0 "Um [lover.Custom('MusicalPerformer')] chegou à corte, cantando com uma voz digna dos deuses e declamando prosas fluidas como um rio. Logo se aproxima de mim para revelar o verdadeiro motivo de sua visita."
 lover.3217.a:0 "Fico feliz!"
 lover.3217.desc:0 "O [lover.Custom('MusicalPerformer')] que você enviou tem sido uma verdadeira delícia! Ele canta como um pássaro e suas prosas fluem como se tivesse nascido com uma pena na mão. A cada dia sou lembrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] de seu amor, e minha vida é mais rica por isso!"
 lover.3218.a:0 "Eu #EMP sabia#! Não deveria ter escolhido o menestrel de rua!"
 lover.3218.desc:0 "Você está me zombando, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom('LoverPetName')]? O [lover.Custom('MusicalPerformer')] que você enviou mal consegue manter uma nota, e tenho apreciado prosas destinadas a crianças com mais substância."
 lover.3219.a.tt:0 "#F [lover.GetSheHe|U] também deve sentir minha falta terrivelmente.#!"
 lover.3219.a:0 "[lover.GetSheHe|U] receberá um tufo de meus cabelos."
 lover.3219.b.tt:0 "#F Com certeza [lover.GetSheHe] apreciará o gesto ousado.#!"
 lover.3219.b:0 "Enviarei a [lover.GetSheHe] algumas de minhas roupas íntimas!"
 lover.3219.c.tt:0 "#F Eu sei como [lover.GetSheHe] pode ser romântic[Select_CString( lover.IsFemale, 'a', 'o' )].#!"
 lover.3219.c:0 "Enviarei [lover.Custom2('LoverSeductionObjectIndefinite', ROOT.Char)], por causa dos velhos tempos."
 lover.3219.d.tt:0 "#F Encontrarei uma oportunidade melhor para mostrar a [lover.GetSheHe] o quanto sinto falta.#!"
 lover.3219.d:0 "Não tenho tempo para presentes sem sentido."
 lover.3219.desc:0 "M[Select_CString( lover.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] [lover.GetTitledFirstName] vive tão longe do meu abraço... Se [lover.GetSheHe] tivesse algo para lembrar de mim, algo pessoal, eu ficaria mais tranquil[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 lover.3219.t:0 "Lembrança Pessoal"
 lover.3220.a:0 "Este é um presente tão adorável!"
 lover.3220.b.tt_smallclothes:0 "#F Eca. Só eca.#!"
 lover.3220.b:0 "O que eu devo fazer com isso?"
 lover.3220.desc_hair:0 "Para lembrá-l[Select_CString( lover.IsFemale, 'a', 'o' )] do meu amor quando não posso estar presente, enviei-lhe um presente pessoal: um tufo de meus cabelos."
 lover.3220.desc_object:0 "Para lembrá-l[Select_CString( lover.IsFemale, 'a', 'o' )] do meu amor quando não posso estar presente, enviei-lhe um presente que ecoa nosso passado: [ROOT.Char.Custom2('LoverSeductionObjectIndefinite', SCOPE.sC('original_lover'))]."
 lover.3220.desc_opening:0 "Cada dia sem você é vazio, e cada momento fora de seus braços é tormento."
 lover.3220.desc_smallclothes:0 "Para lembrá-l[Select_CString( lover.IsFemale, 'a', 'o' )] do meu amor quando não posso estar presente, enviei-lhe um presente íntimo: algumas de minhas roupas íntimas."
 lover.3221.a:0 "Estou aliviad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] que você tenha gostado do presente!"
 lover.3221.desc_hair:0 "A frustração de raramente estar em sua companhia será mais fácil de suportar com uma parte de você tão próxima."
 lover.3221.desc_object:0 "A frustração de raramente estar em sua companhia será mais fácil de suportar com um lembrete do passado que compartilhamos juntos."
 lover.3221.desc_opening:0 "O presente que você me enviou rapidamente se tornou muito querido para mim."
 lover.3221.desc_smallclothes:0 "A frustração de raramente estar em sua companhia será mais fácil de suportar com um item tão íntimo seu para me lembrar do que compartilhamos."
 lover.3222.a:0 "Não consigo acreditar que [lover.GetSheHe] não tenha apreciado o presente!"
 lover.3222.desc_hair:0 "Preciso perguntar — o que eu devo fazer com esses cabelos? É para algum ritual arcano?"
 lover.3222.desc_object:0 "Preciso perguntar — por que você focaria tanto no passado entre nós? Não vê nenhum futuro?"
 lover.3222.desc_opening:0 "O presente que você me enviou foi verdadeiramente... pessoal."
 lover.3222.desc_smallclothes:0 "Preciso perguntar — o que possuía para enviar-me uma peça de roupa tão vulgar?"
 lover.7001.a.tt:0 "#F Talvez um dia possamos ser mais do que amigos?#!"
 lover.7001.a:0 "Farei este momento durar o máximo possível!"
 lover.7001.b.tt:0 "#F Não quero que [potential_lover.GetSheHe] pense que podemos ser mais do que amigos.#!"
 lover.7001.b:0 "Então, sobre o que você estava dizendo..."
 lover.7001.desc:0 "Sentad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ao lado de [potential_lover.GetTitledFirstNamePossessive], conversando sobre [potential_lover.Custom('herhis_subject_of_interest')], vendo [potential_lover.GetSheHe] sorrir [potential_lover.Custom('quirk_pos_adverb')]... Quando nossos olhares se encontram, meu coração começa a bater mais rápido, e pelo rubor [potential_lover.GetHerHim], não sou [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] únic[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a sentir a tensão repentina."
 lover.7001.t:0 "[Select_CString( potential_lover.IsFemale, 'Minha Amiga', 'Meu Amigo' )] [potential_lover.Custom2('ComplimentAdjective', ROOT.Char)|U]"
 lover.7002.desc:0 "Sentad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ao lado de [proposing_friend.GetTitledFirstNamePossessive], conversando sobre [ROOT.Char.Custom('subject_of_interest')], captando o olhar [proposing_friend.GetHerHim] sobre mim enquanto sorrio... De repente, a tensão é palpável, e pelo rubor [proposing_friend.GetHerHim], não sou [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] únic[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a sentir isso."
 lover.7002.t:0 "[Select_CString( proposing_friend.IsFemale, 'Minha Amiga', 'Meu Amigo' )] [proposing_friend.Custom2('ComplimentAdjective', ROOT.Char)|U]"
 lover.7003.a.tt:0 "#F Preciso investigar esse sentimento estranho mais a fundo...#!"
 lover.7003.a:0 "Que feitiço é esse que [Select_CString( potential_lover.IsFemale, 'a', 'o' )] [potential_lover.Custom2('InsultNoun', ROOT.Char)] lançou sobre mim?!"
 lover.7003.b:0 "Deve ser desprezo o que sinto."
 lover.7003.desc:0 "[potential_lover.GetTitledFirstName] começa mais um ataque sobre [potential_lover.Custom('herhis_subject_of_interest')], e eu, deixando minha mente divagar, não posso deixar de notar que [potential_lover.GetSheHe] é realmente um[Select_CString( potential_lover.IsFemale, 'a', '' )] [potential_lover.Custom2('ComplimentAdjective', ROOT.Char)] [potential_lover.GetWomanMan].\n\nA tensão entre nós não é nada de novo, mas quando nossos olhos se encontram, sinto meu coração palpitar com algo além do ódio..."
 lover.7003.t:0 "[Select_CString( potential_lover.IsFemale, 'A', 'O' )] Rival [potential_lover.Custom2('InsultAdjective', ROOT.Char)|U]"
 lover.7004.a.tt:0 "#F O que é esse palpitar repentino em meu coração?#!"
 lover.7004.a:0 "Eu sorrio de volta...?"
 lover.7004.b:0 "Ew, deixe-me em paz, [proposing_rival.GetFirstNameNoTooltip]."
 lover.7004.desc_not:0 "Quando nossos olhares se encontram, [proposing_rival.GetSheHe] franze a testa e desvia o olhar rapidamente — tão [proposing_rival.Custom2('InsultNoun', ROOT.Char)] quanto sempre!"
 lover.7004.desc_opening:0 "No meio de uma discussão envolvente sobre [ROOT.Char.Custom('subject_of_interest')], vejo [Select_CString( proposing_rival.IsFemale, 'a', 'o' )] [proposing_rival.GetTitledFirstName] do outro lado da [ROOT.Char.Custom('GetRoom')], franzindo a testa.\n\n"
 lover.7004.desc_potential_lover_is_go:0 "Quando nossos olhares se encontram, [proposing_rival.GetSheHe], para minha surpresa, sorri [proposing_rival.Custom('quirk_pos_adverb')]. [proposing_rival.GetSheHe] sempre foi um[Select_CString( proposing_rival.IsFemale, 'a', '' )] [proposing_rival.GetWomanMan] [proposing_rival.Custom2('ComplimentAdjective', ROOT.Char)]?"
 lover.7004.t:0 "[Select_CString( proposing_rival.IsFemale, 'A', 'O' )] Rival [proposing_rival.Custom2('InsultAdjective', ROOT.Char)|U]"
 lover.7005.a.tt:0 "#F Seja o que for, quero mais disso!#!"
 lover.7005.a:0 "Será que esses sentimentos são normais por um[Select_CString( potential_lover.IsFemale, 'a', '' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('potential_lover') )]?"
 lover.7005.b:0 "[potential_lover.GetSheHe|U] é m[Select_CString( potential_lover.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('potential_lover') )]. Controle-se, [ROOT.Char.GetFirstNameNoTooltip]!"
 lover.7005.desc:0 "Não escapou à minha percepção que m[Select_CString( potential_lover.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('potential_lover') )] [potential_lover.GetTitledFirstName] é um[Select_CString( potential_lover.IsFemale, 'a', '' )] [potential_lover.GetWomanMan] [potential_lover.Custom2('ComplimentAdjective', ROOT.Char)]. A maneira como [potential_lover.GetSheHe] sorri e [potential_lover.Custom('quirk_pos_present')] nunca deixa de fazer meu coração palpitar..."
 lover.7005.t:0 "[Select_CString( potential_lover.IsFemale, 'Minha Amada', 'Meu Amado' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('potential_lover') )|U]"
 lover.7006.a.tt:0 "#F Mas nada disso dará em nada... Imagine só o escândalo!#!"
 lover.7006.a:0 "Também estou intrigad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por [proposing_family.GetSheHe]!"
 lover.7006.b:0 "Isso não passa de amor familiar, com certeza."
 lover.7006.desc:0 "M[Select_CString( proposing_family.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('proposing_family') )] [proposing_family.GetTitledFirstName] é um[Select_CString( proposing_family.IsFemale, 'a', '' )] [proposing_family.GetWomanMan] [proposing_family.Custom2('ComplimentAdjective', ROOT.Char)]; isso eu sei há muito tempo. Mas ultimamente [proposing_family.GetSheHe] tem passado mais tempo em minha presença, sorrindo de forma mais doce do que o habitual, olhando para mim quando [proposing_family.GetSheHe] pensa que eu não [Select_CString( proposing_family.IsFemale, 'a', 'o' )] vejo..."
 lover.7006.t:0 "[Select_CString( proposing_family.IsFemale, 'Minha Amada', 'Meu Amado' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('proposing_family') )|U]"
 lover.8102.a:0 "Assumirei total responsabilidade por minhas ações."
 lover.8102.b:0 "Você está apenas tentando me enredar, não é!?"
 lover.8102.c.crit_failure:0 "[brothel_worker.GetTitledFirstNameNoTooltip] conta ao mundo o que você fez"
 lover.8102.c.failure:0 "[brothel_worker.GetTitledFirstNameNoTooltip] concorda com o silêncio por um preço"
 lover.8102.c.success:0 "[brothel_worker.GetTitledFirstNameNoTooltip] é ameaçad[Select_CString( brothel_worker.IsFemale, 'a', 'o' )] para manter silêncio"
 lover.8102.c:0 "Esqueça essa noite, senão ninguém mais ouvirá falar de você."
 lover.8102.d:0 "Você pode vir comigo, desde que mantenha nosso passado em segredo."
 lover.8102.desc.ending:0 "\n\nA voz [brothel_worker.GetHerHim|U] se cala e [brothel_worker.GetSheHe] me oferece um sorriso tímido. Ou talvez seja um sorriso cúmplice?"
 lover.8102.desc.puppy_love:0 "Eu me apaixonei por você. Tudo parecia tão certo em seus braços... Há espaço em seu coração para alguém como eu?\""
 lover.8102.desc.they_pregnant:0 "Estou grávida com seu filho. O chá deve não ter continha as ervas corretas. Não quero criar a criança sozinha.\""
 lover.8102.desc.you_pregnant:0 "Você pode estar grávida. O chá não continha as ervas e potência adequadas. Não quero que crie a criança sozinha.\""
 lover.8102.desc:0 "\"Com licença,\" um camponês com aparência familiar aparece diante de mim. Enquanto reviro minha mente para lembrar de onde já havia conhecido [brothel_worker.GetSheHe], [brothel_worker.GetSheHe] responde como se lesse meus pensamentos.\n\n\"Nós nos conhecemos num bordel em [brothel_location.GetName]. Você pagou pelos meus serviços.\" Um tom rosado se espalha pelas bochechas [brothel_worker.GetHerHim].\n\"Para que possamos nos reencontrar... Tem que ser destino que"
 lover.8102.t:0 "Consequências da $pilgrimage_header$"
 lover_0003.a:0 "Preciso deixar [Select_CString( lover_1.IsFemale, 'a', 'o' )] [lover_1.GetFirstNameNoTooltip] ir."
 lover_0003.b:0 "[lover_2.GetFirstNameNoTooltip] e eu chegamos ao fim da estrada."
 lover_0003.c:0 "Não posso continuar assim com [Select_CString( lover_3.IsFemale, 'a', 'o' )] [lover_3.GetFirstNameNoTooltip]."
 lover_0003.d.tt:0 "Você usa suas habilidades românticas para manter seus amantes satisfeitos sem se sobrecarregar."
 lover_0003.d:0 "O romance não é sobre quantidade, mas qualidade!"
 lover_0003.e.tt:0 "Você se esforça para manter os relacionamentos vivos."
 lover_0003.e:0 "Isso pode me quebrar, mas o que é a vida sem [ROOT.Char.Custom('lover_reason')]?"
 lover_0004.a:0 "Como seguirei sem o [ROOT.Char.Custom('lover_reason')] [first_lover.GetHerHim]?"
 lover_0005.a:0 "Temo que tenha feito um inimigo hoje."
 lover_0300_break_up_with_other_lovers_effect.tt:0 "Todos os seus outros amantes"
