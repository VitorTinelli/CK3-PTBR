l_spanish:
 rivalry.0001.a:0 "Sim, vamos."
 rivalry.0001.b:0 "Você está se humilhando diante de mim?! [ROOT.Char.GetFaith.HighGodName] é bom!"
 rivalry.0001.desc:0 "\"[ROOT.Char.GetTitledFirstNameNoTooltip], tivemos nossas diferenças no passado, mas você não concorda que é hora de deixar o passado para trás?\"\n\n[rival.Custom2('MyCharacterIntroduction', ROOT.Char)|U] faz um gesto de mim para [rival.GetSheHe], \"Seja o que for que exista entre nós... vamos recomeçar!\""
 rivalry.0001.t:0 "Enterrando o Machado de Guerra"
 rivalry.0002.a:0 "Vamos deixar o passado para trás."
 rivalry.0002.desc:0 "Agora, com a perspectiva do tempo, tudo parece tão estranho. O ódio que carreguei e a dor que desejei causar... \nPara que foi tudo isso?\n\nChamar [Select_CString( rival_response.IsFemale, 'a', 'o' )] [rival_response.GetTitledFirstName] de [Select_CString( rival_response.IsFemale, 'minha inimiga', 'meu inimigo' )] não faz mais sentido para mim."
 rivalry.0002.t:0 "Enterrando o Machado de Guerra"
 rivalry.0003.a:0 "É hora de encerrar este capítulo."
 rivalry.0003.b:0 "Nunca perdoarei [nemesis.GetSheHe]! Jamais!"
 rivalry.0003.compassionate.desc:0 "Mas minha felicidade se desvaneceu com o tempo. Foi um prazer derrotar [Select_CString( nemesis.IsFemale, 'a antiga', 'o antigo' )] [nemesis.GetTitledFirstNameNoTooltip], mas essa criatura miserável? Eu quase sinto #EMP pena#! por [nemesis.GetSheHe]..."
 rivalry.0003.imprisoned.desc:0 "Quando as notícias da prisão d[Select_CString( nemesis.IsFemale, 'a', 'o' )] [nemesis.GetTitledFirstNamePossessive] chegaram até mim,"
 rivalry.0003.incapable.desc:0 "Quando ouvi pela primeira vez sobre o acidente d[Select_CString( nemesis.IsFemale, 'a', 'o' )] [nemesis.GetTitledFirstNamePossessive] e o estado em que está, babando na cama,"
 rivalry.0003.middle.desc:0 "Eu estava cheio de alegria. Aquel[Select_CString( nemesis.IsFemale, 'a', 'e' )] [nemesis.Custom2('InsultNoun', ROOT.Char)] [nemesis.Custom2('InsultAdjective', ROOT.Char)] finalmente estava recebendo o que [nemesis.GetSheHe] merecia!\n\n"
 rivalry.0003.my_prisoner.desc:0 "Quando bati a porta da cela na cara desprezível d[Select_CString( nemesis.IsFemale, 'a', 'o' )] [nemesis.GetTitledFirstNamePossessive],"
 rivalry.0003.t:0 "Um Oponente Indigno"
 rivalry.0003.uncompassionate.desc:0 "Com o tempo, porém, o estado lamentável [nemesis.GetHerHim] não me desperta mais interesse. Não encontro prazer em atormentar um ratinho acuado."
 rivalry.1001.a:0 "Maldit[Select_CString( rival.IsFemale, 'a', 'o' )] seja, [rival.GetFirstNameNoTooltip]!"
 rivalry.1001.benevolent:0 "Sempre que nos encontramos, [Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetWomanMan] [rival.Custom2('InsultAdjective', ROOT.Char)] faz questão de parecer decente e just[Select_CString( rival.IsFemale, 'a', 'o' )], ridicularizando-me de cima de seu pedestal. O que realmente me incomoda é que [rival.GetSheHe] parece ter enganado todo mundo!"
 rivalry.1001.desc.fallback:0 "Sinto como se não importasse para onde vou ou o que faço, [rival.GetTitledFirstName] sempre faz questão de deixar sua presença conhecida. É uma sombra que constantemente escurece todos os meus dias."
 rivalry.1001.desc.opening:0 "[rival.GetTitledFirstName] tornou-se uma praga constante em minha vida.\n\n"
 rivalry.1001.dominant:0 "Não apenas [rival.GetSheHe] constantemente exige atenção e espaço, [rival.GetSheHe] também tem a audácia de demandar meu tempo e atenção. Como se eu não tivesse nada melhor a fazer do que ouvi-l[Select_CString( rival.IsFemale, 'a', 'o' )] se gabar!"
 rivalry.1001.emotional:0 "[rival.GetSheHe|U] aproveita todas as oportunidades para criar uma cena e me retratar como [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] vil[Select_CString( ROOT.Char.IsFemale, 'ã', 'ão' )]! [rival.GetSheHe|U] chora e reclama, arrastando meu nome na lama e me culpando por tudo de errado em sua vida."
 rivalry.1001.extroverted:0 "[rival.GetSheHe|U] sempre quer toda a atenção em qualquer evento, fazendo todos ouvirem [rival.GetSheHe] falar sem parar por horas a fio. Como se isso não bastasse, [rival.GetSheHe] aproveita cada oportunidade para me atacar enquanto faz isso!"
 rivalry.1001.introverted:0 "[Select_CString( rival.IsFemale, 'A', 'O' )] [rival.GetWomanMan] [rival.Custom2('InsultAdjective', ROOT.Char)] é tão carismátic[Select_CString( rival.IsFemale, 'a', 'o' )] quanto uma pedra, mas parece encontrar tempo para espalhar rumores sobre mim!"
 rivalry.1001.levelheaded:0 "Não importa se é para sabotar meu governo ou proferir um insulto mordaz, [rival.GetSheHe] sempre está lá, esperando."
 rivalry.1001.malicious:0 "[rival.GetSheHe|U] sempre parece arruinar tudo o que faço, e [Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetWomanMan] [rival.Custom2('InsultAdjective', ROOT.Char)] sorri enquanto faz isso!"
 rivalry.1001.submissive:0 "[Select_CString( rival.IsFemale, 'A', 'O' )] [rival.GetWomanMan] [rival.Custom2('InsultAdjective', ROOT.Char)] finge ser submiss[Select_CString( rival.IsFemale, 'a', 'o' )], mas vira as costas e me apunhala pelas costas a cada oportunidade!"
 rivalry.1001.t:0 "Sempre Presente"
 rivalry.1010.a.badfailure.tt:0 "#F Fui exposto como a origem dos rumores #!"
 rivalry.1010.a.failure.tt:0 "#F Ninguém acredita nos rumores improváveis #!"
 rivalry.1010.a.success.tt:0 "#F Os rumores levam a muitos boatos e especulações #!"
 rivalry.1010.a:0 "Espalhar rumores escandalosos que afligirão [rival.GetSheHe] por anos!"
 rivalry.1010.b.badfailure.tt:0 "#F Fui exposto como o autor do poema #!"
 rivalry.1010.b.failure.tt:0 "#F As pessoas acham o poema mal escrito e de mau gosto #!"
 rivalry.1010.b.success.tt:0 "#F O poema se torna tão popular que é copiado repetidamente #!"
 rivalry.1010.b:0 "Escrever um poema espirituoso zombando de todas as falhas [rival.GetHerHim]!"
 rivalry.1010.c.tt:0 "#F [rival.GetTitledFirstName] reagirá ao seu insulto #!"
 rivalry.1010.c:0 "Denunciar o comportamento rude [rival.GetHerHim] diretamente para sua face!"
 rivalry.1010.desc.end:0 "recentemente isso tem me incomodado mais do que nunca. Quero me vingar [rival.GetHerHim] por esse comportamento, mas que forma deve ter minha retaliação?"
 rivalry.1010.desc.patient:0 "Mesmo eu só consigo aguentar tanta [rival.Custom2('InsultBehavior', ROOT.Char)] d[Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetTitledFirstNamePossessive] antes de se tornar insuportável, e"
 rivalry.1010.desc:0 "[Select_CString( rival.IsFemale, 'A', 'O' )] [rival.Custom2('InsultBehavior', ROOT.Char)] d[Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetTitledFirstNamePossessive] sempre me incomodou, mas"
 rivalry.1010.t:0 "Atos Maldosos"
 rivalry.1011.a:0 "Vou me vingar [from_rival.GetHerHim] por isso!"
 rivalry.1011.desc.poem:0 "Um novo poema circula, zombando de mim por causa de minha [ROOT.GetCharacter.Custom('quirk_neg_noun')] e me retratando de forma negativa. Embora eu não possa provar que [Select_CString( from_rival.IsFemale, 'a', 'o' )] [from_rival.GetTitledFirstName] está por trás disso, a prosa cheira muito ao envolvimento [from_rival.GetHerHim]."
 rivalry.1011.desc.rumors:0 "Rumores ultrajantes sobre minha [ROOT.GetCharacter.Custom('quirk_neg_noun')] têm se espalhado por toda a corte. Enquanto caminho pelos corredores, sou perseguido por sussurros desagradáveis e risadinhas cruéis. Essa tática covarde é exatamente o tipo de comportamento baixo que eu esperaria d[Select_CString( from_rival.IsFemale, 'a', 'o' )] [from_rival.GetTitledFirstName]!"
 rivalry.1011.t:0 "Provocações Maldosas"
 rivalry.1012.a:0 "Serve para ensinar [from_rival.GetSheHe]!"
 rivalry.1012.desc.poem:0 "Acabei de descobrir que [Select_CString( from_rival.IsFemale, 'a', 'o' )] [from_rival.GetTitledFirstName] escreveu um poema calunioso tentando zombar de mim por causa de minha [ROOT.GetCharacter.Custom('quirk_neg_noun')]! No entanto, o poema [from_rival.GetHerHim] é tão mal escrito que todos têm zombado d[Select_CString( from_rival.IsFemale, 'a', 'o' )] [from_rival.GetFirstName] por desperdiçar papel em lixo!"
 rivalry.1012.desc.rumors:0 "Acabei de descobrir que [Select_CString( from_rival.IsFemale, 'a', 'o' )] [from_rival.GetTitledFirstName] tem tentado espalhar rumores caluniosos sobre o tipo de coisas que eu supostamente faço a portas fechadas. [Select_CString( from_rival.IsFemale, 'A', 'O' )] [from_rival.Custom('quirk_neg_adjective')] desprezível deve ter uma visão muito deturpada de mim, já que os rumores foram tão absurdos e inacreditáveis que todos os ignoraram completamente. Em vez disso, estão fofocando sobre como [Select_CString( from_rival.IsFemale, 'a', 'o' )] [from_rival.GetFirstName] recorreu a medidas tão maliciosas e mesquinhas."
 rivalry.1012.t:0 "Fantasias Tolas"
 rivalry.1013.a:0 "Talvez isso finalmente coloque [rival.GetSheHe] em seu lugar."
 rivalry.1013.desc:0 "Os escandalosos rumores sobre [Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetTitledFirstName] que eu trabalhei para espalhar na corte se tornaram o novo tópico favorito de fofocas e especulações. Ouvi dizer que [Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetTitledFirstName] está cada vez mais irritado e frustrado tentando acabar com eles!"
 rivalry.1013.t:0 "Rumores Plantados"
 rivalry.1014.a.exposed:0 "Isso não saiu nada como o planejado."
 rivalry.1014.a:0 "Pelo menos consegui encobrir minhas trilhas..."
 rivalry.1014.desc.end:0 "imaturo e mesquinho por recorrer a táticas tão baixas para difamar o nome d[Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetFirstName]."
 rivalry.1014.desc.exposed:0 "eu por tê-los criado, dizendo que sou"
 rivalry.1014.desc.hidden:0 "quem os criou, dizendo que deve ser"
 rivalry.1014.desc.start:0 "Ninguém está levando a sério os rumores que eu tentei espalhar sobre [Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetTitledFirstName], os descartando como selvagens e inacreditáveis. As pessoas estão rindo mais de"
 rivalry.1014.t:0 "Rumores Rejeitados!"
 rivalry.1015.a:0 "Talvez isso finalmente coloque [rival.GetSheHe] em seu lugar."
 rivalry.1015.desc:0 "As rimas inteligentes e insinuações hábeis que incluí em minha crítica contundente do caráter d[Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetTitledFirstNamePossessive] estão se espalhando pela corte como um incêndio! Por mais que [rival.GetSheHe] tente, [rival.GetSheHe] não consegue impedir a disseminação delas, o que só aumenta o constrangimento [rival.GetHerHim]!"
 rivalry.1015.t:0 "Poema Popular"
 rivalry.1016.a.exposed:0 "Por que achei que isso era uma boa ideia?"
 rivalry.1016.a:0 "Pelo menos fico feliz por não ter colocado meu nome neles."
 rivalry.1016.desc.exposed:0 "Pior ainda, meu ódio [Select_CString( rival.IsFemale, 'pela', 'pelo' )] [rival.GetTitledFirstName] é tão evidente que todos sabem que fui eu quem os escreveu!"
 rivalry.1016.desc:0 "Depois de escrever vários poemas zombando do caráter d[Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetTitledFirstNamePossessive], os espalhei pela corte e esperei que eles se tornassem populares.\n\nInfelizmente, parece que meus escritos não são muito populares... na verdade, todos concordam que os poemas são bobagem e não valem o papel em que foram escritos!"
 rivalry.1016.t:0 "Poema Rejeitado"
 rivalry.1017.a:0 "Eu respondo a essa difamação com uma série de meus próprios insultos!"
 rivalry.1017.b.tt:0 "#F Vou mostrar para essa desgraçada que sou melhor do que [from_rival.GetSheHe] é#!"
 rivalry.1017.b:0 "Essa mentirosa desprezível vai responder a mim em um duelo!"
 rivalry.1017.c:0 "Vou fazer a coisa certa e virar a outra face."
 rivalry.1017.desc:0 "Eu estava [ROOT.GetCharacter.Custom('quirk_pos_adverb')] cuidando dos meus negócios quando [Select_CString( from_rival.IsFemale, 'a', 'o' )] [from_rival.GetTitledFirstName] veio até mim e me insultou diretamente na minha cara.\n\n\"[ROOT.GetCharacter.Custom2('InsultNoun', SCOPE.sC('from_rival'))] [ROOT.GetCharacter.Custom('quirk_neg_adjective')|U], sua presença me faz chorar!"
 rivalry.1017.t:0 "Insulto Audacioso!"
 rivalry.1018.a:0 "É tudo culpa [rival.GetHerHim] por ser tão [rival.Custom('quirk_neg_adjective')] desde o começo!"
 rivalry.1018.desc:0 "Quando abordei [Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetTitledFirstName] para dar uma parte da minha idéia a [rival.GetSheHe], [rival.GetSheHe] retrucou com uma série de insultos e abusos próprios!\n\nA troca foi vista por muitos no reino como infantil, e ambos perdemos a face como resultado."
 rivalry.1018.t:0 "Retaliação"
 rivalry.1019.a:0 "Eu sabia que [rival.GetSheHe] era frac[Select_CString( rival.IsFemale, 'a', 'o' )]!"
 rivalry.1019.desc:0 "Quando abordei [Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetTitledFirstName] para dar uma parte da minha mente, listando todas as falhas [rival.GetHerHim], [rival.GetSheHe|U] não tinha nada a dizer em sua defesa, e fui embora sabendo que [rival.GetSheHe] tinha sido firmemente colocad[Select_CString( rival.IsFemale, 'a', 'o' )] em seu lugar."
 rivalry.1019.t:0 "Injúria Gratuita"
 rivalry.1020.a:0 "Você está dentro, [rival.GetFirstNameNoTooltip]!"
 rivalry.1020.b:0 "Er... não precisa recorrer à violência, agora..."
 rivalry.1020.desc:0 "Quando eu chamei a atenção d[Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetTitledFirstName] por seu [rival.Custom('quirk_neg_noun')], [rival.GetSheHe] considerou isso uma grave ofensa e me desafiou para um duelo para defender sua honra!"
 rivalry.1020.t:0 "Desafio ao Desprezo!"
 rivalry.1021.a:0 "Eu provei ser superior [Select_CString( duel_loser.IsFemale, 'a', 'ao' )] [duel_loser.GetFirstNamePossessiveNoTooltip]!"
 rivalry.1021.desc:0 "Desde o início do meu duelo com [Select_CString( duel_loser.IsFemale, 'a', 'o' )] [duel_loser.GetTitledFirstName], fica claro que tenho a vantagem. Pressiono a vantagem, mantendo [duel_loser.GetSheHe] desequilibrad[Select_CString( duel_loser.IsFemale, 'a', 'o' )]. Logo [duel_loser.GetSheHe] comete um erro e me deixa uma abertura, que aproveito para [ROOT.GetCharacter.Custom('SignatureWeaponCritical')] o braço [duel_loser.GetHerHim], encerrando o confronto!\n\nO fato de minha vitória ter sido rápida e decisiva torna tudo melhor."
 rivalry.1021.t:0 "Vitória Triunfante"
 rivalry.1021.tt:0 "Vitória triunfante"
 rivalry.1022.a:0 "Minha vitória prova que eu estava cert[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 rivalry.1022.desc:0 "Começo meu duelo com [Select_CString( duel_loser.IsFemale, 'a', 'o' )] [duel_loser.GetTitledFirstName] e percebo que estamos mais igualmente pareados do que eu esperava. Trocamos golpes e defesas de forma recíproca por algum tempo, sem nenhum de nós ganhar vantagem por muito tempo.\n\nEventualmente, ambos começamos a sofrer exaustão e [duel_loser.GetSheHe] se deixa vulnerável, permitindo-me [ROOT.GetCharacter.Custom('SignatureWeaponCritical')] a perna [duel_loser.GetHerHim] e encerrar o duelo!"
 rivalry.1022.t:0 "Vitória Apertada"
 rivalry.1022.tt:0 "Vitória apertada"
 rivalry.1023.a.death:0 "Está tudo tão escuro..."
 rivalry.1023.a:0 "Na próxima vez, vou pegar você, [duel_winner.GetTitledFirstNameNoTooltip]!"
 rivalry.1023.desc.death:0 "Meus ferimentos pesam sobre mim e caio no chão."
 rivalry.1023.desc.end:0 "Sangrando muito, não tenho outra escolha senão conceder a partida."
 rivalry.1023.desc:0 "Ao começarmos nosso duelo, percebo que [Select_CString( duel_winner.IsFemale, 'a', 'o' )] [duel_winner.GetTitledFirstName] é um adversário mais poderoso do que eu antecipava. A batalha é acirrada, com cada um de nós trocando ataques e defesas enquanto buscamos uma abertura.\n\nEventualmente, à medida que começo a sofrer exaustão, minha guarda escapa por apenas um momento, o que [Select_CString( duel_winner.IsFemale, 'a', 'o' )] [duel_winner.GetFirstName] aproveita para [duel_winner.Custom('SignatureWeaponCritical')] meu braço com seu [duel_winner.Custom('signature_weapon')]."
 rivalry.1023.t:0 "Derrota Apertada"
 rivalry.1023.tt:0 "Derrota apertada"
 rivalry.1024.a:0 "Eu tenho que voltar para casa mancando, envergonhado."
 rivalry.1024.desc.death:0 "me fazendo cair e desabar no chão."
 rivalry.1024.desc.end:0 "marcando claramente o fim do duelo. Minha derrota humilhante me deixou envergonhado e envergonhado!"
 rivalry.1024.desc:0 "Quando [Select_CString( duel_winner.IsFemale, 'a', 'o' )] [duel_winner.GetTitledFirstName] e eu nos encontramos para começar nosso duelo, [duel_winner.GetSheHe] não perde tempo e parte para a ação! Pego de surpresa, luto para recuperar minha posição e os ataques implacáveis d[Select_CString( duel_winner.IsFemale, 'a', 'o' )] [duel_winner.GetFirstName] não me deixam espaço para me recuperar.\n\nNão demora muito para [duel_winner.GetSheHe] passar por minha guarda e [duel_winner.Custom('SignatureWeaponCriticalPresent')] minha perna com seu [duel_winner.Custom('signature_weapon')],"
 rivalry.1024.t:0 "Derrota Humilhante"
 rivalry.1024.tt:0 "Derrota humilhante"
 rivalry.1025.a:0 "Pelo menos eu mantive minha honra."
 rivalry.1025.desc:0 "[Select_CString( from_rival.IsFemale, 'A', 'O' )] covarde d[Select_CString( from_rival.IsFemale, 'a', 'o' )] [from_rival.GetTitledFirstName] se recusou a duelar comigo, apesar de ter me insultado cara a cara! Não consigo pensar em nada mais vergonhoso do que ser tão desrespeitoso sem ter a vontade de se defender. Eu sempre soube que [rival.GetSheHe] era desonrosa, e isso prova isso!"
 rivalry.1025.t:0 "Exibição Vergonhosa"
 rivalry.1030.a.tt:0 "[rival.GetTitledFirstName] descobrirá algumas evidências comprometedoras... mas [rival.GetSheHe] acreditará nelas?"
 rivalry.1030.a:0 "Vou enviar cartas para [Select_CString( rival_spouse.IsFemale, 'a', 'o' )] [rival_spouse.GetTitledFirstNameNoTooltip] de um amante secreto."
 rivalry.1030.a_failure:0 "O plano falha"
 rivalry.1030.a_success:0 "Incriminação bem-sucedida"
 rivalry.1030.b.tt:0 "[rival_spouse.GetTitledFirstName] descobrirá algumas evidências comprometedoras... mas [rival_spouse.GetSheHe] acreditará nelas?"
 rivalry.1030.b:0 "Prefiro incriminar [Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetTitledFirstNameNoTooltip] em vez disso."
 rivalry.1030.c.tt:0 "Abandonarei esse caminho por enquanto."
 rivalry.1030.c:0 "Interferir na união de outra pessoa é ir longe demais!"
 rivalry.1030.desc.happy:0 "Me irrita que [Select_CString( rival.IsFemale, 'minha', 'meu' )] rival [rival.GetTitledFirstName] pareça desfrutar dos confortos de um casamento feliz com [Select_CString( rival_spouse.IsFemale, 'sua', 'seu' )] [rival_spouse.GetWifeHusband] [rival_spouse.GetTitledFirstName]. Eu poderia causar um bom nível de estresse e preocupação semear suspeitas entre os dois, fazendo com que duvidem um do outro."
 rivalry.1030.desc.neutral:0 "O casamento sem amor entre [Select_CString( rival.IsFemale, 'minha', 'meu' )] rival [rival.GetTitledFirstName] e [Select_CString( rival_spouse.IsFemale, 'sua', 'seu' )] [rival_spouse.GetWifeHusband] [rival_spouse.GetTitledFirstName] oferece uma oportunidade tentadora para mim. Se eu conseguir semear suspeitas e desconfiança entre os dois, [rival.GetFirstName] ficaria tão distraída com o casamento desmoronando que não conseguiria interferir em meus planos!"
 rivalry.1030.desc.unhappy:0 "Não é incomum que [Select_CString( rival.IsFemale, 'minha', 'meu' )] rival [rival.GetTitledFirstName] e [Select_CString( rival_spouse.IsFemale, 'sua', 'seu' )] [rival_spouse.GetWifeHusband] [rival_spouse.GetTitledFirstName] estejam brigando entre si. Eu poderia instigar outra briga entre eles com uma carta cuidadosamente plantada, distraindo [Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetFirstName] e tornando mais difícil para [rival.GetSheHe] interferir em meus planos..."
 rivalry.1030.t:0 "Intromissão no Casamento"
 rivalry.1031.a.fooled:0 "Devo descobrir quem é o amante misterioso [my_spouse.GetHerHim]!"
 rivalry.1031.a.suspicious:0 "Investigarei discretamente para descobrir o que está acontecendo."
 rivalry.1031.b.fooled:0 "Vou confrontar [Select_CString( my_spouse.IsFemale, 'a', 'o' )] [my_spouse.GetFirstNameNoTooltip] diretamente sobre a carta!"
 rivalry.1031.b.suspicious:0 "Vou confrontar [Select_CString( my_spouse.IsFemale, 'a', 'o' )] [my_spouse.GetFirstNameNoTooltip] diretamente e descobrir a verdade!"
 rivalry.1031.b.tt:0 "Vou perguntar [Select_CString( my_spouse.IsFemale, 'a', 'ao' )] [my_spouse.GetTitledFirstName] se [my_spouse.GetSheHe] tem sido infiel"
 rivalry.1031.c.tt:0 "Vou jogar a carta fora"
 rivalry.1031.c:0 "Confio [Select_CString( my_spouse.IsFemale, 'na', 'no' )] [my_spouse.GetTitledFirstNameNoTooltip], esta carta deve ser uma falsificação!"
 rivalry.1031.desc.fooled:0 "\n\nO autor da carta não é identificado, e minha mente corre com especulações sobre quem pode estar tendo um caso com [Select_CString( my_spouse.IsFemale, 'minha', 'meu' )] [my_spouse.GetWifeHusband]!"
 rivalry.1031.desc.suspicious:0 "\n\nA princípio, estou chateado, mas ao ler mais atentamente, percebo que a carta é muito genérica, sem detalhes pessoais e não identifica o autor. Qualquer um poderia tê-la escrito..."
 rivalry.1031.desc:0 "Hoje eu encontrei uma carta endereçada ao [Select_CString( my_spouse.IsFemale, 'minha', 'meu' )] [my_spouse.GetWifeHusband] [my_spouse.GetFirstName], escrita à mão por um amante, que detalha sua última aventura amorosa juntos e implora para saber quando eles podem se encontrar novamente!"
 rivalry.1031.t:0 "Evidências de Infidelidade?"
 rivalry.1032.a.tt:0 "Tento convencer [Select_CString( suspicious_spouse.IsFemale, 'a', 'o' )] [suspicious_spouse.GetFirstNameNoTooltip] de que fui fiel"
 rivalry.1032.a:0 "Eu não fui infiel a você, eu juro!"
 rivalry.1032.b:0 "Devo confessar meu caso com [Select_CString( spouse_lover.IsFemale, 'a', 'o' )] [spouse_lover.GetTitledFirstNameNoTooltip]!"
 rivalry.1032.desc:0 "[Select_CString( suspicious_spouse.IsFemale, 'Minha', 'Meu' )] [suspicious_spouse.GetWifeHusband] [suspicious_spouse.GetFirstName] se aproximou de mim hoje com uma carta em mãos que [suspicious_spouse.GetSheHe] diz que foi escrita por meu amante secreto! Agora [suspicious_spouse.GetSheHe] está me acusando de ter um caso!"
 rivalry.1032.t:0 "Acusações de Infidelidade"
 rivalry.1033.a.tt:0 "Encerro essa linha de investigação"
 rivalry.1033.a:0 "Confio [Select_CString( my_spouse.IsFemale, 'na', 'no' )] [my_spouse.GetFirstNameNoTooltip] e acredito no que [my_spouse.GetSheHe] diz!"
 rivalry.1033.b:0 "Mentiras! Vou investigar mais e descobrir a verdade!"
 rivalry.1033.desc:0 "Confrontei [Select_CString( my_spouse.IsFemale, 'a', 'o' )] [my_spouse.GetFirstName] sobre a carta do suposto amante [my_spouse.GetHerHim], mas [my_spouse.GetSheHe] pareceu chocado e magoado com a acusação, e protestou sua inocência!"
 rivalry.1033.t:0 "Negação de Culpa"
 rivalry.1034.a:0 "Como [my_spouse.GetSheHe] pôde fazer isso comigo?"
 rivalry.1034.desc:0 "Quando confrontei [Select_CString( my_spouse.IsFemale, 'a', 'o' )] [my_spouse.GetFirstName] sobre a carta do amante secreto, [my_spouse.GetSheHe] desmoronou e confessou chorando ter tido um caso com [Select_CString( spouse_lover.IsFemale, 'a', 'o' )] [spouse_lover.GetTitledFirstName]!"
 rivalry.1034.t:0 "Uma Confissão Chorosa"
 rivalry.1035.a:0 "[instigator.GetSheHe|U] pagará por interferir em meu casamento!"
 rivalry.1035.desc:0 "Após investigar a origem da carta do suposto amante d[Select_CString( my_spouse.IsFemale, 'a', 'o' )] [my_spouse.GetFirstName], descobri que era uma farsa plantada por ninguém menos que aquel[Select_CString( instigator.IsFemale, 'a', 'e' )] [instigator.Custom2('InsultNoun', ROOT.Char)] [instigator.Custom2('InsultAdjective', ROOT.Char)] d[Select_CString( instigator.IsFemale, 'a', 'o' )] [instigator.GetTitledFirstName]!"
 rivalry.1035.t:0 "Falsificação Descoberta!"
 rivalry.1036.a:0 "Vou ficar de olho [Select_CString( rival_spouse.IsFemale, 'na', 'no' )] [rival_spouse.GetFirstNameNoTooltip] mesmo assim..."
 rivalry.1036.b:0 "Devo concluir que a carta é uma farsa!"
 rivalry.1036.desc:0 "Segui todas as pistas possíveis para rastrear quem era o suposto amante secreto que enviou a carta para [Select_CString( rival_spouse.IsFemale, 'a', 'o' )] [rival_spouse.GetFirstName], mas não consegui determinar a origem da carta."
 rivalry.1036.t:0 "Caminhos Sem Saída"
 rivalry.1037.a:0 "Seu conflito é música doce para meus ouvidos!"
 rivalry.1037.desc:0 "Meus espiões me informaram que há de fato uma nova tensão entre [Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetTitledFirstName] e [Select_CString( rival_spouse.IsFemale, 'sua', 'seu' )] [rival_spouse.GetWifeHusband] [rival_spouse.GetFirstName]. Parece que minha manobra para semear desconfiança entre eles foi bem-sucedida!"
 rivalry.1037.t:0 "Interferência no Casamento"
 rivalry.1038.a:0 "Terei que tentar algo diferente..."
 rivalry.1038.desc:0 "Meus espiões me informaram que [Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetTitledFirstName] determinou que a carta que plantei para semear desconfiança entre [rival.GetSheHe] e [Select_CString( rival_spouse.IsFemale, 'sua', 'seu' )] [rival_spouse.GetWifeHusband] [rival_spouse.GetFirstName] era uma farsa, e não foi enganado por minha artimanha!"
 rivalry.1038.t:0 "Interferência no Casamento"
 rivalry.1039.a:0 "Bem... isso é interessante"
 rivalry.1039.desc:0 "Meus espiões me informaram que [Select_CString( my_spouse.IsFemale, 'a', 'o' )] [my_spouse.GetTitledFirstName] aparentemente estava tendo um caso o tempo todo, e minha carta forjada fez [my_spouse.GetSheHe] desmoronar e confessar para [Select_CString( suspicious_spouse.IsFemale, 'a', 'o' )] [suspicious_spouse.GetTitledFirstName]!"
 rivalry.1039.t:0 "De Mal a Pior"
 rivalry.2001.a:0 "Hah, [target_in_question.GetFirstNameNoTooltip] nem precisa perguntar!"
 rivalry.2001.b:0 "[target_in_question.GetFirstNameNoTooltip] deve tomar a própria decisão sobre [target_in_question.GetSheHe] próprio."
 rivalry.2001.desc:0 "Recebi uma carta d[Select_CString( target_in_question.IsFemale, 'a', 'o' )] [target_in_question.GetTitledFirstName] perguntando o que eu penso d[Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetTitledFirstName]. Parece que [Select_CString( rival.IsFemale, 'a', 'o' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('rival'))] está fazendo avanços diplomáticos em relação a [target_in_question.GetSheHe]."
 rivalry.2001.t:0 "Um Obstáculo para a Amizade"
 rivalry.2002.a:0 "[target_in_question.GetFirstNameNoTooltip] realmente acredita no que [Select_CString( first_rival.IsFemale, 'a', 'o' )] [first_rival.GetFirstNameNoTooltip] diz sobre [target_in_question.GetSheHe]?"
 rivalry.2002.desc:0 "Tenho trabalhado duro para causar uma boa impressão [Select_CString( target_in_question.IsFemale, 'na', 'no' )] [target_in_question.GetTitledFirstName], e o que descubro?\n\nQue ninguém menos que [Select_CString( first_rival.IsFemale, 'a', 'o' )] [first_rival.GetTitledFirstName] tem espalhado rumores odiosos sobre mim para prejudicar meus esforços!"
 rivalry.2002.t:0 "Um Obstáculo para a Amizade"
 rivalry.3001.a:0 "Espere só, [rival.GetTitledFirstNameNoTooltip]!"
 rivalry.3001.benevolent:0 "[rival.GetSheHe|U] enviou uma carta, pedindo por melhores relações e ao mesmo tempo se dirigindo a mim como \"[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.GetTitledFirstName]\". [rival.GetSheHe|U] realmente mostra suas verdadeiras cores agora!"
 rivalry.3001.desc.end:0 "\n\nIsso não pode ficar assim, vou garantir que [rival.GetSheHe] pague por sua insolência."
 rivalry.3001.desc.fallback:0 "[rival.GetSheHe|U] enviou um mensageiro que me chamou de \"[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.GetTitledFirstName]\" na frente de todos!"
 rivalry.3001.desc.opening:0 "Como se não bastasse que [rival.GetSheHe] abrace os piores vícios da humanidade, [rival.GetTitledFirstName] agora me insultou diretamente!\n\n"
 rivalry.3001.dominant:0 "[rival.GetSheHe|U] enviou um mensageiro, me tratando como \"[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.GetTitledFirstName]\", e praticamente implorando por uma briga!"
 rivalry.3001.emotional:0 "[rival.GetSheHe|U] enviou um mensageiro me acusando de \"sabotar toda a vida d[Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetFirstNamePossessiveNoTooltip]\", me chamando de \"[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.GetTitledFirstName]\", e então fez um verdadeiro escândalo."
 rivalry.3001.extroverted:0 "[rival.GetSheHe|U] enviou um mensageiro até mim enquanto eu estava em audiência, que me cumprimentou como \"[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.GetTitledFirstName]\", e continuou a arrastar meu nome na lama na frente de todos!"
 rivalry.3001.levelheaded:0 "[rival.GetSheHe|U] enviou um mensageiro que esperou o momento perfeito para me abordar como \"[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.GetTitledFirstName]\" como se fosse por acidente, e depois [rival.GetSheHe] agiu como se tudo tivesse sido um erro."
 rivalry.3001.malicious:0 "[rival.GetSheHe|U] enviou um mensageiro, garantindo que toda a corte pudesse ouvir os comentários odiosos feitos. \"[Select_CString( ROOT.Char.IsFemale, 'A', 'Ao' )] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.GetTitledFirstName]\", começou, e só piorou à medida que prosseguia. [Select_CString( rival.IsFemale, 'A', 'O' )] [rival.GetWomanMan] [rival.Custom2('InsultAdjective', ROOT.Char)] tem muita coragem!"
 rivalry.3001.submissive:0 "Encontrei um bilhete em meus aposentos particulares, lá escondido sob o manto da noite. \"[Select_CString( ROOT.Char.IsFemale, 'A', 'Ao' )] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.GetTitledFirstName]\", começou, e só piorou à medida que prosseguia. [Select_CString( ROOT.Char.IsFemale, 'A', 'O' )] [rival.GetWomanMan] [rival.Custom2('InsultAdjective', ROOT.Char)] até teve a coragem de assiná-lo com seu nome!"
 rivalry.3001.t:0 "De Mal a Pior"
 rivalry.3002.a:0 "Eu denuncio você, [rival.GetTitledFirstNameNoTooltip]!"
 rivalry.3002.b:0 "[rival.GetTitledFirstNameNoTooltip] não precisa saber o que sinto."
 rivalry.3002.desc:0 "M[Select_CString( friend.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('friend'))], [friend.GetTitledFirstName], tem lidado com um incômodo ultimamente. [rival.GetTitledFirstName] escolheu [friend.GetSheHe] como alvo para todas as suas tramas maliciosas.\n\nQuem eu seria para permitir esse tipo de tratamento aos meus amigos?"
 rivalry.3002.t:0 "O Inimigo do Meu Amigo"
 rivalry.3003.a:0 "Bah! Um bando de ovelhas."
 rivalry.3003.desc:0 "Parece que [Select_CString( first_friend.IsFemale, 'a', 'o' )] [first_friend.GetTitledFirstName] me denunciou, citando minha rivalidade com s[Select_CString( friend.IsFemale, 'ua', 'eu' )] [first_friend.Custom2('RelationToMe', SCOPE.sC('friend') )], o [first_friend.Custom2('InsultAdjective', ROOT.Char)] [friend.GetTitledFirstName].\n\nMeus inimigos parecem estar se multiplicando..."
 rivalry.3003.t:0 "Ratos se Reunindo"
 rivalry.3004.a:0 "Será que [rival.GetSheHe] faz isso apenas para me provocar?!"
 rivalry.3004.fallback:0 "\n\n[rival.GetSheHe|U] parece agir de forma oposta à minha em todas as situações!"
 rivalry.3004.opening:0 "Mesmo se eu não odiasse [Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetTitledFirstName] tão intensamente, sei que nunca nos daríamos bem!"
 rivalry.3004.t:0 "A Pior Pessoa Possível"
 rivlary.1010.c.tt:0 "#F [rival.GetTitledFirstName] reagirá ao seu desdém#!"
