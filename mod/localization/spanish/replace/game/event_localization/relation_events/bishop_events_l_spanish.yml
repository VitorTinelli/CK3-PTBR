l_spanish:
 all_my_theocratic_vassals:0 "Todos os meus vassalos teocráticos"
 bishop.1001.a.tt:0 "@warning_icon! #X Você se divorcia de [spouse.GetUIName]#!"
 bishop.1001.a:0 "Claro, [bishop.GetTitledFirstNameNoTooltip]."
 bishop.1001.b.failure:0 "A afirmação é realmente irrefutável"
 bishop.1001.b.success:0 "Eu provo que a afirmação é falsa"
 bishop.1001.b:0 "Nosso casamento não será desfeito por uma mentira tão óbvia!"
 bishop.1001.c.failure:0 "[bishop.GetTitledFirstNameNoTooltip] não é persuadid[Select_CString( bishop.IsFemale, 'a', 'o' )]"
 bishop.1001.c.success:0 "Eu defendo com sucesso a santidade do nosso casamento"
 bishop.1001.c:0 "Mentir sobre uma coisa dessas... Vou deixar [bishop.GetSheHe] ciente da verdade."
 bishop.1001.d:0 "Certamente tudo isso pode ser... esquecido?"
 bishop.1001.desc.actually_incestuous:0 "Essa informação ficará entre nós dois se você encerrar imediatamente essa união profana."
 bishop.1001.desc.made_up:0 "Essa informação... #EMP irrefutável#! ficará entre nós dois se você encerrar imediatamente essa união #EMP claramente#! profana."
 bishop.1001.desc:0 "É meu dever informá-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] que provas irrefutáveis foram reveladas, comprovando que seu casamento com [spouse.GetTitledFirstName] é de natureza consanguínea.\n\n"
 bishop.1001.opening:0 "[bishop.Custom2('AppropriateGreeting', ROOT.Char)]"
 bishop.1011.a:0 "Não estou provocando a ira da [bishop.GetFaith.HouseOfWorship]."
 bishop.1011.b.outcome:0 "Encontrado Sangrando nas Ruas"
 bishop.1011.b.tt:0 "Você ignora as ameaças veladas"
 bishop.1011.b:0 "Suas palavras não podem me prejudicar!"
 bishop.1011.c.failure.tt:0 "[bishop.GetSheHe|U] toma medidas drásticas"
 bishop.1011.c.failure:0 "[bishop.GetTitledFirstNameNoTooltip] não fica impressionad[Select_CString( bishop.IsFemale, 'a', 'o' )]"
 bishop.1011.c.success:0 "[bishop.GetTitledFirstNameNoTooltip] entende minhas motivações"
 bishop.1011.c.success_vassal:0 "[bishop.GetTitledFirstNameNoTooltip] está tão convencid[Select_CString( bishop.IsFemale, 'a', 'o' )] que [bishop.GetSheHe] recruta um colega para a causa"
 bishop.1011.c:0 "Permita-me explicar minhas razões..."
 bishop.1011.desc_beating:0 "\n\nUm grupo de fanáticos está rondando por perto, aplicando punição divina sem piedade. [Select_CString( to_beat_up.IsFemale, 'Seu', 'Seu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('to_beat_up'))] [to_beat_up.GetTitledFirstName] ainda anda sozinho pelas ruas às vezes, não é mesmo...?"
 bishop.1011.desc_cannibal:0 "\n\nDiga, [Select_CString( cannibal_food.IsFemale, 'seu', 'sua' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('cannibal_food'))] [cannibal_food.GetTitledFirstName] parece muito apetitosa. Seria uma #EMP vergonha#! se algo acontecesse a [cannibal_food.GetSheHe]..."
 bishop.1011.desc_opening:0 "Seu envolvimento na facção [faction.GetNameNoTooltip] que visa [Select_CString( targeting.IsFemale, 'a', 'o' )] [targeting.GetTitledFirstName] é bastante inconveniente. Se você não se retirar, serei forçado a tomar medidas drásticas."
 bishop.1012.desc:0 "[cannibal_food.GetTitledFirstName] desapareceu, deixando apenas uma poça de sangue para trás..."
 bishop.1012.title:0 "Desaparecimento Misterioso"
