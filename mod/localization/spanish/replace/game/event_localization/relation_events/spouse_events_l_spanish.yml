l_spanish:
 spouse.0001.a:0 "Tenho sorte de estar com alguém que me entende."
 spouse.0001.desc:0 "Quando falamos sobre a vida, m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] e eu frequentemente concordamos. Eu apenas sei que [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetFirstName] compreende como eu vejo o mundo."
 spouse.0001.t:0 "As Coisas que Compartilhamos"
 spouse.0002.a:0 "Somos ligados por mais do que apenas o casamento."
 spouse.0002.desc:0 "Outro dia, m[Select_CString( first_spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('first_spouse'))] [first_spouse.GetFirstName] mencionou que sente que sou uma das poucas pessoas que realmente entendem [first_spouse.GetSheHe]. Eu sei exatamente o que [first_spouse.GetSheHe] quer dizer com isso."
 spouse.0002.t:0 "As Coisas que Compartilhamos"
 spouse.0003.a:0 "A vida pode ser compartilhada de muitas formas."
 spouse.0003.desc:0 "Às vezes, penso que não há ninguém com quem eu prefira passar meu tempo do que com m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] [spouse.GetFirstName]. De todas as coisas para fazer nesta vida, nós gostamos de tantas delas em comum."
 spouse.0003.t:0 "As Coisas que Fazemos"
 spouse.0004.a:0 "A vida pode ser compartilhada de muitas formas."
 spouse.0004.desc:0 "De todas as pessoas na corte com quem [first_spouse.GetSheHe] poderia passar seu tempo, m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] [first_spouse.GetFirstName] passa o máximo possível comigo. [first_spouse.GetSheHe|U] realmente gosta do que fazemos juntos!"
 spouse.0004.t:0 "As Coisas que Compartilhamos"
 spouse.0005.a:0 "Estamos nisso querendo ou não."
 spouse.0005.desc:0 "Não importa quantas vezes eu tente explicar por que faço as coisas que faço, m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] não me entende completamente. [spouse.GetFirstName] e eu parecemos ser pessoas completamente diferentes."
 spouse.0005.t:0 "Discórdia Conjugal"
 spouse.0006.a:0 "[from_spouse.GetSheHe|U] não está facilitando para mim."
 spouse.0006.desc:0 "Eu não entendo m[Select_CString( from_spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('from_spouse') )] [from_spouse.GetFirstName]. [from_spouse.GetSheHe|U] tenta explicar por que faz as coisas que faz, mas não faz sentido para mim. Será que somos simplesmente muito diferentes?"
 spouse.0006.t:0 "Discórdia Conjugal"
 spouse.0007.a:0 "Isso me faz sorrir."
 spouse.0007.desc:0 "M[Select_CString( friend_in_common.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('friend_in_common') )] [friend_in_common.GetTitledFirstName] tem me dito o quanto m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] [spouse.GetFirstName] tem sido um bom amigo para [friend_in_common.GetSheHe]. Saber como m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] trata os outros me faz respeitá-lo ainda mais."
 spouse.0007.t:0 "Um Amigo de um Amigo"
 spouse.0008.a:0 "Obrigad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], [friend_in_common.GetFirstNameNoTooltip]!"
 spouse.0008.b:0 "Quanto tempo m[Select_CString( first_spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('first_spouse') )] tem passado com [friend_in_common.GetSheHe]?"
 spouse.0008.desc:0 "M[Select_CString( first_spouse.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('first_spouse') )] [first_spouse.GetFirstName] tem me enviado mais sorrisos calorosos do que o habitual, dizendo que me ver aquece seu coração. Parece que [Select_CString( friend_in_common.IsFemale, 'nossa amiga', 'nosso amigo' )] em comum, [friend_in_common.GetTitledFirstName] tem dito a [first_spouse.GetSheHe] o quão bom amigo eu sou!"
 spouse.0008.t:0 "Um Amigo de um Amigo"
 spouse.0009.a:0 "Como ousa [spouse.GetSheHe]?"
 spouse.0009.desc:0 "Apesar das minhas expressões de afeto [Select_CString( spouse.IsFemale, 'pela', 'pelo' )] [spouse.GetFirstName], tenho recebido uma resposta fria e desconfiada. Aparentemente, tenho passado tempo demais com [Select_CString( friend_in_common.IsFemale, 'a nossa amiga', 'o nosso amigo' )], [friend_in_common.GetTitledFirstName]."
 spouse.0009.has_lover_tooltip:0 "[spouse.GetFirstNameNoTooltip] não pode saber. Pode [spouse.GetSheHe]?"
 spouse.0009.t:0 "Amizade Enfrentando Suspeita"
 spouse.1001.a:0 "Talvez eu até possa vir a amar [spouse.GetSheHe], com o tempo."
 spouse.1001.desc:0 "Eu posso não ter m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] perto do meu coração, mas quanto mais tempo passo com [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetFirstName], mais eu começo a entender [spouse.GetSheHe]."
 spouse.1001.t:0 "O Tempo Que Passamos Juntos"
 spouse.1002.a:0 "Talvez [first_spouse.GetSheHe] até possa vir a me amar, com o tempo."
 spouse.1002.desc:0 "À medida que m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] e eu passamos mais tempo juntos, percebo [first_spouse.GetSheHe] se aproximando de mim. [first_spouse.GetFirstName] diz que [first_spouse.GetSheHe] continua descobrindo novos aspectos de mim."
 spouse.1002.t:0 "O Tempo Que Passamos Juntos"
 spouse.1003.a:0 "Eu tenho que viver uma vida inteira com essa pessoa."
 spouse.1003.desc:0 "Eu não tenho m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] perto do meu coração, e quanto mais tempo passo com [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetFirstName], mais eu começo a entender por que é assim. Tudo que [spouse.GetSheHe] faz me irrita, só um pouco."
 spouse.1003.t:0 "O Tempo Que Passamos Juntos"
 spouse.1004.a:0 "Vamos passar um pouco menos de tempo juntos, por um tempo."
 spouse.1004.desc:0 "Eu não posso estar imaginando. M[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('spouse'))|U] [first_spouse.GetFirstName] parece ficar cada vez mais irritado quanto mais tempo passamos juntos. Se eu não soubesse melhor, diria que estou irritando m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))]."
 spouse.1004.t:0 "O Tempo Que Passamos Juntos"
 spouse.2001.a:0 "Ninguém me faz sorrir como [Select_CString( spouse.IsFemale, 'minha querida', 'meu querido' )] [spouse.GetFirstNameNoTooltip]."
 spouse.2001.ambitious:0 "\n\n[spouse.GetSheHe|U] me lembra por que faço o que faço e quais serão as recompensas no final."
 spouse.2001.arbitrary:0 "\n\n[spouse.GetSheHe|U] me ajuda escolhendo quais tarefas devo garantir que sejam concluídas e quais posso deixar de lado."
 spouse.2001.arrogant:0 "\n\n[spouse.GetSheHe|U] me lembra que estou fazendo o que escolho e que ninguém pode realmente me julgar exceto [ROOT.Char.GetFaith.HighGodName]."
 spouse.2001.brave:0 "\n\n[spouse.GetSheHe|U] me encoraja a enfrentar meus desafios de frente e não deixar a pressão me derrubar."
 spouse.2001.callous:0 "\n\n[spouse.GetSheHe|U] não tem paciência para os \"cretinos\" que desperdiçam meu tempo, e [spouse.GetSheHe] felizmente deixa que eles saibam disso."
 spouse.2001.calm:0 "\n\n[spouse.GetSheHe|U] considera tudo com equilíbrio, ajudando-me a administrar todos os assuntos que não são de importância imediata."
 spouse.2001.chaste:0 "\n\n[spouse.GetSheHe|U] me faz sentir que [spouse.GetSheHe] está comigo em espírito através de todos os meus problemas."
 spouse.2001.compassionate:0 "\n\n[spouse.GetSheHe|U] é tão gentil e atencioso, ouvindo minhas preocupações e compartilhando o conselho e o apoio que [spouse.GetSheHe] pode."
 spouse.2001.content:0 "\n\n[spouse.GetSheHe|U] me lembra que, em última análise, não importa tanto assim. As coisas serão boas, mesmo que algumas das minhas tarefas fiquem por fazer."
 spouse.2001.craven:0 "\n\n[spouse.GetSheHe|U] sempre me ajuda a escapar das tarefas que menos quero realizar."
 spouse.2001.cynical:0 "\n\n[spouse.GetSheHe|U] me dá sorrisos reconfortantes e me diz que, no final, não importa o que eu faça, o importante é que as pessoas me vejam fazendo as coisas."
 spouse.2001.deceitful:0 "\n\n[spouse.GetSheHe|U] está sempre lá para me dizer que tudo ficará bem."
 spouse.2001.diligent:0 "\n\nQuando tudo fica demais, [spouse.GetSheHe] me ajuda, assumindo a pena ou o cetro, sem nunca reclamar."
 spouse.2001.fickle:0 "\n\n[spouse.GetSheHe|U] sempre encontra novas coisas para eu fazer, para tirar minha mente das coisas que pesam sobre meus ombros."
 spouse.2001.forgiving:0 "\n\n[spouse.GetSheHe|U] demonstra grande compreensão pela minha situação e me avisa que, assim que esses tempos estressantes terminarem, meu descuido de outros aspectos da minha vida será perdoado."
 spouse.2001.generous:0 "\n\n[spouse.GetSheHe|U] se dedica muito para me apoiar."
 spouse.2001.gluttonous:0 "\n\n[spouse.GetSheHe|U] sabe exatamente quando preciso ser distraído com comida e bebida deliciosas."
 spouse.2001.greedy:0 "\n\n[spouse.GetSheHe|U] sempre parece encontrar novas oportunidades para eu alcançar meus objetivos."
 spouse.2001.gregarious:0 "\n\nQuando novos assuntos são trazidos para a minha consideração, [spouse.GetSheHe] sabe como afastá-los como ninguém."
 spouse.2001.honest:0 "\n\n[spouse.GetSheHe|U] sempre me diz que, apesar de haver muito a fazer, [spouse.GetSheHe] realmente acredita que eu posso fazer isso."
 spouse.2001.humble:0 "\n\n[spouse.GetSheHe|U] me lembra como meu trabalho é meu dever e como o mais importante é completá-lo com honra."
 spouse.2001.impatient:0 "\n\n[spouse.GetSheHe|U] sempre encontra maneiras de eu concluir meu trabalho mais rápido e terminar o meu dia."
 spouse.2001.just:0 "\n\n[spouse.GetSheHe|U] me mantém focado em dar a devida consideração e julgamento a cada assunto."
 spouse.2001.lazy:0 "\n\n[spouse.GetSheHe|U] garante que eu descanse adequadamente quando necessário."
 spouse.2001.lustful:0 "\n\n[spouse.GetSheHe|U] me revigora em noites apaixonadas, lembrando-me da paixão de que preciso para superar meus obstáculos."
 spouse.2001.opening:0 "Com tantas coisas para fazer e tão pouco tempo, não sei como lidaria se não fosse pelo [Select_CString( spouse.IsFemale, 'minha amada', 'meu amado' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('spouse'))] [spouse.GetFirstName]."
 spouse.2001.paranoid:0 "\n\n[spouse.GetSheHe|U] me aponta quem está trabalhando ativamente para me causar problemas e a quem devo, portanto, desapontar voluntariamente."
 spouse.2001.patient:0 "\n\n[spouse.GetSheHe|U] garante que eu tome o tempo necessário com tudo o que precisa ser feito, lembrando-me que, por mais tempo que leve, eu conseguirei superar."
 spouse.2001.sadistic:0 "\n\nÀ medida que minha miséria aumenta, o sorriso [spouse.GetHerHim] se torna cada vez mais amplo para me apoiar, enquanto luto para cumprir minhas obrigações."
 spouse.2001.shy:0 "\n\n[spouse.GetSheHe|U] me ajuda a me esconder do meu conselheiro e dos mensageiros que trazem ainda mais assuntos para consideração."
 spouse.2001.stubborn:0 "\n\n[spouse.GetSheHe|U] me encoraja a seguir em frente, garantindo que eu não desista até o trabalho estar feito."
 spouse.2001.t:0 "Um Conforto"
 spouse.2001.temperate:0 "\n\n[spouse.GetSheHe|U] me lembra que todas as coisas devem ser feitas com moderação, para que eu não me esgote."
 spouse.2001.trusting:0 "\n\n[spouse.GetSheHe|U] mantém minha mente em quem conta comigo para cumprir meu dever como senhor feudal e que todos têm que fazer sua parte de boa fé."
 spouse.2001.vengeful:0 "\n\n[spouse.GetSheHe|U] tem palavras ferozes para aqueles que exigiram muito de mim, e é um alívio ouvi-lo amaldiçoando seus nomes."
 spouse.2001.wrathful:0 "\n\n[spouse.GetSheHe|U] dispensa assuntos não importantes em meu nome, amaldiçoando os mensageiros que trazem cartas fúteis."
 spouse.2001.zealous:0 "\n\nQuando tudo fica demais, [spouse.GetSheHe] me ajuda a rezar, para que [ROOT.Char.GetFaith.HighGodName] me dê a força que eu preciso."
 spouse.2002.a:0 "Deixe-me falar sobre m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))]..."
 spouse.2002.b:0 "Deixe-me falar sobre mim mesmo..."
 spouse.2002.desc:0 "Durante uma visita, parece que consegui chamar a atenção d[Select_CString( told_of_character.IsFemale, 'a', 'o' )] [told_of_character.GetFirstName], por mais breve que tenha sido. Este pode ser um momento oportuno para elogiar [Select_CString( spouse.IsFemale, 'minha querida', 'meu querido' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] [spouse.GetFirstName]."
 spouse.2002.t:0 "Uma Boa Palavra"
 spouse.2003.a:0 "Obrigado por me mostrar, [initial_spouse.GetFirstNameNoTooltip]!"
 spouse.2003.exceptional:0 "\n\nPara ser honesto, eu não tinha percebido completamente o quão incrível é [spouse.GetSheHe] antes disso!"
 spouse.2003.opening:0 "Durante uma visita recente, [initial_spouse.GetTitledFirstName] falou extensamente sobre s[Select_CString( spouse.IsFemale, 'ua', 'eu' )] [initial_spouse.Custom2('RelationToMe', SCOPE.sC('spouse'))], [spouse.GetTitledFirstName]."
 spouse.2003.t:0 "Um[Select_CString( spouse.IsFemale, 'a', '' )] [spouse.GetWomanMan|U] Dign[Select_CString( spouse.IsFemale, 'a', 'o' )] de Elogios"
 spouse.2004.a:0 "O que eu faria sem [Select_CString( initial_spouse.IsFemale, 'minha querida', 'meu querido' )] [initial_spouse.GetFirstNameNoTooltip]."
 spouse.2004.exceptional:0 "\n\nSeja lá o que [initial_spouse.GetSheHe] disse, deve ter causado uma grande impressão! Antes de partir, [told_of_character.GetFirstName] se aproximou e me deu um abraço amigável!"
 spouse.2004.opening:0 "Durante uma visita recente, m[Select_CString( initial_spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('initial_spouse'))] [initial_spouse.GetFirstName] falou extensamente com [Select_CString( told_of_character.IsFemale, 'a', 'o' )] [told_of_character.GetTitledFirstName]."
 spouse.2004.t:0 "O Apoio [Select_CString( told_of_character.IsFemale, 'da Minha', 'do Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('told_of_character'))]"
 spouse.2005.a:0 "Eu mal precisei exagerar sobre [spouse.GetSheHe]."
 spouse.2005.desc:0 "Parece que [Select_CString( told_of_character.IsFemale, 'a', 'o' )] [told_of_character.GetTitledFirstName] ficou muito impressionado com a maneira como eu falei d[Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetFirstName]! Antes de partir, [told_of_character.GetTitledFirstName] até abraçou [spouse.GetSheHe]!"
 spouse.2005.t:0 "Ouvindo Atentamente"
 spouse.2006.a:0 "Obrigado por me mostrar, [initial_spouse.GetFirstNameNoTooltip]."
 spouse.2006.good:0 "\n\n[initial_spouse.GetSheHe|U] me deu uma nova perspectiva sobre o que devo respeitar em [spouse.GetFirstName]."
 spouse.2006.t:0 "Um[Select_CString( spouse.IsFemale, 'a', '' )] [spouse.GetWomanMan|U] Dign[Select_CString( spouse.IsFemale, 'a', 'o' )] de Elogios"
 spouse.2007.a:0 "O que eu faria sem [Select_CString( initial_spouse.IsFemale, 'minha querida', 'meu querido' )] [initial_spouse.GetFirstNameNoTooltip]."
 spouse.2007.good:0 "\n\nSeja lá o que [initial_spouse.GetSheHe] disse, deve ter causado uma boa impressão. Antes de partir, [told_of_character.GetFirstName] segurou meu ombro com um sorriso!"
 spouse.2007.t:0 "O Apoio [Select_CString( initial_spouse.IsFemale, 'da Minha', 'do Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('initial_spouse'))]"
 spouse.2008.a:0 "Tudo o que eu fiz foi dizer a verdade."
 spouse.2008.desc:0 "Parece que [Select_CString( told_of_character.IsFemale, 'a', 'o' )] [told_of_character.GetTitledFirstName] ficou muito impressionado com a maneira como eu falei d[Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetFirstName]! Eles estão se dando melhor do que nunca."
 spouse.2008.t:0 "Ouvindo Atentamente"
 spouse.2009.a:0 "Obrigado por me mostrar, [initial_spouse.GetFirstNameNoTooltip]..."
 spouse.2009.bad:0 "\n\nNão tenho certeza se foi intencional, mas ouvindo [Select_CString( initial_spouse.IsFemale, 'a', 'o' )] [initial_spouse.GetFirstName], comecei a pensar se tenho dado crédito demais [Select_CString( spouse.IsFemale, 'a', 'ao' )] [spouse.GetFirstName]."
 spouse.2009.t:0 "Um[Select_CString( spouse.IsFemale, 'a', '' )] [spouse.GetWomanMan] Dign[Select_CString( spouse.IsFemale, 'a', 'o' )] de Desconfiança"
 spouse.2010.a:0 "O que eu faria sem [Select_CString( initial_spouse.IsFemale, 'minha querida', 'meu querido' )] [initial_spouse.GetFirstNameNoTooltip]..."
 spouse.2010.desc:0 "\n\nSeja lá o que [initial_spouse.GetSheHe] disse, deve ter deixado um gosto ruim para [Select_CString( told_of_character.IsFemale, 'a', 'o' )] [told_of_character.GetFirstName]. Ao partir, [told_of_character.GetSheHe] apenas me olhou, balançando a cabeça."
 spouse.2010.t:0 "O Apoio [Select_CString( told_of_character.IsFemale, 'da Minha', 'do Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('told_of_character'))]"
 spouse.2011.a:0 "O que eu fiz?"
 spouse.2011.desc:0 "Não importa o quanto eu tente me corrigir, tudo o que eu disse sobre m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] saiu como um insulto, em vez de elogio! Ao partir, [told_of_character.GetFirstName] apenas balançou a cabeça para [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetFirstName]."
 spouse.2011.t:0 "Ouvindo Atentamente"
 spouse.2012.a.tt:0 "O segredo é revelado para [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetTitledFirstName]"
 spouse.2012.a:0 "Vou compartilhar esse segredo com [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetFirstNameNoTooltip]."
 spouse.2012.b:0 "Algumas coisas são melhor deixadas no escuro."
 spouse.2012.secret_about_me:0 "Há coisas que sinto que não posso esconder [Select_CString( spouse.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))]. Eu sei que [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetFirstName] entenderia."
 spouse.2012.secret_about_other:0 "Estou pensando em compartilhar algo com m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] da próxima vez que estivermos a sós, longe de ouvidos curiosos.\n\nAs coisas que descobri sobre [Select_CString( owner_of_secret.IsFemale, 'a', 'o' )] [owner_of_secret.GetTitledFirstName] seriam de grande interesse para [spouse.GetSheHe]."
 spouse.2012.secret_about_spouse:0 "Há coisas que sei sobre [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetFirstName]. M[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] não pode continuar vivendo na ignorância."
 spouse.2012.t:0 "Confidencialidade Conjugal"
 spouse.2013.a:0 "Verdade? Nunca teria imaginado!"
 spouse.2013.opening:0 "M[Select_CString( first_spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('first_spouse'))] [first_spouse.GetFirstName] me levou para o lado e olhou para mim com uma expressão séria."
 spouse.2013.secret_about_me:0 "\n\n\"Eu tenho um segredo para confessar\", [first_spouse.GetSheHe] disse. Quando [first_spouse.GetSheHe] se inclinou e sussurrou em meu ouvido, meus olhos se arregalaram."
 spouse.2013.secret_about_other:0 "\n\n\"Tenho que te contar algo,\" [first_spouse.GetSheHe] disse. \"Algo sobre [Select_CString( owner_of_secret.IsFemale, 'a', 'o' )] [owner_of_secret.GetTitledFirstName].\" \nQuando [first_spouse.GetSheHe] se inclinou e sussurrou em meu ouvido, meus olhos se arregalaram."
 spouse.2013.secret_about_spouse:0 "\n\n\"Há algo que você precisa saber\", [first_spouse.GetSheHe] disse. Quando [first_spouse.GetSheHe] se inclinou e sussurrou em meu ouvido, meus olhos se arregalaram."
 spouse.2013.t:0 "Confidencialidade Conjugal"
 spouse.2014.a:0 "M[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('spouse'))] precisa ser alertado!"
 spouse.2014.b:0 "Provavelmente estou enganado."
 spouse.2014.desc:0 "Há algo de estranho na forma como [Select_CString( agent.IsFemale, 'a', 'o' )] [agent.GetTitledFirstName] age ao redor [Select_CString( spouse.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] quando [agent.GetSheHe] pensa que ninguém está olhando. Eu vejo [agent.GetSheHe] lançando olhares de relance, vagando pelos corredores vazios e prestando muita atenção em cada movimento d[Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetFirstNamePossessive].\n\nEu temo que [agent.GetSheHe] esteja tramando algo."
 spouse.2014.reveal_tt:0 "[spouse.GetTitledFirstName] será alertado de que [Select_CString( agent.IsFemale, 'a', 'o' )] [agent.GetTitledFirstName] está tramando algo."
 spouse.2014.t:0 "Uma Ameaça?"
 spouse.2015.a:0 "Obrigado pelo aviso, [Select_CString( spouse.IsFemale, 'minha querida', 'meu querido' )] [first_spouse.Custom2('RelationToMe', SCOPE.sC('spouse'))]!"
 spouse.2015.b:0 "Será que posso realmente confiar [Select_CString( first_spouse.IsFemale, 'na', 'no' )] [first_spouse.GetFirstNameNoTooltip]?"
 spouse.2015.desc:0 "M[Select_CString( first_spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('first_spouse'))] veio até mim, com um olhar preocupado em seus olhos. Baixando a voz, [first_spouse.GetFirstName] me contou sobre um comportamento altamente suspeito que [first_spouse.GetSheHe] observou [Select_CString( agent.IsFemale, 'na', 'no' )] [agent.GetTitledFirstName]. [first_spouse.GetFirstName] acusou diretamente [agent.GetSheHe] de conluio com forças ardilosas!"
 spouse.2015.t:0 "Uma Ameaça?"
 spouse.3001.a:0 "Por que você me odeia tanto?!"
 spouse.3001.arrogant:0 "[spouse.GetFirstName] está furios[Select_CString( spouse.IsFemale, 'a', 'o' )] com minhas responsabilidades pesadas, mas não por preocupação com meu bem-estar. Não, [spouse.GetSheHe] espera que eu priorize [spouse.GetSheHe] em relação às minhas obrigações com [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]!"
 spouse.3001.callous:0 "Depois de um dia longo e tedioso, anseio por compaixão e encorajamento. [spouse.GetFirstName] oferece apenas observações penetrantes e rejeição fria."
 spouse.3001.deceitful:0 "Ultimamente, descobri tantas mentiras. A maioria delas são coisas insignificantes, mas a dúvida me assalta. O que mais m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] está escondendo...?"
 spouse.3001.desc.end:0 "\n\nVocê pensaria que [spouse.GetSheHe] está fazendo o melhor para tornar minha vida um tormento sem fim!"
 spouse.3001.desc.fallback:0 "Sempre há coisas que não faço bem o suficiente, e uma nova reclamação todos os dias."
 spouse.3001.desc.opening:0 "Como se eu já não tivesse problemas demais para lidar, também tenho que lidar com m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))]!"
 spouse.3001.impatient:0 "\n\nÉ dever [spouse.GetHerHim] me apoiar e entender, mas [spouse.GetSheHe] não tem paciência. Mesmo sufocado sob o peso de minhas responsabilidades, [spouse.GetFirstName] só se preocupa com promessas não cumpridas e falta de atenção."
 spouse.3001.lazy:0 "[spouse.GetSheHe|U] nunca está disposto a me dar uma mão. Quando estou mais ocupado, [spouse.GetSheHe] faz questão de cochilar e fofocar, bem debaixo do meu nariz!"
 spouse.3001.paranoid:0 "[spouse.GetFirstName] fica me culpando por coisas que eu nunca fiz, e isso está testando minha paciência. Estou tentado a assumir a culpa pela próxima acusação a [spouse.GetSheHe]."
 spouse.3001.sadistic:0 "\n\nEstou lutando para dar a devida atenção a minhas inúmeras responsabilidades e sinto que estou me esgotando. Uma vez, pensei que encontraria apoio [Select_CString( spouse.IsFemale, 'na', 'no' )] [spouse.GetFirstName], mas não sou mais tão tolo. Acho que [spouse.GetSheHe] realmente encontra prazer no meu sofrimento!"
 spouse.3001.t:0 "Miséria Conjugal"
 spouse.3001.vengeful:0 "Eu admito, sou apenas um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] e tenho meus defeitos, mas [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetFirstName] é excessivamente falh[Select_CString( spouse.IsFemale, 'a', 'o' )]! [spouse.GetSheHe|U] lembra de cada erro que já cometi e, pior ainda, continua me punindo por eles."
 spouse.3001.wrathful:0 "Eu juro pelo [ROOT.Char.GetFaith.HighGodName], o temperamento [spouse.GetHerHim] está me enlouquecendo. As birras, as brigas e as rixas intermináveis... Minha paciência está se esgotando."
 spouse.3002.a.bad:0 "Palavras de Desonra"
 spouse.3002.a.bad_tt:0 "#F [told_of_character.GetFirstNameNoTooltip] está insultad[Select_CString( told_of_character.IsFemale, 'a', 'o' )] que eu falei [Select_CString( spouse.IsFemale, 'da minha', 'do meu' )] [THIS.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] dessa forma#!"
 spouse.3002.a.good:0 "Histórias Preocupantes"
 spouse.3002.a.good_tt:0 "#F [told_of_character.GetFirstNameNoTooltip] é influenciad[Select_CString( told_of_character.IsFemale, 'a', 'o' )] por minhas palavras#!"
 spouse.3002.a.great:0 "Histórias Convincentes"
 spouse.3002.a.great_tt:0 "#F [told_of_character.GetFirstNameNoTooltip] está chocad[Select_CString( told_of_character.IsFemale, 'a', 'o' )]#!"
 spouse.3002.a:0 "Deixe-me contar algumas coisas, [told_of_character.GetFirstNameNoTooltip]."
 spouse.3002.b:0 "Não posso agir às escondidas [Select_CString( spouse.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMePossessive' , SCOPE.sC('spouse') )] dessa forma."
 spouse.3002.desc:0 "Durante uma visita, parece que consegui chamar a atenção d[Select_CString( told_of_character.IsFemale, 'a', 'o' )] [told_of_character.GetTitledFirstName], mesmo que por pouco tempo. Este pode ser um momento oportuno para contar a [told_of_character.GetSheHe] o que [told_of_character.GetSheHe] realmente deveria pensar sobre m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] [spouse.GetFirstName]."
 spouse.3002.t:0 "Oportunidade para um Acerto de Contas"
 spouse.3003.a:0 "Eu fui muito gentil, [spouse.GetFirstNameNoTooltip]!"
 spouse.3003.exceptional:0 "\n\nEu tinha grande estima [Select_CString( spouse.IsFemale, 'pela', 'pelo' )] [spouse.GetFirstName], mas o que [Select_CString( initial_spouse.IsFemale, 'a', 'o' )] [initial_spouse.GetSheHe] me contou me horrorizou completamente!"
 spouse.3003.opening:0 "Durante uma visita recente, passei um tempo conversando com [Select_CString( initial_spouse.IsFemale, 'a', 'o' )] [initial_spouse.GetTitledFirstName], [spouse.GetTitledFirstNamePossessive]."
 spouse.3003.t:0 "Uma Conversa Preocupante"
 spouse.3004.a:0 "O que você contou a [told_of_character.GetSheHe]?!"
 spouse.3004.exceptional:0 "\n\nMeus piores temores foram confirmados quando [Select_CString( told_of_character.IsFemale, 'a', 'o' )] [told_of_character.GetFirstName] se recusou a sequer me olhar antes de nos separarmos!"
 spouse.3004.opening:0 "Durante uma visita recente, [told_of_character.GetTitledFirstName] passou uma quantidade desconcertante de tempo ouvindo [Select_CString( initial_spouse.IsFemale, 'a', 'o' )] [initial_spouse.GetFirstName], m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] nem um pouco amoros[Select_CString( spouse.IsFemale, 'a', 'o' )]."
 spouse.3004.t:0 "Uma Conversa Preocupante"
 spouse.3005.a:0 "Oh, é verdade. Tudo isso."
 spouse.3005.exceptional:0 "As coisas que eu disse sobre m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] claramente causaram uma impressão. Os olhos [told_of_character.GetHerHim] se arregalaram e [told_of_character.GetSheHe] murmurou incrédulo. \"Não pode ser...\""
 spouse.3005.t:0 "Um Bom Ouvinte"
 spouse.3006.a:0 "Eu fui muito gentil, [spouse.GetFirstNameNoTooltip]."
 spouse.3006.good:0 "\n\nEu tinha grande estima [Select_CString( spouse.IsFemale, 'pela', 'pelo' )] [spouse.GetFirstName], mas o que [initial_spouse.GetSheHe] me contou o retrata como uma decepção."
 spouse.3006.t:0 "Uma Conversa Preocupante"
 spouse.3007.a:0 "O que você contou a [told_of_character.GetSheHe]?"
 spouse.3007.good:0 "\n\nEu tinha motivos para ficar preocupad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], pois ao partir, [told_of_character.GetFirstName] apenas balançou a cabeça para mim."
 spouse.3007.t:0 "Uma Conversa Preocupante"
 spouse.3008.a:0 "Não deveria me surpreender o quanto isso me agrada."
 spouse.3008.good:0 "Devo ter causado uma boa impressão com as coisas que contei [Select_CString( told_of_character.IsFemale, 'a', 'ao' )] [told_of_character.GetFirstName] sobre m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))], pois na hora de partir, [told_of_character.GetSheHe] simplesmente balançou a cabeça em desaprovação para [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetFirstName]."
 spouse.3008.t:0 "Um Bom Ouvinte"
 spouse.3009.a:0 "Um[Select_CString( spouse.IsFemale, 'a', '' )] [spouse.GetWomanMan] dign[Select_CString( spouse.IsFemale, 'a', 'o' )] do meu respeito."
 spouse.3009.bad:0 "\n\nEu sempre tive [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetFirstName] em alta estima, e o que [initial_spouse.GetSheHe] me contou deixa claro que eu estava certo em fazer isso!"
 spouse.3009.t:0 "Uma Surpresa Positiva"
 spouse.3010.a:0 "M[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('spouse'))] falou bem de mim? Sério?"
 spouse.3010.bad:0 "\n\nEu não precisava ter me preocupado, pois [Select_CString( told_of_character.IsFemale, 'a', 'o' )] [told_of_character.GetFirstName] me contou depois que [Select_CString( initial_spouse.IsFemale, 'a', 'o' )] [initial_spouse.GetFirstName] mostrou a ele lados meus que [told_of_character.GetSheHe] não tinha apreciado devidamente antes!"
 spouse.3010.t:0 "Uma Surpresa Positiva"
 spouse.3011.a:0 "O que eu fiz?"
 spouse.3011.bad:0 "Por mais que eu tenha tentado denegrir [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetFirstName], [told_of_character.GetFirstName] achou que eu estava elogiando [spouse.GetSheHe]! Agora eles parecem estar se dando melhor do que nunca."
 spouse.3011.t:0 "Um Terrível Mal-entendido"
 spouse.3012.a:0 "[spouse.GetFirstNameNoTooltip] deve ser informado desta \"ameaça\"!"
 spouse.3012.agent_probably_innocent:0 "\n\nAfirmar que eu observei um comportamento altamente suspeito d[Select_CString( agent.IsFemale, 'a', 'o' )] [agent.GetTitledFirstName] deve fazer [spouse.GetSheHe] se sentir um pouco menos confortável."
 spouse.3012.agent_suspicious:0 "\n\nCompartilhar o comportamento suspeito que eu vi [Select_CString( agent.IsFemale, 'na', 'no' )] [agent.GetTitledFirstName] deve fazer [spouse.GetSheHe] se sentir um pouco menos confortável."
 spouse.3012.b:0 "Eu nem vou fingir em ajudar m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))]."
 spouse.3012.false_reveal_tt:0 "[spouse.GetFirstNameNoTooltip] será \"avisad[Select_CString( spouse.IsFemale, 'a', 'o' )]\" sobre [Select_CString( agent.IsFemale, 'a', 'o' )] [agent.GetFirstNameNoTooltip]."
 spouse.3012.opening:0 "Apesar de [spouse.GetSheHe] ser uma pessoa inútil, m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] [spouse.GetFirstName] parece muito confortável com a vida na corte."
 spouse.3012.t:0 "Uma Ameaça..."
 spouse.3013.a:0 "Será que posso realmente confiar [Select_CString( initial_spouse.IsFemale, 'na', 'no' )] [initial_spouse.GetFirstNameNoTooltip] nisso?"
 spouse.3013.desc:0 "M[Select_CString( initial_spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('initial_spouse'))] veio até mim, com um olhar preocupado em seus olhos. Baixando a voz, [initial_spouse.GetFirstName] me contou sobre um comportamento altamente suspeito que [initial_spouse.GetSheHe] observou [Select_CString( agent.IsFemale, 'na', 'no' )] [agent.GetTitledFirstName]. [initial_spouse.GetFirstName] acusou diretamente [agent.GetSheHe] de conluio com forças ardilosas!"
