l_spanish:
 aloof_but_alluring_modifier:0 "Distante, mas Sedutor"
 aloof_but_alluring_modifier_desc:0 "Esse personagem parece impossível de se conversar, mas cultiva um fascínio inegável..."
 driven_by_vengeance_modifier:0 "Movido pela Vingança"
 driven_by_vengeance_modifier_desc:0 "Este personagem encontra motivação em buscar o fim de seus rivais."
 inured_to_boredom_modifier:0 "Acostumado ao Tédio"
 inured_to_boredom_modifier_desc:0 "Esse personagem está acostumad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] ao tédio social."
 relation_upgrade.0001.book:0 "Folhear o [ROOT.Char.GetFaith.ReligiousText] é sempre uma boa forma de passar o tempo."
 relation_upgrade.0001.desc.book:0 "Eu poderia passar o tempo lendo [ROOT.Char.GetFaith.ReligiousText] enquanto espero."
 relation_upgrade.0001.desc.drink:0 "Acabei de notar um comerciante descarregando um carrinho de [ROOT.Char.Custom('GetExpensiveDrink')]..."
 relation_upgrade.0001.desc.food:0 "Acabei de sentir o delicioso aroma de [ROOT.Char.Custom('GetExpensiveMeal')] vindo da cozinha..."
 relation_upgrade.0001.desc.friend:0 "Olhando ao redor, percebo [friend.Custom2('MyCharacterIntroduction', ROOT.Char)|U] sentad[Select_CString( friend.IsFemale, 'a', 'o' )] sob uma tenda próxima, claramente entediad[Select_CString( friend.IsFemale, 'a', 'o' )] até a medula."
 relation_upgrade.0001.desc.gossip:0 "esta poderia ser uma boa oportunidade para ouvir conversas de outros presentes."
 relation_upgrade.0001.desc.lover:0 "Olhando ao redor, percebo [lover.Custom2('MyCharacterIntroduction', ROOT.Char)] sentad[Select_CString( lover.IsFemale, 'a', 'o' )] ao meu lado nas arquibancadas, aparentemente bastante solitári[Select_CString( lover.IsFemale, 'a', 'o' )]."
 relation_upgrade.0001.desc.opening:0 "Como [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip], sou obrigad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a comparecer a um torneio [ROOT.Char.Custom('MartialTournamentAdjective')] local, mas os competidores estão atrasados — o torneio não começará por pelo menos mais uma hora.\n\n"
 relation_upgrade.0001.desc.prowess:0 "esta poderia ser uma boa oportunidade para mostrar minha habilidade e ao mesmo tempo entreter a multidão."
 relation_upgrade.0001.desc.rival:0 "[rival.Custom2('MyCharacterIntroduction', ROOT.Char)|U] está aqui e, como sempre, está sendo um insuportável imbecil. [rival.GetSheHe|U] reclamações constantes estão tornando todos #EMP ainda mais#! miseráveis do que o normal."
 relation_upgrade.0001.desc.second_bridge:0 "\n\nPor outro lado,"
 relation_upgrade.0001.desc.second_friend:0 "\n\nEnquanto isso, [friend.Custom2('MyCharacterIntroduction', ROOT.Char)] está sentad[Select_CString( friend.IsFemale, 'a', 'o' )] sob a tenda, claramente entediad[Select_CString( friend.IsFemale, 'a', 'o' )] até a medula..."
 relation_upgrade.0001.desc.second_lover:0 "\n\nEnquanto isso, [lover.Custom2('MyCharacterIntroduction', ROOT.Char)] está sentad[Select_CString( lover.IsFemale, 'a', 'o' )] ao meu lado nas arquibancadas, aparentemente bastante solitári[Select_CString( lover.IsFemale, 'a', 'o' )]..."
 relation_upgrade.0001.drink:0 "Uma boa bebida sempre melhora meu humor!"
 relation_upgrade.0001.food:0 "Uma boa refeição sempre melhora meu humor!"
 relation_upgrade.0001.friend:0 "Passar um tempo com [Select_CString( friend.IsFemale, 'a', 'o' )] [friend.GetFirstNameNoTooltip] sob a tenda."
 relation_upgrade.0001.gossip.tt:0 "Você descobre um segredo aleatório do reino"
 relation_upgrade.0001.gossip:0 "Tenho certeza de que alguém aqui sabe de algo..."
 relation_upgrade.0001.lover:0 "Pedir [Select_CString( lover.IsFemale, 'a', 'ao' )] [lover.GetFirstNameNoTooltip] para me acompanhar para uma \"[ROOT.Char.Custom('MartialTournamentAdjective')]\"."
 relation_upgrade.0001.opt_out:0 "Já perdi tempo demais com esse desastre..."
 relation_upgrade.0001.prowess:0 "Vou fazer a multidão me aplaudir!"
 relation_upgrade.0001.rival:0 "Empurrar [Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetFirstNameNoTooltip] para dentro do cocho dos cavalos para animar as coisas."
 relation_upgrade.0001.t:0 "Problemas no Torneio"
 relation_upgrade.0011.desc.friend:0 "Enquanto estou esperando sob a tenda por algo acontecer, [source.Custom2('MyCharacterIntroduction', ROOT.Char)] se aproxima de minha mesa e senta-se. 'Que torneio, não é? De qualquer forma, como você tem passado?'"
 relation_upgrade.0011.desc.lover:0 "Enquanto estou esperando os competidores aparecerem, [source.Custom2('MyCharacterIntroduction', ROOT.Char)] se aproxima de mim e me convida para participar de um \"[ROOT.Char.Custom('MartialTournamentAdjective')]\"."
 relation_upgrade.0011.desc.opening:0 "$relation_upgrade.0001.desc.opening$"
 relation_upgrade.0011.desc.rival:0 "Enquanto lamento o quão mal organizado é o torneio, [source.Custom2('MyCharacterIntroduction', ROOT.Char)] de repente se aproxima de mim e me empurra direto para dentro do cocho de água dos cavalos, fazendo com que todos ao redor caiam na risada!"
 relation_upgrade.0011.friend.accept.toast:0 "Você e [Select_CString( friend.IsFemale, 'a', 'o' )] [friend.GetFirstNameNoTooltip] começam a se conhecer melhor"
 relation_upgrade.0011.friend.accept:0 "Ah, é bom te ver, [source.GetFirstNameNoTooltip]!"
 relation_upgrade.0011.friend.decline.toast:0 "[friend.GetFirstNameNoTooltip] não está interessad[Select_CString( friend.IsFemale, 'a', 'o' )]"
 relation_upgrade.0011.friend.decline:0 "Oh, me desculpe, estava de saída..."
 relation_upgrade.0011.lover.accept.toast:0 "[lover.GetFirstNameNoTooltip] aceita minha proposta"
 relation_upgrade.0011.lover.accept:0 "Isso parece mais divertido do que isso..."
 relation_upgrade.0011.lover.decline.toast:0 "[lover.GetFirstNameNoTooltip] ri da minha proposta"
 relation_upgrade.0011.lover.decline:0 "Ha, boa piada... você #EMP estava#! brincando, certo?"
 relation_upgrade.0011.rival.accept.toast:0 "[rival.GetFirstNameNoTooltip] se ofende"
 relation_upgrade.0011.rival.accept:0 "Como #EMP se atreve#!?"
 relation_upgrade.0011.rival.decline.toast:0 "[rival.GetFirstNameNoTooltip] acha graça e ri"
 relation_upgrade.0011.rival.decline:0 "Acho que foi #EMP meio#! engraçado..."
 relation_upgrade.0011.t:0 "$relation_upgrade.0001.t$"
 relation_upgrade.1001.a.tt:0 "Aguardando uma resposta..."
 relation_upgrade.1001.a:0 "Talvez eu possa conhecer melhor [Select_CString( potential_friend.IsFemale, 'a', 'o' )] [potential_friend.GetFirstNameNoTooltip]?"
 relation_upgrade.1001.b.tt:0 "$relation_upgrade.1001.a.tt$"
 relation_upgrade.1001.b:0 "[potential_lover.GetFirstNameNoTooltip], você gostaria de dar um passeio ao luar?"
 relation_upgrade.1001.c.tt:0 "[potential_rival.GetFirstNameNoTooltip] reage ao seu ataque..."
 relation_upgrade.1001.c:0 "Ei [potential_rival.GetFirstNameNoTooltip], quer ouvir o que eu #EMP realmente#! penso de você?"
 relation_upgrade.1001.d.tt_fail:0 "Claramente #EMP VOCÊ#! arruinou a festa d[Select_CString( terrible_party_host.IsFemale, 'a', 'o' )] [terrible_party_host.GetFirstNamePossessiveNoTooltip]"
 relation_upgrade.1001.d.tt_success.list:0 "Todos os [guests|E] e [courtiers|E] na festa"
 relation_upgrade.1001.d.tt_success:0 "Você anima a festa!"
 relation_upgrade.1001.d:0 "Vamos dançar!"
 relation_upgrade.1001.desc.friend:0 "[potential_friend.GetFirstName] me acena amigavelmente de uma sacada próxima."
 relation_upgrade.1001.desc.intro:0 "Por [ROOT.GetCharacter.GetFaith.HighGodName], essa festa está #EMP entediante#! [terrible_party_host.GetFirstName] deve ser [Select_CString( terrible_party_host.IsFemale, 'a', 'o' )] pior anfitri[Select_CString( terrible_party_host.IsFemale, 'ã', 'ão' )] que o mundo já #EMP viu#!. Como pode ser esperado que um[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] [ROOT.GetCharacter.GetWomanMan] mortal suporte essa celebração monótona da mediocridade?\n\nMeus olhos vasculham o ambiente, procurando por alguma distração, qualquer coisa."
 relation_upgrade.1001.desc.lover:0 "[potential_lover.GetFirstName] suspira melancolicamente enquanto passa por mim."
 relation_upgrade.1001.desc.outro:0 "Eu preciso fazer #EMP alguma coisa#! para acabar com o tédio desta noite."
 relation_upgrade.1001.desc.rival:0 "No canto, [potential_rival.GetFirstName] me olha fixamente com ódio."
 relation_upgrade.1001.e.list:0 "$relation_upgrade.1001.d.tt_success.list$"
 relation_upgrade.1001.e:0 "Se alguém trancar as portas, este lugar queimaria facilmente..."
 relation_upgrade.1001.f:0 "Acho que vou apenas aproveitar da melhor forma possível."
 relation_upgrade.1001.g:0 "Talvez eu fale com alguém novo?"
 relation_upgrade.1001.h.list:0 "$relation_upgrade.1001.d.tt_success.list$"
 relation_upgrade.1001.h:0 "[terrible_party_host.GetFirstName], você é um[Select_CString( terrible_party_host.IsFemale, 'a', '' )] péssim[Select_CString( terrible_party_host.IsFemale, 'a', 'o' )] anfitrião!"
 relation_upgrade.1001.i:0 "Sair quietamente."
 relation_upgrade.1001.t:0 "Uma Noite para Esquecer"
 relation_upgrade.1002.a.tt:0 "[potential_friend.GetFirstNameNoTooltip] aceita sua oferta"
 relation_upgrade.1002.a:0 "[ROOT.GetCharacter.GetFaith.HighGodName], sim, em qualquer lugar, menos aqui!"
 relation_upgrade.1002.b.tt:0 "[potential_friend.GetFirstNameNoTooltip] recusa educadamente sua oferta"
 relation_upgrade.1002.b:0 "Ehm, obrigad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], mas não, obrigad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 relation_upgrade.1002.c.tt:0 "[potential_friend.GetFirstNameNoTooltip] faz fofoca sobre você"
 relation_upgrade.1002.c:0 "Com #EMP você#!? Você é a pessoa mais entediante aqui!"
 relation_upgrade.1002.desc:0 "Eu estou pres[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] nesta festa torturante (que [Select_CString( terrible_party_host.IsFemale, 'a', 'o' )] [terrible_party_host.GetFirstName] praticamente fracassou em realizar) por pelo que parece #EMP horas#!, acenando sem energia para todos que passam por mim.\n\nA ideia de me jogar desta sacada começa a ser atraente, quando sinto um toque em meu ombro.\n\n\"Com licença, [potential_friend.GetFirstNameNoTooltip]?\", diz [Select_CString( party_root.IsFemale, 'a', 'o' )] [party_root.GetTitledFirstName], \"você gostaria de dar um passeio longe daqui?\""
 relation_upgrade.1002.t:0 "$relation_upgrade.1001.t$: Em Qualquer Lugar, Menos Aqui"
 relation_upgrade.1003.a.tt:0 "[potential_lover.GetFirstNameNoTooltip] ficaria encantad[Select_CString( potential_lover.IsFemale, 'a', 'o' )]"
 relation_upgrade.1003.a:0 "[party_root.GetFirstNameNoTooltip], eu pensei que você nunca fosse perguntar!"
 relation_upgrade.1003.b.tt:0 "[potential_lover.GetFirstNameNoTooltip] só quer ser seu amigo"
 relation_upgrade.1003.b.tt_custom_relation:0 "[party_root.GetFirstNameNoTooltip] não tentará mais se tornar seu [lover|E]."
 relation_upgrade.1003.b:0 "Na verdade, acho que prefiro você como amig[Select_CString( potential_lover.IsFemale, 'a', 'o' )]..."
 relation_upgrade.1003.c.tt:0 "[potential_lover.GetFirstNameNoTooltip] não te dá resposta"
 relation_upgrade.1003.c:0 "Não. Atualmente, não estou aceitando pretendentes."
 relation_upgrade.1003.desc:0 "Eu não faço ideia de como [Select_CString( terrible_party_host.IsFemale, 'a', 'o' )] [terrible_party_host.GetFirstName] me convenceu a comparecer a essa festa horrível e monótona. Só consigo pensar que deve ter sido um momento de loucura ou talvez a promessa de que [Select_CString( party_root.IsFemale, 'a', 'o' )] [party_root.GetTitledFirstName] também estaria presente.\n\nPassei por [party_root.GetSheHe] mais cedo na noite, mas [party_root.GetSheHe] não pareceu notar o meu suspiro deliberado de solidão. Ou pelo menos, [party_root.GetSheHe] não respo-\n\n\"[Select_CString( potential_lover.IsFemale, 'Minha querida', 'Meu querido' )] [potential_lover.GetFirstNameNoTooltip]! Gostaria de dar um passeio à luz da lua?\""
 relation_upgrade.1003.t:0 "$relation_upgrade.1001.t$: Caminhando à Luz da Lua"
 relation_upgrade.1004.a.tt:0 "[potential_rival.GetFirstNameNoTooltip] reage com raiva"
 relation_upgrade.1004.a:0 "Ah, você quer ouvir algumas verdades #EMP reais#!, patife?"
 relation_upgrade.1004.b.tt:0 "[potential_rival.GetFirstNameNoTooltip] se recusa a se rebaixar ao seu nível"
 relation_upgrade.1004.b:0 "Isso está abaixo de mim."
 relation_upgrade.1004.c:0 "Talvez... Talvez pudéssemos ser amigos ao invés disso?"
 relation_upgrade.1004.desc:0 "Por [ROOT.GetCharacter.GetFaith.HighGodName], [terrible_party_host.GetFirstName] não sabe como organizar uma festa decente! Sem música, comida sem graça, sem dança, pouca luz, e [terrible_party_host.GetSheHe] convidou aquele cão, [party_root.GetTitledFirstName]!\n\n\"$relation_upgrade.1001.c$\" Berra [Select_CString( party_root.IsFemale, 'a', 'o' )] [party_root.GetWomanMan] irritante bem do outro lado da sala, chamando a atenção de todos os convidados sonolentos e marchando até mim, claramente determinado a me dar uma lição."
 relation_upgrade.1004.t:0 "$relation_upgrade.1001.t$: Gritos Intermináveis"
 relation_upgrade.2001.a.failure:0 "[lover_1.GetShortUIName|U] não entende a dica"
 relation_upgrade.2001.a.success:0 "[lover_1.GetShortUIName|U] aceita sua oferta"
 relation_upgrade.2001.a:0 "Devemos continuar essa conversa em algum lugar mais reservado?"
 relation_upgrade.2001.b.failure:0 "[lover_1.GetShortUIName|U] não sente o mesmo"
 relation_upgrade.2001.b.success:0 "[lover_1.GetShortUIName|U] sente o mesmo"
 relation_upgrade.2001.b:0 "[lover_1.GetFirstNameNoTooltip] — Eu acho que te amo."
 relation_upgrade.2001.c:0 "Que interessante! Você poderia explicar novamente?"
 relation_upgrade.2001.does_not_relate.desc:0 "\n\nEmbora eu saiba pouco sobre esse assunto, sinto-me hipnotizado pela paixão [lover_1.GetHerHim]. Os belos olhos [lover_1.GetHerHim|U] estão positivamente #EMP brilhando#!, e a profundidade das palavras [lover_1.GetHerHim] é clara, mesmo para um novato como eu. Acho que poderia ouvir [lover_1.GetSheHe] para sempre."
 relation_upgrade.2001.lover.desc:0 "Estrategicamente, escolhi um lugar ao lado d[Select_CString( lover_1.IsFemale, 'a', 'o' )] [lover_1.Custom('ComplimentAdjective')] [lover_1.GetTitledFirstName]. [lover_1.GetSheHe|U] me envolveu em uma conversa sobre [lover_1.Custom('herhis_subject_of_interest')]."
 relation_upgrade.2001.lover_dinner.desc:0 "Durante o jantar,"
 relation_upgrade.2001.lover_party.desc:0 "Durante uma festa de jantar em [lover_1_location.GetNameNoTooltip],"
 relation_upgrade.2001.relates.desc:0 "\n\nO ponto de vista [lover_1.GetHerHim|U] é intrigante, mas é a paixão [lover_1.GetHerHim] pelo assunto que mais admiro. Quanto mais [lover_1.GetSheHe] se aprofunda, mais animado [lover_1.GetSheHe] fica, e aqueles belos olhos [lover_1.GetHerHim] estão positivamente #EMP brilhando#! Eu acho que poderia ouvir [lover_1.GetSheHe] para sempre."
 relation_upgrade.2001.soulmate.desc:0 "M[Select_CString( lover_1.IsFemale, 'inha', 'eu' )] [lover_1.Custom('LoverPetName')] [lover_1.GetTitledFirstName] está brincando distraídamente com meu cabelo enquanto [lover_1.GetSheHe] me fala sobre [lover_1.Custom('herhis_subject_of_interest')]."
 relation_upgrade.2001.t:0 "Interesses Apaixonados"
 relation_upgrade.2002.c.lover:0 "Ah, sim, como eu estava dizendo..."
 relation_upgrade.2002.c.soulmate:0 "Você é um[Select_CString( lover_2.IsFemale, 'a', '' )] ótim[Select_CString( lover_2.IsFemale, 'a', 'o' )] ouvinte, sabia?"
 relation_upgrade.2002.lover.desc:0 "Acabamos falando sobre [lover_1.Custom('my_subject_of_interest')] — um assunto em que poderia passar horas. Para minha alegria, [lover_2.GetFirstNameNoTooltip] é um[Select_CString( lover_2.IsFemale, 'a', '' )] excelente ouvinte. O interesse [lover_2.GetHerHim|U] no que tenho a dizer parece genuíno, e as perguntas que [lover_2.GetSheHe] faz são ponderadas e inteligentes.\n\nAntes que eu perceba, somos os únicos que restam à mesa do jantar. Enquanto [Select_CString( lover_2.IsFemale, 'a', 'o' )] [lover_2.GetFirstNameNoTooltip] se inclina para me ouvir melhor, posso sentir meu coração acelerar..."
 relation_upgrade.2002.lover_dinner.desc:0 "Durante o jantar, me encontro sentad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ao lado d[Select_CString( lover_2.IsFemale, 'a', 'o' )] [lover_2.Custom('ComplimentAdjective')] [lover_2.GetTitledFirstName]."
 relation_upgrade.2002.lover_party.desc:0 "[Select_CString( lover_2.IsFemale, 'A', 'O' )] [lover_2.Custom('ComplimentAdjective')] [lover_2.GetTitledFirstName] é um[Select_CString( lover_2.IsFemale, 'a', '' )] convidad[Select_CString( lover_2.IsFemale, 'a', 'o' )] inesperad[Select_CString( lover_2.IsFemale, 'a', 'o' )], mas bem-vindo, na minha festa de jantar."
 relation_upgrade.2002.soulmate.desc:0 "Estou brincando distraídamente com s[Select_CString( lover_2.IsFemale, 'ua', 'eu' )] [lover_2.Custom('LoverPetName')], com a cabeça [lover_2.GetHerHim] apoiada no meu peito, enquanto conto a [lover_2.GetSheHe] sobre [lover_1.Custom('my_subject_of_interest')]. [lover_2.GetSheHe|U] é um[Select_CString( lover_2.IsFemale, 'a', '' )] excelente ouvinte, me incentivando com murmúrios e acenos, e fazendo perguntas ponderadas. O modo como [lover_2.GetSheHe] realmente se importa com um assunto tão próximo do meu coração me deixa aquecid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por dentro."
 relation_upgrade.2003.a:0 "Que [lover_1.GetWomanMan] tol[Select_CString( lover_1.IsFemale, 'a', 'o' )]!"
 relation_upgrade.2003.b:0 "Sou [Select_CString( lover_2.IsFemale, 'a', 'o' )] [lover_2.GetWomanMan] mais feliz em [realm.GetNameNoTierNoTooltip]!"
 relation_upgrade.2003.lover.desc:0 "Enquanto me inclino e faço minha sugestão, o brilho nos olhos d[Select_CString( lover_1.IsFemale, 'a', 'o' )] [lover_1.GetFirstNamePossessive] assume a essência de uma outra espécie de paixão. [lover_1.GetSheHe|U] hesita por um momento, suas bochechas corando, mas o conflito interno [lover_1.GetHerHim] se resolve rapidamente.\n\n\"Espere aqui, só por um tempinho, para que ninguém fique desconfiado. Então venha para meus aposentos.\" Enquanto [Select_CString( lover_1.IsFemale, 'a', 'o' )] [lover_1.GetFirstNameNoTooltip] se apressa, não consigo tirar os olhos [lover_1.GetHerHim]."
 relation_upgrade.2003.soulmate_end.desc:0 "\"É verdade, [lover_2.GetFirstNameNoTooltip]? Sinto o mesmo há tanto tempo, mas nunca pensei...\" \n\nO beijo que se segue é a coisa mais doce que já experimentei."
 relation_upgrade.2003.soulmate_start.desc:0 "Minha declaração de amor pega [Select_CString( lover_1.IsFemale, 'a', 'o' )] [lover_1.GetFirstName] desprevenid[Select_CString( lover_1.IsFemale, 'a', 'o' )]. A mão [lover_1.GetHerHim|U] para no meu cabelo, e posso sentir o coração [lover_1.GetHerHim] batendo contra minha bochecha. O meu está batendo tão forte quanto.\n\n"
 relation_upgrade.2004.a:0 "Foi tolice da minha parte fazer essas suposições..."
 relation_upgrade.2004.lover.desc:0 "[lover_1.GetFirstName] não entendeu minha dica — ou talvez [lover_1.GetSheHe] esteja ignorando para me poupar do constrangimento da rejeição.\n\nNossa conversa sobre [lover_1.Custom('my_subject_of_interest')] continua. Felizmente, o interesse d[Select_CString( lover_1.IsFemale, 'a', 'o' )] [lover_1.GetFirstNameNoTooltip] pelo assunto supera minha desajeitada tentativa."
 relation_upgrade.2004.soulmate_end.desc:0 "\"Eu me importo com você, [lover_2.GetFirstNameNoTooltip], e gosto do nosso tempo juntos. Podemos deixar as coisas assim?\"\n\nApós um pedido de desculpas constrangedor, volto à conversa sobre [lover_1.Custom('my_subject_of_interest')], desesperad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] para dissipar a tensão entre nós."
 relation_upgrade.2101.a:0 "Lance-o em direção a [rival_capital.GetNameNoTierNoTooltip]!"
 relation_upgrade.2101.a_tt:0 "Alguém da corte [rival.GetHerHim] pode contrair a doença!"
 relation_upgrade.2101.a_tt_nemesis:0 "[rival.GetTitledFirstName] provavelmente se tornará seu nêmesis"
 relation_upgrade.2101.a_tt_rival:0 "[rival.GetTitledFirstName] provavelmente se tornará seu rival"
 relation_upgrade.2101.b:0 "O corpo pode conter pistas sobre a origem da doença."
 relation_upgrade.2101.b_tt:0 "Um de seus cortesãos contrai a doença"
 relation_upgrade.2101.b_tt_2:0 "Surto de doença em [capital.GetNameNoTooltip]"
 relation_upgrade.2101.c:0 "[peasant.GetSheHe|U] terá um enterro digno."
 relation_upgrade.2101.desc_bubonic_plague:0 "coberto por grandes bubões exsudando pus e sangue –"
 relation_upgrade.2101.desc_ending:0 "descansa sobre a mesa. Qualquer um que entre em contato com o cadáver corre o risco de contrair a doença, e... e eu #EMP estava#! planejando um passeio que me levará próximo a [rival_capital.GetNameNoTierNoTooltip], o domínio de [rival.Custom2('MyCharacterIntroduction', ROOT.Char)]..."
 relation_upgrade.2101.desc_opening:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], a doença é contagiosa, tome cuidado!\"\n\n"
 relation_upgrade.2101.desc_opening_other:0 "O corpo doente de um plebeu –"
 relation_upgrade.2101.desc_opening_physician:0 "M[Select_CString( physician.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('physician'))] [physician.GetTitledFirstName] me segura; o corpo doente de um plebeu –"
 relation_upgrade.2101.desc_smallpox:0 "a pele marcada por erupções e saliências –"
 relation_upgrade.2101.t:0 "Relações Doentias"
 relation_upgrade.2102.a:0 "Recupere [peasant.GetSheHe] – vamos lançar o corpo de volta!"
 relation_upgrade.2102.b:0 "Esse corpo deve ser estudado."
 relation_upgrade.2102.b_tt_2:0 "Surto de doença em [rival_capital.GetNameNoTooltip]"
 relation_upgrade.2102.desc_bubonic_plague:0 "coberto por grandes bubões exsudando pus e sangue que podem ser vistos mesmo de onde estou"
 relation_upgrade.2102.desc_ending:0 "\n\nEle aterrissa com um som squelch, espalhando sangue, intestinos e pânico."
 relation_upgrade.2102.desc_opening:0 "O séquito de [corpse_rival.Custom2('MyCharacterIntroduction', ROOT.Char)] para algum tempo longe de [rival_capital.GetNameNoTier]. Antes que eu tenha tempo de enviar um enviado, algo é lançado de seu acampamento em direção ao meu [rival.Custom('ResidenceBuilding')].\n\nUm corpo mutilado, devastado pela doença, cai do céu;"
 relation_upgrade.2102.desc_smallpox:0 "a pele marcada por erupções e saliências que podem ser vistos mesmo de onde estou."
 relation_upgrade.2102.tt:0 "Um dos cortesãos d[Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetTitledFirstName] contrai a doença"
 relation_upgrade.3000.a:0 "Não descansarei até [Select_CString( rival_to_be.IsFemale, 'a', 'o' )] [rival_to_be.GetFirstNameNoTooltip] estar mort[Select_CString( rival_to_be.IsFemale, 'a', 'o' )] e enterrad[Select_CString( rival_to_be.IsFemale, 'a', 'o' )]..."
 relation_upgrade.3000.b:0 "Não! Não posso permitir que a vingança governe minha vida!"
 relation_upgrade.3000.desc:0 "[Select_CString( rival_to_be.IsFemale, 'A', 'O' )] [rival_to_be.Custom2('InsultNoun', ROOT.Char)] [rival_to_be.Custom2('InsultAdjective', ROOT.Char)] [rival_to_be.GetFirstName] me faz ferver de raiva! Como [ROOT.GetCharacter.GetFaith.HighGodName] pôde amaldiçoar a terra com [Select_CString( rival_to_be.IsFemale, 'a', 'o' )] [rival_to_be.GetFirstNamePossessiveNoTooltip] [rival_to_be.Custom('InsultAdjective')] [rival_to_be.Custom('InsultBehavior')]?! Não, é óbvio — [rival_to_be.GetSheHe] é parente do próprio [ROOT.GetCharacter.GetFaith.DevilName]. [rival_to_be.GetSheHe|U] é pior do que uma ferida purulenta e um gafanhoto voraz.\n\nEu não suporto sequer a #EMP mera ideia#! de respirar o mesmo ar [rival_to_be.Custom('InsultAdjective')] que [rival_to_be.GetSheHe]! Eu devo fazer algo, devo agir.\n\nMinha sanidade depende disso."
 relation_upgrade.3000.t:0 "Ódio Florescente"
