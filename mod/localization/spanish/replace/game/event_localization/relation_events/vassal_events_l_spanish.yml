l_spanish:
 vassal.1001.a.tt:0 "#F [religious_liege.GetFirstNameNoTooltip] lembrará da promessa, e me deve um [favor|E] se for cumprida dentro de dez anos#!"
 vassal.1001.a:0 "Eu prometo que um [ROOT.Char.GetFaith.HouseOfWorship] será construído!"
 vassal.1001.b:0 "Nada disso é necessário."
 vassal.1001.b_zealous:0 "Quem você pensa que é para falar em nome de [ROOT.Char.GetFaith.HighGodName]?!?!"
 vassal.1001.desc:0 "M[Select_CString( religious_liege.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_liege'))], o [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('religious_liege'))] [religious_liege.GetTitledFirstName], está passando por meus domínios. Enquanto [religious_liege.GetSheHe] inspeciona os prédios, [religious_liege.GetSheHe] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('religious_liege'))] e franze a testa.\n\n\"Sabe o que falta nesta vista? Um [religious_liege.GetFaith.HouseOfWorship] - um glorioso tributo a [religious_liege.GetFaith.HighGodName]!\""
 vassal.1001.t:0 "Como [ROOT.Char.GetFaith.HighGodName|U] Desejar"
 vassal.1010.a:0 "Eu vivo para servir a [religious_liege.GetFaith.HighGodName]."
 vassal.1010.desc:0 "\"Você realmente se superou desta vez, [ROOT.Char.GetFirstNameNoTooltip]. É verdadeiramente uma construção magnífica.\" M[Select_CString( religious_liege.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_liege'))], [religious_liege.GetTitledFirstName], [religious_liege.Custom('quirk_pos_present')], e aponta para o recém-construído [religious_liege.GetFaith.HouseOfWorship].\n\n\"Tenho certeza de que [religious_liege.GetFaith.HighGodName] está tão impressionado quanto eu!\""
 vassal.1020.a.tt:0 "#F Talvez eu devesse ter cumprido minha promessa e construído aquele [THIS.Char.GetFaith.HouseOfWorship]...#!"
 vassal.1020.a:0 "Errar é humano!"
 vassal.1020.a_religious:0 "Espero que [religious_liege.GetFaith.HighGodName] me perdoe..."
 vassal.1020.desc:0 "\n\nM[Select_CString( religious_liege.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_liege'))], [religious_liege.GetTitledFirstName], não faz segredo de seu descontentamento enquanto [religious_liege.GetSheHe] [religious_liege.Custom('quirk_neg_present')]."
 vassal.1020.desc_not_as_religious:0 "\"Você me mentiu, [ROOT.Char.GetFirstNameNoTooltip]... E sobre construir um [religious_liege.GetFaith.HouseOfWorship] para [religious_liege.GetFaith.HighGodName], ainda por cima!\""
 vassal.1020.desc_religious:0 "\"Que um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] devoto como você faria promessas vazias... E sobre construir um [religious_liege.GetFaith.HouseOfWorship] para [religious_liege.GetFaith.HighGodName], ainda por cima!\""
 vassal.1101.a.tt:0 "#F [religious_vassal.GetFirstNameNoTooltip] se lembrará da promessa e me deverá um [favor|E] se for cumprida dentro de dez anos#!"
 vassal.1101.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], eu percebi que há espaço para um [religious_vassal.GetFaith.HouseOfWorship] em seus domínios.\"\n\nM[Select_CString( religious_vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_vassal'))], o [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('religious_vassal'))] [religious_vassal.GetTitledFirstName], [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('religious_vassal'))] antes de continuar, \"Se você construir um, certamente terá a gratidão de [religious_vassal.GetFaith.HighGodNameAlternate|U], além da minha."
 vassal.1110.a:0 "Eu vivo para servir a [religious_vassal.GetFaith.HighGodName]."
 vassal.1110.desc:0 "\"Você realmente se superou desta vez, [ROOT.Char.Custom('FormOfAddressForLiege')]. É verdadeiramente uma construção magnífica.\" M[Select_CString( religious_vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_vassal'))], [religious_vassal.GetTitledFirstName], [religious_vassal.Custom('quirk_pos_present')] e aponta para o recém-construído [religious_vassal.GetFaith.HouseOfWorship].\n\n\"Tenho certeza de que [religious_vassal.GetFaith.HighGodName] está tão impressionado quanto eu!\""
 vassal.1120.a.tt:0 "#F Talvez eu devesse ter cumprido minha promessa e construído aquele [THIS.Char.GetFaith.HouseOfWorship]...#!"
 vassal.1120.a:0 "Errar é humano!"
 vassal.1120.desc:0 "M[Select_CString( religious_vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_vassal'))], [religious_vassal.GetTitledFirstName], [religious_vassal.Custom('quirk_neg_present')] e balança a cabeça.\n\n\"Que [religious_vassal.GetFaith.HighGodNameAlternate|U] te perdoe.\""
 vassal.1120.desc_not_as_religious:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], você mentiu para mim... E sobre construir um [religious_vassal.GetFaith.HouseOfWorship] para [religious_vassal.GetFaith.HighGodName], ainda por cima!\""
 vassal.1120.desc_religious:0 "\"Que um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] devoto como você faria promessas vazias... E sobre construir um [religious_vassal.GetFaith.HouseOfWorship] para [religious_vassal.GetFaith.HighGodName], ainda por cima!\""
 vassal.2001.a:0 "Claro, vou educar [Select_CString( child_to_educate.IsFemale, 'a', 'o' )] [child_to_educate.Custom('GirlBoy')]."
 vassal.2001.b:0 "[Select_CString( child_to_educate.IsFemale, 'Sua', 'Seu' )] [child_to_educate.Custom('GetDaughterSon')] é sua responsabilidade!"
 vassal.2001.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], acredito que [Select_CString( child_to_educate.IsFemale, 'a', 'o' )] jovem [child_to_educate.GetFirstName] poderia aprender muito se tivesse a oportunidade de estudar sob sua tutela.\"\n\n[vassal_proposing_education.Custom2('RelationToMe', SCOPE.sC('child_to_educate'))] d[Select_CString( vassal_proposing_education.IsFemale, 'a', 'o' )] [vassal_proposing_education.GetTitledFirstNamePossessive] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('child_to_educate'))], antes de acenar para nós."
 vassal.2001.t:0 "Ensinando os Jovens"
 vassal.2101.a.tt:0 "#F [party_vassal.GetFirstNameNoTooltip] se lembrará da promessa que fiz e ficará grato se for cumprida dentro de dez anos#!"
 vassal.2101.a:0 "Eu prometo que um banquete será realizado em breve!"
 vassal.2101.a_hyped:0 "Claro que devemos fazer um banquete! Não sei por que esperei tanto tempo."
 vassal.2101.b:0 "Vou realizar um banquete quando eu quiser."
 vassal.2101.b_arrogant:0 "Quem você pensa que é?!"
 vassal.2101.b_greedy:0 "Você tem ideia de quanto isso custaria?!"
 vassal.2101.b_lazy:0 "Tenho certeza de que farei isso eventualmente..."
 vassal.2101.b_shy:0 "Um banquete? Com pessoas? Acho que não..."
 vassal.2101.desc:0 "\"Muitos meses se passaram desde que os Lordes e as Damas do reino se reuniram para um banquete, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleTierName].\"\n\n[party_vassal.GetTitledFirstName] [ROOT.Char.Custom2('QuirkAdverbPosOrNeg', party_vassal)] continua, \"Isso seria benéfico para você - sem mencionar aqueles entre nós que apreciam um bom banquete - se isso fosse remediado em breve!\""
 vassal.2101.t:0 "Banquete Fervoroso"
 vassal.2110.a:0 "Certamente foi um banquete para ser lembrado!"
 vassal.2110.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Você realmente se superou desta vez!\"\n\nM[Select_CString( party_vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('party_vassal'))], [party_vassal.GetTitledFirstName], parece ainda estar se recuperando do banquete que prometi a [party_vassal.GetHerHim], mas [party_vassal.GetSheHe] está de bom humor, ainda assim."
 vassal.2120.a:0 "Devo ter esquecido!"
 vassal.2120.desc:0 "\n\nM[Select_CString( party_vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('party_vassal'))], [party_vassal.GetTitledFirstName], [party_vassal.Custom('quirk_neg_present')] e balança a cabeça."
 vassal.2120.desc_party:0 "\"Que um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] tão dedicad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a se divertir faria promessas vazias... Devo admitir que estou desapontad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )].\""
 vassal.2120.desc_regular:0 "\"Que um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] [party_vassal.Custom2('DescriptorPositive', ROOT.Char)] como você faria promessas vazias... Devo admitir que estou desapontad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )].\""
 vassal.2201.a.money_loan_tooltip:0 "Eu irei pegar emprestado [gold_i] #bold [THIS.Var('amount_to_loan_root').GetValue]#! de ouro d[Select_CString( vassal_loan_holder.IsFemale, 'a', 'o' )] [vassal_loan_holder.GetFirstNameNoTooltip]."
 vassal.2201.a.repay_loan:0 "Eu precisarei usar a decisão #bold Pagar Empréstimo#! para reembolsar o empréstimo."
 vassal.2201.a:0 "Sua ajuda é apreciada, [vassal_loan_holder.GetFirstNameNoTooltip]."
 vassal.2201.b:0 "Eu não estou #EMP tão#! desesperad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]!"
 vassal.2201.desc:0 "\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleTierName], não pude deixar de perceber que você poderia se beneficiar de alguma ajuda financeira.\"\n\nM[Select_CString( vassal_loan_holder.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_loan_holder'))], [vassal_loan_holder.GetTitledFirstName], [vassal_loan_holder.Custom('quirk_pos_present')] enquanto propõe um acordo: um empréstimo para aliviar o fardo de meu tesouro."
 vassal.2201.t:0 "Ministrações Monetárias"
 vassal.2205.a.tt:0 "#F Eu devo pagar a [vassal_loan_holder.GetSheHe] o mais rápido possível!#!"
 vassal.2205.a:0 "Claro que você receberá seu ouro!"
 vassal.2205.b:0 "Não me incomode com assuntos tão triviais."
 vassal.2205.c:0 "No entanto, era muito dinheiro..."
 vassal.2205.c_greedy:0 "Quem estou enganando? O ouro é um grande conforto!"
 vassal.2205.desc_all_new_char:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], [Select_CString( original_lender.IsFemale, 'minha falecida', 'meu falecido' )] [vassal_loan_holder.Custom2('RelationToMe', SCOPE.sC('original_lender'))] emprestou uma quantia de ouro [Select_CString( original_loaner.IsFemale, 'a sua falecida', 'ao seu falecido' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('original_loaner'))].\"\n\n[vassal_loan_holder.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('vassal_loan_holder'))] antes de continuar. \"Como seu sucessor, agora é sua responsabilidade pagar esse empréstimo.\""
 vassal.2205.desc_first_time:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], confio que o empréstimo tenha sido útil?\"\n\n[vassal_loan_holder.GetTitledFirstName] veio cobrar o ouro que [vassal_loan_holder.GetSheHe] me forneceu."
 vassal.2205.desc_inherited:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], [Select_CString( original_lender.IsFemale, 'minha falecida', 'meu falecido' )] [vassal_loan_holder.Custom2('RelationToMe', SCOPE.sC('original_lender'))] concedeu-lhe um empréstimo.\"\n\n[vassal_loan_holder.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('vassal_loan_holder'))] antes de continuar. \"Como seu sucessor, agora venho pedir que o empréstimo seja pago.\""
 vassal.2205.desc_inherited_loan:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], eu emprestei uma quantia de ouro [Select_CString( original_loaner.IsFemale, 'a sua falecida', 'ao seu falecido' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('original_loaner'))].\"\n\n[vassal_loan_holder.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('vassal_loan_holder'))] antes de continuar. \"Como seu sucessor, agora é sua responsabilidade pagar esse empréstimo.\""
 vassal.2205.desc_more_times:0 "\"Se eu soubesse que você era tão [ROOT.Char.Custom2('InsultAdjectiveArticle', SCOPE.sC('vassal_loan_holder'))], desonest[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('vassal_loan_holder'))] eu nunca teria feito um favor desses para você.\"\n\nO dinheiro em meu tesouro é de pouca consolação enquanto [Select_CString( vassal_loan_holder.IsFemale, 'a', 'o' )] [vassal_loan_holder.GetTitledFirstNamePossessive] [vassal_loan_holder.Custom('quirk_neg_present')] antes de ir embora."
 vassal.2205.desc_second_time:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], não gosto deste jogo. Você me deve, e confio que sua promessa de pagamento não foi uma mentira.\"\n\n[vassal_loan_holder.GetTitledFirstName] [vassal_loan_holder.Custom('quirk_neg_present')] enquanto fica diante de mim pela segunda vez."
 vassal.2205.desc_three_times:0 "\"Estou ficando cansad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] disso, [ROOT.Char.Custom('FormOfAddressForLiege')]! Esta é a última vez que lhe peço de forma civil; onde está o dinheiro que você me deve?\"\n\n[vassal_loan_holder.Custom('quirk_neg_pp')|U], [vassal_loan_holder.GetTitledFirstName] irradia descontentamento, sua paciência se esgotou."
 vassal.2205.z:0 "Aqui! Pegue e vá embora!"
 vassal.2301.a:0 "Assuma o controle, [skilled_vassal.GetFirstNameNoTooltip]!"
 vassal.2301.b_diplomacy:0 "Não, #EMP você#! vai deixar a minha experiência diplomática de lado."
 vassal.2301.b_intrigue:0 "Acho que #EMP eu#! devo lidar com assuntos tão delicados."
 vassal.2301.b_learning:0 "Eu sou muito mais qualificad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] para lidar com esse assunto."
 vassal.2301.b_martial:0 "Habilidades marciais? Hah! Eu farei essas modificações #EMP sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]!."
 vassal.2301.b_stewardship:0 "Eu posso cuidar desse assunto administrativo sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 vassal.2301.c:0 "Vassalos não devem tomar liberdades assim."
 vassal.2301.desc_diplomacy:0 "especialmente em assuntos diplomáticos."
 vassal.2301.desc_ending:0 "\n\n\"Há alguns projetos que eu gostaria de empreender em [develop_county.GetName], [Select_CString( ROOT.Char.IsFemale, 'minha senhora', 'meu senhor' )]. Com a sua bênção, é claro.\""
 vassal.2301.desc_intrigue:0 "especialmente em assuntos #EMP discretos#!."
 vassal.2301.desc_learning:0 "especialmente em assuntos acadêmicos."
 vassal.2301.desc_martial:0 "especialmente em assuntos marciais."
 vassal.2301.desc_opening:0 "[skilled_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] provou ser altamente capaz,"
 vassal.2301.desc_stewardship:0 "especialmente em assuntos administrativos."
 vassal.2301.t:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('skilled_vassal'))|U] Habilidos[Select_CString( skilled_vassal.IsFemale, 'a', 'o' )]"
 vassal.2401.a:0 "Ouro para [possible_county.GetNameNoTierNoTooltip] é razoável, certo?"
 vassal.2401.b:0 "Você tem desfrutado de um contrato muito #EMP vantajoso#!..."
 vassal.2401.c:0 "Você não consegue gerenciar seu próprio ouro?!"
 vassal.2401.desc:0 "\n\nM[Select_CString( vassal_needs_gold.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_needs_gold'))], [vassal_needs_gold.GetTitledFirstName], olha para mim [ROOT.Char.Custom2('QuirkAdverbPosOrNeg', SCOPE.sC('vassal_needs_gold'))] antes de continuar, \"Estou até dispost[Select_CString( vassal_needs_gold.IsFemale, 'a', 'o' )] a fazer concessões... Por favor, sei que você tem os meios para me ajudar!\""
 vassal.2401.desc_family:0 "\"[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_needs_gold'))|U], eu preciso de algum financiamento.\""
 vassal.2401.desc_other:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U] – m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleTierName] – eu preciso de algum financiamento.\""
 vassal.2401.t:0 "Esperança Cintilante"
 vassal.2451.a:0 "Eu #EMP tenho#! interesse em [possible_county.GetNameNoTierNoTooltip]..."
 vassal.2451.b:0 "Meu tesouro poderia precisar de um reabastecimento, com certeza."
 vassal.2451.c:0 "Você não encontrará acordo aqui, [negotiating_vassal.GetFirstNameNoTooltip]."
 vassal.2451.desc:0 "M[Select_CString( negotiating_vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('negotiating_vassal'))], [negotiating_vassal.GetTitledFirstName], se aproxima de mim com um sorriso [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', SCOPE.sC('negotiating_vassal'))].\n\n\"Gostaria que pudéssemos... renegociar meu contrato, meu [ROOT.Char.GetTitleTierName]. Qualquer melhoria seria, é claro, bem recebida por meu tesouro ou minhas terras.\""
 vassal.2451.t:0 "Um Contrato Melhor"
 vassal.2501.a:0 "Menos pressão sobre [peaceful_vassal.GetHerHim] pode ajudar."
 vassal.2501.b:0 "Devo lembrá-l[Select_CString( peaceful_vassal.IsFemale, 'a', 'o' )] de quem é o [ROOT.Char.GetTitleTierName]?!"
 vassal.2501.c:0 "Você precisa aprender a conter suas dúvidas."
 vassal.2501.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], esta guerra...\" M[Select_CString( peaceful_vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('peaceful_vassal'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peaceful_vassal'))], [peaceful_vassal.GetTitledFirstName], suspira antes de continuar, \"Está sendo difícil para as tropas — para todos nós. Devo admitir que estou com dúvidas.\"\n\nTalvez eu devesse fazer algo para aliviar o crescente ceticismo [peaceful_vassal.GetHerHim]."
 vassal.2501.t:0 "Um Pedido de Paz"
 vassal.2601.a.tt:0 "#F [warmongering_vassal.GetFirstName] vai se lembrar da promessa que fiz#!"
 vassal.2601.a:0 "Você está certo, [warmongering_vassal.GetFirstNameNoTooltip]!"
 vassal.2601.b:0 "Eu não vou ser pressionado a agir prematuramente."
 vassal.2601.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], você tem motivos para atacar [Select_CString( holder_of_claim.IsFemale, 'a', 'o' )] [holder_of_claim.GetTitledFirstName], mas mantém sua mão... \" M[Select_CString( warmongering_vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('warmongering_vassal'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('warmongering_vassal'))], [warmongering_vassal.GetTitledFirstName], [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('warmongering_vassal'))] antes de continuar, \"Por quê? Estamos em paz há tempo demais, você deveria aproveitar essa oportunidade!\""
 vassal.2601.t:0 "Desejando a Guerra"
 vassal.2610.a:0 "Nós vamos vencer esta guerra!"
 vassal.2610.desc:0 "\"Você fez a coisa certa, [ROOT.Char.Custom('FormOfAddressForLiege')]. Vamos mostrar [Select_CString( recipient.IsFemale, 'a', 'ao' )] [recipient.GetTitledFirstName] o que somos capazes de fazer! Você vai reivindicar [claim_to_fight_for.GetNameNoTier]!\""
 vassal.2620.a:0 "Tem acontecido tantas outras coisas..."
 vassal.2620.desc:0 "M[Select_CString( warmongering_vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('warmongering_vassal'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('warmongering_vassal'))], [warmongering_vassal.GetTitledFirstName], [warmongering_vassal.Custom('quirk_neg_present')].\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], [holder_of_claim.GetTitledFirstName] não viu sua raiva, nem seu exército. Por que você me prometeu uma guerra que nunca planejou começar?\""
 vassal.2701.a.random_list.failure:0 "O treinamento foi malsucedido"
 vassal.2701.a.random_list.success:0 "O treinamento foi bem-sucedido"
 vassal.2701.a.tt:0 "Eu não ganho a Característica [THIS.Char.Custom('CommanderTraitBeingTaught')]"
 vassal.2701.a:0 "Você vai me ensinar, [teacher.GetFirstNameNoTooltip]?"
 vassal.2701.c:0 "Eu tenho coisas melhores para fazer!"
 vassal.2701.desc:0 "M[Select_CString( teacher.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('teacher'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('teacher'))], [teacher.GetTitledFirstName], é conhecid[Select_CString( teacher.IsFemale, 'a', 'o' )] por sua habilidade em assuntos militares — especialmente em áreas onde eu me sinto carente."
 vassal.2701.t:0 "[ROOT.Char.Custom('CommanderTraitBeingTaughtNoTooltip')] Ensinad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [Select_CString( teacher.IsFemale, 'pela', 'pelo' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('teacher'))|U]"
 vassal.2702.a:0 "Finalmente eu entendo toda essa comoção!"
 vassal.2702.b:0 "Será que [teacher.GetSheHe] é um mau professor ou eu não nasci para isso?"
 vassal.2702.desc_failure:0 "Apesar dos melhores esforços d[Select_CString( teacher.IsFemale, 'a', 'o' )] [teacher.GetTitledFirstName], nada do que [teacher.GetSheHe] me diz ou demonstra faz sentido. Esta é uma empreitada fracassada."
 vassal.2702.desc_success_inclination:0 "\"Impressionante, [ROOT.Char.Custom('FormOfAddressForLiege')]!\"\n\nMinha inclinação pelos ensinamentos d[Select_CString( teacher.IsFemale, 'a', 'o' )] [teacher.GetTitledFirstName] pode não ser surpresa, mas estou satisfeit[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] mesmo assim."
 vassal.2702.desc_success_no_inclination:0 "\"Impressionante, [ROOT.Char.Custom('FormOfAddressForLiege')]!\"\n\nApesar de nunca ter sido natural em assuntos militares, me vejo aceitando os ensinamentos d[Select_CString( teacher.IsFemale, 'a', 'o' )] [teacher.GetTitledFirstName] com sede e habilidade que até mesmo me surpreendem."
 vassal.2801.a:0 "Vou cuidar disso imediatamente!"
 vassal.2801.b:0 "Se você pudesse diminuir minhas outras obrigações..."
 vassal.2801.desc:0 "\"[ROOT.Char.GetTitledFirstNameNoTooltip], eu não pude deixar de notar que nenhuma melhoria foi feita em [develop_county.GetNameNoTier] por um bom tempo, mesmo que você claramente tenha os meios para empreender tais empreendimentos.\""
 vassal.2801.t:0 "As Demandas de um Senhor Feudal"
 vassal.2901.a.tt:0 "#F [claim_vassal.GetFirstNameNoTooltip] vai se lembrar da minha promessa e ficar grato se ela for cumprida!#!"
 vassal.2901.a:0 "Vou ver o que posso fazer."
 vassal.2901.b:0 "[claim_to_propose.GetNameNoTierNoTooltip] me pertence!"
 vassal.2901.desc:0 "\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleTierName], você está atualmente em posse de algo — algum lugar — que deveria ser meu.\"\n\nM[Select_CString( claim_vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('claim_vassal'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('claim_vassal'))] [claim_vassal.GetTitledFirstName] veio até mim, insistindo que eu lhe conceda [claim_to_propose.GetName]."
 vassal.2901.t:0 "[claim_to_propose.GetNameNoTier|U]"
 vassal.2901.z:0 "Você deve receber o que pede."
 vassal.2910.a:0 "Tudo tem o seu preço!"
 vassal.2910.desc:0 "\"Obrigado, meu [ROOT.Char.GetTitleTierName]!\"\n\nM[Select_CString( recipient.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('recipient'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('recipient'))], [recipient.GetTitledFirstName], está feliz com o título que eu concedi a [recipient.GetHerHim], e estou encantado com o favor obtido."
 vassal.2911.a:0 "Eu não tinha obrigação de atender a um pedido tão absurdo."
 vassal.2911.desc:0 "M[Select_CString( claim_vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('claim_vassal'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('claim_vassal'))] está furios[Select_CString( claim_vassal.IsFemale, 'a', 'o' )]. [claim_vassal.GetSheHe|U] finalmente percebeu que minha promessa de conceder a [claim_vassal.GetHerHim] [claim_to_propose.GetName] foi apenas palavras vazias."
 vassal.3001.a:0 "Talvez [Select_CString( spouse.IsFemale, 'a', 'o' )] [vassal_to_ask.GetFirstNameNoTooltip] possa me dar algumas dicas!"
 vassal.3001.b:0 "Este é um assunto particular."
 vassal.3001.desc:0 "\n\nClaro que nós tentamos, m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] [spouse.GetFirstName] e eu, mas deve haver algo que estamos fazendo errado..."
 vassal.3001.desc_child:0 "M[Select_CString( vassal_to_ask.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_to_ask'))] [vassal_to_ask.GetTitledFirstName] está cercado de amor e seus muitos [vassal_to_ask.Custom('ChildChildrenGender')], e sou lembrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] do frio implacável que permeia minha própria casa — um sentimento que poderia ser dissipado com outro filho."
 vassal.3001.desc_no_child:0 "M[Select_CString( vassal_to_ask.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_to_ask'))] [vassal_to_ask.GetTitledFirstName] está cercado de amor e seus muitos [vassal_to_ask.Custom('ChildChildrenGender')], e sou lembrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] dos quartos vazios e corredores silenciosos de minha própria casa."
 vassal.3001.t:0 "Problema Familiar"
 vassal.3002.a.critical_success:0 "Meu conselho teve resultados surpreendentes"
 vassal.3002.a.failure:0 "Meu conselho causou mais problemas do que ajudou"
 vassal.3002.a.success:0 "Meu conselho teve bons resultados"
 vassal.3002.a:0 "Como soam testículos secos de porco e vinho?"
 vassal.3002.b:0 "Eu não quero ter nada a ver com o que acontece lá dentro!"
 vassal.3002.c.tt_failure:0 "[liege_with_trouble.GetSheHe|U] fica ofendid[Select_CString( liege_with_trouble.IsFemale, 'a', 'o' )]"
 vassal.3002.c.tt_success:0 "[liege_with_trouble.GetTitledFirstNameNoTooltip] concorda"
 vassal.3002.c:0 "Acho que [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetTitledFirstNameNoTooltip] precisa de algumas lições."
 vassal.3002.d.tt_failure:0 "[liege_with_trouble.GetSheHe|U] fica ofendid[Select_CString( liege_with_trouble.IsFemale, 'a', 'o' )]"
 vassal.3002.d.tt_success:0 "[liege_with_trouble.GetSheHe|U] se interessa por lições particulares"
 vassal.3002.d:0 "Acho que um... #EMP tutoramento pessoal#! seria bom para você."
 vassal.3002.desc:0 "\"[ROOT.Char.GetFirstNameNoTooltip], você foi abençoad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com vários filhos, e eu não tive a mesma sorte. Você tem algum conselho sobre como... resolver isso?\"\n\nNão posso acreditar! M[Select_CString( liege_with_trouble.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('liege_with_trouble'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('liege_with_trouble'))], [liege_with_trouble.GetTitledFirstName], está me pedindo dicas no quarto!"
 vassal.3003.a:0 "[spouse.GetTitledFirstNameNoTooltip]! Encontre-me em nossos aposentos!"
 vassal.3003.b:0 "Serei amaldiçoad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a viver uma vida sem filhos?"
 vassal.3003.c:0 "Sim, algumas aulas particulares podem ajudar."
 vassal.3003.d:0 "A audácia!"
 vassal.3003.desc_bad_counsel:0 "M[Select_CString( vassal_to_ask.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_to_ask'))], [vassal_to_ask.GetTitledFirstName], me deu uma bebida para tomar, afirmando: \"Você vai notar a diferença imediatamente, [ROOT.Char.Custom('FormOfAddressForLiege')]!\"\n\nA falta de clareza [vassal_to_ask.GetHerHim|U] sobre os ingredientes me deixou um pouco preocupad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], e conforme sinto meus humores quentes diminuindo, amaldiçoo o conselho ruim [vassal_to_ask.GetHerHim]."
 vassal.3003.desc_good_counsel:0 "M[Select_CString( vassal_to_ask.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_to_ask'))], [vassal_to_ask.GetTitledFirstName], me deu uma bebida para tomar, afirmando: \"Você vai notar a diferença imediatamente, [ROOT.Char.Custom('FormOfAddressForLiege')]!\"\n\nA falta de clareza [vassal_to_ask.GetHerHim|U] sobre os ingredientes me deixou um pouco preocupad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], mas já consigo sentir a vitalidade fluindo fortemente em minhas veias!"
 vassal.3003.desc_making_a_move:0 "\"Mas, [ROOT.Char.Custom('FormOfAddressForLiege')], é tão difícil dar dicas. Seria muito mais fácil apenas mostrar a você...\""
 vassal.3003.desc_making_a_move_on_spouse:0 "\"Envie [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetWifeHusband] para mim, e eu direi a [spouse.GetSheHe] como agradá-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] melhor, [ROOT.Char.Custom('FormOfAddressForLiege')].\""
 vassal.3003.desc_refusal:0 "A audácia d[Select_CString( vassal_to_ask.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('vassal_to_ask'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_to_ask'))]! Mesmo depois de eu abordar [Select_CString( vassal_to_ask.IsFemale, 'a', 'o' )] [vassal_to_ask.GetTitledFirstName] com minha delicada pergunta, [vassal_to_ask.GetSheHe] me recusou."
 vassal.3003.spouse.tt:0 "Fertilidade Aumentada"
 vassal.3003.spouse:0 "Enviarei [spouse.GetSheHe] imediatamente!"
 vassal.3004.a:0 "É [liege_with_trouble.GetSheHe] que está perdendo!"
 vassal.3004.b:0 "Retribuir com minhas habilidades é o mínimo que posso fazer!"
 vassal.3004.c:0 "[spouse.GetFirstNameNoTooltip] é um[Select_CString( spouse.IsFemale, 'a', '' )] excelente alun[Select_CString( spouse.IsFemale, 'a', 'o' )]!"
 vassal.3004.desc:0 "A eficiência da minha lição particular com [Select_CString( liege_with_trouble.IsFemale, 'a', 'o' )] [liege_with_trouble.GetTitledFirstName] pode ser questionada, mas [liege_with_trouble.GetSheHe] certamente não expressou queixas.\n\nSe [Select_CString( spouse.IsFemale, 'sua', 'seu' )] [liege_with_trouble.Custom2('RelationToMe', SCOPE.sC('spouse'))] tiver sorte, [liege_with_trouble.GetSheHe] aprendeu alguma coisa...!"
 vassal.3004.desc_refused:0 "[liege_with_trouble.GetTitledFirstName] me recusou!\n\nSó posso esperar que [Select_CString( spouse.IsFemale, 'sua', 'seu' )] [liege_with_trouble.Custom2('RelationToMe', SCOPE.sC('spouse'))] tenha mais sorte em seus aposentos...!"
 vassal.3004.desc_spouse:0 "A eficiência da minha lição particular com [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetTitledFirstName] pode ser questionada, mas [spouse.GetSheHe] certamente não expressou queixas.\n\nSe [Select_CString( liege_with_trouble.IsFemale, 'sua', 'seu' )] [spouse.Custom2('RelationToMe', SCOPE.sC('liege_with_trouble'))] tiver sorte, [spouse.GetSheHe] aprendeu alguma coisa...!"
 vassal.5010.a.tt:0 "#F Eu prometo declarar guerra contra os infiéis.#!"
 vassal.5010.a:0 "Dentro de seis meses, marcharemos contra eles!"
 vassal.5010.b.tt:0 "#F Eu prometi tudo e nada ao mesmo tempo.#!"
 vassal.5010.b:0 "Quando chegar o momento certo..."
 vassal.5010.c:0 "Não diga ao [ROOT.Char.GetTitleTierName] o que [ROOT.Char.GetSheHe] deve fazer!"
 vassal.5010.desc:0 "Talvez não seja o meu lugar questionar sua estratégia, mas me pergunto por que você permite que os inimigos de nossa fé continuem suas atividades maléficas sem interferência. Temos os meios e o direito de aplicar a justiça do [ROOT.Char.GetFaith.HighGodNamePossessive], então certamente devemos fazê-lo!"
 vassal.5010.opening:0 "[vassal.Custom2('AppropriateGreeting', ROOT.Char)]"
 vassal.5020.a:0 "Talvez eu tenha falado precipitadamente."
 vassal.5020.b:0 "Palavras são apenas palavras ao vento."
 vassal.5020.desc:0 "Já se passou um ano desde que fiz a promessa de enviar exércitos contra os inimigos da fé. [vassal.GetTitledFirstName] ficará descontente com minha falta de ação prometida."
 vassal.5020.t:0 "Uma Promessa Piedosa Quebrada"
 vassal.5050.a.tt:0 "#F Prometo pressionar a reivindicação d[Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstNamePossessive].#!"
 vassal.5050.a:0 "Dentro de um ano, agirei em seu nome!"
 vassal.5050.b.tt:0 "#F Agirei apenas se e quando perceber algum benefício.#!"
 vassal.5050.b:0 "Quando chegar o momento certo..."
 vassal.5050.c:0 "Tenho muitos outros assuntos urgentes."
 vassal.5050.desc:0 "Gostaria de solicitar, com sua sabedoria, que considere minha reivindicação para o [claim.GetName]. Não é justo que [Select_CString( claimed_title_holder.IsFemale, 'a', 'o' )] [claimed_title_holder.GetTitledFirstName] permaneça seguro como um usurpador em seu castelo, zombando do direito de nascimento de minha dinastia. Por favor, [ROOT.Char.Custom('FormOfAddressForLiege')], apoie seu vassalo leal, empunhando armas caso não reconheçam minha reivindicação de bom grado!"
 vassal.5060.a:0 "Talvez não devesse ter feito tal compromisso."
 vassal.5060.b:0 "Mas o momento simplesmente não é o certo, você vê?"
 vassal.5060.desc:0 "Já se passou um ano desde que fiz a promessa [Select_CString( vassal.IsFemale, 'a', 'ao' )] [vassal.GetTitledFirstName] de ir à guerra por sua reivindicação sobre [claim.GetName]. [vassal.GetTitledFirstName] ficará descontente com minha falta de ação em seu nome."
 vassal.5060.t:0 "Uma Promessa Quebrada"
