l_spanish:
 accepted_sibling_help_tt:0 "Um sibling valioso pode sentir que lhe é devida alguma recompensa..."
 peasants_dislike_sibling_tt:0 "Os camponeses de [province.GetName] não estão satisfeitos"
 risk_of_sibling_producing_bastard_tt:0 "Isso pode ter consequências..."
 sibling.0001.a:0 "Eu vou conceder a você um título e terras próprias!"
 sibling.0001.b:0 "Você pode pedir qualquer favor, m[Select_CString( sibling.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling'))]."
 sibling.0001.c:0 "Aceite este presente e prove-se ao mundo, querid[Select_CString( sibling.IsFemale, 'a', 'o' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )]!"
 sibling.0001.desc:0 "[sibling.GetTitledFirstName] veio procurando uma audiência oficial comigo!\n\n\"Car[Select_CString( ROOT.GetCharacter.IsFemale, 'a', 'o' )] [sibling.Custom2('RelationToMe' , ROOT.GetCharacter )], tenho servido lealmente a você. Não é hora de ser devidamente recompensado por meu bom trabalho?\""
 sibling.0001.e:0 "Você não fez nada além do seu dever!"
 sibling.0001.t:0 "Merecidos Benefícios"
 sibling.0002.a:0 "Vou pagar para você esquecer essa promessa."
 sibling.0002.b:0 "Não tenho nada para te dar, [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )]."
 sibling.0002.desc:0 "M[Select_CString( sibling.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )], [sibling.GetFirstName], veio a mim, lembrando que uma vez prometi a [sibling.GetSheHe] terras e um título próprio.\n\n\"Esperei o suficiente, [sibling.Custom2('RelationToMe' , ROOT.Char )].\"\""
 sibling.0003.a:0 "Pela família e pelo reino!"
 sibling.0003.desc:0 "M[Select_CString( sibling.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )], [sibling.GetFirstName], veio a mim, trazendo dízimos de suas novas terras.\n\n\"[sibling.Custom2('RelationToMe' , ROOT.Char )|U]! Que esses presentes nos unam para sempre como companheiros assim como somos unidos pelo sangue!\""
 sibling.0004.a:0 "[Select_CString( sibling.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )] age em meu nome."
 sibling.0004.b:0 "Se recomponha, [sibling.GetFirstNameNoTooltip]!"
 sibling.0004.c:0 "Devo repreender vocês dois como crianças?!"
 sibling.0004.fallback:0 "\n\nEles simplesmente não conseguem se entender, e desta vez parece que um deles foi longe demais."
 sibling.0004.opening:0 "[vassal.GetTitledFirstName] veio novamente para reclamar [Select_CString( sibling.IsFemale, 'da minha', 'do meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )] [sibling.GetTitledFirstName]."
 sibling.0004.t:0 "[Select_CString( sibling.IsFemale, 'A', 'O' )] [sibling.Custom('SisterBrother')|U] e [Select_CString( vassal.IsFemale, 'a', 'o' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('vassal'))|U]"
 sibling.0005.a:0 "\"Não ouse falar de [sibling.GetHerHim] dessa forma!\""
 sibling.0005.b:0 "[sibling.GetSheHe|U] precisa aprender que o comportamento [sibling.GetHerHim] é inaceitável."
 sibling.0005.c:0 "Chega, [sibling.GetFirstNameNoTooltip]!"
 sibling.0005.desc:0 "Há algum tempo eu sabia que o dia do acerto de contas chegaria para [sibling.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n[vassal.GetTitledFirstName] me apresentou exigências não apenas em nome [Select_CString( vassal.IsFemale, 'dela mesma', 'dele mesmo' )], mas de todos os meus [ROOT.GetCharacter.Custom('powerful_vassals_loc')|l], para que eu faça algo sobre m[Select_CString( sibling.IsFemale, 'inha', 'eu' )] intolerável [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sibling'))]."
 sibling.0005.t:0 "Fonte de Problemas"
 sibling.1001.a:0 "Eu sei exatamente onde você seria mais útil."
 sibling.1001.b:0 "Eu me recuso a lhe dever qualquer coisa, [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )]."
 sibling.1001.desc:0 "M[Select_CString( sibling.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sibling'))], [sibling.GetTitledFirstName], veio até mim com ideias de como colocar sua língua afiada em bom uso.\n\n\"Posso servir como emissário, ou até mesmo ditar suas mensagens e ordens.\""
 sibling.1001.t:0 "Apoio Diplomático"
 sibling.1002.a:0 "Eu sei exatamente onde você seria mais útil."
 sibling.1002.b:0 "Eu me recuso a dever qualquer coisa a você, [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sibling') )]."
 sibling.1002.desc:0 "M[Select_CString( sibling.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sibling'))], [sibling.GetTitledFirstName], veio até mim para destacar seu entendimento sobre a guerra.\n\n\"Deixe-me ajudar a treinar seus soldados, e eles lutarão como nenhum exército que você já viu antes.\""
 sibling.1002.t:0 "Conhecimento Marcial"
 sibling.1003.a:0 "Laços familiares são os únicos em que realmente posso confiar."
 sibling.1003.b:0 "Você acha que confio em você, [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sibling') )]?"
 sibling.1003.desc:0 "M[Select_CString( sibling.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sibling'))], [sibling.GetTitledFirstName], se ofereceu para me passar mensagens sobre o que acontece em minha corte.\n\n\"Ter um verdadeiro lealista entre os [ROOT.Char.Custom('GetCourt')|l] seria benéfico para você...\""
 sibling.1003.t:0 "Segredos e Sussurros"
 sibling.1004.a:0 "Sim, [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sibling'))], faça minha tesouraria crescer."
 sibling.1004.b:0 "Eu sei o motivo — você quer pôr as mãos no meu dinheiro..."
 sibling.1004.desc:0 "Ao revisar as contas do [ROOT.Char.Custom('GetRealmOrDomicile')|l], m[Select_CString( sibling.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sibling'))], [sibling.GetTitledFirstName], não consegue conter o riso.\n\n\"[ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sibling'))|U], por favor, permita-me mostrar a quem quer que seja responsável por essa bagunça como se faz.\""
 sibling.1004.t:0 "O Fluxo do Ouro"
 sibling.1005.a:0 "Por favor, ajude a guiar minha mão, [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sibling') )]."
 sibling.1005.b:0 "Eu nunca colocaria minha alma em suas mãos."
 sibling.1005.desc:0 "Pouc[Select_CString( sibling.IsFemale, 'as', 'os' )] [sibling.GetWomenMen] podem igualar m[Select_CString( sibling.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sibling'))], [sibling.GetTitledFirstName], em discernimento.\n\n[sibling.GetSheHe|U] agora se oferece para compartilhar um pouco disso comigo, como conselheiro da [ROOT.Char.Custom('GetCourt')|l] em todos os assuntos espirituais."
 sibling.1005.t:0 "Contemplações sobre a Divindade"
 sibling.2001.a:0 "Ai de mim, mas [sibling.GetSheHe] é família!"
 sibling.2001.b:0 "Chega, [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sibling'))]!"
 sibling.2001.fallback:0 "\n\nSe m[Select_CString( sibling.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sibling'))] não está acidentalmente colocando fogo em algo ou desperdiçando meu ouro, [sibling.GetSheHe] está incomodando meus [ROOT.Char.Custom('GetCourtierPlural')]."
 sibling.2001.opening:0 "Eu mal posso suportar a presença d[Select_CString( sibling.IsFemale, 'a', 'o' )] [sibling.GetTitledFirstName]."
 sibling.2001.t:0 "Um Incômodo"
 sibling.8001.a:0 "Minha bolsa está fechada agora, [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sibling'))]!"
 sibling.8001.desc:0 "M[Select_CString( sibling.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sibling'))] avarent[Select_CString( sibling.IsFemale, 'a', 'o' )], [sibling.GetTitledFirstName], continua pegando cada vez mais moedas como \"mesada\".\n\nAgora [sibling.GetSheHe] foi longe demais, ao insistir em dinheiro para uma empreitada comercial, mas ficando com tudo para [sibling.GetHerselfHimself]!"
 sibling.8001.t:0 "O Custo da Família"
 sibling.8002.a:0 "Bom trabalho, [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sibling'))]."
 sibling.8002.b:0 "Isso foi feito com MEU ouro?!"
 sibling.8002.desc:0 "M[Select_CString( sibling.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling'))] [ROOT.GetCharacter.Custom('trait_generous_adjective')], [sibling.GetTitledFirstName], tem viajado por [province.GetName], ouvindo as dificuldades dos camponeses, e generosamente distribuindo presentes e promessas.\n\n[sibling.GetSheHe|U] até deixou bem claro que todas essas ações eram bondades em nome d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] #EMP '[ROOT.Char.GetTitledFirstNameNoTooltip] o Bom'#!..."
 sibling.8002.t:0 "Bolsos Profundos"
 sibling.8003.a:0 "Ah, m[Select_CString( sibling.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling'))] pode fazer o que [sibling.GetSheHe] quiser..."
 sibling.8003.b:0 "[sibling.GetSheHe|U] pode não ver mais o [sibling.Custom('servant_for_romance')]!"
 sibling.8003.desc:0 "M[Select_CString( sibling.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling'))] [ROOT.GetCharacter.Custom('trait_lustful_adjective')], [sibling.GetTitledFirstName], tem tomado muitas decisões ruins, mas se envolver com um [sibling.Custom('servant_for_romance')] comum pode ser a pior delas!"
 sibling.8003.t:0 "Indiscrições"
 sibling.8004.a:0 "Eu entendo por que eles estão chateados."
 sibling.8004.desc:0 "Viajando por [province.GetName], m[Select_CString( sibling.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )] parece ter incomodado profundamente os camponeses de várias aldeias e cidades. [sibling.GetTitledFirstName] exigiu não apenas abrigo e tratamento como se [sibling.GetSheHe] fosse um [ROOT.GetCharacter.Custom2('using_my_title' , SCOPE.sC('sibling') ) ], mas também puniu as pessoas por qualquer demonstração mínima de desrespeito."
 sibling.8004.t:0 "Respeito aos Superiores"
 sibling.8005.a:0 "Alguns presentes irão compensar."
 sibling.8005.b:0 "\"[sibling.GetFirstNameNoTooltip]!!!\""
 sibling.8005.desc:0 "M[Select_CString( sibling.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )] [sibling.GetTitledFirstName] deveria dar as boas-vindas [Select_CString( vassal.IsFemale, 'a', 'ao' )] [vassal.GetTitledFirstName] por sua visita à minha corte.\n\n[vassal.GetFirstName] foi adiado por dias, no entanto, e agora que [vassal.GetSheHe] chegou, m[Select_CString( sibling.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )] [ROOT.GetCharacter.Custom('trait_impatient_adjective')] não foi encontrado em lugar algum, deixando meu convidado sem recepção!"
 sibling.8005.t:0 "Uma Recepcão Vazia"
 sibling.8006.a:0 "[sibling.GetFirstNameNoTooltip] deveria passar mais tempo na corte d[Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetFirstNamePossessiveNoTooltip]."
 sibling.8006.b:0 "Eu também tenho alguns casos que m[Select_CString( sibling.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )] poderia julgar por mim!"
 sibling.8006.desc:0 "Enquanto visitava a corte d[Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstName], m[Select_CString( sibling.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )], [sibling.GetTitledFirstName], foi solicitad[Select_CString( sibling.IsFemale, 'a', 'o' )] a julgar em meu nome.\n\n[vassal.GetFirstNameNoTooltip] elogiou longamente o senso de justiça d[Select_CString( sibling.IsFemale, 'a', 'o' )] [sibling.GetFirstNamePossessiveNoTooltip] e parece muito satisfeit[Select_CString( vassal.IsFemale, 'a', 'o' )] com a visita d[Select_CString( sibling.IsFemale, 'a', 'o' )] [sibling.Custom('SisterBrotherPossessive')]."
 sibling.8006.t:0 "Rigoroso, Mas Justo"
 sibling_becomes_councillor_tt:0 "[sibling.GetFirstName] torna-se um dos meus conselheiros."
 sibling_funded_for_invasion:0 "[sibling.GetFirstName] vai procurar um reino adequado para tentar a sorte."
 sibling_promised_land_tt:0 "[sibling.GetFirstName] espera que eu forneça um título para [sibling.GetSheHe] muito em breve"
