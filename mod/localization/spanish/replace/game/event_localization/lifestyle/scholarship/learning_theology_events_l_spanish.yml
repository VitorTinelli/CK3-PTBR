l_spanish:
 learning_theology.1301.a:0 "Vou garantir que o livro chegue até você."
 learning_theology.1301.b:0 "Hm, esse livro parece interessante..."
 learning_theology.1301.c:0 "Isso parece ser um problema #EMP seu#!."
 learning_theology.1301.desc:0 "\"Um mercador local tem uma cópia do livro abrangente sobre cálculos e balanços, mas se recusa a vendê-lo para mim."
 learning_theology.1301.desc_ending:0 "Se você fizer com que ele veja o erro de seu caminho, ficarei em sua dívida!\""
 learning_theology.1301.desc_opening:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [bishop.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim com urgência.\n\n"
 learning_theology.1301.desc_regula_pastoralis:0 "\"Um mercador local tem uma cópia do influente Regula Pastoralis, mas se recusa a vendê-lo para mim."
 learning_theology.1301.t:0 "Literatura Desejada"
 learning_theology.2020.ambitious:0 "...ambição."
 learning_theology.2020.brave:0 "...coragem."
 learning_theology.2020.calm:0 "...serenidade."
 learning_theology.2020.chaste:0 "...castidade."
 learning_theology.2020.compassionate:0 "...compaixão."
 learning_theology.2020.content:0 "...contentamento."
 learning_theology.2020.desc:0 "[court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstName] frequentemente cita passagens do [ROOT.Char.GetFaith.ReligiousText] sobre as virtudes sagradas. Devo provar que prestei atenção citando uma passagem minha - preferencialmente uma que elogie a personalidade [court_chaplain.GetHerHim].\n\nVou memorizar e recitar uma seção sobre..."
 learning_theology.2020.diligent:0 "...diligência."
 learning_theology.2020.failure.desc:0 "[court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstNameNoTooltip] acha que estou zombando del[Select_CString( court_chaplain.IsFemale, 'a', 'e' )]"
 learning_theology.2020.forgiving:0 "...perdão."
 learning_theology.2020.generous:0 "...generosidade."
 learning_theology.2020.gluttonous:0 "...um bom apetite."
 learning_theology.2020.greedy:0 "...riqueza."
 learning_theology.2020.honest:0 "...honestidade."
 learning_theology.2020.humble:0 "...humildade."
 learning_theology.2020.just:0 "...justiça."
 learning_theology.2020.lustful:0 "...desejo."
 learning_theology.2020.neutral.desc:0 "[court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstNameNoTooltip] está satisfeit[Select_CString( court_chaplain.IsFemale, 'a', 'o' )]"
 learning_theology.2020.patient:0 "...paciência."
 learning_theology.2020.success.desc:0 "[court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstNameNoTooltip] se sente lisonjead[Select_CString( court_chaplain.IsFemale, 'a', 'o' )]"
 learning_theology.2020.t:0 "O Poder do [ROOT.Char.GetFaith.ReligiousText|U]"
 learning_theology.2020.temperate:0 "...temperança."
 learning_theology.2020.vengeful:0 "...vingança."
 learning_theology.2020.wrathful:0 "...ferocidade."
 learning_theology.2021.a:0 "Talvez eu devesse ler o [ROOT.Char.GetFaith.ReligiousText] com mais frequência..."
 learning_theology.2021.desc:0 "Tenho certeza de que [court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstName] disse algo sobre as virtudes de ser [SCOPE.Custom('virtue_choice')]. Não consigo lembrar suas palavras exatas, então me permito alguma criatividade.\n\nInfelizmente, o [court_chaplain.GetCouncilTitle|U] é bastante conservador. \"Do que você está falando?\" [court_chaplain.GetSheHe] zomba. \"Essas não são as palavras de [ROOT.Char.GetFaith.HighGodName]!\""
 learning_theology.3002.a:0 "Todos merecem saber a verdade!"
 learning_theology.3002.b:0 "Um ponto razoável, [chaplain.GetFirstNameNoTooltip]."
 learning_theology.3002.c:0 "Devo consultar mais [ROOT.Char.GetFaith.PriestNeuterPlural]."
 learning_theology.3002.desc.clergy:0 "$learning_theology.3002.desc.intro$ \"Tal conhecimento cabe a nós, homens da igreja, ponderar, não ao rebanho temer. E se os seus cálculos estiverem errados?\""
 learning_theology.3002.desc.intro:0 "Tenho estudado os textos religiosos antigos e os escritos de eruditos, e todos parecem concordar que [ROOT.Char.Custom('WorldDeadline')]. Pelos meus cálculos, estamos a menos de um século de distância.\n\nContudo, meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chaplain'))], [chaplain.GetTitledFirstName], insta-me a guardar segredo."
 learning_theology.3002.desc:0 "Tenho estudado os antigos textos religiosos e os escritos de estudiosos, e todos parecem concordar que [ROOT.Char.Custom('WorldDeadline')]. Pelos meus cálculos, faltam menos de um século.\n\nNo entanto, m[Select_CString( chaplain.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chaplain'))], [chaplain.GetTitledFirstName], insta-me a manter isso em segredo. \"Deixe isso para os [ROOT.Char.GetFaith.AltPriestTermPlural] e evite o pânico. E se seus cálculos estiverem errados?\""
 learning_theology.3002.t:0 "A Era do Mundo"
 learning_theology.3003.a:0 "Encontrarei minhas respostas nos céus."
 learning_theology.3003.b:0 "Você está certo, devo me concentrar em assuntos terrenos."
 learning_theology.3003.desc:0 "De todas as minhas noites observando as estrelas, vi com meus próprios olhos o que só havia ouvido falar.\n\nAs estrelas se movem em velocidades diferentes e revertem seu curso em tempos diferentes, mas aparentemente em grupos grandes, dependendo da esfera celestial a que pertencem. De fato, com os cálculos corretos, seria possível até mesmo prever seu movimento.\n\nM[Select_CString( chaplain.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chaplain'))] não aprova, é claro. \"Deixe os céus em paz. O reino celestial é para os [ROOT.Char.GetFaith.AltPriestTermPlural] conhecerem.\""
 learning_theology.3003.t:0 "Encarando as Estrelas"
 learning_theology.3011.a.failure:0 "A [ROOT.Char.GetFaith.HouseOfWorship] nunca recebe uma moeda"
 learning_theology.3011.a.success:0 "Os comerciantes estão convencidos"
 learning_theology.3011.a:0 "Ajude-me a convencê-los, [believer.GetTitledFirstNameNoTooltip]!"
 learning_theology.3011.a_friend:0 "Vamos convencê-los de que [ROOT.Char.GetFaith.WealthGodName] deu sinais!"
 learning_theology.3011.b:0 "Eu sei de um lugar onde seu ouro seria melhor utilizado...!"
 learning_theology.3011.desc:0 "Ao sair da [ROOT.Char.GetFaith.HouseOfWorship] em [temple_county.GetName], acabo na companhia de alguns comerciantes locais, bem como [Select_CString( believer.IsFemale, 'a', 'o' )] [believer.GetTitledFirstName]."
 learning_theology.3011.desc_friend:0 "Ao sair da [ROOT.Char.GetFaith.HouseOfWorship] em [temple_county.GetName], eu e m[Select_CString( believer.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('believer'))] [believer.GetTitledFirstName] acabamos na companhia de alguns comerciantes locais."
 learning_theology.3011.ending:0 "Eles estão no meio de uma discussão sobre teologia e riqueza mundana.\n\n\"Eu #EMP investiria na [ROOT.Char.GetFaith.HouseOfWorship], mas como posso saber se essa é a vontade de [ROOT.Char.GetFaith.WealthGodNamePossessive]?\""
 learning_theology.3011.t:0 "Oração Compartilhada"
 learning_theology.3021.b:0 "Apenas superior, [ROOT.Char.GetFaith.HighGodName|U]!"
 learning_theology.3021.desc:0 "Sento-me com um escriba, "
 learning_theology.3021.desc_christian:0 "e juntos redigimos uma carta realmente esplêndida destacando a..."
 learning_theology.3021.desc_friend:0 "Sento-me com m[Select_CString( believer.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('believer'))], [believer.GetTitledFirstName],"
 learning_theology.3021.desc_opening:0 "Minhas recentes empreitadas no campo da teologia me fizeram apreciar ainda mais os representantes de [ROOT.Char.GetFaith.HighGodNamePossessive] na Terra. Tentando expressar alguns desses sentimentos, vou redigir uma carta para [Select_CString( compliment_receiver.IsFemale, 'a', 'o' )] [compliment_receiver.GetTitleAsName], [compliment_receiver.GetFirstName].\n\n"
 learning_theology.3021.desc_other:0 "e juntos redigimos uma carta realmente esplêndida destacando..."
 learning_theology.3021.success.tt:0 "A critério d[Select_CString( believer.IsFemale, 'a', 'o' )] [believer.GetTitledFirstNameNoTooltip]:"
 learning_theology.3021.t:0 "Carta Sagrada"
 learning_theology.3022.a:0 "Louvado seja [ROOT.Char.GetFaith.HighGodNameAlternate]!"
 learning_theology.3022.desc:0 "Sua carta é muito apreciada! Sua visão sobre o reino de [ROOT.Char.GetFaith.HighGodName|U] e a natureza humana é impressionante."
 learning_theology.3022.opening:0 "[compliment_receiver.Custom2('AppropriateGreeting', ROOT.Char)]"
 learning_theology.3023.a:0 "Seja como for."
 learning_theology.3023.desc:0 "Estou impressionado com suas percepções sobre nossa religião, mas menos impressionado com sua percepção sobre seus semelhantes."
 learning_theology.3023.opening:0 "[compliment_receiver.Custom2('AppropriateGreeting', ROOT.Char)]"
 learning_theology.3024.a:0 "Maldição...!"
 learning_theology.3024.desc:0 "Sua fanfarronice vazia como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] de [ROOT.Char.GetFaith.HighGodName] não me engana, e sua visão turva sobre os corações das pessoas o denuncia!"
 learning_theology.3024.opening:0 "[compliment_receiver.Custom2('AppropriateGreeting', ROOT.Char)]"
 learning_theology.3031.a:0 "Como eles adoram não é da minha conta."
 learning_theology.3031.b:0 "Eles #EMP devem#! rezar para [ROOT.Char.GetFaith.PantheonTerm]!"
 learning_theology.3031.b_confucian:0 "Eles seguirão o caminho!"
 learning_theology.3031.b_tt2:0 "Será mais fácil Converter a Fé em [county.GetNameNoTooltip] por 30 anos"
 learning_theology.3031.b_tt:0 "Progresso aumentado da tarefa de conversão do conselho $task_conversion$"
 learning_theology.3031.desc:0 "Muitos condenam isso como heresia, mas as pessoas pedem compreensão..."
 learning_theology.3031.desc_bishop:0 "[bishop.GetCouncilTitle|U] [bishop.GetFirstName] condena isso como heresia, mas as pessoas pedem compreensão..."
 learning_theology.3031.desc_opening:0 "Em [county.GetName], eles acreditam no [county.GetProvince.GetCounty.GetFaith.GetNameNoTooltip].\n\n"
 learning_theology.3031.t:0 "Diferenças na Fé"
 learning_theology.3041.a.tt:0 "Você testa as práticas místicas"
 learning_theology.3041.a:0 "Fico curioso para saber o que aconteceria se eu imitasse suas práticas."
 learning_theology.3041.b.tt:0 "Você tenta aprender mais sobre a prática por meio de livros"
 learning_theology.3041.b:0 "O que outros textos dizem?"
 learning_theology.3041.desc:0 "Ouvi dizer que [ROOT.Char.GetFaith.DevoteeNeuterPlural] entram em transe e têm visões de êxtase para comungar com [ROOT.Char.GetFaith.HighGodName].\n\nSerá que eu também poderia alcançar esse tipo de conexão divina?"
 learning_theology.3041.t:0 "Conhecimento Místico"
 learning_theology.3042.a.tt:0 "Você continua experimentando"
 learning_theology.3042.a:0 "Preciso tentar novamente para ver se algo está diferente!"
 learning_theology.3042.b:0 "Interessante. Vou registrar minhas descobertas para o futuro."
 learning_theology.3042.desc:0 "Trancado em uma sala, pós estranhos em um fogo ardente forneceram calor opressor, fumaça e cheiros enquanto eu tentava sentir as coisas que estão além do mundo dos sentidos.\n\nNão sei quanto tempo se passou antes de visões estranhas e indecifráveis de luz e sons pulsantes virem até mim. Foi minha imaginação ou um vislumbre do divino? Existe alguma maneira de saber?"
 learning_theology.3043.a:0 "Isso é o que eu tenho procurado!"
 learning_theology.3043.b:0 "Quase nada divino — mas muito relaxante!"
 learning_theology.3043.desc:0 "Conforme experimento cada vez mais, tenho uma compreensão cada vez mais clara das coisas. É como se agora eu pudesse convocar a presença que sinto quando começo meu pequeno ritual.\n\nIsso oferece estabilidade e conforto à medida que o caos do mundo gira ao meu redor."
 learning_theology.3044.a:0 "Isso está me ensinando muito sobre minha fé!"
 learning_theology.3044.b:0 "Talvez eu deva experimentar um pouco afinal..."
 learning_theology.3044.desc:0 "Quanto mais eu me aprofundo nos antigos textos, mais descubro. Será que as práticas misteriosas dos antigos [ROOT.Char.GetFaith.DevoteeNeuterPlural] antecedem até mesmo a própria [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]?\n\nParece que tropecei em algo notável."
 learning_theology.3045.a:0 "Tenho que recuperar aquela sensação!"
 learning_theology.3045.b:0 "Uma oração é tudo que preciso para me comunicar com [ROOT.Char.GetFaith.HighGodNameAlternate]."
 learning_theology.3045.desc:0 "Isso é tão frustrante! Não importa o que eu faça, não consigo capturar a sensação que tive em minhas primeiras experiências místicas.\n\nAquela sensação de que #EMP algo#! está lá, apenas fora do alcance, simplesmente desapareceu, não importa o que eu faça!"
 learning_theology.3046.a.failure.tt:0 "Sua busca te enlouquece"
 learning_theology.3046.a.failure:0 "Ainda nada!"
 learning_theology.3046.a.success.tt:0 "Você pode obter [GetTrait('lifestyle_mystic').GetName( GetPlayer )]"
 learning_theology.3046.a.success:0 "Um experimento bem-sucedido"
 learning_theology.3046.a:0 "Preciso encontrar as respostas!"
 learning_theology.3046.b:0 "O que estou fazendo... É hora de desistir dessa loucura."
 learning_theology.3046.desc:0 "Tenho buscado conhecimento e experiência mística há tanto tempo agora, e ainda assim... nada! A única resposta que me resta é voltar ao começo e recriar perfeitamente as condições do meu experimento.\n\nPreciso me comunicar com o divino. Será que estou sendo intencionalmente ignorado?!"
 learning_theology.3047.a:0 "[ROOT.Char.GetFaith.HighGodName] me escolheu! Eu sou único!"
 learning_theology.3047.desc:0 "Eu não preciso de rituais antigos para me comunicar com o divino. O divino fala comigo o tempo todo. Eu o ouço. Não tenho nada com que me preocupar e nada a buscar. Está tudo bem aqui comigo, todas as manhãs, todas as noites, todas as noites.\n\nEle fala comigo, e somente comigo!"
 learning_theology.3051.a:0 "Uma noite piedosa no teatro!"
 learning_theology.3051.arabian_nights:0 "2000 Noites [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), ROOT.Char.GetCulture.GetCollectiveNounNoTooltip, ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip ) ]"
 learning_theology.3051.b:0 "Não vou menosprezar a criação de [ROOT.Char.GetFaith.CreatorName]."
 learning_theology.3051.desc.arabian_nights:0 "\"$learning_theology.3051.arabian_nights$.\""
 learning_theology.3051.desc.inferno:0 "\"$learning_theology.3051.inferno$.\""
 learning_theology.3051.desc.intro:0 "Fui informado de que [passion_playwright.GetName], um renomado dramaturgo [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip], pretende realizar uma apresentação de sua obra intitulada:"
 learning_theology.3051.desc.my_immortal:0 "\"$learning_theology.3051.my_immortal$.\""
 learning_theology.3051.desc.outro:0 "\n\nO preço da entrada é alto, mas esta é provavelmente uma oportunidade única na vida de testemunhar uma peça de [passion_playwright.GetNameNoTooltip] com meus próprios olhos!"
 learning_theology.3051.desc.passion:0 "\"$learning_theology.3051.passion$.\""
 learning_theology.3051.inferno:0 "Inferno de [ROOT.Char.GetFaith.random_EvilGodNames]"
 learning_theology.3051.my_immortal:0 "Meu [passion_playwright.GetRandomPositiveTrait]"
 learning_theology.3051.passion:0 "A Paixão de [ROOT.Char.GetFaith.random_GoodGodNames]"
 learning_theology.3051.t:0 "A Paixão [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 learning_theology.3052.a:0 "Você deve me ensinar a interpretar o [ROOT.Char.GetFaith.ReligiousText] como você faz!"
 learning_theology.3052.b:0 "Eu poderia escrever algo melhor do que isso!"
 learning_theology.3052.desc:0 "Conforme assisto a peça se desenrolar diante de mim, fica claro rapidamente por que [passion_playwright.GetName] é tão conhecido como um gênio literário.\n\nA prosa, a performance, tudo isso me faz sentir como se estivesse testemunhando os eventos do [ROOT.Char.GetFaith.ReligiousText] se desdobrarem diante de mim — como se eu estivesse lá para contemplar a obra de [ROOT.Char.GetFaith.CreatorName] eu mesmo!\n\nQuando a peça chega ao fim, me encontro sozinho com [passion_playwright.GetNameNoTooltip]."
 learning_theology.3053.a:0 "Vaias!"
 learning_theology.3053.b:0 "Vou escrever minha própria peça!"
 learning_theology.3053.c:0 "Esses tolos simplesmente não apreciam o gênio d[Select_CString( passion_playwright.IsFemale, 'a', 'o' )] [passion_playwright.GetFirstNamePossessiveNoTooltip]!"
 learning_theology.3053.desc:0 "Assisto à peça se desenrolar diante de mim e é, sem dúvida, uma total bobagem. O que acabei de presenciar não é digno nem de ser chamado de literatura.\n\nA história segue [ROOT.Char.GetCapitalLocation.Custom('GetRandomRegionalWood')|U] [ROOT.Char.Custom('GetRandomRegionalBird')|U], um jovem estudioso que estuda o misticismo e a bruxaria [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip], ao mesmo tempo que busca amante após amante dentro do círculo acadêmico [passion_playwright.GetHerHim].\n\nA peça tem pouquíssima relação com o [ROOT.Char.GetFaith.ReligiousText], e meus colegas de plateia já estão começando a zombar e vaiar a escrita desleixada de [passion_playwright.GetNamePossessive]."
 learning_theology.3054.a.tt:0 "Você tentará superar [passion_playwright.GetName] em um duelo usando sua [diplomacy_skill]."
 learning_theology.3054.a:0 "Eu mesmo disfarçado, é claro!"
 learning_theology.3054.b.tt:0 "[family_actor.GetName] tentará superar [passion_playwright.GetName] em um duelo usando sua [diplomacy_skill]."
 learning_theology.3054.b:0 "É a vez d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [family_actor.Custom2('RelationToMeShort', ROOT.Char)|U] brilhar!"
 learning_theology.3054.c.tt:0 "[random_actor.GetName] tentará superar [passion_playwright.GetName] em um duelo usando sua [diplomacy_skill]."
 learning_theology.3054.c:0 "[Select_CString( random_actor.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', random_actor)], [random_actor.GetTitledFirstNameNoTooltip], é [Select_CString( random_actor.IsFemale, 'uma encantadora nata', 'um encantador nato' )]."
 learning_theology.3054.desc.intro:0 "Já faz algum tempo desde que jurei superar o trabalho inferior de [passion_playwright.GetName], e à medida que a tinta dos meus escribas seca, admiro meu próprio trabalho.\n\n"
 learning_theology.3054.desc.outro:0 "é uma obra merecedora de ser chamada de \"obra-prima\" por minha própria humilde avaliação.\n\nA única pergunta que resta é quem deveria interpretar o papel principal?"
 learning_theology.3054.t:0 "Uma Peça Própria [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip]"
 learning_theology.3055.a:0 "Que ótima noite para os [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] em todos os lugares!"
 learning_theology.3055.b:0 "Talvez atuar não seja para mim..."
 learning_theology.3055.desc.defeat_acting.hired_actor:0 "\n\nPara meu horror, [lead_actor.GetSheHe] engasga com suas palavras e falha em entregar até mesmo uma performance aceitável. Meu sangue ferve enquanto vejo [lead_actor.GetSheHe] destruir minha grande obra, impotente em meu assento para impedir as vaias do público."
 learning_theology.3055.desc.defeat_acting.solo:0 "\n\nAo tentar ler as falas iniciais, imediatamente engasgo com minhas palavras e tropeço pelo roteiro de forma rígida, falhando em lembrar meus próprios escritos. Meu público não me concede perdão algum, começando rapidamente a vaiar e sibilar para mim!"
 learning_theology.3055.desc.defeat_outro.hired_actor:0 "\n\n[lead_actor.GetTitledFirstNameNoTooltip|U] continua insistindo, esperando que talvez esta peça ainda possa ser redimida, mas o espetáculo é um fracasso. Antes mesmo de chegarmos ao fim, as cadeiras do teatro se esvaziam e eu fico ali, um fracasso."
 learning_theology.3055.desc.defeat_outro.solo:0 "\n\nContinuo insistindo, esperando que em algum momento eu consiga recuperar meu ritmo e salvar esta apresentação, mas não adianta. Antes mesmo de eu chegar ao fim, as cadeiras do teatro se esvaziam e fico ali, um fracasso."
 learning_theology.3055.desc.defeat_writing.hired_actor:0 "\n\nPara meu horror, embora [lead_actor.GetSheHe] recite minhas falas exatamente como eu as imaginei, o público rapidamente se volta contra [lead_actor.GetSheHe], vaiando e assobiando enquanto [lead_actor.GetSheHe] dá uma performance tão excelente!"
 learning_theology.3055.desc.defeat_writing.solo:0 "\n\nApesar de eu recitar minhas falas perfeitamente, os rostos esperançosos do público rapidamente começam a se tornar amargos e confusos."
 learning_theology.3055.desc.intro.hired_actor:0 "Sento-me entre o público, observando [lead_actor.GetName] enquanto [lead_actor.GetSheHe] começa sua performance da minha obra-prima."
 learning_theology.3055.desc.intro.solo:0 "Respiro fundo e me preparo para encenar minha peça, certo de que ela será impecável comigo aqui para entregar sua mensagem piedosa."
 learning_theology.3055.desc.victory.hired_actor:0 "\n\nPara minha alegria, [lead_actor.GetSheHe] entrega uma performance digna não apenas dos meus escritos, mas de [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself]! "
 learning_theology.3055.desc.victory.solo:0 "\n\nRespirando novamente, recito minhas falas perfeitamente, e o público ao meu redor fica cativo às minhas palavras. Eu os deleito profundamente com minha interpretação magistral das histórias do [ROOT.Char.GetFaith.ReligiousText]."
 learning_theology.3055.desc.victory_outro:0 "\n\nQuando a plateia irrompe em aplausos, tenho certeza de que me superei e mostrei a [passion_playwright.GetName] como um verdadeiro [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] escreve uma peça!"
 learning_theology.3055.t:0 "Estreia Dramática"
 learning_theology_special.1001.a.desc:0 "Dependendo do quão zelos[Select_CString( bishop.IsFemale, 'a', 'o' )] [Select_CString( bishop.IsFemale, 'a', 'o' )] [bishop.GetTitledFirstName] for"
 learning_theology_special.1001.a.failure.toast:0 "[bishop.GetTitledFirstName] me agradeceu por entregar o livro herético à fogueira"
 learning_theology_special.1001.a.failure:0 "[bishop.GetSheHe|U] manda queimar o livro"
 learning_theology_special.1001.a.success.toast:0 "[bishop.GetTitledFirstName] me parabenizou pela descoberta rara"
 learning_theology_special.1001.a.success:0 "[bishop.GetSheHe|U] vai me ajudar a estudar"
 learning_theology_special.1001.a:0 "[bishop.GetTitledFirstNameNoTooltip] poderia me ajudar a estudar este texto."
 learning_theology_special.1001.b:0 "É melhor eu estudar isso em privado..."
 learning_theology_special.1001.c:0 "Essa porcaria herética deve queimar!"
 learning_theology_special.1001.d.failure.toast:0 "Minha tentativa de integrar o texto apócrifo falhou"
 learning_theology_special.1001.d.failure:0 "Não consigo convencer o restante do clero"
 learning_theology_special.1001.d.success:0 "Eu integro com sucesso minhas descobertas no dogma [THIS.Char.GetFaith.GetAdjective] atual"
 learning_theology_special.1001.d:0 "Devemos reviver essas práticas antigas."
 learning_theology_special.1001.desc:0 "Minha busca insaciável por conhecimento me levou a descobrir um estranho texto antigo.\n\nO volume, atribuído a um antigo teólogo que raramente é mencionado em fontes oficiais, lança luz sobre certos aspectos do [ROOT.Char.GetFaith.GetName] que eu não fazia ideia de que pertenciam ao dogma da fé."
 learning_theology_special.1001.e.failure.toast:0 "[vassal_pope.GetTitledFirstName] descartou o texto como um embuste herético"
 learning_theology_special.1001.e.failure:0 "[vassal_pope.GetTitledFirstNameNoTooltip] se recusa a aceitar o texto como genuíno"
 learning_theology_special.1001.e.success:0 "Eu convenço [Select_CString( vassal_pope.IsFemale, 'a', 'o' )] [vassal_pope.GetTitledFirstName] a integrar minhas descobertas no dogma [THIS.Char.GetFaith.GetAdjective] atual"
 learning_theology_special.1001.e:0 "[vassal_pope.GetTitledFirstNameNoTooltip] precisa ser informad[Select_CString( vassal_pope.IsFemale, 'a', 'o' )] disso!"
 learning_theology_special.1001.t:0 "Apócrifo"
 learning_theology_special.1002.a.desc:0 "Ao integrar o conteúdo do antigo texto às práticas modernas [ROOT.Char.GetFaith.GetAdjective], deixei uma marca histórica em nossa fé, algo que poucos dos meus sucessores esperarão alcançar.\n\nAlguns representantes notáveis do clero ainda zombam dessa mudança incomum em nossas doutrinas, mas, graças à minha eloquência, a maioria dos teocratas influentes foi convencida da legitimidade da minha reforma."
 learning_theology_special.1002.a:0 "Claramente, [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself] me guiou até este livro!"
 learning_theology_special.1002.b.desc:0 "Convencer [Select_CString( vassal_pope.IsFemale, 'a', 'o' )] [vassal_pope.GetTitledFirstName] da autenticidade do texto não foi tarefa fácil, e depois o outro representante importante da fé [ROOT.Char.GetFaith.GetAdjective] abaixo [vassal_pope.GetHerHim], mas minha paixão e meu conhecimento em assuntos teológicos venceram o dia.\n\nAlguns representantes notáveis do clero ainda zombam dessa mudança incomum em nossas doutrinas, mas a maioria dos teocratas influentes foi convencida de sua legitimidade."
 learning_theology_special.1002.t:0 "Novo Dogma"
 learning_theology_special.1003.a.desc:0 "Com toda a minha imensa sabedoria, [player_pope.GetTitledFirstName] descobriu um antigo texto religioso que muda significativamente o dogma [ROOT.Char.GetFaith.GetAdjective].\n\nApós discutir suas descobertas com membros notáveis do clero, o [player_pope.GetTitleTierName] decidiu integrar o conteúdo do livro na doutrina oficial da fé."
 learning_theology_special.1003.a:0 "O que isso significa para o resto de nós, exatamente?"
 learning_theology_special.1003.b.desc:0 "Após pesquisas árduas e horas intermináveis de estudos teológicos, [pope_liege.GetTitledFirstName] descobriu um antigo texto religioso que muda significativamente o dogma [ROOT.Char.GetFaith.GetAdjective].\n\nApós apresentar suas descobertas [Select_CString( vassal_pope.IsFemale, 'a', 'ao' )] [vassal_pope.GetTitledFirstName], o [vassal_pope.GetTitleTierName] decidiu integrar o conteúdo do livro na doutrina oficial da fé."
 learning_theology_special.1101.a:0 "Vamos escrever comentários sobre o [ROOT.Char.GetFaith.ReligiousText]!"
 learning_theology_special.1101.b:0 "Tenho assuntos mais urgentes no mundo real."
 learning_theology_special.1101.c:0 "Nunca hospedarei um herege sob meu teto!"
 learning_theology_special.1101.desc.fallback:0 "\"Saudações, [ROOT.Char.Custom('FormOfAddressForLiege')]. Meu nome é [scholar.GetTitledFirstName].\" [Select_CString( scholar.IsFemale, 'A madre', 'O padre' )] diante de mim faz uma reverência respeitosa.\n\n\"Dediquei minha vida ao estudo e à escrita do [ROOT.Char.GetFaith.ReligiousText]. Talvez meus escritos e minha orientação sejam úteis em seus próprios estudos.\""
 learning_theology_special.1101.desc:0 "\"Bênçãos para você, [ROOT.Char.Custom('FormOfAddressForLiege')]. Meu nome é [scholar.GetTitledFirstName].\" [Select_CString( scholar.IsFemale, 'A rabina', 'O rabino' )] diante de mim faz uma reverência respeitosa.\n\n\"Dediquei minha vida ao estudo e à escrita de comentários sobre o Tanakh e o Talmude. Talvez meus escritos e minha orientação sejam úteis em seus próprios estudos do [ROOT.Char.GetFaith.ReligiousText].\""
 learning_theology_special.1101.t:0 "Comentários"
 learning_theology_special.1102.a.failure:0 "[scholar.GetTitledFirstNameNoTooltip] não está convencid[Select_CString( scholar.IsFemale, 'a', 'o' )]"
 learning_theology_special.1102.a.success:0 "Convenço [Select_CString( scholar.IsFemale, 'a', 'o' )] [scholar.GetTitledFirstNameNoTooltip] a continuar"
 learning_theology_special.1102.b.failure:0 "[scholar.GetShortUINameNoTooltip] revela minha duplicidade"
 learning_theology_special.1102.b.success:0 "Engano [scholar.GetShortUINameNoTooltip]"
 learning_theology_special.1102.b:0 "Por que devo compartilhar a glória?"
 learning_theology_special.1102.c.failure.toast:0 "[scholar.GetTitledFirstName] levou todo o crédito"
 learning_theology_special.1102.c.failure:0 "[scholar.GetSheHe|U] vai levar todo o crédito"
 learning_theology_special.1102.c.rl_desc:0 "Dependendo de quão honrado [Select_CString( scholar.IsFemale, 'a', 'o' )] [scholar.GetTitledFirstNameNoTooltip] é"
 learning_theology_special.1102.c.success.toast:0 "[scholar.GetTitledFirstName] compartilhou a glória comigo"
 learning_theology_special.1102.c.success:0 "[scholar.GetSheHe|U] vai compartilhar a glória comigo"
 learning_theology_special.1102.c:0 "É tudo graças [Select_CString( scholar.IsFemale, 'a', 'ao' )] [scholar.GetFirstNameNoTooltip]!"
 learning_theology_special.1102.d:0 "Mesmo assim, aprendi muito!"
 learning_theology_special.1102.desc:0 "Após dias de trabalho árduo, olhamos para as páginas espalhadas diante de nós; os comentários que escrevemos são exaustivos e detalhados. Graças à orientação d[Select_CString( scholar.IsFemale, 'a', 'o' )] [scholar.GetTitledFirstName], tenho um novo entendimento do [ROOT.Char.GetFaith.ReligiousText]."
 learning_theology_special.1102.desc_dead:0 "Após dias de trabalho árduo, olho para as páginas espalhadas diante de mim; os comentários escritos são exaustivos e detalhados. Pena que [Select_CString( scholar.IsFemale, 'a', 'o' )] [scholar.GetTitledFirstName] não está aqui para ver."
 learning_theology_special.1102.desc_ending:0 "\n\nAcredito que o clero ficaria interessado no trabalho que fiz!"
