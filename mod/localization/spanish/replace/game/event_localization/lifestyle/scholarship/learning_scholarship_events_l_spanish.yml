 book_translation_story:0 "Traduzir uma Grande Obra"
 book_translation_story_desc:0 "Traduzir uma grande obra permitirá que outros se beneficiem de sua sabedoria. Realizar esse ambicioso feito intelectual será um reflexo de sua brilhante genialidade; o fracasso o marcará como um tolo."
 book_translation_toast.finish_faster:0 "A Tradução será concluída mais rapidamente"
 book_translation_toast.less_good:0 "A #V Qualidade da Tradução#! melhorou ligeiramente"
 book_translation_toast.more_good:0 "A #V Qualidade da Tradução#! melhorou significativamente"
 book_translation_toast.unchanged:0 "A #V Qualidade da Tradução#! permaneceu inalterada"
