 book_translation_tooltip.more_good:0 "A #V Qualidade da Tradução#! melhorará significativamente"
 book_translation_tooltip.unchanged:0 "A #V Qualidade da Tradução#! permanecerá inalterada"
 high_learning_custom:0 "Cada vassalo não-[GetTrait('compassionate').GetName( GetNullCharacter )] com alto [learning|E]"
 learning_cynical_path_tt:0 "#F Esta escolha pode levar a um caminho de cinismo#!"
 learning_lifestyle_experience_gain_indication:0 "Eu posso obter [lifestyle_experience|E] no [learning_lifestyle|E]"
 learning_lifestyle_rank_up_indication:0 "Eu posso obter um [perk|E] no [learning_lifestyle|E]"
 learning_scholarship.1101.a:0 "O... r-rei tin— tinha uma grande coroa..."
 learning_scholarship.1101.b:0 "Sou um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] leitor[Select_CString( ROOT.Char.IsFemale, 'a', '' )] proficiente!"
 learning_scholarship.1101.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], chegou ao meu conhecimento que talvez você precise de algum ensino na arte de... decifrar a comunicação escrita\", diz [bishop.Custom2('MyCharacterIntroduction', ROOT.Char)], me apresentando um pergaminho.\n\n\"Se agradar a [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord], estou disposto a instruí-la; tenho o texto perfeito bem aqui.\""
 learning_scholarship.1101.t:0 "Falta de Alfabetização"
 learning_scholarship.1201.a:0 "Venda-o."
 learning_scholarship.1201.b:0 "Coloque-o em exposição."
 learning_scholarship.1201.c.failure:0 "[bird_sender.GetTitledFirstNameNoTooltip] se sente insultad[Select_CString( bird_sender.IsFemale, 'a', 'o' )]"
 learning_scholarship.1201.c.success:0 "[bird_sender.GetTitledFirstNameNoTooltip] é um[Select_CString( bird_sender.IsFemale, 'a', '' )] [bird_sender.GetWomanMan] erudit[Select_CString( bird_sender.IsFemale, 'a', 'o' )]"
 learning_scholarship.1201.c:0 "Desmonte-o e estude seus mecanismos."
 learning_scholarship.1201.desc:0 "Penas de metal reluzente, olhos de pedras preciosas, uma voz cantando com os sons dos sinos... O pássaro mecânico que foi presenteado a mim por [bird_sender.Custom2('MyCharacterIntroduction', ROOT.Char)] é uma verdadeira obra-prima!\n\n\"Esse pássaro foi criado pelos melhores artífices de todo o [bird_sender.GetPrimaryTitle.GetNameNoTierNoTooltip],\" diz a carta d[Select_CString( bird_sender.IsFemale, 'a', 'o' )] [bird_sender.GetTitledFirstNameNoTooltip]. \"Acredito que você o achará bastante intrigante.\""
 learning_scholarship.1201.t:0 "Pássaro Cantor"
 learning_scholarship.1401.a:0 "Eu preciso de uma dessas pedras!"
 learning_scholarship.1401.b:0 "Venda tudo que seja impossível de ler."
 learning_scholarship.1401.c:0 "[bishop.GetTitledFirstNameNoTooltip], preciso da sua ajuda!"
 learning_scholarship.1401.desc:0 "Enquanto luto para decifrar as pequenas letras no pergaminho à minha frente, sinto uma dor de cabeça surgindo novamente. Por que os escribas insistem em escrever símbolos tão pequenos?!\n\nEu semicerro os olhos e tento novamente.\n\n\"...nada menos que um milagre. Com a ajuda de uma pedra de vidro, até [Select_CString( ROOT.Char.IsFemale, 'as', 'os' )] [ROOT.Char.GetWomenMen] velh[Select_CString( ROOT.Char.IsFemale, 'as', 'os' )] que têm problemas de vista podem ler com facilidade.\""
 learning_scholarship.1401.t:0 "Pedra de Vidro"
 learning_scholarship.3001.a:0 "Você pode sair, mas de uma forma ou de outra, eu descobrirei."
 learning_scholarship.3001.b:0 "Sim, isso é uma tarefa de tolos, se não um pecado em si."
 learning_scholarship.3001.c.toast.tt1:0 "[chaplain.GetFirstName] foi persuadid[Select_CString( chaplain.IsFemale, 'a', 'o' )] pelo meu apelo."
 learning_scholarship.3001.c.toast.tt2:0 "[chaplain.GetFirstName] descartou minhas razões"
 learning_scholarship.3001.c.tt1:0 "Eu convenço [Select_CString( chaplain.IsFemale, 'a', 'o' )] [chaplain.GetFirstName] a me ajudar"
 learning_scholarship.3001.c.tt2:0 "Eu não consigo convencer [Select_CString( chaplain.IsFemale, 'a', 'o' )] [chaplain.GetFirstName]"
 learning_scholarship.3001.c:0 "Minhas intenções são puras, eu lhe asseguro!"
 learning_scholarship.3001.desc:0 "Eu chamo [Select_CString( chaplain.IsFemale, 'a minha', 'o meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chaplain'))], [chaplain.GetTitledFirstName], para se juntar a mim no círculo de esferas de latão e velas colocadas em bastões por todo o quarto escuro. O incenso que impregna o ar para afastar os maus vapores faz nossos olhos lacrimejarem em pouco tempo. \"É assim, através do canto dos nossos olhos, que veremos a forma inscrutável dos anjos.\"\n\nNo entanto, [chaplain.GetFirstNameNoTooltip] logo para. \"Isso parece errado. Esses seres divinos não são destinados a serem vistos por olhos mortais.\""
 learning_scholarship.3001.t:0 "Visões do Divino"
 learning_scholarship.4000.a:0 "Conforme desejar."
 learning_scholarship.4000.b:0 "Talvez possamos ler trechos juntos a partir de agora."
 learning_scholarship.4000.c.tt:0 "[spouse_uninterested_in_study.GetFirstName] não é [Select_CString( spouse_uninterested_in_study.IsFemale, 'a', 'o' )] [spouse_uninterested_in_study.GetMotherFather] d[Select_CString( child_educated.IsFemale, 'a', 'o' )] [child_educated.GetFirstNameNoTooltip]."
 learning_scholarship.4000.c:0 "Preciso trabalhar até tarde para preparar lições para [Select_CString( child_educated.IsFemale, 'a', 'o' )] querid[Select_CString( child_educated.IsFemale, 'a', 'o' )] [child_educated.GetFirstNameNoTooltip]."
 learning_scholarship.4000.d:0 "Não preciso me deitar com você — tenho o abraço caloroso do conhecimento!"
 learning_scholarship.4000.desc:0 "Já está tarde, e estou mergulhad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] em um tratado fascinante sobre gramática clássica. Justo quando começo a rir com algumas anotações maravilhosamente sarcásticas deixadas pelo leitor anterior, [Select_CString( spouse_uninterested_in_study.IsFemale, 'minha', 'meu' )] [spouse_uninterested_in_study.GetWifeHusband] entra na [ROOT.Char.Custom('GetRoom')].\n\n\"[ROOT.Char.GetWomanMan] Covarde! Você negligencia tudo, exceto seus estudos, lendo sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] dentro de casa do crepúsculo ao amanhecer. Tire sua cabeça desses pergaminhos empoeirados, ou não venha para minha cama esta noite.\""
 learning_scholarship.4000.t:0 "Vá lá fora!"
 learning_scholarship.5000.a:0 "Está bem, vou aceitar."
 learning_scholarship.5000.b.failure:0 "Você não consegue negociar um preço melhor"
 learning_scholarship.5000.b.success:0 "Você negocia um preço melhor"
 learning_scholarship.5000.b:0 "Talvez possamos chegar a um acordo."
 learning_scholarship.5000.c:0 "Eu pego o que preciso."
 learning_scholarship.5000.d:0 "Para que preciso dos seus livros?"
 learning_scholarship.5000.desc:0 "Enquanto dou um passeio pelo mercado, um[Select_CString( merchant_mystic.IsFemale, 'a', '' )] comerciante me chama e insiste que [merchant_mystic.GetSheHe] tem algo que despertará meu interesse.\n\nO aroma de ervas secando e tinturas exóticas domina meus sentidos enquanto me aproximo da barraca. [merchant_mystic.GetSheHe|U] está vasculhando sua coleção de tomos empoeirados e outros tesouros.\n\nDepois de cavar um pouco, [Select_CString( merchant_mystic.IsFemale, 'a', 'o' )] comerciante mostra um livro antigo e insiste que eu preciso dele para \"o que está por vir.\""
 learning_scholarship.5000.t:0 "Um Texto Sagrado"
 learning_scholarship.5001.a:0 "A tentação é irresistível."
 learning_scholarship.5001.b:0 "Não quero nada a ver com essa prática profana."
 learning_scholarship.5001.desc:0 "Enquanto guardo meu recém-adquirido [sacred_text.GetName], um pedaço de pergaminho cai. Nele estão instruções para uma prática chamada bibliomancia, em que alguém pode prever seu destino a partir de uma passagem de um livro.\n\nTudo que preciso fazer é abrir este texto em uma página aleatória e ler o primeiro verso do destino que meus olhos encontrarem."
 learning_scholarship.5001.t:0 "$bibliomancy_chain_header$ Bibliomancia"
 learning_scholarship.5002.a:0 "O medo é a pequena morte que traz a destruição total."
 learning_scholarship.5002.b.failure:0 "A passagem continua a me escapar"
 learning_scholarship.5002.b.success:0 "Descubro o verdadeiro significado desta passagem"
 learning_scholarship.5002.b:0 "Fascinante. Isso requer mais pesquisa."
 learning_scholarship.5002.c.tt:0 "Você ignora a passagem"
 learning_scholarship.5002.c:0 "Que absurdo completo!"
 learning_scholarship.5002.d:0 "Meu $antiquarian_court_position$, [antiquarian.GetTitledFirstNameNoTooltip], deve dar uma olhada nisso."
 learning_scholarship.5002.desc:0 "Sigo as instruções à risca e seleciono aleatoriamente uma passagem do texto diante de mim. Tremendo de antecipação, abro os olhos e leio:\n\n#EMP O medo é o assassino da mente. Um covarde morre mil pequenas mortes, mas um homem valente morre apenas uma vez.#!\n\nO que devo fazer com isso?"
 learning_scholarship.5002.t:0 "$bibliomancy_chain_header$ Leitura Fatal"
 learning_scholarship.5003.a.failure:0 "Você perde o debate contra seu vassalo"
 learning_scholarship.5003.a.success:0 "Você vence o debate contra seu vassalo"
 learning_scholarship.5003.a.tt:0 "Eu debato com [bibliomancy_antagonist.GetName] em um fórum público"
 learning_scholarship.5003.a:0 "Eu enfrento meu medo."
 learning_scholarship.5003.b.failure:0 "Você não consegue aplacar seu vassalo"
 learning_scholarship.5003.b.success:0 "Você consegue aplacar seu vassalo"
 learning_scholarship.5003.b.tt:0 "Faço abordagens formais a [bibliomancy_antagonist.GetName]"
 learning_scholarship.5003.b:0 "Uma abordagem sutil é a melhor."
 learning_scholarship.5003.c:0 "Vamos discutir isso mais tarde."
 learning_scholarship.5003.desc:0 "Meu vassalo, [bibliomancy_antagonist.GetName], tem sido silenciosamente cético em relação à minha habilidade há anos. Recentemente, porém, meu Administrador relata que [bibliomancy_antagonist.GetSheHe] começou a criticar mais abertamente meu direito de governar. [bibliomancy_antagonist.GetSheHe|U] tem influência sobre os outros vassalos e pode facilmente tornar minha vida difícil.\n\nSerá que a passagem de [sacred_text.GetName] previu isso? O medo é o assassino da mente..."
 learning_scholarship.5003.t:0 "$bibliomancy_chain_header$ Bibliomancia"
 learning_scholarship.5003.vassal.tt:0 "Todos os vassalos"
 learning_scholarship.5004.a.failure:0 "[court_chaplain.GetCouncilTitle] [court_chaplain.GetFirstNameNoTooltip] não consegue entender a passagem"
 learning_scholarship.5004.a.success:0 "[court_chaplain.GetCouncilTitle] [court_chaplain.GetFirstNameNoTooltip] esclarece a passagem"
 learning_scholarship.5004.a:0 "[court_chaplain.GetCouncilTitle] [court_chaplain.GetTitledFirstNameNoTooltip] saberá a resposta."
 learning_scholarship.5004.b.failure:0 "[target_courtier.GetFirstNameNoTooltip] não consegue entender a passagem"
 learning_scholarship.5004.b.success:0 "[target_courtier.GetFirstNameNoTooltip] esclarece a passagem"
 learning_scholarship.5004.b:0 "M[Select_CString( target_courtier.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom('GetCourtier')] [target_courtier.GetTitledFirstNameNoTooltip] vai me ajudar."
 learning_scholarship.5004.c:0 "Eu desisto."
 learning_scholarship.5004.desc:0 "Por mais que eu tente entender essa passagem de [sacred_text.GetName], ela está me consumindo!\n\nO medo é o assassino da mente... O que isso poderia possivelmente significar? Do que devo ter medo? #EMP O que estou deixando passar#!?\n\nTalvez outra pessoa possa me ajudar a entender isso."
 learning_scholarship.5004.t:0 "$bibliomancy_chain_header$ Passagem Inquietante"
 learning_scholarship.5005.a:0 "Sem medo, morro apenas uma vez."
 learning_scholarship.5005.desc:0 "Finalmente decifrei a passagem misteriosa de [sacred_text.GetName] e me sinto muito mais sábio por isso. Graças a esse mercador, os fios do destino de repente se tornam mais claros para mim.\n\nO medo pode ser o assassino da mente, mas eu enfrentei meu medo."
 learning_scholarship.5005.t:0 "$bibliomancy_chain_header$ Nada a temer"
 learning_scholarship.5006.a:0 "O medo é a pequena morte que traz a destruição total."
 learning_scholarship.5006.desc:0 "Depois de passar dias tentando decifrar essa passagem indecifrável e obtusa, finalmente desisti. Não faço ideia do que isso possa significar e todo esse assunto me deixa arrepiado até os ossos.\n\nO que vai acontecer? Devo agora viver com medo #EMP para sempre#!?"
 learning_scholarship.5006.t:0 "$bibliomancy_chain_header$ Paranoia Crescente"
 learning_scholarship.6000.a:0 "Meu [illiterate.GetCouncilTitle] precisa de um relato sobre povos distantes."
 learning_scholarship.6000.b:0 "Meu [illiterate.GetCouncilTitle] precisa de uma crônica cheia de fofocas da corte."
 learning_scholarship.6000.c:0 "Meu [illiterate.GetCouncilTitle] precisa de contos de feitos guerreiros."
 learning_scholarship.6000.d:0 "Meu [illiterate.GetCouncilTitle] precisa de um tratado sobre justiça."
 learning_scholarship.6000.desc:0 "Parece que, apesar dos melhores esforços de [teacher.Custom2('HerHisCharacterIntroduction',illiterate)], [illiterate.GetName] continua tão analfabeto quanto o idiota da vila.\n\n\"A mais sábia e iluminada [ROOT.Char.GetTitleTierName],\" bajula [Select_CString( teacher.IsFemale, 'a', 'o' )] [teacher.GetFirstNameNoTooltip]. \"Como posso inspirar [Select_CString( ROOT.Char.IsFemale, 'minha senhora', 'meu senhor' )] a aprender a ler?\""
 learning_scholarship.6000.e:0 "Meu [illiterate.GetCouncilTitle] precisa de uma ode irresistível à espiritualidade."
 learning_scholarship.6000.f.failure:0 "Seu vassalo zomba do seu texto monótono e sem sentido"
 learning_scholarship.6000.f.success:0 "Seu tratado é muito educativo"
 learning_scholarship.6000.f.tt:0 "Uma desculpa para escrever, em vez de governar!"
 learning_scholarship.6000.f:0 "[illiterate.GetSheHe|U] lerá as palavras do seu [ROOT.Char.GetTitleTierName]."
 learning_scholarship.6000.g.tt:0 "[illiterate.GetSheHe|U] é um[Select_CString( illiterate.IsFemale, 'a', '' )] [illiterate.GetWomanMan] de ação - outros podem ler para [illiterate.GetSheHe]!"
 learning_scholarship.6000.g:0 "O tempo d[Select_CString( illiterate.IsFemale, 'a', 'o' )] [illiterate.GetTitleAsNameNoTooltip] é muito valioso para isso."
 learning_scholarship.6000.h.tt:0 "Você pode fazer as palavras d[Select_CString( illiterate.IsFemale, 'a', 'o' )] [illiterate.GetTitleAsNameNoTooltip] parecerem verdadeiramente impiedosas"
 learning_scholarship.6000.h:0 "Blasfêmia? Conte-me um pouco mais..."
 learning_scholarship.6000.holy_book_insult:0 "\n\n[teacher.GetSheHe|U] hesita e então murmura:\n\n\"O que [Select_CString( illiterate.IsFemale, 'a', 'o' )] [illiterate.GetTitleAsNameNoTooltip] disse depois de lutar para entender as primeiras linhas sagradas do [illiterate.GetFaith.ReligiousText]... não era nem sagrado #EMP nem#! iluminado...\""
 learning_scholarship.6000.i.tt:0 "Em sua corte, a poesia [illiterate.GetCulture.GetNameNoTooltip] será recitada com frequência"
 learning_scholarship.6000.i:0 "Vou honrar a poesia [illiterate.GetCulture.GetNameNoTooltip] para inspirar [illiterate.GetSheHe]."
 learning_scholarship.6000.j.tt:0 "...em vez de ansiar por ter lido todas elas."
 learning_scholarship.6000.j:0 "A sabedoria está em ver o encanto em cada palavra..."
 learning_scholarship.6000.k.tt:0 "É tão inútil quanto ensinar astronomia a uma cabra!"
 learning_scholarship.6000.k:0 "A alfabetização está além desse bruto!"
 learning_scholarship.6000.non_believer:0 "Você obtém evidências de que [Select_CString( illiterate.IsFemale, 'a', 'o' )] [illiterate.GetTitledFirstName] é um[Select_CString( illiterate.IsFemale, 'a', '' )] Não Crente"
 learning_scholarship.6000.poetry_insult:0 "\n\nO professor faz uma careta.\n\n\"O que [Select_CString( illiterate.IsFemale, 'a', 'o' )] [illiterate.GetTitledFirstNameNoTooltip] disse depois de sofrer com a poesia mais elegante da [illiterate.GetCulture.GetNameNoTooltip]... não era nem elegante #EMP nem#! iluminado...\""
 learning_scholarship.6000.t:0 "[Select_CString( illiterate.IsFemale, 'A', 'O' )] [illiterate.GetWomanMan|U] de Poucas Palavras"
 learning_scholarship.6000.very_willing_pupil:0 "\n\n[teacher.GetSheHe|U] faz um gesto em direção ao meu conhecimento acumulado.\n\n\"O [illiterate.GetTitleTierName] teme lutar através de mil linhas sem alcançar a sabedoria como a sua.\""
 learning_scholarship.6000.willing_pupil:0 "\n\n[teacher.GetSheHe|U] suspira, exasperado.\n\n\"[Select_CString( illiterate.IsFemale, 'A', 'O' )] [illiterate.GetTitleAsNameNoTooltip] não se dedicará a horas de estudo apenas pelo prazer de ler...\""
 learning_scholarship_focus_point_clear_gain:0 "Minha compreensão do [learning_lifestyle|E] aumenta"
 learning_scholarship_paranoid_trait.tt:0 "Você adquiriu este traço por não conseguir entender a passagem em [sacred_text.GetName]"
 learning_scholarship_paranoid_trait_possible:0 "Você pode adquirir o [trait|E] [GetTrait('paranoid').GetName( GetNullCharacter )]"
 learning_scholarship_sacred_artifact_obtained:0 "Você obtém o texto sagrado"
 learning_scholarship_special.2001.almagest:0 "Estudando os céus através do Almagesto de Ptolomeu."
 learning_scholarship_special.2001.ancient_myths:0 "Algo grandioso — um dos mitos antigos!"
 learning_scholarship_special.2001.arithmetica:0 "A Arithmetica e os comentários de Diophantus."
 learning_scholarship_special.2001.avesta:0 "Os antigos textos sagrados persas, o Avesta."
 learning_scholarship_special.2001.book_of_arda_viraf:0 "A jornada onírica do Livro de Arda Viraf."
 learning_scholarship_special.2001.book_of_balances:0 "O Livro Compendioso do Cálculo."
 learning_scholarship_special.2001.corpus_hermeticus:0 "O conhecimento místico do Corpus Hermeticus!"
 learning_scholarship_special.2001.court_of_agriculture:0 "A Corte da Agricultura."
 learning_scholarship_special.2001.de_oratore:0 "As lições de retórica de Cícero em De Oratore!"
 learning_scholarship_special.2001.decline:0 "Isso parece muito difícil."
 learning_scholarship_special.2001.desc:0 "Mais do que qualquer coisa, minha busca por ser um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] erudit[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] está me mostrando o quanto eu ainda não sei. Além disso, deve haver tanto conhecimento perdido ao longo dos tempos, à medida que os livros se desfazem ou as línguas são esquecidas...\n\nTalvez eu possa contribuir fazendo uma nova tradução de uma das obras clássicas?\n\nEmbora, o que eu traduziria...?"
 learning_scholarship_special.2001.elements:0 "Elementos, tratado matemático de Euclides!"
 learning_scholarship_special.2001.family_history:0 "Algo pessoal — a história da minha família."
 learning_scholarship_special.2001.kategoriai:0 "As Categorias, definindo todos os sujeitos e predicados."
 learning_scholarship_special.2001.lanterns_of_wisdom:0 "Instruções sobre alquimia em As Lanternas da Sabedoria."
 learning_scholarship_special.2001.pali_canon:0 "Um texto do Cânone Pali."
 learning_scholarship_special.2001.peri_psyches:0 "O famoso Peri Psyches de Aristóteles!"
 learning_scholarship_special.2001.physica_elementa:0 "Um clássico da ciência — a Physica de Aristóteles!"
 learning_scholarship_special.2001.regula_pastoralis:0 "A Regula Pastoralis, sobre como levar uma vida boa."
 learning_scholarship_special.2001.rigveda:0 "Os hinos religiosos do Rigveda."
 learning_scholarship_special.2001.secret_of_secrets:0 "O Segredo dos Segredos concedido a Alexandre."
 learning_scholarship_special.2001.shahnameh:0 "O poema da história da Pérsia, o Shahnameh."
 learning_scholarship_special.2001.t:0 "Uma Nova Tradução"
 learning_scholarship_special.2001.the_norse_sagas:0 "Uma das sagas nórdicas!"
 learning_scholarship_special.2001.treatises_of_hippocrates:0 "As perspicácias médicas dos Tratados de Hipócrates."
 learning_scholarship_special.2001.upanishads:0 "Os mais famosos dos Vedas, os Upanishads!"
 learning_scholarship_special.2011.a.failure:0 "Perco o significado"
 learning_scholarship_special.2011.a.success:0 "Melhoro o texto"
 learning_scholarship_special.2011.a:0 "Posso pensar em algo mais adequado."
 learning_scholarship_special.2011.b:0 "Vamos traduzir o texto exatamente como está escrito!"
 learning_scholarship_special.2011.c:0 "Ah, o significado é óbvio, deixe-me cuidar disso."
 learning_scholarship_special.2011.desc:0 "Minha tradução de [ROOT.Char.Custom('TranslationBook')] está progredindo, mas uma seção na versão que estou copiando me deixa em dúvida.\n\nMeus escribas insistem que as palavras na página significam 'como seguramos dois pés e as bordas ascendentes do espírito do caçador'.\n\nIsso não pode estar certo, não é mesmo?"
 learning_scholarship_special.2012.a.failure:0 "[realm_priest.GetShortUINameNoTooltip] encontra uma espécie de resposta"
 learning_scholarship_special.2012.a.success:0 "[realm_priest.GetShortUINameNoTooltip] encontra a resposta"
 learning_scholarship_special.2012.a:0 "Ajude-me a descobrir isso, [realm_priest.GetFirstNameNoTooltip]!"
 learning_scholarship_special.2012.b:0 "Sem jogos. Apenas me diga o que estou procurando."
 learning_scholarship_special.2012.c.friendship_tooltip:0 "Essa opção está disponível devido à minha amizade com [Select_CString( realm_priest.IsFemale, 'a', 'o' )] [realm_priest.GetFirstNameNoTooltip]"
 learning_scholarship_special.2012.c:0 "Poderia me mostrar, velho amigo?"
 learning_scholarship_special.2012.desc:0 "Uma frase específica de [ROOT.Char.Custom('TranslationBook')] tem frustrado meus esforços de tradução por dias. Até comecei a murmurá-la para mim mesmo às vezes.\n\n\"Ainda está lutando com aquilo?\" M[Select_CString( realm_priest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('realm_priest'))] segura um volumoso e antigo livro. \"Basta saber onde procurar.\""
 learning_scholarship_special.2013.a:0 "'Ao contrário dos [ROOT.Char.GetFaith.ReligiousText], esta obra postula que...'"
 learning_scholarship_special.2013.b:0 "'Como evidenciado pela vontade de [ROOT.Char.GetFaith.HighGodName]...'"
 learning_scholarship_special.2013.desc:0 "Estou ouvindo as anotações para a minha tradução de [ROOT.Char.Custom('TranslationBook')], quando tenho uma compreensão repentina. 'Escreva, escrivão! Acrescente o seguinte comentário...'"
 learning_scholarship_special.2014.a:0 "No entanto, vou me forçar a seguir em frente!"
 learning_scholarship_special.2014.b:0 "Meus escribas podem assumir mais responsabilidade."
 learning_scholarship_special.2014.c:0 "Preciso de uma pausa disso tudo."
 learning_scholarship_special.2014.desc:0 "Estou ouvindo as anotações para a minha tradução de [ROOT.Char.Custom('TranslationBook')], quando...\n\n'[ROOT.Char.Custom('FormOfAddressForLiege')|U]? Por favor, me perdoe, mas... você adormeceu?!'\n\nMeus céus, este 'clássico' é uma verdadeira porcaria!"
 learning_scholarship_special.2015.a:0 "'Não, temos que continuar até eu me sentir satisfeito!'"
 learning_scholarship_special.2015.b:0 "'Sim, um pouco de sono fará bem a todos.'"
 learning_scholarship_special.2015.c:0 "'Vocês podem continuar trabalhando enquanto eu descanso.'"
 learning_scholarship_special.2015.desc:0 "Me pego trabalhando na tradução de [ROOT.Char.Custom('TranslationBook')] por horas à luz vacilante de uma vela. Muitas vezes, mal percebo o tempo passando. No entanto, meus escribas me lembram.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], já deve ser meia-noite. Não é hora de descansar?\""
 learning_scholarship_special.2016.a:0 "Você nunca mais vai copiar textos para ninguém!"
 learning_scholarship_special.2016.b.flavor:0 "'O resto de vocês, escribas, deveriam aprender com isso!'"
 learning_scholarship_special.2016.b:0 "Vou fazer você pagar!"
 learning_scholarship_special.2016.c:0 "Isso... é muito bom, na verdade."
 learning_scholarship_special.2016.desc:0 "Um dos meus escribas fez edições na minha tradução de [ROOT.Char.Custom('TranslationBook')] sem o meu conhecimento!\n\n\"Só queria deixar o texto o melhor possível! Você gostava quando achava que era seu próprio trabalho!\""
 learning_scholarship_special.2017.a:0 "Apenas algumas páginas a mais esta noite, e algumas a mais pela manhã..."
 learning_scholarship_special.2017.b:0 "Devo me isolar de todas as outras distrações até terminar isso."
 learning_scholarship_special.2017.c:0 "O livro pode esperar por um tempo."
 learning_scholarship_special.2017.desc:0 "O esforço constante para traduzir [ROOT.Char.Custom('TranslationBook')] é cansativo. A concentração incessante, o entendimento e a criatividade necessários me esgotam, enquanto me aproximo cada vez mais da conclusão."
 learning_scholarship_special.2097.a:0 "Este esforço me ensinou muito."
 learning_scholarship_special.2097.conclusion:0 "\n\nO tomo ocupa um lugar de destaque em minha coleção, e todos os [ROOT.Char.GetFaith.PriestNeuter] que o leem ficam grandemente impressionados com meus esforços. Alguns já estão falando em fazer suas próprias cópias."
 learning_scholarship_special.2097.opening:0 "Minha tradução de [ROOT.Char.Custom('TranslationBook')] finalmente está completa. Minhas palavras repousam em páginas lindamente iluminadas, protegidas por uma capa luxuosa, como convém à importância da obra."
 learning_scholarship_special.2097.t:0 "Uma Excelente Tradução"
 learning_scholarship_special.2098.a:0 "Aprendi muito com isso!"
 learning_scholarship_special.2098.conclusion:0 "\n\nEmbora possa ser um pouco difícil de entender em alguns trechos, não há dúvida de que esta tradução é muito necessária. Enquanto repousa em minha coleção, onde [ROOT.Char.GetFaith.DevoteeNeuterPlural] frequentemente leem, aguardo ansiosamente os primeiros esforços para copiá-la."
 learning_scholarship_special.2098.opening:0 "Finalmente, minha tradução de [ROOT.Char.Custom('TranslationBook')] está concluída. As palavras estão rodeadas por belas ilustrações, sendo as mais luxuosas que chamam a atenção, desviando o olhar das seções em que me senti inseguro."
 learning_scholarship_special.2098.t:0 "Minha Tradução Concluída"
 learning_scholarship_special.3001.a:0 "Se nada mais, vale a pena investigar..."
 learning_scholarship_special.3001.b:0 "Esses rabiscos são claramente uma brincadeira sem sentido."
 learning_scholarship_special.3001.c:0 "Buscar riqueza desse modo é inerentemente ímpio!"
 learning_scholarship_special.3001.d:0 "Não serei tentado pelas promessas da bruxaria!"
 learning_scholarship_special.3001.desc:0 "Apesar disso, encontrei algumas anotações escritas nas margens de um livro sobre plantas. Elas afirmam que é possível criar 'chuva dourada' fervendo açúcar de chumbo em uma solução filtrada de cinzas de algas."
 learning_scholarship_special.3001.desc_alchemist:0 "No entanto, [alchemist.Custom2('MyCharacterIntroduction', ROOT.Char)] encontrou algumas anotações escritas nas margens de um livro sobre plantas. Eles afirmam que é possível criar 'chuva dourada' fervendo açúcar de chumbo em uma solução filtrada de cinzas de algas."
 learning_scholarship_special.3001.desc_ending:0 "\n\nSerá que algo assim é possível?"
 learning_scholarship_special.3001.desc_opening:0 "A transmutação de chumbo em ouro tem sido o sonho de alquimistas em todo o mundo. Embora muitos tenham tentado tal feito, ninguém conseguiu até agora.\n\n"
 learning_scholarship_special.3001.t:0 "Chumbo em Ouro"
 learning_scholarship_special.3002.a.failure:0 "Os vapores de chumbo lhe dão dor de cabeça"
 learning_scholarship_special.3002.a.success:0 "Você cria o açúcar de chumbo sem incidentes"
 learning_scholarship_special.3002.a:0 "É preciso gastar dinheiro para ganhar dinheiro!"
 learning_scholarship_special.3002.b:0 "Como posso aprender se outras pessoas fazem todo o trabalho!?"
 learning_scholarship_special.3002.b_alchemist:0 "Como podemos aprender se outras pessoas fazem todo o trabalho!?"
 learning_scholarship_special.3002.c:0 "Pensando melhor, isso é uma má ideia..."
 learning_scholarship_special.3002.desc:0 "O primeiro reagente que preciso obter é o açúcar de chumbo, um ingrediente usado para adoçar vinhos.\n\nPosso encontrar um fornecedor para importar o que preciso, embora seja caro. Alternativamente, posso fabricar o meu próprio, de forma barata, queimando chumbo metálico e dissolvendo as cinzas em vinagre..."
 learning_scholarship_special.3002.desc_alchemist:0 "O primeiro reagente que precisamos obter é o açúcar de chumbo, um ingrediente usado para adoçar vinhos.\n\nPodemos encontrar um fornecedor para importar o que precisamos, embora seja caro. Alternativamente, podemos fabricar o nosso próprio de forma barata, queimando chumbo metálico e dissolvendo as cinzas em vinagre..."
 learning_scholarship_special.3002.tt:0 "Você obtém o açúcar de chumbo"
 learning_scholarship_special.3003.a:0 "Vou importá-la de várias cidades costeiras."
 learning_scholarship_special.3003.b:0 "Exigir um imposto sobre algas dos meus súditos!"
 learning_scholarship_special.3003.c:0 "Posso simplesmente usar meu chumbo para adoçar vinhos..."
 learning_scholarship_special.3003.desc:0 "O segundo reagente que preciso obter é a alga marinha... muita alga marinha. Cem dracmas, trituradas e depois secas. Onde posso obter uma quantidade tão substancial?"
 learning_scholarship_special.3003.desc_alchemist:0 "O segundo reagente que precisamos obter é a alga marinha... muita alga marinha. Cem dracmas, trituradas e depois secas. Onde podemos obter uma quantidade tão substancial?"
 learning_scholarship_special.3003.tt:0 "Você obtém a alga marinha"
 learning_scholarship_special.3004.a.failure.tt:0 "Mas o que você criou em vez disso?"
 learning_scholarship_special.3004.a.failure:0 "A fórmula não funciona como esperado"
 learning_scholarship_special.3004.a.success.tt:0 "Riqueza e glória são suas!"
 learning_scholarship_special.3004.a.success:0 "Você consegue criar a chuva dourada"
 learning_scholarship_special.3004.a:0 "Inicie o experimento!"
 learning_scholarship_special.3004.b:0 "...o que estou fazendo? Isso é estúpido."
 learning_scholarship_special.3004.desc:0 "Finalmente, tenho todos os reagentes necessários para produzir a chuva dourada!\n\nO açúcar de chumbo está armazenado com segurança em barris à prova d'água. As cordas de algas marinhas secas estão empilhadas no forno, prontas para queimar.\n\nSerá este o meu magnum opus?"
 learning_scholarship_special.3004.desc_alchemist:0 "Finalmente, temos todos os reagentes necessários para produzir a chuva dourada!\n\nO açúcar de chumbo está armazenado com segurança em barris à prova d'água. As cordas de algas marinhas secas estão empilhadas no forno, prontas para queimar.\n\nSerá esta a nossa magnum opus?"
 learning_scholarship_special.3005.a:0 "Estou um passo mais perto da verdadeira transmutação?"
 learning_scholarship_special.3005.a_alchemist:0 "Estamos um passo mais perto da verdadeira transmutação?"
 learning_scholarship_special.3005.desc:0 "Após misturar o açúcar de chumbo na solução, ela ficou repentinamente amarela vibrante! Tive um momento de preocupação quando a mistura ficou clara após ferver, mas assim que esfriou novamente, vi pequenos cristais dourados se formarem no frasco.\n\nAo examinar, pude perceber que esses cristais não são ouro verdadeiro, pois são translúcidos. No entanto, é possível que essa reação seja um dos famosos '12 processos vitais' necessários para criar ouro!"
 learning_scholarship_special.3005.desc_alchemist:0 "Após misturar o açúcar de chumbo na solução, ela ficou repentinamente amarela vibrante! Tive um momento de preocupação quando a mistura ficou clara após ferver, mas assim que esfriou novamente, vimos pequenos cristais dourados se formarem no frasco.\n\nAo examinar, pudemos perceber que esses cristais não são ouro verdadeiro, pois são translúcidos. No entanto, é possível que essa reação seja um dos famosos '12 processos vitais' necessários para criar ouro!"
 learning_scholarship_special.3006.a:0 "Bonito, mesmo que seja caro de produzir."
 learning_scholarship_special.3006.desc:0 "Ao misturar o açúcar de chumbo nas cinzas de algas marinhas fervidas, a mistura repentinamente ficou amarela vibrante.\n\nEmbora não tenha conseguido produzir ouro de verdade, descobri que minha solução pode ser usada como um corante que rivaliza com o açafrão em brilho. Vender esse corante me permitirá recuperar parte dos meus custos."
 learning_scholarship_special.3006.desc_alchemist:0 "Ao misturar o açúcar de chumbo nas cinzas de algas marinhas fervidas, a mistura repentinamente ficou amarela vibrante.\n\nEmbora não tenhamos conseguido produzir ouro de verdade, descobrimos que nossa solução pode ser usada como um corante que rivaliza com o açafrão em brilho. Vender esse corante me permitirá recuperar parte dos meus custos."
 learning_scholarship_special.3007.a:0 "Acho que as plantações vão crescer bem este ano?"
 learning_scholarship_special.3007.desc:0 "Após queimar as algas marinhas e misturá-las com água, fiquei com uma quantidade alarmante de lodo marrom repugnante. Incerto sobre o que fazer nesse ponto, misturei o açúcar de chumbo na solução, mas nenhuma mudança observável ocorreu.\n\nInfelizmente, o único uso que consigo pensar para o meu experimento é usá-lo como fertilizante."
 learning_scholarship_special.3007.desc_alchemist:0 "Após queimar as algas marinhas e misturá-las com água, ficamos com uma quantidade alarmante de lodo marrom repugnante. Incerto sobre o que fazer nesse ponto, misturamos o açúcar de chumbo na solução, mas nenhuma mudança observável ocorreu.\n\nInfelizmente, o único uso que consigo pensar para o experimento é usá-lo como fertilizante."
 learning_scholarship_special.3099.termination.desc.incapable:0 "Não posso continuar meus experimentos de transmutação estando incapaz."
 learning_scholarship_special.3099.termination.desc.prison:0 "Não posso continuar meus experimentos de transmutação estando na prisão."
 learning_scholarship_special.3099.termination.toast:0 "Transmutação Fracassada"
 learning_zealous_path_tt:0 "#F Esta escolha pode levar a um caminho de zelo#!"
