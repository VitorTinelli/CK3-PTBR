l_spanish:
 aloof_from_the_commoners_modifier:0 "Distante dos Camponeses"
 aloof_from_the_commoners_modifier_desc:0 "Este personagem tem a reputação de afastar camponeses que desperdiçam seu tempo."
 associates_with_strange_peasants_modifier:0 "Se Associa com Camponeses Estranhos"
 associates_with_strange_peasants_modifier_desc:0 "Este personagem é conhecid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por ter se envolvido em discussões estranhas com aqueles muito abaixo de sua posição."
 cosmic_insights_modifier:0 "Percepções Cósmicas"
 cosmic_insights_modifier_desc:0 "Uma longa noite de consumo de haxixe realmente deu a este personagem uma visão sobre a natureza da realidade."
 hallucinogenic_visions_terrifying_modifier:0 "Visões Aterrorizantes do Além-Vida"
 hallucinogenic_visions_terrifying_modifier_desc:0 "Este personagem é atormentado por visões que marcam a mente dos horrores que aguardam os indignos no além-vida."
 hallucinogenic_visions_uplifting_modifier:0 "Visões Edificantes do Além-Vida"
 hallucinogenic_visions_uplifting_modifier_desc:0 "Este personagem recebeu revelações que alteram a mente sobre a felicidade que aguarda os escolhidos no além-vida."
 learning_medicine.2001.a:0 "Estou sempre ansioso para aprender algo novo."
 learning_medicine.2001.b:0 "Uma flor rara alegraria o dia d[Select_CString( flower_receiver.IsFemale, 'a', 'o' )] [flower_receiver.GetFirstNameNoTooltip]."
 learning_medicine.2001.c:0 "[herbalist.GetSheHe|U] poderia plantar um jardim de ervas sagradas."
 learning_medicine.2001.chaplain_hates_herbs.desc:0 "\n\nA oferta é intrigante, mas sei que [chaplain_hates_herbs.GetCouncilTitle] [chaplain_hates_herbs.GetFirstName] desconfia de encantamentos e poções. [chaplain_hates_herbs.GetSheHe|U] acredita que [ROOT.Char.GetFaith.DevilName] as utiliza para seus próprios propósitos nefastos... "
 learning_medicine.2001.d.chaplain_hates_herbs:0 "Confio no julgamento de [chaplain_hates_herbs.GetCouncilTitle] [chaplain_hates_herbs.GetNamePossessiveNoTooltip] sobre esse assunto."
 learning_medicine.2001.d:0 "Não tenho tempo para lidar com sujeira e plantas."
 learning_medicine.2001.no_pool.desc:0 "[herbalist.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] é um habilidoso herbalista, conhecedor tanto de plantas curativas quanto venenosas. Em mais de uma ocasião, [herbalist.GetSheHe] ofereceu-se para compartilhar sua expertise comigo."
 learning_medicine.2001.pool.desc:0 "Recebi uma oferta de [herbalist.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. Se a carta for verdadeira, [herbalist.GetSheHe] é uma herbalista experiente que estaria disposta a compartilhar seu conhecimento em troca de [ROOT.Char.Custom('GetRoom')] e alimentação."
 learning_medicine.2001.t:0 "Segredos da Natureza"
 learning_medicine.2002.a.failure.t:0 "[herbalist.GetFirstNameNoTooltip] fica chocad[Select_CString( herbalist.IsFemale, 'a', 'o' )] com minhas insinuações"
 learning_medicine.2002.a.success.t:0 "[herbalist.GetFirstNameNoTooltip] é um[Select_CString( herbalist.IsFemale, 'a', '' )] brux[Select_CString( herbalist.IsFemale, 'a', 'o' )]"
 learning_medicine.2002.a:0 "Preciso aprofundar-me nesse conhecimento oculto!"
 learning_medicine.2002.b.failure.t:0 "[herbalist.GetFirstNameNoTooltip] me pega bisbilhotando"
 learning_medicine.2002.b.inconclusive.desc:0 "Não encontro provas de bruxaria"
 learning_medicine.2002.b.inconclusive.t:0 "Minha investigação é inconclusiva"
 learning_medicine.2002.b.success.no_witch.desc:0 "Tenho certeza da inocência d[Select_CString( herbalist.IsFemale, 'a', 'o' )] [herbalist.GetTitledFirstNamePossessive]"
 learning_medicine.2002.b.success.no_witch.t:0 "[herbalist.GetFirstNameNoTooltip] não é um[Select_CString( herbalist.IsFemale, 'a', '' )] brux[Select_CString( herbalist.IsFemale, 'a', 'o' )]"
 learning_medicine.2002.b.success.t:0 "Descubro a verdade sobre [Select_CString( herbalist.IsFemale, 'a', 'o' )] [herbalist.GetFirstNameNoTooltip]"
 learning_medicine.2002.b.success.tt:0 "Se [herbalist.GetShortUIName] tem um Segredo de Bruxa, ele será revelado a mim"
 learning_medicine.2002.b.success.witch.t:0 "[herbalist.GetFirstNameNoTooltip] é um[Select_CString( herbalist.IsFemale, 'a', '' )] brux[Select_CString( herbalist.IsFemale, 'a', 'o' )]"
 learning_medicine.2002.b:0 "Se [herbalist.GetSheHe] está escondendo segredos, vou descobrir."
 learning_medicine.2002.c:0 "Não vou me distrair com mitos e boatos."
 learning_medicine.2002.chaplain_hates_herbs.desc:0 "um parágrafo que faria [chaplain_hates_herbs.GetCouncilTitle] [chaplain_hates_herbs.GetFirstName] espumar de raiva!"
 learning_medicine.2002.not_witchcraft_accepted.desc:0 "um parágrafo que faria com que os [ROOT.Char.Custom('DefaultPriestTitlePlural')] espumassem de raiva!"
 learning_medicine.2002.start.desc:0 "[herbalist.GetFirstName] e eu estamos passando outra noite trabalhando na classificação de plantas e na preparação de poções. Estou folheando um dos velhos tomos [herbalist.GetHerHim] quando descubro"
 learning_medicine.2002.witchcraft_accepted.desc:0 "uma receita muito intrigante. Eu não sabia que meras ervas possuíam tanto poder..."
 learning_medicine.2003.a:0 "Não há nada que eu deseje mais."
 learning_medicine.2003.desc:0 "\"Isso é o que desejo aprender\", digo enquanto entrego o livro [Select_CString( herbalist.IsFemale, 'a', 'ao' )] [herbalist.GetFirstName]. \"Você vai me ensinar?\"\n\n[herbalist.GetSheHe|U] me olha atentamente. \"Você está realmente pronto, [ROOT.Char.GetFirstNameNoTooltip]? Vai se dedicar a [herbalist.GetFaith.WitchGodName] em troca das suas bênçãos?\""
 learning_medicine.2010.a.failure.desc:0 "Faço papel de bobo"
 learning_medicine.2010.a.success.desc:0 "Ajudo [Select_CString( court_physician.IsFemale, 'a', 'o' )] [court_physician.GetFirstNameNoTooltip] a traduzir o texto"
 learning_medicine.2010.a:0 "Deixe-me dar uma olhada..."
 learning_medicine.2010.avicenna.desc:0 "Avicena"
 learning_medicine.2010.b:0 "Comprarei uma tradução melhor para você."
 learning_medicine.2010.bianque.desc:0 "[Glossary( 'Bian Que', 'BIAN_QUE_GLOSS' )]"
 learning_medicine.2010.c:0 "Você deveria buscar orientação no [ROOT.Char.GetFaith.ReligiousText]."
 learning_medicine.2010.end.desc:0 "é terrível\", [court_physician.GetSheHe] diz com um suspiro. \"Se eu seguisse essas instruções, seria tão provável curar meu paciente quanto matá-lo completamente.\""
 learning_medicine.2010.fallback.desc:0 "um relatório de autópsia"
 learning_medicine.2010.galen.desc:0 "Galen"
 learning_medicine.2010.herophilus.desc:0 "Herófilo"
 learning_medicine.2010.hildegard.desc:0 "Hildegard de Bingen"
 learning_medicine.2010.hippocrates.desc:0 "Hippocrates"
 learning_medicine.2010.hua_tuo.desc:0 "Hua Tuo"
 learning_medicine.2010.mundinus.desc:0 "Mundinus"
 learning_medicine.2010.start.desc:0 "Ao cruzar o limiar do consultório [Select_CString( court_physician.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('court_physician'))] [court_physician.GetFirstNamePossessive], encontro [court_physician.GetSheHe] curvado sobre um livro.\n\n\"Essa tradução de"
 learning_medicine.2010.sun_simiao.desc:0 "Sun Simiao"
 learning_medicine.2010.t:0 "Uma Tradução Preocupante"
 learning_medicine.2010.tamba_yasuyori.desc:0 "Tamba Yasuyori"
 learning_medicine.2010.trota.desc:0 "Trota de Salerno"
 learning_medicine.2010.zhan_zhongjing.desc:0 "Zhang Zhongjing"
 learning_medicine.2021.a.tt:0 "Você aceita o tratamento de fertilidade"
 learning_medicine.2021.a:0 "Eu poderia usar sua ajuda..."
 learning_medicine.2021.b.tt:0 "Você recusa o tratamento de fertilidade"
 learning_medicine.2021.b:0 "Um médico treinado é sempre bem-vindo."
 learning_medicine.2021.c:0 "Não tenho tais #EMP problemas!#!"
 learning_medicine.2021.desc:0 "Meu nome é [physician.GetTitledFirstNameNoTooltip], e sou um[Select_CString( physician.IsFemale, 'a', '' )] médic[Select_CString( physician.IsFemale, 'a', 'o' )] especializad[Select_CString( physician.IsFemale, 'a', 'o' )] em questões de fertilidade.\n\nTalvez meu aconselhamento discreto seja benéfico para [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord]? Eu ficaria honrado em servir — mediante uma taxa nominal."
 learning_medicine.2021.t:0 "[Select_CString( ROOT.Char.IsFemale, 'A', 'Ao' )] [ROOT.Char.Custom('FormalComplimentAdjective')] [ROOT.Char.GetTitledFirstNameNoTooltip],"
 learning_medicine.2022.a.failure:0 "O tratamento tem efeitos colaterais ruins"
 learning_medicine.2022.a.success:0 "O tratamento é muito bem-sucedido"
 learning_medicine.2022.a.unexpected.tt:0 "Algo inesperado pode acontecer"
 learning_medicine.2022.a.unexpected:0 "O tratamento tem efeitos colaterais estranhos"
 learning_medicine.2022.a:0 "O futuro do reino está em jogo! Vou tentar qualquer coisa!"
 learning_medicine.2022.b.failure:0 "O tratamento não tem sucesso"
 learning_medicine.2022.b.success:0 "O tratamento é bem-sucedido"
 learning_medicine.2022.b:0 "Um simples tônico parece sensato."
 learning_medicine.2022.c:0 "Na verdade, só quero um... conselho."
 learning_medicine.2022.new_physician.desc:0 "Eu queria dar tempo para que meu novo médico se acomodasse, mas apenas algumas horas após a chegada [physician.GetHerHim], [physician.GetFirstName] irrompe em meu escritório com um grande objeto em mãos. [physician.GetSheHe|U] o coloca em cima da minha mesa com um perturbador #EMP clangor#!.\n\n\"Você e [Select_CString( spouse.IsFemale, 'sua', 'seu' )] [spouse.Custom('WifeHusband')] têm várias opções, [ROOT.Char.Custom('FormOfAddressForLiege')]. Existem tônicos que são testados e comprovados — mas também tenho alguns tratamentos experimentais em desenvolvimento.\""
 learning_medicine.2022.old_physician.desc:0 "Já vi [Select_CString( physician.IsFemale, 'a', 'o' )] [physician.GetTitledFirstName] lidar com tudo, desde sanguessugas até corpos em decomposição, mas o desconforto em seu rosto é algo completamente novo.\n\n\"Como seu médico, sou o guardião de sua saúde\", [physician.GetSheHe] diz, olhando para seus sapatos. \"Isso também inclui sua... #EMP saúde reprodutiva#! Eu poderia fazer um tônico que pode ajudar você e [Select_CString( spouse.IsFemale, 'sua', 'seu' )] [spouse.Custom('WifeHusband')]. Também li sobre alguns tratamentos experimentais com resultados promissores.\""
 learning_medicine.2022.t:0 "Problemas de Fertilidade"
 learning_medicine.2023.a:0 "Vamos nos recolher ao meu [ROOT.Char.Custom('GetChamber')], [spouse.GetFirstNameNoTooltip]..."
 learning_medicine.2023.end.desc:0 "[physician.GetFirstNameNoTooltip] está muito positiv[Select_CString( physician.IsFemale, 'a', 'o' )] em relação aos resultados, e eu me sinto excelente! [physician.GetSheHe|U] nos pede paciência, mas acredito que podemos esperar em breve por um novo membro da família."
 learning_medicine.2023.female_orgasm.female.desc:0 "Sua semente deve jorrar e se misturar com a [Select_CString( spouse.IsFemale, 'da', 'do' )] [spouse.Custom('WifeHusbandPossessive')]. [spouse.GetSheHe|U] deve ler este livro sobre técnicas para a [ROOT.Char.Custom('GetChamber')] de dormir.\"\n\nEu não poderia esperar por um tratamento melhor.\n\n"
 learning_medicine.2023.female_orgasm.male.desc:0 "Você deve fazer sua semente jorrar para que possa se misturar com a sua própria. Você deve ler este livro sobre técnicas para a [ROOT.Char.Custom('GetChamber')] de dormir.\"\n\nFoi muito trabalho dominar os métodos desconhecidos, mas consegui dominá-los — pelo menos se a reação d[Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetFirstNamePossessive] for qualquer indicação!\n\n"
 learning_medicine.2023.female_orgasm.start.desc:0 "\"Como você deve saber, o prazer da mulher é tão importante quanto o do homem."
 learning_medicine.2023.milk_bath.desc:0 "\"Todo leite dá vida, e o leite de cabra é especialmente potente. Sempre que você [Select_CString( spouse.IsFemale, 'a sua', 'o seu' )] [spouse.Custom('WifeHusband')] tentarem conceber, vocês devem tomar um banho de leite de cabra primeiro. Talvez até tomem banho juntos!\""
 learning_medicine.2023.milk_bath_end.desc:0 "\n\nMesmo que o leite tivesse um odor distintamente #EMP,"
 learning_medicine.2023.pig_testicles.desc:0 "\"Adquiri o porco mais viril de todo [location.GetNameNoTooltip] e sequei e pulverizei seus testículos. Beba isso com vinho durante duas semanas, e sua fertilidade aumentará dez vezes!\""
 learning_medicine.2023.pig_testicles_end.desc:0 "\n\nMesmo que o pó tenha dado ao vinho um sabor meio mofado, no geral foi uma experiência surpreendentemente agradável."
 learning_medicine.2023.udder.desc:0 "\"O leite dá vida, e por isso devemos ir à sua fonte. Os cozinheiros farão um ensopado de úbere de vaca para vocês dois. Não comam mais nada durante uma semana, e certamente serão recompensados.\"\n\nFoi uma longa semana."
 learning_medicine.2023.unpleasant_end.desc:0 "\n\nMesmo que o tratamento em si tenha sido menos agradável,"
 learning_medicine.2023.urine.desc:0 "\"Seus corpos não estão sincronizados, [ROOT.Char.Custom('FormOfAddressForLiege')], mas eu tenho um remédio para isso. Vocês devem beber a urina [Select_CString( spouse.IsFemale, 'da', 'do' )] [spouse.Custom('WifeHusbandPossessive')], e [spouse.GetSheHe] deve beber a sua. Todas as noites antes de dormir, durante uma semana. Então suas energias certamente se alinharão!\"\n\nFoi uma longa semana."
 learning_medicine.2024.a:0 "Eu só quero descansar..."
 learning_medicine.2024.b:0 "Guardas! Prendam o charlatão!"
 learning_medicine.2024.end.desc:0 "\n\nMesmo que eu tenha seguido à risca o conselho d[Select_CString( physician.IsFemale, 'a', 'o' )] [physician.GetFirstNamePossessive], e [physician.GetSheHe] me diga para ter paciência, minhas dúvidas são fortes. Sinto náuseas e fraqueza, e [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetFirstName] tem estado de cama há três dias seguidos."
 learning_medicine.2025.a.tt:0 "Eu confronto [spouse.GetShortUIName]"
 learning_medicine.2025.a:0 "[spouse.GetFirstNameNoTooltip]. Precisamos conversar. A sós."
 learning_medicine.2025.b:0 "Sábias palavras!"
 learning_medicine.2025.end.desc:0 "age de maneiras misteriosas, [ROOT.Char.Custom('FormOfAddressForLiege')]. Às vezes, é melhor abraçar suas bênçãos em vez de tentar explicá-las.\""
 learning_medicine.2025.fertilitygod.desc:0 "\"[physician.GetFaith.FertilityGodName]"
 learning_medicine.2025.start.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], tenho ótimas notícias! Ainda é cedo, mas [Select_CString( spouse.IsFemale, 'sua', 'seu' )] [spouse.Custom('WifeHusband')] apresenta todos os sinais de estar grávida!\"\n\nPrimeiro, felicidade e alívio me inundam, mas logo surge confusão. \"Mas você ainda não administrou o tratamento, [physician.GetFirstName],\" eu digo com ênfase.\n\n"
 learning_medicine.2025.the_universe.desc:0 "\"O universo"
 learning_medicine.2030.a.message:0 "Desabafar alivia meu estresse"
 learning_medicine.2030.a:0 "Os conselhos d[Select_CString( confider_target.IsFemale, 'a', 'o' )] [confider_target.GetFirstNamePossessiveNoTooltip] sempre são reconfortantes."
 learning_medicine.2030.b:0 "[confider_target_2.GetFirstNameNoTooltip] é um[Select_CString( confider_target_2.IsFemale, 'a', '' )] ótim[Select_CString( confider_target_2.IsFemale, 'a', 'o' )] ouvinte."
 learning_medicine.2030.c.message:0 "[confider_target.GetFirstNameNoTooltip] revela um segredo"
 learning_medicine.2030.c.modifier:0 "Não me sinto relaxad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], mas fico mais forte"
 learning_medicine.2030.c.trait:0 "O exercício me acalma"
 learning_medicine.2030.c.tt:0 "Se [confider_target.GetShortUIName] tiver um [secret|E], [confider_target.GetSheHe] o revelará para mim"
 learning_medicine.2030.c:0 "Podemos guardar os segredos mais sombrios um do outro."
 learning_medicine.2030.d.modifier:0 "Não me sinto relaxad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], mas minha escrita melhora"
 learning_medicine.2030.d.trait:0 "Escrever no diário me acalma"
 learning_medicine.2030.d:0 "Depender dos outros só me tornaria frac[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 learning_medicine.2030.desc:0 "Às vezes, minhas responsabilidades como [ROOT.Char.GetTitleAsNameNoTooltip] parecem completamente esmagadoras. Como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] pode carregar todo o peso do [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]?\n\nTalvez haja alguns fardos com os quais eu não precise lidar sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. Se eu apenas tivesse alguém em quem confiar..."
 learning_medicine.2030.t:0 "Um Fardo Pesado"
 learning_medicine.2040.a:0 "Exercitar-se junto com [Select_CString( friend.IsFemale, 'a', 'o' )] [friend.GetFirstNameNoTooltip]."
 learning_medicine.2040.athletic_friend.desc:0 "M[Select_CString( friend.IsFemale, 'inha', 'eu' )] sábi[Select_CString( friend.IsFemale, 'a', 'o' )] amig[Select_CString( friend.IsFemale, 'a', 'o' )] [friend.GetTitledFirstName] jura que movimento vigoroso ajuda [friend.GetSheHe] a controlar o estresse. Também li sobre os benefícios do diário para acalmar a ansiedade."
 learning_medicine.2040.b:0 "Pedir conselhos de escrita para [Select_CString( friend.IsFemale, 'a', 'o' )] [friend.GetFirstNameNoTooltip]."
 learning_medicine.2040.c:0 "Ir correr."
 learning_medicine.2040.d:0 "Passar a tarde escrevendo no diário."
 learning_medicine.2040.e:0 "Tirar folga o dia todo."
 learning_medicine.2040.journaller_friend.desc:0 "M[Select_CString( friend.IsFemale, 'inha', 'eu' )] sábi[Select_CString( friend.IsFemale, 'a', 'o' )] amig[Select_CString( friend.IsFemale, 'a', 'o' )] [friend.GetTitledFirstName] escreve em seu diário sobre suas preocupações e jura que isso alivia sua mente. Também li sobre os benefícios do movimento vigoroso para acalmar os nervos."
 learning_medicine.2040.no_friend.desc:0 "Preciso de uma saída saudável para lidar com as pressões de governar. Li sobre os benefícios do movimento vigoroso, assim como do diário para acalmar os nervos."
 learning_medicine.2040.start.desc:0 "Quanto mais me aprofundo em meus estudos, mais evidente fica a ligação entre mente e corpo. Preocupar-se demais pode te deixar doente, e a mente não é mais forte do que seu recipiente!\n\n"
 learning_medicine.2040.t:0 "Mente e Corpo"
 learning_medicine.2050.a.failure:0 "Apesar de nossos esforços, perdemos [soldier.GetSheHe]"
 learning_medicine.2050.a.success:0 "[helper.GetFirstNameNoTooltip] e eu salvamos o soldado"
 learning_medicine.2050.a:0 "Me passe o torniquete!"
 learning_medicine.2050.b.failure:0 "Não consigo salvar [soldier.GetSheHe]"
 learning_medicine.2050.b.success:0 "Eu salvo o soldado sozinho"
 learning_medicine.2050.b:0 "#EMP Dê um passo para trás#! Este é #EMP meu#! paciente!"
 learning_medicine.2050.c:0 "Deixe [soldier.GetSheHe] sangrar. [soldier.GetSheHe|U] não merece algo melhor."
 learning_medicine.2050.end.desc:0 "Um calafrio percorre minha espinha. #EMP Eu#! posso ser a única esperança dess[Select_CString( soldier.IsFemale, 'a', 'e' )] [soldier.Custom('WomanManPossessive')].\n\nDe repente, como se [helper.GetSheHe] tivesse surgido do nada, [helper.Custom2('MyCharacterIntroduction', ROOT.Char)] está ao meu lado. [helper.GetSheHe|U] arregaça as mangas e me olha."
 learning_medicine.2050.no_physician.desc:0 "O curandeiro não está em lugar algum."
 learning_medicine.2050.physician.desc:0 "[physician.GetTitledFirstName] não está em lugar algum."
 learning_medicine.2050.start.desc:0 "Estou inspecionando a enfermaria de [Select_CString(IsLandlessAdventurer(ROOT.Char),'camps','barracks')] quando um soldado gravemente ferido é trazido. \"[soldier.GetSheHe|U] está perdendo muito sangue! Onde está o médico?!\"\n\n"
 learning_medicine.2050.t:0 "Sangrando"
 learning_medicine.2051.a:0 "Eu não poderia ter feito isso sem você."
 learning_medicine.2051.end.desc:0 "[helper.GetFirstNameNoTooltip] diz com um sorriso cansado. \"Foi uma honra servir ao seu lado.\""
 learning_medicine.2051.firstname.desc:0 "[ROOT.Char.GetFirstNameNoTooltip],\""
 learning_medicine.2051.middle.desc:0 "Mas [Select_CString( helper.IsFemale, 'a', 'o' )] [helper.GetTitledFirstName] permanece calm[Select_CString( helper.IsFemale, 'a', 'o' )], e eventualmente, uma calma focada se instala em nós.\n\nNão tenho certeza de como conseguimos, mas no final, parece que o soldado sobreviverá. \"Foi uma proeza impressionante,"
 learning_medicine.2051.my_ladylord.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\""
 learning_medicine.2051.start.desc:0 "o paciente grita e se debater. Mesmo com três [soldier.GetWomenMen] adultos segurando [soldier.GetSheHe], cada passo é uma batalha."
 learning_medicine.2051.start_our.desc:0 "Nosso"
 learning_medicine.2052.a:0 "Você está cert[Select_CString( helper.IsFemale, 'a', 'o' )]. Obrigado, [helper.GetFirstNameNoTooltip]."
 learning_medicine.2052.b:0 "Eu não preciso da sua compaixão!"
 learning_medicine.2052.end.desc:0 "[helper.GetFirstNameNoTooltip] diz com um suspiro pesado enquanto levam o corpo embora. \"Ess[Select_CString( soldier.IsFemale, 'a', 'e' )] [soldier.GetWomanMan] já estava condenad[Select_CString( soldier.IsFemale, 'a', 'o' )] muito antes de pormos os olhos n[soldier.GetSheHe].\""
 learning_medicine.2052.middle.desc:0 "\n\nTrabalhamos freneticamente, gritando ordens no caos, mas é em vão. [Select_CString( soldier.IsFemale, 'A', 'O' )] [soldier.GetWomanMan] apenas fica mais frac[Select_CString( soldier.IsFemale, 'a', 'o' )], seu sangue jorrando entre nossos dedos.\n\n\"Fizemos tudo o que podíamos,"
 learning_medicine.2053.a:0 "Eu salvei uma vida hoje!"
 learning_medicine.2053.desc:0 "Mas meu conhecimento não me falha, e minhas mãos permanecem firmes.\n\nNão tenho certeza de como consegui, mas no final, parece que o soldado sobreviverá. Seus camaradas me dão tapinhas nas costas, alívio vencendo a formalidade. \"Obrigado, [ROOT.Char.Custom('FormOfAddressForLiege')]. Teríamos perdido [Select_CString( soldier.IsFemale, 'a', 'o' )] [soldier.GetFirstName] sem você!\""
 learning_medicine.2053.start_my.desc:0 "Meu"
 learning_medicine.2054.a:0 "Eu... Se eu tivesse apenas..."
 learning_medicine.2054.desc:0 "\n\nTrabalho freneticamente, gritando ordens no meio do caos, mas é em vão. [Select_CString( soldier.IsFemale, 'A', 'O' )] [soldier.GetWomanMan] apenas fica mais frac[Select_CString( soldier.IsFemale, 'a', 'o' )], seu sangue jorrando entre meus dedos.\n\nEnquanto levam o corpo, [helper.GetFirstName] me olha com"
 learning_medicine.2054.disgust.desc:0 "desgosto não disfarçado."
 learning_medicine.2054.pity.desc:0 "pena."
 learning_medicine.2110.a.bad_terms:0 "Com esse canalha? Nunca!"
 learning_medicine.2110.a.good_terms:0 "Desculpe, mas tenho que seguir meu caminho."
 learning_medicine.2110.a.neutral_terms:0 "Receio que tenho lugares para ir."
 learning_medicine.2110.b.bad_terms:0 "Está bem. Mas #EMP só um#! bolo."
 learning_medicine.2110.b.flavour:0 "Um bolo vira dois, depois três, depois cinco..."
 learning_medicine.2110.b.good_terms:0 "Eu posso ser persuadido a me deliciar um pouco..."
 learning_medicine.2110.b.neutral_terms:0 "Talvez possamos pegar um ou dois bolos..."
 learning_medicine.2110.c.bad_terms:0 "Minha tolerância é lendária!"
 learning_medicine.2110.c.good_terms:0 "Apenas tente acompanhar, amigo!"
 learning_medicine.2110.c.neutral_terms:0 "Vamos tornar isso uma noite decadente!"
 learning_medicine.2110.c.tt_fail:0 "O excesso de indulgência me torna indiscreto"
 learning_medicine.2110.c.tt_success:0 "O haxixe faz com que [hashish_vassal_or_liege.GetSheHe] fale demais"
 learning_medicine.2110.desc:0 "Eu e minha comitiva estamos voltando de uma breve incursão em [capital.GetNameNoTooltip], quando nos deparamos inesperadamente com [hashish_vassal_or_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] e sua comitiva, rondando minha capital em negócios não anunciados.\n\n"
 learning_medicine.2110.desc_bad_terms:0 "A tensão paira no ar, nossas respectivas guardas ansiosas por uma briga. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\", diz um soldado jovem e nervoso atrás de mim, \"talvez possamos nos acalmar com alguns bolos de haxixe naquela taverna ali?\"\n\nSilêncio toma conta dos nossos grupos enquanto [Select_CString( hashish_vassal_or_liege.IsFemale, 'a', 'o' )] [hashish_vassal_or_liege.GetFirstNameNoTooltip] aguarda minha resposta."
 learning_medicine.2110.desc_good_terms:0 "\"Ah, [ROOT.Char.GetFirstNameNoTooltip]! Eu estava esperando encontrar você. Venha, encontrei uma taverna encantadora bem perto daqui. Gostaria de se juntar a mim para alguns [ROOT.Char.Custom('GetExpensiveDrink')] e bolos de haxixe?\""
 learning_medicine.2110.desc_neutral_terms:0 "Pegos de surpresa, alguns momentos de desconfortável silêncio se passam antes que os olhos d[Select_CString( hashish_vassal_or_liege.IsFemale, 'a', 'o' )] [hashish_vassal_or_liege.GetFirstNamePossessiveNoTooltip] se fixem em algo atrás de mim.\n\n\"Ah, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [hashish_vassal_or_liege.Custom2('RelationToMe', ROOT.Char)], talvez você se junte a mim para esquecer tudo isso com alguns [ROOT.Char.Custom('GetExpensiveDrink')] e bolos de haxixe?\""
 learning_medicine.2110.t:0 "Conversa sobre Bolos"
 learning_medicine_special.1001.a:0 "Vou estudar os estragos das doenças em um cadáver."
 learning_medicine_special.1001.b:0 "Os corpos dos mortos merecem nosso respeito!"
 learning_medicine_special.1001.desc:0 "Fico fascinado pelo corpo humano e todos os segredos que ele ainda guarda. Questões de vida e morte estão constantemente em minha mente.\n\nLer textos sobre o assunto é bom, mas não consigo deixar de sentir que aprenderia muito mais com pesquisas práticas."
 learning_medicine_special.1001.t:0 "Segredos do Corpo"
 learning_medicine_special.1002.a.bad:0 "[scoped_physician.GetTitledFirstName] fica chocad[Select_CString( scoped_physician.IsFemale, 'a', 'o' )] com meus experimentos"
 learning_medicine_special.1002.a.good:0 "[scoped_physician.GetTitledFirstName] me ajuda em minhas pesquisas"
 learning_medicine_special.1002.a:0 "Talvez [Select_CString( scoped_physician.IsFemale, 'a', 'o' )] [scoped_physician.GetTitledFirstNameNoTooltip] possa me ajudar?"
 learning_medicine_special.1002.b:0 "Só preciso encontrar mais corpos... De alguma forma."
 learning_medicine_special.1002.c:0 "Chega! Isso é indecente!"
 learning_medicine_special.1002.desc:0 "Tento segurar a respiração enquanto mexo na massa emaranhada de vísceras viscosas e inchadas que brotam da barriga do cadáver, mas é em vão. O fedor pútrido da decomposição aos poucos encontra o caminho até meus pulmões, me fazendo engasgar.\n\nAlgo então se rasga, e um fluxo de icor viscoso e amarelado derrama-se sobre a mesa de operação.\n\n \"O que foi #EMP isso#!?\""
 learning_medicine_special.1003.a.bad:0 "O cheiro dos cadáveres começa a afetar meus humores"
 learning_medicine_special.1003.a.good:0 "Minhas precauções me protegem de doenças"
 learning_medicine_special.1003.a:0 "Talvez algumas flores possam ajudar?"
 learning_medicine_special.1003.b:0 "Acho que já aprendi o suficiente."
 learning_medicine_special.1003.desc_ending:0 "\n\nSó gostaria que houvesse alguma maneira de afastar o cheiro... Estou começando a temer que toda essa exposição ao ar ruim possa não ser boa para minha saúde."
 learning_medicine_special.1003.desc_fallback:0 "Com a ajuda de algumas moedas bem colocadas e um criado de boca fechada, garanti um suprimento constante de corpos para experimentar. Infelizmente, acabo desmembrando a maioria deles, mas como se aprende sem cometer um erro ou uma dúzia?"
 learning_medicine_special.1003.desc_physician:0 "[scoped_physician.GetTitledFirstName] ficou extasiad[Select_CString( scoped_physician.IsFemale, 'a', 'o' )] ao saber do meu novo interesse pela anatomia. Com a ajuda del[Select_CString( scoped_physician.IsFemale, 'a', 'e' )], aprofundei significativamente meu conhecimento sobre o corpo humano."
 learning_medicine_special.1004.a:0 "Talvez você esteja certo..."
 learning_medicine_special.1004.desc:0 "[scoped_physician.GetTitledFirstName] não ficou nada satisfeit[Select_CString( scoped_physician.IsFemale, 'a', 'o' )] ao saber dos meus experimentos. [scoped_physician.GetSheHe|U] se recusou a prestar qualquer ajuda e me repreendeu, dizendo que esse tipo de empreendimento não está dentro da alçada de um [ROOT.Char.GetTitleTierName]."
 learning_medicine_special.1004.unavailable.a:0 "Infelizmente."
 learning_medicine_special.1004.unavailable.desc:0 "Com [Select_CString( scoped_physician.IsFemale, 'a', 'o' )] [scoped_physician.GetTitledFirstName] incapaz de fornecer qualquer ajuda, não pude continuar meus experimentos com anatomia humana."
 learning_medicine_special.1004.unavailable.tt:0 "Você deixa de estudar cadáveres humanos"
 learning_medicine_special.1005.a:0 "Nada atrapalha o conhecimento!"
 learning_medicine_special.1005.desc:0 "Felizmente, o uso adequado de canteiros de flores, incenso e aeração parece ter ajudado a diminuir os efeitos que os vapores ruins emanados pelos cadáveres estavam causando em meu corpo.\n\nFinalmente posso me concentrar em meus estudos sem medo de repercussões no equilíbrio dos meus humores."
 learning_medicine_special.1006.a:0 "O cheiro da morte afetou meus humores!"
 learning_medicine_special.1006.desc:0 "Não consigo mais negar as necessidades do meu próprio corpo, tenho que terminar isso e deitar por um tempo..."
 learning_medicine_special.1006.desc_death:0 "A tosse vem logo em seguida, e enquanto me curvo devido à dor, consigo sentir sangue escorrendo entre meus lábios.\n\nEu pisc, e me vejo no chão. Dou um suspiro trêmulo e percebo que não consigo mais respirar. Fecho meus olhos..."
 learning_medicine_special.1006.desc_opening:0 "Enquanto observo um dos corpos que tenho há dias em meu estudo, sou repentinamente atingido por vertigem — novamente."
 learning_medicine_special.2100.a.tt_failure:0 "Sou assombrado por pesadelos do [ROOT.Char.GetFaith.NegativeAfterLife]"
 learning_medicine_special.2100.a.tt_success:0 "Recebo revelações divinas sobre [ROOT.Char.GetFaith.PositiveAfterLife]"
 learning_medicine_special.2100.a:0 "Prepare-me um dos seus peixes mágicos."
 learning_medicine_special.2100.b.tt_fail:0 "Tenho uma discussão acalorada com [Select_CString( fish_alchemist.IsFemale, 'a plebéia', 'o plebeu' )]"
 learning_medicine_special.2100.b.tt_failure.tt:0 "[fish_alchemist.GetShortUINameNoTooltip] foge da minha corte, indignad[Select_CString( fish_alchemist.IsFemale, 'a', 'o' )]"
 learning_medicine_special.2100.b.tt_success.tt:0 "[fish_alchemist.GetShortUINameNoTooltip] se junta à minha corte como um servo leal"
 learning_medicine_special.2100.b.tt_success:0 "O camponês revela os segredos"
 learning_medicine_special.2100.b:0 "Este ritual, você deve me ensiná-lo..."
 learning_medicine_special.2100.c.tt:0 "[fish_alchemist.GetShortUINameNoTooltip] é queimad[Select_CString( fish_alchemist.IsFemale, 'a', 'o' )] na fogueira"
 learning_medicine_special.2100.c:0 "Não permita que [Select_CString( fish_alchemist.IsFemale, 'a', 'o' )] brux[Select_CString( fish_alchemist.IsFemale, 'a', 'o' )] viva!"
 learning_medicine_special.2100.d.tt:0 "[fish_alchemist.GetShortUINameNoTooltip] é expuls[Select_CString( fish_alchemist.IsFemale, 'a', 'o' )] da minha corte, amargurad[Select_CString( fish_alchemist.IsFemale, 'a', 'o' )]"
 learning_medicine_special.2100.d:0 "Alguém poderia gentilmente remover [Select_CString( fish_alchemist.IsFemale, 'esta plebéia', 'este plebeu' )]?"
 learning_medicine_special.2100.desc:0 "Um[Select_CString( fish_alchemist.IsFemale, 'a', '' )] pescador[Select_CString( fish_alchemist.IsFemale, 'a', '' )] local de [hallucinogenic_fish_county.GetNameNoTierNoTooltip], [fish_alchemist.GetName], veio até mim afirmando ser capaz de cozinhar um jantar encantado.\n\nSupostamente, [fish_alchemist.GetSheHe] pesca peixes dos sonhos em um local secreto e realiza rituais estranhos sobre eles. [fish_alchemist.GetSheHe|U] então serve suas cabeças, com cada peixe inspirando visões extáticas por dias após o consumo.\n\n[Select_CString( fish_alchemist.IsFemale, 'A', 'O' )] [fish_alchemist.GetWomanMan] pescador[Select_CString( fish_alchemist.IsFemale, 'a', '' )] torce as mãos enquanto me olha, os olhos brilhando de ganância e medo."
 learning_medicine_special.2100.t:0 "Um Peixe Muito Milagroso"
