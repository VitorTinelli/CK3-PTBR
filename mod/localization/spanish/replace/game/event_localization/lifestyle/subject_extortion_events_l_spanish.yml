l_spanish:
 subject_extortion.0001.a:0 "Considere isso um pequeno teste adicional de lealdade!"
 subject_extortion.0001.b:0 "Não se preocupe, farei #EMP todos#! pagarem."
 subject_extortion.0001.c:0 "Ah, mas você ainda me deve, lembra-se?"
 subject_extortion.0001.d.flavor:0 "[extortion_target.GetSheHe|U] parece mais chatead[Select_CString( extortion_target.IsFemale, 'a', 'o' )] do que eu esperava."
 subject_extortion.0001.d:0 "Estou apenas brincando, [extortion_target.GetFirstNameNoTooltip]!"
 subject_extortion.0001.desc:0 "M[Select_CString( extortion_target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('extortion_target'))], [extortion_target.GetTitledFirstName] - agora aqui está uma pessoa de posses. Julgando pela expressão [extortion_target.GetHerHim], [extortion_target.GetSheHe] já sabe para qual propósito estou me aproximando [extortion_target.GetHerHim].\n\n\"Sou leal, pago minhas obrigações\", insiste [extortion_target.GetSheHe]. \"Como você pode exigir mais de mim?\""
 subject_extortion.0001.t:0 "Extorquir Súditos: Vassal[Select_CString( extortion_target.IsFemale, 'a', 'o' )] Poderos[Select_CString( extortion_target.IsFemale, 'a', 'o' )]"
 subject_extortion.0002.a:0 "Eles podem fazer o que quiserem, desde que eu receba meu ouro!"
 subject_extortion.0002.b:0 "Por que eles nunca são gratos pelo que #EMP conseguem fazer?#!"
 subject_extortion.0002.c:0 "Não vale a pena aborrecê-los agora."
 subject_extortion.0002.desc:0 "Os camponeses do [extortion_target.GetName] parecem estar se saindo melhor do que se poderia esperar, considerando os impostos que arrecadei lá. Uma contribuição extra para meu tesouro não fará mal algum.\n\nOh, eles vão reclamar, mas não é isso que os camponeses sempre fazem? Eles vão sobreviver a isso, tenho certeza."
 subject_extortion.0002.t:0 "Extorquir Súditos: Camponeses"
 subject_extortion.0003.a:0 "[ROOT.Char.GetFaith.PriestNeuterPlural|U] devem contribuir tanto quanto qualquer outro!"
 subject_extortion.0003.b:0 "Eu não mereci isso, por [ROOT.Char.GetFaith.HighGodName]?"
 subject_extortion.0003.c:0 "É uma má ideia irritar os servos de [ROOT.Char.GetFaith.HighGodNameAlternate]..."
 subject_extortion.0003.desc:0 "Será que [ROOT.Char.GetFaith.WealthGodName] não quer que eu prospere? E não seria um tesouro bem abastecido o melhor meio para isso?\n\nPor algum motivo, os [ROOT.Char.GetFaith.AltPriestTermPlural] estão relutantes em concordar. Parecem pensar que a influência que exercem sobre suas congregações os protegerá."
 subject_extortion.0003.t:0 "Extorquir Súditos: [ROOT.Char.GetFaith.AltPriestTermPlural|U]"
 subject_extortion.0004.a:0 "Que solução perfeita!"
 subject_extortion.0004.b:0 "Por que pegar um pouco, quando posso pegar #EMP muito mais#!?"
 subject_extortion.0004.c:0 "Não, suas obrigações já estão cumpridas."
 subject_extortion.0004.desc:0 "O propósito dos meus vassalos é apoiar meus esforços. Embora eles já paguem impostos pelo privilégio, não consigo deixar de pensar em quanto mais eu ganharia se todos contribuíssem um pouco mais...\n\nGrande riqueza para mim, a um custo mínimo para eles!"
 subject_extortion.0004.t:0 "Extorquir Súditos: Vassalos"
 subject_extortion.0005.a:0 "Eles até vivem apenas pela minha misericórdia!"
 subject_extortion.0005.b:0 "Isso não é uma exigência, mas espero presentes."
 subject_extortion.0005.c:0 "Oh, eles já têm tão pouco neste mundo..."
 subject_extortion.0005.desc:0 "Meus cortesãos praticamente vivem da minha generosidade. Não é hora de eles mostrarem sua gratidão?\n\nAté um nobre menor deve entender muito bem sobre honra e dever."
 subject_extortion.0005.t:0 "Extorquir Súditos: Cortesãos"
 subject_extortion.9998.a:0 "Espere! O que está tilintando em seu bolso?"
 subject_extortion.9998.b:0 "Espere, o que é isso embaixo do meu assento?"
 subject_extortion.9998.desc.steward:0 "Meu [steward.GetCouncilTitle] parece ter falhado em encontrar mais fontes de ouro em meu reino.\n\n\"Peço desculpas, meu senhor, mas não há mais nada que possamos tomar impunemente.\""
 subject_extortion.9998.desc:0 "Apesar da minha graça e caráter honrado, parece que não consigo encontrar ninguém disposto a me apoiar além do que a lei os obriga. Nenhum deles parece empolgado em apoiar minhas ideias para novas leis também.\n\nSou forçado a sofrer a destituição pelas mãos dos meus servos gananciosos e egoístas?!"
 subject_extortion.9998.t:0 "Extorquir Súditos"
