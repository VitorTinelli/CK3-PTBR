 statecraft_sc_mediation_debug_add_dynasty_prestige:0 "#D Adicionar Prestígio de Dinastia#!"
 statectaft_ongoing.7025.desc.intimidation.success:0 "Você pode ter me prestado um serviço no passado, mas não pense que lhe devo algo em troca. É suficiente permanecer em meus bons termos. Acredite em mim, você não quer me ter como inimigo..."
 stewardship_duty.0001.a.failure.tt:0 "Eu pareço um intrometido insensível"
 stewardship_duty.0001.a.success.tt:0 "Minha mediação é bem-sucedida"
 stewardship_duty.0001.a:0 "Tentar fazê-los ver o bom senso."
 stewardship_duty.0001.b:0 "\"Ah, [arguer_2.GetFirstNameNoTooltip] é [Select_CString( arguer_2.IsFemale, 'uma verdadeira', 'um verdadeiro' )] [arguer_2.Custom2('InsultNoun', ROOT.Char)]!\""
 stewardship_duty.0001.c:0 "\"Você acredita [Select_CString( arguer_1.IsFemale, 'na', 'no' )] [arguer_1.GetFirstNameNoTooltip]? [arguer_1.GetSheHe|U] tem um pouco de nervo!\""
 stewardship_duty.0001.end.desc:0 "são o suficiente para deixar qualquer [ROOT.Char.GetWomanMan] louc[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] - algo precisa ser feito!\n\nPosso tratar a situação como um exercício de mediação ou ouvir secretamente e abordar um deles com minhas simpatias depois..."
 stewardship_duty.0001.start.desc:0 "Quando os gritos irritantes chegam até mim mais uma vez, reprimo meu instinto de virar as costas. As constantes brigas entre"
 stewardship_duty.0001.t:0 "Exercício de Mediação"
 stewardship_duty.0001.vassalandcourtier.desc:0 "meu vassalo [arguer_1.GetTitledFirstName] e [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [arguer_2.Custom2('MyCharacterIntroduction', ROOT.Char)]"
 stewardship_duty.0001.vassals.desc:0 "meus vassalos [arguer_1.GetTitledFirstName] e [Select_CString( arguer_2.IsFemale, 'a', 'o' )] [arguer_2.GetTitledFirstName]"
 stewardship_duty.0017.a:0 "Apoiar [Select_CString( councillor_1.IsFemale, 'a', 'o' )] [councillor_1.GetFirstNameNoTooltip] sem irritar [Select_CString( councillor_2.IsFemale, 'a', 'o' )] [councillor_2.GetFirstNameNoTooltip]."
 stewardship_duty.0017.b:0 "Apoiar [Select_CString( councillor_2.IsFemale, 'a', 'o' )] [councillor_2.GetFirstNameNoTooltip] sem irritar [Select_CString( councillor_1.IsFemale, 'a', 'o' )] [councillor_1.GetFirstNameNoTooltip]."
 stewardship_duty.0017.building_projects.desc:0 "os próximos projetos de construção."
 stewardship_duty.0017.c.criticial_success.desc:0 "Eu faço um ótimo compromisso, agradando tanto [Select_CString( councillor_1.IsFemale, 'a', 'o' )] [councillor_1.GetFirstName] quanto [Select_CString( councillor_2.IsFemale, 'a', 'o' )] [councillor_2.GetFirstName]."
 stewardship_duty.0017.c.criticial_success.tt:0 "Eu faço um ótimo compromisso"
 stewardship_duty.0017.c.failure.desc:0 "Eu falho em encontrar um compromisso, decepcionando tanto [Select_CString( councillor_1.IsFemale, 'a', 'o' )] [councillor_1.GetFirstName] quanto [Select_CString( councillor_2.IsFemale, 'a', 'o' )] [councillor_2.GetFirstName]."
 stewardship_duty.0017.c.failure.tt:0 "Eu falho em encontrar um compromisso"
 stewardship_duty.0017.c.success.desc:0 "Eu faço um bom compromisso, acalmando tanto [Select_CString( councillor_1.IsFemale, 'a', 'o' )] [councillor_1.GetFirstName] quanto [Select_CString( councillor_2.IsFemale, 'a', 'o' )] [councillor_2.GetFirstName]."
 stewardship_duty.0017.c.success.tt:0 "Eu faço um bom compromisso"
 stewardship_duty.0017.c:0 "Encontrar um compromisso que deixe todos felizes."
 stewardship_duty.0017.charity_projects.desc:0 "meu próximo projeto de caridade."
 stewardship_duty.0017.election.desc:0 "a eleição do meu sucessor."
 stewardship_duty.0017.end.desc:0 "\n\nComo [Select_CString( ROOT.GetCharacter.IsFemale, 'a', 'o' )] [ROOT.GetCharacter.GetTitleAsNameNoTooltip], eu poderia silenciá-los com uma única palavra, mas tenho uma ideia melhor. Minhas habilidades diplomáticas me deram perspicácia sobre como lidar com situações como essas para agradar a todos."
 stewardship_duty.0017.health_issues.desc:0 "a propagação de uma doença."
 stewardship_duty.0017.religious_minorities.desc:0 "a questão das minorias religiosas."
 stewardship_duty.0017.start.desc:0 "Outra reunião do conselho, outro conflito. O [councillor_1.GetCouncilTitle] [councillor_1.GetFirstName] e o [councillor_2.GetCouncilTitle] [councillor_2.GetFirstName] estão discutindo violentamente sobre"
 stewardship_duty.0017.t:0 "A Voz da Razão"
 stewardship_duty.0017.troop_training.desc:0 "o regime de treinamento das tropas."
 stewardship_duty.0017.war.desc:0 "a guerra em andamento."
 stewardship_duty.1055.a:0 "Você terá a justiça que deseja, [new_mothers_parent.GetFirstNameNoTooltip]."
 stewardship_duty.1055.b:0 "[new_father.GetFirstNameNoTooltip] é inocente, ele não deve nada a [new_mothers_parent.GetFirstNameNoTooltip]!"
 stewardship_duty.1055.desc:0 "Uma cena dramática se desenrola em minha câmara de audiência quando [new_mothers_parent.Custom2('MyCharacterIntroduction', ROOT.Char)] acusa [new_father.Custom2('MyCharacterIntroduction', ROOT.Char)] de engravidar s[Select_CString( new_mother.IsFemale, 'ua', 'eu' )] [new_mothers_parent.Custom2('RelationToMeShort', new_mother)] [new_mother.Custom('Governance_1055_OutOfWedlock')].\n\n[new_fathers_parent.GetTitledFirstName] afirma indignad[Select_CString( new_fathers_parent.IsFemale, 'a', 'o' )] que não há provas da culpa de seu filho. 'E mesmo que fosse ele, certamente é culpa da [new_mother.GetFirstName] por ser uma mulher promíscua!'\n\nA discussão está esquentando, e eu devo fazer algo antes que as coisas saiam do controle."
 stewardship_duty.1055.e:0 "Por que vocês dois estão me incomodando com essa briga insignificante!?"
 stewardship_duty.1055.t:0 "Uma Gravidez Indesejada"
 stewardship_duty.1062.a:0 "[client_1.GetTitledFirstNameNoTooltip] é conhecido por cultivar jardins bonitos."
 stewardship_duty.1062.b:0 "A poesia religiosa d[Select_CString( client_2.IsFemale, 'a', 'o' )] [client_2.GetTitledFirstNameNoTooltip] comove muitas almas."
 stewardship_duty.1062.c:0 "As descobertas feitas [Select_CString( client_3.IsFemale, 'pela', 'pelo' )] [client_3.GetTitledFirstNameNoTooltip] mostram promessa."
 stewardship_duty.1062.d:0 "Não, tenho outros planos para esse dinheiro..."
 stewardship_duty.1062.desc:0 "Meu tesouro está repleto de ouro e prata, e todas as despesas estão cobertas. Como [Select_CString( ROOT.Char.IsFemale, 'uma rica', 'um rico' )] [ROOT.Char.GetLadyLord], espera-se que eu ofereça patrocínio a algum tipo de artista ou estudioso.\n\nPor sorte, três candidatos em potencial acabaram de chegar no [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]... mas algum deles me impressiona?"
 stewardship_duty.1062.e:0 "Expectativas? Bah! Vou me banhar na glória do meu tesouro!"
 stewardship_duty.1062.t:0 "Riqueza Abundante"
 stewardship_duty.1063.a:0 "Estender meu patrocínio por mais um período."
 stewardship_duty.1063.b:0 "[client.GetSheHe|U] tem feito um bom trabalho, dê um bônus para [client.GetSheHe]!"
 stewardship_duty.1063.c:0 "Os serviços [client.GetHerHim|U] não são mais necessários."
 stewardship_duty.1063.desc:0 "Após 5 anos, os fundos que reservei para o patrocínio [Select_CString( client.IsFemale, 'da minha', 'do meu' )] [client.Custom('Governance_1062_Client')] [client.GetTitledFirstName] se esgotaram. Agora posso decidir se renovo meu patrocínio por mais 5 anos ou se o deixo partir."
 stewardship_duty.1063.t:0 "Renovação do Patrocínio"
 stewardship_duty.1064.desc:0 "Meu [client.Custom('Governance_1062_Client_U')] Deixou Minha Corte"
 stewardship_duty.1065.desc:0 "Meu [client.Custom('Governance_1062_Client_U')|U] Faleceu"
 stewardship_duty.1065.guilty.desc:0 "Eu Matei Meu [client.Custom('Governance_1062_Client_U')]"
 stewardship_duty.1066.desc:0 "Eu Prendi Meu [client.Custom('Governance_1062_Client_U')]"
 stewardship_duty.1068.desc.a:0 "Vassalo Impressionado Com Meus Jardins"
 stewardship_duty.1068.desc.b:0 "[ROOT.Char.GetFaith.AltPriestTermPlural|U] Impressionado Com Meu [client.Custom('Governance_1062_Client_U')]"
 stewardship_duty.1068.desc.c:0 "[client.Custom('Governance_1062_Client_U')] Fez Uma Nova Descoberta"
 stewardship_duty.1071.a:0 "Devolver gentilmente os servos [Select_CString( origin_county_owner.IsFemale, 'a', 'ao' )] [origin_county_owner.GetFirstNameNoTooltip]."
 stewardship_duty.1071.b:0 "Devolver os servos, mas repreender severamente [Select_CString( origin_county_owner.IsFemale, 'a', 'o' )] [origin_county_owner.GetFirstNameNoTooltip]."
 stewardship_duty.1071.c.compassionate:0 "Eu darei a eles refúgio d[Select_CString( origin_county_owner.IsFemale, 'a', 'o' )] [origin_county_owner.GetFirstNameNoTooltip]..."
 stewardship_duty.1071.c.flavor:0 "...e espero que [Select_CString( origin_county_owner.IsFemale, 'a', 'o' )] [origin_county_owner.GetFirstName] não descubra meu envolvimento nisso!"
 stewardship_duty.1071.c:0 "Mostrar #EMP aos meus#! servos seus novos campos..."
 stewardship_duty.1071.desc:0 "Um influxo de servos chegou em [target_county.GetName] provenientes da vizinhança em [origin_county.GetName]. Eles afirmam estar fugindo do governo abusivo de [origin_county_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] e desejam viver em meu domínio em vez da [origin_county_owner.GetHerHim].\n\nLegalmente, eles ainda estão em servidão [Select_CString( origin_county_owner.IsFemale, 'a', 'ao' )] [origin_county_owner.GetFirstName], mas se eu permitir que eles se estabeleçam em minhas terras, será quase impossível para [origin_county_owner.GetSheHe] provar que eles são de fato servos [origin_county_owner.GetHerHim]."
 stewardship_duty.1071.t:0 "Refugiados de Servos"
 stewardship_duty.1072.a:0 "Aqueles eram seus servos? Minhas desculpas, vou devolvê-los."
 stewardship_duty.1072.b.compassionate:0 "Isso é culpa sua. Você não deveria tê-los maltratado."
 stewardship_duty.1072.b:0 "Resmungue o quanto quiser, isso não muda nada."
 stewardship_duty.1072.desc.relationship:0 "Por que você roubou meus servos de mim!? Estou chocado e profundamente magoado que você tenha me traído assim... Não sei se conseguirei ver você da mesma forma novamente."
 stewardship_duty.1072.desc.rival:0 "Eu sei que você roubou meus servos de mim. Eu posso não ter nenhuma maneira de recuperá-los, mas não pense que vou esquecer essa ofensa. Você conquistou minha inimizade — espero que tenha valido a pena."
 stewardship_duty.1072.desc.subvassal:0 "Eu sei que você realocou meus servos em suas terras. Esse ato subverte a própria estrutura de nossa sociedade!\n\nEmbora eu não possa fazer nada a respeito agora, tenha certeza de que [Select_CString( origin_county_owner_liege.IsFemale, 'a', 'o' )] [origin_county_owner_liege.GetTitledFirstName] saberá por que tenho menos impostos para [origin_county_owner_liege.GetSheHe] este ano."
 stewardship_duty.1072.desc.vassal:0 "Eu sei que você realocou meus servos em suas terras. Por que você faria isso com seu próprio vassalo? Eu não tenho sido fiel em pagar os impostos que lhe são devidos?\n\nSem servos para trabalhar em meus campos, não posso cultivar nada. Você poderia muito bem ter roubado a própria terra! Essa é uma ofensa que não esquecerei tão cedo."
 stewardship_duty.1072.opening:0 "[origin_county_owner.Custom2('AppropriateGreeting', ROOT.Char)]"
 stewardship_duty.4010.attempt.tt:0 "A decisão d[Select_CString( faction_member.IsFemale, 'a', 'o' )] [faction_member.GetTitledFirstNameNoTooltip] será baseada em sua personalidade"
 stewardship_duty.4010.bribe.flavor:0 "Pessoas egoístas serão mais propensas a aceitar um suborno."
 stewardship_duty.4010.bribe:0 "Um generoso presente mudará a opinião [faction_member.GetHerHim]."
 stewardship_duty.4010.decline.tt:0 "Tod[Select_CString( faction_member.IsFemale, 'as', 'os' )] [faction_member.GetWomenMen] apreciam poder fazer o que desejam."
 stewardship_duty.4010.decline:0 "[faction_member.GetTitledFirstNameNoTooltip] está apenas exercendo seus direitos."
 stewardship_duty.4010.desc.claimant:0 "a [targeting_faction.GetName], acreditando que seu representante seria um governante melhor do que eu."
 stewardship_duty.4010.desc.end:0 "\n\nEmbora eu não duvide das convicções d[Select_CString( faction_member.IsFemale, 'a', 'o' )] [faction_member.GetFirstNameNoTooltip], [faction_member.GetSheHe] é apenas humano. Se eu puder convencer [faction_member.GetSheHe] a conter essas atividades, será mais fácil para mim consolidar o poder que tenho sobre meus vassalos."
 stewardship_duty.4010.desc.independence:0 "a [targeting_faction.GetName]. Eles estão buscando se libertar do meu domínio, alegando que eu não sou seu verdadeiro senhor feudal."
 stewardship_duty.4010.desc.liberty:0 "a [targeting_faction.GetName]. Eles buscam anular várias leis no [ROOT.Char.GetPrimaryTitle.GetName] que eles acreditam interferir nos direitos tradicionais dos [faction_member.Custom('StatecraftGetVassalType')]."
 stewardship_duty.4010.desc.peasant:0 "a [targeting_faction.GetName]. Eles estão insatisfeitos em serem súditos de alguém que consideram um [ROOT.Char.Custom2('GetUnbelieverAndForeignerTerm', faction_member)] e desejam ter um governante como [Select_CString( faction_leader.IsFemale, 'a', 'o' )] [faction_leader.GetTitledFirstName], que compartilha sua cultura e fé."
 stewardship_duty.4010.desc.start:0 "[faction_member.GetTitledFirstName] tem usado sua influência para promover o avanço de"
 stewardship_duty.4010.failure:0 "[faction_member.GetTitledFirstNameNoTooltip] rejeita minha oferta"
 stewardship_duty.4010.favor.flavor:0 "Pessoas egoístas ou compassivas serão mais propensas a aceitar essa oferta."
 stewardship_duty.4010.favor:0 "Se [faction_member.GetSheHe] me ajudar agora, eu retribuirei o favor."
 stewardship_duty.4010.piety.flavor:0 "Pessoas zelosas são mais propensas a agir de acordo com sua fé."
 stewardship_duty.4010.piety:0 "Lembrarei a [faction_member.GetSheHe] que meus interesses são os interesses de [faction_member.GetFaith.HighGodName]."
 stewardship_duty.4010.prestige.flavor:0 "Pessoas arrogantes ou honradas são mais propensas a ser influenciadas pela bajulação."
 stewardship_duty.4010.prestige:0 "A bajulação tradicional é boa para inspirar lealdade."
 stewardship_duty.4010.success:0 "[faction_member.GetTitledFirstNameNoTooltip] aceita minha oferta"
 stewardship_duty.4010.t:0 "Faccionalismo Vassalizado"
 stewardship_duty.4011-4.b.tt:0 "Permaneço na [targeting_faction.GetName]"
 stewardship_duty.4011-4.b:0 "Eu não serei desviado de meu caminho!"
 stewardship_duty.4011-4.desc.start:0 "[my_liege.GetTitledFirstName] se aproximou de mim, alegando que minha associação com a [targeting_faction.GetName] tem causado dificuldades indevidas a [my_liege.GetSheHe], e que isso precisa parar."
 stewardship_duty.4011.a:0 "Uma transação justa."
 stewardship_duty.4011.desc:0 "\n\nNesse sentido, [my_liege.GetSheHe] me ofereceu uma bolsa pesada como incentivo para deixar a facção e direcionar minha atenção para outras áreas."
 stewardship_duty.4011.t:0 "Um Apelo à Ganância"
 stewardship_duty.4012.a:0 "Eu retribuirei o favor se você retribuir o meu!"
 stewardship_duty.4012.desc:0 "\n\n[my_liege.GetSheHe|U] implora para que eu veja as coisas do ponto de vista [my_liege.GetHerHim], e está me oferecendo favores em troca de encerrar meu apoio à facção."
 stewardship_duty.4012.t:0 "Um Apelo à Ambição"
 stewardship_duty.4013.a:0 "Contanto que [my_liege.GetSheHe] exalte minha [faction_member.Custom('quirk_pos_noun')], estou feliz."
 stewardship_duty.4013.desc:0 "\n\nNesse sentido, [my_liege.GetSheHe] se ofereceu para me elogiar publicamente pelo meu trabalho em outras áreas, fortalecendo minha reputação no [my_liege.GetPrimaryTitle.GetName]."
 stewardship_duty.4013.t:0 "Um Apelo ao Orgulho"
 stewardship_duty.4014.a:0 "Eu sirvo a [faction_member.GetFaith.HighGodName] ao servir [Select_CString( my_liege.IsFemale, 'a', 'o' )] [my_liege.GetTitledFirstNameNoTooltip]."
 stewardship_duty.4014.desc:0 "\n\n[my_liege.GetSheHe|U] então me lembra que [my_liege.GetSheHe] ocupa o trono pela vontade de [faction_member.GetFaith.HighGodName], e opor-se a [my_liege.GetSheHe] é opor-se a [faction_member.GetFaith.HighGodName]."
 stewardship_duty.4014.t:0 "Um Apelo à Piedade"
 stewardship_duty.4015.a:0 "Eu sabia que poderia fazer [faction_member.GetSheHe] ver a razão!"
 stewardship_duty.4015.desc:0 "Ao deixar bem claro o que [faction_member.GetSheHe] tem a ganhar sendo leal a mim, consegui convencer [Select_CString( faction_member.IsFemale, 'a', 'o' )] [faction_member.GetTitledFirstName] a abandonar seu apoio à [targeting_faction.GetName].\n\nAs queixas [faction_member.GetHerHim|U] eram simplesmente insignificantes em comparação ao que eu tinha a oferecer!"
 stewardship_duty.4015.t:0 "Vassalo Abandona a Facção"
 stewardship_duty.4019.a:0 "Por que [faction_member.GetSheHe] não vê os benefícios de se aliar a mim?"
 stewardship_duty.4019.desc:0 "Apesar de todos os meus esforços para convencer [faction_member.GetSheHe], [faction_member.GetTitledFirstName] se recusou a deixar a [targeting_faction.GetName] e [faction_member.GetSheHe] continua defendendo os interesses deles acima dos meus."
 stewardship_duty.4019.t:0 "Vassalo Apega-se à Facção"
 stewardship_duty.4020.desc.switch:0 "[faction_member.GetTitledFirstName] mudou de facção."
 stewardship_duty.4020.desc:0 "[faction_member.GetTitledFirstName] não faz mais parte de uma facção."
 stewardship_duty.4020.t:0 "Oferta Invalidada"
 stewardship_duty.4040.a:0 "Um incentivo suficiente comprará o consentimento [my_vassal.GetHerHim]."
 stewardship_duty.4040.b.failure:0 "[my_vassal.GetFirstNameNoTooltip] continua relutante em aceitar uma alteração no contrato"
 stewardship_duty.4040.b.success:0 "[my_vassal.GetFirstNameNoTooltip] é convencid[Select_CString( my_vassal.IsFemale, 'a', 'o' )] a aceitar uma alteração no contrato"
 stewardship_duty.4040.b:0 "Aposto que posso convencer [my_vassal.GetSheHe] a aceitar as mudanças."
 stewardship_duty.4040.c.failure:0 "[my_vassal.GetFirstNameNoTooltip] se recusa a aceitar uma alteração no contrato"
 stewardship_duty.4040.c.success:0 "[my_vassal.GetFirstNameNoTooltip] é coagid[Select_CString( my_vassal.IsFemale, 'a', 'o' )] a aceitar uma alteração no contrato"
 stewardship_duty.4040.c:0 "[my_vassal.GetSheHe|U] aceitará minhas alterações, ou então!"
 stewardship_duty.4040.contractchange:0 "Eu posso alterar o contrato d[Select_CString( my_vassal.IsFemale, 'a', 'o' )] [my_vassal.GetTitledFirstName] a meu favor."
 stewardship_duty.4040.d.tt:0 "#F [my_vassal.GetFirstNameNoTooltip] mantém seu contrato atual com a minha bênção:#!"
 stewardship_duty.4040.d:0 "Lealdade vale mais do que milícias."
 stewardship_duty.4040.desc:0 "M[Select_CString( my_vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', my_vassal)] [my_vassal.GetTitledFirstName] tem um contrato comigo que é bastante flexível, isentando [my_vassal.GetSheHe] de muitas das obrigações que normalmente esperaria de um dos meus vassalos.\n\nSe eu pudesse convencer [my_vassal.GetSheHe] a aceitar mais obrigações, isso beneficiaria grandemente o reino a longo prazo..."
 stewardship_duty.4040.t:0 "Alterando o Acordo"
 stewardship_duty.4041.a:0 "Eu sabia exatamente como convencer [my_vassal.GetSheHe]!"
 stewardship_duty.4041.desc:0 "Na tentativa de convencer [Select_CString( my_vassal.IsFemale, 'a', 'o' )] [my_vassal.GetTitledFirstName] a aceitar um contrato mais restritivo, sentei-me com [my_vassal.GetSheHe] e expliquei todas as razões pelas quais precisávamos atualizá-lo.\n\nInicialmente, [my_vassal.GetSheHe|U] estava relutante, mas depois de muita discussão, consegui fazer [my_vassal.GetSheHe] concordar que seria razoável fazer uma alteração em seu contrato."
 stewardship_duty.4042.a:0 "Terei que tentar uma abordagem diferente..."
 stewardship_duty.4042.desc:0 "Desde o início da nossa conversa, pude perceber que teria dificuldade em convencer [Select_CString( my_vassal.IsFemale, 'a', 'o' )] [my_vassal.GetTitledFirstName] a abrir mão dos direitos aos quais [my_vassal.GetSheHe] tem direito sob seu contrato.\n\nApesar de todos os meus esforços e apelos, [my_vassal.GetSheHe] se manteve firme, afirmando que se eu não consigo me contentar com o que [my_vassal.GetSheHe] atualmente me oferece, isso é culpa minha, não [my_vassal.GetHerHim]."
 stewardship_duty.4043.a:0 "$stewardship_duty.4041.a$"
 stewardship_duty.4043.desc:0 "Não foi uma negociação, foi uma exigência. Deixei claro para [Select_CString( my_vassal.IsFemale, 'a', 'o' )] [my_vassal.GetTitledFirstName] que [my_vassal.GetSheHe] continua detendo seus títulos apenas porque me agrada, e que se [my_vassal.GetSheHe] deseja permanecer ao meu lado, [my_vassal.GetSheHe] precisará fazer concessões.\n\n[my_vassal.GetSheHe|U] concordou apressadamente, aliviado por eu partir sem mais incidentes."
 stewardship_duty.4044.a:0 "$stewardship_duty.4042.a$"
 stewardship_duty.4044.desc:0 "[my_vassal.GetTitledFirstName] recusou minha exigência de que [my_vassal.GetSheHe] aceitasse um contrato mais restritivo.\n\n[my_vassal.GetSheHe|U] me disse que, mesmo eu sendo [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip] e [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] Governante desta terra, o contrato atual [my_vassal.GetHerHim] garante certos privilégios que eu não posso simplesmente retirar — pelo menos não legitimamente."
 stewardship_duty.4060.a.failure:0 "A facção não é influenciada por minhas palavras"
 stewardship_duty.4060.a.success.every_faction_member:0 "Cada membro da [targeting_faction.GetName|V]"
 stewardship_duty.4060.a.success:0 "Eu convenço a facção a mostrar união"
 stewardship_duty.4060.a:0 "Eu #EMP devo#! convencer o reino a se unir."
 stewardship_duty.4060.attempt.tt:0 "A decisão d[Select_CString( faction_leader.IsFemale, 'a', 'o' )] [faction_leader.GetTitledFirstNameNoTooltip] será baseada em sua personalidade"
 stewardship_duty.4060.b:0 "Uma quantia considerável convencerá [faction_leader.GetSheHe] a recuar..."
 stewardship_duty.4060.c:0 "[faction_leader.GetSheHe|U] não pode ser permitido agir de acordo com seus planos!"
 stewardship_duty.4060.d:0 "Não posso me preocupar com isso agora."
 stewardship_duty.4060.decline.tt:0 "Você ignora a facção por enquanto"
 stewardship_duty.4060.desc.default:0 "Mesmo no meio da guerra, [faction_leader.GetTitledFirstName] e seus apoiadores na [targeting_faction.GetName] estão dispostos a usar qualquer desculpa para avançar com sua agenda!"
 stewardship_duty.4060.desc.end:0 "\n\nCom minhas tropas e ouro sendo desperdiçados no campo de batalha, preciso analisar cuidadosamente quais opções tenho disponíveis para mitigar essa ameaça..."
 stewardship_duty.4060.desc.other_claim:0 "Mesmo no meio da guerra, [faction_leader.GetTitledFirstName] está dispost[Select_CString( faction_leader.IsFemale, 'a', 'o' )] a usar qualquer desculpa para apoiar a reivindicação d[Select_CString( targeting_faction.GetSpecialCharacter.IsFemale, 'a', 'o' )] [targeting_faction.GetSpecialCharacter.GetTitledFirstName] sobre o [targeting_faction.GetSpecialTitle.GetName]!"
 stewardship_duty.4060.desc.self_claim:0 "Mesmo no meio da guerra, [faction_leader.GetTitledFirstName] está dispost[Select_CString( faction_leader.IsFemale, 'a', 'o' )] a usar qualquer desculpa para reivindicar o [targeting_faction.GetSpecialTitle.GetName]!"
 stewardship_duty.4060.failure.tt:0 "[targeting_faction.GetName] não perde nenhum descontentamento"
 stewardship_duty.4060.t:0 "Organização de Facção"
 stewardship_duty.5021.a.message_1:0 "[cheater_vassal.GetFirstNameNoTooltip] paga o que me deve"
 stewardship_duty.5021.a.message_2:0 "Suspeito que [Select_CString( cheater_vassal.IsFemale, 'a', 'o' )] [cheater_vassal.GetFirstNameNoTooltip] ainda está retendo dinheiro"
 stewardship_duty.5021.a:0 "[Select_CString( cheater_vassal.IsFemale, 'A', 'O' )] [cheater_vassal.GetTitleAsNameNoTooltip] deve pagar o que deve."
 stewardship_duty.5021.b:0 "A partir de agora, vou manter [cheater_vassal.GetSheHe] sob rédea curta!"
 stewardship_duty.5021.c:0 "Quem nunca tentou encher os próprios bolsos?"
 stewardship_duty.5021.desc:0 "Estou analisando minuciosamente os registros que detalham minha renda proveniente dos vassalos. Esses números não batem... [Select_CString( cheater_vassal.IsFemale, 'A', 'O' )] [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('cheater_vassal'))] [cheater_vassal.GetTitledFirstName] me tomou por tolo e tem pago menos do que deveria!"
 stewardship_duty.5021.t:0 "Vassalo Desleal"
 stewardship_duty.7001.a.desc_1:0 "[war_vassal.GetFirstNameNoTooltip] vê a sabedoria na paz"
 stewardship_duty.7001.a.desc_2:0 "[war_vassal.GetFirstNameNoTooltip] não ouve meus argumentos"
 stewardship_duty.7001.a:0 "Convencê-los a deixar de lado sua disputa."
 stewardship_duty.7001.b:0 "Isso é entre eles — não vou intervir."
 stewardship_duty.7001.c:0 "\"Você vai parar com essa loucura. #EMP Agora!#!\""
 stewardship_duty.7001.desc:0 "Meus dois vassalos, [war_vassal.GetTitledFirstName] e [Select_CString( war_vassal_2.IsFemale, 'a', 'o' )] [war_vassal_2.GetTitledFirstName], estão em guerra um com o outro. Essa '[war_scope.GetName]' está ameaçando desestabilizar meu reino, e devo agir rapidamente se quiser intervir."
 stewardship_duty.7001.t:0 "Vassalos em Guerra"
 stewardship_duty.7002.toast.invalid:0 "A [war_scope.GetName] terminou antes que eu pudesse intervir"
 stewardship_duty.7002.toast.peace:0 "[war_vassal.GetFirstName] e [Select_CString( war_vassal_2.IsFemale, 'a', 'o' )] [war_vassal_2.GetFirstName] concordaram com uma paz branca"
 stewardship_duty.7023.a.success:0 "[hook_holder.GetTitledFirstNameNoTooltip] aceita meu ouro em vez do favor que devo a [hook_holder.GetSheHe]"
 stewardship_duty.7023.a:0 "Oferecer a [hook_holder.GetSheHe] moedas para resolver a situação."
 stewardship_duty.7023.b:0 "Convencer [hook_holder.GetSheHe] a deixar o passado para trás."
 stewardship_duty.7023.c:0 "[hook_holder.GetSheHe|U] vai esquecer isso, ou então!"
 stewardship_duty.7023.d.tt:0 "Ainda devo um favor [Select_CString( hook_holder.IsFemale, 'a', 'ao' )] [hook_holder.GetTitledFirstName]."
 stewardship_duty.7023.d:0 "Um [ROOT.Char.GetHouse.GetBaseNameNoTooltip] sempre paga suas dívidas!"
 stewardship_duty.7023.desc:0 "O fato de dever um favor substancial [Select_CString( hook_holder.IsFemale, 'a', 'ao' )] [hook_holder.GetTitledFirstName] pesa sobre mim.\n\nSeria um grande alívio se eu pudesse resolver isso agora, em meus termos. Esperar [hook_holder.GetSheHe] exigir o favor poderia me colocar em uma situação difícil mais tarde."
 stewardship_duty.7023.failure:0 "[hook_holder.GetFirstNameNoTooltip] insiste que eu pague o favor que devo a [hook_holder.GetSheHe]"
 stewardship_duty.7023.invalidated.hook_holder:0 "Como [Select_CString( hooked_ruler.IsFemale, 'a', 'o' )] [hooked_ruler.GetTitledFirstName] não me deve mais um favor, o pedido [hooked_ruler.GetHerHim] para que eu o renuncie não é mais válido."
 stewardship_duty.7023.invalidated.hooked_ruler:0 "Como não devo mais um favor [Select_CString( hook_holder.IsFemale, 'a', 'ao' )] [hook_holder.GetTitledFirstName], meu pedido para que [hook_holder.GetSheHe] o renuncie não é mais válido."
 stewardship_duty.7023.player:0 "#weak Outro jogador sempre tem a opção de recusar, embora possa receber [stress|e] por fazê-lo.#!"
 stewardship_duty.7023.success:0 "Eu convenço [Select_CString( hook_holder.IsFemale, 'a', 'o' )] [hook_holder.GetFirstNameNoTooltip] a renunciar ao favor que devo a [hook_holder.GetSheHe]"
 stewardship_duty.7023.t:0 "Sobre Aquela Dívida..."
 stewardship_duty.7025.desc.diplomacy.failure:0 "Eu lhe devo um favor, mas prefiro não dever a ninguém. Quero dizer, quem quer dever um favor a alguém?\n\nE se você simplesmente... esquecesse o favor? Eu gostaria disso. Seria ótimo."
 stewardship_duty.7025.desc.diplomacy.success:0 "Estou escrevendo para discutir sobre aquele favor que eu lhe devia. Pessoas razoáveis concordarão que minhas ações passadas já satisfizeram minha obrigação.\n\nPortanto, sinto que não lhe devo mais um favor."
 stewardship_duty.7025.desc.gold:0 "Você já me prestou um grande serviço, e sou grato. Para retribuir o favor, gostaria de oferecer uma parte dos meus impostos deste ano.\n\nVocê considera tal oferta aceitável?"
 stewardship_duty.7025.desc.intimidation.failure:0 "Você parece estar sob a ilusão de que merece meu favor. Não devo nada a um[Select_CString( hook_holder.IsFemale, 'a', '' )] [hook_holder.Custom2('InsultNoun', SCOPE.sC('hooked_ruler'))] [hook_holder.Custom2('InsultAdjective', SCOPE.sC('hooked_ruler'))] como você! Esqueça isso, ou então."
 stewardship_duty.7025.diplomacy.a:0 "Um argumento convincente."
 stewardship_duty.7025.diplomacy.b:0 "O [hooked_ruler.GetSheHe] está falando sério?! De jeito nenhum!"
 stewardship_duty.7025.gold.a:0 "Eu aceito o ouro."
 stewardship_duty.7025.gold.b:0 "Favores valem mais do que moedas."
 stewardship_duty.7025.intimidation.a:0 "Não quero deixar [hooked_ruler.GetSheHe] zangado..."
 stewardship_duty.7025.intimidation.b:0 "Ameaças vazias não levarão [hooked_ruler.GetSheHe] a lugar nenhum!"
 stewardship_duty.7025.opening:0 "[hooked_ruler.Custom2('AppropriateGreeting', ROOT.Char)]"
 stewardship_duty.7025.refuse.tt:0 "[hooked_ruler.GetTitledFirstName] ainda me deve um favor"
 stewardship_duty.7025.stress.tt:0 "Estou inclinado a renunciar ao favor, então recusar é estressante"
 stewardship_duty.7027.a:0 "Finalmente, isso está resolvido."
 stewardship_duty.7027.b:0 "Isso poderia ter sido melhor."
 stewardship_duty.7027.desc.accepted.diplomacy:0 "Vejo a sabedoria em suas palavras. Não pense mais naquele favor do passado."
 stewardship_duty.7027.desc.accepted.gold:0 "Obrigado pelo seu presente. Considere sua dívida paga integralmente."
 stewardship_duty.7027.desc.accepted.intimidation:0 "Claro que vou perdoar sua dívida comigo. Isso nunca esteve em questão! Estou à sua mercê."
 stewardship_duty.7027.desc.refused.diplomacy:0 "Suas palavras rebuscadas são vazias assim como suas aparentes promessas. Ainda considero que você está em dívida comigo."
 stewardship_duty.7027.desc.refused.gold:0 "Sua obrigação vale mais do que ouro. Você ainda está em dívida comigo."
 stewardship_duty.7027.desc.refused.intimidation:0 "Você não me assusta. Você vai cumprir sua obrigação comigo, de um jeito ou de outro."
 stewardship_duty.7027.opening:0 "[hook_holder.Custom2('AppropriateGreeting', ROOT.Char)]"
 stewardship_duty_0001_mediation_success.tt:0 "[arguer_1.GetShortUIName|U] e [arguer_2.GetShortUIName] ganham [opinion|e] um do outro"
 stewardship_duty_special.1201.a.tt:0 "Você começa os preparativos imediatamente!"
 stewardship_duty_special.1201.a:0 "Uma empreitada valiosa."
 stewardship_duty_special.1201.b.tt:0 "Você não embarca na jornada"
 stewardship_duty_special.1201.b:0 "Este não é o momento para tal jornada."
 stewardship_duty_special.1201.continue_tooltip:0 "Minha pesquisa continua."
 stewardship_duty_special.1201.desc:0 "Meu [steward.GetCouncilTitle], [Select_CString( steward.IsFemale, 'a', 'o' )] [steward.GetTitledFirstName], está propondo uma busca que [steward.GetSheHe] afirma ser benéfica para o [ROOT.Char.Custom('RealmType')].\n\n[steward.GetSheHe|U] acha que eu deveria viajar com minha comitiva para mapear os territórios d[Select_CString( painting_land_owner.IsFemale, 'a', 'o' )] [painting_land_owner.GetTitledFirstName]. Eu conheceria melhor meu reino, e [Select_CString( steward.IsFemale, 'a', 'o' )] [steward.GetFirstNameNoTooltip] acredita que eu ganharia uma compreensão mais profunda [Select_CString( painting_land_owner.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('painting_land_owner'))]."
 stewardship_duty_special.1201.t:0 "Mapeando Territórios"
 stewardship_duty_special.1202.a.tt:0 "Começo a mapear a área."
 stewardship_duty_special.1202.a:0 "Espero aprender muito."
 stewardship_duty_special.1202.desc:0 "Conforme passamos para as terras d[Select_CString( painting_land_owner.IsFemale, 'a', 'o' )] [painting_land_owner.GetTitledFirstName], somos recebidos por um [painting_land_owner.Custom('MountedWarriorTerm')] e sua comitiva.\n\n\"[painting_land_owner.GetTitledFirstName] lhe dá as boas-vindas, meu [ROOT.Char.Custom('my_title')]. Você é mais do que bem-vindo para permanecer nestas terras pelo tempo que precisar.\""
 stewardship_duty_special.1203.a:0 "Não deixe nenhum criminoso vivo!"
 stewardship_duty_special.1203.b:0 "Pare! Pagaremos por passagem segura!"
 stewardship_duty_special.1203.desc:0 "A estrada parecia tão tranquila, mas é isso que a torna tão boa para uma emboscada, não é mesmo?\n\nOs bandidos saíram correndo de trás de uma colina, flechas e ordens enchendo de repente o ar."
 stewardship_duty_special.1204.a.tt:0 "Minha jornada está levemente atrasada."
 stewardship_duty_special.1204.a:0 "Este é um bom lugar para acampar por um tempo."
 stewardship_duty_special.1204.b:0 "Continuamos rapidamente."
 stewardship_duty_special.1204.desc:0 "Acampamos uma noite à beira [painting_land_owner.Custom('IndefiniteBodyOfWater')]. Meus súditos acordam renovados ao som dos pássaros e à suave névoa sobre as águas."
 stewardship_duty_special.1205.a:0 "\"Eu sou seu senhor e governante, mestre desta terra!\""
 stewardship_duty_special.1205.b:0 "Deveria aprender sobre a vida como um camponês aqui."
 stewardship_duty_special.1205.desc:0 "Os camponeses cuidando do campo à beira da estrada provavelmente nunca tinham visto uma passagem tão majestosa como a que eu liderava.\n\n\"Quem é este?\" Ouvi um deles perguntando ao outro."
 stewardship_duty_special.1206.a:0 "Peça um tour pelo [local_baron.Custom('FortifiedBuilding')]."
 stewardship_duty_special.1206.b:0 "Convide [Select_CString( local_baron.IsFemale, 'a', 'o' )] [local_baron.GetTitledFirstNameNoTooltip] para jantar comigo hoje à noite."
 stewardship_duty_special.1206.desc:0 "Vi vários fortes pela região, em várias posições defensivas entre o terreno variado. Em uma manhã, enquanto nos aproximamos de um deles, vejo [Select_CString( local_baron.IsFemale, 'a', 'o' )] [local_baron.GetTitleAsNameNoTooltip] local conduzindo a alimentação dos cavalos do lado de fora dos portões [local_baron.GetHerHim]."
 stewardship_duty_special.1207.a:0 "Insisto em pagar pelo quarto e comida."
 stewardship_duty_special.1207.b:0 "O estalajadeiro ficará honrado em receber [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]!"
 stewardship_duty_special.1207.desc:0 "Semanas na estrada podem deixar qualquer [ROOT.Char.GetWomanMan] cansad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. É, portanto, uma bênção quando finalmente encontramos uma pousada que parece ter luxos como uma cama de verdade. Pode até ter espaço para animais maiores do que ratos."
 stewardship_duty_special.1208.a:0 "Enviarei mensagens ao meu cartógrafo em pequenas tigelas!"
 stewardship_duty_special.1208.b:0 "Se esses barrancos de lama fossem nivelados, poderiam se tornar um solo cultivável..."
 stewardship_duty_special.1208.desc:0 "As terras d[Select_CString( painting_land_owner.IsFemale, 'a', 'o' )] [painting_land_owner.GetTitledFirstName] são cortadas por riachos e rios, pontes improvisadas e passagens a vau tornando a maioria dos caminhos. Certamente essas águas calmas poderiam ser mais úteis do que isso?"
 stewardship_duty_special.1281.a:0 "Essas informações são úteis para guardar só para mim."
 stewardship_duty_special.1281.b:0 "[painting_land_owner.GetTitledFirstNameNoTooltip] deve ouvir minhas descobertas."
 stewardship_duty_special.1281.end:0 "\n\nTambém foi uma pesquisa interessante sobre cidades e vilarejos, bem como as pessoas que percorrem essas partes do [ROOT.Char.Custom('RealmType')]."
 stewardship_duty_special.1281.opening:0 "Colinas e vales, planícies e lagos, estradas e caminhos florestais. Já vi tudo isso no reino d[Select_CString( painting_land_owner.IsFemale, 'a', 'o' )] [painting_land_owner.GetTitledFirstName], e meus cartógrafos têm anotado e desenhado carvões avidamente cada nova visão."
 stewardship_duty_special.1282.a:0 "Nunca se sabe quando isso pode ser útil."
 stewardship_duty_special.1282.b:0 "[painting_land_owner.GetFirstNameNoTooltip] deve renovar suas defesas... assim como eu!"
 stewardship_duty_special.1282.end:0 "\n\nTambém fizemos anotações sobre fortes em estado de deterioração e formações naturais excepcionalmente defensáveis."
 stewardship_duty_special.1283.a:0 "Ninguém conhece a geografia dessa terra melhor do que eu, agora."
 stewardship_duty_special.1283.b:0 "Meus generais encontrarão um bom uso para eles."
 stewardship_duty_special.1283.end:0 "\n\nO nível de detalhe que meus cartógrafos alcançaram com esses mapas é surpreendente. Nenhum caminho parece ter passado despercebido, e eles estão repletos de anotações detalhadas sobre o terreno."
 stewardship_duty_special.1284.a:0 "Talvez possam ser úteis para mensageiros?"
 stewardship_duty_special.1284.b:0 "Considerarei as implicações militares disso."
 stewardship_duty_special.1284.end:0 "\n\nFicou claro que há muitos lugares aqui que raramente veem pessoas, se é que pés humanos já pisaram nesses terrenos."
 stewardship_duty_special.1285.a:0 "Ainda há muito para aprender sobre a terra que pisamos."
 stewardship_duty_special.1285.b:0 "Se encorajarmos colonos lá e drenarmos o terreno aqui..."
 stewardship_duty_special.1285.end:0 "\n\nHá tanto para aprender sobre o solo que pisamos. Há muita coisa a ser descoberta."
 stewardship_duty_special.1286.a:0 "Esse conhecimento será de grande utilidade."
 stewardship_duty_special.1286.b:0 "Eu sou tão [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetLadyLord] dessas terras quanto de qualquer outra!"
 stewardship_duty_special.1286.end:0 "\n\nTenho um novo apreço pelas nuances do meu reino. Quem diria que as coisas seriam tão diferentes de [capital.GetNameNoTier]?"
 stewardship_duty_special.2001.a:0 "Mediar entre esses dois certamente será um desafio!"
 stewardship_duty_special.2001.b:0 "Isso é um assunto para meu [ROOT.Char.GetCouncillor('councillor_chancellor').GetCouncilTitle]."
 stewardship_duty_special.2001.c:0 "\"Você se atreve a me incomodar com essas trivialidades?!\""
 stewardship_duty_special.2001.desc:0 "A inimizade entre meus vassalos [vassal_1.GetTitledFirstName] e [Select_CString( vassal_2.IsFemale, 'a', 'o' )] [vassal_2.GetTitledFirstName] é lendária, e chegou a um ponto em que os outros nobres do reino solicitaram que eu interviesse.\n\nDisputas de fronteira, direitos de impostos, histórico familiar... Eles têm uma lista interminável de disputas, e até mesmo aqui na minha corte eles mal conseguem manter a civilidade."
 stewardship_duty_special.2001.t:0 "Resolução"
 stewardship_duty_special.2011.a:0 "Eu mediarei pessoalmente essas discussões."
 stewardship_duty_special.2011.b:0 "[titled_vassal_1.GetFirstNameNoTooltip] será compensad[Select_CString( titled_vassal_1.IsFemale, 'a', 'o' )] por qualquer perda."
 stewardship_duty_special.2011.c:0 "[titled_vassal_2.GetFirstNameNoTooltip] está #EMP muito#! ansios[Select_CString( titled_vassal_2.IsFemale, 'a', 'o' )] para que eu tome a decisão correta e justa..."
 stewardship_duty_special.2011.desc:0 "Eu pensei que a discussão já estava acalorada antes das mapas serem apresentados.\n\n[titled_vassal_1.GetTitledFirstName] e [Select_CString( titled_vassal_2.IsFemale, 'a', 'o' )] [titled_vassal_2.GetTitledFirstName] têm ilustrações de seus reinos, e cada ilustração mostra o mesmo ponto de travessia pertencendo a um deles. Nenhum deles parece disposto a ceder um palmo de terra.\n\nNunca vi um pergaminho causar tanta raiva, e está claro que um novo limite deve ser estabelecido."
 stewardship_duty_special.2011.t:0 "Resolução: Disputa de Terras"
 stewardship_duty_special.2012.a.failure:0 "Platitudes Vazias"
 stewardship_duty_special.2012.a.success:0 "Palavras Sábias"
 stewardship_duty_special.2012.a:0 "A família deve nos unir, não nos separar."
 stewardship_duty_special.2012.b:0 "Parece que há grandeza em sua família."
 stewardship_duty_special.2012.c.major_progress:0 "Eu aproximei os brigões, aumentando significativamente a chance de um resultado positivo"
 stewardship_duty_special.2012.c:0 "Eu sei como resolver brigas familiares!"
 stewardship_duty_special.2012.desc:0 "As discussões do dia entre [Select_CString( titled_vassal_1.IsFemale, 'a', 'o' )] [titled_vassal_1.GetTitledFirstName] e [Select_CString( titled_vassal_2.IsFemale, 'a', 'o' )] [titled_vassal_2.GetTitledFirstName] não começaram bem.\n\n\"Desde que você recebeu o escudo do avô...\"-\n\"O escudo de novo, sério? Aqui, na corte do [ROOT.Char.GetTitle]?!\""
 stewardship_duty_special.2012.t:0 "Resolução: Disputa Familiar"
 stewardship_duty_special.2013.a:0 "Se vocês não conseguem decidir, o dízimo reverte para [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]."
 stewardship_duty_special.2013.b:0 "A tradição tem precedência aqui."
 stewardship_duty_special.2013.c:0 "O proprietário da terra fica com o imposto, não importa quem a colonizou."
 stewardship_duty_special.2013.desc:0 "[titled_vassal_1.GetTitledFirstName] afirma que [Select_CString( titled_vassal_2.IsFemale, 'a', 'o' )] [titled_vassal_2.GetTitledFirstName] está negando seu direito de cobrança de impostos.\n\n\"De jeito nenhum!\" protesta [Select_CString( titled_vassal_1.IsFemale, 'a', 'o' )] [titled_vassal_1.GetFirstName]. \"A família em questão está do meu lado da fronteira há gerações. Um único campo do outro lado não lhe rende um dízimo completo!\""
 stewardship_duty_special.2013.t:0 "Resolução: Direitos de Impostos"
 stewardship_duty_special.2014.a:0 "[betrothal_candidate.GetTitledFirstNameNoTooltip] será casad[Select_CString( betrothal_candidate.IsFemale, 'a', 'o' )] com [Select_CString( vassal_1_betrothal_candidate.IsFemale, 'a', 'o' )] [vassal_1.Custom2('RelationToMe', SCOPE.sC('vassal_1_betrothal_candidate'))] [vassal_1.GetFirstNameNoTooltip]."
 stewardship_duty_special.2014.b:0 "Um noivado será feito com [Select_CString( vassal_2_betrothal_candidate.IsFemale, 'a', 'o' )] [titled_vassal_2.Custom2('RelationToMe', SCOPE.sC('vassal_2_betrothal_candidate'))] d[Select_CString( titled_vassal_2.IsFemale, 'a', 'o' )] [titled_vassal_2.GetFirstNameNoTooltip]."
 stewardship_duty_special.2014.c:0 "Essa briga fez com que ambos perdessem o direito!"
 stewardship_duty_special.2014.desc:0 "\"[Select_CString( betrothal_candidate.IsFemale, 'A', 'O' )] [betrothal_candidate_lord.Custom2('RelationToMe', SCOPE.sC('betrothal_candidate'))] d[Select_CString( betrothal_candidate_lord.IsFemale, 'a', 'o' )] [betrothal_candidate_lord.GetTitledFirstName] foi prometid[Select_CString( betrothal_candidate.IsFemale, 'a', 'o' )] [Select_CString( vassal_1_betrothal_candidate.IsFemale, 'a minha', 'ao meu' )] [titled_vassal_1.Custom2('RelationToMe', SCOPE.sC('vassal_1_betrothal_candidate'))] desde que—\" começa [Select_CString( titled_vassal_1.IsFemale, 'a', 'o' )] [titled_vassal_1.GetTitledFirstName], antes de ser interrompido previsivelmente [Select_CString( titled_vassal_2.IsFemale, 'pela', 'pelo' )] [titled_vassal_2.GetTitledFirstName].\n\n\"[betrothal_candidate.GetTitledFirstName] estava destinad[Select_CString( betrothal_candidate.IsFemale, 'a', 'o' )] a se casar com [Select_CString( vassal_2_betrothal_candidate.IsFemale, 'a minha', 'o meu' )] [titled_vassal_2.Custom2('RelationToMe', SCOPE.sC('vassal_2_betrothal_candidate'))]!\""
 stewardship_duty_special.2014.t:0 "Resolução: Noivado"
 stewardship_duty_special.2015.a:0 "Esse ladrão será executado, e a questão será anulada."
 stewardship_duty_special.2015.b:0 "Se [Select_CString( vassal_2.IsFemale, 'a', 'o' )] [vassal_2.GetFirstNameNoTooltip] tem o direito de julgamento, isso é tudo o que importa."
 stewardship_duty_special.2015.c:0 "Meu [ROOT.Char.GetCouncillor('councillor_chancellor').GetCouncilTitle] realizará um julgamento para esse ladrão insignificante."
 stewardship_duty_special.2015.desc:0 "\"Houve uma vez em que [Select_CString( vassal_2.IsFemale, 'a', 'o' )] [vassal_2.GetTitledFirstName] abrigou um ladrão conhecido!\" acusa [Select_CString( vassal_1.IsFemale, 'a', 'o' )] [vassal_1.GetTitledFirstName].\n\n\"Por [vassal_2.GetFaith.HighGodName]!\" [vassal_2.GetFirstName] obviamente já ouviu isso antes. \"Você não tem o direito de julgar meus súditos, em meu reino!\"\n\n\"Simplesmente porque ele conseguiu escapar antes—\"\n\nEles rapidamente se calam quando eu levanto minha mão e lembro-os da minha presença."
 stewardship_duty_special.2015.t:0 "Resolução: Julgamento"
 stewardship_duty_special.2018.a:0 "As origens devem ser respeitadas, com certeza?"
 stewardship_duty_special.2018.b:0 "Eles não são de [barony_1.GetNameNoTier] nem de [barony_2.GetNameNoTier], mas de [new_name.GetNameNoTier]!"
 stewardship_duty_special.2018.c:0 "Parece que talvez precisemos de uma taxa oficial de inspeção de cavalos."
 stewardship_duty_special.2018.desc:0 "[vassal_1.GetTitledFirstName] tem mais uma reclamação hoje, é claro. \"Os cavalos criados em [barony_1.GetNameNoTier] têm sido famosos por muito tempo, mas agora os mercadores de [barony_2.GetNameNoTier] estão vendendo-os como se os tivessem criado! Em [barony_2.GetNameNoTier]!\"\n\n[vassal_2.GetTitledFirstName] contesta isso. \"Eles #EMP são#! criados lá! Os mercadores devem mentir sobre suas mercadorias?\""
 stewardship_duty_special.2018.t:0 "Resolução: Cavalos"
 stewardship_duty_special.2019.a:0 "O imposto em falta será cobrado e dividido igualmente."
 stewardship_duty_special.2019.b:0 "Vocês dois merecem ser feitos de tolos!"
 stewardship_duty_special.2019.c:0 "Execute o mestre de pedreira e queime a pedreira."
 stewardship_duty_special.2019.d:0 "Isso é um crime contra [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip], e [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip] cuidará disso!"
 stewardship_duty_special.2019.desc:0 "[vassal_1.GetTitledFirstName] e [Select_CString( vassal_2.IsFemale, 'a', 'o' )] [vassal_2.GetTitledFirstName] têm listado queixas por horas a fio.\n\n\"... e então temos o mestre de pedreira na fronteira que se recusou a pagar impostos devido a um mandado de leniência #EMP que#! você ofereceu!\"\n\"O quê?! Você foi quem já havia tomado tudo o que eles tinham quando meus cobradores—\"\n\nEles finalmente param ao perceberem que ambos foram enganados."
 stewardship_duty_special.2019.t:0 "Resolução: A Pedreira"
 stewardship_duty_special.2021.a:0 "Eles são vassalos d[Select_CString( uninvited.IsFemale, 'a', 'o' )] [uninvited.GetFirstNameNoTooltip]. Eles devem fazer o que [uninvited.GetSheHe] exige."
 stewardship_duty_special.2021.b:0 "Ninguém deve ser negado um banquete!"
 stewardship_duty_special.2021.c:0 "Agora, vocês dois estão #EMP obrigados#! a comparecerem aos banquetes um do outro!"
 stewardship_duty_special.2021.desc:0 "[vassal_1.GetTitledFirstName] e [Select_CString( vassal_2.IsFemale, 'a', 'o' )] [vassal_2.GetTitledFirstName] têm todo tipo de queixa um contra o outro, desde as mais importantes até as mais insignificantes.\n\n\"[uninvited.GetFirstName] negou que os proprietários da sua terra comparecessem ao meu banquete de outono!\" reclama [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetFirstName].\n\n\"É claro, eu não quero que meus vassalos tragam mais pulgas para casa com eles.\""
 stewardship_duty_special.2021.t:0 "Resolução: O Banquete"
 stewardship_duty_special.2022.a:0 "Isso exige um pedido de desculpas público!"
 stewardship_duty_special.2022.b:0 "Essas brigas mesquinhas estão abaixo de vocês dois."
 stewardship_duty_special.2022.c:0 "Mas certamente foi realmente um elogio, se você pensar a respeito?"
 stewardship_duty_special.2022.desc:0 "\"[insulter.GetTitledFirstName] insultou [Select_CString( spouse.IsFemale, 'a minha', 'o meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] de forma extremamente ofensiva!\" [insultee.GetTitledFirstName] solta. \"Insinuando que [spouse.GetSheHe] compartilha a cama com porcos!\"\n\n[insulter.GetFirstName] permanece calm[Select_CString( insulter.IsFemale, 'a', 'o' )]. \"Às vezes, a verdade não é lisonjeira, [insultee.GetFirstName].\""
 stewardship_duty_special.2022.t:0 "Resolução: O Insulto"
 stewardship_duty_special.2025.a:0 "[hooked_vassal.GetFirstNameNoTooltip], há #EMP algo que você pode fazer por mim..."
 stewardship_duty_special.2025.b:0 "Essa não é a maneira de resolver as questões."
 stewardship_duty_special.2025.desc:0 "Dada a influência que tenho sobre [Select_CString( hooked_vassal.IsFemale, 'a', 'o' )] [hooked_vassal.GetTitledFirstName], eu poderia pedir que, independentemente do resultado da disputa [hooked_vassal.GetHerHim] com [Select_CString( other_vassal.IsFemale, 'a', 'o' )] [other_vassal.GetTitledFirstName], [hooked_vassal.GetSheHe] vai contar a todos quais foram os julgamentos justos e imparciais que eu passei."
 stewardship_duty_special.2025.t:0 "Resolução: Oportunidades"
 stewardship_duty_special.2026.a:0 "O que você fez... Isso exige olho por olho."
 stewardship_duty_special.2026.b:0 "Você se condenou a uma vida nas trevas."
 stewardship_duty_special.2026.c:0 "Vejo que a disputa está resolvida, então!"
 stewardship_duty_special.2026.desc:0 "Gritos e mãos ensanguentadas me cumprimentam. O cálice finalmente transbordou, e [Select_CString( killer.IsFemale, 'a', 'o' )] [killer.GetTitledFirstName] está de pé sobre o corpo d[Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetTitledFirstName], [killer.Custom('signature_weapon')] ainda em mãos.\n\n\"Essa é a única resolução justa que eu poderia obter.\""
 stewardship_duty_special.2026.t:0 "Resolução: Um Fim"
 stewardship_duty_special.2027.a:0 "Uma dinastia mais prestigiosa é mais importante."
 stewardship_duty_special.2027.b:0 "Um grande nome não é do que grandes [lower_prestige.Custom('WomenMen')] são feit[Select_CString( lower_prestige.IsFemale, 'as', 'os' )]."
 stewardship_duty_special.2027.c:0 "Nosso reino é construído a partir de todas as grandes dinastias."
 stewardship_duty_special.2027.desc:0 "As disputas entre [vassal_1.GetTitledFirstName] e [Select_CString( vassal_2.IsFemale, 'a', 'o' )] [vassal_2.GetTitledFirstName] duram para sempre, e aparentemente já duram há gerações.\n\nPais, avós, antepassados distantes, todos discutindo sobre um assunto ou outro. Será que há alguma maneira de quebrar essa corrente?"
 stewardship_duty_special.2027.t:0 "Resolução: Família"
 stewardship_duty_special.2071.a:0 "Um milagre se já vi um!"
 stewardship_duty_special.2071.desc:0 "Tem sido um processo exaustivo, mas [vassal_1.GetTitledFirstName] e [Select_CString( vassal_2.IsFemale, 'a', 'o' )] [vassal_2.GetTitledFirstName] não estão mais constantemente às gargantas um do outro.\n\nNa verdade, eles deixam minha corte com suas queixas resolvidas, tornando-se amigos recém-encontrados."
 stewardship_duty_special.2071.t:0 "Resolução: Novos Começos"
 stewardship_duty_special.2072.a:0 "Não é pouca coisa, se é que posso dizer!"
 stewardship_duty_special.2072.desc:0 "Quando [Select_CString( vassal_1.IsFemale, 'a', 'o' )] [vassal_1.GetTitledFirstName] e [Select_CString( vassal_2.IsFemale, 'a', 'o' )] [vassal_2.GetTitledFirstName] saem da minha corte — finalmente —, é sem nenhum ódio ou rancor que marcou sua chegada. Veremos se isso dura, mas por enquanto eles têm um novo respeito um pelo outro, graças aos meus esforços."
 stewardship_duty_special.2073.a:0 "Ah, deixe o ingrato partir."
 stewardship_duty_special.2073.desc:0 "\"Isso nunca seria uma mediação justa, não é?!\" [accuser.GetTitledFirstName] está profundamente chatead[Select_CString( accuser.IsFemale, 'a', 'o' )] enquanto [accuser.GetSheHe] sai da sala de audiências. \"O favoritismo exibido aqui é repugnante!\"\n\n[favorite.GetTitledFirstName] permanece calmo. \"Eu discordo disso, [ROOT.Char.Custom('FormOfAddressForLiege')].\""
 stewardship_duty_special.2073.t:0 "Resolução: Favoritismo"
 stewardship_duty_special.2074.a:0 "Minha mediação poderia ter sido melhor."
 stewardship_duty_special.2074.desc:0 "Quando [Select_CString( vassal_1.IsFemale, 'a', 'o' )] [vassal_1.GetTitledFirstName] e [Select_CString( vassal_2.IsFemale, 'a', 'o' )] [vassal_2.GetTitledFirstName] chegaram, eu não achava possível que eles pudessem se insultar mais e demonstrar mais amargura um com o outro. Como a partida deles me provou o quão errado eu estava."
 stewardship_duty_special.2074.t:0 "Resolução: Sempre Inamistoso"
 stewardship_duty_special.2081.a:0 "Com o tempo, seguimos em frente."
 stewardship_duty_special.2081.both_dead:0 "Com as mortes d[Select_CString( vassal_1.IsFemale, 'a', 'o' )] [vassal_1.GetTitledFirstName] e [Select_CString( vassal_2.IsFemale, 'a', 'o' )] [vassal_2.GetTitledFirstName], suas brigas mesquinhas parecem distantes, pequenas e sem sentido."
 stewardship_duty_special.2081.t:0 "Resolução: Um Fim"
 stewardship_duty_special.2081.tt:0 "Meus esforços de mediação chegam ao fim."
 stewardship_duty_special.2081.vassal_1:0 "Com a morte d[Select_CString( vassal_1.IsFemale, 'a', 'o' )] [vassal_1.GetTitledFirstName], as brigas e disputas que [vassal_1.GetSheHe] tinha com [Select_CString( vassal_2.IsFemale, 'a', 'o' )] [vassal_2.GetTitledFirstName] parecem pequenas, mesquinhas e sem sentido."
 stewardship_duty_special.2081.vassal_2:0 "Com a morte d[Select_CString( vassal_2.IsFemale, 'a', 'o' )] [vassal_2.GetTitledFirstName], as brigas e disputas que [vassal_2.GetSheHe] tinha com [Select_CString( vassal_1.IsFemale, 'a', 'o' )] [vassal_1.GetTitledFirstName] parecem pequenas, mesquinhas e sem sentido."
 stewardship_duty_special.2082.a:0 "Todos encontramos formas de resolver nossos conflitos."
 stewardship_duty_special.2082.desc:0 "Com [Select_CString( prisoner.IsFemale, 'a', 'o' )] [prisoner.GetTitledFirstName] pres[Select_CString( prisoner.IsFemale, 'a', 'o' )], a disputa entre [prisoner.GetSheHe] e [Select_CString( other.IsFemale, 'a', 'o' )] [other.GetTitledFirstName] parece muito menos importante."
 stewardship_duty_special.2082.t:0 "Resolução: Um Fim"
 story_diplomacy_lifestyle_mediation:0 "Mediação de Vassalos"
 story_diplomacy_lifestyle_mediation_desc:0 "Parte de construir laços de lealdade envolve resolver as disputas de vassalos conflituosos."
