l_spanish:
 small_religious_carving:0 "Pequena Escultura Religiosa"
 small_religious_carving_desc:0 "Esta é uma pequena, mas intrincada, escultura em estilo [stall_owner.GetFaith.GetReligion.GetAdjectiveNoTooltip] de um [stall_owner.GetFaith.ReligiousSymbol]."
 stewardship_wealth.1001.a.failure:0 "Não encontro nada que seja de ajuda"
 stewardship_wealth.1001.a.success:0 "Encontro várias dívidas esquecidas que posso cobrar"
 stewardship_wealth.1001.a:0 "Examine os registros para encontrar algo que possa ajudar!"
 stewardship_wealth.1001.b.givehook:0 "Vou dever um favor [Select_CString( wealthy_vassal.IsFemale, 'a', 'ao' )] [wealthy_vassal.GetTitledFirstNameNoTooltip] se [wealthy_vassal.GetSheHe] me ajudar."
 stewardship_wealth.1001.b.havehook:0 "Vou cobrar o favor que [Select_CString( wealthy_vassal.IsFemale, 'a', 'o' )] [wealthy_vassal.GetTitledFirstNameNoTooltip] me deve."
 stewardship_wealth.1001.c.tt:0 "Cada vassalo:"
 stewardship_wealth.1001.c:0 "Vou exigir tributos dos meus vassalos!"
 stewardship_wealth.1001.d:0 "Confisco propriedades religiosas para arrecadar fundos."
 stewardship_wealth.1001.desc:0 "Meu tesouro está vazio, minha despensa está vazia. Até os ratos foram vendidos para pagar minhas despesas, mas ainda assim não consigo pagar todas as dívidas que devo!\n\nComo posso sair dessa situação?"
 stewardship_wealth.1001.e:0 "Vou apertar o cinto e economizar o que posso."
 stewardship_wealth.1001.t:0 "Falência!"
 stewardship_wealth.1011.a:0 "Cunhar moedas de prata para facilitar o comércio."
 stewardship_wealth.1011.b:0 "Cunhar moedas de ouro com minha própria imagem!"
 stewardship_wealth.1011.c.failure:0 "Todos descobrem como as novas moedas são baratas"
 stewardship_wealth.1011.c.success:0 "Economizo uma fortuna ao cunhar as moedas desvalorizadas"
 stewardship_wealth.1011.c:0 "Desvalorizar a moeda com níquel barato."
 stewardship_wealth.1011.custom:0 "Cada condado no [THIS.Char.GetPrimaryTitle.GetName]"
 stewardship_wealth.1011.desc:0 "É meu direito e responsabilidade determinar qual moeda será usada em todo [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nAs escolhas que eu fizer determinarão como a moeda - e, por extensão, meu reino - será vista pelo mundo."
 stewardship_wealth.1011.t:0 "Cunhagem de Novas Moedas"
 stewardship_wealth.1021.a.custom:0 "Cada [county|E] em meu [domain|E]"
 stewardship_wealth.1021.a:0 "Aumentar os impostos sobre os camponeses."
 stewardship_wealth.1021.b.failure:0 "Acidentalmente corto despesas militares essenciais"
 stewardship_wealth.1021.b.success:0 "Melhoro a eficiência do meu orçamento militar"
 stewardship_wealth.1021.b:0 "Reduzir os gastos militares não essenciais."
 stewardship_wealth.1021.c.tt:0 "A guerra criará muitas oportunidades..."
 stewardship_wealth.1021.c:0 "As coisas vão se resolver no final. Sempre se resolvem."
 stewardship_wealth.1021.desc:0 "Guerras são caras, e a [current_war.GetName] não é diferente.\n\nCom meu tesouro se esvaziando rapidamente, preciso pensar em como pagarei para manter meus soldados no campo de batalha."
 stewardship_wealth.1021.t:0 "Pagando pela Guerra"
 stewardship_wealth.1022.a:0 "Nossos cofres realmente precisavam desse ganho... apenas tente não fazer isso novamente."
 stewardship_wealth.1022.b:0 "Não quero ser visto como um carniceiro! Usaremos isso para reparações."
 stewardship_wealth.1022.c:0 "Bom trabalho! Continuaremos fazendo o que quisermos."
 stewardship_wealth.1022.desc:0 "Meu [GetPlayer.Custom('KnightCultureNoTooltipLowercase')], [church_burner.GetName] se aproxima de mim, dando um relatório alegre de seu séquito:\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], após sua decisão acertada de deixar o financiamento da guerra a nosso critério, realizamos a pilhagem mais frutífera que o [ROOT.Char.GetLiege.GetPrimaryTitle.GetNameNoTier] já viu! Roubamos dezenas de ovelhas, saqueamos centenas de bugigangas e até incendiamos um [ROOT.Char.GetFaith.HouseOfWorship] com mil pessoas vivas dentro!\""
 stewardship_wealth.1022.t:0 "Pilhagem Sagrada"
 stewardship_wealth.1051.a.arrogant:0 "Um camponês instruído? Que novidade! Você #EMP deve#! entrar para a minha corte!"
 stewardship_wealth.1051.a:0 "Esqueça a agricultura, um[Select_CString( freeman.IsFemale, 'a', '' )] [freeman.GetWomanMan] como [freeman.GetSheHe] deveria estar na minha corte!"
 stewardship_wealth.1051.b:0 "Se [freeman.GetSheHe] puder me pagar em moedas de ouro, a terra será [freeman.GetHerHim]."
 stewardship_wealth.1051.d:0 "A terra em [target_county.GetNameNoTierNoTooltip] é minha e somente minha!"
 stewardship_wealth.1051.desc:0 "[freeman.GetFirstName], [Select_CString( freeman.IsFemale, 'uma camponesa', 'um camponês' )] livre que aluga parte das minhas terras em [target_county.GetNameNoTier], teve uma colheita excepcional nesta temporada devido ao planejamento meticuloso [freeman.GetHerHim].\n\n[freeman.GetSheHe|U] deseja usar parte dos lucros para comprar um pedaço das minhas terras para que [freeman.GetSheHe] possa construir em cima do seu sucesso e cultivar mais colheitas no próximo ano."
 stewardship_wealth.1051.t:0 "Fortuna do Camponês"
 stewardship_wealth.1061.a.failure:0 "O livro perdido era apenas um velho livro de contabilidade"
 stewardship_wealth.1061.a.success.bad:0 "Você adquire um [artifact|E] de livro antigo sem interesse"
 stewardship_wealth.1061.a.success.good:0 "Você adquire um [artifact|E] de livro muito bom "
 stewardship_wealth.1061.a.success:0 "O livro perdido contém uma grande riqueza de conhecimento"
 stewardship_wealth.1061.a:0 "Ouvi rumores sobre um livro perdido que foi redescoberto."
 stewardship_wealth.1061.b:0 "[vassal.GetTitledFirstNameNoTooltip] poderia precisar de ajuda para gerenciar suas propriedades."
 stewardship_wealth.1061.c:0 "Garantir esses acordos comerciais encherá meu tesouro."
 stewardship_wealth.1061.desc:0 "Durante a administração diária do meu [ROOT.Char.Custom('GetRealmOrDomicile')], tomei conhecimento de várias oportunidades que posso perseguir.\n\nCada oportunidade tem grande potencial, mas realisticamente só posso escolher uma delas - devo determinar qual delas me trará o maior valor."
 stewardship_wealth.1061.t:0 "Novas Aquisições"
 stewardship_wealth.2000.a.tt.failure:0 "Seu esquema foi descoberto"
 stewardship_wealth.2000.a.tt.success:0 "As pedras são trocadas sem que ninguém perceba"
 stewardship_wealth.2000.a:0 "Vamos trocar as pedras esta noite."
 stewardship_wealth.2000.b.tt.failure:0 "O novo sistema de pesagem é menos ideal"
 stewardship_wealth.2000.b.tt.success:0 "Você implementa com sucesso o novo sistema de pesagem"
 stewardship_wealth.2000.b.tt:0 "Embora seja difícil de alcançar, uma solução que beneficie tanto seus cofres quanto as necessidades dos comerciantes é definitivamente possível."
 stewardship_wealth.2000.b:0 "É preciso um conjunto de pesos realmente melhor."
 stewardship_wealth.2000.c.tt:0 "Você intimida diretamente os comerciantes locais a pagarem mais pelo privilégio de trazerem suas mercadorias através deste condado."
 stewardship_wealth.2000.c:0 "Pego o que é meu de forma tradicional!"
 stewardship_wealth.2000.desc:0 "Caminho pelas ruas de [loc_capital_county.GetNameNoTier] com meu [ROOT.GetCouncillorPosition( 'councillor_steward' ).GetPositionName], em busca de oportunidades para remediar o tesouro um tanto vazio. Quando chegamos aos salões de pesagem do mercado, [loc_steward.GetFirstName] começa a falar em voz baixa:\n\n\"Podemos silenciosamente aumentar nossa receita se formos... #EMP criativos #! com os impostos sobre as mercadorias trazidas aqui. Posso providenciar outro conjunto de pedras de pesagem, levemente ajustadas em peso, mas parecerão as mesmas. Então, pelas mesmas mercadorias, os comerciantes nos pagarão mais! Ninguém suspeitará de nada!\n\nSe desejar, podemos trocar as pedras e ver o dinheiro fluir para seus cofres!\""
 stewardship_wealth.2000.t:0 "Avaliando Oportunidades"
 stewardship_wealth.5001.a:0 "[capital.GetNameNoTierNoTooltip] prosperará com o rebanho."
 stewardship_wealth.5001.b.message_1:0 "Meu projeto de criação tem sucesso"
 stewardship_wealth.5001.b.message_2:0 "Meu projeto de criação falha"
 stewardship_wealth.5001.b:0 "É um belo rebanho, mas poderia ser maior..."
 stewardship_wealth.5001.c:0 "As peles renderão um bom lucro. Tragam o cutelo!"
 stewardship_wealth.5001.desc:0 "Como pagamento adicional em um comércio recente, me encontro em posse de um grande rebanho de gado.\n\nMe asseguraram que os animais são de alta qualidade, mas a questão de o que fazer com eles permanece."
 stewardship_wealth.5001.t:0 "Gado Animado"
 stewardship_wealth.5002.a.jeweler:0 "Investir na oficina do ourives."
 stewardship_wealth.5002.a.mason:0 "Investir na oficina do pedreiro."
 stewardship_wealth.5002.a.religious_sculptor:0 "Investir na oficina do escultor."
 stewardship_wealth.5002.a.smithy:0 "Investir na oficina do ferreiro."
 stewardship_wealth.5002.a.tavern:0 "Investir em uma taverna."
 stewardship_wealth.5002.b.failure.tt:0 "Você perde o dinheiro que investiu"
 stewardship_wealth.5002.b.failure:0 "Meu investimento falha"
 stewardship_wealth.5002.b.success:0 "[investor.GetFirstNameNoTooltip] e eu nos animamos com um ótimo investimento"
 stewardship_wealth.5002.c:0 "Obter um lucro rápido com algumas negociações inteligentes."
 stewardship_wealth.5002.end.desc:0 "ali. Suas mercadorias podem ser simples, mas seu potencial é grande.\""
 stewardship_wealth.5002.middle.desc:0 "um bom investimento - [investor.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] aparece de repente ao meu lado.\n\n\"Uma palavra de conselho, [ROOT.Char.Custom2('RelationToMeAddress', investor)]? Dê uma olhada na"
 stewardship_wealth.5002.risky_jeweler.desc:0 "barraca do ourives"
 stewardship_wealth.5002.risky_mason.desc:0 "oficina do pedreiro"
 stewardship_wealth.5002.risky_religious_sculptor.desc:0 "barraca do escultor"
 stewardship_wealth.5002.risky_smithy.desc:0 "oficina do ferreiro"
 stewardship_wealth.5002.safe_jeweler.desc:0 "ourives - filigrana requintada,"
 stewardship_wealth.5002.safe_mason.desc:0 "pedreiro - geometria perfeita,"
 stewardship_wealth.5002.safe_religious_sculptor.desc:0 "escultor - imagens [ROOT.Char.GetFaith.GetAdjectiveNoTooltip],"
 stewardship_wealth.5002.safe_smithy.desc:0 "ferreiro - bom aço,"
 stewardship_wealth.5002.start.desc:0 "Eu passeio entre as barracas do mercado de [capital.GetNameNoTooltip], uma bolsa pesada puxando meu cinto. Como faço esse dinheiro trabalhar para mim?\n\nEnquanto admiro as mercadorias de um "
 stewardship_wealth.5002.t:0 "Uma Palavra de Conselho"
 stewardship_wealth.6001.a.tt_high:0 "Você obtém uma escultura de alta qualidade"
 stewardship_wealth.6001.a.tt_low:0 "Você obtém uma escultura de baixa qualidade"
 stewardship_wealth.6001.a:0 "Vou comprar uma."
 stewardship_wealth.6001.b:0 "Duvido que essa barraca pague impostos, destruam-na!"
 stewardship_wealth.6001.c:0 "Vou conversar com [stall_owner.GetSheHe] e ver o que posso aprender sobre vendas."
 stewardship_wealth.6001.desc:0 "Enquanto viajo pelas terras [stall_county.Custom('TerrainTypeCountyScope')] de [stall_county.GetName], encontro uma barraca improvisada à beira do caminho.\n\nEnquanto paro para dar uma olhada, [Select_CString( stall_owner.IsFemale, 'uma camponesa chamada', 'um camponês chamado' )] [stall_owner.GetFirstName] entra em ação, tentando me convencer a comprar uma das pequenas esculturas em [stall_owner.GetFaith.ReligiousSymbol] que [stall_owner.GetSheHe] tem à venda.\n\n\"Faço todas elas à mão, [ROOT.Char.Custom('FormOfAddressForLiege')], cada uma leva horas de trabalho.\""
 stewardship_wealth.6001.t:0 "Barraca à Beira da Estrada"
 stewardship_wealth.7000.a:0 "Ai d[Select_CString( victim.IsFemale, 'a', 'o' )] [victim.Custom2('InsultAdjective', ROOT.Char)] d[Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetFirstNameNoTooltip]!"
 stewardship_wealth.7000.b.tt:0 "Bode expiatório, confundir a verdade, pequenos reembolsos: qualquer coisa para amortecer as acusações de tirania"
 stewardship_wealth.7000.b:0 "Posso justificar essa extorsão."
 stewardship_wealth.7000.c.tt:0 "Com sua influência e a [victim.GetHerHim], você libertará os melhores executores que um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] poderia desejar!"
 stewardship_wealth.7000.c:0 "Leve essa riqueza. Traga-me mais."
 stewardship_wealth.7000.d.tt:0 "A vingança está errada e tal..."
 stewardship_wealth.7000.d:0 "Infelizmente... os bens roubados devem ser devolvidos."
 stewardship_wealth.7000.desc:0 "Com muita cerimônia satisfeita, meu $knight_culture_player_no_tooltip_lowercase$ [Select_CString( enforcer.IsFemale, 'a', 'o' )] [enforcer.GetTitledFirstName] bate com força um saco volumoso diante de mim.\n\n\"Olhe,\" [enforcer.GetSheHe] pede.\n\nEsvazio seu conteúdo: metal precioso, heranças, bugigangas.\n\n\"Eu #EMP convenci#! alguns dos camponeses d[Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetTitledFirstName] de que seus impostos eram destinados a você, meu senhor.\"\n\nÉ um bom influxo de recursos! E, ainda melhor - consigo imaginar o olhar raivoso no repugnante rosto d[Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetTitleAsNamePossessiveNoTooltip]."
 stewardship_wealth.7000.t:0 "Administração Desonesta"
 stewardship_wealth.7001.a.tt:0 "Envie seus executores às aldeias!"
 stewardship_wealth.7001.a:0 "Defendo o meu direito de receber pagamento."
 stewardship_wealth.7001.b.tt:0 "Isente as vítimas d[Select_CString( thieving_rival.IsFemale, 'a', 'o' )] [thieving_rival.GetFirstNameNoTooltip] do pagamento de impostos"
 stewardship_wealth.7001.b:0 "Minhas rixas pessoais não são do meu povo."
 stewardship_wealth.7001.desc:0 "Maldit[Select_CString( thieving_rival.IsFemale, 'a', 'o' )] [thieving_rival.GetTitledFirstName] e seus capangas ladrões! M[Select_CString( messenger.IsFemale, 'inha', 'eu' )] [messenger.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('messenger'))], gagueja ao me transmitir a mensagem de que, com desavergonhada audácia, aqueles bandidos coagiram os camponeses de [ROOT.Char.GetCapitalLocation.GetName] a entregarem riquezas que eram destinadas a mim!\n\nSeus funcionários já estão prontos para coletar nossos impostos habituais... mas já prevejo as viúvas lamentando, crianças passando fome e famílias pobres sendo despejadas de suas casas.\n\nMil maldições sobre a alma gananciosa d[Select_CString( thieving_rival.IsFemale, 'a', 'o' )] [thieving_rival.GetTitledFirstNamePossessiveNoTooltip]!"
 stewardship_wealth.7001.justification:0 "[thieving_rival.GetSheHe|U] espalha mentiras frágeis sobre os direitos [thieving_rival.GetHerHim] como meu senhor, mas eu sei que [thieving_rival.GetSheHe] pegou o que é meu..."
 stewardship_wealth.7001.t:0 "Além das Fronteiras"
 stewardship_wealth.7001.tt.crime_alert:0 "[victim.GetTitledFirstName] se lembrará disso"
 stewardship_wealth.7001.unleashed_knights:0 "[thieving_rival.GetSheHe|U] e seus seguidores, os vis ladrões, tornam-se cada vez mais infames a cada dia..."
