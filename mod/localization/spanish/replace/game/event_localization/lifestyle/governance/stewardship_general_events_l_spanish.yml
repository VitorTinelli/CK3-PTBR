l_spanish:
 stewardship_general.1054.a:0 "Essas 'evidências' são circunstanciais. Libere [witch.GetSheHe]."
 stewardship_general.1054.b:0 "[witch.GetSheHe|U] deve queimar por seus crimes contra [ROOT.Char.GetFaith.HighGodName]!"
 stewardship_general.1054.c:0 "Um [witch.Custom('MagicUserTerm')] você diz? Eu poderia usar um novo conselheiro."
 stewardship_general.1054.d.flavor:0 "...mas na realidade, leve [witch.GetSheHe] secretamente de volta para a minha corte!"
 stewardship_general.1054.d:0 "Encene uma execução elaborada para [witch.GetSheHe]..."
 stewardship_general.1054.desc:0 "Pano manchado de sangue... penas de corvo... poções com cheiro estranho. Essas são as provas apresentadas por um grupo de aldeões de [target_county.GetNameNoTier] como evidência de que [Select_CString( witch.IsFemale, 'a', 'o' )] [witch.GetFirstName] tem praticado [witch.Custom('MagicPracticeTerm')] em sua cabana nos arredores da vila.\n\nOs aldeões afirmam que as obras malignas [witch.GetHerHim] devem ser a causa de suas [witch.Custom('MagicSuperstitionTerm')] e estão pedindo pela execução [witch.GetHerHim]."
 stewardship_general.1054.t:0 "Acusações de [witch.Custom('MagicPracticeTerm')|U]"
 stewardship_general.2001.a.ignore_help:0 "Este deve ser um roubo."
 stewardship_general.2001.a:0 "Sinto-me com sorte."
 stewardship_general.2001.b.ignore_help:0 "Acredito que essa peça será a escolha mais lucrativa."
 stewardship_general.2001.b:0 "O detalhe desta bugiganga me intriga."
 stewardship_general.2001.c.chaplain:0 "Suas palavras soam sábias para mim, [helpful_councillor.GetFirstNameNoTooltip]."
 stewardship_general.2001.c.steward:0 "Confio em sua experiência na área, [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('helpful_councillor')) ]."
 stewardship_general.2001.d.irritable:0 "Eu disse #EMP não#!. Agora vá embora antes que #EMP eu te faça ir embora!#!"
 stewardship_general.2001.d:0 "Vamos seguir em frente."
 stewardship_general.2001.desc:0 "\n\nA barraca do comerciante está repleta de bugigangas e quinquilharias."
 stewardship_general.2001.desc_chaplain:0 "\n\n[Select_CString( helpful_councillor.IsFemale, 'Minha companheira', 'Meu companheiro' )] [helpful_councillor.GetShortUIName] para imediatamente em seu caminho, inclinando a cabeça e encarando atentamente algo na banca do comerciante. [helpful_councillor.GetSheHe|U] se aproxima e confidencia em voz baixa: 'Aquela “bugiganga” ali é claramente uma relíquia sagrada de tempos passados. Seria sábio adquirir tal artefato.'"
 stewardship_general.2001.desc_high_skill:0 "$stewardship_general.2001.desc$ Como um hábil negociante de produtos finos, algumas bugigangas chamam minha atenção no meio do excesso de bugigangas."
 stewardship_general.2001.desc_intro:0 "Enquanto estava em um passeio descontraído, o grito de um comerciante em particular se destaca no meio da agitação da rua.\n\n\"Saudações, [ROOT.Char.Custom('FormOfAddressForLiege')]! Tenho uma coleção requintada de mercadorias, se [ROOT.Char.Custom('FormOfAddressForLiege')] tiver a moeda...\""
 stewardship_general.2001.desc_steward:0 "\n\nEnquanto observo a infinidade de mercadorias na barraca, posso ouvir [helpful_councillor.GetShortUIName] murmurar: 'As gravuras naquela peça devem ser reais... e muito valiosas também!'. [helpful_councillor.GetSheHe|U] olha para mim com um sorriso triunfante."
 stewardship_general.2001.expensive_cost:0 "O comerciante te enganou"
 stewardship_general.2001.free:0 "Você faz um ótimo negócio"
 stewardship_general.2001.minor_cost:0 "Aquilo não foi um bom negócio"
 stewardship_general.2001.t:0 "Um Faro para o Lucro"
 stewardship_general.2001.tiny_cost:0 "Você é um negociador decente"
 stewardship_general.2001.trinket_artifact:0 "Você ganha uma [inventory_artifact|E] do tipo bugiganga #high #!"
 stewardship_general.2001.tt:0 "Trinket Recebido"
 stewardship_general.2002.a.high_stewardship:0 "Talvez eu possa te ensinar algumas estratégias."
 stewardship_general.2002.b.high_stewardship:0 "Era apenas um teste. #EMP Eu#! consegui o que queria."
 stewardship_general.2002.convince_failure:0 "$stewardship_general.2002.mentor_failure$"
 stewardship_general.2002.convince_success:0 "Ah sim, [bought_trinket.GetName] é um investimento muito melhor porque... "
 stewardship_general.2002.desc.intro:0 "Depois de passarmos pelas próximas duas barracas, "
 stewardship_general.2002.desc_impressed:0 "[helpful_councillor.GetTitledFirstNameNoTooltip] sorri para mim.\n\n\"Sim, muito bom mesmo! Eu não teria feito muito melhor sozinho.\"\n\n[helpful_councillor.GetSheHe|U] olha casualmente para as bugigangas na barraca ao nosso lado e me lança um olhar lateral de antecipação."
 stewardship_general.2002.desc_insulted:0 "[helpful_councillor.GetTitledFirstNameNoTooltip] me olha desaprovadoramente.\n\n\"Aquela foi... uma exibição interessante, certamente. Não tenho certeza qual era nosso objetivo, [ROOT.Char.Custom('FormOfAddressForLiege')], mas tenho certeza de que o comerciante conseguiu o que queria...\n\n[helpful_councillor.GetSheHe|U] continua andando à frente, marcando o fim de nossa conversa."
 stewardship_general.2002.desc_very_impressed:0 "[helpful_councillor.GetTitledFirstNameNoTooltip] puxa minha manga com entusiasmo.\n\n\"Por [ROOT.Char.GetFaith.HighGodName], aquela foi uma exibição deliciosa! Tanta eloquência! Mal se consegue acompanhar as frases meladas de mel na dança de barganha.\" \n\n[helpful_councillor.GetSheHe|U] me olha perplexo e com admiração."
 stewardship_general.2002.desc_very_insulted:0 "[helpful_councillor.GetTitledFirstNameNoTooltip] solta um resmungo antagonista.\n\n\"Qualquer pessoa de menor intelecto argumentaria que [bought_trinket.GetName] mal merece esse nome. Mas #EMP tenho certeza#! que fizemos a escolha certa aqui...\n\n[helpful_councillor.GetSheHe|U] está claramente descontente com minha exibição ruim anterior."
 stewardship_general.2002.impressed:0 "Aquilo foi uma boa negociação, não foi?"
 stewardship_general.2002.insulted:0 "O que está feito, está feito."
 stewardship_general.2002.mentor_failure:0 "[helpful_councillor.GetTitledFirstNameNoTooltip] não foi totalmente convencid[Select_CString( helpful_councillor.IsFemale, 'a', 'o' )]"
 stewardship_general.2002.mentor_success:0 "Vocês relembram os detalhes minuciosos da barganha a noite toda"
 stewardship_general.2002.t:0 "Uma Exibição Impressionante"
 stewardship_general.2002.t_failure:0 "Persuasão Mal-sucedida"
 stewardship_general.2002.t_insulting:0 "Uma Exibição Insultante"
 stewardship_general.2002.t_success:0 "Persuasão Bem-sucedida"
 stewardship_general.5011.a:0 "Você terá todos os recursos de que precisa!"
 stewardship_general.5011.b.message_1:0 "Você faz um ótimo negócio"
 stewardship_general.5011.b.message_2:0 "O construtor te engana"
 stewardship_general.5011.b:0 "Isso é realmente a melhor oferta que você pode me dar?"
 stewardship_general.5011.c:0 "Pare de desperdiçar meu tempo!"
 stewardship_general.5011.desc:0 "\"Se você está interessado em um lago de carpas, posso construir um incrível para você, [ROOT.Char.Custom('FormOfAddressForLiege')]!\"\n\nO construtor diante de mim tem boas credenciais, e meus cortesãos parecem muito empolgados com a perspectiva..."
 stewardship_general.5011.every_courtier:0 "Cada [courtier|E]"
 stewardship_general.5011.t:0 "Os Carpas"
 stewardship_general.5013.a:0 "[carp_food.GetFirstNameNoTooltip], afaste-se! Afaste-se de... NÃÃÃÃO!"
 stewardship_general.5013.desc:0 "Enquanto caminho pelos jardins, percebo m[Select_CString( carp_food.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('carp_food'))] [carp_food.GetTitledFirstName] sentad[Select_CString( carp_food.IsFemale, 'a', 'o' )] em uma pedra ao lado do lago das carpas. Inclinando-se sobre a borda, [carp_food.GetSheHe] passa os dedos pela água. Uma sombra se mexe abaixo da superfície..."
 stewardship_general.5013.t:0 "Feras do Profundo"
 stewardship_general.5041.a:0 "Mostre a [servant_character.GetSheHe] o que é verdadeira fome."
 stewardship_general.5041.b:0 "Prenda [servant_character.GetSheHe]."
 stewardship_general.5041.c:0 "Mostre misericórdia e conquiste a lealdade [servant_character.GetHerHim]."
 stewardship_general.5041.desc:0 "Um[Select_CString( servant_character.IsFemale, 'a', '' )] humilde [servant_character.Custom('lowly_servant_type')] tem roubado da minha [ROOT.Char.Custom('GetCourt')]!"
 stewardship_general.5041.desc_ending:0 "\n\n\"Por favor, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord], eu farei qualquer coisa que você pedir!\""
 stewardship_general.5041.desc_highgod:0 "[Select_CString( servant_character.IsFemale, 'A', 'O' )] [servant_character.GetWomanMan] se encolhe diante de mim, soluçando sobre crianças famintas e implorando por misericórdia em nome de [ROOT.Char.GetFaith.HouseholdGodName]."
 stewardship_general.5041.desc_other:0 "[Select_CString( servant_character.IsFemale, 'A', 'O' )] [servant_character.GetWomanMan] se encolhe diante de mim, soluçando sobre crianças famintas e implorando por misericórdia."
 stewardship_general.5041.t:0 "Servo Traidor"
 stewardship_general_2001_expensive_msg.desc:0 "Você foi enganado pelo comerciante"
 stewardship_general_2001_failure_msg.t:0 "Negociação Mal-sucedida"
 stewardship_general_2001_free_msg.desc:0 "Suas habilidades de negociação se mostraram excelentes"
 stewardship_general_2001_minor_msg.desc:0 "Suas habilidades de negociação foram ruins"
 stewardship_general_2001_success_msg.t:0 "Negociação Bem-sucedida"
 stewardship_general_2001_tiny_msg.desc:0 "Suas habilidades de negociação foram adequadas"
 stewardship_haggle_cheap_trinket_tt:0 "Você opta pelo trinket barato"
 stewardship_haggle_expensive_trinket_tt:0 "Você opta pelo trinket caro"
 stewardship_haggle_helpful_trinket_tt:0 "Você opta pelo trinket sugerido"
 stewardship_lifestyle_rank_up_indication:0 "Eu posso ganhar um [perk|E] no [stewardship_lifestyle|E]"
