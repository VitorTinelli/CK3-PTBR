l_spanish:
 stewardship_domain.1041.a.failure.tt:0 "As guildas em [guild_county.GetNameNoTier] não conseguiram chegar a um consenso sobre como lidar com a produção de ferro"
 stewardship_domain.1041.a.failure:0 "Não consigo fazer as guildas chegarem a um acordo"
 stewardship_domain.1041.a.success.tt:0 "As guildas em [guild_county.GetNameNoTier] agora estão cooperando para fortalecer a produção de armas"
 stewardship_domain.1041.a.success:0 "Eu faço com que as duas guildas trabalhem juntas"
 stewardship_domain.1041.a:0 "Ambos poderiam se beneficiar se cooperassem."
 stewardship_domain.1041.b.flavor:0 "...e a Guilda dos Ferreiros fornecerá armas gratuitas para minhas milícias!"
 stewardship_domain.1041.b:0 "Apenas os ferreiros podem distinguir um bom ferro de um ruim..."
 stewardship_domain.1041.c.flavor:0 "...e a Guilda dos Mercadores me pagará uma parte de seus lucros!"
 stewardship_domain.1041.c:0 "O comércio é claramente o domínio dos mercadores..."
 stewardship_domain.1041.d:0 "[guild_county.GetNameNoTierNoTooltip] é #EMP minha#!! Somente eu controlo o comércio lá!"
 stewardship_domain.1041.desc:0 "Tanto a Guilda dos Ferreiros quanto a Guilda dos Mercadores em [guild_county.GetName] enviaram um representante para se encontrar comigo. As duas guildas entraram em um impasse sobre o comércio de ferro bruto no condado e querem que eu arbitre a disputa.\n\nSecretamente, cada representante me ofereceu um acordo lucrativo com sua guilda na tentativa de me fazer tomar partido."
 stewardship_domain.1041.t:0 "Disputa entre Guildas"
 stewardship_domain.1042.a.failure:0 "A [guild_county.Custom('Governance_1041_GuildType')] se recusa a reduzir seus preços"
 stewardship_domain.1042.a.success:0 "Eu faço com que a [guild_county.Custom('Governance_1041_GuildType')] reduza seus preços"
 stewardship_domain.1042.a:0 "Negociar com eles para reduzir seus preços."
 stewardship_domain.1042.b:0 "Contanto que eles paguem os impostos adequados..."
 stewardship_domain.1042.c:0 "Se eles não jogarem limpo, não jogarão de jeito nenhum!"
 stewardship_domain.1042.desc:0 "A [guild_county.Custom('Governance_1041_GuildType')] em [guild_county.GetName] desenvolveu um controle absoluto sobre a venda de ferro lá.\n\nAgora, eles estão usando seu poder para cobrar preços exorbitantes por seus produtos, enriquecendo os mestres da guilda, mas afastando o comércio do condado."
 stewardship_domain.1042.t:0 "Guilda Dominante"
 stewardship_domain.1052.a:0 "Tenho bastante grão, caso eles se comprometam comigo..."
 stewardship_domain.1052.b:0 "Tenha compaixão por eles e abra meus armazéns de grãos."
 stewardship_domain.1052.c:0 "Ordene aos [ROOT.Char.Custom('DefaultPriestTitlePlural')] que lhes deem caridade."
 stewardship_domain.1052.d:0 "M[Select_CString( almoner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('almoner'))] distribuirá grãos para eles."
 stewardship_domain.1052.desc:0 "Pragas infestaram diversos celeiros em [target_county.GetName], destruindo as sementes armazenadas. Sem nada para plantar na próxima safra, os agricultores da região vieram até mim pedindo ajuda.\n\nDada a situação desesperadora, eles, sem dúvida, serão forçados a aceitar quaisquer termos que eu lhes oferecer."
 stewardship_domain.1052.t:0 "Infestação nos Celeiros"
 stewardship_domain.1053.a.failure:0 "O culpado continua a me evitar"
 stewardship_domain.1053.a.success:0 "Descubro o culpado e o levo à justiça"
 stewardship_domain.1053.a:0 "Investigar o assunto discretamente..."
 stewardship_domain.1053.c:0 "Assumir controle direto sobre a cobrança de impostos em [target_county.GetNameNoTierNoTooltip]."
 stewardship_domain.1053.d:0 "Execute todos eles e traga novos cobradores!"
 stewardship_domain.1053.desc:0 "Notei várias inconsistências e omissões nos registros de impostos de [target_county.GetNameNoTier]. Está claro que esses erros não podem ser simples enganos - alguém tem desviado fundos!\n\nInfelizmente, o rastro desse misterioso culpado é irregular o suficiente para que seja difícil para mim determinar exatamente qual cobrador de impostos é responsável."
 stewardship_domain.1053.t:0 "Cobrador de Impostos Corrupto"
 stewardship_domain.1073.a.failure:0 "Os camponeses se recusam a ser civilizados"
 stewardship_domain.1073.a.success:0 "Os camponeses adotam os costumes da cultura [me.GetCulture.GetNameNoTooltip]"
 stewardship_domain.1073.a:0 "Ensine-lhes a superioridade da cultura [me.GetCulture.GetNameNoTooltip]!"
 stewardship_domain.1073.c.warning:0 "Velocidade de Promoção Cultural: #N -75%#!"
 stewardship_domain.1073.c:0 "Não me importo se eles mantêm suas tradições estranhas."
 stewardship_domain.1073.d:0 "Os sentimentos dos camponeses são irrelevantes - eu sou o governante deles."
 stewardship_domain.1073.desc:0 "A maioria dos camponeses que vivem em [target_county.GetName] são descendentes de [target_ruler.GetCulture.GetName]. Orgulhosos de suas tradições, eles não veem com bons olhos o fato de terem que servir a um estrangeiro como eu, quando [Select_CString( target_ruler.IsFemale, 'minha vizinha', 'meu vizinho' )] [target_ruler.GetTitledFirstName] compartilha sua cultura e história."
 stewardship_domain.1073.t:0 "Choque Cultural"
 stewardship_domain.5031.a:0 "Lidar pessoalmente com os problemas."
 stewardship_domain.5031.b:0 "Aumentar os impostos como punição."
 stewardship_domain.5031.desc:0 "Estes são tempos tumultuados para [county.GetName]. Relatórios atrás de relatórios chegam detalhando o estado precário das coisas na área, e os camponeses começaram a murmurar sobre #EMP soluções alternativas#!..."
 stewardship_domain.5031.t:0 "Um Condado em Necessidade"
 stewardship_domain.6001.a:0 "Leve quantos camponeses precisar, [baron.GetFirstNameNoTooltip]!"
 stewardship_domain.6001.b:0 "Todo o condado de [county.GetNameNoTierNoTooltip] poderia fazer isso."
 stewardship_domain.6001.c:0 "Não, os campos de batalha precisarão de muitos corpos este ano!"
 stewardship_domain.6001.desc:0 "Há alguns meses, [baron.GetTitledFirstName] começou um esforço elaborado para drenar áreas pantanosas para o assentamento em [barony.GetNameNoTier]. Arados pesados e valas frescas tornam o solo firme, mas é um trabalho lento.\n\n[baron.GetFirstName] agora escreveu para meu [steward.GetCouncilTitle], solicitando uma redução nos deveres de seu exército. Ansioso para concluir as obras antes da próxima colheita, [baron.GetSheHe] espera recrutar soldados para trabalhar."
 stewardship_domain.6001.t:0 "Drenagem"
 stewardship_domain.6002.desc:0 "Há alguns meses, [baron.GetTitledFirstName] começou a desmatar as florestas de [barony.GetNameNoTier] para preparar o assentamento. Árvores são arrancadas, caminhos são abertos e o solo é drenado.\n\n[baron.GetFirstName] agora escreveu para [steward.GetCouncilTitle] [steward.GetFirstName], solicitando uma redução nos deveres de seu exército. Ansioso para concluir as obras antes da próxima colheita, [baron.GetSheHe] espera recrutar soldados para trabalhar."
 stewardship_domain.6002.t:0 "Desmatamento"
 stewardship_domain.6011.a:0 "Vou fazer um acordo com o mestre pedreiro."
 stewardship_domain.6011.b:0 "[steward.GetTitledFirstNameNoTooltip], conquiste a lealdade deles para mim!"
 stewardship_domain.6011.c:0 "Por que eu precisaria da ajuda deles, quando tenho servos?"
 stewardship_domain.6011.desc:0 "Uma guilda de pedreiros estabeleceu-se em [county.GetName]. Ter artesãos dedicados ao meu serviço pessoal pode ajudar a região a prosperar."
 stewardship_domain.6011.offer_tt:0 "Me oferecem:"
 stewardship_domain.6011.t:0 "Negociações com Pedreiros"
 stewardship_domain.6012.a:0 "Eu nem precisei recorrer a ameaças de violência!"
 stewardship_domain.6012.desc:0 "O líder dos pedreiros parecia relutante em fazer qualquer tipo de acordo em nome da guilda, até que eu apontei exatamente o quanto isso nos beneficiaria a ambos."
 stewardship_domain.6013.a:0 "\"Então temos um acordo.\""
 stewardship_domain.6013.b:0 "Certamente posso encontrar pedreiros mais baratos em outro lugar."
 stewardship_domain.6013.desc:0 "Depois de uma longa audiência, o mestre pedreiro não cederá mais.\n\n\"Por um preço mais baixo do que este, não é possível fazer.\""
 stewardship_domain.6014.a:0 "\"Eu entendo perfeitamente.\""
 stewardship_domain.6014.b:0 "O [county.GetTierAsNameNoTooltip|l] me serve, e as guildas também!"
 stewardship_domain.6014.desc:0 "\"Você insulta a mim e toda a minha profissão, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" O mestre pedreiro não está nada satisfeito com as ofertas que estou disposto a fazer. \"Na verdade, os preços estão subindo. Apenas o custo da mão de obra, é claro. Tenho certeza de que o [ROOT.Char.GetTitleTierName] entende.\""
 stewardship_domain.6015.a:0 "Mal eu poderia ter negociado melhor eu mesmo!"
 stewardship_domain.6015.desc:0 "O mestre pedreiro deve ter apreciado a companhia [Select_CString( steward.IsFemale, 'da minha', 'do meu' )] [steward.GetCouncilTitle] [steward.GetTitledFirstName], porque [steward.GetSheHe] retornou com um acordo dos pedreiros que até mesmo excede minhas demandas."
 stewardship_domain.6016.a:0 "Isso parece muito bom."
 stewardship_domain.6016.b:0 "Então eu fui um tolo por te enviar, [steward.GetFirstNameNoTooltip]!"
 stewardship_domain.6016.desc:0 "[steward.GetTitledFirstName] retornou com uma oferta da guilda de pedreiros.\n\n\"Eu examinei os registros deles, meu lorde. Não acredito que um acordo melhor possa ser feito.\""
 stewardship_domain.6017.a:0 "Eu tenho que me conformar com o que meus servos conseguem realizar."
 stewardship_domain.6017.b:0 "Então eu falarei com eles! Eu os ordenarei!"
 stewardship_domain.6017.desc:0 "\"As negociações não ocorreram... exatamente como planejado, meu lorde.\" M[Select_CString( steward.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('steward'))] soa apologeta. \"No entanto, eu tenho uma oferta, mesmo que a guilda dos pedreiros se recuse a falar comigo novamente.\""
 stewardship_domain_6011_bad_deal:0 "Um Acordo Desfavorável"
 stewardship_domain_6011_fair_deal:0 "Um Acordo Justo"
 stewardship_domain_6011_great_deal:0 "Um Grande Acordo"
 stewardship_domain_special.1001.a.tt:0 "O destino de [development_county.GetNameNoTier] estará em minhas mãos..."
 stewardship_domain_special.1001.a:0 "Investigar os problemas do condado."
 stewardship_domain_special.1001.b:0 "Reivindicar meus devidos impostos pela força!"
 stewardship_domain_special.1001.c:0 "Isso é responsabilidade d[Select_CString( county_holder.IsFemale, 'a', 'o' )] [county_holder.GetFirstNameNoTooltip], não minha."
 stewardship_domain_special.1001.desc:0 "Estes são tempos difíceis, e as terras de [county_holder.Custom2('MyCharacterIntroduction', ROOT.Char)] em [development_county.GetNameNoTier] sofreram mais do que a maioria.\n\nRelatório após relatório é trazido diante de mim detalhando a má colheita, e começo a me perguntar se receberei minha parte dos impostos deles este ano..."
 stewardship_domain_special.1001.t:0 "Colheita em [development_county.GetNameNoTier|U]"
 stewardship_domain_special.1002.a.failure:0 "[county_holder.GetTitledFirstName] não consegue resolver os problemas em [development_county.GetNameNoTier]"
 stewardship_domain_special.1002.a.success:0 "[county_holder.GetTitledFirstName] e eu aprendemos com os erros [county_holder.GetHerHim]"
 stewardship_domain_special.1002.a:0 "Responsabilizo você por isso, [county_holder.GetFirstNameNoTooltip]."
 stewardship_domain_special.1002.b.failure:0 "Não consigo resolver os problemas em [development_county.GetNameNoTier]"
 stewardship_domain_special.1002.b.success:0 "Conserto com sucesso os problemas em [development_county.GetNameNoTier]"
 stewardship_domain_special.1002.b:0 "Eu mesmo vou consertar isso, custe o que custar!"
 stewardship_domain_special.1002.c.tt:0 "Eu retiro [development_county.GetName] d[Select_CString( county_holder.IsFemale, 'a', 'o' )] [county_holder.GetTitledFirstName]"
 stewardship_domain_special.1002.c:0 "Você perdeu sua reivindicação sobre [development_county.GetNameNoTierNoTooltip]!"
 stewardship_domain_special.1002.desc.blaming:0 "\n\nUm[Select_CString( county_holder.IsFemale, 'a', '' )] [county_holder.GetTitledFirstName] frustrado está diante de mim, claramente estressado. \"Como esses camponeses puderam estragar tudo tão mal? Eles são cavadores de terra! É tudo o que eles fazem!\""
 stewardship_domain_special.1002.desc.repentant:0 "\n\nUm[Select_CString( county_holder.IsFemale, 'a', '' )] [county_holder.GetTitledFirstName] arrependido está diante de mim, torcendo as mãos. \"Por favor, [ROOT.Char.Custom2('RelationToMeAddress', county_holder)], me dê outra chance! Eu posso consertar isso, eu juro!\""
 stewardship_domain_special.1002.desc.uncaring:0 "\n\nUm[Select_CString( county_holder.IsFemale, 'a', '' )] [county_holder.GetTitledFirstName] de aparência entediada está diante de mim, aparentemente indiferente. \"Os camponeses vão resolver isso eventualmente. Eles sempre resolvem. Esse é o trabalho deles, não é?\""
 stewardship_domain_special.1002.desc:0 "Aparentemente, [development_county.GetName] foi vítima de má gestão. As terras não foram adequadamente limpas, as sementes foram plantadas fora de época e os pastos foram superpastejados."
 stewardship_domain_special.1003.a:0 "Conte-me tudo sobre como você fez isso!"
 stewardship_domain_special.1003.desc:0 "\"Obrigado por acreditar em mim, [ROOT.Char.Custom2('RelationToMeAddress', county_holder)]!\"\n\n[county_holder.Custom2('MyCharacterIntroduction', ROOT.Char)|U] conseguiu resolver a crise em que se encontrava. Às vezes, a melhor solução é confiar nas habilidades dos outros e aprender com eles!"
 stewardship_domain_special.1004.a:0 "Que tipo de [county_holder.GetTitleTierName] é [county_holder.GetSheHe]?!"
 stewardship_domain_special.1004.desc:0 "Os relatórios de [development_county.GetName] só se tornam mais desastrosos, e logo fica evidente que [Select_CString( county_holder.IsFemale, 'a', 'o' )] [county_holder.GetTitledFirstName] só piorou a situação."
 stewardship_domain_special.1005.a:0 "Este conhecimento será realmente útil!"
 stewardship_domain_special.1005.desc:0 "Enquanto observo [development_county.GetName] prosperar sob minha orientação, não consigo deixar de sentir orgulho do que conquistei. Se envolver ocasionalmente em tarefas de menor importância é uma boa maneira de aprender!"
 stewardship_domain_special.1006.a:0 "Bem, nem sempre posso ter sucesso..."
 stewardship_domain_special.1006.desc:0 "Não importa o que eu tente, [development_county.GetName] não consegue encontrar nenhum alívio. Não está tão mal quanto antes, mas estou perdido em relação a como resolver as tarefas restantes diante de mim."
 stewardship_domain_special.1101.a:0 "O alvará será concedido ao [second_barony.Custom('BaronyTownType')] em [second_barony.GetNameNoTierNoTooltip]."
 stewardship_domain_special.1101.all_goes_well:0 "Se tudo correr bem:"
 stewardship_domain_special.1101.b:0 "O [local_baron.GetFaith.HouseOfWorship] em [barony.GetNameNoTierNoTooltip] receberá o alvará."
 stewardship_domain_special.1101.c:0 "Use o campo para pastagem em vez disso."
 stewardship_domain_special.1101.desc:0 "Em [county.GetName] há um campo que seria perfeito para uma grande feira anual.\n\nDois nobres locais, [local_baron.GetTitledFirstName] e [Select_CString( second_local_baron.IsFemale, 'a', 'o' )] [second_local_baron.GetTitledFirstName], pedem a mim que sejam os detentores do alvará que permitiria a eles realizar a feira em meu nome."
 stewardship_domain_special.1101.t:0 "Feira em [county.GetNameNoTierNoTooltip|U]"
 stewardship_domain_special.1102.a.tt:0 "As pessoas apreciarão mais isso se a região estiver estável e próspera"
 stewardship_domain_special.1102.a:0 "Importaremos o máximo de seda que pudermos!"
 stewardship_domain_special.1102.b.tt:0 "As pessoas apreciarão mais isso se a região estiver em turbulência"
 stewardship_domain_special.1102.b:0 "Vamos focar nas colheitas cultivadas localmente!"
 stewardship_domain_special.1102.c.tt:0 "As pessoas apreciarão mais isso se o nível de desenvolvimento na área for baixo"
 stewardship_domain_special.1102.c:0 "As maravilhas tecnológicas estarão em destaque!"
 stewardship_domain_special.1102.desc:0 "[second_local_baron.GetTitledFirstName] me apresenta mercadorias de todo o mundo; tecidos dos recantos mais distantes da Rota da Seda, colheitas locais, maravilhas tecnológicas do oriente...\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], que mercadorias devemos promover para a nova feira?\""
 stewardship_domain_special.1103.a:0 "Você tem minha permissão para fazer isso anualmente a partir de agora."
 stewardship_domain_special.1103.desc_crops:0 "Abundância de alimentos para atrair os camponeses para o mercado e mercadorias de primeira classe em todas as barracas os mantiveram voltando — foi uma semana de celebração e comércio!"
 stewardship_domain_special.1103.desc_silk:0 "Belos tecidos de seda para atrair as pessoas abastadas de [county.GetNameNoTier] para o mercado, com os camponeses não muito atrás — foi uma semana de celebração e comércio!"
 stewardship_domain_special.1103.desc_technology:0 "Maravilhas tecnológicas que fascinam o povo, e mercadorias de primeira classe em todas as barracas — foi uma semana de celebração e comércio!"
 stewardship_domain_special.1104.a:0 "Um começo tumultuado, mas tenho certeza de que os locais podem lidar com isso agora!"
 stewardship_domain_special.1104.desc_crops:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], as colheitas estão ficando velhas e mofadas, o que faremos com tudo isso?\"\n\nAparentemente, a demanda por colheitas locais não foi alta na região, e [Select_CString( second_local_baron.IsFemale, 'a', 'o' )] [second_local_baron.GetTitledFirstName] ficou com muitas delas não vendidas."
 stewardship_domain_special.1104.desc_silk:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], o que faremos com toda essa seda?\"\n\nAparentemente, a demanda por seda não foi alta na região, e [Select_CString( second_local_baron.IsFemale, 'a', 'o' )] [second_local_baron.GetTitledFirstName] ficou com muitos tecidos caros não vendidos."
 stewardship_domain_special.1104.desc_technology:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], o que faremos com esses apetrechos?\"\n\nAparentemente, a demanda por tecnologia maravilhosa não foi alta na região, e [Select_CString( second_local_baron.IsFemale, 'a', 'o' )] [second_local_baron.GetTitledFirstName] ficou com muitas delas não vendidas."
 stewardship_domain_special.1105.a.tt:0 "As pessoas apreciarão mais isso se o fervor religioso delas for forte"
 stewardship_domain_special.1105.a:0 "Vamos honrar os santos locais ao focar em objetos religiosos!"
 stewardship_domain_special.1105.b.tt:0 "As pessoas apreciarão mais isso se a região estiver precisando de apoio"
 stewardship_domain_special.1105.b:0 "Traga o máximo de alimentos possível!"
 stewardship_domain_special.1105.c.tt:0 "As pessoas apreciarão mais isso se o fervor religioso delas for fraco"
 stewardship_domain_special.1105.c:0 "Se mostrarmos outras religiões, elas perderão sua novidade!"
 stewardship_domain_special.1105.desc:0 "[local_baron.GetTitledFirstName] me apresenta mercadorias de todo o mundo; objetos religiosos de cidades sagradas, alimentos cultivados pelos devotos do [local_baron.GetFaith.DevoteeMalePlural] e [local_baron.GetFaith.DevoteeFemalePlural] na área, maravilhas de religiões estrangeiras...\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], que mercadorias devemos promover para a nova feira?\""
 stewardship_domain_special.1106.a:0 "Você tem minha permissão para fazer isso anualmente a partir de agora."
 stewardship_domain_special.1106.desc_religious_food:0 "Os alimentos fornecidos pelos devotos do [local_baron.GetFaith.DevoteeMalePlural] e [local_baron.GetFaith.DevoteeFemalePlural] da área venderam quase melhor do que qualquer outra coisa na feira — foi uma semana de celebração piedosa e comércio!"
 stewardship_domain_special.1106.desc_religious_objects:0 "Objetos religiosos de cidades sagradas para fascinar e cativar as pessoas, e mercadorias de primeira classe em todas as barracas — foi uma semana de celebração piedosa e comércio!"
 stewardship_domain_special.1106.desc_religious_other:0 "Diante de religiões estrangeiras, as pessoas de [county.GetNameNoTier] rezaram e apreciaram sua comunidade mais do que o habitual — foi uma semana de celebração piedosa e comércio!"
 stewardship_domain_special.1107.a:0 "Um começo tumultuado, mas tenho certeza de que os locais podem lidar com isso agora!"
 stewardship_domain_special.1107.desc_religious_food:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], o que faremos com toda essa comida?\"\n\nAparentemente, as refeições preparadas pelos devotos do [local_baron.GetFaith.DevoteeMalePlural] e [local_baron.GetFaith.DevoteeFemalePlural] da área poderiam ter se beneficiado de alguma intervenção divina — quase nada foi vendido."
 stewardship_domain_special.1107.desc_religious_objects:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], o que faremos com esses objetos sagrados?\"\n\nAparentemente, os objetos sagrados não atraíram os piedosos na medida que eu esperava, e [Select_CString( local_baron.IsFemale, 'a', 'o' )] [local_baron.GetTitledFirstName] ficou com muitos deles não vendidos."
 stewardship_domain_special.1107.desc_religious_other:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], o que faremos com esses objetos blasfemos?\"\n\nOs itens estrangeiros apenas repeliram as pessoas — desencorajando-as a visitar o mercado. [local_baron.GetTitledFirstName] é logo instruído a queimá-los, mas o estrago já está feito."
 stewardship_domain_special.1301.a.peasant_leader_tt:0 "O projeto começa, supervisionado [Select_CString( peasant_leader.IsFemale, 'pela', 'pelo' )] [peasant_leader.GetTitledFirstName]"
 stewardship_domain_special.1301.a.steward_tt:0 "O projeto começa, supervisionado [Select_CString( steward.IsFemale, 'pela', 'pelo' )] [steward.GetTitledFirstName]"
 stewardship_domain_special.1301.a:0 "Faça acontecer."
 stewardship_domain_special.1301.b:0 "Meu intendente cuidará disso."
 stewardship_domain_special.1301.c.tt:0 "Elas são boas o suficiente para nós também!"
 stewardship_domain_special.1301.c:0 "Aquelas estradas eram boas o suficiente para nossos ancestrais!"
 stewardship_domain_special.1301.decrease_road_quality_1:0 "#V A Qualidade da Estrada#! diminui em #N 1#!"
 stewardship_domain_special.1301.desc:0 "que há uma necessidade desesperada de uma nova estrada para atravessar [project_county.GetName]. Muitas das estradas antigas estão deterioradas e até perigosas!\n\n[Select_CString( peasant_leader.IsFemale, 'Uma camponesa chamada', 'Um camponês chamado' )] [peasant_leader.GetTitledFirstName] foi indicado como líder natural do esforço de construção."
 stewardship_domain_special.1301.increase_road_progress_1:0 "#V O Progresso da Estrada#! aumenta em #P 1#!"
 stewardship_domain_special.1301.increase_road_progress_2:0 "#V O Progresso da Estrada#! aumenta em #P 2#!"
 stewardship_domain_special.1301.increase_road_quality_1:0 "#V A Qualidade da Estrada#! aumenta em #P 1#!"
 stewardship_domain_special.1301.increase_road_quality_2:0 "#V A Qualidade da Estrada#! aumenta em #P 2#!"
 stewardship_domain_special.1301.no_steward_opening:0 "Meus prefeitos informam-me"
 stewardship_domain_special.1301.steward_opening:0 "Meu [ROOT.Char.GetCouncillorPosition( 'councillor_steward' ).GetPositionName] [steward.GetTitledFirstName] informa-me"
 stewardship_domain_special.1301.t:0 "A Estrada"
 stewardship_domain_special.1311.a:0 "Então pegamos trabalhadores de ambas as vilas."
 stewardship_domain_special.1311.b:0 "Pagarei pelo trabalho lá eu mesmo."
 stewardship_domain_special.1311.c:0 "Se há incerteza, o feudo reverterá para mim!"
 stewardship_domain_special.1311.desc:0 "O trabalho na estrada em [project_county.GetNameNoTier] está progredindo, mas o trecho de terra atualmente sendo preparado vai além de uma colina, distante das vilas de ambos os lados.\n\nAmbas as vilas estão relutantes em fornecer trabalhadores, e há incerteza sobre quem realmente possui o feudo além da colina!"
 stewardship_domain_special.1311.t:0 "A Estrada: Um Feudo Distante"
 stewardship_domain_special.1312.a:0 "Ou eles podem contribuir para os meus cofres."
 stewardship_domain_special.1312.b:0 "Que ideia original... eu gosto disso!"
 stewardship_domain_special.1312.desc:0 "Mesmo antes de ser concluída, os comerciantes começaram a viajar pela nova estrada em [project_county.GetNameNoTier].\n\n[project_leader.GetTitledFirstName] sugere que aqueles que usam a estrada devem contribuir para sua construção."
 stewardship_domain_special.1312.t:0 "A Estrada: Uso Regular"
 stewardship_domain_special.1313.a:0 "Poste guardas ao longo da estrada."
 stewardship_domain_special.1313.b:0 "Não me importo. #EMP Termine. Minha. Estrada.#!"
 stewardship_domain_special.1313.desc:0 "Mesmo uma estrada inacabada tem salteadores, parece. [project_leader.GetTitledFirstName] está com problemas de suprimentos que nunca chegam e trabalhadores que têm medo de deixar suas vilas. Com essa taxa, a estrada em [project_county.GetNameNoTier] nunca será concluída."
 stewardship_domain_special.1313.t:0 "A Estrada: Salteadores"
 stewardship_domain_special.1314.a:0 "Não vale o esforço."
 stewardship_domain_special.1314.b:0 "Infelizmente, mas necessário."
 stewardship_domain_special.1314.end:0 "\n\nJá desgastada e danificada, [project_leader.GetTitledFirstName] afirma que os trabalhadores terão que voltar para reforçá-la antes que esteja concluída."
 stewardship_domain_special.1314.t:0 "A Estrada: Botas de Marcha"
 stewardship_domain_special.1314.war:0 "Com a guerra em andamento, as milícias estão usando as partes concluídas da estrada em [project_county.GetNameNoTier] para acelerar sua marcha."
 stewardship_domain_special.1315.a:0 "Envie-os para a linha de frente!"
 stewardship_domain_special.1315.b:0 "Eles marcharão conforme [Select_CString( project_leader.IsFemale, 'a', 'o' )] [project_leader.GetTitledFirstNameNoTooltip] os comanda."
 stewardship_domain_special.1315.end:0 "\n\nFelizmente, o uso intenso é exatamente o que é necessário para firmar o terreno! Com um pouco de sorte, a maioria das milícias pode voltar marchando também."
 stewardship_domain_special.1315.t:0 "A Estrada: Botas de Marcha"
 stewardship_domain_special.1316.a:0 "Isso ajudará a estrada."
 stewardship_domain_special.1316.b:0 "Isso ajudará meus bolsos."
 stewardship_domain_special.1316.desc:0 "Ao encontrar as partes já concluídas da nova estrada imensamente benéficas, a guilda de comerciantes em [project_county.GetNameNoTier] fez uma doação para expandir a estrada ainda mais."
 stewardship_domain_special.1316.t:0 "A Estrada: Melhoria Encomendada"
 stewardship_domain_special.1317.a:0 "De propriedade da coroa, é claro."
 stewardship_domain_special.1317.b:0 "Faça-os voltar para a estrada!"
 stewardship_domain_special.1317.desc:0 "A construção da estrada em [project_county.GetNameNoTier] sofreu um atraso. [project_leader.GetTitledFirstName] relata que os trabalhadores foram convencidos por um aspirante a dono de uma pousada. Para acalmar suas almas e a de outros viajantes, eles estão construindo uma taverna à beira da estrada."
 stewardship_domain_special.1317.t:0 "A Estrada: Uma Taverna"
 stewardship_domain_special.1318.a:0 "Expanda ainda mais a estrada!"
 stewardship_domain_special.1318.b:0 "As coisas estão indo exatamente como eu quero."
 stewardship_domain_special.1318.c:0 "Uma oportunidade perfeita para reduzir custos!"
 stewardship_domain_special.1318.desc:0 "De acordo com [Select_CString( project_leader.IsFemale, 'a', 'o' )] [project_leader.GetTitledFirstName], o trabalho na estrada em [project_county.GetNameNoTier] está indo bem.\n\n\"O terreno está mais firme e as áreas mais planas do que esperávamos, [ROOT.Char.Custom('FormOfAddressForLiege')]."
 stewardship_domain_special.1318.t:0 "A Estrada: Progresso"
 stewardship_domain_special.1319.a:0 "Podemos usar esse conhecimento em outro lugar?"
 stewardship_domain_special.1319.b:0 "Aprender com camponeses? A própria ideia é abominável."
 stewardship_domain_special.1319.desc:0 "Meu Administrador parece quase chocado. \"Tenho inspecionado a construção da estrada em [project_county.GetNameNoTier] e os trabalhadores camponeses são muito mais eficientes do que eu esperava... Até eu poderia aprender algumas coisas com eles."
 stewardship_domain_special.1319.t:0 "A Estrada: Ética de Trabalho"
 stewardship_domain_special.1320.a:0 "Confio no seu julgamento."
 stewardship_domain_special.1320.b:0 "É muito longe e muito caro. Faremos como planejei."
 stewardship_domain_special.1320.desc:0 "Não é frequente um camponês se dirigir diretamente a mim, mas [Select_CString( peasant_leader.IsFemale, 'a', 'o' )] [peasant_leader.GetTitledFirstName] relata sobre os esforços de construção em [project_county.GetNameNoTier].\n\n\"O plano para a estrada era passar por este campo, [Select_CString( ROOT.Char.IsFemale, 'minha senhora', 'meu senhor' )], mas eu conheço o tipo de solo com o qual estamos lidando. Talvez eu possa sugerir que - que mudemos o trajeto através da floresta próxima?\""
 stewardship_domain_special.1320.t:0 "A Estrada: Expertise d[Select_CString( peasant_leader.IsFemale, 'a', 'o' )] [peasant_leader.GetTitledFirstName]"
 stewardship_domain_special.1321.a:0 "Ouça seus superiores, camponês!"
 stewardship_domain_special.1321.b:0 "[peasant_leader.GetTitledFirstNameNoTooltip] parece saber o que é melhor..."
 stewardship_domain_special.1321.desc:0 "\"Eu continuo dizendo para eles passarem direto pelo campo, mas [Select_CString( peasant_leader.IsFemale, 'a', 'o' )] [peasant_leader.GetTitledFirstName] insiste em redirecioná-los pela floresta próxima!\" [steward.GetTitledFirstName] está visivelmente chateado com o trabalho na estrada em [project_county.GetNameNoTier].\n\nNo entanto, [peasant_leader.GetTitledFirstName] continua insistindo em sua abordagem. \"O solo no campo é irregular e não é denso o suficiente, [Select_CString( ROOT.Char.IsFemale, 'minha senhora', 'meu senhor' )]! A floresta é um caminho muito melhor.\""
 stewardship_domain_special.1321.t:0 "A Estrada: Falta de Expertise"
 stewardship_domain_special.1391.a:0 "[peasant_leader.GetTitledFirstNameNoTooltip] parece ser um substituto capaz."
 stewardship_domain_special.1391.b:0 "É hora d[Select_CString( steward.IsFemale, 'a', 'o' )] [steward.GetTitledFirstNameNoTooltip] assumir o comando."
 stewardship_domain_special.1391.desc:0 "Com [Select_CString( project_leader.IsFemale, 'a', 'o' )] [project_leader.GetTitledFirstName] fora, o trabalho na estrada em [project_county.GetNameNoTier] está sem direção clara. Se ela algum dia será concluída, alguém mais precisa assumir o comando."
 stewardship_domain_special.1391.t:0 "A Estrada: Liderança Ausente"
 stewardship_domain_special.1392.a:0 "Nada está completamente perdido."
 stewardship_domain_special.1392.desc:0 "Com a perda de [project_county.GetName], terminar a estrada lá não seria muito benéfico para mim. Pelo menos os impostos arrecadados para o projeto estão em meu tesouro, em vez de serem desperdiçados na estrada."
 stewardship_domain_special.1392.t:0 "A Estrada: Cortando Perdas"
 stewardship_domain_special.1396.a:0 "Uma estrada não precisa ser luxuosa. Ela é boa o suficiente."
 stewardship_domain_special.1396.desc:0 "A estrada em [project_county.GetNameNoTier] finalmente está completa.\n\n\"É... bastante funcional\", [project_leader.GetTitledFirstName] me diz."
 stewardship_domain_special.1396.t:0 "O Fim da Estrada"
 stewardship_domain_special.1397.a:0 "Mal posso esperar para colher os benefícios!"
 stewardship_domain_special.1397.b:0 "[peasant_leader.GetTitledFirstNameNoTooltip]! Tenho mais trabalho para você!"
 stewardship_domain_special.1397.desc:0 "A rede de estradas em [project_county.GetNameNoTier] finalmente está completa.\n\n\"Isso levará as pessoas para onde precisam ir por décadas\", [project_leader.GetTitledFirstName] me diz."
 stewardship_domain_special.1398.a:0 "Mal posso esperar para colher os benefícios!"
 stewardship_domain_special.1398.b:0 "[peasant_leader.GetTitledFirstNameNoTooltip]! Tenho mais trabalho para você!"
 stewardship_domain_special.1398.desc:0 "A rede de estradas em [project_county.GetNameNoTier] finalmente está completa.\n\n\"Essas estradas serão as veias pulsantes do condado por gerações!\", [project_leader.GetTitledFirstName] anuncia com muito orgulho."
 stewardship_domain_special.1399.a:0 "Mal posso esperar para colher os benefícios!"
 stewardship_domain_special.1399.b:0 "[peasant_leader.GetTitledFirstNameNoTooltip]! Tenho mais trabalho para você!"
 stewardship_domain_special.1399.desc:0 "A rede de estradas em [project_county.GetNameNoTier] finalmente está completa.\n\n\"Essas podem muito bem ser as melhores estradas de todo o reino, [Select_CString( ROOT.Char.IsFemale, 'minha senhora', 'meu senhor' )]!\", [project_leader.GetTitledFirstName] anuncia com orgulho."
 stewardship_domain_special.1401.a.tt:0 "O coletor liderará a investigação"
 stewardship_domain_special.1401.a:0 "O coletor de impostos em [county.GetNameNoTierNoTooltip] deve investigar!"
 stewardship_domain_special.1401.b.tt:0 "Eu lidero a investigação pessoalmente"
 stewardship_domain_special.1401.b:0 "Eu irei pessoalmente à vila."
 stewardship_domain_special.1401.c:0 "Vilas desaparecem o tempo todo, não ligue para isso."
 stewardship_domain_special.1401.desc:0 "Apenas com uma vela acesa, meu dedo pausa em uma entrada no livro-razão. Algo não está certo... Logo estou procurando por todos os registros de [county.GetName] que consigo encontrar.\n\nFinalmente, fica claro como o dia. Parece que uma vila inteira desapareceu dos registros de tributação!"
 stewardship_domain_special.1401.t:0 "Uma Vila Desaparecida"
 stewardship_domain_special.1411.a.tt:0 "[collector.GetTitledFirstName] me mostra sua vila"
 stewardship_domain_special.1411.a:0 "Muito bem, me mostre ao redor."
 stewardship_domain_special.1411.b.tt:0 "Por que eu sequer vim aqui!?"
 stewardship_domain_special.1411.b:0 "Você já desperdiçou muito do meu tempo!"
 stewardship_domain_special.1411.desc:0 "[collector.GetTitledFirstName], [Select_CString( collector.IsFemale, 'a coletora', 'o coletor' )] de impostos em [county.GetName], fez questão de enfatizar o quanto era importante eu ir ver a vila \"desaparecida\" com meus próprios olhos.\n\nApós dias de viagem, finalmente chego à vila. Parece ser apenas mais uma pequena e empoeirada povoação. No entanto, [collector.GetTitledFirstName] insiste: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], permita-me mostrar este lugar a você, eu imploro. Esta é a minha casa.\""
 stewardship_domain_special.1412.a:0 "O coletor do próximo ano resolverá sua dívida."
 stewardship_domain_special.1412.b.flavor:0 "Apreenda tudo o que for valioso e queime o restante!"
 stewardship_domain_special.1412.b:0 "Estou cobrando sua dívida integralmente. Agora."
 stewardship_domain_special.1412.desc:0 "Com os pés d[Select_CString( collector.IsFemale, 'a', 'o' )] [collector.GetTitledFirstName] pendendo sobre a área verde da vila, me preparo para partir com meus guardas. Já deixamos os primeiros prédios para trás quando uma garota se aproxima correndo ao lado do meu cavalo.\n\n\"Oh, [Select_CString( ROOT.Char.IsFemale, 'querida', 'querido' )] [ROOT.Char.GetLadyLord], o que será de nós? Nenhum de nós pode pagar a penalidade que você está nos pedindo.\""
 stewardship_domain_special.1413.a:0 "Acho que posso conceder uma isenção fiscal..."
 stewardship_domain_special.1413.b:0 "Mesmo sob as circunstâncias, eles devem pagar."
 stewardship_domain_special.1413.c.tt:0 "Eu decidirei como lidar com a vila"
 stewardship_domain_special.1413.c:0 "Isso é o que você queria me mostrar? Traição!"
 stewardship_domain_special.1413.desc:0 "Enquanto [Select_CString( collector.IsFemale, 'a', 'o' )] [collector.GetTitledFirstName] me mostra a vila, tudo o que vejo são vacas magras, galinhas ciscando na terra e camponeses voltando dos campos com cargas leves. Quando comento sobre isso, [collector.GetSheHe] faz seu ponto.\n\n\"Essas pessoas mal conseguem alimentar seu gado. Se eu exigir mais deles, eles vão passar fome.\""
 stewardship_domain_special.1414.a:0 "Há muitas maneiras de governar."
 stewardship_domain_special.1414.desc:0 "A vila ainda está fumegando quando eu e meus guardas partimos.\n\nÀs vezes, o antigo deve ser purificado para dar lugar ao novo."
 stewardship_domain_special.1421.a.tt:0 "Pode haver qualquer coisa aqui"
 stewardship_domain_special.1421.a:0 "O que vocês encontraram!?!"
 stewardship_domain_special.1421.b:0 "Nós vamos embora. Agora."
 stewardship_domain_special.1421.collector_opening:0 "O coletor de impostos enviado para inspecionar a vila desaparecida nunca retornou. Sob forte guarda, decido investigar por conta própria e finalmente descubro por que isso aconteceu..."
 stewardship_domain_special.1421.desc:0 "\n\nCada casa está abandonada e em ruínas. Não há nenhum vestígio de pessoas, nem mesmo do meu coletor.\n\nUm sentimento de medo começa a me dominar lentamente quando meus guardas vasculham as casas silenciosas, rapidamente se transformando em pânico quando um deles grita de repente."
 stewardship_domain_special.1421.self_opening:0 "Ao chegar à vila acompanhado por meus guardas, descubro finalmente por que os moradores pararam de pagar seus impostos."
 stewardship_domain_special.1422.a:0 "Pobre [foundling.Custom('GirlBoy')], não tem mais um lar... Vou adotar [foundling.GetSheHe]!"
 stewardship_domain_special.1422.b:0 "Deixe a criança na vila mais próxima."
 stewardship_domain_special.1422.c:0 "Queime a vila e essa criança amaldiçoada junto."
 stewardship_domain_special.1422.desc:0 "O guarda que gritou sai de uma porta apodrecida com uma criança sob um dos braços. [Select_CString( foundling.IsFemale, 'A', 'O' )] [foundling.Custom('GirlBoy')] tentava evitar ser descobert[Select_CString( foundling.IsFemale, 'a', 'o' )] nos fundos da casa.\n\nEmbora eu exija respostas, a criança não diz nada sobre o que aconteceu com a vila — ou, para falar a verdade, não diz nada mesmo."
 stewardship_domain_special.1423.a:0 "Essa terra amaldiçoada nunca deve ser reassentada."
 stewardship_domain_special.1423.b:0 "O tempo recuperará aquela vila, assim como faz com todas as coisas."
 stewardship_domain_special.1423.desc:0 "As lembranças da vila silenciosa ainda me assombram. No final, não encontramos nenhum vestígio de alguém que já tenha vivido lá."
 stewardship_domain_special.1423.foundling:0 "[Select_CString( foundling.IsFemale, 'A pequena', 'O pequeno' )] [foundling.GetTitledFirstName] está em segurança na corte agora, brincando — e até mesmo falando — com as outras crianças.\n\n"
 stewardship_domain_special.1423.no_foundling:0 "O barulho e a conversa na corte pouco me distraem do que vi."
 stewardship_domain_special.1424.a:0 "Queime esse inferno até o chão."
 stewardship_domain_special.1424.b:0 "Enterre os corpos e ordene o reassentamento."
 stewardship_domain_special.1424.collector_end:0 "mas até mesmo o cadáver mais recente encostado na parede — meu coletor de impostos — não apresenta marcas evidentes."
 stewardship_domain_special.1424.desc:0 "O que me aguarda na casa abandonada é um mau cheiro terrível e uma pilha de corpos. A decomposição torna impossível determinar como eles morreram,"
 stewardship_domain_special.1424.self_end:0 "mas até mesmo os corpos menos deteriorados não têm marcas óbvias de homicídio."
 stewardship_domain_special.1425.a:0 "Agora, se apenas essa tosse amaldiçoada fosse embora!"
 stewardship_domain_special.1425.desc:0 "Os corpos são fáceis de se livrar. Mais desafiador é encontrar famílias dispostas a se estabelecer em uma vila dos mortos. No entanto, nenhum camponês pode resistir ao atrativo de um pedaço de terra fértil por muito tempo. Ou contra a ponta de uma lança, para dizer a verdade.\n\nSupervisionar o início da reconstrução também me ensinou muito!"
 stewardship_domain_special.1426.a:0 "É hora de voltar para casa."
 stewardship_domain_special.1426.desc:0 "É sem cerimônia, mas o fogo faz o que precisa ser feito. Observo as chamas consumirem as casas abandonadas por muito tempo, mas não por muito tempo. Já vi tudo o que precisava ver aqui."
 stewardship_domain_special.1431.a.tt:0 "Vou confrontar [Select_CString( collector.IsFemale, 'a', 'o' )] [collector.GetFirstName]"
 stewardship_domain_special.1431.a:0 "[collector.GetFirstNameNoTooltip] tem perguntas a responder..."
 stewardship_domain_special.1431.b:0 "Reúnam os moradores. Eles pagarão novamente."
 stewardship_domain_special.1431.desc:0 "Após dias de viagem, encontro a vila que está faltando em meus registros. Não só está prosperando — absolutamente próspera! –, mas os moradores insistem que eles #EMP pagam#! seus impostos.\n\n[collector.GetTitledFirstName], [Select_CString( collector.IsFemale, 'a coletora', 'o coletor' )] de impostos da baronia, não tem sido totalmente honesto."
 stewardship_domain_special.1432.a:0 "Você será esquecido na escuridão."
 stewardship_domain_special.1432.b.collector_bad.tt:0 "[collector.GetFirstNameNoTooltip] escapa!"
 stewardship_domain_special.1432.b.collector_bad:0 "Uma Chance de Fuga"
 stewardship_domain_special.1432.b.collector_loyal:0 "Gratidão e Lealdade"
 stewardship_domain_special.1432.b:0 "Eu poderia usar alguém que me deve a vida."
 stewardship_domain_special.1432.c:0 "Qualquer coisa? Que tal contar minhocas?!"
 stewardship_domain_special.1432.desc:0 "\"Aqueles fundos eram vitais para, uh, a defesa de [county.GetNameNoTier]!\" [collector.GetTitledFirstName], [Select_CString( collector.IsFemale, 'a coletora', 'o coletor' )] de impostos em [barony.GetNameNoTier], está aterrorizado, não apenas por causa dos soldados corpulentos que trouxe para a mansão [collector.GetHerHim].\n\n\"Por favor, farei qualquer coisa para conseguir seu perdão!\""
 stewardship_domain_special.1433.a:0 "Estrangule [collector.GetSheHe] imediatamente."
 stewardship_domain_special.1433.b:0 "Você nunca verá a luz novamente, [collector.GetFirstNameNoTooltip]!"
 stewardship_domain_special.1433.desc:0 "Verme traiçoeiro! Ofereço perdão e, no momento seguinte, [collector.GetTitledFirstName] está sobre mim com uma lâmina em mãos e uma expressão maligna no rosto.\n\nLuto por um momento para me defender antes que um guarda esteja sobre [collector.GetSheHe]."
 stewardship_domain_special.1441.a:0 "Aprendi muito."
 stewardship_domain_special.1441.desc:0 "Os impostos cobrados dos meus camponeses podem ser difíceis às vezes. No entanto, como os eventos recentes me mostraram, a vida #EMP é#! difícil. Nenhuma bondade que eu possa mostrar mudará isso."
 stewardship_domain_special.1442.desc:0 "Os impostos cobrados dos camponeses do meu reino podem ser tão pesados que até mesmo a vida é sufocada. Aliviar isso muitas vezes pode ser o caminho para uma prosperidade ainda maior para um [ROOT.Char.GetTitleTierName] paciente."
 stewardship_domain_special.1443.a:0 "Maravilhoso!"
 stewardship_domain_special.1443.end:0 "\n\nAs coisas estão muito melhores desde então, e a receita de [barony.GetNameNoTier] está mais alta do que nunca!"
 stewardship_domain_special.1443.opening:0 "Examinando registros de impostos, sou levado de volta ao caso da vila desaparecida em [barony.GetNameNoTier]."
 stewardship_domain_special.1443.t:0 "$stewardship_domain_special.1401.t$: Tributação Aprimorada"
 stewardship_domain_special.1444.a:0 "Que desastre."
 stewardship_domain_special.1444.end:0 "\n\nAs coisas estão diferentes agora, mas aprendi que a misericórdia e a leniência às vezes só levam a perdas cada vez maiores. Qualquer forma de evitar impostos se espalhará entre os camponeses como pulgas."
 stewardship_domain_special.1444.t:0 "$stewardship_domain_special.1401.t$: Evasão Fiscal Extensiva"
 stewardship_domain_special.1445.a:0 "Bem, se eles não podem pagar por suas vidas..."
 stewardship_domain_special.1445.end:0 "\n\nAgora mais vilas estão desaparecendo, mas meus coletores sabem de uma explicação óbvia. Impostos altos levaram a muito abandono de terras perfeitamente boas, seja por fome ou fuga para outros condados."
 stewardship_domain_special.1445.t:0 "$stewardship_domain_special.1401.t$: Abandono Contínuo"
 stewardship_domain_special.1451.a:0 "Por que isso pesa tanto em mim?"
 stewardship_domain_special.1451.b:0 "Ah, eu quase havia esquecido!"
 stewardship_domain_special.1451.desc:0 "Eu acordo no meio da noite, ainda lembrando do olhar acusatório da criança enquanto a vila em [barony.GetNameNoTier] queima até o chão."
 stewardship_domain_special.1451.t:0 "$stewardship_domain_special.1401.t$: Gravado na Memória"
 stewardship_domain_special.1500.a.tt:0 "#F Uma avaliação minuciosa é cara, mas terá maior qualidade.#!"
 stewardship_domain_special.1500.a:0 "Eu conhecerei cada acre, servo e cabeça de gado."
 stewardship_domain_special.1500.b.tt:0 "#F Uma avaliação superficial é mais barata, mas pode não ter tanta qualidade.#!"
 stewardship_domain_special.1500.b:0 "Um resumo das minhas possessões será suficiente."
 stewardship_domain_special.1500.c.tt:0 "Todos os meus outros vassalos"
 stewardship_domain_special.1500.c:0 "Por que me preocupar? Meus súditos sabem o que me devem."
 stewardship_domain_special.1500.desc:0 "M[Select_CString( domesday_steward.IsFemale, 'inha', 'eu' )] [domesday_steward.GetCouncilTitle] [domesday_steward.GetTitledFirstName] teve a audaciosa ideia de avaliar todas as propriedades em meu reino em um único levantamento gigante, criando um registro definitivo das minhas posses.\n\nAo compilar esse conhecimento, eu teria uma melhor supervisão dos assuntos administrativos, bem como da cobrança de impostos — embora o investimento inicial não seja barato."
 stewardship_domain_special.1500.every_county_control:0 "[control|E] aumenta em relação à qualidade do levantamento"
 stewardship_domain_special.1500.every_county_summary:0 "Concede impostos da [holding|E] proporcionalmente mais altos por #V 5 anos#!"
 stewardship_domain_special.1500.quality_based_taxes:0 "Com base na qualidade do levantamento concluído"
 stewardship_domain_special.1500.quality_decrease.tt:0 "O levantamento terá #N diminuição de qualidade#!"
 stewardship_domain_special.1500.quality_increase.tt:0 "O levantamento terá #P aumento de qualidade#!"
 stewardship_domain_special.1500.survey_not_completed:0 "Se o levantamento não for concluído"
 stewardship_domain_special.1500.t.a:0 "O Grande Levantamento"
 stewardship_domain_special.1500.t.b:0 "O Livro de Domesday"
 stewardship_domain_special.1501.a.tt:0 "Meus avaliadores podem ser atacados em condados com baixo [control|E]."
 stewardship_domain_special.1501.a:0 "Minha lei é proteção suficiente para meus súditos!"
 stewardship_domain_special.1501.b.failure:0 "Minhas milícias não conseguem proteger meus avaliadores"
 stewardship_domain_special.1501.b.success:0 "Minhas milícias conseguem manter meus avaliadores seguros"
 stewardship_domain_special.1501.b:0 "Organize uma milícia para proteger meus avaliadores."
 stewardship_domain_special.1501.c.tt:0 "Meus avaliadores estarão protegidos contra ataques na estrada."
 stewardship_domain_special.1501.c:0 "Envie um [ROOT.Char.Custom('MountedWarriorTerm')] com cada grupo de avaliadores."
 stewardship_domain_special.1501.desc:0 "M[Select_CString( domesday_marshal.IsFemale, 'inha', 'eu' )] marechal [domesday_marshal.GetTitledFirstName] está preocupado que meus avaliadores sejam um alvo principal para bandidos e ladrões. Mesmo um levantamento incompleto poderia fornecer informações valiosas aos criminosos sobre possíveis alvos que eles poderiam atacar!\n\nPara manter meus súditos seguros, [domesday_marshal.GetFirstNameNoTooltip] recomenda enviar uma guarda armada com cada avaliador."
 stewardship_domain_special.1510.a:0 "Os [upset_priest.GetFaith.HouseOfWorshipPlural] serão avaliados, goste [upset_priest.GetSheHe] ou não!"
 stewardship_domain_special.1510.b.tt:0 "Eu excluo as posses d[Select_CString( upset_priest.IsFemale, 'a', 'o' )] [upset_priest.GetTitledFirstName] da avaliação"
 stewardship_domain_special.1510.b:0 "[upset_priest.GetSheHe|U] está certo, os [upset_priest.GetFaith.HouseOfWorshipPlural] são domínio do [upset_priest.GetFaith.HighGodName]."
 stewardship_domain_special.1510.c.failure.tt:0 "Eu não consigo convencer [Select_CString( upset_priest.IsFemale, 'a', 'o' )] [upset_priest.GetTitledFirstName] de que a avaliação é justificada"
 stewardship_domain_special.1510.c.failure:0 "Eu não consigo convencer [Select_CString( upset_priest.IsFemale, 'a', 'o' )] [upset_priest.GetTitledFirstName]"
 stewardship_domain_special.1510.c.success.tt:0 "Eu convenço [Select_CString( upset_priest.IsFemale, 'a', 'o' )] [upset_priest.GetTitledFirstName] de que a avaliação é justificada"
 stewardship_domain_special.1510.c.success:0 "Eu convenço [Select_CString( upset_priest.IsFemale, 'a', 'o' )] [upset_priest.GetTitledFirstName]"
 stewardship_domain_special.1510.c:0 "Vou usar o [upset_priest.GetFaith.ReligiousText] para justificar a avaliação."
 stewardship_domain_special.1510.desc_ending:0 "\n\nEmbora eu esteja disposto a pagar minhas obrigações, os assuntos da igreja são inerentemente espirituais, não temporais, e seus avaliadores não têm nada a ver aqui, perturbando meus serviços!"
 stewardship_domain_special.1510.desc_ending_not_endorsed:0 "\n\nOs assuntos da igreja são inerentemente espirituais, não temporais, e seus lacaios não têm nada a ver aqui, perturbando meus serviços!"
 stewardship_domain_special.1510.desc_opening:0 "Eu tive uma grande decepção quando as únicas pessoas que compareceram ao meu serviço esta manhã foram seus avaliadores de impostos! Aparentemente, os oficiais de aparência austera esperando do lado de fora da minha porta desencorajaram muitos fiéis [upset_priest.GetFaith.GetAdherentNamePluralNoTooltip] de participar do meu serviço."
 stewardship_domain_special.1510.opening:0 "[upset_priest.Custom2('AppropriateGreeting', ROOT.Char)]"
 stewardship_domain_special.1520.a.tt:0 "Eu excluo as posses d[Select_CString( concerned_noble.IsFemale, 'a', 'o' )] [concerned_noble.GetTitledFirstName] da avaliação"
 stewardship_domain_special.1520.a:0 "Claro que confio em você! Meus homens partirão imediatamente."
 stewardship_domain_special.1520.b:0 "Eu quero saber o que minhas terras contêm. Sem exceções."
 stewardship_domain_special.1520.c.tt:0 "Eu descubro um dos [secrets|E] d[Select_CString( concerned_noble.IsFemale, 'a', 'o' )] [concerned_noble.GetTitledFirstName]"
 stewardship_domain_special.1520.c:0 "Escondendo algo, está [concerned_noble.GetSheHe]? Substitua meus avaliadores por espiões!"
 stewardship_domain_special.1520.desc:0 "Tenho pago fielmente minhas obrigações à coroa a cada ano, no entanto, outro dia seus avaliadores de impostos apareceram na minha porta exigindo inspecionar minhas propriedades!\n\nVocê confia tão pouco em mim que precisa enviar homens para invadir minha privacidade?"
 stewardship_domain_special.1520.opening:0 "[concerned_noble.Custom2('AppropriateGreeting', ROOT.Char)]"
 stewardship_domain_special.1530.a:0 "As guildas serão avaliadas, privilégios à parte!"
 stewardship_domain_special.1530.b:0 "Posso isentá-los em troca de seus serviços..."
 stewardship_domain_special.1530.c:0 "Eles rejeitam minha autoridade!? Revogue suas cartas!"
 stewardship_domain_special.1530.desc:0 "[city_mayor.GetTitledFirstName] veio até mim dizendo que a Guilda dos Carpinteiros da [guild_town.GetNameNoTierNoTooltip] em [guild_county.GetName] está se recusando a participar da avaliação.\n\nEles alegam que a avaliação viola os privilégios que lhes foram concedidos em relação à administração de seus próprios assuntos e desejam que meus avaliadores sejam retirados do condado para que possam operar livremente."
 stewardship_domain_special.1540.a:0 "Ignore [domesday_robbed_county.GetNameNoTierNoTooltip]. Não será incluído na avaliação."
 stewardship_domain_special.1540.b:0 "Aumente as patrulhas nas estradas lá e envie mais avaliadores!"
 stewardship_domain_special.1540.c:0 "Que isso seja um exemplo para aqueles em [domesday_robbed_county.GetNameNoTierNoTooltip] que se oporiam a mim!"
 stewardship_domain_special.1540.desc.a:0 "Enquanto viajava por [domesday_robbed_county.GetName], um grupo de bandidos atacou meus avaliadores. Vários avaliadores foram mortos e os registros que eles carregavam foram perdidos."
 stewardship_domain_special.1540.desc.b:0 "Enquanto viajava por [domesday_robbed_county.GetName], um grupo de bandidos atacou meus avaliadores. Felizmente, os soldados que eu tinha guardando meus avaliadores foram capazes de eliminar os ladrões."
 stewardship_domain_special.1550.a:0 "Cancele a pesquisa e obrigue [domesday_steward.GetSheHe] a me reembolsar pelos custos."
 stewardship_domain_special.1550.b:0 "Use o dinheiro do suborno para reavaliar adequadamente essas propriedades."
 stewardship_domain_special.1550.c:0 "Prenda [Select_CString( domesday_steward.IsFemale, 'a', 'o' )] [domesday_steward.GetTitledFirstNameNoTooltip], seu mandato como [domesday_steward.GetCouncilTitle] acabou."
 stewardship_domain_special.1550.desc:0 "Ao comparar os impostos pagos por mim no ano passado com as informações da pesquisa em andamento, percebi várias discrepâncias importantes... ou meus súditos têm consistentemente pagado a mais, ou algo está muito errado com esta pesquisa!\n\nInvestigando mais, descubro que m[Select_CString( domesday_steward.IsFemale, 'inha', 'eu' )] [domesday_steward.GetCouncilTitle] [domesday_steward.GetTitledFirstName] tem comprometido a pesquisa ao aceitar subornos de proprietários de terras em troca de deixar suas posses fora da avaliação!"
 stewardship_domain_special.1560.a:0 "Todos serão avaliados, residentes ou não!"
 stewardship_domain_special.1560.b:0 "Se eles me pagarem uma taxa, eu os isentarei."
 stewardship_domain_special.1560.c:0 "Os comerciantes têm um bom argumento."
 stewardship_domain_special.1560.desc:0 "[city_mayor.GetTitledFirstName] me diz que os comerciantes ambulantes têm reclamado dos meus avaliadores em [trade_county.GetName].\n\nOs comerciantes ambulantes acham injusto que suas mercadorias sejam avaliadas quando eles não são residentes do [ROOT.Char.GetPrimaryTitle.GetName], e vários estão ameaçando partir e nunca mais voltar."
 stewardship_domain_special.1590.desc.start:0 "Após muitos meses trabalhosos avaliando minhas terras, está feito."
 stewardship_domain_special.1590.every_county:0 "Cada condado no [THIS.Char.GetPrimaryTitle.GetName]"
 stewardship_domain_special.1590.every_nonexcluded_county:0 "Cada condado não excluído no [THIS.Char.GetPrimaryTitle.GetName]"
 stewardship_domain_special.1590.excellent.desc:0 "Meus avaliadores compilaram um registro excepcionalmente preciso das minhas posses. Isso garantirá que eu colete todos os impostos devidos a mim a cada ano!"
 stewardship_domain_special.1590.excellent:0 "Meus avaliadores compilam um registro preciso das minhas posses"
 stewardship_domain_special.1590.good.desc:0 "Meus avaliadores compilaram uma estimativa precisa das minhas posses. Isso garantirá que meus coletores de impostos não deixem passar nada importante ao calcular o que me é devido."
 stewardship_domain_special.1590.good:0 "Meus avaliadores compilam uma estimativa precisa das minhas posses"
 stewardship_domain_special.1590.high_quality.a.tt:0 "#F Restringir o acesso a esses registros me dará informações exclusivas sobre minhas terras que posso explorar.#!"
 stewardship_domain_special.1590.high_quality.a:0 "Restrinja o acesso apenas aos meus coletores de impostos."
 stewardship_domain_special.1590.high_quality.b.tt:0 "#F Tornar os registros de conhecimento público irá impressionar e inspirar o povo, melhorando o desenvolvimento em minhas terras.#!"
 stewardship_domain_special.1590.high_quality.b:0 "Distribua os registros para o público!"
 stewardship_domain_special.1590.high_quality.desc:0 "\n\nOrgulhoso, m[Select_CString( domesday_final_steward.IsFemale, 'inha', 'eu' )] [domesday_final_steward.GetCouncilTitle] [domesday_final_steward.GetFirstName] pergunta onde devemos armazenar os registros agora que estão completos."
 stewardship_domain_special.1590.low_quality.desc:0 "\n\nM[Select_CString( domesday_final_steward.IsFemale, 'inha', 'eu' )] [domesday_final_steward.GetCouncilTitle] [domesday_final_steward.GetFirstName] está desanimado, dizendo que este não é o resultado que [domesday_final_steward.GetSheHe] esperava."
 stewardship_domain_special.1590.mediocre.desc:0 "Meus avaliadores compilaram apenas uma estimativa vaga das minhas posses. Embora ainda seja útil, meus coletores de impostos certamente deixarão passar coisas ao calcular o que me é devido."
 stewardship_domain_special.1590.mediocre:0 "Meus avaliadores compilam uma estimativa vaga das minhas posses"
 stewardship_domain_special.1590.no_steward.desc:0 "\n\nSe eu ainda tivesse um [ROOT.GetCouncillorPosition( 'councillor_steward' ).GetPositionName], esta pesquisa poderia ter sido melhor."
 stewardship_domain_special.1590.none.desc:0 "\n\nSurpreendentemente, cada província em meu reino de alguma forma conseguiu uma isenção que a excluía da pesquisa. Como resultado, os registros finais não contêm absolutamente nenhuma informação sobre as posses do meu reino."
 stewardship_domain_special.1590.perfect.desc:0 "Sob minha orientação, meus avaliadores compilaram um registro absolutamente perfeito das minhas posses. Com tudo detalhado até a última galinha, isso garantirá que eu colete todos os impostos devidos a mim a cada ano!"
 stewardship_domain_special.1590.poor.desc:0 "Infelizmente, meus avaliadores compilaram uma pesquisa tão imprecisa que é completamente inutilizável! Meus coletores de impostos ficarão por conta própria este ano..."
 stewardship_domain_special.1590.poor:0 "A pesquisa é tão imprecisa que não é utilizável"
 stewardship_domain_special.1590.poor_quality.a:0 "Que desperdício de tempo e dinheiro..."
 stewardship_domain_special.1590.poor_quality.b:0 "Demitir [Select_CString( domesday_final_steward.IsFemale, 'a', 'o' )] [domesday_final_steward.GetFirstNameNoTooltip] por sua incompetência!"
 stewardship_domain_special.1590.poor_quality.c:0 "[domesday_final_steward.GetSheHe|U] pagará por esse fracasso com sua vida!"
 stewardship_domain_special.1590.poor_quality.d.tt:0 "É demitido do meu [council|E]"
 stewardship_domain_special.3010.a:0 "Vou mostrar a eles do que sou capaz!"
 stewardship_domain_special.3010.b:0 "Meu tempo é muito valioso para desperdiçá-lo com a opinião deles."
 stewardship_domain_special.3010.desc:0 "As pessoas em [stewardship_domain_special_3010_county.GetNameNoTier] parecem insatisfeitas com o meu governo.\n\nSe eu visitar o condado pessoalmente, posso mostrar a eles a... ahem, #EMP necessidade#! da minha autoridade."
 stewardship_domain_special.3010.t:0 "Insatisfação em [stewardship_domain_special_3010_county.GetNameNoTier]"
 stewardship_domain_special.3012.a:0 "Com ouro, mostrarei minha generosidade."
 stewardship_domain_special.3012.b.failure:0 "Minhas palavras não surtem efeito e as pessoas não se comovem"
 stewardship_domain_special.3012.b.success:0 "Impressiono as pessoas com meu discurso"
 stewardship_domain_special.3012.b:0 "Impressioná-los com um grande discurso sobre meu governo."
 stewardship_domain_special.3012.c:0 "Os camponeses sofrerão por sua insolência!"
 stewardship_domain_special.3012.desc.a:0 "[stewardship_domain_special_3010_baron.GetTitledFirstName] explica com desculpas que as pessoas aqui são rebeldes e que elas precisam entender que meu governo não deve ser questionado. Sua aceitação passiva não é suficiente, eu preciso de lealdade e obediência.\n\nComo posso convencê-los a obedecer?"
 stewardship_domain_special.3012.desc.b:0 "As pessoas aqui são rebeldes. Elas precisam entender que meu governo não deve ser questionado. Sua aceitação passiva não é suficiente, eu preciso de lealdade e obediência.\nComo posso convencê-los a obedecer?"
 stewardship_domain_special.3012.t:0 "Visita a [stewardship_domain_special_3010_county.GetNameNoTier]"
 stewardship_domain_special.3014.a:0 "O ouro sempre encontra mãos vazias."
 stewardship_domain_special.3014.b:0 "Pelo menos aprendi algo."
 stewardship_domain_special.3014.c:0 "Minhas palavras movem o reino."
 stewardship_domain_special.3014.e:0 "Deixem que odeiem, desde que temam."
 stewardship_domain_special.3014.f.tt:0 "Não aprendi nada sobre administração."
 stewardship_domain_special.3014.f:0 "Isso é tão frustrante. Será que algum dia melhorarei minha diplomacia?"
 stewardship_domain_special.3014.intimidate_success.desc:0 "Impondo minha força em [stewardship_domain_special_3010_county.GetNameNoTier] parece ter funcionado. Eles se curvaram diante do meu poder e serão melhores súditos agora."
 stewardship_domain_special.3014.popular_appeal_fail_learn_fail.desc:0 "Meus discursos caíram em ouvidos moucos. Não sei o que estou fazendo de errado. [stewardship_domain_special_3010_county.GetNameNoTier] está tão rebelde como sempre."
 stewardship_domain_special.3014.popular_appeal_fail_learn_success.desc:0 "[stewardship_domain_special_3010_county.GetNameNoTier] está tão rebelde como sempre. No início, meus discursos foram fracos, mas acho que melhorei no final da minha visita."
 stewardship_domain_special.3014.popular_appeal_success.desc:0 "Meus discursos tocaram as pessoas e agora [stewardship_domain_special_3010_county.GetNameNoTier] mostra maior conformidade ao meu governo."
 stewardship_domain_special.3014.spent_gold.desc:0 "Dinheiro bem gasto. Minha generosidade comprou a conformidade das pessoas ao meu governo."
 stewardship_domain_special.3014.t.a:0 "Ordem restaurada em [stewardship_domain_special_3010_county.GetNameNoTier]"
 stewardship_domain_special.3014.t.b:0 "Insatisfação em [stewardship_domain_special_3010_county.GetNameNoTier]"
 stewardship_domain_special.8001.a:0 "Vou projetar um aqueduto!"
 stewardship_domain_special.8001.b:0 "Precisamos de uma rede de valas e solo."
 stewardship_domain_special.8001.c:0 "Aquelas terras estão não utilizadas por um bom motivo."
 stewardship_domain_special.8001.continued_problems:0 "Problemas Contínuos"
 stewardship_domain_special.8001.desc:0 "Há grandes trechos de terras não utilizadas em [county.GetName], frequentemente atribuídas ao terreno inadequado.\n\n[steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] sugeriu que um projeto de irrigação poderia torná-las aráveis e, assim, valiosas."
 stewardship_domain_special.8001.high_death_count:0 "Alto Número de Mortes"
 stewardship_domain_special.8001.if_successful:0 "Se bem-sucedido:"
 stewardship_domain_special.8001.progress_is_made:0 "Progresso Significativo"
 stewardship_domain_special.8001.project_completed:0 "#P O projeto foi concluído#!"
 stewardship_domain_special.8001.project_continues:0 "#V O projeto continua#!"
 stewardship_domain_special.8001.slow_progress:0 "Progresso Lento"
 stewardship_domain_special.8001.t:0 "Irrigação"
 stewardship_domain_special.8001.troubled_construction:0 "Construção Problemática"
 stewardship_domain_special.8011.a.tt:0 "#F Eu tinha tantas esperanças neste...#!"
 stewardship_domain_special.8011.a:0 "[steward.GetFirstNameNoTooltip], encontre-me um substituto!"
 stewardship_domain_special.8011.b:0 "Você está certo. Pegue o que precisa."
 stewardship_domain_special.8011.desc:0 "Meu assistente arquiteto designado veio até mim, solicitando que eu gaste ainda mais no meu projeto de aqueduto em [county.GetName].\n\n\"Certamente você mesmo pode ver que qualquer projeto de construção seria caro nessas condições, [ROOT.Char.Custom('FormOfAddressForLiege')]."
 stewardship_domain_special.8011.t:0 "$stewardship_domain_special.8001.t$: Extrapolando o Orçamento"
 stewardship_domain_special.8012.a.tt:0 "#F Como pode custar tanto para construir um aqueduto simples?#!"
 stewardship_domain_special.8012.a:0 "Leve o ouro, mas você precisa terminar com isso!"
 stewardship_domain_special.8012.b:0 "Recrute mais camponeses para o trabalho forçado."
 stewardship_domain_special.8012.desc:0 "Será que não há arquitetos competentes em meu reino?! Meu novo assistente arquiteto, responsável pela construção do aqueduto em [county.GetName], também extrapolou o orçamento!\n\nEstou cansado de desculpas sem sentido como \"não é possível, [ROOT.Char.Custom('FormOfAddressForLiege')]\"!"
 stewardship_domain_special.8012.t:0 "$stewardship_domain_special.8001.t$: Problemas Contínuos"
 stewardship_domain_special.8013.a:0 "Vou gerenciar as obras eu mesmo."
 stewardship_domain_special.8013.b:0 "Recrute camponeses para compensar o tempo perdido."
 stewardship_domain_special.8013.desc:0 "Recursos entregues no lugar errado, estruturas que não correspondem ao que eu tinha em mente... Que parte da ordem \"construa um aqueduto do jeito que eu quero\" é tão difícil de seguir?"
 stewardship_domain_special.8013.t:0 "$stewardship_domain_special.8001.t$: Construção Problemática"
 stewardship_domain_special.8021.a:0 "Os camponeses terão que trabalhar duas vezes mais duro, então!"
 stewardship_domain_special.8021.b:0 "Devemos levar o tempo necessário para acertar isso."
 stewardship_domain_special.8021.c:0 "Sempre há atalhos que podemos tomar para voltar ao caminho certo!"
 stewardship_domain_special.8021.desc:0 "Meu projeto de irrigação em [county.GetNameNoTier] está progredindo, mas com mais dificuldades do que o esperado.\n\nDe acordo com [steward.Custom2('MyCharacterIntroduction', ROOT.Char)], o solo é \"duas vezes mais rochoso e duas vezes mais poroso do que imaginávamos\"."
 stewardship_domain_special.8021.t:0 "$stewardship_domain_special.8001.t$: Dificuldades Inesperadas"
 stewardship_domain_special.8022.a:0 "Talvez eu precise supervisionar as coisas um pouco mais de perto daqui em diante."
 stewardship_domain_special.8022.b:0 "Eles não vivem para me servir?"
 stewardship_domain_special.8022.c.tt:0 "#F Não diga a eles por que são necessários.#!"
 stewardship_domain_special.8022.c:0 "Ah... Recrute substitutos conforme necessário."
 stewardship_domain_special.8022.desc:0 "O projeto de irrigação em [county.GetNameNoTier] está progredindo rapidamente, [ROOT.Char.Custom('FormOfAddressForLiege')],\" relata meu intendente. Minha arrogância logo desaparece, no entanto. \"Infelizmente, os camponeses estão perecendo a uma taxa alarmante."
 stewardship_domain_special.8022.t:0 "$stewardship_domain_special.8001.t$: Condições Infelizes"
 stewardship_domain_special.8023.a:0 "Substitua os encarregados. E dê a eles novos chicotes."
 stewardship_domain_special.8023.b:0 "Contrate quantos trabalhadores forem necessários!"
 stewardship_domain_special.8023.c.tt:0 "Isso reduzirá o impacto do meu projeto"
 stewardship_domain_special.8023.c:0 "Talvez seja hora de mirar um pouco mais baixo..."
 stewardship_domain_special.8023.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], o projeto de irrigação em [county.GetNameNoTier] está atrasado,\" relata [steward.Custom2('MyCharacterIntroduction', ROOT.Char)]. \"Muito atrasado. Depois de inspecionar o trabalho, fico preocupado se ele será concluído em minha vida.\"\n\nNão consigo dizer se [steward.GetSheHe] está falando sério ou não."
 stewardship_domain_special.8023.t:0 "$stewardship_domain_special.8001.t$: Progresso Estagnado"
 stewardship_domain_special.8031.a:0 "Mesmo décadas depois, colheremos as recompensas por isso."
 stewardship_domain_special.8031.aqueduct:0 "Estou presente para testemunhar as últimas pedras sendo colocadas no meu novo aqueduto em [county.GetName]. Meu intendente segura uma taça e a enche com as primeiras gotas de água corrente, antes de me oferecê-la."
 stewardship_domain_special.8031.conclusion:0 "e com o tempo trará nova vida a esta terra. À medida que os pequenos riachos se tornam um rio, reflito sobre tudo o que meu trabalho me ensinou."
 stewardship_domain_special.8031.full_scope:0 "mas a água é fresca,"
 stewardship_domain_special.8031.interlude:0 "\n\nO solo ainda está duro e hostil, e muito trabalho resta a fazer,"
 stewardship_domain_special.8031.irrigation:0 "Estou presente no dia em que os diques serão derrubados para trazer água para a minha nova rede de valas em [county.GetName]. Leva horas para a água começar a se espalhar adequadamente,"
 stewardship_domain_special.8031.scoped_down:0 "especialmente porque meu projeto não é tão grandioso como eu tinha imaginado. No entanto, a água é fresca,"
 stewardship_domain_special.8031.t:0 "$stewardship_domain_special.8001.t$: Trazer Vida"
 stewardship_domain_special.9999.a.tt:0 "Sinto como se tivesse atingido o máximo que posso no estudo do [stewardship_lifestyle|E]."
 stewardship_domain_special.9999.a:0 "Nada no estudo da governança me escapou!"
 stewardship_domain_special.9999.desc_education_4:0 "\n\nAo observar minhas realizações, percebo que não há mais nada a aprender!"
 stewardship_domain_special.9999.desc_not_education:0 "\n\nAo observar minhas realizações, percebo que me tornei uma força administrativa a ser considerada!"
 stewardship_domain_special.9999.desc_opening:0 "Com um dedo em cada torta, um olho em cada assunto e uma opinião sobre cada decisão, tenho me concentrado em assuntos administrativos por um longo tempo agora."
 stewardship_domain_special.9999.t:0 "Tudo em Meu Livro-Razão"
