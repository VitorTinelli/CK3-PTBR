l_spanish:
 available_because_of_dread_tt:0 "Esta opção está disponível por causa do seu [dread|E]"
 intrigue_lifestyle_perk_indication:0 "Você pode ganhar um [perk|E] no [intrigue_lifestyle|E]"
 intrigue_scheming.1001.a:0 "Aqui. Este decreto os forçará a te deixarem em paz."
 intrigue_scheming.1001.b:0 "O que é uma vila no grande esquema das coisas?"
 intrigue_scheming.1001.desc:0 "\"Precisamos desses recursos para as tropas! Se uma pequena vila em [county.GetNameNoTier] tiver que passar fome—\"\n\nA discussão acalorada entre meus conselheiros me segue para fora do quarto, e [Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstName], [Select_CString( councillor.IsFemale, 'a', 'o' )] representante de [county.GetNameNoTierNoTooltip], me saúda com olhos cansados enquanto me aproximo."
 intrigue_scheming.1001.t:0 "Lamento de [county.GetNameNoTierNoTooltip]"
 intrigue_scheming.1011.a.flavor:0 "Vou trabalhar junto com o criptógrafo para desenvolver um código."
 intrigue_scheming.1011.a:0 "Envie um criptógrafo, o trabalho começa imediatamente!"
 intrigue_scheming.1011.b:0 "Preciso ser mais vigilante no futuro."
 intrigue_scheming.1011.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\"\nEu me viro para ver [Select_CString( council_member.IsFemale, 'a', 'o' )] [council_member.GetTitledFirstName] correndo em minha direção, sem fôlego. \"Outro mensageiro foi encontrado morto, [ROOT.Char.Custom('FormOfAddressForLiege')]. Tanto a bolsa quanto a carta foram roubadas.\"\n\nPela terceira vez este ano; uma irritação que se transforma em preocupação. E se a correspondência entre mim e meus agentes estiver sendo lida pelos nossos inimigos?"
 intrigue_scheming.1011.t:0 "Necessidade de Sigilo"
 intrigue_scheming.1012.a.duel_failure:0 "[cryptographer.GetTitledFirstNameNoTooltip] não consegue me ensinar a sua arte"
 intrigue_scheming.1012.a.duel_success:0 "[cryptographer.GetTitledFirstNameNoTooltip] e eu desenvolvemos com sucesso um novo código"
 intrigue_scheming.1012.a:0 "Temos muito para discutir, você e eu..."
 intrigue_scheming.1012.b:0 "Me acorde se você encontrar algo."
 intrigue_scheming.1012.desc:0 "Uma noite longa se transforma em uma madrugada antecipada, sem descanso à vista para mim ou o criptógrafo, [cryptographer.GetTitledFirstName].\n\n"
 intrigue_scheming.1012.desc_al_kindi:0 "\"Esta fadiga logo acabaria se tivéssemos o trabalho de Al-Kindi em criptografia. Página após página sobre código e criptografia...\""
 intrigue_scheming.1012.desc_archimedes:0 "\"Esta fadiga logo acabaria se tivéssemos Archimedes trabalhando em cifras. Página após página sobre código e criptografia...\""
 intrigue_scheming.1012.desc_ending:0 "\nOs murmúrios d[Select_CString( cryptographer.IsFemale, 'a', 'o' )] [cryptographer.GetTitledFirstName] chegam até mim através de um nevoeiro de sonolência."
 intrigue_scheming.1013.a.tt:0 "Você ganha #T [THIS.Var('intrigue_exp_gain_value').GetValue]#! pontos de [intrigue_rigueint|E]"
 intrigue_scheming.1013.a:0 "Ninguém será capaz de decifrar isso!"
 intrigue_scheming.1013.b.tt:0 "Você ganha #T [THIS.Var('intrigue_exp_gain_value').GetValue]#! pontos de [intrigue_9_14_20_18_9_7_21_5|E]"
 intrigue_scheming.1013.c.tt:0 "Você ganha #T [THIS.Var('intrigue_exp_gain_value').GetValue]#! pontos de [intrigue_lqwuljxh|E]"
 intrigue_scheming.1013.desc_alive:0 "Finalmente, temos algo! Após muitas discussões longas e noites ainda mais longas, [cryptographer.GetTitledFirstName] e eu finalmente chegamos a uma conclusão.\n\n"
 intrigue_scheming.1013.desc_cipher:0 "Um cifra, para que o inimigo acredite que cada mensagem interceptada foi escrita em uma língua estrangeira, nos servirá melhor!"
 intrigue_scheming.1013.desc_dead:0 "Apesar da perda do criptógrafo, finalmente tenho algo!\n\n"
 intrigue_scheming.1013.desc_substitution:0 "Um sistema que substitui letras por números servirá melhor ao nosso propósito, nossos inimigos acharão que é bobagem!"
 intrigue_scheming.1013.desc_transposition:0 "Um sistema bastante básico, que rearranja as letras em uma palavra, nos servirá melhor. É de extrema importância que o destinatário entenda a mensagem sem grandes atrasos."
 intrigue_scheming.1014.a:0 "Que pena..."
 intrigue_scheming.1014.desc_alive:0 "Infelizmente, por mais que eu tentasse, não consegui entender a arte criptográfica arcaica d[Select_CString( cryptographer.IsFemale, 'a', 'o' )] [cryptographer.GetTitledFirstName]. \n\n[Select_CString( cryptographer.IsFemale, 'A', 'O' )] [cryptographer.GetWomanMan] me garante que o código que [cryptographer.GetSheHe] desenvolveu é seguro além de qualquer dúvida, mas não consigo me livrar da sensação de que foi uma oportunidade perdida para aprimorar minhas habilidades."
 intrigue_scheming.1014.desc_dead:0 "Com a morte d[Select_CString( cryptographer.IsFemale, 'a', 'o' )]e [cryptographer.GetTitledFirstName], meus esforços para criar um código secreto para trocar informações sensíveis precisarão ser interrompidos. \n\nSó posso esperar que outra oportunidade de melhorar as defesas da minha [ROOT.Char.Custom('GetCourt')] contra espionagem chegue em breve."
 intrigue_scheming.1201.a:0 "Contratarei um grupo de agentes #EMP discretos#!..."
 intrigue_scheming.1201.b:0 "Minha perspectiva sozinha é suficiente!"
 intrigue_scheming.1201.desc:0 "Uma noite escura pode realmente dar vida às sombras nos corredores do meu [ROOT.Char.Custom('FortifiedBuilding')]. O risco percebido para visitantes não autorizados aumenta a cada canto desprotegido avistado.\n\nSe eu sozinho consigo ver tantas falhas, imagine o que mais pessoas com uma perspectiva semelhante poderiam fazer!"
 intrigue_scheming.1201.t:0 "Em Todos os Cantos"
 intrigue_scheming.1202.a:0 "Já me sinto mais seguro!"
 intrigue_scheming.1202.b.tt:0 "[hired_spy.GetTitledFirstName] permanece em sua corte"
 intrigue_scheming.1202.b:0 "Posso ter uso para alguém com seus talentos."
 intrigue_scheming.1202.c:0 "Essa informação não pode ser amplamente conhecida, é claro."
 intrigue_scheming.1202.desc:0 "\"Então é isso que você deve fazer...\"\n[hired_spy.GetTitledFirstName], um[Select_CString( hired_spy.IsFemale, 'a', 'o' )] #EMP especialista#! nas artes discretas, percorreu todo o meu [ROOT.Char.Custom('FortifiedBuilding')], assustando tanto servos quanto cortesãos ao emergir dos cantos mais escuros.\n\nAgrupados ao redor de suas anotações, um plano detalhado para aumentar a segurança está lentamente tomando forma."
 intrigue_scheming.1401.a.failure:0 "Você não consegue convencer o mercador"
 intrigue_scheming.1401.a.success:0 "Você convence o mercador"
 intrigue_scheming.1401.a.tt:0 "#F Você convence o mercador a compartilhar suas percepções com você.#!"
 intrigue_scheming.1401.a:0 "Deve ser interessante viajar tanto quanto você!"
 intrigue_scheming.1401.b.penalty:0 "Os camponeses ficam irritados com seu comportamento"
 intrigue_scheming.1401.b:0 "[dummy_gender.GetSheHe|U] #EMP irá#! me contar o que [dummy_gender.GetSheHe] sabe!"
 intrigue_scheming.1401.c:0 "Isso deve cobrir tanto o bibelô quanto as informações."
 intrigue_scheming.1401.desc1:0 "Tive que tomar cuidado para tirar essas belezas de lá. Nunca dormindo com os dois olhos fechados."
 intrigue_scheming.1401.desc2:0 "Passei discretamente pelos guardas responsáveis por essas belezuras. Um verdadeiro conhecedor de pessoas, esse sou eu."
 intrigue_scheming.1401.desc3:0 "Tive que me misturar com a população para tirar essas belezas de lá, realmente uma experiência assustadora."
 intrigue_scheming.1401.desc_ending:0 "\n\nEste mercador pode ter mais a me oferecer do que maravilhas de terras distantes."
 intrigue_scheming.1401.desc_opening:0 "Visitando o mercado local, um mercador de terras distantes chama minha atenção.\n\n\"Chegue mais perto, [ROOT.Char.Custom('FormOfAddressForLiege')]! Maravilhe-se com tesouros nunca antes vistos nessas terras!"
 intrigue_scheming.1401.t:0 "Segredos de Terras Distantes"
 intrigue_scheming.1601.a:0 "Um pouco de ouro resolve muita coisa."
 intrigue_scheming.1601.b:0 "Tenho alguém que quero impressionar..."
 intrigue_scheming.1601.c:0 "Não há nada a ser feito. Eu só quero que você se preocupe."
 intrigue_scheming.1601.desc:0 "Eu estaria mentindo se dissesse que não é um pouco prazeroso ver a forma como [Select_CString( blackmailed_vassal.IsFemale, 'a', 'o' )] [blackmailed_vassal.GetTitledFirstName] se contorce quando eu deixo [blackmailed_vassal.GetSheHe] saber o que eu sei.\n\nMe levando para um lugar privado, m[Select_CString( blackmailed_vassal.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('blackmailed_vassal'))] quer saber o que [blackmailed_vassal.GetSheHe] pode fazer a respeito."
 intrigue_scheming.1601.t:0 "O Que Sabemos"
 intrigue_scheming.1801.a:0 "Seria tolice não investigar isso."
 intrigue_scheming.1801.b:0 "Isso não passa de uma extorsão vazia."
 intrigue_scheming.1801.desc:0 "e me entrega uma carta anônima que [spymaster.GetSheHe] acabou de receber. Parece que temos uma oportunidade única de adquirir informações sobre as estratégias defensivas d[Select_CString( enemy.IsFemale, 'a', 'o' )] [enemy.GetTitledFirstName].\n\nA carta diz:\n\n\"Se você deseja informações sobre as defesas d[Select_CString( enemy.IsFemale, 'a', 'o' )] [enemy.GetFirstNameNoTooltip], faça com que seu [spymaster.GetCouncilTitle] [spymaster.GetFirstNameNoTooltip] me encontre em [meeting_place.GetName] dentro de uma quinzena. Traga bastante ouro.\""
 intrigue_scheming.1801.t:0 "Uma Informante Anônima"
 intrigue_scheming.1801_laamp:0 "Meu [GetCourtPositionType('second_camp_officer').GetNameNoTooltip] [Select_CString( spymaster.IsFemale, 'a', 'o' )] [spymaster.GetFirstName] entra apressad[Select_CString( spymaster.IsFemale, 'a', 'o' )] na tenda"
 intrigue_scheming.1801_landed:0 "Meu [spymaster.GetCouncilTitle] [Select_CString( spymaster.IsFemale, 'a', 'o' )] [spymaster.GetFirstName] entra apressad[Select_CString( spymaster.IsFemale, 'a', 'o' )] na sala"
 intrigue_scheming.1802.a:0 "Agir com base nas informações."
 intrigue_scheming.1802.b:0 "Ignorar as informações."
 intrigue_scheming.1802.decent_skill_desc:0 "$intrigue_scheming.1802.intro_desc$\n\nO documento parece genuíno, mas algo parece suspeito... embora eu não consiga identificar exatamente o quê."
 intrigue_scheming.1802.fallback_desc:0 "$intrigue_scheming.1802.intro_desc$\n\nÉ quase impossível dizer se esses planos são genuínos ou não."
 intrigue_scheming.1802.g_high_skill_desc:0 "$intrigue_scheming.1802.intro_desc$\n\nPelo que consigo perceber, esses esquemas dos planos de defesa d[Select_CString( enemy.IsFemale, 'a', 'o' )] [enemy.GetFirstName] parecem tão genuínos quanto poderiam ser."
 intrigue_scheming.1802.g_medium_skill_desc:0 "$intrigue_scheming.1802.intro_desc$\n\nOs esquemas desenhados no pergaminho fazem sentido, mas há algumas discrepâncias que não se encaixam com nosso conhecimento prévio da estratégia típica d[Select_CString( enemy.IsFemale, 'a', 'o' )] [enemy.GetFirstName]."
 intrigue_scheming.1802.intro_desc:0 "[spymaster.GetFirstName] retornou de sua reunião com o informante anônimo. Com uma expressão séria em seu rosto, [spymaster.GetSheHe] espalha um feixe de pergaminhos inscritos com o que parecem ser táticas defensivas do meu inimigo."
 intrigue_scheming.1803.a:0 "Agir com base nas informações."
 intrigue_scheming.1803.b:0 "Ignorar as informações."
 intrigue_scheming.1803.f_high_skill_desc:0 "$intrigue_scheming.1802.intro_desc$\n\nAo examinar o documento, encontro erros gritantes demais nesses planos para que sejam genuínos. Fui enganado!"
 intrigue_scheming.1803.f_medium_skill_desc:0 "$intrigue_scheming.1802.intro_desc$\n\nAlguns dos detalhes descritos nos planos fazem sentido, mas muitos deles não se encaixam com o que sabemos sobre a estratégia defensiva típica d[Select_CString( enemy.IsFemale, 'a', 'o' )] [enemy.GetFirstName]."
 intrigue_scheming.1804.a:0 "Uma boa aquisição, se me perguntarem."
 intrigue_scheming.1804.b:0 "Devemos perseverar!"
 intrigue_scheming.1804.c:0 "Tomei a decisão certa."
 intrigue_scheming.1804.custom_tt:0 "Você e todos os comandantes"
 intrigue_scheming.1804.fake_info_desc:0 "Acabei de receber notícias de minhas forças que estão sitiando a [barony.GetName] em minha guerra contra [Select_CString( enemy.IsFemale, 'a', 'o' )] [enemy.GetTitledFirstName]. Eles relatam que as informações que recebemos do informante anônimo são falsas!\n\nEles conseguiram capturar o [enemy.Custom('FortifiedBuilding')] mesmo assim, mas o caminho à frente será desafiador."
 intrigue_scheming.1804.genuine_info_desc:0 "Acabei de receber notícias de minhas forças que estão sitiando a [barony.GetName] em minha guerra contra [Select_CString( enemy.IsFemale, 'a', 'o' )] [enemy.GetTitledFirstName]. Eles relatam que as informações que recebemos do informante anônimo são genuínas!\n\nCom esse conhecimento interno das táticas defensivas d[Select_CString( enemy.IsFemale, 'a', 'o' )] [enemy.GetFirstName], eles foram capazes de capturar o [enemy.Custom('FortifiedBuilding')] em tempo recorde. A vitória parece quase garantida!"
 intrigue_scheming.1804.rejected_fake_info_desc:0 "Acabei de receber notícias de minhas forças que estão sitiando a [barony.GetName] em minha guerra contra [Select_CString( enemy.IsFemale, 'a', 'o' )] [enemy.GetTitledFirstName]. Eles relatam que as informações que recebemos do informante anônimo são falsas!\n\nGraças a [ROOT.Char.GetFaith.HighGodName], não escolhi agir com base nesses documentos fraudulentos!"
 intrigue_scheming.2001.a:0 "\"Siga em frente.\""
 intrigue_scheming.2001.b:0 "Seria ingênuo confiar em alguém com as habilidades [future_mentor.GetHerHim]."
 intrigue_scheming.2001.desc:0 "\"Notei seu interesse nas artes de... subterfúgio, [ROOT.Char.Custom('FormOfAddressForLiege')]. Posso ser capaz de ajudá-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a aprender ainda mais.\"\n\nM[Select_CString( future_mentor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('future_mentor') )] [future_mentor.GetTitledFirstName] sorri [future_mentor.Custom('quirk_pos_adverb')] enquanto [future_mentor.GetSheHe] se junta a mim em [SelectLocalization( IsLandlessAdventurer(ROOT.Char),ROOT.Char.Custom('GetRandomCampBuilding'),'meus jardins')]. [future_mentor.GetSheHe|U] é tão renomado quanto alguém com esse conjunto de habilidades pode ser, e eu #EMP gostaria#! de aprofundar meu conhecimento em intriga."
 intrigue_scheming.2001.t:0 "O Professor"
 intrigue_scheming.2101.a:0 "Eu posso ter alguma utilidade para você."
 intrigue_scheming.2101.b:0 "Você não é a pessoa certa para o trabalho."
 intrigue_scheming.2101.desc:0 "\"Chamou minha atenção, [ROOT.Char.Custom('FormOfAddressForLiege')], que você pode estar precisando de alguém com... talentos assim.\" [Select_CString( sneaky_person.IsFemale, 'Minha nova conhecida', 'Meu novo conhecido' )], [sneaky_person.GetTitledFirstName], se aproxima de mim, sorrindo.\n\n\"Se meus serviços puderem ser úteis, por favor, não hesite em solicitá-los.\""
 intrigue_scheming.2101.t:0 "Perspectiva Intrigante"
 intrigue_scheming.2102.a.tt:0 "[sneaky_person.GetSheHe|U] não percebe sua investigação"
 intrigue_scheming.2102.a:0 "[sneaky_person.GetFirstNameNoTooltip], o que você está aprontando?!"
 intrigue_scheming.2102.b.tt:0 "[sneaky_person.GetSheHe|U] percebe que você está investigando [sneaky_person.GetSheHe]"
 intrigue_scheming.2102.b:0 "Provavelmente não é nada."
 intrigue_scheming.2102.desc:0 "Eu fico nas sombras do [ROOT.Char.Custom('GetCourtyard')], observando [Select_CString( sneaky_person.IsFemale, 'minha nova', 'meu novo' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sneaky_person') )], [sneaky_person.GetTitledFirstName], desaparecer na noite.\n\nOutra noite, outro encontro misterioso, e minha suspeita em relação [Select_CString( sneaky_person.IsFemale, 'a', 'ao' )] [sneaky_person.GetWomanMan] só aumenta."
 intrigue_scheming.2102.t:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sneaky_person') )|U], [Select_CString( sneaky_person.IsFemale, 'a', 'o' )] Leal"
 intrigue_scheming.2103.a:0 "Para as masmorras com [sneaky_person.GetSheHe]!"
 intrigue_scheming.2103.b:0 "Expulse [sneaky_person.GetSheHe]."
 intrigue_scheming.2103.c:0 "Todos nós temos nossas... #EMP necessidades#! Eu suponho."
 intrigue_scheming.2103.desc_not_noticed:0 "\"[sneaky_person.GetSheHe|U] está trabalhando para [Select_CString( sneaky_person_scheme_owner.IsFemale, 'a', 'o' )] [sneaky_person_scheme_owner.GetTitledFirstName]?!\"\n\nNos [ROOT.Char.Custom('GetChamberPlural')] d[Select_CString( sneaky_person.IsFemale, 'a', 'o' )] [sneaky_person.GetTitledFirstName], encontro uma carta que não deixa espaço para mal-entendidos. [sneaky_person.GetSheHe|U] esteve conspirando contra mim, desempenhando o papel d[Select_CString( sneaky_person.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sneaky_person') )] leal apenas como disfarce."
 intrigue_scheming.2103.desc_noticed:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], o que posso fazer por você?\"\n\nApesar dos meus melhores esforços, não parece haver nada de sinistro em relação [Select_CString( sneaky_person.IsFemale, 'a', 'ao' )] [sneaky_person.GetTitledFirstName], exceto por seus estranhos hábitos noturnos."
 intrigue_scheming.3001.a.tt:0 "Se [Select_CString( new_target.IsFemale, 'a', 'o' )] [new_target.GetFirstNameNoTooltip] tiver Segredos:\n Revele um dos Segredos [new_target.GetHerHim] a você"
 intrigue_scheming.3001.a:0 "Enviarei [Select_CString( hooked_courtier.IsFemale, 'a', 'o' )] [hooked_courtier.GetFirstNameNoTooltip] como um espião pessoal!"
 intrigue_scheming.3001.b.failure:0 "Calúnia descoberta"
 intrigue_scheming.3001.b.success:0 "Segredo fabricado"
 intrigue_scheming.3001.b.success_tt:0 "[hooked_courtier.GetFirstNameNoTooltip] \"encontra\" \"provas\" de um dos Segredos d[Select_CString( new_target.IsFemale, 'a', 'o' )] [new_target.GetFirstNameNoTooltip]"
 intrigue_scheming.3001.b.tt:0 "Se [Select_CString( new_target.IsFemale, 'a', 'o' )] [new_target.GetFirstNameNoTooltip] tiver Segredos:\n Revele um dos Segredos [new_target.GetHerHim] a você\nSe não:"
 intrigue_scheming.3001.b:0 "Aqui está como você vai descobrir os segredos d[Select_CString( new_target.IsFemale, 'a', 'o' )] [new_target.GetFirstNameNoTooltip] com certeza..."
 intrigue_scheming.3001.c.failure.tt:0 "[new_target.GetFirstNameNoTooltip] descobre seu envolvimento no assassinato"
 intrigue_scheming.3001.c.failure:0 "Armadilha descoberta"
 intrigue_scheming.3001.c.failure_secret:0 "Armadilha falhou"
 intrigue_scheming.3001.c.success:0 "Assassinato encenado"
 intrigue_scheming.3001.c:0 "Você é a chave para uma bela armadilha, [hooked_courtier.GetFirstNameNoTooltip]!"
 intrigue_scheming.3001.d.failure:0 "Ameaças Vazias"
 intrigue_scheming.3001.d.success:0 "Minha Reputação me Precede"
 intrigue_scheming.3001.d:0 "Deixe claro como é fácil para mim alcançar [new_target.GetSheHe]."
 intrigue_scheming.3001.desc:0 "[hooked_courtier.GetTitledFirstName], [new_target.Custom2('RelationToMe', SCOPE.sC('hooked_courtier'))] d[Select_CString( new_target.IsFemale, 'a', 'o' )] [new_target.GetFirstName], está firmemente em minhas mãos. No entanto, com a estratégia certa, posso aumentar ainda mais minha vantagem.\n\nTalvez [Select_CString( hooked_courtier.IsFemale, 'a', 'o' )] [hooked_courtier.GetFirstName] possa ser usado para estender minha influência sobre [new_target.GetTitleTierName]?"
 intrigue_scheming.3001.t:0 "Criados e Mestres"
 intrigue_scheming.3001.z:0 "Espalhe alguns rumores sobre o quão aterrorizante eu sou."
 intrigue_scheming.3003.a:0 "Não foi tão ruim quanto você esperava, não é mesmo?"
 intrigue_scheming.3003.b:0 "E agora, a chantagem..."
 intrigue_scheming.3003.desc:0 "[hooked_courtier.GetTitledFirstName] fez seu trabalho bem! Agora sei do segredo d[Select_CString( new_target.IsFemale, 'a', 'o' )] [new_target.GetTitledFirstName], e a dívida d[Select_CString( hooked_courtier.IsFemale, 'a', 'o' )] [hooked_courtier.GetFirstName] comigo está paga."
 intrigue_scheming.3004.a:0 "Será que não sou tão intimidador quanto eu pensava?"
 intrigue_scheming.3004.desc:0 "[hooked_courtier.GetTitledFirstName] não conseguiu encontrar nenhuma informação comprometedora sobre [Select_CString( new_target.IsFemale, 'a', 'o' )] [new_target.GetTitledFirstName]. Apesar disso, o tolo insiste que, com seus esforços, a dívida comigo está paga!"
 intrigue_scheming.3013.a:0 "[ROOT.Char.GetFaith.TricksterGodName] ajuda aqueles que se ajudam."
 intrigue_scheming.3013.desc:0 "[hooked_courtier.GetTitledFirstName] não conseguiu encontrar nenhuma informação comprometedora sobre [Select_CString( new_target.IsFemale, 'a', 'o' )] [new_target.GetTitledFirstName], então foi bom eu mesmo ter preparado. De repente, [new_target.GetFirstName] parece ser alvo de rumores maliciosos, e eu tenho todas as evidências."
 intrigue_scheming.3014.a:0 "O que são algumas mentiras inofensivas entre amigos?"
 intrigue_scheming.3014.desc:0 "[hooked_courtier.GetTitledFirstName] não conseguiu encontrar nenhuma informação comprometedora sobre [Select_CString( new_target.IsFemale, 'a', 'o' )] [new_target.GetTitledFirstName]. Infelizmente, os rumores que plantei cuidadosamente parecem ter ganhado pouca credibilidade, e ninguém acreditaria nas acusações que eu estava pronta para fazer contra o [new_target.GetTitleTierName]. Além disso, os falsos rumores foram rastreados até mim!"
 intrigue_scheming.3021.a:0 "Eu adoro presentear as pessoas!"
 intrigue_scheming.3021.desc:0 "Os gritos podiam ser ouvidos por todo o [new_target.Custom('ResidenceBuilding')]. Os serviçais apressados deixaram [Select_CString( new_target.IsFemale, 'a', 'o' )] [new_target.GetTitledFirstName] confus[Select_CString( new_target.IsFemale, 'a', 'o' )], olhando para o cadáver ensanguentado d[Select_CString( hooked_courtier.IsFemale, 'a', 'o' )] [hooked_courtier.GetTitledFirstName] em seus [new_target.Custom('GetChamberPlural')], com uma faca ao lado.\n\n\"Eu estava no jardim sozinho, você precisa acreditar em mim!\" [new_target.GetSheHe] insiste perante a multidão de cortesãos. Quem acreditaria em uma desculpa tão frágil?"
 intrigue_scheming.3022.a:0 "Eu o mataria se já não tivesse feito isso!"
 intrigue_scheming.3022.desc:0 "Minha tentativa de incriminar [Select_CString( new_target.IsFemale, 'a', 'o' )] [new_target.GetTitledFirstName] terminou em desastre! [hooked_courtier.GetFirstName] ainda estava respirando quando os serviçais encontraram [hooked_courtier.GetSheHe] sangrando nos [new_target.Custom('GetChamberPlural')] do [new_target.GetTitleTierName].\n\nQuando [Select_CString( new_target.IsFemale, 'a', 'o' )] [new_target.GetFirstName] chegou, [hooked_courtier.GetFirstName] tinha apenas um fôlego restante. \"[ROOT.Char.GetTitledFirstName]...\""
 intrigue_scheming.3023.a:0 "Que desperdício de uma boa vítima!"
 intrigue_scheming.3023.desc:0 "Era para ser perfeito, mas... [hooked_courtier.GetTitledFirstName] seria encontrad[Select_CString( hooked_courtier.IsFemale, 'a', 'o' )] nos [new_target.Custom('GetChamberPlural')] do [new_target.GetTitleTierName], com a garganta cortada pela faca do [new_target.GetTitleTierName], em um momento em que o [new_target.GetTitleTierName] não tinha um álibi. No entanto, meia dúzia de serviçais podem confirmar que [Select_CString( new_target.IsFemale, 'a', 'o' )] [new_target.GetTitledFirstName] estava cavalgando naquele dia, tornando impossível [new_target.GetSheHe] ser o assassino."
 intrigue_scheming.3031.a:0 "Quase uma pena. Eu gosto de convencer as pessoas..."
 intrigue_scheming.3031.desc:0 "Minha reputação de conseguir o que quero, a qualquer custo, me beneficia muito. Com muitos dos meus vassalos e serviçais temendo-me, não é difícil convencer os outros a fazer o mesmo.\n\nFoi o bastante para [Select_CString( hooked_courtier.IsFemale, 'a', 'o' )] [hooked_courtier.GetTitledFirstName] encontrar [Select_CString( new_target.IsFemale, 'a', 'o' )] [new_target.GetTitledFirstName] sozinh[Select_CString( new_target.IsFemale, 'a', 'o' )] uma noite e entregar-lhe uma carta com o meu selo. O [new_target.GetTitleTierName] entende o quão facilmente posso alcançá-lo."
 intrigue_scheming.3032.a:0 "Talvez eu mostre a você o quão vazias elas realmente são..."
 intrigue_scheming.3032.desc:0 "[hooked_courtier.GetTitledFirstName] encontrou [Select_CString( new_target.IsFemale, 'a', 'o' )] [new_target.GetTitledFirstName] sozinh[Select_CString( new_target.IsFemale, 'a', 'o' )] uma noite e entregou-lhe uma carta com o meu selo, para deixar claro o quão longe eu alcanço. No entanto, não teve o efeito desejado. Em vez disso, o [new_target.GetTitleTierName] rapidamente passou a gostar de contar a todos sobre as minhas \"ameaças vazias\"!"
 intrigue_scheming.3041.a.failure:0 "Sem Impressionar"
 intrigue_scheming.3041.a.success:0 "Medo das Consequências"
 intrigue_scheming.3041.a:0 "Um senhor feudal é responsável pelas ações de seus vassalos..."
 intrigue_scheming.3041.b.failure:0 "[liege_target.GetFirstNameNoTooltip] não se intimida"
 intrigue_scheming.3041.b.success:0 "Mão firme sempre funciona!"
 intrigue_scheming.3041.b.torture_desc:0 "[vassal_target.GetFirstNameNoTooltip] pode não sair ileso dessa"
 intrigue_scheming.3041.b:0 "[vassal_target.GetFirstNameNoTooltip] vai ajudar a fazer [liege_target.GetSheHe] temer-me!"
 intrigue_scheming.3041.c:0 "Não preciso de ajuda para alcançar meus objetivos."
 intrigue_scheming.3041.desc:0 "Embora eu aprecie a prontidão com que [Select_CString( vassal_target.IsFemale, 'a', 'o' )] [vassal_target.GetTitledFirstName] faz o que eu ordeno, [liege_target.GetTitledFirstName], s[Select_CString( liege_target.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('liege_target'))] [liege_target.GetTitledFirstName], permanece fora do meu alcance. [vassal_target.GetFirstName] é exatamente a pessoa para me ajudar a mudar isso, no entanto."
 intrigue_scheming.3041.t:0 "O Peso da Influência"
 intrigue_scheming.3042.a:0 "Agora, o que eu gostaria que você fizesse..."
 intrigue_scheming.3042.desc:0 "[liege_target.GetTitledFirstName] olha espantad[Select_CString( liege_target.IsFemale, 'a', 'o' )], como se a traição d[Select_CString( vassal_target.IsFemale, 'a', 'o' )] [vassal_target.GetTitledFirstName] fosse uma #EMP total#! surpresa. \"Você está disposto a apoiar qualquer demanda feita por esse... ess[Select_CString( ROOT.Char.IsFemale, 'a', 'e' )] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('liege_target'))]?!\"\n\n[vassal_target.GetFirstName] concorda, acenando com a cabeça severamente - conforme planejado. Eu sorrio para o meu futuro novo peão. \"Não acredite nem por um momento que [vassal_target.GetSheHe] está sozinh[Select_CString( vassal_target.IsFemale, 'a', 'o' )].\""
 intrigue_scheming.3043.a:0 "Parece que exagerei nas minhas ações..."
 intrigue_scheming.3043.desc:0 "\"Não acredite que eu possa ser coagido tão facilmente!\" [liege_target.GetTitledFirstName] proclama. [vassal_target.GetTitledFirstName] parece encolher diante [liege_target.GetHerHim], não mais cheio de confiança para apoiar minhas demandas.\n\nO [liege_target.GetTitleTierName] acaba com minhas últimas esperanças. \"Meus [liege_target.Custom('GetFollowerOrVassalPlural')] sabem o seu lugar.\" [vassal_target.GetFirstName] confirma com seu silêncio."
 intrigue_scheming.3051.a:0 "Que demonstração horrível!"
 intrigue_scheming.3051.b:0 "Aprendi tanto!"
 intrigue_scheming.3051.desc:0 "Eu havia atraído [Select_CString( liege_target.IsFemale, 'a', 'o' )] [liege_target.GetTitledFirstName] para a masmorra d[Select_CString( vassal_target.IsFemale, 'a', 'o' )] [vassal_target.GetTitledFirstName], a convite do [vassal_target.GetTitleTierName]. Lá eu estava esperando, pronto para torturar nosso anfitrião em uma demonstração de meu poder. [liege_target.GetFirstName] não reagiu como eu esperava.\n\n\"Parece que você nunca fez isso antes!\"\nEu assisti chocado enquanto [liege_target.GetSheHe] assumia o controle e fazia [Select_CString( vassal_target.IsFemale, 'a', 'o' )] [vassal_target.GetFirstName] durar até o amanhecer. Mas não mais."
 intrigue_scheming.3052.a:0 "Mesmo com os gritos d[Select_CString( vassal_target.IsFemale, 'a', 'o' )] [vassal_target.GetFirstNameNoTooltip], [liege_target.GetFirstNameNoTooltip] entendeu o recado."
 intrigue_scheming.3052.desc:0 "Eu havia atraído [Select_CString( liege_target.IsFemale, 'a', 'o' )] [liege_target.GetTitledFirstName] para a masmorra d[Select_CString( vassal_target.IsFemale, 'a', 'o' )] [vassal_target.GetTitledFirstName], a convite do [vassal_target.GetTitleTierName]. Lá eu esperava para revelar que nosso anfitrião era um prisioneiro em sua própria casa.\n\nEu posso ter me empolgado um pouco com a vida do [vassal_target.GetTitleTierName] em minhas mãos, mas transformei isso em uma mensagem delicada sobre como espero obediência total."
 intrigue_scheming.3053.a:0 "Mesmo os apelos d[Select_CString( vassal_target.IsFemale, 'a', 'o' )] [vassal_target.GetFirstNameNoTooltip] por misericórdia não me alegram depois disso."
 intrigue_scheming.3053.desc:0 "Eu havia atraído [Select_CString( liege_target.IsFemale, 'a', 'o' )] [liege_target.GetTitledFirstName] para a masmorra d[Select_CString( vassal_target.IsFemale, 'a', 'o' )] [vassal_target.GetTitledFirstName], a convite do [vassal_target.GetTitleTierName]. Lá eu esperava para revelar que nosso anfitrião era um prisioneiro em sua própria casa.\n\n[liege_target.GetFirstName] não ficou intimidad[Select_CString( liege_target.IsFemale, 'a', 'o' )] com minha demonstração de tortura como eu esperava. \"Seu tipo degenerado nunca me assustará, [ROOT.Char.GetTitledFirstName]!\""
 intrigue_scheming.3061.a.success_tt:0 "Eu serei capaz de revelar [Select_CString( heir.IsFemale, 'a', 'o' )] [heir.GetTitledFirstNameNoTooltip] como [Select_CString( heir.IsFemale, 'a', 'o' )] bastard[Select_CString( heir.IsFemale, 'a', 'o' )] d[Select_CString( new_father.IsFemale, 'a', 'o' )] [new_father.GetTitledFirstNameNoTooltip]"
 intrigue_scheming.3061.a:0 "[new_father.GetTitledFirstNameNoTooltip] seria um excelente pai."
 intrigue_scheming.3061.b.success_tt:0 "Eu serei capaz de revelar [Select_CString( heir.IsFemale, 'a', 'o' )] [heir.GetTitledFirstNameNoTooltip] como [Select_CString( heir.IsFemale, 'a', 'o' )] bastard[Select_CString( heir.IsFemale, 'a', 'o' )] d[Select_CString( commoner_target.IsFemale, 'a', 'o' )] [commoner_target.GetTitledFirstNameNoTooltip]"
 intrigue_scheming.3061.b:0 "[mother.GetTitledFirstNameNoTooltip] se envolveu com um servo?! Que vergonha!"
 intrigue_scheming.3061.c.success_tt:0 "Eu serei capaz de revelar [Select_CString( heir.IsFemale, 'a', 'o' )] [heir.GetTitledFirstNameNoTooltip] como [Select_CString( heir.IsFemale, 'minha', 'meu' )] bastard[Select_CString( heir.IsFemale, 'a', 'o' )]"
 intrigue_scheming.3061.c:0 "E eu terei o papel principal!"
 intrigue_scheming.3061.d:0 "Toda essa história dinástica pode ser útil para outra coisa."
 intrigue_scheming.3061.desc:0 "Há dias tenho me obcecado pela linhagem da família [target.GetDynasty.GetBaseName], e agora tenho certeza. Não há como [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName] provar conclusivamente a paternidade [Select_CString( heir.IsFemale, 'da sua', 'do seu' )] [target.Custom2('RelationToMe', SCOPE.sC('heir'))], [heir.GetTitledFirstName]!\n\nOnde há falta de evidências, evidências podem ser plantadas... É hora de escrever uma nova verdade para a origem d[Select_CString( heir.IsFemale, 'a', 'o' )] [heir.GetFirstName]!"
 intrigue_scheming.3061.failure:0 "Desrespeito às Linhagens"
 intrigue_scheming.3061.success:0 "Novas Evidências"
 intrigue_scheming.3061.t:0 "Herança Confusa"
 intrigue_scheming.3062.a:0 "Vou tornar minha \"evidência\" pública!"
 intrigue_scheming.3062.b.tt:0 "#F Você vai guardar esse \"segredo\" por enquanto#!"
 intrigue_scheming.3062.b:0 "O momento ainda não é adequado."
 intrigue_scheming.3062.ending:0 "Meus agentes relatam que até mesmo [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName] olha para [Select_CString( heir.IsFemale, 'a', 'o' )] [heir.GetTitledFirstName] com dúvida nos olhos e [Select_CString( new_father.IsFemale, 'a', 'o' )] [new_father.GetTitledFirstName] com desconfiança."
 intrigue_scheming.3062.opening:0 "Os rumores começaram a circular, exatamente como eu esperava. Ninguém pode afirmar nada com certeza, é claro — esse é o ponto!"
 intrigue_scheming.3063.a:0 "Eu protesto! Não sinto vergonha nenhuma!"
 intrigue_scheming.3063.ending:0 "\n\n[target.GetTitledFirstName] também parece não acreditar que possa haver qualquer verdade nos meus rumores, e me denunciou como um mentiroso vergonhoso que não respeita a ordem correta das coisas."
 intrigue_scheming.3063.opening:0 "\"Hah, esses rumores são absurdos! É simplesmente [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitledFirstName] espalhando mentiras vis.\"\n\nMeus agentes relatam que [Select_CString( new_father.IsFemale, 'a', 'o' )] [new_father.GetTitledFirstName] negou qualquer acusação de que [Select_CString( heir.IsFemale, 'a', 'o' )] [heir.GetTitledFirstName] possa ser [Select_CString( heir.IsFemale, 'a', 'o' )] [heir.Custom('GetDaughterSon')] [target.GetHerHim]."
 intrigue_scheming.3064.ending:0 "Meus agentes relatam que até mesmo [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName] está em dúvida e vê [Select_CString( mother.IsFemale, 'a', 'o' )] [mother.GetTitledFirstName], [heir.GetTitledFirstName] e [Select_CString( commoner_target.IsFemale, 'a', 'o' )] [commoner_target.GetTitledFirstName] com desconfiança."
 intrigue_scheming.3065.opening:0 "\"Como se eu permitiria que um plebeu como [Select_CString( commoner_target.IsFemale, 'a', 'o' )] [commoner_target.GetTitledFirstName] encostasse em mim.\"\n\nMeus agentes relatam que [Select_CString( mother.IsFemale, 'a', 'o' )] [mother.GetTitledFirstName] não perdeu tempo em negar os rumores que eu estava tentando espalhar sobre [mother.GetSheHe]."
 intrigue_scheming.3066.a:0 "Venha cá, [heir.GetFirstNameNoTooltip]!"
 intrigue_scheming.3066.b:0 "Tudo a seu tempo. Tudo a seu tempo."
 intrigue_scheming.3066.desc:0 "As datas, as viagens, o potencial para encontros secretos... Está tudo lá, e com os rumores que plantei, até mesmo [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName] está sentindo alguma dúvida sobre a paternidade d[Select_CString( heir.IsFemale, 'a', 'o' )] [heir.GetTitledFirstName].\n\nÉ apenas uma questão de tempo antes que alguém conclua que sou um candidato provável..."
 intrigue_scheming.3067.a:0 "Parece que subestimei meus oponentes..."
 intrigue_scheming.3067.opening:0 "Por todos os rumores que espalhei sobre [mother.GetSheHe], não esperava ver [Select_CString( mother.IsFemale, 'a', 'o' )] [mother.GetTitledFirstName] pessoalmente.\n\n\"Como você se atreve a dizer essas coisas vis sobre mim e [Select_CString( heir.IsFemale, 'minha', 'meu' )] [heir.Custom('GetDaughterSon')]?!\" As palavras [mother.GetHerHim] não doem tanto quanto o tapa inesperado em meu rosto. \"Isso é o mais perto que você chegará do meu toque!\""
 intrigue_scheming.4021.a.failure:0 "[prisoner.GetTitledFirstName] rejeita minha oferta"
 intrigue_scheming.4021.a.success:0 "[prisoner.GetTitledFirstName] aceita minha oferta"
 intrigue_scheming.4021.a:0 "Oferecer a liberdade [prisoner.GetHerHim] em troca de informações."
 intrigue_scheming.4021.b.failure:0 "[prisoner.GetTitledFirstName] consegue resistir aos meus truques mentais"
 intrigue_scheming.4021.b.success:0 "Engano [Select_CString( prisoner.IsFemale, 'a', 'o' )] [prisoner.GetTitledFirstName] a revelar o que [prisoner.GetSheHe] sabe"
 intrigue_scheming.4021.b:0 "Jogos mentais frequentemente revelam muito..."
 intrigue_scheming.4021.c.failure:0 "Minhas ameaças não parecem abalar [Select_CString( prisoner.IsFemale, 'a', 'o' )] [prisoner.GetTitledFirstName]"
 intrigue_scheming.4021.c.success:0 "Minhas ameaças assustam [Select_CString( prisoner.IsFemale, 'a', 'o' )] [prisoner.GetTitledFirstName] a confessar"
 intrigue_scheming.4021.c:0 "Ameaçar torturar [prisoner.GetSheHe] a menos que [prisoner.GetSheHe] confesse!"
 intrigue_scheming.4021.desc:0 "Com base nas informações que reuni, suspeito fortemente que [Select_CString( prisoner.IsFemale, 'a', 'o' )] [prisoner.GetTitledFirstName] sabe de um segredo do qual eu não tenho conhecimento. Como atualmente mantenho [prisoner.GetSheHe] como prisioneiro, isso me dá a oportunidade perfeita de usar os métodos que eu quiser para descobrir exatamente o que é..."
 intrigue_scheming.4021.failure:0 "Não descubro nada de importante"
 intrigue_scheming.4021.success:0 "Descubro um [secret|E] que [Select_CString( prisoner.IsFemale, 'a', 'o' )] [prisoner.GetTitledFirstName] sabe"
 intrigue_scheming.4021.t:0 "Interrogatório"
 intrigue_scheming.4040.a.failure.tt:0 "Os rumores que você espalhou em sua [ROOT.Char.Custom('GetCourt')] foram considerados como bobagens sem sentido"
 intrigue_scheming.4040.a.failure:0 "Os rumores são considerados como bobagens sem sentido"
 intrigue_scheming.4040.a.success.desc:0 "Os rumores que espalhei em minha [ROOT.Char.Custom('GetCourt')] criaram desconfiança entre vários de meus [ROOT.Char.Custom('GetCourtierPlural')]"
 intrigue_scheming.4040.a.success.tt:0 "[courtier_1.GetFirstName], [courtier_2.GetFirstName] e [Select_CString( courtier_3.IsFemale, 'a', 'o' )] [courtier_3.GetFirstName] perdem #N [EmptyScope.ScriptValue('medium_positive_opinion')|N0]#! [opinion|E] uns dos outros."
 intrigue_scheming.4040.a.success:0 "Os rumores fazem com que meus [ROOT.Char.Custom('GetCourtierPlural')] desconfiem uns dos outros"
 intrigue_scheming.4040.a:0 "Começarei a espalhar rumores imediatamente!"
 intrigue_scheming.4040.b:0 "Desde que eu coloque alguns espiões entre eles, estarei seguro."
 intrigue_scheming.4040.c.dread.tt:0 "Essa opção está disponível devido ao seu alto [dread|E]."
 intrigue_scheming.4040.c.dread:0 "Meus [ROOT.Char.Custom('GetCourtierPlural')] já sabem que não devem conspirar contra mim!"
 intrigue_scheming.4040.desc:0 "É um fato bem conhecido que os [ROOT.Char.Custom('GetCourtierPlural')] conspiram e tramam, mas talvez eu possa usar isso a meu favor.\n\nSe eu puder manter meus cortesãos suspeitos uns dos outros e ocupados com conflitos internos, eles não terão tempo nem recursos para conspirar contra mim!"
 intrigue_scheming.4040.t:0 "Suspeita Passageira"
 intrigue_scheming.4050.a:0 "Venderei as informações para [buyer.GetSheHe] por ouro."
 intrigue_scheming.4050.b.tt:0 "[buyer.GetTitledFirstName] revelará um segredo que [buyer.GetSheHe] conhece para você"
 intrigue_scheming.4050.b:0 "Um segredo por um segredo é uma troca justa."
 intrigue_scheming.4050.c.opinion:0 "A boa vontade [buyer.GetHerHim|U] é o único pagamento que preciso."
 intrigue_scheming.4050.c.rival:0 "Que isso sirva como uma oferta de paz entre nós."
 intrigue_scheming.4050.c:0 "Contarei a [buyer.GetSheHe] apenas em troca de um favor."
 intrigue_scheming.4050.d:0 "O conhecimento é poder, e não o darei tão facilmente."
 intrigue_scheming.4050.desc.bastard:0 "[target.GetTitledFirstName] é na verdade filho d[Select_CString( target.GetRealFather.IsFemale, 'a', 'o' )] [target.GetRealFather.GetTitledFirstName]..."
 intrigue_scheming.4050.desc.end:0 "\n\nTalvez [buyer.GetSheHe] esteja interessado o suficiente para me oferecer algo substancial em troca?"
 intrigue_scheming.4050.desc.incest:0 "[buyer.GetSheHe] e [Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstName] d[Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetFirstNameNoTooltip], [owner.Custom2('RelationToMeShort', SCOPE.sC('target'))], [target.GetTitledFirstName] estão tendo relações sexuais uns com os outros..."
 intrigue_scheming.4050.desc.lover:0 "[buyer.GetSheHe] está dormindo com [Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstName]..."
 intrigue_scheming.4050.desc.murder:0 "[owner.GetTitledFirstName] foi [Select_CString( owner.IsFemale, 'a', 'o' )] assassin[Select_CString( owner.IsFemale, 'a', 'o' )] d[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName], [buyer.Custom2('RelationToMeShort', SCOPE.sC('target'))] d[Select_CString( buyer.IsFemale, 'a', 'o' )] [buyer.GetTitledFirstName]..."
 intrigue_scheming.4050.desc.murderattempt:0 "[owner.GetTitledFirstName] estava por trás de uma trama fracassada para assassinar [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName]..."
 intrigue_scheming.4050.desc.murderattemptself:0 "[owner.GetTitledFirstName] estava por trás de uma trama fracassada para me assassinar..."
 intrigue_scheming.4050.desc.pregnancy:0 "[buyer.GetSheHe] está grávida do filho d[Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstName]..."
 intrigue_scheming.4050.desc.start:0 "Eu suspeito que [Select_CString( buyer.IsFemale, 'a', 'o' )] [buyer.GetTitledFirstName] estaria bastante interessado nas informações que adquiri, indicando"
 intrigue_scheming.4050.failure:0 "[buyer.GetTitledFirstName] rejeita sua oferta"
 intrigue_scheming.4050.success:0 "[buyer.GetTitledFirstName] aceita sua oferta"
 intrigue_scheming.4050.t:0 "Corretagem de Informações"
 intrigue_scheming.4051.a.opinion:0 "Realmente muito generoso!"
 intrigue_scheming.4051.a.tt:0 "Você descobre os detalhes desse segredo desconhecido"
 intrigue_scheming.4051.a:0 "Eu preciso saber a verdade!"
 intrigue_scheming.4051.b:0 "Algumas pedras são melhor deixadas intocadas..."
 intrigue_scheming.4051.desc.bastard:0 "que a continuidade da legitimidade de minha linhagem está em risco, a menos que eu tome medidas."
 intrigue_scheming.4051.desc.favor:0 "em troca de um favor a ser prestado futuramente."
 intrigue_scheming.4051.desc.gold:0 "em troca de uma quantia em ouro."
 intrigue_scheming.4051.desc.incest:0 "a existência de relações incestuosas dentro da minha própria família!"
 intrigue_scheming.4051.desc.lover:0 "que alguém de minha família próxima está tendo um caso extraconjugal."
 intrigue_scheming.4051.desc.middle:0 "\n\n[seller.GetSheHe|U] se ofereceu para me fornecer tudo o que [seller.GetSheHe] sabe, incluindo nomes e evidências,"
 intrigue_scheming.4051.desc.murder:0 "quem foi o assassino [Select_CString( target.IsFemale, 'da minha', 'do meu' )] [buyer.Custom2('RelationToMeShort', SCOPE.sC('target'))] [target.GetTitledFirstName]."
 intrigue_scheming.4051.desc.murderattempt:0 "quem estava por trás de uma trama de assassinato fracassada contra [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName]."
 intrigue_scheming.4051.desc.murderattemptself:0 "quem estava por trás de uma trama de assassinato fracassada contra mim."
 intrigue_scheming.4051.desc.opinion:0 "como um gesto de boa vontade."
 intrigue_scheming.4051.desc.rival:0 "como uma oferta de paz entre nós, para que possamos deixar nossa rixa de lado."
 intrigue_scheming.4051.desc.secret:0 "em troca dos detalhes de outro segredo que eu sei."
 intrigue_scheming.4051.desc.start:0 "[seller.GetTitledFirstName] se aproximou de mim, afirmando que [seller.GetSheHe] descobriu"
 intrigue_scheming.4052.a:0 "Há muito potencial aqui!"
 intrigue_scheming.4052.desc:0 "Com o atrativo dos segredos que eu detinha sendo irresistível, [buyer.GetTitledFirstName] concordou com minha oferta. Se eu continuar bisbilhotando por aí, posso conseguir mais acordos como este no futuro..."
 intrigue_scheming.4053.a:0 "Terei que encontrar outras maneiras de usar essas informações..."
 intrigue_scheming.4053.desc:0 "Se [Select_CString( buyer.IsFemale, 'a', 'o' )] [buyer.GetTitledFirstName] acreditou ou não em mim quando disse que tinha informações sobre a família [buyer.GetHerHim], é difícil dizer; seja como for, [buyer.GetSheHe] recusou-se a concordar com meus termos, me deixando de mãos vazias."
 intrigue_scheming.4054.a.bastard:0 "Fui traído!"
 intrigue_scheming.4054.a.incest.accepted:0 "O que há de errado com isso, exatamente?"
 intrigue_scheming.4054.a.incest.deviant:0 "Uau, muito atraente!"
 intrigue_scheming.4054.a.incest:0 "Inatural! Uma afronta a [ROOT.Char.GetFaith.HighGodName]!"
 intrigue_scheming.4054.a.murder:0 "Maldito traidor!"
 intrigue_scheming.4054.a:0 "Pelo menos agora eu sei."
 intrigue_scheming.4054.desc.bastard:0 "que m[Select_CString( target.IsFemale, 'inha', 'eu' )] [buyer.Custom2('RelationToMeShort', SCOPE.sC('target'))], [target.GetTitledFirstName], na verdade é filh[Select_CString( target.IsFemale, 'a', 'o' )] d[Select_CString( target.GetRealFather.IsFemale, 'a', 'o' )] [target.GetRealFather.GetTitledFirstName]!"
 intrigue_scheming.4054.desc.incest:0 "que m[Select_CString( owner.IsFemale, 'inha', 'eu' )] [buyer.Custom2('RelationToMeShort', SCOPE.sC('owner'))], [owner.GetTitledFirstName], e m[Select_CString( target.IsFemale, 'inha', 'eu' )] [buyer.Custom2('RelationToMeShort', SCOPE.sC('target'))], [target.GetTitledFirstName], têm relações sexuais entre eles!"
 intrigue_scheming.4054.desc.lover:0 "que m[Select_CString( owner.IsFemale, 'inha', 'eu' )] [buyer.Custom2('RelationToMeShort', SCOPE.sC('owner'))], [owner.GetTitledFirstName], está dormindo com [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName]!"
 intrigue_scheming.4054.desc.murder:0 "que [Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstName] foi [Select_CString( owner.IsFemale, 'a', 'o' )] assassin[Select_CString( owner.IsFemale, 'a', 'o' )] [Select_CString( target.IsFemale, 'da minha', 'do meu' )] [buyer.Custom2('RelationToMeShort', SCOPE.sC('target'))], [target.GetTitledFirstName]!"
 intrigue_scheming.4054.desc.murderattempt:0 "que [Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstName] estava por trás de uma trama fracassada para assassinar [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName]!"
 intrigue_scheming.4054.desc.murderattemptself:0 "que [Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstName] estava por trás de uma trama fracassada para me assassinar!"
 intrigue_scheming.4054.desc.pregnancy:0 "que m[Select_CString( owner.IsFemale, 'inha', 'eu' )] [buyer.Custom2('RelationToMeShort', SCOPE.sC('owner'))], [owner.GetTitledFirstName], está grávida do filho d[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName]!"
 intrigue_scheming.4054.desc.start:0 "Após examinar os documentos que recebi d[Select_CString( seller.IsFemale, 'a', 'o' )] [seller.GetTitledFirstName], fica claro"
 intrigue_scheming_focus_point_clear_gain:0 "Seu entendimento do [intrigue_lifestyle|E] aumenta"
 intrigue_scheming_special.1001.a:0 "Convencerei [courtier_spy.GetSheHe] de que somos parecidos!"
 intrigue_scheming_special.1001.b:0 "O risco é muito grande, #EMP EU#! não posso confiar #EMP n[courtier_spy.GetSheHe]#!."
 intrigue_scheming_special.1001.c:0 "[courtier_spy.GetSheHe|U] precisa partir!"
 intrigue_scheming_special.1001.desc:0 "Um sussurro ouvido e um olhar penetrante são as peças finais que fazem o quebra-cabeça se encaixar. M[Select_CString( courtier_spy.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('courtier_spy'))] [courtier_spy.GetTitledFirstName] é mais versado na arte da intriga do que [courtier_spy.GetSheHe] gostaria que todos acreditassem.\n\nSaber que há um[Select_CString( courtier_spy.IsFemale, 'a', '' )] [courtier_spy.GetWomanMan] assim na corte me deixa bastante nervoso. No entanto, posso aprender muito, se conseguir fazer [courtier_spy.GetSheHe] confiar em mim."
 intrigue_scheming_special.1001.t:0 "Representar um Papel"
 intrigue_scheming_special.1002.a:0 "O pajem seria punido, é claro."
 intrigue_scheming_special.1002.b:0 "Todos cometem erros, eu perdoaria o pajem."
 intrigue_scheming_special.1002.c:0 "Ambos teriam que me contar o que aconteceu."
 intrigue_scheming_special.1002.d:0 "Tenho certeza de que eles poderiam resolver isso melhor sem mim."
 intrigue_scheming_special.1002.desc:0 "Após muitos dias, finalmente me #EMP coincidentemente#! deparo com [Select_CString( courtier_spy.IsFemale, 'a', 'o' )] [courtier_spy.GetTitledFirstName] quando [courtier_spy.GetSheHe] está sozinho. \"[courtier_spy.GetLadyLord|U] [courtier_spy.GetTitledFirstNameNoTooltip], eu estava querendo—\"\n\"Se você entrasse em um quarto e encontrasse seu cônjuge gritando com um jovem pajem por derrubar um prato, o que você faria?\"\n\nEstá [courtier_spy.GetSheHe] me testando? Talvez esta seja minha oportunidade de convencer [courtier_spy.GetSheHe] de que temos muito em comum."
 intrigue_scheming_special.1002.e:0 "Eu incentivaria a conversa, isso resolve a maioria dos problemas."
 intrigue_scheming_special.1002.f:0 "Briga? Eu sairia o mais rápido possível."
 intrigue_scheming_special.1002.g:0 "Eu me juntaria aos gritos!"
 intrigue_scheming_special.1002.h:0 "Eu pediria para ambos apresentarem seu lado do conflito."
 intrigue_scheming_special.1003.a:0 "Dê um exemplo com o espião!"
 intrigue_scheming_special.1003.b:0 "Primeiro, eu me certificaria de que o espião é bem tratado."
 intrigue_scheming_special.1003.c:0 "Um espião? Não importa. Nós seguimos em frente!"
 intrigue_scheming_special.1003.d:0 "Tenho certeza de que o oficial saberia o que fazer."
 intrigue_scheming_special.1003.desc:0 "\"No meio de uma marcha para a batalha, assim que você está montando acampamento, um oficial se aproxima de você para perguntar o que deve ser feito com um espião que foi capturado.\""
 intrigue_scheming_special.1003.desc_bad:0 "\"Hm.\" [courtier_spy.GetSheHe|U] faz uma pausa, franzindo a testa como se estivesse provando algo azedo, antes de continuar.\n\n"
 intrigue_scheming_special.1003.desc_good:0 "\"Hm.\" [courtier_spy.GetSheHe|U] faz uma pausa, pensativo, antes de continuar.\n\n"
 intrigue_scheming_special.1003.e:0 "Eu falaria com o espião, veria o que ele tem a dizer."
 intrigue_scheming_special.1003.f:0 "Eu pediria para o oficial cuidar disso e me deixar em paz."
 intrigue_scheming_special.1003.g:0 "Um espião?! Isso nunca aconteceria!"
 intrigue_scheming_special.1003.h:0 "Obviamente, o espião tem algumas respostas a dar, com o tempo."
 intrigue_scheming_special.1004.a:0 "A punição é a única opção."
 intrigue_scheming_special.1004.b:0 "Todos temos nossas diferenças, isso não me incomodaria."
 intrigue_scheming_special.1004.c:0 "Ninguém me questiona assim! Eu confrontaria o vassalo."
 intrigue_scheming_special.1004.d:0 "Se meu vassalo acha que é uma má decisão, então provavelmente é."
 intrigue_scheming_special.1004.desc:0 "\"Você toma uma decisão — digamos, que todos os impostos em um condado serão aumentados — e você toma conhecimento de que um de seus vassalos questiona abertamente essa decisão. Como você reage?\""
 intrigue_scheming_special.1004.desc_bad:0 "As sobrancelhas [courtier_spy.GetHerHim|U] se abaixam, e seu olhar se torna frio.\n\n"
 intrigue_scheming_special.1004.desc_good:0 "[courtier_spy.GetSheHe|U] acena com a cabeça antes de pintar o próximo cenário.\n\n"
 intrigue_scheming_special.1004.e:0 "Toda a corte ouviria sobre cada erro do vassalo."
 intrigue_scheming_special.1004.f:0 "Eu tentaria ignorar a afronta, não há necessidade de fazer um escândalo."
 intrigue_scheming_special.1004.g:0 "Bem, eu os confrontaria. Em voz alta."
 intrigue_scheming_special.1004.h:0 "Uma diferença de opinião deve ser resolvida por meio de discussão."
 intrigue_scheming_special.1099.a:0 "É melhor eu manter essa farsa, pelo menos por enquanto."
 intrigue_scheming_special.1099.b:0 "[courtier_spy.GetSheHe|U] é realmente um mistério."
 intrigue_scheming_special.1099.desc_lost:0 "[courtier_spy.GetSheHe|U] franze a testa e dá um passo para trás. 'Eu agradeceria se você não se aproximasse de mim novamente.'\n\nAntes que eu tenha tempo para responder, [courtier_spy.GetSheHe] já começou a se mover pelo corredor, cada passo ocultando [courtier_spy.GetSheHe] cada vez mais na sombra."
 intrigue_scheming_special.1099.desc_won:0 "O rosto [courtier_spy.GetHerHim|U] se ilumina com um sorriso surpreendentemente caloroso. 'Você parece ser um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] de bom senso.'\n\n[courtier_spy.GetSheHe|U] [courtier_spy.Custom('quirk_pos_present')], antes de seguir pelo corredor em passos silenciosos. 'Por favor, junte-se a mim. Temos muito para discutir.'"
 intrigue_scheming_special.1301.a:0 "Eu preciso chegar ao fundo disso!"
 intrigue_scheming_special.1301.b:0 "Vou garantir que nunca precise me preocupar com a segurança novamente."
 intrigue_scheming_special.1301.desc:0 "Passos ecoando por corredores escuros, papéis fora do lugar em meu estudo, uma sombra vista do canto do olho..."
 intrigue_scheming_special.1301.desc_mentor_or_other:0 "\n\n\"Você acha que alguém está te seguindo?\" M[Select_CString( mentor_or_other.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('mentor_or_other'))] [mentor_or_other.GetTitledFirstName] parece ponderar antes de acenar para [mentor_or_other.GetHerselfHimself]. \"Eu #EMP tenho#! notado coisas suspeitas no [ROOT.Char.Custom('FortifiedBuilding')] recentemente.\""
 intrigue_scheming_special.1301.t:0 "Perseguido pelas Sombras"
 intrigue_scheming_special.1302.a.tt:0 "Se [Select_CString( sneaky_courtier.IsFemale, 'a', 'o' )] [sneaky_courtier.GetFirstName] estiver envolvido em uma conspiração, você irá expor\nCaso contrário, sua tentativa de descobrir o espião falhará"
 intrigue_scheming_special.1302.a:0 "Vou confrontar [sneaky_courtier.GetSheHe] imediatamente!"
 intrigue_scheming_special.1302.b.tt1:0 "[sneaky_courtier.GetSheHe|U] não percebe você"
 intrigue_scheming_special.1302.b.tt2:0 "[sneaky_courtier.GetSheHe|U] ouve você seguindo [sneaky_courtier.GetSheHe]"
 intrigue_scheming_special.1302.b:0 "Preciso ter certeza. Vou continuar seguindo [sneaky_courtier.GetSheHe]."
 intrigue_scheming_special.1302.c.tt:0 "Você continuará procurando o espião."
 intrigue_scheming_special.1302.c:0 "Não vou me expor, não pode ser [sneaky_courtier.GetSheHe]."
 intrigue_scheming_special.1302.desc:0 "Escondido em um dos corredores mais desolados, que leva aos aposentos mais privados e aos jardins do [ROOT.Char.Custom('FortifiedBuilding')], eu espero e observo.\n\n#EMP Foi tolice vir aqui? Talvez se eu#!- Passos. Movendo-se silenciosamente pelo corredor; uma figura emergindo das sombras.\n\nO que [Select_CString( sneaky_courtier.IsFemale, 'a', 'o' )] [sneaky_courtier.GetTitledFirstName] está fazendo aqui?"
 intrigue_scheming_special.1303.a:0 "Confrontar [sneaky_courtier.GetSheHe]!"
 intrigue_scheming_special.1303.b:0 "Vou precisar ficar de olho."
 intrigue_scheming_special.1303.c.tt:0 "Você dissipou suas suspeitas, e essa foi uma lição valiosa.\n"
 intrigue_scheming_special.1303.c:0 "Bem, #EMP está#! uma noite adorável hoje."
 intrigue_scheming_special.1303.d:0 "No entanto, eu percebi os sinais cedo!"
 intrigue_scheming_special.1303.desc_exposed:0 "A necessidade de seguir [Select_CString( sneaky_courtier.IsFemale, 'a', 'o' )] [sneaky_courtier.GetTitledFirstName] para descobrir o que [sneaky_courtier.GetSheHe] está tramando acabou, [sneaky_courtier.GetSheHe] é um espião conhecido!\n\nEspero poder identificar os sinais ainda mais cedo se isso acontecer novamente... Essa foi uma lição valiosa!"
 intrigue_scheming_special.1303.desc_sneak_fail:0 "Eu sigo [Select_CString( sneaky_courtier.IsFemale, 'a', 'o' )] [sneaky_courtier.GetTitledFirstName], despercebido, e à medida que nos aproximamos de meus aposentos privados e dos jardins do [ROOT.Char.Custom('FortifiedBuilding')], meu coração acelera. O que [sneaky_courtier.GetSheHe] está fazendo aqui? Distraído, eu esbarro em um vaso que decora o corredor, e ele cai no chão.\n\nO barulho que se segue quase encobre os passos apressados [sneaky_courtier.GetHerHim] enquanto eles desaparecem pelo corredor, e [sneaky_courtier.GetSheHe] logo se perde na noite."
 intrigue_scheming_special.1303.desc_sneak_win:0 "Consigo seguir [Select_CString( sneaky_courtier.IsFemale, 'a', 'o' )] [sneaky_courtier.GetTitledFirstName] sem fazer barulho. [sneaky_courtier.GetSheHe|U] se apressa por um corredor após o outro, e depois de alguns minutos [sneaky_courtier.GetSheHe] passa pelos meus aposentos e sai para os jardins do [ROOT.Char.Custom('FortifiedBuilding')]."
 intrigue_scheming_special.1303.desc_sneak_win_spy:0 "Consigo seguir [sneaky_courtier.GetSheHe] sem fazer barulho, e à medida que nos aproximamos de meus aposentos privados, posso sentir meu pulso acelerar.\n\nLogo, o clique da fechadura de meus aposentos ecoa pelo corredor."
 intrigue_scheming_special.1304.a:0 "\"Acho que você deveria vir comigo.\""
 intrigue_scheming_special.1304.b:0 "Ou talvez nunca houve uma ameaça para começar?"
 intrigue_scheming_special.1304.desc_found:0 "Eu sabia! Mal tive tempo para recuar para o abraço escuro das sombras quando [Select_CString( sneaky_courtier.IsFemale, 'a', 'o' )] [sneaky_courtier.GetTitledFirstName] veio caminhando pelo corredor, indo direto para meus aposentos.\n\nO clique da fechadura sendo destrancada é rapidamente seguido pelo grito [sneaky_courtier.GetHerHim] quando coloco uma mão em seu ombro."
 intrigue_scheming_special.1304.desc_not_found:0 "Enquanto a noite se arrasta, o corredor permanece tranquilo. Não se ouve um sussurro, e nenhuma sombra ameaçadora pode ser vista.\n\nTalvez eu devesse ter seguido [Select_CString( sneaky_courtier.IsFemale, 'a', 'o' )] [sneaky_courtier.GetTitledFirstName] afinal?"
 intrigue_scheming_special.1350.a:0 "A morte [sneaky_courtier.GetHerHim] foi uma bênção ou apenas uma coincidência?"
 intrigue_scheming_special.1350.desc:0 "Agora que [Select_CString( sneaky_courtier.IsFemale, 'a', 'o' )] [sneaky_courtier.GetTitledFirstName] faleceu, nunca saberei se [sneaky_courtier.GetSheHe] estava conspirando contra mim ou não... No entanto, minha investigação me ensinou muito, e da próxima vez não ficarei me perguntando!"
 intrigue_scheming_special.1398.a:0 "Espero que [sneaky_courtier.GetSheHe] possa me perdoar."
 intrigue_scheming_special.1398.desc:0 "\"Por que você me acusa dessas coisas?!\" [sneaky_courtier.GetTitledFirstName] me questiona, a voz carregada de [sneaky_courtier.Custom('GeneralTemperament')]. \"Eu estava apenas saindo para respirar um pouco de ar.\"\n\nAgora, diante da dor em seus olhos, não sei como pude imaginar [sneaky_courtier.GetSheHe] um espião."
 intrigue_scheming_special.1399.desc:0 "Coloco uma mão no ombro [sneaky_courtier.GetHerHim], e [Select_CString( sneaky_courtier.IsFemale, 'a', 'o' )] [sneaky_courtier.GetTitledFirstName] se vira rápido como um relâmpago. Pego no meio de sua missão, [sneaky_courtier.GetSheHe] nem tenta se defender.\n\nToda essa provação me ensinou uma lição valiosa sobre confiança e vigilância, e agora estou mais atento do que nunca!"
 realm_has_more_than_2_siegeable_holdings_trigger_desc:0 "Dois ou mais dos domínios do inimigo podem ser sitiados"
 realm_has_more_than_2_siegeable_holdings_trigger_desc_not:0 "Menos de 2 dos domínios do inimigo podem ser sitiados"
