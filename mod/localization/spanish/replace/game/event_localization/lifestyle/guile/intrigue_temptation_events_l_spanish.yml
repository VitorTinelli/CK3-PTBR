l_spanish:
 every_approved_date:0 "Todos cujos retratos eu guardei"
 intrigue_temptation.2201.a.failure:0 "[my_lover.GetFirstName] se recusa a dizer mais"
 intrigue_temptation.2201.a.success.tt:0 "Eu descubro um [secret|E] de um personagem aleatório"
 intrigue_temptation.2201.a.success:0 "[my_lover.GetFirstName] compartilha fofocas da corte d[Select_CString( court_owner.IsFemale, 'a', 'o' )] [court_owner.GetTitledFirstName]"
 intrigue_temptation.2201.a:0 "De jeito nenhum. Por favor, conte-me mais..."
 intrigue_temptation.2201.b:0 "Ouvir sua voz nunca é entediante, meu querido."
 intrigue_temptation.2201.d.sadistic:0 "Você está escondendo algo... Conte-me, #EMP agora#!!"
 intrigue_temptation.2201.desc:0 "Após nossa mais recente relação, [my_lover.GetFirstName] e eu estamos deitados juntos, envolvidos em uma conversa casual.\n\n\"E você nunca acreditaria...\" [my_lover.GetSheHe] para de repente e fica corad[Select_CString( my_lover.IsFemale, 'a', 'o' )]. \"Desculpe, meu amor; isso deve ser terrivelmente entediante para você...\""
 intrigue_temptation.2201.t:0 "Conversa na Cama"
 intrigue_temptation.3000.a:0 "Sim, meu amor, eu faria #emphasis qualquer coisa#! por você!"
 intrigue_temptation.3000.b.failure:0 "[guest_lover.GetFirstName] não revelou nada durante nosso encontro amoroso..."
 intrigue_temptation.3000.b.success:0 "[guest_lover.GetFirstName] me revelou um segredo!"
 intrigue_temptation.3000.b.tt:0 "Tento fazer [guest_lover.GetSheHe] revelar o segredo do meu vassalo"
 intrigue_temptation.3000.b:0 "Então, querida, aquele rumor sobre meu vassalo?"
 intrigue_temptation.3000.c.tt:0 "Uso [Select_CString( guest_lover.IsFemale, 'a', 'o' )] [guest_lover.GetFirstName] para me aproximar d[Select_CString( guest_lover.IsFemale, 'a', 'o' )] amig[Select_CString( guest_lover.IsFemale, 'a', 'o' )] [guest_lover.GetHerHim], [guest_lovers_friend.GetFullName]"
 intrigue_temptation.3000.c:0 "[Select_CString( guest_lover.IsFemale, 'Minha querida', 'Meu querido' )], você falaria com [Select_CString( guest_lovers_friend.IsFemale, 'a', 'o' )] [guest_lovers_friend.GetFirstNameNoTooltip]?"
 intrigue_temptation.3000.d:0 "Ah, não posso... agora vá embora!"
 intrigue_temptation.3000.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], é... foi... quer dizer, tem sido um prazer ser seu convidado aqui em [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]...\" [guest_lover.GetFirstName] gagueja, enquanto [guest_lover.GetSheHe] se prepara para partir.\n\n\"Tive a oportunidade de #emphasis conhecê-la#!. Isso por si só tornou minha estadia valiosa. Mas ainda assim, eu imploro... você passaria uma noite de paixão comigo, antes de eu partir?\"\n\n[guest_lover.GetFirstName] caiu na minha sutil manipulação! Agora, como devo aproveitar essa oportunidade?"
 intrigue_temptation.3000.t:0 "Uma Despedida Doce"
 intrigue_temptation.3010.a.failure:0 "[bar_servant.GetFirstNameNoTooltip] não responde aos meus avanços"
 intrigue_temptation.3010.a.success:0 "Com um pouco de ajuda, conquisto [Select_CString( bar_servant.IsFemale, 'a', 'o' )] [bar_servant.GetFirstNameNoTooltip]"
 intrigue_temptation.3010.a:0 "Você conhece [bar_servant.GetSheHe]? Seria perfeito!"
 intrigue_temptation.3010.b.success:0 "Conquisto [Select_CString( bar_servant.IsFemale, 'a', 'o' )] [bar_servant.GetFirstNameNoTooltip]"
 intrigue_temptation.3010.b:0 "Eu quero fazer isso por conta própria."
 intrigue_temptation.3010.c:0 "Estou aqui apenas pelas bebidas..."
 intrigue_temptation.3010.end.desc:0 "[bar_servant.GetWomanMan] [bar_servant.Custom('RomanticComplimentAdjective')]. Quer que eu faça as apresentações?\""
 intrigue_temptation.3010.start.desc:0 "Pela terceira noite seguida, estou sentad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] na mesma mesa, na mesma taverna. Ela tem uma excelente vista para o bar - e para a cativante [bar_servant.Custom('bar_servant')] por trás dele.\n\nMeu devaneio é interrompido quando [wingman.Custom2('MyCharacterIntroduction', ROOT.Char)] bate o caneco na mesa. 'Vi você olhando fixamente para [Select_CString( bar_servant.IsFemale, 'a', 'o' )] [bar_servant.GetFirstName] a noite toda', [wingman.GetSheHe] sussurra com um sorriso malicioso. 'Eu não a culpo, [bar_servant.GetSheHe] é uma'"
 intrigue_temptation.3010.success.tt:0 "Poderei decidir como proceder"
 intrigue_temptation.3010.t:0 "Uma Flor Na Selva"
 intrigue_temptation.3011.a:0 "Só por uma noite? Que tal #EMP todas#! as noites?"
 intrigue_temptation.3011.alone.desc:0 "Vi [Select_CString( bar_servant.IsFemale, 'a', 'o' )] [bar_servant.GetFirstName] rejeitar mais investidas do que posso contar. Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] menos habilidos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ficaria intimidad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], mas aproveitei felizmente a oportunidade para estudar os erros deles. Estou preparad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )].\n\nNossa conversa flui tranquilamente - eu não esperava ter tanto em comum com uma [bar_servant.Custom('bar_servant')]! Quando me levanto para sair, [bar_servant.GetFirstNameNoTooltip] coloca sua mão em meu braço e pergunta se quero um quarto para a noite. Um quarto para dois, julgando pelo olhar nos olhos [bar_servant.GetHerHim]."
 intrigue_temptation.3011.b:0 "Mostre-me o caminho, [bar_servant.Custom('LoverPetName')]."
 intrigue_temptation.3011.c:0 "Estou lisonjead[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], mas só queria conversar."
 intrigue_temptation.3011.help.desc:0 "Vi [Select_CString( bar_servant.IsFemale, 'a', 'o' )] [bar_servant.GetFirstName] rejeitar mais investidas do que posso contar. Mas graças à introdução e à postura descontraída d[Select_CString( wingman.IsFemale, 'a', 'o' )] [wingman.GetTitledFirstNamePossessive], [bar_servant.GetSheHe] logo se abre.\n\nA conversa flui tranquilamente - eu não esperava ter tanto em comum com uma [bar_servant.Custom('bar_servant')]! Só percebo que [Select_CString( wingman.IsFemale, 'a', 'o' )] [wingman.GetFirstNameNoTooltip] foi embora quando [Select_CString( bar_servant.IsFemale, 'a', 'o' )] [bar_servant.GetFirstNameNoTooltip] coloca sua mão em meu braço e pergunta se quero um quarto para a noite. Um quarto para dois, julgando pelo olhar nos olhos [bar_servant.GetHerHim]."
 intrigue_temptation.3020.a.tt:0 "Tiro os retratos"
 intrigue_temptation.3020.a:0 "Consigo me imaginar com alguém novo..."
 intrigue_temptation.3020.b:0 "Eles são muito pretensiosos para o meu gosto."
 intrigue_temptation.3020.end.desc:0 "tanto estrangeiros quanto locais. Até agora, eles têm acumulado poeira em algum sótão.\n\nTalvez eu deva tirá-los e escolher minha próxima conquista romântica?"
 intrigue_temptation.3020.noblemen.desc:0 "nobres,"
 intrigue_temptation.3020.nobles.desc:0 "nobres,"
 intrigue_temptation.3020.noblewomen.desc:0 "nobres,"
 intrigue_temptation.3020.start.desc:0 "Ao longo dos anos, recebi muitos retratos de vários"
 intrigue_temptation.3020.t:0 "Uma Nova Chama"
 intrigue_temptation.3021.a.favorite_exists.tt:0 "Meu favorito atual é [favorite.GetShortUIName]"
 intrigue_temptation.3021.a.tt:0 "Designar [potential_date.GetShortUIName] como meu favorito atual, a quem posso prestar atenção especial"
 intrigue_temptation.3021.a:0 "Favorito! Coloque-o na pilha de cima."
 intrigue_temptation.3021.adventurous.desc:0 "O retrato de [potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)] tem uma carta anexada na parte de trás. Nela, [potential_date.GetSheHe] descreve [potential_date.GetHerselfHimself] como \"um espírito espontâneo que anseia por aventura\"."
 intrigue_temptation.3021.arrogant.desc:0 "[potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me enviou um pacote com #EMP [ROOT.Char.Custom('ThreeToTwelve')]#! retratos. Todos são iguais...?"
 intrigue_temptation.3021.b.1_date.tt:0 "Escolhi [date_1.GetShortUIName] e posso escolher mais #V 2#!"
 intrigue_temptation.3021.b.2_dates.tt:0 "Escolhi [date_1.GetShortUIName] e [date_2.GetShortUIName] e posso escolher mais #V 1#!"
 intrigue_temptation.3021.b.tt:0 "Manter [potential_date.GetShortUIName] para consideração"
 intrigue_temptation.3021.b:0 "Guardião! Coloque-o na pilha da direita."
 intrigue_temptation.3021.beauty.desc:0 "Muitos me disseram que [potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)] é um deleite para os olhos! Eu me pergunto se o retrato [potential_date.GetHerHim] faz justiça a [potential_date.GetSheHe]?"
 intrigue_temptation.3021.c.tt:0 "Descartar o retrato de [potential_date.GetShortUINamePossessive]"
 intrigue_temptation.3021.c:0 "Não, obrigado! Coloque-o na pilha da esquerda."
 intrigue_temptation.3021.d.tt:0 "Guarde os retratos de volta no armazenamento"
 intrigue_temptation.3021.d:0 "Isso é inútil! Que ideia terrível."
 intrigue_temptation.3021.do_not_believe.desc:0 "[potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)|U] anexou uma nota bastante sarcástica ao retrato [potential_date.GetHerHim]. \"Na verdade, não acredito em conhecer seu futuro cônjuge dessa maneira, mas posso muito bem tentar.\""
 intrigue_temptation.3021.dog.desc:0 "No retrato [potential_date.GetHerHim], [potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)] está posando com um adorável cachorrinho."
 intrigue_temptation.3021.fish.desc:0 "[potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me enviou um retrato de [potential_date.GetHerselfHimself] à beira de um lago, segurando um grande peixe."
 intrigue_temptation.3021.generic1.desc:0 "E [potential_date.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]? [potential_date.GetSheHe|U] é amplamente conhecid[Select_CString( potential_date.IsFemale, 'a', 'o' )] como um[Select_CString( potential_date.IsFemale, 'a', '' )] [potential_date.GetWomanMan] [potential_date.Custom('ComplimentAdjective')]. No entanto, também ouvi dizer que [potential_date.GetSheHe] pode ser bastante [potential_date.Custom2('InsultAdjective', ROOT.Char)]..."
 intrigue_temptation.3021.generic2.desc:0 "Ah, [Select_CString( potential_date.IsFemale, 'a', 'o' )] [potential_date.Custom('ComplimentAdjective')] d[Select_CString( potential_date.IsFemale, 'a', 'o' )] [potential_date.GetFullName]! Será que faríamos um bom par?"
 intrigue_temptation.3021.generic3.desc:0 "Este retrato é de ninguém menos que [potential_date.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. [potential_date.GetSheHe|U] é dit[Select_CString( potential_date.IsFemale, 'a', 'o' )] ser [Select_CString( potential_date.IsFemale, 'a', 'o' )] [potential_date.Custom('ComplimentAdjective')], mas também ouvi rumores sobre a [potential_date.Custom2('InsultAdjective', ROOT.Char)] natureza [potential_date.GetHerHim]..."
 intrigue_temptation.3021.generic4.desc:0 "Ah, [potential_date.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. Poderia ser a pessoa certa?"
 intrigue_temptation.3021.impatient.desc:0 "[potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me enviou muitos retratos ao longo dos anos. O último veio com uma nota bastante impaciente anexada."
 intrigue_temptation.3021.lewd.desc:0 "[ROOT.Char.GetFaith.FertilityGodName|U], esqueci que isso estava aqui! O retrato que [potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)] me enviou deixa muito pouco para a imaginação. Nada, para ser franco."
 intrigue_temptation.3021.must_be_tall.desc:0 "[potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)|U] anexou uma carta muito longa e amigável ao retrato [potential_date.GetHerHim]. No final, [potential_date.GetSheHe] me instiga a escrever de volta em breve, \"mas apenas se você tiver mais de um metro e oitenta\"."
 intrigue_temptation.3021.tall.desc:0 "Este é o retrato de [potential_date.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. O mensageiro que o entregou fez questão de descrever exatamente o quão alt[Select_CString( potential_date.IsFemale, 'a', 'o' )] [potential_date.GetTitledFirstNameNoTooltip] é. Várias vezes."
 intrigue_temptation.3021.ugly.desc:0 "Isso deve ser [potential_date.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. O retrato [potential_date.GetHerHim|U] certamente está bem feito, mas ouvi dizer que pode não ser uma verdadeira semelhança..."
 intrigue_temptation.3022.a:0 "Só me importo com [Select_CString( favorite.IsFemale, 'a', 'o' )] [favorite.Custom('RomanticComplimentAdjective')] d[Select_CString( favorite.IsFemale, 'a', 'o' )] [favorite.GetFirstNameNoTooltip]."
 intrigue_temptation.3022.b.failure:0 "Meu plano falha"
 intrigue_temptation.3022.b.success:0 "Todos estão emocionados"
 intrigue_temptation.3022.b:0 "Todos são dignos dos meus poemas!"
 intrigue_temptation.3022.c:0 "Não estou desperdiçando meu tempo com nenhum deles."
 intrigue_temptation.3022.desc:0 "Isso foi exaustivo, mas estranhamente viciante! Agora que fiz minha seleção, posso pegar minha pena e escrever alguns versos bonitos."
 intrigue_temptation.3023.a:0 "Que lisonjeiro! Preciso responder!"
 intrigue_temptation.3023.b:0 "Com algumas alterações, posso dar isso para [Select_CString( ROOT.Char.GetPrimarySpouse.IsFemale, 'a', 'o' )] [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]."
 intrigue_temptation.3023.c:0 "Estou me sentindo enjoad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]..."
 intrigue_temptation.3023.desc:0 "[letter_writer.Custom2('love_letter', ROOT.Char)]"
 intrigue_temptation.3023.t:0 "Para [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.Custom('RomanticComplimentAdjective')] d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitledFirstNameNoTooltip],"
 intrigue_temptation.3024.a:0 "Excelente!"
 intrigue_temptation.3024.desc:0 "[answering_date.Custom2('love_letter', ROOT.Char)]"
 intrigue_temptation.3025.a:0 "Oh. Isso é... constrangedor."
 intrigue_temptation.3025.desc:0 "Há quinze dias, recebi uma carta sua. O nome no envelope era o meu próprio, mas o verso dentro era dedicado [Select_CString( lower_left_portrait.IsFemale, 'a', 'ao' )] [lower_left_portrait.GetTitledFirstName]. Eu escrevi para [lower_left_portrait.GetSheHe], e [lower_left_portrait.GetSheHe] me diz que [lower_left_portrait.GetSheHe] também recebeu um poema - o mesmo, na verdade - mas era destinado a outr[Select_CString( lower_right_portrait.IsFemale, 'a', 'o' )] [lower_right_portrait.GetWomanMan]!\n\nEste é o plano mais desprezível e sórdido que já ouvi falar. Nunca mais nos escreva!"
 intrigue_temptation.3025.t:0 "Para [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] de duas caras, [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('favorite'))] [ROOT.Char.GetTitledFirstNameNoTooltip],"
 intrigue_temptation_special.1001.a.tt:0 "[wants_love.GetTitledFirstName] pode se tornar amante de uma pessoa escolhida por mim"
 intrigue_temptation_special.1001.a:0 "[wants_love.GetFirstNameNoTooltip] não ficará sozinh[Select_CString( wants_love.IsFemale, 'a', 'o' )] por muito tempo!"
 intrigue_temptation_special.1001.b:0 "Devo focar no meu próprio casamento."
 intrigue_temptation_special.1001.c:0 "Devo focar na minha própria vida amorosa."
 intrigue_temptation_special.1001.desc:0 "Aquelas expressões sonhadoras e suspiros melancólicos só podem significar uma coisa - [wants_love.Custom2('MyCharacterIntroduction', ROOT.Char)] está desejando romance!\n\nTalvez eu devesse colocar minhas habilidades de casamenteira à prova e aliviar o sofrimento [wants_love.GetHerHim]? [wants_love.GetSheHe|U] certamente ficaria grat[Select_CString( wants_love.IsFemale, 'a', 'o' )]!"
 intrigue_temptation_special.1001.t:0 "De Amor e Desejo"
 intrigue_temptation_special.1002.a.tt:0 "#F A maioria das pessoas, especialmente aquelas que são empáticas e gentis, preferem parceiros com uma personalidade similar à própria.\n\nSe minha suposição estiver errada, posso assumir que [Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetFirstName] prefere atração ou poder.#!"
 intrigue_temptation_special.1002.a:0 "Um coração afim, uma personalidade que combine com a sua própria."
 intrigue_temptation_special.1002.b.tt:0 "#F Pessoas luxuriosas, arrogantes ou atraentes tendem a preferir parceiros que sejam bonitos, amigáveis, audaciosos ou sedutores.\n\nSe minha suposição estiver errada, posso assumir que [Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetFirstName] prefere uma personalidade semelhante ou poder.#!"
 intrigue_temptation_special.1002.b:0 "Atração, seja física ou de temperamento."
 intrigue_temptation_special.1002.c.tt:0 "#F Pessoas que desejam riqueza e sucesso tendem a preferir parceiros poderosos.\n\nSe minha suposição estiver errada, posso assumir que [Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetFirstName] prefere uma personalidade semelhante ou atração.#!"
 intrigue_temptation_special.1002.c:0 "Poder e influência."
 intrigue_temptation_special.1002.d.tt:0 "#F A maioria das pessoas prefere parceiros do sexo oposto, mas não é incomum preferir parceiros do mesmo sexo ou de ambos os sexos.#!"
 intrigue_temptation_special.1002.d:0 "Prefiro descobrir se [wants_love.GetSheHe] prefere homens ou mulheres. "
 intrigue_temptation_special.1002.desc:0 "Para encontrar o par perfeito para [Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetTitledFirstName], devo conhecer mais suas preferências. Ao observar discretamente as interações [wants_love.GetHerHim] na corte, posso ter um vislumbre dos desejos mais profundos [wants_love.GetHerHim]...\n\nAntes de começar, devo ter uma teoria em mente. O que eu acho que [Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetFirstNameNoTooltip] gostaria em um parceiro?"
 intrigue_temptation_special.1002.t:0 "Questão de Gosto"
 intrigue_temptation_special.1003.a.tt:0 "Eu tento juntar [Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetFirstName] com [Select_CString( target_list_member_a.IsFemale, 'a', 'o' )] [target_list_member_a.GetTitledFirstName]"
 intrigue_temptation_special.1003.a:0 "[Select_CString( target_list_member_a.IsFemale, 'A', 'O' )] [target_list_member_a.Custom('ComplimentAdjective')] [target_list_member_a.GetTitledFirstNameNoTooltip]."
 intrigue_temptation_special.1003.b.tt:0 "Eu tento juntar [Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetFirstName] com [Select_CString( target_list_member_b.IsFemale, 'a', 'o' )] [target_list_member_b.GetTitledFirstName]"
 intrigue_temptation_special.1003.b:0 "[target_list_member_b.GetTitledFirstNameNoTooltip], um[Select_CString( target_list_member_b.IsFemale, 'a', '' )] [target_list_member_b.GetWomanMan] [target_list_member_b.Custom('ComplimentAdjective')]."
 intrigue_temptation_special.1003.c.tt:0 "Eu tento juntar [Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetFirstName] com [Select_CString( target_list_member_c.IsFemale, 'a', 'o' )] [target_list_member_c.GetTitledFirstName]"
 intrigue_temptation_special.1003.c:0 "M[Select_CString( target_list_member_c.IsFemale, 'inha', 'eu' )] [target_list_member_c.Custom('ComplimentAdjective')] [ROOT.GetCharacter.Custom2('RelationToMe' , target_list_member_c )], [target_list_member_c.GetTitledFirstNameNoTooltip]."
 intrigue_temptation_special.1003.end.desc:0 "\n\nAgora que estou um pouco mais familiarizad[Select_CString( wants_love.IsFemale, 'a', 'o' )] com os desejos d[Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetFirstNamePossessiveNoTooltip], fiz uma lista de possíveis combinações. Quem seria [Select_CString( wants_love.IsFemale, 'o', 'a' )] melhor par para [Select_CString( wants_love.IsFemale, 'a minha', 'o meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , wants_love )]?"
 intrigue_temptation_special.1003.personality_failure.desc:0 "Estava errad[Select_CString( wants_love.IsFemale, 'a', 'o' )]. [wants_love.GetSheHe] parece se importar pouco com a personalidade. [wants_love.GetSheHe] deve preferir poder ou atração em um parceiro."
 intrigue_temptation_special.1003.personality_success.desc:0 "Como eu suspeitava, [wants_love.GetSheHe] prefere aqueles com um temperamento semelhante ao seu próprio."
 intrigue_temptation_special.1003.power_failure.desc:0 "Eu estava errado. [wants_love.GetSheHe|U] interage com pessoas de diversos níveis de prestígio. Deve haver algum outro elemento além do poder que intriga [wants_love.GetSheHe] - uma personalidade compatível ou uma aparência cativante, talvez?"
 intrigue_temptation_special.1003.power_success.desc:0 "Como eu suspeitava, [wants_love.GetSheHe] prefere a companhia dos lordes e das damas mais influentes da corte."
 intrigue_temptation_special.1003.sex_appeal_failure.desc:0 "Eu estava enganado - [wants_love.GetSheHe|U] não parece distinguir entre aqueles que nasceram com boa aparência e aqueles que são simples. [wants_love.GetSheHe|U] deve se importar mais com a personalidade... ou poder."
 intrigue_temptation_special.1003.sex_appeal_success.desc:0 "[wants_love.GetSheHe] é atraíd[Select_CString( wants_love.IsFemale, 'a', 'o' )], como uma mariposa para a chama, por aqueles de grande carisma e beleza."
 intrigue_temptation_special.1003.start.desc:0 "Já observei [Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetTitledFirstName] por um tempo e minha conclusão é certa."
 intrigue_temptation_special.1003.t:0 "Fazendo a Combinação"
 intrigue_temptation_special.1003.tt:0 "Um bom par seria alguém que atenda às preferências d[Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetFirstName]"
 intrigue_temptation_special.1004.a:0 "Uma dança alegre."
 intrigue_temptation_special.1004.b:0 "Uma caçada emocionante."
 intrigue_temptation_special.1004.bad.desc:0 "Infelizmente, a química que eu antecipei não apareceu em lugar algum. Espero que tenha sido apenas nervosismo."
 intrigue_temptation_special.1004.c:0 "Uma viagem para inspecionar a infraestrutura local."
 intrigue_temptation_special.1004.d:0 "Um jantar privado para compartilhar algumas 'fofocas'."
 intrigue_temptation_special.1004.e:0 "Uma noite de poesia."
 intrigue_temptation_special.1004.end.desc:0 "\n\nDevo aproveitar o momento, dando [Select_CString( wants_love.IsFemale, 'a', 'ao' )] [wants_love.GetFirstNameNoTooltip] e [Select_CString( chosen_match.IsFemale, 'a', 'o' )] [chosen_match.GetFirstNameNoTooltip] uma nova chance de se encontrarem. Desta vez, vou organizar algo mais emocionante, uma oportunidade para compartilharem um interesse em comum!"
 intrigue_temptation_special.1004.good.desc:0 "Não vi sinais definitivos, mas eles se deram muito bem."
 intrigue_temptation_special.1004.great.desc:0 "Eles passaram a maior parte do jantar conversando e lançando olhares curiosos um para o outro quando não estavam."
 intrigue_temptation_special.1004.start.desc:0 "Para ter uma primeira impressão da compatibilidade da minha combinação, organizei um pequeno jantar com [Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetTitledFirstName] e [Select_CString( chosen_match.IsFemale, 'a', 'o' )] [chosen_match.GetTitledFirstName] na lista de convidados."
 intrigue_temptation_special.1004.t:0 "Criando o Clima"
 intrigue_temptation_special.1004.tt:0 "Devo escolher uma atividade que tanto [Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetFirstName] quanto [Select_CString( chosen_match.IsFemale, 'a', 'o' )] [chosen_match.GetFirstName] achem familiar e agradável com base em suas habilidades"
 intrigue_temptation_special.1005.a:0 "Realmente uma ótima combinação!"
 intrigue_temptation_special.1005.b:0 "Certamente sou um bom juiz de caráter."
 intrigue_temptation_special.1005.bad_diplomacy.desc:0 "Para minha frustração, uma dança acabou sendo uma ideia terrível."
 intrigue_temptation_special.1005.bad_intrigue.desc:0 "Eu pensei que um pequeno jantar privado com uma conversa intrigante aproximaria [Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetFirstName] e [Select_CString( chosen_match.IsFemale, 'a', 'o' )] [chosen_match.GetFirstName], mas o evento inteiro se tornou terrivelmente desconfortável."
 intrigue_temptation_special.1005.bad_learning.desc:0 "Como se constata, poesia não é para todos."
 intrigue_temptation_special.1005.bad_martial.desc:0 "Receio que eu estava enganado quando pensei que uma caçada seria uma atividade adequada."
 intrigue_temptation_special.1005.bad_status.desc:0 "\n\nÉ hora de encarar minha derrota - [wants_love.GetFirstNameNoTooltip] e [Select_CString( chosen_match.IsFemale, 'a', 'o' )] [chosen_match.GetFirstNameNoTooltip] nunca ficarão juntos."
 intrigue_temptation_special.1005.bad_stewardship.desc:0 "Com o benefício da retrospectiva, uma viagem para inspecionar a infraestrutura local foi uma má ideia."
 intrigue_temptation_special.1005.c:0 "O amor é o maior mistério."
 intrigue_temptation_special.1005.chosen_match_struggled.desc:0 "Foi quase doloroso assistir [Select_CString( chosen_match.IsFemale, 'a', 'o' )] [chosen_match.GetFirstName] lutando. [chosen_match.GetSheHe|U] manteve-se distante durante todo o triste evento, nem sequer lançando um único olhar na direção d[Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetFirstNamePossessive]."
 intrigue_temptation_special.1005.good_diplomacy.desc:0 "A dança pareceu animar tanto [Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetFirstName] quanto [Select_CString( chosen_match.IsFemale, 'a', 'o' )] [chosen_match.GetFirstName]. Graças às minhas sugestões discretas, eles passaram muito tempo juntos, e pelo olhar em seus rostos, tenho certeza de que gostaram."
 intrigue_temptation_special.1005.good_intrigue.desc:0 "[wants_love.GetFirstName] e [Select_CString( chosen_match.IsFemale, 'a', 'o' )] [chosen_match.GetFirstName] foram convidados bem-vindos em nosso encontro privado, nos fornecendo algumas fofocas instigantes. Eles descobriram o mesmo segredo embaraçoso sobre um certo lorde e discutiram os detalhes sórdidos com alegria desinibida."
 intrigue_temptation_special.1005.good_learning.desc:0 "[wants_love.GetFirstName] e [Select_CString( chosen_match.IsFemale, 'a', 'o' )] [chosen_match.GetFirstName] ficaram encantados enquanto minha convidada de honra recitava seu poema. Deve ter tocado profundamente neles, pois discutiram sobre ele por quase uma hora depois."
 intrigue_temptation_special.1005.good_martial.desc:0 "Como eu suspeitava, tanto [Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetFirstName] quanto [Select_CString( chosen_match.IsFemale, 'a', 'o' )] [chosen_match.GetFirstName] eram caçadores experientes, tão à vontade a cavalo quanto no chão. Eles pareciam se divertir, e ouvi [Select_CString( chosen_match.IsFemale, 'a', 'o' )] [chosen_match.GetFirstNameNoTooltip] elogiando muito [Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetFirstNameNoTooltip] por sua habilidade com arco e flecha."
 intrigue_temptation_special.1005.good_status.desc:0 "\n\nTenho observado os dois há alguns dias e tenho certeza. Há algo ali que não existia antes."
 intrigue_temptation_special.1005.good_status_despite_bad_activity.desc:0 "\n\nFelizmente, parece que aquele evento constrangedor não matou os sentimentos que estavam surgindo entre eles. Embora ainda seja cedo para dizer, acredito que tive sucesso."
 intrigue_temptation_special.1005.good_stewardship.desc:0 "Embora uma viagem para inspecionar a infraestrutura não seja o ambiente mais romântico, tenho certeza de que tanto [Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetFirstName] quanto [Select_CString( chosen_match.IsFemale, 'a', 'o' )] [chosen_match.GetFirstName] acharam interessante. Eles conversaram bastante sobre moinhos e sistemas de irrigação e pareciam bastante satisfeitos com a companhia um do outro."
 intrigue_temptation_special.1005.great_diplomacy.desc:0 "Normalmente não gosto de me gabar, mas devo dizer que esta dança será lembrada por muitos e muitos anos! Na verdade, suspeito que a noite passada se tornará uma lembrança querida tanto para [Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetFirstNamePossessive] quanto para [Select_CString( chosen_match.IsFemale, 'a', 'o' )] [chosen_match.GetFirstNamePossessive]. Eles dançaram juntos quase o tempo todo e não conseguiam tirar os olhos um do outro!"
 intrigue_temptation_special.1005.great_intrigue.desc:0 "[wants_love.GetFirstName] e [Select_CString( chosen_match.IsFemale, 'a', 'o' )] [chosen_match.GetFirstName] se encaixaram perfeitamente com os velhos raposos! Em pouco tempo, eles dominavam a conversa, trocando ideias um com o outro em uma velocidade impressionante. Raramente vi duas mentes tão sincronizadas!"
 intrigue_temptation_special.1005.great_learning.desc:0 "Raramente vi um[Select_CString( wants_love.IsFemale, 'a', '' )] [wants_love.GetWomanMan] tão encantad[Select_CString( wants_love.IsFemale, 'a', 'o' )] quanto [Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetFirstName] quando [wants_love.GetSheHe] ouviu [chosen_match.GetFirstName] recitando seu poema! [wants_love.GetSheHe|U] estava praticamente em lágrimas no último verso.\n\nApós a apresentação, eles conversaram por horas - muito depois que todos os outros convidados saíram."
 intrigue_temptation_special.1005.great_martial.desc:0 "Normalmente não digo isso, mas às vezes, posso ser um verdadeiro gênio! Tanto [Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetFirstName] quanto [Select_CString( chosen_match.IsFemale, 'a', 'o' )] [chosen_match.GetFirstName] se divertiram imensamente na caçada. Eles trabalharam juntos como se se conhecessem há uma vida inteira e foram o casal mais bem-sucedido de longe."
 intrigue_temptation_special.1005.great_status.desc:0 "\n\nEu esperava que minha pequena empreitada melhorasse o humor d[Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetFirstNamePossessiveNoTooltip], mas não esperava ver os resultados tão rapidamente! A menos que eu seja um terrível juiz de caráter, certamente há algo acontecendo entre os dois."
 intrigue_temptation_special.1005.great_stewardship.desc:0 "[wants_love.GetFirstName] e [Select_CString( chosen_match.IsFemale, 'a', 'o' )] [chosen_match.GetFirstName] cavalgando lado a lado era um deleite para os olhos! Eles conversaram por horas sobre pontes, moinhos e sistemas de irrigação antes de ficarem para trás do resto do grupo. Quem sabe em quais territórios sua conversa se aventurou, mas [Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetFirstName] parecia encantad[Select_CString( wants_love.IsFemale, 'a', 'o' )]."
 intrigue_temptation_special.1005.t:0 "Testando os Sentimentos"
 intrigue_temptation_special.1005.wants_love_struggled.desc:0 "Foi quase doloroso assistir [Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetFirstName] lutando. [wants_love.GetSheHe|U] manteve-se distante durante todo o triste evento, nem sequer lançando um único olhar na direção d[Select_CString( chosen_match.IsFemale, 'a', 'o' )] [chosen_match.GetFirstNamePossessive]."
 intrigue_temptation_special.1006.a:0 "Vou estudar as pessoas com mais cuidado no futuro."
 intrigue_temptation_special.1006.desc:0 "Para avaliar a qualidade do meu par, organizei um pequeno jantar com [Select_CString( wants_love.IsFemale, 'a', 'o' )] [wants_love.GetTitledFirstName] e [Select_CString( chosen_match.IsFemale, 'a', 'o' )] [chosen_match.GetTitledFirstName] na lista de convidados.\n\nTentei incentivá-los a iniciar uma conversa, mas [Select_CString( not_interested.IsFemale, 'a', 'o' )] [not_interested.GetFirstNameNoTooltip] agiu de forma fria e desprezível em relação ao par pretendido. Em vez disso, [not_interested.GetSheHe] continuou lançando olhares para [Select_CString( interesting_ladylord.IsFemale, 'uma bela', 'um belo' )] [interesting_ladylord.GetLadyLord] mais adiante na mesa. Talvez...?"
 intrigue_temptation_special.1006.t:0 "Um Erro Presunçoso"
 intrigue_temptation_special.1007.a:0 "Desejo a eles tudo de melhor."
 intrigue_temptation_special.1007.desc:0 "Por muitas luas, mantive meus olhos [Select_CString( wants_love.IsFemale, 'na', 'no' )] [wants_love.GetTitledFirstName] e [Select_CString( chosen_match.IsFemale, 'a', 'o' )] [chosen_match.GetTitledFirstName], procurando sinais do meu sucesso. Hoje à noite, minha curiosidade foi saciada.\n\nEm um banco escondido no canto mais exuberante e sombrio dos meus jardins, avistei os dois pombinhos. Com um sorriso satisfeito nos lábios, recuei pelo caminho coberto de vegetação. Eles estavam tão perdidos no beijo que nem perceberam minha presença."
 intrigue_temptation_special.1007.t:0 "Uma Visão Gratificante"
 yearly.3000.b.failure.desc:0 "Não consegui persuadir [guest_lover.GetSheHe]"
 yearly.3000.b.success.desc:0 "Consegui persuadir [guest_lover.GetSheHe] com sucesso"
 yearly.3000.b.success.tt:0 "Descubro um segredo de um vassalo"
