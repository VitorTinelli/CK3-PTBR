l_spanish:
 intrigue_events_bjorn.5100.a:0 "Meu amor tem muito a me ensinar."
 intrigue_events_bjorn.5100.b:0 "[the_lover.GetSheHe|U] será [Select_CString( the_lover.IsFemale, 'uma aluna', 'um aluno' )] adorável."
 intrigue_events_bjorn.5100.c:0 "Passarmos tempo juntos já é o suficiente para mim."
 intrigue_events_bjorn.5100.desc:0 "Observando [Select_CString( the_lover.IsFemale, 'minha amada', 'meu amado' )] [the_lover.GetFirstName], ocorre-me que há muito que posso aprender com uma pessoa tão maravilhosa. A mente [the_lover.GetHerHim] é como um tesouro a ser explorado; e eu também tenho uma coisa ou duas para ensinar [Select_CString( the_lover.IsFemale, 'a', 'ao' )] [the_lover.GetFirstName].\n\nSem mencionar que é uma forma tão adorável de passarmos nosso tempo juntos!"
 intrigue_events_bjorn.5100.t:0 "Lições do Coração"
 intrigue_events_bjorn.5101.a:0 "Mostre-me o que inflama suas paixões, meu bem."
 intrigue_events_bjorn.5101.b:0 "Venha, compartilhe essa alegria comigo."
 intrigue_events_bjorn.5101.c:0 "Que tal aprendermos algo novo juntos?"
 intrigue_events_bjorn.5101.desc:0 "[the_lover.GetFirstName] me intriga tanto! Quero aproveitar aquilo que traz alegria a [the_lover.GetSheHe].\n\nAh, passar dias felizes juntos:\n\nMãos trabalhando em harmonia, mentes voltadas para objetivos em comum.\n\nNossos corações batendo como um só."
 intrigue_events_bjorn.5101.t:0 "Interesses Compartilhados"
 intrigue_events_bjorn.5102.a:0 "Tenho coisas assim para te mostrar."
 intrigue_events_bjorn.5102.b:0 "Diga-me o que você nunca compartilhou com ninguém."
 intrigue_events_bjorn.5102.c:0 "Vamos explorar nossas fantasias mais sombrias."
 intrigue_events_bjorn.5102.d:0 "Não! Algumas coisas nunca deveriam vir à tona."
 intrigue_events_bjorn.5102.desc:0 "À medida que nos aproximamos, agora estamos diante de um limiar. Talvez seja hora de compartilhar tudo um com o outro, de verdade, para que possamos conhecer tudo o que há para conhecer. Compartilhar coisas que normalmente… não são compartilhadas.\n\nNão há retorno depois desse ponto, mas [the_lover.GetFirstName] aceitará tudo o que há para saber sobre mim?"
 intrigue_events_bjorn.5102.t:0 "Amar a Sombra"
