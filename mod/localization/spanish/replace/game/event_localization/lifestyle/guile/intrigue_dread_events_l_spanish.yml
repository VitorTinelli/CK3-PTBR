 intrigue_protected_by_loved_one_modifier:0 "Protegido por um Ente Querido"
 intrigue_protected_by_loved_one_modifier_desc:0 "Essa pessoa tem um ente querido que faria #EMP qualquer coisa#! para protegê-la."
 intrigue_relaxed_oversight_modifier:0 "Supervisão Relaxada"
 intrigue_show_them_all_modifier:0 "Planejando Mostrar a Todos"
