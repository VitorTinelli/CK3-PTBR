l_spanish:
 forest_of_corpses_1_modifier:0 "Floresta de Cadáveres"
 forest_of_corpses_1_modifier_desc:0 "Uma grande floresta de cadáveres empalados foi erguida neste condado"
 forest_of_corpses_2_modifier:0 "$forest_of_corpses_1_modifier$"
 forest_of_corpses_2_modifier_desc:0 "$forest_of_corpses_1_modifier_desc$"
 forest_of_corpses_3_modifier:0 "$forest_of_corpses_1_modifier$"
 forest_of_corpses_3_modifier_desc:0 "$forest_of_corpses_1_modifier_desc$"
 intrigue_arbitrary_justice_modifier:0 "Execuções Arbitrárias"
 intrigue_blanket_of_fear_modifier:0 "Manto de Medo"
 intrigue_bumbling_tyrant_modifier:0 "Tirano Desastrado"
 intrigue_controlling_the_narrative_modifier:0 "Controlando a Narrativa"
 intrigue_defied_loved_one_opinion:0 "Desafiou um Ente Querido"
 intrigue_doing_chancellors_job_modifier:0 "$intrigue_doing_spymasters_job_modifier$"
 intrigue_doing_court_chaplains_job_modifier:0 "$intrigue_doing_spymasters_job_modifier$"
 intrigue_doing_marshals_job_modifier:0 "$intrigue_doing_spymasters_job_modifier$"
 intrigue_doing_spymasters_job_modifier:0 "Fazendo Tudo Por Aqui"
 intrigue_doing_stewards_job_modifier:0 "$intrigue_doing_spymasters_job_modifier$"
 intrigue_dread.1501.a:0 "O conteúdo exato das minhas refeições não importa."
 intrigue_dread.1501.b.flavor:0 "A ignorância pode ser uma bênção, mas eu #EMP preciso#! saber"
 intrigue_dread.1501.b.tt1:0 "Eu consigo me infiltrar e persuadir meu caminho até a cozinha"
 intrigue_dread.1501.b.tt2:0 "[cannibal_cook.GetSheHe|U] consegue manter a receita em segredo"
 intrigue_dread.1501.b:0 "[cannibal_cook.GetSheHe|U] acha que pode esconder um segredo de #EMP mim#!?"
 intrigue_dread.1501.c:0 "Alecrim com carne humana? Excelente escolha!"
 intrigue_dread.1501.desc:0 "\"Como você gosta do ensopado, [ROOT.Char.Custom('FormOfAddressForLiege')]?\" \n\nMisturados com pedaços de legumes estão pedaços gordurosos de carne, a textura fibrosa interrompida pelo que parece ser pelos curtos e escassos. Quando perguntado sobre os ingredientes, m[Select_CString( cannibal_cook.IsFemale, 'inha', 'eu' )] cozinheir[Select_CString( cannibal_cook.IsFemale, 'a', 'o' )] particular [cannibal_cook.GetTitledFirstName] apenas sorri e tenta me tranquilizar.\n\n\"Meu único desejo é #EMP servi-la#!, [ROOT.Char.Custom('FormOfAddressForLiege')]."
 intrigue_dread.1501.t:0 "A Refeição Noturna"
 intrigue_dread.1502.a.flavor:0 "Mas não em um prato"
 intrigue_dread.1502.a:0 "Traga-me a cabeça [cannibal_cook.GetHerHim]!"
 intrigue_dread.1502.b:0 "Jogue [cannibal_cook.GetSheHe] na [ROOT.Char.Custom('GetDungeon')]!"
 intrigue_dread.1502.c:0 "Mas estava tão delicioso..."
 intrigue_dread.1502.desc:0 "Ao entrar na cozinha, ela está escura e vazia, o ar pesado de fumaça. Em um canto, encontro o livro de receitas d[Select_CString( cannibal_cook.IsFemale, 'a', 'o' )] [cannibal_cook.GetTitledFirstName], coberto de manchas.\n\n#EMP Ao cozinhar o fígado, observou-se que o consumo excessivo de [ROOT.Char.Custom('RegionalDrink')] pode reduzir significativamente a qualidade do órgão-#! Um sentimento frio se instala no meu peito enquanto viro a página.\n#EMP ... no entanto, ao cozinhar crianças mais jovens com menos de-#!"
 intrigue_dread.1503.a:0 "Esse mistério vai me atormentar..."
 intrigue_dread.1503.desc:0 "Apesar dos meus melhores esforços, não consegui ter acesso à cozinha de uma forma que não levantaria suspeitas d[Select_CString( cannibal_cook.IsFemale, 'a', 'o' )] [cannibal_cook.GetTitledFirstName]."
 intrigue_dread.1801.a:0 "Isso foi muito esclarecedor."
 intrigue_dread.1801.b:0 "Ainda não terminamos."
 intrigue_dread.1801.c:0 "Nunca mais vamos fazer algo assim."
 intrigue_dread.1801.desc:0 "Agradeço sinceramente [Select_CString( test_subject.IsFemale, 'a', 'ao' )] [test_subject.GetTitledFirstName] enquanto [test_subject.GetSheHe] me olha com raiva através de uma névoa alquímica. Não foi fácil encontrar alguém para \"se voluntariar\" a testar minha coleção de... substâncias. Para [test_subject.GetSheHe], foi uma noite de dor, sensações de queimação e ocasional inconsciência."
 intrigue_dread.1801.mentor_desc:0 "\"E apenas um pouco mais disso faria com que [test_subject.GetSheHe] desmaiasse completamente,\" [intrigue_mentor.GetFirstName] me diz. Noss[Select_CString( test_subject.IsFemale, 'a', 'o' )] \"voluntári[Select_CString( test_subject.IsFemale, 'a', 'o' )]\", [test_subject.GetTitledFirstName], está quase completamente fora de si.\n\n[intrigue_mentor.GetFirstName] começa a guardar as garrafas. \"Infelizmente, acredito que isso é tudo que nosso sujeito é capaz de aguentar hoje à noite.\""
 intrigue_dread.1801.t:0 "Experimentação"
 intrigue_dread.1901.a:0 "Tenho esse veneno que estou querendo experimentar..."
 intrigue_dread.1901.b.tt:0 "Essa opção está disponível por causa do traço [GetTrait('gregarious').GetName( GetPlayer )] d[Select_CString( disliked_courtier.IsFemale, 'a', 'o' )] [disliked_courtier.GetFirstNameNoTooltip]"
 intrigue_dread.1901.b:0 "Seria uma pena se [disliked_courtier.GetSheHe] fizesse [disliked_courtier.GetHerselfHimself] de bobo na corte."
 intrigue_dread.1901.c.tt:0 "Essa opção está disponível por causa do traço [GetTrait('greedy').GetName( GetPlayer )] d[Select_CString( disliked_courtier.IsFemale, 'a', 'o' )] [disliked_courtier.GetFirstNameNoTooltip]"
 intrigue_dread.1901.c:0 "Uma bolsa mais leve para [disliked_courtier.GetSheHe] traz um clima mais leve para mim!"
 intrigue_dread.1901.d.tt:0 "Essa opção está disponível por causa do traço [GetTrait('lustful').GetName( GetPlayer )] d[Select_CString( disliked_courtier.IsFemale, 'a', 'o' )] [disliked_courtier.GetFirstNameNoTooltip]"
 intrigue_dread.1901.d:0 "\"Você ouviu? [disliked_courtier.GetSheHe|U] é tão sem graça quanto farinha na cama.\""
 intrigue_dread.1901.desc:0 "Dia após dia, tenho que tolerar a presença de [disliked_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\nSempre que falo com [disliked_courtier.GetSheHe], [disliked_courtier.GetSheHe] [disliked_courtier.Custom('quirk_neg_present')]. Será que [disliked_courtier.GetSheHe] está #EMP tentando#! me insultar? Não tolerarei mais desrespeito vindo d[Select_CString( disliked_courtier.IsFemale, 'a', 'o' )] [disliked_courtier.Custom2('InsultNoun', ROOT.Char)], alguém precisa ensinar uma lição para [disliked_courtier.GetSheHe]!"
 intrigue_dread.1901.t:0 "[Select_CString( disliked_courtier.IsFemale, 'A', 'O' )] [disliked_courtier.Custom2('InsultAdjective', ROOT.Char)|U] Bob[Select_CString( disliked_courtier.IsFemale, 'a', 'o' )]"
 intrigue_dread.2001.a.tt:0 "Venha mais perto. #EMP Mais perto#! Eu vou sussurrar em seu ouvido."
 intrigue_dread.2001.a:0 "Eles não fazem #EMP ideia#! do que eu já fiz."
 intrigue_dread.2001.b.into_it:0 "[loved_one.GetFirstName] é tocad[Select_CString( loved_one.IsFemale, 'a', 'o' )] pela sua devoção"
 intrigue_dread.2001.b.reassured:0 "[loved_one.GetFirstName] se sente tranquilizad[Select_CString( loved_one.IsFemale, 'a', 'o' )] sabendo que está segur[Select_CString( loved_one.IsFemale, 'a', 'o' )]"
 intrigue_dread.2001.b.terrified:0 "Sua confissão aterroriza [Select_CString( loved_one.IsFemale, 'a', 'o' )] [loved_one.GetFirstName]"
 intrigue_dread.2001.b:0 "Tudo o que faço é para te proteger!"
 intrigue_dread.2001.c:0 "Quem, especificamente, diz essas coisas? Eu quero nomes."
 intrigue_dread.2001.d:0 "Apenas sorria e siga em frente."
 intrigue_dread.2001.desc:0 "A mão d[Select_CString( loved_one.IsFemale, 'a', 'o' )] [loved_one.GetTitledFirstName] treme sob a minha. Quando estendo a mão para acariciar seu rosto, [loved_one.GetSheHe] se afasta.\n\n[loved_one.GetSheHe|U] me conta coisas estranhas que as pessoas dizem sobre mim. Coisas assustadoras. [loved_one.GetSheHe|U] se pergunta quais delas são verdadeiras."
 intrigue_dread.2001.t:0 "Até Mesmo [loved_one.GetSheHe|U] Me Teme"
 intrigue_dread.2101.a.tt.failure:0 "Ninguém acredita em suas histórias exageradas."
 intrigue_dread.2101.a.tt.success:0 "As pessoas acreditam que [Select_CString( family_member.IsFemale, 'a', 'o' )] [family_member.GetFirstName] é capaz de qualquer coisa."
 intrigue_dread.2101.a:0 "Espalhe rumores ainda mais sombrios sobre [Select_CString( family_member.IsFemale, 'a', 'o' )] [family_member.GetFirstNameNoTooltip] para que todos nos temam."
 intrigue_dread.2101.b.tt.failure:0 "[hater.GetTitledFirstName] continuará fofocando."
 intrigue_dread.2101.b.tt.success:0 "[hater.GetTitledFirstName] ficará em silêncio."
 intrigue_dread.2101.b:0 "Ofereça uma quantia em moedas para calar a boca d[Select_CString( hater.IsFemale, 'a', 'o' )] [hater.GetTitledFirstNameNoTooltip]."
 intrigue_dread.2101.c.tt.failure:0 "Sua associação com criminosos comuns se torna conhecida."
 intrigue_dread.2101.c.tt.success:0 "Ninguém ousará falar mal da sua família."
 intrigue_dread.2101.c:0 "Encontre discretamente arruaceiros para espancar [Select_CString( hater.IsFemale, 'a', 'o' )] [hater.GetTitledFirstNameNoTooltip]."
 intrigue_dread.2101.d:0 "Me afastar d[Select_CString( family_member.IsFemale, 'a', 'o' )] [family_member.GetFirstNameNoTooltip]."
 intrigue_dread.2101.desc.bad_friend:0 "[hater.GetSheHe|U] afirma que [Select_CString( family_member.IsFemale, 'a', 'o' )] [family_member.GetFirstName] foi [Select_CString( family_member.IsFemale, 'uma amiga má', 'um amigo mau' )] e que [hater.GetSheHe] ficou muito magoad[Select_CString( hater.IsFemale, 'a', 'o' )] quando [Select_CString( family_member.IsFemale, 'a', 'o' )] [family_member.GetFirstName] abandonou a amizade deles."
 intrigue_dread.2101.desc.bullied_me:0 "[hater.GetSheHe|U] afirma que [Select_CString( family_member.IsFemale, 'a', 'o' )] [family_member.GetFirstName] carrega a semente do mal desde a infância, quando [family_member.GetSheHe] intimidava [hater.GetNameNoTooltip] cruelmente."
 intrigue_dread.2101.desc.committed_adultery:0 "[hater.GetSheHe|U] afirma que [Select_CString( family_member.IsFemale, 'a', 'o' )] [family_member.GetFirstName] foi um[Select_CString( family_member.IsFemale, 'a', '' )] [family_member.GetWifeHusband] infiel e conta histórias sórdidas sobre [family_member.GetSheHe]."
 intrigue_dread.2101.desc.failed_assassination:0 "[hater.GetSheHe|U] até acusa [Select_CString( family_member.IsFemale, 'a', 'o' )] [family_member.GetFirstName] de tentar assassinar [hater.GetSheHe]."
 intrigue_dread.2101.desc.intro:0 "\"Esses malditos rumores sobre [Select_CString( family_member.IsFemale, 'a minha', 'o meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('family_member'))], [family_member.GetTitledFirstName]... Eu rastreei a fonte deles.\" [spymaster.Custom2('MyCharacterIntroduction', ROOT.Char)|U] bate em um monte de cartas.\n\nAs cartas provam que [hater.GetName] tem tentado difamar o nome d[Select_CString( family_member.IsFemale, 'a', 'o' )] [family_member.GetFirstName]."
 intrigue_dread.2101.desc.outro:0 "\n\nAs pessoas realmente acham que podem falar assim [Select_CString( family_member.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('family_member'))]?"
 intrigue_dread.2101.desc.sinner:0 "[hater.GetSheHe|U] zomba do caráter d[Select_CString( family_member.IsFemale, 'a', 'o' )] [family_member.GetFirstName], acusando [family_member.GetSheHe] de comportamento [ROOT.GetCharacter.Custom('GetSinMisdeedPlural')]."
 intrigue_dread.2101.t:0 "Rumores Sobre [Select_CString( family_member.IsFemale, 'a', 'o' )] [family_member.GetFirstNameNoTooltip]"
 intrigue_dread.2201.a:0 "Perfeito. Meu conselho #EMP deve#! ter medo de mim."
 intrigue_dread.2201.b:0 "Eu mesmo farei o seu trabalho, seu tolo!"
 intrigue_dread.2201.c.tt.failure:0 "[yesman.GetFirstNameNoTooltip] acha que você está tentando enganar [yesman.GetSheHe]."
 intrigue_dread.2201.c.tt.success:0 "[yesman.GetFirstNameNoTooltip] confia o suficiente em você para falar livremente."
 intrigue_dread.2201.c:0 "Fale livremente o que pensa. Sua posição está segura."
 intrigue_dread.2201.desc:0 "\"Que decisão sábia, meu senhor!\" [yesman.Custom2('MyCharacterIntroduction', ROOT.Char)] sorri nervosamente e balança a cabeça para mim como um pombo. \"Verdadeiramente, não tenho nada a acrescentar!\"\n\n[yesman.GetNameNoTooltip] tem tanto medo de mim que não contradiz minhas decisões. Isso torna [yesman.GetSheHe] bastante inútil como [yesman.GetCouncilTitle]."
 intrigue_dread.2201.t:0 "Com Medo de Expressar a Opinião [yesman.GetHerHim|U]"
 intrigue_dread.2301.a:0 "Apunhale [Select_CString( smirking_courtier.IsFemale, 'a', 'o' )] [smirking_courtier.GetFirstNameNoTooltip] na garganta."
 intrigue_dread.2301.b:0 "Faça [Select_CString( smirking_courtier.IsFemale, 'a', 'o' )] [smirking_courtier.GetFirstNameNoTooltip] ser arrastad[Select_CString( smirking_courtier.IsFemale, 'a', 'o' )] para o calabouço."
 intrigue_dread.2301.c:0 "Sorria, ria e planeje sua vingança."
 intrigue_dread.2301.d:0 "[smirking_courtier.GetFirstNameNoTooltip] morrerá durante a noite. Deixe-os especular o motivo."
 intrigue_dread.2301.desc.a:0 "\"Como somos sortudos por ter um [ROOT.Char.Custom('GetCourtOwner')] tão gentil, de coração puro e bondoso!\" O rosto sarcástico de [smirking_courtier.GetName] flutua diante de mim. \"Somos abençoados por viver em uma corte onde podemos estar livres do medo!\""
 intrigue_dread.2301.desc.b:0 "\"Como somos sortudos por ter um [ROOT.Char.Custom('GetCourtOwner')] tão genuíno, sincero e incapaz de enganar!\" O rosto sarcástico de [smirking_courtier.GetName] flutua diante de mim. \"Somos abençoados por viver em uma corte onde podemos estar livres do medo!\""
 intrigue_dread.2301.desc.c:0 "\"Como somos sortudos por ter um [ROOT.Char.Custom('GetCourtOwner')] tão simples e humilde, que não exige nada de nós!\" O rosto sarcástico de [smirking_courtier.GetName] flutua diante de mim. \"Somos abençoados por viver em uma corte onde podemos estar livres do medo!\""
 intrigue_dread.2301.desc.d:0 "\"Como somos sortudos por ter um [ROOT.Char.Custom('GetCourtOwner')] tão justo, com verdadeiro respeito pela lei!\" O rosto sarcástico de [smirking_courtier.GetName] flutua diante de mim. \"Somos abençoados por viver em uma corte onde podemos estar livres do medo!\""
 intrigue_dread.2301.desc.e:0 "\"Como somos sortudos por ter um [ROOT.Char.Custom('GetCourtOwner')] que se importa conosco, que nunca maltrataria seus súditos!\" O rosto sarcástico de [smirking_courtier.GetName] flutua diante de mim. \"Somos abençoados por viver em uma corte onde podemos estar livres do medo!\""
 intrigue_dread.2301.desc.outro:0 "\n\nAtrás d[Select_CString( smirking_courtier.IsFemale, 'a', 'o' )] [smirking_courtier.GetFirstNameNoTooltip], minha [ROOT.Char.Custom('GetCourt')] ri e aplaude. Essas pessoas não têm medo de mim. Elas não me respeitam. Elas não me conhecem. Vou mostrar a elas quem eu sou."
 intrigue_dread.2301.t:0 "Mostre Quem Você É"
 intrigue_dread.2401.a.tt.failure:0 "Execuções injustas indignam [execution_county.GetNameNoTier]"
 intrigue_dread.2401.a.tt.success:0 "Criminosos são purgados por todo [execution_county.GetNameNoTier]"
 intrigue_dread.2401.a:0 "Mais. Deles."
 intrigue_dread.2401.b.tt.failure:0 "As pessoas de [execution_county.GetNameNoTier] desperdiçam tempo contemplando as execuções"
 intrigue_dread.2401.b.tt.success:0 "As pessoas de [execution_county.GetNameNoTier] tremem diante da justiça"
 intrigue_dread.2401.b:0 "A presença na execução é obrigatória!"
 intrigue_dread.2401.c:0 "As execuções deveriam ser lentas. E #EMP criativas#!..."
 intrigue_dread.2401.d:0 "Plebeus não deveriam perder tempo nas execuções."
 intrigue_dread.2401.desc:0 "O ladrão condenado se contorce ao fim de uma corda e, em seguida, fica imóvel. A multidão de plebeus murmura sua aprovação e começa a dispersar.\n\nMas onde está o aplauso, o lamento, o terror? Eu poderia melhorar as execuções públicas em [execution_county.GetName] com uma simples mudança..."
 intrigue_dread.2401.t:0 "As Execuções Poderiam Ser Melhores"
 intrigue_dread.4001.a-c.tt:0 "Usarei [Select_CString( THIS.Char.IsFemale, 'a', 'o' )] [THIS.Char.GetTitledFirstName] como meu objeto nessa empreitada."
 intrigue_dread.4001.a.single:0 "Sim, [prisoner_1.GetSheHe] servirá perfeitamente..."
 intrigue_dread.4001.a:0 "[prisoner_1.GetTitledFirstNameNoTooltip] é perfeit[Select_CString( prisoner_1.IsFemale, 'a', 'o' )]!"
 intrigue_dread.4001.b:0 "Talvez [prisoner_2.GetTitledFirstNameNoTooltip] seja [Select_CString( prisoner_2.IsFemale, 'a', 'o' )] melhor?"
 intrigue_dread.4001.c:0 "Prefiro usar [Select_CString( prisoner_3.IsFemale, 'a', 'o' )] [prisoner_3.GetTitledFirstNameNoTooltip]."
 intrigue_dread.4001.d.flavor:0 "Vou revisitar essa ideia em alguns anos, espero com novos prisioneiros"
 intrigue_dread.4001.d:0 "Não, agora não é o momento certo."
 intrigue_dread.4001.desc.multiple:0 "\n\nA questão é, quem será minha tela?"
 intrigue_dread.4001.desc.single:0 "\n\nNo entanto, não consigo deixar de me perguntar se [Select_CString( prisoner_1.IsFemale, 'a', 'o' )] [prisoner_1.GetTitledFirstName] é uma tela adequada para a minha grande obra?"
 intrigue_dread.4001.desc.start:0 "Já não estou satisfeito com as torturas regulares pelas quais me tornei conhecido por infligir a meus prisioneiros. Desejo criar uma obra-prima - uma obra de arte que consagre a angústia e o sofrimento, transcendendo tudo o que já fiz antes!"
 intrigue_dread.4001.kinslayer:0 "Se [Select_CString( THIS.Char.IsFemale, 'a', 'o' )] [THIS.Char.GetTitledFirstName] for mort[Select_CString( THIS.Char.IsFemale, 'a', 'o' )] por isso, posso me tornar conhecido como um [GetTrait('kinslayer_3').GetName( GetPlayer )]."
 intrigue_dread.4001.t:0 "Sofrimento Exquisito"
 intrigue_dread.4002.a.flavor:0 "Vou expô-la para todo o [ROOT.Char.Custom('GetRealmOrDomicile')] ver!"
 intrigue_dread.4002.a:0 "Moldar o corpo desflorado [victim.GetHerHim] em uma bela escultura."
 intrigue_dread.4002.b.flavor:0 "Vou guardar na memória os gritos [victim.GetHerHim] por anos a fio."
 intrigue_dread.4002.b:0 "[victim.GetSheHe|U] vai me cantar uma doce canção de angústia..."
 intrigue_dread.4002.c.compassionate.tt:0 "@warning_icon! #warning Devido à minha natureza compassiva, seguir por esse caminho aumentará consideravelmente meu [stress|E].#!"
 intrigue_dread.4002.c.failure.desc:0 "[victim.GetFirstNameNoTooltip] perece antes de eu poder completar o processo"
 intrigue_dread.4002.c.flavor:0 "Vou começar o longo e árduo processo de despojar a individualidade d[Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetTitledFirstNameNoTooltip], transformando [victim.GetSheHe] em meu servo leal."
 intrigue_dread.4002.c.success.desc:0 "Eu consigo remodelar a mente d[Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetFirstNameNoTooltip] para atender aos meus propósitos"
 intrigue_dread.4002.c:0 "Quebrar a mente [victim.GetHerHim] e torná-la minha escrava!"
 intrigue_dread.4002.d:0 "Mudei de ideia, [victim.GetSheHe] não é adequado para isso..."
 intrigue_dread.4002.desc:0 "Agora que escolhi minha tela, preciso decidir qual forma minha obra-prima terá.\n\nPosso pensar em muitos tormentos que adoraria infligir [Select_CString( victim.IsFemale, 'a', 'ao' )] [victim.GetTitledFirstName], mas se eu quiser criar uma verdadeira obra-prima, devo me concentrar em fazer apenas uma coisa perfeitamente."
 intrigue_dread.4004.a:0 "Tortura física e dor."
 intrigue_dread.4004.b:0 "Privação de comida e sono."
 intrigue_dread.4004.c:0 "Humilhação e degradação."
 intrigue_dread.4004.desc.followup:0 "[victim.GetTitledFirstName] está ficando insensível ao meu método atual de tortura, e não tem mais o mesmo impacto de antes. Precisarei escolher uma abordagem diferente..."
 intrigue_dread.4004.desc:0 "Para remodelar a mente d[Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetTitledFirstName], primeiro devo submetê-la a um estresse extremo.\n\nDevo escolher cuidadosamente um método de tortura ao qual [Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetFirstNameNoTooltip] seja particularmente vulnerável - assim, posso garantir que infligirei a quantidade máxima de trauma possível."
 intrigue_dread.4004.o.flavor:0 "A eficácia dessa técnica varia com base nos [traits|E] de [victim.GetTitledFirstNameNoTooltip]."
 intrigue_dread.4005.a:0 "Oferecer palavras reconfortantes... enquanto continuo com a tortura!"
 intrigue_dread.4005.b:0 "Afirmar que tudo isso é punição pelos [ROOT.Char.Custom('GetSinMisdeedPlural')] [victim.GetHerHim]."
 intrigue_dread.4005.c:0 "Deixar [victim.GetSheHe] esperar um alívio, para então destruir suas esperanças."
 intrigue_dread.4005.desc.followup:0 "[victim.GetTitledFirstName] ainda está se agarrando aos remanescentes dilacerados de sua identidade, danificada mas ainda não destruída. Devo empregar outra tática para concluir o trabalho..."
 intrigue_dread.4005.desc:0 "[victim.GetTitledFirstName] finalmente desistiu da esperança e não mais luta contra mim no calabouço.\n\nIsso significa que é hora de passar para a segunda etapa, na qual devo criar culpa e confusão suficientes na mente [victim.GetHerHim] para prejudicar seu senso de moralidade, propósito e até mesmo identidade."
 intrigue_dread.4006.a.tt:0 "Começo a transformar [Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetTitledFirstName] em um[Select_CString( victim.IsFemale, 'a', '' )] serv[Select_CString( victim.IsFemale, 'a', 'o' )] obediente"
 intrigue_dread.4006.a:0 "Vou remodelar [victim.GetSheHe] para se adequar ao meu propósito."
 intrigue_dread.4006.b:0 "É mais divertido enviar [victim.GetSheHe] de volta como uma casca vazia."
 intrigue_dread.4006.desc:0 "Finalmente, eu retirei os últimos vestígios da identidade d[Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetTitledFirstName]. [victim.GetSheHe|U] agora é um recipiente vazio, incapaz de interagir com o mundo ao seu redor."
 intrigue_dread.4007.a:0 "Ah, as coisas que faremos juntos!"
 intrigue_dread.4007.desc:0 "Está feito - [victim.GetTitledFirstName] está diante de mim, [Select_CString( victim.IsFemale, 'minha escrava', 'meu escravo' )] obediente, disposto a fazer qualquer coisa que eu peça a [victim.GetSheHe]."
 intrigue_dread.4008.a.failure:0 "Malditos por destruírem minha arte!"
 intrigue_dread.4008.a.lunatic:0 "Tivemos um bom momento, pelo menos."
 intrigue_dread.4008.a.success:0 "Excelente..."
 intrigue_dread.4008.desc.failure:0 "\n\nInfelizmente, parece que amigos e familiares [victim.GetHerHim] conseguiram desfazer grande parte do meu delicado trabalho n[victim.GetSheHe], e [victim.GetSheHe] não é mais leal a mim."
 intrigue_dread.4008.desc.lunatic:0 "\n\nInfelizmente, parece que a discrepância entre meu condicionamento e as realidades da nova vida [victim.GetHerHim] foi demais para [victim.GetSheHe], e [victim.GetSheHe] finalmente enlouqueceu."
 intrigue_dread.4008.desc.success:0 "[victim.GetSheHe|U] readaptou-se ao seu ambiente e assumiu suas responsabilidades normais - tudo enquanto permanece leal a mim."
 intrigue_dread.4008.desc:0 "Passaram-se vários anos desde que liberei [Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetTitledFirstName] de volta ao mundo para fazer minha vontade."
 intrigue_dread.4011.a:0 "Um contratempo lamentável..."
 intrigue_dread.4011.desc:0 "Agora que [Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetTitledFirstName] não está mais em meus [ROOT.Char.Custom('GetDungeonPlural')], não posso continuar meu trabalho de transformá-la em minha obra-prima. Isso colocará meus planos em espera até que eu possa adquirir outra tela adequada e inspiradora, pois mesmo que eu consiga recuperar [victim.GetSheHe], não será a mesma coisa."
 intrigue_dread.4013.a:0 "Precisarei ter mais cuidado da próxima vez."
 intrigue_dread.4013.desc:0 "Parece que minhas #EMP ações#! foram demais para [Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetTitledFirstName], que faleceu em meus [ROOT.Char.Custom('GetDungeonPlural')].\n\nAgora, não poderei concluir minha obra-prima a menos que eu adquira outra tela adequada e inspiradora, e [ROOT.Char.GetFaith.HighGodName] sabe quanto tempo isso levará..."
 intrigue_dread.4100.a:0 "Guardas, tirem esses rufiões da minha vista!"
 intrigue_dread.4100.b.duel_failure:0 "Os peticionários se sentem insultados por minhas ameaças"
 intrigue_dread.4100.b.duel_success:0 "Os peticionários se encolhem diante da minha ira"
 intrigue_dread.4100.b:0 "Vou ensiná-los a não desperdiçar o tempo da corte!"
 intrigue_dread.4100.c.support.petitioner_1:0 "Se você apoiar [Select_CString( petitioner_1.IsFemale, 'a', 'o' )] [petitioner_1.GetTitledFirstName]"
 intrigue_dread.4100.c.support.petitioner_2:0 "Se você apoiar [Select_CString( petitioner_2.IsFemale, 'a', 'o' )] [petitioner_2.GetTitledFirstName]"
 intrigue_dread.4100.c.tooltip:0 "Você levará tempo para tomar uma decisão"
 intrigue_dread.4100.c:0 "Deixem-me ouvir isso mais uma vez..."
 intrigue_dread.4100.d:0 "[scoped_chancellor.GetTitledFirstNameNoTooltip] deveria lidar com esses assuntos."
 intrigue_dread.4100.desc.councillors:0 "\n\nEles querem me convencer de que isso é um problema que coloca em risco a segurança do reino, mas não consigo deixar de sentir que estão superestimando a gravidade da situação para alimentar seu próprio ego."
 intrigue_dread.4100.desc.fallback:0 "\n\nQuanto mais ouço suas razões, mais convencido fico de que toda a audiência está abaixo da minha preocupação."
 intrigue_dread.4100.desc.intro:0 "Não há um dia sequer sem que algum assunto insignificante seja trazido à minha atenção na corte. Hoje, parece que é a vez d[Select_CString( petitioner_1.IsFemale, 'a', 'o' )] [petitioner_1.GetTitledFirstName] e [Select_CString( petitioner_2.IsFemale, 'a', 'o' )] [petitioner_2.GetTitledFirstName] desperdiçarem meu tempo com uma disputa fútil."
 intrigue_dread.4100.desc.lazy:0 "\n\nMal consigo ouvir suas queixas... Como devo governar quando a maior parte do meu tempo e energia limitados é desperdiçada em assuntos tão insignificantes?"
 intrigue_dread.4100.t:0 "Audiências Intermináveis"
 intrigue_dread.4100.z:0 "Fico imaginando, como seriam falantes as suas cabeças decepadas?"
 intrigue_dread.4102.a:0 "Exijo que vocês façam as pazes agora. Ou então..."
 intrigue_dread.4102.b:0 "[petitioner_1.GetFirstNameNoTooltip] está claramente certo."
 intrigue_dread.4102.c:0 "As palavras d[Select_CString( petitioner_2.IsFemale, 'a', 'o' )] [petitioner_2.GetFirstNameNoTooltip] ecoam verdadeiras aos meus ouvidos."
 intrigue_dread.4102.desc.antagonizer:0 "\n\nSe nada mais, posso dizer que [Select_CString( scoped_antagonizer.IsFemale, 'a', 'o' )] [scoped_antagonizer.GetFirstNameNoTooltip] é de longe o mais irritante dos dois peticionários."
 intrigue_dread.4102.desc.commanders:0 "O cerne da questão entre [Select_CString( petitioner_1.IsFemale, 'a', 'o' )] [petitioner_1.GetFirstName] e [Select_CString( petitioner_2.IsFemale, 'a', 'o' )] [petitioner_2.GetFirstName] está relacionado a uma disputa entre os comandantes e alguns veteranos do exército."
 intrigue_dread.4102.desc.fallback:0 "Eu esperava que ouvir suas queixas revelasse um significado mais profundo para todo esse assunto, mas as brigas d[Select_CString( petitioner_1.IsFemale, 'a', 'o' )] [petitioner_1.GetFirstNameNoTooltip] e [Select_CString( petitioner_2.IsFemale, 'a', 'o' )] [petitioner_2.GetFirstNameNoTooltip] parecem superficiais aos meus ouvidos."
 intrigue_dread.4102.desc.guests:0 "Aparentemente, o problema surgiu de um incidente diplomático..."
 intrigue_dread.4200.a:0 "Vamos começar!"
 intrigue_dread.4200.b:0 "[random_prisoner_scope.GetTitledFirstNameNoTooltip] e alguns plebeus devem transmitir uma mensagem."
 intrigue_dread.4200.c:0 "Uma pequena coleção de corpos deve ser suficiente."
 intrigue_dread.4200.d:0 "Todos devem temer a mim!"
 intrigue_dread.4200.desc.commoner_forest.outro:0 "Vejo fileira após fileira de criminosos comuns se estendendo até o horizonte, a [ROOT.Char.GetCapitalLocation.GetTerrain.GetNameNoTooltip] manchada com seu sangue. Com um pouco de trabalho, podemos reunir o suficiente dessas pragas para tornar meu sonho realidade."
 intrigue_dread.4200.desc.commoner_forest:0 "Muitos assassinos e batedores de carteira humildes do campo e das cidades aguardam seu destino, à margem da sociedade, mas talvez eu tenha uma ideia melhor para eles."
 intrigue_dread.4200.desc.intro:0 "Por meio de meus esforços para me tornar uma figura verdadeiramente temida e respeitada, um grande número de pessoas culpadas e desleais acabou em meu calabouço."
 intrigue_dread.4200.desc.middle:0 "\n\nNas minhas maquinações macabras, visualizo uma floresta de criminosos e traidores empalados cercando [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] por todos os lados: um lembrete sombrio para todos sobre o que acontece quando se trai [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]."
 intrigue_dread.4200.desc.noble_forest.outro:0 "Vejo [random_prisoner_scope.GetName] em uma estaca, cercado por plebeus erguidos da mesma maneira. Agora só falta tornar esse sonho realidade!"
 intrigue_dread.4200.desc.noble_forest:0 "Minhas celas estão cheias até a borda de rivais, traidores e criminosos comuns. Talvez seja hora de eles conhecerem [ROOT.Char.GetFaith.DeathDeityName] no [ROOT.Char.GetFaith.NegativeAfterLife] e servirem aos interesses [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] enquanto estão nisso!"
 intrigue_dread.4200.e:0 "Pelo [ROOT.Char.GetFaith.HighGodName]! Eu não consigo fazer isso!"
 intrigue_dread.4200.t:0 "A Floresta dos Meus Sonhos"
 intrigue_dread.4201.a:0 "Agora todos temerão o nome \"[ROOT.Char.GetNameNoTooltip]."
 intrigue_dread.4201.desc.commoner_forest:0 "\n\nPasso por fileiras e fileiras de criminosos sem nome e bandidos, certo de que qualquer ladrão de estrada ou bandido que se aproxime de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] possa ver claramente o que acontece com aqueles que tentam semear crime e desordem no [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]!"
 intrigue_dread.4201.desc.intro:0 "Finalmente, minha visão ganhou vida pelos corpos de incontáveis criminosos. Eu caminho tranquilamente ao som dos pássaros cacarejantes e do gotejar suave do sangue estagnado no chão encharcado."
 intrigue_dread.4201.desc.noble_forest:0 "\n\nEu me deparo com o corpo de [random_prisoner.GetNameNoTooltip], seu rosto congelado em uma expressão distorcida de choque e terror, como se [random_prisoner.GetSheHe] estivesse de alguma forma ciente do seu destino."
 intrigue_dread.4201.desc.outro:0 "\n\nAo concluir meu passeio, respiro pela última vez o miasma mortal antes de retornar para casa, satisfeito com meu trabalho."
 intrigue_dread.4201.t:0 "A Floresta de Cadáveres"
 intrigue_dread_special.1101.a.a:0 "Vou interpretar o fazendeiro ganancioso!"
 intrigue_dread_special.1101.a.b:0 "Vou interpretar [Select_CString( ROOT.Char.IsFemale, 'a velha', 'o velho' )] [ROOT.Char.GetWifeHusband]!"
 intrigue_dread_special.1101.a.c:0 "Vou interpretar o criado astuto!"
 intrigue_dread_special.1101.a.d:0 "Vou interpretar o jovem amante!"
 intrigue_dread_special.1101.a.e:0 "Vou interpretar o bobo melancólico!"
 intrigue_dread_special.1101.b:0 "Reserve um assento na primeira fileira para mim."
 intrigue_dread_special.1101.c:0 "Isso está abaixo de mim."
 intrigue_dread_special.1101.desc:0 "Primeiro, dois cavalos, vestidos com freios e penas elegantes, e então uma carroça carregada com cofres e pessoas.\n\nLogo, minha comitiva e eu somos abordados por uma companhia teatral itinerante, todos com roupas coloridas e pessoas animadas.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.Custom('RandomWomanMan')] idosa chama da carroça em movimento, \"Posso ver seu olhar saudoso. Por que você não se junta a nós para um espetáculo?\""
 intrigue_dread_special.1101.t:0 "Representar um Papel"
 intrigue_dread_special.1102.a.duel_failure:0 "Suas instruções confundem os atores"
 intrigue_dread_special.1102.a.duel_success:0 "Você usa suas habilidades organizacionais com sucesso"
 intrigue_dread_special.1102.a:0 "Não, mova aquele cenário para lá!"
 intrigue_dread_special.1102.b.duel_failure:0 "Suas instruções confundem os atores"
 intrigue_dread_special.1102.b.duel_success:0 "Você se familiariza com os atores"
 intrigue_dread_special.1102.b:0 "Vamos repassar juntos!"
 intrigue_dread_special.1102.c.flavor:0 "Uma escolha segura, mas baixo risco resulta em pequenas recompensas."
 intrigue_dread_special.1102.c:0 "Vou ler o roteiro mais #EMP uma#! vez."
 intrigue_dread_special.1102.desc:0 "O primeiro passo para qualquer apresentação, seja realizada nos salões de meu [ROOT.Char.Custom('FortifiedBuilding')] ou em um palco, é a preparação.\n\nCercado pela agitação da companhia teatral e anonimizado em minhas roupas emprestadas, encontro-me com algum tempo livre antes do início do espetáculo."
 intrigue_dread_special.1103.a.duel_failure:0 "Não consigo entrar no personagem"
 intrigue_dread_special.1103.a.duel_success:0 "Interpreto meu personagem perfeitamente"
 intrigue_dread_special.1103.a:0 "O público deve #EMP sentir#! isso!"
 intrigue_dread_special.1103.b.duel_failure:0 "Gaguejo durante minha performance"
 intrigue_dread_special.1103.b.duel_success:0 "O público fica impressionado com minha dicção"
 intrigue_dread_special.1103.b:0 "Vou me concentrar em ler cada linha de forma impecável."
 intrigue_dread_special.1103.c:0 "Vou seguir o roteiro e ficar em segundo plano."
 intrigue_dread_special.1103.desc:0 "Ao pisar no palco com os outros artistas, a atenção da plateia é inabalável.\n\nConforme uma cena segue a outra, posso sentir o ritmo da história sendo contada; ele pulsa dentro de mim. Quando chega a hora de dizer minha primeira fala, é como se toda a plateia prendesse a respiração."
 intrigue_dread_special.1197.a:0 "Pelo menos me diverti."
 intrigue_dread_special.1197.desc:0 "Devo admitir que minha primeira apresentação pode ter sido um tanto deficiente... Colocar toda a trupe nos troncos foi recebido com uma reação muito mais favorável por parte dos camponeses. Bem, talvez não exatamente #EMP favorável#!, mas certamente satisfatória."
 intrigue_dread_special.1197.t:0 "Uma Performance Horrenda"
 intrigue_dread_special.1198.a:0 "Uma experiência verdadeiramente sublime, não é?"
 intrigue_dread_special.1198.desc:0 "Repetimos a apresentação novamente, e novamente, e novamente, enquanto o público, sob o olhar atento dos meus guardas, continua aplaudindo a cada vez. \n\nApós cada novo ensaio, minha atuação fica mais refinada enquanto os outros artistas se tornam mais descuidados, arrastados pelo medo e pela frustração, até que começam a cair um por um de exaustão, deixando-me sozinho e triunfante no palco."
 intrigue_dread_special.1199.a:0 "Sair, pela esquerda."
 intrigue_dread_special.1199.b:0 "Na próxima vez, apenas espere!"
 intrigue_dread_special.1199.c.a:0 "Vocês #EMP vão#! aplaudir! Guardas!"
 intrigue_dread_special.1199.c.b:0 "Isso certamente foi uma trama para me humilhar! Guardas!"
 intrigue_dread_special.1199.desc_fallback:0 "Sigo o roteiro, e a cena flui suavemente, mas sem destaque."
 intrigue_dread_special.1199.desc_loose:0 "\n\nAo terminarmos a última cena, revezando-se para cumprimentar a plateia, o silêncio fala por si só quando chega a minha vez. Apesar dos meus esforços, não consegui fazer a plateia acreditar na minha mentira, e a decepção é um amargo de engolir."
 intrigue_dread_special.1199.desc_loose_feeling:0 "É uma parte curta, mas de alguma forma eu consigo errar tudo. Eu sempre fui bom em influenciar as pessoas na corte, mas lidar com tantas pessoas... é uma experiência totalmente nova."
 intrigue_dread_special.1199.desc_loose_reading:0 "Enquanto o riso da plateia diminui, tento me recuperar do meu erro. Dizer a coisa certa no momento certo é geralmente algo em que sou bom, mas fazer isso em um palco está se mostrando mais difícil do que eu imaginava."
 intrigue_dread_special.1199.desc_win:0 "\n\nSomos seguidos fora do palco por aplausos estrondosos após a última cena. Enganar completamente toda a plateia, manter minha disfarce e engano e ser capaz de enganar tantas pessoas de uma vez... É uma sensação poderosa!"
 intrigue_dread_special.1199.desc_win_feeling:0 "É uma parte curta, mas eu faço valer a pena. A plateia fica pendente de cada palavra minha, envolvida na história que teço para eles."
 intrigue_dread_special.1199.desc_win_reading:0 "Entrego minhas falas impecavelmente, capturando o momento e exigindo a atenção total da plateia."
 intrigue_dread_special.1199.z:0 "E eu desejo sentir isso novamente! E novamente!"
 intrigue_dread_special.1301.a:0 "Ouvi vocês conspirando contra mim! Guardas!"
 intrigue_dread_special.1301.b:0 "Nada com que quaisquer #EMP [ROOT.Char.Custom('GetServants')] leias#! devam se preocupar..."
 intrigue_dread_special.1301.c.duel_failure:0 "Meus súditos estão inquietos"
 intrigue_dread_special.1301.c.duel_success:0 "Consegui tranquilizar os [ROOT.Char.Custom('GetCourtierPlural')|U] com sucesso"
 intrigue_dread_special.1301.c:0 "Eu garanto a vocês que não há nada com que se preocupar."
 intrigue_dread_special.1301.d:0 "Cuide dos seus próprios assuntos!"
 intrigue_dread_special.1301.desc:0 "\"... e quanto tempo até que [ROOT.Char.GetSheHe] esteja conspirando contra #EMP nós#!? Essa trama está saindo do controle.\" [courtier_first.GetTitledFirstName] e [Select_CString( courtier_second.IsFemale, 'a', 'o' )] [courtier_second.GetTitledFirstName] estão de cabeças juntas e se assustam quando viro a esquina.\n\n\"Minha [ROOT.Char.GetTitleTierName]! Estávamos apenas falando sobre suas... atividades recreativas. Parece que elas estão ocupando muito do seu tempo.\""
 intrigue_dread_special.1301.t:0 "[ROOT.Char.Custom('GetCourtierPlural')|U] Preocupados"
 intrigue_everyone_heard_horrifying_rumours_tt:0 "Todos na sua corte ouviram rumores horríveis sobre [family_member.GetNameNoTooltip]."
 intrigue_everyone_heard_rumours_tt:0 "Todos na sua corte ouviram rumores embaraçosos sobre [family_member.GetNameNoTooltip]."
 intrigue_everyone_is_satisfied_tt:0 "[hater.GetTitledFirstName] e [Select_CString( family_member.IsFemale, 'a', 'o' )] [family_member.GetFirstName] estão satisfeitos com essa resolução."
