l_spanish:
 mystic_lifestyle.1001.a:0 "Isso me aproxima de [ROOT.Char.GetFaith.HighGodName] mais do que você jamais poderia esperar!"
 mystic_lifestyle.1001.b.flavor:0 "Dizer a [priest.GetSheHe] que você estava pensando em [ROOT.Char.GetFaith.HighGodNameAlternate] provavelmente não será bem recebido"
 mystic_lifestyle.1001.b:0 "Claro. No que eu estava pensando?"
 mystic_lifestyle.1001.desc:0 "Minhas preparações para minha comunhão mística estão bem encaminhadas quando [SCOPE.sC('priest').Custom2('MyCharacterIntroduction', ROOT.Char)] se aproxima de mim.\n\n\"Não acredito que o que você está fazendo seja totalmente... ortodoxo\", [priest.GetSheHe] me diz. \"Um bom [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] se absteria desse tipo de comportamento.\""
 mystic_lifestyle.1001.t:0 "$mystic_lifestyle_communion_header$Desaprovação"
 mystic_lifestyle.1002.a:0 "Eu conheço a vontade de [ROOT.Char.GetFaith.HighGodName] melhor do que você!"
 mystic_lifestyle.1002.desc:0 "Chegou ao meu conhecimento que você se envolve regularmente em algumas formas muito incomuns de oração.\n\nExijo que você ponha fim a essa prática ridícula e faça penitência apropriada por essa interpretação equivocada de nossa fé."
 mystic_lifestyle.1002.opening:0 "[SCOPE.sC('religious_head').Custom2('AppropriateGreeting', ROOT.Char)]"
 mystic_lifestyle.1003.a:0 "Sua ignorância sobre os segredos de [ROOT.Char.GetFaith.HighGodName] não me deterá!"
 mystic_lifestyle.1003.desc.clergy:0 "Você que jurou defender a fé deveria saber mais do que ninguém, mas ainda assim vagueia por este caminho estranho. Se você não quer dar ouvidos ao seu próprio chamado, então [ROOT.Char.GetFaith.HighGodName] certamente o fará.\n\nVolte atrás, eu lhe peço, antes que este misticismo se corrompa em heresia ou adoração de demônios!"
 mystic_lifestyle.1003.desc:0 "Suas práticas estranhas não são sancionadas pelos [ROOT.Char.GetFaith.PriestNeuterPlural] e alguém deve lhe chamar a atenção por isso. Se eu não o fizer agora, então [ROOT.Char.GetFaith.HighGodName] o fará.\n\nPor favor, veja a razão e afaste-se desse caminho estranho. Quem sabe a que heresia ou adoração de demônios isso pode levar!"
 mystic_lifestyle.1003.opening:0 "[Select_CString( ROOT.Char.IsFemale, 'A minha', 'Ao meu' )] [SCOPE.sC('vassal').Custom2('RelationToMeShort', ROOT.Char)] lamentavelmente equivocad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]"
 mystic_lifestyle.1004.a:0 "Não me importo nem um pouco com o que eles sussurram."
 mystic_lifestyle.1004.b:0 "Se eu for aberto e acolhedor, talvez eles entendam?"
 mystic_lifestyle.1004.desc:0 "Parece que meus hábitos religiosos um tanto incomuns estão chamando a atenção de mais e mais pessoas.\n\nIsso mal é um problema — elas não têm esperança de entender o que estou fazendo —, mas os sussurros dizem que estou fazendo coisas #EMP às escondidas#! e que as pessoas deveriam ficar de olho."
 mystic_lifestyle.1004.t:0 "$mystic_lifestyle_communion_header$Rumores"
 mystic_lifestyle.1005.a:0 "Fico satisfeito que você reconheça meu esforço."
 mystic_lifestyle.1005.b:0 "Deixe-me te ensinar como se faz!"
 mystic_lifestyle.1005.desc:0 "Não pretendo entender completamente seus hábitos e práticas. No entanto, devo aplaudir o esforço evidente que você coloca em suas orações.\n\nSe apenas todo verdadeiro crente fosse tão devoto quanto você."
 mystic_lifestyle.1005.opening:0 "[Select_CString( ROOT.Char.IsFemale, 'Minha querida', 'Meu querido' )] [SCOPE.sC('vassal').Custom2('RelationToMeShort', ROOT.Char)]"
 mystic_lifestyle.1006.a:0 "Eles podem ter medo conforme suas almas pequenas permitirem."
 mystic_lifestyle.1006.b:0 "Jurar que não faço mal os deixará mais à vontade."
 mystic_lifestyle.1006.desc:0 "Com minhas práticas místicas, aparentemente desenvolvi uma reputação considerável. As pessoas não sabem exatamente o que faço, mas sabem que não querem me desafiar e descobrir.\n\nÉ ridículo, mas talvez não seja completamente ruim..."
 mystic_lifestyle.1006.t:0 "$mystic_lifestyle_communion_header$Uma Reputação"
 mystic_lifestyle.1007.a:0 "Servos... Socorro..."
 mystic_lifestyle.1007.desc:0 "Minhas comunhões com o divino têm sido diferentes ultimamente. Elas já não me trazem êxtase, mas fraqueza.\n\nHoje, nem mesmo consigo reunir forças para levantar da cama."
 mystic_lifestyle.1007.t:0 "$mystic_lifestyle_communion_header$Algo Errado"
 mystic_lifestyle.1008.a:0 "Estou curado!"
 mystic_lifestyle.1008.desc:0 "Apesar de minha condição enfraquecida, fiz o que pude para realizar minha comunhão.\n\nEla foi mais intensa do que nunca e, nesta manhã, eis que! [ROOT.Char.GetFaith.HighGodName|U] me ofereceu um milagre!"
 mystic_lifestyle.1008.t:0 "$mystic_lifestyle_communion_header$Um Milagre"
 mystic_lifestyle.1009.a:0 "Ficarei feliz em compartilhar!"
 mystic_lifestyle.1009.desc:0 "Devo aplaudir sua exploração mística de nossa fé!\n\nPelos rumores que ouço, parece que tenho algumas coisas a aprender também!"
 mystic_lifestyle.1009.opening:0 "[Select_CString( ROOT.Char.IsFemale, 'Minha querida', 'Meu querido' )] [SCOPE.sC('mystic').Custom2('RelationToMeShort', ROOT.Char)]"
 mystic_lifestyle_communion_header:0 "Comunhão Mística: "
