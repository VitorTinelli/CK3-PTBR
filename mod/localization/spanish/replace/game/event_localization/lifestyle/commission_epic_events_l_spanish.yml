 bards_write_epic:0 "Meus bardos compõem a epopeia"
 commission_epic.0001.a:0 "[writer.GetTitledFirstNameNoTooltip], [Select_CString( writer.IsFemale, 'a', 'o' )] habilidos[Select_CString( writer.IsFemale, 'a', 'o' )] contador[Select_CString( writer.IsFemale, 'a', '' )] de histórias!"
 commission_epic.0001.b:0 "Vou reunir alguns dos meus melhores [ROOT.Char.Custom('CommissionEpicScribes')]."
 commission_epic.0001.c:0 "Certamente qualquer humilde [servant.Custom('GenderedLowlyServantType')] poderia fazer isso?"
 commission_epic.0001.d:0 "Pensando melhor..."
 commission_epic.0001.desc:0 "O que eu preciso é de um conto clássico sobre a grandiosidade da minha família. Um [ROOT.Char.Custom('CompositionType')] sobre as origens da Dinastia [ROOT.Char.GetDynasty.GetBaseName] e como estamos destinados à grandeza!\n\nEu só preciso de alguém que saiba contar uma história..."
 commission_epic.0001.t:0 "Uma Epopeia Familiar"
 commission_epic.0002.a:0 "Enfoque nas histórias das reivindicações ancestrais da minha dinastia"
 commission_epic.0002.b:0 "Deve se concentrar em mim e no meu destino, é claro!"
 commission_epic.0002.c:0 "É uma história da #FAMÍLIA#!, então seja generoso."
 commission_epic.0002.d:0 "Conte a história o mais verdadeiramente possível."
 commission_epic.0002.iberia_epic.a:0 "Escreva sobre o direito da minha dinastia de governar a Ibéria!"
 commission_epic.0002.scribes:0 "Meus [ROOT.Char.Custom('CommissionEpicScribes')] começaram a trabalhar na minha epopeia familiar, mas eles já estão enfrentando problemas. Eles não conseguem concordar sobre qual deveria ser o foco da história, com cada [ROOT.Char.Custom('CommissionEpicScribe')] insistindo coincidentemente que sua própria área de responsabilidade deveria ser a mais enfatizada.\n\n\"Não queremos impor, [ROOT.Char.Custom('FormOfAddressForLiege')], mas você #TEM#! que resolver isso antes que nos matemos uns aos outros!\""
 commission_epic.0002.servant:0 "[servant.GetFirstName], [Select_CString( servant.IsFemale, 'a', 'o' )] serv[Select_CString( servant.IsFemale, 'a', 'o' )] que ordenei para trabalhar na história da minha família, parece estar lutando um pouco. É impressionante que [servant.GetSheHe] esteja fazendo qualquer progresso, já que [servant.GetSheHe] não sabe nem ler nem rimar.\n\nNo entanto, [servant.GetSheHe] trabalha dia e noite e agora veio até mim com uma pergunta importante. 'Sobre o que exatamente deveria ser, [ROOT.Char.Custom('FormOfAddressForLiege')]?'"
 commission_epic.0002.t:0 "Epopeia Familiar: Perspectiva"
 commission_epic.0002.writer:0 "Minha Epopeia Familiar parece estar progredindo bem, e algumas linhas já soam como se fossem ser citadas por décadas, mas [Select_CString( writer.IsFemale, 'a', 'o' )] [writer.GetTitledFirstName] tem muitas perguntas sobre o foco da história.\n\nSeria mais fácil responder se [writer.GetSheHe] escrevesse tudo primeiro. Aí eu poderia dizer a [writer.GetSheHe] o que não gosto, mas [writer.GetSheHe] insiste que [writer.GetSheHe] precisa de respostas agora."
 commission_epic.1001.a:0 "Quero que seja bom e quero isso #EMP agora!#!"
 commission_epic.1001.b:0 "Vou aguentar [ROOT.Char.Custom2('CommissionEpicComposerThem', composer)] pelo tempo que for necessário."
 commission_epic.1001.b_scribes:0 "Vou aguentar [ROOT.Char.Custom('CommissionEpicComposerThem')] pelo tempo que for necessário."
 commission_epic.1001.c:0 "Agora, se dividirmos o que já está pronto em Parte 1..."
 commission_epic.1001.composer:0 "[composer.GetSheHe] acaba fazendo um trabalho de baixa qualidade! É pedir demais que [composer.GetSheHe] entregue excelência e que [composer.GetSheHe] entregue agora?"
 commission_epic.1001.opening:0 "Não tenho recebido novos trabalhos para minha epopeia familiar há semanas, e todo o processo está demorando demais ou"
 commission_epic.1001.scribes:0 "meus [ROOT.Char.Custom('CommissionEpicScribes')] acabam fazendo um trabalho de baixa qualidade! É pedir demais que eles entreguem excelência e que entreguem rápido?"
 commission_epic.1001.t:0 "Epopeia Familiar: Uma Questão de Tempo"
 commission_epic.1002.a.tt:0 "Ao ser concluída, você receberá um livro da Epopeia Familiar como um [artifact|E] que melhora a [opinion|E] do [vassal|E]"
 commission_epic.1002.a:0 "Deveria ser compartilhado com todos os meus vassalos!"
 commission_epic.1002.b.tt:0 "O que também significa que posso reduzir o pagamento do salário!"
 commission_epic.1002.b:0 "Coloque-o na [ROOT.Char.Custom('CompositionType')] para que seja concluído mais rapidamente!"
 commission_epic.1002.composer:0 "[composer.GetTitledFirstName] está contando a [powerful_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] sobre vários detalhes empolgantes que [composer.GetSheHe] descobriu sobre meus antepassados. 'Agora, eu acredito que a parte com o [ROOT.Char.Custom('CompositionDetail')] pode realmente ser verdade, pois—'\n\nÉ fascinante, com certeza, mas [composer.GetSheHe] não tem uma grande [ROOT.Char.Custom('CompositionType')] para concluir? Quanto a essa anedota em particular..."
 commission_epic.1002.scribes:0 "Alguns dos meus escribas estão contando a [powerful_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] sobre vários detalhes empolgantes que eles descobriram sobre meus antepassados. 'Agora, eu acredito que a parte com o [ROOT.Char.Custom('CompositionDetail')] pode realmente ser verdade, pois—'\n\nÉ fascinante, com certeza, mas eles não têm uma grande [ROOT.Char.Custom('CompositionType')] para concluir? Quanto a essa anedota em particular..."
 commission_epic.1002.t:0 "Epopeia Familiar: Material Fonte Rico"
 commission_epic.1003.a:0 "Muito bem, talvez uma pausa seja necessária."
 commission_epic.1003.b:0 "Prendam [ROOT.Char.Custom2('CommissionEpicComposerThem', composer)] à mesa de trabalho de [ROOT.Char.Custom2('CommissionEpicComposerTheir', composer)]!"
 commission_epic.1003.b_scribes:0 "Prendam [ROOT.Char.Custom('CommissionEpicComposerThem')] à mesa de trabalho de [ROOT.Char.Custom('CommissionEpicComposerTheir')]!"
 commission_epic.1003.composer:0 "[composer.GetTitledFirstName] foi peg[Select_CString( composer.IsFemale, 'a', 'o' )] tentando fugir de suas obrigações! Felizmente, um guarda a reconheceu quando passava pelos portões.\n\n\"É um trabalho exaustivo,\" [composer.GetSheHe] se defende. \"Dia e noite, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] benevolente [ROOT.Char.GetLadyLord]! Estou desesperada por alguns dias de descanso.\""
 commission_epic.1003.scribes:0 "Alguns dos meus escribas foram pegos tentando fugir de suas obrigações para com a minha epopeia familiar! Felizmente, um guarda os reconheceu quando passavam pelos portões.\n\n\"É um trabalho exaustivo,\" eles explicam. \"Dia e noite, [ROOT.Char.Custom('FormOfAddressForLiege')]! Estamos desesperados por alguns dias de descanso.\""
 commission_epic.1003.t:0 "Epopeia Familiar: Retiro do Escritor"
 commission_epic.1004.a:0 "Contrate o iluminador, custe o que custar!"
 commission_epic.1004.b:0 "[composer.GetTitledFirstNameNoTooltip] pode fazer isso [Select_CString( composer.IsFemale, 'ela mesma', 'ele mesmo' )]."
 commission_epic.1004.b_scribes:0 "Meus [ROOT.Char.Custom('CommissionEpicScribes')] podem fazer isso eles mesmos."
 commission_epic.1004.c:0 "Sempre me considerei um pouco artista..."
 commission_epic.1004.devotee_female:0 "[ROOT.Char.GetFaith.DevoteeFemale]"
 commission_epic.1004.devotee_male:0 "[ROOT.Char.GetFaith.DevoteeMale]"
 commission_epic.1004.ending:0 "renomado por suas ilustrações está hospedado em uma cidade em [barony.GetNameNoTier]. Com minha epopeia familiar progredindo, este pode ser o momento ideal para pensar em como as páginas devem ficar quando tudo estiver concluído."
 commission_epic.1004.failure:0 "Ilustrações ruins"
 commission_epic.1004.opening:0 "Chegou até mim a notícia de que um"
 commission_epic.1004.success:0 "Ilustrações excelentes"
 commission_epic.1004.t:0 "Epopeia Familiar: Iluminador Especialista"
 commission_epic.1005.a:0 "Deveria ter pedido isso desde o início!"
 commission_epic.1005.b:0 "Tenho certeza de que [ROOT.Char.Custom('CommissionEpicComposer')] pode criar algo igualmente bom."
 commission_epic.1005.b_composer:0 "Tenho certeza de que [ROOT.Char.Custom2('CommissionEpicComposer', composer)] pode criar algo igualmente bom."
 commission_epic.1005.classic:0 "Melodia Clássica Composta"
 commission_epic.1005.composer:0 "[composer.GetFirstName] tem"
 commission_epic.1005.ending:0 "me proporcionado em minha epopeia familiar, e enquanto começo a cantarolar, percebo que segue o mesmo ritmo de uma das músicas favoritas de meu povo!\n\nSe a história de meus antepassados fosse encaixada nessa melodia memorável, certamente nunca seria esquecida!"
 commission_epic.1005.enjoyable:0 "Melodia Agradável Composta"
 commission_epic.1005.opening:0 "Eu reflito sobre as últimas linhas"
 commission_epic.1005.scribes:0 "meus [ROOT.Char.Custom('CommissionEpicScribes')] têm"
 commission_epic.1005.t:0 "Epopeia Familiar: A Canção do Nosso Povo"
 commission_epic.1005.terrible:0 "Melodia Terrível Composta"
 commission_epic.1006.a:0 "Você sempre foi [Select_CString( vassal.IsFemale, 'minha amiga', 'meu amigo' )], [vassal.GetFirstNameNoTooltip]!"
 commission_epic.1006.b:0 "Sua lealdade deve ser garantida, não importa o quê."
 commission_epic.1006.desc:0 "Eu [ROOT.Char.Custom('CompositionTypeActionPast')] partes da sua nova epopeia familiar, e a verdadeira lealdade causada pela profunda amizade entre esses heróis lendários me inspira.\n\nSeria uma honra chamá-lo de meu amigo, enquanto sirvo lealmente."
 commission_epic.1006.opening:0 "[vassal.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 commission_epic.1007.a:0 "Como você se atreve a falar assim com o seu senhor feudal?!"
 commission_epic.1007.b:0 "Peço desculpas, sua família, é claro, será incluída!"
 commission_epic.1007.desc:0 "Eu [ROOT.Char.Custom('CompositionTypeActionPast')] partes da sua nova epopeia familiar, e estou abalado por como ela ignora as contribuições dos meus próprios antepassados!\n\nEsse desrespeito é a gota d'água. Está claro que você carrega nada além de má vontade para comigo e minha família!"
 commission_epic.1007.opening:0 "[vassal.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 commission_epic.2001.a:0 "Se é legitimamente meu, eu farei com que seja meu."
 commission_epic.2001.b:0 "[vassal.GetFirstNameNoTooltip] certamente gostaria de formalizar a concessão."
 commission_epic.2001.c.flavor:0 "Mas certifique-se de que o [vassal.GetTitleTierName] saiba."
 commission_epic.2001.c:0 "Podemos deixar isso passar."
 commission_epic.2001.desc:0 "\n\nParece que [county.GetName] nunca foi destinado a permanecer nas mãos da Casa [vassal.GetHouse.GetName]. Eu poderia fazer uma reivindicação legítima contra [Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstName]!"
 commission_epic.2001.desc_composer:0 "[steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vem até mim, animado com uma notícia. 'Eu [ROOT.Char.Custom('CompositionTypeActionPP')] a parte mais recente da sua epopeia familiar, e [ROOT.Char.Custom2('CommissionEpicComposer', composer)] [ROOT.Char.Custom2('CommissionEpicComposerHasHave', composer)] descoberto algo muito interessante!'"
 commission_epic.2001.desc_scribes:0 "[steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vem até mim, animado com uma notícia. 'Eu [ROOT.Char.Custom('CompositionTypeActionPP')] a parte mais recente da sua epopeia familiar, e [ROOT.Char.Custom('CommissionEpicComposer')] [ROOT.Char.Custom('CommissionEpicComposerHasHave')] descoberto algo muito interessante!'"
 commission_epic.2001.t:0 "Epopeia Familiar: Precedência"
 commission_epic.2002.a.tt:0 "Ao ser concluída, você receberá um livro da Epopeia Familiar como um [artifact|E] que melhora a [hostile_scheme_resistance|E]"
 commission_epic.2002.a:0 "O sangue dessa cobra corre em minhas veias!"
 commission_epic.2002.b:0 "Ou afirmamos que [grandparent.GetSheHe] era honrad[Select_CString( grandparent.IsFemale, 'a', 'o' )] e íntegr[Select_CString( grandparent.IsFemale, 'a', 'o' )]..."
 commission_epic.2002.desc:0 "[spymaster.Custom2('MyCharacterIntroduction', ROOT.Char)|U] parece ser a última pessoa a [ROOT.Char.Custom('CompositionTypeActionPast')] trechos da minha epopeia familiar.\n\n\"[Select_CString( grandparent.IsFemale, 'Sua tataravó', 'Seu tataravô' )] foi uma figura fascinante e engenhosa,\" [spymaster.GetSheHe] me diz. \"Se fizermos com que saibam que você é metade tão astut[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] quanto [grandparent.GetSheHe], as pessoas pensarão duas vezes antes de agir contra você.\""
 commission_epic.2002.t:0 "Epopeia Familiar: Orgulho da Família"
 commission_epic.2003.a:0 "Eu pertenço a uma longa linhagem de cumpridores de promessas."
 commission_epic.2003.a_same_dynasty:0 "Ambos sabemos que nossa dinastia cumpre suas promessas."
 commission_epic.2003.b:0 "Meus antepassados eram [ROOT.Char.Custom('GetPiousBelievers')], mas nem sempre sábios."
 commission_epic.2003.desc:0 "Parece que [Select_CString( court_chaplain.IsFemale, 'a', 'o' )] [court_chaplain.GetFirstName] tem [ROOT.Char.Custom('CompositionTypeActionPP')] partes da minha nova epopeia familiar. É claro que [court_chaplain.GetSheHe] descobriu \"discrepâncias\" entre as promessas feitas no passado e a nossa realidade atual.\n\nPosso ver que [court_chaplain.GetSheHe] não vai deixar isso de lado tão cedo. \"Certamente você pode ver o quão sábio e benevolente seria cumprir a promessa de seus antepassados, mesmo agora?\""
 commission_epic.2003.t:0 "Epopeia Familiar: Obrigações Eternas"
 commission_epic.2004.a.tt:0 "Ao ser concluída, você receberá um livro da Epopeia Familiar como um [artifact|E] que melhora a [advantage|E] em combate"
 commission_epic.2004.a:0 "Onde quer que a inspiração possa ser encontrada, devemos usá-la!"
 commission_epic.2004.b:0 "Explique-me detalhadamente..."
 commission_epic.2004.desc:0 "liberdades em minha epopeia familiar em relação à guerra e batalhas. Isso cria cenas dramáticas, mas me preocupo que m[Select_CString( marshal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))] tenha se ofendido enquanto [marshal.GetSheHe] franze a testa ao ler uma cena em particular.\n\nSinto quase um alívio quando [marshal.GetSheHe] finalmente compartilha seus pensamentos. \"É tudo bobagem, mas essa parte com o [ROOT.Char.Custom('CompositionDetail')] me deu algumas ideias..."
 commission_epic.2004.desc_composer:0 "[ROOT.Char.Custom2('CommissionEpicComposer', composer)] [ROOT.Char.Custom2('CommissionEpicComposerHasHave', composer )] tomado algumas..."
 commission_epic.2004.desc_scribes:0 "[ROOT.Char.Custom('CommissionEpicComposer')|U] [ROOT.Char.Custom('CommissionEpicComposerHasHave')] tomado algumas..."
 commission_epic.2004.t:0 "Epopeia Familiar: A Inspiração Chega"
 commission_epic.2005.a:0 "É importante contarmos uma boa história, afinal..."
 commission_epic.2005.b.tt:0 "Ao ser concluída, você receberá um livro da Epopeia Familiar como um [artifact|E] que melhora a [success_chance|E] em [personal_scheme|E]"
 commission_epic.2005.b:0 "Não, ela deve ser o mais fiel possível à realidade."
 commission_epic.2005.desc:0 "M[Select_CString( chancellor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chancellor'))], [chancellor.GetTitledFirstName], está [ROOT.Char.Custom('CompositionTypeActionPP')] minha epopeia familiar enquanto ela vai tomando forma.\n\n\"Grande parte dela não é muito plausível, como a parte com o [ROOT.Char.Custom('CompositionDetail')],\" [chancellor.GetSheHe] me diz. \"Por outro lado, quem pode dizer como o passado realmente foi? Se já estamos fazendo algumas exagerações, por que não levarmos isso o mais longe possível?\""
 commission_epic.2005.t:0 "Epopeia Familiar: Honestidade e Percepção"
 commission_epic.2006.a.tt:0 "Ao ser concluída, você receberá um livro da Epopeia Familiar como um [artifact|E] que aumenta [piety|E] e o mesmo imposto da [faith|E]"
 commission_epic.2006.a:0 "De fato, eu conheço isso muito bem."
 commission_epic.2006.b.flavor:0 "Sempre lideramos o caminho para os [ROOT.Char.GetFaith.AltPriestTermPlural]."
 commission_epic.2006.b:0 "Hah! É o contrário disso."
 commission_epic.2006.c.same_dynasty:0 "Essa opção está disponível porque [Select_CString( court_chaplain.IsFemale, 'a', 'o' )] [court_chaplain.GetFirstNameNoTooltip] pertence à mesma [dynasty|E] que eu"
 commission_epic.2006.c:0 "Ambos sabemos que a família vem em primeiro lugar em todas as coisas."
 commission_epic.2006.desc:0 "Não sei se devo ficar aliviad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ou desconcertad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com o entusiasmo [Select_CString( court_chaplain.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_chaplain'))], [court_chaplain.GetTitledFirstName], após [ROOT.Char.Custom('CompositionTypeActionPP')] as partes concluídas da minha epopeia familiar.\n\n\"Esta é uma narrativa maravilhosa com uma grande moral!\" [court_chaplain.GetSheHe] afirma. \"A dinastia [ROOT.Char.GetDynasty.GetBaseName] sempre alcançou a grandeza quando aconselhada pelos [ROOT.Char.GetFaith.AltPriestTermPlural] e enfrentou tempos sombrios quando falhou em ouvir esses conselhos! Espero que seja uma lição que você também levará em consideração.\""
 commission_epic.2006.t:0 "Epopeia Familiar: Ligados pela Fé"
 commission_epic.6001.a:0 "Exagere o que quiser, apenas termine isso!"
 commission_epic.6001.b:0 "Apenas pegue meu ouro e faça mais pesquisas."
 commission_epic.6001.scribes:0 "Meus escribas trabalharam dia e noite vasculhando antigos manuscritos, buscando encontrar reivindicações territoriais dos meus antepassados para exaltar na crônica.\n\n\"Infelizmente\", eles dizem, \"talvez tenhamos que fazer algumas pequenas #italic exagerações#! em relação... à verdade dessa questão, às proezas e domínios dos seus antepassados e assim por diante. Certamente, você entende isso, [Select_CString(ROOT.Char.IsFemale,'milady','sire')]?\""
 commission_epic.6001.t:0 "Algumas Pequenas Exagerações"
 commission_epic.6001.writerservant:0 "Depois de trabalhar em minha crônica por um tempo, [composer.GetName] me procura.\n\n\"[Select_CString(ROOT.Char.IsFemale,'Minha Senhora','Senhor')]\", [composer.GetSheHe] diz, \"Devo confessar que, embora sua dinastia seja grandiosa, as reivindicações ancestrais que você esperava encontrar podem não... ser tão fáceis de corroborar. Preciso de mais tempo e mais recursos para mergulhar mais fundo nos textos antigos. Caso contrário, terei que fazer algumas pequenas #italic exagerações#! nas histórias, e suas reivindicações podem acabar sendo menos convincentes..."
 commission_epic.6003.a:0 "Todas elas!"
 commission_epic.6003.b:0 "[neighboring_county_1.GetNameNoTierNoTooltip] parece bom nesta época do ano!"
 commission_epic.6003.c:0 "[neighboring_county_2.GetNameNoTierNoTooltip] é o que eu quero!"
 commission_epic.6003.d:0 "[neighboring_county_3.GetNameNoTierNoTooltip] deve ser meu."
 commission_epic.6003.scribes:0 "Meus escribas têm trabalhado arduamente em minha crônica cada vez mais complexa.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\", eles dizem, \"Encontramos uma anotação marginal em um antigo manuscrito, mencionando um[Select_CString( ancestor_1.IsFemale, 'a', '' )] [ancestor_1.GetWomanMan] chamad[Select_CString( ancestor_1.IsFemale, 'a', 'o' )] [ancestor_1.GetFirstNameNoTooltip] [Select_CString(ancestor_1.IsFemale,'a Generosa','o de Um Olho')], que teve alguma influência em [neighboring_county_1.GetNameNoTier], [neighboring_county_2.GetNameNoTier] e [neighboring_county_3.GetNameNoTier] nos tempos antigos. Poderíamos investigar tabelas genealógicas para #italic estabelecer de forma criativa#! que [ancestor_1.GetSheHe] foi um antepassado seu. Então, na crônica, poderíamos usá-la para corroborar o seu direito de governar algumas dessas terras - ou até mesmo todas elas..."
 commission_epic.6003.servant:0 "[composer.GetName] tem trabalhado diligentemente em minha crônica cada vez mais duvidosa.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\", [composer.GetSheHe] diz, \"Encontrei uma inscrição votiva desbotada d[Select_CString( ancestor_1.IsFemale, 'a', 'o' )] [ancestor_1.GetFirstNameNoTooltip], [Select_CString(ancestor_1.IsFemale,'a Caçadora','o Pequeno')], [Select_CString(ancestor_1.IsFemale,'rainha','rei')] de [neighboring_county_1.GetNameNoTier], [neighboring_county_2.GetNameNoTier] e [neighboring_county_3.GetNameNoTier] nos tempos antigos. Eu poderia fazer algumas adições criativas em sua árvore genealógica para estabelecer que [ancestor_1.GetSheHe] foi um antepassado seu. Então, na crônica, eu poderia fazer algumas pequenas exagerações e assim por diante, para firmar a sua reivindicação sobre algumas dessas terras - ou até mesmo todas elas.\""
 commission_epic.6003.t:0 "Reivindicações Geladas"
 commission_epic.6003.writer:0 "[composer.GetName] tem trabalhado diligentemente em minha crônica, que cresce cada vez mais grandiosa e questionável na mesma medida.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\", [composer.GetSheHe] diz, \"Encontrei um antigo texto desgastado onde se diz que um[Select_CString( ancestor_1.IsFemale, 'a', '' )] [Select_CString(ancestor_1.IsFemale,'rainha','rei')] chamad[Select_CString( ancestor_1.IsFemale, 'a', 'o' )] [ancestor_1.GetFirstNameNoTooltip] governou em [neighboring_county_1.GetNameNoTier], [neighboring_county_2.GetNameNoTier] e [neighboring_county_3.GetNameNoTier]. Eu poderia investigar tabelas genealógicas e fazer algumas, vamos chamar de #italic adições criativas#! para estabelecer que [ancestor_1.GetSheHe] foi um antepassado seu. Então, eu poderia usar a história [ancestor_1.GetHerHim] para lhe dar reivindicações mais ou menos confiáveis sobre algumas dessas terras, ou até mesmo todas elas...\""
 commission_epic.6004.a:0 "Por que não as duas?"
 commission_epic.6004.b:0 "[neighboring_county_1.GetNameNoTierNoTooltip] certamente faz parte da minha herança."
 commission_epic.6004.c:0 "Sempre senti que [neighboring_county_2.GetNameNoTierNoTooltip] deveria me pertencer!"
 commission_epic.6004.scribes:0 "Meus escribas têm trabalhado arduamente em minha crônica, que fica cada vez mais longa e ampla a cada dia que passa.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\", eles dizem, \"Encontramos uma carta real de origem muito antiga, concedendo o governo de [neighboring_county_1.GetNameNoTier] e [neighboring_county_2.GetNameNoTier] a [Select_CString( ancestor_1.IsFemale, 'uma', 'um' )] [ancestor_1.GetLadyLord] [Select_CString( ancestor_1.IsFemale, 'chamada', 'chamado' )] [ancestor_1.GetFirstNameNoTooltip] [Select_CString(ancestor_1.IsFemale,'a Boa','a Fortunada')]. Através da orientação de [ROOT.GetCharacter.GetFaith.HighGodName], pudemos rastrear sua linhagem até [ancestor_1.GetSheHe], e nos certificamos de fazer isso na crônica. Qualquer uma dessas terras seria legitimamente sua.\""
 commission_epic.6004.t:0 "Reivindicações Confiáveis"
 commission_epic.6004.writerservant:0 "[composer.GetName] tem trabalhado diligentemente em minha crônica, que cresce cada vez mais em escopo e volume.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\", [composer.GetSheHe] diz, \"Encontrei um antigo documento sobre impostos e direitos de terra, uma leitura bastante tediosa, mas mencionava [Select_CString( ancestor_1.IsFemale, 'uma', 'um' )] [ancestor_1.GetLadyLord] [Select_CString( ancestor_1.IsFemale, 'chamada', 'chamado' )] [ancestor_1.GetFirstNameNoTooltip] [Select_CString(ancestor_1.IsFemale,'a Alta','o Careca')], que governou [neighboring_county_1.GetNameNoTier] e [neighboring_county_2.GetNameNoTier] nos tempos antigos. Consegui rastrear a linhagem [ancestor_1.GetHerHim] até o final da antiguidade, até você! Posso, assim, lhe conceder reivindicações sobre qualquer uma dessas terras, tão confiáveis que ninguém poderá contestá-las.\""
 commission_epic.6005.a:0 "Para a masmorra com vocês!"
 commission_epic.6005.b:0 "Seus incompetentes..."
 commission_epic.6005.c:0 "Será que [ROOT.GetCharacter.GetFaith.HighGodName] está me punindo por minha vaidade?"
 commission_epic.6005.d:0 "Pelo menos consegui uma crônica..."
 commission_epic.6005.scribes:0 "Meus escribas parecem ter lutado com minha crônica e, de fato, eles agora me procuram com uma expressão preocupada.\n\n\"Infelizmente\", eles dizem, \"não conseguimos encontrar nenhuma história de reivindicações suficientemente boas para sustentar. Tentamos, mas estava além de nossa capacidade. No entanto, produzimos uma crônica que exalta as virtudes de sua dinastia. Por favor, esteja satisfeito com isso e não nos puna por nosso fracasso...\""
 commission_epic.6005.t:0 "Uma Épica Inacabada"
 commission_epic.6005.writerservant:0 "\"Há muito tempo suspeito que algo está errado com a minha crônica, e de fato, [composer.GetName] agora me procura com uma expressão preocupada.\n\n\"Infelizmente, [ROOT.Char.Custom('FormOfAddressForLiege')]\", [composer.GetSheHe] diz, \"por mais que eu tente, não consegui encontrar nenhuma reivindicação suficientemente boa para sustentar. Não posso continuar esse trabalho. No entanto, produzi uma crônica que exalta as virtudes da sua dinastia. Por favor, esteja satisfeito com isso e não me puna por meu fracasso...\""
 commission_epic.6006.a:0 "Perfeito!"
 commission_epic.6006.scribes:0 "Finalmente, meus escribas completaram a crônica de propaganda. Eles parecem aliviados ao me entregar um livro tremendamente grande.\n\n\"Aqui está, [Select_CString(ROOT.Char.IsFemale,'Milady','Sire')], a grande crônica da Casa [ROOT.Char.GetDynastyHouseNameNoTooltip], elaborando em detalhes todas as suas reivindicações. Que isso lhe traga grande fortuna.\""
 commission_epic.6006.t:0 "Propaganda Potente"
 commission_epic.6006.writerservant:0 "\"Está concluído, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord]\", [composer.GetName] diz com certo alívio, entregando-me um grande tomo.\n\n\"Esta é a crônica da Casa [ROOT.Char.GetDynastyHouseNameNoTooltip], descrevendo em grande detalhe sua história de governar as várias terras que você desejava. Certamente, ninguém pode mais contestar suas reivindicações justas!\""
 commission_epic.9001.a:0 "Que história incrível a história pode contar."
 commission_epic.9001.conclusion:0 "\n\nMeus ancestrais estão no cerne dessa história como um exemplo brilhante do que significa ser um governante em nosso tempo, mesmo que em alguns lugares seja arrastada e a parte com o [ROOT.Char.Custom('CompositionDetail')] seja absolutamente ridícula. Ainda assim, tenho orgulho de guardar isso em minha biblioteca familiar, para que as gerações futuras possam desfrutar e aprender com ela."
 commission_epic.9001.scribes:0 "A [ROOT.Char.Custom('CompositionType')] épica de minha família está finalmente completa, e meus [ROOT.Char.Custom('CommissionEpicScribes')] têm motivo para se orgulhar!"
 commission_epic.9001.servant:0 "Parece que fui sábi[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ao escolher [Select_CString( composer.IsFemale, 'a', 'o' )] [composer.GetTitledFirstName] para compor a [ROOT.Char.Custom('CompositionType')] épica de minha família. Apesar dos desafios enfrentados, o trabalho concluído é bastante impressionante."
 commission_epic.9001.t:0 "Uma Épica Familiar"
 commission_epic.9001.writer:0 "A [ROOT.Char.Custom('CompositionType')] épica de minha família está finalmente completa, e [Select_CString( composer.IsFemale, 'a', 'o' )] [composer.GetTitledFirstName] tem motivo para se orgulhar!"
 commission_epic.9002.a:0 "Esta pode ser a maior [ROOT.Char.Custom('CompositionType')] já escrita!"
 commission_epic.9002.conclusion:0 "\n\nTem alto drama, dilemas morais e duelos tensos. Tudo pelo que minha família foi forjada está lá! Mesmo a parte com o [ROOT.Char.Custom('CompositionDetail')], aparentemente tão improvável, tornou-se um momento emocionante que delineia o destino da minha Casa!"
 commission_epic.9002.scribes:0 "Meus [ROOT.Char.Custom('CommissionEpicScribes')] concluíram minha épica familiar, e que gloriosa [ROOT.Char.Custom('CompositionType')] eles compuseram!"
 commission_epic.9002.t:0 "Uma Épica Excelente"
 commission_epic.9002.writer:0 "[composer.GetTitledFirstName] completou minha épica familiar, e que gloriosa [ROOT.Char.Custom('CompositionType')] [composer.GetSheHe] compôs!"
 commission_epic.9101.a:0 "Suponho que seja um adeus."
 commission_epic.9101.b:0 "Ainda há muito aqui para você!"
 commission_epic.9101.c:0 "Também preciso de você. Aqui."
 commission_epic.9101.d.tt:0 "[composer.GetTitledFirstName] deixará sua corte"
 commission_epic.9101.d:0 "Enquanto você continuar escrevendo para mim!"
 commission_epic.9101.desc:0 "Depois de todo o tempo que [Select_CString( composer.IsFemale, 'a', 'o' )] [composer.GetTitledFirstName] passou em minha corte e o quão bem [composer.GetSheHe] me conheceu, parece estranho que [composer.GetSheHe] esteja prestes a partir.\n\n\"Tenho outros lugares para ir e outras histórias que precisam ser contadas\", [composer.GetSheHe] tenta explicar."
 commission_epic.9101.t:0 "Épica Familiar: Um Trabalho Concluído"
 commission_epic.9102.a.flavor:0 "Deixe [composer.GetSheHe] ver se [composer.GetSheHe] consegue se destacar."
 commission_epic.9102.a:0 "[composer.GetSheHe|U] deveria sair pelo mundo."
 commission_epic.9102.b:0 "Tenho certeza de que posso encontrar alguma utilidade para [composer.GetSheHe]."
 commission_epic.9102.c:0 "Por mais estranho que pareça, quero manter [composer.GetSheHe] por perto."
 commission_epic.9102.desc:0 "[composer.GetTitledFirstName] provou ser muito mais capaz do que eu esperaria de um simples serv[Select_CString( composer.IsFemale, 'a', 'o' )]. Se eu não soubesse melhor, poderia pensar que [composer.GetSheHe] era de uma linhagem de poetas!\n\nDepois de todo o tempo que passamos juntos, parece estranho que [composer.GetSheHe] deva voltar a cavar a terra, ou seja lá o que [composer.GetSheHe] costumava fazer."
 commission_epic.9102.t:0 "Épica Familiar: Servidão"
 commission_epic.9103.a:0 "Você continuará a me servir com honra."
 commission_epic.9103.desc:0 "Depois de todo o tempo que [Select_CString( composer.IsFemale, 'a', 'o' )] [composer.GetTitledFirstName] passou em minha corte e o quão bem [composer.GetSheHe] me conheceu, parece que [composer.GetSheHe] não vai muito longe.\n\n[composer.GetFirstNameNoTooltip] concorda. \"Tenho muitas histórias para contar ainda, e parece certo que eu deva continuar contando-as aqui.\""
 commission_epic.9104.a:0 "Pelo menos [composer.GetSheHe] não se foi para sempre!"
 commission_epic.9104.b.flavor:0 "[ROOT.Char.Custom('CompositionTypeActionPP')|U] a história, tenho que me perguntar. Será que [Select_CString( composer.IsFemale, 'a', 'o' )] [composer.GetFirstNameNoTooltip] sabia que era assim que terminaria?"
 commission_epic.9104.b:0 "Assim é a vida, às vezes."
 commission_epic.9104.desc:0 "Depois de todo o tempo que [Select_CString( composer.IsFemale, 'a', 'o' )] [composer.GetTitledFirstName] passou em minha corte e o quão bem [composer.GetSheHe] me conheceu, parece estranho que [composer.GetSheHe] não esteja aqui para ver a recepção do seu trabalho.\n\nPessoas instruídas e crianças estão [ROOT.Char.Custom('CompositionTypeActionPP')] isso, e até eu acho inspirador."
 commission_epic.9998.a:0 "Tenho certeza de que eles se sairão bem o suficiente."
 commission_epic.9998.ending:0 "é difícil para [composer.GetSheHe] continuar seu trabalho na épica de minha família.\n\nFelizmente, meus [ROOT.Char.Custom('CommissionEpicScribes')] estarão prontos para assumir a responsabilidade."
 commission_epic.9998.imprisoned:0 "Com [Select_CString( composer.IsFemale, 'a', 'o' )] [composer.GetTitledFirstName] pres[Select_CString( composer.IsFemale, 'a', 'o' )],"
 commission_epic.9998.imprisoned_by_me:0 "Com [Select_CString( composer.IsFemale, 'a', 'o' )] [composer.GetTitledFirstName] em meu calabouço,"
 commission_epic.9998.incapacitated:0 "Com [Select_CString( composer.IsFemale, 'a', 'o' )] [composer.GetTitledFirstName] em seu estado atual,"
 commission_epic.9998.left_court:0 "Com [Select_CString( composer.IsFemale, 'a', 'o' )] [composer.GetTitledFirstName] não mais em minha corte,"
 commission_epic.9998.t:0 "Épica Familiar: Um Incômodo"
 commission_epic.9998.tt:0 "O trabalho continua"
 commission_epic.9999.a:0 "O trabalho [composer.GetHerHim] será concluído."
 commission_epic.9999.died:0 "Com a morte d[Select_CString( composer.IsFemale, 'a', 'o' )] [composer.GetTitledFirstName], minha épica familiar permanece incompleta.\n\nSerá uma tarefa difícil, mas meus [ROOT.Char.Custom('CommissionEpicScribes')] terão que continuar os esforços."
 commission_epic.9999.murdered_by_me:0 "Considerando as medidas drásticas que tive que tomar em relação [Select_CString( composer.IsFemale, 'a', 'ao' )] [composer.GetTitledFirstName], parece que [composer.GetSheHe] nunca foi realmente adequado para compor a épica de minha família afinal.\n\nFelizmente, meus [ROOT.Char.Custom('CommissionEpicScribes')] são bastante capazes de fazer isso por conta própria."
 commission_epic.9999.t:0 "Épica Familiar: O Fim"
