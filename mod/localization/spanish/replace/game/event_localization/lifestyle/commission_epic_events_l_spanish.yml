 half_baked_propaganda_chronicle_desc:0 "Este livro poderia ter vivido na infâmia se tivesse sido concluído. Como está, ele não consegue convencer nenhum leitor sobre as reivindicações territoriais que seu patrono buscava, em vez disso, exalta poeticamente as supostas virtudes da dinastia [ROOT.Char.GetDynastyNameNoTooltip]."
 half_baked_propaganda_chronicle_name:0 "Crônica de Propaganda Inacabada"
 propaganda_chronicle_desc:0 "Este volume ponderoso elabora em detalhes dolorosos sobre a glória da Casa [ROOT.Char.GetDynastyHouseNameNoTooltip] e suas várias reivindicações territoriais, mais ou menos bizarras."
 propaganda_chronicle_name:0 "Crônica de Propaganda da Casa [ROOT.Char.GetDynastyHouseNameNoTooltip]"
