l_spanish:
 learn_commander_trait.0002.a:0 "Eu atacarei e nunca desistirei!"
 learn_commander_trait.0002.b:0 "Eu defendo minha posição."
 learn_commander_trait.0002.c:0 "Eu permaneço alerta, agindo conforme a situação requer."
 learn_commander_trait.0002.desc:0 "No calor do combate, a decisão é frequentemente o que separa a vitória da derrota.\n\nQuando chegar a hora, eu sei como agirei."
 learn_commander_trait.0002.t:0 "Um Equilíbrio Fino"
 learn_commander_trait.0003.a:0 "Meus exércitos devem estar sempre bem abastecidos."
 learn_commander_trait.0003.b:0 "Nenhum castelo impedirá meus esforços por muito tempo."
 learn_commander_trait.0003.c:0 "Atravesso rios com a certeza da maré alta."
 learn_commander_trait.0003.desc:0 "Uma guerra é determinada por suas batalhas, mas as batalhas são determinadas por seus preparativos.\n\nSer pego sem plano ou direção é uma boa maneira de perder."
 learn_commander_trait.0003.t:0 "Em Território Inimigo"
 learn_commander_trait.0004.b:0 "Eu estarei sempre pressionando o ataque!"
 learn_commander_trait.0004.c:0 "Hora de me rearmar com as armas que não estão cravadas em um corpo!"
 learn_commander_trait.0004.desc:0 "Eu já vi isso acontecer, aquele pequeno momento de calma no meio do combate. O breve instante em que nenhum lado avança na refrega, e a luta se parte como ondas contornando uma rocha."
 learn_commander_trait.0004.t:0 "A Maré da Batalha"
 learn_commander_trait.0005.a:0 "Minha fúria não será negada!"
 learn_commander_trait.0005.desc:0 "O estrondo de cem botas atingindo a água rasa, um ataque tão rápido quanto impiedoso, e os edifícios em chamas deixados para trás."
 learn_commander_trait.0005.t:0 "Como a Tempestade"
 learn_commander_trait.0006.a:0 "Não descansarei até ter devastado os inimigos do [ROOT.Char.GetFaith.PantheonTerm]!"
 learn_commander_trait.0006.desc:0 "Eu vi os [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] lutarem. Eu sei com que grande ferocidade eles abatem os fiéis.\n\nEm nome de [ROOT.Char.GetFaith.WarGodName], eu me colocarei contra eles com a coragem que [ROOT.Char.GetFaith.WarGodSheHe] me concede!"
 learn_commander_trait.0006.t:0 "A Lâmina de [ROOT.Char.GetFaith.WarGodName]"
 learn_commander_trait.0007.a:0 "O deserto é meu aliado."
 learn_commander_trait.0007.desc:0 "Meus inimigos não veem o quão abençoado é, a aspereza da areia e a sede de água.\n\nEles não entendem como minhas tropas podem suportar o calor, esperando pacientemente pelo combate enquanto seus inimigos coçam gargantas secas."
 learn_commander_trait.0007.t:0 "Sob o Sol Escaldante"
 learn_commander_trait.0008.a:0 "A floresta não é um lugar de perdão."
 learn_commander_trait.0008.desc:0 "Não pode haver batalhas fáceis na selva, e eu sei como tirar vantagem disso. Minhas tropas forçam o inimigo a seguir trilhas cheias de vegetação, eu os prendo em lama e arbustos, e espinhos podem causar tanto dano quanto minhas espadas e lanças.\n\nQuando a noite cai, os corpos desaparecem entre as folhas caídas."
 learn_commander_trait.0008.t:0 "Letal como a Mato"
 learn_commander_trait.0009.a:0 "Atacamos como granizo."
 learn_commander_trait.0009.desc:0 "O frio implacável já reivindicou muitas vidas. Mas não a minha, nem a dos meus soldados.\n\nNós sabemos onde procurar sob a neve, somos como lobos quando rastreamos nossos inimigos, e mordemos como o frio do meio do inverno no seu pior..."
 learn_commander_trait.0009.t:0 "Frio como a Noite"
 learn_commander_trait.01.t:0 "Um Suprimento de Conhecimento"
 learn_commander_trait.02.t:0 "Competência na Construção"
 learn_commander_trait.03.t:0 "Visão Devastadora"
 learn_commander_trait.04.t:0 "Escudo do Conhecimento"
 learn_commander_trait.05.t:0 "Fonte de Conhecimento"
 learn_commander_trait.06.t:0 "Uma Resposta para Todas as Situações"
 learn_commander_trait.07.t:0 "Sabedoria do Deserto"
 learn_commander_trait.08.t:0 "Mato do Conhecimento"
 learn_commander_trait.09.t:0 "Lições Gélidas"
 learn_commander_trait.10.t:0 "A Arte do Saque"
 learn_commander_trait.11.a:0 "Eu quero aprender."
 learn_commander_trait.11.b.tt:0 "#F Talvez em outro momento.#!"
 learn_commander_trait.11.b:0 "Vou deixar para os meus generais."
 learn_commander_trait.11.desc:0 "\n\n[teacher.GetFirstName] é conhecid[Select_CString( teacher.IsFemale, 'a', 'o' )] por seu domínio de [ROOT.Char.Custom('CommanderTraitSkillDescription')]. Se há alguém que pode me ajudar a entender, é [teacher.GetSheHe]."
 learn_commander_trait.11.martial_tt:0 "[teacher.GetFirstName] tentará ensinar a você a habilidade [THIS.Char.Custom('CommanderTraitBeingTaught')]\n$EFFECT_LIST_BULLET$Uma alta [martial_skill|E] será benéfica nesses esforços"
 learn_commander_trait.11.opening:0 "\"Entendo que você está interessado em aprofundar seu domínio da guerra?\" [teacher.GetTitledFirstName] [teacher.Custom('quirk_pos_present')] enquanto se aproxima de mim. \"Eu posso ser capaz de ajudar você a ver o campo de batalha de novas maneiras.\""
 learn_commander_trait.1101.desc:0 "\n\n[teacher.GetFirstName] é conhecid[Select_CString( teacher.IsFemale, 'a', 'o' )] por seu domínio em logística. Se há alguém que pode me ajudar a entender, é [teacher.GetSheHe]."
 learn_commander_trait.1102.desc:0 "\n\n[teacher.GetFirstName] é conhecid[Select_CString( teacher.IsFemale, 'a', 'o' )] por seu domínio em engenharia militar. Se há alguém que pode me ajudar a entender, é [teacher.GetSheHe]."
 learn_commander_trait.12.a:0 "Prepare as fileiras!"
 learn_commander_trait.12.b:0 "Não, eu ainda não entendi completamente o que [Select_CString( teacher.IsFemale, 'a', 'o' )] [teacher.GetFirstNameNoTooltip] tem tentado me ensinar."
 learn_commander_trait.12.desc:0 "[teacher.GetTitledFirstName] me mostrou todos os detalhes de [ROOT.Char.Custom('CommanderTraitSkillDescription')]. Meu teste final é uma batalha simulada contra [teacher.GetSheHe], para mostrar o que aprendi."
 learn_commander_trait.12.t:0 "A Mordida e o Rasgo"
 learn_commander_trait.1201.desc:0 "[teacher.GetTitledFirstName] me mostrou todos os detalhes de garantir que as provisões cheguem aos meus soldados no campo de batalha. Meu teste final é uma batalha simulada na qual devo proteger minha linha de abastecimento do ataque [teacher.GetHerHim]."
 learn_commander_trait.1202.desc:0 "[teacher.GetTitledFirstName] me mostrou todos os detalhes do cerco. Enquanto estamos em pé, observando uma miniatura de uma fortaleza, meu teste final é descrever como eu a capturaria da maneira mais eficiente."
 learn_commander_trait.1291.a:0 "É hora."
 learn_commander_trait.1291.b:0 "Sem [Select_CString( teacher.IsFemale, 'a', 'o' )] [teacher.GetFirstNameNoTooltip], posso simplesmente dizer que me saí bem."
 learn_commander_trait.1291.desc:0 "Embora [Select_CString( teacher.IsFemale, 'a', 'o' )] [teacher.GetTitledFirstName] não esteja me observando, ainda posso provar para mim mesmo que dominei [ROOT.Char.Custom('CommanderTraitSkillDescription')]. Um teste final, uma batalha simulada para testar minha habilidade."
 learn_commander_trait.13.a:0 "Aprendi muito."
 learn_commander_trait.13.desc:0 "[teacher.GetTitledFirstName] se aproxima de mim montad[Select_CString( teacher.IsFemale, 'a', 'o' )]. \"Impressionante!\" [teacher.GetSheHe] grita. As milícias \"inimigas\" ficam maravilhadas com a eficiência das minhas tropas.\n\nNão resta dúvida de que eu entendi o que significa ser [ROOT.Char.Custom('CommanderTraitBeingTaught')]."
 learn_commander_trait.13.t:0 "Lutar com Zelo"
 learn_commander_trait.1301.desc:0 "[teacher.GetTitledFirstName] se aproxima de mim montad[Select_CString( teacher.IsFemale, 'a', 'o' )]. \"Impressionante!\" [teacher.GetSheHe] grita. \"Minhas tropas nem sequer conseguiram se aproximar da linha de abastecimento.\""
 learn_commander_trait.1302.desc:0 "\"Ah, eu não tinha considerado isso,\" [teacher.GetTitledFirstName] [teacher.Custom('quirk_pos_present')]. [teacher.GetSheHe|U] não consegue encontrar uma única falha no meu plano!"
 learn_commander_trait.1391.a:0 "Agora é hora de levar isso para um campo de batalha real!"
 learn_commander_trait.1391.desc:0 "Eu teria te deixado orgulhos[Select_CString( teacher.IsFemale, 'a', 'o' )], [teacher.GetFirstName]!\n\nMinha batalha simulada foi um grande sucesso, e provei minha maestria."
 learn_commander_trait.14.a.tt:0 "\"Vou tentar mais uma vez...\""
 learn_commander_trait.14.a:0 "Mostre-me novamente como você faz."
 learn_commander_trait.14.b.tt:0 "\"Eu desisto! Pelo menos por enquanto.\""
 learn_commander_trait.14.b:0 "Isso é muito difícil!"
 learn_commander_trait.14.desc:0 "\"Talvez haja mais algumas coisas para você aprender...\" [teacher.GetTitledFirstName] estende a mão para me ajudar a levantar da lama.\n\nMinhas tropas não se saíram tão bem quanto o esperado. Devo admitir que [teacher.GetSheHe] pode estar certo."
 learn_commander_trait.14.t:0 "Entendendo os Saques"
 learn_commander_trait.1401.desc:0 "Tudo parecia ir tão bem, até eu perceber que a cavalaria era um truque!\n\n[teacher.GetTitledFirstName] segura uma maçã dos meus vagões quando me aproximo montado. \"Acho que vi onde você errou,\" [teacher.GetSheHe] oferece, [teacher.Custom('quirk_pos_pp')]."
 learn_commander_trait.1402.desc:0 "\"Você se esqueceu daquela torre?\" [teacher.GetTitledFirstName] aponta dos bastiões para a área em frente à parede que eu estava descrevendo. Agora vejo a falha fatal no meu plano."
 learn_commander_trait.1491.a:0 "Parece que ainda tenho algumas coisas para aprender..."
 learn_commander_trait.1491.desc:0 "Talvez seja melhor que [Select_CString( teacher.IsFemale, 'a', 'o' )] [teacher.GetTitledFirstName] não estivesse aqui para ver isso...\n\nTudo deu errado na minha batalha simulada, e nenhuma das minhas táticas funcionou!"
 learn_commander_trait.15.t:0 "Correndo por aquela colina"
 learn_commander_trait.16.t:0 "Familiarizado com a Floresta"
 learn_commander_trait.17.t:0 "Sendo Vigilante"
 learn_commander_trait.18.t:0 "Uma Lição de Logística"
 learn_commander_trait.91.t:0 "Por Conta Própria"
 learn_commander_trait.giving_up_tt:0 "#F Eu não preciso aprender isso!#!"
 learn_commander_trait_final_test_failure:0 "Derrota!"
 learn_commander_trait_final_test_failure_tt:0 "#F Eu ainda não aprendi o suficiente!#!"
 learn_commander_trait_final_test_success:0 "Vitória!"
 learn_commander_trait_final_test_success_tt:0 "#F Eu provei que aprendi!#!"
