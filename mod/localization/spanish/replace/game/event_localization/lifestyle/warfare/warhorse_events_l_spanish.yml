l_spanish:
 warhorse.0001.a:0 "Um nome inspirado na história!"
 warhorse.0001.b:0 "A mitologia está repleta de nomes de cavalos inspiradores!"
 warhorse.0001.c:0 "É apenas um cavalo, e deve ser chamado como tal."
 warhorse.0001.desc:0 "Admirando o [ROOT.Char.Custom('HorseStoryMareStallion')], que agora segue cada um dos meus comandos, reflito sobre que nome dar a ele..."
 warhorse.0001.t:0 "O Cavalo de Guerra"
 warhorse.0002.a:0 "Tencendur — como o cavalo do Rei Carlos Magno!"
 warhorse.0002.b:0 "Bucéfalo — assim como o cavalo de Alexandre, o Grande!"
 warhorse.0002.c:0 "Seianiano — o destino de Gneu Ségio certamente é exagerado!"
 warhorse.0002.d:0 "Zuljanah — em homenagem ao cavalo de Husayn ibn Ali!"
 warhorse.0002.desc:0 "Buscando inspiração nos famosos cavalos que outrora pertenceram a grandes líderes e heróis do passado, reflito sobre um nome para meu [ROOT.Char.Custom('HorseStoryMareStallion')]."
 warhorse.0002.e:0 "Red Hare — em referência ao cavalo do senhor da guerra Lü Bu!"
 warhorse.0002.f:0 "Veillantif — como o cavalo de Roland!"
 warhorse.0002.g:0 "Incitatus — o favorito do Imperador Calígula!"
 warhorse.0002.go_back:0 "Hmm, outro tema para o nome ficaria melhor..."
 warhorse.0003.aranjagaan:0 "Aranjagaan — montaria do grande guerreiro Jangar!"
 warhorse.0003.aranzhale:0 "Aranzhale, em homenagem a outro dos corcéis de Jangar."
 warhorse.0003.balius:0 "Balius — um dos próprios cavalos de Aquiles!"
 warhorse.0003.boreas:0 "Boreas — o antigo deus grego do vento norte!"
 warhorse.0003.buraq:0 "Burāq — em referência à criatura que carregava os profetas!"
 warhorse.0003.burko:0 "Burko — como um cavalo mágico das lendas!"
 warhorse.0003.dadhi_kra:0 "Dadhi-krā — o sol matutino!"
 warhorse.0003.desc:0 "O mundo mitológico é rico em grandiosidade e nomes para cavalos."
 warhorse.0003.devadatta:0 "Devadatta — mesmo que o próprio cavalo de Kalki!"
 warhorse.0003.haizum:0 "Haizum — o cavalo do arcanjo Gabriel!"
 warhorse.0003.jonon_khar:0 "Jonon Khar, um cavalo voador que chora como o violino de cabeça de cavalo."
 warhorse.0003.kanthaka:0 "Kanthaka — o fiel corcel de Gautama Buda!"
 warhorse.0003.keshi:0 "Keshi — em referência ao cavalo-demônio!"
 warhorse.0003.khiimori:0 "Khiimori, o Cavalo do Vento, símbolo da alma!"
 warhorse.0003.llamrei:0 "Llamrei — em referência ao cavalo do Rei Artur!"
 warhorse.0003.oyomaa:0 "Oyomaa, em homenagem à bela e escura fera de Mengen Shigshirge."
 warhorse.0003.rakhsh:0 "Rakhsh, do #EMP Shahnameh#!, com corpo de leão e força de elefante."
 warhorse.0003.rlung_rta:0 "Rlung Rta, portador de orações e boa sorte!"
 warhorse.0003.sleipnir:0 "Sleipnir — mesmo que o corcel que carregava Odin!"
 warhorse.0003.tulpar:0 "Tulpar — uma besta divina, alada e de velocidade incomparável."
 warhorse.0003.uchchaihshravas:0 "Uchchaihshravas — a montaria do Deus-Sol!"
 warhorse.0003.xanthos:0 "Xanthos — o nome do outro cavalo de Aquiles ficaria melhor!"
 warhorse.0004.a:0 "Cavaleiro"
 warhorse.0004.b:0 "Abade"
 warhorse.0004.c:0 "Saltitante"
 warhorse.0004.courser:0 "Corço."
 warhorse.0004.d:0 "Casco Reluzente"
 warhorse.0004.desc:0 "Um cavalo deve ser chamado como a criatura base que ele é."
 warhorse.1001.a:0 "[ROOT.Char.Custom('HorseStorySheHe')|U] precisa ser mais forte."
 warhorse.1001.b:0 "É preciso aprender a se mover mais rapidamente."
 warhorse.1001.c:0 "[ROOT.Char.Custom('HorseStorySheHe')|U] precisa trabalhar em sua resistência."
 warhorse.1001.d:0 "Se há algo que [ROOT.Char.Custom('HorseStorySheHe')] está faltando, é ferocidade!"
 warhorse.1001.desc:0 "Um treinador renomado se aproximou de mim após ouvir rumores sobre meu poderoso [ROOT.Char.Custom('HorseStoryMareStallion')] [ROOT.Char.Custom('WarhorseStoryName')], e oferece seus serviços.\n\n\"Tudo o que peço em troca é uma pequena compensação.\""
 warhorse.1001.e.tt:0 "#F \"[THIS.Char.Custom('WarhorseStoryName')] não precisa de outro treinador além de mim!\"#!"
 warhorse.1001.e:0 "Não estou interessado."
 warhorse.1001.f.failure.tt:0 "[m_horse.GetTitledFirstNameNoTooltip] falha ao treinar [ROOT.Char.Custom('WarhorseStoryName')]."
 warhorse.1001.f.failure:0 "Você superestimou seu $master_of_horse_court_position$"
 warhorse.1001.f.tt:0 "Seu $master_of_horse_court_position$ começa a treinar [THIS.Char.Custom('WarhorseStoryName')]"
 warhorse.1001.f:0 "É para isso que tenho um $master_of_horse_court_position$!"
 warhorse.1001.t:0 "[ROOT.Char.Custom('WarhorseStoryName')|U]: Leal [ROOT.Char.Custom('HorseStoryMareStallion')]"
 warhorse.1002.a:0 "Foi dinheiro bem gasto!"
 warhorse.1002.desc:0 "[ROOT.Char.Custom('WarhorseStoryName')] se adaptou bem ao treinamento, e os resultados puderam ser vistos instantaneamente!"
 warhorse.1101.a:0 "Devo aproveitar cada momento para praticar!"
 warhorse.1101.b:0 "O dia está bom demais para não ser apreciado devidamente!"
 warhorse.1101.desc:0 "Enquanto me aproximo dos postes de amarração, sou saudado pelos relinchos felizes de [ROOT.Char.Custom('WarhorseStoryName')]. [ROOT.Char.Custom('HorseStorySheHe')|U] parece ansioso para esticar as pernas de [ROOT.Char.Custom('HorseStoryHerHis')] no belo clima, e não posso fazer nada além de concordar."
 warhorse.1101.t:0 "[ROOT.Char.Custom('WarhorseStoryName')|U]: Dia Ensolarado"
 warhorse.1201.a:0 "Nenhum preço é alto demais para o meu amado [ROOT.Char.Custom('WarhorseStoryName')]!"
 warhorse.1201.b.tt:0 "[THIS.Char.Custom('HorseStorySheHe')|U] parece confiar menos em você, no entanto"
 warhorse.1201.b:0 "O que acontecer é a vontade de [ROOT.Char.GetFaith.HighGodName]."
 warhorse.1201.b_bad:0 "[ROOT.Char.Custom('WarhorseStoryName')] morre da doença"
 warhorse.1201.b_good:0 "[ROOT.Char.Custom('WarhorseStoryName')] se recupera"
 warhorse.1201.desc:0 "Enquanto [ROOT.Char.Custom('WarhorseStoryName')] se arrasta em minha direção, arrastando as suas pernas e abaixando a sua cabeça, não há dúvida — o [ROOT.Char.Custom('HorseStoryMareStallion')] está doente.\n\nO tratador me assegura que há uma cura para o que aflige [ROOT.Char.Custom('HorseStorySheHe')], mas ela vem a um preço elevado."
 warhorse.1201.t:0 "[ROOT.Char.Custom('WarhorseStoryName')|U]: O Cavalo Doente"
 warhorse.1301.a.tt:0 "[THIS.Char.Custom('WarhorseStoryName')] é uma montaria feroz, e [Select_CString( horse_vassal.IsFemale, 'a', 'o' )] [horse_vassal.GetFirstNameNoTooltip] não é conhecid[Select_CString( horse_vassal.IsFemale, 'a', 'o' )] por suas habilidades — el[Select_CString( horse_vassal.IsFemale, 'a', 'e' )] ficará bem?"
 warhorse.1301.a:0 "Divirta-se!"
 warhorse.1301.b:0 "Ninguém monta [ROOT.Char.Custom('WarhorseStoryName')] além de mim!"
 warhorse.1301.desc:0 "[horse_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] olha [ROOT.Char.Custom('WarhorseStoryName')] de cima a baixo, acenando aprovação.\n\n\"Você tem aqui um poderoso [ROOT.Char.Custom('HorseStoryMareStallion')], m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleTierName]! Se você me permitir dar uma volta com [ROOT.Char.Custom('HorseStoryHerHim')], ficarei muito grato.\""
 warhorse.1301.t:0 "[ROOT.Char.Custom('WarhorseStoryName')|U]: Entusiasta de Cavalos"
 warhorse.1401.a.tt:0 "#F Mas por que você ainda sente os olhos [THIS.Char.Custom('HorseStoryHerHim')]?#!"
 warhorse.1401.a:0 "Isso é ridículo - [ROOT.Char.Custom('HorseStorySheHe')] é apenas um cavalo."
 warhorse.1401.b:0 "[ROOT.Char.Custom('HorseStorySheHe')|U] está certamente amaldiçoado, livrem-se de [ROOT.Char.Custom('HorseStoryHerHim')]!"
 warhorse.1401.desc:0 "Conforme a escuridão cai, me encontro praticamente sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], o silêncio da noite quebrado apenas pelos coices do [ROOT.Char.Custom('HorseStoryMareStallion')] [ROOT.Char.Custom('WarhorseStoryName')]. Há algo estranho nos olhos de [ROOT.Char.Custom('HorseStoryHerHim')], algo... #EMP ameaçador#!.\n\nSeu olhar me segue quando me viro para ir embora, e o arrepio que percorre minha espinha perdura pela noite."
 warhorse.1401.t:0 "[ROOT.Char.Custom('WarhorseStoryName')|U]: Horror Equino"
 warhorse.1402.a:0 "Não serei vencid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por um cavalo!"
 warhorse.1402.b:0 "A história de [ROOT.Char.Custom('WarhorseStoryName')] termina aqui."
 warhorse.1402.desc:0 "Com os pés machucados pelos cascos, as mãos sangrando por causa dos dentes mordedores, o corpo ferido por ter sido jogado... [ROOT.Char.Custom('WarhorseStoryName')] relincha alegremente enquanto [ROOT.Char.Custom('HorseStorySheHe')] quase me lança contra a lança de um soldado, e eu não sei por quanto mais tempo conseguirei suportar isso."
 warhorse.1499.a:0 "[ROOT.Char.Custom('WarhorseStoryName')]... por quê?"
 warhorse.1499.desc:0 "Isso acontece quando estamos retornando de um curto passeio a cavalo — algo que temia desde que vi a malícia nos olhos do [ROOT.Char.Custom('HorseStoryMareStallion')] [ROOT.Char.Custom('WarhorseStoryName')] pela primeira vez. [ROOT.Char.Custom('HorseStorySheHe')|U] me lança justamente quando estamos passando por uma coleção de rochas pontiagudas, e eu caio de cabeça em uma delas. Perdid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] na dor cegante, só consigo ouvir relinchos altos antes que tudo acabe..."
 warhorse.8001.a:0 "Encontrarei uma [ROOT.Char.Custom('HorseStoryOppositeMareStallion')] forte."
 warhorse.8001.b:0 "Procure por uma [ROOT.Char.Custom('HorseStoryOppositeMareStallion')] ágil."
 warhorse.8001.c:0 "O aspecto mais importante em uma [ROOT.Char.Custom('HorseStoryOppositeMareStallion')] é a resistência."
 warhorse.8001.d:0 "Vasculhe as terras em busca da mais feroz [ROOT.Char.Custom('HorseStoryOppositeMareStallion')]!"
 warhorse.8001.desc:0 "Meu leal [ROOT.Char.Custom('HorseStoryMareStallion')] [ROOT.Char.Custom('WarhorseStoryName')] está ficando velho. Seu passo não é mais tão ágil como antes, e o fogo nos olhos de [ROOT.Char.Custom('HorseStoryHerHim')] está se apagando.\n\nSe eu quiser manter a linhagem de [ROOT.Char.Custom('HorseStoryHerHim')] viva, devo encontrar uma boa companheira para [ROOT.Char.Custom('HorseStoryHerHim')]."
 warhorse.8001.e:0 "Deixarei [ROOT.Char.Custom('HorseStoryHerHim')] passar seus últimos dias tranquilamente."
 warhorse.8001.t:0 "[ROOT.Char.Custom('WarhorseStoryName')|U]: O Fim de uma Vida"
 warhorse.8002.a:0 "Descanse em paz, [ROOT.Char.Custom('WarhorseStoryName')]."
 warhorse.8002.desc:0 "Meu amado [ROOT.Char.Custom('HorseStoryMareStallion')] [ROOT.Char.Custom('WarhorseStoryName')] faleceu, mas [ROOT.Char.Custom('HorseStorySheHe')] deixa para trás um potro forte! Já consigo ver a personalidade [ROOT.Char.Custom('HorseStoryHerHim')] no jovem — meu amigo ainda está comigo de certa forma."
 warhorse.8002.t:0 "[ROOT.Char.Custom('WarhorseStoryName')|U]: O Ciclo da Vida"
 warhorse.8003.a:0 "Oh, [ROOT.Char.Custom('WarhorseStoryName')], sentirei sua falta!"
 warhorse.8003.desc:0 "Ao sair para tomar um pouco de ar fresco, recebo a triste notícia de que meu querido [ROOT.Char.Custom('HorseStoryMareStallion')] [ROOT.Char.Custom('WarhorseStoryName')] morreu durante a noite, deixando apenas um vazio em meu coração."
