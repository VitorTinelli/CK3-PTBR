l_spanish:
 martial_authority.1031.a:0 "Eu pagarei suas bebidas se vocês forem embora imediatamente."
 martial_authority.1031.b:0 "Soldados, joguem-nos para fora!"
 martial_authority.1031.c:0 "Eles estão bêbados demais para serem uma ameaça real, isso vai acabar rápido."
 martial_authority.1031.desc:0 "A agitação de uma estalagem, um bom [ROOT.Char.Custom('RegionalAlcoholicDrink')], uma noite tranquila após um longo dia de treinamento... Meu copo é derrubado da minha mão por um mercenário cambaleante de um golpe, e toda esperança de relaxamento escorre para o chão junto com o meu licor.\n\n\"Por favor, [ROOT.Char.Custom('FormOfAddressForLiege')].\" Implora o estalajadeiro, \"os capangas d[Select_CString( scoped_mercenary.IsFemale, 'a', 'o' )] [scoped_mercenary.GetFirstName] têm bebido tudo sem pagar há dias! E suas brigas estão assustando os funcionários e os hóspedes!\""
 martial_authority.1031.t:0 "Misericórdia para os Mercenários"
 martial_authority.2040.a.failure.tt:0 "A briga se intensifica quando os espectadores se juntam!"
 martial_authority.2040.a.failure:0 "Minhas palavras não têm impacto na discussão"
 martial_authority.2040.a.success:0 "Minhas palavras afastam todos da briga"
 martial_authority.2040.a:0 "Faça um discurso sobre união para a multidão."
 martial_authority.2040.b:0 "Mande chicoteá-los por sua delinquência!"
 martial_authority.2040.c.drunkard:0 "Dane-se isso, vou para minha tenda e beber..."
 martial_authority.2040.c.hashishiyah:0 "Dane-se isso, vou usar um pouco de haxixe."
 martial_authority.2040.c:0 "Dane-se isso, vou para minha tenda e tampar os ouvidos..."
 martial_authority.2040.desc:0 "Depois que meu exército monta acampamento, ouço um tumulto vindo das acomodações dos meus $knight_culture_player_plural_possessive_no_tooltip_lowercase$.\n\nInvestigando a perturbação, encontro [Select_CString( first.IsFemale, 'a', 'o' )] [first.GetTitledFirstName] e [Select_CString( second.IsFemale, 'a', 'o' )] [second.GetTitledFirstName] no meio de uma discussão acalorada enquanto vários espectadores os instigam."
 martial_authority.2040.t:0 "Disputa no Acampamento"
 martial_authority.2041.a:0 "Somos mais fortes quando estamos juntos."
 martial_authority.2041.desc:0 "Eu me levanto e faço um discurso sobre como todos estamos lutando pelo [ROOT.Char.GetPrimaryTitle.GetName] e como devemos permanecer unidos contra nossos inimigos, pois se não o fizermos, há muitos estrangeiros que aproveitariam nossas disputas internas para tomar nossas terras e impor suas regras sobre nós.\n\nVisivelmente constrangidos, [first.GetTitledFirstName] e [Select_CString( second.IsFemale, 'a', 'o' )] [second.GetTitledFirstName] se desculpam e se preparam para descansar durante a noite."
 martial_authority.2041.t:0 "Resolução"
 martial_authority.2042.a.failure:0 "Eu me machuco na briga violenta"
 martial_authority.2042.a.success:0 "Eu saio como o único vencedor da briga"
 martial_authority.2042.a:0 "Bem, já que é assim, vou entrar na briga também!"
 martial_authority.2042.b:0 "Que bagunça..."
 martial_authority.2042.desc:0 "Meus apelos para que todos deixem de lado suas diferenças caem em ouvidos moucos quando a discussão se transforma em uma briga generalizada.\n\nBebidas e comidas voam pelos ares enquanto as pessoas começam a arremessar tudo o que estiver ao alcance das mãos.."
 martial_authority.2042.t:0 "Briga"
 martial_authority.2050.a.tt:0 "Vocês passarão mais tempo juntos"
 martial_authority.2050.a:0 "Sim, [right_hand_person.GetSheHe] servirá bem!"
 martial_authority.2050.b:0 "[Select_CString( marshal.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('marshal'))] [marshal.GetFirstNameNoTooltip] pode lidar com esses problemas."
 martial_authority.2050.c:0 "Eu consigo lidar com tudo sozinho se trabalhar mais!"
 martial_authority.2050.desc.courtier:0 "na [ROOT.Char.Custom('GetCourt')|l]."
 martial_authority.2050.desc.ending:0 "Será que [right_hand_person.GetSheHe] poderia servir como meu braço direito e assumir um papel mais ativo na administração do meu [ROOT.Char.Custom('GetRealmOrDomicile')|l]?"
 martial_authority.2050.desc.knight:0 "enquanto viaja pelo campo."
 martial_authority.2050.desc.opening:0 "Por mais autoridade que eu supostamente exerça como [ROOT.Char.GetTitleAsNameNoTooltip], não posso estar em todos os lugares do meu [ROOT.Char.Custom('GetRealmOrDomicile')|l] ao mesmo tempo. Sempre haverá aqueles que \"esquecem\" de obedecer às minhas ordens quando minha atenção é voltada para outro lugar.\n\nÉ aí que [right_hand_person.Custom2('MyCharacterIntroduction', ROOT.Char)] pode entrar, que tem cumprido fielmente meus decretos"
 martial_authority.2050.desc.vassal:0 "em seu próprio domínio."
 martial_authority.2050.t:0 "Uma Mão Extra"
 martial_authority.2050.toast.title:0 "[right_hand_person.GetShortUIName] está agora servindo como seu braço direito"
 martial_authority.2051.a:0 "Vamos nos tornar bons amigos!"
 martial_authority.2051.b:0 "Será que isso é o início de algo mais?"
 martial_authority.2051.c:0 "Devemos manter esse relacionamento profissional."
 martial_authority.2051.desc:0 "No decorrer de me ajudar a administrar meu [ROOT.Char.Custom('GetRealmOrDomicile')] como minha meu braço direito, [right_hand_person.GetTitledFirstName] e eu descobrimos que temos muito em comum!\n\nNós construímos uma forte relação durante nosso tempo trabalhando juntos como resultado disso, e me pego pensando no que o futuro nos reserva..."
 martial_authority.2051.t:0 "Uma Mão Extra"
 martial_authority.2052.message:0 "Eu Prendi Meu Braço Direito"
 martial_authority.2053.toast:0 "Meu Braço Direito foi aprisionad[Select_CString( right_hand_person.IsFemale, 'a', 'o' )] por [imprisoner.Custom2('MyCharacterIntroduction', ROOT.Char)], e não pode me servir a menos que seja libertada."
 martial_authority.2054.toast.no_return:0 "M[Select_CString( right_hand_person.IsFemale, 'inha', 'eu' )] [right_hand_person.GetWomanMan] de confiança não retorna ao meu serviço"
 martial_authority.2054.toast:0 "M[Select_CString( right_hand_person.IsFemale, 'inha', 'eu' )] [right_hand_person.GetWomanMan] de confiança retorna ao meu serviço"
 martial_authority.2055.message.incapable:0 "Meu Braço Direito Se Tornou Incapaz"
 martial_authority.2055.message:0 "Meu Braço Direito Deixou Meu Serviço"
 martial_authority.2056.message.death:0 "Eu Matei Meu Braço Direito"
 martial_authority.2056.message:0 "Meu Braço Direito Morreu"
 martial_authority_special.1100.a.failure.tt:0 "O oficial te derrota em combate desarmado"
 martial_authority_special.1100.a.success.tt:0 "Você derrota o oficial em combate desarmado"
 martial_authority_special.1100.a:0 "Intervir e proteger o soldado."
 martial_authority_special.1100.archer.desc:0 "Um arqueiro"
 martial_authority_special.1100.b.failure.tt:0 "[officer.GetShortUINameNoTooltip] te repreende de forma impressionante"
 martial_authority_special.1100.b.success.tt:0 "Você convence [officer.GetShortUINameNoTooltip]"
 martial_authority_special.1100.b:0 "Mediar entre [Select_CString( officer.IsFemale, 'a', 'o' )] [officer.GetFirstNameNoTooltip] e o soldado."
 martial_authority_special.1100.c:0 "Dar um exemplo com eles."
 martial_authority_special.1100.cavalry.desc:0 "Um soldado de cavalaria"
 martial_authority_special.1100.d:0 "Sair sorrateiramente e assumir o crédito pela ideia do soldado."
 martial_authority_special.1100.end.desc:0 "está tentando convencer seu comandante, [officer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], sobre as vantagens de uma estratégia alternativa. [officer.GetFirstNameNoTooltip] não quer ouvir nada disso — quando me aproximo, [Select_CString( officer.IsFemale, 'a', 'o' )] [officer.GetWomanMan] furios[Select_CString( officer.IsFemale, 'a', 'o' )] levanta seu punho..."
 martial_authority_special.1100.heavy_infantry.desc:0 "Um soldado de infantaria"
 martial_authority_special.1100.pikemen.desc:0 "Um soldado de pique"
 martial_authority_special.1100.skirmisher.desc:0 "Um arqueiro de emboscada"
 martial_authority_special.1100.start.desc:0 "Esta noite, eu me despojei de todos os símbolos que denotam minha patente para caminhar anonimamente entre meus soldados. É uma noite tranquila, então, quando a discussão começa, as palavras chegam até mim altas e claras.\n\n"
 martial_authority_special.1100.t:0 "Incógnito"
 martial_authority_special.1101.a:0 "Adotar a estratégia d[Select_CString( soldier_friend.IsFemale, 'a', 'o' )] [soldier_friend.GetFirstNameNoTooltip]."
 martial_authority_special.1101.b:0 "Discutir a estratégia para aprender mais sobre guerra."
 martial_authority_special.1101.desc:0 "Meu treinamento tem me servido bem. Poucos momentos depois, tenho [Select_CString( officer.IsFemale, 'a', 'o' )] [officer.GetTitledFirstName] em um chave de braço firme. 'Que isso seja uma lição', declaro em voz alta, para que todos ouçam. 'Seu [ROOT.Char.GetTitleTierName] não olha com bons olhos para tolos de mente fechada. Não importa o posto deles.'"
 martial_authority_special.1101.end.desc:0 "\n\nO soldado sorri com gratidão. 'Obrigado, [ROOT.Char.Custom('FormOfAddressForLiege')]. Você nunca terá um servo mais fiel do que [Select_CString( soldier_friend.IsFemale, 'a', 'o' )] [soldier_friend.GetFullNameNoTooltip].'"
 martial_authority_special.1102.a:0 "Pelo menos aprendi um truque ou dois."
 martial_authority_special.1102.desc:0 "Conhecendo as consequências de ferir um comandante, o soldado não faz nada para defender [soldier_friend.GetHerselfHimself] dos golpes vindos. Enquanto o sangue é derramado, me coloco entre eles.\n\nTalvez eu devesse ter pensado melhor antes de brigar com um guerreiro experiente. No final, preciso revelar minha identidade para que [Select_CString( officer.IsFemale, 'a', 'o' )] [officer.GetTitledFirstName] me deixe ir. Volto sorrateiramente para minha tenda antes que a notícia se espalhe..."
 martial_authority_special.1103.desc:0 "O braço d[Select_CString( officer.IsFemale, 'a', 'o' )] [officer.GetTitledFirstName] congela no meio do golpe quando levanto minha voz. A intensidade emocional das minhas palavras parece afetá-lo – sua expressão suaviza para constrangimento. [officer.GetSheHe|U] gagueja um pedido de desculpas e se afasta."
 martial_authority_special.1501.a.failure:0 "A ilusão de [deserting_soldier.GetFirstName] se espalha"
 martial_authority_special.1501.a.success:0 "[deserting_soldier.GetFirstName] se acalma"
 martial_authority_special.1501.a:0 "\"Eu também, mas precisamos suportar.\""
 martial_authority_special.1501.a_tt:0 "Você conta a [deserting_soldier.GetFirstNameNoTooltip] sobre suas experiências semelhantes e como elas fazem você se sentir"
 martial_authority_special.1501.b:0 "Isso nunca mais acontecerá com você."
 martial_authority_special.1501.c:0 "\"Recupere-se agora!\""
 martial_authority_special.1501.desc:0 "Estou patrulhando [ravaged_place.GetName], tentando avaliar os danos recentes ao condado. [deserting_soldier.GetTitledFirstName] me para antes que eu vá mais longe:\n\n\"Eu me lembro exatamente deste lugar."
 martial_authority_special.1501.desc_battle:0 "Foi devastado durante uma de nossas batalhas recentes!"
 martial_authority_special.1501.desc_outro:0 "Eu vi os horrores, os gritos, o sangue... o fogo.\" O rosto [deserting_soldier.GetHerHim] empalidece, \"E-eu não posso mais ficar aqui. Eu não vou!"
 martial_authority_special.1501.desc_raid:0 "Foi saqueado e pilhado!"
 martial_authority_special.1501.t:0 "O Desertor"
 martial_authority_special.3000.a:0 "Vamos discutir métodos de comunicação."
 martial_authority_special.3000.b:0 "Deveríamos cumprimentar alguns recrutas!"
 martial_authority_special.3000.desc:0 "[martial_authority_friend.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] tem estado por perto das minhas reuniões do conselho ultimamente. Sabendo do seu interesse em assuntos de liderança, não consigo deixar de sentir que [Select_CString( martial_authority_friend.IsFemale, 'a', 'o' )] [martial_authority_friend.GetWomanMan] está esperando que eu impressione [martial_authority_friend.GetSheHe].\n\nProvavelmente, posso envolver [martial_authority_friend.GetSheHe] em uma conversa. Por outro lado, pode ser melhor para [martial_authority_friend.GetSheHe] simplesmente me ver interagindo com meus [ROOT.Char.Custom('WomenMenPeople_GenderPreference')] — há algo a ser dito sobre pelo menos #EMP fingir#! conhecer o rosto de cada soldado."
 martial_authority_special.3000.t:0 "Uma Demonstração de Liderança"
 respected_figurehead:0 "Líder Respeitado"
