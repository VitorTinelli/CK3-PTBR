l_spanish:
 martial_strategy.4000.a:0 "Salgar ou defumar, contanto que armazenemos."
 martial_strategy.4000.b:0 "Meus convidados e eu iremos nos banquetear!"
 martial_strategy.4000.c:0 "Até os servos comerão como s[Select_CString( ROOT.Char.IsFemale, 'ua', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip]!"
 martial_strategy.4000.d:0 "Sim, eles #EMP parecem#! bem gordinhos..."
 martial_strategy.4000.desc:0 "Com um belo arroto, empurro o restante do meu prato para longe e me esparramo na cadeira. Ultimamente, minhas cozinhas têm transbordado de grãos dourados e caças frescas, conferindo a todos os meus cortesãos o brilho saudável dos superalimentados.\n\nFaço uma careta. Embora essa abundância seja ótima, ela não pode durar para sempre. Preciso decidir o que fazer com todo esse excesso de comida."
 martial_strategy.4000.t:0 "Abastecendo os Depósitos"
 martial_strategy.4010.a:0 "Tenho o dever de cuidar dos meus súditos."
 martial_strategy.4010.b.tt_botch:0 "Você estraga completamente a reconstrução"
 martial_strategy.4010.b.tt_crit_success:0 "Você melhora habilmente os muros de [crumbling_holding.GetNameNoTierNoTooltip]"
 martial_strategy.4010.b.tt_success:0 "Você reconstrói com sucesso os muros de [crumbling_holding.GetNameNoTierNoTooltip]"
 martial_strategy.4010.b:0 "Eu vou supervisionar a reconstrução pessoalmente."
 martial_strategy.4010.c:0 "#EMP Eu#! decido como #EMP meu#! dinheiro é gasto, e [crumbling_holding.GetNameNoTierNoTooltip] não é prioridade!"
 martial_strategy.4010.d.tt_botch:0 "Seu $royal_architect_court_position$ estraga completamente a reconstrução"
 martial_strategy.4010.d.tt_crit_success:0 "Seu $royal_architect_court_position$ melhora habilmente os muros de [crumbling_holding.GetNameNoTierNoTooltip]"
 martial_strategy.4010.d.tt_success:0 "Seu $royal_architect_court_position$ reconstrói com sucesso os muros de [crumbling_holding.GetNameNoTierNoTooltip]"
 martial_strategy.4010.d:0 "Meu $royal_architect_court_position$ irá supervisionar a reconstrução."
 martial_strategy.4010.desc:0 "A delegação de [crumbling_holding.GetNameNoTierNoTooltip] lentamente deixa meus aposentos privados, nossa longa reunião enfim encerrada. Os peticionários imploram por dinheiro para reparar as muralhas decadentes do domínio, invocando meu dever senhorial para ajudá-los com o que não conseguiram levantar por conta própria. Tamborilo meus dedos sobre a mesa, ponderando se devo ajudá-los com os fundos restantes. Boas fortificações são terrivelmente caras.\n\nÉ claro, se as muralhas já estão ruindo mesmo, eu sempre poderia desviar o orçamento destinado a elas para assuntos mais... pessoais..."
 martial_strategy.4010.t:0 "Os Muros de [crumbling_holding.GetNameNoTierNoTooltip]"
 martial_strategy.7000.a:0 "Ha! Boa piada, [worried_knight.GetTitledFirstNameNoTooltip]!"
 martial_strategy.7000.b:0 "Tolo! É o jeito [ROOT.Char.GetCulture.GetNameNoTooltip] de atacar em linha reta!"
 martial_strategy.7000.c:0 "Tolo! Você já tentou guiar um elefante de guerra?"
 martial_strategy.7000.d:0 "Tolo! Não há estratagema melhor conhecido pelo homem."
 martial_strategy.7000.desc_armored_horse:0 "cavalo com armadura"
 martial_strategy.7000.desc_cavalry:0 "cavalaria pesada"
 martial_strategy.7000.desc_cont:0 "é atacá-los diretamente em linha reta. Não é hora de tentarmos outra abordagem?\""
 martial_strategy.7000.desc_elephantry:0 "elefantria"
 martial_strategy.7000.desc_middle:0 " [worried_knight.GetTitledFirstName] se aproxima de mim enquanto estou montado no meu cavalo. [worried_knight.GetSheHe|U] evita meu olhar e encara o chão. Após muita hesitação, [worried_knight.GetSheHe] fala: \n\n\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetLadyLord|U], tudo o que fazemos com nossa"
 martial_strategy.7000.desc_opening:0 "Enquanto estou no meio do treinamento da minha"
 martial_strategy.7000.desc_war_elephant:0 "elefantaria de guerra"
 martial_strategy.7000.e:0 "Talvez você tenha um ponto..."
 martial_strategy.7000.f:0 "Se pisoteá-lo, você verá como é eficiente."
 martial_strategy.7000.t:0 "Táticas?"
