l_spanish:
 authority_central_control_modifier:0 "Supervisão Feudal Abrangente"
 martial_authority.4000.a.tt:0 "Você investiga maneiras de transformar essa ferramenta em uma arma."
 martial_authority.4000.a:0 "Eu me pergunto se isso pode ser reaproveitado?"
 martial_authority.4000.b.tt:0 "Você procura outras maneiras de aprimorar suas habilidades marciais."
 martial_authority.4000.b:0 "Isso já basta."
 martial_authority.4000.desc:0 "Olhando através da obscuridade empoeirada da armaria, meu olhar percorre várias armas diferentes de guerra. Uma par de grevas de couro surradas, uma espada afiada recentemente, uma lança com um cabo desgastado, uma... #EMP ferramenta agrícola enferrujada?#!\n\nEu pego a ferramenta agrícola; talvez ela tenha sido incluída inadvertidamente com as armas? Eu levanto a ferramenta, examinando sua lâmina curvada e curiosa, parecida com uma foice, enquanto dou um golpe experimental em uma camisa de malha próxima.\n\nA lâmina perfura a cota de malha, espalhando alguns anéis de ferro pelo chão.\n\n#EMP Interessante.#!"
 martial_authority.4000.t:0 "Uma Ferramenta Enferrujada"
 martial_authority.4001.a.tt:0 "Você tenta transformar a ferramenta em uma arma de estocada curta."
 martial_authority.4001.a:0 "Se você endireitasse a lâmina, ela poderia ser uma adaga útil..."
 martial_authority.4001.b.failure:0 "Você quebrou a ferramenta!"
 martial_authority.4001.b.tt:0 "Você volta para dentro, procurando por um pedaço de corda..."
 martial_authority.4001.b:0 "Talvez se a fixarmos na ponta de uma lança?"
 martial_authority.4001.c.tt:0 "Talvez isso possa ser uma arma eficaz sem modificações?"
 martial_authority.4001.c:0 "Por que não deixamos como está?"
 martial_authority.4001.desc:0 "Levando a pequena lâmina para fora sob o sol do meio-dia, eu a inspeciono mais de perto. A lâmina afina para um ponto em uma extremidade e desaparece no cabo na outra, deixando um trecho de ferro ligeiramente enferrujado — mas ainda afiado — no meio.\n\nA curvatura na cabeça da lâmina dá à ferramenta uma curva maligna. Útil para cortar arbustos, você pensaria. Ou talvez encontrar lacunas na armadura?\n\nEstá claro que isso pode ser reaproveitado como uma arma de guerra, mas a pergunta permanece sobre em qual forma essa arma se apresentaria..."
 martial_authority.4001.t:0 "Uma Ferramenta Enferrujada: Escolhas, Escolhas..."
 martial_authority.4002.a:0 "Está perfeito!"
 martial_authority.4002.b:0 "Está até melhor que a minha!"
 martial_authority.4002.desc:0 "Como [Select_CString( ROOT.Char.IsFemale, 'uma', 'um' )] [ROOT.Char.GetLadyLord|U], eu não estou exatamente familiarizada com o processo de modificar uma arma de guerra. Apesar do meu entusiasmo, rapidamente ficou claro que eu precisaria de orientação especializada.\n\nEu chamo [Select_CString( blacksmith.IsFemale, 'a', 'o' )] ferreir[Select_CString( blacksmith.IsFemale, 'a', 'o' )] da propriedade, [blacksmith.GetFirstName], que parece um pouco sobrecarregad[Select_CString( blacksmith.IsFemale, 'a', 'o' )], e depois de um dia ou mais limando e afiando, meu trabalho está completo.\n\nA lâmina, que antes era curva, foi endireitada, com sua lâmina encurtada levando a um ponto afilado, com uma ranhura biselada descendo pelo achatado da lâmina. Não é uma arma bonita: mas é uma arma mesmo assim."
 martial_authority.4002.t:0 "Uma Ferramenta Enferrujada: A Lâmina Improvisada"
 martial_authority.4003.a:0 "Vamos ver sua armadura sofisticada resistir a isso!"
 martial_authority.4003.b:0 "Está até melhor que a minha!"
 martial_authority.4003.desc:0 "Segurando a lança que eu tinha visto antes entre minha perna e uma mesa, eu dou uma volta com um barbante áspero ao redor da ferramenta agrícola e da ponta da lança, amarrando-as juntas. A cabeça balança alarmantemente no início, mas a aplicação no dia seguinte de algumas tiras de couro fervido — cortesia d[Select_CString( blacksmith.IsFemale, 'a', 'o' )] curtidor[Select_CString( blacksmith.IsFemale, 'a', '' )] da propriedade, [blacksmith.GetFirstName] — finaliza a modificação.\n\nA arma que eu criei certamente tem o visual adequado. O tamanho da lança proporciona alcance e impulso, enquanto a lâmina curva da ferramenta agrícola poderia facilmente derrubar um homem de um cavalo ou se infiltrar nas juntas da armadura.\n\nÉ uma arma rude e pronta para uso, mas tenho a sensação de que ela pode ser #EMP bastante#! eficaz..."
 martial_authority.4003.t:0 "Uma Ferramenta Enferrujada: A Alabarda Improvisada"
 martial_authority.4004.a:0 "Quais outros segredos nossos humildes fazendeiros têm?"
 martial_authority.4004.b:0 "Eu gosto disso; distribua-os pelo reino!"
 martial_authority.4004.desc:0 "A ferramenta — que [Select_CString( blacksmith.IsFemale, 'a', 'o' )] ferreir[Select_CString( blacksmith.IsFemale, 'a', 'o' )] da propriedade, [blacksmith.GetFirstName] me explicou ser chamada de 'billhook', enquanto eu supervisionava [blacksmith.GetSheHe] afiá-la entusiasmad[Select_CString( blacksmith.IsFemale, 'a', 'o' )] — certamente tem o visual adequado como uma arma de guerra.\n\nA lâmina emerge do cabo com uma borda viciosa, subindo e passando pela cabeça curva e pesada. A ponta recém-afiada brilha sob o sol do meio-dia enquanto eu a encaixo na costura de uma armadura de couro fervido inútil antes de puxá-la de volta em minha direção, cortando as alças da propriedade em um único golpe."
 martial_authority.4004.t:0 "Uma Ferramenta Enferrujada: Perfeita do Jeito Que Está"
 martial_authority.5000.a.characters_baron_final_list:0 "[baron_1.GetShortUIName|U], [baron_2.GetShortUIName], e [baron_3.GetShortUIName]"
 martial_authority.5000.a.land_baron_final_list:0 "[baron_1_lands.GetNameNoTier], [baron_2_lands.GetNameNoTier], e [baron_3_lands.GetNameNoTier]"
 martial_authority.5000.a:0 "[Select_CString( ROOT.Char.IsFemale, 'Uma boa', 'Um bom' )] [ROOT.Char.GetTitleAsNameNoTooltip] visita seus súditos ocasionalmente."
 martial_authority.5000.authoritative_religion.desc:0 "Eu esfrego minhas têmporas doloridas enquanto um funcionário me lê o décimo segundo comunicado de [baron_1_lands.GetNameNoTier] este ano. Vários feudos importantes como esse têm visto meu controle enfraquecer nos últimos meses...\n\nUma pequena visita a essas terras remotas, como é meu dever, poderia colocá-las um pouco mais firmemente sob meu controle. Por outro lado, [party_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] me convidou para um banquete privado..."
 martial_authority.5000.b:0 "Sou #EMP obrigad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]#! a ir para essa festa!"
 martial_authority.5000.relaxed_religion.desc:0 "Eu esfrego minhas têmporas doloridas enquanto um funcionário me lê o décimo segundo comunicado de [baron_1_lands.GetNameNoTier] este ano. Vários feudos importantes como esse têm visto meu controle enfraquecer nos últimos meses, mas uma pequena visita a essas terras remotas poderia colocá-las um pouco mais firmemente sob meu controle.\n\nPor outro lado, [party_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] me convidou para um banquete privado..."
 martial_authority.5000.t:0 "Visitando as Regiões Remotas"
 martial_authority.8000.a.tt:0 "[fighting_child.GetSheHe|U] pode provar [fighting_child.GetHerselfHimself]"
 martial_authority.8000.a:0 "Permitirei, mas ordene que ninguém machuque [fighting_child.GetSheHe]."
 martial_authority.8000.b:0 "\"Claro, criança! Que nenhum guerreiro contenha a fúria [fighting_child.GetHerHim]!\""
 martial_authority.8000.c:0 "\"Seja uma boa criança e vá brincar com os cavalos.\""
 martial_authority.8000.d:0 "\"Este não é lugar para [Select_CString( fighting_child.IsFemale, 'uma', 'um' )] jovem [fighting_child.Custom('GirlBoy')].\""
 martial_authority.8000.desc:0 "Meu [marshal.GetCouncilTitle] está organizando o que parece ser o centésimo torneio do ano, e tudo o que posso fazer é me manter acordado. Minha mente volta à vida quando sinto um puxão em meu cotovelo.\n\nM[Select_CString( fighting_child.IsFemale, 'inha', 'eu' )] jovem [fighting_child.Custom('GetDaughterSon')] [fighting_child.GetName], contra todas as probabilidades da natureza, está cambaleando carregando uma lança quatro vezes maior que seu tamanho, e encontrou um capacete mal ajustado que fica escorregando sobre os olhos [fighting_child.GetHerHim].\n\n\"[ROOT.Char.GetMotherFather|U], posso lutar uma rodada na batalha?"
 martial_authority.8000.t:0 "Torneio Birrento"
 martial_authority.8000.tt.failure:0 "[fighting_child.GetName] não consegue se destacar"
 martial_authority.8000.tt:0 "[fighting_child.GetName] avança no torneio"
 martial_authority.8000_injury:0 "[fighting_child.GetName] fica ferid[Select_CString( fighting_child.IsFemale, 'a', 'o' )]"
 martial_authority.8100.a:0 "Parece que temos um vencedor!"
 martial_authority.8100.c:0 "Grande [ROOT.GetCharacter.GetFaith.HighGodName], [fighting_child.GetNameNoTooltip]! Peço desculpas por [fighting_child.GetSheHe]."
 martial_authority.8100.desc:0 "Os lutadores na luta corpo a corpo dançam em círculos desajeitados ao redor de [fighting_child.GetName], claramente com medo de machucar [fighting_child.GetSheHe]. No entanto, [fighting_child.GetSheHe] retaliar com golpes sujos, ignorando todas as regras do torneio.\n\nEu assisto enquanto [fighting_child.GetSheHe] enfia a haste de quatorze pés nas costas do meu [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] [murdered_knight.GetNamePossessive]. Os lutadores continuam a apenas dar golpes simbólicos n[fighting_child.GetSheHe], enquanto [fighting_child.GetSheHe] perfura o cérebro de outro combatente.\n\n\"Acabe com isso, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord|U]!\" [marshal.GetTitledFirstName] implora."
 martial_authority_4001.billhook.tt:0 "Você afia a lâmina."
 martial_authority_4001.dagger.tt:0 "Você cria uma adaga rudimentar a partir da ferramenta."
 martial_authority_4001.fail.tt:0 "Você não consegue fazer nada útil com a ferramenta."
 martial_authority_4001.halberd.tt:0 "Você cria uma alabarda rudimentar a partir da ferramenta."
 martial_authority_4002.make.tt:0 "Você adquire [improvised_dagger.GetName]"
 martial_authority_4003.make.tt:0 "Você adquire [improvised_halberd.GetName]"
 martial_authority_4004.make.tt:0 "Você adquire [improvised_billhook.GetName]"
