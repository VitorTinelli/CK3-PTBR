l_spanish:
 historical_commander_trait.0001.a:0 "Assim como Hannibal, eu aniquilarei meus inimigos!"
 historical_commander_trait.0001.b:0 "Hannibal era um verdadeiro mestre das táticas de Fabius."
 historical_commander_trait.0001.c:0 "A versatilidade era a maior força de Hannibal."
 historical_commander_trait.0001.d.good:0 "A brutalidade não é um traço a ser invejado, mesmo na guerra."
 historical_commander_trait.0001.d:0 "Bah! Ele era um tolo, lutando sua guerra sem esperança."
 historical_commander_trait.0001.desc:0 "Enquanto estudava as táticas dos generais antigos, fiquei [ROOT.Char.Custom('surprised_reaction')] ao descobrir as proezas de Hannibal Barca durante a Segunda Guerra Púnica:\n\n#F Conhecido como 'O Inimigo de Roma', o maior feito de Hannibal foi a Batalha de Canas, onde seu exército de aproximadamente 50.000 homens manobrou e cercou o maior exército romano com 86.000 soldados. Cercados e incapazes de recuar, apenas 3.000 romanos sobreviveram ao massacre.#!"
 historical_commander_trait.0001.t:0 "\"O Inimigo de Roma\""
 historical_commander_trait.0002.a:0 "Um pouco de engenhosidade faz toda a diferença em um cerco."
 historical_commander_trait.0002.b:0 "Faça o inimigo vir até você! Eu gosto disso!"
 historical_commander_trait.0002.c:0 "César arriscou-se com aquele plano, mas valeu a pena!"
 historical_commander_trait.0002.d:0 "As guerras não são mais lutadas dessa forma hoje em dia..."
 historical_commander_trait.0002.desc:0 "Enquanto estudava as táticas dos generais antigos, fiquei fascinado ao descobrir as proezas de Júlio César durante sua conquista da Gália.\n\n#F Durante o cerco de Alesia, César determinou que um ataque direto à cidade bem fortificada seria muito custoso. Em vez disso, ele ordenou que seu exército construísse sua própria fortaleza que cercasse toda a cidade, prendendo a guarnição inimiga para morrer de fome e, ao mesmo tempo, impedindo que reforços aliviassem os defensores.#!"
 historical_commander_trait.0002.t:0 "O Triunfo de César"
 historical_commander_trait.0003.a:0 "Nenhuma quantidade de água impedirá meus exércitos!"
 historical_commander_trait.0003.b:0 "Aquela passagem foi um feito de grande engenhosidade."
 historical_commander_trait.0003.c:0 "Transformar os recursos do meu inimigo contra ele? Genial!"
 historical_commander_trait.0003.d:0 "Por que perder tempo estudando táticas que não funcionaram?"
 historical_commander_trait.0003.desc:0 "Enquanto estudava as táticas dos generais antigos, fiquei [ROOT.Char.Custom('surprised_reaction')] ao descobrir as proezas de Alexandre, o Grande, durante sua conquista da Mesopotâmia.\n\n#F Durante o Cerco de Tiro, Alexandre atacou uma fortaleza em uma ilha demolindo uma cidade próxima e usando os destroços para construir um caminho que ia do continente até as muralhas da cidade. Isso permitiu que suas máquinas de cerco atacassem diretamente a fortaleza inimiga, embora tenha sido sua marinha que acabou criando uma brecha.#!"
 historical_commander_trait.0003.t:0 "O Invencível Alexandre"
 historical_commander_trait.0004.a:0 "Os ímpios não são páreo para os exércitos de Deus!"
 historical_commander_trait.0004.b:0 "Assim como Constantino, nenhum rio pode atrasar minha vitória!"
 historical_commander_trait.0004.c:0 "Falando logicamente, táticas flexíveis venceram aquela batalha."
 historical_commander_trait.0004.d:0 "Truques para fortalecer a moral não são suficientes para vencer guerras!"
 historical_commander_trait.0004.desc:0 "Enquanto estudava as táticas dos generais antigos, fiquei inspirado ao descobrir a vitória de Constantino na Batalha da Ponte Mílvio.\n\n#F Na noite anterior à batalha, Constantino sonhou que a vitória seria concedida se ele pintasse o Quí-Rho, um símbolo de Cristo, nos escudos de seus soldados. Ele fez exatamente isso, e no dia seguinte ele conquistou as forças do usurpador Maxêncio, que caiu no Rio Tibre e se afogou.#!"
 historical_commander_trait.0004.t:0 "A Visão do Quí-Rho"
 historical_commander_trait.0005.a:0 "Aqueles que lutam em nome de Alá serão vitoriosos!"
 historical_commander_trait.0005.b:0 "Devoção nos mantém fortes quando estamos em menor número."
 historical_commander_trait.0005.c:0 "Saber #EMP quando#! lutar é tão importante quanto saber #EMP como#!."
 historical_commander_trait.0005.d:0 "Por que comemorar uma derrota embaraçosa?"
 historical_commander_trait.0005.desc:0 "Enquanto estudava as táticas de generais históricos, fiquei contemplativo ao aprender sobre a primeira batalha de Khalid ibn al-Walid após sua conversão ao Islã.\n\n#F Em desvantagem de mais de 3 para 1 pelos bizantinos durante a Batalha de Mu'tah, Khalid reuniu seus soldados vacilantes para manter a linha. Essa postura desafiadora permitiu que ele organizasse uma retirada para Medina, salvando seus homens de uma morte certa. Khalid e seu exército posteriormente conquistaram toda a Arábia em nome de Alá!#!"
 historical_commander_trait.0005.t:0 "A Espada de Alá"
 historical_commander_trait.0006.a:0 "Com a bênção do céu, nós perseveramos!"
 historical_commander_trait.0006.b:0 "$historical_commander_trait.0005.c$"
 historical_commander_trait.0006.c:0 "Táticas flexíveis são necessárias para um exército móvel!"
 historical_commander_trait.0006.d:0 "Somos melhores do que meros truques!"
 historical_commander_trait.0006.desc:0 "Enquanto estudava as táticas de generais antigos, fiquei inspirado ao descobrir os relatos das conquistas de Bilge Khagan, que alcançaram os quatro cantos do mundo.\n\nSaqueando por Baximi e Gazhou, ele humilhou o exército do imperador Xuanzong da dinastia Tang, mesmo contando com centenas de milhares de soldados. Ele realmente entendeu que nossa força está na rapidez e mobilidade!\n\nBilge e seu exército mais tarde esmagaram os Khitan e os Xi em nome de Tengri!"
 historical_commander_trait.0006.t:0 "O Rei Sábio"
 historical_commander_trait.0007.a:0 "A linha entre desordem e ordem reside na coordenação"
 historical_commander_trait.0007.b:0 "Devo buscar subjugar o inimigo sem lutar"
 historical_commander_trait.0007.c:0 "Quando eu me mover, cairei como um raio!"
 historical_commander_trait.0007.d:0 "A maior vitória é aquela que não exige batalha"
 historical_commander_trait.0007.desc:0 "Ao estudar os sete clássicos militares eu fiquei [ROOT.Char.Custom('surprised_reaction')] ao saber da Batalha de Boju, onde Sun Tzu provou o valor de suas teorias sobre guerra.\n\n#F Durante o Período de Primavera e Outono, diz-se que Sun Tzu liderou os exércitos de Wu à vitória, derrotando as forças de Chu numericamente superiores ao empregar seus teoremas militares agora amplamente estudados.#!"
 historical_commander_trait.0007.t:0 "Sun Tzu"
 historical_commander_trait.reject.tt:0 "#F Você procurará inspiração em outro lugar #!"
