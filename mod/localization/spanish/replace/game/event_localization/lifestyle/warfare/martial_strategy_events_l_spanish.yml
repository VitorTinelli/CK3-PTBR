l_spanish:
 martial_strategy.1051.a.humble:0 "Conhecer meus limites significa que posso contorná-los."
 martial_strategy.1051.a:0 "Eu tenho um talento natural que me destaca dos demais."
 martial_strategy.1051.b.brave:0 "Minha coragem inspira minhas tropas a lutar."
 martial_strategy.1051.b.stalwart:0 "Minha determinação é tal que nunca vou fraquejar!"
 martial_strategy.1051.c.feareater:0 "Minha mera presença causa medo nos meus inimigos!"
 martial_strategy.1051.c.wrathful:0 "Ninguém pode resistir à minha ferocidade avassaladora!"
 martial_strategy.1051.d.sadistic:0 "Sempre atinjo meus inimigos onde mais dói."
 martial_strategy.1051.d.zealous:0 "Minha devoção a [ROOT.GetCharacter.GetFaith.HighGodName] me garante a vitória."
 martial_strategy.1051.d.zealoussadistic:0 "Não descanso em minha cruzada contra os ímpios!"
 martial_strategy.1051.desc:0 "O tópico de conversa mais popular na [ROOT.Char.Custom('GetCourt')] está sempre mudando, mas uma tendência recente tem sido a discussão da minha habilidade notável como comandante militar — e qual é o segredo do meu sucesso.\n\nPosso usar essa curiosidade natural para fortalecer minha reputação, mas primeiro devo decidir a que atribuir meu sucesso..."
 martial_strategy.1051.e.patient:0 "Estou sempre vigilante, esperando minha chance de atacar."
 martial_strategy.1051.f.ambitious:0 "Farei o que for necessário para sair vitorioso!"
 martial_strategy.1051.t:0 "Fofocas Gerais"
 martial_strategy.1401.a_lot_returned:0 "Muitos dos meus soldados já retornaram, e estou otimista em encontrar os restantes.\n\n"
 martial_strategy.1401.almost_done:0 "Quase todos os meus soldados já retornaram agora, e saio sabendo que os últimos podem ser difíceis de encontrar.\n\n"
 martial_strategy.1401.close_to_done:0 "A maioria dos meus soldados já retornou, e saio em busca dos últimos regimentos.\n\n"
 martial_strategy.1401.first_find:0 "Não demora muito para eu encontrar o primeiro regimento que procuro.\n\n"
 martial_strategy.1401.some_returned:0 "Alguns dos meus soldados já retornaram, enquanto saio em busca dos restantes.\n\n"
 martial_strategy.2000.a:0 "Leia o livro mais recente."
 martial_strategy.2000.b.failure.tt:0 "Você deve ganhar [stress|E] ou desistir"
 martial_strategy.2000.b.failure:0 "Falho em decifrar o pergaminho"
 martial_strategy.2000.b.success.tt:0 "Você ganha #P 1#! [martial|E], #P 1#! [learning|E] e um bônus de [commander|E] por #V 20 anos#!"
 martial_strategy.2000.b.success:0 "Descubro um pedaço de conhecimento antigo"
 martial_strategy.2000.b:0 "Tente traduzir o pergaminho antigo."
 martial_strategy.2000.catalaunianplains.desc:0 "batalha das Planícies Catalaunianas,"
 martial_strategy.2000.constantinople.desc:0 "cerco de Constantinopla,"
 martial_strategy.2000.end.desc:0 "bem como um pergaminho antigo escrito em uma língua antiga. Quem sabe quais segredos esquecidos ele guarda..."
 martial_strategy.2000.hastings.desc:0 "batalha de Hastings,"
 martial_strategy.2000.palaceofthemartyrs.desc:0 "batalha do Palácio dos Mártires,"
 martial_strategy.2000.start.desc:0 "Embora eu vá certamente ver muitos campos de batalha antes de encontrar meu criador, minha biblioteca contém contos de guerra de cem vidas.\n\nRecentemente, adquiri um livro sobre a grande"
 martial_strategy.2000.t:0 "Lições do Passado"
 martial_strategy.2000.tours.desc:0 "batalha de Tours,"
 martial_strategy.2000.vapati.desc:0 "batalha de Vapati,"
 martial_strategy.2001.a:0 "Estudar a batalha."
 martial_strategy.2001.b:0 "Concentrar-se no processo de tradução."
 martial_strategy.2001.gaixia.desc:0 "#F O pergaminho descreve a batalha de Gaixia. Han Xin, comandante dos Han, quebrou o espírito do inimigo fazendo seus homens cantarem canções do reino nativo do inimigo, Chu. O comandante Xiang Yu de Chu escapou com uma pequena força de homens leais, mas no final eles foram perseguidos e derrotados!#!"
 martial_strategy.2001.red_cliffs.desc:0 "#F Na batalha de Red Cliffs, o senhor da guerra Cao Cao amarrou seus navios de proa a popa para combater o enjoo. Um comandante das forças opostas de Sun-Liu, Huang Gai, viu sua chance e enviou uma carta falsa de rendição. Então, ele preparou um esquadrão de navios, enchendo-os de madeira e óleo, e deixou o vento levá-los em direção a Cao Cao. Conforme os navios desocupados se aproximavam da frota inimiga, eles foram incendiados, resultando na morte ardente de inúmeros homens!#!"
 martial_strategy.2001.start.desc:0 "Mesmo com a ajuda de um glossário empoeirado, o pergaminho reluta em compartilhar seus segredos, mas eu persisto. Conforme a noite avança, a história mais incrível se desenrola diante de mim...\n\n"
 martial_strategy.2001.teutoburg_forest.desc:0 "#F Arminius, filho de um chefe germânico, foi criado em Roma, mas planejou forjar uma aliança de tribos para derrotar os romanos. Arminius tornou-se oficial do general romano Varus e o aconselhou a fazer um desvio através da Floresta de Teutoburgo. Lá, Arminius lançou uma série de emboscadas. Devido à sua educação romana, Arminius sabia exatamente como combater as táticas inimigas e liderou seu povo para uma vitória decisiva!#!"
 martial_strategy.2001.thermopylae.desc:0 "#F Bloqueando o estreito desfiladeiro costeiro de Termópilas, as tropas gregas, em número muito inferior, resistiram ao exército persa por sete dias. No último dia, quando o rei Leônidas foi contornado, ele dispensou a maior parte de seu exército e defendeu sua retirada em uma última posição gloriosa. O heroísmo de suas tropas é um testemunho do poder de um exército patriótico defendendo suas terras nativas!#!"
 martial_strategy.2002.a:0 "Avançar."
 martial_strategy.2002.b:0 "Desistir."
 martial_strategy.2002.desc:0 "A noite cai e a única vela que ilumina o roteiro diante de mim fica cada vez mais curta a cada hora. Quando ela tremula pela última vez e me deixa na escuridão, os segredos do pergaminho permanecem desconhecidos."
 martial_strategy.2020.a.failure:0 "Minha estratégia falha, me deixando constrangido"
 martial_strategy.2020.a.success:0 "Minha estratégia funciona com sucesso"
 martial_strategy.2020.a:0 "Vou enganar meus inimigos e fazê-los se estender além do necessário!"
 martial_strategy.2020.b:0 "Táticas de ataque e fuga vão desgastar meus inimigos!"
 martial_strategy.2020.d.brave:0 "Somente os covardes usariam táticas como essas!"
 martial_strategy.2020.d.flavor:0 "Rejeitar o uso dessas táticas"
 martial_strategy.2020.d:0 "Eu não vou recorrer a jogar sujo!"
 martial_strategy.2020.desc.ambitious:0 "Para garantir a vitória, preciso aproveitar todas as vantagens que puder no campo de batalha, mesmo que isso signifique usar táticas que possam ser consideradas injustas."
 martial_strategy.2020.desc.deceitful:0 "Já li poesia comparando o campo de batalha a uma pessoa respirando. Isso me faz pensar... posso manipular o campo de batalha da mesma forma que posso manipular as pessoas?"
 martial_strategy.2020.desc.martial:0 "Eu sei por experiência que a melhor maneira de derrotar meus inimigos é garantir que só nos engajemos em batalha em meus termos! A questão é: quais termos seriam mais vantajosos?"
 martial_strategy.2020.desc.opening:0 "Reuni minha comitiva para alguns jogos de guerra, ansioso para experimentar minha ideia de simular uma retirada para atrair meus oponentes a se estenderem além do necessário."
 martial_strategy.2020.desc:0 "Se eu quiser maximizar minhas chances de vencer na batalha, pode valer a pena considerar a possibilidade de empregar algumas estratégias mais... unorthodoxas."
 martial_strategy.2020.opening:0 "Muitos tratados foram escritos sobre a conduta honrosa na guerra, mas a vida desses autores não estava em jogo quando eles pegaram a caneta para escrever.\n\n"
 martial_strategy.2020.t:0 "Tudo é válido?"
 martial_strategy.2021.a:0 "Aguardo o dia em que poderei usar esse truque em uma batalha real!"
 martial_strategy.2021.desc:0 "\n\nQuando nos dividimos em equipes, tomei cuidado para mostrar a todos como ceder terreno o suficiente para enganar o outro lado e fazê-los sair de posição, sem ceder tanto a ponto de quebrar nossa linha. \n\nMinha nova tática funcionou perfeitamente, permitindo-nos cercar a equipe inimiga e forçá-los a se render!"
 martial_strategy.2021.t:0 "Decepção Bem-sucedida"
 martial_strategy.2022.b:0 "Talvez eu deva me ater a táticas convencionais..."
 martial_strategy.2022.desc:0 "\n\nInfelizmente, quando minha equipe tentou testar minha nova tática, não conseguimos segurar nosso terreno. Sofremos uma derrota rápida e humilhante quando o lado inimigo rompeu rapidamente nossa linha e causou o colapso de nossas fileiras.\n\nTodos que participaram dos jogos agora pensam que sou um tolo e não querem mais se envolver com minhas 'ideias'."
 martial_strategy.2022.t:0 "Sonhos Desfeitos"
 martial_strategy.2030.a.failure.tt:0 "Os comerciantes que você encontra não são confiáveis."
 martial_strategy.2030.a.success.tt:0 "Você estabelece uma rede confiável de fornecedores."
 martial_strategy.2030.a:0 "Organizar uma rede de comerciantes para me ajudar."
 martial_strategy.2030.b:0 "Estocar suprimentos em minha fortaleza."
 martial_strategy.2030.c:0 "Meus soldados podem buscar seus próprios suprimentos."
 martial_strategy.2030.desc.ambitious:0 "Não importa o quão formidáveis sejam meus soldados, se eles ficarem sem suprimentos durante uma campanha, eles não me servirão melhor do que esquilos treinados."
 martial_strategy.2030.desc.diligent:0 "Orgulho-me de garantir que tudo esteja sempre contabilizado, o que inclui garantir que meus soldados estejam bem supridos."
 martial_strategy.2030.desc.end:0 "\n\nPara isso, devo elaborar um plano para garantir que meus soldados sempre tenham os suprimentos de que precisam no campo de batalha."
 martial_strategy.2030.desc.fallback:0 "Parte de comandar um exército significa garantir que meus soldados tenham comida, bebida e equipamento de acampamento em abundância para campanhas longas."
 martial_strategy.2030.t:0 "Segurança de Suprimento"
 martial_strategy.2031.a:0 "Isso fornecerá suprimentos confiáveis para meus exércitos no campo."
 martial_strategy.2031.b:0 "Agora, é hora de ganhar um pouco por fora..."
 martial_strategy.2031.desc:0 "Depois de examinar pilhas de registros financeiros, consegui selecionar um grupo de comerciantes espalhados pelo campo que eu sabia que seriam confiáveis.\n\nFiz uma oferta para mantê-los contratados para fornecer qualquer suprimento que meu exército precise a qualquer momento. Isso garantirá que meus comandantes sempre saibam a quem recorrer quando precisarem de provisões."
 martial_strategy.2031.t:0 "Uma Rede Confiável"
 martial_strategy.2032.a.forgiving:0 "Eu deveria ter feito mais pesquisas antes de fazer o pedido."
 martial_strategy.2032.a:0 "Quando eu encontrar esse trapaceiro, vou cortar a cabeça dele!"
 martial_strategy.2032.desc:0 "Entrei em contato com muitos comerciantes disponíveis para ver quem poderia fornecer melhor os suprimentos de que meu exército precisa.\n\nUm comerciante tinha preços muito bons, então fiz arranjos para obter a maioria dos suprimentos do meu exército com ele... mas, quando chegou a hora de pegar o carregamento, ele e suas mercadorias não foram encontrados em lugar nenhum!"
 martial_strategy.2032.t:0 "Suprimentos Desaparecidos"
 martial_strategy.3010.a:0 "[impatient_commander.GetTitledFirstNameNoTooltip] tem a ideia certa aqui!"
 martial_strategy.3010.b:0 "Eu prefiro usar o plano d[Select_CString( patient_commander.IsFemale, 'a', 'o' )] [patient_commander.GetTitledFirstNameNoTooltip]."
 martial_strategy.3010.c:0 "Meus comandantes podem agir conforme acharem melhor."
 martial_strategy.3010.desc.craven:0 "murmura nervosamente sobre como devemos evitar combates desnecessários e travar uma guerra de desgaste."
 martial_strategy.3010.desc.end:0 "\n\nÉ meu direito decidir nosso curso de ação final."
 martial_strategy.3010.desc.flexible:0 "explica como precisamos observar o que nossos inimigos fazem e responder de acordo."
 martial_strategy.3010.desc.greedy:0 "aponta ansiosamente todos os alvos principais para os quais devemos enviar imediatamente partidas de saque,"
 martial_strategy.3010.desc.middle:0 "enquanto [Select_CString( patient_commander.IsFemale, 'a', 'o' )] [patient_commander.GetFirstNameNoTooltip]"
 martial_strategy.3010.desc.patient:0 "recosta-se e defende pacientemente que devemos garantir locais críticos e esperar que o inimigo venha até nós."
 martial_strategy.3010.desc.response.start:0 "Estou participando de uma reunião estratégica com [Select_CString( my_liege.IsFemale, 'a', 'o' )] [my_liege.GetTitledFirstName] e [Select_CString( other_commander.IsFemale, 'a', 'o' )] [other_commander.GetTitledFirstName], discutindo nossos planos para a guerra em curso."
 martial_strategy.3010.desc.start:0 "Estou sentado ao redor da mesa de mapas com [Select_CString( impatient_commander.IsFemale, 'a', 'o' )] [impatient_commander.GetTitledFirstName] e [Select_CString( patient_commander.IsFemale, 'a', 'o' )] [patient_commander.GetTitledFirstName], discutindo nossa estratégia para a guerra em curso.\n\n[impatient_commander.GetFirstNameNoTooltip]"
 martial_strategy.3010.desc.wrathful:0 "[impatient_commander.GetSheHe] bate com força o punho na mesa e proclama em voz alta que devemos atacar o inimigo diretamente e esmagá-lo com a pura força de nossos exércitos,"
 martial_strategy.3010.o_martial:0 "Eu sei como podemos usar ambas as estratégias!"
 martial_strategy.3010.t:0 "Impasse Estratégico"
 martial_strategy.3011.a.disapprove:0 "Quem diria que [Select_CString( my_liege.IsFemale, 'a', 'o' )] [my_liege.GetFirstNameNoTooltip] poderia ver a razão?"
 martial_strategy.3011.a:0 "Eu sabia que [Select_CString( my_liege.IsFemale, 'a', 'o' )] [my_liege.GetTitledFirstNameNoTooltip] gostaria das minhas ideias!"
 martial_strategy.3011.desc:0 "\n\n[my_liege.GetTitledFirstName] está muito receptiv[Select_CString( my_liege.IsFemale, 'a', 'o' )] às minhas ideias, preferindo-as em relação às propostas [Select_CString( other_commander.IsFemale, 'pela', 'pelo' )] [other_commander.GetFirstName]. Agora vamos seguir em frente e usá-las para moldar nossa política estratégica para a guerra em curso!"
 martial_strategy.3011.t:0 "Estratégia Abraçada"
 martial_strategy.3012.a.disapprove:0 "A tolice d[Select_CString( my_liege.IsFemale, 'a', 'o' )] [my_liege.GetFirstNameNoTooltip] não me surpreende."
 martial_strategy.3012.a:0 "O tempo dirá se a escolha d[Select_CString( my_liege.IsFemale, 'a', 'o' )] [my_liege.GetFirstNameNoTooltip] estava correta."
 martial_strategy.3012.desc:0 "\n\nInfelizmente, [my_liege.GetTitledFirstName] está desconsiderando minhas ideias, em vez disso, favorecendo as propostas d[Select_CString( other_commander.IsFemale, 'a', 'o' )] [other_commander.GetFirstName]. Agora vamos seguir em frente e usá-las para moldar nossa política estratégica para a guerra em curso!"
 martial_strategy.3012.t:0 "Estratégia Rejeitada"
 martial_strategy.3013.a:0 "Estou feliz por ter total liberdade para fazer o que quiser."
 martial_strategy.3013.desc:0 "[my_liege.GetTitledFirstName] decidiu adotar uma abordagem de não intervenção, permitindo que tanto [Select_CString( other_commander.IsFemale, 'a', 'o' )] [other_commander.GetFirstName] quanto eu ajamos conforme julgarmos adequado."
 martial_strategy.3013.t:0 "Estratégia Permitida"
 martial_strategy.3014.a.disapprove:0 "Apesar das falhas d[Select_CString( my_liege.IsFemale, 'a', 'o' )] [my_liege.GetFirstNameNoTooltip], [my_liege.GetSheHe] é um[Select_CString( my_liege.IsFemale, 'a', '' )] general habilidos[Select_CString( my_liege.IsFemale, 'a', 'o' )]."
 martial_strategy.3014.a:0 "Estou impressionado com o plano d[Select_CString( my_liege.IsFemale, 'a', 'o' )] [my_liege.GetTitledFirstNameNoTooltip]."
 martial_strategy.3014.desc:0 "\n\n[my_liege.GetTitledFirstName] combinou minhas ideias com as d[Select_CString( other_commander.IsFemale, 'a', 'o' )] [other_commander.GetFirstName], fundindo-as em uma estratégia única e coesa que nos dará uma vantagem significativa no campo de batalha!"
 martial_strategy.3014.t:0 "Estratégia Integrada"
 martial_strategy_1303.losing:0 "Esta é nossa última chance de virar a batalha!"
 martial_strategy_1303.winning:0 "Estamos ganhando, mas não há espaço para erros!"
 martial_strategy_special.13.a.tt:0 "#F Uma abordagem mais arriscada que pode render uma recompensa maior.#!"
 martial_strategy_special.13.b.tt:0 "#F A abordagem mais segura e tática.#!"
 martial_strategy_special.1301.a:0 "Nosso tempo é melhor empregado melhorando nossas defesas."
 martial_strategy_special.1301.b.tt:0 "#F Que os jogos comecem!#!"
 martial_strategy_special.1301.b:0 "Boa ideia. Você deveria liderar os defensores!"
 martial_strategy_special.1301.desc:0 "\"O verdadeiro inimigo de todo soldado é a complacência\", diz [siege_proposer.Custom2('MyCharacterIntroduction', ROOT.Char)] antes de [siege_proposer.Custom('quirk_pos_pp')]. Estamos lado a lado no topo das muralhas do meu [ROOT.Char.Custom('FortifiedBuilding')], olhando para os soldados realizando treinamentos abaixo.\n\n\"Poderíamos trocar o portão do [ROOT.Char.Custom('FortifiedBuilding')] por tábuas de madeira e enfraquecer as flechas nas aljavas das tropas\", continua [siege_proposer.GetSheHe]. \"Lidere os soldados em um falso ataque contra o [ROOT.Char.Custom('FortifiedBuilding')] e veja como eles se saem na ação!\""
 martial_strategy_special.1301.t:0 "Sob Cerco"
 martial_strategy_special.1302.a.tt1:0 "Nós entramos praticamente sem oposição"
 martial_strategy_special.1302.a.tt2:0 "Sofremos 'baixas' pesadas, mas derrubamos o portão"
 martial_strategy_special.1302.a:0 "Ataque o portão principal!"
 martial_strategy_special.1302.b.tt1:0 "As muralhas são escaladas com pouco esforço"
 martial_strategy_special.1302.b.tt2:0 "Mal chegamos às ameias, sofrendo 'baixas' pesadas"
 martial_strategy_special.1302.b:0 "Tragam as escadas!"
 martial_strategy_special.1302.c:0 "Aproveite os pontos fracos do portão!"
 martial_strategy_special.1302.d:0 "Vá pelos esgotos!"
 martial_strategy_special.1302.desc:0 "Um portão bem fechado e muralhas que se erguem alto no céu. Arqueiros podem ser vistos como sombras se movendo atrás das ameias, e uma sensação de excitação genuína permeia o ar.\n\nNa calmaria antes da batalha, eu me viro e me dirijo aos soldados. Minha ordem ecoa alta e clara pelo campo."
 martial_strategy_special.1302.t:0 "$martial_strategy_special.1301.t$: Primeiro Ataque"
 martial_strategy_special.1303.a.tt1:0 "Subimos as escadas com eficiência brutal"
 martial_strategy_special.1303.a.tt2:0 "As escadas são conquistadas com dificuldade, passos vacilantes e braços cansados"
 martial_strategy_special.1303.a:0 "Não parem, vamos sobrecarregá-los!"
 martial_strategy_special.1303.b.tt1:0 "Leva tempo, mas eventualmente conquistamos as escadas"
 martial_strategy_special.1303.b.tt2:0 "Sofremos muitas 'baixas' antes de rompermos"
 martial_strategy_special.1303.b:0 "Um de cada vez! Fiquem alertas!"
 martial_strategy_special.1303.c:0 "Soldados canhotos à frente!"
 martial_strategy_special.1303.d:0 "Cuidado! Não se deixem provocar!"
 martial_strategy_special.1303.desc:0 "A escada ecoa quando outra arma enfraquecida bate na coluna central. Pela segunda vez em questão de minutos, eu amaldiçoo a espiral estreita que nos impede de balançar nossas armas contra os defensores.\n\nA respiração ofegante dos soldados ao meu redor é ensurdecedora, e a cada ataque repelido eles ficam mais resignados e frustrados. Eu tenho que assumir o controle da situação!"
 martial_strategy_special.1303.e:0 "Atrás de mim! #EMP Avancem#!!"
 martial_strategy_special.1303.f:0 "Atrás de mim! Eu vou protegê-los!"
 martial_strategy_special.1303.t:0 "$martial_strategy_special.1301.t$: A Cada Passo"
 martial_strategy_special.1304.a.tt1:0 "Nós rapidamente eliminamos as forças d[Select_CString( siege_proposer.IsFemale, 'a', 'o' )] [siege_proposer.GetTitledFirstName]"
 martial_strategy_special.1304.a.tt2:0 "Somos atacados por trás, desprotegidos"
 martial_strategy_special.1304.a:0 "Todos, comigo!"
 martial_strategy_special.1304.b.tt1:0 "Somos imparáveis"
 martial_strategy_special.1304.b.tt2:0 "Sem os arqueiros, nosso ataque é facilmente repelido"
 martial_strategy_special.1304.b:0 "Arqueiros, assumam suas posições!"
 martial_strategy_special.1304.c:0 "Ataquem com força! Eles não são seus amigos hoje!"
 martial_strategy_special.1304.d:0 "Escudos erguidos! Protejam a retaguarda!"
 martial_strategy_special.1304.desc:0 "Ao dar o último passo nas muralhas que cercam o [ROOT.Char.Custom('FortifiedBuilding')], observo a cena.\n\nMuitos soldados podem ter sido perdidos para os arqueiros nas muralhas, mas não seremos desencorajados. Um após o outro, sobrecarregamos os defensores e nos erguemos vitoriosos sobre os caídos.\n\nRespiro fundo e, então, é hora de seguir em frente novamente."
 martial_strategy_special.1304.f:0 "Ataquem com força! Não mostrem misericórdia!"
 martial_strategy_special.1304.t:0 "$martial_strategy_special.1301.t$: Bravura nas Ameias"
 martial_strategy_special.1399.a:0 "Nossos inimigos nunca terão chance!"
 martial_strategy_special.1399.b:0 "Como força defensora, somos formidáveis!"
 martial_strategy_special.1399.desc:0 "Entre os soldados celebrando, encontro [Select_CString( siege_proposer.IsFemale, 'a', 'o' )] [siege_proposer.GetTitledFirstName], que me parabeniza por um ataque bem liderado."
 martial_strategy_special.1399.desc_loose2:0 "\n\n\"Mesmo que você tenha falhado em tomar o [ROOT.Char.Custom('FortifiedBuilding')], [ROOT.Char.Custom('FormOfAddressForLiege')], tanto as tropas quanto você parecem revitalizadas com a mudança de ritmo!\"\n\nNão posso fazer nada além de concordar. Além disso, é reconfortante saber que meu [ROOT.Char.Custom('FortifiedBuilding')] não será tão facilmente conquistado!"
 martial_strategy_special.1399.desc_loose:0 "A batalha está perdida, e os defensores venceram o dia."
 martial_strategy_special.1399.desc_win2:0 "\n\n\"Olhe para eles, [ROOT.Char.Custom('FormOfAddressForLiege')]. A mudança de ritmo fez bem a eles. Mesmo você parece revitalizada, mesmo que seu [ROOT.Char.Custom('FortifiedBuilding')] tenha sido apenas tomado pelos atacantes!\""
 martial_strategy_special.1399.desc_win:0 "O [ROOT.Char.Custom('FortifiedBuilding')] é nosso!"
 martial_strategy_special.1399.t:0 "$martial_strategy_special.1301.t$: Tomar um [ROOT.Char.Custom('FortifiedBuilding')|U]"
 martial_strategy_special.1401.a.tt:0 "Sua busca pode levar um tempo..."
 martial_strategy_special.1401.a:0 "Esta será uma busca emocionante!"
 martial_strategy_special.1401.b:0 "Boa ideia. Você está no comando."
 martial_strategy_special.1401.commander:0 "[commander.GetTitledFirstName]"
 martial_strategy_special.1401.continue_search_tooltip:0 "Sua busca continua"
 martial_strategy_special.1401.delay_tt:0 "Sua busca será adiada"
 martial_strategy_special.1401.end:0 "sugere que eu saia com um contingente de $knight_culture_player_plural_no_tooltip_lowercase$ para encontrar as tropas desaparecidas, enquanto o resto do exército retorna para casa."
 martial_strategy_special.1401.give_up:0 "Você desiste da busca e retorna para casa"
 martial_strategy_special.1401.give_up_tt:0 "#F Os outros soldados podem aprender algo ao fazer o caminho de volta sozinhos.#!"
 martial_strategy_special.1401.officer_fallback:0 "Um dos meus oficiais"
 martial_strategy_special.1401.opening:0 "Ao final do exercício de campo, parecia uma ideia brilhante...\n\nPara praticar o reagrupamento de um exército em desordem, dividi minhas tropas e ordenei que cada oficial fizesse seu próprio caminho até [capital.GetNameNoTier].\n\nÉ claro que, no terceiro dia de espera, mas apenas com metade do meu exército no local, agora estou vendo falhas no plano."
 martial_strategy_special.1401.t:0 "Em Marcha"
 martial_strategy_special.1402.a.tt:0 "#F Lidar com soldados barulhentos é mais fácil do que lidar com um taberneiro barulhento, e você deve continuar sua busca.#!"
 martial_strategy_special.1402.a:0 "Tenho moedas suficientes para pagar pelos danos."
 martial_strategy_special.1402.b.tt:0 "#F Beber com o povo comum! Que vida! Pelo menos até você precisar continuar sua busca.#!"
 martial_strategy_special.1402.b:0 "Esses homens têm a ideia certa. Sirva-me uma bebida!"
 martial_strategy_special.1402.c:0 "Estou cansado de lidar com soldados indisciplinados."
 martial_strategy_special.1402.d.tt:0 "#F Você tem certeza de que pode convencer esses soldados a se juntarem à busca.#!"
 martial_strategy_special.1402.d:0 "Peguem uma bebida para o caminho e vamos embora!"
 martial_strategy_special.1402.desc:0 "Posso ouvir uma confusão absurda vindo de uma taverna à beira da estrada. Um dos meus $knight_culture_player_plural_no_tooltip_lowercase$ chuta a porta, revelando uma sala cheia de meus soldados desgarrados.\n\nMinha chegada os silencia e eles encaram seus canecos sem dizer uma palavra. O proprietário estreita os olhos. 'Então #EMP você#! é responsável por essa ralé?'"
 martial_strategy_special.1402.t:0 "Na Marcha"
 martial_strategy_special.1403.a.tt:0 "#F A vergonha de carregar água para mulas!#!"
 martial_strategy_special.1403.a:0 "Se essa for a única maneira..."
 martial_strategy_special.1403.b.tt:0 "#F \"Esses plebeus acham que água é mais importante do que minhas ordens?\"#!"
 martial_strategy_special.1403.b:0 "Os homens marcharão, e eles marcharão agora!"
 martial_strategy_special.1403.c:0 "Apenas leve-os para casa, sargento. Não me importo mais."
 martial_strategy_special.1403.d.tt:0 "#F Agora, se uma mula precisa de oito galões de água por dia...#!"
 martial_strategy_special.1403.d:0 "Acho que posso encontrar uma solução para isso."
 martial_strategy_special.1403.desc:0 "Ao me aproximar de [ROOT.Char.Custom('IndefiniteBodyOfWater')], avisto um acampamento montado em suas margens. Ao entrar, sou recebido pelo sargento responsável.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Nossos suprimentos de água vazaram durante a marcha, e nossos animais de carga não conseguem voltar para casa com a quantidade de água que temos atualmente.\" O soldado me olha nervosamente. \"Mas se [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetLadyLord] e seus [ROOT.Char.Custom('MountedWarriorTermPlural')] ajudarem a carregar cantis de água...\""
 martial_strategy_special.1403.t:0 "Na Marcha"
 martial_strategy_special.1404.a.tt:0 "#EMP Meus#! soldados precisam seguir #EMP minhas#! ordens."
 martial_strategy_special.1404.a:0 "Essas não eram as ordens que eu dei!"
 martial_strategy_special.1404.b.tt:0 "Não admira que eles se perderam — essas tropas precisam de disciplina!"
 martial_strategy_special.1404.b:0 "Que postura desleixada é essa? Essa não é forma correta de segurar uma espada!"
 martial_strategy_special.1404.c:0 "Leve os homens para casa, [knight.GetFirstName]. Estou cansad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] de procurar."
 martial_strategy_special.1404.d.tt:0 "[soldier_friend.GetSheHe|U] os levará em segurança para o castelo."
 martial_strategy_special.1404.d:0 "[soldier_friend.GetTitledFirstName] pode assumir o comando dessas tropas."
 martial_strategy_special.1404.desc:0 "Quando meus batedores trouxeram notícias do pequeno acampamento, eu não esperava encontrar os soldados ainda praticando suas formações de batalha.\n\nParece que [knight.Custom2('MyCharacterIntroduction', ROOT.Char)] decidiu continuar com os exercícios de campo enquanto aguardava notícias do exército principal. Suas tropas se alinham ordenadamente enquanto eu me aproximo para encontrar [knight.GetSheHe]."
 martial_strategy_special.1404.t:0 "Na Marcha"
 martial_strategy_special.1405.a.tt:0 "#F \"Esses soldados melhor se lembrarem que #EMP eu#! fui escolhido por [zealot.GetFaith.HighGodName] de acordo com um plano divino.\"#!"
 martial_strategy_special.1405.a:0 "Eu já governo por direito divino!"
 martial_strategy_special.1405.b.tt:0 "#F \"Parece perigoso punir [Select_CString( zealot.IsFemale, 'a', 'o' )] [zealot.GetWomanMan], mas enviar [zealot.GetSheHe] para o exílio resolverá meu problema por enquanto.\"#!"
 martial_strategy_special.1405.b:0 "Você tem um dia para fugir deste lugar, fanático."
 martial_strategy_special.1405.c:0 "Eles logo se cansarão de se fazerem de soldados sagrados."
 martial_strategy_special.1405.d.tt:0 "#F \"Afinal, não somos todos servos de [ROOT.Char.GetFaith.HighGodNameAlternate] de uma forma ou de outra?\"#!"
 martial_strategy_special.1405.d:0 "Junte-se a mim, pregador, e juntos realizaremos a vontade de [ROOT.Char.GetFaith.HighGodName]!"
 martial_strategy_special.1405.desc:0 "Ao passar por uma pequena vila, percebo que, embora vestidos com roupas simples, os guardas da cidade estão todos carregando armas com a minha marca!\n\nMe recebendo na rua enlameada estava [Select_CString( zealot.IsFemale, 'a', 'o' )] [zealot.GetTitledFirstName], [Select_CString( zealot.IsFemale, 'a', 'o' )] autoproclamad[Select_CString( zealot.IsFemale, 'a', 'o' )] \"guardi[Select_CString( zealot.IsFemale, 'ã', 'ão' )] divin[Select_CString( zealot.IsFemale, 'a', 'o' )]\" da cidade. Meus soldados deixaram suas armaduras para ajudar esse pregador a servir [zealot.GetFaith.HighGodName]!"
 martial_strategy_special.1405.t:0 "Na Marcha"
 martial_strategy_special.1498.a:0 "Foi um exercício valioso afinal!"
 martial_strategy_special.1498.desc:0 "Os últimos dos meus soldados chegaram de volta a [capital.GetNameNoTier] e a ordem foi restabelecida.\n\nEmbora isso esteja longe de ser uma demonstração de genialidade militar, ganhei uma nova perspectiva sobre meu exército e os soldados individuais que o compõem."
 martial_strategy_special.1498.t:0 "Na Marcha"
 martial_strategy_special.1499.a.tt:0 "#F É muito mais confortável no seu [ROOT.Char.Custom('FortifiedBuilding')] do que no campo de qualquer maneira.#!"
 martial_strategy_special.1499.a:0 "Esse exercício não saiu como planejado."
 martial_strategy_special.1499.desc:0 "Leva um tempo, mas aos poucos os soldados desaparecidos voltam pelas portas de [capital.GetNameNoTier].\n\nEu posso não ter tido muito a ver com isso, mas eles parecem ter aprendido muito com a experiência."
 martial_strategy_special.1499.t:0 "Na Marcha"
 martial_strategy_special.storm_castle.normal:0 "O ataque progride #Z decentemente#!"
 martial_strategy_special.storm_castle.poorly:0 "O ataque progride #N mal#!"
 martial_strategy_special.storm_castle.very_well:0 "O ataque progride #P muito bem#!"
 martial_strategy_special.storm_castle.well:0 "O ataque progride #P bem#!"
