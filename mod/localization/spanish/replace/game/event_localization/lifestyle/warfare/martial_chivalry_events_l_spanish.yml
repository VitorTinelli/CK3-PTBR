l_spanish:
 church_artifact_book:0 "O Livro da Admiração Cortês"
 church_artifact_book_desc:0 "Um tomo ricamente adornado contendo diretrizes para se tornar um cavaleiro cortês. Encontrado no terreno sagrado de [church_county.GetNameNoTooltip]."
 church_artifact_dagger:0 "A Adaga da Poderosa Oração"
 church_artifact_dagger_desc:0 "Uma adaga ricamente adornada. Alguém amarrou um amuleto no cabo. Encontrada no terreno sagrado de [church_county.GetNameNoTooltip]."
 church_artifact_sword:0 "A Espada da Devoção Sagrada"
 church_artifact_sword_desc:0 "Uma espada ricamente adornada. Alguém entalhou uma oração ao longo de sua lâmina. Encontrada no terreno sagrado de [church_county.GetNameNoTooltip]."
 extra_martial_chivalry.0001.a.tt:0 "Todos os mortos que vi também me tornam conhecedor."
 extra_martial_chivalry.0001.a:0 "Posso salvar vidas em vez disso."
 extra_martial_chivalry.0001.b.tt:0 "Sei como quebrar coisas, mas também sei como é algo robusto."
 extra_martial_chivalry.0001.b:0 "Vou construir algo para o futuro."
 extra_martial_chivalry.0001.c.tt:0 "O caminho para a glória é pavimentado pela morte."
 extra_martial_chivalry.0001.c:0 "Este é o meu ofício, seguirei em frente."
 extra_martial_chivalry.0001.desc.memory:0 "Corpos amontoados. Amigo, inimigo, tudo igual no fedor de sangue e podridão. A névoa envolve a carnificina, o crepúsculo não esconde nada. \n\nA visão de quando [battle_memory.GetDescription] prende-se aos meus olhos quando tento descansar.\n\nÉ este realmente o caminho de um governante? Ou serei apenas o arauto da morte?"
 extra_martial_chivalry.0001.t:0 "Tanta Morte"
 faithful_few:0 "Poucos Fiéis"
 ignored_church_modifier:0 "Depósito da Igreja Abandonada"
 martial_chivalry.0001.a.tt:0 "[duel_opponent.GetTitledFirstName] esperamos que venha servi-lo bem."
 martial_chivalry.0001.a:0 "Eu poderia ter mais pessoas como você!"
 martial_chivalry.0001.b.tt:0 "Seus soldados também se beneficiariam de uma explicação sobre os certos e errados do combate pessoal."
 martial_chivalry.0001.b:0 "Este camponês - e meus soldados - receberão uma lição sobre honra."
 martial_chivalry.0001.c.tt:0 "Decapitar com um único golpe é uma maneira certa de impressionar os camponeses - e os nobres - presentes."
 martial_chivalry.0001.c:0 "Eu abato [duel_opponent.GetSheHe] onde [duel_opponent.GetSheHe] está."
 martial_chivalry.0001.conclusion:0 "Desarmar [duel_opponent.GetSheHe] de repente se tornou uma questão de vida ou morte.\n\nTentei não mostrar meu alívio quando a espada [duel_opponent.GetHerHim] finalmente caiu no chão."
 martial_chivalry.0001.easy_fight:0 "\n\nEmbora [Select_CString( duel_opponent.IsFemale, 'a', 'o' )] [duel_opponent.GetTitledFirstName] não parecesse uma ameaça no início, rapidamente ficou claro que [duel_opponent.GetSheHe] seria incapaz de impedir que seus golpes selvagens e brutais me machucassem!"
 martial_chivalry.0001.hard_fight:0 "No entanto, a batalha foi mais acirrada do que eu esperava, e aos poucos ficou claro que [duel_opponent.GetSheHe] seria incapaz de impedir que seus golpes selvagens e brutais me machucassem!"
 martial_chivalry.0001.opening:0 "No início, pensei que o simples camponês era um tolo por entrar no campo de treinamento."
 martial_chivalry.0001.t:0 "Um Desafio Indigno"
 martial_chivalry.0002.a:0 "Acalme-se, [ROOT.Char.Custom('RandomGirlBoy')]! Acalme-se!"
 martial_chivalry.0002.a_failure:0 "Você é jogado para fora"
 martial_chivalry.0002.a_success:0 "Você consegue se manter em cima"
 martial_chivalry.0002.b:0 "Eu mergulho para o chão estável - melhor prevenir do que remediar!"
 martial_chivalry.0002.desc:0 "Já montei, apontei e acertei tantas vezes que pensei que nada poderia perturbar meu ritmo. Enquanto galopava pela área de treinamento, uma comoção que não consigo ver completamente faz meu cavalo se levantar.\n\nPor um instante, o ímpeto me mantém preso à parte de trás do cavalo enquanto ele começa a tremer. Então, como se o tempo estivesse fluindo devagar, sinto-me sendo deslocado."
 martial_chivalry.0002.increase_horse_mastery:0 "Minha maestria na equitação aumenta, assim como minha experiência no [martial_lifestyle|E]."
 martial_chivalry.0002.t:0 "Um Choque Repentino"
 martial_chivalry.0003.a.tt:0 "Se nada mais, o incidente ensinou um pouco mais sobre o controle de cavalos."
 martial_chivalry.0003.a:0 "Que fera vigorosa."
 martial_chivalry.0003.b:0 "Eu mesmo vou cuidar do treinamento desse."
 martial_chivalry.0003.desc:0 "Sinto-me sendo jogado para os lados, mas nenhum movimento faz com que eu afrouxe minha pegada nas rédeas e na sela.\n\nMeus comandos eventualmente acalmam o cavalo, e o animal logo volta a pisar com entusiasmo no solo compactado, tão estável como antes."
 martial_chivalry.0003.t:0 "No Comando"
 martial_chivalry.0004.a:0 "Maldito animal!"
 martial_chivalry.0004.desc:0 "Sou jogado para o chão compacto, a dor do impacto percorrendo todos os ossos do meu corpo.\n\nO jovem do estábulo vem correndo um pouco tarde demais."
 martial_chivalry.0004.t:0 "Exibição Desagradável"
 martial_chivalry.0005.a:0 "Não deveria ter saído da cama hoje."
 martial_chivalry.0005.desc:0 "O jovem do estábulo tenta me ajudar a levantar, mas grito para que ele pare.\n\nBater no chão envia ondas de dor por todo o meu corpo, e minha antiga ferida está doendo pior do que quando era recente!"
 martial_chivalry.0005.t:0 "Que Dia Ruim para Andar a Cavalo"
 martial_chivalry.0006.a:0 "Como acabei na cama? Onde está meu cavalo?"
 martial_chivalry.0006.desc:0 "Não me lembro como acabei no chão, só sei da dor ardente em todo o meu corpo. Rostos indefinidos se reúnem ao meu redor, olhando para baixo para mim.\n\nTudo fica escuro."
 martial_chivalry.0006.t:0 "O Que Aconteceu?"
 martial_chivalry.0007.a:0 "O que espera além?"
 martial_chivalry.0007.desc:0 "Pensei que andar a cavalo me faria sentir melhor. Que um pouco de esforço me ajudaria a me curar. Enquanto caio pelo ar, a dor das minhas feridas deixa de me preocupar por um breve momento de leveza. É o melhor que me sinto há semanas.\n\nAo me chocar contra o chão, não preciso mais me preocupar com a dor ou qualquer outra preocupação terrena."
 martial_chivalry.0007.t:0 "Meu Reino por um Cavalo"
 martial_chivalry.0010.a:0 "Eu e minha confiável [ROOT.Char.Custom('signature_weapon')] não nos separaremos."
 martial_chivalry.0010.b.tt1:0 "Você mostra como é feito"
 martial_chivalry.0010.b.tt2:0 "Você tropeça e se machuca"
 martial_chivalry.0010.b:0 "Vamos acabar com a monotonia, me dê outra arma!"
 martial_chivalry.0010.desc:0 "O incessante choque de metal contra metal, o atrito da armadura, a ardência do suor... É uma dança tão familiar quanto exaustiva. Treinar meu [ROOT.Char.Custom('signature_weapon')], atacar, esquivar, defender e repetir.\n\nTalvez seja bom praticar minhas habilidades com outra arma."
 martial_chivalry.0010.t:0 "O Caminho da [ROOT.Char.Custom('signature_weapon')]"
 martial_chivalry.1011.a.tt:0 "Quem sabe o que você encontrará lá dentro?"
 martial_chivalry.1011.a:0 "Vamos entrar, tenho certeza de que há tesouros a serem encontrados!"
 martial_chivalry.1011.b:0 "Vamos erguer as tendas do lado de fora, é hora de descansar."
 martial_chivalry.1011.desc:0 "Suado, cansado e precisando de comida; um longo dia de treinamento com as tropas está chegando ao fim.\n\nEnquanto procuramos um lugar para acampar, avistamos um velho e abandonado castelo ao longe. [ROOT.Char.Custom('quirk_pos_personal_pp')|U], eu declaro: 'É lá que faremos nosso acampamento esta noite.'\n\nO sol está se pondo, e a cada passo em direção às ruínas, elas se tornam mais sombrias. Em pouco tempo, os soldados estão sussurrando sobre fantasmas."
 martial_chivalry.1011.t:0 "Descanso para os Cansados"
 martial_chivalry.1012.a.failure:0 "Encontramos bugigangas e bijuterias"
 martial_chivalry.1012.a.success:0 "Encontramos um grande tesouro"
 martial_chivalry.1012.a:0 "Vamos procurar nos andares superiores!"
 martial_chivalry.1012.b.failure:0 "Esse lugar te assusta"
 martial_chivalry.1012.b.success:0 "Você enfrenta seus medos"
 martial_chivalry.1012.b.tt1:0 "#F 'Eu juro que aquela sombra acabou de se mexer! Isso é... sangue? O que foi esse som?!'#!"
 martial_chivalry.1012.b:0 "O que pode estar escondido na escuridão abaixo?"
 martial_chivalry.1012.desc:0 "Escuridão, umidade e desolação dominam o interior do castelo, e todo vestígio de vida se foi.\n\nOlhando para cima, em direção às escadas em ruínas, avisto o que podem ser os restos de tapeçarias suntuosas e pinturas antigas. Olhando para baixo, em direção às escadas em espiral, vejo apenas escuridão que se estende profundamente no subsolo do castelo."
 martial_chivalry.1012.t:0 "Procurando o Desconhecido"
 martial_chivalry.1021.a:0 "Vou me retirar por um momento."
 martial_chivalry.1021.b.failure:0 "Eu tropeço e me machuco"
 martial_chivalry.1021.b.success:0 "Meu avanço é impressionante"
 martial_chivalry.1021.b:0 "Encare o ataque de frente!"
 martial_chivalry.1021.desc:0 "Uma espada atinge minha couraça, um cotovelo bate em meu capacete, um soldado facilmente evita minha tentativa desajeitada de contra-atacar... A batalha simulada acontece ao meu redor, mas eu luto para encontrar meu foco.\n\nEstou tentado a baixar minha guarda assim que a luta acalmar, mas sei que o segundo ataque está prestes a começar."
 martial_chivalry.1021.t:0 "O Caos da Batalha"
 martial_chivalry.2010.a.failure1.tt:0 "[challenger.GetShortUINameNoTooltip] ganha vantagem no duelo"
 martial_chivalry.2010.a.failure2.tt:0 "Você perde o duelo de treinamento"
 martial_chivalry.2010.a.success.tt:0 "Você vence o duelo de treinamento"
 martial_chivalry.2010.a:0 "Desafio aceito!"
 martial_chivalry.2010.b:0 "Eu prefiro não..."
 martial_chivalry.2010.dislike.desc:0 "olhando para mim enquanto balança sua [challenger.Custom('signature_weapon')] descuidadamente de um lado para o outro.\n\n\"Meu [ROOT.Char.GetTitleTierName]!\" As palavras d[Select_CString( challenger.IsFemale, 'a', 'o' )] [challenger.GetFirstName] ecoam pelo pátio. \"Você não preferiria testar suas habilidades contra mim?\""
 martial_chivalry.2010.like.desc:0 "que acena para mim. Eu me aproximo para cumprimentar [challenger.GetSheHe].\n\nConversamos sobre nossas práticas de armas por um tempo, trocando truques e conselhos. Justo quando estou prestes a voltar para mais uma rodada, o rosto d[Select_CString( challenger.IsFemale, 'a', 'o' )] [challenger.GetTitledFirstName] se ilumina e [challenger.GetSheHe] sugere que pratiquemos juntos."
 martial_chivalry.2010.start.desc:0 "Estou treinando com um dos meus soldados, com suor escorrendo pela testa, quando sinto a sensação estranha de estar sendo observado. Olhando por cima do ombro, avisto [challenger.Custom2('MyCharacterIntroduction', ROOT.Char)],"
 martial_chivalry.2010.t:0 "O Desafio"
 martial_chivalry.2011.a:0 "Vamos encerrar isso! Lutamos bem."
 martial_chivalry.2011.b:0 "Vou mostrar para [challenger.GetSheHe] para não me desafiar novamente!"
 martial_chivalry.2011.end.desc:0 "A multidão aplaude quando eu me lanço e sua admiração me torna corajoso. Em vez de recuar, tento uma nova técnica que estive praticando. Os movimentos fluem através de mim e de minha [ROOT.Char.Custom('signature_weapon')] como se fôssemos um só. [challenger.GetTitledFirstName] está indefes[Select_CString( challenger.IsFemale, 'a', 'o' )] diante de mim."
 martial_chivalry.2011.start.desc:0 "O som de [ROOT.Char.Custom('signature_weapon')] colidindo contra [challenger.Custom('signature_weapon')] ecoa entre as paredes do pátio. Todos os olhares estão em nós; todos querem ver seu [ROOT.Char.GetTitleTierName] lutando contra s[Select_CString( challenger.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('challenger'))].\n\n"
 martial_chivalry.2011.t:0 "A Vantagem"
 martial_chivalry.2012.a:0 "Eu me rendo! Lutamos bem."
 martial_chivalry.2012.b.failure.tt:0 "#F Você perde o duelo de treinamento.#!"
 martial_chivalry.2012.b:0 "Apenas covardes se rendem!"
 martial_chivalry.2012.end.desc:0 "Devo estar cansado do meu treinamento anterior, porque me movo lentamente, incapaz de acompanhar meu oponente. Quando me lanço, [challenger.GetSheHe] já desapareceu, e meus bloqueios ocorrem no último momento. Não demora muito para eu me encontrar no chão diante [challenger.GetHerHim]."
 martial_chivalry.2012.t:0 "[challenger.Custom('SignatureWeaponArticle')|U] [challenger.Custom('signature_weapon')|U] em Minha Garganta"
 martial_chivalry.2013.a:0 "[challenger.Custom2('InsultNoun', ROOT.Char)] Maldit[Select_CString( challenger.IsFemale, 'a', 'o' )]!"
 martial_chivalry.2013.end.desc:0 "Por meio de um truque sujo, [challenger.GetFirstName] ganha uma vantagem inicial. Não há tempo para reclamar, nem quero agir como um chorão. Mas não consigo deixar passar, e minha frustração me desequilibra. Faço um ataque mal-advisado e meu oponente me derruba no chão."
 martial_chivalry.2013.t:0 "Humilhação Sangrenta"
 martial_chivalry.2014.a:0 "Minha vitória não será esquecida tão cedo!"
 martial_chivalry.2014.desc:0 "A julgar pelos exclamações da multidão, eles mal podem acreditar no que veem quando eu rolo para longe de [challenger.Custom('signature_weapon')] d[Select_CString( challenger.IsFemale, 'a', 'o' )] [challenger.GetFirstName] e desarmo [challenger.GetSheHe] em um movimento rápido. Sei que foi um movimento perigoso, mas às vezes é preciso correr grandes riscos para alcançar vitórias gloriosas."
 martial_chivalry.2014.t:0 "Contra Todas as Probabilidades"
 martial_chivalry.2015.a:0 "Por que eu fiz isso?!"
 martial_chivalry.2015.desc:0 "Faço um último ataque desesperado, mas [Select_CString( challenger.IsFemale, 'a', 'o' )] [challenger.GetFirstName] é rápid[Select_CString( challenger.IsFemale, 'a', 'o' )]. [challenger.GetSheHe|U] parry instintivamente, mas, como meu ataque foi inesperado, [challenger.GetSheHe] não está no controle total de sua arma. Uma dor paralisante percorre meu braço."
 martial_chivalry.2015.t:0 "Público Ridículo"
 martial_chivalry.3000.a:0 "Repreenda [bad_commander.GetSheHe] pelo fracasso."
 martial_chivalry.3000.b.attempt:0 "[bad_commander.GetTitledFirstNameNoTooltip] tomará uma decisão com base em sua personalidade"
 martial_chivalry.3000.b.tt.f:0 "[bad_commander.GetTitledFirstNameNoTooltip] se recusa a ouvir"
 martial_chivalry.3000.b.tt.s:0 "[bad_commander.GetTitledFirstNameNoTooltip] aceita seu conselho"
 martial_chivalry.3000.b:0 "Ensine [bad_commander.GetSheHe] o que sei sobre comandar."
 martial_chivalry.3000.c:0 "Anime [bad_commander.GetSheHe] depois do treinamento."
 martial_chivalry.3000.desc.callous:0 " Essa demonstração de incompetência é uma vergonha para o [ROOT.Char.GetPrimaryTitle.GetName] e não pode ser tolerada!"
 martial_chivalry.3000.desc.compassionate:0 " Tendo passado por essa situação, sei como é difícil trabalhar com soldados não treinados."
 martial_chivalry.3000.desc.fallback:0 " Embora nunca seja fácil treinar novos soldados, [bad_commander.GetSheHe] realmente precisa fazer melhor do que isso."
 martial_chivalry.3000.desc:0 "Hoje estou observando [Select_CString( bad_commander.IsFemale, 'a', 'o' )] [bad_commander.GetTitledFirstName] enquanto [bad_commander.GetSheHe] treina alguns dos novos recrutas, mas sob o comando [bad_commander.GetHerHim] se parecem mais com uma multidão desorganizada do que com um exército.\n\nObservo [bad_commander.GetSheHe] lutar para obter controle da situação, claramente levado aos limites."
 martial_chivalry.3000.response.desc:0 "[my_liege.GetTitledFirstName] parou para me observar hoje enquanto eu treinava minhas novas milícias.\n\nVergonhosamente, meus soldados indisciplinados se tornaram uma multidão desordenada ao tentar completar seus exercícios!"
 martial_chivalry.3000.t:0 "Recrutas Indisciplinados"
 martial_chivalry.3001.a:0 "Punir esses recrutas por me fazerem passar vergonha!"
 martial_chivalry.3001.b:0 "Eu preciso me esforçar mais, pelo bem do reino."
 martial_chivalry.3001.c:0 "Eu falhei com [Select_CString( my_liege.IsFemale, 'a', 'o' )] [my_liege.GetTitledFirstNameNoTooltip]."
 martial_chivalry.3001.desc:0 "Ainda pior, [my_liege.GetFirstName] me culpou pessoalmente por esse fracasso."
 martial_chivalry.3001.t:0 "Humilhado!"
 martial_chivalry.3002.a:0 "Aceitar os conselhos d[Select_CString( my_liege.IsFemale, 'a', 'o' )] [my_liege.GetFirstNameNoTooltip] com gratidão."
 martial_chivalry.3002.b:0 "Amaldiçoar essa multidão por me fazer passar vergonha!"
 martial_chivalry.3002.desc:0 "Agora [Select_CString( my_liege.IsFemale, 'a', 'o' )] [my_liege.GetFirstName] está me dando uma palestra sobre os fundamentos de como treinar novas tropas!"
 martial_chivalry.3002.t:0 "Intervenção"
 martial_chivalry.3003.a:0 "Isso tornará [Select_CString( bad_commander.IsFemale, 'a', 'o' )] [bad_commander.GetFirstNameNoTooltip] um[Select_CString( bad_commander.IsFemale, 'a', '' )] melhor comandante."
 martial_chivalry.3003.desc.1:0 "Eu chamo [Select_CString( bad_commander.IsFemale, 'a', 'o' )] [bad_commander.GetTitledFirstName] para um lado enquanto seus recrutas tentam continuar seu treinamento. 'A chave para treinar novos soldados é instilar disciplina!' Eu digo a [bad_commander.GetSheHe]. 'Sem isso, você não poderá contar com eles para seguir suas ordens...'"
 martial_chivalry.3003.desc.2:0 "\n\nDepois de terminar, [bad_commander.GetFirstName] me agradece antes de voltar para o campo, onde rapidamente assume o controle da situação."
 martial_chivalry.3003.t:0 "Conselho Aceito"
 martial_chivalry.3004.a:0 "Estou decepcionado com [Select_CString( bad_commander.IsFemale, 'a', 'o' )] [bad_commander.GetTitledFirstNameNoTooltip]."
 martial_chivalry.3004.b:0 "[bad_commander.GetTitledFirstNameNoTooltip] vai se arrepender dessa demonstração de impudência!"
 martial_chivalry.3004.desc:0 "Enquanto toco no ombro d[Select_CString( bad_commander.IsFemale, 'a', 'o' )] [bad_commander.GetTitledFirstName], [bad_commander.GetSheHe] levanta as mãos e grita 'Isso não é culpa minha, [ROOT.Char.GetFirstNameNoTooltip]! Esses camponeses idiotas não sabem nem a mão direita da esquerda! Como alguém pode esperar transformar essa ralé em um exército!?'"
 martial_chivalry.3004.t:0 "Conselho Rejeitado!"
 martial_chivalry.3005.a:0 "[my_liege.GetSheHe|U] tinha o direito de me repreender, mas não o fez."
 martial_chivalry.3005.desc:0 "Para meu alívio, [my_liege.GetFirstName] se aproxima de mim depois do exercício para me consolar e encorajar meus esforços."
 martial_chivalry.3005.t:0 "Consolo"
 martial_chivalry.4000.a:0 "Cercados, os ladrões entrarão em pânico."
 martial_chivalry.4000.angry:0 "Mas os ladrões devem ser detidos!"
 martial_chivalry.4000.b:0 "Eu vou golpear seu insolente líder até a morte!"
 martial_chivalry.4000.c:0 "Meu cavalo e eu somos um só pensamento: 'Não hoje à noite'."
 martial_chivalry.4000.desc:0 "A voz de um servo me tira dos meus sonhos.\n\n'Ladrões! Saqueadores!' [ROOT.Char.GetSheHe] grita. 'M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip], há jovens guerreiros levando suas manadas para a escuridão, conduzindo-as com força em direção às terras d[Select_CString( raiders.IsFemale, 'a', 'o' )] [raiders.GetTitledFirstName]!'\n\nAcordados, meus $knight_culture_player_plural_no_tooltip_lowercase$ pulam de suas camas e correm para suas selas. Eu me aproximo do meu cavalo, [ROOT.Char.Custom('signature_weapon')] em mãos.\n\nA hora está avançada e há uma longa distância a percorrer."
 martial_chivalry.4000.sleepy:0 "\n\nMeus pensamentos voltam para a cama macia e quente..."
 martial_chivalry.4000.t:0 "Uma Corrida à Meia-Noite"
 martial_chivalry.5000.a.failure:0 "[my_liege.GetFirstNameNoTooltip] continua desconfiad[Select_CString( my_liege.IsFemale, 'a', 'o' )] de você"
 martial_chivalry.5000.a.success:0 "Você convence [Select_CString( my_liege.IsFemale, 'a', 'o' )] [my_liege.GetFirstNameNoTooltip] de suas intenções honestas"
 martial_chivalry.5000.a:0 "Vou negar imediatamente essas acusações!"
 martial_chivalry.5000.b:0 "Falar sobre isso só traria mais atenção para o assunto."
 martial_chivalry.5000.c:0 "Preciso ir falar com [Select_CString( my_liege.IsFemale, 'a', 'o' )] [my_liege.GetTitledFirstNameNoTooltip] pessoalmente."
 martial_chivalry.5000.d.tt.warning:0 "@warning_icon! #X Termina qualquer intriga pessoal em andamento.#!"
 martial_chivalry.5000.d.tt:0 "A coisa mais galante que se pode fazer é perseguir um amor proibido."
 martial_chivalry.5000.d:0 "Bem, se eles tivessem visto como [spouse.GetSheHe] me olha..."
 martial_chivalry.5000.desc.fallback:0 "\n\nEu levanto uma sobrancelha - se fosse apenas isso, ele não pareceria tão preocupado."
 martial_chivalry.5000.desc.honest_chaste:0 "\n\nComo alguém poderia acreditar que eu me envolveria em tal comportamento vergonhoso?"
 martial_chivalry.5000.desc.lustful:0 "\n\nEmbora eu nunca admita, a verdade é que eles não estão muito longe de suas suspeitas..."
 martial_chivalry.5000.desc.outro:0 "\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], há rumores de que você está... #EMP envolvido#! com o cônjuge de [my_liege.GetShortUIName].\""
 martial_chivalry.5000.intro:0 "Não faz muito tempo depois que o sol se pôs que [spymaster.Custom2('MyCharacterIntroduction', ROOT.Char)] se aproxima de mim a caminho do meu quarto.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], sua galanteria é bem conhecida e admirada entre seus vassalos, mas tal comportamento cortês tende a atrair reações invejosas. Até mesmo agora, eles cochicham que você tem outras intenções, mais lascivas.\""
 martial_chivalry.5000.t:0 "Rumores Infundados"
 martial_chivalry.6000.a.tt:0 "Você pode encontrar algo dentro."
 martial_chivalry.6000.a:0 "Há poucas coisas tão tentadoras quanto uma [ROOT.Char.GetFaith.HouseOfWorship] inexplorada!"
 martial_chivalry.6000.b:0 "[bishop.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ficará feliz em saber dessa descoberta importante."
 martial_chivalry.6000.c:0 "Podemos simplesmente usar este lugar como um novo depósito."
 martial_chivalry.6000.desc:0 "As matas sempre foram um valioso campo de treinamento. Todos sabem que todo cavaleiro galante está sempre em busca de novas aventuras: um tirano maligno, um julgamento secreto, um inocente precisando de ajuda.\n\nEu nunca explorei essa parte da [church_province.GetTerrain.GetNameNoTooltip|l] antes; talvez seja isso que faça as ruínas repentinas parecerem um teste de valor.\n\nA igreja está abandonada há décadas, pelo que parece. Teias de aranha substituíram o vidro das janelas. Troncos quebrados são agora os novos bancos. Alguns pássaros voam quando me aproximo da porta podre."
 martial_chivalry.6000.t:0 "Para a [church_province.GetTerrain.GetNameNoTooltip]"
 martial_chivalry.6001.a:0 "Assim você termina, monstro!"
 martial_chivalry.6001.a_failure:0 "Você se machuca"
 martial_chivalry.6001.a_failure_toast:0 "A fera contra-ataca!"
 martial_chivalry.6001.a_success:0 "Você derrota a fera"
 martial_chivalry.6001.a_success_toast:0 "Uma vitória justa!"
 martial_chivalry.6001.b:0 "Vou apenas tentar sair sorrateiramente..."
 martial_chivalry.6001.b_failure:0 "O animal te atinge"
 martial_chivalry.6001.b_failure_toast:0 "A fera te nota"
 martial_chivalry.6001.b_success:0 "Você escapa do ataque"
 martial_chivalry.6001.b_success_toast:0 "Você foge com sucesso"
 martial_chivalry.6001.desc:0 "O altar está quase irreconhecível sob as camadas da natureza. Raízes e musgos se rebelam contra a pedra, impiedosos. Um sussurro suave de folhas ao lado dele parece tão reconfortante, enganador.\n\nAh! Se não é o som que eu pensei que estava ouvindo!\n\nAcontece que era, na verdade, o rosnado do(a) [ROOT.Char.Custom('GetAnimalType')], seus olhos famintos fixados em mim."
 martial_chivalry.6001.t:0 "Para a [church_province.GetTerrain.GetNameNoTooltip]: Um Monstro!"
 martial_chivalry.6002.a:0 "Vou valorizar esse presente sagrado."
 martial_chivalry.6002.b:0 "[bishop.Custom2('MyCharacterIntroduction', ROOT.Char)|U] apreciará esse presente."
 martial_chivalry.6002.book:0 "Isso parece a palestra perfeita para um cavaleiro!"
 martial_chivalry.6002.book_tt:0 "Você estuda o tomo e o coloca de volta em seu lugar sagrado."
 martial_chivalry.6002.c:0 "Essa idolatria falsa pertence ao fogo!"
 martial_chivalry.6002.desc:0 "Uma árvore cresceu logo atrás do altar. Sua copa substituiu as partes caídas do telhado. Ao lado dela, há um baú de madeira que alguém tem usado recentemente, a julgar pela falta de poeira ou mofo.\n\nDentro, um pequeno tesouro."
 martial_chivalry.6002.t:0 "Para a [church_province.GetTerrain.GetNameNoTooltip]: Um Tesouro!"
 martial_chivalry.6003.a:0 "Nunca abandonarei um inocente em perigo."
 martial_chivalry.6003.a_failure:0 "Você se perde na floresta"
 martial_chivalry.6003.a_success:0 "Você encontra o caminho de volta"
 martial_chivalry.6003.b:0 "O que [dummy_attracted_gender.GetSheHe] está fazendo aqui sozinh[Select_CString( dummy_attracted_gender.IsFemale, 'a', 'o' )]? Preciso sair antes de ser emboscad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]!"
 martial_chivalry.6003.c:0 "Um espírito! Uma aparição! Não fico aqui nem mais um segundo!"
 martial_chivalry.6003.d:0 "Bem, [dummy_attracted_gender.GetSheHe] pode apodrecer lá dentro."
 martial_chivalry.6003.d_tt:0 "Isso ensinará [dummy_attracted_gender.GetSheHe] a sempre ser cortês."
 martial_chivalry.6003.desc_intro:0 "A silhueta aparece tão abruptamente que é quase suspeita. Seu rosto reflete a luz do pôr do sol e consegue torná-la fria.\n\n"
 martial_chivalry.6003.desc_pretty:0 "\"Ah, nobre cavaleiro, você finalmente veio me resgatar? Será tão gentil de me levar de volta ao castelo?\"\n\nSua voz é tão reconfortante, seu gesto tão aliviado."
 martial_chivalry.6003.desc_ugly:0 "\"Ah... você... Eu estava esperando um #EMP cavaleiro galante#!...\"\n\n[dummy_attracted_gender.GetSheHe|U] cobre o nariz com um lenço branco.\n\n\"Mas acho que você serve. Você pode me levar de volta ao castelo?\""
 martial_chivalry.6003.t:0 "Para a [church_province.GetTerrain.GetNameNoTooltip]: Quem Está Aí...?"
 martial_chivalry.7000.a:0 "Tens a minha bênção, acende o fervor deles."
 martial_chivalry.7000.b:0 "Que as tuas palavras me protejam em vez disso."
 martial_chivalry.7000.c:0 "Vou liderá-los e mostrar-lhes que caminhamos com [ROOT.Char.GetFaith.HighGodName]!"
 martial_chivalry.7000.desc:0 "A trombeta de guerra soa, e tropas reúnem-se de todos os cantos do meu reino.\n\nAssim que me preparo para partir, [court_chaplain.GetCouncilTitle] [court_chaplain.GetFirstName] aproxima-se com olhos brilhantes. [court_chaplain.GetSheHe|U] trouxe alguns dos seguidores mais fiéis de [court_chaplain.GetHerHis] para apoiar nossa causa.\n\n\"[ROOT.Char.GetFaith.HighGodName] deu-me uma visão! Nossa causa é justa e prevaleceremos. Deixai-me pregar aos [ROOT.Char.Custom('GetFighterTermPlural')]!\""
 martial_chivalry.7000.t:0 "Uma Guerra Justa"
 martial_chivalry_special.1201.a.tt:0 "Praticar formações com seus [ROOT.Char.Custom('MountedWarriorTermPlural')] pode ajudar a melhorar sua expertise no [martial_lifestyle|E]."
 martial_chivalry_special.1201.a:0 "Hoje vamos sair para cavalgar no campo!"
 martial_chivalry_special.1201.b.tt:0 "\nExercitar-se até o anoitecer não vai melhorar seu domínio de táticas, mas certamente irá deixá-lo mais forte!"
 martial_chivalry_special.1201.b:0 "Tragam minha armadura. Faz tempo que não monto no quintain!"
 martial_chivalry_special.1201.desc:0 "O som de metal batendo e espadas se chocando ecoa em meus ouvidos enquanto meus [ROOT.Char.Custom('MountedWarriorTermPlural')] treinam suas armas. Eu os observo atentamente, tentando identificar as forças e fraquezas de cada um.\n\nEles têm pouco descanso, pois assim que o sino toca para sinalizar o fim do combate simulado, as portas do estábulo são abertas. É hora de trazer os montes."
 martial_chivalry_special.1201.t:0 "Treino de [ROOT.Char.Custom('MountedWarriorAdjective')|U]"
 martial_chivalry_special.1202.a:0 "Devo cortar diagonalmente e liderar os [ROOT.Char.Custom('MountedWarriorTermPlural')] pelos 'flancos'."
 martial_chivalry_special.1202.b:0 "#EMP Chaaarge!#!"
 martial_chivalry_special.1202.b_failure:0 "A carga é um desastre"
 martial_chivalry_special.1202.b_success:0 "A carga é bem executada"
 martial_chivalry_special.1202.desc:0 "[soldier.GetTitledFirstName] lança um olhar para os campos lamacentos no sopé do morro. 'Poderiam ser o esboço de um exército inimigo', diz [soldier.GetSheHe].\n\nInformo meus [ROOT.Char.Custom('MountedWarriorTermPlural')] enquanto inspeciono sua linha de batalha, preparando-os para a estratégia em mãos."
 martial_chivalry_special.1202.t:0 "Treino de [ROOT.Char.Custom('MountedWarriorAdjective')|U]: Uma Vista do Morro"
 martial_chivalry_special.1203.a:0 "Assim é como será a vitória avassaladora."
 martial_chivalry_special.1203.desc:0 "A tempestade de cascos ao meu redor, os gritos dos guerreiros montados, seu ímpeto implacável. Cavalgando à frente deles, parece que estou liderando uma força da natureza. No entanto, essa é uma força que dirijo, que responde a cada pequena ordem minha, que comando como se fosse uma extensão de mim mesmo.\n\nCarregando contra os flancos de um exército imaginário, meus [ROOT.Char.Custom('MountedWarriorTermPlural')] nunca se desviam do meu plano, e sei que é assim que causo devastação total ao meu inimigo."
 martial_chivalry_special.1203.t:0 "Treino de [ROOT.Char.Custom('MountedWarriorAdjective')|U]: Golpe Preciso"
 martial_chivalry_special.1204.a:0 "Vamos abater todos os homens que estiverem em nosso caminho!"
 martial_chivalry_special.1204.desc:0 "Empunho minha [ROOT.Char.Custom('SignatureWeaponAction')] minha [ROOT.Char.Custom('signature_weapon')], e lidero os cavaleiros em um disparo louco morro abaixo. No meio de todo o aparente caos de armaduras em movimento, armas erguidas e gritos de batalha, há um plano. Conforme avançamos contra o exército imaginário no campo abaixo, cada soldado encontra seu lugar em nossa formação, preparando golpes, recuando, girando as rédeas e saltando de volta para a refrega.\n\nVamos passar por cima de nossos inimigos como uma força da natureza, e eles se quebrarão como uma árvore diante da tempestade."
 martial_chivalry_special.1204.t:0 "Treino de [ROOT.Char.Custom('MountedWarriorAdjective')|U]: A Fúria das Feras"
 martial_chivalry_special.1601.a.tt:0 "O cavalo pode se tornar seu próprio corcel"
 martial_chivalry_special.1601.a:0 "Não sou uma pessoa que recua diante de um desafio!"
 martial_chivalry_special.1601.b:0 "Um corcel tão nobre renderá um bom preço."
 martial_chivalry_special.1601.c:0 "Meu mestre dos estábulos aprenderá muito ao domar [dummy_gender.GetSheHe]."
 martial_chivalry_special.1601.d.tt:0 "Seu $master_of_horse_court_position$ tentará domar o animal. Se tiverem sucesso, o cavalo se tornará seu próprio corcel."
 martial_chivalry_special.1601.d:0 "Não é [Select_CString( m_horse.IsFemale, 'a', 'o' )] [m_horse.GetTitledFirstNameNoTooltip] [Select_CString( m_horse.IsFemale, 'a', 'o' )] especialista em cavalos?"
 martial_chivalry_special.1601.desc:0 "Enquanto inspeciono os estábulos, meu olhar é atraído para um[Select_CString( dummy_gender.IsFemale, 'a', '' )] [dummy_gender.Custom('HorseMareStallion')] mantid[Select_CString( dummy_gender.IsFemale, 'a', 'o' )] separad[Select_CString( dummy_gender.IsFemale, 'a', 'o' )] dos outros. [dummy_gender.GetSheHe|U] sacode a cabeça e bate com os cascos, exibindo os poderosos posteriores e o pescoço arqueado. Esta criatura tem a melhor conformação e o pior temperamento.\n\nNunca vi um cavalo de guerra assim antes, mas o mestre dos estábulos insiste que é impossível treiná-l[Select_CString( dummy_gender.IsFemale, 'a', 'o' )]."
 martial_chivalry_special.1601.t:0 "Treinando um Cavalo de Guerra"
 martial_chivalry_special.1603.a.tt:0 "Provavelmente funcionará bem com uma alta habilidade em [prowess|E] ou uma personalidade destemida."
 martial_chivalry_special.1603.a:0 "Será preciso firmeza para domar essa fera!"
 martial_chivalry_special.1603.b.tt:0 "Provavelmente funcionará bem com uma alta habilidade em [diplomacy|E] ou uma personalidade benevolente."
 martial_chivalry_special.1603.b:0 "Se eu for gentil e me mover devagar, [dummy_gender.GetSheHe] confiará em mim."
 martial_chivalry_special.1603.c.tt:0 "Provavelmente funcionará bem com uma alta habilidade em [intrigue|E] ou uma personalidade generosa."
 martial_chivalry_special.1603.c:0 "Todo mundo tem seu preço - tragam as maçãs!"
 martial_chivalry_special.1603.desc:0 "O cavalo prende as orelhas ao me aproximar, seu desrespeito por mim fica claro. Esse primeiro encontro é importante para conquistar sua confiança e respeito, e preciso decidir como abordar a situação."
 martial_chivalry_special.1604.a:0 "Mantive [dummy_gender.GetSheHe] como meu cavalo de guerra pessoal!"
 martial_chivalry_special.1604.a_2:0 "Isso foi gratificante! Farei isso novamente."
 martial_chivalry_special.1604.b:0 "Pelo menos aprendi o que #EMP não#! fazer..."
 martial_chivalry_special.1604.c:0 "[Select_CString( ROOT.Char.IsFemale, 'Minha senhora', 'Meu senhor' )] ficará feliz."
 martial_chivalry_special.1604.desc_failure:0 "Não importa o que eu tente, o cavalo se recusa a ouvir. Minhas tentativas deixam tanto [dummy_gender.GetSheHe] quanto eu suados e irritados, e ao sair dos estábulos tarde da noite, sei que não voltarei tão cedo."
 martial_chivalry_special.1604.desc_success:0 "É uma sensação poderosa; o cavalo poderoso segue meu comando. Agora que conquistei sua confiança, ele parece até mesmo gostar de mim."
 martial_chivalry_special.1604.failure:0 "Seu $master_of_horse_court_position$ falhou em domar o cavalo."
 martial_chivalry_special.1604.succcess:0 "Seu $master_of_horse_court_position$ domesticou seu cavalo temperamentoso!"
 martial_chivalry_special.1604.success:0 "Seu $master_of_horse_court_position$ domou seu cavalo temperamentoso!"
 martial_chivalry_special.1604.t.2:0 "Cavalo Não Domado"
 martial_chivalry_special.1604.t:0 "Cavalo Domado"
 martial_chivalry_special.4000.a.tt:0 "Você lidera seus cavaleiros em uma perseguição e cerco aos ladrões."
 martial_chivalry_special.4000.a.tt_failure:0 "Os ladrões resistem a você"
 martial_chivalry_special.4000.a.tt_failure_2:0 "Você ou um de seus $knight_culture_player_plural_no_tooltip$ fica ferido"
 martial_chivalry_special.4000.a.tt_success:0 "Seu contra-ataque funciona perfeitamente"
 martial_chivalry_special.4000.b.tt:0 "Ninguém consegue cavalgar ou lutar como [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitledFirstNameNoTooltip]!"
 martial_chivalry_special.4000.b.tt_critical_failure:0 "Você é derrubado da sela... e pisoteado"
 martial_chivalry_special.4000.b.tt_critical_failure_2:0 "Você fica gravemente ferido"
 martial_chivalry_special.4000.b.tt_failure:0 "O garoto ladrão te humilha"
 martial_chivalry_special.4000.b.tt_success:0 "Você derrama sangue pela sua criação"
 martial_chivalry_special.4000.c.tt:0 "Você alcançará #EMP alguns#! desses ladrões, com certeza. Depois de uma boa noite de sono."
