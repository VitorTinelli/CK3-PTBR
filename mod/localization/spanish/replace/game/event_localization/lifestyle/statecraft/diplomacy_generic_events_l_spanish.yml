l_spanish:
 diplomacy_generic.0012.a:0 "Eu vou ignorar [disobedient_subject.GetSheHe] e roubar as ideias [disobedient_subject.GetHerHim]."
 diplomacy_generic.0012.b:0 "Zombar de [disobedient_subject.Custom2('PointOfRidicule', ROOT.Char)] vai calar [disobedient_subject.GetSheHe]."
 diplomacy_generic.0012.bad_outcome.desc:0 "[disobedient_subject.GetTitledFirstNameNoTooltip] não é enganad[Select_CString( disobedient_subject.IsFemale, 'a', 'o' )]"
 diplomacy_generic.0012.c:0 "\"Esquecer\" de convidar [disobedient_subject.GetSheHe] deixa [disobedient_subject.GetSheHe] no escuro."
 diplomacy_generic.0012.council.desc:0 "à mesa."
 diplomacy_generic.0012.d:0 "[disobedient_subject.GetSheHe|U] terá tarefas impossíveis de serem concluídas."
 diplomacy_generic.0012.e:0 "Todos os problemas serão atribuídos a [disobedient_subject.GetSheHe]."
 diplomacy_generic.0012.end.desc:0 "\n\n[disobedient_subject.GetSheHe|U] está testando meus limites. Os outros certamente irão seguir — a menos que eu dê a [disobedient_subject.GetSheHe] um pouco do seu próprio veneno..."
 diplomacy_generic.0012.f:0 "Comentar sobre o [disobedient_subject.Custom('ObjectifiedFeature')] [disobedient_subject.GetHerHim] vai desconcertá-l[Select_CString( disobedient_subject.IsFemale, 'a', 'o' )]."
 diplomacy_generic.0012.failure.desc:0 "Você não conseguiu manipular [Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] [disobedient_subject.GetTitledFirstName]"
 diplomacy_generic.0012.g:0 "Uma ameaça \"sutil\" de violência vai acabar com isso."
 diplomacy_generic.0012.good_outcome.desc:0 "Você manipula [Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] [disobedient_subject.GetTitledFirstNameNoTooltip]"
 diplomacy_generic.0012.h:0 "\"Como você ousa desafiar s[Select_CString( ROOT.Char.IsFemale, 'ua', 'eu' )] #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#?!\""
 diplomacy_generic.0012.start.desc:0 "Da primeira vez que aconteceu, mal dei importância, mas [disobedient_subject.Custom2('MyCharacterIntroduction', ROOT.Char)] ficou mais ousado. Seus desafios não passam mais despercebidos"
 diplomacy_generic.0012.t:0 "Manipulação Social"
 diplomacy_generic.0012.terrible_outcome.desc:0 "[disobedient_subject.GetTitledFirstNameNoTooltip] te engana"
 diplomacy_generic.0012.tt:0 "Não muito diplomático, mas eficaz mesmo assim..."
 diplomacy_generic.0012.vassal.desc:0 "entre meus vassalos."
 diplomacy_generic.0013.a.failure.tt:0 "Você é manipulad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [Select_CString( suppressor.IsFemale, 'pela', 'pelo' )] [suppressor.GetTitledFirstNameNoTooltip]"
 diplomacy_generic.0013.a.success.tt:0 "Você manipula com sucesso [Select_CString( suppressor.IsFemale, 'a', 'o' )] [suppressor.GetTitledFirstNameNoTooltip]"
 diplomacy_generic.0013.a:0 "Dois podem jogar esse jogo."
 diplomacy_generic.0013.b:0 "Talvez eu mereça esse tratamento..."
 diplomacy_generic.0013.impossible_task.desc:0 "M[Select_CString( suppressor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('suppressor'))], [suppressor.GetTitledFirstName], continua me dando tarefas impossíveis de serem concluídas a tempo! Quando tento fazê-las de forma minuciosa, sou preguiçoso, e quando me apresso, [suppressor.GetSheHe] acha que sou descuidado."
 diplomacy_generic.0013.make_invisible.desc:0 "Parece que m[Select_CString( suppressor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('suppressor'))] [suppressor.GetTitledFirstName] perdeu interesse na minha opinião. Quando eu falo, [suppressor.GetSheHe] me interrompe ou desvia sua atenção para outra coisa. Mas às vezes, parece que [suppressor.GetSheHe] está ouvindo, pois [suppressor.GetSheHe] repete minhas ideias e as reivindica como suas próprias..."
 diplomacy_generic.0013.objectification.desc:0 "Quando m[Select_CString( suppressor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('suppressor'))] convoca uma reunião, sinto um aperto no estômago. Nas últimas semanas, houve mais de um comentário sobre meu '[disobedient_subject.Custom('ObjectifiedFeature')]', e quando falo, [suppressor.GetSheHe] passa mais tempo olhando do que ouvindo. Por que [Select_CString( suppressor.IsFemale, 'a', 'o' )] [suppressor.GetTitledFirstName] se preocupa mais com meu corpo físico do que com o que faço e digo?"
 diplomacy_generic.0013.ridicule.desc:0 "O que devo fazer para ser levado a sério [Select_CString( suppressor.IsFemale, 'pela minha', 'pelo meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('suppressor'))]? Sempre que eu falo, [suppressor.GetTitledFirstName] me interrompe para zombar das minhas ideias ou do meu \"[disobedient_subject.Custom2('PointOfRidicule', SCOPE.sC('suppressor'))].\""
 diplomacy_generic.0013.shame.desc:0 "Sempre que há um problema, [suppressor.GetTitledFirstName] parece pensar que eu sou o culpad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. No entanto, quando sou eu quem levanta questões, [suppressor.GetSheHe] me acusa de focar nas coisas erradas!"
 diplomacy_generic.0013.t:0 "Marionete"
 diplomacy_generic.0013.threat.desc:0 "Ultimamente, tenho notado um olhar estranho no rosto d[Select_CString( suppressor.IsFemale, 'a', 'o' )] [suppressor.GetTitledFirstName] quando falo, uma combinação de exasperação e raiva. No entanto, só hoje descobri que algo estava errado. Quando discordei [suppressor.GetHerHim] em uma reunião, [suppressor.GetSheHe] ameaçou me punir!"
 diplomacy_generic.0013.withhold_information.desc:0 "Ultimamente, todos parecem estar a par de tudo, exceto eu! Eu pareço [Select_CString( ROOT.Char.IsFemale, 'uma tola', 'um tolo' )] quando tenho que pedir constantemente [Select_CString( suppressor.IsFemale, 'a', 'ao' )] [suppressor.GetTitledFirstName] por esclarecimentos em reuniões ou quando baseio minhas sugestões em informações antigas. Receio que [Select_CString( suppressor.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('suppressor'))] esteja deliberadamente escondendo coisas de mim."
 diplomacy_generic.0014.a.compassionate:0 "Cruel, talvez, mas foi necessário."
 diplomacy_generic.0014.a.cruel:0 "[disobedient_subject.GetSheHe|U] vai pensar duas vezes antes de me desafiar novamente!"
 diplomacy_generic.0014.end.desc:0 "Agora [disobedient_subject.GetSheHe] permanece quieta, olhos baixos."
 diplomacy_generic.0014.impossible_task.desc:0 "Quando [Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] [disobedient_subject.GetTitledFirstName] tentou concluir suas tarefas minuciosamente, repreendi [disobedient_subject.GetSheHe] na frente de todos, e quando [disobedient_subject.GetSheHe] se apressou para terminar a tempo, mostrei ao público seu trabalho negligente. [disobedient_subject.GetSheHe|U] se esforçou ao máximo para me agradar, mas nunca reconheci os esforços [disobedient_subject.GetHerHim]."
 diplomacy_generic.0014.make_invisible.desc:0 "Sempre que [Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] [disobedient_subject.GetTitledFirstName] levanta a voz para falar, eu bocejo, desvio minha atenção para outro lugar ou interrompo [disobedient_subject.GetSheHe] diretamente. Conforme os outros começaram a seguir meu exemplo, [disobedient_subject.GetTitledFirstNameNoTooltip] ficou mais hesitante."
 diplomacy_generic.0014.objectification.desc:0 "Piadas obscenas, olhares insinuantes, interromper [disobedient_subject.GetSheHe] para \"elogiar\" o [disobedient_subject.Custom('ObjectifiedFeature')] [disobedient_subject.GetHerHim]. Aos poucos, consegui abalar [Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] [disobedient_subject.GetTitledFirstName], deixando [disobedient_subject.GetSheHe] tens[Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] e autoconsciente."
 diplomacy_generic.0014.ridicule.desc:0 "Meus comentários irônicos constantes sobre o '[disobedient_subject.Custom2('PointOfRidicule', ROOT.Char)]' d[Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] [disobedient_subject.GetTitledFirstName] realmente parecem ter afetado [disobedient_subject.GetSheHe]! Desde que os outros começaram a seguir meu exemplo, [disobedient_subject.GetTitledFirstNameNoTooltip] ficou mais e mais hesitante."
 diplomacy_generic.0014.shame.desc:0 "A questão que [Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] [disobedient_subject.GetTitledFirstName] trouxe costumava me prejudicar, mas agora as mesas se viraram. Toda vez que [disobedient_subject.GetSheHe] levanta um assunto de preocupação, eu habilmente transfiro a culpa de volta para [disobedient_subject.GetSheHe] ou faço [disobedient_subject.GetSheHe] parecer mesquinha por sequer trazer o assunto à tona."
 diplomacy_generic.0014.t:0 "$diplomacy_generic.0012.t$: Mestre da Supressão"
 diplomacy_generic.0014.threat.desc:0 "Às vezes, uma simples ameaça de violência resolve tudo."
 diplomacy_generic.0014.withhold_information.desc:0 "Desde que comecei a ocultar informações d[Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] [disobedient_subject.GetTitledFirstName], [disobedient_subject.GetSheHe] tem passado vergonha em várias ocasiões. Descartar as sugestões ultrapassadas [disobedient_subject.GetHerHim] tem sido mais fácil do que enganar um cachorro."
 diplomacy_generic.0015.a:0 "Dessa vez, você vence, [disobedient_subject.GetFirstNameNoTooltip]."
 diplomacy_generic.0015.impossible_task.desc:0 "Para minha grande surpresa, [disobedient_subject.GetTitledFirstName] conseguiu convencer um dos outros a ajudar [disobedient_subject.GetSheHe] com a tarefa que eu tinha atribuído a [disobedient_subject.GetSheHe]. Como mal tiveram tempo para terminar adequadamente juntos, ficou evidente que eu tinha pedido demais. Eu nem poderia reclamar sobre a execução."
 diplomacy_generic.0015.make_invisible.desc:0 "Quando [Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] [disobedient_subject.GetTitledFirstName] levanta a voz para falar, eu bocejo e volto minha atenção para meus papéis. Eu esperava que os outros seguissem meu exemplo, mas, em vez disso, eles se envolveram na conversa. Quando finalmente engoli meu orgulho para participar, [disobedient_subject.GetFirstName] já tinha a vantagem e minhas palavras foram rapidamente esquecidas."
 diplomacy_generic.0015.objectification.desc:0 "Eu pensei que meus comentários obscenos calariam [Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] [disobedient_subject.GetTitledFirstName], mas a resposta [disobedient_subject.GetHerHim] foi digna, porém pontual. Agora, os outros pensam que [disobedient_subject.GetSheHe] é uma espécie de santo, enquanto eu pareço trivial e imoral em comparação."
 diplomacy_generic.0015.ridicule.desc:0 "Parece que o humor d[Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] [disobedient_subject.GetTitledFirstName] é muito mais afiado do que eu esperava. Ao comentar sobre o '[disobedient_subject.Custom2('PointOfRidicule', ROOT.Char)]' [disobedient_subject.GetHerHim], [disobedient_subject.GetSheHe] imediatamente mudou a situação e me fez parecer mesquinho por responder a um problema genuíno com um comentário irônico."
 diplomacy_generic.0015.shame.desc:0 "Transferir a culpa para [Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] [disobedient_subject.GetTitledFirstName] acabou sendo mais difícil do que eu imaginava. Sim, posso ser convincente, mas descobri que [disobedient_subject.GetSheHe] é ainda mais habilidos[Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] nesse jogo do que eu. Com uma única frase, [disobedient_subject.GetSheHe] desmontou minha explicação, me fazendo parecer estúpid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ou não confiável. Não tenho certeza do que é pior."
 diplomacy_generic.0015.t:0 "$diplomacy_generic.0012.t$: De Manipulador a Manipulado"
 diplomacy_generic.0015.threat.desc:0 "Eu pensei que minhas ameaças calariam [Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] [disobedient_subject.GetTitledFirstName], mas [disobedient_subject.GetSheHe] simplesmente as ignorou e continuou. A total falta de medo [disobedient_subject.GetHerHim|U] fez com que minhas palavras parecessem triviais, em vez de intimidadoras."
 diplomacy_generic.0015.withhold_information.desc:0 "Embora eu regularmente tenha \"esquecido\" de enviar mensagens para [Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] [disobedient_subject.GetTitledFirstName] ou convidar [disobedient_subject.GetSheHe] para reuniões, [disobedient_subject.GetSheHe] sempre parece estar a par das coisas. Agora, em comparação, pareço confus[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] e incompetente!"
 diplomacy_lifestyle_rank_up_indication:0 "Eu posso obter um [perk|E] no [diplomacy_lifestyle|E]"
 impossible_task_option.tt:0 "Você supõe que [Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] [disobedient_subject.GetFirstName] faria de tudo em seu poder para concluir a tarefa"
 make_invisible_option.tt:0 "Você supõe que [Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] [disobedient_subject.GetFirstName] é insegur[Select_CString( disobedient_subject.IsFemale, 'a', 'o' )], letárgic[Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] ou sem ambição"
 objectification_option.tt:0 "Você supõe que [Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] [disobedient_subject.GetFirstName] frequentemente tenha sido objetificad[Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] devido à sua aparência"
 ridicule_option.tt:0 "Você supõe que [Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] [disobedient_subject.GetFirstName] é autoconsciente e se importa com o que os outros pensam"
 shame_option.tt:0 "Você supõe que [Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] [disobedient_subject.GetFirstName] é consciente ou pelo menos quer que as pessoas pensem bem [disobedient_subject.GetHerHim]"
 threat_option.tt:0 "Você supõe que [Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] [disobedient_subject.GetFirstName] seja covarde ou queira manter a paz"
 withhold_information_option.tt:0 "Você supõe que [Select_CString( disobedient_subject.IsFemale, 'a', 'o' )] [disobedient_subject.GetFirstName] é de mente fraca ou não compartilha muito sobre [disobedient_subject.GetHerselfHimself]"
