l_spanish:
 diplomacy_foreign.0100.desc:0 "Acredito que seria do interesse de nossos reinos marcar um encontro entre nossos herdeiros, [main_heir.GetTitledFirstName] e [Select_CString( other_heir.IsFemale, 'a', 'o' )] [other_heir.GetTitledFirstName]. Garantir que eles construam um relacionamento estável e saudável agora certamente garantirá a estabilidade futura de nossas terras."
 diplomacy_foreign.0100.opening:0 "[other_ruler.Custom2('AppropriateGreeting', ROOT.Char)]"
 diplomacy_foreign.1074.a:0 "Não podemos permitir que [heretic_ruler.GetSheHe] oprima os fiéis!"
 diplomacy_foreign.1074.b:0 "Contrabandeie o máximo de [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] que pudermos para a segurança."
 diplomacy_foreign.1074.c.failure:0 "[heretic_ruler.GetFirstName] está desconfiad[Select_CString( heretic_ruler.IsFemale, 'a', 'o' )] das intenções do meu enviado"
 diplomacy_foreign.1074.c.success:0 "[heretic_ruler.GetFirstName] recebe meu enviado de braços abertos"
 diplomacy_foreign.1074.c:0 "Envie um enviado [Select_CString( heretic_ruler.IsFemale, 'a', 'ao' )] [heretic_ruler.GetFirstNameNoTooltip] para discutir o tratamento deles."
 diplomacy_foreign.1074.desc:0 "[heretic_ruler.GetTitledFirstName] governa o condado vizinho de [target_county.GetName], que abriga um grande número de devotos [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]. [Select_CString( heretic_ruler.IsFemale, 'A', 'O' )] [heretic_ruler.GetTitleAsName] [heretic_ruler.GetFaith.GetAdherentName] poderia facilmente perseguir os fiéis [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] que vivem lá, e é minha responsabilidade protegê-los da influência [ROOT.GetCharacter.Custom2('ToleranceValue', SCOPE.sC('heretic_ruler'))] [heretic_ruler.GetHerHim]."
 diplomacy_foreign.1074.t:0 "Refugiados Religiosos"
 diplomacy_foreign.1100.a:0 "Que ideia encantadora!"
 diplomacy_foreign.1100.b:0 "Talvez devêssemos nos conhecer melhor."
 diplomacy_foreign.1100.t:0 "Amizade Florescente"
 diplomacy_foreign.1101.a.tooltip:0 "Ser o anfitrião permitirá que você influencie o encontro"
 diplomacy_foreign.1101.a:0 "[other_heir.GetFirstNameNoTooltip] deve vir a [scoped_capital.GetNameNoTooltip]."
 diplomacy_foreign.1101.b.tooltip:0 "Você #N não#! poderá influenciar o encontro"
 diplomacy_foreign.1101.b:0 "[main_heir.GetTitledFirstNameNoTooltip] visitará a corte d[Select_CString( other_ruler.IsFemale, 'a', 'o' )] [other_ruler.GetTitledFirstNameNoTooltip]."
 diplomacy_foreign.1101.court_visit.poorly:0 "A visita à corte está progredindo #N muito mal#!"
 diplomacy_foreign.1101.court_visit.very_well:0 "A visita à corte está progredindo #P muito bem#!"
 diplomacy_foreign.1101.court_visit.well:0 "A visita à corte está progredindo #P bem#!"
 diplomacy_foreign.1101.desc:0 "O encontro marcado entre [Select_CString( other_heir.IsFemale, 'a', 'o' )] [other_heir.GetFirstName] e [Select_CString( main_heir.IsFemale, 'a', 'o' )] [main_heir.GetFirstName] é a oportunidade perfeita para estabelecer as bases de um relacionamento duradouro entre meu reino e [Select_CString( other_ruler.IsFemale, 'a', 'o' )] [other_ruler.GetTitledFirstName].\n\nDevo ter muito cuidado ao planejar o encontro."
 diplomacy_foreign.1102.a.duel_failure:0 "Minha presença atrapalha o encontro entre os jovens herdeiros"
 diplomacy_foreign.1102.a.duel_success:0 "[other_heir.GetTitledFirstNameNoTooltip] fica impressionad[Select_CString( other_heir.IsFemale, 'a', 'o' )] com minha hospitalidade"
 diplomacy_foreign.1102.a:0 "Certamente ajudarei m[Select_CString( main_heir.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('main_heir') )]."
 diplomacy_foreign.1102.b:0 "Vou agradar [Select_CString( other_heir.IsFemale, 'a', 'o' )] [other_heir.GetFirstNameNoTooltip] com presentes luxuosos!"
 diplomacy_foreign.1102.c.tooltip.high:0 "[main_heir.GetTitledFirstName] se sairá #P muito bem#!"
 diplomacy_foreign.1102.c.tooltip.low:0 "[main_heir.GetTitledFirstName] se sairá #N muito mal#!"
 diplomacy_foreign.1102.c.tooltip.medium:0 "[main_heir.GetTitledFirstName] se sairá #P adequadamente#!"
 diplomacy_foreign.1102.c:0 "Confio [Select_CString( main_heir.IsFemale, 'na', 'no' )] [main_heir.GetFirstNameNoTooltip] para lidar com [main_heir.GetHerselfHimself]."
 diplomacy_foreign.1102.desc:0 "[other_heir.GetTitledFirstName] é recebid[Select_CString( other_heir.IsFemale, 'a', 'o' )] com toda pompa e circunstância adequada para um[Select_CString( other_heir.IsFemale, 'a', '' )] convidad[Select_CString( other_heir.IsFemale, 'a', 'o' )] tão distint[Select_CString( other_heir.IsFemale, 'a', 'o' )]. [other_heir.GetSheHe|U] permanecerá na [scoped_capital.GetNameNoTooltip] por algumas semanas, durante as quais [other_heir.GetSheHe] e [Select_CString( main_heir.IsFemale, 'a', 'o' )] [main_heir.GetFirstName] terão a oportunidade de se conhecer melhor."
 diplomacy_foreign.1103.a:0 "Melhor agir enquanto o ferro está quente!"
 diplomacy_foreign.1103.b:0 "Deveríamos tentar novamente algum dia..."
 diplomacy_foreign.1103.culture_conversion.desc:0 "Parece que, durante a estadia aqui, [Select_CString( other_heir.IsFemale, 'a', 'o' )] [other_heir.GetWomanMan] jovem se encantou com nossa cultura e decidiu adotar vários costumes da minha corte."
 diplomacy_foreign.1103.empty.desc:0 ""
 diplomacy_foreign.1103.faith_conversion.desc:0 "Fiquei feliz em saber que, durante a estadia [other_heir.GetHerHim] aqui, [Select_CString( other_heir.IsFemale, 'a', 'o' )] [other_heir.GetWomanMan] jovem decidiu abraçar o [main_heir.GetFaith.GetName] e abandonar sua antiga fé."
 diplomacy_foreign.1103.friendship.desc:0 "\n\nAs coisas entre [other_heir.GetSheHe] e [Select_CString( main_heir.IsFemale, 'a', 'o' )] [main_heir.GetFirstName] foram ainda melhores do que o esperado: os dois se tornaram inseparáveis."
 diplomacy_foreign.1103.good_exp.desc:0 "\n\nAlém disso, essa visita se mostrou uma excelente oportunidade para aprimorar minhas habilidades diplomáticas."
 diplomacy_foreign.1103.love.desc:0 "\n\nAs coisas entre [other_heir.GetSheHe] e [Select_CString( main_heir.IsFemale, 'a', 'o' )] [main_heir.GetFirstName] foram ainda melhores do que o esperado: está claro que os dois se apaixonaram."
 diplomacy_foreign.1103.no_exp.desc:0 "\n\nO que é verdadeiramente irritante em toda essa situação é que eu nem sequer fui capaz de aprender muito com isso."
 diplomacy_foreign.1103.opinion_gain.desc:0 "\n\nAs coisas entre [other_heir.GetSheHe] e [Select_CString( main_heir.IsFemale, 'a', 'o' )] [main_heir.GetFirstName] foram tão boas quanto [Select_CString( other_ruler.IsFemale, 'a', 'o' )] [other_ruler.GetTitledFirstName] e eu esperávamos, e os dois jovens herdeiros, esperançosamente, se tornarão bons amigos com o tempo."
 diplomacy_foreign.1103.opinion_loss.desc:0 "\n\nInfelizmente, as coisas não saíram como planejado: [other_heir.GetFirstNameNoTooltip] e [Select_CString( main_heir.IsFemale, 'a', 'o' )] [main_heir.GetFirstName] parecem não ter muito em comum, afinal..."
 diplomacy_foreign.1103.present.desc:0 "Antes de partir, [Select_CString( other_heir.IsFemale, 'a', 'o' )] [other_heir.GetWomanMan] jovem decidiu nos honrar com um presente requintado em nome [Select_CString( other_ruler.IsFemale, 'da sua', 'do seu' )] [other_heir.Custom2('RelationToMe' , SCOPE.sC('other_ruler') )]."
 diplomacy_foreign.1103.prestige.desc:0 "[other_heir.GetSheHe|U] ficou impressionad[Select_CString( other_heir.IsFemale, 'a', 'o' )] com nossa hospitalidade e prometeu espalhar a reputação de minha corte para longe e para todos."
 diplomacy_foreign.1103.rivalry.desc:0 "\n\nInfelizmente, as coisas não saíram como planejado: [other_heir.GetFirstNameNoTooltip] e [Select_CString( main_heir.IsFemale, 'a', 'o' )] [main_heir.GetFirstName] simplesmente não conseguem se suportar."
 diplomacy_foreign.1103.start.desc:0 "Chegou finalmente a hora d[Select_CString( other_heir.IsFemale, 'a', 'o' )] [other_heir.GetTitledFirstName] retornar ao seu lar."
 diplomacy_foreign.1103.tainted_exp.desc:0 "\n\nPelo menos, essa experiência me ajudou a aprofundar minha compreensão da política."
 diplomacy_foreign.1104.culture_conversion.desc:0 "\n\nDurante sua curta estadia, [main_heir.GetSheHe] parece ter gostado muito dos costumes de seus anfitriões."
 diplomacy_foreign.1104.faith_conversion.desc:0 "\n\nParece que, durante sua visita, [main_heir.GetSheHe] encontrou um novo propósito na adoração a [other_heir.GetFaith.HighGodName]."
 diplomacy_foreign.1104.present.desc:0 "\n\nDe acordo com sua ilustre posição, [main_heir.GetSheHe] foi presenteado com presentes luxuosos durante sua estadia."
 diplomacy_foreign.1104.prestige.desc:0 "\n\nDe acordo com sua ilustre posição, [main_heir.GetSheHe] foi tratado com generosidade por seu anfitrião, que elogiou publicamente nossa família em várias ocasiões durante a estadia d[Select_CString( main_heir.IsFemale, 'a', 'o' )] [main_heir.GetFirstNameNoTooltip]."
 diplomacy_foreign.1104.start.desc:0 "[main_heir.GetFirstName] finalmente retornou após sua visita à corte d[Select_CString( other_ruler.IsFemale, 'a', 'o' )] [other_ruler.GetTitledFirstName]."
 diplomacy_foreign.1105.a:0 "Que tragédia..."
 diplomacy_foreign.1105.fallback.desc:0 "Parece que o destino conspirou para impedir o encontro entre [Select_CString( main_heir.IsFemale, 'a', 'o' )] [main_heir.GetFirstName] e [Select_CString( other_heir.IsFemale, 'a', 'o' )] [other_heir.GetFirstName]. Talvez uma nova oportunidade se apresente no futuro."
 diplomacy_foreign.1105.guestdead.desc:0 "Infelizmente, meu plano e d[Select_CString( other_ruler.IsFemale, 'a', 'o' )] [other_ruler.GetTitledFirstName] foi interrompido pelo repentino falecimento d[Select_CString( other_heir.IsFemale, 'a', 'o' )] [other_heir.GetFirstName]."
 diplomacy_foreign.1105.hostdead.desc:0 "Com o triste falecimento d[Select_CString( other_ruler.IsFemale, 'a', 'o' )] [other_ruler.GetTitledFirstName], nosso plano de fazer com que nossos filhos se conheçam e garantir uma relação amigável entre nossos reinos vai por água abaixo."
 diplomacy_foreign.1150.a:0 "A solução é simples..."
 diplomacy_foreign.1150.b:0 "Certamente podemos encontrar um acordo?"
 diplomacy_foreign.1150.c:0 "Espadas, não palavras, resolverão essa disputa."
 diplomacy_foreign.1150.desc:0 "Há algum tempo, tenho refletido sobre as discrepâncias entre as fronteiras históricas e atuais do reino d[Select_CString( neighbor.IsFemale, 'a', 'o' )] [neighbor.GetTitledFirstName] e o meu.\n\n[neighbor.GetSheHe|U] governa [county.GetName], uma terra que deveria pertencer legitimamente ao [ruler.GetPrimaryTitle.GetNameNoTierNoTooltip], enquanto eu atualmente controlo [neighbor_county.GetName], que [Select_CString( neighbor.IsFemale, 'a', 'o' )] [neighbor.GetTitledFirstNameNoTooltip] reivindica como seu."
 diplomacy_foreign.1150.t:0 "Ajeitando Fronteiras"
 diplomacy_foreign.1151.a:0 "Pode-se esperar."
 diplomacy_foreign.1151.desc:0 "Graças ao meu aguçado senso diplomático, consegui convencer [Select_CString( neighbor.IsFemale, 'a', 'o' )] [neighbor.GetTitledFirstName] a abrir mão de [county.GetNameNoTier] em troca de [neighbor_county.GetNameNoTier]. Esperançosamente, esse ato evitará derramamento de sangue desnecessário entre nossos reinos no futuro."
 diplomacy_foreign.1152.a:0 "O conflito pode ser inevitável."
 diplomacy_foreign.1152.desc:0 "Infelizmente, não consegui persuadir [Select_CString( neighbor.IsFemale, 'a', 'o' )] [neighbor.GetTitledFirstName] a abrir mão de [county.GetNameNoTier] em troca de [neighbor_county.GetNameNoTier]. Só posso esperar que a obstinação [neighbor.GetHerHim] não conduza nossos reinos por um caminho sombrio."
 diplomacy_foreign.1153.a:0 "Uma proposta justa."
 diplomacy_foreign.1153.b:0 "Não vou abrir mão do que é meu!"
 diplomacy_foreign.1153.desc:0 "[ruler.GetTitledFirstName] me apresentou hoje uma proposta peculiar.\n\n[ruler.GetSheHe|U] afirma que [ruler.GetSheHe] está pronto para abrir mão do controle [ruler.GetHerHim] sobre [neighbor_county.GetNameNoTier], uma província sobre a qual meu reino possui antigas reivindicações, em troca de [county.GetName], sobre o qual seus antepassados supostamente possuíam domínio."
 diplomacy_foreign.1160.a.failure:0 "[neighbor.GetTitledFirstName] recusa minha proposta"
 diplomacy_foreign.1160.a.success:0 "Convenço [Select_CString( neighbor.IsFemale, 'a', 'o' )] [neighbor.GetTitledFirstName]"
 diplomacy_foreign.1200.a.a:0 "Nada me agradaria mais."
 diplomacy_foreign.1200.a.b:0 "Você me honra, [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('diplomacy_friend') )]."
 diplomacy_foreign.1200.a.c:0 "Guardarei sua gentileza em memória."
 diplomacy_foreign.1200.b.failure:0 "Não consigo impressionar [Select_CString( neighbor_ruler.IsFemale, 'a', 'o' )] [neighbor_ruler.GetTitledFirstName]"
 diplomacy_foreign.1200.b.success:0 "Meus esforços diplomáticos dão frutos"
 diplomacy_foreign.1200.b:0 "Acredito que posso lidar com [Select_CString( neighbor_ruler.IsFemale, 'a', 'o' )] [neighbor_ruler.GetTitledFirstNameNoTooltip]."
 diplomacy_foreign.1200.c:0 "[neighbor_ruler.GetTitledFirstNameNoTooltip] não vale o esforço..."
 diplomacy_foreign.1200.fallback.desc:0 "[diplomacy_friend.GetTitledFirstName] tem sido de grande ajuda nos últimos dias, me auxiliando em meus esforços para fortalecer os laços do reino com nossos vizinhos. [diplomacy_friend.GetSheHe|U] acabou de oferecer [diplomacy_friend.GetHerselfHimself] novamente para me ajudar a conquistar a confiança d[Select_CString( neighbor_ruler.IsFemale, 'a', 'o' )] [neighbor_ruler.GetTitledFirstName]. \n\nÉ tão difícil encontrar alguém em quem se possa realmente confiar nos dias de hoje..."
 diplomacy_foreign.1200.relative.desc:0 "\"Ouvi dizer que você está se concentrando em melhorar o status do reino com seus vizinhos, [diplomacy_friend.Custom2('RelationToMe' , ROOT.GetCharacter )].\" \n\n[diplomacy_friend.GetFirstName] se aproxima de mim de forma amigável. \"Eu sempre tive interesse nessas questões e ficaria feliz em oferecer minha ajuda para conquistar a confiança d[Select_CString( neighbor_ruler.IsFemale, 'a', 'o' )] [neighbor_ruler.GetTitledFirstName]. Afinal, somos família.\""
 diplomacy_foreign.1200.spouse.desc:0 "\"Trabalhando até tarde novamente, [ROOT.Char.Custom('FormOfAddressForLiege')]?\"\n\nM[Select_CString( diplomacy_friend.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('diplomacy_friend') )] espreita por cima do meu ombro, dando uma olhada nos documentos que transbordam da minha mesa. \"Eu tenho alguma experiência com essas questões\", [diplomacy_friend.GetSheHe] diz timidamente. \"Talvez eu possa ajudá-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a conquistar a confiança d[Select_CString( neighbor_ruler.IsFemale, 'a', 'o' )] [neighbor_ruler.GetTitledFirstName]?\""
 diplomacy_foreign.1200.t:0 "Assuntos Delicados"
 diplomacy_foreign.3001.a.tt:0 "Você continuará recebendo cartas d[Select_CString( neighboring_ruler.IsFemale, 'a', 'o' )] [neighboring_ruler.GetFirstName]"
 diplomacy_foreign.3001.a:0 "Começar a trocar cartas com [Select_CString( neighboring_ruler.IsFemale, 'a', 'o' )] [neighboring_ruler.GetFirstNameNoTooltip]."
 diplomacy_foreign.3001.b:0 "Emoldure a carta d[Select_CString( neighboring_ruler.IsFemale, 'a', 'o' )] [neighboring_ruler.GetTitleAsNameNoTooltip] no meu salão!"
 diplomacy_foreign.3001.c:0 "Recusar educadamente."
 diplomacy_foreign.3001.desc:0 "Ouvi coisas boas sobre você e estou interessado em iniciar uma conversa por correspondência. Espero que esta carta o encontre disposto, pois aguardo ansiosamente sua rápida resposta."
 diplomacy_foreign.3001.opening:0 "[neighboring_ruler.Custom2('AppropriateGreeting', ROOT.Char)]"
 diplomacy_foreign.3001.t:0 "Correspondência"
 diplomacy_foreign.3003.a.tt:0 "Iniciar com um tópico em que você tenha conhecimento pode impressionar [neighboring_ruler.GetSheHe]"
 diplomacy_foreign.3003.a_lifestyle_administrator:0 "As peculiaridades da administração do reino são fascinantes!"
 diplomacy_foreign.3003.a_lifestyle_diplomat:0 "Vamos discutir os pontos finos da etiqueta!"
 diplomacy_foreign.3003.a_lifestyle_general:0 "Tenho algumas ótimas histórias de guerra para compartilhar."
 diplomacy_foreign.3003.a_lifestyle_schemer:0 "Ooh, aposto que [neighboring_ruler.GetSheHe] adoraria ouvir os últimos boatos..."
 diplomacy_foreign.3003.a_lifestyle_scholar:0 "Debates filosóficos são sempre interessantes!"
 diplomacy_foreign.3003.b.tt:0 "Você ouviu rumores de que esse tópico é importante para [neighboring_ruler.GetSheHe]"
 diplomacy_foreign.3003.b:0 "Por favor, me conte sobre [neighboring_ruler.Custom('subject_of_interest')]."
 diplomacy_foreign.3003.c.tt:0 "Você acredita que [neighboring_ruler.GetSheHe] é uma pessoa que valoriza coisas materiais"
 diplomacy_foreign.3003.c:0 "Vou enviar um presente para mostrar minha gratidão."
 diplomacy_foreign.3003.desc:0 "Obrigado por sua resposta rápida! Estou ansioso por nossa correspondência. Por favor, eu lhe imploro - escolha o primeiro assunto para discutirmos!"
 diplomacy_foreign.3003.desc_dead:0 "[Select_CString( dead_ruler.IsFemale, 'Minha antecessora', 'Meu antecessor' )] [dead_ruler.GetTitledFirstName] me incentivou a continuar a correspondência com você. Imploro-lhe que escolha um assunto!"
 diplomacy_foreign.3007.a:0 "Eu só desejo continuar trocando cartas!"
 diplomacy_foreign.3007.a_random_list_bad:0 "Não aprendo muito com as cartas d[Select_CString( neighboring_ruler.IsFemale, 'a', 'o' )] [neighboring_ruler.GetFirstNameNoTooltip]"
 diplomacy_foreign.3007.a_random_list_good:0 "Nossa correspondência me ensina muito sobre assuntos estrangeiros"
 diplomacy_foreign.3007.b:0 "Talvez possamos organizar um acordo comercial?"
 diplomacy_foreign.3007.c:0 "Agora que eu atendi ao seu desejo de conversar..."
 diplomacy_foreign.3007.c_random_list_bad:0 "Eu faço papel de bobo"
 diplomacy_foreign.3007.c_random_list_good:0 "Eu consigo convencer [Select_CString( neighboring_ruler.IsFemale, 'a', 'o' )] [neighboring_ruler.GetFirstNameNoTooltip]"
 diplomacy_foreign.3007.c_tt:0 "Tento convencer [Select_CString( neighboring_ruler.IsFemale, 'a', 'o' )] [neighboring_ruler.GetFirstNameNoTooltip] de que [neighboring_ruler.GetSheHe] me deve!"
 diplomacy_foreign.3007.desc_dead:0 "[Select_CString( dead_ruler_2.IsFemale, 'Minha antecessora', 'Meu antecessor' )] [dead_ruler_2.GetTitledFirstName] me incentivou a continuar a correspondência com você. A última carta que você enviou me deixou uma boa impressão!"
 diplomacy_foreign.3007.desc_ending:0 "Já que você me agradou tanto, eu devo perguntar se há algo que eu possa fazer por você?"
 diplomacy_foreign.3007.desc_gift:0 "O presente que você me enviou foi muito apreciado!"
 diplomacy_foreign.3007.desc_interest:0 "Pensar que você perguntaria sobre um assunto tão querido para mim - você realmente me conhece melhor do que a maioria!"
 diplomacy_foreign.3007.desc_lifestyle:0 "Fiquei feliz em ver o quanto você está envolvido em suas paixões. Sua última carta definitivamente prova sua habilidade nelas!"
 diplomacy_foreign.3008.a.tt:0 "Pelo menos você aprendeu algo!"
 diplomacy_foreign.3008.a:0 "Ops."
 diplomacy_foreign.3008.desc.bribe:0 "Você me julgou muito mal se pensa que suborno vai te levar a algum lugar. Avareza é uma característica extremamente inadequada."
 diplomacy_foreign.3008.desc.dead:0 "[Select_CString( dead_ruler_2.IsFemale, 'Minha antecessora', 'Meu antecessor' )] [dead_ruler_2.GetTitledFirstName] me encorajou a continuar a correspondência com você. No entanto, depois da última carta que você enviou, estou encerrando esta troca de correspondências agora; parece que [dead_ruler_2.GetSheHe] estava enganado sobre o quão envolvente você é!"
 diplomacy_foreign.3008.desc.end:0 "E pensar que eu valorizava sua amizade..."
 diplomacy_foreign.3008.desc.skilled:0 "Você está tentando me fazer parecer um idiota? Sua última carta estava tão repleta de obscuridades que eu não conseguia entender uma frase em três!"
 diplomacy_foreign.3008.desc.special:0 "Você me julgou muito mal se pensa que bajulação vai te levar a algum lugar. Agora vejo que suas palavras são vazias como sua cabeça."
 diplomacy_foreign.3008.opening:0 "[Select_CString( ROOT.Char.IsFemale, 'A', 'Ao' )] [neighboring_ruler.Custom2('RelationDescriptor', ROOT.Char)] [ROOT.Char.GetTitledFirstNameNoTooltip],"
 diplomacy_foreign_special.1017.a.no_spouse:0 "Vou colocar os serviçais para trabalhar imediatamente!"
 diplomacy_foreign_special.1017.a.spouse:0 "[helper_spouse.GetFirstNameNoTooltip], coloque os serviçais para trabalhar!"
 diplomacy_foreign_special.1017.a:0 "[target_list_member_a.GetNameNoTooltip]."
 diplomacy_foreign_special.1017.b:0 "[target_list_member_b.GetNameNoTooltip]."
 diplomacy_foreign_special.1017.bad:0 "[THIS.Char.GetFirstName] está decepcionad[Select_CString( THIS.Char.IsFemale, 'a', 'o' )] e parte mais cedo"
 diplomacy_foreign_special.1017.c:0 "[target_list_member_c.GetNameNoTooltip]."
 diplomacy_foreign_special.1017.d:0 "Devo me concentrar em apaziguar meus próprios vassalos."
 diplomacy_foreign_special.1017.desc:0 "Quanto mais estudo a nobre arte do governo, mais percebo o quão benéficas são as boas relações com meus vizinhos.\n\nDevo convidar um deles para visitar minha corte para mostrar o quão bom amigo posso ser - mas quem devo convidar?"
 diplomacy_foreign_special.1017.friends_a:0 "[target_list_member_a.GetShortUIName|U] e eu podemos nos tornar amigos"
 diplomacy_foreign_special.1017.friends_b:0 "[target_list_member_b.GetShortUIName|U] e eu podemos nos tornar amigos"
 diplomacy_foreign_special.1017.friends_c:0 "[target_list_member_c.GetShortUIName|U] e eu podemos nos tornar amigos"
 diplomacy_foreign_special.1017.good:0 "[THIS.Char.GetFirstName] desfruta de sua visita"
 diplomacy_foreign_special.1017.great:0 "[THIS.Char.GetFirstName] está impressionad[Select_CString( THIS.Char.IsFemale, 'a', 'o' )] com minha hospitalidade"
 diplomacy_foreign_special.1017.t:0 "Hospitalidade"
 diplomacy_foreign_special.1018.a.tt:0 "[foreign_guest.GetTitledFirstName] chegará em breve"
 diplomacy_foreign_special.1018.desc:0 "Agradeço gentilmente o convite para sua corte. Minha comitiva e eu chegaremos em [root_realm.GetNameNoTierNoTooltip] em algumas semanas."
 diplomacy_foreign_special.1018.opening:0 "[foreign_guest.Custom2('AppropriateGreeting', ROOT.Char)]"
 diplomacy_foreign_special.1019.a.failure.tt:0 "Você estava enganado e [Select_CString( foreign_guest.IsFemale, 'a', 'o' )] [foreign_guest.GetTitledFirstNameNoTooltip] está insultad[Select_CString( foreign_guest.IsFemale, 'a', 'o' )]"
 diplomacy_foreign_special.1019.a.success.tt:0 "[foreign_guest.GetTitledFirstNameNoTooltip] se sente em casa"
 diplomacy_foreign_special.1019.a:0 "Eu conheço algumas especialidades em [foreign_guest_realm.GetNameNoTierNoTooltip]."
 diplomacy_foreign_special.1019.b.failure.tt:0 "[foreign_guest.GetTitledFirstNameNoTooltip] teria preferido algo mais simples"
 diplomacy_foreign_special.1019.b.rl.desc:0 "O resultado depende da personalidade d[Select_CString( foreign_guest.IsFemale, 'a', 'o' )] [foreign_guest.GetTitledFirstNameNoTooltip]"
 diplomacy_foreign_special.1019.b.success.tt:0 "[foreign_guest.GetTitledFirstNameNoTooltip] aprecia o gesto, assim como a maioria das pessoas"
 diplomacy_foreign_special.1019.b:0 "Deve ser extravagante! Mais de... tudo!"
 diplomacy_foreign_special.1019.c:0 "Não vou arriscar nada com mudanças de última hora."
 diplomacy_foreign_special.1019.no_spouse.desc:0 "Eu trabalhei arduamente com todos os planejamentos e preparativos. Tudo está quase pronto e tenho um tempo para adicionar um toque final."
 diplomacy_foreign_special.1019.spouse.desc:0 "M[Select_CString( helper_spouse.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('helper_spouse'))] [helper_spouse.GetFirstName] trabalhou arduamente com todos os planejamentos e preparativos. [helper_spouse.GetSheHe|U] me perguntou se eu tenho alguma sugestão para os toques finais."
 diplomacy_foreign_special.1019.start.desc:0 "[Select_CString( foreign_guest.IsFemale, 'A', 'O' )] [foreign_guest.Custom('ComplimentAdjective')] [foreign_guest.GetTitledFirstName] finalmente chegou! Hoje à noite, teremos um banquete para dar as boas-vindas aos nossos convidados estrangeiros.\n\n"
 diplomacy_foreign_special.1019.t:0 "$diplomacy_foreign_special.1017.t$: Um Acolhimento Caloroso"
 diplomacy_foreign_special.1020.a.failure.tt:0 "[foreign_guest.GetTitledFirstNameNoTooltip] tem um tempo terrível"
 diplomacy_foreign_special.1020.a.success.tt:0 "[foreign_guest.GetTitledFirstNameNoTooltip] aproveita a caça"
 diplomacy_foreign_special.1020.a:0 "Uma viagem de caça será perfeita!"
 diplomacy_foreign_special.1020.b.success.tt:0 "[foreign_guest.GetTitledFirstNameNoTooltip] aproveita o almoço"
 diplomacy_foreign_special.1020.b:0 "Acredito que [foreign_guest.GetSheHe] prefira um almoço."
 diplomacy_foreign_special.1020.desc:0 "Se o céu puder ser confiado, parece que teremos um tempo adorável hoje! Tenho uma excelente oportunidade para mostrar [Select_CString( foreign_guest.IsFemale, 'a minha convidada', 'ao meu convidado' )] [foreign_guest.GetTitledFirstName] a beleza do país local. Eu me pergunto se [foreign_guest.GetSheHe] gostaria de uma vigorosa viagem de caça? Ou talvez um almoço tranquilo ao sol?"
 diplomacy_foreign_special.1020.t:0 "$diplomacy_foreign_special.1017.t$: Exercício ou Relaxamento"
 diplomacy_foreign_special.1021.a.success.tt:0 "[foreign_guest.GetTitledFirstNameNoTooltip] aproveita a dança"
 diplomacy_foreign_special.1021.a:0 "Aposto que [foreign_guest.GetSheHe] é um ótimo dançarino!"
 diplomacy_foreign_special.1021.b.success.tt:0 "[foreign_guest.GetTitledFirstNameNoTooltip] aproveita a visita ao [ROOT.Char.GetFaith.HouseOfWorship]"
 diplomacy_foreign_special.1021.b:0 "O [ROOT.Char.GetFaith.HouseOfWorship] parece mais adequado aos gostos [foreign_guest.GetHerHim]."
 diplomacy_foreign_special.1021.desc:0 "Gostaria de mostrar [Select_CString( foreign_guest.IsFemale, 'a minha convidada', 'ao meu convidado' )] [foreign_guest.GetTitledFirstName] os destaques culturais de [root_realm.GetNameNoTier]. A questão é, [foreign_guest.GetSheHe] prefere um grande baile com todos os senhores e damas da corte, ou uma visita ao nosso melhor [ROOT.Char.GetFaith.HouseOfWorship]?"
 diplomacy_foreign_special.1021.t:0 "$diplomacy_foreign_special.1017.t$: Diversão ou Reverência"
 diplomacy_foreign_special.1022.a.tt:0 "Você não terá conhecimento do que acontece a portas fechadas"
 diplomacy_foreign_special.1022.a:0 "\"Claro! Isso não será um problema.\""
 diplomacy_foreign_special.1022.b.duel.failure:0 "Você é descoberto"
 diplomacy_foreign_special.1022.b.duel.success:0 "Você descobre o que eles estão fazendo"
 diplomacy_foreign_special.1022.b:0 "Permita, mas ouça secretamente..."
 diplomacy_foreign_special.1022.c:0 "\"Não acho que seria apropriado.\""
 diplomacy_foreign_special.1022.desc:0 "\"S[Select_CString( interesting_relation.IsFemale, 'ua', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('interesting_relation'))] é um[Select_CString( interesting_relation.IsFemale, 'a', '' )] [interesting_relation.GetWomanMan] ótim[Select_CString( interesting_relation.IsFemale, 'a', 'o' )],\" diz [foreign_guest.GetTitledFirstName] enquanto gira pensativamente a xícara [foreign_guest.GetHerHim] [foreign_guest.Custom('RegionalDrink')]. Seu olhar está fixado [Select_CString( interesting_relation.IsFemale, 'na', 'no' )] [interesting_relation.GetFirstName], que está sentad[Select_CString( interesting_relation.IsFemale, 'a', 'o' )] mais adiante na mesa.\n\n\"M[Select_CString( ROOT.GetCharacter.IsFemale, 'inha', 'eu' )] car[Select_CString( ROOT.GetCharacter.IsFemale, 'a', 'o' )] [ROOT.GetCharacter.GetTitledFirstNameNoTooltip], tenho sua permissão para arranjar uma audiência privada com [Select_CString( interesting_relation.IsFemale, 'a', 'o' )] [interesting_relation.GetLadyLord] [interesting_relation.GetFirstNameNoTooltip]? Nada impróprio, é claro. Apenas um jantar simples em meus aposentos.\""
 diplomacy_foreign_special.1022.t:0 "$diplomacy_foreign_special.1017.t$: Um Pedido Estranho"
 diplomacy_foreign_special.1023.a:0 "Que alívio!"
 diplomacy_foreign_special.1023.desc:0 "Permaneci no corredor secreto durante toda a reunião privada entre [Select_CString( foreign_guest.IsFemale, 'a', 'o' )] [foreign_guest.GetTitledFirstName] e [Select_CString( interesting_relation.IsFemale, 'a', 'o' )] [interesting_relation.GetFirstName]. Minhas preocupações parecem ter sido completamente infundadas. Nenhuma oferta, nenhum esquema, nenhuma sedução."
 diplomacy_foreign_special.1023.t:0 "$diplomacy_foreign_special.1017.t$: Suspeita Infundada"
 diplomacy_foreign_special.1024.a:0 "Não há mal algum nisso."
 diplomacy_foreign_special.1024.b:0 "Isso acaba agora mesmo!"
 diplomacy_foreign_special.1024.desc:0 "Estou neste corredor secreto há horas agora, ouvindo a conversa aparentemente interminável entre [Select_CString( foreign_guest.IsFemale, 'a', 'o' )] [foreign_guest.GetTitledFirstName] e [Select_CString( interesting_relation.IsFemale, 'a', 'o' )] [interesting_relation.GetFirstName]. Não há nada suspeito em suas palavras, apenas uma afinidade mútua e pouco natural por alguém que acabaram de conhecer."
 diplomacy_foreign_special.1024.t:0 "$diplomacy_foreign_special.1017.t$: Um Bom Momento"
 diplomacy_foreign_special.1025.a:0 "Pah! Deixe [foreign_guest.GetSheHe] pensar que tem alguma chance."
 diplomacy_foreign_special.1025.b:0 "Traidores! Os dois!"
 diplomacy_foreign_special.1025.desc:0 "De dentro do meu esconderijo no corredor secreto, ouço claramente as palavras enganosas d[Select_CString( foreign_guest.IsFemale, 'a', 'o' )] [foreign_guest.GetTitledFirstName]. [foreign_guest.GetSheHe|U] está tentando envenenar a mente d[Select_CString( interesting_relation.IsFemale, 'a', 'o' )] [interesting_relation.GetFirstName] contra mim, e parece estar funcionando."
 diplomacy_foreign_special.1025.t:0 "$diplomacy_foreign_special.1017.t$: Uma Serpente em Meu Peito"
 diplomacy_foreign_special.1026.a.tt:0 "Você saberá do [secret|E] deles"
 diplomacy_foreign_special.1026.a:0 "Deixe-os se divertir, o que me importa."
 diplomacy_foreign_special.1026.b:0 "Tire suas mãos sujas de cima [interesting_relation.GetHerHim], [foreign_guest.Custom2('InsultNoun', ROOT.Char)]!"
 diplomacy_foreign_special.1026.c.failure:0 "Eles estão absolutamente horrorizados"
 diplomacy_foreign_special.1026.c.success:0 "Os três passamos a noite juntos"
 diplomacy_foreign_special.1026.c:0 "Há espaço para três naquela cama?"
 diplomacy_foreign_special.1026.desc:0 "À medida que a sugestão indecente passa pelos lábios d[Select_CString( foreign_guest.IsFemale, 'a', 'o' )] [foreign_guest.GetTitledFirstName], não tenho certeza se estou furioso com a completa falta de decência [foreign_guest.GetHerHim] ou impressionado com a audácia [foreign_guest.GetHerHim]. Seduzindo m[Select_CString( interesting_relation.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('interesting_relation') )] sob o meu próprio teto! Eu recosto na parede fria do corredor secreto, tentando conter a tempestade de emoções."
 diplomacy_foreign_special.1026.t:0 "$diplomacy_foreign_special.1017.t$: Engano e Desejo"
 diplomacy_foreign_special.1027.a:0 "E- Eu sinto muito!"
 diplomacy_foreign_special.1027.desc:0 "Silenciosamente como um sussurro, eu me arrasto pelos corredores secretos até os aposentos d[Select_CString( foreign_guest.IsFemale, 'a', 'o' )] [foreign_guest.GetTitledFirstName]. Uma vez lá, eu me agacho, me preparando para uma longa noite.\n\nEntão, do nada, uma mão agarra meu ombro e meu corpo se enrijece de terror. \"É assim que você trata seus convidados, [ROOT.GetCharacter.GetTitledFirstName]?\""
 diplomacy_foreign_special.1027.t:0 "$diplomacy_foreign_special.1017.t$: Uma Rata em Sua Toca"
 diplomacy_foreign_special.1028.bad:0 "Meu elogio soa como um insulto"
 diplomacy_foreign_special.1028.beautiful:0 "Beleza majestosa."
 diplomacy_foreign_special.1028.bold:0 "Coragem implacável."
 diplomacy_foreign_special.1028.compassionate:0 "Calor e bondade."
 diplomacy_foreign_special.1028.compliment.tt:0 "Como o elogio é recebido [Select_CString( foreign_guest.IsFemale, 'pela', 'pelo' )] [foreign_guest.GetTitledFirstName] depende principalmente de como ele se adequa a [foreign_guest.GetSheHe], mas também da opinião [foreign_guest.GetHerHim] sobre você e suas habilidades de [diplomacy|E]."
 diplomacy_foreign_special.1028.desc:0 "Durante nosso passeio pelos jardins, [foreign_guest.GetTitledFirstName] e eu paramos para admirar a vista. \"As proporções, as cores - poucas coisas vi tão belas quanto isso, [ROOT.GetCharacter.GetTitledFirstNameNoTooltip],\" [foreign_guest.GetSheHe] diz e faz um gesto para a paisagem diante de nós.\n\nSinto que deveria dizer algo gentil em troca. Talvez algo sobre [foreign_guest.GetSheHe]..."
 diplomacy_foreign_special.1028.dominant:0 "Presença assertiva."
 diplomacy_foreign_special.1028.energetic:0 "Energia e espontaneidade."
 diplomacy_foreign_special.1028.extroverted:0 "Habilidade com pessoas."
 diplomacy_foreign_special.1028.forgiving:0 "Natureza perdoadora."
 diplomacy_foreign_special.1028.good:0 "Meu elogio é bem recebido"
 diplomacy_foreign_special.1028.greed:0 "Ambição elevada."
 diplomacy_foreign_special.1028.honorable:0 "Lealdade e senso de honra."
 diplomacy_foreign_special.1028.neutral:0 "Meu elogio não causa impacto"
 diplomacy_foreign_special.1028.rational:0 "Racionalidade clara."
 diplomacy_foreign_special.1028.strong:0 "Força de braço."
 diplomacy_foreign_special.1028.t:0 "$diplomacy_foreign_special.1017.t$: Pétalas e Espinhos"
 diplomacy_foreign_special.1028.zealous:0 "Fé inabalável."
 diplomacy_foreign_special.1029.bad.message:0 "[foreign_guest.GetTitledFirstName] pareceu insultad[Select_CString( foreign_guest.IsFemale, 'a', 'o' )] com minha tentativa de elogio..."
 diplomacy_foreign_special.1029.good.message:0 "[foreign_guest.GetTitledFirstName] ficou lisonjead[Select_CString( foreign_guest.IsFemale, 'a', 'o' )] com meu elogio!"
 diplomacy_foreign_special.1029.neutral.message:0 "[foreign_guest.GetTitledFirstName] não pareceu notar meu elogio."
 diplomacy_foreign_special.1030.a:0 "Que sua jornada seja rápida e segura!"
 diplomacy_foreign_special.1030.a_bad_guest:0 "[foreign_guest.GetSheHe|U] acha que [foreign_guest.GetSheHe] me enganou, mas eu sei o que [foreign_guest.GetSheHe] fez."
 diplomacy_foreign_special.1030.a_extroverted:0 "Rezo para que [foreign_guest.GetSheHe] nos visite novamente em breve!"
 diplomacy_foreign_special.1030.a_introverted:0 "Finalmente, um pouco de paz e tranquilidade."
 diplomacy_foreign_special.1030.bad_guest.desc:0 "[Select_CString( foreign_guest.IsFemale, 'A', 'O' )] traiçoeir[Select_CString( foreign_guest.IsFemale, 'a', 'o' )] d[Select_CString( foreign_guest.IsFemale, 'a', 'o' )] [foreign_guest.GetTitledFirstName] e seu séquito estão prestes a partir para [foreign_guest_realm.GetNameNoTierNoTooltip].\n\nAntes que [Select_CString( foreign_guest.IsFemale, 'a', 'o' )] [foreign_guest.GetTitleTierName] entre em sua carruagem, [foreign_guest.GetSheHe] [ROOT.GetCharacter.Custom('GestureOfFriendship')] e expressa a [foreign_guest.GetSheHe]"
 diplomacy_foreign_special.1030.desc:0 "Após o que só pode ser descrito como uma visita extremamente agradável, [foreign_guest.GetTitledFirstName] e seu séquito estão prestes a partir para [foreign_guest_realm.GetNameNoTierNoTooltip].\n\nAntes que [Select_CString( foreign_guest.IsFemale, 'a', 'o' )] [foreign_guest.GetTitleTierName] entre em sua carruagem, [foreign_guest.GetSheHe] [ROOT.GetCharacter.Custom('GestureOfFriendship')] e expressa [foreign_guest.GetHerHim]"
 diplomacy_foreign_special.1030.no_spouse.desc:0 "gratidão. Garanto que [foreign_guest.GetSheHe] [foreign_guest.GetSheHe] é mais do que bem-vind[Select_CString( foreign_guest.IsFemale, 'a', 'o' )] para visitar novamente."
 diplomacy_foreign_special.1030.spouse.desc:0 "gratidão a mim e [Select_CString( helper_spouse.IsFemale, 'a minha', 'ao meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('helper_spouse') )] \"mais [helper_spouse.Custom('ComplimentAdjective')]\". Eu prometo transmitir os elogios [foreign_guest.GetHerHim]."
 diplomacy_foreign_special.1030.t:0 "$diplomacy_foreign_special.1017.t$: Um Vínculo Duradouro"
 diplomacy_foreign_special.1031.a:0 "Não foi assim que imaginei que as coisas aconteceriam..."
 diplomacy_foreign_special.1031.desc:0 "O sol mal nasceu quando percebo um dos servos d[Select_CString( foreign_guest.IsFemale, 'a', 'o' )] [foreign_guest.GetTitledFirstName] carregando um grande baú. Sigo [Select_CString( dummy_servant_gender.IsFemale, 'a', 'o' )] [dummy_servant_gender.GetWomanMan] até o pátio, onde encontro meu convidado supervisionando o carregamento de suas carruagens.\n\n[foreign_guest.GetFirstName] se assusta quando [Select_CString( interesting_relation.IsFemale, 'a', 'o' )] cumprimento e inventa uma desculpa vaga sobre uma carta e negócios urgentes. Constrangido, desejo a [foreign_guest.GetSheHe] uma jornada segura e volto apressadamente para meus aposentos privados."
 diplomacy_foreign_special.1031.t:0 "$diplomacy_foreign_special.1017.t$: Uma Partida Antecipada"
 diplomacy_foreign_special.court_visit.disaster:0 "A visita à corte termina em desastre!"
 diplomacy_foreign_special.court_visit.normal:0 "A visita à corte está progredindo normalmente!"
 diplomacy_foreign_special.court_visit.poorly:0 "A visita à corte está progredindo muito mal!"
 diplomacy_foreign_special.court_visit.very_well:0 "A visita à corte está progredindo muito bem!"
 diplomacy_foreign_special.court_visit.well:0 "A visita à corte está progredindo muito bem!"
 tooltip.diplomacy_foreign.1102.a.duel_failure:0 "Minha presença atrapalhou o encontro entre os jovens herdeiros"
 tooltip.diplomacy_foreign.1102.a.duel_success:0 "[other_heir.GetTitledFirstNameNoTooltip] ficou impressionad[Select_CString( other_heir.IsFemale, 'a', 'o' )] com minha hospitalidade"
 tooltip.diplomacy_foreign.1103.a.culture_conversion_success:0 "Convertendo Cultura"
 tooltip.diplomacy_foreign.1103.a.faith_conversion_success:0 "Mudando de Fé"
