l_spanish:
 diplomacy_family.0007.a.failure.desc:0 "Minha tentativa de convencer [Select_CString( voter.IsFemale, 'a', 'o' )] [voter.GetTitledFirstName] falhou."
 diplomacy_family.0007.a.failure.tt:0 "Você não consegue convencer [Select_CString( voter.IsFemale, 'a', 'o' )] [voter.GetTitledFirstNameNoTooltip]"
 diplomacy_family.0007.a.success.desc:0 "Eu convenci [Select_CString( voter.IsFemale, 'a', 'o' )] [voter.GetTitledFirstName] a votar [Select_CString( candidate.IsFemale, 'na', 'no' )] [candidate.GetTitledFirstName]."
 diplomacy_family.0007.a.success.tt:0 "Você convence [Select_CString( voter.IsFemale, 'a', 'o' )] [voter.GetTitledFirstNameNoTooltip]"
 diplomacy_family.0007.a:0 "Apresentar meus argumentos mais convincentes."
 diplomacy_family.0007.b:0 "Esta bolsa pode mudar a opinião [voter.GetHerHim]..."
 diplomacy_family.0007.c:0 "Um favor por um favor parece justo, não é?"
 diplomacy_family.0007.desc:0 "Meu jantar cuidadosamente planejado aconteceu conforme o planejado, e me encontro sozinho com [Select_CString( voter.IsFemale, 'a', 'o' )] [voter.GetTitledFirstName]. Devido ao vinho e [voter.Custom('FavoriteTreat')] [voter.GetHerHim], [voter.GetSheHe] parece mais feliz do que o vi em meses.\n\nEsta é a oportunidade perfeita para convencer [Select_CString( voter.IsFemale, 'a', 'o' )] [voter.GetFirstNameNoTooltip] a votar em m[Select_CString( candidate.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('candidate'))] [candidate.GetTitledFirstName]..."
 diplomacy_family.0007.placeholder.tt:0 "[voter.GetShortUIName|U] votará para eleger [candidate.GetShortUIName] como o próximo governante de [title.GetNameNoTier]"
 diplomacy_family.0007.t:0 "Um Momento Oportuno"
 diplomacy_family.0008.a.tt:0 "[disagreeable_heir.GetShortUIName|U] pode superar as falhas [disagreeable_heir.GetHerHim]"
 diplomacy_family.0008.a:0 "Tentar corrigir as falhas d[Select_CString( disagreeable_heir.IsFemale, 'a', 'o' )] [disagreeable_heir.GetFirstNameNoTooltip]."
 diplomacy_family.0008.arbitrary.desc:0 "falta completa de moral"
 diplomacy_family.0008.arrogant.desc:0 "hubris impenitente"
 diplomacy_family.0008.b.custom:0 "Cada [ROOT.Char.Custom('GetFollowerOrVassal')]"
 diplomacy_family.0008.b:0 "Enfatizar as boas qualidades [disagreeable_heir.GetHerHim]."
 diplomacy_family.0008.c:0 "Focar em mim mesmo e liderar pelo exemplo."
 diplomacy_family.0008.callous.desc:0 "coração frio como pedra"
 diplomacy_family.0008.craven.desc:0 "covardia completa"
 diplomacy_family.0008.deceitful.desc:0 "mentiras e trapaças"
 diplomacy_family.0008.end.desc:0 "se espalharam em minha corte. Isso me faz pensar se [disagreeable_heir.GetSheHe] conseguirá manter o apoio dos meus vassalos quando eu partir..."
 diplomacy_family.0008.end_no_vassals.desc:0 "se espalharam em minha [ROOT.Char.Custom('GetCourt')]. Isso me faz pensar se [disagreeable_heir.GetSheHe] será capaz de lidar com as responsabilidades do [ROOT.Char.GetPrimaryTitle.GetNameNoTier] e seu povo quando eu partir..."
 diplomacy_family.0008.gluttonous.desc:0 "glutonaria repugnante"
 diplomacy_family.0008.greedy.desc:0 "avareza insaciável"
 diplomacy_family.0008.lazy.desc:0 "preguiça embaraçosa"
 diplomacy_family.0008.start.desc:0 "Após minha partida deste mundo, [disagreeable_heir.Custom2('MyCharacterIntroduction', ROOT.Char)] governará em meu lugar.\n\nInfelizmente, rumores sobre [Select_CString( disagreeable_heir.IsFemale, 'a', 'o' )] [disagreeable_heir.GetFirstNameNoTooltip]"
 diplomacy_family.0008.stubborn.desc:0 "obstinação irritante"
 diplomacy_family.0008.t:0 "Uma Falha de Caráter"
 diplomacy_family.0008.vengeful.desc:0 "rancor interminável"
 diplomacy_family.0009.a.tt:0 "Uma lição adequada para alguém que precisa trabalhar sua compaixão"
 diplomacy_family.0009.a:0 "Aventurar-se pelas ruas e conversar com os pobres."
 diplomacy_family.0009.b.tt:0 "Uma lição adequada para alguém que precisa trabalhar sua honra"
 diplomacy_family.0009.b:0 "Assumir a responsabilidade por uma má ação e corrigi-la."
 diplomacy_family.0009.c.tt:0 "Uma lição adequada para alguém que precisa trabalhar sua generosidade"
 diplomacy_family.0009.c:0 "Distribuir posses para aqueles que precisam."
 diplomacy_family.0009.compassion.desc:0 "colocar-se no lugar daqueles menos afortunados e sentir por eles,"
 diplomacy_family.0009.d.tt:0 "Uma lição adequada para alguém que precisa trabalhar sua força"
 diplomacy_family.0009.d:0 "[disagreeable_heir.GetFirstNameNoTooltip] comandará em meu lugar."
 diplomacy_family.0009.desc:0 "[disagreeable_heir.GetTitledFirstName] concordou em me deixar orientar [disagreeable_heir.GetSheHe], mesmo que seu entusiasmo esteja um tanto quanto baixo.\n\nTemo que os vícios [disagreeable_heir.GetHerHim] estejam enraizados, mas uma experiência realmente esclarecedora pode fazer [disagreeable_heir.GetSheHe] perceber a tolice de seus caminhos.\n\nO que devemos fazer?"
 diplomacy_family.0009.e.tt:0 "Uma lição adequada para alguém que precisa aprender a deixar as coisas irem"
 diplomacy_family.0009.e:0 "Perdoar alguém que fez mal a [disagreeable_heir.GetSheHe]."
 diplomacy_family.0009.energy.desc:0 "governar em meu lugar,"
 diplomacy_family.0009.greed.desc:0 "abrir mão de posses materiais,"
 diplomacy_family.0009.honor.desc:0 "reconhecer suas falhas e lidar com suas consequências,"
 diplomacy_family.0009.rightlessonend.desc:0 "Doubto que [disagreeable_heir.GetSheHe] estivesse realmente tentando!\n\nEstou quase certo de que a culpa está no nível de entusiasmo d[Select_CString( disagreeable_heir.IsFemale, 'a', 'o' )] [disagreeable_heir.GetFirstNameNoTooltip] e não na minha lição. Darei mais uma chance a [disagreeable_heir.GetSheHe]...\n\nA pergunta é: devemos tentar uma nova tática? Ou será que a persistência vencerá hoje?"
 diplomacy_family.0009.rightlessonstart.desc:0 "Foi frustrante observar [Select_CString( disagreeable_heir.IsFemale, 'a', 'o' )] [disagreeable_heir.GetFirstName] lutando para"
 diplomacy_family.0009.vengefulness.desc:0 "mostrar verdadeiro perdão,"
 diplomacy_family.0009.wronglessonend.desc:0 "e [disagreeable_heir.GetSheHe] pareceu não aprender nada com o exercício.\n\nDarei [Select_CString( disagreeable_heir.IsFemale, 'a', 'ao' )] [disagreeable_heir.GetFirstNameNoTooltip] outra chance, e talvez eu deva mudar meu método.\n\nDesta vez, faremos..."
 diplomacy_family.0009.wronglessonstart.desc:0 "Quando observei [Select_CString( disagreeable_heir.IsFemale, 'a', 'o' )] [disagreeable_heir.GetFirstName] executando a tarefa designada, a dúvida se instalou lentamente em mim. [disagreeable_heir.GetSheHe|U] não teve dificuldades para"
 diplomacy_family.0010.a:0 "Uma grande conquista, para ambos!"
 diplomacy_family.0010.arbitrary.desc:0 "arbitrário"
 diplomacy_family.0010.arrogant.desc:0 "arrogante"
 diplomacy_family.0010.b:0 "Isso foi apenas um exercício educativo, nada mais."
 diplomacy_family.0010.c:0 "Isso é apenas o primeiro passo! Devemos trabalhar mais!"
 diplomacy_family.0010.callous.desc:0 "insensível"
 diplomacy_family.0010.compassion.desc:0 "Embora [disagreeable_heir.GetSheHe] estivesse desinteressad[Select_CString( disagreeable_heir.IsFemale, 'a', 'o' )] no começo, as histórias daqueles pobres seres que encontramos parecem ter mexido com o coração [disagreeable_heir.GetHerHim].\n\nNo caminho de volta para casa, [disagreeable_heir.GetSheHe] ficou em contemplação silenciosa, e não tem parecido tão"
 diplomacy_family.0010.craven.desc:0 "inseguro"
 diplomacy_family.0010.deceitful.desc:0 "desonesto"
 diplomacy_family.0010.end.desc:0 "desde então."
 diplomacy_family.0010.energy.desc:0 "Eu inicialmente me preocupei com o resultado de dar a [disagreeable_heir.GetSheHe] tanta responsabilidade, mas como [disagreeable_heir.GetSheHe] não tinha ninguém para se esconder ou delegar, [disagreeable_heir.GetSheHe] assumiu a tarefa.\n\n[disagreeable_heir.GetFirstNameNoTooltip] ficou até mais surpres[Select_CString( disagreeable_heir.IsFemale, 'a', 'o' )] do que eu com os talentos ocultos [disagreeable_heir.GetHerHim], e não tem parecido tão"
 diplomacy_family.0010.gluttonous.desc:0 "glutão"
 diplomacy_family.0010.greed.desc:0 "Claro, [disagreeable_heir.GetSheHe] teve dificuldades em abrir mão de suas posses no começo, mas experimentar a alegria e a gratidão daqueles em verdadeira necessidade foi algo completamente novo para [disagreeable_heir.GetSheHe].\n\nNo caminho de volta para casa, [disagreeable_heir.GetFirstNameNoTooltip] até confessou que não sente falta da maioria dos itens, e não tem parecido tão"
 diplomacy_family.0010.greedy.desc:0 "egoísta"
 diplomacy_family.0010.honor.desc:0 "Embora no início [disagreeable_heir.GetSheHe] não achasse que estava errad[Select_CString( disagreeable_heir.IsFemale, 'a', 'o' )], a resposta que [disagreeable_heir.GetSheHe] recebeu ao corrigir o assunto fez com que [disagreeable_heir.GetSheHe] entendesse.\n\nSuspeito que [Select_CString( disagreeable_heir.IsFemale, 'a', 'o' )] [disagreeable_heir.GetFirstNameNoTooltip] nunca tenha recebido esse tipo de respeito antes, e não tem parecido tão"
 diplomacy_family.0010.lazy.desc:0 "preguiçoso"
 diplomacy_family.0010.sadistic.desc:0 "sádico"
 diplomacy_family.0010.start.desc:0 "Estou encantado em ver as mudanças [Select_CString( disagreeable_heir.IsFemale, 'na', 'no' )] [disagreeable_heir.GetTitledFirstName]!"
 diplomacy_family.0010.stubborn.desc:0 "teimoso"
 diplomacy_family.0010.t:0 "$diplomacy_family.0008.t$: Novas Compreensões"
 diplomacy_family.0010.vengeful.desc:0 "vingativo"
 diplomacy_family.0010.vengefulness.desc:0 "Eu pude ver o quanto foi difícil para [disagreeable_heir.GetSheHe] enfrentar [Select_CString( dummy_gender.IsFemale, 'a', 'o' )] [dummy_gender.GetWomanMan] que lhe fez mal, as palavras ficaram presas em sua boca enquanto [disagreeable_heir.GetSheHe] tentava falar.\n\nFelizmente, [Select_CString( dummy_gender.IsFemale, 'a', 'o' )] [dummy_gender.GetWomanMan] respondeu com graça, e seguindo o exemplo dela, [disagreeable_heir.GetFirstName] perdoou [dummy_gender.GetSheHe] de forma realmente sincera. [disagreeable_heir.GetSheHe|U] não tem parecido tão"
 diplomacy_family.0011.a:0 "Eu desisto..."
 diplomacy_family.0011.end.desc:0 "Está me deixando louc[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]! Apesar de todos os meus esforços, [disagreeable_heir.GetSheHe] não fez nenhum progresso.\n\nSe seu coração não está determinado a mudar, isso nunca acontecerá."
 diplomacy_family.0011.start.desc:0 "[disagreeable_heir.GetTitledFirstName] e sua"
 diplomacy_family.0011.t:0 "$diplomacy_family.0008.t$: Apegad[Select_CString( disagreeable_heir.IsFemale, 'a', 'o' )] aos Próprios Caminhos"
 diplomacy_family.2101.a.tt:0 "Você tenta separar a briga"
 diplomacy_family.2101.a:0 "Nada de brigas na família!"
 diplomacy_family.2101.b:0 "Deixe-os resolver suas brigas em paz."
 diplomacy_family.2101.desc:0 "[family_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] está discutindo com [family_2.Custom2('HerHisCharacterIntroduction', family_1)] há dias. Acabei de ouvi-los discutindo na [ROOT.Char.Custom('GetRoom')] ao lado...\n\n\"Inacreditável!\" [family_1.GetFirstName] grita, \"Como um[Select_CString( family_2.IsFemale, 'a', '' )] [family_2.Custom2('InsultNoun', SCOPE.sC('family_1'))] como você pode acreditar que é a manifestação ideal das virtudes da família [ROOT.Char.GetDynastyName]!? Eu sou claramente #EMP muito mais merecedor dessa distinção do que você!"
 diplomacy_family.2101.t:0 "A Disputa"
 diplomacy_family.2102.a:0 "Sim, vergonha para você [family_2.GetFirstNameNoTooltip]!"
 diplomacy_family.2102.b:0 "Você está errado aqui, [family_1.GetFirstNameNoTooltip]."
 diplomacy_family.2102.c.failure:0 "Eles se recusam a ouvir"
 diplomacy_family.2102.c.success:0 "Eles ouvem a razão"
 diplomacy_family.2102.c:0 "Vocês dois estão agindo como crianças mimadas!"
 diplomacy_family.2102.d.flavor:0 "Bem, essa é certamente uma maneira de fazê-los parar de brigar um com o outro..."
 diplomacy_family.2102.d:0 "Ha! Eu sou #EMP claramente#! o melhor [ROOT.Char.GetDynastyNameNoTooltip] por perto!"
 diplomacy_family.2102.desc:0 "Quando entro na [ROOT.Char.Custom('GetRoom')], [family_1.GetFirstName] se vira para me encarar. \"Fico feliz que você esteja aqui, [ROOT.Char.GetFirstNameNoTooltip]. Você pode por favor falar um pouco de bom senso para [family_2.Custom2('YourCharacterIntroduction', ROOT.Char)]? [family_2.GetSheHe|U] está agindo de forma completamente irracional!"
 diplomacy_family.2200.a.tt:0 "[friend_1.GetTitledFirstName] pode se tornar [Select_CString( friend_1.IsFemale, 'sua Melhor Amiga', 'seu Melhor Amigo' )]"
 diplomacy_family.2200.a:0 "[friend_1.GetTitledFirstNameNoTooltip] é [Select_CString( friend_1.IsFemale, 'minha melhor amiga', 'meu melhor amigo' )]."
 diplomacy_family.2200.b.tt:0 "[friend_2.GetTitledFirstName] pode se tornar [Select_CString( friend_2.IsFemale, 'sua Melhor Amiga', 'seu Melhor Amigo' )]"
 diplomacy_family.2200.b:0 "Confio mais [Select_CString( friend_2.IsFemale, 'na', 'no' )] [friend_2.GetFirstNameNoTooltip] do que em qualquer outra pessoa."
 diplomacy_family.2200.c.tt:0 "[friend_3.GetTitledFirstName] pode se tornar [Select_CString( friend_3.IsFemale, 'sua Melhor Amiga', 'seu Melhor Amigo' )]"
 diplomacy_family.2200.c:0 "Quem senão [Select_CString( friend_3.IsFemale, 'a', 'o' )] [friend_3.GetTitledFirstNameNoTooltip]?"
 diplomacy_family.2200.d:0 "Não devo mostrar favoritismo."
 diplomacy_family.2200.desc:0 "Pouc[Select_CString( ruler.IsFemale, 'as', 'os' )] [ruler.GetWomenMen] têm a sorte de ter tantos amigos quanto eu. Agradeço seu apoio e confio neles igualmente, mas sinto que, entre todas as almas valorosas que considero meus leais companheiros de vida, um me entende acima de todos."
 diplomacy_family.2200.t:0 "O Mais Querido de Todos os Meus Amigos"
 diplomacy_family.2201.a.tt:0 "Nos tornamos verdadeiros melhores amigos"
 diplomacy_family.2201.a:0 "Somos verdadeiras almas gêmeas."
 diplomacy_family.2201.b.tt:0 "Continuamos apenas como amigos"
 diplomacy_family.2201.b:0 "Somos amigos, é verdade, mas é só isso."
 diplomacy_family.2201.desc:0 "Apenas recentemente percebi o quanto dependo do conselho e do apoio d[Select_CString( ruler.IsFemale, 'a', 'o' )] [ruler.GetFirstName]. Comecei a ver [ruler.GetSheHe] como meu amigo mais próximo e querido."
 diplomacy_family.2250.a.failure.duel:0 "[spouse.GetTitledFirstName] ignora minhas advertências"
 diplomacy_family.2250.a.failure.tt:0 "[spouse.GetTitledFirstName] ignorou minhas advertências sobre [Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetFirstName]"
 diplomacy_family.2250.a.success.duel:0 "Eu intimidei com sucesso [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetTitledFirstName]"
 diplomacy_family.2250.a.tt:0 "Vou tentar dissuadir [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetTitledFirstName] de se envolver com m[Select_CString( lover.IsFemale, 'inha', 'eu' )] [ruler.Custom2('RelationToMeShort', SCOPE.sC('lover'))]"
 diplomacy_family.2250.a:0 "[spouse.GetFirstNameNoTooltip] melhor manter as mãos para [spouse.GetHerselfHimself]!"
 diplomacy_family.2250.b.a:0 "\"Por que você não morre logo!?!\""
 diplomacy_family.2250.b.b:0 "[spouse.GetSheHe|U] deve ser lidad[Select_CString( spouse.IsFemale, 'a', 'o' )] com."
 diplomacy_family.2250.b.spouse_joining:0 "[lover.GetFirstName] #P irá#! participar do meu [scheme|E]"
 diplomacy_family.2250.b.spouse_refusing:0 "[lover.GetFirstName] #N não irá#! participar do meu [scheme|E]"
 diplomacy_family.2250.b.tt:0 "O [scheme|E] terá uma [success_chance|E] aumentada"
 diplomacy_family.2250.c.a:0 "[house_head.GetTitledFirstNameNoTooltip] deve acabar com esse casamento!"
 diplomacy_family.2250.c.b:0 "Eu devo acabar com esse casamento!"
 diplomacy_family.2250.c.flavor:0 "[house_head|E] tem o poder de anular o casamento d[Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetFirstName]"
 diplomacy_family.2250.d:0 "Eu devo aprender a conviver com minha angústia."
 diplomacy_family.2250.desc.illegal:0 "\n\nMesmo que não possamos nos casar, isso não significa que eu não possa me importar com quem [lover.GetSheHe] passará o resto da vida!"
 diplomacy_family.2250.desc.intro:0 "Não suporto ver [Select_CString( lover.IsFemale, 'minha amada', 'meu amado' )] [ruler.Custom2('RelationToMeShort', SCOPE.sC('lover'))], [lover.GetFirstName], passando tempo com [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetWifeHusband] [spouse.Custom2('InsultAdjective', ROOT.Char)], [spouse.GetTitledFirstName]."
 diplomacy_family.2250.desc.legal.pure:0 "\n\nA ideia de mãos impuras tocando o corpo [lover.GetHerHim] é insuportável. Ambos somos da Casa [ruler.GetHouse.GetName], pertencemos um ao outro!"
 diplomacy_family.2250.desc.legal.same:0 "\n\nPor que [ruler.GetFaith.HighGodName] favoreceria m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ruler.Custom2('RelationToMeShort', SCOPE.sC('spouse'))] em vez de mim? Ambos pertencemos à Casa [ruler.GetHouse.GetName], mas [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetFirstNameNoTooltip] pode viver com [lover.GetSheHe] enquanto eu tenho que me esconder nas sombras deles."
 diplomacy_family.2250.t:0 "[Select_CString( ruler.IsFemale, 'A', 'O' )] [lover.Custom2('RelationToMeShort', SCOPE.sC('ruler'))|U] Ciument[Select_CString( ruler.IsFemale, 'a', 'o' )]"
 diplomacy_family.2251.a:0 "Espero que m[Select_CString( lover.IsFemale, 'inha', 'eu' )] [ruler.Custom2('RelationToMeShort', SCOPE.sC('lover'))] aprecie."
 diplomacy_family.2251.desc:0 "[spouse.GetTitledFirstName] pensará duas vezes antes de tocar em m[Select_CString( lover.IsFemale, 'inha', 'eu' )] [lover.GetFirstName] novamente. Fui muito cuidadoso para não revelar meus motivos, mas pode ser tolice pressionar a questão novamente no futuro. \n\nMais cedo ou mais tarde, [spouse.GetFirstNameNoTooltip] encontrará uma maneira de ignorar minhas ameaças, mas por agora, posso descansar tranquilo."
 diplomacy_family.2252.a:0 "Mas...!"
 diplomacy_family.2252.desc:0 "\"Como você pôde ser tão insensível?!\" [lover.GetFirstName] sussurra para mim, sem ousar elevar sua voz, mesmo em meus próprios [ROOT.Char.Custom('GetRoomPlural')].\n\n Parece que [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetTitledFirstName] ignorou minhas advertências e informou m[Select_CString( lover.IsFemale, 'inha', 'eu' )] [ruler.Custom2('RelationToMeShort', SCOPE.sC('lover'))] sobre nossa conversa.\n\n\"Não posso negligenciar minhas obrigações matrimoniais por sua causa, [ruler.GetFirstNameNoTooltip]!\" Com isso, [lover.GetSheHe] parte apressadamente."
 diplomacy_family.2253.a:0 "Agora finalmente poderemos ficar juntos para sempre!"
 diplomacy_family.2253.b:0 "As coisas que faço pela família..."
 diplomacy_family.2253.c:0 "Todos devem saber do nosso amor!"
 diplomacy_family.2253.desc.a:0 "Meu plano funcionou perfeitamente! [lover.GetFirstName] está livre dess[Select_CString( spouse.IsFemale, 'a', 'e' )] [spouse.Custom2('InsultNoun', ROOT.Char)] incult[Select_CString( spouse.IsFemale, 'a', 'o' )], [spouse.GetTitledFirstName], e não poderíamos estar mais felizes.\n\n[lover.GetSheHe|U] correu para meus [ROOT.Char.Custom('GetRoomPlural')] assim que ouviu a notícia d[Select_CString( house_head.IsFemale, 'a', 'o' )] [house_head.GetTitledFirstName] para expressar sua gratidão da maneira mais doce."
 diplomacy_family.2253.desc.b:0 "Meu plano funcionou perfeitamente! [lover.GetFirstName] está livre dess[Select_CString( spouse.IsFemale, 'a', 'e' )] [spouse.Custom2('InsultNoun', ROOT.Char)] incult[Select_CString( spouse.IsFemale, 'a', 'o' )], [spouse.GetTitledFirstName], e não poderíamos estar mais felizes.\n\n[lover.GetSheHe|U] correu para meus [ROOT.Char.Custom('GetRoomPlural')] assim que recebeu minha carta para expressar sua gratidão da maneira mais doce."
 diplomacy_family.2254.a:0 "Não é sobre nós, é sobre a família!"
 diplomacy_family.2254.b:0 "Não sei o que dizer..."
 diplomacy_family.2254.desc.a:0 "Eu esperava que [Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetFirstName] me agradecesse por pedir [Select_CString( house_head.IsFemale, 'a', 'ao' )] [house_head.GetTitledFirstName] o divórcio [lover.GetHerHim] com [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetFirstName], mas está longe disso.\n\n[lover.GetSheHe|U] está absolutamente furios[Select_CString( lover.IsFemale, 'a', 'o' )] com minha intromissão na vida matrimonial [lover.GetHerHim] e não deseja mais ter nada a ver comigo."
 diplomacy_family.2254.desc.b:0 "Eu esperava que [Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetFirstName] me agradecesse por arranjar um divórcio para [lover.GetSheHe], mas está longe disso.\n\n[lover.GetSheHe|U] está absolutamente furios[Select_CString( lover.IsFemale, 'a', 'o' )] com minha intromissão na vida matrimonial [lover.GetHerHim] e não deseja mais ter nada a ver comigo."
 diplomacy_family.2300.a.failure.toast:0 "Não consegui ensinar nada relevante [Select_CString( bad_relative.IsFemale, 'a', 'ao' )] [bad_relative.GetFirstName]"
 diplomacy_family.2300.a.failure.tt:0 "[bad_relative.GetFirstName] recusa minha ajuda"
 diplomacy_family.2300.a.success.effect.tt:0 "Uma das [skills|E] d[Select_CString( bad_relative.IsFemale, 'a', 'o' )] [bad_relative.GetFirstName] será aumentada"
 diplomacy_family.2300.a.success.tt:0 "Eu ajudo [Select_CString( bad_relative.IsFemale, 'a', 'o' )] [bad_relative.GetFirstName] a aprender algo útil"
 diplomacy_family.2300.a:0 "Talvez eu possa fazer algo com [bad_relative.GetSheHe]."
 diplomacy_family.2300.b.a:0 "Devo renovar meus esforços para me livrar [bad_relative.GetHerHim]."
 diplomacy_family.2300.b.b:0 "Às vezes, é necessário podar a árvore..."
 diplomacy_family.2300.c.flavor:0 "O [dynast|E] tem o poder de deserdar membros da família"
 diplomacy_family.2300.c:0 "Devo expulsar [bad_relative.GetSheHe]!"
 diplomacy_family.2300.d:0 "Todos nós temos nossas limitações."
 diplomacy_family.2300.desc.a:0 "\n\nM[Select_CString( bad_relative.IsFemale, 'inha', 'eu' )] [ruler.Custom2('RelationToMeShort', SCOPE.sC('bad_relative'))] é um imbecil confuso, tropeçando por aí, fazendo papel de bobo da Casa [ruler.GetDynastyName] com cada palavra que [bad_relative.GetSheHe] solta."
 diplomacy_family.2300.desc.b:0 "\n\nM[Select_CString( bad_relative.IsFemale, 'inha', 'eu' )] [ruler.Custom2('RelationToMeShort', SCOPE.sC('bad_relative'))] é uma decepção total em tudo que [bad_relative.GetSheHe] tenta realizar."
 diplomacy_family.2300.desc.c:0 "\n\nUma aberração deformada, m[Select_CString( bad_relative.IsFemale, 'inha', 'eu' )] [ruler.Custom2('RelationToMeShort', SCOPE.sC('bad_relative'))] diminui a dinastia [bad_relative.GetDynasty.GetName] com cada respiração. Como uma linhagem tão distinta poderia gerar uma criatura como [bad_relative.GetSheHe]?"
 diplomacy_family.2300.desc.d:0 "\n\nUm ramo murchado e retorcido pendurado em nossa vibrante árvore genealógica, m[Select_CString( bad_relative.IsFemale, 'inha', 'eu' )] [ruler.Custom2('RelationToMeShort', SCOPE.sC('bad_relative'))] é um lembrete constante da infidelidade d[Select_CString( bad_relative.IsFemale, 'a', 'o' )] [bad_parent.GetFirstName]."
 diplomacy_family.2300.desc.intro:0 "A própria existência d[Select_CString( bad_relative.IsFemale, 'a', 'o' )] [bad_relative.GetFirstName] é um insulto ao nome de nossa gloriosa dinastia."
 diplomacy_family.2300.t:0 "Podando a Dinastia"
 diplomacy_family.2301.a:0 "Eu fiz o que pude."
 diplomacy_family.2301.desc:0 "Foi uma tarefa difícil fazer algo entrar na cabeça dura d[Select_CString( bad_relative.IsFemale, 'a', 'o' )] [bad_relative.GetFirstName], mas de alguma forma eu consegui. [bad_relative.GetSheHe] agora, pelo menos, não é mais uma completa decepção..."
 diplomacy_family.2400.a.result.tt_first:0 "#weak Isso #EMP pode#! melhorar a educação [Select_CString( TARGET_CHARACTER.IsFemale, 'da', 'do' )] [TARGET_CHARACTER.GetFirstNamePossessiveNoTooltip]#!"
 diplomacy_family.2400.a.tt:0 "[spouse.GetFirstNameNoTooltip] tentará ensinar [heir.GetFirstNameNoTooltip]"
 diplomacy_family.2400.a:0 "Devo deixar [spouse.GetSheHe] tentar."
 diplomacy_family.2400.b:0 "Minha tutoria será suficiente"
 diplomacy_family.2400.desc:0 "Certa manhã cedo, [Select_CString( spouse.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('PartnerOpinionDescription', SCOPE.sC('spouse') )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] entra em meus/minhas [ROOT.Char.Custom('GetChambersOrTent')].\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom('ComplimentAdjective')] [spouse.Custom2('RelationToMe', ROOT.Char)]! Ultimamente tenho pensado na educação [Select_CString( heir.IsFemale, 'da', 'do' )] [heir.GetFirstNamePossessive]. Acredito que meu conhecimento em [spouse.Custom('highest_skill_noun')] pode ser útil para [heir.GetSheHe]. Você me permitiria ajudar em seus estudos?\""
 diplomacy_family.2400.story_title:0 "Tutoria do Herdeiro"
 diplomacy_family.2400.t:0 "$diplomacy_family.2400.story_title$: A Oferta"
 diplomacy_family.2410.a.possible_outcome_good.tt_first:0 "#weak Devido às habilidades combinadas, a educação [Select_CString( TARGET_CHARACTER.IsFemale, 'da', 'do' )] [TARGET_CHARACTER.GetFirstNamePossessiveNoTooltip] pode melhorar #P muito#! #!"
 diplomacy_family.2410.a.possible_outcome_mediocre.tt_first:0 "#weak Devido às habilidades combinadas, a educação [Select_CString( TARGET_CHARACTER.IsFemale, 'da', 'do' )] [TARGET_CHARACTER.GetFirstNamePossessiveNoTooltip] pode melhorar #M levemente#! #!"
 diplomacy_family.2410.a.tt:0 "Você ajuda [spouse.GetFirstNameNoTooltip] a ensinar [heir.GetNameNoTooltip]"
 diplomacy_family.2410.a:0 "Devo comprar material de estudo para [spouse.GetSheHe]."
 diplomacy_family.2410.b.possible_outcome.tt_first:0 "#weak A educação [Select_CString( TARGET_CHARACTER.IsFemale, 'da', 'do' )] [TARGET_CHARACTER.GetFirstNamePossessiveNoTooltip] irá melhorar #!"
 diplomacy_family.2410.b.tt:0 "Você encoraja [spouse.GetFirstNameNoTooltip] a continuar ensinando [heir.GetFirstNameNoTooltip]"
 diplomacy_family.2410.b:0 "\"Você precisa se esforçar mais\""
 diplomacy_family.2410.bossy:0 "faz exatamente o oposto do que eu digo a [heir.GetSheHe]."
 diplomacy_family.2410.c.possible_outcome_you.tt_first:0 "#weak A educação [Select_CString( TARGET_CHARACTER.IsFemale, 'da', 'do' )] [TARGET_CHARACTER.GetFirstNamePossessiveNoTooltip] irá melhorar #!"
 diplomacy_family.2410.c:0 "Deixe-me cuidar disso."
 diplomacy_family.2410.charming:0 "fica constantemente pres[Select_CString( heir.IsFemale, 'a', 'o' )] em conversas com outras crianças."
 diplomacy_family.2410.curious:0 "está me deixando louc[Select_CString( spouse.IsFemale, 'a', 'o' )] com perguntas irrelevantes."
 diplomacy_family.2410.desc.after:0 "Não posso continuar assim sem perder minha sanidade.\""
 diplomacy_family.2410.desc:0 "Em uma noite inquieta, começo a vagar. Ao chegar ao depósito de comida, ouço um som estranho. Para minha surpresa, vejo [Select_CString( spouse.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] [spouse.GetFirstName], enchendo o rosto com [ROOT.Char.Custom('GetExpensiveDessert')]. [spouse.GetSheHe|U] olha para mim com vergonha e desespero.\n\n\"Estou perdid[Select_CString( spouse.IsFemale, 'a', 'o' )] ao ensinar [heir.GetFirstName]! Em vez de me ouvir, [heir.GetSheHe]\""
 diplomacy_family.2410.pensive:0 "está sempre com o nariz enfiado em um livro."
 diplomacy_family.2410.rowdy:0 "fica correndo por aí causando confusão."
 diplomacy_family.2410.t:0 "$diplomacy_family.2400.story_title$: Em um Impasse"
 diplomacy_family.2411.a.outcome_spouse_good.tt_global_past:0 "#weak graças às habilidades excepcionais do cônjuge.#!"
 diplomacy_family.2411.a.outcome_spouse_medium.tt_global_past:0 "#weak graças às habilidades adequadas do cônjuge.#!"
 diplomacy_family.2411.a.outcome_you_good.tt_global_past:0 "#weak graças às suas habilidades excepcionais.#!"
 diplomacy_family.2411.a.outcome_you_medium.tt_global_past:0 "#weak graças às suas habilidades adequadas.#!"
 diplomacy_family.2411.a:0 "O futuro é brilhante para [heir.GetFirstNameNoTooltip]."
 diplomacy_family.2411.desc:0 "Após meses de trabalho árduo e dedicação à tutoria [Select_CString( heir.IsFemale, 'da', 'do' )] [heir.GetFirstNamePossessive], [Select_CString( spouse.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] [spouse.GetFirstName] me aborda em minhas [ROOT.Char.Custom('GetChambersOrTent')]. O rosto [spouse.GetHerHim] brilha de orgulho.\n\n\"Ah, [ROOT.Char.GetFirstNameNoTooltip]! Graças à sua orientação e apoio, noss[Select_CString( heir.IsFemale, 'a', 'o' )] [heir.Custom('PetName')] [heir.GetNameNoTooltip] se destacou em seus estudos. Eu estaria perdid[Select_CString( spouse.IsFemale, 'a', 'o' )] sem você\""
 diplomacy_family.2411.t:0 "$diplomacy_family.2400.story_title$: Um Esforço Conjunto"
 diplomacy_family_special.2200.a.tt:0 "Vou ajudar [Select_CString( heir.IsFemale, 'a', 'o' )] [heir.GetFirstNameNoTooltip] a encontrar uma maneira de responder às críticas"
 diplomacy_family_special.2200.a:0 "Venha sentar-se comigo, vamos discutir esse assunto."
 diplomacy_family_special.2200.b.tt:0 "Vou fazer [Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetFirstNameNoTooltip] explicar por que ele está criticando meu herdeiro"
 diplomacy_family_special.2200.b:0 "Vou falar com [Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstNameNoTooltip] sobre isso."
 diplomacy_family_special.2200.c:0 "Por que você está me incomodando com isso?"
 diplomacy_family_special.2200.desc:0 "Estou relaxando em meu [ROOT.Char.Custom('ResidenceBuilding')] no fim do dia quando [heir.Custom2('MyCharacterIntroduction', ROOT.Char)] entra, visivelmente aflito.\n\n\"[vassal.Custom2('YourCharacterIntroduction', ROOT.Char)|U] é um verdadeiro incômodo!\" [heir.GetSheHe] exclama. \"[vassal.GetSheHe|U] está sempre dizendo que sou inadequado para sucedê-lo. [vassal.GetSheHe|U] acha que sou muito [SCOPE.Custom('PersonalityGetTraitDescriptionFromFlag')] para ser o próximo"
 diplomacy_family_special.2200.end.desc:0 "do [ROOT.Char.GetPrimaryTitle.GetNameNoTier]!\""
 diplomacy_family_special.2200.opposite_sex_title.desc:0 "[ROOT.Char.GetPrimarySpouse.GetTitleAsNameNoTooltip]"
 diplomacy_family_special.2200.ruler.desc:0 "[ROOT.Char.GetTitleAsNameNoTooltip]"
 diplomacy_family_special.2200.same_sex_title.desc:0 "$diplomacy_family_special.2200.same_title.desc$"
 diplomacy_family_special.2200.same_title.desc:0 "[ROOT.Char.GetTitleAsNameNoTooltip]"
 diplomacy_family_special.2200.t:0 "Desavença do Sucessor"
 diplomacy_family_special.2201.a.failure:0 "[heir.GetFirstNameNoTooltip] está indispost[Select_CString( heir.IsFemale, 'a', 'o' )] a se reconciliar com [Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetFirstNameNoTooltip]"
 diplomacy_family_special.2201.a.success:0 "[heir.GetFirstNameNoTooltip] e [Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetFirstNameNoTooltip] resolvem suas diferenças"
 diplomacy_family_special.2201.a:0 "Vocês têm mais em comum do que pensam."
 diplomacy_family_special.2201.b.failure.tt:0 "[heir.GetTitledFirstName] continua sendo [SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagTraitLink')]"
 diplomacy_family_special.2201.b.failure:0 "[heir.GetFirstNameNoTooltip] se recusa a mudar sua personalidade"
 diplomacy_family_special.2201.b.success.tt:0 "[heir.GetTitledFirstName] começa a tentar ser mais [SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInvertedTraitLink')]"
 diplomacy_family_special.2201.b.success:0 "Eu convenço [Select_CString( heir.IsFemale, 'a', 'o' )] [heir.GetFirstNameNoTooltip] a tentar mudar sua personalidade"
 diplomacy_family_special.2201.b:0 "Eu poderia ajudar você a praticar ser [SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInverted')]..."
 diplomacy_family_special.2201.c:0 "Eu farei [vassal.GetSheHe] pagar por criticar você!"
 diplomacy_family_special.2201.desc:0 "Eu chamo [Select_CString( heir.IsFemale, 'a', 'o' )] [heir.GetFirstName] para uma conversa franca. Percebo que [heir.GetSheHe] está frustrad[Select_CString( heir.IsFemale, 'a', 'o' )] com a situação em relação [Select_CString( vassal.IsFemale, 'a', 'ao' )] [vassal.GetTitledFirstName] e está dispost[Select_CString( vassal.IsFemale, 'a', 'o' )] a ouvir meu conselho."
 diplomacy_family_special.2202.a.failure:0 "[vassal.GetFirstNameNoTooltip] está indispost[Select_CString( vassal.IsFemale, 'a', 'o' )] a se reconciliar com [Select_CString( heir.IsFemale, 'a', 'o' )] [heir.GetFirstNameNoTooltip]"
 diplomacy_family_special.2202.a.success:0 "[vassal.GetFirstNameNoTooltip] e [Select_CString( heir.IsFemale, 'a', 'o' )] [heir.GetFirstNameNoTooltip] resolvem suas diferenças"
 diplomacy_family_special.2202.a:0 "Mas e as boas qualidades [heir.GetHerHim]?"
 diplomacy_family_special.2202.b:0 "Você está certo, [heir.GetFirstNameNoTooltip] é uma decepção."
 diplomacy_family_special.2202.c:0 "Você não irá criticar m[Select_CString( heir.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))]!"
 diplomacy_family_special.2202.desc:0 "Eu organizo uma reunião com [Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstName] para discutir seu problema com m[Select_CString( heir.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))] [heir.GetTitledFirstName].\n\n\"É bem simples, [ROOT.Char.GetTitledFirstNameNoTooltip]; eu não gosto da ideia de ter um senhor feudal [SCOPE.Custom('PersonalityGetTraitDescriptionFromFlag')]. Pelo bem do [ROOT.Char.Custom('GetRealmOrDomicile')], estou disposto a expressar meu descontentamento, mesmo que isso signifique me colocar em risco.\""
 diplomacy_family_special.2210.a:0 "Isso é um bom presságio para o futuro!"
 diplomacy_family_special.2210.desc:0 "Após conversar com [Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstName], [vassal.GetSheHe] decidiu tentar fazer as pazes com [Select_CString( heir.IsFemale, 'a', 'o' )] [heir.GetTitledFirstName], focando no que eles têm em comum em vez de suas diferenças. Essa mudança de coração é bastante promissora!"
 diplomacy_family_special.2211.a.high_opinion:0 "Eu esperava mais d[Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstNameNoTooltip]."
 diplomacy_family_special.2211.a:0 "[vassal.GetTitledFirstNameNoTooltip] realmente é um[Select_CString( vassal.IsFemale, 'a', '' )] grosseir[Select_CString( vassal.IsFemale, 'a', 'o' )]!"
 diplomacy_family_special.2211.desc:0 "Apesar de todos os meus esforços para convencer [Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstName] de que ele poderia se dar bem com [Select_CString( heir.IsFemale, 'a', 'o' )] [heir.GetTitledFirstName] se [vassal.GetSheHe] tentasse, o tolo se recusou a reconhecer qualquer aspecto agradável da personalidade d[Select_CString( heir.IsFemale, 'a', 'o' )] [heir.GetTitledFirstName]."
 diplomacy_family_special.2212.a:0 "Isso é um bom presságio para o futuro!"
 diplomacy_family_special.2212.desc:0 "Após conversar com [heir.GetSheHe], [heir.GetTitledFirstName] disse que tentaria se comportar melhor perto d[Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstName].\n\nAo focar no que eles têm em comum em vez de suas diferenças, é possível que uma nova amizade possa surgir entre os dois."
 diplomacy_family_special.2213.a:0 "Estou decepcionad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com [Select_CString( heir.IsFemale, 'a', 'o' )] [heir.GetFirstNameNoTooltip]."
 diplomacy_family_special.2213.desc:0 "Apesar de todos os meus esforços para convencer [Select_CString( heir.IsFemale, 'a', 'o' )] [heir.GetTitledFirstName] de que ele poderia se dar bem com [Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstName] se [heir.GetSheHe] tentasse, [heir.GetFirstNameNoTooltip] se recusou a mudar seu comportamento quando está perto d[Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstNameNoTooltip].\n\nParece que a animosidade entre eles continuará por algum tempo..."
 diplomacy_family_special.2220.a.tt:0 "[heir.GetFirstName] tentará ser mais [SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInvertedTraitLink')]"
 diplomacy_family_special.2220.a:0 "O tempo dirá como isso afetará as coisas."
 diplomacy_family_special.2220.desc:0 "Sentei-me com [Select_CString( heir.IsFemale, 'a', 'o' )] [heir.GetFirstName] e expliquei que, às vezes, é do melhor interesse do [ROOT.Char.Custom('GetRealmOrDomicile')] ser [SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInverted')], mesmo que esse comportamento não seja natural.\n\n[heir.GetSheHe|U] parecia cétic[Select_CString( heir.IsFemale, 'a', 'o' )] no começo, mas ficou encorajad[Select_CString( heir.IsFemale, 'a', 'o' )] quando disse que essas coisas se tornam mais fáceis com o tempo e a prática."
 diplomacy_family_special.2221.a:0 "Por que [heir.GetSheHe] não consegue enxergar a verdade de minhas palavras?"
 diplomacy_family_special.2221.desc:0 "Tentei convencer [Select_CString( heir.IsFemale, 'a', 'o' )] [heir.GetFirstName] de por que seria do próprio interesse [heir.GetHerHim] ser menos [SCOPE.Custom('PersonalityGetTraitDescriptionFromFlag')], dando a [heir.GetSheHe] exemplos de como é vantajoso ser um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] [SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInverted')].\n\nApesar disso, [heir.GetSheHe] se recusou a considerar mudar seu comportamento. [heir.GetSheHe|U] parece estar decidid[Select_CString( heir.IsFemale, 'a', 'o' )] em suas formas, mesmo que isso signifique alienar os outros."
 diplomacy_family_special.2231.a:0 "Eu sabia que todos nós poderíamos resolver isso!"
 diplomacy_family_special.2231.desc:0 "A relação entre [Select_CString( heir.IsFemale, 'a', 'o' )] [heir.GetTitledFirstName] e [Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstName] pode ter começado com animosidade e rancor, mas sob minha orientação, eles aprenderam a se entender e confiar um no outro. O cultivo cuidadoso desses atributos resultou no surgimento de uma forte amizade entre eles!"
 diplomacy_family_special.2233.a:0 "Fico feliz em ver [Select_CString( heir.IsFemale, 'a', 'o' )] [heir.GetFirstNameNoTooltip] crescendo como pessoa."
 diplomacy_family_special.2233.desc:0 "Tenho incentivado [Select_CString( heir.IsFemale, 'a', 'o' )] [heir.GetFirstName] a mudar seu comportamento há vários anos, e parece que meus esforços realmente valeram a pena!\n\nSer [SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInverted')] parece ter se tornado algo natural para [heir.GetSheHe], um hábito tão arraigado que [heir.GetSheHe] não precisa mais fazer esforço para agir assim."
