l_spanish:
 diplomacy_majesty.0004.beautiful:0 "Aparência bela."
 diplomacy_majesty.0004.bold:0 "Coragem incansável."
 diplomacy_majesty.0004.compassionate:0 "Empatia e coração gentil."
 diplomacy_majesty.0004.compliment.tt:0 "A reação d[Select_CString( compliment_receiver.IsFemale, 'a', 'o' )] [compliment_receiver.GetTitledFirstName] dependerá de quão bem o elogio se adequa a [compliment_receiver.GetSheHe]:"
 diplomacy_majesty.0004.desc:0 "Ambos notamos isso: os sorrisos forçados e as conversas vacilantes, seguidos por um silêncio desconfortável. Há algo que não está certo entre [compliment_receiver.Custom2('MyCharacterIntroduction', ROOT.Char)] e eu. \n\nTalvez um elogio bem formulado torne nossas interações mais suaves? Da próxima vez que nos encontrarmos, eu poderia elogiar [compliment_receiver.GetSheHe]..."
 diplomacy_majesty.0004.dominant:0 "Presença assertiva."
 diplomacy_majesty.0004.energetic:0 "Vigor juvenil."
 diplomacy_majesty.0004.extroverted:0 "Habilidades sociais sem igual."
 diplomacy_majesty.0004.failure.tt:0 "Seu elogio soa como um insulto"
 diplomacy_majesty.0004.fallback:0 "...esqueça. Tenho medo de insultar [compliment_receiver.GetSheHe]!"
 diplomacy_majesty.0004.forgiving:0 "Natureza perdoadora."
 diplomacy_majesty.0004.greed:0 "Ambição grandiosa."
 diplomacy_majesty.0004.honorable:0 "Lealdade e senso de honra."
 diplomacy_majesty.0004.neutral.tt:0 "Seu elogio passa despercebido"
 diplomacy_majesty.0004.neutral_outcome.desc:0 "O elogio que fiz [Select_CString( compliment_receiver.IsFemale, 'a', 'ao' )] [compliment_receiver.GetTitledFirstName] passou despercebido."
 diplomacy_majesty.0004.rational:0 "Racionalidade clara."
 diplomacy_majesty.0004.strong:0 "Força de braço."
 diplomacy_majesty.0004.success.tt:0 "Seu elogio é bem recebido"
 diplomacy_majesty.0004.t:0 "O Poder das Palavras"
 diplomacy_majesty.0004.zealous:0 "Fé inabalável em [compliment_receiver.GetFaith.HighGodName]."
 diplomacy_majesty.0005.a:0 "Algumas palavras gentis podem realmente fazer maravilhas!"
 diplomacy_majesty.0005.desc:0 "Meu elogio cuidadosamente preparado foi recompensado com um sorriso agradecido e um leve rubor nas bochechas d[Select_CString( compliment_receiver.IsFemale, 'a', 'o' )] [compliment_receiver.GetTitledFirstName]. A conversa que se seguiu foi a mais agradável que tivemos em muitos luas."
 diplomacy_majesty.0005.t:0 "$diplomacy_majesty.0004.t$: Doce como o Mel"
 diplomacy_majesty.0006.a:0 "Como pude ser tão imprudente..."
 diplomacy_majesty.0006.desc:0 "Eu pretendia que minhas palavras fossem gentis, mas a reação d[Select_CString( compliment_receiver.IsFemale, 'a', 'o' )] [compliment_receiver.GetTitledFirstName] não deixou dúvidas sobre meu fracasso. A expressão de indignação no rosto [compliment_receiver.GetHerHim] fez meu coração afundar no fundo do estômago."
 diplomacy_majesty.0006.t:0 "$diplomacy_majesty.0004.t$: Amargo como Losna"
 diplomacy_majesty.0016.a.tt:0 "O [scheme|E] terá uma [success_chance|E] aumentada"
 diplomacy_majesty.0016.a:0 "Seremos os melhores amigos!"
 diplomacy_majesty.0016.b:0 "Eu vou manipular [potential_friend.GetSheHe]..."
 diplomacy_majesty.0016.c:0 "Não preciso de amigos, tenho facas!"
 diplomacy_majesty.0016.desc:0 "Notei que [potential_friend.Custom2('MyCharacterIntroduction', ROOT.Char)] e eu parecemos pensar e agir de maneira bastante semelhante. Talvez nem sempre concordemos plenamente, mas, essencialmente, acredito que somos compatíveis.\n\nIsso poderia ser a base de uma amizade duradoura — ou uma fraqueza a ser explorada..."
 diplomacy_majesty.0016.t:0 "Espíritos Afins"
 diplomacy_majesty.1020.a:0 "Conquistarei sua lealdade inabalável."
 diplomacy_majesty.1020.b:0 "Tenho pessoas mais importantes para impressionar."
 diplomacy_majesty.1020.c:0 "O medo é uma ferramenta muito mais eficaz."
 diplomacy_majesty.1020.d:0 "Por que eu deveria me importar com o que os outros pensam de mim?"
 diplomacy_majesty.1020.desc:0 "Como [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsName], meus [ROOT.Char.Custom('GetFollowerOrVassalPlural')] me devem sua lealdade. Minha palavra é lei. Mas quanto vale a obediência sem devoção?\n\nEm tempos de crise, uma resposta lenta ou um esforço desinteressado pode levar ao desastre. Posso me dar ao luxo de correr esse risco?"
 diplomacy_majesty.1020.t:0 "Lealdade ou Medo"
 diplomacy_majesty.4030.a.failure:0 "Falho em desenvolver táticas úteis"
 diplomacy_majesty.4030.a.success:0 "Minhas novas táticas funcionam excepcionalmente bem"
 diplomacy_majesty.4030.a:0 "Preciso expandir essa teoria!"
 diplomacy_majesty.4030.b:0 "Aliados são necessários tanto na guerra quanto na paz."
 diplomacy_majesty.4030.c:0 "Simplesmente pensar assim será vantajoso."
 diplomacy_majesty.4030.desc:0 "À medida que passo mais tempo praticando a arte da diplomacia, percebo semelhanças entre a vida na [ROOT.Char.Custom('GetCourt')] e a guerra. Observar o oponente... jogadas e contrajogadas...\n\nManter esses pensamentos para mim pode me dar uma arma secreta para garantir que eu tenha o meu caminho. Alternativamente, posso compartilhar essa ideia com [Select_CString( event_target.IsFemale, 'a', 'o' )] [event_target.GetTitledFirstName] para conquistar sua boa vontade..."
 diplomacy_majesty.4030.t:0 "Uma Batalha de Ideias"
 diplomacy_majesty.4031.a:0 "Essa técnica conquistará as pessoas para o meu lado."
 diplomacy_majesty.4031.desc:0 "Depois de muitas noites de contemplação, elaborei uma estratégia sólida para provar meu ponto em um debate.\n\nComeçarei de uma posição forte adotando uma postura popular sobre um tópico incontestável e, a partir dessa posição, atacarei os argumentos do meu oponente e destacarei todas as suas falhas.\n\nFazendo isso, eliminarei todas as possíveis soluções para um problema... exceto aquela que eu favoreço."
 diplomacy_majesty.4031.t:0 "$diplomacy_majesty.4030.t$: Influência"
 diplomacy_majesty.4032.a:0 "Pelo menos esse fracasso não levou à perda de vidas."
 diplomacy_majesty.4032.desc:0 "Passei muitas noites elaborando táticas para direcionar as conversas na direção desejada, considerando as possíveis reações das pessoas ao que digo.\n\nApesar disso, toda vez que tento colocar essas estratégias em prática, as coisas nunca acontecem como eu esperava. Acho que nenhum plano sobrevive ao contato com o inimigo."
 diplomacy_majesty.4032.t:0 "$diplomacy_majesty.4030.t$: Engajamentos Imprudentes"
 diplomacy_majesty.4033.a:0 "[thinker.GetSheHe|U] tem algumas ideias fascinantes sobre diplomacia!"
 diplomacy_majesty.4033.desc:0 "Hoje, [thinker.GetTitledFirstName] se aproximou de mim com uma ideia interessante. [thinker.GetSheHe|U] diz que pode ser útil pensar em um debate na corte como uma batalha acirrada. Diferentes atores estão buscando diferentes objetivos, cada um tentando direcionar a conversa a seu favor, mas apenas um sairá vitorioso."
 diplomacy_majesty.4033.t:0 "Cadeia de Suprimentos de Ideias"
 diplomacy_majesty.4070.a:0 "Hora de estudar!"
 diplomacy_majesty.4070.b.custom:0 "Todos os [ROOT.Char.Custom('GetCourtier')] e vassalos diretos que são [close_family|E]"
 diplomacy_majesty.4070.b:0 "Contratar um tutor para me ensinar."
 diplomacy_majesty.4070.c:0 "Por que se preocupar? [ROOT.Char.GetCulture.GetNameNoTooltip] é claramente superior."
 diplomacy_majesty.4070.d:0 "Meu Tutor da Corte certamente pode me ajudar!"
 diplomacy_majesty.4070.desc:0 "Governar o [ROOT.Char.GetPrimaryTitle.GetName] multicultural traz seus próprios desafios. Os [ROOT.Char.Custom('GetCourtierPlural')] estrangeiros frequentemente se sentem alienados quando não podem falar sua língua nativa na [ROOT.Char.Custom('GetCourt')], o que gera ressentimento.\n\n[my_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] sugere que eu poderia melhorar significativamente as relações com meus [ROOT.Char.Custom('GetCourtierPlural')] [my_vassal.GetCulture.GetName] aprendendo a falar sua língua junto com a minha."
 diplomacy_majesty.4070.failure.tt:0 "Você pode optar por continuar estudando"
 diplomacy_majesty.4070.failure:0 "Falho em aprender um novo idioma"
 diplomacy_majesty.4070.success:0 "Aprendo a falar a língua [my_vassal.GetCulture.GetName]"
 diplomacy_majesty.4070.t:0 "O Encanto da Linguagem"
 diplomacy_majesty.4071.a:0 "Tempo bem gasto."
 diplomacy_majesty.4071.b:0 "Uma cultura tão fascinante... Quero aprender mais!"
 diplomacy_majesty.4071.desc:0 "Depois de muitas semanas de estudo, finalmente tenho uma compreensão sólida dos fundamentos do idioma [my_vassal.GetCulture.GetName].\n\nCom prática contínua, minha fluência melhorará, mas mesmo esse entendimento básico melhorou minhas relações com meus [ROOT.Char.Custom('GetCourtierPlural')] [my_vassal.GetCulture.GetNameNoTooltip]."
 diplomacy_majesty.4071.t:0 "$diplomacy_majesty.4070.t$: Idioma Aprendido"
 diplomacy_majesty.4072.a:0 "Preciso continuar tentando!"
 diplomacy_majesty.4072.b:0 "Meu tempo é melhor empregado em outros lugares."
 diplomacy_majesty.4072.c:0 "$diplomacy_majesty.4070.b$"
 diplomacy_majesty.4072.desc:0 "Apesar de muitas semanas de estudo, simplesmente não consigo ter uma compreensão sólida do idioma [my_vassal.GetCulture.GetName]. Aprendi algumas palavras, mas a gramática, a construção de frases... continuam me escapando. Não consigo imaginar que isso seja produtivo."
 diplomacy_majesty.4072.t:0 "$diplomacy_majesty.4070.t$: Incompreensível!"
 diplomacy_majesty.4073.a:0 "Desisto."
 diplomacy_majesty.4073.desc:0 "Por mais relutante que eu seja em admitir, simplesmente não acredito que nunca vou dominar o idioma [my_vassal.GetCulture.GetName]. Tentei e tentei, mas falhei em fazer qualquer progresso... Devo aceitar isso."
 diplomacy_majesty.4073.t:0 "$diplomacy_majesty.4070.t$: Esforços Inúteis"
 diplomacy_majesty.4090.a:0 "Apenas as melhores peles e veludos para mim!"
 diplomacy_majesty.4090.b.desc:0 "Procuro um alfaiate habilidoso no uso de materiais locais"
 diplomacy_majesty.4090.b.failure.tt:0 "Sua nova vestimenta não impressiona ninguém."
 diplomacy_majesty.4090.b.failure:0 "Adquiro uma vestimenta monótona e pouco impressionante"
 diplomacy_majesty.4090.b.success.tt:0 "Sua nova vestimenta esplêndida é verdadeiramente adequada para um[Select_CString( me.IsFemale, 'a', '' )] [me.GetTitleAsNameNoTooltip]!"
 diplomacy_majesty.4090.b.success:0 "Adquiro uma vestimenta adequada para [Select_CString( me.IsFemale, 'uma', 'um' )] [me.GetTitleAsNameNoTooltip]"
 diplomacy_majesty.4090.b:0 "As modas locais têm um significado simbólico."
 diplomacy_majesty.4090.c.zealous:0 "Os servos de [ROOT.Char.GetFaith.HighGodName] não precisam de luxo!"
 diplomacy_majesty.4090.c:0 "Eu não preciso de #EMP coisas#! para legitimar meu governo!"
 diplomacy_majesty.4090.d.lunatic.female:0 "Cintas são apenas amarras opressivas!"
 diplomacy_majesty.4090.d.lunatic.male:0 "Calças são apenas prisões para as pernas!"
 diplomacy_majesty.4090.d.lunatic.neutral:0 "Roupas são apenas uma prisão para o corpo!"
 diplomacy_majesty.4090.d.lunatic_beautiful:0 "Nenhuma roupa pode igualar minha beleza natural!"
 diplomacy_majesty.4090.desc:0 "Eu me coloco acima dos meus súditos como um governante soberano, incomparável no reino. Vestir-me com roupas e joias esplêndidas serviria como um lembrete sutil para todos de que estou no comando."
 diplomacy_majesty.4090.t:0 "Insígnias de Majestade"
 diplomacy_majesty_special.1010.a.failure.desc:0 "Exausto após me esforçar demais"
 diplomacy_majesty_special.1010.a.failure.message:0 "Fiquei exausto estudando e não me lembro de muita coisa."
 diplomacy_majesty_special.1010.a.failure.tt:0 "Você diminui sua chance de sucesso no debate final em #N 20%#!"
 diplomacy_majesty_special.1010.a.success.desc:0 "Aumento meu entendimento do assunto"
 diplomacy_majesty_special.1010.a.success.message:0 "Meus estudos foram bem e agora estou mais preparado para o debate final."
 diplomacy_majesty_special.1010.a.success.tt:0 "Você aumenta sua chance de sucesso no debate final em #P 20%#!"
 diplomacy_majesty_special.1010.a:0 "Estudar extensivamente o assunto para me preparar."
 diplomacy_majesty_special.1010.ambition.desc:0 "se a ambição é um pecado ou uma força."
 diplomacy_majesty_special.1010.b.success.desc:0 "Aumento meu entendimento d[Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetTitledFirstNameNoTooltip]"
 diplomacy_majesty_special.1010.b.success.tt:0 "Você receberá uma dica sobre qual tática escolher no debate final"
 diplomacy_majesty_special.1010.b:0 "Estudar meu oponente pode me dar uma vantagem..."
 diplomacy_majesty_special.1010.c:0 "Descansar um pouco me deixará pronto para o conflito."
 diplomacy_majesty_special.1010.chivalry.desc:0 "o valor da cavalaria."
 diplomacy_majesty_special.1010.d:0 "Vou mostrar para ess[Select_CString( debater.IsFemale, 'a', 'e' )] [debater.Custom2('InsultNoun', ROOT.Char)] quem está no comando!"
 diplomacy_majesty_special.1010.divine_attributes.desc:0 "a compatibilidade dos atributos divinos."
 diplomacy_majesty_special.1010.duty_women.desc:0 "os deveres das mulheres."
 diplomacy_majesty_special.1010.e:0 "É mais fácil deixar [debater.GetSheHe] vencer."
 diplomacy_majesty_special.1010.end.desc:0 "Nunca chegamos a lugar nenhum, apenas repetimos os mesmos argumentos uma e outra vez...\n\nChega, já é o suficiente. Da próxima vez que o assunto surgir, deve ser a última."
 diplomacy_majesty_special.1010.faith_reason.desc:0 "a relação entre fé e razão."
 diplomacy_majesty_special.1010.free_will.desc:0 "a compatibilidade do conhecimento divino com o livre arbítrio."
 diplomacy_majesty_special.1010.heroism.desc:0 "se o heroísmo é coragem ou insensatez."
 diplomacy_majesty_special.1010.inheritance.desc:0 "assuntos de direito de herança."
 diplomacy_majesty_special.1010.just_war.desc:0 "a natureza de uma guerra justa."
 diplomacy_majesty_special.1010.mapped_territory.desc:0 "o que está além da fronteira de território mapeado."
 diplomacy_majesty_special.1010.mercy.desc:0 "se a misericórdia é um sinal de fraqueza."
 diplomacy_majesty_special.1010.o.tt:0 "Você debaterá com [Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetFirstNameNoTooltip] em breve"
 diplomacy_majesty_special.1010.seven_virtues.desc:0 "a virtude mais importante entre as sete."
 diplomacy_majesty_special.1010.start.desc:0 "[debater.Custom2('MyCharacterIntroduction', ROOT.Char)|U] e eu sempre acabamos debatendo"
 diplomacy_majesty_special.1010.t:0 "Uma Desavença Tediosa"
 diplomacy_majesty_special.1011.a.desc:0 "Possíveis resultados do debate final"
 diplomacy_majesty_special.1011.a.failure.desc:0 "Se eu perder o debate final"
 diplomacy_majesty_special.1011.a.flavor:0 "Para conseguir isso, precisarei apresentar minhas ideias de uma forma que [Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetFirstNameNoTooltip] ache agradável..."
 diplomacy_majesty_special.1011.a.success.desc:0 "Se eu ganhar o debate final"
 diplomacy_majesty_special.1011.a:0 "Quero conquistar [debater.GetSheHe] para o meu lado."
 diplomacy_majesty_special.1011.b.flavor:0 "Para conseguir isso, precisarei explorar uma das fraquezas do caráter d[Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetFirstNameNoTooltip] para impedi-l[Select_CString( debater.IsFemale, 'a', 'o' )] de pensar racionalmente..."
 diplomacy_majesty_special.1011.b.rival:0 "Pode se tornar m[Select_CString( debater.IsFemale, 'inha', 'eu' )] rival"
 diplomacy_majesty_special.1011.b:0 "Quero humilhar [debater.GetSheHe] diante de todos!"
 diplomacy_majesty_special.1011.end.desc:0 "\n\nUma após a outra, as pessoas ao redor param para ouvir nossa discussão - algumas de maneira menos discreta que outras. Agora é a hora de encerrar isso de uma vez por todas.\n\nAntes de começar, devo decidir qual resultado mais desejo."
 diplomacy_majesty_special.1011.failure.desc:0 "Infelizmente, o momento é péssimo. Fiquei acordad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] até muito tarde na noite passada, tentando me preparar."
 diplomacy_majesty_special.1011.start.desc:0 "Aqui estamos novamente, como eu antecipei, discutindo sobre"
 diplomacy_majesty_special.1011.study_opponent_success.desc:0 "Que sorte que descobri que posso aproveitar d[Select_CString( debater.IsFemale, 'a', 'o' )] [debater.Custom('StrongestAIValueNoun')] d[Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetFirstName]!"
 diplomacy_majesty_special.1011.study_subject_success.desc:0 "Que sorte que minhas preparações correram tão bem - tenho alguns novos argumentos na manga!"
 diplomacy_majesty_special.1012.a.tt:0 "Funciona bem contra aqueles que são racionais, egoístas, céticos ou de coração frio."
 diplomacy_majesty_special.1012.a:0 "... construir meu argumento com base na lógica."
 diplomacy_majesty_special.1012.b.tt:0 "Funciona bem contra aqueles que são ousados, enérgicos, vingativos ou desonrados."
 diplomacy_majesty_special.1012.b:0 "... manter a calma, aconteça o que acontecer."
 diplomacy_majesty_special.1012.c.tt:0 "Funciona bem contra aqueles que são honrados, bondosos, perdoadores, crentes ou falta de ambição."
 diplomacy_majesty_special.1012.c:0 "... apelar para valores superiores."
 diplomacy_majesty_special.1012.d.tt:0 "Funciona bem contra aqueles que são cautelosos, apáticos ou ignorantes."
 diplomacy_majesty_special.1012.d:0 "... ouvir atentamente as palavras [debater.GetHerHim]."
 diplomacy_majesty_special.1012.desc:0 "Levando em consideração o que sei sobre as fraquezas d[Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetFirstName], acredito que a forma mais eficaz de conquistar [debater.GetSheHe] é..."
 diplomacy_majesty_special.1012.generic.tt:0 "A eficácia da tática depende de quão bem ela se adequa à personalidade d[Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetTitledFirstName]."
 diplomacy_majesty_special.1013.a.compassionate:0 "Fico feliz que possamos deixar isso para trás."
 diplomacy_majesty_special.1013.a.cruel:0 "Como é fácil manipular os fracos."
 diplomacy_majesty_special.1013.calm.desc:0 "Independentemente de como [Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetFirstName] me provocava, mantive minhas emoções sob controle, respondendo de maneira calma e tranquila. Isso impressionou os espectadores, que começaram a acenar e concordar enquanto eu falava. Então [Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetFirstName] começou a ouvir, e logo [debater.GetSheHe] estava impressionad[Select_CString( debater.IsFemale, 'a', 'o' )] também."
 diplomacy_majesty_special.1013.higher_values.desc:0 "Sabendo que [Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetFirstName] se preocupa com o bem maior, apelou para os valores superiores que [debater.GetSheHe] tanto preza. Com essa perspectiva, [debater.GetSheHe] finalmente viu os méritos dos meus argumentos."
 diplomacy_majesty_special.1013.listen.desc:0 "Sabendo que [Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetFirstName] não tem a firmeza necessária para se manter em debates, fiz o que ninguém havia feito - eu ouvi [debater.GetSheHe]. Ser levad[Select_CString( debater.IsFemale, 'a', 'o' )] a sério agradou muito [debater.GetSheHe], e uma vez que [debater.GetSheHe] terminou, [debater.GetSheHe] me ouviu felizmente em troca."
 diplomacy_majesty_special.1013.logic.desc:0 "Ao ilustrar claramente como uma ideia segue a outra, construí meu argumento tão forte quanto as paredes de um [ROOT.Char.Custom('FortifiedBuilding')]. Uma vez que cheguei ao meu ponto, [debater.GetFirstName] não pôde fazer nada além de concordar."
 diplomacy_majesty_special.1014.a.tt:0 "#F Funciona bem contra aqueles que são cautelosos, bondosos, perdoadores e apáticos.#!"
 diplomacy_majesty_special.1014.a:0 "... agir de forma impiedosa e assustar [debater.GetSheHe]."
 diplomacy_majesty_special.1014.b.tt:0 "#F Funciona bem contra aqueles que são ousados, enérgicos, vingativos e honrados.#!"
 diplomacy_majesty_special.1014.b:0 "... provocar [debater.GetSheHe] até que [debater.GetSheHe] perca a paciência."
 diplomacy_majesty_special.1014.c.tt:0 "#F Funciona bem contra aqueles que são desonrados, de coração frio, egoístas ou céticos.#!"
 diplomacy_majesty_special.1014.c:0 "... apontar as falhas de caráter [debater.GetHerHim]."
 diplomacy_majesty_special.1014.d.tt:0 "#F Funciona bem contra aqueles que são ignorantes, crentes ou falta de ambição.#!"
 diplomacy_majesty_special.1014.d:0 "... exagerar a posição [debater.GetHerHim]."
 diplomacy_majesty_special.1014.desc:0 "Levando em consideração o que sei sobre as fraquezas d[Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetFirstName], acho que a maneira mais eficaz de humilhar [debater.GetSheHe] diante de todos é..."
 diplomacy_majesty_special.1014.generic.tt:0 "#F A eficácia da tática depende de quão bem ela explora as fraquezas d[Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetTitledFirstName].#!"
 diplomacy_majesty_special.1015.a.compassionate:0 "Talvez eu tenha sido um pouco duro demais..."
 diplomacy_majesty_special.1015.a.cruel:0 "Ah, aquele olhar no rosto [debater.GetHerHim]! Impagável!"
 diplomacy_majesty_special.1015.exaggerate.desc:0 "Em vez de desenvolver minha própria posição, concentrei-me em distorcer e exagerar a d[Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetFirstName]. No começo, [debater.GetSheHe] não percebeu e continuou defendendo pontos de vista cada vez mais absurdos. Quando finalmente apresentei minha própria posição, eu já tinha a plateia do meu lado."
 diplomacy_majesty_special.1015.low_character.desc:0 "Em vez de responder às alegações d[Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetFirstName] com fatos e lógica, estabeleci paralelos entre as opiniões [debater.GetHerHim] e suas falhas de caráter. Como as atitudes [debater.Custom2('InsultAdjective', ROOT.Char)] [debater.GetHerHim] são amplamente conhecidas, isso logo manchou a visão da plateia em relação à posição [debater.GetHerHim], não importa o que [debater.GetSheHe] dissesse."
 diplomacy_majesty_special.1015.provoke.desc:0 "Foi quase fácil demais deixar [Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetFirstName] furios[Select_CString( debater.IsFemale, 'a', 'o' )]. Uma vez que [debater.GetSheHe] percebeu o olhar horrorizado no rosto de nossa plateia, já era tarde demais. Eu parecia um exemplo de sabedoria em comparação, e mal precisei me esforçar."
 diplomacy_majesty_special.1015.scare.desc:0 "Eu poderia ter sido um pouco mais sutil, mas minhas ameaças veladas e respostas cruéis com certeza funcionaram. [debater.GetFirstName] mal conseguia articular seus próprios pontos, quanto mais se opor aos meus!"
 diplomacy_majesty_special.1016.a:0 "Que vergonha..."
 diplomacy_majesty_special.1016.calm.desc:0 "manter a calma, as opiniões ultrajantes d[Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetFirstName] logo me deixaram tremendo de raiva. Que [debater.Custom2('InsultNoun', ROOT.Char)] [debater.Custom2('InsultAdjective', ROOT.Char)]!"
 diplomacy_majesty_special.1016.end.desc:0 "\n\nNão importava que eu estivesse cert[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] - [debater.GetFirstName] conquistou a plateia e eles aceitaram suas palavras sem questionar."
 diplomacy_majesty_special.1016.exaggerate.desc:0 "distorcer as opiniões d[Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetFirstName] contra [debater.GetSheHe], acabei jogando exatamente no jogo [debater.GetHerHim]."
 diplomacy_majesty_special.1016.higher_values.desc:0 "apelar para os valores superiores d[Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetFirstName], [debater.GetFirstName] mudou o jogo ao me acusar de tentar desviar o assunto."
 diplomacy_majesty_special.1016.listen.desc:0 "ouvir atentamente, [debater.GetFirstName] só falava sem sentido, como de costume. Enquanto eu fantasiava sobre coisas que preferiria estar fazendo, [debater.GetFirstName] parecia ter apresentado alguns bons pontos."
 diplomacy_majesty_special.1016.logic.desc:0 "usar a lógica para convencer [Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetFirstName], [debater.GetSheHe] estava emocionalmente envolvido demais para enxergar claramente."
 diplomacy_majesty_special.1016.low_character.desc:0 "mudar o foco para as falhas de caráter d[Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetFirstName], acabou que ninguém mais pensava assim. Em vez disso, a plateia começou a defender [debater.GetSheHe]!"
 diplomacy_majesty_special.1016.provoke.desc:0 "provocar [Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetFirstName], [debater.GetSheHe] permaneceu calm[Select_CString( debater.IsFemale, 'a', 'o' )]. Isso impressionou nosso público, enquanto eu parecia apenas mesquinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 diplomacy_majesty_special.1016.scare.desc:0 "amedrontar [Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetFirstName], [debater.GetSheHe] só riu e acabei parecendo mesquinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] e tol[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 diplomacy_majesty_special.1016.start.desc:0 "Apesar de todos os meus esforços para"
 diplomacy_majesty_special.1050.message:0 "Nunca tive a chance de testar minhas habilidades de debate contra [Select_CString( debater.IsFemale, 'a', 'o' )] [debater.GetTitledFirstName]."
 diplomacy_majesty_special.1050.title:0 "Debate Terminou sem Conclusão"
