l_spanish:
 journey_bellicose_modifier:0 "Respeito Marcial"
 journey_bellicose_modifier_desc:0 "Este personagem testemunhou cavaleiros em ação, e isso o deixou maravilhado."
 journey_blame_game_modifier:0 "Nobre Impopular"
 journey_blame_game_modifier_desc:0 "Este personagem é profundamente impopular entre a população local, e muitos rumores sobre ele estão se espalhando."
 journey_blame_game_province_modifier:0 "Governante Popular"
 journey_blame_game_province_modifier_desc:0 "O governante do condado se tornou cada vez mais popular depois que as histórias sobre como lutam pelo povo se espalharam pela cidade."
 journey_bureaucratic_modifier:0 "Arquiteto Aspirante"
 journey_bureaucratic_modifier_desc:0 "Este personagem viu o planejamento avançado de um projeto de construção local."
 journey_communal_modifier:0 "Patrono da Comunidade"
 journey_communal_modifier_desc:0 "Este personagem reúne seu povo nos momentos de necessidade.\nCusto de [activity|E] [GetActivityType('activity_camp_party').GetName]: #P -20%#!\nCusto da [activity|E] [GetActivityType('activity_feast').GetName]: #P -20%#!"
 journey_courtly_modifier:0 "Conhecedor da Corte"
 journey_courtly_modifier_desc:0 "Este personagem aprecia uma corte bem administrada."
 journey_drink_and_circus_modifier:0 "Bebida e Circo"
 journey_drink_and_circus_modifier_desc:0 "Este condado viu um aumento na distribuição de álcool para as tabernas locais por seu senhor, alguns dizem até pessoalmente."
 journey_egalitarian_modifier:0 "Defensor Universal"
 journey_egalitarian_modifier_desc:0 "Este personagem viu os benefícios de uma sociedade diversa.\nCusto de Recrutamento de [courtier|E]: #P -10%#!"
 journey_events.10.a:0 "Um bom cavalo de guerra, isso seria perfeito."
 journey_events.10.b:0 "Agora, cães, eles são verdadeiros companheiros."
 journey_events.10.c:0 "Um falcão de caça é exatamente o que preciso."
 journey_events.10.d:0 "Não tenho interesse em um animal de estimação."
 journey_events.10.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], notei que você está em grande necessidade de um companheiro de viagem.\" Eu ouço [Select_CString( provider_character.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('provider_character'))], [provider_character.GetFirstName], dizer ao entrar no meu escritório. [provider_character.GetSheHe|U] me lança um olhar de entendimento, \"Há uma caravana de mercadores passando por [ROOT.Char.GetCapitalLocation.GetName] hoje, e vi que tinham uma grande seleção de animais à venda.\"\n\nQuando peço mais detalhes, [provider_character.GetSheHe] menciona os cães, cavalos e falcões de todos os tamanhos que [provider_character.GetSheHe] viu. Refletindo sobre isso, penso comigo mesmo, talvez um companheiro para minhas viagens seja exatamente o que preciso."
 journey_events.10.t:0 "Um Companheiro para o Ar Livre"
 journey_events.11.a:0 "Acho que seremos bons amigos, com o tempo."
 journey_events.11.desc:0 "Após um ou dois dias, finalmente me é apresentado um grande e poderoso cavalo. Assim que ele é entregue a mim, sinto a vontade indomável da criatura me desafiando.\n\nPor um momento, temo ser derrubado, mas no final, consigo segurar, embora por pouco. A criatura então me olha com o que só posso descrever como um lampejo de respeito."
 journey_events.11.t:0 "Um Companheiro para o Ar Livre: Cavalo"
 journey_events.12.a:0 "É um pouco pequeno, não é?"
 journey_events.12.desc:0 "Após um ou dois dias, finalmente me é apresentado uma pequena caixa. Ela se mexe levemente quando me aproximo, e após alguma hesitação, finalmente a abro para encontrar meu novo pequeno companheiro.\n\nAssim que a tampa é removida, o filhote pula para fora e começa a correr pelo quarto com energia. Depois de um minuto ou mais, ele para, cai de lado e começa a cochilar."
 journey_events.12.t:0 "Um Companheiro para o Ar Livre: Cão"
 journey_events.20.a:0 "Isso é interessante..."
 journey_events.20.desc:0 "Já está bem tarde no dia, quando [Select_CString( informer_character.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('informer_character'))] [informer_character.GetFirstName] se aproxima de mim com um brilho nos olhos.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ouvi um rumor que pode lhe interessar.\"\n\n[informer_character.GetSheHe|U] então compartilha como [informer_character.GetSheHe] ouviu uma história sobre fenômenos astronômicos aparecendo regularmente nos céus acima de [destination_province.GetName] recentemente. Embora os detalhes do fenômeno sejam um pouco vagos, dizem que é uma experiência única na vida."
 journey_events.20.t:0 "Nos Céus Acima"
 journey_events.30.a.loss:0 "Eles me pegam 'exagerando'"
 journey_events.30.a.tt:0 "Você acha que talvez tenha estado no [traveller_province.Custom('journey_events_30_short_custom_loc')] de [traveller_province.GetNameNoTooltip], mas isso não fará uma boa história. Talvez seja necessário um pouco de exagero..."
 journey_events.30.a.win:0 "Convenço-os de que sei tudo sobre isso"
 journey_events.30.a:0 "O [traveller_province.Custom('journey_events_30_short_custom_loc')] de [traveller_province.GetNameNoTooltip]? Oh, deixe-me contar tudo sobre isso!"
 journey_events.30.b:0 "Acho que talvez tenha ido?"
 journey_events.30.c:0 "Não, me conte tudo sobre isso, [character_2.GetFirstNameNoTooltip]."
 journey_events.30.desc:0 "Entro e vejo [Select_CString( character_1.IsFemale, 'a', 'o' )] [character_1.GetFirstName] e [Select_CString( character_2.IsFemale, 'a', 'o' )] [character_2.GetFirstName] conversando animadamente. \"Sério? Em [traveller_province.GetName], você diz?\" Assim que me percebem, [character_1.GetFirstNameNoTooltip] se volta para mim e pergunta: \"Você já esteve lá em uma de suas viagens, não é, [ROOT.Char.GetFirstName]?\"\n\n\"Veja, [character_2.GetFirstNameNoTooltip] me conta que [character_2.GetSheHe] viu [traveller_province.Custom('journey_events_30_custom_loc')] em [traveller_province.GetNameNoTooltip]. Você já viu algo assim?\""
 journey_events.30.t:0 "Uma História ou Duas"
 journey_events.40.a.tt:0 "Alguns [counties|E] em seu [realm|E] ganharão [GetModifier( 'journey_local_bard_modifier' ).GetNameWithTooltip] por #high 3 anos#!"
 journey_events.40.a:0 "Você está certo, todos merecem ouvir minhas histórias..."
 journey_events.40.b:0 "Consigo pensar em formas melhores de gastar meu dinheiro, [suggester_character.GetFirstNameNoTooltip]."
 journey_events.40.desc:0 "\"[Select_CString( ROOT.Char.IsFemale, 'Minha senhora', 'Meu senhor' )],\" [Select_CString( suggester_character.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('suggester_character'))], [suggester_character.GetFirstName] me dirige, ao entrar na sala. \"Todos na corte sabem como você gosta de compartilhar suas histórias e feitos de viagem, para grande prazer de todos, asseguro-lhe.\"\n\n[suggester_character.GetSheHe|U] continua, \"Ouvi falar de um bardo local que se tornou particularmente popular ultimamente. Um tipo de ministrel que os camponeses gostam. Com a motivação certa, talvez ele possa começar a compartilhar algumas das suas histórias pelo reino?\""
 journey_events.40.t:0 "Um Bardo Local"
 journey_events.50.a.loss:0 "Fui pego usando trapos"
 journey_events.50.a.win:0 "Eu me escapo"
 journey_events.50.a:0 "Já é tarde demais para voltar atrás."
 journey_events.50.b.tt:0 "O que houve comigo? Claro que não vou me sentar com camponeses e servos!"
 journey_events.50.b:0 "Não, eu não posso ser visto com algo assim!"
 journey_events.50.desc:0 "Por muito tempo, pondero sobre como meus súditos interagem entre si, fora da vista de seus superiores. Após devida consideração, encontro o momento certo para sair discretamente, com alguns trapos que posso usar como disfarce.\n\nMas à medida que o momento se aproxima, começo a reconsiderar. Isso é algo que condiz com [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]?"
 journey_events.50.t:0 "Uma Noite em [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]"
 journey_events.51.a.big_win:0 "Eu ganho quase todos os jogos"
 journey_events.51.a.loss:0 "Perco mais do que ganho"
 journey_events.51.a.tt:0 "Hora de pegar o pouco que eles têm. Quase tão bom quanto taxá-los!"
 journey_events.51.a.win:0 "Eu ganho alguns jogos aqui e ali"
 journey_events.51.a:0 "Bem, vou mostrar a eles como um nobre joga."
 journey_events.51.b.tt:0 "Já vi camponeses o suficiente para uma vida inteira."
 journey_events.51.b:0 "É hora de terminar minha bebida e ir para casa."
 journey_events.51.desc:0 "Encontro um prédio sujo, mas popular, enquanto percorro as ruas. Assim que entro, me entregam um pouco de álcool e a multidão me empurra para uma cadeira no canto. Ninguém me deu uma segunda olhada durante todo o processo.\n\nSento-me sozinho, observando os outros no local. Um grupo barulhento está reunido ao redor de uma mesa grande, onde vários camponeses parecem se divertir em um jogo de dados."
 journey_events.52.a.tt:0 "Basta manter o álcool fluindo até que parem de reclamar!"
 journey_events.52.a:0 "Acho que é hora de mais uma rodada!"
 journey_events.52.b.tt:0 "Vou provar como eles estão errados sobre mim!"
 journey_events.52.b:0 "Bem, na verdade... eu #bold sou#! [ROOT.Char.GetTitledFirstNameNoTooltip]."
 journey_events.52.c.chancellor:0 "Ouvi bastante sobre o corrupto [threat_1.GetCouncilTitle] [threat_1.GetFirstNameNoTooltip]..."
 journey_events.52.c.chaplain:0 "Rumores estão circulando sobre os atos pecaminosos de [threat_1.GetCouncilTitle] [threat_1.GetFirstNameNoTooltip]..."
 journey_events.52.c.fallback:0 "Ouvi dizer que o verdadeiro culpado é [threat_1.GetCouncilTitle] [threat_1.GetFirstNameNoTooltip]."
 journey_events.52.c.marshal:0 "Vi [threat_1.GetCouncilTitle] [threat_1.GetFirstNameNoTooltip] bater até a morte uma pessoa na rua..."
 journey_events.52.c.spymaster:0 "Ouvi coisas realmente sujas sobre [threat_1.GetCouncilTitle] [threat_1.GetFirstNameNoTooltip]..."
 journey_events.52.c.steward:0 "Dizem que [threat_1.GetCouncilTitle] [threat_1.GetFirstNameNoTooltip] está cobrando impostos extras para dar a [threat_1.GetHerselfHimself]..."
 journey_events.52.c.tt:0 "Esta é uma oportunidade de culpar outra pessoa, como aquel[Select_CString( threat_1.IsFemale, 'a', 'e' )] idiota [threat_1.GetFirstNameNoTooltip]."
 journey_events.52.c:0 "Dizem que [Select_CString( threat_1.IsFemale, 'a', 'o' )] [threat_1.GetTitledFirstNameNoTooltip] está levando pessoalmente todos os nossos impostos para [threat_1.GetHerselfHimself]..."
 journey_events.52.desc:0 "Embora animado e divertido no início, todos ao redor da mesa ficam frustrados e irritados à medida que bebem mais e a noite avança. Um[Select_CString( local_gambler.IsFemale, 'a', '' )] deles, [local_gambler.GetFirstNameNoTooltip], levanta-se e proclama em voz alta, \"Malditos nobres! Eles nem sabem como é para nós #bold normais#! pessoas! Particularmente aquel[Select_CString( ROOT.Char.IsFemale, 'a', 'e' )] [ROOT.Char.GetTitledFirstName] inútil!\"\n\nSinto-me encolher na cadeira enquanto um coro de concordância ecoa ao redor da mesa. [local_gambler.GetFirstNameNoTooltip] percebe isso e, ao se virar para mim, pergunta, \"O que você acha?\""
 journey_events.53.a.tt:0 "É hora de ir para casa antes que alguém fique muito preocupado comigo desaparecido."
 journey_events.53.a:0 "Huh, me pergunto quando [local_gambler.GetSheHe] percebeu."
 journey_events.53.desc:0 "Peço rodada após rodada até que todos tenham desmaiado ou ido embora. No final, apenas [Select_CString( local_gambler.IsFemale, 'a', 'o' )] [local_gambler.GetFirstNameNoTooltip] e eu ainda estamos sentados à mesa. [local_gambler.GetSheHe|U] mal consegue se manter ereto no final, mas ainda me lança um olhar torto.\n\n\"Você não é tão ruim para um nobre.\" [local_gambler.GetSheHe|U] finalmente murmura antes de sua cabeça cair sobre a mesa, e [local_gambler.GetSheHe] desmaia também."
 journey_events.54.a:0 "Que noite produtiva!"
 journey_events.54.desc:0 "No começo, as tensões estão altas. Mas depois de contar histórias de minhas viagens e pedir várias rodadas de bebida, começo a sentir as pessoas relaxando. Depois de um tempo, a taverna tem uma atmosfera alegre, e as pessoas fazem todo tipo de pergunta.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], se me permite dizer...\" [local_gambler.GetFirstNameNoTooltip] começa cautelosamente, \"Temos uma milícia local aqui em [ROOT.Char.GetCapitalLocation.GetNameNoTooltip], e ficaríamos felizes em servi-lo de maneira mais direta.\"\n\nApesar das minhas tentativas de repreendê-los, eles insistem na oferta. Quando o taverneiro finalmente fecha o bar, todos parecem estar de ótimo humor, enquanto lentamente saem pela porta."
 journey_events.55.a:0 "Essa ideia toda foi um erro..."
 journey_events.55.desc:0 "Tento aliviar a tensão na sala quando de repente sinto o primeiro soco— o primeiro de muitos.\n\nApós uma barragem de socos e chutes, sou jogado para o beco dos fundos. Mal consigo sentir meu rosto, e não consigo voltar a ficar de pé.\n\nApós várias horas agonizantes, alguns guardas passam, e um deles de alguma forma reconhece meu rosto. Eles me ajudam a me levantar e me guiam de volta para casa."
 journey_events.56.a.tt:0 "Uma noite produtiva, agora é hora de ir para casa antes que alguém se preocupe demais comigo."
 journey_events.56.a:0 "Isso é tudo o que [threat_1.GetSheHe] merece."
 journey_events.56.desc:0 "No começo, eu estava apenas tentando fazer algumas piadas menores sobre o caráter d[Select_CString( threat_1.IsFemale, 'a', 'o' )] [threat_1.GetFirstName], mas depois de um tempo, comecei a me empolgar. Já não era mais uma fachada falsa para transferir a culpa, mas sim o fato de eu detestar aquel[Select_CString( threat_1.IsFemale, 'a', 'e' )] [threat_1.GetWomanMan].\n\nÀ medida que continuo criando minhas histórias sobre a privação [threat_1.GetHerHim], começo a adicionar como é difícil para [ROOT.Char.GetTitledFirstName], eu, lidar com a corrupção [threat_1.GetHerHim].\n\nNo final da noite, as pessoas saem com uma opinião significativamente diferente sobre [Select_CString( threat_1.IsFemale, 'a', 'o' )] [threat_1.GetFirstName] e sobre mim."
 journey_events.57.a.tt:0 "Bem... Não tão produtivo quanto eu esperava, mas uma noite memorável, pelo menos..."
 journey_events.57.a:0 "Quem diria que eu era tão impopular?"
 journey_events.57.desc:0 "Apesar dos meus melhores esforços em transferir a culpa para meu [threat_1.GetCouncilTitle], [threat_1.GetFirstName], continuo sendo interrompido por uma pessoa ou outra. Elas ficam injetando algo sobre o meu caráter ou algum rumor sobre mim.\n\nAntes que eu percebesse, a noite estava terminando e todos estavam saindo com uma opinião ainda pior sobre mim do que quando comecei. Como isso aconteceu?"
 journey_events.60.desc_bellicose:0 "Dou de cara com um acampamento e observo um grupo de cavaleiros em treinamento. Eles duelam entre si, e seus movimentos demonstram brutalidade, mas também graça, movendo-se em quase perfeita sincronia. O comandante os observa com orgulho, e o respeito mútuo entre eles é palpável."
 journey_events.60.desc_bureaucratic:0 "Alunos locais correm pela cidade, carregando pergaminhos e livros. Um deles deixa cair algo, sem perceber. Antes que eu tente devolver, noto um projeto detalhado no [ROOT.Char.Custom('GetWritingMaterial')] que chama minha atenção. Parece ser um plano para um novo edifício em [journey_county.GetNameNoTierNoTooltip], com recursos tão avançados que eu esperaria ver apenas vindos da mente de um mestre arquiteto. Nenhum dos estudantes aparenta ter mais de 18 anos, mas já dominaram um ofício que levaria a maioria uma vida inteira."
 journey_events.60.desc_communal:0 "um grito assustador é ouvido, e as pessoas correm até a origem. Eu sigo junto e testemunho uma mulher segurando seu bebê em frente a uma casa em chamas. Os outros não perdem tempo e pegam baldes de água, até mesmo nobres sujam as mãos. O fogo é apagado rapidamente, mas o lar da mãe se perde. Os moradores se reúnem em torno dela e da criança, oferecendo o pouco que têm para ajudá-las a recomeçar."
 journey_events.60.desc_courtly:0 "Entro na corte de [journey_county.GetHolder.GetNamePossessive] e observo [journey_county.GetHolder.GetHerHim] presidindo sobre ela. Os lordes e damas de [journey_county.GetHolder.GetPrimaryTitle.GetNameNoTierNoTooltip] se reúnem em torno de [journey_county.GetHolder.GetHerHim] solenemente, enquanto os peticionários começam a chegar. Todos se apresentam ao [journey_county.GetHolder.GetTitleTierName] com dignidade, ainda que para pedir ouro ou apoio [journey_county.GetHolder.GetHerHim]. Não importa quão entediante ou trivial seja o pedido, [journey_county.GetHolder.GetSheHe] escuta atentamente e oferece um julgamento justo."
 journey_events.60.desc_egalitarian:0 "Decido fazer uma rápida parada em uma taverna local, entrando diretamente em uma discussão. Pelos sotaques e vestimentas, os frequentadores têm poucas semelhanças. Ainda assim, a conversa é bastante civilizada e animada, e não há julgamentos, como se todos tivessem vindo do mesmo ventre. As pessoas são tratadas como viajantes em [journey_county.GetNameNoTierNoTooltip], e não como outro [journey_culture.GetNameNoTooltip] ou [ROOT.Char.GetCulture.GetNameNoTooltip]."
 journey_events.60.desc_intro:0 "Ultimamente, tenho sido tomado por uma sensação de inquietação. Os [journey_province.Custom('TerrainTypeProvincePrefix')] [journey_county.Custom('TerrainTypeCountyScopePlural')] em [journey_county.GetNameNoTierNoTooltip] têm sido encantadores, mas não conseguem preencher o vazio incessante.\n\nEnquanto sigo com meus afazeres habituais, "
 journey_events.60.desc_spiritual:0 "Encontro um grupo de camponeses e monges reunidos em círculo. Seus hinos suaves preenchem o ar, embora eu não consiga distinguir se estão cantando em louvor a [ROOT.Char.GetFaith.HighGodName] ou a outra divindade. Ao observar mais de perto, percebo que alguns camponeses têm posição social mais elevada, com alguns até vestindo trajes da nobreza. Ainda assim, todos parecem em estado de paz, unidos pela reverência ao divino."
 journey_events.60.desc_stoic:0 "Vejo crianças brincando nas ruas, com exceção de uma, que parece ser o alvo das brincadeiras. Ele é empurrado, suas roupas estão rasgadas, mas ele permanece calmo e sereno. Simplesmente se levanta, se sacode e continua seu caminho, para o espanto dos outros, que perdem o interesse nele."
 journey_events.60.opt:0 "Talvez eu possa aprender algo com esses [journey_culture.GetCollectiveNounNoTooltip]."
 journey_events.60.opt_b:0 "Vi tantas coisas em minhas viagens."
 journey_events.60.t:0 "Iluminação"
 journey_events_30_custom_loc_desert:0 "um antigo e imponente megalito"
 journey_events_30_custom_loc_fallback:0 "uma bela arco natural"
 journey_events_30_custom_loc_forest:0 "a grande floresta"
 journey_events_30_custom_loc_mountains:0 "vistas fantásticas da encosta da montanha"
 journey_events_30_custom_loc_oasis:0 "um memorável oásis verdejante"
 journey_events_30_short_custom_loc_desert:0 "megalito"
 journey_events_30_short_custom_loc_fallback:0 "arco"
 journey_events_30_short_custom_loc_forest:0 "grande floresta"
 journey_events_30_short_custom_loc_mountains:0 "vistas"
 journey_events_30_short_custom_loc_oasis:0 "oásis"
 journey_events_50_event_chain_begins_tt:0 "Viajo para [rootscope.GetCapitalLocation.GetName]"
 journey_local_bard_modifier:0 "Bardo Local"
 journey_local_bard_modifier_desc:0 "Um bardo está compartilhando as histórias de viagem do governante, para grande prazer dos locais."
 journey_pauper_king_modifier:0 "O Rei Mendigo"
 journey_pauper_king_modifier_desc:0 "Supostamente particularmente popular entre seus camponeses e servos devido às muitas histórias de suas interações amigáveis e pessoais com aqueles das classes mais baixas."
 journey_spiritual_modifier:0 "Reverência Divina"
 journey_spiritual_modifier_desc:0 "Este personagem aprecia a presença de um poder superior."
 journey_stoic_modifier:0 "Determinação Inabalável"
 journey_stoic_modifier_desc:0 "Este personagem pratica a arte do estoicismo."
 local_militia_name_default:0 "Milícia Local"
 wayfarer_astronomical_phenomenon:0 "Fenômeno Astronômico"
 wayfarer_astronomical_phenomenon_desc:0 "#emp Durante uma [activity|E] [GetActivityType('activity_roaming').GetName] você experimentará um evento único neste [barony|E]#!\n\nAs histórias afirmam que esta província possui fenômenos astronômicos incríveis regularmente."
