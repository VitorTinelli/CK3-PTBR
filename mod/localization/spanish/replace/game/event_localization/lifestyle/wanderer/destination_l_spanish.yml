 destination_events.10.a.tt:0 "[aptitude|E] de [travel_leader_character.GetUINamePossessive|U] é [travel_leader_character.GetCourtPositionAptitude( GetCourtPositionType( 'travel_leader_court_position' ) )]"
 destination_events.10.a:0 "Vamos contratar este viajante, então."
 destination_events.10.b:0 "[travel_leader_character.GetSheHe|U] não me interessa."
 destination_events.10.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [Select_CString( provider_character.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('provider_character'))], [provider_character.GetFirstName], começa enquanto [provider_character.GetSheHe] entra em meu escritório. \"Recentemente, tive alguns negócios com um mestre de caravanas que talvez interesse suas viagens. [travel_leader_character.GetSheHe|U] já viajou por todos os cantos e possui a experiência que estávamos buscando.\"\n\nTemos enfrentado dificuldades para encontrar alguém para liderar minhas viagens; talvez essa seja uma boa oportunidade?"
 destination_events.10.t:0 "Viajante Experiente"
 destination_events.20.a:0 "Com eles, podemos ter uma jornada lenta e cuidadosa."
 destination_events.20.b:0 "Vamos ver se conseguimos trocá-los por alguns cavalos."
 destination_events.20.c:0 "Venda os suprimentos extras."
 destination_events.20.desc:0 "\"O quê? Suprimentos extras, você disse?\" Respondo enquanto m[Select_CString( provider_character.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('provider_character'))], [provider_character.GetFirstName], menciona uma recente descoberta em um dos meus depósitos.\n\n\"De fato, não está claro por que estavam ausentes de nossos registros. Mas é uma pequena bênção. Alguma ideia do que quer fazer com eles?\"\n\nEsses suprimentos extras podem ser úteis em minha próxima jornada."
 destination_events.20.t:0 "Preparando-se para uma Excursão"
 destination_events.30.a.tt:0 "Você pode ganhar Experiência extra no [wanderer_lifestyle|E] se visitar [journey_province.GetName] em uma [GetActivityType('activity_journey').GetName]"
 destination_events.30.a:0 "Parece um lugar memorável!"
 destination_events.30.desc:0 "Recentemente, me deparei com um pequeno itinerário de viagem que descreve a jornada de um comerciante local à cidade de [journey_province.GetName]. Ele relata em detalhes como [ROOT.Char.GetSheHe] visitou [journey_province.GetHolding.GetSpecialBuildingType.GetName] e todas as atrações locais que se deve ver na cidade.\n\nTalvez esse seja o destino da minha próxima viagem quando eu voltar à estrada..."
 destination_events.30.t:0 "A Jornada para [journey_province.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
 destination_events.30.toast.title:0 "A Jornada para [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip]"
 destination_events.40.a:0 "Isso tornará a próxima jornada muito mais agradável!"
 destination_events.40.b:0 "Aprender outro idioma parece muito trabalho..."
 destination_events.40.desc:0 "Por algum motivo, me peguei relembrando minha jornada a [poi_province.GetName] e, especialmente, o idioma [poi_province.GetCulture.GetLanguage.GetName] que ouvi com tanta frequência enquanto estava lá. Havia algo #emp [poi_province.Custom('DestinationInspiredLanguageDescriptor')]#! nisso que não consigo esquecer.\n\nComo o destino quis, [Select_CString( teacher_character.IsFemale, 'uma erudita', 'um erudito' )] [teacher_character.GetCulture.GetName] chamad[Select_CString( teacher_character.IsFemale, 'a', 'o' )] [teacher_character.GetFirstName] veio visitar minha corte. Eu poderia pedir os serviços [teacher_character.GetHerHim] e, talvez, [teacher_character.GetSheHe] pudesse me ensinar [poi_province.GetCulture.GetLanguage.GetNameNoTooltip]."
 destination_events.40.t:0 "O Idioma [poi_province.GetCulture.GetLanguage.GetNameNoTooltip]"
 destination_excursion_safety_modifier:0 "Preparado para Excursões: Segurança"
 destination_excursion_safety_modifier_desc:0 "#emp Desaparecerá após alcançar um [destination|E]#!\nSuprimentos foram reservados para a próxima jornada, garantindo uma viagem segura."
 destination_excursion_speed_modifier:0 "Preparado para Excursões: Velocidade"
 destination_excursion_speed_modifier_desc:0 "#emp Desaparecerá após alcançar um [destination|E]#!\nCavalos extras foram preparados para a próxima jornada, garantindo uma viagem rápida e eficiente."
 destination_inspired_by_language:0 "Inspirado pelo Idioma"
 destination_inspired_by_language_desc:0 "Este personagem foi inspirado a aprender um novo idioma por uma jornada a terras estrangeiras."
