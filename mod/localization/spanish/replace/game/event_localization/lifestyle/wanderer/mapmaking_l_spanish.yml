l_spanish:
 map_artifact_beginning_external:0 "[newly_created_artifact.GetDesc] para as terras de [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTier]. Ele é acompanhado de um mapa detalhado também desenhado pela mão [author.GetHerHim].\nEsta é a história de uma jornada por"
 map_artifact_beginning_far_eastern:0 "Este manuscrito de folha de palma é um itinerário de uma jornada realizada por [author.GetFullName]"
 map_artifact_beginning_internal:0 "[newly_created_artifact.GetDesc] dentro do reino de [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTier]. Ele é acompanhado de um mapa detalhado também desenhado pela mão [author.GetHerHim].\nEsta é a história de uma jornada por"
 map_artifact_beginning_western:0 "Este pequeno livro encadernado em couro é um itinerário com um mapa dobrado dentro. Juntos, o mapa e o livro ilustram a jornada de [author.GetFullName]"
 map_artifact_danger_type_desert:0 "[newly_created_artifact.GetDesc] desertos implacáveis, sem água ou abrigo,"
 map_artifact_danger_type_end:0 "[newly_created_artifact.GetDesc] e a opinião d[Select_CString( author.IsFemale, 'a', 'o' )] [author.GetFirstNamePossessiveNoTooltip] sobre como lidar da melhor maneira com tais coisas.\n\n"
 map_artifact_danger_type_farmlands:0 "[newly_created_artifact.GetDesc] terras agrícolas férteis, de forma que poderiam sustentar qualquer séquito,"
 map_artifact_danger_type_fighting:0 "[newly_created_artifact.GetDesc] terras sem lei, onde o conflito é quase inevitável,"
 map_artifact_danger_type_forests:0 "[newly_created_artifact.GetDesc] florestas profundas, cheias de perigos ocultos,"
 map_artifact_danger_type_heat:0 "[newly_created_artifact.GetDesc] calor escaldante, lidando com uma constante falta de água,"
 map_artifact_danger_type_jungle:0 "[newly_created_artifact.GetDesc] densas selvas, com animais perigosos dentro,"
 map_artifact_danger_type_monsoons:0 "[newly_created_artifact.GetDesc] monções torrenciais,"
 map_artifact_danger_type_open:0 "[newly_created_artifact.GetDesc] vastas planícies abertas, onde não há abrigo,"
 map_artifact_danger_type_snowstorms:0 "[newly_created_artifact.GetDesc] frio extremo, tempestades de neve,"
 map_artifact_danger_type_steppes:0 "[newly_created_artifact.GetDesc] as estepes abertas, longe de terras habitadas,"
 map_artifact_danger_type_undulating:0 "[newly_created_artifact.GetDesc] colinas onduladas, passes de montanha perigosos,"
 map_artifact_danger_type_wetlands:0 "[newly_created_artifact.GetDesc] pântanos traiçoeiros, repletos de doenças,"
 map_artifact_domain_purpose_defensive:0 "[newly_created_artifact.GetDesc]A jornada descrita foi realizada para inspecionar o domínio do autor. O itinerário e o mapa descrevem como [Select_CString( author.IsFemale, 'a', 'o' )] [author.GetTitledFirstName] defenderia suas terras contra exércitos hostis. O mapa mostra onde as defesas devem ser erguidas, como apoiar da melhor maneira os homens de armas [author.GetHerHim], e o que um atacante poderia fazer."
 map_artifact_domain_purpose_growth:0 "[newly_created_artifact.GetDesc]A jornada descrita foi realizada para inspecionar o domínio do autor e o itinerário detalha o que [Select_CString( author.IsFemale, 'a', 'o' )] [author.GetTitledFirstName] aprendeu sobre seu domínio e como extrair melhor os recursos e a riqueza da terra [author.GetHerHim]."
 map_artifact_foreign_purpose_court:0 "[newly_created_artifact.GetDesc]A jornada descrita culmina em uma visita à corte [foreign_kingdom_map_target.GetAdjectiveNoTooltip] em [background_terrain_scope.GetTitle.GetNameNoTierNoTooltip] e o autor faz uma longa descrição sobre a vida da alta sociedade no reino."
 map_artifact_foreign_purpose_mythical:0 "[newly_created_artifact.GetDesc]A jornada descrita culmina em uma visita à corte [foreign_kingdom_map_target.GetAdjectiveNoTooltip], mas o foco principal é uma descrição colorida de uma terra assombrada por [SCOPE.Custom('mythical_map_creatures')] e como um viajante poderia se preparar melhor para lidar com elas."
 map_artifact_foreign_purpose_people:0 "[newly_created_artifact.GetDesc]O objetivo da jornada descrita foi uma visita à corte [foreign_kingdom_map_target.GetAdjectiveNoTooltip], mas o itinerário mal menciona a capital. Em vez disso, entra em detalhes sobre as pessoas da terra, seu estranho comportamento e costumes."
 map_artifact_name:0 "Uma Jornada até [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTooltip]"
 map_artifact_name_domain:0 "Domínio d[Select_CString( author.IsFemale, 'a', 'o' )] [author.GetTitledFirstNameNoTooltip]"
 map_artifact_name_mythical:0 "Terra dos [SCOPE.Custom('mythical_map_creatures_capitalized')|U]"
 map_artifact_name_poi:0 "Jornada até [poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
 map_artifact_name_vassal_dread:0 "Sobre a Subjugação dos Vassalos [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetAdjectiveNoTooltip]"
 map_artifact_name_vassal_intrigue:0 "Itinerário Secreto do Reino [background_terrain_scope.GetTitle.GetHolder.GetLiege.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 map_artifact_name_vassal_opinion:0 "Viajando pelo Reino [background_terrain_scope.GetTitle.GetHolder.GetLiege.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 map_artifact_poi_purpose:0 "[newly_created_artifact.GetDesc]O objetivo da jornada parece ter sido uma visita a [poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]. Há um mapa especial cobrindo apenas [poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] e seus arredores, e o itinerário descreve o que você pode esperar encontrar lá."
 map_artifact_poi_travel:0 "[newly_created_artifact.GetDesc]O objetivo da jornada parece ter sido uma visita a [poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]. O mapa detalha a rota seguida, bem como como evitar os erros que [Select_CString( author.IsFemale, 'a', 'o' )] [author.GetTitledFirstName] acredita que [author.GetSheHe] cometeu no caminho."
 map_artifact_vassal_purpose_dread:0 "[newly_created_artifact.GetDesc]O itinerário descreve uma jornada feita para inspecionar as terras dos vassalos do autor.\nOs pontos fortes percebidos estão todos marcados no mapa, juntamente com instruções sobre como quebrar qualquer resistência. Há anotações sobre as personalidades dos vassalos e como poderiam ser intimidados para se submeterem."
 map_artifact_vassal_purpose_intrigue:0 "[newly_created_artifact.GetDesc]O texto descreve uma jornada para inspecionar os vassalos do autor, com várias anotações sobre entradas de castelos, passagens secretas e onde os diversos vassalos d[Select_CString( author.IsFemale, 'a', 'o' )] [author.GetTitledFirstName] guardam suas posses mais preciosas."
 map_artifact_vassal_purpose_opinion:0 "[newly_created_artifact.GetDesc]O texto descreve uma jornada para inspecionar as terras dos vassalos do autor — com anotações sobre ativos valiosos e a personalidade de cada vassalo. O itinerário cobre várias sugestões sobre como apoiar e bajular esses senhores de terras para manter seu apoio."
 mapmaking.0001.a.tt:0 "Este projeto será baseado na sua visita [visited_own_county.GetName] e outras possessões em seu domínio\nIsso resultará em um artefato mais forte se você tiver visitado várias de suas possessões [domain|E]"
 mapmaking.0001.a:0 "O domínio do [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]"
 mapmaking.0001.b.tt:0 "Este projeto será baseado na sua visita a [visited_own_vassal.GetName] e outras capitais de vassalos\nIsso resultará em um artefato mais forte se você tiver visitado várias [capital|E] dos [powerful_vassals|E]"
 mapmaking.0001.b:0 "As terras de [visited_own_vassal_title.GetNameNoTooltip]"
 mapmaking.0001.c.tt:0 "Este projeto será baseado na sua visita a [poi_map_target.GetName] e seus [point_of_interest|E]\nIsso resultará em um artefato mais forte se você tiver mais experiência com o Traço [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]"
 mapmaking.0001.c:0 "A Rota para [poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
 mapmaking.0001.d.tt:0 "Este projeto será baseado na sua visita a [foreign_capital_map_target.GetName], capital do [foreign_capital_map_target.GetTitle.GetHolder.GetPrimaryTitle.GetName]\nIsso resultará em um artefato mais forte se você tiver mais experiência com o Traço [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]"
 mapmaking.0001.d:0 "Um mapa do [foreign_kingdom_map_target.GetNameNoTooltip]"
 mapmaking.0001.desc:0 "Chegou o momento de documentar o que aprendi durante minhas viagens, para que outros possam aprender com a minha experiência. Um itinerário detalhado apoiado por mapas e gráficos me permitirá espalhar meus conhecimentos arduamente adquiridos.\n\nA primeira decisão que devo tomar é qual jornada quero utilizar neste projeto."
 mapmaking.0001.t:0 "Itinerários e Mapas"
 mapmaking.0001.z:0 "[visited_own_liege.GetNameNoTooltip]"
 mapmaking.0004.a.tt:0 "Esta opção resultará em um artefato com benefícios relacionados ao [terrain|E] [background_terrain_scope.GetTerrain.GetName]"
 mapmaking.0004.a:0 "Focar em viajar nas [background_terrain_scope.Custom('GetTerrainLandPlural')]"
 mapmaking.0004.b.tt:0 "Esta opção resultará em um artefato com benefícios relacionados à segurança em [travel|E] e à defesa pessoal"
 mapmaking.0004.b:0 "Descreverei preparações para emboscadas"
 mapmaking.0004.c.tt:0 "Esta opção resultará em um artefato com benefícios relacionados ao Inverno"
 mapmaking.0004.c:0 "Focar em como lidar com o frio"
 mapmaking.0004.d.tt:0 "Esta opção resultará em um artefato com benefícios relacionados à segurança em [travel|E] em [terrain|E] quentes"
 mapmaking.0004.d:0 "Lidar com o calor é vital"
 mapmaking.0004.desc.generic_fallback:0 "Raramente vi uma terra tão sem graça antes ou depois. A natureza nondescritiva da terra é apenas espelhada por seu povo igualmente sem graça."
 mapmaking.0004.desc.intro:0 "Todo itinerário deve alertar o leitor sobre os perigos que o aguardam.\n\n"
 mapmaking.0004.e.tt:0 "Esta opção resultará em um artefato com benefícios relacionados à segurança em [travel|E] em [terrain|E] úmidos"
 mapmaking.0004.e:0 "A monção é mais importante"
 mapmaking.0004.fighting.desc:0 "Viajar por esta área me ensinou a estar sempre atento a emboscadas e ataques. A regra dos fortes é a lei em [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip], seja ao encontrar fora-da-lei, barões locais ou exércitos estrangeiros, eu sempre tinha que estar pronto para me defender.\n\n"
 mapmaking.0004.fighting.t:0 "Perigos de [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip]"
 mapmaking.0004.heat.desc:0 "Minha memória mais forte de [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip] é a dos raios implacáveis do sol. Enquanto atravessávamos as [background_terrain_scope.Custom('GetTerrainLandPlural')], estávamos constantemente à procura de sombra e água potável.\n\n"
 mapmaking.0004.heat.t:0 "O Calor Escaldante de [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip]"
 mapmaking.0004.monsoon.desc:0 "As fortes chuvas de [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip] sempre serão inesquecíveis para mim. Na estação das monções, até o caminho mais seguro se transformaria em um pântano enlameado.\n\n"
 mapmaking.0004.monsoon.t:0 "As Chuvas de [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip]"
 mapmaking.0004.snow.desc:0 "Nunca esquecerei os invernos de [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip], com nevascas repentinas, quedas de temperatura e um mar branco aparentemente interminável de neve pelo qual tivemos que atravessar.\n\n"
 mapmaking.0004.snow.t:0 "A [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetAdjectiveNoTooltip] [background_terrain_scope.Custom('GetBadWeatherDesc')|U]"
 mapmaking.0004.t:0 "O [background_terrain_scope.Custom('GetTerrainLandPlural')|U] de [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip]"
 mapmaking.0004.terrain_deep_forests.desc:0 "As florestas profundas moldarão qualquer jornada por essa área. Quais rotas tomar, como procurar e caçar são memórias indispensáveis que tenho de [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip]..."
 mapmaking.0004.terrain_desert.desc:0 "O deserto impôs grandes demandas a mim enquanto viajava por essa área — no vasto aberto não há como se esconder do sol ou dos inimigos."
 mapmaking.0004.terrain_jungle.desc:0 "A selva é lar de muitos animais e plantas, tanto benéficas quanto mortais. Conhecer um do outro e saber como acampar adequadamente são experiências indispensáveis..."
 mapmaking.0004.terrain_open.desc:0 "Um vasto campo aberto significa que eu nunca poderia disfarçar nossa chegada nesta área, em vez disso, tivemos que estar prontos para enfrentar qualquer inimigo diretamente..."
 mapmaking.0004.terrain_open_farmland.desc:0 "Estocar suprimentos nunca foi um problema para nós aqui, essa área não é de terreno perigoso. Campos bem trabalhados se estendem em todas as direções de [background_terrain_scope.GetTitle.GetNameNoTierNoTooltip]..."
 mapmaking.0004.terrain_steppes.desc:0 "A própria estepe aberta é, de muitas maneiras, o aspecto mais marcante dessa área. Selvagem, indomada e difícil de cultivar, essa terra oferece pouco em termos de suprimentos ou água potável..."
 mapmaking.0004.terrain_undulating.desc:0 "Viajar nesta área é estar preparado para uma caminhada árdua, já que a elevação muda a cada curva. Por outro lado, ainda me lembro das vistas grandiosas do topo..."
 mapmaking.0004.terrain_wetlands.desc:0 "Os pântanos são um aspecto inesquecível dessa área, e como encontrar o melhor caminho através da névoa e do terreno traiçoeiro são coisas que imediatamente vêm à minha mente..."
 mapmaking.0010.a.tt:0 "Isso resultará em um itinerário com benefícios relacionados à economia do seu [domain|E]\nEsta opção se beneficia de um [stewardship|E] mais alto no personagem"
 mapmaking.0010.a:0 "O foco deve ser nos recursos não explorados"
 mapmaking.0010.b.tt:0 "Isso resultará em um itinerário com benefícios relacionados à defesa do seu [domain|E]\nEsta opção se beneficia de um [martial|E] mais alto no personagem"
 mapmaking.0010.b:0 "A defesa do reino é vital"
 mapmaking.0010.desc:0 "Todo bom senhor conhece seu domínio. [ROOT.Char.GetSheHe|U] saberá a quem perguntar para fazer as coisas, onde há terras desocupadas, o que precisa ser mantido, quais desafios precisam ser superados.\n\nEnquanto me sento para desenhar um mapa que descreva minhas terras, preciso ponderar o que considero ser informações vitais para o leitor do mapa que estou desenhando. O que aprendi em minhas viagens?"
 mapmaking.0010.t:0 "Mapeando o Domínio"
 mapmaking.0020.a.tt:0 "Isso resultará em um itinerário com benefícios relacionados ao [dread|E].\nEsta opção se beneficia de uma experiência mais alta no Traço [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]"
 mapmaking.0020.a:0 "Eu mostrarei como controlá-los"
 mapmaking.0020.b.tt:0 "Isso resultará em um itinerário com benefícios relacionados a boas relações com [vassals|E] e [courtiers|E].\nEsta opção se beneficia de uma [diplomacy|E] mais alta no personagem"
 mapmaking.0020.b:0 "Este mapa me permitirá ajudá-los"
 mapmaking.0020.c.tt:0 "Isso resultará em um itinerário com benefícios relacionados a [schemes|E].\nEsta opção se beneficia de um [intrigue|E] mais alto no personagem"
 mapmaking.0020.c:0 "Meu mapa revelará seus segredos"
 mapmaking.0020.desc:0 "Ao visitar as terras dos meus vassalos, aprendi sobre como eles tratam seus súditos, o que falta e o que possuem em abundância. Talvez até tenha uma boa ideia de onde encontrar seus segredos e riquezas.\n\nTudo isso não pode ser facilmente descrito em um mapa, no entanto, precisarei decidir que tipo de mapa estou criando."
 mapmaking.0020.t:0 "Terras de [visited_own_vassal_title.GetNameNoTooltip]"
 mapmaking.0030.a.tt:0 "Focar na passagem para [poi_map_target.GetHolding.GetNameNoTooltip] resultará em um itinerário que beneficia a segurança e a velocidade da [travel|E].\nEsta opção se beneficia de uma alta experiência no Traço [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]"
 mapmaking.0030.a:0 "Nada é mais importante do que uma passagem rápida e segura."
 mapmaking.0030.b.tt:0 "Focar em [poi_map_target.Custom('GetSpecialBuildingPrefix')][poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] resultará em um itinerário com benefícios relacionados ao tipo de [point_of_interest|E].\nEsta opção se beneficia de uma alta experiência com o Traço [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]"
 mapmaking.0030.b:0 "Desenharei um gráfico de [poi_map_target.GetHolding.GetNameNoTooltip] em si."
 mapmaking.0030.desc:0 "[poi_map_target.Custom('GetSpecialBuildingPrefix')|U][poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] é talvez um dos lugares que mais me impressionaram em minhas viagens. A jornada até [poi_map_target.GetHolding.GetNameNoTooltip] foi quase igualmente memorável, e provavelmente teria sido muito mais rápida se eu tivesse estado melhor preparado.\n\nPosso transmitir apenas tanta informação, no entanto, e enquanto me sento para descrever o que aconteceu, precisarei decidir qual será o meu foco."
 mapmaking.0030.t:0 "Território Desconhecido"
 mapmaking.0040.a.tt:0 "Focar na corte resultará em um itinerário com benefícios relacionados ao [prestige|E].\nEsta opção se beneficia de uma alta experiência com o Traço [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]"
 mapmaking.0040.a:0 "A corte em [background_terrain_scope.GetTitle.GetNameNoTierNoTooltip] foi realmente inesquecível"
 mapmaking.0040.b.tt:0 "Focar nas pessoas resultará em um itinerário com benefícios relacionados a [diplomacy|E].\nEsta opção se beneficia de uma alta experiência no Traço [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]"
 mapmaking.0040.b:0 "Focarei nas pessoas e seus costumes"
 mapmaking.0040.c.tt:0 "Focar em criaturas míticas resultará em um itinerário com benefícios relacionados a [dynasty_prestige|E]."
 mapmaking.0040.c:0 "Todos devem saber sobre os [foreign_kingdom_map_target.GetAdjectiveNoTooltip] [SCOPE.Custom('mythical_map_creatures')]!"
 mapmaking.0040.desc:0 "Minha jornada até [foreign_kingdom_map_target.GetNameNoTier] me ensinou muitas coisas, não apenas sobre os súditos de [foreign_kingdom_map_target.GetAdjectiveNoTooltip], mas também sobre como suas terras diferem das nossas. O povo [foreign_kingdom_map_target.GetAdjectiveNoTooltip] tem seus próprios costumes e ganha a vida de formas diferentes das nossas. De muitas maneiras, a terra em si também foi alienígena para mim.\n\nAo começar a descrever o que aprendi, terei que decidir onde deve estar meu foco e o que quero que outros viajantes saibam."
 mapmaking.0040.t:0 "O [foreign_kingdom_map_target.GetNameNoTooltip]"
 mapmaking.1000.a:0 "Essa jornada chegou ao fim"
 mapmaking.1000.desc:0 "Enquanto preencho a última página do meu manuscrito, sinto uma grande sensação de satisfação.\n\nEscrever o que aprendi nas minhas viagens é, de muitas maneiras, uma experiência nostálgica, me permitindo reviver alguns momentos muito formativos do meu passado, ao mesmo tempo em que crio algo que pode ajudar futuros viajantes.\n\nEspero que o itinerário resultante e seu mapa detalhado do meu percurso através do [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTooltip] possam resistir ao teste do tempo."
 mapmaking.1000.internal.t:0 "Viajando pelo [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTooltip]"
 mapmaking.1000.mythical.t:0 "Jornada até a Terra dos [SCOPE.Custom('mythical_map_creatures')|U]"
 mapmaking.1000.t:0 "Jornada até o [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTooltip]"
