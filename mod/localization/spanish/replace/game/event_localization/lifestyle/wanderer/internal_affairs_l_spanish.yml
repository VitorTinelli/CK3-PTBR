 inspection_unfitting_ruler_desc:0 "\t#weak Aumento para cada #bold Temor#! que o [holder|E] possui#!"
 inspection_unfitting_ruler_modifier:0 "Condado Extorquido"
 inspection_unfitting_ruler_modifier_desc:0 "Este condado está sendo espremido, com impostos e pessoas saindo dele diariamente."
 internal.affairs.10.desc.outro:0 "\n\nA única pessoa que conseguiu evitar que as coisas se tornassem violentas foi [Select_CString( barony_holder.IsFemale, 'uma certa', 'um certo' )] [barony_holder.GetTitledFirstName], que é aparentemente muito popular entre os locais. Além de manter os cidadãos sob controle, [barony_holder.GetSheHe] enviou uma pequena petição para realizar um festival na área, para acalmar as coisas ainda mais."
 internal_affairs.10.a:0 "Então, deixe que est[Select_CString( barony_holder.IsFemale, 'a', 'e' )] [barony_holder.GetTitledFirstNameNoTooltip] assuma o comando..."
 internal_affairs.10.b:0 "... [county_holder.GetFirstNameNoTooltip] será até compensad[Select_CString( county_holder.IsFemale, 'a', 'o' )] por isso!"
 internal_affairs.10.c:0 "[barony_holder.GetSheHe|U] pode ter seu festival."
 internal_affairs.10.d:0 "Não é trabalho d[Select_CString( county_holder.IsFemale, 'a', 'o' )] [county_holder.GetFirstNamePossessiveNoTooltip] lidar com isso?"
 internal_affairs.10.desc.control:0 "a banditismo desenfreado colocando os cidadãos em perigo."
 internal_affairs.10.desc.opinion.me:0 "meu governo na área."
 internal_affairs.10.desc.opinion.other:0 "seu ódio [Select_CString( county_holder.IsFemale, 'pela senhora feudal', 'pelo senhor feudal' )] local, [county_holder.GetTitledFirstName]."
 internal_affairs.10.desc:0 "\"E essa é a situação atual em [barony_title.GetName], [ROOT.Char.Custom('FormOfAddressForLiege')].\" [provider_character.GetFirstName] me informa. Parece que houve pequenos tumultos nas ruas recentemente, devido a uma indignação sobre "
 internal_affairs.10.t:0 "Uma Revolta por Vir"
 internal_affairs.20.a.tt:0 "Você pode legitimamente [revoke|E] um [title_i] [title|E] d[Select_CString( county_holder.IsFemale, 'a', 'o' )] [county_holder.GetTitledFirstName]"
 internal_affairs.20.a:0 "Inaceitável."
 internal_affairs.20.b:0 "Vou deixar passar, desta vez."
 internal_affairs.20.desc.both:0 "Crime desenfreado, cidadãos mortos nas ruas e uma sensação geral de medo e infelicidade."
 internal_affairs.20.desc.control:0 "Crime desenfreado, estradas inseguras e cidadãos com medo de sair de casa após o anoitecer."
 internal_affairs.20.desc.opinion:0 "Um descontentamento profundo com a forma como o condado está sendo governado e protestos regulares nas ruas."
 internal_affairs.20.desc.outro:0 "\n\nJá enviei um mensageiro para [Select_CString( county_holder.IsFemale, 'a', 'o' )] [county_holder.GetTitledFirstName] sobre isso, e ainda assim os problemas parecem não ter fim. Estas são as ações de alguém digno de ser um dos #emp meus#! vassalos?"
 internal_affairs.20.desc:0 "Pela terceira vez só esta semana, recebo outro mensageiro me contando sobre o estado deplorável de [county_title.GetNameNoTier]."
 internal_affairs.20.dread:0 "Se você vai espremer, então faça direito. Amador."
 internal_affairs.20.t:0 "[county_holder.GetLadyLord] Inadequad[Select_CString( county_holder.IsFemale, 'a', 'o' )]"
 internal_affairs.30.a:0 "Ah, posso fazer mais do que apenas fechar os olhos..."
 internal_affairs.30.b:0 "Bem, só desta vez."
 internal_affairs.30.c:0 "Saia daqui antes que eu mande matá-lo, seu parasita!"
 internal_affairs.30.desc:0 "\"Veja bem, [ROOT.Char.Custom('FormOfAddressForLiege')], algumas das expectativas locais impostas sobre nós são #emp bastante#! rigorosas para os negócios...\" Fui abordado [Select_CString( merchant_character.IsFemale, 'pela', 'pelo' )] [merchant_character.GetFirstName], um[Select_CString( merchant_character.IsFemale, 'a', '' )] representante da [SCOPE.Custom('LocalGuildsLoc')] de [guild_province.GetName]. [merchant_character.GetSheHe|U] falou longamente sobre as dificuldades que a guilda [merchant_character.GetHerHim] tem enfrentado.\n\n\"Imaginei, talvez, que poderíamos resolver as coisas um pouco mais entre nós dois.\" [merchant_character.GetSheHe|U] coloca uma pequena bolsa na minha frente e me lança um olhar sugestivo."
 internal_affairs.30.t:0 "Fechando os Olhos"
 internal_affairs.40.a:0 "Talvez você possa ser útil para mim, [secret_giver.GetFirstName]."
 internal_affairs.40.blackmail:0 "Eu definitivamente posso fazer isso trabalhar a meu favor."
 internal_affairs.40.courtier_intro:0 "Enquanto caminho pelo acampamento, uma voz desconhecida chega aos meus ouvidos, conversando com um dos meus companheiros próximos. Eu paro e escuto. A troca parece monótona a princípio, mas então o nome de [secret_haver.GetName] é de repente mencionado.\n\n"
 internal_affairs.40.desc:0 "[secret_giver.GetFirstName] se aprofunda em tópicos mais sensíveis envolvendo [secret_haver.GetFirstNameNoTooltip], revelando assuntos que poderiam muito bem manchar a reputação [secret_haver.GetHerHim]..."
 internal_affairs.40.expose:0 "Todos deveriam saber o que [secret_haver.GetFirstName] está aprontando!"
 internal_affairs.40.follower_intro:0 "Agindo como mensageiro, [secret_giver.GetFirstName] transmite as notícias da região, mantendo-me informado enquanto estou ocupado com outras coisas. Embora a maior parte do que [secret_giver.GetSheHe] menciona não seja nada fora do comum, há uma nota de preocupação na voz [secret_giver.GetHerHim] sempre que o nome de [secret_haver.GetNamePossessive] é mencionado.\n\nEventualmente, "
 internal_affairs.40.move:0 "Pode ser hora de eu partir de [GetPlayer.GetDomicile.GetLocation.GetName]..."
 internal_affairs.40.move_zealous:0 "[GetPlayer.GetFaith.HighGodName] me chama para longe daqui..."
 internal_affairs.40.t:0 "Fios Soltos"
 internal_affairs.50.conversion:0 "[tensions_county.GetNameNoTierNoTooltip] deveria ser completamente [opposing_faith.GetAdherentNameNoTooltip]!"
 internal_affairs.50.desc.holder_faith:0 "Embora [tensions_county.GetHolder.GetNameNoTooltip] possa se alinhar com os [target_faith.GetAdherentNamePluralNoTooltip], [tensions_county.GetHolder.GetSheHe] mesmo, a fé [tensions_county.GetHolder.GetHerHim] sozinho não pode conter a presença de um [opposing_faith.GetAdherentNameNoTooltip] [target_liege.GetTitleTierName]."
 internal_affairs.50.desc.neutral_faith:0 "\n\nEmbora eu não pratique [opposing_faith.GetNameNoTooltip] nem [target_faith.GetNameNoTooltip], vale a pena ver o que pode ser feito aqui."
 internal_affairs.50.desc.root_faith:0 "\n\nEu me pergunto se devo estar vigilante quanto ao estado dos meus [GetPlayer.GetFaith.GetAdherentNamePluralNoTooltip] companheiros, ao menos para garantir que nossa adoração a [GetPlayer.GetFaith.HighGodName] não seja prejudicada."
 internal_affairs.50.desc:0 "Os camponeses de [tensions_county.GetNameNoTier] parecem não ter dado sua confiança, nem afeição a [tensions_county.GetHolder.GetName]. Não há especulação sobre a causa de tal inquietação, pois monumentos de [target_faith.GetAdherentNameNoTooltip] estão sendo profanados, e com o aumento de brigas envolvendo [target_faith.GetAdherentNamePluralNoTooltip] e [opposing_faith.GetAdherentNamePluralNoTooltip] igualmente."
 internal_affairs.50.desc_end:0 "Na melhor das hipóteses, eu poderia trabalhar para ajudar a resolver essas tensões, antes que elas comecem a colocar minha segurança em risco."
 internal_affairs.50.neutral:0 "Por outro lado, isso não é minha preocupação..."
 internal_affairs.50.neutral_cynic:0 "Por que as pessoas deixam a religião ter tanto poder sobre suas vidas?"
 internal_affairs.50.t:0 "O Protesto dos [target_faith.GetAdherentNameNoTooltip]"
 internal_affairs.50.tolerance:0 "Deixe os [target_faith.GetAdherentNamePluralNoTooltip] terem suas crenças."
 internal_affairs.60.desc:0 "Enquanto percorro os corredores de [bandit_location.GetNameNoTier], percebo uma figura se movendo rapidamente pelo canto do meu olho. Ao virar uma esquina, vejo um grupo de homens robustos enchendo uma carroça com vários saque, movendo-se rapidamente como se [GetPlayer.GetFaith.DevilName] [GetPlayer.GetFaith.DevilHerselfHimself] estivesse em seus calcanhares.\n\nA maioria dos homens sai da área para pegar mais saque, e [bandit_character.GetFirstName] espera sozinho para vigiar. Percebo uma sacola na carroça que tem o selo de [bandit_holder.GetName], mas eu preciso do conteúdo para mim..."
 internal_affairs.60.force:0 "O que [bandit_character.GetName] vai fazer?"
 internal_affairs.60.force_tt:0 "Eu enfrento o bandido sozinho e tento pegar o prêmio [bandit_character.GetHerHim] para mim."
 internal_affairs.60.force_tt_fail:0 "[bandit_character.GetNameNoTooltip] me afasta."
 internal_affairs.60.force_tt_succ:0 "Eu roubo com sucesso o saque dos bandidos."
 internal_affairs.60.neutral:0 "Isso não é problema meu."
 internal_affairs.60.snitch:0 "[bandit_holder.GetFirstName] vai querer ouvir sobre isso."
 internal_affairs.60.snitch_tt:0 "Eu informo [bandit_holder.GetNameNoTooltip] sobre as atividades dos bandidos, e [bandit_holder.GetSheHe] me recompensa com uma parte dos bens roubados."
 internal_affairs.60.sus:0 "Talvez [bandit_character.GetNameNoTooltip] possa me incluir em algum trabalho [bandit_character.GetHerHim]..."
 internal_affairs.60.sus_tt:0 "Cria #V 3#! [criminal_task_contracts|E] no mapa."
 internal_affairs.60.t:0 "O Tesouro do Bandido"
 internal_affairs.conversion_desc:0 "Você tenta converter os camponeses de [tensions_county.GetNameNoTierNoTooltip] para [opposing_faith.GetNameNoTooltip]."
 internal_affairs.tolerance_desc:0 "Você tenta ajudar os camponeses a afirmar seu direito de praticar [target_faith.GetNameNoTooltip]."
 internal_affairs_camp_momentum_modifier:0 "Impulso de Acampamento"
 internal_affairs_camp_momentum_modifier_desc:0 "Este aventureiro foi chamado a partir em jornada, e possivelmente estabelecer acampamento em outro lugar."
 internal_affairs_character_religious_tolerance_modifier:0 "$internal_affairs_county_religious_tolerance_modifier$"
 internal_affairs_character_religious_tolerance_modifier_desc:0 "Este personagem mostrou aos outros o valor de respeitar as crenças alheias — talvez eles também possam fazer o mesmo."
 internal_affairs_county_religious_tensions_modifier:0 "Tensões Religiosas Aumentadas"
 internal_affairs_county_religious_tensions_modifier_desc:0 "Este condado está passando por tensões religiosas que foram exacerbadas pela interferência de uma entidade influente.\nProgresso Mensal de [convert_county|E]: #N -0.2#!"
 internal_affairs_county_religious_tolerance_modifier:0 "Tolerância Religiosa"
 internal_affairs_county_religious_tolerance_modifier_desc:0 "As vozes da minoria religiosa neste condado foram ouvidas, e seu direito de praticar suas crenças está sendo respeitado, ao menos por enquanto.\nProgresso Mensal de [convert_county|E]: #N -0.1#!"
 internal_affairs_local_corruption_desc:0 "\t#weak Aumento para cada ponto de #bold Controle do Condado#! abaixo de 100#!"
 internal_affairs_local_corruption_modifier:0 "Corrupção Santificada"
 internal_affairs_local_corruption_modifier_desc:0 "Uma guilda de mercadores locais obteve quase poder ilimitado nos negócios locais, corroendo lentamente a burocracia e hierarquia do condado."
 internal_affairs_local_uprising_appeasement_modifier:0 "Locais Apaziguados"
 internal_affairs_local_uprising_appeasement_modifier_desc:0 "Os locais do condado foram apaziguados após uma mudança de governança na área."
 internal_affairs_local_uprising_festival_modifier:0 "Festival Rural"
 internal_affairs_local_uprising_festival_modifier_desc:0 "Um pequeno festival rural é realizado anualmente para apaziguar os locais."
 local_zealots_appeased_tt:0 "Os [target_faith.GetAdherentNamePluralNoTooltip] locais estão apaziguados"
 opinion_unfitting_ruler_opinion:0 "Governante Inadequado"
 religious_county_converted_tt:0 "O [tensions_county.GetNameNoTierNoTooltip] foi convertido para [opposing_faith.GetNameNoTooltip]"
 religious_tension_continues_tt:0 "A agitação de [target_faith.GetAdherentNameNoTooltip] continua"
