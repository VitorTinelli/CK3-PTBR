 MODIFIER_DEFINITION_LOCAL_CORRUPTION_DESC:0 "\nEste modificador é aumentado quanto menor for o [county_control|E] do [county|E]"
 MODIFIER_DEFINITION_UNFITTING_RULER_DESC:0 "\nEste modificador é aumentado quanto maior for o [dread|E] do [holder|E]"
