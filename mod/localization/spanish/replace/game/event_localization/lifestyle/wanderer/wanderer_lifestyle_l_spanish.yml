 wanderer_lifestyle_events.40.desc:0 "Minha jornada [ROOT.Char.GetLocationDesc|l] tem sido tranquila, mas tempos difíceis se aproximam, pois nossas reservas de comida estão quase esgotadas! O cheiro de [ROOT.Char.Custom('GetExpensiveMeal')] recém-preparado me atrai, e ao segui-lo, chego a uma barraca peculiar. Uma variedade de [ROOT.Char.Custom('GetLocalStreetFoodPlural')] e cortes de [ROOT.Char.Custom('GetRegionalFish')] estão expostos, com refeições sendo servidas com... doce de [ROOT.Char.Custom('FavoriteTreat')]?\n\nIgnorando isso, o preço está uma pechincha! O comerciante murmura algo que não entendo e faz um gesto para que eu lhe dê mais dinheiro do que os locais, e embora eu ainda economize um pouco, deveria contestar. Mas mal conheço o idioma [provisions_merchant.GetCulture.GetLanguage.GetNameNoTooltip]..."
