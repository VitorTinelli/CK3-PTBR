 terrain_tooltip_desc:0 "Focar em:"
 wanderer_exotic_animal_modifier:0 "Animal Exótico"
 wanderer_exotic_animal_modifier_desc:0 "Nada impressiona tanto quanto um animal exótico que ninguém jamais viu antes!"
 wanderer_lifestyle_events.10.a.tt:0 "[traveling|E] removerá o [modifier|E], e proporcionará [stress_loss|E] e [lifestyle_experience|E]"
 wanderer_lifestyle_events.10.a:0 "Eu preciso de uma pausa de tudo isso..."
 wanderer_lifestyle_events.10.desc:0 "Este quarto, estas paredes, esta maldita cadeira... estou #bold tão#! farto de tudo isso.\n\nEu #emp preciso#! sair daqui. Preciso ir para algum outro lugar. Qualquer outro lugar.\n\nTodo dia, preso neste quarto horrível, sinto como se mais um pedacinho da minha vida fosse levado."
 wanderer_lifestyle_events.10.t:0 "Sonhos de uma Jornada"
 wanderer_lifestyle_events.20.a.lose:0 "[listening_child.GetSheHe|U] não acredita muito na história, mas gosta dela mesmo assim"
 wanderer_lifestyle_events.20.a.win:0 "[listening_child.GetSheHe|U] está encantado pela história"
 wanderer_lifestyle_events.20.a:0 "Deixe-me te contar sobre os [SCOPE.Custom('mythical_map_creatures')] de [reminiscing_location.GetNameNoTooltip]!"
 wanderer_lifestyle_events.20.b.child:0 "Isso é de [reminiscing_location.GetNameNoTooltip], talvez eu possa te levar lá um dia."
 wanderer_lifestyle_events.20.b.tt:0 "Você pode ganhar Experiência extra no [wanderer_lifestyle|E] ou [stress_loss|E] se [Concept('travel', 'viajar')|E] para [reminiscing_location.GetName]"
 wanderer_lifestyle_events.20.b:0 "Um dia, eu verei [reminiscing_location.GetNameNoTooltip] novamente..."
 wanderer_lifestyle_events.20.desc.castle:0 "o impressionante castelo que orgulhosamente sobrevoa a cidade."
 wanderer_lifestyle_events.20.desc.city:0 "a grande cidade majestosa com seus muitos distritos, e todos os pequenos cantos e recantos."
 wanderer_lifestyle_events.20.desc.coastal:0 "o grande porto e a bela vista do oceano."
 wanderer_lifestyle_events.20.desc.outro:0 "\n\nEnquanto relembro, sinto uma onda de nostalgia. Talvez... Talvez não fosse tão ruim se eu partisse para visitar [reminiscing_location.GetNameNoTooltip] mais uma vez."
 wanderer_lifestyle_events.20.desc.outro_child:0 "\n\nEnquanto relembro, [listening_child.GetFirstName] de repente entra correndo. 'O que é isso?' [listening_child.GetSheHe|U] pergunta, com um olhar curioso para a pequena figurinha."
 wanderer_lifestyle_events.20.desc.people:0 "as pessoas amigáveis que viviam lá."
 wanderer_lifestyle_events.20.desc.river:0 "o rio que passa pela cidade, e as muitas pontes sobre ele."
 wanderer_lifestyle_events.20.desc.special_building:0 "[reminiscing_location.GetHolding.GetSpecialBuildingType.GetName], um lugar sobre o qual não pensava há muito tempo."
 wanderer_lifestyle_events.20.desc:0 "Enquanto vasculho minhas coisas procurando por algo mais, encontro uma velha figurinha de [SCOPE.Custom('mythical_map_creatures')], que peguei durante minha visita a [reminiscing_location.GetName]. Ao olhar para ela, lembro-me do"
 wanderer_lifestyle_events.20.t:0 "Meu Tempo em [reminiscing_location.GetNameNoTooltip]"
 wanderer_lifestyle_events.25.a:0 "Isso... é exatamente o que eu esperava."
 wanderer_lifestyle_events.25.desc:0 "Caminho pelas mesmas ruas que percorri da última vez que estive em [province_location.GetName]. Vejo as mesmas barracas, cheiro os mesmos odores, e ouço os mesmos sons.\n\nHá um conforto em saber que algumas coisas não mudaram."
 wanderer_lifestyle_events.25.t:0 "Outra Visita"
 wanderer_lifestyle_events.30.a.africa:0 "Você pode ganhar Experiência extra no [wanderer_lifestyle|E] ou [stress_loss|E] se [Concept('travel', 'viajar')|E] pela [GetGeographicalRegion('world_africa').GetName]"
 wanderer_lifestyle_events.30.a.asia:0 "Você pode ganhar Experiência extra no [wanderer_lifestyle|E] ou [stress_loss|E] se [Concept('travel', 'viajar')|E] pelo [GetGeographicalRegion('world_middle_east').GetName]"
 wanderer_lifestyle_events.30.a.europe:0 "Você pode ganhar Experiência extra no [wanderer_lifestyle|E] ou [stress_loss|E] se [Concept('travel', 'viajar')|E] pela [GetGeographicalRegion('world_europe').GetName]"
 wanderer_lifestyle_events.30.a.india:0 "Você pode ganhar Experiência extra no [wanderer_lifestyle|E] ou [stress_loss|E] se [Concept('travel', 'viajar')|E] pela [GetGeographicalRegion('world_india').GetName]"
 wanderer_lifestyle_events.30.a.plural:0 "Um dia, serei testemunha deles pessoalmente."
 wanderer_lifestyle_events.30.a.singular:0 "Um dia, verei com meus próprios olhos."
 wanderer_lifestyle_events.30.a.steppe:0 "Você pode ganhar Experiência extra no [wanderer_lifestyle|E] ou [stress_loss|E] se [Concept('travel', 'viajar')|E] pela [GetGeographicalRegion('world_steppe').GetName]"
 wanderer_lifestyle_events.30.a.tibet:0 "Você pode ganhar Experiência extra no [wanderer_lifestyle|E] ou [stress_loss|E] se [Concept('travel', 'viajar')|E] pelo [GetGeographicalRegion('world_tibet').GetName]"
 wanderer_lifestyle_events.30.desc.plural:0 "#emp Eles tinham [ROOT.Char.Custom('DistantLandsDescriptionTypeLoc')]. Eu simplesmente observei por um minuto, eram algo totalmente diferente de tudo o que já vi antes. Só mais tarde, descobri seus nomes.#!"
