l_spanish:
 lifestyle_nicknames.0001.a:0 "Quero ser conhecid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] pela minha administração!"
 lifestyle_nicknames.0001.b:0 "Serei lembrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] pela minha imparcialidade!"
 lifestyle_nicknames.0001.c:0 "As pessoas me conhecerão pelas minhas leis!"
 lifestyle_nicknames.0001.d:0 "Pensando bem, deixa pra lá."
 lifestyle_nicknames.0001.desc:0 "Após passar incontáveis horas examinando livros de contabilidade, somando números e administrando a corte, minha meticulosidade finalmente deu frutos. Tornei meu reino mais próspero do que nunca!\n\nTodo governante habilidoso, como eu, [ROOT.Char.GetFullName], deve ser conhecido por suas realizações.\n\nAgora, como devo me chamar?"
 lifestyle_nicknames.0001.t:0 "Convenção de Nomenclatura"
 lifestyle_nicknames.0001.tt:0 "Você decide deixar suas ações - ao invés de um [epithet|E] - falarem por si."
 lifestyle_nicknames.0002.a:0 "Gostaria de ser lembrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] pela minha generosidade."
 lifestyle_nicknames.0002.b:0 "Espero que me conheçam pela minha benevolência."
 lifestyle_nicknames.0002.c:0 "Que um dia eles olhem para a #EMP elegância do meu governo#!."
 lifestyle_nicknames.0002.d:0 "Pensando bem, deixa pra lá."
 lifestyle_nicknames.0002.desc:0 "\"Que a tua vontade seja feita, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom('GetCourtOwner')]!\" Meu [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'lifestyle_nicknames_second',SelectLocalization(IsNomad(ROOT.Char),'lifestyle_nicknames_kurultai','lifestyle_nicknames_steward'))] grita enquanto [my_steward.GetSheHe] sai do meu [ROOT.Char.Custom('GetChamberPlural')].\n\nEu me levanto da cadeira e saio para o [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'lifestyle_nicknames.0002.laamp',SelectLocalization(IsNomad(ROOT.Char),'lifestyle_nicknames.0002.laamp','lifestyle_nicknames.0002.landed'))] O que eu quero que eles se lembrem de mim?"
 lifestyle_nicknames.0002.laamp:0 "centro do acampamento. Ao meu redor vejo centenas, todos trazidos à prosperidade sob meu estandarte."
 lifestyle_nicknames.0002.landed:0 "sacada. Abaixo vejo milhares, todos trazidos à prosperidade sob meu governo."
 lifestyle_nicknames.0002.tt:0 "Talvez um reino próspero seja sua própria recompensa, mais do que um [nickname|E] fantasioso."
 lifestyle_nicknames.0003.a:0 "Eu sei! Que tal \"[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] Magnífic[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]?\""
 lifestyle_nicknames.0003.b:0 "[ROOT.Char.GetFullName] [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] Magnânim[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]!"
 lifestyle_nicknames.0003.c:0 "[Select_CString( ROOT.Char.IsFemale, 'A', 'O' )] Pacificador[Select_CString( ROOT.Char.IsFemale, 'a', '' )]. Esse tem um belo som!"
 lifestyle_nicknames.0003.d:0 "Pensando bem, deixa pra lá."
 lifestyle_nicknames.0003.desc:0 "Todo o tempo gasto em esforços diplomáticos tem valido a pena. Dizem que o silêncio é de ouro, mas descobri que ser capaz de se comunicar, argumentar e convencer vale mais do que ouro em si.\n\nTodo governante respeitado é conhecido por um segundo nome por suas realizações, então como devo ser lembrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]?"
 lifestyle_nicknames.0003.t:0 "Palavras são Prata"
 lifestyle_nicknames.0003.tt:0 "Um [cognomen|E] deve ser conquistado, não adotado."
 lifestyle_nicknames.0004.a:0 "Trato todos com justiça, independentemente de sua posição, então..."
 lifestyle_nicknames.0004.b:0 "Espero ser apreciad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] pela minha bondade."
 lifestyle_nicknames.0004.c:0 "Todos me dizem que sou bastante agradável de se conversar."
 lifestyle_nicknames.0004.d:0 "Pensando bem, deixa pra lá."
 lifestyle_nicknames.0004.desc:0 "Todo o trabalho árduo dedicado ao aperfeiçoamento da minha arte de governar deixou as relações internas e externas em um excelente estado. Os camponeses acenam alegremente para minha comitiva nas ruas, e eu conheço a maioria dos meus cortesãos pelo nome.\n\nAcho que fiz um nome para mim, mas qual poderia ser?"
 lifestyle_nicknames.0004.tt:0 "As ações de um governante devem falar mais alto do que seu [epithet|E]."
 lifestyle_nicknames.0005.a:0 "...$nick_the_conqueror$!"
 lifestyle_nicknames.0005.b:0 "...$nick_haardraade$!"
 lifestyle_nicknames.0005.c:0 "...$nick_the_noble$!"
 lifestyle_nicknames.0005.d:0 "..."
 lifestyle_nicknames.0005.desc:0 "Em uma noite tranquila, depois que todos os [ROOT.Char.Custom('GetCourtierPlural')] se apressaram para sair do [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'room_command_tent','room_throne_room')], sentei-me para refletir por um momento.\n\n\"Todos os grandes governantes do mundo têm grandes nomes, então por que não eu? De agora em diante, por todas as eras que virão, serei conhecid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] como [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitledFirstName]..."
 lifestyle_nicknames.0005.t:0 "Espada da Razão"
 lifestyle_nicknames.0005.tt:0 "Você se recosta: suas estratégias, sua espada, eventualmente esculpirão um [cognomen|E] digno."
 lifestyle_nicknames.0006.a:0 "Gostaria que me conhecessem pela minha mente estratégica."
 lifestyle_nicknames.0006.b:0 "Eles me conhecerão pela minha determinação."
 lifestyle_nicknames.0006.c:0 "A coragem e a valentia me trouxeram até aqui..."
 lifestyle_nicknames.0006.d:0 "Por favor, me chamem de [ROOT.Char.GetFirstNameNoTooltip]."
 lifestyle_nicknames.0006.desc:0 "Eu olho para os planos de batalha dispostos à minha frente e pego um dos soldados de madeira na mão. Quando criança, brincava com eles em meus aposentos, e agora uso esses mesmos brinquedos para a guerra.\n\n\"[ROOT.Char.GetTitledFirstName]?\" — meu [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'lifestyle_nicknames_second',SelectLocalization(IsNomad(ROOT.Char),'lifestyle_nicknames_kurultai','lifestyle_nicknames_marshal'))] entra na tenda — \"Os comandantes gostariam de falar com você. Como gostaria de ser apresentado?\"\n\n[my_marshal.GetSheHe|U] está certo em sua implicação, o [ROOT.Char.Custom('WomenMenPeople_GenderPreference')] deveria saber que lutam sob alguém maior do que a vida."
 lifestyle_nicknames.0006.tt:0 "Você também é apenas um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] mortal, e nenhum [epithet|E] irá mudar isso."
 lifestyle_nicknames.0007.a:0 "Sou como uma sombra. Sigo todos os movimentos."
 lifestyle_nicknames.0007.b:0 "Observo de longe e ataco sem hesitação."
 lifestyle_nicknames.0007.c:0 "Ver meus súditos tremerem é a maior recompensa."
 lifestyle_nicknames.0007.d:0 "O segredo para o sucesso é o próprio segredo."
 lifestyle_nicknames.0007.desc:0 "Dizem que a influência é como a grama na primavera. Ela pode crescer por si só, mas eu cuidei pacientemente da minha até que se espalhasse por todo o meu reino, e além dele. O jardim, que cuidei tão laboriosamente, floresceu em algo verdadeiramente belo.\n\nO poder reside onde eu desejo. O preço que pago para manter as pessoas em silêncio é alto, mas é um sacrifício que estou dispost[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a fazer. Sou uma força a ser reconhecida, e devo ser lembrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] pela influência que possuo! Um nome poderoso deve cimentar meu lugar na história..."
 lifestyle_nicknames.0007.t:0 "Silêncio é Ouro"
 lifestyle_nicknames.0007.tt:0 "Você decide contra isso. Adotar um [nickname|E] infame certamente só serviria para frustrar seus esforços no futuro."
 lifestyle_nicknames.0008.a:0 "Minha sagacidade em administrar os assuntos do reino."
 lifestyle_nicknames.0008.b:0 "Segredos e sussurros que podem derrubar impérios."
 lifestyle_nicknames.0008.c:0 "Minha rede de influência meticulosamente construída."
 lifestyle_nicknames.0008.d:0 "Apenas as ações que tomo para ajudar a casa e o reino."
 lifestyle_nicknames.0008.desc:0 "Um [SelectLocalization( IsLandlessAdventurer(ROOT.Char),ROOT.Char.Custom('GetLaampDescribeTypeSelf'),'monarca')], que pode intimidar seus [ROOT.Char.Custom('GetFollowerOrVassalPlural')] e inspirar seu povo. Um [SelectLocalization( IsLandlessAdventurer(ROOT.Char),ROOT.Char.Custom('GetLaampDescribeTypeSelf'),'governante')] amado por seus súditos, empunhando o poder de mudar o destino do [ROOT.Char.Custom('GetRealmOrDomicile')]. Uma terra onde os poderosos não se aproveitam dos desamparados.\n\nEstes são os valores nos quais acredito! Desejo personificar esse sonho.\n\nA partir de agora, serei conhecido por..."
 lifestyle_nicknames.0008.tt:0 "Você decide não adotar um [epithet|E] - um reino próspero é sua própria recompensa."
 lifestyle_nicknames.0009.a:0 "...$nick_the_enlightened$!"
 lifestyle_nicknames.0009.b:0 "...$nick_the_truthseeker$!"
 lifestyle_nicknames.0009.c:0 "...$nick_the_chronicler$!"
 lifestyle_nicknames.0009.d:0 "..."
 lifestyle_nicknames.0009.desc:0 "A biblioteca em meu palácio é verdadeiramente impressionante. Milhares de livros, registros e pergaminhos, contendo conhecimentos desconhecidos para a maioria. Este é meu orgulho, uma das minhas maiores realizações.\n\nAs grandes mentes do passado ainda são lembradas, suas obras citadas e estudadas. Eu mereço fazer parte desse panteão. A partir de agora, serei conhecid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] como [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitledFirstName]..."
 lifestyle_nicknames.0009.t:0 "A Caneta é Poderosa"
 lifestyle_nicknames.0009.tt:0 "Você não adota um [cognomen|E], envergonhad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] que tal pensamento orgulhoso tenha cruzado sua mente."
 lifestyle_nicknames.0010.a:0 "Quem sou eu além de \"$nick_the_sage$?\""
 lifestyle_nicknames.0010.b:0 "Hm. Que tal \"$nick_the_scholar$?\""
 lifestyle_nicknames.0010.c:0 "Suponho que eu seja algo de um historiador..."
 lifestyle_nicknames.0010.d:0 "Sou apenas [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsName]."
 lifestyle_nicknames.0010.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], é hora.\" [my_chaplain.GetCouncilTitle|U] [my_chaplain.GetFirstName] se curva profundamente à porta dos meus aposentos.\n\nReuno minhas anotações em uma pilha na minha escrivaninha; sou supost[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a fazer um discurso sobre as recentes realizações culturais do reino, diante de emissários e embaixadores.\n\nMeu [my_chaplain.GetCouncilTitle] me para antes de entrarmos na sala:\n\"Eles todos conhecem #EMP de#! você, é claro - mas como você gostaria que eu [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] apresentasse?\""
 lifestyle_nicknames.0010.tt:0 "Você entra na sala sem um novo [nickname|E]."
 lifestyle_nicknames.0011.a.tt:0 "Você deixa claro para todos que pretende manter a sua [cognomen|E] escolhida e não aceitará de outra forma."
 lifestyle_nicknames.0011.a:0 "Eles podem não me respeitar, mas vão me obedecer!"
 lifestyle_nicknames.0011.b:0 "Eles estão certos. No que eu estava pensando?"
 lifestyle_nicknames.0011.desc:0 "Não importa para onde eu vá, não consigo escapar do olhar desaprovador de nobres e plebeus. Apesar das minhas melhores intenções, parece que o nome que escolhi para mim foi recebido com mais desprezo do que eu esperava.\n\nRetiro-me para meus aposentos e reflito sobre o que devo fazer..."
 lifestyle_nicknames.0011.t:0 "Reverberação"
 lifestyle_nicknames.1000.a:0 "Posso me acostumar com esse nome!"
 lifestyle_nicknames.1000.b:0 "'[nickname_getter.GetNicknameNoTooltip|U]'? #EMP O quê!?#! Absurdo!"
 lifestyle_nicknames.1000.c:0 "Um pequeno raio de luz na escuridão..."
 lifestyle_nicknames.1000.d:0 "Ah. Então a vida #emp pode#! piorar."
 lifestyle_nicknames.1000.desc:0 "\"M[Select_CString( nickname_getter.IsFemale, 'inha', 'eu' )] [informer.Custom2('RelationToMeShort', SCOPE.sC('nickname_getter'))], você ouviu o que te chamam?\" M[Select_CString( informer.IsFemale, 'inha', 'eu' )] [nickname_getter.Custom2('RelationToMeShort', SCOPE.sC('informer'))] [informer.GetFirstName] diz para mim, enquanto [informer.Custom('quirk_pos_pp')].\n\n"
 lifestyle_nicknames.1000.desc_bad:0 "\"Eles te chamam de #EMP '[nickname_getter.GetTitledFirstNameNicknamedNoTooltip]'#!... não é exatamente o que você chamaria de #EMP lisonjeiro#!, talvez você não possa fazer nada para mudar isso.\""
 lifestyle_nicknames.1000.desc_good:0 "\"Eles te chamam de #EMP '[nickname_getter.GetTitledFirstNameNicknamedNoTooltip]'#!, espetacular, não é mesmo? Está na boca do povo, tanto do camponês quanto do nobre.\""
 lifestyle_nicknames.1000.desc_prison:0 "\"[nickname_getter.GetFirstNameNoTooltip], você ouviu o que te chamam?\" [informer.GetFirstName] resmunga, batendo uma xícara nas grades de ferro.\n\n"
 lifestyle_nicknames.1000.e:0 "*Grunhir de aprovação*"
 lifestyle_nicknames.1000.end_bad_bad:0 "\n\n\"Melhor se acostumar com isso!\" [informer.GetFirstNameNoTooltip] ri enquanto se afasta."
 lifestyle_nicknames.1000.end_bad_good:0 "\n\n\"Pelo que vale, prometo não te chamar por esse nome.\" [informer.GetFirstNameNoTooltip] diz e sorri."
 lifestyle_nicknames.1000.end_good_bad:0 "\n\n\"Não era isso que eu escolheria para você...\" [informer.GetFirstNameNoTooltip] diz, visivelmente frustrado."
 lifestyle_nicknames.1000.end_good_good:0 "\n\n\"Motivo de comemoração, eu diria!\" [informer.GetFirstNameNoTooltip] exclama com um tom animado."
 lifestyle_nicknames.1000.f:0 "*Grunhir de desaprovação*"
 lifestyle_nicknames.1000.t:0 "Apelido: [nickname_getter.GetNicknameNoTooltip|U]"
 lifestyle_nicknames_kurultai:0 "[GetPlayer.GetCouncillorPosition( 'councillor_kurultai_1' ).GetPositionName]"
 lifestyle_nicknames_marshal:0 "[GetPlayer.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName]"
 lifestyle_nicknames_second:0 "[GetCourtPositionType('second_camp_officer').GetNameNoTooltip]"
 lifestyle_nicknames_steward:0 "[GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName]"
