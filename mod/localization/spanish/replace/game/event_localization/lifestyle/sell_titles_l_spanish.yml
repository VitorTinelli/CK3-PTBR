l_spanish:
 sell_titles.0001.a:0 "Preciso do dinheiro pelo bem do reino, entenda."
 sell_titles.0001.b:0 "Isso não é uma barganha em um mercado de camponeses!"
 sell_titles.0001.desc.dislike:0 "Não estou interessado nas promessas vazias que você está vendendo, mas se você está desesperado por ouro, acredito que podemos chegar a um acordo."
 sell_titles.0001.desc.normal:0 "Não busco honrarias maiores, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [vassal.Custom2('RelationToMeShort', ROOT.Char)], mas se você precisa de ouro, acredito que podemos chegar a um acordo."
 sell_titles.0001.opening:0 "[vassal.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 sell_titles.0002.a:0 "Você é um[Select_CString( friend.IsFemale, 'a', '' )] verdadeir[Select_CString( friend.IsFemale, 'a', 'o' )] amig[Select_CString( friend.IsFemale, 'a', 'o' )], [friend.GetFirstNameNoTooltip]!"
 sell_titles.0002.b:0 "Não posso aceitar isso."
 sell_titles.0002.desc:0 "Fui informado de que você está oferecendo títulos em troca de \"presentes\".\n\nMeu amigo, se você precisava de ouro, deveria ter me avisado!"
 sell_titles.0002.opening:0 "[friend.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 sell_titles.0003.a.flavor:0 "Quem dera todos entendessem como estou sendo extremamente generoso."
 sell_titles.0003.a:0 "Você é um vassalo verdadeiro e leal."
 sell_titles.0003.desc:0 "Estou honrado pelos títulos que você me ofereceu, e é claro que vou subsidiá-los, como é correto e adequado!\n\nNão tenho palavras para agradecer por essa honra. Farei o máximo por você, seja o que for que você exija."
 sell_titles.0004.a:0 "Assim será, então."
 sell_titles.0004.b:0 "Não se engrandeça!"
 sell_titles.0004.desc:0 "Chegou ao meu conhecimento que você está vendendo títulos, mesmo que eu mesmo não tenha sido adequadamente honrado por meu serviço.\n\nDe fato, considerando minhas conquistas em seu nome, alguns novos títulos não seriam de desprezar."
 sell_titles.0004.opening:0 "[vassal.Custom2('AppropriateGreeting', ROOT.Char)]"
 sell_titles.0005.a:0 "São? Oh."
 sell_titles.0005.b:0 "Não é isso que... Maldito seja você!"
 sell_titles.0005.desc:0 "Embora não venham com feudos, as obrigações associadas aos títulos que você está oferecendo são mais generosas do que eu poderia pedir.\n\nÉ claro que honrarei tamanha munificência com um presente adequado!"
 sell_titles.0006.a:0 "Como você ousa me envergonhar assim?!"
 sell_titles.0006.desc:0 "Embora saiba que arrisco sua ira, minha honra exige que eu me manifeste. Sua oferta de dar \"títulos\" em troca de \"presentes\" é motivada apenas pela ganância mesquinha, isso é evidente!\n\nMinha honra vem de minha nobreza, não de minha riqueza, mas para você parece ser o contrário!"
 sell_titles.1002.a.muslim:0 "Até Maomé era um comerciante!"
 sell_titles.1002.a:0 "Vamos celebrar o retorno [Select_CString( merchant.IsFemale, 'da minha', 'do meu' )] [merchant.Custom('SisterBrother')] há muito tempo perdid[Select_CString( merchant.IsFemale, 'a', 'o' )]!"
 sell_titles.1002.b:0 "Meu nome não está à venda, sob nenhuma circunstância!"
 sell_titles.1002.desc:0 "[Select_CString( merchant.IsFemale, 'Uma certa', 'Um certo' )] [merchant.GetTitledFirstName], um[Select_CString( merchant.IsFemale, 'a', '' )] comerciante ric[Select_CString( merchant.IsFemale, 'a', 'o' )], ouviu falar de minha tentativa de vender títulos supérfluos. [merchant.GetSheHe|U] tem uma sugestão muito mais audaciosa, no entanto:\n\n\"Se eu apresentasse evidências de que sou parente distante da Dinastia [ROOT.Char.GetDynasty.GetBaseName], você apoiaria minha reivindicação?\"\n\nA proposta é totalmente ridícula, mas [merchant.GetSheHe] possui uma quantidade ridícula de ouro..."
 sell_titles.1002.t:0 "Venda de Títulos: Uma Proposta Modesta"
 sell_titles.1004.a:0 "Talvez [merchant.GetSheHe] realmente seja de sangue nobre, afinal?"
 sell_titles.1004.desc:0 "Contra todas as probabilidades, [merchant.GetTitledFirstName], [Select_CString( merchant.IsFemale, 'a', 'o' )] comerciante que acabou por ser um[Select_CString( merchant.IsFemale, 'a', '' )] parente muito, muito distante, provou-se um[Select_CString( merchant.IsFemale, 'a', '' )] excelente guerreir[Select_CString( merchant.IsFemale, 'a', 'o' )]!\n\nQuem diria que [Select_CString( merchant.IsFemale, 'uma plebéia', 'um plebeu' )] poderia alcançar tais alturas?"
 sell_titles.1004.t:0 "Venda de Títulos: Um Excelente Negócio"
 sell_titles.1005.a:0 "Até mesmo ouro é encontrado entre pedras comuns, suponho."
 sell_titles.1005.desc:0 "Desde que aceitei [Select_CString( merchant.IsFemale, 'a', 'o' )] [merchant.GetTitledFirstName] - quer dizer, desde que [merchant.GetSheHe] retornou à família, [merchant.GetSheHe] provou ser popular entre os [ROOT.Char.GetFaith.AltPriestTermPlural]. Aparentemente [merchant.GetSheHe] é bastante sábi[Select_CString( merchant.IsFemale, 'a', 'o' )], muito mais do que se esperaria de um simples plebeu."
 sell_titles.1006.a:0 "Agradeça a [ROOT.Char.GetFaith.HighGodName] por isso, [merchant.GetSheHe] me deve."
 sell_titles.1006.desc:0 "Talvez novas perspectivas #EMP possam#! ser boas de vez em quando? [merchant.GetTitledFirstName], já suficientemente habilidoso para conquistar um lugar em minha Casa, provou-se incrivelmente hábil em navegar pelos perigos de minha corte. Às vezes, até me pergunto se [merchant.GetSheHe] sabe mais sobre o que está acontecendo do que eu!"
 sell_titles.1007.a:0 "Que pena..."
 sell_titles.1007.desc:0 "Há uma razão pela qual plebeus não são feitos nobres a bel-prazer. Desde que [Select_CString( merchant.IsFemale, 'a', 'o' )] [merchant.GetTitledFirstName] se juntou à minha corte, [merchant.GetSheHe] tem sido apenas uma vergonha!\n\nEu apoiei sua reivindicação de fazer parte de minha Casa, então não há nada a ser feito agora, mas é um erro que não pretendo cometer novamente!"
 sell_titles.1007.t:0 "Venda de Títulos: Ovelha Negra"
