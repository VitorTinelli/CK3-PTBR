l_spanish:
 betrayed_by_proxy:0 "Traído por Procuração"
 diarch_attempt_to_overthrow_liege.desc.coup_start_boilerplate:0 "\n\n\"[liege.GetFirstName]!\" exclama [usurper.GetFirstNameNoTooltip], \"Eu o nomeio como pretender, indigno de seu trono! Entregue-o ao verdadeiro governante do reino. #EMP A mim.#!\"\n\nVários cavaleiros menores tentam bloquear o avanço [usurper.GetHerHim], apenas para serem brutalmente assassinados em pouco tempo."
 diarch_attempt_to_overthrow_liege.event.t:0 "Um Golpe Muito Aguardado:"
 diarch_coup_equal_truce:0 "[liege.GetUINameNotMe|U] concordou com isso após o golpe [usurper.GetUINamePossessive|U]"
 diarch_coup_unequal_truce_for_liege:0 "[liege.GetUINameNotMe|U] concordou com isso após o golpe sem derramamento de sangue de [usurper.GetUINamePossessive|U]"
 diarch_coup_unequal_truce_for_usurper:0 "$diarch_coup_unequal_truce_for_liege$"
 diarch_title_diarch:0 "diarca"
 diarch_title_regent:0 "regente"
 diarchies.0000.diarch_fails_at_mandate.t:0 "[liege.GetDiarchTitle|U] falha em cumprir o Mandato"
 diarchies.0000.diarch_fails_to_skim_mandate.t:0 "[liege.GetDiarchTitle|U] não consegue tirar proveito do [mandate|E]"
 diarchies.0000.diarch_fulfills_mandate.t:0 "[liege.GetDiarchTitle|U] cumpre o Mandato"
 diarchies.0000.diarch_lax_with_mandate.t:0 "[liege.GetDiarchTitle|U] evita as responsabilidades do [mandate|E]"
 diarchies.0000.diarch_mandate_fail.tt.acquire_character.liege:0 "[diarch.GetSheHe|U] tentou recrutar um membro da corte para você"
 diarchies.0000.diarch_mandate_fail.tt.acquire_character.self:0 "[diarch.GetSheHe|U] tentou garantir a lealdade de um [character|E] para [diarch.GetHerselfHimself]"
 diarchies.0000.diarch_mandate_fail.tt.acquire_troops.liege:0 "[diarch.GetSheHe|U] tentou adquirir soldados para você"
 diarchies.0000.diarch_mandate_fail.tt.acquire_troops.split:0 "[diarch.GetSheHe|U] tentou adquirir soldados para ambos"
 diarchies.0000.diarch_mandate_fail.tt.affect_contract.liege:0 "[diarch.GetSheHe|U] tentou afetar positivamente o [vassal_contract|E] de um [vassal|E] para você"
 diarchies.0000.diarch_mandate_fail.tt.affect_faction.liege:0 "[diarch.GetSheHe|U] tentou desarmar uma [faction|E]"
 diarchies.0000.diarch_mandate_fail.tt.boost_authority.liege:0 "[diarch.GetSheHe|U] tentou aumentar sua autoridade"
 diarchies.0000.diarch_mandate_fail.tt.harass_peasants.liege:0 "[diarch.GetSheHe|U] tentou obter recursos da população camponesa"
 diarchies.0000.diarch_mandate_fail.tt.network.self:0 "[diarch.GetSheHe|U] tentou conquistar a simpatia dos [vassals|E] em seu nome"
 diarchies.0000.diarch_mandate_fail.tt.obtain_gold.liege:0 "[diarch.GetSheHe|U] tentou obter ouro para você"
 diarchies.0000.diarch_mandate_fail.tt.obtain_gold.self:0 "[diarch.GetSheHe|U] tentou obter ouro para si mesmo"
 diarchies.0000.diarch_mandate_fail.tt.obtain_gold.split:0 "[diarch.GetSheHe|U] tentou obter ouro para ambos"
 diarchies.0000.diarch_mandate_fail.tt.train_self.self:0 "[diarch.GetSheHe|U] focou em treinar [diarch.GetHerselfHimself] em vez de suas tropas"
 diarchies.0000.diarch_rejects_mandate.t:0 "[liege.GetDiarchTitle|U] rejeita o [mandate|E] devido ao [personality_trait|E]"
 diarchies.0000.diarch_skims_mandate.t:0 "[liege.GetDiarchTitle|U] tira proveito do [mandate|E]"
 diarchy.0000.tt.diarch_shirked_duties:0 "[Select_CString(diarch.IsLocalPlayer, 'Você', diarch.GetFirstName)] [Select_CString(diarch.IsLocalPlayer, 'despreza', 'desprezou')] suas responsabilidades como [diarch|E]"
 diarchy.0021.a.sedate:0 "Eu já tenho tantas ideias para o reino!"
 diarchy.0021.a:0 "Eu começarei meu #EMP reinado#! imediatamente!"
 diarchy.0021.b:0 "Ah, o reconhecimento."
 diarchy.0021.c:0 "Receio que tenho compromissos urgentes demais..."
 diarchy.0021.desc.appointment_nature.child:0 "Com [liege.Custom2('MyCharacterIntroduction', ROOT.Char)] ainda uma criança, fica claro que [liege.GetSheHe] não pode governar efetivamente o [liege.GetPrimaryTitle.GetName]. [liege.GetSheHe|U] precisa de uma mão firme e segura para orientá-l[Select_CString( liege.IsFemale, 'a', 'o' )], pelo menos até a sua maioridade."
 diarchy.0021.desc.appointment_nature.fallback:0 "É óbvio para todos os [liege.GetPrimaryTitle.GetName] que [liege.Custom2('MyCharacterIntroduction', ROOT.Char)] não pode assumir os fardos do governo por [liege.GetHerselfHimself], sem causar danos irreparáveis às nossas terras."
 diarchy.0021.desc.appointment_nature.imprisoned:0 "Com [liege.Custom2('MyCharacterIntroduction', ROOT.Char)] aprisionado [Select_CString( liege.IsFemale, 'pela', 'pelo' )] [liege.GetImprisonedBy.GetTitledFirstName], o [liege.GetPrimaryTitle.GetName] está sem rumo e à deriva. A comunicação do nosso senhor feudal ocorre apenas quando seu carcereiro permite, e qual correspondência #EMP verdadeiramente#! vem d[Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitleAsNameNoTooltip] é motivo de debate constante."
 diarchy.0021.desc.appointment_nature.incapable:0 "Com [liege.Custom2('MyCharacterIntroduction', ROOT.Char)] reduzido a um #EMP fraco# e trêmulo, o [liege.GetPrimaryTitle.GetName] está à beira de uma anarquia absoluta. Especialmente porque, dadas as suas condições, quem sabe quanto tempo ficaremos sem autoridade?"
 diarchy.0021.desc.appointment_nature.travelling:0 "Com [liege.Custom2('MyCharacterIntroduction', ROOT.Char)] atualmente ocupado em terras estrangeiras, o [liege.GetPrimaryTitle.GetName] fica em um estado de incerteza tranquila. Sem um[Select_CString( liege.IsFemale, 'a', '' )] [liege.GetTitleAsNameNoTooltip] presente, não há autoridade vinculativa, e #EMP isso#! deixa os vassalos nervosos."
 diarchy.0021.desc.appointment_nature.war:0 "Com [liege.Custom2('MyCharacterIntroduction', ROOT.Char)] ausente lutando na guerra, as tensões estão acirradas entre nós que ficamos para trás. A comunicação d[Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitleAsNamePossessiveNoTooltip] é irregular, e a pilha de disputas cresce a cada dia."
 diarchy.0021.desc.diarchy_type.fallback:0 "\n\nParece claro que não podemos continuar como estamos. Já que [liege.GetTitledFirstNameNoTooltip] não pode governar por [liege.GetHerselfHimself], alguém deve servir como [liege.GetSheHe]"
 diarchy.0021.desc.diarchy_type.regency_entrenched:0 "\n\nComo essa situação provavelmente vai persistir por algum tempo, o reino precisa saber a quem recorrer quando [liege.GetTitledFirstNameNoTooltip] não puder fazer justiça pessoalmente. Precisamos de alguém para servir, permanentemente, como"
 diarchy.0021.desc.diarchy_type.regency_temporary:0 "\n\nEmbora o dever não seja esperado para durar muito tempo, alguém deve cuidar do reino, arbitrar disputas e manter o trono aquecido para [liege.GetTitledFirstNameNoTooltip] como"
 diarchy.0021.desc.outro:0 "[liege.GetDiarchTitle|U].\n\nNaturalmente, esse alguém sou eu."
 diarchy.0021.reminder.diarch_powers:0 "Você ganhou acesso a [diarch_powers|E], que podem ser usados contra seu [liege|E] e outros [vassals|E]"
 diarchy.0021.reminder.scales_of_power:0 "As [scales_of_power|E] foram ativadas e podem ser balançadas para desbloquear mais [diarch_powers|E]"
 diarchy.0021.t:0 "Convocado para se tornar [liege.GetDiarchTitle|U]"
 diarchy.0511.a:0 "Bah, isso é inútil."
 diarchy.0511.b:0 "Novamente. Conseguiremos [liege.GetSheHe] da próxima vez."
 diarchy.0511.desc.discovered:0 "e, pior ainda, um dos brutamontes foi capturado e #EMP entregou tudo#! sob interrogatório. Tanto [target.GetFirstNameNoTooltip] quanto [liege.GetTitledFirstName] sabem exatamente o que eu tentei fazer!"
 diarchy.0511.desc.intro:0 "Maldição e inferno! sua pele curtida, [target.GetTitledFirstName] escapou dos meus capangas, "
 diarchy.0511.desc.outro:0 "\n\nPor enquanto, o título de [target.GetDiarchTitle] no reino permanece inalterado."
 diarchy.0511.desc.undiscovered:0 "mas pelo menos os mercenários conseguiram se matar em vez de serem capturados.\n\nNão há rastro que me leve de volta, pelo menos não diretamente, e, portanto, nada que [target.GetFirstNameNoTooltip] ou [liege.GetTitledFirstName] possam me acusar."
 diarchy.0511.t:0 "$overthrow_regent$: Fracasso"
 diarchy.0521.a:0 "Estou chocad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]!"
 diarchy.0521.b:0 "Sobre..."
 diarchy.0521.desc.discovered:0 "[Select_CString( owner.IsFemale, 'A', 'O' )] patife [owner.GetTitledFirstName] tentou me sequestrar e confiscar as ferramentas do meu cargo junto comigo!\n\nÉ evidente que [owner.GetSheHe] pretendia me forçar a sair do cargo, tornando [owner.GetHerselfHimself] a [liege.GetDiarchTitle] no processo. Esse crime repugnante não pode ficar impune."
 diarchy.0521.desc.undiscovered:0 "Escrevo para informá-lo que houve uma tentativa em minha liberdade — um grupo de rufiões tentou me sequestrar e levar as ferramentas do meu cargo.\n\nQuem os pagou não está claro, mas a manobra parece óbvia o suficiente. Controlar minha pessoa e meu simbolismo como [liege.GetDiarchTitle] pode permitir que seu mandante usurpe meu lugar legítimo."
 diarchy.0521.t:0 "[Select_CString( liege.IsFemale, 'À', 'Ao' )] nobre [liege.GetTitledFirstName],"
 diarchy.0531.a.paranoid:0 "Então #EMP há#! uma conspiração! Eu sabia!"
 diarchy.0531.a.scheme_discovered:0 "[owner.GetFirstNameNoTooltip], esse canalha!"
 diarchy.0531.a.scheme_secret:0 "Haverá outra tentativa. Tenho certeza disso."
 diarchy.0531.a.trusting:0 "Como... como alguém poderia fazer isso?"
 diarchy.0531.desc.discovered:0 "Sob interrogatório, um bandido capturado revela para quem eles estavam trabalhando: ninguém menos que [target.Custom2('MyCharacterIntroduction', owner)]!"
 diarchy.0531.desc.intro:0 "Derrapo pelo corredor, os sons da luta em andamento ainda ecoando em meus ouvidos. Esses infames mercenários pareciam surgir das paredes! Completamente desarmado, apenas a intervenção oportuna dos meus guardas me permitiu escapar.\n\n"
 diarchy.0531.desc.outro:0 "\n\nClaramente, ser o [target.GetDiarchTitle] colocou um alvo nas minhas costas. Eu deveria ter sabido..."
 diarchy.0531.desc.undiscovered:0 "Em questão de um ou dois minutos, todos estão mortos, e o segredo de quem os pagou morre com eles."
 diarchy.0531.t:0 "$overthrow_regent$: Tentativa Fracassada"
 diarchy.0551.a:0 "Suave como seda."
 diarchy.0551.desc:0 "Uma operação simples e robusta. Um grupo de mercenários sob meu comando apreendeu o nosso então-[owner.GetDiarchTitle] em seu escritório, contrabandeando [target.GetSheHe] para fora do prédio algemado e vendado dentro de um saco velho.\n\nCom um mínimo derramamento de sangue e usando os selos retirados diretamente da mesa de [target.GetTitledFirstName], preparei uma confissão de uma série de crimes que justificam a transferência de poder. O suficiente para tornar as coisas oficiais, mesmo que não seja o bastante para potencialmente me causar problemas com [liege.GetTitledFirstName] no futuro.\n\nÉ claro que farei questão de entregar uma cópia preliminar para [target.GetFirstNameNoTooltip]. Algo para ler durante seu confinamento."
 diarchy.0551.t:0 "$overthrow_regent$: Sucesso"
 diarchy.0561.a:0 "É o que é, por enquanto..."
 diarchy.0561.desc:0 "Tenho o prazer de informar que [target.GetTitledFirstName] renunciou ao seu cargo de [liege.GetDiarchTitle] em favor de mim após uma breve, porém animada, discussão.\n\nJá que as responsabilidades estavam pesando tanto n[target.GetSheHe], [target.GetSheHe] ficará comigo durante o tempo que eu permanecer como [liege.GetDiarchTitle]. Pela sua saúde."
 diarchy.0561.t:0 "[Select_CString( liege.IsFemale, 'À', 'Ao' )] nobre [liege.GetTitledFirstName]"
 diarchy.0571.a:0 "[liege.GetTitledFirstNameNoTooltip] ficará sabendo disso! [liege.GetSheHe|U] ficará sabendo!"
 diarchy.0571.desc.intro:0 "#EMP Minha cabeça#!. Eu... onde estou? [owner.GetTitledFirstName]?\n\n\"É bom ver que você ainda está conosco, [target.GetFirstName]\", [owner.GetSheHe] sorri, jogando uma pilha de papéis aos meus pés, \"para sua leitura. É uma lista dos crimes que você admitiu como [owner.GetDiarchTitle] antes de entregar seu cargo para mim. Pensei que você gostaria de ter uma cópia.\"\n\n"
 diarchy.0571.desc.outro.blind:0 "Não preciso ser capaz de ver as mentiras rabiscadas para saber a extensão da sua fabricação ou intuir que isso já tenha chegado a todos em [liege.GetPrimaryTitle.GetBaseNameNoTier]."
 diarchy.0571.desc.outro.sighted:0 "Folheio freneticamente o texto rabiscado, página após página de fabricação descarada e interpretação intencionalmente equivocada. Quero negar, negar tudo, mas sei que isso já chegou a todos em [liege.GetPrimaryTitle.GetBaseNameNoTier] agora."
 diarchy.0571.t:0 "$overthrow_regent$: Preso"
 diarchy.1201.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1201.a:0 "Por autoridade de [liege.GetTitledFirstNameNoTooltip], você #EMP pagará#!."
 diarchy.1201.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1201.b.tt.failure:0 "[Select_CString( exploitable_vassal.IsFemale, 'A', 'O' )] [exploitable_vassal.GetTitleAsNameNoTooltip] permanece firme"
 diarchy.1201.b.tt.success:0 "[exploitable_vassal.GetFirstNameNoTooltip] cede"
 diarchy.1201.b:0 "Você diz isso, mas esses registros mostram apenas receitas parciais..."
 diarchy.1201.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1201.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1201.c.tt.failure:0 "$diarchy.1201.b.tt.failure$"
 diarchy.1201.c.tt.success:0 "$diarchy.1201.b.tt.success$"
 diarchy.1201.c:0 "[Select_CString( liege.IsFemale, 'A', 'O' )] [liege.GetTitleAsNameNoTooltip] e eu não estamos pedindo. Estamos ordenando."
 diarchy.1201.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1201.d:0 "Eu não posso fazer isso — é claro que seus impostos estão em ordem, por favor, ignore-me."
 diarchy.1201.desc:0 "\"Impostos atrasados? O que você quer dizer com #EMP impostos atrasados#!?\" zomba [exploitable_vassal.GetTitledFirstName]. \"Eu pago meus impostos à Coroa pontualmente e até a última moeda, como os demais, e não aprecio ser extorquido por mais dinheiro\".\n\n[exploitable_vassal.GetSheHe|U] está mais... resistente à ideia de pagar um dízimo extra do que eu esperava, mas meu mandato como [liege.GetDiarchTitle] me obriga a buscar tais coisas para servir ao meu senhor feudal."
 diarchy.1201.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.1201.e:0 "Você está certo. Considere essas dívidas esquecidas."
 diarchy.1201.t:0 "Corações Abertos, Bolsos Abertos"
 diarchy.1211.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1211.a:0 "Estou, e se você não gosta desses testemunhos, tenho outros."
 diarchy.1211.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1211.b.tt.failure:0 "Sua posição desmorona sob escrutínio"
 diarchy.1211.b.tt.success:0 "Você convence [exploitable_vassal.GetFirstNameNoTooltip] a se submeter"
 diarchy.1211.b:0 "Os testemunhos são relevantes — esses juramentos são sagrados."
 diarchy.1211.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1211.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1211.c.tt.failure:0 "O [exploitable_vassal.GetTitleAsNameNoTooltip] se recusa a ser chantageado"
 diarchy.1211.c.tt.success:0 "[exploitable_vassal.GetFirstNameNoTooltip] paga"
 diarchy.1211.c:0 "Bem, ou uma nova homenagem e um pequeno dízimo para o #EMP tesouro#!."
 diarchy.1211.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1211.d:0 "Seria severo cobrar de você alguns erros de palavra..."
 diarchy.1211.desc:0 "\"... e vários desses testemunhos dos seus juramentos de fidelidade confirmam que você prometeu #EMP exceder#! suas obrigações, não apenas cumpri-las\", eu concluo. [exploitable_vassal.GetTitledFirstName] me encara através da mesa do conselho, perplexo.\n\n\"Você está sugerindo que o testemunho de algum nobre insignificante justifica eu dever ainda #EMP mais#! ao nosso senhor feudal?\" [exploitable_vassal.GetSheHe] gagueja, ainda atordoado pela audácia da minha afirmação.\n\nÉ uma sugestão arriscada, mas meu mandato como [liege.GetDiarchTitle] exige que eu avance a posição d[Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitledFirstName]."
 diarchy.1211.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.1211.e:0 "Talvez... talvez tudo isso seja um pouco nebuloso..."
 diarchy.1211.t:0 "Termos e Condições"
 diarchy.1221.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1221.a:0 "Eles irão para onde eu os mover quando eu os mover."
 diarchy.1221.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1221.b.tt.failure:0 "Os moradores se unem em solidariedade"
 diarchy.1221.b.tt.success:0 "O ouro tem sucesso onde o aço falhou"
 diarchy.1221.b:0 "Talvez se eu oferecer recomendações adequadas?"
 diarchy.1221.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1221.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1221.c.tt.failure:0 "Sua reputação por negociações desonestas se espalha"
 diarchy.1221.c.tt.success:0 "Uma pequena taxa e a solidariedade local são quebradas"
 diarchy.1221.c:0 "As famílias mais abastadas #EMP poderiam#! servir de outra maneira..."
 diarchy.1221.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1221.d.tt:0 "Você folga a tarde inteira"
 diarchy.1221.d:0 "Todo esse trabalho para presentear #EMP [liege.GetFirstNameNoTooltip]#! com moedas?"
 diarchy.1221.desc:0 "De acordo com o meu mandato d[Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitledFirstName], meu dever principal como regente é encher os seus cofres. Uma maneira fácil de fazer isso é ajudar a povoar as áreas periféricas de [recipient_county.GetNameNoTier], movendo servos e pequenos proprietários de minha própria [actor_county.GetName] para as terras de [liege.GetFirstNamePossessiveNoTooltip].\n\nExceto que os camponeses se recusam a sair. Cada família realocada à força é como arrancar um dente, como se eles #EMP se opusessem#! a serem movidos por seus superiores."
 diarchy.1221.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.1221.e:0 "Ah, deixe-os ficar em suas terras se amam tanto sua sujeira!"
 diarchy.1221.t:0 "Seu Novo Lar"
 diarchy.1231.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1231.a:0 "Quem se importa com o que eles pensam? Um criminoso é um criminoso."
 diarchy.1231.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1231.b.tt.failure:0 "Os moradores se recusam a cumprir"
 diarchy.1231.b.tt.success:0 "As pessoas não reclamam mais do que já reclamavam"
 diarchy.1231.b:0 "Podemos encontrar um equilíbrio nas acusações, eu acredito."
 diarchy.1231.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1231.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1231.c.tt.failure:0 "$diarchy.1231.b.tt.failure$"
 diarchy.1231.c.tt.success:0 "$diarchy.1231.b.tt.success$"
 diarchy.1231.c:0 "Todo esse trabalho certamente exige uma pequena remuneração..."
 diarchy.1231.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1231.d:0 "Deveríamos #EMP diminuir#! as multas, não aumentá-las!"
 diarchy.1231.desc:0 "O mandato emitido [Select_CString( liege.IsFemale, 'pela', 'pelo' )] [liege.GetTitledFirstName] me instrui a buscar receitas para o trono, e uma forma de renda atualmente subexplorada pelo meu senhor feudal são as cortes. Magistrados e nobres menores multam criminosos comuns diariamente, mas ficam com a maior parte dos fundos arrecadados.\n\n[exploitable_county.GetNameNoTier] é particularmente rica em tal escória, e aumentar o custo das multas para os locais por suas contravenções seria altamente lucrativo, embora também altamente impopular."
 diarchy.1231.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.1231.e:0 "Isso tudo parece estar além do meu escopo."
 diarchy.1231.t:0 "Cada centavo conta"
 diarchy.1241.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1241.a:0 "[diarch.Custom('GetFaithTaxExemptInstitution')|U]? Eles tiveram tudo do jeito deles por tempo demais!"
 diarchy.1241.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1241.b.tt.failure:0 "Seu nome é amaldiçoado e sua bolsa está vazia"
 diarchy.1241.b.tt.success:0 "Apesar das reclamações, eles pagam o dízimo"
 diarchy.1241.b:0 "Certamente uma taxa especial para despesas necessárias não daria errado, não é mesmo?"
 diarchy.1241.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1241.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1241.c.tt.failure:0 "$diarchy.1241.b.tt.failure$"
 diarchy.1241.c.tt.success:0 "$diarchy.1241.b.tt.success$"
 diarchy.1241.c:0 "Claro, uma compensação é devida àqueles prejudicados por tais impostos..."
 diarchy.1241.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1241.d:0 "Toda essa controvérsia apenas pelos cofres de [liege.GetFirstNamePossessiveNoTooltip]? Nunca."
 diarchy.1241.desc:0 "Uma das minhas obrigações como [liege.GetDiarchTitle] é cumprir o mandato estabelecido [Select_CString( liege.IsFemale, 'pela', 'pelo' )] [liege.GetTitledFirstName], que, no momento, exige dinheiro vivo.\n\nTenho quebrado a cabeça em busca de novas fontes de renda para a Coroa e sempre acabo retornando a uma solução óbvia, porém pouco ortodoxa: [diarch.Custom('GetFaithTaxExemptInstitution')].\n\nTradicionalmente isenta da maioria dos impostos, uma taxa especial sobre [diarch.Custom('GetFaithTaxExemptInstitution')] provavelmente seria lucrativa. Apenas... não exatamente piedosa."
 diarchy.1241.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.1241.e:0 "Eu não posso fazer isso. Eu #EMP não#! vou fazer isso."
 diarchy.1241.t:0 "Um assunto tributário"
 diarchy.1701.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1701.a:0 "Acho que vocês dois estão falando um do outro - permitam-me..."
 diarchy.1701.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1701.b.tt.failure:0 "Os conselheiros ignoram você"
 diarchy.1701.b.tt.success:0 "Você controla a conversa"
 diarchy.1701.b:0 "Nobres senhores, estamos nos desviando do assunto..."
 diarchy.1701.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1701.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1701.c.tt.failure:0 "Você claramente não entende o debate deles"
 diarchy.1701.c.tt.success:0 "[councillor_1.GetFirstNameNoTooltip] recebe com satisfação o seu apoio"
 diarchy.1701.c:0 "[councillor_1.GetFirstNameNoTooltip] #EMP está#! corret[Select_CString( councillor_1.IsFemale, 'a', 'o' )], e a Coroa apoia [councillor_1.GetSheHe]."
 diarchy.1701.d.custom.both_councillors:0 "Ambos os conselheiros:"
 diarchy.1701.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1701.d:0 "#EMP Pelo amor de [diarch.GetFaith.HighGodName], vocês dois não poderiam simplesmente #BER calar a boca?!#!"
 diarchy.1701.desc:0 "Sendo [liege.GetDiarchTitle] d[Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitledFirstNamePossessive], tenho o dever de seguir seu mandato de promover a autoridade central no [liege.GetPrimaryTitle.GetNameNoTier].\n\nHoje, isso me levou a uma câmara de conselho tensa, com [councillor_1.GetTitledFirstName] o [councillor_1.Custom('CouncilPosition')] e [councillor_2.GetTitledFirstName] o [councillor_2.Custom('CouncilPosition')] gritando um com o outro por causa de assuntos pessoais mesquinhos.\n\nEu esperava obter um acordo para aprovar vários privilégios para [Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitleAsNameNoTooltip], mas não vou a lugar nenhum até que essa discussão termine."
 diarchy.1701.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.1701.e:0 "Eu me pergunto se eles notariam se eu tirasse uma soneca..."
 diarchy.1701.t:0 "O Direito de Governar"
 diarchy.1711.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1711.a:0 "Não sou conhecido por minha mente justa e legal?"
 diarchy.1711.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1711.b.tt.failure:0 "As lacunas em seu argumento são óbvias"
 diarchy.1711.b.tt.success:0 "Sua teoria legal é incontestável"
 diarchy.1711.b:0 "Muito bem, vamos revisar os argumentos novamente..."
 diarchy.1711.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1711.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1711.c.tt.failure:0 "O reino ouve sobre sua desonestidade"
 diarchy.1711.c.tt.success:0 "[exploitable_vassal.GetFirstNameNoTooltip] lhe suborna"
 diarchy.1711.c:0 "A Coroa #EMP poderia#! aceitar uma compensação em vez disso."
 diarchy.1711.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1711.d:0 "Como você pode ser tão obtuso? É simples!"
 diarchy.1711.desc:0 "\"Sinceramente, pensei que essa questão estivesse resolvida. Meus acordos com [liege.GetTitledFirstName] deveriam estar fixados da última vez que renegociamos minhas obrigações\", resmunga [exploitable_vassal.GetTitledFirstName]. \"Não entendo como você pode dizer que eu consegui anular meus juramentos dessa forma? Certamente as palavras deveriam ser vinculativas para sempre?\"\n\n[exploitable_vassal.GetSheHe|U] não está totalmente errado. Estou buscando no ar com isso, mas eu sou o [liege.GetDiarchTitle] e meu mandato é claro como um lindo dia de verão. Se os juramentos de [exploitable_vassal.GetFirstNamePossessiveNoTooltip] estão parcialmente anulados, então [Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitleAsNameNoTooltip] terá margem para ajustá-los, e eu terei feito meu trabalho."
 diarchy.1711.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.1711.e:0 "Ah, esqueça. Isso não vale a pena."
 diarchy.1711.t:0 "Data de Expiração"
 diarchy.1721.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1721.a:0 "Acaso não fizemos ambos um juramento a [liege.GetTitledFirstNameNoTooltip]?"
 diarchy.1721.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1721.b.tt.failure:0 "[exploitable_vassal.GetFirstNameNoTooltip] não se preocupa com suas ameaças"
 diarchy.1721.b.tt.success:0 "[Select_CString( exploitable_vassal.IsFemale, 'A', 'O' )] [exploitable_vassal.GetTitleAsNameNoTooltip] entende o seu ponto"
 diarchy.1721.b:0 "Você está certo. Meu castelo certamente não será o primeiro a ser sitiado."
 diarchy.1721.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1721.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1721.c.tt.failure:0 "Talvez eles #EMP tenham#! queixas contra você"
 diarchy.1721.c.tt.success:0 "Você negocia por uma promessa vinculativa e uma pequena homenagem"
 diarchy.1721.c:0 "Eu poderia ser persuadido a ignorar suas... atividades..."
 diarchy.1721.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1721.d:0 "Suponho que, no final das contas, não é #EMP meu#! problema."
 diarchy.1721.desc:0 "\"Eu nem entendo por que você está tão ansioso para se envolver, [diarch.GetFirstName]\", suspira [exploitable_vassal.GetTitledFirstName], \"não é como se nossas queixas fossem com você.\"\n\nNão é segredo que [Select_CString( exploitable_vassal.IsFemale, 'a', 'o' )] [exploitable_vassal.GetTitleAsNameNoTooltip] tem ambições que vão contra a vontade de [liege.GetTitledFirstName]. Ambições que poderiam arrastar o reino para uma desastrosa guerra civil se não forem controladas.\n\nComo [liege.GetDiarchTitle] do meu senhor feudal, faz parte do meu mandato tentar amenizar as tensões entre os dois, mas até agora [exploitable_vassal.GetSheHe] parece imune aos meus esforços."
 diarchy.1721.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.1721.e:0 "Envolvido? Apenas curioso! Esta foi apenas uma visita social."
 diarchy.1721.t:0 "Resolvendo Reclamações"
 diarchy.1731.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1731.a:0 "Por favor, sejam civilizados! Vou ouvir seus problemas em sequência."
 diarchy.1731.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1731.b.tt.failure:0 "A multidão te ataca com produtos podres"
 diarchy.1731.b.tt.success:0 "Você acalma seus ânimos"
 diarchy.1731.b:0 "Súditos nobres, não podemos encontrar uma causa comum?"
 diarchy.1731.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1731.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1731.c.tt.failure:0 "Isso não é sobre #EMP você#!"
 diarchy.1731.c.tt.success:0 "O povo acredita que você corrigirá suas injustiças"
 diarchy.1731.c:0 "Essas questões são graves! #EMP Eu#! nunca permitiria isso."
 diarchy.1731.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1731.d:0 "Pela ira inevitável de [diarch.GetFaith.HighGodName], vocês brutamontes #EMP poderiam parar de#! agir como idiotas?!"
 diarchy.1731.desc:0 "A multidão se aglomera diante de mim, uma turba diversa de representantes irritados de [county_1.GetNameNoTier], [county_2.GetNameNoTier] e [county_3.GetNameNoTier], cidades e vilas diversas unidas por sua condenação [Select_CString( liege.IsFemale, 'a', 'ao' )] [liege.GetTitledFirstName]. Como [liege.GetDiarchTitle] seu infeliz, cabe a mim tentar acalmá-los, de acordo com meu mandato.\n\nSem uma liderança central clara, a multidão me insulta, gritando preocupações e incidentes detalhados em excesso."
 diarchy.1731.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.1731.e:0 "Sim, sim. Lidaremos com tudo isso. Eventualmente."
 diarchy.1731.t:0 "Ajustando Contas"
 diarchy.1741.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1741.a:0 "Acho que você está ignorando o quanto [Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitleAsNameNoTooltip] faz por você..."
 diarchy.1741.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1741.b.tt.failure:0 "O conselho continua difícil"
 diarchy.1741.b.tt.success:0 "Você ilumina seus colegas"
 diarchy.1741.b:0 "E você também não deveria, mas um melhor serviço incentiva a benevolência..."
 diarchy.1741.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1741.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1741.c.tt.failure:0 "Você está claramente fazendo um show"
 diarchy.1741.c.tt.success:0 "O conselho aprecia seu ponto de vista"
 diarchy.1741.c:0 "A Coroa não pertence #EMP apenas#! [Select_CString( liege.IsFemale, 'a', 'ao' )] [liege.GetTitleAsNameNoTooltip]."
 diarchy.1741.custom.several_councillors:0 "Cada [councillor|E] presente\t"
 diarchy.1741.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1741.d:0 "Não é tão difícil? O que exatamente #EMP você#! está insinuando, s[Select_CString( councillor_1.IsFemale, 'ua', 'eu' )] [councillor_1.Custom2('InsultNoun', ROOT.Char)]?"
 diarchy.1741.desc:0 "\"Não somos contrários aos desejos d[Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitledFirstNamePossessive]\", diz [councillor_1.GetTitledFirstName] em tom arrastado, zombando o tempo todo, \"apenas não somos escravizados por eles. Não é tão difícil de entender\".\n\nPassei a maior parte da tarde tentando melhorar as relações entre meu senhor feudal e os conselheiros, sem sucesso, em grande parte devido à obstinação ignorante dess[Select_CString( councillor_1.IsFemale, 'a', 'e' )] [councillor_1.GetWomanMan].\n\nSuspiro internamente. Sou o [liege.GetDiarchTitle], e meu mandato exige essas obrigações."
 diarchy.1741.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.1741.e:0 "Nunca vamos chegar a um acordo comum."
 diarchy.1741.t:0 "Veja por esse ângulo"
 diarchy.2201.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.2201.a:0 "Se eles conseguem empunhar uma lança, também podem morrer por uma!"
 diarchy.2201.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.2201.b.tt.failure:0 "Os locais desenvolvem pernas mancas aos montes"
 diarchy.2201.b.tt.success:0 "Você estimula a imaginação dos camponeses"
 diarchy.2201.b:0 "Deixe os camponeses saberem que esta é a chance deles de #EMP saquear#!."
 diarchy.2201.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.2201.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.2201.c.tt.failure:0 "Segue-se uma amarga recriminação"
 diarchy.2201.c.tt.success:0 "Um pouco de imposto extra, algumas milícias adicionais"
 diarchy.2201.c:0 "Tenho certeza de que os mais ricos pagariam para serem ignorados..."
 diarchy.2201.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.2201.d:0 "Essas pessoas cumpriram suas obrigações. Isso é o suficiente."
 diarchy.2201.desc:0 "Os habitantes de [exploitable_county.GetNameNoTier] são obrigados a fornecer um certo número de tropas para [liege.GetTitledFirstName], o que eles fazem sempre que solicitado.\n\nIsso não significa que todos em idade de lutar na região o façam, no entanto, e minhas recentes investigações como [liege.GetDiarchTitle] mostraram que suas obrigações são quase #EMP surpreendentemente#! leves. Os números que poderíamos estar convocando são muito superiores aos contingentes insignificantes realmente recrutados.\n\nOs habitantes resistem, mas meu mandato me impulsiona mesmo assim."
 diarchy.2201.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.2201.e:0 "Eu não farei o trabalho sujo d[Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitleAsNameNoTooltip] aqui."
 diarchy.2201.t:0 "Traga a Juventude"
 diarchy.2211.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.2211.a:0 "Apenas um $knight_culture_player_no_tooltip_lowercase$ #EMP concordará#! em servir. Eventualmente."
 diarchy.2211.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.2211.b.tt.failure:0 "Seus apelos caem em ouvidos moucos"
 diarchy.2211.b.tt.success:0 "Suas palavras influenciam [hedge_knight.GetSheHe]"
 diarchy.2211.b:0 "Talvez eu possa convencer [hedge_knight.GetFirstNameNoTooltip] pessoalmente?"
 diarchy.2211.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.2211.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.2211.c.tt.failure:0 "[hedge_knight.GetSheHe|U] não quer ter nada a ver com você"
 diarchy.2211.c.tt.success:0 "Você atrai [hedge_knight.GetFirstNameNoTooltip] para o seu serviço"
 diarchy.2211.c:0 "Talvez seja o [liege.Custom('MistressMaster')] em potencial que seja o problema..."
 diarchy.2211.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.2211.d:0 "Todo esse assunto está me causando ansiedade!"
 diarchy.2211.desc:0 "Um guerreiro de talento raro está passando por [hedge_knight_location.GetNameNoTier], alguém cuja espada certamente seria muito valorizada nos exércitos de [liege.GetTitledFirstName].\n\nMeu mandato como [liege.GetDiarchTitle] me pede para ficar de olho em tais indivíduos, e já enviei numerosos pedidos [Select_CString( hedge_knight.IsFemale, 'a', 'ao' )] [hedge_knight.GetFirstName], tentando recrutá-l[Select_CString( hedge_knight.IsFemale, 'a', 'o' )] para o meu senhor feudal.\n\nExceto que o lutador itinerante não parece muito entusiasmado com a ideia de jurar sua espada à nossa causa, rejeitando cada mensageiro por sua vez."
 diarchy.2211.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.2211.e:0 "Deixe [hedge_knight.GetSheHe] em paz, [hedge_knight.GetSheHe] claramente não está interessado."
 diarchy.2211.t:0 "Um Talento Raro"
 diarchy.2221.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.2221.a:0 "Esta moeda é nada comparada ao saque que você ganhará!"
 diarchy.2221.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.2221.b.tt.failure:0 "Um investimento ruim"
 diarchy.2221.b.tt.success:0 "Dinheiro bem gasto"
 diarchy.2221.b:0 "Esta prata é apenas uma amostra do tesouro de [liege.GetTitledFirstNamePossessiveNoTooltip]!"
 diarchy.2221.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.2221.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.2221.c.tt.failure:0 "Apenas uma pequena quantidade de tropas se alista"
 diarchy.2221.c.tt.success:0 "Uma boa safra de soldados"
 diarchy.2221.c:0 "Sirva-me, sirva [Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitleAsNameNoTooltip], de qualquer maneira você será #EMP pago#!."
 diarchy.2221.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.2221.d:0 "Rompa e fuja diante de seus olhares."
 diarchy.2221.desc:0 "Os principais assentamentos do [liege.GetPrimaryTitle.GetNameNoTier] oferecem uma infinidade de lugares para recrutar mercenários. A praça do mercado onde estou, jogando uma bolsa de dinheiro em uma multidão deles, é apenas um de muitos.\n\nNormalmente, essas bandas de guerreiros improvisadas são absorvidas por grupos de mercenários maiores ou contratadas para reforçar as milícias privadas de senhores menores durante a guerra, um arranjo ineficiente.\n\nMeu mandato como [liege.GetDiarchTitle] exige que eu aumente os exércitos de [liege.GetTitledFirstName], e por isso me encontro tentando recrutar mais diretamente."
 diarchy.2221.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.2221.e:0 "Claro, tenho certeza de que você pode escolher seus próprios empregadores..."
 diarchy.2221.t:0 "Donativos Marciais"
 diarchy.2231.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.2231.a:0 "Continue em frente; essas reclamações passarão com o tempo."
 diarchy.2231.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.2231.b.tt.failure:0 "A maioria dos criminosos foge assim que pode"
 diarchy.2231.b.tt.success:0 "Um equilíbrio é alcançado"
 diarchy.2231.b:0 "Talvez precisemos apenas dos melhores?"
 diarchy.2231.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.2231.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.2231.c.tt.failure:0 "$diarchy.2231.b.tt.failure$"
 diarchy.2231.c.tt.success:0 "Um grupo violento é formado"
 diarchy.2231.c:0 "Eles podem ser mais úteis sem registro do que registrados..."
 diarchy.2231.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.2231.d:0 "Eu #EMP não#! posso fazer isso. Isso seria uma perversão da justiça!"
 diarchy.2231.desc:0 "As prisões e tribunais de [exploitable_county.GetNameNoTier] têm processado um número lamentavelmente alto de malfeitores ultimamente. Em circunstâncias normais, a justiça encontraria rapidamente esses criminosos, que seriam então soltos na natureza ou na sepultura.\n\nFelizmente para eles, muitos têm ampla experiência com espada ou flecha, e meu mandato como [liege.GetDiarchTitle] exige que eu encontre soldados novos. A solução desagradável de servir nos exércitos de [liege.GetTitledFirstName] parece óbvia, e embora isso traga muitos bandidos corajosos e caçadores astutos, a ideia deixa o povo do campo indignado."
 diarchy.2231.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.2231.e:0 "Isso é muito controverso."
 diarchy.2231.t:0 "Um Uso Melhor para Você"
 diarchy.2241.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.2241.a:0 "Após mim, soldados! Prestem atenção!"
 diarchy.2241.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.2241.b.tt.failure:0 "E que grupo lamentável de preguiçosos eles se mostram"
 diarchy.2241.b.tt.success:0 "Você os torna rápidos como o curso de um rio"
 diarchy.2241.b:0 "Vamos lá, seus preguiçosos, eu vou colocá-los na linha!"
 diarchy.2241.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.2241.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.2241.c.tt.failure:0 "Distraído, você torce algo vital"
 diarchy.2241.c.tt.success:0 "Um pouco de treinamento extra faz toda a diferença"
 diarchy.2241.c:0 "Talvez eu deva tentar treinar a mim mesmo também..."
 diarchy.2241.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.2241.d:0 "Parta sem dizer uma palavra."
 diarchy.2241.desc:0 "O mandato estabelecido para mim [Select_CString( liege.IsFemale, 'pela', 'pelo' )] [liege.GetTitledFirstName] exige que, como seu [liege.GetDiarchTitle], eu encontre regularmente fontes de novas tropas para [liege.GetSheHe].\n\nBem, qual lugar melhor para começar do que as milícias mal organizadas de [exploitable_vassal.GetTitledFirstName]? Meus retentores e eu reunimos os moradores para avaliação, mas ainda estamos lutando para colocar um número suficiente deles em um padrão que #EMP valha a pena#! chamá-los no futuro."
 diarchy.2241.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.2241.e:0 "Isso é um #EMP completo#! desperdício do meu tempo."
 diarchy.2241.t:0 "Separando o Trigo do Joio"
 diarchy.8001.a:0 "Por [actor.Custom('GetBestEmpireWithAdjective')]!"
 diarchy.8001.desc:0 "Seu pedido para liderar uma expedição em Nosso nome mútuo tem mérito, e assim lhe dou minha sanção. Você pode utilizar os recursos de nossos governadores conforme necessário.\n\nQue o inimigo trema e se quebre diante de suas fileiras."
 diarchy.8001.t:0 "[recipient.Custom2('AppropriateGreeting', actor )]"
 diarchy.8002.a:0 "Seu tolo de mente fechada!"
 diarchy.8002.desc:0 "Eu preferiria pressionar uma faca contra minha própria garganta a consentir que #EMP você#! controle tal exército fora de minha supervisão.\n\nSeu pedido está negado — e este assunto está #EMP encerrado#!."
 diarchy.8002.t:0 "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 diarchy.8003.a:0 "Que tolo presunçoso!"
 diarchy.8003.desc:0 "Embora governemos juntos, você certamente se lembra de que #EMP me deve#!. Estou cobrando esse favor agora, e em troca você apoiará de todo coração minha próxima expedição para conquistar território das terras estrangeiras."
 diarchy.8003.t:0 "[actor.Custom2('AppropriateGreeting', recipient )]"
 diarchy.8004.a.allowed:0 "Novas terras para competir..."
 diarchy.8004.a.vetoed:0 "Pelo menos evitamos uma guerra..."
 diarchy.8004.desc.planned.allowed:0 "Que [Select_CString( recipient.IsFemale, 'a', 'o' )] Sênior [recipient.GetTitleAsNameNoTooltip] esteja disposto a confiar suas tropas [Select_CString( actor.IsFemale, 'a', 'ao' )] [actor.GetFirstNameNoTooltip] é, sem dúvida, um sinal de considerável confiança entre os dois."
 diarchy.8004.desc.planned.forced:0 "Alegadamente, [actor.GetFirstNameNoTooltip] foi capaz de forçar a mão de seu colega sênior nisso. Pelo menos, é o que dizem os rumores."
 diarchy.8004.desc.planned:0 "Não é segredo que a corte imperial está agitada com conversas sobre uma grande empreitada militar, lançando os exércitos do império contra alguma nação fronteiriça despreparada para ganhar glória e território.\n\nTais conversas são comuns, mas frequentemente sem fundamento — exceto desta vez. [Select_CString( recipient.IsFemale, 'A', 'O' )] Co-[recipient.GetTitleAsNameNoTooltip] [actor.GetFirstName] parece estar liderando um esforço sério, com a permissão d[Select_CString( recipient.IsFemale, 'a', 'o' )] Sênior [recipient.GetTitleAsNameNoTooltip] [recipient.GetFirstNamePossessive], para avançar as fronteiras."
 diarchy.8004.desc.vetoed:0 "Rumores na corte imperial sugeriram, por meses, que [Select_CString( recipient.IsFemale, 'a', 'o' )] Co-[recipient.GetTitleAsNameNoTooltip] [actor.GetFirstName] estava pressionando pelo lançamento de uma grande empreitada usando os exércitos de [recipient.GetPrimaryTitle.GetDefinitiveName], conquistando títulos na fronteira.\n\nDe repente, e de forma decisiva, esses rumores cessaram.\n\nParece que [Select_CString( recipient.IsFemale, 'a', 'o' )] Sênior [recipient.GetTitleAsNameNoTooltip] [recipient.GetFirstName] não confia nos motivos de seu colega júnior."
 diarchy.8004.t.planned:0 "Expedição Imperial Planejada"
 diarchy.8004.t.vetoed:0 "Expedição Imperial Abortada"
 diarchy.8005.a:0 "Mais uma vez ao combate!"
 diarchy.8005.b:0 "Não terei parte na loucura d[Select_CString( attacker.GetLiege.IsFemale, 'a', 'o' )] #EMP Co#!-[attacker.GetLiege.GetTitleAsNamePossessiveNoTooltip]."
 diarchy.8005.desc.boilerplate:0 "Como s[Select_CString( attacker.GetLiege.IsFemale, 'ua', 'eu' )] [attacker.GetLiege.GetTitleAsNameNoTooltip], estou organizando uma expedição contra os cães covardes de [defender.GetPrimaryTitle.GetDefinitiveName]."
 diarchy.8005.desc:0 "$diarchy.8005.desc.boilerplate$\n\nSua governadoria faz fronteira com as terras que esperamos tomar, o que significa que você está obrigado a nos ajudar. Convoco você a enviar soldados para a linha de frente imediatamente!"
 diarchy.8005.t:0 "[attacker.Custom2('AppropriateGreeting', ROOT.Char )]"
 diarchy.8006.a:0 "$diarchy.8005.a$"
 diarchy.8006.b:0 "$diarchy.8005.b$"
 diarchy.8006.desc:0 "$diarchy.8005.desc.boilerplate$ Embora sua governadoria não faça fronteira com a frente, você #EMP é#! um dos nossos mais eminentes administradores militares.\n\nSuas forças são bem-vindas na guerra, se desejar sua própria parcela de glória."
 diarchy.8006.t:0 "[attacker.Custom2('AppropriateGreeting', ROOT.Char )]"
 diarchy.8011.a:0 "Eu conquistei esses territórios, e irei mantê-los."
 diarchy.8011.b:0 "Lutamos pelo império, e a ele pertencem os despojos!"
 diarchy.8011.c:0 "Talvez eu possa ficar com #EMP um#! prêmio..."
 diarchy.8011.d:0 "Governadores interinos irão administrar nossas novas terras."
 diarchy.8011.desc.all_titles_legally_yours:0 "Com o fim da guerra e a poeira assentada, olho para as terras que conquistei para o império... e vejo que cada uma delas está #EMP coincidentemente#! já claramente dentro de minha jurisdição.\n\nPode não haver glória adicional em tais manobras sorrateiras, mas também não pode haver sérias reclamações.\n\nAfinal, está tudo perfeitamente legal."
 diarchy.8011.desc.fallback:0 "A guerra acabou, as terras de [defender.GetTitledFirstNamePossessive] estão devastadas, e a fronteira foi empurrada mais uma vez.\n\nAgora resta decidir como lidar com os territórios conquistados.\n\nPor direito, eles #EMP deveriam#! ir para [attacker.GetLiege.GetTitledFirstName], meu superior, para distribuir — um feito #EMP certamente#! para aumentar minha influência em [attacker.GetLiege.GetCapitalLocation.GetTitle.GetBaseNameNoTier] — mas eu não sou Co-[attacker.GetLiege.GetTitleAsNameNoTooltip]? Eu não poderia mantê-los e distribuí-los eu mesmo, ou nomear locais gratos pela oportunidade que lhes ofereço?"
 diarchy.8011.e.tt.keep_everything_but_legally:0 "Você mantém todas as terras conquistadas — e ninguém pode dizer que não é justo"
 diarchy.8011.e:0 "Que conveniente acidente."
 diarchy.8011.t:0 "Uma Gloriosa Expedição!"
 diarchy.8011.tt.all_lands_remain_in_your_custody:0 "Você mantém todos os [vassals|E] e [titles|E] conquistados, mas não ganha [influence_i][influence|E]"
 diarchy.8011.tt.distribution.interim_governors.hook_and_opinion:0 "Você recebe um [hook|E] favor de cada novo governador"
 diarchy.8011.tt.distribution.interim_governors:0 "Os territórios conquistados são entregues a [characters|E] locais adequados"
 diarchy.8011.tt.distribution.lands_given_to_emperor:0 "Os territórios conquistados são transferidos para [attacker.GetLiege.GetTitledFirstName]"
 diarchy.8011.tt.distribution.reserve_prize:0 "Os territórios conquistados são transferidos para [attacker.GetLiege.GetTitledFirstName] — exceto por [prize_county.GetBaseNameNoTier] e qualquer coisa em seu [duchy|E]"
 diarchy.8012.desc.a.interim_governors:0 "Hmm, suponho que posso ver a lógica."
 diarchy.8012.desc.a.keeping_all:0 "#EMP Que pequeno ingrato insolente!#!"
 diarchy.8012.desc.a.legal_shenanigans:0 "Esperto, [attacker.GetFirstNameNoTooltip]. Muito esperto."
 diarchy.8012.desc.a.turning_over_all:0 "Ahh, governar em sua essência."
 diarchy.8012.desc.a.turning_over_most:0 "Aceitável."
 diarchy.8012.desc.interim_governors:0 "O caos da guerra deu lugar à doce vitória imperial, e estou feliz em declarar nossa expedição um sucesso!\n\nNo interesse da rapidez, entreguei os territórios conquistados a uma seleção de governadores locais. Eles, sem dúvida, nos servirão lealmente até que decidamos substituí-los — conjuntamente."
 diarchy.8012.desc.keeping_all:0 "Você ficará feliz em saber que minha guerra foi bem-sucedida — #EMP muito#! bem-sucedida, na verdade.\n\nOs territórios conquistados ainda precisarão de uma mão firme e orientadora por algum tempo, e por isso permanecerei para garantir sua boa administração."
 diarchy.8012.desc.legal_shenanigans:0 "Tenho o prazer de relatar o sucesso de nossa guerra! Os territórios libertados, que ambos podemos concordar que fazem firmemente parte das terras sob meus títulos, certamente prosperarão sob minha administração.\n\nClaro, se houvesse algo mais, você sabe que eu o entregaria, mas, infelizmente..."
 diarchy.8012.desc.turning_over_all:0 "O valor enaltece [attacker.Custom('GetBestEmpireWithAdjective')] neste dia, e a mim e a você acima de tudo! Nossa expedição foi um verdadeiro sucesso, e as terras que subjugo agora estão à sua disposição.\n\nUm brinde a uma parceria feliz!"
 diarchy.8012.desc.turning_over_most:0 "Hoje saboreamos a mais doce das vitórias! Com a guerra vencida, já despachei administradores sob seu pagamento pessoal para a maior parte dos territórios conquistados.\n\nEspero que não se importe com o modesto prêmio de [prize_county.GetBaseNameNoTier] e seus territórios adjacentes. Uma pequena compensação por meu sangue e ouro gastos."
 diarchy.8012.t:0 "[attacker.Custom2('AppropriateGreeting', ROOT.Char )]"
 diarchy.8012.tt.interim_governors:0 "[attacker.GetFirstName] nomeou governadores locais #WEAK (por enquanto)#! para administrar os territórios conquistados"
 diarchy.8012.tt.keeping_all:0 "[attacker.GetFirstName] mantém tudo #WEAK (por enquanto)#!, mas não ganha [influence|E]"
 diarchy.8012.tt.legal_shenanigans:0 "[attacker.GetFirstName] mantém tudo — todos os [titles|E] e [vassals|E] já fariam parte da jurisdição [attacker.GetHerHim|E] de qualquer forma"
 diarchy.8012.tt.turning_over_all:0 "[attacker.GetFirstName] entrega todos os [titles|E] e [vassals|E] conquistados a você"
 diarchy.8012.tt.turning_over_most:0 "[attacker.GetFirstName] entrega a maior parte dos [titles|E] e [vassals|E] conquistados a você, mas mantém um [duchy|E] para [attacker.GetHerselfHimself]"
 diarchy.8022.a:0 "Um crime revoltante!"
 diarchy.8022.b:0 "Este foi o melhor fim possível."
 diarchy.8022.c:0 "Assim é em [actor.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]."
 diarchy.8022.desc.dead:0 "Infelizmente para Co-[actor.GetTitleAsNameNoTooltip] [recipient.GetFirstName], [Select_CString( actor.IsFemale, 'a', 'o' )] Senior [actor.GetTitleAsNameNoTooltip] [actor.GetFirstName] escolheu a opção decididamente #EMP mais segura#! das duas."
 diarchy.8022.desc.intro:0 "Existem apenas duas maneiras de realmente remover alguém do trono imperial depois de sentar-se nele: morte ou deformidade.\n\n"
 diarchy.8022.desc.maimed:0 "Felizmente para Co-[actor.GetTitleAsNameNoTooltip] [recipient.GetFirstName], [Select_CString( actor.IsFemale, 'a', 'o' )] Senior [actor.GetTitleAsNameNoTooltip] [actor.GetFirstName] optou pela opção mais misericordiosa das duas escolhas."
 diarchy.8022.desc.outro:0 "\n\nRumores circulam sobre qual de suas muitas disputas levou [actor.GetFirstNameNoTooltip] a tomar uma medida tão drástica, mas no fim das contas, isso não importa mais. O que está feito, está feito.\n\nTalvez este fosse o desfecho mais provável — uma coroa não serve para duas cabeças, afinal."
 diarchy.8022.t.dead:0 "Execução Política"
 diarchy.8022.t:0 "Mutilação Política: Deposto"
 diarchy.8022.tt.explanation:0 "[recipient.GetFirstName] não é mais considerado [co_emperor|E]"
 diarchy.8023.a:0 "A Casa [actor.GetHouse.GetBaseNameNoTooltip] finalmente ocupa seu lugar de direito!"
 diarchy.8023.b:0 "Isso é usurpação!"
 diarchy.8023.c:0 "$diarchy.8022.c$"
 diarchy.8023.desc.dead:0 "executou brutalmente s[Select_CString( actor.IsFemale, 'ua', 'eu' )] Senior [actor.GetTitleAsNameNoTooltip]."
 diarchy.8023.desc.intro:0 "Em um ato decisivo de brutalidade, [actor.GetFirstName] — anteriormente Co-[actor.GetTitleAsNameNoTooltip] de Sua Majestade Imperial [recipient.GetFirstName] —"
 diarchy.8023.desc.maimed:0 "deformou a carne [Select_CString( actor.IsFemale, 'da sua', 'do seu' )] Senior [actor.GetTitleAsNameNoTooltip]."
 diarchy.8023.desc.outro.alive:0 "\n\n[recipient.GetFirstNameNoTooltip] terá que se contentar com apenas sua vida, e pouco mais."
 diarchy.8023.desc.outro:0 "\n\nO simbolismo do ato é tão claro quanto nossas tradições e leis: [actor.GetPrimaryTitle.GetDefinitiveName] agora se curva apenas a um[Select_CString( actor.IsFemale, 'a', '' )] [actor.GetWomanMan]."
 diarchy.8023.t.dead:0 "$diarchy.8022.t.dead$"
 diarchy.8023.t:0 "Mutilação Política: Usurpação!"
 diarchy.8023.tt.explanation:0 "[actor.GetFirstName] depôs [recipient.GetFirstName], agora reinando supremamente como únic[Select_CString( actor.IsFemale, 'a', 'o' )] [actor.GetTitleAsName|U]"
 diarchy.8031.a:0 "Ahh, meu império dentro do império."
 diarchy.8031.desc:0 "Seu pedido é tanto razoável quanto sensato: instruirei os governadores de [target.GetDefinitiveName] para que, doravante, eles o atendam em primeiro lugar.\n\nQue você traga a eles o mesmo nível de governo que busco oferecer ao resto do império."
 diarchy.8031.t:0 "[recipient.Custom2('AppropriateGreetingPositive', actor )]"
 diarchy.8032.a:0 "Isso deveria ser uma parceria!"
 diarchy.8032.desc:0 "Você é a segunda pessoa mais poderosa de todo [recipient.GetPrimaryTitle.GetDefinitiveName] e quer #EMP mais#!?\n\nNão, estamos divididos o suficiente com dois governantes supremos. Talvez até isso seja demais."
 diarchy.8032.t:0 "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 diarchy.8033.a:0 "Revoltante!"
 diarchy.8033.desc.hook:0 "Considere sua dívida comigo quitada."
 diarchy.8033.desc.insufficient_influence:0 "Claro, aprecio sua contribuição em todos os assuntos, mas temo que já tenha resolvido a questão."
 diarchy.8033.desc.intro:0 "Caro [recipient.GetTitleAsNameNoTooltip], lamento forçá-lo a assumir tantas responsabilidades em nossa parceria. A partir de agora, tomarei o controle direto de [target.GetName], para gerenciar seus governadores e reunir seu povo, aliviando o peso sobre seus nobres ombros.\n\n"
 diarchy.8033.t:0 "[actor.Custom2('AppropriateGreeting', recipient )]"
 diarchy.8033.tt.influence:0 "Você não tinha o [influence_i][influence|E] necessário para resistir ao seu [co_emperor|E]"
 diarchy.8041.a:0 "[actor.Custom2('InsultNoun', ROOT.Char)] Arrogante!"
 diarchy.8041.b:0 "Será que esses dois deveriam realmente brigar publicamente?"
 diarchy.8041.desc:0 "É com o coração pesado que admito uma verdadeira praga de calamidades assediando [actor.Custom('GetBestEmpireWithAdjective')]: nossos esgotos estão entupidos, nossas fronteiras estão se desfazendo e nossos filhos nascem imbecis.\n\nEsses problemas são, cada um deles, a culpa final [Select_CString( actor.IsFemale, 'da minha suposta', 'do meu suposto' )] #EMP Co#!-[actor.GetTitleAsNameNoTooltip] [recipient.GetFirstName], um tolo e um canalha que incita a ira de [actor.GetFaith.FateGodName] contra nós."
 diarchy.8041.t:0 "Sua Soberania [actor.GetFirstName] emite uma declaração pública,"
 diarchy.8042.a:0 "Maldito ingrato!"
 diarchy.8042.b:0 "$diarchy.8041.b$"
 diarchy.8042.desc:0 "Que todos saibam que as mil mazelas que afligem o reino — de estrangeiros a impiedade, passando por altos impostos — são #EMP todas#! obra de meu alegado #EMP Senior#! [recipient.GetTopLiege.GetTitleAsNameNoTooltip].\n\nA gestão incompetente [recipient.GetHerHim] impede cada um dos meus atos e piora suas vidas a cada dia que passa."
 diarchy.8042.t:0 "$diarchy.8041.t$"
 diarchy.9001.a.tt.failure:0 "Já é um fato consumado"
 diarchy.9001.a.tt.success:0 "Sua oratória quebra a aliança de [usurper.GetFirstNamePossessiveNoTooltip]"
 diarchy.9001.a:0 "Você acha que meus vassalos leais me abandonariam por #EMP você?#!"
 diarchy.9001.b.fallback:0 "[proxy.GetFirstNameNoTooltip], lide com esse canalha."
 diarchy.9001.b.tt.failure:0 "Já é um fato consumado"
 diarchy.9001.b.tt.success:0 "A oratória d[Select_CString( proxy.IsFemale, 'a', 'o' )] [proxy.GetFirstNamePossessiveNoTooltip] quebra a aliança d[Select_CString( usurper.IsFemale, 'a', 'o' )] [usurper.GetFirstNamePossessiveNoTooltip]"
 diarchy.9001.b.young:0 "Aponte para [proxy.GetFirstNameNoTooltip] em busca de ajuda."
 diarchy.9001.c:0 "Eu... eu não posso fazer nada..."
 diarchy.9001.d.tt.loss:0 "Seus últimos defensores possíveis são facilmente mortos"
 diarchy.9001.d.tt.win:0 "Soldados leais chegam e dominam os conspiradores"
 diarchy.9001.d:0 "#DIE2 Guardas!#! #DIE1 Guardas!#! #BER GUARDAS!#!"
 diarchy.9001.desc.intro:0 "[usurper.Custom2('MyCharacterIntroduction', ROOT.Char)|U] irrompe na minha sala do trono. Atrás [usurper.GetHerHim] está uma multidão de influentes da corte, cada um empunhando uma arma com a confiança dos que sabem que a ameaça é suficiente.. $diarch_attempt_to_overthrow_liege.desc.coup_start_boilerplate$"
 diarchy.9001.desc.outro:0 "\n\nEste é o momento em que a traição se revela."
 diarchy.9001.desc.proxy.betrayed:0 "$diarchy.9011.desc.proxy.betrayed$"
 diarchy.9001.desc.proxy.loyal:0 "$diarchy.9011.desc.proxy.loyal$"
 diarchy.9001.desc.proxy.none:0 "$diarchy.9011.desc.proxy.none$"
 diarchy.9001.t:0 "$diarch_attempt_to_overthrow_liege.event.t$ Línguas Prateadas"
 diarchy.9002.a:0 "Tenho minha liberdade, mas pouco mais."
 diarchy.9002.b:0 "Meu destino. Desfeito."
 diarchy.9002.desc.intro:0 "Estou derrotado. Completamente, totalmente derrotado.\n\n"
 diarchy.9002.desc.outro:0 "\n\nO usurpador faz um gesto e, com relutância óbvia, o que foi minha própria guarda até muito recentemente se move para me escoltar para fora. Infelizmente, é óbvio qual é a direção do vento."
 diarchy.9002.desc.proxy.proxy_fought:0 "[proxy.GetTitledFirstName] fez o seu melhor, mas os argumentos de [usurper.GetFirstNamePossessive] eram convincentes e bem ensaiados. Os traidores permaneceram leais ao seu pagante, e minha corte recuou para permitir acesso desimpedido [usurper.GetHerHim]."
 diarchy.9002.desc.proxy.self_fought:0 "Todos os meus esforços se mostram infrutíferos. [usurper.GetFirstName|U] passou tempo demais planejando isso, e a cada debate de palavras que trocamos, vejo mais alguns rostos familiares se aproximando do lado [usurper.GetHerHim]. Não adianta. Perdi meu trono."
 diarchy.9002.desc.scuffled:0 "Peço ajuda, mas os poucos soldados que chegam são facilmente eliminados pelos conspiradores de [usurper.GetFirstNamePossessive]. Depois de um tempo, o fluxo de supostos salvadores se esgota, e todos podem ver o quão verdadeiramente e desesperadamente sozinho estou."
 diarchy.9002.desc.surrendered:0 "Eu sei como essa batalha termina. Se luto com palavras, provo minha indignidade para governar. Se luto com aço, serei capturado ou pior. O único movimento vencedor é não jogar — #EMP por enquanto#!.\n\nNão se engane, \"[usurper.GetTitleAsName]\" [usurper.GetFirstName], eu voltarei atrás de você."
 diarchy.9002.t:0 "$diarchy.9001.t$"
 diarchy.9003.a.some_blood:0 "E aqui estava eu, tentando evitar derramamento de sangue."
 diarchy.9003.a:0 "E tudo isso sem derramar uma gota de sangue no #EMP meu#! trono!"
 diarchy.9003.desc.intro:0 "Acabou. Agora eu governo completamente e sozinho.\n\n"
 diarchy.9003.desc.outro:0 "\n\nOs guardas se dispersaram e os nobres se ajoelharam. Mesmo agora, a palavra está se espalhando por todo o [usurper.GetPrimaryTitle.GetTierAsName], lealdades se deslocando para fora como ondulações em um lago."
 diarchy.9003.desc.proxy.proxy_fought:0 "Ao entrarmos na sala, então-[usurper.GetTitleAsNameNoTooltip] [liege.GetFirstName] enviou seu serviçal, [proxy.Custom2('MyCharacterIntroduction', ROOT.Char)], para minar a resolução do meu grupo. Lutamos com palavras tão afiadas quanto qualquer adaga, mas no final, todos puderam ver que a corte estava comigo."
 diarchy.9003.desc.proxy.self_fought:0 "Então-[usurper.GetTitleAsNameNoTooltip] [liege.GetFirstName] nos encontrou, eu e meu grupo, enquanto caminhávamos para a sala do trono. Tenho que dar crédito a [liege.GetSheHe] por tentar um último esforço desesperado para reconquistar a lealdade dos seus cortesãos hesitantes, mas os gritos [liege.GetHerHim] caíram em ouvidos surdos e seus gestos encontraram apenas olhos cegos.\n\nLogo, todos puderam ver quem era #EMP verdadeiramente#! a [usurper.Custom('MistressMaster')] naquela sala."
 diarchy.9003.desc.scuffled:0 "Assim que entramos na sala do trono, então-[usurper.GetTitleAsNameNoTooltip] [liege.GetFirstName] começou a gritar sua indignidade para que todos ouvissem, implorando para alguém, qualquer um, salvar [liege.GetSheHe]. Nem mesmo tínhamos nossas armas em punho, embora isso não tenha nos impedido de rapidamente eliminar os poucos guardas que chegaram. Simplesmente não restava mais ninguém para se juntar [Select_CString( liege.IsFemale, 'a', 'ao' )] [liege.GetFirstNameNoTooltip]."
 diarchy.9003.desc.surrendered:0 "No final, foi algo anticlimático. Enquanto eu e meu grupo caminhávamos para a sala, todos sabiam por que estávamos lá, o que estávamos lá para fazer. Não houve resistência, principalmente por parte d[Select_CString( usurper.IsFemale, 'a', 'o' )] então-[usurper.GetTitleAsNameNoTooltip] [liege.GetFirstName], e mal precisei usar qualquer parte do meu discurso planejado."
 diarchy.9003.t:0 "$diarchy.9001.t$"
 diarchy.9004.a:0 "Que traidorzinho desprezível."
 diarchy.9004.desc.outro:0 "\n\nPermito-me um sorriso de desprezo enquanto os guardas prendem [usurper.GetSheHe], e aceno para que o bastardo seja levado embora."
 diarchy.9004.desc.proxy.proxy_fought:0 "Assim que [proxy.GetTitledFirstName] começa a falar, os traidores começam a se desfazer.\n\nUnidos mais por uma luxúria por poder a qualquer custo do que por qualquer noção séria de lealdade, não demora muito para a causa de [usurper.GetTitledFirstNamePossessive] se desfazer diante de seus próprios olhos."
 diarchy.9004.desc.proxy.self_fought:0 "Minhas palavras encontram seu alvo rapidamente, cada ataque cuidadosamente formulado dissolvendo os laços de ganância e ambição que são a única coisa que mantém a coalizão de [usurper.GetTitledFirstNamePossessive] unida.\n\nSem unidade, sua causa está perdida, e traidores e mercenários começam a se afastar de [usurper.GetFirstNameNoTooltip] em massa."
 diarchy.9004.desc.scuffled:0 "Meus gritos trazem todos os cavaleiros da classe baixa e os soldados esperançosos dentro do alcance da audição para dentro do salão, muito mais guerreiros do que o bando de [usurper.GetTitledFirstNamePossessive] pode lidar.\n\nUma breve e violenta escaramuça irrompe, com os conspiradores mortos ou capturados e seu líder desarmado."
 diarchy.9004.t:0 "$diarchy.9001.t$"
 diarchy.9005.a:0 "Todo o meu planejamento cuidadoso!"
 diarchy.9005.desc.intro:0 "Eu falhei. Falhei completamente.\n\nTudo começou tão bem no início -"
 diarchy.9005.desc.outro:0 "\n\nIronicamente, minha única esperança é obter clemência do senhor feudal que tentei usurpar. Que [usurper.GetFaith.FateGodName] tenha misericórdia."
 diarchy.9005.desc.proxy.proxy_fought:0 "[liege.GetTitledFirstName] chamando freneticamente [proxy.GetTitledFirstName] em busca de ajuda, meu grupo lotado atrás de mim, nosso propósito claro e nossos passos firmes.\n\nEntão, aquele maldito chanceler abriu a boca, e tudo começou a desmoronar. Um por um, os nobres que me seguiram recuaram, até que fiquei sozinho, minha autoridade construída com dificuldade desabando ao meu redor.\n\nOs guardas me prenderam rapidamente depois disso."
 diarchy.9005.desc.proxy.self_fought:0 "Meu grupo e eu confiantes em nossa aparente vitória. Isso só durou o tempo necessário para [liege.GetFirstNameNoTooltip] abrir a boca, começar a nos atacar, expor os pontos fracos do meu plano, as sutis lacunas na minha autoridade.\n\nEu pensei que estava no total controle. Não me dei conta o quanto eu estava errado até os guardas me agarrarem."
 diarchy.9005.desc.scuffled:0 "[liege.GetTitledFirstName] claramente entrou em pânico quando meu grupo e eu entramos na sala do trono, nosso propósito claro, e começamos a gritar desesperadamente.\n\nEu... eu subestimei a lealdade de alguns dos mercenários e guardas contratados ao seu pagador. Eles nos atacaram. Minhas belas palavras não significaram nada diante de um golpe de martelo de um mercenário, e agora estou trancado e seguro como nunca antes."
 diarchy.9005.t:0 "$diarchy.9001.t$"
 diarchy.9011.a.tt.failure:0 "Ignorando seus ataques, você é capturado"
 diarchy.9011.a.tt.success:0 "Você mina a unidade do pacto, fazendo-o desmoronar"
 diarchy.9011.a:0 "Você realmente pensa que me encurralou, pequena serpente?"
 diarchy.9011.b.fallback:0 "$diarchy.9001.b.fallback$"
 diarchy.9011.b.tt.failure:0 "Ignorando os gritos de [proxy.GetFirstNamePossessive], você é capturado"
 diarchy.9011.b.tt.success:0 "[proxy.GetFirstNamePossessive] mina a unidade do pacto, fazendo-o desmoronar"
 diarchy.9011.b.young:0 "$diarchy.9001.b.young$"
 diarchy.9011.c:0 "$diarchy.9001.c$"
 diarchy.9011.d.tt.loss:0 "$diarchy.9001.d.tt.loss$"
 diarchy.9011.d.tt.win:0 "$diarchy.9001.d.tt.win$"
 diarchy.9011.d:0 "$diarchy.9001.d$"
 diarchy.9011.desc.intro:0 "[usurper.Custom2('MyCharacterIntroduction', ROOT.Char)|U] irrompe na minha sala do trono. Atrás [usurper.GetHerHim], há uma multidão de nobres da corte menores, mercenários e ladrões, com adagas em punho e sangue em suas mentes. $diarch_attempt_to_overthrow_liege.desc.coup_start_boilerplate$"
 diarchy.9011.desc.outro:0 "$diarchy.9001.desc.outro$"
 diarchy.9011.desc.proxy.betrayed:0 "Eu olho ao redor, procurando apoio entre meus conselheiros. [proxy.GetTitledFirstName] encontra meu olhar, com olhos firmes e penetrantes, e se coloca ao lado d[Select_CString( usurper.IsFemale, 'a', 'o' )] [usurper.GetFirstNameNoTooltip]. Outra traição."
 diarchy.9011.desc.proxy.loyal:0 "Eu olho para [proxy.GetTitledFirstName] em busca de apoio, apenas para vê-la já se preparando para falar em minha defesa."
 diarchy.9011.desc.proxy.none:0 "Eu olho ao redor, procurando apoio entre meus conselheiros. Não há nenhum, ou nenhum disposto e qualificado para falar por mim."
 diarchy.9011.t:0 "$diarch_attempt_to_overthrow_liege.event.t$ Facas Afiadas"
 diarchy.9012.a:0 "Você não pode fazer isso! Eu sou [Select_CString( usurper.IsFemale, 'a', 'o' )] [usurper.GetTitleAsNameNoTooltip]! #EMP [Select_CString( usurper.IsFemale, 'A', 'O' )] [usurper.GetTitleAsNameNoTooltip]!"
 diarchy.9012.b:0 "$diarchy.9002.b$"
 diarchy.9012.desc.intro:0 "$diarchy.9002.desc.intro$"
 diarchy.9012.desc.outro:0 "\n\nEu grito enquanto os traidores vêm atrás de mim, adagas prontas, algemas balançando na mão de [usurper.GetFirstNamePossessiveNoTooltip].\n\nNinguém escuta. Ninguém se importa. Preso em grilhões, sou arrastado para longe."
 diarchy.9012.desc.proxy.proxy_fought:0 "[proxy.GetTitledFirstName] dá um passo à frente em meu nome, e [proxy.GetSheHe] e [usurper.GetFirstName] trocam farpas, mas sem sucesso. [Select_CString( usurper.IsFemale, 'A', 'O' )] [usurper.GetWomanMan] maldit[Select_CString( usurper.IsFemale, 'a', 'o' )] cobriu todas as bases, ofereceu subornos, acionou todas as suas influências. Por fim, [proxy.GetFirstNameNoTooltip] avança em direção [Select_CString( usurper.IsFemale, 'a', 'ao' )] [usurper.GetFirstNameNoTooltip], mas é derrubado ao chão pelo grupo [usurper.GetHerHim]."
 diarchy.9012.desc.proxy.self_fought:0 "[usurper.GetFirstName] e eu duelamos verbalmente por minutos, mas não sou páreo para [usurper.GetSheHe]. [Select_CString( usurper.IsFemale, 'A', 'O' )] [usurper.GetWomanMan] maldit[Select_CString( usurper.IsFemale, 'a', 'o' )] cobriu todas as bases, ofereceu subornos, acionou todas as suas influências.\n\nMinha mão vai para o cabo da minha arma, pronta para me defender, apenas para uma lâmina se enroscar em meu pescoço por trás. Algum maldito guarda traidor."
 diarchy.9012.desc.scuffled:0 "Os guardas que chamei chegam, mas ao entrarem na sala, a primeira onda é abatida pela segunda, esfaqueada pelas costas ou com as gargantas cortadas onde estão. [usurper.GetFirstName] não consegue esconder o sorriso que se estampa [usurper.Custom('MaskFace_BehindAcross')] seu [usurper.Custom('MaskFace')]."
 diarchy.9012.desc.surrendered:0 "[usurper.GetFirstName] parece quase decepcionado com a minha falta de resistência, mas eu sei que é inútil lutar contra [usurper.GetSheHe]. [usurper.GetSheHe] não estaria aqui, agindo contra mim de forma tão audaciosa, se [usurper.GetSheHe] já não tivesse todas as lâminas do prédio a seu favor e apontadas para alguém que não seja eu."
 diarchy.9012.t:0 "$diarchy.9011.t$"
 diarchy.9013.a:0 "Um novo trono e um refém fresco — já me sinto seguro."
 diarchy.9013.desc.intro:0 "$diarchy.9003.desc.intro$"
 diarchy.9013.desc.outro:0 "\n\nCom a oposição morta ou aprisionada e m[Select_CString( usurper.IsFemale, 'inha', 'eu' )] ex-[usurper.GetTitleAsNameNoTooltip] sob custódia, o futuro parece promissor."
 diarchy.9013.desc.proxy.proxy_fought:0 "[liege.GetFirstName] enviou seu serviçal, [proxy.GetTitledFirstName], para tentar afastar meus conspiradores de mim. Trocamos palavras por alguns minutos antes que [Select_CString( proxy.IsFemale, 'a', 'o' )] [proxy.GetWomanMan] exasperad[Select_CString( proxy.IsFemale, 'a', 'o' )] tentasse avançar em minha direção, apenas para ser contida por um dos meus mercenários.\n\nNosso então senhor feudal estava tão chocado que não ofereceu resistência séria enquanto colocávamos as algemas."
 diarchy.9013.desc.proxy.self_fought:0 "[liege.GetFirstName] tentou me desafiar, tentando minar o apoio do meu grupo no momento crucial, mas desviei facilmente as suas insignificantes provocações. Afinal, um[Select_CString( usurper.IsFemale, 'a', '' )] [usurper.GetWomanMan] nunca deve fazer um golpe pela metade.\n\nQuando [liege.GetFirstNameNoTooltip] tentou sacar a sua arma, provavelmente na esperança de me decapitar, um dos meus traidores o prendeu por trás. Colocar as algemas foi brincadeira de criança."
 diarchy.9013.desc.scuffled:0 "[liege.GetFirstName] chamou por ajuda, mas, naturalmente, eu já havia previsto isso. Aqueles tolos o suficiente para responder ao chamado foram abatidos pelos meus traidores quase imediatamente.\n\nNinguém mais tentou ajudar enquanto avançamos contra nosso antigo senhor feudal."
 diarchy.9013.desc.surrendered:0 "Encontrei-me quase decepcionado quando [liege.GetFirstName] não ofereceu resistência, pelo menos além de um pequeno grito de raiva enquanto colocávamos as algemas n[liege.GetSheHe].\n\nCertamente, a escolha #EMP inteligente#!, mas quando [liege.GetSheHe] #EMP já#! fez alguma escolha inteligente?"
 diarchy.9013.t:0 "$diarchy.9011.t$"
 diarchy.9014.a:0 "Decidirei o que fazer com #EMP você#! mais tarde."
 diarchy.9014.desc.outro:0 "\n\nQuando meus guardas se aproximam para prender [usurper.GetSheHe], [usurper.GetSheHe] permite que [usurper.GetHerselfHimself] seja levado. Com a conspiração [usurper.GetHerHim] dissolvida, qualquer outra ação seria suicídio."
 diarchy.9014.desc.proxy.proxy_fought:0 "Algumas palavras bem colocadas de [proxy.GetFirstName] e $diarchy.9014.desc.proxy.self_fought$"
 diarchy.9014.desc.proxy.self_fought:0 "O grupo autoconfiante de [usurper.GetTitledFirstNamePossessive] desmorona em questão de momentos.\n\nComo qualquer ninho de víboras, eles querem se morder tanto quanto a mim, e não é preciso muito para que alguns abandonem o barco ou comecem a brigar entre si.\n\nO sorriso de [usurper.GetFirstNameNoTooltip] se desvanece ao perceber que a tentativa de golpe já está fracassada."
 diarchy.9014.desc.scuffled:0 "Ao ouvirem meus gritos, os guardas chegam em um número que choca até mesmo #EMP a mim#!, avançando em direção [Select_CString( usurper.IsFemale, 'a', 'ao' )] [usurper.GetTitledFirstName] e à sua turba de conspiradores.\n\nNão demora muito para que os traidores percebam que estão completamente em desvantagem numérica e superados, e começam a largar suas armas um por um. [usurper.GetTitledFirstNameNoTooltip] é o último a fazê-lo."
 diarchy.9014.t:0 "$diarchy.9011.t$"
 diarchy.9015.a:0 "Todo aquele #EMP trabalho#! Desperdiçado."
 diarchy.9015.desc.intro:0 "$diarchy.9005.desc.intro$"
 diarchy.9015.desc.outro:0 "\n\nCom a conspiração se desintegrando ao meu redor, não faço movimento algum para resistir quando os guardas se aproximam para me prender. Tenho sorte de não ser executado aqui e agora."
 diarchy.9015.desc.proxy.proxy_fought:0 "éramos fortes, estávamos unidos, estávamos prontos para as merecidas recompensas que nossos planos nos dariam. Até que aquel[Select_CString( proxy.IsFemale, 'a', 'e' )] [proxy.GetTitledFirstName] maldit[Select_CString( proxy.IsFemale, 'a', 'o' )] avançou para defender seu patético senhor feudal. Eu... Eu não estava preparado para os argumentos que [proxy.GetSheHe] apresentou, para as falhas apontadas em meus planos cuidadosamente traçados. Eles me abandonaram. Todos me abandonaram."
 diarchy.9015.desc.proxy.self_fought:0 "irrompemos juntos, um poderoso grupo, punhais em mãos e prontos para a culminação. Eu não deveria ter permitido que [liege.GetFirstName] falasse, eu nunca deveria ter permitido que [liege.GetSheHe] malditamente falasse! Cada frase era um argumento que dilacerava as desculpas que eu havia elaborado cuidadosamente, cada ponto uma punhalada no coração de nossa união. Um por um, meus companheiros se afastaram."
 diarchy.9015.desc.scuffled:0 "invadimos a sala do trono, prontos para fazer o que precisava ser feito. Até os gritos de [liege.GetTitledFirstName] trouxerem hordas de possíveis defensores, muito mais do que eu jamais imaginei que apoiariam aquele idiota. Meus traidores mal tentam lutar, largando suas armas assim que veem o quão em desvantagem estamos."
 diarchy.9015.t:0 "$diarchy.9011.t$"
 diarchy.9021.a.tt.commence_duel.self:0 "Você irá [single_combat_duel|E] enfrentar [usurper.GetShortUIName] imediatamente"
 diarchy.9021.a.tt.failure:0 "[usurper.GetSheHe|U] te derrota no chão da sala do trono"
 diarchy.9021.a.tt.success:0 "Você executa seu agressor"
 diarchy.9021.a:0 "Seu patife! Eu mesmo vou te eliminar!"
 diarchy.9021.b.fallback:0 "$diarchy.9001.b.fallback$"
 diarchy.9021.b.tt.commence_duel.proxy:0 "[proxy.GetShortUIName] e [usurper.GetShortUIName] irão [single_combat_duel|E] enfrentar um ao outro imediatamente"
 diarchy.9021.b.young:0 "$diarchy.9001.b.young$"
 diarchy.9021.c:0 "$diarchy.9001.c$"
 diarchy.9021.d.tt.loss:0 "$diarchy.9001.d.tt.loss$"
 diarchy.9021.d.tt.win:0 "$diarchy.9001.d.tt.win$"
 diarchy.9021.d:0 "$diarchy.9001.d$"
 diarchy.9021.desc.intro:0 "[usurper.Custom2('MyCharacterIntroduction', ROOT.Char)|U] irrompe na minha sala do trono, apoiado por um grupo de mercenários, espadachins e traidores. Armas em punho e prontos para matar quantas pessoas forem necessárias, seu objetivo sangrento brilha em seus olhos. $diarch_attempt_to_overthrow_liege.desc.coup_start_boilerplate$"
 diarchy.9021.desc.proxy.betrayed:0 "$diarchy.9011.desc.proxy.betrayed$"
 diarchy.9021.desc.proxy.loyal:0 "Olho para [proxy.GetTitledFirstName] em busca de apoio, apenas para vê-l[Select_CString( proxy.IsFemale, 'a', 'o' )] já se preparando para lutar ao meu lado."
 diarchy.9021.desc.proxy.none:0 "$diarchy.9011.desc.proxy.none$"
 diarchy.9021.t:0 "$diarch_attempt_to_overthrow_liege.event.t$ Gleaming Swords"
 diarchy.9022.a:0 "Você irá diretamente para [liege.GetFaith.random_NegativeAfterLife] por isso, [usurper.GetFirstNameNoTooltip]."
 diarchy.9022.b:0 "$diarchy.9002.b$"
 diarchy.9022.desc.intro:0 "$diarchy.9002.desc.intro$"
 diarchy.9022.desc.outro.surrendered:0 "\n\nA última das minhas esperanças é extinta quando o primeiro dos meus soldados jurados se ajoelha diante [Select_CString( usurper.IsFemale, 'da nova', 'do novo' )] [usurper.GetTitleAsName].\n\nAcabou."
 diarchy.9022.desc.outro:0 "\n\nSem me dar tempo para outras opções, o usurpador avança em minha direção, [usurper.Custom('signature_weapon')] ainda ensanguentada. Este é o fim."
 diarchy.9022.desc.proxy.proxy_fought:0 "[proxy.GetTitledFirstName] resistiu bravamente, mas [usurper.GetFirstName] matou [proxy.GetSheHe] mesmo assim. Mal posso acreditar que tal [proxy.GetWomanMan] tenha dado a vida por mim, por... #EMP nada#!."
 diarchy.9022.desc.proxy.surrendered:0 "Apesar das minhas protestações, alguns guardas e mercenários tentam resistir às forças de [usurper.GetFirstNamePossessive], mas são abatidos um a um. Atraída pelo barulho, muitos dos meus guardas pessoais correm para a sala do trono, apenas para vacilar ao ver o que está acontecendo."
 diarchy.9022.desc.scuffled:0 "Meus guardas se apressam para a sala, mas [usurper.GetFirstName] escolheu bem seus conspiradores, e os mercenários e espadachins de sua companhia eliminam meus defensores quase assim que eles chegam. Eles... eles não chegarão a tempo. Eles #EMP não podem#!."
 diarchy.9022.t:0 "$diarchy.9021.t$"
 diarchy.9023.a.liege_survives:0 "Começando meu reinado com magnanimidade."
 diarchy.9023.a:0 "Algumas mortes aqui irão salvar vidas por todo o [usurper.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]."
 diarchy.9023.desc.intro:0 "$diarchy.9003.desc.intro$"
 diarchy.9023.desc.outro:0 "\n\nO cadáver de [liege.GetFirstNamePossessiveNoTooltip] esfriando no chão da sala do trono pode ser uma maneira pouco adequada de iniciar meu reinado, mas é necessário. E, no fim das contas, é bem menos sangrento do que uma guerra civil.\n\nEspero que o reino veja isso dessa forma."
 diarchy.9023.desc.proxy.proxy_fought:0 "O cadáver de [proxy.GetTitledFirstNamePossessive] cai de lado. Violência deve ser enfrentada com violência, e [liege.GetFirstName] escolheu seu caminho.\n\nEnquanto [Select_CString( usurper.IsFemale, 'a', 'o' )] [usurper.GetTitleAsNameNoTooltip] ainda está atordoado com a morte do campeão [liege.GetHerHim], eu avanço e [usurper.Custom('SignatureWeaponWoundVerb5')] minha [usurper.Custom('signature_weapon')] na garganta [liege.GetHerHim].\n\nA morte não é a mais rápida, mas também não é lenta. A corte e eu observamos [liege.GetSheHe] morrer sem comentários, e eu jogo [liege.GetSheHe] para fora do trono."
 diarchy.9023.desc.proxy.self_fought:0 "Com meu poder garantido e [Select_CString( usurper.IsFemale, 'a', 'o' )] ex-[usurper.GetTitleAsNameNoTooltip] [liege.GetFirstNameNoTooltip] morto por minha mão, não há muita oposição para eu ocupar meu lugar legítimo, exceto algumas tosses constrangedoras da corte reunida."
 diarchy.9023.desc.scuffled:0 "Previsivelmente, [liege.GetFirstName] chamou os guardas assim que invadimos a sala do trono. Infelizmente para os tolos desafortunados de plantão, eu sou um[Select_CString( usurper.IsFemale, 'a', '' )] [usurper.GetWomanMan] que planeja com antecedência, e meu grupo de apoio avançou facilmente e matou os recém-chegados.\n\nEnquanto meus soldados venceram o confronto, eu avancei em direção [Select_CString( liege.IsFemale, 'a', 'ao' )] [liege.GetFirstNameNoTooltip], ainda gritando, e [usurper.Custom('SignatureWeaponWoundVerb5')] minha [usurper.Custom('signature_weapon')] na garganta [liege.GetHerHim].\n\nA morte põe fim rapidamente ao restante da luta, anunciada pelo som de eu jogando meu ex-senhor feudal do trono."
 diarchy.9023.desc.surrendered:0 "Para minha surpresa, [liege.GetFirstName] se rendeu. Eu esperava ter que matar [liege.GetSheHe], mas parece que [liege.GetSheHe] valoriza sua coroa mais do que [liege.GetSheHe] vida.\n\nA maioria do meu grupo de apoio zomba quando [Select_CString( usurper.IsFemale, 'a', 'o' )] ex-[usurper.GetTitleAsNameNoTooltip] é arrastado por eles, jogado para fora da sala do trono para abrir caminho para #EMP mim#!.\n\nBem, por mais inesperado que seja, uma abdicação voluntária também funciona para mim. É mais... legítimo."
 diarchy.9023.t:0 "$diarchy.9021.t$"
 diarchy.9024.a:0 "Abatido como o cão sarnento que [usurper.GetSheHe] era."
 diarchy.9024.desc.outro:0 "\n\nEspero que as notícias se espalhem rapidamente pelo resto do [liege.GetPrimaryTitle.GetTierAsName], e espero que isso sirva de lição para futuros usurpadores."
 diarchy.9024.desc.proxy.proxy_fought:0 "Infelizmente, estou um pouco longe demais de [usurper.GetTitledFirstName] para ouvir a maldição final [usurper.GetHerHim], mas tenho o prazer de assistir [usurper.GetSheHe] morrer.\n\n[proxy.GetTitledFirstName] lutou bem ao meu serviço, massacrando o traidor aos pés do meu trono com uma facilidade aparentemente despreocupada. O ato fortalece a determinação dos meus guardas e destroça o grupo de conspiradores, e o que se segue são alguns minutos de carnificina desesperada enquanto os rebeldes são abatidos."
 diarchy.9024.desc.proxy.self_fought:0 "O cadáver de [usurper.GetTitledFirstNamePossessive] está dilacerado diante de mim, massacrado pela minha própria mão.\n\nEm pânico cego, o grupo de conspiradores se desintegra e tenta fugir, mas meus próprios guardas são fortalecidos pelo meu sucesso e avançam sobre eles. O que se segue são alguns minutos de carnificina desesperada, com os rebeldes sendo abatidos um a um."
 diarchy.9024.desc.scuffled:0 "Felizmente, meus clamores por ajuda imediata trouxeram uma verdadeira #EMP horda#! de tropas leais e contratadas de câmaras próximas. Apesar de todo o grupo de traidores de [usurper.GetTitledFirstName] ter lutado bravamente, eles foram rapidamente dominados.\n\nAssisti [usurper.GetFirstNameNoTooltip] morrer, um dos últimos, com pânico em seus [usurper.Custom('EyeEyes')] enquanto aço reluzia ao redor [usurper.GetHerHim]. Depois dentro [usurper.GetHerHim]. E então através [usurper.GetHerHim].\n\nEsse é o preço da traição."
 diarchy.9024.t:0 "$diarchy.9021.t$"
 diarchy.9025.a:0 "Não era para terminar desse jei-#BER AAARGGH!#!"
 diarchy.9025.desc:0 "Quase assim que invadimos a sala do trono, um grito de pânico vindo de [liege.GetTitledFirstName] traz uma torrente absoluta de cavaleiros armados para a sala, ansiosos para morrer por sua [liege.Custom('MistressMaster')].\n\nMinha comitiva e eu nos livramos da mistura de cadáveres em formação da melhor maneira possível, mas são muitos. Temos que recuar, temos que voltar — pelo [usurper.GetFaith.FateGodName], eles também estão atrás de nós. Não... não há saída.\n\nNão, não, #EMP não!#! Tanto planejamento, tanto esforço, tudo em vão!"
 diarchy.9025.t:0 "$diarchy.9021.t$"
 diarchy_1731.tt.affected_counties_removed:0 "[county_1.GetNameNoTier], [county_2.GetNameNoTier] e [county_3.GetNameNoTier] abandonam a [faction.GetName|V]"
 diarchy_8011.turn_over_titles.tt.interim_governors.county:0 "[attacker.GetShortUIName|U] ganha [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_counties_reduced_value')|P0] [influence|E] pelos [counties|E] transferidos"
 diarchy_8011.turn_over_titles.tt.interim_governors.vassal:0 "[attacker.GetShortUIName|U] ganha [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_vassals_reduced_value')|P0] [influence|E] pelos [vassals|E] transferidos"
 diarchy_8011.turn_over_titles.tt.titles_to_transfer_all:0 "[attacker.GetShortUIName|U] ganha [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_counties_full_value')|P0] [influence|E] pelos [counties|E] transferidos"
 diarchy_8011.turn_over_titles.tt.titles_to_transfer_prize:0 "[attacker.GetShortUIName|U] ganha [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_vassals_prize_value')|P0] [influence|E] pelos [counties|E] transferidos"
 diarchy_8011.turn_over_titles.tt.vassals_to_transfer_all:0 "[attacker.GetShortUIName|U] ganha [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_vassals_full_value')|P0] [influence|E] pelos [vassals|E] transferidos"
 diarchy_8011.turn_over_titles.tt.vassals_to_transfer_prize:0 "[attacker.GetShortUIName|U] ganha [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_counties_prize_value')|P0] [influence|E] pelos [vassals|E] transferidos"
 getbestempirewithadjective.great_armenia:0 "Grande Armênia"
 getbestempirewithadjective.india:0 "Ilimitada Índia"
 getbestempirewithadjective.mongolia:0 "Infinita Mongólia"
 getbestempirewithadjective.outremer:0 "Abençoado Ultramar"
 getbestempirewithadjective.rome:0 "Gloriosa Roma"
