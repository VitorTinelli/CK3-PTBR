l_spanish:
 marshal_task.0301.a:0 "Muito bem, [commander.GetFirstNameNoTooltip] servirá a mim."
 marshal_task.0301.b:0 "Tire esse ralé da minha [ROOT.Char.Custom('ResidenceBuilding')]!"
 marshal_task.0301.desc:0 "M[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [councillor.GetCouncilTitle], [councillor.GetTitledFirstName], tem exibido um novo recruta promissor.\n\n\"[commander.GetSheHe|U] pode não ser de origem nobre como você, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [councillor.Custom2('RelationToMe', ROOT.Char)], mas pelo meu nome eu juro que [Select_CString( commander.IsFemale, 'a', 'o' )] [commander.GetTitledFirstName] é alguém que você gostaria de ter ao seu lado.\""
 marshal_task.0301.t:0 "Comandante Promovido"
 marshal_task.0302.a:0 "Por favor, ensine-[Select_CString( commander.IsFemale, 'a', 'o' )]."
 marshal_task.0302.b:0 "Não, [commander.GetFirstNameNoTooltip] deve se concentrar no combate pessoal."
 marshal_task.0302.desc.known:0 "É uma das minhas especialidades, e eu poderia ensiná-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] como usar melhor essas habilidades."
 marshal_task.0302.desc.unknown:0 "Embora eu não seja especialista nessa área, ainda posso tentar ajudá-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a aprimorar suas habilidades."
 marshal_task.0302.desc:0 "Tenho visto [Select_CString( commander.IsFemale, 'a', 'o' )] [commander.GetTitledFirstName] demonstrar uma propensão para [commander.Custom('CommanderTraitSkillDescription')]."
 marshal_task.0302.notification.a:0 "Comandante Significativamente Aprimorado"
 marshal_task.0302.notification.b:0 "Comandante Aprimorado"
 marshal_task.0302.opening:0 "[councillor.Custom2('AppropriateGreeting', ROOT.Char)]"
 marshal_task.0303.notification.a:0 "Cavaleiro Significativamente Aprimorado"
 marshal_task.0303.notification.c:0 "Cavaleiro se Tornou Mestre das Lâminas"
 marshal_task.0304.a_clan:0 "Todas as crianças da Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip] são bem-vindas ao exército."
 marshal_task.0304.a_neutral:0 "S[Select_CString( beneficiary_of_nepotism.IsFemale, 'ua', 'eu' )] [beneficiary_of_nepotism.Custom('GetDaughterSon')] é bem-vind[Select_CString( beneficiary_of_nepotism.IsFemale, 'a', 'o' )] ao meu exército."
 marshal_task.0304.b.failure:0 "[advocate_of_nepotism.GetTitledFirstNameNoTooltip] se sente insultad[Select_CString( advocate_of_nepotism.IsFemale, 'a', 'o' )] com sua oferta"
 marshal_task.0304.b.success:0 "[advocate_of_nepotism.GetTitledFirstNameNoTooltip] está satisfeit[Select_CString( advocate_of_nepotism.IsFemale, 'ã', 'ão' )] com sua oferta"
 marshal_task.0304.b:0 "Não preferiria que [Select_CString( beneficiary_of_nepotism.IsFemale, 'a', 'o' )] [beneficiary_of_nepotism.GetTitledFirstNameNoTooltip] servisse como cortes[Select_CString( beneficiary_of_nepotism.IsFemale, 'ã', 'ão' )]?"
 marshal_task.0304.c:0 "Meu exército #EMP não#! é uma creche!"
 marshal_task.0304.desc:0 "M[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [councillor.GetCouncilTitle], [councillor.GetTitledFirstName], traz [beneficiary_of_nepotism.Custom2('MyCharacterIntroduction', ROOT.Char)] para mim de maneira muito hesitante.\n\n\"[advocate_of_nepotism.GetTitledFirstName|U] me pediu para promover [Select_CString( beneficiary_of_nepotism.IsFemale, 'a', 'o' )] [beneficiary_of_nepotism.GetTitledFirstNameNoTooltip] à honra de comandante. Mas eu acreditei que você talvez quisesse opinar sobre o assunto antes...\"\n\n[beneficiary_of_nepotism.GetTitledFirstNameNoTooltip] [beneficiary_of_nepotism.Custom('quirk_neg_present')]."
 marshal_task.0304.t:0 "Promoção de Comandante?"
 marshal_task.0306.a:0 "Isso é apenas um mal-entendido!"
 marshal_task.0306.desc:0 "Eu levei suas palavras a sério quando você prometeu fazer de [beneficiary_of_nepotism.Custom2('MyCharacterIntroduction', advocate_of_nepotism)] seu [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')], mas agora vejo que minha confiança foi equivocada. Perdoe-me por acreditar demais em suas palavras."
 marshal_task.0306.opening:0 "[advocate_of_nepotism.Custom2('AppropriateGreetingNegative', SCOPE.sC('councillor_liege'))]"
 marshal_task.1001.a:0 "Eu preciso de mais tropas, não menos!"
 marshal_task.1001.desc:0 "As práticas severas de recrutamento [Select_CString( councillor.IsFemale, 'da minha', 'do meu' )] [councillor.GetCouncilTitle], [councillor.GetTitledFirstName], parecem estar tendo o efeito oposto ao pretendido.\n\nEnquanto mais camponeses são reunidos nas cidades e vilas, um grande número está fugindo das tropas de [councillor.GetFirstName] para escapar de suas obrigações de servidão!"
 marshal_task.1001.notification:0 "Deserção da Milícia"
 marshal_task.1001.t:0 "Deserção da Milícia"
 marshal_task.1002.a:0 "Isso não deveria acontecer."
 marshal_task.1002.desc:0 "O número recorde de tropas de milícia trazidas para o serviço pelo meu [councillor.GetCouncilTitle] teve algumas consequências imprevistas.\n\nO recrutamento indiscriminado d[Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstName] deixou acres de terras agrícolas no [county.GetName] desatendidos."
 marshal_task.1002.notification:0 "Milícia Deixa Terras Agrícolas Vazias"
 marshal_task.1002.t:0 "Terras Agrícolas Não Utilizadas"
 marshal_task.1003.a:0 "O que você fez, [councillor.GetFirstNameNoTooltip]..."
 marshal_task.1003.desc:0 "A campanha entusiasmada de recrutamento [Select_CString( councillor.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))], [councillor.GetTitledFirstName], resultou em uma escassez de homens aptos no [county.GetName].\n\nCom menos pessoas para servirem como guardas locais, o crime está em alta."
 marshal_task.1003.notification:0 "Guardas Recrutados para a Milícia"
 marshal_task.1003.t:0 "Guardas Insuficientes"
 marshal_task.1101.a:0 "Ótimo trabalho, [councillor.GetFirstNameNoTooltip]."
 marshal_task.1101.desc:0 "Com uma seleção cuidadosa e criteriosa dos soldados da milícia, m[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [councillor.GetCouncilTitle], [councillor.GetTitledFirstName], garantiu que nenhuma fazenda no [county.GetName] fique desatendida.\n\nOs registros que [councillor.GetSheHe] tem mantido serão muito úteis na temporada de impostos também..."
 marshal_task.1101.notification:0 "Serviço de Milícia Bem-Organizado"
 marshal_task.1101.t:0 "Serviço Bem-Organizado"
 marshal_task.1102.a:0 "Meus súditos sempre podem se sentir seguros."
 marshal_task.1102.desc:0 "O trabalho d[Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstName] para reorganizar minhas milícias avançou para o [county.GetName], onde o aumento da presença militar tem feito maravilhas.\n\nBandidos foram eliminados, e contrabandistas e sequestradores estão com medo de operar."
 marshal_task.1102.notification:0 "Aumento da Presença Militar"
 marshal_task.1102.t:0 "Aumento da Presença Militar"
 marshal_task.1103.notification:0 "Milícia Preparada para a Batalha"
 marshal_task.2001.a:0 "Eles estavam usando armas reais?!"
 marshal_task.2001.ending:0 "\n\nM[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [councillor.GetCouncilTitle], [councillor.GetTitledFirstName], conseguiu estancar o sangramento, mas levará um tempo até que [commander.GetFirstName] se recupere."
 marshal_task.2001.notification:0 "Guerreiro Ferido em Treinamento"
 marshal_task.2001.opening:0 "No curso de um duelo de treinamento, [commander.GetTitledFirstName] foi atingid[Select_CString( commander.IsFemale, 'a', 'o' )]!"
 marshal_task.2001.t:0 "Comandante Ferido"
 marshal_task.2002.a:0 "Pelo menos sua mente ainda está intacta."
 marshal_task.2002.b:0 "Seu cavalo terá que levá-l[Select_CString( councillor.IsFemale, 'a', 'o' )] para a batalha."
 marshal_task.2002.c:0 "Por favor, me diga que [commander.GetSheHe] ainda tem a mão para segurar a espada!"
 marshal_task.2002.eye:0 "\n\nM[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [councillor.GetCouncilTitle] rapidamente chamou um médico, mas não havia como salvar sua visão."
 marshal_task.2002.generic_title:0 "Guerreiro Ferido em Treinamento"
 marshal_task.2002.hand:0 "\n\nM[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [councillor.GetCouncilTitle] rapidamente chamou um médico, mas não havia como salvar sua vida e braço."
 marshal_task.2002.leg:0 "\n\nM[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [councillor.GetCouncilTitle] rapidamente chamou um médico, mas não havia como salvar sua vida e perna."
 marshal_task.2002.notification_eye:0 "[commander.GetTitledFirstName] perdeu um olho durante um treinamento sob a supervisão do m[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [councillor.GetCouncilTitle]!"
 marshal_task.2002.notification_hand:0 "[commander.GetTitledFirstName] ficou mutilado durante um treinamento sob a supervisão do m[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [councillor.GetCouncilTitle]!"
 marshal_task.2002.notification_leg:0 "[commander.GetTitledFirstName] perdeu uma perna durante um treinamento sob a supervisão do m[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [councillor.GetCouncilTitle]!"
 marshal_task.2002.t:0 "Comandante Gravemente Ferido"
 marshal_task.2003.a:0 "Uma perda trágica para meu exército."
 marshal_task.2003.ending:0 "\n\nM[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [councillor.GetCouncilTitle] chamou um médico imediatamente, mas [commander.GetFirstName] havia perdido muito sangue em questão de momentos."
 marshal_task.2003.t:0 "Morte de um Comandante"
 marshal_task.2101.a:0 "Faça isso acontecer."
 marshal_task.2101.b:0 "[commander.GetFirstNameNoTooltip] deveria focar mais no combate pessoal!"
 marshal_task.2101.desc:0 "M[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [councillor.GetCouncilTitle], [councillor.GetTitledFirstName], vem até mim com uma proposta.\n\n\"Notei que [Select_CString( commander.IsFemale, 'a', 'o' )] [commander.GetTitledFirstName] possui um grande potencial para [commander.Custom('CommanderTraitSkillDescription')] assim como [Select_CString( teacher.IsFemale, 'a', 'o' )] [teacher.GetTitledFirstName] tinha. Acredito que [commander.GetFirstName] poderia aprender muito com um ensino dedicado de [teacher.GetFirstName].\""
 marshal_task.2101.notification:0 "Traço de [commander.Custom('CommanderTraitBeingTaughtNoTooltip')] Obtido"
 marshal_task.2102.notification:0 "Cavaleiro Aprimorado"
 marshal_task.2103.notification:0 "Hastilúdios Treinados"
 marshal_task.3001.a:0 "O que você fez, [councillor.GetFirstNameNoTooltip]..."
 marshal_task.3001.desc:0 "[Select_CString( ROOT.Char.IsFemale, 'Minha estimada', 'Meu estimado' )] [councillor.Custom2('RelationToMe', ROOT.Char)],\n Enquanto meus esforços para reorganizar o [county.GetName] estão progredindo rapidamente, nem todos estão convencidos de seus benefícios.\nParece que pisei nos calos de vários prefeitos e anciãos de vilas. Todos os prefeitos e anciãos de vilas, para ser mais preciso."
 marshal_task.3001.notification:0 "Perda de Respeito Popular"
 marshal_task.3001.t:0 "Resistência Local"
 marshal_task.3002.a:0 "Você conseguiu #EMP piorar#! as coisas #EMP ainda mais?!#!"
 marshal_task.3002.desc:0 "[Select_CString( ROOT.Char.IsFemale, 'Minha estimada', 'Meu estimado' )] [councillor.Custom2('RelationToMe', ROOT.Char)]...\n\nParece que cometi alguns erros de julgamento. As reformas que introduzi no [county.GetName] deveriam fortalecer seu controle sobre a região, mas as pessoas mal sabem quem é seu [ROOT.Char.GetTitleTierName]..."
 marshal_task.3002.notification:0 "[councillor.GetCouncilTitle] Perdendo o Controle"
 marshal_task.3003.a:0 "Você não poderia ser um pouco mais delicado, [councillor.GetFirstNameNoTooltip]?"
 marshal_task.3003.desc:0 "Saudações, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [baron.Custom2('RelationToMe', ROOT.Char)],\n Devo reclamar sobre o comportamento [Select_CString( councillor.IsFemale, 'da sua', 'do seu' )] [councillor.GetCouncilTitle], [councillor.GetTitledFirstName]!\n [councillor.GetSheHe|U] apareceu no [county.GetName] e começou a mudar as coisas sem pensar, sem considerar nossas tradições ou práticas antigas!"
 marshal_task.3003.notification:0 "Barão Irritado"
 marshal_task.3003.t:0 "Uma Decepção"
 marshal_task.3101.a:0 "Bom trabalho, [councillor.GetCouncilTitle]!"
 marshal_task.3101.desc:0 "[Select_CString( ROOT.Char.IsFemale, 'Minha estimada', 'Meu estimado' )] [councillor.Custom2('RelationToMe', ROOT.Char)],\n Fico feliz em informar que minha reorganização do [county.GetName] está indo bem.\n Não são apenas vocês que se beneficiam dessas melhorias. O povo de [county.GetNameNoTier] é eternamente leal ao seu [ROOT.Char.GetTitleTierName], é claro, mas eles raramente estiveram tão gratos."
 marshal_task.3101.notification:0 "[councillor.GetCouncilTitle] Ganha Respeito"
 marshal_task.3101.t:0 "Benefícios Locais"
 marshal_task.3102.a:0 "Continue com o bom trabalho, [councillor.GetFirstNameNoTooltip]."
 marshal_task.3102.desc:0 "M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [baron.Custom2('RelationToMe', ROOT.Char)],\n S[Select_CString( councillor.IsFemale, 'ua', 'eu' )] [councillor.GetCouncilTitle], [councillor.GetTitledFirstName], tem trabalhado incansavelmente para reorganizar o [county.GetName], e já estamos colhendo os benefícios.\nGostaria de agradecer pessoalmente por enviar um[Select_CString( councillor.IsFemale, 'a', '' )] [councillor.GetWomanMan] tão capaz para nos ajudar!"
 marshal_task.3102.notification:0 "[councillor.GetCouncilTitle] Impressiona o Vassalo"
 marshal_task.3102.t:0 "Uma Gratidão"
 marshal_task.3103.notification:0 "[acclaimed_knight] subjuga a plebe"
 marshal_task.4002.notification:0 "Guardas Desorganizados"
 marshal_task_0304_a_tt:0 "@warning_icon! #X [CHARACTER.GetShortUINameNoTooltip|U] ficará chatead[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] se [TARGET_CHARACTER.GetShortUINameNoTooltip|U] for demitid[Select_CString( TARGET_CHARACTER.IsFemale, 'a', 'o' )] dentro de 20 anos#!"
 task_manage_guards_disorganized_modifier:0 "$marshal_task.4002.notification$"
