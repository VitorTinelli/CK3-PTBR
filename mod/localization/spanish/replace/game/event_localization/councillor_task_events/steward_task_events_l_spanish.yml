l_spanish:
 steward_task.0001.a:0 "Não tenho escolha. Vou ceder."
 steward_task.0001.b:0 "Absurdo! Não permitirei isso!"
 steward_task.0001.county_loss.tt:0 "S[Select_CString( ROOT.Char.IsFemale, 'ua', 'eu' )] senhor[Select_CString( ROOT.Char.IsFemale, 'a', '' )] feudal [ROOT.Char.GetTitledFirstName] cedeu às protestações de seus súditos e entregou [county.GetNameNoTooltip] ao s[Select_CString( councillor_liege.IsFemale, 'ua', 'eu' )] governante de jure, [councillor_liege.GetTitledFirstName]. Você não controla mais o condado!"
 steward_task.0001.desc:0 "Recebi notícias graves hoje: o povo de [county.GetNameNoTier] reivindica sua pertença ao mais grandioso e prestigioso [councillor_liege.GetPrimaryTitle.GetNameNoTierNoTooltip]!\n\nSeduzidos pelas promessas melífluas d[Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstName] e encantados pelo esplendor da corte d[Select_CString( councillor_liege.IsFemale, 'a', 'o' )] [councillor_liege.GetTitledFirstNamePossessive], eles agora esperam que eu simplesmente entregue o condado ao meu intrometido vizinho!\n\nDevo considerar cuidadosamente meu próximo movimento. Perder terras nunca é ideal, mas os habitantes locais ficarão extremamente descontentes comigo se eu não os deixar partir."
 steward_task.0001.liege_changed.tt:0 "S[Select_CString( ROOT.Char.IsFemale, 'ua', 'eu' )] senhor[Select_CString( ROOT.Char.IsFemale, 'a', '' )] feudal [ROOT.Char.GetTitledFirstName] cedeu às protestações de seus súditos e entregou [county.GetNameNoTooltip] ao s[Select_CString( councillor_liege.IsFemale, 'ua', 'eu' )] senhor[Select_CString( councillor_liege.IsFemale, 'a', '' )] feudal de jure, seu novo suserano [councillor_liege.GetTitledFirstName]."
 steward_task.0001.liege_changed:0 "Entregue ao Senhor Feudal De Jure"
 steward_task.0001.t:0 "Condado De Jure Convencido"
 steward_task.0002.a:0 "Bem feito, [councillor.GetFirstNameNoTooltip]!"
 steward_task.0002.desc:0 "Parece que os esforços [Select_CString( councillor.IsFemale, 'da minha', 'do meu' )] [councillor.GetCouncilTitle] em [county.GetName] finalmente valeram a pena!\n\nAs pessoas locais foram persuadidas pela língua afiada d[Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstNamePossessive] e seduzidas pelo prestígio da minha corte. Diante do descontentamento de todo o condado, [previous_owner.GetTitledFirstName] escolheu o caminho de menor resistência e liberou [county.GetNameNoTierNoTooltip].\n\nO condado agora pertence ao seu senhor feudal de jure, eu mesmo!"
 steward_task.0002.t:0 "Condado De Jure Liberado!"
 steward_task.0003.a:0 "Maldito seja você, [previous_owner.GetFirstNameNoTooltip]!"
 steward_task.0003.desc:0 "Parece que os esforços [Select_CString( councillor.IsFemale, 'da minha', 'do meu' )] [councillor.GetCouncilTitle] em [county.GetName] foram em vão.\n\nAs pessoas locais, persuadidas pela lábia d[Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstNamePossessive] e seduzidas pelo prestígio da minha corte, protestaram veementemente contra [Select_CString( previous_owner.IsFemale, 'sua governante ilegítima', 'seu governante ilegítimo' )], [previous_owner.GetTitledFirstName], mas em vão.\n\nEmbora o descontentamento local ainda possa torná-lo uma presa mais fácil para nós, meu plano diplomático foi frustrado. Por enquanto."
 steward_task.0003.t:0 "Falha em Convencer o Território De Jure!"
 steward_task.1001.a:0 "Mais cedo ou mais tarde, eles estarão comendo aço!"
 steward_task.1001.end:0 "\n\nBandidos surgiram em [county.GetName], alegando que, com os novos impostos, o roubo é a única maneira de sustentar suas famílias."
 steward_task.1001.notification:0 "Sobretaxação Causa Banditismo"
 steward_task.1001.opening:0 "Parece que o esforço [Select_CString( councillor.IsFemale, 'da minha', 'do meu' )] [councillor.GetCouncilTitle] para melhorar a cobrança de impostos teve alguns efeitos colaterais infelizes."
 steward_task.1001.t:0 "Aliviando o Próprio Fardo"
 steward_task.1002.a:0 "Precisamos conhecê-los para tributá-los, [councillor.GetFirstNameNoTooltip]!"
 steward_task.1002.end:0 "\n\nAs pessoas em [county.GetName] começaram a esconder familiares e animais de fazenda d[Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstName] e meus outros avaliadores!"
 steward_task.1002.notification:0 "Censo Inútil"
 steward_task.1003.a:0 "Você está perdendo o controle, [councillor.GetFirstNameNoTooltip]?"
 steward_task.1003.end:0 "\n\nCom os novos impostos introduzidos, muitas pessoas em [county.GetName] estão se recusando a confiar em meus árbitros para resolver disputas!"
 steward_task.1003.notification:0 "Nenhum Xerife Nomeado"
 steward_task.1004.a:0 "Eles estão praticamente roubando dos bolsos do [ROOT.Char.GetTitleTierName]!"
 steward_task.1004.end:0 "\n\nCom os novos impostos introduzidos em [county.GetName], cada vez mais pessoas estão recorrendo ao contrabando em vez do comércio legal!"
 steward_task.1004.notification:0 "Tarifas Excessivas"
 steward_task.1005.a:0 "Deixe-me dar uma olhada mais de perto nesses livros..."
 steward_task.1005.a_failure:0 "Você não encontra falhas na contabilidade d[Select_CString( tax_collector.IsFemale, 'a', 'o' )] [tax_collector.GetTitledFirstNamePossessiveNoTooltip]"
 steward_task.1005.a_success:0 "Você otimiza o processo de tributação do reino"
 steward_task.1005.b:0 "[tax_collector.GetTitledFirstNameNoTooltip] tem controle sobre os impostos do reino."
 steward_task.1005.c:0 "[steward.GetTitledFirstNameNoTooltip] tem domínio sobre seu próprio território."
 steward_task.1005.desc:0 "\"Isso é um absurdo\", m[Select_CString( steward.IsFemale, 'inha', 'eu' )] [steward.GetCouncilTitle] [steward.GetTitledFirstName] entra furioso na câmara do conselho, com [Select_CString( tax_collector.IsFemale, 'a', 'o' )] [tax_collector.GetTitledFirstName] seguindo de perto. \"Primeiro, sou instruído a recolher meus próprios impostos e, em seguida, [tax_collector.GetTitledFirstNameNoTooltip] os recolhe novamente? Você precisa dizer a [tax_collector.GetSheHe] para ficar fora das minhas terras.\"\n\n\"[steward.GetTitledFirstNameNoTooltip] cometeu um... erro contábil\", intervém [Select_CString( tax_collector.IsFemale, 'a', 'o' )] [tax_collector.GetTitledFirstNameNoTooltip]. \"Eu apenas corrigi recolhendo a diferença, nada mais.\"\n\n[steward.GetTitledFirstNameNoTooltip] lança um olhar fulminante para [tax_collector.GetSheHe]."
 steward_task.1005.t:0 "Taxado Duas Vezes"
 steward_task.1101.a:0 "Por [ROOT.Char.GetFaith.WealthGodName], é claro que estou satisfeito!"
 steward_task.1101.b:0 "Ahaha! Dia de pagamento!"
 steward_task.1101.desc:0 "Conforme [Select_CString( councillor.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] enumera feudo após feudo, seu valor e obrigações pagas, eu a interrompo quando ouço de repente uma quantia que #EMP deve#! ser um erro.\n\"Você arrecadou QUANTO em [county.GetName]?!\"\n\n[councillor.GetFirstName] sorri. \"Pensei que você ficaria satisfeito em ouvir, [ROOT.Char.Custom('FormOfAddressForLiege')].\""
 steward_task.1101.notification:0 "Impostos Adicionais"
 steward_task.1101.t:0 "Melhoria na Tributação"
 steward_task.2001.a:0 "Você não pode sacrificar tudo por essa tarefa, [councillor.GetFirstNameNoTooltip]!"
 steward_task.2001.desc:0 "Os camponeses estão reclamando da interferência [Select_CString( councillor.IsFemale, 'da minha', 'do meu' )] [councillor.GetCouncilTitle] em [county.GetName]! A apropriação de trabalhadores por parte d[Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstNamePossessive] de toda a [county.GetTitleTierName] significa que outros projetos de construção já em andamento raramente são concluídos."
 steward_task.2001.notification:0 "Desenvolvimento Mal Gerenciado"
 steward_task.2001.t:0 "Falta de Trabalhadores"
 steward_task.2002.a:0 "[councillor.GetFirstNameNoTooltip]! O que você fez?!"
 steward_task.2002.desc:0 "[Select_CString( ROOT.Char.IsFemale, 'Minha querida', 'Meu querido' )] [councillor.Custom2('RelationToMe', ROOT.Char)],\nMeus esforços para ajudar [county.GetName] e orientar o contínuo desenvolvimento das terras lá têm sido mal recebidos. Na verdade, poderíamos dizer que os camponeses estão pedindo, bem, a minha \"cabeça numa estaca\", por assim dizer. Parte dessa raiva parece estar direcionada a você também, embora tudo isso seja totalmente injustificado."
 steward_task.2002.notification:0 "População Mal Gerenciada"
 steward_task.2003.a:0 "Coloque a situação sob controle, [councillor.GetFirstNameNoTooltip]!"
 steward_task.2003.desc:0 "Apesar de todos os bons esforços [Select_CString( councillor.IsFemale, 'da minha', 'do meu' )] [councillor.GetCouncilTitle] para estabelecer novos feudos em [county.GetName], as coisas parecem ter saído do controle. Com tanta movimentação de pessoas, [councillor.GetTitledFirstName] parece não saber quais partes da [county.GetTitleTierName] já estão estabelecidas e quais estão planejadas para o desmatamento. Na verdade, parece que ninguém sabe!"
 steward_task.2003.notification:0 "Perda de Controle"
 steward_task.2003.t:0 "Perda de Controle"
 steward_task.2005.a.tt:0 "Acredito que [Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitledFirstNameNoTooltip] favorece dinheiro e ganhos imediatos a curto prazo."
 steward_task.2005.a:0 "Então vamos cobrar os impostos devidos."
 steward_task.2005.b.tt:0 "Acredito que [Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitledFirstNameNoTooltip] favorece benefícios a longo prazo e não tem luxúria por ouro."
 steward_task.2005.b:0 "Não, o desenvolvimento de [county.GetNameNoTierNoTooltip] vem primeiro."
 steward_task.2005.c.tt:0 "[liege.GetTitledFirstNameNoTooltip] decidirá se priorizará a tributação ou o desenvolvimento em [county.GetNameNoTierNoTooltip]."
 steward_task.2005.c:0 "[liege.GetTitledFirstNameNoTooltip] deveria decidir por [liege.GetHerselfHimself]."
 steward_task.2005.desc:0 "Enquanto me concentro na diretiva [Select_CString( liege.IsFemale, 'da minha senhora feudal', 'do meu senhor feudal' )] [liege.GetTitledFirstNamePossessive] para desenvolver [county.GetName], [tax_collector.GetTitledFirstName] se aproxima de mim com um grosso livro-caixa e outro servo para carregar esse livro-caixa.\n\n\"Dado que o condado está aumentando de tamanho\", explica [tax_collector.GetSheHe], \"é justo que seus impostos também aumentem. Passei várias noites calculando uma quantia justa que você pode examinar por si mesmo neste livro-caixa...\"\n\nO servo se aproxima, os joelhos cambaleando."
 steward_task.2005.failure:0 "[liege.GetTitledFirstNameNoTooltip|U] discorda da sua direção"
 steward_task.2005.success:0 "[liege.GetTitledFirstNameNoTooltip|U] aprova a sua direção"
 steward_task.2005.t:0 "Lucros Emergentes"
 steward_task.2006.a:0 "Bom trabalho, [steward.GetTitledFirstNameNoTooltip]."
 steward_task.2006.b:0 "O quê? Isso não era o que eu queria!"
 steward_task.2006.b_notification:0 "Decisão Anulada"
 steward_task.2006.desc_development:0 "No entanto, acreditei que fazer isso prejudicaria o crescimento do condado e, portanto, não segui o conselho [tax_collector.GetHerHim]."
 steward_task.2006.desc_intro:0 "Enquanto inspecionava [county.GetName], [tax_collector.GetTitledFirstName] sugeriu que eu aumentasse os impostos do condado junto com seu desenvolvimento.\n\n"
 steward_task.2006.desc_taxation:0 "Segui o conselho [tax_collector.GetHerHim] e acredito que você apreciará os resultados."
 steward_task.2006.opening:0 "[steward.Custom2('AppropriateGreeting', ROOT.Char)]"
 steward_task.2007.a:0 "Mais impostos são bons impostos, esse é o meu lema."
 steward_task.2007.desc:0 "[tax_collector.GetTitledFirstName] e eu não conseguimos decidir se priorizamos a tributação em [county.GetName] ou o seu desenvolvimento e, portanto, trazemos a questão para você."
 steward_task.2008.a:0 "[tax_collector.GetTitledFirstNameNoTooltip] está cert[Select_CString( tax_collector.IsFemale, 'a', 'o' )] neste assunto."
 steward_task.2008.b:0 "[steward.GetTitledFirstNameNoTooltip] levanta um bom ponto."
 steward_task.2008.c:0 "Vocês dois não conseguem resolver isso sozinhos?!"
 steward_task.2008.desc_intro_friendly:0 "Embora [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] e [tax_collector.Custom2('MyCharacterIntroduction', ROOT.Char)] normalmente se saiam bem, parece que eles estão se desentendendo sobre [county.GetNameNoTier] de todas as coisas."
 steward_task.2008.desc_intro_unfriendly:0 "Não passa um dia sem que [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] e [tax_collector.Custom2('MyCharacterIntroduction', ROOT.Char)] se desentendam. Desta vez, a discussão parece ser sobre [county.GetNameNoTier] de todas as coisas."
 steward_task.2008.desc_outro:0 "\n\n\"À medida que [county.GetNameNoTooltip] se torna mais próspero, seus impostos também devem aumentar\", afirma [Select_CString( tax_collector.IsFemale, 'a', 'o' )] [tax_collector.GetTitledFirstNameNoTooltip]. \"Vamos aumentá-los agora, em vez de depois que a tarefa d[Select_CString( steward.IsFemale, 'a', 'o' )] [steward.GetTitledFirstNamePossessiveNoTooltip] oficialmente terminar.\"\n\n\"Mas fazer isso vai retardar o crescimento em [county.GetNameNoTierNoTooltip],\" contra-argumenta [Select_CString( steward.IsFemale, 'a', 'o' )] [steward.GetTitledFirstNameNoTooltip]. \"E, no final, minha diretiva é desenvolver, não tributar, o condado.\""
 steward_task.2101.a:0 "Você sabe o que fazer, [councillor.GetFirstNameNoTooltip]!"
 steward_task.2101.desc:0 "Com [Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstName], [Select_CString( councillor.IsFemale, 'minha', 'meu' )] [councillor.GetCouncilTitle], orientando o estabelecimento e o desmatamento de terras em [county.GetName], [councillor.GetSheHe] tem uma visão clara não apenas dos novos feudos, mas também daqueles que já existiam.\n\nDe acordo com [councillor.GetSheHe], nossos registros fiscais nunca foram tão detalhados!"
 steward_task.2101.notification:0 "Impostos Eficientes do Condado"
 steward_task.2101.t:0 "Tributação Eficiente"
 steward_task.2102.a:0 "Lembre a todos quem governa o [ROOT.Char.GetTitleTierName]."
 steward_task.2102.desc:0 "Orientar o estabelecimento de novos feudos em [county.GetName] requer que m[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [councillor.GetCouncilTitle] exerça um maior grau de controle do que o que tem sido tradicional para as pessoas lá.\n\nFelizmente, [councillor.GetTitledFirstName] comanda grande respeito, e a administração fortalecida no [county.GetTitleTierName] me beneficia de mais de uma maneira."
 steward_task.2102.notification:0 "Aumento do Controle"
 steward_task.2102.t:0 "Aumento do Controle"
 steward_task.3001.a:0 "Os colonos [ROOT.Char.GetCulture.GetNameNoTooltip] devem ser respeitados!"
 steward_task.3001.desc:0 "Muitos dos novos colonos [ROOT.Char.GetCulture.GetName] em [county.GetName] têm enfrentado dificuldades. Em [county.GetNameNoTier], os colonos não apenas são ignorados por suas comunidades, mas têm ocorrido ataques diretos em várias propriedades rurais!"
 steward_task.3001.notification:0 "Resistência dos Colonos"
 steward_task.3001.t:0 "Resistência dos Colonos"
 steward_task.3002.a:0 "Tudo isso é necessário, receio."
 steward_task.3002.desc:0 "[councillor.GetTitledFirstName] está enfrentando problemas inesperados em [county.GetName]. Os moradores locais estão se recusando a cooperar com a nova administração [ROOT.Char.GetCulture.GetName]. Reclamações surgem de que os esforços d[Select_CString( councillor.IsFemale, 'a minha', 'o meu' )] [councillor.GetCouncilTitle] são muito mais perturbadores do que úteis."
 steward_task.3002.notification:0 "Administração [ROOT.Char.GetCulture] Falha"
 steward_task.3002.t:0 "Resistência à Administração"
 steward_task.3101.a:0 "Fiz bem em confiar [Select_CString( councillor.IsFemale, 'na', 'no' )] [councillor.GetTitledFirstNameNoTooltip]!"
 steward_task.3101.desc:0 "M[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [councillor.GetCouncilTitle], [councillor.GetTitledFirstName], tem trabalhado para estabelecer uma administração baseada nos princípios [ROOT.Char.GetCulture.GetName] em [county.GetName].\n\nOs esforços [councillor.GetHerHim|U] parecem ser bem-recebidos entre os moradores locais, pois suas vidas estão se tornando mais fáceis e seguras."
 steward_task.3101.notification:0 "Administração [ROOT.Char.GetCulture] Bem-Vinda"
 steward_task.3101.t:0 "Administração Bem-Vinda"
 steward_task.3102.a:0 "Mais ouro nos cofres é sempre bom!"
 steward_task.3102.desc:0 "M[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [councillor.GetCouncilTitle], [councillor.GetTitledFirstName], tem trabalhado para melhorar a administração em [county.GetName] ao introduzir ideias baseadas nas tradições [ROOT.Char.GetCulture.GetName].\n\nCom uma gestão habilidosa do [county.GetTitleTierName], os proprietários de terras locais não parecem se importar com um leve aumento nos impostos."
 steward_task.3102.notification:0 "Administração [ROOT.Char.GetCulture]"
 steward_task.3102.t:0 "Gestão Apreciada"
 steward_task.3103.a:0 "Agora já vi de tudo."
 steward_task.3103.desc:0 "Algo estranho ocorreu, graças aos esforços d[Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstName] em introduzir colonos [ROOT.Char.GetCulture.GetName] em [county.GetNameNoTier].\n\nOs moradores locais parecem ter desenvolvido uma maior compreensão de sua parte do reino e, quando chega a hora de lutar por ele, cada aldeia faz o que pode para enviar seus melhores [ROOT.Char.Custom('LevyMenWomen')] aptos para servir. Na verdade, alguns camponeses se alistam voluntariamente!"
 steward_task.3103.notification:0 "Milícia Voluntária [ROOT.Char.GetCulture]"
 steward_task.3103.t:0 "Regimentos Fortalecidos"
 steward_task.3201.notification:0 "Autonomia Aumentada"
 steward_task.3202.notification:0 "Isenção de Impostos Culturais Concedida"
 steward_task.3203.notification:0 "Tradições Arcaicas Protegidas"
 steward_task.3301.notification:0 "Entendimento Cultural Alcançado"
 steward_task.3302.notification:0 "Abordagens Diplomáticas Apreciadas"
 steward_task.3303.notification:0 "Curiosidade Cultural Despertada"
 steward_task.4001.a:0 "Mas eu tenho uma reivindicação #EMP legítima#! sobre ele!"
 steward_task.4001.desc:0 "Ficou claro que [Select_CString( councillor.IsFemale, 'a sua', 'o seu' )] [councillor.GetCouncilTitle] está tentando encantar [county.GetName] e instigá-lo contra mim. Não pense que esse tipo de ação desonrosa ficará sem resposta."
 steward_task.4001.opening:0 "[county_liege.Custom2('AppropriateGreeting', ROOT.Char)]"
 steward_task.4002.a:0 "Eles entenderão, mais cedo ou mais tarde."
 steward_task.4002.desc:0 "[councillor.GetTitledFirstName] está enfrentando problemas inesperados em [county.GetName]. Os moradores locais estão completamente desinteressados com nossas tentativas de conquistá-los."
 steward_task.4002.notification:0 "Perda de Prestígio"
 steward_task.4002.t:0 "Perda de Prestígio"
 steward_task.4101.a:0 "Excelente resultado!"
 steward_task.4101.desc:0 "A missão d[Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstNamePossessive] em [county.GetName] está começando a dar resultados. Os moradores estão impressionados com nossos esforços e nos veem de forma favorável."
 steward_task.4101.notification:0 "Prestígio Obtido"
 steward_task.4101.t:0 "Prestígio Obtido"
