 councillor_spouse_learning.2001.a.culture:0 "Acalme os membros da facção [councillor.GetCulture.GetNameNoTooltip]."
 councillor_spouse_learning.2001.a.faction_members_culture:0 "Cada membro [councillor.GetCulture.GetName] da facção [different_culture_or_faith_faction.GetName]"
 councillor_spouse_learning.2001.a.faction_members_faith:0 "Cada membro [councillor.GetFaith.GetAdjective] da facção [different_culture_or_faith_faction.GetName]"
 councillor_spouse_learning.2001.a.faith:0 "Acalme os membros da facção [councillor.GetFaith.GetAdjectiveNoTooltip]."
 councillor_spouse_learning.2001.b:0 "Faça [Select_CString( faction_member_1.IsFemale, 'a', 'o' )] [faction_member_1.GetTitledFirstNameNoTooltip] sair da facção."
 councillor_spouse_learning.2001.c:0 "Convença [Select_CString( faction_member_2.IsFemale, 'a', 'o' )] [faction_member_2.GetTitledFirstNameNoTooltip] a permanecer leal a mim."
 councillor_spouse_learning.2001.claimant_faction.desc:0 "Esses ladrões desonrosos buscam tomar as terras que são legitimamente minhas."
 councillor_spouse_learning.2001.culture.desc:0 "[councillor.GetCulture.GetNameNoTooltip]"
 councillor_spouse_learning.2001.culture.t:0 "[councillor.GetCouncilTitle]: Dissidentes [councillor.GetCulture.GetNameNoTooltip]"
 councillor_spouse_learning.2001.end.desc:0 "\n\nFelizmente, como \"um deles\", m[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] [councillor.GetTitledFirstName] possui certa influência sobre eles. [councillor.GetSheHe|U] ofereceu-se para mediar e quer saber como proceder."
 councillor_spouse_learning.2001.faith.desc:0 "[councillor.GetFaith.GetAdjectiveNoTooltip]"
 councillor_spouse_learning.2001.faith.t:0 "[councillor.GetCouncilTitle]: Dissidentes [councillor.GetFaith.GetAdjectiveNoTooltip]"
 councillor_spouse_learning.2001.independence_faction.desc:0 "Eles deveriam ser súditos leais, mas sei que estão tramando contra mim."
 councillor_spouse_learning.2001.liberty_faction.desc:0 "Eles buscam minar minha autoridade a cada oportunidade."
 councillor_spouse_learning.2001.middle.desc:0 "conspiradores na [different_culture_or_faith_faction.GetName] não me dão um momento de paz!"
 councillor_spouse_learning.2001.start.desc:0 "[faction_leader.GetTitledFirstName] e seus colegas"
 councillor_spouse_learning.2301.a.success:0 "Eu me tornei amigo d[Select_CString( religious_head.IsFemale, 'a', 'o' )] [religious_head.GetTitledFirstName]."
 councillor_spouse_learning.2301.a:0 "Você pode fazer as apresentações?"
 councillor_spouse_learning.2301.b:0 "O que [religious_head.GetSheHe] pode fazer em troca?"
 councillor_spouse_learning.2301.c:0 "Essa é minha chance de ser bem-vindo novamente à comunidade sagrada!"
 councillor_spouse_learning.2301.d:0 "Deixe [religious_head.GetSheHe] saber - tudo o que fazemos, fazemos em nome de [councillor.GetFaith.HighGodName]."
 councillor_spouse_learning.2301.desc:0 "M[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] [councillor.GetTitledFirstName] tornou-se uma figura conhecida no mundo religioso. Sua proteção aos estudiosos [councillor.GetFaith.GetAdjectiveNoTooltip], [councillor.GetFaith.HouseOfWorshipPlural] e ordens até chamou a atenção d[Select_CString( religious_head.IsFemale, 'a', 'o' )] [religious_head.GetTitledFirstName] [religious_head.GetHerselfHimself].\n\nA gratidão do [religious_head.GetTitleAsNameNoTooltip] traz benefícios poderosos. M[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] ofereceu-se para entrar em contato com [religious_head.GetSheHe] em meu nome."
 councillor_spouse_learning.2301.t:0 "[councillor.GetCouncilTitle]: Um Poder Maior"
 councillor_spouse_learning.2601.a:0 "Sim, apreciaria sua orientação."
 councillor_spouse_learning.2601.b:0 "[tutoring_student_1.GetTitledFirstNameNoTooltip] precisa mais da sua ajuda do que eu."
 councillor_spouse_learning.2601.c:0 "Você deveria tutorar [Select_CString( tutoring_student_2.IsFemale, 'a', 'o' )] [tutoring_student_2.GetTitledFirstNameNoTooltip] em vez disso."
 councillor_spouse_learning.2601.d:0 "Você deveria focar em seus próprios estudos."
 councillor_spouse_learning.2601.not_scholarly.desc:0 "\"Não faria mal você ler um livro de vez em quando,\" m[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))], [Select_CString( councillor.IsFemale, 'a estudiosa', 'o estudioso' )] [councillor.GetTitledFirstName], costuma me dizer. [councillor.GetSheHe|U] ofereceu-se para ser meu tutor, caso eu precise de ajuda para começar."
 councillor_spouse_learning.2601.scholarly.desc:0 "Toda vez que me encontro curvado sobre um tomo, m[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] [councillor.GetTitledFirstName], o estudioso, fica visivelmente animado.\n\n\"Gostaria de alguma ajuda em seus estudos? Alguém com quem trocar ideias ou talvez novos tomos? Recentemente adquiri um volume com uma excelente análise sobre [ROOT.Char.Custom('education_conversation_subject')]!\""
 councillor_spouse_learning.2601.t:0 "[councillor.GetCouncilTitle]: Educação Avançada"
 councillor_spouse_learning.2602.a:0 "Diplomacia."
 councillor_spouse_learning.2602.b:0 "Teoria militar."
 councillor_spouse_learning.2602.c:0 "Economia do reino."
 councillor_spouse_learning.2602.d:0 "Gerenciamento de rede de espionagem."
 councillor_spouse_learning.2602.e:0 "Teologia."
 councillor_spouse_learning.2602.not_root.desc:0 "Embora m[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('student'))] [student.GetTitledFirstName] certamente saiba algumas coisas sobre [student.Custom('highest_skill_noun')], [councillor.GetTitledFirstName] acredita que está na hora [student.GetHerHim] ampliar seus horizontes.\n\n\"Eu posso adquirir novos tomos, preparar algumas tarefas, dar algumas aulas particulares para [student.GetSheHe]. Qual disciplina você acha que seria mais benéfica para [student.GetFirstNameNoTooltip]?\""
 councillor_spouse_learning.2602.root.desc:0 "\"Embora você saiba algumas coisas sobre [student.Custom('highest_skill_noun')], o [student.GetTitleTierName] do [student.GetPrimaryTitle.GetNameNoTierNoTooltip] deve possuir uma ampla gama de habilidades,\" m[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] diz, [ROOT.Char.Custom2('QuirkPPPosOrNeg', SCOPE.sC('councillor'))].\n\n\"Eu posso adquirir novos tomos, preparar algumas tarefas, dar algumas aulas particulares para você. Em qual disciplina você tem mais interesse?\""
 councillor_spouse_learning.2602.t:0 "[councillor.GetCouncilTitle]: Ampliando Horizontes"
 councillor_spouse_learning.2603.a:0 "[Select_CString( chancellor.IsFemale, 'A', 'O' )] [chancellor.GetCouncilTitle|U] [chancellor.GetFirstNameNoTooltip] poderia usar um tutor."
 councillor_spouse_learning.2603.b:0 "[Select_CString( marshal.IsFemale, 'A', 'O' )] [marshal.GetCouncilTitle|U] [marshal.GetFirstNameNoTooltip] se beneficiaria da sua ajuda."
 councillor_spouse_learning.2603.c:0 "Dê algumas lições para m[Select_CString( steward.IsFemale, 'inha', 'eu' )] [steward.GetCouncilTitle], [steward.GetFirstNameNoTooltip]."
 councillor_spouse_learning.2603.d:0 "Talvez você tenha alguns conselhos para [Select_CString( spymaster.IsFemale, 'a', 'o' )] [spymaster.GetCouncilTitle] [spymaster.GetFirstNameNoTooltip]."
 councillor_spouse_learning.2603.desc:0 "Alguns dos meus conselheiros acreditam que o cargo é deles por direito de sangue ou apenas por influência — quão errados eles estão! Eu espero resultados, mas frequentemente me decepciono.\n\nApós um longo dia, estou reclamando com [Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetFirstName] quando [councillor.GetSheHe] me interrompe. \"Deixe-me fazer algo sobre isso, [ROOT.Char.GetWifeHusband]. Algumas lições talvez aguçem o raciocínio deles.\""
 councillor_spouse_learning.2603.e:0 "[Select_CString( court_chaplain.IsFemale, 'A', 'O' )] [court_chaplain.GetCouncilTitle] [court_chaplain.GetFirstNameNoTooltip] precisa de orientação."
 councillor_spouse_learning.2603.f:0 "Fique aqui comigo em vez disso..."
 councillor_spouse_learning.2603.t:0 "[councillor.GetCouncilTitle]: À Altura da Tarefa"
 councillor_spouse_learning_2601_tutoring_effect.critical_success:0 "O [THIS.Char.LocalPlayerString( 'meu ', '' )]entendimento[THIS.Char.LocalPlayerString( '', 'Loc_ES_de_GetShortUIName' )] do [THIS.Char.Custom('education_focus')] aumenta consideravelmente"
 councillor_spouse_learning_2601_tutoring_effect.success:0 "O [THIS.Char.LocalPlayerString( 'meu ', '' )]entendimento[THIS.Char.LocalPlayerString( '', 'Loc_ES_de_GetShortUIName' )] do [THIS.Char.Custom('education_focus')] aumenta"
