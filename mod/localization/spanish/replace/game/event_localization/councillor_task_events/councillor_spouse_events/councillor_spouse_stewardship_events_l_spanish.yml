 councillor_spouse_stewardship.1010.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|U] Resolve Dívida de Cortesão"
 councillor_spouse_stewardship.1011.desc.corruption:0 "Controle dos Arrecadadores de Impostos"
 councillor_spouse_stewardship.1011.desc.guilds:0 "Guildas Derrotadas"
 councillor_spouse_stewardship.1011.desc.serfs:0 "Servos Apaziguados"
 councillor_spouse_stewardship.2001.a:0 "Realize um magnífico jantar para deleite de todos!"
 councillor_spouse_stewardship.2001.b:0 "Invista o dinheiro na área local."
 councillor_spouse_stewardship.2001.c:0 "Se há algo que o dinheiro pode comprar são olhos e ouvidos!"
 councillor_spouse_stewardship.2001.d:0 "Vamos guardar para o momento."
 councillor_spouse_stewardship.2001.desc:0 "Com a diligente administração das finanças de minha casa por parte d[Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstName], há mais ouro ao final desta estação do que o esperado.\n\n\"Como devemos utilizá-lo da melhor forma, [ROOT.Char.GetWifeHusband]?\""
 councillor_spouse_stewardship.2001.t:0 "[councillor.GetCouncilTitle]: Investigação de Investimentos"
 councillor_spouse_stewardship.2002.a:0 "Eu vou te pagar, eu prometo."
 councillor_spouse_stewardship.2002.b:0 "Por que você não doa para [ROOT.Char.GetFaith.HouseOfWorship]?"
 councillor_spouse_stewardship.2002.c:0 "Você deveria doar para os pobres."
 councillor_spouse_stewardship.2002.d:0 "Eu aceitarei essa homenagem com prazer!"
 councillor_spouse_stewardship.2002.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U].\" [courtier_lender.GetTitledFirstName] se aproxima de mim e sorri [courtier_lender.Custom('quirk_pos_adverb')]. \"Fui abordado p[Select_CString( councillor.IsFemale, 'ela', 'elo' )] [councillor.GetTitledFirstName] que, em sua sabedoria, sugeriu um acordo entre nós dois. Já que você precisa de ajuda financeira, e eu poderia usar alguma assistência social...\""
 councillor_spouse_stewardship.2002.money_loan_tooltip:0 "Eu vou pegar emprestado [gold_i] #bold [THIS.Var('amount_to_loan').GetValue]#! de ouro de [courtier_lender.GetFirstNameNoTooltip]."
 councillor_spouse_stewardship.2002.t:0 "[councillor.GetCouncilTitle]: Oportunidade Brilhante"
 councillor_spouse_stewardship.2003.a:0 "[ruler_1.GetTitledFirstNameNoTooltip] parece razoável."
 councillor_spouse_stewardship.2003.b:0 "Faça um acordo com [Select_CString( ruler_2.IsFemale, 'a', 'o' )] [ruler_2.GetTitledFirstNameNoTooltip]."
 councillor_spouse_stewardship.2003.c:0 "Faça um acordo com [Select_CString( ruler_3.IsFemale, 'a', 'o' )] [ruler_3.GetTitledFirstNameNoTooltip]."
 councillor_spouse_stewardship.2003.d:0 "Nenhum deles apresenta uma oportunidade suficientemente tentadora..."
 councillor_spouse_stewardship.2003.d_arrogant:0 "Nenhum deles é digno de fazer um acordo com #EMP mim#!!"
 councillor_spouse_stewardship.2003.d_greedy:0 "Nenhum deles chegará perto do meu ouro!"
 councillor_spouse_stewardship.2003.desc:0 "[councillor.GetTitledFirstName] se aproxima de mim com três pergaminhos em seus braços.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], eu elaborei propostas comerciais para os governantes vizinhos. Tenho certeza de que podemos fazer um acordo que beneficie ambas as partes!\""
 councillor_spouse_stewardship.2003.t:0 "[councillor.GetCouncilTitle]: Oportunidade de Comércio"
 councillor_spouse_stewardship.2004.a:0 "Excelente trabalho!"
 councillor_spouse_stewardship.2004.b:0 "Um bom ato não precisa de recompensa."
 councillor_spouse_stewardship.2004.desc:0 "\"[Select_CString( on_my_hook.IsFemale, 'Sua', 'Seu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('on_my_hook'))], [on_my_hook.GetTitledFirstName], recentemente se meteu em um pequeno problema.\"\n\n[councillor.GetTitledFirstName] sorri [councillor.Custom('quirk_pos_adverb')] enquanto continua, \"Eu me certifiquei de que a situação se resolvesse e mencionei você como o benfeitor.\""
 councillor_spouse_stewardship.2004.t:0 "[councillor.GetCouncilTitle]: Uma Mão Amiga"
 councillor_spouse_stewardship.2005.a:0 "É um risco que vale a pena!"
 councillor_spouse_stewardship.2005.a_1:0 "O negócio resulta em um grande retorno para [county_to_boost.GetNameNoTierNoTooltip]."
 councillor_spouse_stewardship.2005.a_2:0 "O negócio fracassa."
 councillor_spouse_stewardship.2005.b:0 "Deixe a oportunidade para o povo de [county_to_boost.GetNameNoTierNoTooltip]."
 councillor_spouse_stewardship.2005.c:0 "Essa conversa sobre assuntos locais está abaixo de mim!"
 councillor_spouse_stewardship.2005.desc:0 "\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetLadyLord|U]. Chegou ao meu conhecimento que há uma oportunidade rara de investir em [county_to_boost.GetName].\"\n\n[Select_CString( councillor.IsFemale, 'Minha', 'Meu' )] [councillor.Custom('WifeHusband')] [councillor.GetFirstName] elabora os detalhes do investimento empresarial, e de fato parece que o negócio pode beneficiar grandemente [county_to_boost.GetNameNoTierNoTooltip] se for bem-sucedido."
 councillor_spouse_stewardship.2005.t:0 "[councillor.GetCouncilTitle]: Investimentos em [county_to_boost.GetNameNoTierNoTooltip]"
 councillor_spouse_stewardship_1006_every_courtier:0 "Cada Cortesão"
 councillor_spouse_stewardship_2001_every_powerful_vassal:0 "Cada Vassalo Poderoso"
