 councillor_spouse_martial.0001.message:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|U] Inspira Recrutamento"
 councillor_spouse_martial.0002.message:0 "Auxílio na Organização do Exército"
 councillor_spouse_martial.0003.message:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|U] Inspirador[Select_CString( councillor.IsFemale, 'a', '' )]"
 councillor_spouse_martial.0004.message:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|U] Estimula a Cavalaria"
 councillor_spouse_martial.0005.message:0 "Apoio em Negociações com Mercenários"
 councillor_spouse_martial.0006.message:0 "Cuidando de Mim"
 councillor_spouse_martial.0007.message:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|U] Cuidando dos Ferimentos"
 councillor_spouse_martial.0008.message:0 "Presença Intimidadora"
 councillor_spouse_martial.0009.message:0 "Prática de Combate"
 councillor_spouse_martial.1001.a:0 "Eu também aplaudo para os meus $knight_culture_player_plural_no_tooltip_lowercase$!"
 councillor_spouse_martial.1001.b.education_tt:0 "Eu promovo a educação militar de [child.GetFirstNameNoTooltip]"
 councillor_spouse_martial.1001.b:0 "Esta é a oportunidade perfeita para dar algumas dicas para [child.GetFirstNameNoTooltip]!"
 councillor_spouse_martial.1001.c:0 "Este dia é em #EMP nossa#! honra, meu amor!"
 councillor_spouse_martial.1001.commanders:0 "Cada $knight_culture_player_no_tooltip_lowercase$"
 councillor_spouse_martial.1001.desc:0 "O sol está brilhando e os camponeses estão circulando pelo torneio organizado pelo m[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))]. Todos os meus $knight_culture_player_plural_no_tooltip_lowercase$ aplaudem enquanto [Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstName] anuncia o torneio em sua honra, e, por uma vez, posso simplesmente sentar e assistir.\n\nNo entanto, não pretendo passar o dia todo pres[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a um trono!"
 councillor_spouse_martial.1001.t:0 "[councillor.GetCouncilTitle]: Dia do Torneio"
 councillor_spouse_martial.1002.a:0 "Meu [councillor.GetTitleAsNameNoTooltip] e eu estamos prontos para defender o reino!"
 councillor_spouse_martial.1002.b:0 "Certifique-se de que as pessoas se curvem apropriadamente, meu querido."
 councillor_spouse_martial.1002.c:0 "Todos devem me temer e adorar aos meus pés, [councillor.GetFirstNameNoTooltip]!"
 councillor_spouse_martial.1002.desc:0 "Meu[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] passa bastante tempo viajando pelo reino com sua guarda de honra. Existem muitos assuntos que [councillor.GetSheHe] pode resolver em meu nome, e a presença militar d[Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstName] é um firme lembrete do meu direito de governar."
 councillor_spouse_martial.1002.t:0 "[councillor.GetCouncilTitle]: Agindo em Meu Nome"
 councillor_spouse_martial.1003.a:0 "Resolva isso, custe o que custar."
 councillor_spouse_martial.1003.b.tt:0 "[attacker_vassal.GetFirstNameNoTooltip] e [defender_vassal.GetFirstNameNoTooltip] continuam sua guerra"
 councillor_spouse_martial.1003.b:0 "Não, quero ver quem vence!"
 councillor_spouse_martial.1003.c.unlock_tt:0 "Esta opção está disponível devido à genialidade estratégica de [councillor.GetFirstNameNoTooltip]"
 councillor_spouse_martial.1003.c:0 "Oh, confio em você, meu querido."
 councillor_spouse_martial.1003.desc:0 "M[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('councillor'))]. É o conflito entre [Select_CString( attacker_vassal.IsFemale, 'a', 'o' )] [attacker_vassal.GetTitledFirstName] e [Select_CString( defender_vassal.IsFemale, 'a', 'o' )] [defender_vassal.GetTitledFirstName] que [councillor.GetSheHe] deseja discutir.\n\n\"Suas lutas são sem honra, e eles trazem vergonha ao seu reino. Deixe-me lidar com eles. Eu sei que posso forçá-los a um acordo de paz.\""
 councillor_spouse_martial.1003.t:0 "[councillor.GetCouncilTitle]: Uma Questão de Honra"
 councillor_spouse_martial.1004.a:0 "Mais tropas para reforçar o exército!"
 councillor_spouse_martial.1004.b:0 "Eles servirão como minha guarda pessoal."
 councillor_spouse_martial.1004.desc:0 "Estou um pouco confus[Select_CString( ROOT.Char.IsFemale, 'a', 'eu' )] sobre o motivo pelo qual m[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] deseja me apresentar um \"grande presente\" no pátio. No entanto, logo entendo, quando [Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstName] ordena que um grupo de soldados se alinhe. \"Um regimento completo, levantado de minhas próprias terras, pronto para servi-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )].\"\n\nEste #EMP é#! um grande presente!"
 councillor_spouse_martial.1004.t:0 "[councillor.GetCouncilTitle]: A Guarda"
 councillor_spouse_martial.1005.a.tt:0 "[vassal.GetFirstNameNoTooltip] torna-se mais suscetível ao [dread|E]"
 councillor_spouse_martial.1005.a:0 "Sim, [vassal.GetFirstNameNoTooltip] verá soldados por todos os lugares para onde [vassal.GetSheHe] olhar!"
 councillor_spouse_martial.1005.b:0 "Um desfile regular deve ser suficiente."
 councillor_spouse_martial.1005.desc:0 "[vassal.GetTitledFirstName] está vindo a [capital.GetNameNoTier] para me prestar homenagem. No entanto, [councillor.GetTitledFirstName] sugere que uma exibição militar poderia garantir lealdade contínua.\n\n\"Ver o seu poder avassalador faria qualquer um pensar duas vezes se a traição cruzasse suas mentes\", aponta m[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))]."
 councillor_spouse_martial.1005.t:0 "[councillor.GetCouncilTitle]: Deixando uma Impressão"
