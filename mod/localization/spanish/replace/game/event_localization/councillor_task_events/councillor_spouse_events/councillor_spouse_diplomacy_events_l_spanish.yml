 councillor_spouse_diplomacy.1001.desc:0 "Reputação Familiar"
 councillor_spouse_diplomacy.1002.desc:0 "Mediação de Conflitos entre Irmãos"
 councillor_spouse_diplomacy.1003.desc:0 "Melhora nas Relações entre Irmãos"
 councillor_spouse_diplomacy.1004.desc:0 "Treinamento em Diplomacia"
 councillor_spouse_diplomacy.1004.desc_diplo_councillor:0 "Ensinado pelo [councillor.GetTitleAsName]"
 councillor_spouse_diplomacy.1005.desc:0 "Prática Diplomática"
 councillor_spouse_diplomacy.1006.desc:0 "Com o trabalho árduo d[Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstName], [councillor.GetSheHe] se tornou melhor em conversar com as pessoas."
 councillor_spouse_diplomacy.1007.desc:0 "Trocas Amigáveis"
 councillor_spouse_diplomacy.2001.a:0 "[Select_CString( child_heir.IsFemale, 'Minha herdeira', 'Meu herdeiro' )], [child_heir.GetTitledFirstNameNoTooltip], poderia se beneficiar com a tutela."
 councillor_spouse_diplomacy.2001.b.all_kids:0 "Todos os meus filhos solteiros:"
 councillor_spouse_diplomacy.2001.b:0 "Todos eles poderiam receber algum treinamento."
 councillor_spouse_diplomacy.2001.c:0 "Eu gostaria que você me ensinasse maneirismos apreciados!"
 councillor_spouse_diplomacy.2001.desc:0 "[councillor.GetTitledFirstName] observa meus [ROOT.Char.Custom('ChildChildrenGender')] com [Select_CString( councillor.IsFemale, 'sua', 'seu' )] [councillor.Custom('quirk_pos_noun')] habitual. 'Nenhum de seus filhos deve ficar sem um casamento adequado.'"
 councillor_spouse_diplomacy.2001.desc_end:0 "Se você me permitir educá-los, logo haverá pretendentes alinhados nas ruas!"
 councillor_spouse_diplomacy.2001.desc_mother:0 "[councillor.GetTitledFirstName] observa nossos [ROOT.Char.Custom('ChildChildrenGender')] com [Select_CString( councillor.IsFemale, 'sua', 'seu' )] [councillor.Custom('quirk_pos_noun')] habitual. 'Nenhum de nossos filhos deve ficar sem um casamento adequado.'"
 councillor_spouse_diplomacy.2001.t_female:0 "[councillor.GetCouncilTitle]: Solteira Elegível"
 councillor_spouse_diplomacy.2001.t_male:0 "[councillor.GetCouncilTitle]: Solteiro Elegível"
 councillor_spouse_diplomacy.2002.a:0 "[vassal_heir_1.GetTitledFirstNameNoTooltip] parece ser [Select_CString( vassal_heir_1.IsFemale, 'uma', 'um' )] [vassal_heir_1.Custom('WomanManGirlBoy')] de boa reputação."
 councillor_spouse_diplomacy.2002.b:0 "[vassal_heir_2.GetTitledFirstNameNoTooltip] provavelmente seria uma boa influência!"
 councillor_spouse_diplomacy.2002.c:0 "Ouvi coisas boas sobre [Select_CString( vassal_heir_3.IsFemale, 'a', 'o' )] [vassal_heir_3.GetTitledFirstNameNoTooltip]."
 councillor_spouse_diplomacy.2002.d:0 "[Select_CString( child_heir.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child_heir'))] se sairá bem por conta própria."
 councillor_spouse_diplomacy.2002.desc:0 "'Nurturar relacionamentos entre a próxima geração de governantes é um dever que não devemos negligenciar,' diz [Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstName].\n\n'Alguns de seus vassalos mais influentes têm filhos que tenho certeza de que [Select_CString( child_heir.IsFemale, 'a', 'o' )] [child_heir.GetTitledFirstName] se beneficiaria conhecendo.'"
 councillor_spouse_diplomacy.2002.t:0 "[councillor.GetCouncilTitle]: Tornar-se Mais Apegado"
 councillor_spouse_diplomacy.2003.a:0 "Você pode estar certo..."
 councillor_spouse_diplomacy.2003.b:0 "Vou corrigir a cara [rival.GetHerHim]!"
 councillor_spouse_diplomacy.2003.c:0 "Você chama [rival.GetSheHe] de [SCOPE.Custom('PersonalityGetSharedTraitDescriptionFromFlag')]?! Deixe-me revelar o verdadeiro caráter [rival.GetHerHim]..."
 councillor_spouse_diplomacy.2003.desc:0 "Assim que vejo [Select_CString( rival.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival'))] [rival.GetTitledFirstName] do outro lado da [ROOT.Char.GetFaith.HouseOfWorship], começo a me virar, mas para minha surpresa [Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstName] acena [Select_CString( rival.IsFemale, 'a', 'o' )] [rival.Custom2('InsultNoun', ROOT.Char)] [councillor.Custom('quirk_pos_adverb')] em nossa direção.\n\n\"[rival.GetSheHe|U] concordou em se encontrar com você em terreno neutro. É lamentável que [SCOPE.Custom('PersonalityGetSharedTraitDescriptionFromFlag')] [ROOT.Char.Custom2('WomenMenPeople', SCOPE.sC('rival'))] como você estejam brigando. Você não acha que é hora de fazer as pazes?\""
 councillor_spouse_diplomacy.2003.t:0 "[councillor.GetCouncilTitle]: Oportunidade para a Paz"
 councillor_spouse_diplomacy.2004.a.tt:0 "#F Com [claimant.GetFirstNameNoTooltip] hospedad[Select_CString( claimant.IsFemale, 'a', 'o' )] em minha corte, posso impulsionar a reivindicação del[Select_CString( claimant.IsFemale, 'a', 'e' )] quando for o momento certo#!"
 councillor_spouse_diplomacy.2004.a:0 "Eu talvez possa te ajudar com isso."
 councillor_spouse_diplomacy.2004.b:0 "Boa sorte com isso."
 councillor_spouse_diplomacy.2004.c.tt:0 "#F Vou informar [Select_CString( current_holder.IsFemale, 'a', 'ao' )] [current_holder.GetTitleTierName] que [claimant.GetFirstNameNoTooltip] não é mais uma ameaça.#!"
 councillor_spouse_diplomacy.2004.c:0 "Prisão. Pergaminho. Pombo para [Select_CString( current_holder.IsFemale, 'a', 'o' )] [current_holder.GetTitledFirstNameNoTooltip]. Nessa ordem."
 councillor_spouse_diplomacy.2004.desc:0 "[Select_CString( councillor.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] [councillor.GetTitledFirstName] traz ansiosamente um[Select_CString( claimant.IsFemale, 'a', '' )] [claimant.GetWomanMan] diante de mim.\n\n\"Meu [ROOT.Char.GetTitleTierName], permita-me apresentar-lhe [Select_CString( claimant.IsFemale, 'a', 'o' )] [claimant.GetTitledFirstName], pretendente ao [title_to_claim.GetName].\"\n\n[claimant.GetFirstName] se curva diante de mim e diz: \"É uma honra, [claimant.Custom2('RelationToMeAddress', ROOT.Char)]. Infelizmente, [title_to_claim.GetNameNoTier] provavelmente permanecerá fora do meu alcance sem um... beneficiário ao meu lado.\""
 councillor_spouse_diplomacy.2004.t:0 "[councillor.GetCouncilTitle]: Reivindicação por Conveniência"
