l_spanish:
 councillor_spouse_intrigue.0001.message:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|U] e [spymaster.GetCouncilTitle] Cooperam"
 councillor_spouse_intrigue.0002.message:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|U] Expõe um Esquema"
 councillor_spouse_intrigue.0003.message:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|U] Descobre um Segredo"
 councillor_spouse_intrigue.0004.message:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|U] Ajuda um Esquema"
 councillor_spouse_intrigue.0005.message:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|U] Manipula um Assunto"
 councillor_spouse_intrigue.0006.message:0 "Inocência Perdida"
 councillor_spouse_intrigue.0007.message:0 "Prática Ardilosa"
 councillor_spouse_intrigue.1001.a:0 "Fui enganado como um tolo!"
 councillor_spouse_intrigue.1001.desc:0 "\"Você tem que ter cuidado com as pessoas com quem você se cerca.\" A expressão nos olhos do [Select_CString( councillor.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('councillor'))] é mortalmente séria. \"Eu descobri que, neste exato momento, [spymaster.GetTitledFirstName] está tramando contra você!\"\n\nSerá possível? Meu próprio [spymaster.GetCouncilTitle]?!"
 councillor_spouse_intrigue.1001.t:0 "[councillor.GetCouncilTitle]: Não Confie em Ninguém"
 councillor_spouse_intrigue.1002.a:0 "É hora de um pouco de espionagem, meu [councillor.Custom('LoverPetName')]!"
 councillor_spouse_intrigue.1002.b:0 "Eu preciso descobrir o que é!"
 councillor_spouse_intrigue.1002.c:0 "Eu protejo meus segredos melhor do que [target.GetFirstNameNoTooltip] faz."
 councillor_spouse_intrigue.1002.desc:0 "M[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] [councillor.Custom('quirk_pos_present')] do jeito que [councillor.GetSheHe] frequentemente faz quando [councillor.GetSheHe] tem algo para compartilhar. \"Você sabe dos boatos sobre [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName], que [target.GetSheHe] está escondendo algo terrível?\" Me aproximo mais enquanto [councillor.GetSheHe] abaixa a voz. \"Todos eles são verdadeiros. Tudo o que precisamos é de provas.\""
 councillor_spouse_intrigue.1002.t:0 "[councillor.GetCouncilTitle]: Boato e Especulação"
 councillor_spouse_intrigue.1003.a:0 "Faça [agent.GetSheHe] entender o quanto está em jogo."
 councillor_spouse_intrigue.1003.b:0 "Use [agent.GetSheHe] para encontrar o verdadeiro mentor!"
 councillor_spouse_intrigue.1003.c:0 "Monitore cada movimento [agent.GetHerHim] e me mantenha a salvo de danos!"
 councillor_spouse_intrigue.1003.desc:0 "Posso perceber pela maneira como [councillor.GetSheHe] se aproxima de mim que [Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstName] descobriu mais um segredo na corte.\n\n\"[agent.GetTitledFirstName] está participando de uma conspiração\", [councillor.GetSheHe] diz. \"[agent.GetSheHe|U] ainda não sabe que eu sei, mas sugiro que você ofereça anistia a [agent.GetSheHe], em troca de lealdade absoluta...\""
 councillor_spouse_intrigue.1003.t:0 "[councillor.GetCouncilTitle]: Revelado"
 councillor_spouse_intrigue.1004.a:0 "Um pouco de chantagem manterá [secret_holder.GetSheHe] na linha."
 councillor_spouse_intrigue.1004.b:0 "Isso é escandaloso! O reino precisa saber!"
 councillor_spouse_intrigue.1004.c.tt:0 "Você ainda não revela o Segredo de [secret_holder.GetFirstNameNoTooltip]"
 councillor_spouse_intrigue.1004.c:0 "Às vezes é melhor esperar com uma mão vencedora."
 councillor_spouse_intrigue.1004.desc:0 "[secret_holder.GetTitledFirstName] tem sido um incômodo, apoiando verbalmente a [faction.GetName]. Felizmente, estou prestes a ter a vantagem.\n\nM[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] descobriu um segredo bem guardado [secret_holder.GetHerHim], [councillor.GetSheHe] me conta com um sorriso sagaz.\n\n\"Pensei que você achasse interessante, minha querida...\""
 councillor_spouse_intrigue.1004.t:0 "[councillor.GetCouncilTitle]: Pesquisa de Oposição"
 councillor_spouse_intrigue.1005.a:0 "Garanta que [faction_member.GetFirstNameNoTooltip] nunca mais apoie [leader.GetFirstNameNoTooltip]!"
 councillor_spouse_intrigue.1005.b:0 "Você poderia #EMP me#! fazer parecer uma escolha melhor?"
 councillor_spouse_intrigue.1005.desc:0 "[faction_member.GetTitledFirstName] tem apoiado ativamente [Select_CString( leader.IsFemale, 'a', 'o' )] [leader.GetTitledFirstName] e a sua [faction.GetName]. No entanto, m[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] tem um plano para mudar isso.\n\n\"Confie em mim, as coisas que eu poderia contar para [Select_CString( faction_member.IsFemale, 'a', 'o' )] [faction_member.GetTitledFirstName] fariam [faction_member.GetSheHe] negar [leader.GetFirstNameNoTooltip] instantaneamente.\""
 councillor_spouse_intrigue.1005.t:0 "[councillor.GetCouncilTitle]: Dividir e Conquistar"
 councillor_spouse_intrigue.1006.a:0 "Uma ideia brilhante, [Select_CString( councillor.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))]!"
 councillor_spouse_intrigue.1006.b:0 "Acho que precisamos de [plant.GetFirstNameNoTooltip] aqui."
 councillor_spouse_intrigue.1006.desc:0 "Estando bem ciente dos meus planos em relação [Select_CString( target.IsFemale, 'a', 'ao' )] [target.GetTitledFirstName], [Select_CString( councillor.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] [councillor.GetFirstName] veio até mim com uma proposta.\n\n\"Tenho amigos na corte d[Select_CString( court_owner.IsFemale, 'a', 'ao' )] [court_owner.GetTitledFirstName]. Eu poderia pedir que hospedassem um hóspede por algum tempo. Com um pequeno sinal de lealdade e todo o apoio que posso oferecer, [plant.GetTitledFirstName] poderia fazer maravilhas em seu nome...\""
 councillor_spouse_intrigue.1006.t:0 "[councillor.GetCouncilTitle]: Um Representante Apropriado"
