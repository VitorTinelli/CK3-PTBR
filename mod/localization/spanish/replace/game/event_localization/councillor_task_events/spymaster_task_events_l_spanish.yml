l_spanish:
 spymaster.1001.notification:0 "Documentos Secretos Perdidos"
 spymaster_task.0311.councillor_liege_opening:0 "Enquanto desempenhava suas funções como m[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [councillor.GetCouncilTitle], [councillor.GetTitledFirstName] descobriu um segredo guardado por [secret_holder.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]."
 spymaster_task.0311.notification:0 "[councillor.GetCouncilTitle]: Segredo Descoberto"
 spymaster_task.0311.secret_bastard.father_is_interesting:0 "\n\n[bastard.GetTitledFirstName] é, na verdade, [Select_CString( bastard.IsFemale, 'a', 'o' )] filh[Select_CString( bastard.IsFemale, 'a', 'o' )] bastard[Select_CString( bastard.IsFemale, 'a', 'o' )] d[Select_CString( mother.IsFemale, 'a', 'o' )] [mother.GetTitledFirstName] e [Select_CString( actual_father.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actual_father'))], [actual_father.GetTitledFirstName]!"
 spymaster_task.0311.secret_bastard.i_am_not_father:0 "\n\n[bastard.GetTitledFirstName] não é [Select_CString( bastard.IsFemale, 'minha', 'meu' )] verdadeir[Select_CString( bastard.IsFemale, 'a', 'o' )] filh[Select_CString( bastard.IsFemale, 'a', 'o' )], mas sim [bastard.Custom('DaughterSon')] de [secret_holder.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 spymaster_task.0311.secret_bastard.i_am_not_real_father:0 "\n\n[bastard.GetTitledFirstName] não é [Select_CString( bastard.IsFemale, 'minha', 'meu' )] verdadeir[Select_CString( bastard.IsFemale, 'a', 'o' )] filh[Select_CString( bastard.IsFemale, 'a', 'o' )], mas sim [bastard.Custom('DaughterSon')] de [actual_father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 spymaster_task.0311.secret_bastard.i_am_real_father:0 "\n\n[bastard.GetTitledFirstName] não é apenas um[Select_CString( bastard.IsFemale, 'a', '' )] bastard[Select_CString( bastard.IsFemale, 'a', 'o' )], mas... eu sou seu verdadeiro pai!"
 spymaster_task.0311.secret_bastard:0 "\n\n[bastard.GetTitledFirstName] é, na verdade, [Select_CString( bastard.IsFemale, 'a', 'o' )] filh[Select_CString( bastard.IsFemale, 'a', 'o' )] bastard[Select_CString( bastard.IsFemale, 'a', 'o' )] d[Select_CString( mother.IsFemale, 'a', 'o' )] [mother.GetTitledFirstName] e [Select_CString( actual_father.IsFemale, 'a', 'o' )] [actual_father.GetTitledFirstName]!"
 spymaster_task.0311.secret_cannibal.shared:0 "\n\n[secret_holder.GetSheHe|U] parece apreciar as coisas boas da vida. Uma xícara de [ROOT.Char.Custom('RegionalDrink')], talvez, e uma mordida em carne vermelha e macia."
 spymaster_task.0311.secret_cannibal:0 "\n\nEntre todas as coisas vis, [secret_holder.GetSheHe] satisfaz sua fome com carne humana! Haveria algo mais repugnante e perturbador?!"
 spymaster_task.0311.secret_crypto_religionist.cynical_compassionate:0 "\n\nParece que [secret_holder.GetSheHe] ainda pratica [secret_holder.GetSecretFaith.GetName] em segredo. Que estranho ver alguém se apegar a uma fé em detrimento da outra. Será que não percebem o perigo que isso representa?"
 spymaster_task.0311.secret_crypto_religionist.cynical_uncompassionate:0 "\n\nEntão, [secret_holder.GetSheHe] ainda pratica [secret_holder.GetSecretFaith.GetName] em segredo. Que tolice [secret_holder.GetHerHim] se apegar ao seu ídolo mesmo diante da morte! Esses tolos aprenderão algum dia?"
 spymaster_task.0311.secret_crypto_religionist.shared_faith:0 "\n\nParece que [secret_holder.GetSheHe] é meu colega [ROOT.Char.GetFaith.GetAdherentName], mas um ímpio que esconde sua fé nas sombras. O que [ROOT.Char.GetFaith.HighGodName] diria sobre tal falta de fé?"
 spymaster_task.0311.secret_crypto_religionist.shared_faith_shared_secret:0 "\n\nParece que ambos precisamos praticar [secret_holder.GetSecretFaith.GetName] nas sombras. O que fazer agora com essa informação, eu me pergunto?"
 spymaster_task.0311.secret_crypto_religionist.shared_faith_taqiya:0 "\n\nParece que [secret_holder.GetSheHe] é meu colega [root_crypto_faith.GetAdherentName]. Não é errado [secret_holder.GetHerHim] praticar nas sombras, mas fico pensando se os outros [secret_holder.GetFaith.GetAdherentNamePlural] pensarão o mesmo."
 spymaster_task.0311.secret_crypto_religionist.shared_secret:0 "\n\nParece que [secret_holder.GetSheHe] precisa esconder sua crença em [secret_holder.GetSecretFaith.GetName] do público, assim como eu escondo minha [root_crypto_faith.GetName]. Porém, por que [secret_holder.GetSheHe] adoraria sua falsa fé mesmo correndo riscos, permanecerá um mistério."
 spymaster_task.0311.secret_crypto_religionist:0 "\n\n[secret_holder.GetSheHe|U] é um [secret_holder.GetFaith.GetAdherentName] durante o dia, mas ao anoitecer pratica [secret_holder.GetSecretFaith.GetName] em sussurros. Oh, as coisas que eu poderia fazer com essa informação..."
 spymaster_task.0311.secret_deviant.shared:0 "\n\nNão posso acreditar nos modos grotescos como [secret_holder.GetSheHe] busca prazer. A própria ideia seria repugnante para qualquer [secret_holder.GetWomanMan] decente, e ainda assim [secret_holder.GetSheHe] está mais do que disposto... Na verdade, ansioso!"
 spymaster_task.0311.secret_deviant:0 "\n\nOs modos como [secret_holder.GetSheHe] busca prazer são revoltantes para qualquer [secret_holder.GetWomanMan] decente sequer pensar, e ainda assim [secret_holder.GetSheHe] não apenas está disposto, mas ansioso! Parece tão antinatural e repugnante. Não, #emphasis é#! antinatural e repugnante; uma ofensa contra [ROOT.Char.GetFaith.HighGodName]!"
 spymaster_task.0311.secret_incest.shared:0 "\n\nEmbora seja óbvio para mim que o amor não conhece limites, o mundo reagiria com horror e condenação às maneiras pelas quais [secret_holder.GetFirstNameNoTooltip] tem abraçado seu desejo..."
 spymaster_task.0311.secret_incest:0 "\n\n[secret_holder.GetSheHe|U] cometeu um pecado abominável, um crime contra [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself]! Apenas alguém verdadeiramente doente se envolveria em relações carnais com seus parentes próximos."
 spymaster_task.0311.secret_lover.consort:0 "\n\n[Select_CString( secret_holder.IsFemale, 'Minha própria', 'Meu próprio' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secret_holder'))] tem [lover.Custom2('MyCharacterIntroduction', ROOT.Char)] como amante!"
 spymaster_task.0311.secret_lover.consort_is_lover:0 "\n\n[secret_holder.GetSheHe|U] tem [Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetTitledFirstName] como amante, m[Select_CString( lover.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))]!"
 spymaster_task.0311.secret_lover.lover_close_to_me:0 "\n\n[secret_holder.GetSheHe|U] tem [Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetTitledFirstName] como amante. Quem pode dizer como isso aconteceu, mas seria uma vergonha imensa para ambos se isso se tornasse conhecido!"
 spymaster_task.0311.secret_lover.lustful:0 "\n\n[secret_holder.GetSheHe|U] tem se envolvido em práticas carnais com [Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetTitledFirstName], passando as mãos pelo corpo d[Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetFirstNamePossessiveNoTooltip], trocando beijos das mais variadas formas... Ah, o escândalo se isso viesse a público!"
 spymaster_task.0311.secret_lover:0 "\n\n[secret_holder.GetSheHe|U] secretamente tem [lover.Custom2('MyCharacterIntroduction', ROOT.Char)] como amante."
 spymaster_task.0311.secret_murder.callous:0 "\n\n[secret_holder.GetSheHe|U] tramou e planejou o assassinato d[Select_CString( murder_target.IsFemale, 'a', 'o' )] [murder_target.GetTitledFirstName]! Este mundo não tem lugar para uma pessoa fraca e covarde como [secret_holder.GetSheHe]."
 spymaster_task.0311.secret_murder.close_to_me.vengeful:0 "\n\n[secret_holder.GetSheHe|U] é o assassino por trás da morte [Select_CString( murder_target.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murder_target'))], [murder_target.GetTitledFirstName]! [secret_holder.GetFirstName] deve pagar com a vida dela, e com tudo o que lhe é querido!"
 spymaster_task.0311.secret_murder.close_to_me:0 "\n\nA verdade finalmente foi revelada para mim. [secret_holder.GetSheHe|U] foi a pessoa que planejou matar m[Select_CString( murder_target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murder_target'))], [murder_target.GetTitledFirstName]."
 spymaster_task.0311.secret_murder.close_to_me_regret:0 "Será que isso poderia ter sido evitado se eu soubesse mais cedo?"
 spymaster_task.0311.secret_murder.other:0 "\n\n[secret_holder.GetSheHe|U] conspirou nas sombras para ter [Select_CString( murder_target.IsFemale, 'a', 'o' )] [murder_target.GetTitledFirstName] assassinad[Select_CString( murder_target.IsFemale, 'a', 'o' )]!"
 spymaster_task.0311.secret_murder.sadistic:0 "\n\n[secret_holder.GetSheHe|U] parece estar por trás da morte prematura d[Select_CString( murder_target.IsFemale, 'a', 'o' )] [murder_target.GetTitledFirstName]."
 spymaster_task.0311.secret_murder_attempt.close_to_me:0 "\n\n[secret_holder.GetSheHe|U] foi a pessoa por trás de uma tentativa fracassada de assassinar [Select_CString( murder_target.IsFemale, 'a', 'o' )] [murder_target.GetTitledFirstName], m[Select_CString( murder_target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murder_target'))]! A hora da vingança finalmente chegou..."
 spymaster_task.0311.secret_murder_attempt.other:0 "\n\n[secret_holder.GetSheHe|U] foi a pessoa por trás de uma tentativa fracassada de assassinar [Select_CString( murder_target.IsFemale, 'a', 'o' )] [murder_target.GetTitledFirstName]!"
 spymaster_task.0311.secret_murder_attempt.targeting_me:0 "\n\n[secret_holder.GetSheHe|U] foi a pessoa por trás de uma tentativa fracassada de me assassinar! A hora da vingança finalmente chegou..."
 spymaster_task.0311.secret_non_believer.other_faith:0 "\n\nParece que [secret_holder.GetSheHe] pode estar começando a enxergar a verdade sobre o falso deus [secret_holder.GetFaith.HighGodName]. Claro, seus companheiros [secret_holder.GetFaith.GetAdherentNamePlural] provavelmente não serão tão compreensivos quanto eu."
 spymaster_task.0311.secret_non_believer.other_sect:0 "\n\nParece que [secret_holder.GetSheHe] pode estar começando a se afastar do caminho [ROOT.Char.GetFaith.GetAdjective], adotando em vez disso os ensinamentos equivocados dos [secret_holder.GetFaith.GetAdherentNamePlural]. [secret_holder.GetFaith.HighGodName] deve chorar ao ver suas lições sendo distorcidas dessa forma."
 spymaster_task.0311.secret_non_believer.shared:0 "\n\nAssim como eu, [secret_holder.GetSheHe] tem suas dúvidas sobre sua devoção a [ROOT.Char.GetFaith.HighGodName]. Ao contrário de mim, [secret_holder.GetSheHe] não sabe como escondê-las tão bem quanto deveria."
 spymaster_task.0311.secret_non_believer:0 "\n\n[secret_holder.GetSheHe|U] parece estar abrigando dúvidas sobre a doutrina [secret_holder.GetFaith.GetAdjective]. Oh [secret_holder.GetFirstNameNoTooltip]... O que os [secret_holder.GetFaith.AltPriestTermPlural] diriam?"
 spymaster_task.0311.secret_sodomy.illegal:0 "\n\n[secret_holder.GetSheHe|U] tem desfrutado da companhia íntima de [Select_CString( secret_holder.IsFemale, 'outras', 'outros' )] [secret_holder.GetWomenMen]. A tolice de pensar que um pecado como esse contra [ROOT.Char.GetFaith.HighGodName] passaria despercebido..."
 spymaster_task.0311.secret_sodomy.illegal_shared:0 "\n\n[secret_holder.GetSheHe|U] aprecia a companhia íntima de [Select_CString( secret_holder.IsFemale, 'outras', 'outros' )] [secret_holder.GetWomenMen]. No entanto, ao contrário de mim, [secret_holder.GetFirstName] não conseguiu encobrir adequadamente seus pecados."
 spymaster_task.0311.secret_witch.shared:0 "\n\nParece que [secret_holder.GetSheHe] também está em busca de respostas além dos limites deste mundo. Oh, as coisas que [secret_holder.GetSheHe] deve ter visto... Se ao menos pudéssemos ser abertos sobre nosso conhecimento."
 spymaster_task.0311.secret_witch.zealous:0 "\n\nHá evidências de que [secret_holder.GetSheHe] pode estar participando de rituais secretos, que devem ser para se comunicar com espíritos malignos! [secret_holder.GetSheHe|U] certamente até dança nua com demônios sedutores, a luz brilhante das chamas acariciando seus corpos enquanto..."
 spymaster_task.0311.secret_witch.zealous_end:0 "Que pensamento repugnante!"
 spymaster_task.0311.secret_witch:0 "\n\nHá evidências de que [secret_holder.GetSheHe] pode estar participando de rituais secretos. Qual outro propósito haveria para algo assim, senão se comunicar com espíritos malignos e possivelmente se aliar a demônios?!"
 spymaster_task.0311.sodomy.accepted:0 "\n\n[secret_holder.GetSheHe|U] aprecia a companhia íntima de [Select_CString( secret_holder.IsFemale, 'outras', 'outros' )] [secret_holder.GetWomenMen]. Os demais [secret_holder.GetFaith.GetAdherentNamePlural] consideram isso um pecado grave, e embora isso faça pouco sentido, poderia me dar a vantagem que preciso..."
 spymaster_task.0311.spymaster_opening:0 "Enquanto investigava para m[Select_CString( councillor_liege.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor_liege'))], [councillor_liege.GetTitledFirstName], descobri um segredo guardado por [secret_holder.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]."
 spymaster_task.0311.t:0 "Uma Descoberta Secreta"
 spymaster_task.0341.a.detached:0 "Absolutamente repugnante, mas útil de se saber."
 spymaster_task.0341.a.deviant:0 "Descreva novamente. Com o máximo de detalhes possível..."
 spymaster_task.0341.a:0 "Criado! Traga-me um balde antes que eu... #EMP vomite#!"
 spymaster_task.0341.t:0 "Espionagem: Desvios"
 spymaster_task.0342.a:0 "Você se arrependerá de ceder aos seus desejos, [secret_holder.GetFirstNameNoTooltip]."
 spymaster_task.0342.t:0 "Espionagem: Sodomia"
 spymaster_task.0343.a:0 "Pensar que [secret_holder.GetFirstNameNoTooltip] seria capaz de se rebaixar tanto."
 spymaster_task.0343.murder_back:0 "Veja, minhas ações são perfeitamente justificadas."
 spymaster_task.0343.t:0 "Espionagem: Tentativa de Assassinato"
 spymaster_task.0344.a.callous:0 "Eu não devo permitir que cães raivosos fiquem soltos."
 spymaster_task.0344.a.sadistic:0 "Hmm. Será que consigo criar uma punição aterrorizante apropriada?"
 spymaster_task.0344.a:0 "Não apenas cruel e sem coração, mas também desonroso!"
 spymaster_task.0344.b:0 "Estou perfeitamente justificado. Ninguém pode me julgar."
 spymaster_task.0344.t:0 "Espionagem: Assassinato"
 spymaster_task.0345.a.cannibal:0 "Espero que [secret_holder.GetSheHe] me convide para um banquete em breve."
 spymaster_task.0345.a:0 "Oh, humanidade abominável, você nunca deixará de me causar repulsa?"
 spymaster_task.0345.t:0 "Espionagem: Canibalismo"
 spymaster_task.0346.a.close:0 "Isso vai ficar complicado."
 spymaster_task.0346.a.consort:0 "Que ultraje!"
 spymaster_task.0346.a:0 "Isso é útil de saber..."
 spymaster_task.0346.t:0 "Espionagem: Amantes"
 spymaster_task.0347.a:0 "O sinal de uma alma fraca."
 spymaster_task.0347.t:0 "Espionagem: Descrente"
 spymaster_task.0348.a.lustful:0 "Sua própria família...? Oh, eu nem deveria pensar nisso. #EMP Não#! deveria..."
 spymaster_task.0348.a.shared:0 "É assim que deve ser."
 spymaster_task.0348.a:0 "Eu devo condenar uma união tão profana!"
 spymaster_task.0348.t:0 "Espionagem: Incesto"
 spymaster_task.0349.a.zealous:0 "Pensamentos de beleza sobrenatural não devem me seduzir!"
 spymaster_task.0349.a:0 "Que mal [secret_holder.GetSheHe] está planejando?"
 spymaster_task.0349.t:0 "Espionagem: Bruxaria"
 spymaster_task.0350.a.related:0 "Como você pôde esconder isso de mim, [mother.GetFirstNameNoTooltip]?"
 spymaster_task.0350.a:0 "Inacreditável!"
 spymaster_task.0350.t:0 "Espionagem: Bastardo"
 spymaster_task.0353.a.cynical:0 "A tolice [secret_holder.GetHerHim|U] é meu ganho."
 spymaster_task.0353.a.shared_faith_shared_secret:0 "Nossos números crescem."
 spymaster_task.0353.a:0 "Os [secret_holder.GetFaith.AltPriestTermPlural] não perdoarão isso."
 spymaster_task.0353.t:0 "Espionagem: Cripto-[secret_holder.GetSecretFaith.GetAdherentNameNoTooltip]"
 spymaster_task.0359.a:0 "Muito interessante..."
 spymaster_task.0359.t:0 "Espionagem: Uma Descoberta"
 spymaster_task.0381.a.truth_is_relative_unlock:0 "Essa opção está disponível porque tenho a vantagem [GetPerk('truth_is_relative_perk').GetName(GetPlayer)]"
 spymaster_task.0381.a:0 "Veja isso feito."
 spymaster_task.0381.b.flavor:0 "Desde que [character_to_hook.GetSheHe] saiba o quão facilmente eu poderia ter sido seu inimigo"
 spymaster_task.0381.b:0 "Não há motivo para não sermos amigos."
 spymaster_task.0381.desc:0 "\n\nNo entanto, a verdade não precisa atrapalhar a tarefa que me foi dada. Pode-se arranjar para que [character_to_hook.GetFirstNameNoTooltip] tenha um segredo, que certamente arruinaria [character_to_hook.GetSheHe] caso viesse à tona."
 spymaster_task.0381.desc_other_court:0 "Em minha investigação de [target_character.GetTitledFirstName], [character_to_hook.Custom2('HerHisCharacterIntroduction', target_character)] parece ser o mais provável de abrigar uma verdade sombria. Lamentavelmente, por mais que eu cave, ess[Select_CString( character_to_hook.IsFemale, 'a', 'e' )] [character_to_hook.GetTitleAsNameNoTooltip] aparentemente suspeit[Select_CString( character_to_hook.IsFemale, 'a', 'o' )] não parece estar escondendo nada."
 spymaster_task.0381.desc_your_court:0 "Em meu trabalho, não consegui encontrar nenhum segredo que [character_to_hook.Custom2('YourCharacterIntroduction', target_character)] possa possuir."
 spymaster_task.0381.opening:0 "[councillor.Custom2('AppropriateGreetingPositive', SCOPE.sC('councillor_liege'))]"
 spymaster_task.0399.a.counter:0 "Não, não vamos perder mais tempo."
 spymaster_task.0399.a.recommended:0 "Muito bem, você sabe melhor."
 spymaster_task.0399.a.tt:0 "[councillor.GetCouncilTitle] [councillor.GetFirstNameNoTooltip] muda a tarefa para [GetCouncilTaskType('task_disrupt_schemes').GetName|V]"
 spymaster_task.0399.b.counter:0 "Eu não teria tanta certeza. Continue procurando!"
 spymaster_task.0399.b.recommended:0 "Se houver #EMP algo#!, vamos encontrar."
 spymaster_task.0399.b.tt:0 "[councillor.GetCouncilTitle] [councillor.GetFirstNameNoTooltip] continua a [GetCouncilTaskType('task_find_secrets').GetName|V]"
 spymaster_task.0399.desc:0 "Apesar de nossos melhores esforços, meus agentes ainda não descobriram nenhum segredo"
 spymaster_task.0399.home_court:0 "aqui na corte."
 spymaster_task.0399.nothing_to_find:0 "\n\nAcredito que nunca encontraremos nada. Aqui está menos movimento do que em um cemitério ao meio-dia."
 spymaster_task.0399.opening:0 "[councillor.Custom2('AppropriateGreeting', SCOPE.sC('councillor_liege'))]"
 spymaster_task.0399.other_court:0 "na corte d[Select_CString( target_character.IsFemale, 'a', 'o' )] [target_character.GetTitledFirstName]."
 spymaster_task.0399.something_here:0 "\n\nNo entanto, ainda acredito que algo está acontecendo nas sombras. Só preciso de um pouco mais de tempo para descobrir o que é."
 spymaster_task.1001.a.tt:0 "Alguém em seu reino descobriu um de seus [secrets|E].\n\n"
 spymaster_task.1001.a:0 "Você é um[Select_CString( councillor.IsFemale, 'a', '' )] [councillor.Custom2('InsultNoun', ROOT.Char)]"
 spymaster_task.1001.b:0 "Todo mundo comete erros, [councillor.GetFirstNameNoTooltip]."
 spymaster_task.1001.desc:0 "As desculpas d[Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstName] #EMP parecem#! genuínas, mas o erro parece quase ridículo demais para ser real.\n\n\"Veja, [Select_CString( ROOT.Char.IsFemale, 'minha senhora feudal', 'meu senhor feudal' )],\" explica [Select_CString( councillor.IsFemale, 'minha', 'meu' )] [councillor.GetCouncilTitle], \"foi apenas uma questão de enviar a carta errada com o mensageiro errado.\" [councillor.GetSheHe|U] prende a respiração. \"Foi assim que os documentos incriminadores foram perdidos.\""
 spymaster_task.1001.t:0 "Um \"Acidente\""
 spymaster_task.1002.a.tt:0 "#F ...mas quem sou eu para recusar um presente de um[Select_CString( councillor.IsFemale, 'a', '' )] [councillor.GetCouncilTitle]?#!"
 spymaster_task.1002.a:0 "Acho que não era para eu receber isso..."
 spymaster_task.1002.desc:0 "Incluí os documentos incriminadores. Deixo claro que você não deve falar sobre isso com ninguém. Nem mesmo m[Select_CString( councillor_liege.IsFemale, 'inha', 'eu' )] senhor[Select_CString( councillor_liege.IsFemale, 'a', '' )] feudal, [councillor_liege.GetTitledFirstName], tem conhecimento de sua existência, e assim deve permanecer."
 spymaster_task.1002.greeting:0 "A quem possa interessar..."
 spymaster_task.1003.a.tt:0 "Alguém em seu reino descobriu uma das cartas secretas d[Select_CString( courtier.IsFemale, 'a', 'o' )] [courtier.GetTitledFirstNameNoTooltip].\n\n"
 spymaster_task.1003.notification:0 "Carta Secreta Perdida"
 spymaster_task.1101.a:0 "Este mundo pode não ser grande o suficiente para nós dois."
 spymaster_task.1101.abduct:0 "para sequestrar você!"
 spymaster_task.1101.desc_opening:0 "Descobri um plano cruel d[Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstName]"
 spymaster_task.1101.ending:0 "\n\nOs agentes [owner.GetHerHim|U] estão sendo capturados enquanto escrevo isso, mas apesar de [owner.GetFirstName] ter sido impedid[Select_CString( owner.IsFemale, 'a', 'o' )] por enquanto, [owner.GetSheHe] ainda representa uma ameaça para o futuro.\nA menos que tomemos medidas..."
 spymaster_task.1101.exposure_tt:0 "O Plano foi exposto"
 spymaster_task.1101.fallback:0 "contra você!"
 spymaster_task.1101.murder:0 "para assassinar você!"
 spymaster_task.1101.spy_on:0 "para descobrir todos os seus segredos!"
 spymaster_task.2001.a:0 "Por favor, pare de me envergonhar, [councillor.GetFirstNameNoTooltip]."
 spymaster_task.2001.b:0 "O [ROOT.Char.Custom('DefaultPriestTitle')] deve ser culpado de #EMP algo#!."
 spymaster_task.2001.c:0 "Você deveria se juntar à minha corte, [accused_priest.GetFirstNameNoTooltip]."
 spymaster_task.2001.desc:0 "M[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] trouxe o [ROOT.Char.Custom('DefaultPriestTitle')], [accused_priest.GetFirstName], para revelação e julgamento de uma grande conspiração. No entanto, quando o [ROOT.Char.Custom('DefaultPriestTitle')] se recusou a confessar, [councillor.GetTitledFirstName] não tinha absolutamente nenhuma evidência ou apoio para as acusações [councillor.GetHerHim]."
 spymaster_task.2001.t:0 "Acusações Vazias"
 spymaster_task.2002.notification:0 "Reputação de Trama Sórdida"
 spymaster_task.2003.a:0 "Você está completamente perdid[Select_CString( councillor.IsFemale, 'a', 'o' )]?"
 spymaster_task.2003.desc:0 "M[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [councillor.GetCouncilTitle] está incomumente formal ao se aproximar de mim na corte. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], você já considerou que conspirar nas sombras pode não ser a melhor maneira de conseguir o que deseja?\" É uma afirmação surpreendente, mas [Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstName] eventualmente chega ao ponto.\n\n\"Parece que... bem, cada agente na [scheme.GetName] parou de responder às minhas correspondências. É como se nada tivesse acontecido.\""
 spymaster_task.2003.t:0 "Uma Trama Desvendada"
 spymaster_task.2102.a:0 "[councillor_liege.GetFirstNameNoTooltip] ficaria interessad[Select_CString( councillor_liege.IsFemale, 'a', 'o' )] nisso."
 spymaster_task.2102.b:0 "Aquela velha fofoca? [Select_CString( councillor_liege.IsFemale, 'A', 'O' )] [councillor_liege.GetTitleTierName] provavelmente gostaria de ouvir, suponho."
 spymaster_task.2102.c.tt:0 "Você deve estar atent[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ao que [Select_CString( councillor_liege.IsFemale, 'sua senhora feudal', 'seu senhor feudal' )] pode acreditar que você está escondendo del[Select_CString( councillor_liege.IsFemale, 'a', 'e' )]."
 spymaster_task.2102.c:0 "Não há necessidade de compartilhar isso."
 spymaster_task.2102.desc:0 "Manter uma rede de espiões por todo o reino em nome d[Select_CString( councillor_liege.IsFemale, 'a', 'o' )] [councillor_liege.GetTitledFirstName] tem suas vantagens. Com frequência, descubro coisas pelas quais nem estou procurando. Evidências do segredo d[Select_CString( secret_owner.IsFemale, 'a', 'o' )] [secret_owner.GetTitledFirstName], por exemplo..."
 spymaster_task.2102.t:0 "Conhecimento Oculto"
 spymaster_task.2103.notification:0 "[councillor.GetCouncilTitle] Descobre Segredo"
 spymaster_task.3001.a:0 "Você está apenas imaginando coisas!"
 spymaster_task.3001.b:0 "Um mal-entendido infeliz. Isso termina agora."
 spymaster_task.3001.continue_snooping:0 "[councillor.GetFirstNameNoTooltip] continua Espionando"
 spymaster_task.3001.desc:0 "Tornou-se dolorosamente claro que [Select_CString( councillor.IsFemale, 'a sua', 'o seu' )] [councillor.GetCouncilTitle], [councillor.GetTitledFirstName], empregou espiões em minha corte. Não sei o que eles estão procurando, pois meus servos e eu não temos nada a esconder, mas imploro a você, por favor, faça-os parar."
 spymaster_task.3001.opening:0 "[target_character.Custom2('AppropriateGreeting', ROOT.Char)]"
 spymaster_task.3002.a:0 "O que [councillor_liege.GetSheHe] está planejando?"
 spymaster_task.3002.end:0 "No entanto, quando abordei [Select_CString( councillor_liege.IsFemale, 'a', 'o' )] [councillor_liege.GetTitledFirstName] sobre isso, [councillor_liege.GetSheHe] negou tudo!"
 spymaster_task.3002.opening:0 "Enquanto mensagens secretas são passadas em sussurros na corte, é óbvio que os agentes [Select_CString( councillor_liege.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor_liege'))] estão cavando segredos."
 spymaster_task.3002.t:0 "Agentes na Corte"
 spymaster_task.3003.a:0 "Mas por que eles estavam aqui em primeiro lugar?"
 spymaster_task.3003.end:0 "Felizmente, [councillor_liege.GetTitledFirstName] prometeu que as maquinações d[Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetCouncilTitle] chegarão ao fim imediatamente."
 spymaster_task.3004.a:0 "Você deve estar imaginando coisas..."
 spymaster_task.3004.b:0 "Um simples engano, [Select_CString( ROOT.Char.IsFemale, 'minha senhora feudal', 'meu senhor feudal' )], é só isso!"
 spymaster_task.3004.desc:0 "Você realmente achou que os agentes [Select_CString( councillor.IsFemale, 'da sua', 'do seu' )] [councillor.GetCouncilTitle] passariam despercebidos em minha corte para sempre? Exijo que você cesse imediatamente esse comportamento rebelde!"
 spymaster_task.3005.a:0 "[Select_CString( councillor_liege.IsFemale, 'A insolente vilã!', 'O insolente vilão!' )]"
 spymaster_task.3005.end:0 "\n\nNo entanto, quando exigi que eles fossem retirados, [Select_CString( councillor_liege.IsFemale, 'a', 'o' )] [councillor_liege.GetTitleTierName] negou tudo!"
 spymaster_task.3005.opening:0 "Descobri agentes em minha corte, claramente a serviço [Select_CString( councillor_liege.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor_liege'))], [councillor_liege.GetTitledFirstName]!"
 spymaster_task.3006.a:0 "Sussurros sombrios antecedem atos sombrios."
 spymaster_task.3006.end:0 "\n\nQuando ordenados a retirá-los, [Select_CString( councillor_liege.IsFemale, 'a', 'o' )] [councillor_liege.GetTitleTierName] acatou, mas talvez eu precise ficar de olho..."
 spymaster_task.3007.a:0 "Não sei de nenhum espião, [target_character.GetFirstNameNoTooltip]."
 spymaster_task.3007.b:0 "Ah, eles devem ter se perdido a caminho de casa!"
 spymaster_task.3007.desc:0 "Espiões em busca de segredos têm assolado minha corte, e imagine minha surpresa ao descobrir que eles estão a serviço [Select_CString( councillor.IsFemale, 'da sua', 'do seu' )] [councillor.GetCouncilTitle]! Por favor, ponha um fim imediato a esta atrocidade!"
 spymaster_task.3009.end:0 "Quando solicitados a retirá-los, [Select_CString( councillor_liege.IsFemale, 'a', 'o' )] [councillor_liege.GetTitleTierName] acatou, mas talvez eu precise ficar de olho..."
