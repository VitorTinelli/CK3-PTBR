l_spanish:
 chancellor_task.0991_end_desc:0 "A opinião d[Select_CString( target_character.IsFemale, 'a', 'o' )] [target_character.GetTitledFirstNamePossessiveNoTooltip] sobre você não aumentará mais."
 chancellor_task.0991_increase_desc:0 "[target_character.GetTitledFirstNameNoTooltip] ficou impressionado e honrado com o favor que você concedeu a [target_character.GetSheHe]."
 chancellor_task.1001.a:0 "Você deveria estar me arranjando amigos, não inimigos!"
 chancellor_task.1001.desc:0 "De todas as palhaçadas que já presenciei...\n\nNas estúpidas tentativas d[Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstNamePossessive] de melhorar minhas relações com meus vizinhos, meu inútil [councillor.GetCouncilTitle] oficialmente reconheceu a reivindicação d[Select_CString( neighboring_ruler.IsFemale, 'a', 'o' )] [neighboring_ruler.GetTitledFirstNamePossessive] sobre [target_county.GetName]!"
 chancellor_task.1001.message:0 "[councillor.GetTitledFirstName] oficialmente reconheceu sua reivindicação sobre [target_county.GetName]."
 chancellor_task.1001.t:0 "Um Novo Pretendente"
 chancellor_task.1001.title_message:0 "Erro Resulta em Reivindicação"
 chancellor_task.1002.a:0 "Por que você concordaria com isso, [councillor.GetFirstNameNoTooltip]?!"
 chancellor_task.1002.desc:0 "Na tentativa d[Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstNamePossessive] de melhorar minha reputação, meu incompetente [councillor.GetCouncilTitle] concordou com um tratado que #EMP cancela#! partes do meu antigo tratado com [target.GetName]!\n\nDo ponto de vista de [target.GetTitleTierName], [target.GetSheHe] está livre para declarar guerra contra mim, se assim desejar."
 chancellor_task.1002.t:0 "O Fim de uma Paz"
 chancellor_task.1003.a:0 "Isso deve ser algum terrível mal-entendido..."
 chancellor_task.1003.desc:0 "Tenho correspondido com seu [councillor.GetCouncilTitle], [councillor.GetTitledFirstName], e tem sido uma vergonhosa demonstração diplomática. Você não é [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetWomanMan] que eu pensava que fosse!"
 chancellor_task.1003.message:0 "[councillor.GetCouncilTitle] Irrita [Select_CString( neighbor.IsFemale, 'a', 'o' )] [neighbor.GetTitledFirstName]"
 chancellor_task.1003.opening:0 "[neighbor.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 chancellor_task.1102.a:0 "Trabalho incrível, [councillor.GetFirstNameNoTooltip]!"
 chancellor_task.1102.desc:0 "M[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [councillor.GetCouncilTitle], [councillor.GetTitledFirstName], trabalhou duro para convencer nossos reinos vizinhos e vassalos de que o tratado de paz que fiz com [target.GetName] é falho, ilegítimo e injusto comigo!\n\nEstou novamente livre para declarar guerra contra [target.GetSheHe] quando desejar."
 chancellor_task.1102.t:0 "Diplomacia Hábil"
 chancellor_task.1103.a:0 "Sua lábia está afiada hoje, [councillor.GetFirstNameNoTooltip]!"
 chancellor_task.1103.desc:0 "Tenho correspondido com s[Select_CString( councillor.IsFemale, 'ua', 'eu' )] [councillor.GetCouncilTitle], [councillor.GetTitledFirstName], e devo dizer que comecei a enxergá-lo sob uma nova luz.\n\nTalvez você seja alguém que um dia eu me orgulharia de chamar de amigo."
 chancellor_task.1103.message:0 "[councillor.GetCouncilTitle] Impressiona o Vizinho"
 chancellor_task.1103.opening:0 "[neighbor.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 chancellor_task.2001.a:0 "O que você fez, [councillor.GetFirstNameNoTooltip]..."
 chancellor_task.2001.desc:0 "M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] honrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [councillor.Custom2('RelationToMe', ROOT.Char)],\n Enquanto meus esforços para reorganizar [county.GetName] estão progredindo rapidamente, nem todos estão convencidos de seus benefícios.\nParece que pisei nos calos de vários prefeitos e anciãos de aldeias. Cada prefeito e ancião de aldeia, para ser exato."
 chancellor_task.2001.notification:0 "A incompetência do meu [councillor.GetCouncilTitle] fez com que o povo de [county.GetName] perdesse o respeito por mim"
 chancellor_task.2001.t:0 "Resistência Local"
 chancellor_task.2002.a:0 "Você #EMP piorou#! as coisas #EMP ainda mais?!#!"
 chancellor_task.2002.desc:0 "M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] honrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [councillor.Custom2('RelationToMe', ROOT.Char)]...\n\nParece que cometi alguns erros de julgamento. As reformas que introduzi em [county.GetName] pretendiam fortalecer seu domínio na região, mas em vez disso as pessoas mal sabem quem é seu [ROOT.Char.GetTitleTierName]..."
 chancellor_task.2002.notification:0 "Meu [councillor.GetCouncilTitle] está perdendo o controle em [county.GetName]!"
 chancellor_task.2003.a:0 "Você não poderia ser um pouco mais delicado, [councillor.GetFirstNameNoTooltip]?"
 chancellor_task.2003.desc:0 "Saudações, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [baron.Custom2('RelationToMe', ROOT.Char)],\n Devo reclamar sobre o comportamento [Select_CString( councillor.IsFemale, 'da sua', 'do seu' )] [councillor.GetCouncilTitle], [councillor.GetTitledFirstName]!\n [councillor.GetSheHe|U] apareceu em [county.GetName] e começou a mudar as coisas sem pensar, sem levar em consideração nossas tradições ou práticas antigas!"
 chancellor_task.2003.notification:0 "Meu incompetente [councillor.GetCouncilTitle] irritou um dos meus vassalos!"
 chancellor_task.2003.t:0 "Uma Decepção"
 chancellor_task.2103.a:0 "Perfeito. Faça isso!"
 chancellor_task.2103.b:0 "Talvez haja mais coisas que poderíamos aprender com suas práticas?"
 chancellor_task.2103.c:0 "Não, essas coisas levam tempo, e devemos dar a elas o tempo necessário."
 chancellor_task.2103.desc:0 "Nossos esforços de integração em [title.GetName] estão indo muito bem. Na verdade, podemos tentar impor práticas de tributação do [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] em uma escala limitada."
 chancellor_task.2103.opening:0 "[councillor.Custom2('AppropriateGreeting', ROOT.Char)]"
 chancellor_task.3001.a:0 "[councillor.GetFirstNameNoTooltip]! O que você fez?!"
 chancellor_task.3001.desc:0 "Tenho hospedado s[Select_CString( councillor.IsFemale, 'sua', 'seu' )] [councillor.GetCouncilTitle], [councillor.GetTitledFirstName], por algum tempo agora. A forma como [councillor.GetSheHe] se impõe em minha casa, incentivando nada menos que servidão humilhante a você, me causa repulsa!\n\nQue tipo de [ROOT.Char.GetSenhoraSenhor] enviaria um representante tão terrível?"
 chancellor_task.3001.opening:0 "[vassal.Custom2('AppropriateGreeting', ROOT.Char)]"
 chancellor_task.3002.a:0 "Seu tolo!"
 chancellor_task.3002.c:0 "Não, ainda posso resolver isso."
 chancellor_task.3002.d:0 "Oh, acho que não."
 chancellor_task.3002.desc:0 "Parece que, em minhas negociações com [Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstName], eu posso ter... acidentalmente feito certas promessas de isenção de suas obrigações...\n\nEu tentei, mas suspeito que agora não haja outra saída..."
 chancellor_task.3002.opening:0 "[councillor.Custom2('AppropriateGreeting', ROOT.Char)]"
 chancellor_task.3003.a:0 "Sinto que o poder está escapando das minhas mãos."
 chancellor_task.3003.desc:0 "Parece que seja lá o que meu [councillor.GetCouncilTitle] está fazendo - se é que está fazendo algo! - não é o suficiente.\n\nSob a vigilância d[Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetTitledFirstName], meus vassalos agem livremente como bem entendem, raramente buscando minha aprovação em qualquer assunto."
 chancellor_task.3003.notification:0 "[councillor.GetCouncilTitle] Não Consegue Lidar com os Vassalos"
 chancellor_task.3003.t:0 "Perda de Autoridade"
 chancellor_task.3101.a:0 "A qualquer custo, faça-os parar de lutar."
 chancellor_task.3101.b:0 "Eles farão o que eu mandar, como seu [ROOT.Char.GetTitleTierName]!"
 chancellor_task.3101.c.tt:0 "A guerra entre [attacker_vassal.GetFirstNameNoTooltip] e [defender_vassal.GetFirstNameNoTooltip] continua"
 chancellor_task.3101.c:0 "Deixe-os resolver suas diferenças."
 chancellor_task.3101.desc:0 "Com o conflito em curso entre [Select_CString( attacker_vassal.IsFemale, 'a', 'o' )] [attacker_vassal.GetTitledFirstName] e [Select_CString( defender_vassal.IsFemale, 'a', 'o' )] [defender_vassal.GetTitledFirstName], tenho trabalhado incansavelmente para chegar ao cerne da disputa deles. Acredito que, com o estímulo certo, um acordo pode ser alcançado."
 chancellor_task.3101.opening:0 "[active_councillor.Custom2('AppropriateGreeting', ROOT.Char)]"
 chancellor_task.3102.a:0 "Hora de corrigir essa injustiça!"
 chancellor_task.3102.c:0 "Vou deixar passar. Desta vez..."
 chancellor_task.3102.desc:0 "Descobri que o contrato d[Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstName] obriga [vassal.GetSheHe] a mais do que você coletou."
 chancellor_task.3103.a:0 "Sou abençoado por ter servos tão gratos."
 chancellor_task.3103.desc:0 "Tenho hospedado seu [councillor.GetCouncilTitle], [councillor.GetTitledFirstName], por várias semanas, e [councillor.GetSheHe] me ajudou a realmente ver o esplendor do reino sob seu governo.\n\nÉ uma honra servir como seu vassalo!"
 chancellor_task.3104.a:0 "Devemos proteger os direitos dos herdeiros de [vassal.GetFirstNamePossessiveNoTooltip]!"
 chancellor_task.3104.b:0 "As coisas podem ficar como estão. Por um preço..."
 chancellor_task.3104.c:0 "Não há necessidade de fragmentar o reino."
 chancellor_task.3104.desc:0 "Descobri certos contratos antigos relacionados ao [primary_title.GetName]. Poderia ser argumentado que [Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstName] tem a obrigação de ser mais imparcial com sua eventual herança do que se pensava anteriormente."
 chancellor_task_2001.message:0 "$baron_plural_upper_case$ Resistem à Integração"
 chancellor_task_2002.message:0 "Resistência à Integração de [resisting_culture.GetNameNoTooltip]"
 chancellor_task_2101.message:0 "$baron_plural_upper_case$ Apoiam a Integração"
 chancellor_task_2102.message:0 "Apoio de [supporting_culture.GetNameNoTooltip] à Integração"
 chancellor_task_every_county_of_culture_in_title:0 "Todos os Condados [supporting_culture.GetAdjective] em [title.GetNameNoTier]"
