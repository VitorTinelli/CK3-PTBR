l_spanish:
 court_chaplain_task.0201.opening:0 "[councillor.Custom2('AppropriateGreeting', ROOT.Char)]"
 court_chaplain_task.0301.a:0 "Faça isso acontecer!"
 court_chaplain_task.0301.b.tt:0 "Perder todo o progresso de criação de alegação"
 court_chaplain_task.0301.b:0 "Não, não posso."
 court_chaplain_task.0301.desc:0 "Eu revirei documentos antigos e... de procedência menos certa. Finalmente, tenho material suficiente para afirmar que você é [Select_CString( ROOT.Char.IsFemale, 'a legítima', 'o legítimo' )] [ROOT.Char.GetLadyLord] de [county.GetName]!\n\nSó falta um pequeno suborno..."
 court_chaplain_task.0302.a:0 "Apresente minha alegação sobre [county.GetNameNoTierNoTooltip]."
 court_chaplain_task.0302.b:0 "Sim! Todo o [duchy.GetNameNoTierNoTooltip] será meu!"
 court_chaplain_task.0302.desc:0 "Eu revirei documentos antigos e... de procedência menos certa. Finalmente, tenho material suficiente para afirmar que você é [Select_CString( ROOT.Char.IsFemale, 'a legítima', 'o legítimo' )] [ROOT.Char.GetLadyLord] de [county.GetName].\n\nNa verdade, eu poderia até argumentar que você é [Select_CString( ROOT.Char.IsFemale, 'a legítima', 'o legítimo' )] [ROOT.Char.GetLadyLord] de [duchy.GetName]!"
 court_chaplain_task.0302.desc_heretic_addition:0 "Eu revirei documentos antigos e... de procedência menos certa. Finalmente, tenho material suficiente para afirmar que você é [Select_CString( ROOT.Char.IsFemale, 'a legítima', 'o legítimo' )] [ROOT.Char.GetLadyLord] de [county.GetName].\n\nJá que [duchy_holder.GetFirstName] insiste em ser #EMP [duchy_holder.GetFaith.GetAdherentName]#!, eu poderia até argumentar que você tem uma reivindicação sobre o [duchy.GetName] – por direito divino!"
 court_chaplain_task.0311.a:0 "Mentiras e mais mentiras!"
 court_chaplain_task.0311.end:0 "\n\nAgora, [councillor_liege.GetFirstName] ousa agir como se tudo isso fosse uma reivindicação legítima sobre [county.GetName]!"
 court_chaplain_task.0311.opening:0 "Por meses, [councillor.GetTitledFirstName], [Select_CString( councillor.IsFemale, 'a', 'o' )] [councillor.GetCouncilTitle] d[Select_CString( councillor_liege.IsFemale, 'a', 'o' )] [councillor_liege.GetTitledFirstName], tem desenterrado contratos falsos e histórias fabricadas."
 court_chaplain_task.0311.t:0 "Uma Alegação sobre [county.GetNameNoTierNoTooltip]!"
 court_chaplain_task.0312.a:0 "Será que [councillor_liege.GetFirstNameNoTooltip] não tem vergonha na cara?!"
 court_chaplain_task.0313.t:0 "Uma Alegação sobre [county.GetNameNoTierNoTooltip]!"
 court_chaplain_task.1001.notification:0 "Pregando Doutrina Não Ortodoxa"
 court_chaplain_task.1002.notification:0 "Retórica Pobre"
 court_chaplain_task.1101.notification:0 "Retórica Impressionante"
 court_chaplain_task.2001.notification:0 "Resistência à Conversão"
 court_chaplain_task.2002.notification:0 "Resistência Popular à Conversão"
 court_chaplain_task.2101.notification:0 "Conversões Entusiasmadas"
 court_chaplain_task.2102.notification:0 "Estabelecimento de Novas [councillor.GetFaith.HouseOfWorshipPlural|U]"
 court_chaplain_task.2103.notification:0 "Novos Conversos Voluntários"
 court_chaplain_task.3001.a:0 "Como você deixou eles te pegarem?!"
 court_chaplain_task.3001.desc:0 "Meu [councillor.GetCouncilTitle], [councillor.GetFirstName], parece profundamente preocupado quando [councillor.GetSheHe] se aproxima de mim.\n\n\"Veio à luz que estou... investigando a existência de uma reivindicação justa e legítima para você sobre [county.GetName]. É suficiente dizer que muitos de seus vassalos estão chateados que seu [ROOT.Char.GetTitleTierName] ignoraria sua lealdade e agiria contra eles assim.\""
 court_chaplain_task.3001.t:0 "Minando a Ordem"
 court_chaplain_task.3002.notification:0 "Acusado de Fabricação de Alegação"
 court_chaplain_task.3003.a:0 "Eu sei o que estou fazendo, [vassal.GetFirstNameNoTooltip]."
 court_chaplain_task.3003.b:0 "Conheça o seu lugar, [vassal.GetTitledFirstNameNoTooltip]."
 court_chaplain_task.3003.desc:0 "Chamou minha atenção que seu [councillor.GetCouncilTitle], [councillor.GetFirstName], está trabalhando para fabricar uma reivindicação falsa sobre [county.GetName]. Imploro que você se lembre que você é [ROOT.Char.GetTitleTierName] por direito, não por ganância."
 court_chaplain_task.3003.opening:0 "[vassal.Custom2('AppropriateGreeting', ROOT.Char)]"
 court_chaplain_task.3004.a:0 "Oh, mas #EMP há#! uma base para uma reivindicação aqui."
 court_chaplain_task.3004.desc:0 "Tornou-se claro que seu [councillor.GetCouncilTitle] está trabalhando para estabelecer uma reivindicação falsa e espúria sobre [county.GetName]. Não pense que esse tipo de ação desonrosa passará sem resposta."
 court_chaplain_task.3004.opening:0 "[target.Custom2('AppropriateGreeting', ROOT.Char)]"
 court_chaplain_task.4001.a:0 "O caminho nem sempre é claro."
 court_chaplain_task.4001.desc:0 "Após outra sessão de conselho espiritual com meu/minha [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] [councillor.GetTitledFirstName], uma inquietação tomou conta de mim.\n\n[councillor.GetTitledFirstName] fala de fé e devoção, mas eu não consigo realmente #EMP senti-la#!."
 court_chaplain_task.4001.t:0 "Dúvidas à Flor da Pele"
 court_chaplain_task.4101.a:0 "Sou grato(a) pela orientação de [councillor.GetHerHis]."
 court_chaplain_task.4101.desc:0 "\"[ROOT.Char.Custom('RandomRelevantBibleQuote')]\" Meu/Minha [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] [councillor.GetTitledFirstName] declara durante a prece matinal e sinto uma clareza tamanha que quase esqueço como respirar por um momento.\n\nÉ como se as palavras de [councillor.GetHerHis] tivessem aberto uma janela e deixado a luz entrar."
 court_chaplain_task.4101.t:0 "Momento de Clareza"
 court_chaplain_task.4102.a:0 "Suas palavras me honram."
 court_chaplain_task.4102.desc:0 "Ao servi-lo, passei a sentir que nosso amor por [councillor.GetFaith.HighGodName] é o mesmo.\n\nSua fé fortaleceu minha confiança em você como meu [ROOT.Char.GetTitleAsNameNoTooltip|l]."
 court_chaplain_task.4102.opening:0 "[councillor.Custom2('AppropriateGreeting', ROOT.Char)]"
 court_chaplain_task.4103.a.fervor.tt:0 "[ROOT.Char.GetFaith.GetAdjective] [fervor|E] aumenta em [fervor_i][EmptyScope.ScriptValue('passive_fervor_value')|2]"
 court_chaplain_task.4103.a:0 "Esforçar-me-ei para continuar digno."
 court_chaplain_task.4103.desc:0 "Sua dedicação à sua vida espiritual não passou despercebida. Vejo o fogo da fé ardendo com mais intensidade dentro de sua alma."
 court_chaplain_task.4103.opening:0 "[councillor.Custom2('AppropriateGreeting', ROOT.Char)]"
 fervor_gain_spiritual_guidance:0 "[councillor.GetShortUINamePossessive|U] orientação espiritual em direção a [root_scope.GetShortUIName]"
 friend_spiritual_guidance:0 "[TARGET_CHARACTER.GetShortUIName|U] foi comovido pela fé de [CHARACTER.GetShortUINamePossessive] durante seus ensinamentos espirituais."
 friend_spiritual_guidance_corresponding:0 "[CHARACTER.GetShortUIName|U] foi comovido pela fé de [TARGET_CHARACTER.GetShortUINamePossessive] durante seus ensinamentos espirituais."
