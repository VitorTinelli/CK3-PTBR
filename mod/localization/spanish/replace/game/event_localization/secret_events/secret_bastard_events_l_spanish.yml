l_spanish:
 bastardy_pregnancy_announcement_tooltip:0 "O mundo descobre a verdadeira linhagem da criança"
 secret_bastard.0001.a:0 "Se eles soubessem..."
 secret_bastard.0001.assumed_father.multiple:0 "Minha [ROOT.Char.Custom2('RelationToMe', mother)], [mother.GetTitledFirstName], segura seu filhos recém-nascidos no peito. Isso teria sido um momento de alegria se eu não soubesse a verdade.\n\nEssas não são minhas crianças que ela segura, mas sim o fruto da união ilegítima com [real_father.GetTitledFirstName]!"
 secret_bastard.0001.assumed_father:0 "Minha [ROOT.Char.Custom2('RelationToMe', mother)], [mother.GetTitledFirstName], segura seu filho recém-nascido no peito. Isso teria sido um momento de alegria se eu não soubesse a verdade.\n\nA criança que ela segura não é minha, mas sim o fruto da união ilegítima com [real_father.GetTitledFirstName]!"
 secret_bastard.0001.family_of_assumed_father.multiple:0 "A corte [Select_CString( real_father.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('assumed_father'))], [father.GetTitledFirstName], e [Select_CString( mother.IsFemale, 'sua', 'seu' )] [SCOPE.Char.Custom2('RelationToMe', mother)], [mother.GetTitledFirstName], estão celebrando o nascimento de seus novos filhos. O clima poderia ter sido abalado se a verdade fosse amplamente conhecida, no entanto.\n\nOs filhos de [mother.GetFirstNamePossessive] são, na verdade, os bastardos de [real_father.GetTitledFirstName]! Que vergonha traria à nossa casa se a verdadeira linhagem das crianças fosse conhecida..."
 secret_bastard.0001.family_of_assumed_father:0 "A corte [Select_CString( real_father.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('assumed_father'))], [father.GetTitledFirstName], e [mother.GetTitledFirstName], estão celebrando o nascimento de seu novo filho. O clima poderia ter sido abalado se a verdade fosse amplamente conhecida.\n\nO filho de [mother.GetFirstNamePossessive] é, na verdade, o bastardo de [real_father.GetTitledFirstName]! Que vergonha traria à nossa casa se a verdadeira linhagem da criança fosse conhecida..."
 secret_bastard.0001.family_of_mother.multiple:0 "Minha [ROOT.Char.Custom2('RelationToMe', mother)], [mother.GetTitledFirstName], embala seus belos recém-nascidos nos braços. No entanto, não posso deixar de sentir inquietação, sabendo a verdadeira linhagem deles. As crianças não são fruto do casamento de minha [ROOT.Char.Custom2('RelationToMe', mother)] com [assumed_father.GetTitledFirstName], mas sim de uma união ilícita com [real_father.GetTitledFirstName]!\n\nO que acontecerá com [mother.GetSheHe] e as crianças se a verdade for revelada?"
 secret_bastard.0001.family_of_mother:0 "Minha [ROOT.Char.Custom2('RelationToMe', mother)], [mother.GetTitledFirstName], embala seu belo recém-nascido nos braços. No entanto, não posso deixar de sentir inquietação, sabendo a verdadeira linhagem [Select_CString( child.IsFemale, 'da sua', 'do seu' )] [child.Custom('GetDaughterSon')]. A criança não é fruto do casamento de minha [ROOT.Char.Custom2('RelationToMe', mother)] com [assumed_father.GetTitledFirstName], mas sim de uma união ilícita com [real_father.GetTitledFirstName]!\n\nO que acontecerá com [mother.GetSheHe] e m[Select_CString( child.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', child)] se a verdade for revelada?"
 secret_bastard.0001.family_of_real_father.multiple:0 "[mother.GetTitledFirstName] e sua corte estão celebrando o nascimento dos filhos de [assumed_father.GetTitledFirstNamePossessive], mas se a verdade fosse conhecida, as celebrações seriam mais contidas.\n\nOs bebês que [mother.GetFirstName] segura no peito são os filhos bastardos [Select_CString( real_father.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))], [real_father.GetTitledFirstName]!"
 secret_bastard.0001.family_of_real_father:0 "[mother.GetTitledFirstName] e sua corte estão celebrando o nascimento do filho de [assumed_father.GetTitledFirstNamePossessive], mas se a verdade fosse conhecida, as celebrações seriam mais contidas.\n\nO bebê que [mother.GetFirstName] segura no peito é o filho bastardo [Select_CString( real_father.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))], [real_father.GetTitledFirstName]!"
 secret_bastard.0001.other.multiple:0 "As celebrações dos recém-nascidos de [mother.GetTitledFirstNamePossessive] estão apenas começando, mas o clima teria sido bem diferente se a corte [mother.GetHerHim] soubesse a verdade.\n\nAs crianças que [mother.GetSheHe] segura nos braços não são resultado de seu casamento com [assumed_father.GetTitledFirstName], mas sim os frutos ilegítimos de [real_father.GetTitledFirstName]!"
 secret_bastard.0001.other:0 "As celebrações do recém-nascido de [mother.GetTitledFirstNamePossessive] estão apenas começando, mas o clima teria sido bem diferente se a corte [mother.GetHerHim] soubesse a verdade.\n\nA criança que [mother.GetSheHe] segura nos braços não é resultado de seu casamento com [assumed_father.GetTitledFirstName], mas sim o fruto ilegítimo de [real_father.GetTitledFirstName]!"
 secret_bastard.0001.real_father.multiple:0 "O corte de [mother.GetTitledFirstNamePossessive] está celebrando o nascimento dos filhos [mother.GetHerHim], aparentemente sem saber a verdade. As crianças que repousam nos braços [mother.GetHerHim] não são verdadeiramente de [assumed_father.GetTitledFirstNamePossessive], mas sim minhas!"
 secret_bastard.0001.real_father.no_assumed_father.multiple:0 "Por trás da fachada de celebração, rumores estão se espalhando na corte de [mother.GetTitledFirstNamePossessive] após o nascimento dos filhos [mother.GetHerHim]. Se eles soubessem o que eu sei, que os bebês nos braços [mother.GetHerHim] são meus..."
 secret_bastard.0001.real_father.no_assumed_father:0 "Por trás da fachada de celebração, rumores estão se espalhando na corte de [mother.GetTitledFirstNamePossessive] após o nascimento do filho [mother.GetHerHim]. Se eles soubessem o que eu sei, que o bebê nos braços [mother.GetHerHim] é na verdade meu..."
 secret_bastard.0001.real_father:0 "[mother.GetTitledFirstNamePossessive] corte está celebrando o nascimento do filho [mother.GetHerHim], aparentemente sem saber a verdade. A criança que repousa nos braços [mother.GetHerHim] não é verdadeiramente de [assumed_father.GetTitledFirstNamePossessive], mas sim minha!"
 secret_bastard.0001.t:0 "Uma Linhagem Obscura"
 secret_bastard.0002.a:0 "Um escândalo a espera."
 secret_bastard.0002.b:0 "\"Espere! A criança... é minha!\""
 secret_bastard.0002.family_of_mother:0 "M[Select_CString( mother.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', mother)], [mother.GetTitledFirstName], deu à luz a uma criança amaldiçoada a viver como um bastardo sem pai.\n\nIsso traz vergonha à nossa família, mas [real_father.GetTitledFirstName] tem se mostrado relutante em se declarar como o pai do bebê de [mother.GetFirstNamePossessive], se ele sequer souber..."
 secret_bastard.0002.family_of_real_father.dislike:0 "Minhas esperanças não são altas."
 secret_bastard.0002.family_of_real_father:0 "A criança recém-nascida de [mother.GetTitledFirstNamePossessive] é amplamente conhecida como um bastardo sem pai, mas eu sei a verdade. É meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))], [real_father.GetTitledFirstName], quem é o pai da criança que agora repousa em seus braços! Só posso rezar para que [real_father.GetFirstName] saiba o que está fazendo."
 secret_bastard.0002.other:0 "Rumores circulam e acusações sussurradas pairam sobre quem pode ser o pai do recém-nascido bastardo de [mother.GetTitledFirstNamePossessive].\n\nClaro, eles não sabem o que eu sei, que o pai da criança é na verdade [real_father.GetTitledFirstName]!"
 secret_bastard.0002.real_father:0 "[mother.GetTitledFirstName] carrega o fardo de ter dado à luz um bastardo sem pai.\n\nÉ terrível para um[Select_CString( mother.IsFemale, 'a', '' )] [mother.GetWomanMan] solteira e seu filho, mas não posso deixar que saibam que sou o verdadeiro pai.\n\nOh, o que acontecerá com [Select_CString( child.IsFemale, 'minha', 'meu' )] [child.Custom('GetDaughterSon')]..."
 secret_bastard.0002.t:0 "De Origem Incerta"
 secret_bastard.001.opening:0 "Minha [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('mother'))] [mother.GetTitledFirstName] tem mostrado sinais de gravidez há algum tempo,"
 secret_bastard.0010.a:0 "Eu temo pelo nosso futuro!"
 secret_bastard.0010.desc:0 "\n\nO que será de mim e do meu filho agora que todos sabem que [real_father.GetTitledFirstName] é o verdadeiro pai?"
 secret_bastard.0010.other_reveal:0 "Meu segredo cuidadosamente guardado foi exposto pela [secret_exposer.GetTitledFirstName]! Minha família hesita em falar comigo, e [father.GetFirstName] se recusa a olhar nos meus olhos."
 secret_bastard.0010.spouse_reveal:0 "Meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('father'))] descobriu a verdadeira natureza do meu filho, e agora [father.GetSheHe] revelou a verdade ao mundo!"
 secret_bastard.0010.t:0 "Exposto"
 secret_bastard.0011.a:0 "Como ela pôde?"
 secret_bastard.0011.b:0 "Pensar que [mother.GetSheHe] uma vez fez votos de lealdade."
 secret_bastard.0011.desc:0 "e eu nunca realmente pensei que a criança pudesse pertencer a outra pessoa senão a mim.\n\nNo entanto, [mother.GetSheHe] agora confessou abertamente ao mundo que compartilhou uma cama com [real_father.GetTitledFirstName], e que ele é o verdadeiro pai!"
 secret_bastard.0011.spouse_exposer:0 "e é hora de que o mundo saiba a verdade. [mother.GetSheHe|U] compartilhou uma cama com [real_father.GetTitledFirstName], e [real_father.GetSheHe] é o verdadeiro pai!"
 secret_bastard.0011.t:0 "A Mancha da Bastardia"
 secret_bastard.0012.a:0 "Agora todos sabem."
 secret_bastard.0012.dislike_desc:0 "e todos pensavam que seu [mother.Custom2('RelationToMe', SCOPE.sC('father'))], [father.GetTitledFirstName], era o pai da criança. Agora ficou claro que o verdadeiro pai é ninguém menos que [real_father.GetTitledFirstName]!\n\nOh, meu Deus, que escândalo!"
 secret_bastard.0012.like_desc:0 "e todos pensavam que seu [mother.Custom2('RelationToMe', SCOPE.sC('father'))], [father.GetTitledFirstName], era o pai da criança. Agora ficou claro que o verdadeiro pai é ninguém menos que [real_father.GetTitledFirstName]!\n\nSe ao menos pudesse ter permanecido em segredo!"
 secret_bastard.0012.t:0 "O Escândalo"
 secret_bastard.0013.a:0 "É melhor assim, com certeza."
 secret_bastard.0013.desc:0 "Minhas aventuras com [mother.GetTitledFirstName] resultaram em uma criança!"
 secret_bastard.0013.secret_exposer:0 "Eu tive que deixar claro, por toda parte. A criança que [mother.GetTitledFirstName] carrega é minha!\n\nAgora todos sabem."
 secret_bastard.0013.suspicious_desc:0 "e minhas suspeitas de que eu sou o pai da criança cresceram em conjunto com a barriga dela.\n\nAgora eu sei com certeza, assim como o resto do reino. A criança é minha!"
 secret_bastard.0013.t:0 "Este Filho Meu"
 secret_bastard.0014.a:0 "Como você pôde fazer isso, [real_father.GetFirstNameNoTooltip]?"
 secret_bastard.0014.desc:0 "mas eu nunca pensei que meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] poderia ter algo a ver com isso. No entanto, agora está claro que [real_father.GetFirstName] é o verdadeiro pai do bebê não nascido de [mother.GetFirstNamePossessive]!"
 secret_bastard.0014.t:0 "Sinais de Traição"
 secret_bastard.1000.a.tt:0 "[real_father.GetShortUINameNoTooltip] será conhecido como o pai do meu filho quando ele nascer"
 secret_bastard.1000.a:0 "Agora a verdade veio à tona."
 secret_bastard.1000.desc:0 "Nada de mais segredos ou tentativas de encobrir a verdade!\n\nAgora é amplamente conhecido que a criança que cresce dentro de mim é gerada por ninguém menos que [real_father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]."
 secret_bastard.1000.real_father_reveal:0 "Nada de mais segredos ou tentativas de encobrir a verdade!\n\n[real_father.Custom2('MyCharacterIntroduction', ROOT.Char)|U] fez saber que [real_father.GetSheHe] é o pai do meu bebê por nascer."
 secret_bastard.1000.t:0 "Linhagem Conhecida"
 secret_bastard.1001.a:0 "Como ele pôde colocar minha [ROOT.Char.Custom2('RelationToMe', mother)] nessa posição?"
 secret_bastard.1001.desc:0 "Que minha [ROOT.Char.Custom2('RelationToMe', mother)], [mother.GetTitledFirstName], está carregando uma criança concebida através de uma união pecaminosa não é segredo, [mother.GetSheHe] afinal de contas não é uma [mother.GetWomanMan] casada.\n\nNo entanto, descobrir que [real_father.GetTitledFirstName] é [Select_CString( real_father.IsFemale, 'a', 'o' )] [real_father.GetMotherFather] da criança..."
 secret_bastard.1001.t:0 "A Linhagem de um Neto"
 secret_bastard.1002.desc:0 "Não é segredo que minha [ROOT.Char.Custom2('RelationToMe', mother)] [mother.GetTitledFirstName] está carregando uma criança concebida através de uma união pecaminosa, [mother.GetSheHe] afinal de contas não é uma [mother.GetWomanMan] casada.\n\nNo entanto, quem é [real_father.GetMotherFather] ou a criança tem sido um mistério até agora – [real_father.GetTitledFirstName] é o responsável!"
 secret_bastard.1002.t:0 "Fora do Casamento"
 secret_bastard.1003.desc:0 "Que minha [ROOT.GetCharacter.Custom2('RelationToMe', mother)] [mother.GetTitledFirstName] está carregando meu filho agora é conhecido por todos.\n\nQue nossa aventura poderia levar a isso era uma possibilidade que eu estava ciente, mas enfrentar a realidade disso..."
 secret_bastard.1003.t:0 "[mother.GetFirstNameNoTooltip] e Eu"
 secret_bastard.1004.desc:0 "[mother.GetTitledFirstName] carregou uma criança de linhagem desconhecida por um tempo, mas eu nunca pensei que meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))], [real_father.GetTitledFirstName], pudesse ter algo a ver com isso.\n\nMas agora, não há mais sombra de dúvida, é de fato [real_father.GetSheHe] que é o pai!"
 secret_bastard.2000.a:0 "O que acontecerá com [Select_CString( child.IsFemale, 'a minha', 'o meu' )] [child.Custom('GetDaughterSon')]?"
 secret_bastard.2000.desc:0 "\n\nEu mantive a verdadeira linhagem [Select_CString( child.IsFemale, 'da minha', 'do meu' )] [child.Custom('GetDaughterSon')] [child.GetTitledFirstName] em segredo desde antes de [child.GetSheHe] nascer. No entanto, meu caso com [real_father.GetTitledFirstName], o verdadeiro pai [child.GetHerHim], agora é amplamente conhecido!"
 secret_bastard.2000.desc_opening.me:0 "Finalmente é hora do mundo saber."
 secret_bastard.2000.desc_opening:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] revelou meu segredo ao mundo!"
 secret_bastard.2000.t:0 "A Verdade é Conhecida"
 secret_bastard.2001.a:0 "É melhor assim."
 secret_bastard.2001.b:0 "É preciso que seja conhecido."
 secret_bastard.2001.change_lineage.twin:0 "\n\nÉ uma pena que tenha chegado a isso, mas é preciso que seja conhecido que eles são bastardos da Casa [child.GetHouse.GetBaseName]."
 secret_bastard.2001.change_lineage:0 "\n\nÉ uma pena que tenha chegado a isso, mas é preciso que seja conhecido que [child.GetSheHe] é um bastardo da Casa [child.GetHouse.GetBaseName]."
 secret_bastard.2001.change_lineage_lowborn.twin:0 "\n\nÉ uma pena que tenha chegado a isso, mas é preciso que seja conhecido que eles são bastardos plebeus."
 secret_bastard.2001.change_lineage_lowborn:0 "\n\nÉ uma pena que tenha chegado a isso, mas é preciso que seja conhecido que [child.GetSheHe] é um bastardo plebeu."
 secret_bastard.2001.desc:0 "[child.GetFirstName] não é meu filho verdadeiro."
 secret_bastard.2001.desc_opening.me:0 "Revelei minhas evidências de que"
 secret_bastard.2001.father:0 "Na verdade, é [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)] que é o verdadeiro pai [child.GetHerHim]!"
 secret_bastard.2001.keep_lineage.twin:0 "\n\nEmbora seja impossível saber a verdade, a linhagem deles sempre estará envolta em rumores e incertezas."
 secret_bastard.2001.keep_lineage:0 "\n\nEmbora seja impossível saber a verdade, a linhagem [child.GetHerHim] sempre estará envolta em rumores e incertezas."
 secret_bastard.2001.t:0 "A Verdade"
 secret_bastard.2002.a:0 "O segredo foi revelado!"
 secret_bastard.2002.assumed_father_exists:0 "\n\nHá aqueles que sempre afirmarão que [child.GetSheHe] é [father.GetTitledFirstNamePossessive] filho legítimo, mas não há nada que possam fazer para dissipar a sombra de dúvida."
 secret_bastard.2002.b:0 "Oh, [child.GetFirstNameNoTooltip]..."
 secret_bastard.2002.i_am_exposer:0 "Deixei saber que [child.GetTitledFirstName] é, na verdade, meu filho! Isso significa que também confessei minhas indiscrições com [mother.GetTitledFirstName], mas a verdade precisa ser conhecida."
 secret_bastard.2002.known:0 "\n\nAs repercussões sobre [child.GetFirstNameNoTooltip] podem ser terríveis; uma vida de linhagem incerta não é fácil."
 secret_bastard.2002.not_known:0 "\n\nClaro que eu sabia que minhas aventuras poderiam resultar em filhos, mas eu não tinha ideia... Como ela não me contou isso antes?!"
 secret_bastard.2002.other_exposer:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] revelou que [child.GetTitledFirstName] é meu filho! Com isso, todos agora sabem das minhas indiscrições com [mother.GetTitledFirstName]!"
 secret_bastard.2002.t:0 "Um Segredo Revelado"
 secret_bastard.2003.a:0 "Que desastre!"
 secret_bastard.2003.desc_ending_exposer:0 "\n\nEu não posso acreditar que meu pai— que [father.GetTitledFirstName] revelaria esse segredo para todos!"
 secret_bastard.2003.desc_ending_known:0 "\n\nMinha vida nunca mais será a mesma!"
 secret_bastard.2003.desc_ending_not_known:0 "\n\nPensar que minha [mother.Custom('MotherFather')] faria algo assim comigo!"
 secret_bastard.2003.i_exposed:0 "Finalmente é hora de deixar a verdade ser conhecida."
 secret_bastard.2003.known:0 "O fato de que [real_father.GetTitledFirstName] é meu verdadeiro pai, e não [father.GetTitledFirstName] como [Select_CString( mother.IsFemale, 'minha', 'meu' )] [mother.Custom('MotherFather')] faria todos acreditar, é agora conhecido por todos."
 secret_bastard.2003.not_known:0 "Eu sou um bastardo?! [father.GetTitledFirstName], [Select_CString( father.IsFemale, 'a', 'o' )] [father.GetWomanMan] que cresci achando que era meu pai, não tem relação comigo de jeito nenhum! [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] revelou que meu verdadeiro [father.Custom('MotherFather')] é aparentemente [real_father.GetTitledFirstName], e minha [mother.Custom('MotherFather')] [mother.GetTitledFirstName] nem sequer me contou."
 secret_bastard.2003.other_exposer:0 "O segredo que carreguei comigo por tanto tempo agora foi exposto por [secret_exposer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]."
 secret_bastard.2003.t:0 "Um Segredo Obscuro"
 secret_bastard.2004.a:0 "Pobre [child.GetTitledFirstNameNoTooltip]!"
 secret_bastard.2004.b:0 "Imagine a vergonha que [child.GetFirstNameNoTooltip] deve estar sentindo!"
 secret_bastard.2004.c:0 "Pobre [child.GetFirstNameNoTooltip] e [child_twin.GetFirstNameNoTooltip]!"
 secret_bastard.2004.d:0 "Imagine a vergonha que eles devem estar sentindo!"
 secret_bastard.2004.dislikes:0 "A verdade finalmente veio à tona!\n\nQue [child.GetTitledFirstName] é o resultado de uma união pecaminosa entre [real_father.GetTitledFirstName] e [mother.GetTitledFirstName] é tudo sobre o que todos na corte sussurram.\n\n[child.GetSheHe|U] sempre agiu de maneira inadequada para uma criança legítima, e agora [child.GetSheHe] finalmente será tratado de acordo com seu status."
 secret_bastard.2004.likes:0 "Que [child.GetTitledFirstName] é [Select_CString( child.IsFemale, 'a', 'o' )] filh[Select_CString( child.IsFemale, 'a', 'o' )] ilegítim[Select_CString( child.IsFemale, 'a', 'o' )] de [mother.GetTitledFirstName] e [real_father.GetTitledFirstName] é um segredo do qual eu estava ciente, mas agora todos também estão!\n\nÉ difícil acreditar que [child.GetTitledFirstName] é o resultado de uma união tão vergonhosa. Só posso esperar que a catarse de uma verdade revelada faça bem a [child.GetSheHe]."
 secret_bastard.2004.t:0 "Uma Linhagem Confusa"
 secret_bastard.2005.a:0 "[mother.GetSheHe|U] é infiel!"
 secret_bastard.2005.alive:0 "[child.GetTitledFirstName] é [Select_CString( child.IsFemale, 'a', 'o' )] filh[Select_CString( child.IsFemale, 'a', 'o' )] ilegítim[Select_CString( child.IsFemale, 'a', 'o' )] da minha [ROOT.Char.Custom2('RelationToMe', mother)] [mother.GetTitledFirstName] e [real_father.GetTitledFirstName]!\n\nPensar que [mother.GetSheHe] agiu de maneira tão vergonhosa em relação a [father.GetTitledFirstName], indo às escondidas e cometendo adultério."
 secret_bastard.2005.dead:0 "[child.GetTitledFirstName] é [Select_CString( child.IsFemale, 'a', 'o' )] filh[Select_CString( child.IsFemale, 'a', 'o' )] ilegítim[Select_CString( child.IsFemale, 'a', 'o' )] da minha [ROOT.Char.Custom2('RelationToMe', mother)] [mother.GetTitledFirstName] e [real_father.GetTitledFirstName]!\n\nPensar que o falecido [father.GetTitledFirstName] foi enganado de maneira tão vil por [mother.GetTitledFirstName]."
 secret_bastard.2005.end:0 "\n\nComo eu sou suposto a confiar n[mother.GetSheHe] novamente?"
 secret_bastard.2005.t:0 "Um Segredo Revelado"
 secret_bastard.3000.a:0 "Agora todos também sabem!"
 secret_bastard.3000.b:0 "Isso é um desastre!"
 secret_bastard.3000.known:0 "O segredo de que [child.GetTitledFirstName] é meu filho agora está na boca de todos!\n\nEu já sabia que [child.GetFirstNameNoTooltip] era o resultado das minhas aventuras com [mother.GetTitledFirstName], mas as repercussões para [child.GetFirstNameNoTooltip] podem ser terríveis. Viver a vida como um bastardo não é algo fácil."
 secret_bastard.3000.married_known:0 "\"Você tem um bastardo?!\"\nMinha esposa me confrontou com um fato chocante, e eu não tinha uma boa resposta para dar.\n\nEu já sabia que [child.GetTitledFirstName] era o resultado das minhas aventuras com [mother.GetTitledFirstName], mas que a verdadeira linhagem de [child.GetTitledFirstName] agora é conhecida foi uma surpresa. O que devo fazer?"
 secret_bastard.3000.married_not_known:0 "\"Você tem um bastardo?!\"\nMinha esposa me confrontou com um fato chocante, e eu não tinha uma boa resposta para dar.\n\nEu me sinto tão surpreso quanto qualquer um, mesmo que eu, é claro, soubesse que havia um risco de isso acontecer. Mas para [mother.GetTitledFirstName] não me contar sobre a verdadeira linhagem de [child.GetTitledFirstName] antes... O que devo fazer?"
 secret_bastard.3000.not_known:0 "O segredo de que [child.GetTitledFirstName] é meu filho agora está na boca de todos!\n\nMesmo que eu me sinta tão surpreso quanto qualquer um, é claro que eu sabia que havia um risco de isso acontecer. Mas para ela não me contar antes..."
 secret_bastard.3000.t:0 "Um Segredo Revelado"
 secret_bastard.3001.a:0 "Agora a verdade é conhecida!"
 secret_bastard.3001.b:0 "Finalmente sei quem é meu pai!"
 secret_bastard.3001.incest_marriage:0 "[real_father.GetTitledFirstName] é meu [real_father.Custom('MotherFather')]!\n\nSaber a verdade é um grande alívio, mas isso traz... complicações. [Select_CString( incest_spouse.IsFemale, 'Minha', 'Meu' )] [incest_spouse.Custom('WifeHusband')], [incest_spouse.GetTitledFirstName], é [Select_CString( incest_spouse.IsFemale, 'a', 'o' )] [real_father.Custom2('RelationToMe', SCOPE.sC('incest_spouse'))] de [real_father.GetFirstName] – o que significa que [incest_spouse.GetSheHe] também é [Select_CString( incest_spouse.IsFemale, 'minha', 'meu' )] [incest_spouse.Custom('SisterBrother')]!"
 secret_bastard.3001.known:0 "O fato de eu ter nascido fora dos laços do casamento tem me assombrado a vida toda. Saber que [real_father.GetTitledFirstName] é meu pai, mas nunca falar sobre isso, tem sido um fardo pesado de suportar.\n\nAgora que o segredo foi revelado, sinto um alívio!"
 secret_bastard.3001.not_known:0 "O fato de eu ter nascido fora dos laços do casamento me assombrou desde o meu nascimento. Tenho sido excluído e ridicularizado, mas minha mãe se recusou a revelar minha verdadeira herança, não importa o quanto eu implorei.\n\n\"É melhor nunca falar dessas coisas.\"\n\nAgora que sei a verdade, posso finalmente respirar mais aliviado, o conhecimento de que [real_father.GetTitledFirstName] é meu pai me concedendo uma tranquilidade que há muito me escapava."
 secret_bastard.3001.t:0 "Minha Verdadeira Herança"
