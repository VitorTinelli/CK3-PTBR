 secret_exposed_notification_effect_message_witch.i_exposed:0 "Você expôs a bruxaria de [owner.GetTitledFirstNamePossessive]!"
 secret_exposed_notification_effect_message_witch:0 "A bruxaria de [owner.GetTitledFirstNamePossessive] foi exposta por [secret_exposer.GetTitledFirstName]!"
 secrets.0001.a:0 "Como vou viver com essa vergonha?"
 secrets.0001.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] revelou meu segredo para o mundo ver!\n\nMinha luxúria antinatural e desejos incontroláveis são amplamente conhecidos e aceitos como fato!"
 secrets.0001.t:0 "Meu Segredo Exposto!"
 secrets.0003.a:0 "Se eu apenas tivesse a chance de explicar, eu... eu..."
 secrets.0003.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me denunciou publicamente como alguém que se deita com outr[Select_CString( ROOT.Char.IsFemale, 'as', 'os' )] [ROOT.Char.GetWomenMen]! Por mais que eu possa afirmar que é um mal-entendido, os [ROOT.Char.Custom('DefaultPriestTitlePlural')] me consideram um pecador aos olhos de [ROOT.Char.GetFaith.HighGodName]."
 secrets.0004.a:0 "Minha reputação está em frangalhos!"
 secrets.0004.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me denunciou por ser um ghoul que aprecia o sabor da carne humana! [secret_exposer.GetSheHe|U] não poderia entender do que [secret_exposer.GetSheHe] está falando, mas todos parecem acreditar nos rumores como verdadeiros."
 secrets.0005.a:0 "O que há de tão errado em pensar por mim mesmo?!"
 secrets.0005.desc:0 "Ao contar a todos os meus pensamentos sobre [ROOT.Char.GetFaith.HighGodName], [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)] convenceu os [ROOT.Char.Custom('DefaultPriestTitlePlural')] de que sou um descrente, e um traidor de [ROOT.Char.GetFaith.HighGodNameAlternate]!"
 secrets.0006.a:0 "Quem são eles para dizer o que é verdadeiro amor?!"
 secrets.0006.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] espalhou rumores sujos sobre relações carnais entre mim e um parente não nomeado! As pessoas parecem muito ansiosas para acreditar n[secret_exposer.GetSheHe], também!"
 secrets.0007.a:0 "Eles não veem a verdade que vejo?"
 secrets.0007.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] denunciou minhas práticas como ímpias e imperdoáveis! As pessoas agora me rotulam como uma bruxa e inimiga de [ROOT.Char.GetFaith.HighGodName]!"
 secrets.0008.a:0 "Quem são eles para julgar?!"
 secrets.0008.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] revelou que estou tendo um relacionamento secreto com [secret_exposer.GetSheHe]! Com a verdade se espalhando como fogo, nossa paixão pode não ter sido tão escondida quanto gostaríamos de acreditar."
 secrets.0008.forbidden.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] expôs meu relacionamento com [secret_exposer.GetSheHe] para o mundo!\n\nEnquanto eles apontam os dedos e gritam seus insultos, não sinto vergonha. Eu menti apenas para manter m[Select_CString( target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))] segur[Select_CString( target.IsFemale, 'a', 'o' )]. O que sinto, no entanto, é medo... O que acontecerá conosco agora?"
 secrets.0101.b:0 "[owner.GetFirstNameNoTooltip] responderá por seus crimes. Guardas!"
 secrets.0101.negative.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] acusou [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] de ser um devasso sexual! Os detalhes do relato são chocantemente vis!"
 secrets.0101.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] acusou publicamente [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] de ser um devasso sexual!"
 secrets.0101.positive_2.desc:0 "\n\nNão entendo qual é o alvoroço. A luxúria não é uma aflição antinatural..."
 secrets.0101.worried.desc:0 "\n\nDevo conter meus desejos para que eles não me dominem. Quem sabe onde apontarão os dedos a seguir..."
 secrets.0103.b:0 "Guardas! Coloquem est[Select_CString( owner.IsFemale, 'a', 'e' )] [owner.GetWomanMan] em correntes!"
 secrets.0103.dislikes_negative:0 "[ROOT.Char.GetFaith.HighGodName] o julgará!"
 secrets.0103.negative.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] acusou [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] de ter relações carnais com outr[Select_CString( owner.IsFemale, 'as', 'os' )] [owner.GetWomenMen]! Isso não pode ser o que [ROOT.Char.GetFaith.HighGodNameAlternate] pretendia!"
 secrets.0103.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] acusou publicamente [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] de sodomia!"
 secrets.0103.positive_2.desc:0 "\n\nA julgar pelos insultos vis de [secret_exposer.GetTitledFirstNamePossessiveNoTooltip], [secret_exposer.GetSheHe] pensa que [owner.GetTitledFirstNameNoTooltip] é [ROOT.Char.GetFaith.DevilName] [ROOT.Char.GetFaith.DevilHerselfHimself]. Mas como pode o amor estar errado?"
 secrets.0103.worried_2.desc:0 "\n\nDevo ter cuidado ao redor de [lover.GetFirstName], pelo seu bem, assim como pelo meu próprio. Quem sabe onde apontarão os dedos a seguir..."
 secrets.0103.worried_3.desc:0 "Alguma vez poderemos amar livremente, sem medo?"
 secrets.0104.b:0 "Este ghoul pagará por seus crimes. Guardas!"
 secrets.0104.dislikes_negative:0 "Você me enoja, [owner.GetFirstNameNoTooltip]!"
 secrets.0104.negative.desc:0 "A bile sobe em minha garganta ao pensar nas acusações que [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)] trouxe à tona. [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U], um canibal! Não consigo dissipar as imagens grotescas da minha mente..."
 secrets.0104.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] acusou publicamente [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] de ser um canibal!"
 secrets.0104.positive_2.desc:0 "Será que ele não entende como [ROOT.Char.GetFaith.HighGodName] se deleita com nosso banquete?"
 secrets.0104.worried.desc:0 "Devo ter cuidado. Se eu não conter minha fome, posso ser o próximo..."
 secrets.0105.dislikes_negative:0 "Será que [owner.GetSheHe] não tem vergonha?!"
 secrets.0105.likes_positive:0 "O que há de tão ruim em pensar por si mesmo?"
 secrets.0105.negative.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] acusou [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] de ser um descrente! Um traidor de [owner.GetFaith.HighGodName]! Quem é [owner.GetSheHe] para questionar [owner.GetFaith.HighGodNameAlternate]?"
 secrets.0105.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] acusou publicamente [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] de ser um descrente!"
 secrets.0105.positive_2.desc:0 "A irracionalidade de [secret_exposer.GetFirstNamePossessiveNoTooltip] é embaraçosa. Que mal [owner.GetFirstNameNoTooltip] causou?"
 secrets.0105.worried.desc:0 "Daqui para frente, devo escolher minhas palavras com cuidado, ou posso ser o próximo..."
 secrets.0106.dislikes_negative:0 "Nojento! Totalmente nojento!"
 secrets.0106.dislikes_positive:0 "Não temos coisas mais importantes a cuidar?"
 secrets.0106.likes_negative:0 "Nunca... Nunca teria pensado!"
 secrets.0106.likes_positive:0 "Essa perseguição não está certa!"
 secrets.0106.negative.desc:0 "Por [ROOT.Char.GetFaith.HighGodName]! [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] apresentou provas irrefutáveis ao reino de que [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] se envolveu em perversões incestuosas!"
 secrets.0106.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] acusou publicamente [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] de ter relações incestuosas!"
 secrets.0106.positive_2.desc:0 "Mas o amor entre parentes não é tão natural quanto respirar?"
 secrets.0106.t:0 "Um Segredo Exposto!"
 secrets.0106.victim.desc:0 "Pelo [ROOT.Char.GetFaith.HighGodName], [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] apresentou provas irrefutáveis de uma tentativa de assassinato contra #EMP mim#!! [Select_CString( murderer.IsFemale, 'A', 'O' )] [murderer.Custom2('InsultNoun', ROOT.Char)] por trás do plano é ninguém menos que [murderer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\nConfie em minhas palavras, [murderer.GetSheHe] vai se arrepender do seu fracasso."
 secrets.0106.victim_knows.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] acusou publicamente [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] de tentar tirar minha vida. Por mais que [murderer.GetSheHe] tente explicar ou esconder, as provas estão lá para todos verem."
 secrets.0106.worried.desc:0 "\n\n[owner.GetTitledFirstNamePossessiveNoTooltip] sofrimento é evidente, mas sou forçado a reprimir meu conforto. Juro que seus olhos me seguem onde quer que eu vá..."
 secrets.0107.b:0 "A bruxa pagará pelos seus crimes!"
 secrets.0107.c:0 "Essas acusações não passam de malícia e mentiras."
 secrets.0107.dislikes_negative:0 "Queimem a bruxa!"
 secrets.0107.negative.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] acusou [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] de ser uma bruxa! [Select_CString( owner.IsFemale, 'A', 'O' )] [owner.GetWomanMan] pervers[Select_CString( owner.IsFemale, 'a', 'o' )] está confraternizando com [ROOT.Char.GetFaith.DevilName] para envenenar nossas mentes e nos afastar de [ROOT.Char.GetFaith.HighGodName]!"
 secrets.0107.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] acusou publicamente [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] de bruxaria!"
 secrets.0107.positive_2.desc:0 "Est[Select_CString( owner.IsFemale, 'a', 'e' )] [secret_exposer.GetWomanMan] tol[Select_CString( owner.IsFemale, 'a', 'o' )] tagarela sobre \"[secret_exposer.GetFaith.DevilName].\" Será que [secret_exposer.GetSheHe] é cego para a sabedoria de [owner.GetTitledFirstNamePossessiveNoTooltip]?"
 secrets.0107.worried.desc:0 "\n\nQuero falar, mostrar a todos a verdade, mas eles ouviriam? Se o fizesse, temo que se voltassem contra mim em seguida..."
 secrets.0108.adulterer_bad.desc:0 "um caso extraconjugal com [SCOPE.Custom('SecretRevealSecondCharacterIntroduction')]! Como [primary_character.GetSheHe] pôde profanar a santidade de seu casamento?"
 secrets.0108.all_is_good.desc:0 "um caso com [SCOPE.Custom('SecretRevealSecondCharacterIntroduction')].\n\nNão vejo qual é o alarde. Não é como se o desejo fosse um afligimento antinatural..."
 secrets.0108.b:0 "Esse crime não pode ficar impune. Guardas!"
 secrets.0108.dislikes_negative:0 "[ROOT.Char.GetFaith.HighGodName] irá julgá-los!"
 secrets.0108.exposer.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] acusou [Select_CString( primary_character.IsFemale, 'sua', 'seu' )] [secret_exposer.Custom2('RelationToMeShort', primary_character)], [primary_character.GetTitledFirstName], de ter"
 secrets.0108.fornicator_bad.desc:0 "copulado com [SCOPE.Custom('SecretRevealSecondCharacterIntroduction')]! Tais coisas não podem ser aceitas fora do casamento!"
 secrets.0108.incest_bad.desc:0 "um relacionamento incestuoso com [Select_CString( secondary_character.IsFemale, 'sua própria', 'seu próprio' )] #EMP [primary_character.Custom2('RelationToMeShort', SCOPE.sC('secondary_character'))]#!! [primary_character.GetFirstNameNoTooltip] e [secondary_character.GetTitledFirstName] são amantes!\n\nJá vi e ouvi muitas coisas em minha vida, mas isso..."
 secrets.0108.incest_is_good.desc:0 "um caso com [secondary_character.Custom2('HerHisCharacterIntroductionNoComma', primary_character)]. Há muitos que os julgam, mas sei que não há nada prejudicial no que [primary_character.GetFirstNameNoTooltip] e [secondary_character.GetFirstNameNoTooltip] compartilham..."
 secrets.0108.no_exposer.desc:0 "Uma verdade secreta veio à luz do dia. M[Select_CString( primary_character.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', primary_character)] [primary_character.GetTitledFirstName] tem"
 secrets.0108.sodomy_bad.desc:0 "cometido sodomia junto com [SCOPE.Custom('SecretRevealSecondCharacterIntroduction')]! Isso não pode ser o que [ROOT.Char.GetFaith.HighGodNameAlternate] pretendia!"
 secrets.0110.a.incest:0 "Acho que vou vomitar."
 secrets.0110.a:0 "Estou sem palavras!"
 secrets.0110.are_not_fathers.desc:0 "os filhos de [father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], mas sim que eles foram gerados por"
 secrets.0110.b.failure.desc:0 "[consort_bastard_parent_lover.GetTitledFirstNameNoTooltip] não é amante de [consort_bastard_parent.GetTitledFirstNamePossessiveNoTooltip]"
 secrets.0110.b.success.desc:0 "Minhas suspeitas estão corretas"
 secrets.0110.b.success.tt:0 "O Segredo de [consort_bastard_parent.GetTitledFirstNamePossessive] é revelado para mim"
 secrets.0110.b:0 "Você ainda está se encontrando com [consort_bastard_parent_lover.GetSheHe], não está?!"
 secrets.0110.c:0 "Eu quase gostaria de nunca ter sabido..."
 secrets.0110.father.child_above_cutoff:0 "\n\nNão há como provar indiscutivelmente qualquer coisa disso, mas tudo está começando a fazer sentido..."
 secrets.0110.father_knew.desc:0 "\n\nMesmo que seja uma ferida antiga, ainda me dói ser lembrado da infidelidade de [mother.GetFirstName]. E agora, devo carregar minha vergonha para que todos vejam."
 secrets.0110.father_love.desc:0 "\n\nOh, [mother.GetFirstName], como você pôde? Eu a amei, e [Select_CString( child.IsFemale, 'a nossa', 'o nosso' )] [child.Custom('GetDaughterSon')]... [Select_CString( child.IsFemale, 'a sua', 'o seu' )] [child.Custom('GetDaughterSon')]. Num único golpe devastador, vocês dois foram tirados de mim."
 secrets.0110.father_no_love.desc:0 "\n\nMil luas podem passar, mas nunca esquecerei a traição de [mother.GetFirstName]. Talvez eu venha a confiar n[mother.GetSheHe] novamente, mas hoje não é o dia."
 secrets.0110.general_end.desc:0 "\n\n[child.GetFirstNameNoTooltip] não tem culpa, mas as consequências para [child.GetSheHe] podem ser graves. [real_father.GetTitledFirstNameNoTooltip] e [mother.GetTitledFirstName], por outro lado..."
 secrets.0110.incest_consort.desc:0 "\n\nA realização me atinge como um martelo. Oh, querido [ROOT.Char.GetFaith.HighGodName], [consort_bastard.GetFirstNameNoTooltip] é m[Select_CString( consort_bastard.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('CloseOrExtendedFamilyRelationToMe', SCOPE.sC('consort_bastard'))]. Todo esse tempo... as coisas que fizemos..."
 secrets.0110.incest_consort_accepted.desc:0 "\n\nPelo [ROOT.Char.GetFaith.HighGodName], isso significa que [consort_bastard.GetFirstNameNoTooltip] é m[Select_CString( consort_bastard.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('CloseOrExtendedFamilyRelationToMe', SCOPE.sC('consort_bastard'))]! Eu sabia que havia #EMP algo#! ali, alguma conexão especial... Agora me sinto mais próximo [consort_bastard.GetHerHim] do que nunca."
 secrets.0110.incest_real_father.desc:0 "o próprio [mother.Custom2('RelationToMeShort', SCOPE.sC('real_father'))] da [mother.GetTitledFirstNamePossessive], [real_father.GetTitledFirstName]!\n\n"
 secrets.0110.is_not_fathers.desc:0 "[Select_CString( child.IsFemale, 'a', 'o' )] [child.Custom('GetDaughterSon')] de [father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], mas sim que [child.GetSheHe] foi gerado por"
 secrets.0110.is_not_mine.desc:0 "m[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('GetDaughterSon')], mas foi gerad[Select_CString( child.IsFemale, 'a', 'o' )] por"
 secrets.0110.mother_family.desc:0 "\n\nComo minha própria [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('mother'))] pôde fazer isso conosco? [child.GetFirstNameNoTooltip], por outro lado, não tem culpa nisso. No entanto, as repercussões para [child.GetSheHe] podem ser graves..."
 secrets.0110.mother_spouse.desc:0 "\n\nOs rumores se espalham como fogo na corte, e [mother.GetFirstName] se trancou em seus aposentos. Devo confortá-la? Repreendê-la? Devo... estar preocupado?"
 secrets.0110.real_father_family.desc:0 "\n\nComo meu próprio [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('real_father'))] pôde fazer isso conosco? [child.GetFirstNameNoTooltip], por outro lado, não tem culpa nisso. No entanto, as repercussões para [child.GetSheHe] podem ser graves..."
 secrets.0110.real_father_spouse.desc:0 "\n\nOs rumores se espalham como fogo na corte, mas não sei o que pensar, nem o que dizer. Como você pôde fazer isso, [real_father.GetFirstName]? Como posso confiar em você novamente?"
 secrets.0110.regular_real_father.desc:0 "[real_father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 secrets.0110.regular_real_father_self_expose:0 "nada mais, nada menos que [real_father.GetSheHe]!"
 secrets.0110.single_child.desc:0 "[child.GetTitledFirstName] não é"
 secrets.0110.single_child_relation.desc:0 "[child.GetFirstName] não é"
 secrets.0110.start.above_cutoff:0 "Embora não haja uma maneira de provar conclusivamente, [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] trouxe provas de que"
 secrets.0110.start.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] apresentou provas irrefutáveis de que"
 secrets.0112.a:0 "Quem poderia imaginar?"
 secrets.0112.b.success.desc:0 "Minhas suspeitas estão corretas"
 secrets.0112.b:0 "Você ainda está se encontrando com [consort_bastard_parent_lover.GetSheHe]?"
 secrets.0112.c:0 "Vamos deixar isso para trás."
 secrets.0112.general_end.desc:0 "Eu me pergunto, [child.GetFirstNameNoTooltip] sabia sobre a verdadeira herança [child.GetHerHim], ou isso é tão novidade para [child.GetSheHe] quanto é para mim? Essa revelação se tornará uma bênção — ou uma maldição?"
 secrets.0112.mother_family.desc:0 "Oh, mãe. Não sei o que dizer, nem como me sentir. Pelo menos agora tudo está às claras."
 secrets.0112.real_father_family.desc:0 "\n\nComo meu próprio [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('real_father'))] pôde fazer isso conosco? [real_father.GetFirstNameNoTooltip], você sabe o que isso significa para nossa família?"
 secrets.0112.single_child.desc:0 "[child.GetTitledFirstName] foi gerad[Select_CString( child.IsFemale, 'a', 'o' )] por"
 secrets.0112.single_child_relation.desc:0 "m[Select_CString( child.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] foi gerado por"
 secrets.0115.a:0 "Eu tinha minhas razões!"
 secrets.0115.start.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] apresentou provas irrefutáveis da minha tentativa de assassinar [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]! [ROOT.Char.Custom('CulturalCurse')|U]!\n\n"
 secrets.0115.victim_alive.desc:0 "Agora que [victim.GetSheHe] sabe, devo pisar com cuidado. A vingança [victim.GetHerHim|U] pode chegar amanhã, daqui a dez anos, ou talvez nunca. Mas se e quando isso acontecer, é melhor eu não estar despreparado."
 secrets.0115.victim_dead.desc:0 "Pelo menos agora [Select_CString( victim.IsFemale, 'a', 'o' )] [victim.Custom2('InsultNoun', ROOT.Char)] está apodrecendo em seu túmulo!"
 secrets.0116.b:0 "Guardas! Prendam esse criminoso nojento!"
 secrets.0116.c:0 "[murderer.GetSheHe|U] está livre. Por enquanto."
 secrets.0116.dislikes_negative:0 "[murderer.GetSheHe|U] vai pagar, de uma maneira ou de outra!"
 secrets.0116.likes_negative:0 "Como [murderer.GetSheHe] pôde fazer isso!"
 secrets.0116.likes_positive:0 "Tenho certeza de que [victim.GetFirstNameNoTooltip] teve o que mereceu!"
 secrets.0116.negative.desc:0 "Pelo [ROOT.Char.GetFaith.HighGodName], [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] apresentou provas irrefutáveis de uma tentativa de assassinato contra [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], orquestrada por [murderer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\nSerá que ess[Select_CString( murderer.IsFemale, 'a', 'e' )] [murderer.Custom2('InsultNoun', ROOT.Char)] sem coração não tem respeito pela vida humana?"
 secrets.0116.positive.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] acusou [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] de ter planejado o assassinato de [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\nAgora que a verdade está exposta, é melhor [murderer.GetFirstNameNoTooltip] tomar cuidado."
 secrets.0116.victim_knows:0 "Agora todos saberão quem [murderer.GetSheHe] realmente é."
 secrets.0117.a:0 "Eu tinha minhas razões!"
 secrets.0117.kinslayer.desc:0 "Eu esperava que nunca chegasse a isso. Um erro de tolo. Agora estou à mercê de [dynast.GetTitledFirstNamePossessive], e se [dynast.GetSheHe] me perdoar, há muitos outros sedentos por vingança..."
 secrets.0117.kinslayer_dynasty_head.desc:0 "Eu esperava que nunca chegasse a isso. Um erro de tolo. Agora temo que toda a minha dinastia se volte contra mim..."
 secrets.0117.regular.desc:0 "É melhor eu ficar de olho e preparar minhas defesas. Há muitos por aí sedentos por vingança..."
 secrets.0117.start.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] apresentou provas irrefutáveis do meu envolvimento na morte de [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]! [ROOT.Char.Custom('CulturalCurse')|U]!\n\n"
 secrets.0118.known_murder.t:0 "Assassino!"
 secrets.0118.negative_end.desc:0 "[murderer.GetFirstNameNoTooltip] deve achar que [murderer.GetSheHe] é igual a [ROOT.Char.GetFaith.HighGodNamePossessive], que [murderer.GetSheHe] reina sobre vida e morte, a lei que vá para o inferno! Não há redenção para um crime desses!"
 secrets.0118.negative_end_family.desc:0 "Ess[Select_CString( murderer.IsFemale, 'a', 'e' )] [murderer.Custom2('InsultNoun', ROOT.Char)] [murderer.Custom2('InsultAdjective', ROOT.Char)] melhor dormir com um olho aberto. De uma forma ou de outra, [murderer.GetSheHe] acabará por se arrepender amargamente. Eu juro pelo túmulo de [victim.GetTitledFirstNamePossessiveNoTooltip]!"
 secrets.0118.negative_start.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] expôs um segredo terrível! [victim.Custom2('MyCharacterIntroduction', ROOT.Char)|U] encontrou uma morte prematura nas mãos de [murderer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\n"
 secrets.0118.negative_start_known.desc:0 "[murderer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] assassinou [victim.Custom2('MyCharacterIntroduction', ROOT.Char)] a sangue frio!\n\n"
 secrets.0118.positive.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] acusou [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] de ter causado o fim prematuro de [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\nAgora que a verdade está exposta, é melhor [murderer.GetFirstNameNoTooltip] tomar cuidado."
 secrets.0118.positive_known.desc:0 "[murderer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] causou o fim prematuro de [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]! Aquel[Select_CString( murderer.IsFemale, 'a', 'e' )] [murderer.GetWomanMan] fez mais de um inimigo hoje."
 secrets.0121.a:0 "O dinheiro estava apenas descansando em meu tesouro!"
 secrets.0121.desc.victim_is_liege_or_above:0 "Pior ainda, como [secret_target.GetFirstNameNoTooltip] tem autoridade legal sobre mim, [secret_target.GetSheHe] pode exigir que eu pague #EMP tudo#!. Isso pode me arruinar."
 secrets.0121.desc.victim_not_liege.root_has_liege:0 "Felizmente, [secret_target.GetFirstNameNoTooltip] não tem poder direto para exigir reparações. Infelizmente, [secret_target.GetSheHe] ainda pode pedir ao meu senhor, [secret_owner.GetLiege.GetTitledFirstName], para exigir o dinheiro mesmo assim. Vou ter que torcer para que isso não aconteça."
 secrets.0121.desc.victim_not_liege.root_has_no_liege:0 "Pelo menos não há uma autoridade superior que possa me forçar a devolver qualquer coisa. Obrigado [secret_owner.GetFaith.WealthGodName] pelas pequenas misericórdias."
 secrets.0121.start.desc.intro.self_exposed:0 "Enforquem e amaldiçoem aquele maldito cão, [secret_exposer.GetTitledFirstName] foi e contou para o mundo inteiro sobre os fundos que eu desviei [secret_exposer.GetHerHim].\n\n"
 secrets.0121.start.desc.intro:0 "Maldição e demônios daquele covarde [secret_exposer.GetTitledFirstName], [Select_CString( secret_exposer.IsFemale, 'a', 'o' )] [secret_exposer.GetWomanMan] foi e contou para o mundo inteiro sobre os fundos que eu desviei de [secret_target.GetTitledFirstName].\n\n"
 secrets.0122.a.tt:0 "[secret_owner.GetFirstName] vai te pagar de volta #P [gold_i][secret.MakeScope.Var('embezzlement_stake').GetValue]#!, na íntegra, ou então haverá uma revolta"
 secrets.0122.a:0 "Eu vou pegar meu dinheiro, [secret_owner.GetFirstNameNoTooltip]!"
 secrets.0122.b:0 "Eu não me importo com o ouro. Prefiro... ferro..."
 secrets.0122.c.tt:0 "[secret_target.GetFirstNameNoTooltip] perdoa suas \"dívidas\""
 secrets.0122.c:0 "Errar é humano, perdoar é divino."
 secrets.0122.d.tt:0 "Você pede que [secret_owner.GetFirstName] te pague de volta os seus #P [gold_i][secret.MakeScope.Var('embezzlement_stake').GetValue]#! — [secret_owner.GetSheHe] não é obrigado a fazer isso, e é improvável que cumpra"
 secrets.0122.d:0 "$secrets.0122.a$"
 secrets.0122.desc.victim_is_vassal_or_below.other:0 "Embora [secret_owner.GetFirstNameNoTooltip] não esteja sob meu poder direto, [secret_owner.GetSheHe] #EMP está#! sob a proteção de um senhor feudal que poderia forçar [secret_owner.GetSheHe] a pagar — [secret_owner.GetLiege.GetTitledFirstName] talvez até aceite apoiar minha causa se eu oferecer compartilhar os retroativos resultantes com [secret_owner.GetSheHe]."
 secrets.0122.desc.victim_is_vassal_or_below.secret_owner:0 "Como senhor feudal de [secret_owner.GetFirstNameNoTooltip], estou, felizmente, em posição de exigir reparações. #EMP Ou se não#!."
 secrets.0122.desc.victim_not_vassal:0 "Dado que [secret_owner.GetFirstName] é independente da minha autoridade, não há caminho para eu recuperar minha prata perdida."
 secrets.0122.e.tt:0 "Você oferece dividir os #P [gold_i][secret.MakeScope.Var('embezzlement_stake').GetValue]#! meio a meio com [secret_owner.GetLiege.GetTitledFirstName] se [secret_owner.GetLiege.GetSheHe] forçar [secret_owner.GetFirstName] a pagar"
 secrets.0122.e:0 "Certamente [secret_owner.GetLiege.GetTitledFirstNameNoTooltip] vê como isso é injusto..."
 secrets.0122.f:0 "$secrets.0122.c$"
 secrets.0122.g.tt:0 "[secret_owner.GetFirstName] certamente enfrentará julgamento. Eventualmente."
 secrets.0122.g:0 "Eu posso esperar..."
 secrets.0122.start.desc.intro.self_exposed:0 "Eu trouxe à luz provas incontestáveis de que [secret_owner.Custom2('MyCharacterIntroduction', secret_target)] tem secretamente me roubado! Meus escribas e tesoureiros analisaram em detalhes os ativos adquiridos ilicitamente, e eles correspondem exatamente aos impostos e dízimos perdidos ou desperdiçados em todo o meu reino.\n\n"
 secrets.0122.start.desc.intro:0 "De acordo com [secret_exposer.Custom2('MyCharacterIntroduction', secret_target)], [secret_owner.Custom2('MyCharacterIntroduction', secret_target)] tem secretamente me roubado! As provas apresentadas são incontestáveis, as contagens correspondem exatamente aos impostos e dízimos perdidos ou desperdiçados em todo o meu reino.\n\n"
 secrets.0122.t:0 "Mãos Grudentas"
 secrets.0123.a.tt:0 "Seu ouro chega na íntegra e na hora certa"
 secrets.0123.a:0 "Isso é roubo dos meus ativos legítimos, mas #EMP tudo bem#!."
 secrets.0123.b.tt.captured:0 "[secret_owner.GetFirstNameNoTooltip] tentou fugir sem sucesso"
 secrets.0123.b.tt.on_the_lamb:0 "[secret_owner.GetFirstNameNoTooltip] foge do Reino"
 secrets.0123.b.tt.refused:0 "[secret_owner.GetFirstNameNoTooltip] recusa-se categoricamente"
 secrets.0123.b:0 "Você terá seu ouro quando provar meu aço!"
 secrets.0123.desc.self_exposed:0 "Agora todo o mundo sabe da sua transferência ilícita de impostos, dízimos e bens do meu tesouro.\n\nVocê devolverá esses ganhos ilícitos imediatamente ou enfrentará as consequências."
 secrets.0123.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', secret_target)|U] me alertou sobre sua transferência ilícita de impostos, dízimos e bens do meu tesouro.\n\nVocê devolverá esses ganhos ilícitos imediatamente ou enfrentará as consequências."
 secrets.0123.t:0 "[secret_target.Custom2('AppropriateGreeting', secret_owner)]"
 secrets.0124.a.tt:0 "Você e [secret_target.GetShortUIName] recebem #P [gold_i][secret.MakeScope.Var('embezzlement_stake_half').GetValue]#! cada"
 secrets.0124.a:0 "Bem. É apenas o que você deve, afinal..."
 secrets.0124.b.tt.conditional:0 "Se [secret_owner.GetTitledFirstName] aceitar"
 secrets.0124.b.tt.conditional_failed:0 "Se [secret_owner.GetTitledFirstName] recusar"
 secrets.0124.b.tt:0 "[secret_target.GetShortUIName|U] recebe #P [gold_i][secret.MakeScope.Var('embezzlement_stake').GetValue]#!"
 secrets.0124.b:0 "Você receberá a quantia na íntegra!"
 secrets.0124.c.tt:0 "[liege.GetTitledFirstNameNoTooltip] não está interessado"
 secrets.0124.c:0 "Isso parece ser um assunto pessoal."
 secrets.0124.desc:0 "[secret_owner.Custom2('YourCharacterIntroduction', SCOPE.sC('liege'))|U] roubou uma grande quantidade de ouro de mim, algo que não tenho como recuperar sem a sua ajuda.\n\nImploro que exija uma compensação em meu nome, e você pode ficar com metade do ouro por sua ajuda."
 secrets.0124.t:0 "[secret_target.Custom2('AppropriateGreetingPositive', SCOPE.sC('liege'))]"
 secrets.0125.a.tt:0 "Sua metade do ouro chega"
 secrets.0125.a:0 "Ah, pegue então."
 secrets.0125.b.tt:0 "[secret_owner.GetTitledFirstNameNoTooltip] se revoltou em vez de pagar"
 secrets.0125.b:0 "Nenhum de vocês receberá nada além de aço de mim!"
 secrets.0125.desc:0 "Fico chocado ao saber do seu roubo de [secret_target.Custom2('YourCharacterIntroduction', secret_owner)]. [secret_target.GetSheHe|U] entrou em contato comigo para buscar justiça, e, como seu senhor feudal, eu ordeno que você devolva metade do dinheiro que roubou de [secret_target.GetFirstNameNoTooltip].\n\nA outra metade você pagará a mim como penitência. Para o bem do reino."
 secrets.0125.t:0 "[liege.Custom2('AppropriateGreeting', secret_owner)]"
 secrets.0126.a.tt:0 "[liege.GetTitledFirstNameNoTooltip] te envia tudo"
 secrets.0126.a:0 "Esse dinheiro foi ganho legitimamente, mas #EMP tudo bem#!."
 secrets.0126.b.tt:0 "$secrets.0125.b.tt$"
 secrets.0126.b:0 "Você não é meu senhor feudal!"
 secrets.0126.desc:0 "Seu covarde roubo de dinheiro dos cofres de [secret_target.GetTitledFirstName] não ficará sem represálias. Devolva [secret_target.GetSheHe], imediatamente e na íntegra, ou sofra minha ira."
 secrets.0126.t:0 "[liege.Custom2('AppropriateGreeting', secret_owner)]"
 secrets.0131.a:0 "Que [ROOT.Char.GetFaith.FateGodName] me mostre misericórdia."
 secrets.0131.desc:0 "M[Select_CString( secret_target.IsFemale, 'inha', 'eu' )] [secret_target.GetTitledFirstName] não mostrou clemência. [secret_target.GetSheHe|U] expôs meus planos de tomar o [secret_target.GetPrimaryTitle.GetTierAsNameNoTooltip|l] para mim a todos os [secret_target.GetPrimaryTitle.GetBaseName]!\n\nSe ao menos houvesse uma maneira de pagar pela minha ações..."
 secrets.0141.a:0 "Deixe o tolo falar!"
 secrets.0141.desc.fallback:0 "Com este conhecimento, [secret_target.GetFirstNameNoTooltip] sem dúvida tentará virar [Select_CString( secret_owner.IsFemale, 'a', 'o' )] [secret_owner.GetTopLiege.GetTitleAsNameNoTooltip] contra a Casa [secret_owner.GetHouse.GetBaseName]..."
 secrets.0141.desc.owner_emperor:0 "Como [secret_owner.GetTitleAsNameNoTooltip], devo ser mais cauteloso se quiser evitar provocar a ira das grandes casas..."
 secrets.0141.desc.target_emperor:0 "Agora devemos estar prontos para suportar a indignação desenfreada d[Select_CString( secret_target.IsFemale, 'a', 'o' )] [secret_target.GetTitleAsNameNoTooltip]..."
 secrets.0141.start.desc.intro.other_exposed:0 "[secret_exposer.GetTitledFirstName] revelou todo o plano para [secret_exposer.GetHerHim]...\n\n"
 secrets.0141.start.desc.intro.self_exposed:0 "Eu suponho que [secret_target.GetTitledFirstName] estava destinado a descobrir, de um jeito ou de outro...\n\n"
 secrets.0141.start.desc.intro:0 "Eu deveria saber que nossa incursão contra a [secret_target.GetHouse.GetBaseName] não poderia permanecer secreta por muito tempo neste ninho de víboras que chamamos de [secret_owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]!"
 secrets.0142.a:0 "Essa traição não vai ficar impune!"
 secrets.0142.b:0 "Teremos nossa vingança, de um jeito ou de outro..."
 secrets.0142.desc.fallback:0 "Agora podemos responsabilizar nossos inimigos diante d[Select_CString( secret_owner.IsFemale, 'a', 'o' )] [secret_target.GetTopLiege.GetTitleAsNameNoTooltip], e do [secret_target.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]!"
 secrets.0142.desc.owner_emperor:0 "Devemos agir com cautela, [Select_CString( secret_owner.IsFemale, 'a', 'o' )] [secret_owner.GetTitleAsNameNoTooltip] antecipará nossos próximos passos..."
 secrets.0142.desc.target_emperor:0 "Como [secret_target.GetTitleAsNameNoTooltip], posso usar o poder à minha disposição para responsabilizar essa família vil!"
 secrets.0142.start.desc.intro.other_exposed:0 "[secret_target.GetFaith.HighGodName] bênçãos sobre [secret_exposer.GetTitledFirstName] por revelar esta vilania da Casa [secret_owner.GetHouse.GetBaseName]!\n\n"
 secrets.0142.start.desc.intro.self_exposed:0 "[secret_target.GetFaith.HighGodNameAlternate] seja louvado por me guiar na descoberta desta vilania da Casa [secret_owner.GetHouse.GetBaseName]!\n\n"
 secrets.0142.start.desc.intro:0 "Finalmente, sabemos quem estava por trás do ultrajante ataque à propriedade da Casa [secret_target.GetHouse.GetBaseName]! Aquele vilão, [secret_owner.GetTitledFirstName] e sua abominável Casa!"
 secrets.0142.t:0 "Raider Revelado"
 secrets.0500.a:0 "Preciso de tempo para pensar..."
 secrets.0500.end.desc:0 "e não por mim?\n\nDevo chorar? Gritar? Punir? Perdoar? [child.GetFirstNameNoTooltip] sempre será considerado meu filho legítimo, mas não posso negar as evidências diante de mim..."
 secrets.0500.incest_real_father.desc:0 "próprio [mother.Custom2('RelationToMeShort', SCOPE.sC('real_father'))] de [mother.GetTitledFirstNamePossessive], [real_father.GetTitledFirstName],"
 secrets.0500.regular_real_father.desc:0 "[real_father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)],"
 secrets.0500.single_child.desc:0 "[child.GetFirstName] foi gerad[Select_CString( child.IsFemale, 'a', 'o' )] pelo"
 secrets.0500.single_child.t:0 "Filho de Outro Homem"
 secrets.0500.start.desc:0 "Será que é verdade?"
 secrets.0501.a:0 "A verdade pode ser uma bênção ou uma maldição."
 secrets.0501.desc_incest_marriage:0 "Finalmente sei quem é meu [real_father.Custom('MotherFather')] verdadeiro – [real_father.GetTitledFirstName]. Eu só queria que a revelação não viesse também com o conhecimento de que [Select_CString( incest_spouse.IsFemale, 'minha', 'meu' )] [incest_spouse.Custom('WifeHusband')] [incest_spouse.GetTitledFirstName] também é [Select_CString( incest_spouse.IsFemale, 'minha', 'meu' )] [incest_spouse.Custom('SisterBrother')]!"
 secrets.0501.desc_married_mother:0 "Isso é uma piada? Um sonho? É [father.GetFirstName], que me criou, não é meu verdadeiro pai?\n\nParece irreal, mas não posso negar as evidências diante de mim. Fui gerado por outro homem – [real_father.GetTitledFirstName]."
 secrets.0501.desc_unmarried_mother:0 "O fato de eu ter sido concebido fora dos laços do casamento tem me assombrado desde que nasci.\n\nAgora que sei a verdade, que [real_father.GetTitledFirstName] é meu [real_father.Custom('MotherFather')], finalmente posso respirar mais aliviado."
 secrets.0501.t:0 "Minha Verdadeira Origem"
 secrets.0502.a.incest:0 "Acho que vou vomitar..."
 secrets.0502.a:0 "[child.GetFirstNameNoTooltip], todo esse tempo..."
 secrets.0502.b:0 "O mundo deve saber!"
 secrets.0502.dislikes_incest.a:0 "Acho que vou vomitar."
 secrets.0502.end:0 "\n\nSempre haverá aqueles que afirmam que [Select_CString( child.IsFemale, 'a', 'o' )] jovem [child.GetFirstNameNoTooltip] é [Select_CString( child.IsFemale, 'a', 'o' )] filh[Select_CString( child.IsFemale, 'a', 'o' )] legítim[Select_CString( child.IsFemale, 'a', 'o' )] de [father.GetFirstNamePossessiveNoTooltip], mas eu sei a verdade."
 secrets.0502.likes_incest.a:0 "Sou realmente abençoado!"
 secrets.0502.lover.desc:0 "Eu sempre tive minhas suspeitas, mas agora que a verdade é certa, estou sem palavras."
 secrets.0502.married.desc:0 "\n\nTodos nós pensávamos que [father.Custom2('MyCharacterIntroduction', ROOT.Char)] era o pai. Imaginar que [mother.GetTitledFirstName] manteve a verdade escondida o tempo todo!"
 secrets.0502.single_child.t:0 "M[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('GetDaughterSon')|U]"
 secrets.0502.single_child_start.desc:0 "Por [ROOT.Char.GetFaith.HighGodName], [child.GetTitledFirstName] é m[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('GetDaughterSon')]?!"
 secrets.0502.unmarried.desc:0 "\n\nQue [mother.Custom2('MyCharacterIntroduction', ROOT.Char)] tenha engravidado fora do casamento é conhecido por todos, mas meu envolvimento exato foi mantido em segredo, até agora."
 secrets.0503.incest.desc:0 "A verdade sobre a paternidade de [sibling_partner.GetFirstNamePossessive] vem com uma consequência repugnante. Se compartilhamos o mesmo pai...\n\nImagens das coisas que dissemos, das coisas que fizemos, piscam diante dos meus olhos. Todo esse tempo..."
 secrets.0503.incest_accepted.desc:0 "Por [ROOT.Char.GetFaith.HighGodName], [sibling_partner.GetFirstName] é [Select_CString( sibling_partner.IsFemale, 'minha', 'meu' )] [sibling_partner.Custom('SisterBrother')]! Eu sabia que havia algo lá, alguma conexão especial... Agora me sinto mais próximo [consort_bastard.GetHerHim] do que nunca."
 secrets.0503.t:0 "Uma Conexão Próxima"
 secrets.0510.a.alive:0 "Preciso planejar meu próximo movimento..."
 secrets.0510.a.dead:0 "Boa viagem!"
 secrets.0510.alive.desc:0 "Não devo deixar isso passar impune — quem sabe o que pode acontecer da próxima vez. Fico imaginando qual seria a melhor ação a tomar..."
 secrets.0510.dead.desc:0 "Apesar disso, os planos [murderer.GetHerHim|U] falharam terrivelmente. Eu ainda estou de pé, enquanto [murderer.GetSheHe] está apodrecendo na terra!"
 secrets.0510.regular.desc:0 "Estou aliviado e enfurecido ao descobrir quem tentou me matar. [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] é uma serpente [murderer.Custom2('InsultAdjective', ROOT.Char)]!\n\n"
 secrets.0510.t:0 "Uma Serpente Revelada"
 secrets.0510.traitor.desc:0 "Não consigo acreditar que [murderer.GetTitledFirstName] teve a audácia de conspirar contra mim! Matar [Select_CString( ROOT.Char.IsFemale, 'sua própria', 'seu próprio' )] [murderer.Custom2('RelationToMeShort', ROOT.Char)]!\n\n"
 secrets.0511.alive.desc:0 "A menos que eu tome uma atitude, [victim.GetFirstNameNoTooltip] ainda pode estar em perigo."
 secrets.0511.dead.desc:0 "Pelo menos aquela serpente [murderer.Custom2('InsultAdjective', ROOT.Char)] está morta e enterrada!"
 secrets.0511.regular.desc:0 "Que [ROOT.Char.GetFaith.HighGodNamePossessive]! [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tentou matar [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 secrets.0512.alive.desc:0 "Ah, [murderer.GetSheHe] pensou que [murderer.GetSheHe] escaparia desse crime hediondo, mas marquem minhas palavras. [murderer.GetFirstNameNoTooltip] pagará caro pelos pecados [murderer.GetHerHim]."
 secrets.0512.dead.desc:0 "Mesmo que eu esteja contente por [murderer.GetSheHe] estar apodrecendo em sua sepultura, há uma parte de mim que deseja que [murderer.GetSheHe] estivesse vivo e respirando diante de mim. Eu sei de uma coisa ou outra que seria mais apropriada para [murderer.GetFirstNameNoTooltip] do que o descanso eterno..."
 secrets.0512.immured.desc:0 "Enquanto meus agentes vasculhavam minuciosamente em [murderer.Custom('ResidenceBuilding')], eles encontraram um quarto murado atrás do qual o corpo de [victim.GetFirstNamePossessiveNoTooltip] foi encontrad[Select_CString( victim.IsFemale, 'a', 'o' )].\n\n"
 secrets.0512.regular.desc:0 "Finalmente, descobri a verdade! [Select_CString( murderer.IsFemale, 'A', 'O' )] [murderer.Custom2('InsultNoun', ROOT.Char)] frio e cruel por trás da morte prematura [Select_CString( victim.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim'))] [victim.GetFirstNamePossessive] foi ninguém menos que [murderer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\n"
 secrets.1001.a:0 "Um gosto por [secret_holder.Custom('WomenMen')], você diz?"
 secrets.1001.b:0 "Parece que não sou o único a deixar meus instintos tomarem conta de mim."
 secrets.1001.c:0 "[secret_holder.GetTitledFirstName] entendeu mal o significado de 'criação de animais'?"
 secrets.1001.f:0 "[secret_holder.GetFirstNameNoTooltip] e [secret_lover.GetFirstNameNoTooltip]? A mera ideia me perturba!"
 secrets.1001.fallback:0 "\n\n[secret_holder.GetTitledFirstName] tem muitos segredos, pelo visto."
 secrets.1001.opening_no_spymaster:0 "Rumores têm sido sussurrados sobre m[Select_CString( secret_holder.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secret_holder'))] por um tempo, mas eu não vi evidências deles até agora."
 secrets.1001.opening_spymaster:0 "No final do último relatório do [spymaster.GetCouncilTitle] [spymaster.GetFirstNamePossessive], [spymaster.GetSheHe] faz uma pausa por um momento. 'Há algo que você deveria saber sobre [Select_CString( secret_holder.IsFemale, 'a sua', 'o seu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secret_holder'))].'"
 secrets.1001.option_fallback:0 "Se eu não soubesse que é verdade..."
 secrets.1001.secret_relationships:0 "\n\n[secret_holder.GetTitledFirstName] e [secret_lover.GetTitledFirstName] estão envolvidos em um caso ilícito!"
 secrets.1001.sexual_habits:0 "\n\nParece que [secret_holder.GetTitledFirstName] tem algumas preferências sexuais muito incomuns..."
 secrets.1001.t:0 "Uma Descoberta"
 secrets.1012.a:0 "Não é de admirar que [first_lover.GetFirstNameNoTooltip] queira manter esse segredo."
 secrets.1012.close_relation:0 "É difícil esconder segredos de um verdadeiro amigo, e eu já sabia há muito tempo do interesse de [first_lover.GetTitledFirstNamePossessive] em m[Select_CString( lover.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))], [lover.GetTitledFirstName].\n\nAgora eu descobri que é mais do que um interesse. Os dois estão envolvidos em um relacionamento ilícito!"
 secrets.1012.desc:0 "É difícil esconder segredos de um verdadeiro amigo, e eu já sabia há muito tempo que [first_lover.GetTitledFirstName] tinha interesse em [lover.GetTitledFirstName].\n\nAgora eu descobri que é mais do que um interesse. Os dois estão envolvidos em um relacionamento ilícito!"
 secrets.1012.t:0 "Amigos e Amantes"
 secrets.1101.a:0 "Mal posso acreditar."
 secrets.1101.end:0 "\n\n[bastard.GetTitledFirstName] não é m[Select_CString( bastard.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('bastard'))] completo, mas na verdade é [Select_CString( bastard.IsFemale, 'a', 'o' )] [bastard.Custom('GetDaughterSon')] de [real_father.GetTitledFirstName]!"
 secrets.1101.friendly:0 "Apesar de todas as nossas semelhanças, há grandes diferenças entre nós, e agora eu entendo melhor o motivo."
 secrets.1101.opening:0 "Aprender a verdade fez todas as peças se encaixarem."
 secrets.1101.t:0 "Nossa Linhagem"
 secrets.1101.unfriendly:0 "Eu deveria ter sabido que havia mais por trás de nossas diferenças do que apenas nossas desavenças intermináveis."
 secrets.1102.a:0 "O que [father.GetSheHe] fará com esse conhecimento?"
 secrets.1102.end:0 "\n\n[father.GetTitledFirstName] sabe quem é meu verdadeiro pai."
 secrets.1102.friendly:0 "Eu estava em dúvida no início, mas a maneira como [father.Char.GetSheHe] enfatizou '#EMP [ROOT.Char.Custom('SisterBrother')]#!' ao me cumprimentar deixou tudo claro como o dia."
 secrets.1102.unfriendly:0 "Eu estava em dúvida no início, mas a maneira zombeteira como [father.GetSheHe] enfatizou '#EMP [ROOT.Char.Custom('SisterBrother')]#!' ao me cumprimentar deixou tudo claro como o dia."
 secrets.2002.a.tt:0 "#F [secret_holder.GetFirstNameNoTooltip] pode estar arrependido.#!"
 secrets.2002.a:0 "Repreender [secret_holder.GetFirstNameNoTooltip] por seus crimes!"
 secrets.2002.b:0 "Ah, bem. A política pode ser feia."
 secrets.2002.desc:0 "Eu quase desejo nunca ter sabido! Pensar que m[Select_CString( secret_holder.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secret_holder'))], [secret_holder.GetTitledFirstName], é capaz de assassinato...\n\nNem mesmo [murdered_character.GetTitledFirstName] merecia um fim tão indigno."
 secrets.2002.t:0 "Imperdoável?"
 secrets.2003.a:0 "Eu fiz o que tinha que fazer."
 secrets.2003.b:0 "Eu me arrependo do que fiz, a cada dia que passa!"
 secrets.2003.desc:0 "M[Select_CString( close_character.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('close_character'))] se aproxima de mim, com uma expressão conflituosa em seu rosto.\n\n\"Eu sei o que você fez com [murdered_character.GetTitledFirstName],\" [close_character.GetFirstName] me diz. \"Pensar que você é capaz de um crime assim... Isso assombra meus pensamentos.\""
 secrets.2004.a:0 "Talvez [secret_holder.GetSheHe] possa ser perdoad[Select_CString( secret_holder.IsFemale, 'a', 'o' )], com o tempo."
 secrets.2004.b:0 "Ah, eu nunca consigo ficar com raiva de você, [target.GetFirstNameNoTooltip]!"
 secrets.2004.desc:0 "Apesar de todas as minhas palavras duras, eu não esperava a resposta que recebi de [secret_holder.GetTitledFirstName] quando a confrontei sobre a morte de [murdered_character.GetTitledFirstName].\n\n\"Você não sabe como isso me assombra?\" [secret_holder.GetSheHe] pergunta. \"É um alívio finalmente contar a alguém sobre meu arrependimento.\""
 secrets.3001.a:0 "Obrigad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('close_character'))]!"
 secrets.3001.opening:0 "M[Select_CString( close_character.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('close_character'))] [close_character.GetTitledFirstName] se aproxima de mim, com uma expressão de preocupação em seu rosto."
 secrets.3001.scheme_known:0 "\n\n\"Encontrei um dos agentes envolvidos na conspiração contra você! [agent.GetTitledFirstName] estava tentando entregar um relatório ao seu mestre de tarefas no meio da noite.\""
 secrets.3001.scheme_not_known:0 "\n\n\"Encontrei um agente envolvido em uma conspiração contra você! [agent.GetTitledFirstName] estava tentando entregar um relatório ao seu mestre de tarefas no meio da noite.\""
 secrets.3001.scheme_owner_known:0 "\n\n\"Encontrei um dos agentes que estão ajudando [Select_CString( known_scheme_owner.IsFemale, 'a', 'o' )] [known_scheme_owner.GetTitledFirstName] em sua trama contra você! [agent.GetTitledFirstName] estava tentando entregar um relatório para [known_scheme_owner.GetFirstName] no meio da noite.\""
 secrets.3001.t:0 "Olhando por Mim"
 secrets.4001.a:0 "\"Absurdo! Testemunhas oculares são pouco confiáveis.\""
 secrets.4001.b:0 "\"Mesmo assim, sou um servo leal do Filho do Céu.\""
 secrets.4001.c:0 "\"Figura de barro teme a chuva, mentira teme a verdade.\""
 secrets.4001.desc:0 "[Select_CString( minister.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('minister'))] [minister.GetTitledFirstName] entra no meu solar com guardas ao seu lado.\n\n\"Estou absolutamente decepcionado com você, [ROOT.Char.GetFirstNameNoTooltip]! Você tinha uma boa carreira, mas ela termina agora.\" [minister.GetSheHe] bate a mão na minha mesa, deixando para trás um documento. \"Isto é uma prova inegável, testemunho de múltiplas pessoas, de que você trapaceou para passar seus exames.\""
 secrets.4001.t:0 "Fraude em Exames Revelada"
 secrets.5001.a:0 "Para o [ROOT.Char.GetFaith.NegativeAfterLife] com [secret_exposer.GetHerHim]!"
 secrets.5001.desc:0 "Que [secret_exposer.Custom('InsultAdjective')] [secret_exposer.GetTitledFirstName] anda espalhando minhas convicções secretas para todo mundo!\n\nComo pode ser tão errado acreditar em algo?"
 secrets.5001.t:0 "Uma Convicção Proibida"
 secrets_secondary_character_my_character_introduction:0 "[secondary_character.Custom2('MyCharacterIntroductionNoComma', event_root)]"
 secrets_secondary_character_primary_characters_introduction:0 "[secondary_character.Custom2('HerHisCharacterIntroductionNoComma', primary_character)]"
