l_spanish:
 hashish_alone_modifier:0 "Auto-Medicação"
 hashish_alone_modifier_desc:0 "Este personagem está controlando sua dor com bolos de haxixe à noite."
 hashish_with_friend_modifier:0 "Medicação com Companhia"
 hashish_with_friend_modifier_desc:0 "Este personagem está compartilhando suas noites com um bom amigo e um ótimo haxixe."
 overworking_diplomacy_modifier:0 "Sobrecarga na Diplomacia"
 overworking_diplomacy_modifier_desc:0 "$overworking_stewardship_modifier_desc$"
 overworking_intrigue_modifier:0 "Sobrecarga na Intriga"
 overworking_intrigue_modifier_desc:0 "$overworking_stewardship_modifier_desc$"
 overworking_learning_modifier:0 "Sobrecarga no Aprendizado"
 overworking_learning_modifier_desc:0 "$overworking_stewardship_modifier_desc$"
 overworking_martial_modifier:0 "Sobrecarga nas Artes Marciais"
 overworking_martial_modifier_desc:0 "$overworking_stewardship_modifier_desc$"
 overworking_stewardship_modifier:0 "Sobrecarga na Administração"
 overworking_stewardship_modifier_desc:0 "Este personagem coloca o trabalho acima da sua saúde mental."
 stress_trait_ongoing.0501.a:0 "De volta ao trabalho!"
 stress_trait_ongoing.0501.administrative:0 "Administrar a casa [ROOT.Char.GetDynastyHouse.GetBaseNameNoTooltip] tem sido tão estressante ultimamente. Se não é uma coisa, é outra, e se não é outra, é essa mesma. Uma lista interminável de tarefas mesquinhas, problemas e perguntas, todos esperando pelas #EMP minhas#! soluções.\n\nEu mereço um dia só para mim, sem intrigas ou bajulações, sem aduladores ou fingimentos. Só eu e este grande prato de bolos de haxixe..."
 stress_trait_ongoing.0501.adventurer:0 "Os negócios de liderar um acampamento têm sido tão estressantes, recentemente. Se não é isso, é aquilo, se não é aquilo, é isso. Uma interminável lista de tarefas pequenas, problemas e questões, todas esperando por #EMP minhas#! soluções.\n\nEu mereço um dia para mim, sem discursos motivacionais ou palestras, sem treinamentos ou reuniões. Só eu e este grande prato de bolos de haxixe..."
 stress_trait_ongoing.0501.b:0 "É só um dia de folga..."
 stress_trait_ongoing.0501.desc:0 "Os negócios de governar têm sido tão estressantes, recentemente. Se não é isso, é aquilo, se não é aquilo, é isso. Uma interminável parade de camponeses, sacerdotes e problemas, todos esperando que #EMP eu#! resolva cada uma de suas preocupações mesquinhas.\n\nEu mereço um dia para mim, sem pretendentes ou petições, sem diplomatas ou juízes. Só eu e este grande prato de bolos de haxixe..."
 stress_trait_ongoing.0501.t:0 "Uma Noite Relaxante"
 stress_trait_ongoing.0506.a:0 "Eu só preciso ficar sozinho por um tempo."
 stress_trait_ongoing.0506.b:0 "Talvez [medication_friend.GetFirstNameNoTooltip] queira compartilhar?"
 stress_trait_ongoing.0506.desc:0 "\n\nHaxixe deve aliviar a dor, por um tempo. A única questão é se devo consumi-lo sozinho ou se a companhia ajudaria a me animar. [medication_friend.GetTitledFirstName] perguntou se eu queria uma companhia esta noite..."
 stress_trait_ongoing.0506.desc_cancer:0 "As semanas passam arrastadas, um jogo de espera para essa dor aguda ou aquela. Alguns dias são toleráveis, mas em outros mal consigo me mover ou falar, e minha respiração fica cada vez mais lenta. Sinto meu tempo restante na Terra escorrendo de mim, roubado por esse crescimento canceroso que mata meu corpo."
 stress_trait_ongoing.0506.desc_disfigured:0 "Minhas feridas podem ter cicatrizado externamente, mas internamente, a agonia da minha desfiguração ainda queima. Traço o caminho das cicatrizes antigas com um dedo, e a memória da miséria vem inundando de volta."
 stress_trait_ongoing.0506.desc_fallback:0 "Essa agonia assola meu corpo, um tormento muito severo para o meu cérebro castigado. Eu preciso de algum alívio, apenas alguma forma de lidar com isso."
 stress_trait_ongoing.0506.desc_gout_ridden:0 "Essa dor latejante em meus membros é tão intensa, horas de agonia lenta me incapacitando dia após dia. Às vezes, me pergunto se seria melhor ou pior se fosse constante, em vez de ter que suportar a onda de tormento, da dor maçante à tortura lancinante e de volta."
 stress_trait_ongoing.0506.desc_leper:0 "Esta doença devastadora consome meu corpo lentamente, descascando minha carne dia após dia. Um[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] [ROOT.GetCharacter.GetTitleAsNameNoTooltip] eu posso ser, mas às vezes temo que meus [ROOT.Char.Custom(GetCourtierPlural)] me olhem e vejam nada além de um leproso."
 stress_trait_ongoing.0506.desc_maimed:0 "Eu tosso, expelindo um pedaço de muco-sangue. Nem sei se isso é um problema novo ou não, não com a agonia constante que assola meu corpo mutilado e arruinado."
 stress_trait_ongoing.0506.desc_one_eyed:0 "O encaixe vazio que costumava abrigar meu olho ainda dói, às vezes. Principalmente dores agudas. Estranhos fantasmas visuais e explosões de formas não naturais nos piores dias."
 stress_trait_ongoing.0506.desc_one_legged:0 "Pressiono meus dedos contra o toco retorcido da minha perna ausente. Às vezes, especialmente quando percorro rotas familiares, ainda consigo senti-la. A agonia do meu desmembramento volta inundando, real como sempre, invadindo meu cérebro."
 stress_trait_ongoing.0506.desc_wounded:0 "Grimasso enquanto meus dedos sondam o corte. Eles voltam com pó de crosta vermelho-preto, acompanhado de uma pontada aguda de dor que me lembra que minhas feridas ainda estão muito frescas e doloridas."
 stress_trait_ongoing.0506.t:0 "Doce Alívio"
 stress_trait_ongoing.0511.a:0 "Você está certo! Devo parar imediatamente."
 stress_trait_ongoing.0511.a_flavour:0 "Você joga os bolos de haxixe fora."
 stress_trait_ongoing.0511.b:0 "<respiração profunda> Concordo, #EMP elder#!."
 stress_trait_ongoing.0511.b_flavour:0 "Coma. Cada. Maldito. Bolo."
 stress_trait_ongoing.0511.desc:0 "Estou desfrutando de uma noite fresca, sentado casualmente comendo uma pequena pilha de bolinhos doces cobertos com haxixe, quando de repente sinto a respiração pesada e respingada de um[Select_CString( crusty_old_person.IsFemale, 'a', '' )] [crusty_old_person.GetTitledFirstName] enfurecido em minha bochecha.\n\n'Coloque essa maldita planta para baixo, [ROOT.GetCharacter.GetFirstNameNoTooltip], e pare de nublar sua mente! [crusty_old_person.GetFaith.HighGodName] não o colocou nesta Terra para que você perdesse seu tempo em um torpor!'"
 stress_trait_ongoing.0511.t:0 "Assim Foi Sempre"
 stress_trait_ongoing.0516.a.tt_fail:0 "Fica ofendido com a sua óbvia embriaguez."
 stress_trait_ongoing.0516.a.tt_success:0 "[important_guest.GetFirstNameNoTooltip] fica impressionado com suas respostas calmas e precisas."
 stress_trait_ongoing.0516.a:0 "Sim, claro, um encontro tão importante..."
 stress_trait_ongoing.0516.b:0 "Desculpe, mas estou me sentindo indisposto."
 stress_trait_ongoing.0516.b_flavour:0 "Você sai da reunião mais cedo e vai deitar-se."
 stress_trait_ongoing.0516.c:0 "Relaxe, [important_guest.GetFirstNameNoTooltip]. Experimente um pouco de haxixe!"
 stress_trait_ongoing.0516.c_flavour:0 "Você faz um servo trazer mais bolos para compartilhar."
 stress_trait_ongoing.1501.a.failure:0 "[obsession.GetTitledFirstName] rejeita minhas investidas"
 stress_trait_ongoing.1501.a.flavor:0 "Isso resolverá as coisas, de uma maneira ou de outra."
 stress_trait_ongoing.1501.a.success:0 "[obsession.GetTitledFirstName] também tem me desejado"
 stress_trait_ongoing.1501.a:0 "Eu preciso saber se [obsession.GetSheHe] sente o mesmo!"
 stress_trait_ongoing.1501.b.flavor:0 "Um tempo sozinho trará alívio temporário, pelo menos."
 stress_trait_ongoing.1501.b:0 "Um pouco de fantasia não pode machucar, certo?"
 stress_trait_ongoing.1501.bridge:0 "Desde então, não consigo parar de pensar n[obsession.GetSheHe], e minhas fantasias lascivas continuam me distraindo do meu trabalho.\n\n"
 stress_trait_ongoing.1501.c.flavor:0 "#EMP Alguém#! certamente vai me ajudar a superar isso."
 stress_trait_ongoing.1501.c:0 "Uma visita ao bordel vai tirar [obsession.GetSheHe] da minha mente..."
 stress_trait_ongoing.1501.d.flavor:0 "Essa obsessão é injusta tanto para [obsession.GetSheHe] quanto para mim."
 stress_trait_ongoing.1501.d:0 "Eu não deveria objetificar [obsession.GetFirstNameNoTooltip] assim, isso é #EMP errado#!!"
 stress_trait_ongoing.1501.desc_1_a:0 "Eu dei uma olhada no decote tentador d[Select_CString( obsession.IsFemale, 'a', 'o' )] [obsession.GetTitledFirstNamePossessive] quando passei por [obsession.GetSheHe] esta manhã."
 stress_trait_ongoing.1501.desc_1_b:0 "Notei uma saliência sugestiva saindo da meia d[Select_CString( obsession.IsFemale, 'a', 'o' )] [obsession.GetTitledFirstNamePossessive] quando passei por [obsession.GetSheHe] esta manhã."
 stress_trait_ongoing.1501.desc_1_c:0 "[obsession.Custom2('MyCharacterIntroduction', ROOT.Char)|U] sorriu calorosamente para mim quando passei por [obsession.GetSheHe] esta manhã."
 stress_trait_ongoing.1501.desc_1_d:0 "Eu não pude deixar de deixar meu olhar vagar sobre o corpo d[Select_CString( obsession.IsFemale, 'a', 'o' )] [obsession.GetTitledFirstNamePossessive] quando passei por [obsession.GetSheHe] esta manhã."
 stress_trait_ongoing.1501.desc_2_a:0 "Seu generoso busto,"
 stress_trait_ongoing.1501.desc_2_b:0 "Seus quadris largos,"
 stress_trait_ongoing.1501.desc_2_c:0 "Seu membro tentador,"
 stress_trait_ongoing.1501.desc_2_d:0 "Seu corpo ágil,"
 stress_trait_ongoing.1501.desc_2_e:0 "Seus ombros largos,"
 stress_trait_ongoing.1501.desc_2_f:0 "Seu físico atraente,"
 stress_trait_ongoing.1501.desc_3_a:0 "a maneira como o corpo ágil [obsession.GetHerHim] desliza..."
 stress_trait_ongoing.1501.desc_3_b:0 "a maneira como o corpo rechonchudo [obsession.GetHerHim] balança enquanto [obsession.GetSheHe] anda..."
 stress_trait_ongoing.1501.desc_3_c:0 "a maneira como os músculos [obsession.GetHerHim] se contraem sob a pele enquanto [obsession.GetSheHe] passa..."
 stress_trait_ongoing.1501.desc_3_d:0 "a postura e dignidade com as quais [obsession.GetSheHe] se porta..."
 stress_trait_ongoing.1501.desc_3_e:0 "a maneira como [obsession.GetSheHe] anda de forma travessa pelo [ROOT.Char.Custom('ResidenceBuilding')]..."
 stress_trait_ongoing.1501.desc_3_f:0 "o ritmo medido com o qual [obsession.GetSheHe] anda..."
 stress_trait_ongoing.1501.end:0 "É demais! Preciso encontrar algum alívio dessa paixão, ou nunca conseguirei fazer nada!"
 stress_trait_ongoing.1501.t:0 "Obsessão"
 stress_trait_ongoing.1501.warning:0 "\n\nInfelizmente, eu sei que [obsession.GetFirstName] não tem interesse em [ROOT.Char.GetWomenMen], e, portanto, [obsession.GetSheHe] não terá interesse em mim."
 stress_trait_ongoing.4501.a:0 "Leve estas moedas. Faça o que for preciso, traga-me minha comida!"
 stress_trait_ongoing.4501.b.cannibal:0 "Você desenvolve um gosto por carne humana"
 stress_trait_ongoing.4501.b.failure:0 "Seu desejo não é saciado"
 stress_trait_ongoing.4501.b.success:0 "Você descobre uma nova sobremesa favorita"
 stress_trait_ongoing.4501.b:0 "Você tem #EMP algo#! em mãos que possa satisfazer meus desejos?"
 stress_trait_ongoing.4501.c:0 "Ugh... Eu acho que vou ter que ficar sem."
 stress_trait_ongoing.4501.desc:0 "As últimas semanas têm sido particularmente estressantes, e tudo o que eu quero é um bom e saboroso [ROOT.Char.Custom('FavoriteTreat')] para comer... talvez vários...\n\nMaldição, talvez uma mesa inteira deles!\n\nInfelizmente, meu cozinheiro me informa que ele não tem nenhum sobrando, nem os ingredientes para fazer mais."
 stress_trait_ongoing.4501.t:0 "Nem Uma Mordida Para Comer"
 stress_trait_ongoing.4502.a:0 "Não é como se alguém fosse sentir falta de [prisoner.GetTitledFirstNameNoTooltip]."
 stress_trait_ongoing.4502.b:0 "[courtier.GetTitledFirstNameNoTooltip] merece [courtier.GetSheHe] de qualquer maneira..."
 stress_trait_ongoing.4502.c:0 "Hora de uma visita a [hapless_village.GetNameNoTier]!"
 stress_trait_ongoing.4502.desc:0 "As últimas semanas têm sido particularmente estressantes, e tudo o que eu quero é um bom pedaço suculento de carne. Um bom corte macio como um filé, ou talvez costelas?\n\nMinha boca saliva ao pensar nisso, e eu sei que não posso conter a fome. Não desta vez."
 stress_trait_ongoing.4502.t:0 "A Fome"
 stress_trait_ongoing.5001.a.flavor:0 "Vou comer a refeição, mas apenas por educação."
 stress_trait_ongoing.5001.a:0 "\"É, uh... realmente bom. Mmm. Muito saboroso.\""
 stress_trait_ongoing.5001.b:0 "\"Você não deveria... não, sério. #EMP Servos!#! Levem isso embora.\""
 stress_trait_ongoing.5001.c.cat:0 "Fingir comer, mas alimentar tudo para [ROOT.Char.Custom('CatStoryName')] embaixo da mesa."
 stress_trait_ongoing.5001.c.dog:0 "Fingir comer, mas alimentar tudo para [ROOT.Char.Custom('DogStoryName')] embaixo da mesa."
 stress_trait_ongoing.5001.c.failure:0 "[giver.GetTitledFirstName] nota que eu não comi a comida"
 stress_trait_ongoing.5001.c.no_pet:0 "Fingir comer, mas alimentar tudo para um cachorro embaixo da mesa."
 stress_trait_ongoing.5001.c.success:0 "[giver.GetTitledFirstName] acha que eu gostei da refeição"
 stress_trait_ongoing.5001.desc:0 "\"Venha comigo [ROOT.Char.GetTitledFirstName]; tenho uma surpresa para você!\" [giver.Custom2('MyCharacterIntroduction', ROOT.Char)] diz animadamente. \"Notei que você não tem comido bem, então passei semanas procurando as iguarias mais raras que consegui encontrar!\"\n\nSeguindo [giver.GetHerHim], vejo uma mesa cheia de uma grande variedade de pratos gourmet. [ROOT.Char.Custom('GetExpensiveMeal')|U] e [ROOT.Char.Custom('GetExpensiveMealAlt')]... [ROOT.Char.Custom('GetExpensiveDessert')]... o cheiro sozinho faz meu estômago revirar.\n\n\"Então? Vamos lá, [ROOT.Char.Custom('FormOfAddressForLiege')]!\""
 stress_trait_ongoing.5001.t:0 "Banquete das Intenções"
 stress_trait_ongoing_0516.desc:0 "\"—b o encontro é tão importante\".\n\nHã? Ah, certo, sim, o encontro com [important_guest.GetTitledFirstName]. Sobre... algo. No que estávamos falando mesmo? [important_guest.GetSheHe|U] parece muito séri[o,a] a respeito, seja lá o que fosse.\n\nEu estendo a mão, pego mais um bolo com cobertura de haxixe e começo a comer pensativamente. [important_guest.GetFirstNameNoTooltip] ergue uma sobrancelha para a minha pausa vaga, e percebo que talvez tenha comido alguns #EMP demais#! bolos."
 stress_trait_ongoing_0516.t:0 "Um Andarilho So—"
