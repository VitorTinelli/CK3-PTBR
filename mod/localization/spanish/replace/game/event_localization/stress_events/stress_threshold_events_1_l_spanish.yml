 stress_threshold.2321.desc.impatient:0 "Minha vida é uma constante procissão de explicações longas e confusas para as quais não tenho tempo!"
 stress_threshold.2321.desc.intro:0 "Tudo o que faço, as pessoas se aproveitam!"
