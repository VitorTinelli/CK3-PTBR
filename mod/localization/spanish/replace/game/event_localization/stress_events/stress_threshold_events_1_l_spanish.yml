l_spanish:
 agonising_irritations_modifier:0 "Irritações Excruciantes"
 agonising_irritations_modifier_desc:0 "Este personagem abafa seu passado com irritação no presente."
 an_influx_of_eager_beggars_modifier:0 "Influxo de Mendigos Ansiosos"
 an_influx_of_eager_beggars_modifier_desc:0 "Mendigos se alinham nas ruas de muitos assentamentos aqui, ansiosos por moedas."
 bottom_of_a_bottle_modifier:0 "Fundo de Garrafa"
 bottom_of_a_bottle_modifier_desc:0 "Este personagem abafa seu passado com o fundo de uma garrafa."
 carrion_writer_modifier:0 "Escritor de Carne Podre"
 carrion_writer_modifier_desc:0 "Este personagem escreve em seu diário usando uma tinta muito pessoal."
 controlled_urban_fires_modifier:0 "Incêndios Urbanos Controlados"
 controlled_urban_fires_modifier_desc:0 "Um grande incêndio foi evitado por pouco em uma das propriedades deste condado."
 deplenished_forests_and_fields_modifier:0 "Florestas e Campos Esgotados"
 deplenished_forests_and_fields_modifier_desc:0 "As florestas e as presas deste condado foram devastadas para os banquetes de seu senhor."
 deserted_halls_modifier:0 "Espaços Desertos"
 deserted_halls_modifier_desc:0 "Poucas pessoas compartilham o ar deste personagem, deixando-o sozinho..."
 encouraged_city_burn_modifier:0 "Deixem Todos Queimarem"
 encouraged_city_burn_modifier_desc:0 "Este personagem deixou um domínio inteiro quase ser reduzido a cinzas."
 extreme_tax_rebates_modifier:0 "Reembolsos Fiscais Extremos"
 extreme_tax_rebates_modifier_desc:0 "É bem conhecido que este personagem devolve os impostos a qualquer plebeu que solicite!"
 fogging_hard_memories_modifier:0 "Borrando Memórias Difíceis"
 fogging_hard_memories_modifier_desc:0 "Este personagem abafa seu passado com legiões de bolos de haxixe."
 glut_of_furniture_modifier:0 "Excesso de Mobília"
 glut_of_furniture_modifier_desc:0 "O espaço de vida deste personagem está cada vez mais cheio de móveis de má qualidade e sem gosto."
 good_exercise_modifier:0 "Bom Exercício"
 good_exercise_modifier_desc:0 "Este personagem ultrapassou seus limites no treinamento e sente-se mais forte como resultado. Eles exalam cheiro de suor, porém..."
 grouchy_ruler_modifier:0 "Líder Irritadiço"
 grouchy_ruler_modifier_desc:0 "Este personagem está mal-humorado e é lacônico com todos que o incomodam."
 high_blood_pressure_modifier:0 "Pressão Alta"
 high_blood_pressure_modifier_desc:0 "A irritação deste personagem não é boa para o coração deles."
 jealousy_at_court_effect.confider.list:0 "Todos os [courtiers|E] considerarão [Select_CString( friend.IsFemale, 'a', 'o' )] [friend.GetFirstNameNoTooltip] um bajulador"
 lashing_out_at_victims_modifier:0 "Atacando as Vítimas"
 lashing_out_at_victims_modifier_desc:0 "Este personagem constantemente ataca as vítimas que precisam de sua ajuda."
 long_walks_of_the_mind_modifier:0 "Longas Caminhadas Mentais"
 long_walks_of_the_mind_modifier_desc:0 "Este personagem revive seu passado fazendo longas caminhadas isoladas."
 lost_in_lust_modifier:0 "Perdido na Luxúria"
 lost_in_lust_modifier_desc:0 "Este personagem afoga seu passado em um emaranhado de corpos."
 managed_urban_fires_modifier:0 "Incêndios Urbanos Gerenciados"
 managed_urban_fires_modifier_desc:0 "Um grande incêndio devastou uma das propriedades deste condado."
 obsessed_autobiographer_modifier:0 "Autobiógrafo Obcecado"
 obsessed_autobiographer_modifier_desc:0 "Este personagem tem pouco tempo para qualquer coisa que não seja reler seus próprios diários."
 ostentatious_follies_modifier:0 "Loucuras Ostensivas"
 ostentatious_follies_modifier_desc:0 "O domínio deste personagem é pontilhado por monumentos mal acabados e feios à sua grandeza."
 outer_monologue_modifier:0 "Monólogo Exterior"
 outer_monologue_modifier_desc:0 "Este personagem busca perdão por seu passado expondo-o constantemente."
 pickled_human_head_footstool:0 "Cabeça Humana em Conserva"
 pickled_human_head_footstool_desc:0 "Este personagem insiste em usar uma cabeça humana em conserva como apoio para os pés."
 refuge_in_words_modifier:0 "Refúgio nas Palavras"
 refuge_in_words_modifier_desc:0 "Este personagem abafa seu passado com notas manchadas de tinta."
 regular_walking_routes_modifier:0 "Rotas de Caminhada Regulares"
 regular_walking_routes_modifier_desc:0 "Este personagem regularmente reserva um tempo para percorrer certos caminhos, sozinho..."
 running_from_responsibilities_modifier:0 "Fugindo das Responsabilidades"
 running_from_responsibilities_modifier_desc:0 "Este personagem leva ao pé da letra o conceito de fugir das responsabilidades."
 sated_by_mistakes_modifier:0 "Saciado por Erros"
 sated_by_mistakes_modifier_desc:0 "Este personagem é sustentado mais pelo arrependimento do que pela comida."
 scars_over_scars_modifier:0 "Cicatrizes Sobre Cicatrizes"
 scars_over_scars_modifier_desc:0 "Este personagem abafa seu passado com dor terrena."
 scopophobic_modifier:0 "Escopofóbico"
 scopophobic_modifier_desc:0 "Este personagem detesta ser observado."
 sorely_needed_confidant_modifier:0 "Supercomunicativo"
 sorely_needed_confidant_modifier_desc:0 "Este personagem fala constantemente sobre seu passado com um confidente."
 strange_recluse_modifier:0 "Eremita Estranho"
 strange_recluse_modifier_desc:0 "Este personagem é conhecido por se esconder em reclusão e dizer coisas estranhas aos visitantes..."
 stress_threshold.1701.a.rakish.effect:0 "$stress_threshold.1701.a.rakish.gain$"
 stress_threshold.1701.a.rakish.gain:0 "Ao inferno com isso! Vou para a casa de prazer."
 stress_threshold.1701.b.irritable.effect:0 "$stress_threshold.1701.b.irritable.gain$"
 stress_threshold.1701.b.irritable.gain:0 "Eu juro por [ROOT.GetCharacter.GetFaith.HighGodName], vou socar alguém."
 stress_threshold.1701.c.flagellant.effect:0 "$stress_threshold.1701.c.flagellant.gain$"
 stress_threshold.1701.c.flagellant.gain:0 "Eu me flagelarei pelos meus pecados!"
 stress_threshold.1701.d.profligate.effect:0 "$stress_threshold.1701.d.profligate.gain$"
 stress_threshold.1701.d.profligate.gain:0 "Talvez uma capa nova me faça sentir melhor..."
 stress_threshold.1701.desc.arbitrary:0 "Talvez nem seja realmente um problema. Pode ser apenas um pequeno problema local de pouca importância, talvez."
 stress_threshold.1701.desc.arrogant:0 "Honestamente, às vezes, parece que todo o [ROOT.Char.Custom('GetRealmOrDomicile')|l] desabaria se eu não cuidasse de tudo sozinho."
 stress_threshold.1701.desc.fallback:0 "Às vezes, é mentalmente exaustivo ser eu mesmo."
 stress_threshold.1701.desc.impatient:0 "Eu gostaria que eles se apressassem e resolvessem as coisas por si mesmos, sem que eu precise lidar pessoalmente com cada. Pequena. Coisa."
 stress_threshold.1701.desc.intro:0 "Enquanto caminho pela minha [ROOT.Char.Custom('GetCourt')], frustrado, muitos dos meus [ROOT.Char.Custom('GetCourtierPlural')|l] parecem continuar falando sem parar sobre algum problema que estão enfrentando em [capital_province.GetNameNoTooltip].\n\n"
 stress_threshold.1701.desc.lazy:0 "Eu simplesmente não tenho energia para me importar e quero desesperadamente voltar para a cama!"
 stress_threshold.1701.desc.rump:0 "\n\nAlgo na discussão soa... Familiar. E-e esse plano não foi #EMP minha#! ideia? Isso é #EMP minha#! culpa?"
 stress_threshold.1701.desc.stubborn:0 "Sinceramente, isso nem parece um problema tão sério. Se eles se esforçassem mais, nem perceberiam a falha."
 stress_threshold.1701.desc.trusting:0 "Com tudo o que tem acontecido ultimamente, tenho dificuldade em me concentrar, mas tenho certeza de que ninguém diria coisas tão duras se não fossem verdadeiras."
 stress_threshold.1701.desc.wrathful:0 "Em dias como esses, quando suas palavras se tornam um zumbido aborrecido e monótono em meus ouvidos, sinto vontade de punir todos eles."
 stress_threshold.1701.g.journaller.effect:0 "$stress_threshold.1701.g.journaller.gain$"
 stress_threshold.1701.g.journaller.gain:0 "Devo me livrar desses pensamentos através da escrita."
 stress_threshold.1701.h.confider.effect:0 "[friend.GetFirstNameNoTooltip] certamente me apoiará!"
 stress_threshold.1701.h.confider.gain:0 "Talvez [friend.GetFirstNameNoTooltip] me apoie?"
 stress_threshold.1701.i.drunkard.effect:0 "$stress_threshold.1701.i.drunkard.gain$"
 stress_threshold.1701.i.drunkard.gain:0 "Uma bebida forte resolve a maioria dos problemas..."
 stress_threshold.1701.j.hashishiyah.effect:0 "$stress_threshold.1701.j.hashishiyah.gain$"
 stress_threshold.1701.j.hashishiyah.gain:0 "O haxixe acalmará meus nervos aflitos..."
 stress_threshold.1701.k:0 "São apenas conversas vazias, nada a ver comigo."
 stress_threshold.1701.t:0 "Colapso Mental: Voltando para Casa"
 stress_threshold.1711.a.reclusive.effect:0 "$stress_threshold.1711.a.reclusive.gain$"
 stress_threshold.1711.a.reclusive.gain:0 "O último. Depois disso, quero ficar sozinho."
 stress_threshold.1711.b.flagellant.effect:0 "$stress_threshold.1711.b.flagellant.gain$"
 stress_threshold.1711.b.flagellant.gain:0 "Flagelar-me dissipará o pecado..."
 stress_threshold.1711.c.profligate.effect:0 "$stress_threshold.1701.d.profligate.gain$"
 stress_threshold.1711.c.profligate.gain:0 "$stress_threshold.1701.d.profligate.gain$"
 stress_threshold.1711.d.improvident.effect:0 "$stress_threshold.1711.d.improvident.gain$"
 stress_threshold.1711.d.improvident.gain:0 "Sirva-se do tesouro, burguês. Você precisa disso."
 stress_threshold.1711.desc.ambitious:0 "\"Você pensa que pode conseguir um selo real de mim, burguês? Eu sou um[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] [ROOT.GetCharacter.GetTitleAsNameNoTooltip|L]!\""
 stress_threshold.1711.desc.deceitful:0 "\"Você não parece um dos meus súditos. Vá incomodar outra pessoa.\""
 stress_threshold.1711.desc.diligent:0 "\"Lidarei com seus problemas daqui a algumas semanas, mas você não é importante o suficiente para um atendimento mais rápido.\""
 stress_threshold.1711.desc.fallback:0 "\"[ROOT.GetCharacter.GetFaith.HealthGodNamePossessive] piedade, não mais um!\""
 stress_threshold.1711.desc.greedy:0 "\"Você tem algum imposto para mim? Não? Então não me importo muito.\""
 stress_threshold.1711.desc.intro:0 "Por [ROOT.GetCharacter.GetFaith.FateGodName], meus [ROOT.Char.Custom('GetCourtierPlural')|l] têm sido implacáveis em seus pedidos ultimamente. Este trabalho parece #EMP interminável#!. Mais um se aproxima, evidentemente aflito por algum assunto trivial.\n\n"
 stress_threshold.1711.desc.just:0 "\"Se você veio em busca de justiça, saiba que eu não anulo as decisões dos meus juízes por uma moeda insignificante.\""
 stress_threshold.1711.desc.patient:0 "$stress_threshold.1711.desc.diligent$"
 stress_threshold.1711.desc.rump:0 "\n\n[courtier.GetFirstName] me encara, piscando rapidamente em choque. Foi algo que eu disse?"
 stress_threshold.1711.desc.zealous:0 "\"Eu consigo sentir o cheiro do pecado em você, burguês!\""
 stress_threshold.1711.e.journaller.effect:0 "$stress_threshold.1711.e.journaller.gain$"
 stress_threshold.1711.e.journaller.gain:0 "Buscarei consolo em meu diário."
 stress_threshold.1711.f.athletic.effect:0 "$stress_threshold.1711.f.athletic.gain$"
 stress_threshold.1711.f.athletic.gain:0 "Vou dar um passeio. Agora."
 stress_threshold.1711.g.drunkard.effect:0 "$stress_threshold.1711.g.drunkard.gain$"
 stress_threshold.1711.g.drunkard.gain:0 "Bebida! Isso é demais para uma mente sóbria."
 stress_threshold.1711.h.hashishiyah.effect:0 "$stress_threshold.1711.h.hashishiyah.gain$"
 stress_threshold.1711.h.hashishiyah.gain:0 "Haxixe! Isso é demais para uma mente sóbria."
 stress_threshold.1711.i:0 "Eu sou [Select_CString( ROOT.GetCharacter.IsFemale, 'a', 'o' )] [ROOT.GetCharacter.GetTitleAsNameNoTooltip], eu posso fazer isso!"
 stress_threshold.1711.t:0 "Colapso Mental: Muito Ocupado"
 stress_threshold.1721.a.reclusive.effect:0 "$stress_threshold.1721.a.reclusive.gain$"
 stress_threshold.1721.a.reclusive.gain:0 "Preciso ficar sozinho para refletir sobre isso."
 stress_threshold.1721.b.irritable.effect:0 "$stress_threshold.1701.b.irritable.gain$"
 stress_threshold.1721.b.irritable.gain:0 "$stress_threshold.1701.b.irritable.gain$"
 stress_threshold.1721.c.flagellant.effect:0 "$stress_threshold.1701.c.flagellant.gain$"
 stress_threshold.1721.c.flagellant.gain:0 "$stress_threshold.1701.c.flagellant.gain$"
 stress_threshold.1721.d.profligate.effect:0 "$stress_threshold.1701.d.profligate.gain$"
 stress_threshold.1721.d.profligate.gain:0 "$stress_threshold.1701.d.profligate.gain$"
 stress_threshold.1721.desc.callous:0 "realista, mas meus [ROOT.Char.Custom('GetCourtierPlural')|l] interpretam tudo o que faço como algo mal-intencionado, reclamando sobre trivialidades. Outros não parecem ter tanta dificuldade em controlar seus subordinados."
 stress_threshold.1721.desc.calm:0 "calmo, mas cada #EMP um#! dos meus [ROOT.Char.Custom('GetCourtierPlural')|l] parece determinado a fritar meus nervos. Pequenas crises dominam meus dias, e sinto que estou me quebrando como nenhum outro."
 stress_threshold.1721.desc.chaste:0 "casto, mas parece que sempre sou tentado pelos prazeres da carne. Alguém como eu deveria ser capaz de resistir a esses impulsos libidinosos."
 stress_threshold.1721.desc.compassionate:0 "compassivo, mas outros parecem ser muito mais amados do que eu. Simplesmente não consigo me conectar com as pessoas como gostaria."
 stress_threshold.1721.desc.content:0 "nobre, contente com minha sorte e desprovido de ambição desnecessária, mas sinto que ajo de forma muito mais ciumenta e orgulhosa do que os outros."
 stress_threshold.1721.desc.craven:0 "nobre, mas sou simplesmente covarde demais para agir tão bravamente quanto os outros, e parece que meus [ROOT.Char.Custom('GetCourtierPlural')|l] percebem isso constantemente."
 stress_threshold.1721.desc.cynical_no_collide:0 "racional, mas meus [ROOT.Char.Custom('GetCourtierPlural')|l] sempre parecem adorar as filosofias dos outros e nunca as minhas reflexões."
 stress_threshold.1721.desc.fallback:0 "nobre, mas estou repleto de imperfeições."
 stress_threshold.1721.desc.fickle:0 "flexível, mas não importa quantas vezes eu mude de ideia, não importa quanta informação nova eu receba, outros parecem ser melhores em se adaptar do que eu."
 stress_threshold.1721.desc.forgiving:0 "perdoador, mas ainda assim meus [ROOT.Char.Custom('GetCourtierPlural')|l] têm medo de vir até mim com seus problemas. Outros parecem ter centenas de confidentes, e eu não sei como posso fazer meu povo confiar em mim assim."
 stress_threshold.1721.desc.generous:0 "sou generoso, mas não importa o quanto eu doe, sempre existe alguém com outra tigela estendida. Os outros parecem não ter esses problemas."
 stress_threshold.1721.desc.honest:0 "honesto, mas a cada decisão vejo mentiras por omissão e pequenos erros distorcendo meu significado. Outros parecem tão diligentes e abertos, então por que devo ser amaldiçoado com essa natureza enganosa?"
 stress_threshold.1721.desc.humble:0 "humilde, mas parece que todas as minhas ações exalam orgulho. Outros parecem viver tão modestamente, mas eu pareço exibir minha magnificência a cada oportunidade, e não suporto isso."
 stress_threshold.1721.desc.intro:0 "Recentemente, sinto que não sou digno de ser um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip]. Será que outros também duvidam de si mesmos, como eu duvido de mim?\n\nEu tento ser bom, "
 stress_threshold.1721.desc.paranoid:0 "cauteloso, mas não consigo prever tudo. Sempre há mais traidores para encontrar, mais tramas ocultas. Outros não parecem lidar com tanta traição, e só posso me culpar por inspirá-la."
 stress_threshold.1721.desc.rump:0 "\n\nMaldito seja este universo, por colocar tais responsabilidades sobre um miserável como eu!"
 stress_threshold.1721.desc.temperate:0 "temperante, mas minha boca parece salivar constantemente. Tudo me deixa com fome. Por que estou tão incrivelmente, desumanamente faminto?"
 stress_threshold.1721.desc.vengeful:0 "justo, vingando ofensas e aplicando retribuições, mas outros sempre parecem entregar vingança de forma muito mais rápida."
 stress_threshold.1721.e.improvident.effect:0 "$stress_threshold.1721.e.improvident.gain$"
 stress_threshold.1721.e.improvident.gain:0 "A caridade me torna uma pessoa melhor, certo?"
 stress_threshold.1721.f.contrite.effect:0 "$stress_threshold.1721.f.contrite.gain$"
 stress_threshold.1721.f.contrite.gain:0 "Devo confessar meus pecados publicamente."
 stress_threshold.1721.g.comfort_eater.effect:0 "Façam outro banquete! E outro, e outro!"
 stress_threshold.1721.g.comfort_eater.gain:0 "Vamos banquetear, banquetear até me sentir melhor!"
 stress_threshold.1721.h.inappetetic.effect:0 "$stress_threshold.1721.h.inappetetic.gain$"
 stress_threshold.1721.h.inappetetic.gain:0 "Diga ao cozinheiro para parar de preparar meus jantares."
 stress_threshold.1721.i.journaller.effect:0 "$stress_threshold.1711.e.journaller.gain$"
 stress_threshold.1721.i.journaller.gain:0 "$stress_threshold.1711.e.journaller.gain$"
 stress_threshold.1721.j.confider.effect:0 "$stress_threshold.1701.h.confider.effect$"
 stress_threshold.1721.j.confider.gain:0 "$stress_threshold.1701.h.confider.gain$"
 stress_threshold.1721.k.drunkard.effect:0 "$stress_threshold.1701.i.drunkard.gain$"
 stress_threshold.1721.k.drunkard.gain:0 "$stress_threshold.1701.i.drunkard.gain$"
 stress_threshold.1721.l.hashishiyah.effect:0 "$stress_threshold.1701.j.hashishiyah.gain$"
 stress_threshold.1721.l.hashishiyah.gain:0 "$stress_threshold.1701.j.hashishiyah.gain$"
 stress_threshold.1721.m:0 "Eu sou tão bom quanto o resto!"
 stress_threshold.1721.n:0 "Talvez eu esteja desejando a carne mais rara..."
 stress_threshold.1721.t:0 "Colapso Mental: Impostor!"
 stress_threshold.1731.a.rakish.effect:0 "$stress_threshold.1701.a.rakish.gain$"
 stress_threshold.1731.a.rakish.gain:0 "$stress_threshold.1701.a.rakish.gain$"
 stress_threshold.1731.b.reclusive.effect:0 "$stress_threshold.1731.b.reclusive.gain$"
 stress_threshold.1731.b.reclusive.gain:0 "Pode esperar, tudo pode esperar."
 stress_threshold.1731.c.profligate.effect:0 "$stress_threshold.1731.c.profligate.gain$"
 stress_threshold.1731.c.profligate.gain:0 "Vou apenas parar para comprar algumas coisas no caminho..."
 stress_threshold.1731.d.comfort_eater.effect:0 "$stress_threshold.1731.d.comfort_eater.gain$"
 stress_threshold.1731.d.comfort_eater.gain:0 "Vou pensar em voltar cedo durante o almoço."
 stress_threshold.1731.desc.brave:0 "testar minha habilidade com armas contra um oponente digno,"
 stress_threshold.1731.desc.fallback:0 "para longe das responsabilidades de [ROOT.Char.Custom('GetCourt')|l],"
 stress_threshold.1731.desc.gluttonous:0 "para uma taverna famosa, onde experimentarei uma culinária estrangeira exótica,"
 stress_threshold.1731.desc.gregarious:0 "para confraternizar com alguns tipos locais amigáveis,"
 stress_threshold.1731.desc.intro:0 "Tem sido um trabalho tão exaustivo ultimamente. É como se eu não tivesse um único [ROOT.Char.Custom('GetCourtier')|l] que pudesse limpar a própria sujeira sem minha instrução expressa e detalhada!\n\nNo meio do planejamento de uma pequena escapada"
 stress_threshold.1731.desc.lustful:0 "para um bordel local, onde pretendo permanecer até ficar irritado e dolorido,"
 stress_threshold.1731.desc.rump:0 "um servo vem correndo até mim, balbuciando sobre alguma nova catástrofe trivial."
 stress_threshold.1731.desc.sadistic:0 "para uma prisão local cheia de criminosos e camponeses,"
 stress_threshold.1731.desc.shy:0 "para um lugar local conhecido por sua serenidade,"
 stress_threshold.1731.e.journaller.effect:0 "$stress_threshold.1711.e.journaller.gain$"
 stress_threshold.1731.e.journaller.gain:0 "$stress_threshold.1711.e.journaller.gain$"
 stress_threshold.1731.f.confider.effect:0 "$stress_threshold.1731.f.confider.gain$"
 stress_threshold.1731.f.confider.gain:0 "Vou conversar com [friend.GetFirstNameNoTooltip] sobre isso no caminho."
 stress_threshold.1731.g.athletic.effect:0 "$stress_threshold.1731.g.athletic.gain$"
 stress_threshold.1731.g.athletic.gain:0 "Talvez eu vá a pé para o meu refúgio..."
 stress_threshold.1731.g:0 "#EMP Tudo bem#!, vou cancelar meus planos."
 stress_threshold.1731.h.drunkard.effect:0 "$stress_threshold.1731.h.drunkard.gain$"
 stress_threshold.1731.h.drunkard.gain:0 "Parece que vou beber durante toda a viagem."
 stress_threshold.1731.i.hashishiyah.effect:0 "$stress_threshold.1731.i.hashishiyah.gain$"
 stress_threshold.1731.i.hashishiyah.gain:0 "Nós temos biscoitos de haxixe para a viagem?"
 stress_threshold.1731.t:0 "Colapso Mental: Sem tempo para mim"
 stress_threshold.2301.a.rakish.effect:0 "$stress_threshold.1701.a.rakish.gain$"
 stress_threshold.2301.a.rakish.gain:0 "$stress_threshold.1701.a.rakish.gain$"
 stress_threshold.2301.b.profligate.effect:0 "$stress_threshold.2301.b.profligate.gain$"
 stress_threshold.2301.b.profligate.gain:0 "Talvez... Talvez uma nova cama? Ou três?"
 stress_threshold.2301.c.comfort_eater.effect:0 "$stress_threshold.1721.g.comfort_eater.effect$"
 stress_threshold.2301.c.comfort_eater.gain:0 "$stress_threshold.1721.g.comfort_eater.gain$"
 stress_threshold.2301.d.drunkard.effect:0 "$stress_threshold.1701.i.drunkard.gain$"
 stress_threshold.2301.d.drunkard.gain:0 "$stress_threshold.1701.i.drunkard.gain$"
 stress_threshold.2301.desc.fallback:0 "respirar sem sentir que estou sendo esmagado, sorrir sem sentir que estou vazio."
 stress_threshold.2301.desc.gluttonous:0 "comer algo, qualquer coisa, para saciar esse vazio de significado."
 stress_threshold.2301.desc.greedy:0 "sentir a firmeza reconfortante de moedas frias entre meus dedos, algo confiável, algo que faça sentido."
 stress_threshold.2301.desc.gregarious:0 "conversar com alguém, qualquer pessoa, realmente #EMP falar#! e sentir que eles me entendem."
 stress_threshold.2301.desc.intro:0 "Cada dia parece escorregar de minhas mãos recentemente, um trem interminável de decisões difíceis. Meu peito se aperta. Meus dedos coçam e formigam nas pontas, meus olhos parecem pequenos demais para o meu crânio.\n\nEu preciso me afastar, só por um tempo, eu preciso de"
 stress_threshold.2301.desc.lustful:0 "sentir o calor de outro em meus braços, apenas para me conectar um pouco com alguém."
 stress_threshold.2301.desc.rump:0 "\n\nIsso é pedir demais?"
 stress_threshold.2301.e.hashishiyah.effect:0 "$stress_threshold.1701.j.hashishiyah.gain$"
 stress_threshold.2301.e.hashishiyah.gain:0 "$stress_threshold.1701.j.hashishiyah.gain$"
