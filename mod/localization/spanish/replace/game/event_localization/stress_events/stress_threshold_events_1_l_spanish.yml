 stress_threshold.2331.d.improvident.gain:0 "Ouro e prata vão comprar meu amor!"
 stress_threshold.2331.desc.ambitious:0 "eles acham que eu não vou parar por nada para alcançar minhas ambições, que nada é sagrado para mim,"
 stress_threshold.2331.desc.brave:0 "minha coragem é confundida com sede de sangue,"
 stress_threshold.2331.desc.callous:0 "eles dizem que não tenho coração, que não me importo com ninguém além de mim mesmo,"
 stress_threshold.2331.desc.calm:0 "eles consideram minha perspectiva calma perturbadora, desprovida de emoção,"
 stress_threshold.2331.desc.fallback:0 "eles acham que sou muito impessoal, muito distante,"
 stress_threshold.2331.desc.intro:0 "Ultimamente, meus [ROOT.Char.Custom('GetCourtierPlural')|l] parecem me evitar a todo custo. Ouço sussurros de que "
 stress_threshold.2331.desc.just:0 "eles acham que sou muito severo, que sigo a letra da lei com muita rigidez em vez de seu espírito,"
 stress_threshold.2331.desc.rump:0 "mas isso só significa que lidero com mão firme. Não significa que sou um monstro.\n\n... Será?"
 stress_threshold.2331.desc.stubborn:0 "eles me consideram muito teimoso, inflexível, intransigente,"
