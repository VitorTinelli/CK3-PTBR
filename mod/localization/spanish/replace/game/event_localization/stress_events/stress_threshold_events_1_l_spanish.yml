 stress_threshold.2341.desc.arbitrary:0 "e não tenho obrigações além das que escolho manter!"
 stress_threshold.2341.desc.craven:0 "e se eu escolher não me expor ao perigo, isso não é da conta de mais ninguém além de mim!"
 stress_threshold.2341.desc.fallback:0 "e minhas escolhas são invioláveis!"
 stress_threshold.2341.desc.fickle:0 "$stress_threshold.2341.desc.arbitrary$"
 stress_threshold.2341.desc.intro:0 "Maldição, eu também preciso de tempo para mim! E daí se eu deixar [ROOT.Char.Custom('GetCourt')|l] por alguns dias, ou até um mês? Liderar é meu direito, e eu o exercerei, ou o deixarei, no meu tempo.\n\nEu sou [Select_CString( ROOT.GetCharacter.IsFemale, 'a', 'o' )] [ROOT.GetCharacter.GetTitleAsNameNoTooltip],"
 stress_threshold.2341.desc.lazy:0 "e eu preciso descansar!"
 stress_threshold.2341.desc.shy:0 "e se eu não quiser enfrentar os meus [ROOT.Char.Custom('GetCourtierPlural')|l], eu não preciso!"
 stress_threshold.2341.e.confider.effect:0 "$stress_threshold.1701.h.confider.effect$"
