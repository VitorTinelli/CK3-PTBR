 stress_threshold.2351.d.improvident.effect:0 "$stress_threshold.1711.d.improvident.gain$"
 stress_threshold.2351.d.improvident.gain:0 "$stress_threshold.1711.d.improvident.gain$"
 stress_threshold.2351.desc.content:0 "\"Você não pode simplesmente ser #EMP contente#! com o que sobrou?\""
 stress_threshold.2351.desc.cynical:0 "\"Pfft, como posso saber que você não está #EMP mentindo#!?\""
 stress_threshold.2351.desc.fallback:0 "\"Por [ROOT.GetCharacter.GetFaith.HighGodName], você #EMP fede#!.\""
 stress_threshold.2351.desc.intro:0 "Eu me sento, prestando pouca atenção, enquanto um camponês local termina seu relato de desgraça. Francamente, eu mal registrei o que estavam falando. Minha mente está cheia até transbordar com meus #EMP próprios#! problemas.\n\n"
 stress_threshold.2351.desc.paranoid:0 "\"Uma história #EMP provável#!. Você provavelmente é só um espião astuto!\""
 stress_threshold.2351.desc.rump:0 "Eu respondo, sem pensar.\n\nO [ROOT.Char.Custom('GetRoom')] fica completamente em silêncio, todos os olhares voltados para o camponês perplexo e para mim. Evidentemente, essa não era a resposta que esperavam."
 stress_threshold.2351.desc.sadistic:0 "\"Sabe, acho que há um lugar #EMP perfeito#! no minha [ROOT.Char.Custom('GetDungeon')] para você.\""
 stress_threshold.2351.desc.vengeful:0 "\"Tenho certeza de que você mereceu #EMP tudo#! o que aconteceu com você.\""
 stress_threshold.2351.e.inappetetic.effect:0 "$stress_threshold.1721.h.inappetetic.gain$"
 stress_threshold.2351.e.inappetetic.gain:0 "$stress_threshold.1721.h.inappetetic.gain$"
 stress_threshold.2351.f.journaller.effect:0 "$stress_threshold.2351.f.journaller.gain$"
 stress_threshold.2351.f.journaller.gain:0 "Talvez eu desenhe em meu diário enquanto ouço..."
 stress_threshold.2351.g.drunkard.effect:0 "$stress_threshold.1701.i.drunkard.gain$"
 stress_threshold.2351.g.drunkard.gain:0 "$stress_threshold.1701.i.drunkard.gain$"
 stress_threshold.2351.h.hashishiyah.effect:0 "$stress_threshold.1701.j.hashishiyah.gain$"
 stress_threshold.2351.h.hashishiyah.gain:0 "$stress_threshold.1701.j.hashishiyah.gain$"
 stress_threshold.2351.i:0 "Peço desculpas, agora, por favor repita sua história..."
 stress_threshold.2351.t:0 "Colapso Mental: Comentários Impróprios"
 stress_threshold.3401.a.reclusive.effect:0 "$stress_threshold.3401.a.reclusive.gain$"
 stress_threshold.3401.a.reclusive.gain:0 "E depois todos vocês saiam da minha vista!"
 stress_threshold.3401.a.reclusive.list:0 "Cada [character|E] fora de sua casa imediata"
 stress_threshold.3401.b.irritable.effect:0 "$stress_threshold.3401.b.irritable.gain$"
 stress_threshold.3401.b.irritable.gain:0 "E decapitem qualquer outra pessoa que tente falar comigo!"
 stress_threshold.3401.c.journaller.effect:0 "$stress_threshold.3401.c.journaller.gain$"
 stress_threshold.3401.c.journaller.gain:0 "Esprema o cadáver! #EMP Usarei os fluidos como tinta!#!"
 stress_threshold.3401.d.confider.effect:0 "$stress_threshold.1701.h.confider.effect$"
 stress_threshold.3401.d.confider.gain:0 "$stress_threshold.1701.h.confider.gain$"
 stress_threshold.3401.desc.arbitrary:0 "\"Pelas [ROOT.GetCharacter.GetFaith.HighGodName], acho seu cheiro bastante potente."
 stress_threshold.3401.desc.callous:0 "\"Não me importo com esses problemas insignificantes."
 stress_threshold.3401.desc.fallback:0 "$stress_threshold.3401.desc.wrathful$"
 stress_threshold.3401.desc.impatient:0 "\"Desembucha, imbecil! Ah, muito lento!"
 stress_threshold.3401.desc.intro:0 "Minha cabeça parece uma tempestade presa em um ovo. Eu me contorço, tentando me acomodar em meu trono, enquanto um mensageiro me conta uma história irrelevante sobre piratas, ou bandidos, ou saqueadores, ou algum tipo de bobagem camponesa.\n\nA pressão em meu crânio aumenta, exigindo uma liberação em algum lugar, e, quase involuntariamente, minha boca se abre para falar."
 stress_threshold.3401.desc.paranoid:0 "\"Acha que vou cair nessas mentiras óbvias? Você é claramente algum assassino contratado!"
 stress_threshold.3401.desc.rump:0 "#EMP Decapitem esse tolo!#!\"\n\nA corte ao nosso redor fica mortalmente em silêncio."
 stress_threshold.3401.desc.sadistic:0 "\"Seu serviço medíocre dá um mau exemplo."
 stress_threshold.3401.desc.vengeful:0 "\"Você não jogou um ovo em mim alguns anos atrás?"
 stress_threshold.3401.desc.wrathful:0 "\"Como você se atreve a me trazer trivialidades?!"
 stress_threshold.3401.e.drunkard.effect:0 "$stress_threshold.3401.e.drunkard.gain$"
 stress_threshold.3401.e.drunkard.gain:0 "E tragam-me uma bebida! E uma de reserva!"
 stress_threshold.3401.f.hashishiyah.effect:0 "$stress_threshold.3401.f.hashishiyah.gain$"
 stress_threshold.3401.f.hashishiyah.gain:0 "E tragam alguns bolos de haxixe!"
 stress_threshold.3401.g:0 "E tragam-me a cabeça para servir de apoio para os pés!"
 stress_threshold.3401.t:0 "Colapso Mental: Atirando no Mensageiro"
 stress_threshold.3411.a.reclusive.effect:0 "$stress_threshold.2351.a.reclusive.gain$"
 stress_threshold.3411.a.reclusive.gain:0 "NÃO ME OLHEM!"
 stress_threshold.3411.b.flagellant.effect:0 "$stress_threshold.3411.b.flagellant.gain$"
 stress_threshold.3411.b.flagellant.gain:0 "Minha carne para o perdão!"
 stress_threshold.3411.c.profligate.effect:0 "$stress_threshold.3411.c.profligate.gain$"
 stress_threshold.3411.c.profligate.gain:0 "Grandes monumentos enganarão meus súditos..."
 stress_threshold.3411.d.improvident.effect:0 "$stress_threshold.3411.d.improvident.gain$"
 stress_threshold.3411.d.improvident.gain:0 "E se o tesouro pertencesse a todos?"
 stress_threshold.3411.desc.compassionate:0 "por mais que eu tente realizar a corte, ouvir o povo comum da terra, sempre há centenas esperando para pedir minha ajuda."
 stress_threshold.3411.desc.diligent:0 "por mais que eu trabalhe, quantas noites sem dormir eu me afaste da cama, os problemas do reino sempre parecem se multiplicar e se agravar."
 stress_threshold.3411.desc.fallback:0 "por mais que eu tente, tudo o que faço parece ser um erro, cada conquista se desfaz em minhas mãos como cinzas."
 stress_threshold.3411.desc.forgiving:0 "$stress_threshold.3411.desc.trusting$"
 stress_threshold.3411.desc.generous:0 "eu dê, não importa o quanto seja generoso com meus súditos, sempre parece que alguns estão na pobreza e alguns sempre me odeiam."
 stress_threshold.3411.desc.humble:0 "por menos que eu deixe meu orgulho atrapalhar meu dever, ainda sinto como se estivesse sendo consumido vivo pela minha própria arrogância."
 stress_threshold.3411.desc.intro:0 "Eu não consigo fazer isso. Simplesmente não consigo mais ser [ROOT.GetCharacter.GetTitleAsNameNoTooltip|L]! Como alguém consegue #EMP lidar#! com essa massa fervilhante de estresse? Não importa o quanto"
 stress_threshold.3411.desc.just:0 "por mais justo que eu seja, não importa o quanto eu persiga fervorosamente a aplicação da lei, o crime ainda prospera em todos os cantos do meu domínio."
 stress_threshold.3411.desc.patient:0 "pacientemente eu ouço problema após problema, simplesmente nunca pareço ter soluções boas o suficiente."
 stress_threshold.3411.desc.rump:0 "\n\nEstá claro que eu nunca serei bom o suficiente para governar. Algo #EMP tem#! que acontecer."
 stress_threshold.3411.desc.shy:0 "por mais esforço que eu faça para realizar a corte, a visão de cortesãos amontoados me causa apoplexia de medo."
 stress_threshold.3411.desc.trusting:0 "por muitas vezes que eu perdoe pessoas, faça empréstimos a elas ou lhes dê o benefício da dúvida, algo catastrófico e imprevisível sempre parece acontecer."
 stress_threshold.3411.e.contrite.effect:0 "$stress_threshold.3411.e.contrite.gain$"
 stress_threshold.3411.e.contrite.gain:0 "O mundo #EMP deve#! saber da minha inadequação!"
 stress_threshold.3411.f.inappetetic.effect:0 "$stress_threshold.3411.f.inappetetic.gain$"
 stress_threshold.3411.f.inappetetic.gain:0 "Esvaziem as despensas! Eu não mereço comida tentadora."
 stress_threshold.3411.f.inappetetic.list:0 "Cada [courtier|E] e [guest|E] passaram fome ao seu lado"
 stress_threshold.3411.g.journaller.effect:0 "$stress_threshold.3411.g.journaller.gain$"
 stress_threshold.3411.g.journaller.gain:0 "Meus velhos diários! Preciso estudar minhas falhas..."
 stress_threshold.3411.h.confider.effect:0 "$stress_threshold.1701.h.confider.effect$"
 stress_threshold.3411.h.confider.gain:0 "$stress_threshold.1701.h.confider.gain$"
 stress_threshold.3411.i.athletic.effect:0 "$stress_threshold.3411.i.athletic.gain$"
 stress_threshold.3411.i.athletic.gain:0 "Eu não posso fugir dessa responsabilidade, mas posso tentar."
 stress_threshold.3411.j.drunkard.effect:0 "$stress_threshold.3411.j.drunkard.gain$"
 stress_threshold.3411.j.drunkard.gain:0 "Tragam-me um barril de bebida para afogar minhas mágoas."
 stress_threshold.3411.k.hashishiyah.effect:0 "$stress_threshold.3411.k.hashishiyah.gain$"
 stress_threshold.3411.k.hashishiyah.gain:0 "Eu quero hashish suficiente para aniquilar essa vergonha."
 stress_threshold.3411.l.list:0 "Cada [vassal|E] que não te odeiam"
 stress_threshold.3411.l.tt:0 "Todas as [claims|E] contra seus [titles|E] se tornam [Concept('pressed', 'Pressionadas')|E]"
 stress_threshold.3411.l:0 "É isso! Eu abdico!"
 stress_threshold.3411.t:0 "Colapso Mental: Sou Indigno!"
 stress_threshold.3421.a.rakish.effect:0 "$stress_threshold.3421.a.rakish.gain$"
 stress_threshold.3421.a.rakish.gain:0 "Traga-me uma companhia, e enviarei ajuda."
 stress_threshold.3421.b.reclusive.effect:0 "$stress_threshold.3421.b.reclusive.gain$"
 stress_threshold.3421.b.reclusive.gain:0 "Resolvam isso vocês mesmos! Deixem-me em paz!"
 stress_threshold.3421.b.reclusive.list:0 "Cada [vassal|E] com um coração"
 stress_threshold.3421.c.irritable.effect:0 "$stress_threshold.3421.c.irritable.gain$"
 stress_threshold.3421.c.irritable.gain:0 "Malditos e malditos ingratos, vou resolver isso!"
 stress_threshold.3421.d.flagellant.effect:0 "$stress_threshold.3421.d.flagellant.gain$"
 stress_threshold.3421.d.flagellant.gain:0 "O que?! Eu devo ser flagelado por minha falha!"
 stress_threshold.3421.desc.arrogant:0 "Continuo com a construção do meu modelo de um novo e perfeito palácio ideal. Ele é como eu em cada detalhe e, porque estou criando, cada último detalhe é inerentemente correto."
 stress_threshold.3421.desc.craven:0 "Permaneço firmemente protegido atrás de uma porta pesada com bandas de ferro. Seriam necessários uma dúzia de soldados robustos para entrar aqui, e nesta sala segura, sem janelas, estou ainda mais distante do perigo."
 stress_threshold.3421.desc.cynical:0 "Eu os encaro de volta na entrada do meu santuário, meu rosto uma máscara de incredulidade. Queimando, sinceramente? Uma mentira clara e óbvia. Como posso saber se isso é realmente um dos #EMP meus#! servos? Eles podem ser qualquer um! Melhor me livrar deles rapidamente."
 stress_threshold.3421.desc.fallback:0 "Fico na torre mais alta em [capital_holding.GetNameNoTier], olhando para a capital, meus lábios franzidos. Parece que não saio daqui há dias, e toda vez que o faço, algo dramaticamente errado acontece."
 stress_threshold.3421.desc.gluttonous:0 "Continuo a enfiar comida na minha boca, só parando meu banquete individual após vários minutos constrangedores, quando fica claro que o mensageiro não sairá sem uma ordem explícita."
 stress_threshold.3421.desc.greedy:0 "Simplesmente continuo contando minhas moedas, imperturbável. As pilhas cintilantes de prata e ouro me cercam como as torres de um pequeno castelo, ordenadas por tamanho e pureza, e compõem uma parte significativa da minha riqueza."
 stress_threshold.3421.desc.gregarious:0 "Mal consigo ouvi-los por causa dos sons de risadas e alegria vindo de trás de mim. Minha festa está a todo vapor e já dura vários dias."
 stress_threshold.3421.desc.intro:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\", implora o servo, \"por favor, não fará nada? [burning_holding.GetNameNoTier] está em chamas! Você deve enviar ajuda!\".\n\n"
 stress_threshold.3421.desc.lazy:0 "Meus olhos permanecem fechados. Balanço suavemente em meu suporte de tecido, sozinho na torre mais alta que possuo, exceto pelo mensageiro e um[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] [ROOT.GetCharacter.GetTitleAsNamePossessiveNoTooltip|L] resgata em travesseiros macios e cobertores."
 stress_threshold.3421.desc.lustful:0 "Eu me estico, minhas mãos entrando em contato com carne jovem e bela sem esforço. Um coro de gemidos atrás de mim parece não se importar com o visitante."
 stress_threshold.3421.desc.rump:0 "\n\n\"Acredito que dei instruções claras para não ser incomodado\", respondo. Apenas este quarto, esta realidade, realmente faz sentido para minha mente fragmentada."
 stress_threshold.3421.desc.stubborn:0 "Meus olhos permanecem fechados, minha cama impecável. Minha rotina é minha rotina e não vou mudá-la sem um motivo #EMP extremamente#! bom. Somente quando o mensageiro começa a perguntar novamente, eu me mexo."
 stress_threshold.3421.desc.zealous:0 "Continuo lendo [ROOT.GetCharacter.GetFaith.ReligiousText], cercado pelos símbolos sagrados da minha fé, suplicando a [ROOT.GetCharacter.GetFaith.HighGodName] por orientação. Somente quando fica claro que o mensageiro não vai embora, eu me viro."
 stress_threshold.3421.e.profligate.effect:0 "$stress_threshold.3421.e.profligate.gain$"
 stress_threshold.3421.e.profligate.gain:0 "Esvaziem o tesouro! Protejam os mercados!"
 stress_threshold.3421.f.comfort_eater.effect:0 "$stress_threshold.3421.f.comfort_eater.gain$"
 stress_threshold.3421.f.comfort_eater.gain:0 "Preparem uma refeição farta, vou sair em breve."
 stress_threshold.3421.g.drunkard.effect:0 "$stress_threshold.3421.g.drunkard.gain$"
 stress_threshold.3421.g.drunkard.gain:0 "Preparem um barril do melhor, vou sair em breve."
 stress_threshold.3421.h.hashishiyah.effect:0 "$stress_threshold.3421.h.hashishiyah.gain$"
 stress_threshold.3421.h.hashishiyah.gain:0 "Preparem um prato de bolos, vou sair em breve."
 stress_threshold.3421.i:0 "Deixem todos #EMP queimarem#!."
 stress_threshold.3421.t:0 "Crise Mental: Domínio da Devassidão"
 suspicious_sketcher_modifier:0 "Desenhista Suspeito"
 suspicious_sketcher_modifier_desc:0 "Este personagem sempre parece estar fazendo esboços e anotações no meio da conversa..."
 symbol_of_folly_modifier:0 "Símbolo da Loucura"
 symbol_of_folly_modifier_desc:0 "A capa mais fabulosa deste personagem é um símbolo de seu dever negligenciado."
 tragic_drunk_modifier:0 "Bêbado Trágico"
 tragic_drunk_modifier_desc:0 "Este personagem teme mais do que tudo o retorno da sobriedade."
 tragic_stoner_modifier:0 "Hashishiyah Trágico"
 tragic_stoner_modifier_desc:0 "$tragic_drunk_modifier_desc$"
 trying_to_buy_happiness_modifier:0 "Tentando Comprar Felicidade"
 trying_to_buy_happiness_modifier_desc:0 "Este personagem abafa seu passado comprando constantemente futilidades."
 uncontrolled_urban_fires_modifier:0 "Incêndios Urbanos Descontrolados"
 uncontrolled_urban_fires_modifier_desc:0 "Um grande incêndio praticamente destruiu uma das propriedades deste condado."
