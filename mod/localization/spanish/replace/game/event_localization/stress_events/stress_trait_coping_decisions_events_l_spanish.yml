l_spanish:
 stress_trait_coping_decisions.1001.a:0 "Eu - #EMP arroto#! Já me sinto melhor!"
 stress_trait_coping_decisions.1001.desc:0 "Mais uma taça, e meus ombros relaxam um pouco mais. #EMP É assim que eu devo passar meu tempo - estar sóbrio é sofrer."
 stress_trait_coping_decisions.1001.t:0 "Lidando com o Estresse: Beba!"
 stress_trait_coping_decisions.1002.a:0 "Beba, meu amigo!"
 stress_trait_coping_decisions.1002.desc:0 "\"[ROOT.Char.GetFirstNameNoTooltip]! Olá!\"\n\nDe repente, [Select_CString( fellow_drunkard.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fellow_drunkard'))], [fellow_drunkard.GetTitledFirstName], senta-se ao meu lado, copo na mão. Aparentemente, [fellow_drunkard.GetSheHe] também foi ao bar para relaxar, e passamos o resto da noite bebendo juntos.\n\nEu não me sentia tão relaxado há #EMP meses#!"
 stress_trait_coping_decisions.1002.t:0 "Lidando com o Estresse: Companheiro de Bebida!"
 stress_trait_coping_decisions.1003.desc:0 "Estou bebendo sozinho na taverna quando de repente vejo [Select_CString( original_drunkard.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('original_drunkard'))], [original_drunkard.GetTitledFirstName], se sentar à minha frente.\n\nRapidamente, vou até lá, e passamos o resto da noite bebendo juntos. [original_drunkard.GetSheHe|U] realmente sabe como se divertir!"
 stress_trait_coping_decisions.1003.t:0 "Companheiro de Bebida!"
 stress_trait_coping_decisions.1004.a:0 "Bem... tive uma boa noite de sono!"
 stress_trait_coping_decisions.1004.desc:0 "Acordo com minha cabeça apoiada em um travesseiro macio e vários corpos quentes ao meu lado. Que noite deve ter sido! Mal consigo me lembrar -\n\n#EMP Beeee!#!\n\n... Hm. Ao abrir os olhos, sou recebido por um olho estreito em um rosto muito #EMP branco#! e #EMP fofinho#!. De repente, meu travesseiro se levanta e vai embora, e meus companheiros de sono seguem abruptamente. Fico sozinho no feno."
 stress_trait_coping_decisions.1004.t:0 "Lidando com o Estresse: Manhãs Desajeitadas"
 stress_trait_coping_decisions.1501.a:0 "Isso é tudo que eu preciso."
 stress_trait_coping_decisions.1501.desc:0 "Recosto-me na cadeira enquanto pego casualmente outro bolo, o sabor suave aderindo à minha língua, uma névoa agradável lavando lentamente minhas preocupações.\n\nEu não me sentia tão calmo há #EMP semanas#!. Apenas... estar aqui. Com este prato de bolos cobertos de haxixe. Isso é o suficiente."
 stress_trait_coping_decisions.1501.t:0 "Lidando com o Estresse: Névoa Calmante"
 stress_trait_coping_decisions.2001.a:0 "Mais uma vez. Venha aqui, [ROOT.Char.Custom('AttractionGirlBoyPlural')]!"
 stress_trait_coping_decisions.2001.desc_ending:0 "\n\nMinha mente está mais calma do que esteve em #EMP semanas#!, mas ainda assim meu pulso acelera! Magnífico!"
 stress_trait_coping_decisions.2001.desc_man:0 "Me deito em um emaranhado de corpos, [ROOT.Char.Custom('AttractionWomanManIndef')] cavalgando sobre mim, enquanto a liberação - e o alívio - me percorrem."
 stress_trait_coping_decisions.2001.desc_woman:0 "Me deito em um emaranhado de corpos, [ROOT.Char.Custom('AttractionWomanManIndef')] em cima de mim, enquanto a liberação - e o alívio - me percorrem."
 stress_trait_coping_decisions.2001.t:0 "Lidando com o Estresse: Desejos Insaciáveis"
 stress_trait_coping_decisions.2002.a:0 "Por favor... alguém... traga-me roupas!"
 stress_trait_coping_decisions.2002.b:0 "[rival.GetFirstNameNoTooltip]! Seu traidor!"
 stress_trait_coping_decisions.2002.desc:0 "\n\nLevanto-me para me vestir, mas algo parece estar faltando. Algo bastante importante. Algo como #EMP todas as minhas coisas#!! O quarto está limpo, não há vestígios de roupas ou bolsa.\n\n"
 stress_trait_coping_decisions.2002.desc_ending:0 "Ah, ess[Select_CString( ROOT.Char.IsFemale, 'e', 'a' )] [ROOT.Char.Custom('AttractionWomanMan')] maldit[Select_CString( ROOT.Char.IsFemale, 'o', 'a' )]!"
 stress_trait_coping_decisions.2002.desc_ending_rival:0 "No chão, encontro um bilhete: #EMP \"Espero que tenha aproveitado [Select_CString( ROOT.Char.IsFemale, 'o', 'a' )] [ROOT.Char.Custom('AttractionWomanMan')] que lhe enviei. Seu rival, [rival.GetTitledFirstName].\"#!"
 stress_trait_coping_decisions.2002.desc_man:0 "Acordo após uma noite incrível cheia de paixão. E aquel[Select_CString( ROOT.Char.IsFemale, 'e', 'a' )] [ROOT.Char.Custom('AttractionWomanMan')], insistindo em ficar mais tempo do que qualquer outra pessoa, me cavalgando até que eu adormeça... #EMP Ufa#!, foi uma #EMP experiência#!!"
 stress_trait_coping_decisions.2002.desc_woman:0 "Acordo após uma noite incrível cheia de paixão. E aquel[Select_CString( ROOT.Char.IsFemale, 'e', 'a' )] [ROOT.Char.Custom('AttractionWomanMan')], insistindo em ficar mais tempo do que qualquer outra pessoa, me satisfazendo até que eu adormeça... #EMP Ufa#!, foi uma #EMP experiência#!!"
 stress_trait_coping_decisions.2002.t:0 "Lidando com o Estresse: O Preço da Paixão"
 stress_trait_coping_decisions.2004.a:0 "Um[Select_CString( baby.IsFemale, 'a', '' )] [baby.Custom('GetDaughterSon')]! #EMP M[Select_CString( baby.IsFemale, 'inha', 'eu' )]#! [baby.Custom('GetDaughterSon')]!"
 stress_trait_coping_decisions.2004.b:0 "Pobre mulher confusa, cuidarei dessa criança mesmo assim..."
 stress_trait_coping_decisions.2004.c:0 "O que acha que sou? Guardas!"
 stress_trait_coping_decisions.2004.desc:0 "Sou abordado de repente, certa tarde, por uma camponesa segurando um bebê, lágrimas escorrendo pelo rosto [prostitute.GetHerHim].\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip]!\" ela repreende, \"Suas travessuras não são isentas de consequências! [Select_CString( baby.IsFemale, 'Esta pequena', 'Este pequeno' )] [baby.Custom('GirlBoy')] é #EMP s[Select_CString( baby.IsFemale, 'ua', 'eu' )]#!!\"\n\nQuase engasgo — mas reconheço o rosto [prostitute.GetHerHim], o corpo [prostitute.GetHerHim], brilhando suavemente à luz de velas em algum antro de iniquidade...?"
 stress_trait_coping_decisions.2004.t:0 "Lidando com o Estresse: Consequências"
 stress_trait_coping_decisions.2501.a:0 "Estou verdadeiramente em paz!"
 stress_trait_coping_decisions.2501.desc:0 "Enquanto me dirijo lentamente para o meu tranquilo [ROOT.Char.Custom('GetChamber')], finalmente me encontro completamente sozinho. Respiro profundamente. E solto o ar.\n\nOs servos foram instruídos a não deixar ninguém me perturbar, aconteça o que acontecer, e enquanto meus ombros relaxam, sei que isso é exatamente o que eu precisava."
 stress_trait_coping_decisions.2501.t:0 "Lidando com o Estresse: Sozinho"
 stress_trait_coping_decisions.3001.a:0 "E #EMP você#!! Não pense que não estou vendo você!"
 stress_trait_coping_decisions.3001.a_target:0 "A expressão no rosto de [target_character.GetHerHis]...!"
 stress_trait_coping_decisions.3001.desc:0 "Assim que o [ROOT.Char.Custom('GetCourt'|l)] se reúne, eu sorrio [ROOT.Char.Custom('quirk_neg_adverb')] – chegou a hora.\n\n\"Você, ali! Você nasceu assim, um rufião, ou isso aconteceu mais tarde na vida?"
 stress_trait_coping_decisions.3001.desc_has_target_character:0 "Assim que todos se sentam e [target_character.GetTitledFirstName] começa a falar, eu sorrio [ROOT.Char.Custom('quirk_neg_adverb')].\n\n\"[target_character.GetTitledFirstNameNoTooltip], desculpe interromper, mas por que você é sempre [target_character.Custom2('InsultNoun', ROOT.Char)] [target_character.Custom2('InsultAdjectiveArticle', ROOT.Char)]?"
 stress_trait_coping_decisions.3001.desc_has_vassals:0 "Assim que todos os vassalos estiverem sentados e [vassal.GetTitledFirstName] começar a falar, sorrio [ROOT.Char.Custom('quirk_neg_adverb')].\n\n\"[vassal.GetTitledFirstNameNoTooltip], desculpe interromper, mas por que você sempre é um[Select_CString( vassal.IsFemale, 'a', '' )] [vassal.Custom2('InsultNoun', ROOT.Char)] tão [vassal.Custom2('InsultAdjectiveArticle', ROOT.Char)]? E você, [vassal_2.GetTitledFirstName], você nasceu um[Select_CString( vassal_2.IsFemale, 'a', '' )] [vassal_2.Custom2('InsultNoun', ROOT.Char)], ou isso se desenvolveu mais tarde na vida?\""
 stress_trait_coping_decisions.3001.desc_vassal:0 "\"[vassal.GetTitledFirstName], [Select_CString( vassal.IsFemale, 'minha cara', 'meu caro' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))]!\" Sorrio [ROOT.Char.Custom('quirk_neg_adverb')].\n\n\"Você nasceu como um[Select_CString( vassal.IsFemale, 'a', '' )] [vassal.Custom2('InsultNoun', ROOT.Char)] [vassal.Custom2('InsultAdjectiveArticle', ROOT.Char)], ou isso se desenvolveu mais tarde na vida?\""
 stress_trait_coping_decisions.3001.t:0 "Lidando com o Estresse: Deixe Sair"
 stress_trait_coping_decisions.3501.a:0 "Hng– Doce, doce dor!"
 stress_trait_coping_decisions.3501.desc:0 "#EMP Estalo!#!\n\nO chicote cai nas minhas costas, e eu estremeço com a clareza que ele traz. Dor é tudo o que sinto, e dor é tudo o que está em minha mente.\n\n#EMP Estalo!#!\n\n#EMP Estalo!#!"
 stress_trait_coping_decisions.3501.t:0 "Lidando com o Estresse: Agonia Atarática"
 stress_trait_coping_decisions.4001.a:0 "Dois desses. Não, espere. #EMP Três!#!"
 stress_trait_coping_decisions.4001.desc:0 "Eu caminho pelo mercado em [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], eufórico de excitação – tecidos, joias, fios e bugigangas... Eu quero tudo!\n\nAcabo em uma barraca atendida por um [ROOT.Char.Custom('RandomWomanMan')] velho que é muito compreensivo com a minha situação e promete me ajudar a escolher."
 stress_trait_coping_decisions.4001.t:0 "Lidando com o Estresse: O Preço que Pagamos"
 stress_trait_coping_decisions.4501.a:0 "[ROOT.Char.GetFaith.HighGodName] é generoso!"
 stress_trait_coping_decisions.4501.desc:0 "Eu saio do [ROOT.Char.GetFaith.HouseOfWorship] com uma bolsa leve e um coração ainda mais leve.\n\nApenas o pensamento de todas as pessoas necessitadas que esse dinheiro pode ajudar é suficiente para me tranquilizar!"
 stress_trait_coping_decisions.4501.t:0 "Lidando com o Estresse: O Dom de Dar"
 stress_trait_coping_decisions.5001.a:0 "Sinto-me muito mais leve!"
 stress_trait_coping_decisions.5001.desc:0 "\"Eu... Tenho sido atormentado por pensamentos pecaminosos ultimamente. Ouçam-me...\""
 stress_trait_coping_decisions.5001.desc_ending:0 "\n\nO murmúrio surpreso que se espalha pela multidão não faz nada para impedir o alívio que sinto."
 stress_trait_coping_decisions.5001.desc_opening:0 "Reuni a [ROOT.Char.Custom('GetCourt')|l] hoje porque tenho algo a confessar."
 stress_trait_coping_decisions.5001.desc_secret:0 "Eu... Eu [secret.Custom('SecretDescriptionFirstPerson')].\""
 stress_trait_coping_decisions.5001.desc_sin:0 "Eu... Eu não resisto ao meu lado [ROOT.Char.Custom('SinfulTrait')|l] tanto quanto seria adequado.\""
 stress_trait_coping_decisions.5001.t:0 "Lidando com o Estresse: Confissão"
 stress_trait_coping_decisions.5002.a:0 "De qualquer forma... Sinto-me muito mais leve!"
 stress_trait_coping_decisions.5002.desc:0 "Eu... Eu [secret.Custom('SecretDescriptionFirstPerson')]. Não, espere... Isso não fui eu - foi [secret_character.GetTitledFirstName]!\"\n\nO grito indignado [Select_CString( secret_character.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secret_character'))] não faz nada para impedir meu alívio."
 stress_trait_coping_decisions.5501.a:0 "Traga-me mais [ROOT.Char.Custom('FavoriteTreat')]!"
 stress_trait_coping_decisions.5501.desc:0 "À medida que outro prato de [ROOT.Char.Custom('FavoriteTreat')] é colocado à minha frente, sinto-me relaxar.\n\nNada acalma a mente como uma boa comida!"
 stress_trait_coping_decisions.5501.t:0 "Lidando com o Estresse: Comer!"
 stress_trait_coping_decisions.5502.a:0 "E tenho sobremesa me esperando lá em cima!"
 stress_trait_coping_decisions.5502.a_landless:0 "Agora #EMP isso#! é alívio."
 stress_trait_coping_decisions.5502.desc:0 "Enquanto espero que os cozinheiros preparem minha refeição, encontro um [ROOT.Char.Custom('lowly_servant_type')] nos corredores.\n\n[ROOT.Char.GetSheHe|U] tenta se desculpar, mas não podemos deixar isso passar, não é? Acabei de encontrar a melhor refeição imaginável!\n\nEu a(le) conduzo até o porão, onde ninguém pode ouvir os gritos. E então eu #EMP me deleito#!!"
 stress_trait_coping_decisions.5502.desc_landless:0 "Vagando pelo acampamento enquanto espero minha refeição ser preparada, encontro um jovem de um dos assentamentos próximos.\n\n[ROOT.Char.GetSheHe|U] tenta se desculpar, mas não podemos deixar isso passar, não é? Acabei de encontrar a melhor refeição imaginável!\n\nEu a(le) conduzo até a borda da selva, onde um grito ou dois não farão diferença. E então eu #EMP me deleito#!!"
 stress_trait_coping_decisions.5502.t:0 "Lidando com o Estresse: Banquete Surpresa"
 stress_trait_coping_decisions.6001.a:0 "Sim, está tudo bem."
 stress_trait_coping_decisions.6001.desc:0 "\"Informe o cozinheiro que eu não irei, no futuro previsível, participar das refeições.\"\n\nAssim que as palavras saem da minha boca, sinto-me mais leve - sem mais distrações, sem mais precisar engolir comida que mal consigo suportar! Agora posso focar no que é importante."
 stress_trait_coping_decisions.6001.t:0 "Lidando com o Estresse: Abandonar a Comida"
 stress_trait_coping_decisions.6501.a:0 "Mergulho minha caneta mais uma vez..."
 stress_trait_coping_decisions.6501.desc:0 "Pego uma caneta e abro meu diário.\n\nA cada frase que preenche o papel, sinto meus ombros relaxando - a clareza que esse processo traz é incomparável!"
 stress_trait_coping_decisions.6501.t:0 "Lidando com o Estresse: Tinta Fluindo"
 stress_trait_coping_decisions.7001.a:0 "Minha mente está tranquila."
 stress_trait_coping_decisions.7001.desc:0 "Depois de uma longa conversa com m[Select_CString( confidant.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('confidant'))] [confidant.GetTitledFirstName], consigo sentir meus pensamentos se acalmando."
 stress_trait_coping_decisions.7001.desc_ending:0 "No entanto, ao retornar para a [ROOT.Char.Custom('GetCourt')|l], posso ver o ciúmes nos rostos dos [ROOT.Char.Custom('GetCourtierPlural')|l]... Afinal, quem não gostaria de ter a confiança de [confidant.GetFirstNamePossessive]?"
 stress_trait_coping_decisions.7001.t:0 "Lidando com o Estresse: Confidenciar"
 stress_trait_coping_decisions.7002.desc:0 "Depois de uma conversa longa e exaustiva, consigo sentir meus pensamentos se acalmando."
 stress_trait_coping_decisions.7501.a:0 "Mais uma volta!"
 stress_trait_coping_decisions.7501.desc:0 "Enquanto termino mais uma volta ao redor da minha [ROOT.Char.Custom('ResidenceBuilding')|l], já posso sentir minhas preocupações caindo junto com o suor.\n\nAlgumas pessoas dizem que eu fujo dos meus problemas, mas eu digo que corro em direção às soluções!"
 stress_trait_coping_decisions.7501.t:0 "$stress_trait_coping_decisions.activity$ Suar para Resolver"
 stress_trait_coping_decisions.7502.a:0 "[random_artifact.GetNameNoTooltip] será o suficiente!"
 stress_trait_coping_decisions.7502.b:0 "Vou encomendar uma [ROOT.Char.Custom('signature_weapon')] de treinamento extra pesada."
 stress_trait_coping_decisions.7502.c.flavor:0 "Lá vai você!"
 stress_trait_coping_decisions.7502.c:0 "[lifted_child.GetFirstNameNoTooltip], venha aqui!"
 stress_trait_coping_decisions.7502.d:0 "Não há necessidade de melhoria neste momento."
 stress_trait_coping_decisions.7502.desc:0 "'Isso não é suficiente!' penso comigo mesm[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], enquanto deixo de lado a [ROOT.Char.Custom('signature_weapon')] de treinamento. Tenho treinado sem parar, mas não estou ficando cansad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] - preciso de um desafio mais difícil!\n\nSim... algo maior... ou talvez mais pesado!\n\nAlgo que certamente me canse!"
 stress_trait_coping_decisions.7502.failure:0 "Você superestima sua própria força."
 stress_trait_coping_decisions.7502.success:0 "O desafio extra te revigora."
 stress_trait_coping_decisions.7502.t:0 "$stress_trait_coping_decisions.activity$ Quanto mais pesado, melhor"
 stress_trait_coping_decisions.7503.a.tt:0 "Você acredita que a superioridade pela pura habilidade vencerá."
 stress_trait_coping_decisions.7503.a:0 "Sugerir que os dois lutem."
 stress_trait_coping_decisions.7503.b.tt:0 "Você acredita que uma combinação de habilidade e técnica marcial levará à vitória."
 stress_trait_coping_decisions.7503.b:0 "Desafiar [random_knight.GetSheHe] para um combate de treino."
 stress_trait_coping_decisions.7503.c.tt:0 "Você acredita que uma combinação de habilidade e saúde ajudará você a superar seus concorrentes."
 stress_trait_coping_decisions.7503.c:0 "\"Que tal uma corrida a pé?\""
 stress_trait_coping_decisions.7503.d:0 "Concentre-se em concluir sua rotina de treinamento regular."
 stress_trait_coping_decisions.7503.desc:0 "Estou no meio do meu treinamento quando avisto [random_knight.GetTitledFirstName], também se exercitando. Observo [random_knight.GetSheHe] de cima a baixo - não apenas [random_knight.GetSheHe] parece estar em boa saúde, mas também em forma física impecável. Adoraria medir minha habilidade com a [random_knight.GetHerHim], mas de que forma?\n\nDevo levar em conta vários fatores se quiser vencer? Força bruta, ou uma combinação que pode incluir resistência ou astúcia?"
 stress_trait_coping_decisions.7503.failure:0 "[random_knight.GetTitledFirstNameNoTooltip] vence o desafio."
 stress_trait_coping_decisions.7503.success:0 "Você emerge vitorioso!"
 stress_trait_coping_decisions.7503.t:0 "$stress_trait_coping_decisions.activity$ Competição Amigável"
 stress_trait_coping_decisions.7504.a:0 "Devo treinar com alguém cuja habilidade eu invejo. Como [ideal_character.GetFirstNameNoTooltip]!"
 stress_trait_coping_decisions.7504.b:0 "[similar_character.GetFirstNameNoTooltip] tem uma aparência física semelhante e pode seguir minha rotina."
 stress_trait_coping_decisions.7504.c:0 "Ver [not_ideal_character.GetFirstNameNoTooltip] lutando será motivador."
 stress_trait_coping_decisions.7504.d:0 "Não há necessidade de companhia durante o treinamento."
 stress_trait_coping_decisions.7504.desc:0 "Às vezes é difícil encontrar motivação para permanecer consistente ao me exercitar sozinho.\n\nEu poderia tentar encontrar um parceiro, que não apenas me motivaria nos dias ruins, mas também seria alguém com quem eu possa me comparar ao acompanhar meu próprio progresso.\n\nQue tipo de companheiro seria mais adequado para mim? Alguém que eu admiro, alguém que me mantenha alerta ou talvez alguém que eu saiba que nunca devo aspirar ser?"
 stress_trait_coping_decisions.activity:0 "Lidando com o Estresse:"
 stress_trait_coping_decisions_2004_a_custom:0 "Toda [spouse|E], [lover|E] e [child|E] legítima"
