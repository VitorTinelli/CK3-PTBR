l_spanish:
 stress_1011_adultery_condemn_tt:0 "#EMP [new_faith.GetName] condena o adultério de [stress_character.Custom('FemaleMale')|U] mais severamente do que [stress_character.GetRite.GetName]#!"
 stress_1011_adultery_embrace_tt:0 "#EMP [new_faith.GetName] aceita mais o adultério de [stress_character.Custom('FemaleMale')|U] do que [stress_character.GetRite.GetName]#!"
 stress_1011_homosexuality_condemn_tt:0 "#EMP [new_faith.GetName] condena sua [sexuality|E] mais severamente do que [stress_character.GetRite.GetName]#!"
 stress_1011_homosexuality_embrace_tt:0 "#EMP [new_faith.GetName] aceita mais a sua [sexuality|E] do que [stress_character.GetRite.GetName]#!"
 stress_1011_lust_condemn_tt:0 "#EMP [new_faith.GetName] condena a luxúria mais severamente do que [stress_character.GetRite.GetName]#!"
 stress_1011_lust_embrace_tt:0 "#EMP [new_faith.GetName] abraça a luxúria mais do que [stress_character.GetRite.GetName]#!"
 stress_threshold.0010.text:0 "Você ganhou um [stress_level|E]"
 stress_threshold.0010.toast:0 "Sobrecarregado pelo Estresse"
 stress_threshold.0400.toast:0 "Você ultrapassou seu limite de [stress|E] e foi resetado para o [stress_level|E] 3"
 stress_threshold.1001.contrite.effect:0 "Não posso mais esconder meus segredos!"
 stress_threshold.1001.contrite.gain:0 "Devo confessar todos os meus males!"
 stress_threshold.1001.desc:0 "A culpa e a vergonha têm me perseguido ultimamente. Todos os meus pecados, defeitos, falhas... Esses pensamentos sombrios me distraem das minhas responsabilidades e me mantêm acordad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a noite toda.\n\nSinto que devo fazer algo para acabar com essa angústia mental, mas o que poderia ajudar?"
 stress_threshold.1001.drunkard.effect:0 "Vou beber até esses pensamentos sumirem."
 stress_threshold.1001.drunkard.gain:0 "Será que umas bebidas ajudariam?"
 stress_threshold.1001.endure:0 "Devo ser forte e resistir a esses impulsos!"
 stress_threshold.1001.exercise.effect:0 "Um bom exercício queimará esses desejos."
 stress_threshold.1001.flagellant.effect:0 "Mereço ser [Select_CString( CHARACTER.IsFemale, 'punida', 'punido' )]! Por tudo!"
 stress_threshold.1001.flagellant.gain:0 "O açoite expulsará meus pecados."
 stress_threshold.1001.hashishiyah.effect:0 "Uma noite relaxante com uma bandeja de bolos de haxixe ajudará."
 stress_threshold.1001.hashishiyah.gain:0 "Um pouco de haxixe me tranquilizará..."
 stress_threshold.1001.improvident.effect:0 "Outros precisam mais do meu ouro do que eu!"
 stress_threshold.1001.improvident.gain:0 "Doar para caridade compensará meus pecados."
 stress_threshold.1001.journaller.effect:0 "Preciso de uma noite sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] em minha oficina."
 stress_threshold.1001.journaller.gain:0 "Escrever minhas preocupações me ajudará a me concentrar."
 stress_threshold.1001.t:0 "Colapso Mental: Pensamentos Sombrios"
 stress_threshold.1011.conversion.christianity:0 "Jesus, livra-me das tentações!"
 stress_threshold.1011.conversion.embracing:0 "[new_faith.GetNameNoTooltip] permitiria meus desejos..."
 stress_threshold.1011.conversion.forbidding:0 "[new_faith.GetNameNoTooltip]! Livre-me dos meus impulsos imundos!"
 stress_threshold.1011.conversion.forbidding_sodomy:0 "[new_faith.GetNameNoTooltip]! Livre-me da minha imunda luxúria de sodomia!"
 stress_threshold.1011.conversion.interfaith:0 "Uma nova visão de [new_faith.HighGodName] pode me ajudar?"
 stress_threshold.1011.conversion.intrafaith:0 "Será que [new_faith.HighGodName] pode me ajudar onde [ROOT.Char.GetFaith.HighGodName] falhou?"
 stress_threshold.1011.conversion.judaism:0 "Os antigos mandamentos me ajudarão a manter-me pur[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 stress_threshold.1011.desc:0 "Ultimamente, sinto como se estivesse constantemente distraíd[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por pensamentos lascivos e fantasias eróticas. Com todas as dificuldades da minha vida cotidiana, é fácil se perder nos meus sonhos e esquecer a realidade.\n\nEstes desejos claramente estão interferindo na minha vida, mas o que devo fazer a respeito?"
 stress_threshold.1011.endure:0 "Eu aperto os lábios e tento continuar concentrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]!"
 stress_threshold.1011.exercise.gain:0 "Outra forma de liberar pressão pode ajudar..."
 stress_threshold.1011.rakish.effect:0 "Que ninguém além de mim entre no bordel esta noite."
 stress_threshold.1011.rakish.gain:0 "Uma viagem ao bordel trará alívio!"
 stress_threshold.1011.rakish.tt:0 "Comportamento tão desavergonhado traz riscos inerentes..."
 stress_threshold.1011.reclusive.effect:0 "Só em solidão encontrarei paz!"
 stress_threshold.1011.reclusive.gain:0 "Devo me isolar para evitar a tentação!"
 stress_threshold.1011.t:0 "Colapso Mental: Desejos Licenciosos"
 stress_threshold.1501.a:0 "Não suporto mais [scoped_helper.GetSheHe]!"
 stress_threshold.1501.b:0 "Acho que vou evitar o almoço novamente."
 stress_threshold.1501.c:0 "Só quero ficar em paz."
 stress_threshold.1501.d:0 "Por que comer quando tudo parece sem sabor?"
 stress_threshold.1501.e:0 "Não posso permitir que esses pensamentos sombrios me distraiam."
 stress_threshold.1501.f.flavor:0 "E enquanto sou atormentado pela dúvida, por uma vergonha insone... aqueles que seguem [new_faith.GetNameNoTooltip] parecem tão satisfeitos."
 stress_threshold.1501.f:0 "A vida como [scoped_ruler.GetFaith.GetAdherentName] não faz sentido."
 stress_threshold.1501.faith.desc:0 "\n\nAté as palavras dos [scoped_ruler.GetFaith.AltPriestTermPlural] soam vazias para mim."
 stress_threshold.1501.fallback.desc:0 "\n\nO ritmo monótono desta vida se tornou insuportável."
 stress_threshold.1501.helper.desc:0 "[scoped_helper.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] me espera, mas sei que suas palavras não me trarão conforto."
 stress_threshold.1501.intro.desc:0 "A cada novo dia, está mais difícil encontrar uma razão para me levantar da cama."
 stress_threshold.1501.nohelper.desc:0 "Após me arrastar para fora da cama, não encontro interesse nos negócios triviais da [ROOT.Char.Custom('GetCourt')], nem prazer em tomar meu café da manhã."
 stress_threshold.1501.t:0 "Colapso Mental: Nada Importa"
 stress_threshold.1502.a:0 "Você não passa de um[Select_CString( scoped_courtier.IsFemale, 'a', '' )] [scoped_courtier.Custom2('InsultNoun', ROOT.Char)] [scoped_courtier.Custom2('InsultAdjective', ROOT.Char)]!"
 stress_threshold.1502.b:0 "Guarda! Traga-me outro prisioneiro!"
 stress_threshold.1502.c:0 "Por que vocês têm que ser tão #EMP idiotas#! e incompetentes?!"
 stress_threshold.1502.courtier.desc:0 "\n\n[scoped_courtier.GetFirstName], em particular, tem se tornado insuportável ultimamente. Mal suporto ouvir a tagarelice incessante [Select_CString( scoped_courtier.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scoped_courtier'))]."
 stress_threshold.1502.d:0 "Uma visita ao [ROOT.Char.Custom('GetDungeon')] vai clarear minha mente..."
 stress_threshold.1502.e:0 "Só preciso aguentar."
 stress_threshold.1502.f:0 "E se eu escrever um diário sobre minhas desventuras?"
 stress_threshold.1502.g:0 "[scoped_ruler.GetFaith.HighGodName], eu preciso de uma bebida!"
 stress_threshold.1502.intro.desc:0 "Por que eu #EMP sempre#! tenho que fazer tudo sozinho? Como posso ser esperado para administrar os assuntos do [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] quando metade da minha [ROOT.Char.Custom('GetCourt')|l] é incapaz de seguir minhas ordens, e a outra nem sequer as entende?"
 stress_threshold.1502.nocourtier.desc:0 ""
 stress_threshold.1502.t:0 "Colapso Mental: Ressentimento"
 stress_threshold.1503.a.a:0 "Talvez algumas jóias a mais?"
 stress_threshold.1503.a.b:0 "Preciso de uma coroa maior!"
 stress_threshold.1503.a.c:0 "Cansei das minhas roupas..."
 stress_threshold.1503.a.d:0 "Um novo e poderoso garanhão!"
 stress_threshold.1503.a.e:0 "Um novo quadro de um artista famoso!"
 stress_threshold.1503.b:0 "Esta dor só pode ser curada com uma coisa: [scoped_ruler.Custom('GetExpensiveMeal')]"
 stress_threshold.1503.desc:0 "Nada do que eu faço me satisfaz mais. Apesar de todos os meus esforços, não consigo encontrar nem felicidade nem paz de espírito. É como se algo estivesse... faltando.\n\nO que poderia preencher esse buraco que corrói minha alma?"
 stress_threshold.1503.e:0 "Se pelo menos houvesse algo que eu pudesse fazer..."
 stress_threshold.1503.t:0 "Colapso Mental: Vazio Interior"
 stress_threshold.1504.a:0 "Eles não podem me deixar em paz nem por um momento?"
 stress_threshold.1504.b:0 "Preciso de algo que reequilibre meus humores..."
 stress_threshold.1504.desc:0 "Às vezes, sinto como se o mundo inteiro repousasse pesadamente sobre meus ombros. Minhas responsabilidades como [scoped_ruler.GetTitleAsNameNoTooltip] parecem intermináveis...\n\nDe fato, mal tenho um momento para mim mesmo."
 stress_threshold.1504.e:0 "Este é o meu dever, afinal."
 stress_threshold.1504.f:0 "Estou cercad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por idiotas!"
 stress_threshold.1504.g:0 "Vou colocar meus pensamentos por escrito."
 stress_threshold.1504.h:0 "Sela meu cavalo, preciso sair para um passeio!"
 stress_threshold.1504.i:0 "Preciso de um momento de silêncio para pensar."
 stress_threshold.1504.t:0 "Colapso Mental: Uma Tarefa Interminável"
 stress_threshold.1601.athletic.effect:0 "Sempre me sinto mais tranquil[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] após um pouco de exercício!"
 stress_threshold.1601.athletic.gain:0 "Me disseram que um corpo saudável propicia uma mente saudável..."
 stress_threshold.1601.burdened.effect:0 "Sonhar com coisas boas sempre ajuda!"
 stress_threshold.1601.burdened.gain:0 "Sonhar com um lugar melhor pode ajudar."
 stress_threshold.1601.comfort_eater.effect:0 "Um estômago cheio sempre me faz sentir concentrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 stress_threshold.1601.comfort_eater.gain:0 "Um estômago cheio pode me ajudar a me concentrar."
 stress_threshold.1601.confider.effect:0 "\"[friend.GetFirstNameNoTooltip], por favor, escute-me como sempre faz!\""
 stress_threshold.1601.confider.gain:0 "\"[friend.GetFirstNameNoTooltip], [Select_CString( friend.IsFemale, 'minha amiga', 'meu amigo' )], ajude-me a organizar meus pensamentos!\""
 stress_threshold.1601.contrite.effect:0 "Devo confessar minhas más ações! Isso me trará clareza."
 stress_threshold.1601.contrite.gain:0 "Vou limpar minha mente confessando minhas más ações."
 stress_threshold.1601.desc:0 "Não consigo me concentrar, meus pensamentos estão correndo em círculos! Eu tenho que supervisionar o [ROOT.Char.Custom('GetCourt')|l], tenho que observar as tropas, eu tenho que...\n\nComo posso encontrar descanso quando até meus pensamentos me traem assim?!"
 stress_threshold.1601.drunkard.effect:0 "Sempre me sinto mais centrado depois de um trago."
 stress_threshold.1601.drunkard.gain:0 "Vou me sentir mais centrado depois de um trago..."
 stress_threshold.1601.endure_no_option:0 "Eu tenho que... eu tenho que aguentar. Não posso fazer nada..."
 stress_threshold.1601.flagellant.effect:0 "Nada como a dor para focar os pensamentos."
 stress_threshold.1601.flagellant.gain:0 "Dizem que a dor aviva a mente..."
 stress_threshold.1601.hashishiyah.effect:0 "Não me sinto mais tranquilo do que depois de uma noite com alguns bolos de haxixe."
 stress_threshold.1601.hashishiyah.gain:0 "Com sorte, um pouco de haxixe vai acalmar minha mente..."
 stress_threshold.1601.improvident.effect:0 "Fazer uma doação para uma boa causa sempre acalma minha mente."
 stress_threshold.1601.improvident.gain:0 "Será que um ato claro de caridade libera meus pensamentos?"
 stress_threshold.1601.inappetetic.effect:0 "Vou matar a fome de qualquer distração!"
 stress_threshold.1601.inappetetic.gain:0 "Pensar em comida é uma distração."
 stress_threshold.1601.irritable.effect:0 "Vou mandar todo mundo ficar #EMP em silêncio#!"
 stress_threshold.1601.irritable.gain:0 "Talvez eu pudesse pensar se todo mundo #EMP ficasse em silêncio#!!"
 stress_threshold.1601.journaller.effect:0 "Escrever meus pensamentos sempre me traz clareza!"
 stress_threshold.1601.journaller.gain:0 "Escrever meus pensamentos deveria me dar um pouco de clareza..."
 stress_threshold.1601.profligate.effect:0 "Sempre me sinto mais concentrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] depois de comprar algo bonito!"
 stress_threshold.1601.profligate.gain:0 "Se eu comprasse algo brilhante para me concentrar..."
 stress_threshold.1601.rakish.effect:0 "Uma visita a um bordel vai me ajudar a focar meus pensamentos!"
 stress_threshold.1601.rakish.gain:0 "Talvez eu possa me concentrar na paixão..."
 stress_threshold.1601.reclusive.effect:0 "Sempre consigo me concentrar quando estou sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]..."
 stress_threshold.1601.reclusive.gain:0 "Talvez, se eu estivesse sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], pudesse me concentrar..."
 stress_threshold.1601.t:0 "Colapso Mental: Dando Voltas na Mesma Coisa"
 stress_threshold.1602.athletic.effect:0 "Uma corrida sempre acalma minhas emoções."
 stress_threshold.1602.athletic.gain:0 "Correrei até não sentir nada além de satisfação."
 stress_threshold.1602.burdened.effect:0 "Se eu deixar meus pensamentos vagarem, minha ansiedade vai diminuir."
 stress_threshold.1602.burdened.gain:0 "Se eu pudesse pensar em outra coisa, #EMP qualquer coisa#!, que não isso."
 stress_threshold.1602.comfort_eater.effect:0 "Quando como, só sinto bem-estar."
 stress_threshold.1602.comfort_eater.gain:0 "Pelo menos, a comida me proporciona um claro sentimento de bem-estar."
 stress_threshold.1602.confider.effect:0 "Falar com [friend.GetFirstNameNoTooltip] geralmente ajuda!"
 stress_threshold.1602.confider.gain:0 "Falar sobre isso com [friend.GetFirstNameNoTooltip] pode ajudar."
 stress_threshold.1602.contrite.effect:0 "Sempre me sinto mais equilibrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] depois de confessar!"
 stress_threshold.1602.contrite.gain:0 "Pode ser que eu me acalme se confessar meus pecados."
 stress_threshold.1602.desc:0 "Minhas emoções se tornam mais instáveis a cada dia que passa. Uma alegria avassaladora substitui a mais profunda tristeza de um momento para o outro, e meu [ROOT.Char.Custom('GetCourt')|l] e eu ficamos exaustos.\n\nSe ao menos eu pudesse encontrar uma maneira de domar este turbilhão interior!"
 stress_threshold.1602.drunkard.effect:0 "Com a bebida, eu sempre posso deixar as emoções para trás!"
 stress_threshold.1602.drunkard.gain:0 "Com bastante bebida, todas as emoções se desvanecem…"
 stress_threshold.1602.flagellant.effect:0 "Só sentirei dor, nada mais."
 stress_threshold.1602.flagellant.gain:0 "Talvez eu possa me livrar de todas as emoções exceto a dor..."
 stress_threshold.1602.hashishiyah.effect:0 "O haxixe sempre me ajuda a me concentrar."
 stress_threshold.1602.hashishiyah.gain:0 "Algum haxixe pode me trazer paz."
 stress_threshold.1602.improvident.effect:0 "Sempre me sinto mais centrado depois de fazer alguma doação..."
 stress_threshold.1602.improvident.gain:0 "A gratidão pela caridade abafará tudo o mais."
 stress_threshold.1602.inappetetic.effect:0 "Matarei toda emoção de fome."
 stress_threshold.1602.inappetetic.gain:0 "Se eu não comer, não terei energia para sentir..."
 stress_threshold.1602.irritable.effect:0 "Vou dizer o que penso sobre suas #EMP desconfianças#!"
 stress_threshold.1602.irritable.gain:0 "Seria mais fácil se as pessoas #EMP me deixassem em paz#!!"
 stress_threshold.1602.journaller.effect:0 "Escrever sobre meus sentimentos sempre funciona!"
 stress_threshold.1602.journaller.gain:0 "Escreverei até me sentir concentrado."
 stress_threshold.1602.profligate.effect:0 "Algo novo e brilhante só me trará pura alegria!"
 stress_threshold.1602.profligate.gain:0 "Algo novo... algo brilhante... pode me concentrar."
 stress_threshold.1602.rakish.effect:0 "Nada me concentra como a força do desejo e da luxúria!"
 stress_threshold.1602.rakish.gain:0 "Um forte desejo pode ajudar a manter outros sentimentos à distância..."
 stress_threshold.1602.reclusive.effect:0 "Sempre consigo clareza quando estou sozinho."
 stress_threshold.1602.reclusive.gain:0 "Pode ser que eu me acalme se ficar sozinho..."
 stress_threshold.1602.t:0 "Colapso Mental: Emoções Turbulentas"
 stress_threshold.2001.arbitrary.effect:0 "Eu decido como as coisas são feitas aqui!"
 stress_threshold.2001.arbitrary.gain:0 "Eu sou [ROOT.Char.GetTitleAsNameNoTooltip], minha palavra é a lei!"
 stress_threshold.2001.desc:0 "Desgraçados ingratos! Eles não sabem os sacrifícios que faço por eles?\n\nTodo dia eu trabalho sem parar pelos interesses deste [ROOT.Char.Custom('GetRealmOrDomicile')|l], mas tudo o que qualquer um faz é reclamar e pedir mais!\n\nAgora [victim.GetFirstName] chega a questionar minhas ordens!?"
 stress_threshold.2001.endure:0 "Venha, seja paciente com eles..."
 stress_threshold.2001.imprison_victim:0 "Vamos ver o quão grato [victim.GetFirstNameNoTooltip] se sente no [ROOT.Char.Custom('GetDungeon')]!"
 stress_threshold.2001.t:0 "Colapso Mental: Ingratidão"
 stress_threshold.2101.desc:0 "Às vezes, sinto-me um estranho no meu próprio [ROOT.Char.Custom('GetCourt')|l].\n\nNão posso deixar de perceber os olhares estranhos que meus [ROOT.Char.Custom('GetCourtierPlural')|l] me lançam, o desconforto que preenche qualquer [ROOT.Char.Custom('GetRoom')|l] que entro... o que aconteceu com minha vida? Por que não sou bem-vindo entre os meus?"
 stress_threshold.2101.drunkard.effect:0 "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] pode ser meu único verdadeiro amigo."
 stress_threshold.2101.endure:0 "Talvez eu esteja imaginando tudo isso..."
 stress_threshold.2101.hashishiyah.effect:0 "Pelo menos este bolo com cobertura de haxixe não vai me julgar."
 stress_threshold.2101.t:0 "Colapso Mental: Marginalização"
 stress_threshold.2101.witch.effect:0 "Pelo menos eu sei que [ROOT.Char.GetFaith.WitchGodName] me entende."
 stress_threshold.2101.witch.gain:0 "Eu sou um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] desprezível, como [ROOT.Char.GetFaith.WitchGodName]."
 stress_threshold.2201.a:0 "Vocês me ouviram!"
 stress_threshold.2201.c:0 "Desculpe-me. Vou me controlar melhor."
 stress_threshold.2201.desc.calm:0 "E, normalmente, você é tão calm[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 stress_threshold.2201.desc.ending:0 "\""
 stress_threshold.2201.desc.insult:0 "\"Você pode ser um[Select_CString( character_to_yell_at.IsFemale, 'a', '' )] [character_to_yell_at.GetTitleAsName], [character_to_yell_at.GetFirstName], mas você também é [character_to_yell_at.Custom2('InsultNoun', ROOT.Char)] [character_to_yell_at.Custom2('InsultAdjectiveArticle', ROOT.Char)]!\"\n\n"
 stress_threshold.2201.desc.insult_adventurer:0 "Você pode ser meu [ROOT.Char.Custom('GetCourtier')], [character_to_yell_at.GetFirstName], mas você também é [character_to_yell_at.Custom2('InsultNoun', ROOT.Char)] [character_to_yell_at.Custom2('InsultAdjectiveArticle', ROOT.Char)]!\"\n\n"
 stress_threshold.2201.desc:0 "Eu hesito ao ver o rosto [Select_CString( character_to_yell_at.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('character_to_yell_at'))], mas... Mas eu sinto tanta #EMP raiva#! Sempre... e todo mundo está procurando confusão comigo...\n\n"
 stress_threshold.2201.desc_liege:0 "O que aconteceu com você, [ROOT.Char.GetTitledFirstNameNoTooltip]? Este comportamento é inaceitável."
 stress_threshold.2201.desc_vassal:0 "[Select_CString( ROOT.Char.IsFemale, 'Minha senhora', 'Meu senhor' )], qual é o significado desse comportamento?!"
 stress_threshold.2201.liege:0 "Desculpe, meu senhor. Eu me controlarei melhor."
 stress_threshold.2201.save:0 "Digam-me, como vocês responderiam a tal ataque?"
 stress_threshold.2201.save_tt:0 "Finjo que somente [character_to_yell_at.GetSheHe] estava testando"
 stress_threshold.2201.t:0 "Colapso Mental: Ira Ardente"
 stress_threshold.2202.a:0 "Eu vou revidar à altura, [stress_character.Custom2('InsultNoun', ROOT.Char)]!"
 stress_threshold.2202.b:0 "Até mesmo [stress_character.GetSheHe] está lutando... É tranquilizador."
 stress_threshold.2202.desc.liege:0 "A raiva não provocada expressa [Select_CString( stress_character.IsFemale, 'pela minha senhora', 'pelo meu senhor' )], [stress_character.GetTitledFirstName], foi uma surpresa completa."
 stress_threshold.2202.desc.other:0 "se comportar assim..."
 stress_threshold.2202.desc.other_relationship:0 "A raiva não provocada expressa [Select_CString( stress_character.IsFemale, 'pela minha', 'pelo meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('stress_character'))], [stress_character.GetTitledFirstName], foi uma surpresa completa."
 stress_threshold.2202.desc.rival:0 "quando perguntado para explicar, [stress_character.GetSheHe] apenas aumentou os insultos."
 stress_threshold.2202.desc.vassal:0 "A raiva não provocada expressa [Select_CString( stress_character.IsFemale, 'pela minha vassala', 'pelo meu vassalo' )], [stress_character.GetTitledFirstName], foi uma surpresa completa."
 stress_threshold.2202.desc:0 "[stress_character.GetSheHe|U] tem estado sob muito estresse ultimamente, mas"
 stress_threshold.2202.t:0 "Ira Ardente"
 stress_threshold.3001.desc:0 "Onde minha [ROOT.Char.Custom('GetCourt')|l] só lida com mentiras e falsidades, encontrei aqueles que afirmam estar dispostos a me dizer a verdade.\n\nEles vivem comigo. Na minha cabeça.\n\nEles dizem que sabem qual é a verdade...\n\nSerá que realmente sabem?"
 stress_threshold.3001.endure:0 "Apenas... devo não ouvi-los..."
 stress_threshold.3001.naked_run:0 "Devo exorcizar esses demônios correndo nu[Select_CString( ROOT.Char.IsFemale, 'a', '' )]!"
 stress_threshold.3001.possessed.effect:0 "Sim, sim, eles sabem a verdade, a verdadeira verdade…"
 stress_threshold.3001.possessed.gain:0 "Sim, apenas as vozes sabem a verdadeira verdade!"
 stress_threshold.3001.t:0 "Colapso Mental: As Vozes"
 stress_threshold.3101.desc:0 "Tudo está... errado. Este [ROOT.Char.Custom('GetRoom')|l] está errado. O chão está errado. Até o ar está errado!\n\nPor que tudo está errado? Quem fez isso?\n\nQuem fez tudo #EMP errado#!?"
 stress_threshold.3101.kill_victim:0 "Tudo é culpa de [victim.GetFirstNameNoTooltip], eu sei!"
 stress_threshold.3101.lunatic.effect:0 "Os astutos [ROOT.Char.Custom('GetRandomRegionalSmallGamePlural')] estão de volta!"
 stress_threshold.3101.lunatic.gain:0 "Os [ROOT.Char.Custom('GetRandomRegionalSmallGamePlural')]... esses pequenos bastardos astutos fizeram isso!"
 stress_threshold.3101.lunatic.tt:0 "#F Tragam-me uma tocha!#!"
 stress_threshold.3101.t:0 "Colapso Mental: Tudo Errado"
 stress_threshold.3201.depressed.effect:0 "De qualquer forma, não serve para nada..."
 stress_threshold.3201.depressed.gain:0 "E o que importa? Eu desisto."
 stress_threshold.3201.desc:0 "Está tudo demais, por que eu estou tentando?\n\nEstamos no meio de um jantar quando tudo simplesmente... desmorona. Eu tenho que passar pelas finanças do [ROOT.Char.Custom('GetCourt')|l], tenho que resolver uma dúzia de disputas mesquinhas, tenho que–\n\n\"Você está bem, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip]?\" M[Select_CString( vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))], [vassal.GetTitledFirstName], cuidadosamente expressa a preocupação [vassal.GetHerHim]."
 stress_threshold.3201.help:0 "\"[vassal.GetFirstNameNoTooltip]... Me ajude, por favor\"."
 stress_threshold.3201.t:0 "Colapso Mental: Sobrecarga"
 stress_threshold.3201.wrathful.effect.failure:0 "[vassal.GetTitledFirstName] luta contra você."
 stress_threshold.3201.wrathful.effect.success:0 "Você dá uma surra [Select_CString( vassal.IsFemale, 'na', 'no' )] [vassal.GetTitledFirstName]."
 stress_threshold.3201.wrathful.effect:0 "Eu vou te mostrar quem está bem, [vassal.Custom2('InsultNoun', ROOT.Char)] [vassal.Custom2('InsultAdjective', ROOT.Char)]!"
 stress_threshold.3201.wrathful.gain:0 "Não, [vassal.Custom2('InsultNoun', ROOT.Char)] [vassal.Custom2('InsultAdjective', ROOT.Char)], eu não estou bem!"
 stress_threshold.3301.a:0 "#EMP #DIE1 Ugh...!#!#!"
 stress_threshold.3301.desc_man:0 "O primeiro sinal de que algo está errado é uma dor aguda no meu peito. Eu me inclino em busca de apoio enquanto a dor se espalha pelo meu braço esquerdo. Estou tão tonto...\n\nEu... Eu não tenho tempo para isso! Tenho coisas a fazer!\n\nEnquanto tento dar um passo, desabo no chão. Abro a boca para pedir ajuda, mas o único som que sai de mim é um gemido sufocado.\n\nA dor no meu peito aumenta, e aumenta, e— a escuridão toma minha visão, e eu posso #EMP sentir#! meu coração falhar."
 stress_threshold.3301.desc_woman:0 "O primeiro sinal de que algo está errado é uma azia que não vai embora. Tentei todos os remédios – lã macia sobre o meu abdômen, caminhadas tranquilas...\n\nDe repente, não consigo mais respirar profundamente e me apoio para não cair. O que— o que está acontecendo?! Tento gritar por ajuda, mas tudo o que consigo é um suspiro de dor.\n\n#EMP Dói#!! Uma dor aguda se espalha de entre minhas omoplatas até meu braço esquerdo, e conforme a dor aumenta, eu caio no chão.\n\nA escuridão chega rapidamente."
 stress_threshold.3301.t:0 "Colapso Mental: A Dor no Coração"
 stress_threshold_cooldown_message:0 "Se você ainda estiver [stressed|E] em [SCOPE.ScriptValue('stress_threshold_cooldown_duration_in_years')|V0] anos, poderá sofrer outro [mental_break|E]"
