l_spanish:
 stress_threshold_prison.1001.cynical.effect:0 "Isso só prova que não há [ROOT.Char.GetFaith.HighGodName]..."
 stress_threshold_prison.1001.cynical.gain:0 "[ROOT.Char.GetFaith.HighGodName] me abandonou..."
 stress_threshold_prison.1001.depressed.effect:0 "Não há dor. Eu já estou morto por dentro."
 stress_threshold_prison.1001.depressed.gain:0 "Como uma vida assim vale a pena ser vivida?"
 stress_threshold_prison.1001.desc.cynical:0 "\n\nComo [ROOT.Char.GetFaith.HighGodName] permite a existência deste lugar de desespero? Como qualquer deus poderia?"
 stress_threshold_prison.1001.desc.depressed:0 "costumava me incomodar, mas estranhamente, não me incomoda mais."
 stress_threshold_prison.1001.desc.normal:0 "é difícil não cair no desespero."
 stress_threshold_prison.1001.desc:0 "Estar preso, trancado longe de tudo que costumava ser saudável e agradável na vida..."
 stress_threshold_prison.1001.endure:0 "Por que ainda não fui libertado!?"
 stress_threshold_prison.1001.inappetetic.effect:0 "A comida permanece intocada no meu prato."
 stress_threshold_prison.1001.inappetetic.gain:0 "Não consigo mais engolir essa comida ruim."
 stress_threshold_prison.1001.t:0 "Colapso Mental: Problemas na Prisão"
 stress_threshold_prison.1011.a:0 "A fome é melhor do que essa gororoba."
 stress_threshold_prison.1011.b:0 "Há fontes alternativas de comida aqui embaixo..."
 stress_threshold_prison.1011.c:0 "[ROOT.Char.GetSheHe|U] pode resistir, uma colherada de cada vez!"
 stress_threshold_prison.1011.desc:0 "Já se passaram dias desde que consegui comer alguma coisa. Minha mente ansiosa se recusa a dar ao meu corpo a força para comer a comida seca que os guardas me trazem.\n\nEstou ficando mais fraco a cada dia, mas o que um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] pode fazer contra seu próprio corpo?"
 stress_threshold_prison.1011.t:0 "Colapso Mental: Fome Intensa"
 stress_threshold_prison.1012.a:0 "Quente e suculento e cheio de vida."
 stress_threshold_prison.1012.desc:0 "Eles acham que não há nada para comer aqui, que estão me faminto, me quebrando.\n\nEles não sabem que estou mais bem alimentado do que nunca...\n\nEste é um salão de banquete, cheio de comida deliciosa e rugidos de celebração."
 stress_threshold_prison.1012.t:0 "Colapso Mental: Hora da Refeição"
 stress_threshold_prison.1021.a:0 "Dez pontos se eu acertar a cabeça [fellow_prisoner.GetHerHim]!"
 stress_threshold_prison.1021.b:0 "A dor dos outros não faz nada por mim. Mas a minha..."
 stress_threshold_prison.1021.c:0 "Como pude sequer pensar em pensamentos tão sombrios!?"
 stress_threshold_prison.1021.desc:0 "Há pouco prazer a ser encontrado aqui neste [bg_override_char.Custom('GetDungeon')|l] imundo. Uma poça de água estagnada, um balde nojento, uma pilha de pequenas pedras—\n\nA forma escura d[Select_CString( fellow_prisoner.IsFemale, 'a', 'o' )] [fellow_prisoner.GetTitledFirstName] no canto oposto de repente parece um excelente alvo."
 stress_threshold_prison.1021.t:0 "Colapso Mental: Jogos Cruéis"
 stress_threshold_prison.1031.a:0 "Quando eu sair... oh, eles vão pagar!!"
 stress_threshold_prison.1031.b:0 "Por que esperar? Em minha mente, eles estão à minha mercê..."
 stress_threshold_prison.1031.c:0 "Não... isso está errado. Eu sou melhor do que isso."
 stress_threshold_prison.1031.desc:0 "Trancado aqui, sou suposto ser fraco e pacificado. Hah!\n\nAqui, na escuridão, reúno minha força e pratico despedaçar meus inimigos em minha mente! Dia após dia, eles são renascidos e dia após dia os destruo como os vermes que são!\n\nEspecialmente [Select_CString( jailer.IsFemale, 'minha miserável carcereira', 'meu miserável carcereiro' )], [jailer.GetTitledFirstName]... [jailer.GetSheHe] sofrerá o máximo!"
 stress_threshold_prison.1031.t:0 "Colapso Mental: Um Agarrar-se ao Poder"
 stress_threshold_prison.1041.athletic:0 "Posso estar preso, mas ainda posso me exercitar..."
 stress_threshold_prison.1041.depressed:0 "É ainda mais difícil lembrar por que devo sequer tentar."
 stress_threshold_prison.1041.desc:0 "Minha rotina é sempre a mesma à medida que a manhã se transforma em dia, se transforma em noite...\n\nO cheiro nauseante de comida estragada paira pesado no ar. Quando a pilha de pratos cresceu tanto? Quantas refeições eu perdi? Está ficando cada vez mais difícil manter um senso de normalidade..."
 stress_threshold_prison.1041.flagellant:0 "A dor me dará algo em que me concentrar."
 stress_threshold_prison.1041.inappetetic:0 "Qual é o sentido da comida sem liberdade?"
 stress_threshold_prison.1041.journaller.effect:0 "Fico feliz por ter pelo menos meu diário."
 stress_threshold_prison.1041.journaller.gain:0 "Talvez escrever possa quebrar a monotonia..."
 stress_threshold_prison.1041.optout:0 "Vou sair eventualmente... certo?"
 stress_threshold_prison.1041.t:0 "Colapso Mental: Necessidades Esquecidas"
 stress_threshold_prison.2001.a:0 "Eu devo continuar tentando!"
 stress_threshold_prison.2001.b:0 "Ah, esqueça. Por que se preocupar com... qualquer coisa?"
 stress_threshold_prison.2001.desc:0 "Por que não #EMP me deixam sair#!?! Certamente já estive neste frio, #EMP confinado#!, [bg_override_char.Custom('GetDungeon')|l] tempo suficiente?\n\nEu seguro minhas mãos ensanguentadas contra o peito enquanto me sento, encostado nas barras. Se eu arranhar com força suficiente, minhas correntes devem ceder, certo?\n\n...Certo?"
 stress_threshold_prison.2001.t:0 "Quebra Mental: Escavando para Sair"
 stress_threshold_prison.2011.a:0 "Venha aqui, pequeno [ROOT.Char.Custom('prison_pet')], e deixe-me abraçar você."
 stress_threshold_prison.2011.desc_cockroach:0 "E lá está ela de novo, a barata, sentada em seu canto escuro. É minha companheira, minha amiga confiável, minha #EMP filho#!.\n\nEla me observa, me fazendo companhia neste lugar miserável."
 stress_threshold_prison.2011.desc_end:0 "\n\nNunca senti tamanha conexão com outro ser, tamanha dedicação e empatia."
 stress_threshold_prison.2011.desc_rat:0 "Há muitos dias sou visitado pelo mesmo rato. Ele me olha com compaixão e confiança, algo que não experimentei há muito tempo."
 stress_threshold_prison.2011.desc_spoon:0 "Uma das poucas constantes na minha vida aqui em [bg_override_char.Custom('GetDungeon')|l], uma fonte solitária de conforto e companhia... Minha colher está sempre aqui quando preciso dela, e nunca me julga — mesmo nos meus dias mais sombrios."
 stress_threshold_prison.2011.desc_stone:0 "Uma presença constante ao meu lado, uma constante em uma vida de outra forma virada de cabeça para baixo. Minha pedra confiável é minha companheira e amiga, sempre presente quando eu preciso dela."
 stress_threshold_prison.2011.t:0 "Colapso Mental: Meu [ROOT.Char.Custom('prison_pet')|U] e Eu"
 stress_threshold_prison.2021.a:0 "Eu devo permanecer eternamente vigilante!"
 stress_threshold_prison.2021.b:0 "Eu preciso me esconder em algum lugar... qualquer lugar!"
 stress_threshold_prison.2021.c:0 "Talvez eu possa conversar com eles?"
 stress_threshold_prison.2021.desc:0 "Os guardas me dizem que estive sozinho por dias, mas eu sei melhor. Eu #EMP sinto#! eles me observando, avaliando-me, analisando meus medos e fraquezas...\n\nCada som me conta sobre a presença deles, cada sombra é uma ameaça."
 stress_threshold_prison.2021.t:0 "Colapso Mental: Os Cantos Mais Sombrios"
 stress_threshold_prison.3001.a:0 "Venha aqui, você, pirata!"
 stress_threshold_prison.3001.desc:0 "O que nunca me disseram sobre [bg_override_char.Custom('GetDungeonPlural')|l] é o quão #EMP terrivelmente entediante#! elas são! Graças [Select_CString( fictional_friend.IsFemale, 'a', 'ao' )] [fictional_friend.Custom('DuchessDuke')|U] [fictional_friend.Custom('RandomExampleName')] estar aqui para me fazer companhia.\n\n[Select_CString( fictional_friend.IsFemale, 'A boa', 'O bom' )] [fictional_friend.Custom('DuchessDuke')] faz piadas como ninguém, e sempre mantém meu ânimo. E a [fictional_friend.GetSheHe] é tão sábia também.\n\nO que é isso, [fictional_friend.Custom('DuchessDuke')|U]? #EMP Ha!#! Boa!"
 stress_threshold_prison.3001.t:0 "Colapso Mental: Um Amigo em Necessidade"
 stress_threshold_prison.3011.a:0 "Como pude pensar que fui abandonado?"
 stress_threshold_prison.3011.child:0 "M[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.GetDaughterSon], [child.GetFirstName], segura minha mão, mantendo a luz nos meus olhos brilhando."
 stress_threshold_prison.3011.child_multiple:0 "Meus filhos — todos os meus muitos filhos — se reúnem ao meu redor, mantendo a luz nos meus olhos brilhando."
 stress_threshold_prison.3011.desc:0 "Engasgo uma lágrima — eu estava tão desesperadamente #EMP perdido#! — mas as coisas estão melhores agora! Minha família está aqui comigo, me mantendo seguro.\n\nMãe e pai me abraçam apertado."
 stress_threshold_prison.3011.fallback:0 "Eles estão todos reunidos ao meu redor, mantendo a luz nos meus olhos brilhando."
 stress_threshold_prison.3011.sibling:0 "M[Select_CString( sibling.IsFemale, 'inha', 'eu' )] [sibling.Custom('SisterBrother')], [sibling.GetFirstName], me observa."
 stress_threshold_prison.3011.sibling_multiple:0 "M[Select_CString( sibling.IsFemale, 'inha', 'eu' )] [sibling.Custom('SisterBrother')], [sibling.GetFirstName] — Todos os meus irmãos — me observam."
 stress_threshold_prison.3011.t:0 "Colapso Mental: Verdadeira Família"
 stress_threshold_prison.3999.a:0 "[ROOT.Char.GetFaith.PositiveAfterLife|U] me abrace."
 stress_threshold_prison.3999.desc:0 "Não aguento mais. Minha mente está mais clara do que esteve nas últimas semanas, e sei que estou quebrado de mais de uma maneira.\n\nMeu corpo é nada além de dor, até respirar dói. O [bg_override_char.Custom('GetDungeon')|l] ao meu redor não me parece mais opressor, mas reconfortante. Acolhedor.\n\nEu sei no meu coração que estes são meus últimos suspiros."
 stress_threshold_prison.3999.t:0 "Colapso Mental: Liberdade"
