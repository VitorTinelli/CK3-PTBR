l_spanish:
 stress_threshold_special.1001.confider.assist:0 "É difícil, mas [confidant.GetFirstNameNoTooltip] pode me ajudar a superar isso."
 stress_threshold_special.1001.confider.shared:0 "É difícil, mas pelo menos [confidant.GetFirstNameNoTooltip] e eu podemos superar nosso luto juntos."
 stress_threshold_special.1001.depressed:0 "Uma vida sem [deceased_character.GetHerHim] vale a pena ser vivida?"
 stress_threshold_special.1001.desc_child_older:0 "Ainda me lembro [deceased_character.GetHerHim] quando era bebê. Tão pequeno, tão frágil. Apesar disso, [deceased_character.GetSheHe] sobreviveu, cresceu, envelheceu até... agora. Quando [deceased_character.GetSheHe] simplesmente parou.\n\nEu tinha tantas esperanças para o futuro [deceased_character.GetHerHim]... Tantas coisas que eu desejava ver, que agora jamais acontecerão."
 stress_threshold_special.1001.desc_child_toddler:0 "Tão jovem, cheio de vida e potencial. Agora, completamente imóvel...\n\nEternamente imóvel. Nunca mais rirá ou chorará."
 stress_threshold_special.1001.desc_friend:0 "\n\n[deceased_character.GetSheHe|U] sempre estava pronto para me animar ou me ajudar em momentos difíceis. Com todos os meus problemas recentes, a sua ausência é especialmente notável."
 stress_threshold_special.1001.desc_intro_friend:0 "[Select_CString( deceased_character.IsFemale, 'Minha amiga', 'Meu amigo' )] [deceased_character.GetFirstName] sempre esteve ao meu lado. Eu não esperava que a sua morte fosse fácil, mas nunca imaginei que seria tão difícil."
 stress_threshold_special.1001.desc_intro_lover:0 "Uma luz se apagou da minha vida.\n\nCom [deceased_character.GetFirstName], meu [deceased_character.Custom('LoverPetName')], partido, a vida de repente parece muito mais sombria."
 stress_threshold_special.1001.desc_intro_standard:0 "A vida nunca foi fácil, mas parece que a perda [Select_CString( deceased_character.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', deceased_character)] [deceased_character.GetFirstName] me empurrou para o limite.\n\n"
 stress_threshold_special.1001.desc_lover:0 "Cada dia é uma batalha, na qual luto para encontrar significado na ausência [deceased_character.GetHerHim]. Não consigo parar de pensar em todos os momentos maravilhosos que tivemos juntos...\n\nAgora nunca haverá mais."
 stress_threshold_special.1001.desc_parent:0 "Embora soubesse que isso iria acontecer eventualmente, me vejo terrivelmente despreparado para a morte [Select_CString( deceased_character.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', deceased_character)].\n\nDe repente, não posso mais recorrer a [deceased_character.GetSheHe] em busca de conforto ou conselhos.\n\nHá apenas um espaço vazio onde costumava estar... Pode esse espaço ser preenchido algum dia?"
 stress_threshold_special.1001.desc_spouse:0 "[deceased_character.GetSheHe|U] foi meu parceiro na vida, me ajudando a superar tantos desafios e dificuldades. Embora possamos ter tido desentendimentos, enfrentar a vida sem [deceased_character.GetSheHe] simplesmente parece... assustador.\n\nComo conseguirei viver sem [deceased_character.GetSheHe]?"
 stress_threshold_special.1001.drunkard:0 "Um brinde para lembrar [deceased_character.GetHerHim]... e um brinde para esquecer."
 stress_threshold_special.1001.flagellant:0 "Tudo é culpa minha também. Mereço sofrer por isso..."
 stress_threshold_special.1001.frozen_grief:0 "Devo seguir em frente. É o que [deceased_character.GetSheHe] teria querido."
 stress_threshold_special.1001.hashishiyah:0 "Essa dor é intensa demais. Preciso de algo para amortecê-la..."
 stress_threshold_special.1001.inappetetic.effect:0 "Meu coração está tão vazio quanto meu estômago."
 stress_threshold_special.1001.inappetetic.trait:0 "Qual é o sentido de comer quando há um vazio em meu coração?"
 stress_threshold_special.1001.journaller:0 "Talvez escrever meus sentimentos possa me ajudar a processar minhas emoções?"
 stress_threshold_special.1001.lunatic.flavor:0 "...e [deceased_character.GetSheHe] ficará comigo para sempre!"
 stress_threshold_special.1001.lunatic:0 "Mas [deceased_character.GetSheHe] não se foi! [deceased_character.GetSheHe|U] está bem aqui comigo..."
 stress_threshold_special.1001.t:0 "Colapso Mental: Luto Devastador"
 stress_threshold_special.2001.a.tt:0 "Você perde o [perk|E] [GetPerk( 'restraint_perk' ).GetName( GetPlayer)|V]"
 stress_threshold_special.2001.a:0 "Esqueça. Eu não consigo mais resistir, eu #EMP preciso#! disso!"
 stress_threshold_special.2001.b:0 "Não... Isso não é mais quem eu sou. Eu devo controlar esses impulsos!"
 stress_threshold_special.2001.beginning:0 "Ah, como sinto falta dos dias de libertinagem e luxúria que eu costumava ter. Já faz tanto tempo desde que estive com outra pessoa... e dói dormir sozinho.\n\n"
 stress_threshold_special.2001.consort:0 "Eu sei que [Select_CString( target.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMe', target)] [target.GetFirstName] me receberia de volta em sua cama de braços abertos. [target.GetSheHe|U] me deseja, eu sei... e como desejo [target.GetSheHe]!"
 stress_threshold_special.2001.ending:0 "\n\nQuando fiz meus votos, pensei que poderia lidar com a celibato, mas agora... não tenho tanta certeza."
 stress_threshold_special.2001.noble:0 "Eu vi a maneira como [target.Custom2('MyCharacterIntroduction', ROOT.Char)] me olha. [target.GetSheHe|U] me deseja, eu sei... e como desejo [target.GetSheHe]!"
 stress_threshold_special.2001.servant:0 "Embora [target.GetSheHe] seja apenas um humilde servo, vi a maneira como [target.GetFirstName] me olha. [target.GetSheHe|U] me deseja, eu sei... e como desejo [target.GetSheHe]!"
 stress_threshold_special.2001.t:0 "Colapso Mental: Desejos Repressos"
