l_spanish:
 yearly.3001.a:0 "Vou confrontar [Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetFirstNameNoTooltip] pessoalmente."
 yearly.3001.b:0 "[vassal.GetSheHe|U] é culpado, e eu o acusarei publicamente!"
 yearly.3001.c.if_right:0 "Se [vassal.GetFirstNameNoTooltip] for leal"
 yearly.3001.c.if_wrong_tt:0 "Se [vassal.GetFirstNameNoTooltip] for desleal"
 yearly.3001.c:0 "O [neighbor.GetTitleAsNameNoTooltip] não pode ser confiável. Meus vassalos têm meu apoio!"
 yearly.3001.confront:0 "[vassal.GetSheHe|U] fica sabendo da minha suspeita"
 yearly.3001.d:0 "Eu #EMP sabia#!! [vassal.GetFirstNameNoTooltip] vai pagar!"
 yearly.3001.desc:0 "Recebi um comunicado de [neighbor.GetName]. Ele afirma que [vassal.GetTitledFirstName], m[Select_CString( vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))], solicitou apoio em um plano contra mim!\n\n\"Não há nada que eu valorize mais do que a lealdade\", diz a carta de [neighbor.GetFirstNamePossessive], \"por isso estou compartilhando isso com você.\""
 yearly.3001.false_tt:0 "Minha suspeita é infundada"
 yearly.3001.false_use_tt:0 "[vassal.GetTitledFirstNameNoTooltip] usará o insulto a seu favor"
 yearly.3001.friend_backs_neighbor:0 "\nFelizmente, m[Select_CString( friend.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friend'))] [friend.GetFirstName] está lá para me aconselhar. \"Eu tinha minhas suspeitas sobre [vassal.GetFirstNameNoTooltip] há algum tempo. Isso praticamente as confirma.\""
 yearly.3001.friend_backs_vassal:0 "\nFelizmente, m[Select_CString( friend.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friend'))] [friend.GetFirstName] está lá para me aconselhar. \"Recuso-me a acreditar que [vassal.GetFirstNameNoTooltip] se rebaixaria tanto.\""
 yearly.3001.t:0 "Um Alerta Útil"
 yearly.3001.true_tt:0 "Minha acusação é verdadeira"
 yearly.3001.vassal_gains_strength:0 "Os planos de [vassal.GetTitledFirstNamePossessiveNoTooltip] ficam mais fortes"
 yearly.3002.a:0 "Faça tudo o que eu disser, e você será poupado."
 yearly.3002.b:0 "Eu perdoo, se você deixar as pessoas saberem da minha generosidade."
 yearly.3002.desc:0 "[vassal.GetTitledFirstName] não pode fazer nada além de confessar quando é confrontado com a carta de [neighbor.GetTitledFirstNamePossessive].\n\n\"Isso nunca... Não foi... Como posso consertar isso?\" [vassal.GetSheHe|U] [vassal.Custom('quirk_neg_present')], mas posso ver o medo escrito no rosto [vassal.GetHerHim]."
 yearly.3002.t:0 "Confissão"
 yearly.3003.a:0 "Sim. Na verdade, quero recompensá-lo por sua lealdade!"
 yearly.3003.b:0 "Você sempre foi um bom servo."
 yearly.3003.c.enable:0 "Esta opção está disponível devido à alta Diplomacia de [friend.GetTitledFirstNamePossessiveNoTooltip]"
 yearly.3003.c:0 "Sim, o que [friend.GetFirstNameNoTooltip] diz!"
 yearly.3003.desc:0 "Quando apresento a carta de [neighbor.GetTitledFirstNamePossessiveNoTooltip] a [vassal.GetTitledFirstName], ela é primeiro recebida com confusão, depois com raiva. \"Você acredita na palavra [neighbor.GetHerHim] mais do que na minha? Eu não tenho sido sempre um servo leal!\"\n\nA sua indignação planta uma semente de dúvida em minha mente. Talvez eu tenha agido muito rapidamente. Devo fazer as pazes antes de arruinar ainda mais este relacionamento!"
 yearly.3003.friend:0 "\nFelizmente, m[Select_CString( friend.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friend'))] intervém. \"Isso é apenas para alertá-lo sobre a calúnia de [neighbor.GetTitledFirstNamePossessive], diz [friend.GetTitledFirstName]."
 yearly.3003.public_expression_of_gratitude:0 "Expressão Pública de Gratidão"
 yearly.3003.t:0 "Uma Acusação Insultante"
 yearly.3003.vassal_loss_of_faith:0 "Desculpa Insincera"
 yearly.3004.a:0 "[vassal.GetFirstNameNoTooltip] fará as pazes."
 yearly.3004.b:0 "Farei questão de que [vassal.GetSheHe] não possa me prejudicar."
 yearly.3004.c:0 "Farei #EMP muito#! questão de que [vassal.GetSheHe] não possa me prejudicar."
 yearly.3004.desc:0 "Em uma reunião de muitos dos meus vassalos, declaro que tenho conhecimento da traição de [vassal.GetTitledFirstNamePossessive].\n\nMuitos dos meus outros vassalos se levantaram em apoio. \"Todos nós sabemos que é verdade. O que acontecerá com [vassal.GetSheHe]?\""
 yearly.3004.t:0 "À Vista de Todos"
 yearly.3005.a.rousing_speech:0 "Um Discurso Empolgante Sobre Lealdade"
 yearly.3005.a.stumbling_apology:0 "Uma Desculpa Atabalhoada"
 yearly.3005.a:0 "É melhor eu tomar a iniciativa!"
 yearly.3005.b:0 "Declarei [vassal.GetSheHe] um traidor, e [vassal.GetSheHe] será tratado como tal!"
 yearly.3005.desc:0 "Em uma reunião de muitos dos meus vassalos, declaro que tenho conhecimento da traição de [vassal.GetTitledFirstNamePossessive]. No entanto, os colegas vassalos de [vassal.GetTitledFirstName] estão longe de ficarem satisfeitos com a carta de [Select_CString( neighbor.IsFemale, 'uma', 'um' )] [neighbor.GetLadyLord] [Select_CString( neighbor.IsFemale, 'estrangeira', 'estrangeiro' )].\n\n[vassal.GetFirstName] fala por todos. 'Que evidência existe? Se uma carta fosse suficiente, não estaríamos todos #EMP todos#! culpados?' A reunião murmura em acordo. Isso está saindo de controle!"
 yearly.3011.a.failure:0 "Suficientemente Entretido"
 yearly.3011.a.success:0 "Um Espetáculo Glorioso"
 yearly.3011.a:0 "Vou providenciar o ouro para essa empreitada!"
 yearly.3011.b:0 "Posso encontrar os artistas que precisamos."
 yearly.3011.c:0 "Acho melhor focar nas pequenas coisas."
 yearly.3011.d:0 "Eu sei exatamente como criar um espetáculo."
 yearly.3011.desc:0 "Antes de mais um banquete em honra [Select_CString( liege.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('liege'))], [liege.GetTitledFirstName], [vassal.GetTitledFirstName] me faz uma visita.\n\n\"Nenhum de nós está nas melhores graças d[Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitleAsNamePossessiveNoTooltip],\" aponta [vassal.GetSheHe], \"mas se providenciássemos um espetáculo espetacular no banquete, poderíamos melhorar nossa posição com [liege.GetSheHe].\""
 yearly.3011.t:0 "Uma Impressão Feita Duas Vezes"
 yearly.3012.a:0 "Fico imaginando o que devemos fazer a seguir..."
 yearly.3012.b:0 "Esta foi uma ideia muito boa, [vassal.GetFirstNameNoTooltip]."
 yearly.3012.desc:0 "Com corpos balançando e braços girando, os dançarinos que [vassal.GetTitledFirstName] e eu contratamos deixam todos estupefatos. Depois da refeição, [liege.GetTitledFirstName] [liege.GetHerselfHimself] se aproxima de mim. 'Isso foi realmente algo, [ROOT.Char.GetFirstNameNoTooltip].' [vassal.GetFirstName] e eu não podemos deixar de trocar um sorriso."
 yearly.3013.a:0 "De qualquer forma, cuidaremos um do outro."
 yearly.3013.b:0 "Pelo menos tentamos o nosso melhor."
 yearly.3013.desc:0 "Apesar de todas as pernas varrendo e braços girando, [liege.GetTitledFirstName] não parece muito impressionad[Select_CString( liege.IsFemale, 'a', 'o' )] com os dançarinos que [vassal.GetTitledFirstName] e eu contratamos para o banquete. [Select_CString( liege.IsFemale, 'A', 'O' )] [liege.GetTitleAsNameNoTooltip] ouve com um sorriso a dedicação deles para conosco, mas depois volta rapidamente a atenção para a comida.\n\n[vassal.GetFirstName] me olha com incerteza, mas [liege.GetFirstName] parece satisfeito o suficiente."
 yearly.3014.a:0 "Deixe-me contar sobre o vilão que arruinou isso, [vassal.GetFirstNameNoTooltip]."
 yearly.3014.b:0 "Isso não é culpa nossa, [vassal.GetFirstNameNoTooltip]."
 yearly.3014.desc:0 "Os dançarinos que [vassal.GetTitledFirstName] e eu contratamos são um desastre. Agitando-se e saltando, eles parecem mais uma trupe de comédia do que o elegante espetáculo que foi prometido. [liege.GetTitledFirstName] não parece contente por ser perturbado no meio de sua refeição, também.\n\nÉ apenas durante as dedicatórias a nós que percebo que este não é o mesmo grupo com o qual negociamos! Quem poderia ter feito isso-\n[nemesis.GetTitledFirstName]!"
 yearly.3021.a:0 "Que você encontre paz na vida além desta, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('deathbed_character'))]."
 yearly.3021.desc:0 "Agora está claro que [deathbed_character.GetTitledFirstName], [Select_CString( deathbed_character.IsFemale, 'minha antiga', 'meu antigo' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('deathbed_character'))], não tem muito tempo neste mundo.\n\nEnquanto me aproximo do leito de morte [deathbed_character.GetHerHim], sei que [deathbed_character.GetSheHe] viveu uma vida longa. No entanto, nunca há tempo suficiente para se despedir, não é mesmo? Seguro a mão [deathbed_character.GetHerHim] até que ela fique fria e sua respiração pare."
 yearly.3021.t:0 "Em Seu Leito de Morte"
 yearly.3031.a.best_friend_success:0 "[best_friend.GetFirstNameNoTooltip] Distrai [fellow_vassal.GetFirstNameNoTooltip]"
 yearly.3031.a.failure:0 "[fellow_vassal.GetFirstNameNoTooltip] Faz Amizade Com [Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitleAsNamePossessiveNoTooltip]"
 yearly.3031.a.nemesis_failure:0 "[nemesis.GetFirstNameNoTooltip] Difamação Contra Mim"
 yearly.3031.a.success:0 "Me Torno Amigável Com [Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitleAsNamePossessiveNoTooltip]"
 yearly.3031.a:0 "Como um bom conversador, isso deve ser fácil."
 yearly.3031.b.failure:0 "[Select_CString( liege.IsFemale, 'A', 'O' )] [liege.GetTitleAsNameNoTooltip] Fica Mais Impressionad[Select_CString( liege.IsFemale, 'a', 'o' )] Com [fellow_vassal.GetFirstNameNoTooltip]"
 yearly.3031.b.success:0 "Eu Impressiono [Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitleAsNameNoTooltip]"
 yearly.3031.b:0 "Vou ilustrar que [ROOT.Char.GetFaith.HighGodName] já me favorece."
 yearly.3031.c.consequence:0 "[liege.GetFirstNameNoTooltip] pode me perseguir ainda mais"
 yearly.3031.c.success:0 "Atraindo Atenção"
 yearly.3031.c.unlock_tt:0 "Essa opção está disponível devido à minha atratividade para [liege.GetTitledFirstNameNoTooltip]"
 yearly.3031.c:0 "Eu sei como chamar a atenção de [liege.GetFirstNamePossessiveNoTooltip]..."
 yearly.3031.d:0 "Nós vassalos devemos trabalhar juntos, não uns contra os outros!"
 yearly.3031.desc:0 "Tanto [fellow_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] quanto eu somos estimados por nosso senhor, [liege.GetTitledFirstName]. No entanto, quando se trata de distribuir títulos, honras e riquezas, um de nós sempre será o primeiro entre iguais.\n\nO próximo encontro em [capital.GetNameNoTierNoTooltip] [liege.Custom('ResidenceBuilding')|U] me dá a chance de garantir que eu seja aquele com o favor d[Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitleAsNamePossessiveNoTooltip]."
 yearly.3031.friend:0 "Ter m[Select_CString( best_friend.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('best_friend'))] [best_friend.GetTitledFirstName] ao meu lado certamente ajudará também."
 yearly.3031.rival:0 "No entanto, m[Select_CString( nemesis.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('nemesis'))] [nemesis.GetTitledFirstName] não fez segredo do fato de que [nemesis.GetSheHe] pretende sabotar meus esforços!"
 yearly.3031.t:0 "Avançando"
 yearly.3040.a:0 "Minha dedicação deveria ser proclamada dos telhados!"
 yearly.3040.b:0 "Tenho sido muito indulgente com o [ROOT.Char.GetFaith.HouseOfWorship] este ano..."
 yearly.3040.c:0 "O [religious_head.GetTitleAsNameNoTooltip] certamente aprecia [Select_CString( ROOT.Char.IsFemale, 'uma', 'um' )] [ROOT.Char.GetLadyLord] devot[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]!"
 yearly.3040.d:0 "Os [ROOT.Char.Custom('DefaultPriestTitlePlural')] já estão em êxtase comigo."
 yearly.3040.desc:0 "Sou conhecid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] profundamente piedos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. Certamente minha devoção a [ROOT.Char.GetFaith.HighGodName] deveria ser boa para alguma coisa nesta vida também, e não apenas na próxima?\n\nExistem várias pessoas que se sairiam bem em serem lembradas de que estou nas graças de [ROOT.Char.GetFaith.HighGodNameAlternatePossessive]."
 yearly.3040.t:0 "Um Bom [ROOT.Char.GetFaith.GetAdjectiveNoTooltip|U]"
 yearly.3041.a:0 "Meu ouro é o ouro de [ROOT.Char.GetFaith.HighGodNamePossessive]."
 yearly.3041.b:0 "Concentre seu pessoal em outro lugar."
 yearly.3041.c:0 "#EMP Eu#! sou aquele fazendo o trabalho de [ROOT.Char.GetFaith.HighGodName]!"
 yearly.3041.desc:0 "Sei que você é um servo dedicado de [ROOT.Char.GetFaith.HighGodNameAlternate]. Portanto, espero que você olhe com simpatia para o fato de que nosso dever para com você sobrecarrega nossa capacidade de fazer o trabalho de [ROOT.Char.GetFaith.HighGodName].\n\nTalvez algumas de nossas obrigações mais pesadas possam ser dispensadas?"
 yearly.3041.opening:0 "[vassal.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.3051.a:0 "A lei é clara, [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip] tem todos os direitos!"
 yearly.3051.b:0 "[vassal.GetFirstNameNoTooltip] pode manter o título, por minha graça."
 yearly.3051.desc:0 "M[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] me informou sobre uma lei obscura em [county.GetName], que afirma que somente [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip] pode ser seu protetor.\n\nNormalmente, uma lei tão arcaica seria descartada, mas ela me oferece uma chance única de colocar [vassal.GetTitledFirstName], m[Select_CString( vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('vassal'))] e atual governante de [county.GetNameNoTooltip], em seu lugar."
 yearly.3051.t:0 "Por Direito"
 yearly.3061.a:0 "Imporei impostos pesados sobre os Agotes, mantendo-os sob controle!"
 yearly.3061.b.flavor:0 "Separar agoterias, marcas com o pé com teia vermelha, construir portas menores nas igrejas separadas para eles... Sim, isso deve funcionar."
 yearly.3061.b:0 "Eles devem ser isolados da sociedade decente!"
 yearly.3061.c:0 "Não poderíamos tentar conviver lado a lado com eles?"
 yearly.3061.d:0 "Malditos hereges! Expulsem-nos e apreendam suas posses!"
 yearly.3061.desc:0 "Eu fico chateado só de pensar nisso! Em [county.GetName], os Agotes estão vivendo livremente lado a lado com pessoas normais, mal sendo excluídos por suas más ações! E tudo está acontecendo bem ali ao longo do Caminho de Santiago!\n\nClaro que eles não podem andar descalços, tocar parapeitos de pontes ou aceitar a comunhão diretamente da mão do [ROOT.Char.GetFaith.PriestNeuter], mas além disso nós estamos fazendo #EMP nada!#!\n\nEssa situação intolerável não pode continuar. E se eles estiverem planejando algo?!"
 yearly.3061.t:0 "Lidando Com os Agotes"
 yearly.3071.a:0 "Orações pela proteção de [ROOT.Char.GetFaith.HighGodNamePossessive] me acalmarão."
 yearly.3071.b:0 "Por que a memória do sabor não sai da minha mente?!"
 yearly.3071.desc:0 "Acordo gritando, com o coração batendo rápido.\n\nEu havia sido acorrentado nu — ou colarinho? — enquanto uma dúzia de homens e mulheres com cabeças de cabra desceu sobre mim, mordendo e rasgando minha pele...\n\nDe repente, eu era um deles, rasgando minha própria carne com dentes afiados, engolindo pedaços, bebendo sangue... #EMP sorvendo...#! Nunca senti nada tão horrível quanto quando vi a vida deixar os olhos do meu corpo dilacerado.\n\nMas era apenas um sonho. Era apenas um sonho."
 yearly.3071.t:0 "Apenas um Pesadelo"
