l_spanish:
 varangian.0002.a:0 "Vá, com a bênção de [ROOT.Char.GetFaith.WarGodNamePossessive]!"
 varangian.0002.b:0 "Não, eu proíbo! Você é necessário aqui."
 varangian.0002.elsewhere:0 "a guarda do Imperador"
 varangian.0002.end:0 "trará riqueza e glória!\"\n\nEu não posso negar essa parte, mas poderia negar o pedido [varangian_candidate.GetHerHim]. Por outro lado, seria certo impedir alguém de buscar a glória?"
 varangian.0002.miklagard:0 "Miklagard"
 varangian.0002.opening:0 "No momento em que [varangian_candidate.Custom2('MyCharacterIntroduction', ROOT.Char )] vem até mim com o seu plano, [varangian_candidate.GetSheHe] parece já ter decidido o que fazer.\n\n\"Servir com os Varangianos em"
 varangian.0002.t:0 "A Guarda Varangiana"
 varangian.1002.a:0 "Bem-vindo de volta, [returning_varangian.GetFirstNameNoTooltip]!"
 varangian.1002.ending:0 "\n\n\"Eu voltei, [returning_varangian.Custom2('RelationToMeShort', ROOT.Char)]!\" [returning_varangian.GetFirstNameNoTooltip] grita. \"Muitas vezes pensei que nunca mais veria alguém como você, mas finalmente retornei.\"\n\nPor mais estranho que seja ver m[Select_CString( returning_varangian.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', returning_varangian)] depois de tantos anos, não posso negar que estou impressionado/a com o traje [returning_varangian.GetHerHis] [emperor.GetCulture.GetNameNoTooltip], as joias estrangeiras de [returning_varangian.GetHerHis] e o pesado baú que [returning_varangian.GetSheHe] trouxe com [returning_varangian.GetHerHim]."
 varangian.1002.new_partner:0 "E certamente não reconheço [Select_CString( partner.IsFemale, 'a', 'o' )] [partner.GetWomanMan] ao lado [returning_varangian.GetHerHim]!"
 varangian.1002.opening:0 "Mal reconheço [returning_varangian.Custom2('MyCharacterIntroduction', ROOT.Char)] quando [returning_varangian.GetSheHe] aparece em meu [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'campo', 'grande_sala')]."
 varangian.1002.t:0 "Retornando da Guarda Varangiana"
 varangian.3001.a:0 "Corajos[Select_CString( varangian.IsFemale, 'a', 'o' )] até o fim, [varangian.GetFirstNameNoTooltip]..."
 varangian.3001.desc:0 "[varangian.Custom2('MyCharacterIntroduction', ROOT.Char)] morreu enquanto servia na Guarda Varangiana!\n\nRecebi um comunicado d[Select_CString( emperor.IsFemale, 'a', 'o' )] [emperor.GetTitledFirstName] elogiando o nome [varangian.GetHerHim] e descrevendo como [varangian.GetSheHe] lutou valentemente para salvar a vida d[Select_CString( emperor.IsFemale, 'a', 'o' )] [emperor.GetTitleAsNameNoTooltip] de assassinos cruéis.\n\nNada pode trazer [varangian.GetFirstNameNoTooltip] de volta, mas a recompensa póstuma em ouro d[Select_CString( emperor.IsFemale, 'a', 'o' )] [emperor.GetTitleAsNameNoTooltip] ajuda a aliviar a tristeza."
 varangian.3001.t:0 "Guarda Varangiana: Uma Morte Honrosa"
 varangian_arrived.desc:0 "[varangian_candidate.GetShortUIName|U] se juntou à Guarda Varangiana"
 varangian_arrived.title:0 "Um Novo Varangiano"
