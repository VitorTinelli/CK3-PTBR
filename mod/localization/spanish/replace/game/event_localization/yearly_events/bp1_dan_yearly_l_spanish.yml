l_spanish:
 bp1_orgy_tapestry:0 "Tapeçaria de uma Orgia"
 bp1_orgy_tapestry_desc:0 "Esta tapeçaria representa [orgy_participant_1.GetFirstName], [ROOT.Char.GetName], [orgy_participant_2.GetName], [orgy_participant_3.GetName] e [orgy_tapestry_maker.GetName] envolvidos em uma orgia. [ROOT.Char.GetFaith.DevilName] também está participando."
 bp1_yearly.7000.a:0 "[ROOT.Char.GetFaith.HighGodName] é mais importante do que o café da manhã."
 bp1_yearly.7000.b:0 "O verdadeiro pecado seria deixar essa oportunidade passar."
 bp1_yearly.7000.desc:0 "Estou a caminho de [ROOT.Char.GetFaith.HouseOfWorship] quando encontro [Select_CString( distraction_friend.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', distraction_friend)] [distraction_friend.GetTitledFirstName], que está carregando uma pequena bolsa. Olhando ao redor, [distraction_friend.GetSheHe] a abre de modo conspiratório, revelando todo tipo de comidas e bebidas.\n\n\"Está um dia tão bonito, venha comigo lá fora para um piquenique matinal.\" [distraction_friend.GetSheHe|U] diz.\n\nQuando começo a protestar que estou a caminho de [ROOT.Char.GetFaith.HouseOfWorship], [distraction_friend.GetFirstNameNoTooltip] me interrompe:\n\n\"[ROOT.Char.GetFaith.HighGodName] ainda estará lá mais tarde, mas estes [ROOT.Char.Custom('GetExpensiveDessert')] não.\" "
 bp1_yearly.7000.t:0 "Quebrando o Jejum com um Amigo"
 bp1_yearly.7001.a.toast.bad_time:0 "Você teve um momento ruim"
 bp1_yearly.7001.a.toast.caught_fish:0 "Você pega um peixe gigante"
 bp1_yearly.7001.a.toast.good_time:0 "Você teve uma ótima viagem"
 bp1_yearly.7001.a.toast.white_carp:0 "Você pega o lendário carpa branco"
 bp1_yearly.7001.a:0 "Vou pegar o lendário carpa branco!"
 bp1_yearly.7001.b:0 "Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] não #EMP 'Pesca'#!."
 bp1_yearly.7001.desc:0 "M[Select_CString( fishing_friend.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', fishing_friend)] [fishing_friend.GetFirstName] me aborda, sorrindo de orelha a orelha. Em suas mãos estão duas varas de pesca. \n\n\"Venha pescar comigo hoje, querid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [fishing_friend.Custom2('RelationToMeShort', ROOT.Char)]. Prometo que você vai adorar!\" [fishing_friend.GetSheHe|U] exclama.\n\nJá faz um tempo desde que tirei uma pausa e escapei do agito do [ROOT.Char.Custom('FortifiedBuilding')]..."
 bp1_yearly.7001.t:0 "Pescaria"
 bp1_yearly.7002.a.toast.chamberpot:0 "Você Derruba o Vaso Sanitário!"
 bp1_yearly.7002.a.toast.miss:0 "Completamente Errado!"
 bp1_yearly.7002.a.toast.perfect_hit:0 "Acerto Certeiro!"
 bp1_yearly.7002.a.toast.tripped:0 "Você Escorrega e Fica Coberto de Excremento!"
 bp1_yearly.7002.a.tt:0 "Você tenta esvaziar o vaso sanitário sobre eles"
 bp1_yearly.7002.a:0 "Cuidado lá embaixo!"
 bp1_yearly.7002.b:0 "Sou um adulto, e isso está abaixo de mim."
 bp1_yearly.7002.desc:0 "Depois de aliviar-me, vou até a janela e observo o pátio lá embaixo.\n\nMeu humor azeda quando vejo m[Select_CString( chamberpot_rival.IsFemale, 'inha', 'eu' )] rival, [chamberpot_rival.GetFirstName], andando pelo pátio com um olhar irritantemente alegre no rosto. Meus olhos se voltam para a câmara de vaso sanitário cheia ao lado da minha cama, talvez eu possa fazer algo sobre esse bom humor..."
 bp1_yearly.7002.t:0 "Brigas no Banheiro"
 bp1_yearly.7003.a:0 "Nojento!"
 bp1_yearly.7003.b:0 "Eu #EMP preciso#! pendurar isso na minha parede."
 bp1_yearly.7003.c:0 "Acho que tomei um, uh, caminho errado."
 bp1_yearly.7003.desc:0 "Estou procurando por [orgy_tapestry_maker.Custom2('MyCharacterIntroduction', ROOT.Char)], mas [orgy_tapestry_maker.GetSheHe] não está em lugar algum. Eventualmente, arrombo a porta dos aposentos [orgy_tapestry_maker.GetHerHim] onde não encontro #EMP [orgy_tapestry_maker.GetSheHe]#!... mas encontro algo muito interessante.\n\nParece que [orgy_tapestry_maker.GetSheHe] tem trabalhado em uma tapeçaria que representa uma orgia bastante explícita. Eu estou lá, espremido entre m[Select_CString( orgy_participant_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', orgy_participant_1)] [orgy_participant_1.GetFirstName] e m[Select_CString( orgy_participant_2.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', orgy_participant_2)] [orgy_participant_2.GetFirstName]. Enquanto isso, m[Select_CString( orgy_tapestry_maker.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', orgy_tapestry_maker)] [orgy_tapestry_maker.GetFirstNameNoTooltip] parece estar se divertindo muito com [ROOT.Char.GetFaith.DevilName]. No canto de tudo isso, m[Select_CString( orgy_participant_3.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', orgy_participant_3)] [orgy_participant_3.GetFirstName] está sentado com um sorriso encantado.\n\nFico sem palavras."
 bp1_yearly.7003.t:0 "A Tapeçaria"
 bp1_yearly.7004.a:0 "Isso parece bom."
 bp1_yearly.7004.b:0 "Meus problemas são meus."
 bp1_yearly.7004.desc:0 "M[Select_CString( concerned_friend.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', concerned_friend)] [concerned_friend.GetFirstName] se aproxima enquanto estou sentado, olhando para fora: \"Você não tem sido o mesmo desde... desde o que aconteceu.\"\n\n[concerned_friend.GetSheHe|U] não diz, mas eu sei que [concerned_friend.GetSheHe] está se referindo a quando [bad_memory.GetDescription].\n\n\"Talvez você precise de alguém para conversar? Eu poderia ser essa pessoa,\" [concerned_friend.GetSheHe] continua gentilmente."
 bp1_yearly.7004.t:0 "Conforto de um Amigo"
 bp1_yearly.7005.a.returned_artifact:0 "Artefato Emprestado Devolvido."
 bp1_yearly.7005.a.tt:0 "Seu artefato pode estar danificado."
 bp1_yearly.7005.a:0 "Eu suponho que sim."
 bp1_yearly.7005.b:0 "De jeito nenhum."
 bp1_yearly.7005.desc:0 "Meu amigo [borrowing_friend.GetName] vem até mim claramente querendo algo. Eventualmente, fico cansado [borrowing_friend.GetHerHim] rodeando o assunto e exijo que [borrowing_friend.GetSheHe] me conte.\n\n\"Bem, eu estava esperando poder pegar emprestado o seu [borrowed_artifact.GetName] por uma noite, mas você não pode perguntar por quê...\"\n\n[borrowing_friend.GetSheHe|U] está claramente envergonhado com o pedido. O que [borrowing_friend.GetSheHe] poderia querer com isso?"
 bp1_yearly.7005.t:0 "Um Favor para um Amigo"
 bp1_yearly.7006.a:0 "Você é [Select_CString( borrowing_friend.IsFemale, 'uma completa', 'um completo' )] [borrowing_friend.Custom2('InsultNoun', ROOT.Char)]."
 bp1_yearly.7006.b:0 "Acidentes acontecem."
 bp1_yearly.7006.desc:0 "[borrowing_friend.GetName] se aproxima de mim com os olhos baixos. \"Por favor, não fique chateado\".\n\nEles me levam até o meu [borrowed_artifact.GetName], que posso ver que está gravemente danificado.\n\n \"Sinto muito, foi um acidente...\" [borrowing_friend.GetFirstNameNoTooltip] parece genuinamente angustiado."
 bp1_yearly.7006.t:0 "$bp1_yearly.7005.t$"
 bp1_yearly.7007.a:0 "Isso é maravilhoso!"
 bp1_yearly.7007.b:0 "Você alterou O MEU [borrowed_artifact.GetNameNoTooltip]?"
 bp1_yearly.7007.desc:0 "[borrowing_friend.GetName] devolveu meu [borrowed_artifact.GetName]. Não tenho certeza se eles apenas o limparam ou realmente fizeram alterações, mas ele está parecendo mais impressionante do que nunca.\n\n \"Espero que você goste, trabalhei nele a noite toda,\" [borrowing_friend.GetSheHe] diz, parecendo nervoso."
 bp1_yearly.7007.t:0 "$bp1_yearly.7005.t$"
 bp1_yearly.7010.a.tt:0 "Você acredita que a lealdade de [tested_friend.GetFirstNamePossessive] pode ser comprada com ouro"
 bp1_yearly.7010.a:0 "Trinta moedas de prata."
 bp1_yearly.7010.b.tt:0 "Você acredita que [tested_friend.GetFirstName] escolheria prazeres carnais em vez de amizade"
 bp1_yearly.7010.b:0 "Dois... não, #EMP três#! bel[Select_CString( tested_friend.IsFemale, 'as', 'os' )] [tested_friend.Custom('AttractionWomanManMultiple')], prontos e dispostos."
 bp1_yearly.7010.c.tt:0 "Você acredita que [tested_friend.GetFirstName] se importa mais com a amizade de [friends_friend.GetFirstNamePossessive] do que com a sua"
 bp1_yearly.7010.c:0 "A promessa de riquezas para seu #EMP outro#! amigo, [friends_friend.GetFirstNameNoTooltip]."
 bp1_yearly.7010.d:0 "Isso está abaixo de mim."
 bp1_yearly.7010.desc:0 "Não consigo parar de pensar onde estão as lealdades de [tested_friend.GetFirstNamePossessive]. Será que [tested_friend.GetSheHe] é um verdadeiro amigo ou apenas um bajulador?\n\nTalvez um pequeno teste coloque minha mente em paz...\n\nUm dos meus agentes, um segredo falso e um presente anônimo. O que faria [tested_friend.GetSheHe] trair minha confiança?"
 bp1_yearly.7010.t:0 "Um Teste de Lealdade"
 bp1_yearly.7010.toast.betrayed:0 "[tested_friend.GetSheHe|U] trai você"
 bp1_yearly.7010.toast.not_betrayed:0 "[tested_friend.GetSheHe|U] prova sua lealdade"
 bp1_yearly.7030.a:0 "Tenho certeza de que [dead_friend.GetFirstNameNoTooltip] aprovaria..."
 bp1_yearly.7030.b:0 "Reaja, [dead_friend_spouse.GetFirstNameNoTooltip]!"
 bp1_yearly.7030.desc:0 "[dead_friend_spouse.GetFirstName] tem estado devastado desde que [Select_CString( dead_friend.IsFemale, 'sua', 'seu' )] [dead_friend.Custom('WifeHusband')] [dead_friend.GetFirstName] morreu. [dead_friend_spouse.GetSheHe|U] vem me visitar uma noite.\n\n\"Me sinto tão solitári[Select_CString( dead_friend_spouse.IsFemale, 'a', 'o' )].\" [dead_friend_spouse.GetSheHe] diz, olhando para mim com desejo. Eu lembro que [dead_friend.GetFirstNameNoTooltip] era [Select_CString( dead_friend.IsFemale, 'minha boa amiga', 'meu bom amigo' )].\n\n\"Você tem sido tão reconfortante.\" [dead_friend_spouse.GetSheHe] diz, mordendo o lábio de forma sugestiva. [dead_friend.GetFirstNameNoTooltip] era [Select_CString( dead_friend.IsFemale, 'minha amiga', 'meu amigo' )].\n\n\"Só quero sentir alguma coisa.\" [dead_friend_spouse.GetSheHe] sussurra, afrouxando os fechos na frente d[dead_friend_spouse.Custom('GetUpperClothingArticle')]. [dead_friend.GetFirstNameNoTooltip] #EMP era#! [Select_CString( dead_friend.IsFemale, 'minha amiga', 'meu amigo' )]..."
 bp1_yearly.7030.t:0 "Conforto Carnal"
 bp1_yearly.7050.a:0 "Devo tentar esquecer."
 bp1_yearly.7050.b:0 "NUNCA mais perderei!"
 bp1_yearly.7050.desc.married:0 "[sleeping_spouse.GetFirstName] mexe ao meu lado, mas não acorda. Preciso lidar com meus problemas sozinho."
 bp1_yearly.7050.desc.not_married:0 "Sozinho no meu quarto, devo lidar com esses problemas por conta própria."
 bp1_yearly.7050.desc:0 "Estou de volta ao campo de batalha, a lama está grudando nas minhas botas, o fedor dos mortos está agredindo o meu nariz, mais uma vez estou revivendo o dia em que [war_memory.GetDescription].\n\nAcordo ofegante, gotas de suor frio grudadas no meu rosto."
 bp1_yearly.7050.t:0 "Inimigos Antigos"
 bp1_yearly.7051.a:0 "Nunca permitirei que isso aconteça novamente."
 bp1_yearly.7051.b:0 "Devo aprender a ser flexível."
 bp1_yearly.7051.desc:0 "Com uma clareza vívida, lembro-me quando [battle_memory.GetDescription]. Foi uma batalha que ocorreu em [battle_area.GetTerrain.GetNameNoTooltip], um terreno para o qual eu estava totalmente despreparado.\n\nDesde então, tenho pensado nisso, e estou confiante de que, se a batalha acontecesse hoje, eu seria um líder muito mais competente."
 bp1_yearly.7051.t:0 "A Batalha de [battle_area.GetNameNoTooltip] "
 bp1_yearly.7052.a:0 "Mantenha a tradição."
 bp1_yearly.7052.b:0 "Minha própria história!"
 bp1_yearly.7052.c:0 "Por que não os dois!"
 bp1_yearly.7052.desc:0 "O fogo ruge, as bebidas já foram consumidas e [story_friend.GetFirstName] está me chamando para contar uma história.\n\nMeu primeiro pensamento é em um famoso conto folclórico [ROOT.Char.GetCulture.GetNameNoTooltip], um clássico que nunca deixa de encantar.\n\nPor outro lado, e se eu contar uma história sobre a minha própria vida, talvez sobre a vez em que [story_memory.GetDescription]."
 bp1_yearly.7052.t:0 "Uma História Sobre..."
 bp1_yearly.7053.a.1:0 "Este esquema terá um bônus de chance de sucesso."
 bp1_yearly.7053.a:0 "Terei minha vingança."
 bp1_yearly.7053.b:0 "Devo tentar esquecer."
 bp1_yearly.7053.desc:0 "Enquanto caminho pela cidade, a raiva me domina mais uma vez, a única coisa em minha mente ultimamente é quando [bad_memory.GetDescription].\n\nDevo me vingar de [bad_memory_participant.GetFirstNameNoTooltip] de alguma forma. Olho para a forca à minha frente. Talvez, se eu agir com cuidado, [bad_memory_participant.GetSheHe] em breve estará pendurado lá."
 bp1_yearly.7053.t:0 "Memórias Vingativas"
 bp1_yearly.7054.a:0 "Ah sim, meu erro."
 bp1_yearly.7054.b:0 "Eu esqueço tanto nos dias de hoje."
 bp1_yearly.7054.desc:0 "\"[forgotten_memory.GetDescription]?\" pergunto confuso.\n\nM[Select_CString( memory_child.IsFemale, 'inha', 'eu' )] [memory_child.Custom('GetDaughterSon')] [memory_child.GetFirstName] está me olhando preocupado. \"Claro! Você já contou esta história muitas vezes, você não se lembra?\"\n\nA verdade é que não me lembro. Os detalhes têm ficado mais embaçados recentemente, mas talvez seja fraco confessar isso."
 bp1_yearly.7054.t:0 "Esquecendo"
 bp1_yearly.7055.a:0 "Vou registrá-lo eu mesmo, com a bênção de [ROOT.Char.GetFaith.HighGodName]."
 bp1_yearly.7055.b:0 "Não há tempo para isso..."
 bp1_yearly.7055.desc.alone_good_skill:0 "Minha maestria na língua [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] tornaria a escrita disso uma questão trivial.\n\n"
 bp1_yearly.7055.desc.alone_poor_skill:0 "Eu posso não ser um bom escritor, mas com tempo e esforço, com certeza poderia escrever algo por conta própria.\n\n"
 bp1_yearly.7055.desc.blind:0 "Infelizmente, minha cegueira me impede de escrever qualquer coisa...\n\n"
 bp1_yearly.7055.desc.ending:0 "Montar e ilustrar um livro rapidamente se torna um empreendimento custoso, no entanto..."
 bp1_yearly.7055.desc.friend:0 "Por outro lado, [Select_CString( friend.IsFemale, 'minha querida amiga', 'meu querido amigo' )] [friend.GetFirstName] é muito melhor em escrever do que eu. Certamente [friend.GetSheHe] ajudaria se fosse pedido?"
 bp1_yearly.7055.desc.negative:0 "Alguns momentos devem ser registrados para sempre. O momento em que [recorded_memory.GetDescription] é um deles. Pode ser uma memória dolorosa, mas alguém tem que passá-la para a próxima geração."
 bp1_yearly.7055.desc.neutral:0 "Alguns momentos devem ser registrados para sempre. O momento em que [recorded_memory.GetDescription] é um deles."
 bp1_yearly.7055.desc.poet:0 "Meu Poeta da Corte, [poet.GetFirstName], pode ser de grande utilidade. Seu domínio da prosa transformaria minhas palavras mundanas em arte."
 bp1_yearly.7055.desc.positive:0 "Alguns momentos devem ser registrados para sempre. O momento em que [recorded_memory.GetDescription] é um deles. Uma memória tão incrível deve ser preservada para todo o sempre."
 bp1_yearly.7055.friend:0 "[friend.GetFirstNameNoTooltip] é um verdadeiro amigo."
 bp1_yearly.7055.high_skill:0 "Vou registrá-lo eu mesmo."
 bp1_yearly.7055.poet:0 "O poeta [poet.GetFirstNameNoTooltip] escreverá isso!"
 bp1_yearly.7055.t:0 "Gravando uma Memória"
 bp1_yearly.7056.a:0 "Não se preocupe, apenas faça o que eu digo e você ficará bem..."
 bp1_yearly.7056.b:0 "Conte #EMP para todos#! sobre mim!"
 bp1_yearly.7056.desc:0 "Levo [intimidation_target.GetFirstName] para minhas [ROOT.Char.Custom('GetDungeonPlural')], onde começo a narrar para [intimidation_target.GetSheHe] histórias de coisas terríveis que fiz com as pessoas que me desafiaram.\n\n\"Tenho certeza de que você ouviu sobre como [intimidation_memory.GetDescription].\" Digo para [intimidation_target.GetSheHe] com prazer. \"Isso foi apenas #EMP o começo.#!\"\n\nEnquanto dou risada, os olhos de [intimidation_target.GetFirstNamePossessiveNoTooltip] se arregalam de medo."
 bp1_yearly.7056.t:0 "Táticas de Intimidação"
 bp1_yearly.7057.a.tt:0 "Este esquema terá um bônus de chance de sucesso."
 bp1_yearly.7057.a:0 "[sex_partner.GetNameNoTooltip] #EMP deve#! ser meu..."
 bp1_yearly.7057.b:0 "Afaste esses pensamentos!"
 bp1_yearly.7057.c:0 "Onde melhor para aliviar o estresse do que na [ROOT.Char.GetFaith.HouseOfWorship]?"
 bp1_yearly.7057.desc.female:0 "\n\nInfelizmente, isso está causando alguns efeitos colaterais um tanto problemáticos."
 bp1_yearly.7057.desc.male:0 "\n\nInfelizmente, isso está causando alguns efeitos colaterais bastante perceptíveis. Talvez, se eu posicionar o [ROOT.Char.GetFaith.ReligiousText] do jeito certo, eu possa esconder esse problema crescente sem que ninguém perceba..."
 bp1_yearly.7057.desc:0 "Estou sentado na [ROOT.Char.GetFaith.HouseOfWorship], meus pensamentos abandonando as palavras de [realm_priest.GetCouncilTitleFirstName] em favor do momento [sex_memory.GetDescription]. Desde então, tenho pensado n[sex_partner.GetSheHe] quase diariamente."
 bp1_yearly.7057.t:0 "Êxtase Religioso"
 bp1_yearly.7058.a:0 "Oh, você vai pagar por isso. E muito mais, se tiver."
 bp1_yearly.7058.b:0 "Se você gostou dos armazéns, vai #EMP adorar#! a [ROOT.Char.Custom('GetDungeon')]!"
 bp1_yearly.7058.c:0 "#EMP *Suspiro*#! Eu pago... Eu acho..."
 bp1_yearly.7058.desc:0 "O coro matinal de pássaros cantantes me acompanha até os armazéns, a luz tênue do amanhecer dando lugar à escuridão sombria do [ROOT.Char.Custom('GetRoom')]. Eu bocejo e me espreguiço enquanto caminho, meus pés deslizando pelo chão.\n\nAssim que meus olhos se ajustam à falta de luz, uma tragédia culinária é revelada por eles: caroços de maçã, migalhas espalhadas, ossos limpos de carne. Meus olhos, chocados, varrem o [ROOT.Char.Custom('GetRoom')], mas em todo lugar encontram ainda mais evidências.\n\nDe repente, no canto, um suave e satisfeito #EMP arroto#!..."
 bp1_yearly.7058.glutton:0 "Eu tenho mais comida! Vamos abrir o #EMP esconderijo secreto!#!"
 bp1_yearly.7058.t:0 "Catástrofe Provisória"
 bp1_yearly.7100.a:0 "Agora é #EMP pessoal...#!"
 bp1_yearly.7100.b:0 "Vou me limpar no sangue [potential_nemesis.GetHerHim]!"
 bp1_yearly.7100.c.tt:0 "O amado gato d[Select_CString( potential_nemesis.IsFemale, 'a', 'o' )] [potential_nemesis.GetFirstNameNoTooltip] estava rondando aqui mais cedo..."
 bp1_yearly.7100.c:0 "Marquem minhas palavras, [potential_nemesis.GetFirstNameNoTooltip]: essa pele será substituída."
 bp1_yearly.7100.d:0 "A vingança está abaixo de mim..."
 bp1_yearly.7100.desc:0 "Num momento eu estava apreciando uma boa caminhada ao sol pelos arredores de [owned_county.GetName] e, no seguinte, estou cobert[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] de excremento e rolando na lama. Depois de limpar furiosamente as fezes de meus olhos, encontro o culpado com facilidade.\n\n\"[potential_nemesis.GetTitledFirstName] envia suas saudações!\" O camponês pendurado na janela grita antes de fugir da cena.\n\nPateticamente, tento lavar uma peça de roupa que prezo muito em um riacho próximo, mas é evidente que está além de qualquer salvação."
 bp1_yearly.7100.e:0 "Vou guardar estas roupas para... depois."
 bp1_yearly.7100.t:0 "Do Desagrado ao Ódio"
 bp1_yearly_7001.a.tt:0 "Você vai em uma pescaria"
 didnt_trust_friend_opinion:0 "Não confiou em mim."
 drenched_in_excrement_opinion:0 "Encharcado de Excremento"
 focused_on_revenge_modifier:0 "Focado na Vingança"
 focused_on_revenge_modifier_desc:0 "Este personagem está exclusivamente focado na queda de seus rivais, ignorando muitas de suas responsabilidades."
 forgave_me_opinion:0 "Me perdoou."
 improved_artifact_opinion:0 "Melhorou meu artefato."
 lovely_picnic_modifier:0 "Piquenique Encantador"
 lovely_picnic_modifier_desc:0 "Participou de um piquenique encantador."
 messed_with_artifact_opinion:0 "Mexeu com meu artefato."
 murder_memory_modifier:0 "Memórias Vingativas"
 recorded_memory:0 "Memória de [ROOT.Char.GetTitledFirstNamePossessiveNoTooltip]"
 recorded_memory_character:0 "Uma Memória de [memory_participant.GetTitledFirstNameNoTooltip]"
 recorded_memory_desc:0 "Este livro conta a história de quando [recorded_memory.GetThirdPerspectiveDescription].\n\nComposto [Select_CString( ROOT.Char.IsFemale, 'pela', 'pelo' )] [ROOT.Char.GetFirstName]."
 sex_memory_modifier:0 "Memórias Sensuais"
 threw_excrement_opinion:0 "Quase Encharcado de Excremento"
 trusted_friend_opinion:0 "Confio em mim."
 vengeance_obsessed_modifier:0 "Obcecado por Vingança"
 vengeful_opinion:0 "Vingativo"
