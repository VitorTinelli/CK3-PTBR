l_spanish:
 1021_trinket_desc:0 "[new_trinket.GetDesc]\n\n[new_trinket.GetFirstNameNoTooltip|U] passou para [Select_CString( ROOT.Char.IsFemale, 'sua melhor amiga', 'seu melhor amigo' )] [ROOT.Char.GetFirstNameNoTooltip] em seu leito de morte."
 bp1_yearly.1000.a.tt.2:0 "Truques Aprendidos!"
 bp1_yearly.1000.a.tt.3:0 "Você adquire o hábito"
 bp1_yearly.1000.a.tt:0 "[friend.GetShortUIName] te ensina todos os truques"
 bp1_yearly.1000.a1:0 "Estamos pensando na mesma #EMP carne especial#!?"
 bp1_yearly.1000.a:0 "Claro, vou experimentar por você!"
 bp1_yearly.1000.b.tt:0 "Você prefere se concentrar em suas responsabilidades."
 bp1_yearly.1000.b:0 "Isso não me parece #EMP muito#! atraente..."
 bp1_yearly.1000.c:0 "Como você ousa #EMP#!!"
 bp1_yearly.1000.desc:0 "[Select_CString( friend.IsFemale, 'Minha melhor amiga', 'Meu melhor amigo' )] [friend.GetTitledFirstName] se aproxima de mim com um grande sorriso no rosto.\n\n\"Meu querido amigo, finalmente nos encontramos! Sinto como se nunca mais tivéssemos passado um tempo de qualidade juntos ultimamente... Talvez você esteja disposto a experimentar algo novo comigo? Eu sei exatamente o que pode distrair sua mente, restaurar seu corpo e elevar seu espírito!"
 bp1_yearly.1000.desc_athletic:0 "\n\n\"Atividade física é sempre a resposta! Suor para fora da sua dor! Faça seus músculos gritarem tão alto que você não consiga ouvir seus próprios pensamentos! #EMP LIBERE SUA RAIVA#!! Me encontre no pátio, e eu vou te mostrar como!\""
 bp1_yearly.1000.desc_cannibal:0 "\n\n\"Por que você não vem até minha casa para o jantar? Eu tenho um lote fresco de carne #EMP especial#! como você nunca provou antes - carne #EMP proibida#!, se você me entende..."
 bp1_yearly.1000.desc_confider:0 "\n\n\"Na minha experiência, nada me traz maior conforto do que compartilhar meus problemas com alguém querido. Se você já se sentir sobrecarregado, lembre-se de que sempre pode conversar comigo. Você se sentirá melhor - eu prometo!\""
 bp1_yearly.1000.desc_deviant:0 "\n\n\"Você deveria se juntar a mim em minhas #EMP explorações#! à noite! Nada é mais revigorante do que encontrar prazer nas coisas pequenas... Ou #EMP grandes#!, se preferir... O que você acha de #EMP [friend.Custom('DeviantObjectPlural')]#!?"
 bp1_yearly.1000.desc_drunkard:0 "\n\n\"#EMP [ROOT.Char.Custom('RegionalAlcoholicDrink')|U]#!!! Meu amigo, vamos beber nossas tristezas! Deixar uma taça empurrar a outra é o melhor de todos os remédios!\""
 bp1_yearly.1000.desc_fallback_1:0 "\n\n\"Que tal um pouco de pesca? O silêncio da natureza ao redor e nada além de você, sua presa, boas bebidas e boa companhia...\""
 bp1_yearly.1000.desc_fallback_2:0 "\n\n\"Que tal uma visita ao mercado local? Ver outras pessoas ocupadas enquanto você está simplesmente passeando é bastante catártico, e você pode encontrar algo agradável para comprar!\""
 bp1_yearly.1000.desc_fallback_3:0 "\n\n\"Há um famoso menestrel errante na cidade, que tal irmos assistir a uma apresentação? Tenho certeza de que será bom!\""
 bp1_yearly.1000.desc_hashish:0 "\n\n\"Quando o estresse e as responsabilidades te oprimirem, eu tenho a receita certa para deixar todos os seus problemas para trás! Você já experimentou meus bolos #EMP especiais#!?"
 bp1_yearly.1000.desc_hunter:0 "\n\n\"O silêncio da floresta e a emoção da caça certamente vão te fazer se sentir melhor! Eles nunca falham comigo, e eu adoraria compartilhar essa paixão com você.\""
 bp1_yearly.1000.desc_reveler:0 "\n\n\"Uma noite inteira de festa! Comer, beber, cantar, dançar e fazer alegria; é disso que você precisa! Venha comigo!\""
 bp1_yearly.1000.desc_witch:0 "\n\n\"Por que você não se junta a mim para um passeio noturno? Eu conheço todas as artes secretas para atrair fortuna, prender a morte, escravizar o amor e atrair ouro; eu adoraria te ensinar todas elas!\""
 bp1_yearly.1000.t:0 "Um Novo Passatempo"
 bp1_yearly.1010.a.failure.tt:0 "[ROOT.Char.GetFaith.ReligiousHeadName|U] não Convencido"
 bp1_yearly.1010.a.failure:0 "[pope.GetTitledFirstNameNoTooltip|U] não está convencid[Select_CString( pope.IsFemale, 'a', 'o' )]"
 bp1_yearly.1010.a.horrible_failure.tt:0 "[ROOT.Char.GetFaith.ReligiousHeadName|U] Ofendido!"
 bp1_yearly.1010.a.horrible_failure:0 "[pope.GetTitledFirstNameNoTooltip|U] está ofendid[Select_CString( pope.IsFemale, 'a', 'o' )]"
 bp1_yearly.1010.a.success.tt:0 "Excomunhão Revogada!"
 bp1_yearly.1010.a.success:0 "[friend.GetShortUIName] persuade [pope.GetTitledFirstNameNoTooltip] a revogar sua excomunhão"
 bp1_yearly.1010.a:0 "Por favor, tente, por minha causa..."
 bp1_yearly.1010.b:0 "Isso não é necessário."
 bp1_yearly.1010.desc:0 "Ao encontrar [Select_CString( friend.IsFemale, 'minha amiga', 'meu amigo' )] [friend.GetTitledFirstName] saindo da [friend.GetFaith.HouseOfWorship], imediatamente fica claro que [friend.GetSheHe] tem algo para me contar.\n\n\"Meu amigo! Tenho rezado por você desde o dia em que foi excluído da comunidade dos fiéis! Não posso deixar de me preocupar com sua pobre alma... Eu realmente gostaria de poder ajudá-lo mais!\n\n\"Você me permitiria pleitear sua causa perante o [ROOT.Char.GetFaith.ReligiousHeadName]? [pope.GetSheHe|U] pode estar disposto a perdoar suas transgressões passadas agora!\""
 bp1_yearly.1010.t:0 "Mediação Sagrada"
 bp1_yearly.1020.a:0 "Por favor, fique comigo..."
 bp1_yearly.1020.b:0 "Não quero que me veja assim."
 bp1_yearly.1020.desc:0 "\n\nEles devem ter percebido minha inquietação pelos sons fracos que deixam minha boca e pelos movimentos bruscos de minhas mãos, pois seus passos se tornam apressados, e em breve uma mão calorosa segura a minha e um rosto familiar entra no meu campo de visão.\n\n\"Silêncio, [ROOT.Char.GetFirstNameNoTooltip], sou eu, [friend.GetFirstName]. Oh, como me dói te ver assim... Eu gostaria de poder fazer algo, #EMP qualquer coisa#!, para aliviar seu desconforto.\""
 bp1_yearly.1020.desc_intro:0 "Enquanto estou deitado na minha cama amaldiçoando meu corpo fraco e falhando, mal consigo distinguir a figura que se aproxima. Seus passos lentos e o pesado silêncio começam a me assustar."
 bp1_yearly.1020.t:0 "Um Amigo até o Fim"
 bp1_yearly.1021.a:0 "Vou ficar ao seu lado."
 bp1_yearly.1021.b:0 "Não posso te ver assim. Me perdoe."
 bp1_yearly.1021.c:0 "Descanse em paz, [Select_CString( friend.IsFemale, 'minha querida', 'meu querido' )] [friend.GetFirstNameNoTooltip]."
 bp1_yearly.1021.desc:0 "Ainda vejo todas as boas lembranças que compartilhei com [friend.GetFirstName]. Agora, quando entro na sala fracamente iluminada e vejo o corpo fraco [friend.GetHerHim] deitado na cama, quase imóvel, sei com certeza que esses dias não voltarão, e sinto uma profunda tristeza.\n\n[friend.GetSheHe|U] me ouve entrando e parece ficar agitado, então eu me apresso ao lado [friend.GetHerHim].\n\n\"Sou eu, [Select_CString( ROOT.Char.IsFemale, 'sua querida', 'seu querido' )] [ROOT.Char.GetFirstNameNoTooltip]! Estou aqui.\""
 bp1_yearly.1021.desc_bestie:0 "\n\nPor um momento, [friend.GetFirstNameNoTooltip] parece me reconhecer, e faz um gesto para eu me aproximar."
 bp1_yearly.1021.desc_end:0 "É apenas um momento fugaz; depois, os olhos de [friend.GetFirstNamePossessiveNoTooltip] voltam a ficar desfocados."
 bp1_yearly.1021.desc_misery:0 "\"Por favor, me liberte...\" [friend.GetSheHe] murmura."
 bp1_yearly.1021.desc_secret:0 "\"Há algo... Eu nunca te contei...\" [friend.GetSheHe] sussurra no meu ouvido. Meus olhos se arregalam ao ouvir a verdade."
 bp1_yearly.1021.desc_token:0 "\"Pegue... isso...\" [friend.GetSheHe] murmura. Eu concordo e pego o que [friend.GetSheHe] me oferece. Juro a mim mesmo que vou guardá-lo em memória de [friend.GetFirstNamePossessiveNoTooltip]."
 bp1_yearly.1030.a:0 "Sabe de uma coisa? #EMP Eu te perdoo#!."
 bp1_yearly.1030.b:0 "#EMP APENAS SAIA!#!"
 bp1_yearly.1030.c:0 "...#EMP socorro#!..."
 bp1_yearly.1030.c_barely_saved_guard.tt:0 "[guard.GetShortUIName] mal conseguiu te salvar!"
 bp1_yearly.1030.c_barely_saved_guard:0 "[guard.GetShortUIName] mal consegue te salvar"
 bp1_yearly.1030.c_killed:0 "Você é morto"
 bp1_yearly.1030.c_killed_all:0 "Você e seu [GetCourtPositionType('bodyguard_court_position').GetName()] são mortos"
 bp1_yearly.1030.c_killed_guard.tt:0 "[guard.GetShortUIName] te salvou, mas morreu!"
 bp1_yearly.1030.c_killed_guard:0 "[guard.GetShortUIName] te salva, mas morre"
 bp1_yearly.1030.c_saved.tt:0 "Você se defendeu do atacante!"
 bp1_yearly.1030.c_saved:0 "Você consegue se defender do atacante"
 bp1_yearly.1030.c_saved_guard.tt:0 "[guard.GetShortUIName] te salvou!"
 bp1_yearly.1030.c_saved_guard:0 "[guard.GetShortUIName] mata o assassino em potencial"
 bp1_yearly.1030.desc:0 "\n\n\"HA! Olhe para você agora! Não tão temível assim, né? Você sequer me reconheceu, s[Select_CString( ROOT.Char.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rival'))] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))]? Sou eu, [rival.GetFirstName]! Oh, como eu esperei tanto para te ver tão humilhado!"
 bp1_yearly.1030.desc_nemesis:0 "\n\n\"Não, eu não vim\" [nemesis.GetSheHe] responde. Nem consigo registrar o brilho perigoso nos olhos [nemesis.GetHerHim] antes que [nemesis.GetFirstNameNoTooltip] esteja ao meu lado na minha cama, um sorriso gélido no rosto."
 bp1_yearly.1030.desc_nemesis_guard:0 "Eu já perdi toda a esperança quando meu [GetCourtPositionType('bodyguard_court_position').GetName()] [guard.GetFirstName] irrompe no quarto!"
 bp1_yearly.1030.desc_nemesis_no_guard:0 "Tento me mover, escapar, gritar, #EMP qualquer coisa#!, mas meu corpo frágil há muito tempo parou de me ouvir..."
 bp1_yearly.1030.desc_rival:0 "\n\nA risada amarga de [rival.GetFirstNameNoTooltip] desencadeia algumas lembranças desagradáveis em minha mente, mas uma névoa opaca logo as envolve novamente. Nem consigo lembrar por que nos odiávamos tanto."
 bp1_yearly.1030.t:0 "Até o Amargo Fim"
 bp1_yearly.1031.a:0 "Tudo isso parece tão sem sentido agora, não é?"
 bp1_yearly.1031.b:0 "Você conseguiu o que merecia."
 bp1_yearly.1031.c.tt:0 "Mas primeiro terei que me livrar do guarda!"
 bp1_yearly.1031.c:0 "#EMP Tão... tão... fraco...#!"
 bp1_yearly.1031.c_barely_saved_guard:0 "Você só fere [nemesis.GetShortUIName] e [guard.GetShortUIName]"
 bp1_yearly.1031.c_failed.tt:0 "Você falhou na tentativa de assassinato!"
 bp1_yearly.1031.c_killed:0 "Você mata [nemesis.GetShortUIName]"
 bp1_yearly.1031.c_killed_all.tt:0 "Você conseguiu!"
 bp1_yearly.1031.c_killed_all:0 "Você mata tanto [nemesis.GetShortUIName] quanto o seu(a) [GetCourtPositionType('bodyguard_court_position').GetName()] [guard.GetShortUIName]"
 bp1_yearly.1031.c_killed_guard:0 "Você só fere [nemesis.GetShortUIName], mas mata [guard.GetShortUIName]"
 bp1_yearly.1031.c_saved:0 "[nemesis.GetShortUIName] consegue se defender de você"
 bp1_yearly.1031.c_saved_guard:0 "[guard.GetShortUIName] te mata"
 bp1_yearly.1031.desc:0 "Desde que as notícias sobre a doença de [rival.GetTitledFirstNamePossessive] chegaram até mim, tenho sido incapaz de encontrar paz. Eu só precisava ver com meus próprios olhos. Agora que estou aqui, observando o corpo fraco [rival.GetHerHim], deitado quase imóvel naquela cama, se agarrando desesperadamente à vida com qualquer força residual, sinto-me sobrecarregado por emoções contrastantes."
 bp1_yearly.1031.desc_guard:0 "Enquanto estou perdido em meus devaneios, percebo com cautela os olhos frios do [GetCourtPositionType('bodyguard_court_position').GetName()] d[Select_CString( nemesis.IsFemale, 'a', 'o' )] [nemesis.GetFirstNamePossessiveNoTooltip], [guard.GetTitledFirstName], me encarando do lado do quarto."
 bp1_yearly.1031.desc_nemesis:0 "\n\nNão seria mais fácil simplesmente deixar de lado toda a dor e a raiva? E ainda assim, [nemesis.GetFirstNameNoTooltip] nunca pareceu tão fraco, ou tão vulnerável... Frágil o suficiente para que eu pudesse #EMP quebrar#! [nemesis.GetSheHe] com as minhas próprias mãos..."
 bp1_yearly.1031.desc_rival:0 "\n\n\"Você sequer me reconheceu, s[Select_CString( rival.IsFemale, 'ua', 'eu' )] [rival.Custom2('InsultNoun', ROOT.Char)] [rival.Custom2('InsultAdjective', ROOT.Char)]? A face [rival.GetHerHim] parece contrair por um momento, e os olhos [rival.GetHerHim] rolam em busca, mas sem nunca se concentrar em mim."
 bp1_yearly.1040.a:0 "Com certeza! Um brinde [Select_CString( new_friend.IsFemale, 'a', 'ao' )] [new_friend.GetFirstNameNoTooltip]!"
 bp1_yearly.1040.b.tt:0 "Todo mundo sabe que os melhores relacionamentos são baseados em verdadeira amizade!"
 bp1_yearly.1040.b:0 "Ou talvez algo #EMP mais#!?"
 bp1_yearly.1040.c:0 "Eu realmente não gosto [new_friend.GetHerHim] tanto #EMP assim#!"
 bp1_yearly.1040.desc:0 "Estou felizmente relaxando no banho público, compartilhando reflexões profundas e piadas picantes com [new_friend.GetTitledFirstName]. Ao sentir toda a tensão deixando meu corpo, percebo que não é apenas a água quente que está relaxando meus músculos.\n\nEstou realmente me divertindo! E tudo por causa da companhia de [new_friend.GetFirstNamePossessiveNoTooltip]."
 bp1_yearly.1040.desc_best_friend:0 "Já considero [new_friend.GetSheHe] entre meus amigos, mas percebo que realmente espero ansiosamente qualquer momento que passamos juntos, valorizo a opinião [new_friend.GetHerHim] acima de todas as outras, e cada momento com [new_friend.GetSheHe] é cheio de risos e calor.\n\nSerá que [new_friend.GetFirstNameNoTooltip] se tornou meu #EMP melhor amigo#!?"
 bp1_yearly.1040.desc_friend:0 "Até descobrirmos nossa paixão comum pelos banhos públicos, não tivemos muitas chances de interagir ou nos conhecermos melhor. Agora, realmente ansio por nossos encontros regulares lá, pois eles estão sempre cheios de risos e animação!\n\nSerá que realmente nos tornamos #EMP amigos#!?"
 bp1_yearly.1040.t:0 "Algo em Comum"
 bp1_yearly.1050.a:0 "[new_rival.GetSheHe|U] vai pagar por isso."
 bp1_yearly.1050.b:0 "Eu quero [new_rival.GetSheHe] morto. #EMP AGORA#!."
 bp1_yearly.1050.c:0 "Eu provavelmente estou exagerando..."
 bp1_yearly.1050.desc:0 "Estou confortavelmente relaxando no banho público, finalmente tendo um merecido tempo livre, quando uma voz irritante vinda de algum lugar próximo interrompe meus pensamentos tranquilos.\n\n\"Você viu [ROOT.Char.GetSheHe]...? E aquela #EMP ridiculamente#! pequena...?\" Um pouco mais adiante na sala, vejo [new_rival.GetTitledFirstName] fazendo gestos obscenos, cercado por uma multidão de bajuladores rindo. É difícil não perceber que todos estão olhando para mim."
 bp1_yearly.1050.desc_nemesis:0 "\n\nCHEGA!! Estou cansado das bobagens [new_rival.GetHerHim]! [new_rival.GetFirstNameNoTooltip] tem me antagonizado por tempo demais, e agora [new_rival.GetSheHe] também está tentando arruinar meu tempo no banho?! Eu nunca conheci um[Select_CString( new_rival.IsFemale, 'a', '' )] [new_rival.Custom2('InsultNoun', ROOT.Char)] [new_rival.Custom2('InsultAdjective', ROOT.Char)] como [new_rival.GetSheHe]! MALDITO SEJA, [new_rival.GetFirstNameNoTooltip]!"
 bp1_yearly.1050.desc_rival:0 "\n\nEu mal conheço [new_rival.GetSheHe], e já sinto que o odeio. Como [new_rival.GetFirstNameNoTooltip] #EMP se atreve#! a me ridicularizar em público?! Eu não vou esquecer esse insulto..."
 bp1_yearly.1050.t:0 "Companhia Irritante"
 bp1_yearly.1060.a:0 "E se tudo isso for #EMP verdadeiro#!?"
 bp1_yearly.1060.b:0 "Deixe-me mostrar o erro em seus caminhos."
 bp1_yearly.1060.b_not_persuaded.tt:0 "[friend.GetShortUIName] Não Persuadido!"
 bp1_yearly.1060.b_not_persuaded:0 "[friend.GetShortUIName] não se impressiona com seus argumentos"
 bp1_yearly.1060.b_persuaded.tt:0 "[friend.GetShortUIName] Persuadido!"
 bp1_yearly.1060.b_persuaded:0 "Você persuade [friend.GetShortUIName] a abandonar suas superstições"
 bp1_yearly.1060.b_you_persuaded.tt:0 "[friend.GetShortUIName] mudou sua mente!"
 bp1_yearly.1060.b_you_persuaded:0 "[friend.GetShortUIName] vira o jogo e te persuade"
 bp1_yearly.1060.c:0 "#EMP Crenças blasfemas!#!"
 bp1_yearly.1060.d:0 "Bobagem!"
 bp1_yearly.1060.desc:0 "Da última vez que vi [friend.GetTitledFirstName], [friend.GetSheHe] estava se livrando sorrateiramente do meu chapéu amarelo porque \"o amarelo é uma cor de azar para pessoas do meu nascimento\". Da vez anterior, tive que acompanhar [friend.GetSheHe] em um desvio ridiculamente longo para evitar um gato preto dormindo. \"É azarado!\" [friend.GetSheHe] disse. Nem quero lembrar da vez em que [friend.GetSheHe] #EMP pensou#! que tinha perdido o amuleto da sorte!\n\nNo entanto, ao pegar [friend.GetSheHe] jogando fora metade do meu precioso sal só porque tinha sido derramado, sinto minha paciência se esgotando..."
 bp1_yearly.1060.t:0 "Mente Supersticiosa"
 bp1_yearly.1070.a.tt:0 "Esse esquema ganha chances extras de sucesso."
 bp1_yearly.1070.a:0 "As possibilidades são realmente infinitas..."
 bp1_yearly.1070.c:0 "Vou mexer com a cabeça [rival.GetHerHim]."
 bp1_yearly.1070.d:0 "Não vou me rebaixar tão baixo."
 bp1_yearly.1070.desc:0 "Não escapou à minha observação que o desprezível [rival.GetTitledFirstName] é um[Select_CString( rival.IsFemale, 'a', '' )] [rival.GetWomanMan] muito supersticios[Select_CString( rival.IsFemale, 'a', 'o' )]. [rival.GetSheHe|U] teme dias de azar, cores de azar, animais de azar e até árvores de azar! Ver a sombra do pássaro errado na hora errada poderia enviar [rival.GetSheHe] para uma espiral de pânico imprevisível por dias.\n\nEnquanto a observação rigorosa de seus rituais parece trazer para [rival.GetSheHe] uma sensação de segurança inestimável, uma mínima divergência deles poderia ter efeitos imprevisivelmente grandes em sua paz de espírito - efeitos dos quais eu poderia tirar proveito..."
 bp1_yearly.1070.t:0 "Má Sorte, [rival.GetFirstNameNoTooltip]!"
 bp1_yearly.1080.a.failure.tt:0 "Fuga d[Select_CString( relative.IsFemale, 'a', 'o' )] [relative.GetFirstNamePossessiveNoTooltip] Falha"
 bp1_yearly.1080.a.failure:0 "[relative.GetShortUIName] falha em escapar"
 bp1_yearly.1080.a.success:0 "Você consegue levar [relative.GetShortUIName] de volta para casa"
 bp1_yearly.1080.a:0 "Isso é #EMP ultrajante#!"
 bp1_yearly.1080.b:0 "Não podemos colocar uma aliança em risco por causa disso."
 bp1_yearly.1080.c:0 "Por favor, seja paciente..."
 bp1_yearly.1080.d.failure.tt:0 "[relative.GetFirstNameNoTooltip] não foi Liberad[Select_CString( relative.IsFemale, 'a', 'o' )]"
 bp1_yearly.1080.d.failure:0 "[spouse.GetShortUIName] ignora seus pedidos"
 bp1_yearly.1080.d.success:0 "Você persuade [spouse.GetShortUIName] a deixar [relative.GetShortUIName] partir"
 bp1_yearly.1080.d:0 "IMPERDOÁVEL!"
 bp1_yearly.1080.desc:0 "Desde que fui casado com [Select_CString( spouse.IsFemale, 'a vilã', 'o vil' )] [spouse.GetTitledFirstName], meus dias têm sido preenchidos apenas com miséria."
 bp1_yearly.1080.ending:0 "Por favor, não se esqueça [Select_CString( relative.IsFemale, 'da sua dedicada', 'do seu dedicado' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('relative'))]."
 bp1_yearly.1080.fallback:0 "Temo que não conseguirei tolerar a personalidade desagradável e os hábitos repugnantes [spouse.GetHerHim] por muito mais tempo..."
 bp1_yearly.1080.intoxicated:0 "[spouse.GetSheHe|U] está perpetuamente intoxicado e mal presente para [spouse.GetHerHimself]."
 bp1_yearly.1080.opening:0 "[relative.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp1_yearly.1080.profligate:0 "Os hábitos de gastança [spouse.GetHerHim] não têm medida nem razão, o reino está perpetuamente à beira da falência, e vivemos na pobreza indigna!"
 bp1_yearly.1080.reclusive:0 "[spouse.GetSheHe|U] abomina a companhia humana, foge de suas responsabilidades e me abandona também. Sinto como se estivesse casado com um fantasma."
 bp1_yearly.1080.sexuality:0 "[spouse.GetSheHe|U] não faz segredo de suas insaciáveis necessidades sexuais - eu coro só de pensar nas muitas escapadas [spouse.GetHerHim]!"
 bp1_yearly.1080.violence:0 "[spouse.GetSheHe|U] parece se deliciar com o sofrimento alheio. Até mesmo os súditos [spouse.GetHerHim] são aterrorizados. Eu temo pela minha segurança aqui."
 bp1_yearly.1081.a:0 "Vamos conseguir o divórcio para você, #EMP agora#!."
 bp1_yearly.1081.b:0 "Me conte tudo sobre suas desventuras..."
 bp1_yearly.1081.c:0 "#EMP Até que a morte nos separe#!, você disse...?"
 bp1_yearly.1081.desc:0 "Eu quase não posso acreditar nos meus próprios olhos quando [Select_CString( relative.IsFemale, 'minha amada', 'meu amado' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('relative'))], [relative.GetTitledFirstName], finalmente é trazido de volta para meus aposentos. Meu plano deu certo, e [relative.GetSheHe] finalmente está longe das garras daquel[Select_CString( spouse.IsFemale, 'a', 'e' )] [spouse.Custom2('InsultNoun', ROOT.Char)] [spouse.Custom2('InsultAdjective', ROOT.Char)], [spouse.GetTitledFirstName]!\n\nEnquanto faço um gesto para [relative.GetSheHe] se juntar a mim junto à lareira, me ocorre que eles ainda estão casados... Eu me pergunto se há algo mais que eu possa fazer sobre isso, ou se devo me contentar em ver [relative.GetSheHe] seguro e são ao meu lado novamente."
 bp1_yearly.1081.t:0 "Bem-Vindo de Volta!"
 bp1_yearly.1082.a:0 "Excelente..."
 bp1_yearly.1082.desc:0 "Recentemente, descobri que [Select_CString( spouse.IsFemale, 'minha', 'meu' )] [spouse.GetWifeHusband] [spouse.GetFirstName] - aquel[Select_CString( spouse.IsFemale, 'a', 'e' )] [spouse.Custom2('InsultNoun', SCOPE.sC('relative'))] [spouse.Custom2('InsultAdjective', SCOPE.sC('relative'))] - tinha outro segredo sujo! Não esqueci que você tentou me ajudar a escapar do meu casamento infeliz; como sinal de minha gratidão, decidi compartilhá-lo com você. Não é muito, mas espero que você ache útil."
