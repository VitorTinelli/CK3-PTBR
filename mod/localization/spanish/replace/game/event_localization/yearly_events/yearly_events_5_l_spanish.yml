l_spanish:
 tooltip.5010.b.critfail:0 "Eu irritei os dois vassalos"
 tooltip.5010.b.fail:0 "Eu falhei em reconciliar os dois vassalos"
 tooltip.5010.b.success:0 "Eu consegui reconciliar os dois vassalos"
 tooltip.5010.d.vassalsfight.effect:0 "[bickering_vassal_2.GetFirstName] desafia [bickering_vassal_1.GetFirstName] para um duelo até a morte!"
 tooltip.5010.d.vassalsfight:0 "Eu consegui provocar os dois vassalos a lutarem entre si"
 tooltip.5010.d.vassalsfightfail:0 "[bickering_vassal_2.GetFirstName] se recusa a ser arrastado para uma luta"
 tooltip.5020.c.critfail.effect:0 "[helpful_councillor.GetFirstName] fica ofendid[Select_CString( helpful_councillor.IsFemale, 'a', 'o' )] e para de orientar [scoped_heir.GetFirstName]"
 tooltip.5020.c.critfail:0 "[helpful_councillor.GetFirstNameNoTooltip] descobre que decidi espioná-l[Select_CString( helpful_councillor.IsFemale, 'a', 'o' )]"
 tooltip.5020.c.fail.effect:0 "Talvez eu tenha que tomar medidas"
 tooltip.5020.c.fail:0 "As razões de [helpful_councillor.GetFirstNamePossessiveNoTooltip] para educar [scoped_heir.GetFirstNameNoTooltip] me escapam"
 tooltip.5020.c.success.effect:0 "A tutoria continua sem interrupções"
 tooltip.5020.c.success:0 "Descubro as razões de [helpful_councillor.GetFirstNamePossessiveNoTooltip] para educar [scoped_heir.GetFirstNameNoTooltip]"
 tooltip_yearly_5022_a:0 "Permita que [helpful_councillor.GetFirstName] continue com a tutoria."
 yearly.5001.a.a.lover:0 "E mesmo assim, gostaria que não tivesse chegado a isso..."
 yearly.5001.a.a.spouse:0 "Sinto muito profundamente... Você tinha todo o direito."
 yearly.5001.a.b.lover:0 "Você fez seu ponto. Agora, vamos deixar isso para trás."
 yearly.5001.a.b.spouse:0 "Você fez seu ponto, [bickering_spouse.GetWifeHusband]. Agora, vamos deixar isso para trás."
 yearly.5001.a.c.lover:0 "Talvez realmente tenha sido a única maneira..."
 yearly.5001.a.c.spouse:0 "Apenas espero que eu possa encontrar em meu coração o perdão."
 yearly.5001.b:0 "Como você pôde?! Desapareça, antes que eu o jogue na masmorra."
 yearly.5001.backstabbing.attackerwins.desc:0 "que rapidamente aproveita a distração de seu rival para cravar uma adaga no pulmão [bickering_loser.GetHerHim]."
 yearly.5001.backstabbing.defenderwins.desc:0 "ainda assim, talvez percebendo o perigo iminente, [bickering_winner.GetFirstNameNoTooltip] imediatamente se vira para [bickering_loser.GetFirstNameNoTooltip], torcendo o pulso e apunhalando [bickering_loser.GetSheHe] com sua própria adaga."
 yearly.5001.backstabbing.desc:0 "Estou prestes a sair da sala de jantar e voltar aos meus aposentos quando vejo m[Select_CString( bickering_lover.IsFemale, 'inha', 'eu' )] amante [bickering_lover.GetFirstNameNoTooltip] conversando com [Select_CString( bickering_spouse.IsFemale, 'minha', 'meu' )] [bickering_spouse.GetWifeHusband] em um canto isolado. [bickering_defender.GetFirstName] se vira para me cumprimentar, deixando [bickering_defender.GetHerselfHimself] inconsciente de [bickering_attacker.GetFirstName],"
 yearly.5001.c:0 "Não vou esquecer disso, [bickering_winner.GetFirstNameNoTooltip]."
 yearly.5001.d:0 "Não. Todo o reino saberá de seu crime traiçoeiro!"
 yearly.5001.duelling.attackerwins.desc:0 "atingindo [bickering_loser.GetSheHe] e deixando [bickering_loser.GetSheHe] sangrando no chão, morto."
 yearly.5001.duelling.defenderwins.desc:0 "mas tem seu golpe bloqueado no último momento por seu oponente, que empurra [bickering_loser.GetSheHe] com força e depois o empala com sua própria arma."
 yearly.5001.duelling.desc:0 "O eco repentino de duas vozes familiares chama minha atenção, levando-me aos aposentos de [Select_CString( bickering_spouse.IsFemale, 'minha', 'meu' )] [bickering_spouse.GetWifeHusband].\n\nQuando chego, fico chocado ao encontrar [Select_CString( bickering_spouse.IsFemale, 'minha', 'meu' )] [bickering_spouse.GetWifeHusband] [bickering_spouse.GetFirstName] envolvido em uma acalorada discussão com m[Select_CString( bickering_lover.IsFemale, 'inha', 'eu' )] amante, [bickering_lover.GetFirstName]. Ao me avistar, [bickering_attacker.GetFirstNameNoTooltip] rapidamente saca sua arma e a arremessa em direção [Select_CString( bickering_defender.IsFemale, 'a', 'ao' )] [bickering_defender.GetFirstNameNoTooltip],"
 yearly.5001.e:0 "Você está certo! Nada mais está entre nós agora!"
 yearly.5001.f:0 "A Corte saberá o que [bickering_loser.GetFirstNameNoTooltip] tentou fazer com você."
 yearly.5001.g:0 "Não posso deixar esse crime impune. Guardas!"
 yearly.5001.i:0 "Nunca soube que você poderia ser tão cruel... Eu adoro isso!"
 yearly.5001.lover.epilogue.desc:0 "\n\n'Fiz isso por nós', alega [bickering_winner.GetFirstNameNoTooltip], lançando-me um olhar com um toque de arrependimento. 'Para que possamos ficar juntos.'"
 yearly.5001.spouse.epilogue.desc:0 "\n\n'Precisava acontecer', alega [bickering_winner.GetFirstNameNoTooltip], lançando-me um olhar com um toque de arrependimento. 'Você trouxe isso para nós.'"
 yearly.5001.t:0 "Um Encontro Desafortunado"
 yearly.5002.a:0 "Se ao menos [scoped_ruler.GetFirstNameNoTooltip] pudesse me ajudar..."
 yearly.5002.b:0 "Apenas [ROOT.GetCharacter.GetFaith.HighGodName] pode me conceder paz!"
 yearly.5002.c:0 "[bickering_loser.GetSheHe|U] só vai parar de me atormentar quando eu me juntar a [bickering_loser.GetSheHe]."
 yearly.5002.forgiven.desc:0 "\n\nApesar das contínuas garantias de [scoped_ruler.GetFirstNameNoTooltip] de que [scoped_ruler.GetSheHe] não guarda rancor contra mim por minhas ações, sinto a culpa me esmagando."
 yearly.5002.lover.desc:0 "Meses se passaram desde que libertei deste mundo o cruel carcereiro de meu amado para que pudéssemos viver livres da tirania nupcial [bickering_loser.GetHerHim]. E ainda assim, a visagem fantasmagórica de meu rival ainda assombra minhas noites, me atormentando de além-túmulo..."
 yearly.5002.spouse.desc:0 "Meses se passaram desde que entreguei [bickering_loser.GetFirstName] para encontrar o julgamento de [ROOT.Char.GetFaith.HighGodNamePossessive], assim purificando o nome de minha família e corrigindo as propensões adúlteras [Select_CString( scoped_ruler.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('scoped_ruler'))]. E ainda assim, a visagem fantasmagórica de meu rival ainda assombra minhas noites, roubando-me o sono dos justos..."
 yearly.5002.t:0 "Velhos Arrependimentos"
 yearly.5002.unforgiven.desc:0 "\n\nA indiferença gelada de [scoped_ruler.GetFirstNameNoTooltip] em relação ao meu infortúnio só piorou as coisas, enchendo meu coração de remorso pelo meu ato violento."
 yearly.5003.a:0 "Muito bem, [bickering_winner.GetFirstNameNoTooltip]. Eu perdoo você."
 yearly.5003.b.callous:0 "Você poderia parar de desperdiçar meu tempo com suas ilusões?"
 yearly.5003.b.forgiven:0 "Não há mais nada que eu possa fazer por você, receio."
 yearly.5003.b.forgotten:0 "Sinto muito, mas não posso fazer isso."
 yearly.5003.c:0 "Não é mais do que um vil assassino como você merece."
 yearly.5003.forgiven.desc:0 "\n\n[bickering_winner.GetSheHe|U] teme que a terrível lembrança do crime secreto [bickering_winner.GetHerHim] esteja consumindo sua mente e alma."
 yearly.5003.lover.desc:0 "[bickering_winner.GetFirstName] não tem sido o mesmo desde seu último encontro infeliz com [bickering_loser.GetFirstName]. [bickering_winner.GetSheHe|U] afirma ter sido assombrado pelo espírito vingativo de [bickering_loser.GetFirstNameNoTooltip] desde aquele fatídico dia."
 yearly.5003.spouse.desc:0 "[Select_CString( bickering_winner.IsFemale, 'Minha', 'Meu' )] [bickering_winner.GetWifeHusband] [bickering_winner.GetFirstName] não tem sido o mesmo desde seu último encontro infeliz com meu amado. [bickering_winner.GetSheHe|U] afirma ter sido assombrado pelo espírito vingativo de [bickering_loser.GetFirstName] desde aquele fatídico dia."
 yearly.5003.unforgiven.desc:0 "\n\n[bickering_winner.GetSheHe|U] está me implorando que perdoe [bickering_winner.GetSheHe] pelo terrível crime que [bickering_winner.GetSheHe] cometeu em meu nome, certo de que minha absolvição é a única coisa que salvará sua mente e alma."
 yearly.5004.a:0 "A memória [bickering_loser.GetHerHim|U] também desaparecerá em breve..."
 yearly.5004.desc:0 "[scoped_ruler.GetFirstName] finalmente me concedeu seu perdão, e com isso, encontrei paz mais uma vez. O fantasma de [bickering_loser.GetFirstName] foi exorcizado de meus sonhos de uma vez por todas."
 yearly.5005.a:0 "Por que eu já me importei com esse monstro?"
 yearly.5005.desc:0 "Fui tolo em esperar que [scoped_ruler.GetFirstName] me ajudasse. [scoped_ruler.GetSheHe|U] sempre foi um monstro mesquinho e cruel. [scoped_ruler.GetSheHe|U] ignorou meu sofrimento e zombou de minha fraqueza, alegando que mereço tudo o que está acontecendo comigo."
 yearly.5006.b.default:0 "Entendo..."
 yearly.5006.b.forgiven:0 "Vá em paz, então, se é isso que deseja."
 yearly.5006.b.upset:0 "Como você pôde fazer isso comigo?!"
 yearly.5006.epilogue.desc:0 "Incapaz de enfrentar a culpa de suas ações, [bickering_winner.GetSheHe] decidiu renunciar aos assuntos mundanos e dedicar sua vida a [bickering_winner.GetFaith.HighGodName]."
 yearly.5007.a.tt:0 "[bickering_winner.GetFirstName] será mais propens[Select_CString( bickering_winner.IsFemale, 'a', 'o' )] a se juntar aos meus Esquemas de Assassinato."
 yearly.5007.a:0 "Talvez seja hora de reacender as chamas."
 yearly.5007.b:0 "Acho que já fiz o suficiente."
 yearly.5007.desc:0 "Muitas vezes me pego pensando em meu último encontro com [bickering_loser.GetFirstName] nas últimas semanas. Já faz muito tempo desde que a vida pareceu tão significativa quanto quando eu tinha o sangue [bickering_loser.GetHerHim] aquecendo minha pele. \n\n[scoped_ruler.GetFirstName] também parece sentir o mesmo: nunca estivemos tão próximos quanto quando compartilhamos a emoção íntima do assassinato, mas agora estamos nos afastando lentamente..."
 yearly.5007.t:0 "Noites Monótonas"
 yearly.5008.a:0 "Desta vez, eu escolherei a vítima!"
 yearly.5008.b:0 "Não, enjoei desse jogo."
 yearly.5008.desc:0 "Muitas vezes me pego pensando [Select_CString( bickering_loser.IsFemale, 'na minha querida', 'no meu querido' )] [bickering_loser.GetFirstName] nas últimas semanas e na morte prematura [bickering_loser.GetHerHim] pelas mãos de [bickering_winner.GetFirstName]. Nunca me senti tão próximo [Select_CString( bickering_winner.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bickering_winner'))] quanto quando compartilhamos a emoção íntima do assassinato. Ainda mais intrigante, [bickering_winner.GetSheHe] parece tão ansioso quanto eu para reviver aquele momento inesquecível e reacender as chamas de nosso amor."
 yearly.5009.desc:0 "Proposta Rejeitada"
 yearly.5010.a:0 "Só confiarei naqueles que merecem."
 yearly.5010.b:0 "Os três de nós não podem encontrar um terreno comum?"
 yearly.5010.c:0 "Vou prestar atenção ao seu aviso, [bickering_vassal_2.GetFirstNameNoTooltip]."
 yearly.5010.d:0 "Então, defenda a honra do seu [ROOT.Char.GetTitleTierName]!"
 yearly.5010.deceitfail.desc:0 "Não consegui enganar [bickering_vassal_2.GetTitledFirstName] para duelas com [bickering_vassal_1.GetTitledFirstName]."
 yearly.5010.desc:0 "Comovid[Select_CString( bickering_vassal_1.IsFemale, 'a', 'o' )] por minhas tribulações, [bickering_vassal_1.GetTitledFirstName] ofereceu-me seu conselho e ajuda em muitas ocasiões, esperando aliviar o fardo de meus deveres.\n\nNo entanto, a atenção de [bickering_vassal_1.GetFirstNameNoTooltip] atraiu a ira de [bickering_vassal_2.GetTitledFirstName]. '[bickering_vassal_1.GetFirstNameNoTooltip] não pode ser confiado! Isso é apenas um ardil para explorá-lo, meu senhor.'"
 yearly.5010.midwaycritfail.desc:0 "Minha tentativa de fazer [bickering_vassal_1.GetTitledFirstName] e [bickering_vassal_2.GetTitledFirstName] deixarem de lado suas diferenças só resultou em ambos os vassalos ficando zangados comigo também."
 yearly.5010.midwayfail.desc:0 "Não consegui resolver as diferenças entre [bickering_vassal_1.GetTitledFirstName] e [bickering_vassal_2.GetTitledFirstName]."
 yearly.5010.midwaysuccess.desc:0 "Consegui resolver algumas das discordâncias entre [bickering_vassal_1.GetTitledFirstName] e [bickering_vassal_2.GetTitledFirstName]."
 yearly.5010.t:0 "Discórdia Compassiva"
 yearly.5011.a.new:0 "Nunca percebi o quão dedicado você é a mim, [bickering_vassal_winner.GetFirstNameNoTooltip]..."
 yearly.5011.b.new:0 "As ações falam mais alto do que as palavras, parece."
 yearly.5011.b.old:0 "O que eu faria sem você, [bickering_vassal_winner.GetFirstNameNoTooltip]?"
 yearly.5011.c:0 "Por que você teve que me incomodar com todo esse problema, [bickering_vassal_winner.GetFirstNameNoTooltip]?"
 yearly.5011.desc:0 "Não é preciso muito para transformar o desprezo de [bickering_vassal_1.GetFirstNamePossessive] e [bickering_vassal_2.GetFirstNamePossessive] um pelo outro em hostilidade aberta. Palavras sujas são trocadas antes que [bickering_vassal_2.GetFirstNameNoTooltip] finalmente erga seu [bickering_vassal_2.Custom('signature_weapon')] contra [bickering_vassal_1.GetFirstNameNoTooltip], que responde da mesma forma.\n\nApós uma breve troca de golpes violentos, [bickering_vassal_winner.GetTitledFirstNameNoTooltip] emerge vitorioso, enquanto seu oponente fica sangrando no chão."
 yearly.5020.a.e.tt:0 "[helpful_councillor.GetFirstNameNoTooltip] ensinará a [scoped_heir.GetFirstNameNoTooltip] sobre suas responsabilidades como [helpful_councillor.GetCouncilTitle]"
 yearly.5020.a:0 "Contanto que você saiba o que está fazendo..."
 yearly.5020.b.a:0 "O futuro de [scoped_heir.GetFirstNamePossessiveNoTooltip] não diz respeito a você."
 yearly.5020.b.b:0 "Prefiro ensinar [scoped_heir.GetSheHe] eu mesmo!"
 yearly.5020.c:0 "Veremos se você está falando a verdade primeiro!"
 yearly.5020.chancellor.desc:0 "sobre política, etiqueta e diplomacia."
 yearly.5020.councillor.diplomacy.tt:0 "[helpful_councillor.GetFirstName] melhorará a [diplomacy|E] de [scoped_heir.GetFirstNamePossessive]"
 yearly.5020.councillor.intrigue.tt:0 "[helpful_councillor.GetFirstName] melhorará a [intrigue|E] de [scoped_heir.GetFirstNamePossessive]"
 yearly.5020.councillor.learning.tt:0 "[helpful_councillor.GetFirstName] melhorará o [learning|E] de [scoped_heir.GetFirstNamePossessive]"
 yearly.5020.councillor.martial.tt:0 "[helpful_councillor.GetFirstName] melhorará o [martial|E] de [scoped_heir.GetFirstNamePossessive]"
 yearly.5020.councillor.stewardship.tt:0 "[helpful_councillor.GetFirstName] melhorará a [stewardship|E] de [scoped_heir.GetFirstNamePossessive]"
 yearly.5020.court_chaplain.desc:0 "sobre a história de nosso reino e as tradições de nosso povo."
 yearly.5020.intro.desc:0 "S[Select_CString( scoped_heir.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_heir'))] [scoped_heir.GetFirstName] tem mostrado grande interesse pelo meu trabalho como seu [helpful_councillor.Custom('CouncilPosition')], ultimamente. Se você gentilmente permitisse que eu passasse algum tempo com"
 yearly.5020.kurultai.desc:0 "sobre a arquearia montada e os modos de pastoreio das estepes."
 yearly.5020.marshal.desc:0 "sobre o treinamento de tropas, planejamento de cercos e outros assuntos relacionados à guerra."
 yearly.5020.older.desc:0 "[Select_CString( scoped_heir.IsFemale, 'a', 'o' )] [scoped_heir.GetWomanMan] jovem, [scoped_heir.GetSheHe] certamente aprenderá muitas coisas"
 yearly.5020.opening:0 "[helpful_councillor.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.5020.ruler.diplomacy.tt:0 "Você tenta melhorar a [diplomacy|E] de [scoped_heir.GetFirstNamePossessive]"
 yearly.5020.ruler.intrigue.tt:0 "Você tenta melhorar a [intrigue|E] de [scoped_heir.GetFirstNamePossessive]"
 yearly.5020.ruler.learning.tt:0 "Você tenta melhorar o [learning|E] de [scoped_heir.GetFirstNamePossessive]"
 yearly.5020.ruler.martial.tt:0 "Você tenta melhorar o [martial|E] de [scoped_heir.GetFirstNamePossessive]"
 yearly.5020.ruler.stewardship.tt:0 "Você tenta melhorar a [stewardship|E] de [scoped_heir.GetFirstNamePossessive]"
 yearly.5020.spymaster.desc:0 "sobre ser discreto e adquirir informações obscuras."
 yearly.5020.steward.desc:0 "sobre fazer cálculos e administrar terras e riquezas."
 yearly.5020.t:0 "Sobre a Tutela"
 yearly.5020.younger.desc:0 "[scoped_heir.GetSheHe] certamente aprenderá muitas coisas"
 yearly.5021.a:0 "Não há mal em permitir que [helpful_councillor.GetSheHe] oriente [scoped_heir.GetFirstNameNoTooltip]!"
 yearly.5021.b.a:0 "Não posso deixar [helpful_councillor.GetSheHe] perto de [scoped_heir.GetFirstNameNoTooltip] por mais tempo."
 yearly.5021.b.b:0 "Mas ainda não confio n[helpful_councillor.GetSheHe]!"
 yearly.5021.c:0 "Quero [helpful_councillor.GetSheHe] fora do Conselho!"
 yearly.5021.deceitfulcouncillor.desc:0 "Eu estava cert[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] em suspeitar das intenções de [helpful_councillor.GetFirstNamePossessive]. Após ter [helpful_councillor.GetSheHe] sob vigilância por alguns dias, está abundante claro que [helpful_councillor.GetSheHe] está interessad[Select_CString( helpful_councillor.IsFemale, 'a', 'o' )] apenas em instigar m[Select_CString( scoped_heir.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_heir'))] contra mim."
 yearly.5021.honestcouncillor.desc:0 "Apesar de uma rigorosa investigação, [helpful_councillor.GetFirstName], [Select_CString( helpful_councillor.IsFemale, 'minha espiã', 'meu espião' )] não conseguiu encontrar nada que pudesse me persuadir a acreditar que suas intenções são nada além de puras.\n\n[helpful_councillor.GetSheHe|U] realmente parece interessad[Select_CString( helpful_councillor.IsFemale, 'a', 'o' )] apenas em ajudar m[Select_CString( scoped_heir.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_heir'))] a se tornar um[Select_CString( scoped_heir.IsFemale, 'a', '' )] governante melhor."
 yearly.5022.a:0 "Não há mal em deixar [helpful_councillor.GetSheHe] continuar então!"
 yearly.5023.a:0 "Como eu deveria supor que [helpful_councillor.GetSheHe] era genuín[Select_CString( helpful_councillor.IsFemale, 'a', 'o' )]?"
 yearly.5023.desc:0 "Aquele espião inútil que designei para vigiar meu [helpful_councillor.Custom('CouncilPosition')] [helpful_councillor.GetTitledFirstName] foi pego! [helpful_councillor.GetFirstNameNoTooltip] ficou furios[Select_CString( helpful_councillor.IsFemale, 'a', 'o' )] ao saber da minha falta de confiança e retirou sua oferta de tutoria."
 yearly.5024.a.a:0 "Maravilhoso! Eu sabia que poderia confiar n[helpful_councillor.GetSheHe]!"
 yearly.5024.a.b:0 "Como [helpful_councillor.GetSheHe] pôde fazer isso comigo?!"
 yearly.5024.a.c:0 "Isso não pode ser!"
 yearly.5024.b:0 "Eu não posso acreditar nisso. Você está por trás de tudo isso!"
 yearly.5024.deadlycouncillor.desc:0 "Meu [helpful_councillor.Custom('CouncilPosition')] [helpful_councillor.GetFirstName] irrompe na sala principal, com uma expressão mortificada no rosto e as roupas pingando de sangue. \n\n\"Ladrões, meu [ROOT.Char.GetTitleTierName]!\" [helpful_councillor.GetSheHe] exclama, quase sem fôlego. [helpful_councillor.GetFirstNameNoTooltip] havia saído do [ROOT.Char.Custom('ResidenceBuilding')] com [scoped_heir.GetFirstName] nesta manhã para inspecionar o campo.\"Carreguei o corpo do [scoped_heir.GetTitleTierNamePossessive] o quanto pude, mas..."
 yearly.5024.deceitfulcouncillor.desc:0 "Algo não está certo. Eu permiti que meu [helpful_councillor.Custom('CouncilPosition')] [helpful_councillor.GetFirstName] ajudasse a orientar m[Select_CString( scoped_heir.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_heir'))] para que [scoped_heir.GetFirstName] aprendesse algo sobre governar. No entanto, parece que [helpful_councillor.GetSheHe] está mais interessad[Select_CString( helpful_councillor.IsFemale, 'a', 'o' )] em ensinar [scoped_heir.GetSheHe] como questionar e desaprovar todas as minhas decisões."
 yearly.5024.honestcouncillor.desc:0 "tutoria do [helpful_councillor.GetCouncilTitle] [helpful_councillor.GetFirstNamePossessive] sobre m[Select_CString( scoped_heir.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_heir'))] já está dando frutos. \n\n[scoped_heir.GetFirstName] aprendeu muito mais do que eu ousei esperar, e [scoped_heir.GetSheHe] está levando algumas de suas responsabilidades futuras muito mais a sério do que antes."
 yearly.5025.a:0 "Estou orgulhos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] das realizações [scoped_heir.GetHerHim]."
 yearly.5025.b:0 "[Select_CString( scoped_heir.IsFemale, 'A', 'O' )] [scoped_heir.Custom('GirlBoy')] é apenas um pouco lent[Select_CString( scoped_heir.IsFemale, 'a', 'o' )]."
 yearly.5025.desc.a:0 "Graças à minha recente tutoria, [scoped_heir.GetFirstName] foi capaz de preencher algumas lacunas em sua educação.\n\nO pedido de [helpful_councillor.GetTitledFirstNamePossessive] foi exatamente a motivação de que eu precisava para ajudar m[Select_CString( scoped_heir.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_heir'))] a desbloquear parte de seu potencial ainda não explorado."
 yearly.5025.desc.b:0 "Infelizmente, minhas tentativas recentes de orientar [scoped_heir.GetFirstName] para preencher algumas lacunas em sua educação foram infrutíferas.\n\nTalvez eu não devesse ter rejeitado a oferta de [helpful_councillor.GetTitledFirstNamePossessive]..."
 yearly.5030.a.a:0 "Sua preocupação é profundamente apreciada, [squealing_vassal.GetFirstNameNoTooltip]."
 yearly.5030.a.b:0 "Eu não vou esquecer seu gesto, [squealing_vassal.GetFirstNameNoTooltip]."
 yearly.5030.a.tt:0 "[squealing_vassal.GetTitledFirstName] revelará o segredo de [blackmailed_vassal.GetTitledFirstNamePossessive] para mim."
 yearly.5030.c.tt:0 "Não vou usar o segredo de [blackmailed_vassal.GetFirstNamePossessive] contra [blackmailed_vassal.GetSheHe]"
 yearly.5030.c:0 "Você melhor esquecer tudo isso, [squealing_vassal.GetFirstNameNoTooltip]."
 yearly.5030.earnestvassal.desc:0 "Descobri uma verdade chocante sobre [blackmailed_vassal.GetTitledFirstName], apesar de detestar trazer esse assunto à sua atenção. Devo informar que este [blackmailed_vassal.GetWomanMan] está guardando segredos alarmantes de você."
 yearly.5030.opening:0 "[squealing_vassal.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.5030.secret.desc:0 "Informado sobre o Segredo"
 yearly.5030.selfishvassal.desc:0 "Escrevo para informar sobre uma descoberta chocante que fiz sobre [blackmailed_vassal.GetTitledFirstName]. Est[Select_CString( blackmailed_vassal.IsFemale, 'a', 'e' )] [blackmailed_vassal.GetWomanMan] está envolvido em atividades desonrosas e indignas às suas costas.\n\nEspero sinceramente que trazer essa informação sensível à sua atenção demonstre minha lealdade inabalável a você, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleTierName]."
 yearly.5040.a.a:0 "Eu os farei amarrar e entregarei [Select_CString( scoped_vassal.IsFemale, 'a', 'ao' )] [scoped_vassal.GetFirstNameNoTooltip]."
 yearly.5040.a.b:0 "Devo avisar [scoped_vassal.GetFirstNameNoTooltip]!"
 yearly.5040.b.failure.desc.tt:0 "[whisperer_1.GetFirstNameNoTooltip] e [whisperer_2.GetFirstNameNoTooltip] me veem"
 yearly.5040.b.failure.effect.tt:0 "O interrogatório não produz resultados"
 yearly.5040.b.success.desc.tt:0 "Evito ser detectado"
 yearly.5040.b.success.effect.tt:0 "Descubro o assunto da conversa"
 yearly.5040.b:0 "Se ao menos eu pudesse me aproximar um pouco mais..."
 yearly.5040.c.a:0 "Você não esconderia algo do seu amado [ROOT.Char.GetTitleTierName], certo?"
 yearly.5040.c.b:0 "Eu preciso saber o que eles estão escondendo, a qualquer custo!"
 yearly.5040.c.failure.tt:0 "[whisperer_1.GetFirstName] e [whisperer_2.GetFirstNameNoTooltip] são incooperativos"
 yearly.5040.c.success.tt:0 "Eu torturo a informação de [whisperer_1.GetFirstNameNoTooltip] e [whisperer_2.GetFirstNameNoTooltip]"
 yearly.5040.d:0 "Ah, tenho certeza de que isso provavelmente não é nada importante..."
 yearly.5040.deceitfail.desc:0 "[whisperer_1.GetFirstName] e [whisperer_2.GetFirstNameNoTooltip] me veem e correm de volta para o [ROOT.Char.Custom('ResidenceBuilding')]"
 yearly.5040.desc:0 "Estou passando pelos jardins do [ROOT.Char.Custom('ResidenceBuilding')] para uma caminhada matinal quando uma brisa suave traz as vozes de [whisperer_1.GetFirstName] e [whisperer_2.GetFirstName] até o meu ouvido. \n\nOs dois cortesãos estão conversando entre si em um local isolado nas proximidades, olhando frequentemente ao redor para garantir que ninguém esteja ouvindo. Embora seja difícil para mim ouvir a maioria das palavras a essa distância, fica claro que a conversa deles está relacionada [Select_CString( scoped_vassal.IsFemale, 'a', 'ao' )] [scoped_vassal.GetTitledFirstName]."
 yearly.5040.t:0 "Uma Conversa Suspeita"
 yearly.5040.torturefail.desc:0 "Infelizmente, o interrogatório não produziu resultados"
 yearly.5041.a:0 "Interessante..."
 yearly.5041.desc.a:0 "Consigo me aproximar mais dos dois cortesãos sem que eles me notem.\n\nEles estão discutindo um plano orquestrado [Select_CString( scoped_vassal.IsFemale, 'pela', 'pelo' )] [scoped_vassal.GetTitledFirstName] contra mim!"
 yearly.5041.desc.b:0 "Consigo me aproximar mais dos dois cortesãos sem que eles me notem.\n\nEles estão discutindo um plano orquestrado [Select_CString( scoped_vassal.IsFemale, 'pela', 'pelo' )] [scoped_vassal.GetTitledFirstName] em minha própria Corte!"
 yearly.5041.desc.c:0 "Consigo me aproximar mais dos dois cortesãos sem que eles me notem.\n\nParece que eles estão discutindo a vida privada de [scoped_vassal.GetTitledFirstName] e algum hábito desagradável [scoped_vassal.GetHerHim]."
 yearly.5042.a.a:0 "Que descoberta afortunada e emocionante!"
 yearly.5042.a.b:0 "Um preço severo por informações vitais."
 yearly.5042.desc.a:0 "\n\nParece que [scoped_vassal.GetTitledFirstName] está conspirando contra mim!"
 yearly.5042.desc.b:0 "\n\nParece que [scoped_vassal.GetTitledFirstName] está conspirando em minha própria Corte!"
 yearly.5042.desc.c:0 "\n\nO assunto da discussão deles era um hábito desagradável de [scoped_vassal.GetTitledFirstName] do qual eu estava completamente alheio."
 yearly.5042.desc.deadlytorture:0 "Os lábios dos prisioneiros estão mais selados do que eu esperava. Após uma longa noite de interrogatório, a frustração do carcereiro supera [dummy_jailor_gender.GetSheHe], e os dois cortesãos estão mortos pela manhã, mas não antes de revelarem seu segredo."
 yearly.5042.desc.safetorture:0 "Leva um tempo para soltar as línguas dos dois prisioneiros, mas [Select_CString( dummy_jailor_gender.IsFemale, 'minha carcereira é uma', 'meu carcereiro é um' )] [dummy_jailor_gender.GetWomanMan] paciente. Após várias horas de interrogatório, os dois conspiradores estão prontos para confessar seu segredo."
 yearly.5043.a.a:0 "Que desperdício de tempo isso foi..."
 yearly.5043.a.b:0 "Por que eles não falaram?"
 yearly.5043.torturedeadlyfail.desc:0 "Meu interrogatório provou ser demais para os dois prisioneiros. \n\nEles expiraram antes de me contar seu segredo."
 yearly.5050.a.a:0 "[slighting_courtier.GetSheHe|U] estará fora até amanhã!"
 yearly.5050.b.a:0 "Não me incomode com tais bobagens."
 yearly.5050.b.b:0 "Impossível! [slighting_courtier.GetFirstNameNoTooltip] é um[Select_CString( slighting_courtier.IsFemale, 'a', '' )] [slighting_courtier.GetWomanMan] tão simpátic[Select_CString( slighting_courtier.IsFemale, 'a', 'o' )]!"
 yearly.5050.b.c:0 "Acho que você pode estar reagindo um pouco exageradamente, querido."
 yearly.5050.c.failure.desc.tt:0 "[scoped_spouse.GetFirstNameNoTooltip] se recusa a ouvir razões"
 yearly.5050.c.failure.effect.tt:0 "[Select_CString( scoped_spouse.IsFemale, 'Minha', 'Meu' )] [scoped_spouse.GetWifeHusband] exige que eu tome medidas"
 yearly.5050.c.success.desc.tt:0 "Discuto os detalhes do incidente com [scoped_spouse.GetFirstNameNoTooltip]"
 yearly.5050.c.success.effect.tt:0 "Descubro se [scoped_spouse.GetFirstNameNoTooltip] está sendo sincero ou não"
 yearly.5050.c:0 "Por que você não me contou tudo desde o início?"
 yearly.5050.desc.a:0 "\"Absolutamente inaceitável!\" \n\n[scoped_spouse.GetFirstName] irrompe em meus aposentos, seu rosto vermelho de raiva, gritando alto o suficiente para que todo o [ROOT.Char.Custom('ResidenceBuilding')] possa ouvir [scoped_spouse.GetSheHe]. \n\n\"[slighting_courtier.GetTitledFirstName] acabou de insultar minha honra! Exijo que você expulse aquel[Select_CString( slighting_courtier.IsFemale, 'a', 'e' )] [slighting_courtier.Custom2('InsultNoun', SCOPE.sC('scoped_spouse'))] [slighting_courtier.Custom2('InsultAdjective', SCOPE.sC('scoped_spouse'))] de nossa corte!\""
 yearly.5050.desc.b:0 "Fico surpreso ao encontrar [Select_CString( scoped_spouse.IsFemale, 'minha', 'meu' )] [scoped_spouse.GetWifeHusband] escondida em meu estudo. Pelo semblante [scoped_spouse.GetHerHim], algo está claramente perturbando [scoped_spouse.GetFirstName], mas leva um tempo para convencer [scoped_spouse.GetSheHe] a compartilhar suas preocupações comigo. \n\n\"Minha amada, devo confessar a você que [slighting_courtier.GetFirstName] me insultou gravemente. Não suporto a ideia de estar perto dess[Select_CString( slighting_courtier.IsFemale, 'a', 'e' )] [slighting_courtier.GetWomanMan] grosseir[Select_CString( slighting_courtier.IsFemale, 'a', 'o' )] por mais tempo.\""
 yearly.5050.t:0 "Recriminações Matrimoniais"
 yearly.5051.a:0 "Espero que você peça desculpas [Select_CString( slighting_courtier.IsFemale, 'a', 'ao' )] [slighting_courtier.GetFirstNameNoTooltip] por essa acusação infundada."
 yearly.5051.b:0 "Não se preocupe, sempre estarei ao seu lado."
 yearly.5051.c:0 "Agora que tenho certeza, posso confrontar [slighting_courtier.GetFirstNameNoTooltip]."
 yearly.5051.d:0 "Acho que você deveria tentar perdoar [slighting_courtier.GetFirstNameNoTooltip]."
 yearly.5051.desc.a.a:0 "Quanto mais ouço essa história, mais estou convencido de que [Select_CString( scoped_spouse.IsFemale, 'minha', 'meu' )] [scoped_spouse.GetWifeHusband] não está me dizendo a verdade. No final de nossa discussão, fico com a forte impressão de que [scoped_spouse.GetFirstName] inventou tudo para difamar [slighting_courtier.GetTitledFirstName]."
 yearly.5051.desc.a.b:0 "Após examinar cuidadosamente a alegação de [Select_CString( scoped_spouse.IsFemale, 'minha', 'meu' )] [scoped_spouse.GetWifeHusband], cheguei à conclusão de que [scoped_spouse.GetFirstName] está me dizendo a verdade.\n\n[slighting_courtier.GetTitledFirstName] insultou gravemente a honra [scoped_spouse.GetHerHim], e, ao fazê-lo, [slighting_courtier.GetSheHe] cuspiu na minha hospitalidade."
 yearly.5051.z:0 "Se o mundo soubesse de sua acusação falsa..."
 yearly.5052.a:0 "Vou conversar com [slighting_courtier.GetTitledFirstNameNoTooltip]."
 yearly.5052.b:0 "Acho que você deveria esquecer todo esse assunto, [scoped_spouse.GetFirstNameNoTooltip]."
 yearly.5052.desc.a:0 "Mesmo depois de discutir os detalhes do incidente com [scoped_spouse.GetFirstName], ainda estou incerto sobre o que pensar de toda a situação."
 yearly.5052.desc.b.a:0 "\n\nUm bom [ROOT.Char.GetTitleTierName] deve apoiar s[Select_CString( scoped_spouse.IsFemale, 'ua', 'eu' )] [scoped_spouse.GetTitleTierName], mas não consigo me livrar da sensação de que [scoped_spouse.GetFirstNameNoTooltip] pode não estar me contando a história completa..."
 yearly.5052.desc.b.b:0 "\n\nPor outro lado, um bom [ROOT.Char.GetTitleTierName] deve apoiar s[Select_CString( scoped_spouse.IsFemale, 'ua', 'eu' )] [scoped_spouse.GetTitleTierName], e [scoped_spouse.GetFirstName] parece genuinamente devastado pelo evento."
 yearly.5053.a:0 "Chega. Farei um exemplo deste."
 yearly.5053.b:0 "Não se preocupe, lidarei com [slighting_courtier.GetTitledFirstNameNoTooltip]."
 yearly.5053.c:0 "Chega dessas trivialidades, [scoped_spouse.GetFirstNameNoTooltip]."
 yearly.5053.desc.a:0 "[Select_CString( scoped_spouse.IsFemale, 'Minha', 'Meu' )] [scoped_spouse.GetWifeHusband] está reclamando mais uma vez sobre alguém desrespeitar [scoped_spouse.GetSheHe]. Desta vez, parece que é [slighting_courtier.GetTitledFirstName] quem causou a ira [scoped_spouse.GetHerHim]. [scoped_spouse.GetSheHe|U] agora está pedindo que eu faça algo a respeito."
 yearly.5053.desc.b.a:0 "\n\nNão consigo entender por que tantas pessoas estão incomodando [scoped_spouse.GetSheHe]..."
 yearly.5053.desc.b.b:0 "\n\n[Select_CString( ROOT.Char.IsFemale, 'Uma', 'Um' )] [ROOT.Char.GetWifeHusband] poderia começar a suspeitar que [scoped_spouse.GetSheHe] está se aproveitando da minha boa vontade para se livrar de qualquer um que [scoped_spouse.GetSheHe] não goste..."
 yearly.5053.desc.b:0 "Não estou nada surpreso quando [Select_CString( scoped_spouse.IsFemale, 'minha', 'meu' )] [scoped_spouse.GetWifeHusband] me pede para disciplinar mais um membro da corte que, segundo [scoped_spouse.GetSheHe], manchou a honra [scoped_spouse.GetHerHim]. Tornou-se uma ocorrência tão frequente que mal presto atenção à lista de queixas que [scoped_spouse.GetFirstName] lista contra [slighting_courtier.GetTitledFirstName]."
 yearly.5054.a.a:0 "Acredito que um agradecimento seja adequado, querida."
 yearly.5054.a.b:0 "Finalmente, paz."
 yearly.5054.desc.a:0 "Desde que executei [slighting_courtier.GetTitledFirstName] de forma horrível, [Select_CString( scoped_spouse.IsFemale, 'minha', 'meu' )] [scoped_spouse.GetWifeHusband] tem agido de maneira estranha. Não há mais cortesãos incomodando [scoped_spouse.GetSheHe], como eu previ, ou sequer se aproximando [scoped_spouse.GetHerHim] sem serem solicitados, mas [scoped_spouse.GetSheHe] ainda não parece satisfeito.\n\nNa verdade, [scoped_spouse.GetSheHe] parece muito mais sombrio do que antes."
 yearly.5054.desc.b:0 "Exatamente como eu esperava, executar [slighting_courtier.GetTitledFirstName] da maneira mais dolorosa e pública por insultar [Select_CString( scoped_spouse.IsFemale, 'minha', 'meu' )] [scoped_spouse.GetWifeHusband] foi precisamente a mensagem que eu precisava enviar à corte.\n\nNinguém ousa falar de volta ou mesmo se aproximar de [scoped_spouse.GetFirstName] sem a permissão [scoped_spouse.GetHerHim]. Não precisarei mais me preocupar com as incessantes reclamações [scoped_spouse.GetHerHim]."
 yearly.8000.a:0 "Por favor, entre! Deixe o ouro à sua esquerda..."
 yearly.8000.b:0 "Por que... #emphasis com certeza#! você tem mais a oferecer?"
 yearly.8000.c:0 "Fique com o ouro, sua amizade é suficiente!"
 yearly.8000.d:0 "Não #emphasis deixe#! [vassal.GetSheHe] entrar no [ROOT.Char.Custom('ResidenceBuilding')]!"
 yearly.8000.desc.cannibal:0 "\n\nTamanha generosidade deliciosa é difícil de encontrar em um súdito tenro. A lealdade suculenta de [vassal.GetFirstNamePossessiveNoTooltip] é realmente algo para ser apreciado!"
 yearly.8000.desc.default:0 "\n\nTamanha generosidade é difícil de encontrar em um súdito. A lealdade de [vassal.GetFirstNamePossessiveNoTooltip] é realmente algo para ser valorizado!"
 yearly.8000.desc.lunatic:0 "\n\nO #emphasis Homem na Lua#! deve ter ouvido minhas súplicas da meia-noite por um novo companheiro de brincadeiras!"
 yearly.8000.desc.paranoid:0 "\n\n... [vassal.GetSheHe] está obviamente aqui para #emphasis me matar!#!"
 yearly.8000.desc:0 "[Select_CString( vassal.IsFemale, 'Minha vassala', 'Meu vassalo' )], [vassal.GetTitledFirstName], chegou do lado de fora do meu [ROOT.Char.Custom('ResidenceBuilding')] com uma grande comitiva de diplomatas bem-vestidos, $knight_culture_player_plural_no_tooltip_lowercase$, e artistas exóticos. A comitiva se assemelha a um desfile, liderado [Select_CString( vassal.IsFemale, 'pela própria', 'pelo próprio' )] [vassal.GetFirstNameNoTooltip].\n\nEm uma voz retumbante, [vassal.GetFirstNameNoTooltip] anuncia que [vassal.GetSheHe] está aqui para prestar homenagem e que [vassal.GetSheHe] traz presentes de #emphasis ouro!#!"
 yearly.8000.e.tt_eat_vassal:0 "É comido por você"
 yearly.8000.e.tt_secret:0 "Você recebe um segredo de assassinato"
 yearly.8000.e:0 "Que tal... ficar para o jantar?"
 yearly.8000.t:0 "Prestando Homenagem"
 yearly.8100.a:0 "Eu aceito graciosamente os presentes deles!"
 yearly.8100.b:0 "Intrigante... envie soldados para coletar mais 'presentes!'"
 yearly.8100.c:0 "Não, eles precisam mais do excedente do que eu."
 yearly.8100.desc:0 "Os camponeses de [county.GetName] estão de bom humor. A colheita é farta, as estradas estão seguras, e os anciãos da aldeia estão contando histórias sem sentido de vacas produzindo leite carregado de mel e gansos botando ovos de ouro.\n\nOs camponeses estão elogiando #emphasis a mim#! pela sua sorte e enviaram uma delegação trazendo presentes!"
 yearly.8100.t:0 "Camponeses Extasiados"
 yearly.8200.a:0 "Dar #emphasis [ROOT.Char.GetFaith.HighGodNamePossessive]#! riqueza? #emphasis Herege!#!"
 yearly.8200.b:0 "Eu prometo, o ouro servirá ao reino."
 yearly.8200.c:0 "Este 'modelo' merece a doação inteira!"
 yearly.8200.d:0 "Por favor, dê aos pobres em meu nome."
 yearly.8200.desc.default:0 "\n\nUma oferta tentadora, de fato."
 yearly.8200.desc.generous:0 "\n\nMeu coração bate por todas as almas que eu poderia salvar com esse ouro!"
 yearly.8200.desc.greedy:0 "\n\n... Naturalmente, planejo embolsar o dinheiro para mim mesmo!"
 yearly.8200.desc.zealous:0 "\n\n... [realm_priest.GetSheHe] certamente está corrompido por [ROOT.Char.GetFaith.DevilName]!"
 yearly.8200.desc:0 "Meu [realm_priest.GetCouncilTitle], [realm_priest.GetFirstName], recebeu uma significativa doação de ouro do espólio de um latifundiário rico mas sem filhos, agora falecido. [realm_priest.GetSheHe|U] afirma que o falecido levou uma vida muito frugal e piedosa e desejava que o ouro fosse para onde pudesse fazer o bem.\n\n[realm_priest.GetCouncilTitle] [realm_priest.GetFirstName] insiste que eu receba parte da doação, pois sou \"um modelo do [ROOT.Char.GetFaith.GetNameNoTooltip] no [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 yearly.8200.t:0 "Uma Doação de Boa Fé"
 yearly.8300.a:0 "Dou as boas-vindas à sua generosidade!"
 yearly.8300.b:0 "#emphasis Ouro#!, você diz? Guardas, #emphasis apreendam tudo isso.#!"
 yearly.8300.c:0 "Você é muito generoso, não posso aceitar."
 yearly.8300.d:0 "Ouro? Eu preferiria #emphasis confiscar suas calças!#!"
 yearly.8300.desc:0 "Enquanto olho com medo para meus cofres quase vazios, meu arauto anuncia que quatro de meus vassalos chegaram.\n\n\"Viemos trazendo ouro, meu senhor, uma doação para derrotar nossos inimigos!\" anuncia [vassal_1.GetTitledFirstName].\n\n\"Comigo, trago [Select_CString( vassal_2.IsFemale, 'a', 'o' )] [vassal_2.Custom('FormalComplimentAdjective')] [vassal_2.GetTitledFirstName], [Select_CString( vassal_3.IsFemale, 'a', 'o' )] [vassal_3.Custom('FormalComplimentAdjective')] [vassal_3.GetTitledFirstName] e [Select_CString( vassal_4.IsFemale, 'a', 'o' )] [vassal_4.Custom('FormalComplimentAdjective')] [vassal_4.GetTitledFirstName] — pedimos apenas que você nos conduza à vitória!\""
 yearly.8300.t:0 "Uma Contribuição para o Cofre de Guerra"
 yearly.8400.a.tt:0 "Eu envio [deviant_guest.GetTitledFirstName] para a Corte de [appropriate_court_target_owner.GetTitledFirstName], onde [deviant_guest.GetSheHe] se tornará um ótimo agente..."
 yearly.8400.a:0 "O quê... Mas... #emphasis saia do meu [ROOT.Char.Custom('GetRealmOrDomicile')]!#!"
 yearly.8400.b:0 "Como você pôde!? Para a masmorra com você!"
 yearly.8400.c:0 "Isso não acontecerá novamente. Entendeu?"
 yearly.8400.d:0 "Eu nunca percebi que você poderia fazer #emphasis isso#!. Tentador..."
 yearly.8400.desc:0 "Ao me retirar para meus aposentos à noite, me deparo com [Select_CString( deviant_guest.IsFemale, 'uma das minhas convidadas', 'um dos meus convidados' )], [deviant_guest.GetTitledFirstName], em meu santuário mais íntimo — como [deviant_guest.GetSheHe] chegou aqui!?!\n\n\"Não é o que parece, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" alega [deviant_guest.GetSheHe].\n\nO fato de [deviant_guest.GetSheHe] estar meio nu e em processo de profanação corporal do meu #emphasis [ROOT.Char.Custom('RandomPrivateObject')]#!, me diz que é, na verdade, exatamente o que parece."
 yearly.8400.special:0 "Escute, eu sei #emphasis exatamente#! para onde você deveria ir."
 yearly.8400.t:0 "Um Deviante à Solta"
 yearly.8500.a:0 "Estou de joelhos, louvando [current_head_of_faith.GetFaith.HighGodName]!"
 yearly.8500.b:0 "Não posso aceitar este presente, é demais."
 yearly.8500.desc.a:0 "A situação em que você se encontra é lamentável. Ainda assim, ofereço-lhe este presente, para que você possa triunfar neste momento perigoso.\n\nRezo para que [current_head_of_faith.GetFaith.HighGodName] esteja ao seu lado."
 yearly.8500.desc.b:0 "Sua luta justa contra os descrentes não passou despercebida. Eu pessoalmente enviei um emissário carregando moedas suficientes para te sustentar neste momento tumultuado.\n\nQue [current_head_of_faith.GetFaith.HighGodName] o proteja."
 yearly.8500.opening:0 "[current_head_of_faith.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.9020.a:0 "Montarei esta fera poderosa na batalha. Pessoalmente."
 yearly.9020.b:0 "[marshal.GetCouncilTitle]. A criatura é sua."
 yearly.9020.c:0 "Meu $knight_culture_player_no_tooltip_lowercase$ [knight.GetTitledFirstNameNoTooltip] certamente fará bom uso dela."
 yearly.9020.d1:0 "Vamos honrar [ROOT.Char.GetFaith.KnowledgeGodName] e libertá-lo."
 yearly.9020.d2:0 "Um animal como esse deve ser livre. Liberte-o."
 yearly.9020.desc:0 "[marshal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim com um sorriso no rosto. [marshal.GetSheHe|U] explica que recebi um presente verdadeiramente impressionante de um supervisor em [county.GetNameNoTooltip] e me convida a acompanhar [marshal.GetSheHe].\n\nE é realmente impressionante! Ao sair, sou recebido por um elefante gigantesco. Maior do que qualquer um que já vi. A fera certamente trará devastação a qualquer inimigo."
 yearly.9020.t:0 "Um Elefante Poderoso"
 yearly_9020_personal_war_elephant:0 "Elefante de Guerra Pessoal"
