l_spanish:
 ecstatic_converts_saharan_modifier:0 "Convertidos Eufóricos"
 ecstatic_converts_saharan_modifier_desc:0 "As massas jubilantes deste condado estão felizes com sua salvação."
 enthusiastic_nomad_settlement_saharan_modifier:0 "Assentamento de Nômades Enthusiásticos"
 enthusiastic_nomad_settlement_saharan_modifier_desc:0 "Tribos do deserto estão se dirigindo em massa para este condado."
 foreign_trader_enclaves_saharan_modifier:0 "Enclaves de Comerciantes Pagãos"
 foreign_trader_enclaves_saharan_modifier_desc:0 "Comerciantes pagãos estabeleceram residência aqui."
 foreign_traders_unable_to_root_saharan_modifier:0 "Comerciantes Pagãos Transitórios"
 foreign_traders_unable_to_root_saharan_modifier_desc:0 "Comerciantes pagãos são proibidos de possuir propriedades ou permanecer por muito tempo aqui."
 integrated_foreign_trader_enclaves_saharan_modifier:0 "Comerciantes Pagãos Integrados"
 integrated_foreign_trader_enclaves_saharan_modifier_desc:0 "Comerciantes pagãos se tornaram parte integrante da sociedade local aqui."
 local_recession_epicentre_saharan_modifier:0 "Recessão Local"
 local_recession_epicentre_saharan_modifier_desc:0 "A expulsão de comerciantes pagãos prejudicou a economia local."
 local_recession_ripple_saharan_modifier:0 "Repercussão da Recessão Local"
 local_recession_ripple_saharan_modifier_desc:0 "A abolição de uma rota comercial próxima prejudicou a economia deste condado."
 lord_complicit_with_slavers_modifier:0 "Senhor Feudal Cúmplice com Saqueadores de Escravos"
 lord_complicit_with_slavers_modifier_desc:0 "O ganancioso senhor feudal deste condado vendeu os locais para saqueadores de escravos marauding."
 lord_defeated_slavers_modifier:0 "Senhor Feudal Derrotou Saqueadores de Escravos"
 lord_defeated_slavers_modifier_desc:0 "O senhor feudal heroico deste condado derrotou grupos de saqueadores de escravos!"
 nomad_settlement_saharan_modifier:0 "Assentamento de Nômades"
 nomad_settlement_saharan_modifier_desc:0 "Tribos do deserto estão se dirigindo para se estabelecer neste condado."
 overtaxed_merchant_enclaves_saharan_modifier:0 "Comerciantes Pagãos Supertributados"
 overtaxed_merchant_enclaves_saharan_modifier_desc:0 "Comerciantes pagãos são taxados impiedosamente neste condado, perturbando seus parceiros."
 persecuted_converts_saharan_modifier:0 "Convertidos Perseguidos"
 persecuted_converts_saharan_modifier_desc:0 "As massas rebeldes deste condado tramam para escapar de seus senhores cruéis."
 respects_local_traditions_saharan_modifier:0 "Respeita as Tradições Locais"
 respects_local_traditions_saharan_modifier_desc:0 "Este personagem é conhecido por valorizar as tradições de seus ancestrais acima do ouro estrangeiro."
 upset_local_nomads_saharan_modifier:0 "Nômades Locais Contrariados"
 upset_local_nomads_saharan_modifier_desc:0 "Tribos locais do deserto estão saqueando caminhos e causando grandes problemas."
 utterly_unphased_modifier:0 "Totalmente Imperturbável"
 utterly_unphased_modifier_desc:0 "Não importa o quão terríveis sejam as coisas para seus súditos, este personagem não se deixa incomodar por elas."
 yearly_saharan.0001.a.tt:0 "#WEAK Isso pode influenciar os locais mais tarde...#!"
 yearly_saharan.0001.a:0 "Eu aceito graciosamente este tributo."
 yearly_saharan.0001.b:0 "Você pode continuar a passar, mas é só isso."
 yearly_saharan.0001.c.list:0 "Todos os [counties|E] do mesmo [realm|E] próximos a [target_county.GetNameNoTierNoTooltip]"
 yearly_saharan.0001.c:0 "[source_county.GetProvince.GetCounty.GetFaith.GetAdherentNamePluralNoTooltip] estão proibidos em [target_county.GetNameNoTierNoTooltip], seus bens são #EMP confiscados#!!"
 yearly_saharan.0001.desc:0 "O comércio trans-saariano sempre passou por estas terras, trazendo riqueza, ideias e ideologias. Normalmente, um governante como eu simplesmente precisa pegar sua parte justa, e de outra forma as rotas se mantêm sozinhas.\n\nNo entanto, recentemente, cada vez mais comerciantes [source_county.GetProvince.GetCounty.GetFaith.GetAdherentNamePluralNoTooltip] têm passado por [target_county.GetNameNoTier], trazendo sua fé e moeda consigo.\n\nUm consórcio está pedindo minha permissão para se estabelecer e comprar propriedades e trouxe um generoso presente para adquirir meu favor."
 yearly_saharan.0001.t:0 "Comerciantes [source_county.GetProvince.GetCounty.GetFaith.GetAdherentNamePluralNoTooltip] em [target_county.GetNameNoTierNoTooltip]"
 yearly_saharan.0003.a:0 "Uma bela fortuna!"
 yearly_saharan.0003.b:0 "Taxe-os até a oblivion."
 yearly_saharan.0003.desc:0 "e parece que eles se integraram bastante bem na comunidade existente.\n\nComo resultado, o comércio está inundando a área, as receitas estão em alta e até mesmo os camponeses estão familiarizados com o som do ouro tilintando!"
 yearly_saharan.0003.desc_current:0 "Há alguns anos, [source_county.GetProvince.GetCounty.GetFaith.GetAdherentNamePluralNoTooltip] de [source_county.GetNameNoTier] têm vivido em [target_county.GetNameNoTier],"
 yearly_saharan.0003.desc_initial:0 "Os comerciantes [source_county.GetProvince.GetCounty.GetFaith.GetAdherentNamePluralNoTooltip] que permiti se estabelecerem em [target_county.GetNameNoTier] estão lá há alguns anos agora,"
 yearly_saharan.0003.t:0 "$yearly_saharan.0001.t$: Integração"
 yearly_saharan.0004.a.tt.outcome_1:0 "Aumento de Stewardship"
 yearly_saharan.0004.a.tt.outcome_2:0 "$yearly_saharan.0004.a.tt.outcome_1$"
 yearly_saharan.0004.a.tt.outcome_3:0 "$yearly_saharan.0004.a.tt.outcome_1$"
 yearly_saharan.0004.a.tt:0 "Você tenta melhorar sua [stewardship|E]"
 yearly_saharan.0004.a:0 "Acho que posso aprender algo ou dois com esses comerciantes!"
 yearly_saharan.0004.b:0 "Será que estou ouvindo o som da taxa de imposto subindo?"
 yearly_saharan.0004.c:0 "Claro, teremos que cobrar alguns impostos atrasados..."
 yearly_saharan.0004.desc:0 "e o comércio e dinamismo que eles trouxeram para a área parecem ilimitados!\n\nAs pessoas se aglomeram nos mercados: carruagens carregadas de ouro rumam para o norte, carroças cheias de sal inundam o sul, e todos pagam impostos na ida e na volta! Verdadeiramente, este é um canto próspero do reino!"
 yearly_saharan.0004.desc_current:0 "$yearly_saharan.0003.desc_current$"
 yearly_saharan.0004.desc_initial:0 "$yearly_saharan.0003.desc_initial$"
 yearly_saharan.0004.t:0 "$yearly_saharan.0001.t$: Boom Comercial"
 yearly_saharan.0005.a:0 "Bem-vindos à luz de [ROOT.GetCharacter.GetFaith.HighGodName]!"
 yearly_saharan.0005.b:0 "Hmm. Pelo menos eles estão felizes com isso."
 yearly_saharan.0005.c:0 "Não enquanto eu for [Select_CString( ROOT.GetCharacter.IsFemale, 'a', 'o' )] [ROOT.GetCharacter.GetTitleAsNameNoTooltip]!"
 yearly_saharan.0005.desc:0 "e sua fé enraizou-se firmemente nos corações dos habitantes locais. Tanto que muitos agora seguem [target_county.GetProvince.GetCounty.GetFaith.HighGodName] em vez de rezar para [target_county_old_faith.HighGodName]!\n\nA conversão foi pacífica, e as pessoas parecem dóceis e contentes com suas novas crenças, mas as antigas tradições quase desapareceram."
 yearly_saharan.0005.desc_current:0 "$yearly_saharan.0003.desc_current$"
 yearly_saharan.0005.desc_initial:0 "$yearly_saharan.0003.desc_initial$"
 yearly_saharan.0005.t:0 "$yearly_saharan.0001.t$: Mudança de Fé"
 yearly_saharan.0021.a:0 "Eu até vou deixar você governar isso!"
 yearly_saharan.0021.b:0 "As pessoas da cultura [nomad_leader.GetCulture.GetNameNoTooltip] são sempre bem-vindas em meu reino."
 yearly_saharan.0021.c:0 "Talvez você queira se juntar a mim como um vassalo em vez disso?"
 yearly_saharan.0021.d:0 "Absurdo! Desapareça!"
 yearly_saharan.0021.desc:0 "Embora eu seja um[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] nobre [ROOT.GetCharacter.GetTitleAsNameNoTooltip], existem lugares muito remotos onde nem mesmo meu nome pode ter muita influência. Lugares que eu nunca posso verdadeiramente esperar governar.\n\nEmergindo de lugares profundos no Saara, tribos nômades [nomad_leader.GetCulture.GetCollectiveNounNoTooltip] têm avançado em [target_county.GetNameNoTier] ultimamente, ocupando sem esforço os espaços e territórios que os colonos locais [target_county.GetProvince.GetCounty.GetCulture.GetNameNoTooltip] deixam para trás.\n\nUm dos seus líderes até veio até mim pedindo permissão para trazer sua confederação mais ampla para assumir a área em meu nome."
 yearly_saharan.0021.t:0 "Nômades [nomad_leader.GetCulture.GetNameNoTooltip] se Dirigem para [target_county.GetNameNoTierNoTooltip]"
 yearly_saharan.0031.a.tt_fail:0 "[raided_character_marshal.GetTitledFirstNameNoTooltip] repele os escravistas"
 yearly_saharan.0031.a.tt_success:0 "[raided_county.GetNameNoTierNoTooltip] é fortemente saqueado em busca de escravos"
 yearly_saharan.0031.a:0 "Como isso é lucrativo! Envie soldados para se juntar a eles!!"
 yearly_saharan.0031.b:0 "Pare com essa barbárie!"
 yearly_saharan.0031.c.raided_hurt:0 "[raided_county.GetNameNoTierNoTooltip] é saqueada"
 yearly_saharan.0031.c.raiders_hurt:0 "Muitos saqueadores de [slave_raider_county.GetAdjectiveNoTooltip] ficam feridos"
 yearly_saharan.0031.c:0 "Isso realmente não me diz respeito."
 yearly_saharan.0031.desc:0 "Roubos de escravos e o tráfico humano resultante são frequentemente fatos brutais da vida para aqueles que estão na região do Sahel ou perto dela. O dinheiro que tais saques trazem pode ser muito lucrativo para ser abandonado, e muitos assentamentos saqueiam uns aos outros esporadicamente.\n\nRecentemente, no entanto, escravistas em [slave_raider_county.GetNameNoTier] têm atacado fervorosamente [raided_county.GetNameNoTier] nas proximidades, e vários comerciantes proeminentes estão planejando um grande ataque, opondo-se ao [raided_character_marshal.GetCouncilTitle] [raided_character_marshal.GetFirstName]."
 yearly_saharan.0031.t:0 "Saqueadores de Escravos contra [affected_sub_realm.GetNameNoTierNoTooltip] Escalam"
 yearly_saharan.0032.a.tt_fail:0 "Os saqueadores d[Select_CString( slave_raider_county.GetHolder.IsFemale, 'a', 'o' )] [slave_raider_county.GetHolder.GetTitledFirstName] devastam [raided_county.GetNameNoTierNoTooltip]"
 yearly_saharan.0032.a.tt_success:0 "Você derrota e saqueia os saqueadores"
 yearly_saharan.0032.a:0 "Às armas contra esses bandidos!"
 yearly_saharan.0032.b:0 "Sabe, eles realmente deveriam pagar imposto sobre isso..."
 yearly_saharan.0032.c:0 "Eu realmente não me importo."
 yearly_saharan.0032.desc:0 "Os saqueadores de escravos do Sahel são, infelizmente, uma ameaça que muitas pessoas nesta terra enfrentam. O atrativo das riquezas obtidas ao enviar seus semelhantes para os confins da Terra é, para alguns, simplesmente muito forte.\n\nNormalmente, tais ataques são dispersos e desconexos, mas os saqueadores de [slave_raider_county.GetNameNoTier] começaram a fazer ataques coordenados contra [raided_county.GetNameNoTier]. Os saqueadores acorrentam aldeias inteiras, liderados pelos soldados d[Select_CString( slave_raider_county.GetHolder.IsFemale, 'da própria', 'do próprio' )] [slave_raider_county.GetHolder.GetTitledFirstName]!"
 yearly_saharan.0032.t:0 "Saqueadores Marauding de [hostile_sub_realm.GetNameNoTierNoTooltip]"
