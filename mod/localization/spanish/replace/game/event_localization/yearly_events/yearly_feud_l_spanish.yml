l_spanish:
 attacked_by_rivals_child:0 "Família em Conflito"
 bp1_yearly.6000.a.failure:0 "[rivals_child.GetFirstName] acha sua condescendência humilhante"
 bp1_yearly.6000.a.success:0 "Você convence [rivals_child.GetFirstName] a recuar"
 bp1_yearly.6000.a.tt:0 "Tentar convencer [rivals_child.GetFirstNameNoTooltip] a sair"
 bp1_yearly.6000.a:0 "Minha disputa é com [Select_CString( my_rival.IsFemale, 'a sua', 'o seu' )] [my_rival.GetMotherFather], não com você."
 bp1_yearly.6000.b.tt:0 "#V Duele#! com [rivals_child.GetFirstNameNoTooltip] para ensinar a [rivals_child.GetSheHe] o seu lugar!\n#weak Este duelo pode levar à morte.#!\nSe você vencer, ganhará [prestige_i] [prestige|E]\n\nSua [prowess|E]: [prowess_i]#V [SCOPE.GetRootScope.GetCharacter.GetProwess]#!\n[prowess|E] de [rivals_child.GetFirstNamePossessive]: [prowess_i]#V [rivals_child.GetProwess]#!"
 bp1_yearly.6000.b:0 "Aceito o desafio!"
 bp1_yearly.6000.c:0 "Guardas! Tirem essa #EMP criança#! daqui."
 bp1_yearly.6000.desc:0 "Um grito alto corta a agitação do lado de fora de [ROOT.Char.Custom('ResidenceBuilding')].\n\n\"Maldit[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rivals_child'))]! Eu sou [Select_CString( rivals_child.IsFemale, 'a', 'o' )] [rivals_child.Custom('GetDaughterSon')] d[Select_CString( my_rival.IsFemale, 'a', 'o' )] [my_rival.GetTitledFirstName] e chegou a hora de você responder por seus atos vis.\nEnfrente-me, ou o mundo saberá que você não está dispost[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a defender sua própria honra!\"\n\nQuando me viro, encontro os olhos ardentes de um[Select_CString( rivals_child.IsFemale, 'a', '' )] [rivals_child.GetWomanMan] consumid[Select_CString( rivals_child.IsFemale, 'a', 'o' )] pelo desejo de defender a honra [Select_CString( my_rival.IsFemale, 'da sua', 'do seu' )] [my_rival.GetMotherFather].\n\nMeus guardas ainda estão por perto – se eu quiser, posso mandar que expulsem ess[Select_CString( rivals_child.IsFemale, 'a', 'e' )] cabeça-quente, humilhad[Select_CString( rivals_child.IsFemale, 'a', 'o' )] e impotente."
 bp1_yearly.6000.t:0 "Pelos Pecados de um[Select_CString( my_rival.IsFemale, 'a', '' )] [my_rival.GetMotherFather|U]"
 bp1_yearly.6001.victory_toast:0 "[rivals_child.GetFirstName] foi derrotad[Select_CString( rivals_child.IsFemale, 'a', 'o' )] e enviad[Select_CString( rivals_child.IsFemale, 'a', 'o' )] embora"
 bp1_yearly.6002.trigger_failure:0 "Meu duelo contra [rivals_child.GetFirstNameNoTooltip] foi invalidado"
 bp1_yearly.6003.a:0 "Você se saiu bem, [rivals_child.Custom('GetDaughterSon')]"
 bp1_yearly.6003.b:0 "Como você pôde fazer isso? Devemos compensar [attacked_rival.GetTitledFirstNameNoTooltip]"
 bp1_yearly.6003.desc:0 "\"Eu fiz apenas o que era necessário para defender sua honra!\"\n\n[rivals_child.GetFirstNameNoTooltip] está exibindo uma mistura estranha de vergonha e orgulho enquanto [rivals_child.GetSheHe] me explica o que aconteceu. Parece que, em sua ânsia de defender o nome da família, [rivals_child.GetSheHe] emboscou [Select_CString( attacked_rival.IsFemale, 'minha inimiga', 'meu inimigo' )], [attacked_rival.GetTitledFirstName], na casa [attacked_rival.GetHerHim].\n\n[rivals_child.GetFirstNameNoTooltip] foi rapidamente humilhad[Select_CString( rivals_child.IsFemale, 'a', 'o' )] por [attacked_rival.GetFirstNameNoTooltip] e agora foi enviad[Select_CString( rivals_child.IsFemale, 'a', 'o' )] para casa para mim."
 bp1_yearly.6003.t:0 "Algo Imprudente"
 bp1_yearly.6004.a:0 "Devo oferecer minhas condolências [Select_CString( my_rival.IsFemale, 'a', 'ao' )] [my_rival.GetTitledFirstNameNoTooltip]."
 bp1_yearly.6004.b:0 "[my_rival.GetFirstNameNoTooltip] só colheu o que [my_rival.GetSheHe] semeou!"
 bp1_yearly.6004.desc:0 "Enquanto olho para o corpo de [rivals_child.GetFirstName], estou cada vez mais percebendo que este duelo terá consequências. Eu matei [Select_CString( rivals_child.IsFemale, 'a', 'o' )] [rivals_child.Custom('GetDaughterSon')] de um[Select_CString( my_rival.IsFemale, 'a', '' )] [my_rival.GetWomanMan] que considero [Select_CString( my_rival.IsFemale, 'minha inimiga', 'meu inimigo' )], e em breve o mundo saberá o que fiz."
 bp1_yearly.6004.t:0 "A Matar um[Select_CString( rivals_child.IsFemale, 'a', '' )] [rivals_child.Custom('GetDaughterSon')|U]"
 bp1_yearly.6005.a:0 "Uma lição valiosa para [attacked_rival.GetFirstNameNoTooltip]"
 bp1_yearly.6005.b:0 "Isso está tudo errado! Devemos compensar [attacked_rival.GetTitledFirstNameNoTooltip]"
 bp1_yearly.6005.desc:0 "\"Eu fiz o que tinha que fazer para defender sua honra!\"\n\n[rivals_child.GetFirstNameNoTooltip] está exibindo uma mistura estranha de forte orgulho e leve apreensão enquanto [rivals_child.GetSheHe] me explica o que aconteceu. Parece que, em sua ânsia de defender o nome da família, [rivals_child.GetSheHe] emboscou [Select_CString( attacked_rival.IsFemale, 'a minha inimiga', 'o meu inimigo' )], [attacked_rival.GetTitledFirstName], na casa [attacked_rival.GetHerHim].\n\n[rivals_child.GetFirstNameNoTooltip] conseguiu superar [attacked_rival.GetFirstNameNoTooltip], derrotando [attacked_rival.GetSheHe] em um combate."
 bp1_yearly.6005.outcome_toast:0 "[rivals_child.GetFirstName] foi vitorios[Select_CString( rivals_child.IsFemale, 'a', 'o' )] e nosso bom nome foi humilhado"
 bp1_yearly.6005.t:0 "Retorno Triunfante?"
 bp1_yearly.6006.a:0 "Você me enche de orgulho, [rivals_child.Custom('GetDaughterSon')]"
 bp1_yearly.6006.b:0 "Como você pôde fazer isso? Devemos compensar [rivals_beneficiary.GetTitledFirstNameNoTooltip]"
 bp1_yearly.6006.c.tt:0 "[rivals_child.GetFirstNameNoTooltip] ficará desapontad[Select_CString( rivals_child.IsFemale, 'a', 'o' )] com sua falta de apoio"
 bp1_yearly.6006.c:0 "Uma doação para a caridade compensará a má ação"
 bp1_yearly.6006.desc:0 "\"Eu fiz o que tinha que fazer para defender sua honra!\"\n\n[rivals_child.GetFirstNameNoTooltip] está exibindo uma mistura estranha de forte orgulho e leve apreensão enquanto [rivals_child.GetSheHe] me explica o que aconteceu. Parece que, em sua ânsia de defender o nome da família, [rivals_child.GetSheHe] emboscou [Select_CString( attacked_rival.IsFemale, 'a minha inimiga', 'o meu inimigo' )], [attacked_rival.GetTitledFirstName], na casa [attacked_rival.GetHerHim].\n\n[rivals_child.GetFirstNameNoTooltip] conseguiu superar [attacked_rival.GetFirstNameNoTooltip], matando [attacked_rival.GetSheHe] em um combate."
 bp1_yearly.6006.outcome_toast:0 "[rivals_child.GetFirstName] derrotou e matou [my_rival.GetFirstName]"
 bp1_yearly.6006.t:0 "Um Herói Retorna?"
 bp1_yearly.6010.a.flavor:0 "Jure mais vingança contra [attacked_rival.GetFirstNameNoTooltip]"
 bp1_yearly.6010.a:0 "[attacked_rival.GetFirstNameNoTooltip] vai se arrepender deste dia!"
 bp1_yearly.6010.b.flavor:0 "Tente evitar mais derramamento de sangue"
 bp1_yearly.6010.b:0 "O que eu fiz!?"
 bp1_yearly.6010.deescalation.outcome_toast:0 "[my_rival.GetFirstName] soube da morte de [rivals_child.GetFirstNameNoTooltip]"
 bp1_yearly.6010.desc.apology:0 "\n\nEsta notícia vem junto com uma carta [Select_CString( attacked_rival.IsFemale, 'da própria', 'do próprio' )] [attacked_rival.GetTitledFirstNameNoTooltip], declarando que, embora [rivals_child.GetFirstNameNoTooltip] tenha encontrado um fim justo por atacar alguém em sua casa, [rivals_child.GetSheHe] lamenta o que aconteceu e [rivals_child.GetSheHe] me compensará financeiramente por minha perda."
 bp1_yearly.6010.desc:0 "Parece que m[Select_CString( rivals_child.IsFemale, 'inha', 'eu' )] [rivals_child.Custom('GetDaughterSon')], [rivals_child.GetTitledFirstName], foi inspirad[Select_CString( rivals_child.IsFemale, 'a', 'o' )] pelo meu ódio [Select_CString( attacked_rival.IsFemale, 'pela minha', 'pelo meu' )] rival, [attacked_rival.GetTitledFirstName], e resolveu encerrar nossa rivalidade.\n\nMovid[Select_CString( rivals_child.IsFemale, 'a', 'o' )] por entusiasmo juvenil, [rivals_child.GetFirstNameNoTooltip] emboscou [attacked_rival.GetFirstNameNoTooltip] e foi impiedosamente mort[Select_CString( rivals_child.IsFemale, 'a', 'o' )] no combate que se seguiu."
 bp1_yearly.6010.t:0 "A Perda de um[Select_CString( rivals_child.IsFemale, 'a', '' )] [rivals_child.Custom('GetDaughterSon')]"
 bp1_yearly.6010.vengeance.outcome_toast:0 "[my_rival.GetFirstName] jurou vingar [rivals_child.GetFirstNameNoTooltip]"
 child_let_down_tooltip:0 "[rivals_child.GetFirstNameNoTooltip] ficará desapontad[Select_CString( rivals_child.IsFemale, 'a', 'o' )] com sua falta de apoio"
 culture_tradition_events.2000.a:0 "Pegue isso, [inspiring_vassal.GetTitledFirstNameNoTooltip], e me diga se precisar de mais."
 culture_tradition_events.2000.b:0 "Leal é apenas outra palavra para fraco."
 culture_tradition_events.2000.desc:0 "Ao considerar um pedido de ajuda [Select_CString( inspiring_vassal.IsFemale, 'da minha vassala', 'do meu vassalo' )], [inspiring_vassal.GetTitledFirstName], percebo de repente o quão boa sempre foi minha relação com [Select_CString( ROOT.Char.GetLiege.IsFemale, 'minha própria senhora', 'meu próprio senhor' )], [ROOT.Char.GetLiege.GetTitledFirstName].\n\nOcorre-me que seria bom esforçar-me para emular a conduta diligente d[Select_CString( ROOT.Char.GetLiege.IsFemale, 'a', 'o' )] [ROOT.Char.GetLiege.GetFirstNameNoTooltip] em meu relacionamento com todos aqueles a quem tenho uma obrigação. Dessa forma, posso inspirar o mesmo senso de dever naqueles que estão sob minha responsabilidade."
 culture_tradition_events.2000.t:0 "Liderança Inspiradora"
 culture_tradition_events.2001.a:0 "A reciprocidade é o que move o mundo, não o dever."
 culture_tradition_events.2001.b:0 "Devo me esforçar para ser melhor do que [ROOT.Char.GetLiege.GetTitledFirstNameNoTooltip]."
 culture_tradition_events.2001.desc:0 "Um conflito recente entre [Select_CString( targeted_vassal.IsFemale, 'minha vassala', 'meu vassalo' )], [targeted_vassal.GetTitledFirstName], e seus próprios súditos necessitou de uma visita repentina a [targeted_vassal.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. Minha simples presença aparentemente resolveu o assunto, e os camponeses locais parecem contentes por suas queixas terem sido ouvidas por mim.\n\nEnquanto percorro corredores vazios tarde da noite, pondero minha relação decepcionante com [Select_CString( ROOT.Char.GetLiege.IsFemale, 'minha própria senhora', 'meu próprio senhor' )], [ROOT.Char.GetLiege.GetTitledFirstName]. [ROOT.Char.GetLiege.GetSheHe|U] sempre foi rápid[Select_CString( ROOT.Char.GetLiege.IsFemale, 'a', 'o' )] em exigir minha obediência, mas raramente [ROOT.Char.GetLiege.GetSheHe] veio em meu auxílio como acabei de fazer por [targeted_vassal.GetTitledFirstNameNoTooltip]."
 culture_tradition_events.2001.t:0 "Liderando Pelo Exemplo?"
 defended_family_honor_opinion:0 "Defendeu a Honra da Família"
 defused_feud_escalation_opinion:0 "Desarmou a Escalada da Rixa"
