 killed_my_child:0 "Assassin[Select_CString( my_rival.IsFemale, 'a', 'o' )] do meu Filho"
 murdered_my_vassal_crime:0 "Assassinato"
 not_controlling_child_tooltip:0 "Você perderá prestígio por não conseguir controlar s[Select_CString( rivals_child.IsFemale, 'ua', 'eu' )] [rivals_child.Custom('GetDaughterSon')]"
 rewarding_success_in_child_tooltip:0 "[rivals_child.GetFirstName] será recompensad[Select_CString( rivals_child.IsFemale, 'a', 'o' )]"
