l_spanish:
 bp1_yearly.0100.a.success_chance:0 "Qualquer [schemes|E] que [host.GetShortUINameNoTooltip] tenha contra você ganha 15 [success_chance|E]"
 bp1_yearly.0100.a.tt:0 "Uma hospitalidade miserável aguarda..."
 bp1_yearly.0100.a:0 "Sorriam, homens!"
 bp1_yearly.0100.a_title:0 "Uma noite miserável e paranóica"
 bp1_yearly.0100.b.secrets:0 "Você aprende um [secret|E] pertencente a [host.GetFirstName] ou a sua [family|E]"
 bp1_yearly.0100.b.tt:0 "Você se abriga... e a oportunidade de bisbilhotar"
 bp1_yearly.0100.b.tt_crit_failure:0 "Você é pego invadindo"
 bp1_yearly.0100.b.tt_failure:0 "Você não encontra armários cheios de esqueletos"
 bp1_yearly.0100.b.tt_success:0 "A noite traz resultados"
 bp1_yearly.0100.b:0 "Talvez seja aqui que vivem os segredos de família..."
 bp1_yearly.0100.c.tt:0 "Para [befriend.GetTitledFirstName], você pode trazer alegria"
 bp1_yearly.0100.c.tt_crit_failure:0 "Vocês compartilham uma terrível noite de discussões"
 bp1_yearly.0100.c.tt_failure:0 "Seu charme é apreciado"
 bp1_yearly.0100.c.tt_success:0 "Você se aproxima d[Select_CString( befriend.IsFemale, 'a', 'o' )] [host.Custom2('RelationToMeShort', SCOPE.sC('befriend'))] de seu inimigo"
 bp1_yearly.0100.c:0 "Por que brigar com [befriend.GetFirstNameNoTooltip]...?"
 bp1_yearly.0100.close:0 "De uma forma ou de outra... esta será uma noite longa."
 bp1_yearly.0100.d.tt.sex:0 "Você dorme com [lover.GetShortUINameNoTooltip]"
 bp1_yearly.0100.d.tt.success:0 "[lover.GetSheHe|U] está à sua espera"
 bp1_yearly.0100.d.tt:0 "[host.Custom2('RelationToMeShort', SCOPE.sC('lover'))] de [host.GetFirstNamePossessiveNoTooltip] pode estar lá dentro, ansioso para libertá-lo de suas roupas gastas de viagem..."
 bp1_yearly.0100.d.tt_failure:0 "Uma noite sozinho"
 bp1_yearly.0100.d.tt_no_sex:0 "Não há sinal do fascinante [lover.GetShortUINameNoTooltip]"
 bp1_yearly.0100.d:0 "Nada como um encontro secreto..."
 bp1_yearly.0100.desc:0 "Os céus anunciam um mal presságio, o vento uiva: vem um redemoinho!"
 bp1_yearly.0100.e.tt:0 "Colocar um sorriso falso? Não, você prefere amarrar seus anfitriões"
 bp1_yearly.0100.e.tt_failure:0 "Você é lançado de volta para fora nos elementos"
 bp1_yearly.0100.e.tt_success:0 "Sob a cobertura da tempestade, você é imparável"
 bp1_yearly.0100.e.wounded_chance:0 "Sua [prowess|E] determina se você fica ferido"
 bp1_yearly.0100.e:0 "Nossas espadas garantirão abrigo."
 bp1_yearly.0100.f.sick:0 "Você pode contrair [GetTrait('ill').GetName( GetNullCharacter )]"
 bp1_yearly.0100.f.tt_failure:0 "A noite é longa. A tempestade é cruel"
 bp1_yearly.0100.f.tt_success:0 "Você suporta os elementos... mal"
 bp1_yearly.0100.f.very_sick:0 "Você pode contrair [GetTrait('pneumonic').GetName( GetNullCharacter )]"
 bp1_yearly.0100.f:0 "Um buraco no chão seria preferível."
 bp1_yearly.0100.friend_welcome:0 "Talvez [host.GetFirstNameNoTooltip] esteja distante? Talvez a sorte seja generosa e — [Select_CString( befriend.IsFemale, 'sua', 'seu' )] [befriend.Custom('ComplimentAdjective')] [host.Custom2('RelationToMeShort', SCOPE.sC('befriend'))] [befriend.GetFirstName] esteja aqui para me dar as boas-vindas?"
 bp1_yearly.0100.lover_welcome:0 "Talvez [host.GetFirstNameNoTooltip] esteja distante? Talvez a sorte seja generosa — e [Select_CString( lover.IsFemale, 'sua', 'seu' )] [host.Custom2('RelationToMeShort', SCOPE.sC('lover'))] atraente [lover.GetFirstName] esteja aqui para me dar as boas-vindas?"
 bp1_yearly.0100.nomadic_host:0 "Por sorte, encontramos um verdadeiro acampamento. Infelizmente... aqueles que estão dentro são membros da tribo [Select_CString( host.IsFemale, 'da minha odiosa', 'do meu odioso' )] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('host'))] [host.GetFirstName].\n\nEstou sendo castigado pela tempestade crescente."
 bp1_yearly.0100.nomadic_traveller:0 "\n\nNão há tempo para montar nosso acampamento antes que a tempestade chegue."
 bp1_yearly.0100.sedentary_host:0 "Encontramos uma única casa rural meio decente... mas a moradia pertence [Select_CString( host.IsFemale, 'a minha odiosa', 'ao meu odioso' )] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('host'))] [host.GetFirstName].\n\nEstou sendo castigado pela tempestade crescente."
 bp1_yearly.0100.sedentary_traveller:0 "\n\nCabanas precárias dominam este estranho canto da terra, sujas e minúsculas."
 bp1_yearly.0100.t:0 "Abrigo da Tempestade"
 bp1_yearly.0101.a:0 "Mas é #EMP você#! que eu sonho, [lover.GetFirstNameNoTooltip]!"
 bp1_yearly.0101.b:0 "Um único, delicioso insulto."
 bp1_yearly.0101.desc:0 "Em sussurros, agradeço a [ROOT.Char.GetFaith.FertilityGodName] por manter [Select_CString( host.IsFemale, 'a odiosa', 'o odioso' )] [lover.Custom2('RelationToMeShort', SCOPE.sC('host'))] d[Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetTitledFirstNamePossessive] longe deste humilde lugar.\n\nEnquanto a tempestade faz guerra com os céus, sua fúria ecoa ao nosso redor,"
 bp1_yearly.0101.finish:0 "\n\nO canto onde nos encontramos está escuro. Bem escuro. E nada do que fazemos, com seu corpo faminto, sob minhas roupas sujas de terra, pode ser ouvido através do tumulto da natureza.\n\nO único som que toca meus lábios é uma maldição ao nome d[Select_CString( host.IsFemale, 'a', 'o' )] [lover.Custom2('RelationToMeShort', SCOPE.sC('host'))] [lover.GetHerHim]. E, naquele exato momento, eu completo minha vitória."
 bp1_yearly.0101.gentle_flirt:0 "[lover.GetFirstNameNoTooltip] treme mais a cada momento. Será que esse medo é apenas atuação? Algo se agita nos olhos [lover.GetHerHim], logo atrás de seu sorriso formal. Os olhos [lover.GetHerHim|U] me dizem... sim."
 bp1_yearly.0101.protective_flirt:0 "[lover.GetFirstNameNoTooltip] age com confiança, protetora. Sorrio agradecidamente para [lover.GetSheHe] — obedientemente — e em pouco tempo... [lover.GetSheHe] mergulha em um silêncio extasiado. [lover.GetSheHe|U] é minha."
 bp1_yearly.0101.t:0 "Tempestade na Selva"
 bp1_yearly.0102.a:0 "Invista em camas mais macias, seu brutamontes!"
 bp1_yearly.0102.attack_fail:0 "\n\nNão? Ah, é verdade. Você #EMP tentou#! nos atacar, mas foi jogado de volta para a selva como a besta que é. Seus esforços foram patéticos."
 bp1_yearly.0102.attack_success:0 "\n\nVocê atacou meus homens como um animal assustado. Você atacou sem honra ou cortesia, como é seu costume."
 bp1_yearly.0102.b:0 "Não são os céus que você deveria temer, [host.GetFirstNameNoTooltip]..."
 bp1_yearly.0102.close:0 "\n\nQue a próxima tempestade te varra da face da terra."
 bp1_yearly.0102.cold_welcome:0 "\n\n[Select_CString( befriend.IsFemale, 'Sua anfitriã', 'Seu anfitrião' )] [befriend.GetTitledFirstName] agora aprendeu a te odiar assim como eu. Meu coração transborda de alegria."
 bp1_yearly.0102.desc:0 "Você dormiu bem? Aproveite uma noite de hospitalidade do meu povo,"
 bp1_yearly.0102.desc_powerful:0 "sonhando que poderia ser eu?"
 bp1_yearly.0102.desc_weak:0 "descansando seus gloriosos pés?"
 bp1_yearly.0102.erotic_welcome:0 "\n\nSe eu estivesse presente, você teria sido expulso com a primeira palavra odiosa que você sussurrou para [Select_CString( lover.IsFemale, 'a minha', 'o meu' )] [host.Custom2('RelationToMeShort', SCOPE.sC('lover'))], seu traidor."
 bp1_yearly.0102.failed_snoop:0 "\n\nSeus direitos como senhor feudal têm limites. Eu me certifiquei de que todos saibam do seu desrespeito por eles."
 bp1_yearly.0102.opening:0 "[host.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 bp1_yearly.0102.uneventful_night:0 "\n\nDizem que você se destaca por ser um mendigo sem charme, intrusivo e sujo de esterco."
 bp1_yearly.0102.warm_welcome:0 "\n\nSe eu estivesse presente, teria te expulsado. [befriend.GetTitledFirstName] sempre teve um gosto terrível."
