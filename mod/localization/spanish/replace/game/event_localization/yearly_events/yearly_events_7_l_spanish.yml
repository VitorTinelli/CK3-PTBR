l_spanish:
 yearly.7001.a:0 "Isso vai perturbar os convidados! Isso é mera paranoia."
 yearly.7001.b:0 "Adicione mais algumas patrulhas para dar sorte."
 yearly.7001.c.tt:0 "[marshal.GetTitledFirstNameNoTooltip] conta mais de suas suspeitas"
 yearly.7001.c:0 "Você #EMP sabe#! de algo, [marshal.GetTitledFirstNameNoTooltip]?"
 yearly.7001.d.tt:0 "Você assusta todos que vêm à corte"
 yearly.7001.d.win.tt:0 "Você assusta facções que estão de olho em você"
 yearly.7001.d:0 "Encha o [ROOT.GetCharacter.Custom('FortifiedBuilding')] com guardas. Não deixe nenhum quarto sem vigilância!"
 yearly.7001.desc:0 "Meu [marshal.GetCouncilTitle], [marshal.GetTitledFirstNameNoTooltip], entrega-me minha [ROOT.Char.Custom('signature_weapon')] favorita. Ela está afiada e polida, a ponto de eu ver um reflexo da minha própria imagem nela.\n\n\"Você deveria carregar isso por sua própria segurança. Dissidentes espreitam nas sombras como ratos doentes, e toda vez que participamos de um evento público, eu me pergunto se será o nosso último.\"\n\n[marshal.GetSheHe|U] olha pela janela. \"Talvez devêssemos aumentar as patrulhas da guarda... Há um gosto doentio no ar desta manhã, e eu estou com medo.\""
 yearly.7001.t:0 "O Último Dia"
 yearly.7001.tt:0 "[marshal.GetTitledFirstNameNoTooltip] ignora suas perguntas"
 yearly.7002.a:0 "Não posso confiar em ninguém!"
 yearly.7002.b.tt.2:0 "Você confia em dois de seus guardas"
 yearly.7002.b.tt:0 "[knight_1.GetTitledFirstName] e [knight_2.GetTitledFirstName] são alguns dos meus melhores guerreiros. Espero que eles me protejam."
 yearly.7002.b:0 "Preciso confiar em alguns dos meus cavaleiros [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] mais próximos para me proteger!"
 yearly.7002.c.tt:0 "Você mantém isso em segredo"
 yearly.7002.c:0 "Posso me defender!"
 yearly.7002.d:0 "Sinto apenas vergonha ao escrever estas palavras. [coup_leader.GetTitledFirstName] passou meses subornando seus guardas. [coup_leader.GetSheHe|U] planeja um ataque à sua vida na frente da corte... Eu desejo que sua vida seja poupada, mas por mais que eu tente, não consigo impedir meu coração de sangrar pela causa da [coup_faction.GetName].\n\nEu parti para o exílio. Não nos encontraremos novamente."
 yearly.7002:0 "Você está em perigo iminente, [ROOT.Char.Custom('FormOfAddressForLiege')]"
 yearly.7004.a:0 "Você chama isso de sequestro? Eu pelo menos esperaria que você chegasse em [neighbor_county.GetNameNoTier]."
 yearly.7004.b:0 "Traidores! Vocês ambos vão definhar em sacos na minha masmorra!"
 yearly.7004.c.tt:0 "Você é devolvido ao saco e levado para sua câmara"
 yearly.7004.c:0 "Me leve de volta para minha cama imediatamente!"
 yearly.7004.desc:0 "\"Rápido! [ROOT.GetCharacter.GetSheHe|U] está acordando!\"\n\nAo acordar, meu travesseiro parece mais áspero do que o normal. Minha cabeça está girando, mas o resto do meu corpo segue e tudo permanece escuro. Não estou na minha cama, mas sendo arrastado pelo chão em um saco.\n\n\"[ROOT.GetCharacter.GetSheHe|U] está se contorcendo demais! Eu continuo perdendo o controle.\"\n\nEnquanto as vozes discutem, eu luto o suficiente para eles deixarem cair o saco. Quando consigo sair, percebo que eles mal chegaram a alguns passos do jardim do [ROOT.GetCharacter.Custom('FortifiedBuilding')]."
 yearly.7004.tt:0 "As tramas da facção foram frustradas"
 yearly.7005.a:0 "Guardas, restrinjam [coup_leader.GetSheHe], [coup_leader.GetSheHe] não pode se tornar um mártir para os dissidentes."
 yearly.7005.b:0 "Deixe [coup_leader.GetSheHe] fazer isso."
 yearly.7005.c.tt:0 "Você cega e aprisiona [coup_leader.GetTitledFirstName]"
 yearly.7005.c:0 "Você merece um destino muito pior do que morrer aqui!"
 yearly.7005.claimant_faction:0 "\"Você não tem o direito de languidecer em cima desse trono. Eu preferiria morrer a vê-lo fazer mais um decreto falso.\""
 yearly.7005.coup_ruler_strike:0 "antes de correr para me atacar."
 yearly.7005.d.tt:0 "Você receberá todos os títulos e vassalos d[Select_CString( coup_leader.IsFemale, 'a', 'o' )] [coup_leader.GetTitledFirstNamePossessive]"
 yearly.7005.d:0 "Exilar [coup_leader.GetSheHe], para contar a história de quão difícil eu sou de matar."
 yearly.7005.decreased_security:0 "Todos os convidados no meu [ROOT.GetCharacter.Custom('FortifiedBuilding')] bebem [ROOT.Char.Custom('RegionalDrink')] e se fartam de fofocas sem se importar com nada."
 yearly.7005.devout.e:0 "Você nunca se juntará a mim em [ROOT.Char.GetFaith.PositiveAfterLife], miserável!"
 yearly.7005.double_death:0 "Em uma explosão dupla, [coup_leader.GetSheHe] atinge [first_character_kill.GetTitledFirstName] e [second_character_kill.GetTitledFirstName]"
 yearly.7005.e:0 "Eu vou te matar em [ROOT.Char.GetFaith.NegativeAfterLife], infame!"
 yearly.7005.failure:0 "À medida que os guardas agarram [coup_leader.GetSheHe], percebo que [coup_leader.GetSheHe] está tentando furiosamente empurrar a lâmina para o próprio coração em vez de ser capturado."
 yearly.7005.increased_security:0 "O [ROOT.GetCharacter.Custom('FortifiedBuilding')] está silencioso, alguns grupos sussurram. Todos estão nervosos ao ver meu salão do trono cercado por guardas."
 yearly.7005.independence_faction:0 "\n\n\"Se eu não posso ter meu próprio estado, pelo menos devo ser o herói da minha própria tragédia.\""
 yearly.7005.knight_support:0 "[knight_1.GetTitledFirstName] e [knight_2.GetTitledFirstName] estão prontos para morrer por mim, mas eu tenho pena de quem pode enfrentar suas lâminas."
 yearly.7005.liberty_faction:0 "\"Parece que a única maneira de quebrar as correntes ao redor de nossos pescoços é cortar a minha e a sua.\""
 yearly.7005.no_death:0 "Essa loucura audaciosa é rapidamente encerrada quando meus [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] cercam [coup_leader.GetSheHe]."
 yearly.7005.populist_faction:0 "\"Isso me entristece, eu juro, que não posso fazer nada além de conceder a você uma morte mais justa do que as agonias de todos aqueles que foram esmagados sob o seu pé. Pelo menos meu fim será o de um herói.\""
 yearly.7005.preparation:0 "É quase emocionante, sentar e esperar o [coup_faction.GetName] atacar."
 yearly.7005.preparation_good:0 "É ridículo que eles pensem que meros assassinos podem me matar."
 yearly.7005.preparation_poor:0 "Decidi confiar em nenhum companheiro além da minha [ROOT.Char.Custom('SignatureWeaponNameOrType')], e iremos para [ROOT.Char.Custom('GetAfterLifeDestination')] juntos, se necessário."
 yearly.7005.ruler_death:0 "Seu sangue logo se mistura com o meu quando sinto a [coup_leader.Custom('SignatureWeaponNameOrType')] atingir meu peito."
 yearly.7005.single_death:0 "Em uma explosão terrível, [coup_leader.GetSheHe] atinge [first_character_kill.GetTitledFirstName]"
 yearly.7005.single_knight_support:0 "Confio nos meus [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] para me apoiar, afinal de contas."
 yearly.7005.success:0 "É tolice pensar que [coup_leader.GetSheHe] poderia tomar meu trono neste pequeno golpe, mas quando [coup_leader.GetSheHe] vira a lâmina para sua própria garganta, percebo que isso nunca foi o que [coup_leader.GetSheHe] queria."
 yearly.7005.throne_approach:0 "[coup_leader.GetTitledFirstName] se aproxima do meu trono."
 yearly.7005.triple_death:0 "Para horror de todos, [coup_leader.GetSheHe] ataca [first_character_kill.GetTitledFirstName], [second_character_kill.GetTitledFirstName] e [third_character_kill.GetTitledFirstName]."
 yearly.7005.weapon:0 "\n\n[coup_leader.GetSheHe|U] puxa uma adaga escondida e avança rapidamente."
 yearly.7010.a:0 "Que fascinante! Quais são as regras?"
 yearly.7010.b:0 "Bem, é melhor deixá-los em paz."
 yearly.7010.desc:0 "Uma viagem a uma das aldeias em seu domínio me levou a uma situação intrigante. O que parece ser a grande maioria da aldeia se reuniu na praça do mercado, e dois grupos heterogêneos de pessoas se formaram.\n\nEquidistante de ambos - visível da minha posição apenas graças ao aldeão que segura-o com uma expressão apreensiva - parece ser uma bexiga de porco inflada.\n\nTalvez notando minha expressão interrogativa, um criado explica rapidamente a situação: parece que este é algum tipo de jogo popular!"
 yearly.7010.t:0 "O Jogo Bonito"
 yearly.7010.tt.lose:0 "Escolher isso pode diminuir suas chances de vitória!"
 yearly.7010.tt.win:0 "Isso pode ajudá-lo a vencer!"
 yearly.7010.tt.yes:0 "Investigue o que está acontecendo."
 yearly.7011.a:0 "Você acha que tem um lugar para mim?"
 yearly.7011.b:0 "Passatempo típico de plebeus. Deixe-os com isso."
 yearly.7011.desc:0 "É com alguma ansiedade que meu fiel criado me informa sobre as regras e regulamentos do evento que se avizinha. Aparentemente, este jogo chamado de #EMP 'futebol' #! é muito amplamente jogado e envolve todas as pessoas de todas as maneiras.\n\nSupostamente, ambos os lados se esforçam para mover a 'bola' - como a bexiga de porco é conhecida - para o lado da aldeia que seu grupo não está defendendo, por quaisquer meios necessários.\n\nEssa última parte foi entoada com significativa seriedade, e a explicação foi rápida: enquanto a morte é rara, as lesões não são."
 yearly.7011.t:0 "O Jogo Bonito: Avaliando os Riscos"
 yearly.7011.tt:0 "Traga-me as minhas botas!"
 yearly.7012.a:0 "Quanto você quer por isso?"
 yearly.7012.b:0 "Que premissa ridícula."
 yearly.7012.desc:0 "Enquanto estou entre o povo da cidade, vejo um[Select_CString( dummy_gender.IsFemale, 'a', '' )] [dummy_gender.GetWomanMan] de meia-idade ajustando algumas correias de couro sob sua túnica. Agora que percebo, na verdade, todo o seu abdômen parece completamente volumoso demais para alguém de sua estatura relativamente magra, seu peito e estômago pressionando um pouco contra as roupas. Notando meu interesse, ele sorri, me chama mais perto e levanta o tecido.\n\nSob sua túnica, enrolado ao redor de seu corpo, estão camadas de tábuas de madeira bruta na aproximação de uma armadura.\n\n\"Eu chamo de #EMP 'armadura interna'#!!\", [dummy_gender.GetSheHe] diz orgulhosamente, com um piscar de olhos acompanhante."
 yearly.7012.t:0 "O Jogo Bonito: Todo o Equipamento..."
 yearly.7013.a:0 "Espere! O que quer que [dummy_gender.GetSheHe] tenha pago a você, eu vou dobrar!"
 yearly.7013.b:0 "Nojento. Nunca teria acontecido em minha época!"
 yearly.7013.c:0 "Parece que teremos que ganhar sem [dummy_gender.GetSheHe]!"
 yearly.7013.desc:0 "Observando a multidão, vejo um[Select_CString( dummy_gender.IsFemale, 'a', '' )] [dummy_gender.GetWomanMan] que parece curiosamente fora do lugar. Vestido com peles ricas e com um pequeno séquito de pessoas, [dummy_gender.GetSheHe] está envolvido em uma conversa animada com outr[Select_CString( dummy_gender.IsFemale, 'a', 'o' )] [dummy_gender.GetWomanMan] significativamente maior. Abrindo caminho pela multidão, chego perto deles apenas para ver o rico comerciante deixar uma pequena bolsa de moedas na mão do outro.\n\n\"... um prazer fazer negócios com você. Agora garanta que minha aposta seja segura!\", diz o comerciante de papada, com um sorriso sarcástico.\n\nÀ medida que [Select_CString( dummy_gender.IsFemale, 'a', 'o' )] [dummy_gender.GetWomanMan] grande começa a se aproximar do grupo da outra equipe, parece que alguns não se importam com a santidade do jogo..."
 yearly.7013.t:0 "O Jogo Bonito: Olhos nas Tortas"
 yearly.7014.a:0 "Vamos ver o quão bem você joga agora..."
 yearly.7014.b:0 "Oh não, todas as tortas caíram na sujeira!"
 yearly.7014.c:0 "Melhor não."
 yearly.7014.desc.1:0 "Um padeiro local empreendedor claramente notou a multidão se reunindo, e seus dois carrinhos cambaleantes cheios de tortas de carne recém-assadas estão em alta demanda.\n\nEnquanto caminho até o carrinho em que a equipe adversária está se aglomerando, dou uma olhada nas prateleiras de pastéis fumegantes. Não demora muito para que o pensamento me ocorra e uma oportunidade surge para colocá-lo em prática, quando o sonoro estrondo de algo caindo do outro lado da praça faz com que todos se virem e olhem.\n\nMinha mão se move rapidamente para a pequena bolsa de cicuta em minha cintura..."
 yearly.7014.desc:0 "Um padeiro local empreendedor claramente notou a multidão se reunindo, e seus dois carrinhos cambaleantes cheios de tortas de carne recém-assadas estão em alta demanda.\n\nAndando até o carrinho que a equipe adversária está cercando, noto que os raios de uma das rodas estão praticamente se partindo. Não demora muito para que a ideia venha à minha mente e uma oportunidade surja para colocá-la em prática, com o estrondo sonoro de algo caindo do outro lado da praça fazendo com que todos se virem e olhem.\n\nUm chute rápido naquele raio, e..."
 yearly.7014.hemlock:0 "Vamos adicionar um ingrediente extra nas tortas..."
 yearly.7014.t:0 "O Jogo Bonito: Olhos nas Tortas"
 yearly.7015.a:0 "...quanto você quer por isso?"
 yearly.7015.b:0 "Você deveria ter vergonha!"
 yearly.7015.desc:0 "Enquanto me preparo para o esforço iminente, vejo um[Select_CString( dummy_gender.IsFemale, 'a', '' )] [dummy_gender.GetWomanMan] nos arredores da multidão dando goles em uma garrafa, seus olhos se movem rapidamente enquanto ele dá grandes goles. Normalmente, isso não seria excessivamente suspeito, mas a furtividade [dummy_gender.GetHerHim] é, e ainda mais quando [dummy_gender.GetSheHe] se assusta antes do meu toque inquisitivo no ombro.\n\nO que quer que [dummy_gender.GetSheHe] esteja bebendo não é água: o líquido é um tanto opaco, e está claro a partir do seu gesto de dor sempre que seus lábios tocam que certamente não é agradável ao paladar. Felizmente, [dummy_gender.GetSheHe] está quase ansioso para revelar seus segredos quando gentilmente instigado.\n\n'Poções de melhoria de desempenho', você diz?"
 yearly.7015.t:0 "O Belo Jogo: Poções de Melhoria de Desempenho"
 yearly.7020.a:0 "Siga-me, equipe!"
 yearly.7020.b:0 "AAAAAAAAAAARGGGHHHH!"
 yearly.7020.desc:0 "Com todas as formalidades pré-jogo cuidadas, tudo o que resta é iniciar o evento. O pregador da cidade, inclinando-se perigosamente para fora da janela do primeiro andar de uma casa com vista para a praça, passa a bexiga de porco pelo batente.\n\nA multidão olha expectante e, após uma breve pausa, a 'bola' toma voo.\n\nA corrida começa."
 yearly.7020.t:0 "O Belo Jogo: Início"
 yearly.7021.a.tt.lose:0 "Você não consegue se defender"
 yearly.7021.a.tt.win:0 "Você afasta a pedra!"
 yearly.7021.a:0 "Ei! Isso é ilegal!"
 yearly.7021.b:0 "EU VOU FAZER VOCÊ COMER ESSA PEDRA!"
 yearly.7021.c.tt.escape:0 "Você escapa ileso"
 yearly.7021.c.tt.escapefail:0 "Você não consegue escapar"
 yearly.7021.c:0 "Hora de sair daqui!"
 yearly.7021.desc:0 "O chamado 'jogo' é muito mais do que você havia imaginado. A reputação de violência não é injustificada, também.\n\nÀ sua esquerda, um[Select_CString( dummy_gender.IsFemale, 'a', '' )] [dummy_gender.GetWomanMan] tem outro em um estrangulamento improvisado, o par deles cambaleando passando por uma briga de punhos completa entre - aparentemente - quatro pessoas de uma só vez.\n\nConforme eu me afasto daquela briga em particular, outro morador - com os olhos selvagens por baixo de uma máscara de sangue escorrendo de um corte na testa - se aproxima de mim com uma pedra na mão."
 yearly.7021.t:0 "O Belo Jogo: Ataque de Pedras"
 yearly.7022.a:0 "Meu!"
 yearly.7022.b:0 "Ah, o amor jovem!"
 yearly.7022.c:0 "Ha! Vou mostrar a você como [Select_CString( ROOT.Char.IsFemale, 'uma verdadeira', 'um verdadeiro' )] [ROOT.Char.GetWomanMan] se parece!"
 yearly.7022.desc:0 "A equipe adversária tem a bola! O jogador que carrega a bola é um[Select_CString( dummy_gender.IsFemale, 'a', '' )] [dummy_gender.GetWomanMan] jovem bonit[Select_CString( dummy_gender.IsFemale, 'a', 'o' )] e, claramente, astut[Select_CString( dummy_gender.IsFemale, 'a', 'o' )] também; depois de garantir a bola, [dummy_gender.GetSheHe] está no processo de escalar uma casa para escapar da multidão que ruge abaixo.\n\nEmbora o plano [dummy_gender.GetHerHim] inicialmente pareça à prova d'água, parece que [dummy_gender.GetSheHe] não contou com seu desejos básicos: enquanto eu me puxo para o nível [dummy_gender.GetHerHim] na fachada da casa, [dummy_gender.GetSheHe] está claramente distraíd[Select_CString( dummy_gender.IsFemale, 'a', 'o' )] por um[Select_CString( same_gender.IsFemale, 'a', '' )] [same_gender.GetWomanMan] particularmente cativante na janela.\n\nOs dois parecem bastante apaixonados um pelo outro. Estou a apenas um braço de distância..."
 yearly.7022.t:0 "O Belo Jogo: Uma Bela Espectadora"
 yearly.7023.a:0 "...e dou um soco no rosto [dummy_clergy_gender.GetHerHim]."
 yearly.7023.b:0 "...e me afasto. Deixe alguém lidar com [dummy_clergy_gender.GetSheHe]."
 yearly.7023.desc:0 "A bexiga de porco está solta! Um par de mãos nervosas a deixa cair, e ela quica uma vez antes de ser agarrada por... um membro dos [ROOT.Char.GetFaith.AltPriestTermPlural]?\n\n[dummy_clergy_gender.GetSheHe|U] sorri e tropeça para a frente, a multidão se afastando incerta diante [dummy_clergy_gender.GetHerHim]. Ninguém tem certeza do que pensar dessa pessoa sagrada jogando um jogo tão violento e, além disso, aparentemente se safando com isso!\n\nEu dou um passo à frente com dúvidas..."
 yearly.7023.t:0 "O Belo Jogo: A Mão de [ROOT.Char.GetFaith.HighGodName]"
 yearly.7024.a:0 "Vou pagar pelas reformas!"
 yearly.7024.b:0 "Tudo é justo no amor e no futebol!"
 yearly.7024.desc:0 "A multidão avança e se choca contra as paredes de uma casa próxima como uma onda. À medida que o grupo recua das paredes, várias pessoas se agarram a qualquer saliência que podem enquanto outras tentam arrancá-las para chegar até o portador da bola.\n\nO som de madeira estilhaçando e caindo ecoa pela praça do mercado, e à medida que a multidão recua, várias seções do telhado de palha da casa desabam no chão."
 yearly.7024.t:0 "O Belo Jogo: Palha do Feno"
 yearly.7030.a:0 "Eu-... o que-... #EMP juiz!#!"
 yearly.7030.b.lose:0 "Você perde o trambiqueiro"
 yearly.7030.b.win:0 "Você pega o trapaceiro"
 yearly.7030.b:0 "Trapaceiro! Eu vou pegá-lo!"
 yearly.7030.c:0 "Oh, bom ver que ele se recuperou rapidamente!"
 yearly.7030.desc:0 "Conforme o jogo continua, cada vez mais moradores têm que desistir. Alguém cambaleia por mim, com hematomas já evidentes na cabeça.\n\nDe repente, mais um homem do grupo cai aos meus pés com um grito ensurdecedor. O barulho é suficiente para distrair até mesmo os participantes, e tanto a multidão quanto eu damos um passo para trás longe de sua agonia - embora eu poderia jurar que vi um olho se abrir lá...\n\nNo momento em que a luz do dia mostra através da multidão, o homem 'ferido' salta para os pés e pega a bola, correndo na minha direção pela praça!"
 yearly.7030.t:0 "O Belo Jogo: Nunca Uma Penalidade"
 yearly.7031.a.lose:0 "Eles chutam suas canelas!"
 yearly.7031.a.win:0 "Você arranca os sapatos deles"
 yearly.7031.a:0 "Tire esses sapatos deles!"
 yearly.7031.b:0 "Eu gosto dos meus tornozelos do jeito que estão!"
 yearly.7031.c:0 "Que ideia inovadora..."
 yearly.7031.desc:0 "O jogo continua, e percebo que as fileiras da minha equipe começam a se reduzir. Vários participantes estão espalhados pela praça do mercado, todos eles cuidando de lesões no tornozelo. #EMP Lesões#! sérias no tornozelo, pelo que parece. Enquanto luto com aqueles ao meu redor, um brilho próximo ao chão chama minha atenção, e percebo com horror o que exatamente aconteceu com meus camaradas.\n\nAlgum morador especialmente sanguinário costurou pequenas lâminas em seus sapatos, e mesmo enquanto observo, eles as arrastam brutalmente nas canelas de outra pessoa. Considero avançar para confrontá-los."
 yearly.7031.t:0 "O Belo Jogo: Mordida no Tornozelo"
 yearly.7032.a:0 "Água refrescante! Perfeito!"
 yearly.7032.b:0 "Uma cerveja serviria bem!"
 yearly.7032.c:0 "Por acaso, vocês têm alguma [ROOT.Char.Custom('RegionalDrink')]?"
 yearly.7032.d:0 "Esses bolos de haxixe estão à venda?"
 yearly.7032.desc:0 "A multidão se inclina para o lado, me expulsando de suas profundezas com alguma força. Cambaleando até uma parede para recuperar minha orientação e meu fôlego, avisto um casal de comerciantes carregados com várias bebidas. Eles devem estar fazendo bons negócios, dado o quão árduo é esse trabalho!\n\nEu poderia fazer uso de algum sustento, acontece que estou com sede. Fico imaginando o que eles têm à venda?"
 yearly.7032.t:0 "O Belo Jogo: Intervalo para Bebidas"
 yearly.7033.a.lose:0 "A briga se intensifica"
 yearly.7033.a.win:0 "Você separa com sucesso os brigões"
 yearly.7033.a:0 "Tudo bem, acabem com isso!"
 yearly.7033.b:0 "Não estou a fim de interromper brigas triviais."
 yearly.7033.desc:0 "Lutar contra a oposição durante esses jogos é extremamente comum, mas é com alguma confusão que vejo o que parece ser dois dos meus companheiros de equipe lutando #EMP! entre si!#. Você reconhece ambos; um é o arqueiro local, o outro um tintureiro de têxteis. Os dois estão trancados em um combate feroz, tanto que seus companheiros de equipe começaram a notar.\n\nEssa disputa mesquinha está começando a amarrar porções significativas do meu time, e a massa de pessoas começa a se mover em direção ao lado da vila que estamos defendendo..."
 yearly.7033.t:0 "O Belo Jogo: Para Morrer de Rir"
 yearly.7040.a:0 "Nós... nós ganhamos?"
 yearly.7040.desc:0 "Conforme o dia avança, o vai e vem do jogo atinge o seu clímax. Ambos os lados avançam atrás da bola, e eu sou pego no meio de um desses redemoinhos no fluxo de pessoas.\n\nEu caio e me protejo, mas logo me ajoelho e percebo uma calma incomum tomando conta da praça do mercado.\n\nParece que o jogo acabou."
 yearly.7040.t:0 "O Belo Jogo: Placar Final"
 yearly.7041.a:0 "Que jogo emocionante!"
 yearly.7041.b:0 "Vou encomendar uma lembrança!"
 yearly.7041.desc.ending:0 "a se afastar da área, mas a festa está apenas começando para os vencedores. Um grande barril de [ROOT.Char.Custom('RegionalDrink')] já tomou o centro do palco, e as bebidas estão fluindo livremente para comemorações que certamente durarão até a noite."
 yearly.7041.desc:0 "Meu time me ergue até ficar de pé, e seus gritos fazem meu coração inchar até explodir! Não foi apenas uma vitória; foi uma #EMP surra#!, e você desempenhou um papel significativo nisso!\n\nNossos oponentes começam "
 yearly.7041.t:0 "O Belo Jogo: Vitória Gloriosa!"
 yearly.7042.a:0 "Que jogo emocionante!"
 yearly.7042.b:0 "Vou encomendar uma lembrança!"
 yearly.7042.desc:0 "Eu me levanto cambaleando e tento focar com a visão embaçada, enquanto as pessoas passam ao meu redor. No centro da praça, um grupo está comemorando; leva vários segundos para eu perceber que eles são realmente do meu time!\n\nNossos oponentes começam "
 yearly.7042.t:0 "O Belo Jogo: Vitória!"
 yearly.7043.a:0 "Ah, tudo bem. Nós os pegaremos na próxima vez!"
 yearly.7043.desc:0 "Me levanto cambaleando e me vejo cercado por multidões de pessoas. A diferença parece ser a urgência nos movimentos de todos, já que os jogadores parecem se afastar sem ânimo da área.\n\nCom o sol baixando no céu, parece que o jogo acabou, sem um resultado decisivo alcançado."
 yearly.7043.t:0 "O Belo Jogo: Empate"
 yearly.7044.a:0 "Parabéns aos vencedores!"
 yearly.7044.b:0 "Bah! Deveríamos ter ganhado!"
 yearly.7044.c:0 "Eu mereço um troféu de qualquer forma!"
 yearly.7044.desc:0 "Eu me levanto cambaleando e tento focar com a visão embaçada, enquanto as pessoas passam ao meu redor. No centro da praça, um grupo está comemorando; leva vários segundos para eu perceber que... são os membros da equipe adversária.\n\nMeu time começa "
 yearly.7044.t:0 "O Belo Jogo: Derrota!"
 yearly.7045.a:0 "Parabéns aos vencedores!"
 yearly.7045.b:0 "Bah! Deveríamos ter ganhado!"
 yearly.7045.c:0 "Eu mereço um troféu de qualquer forma!"
 yearly.7045.desc:0 "Pés esmagadores ecoam ao passar, e eu me esforço para ficar de pé para entender por quê. A uma curta distância na praça, o time adversário ergue a bola triunfante e comemora. Não é apenas uma derrota; é uma completa demolição.\n\nMeu time começa "
 yearly.7045.t:0 "O Belo Jogo: Derrota Avassaladora!"
 yearly.7050.a.flavor:0 "Que ideia intrigante."
 yearly.7050.a:0 "Onde está o... buraco?"
 yearly.7050.a_paranoid:0 "Preciso saber mais."
 yearly.7050.b.flavor:0 "[unfortunate_soul.GetShortUIName] deve estar delirando."
 yearly.7050.b:0 "Isso é um absurdo."
 yearly.7050.c:0 "Pare de desperdiçar meu tempo!"
 yearly.7050.desc:0 "Encontro [unfortunate_soul.GetTitledFirstName] no corredor, encarando fixamente a parede. Curios[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], pergunto o que [unfortunate_soul.GetSheHe] está fazendo.\n\nO olhar [unfortunate_soul.GetHerHim] se volta para mim com um movimento ameaçador: \"Havia um buraco aqui, sabia?\" [unfortunate_soul.GetTitledFirstNameNoTooltip] exclama com firme convicção.\n\nOlho para a parede em frente [unfortunate_soul.GetSheHe], incapaz de encontrar qualquer vestígio do buraco a que [unfortunate_soul.GetSheHe] se refere."
 yearly.7050.t:0 "Buraco Onde?"
 yearly.7051.a.flavor:0 "Você aceita a responsabilidade."
 yearly.7051.a:0 "É tudo culpa minha..."
 yearly.7051.b:0 "Eles mereceram. TODOS eles."
 yearly.7051.b_conviction.desc:0 "Você consegue se convencer disso."
 yearly.7051.b_unconvinced.desc:0 "Você tem um colapso."
 yearly.7051.desc:0 "O nevoeiro é tão denso que poderia ser cortado com uma faca, e olho ao redor em uma tentativa frágil de me orientar. Já estive aqui antes? Isso é um... campo de batalha?\n\nMinhas mãos tremem enquanto tento entender a situação e dou alguns passos à frente. Consigo ouvir um som ao longe; uma voz chamando: \"Você viu um garotinho?\"\n\nDe repente, começo a distinguir rostos no nevoeiro. São aquelas... pessoas que matei? Eles parecem congelados em uma expressão de terror."
 yearly.7051.t:0 "Colina Enevoada"
 yearly.7052.a:0 "Foi apenas um sonho ruim."
 yearly.7052.a_positive:0 "Que sonho estranho."
 yearly.7052.desc:0 "Acordo, surpreendentemente seren[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. Foi um sonho interessante — embora não particularmente agradável, já tive sonhos piores em minha vida.\n\nReflito cuidadosamente sobre o conteúdo do sonho e então viro para o outro lado, logo caindo novamente em um sono relaxante."
 yearly.7052.desc_unconvinced:0 "Acordo, banhad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] em suor. Se não foi o — pior — sonho que já tive, certamente está entre os piores em minha memória recente.\n\nMinhas mãos ainda tremem do estresse causado pelo sonho, enquanto recordo seus conteúdos. \"Certamente as coisas não podem ficar muito piores do que isso\", murmuro, enquanto me viro numa tentativa patética de voltar a dormir."
 yearly.7052.t:0 "Como um Sonho"
 yearly.7053.a:0 "O zelador deve saber mais sobre isso."
 yearly.7053.b:0 "Acho que vejo algo..."
 yearly.7053.b_pouch.desc:0 "Você puxa um saco de moedas de ouro do buraco."
 yearly.7053.b_scratch.desc:0 "Algo arranha seu braço."
 yearly.7053.desc:0 "O corredor está banhado pela luz do dia enquanto sigo em direção à cozinha. De repente, pelo canto do olho — há um #EMP buraco#! na parede.\n\nCongelo enquanto encaro o buraco com um olhar curioso, mas crítico. Não é um buraco grande, talvez do tamanho de um braço. Mas é completamente escuro.\n\nAproximo-me com cuidado do buraco e tento espiar para dentro, confus[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] quanto à sua origem e propósito."
 yearly.7053.t:0 "Que Buraco é Esse?"
 yearly.7054.a.flavor:0 "Percebo o servo, agora cauteloso, me observando."
 yearly.7054.a.flavor_pouch:0 "Seguro o saco firmemente."
 yearly.7054.a.flavor_scratch:0 "A queimadura emanando do arranhão no meu braço intensifica-se."
 yearly.7054.a:0 "... Devo ter imaginado coisas."
 yearly.7054.desc:0 "Lembro vagamente de algo sobre uma conversa que deveria ter com o zelador... sobre um buraco?"
 yearly.7054.desc_pouch:0 "Ainda em minha mão, aperto o saco com ouro que consegui puxar do... buraco?"
 yearly.7054.desc_scratch:0 "Há uma sensação de queimação no meu braço; o mesmo que coloquei no... buraco?"
 yearly.7054.intro:0 "Sou despertad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com cuidado por um dos servos. [7054_servant.GetSheHe|U] me olha ansiosamente e exclama: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Você está bem?\" enquanto olho ao redor do corredor, atordoad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )].\n\nDesmaiei?"
 yearly.7054.outro:0 "\n\nLevantando-me apressadamente, encaro a parede. \"Havia um buraco aqui\", murmuro enquanto meu olhar percorre as paredes brilhantes do corredor."
 yearly.7054.t:0 "Um Despertar Brusco"
 yearly.7055.a:0 "Aqui, cachorro."
 yearly.7055.b.flavor:0 "O cachorro olha para você com tristeza nos olhos."
 yearly.7055.b:0 "Vá #EMP embora#!, seu cachorro sarnento!"
 yearly.7055.desc:0 "Enquanto cruzo o pátio, um vira-lata aparece do nada e para bem na minha frente. Alguns pedaços estranhos de metal estão presos ao seu colar.\n\nO cachorro me olha de forma expectante enquanto olho para seus olhos castanhos, ligeiramente irritad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com a interrupção. Minha irritação rapidamente desaparece, porém, e tenho a estranha sensação de que o cachorro está controlando... coisas?\n\nEstou realmente perdendo a sanidade, penso, enquanto seguro o colar do cachorro e removo os pedaços ridículos de metal. Quando me viro para ir embora, o cachorro me olha com firmeza. Acho que... ele agora é meu?"
 yearly.7055.t:0 "Um Abrigo para um Cão"
