l_spanish:
 buzzed_peasants_county_modifier:0 "Plebeus Satisfeitos"
 buzzed_peasants_county_modifier_desc:0 "Os plebeus deste condado estão bastante satisfeitos com as recentes festividades."
 criminal_family_dynasty_modifier:0 "Dinastia Desonrada"
 criminal_family_dynasty_modifier_desc:0 "Essa dinastia foi manchada pelas ações de um de seus membros."
 cultural_suspicion_modifier:0 "Suspeita Cultural"
 cultural_suspicion_modifier_desc:0 "Este personagem não é muito fã dos estrangeiros em seu reino."
 hunt_success_chance.mpo_daydreaming_birds_modifier:0 "[GetModifier('mpo_daydreaming_birds_modifier').GetNameWithTooltip]"
 kumi_tax_modifier:0 "Imposto sobre Bebidas"
 kumi_tax_modifier_desc:0 "Este personagem aproveitou uma oportunidade lucrativa de negócios apresentada a eles em um recente banquete."
 lover_masked_activity:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUIName] se tornaram amantes devido a um surpreendente acontecimento durante uma atividade."
 lover_masked_activity_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] e [CHARACTER.GetShortUIName] se tornaram amantes devido a um surpreendente acontecimento durante uma atividade."
 mpo_ariana_0050_greedy:0 "rapaz"
 mpo_ariana_0050_scheming:0 "maquiavélico"
 mpo_child_herder_modifier:0 "Pastor Destinado"
 mpo_child_herder_modifier_desc:0 "Este personagem passou um tempo nos pastos, e adquiriu algumas habilidades de um pastor."
 mpo_daydreaming_birds_modifier:0 "Sonhando Acordado com Pássaros"
 mpo_daydreaming_birds_modifier_desc:0 "Este personagem não é estranho à visão dessas criaturas aladas e graciosas.\n[hunt_success_chance|E] de $hunt_type_falconry$: #P +5%#!"
 mpo_destined_leader_modifier:0 "Líder Destinado"
 mpo_destined_leader_modifier_desc:0 "Superando as normas de gênero de sua cultura, este personagem demonstrou ser um líder capaz."
 mpo_diverse_warriors_modifier:0 "Guerreiros Diversos"
 mpo_diverse_warriors_modifier_desc:0 "Este personagem mostrou que guerreiros vêm em todas as formas e tamanhos.\nCusto de Reforma da [martial_custom|E]: #p -50%#!"
 mpo_diverse_warriors_modifier_value_desc:0 "[GetModifier('mpo_diverse_warriors_modifier').GetNameWithTooltip]"
 mpo_events_ariana.0001.a:0 "Uma boa águia vale a escalada."
 mpo_events_ariana.0001.a_lose_bad:0 "Você falha ao capturar os filhotes e sofre uma pequena queda na montanha"
 mpo_events_ariana.0001.a_lose_ok:0 "Você falha ao capturar os filhotes, mas sai ileso"
 mpo_events_ariana.0001.a_tt:0 "Você escala a montanha e tenta capturar os filhotes à força"
 mpo_events_ariana.0001.a_win:0 "Você consegue capturar um filhote, ou ambos"
 mpo_events_ariana.0001.a_win_desc:0 "O destino de um filhote, ou ambos, está em suas mãos"
 mpo_events_ariana.0001.b:0 "Se for para ser, eles virão até mim."
 mpo_events_ariana.0001.b_win_desc:0 "Um filhote, ou ambos, voa até você"
 mpo_events_ariana.0001.c:0 "Um sinal certeiro."
 mpo_events_ariana.0001.desc:0 "No caminho de volta para o acampamento, avisto um pequeno ninho, embora nenhum pássaro esteja à vista. É feito de gravetos e capim, e parece estar em boas condições.\n\nAo inspecionar mais de perto, vejo dois filhotes de águia dentro, grandes o suficiente para sobreviverem sem a mãe por um tempo, mas ainda jovens demais para longas jornadas pelo horizonte. A oportunidade de"
 mpo_events_ariana.0001.desc_ending:0 "levar uma como companheira é boa demais para ser ignorada."
 mpo_events_ariana.0001.desc_had_story:0 "ter uma águia como companheira mais uma vez é tentadora, mas devo ser cauteloso, pois sei o quão voláteis essas criaturas podem ser."
 mpo_events_ariana.0001.desc_has_eagle:0 "capturar uma, talvez como presente, se apresenta."
 mpo_events_ariana.0001.t:0 "Avistamento de Ninho"
 mpo_events_ariana.0002.a:0 "É belo, e é meu."
 mpo_events_ariana.0002.b:0 "[eagle_first_recipient.GetFirstNameNoTooltip] pode gostar de tal criatura."
 mpo_events_ariana.0002.b_two:0 "Vou ficar com um e dar o outro para [eagle_first_recipient.GetFirstNameNoTooltip]."
 mpo_events_ariana.0002.c:0 "Acho que [eagle_second_recipient.GetFirstNameNoTooltip] preferiria tê-la."
 mpo_events_ariana.0002.c_two:0 "Um é meu, e talvez [eagle_second_recipient.GetFirstNameNoTooltip] queira o outro?"
 mpo_events_ariana.0002.d:0 "[eagle_first_recipient.GetFirstNameNoTooltip] e [eagle_second_recipient.GetFirstNameNoTooltip] merecem ambos um presente assim."
 mpo_events_ariana.0002.desc_both_lure:0 "Divido a carne em dois, oferecendo-a a cada um deles. Eles grasnam em uníssono, e não consigo evitar um sorriso com a cena."
 mpo_events_ariana.0002.desc_both_standard:0 "Agarro-os do ninho e consigo enrolar ambos em um pano, cobrindo seus olhos. Eles me pesam, mas nenhum caçador lendário de águias esteve livre de seus fardos."
 mpo_events_ariana.0002.desc_intro:0 "Os filhotes de águia ficam inquietos. Sua partida do ninho será comigo, ou com outro predador.\n\n"
 mpo_events_ariana.0002.desc_lure:0 "Segurando um pedaço de carne na mão, chamo os filhotes até mim. Eles grasnam em resposta, e posso vê-los se animando com curiosidade, mesmo à distância.\n\n"
 mpo_events_ariana.0002.desc_one_lure:0 "Apenas um vem até mim, o outro talvez prefira a segurança do ninho. Pego o filhote nos braços e, com seu apetite voraz, ele começa a devorar minha oferta."
 mpo_events_ariana.0002.desc_one_standard:0 "Meu pé escorrega na grama, mas consigo me segurar. Um dos filhotes nota minha luta e começa a grasnar, se assustando e voando para longe. [ROOT.Char.Custom('CulturalCurse')|U]! Embora eu não tenha conseguido os dois, um é melhor do que voltar de mãos vazias."
 mpo_events_ariana.0002.desc_standard:0 "Seguindo o ninho, minha descida é lenta e cuidadosa. Esses filhotes ainda são jovens demais para voar longe, mas não jovens demais para serem perigosos.\n\n"
 mpo_events_ariana.0002.e:0 "Um será meu companheiro, e o outro me trará algumas moedas."
 mpo_events_ariana.0002.e_sell_first:0 "[eagle_first_recipient.GetFirstNameNoTooltip] vai gostar de um, e meus bolsos do outro."
 mpo_events_ariana.0002.e_sell_second:0 "Um para o mercado, e um para [eagle_second_recipient.GetFirstNameNoTooltip]."
 mpo_events_ariana.0002.e_tt:0 "Você troca o outro filhote por algo"
 mpo_events_ariana.0002.f_one:0 "Vai render um bom preço."
 mpo_events_ariana.0002.f_tt:0 "Você troca o filhote por algo"
 mpo_events_ariana.0002.f_tt_two:0 "Você troca os filhotes por algo"
 mpo_events_ariana.0002.f_two:0 "Eles vão render um bom preço."
 mpo_events_ariana.0010.a:0 "Você não estará sozinho, [converting_heir.GetFirstNameNoTooltip]."
 mpo_events_ariana.0010.a_failure:0 "Você cai e falha em alcançar o ninho"
 mpo_events_ariana.0010.a_zealous:0 "Talvez eu esteja sendo severo demais, e [converting_heir.GetSheHe] esteja certo."
 mpo_events_ariana.0010.b.tt:0 "Você se converte a [new_faith.GetName], mas secretamente continua a praticar [old_faith.GetName]."
 mpo_events_ariana.0010.b:0 "Em tudo, exceto no nome, eu sou [old_faith.GetAdherentNameNoTooltip]."
 mpo_events_ariana.0010.b_failure:0 "Você assusta a águia e falha em alcançar o ninho"
 mpo_events_ariana.0010.b_zealous:0 "Vou lhe dar atenção dessa vez, [converting_heir.GetFirstNameNoTooltip]."
 mpo_events_ariana.0010.c:0 "Desculpe, mas eu não posso fazer isso."
 mpo_events_ariana.0010.c_cynical:0 "Religião é uma questão pessoal, [converting_heir.GetFirstNameNoTooltip]."
 mpo_events_ariana.0010.c_zealous:0 "Eu jamais abandonaria [old_faith.GetName]!"
 mpo_events_ariana.0010.d:0 "Nenhum [new_faith.GetAdherentNameNoTooltip|U] verá [old_faith.PositiveAfterLife|U]."
 mpo_events_ariana.0010.d_failure:0 "[converting_heir.GetFirstNameNoTooltip] permanece firme em se tornar [new_faith.GetAdjectiveNoTooltip]"
 mpo_events_ariana.0010.d_success:0 "[converting_heir.GetFirstNameNoTooltip] reconsidera a conversão"
 mpo_events_ariana.0010.d_tt:0 "Você tenta convencer [converting_heir.GetNameNoTooltip] a permanecer [old_faith.GetAdjective]."
 mpo_events_ariana.0010.desc:0 "\"[converting_heir.Custom2('RelationToMe', ROOT.Char)|U],\" minha [ROOT.Char.Custom2('RelationToMeShort', converting_heir)] [converting_heir.GetName] sussurra, me chamando para perto. \"[new_faith.HighGodName|U] me mostrou o caminho,\" [converting_heir.GetSheHe] continua. \n\n\"E agora sigo [new_faith.GetName]. Eu senti isso por tanto tempo, e não podia deixar isso apodrecer. Sei que você tem suas dúvidas, mas peço que se junte a mim e aos muitos outros [new_faith.GetAdherentNamePluralNoTooltip] no [ROOT.Char.GetPrimaryTitle.GetTierAsName]. Eu te ajudarei a aprender a viver a vida de um verdadeiro [new_faith.GetAdherentNameNoTooltip], e juntos alcançaremos [new_faith.PositiveAfterLife].\"\n\n[converting_heir.GetSheHe|U] me olha com grande fervor nos olhos, e segura minha mão, aguardando minha resposta."
 mpo_events_ariana.0010.desc_zealous:0 "Será que [converting_heir.GetFirstNameNoTooltip] está me zombando? Como [converting_heir.GetSheHe] pode acreditar que eu um dia serei um [new_faith.GetAdherentNameNoTooltip]?!"
 mpo_events_ariana.0010.failure:0 "Você falha em alcançar o ninho"
 mpo_events_ariana.0010.t:0 "O Fogo Dentro"
 mpo_events_ariana.0020.a:0 "Você está certo, [worried_spouse.GetFirstNameNoTooltip]. [sus_councillor.GetSheHe|U] estará fora até amanhã!"
 mpo_events_ariana.0020.a_tt:0 "Todos [vassals|E] [councillor_culture.GetName]:\n$EFFECT_LIST_BULLET$Perderão #n 10#! [opinion|E] sobre #V você#!"
 mpo_events_ariana.0020.b:0 "Suponho que eu poderia ser mais cauteloso com esses [councillor_culture.GetCollectiveNounNoTooltip]."
 mpo_events_ariana.0020.c:0 "Não há nada de errado com [sus_councillor.GetSheHe] ou qualquer [councillor_culture.GetNameNoTooltip]."
 mpo_events_ariana.0020.c_paranoid:0 "Não serei influenciado pela sua paranoia."
 mpo_events_ariana.0020.c_tt:0 "Todos [vassals|E] [councillor_culture.GetName]:\n$EFFECT_LIST_BULLET$Ganharão #p 10#! [opinion|E] sobre #V você#!"
 mpo_events_ariana.0020.desc_end:0 "Embora as atitudes de [worried_spouse.GetFirstNamePossessiveNoTooltip] pareçam excessivas, é sabido que alguns [councillor_culture.GetCollectiveNounNoTooltip] [sus_councillor.Custom('mpo_yearly_ethos')]\n\n\"Por favor...\" [worried_spouse.GetSheHe] lamenta, \"Eu imploro, não permita que [sus_councillor.GetSheHe] continue seus [sus_councillor.Custom2('InsultBehavior', SCOPE.sC('worried_spouse'))] nos nossos salões. Não se sabe o que [sus_councillor.GetSheHe] pode fazer.\""
 mpo_events_ariana.0020.desc_intro:0 "[worried_spouse.GetName] irrompe na minha câmara e exclama, \"Você sabia que [sus_councillor.GetName] é um [councillor_culture.GetName]?\"\n\nAntes que eu possa começar a formular uma resposta, [worried_spouse.GetSheHe] interrompe, \"Não consigo imaginar"
 mpo_events_ariana.0020.desc_marshal:0 "qualquer exército meu sendo liderado por um [councillor_culture.GetNameNoTooltip], pois preferiria muito mais estar no lado oposto do campo de batalha. E ainda assim, [sus_councillor.GetSheHe] circula pelos nossos campos de treino?\""
 mpo_events_ariana.0020.desc_spymaster:0 "permitir que qualquer [councillor_culture.GetNameNoTooltip] ardiloso faça parte do meu círculo, muito menos tenha acesso à nossa espionagem. Eu confiaria mais em uma cobra do que n[sus_councillor.GetSheHe].\""
 mpo_events_ariana.0020.t:0 "Nada Confiável"
 mpo_events_ariana.0030.desc:0 "\"As tigelas de [Glossary( 'kumis', 'KUMIS_GLOSS')] em nosso encontro estão bem secas, minha [ROOT.Char.GetTitleAsNameNoTooltip]...\" reclama [spymaster.GetName]. \"Mas pelo menos sei quem é o responsável por esta seca.\" [spymaster.GetSheHe|U] aponta para [bartender.GetName], que é visto trocando um copo do leite fermentado de égua por outro plebeu.\n\n\"Certamente você não vai deixar nossos convidados serem privados de sua bebida, vai? Afinal, foram especialmente preparadas para os grandes senhores e senhoras de [ROOT.Char.GetPrimaryTitle.GetNameNoTier].\" [spymaster.GetSheHe] pergunta, um sorriso astuto no rosto [spymaster.GetHerHim]."
 mpo_events_ariana.0030.greedy:0 "Convidados? Eles podem beber água."
 mpo_events_ariana.0030.greedy_tt:0 "Você pega uma parte dos lucros de [bartender.GetNameNoTooltip] para si mesmo."
 mpo_events_ariana.0030.ignore:0 "Deixe os plebeus beberem!"
 mpo_events_ariana.0030.ignore_effect:0 "Você permite que [bartender.GetNameNoTooltip] continue servindo os plebeus."
 mpo_events_ariana.0030.ignore_tt:0 "Todo [Concept('activity_attending', 'Participante')|E] de uma [Concept('dynasty', 'Dinastia Nobre')|E]:\n$EFFECT_LIST_BULLET$Perderá #n 10#! [opinion|E] sobre #V você#!"
 mpo_events_ariana.0030.ignore_tt_lowborn:0 "Todo [lowborn|E] [Concept('activity_attending', 'Participante')|E]:\n$EFFECT_LIST_BULLET$Ganhará #p 10#! [opinion|E] sobre #V você#!"
 mpo_events_ariana.0030.jail:0 "Vamos ver quanto [bartender.GetSheHe] pode fazer a partir de uma cela."
 mpo_events_ariana.0030.jail_effect:0 "Você pune [bartender.GetNameNoTooltip] por sua transgressão."
 mpo_events_ariana.0030.jail_tt:0 "Todo [Concept('activity_attending', 'Participante')|E] de uma [Concept('dynasty', 'Dinastia Nobre')|E]:\n$EFFECT_LIST_BULLET$Ganhará #p 10#! [opinion|E] sobre #V você#!"
 mpo_events_ariana.0030.t:0 "Bebidas Proibidas"
 mpo_events_ariana.0040.a:0 "Estou me sentindo aventureir[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]..."
 mpo_events_ariana.0040.a_tt:0 "Você aceita o convite [masked_guest.GetHerHim]"
 mpo_events_ariana.0040.b:0 "Vou passar dessa vez."
 mpo_events_ariana.0040.desc_camp_party:0 "O acampamento está vivo com o som de música e risadas, e [talker.GetName] sugere que joguemos uma partida de esconde-esconde. Quase não consigo conter o riso com a ideia, mas percebo que [talker.GetSheHe] está falando sério. Logo me vejo escondido atrás de uma tenda. Quando passos se aproximam, eu saio correndo de meu esconderijo, indo mais fundo na floresta. Talvez o meu estado de embriaguez tenha me feito perder o controle, mas me vejo perdido na mata, e a noite está escura. Logo, esbarro em outra pessoa e ouço um suspiro de alívio. \"Ah, achei que fosse o único perdido\", [masked_guest.GetSheHe] diz, ofegante, \"Deveríamos ficar juntos, não acha?\"\n\nApós algum tempo vagando, nos encontramos imersos em uma conversa que vai além das usualidades. Algo me atrai para [masked_guest.Custom('WomanManGirlBoy')], embora o rosto [masked_guest.GetHerHim] esteja oculto pela escuridão. [masked_guest.GetSheHe|U] me puxa para perto, e sugere que continuemos nossa aventura quando retornarmos ao acampamento."
 mpo_events_ariana.0040.desc_wedding_feast:0 "O salão está suavemente iluminado, o ar preenchido com risadas e o cheiro de [ROOT.Char.Custom('GetExpensiveMeal')]. A próxima parte da celebração envolve convidados e anfitriões se ocultando, com a premissa de mistério e emoção. Coloco cuidadosamente uma máscara, certificando-me de me esconder bem, e me junto aos outros convidados na dança e na alegria. À medida que as festividades continuam, me vejo atraído por uma figura misteriosa entre os convidados. [masked_guest.GetSheHe|U] está usando uma máscara intrincada representando um [ROOT.Char.Custom('GetRandomRegionalBird')]. [masked_guest.GetSheHe|U] me chama, e me vejo incapaz de resistir à atração.\n\nLogo, nossa conversa se torna mais sensual, e não posso deixar de sentir uma conexão que vai além da máscara. [masked_guest.GetSheHe|U] me puxa para um abraço quente, e insinua que devemos nos mover para um lugar mais privado."
 mpo_events_ariana.0040.title_camp_party:0 "Atrás da Tenda"
 mpo_events_ariana.0040.title_feast:0 "Um Banquete para Lembrar"
 mpo_events_ariana.0040.title_wedding:0 "Baile Nupcial"
 mpo_events_ariana.0041.a:0 "Aceito sua proposta..."
 mpo_events_ariana.0041.a_family:0 "Não há nada de errado em conhecer melhor meu familiar."
 mpo_events_ariana.0041.a_rival:0 "Um jogo perigoso, mas eu vou jogar."
 mpo_events_ariana.0041.a_rival_spouse:0 "Se não for para contrariar [masked_guest_spouse.GetFirstName]..."
 mpo_events_ariana.0041.b:0 "Venha até mim, [masked_guest.GetFirstNameNoTooltip]!"
 mpo_events_ariana.0041.b_family:0 "O laço entre nós é inquebrável!"
 mpo_events_ariana.0041.b_rival:0 "Unidos pelo ódio, agora no coração!"
 mpo_events_ariana.0041.b_rival_spouse:0 "Vou tirar tudo de [masked_guest_spouse.GetFirstName]!"
 mpo_events_ariana.0041.c:0 "Eu devo recusar..."
 mpo_events_ariana.0041.c_family:0 "[ROOT.Char.Custom2('RelationToMeShort', masked_guest)|U], esqueça que isso aconteceu!"
 mpo_events_ariana.0041.c_family_spouse:0 "Não posso fazer isso com [masked_guest_spouse.GetFirstName]!"
 mpo_events_ariana.0041.c_rival:0 "Isso não muda nada entre nós!"
 mpo_events_ariana.0041.c_spouse:0 "O que pensaria meu querido [ROOT.Char.GetPrimarySpouse.GetFirstName]?"
 mpo_events_ariana.0041.c_tt:0 "Você recusa os avanços de [masked_guest.GetFirstNamePossessiveNoTooltip]"
 mpo_events_ariana.0041.d:0 "Talvez devêssemos chamar uma trégua..."
 mpo_events_ariana.0041.d_failure:0 "Você e [masked_guest.GetFirstName] permanecem em desacordo"
 mpo_events_ariana.0041.d_success:0 "Você e [masked_guest.GetFirstName] concordam em deixar as diferenças de lado"
 mpo_events_ariana.0041.d_tt:0 "Você usa essa oportunidade para tentar fazer as pazes com [masked_guest.GetFirstNameNoTooltip]"
 mpo_events_ariana.0041.desc_camp_party:0 "Eu e [masked_guest.Custom('WomanManGirlBoy')] voltamos ao acampamento, e parece que o resto já se retirou para a noite. A fogueira se apagou devido à nossa ausência, e nos encontramos na escuridão mais uma vez. Pego uma lenha e a jogo na fogueira, e as chamas iluminam o rosto [masked_guest.GetHerHim]."
 mpo_events_ariana.0041.desc_family:0 "minha própria família, [masked_guest.GetName]..."
 mpo_events_ariana.0041.desc_family_outro:0 "Ouvir essas palavras virem do meu próprio [ROOT.Char.Custom2('RelationToMeShort', masked_guest)]...."
 mpo_events_ariana.0041.desc_family_spouse:0 "o cônjuge do meu familiar, [masked_guest.GetName]..."
 mpo_events_ariana.0041.desc_middle:0 "\n\nO que antes era leve e agridoce foi apagado com a tensão, quando percebo que quem está bem diante de mim é"
 mpo_events_ariana.0041.desc_outro:0 "Embora [masked_guest.GetSheHe] pareça tão surpreso quanto eu, [masked_guest.GetSheHe] rapidamente recupera a compostura. [masked_guest.GetSheHe|U] sorri de canto, e sussurra, \"Eu estava esperando por este momento, [ROOT.Char.GetFirstNameNoTooltip].\""
 mpo_events_ariana.0041.desc_rival:0 "o flagelo da minha existência, [masked_guest.GetName]!"
 mpo_events_ariana.0041.desc_rival_spouse:0 "o cônjuge do meu rival [masked_guest_spouse.GetName], [masked_guest.GetName]!"
 mpo_events_ariana.0041.desc_wedding_feast:0 "Eu e [masked_guest.Custom('WomanManGirlBoy')] saímos sorrateiramente da festa, e [masked_guest.GetSheHe] joga sua máscara no chão. A luz da lua filtra pela janela, lançando um brilho suave no rosto [masked_guest.GetHerHim]."
 mpo_events_ariana.0041.title:0 "Desembainado"
 mpo_events_ariana.0050.a:0 "Não posso deixar o nome da minha família ser manchado."
 mpo_events_ariana.0050.a_tt:0 "Você paga para limpar o nome de [criminal_family.GetFirstNamePossessiveNoTooltip]"
 mpo_events_ariana.0050.b:0 "[criminal_family.GetSheHe|U] enfrentará punição, não está em minhas mãos."
 mpo_events_ariana.0050.b_broke:0 "Parece que não tenho fundos para limpar o nome [criminal_family.GetHerHim]."
 mpo_events_ariana.0050.c:0 "Bobagem, posso acabar com esses rumores eu mesmo."
 mpo_events_ariana.0050.c_tt:0 "Você tenta limpar o nome de [criminal_family.GetFirstNamePossessiveNoTooltip]"
 mpo_events_ariana.0050.desc:0 "Sussurros e acusações envolvendo minha [ROOT.Char.Custom2('RelationToMeShort', criminal_family)] [criminal_family.GetName] têm se tornado cada vez mais preocupantes. Falam sobre o envolvimento de [criminal_family.GetHerHis] em uma recente série de furtos, e o povo começa a temer por sua segurança. Se [criminal_family.GetSheHe] foi pego em flagrante ou simplesmente corre o risco de ser ostracizado devido à natureza [criminal_family.Custom('mpo_ariana_0050_description')] de [criminal_family.GetHerHis], o povo está exigindo [criminal_family.GetHerHis] punição.\n\nCaso isso aconteça, [criminal_family.GetFirstNameNoTooltip] será despojado de suas terras, títulos e dignidade, sendo deixado para viver na vergonha, lançando uma grande sombra sobre os [ROOT.Char.GetDynasty.GetName]."
 mpo_events_ariana.0050.lose:0 "[criminal_family.GetFirstNameNoTooltip] está desonrado"
 mpo_events_ariana.0050.t:0 "Marcado"
 mpo_events_ariana.0050.win:0 "[criminal_family.GetFirstNameNoTooltip] é exonerado"
 mpo_events_ariana.0060.a:0 "Tenho certeza de que consigo subir lá."
 mpo_events_ariana.0060.a_tt:0 "Você tenta escalar o ninho para encontrar mais tesouros"
 mpo_events_ariana.0060.b:0 "Eu vou, mas você deve ficar quiet[Select_CString( appropriate_child.IsFemale, 'a', 'o' )]."
 mpo_events_ariana.0060.b_tt:0 "Você tenta alcançar o ninho sem perturbar a águia"
 mpo_events_ariana.0060.d:0 "Isso é legal, [appropriate_child.GetFirstNameNoTooltip]."
 mpo_events_ariana.0060.desc:0 "M[Select_CString( appropriate_child.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', appropriate_child)] [appropriate_child.GetName] corre até mim empolgad[Select_CString( appropriate_child.IsFemale, 'a', 'o' )], e antes que eu possa perguntar o que [Select_CString( appropriate_child.IsFemale, 'a', 'o' )] deixou tão agitad[Select_CString( appropriate_child.IsFemale, 'a', 'o' )], [appropriate_child.GetSheHe] coloca um pequeno objeto brilhante em minha mão. \"Olhe o que eu encontrei!\" [appropriate_child.GetSheHe] exclama. \"Caiu de um ninho de águia, e eu acho que é um tesouro!\"\n\nExaminei o objeto, e é realmente um pequeno enfeite dourado. Não vale muito, mas é claro que [appropriate_child.GetSheHe] está orgulhos[Select_CString( appropriate_child.IsFemale, 'a', 'o' )] de si mesm[Select_CString( appropriate_child.IsFemale, 'a', 'o' )].\n\n\"Você quer que eu te leve até o ninho?\" [appropriate_child.GetSheHe] pergunta. \"Pode haver mais lá.\""
 mpo_events_ariana.0060.success:0 "Você consegue alcançar o ninho com sucesso"
 mpo_events_ariana.0060.success_tt:0 "Você encontra um estoque de tesouros dentro"
 mpo_events_ariana.0060.t:0 "Ninho de Tesouros"
 mpo_events_ariana.0070.a:0 "Vou pegar o tesouro que vim buscar."
 mpo_events_ariana.0070.a_good:0 "A bolsa contém algumas moedas e enfeites"
 mpo_events_ariana.0070.a_great:0 "A bolsa está cheia de ouro e joias"
 mpo_events_ariana.0070.a_none:0 "Você não encontra nada de valor"
 mpo_events_ariana.0070.a_trinket:0 "Você encontra um enfeite misterioso"
 mpo_events_ariana.0070.a_tt:0 "Você abre a bolsa"
 mpo_events_ariana.0070.b:0 "Este filhote de águia será o prêmio."
 mpo_events_ariana.0070.b_child:0 "Você dá o filhote de águia para [appropriate_child.GetFirstNameNoTooltip]"
 mpo_events_ariana.0070.b_self:0 "Você leva o filhote de águia consigo"
 mpo_events_ariana.0070.c:0 "Isso é seu também, [appropriate_child.GetFirstNameNoTooltip]."
 mpo_events_ariana.0070.c_none_tt:0 "Você devolve o tesouro original de [appropriate_child.GetFirstNamePossessive]"
 mpo_events_ariana.0070.c_tt:0 "Você abre a bolsa e compartilha o conteúdo com [appropriate_child.GetFirstNameNoTooltip]"
 mpo_events_ariana.0070.d:0 "Devemos respeitar o lar da águia."
 mpo_events_ariana.0070.d_tt:0 "Você sai de mãos vazias"
 mpo_events_ariana.0070.desc:0 "Chego ao ninho e encontro um filhote de águia dentro, junto com uma pequena bolsa. \"Ah, é de onde veio o tesouro.\" sussurra [appropriate_child.GetFirstName]. [appropriate_child.GetFirstNameNoTooltip] me olha com os olhos arregalados, e consigo ver sua mente trabalhando.\n\n\"Onde está a mãe da águia?\" [appropriate_child.GetSheHe] pergunta. \"Devemos sair antes que ela volte.\" Concordo com a cabeça, mas antes de partir, vou ver o que posso levar comigo."
 mpo_events_ariana.0080.a:0 "Traga essa árvore até mim."
 mpo_events_ariana.0080.a_tt:0 "Você manda [tree_lover.GetFirstNameNoTooltip] procurar pela árvore mágica e trazê-la até você"
 mpo_events_ariana.0080.b:0 "Vou ver isso por mim mesmo."
 mpo_events_ariana.0080.b_arrogant:0 "Eu não preciso de ninguém para encontrar uma simples planta para mim."
 mpo_events_ariana.0080.b_tt:0 "Você parte para [tree_barony.GetName], para encontrar a árvore mágica por conta própria"
 mpo_events_ariana.0080.c:0 "Por que perder tempo com um conto de fadas?"
 mpo_events_ariana.0080.c_flavor:0 "Você não dá atenção ao blá-blá-blá de [tree_lover.GetFirstNamePossessive]"
 mpo_events_ariana.0080.c_sus:0 "[tree_lover.GetFirstNameNoTooltip] está tentando me enganar!"
 mpo_events_ariana.0080.desc:0 "\"[ROOT.Char.GetTitledFirstName], m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [tree_lover.Custom2('RelationToMeShort', ROOT.Char)], você precisa ouvir isso!\" exclama [tree_lover.GetName], me chamando para ir até lá.\n\n\"Ouvi falar de uma árvore que é diferente de todas as outras. Dizem que ela possui propriedades especiais, e até mesmo que é abençoada por [ROOT.Char.GetFaith.HighGodName] para conceder desejos. Acredito que chegou a hora de procurarmos por ela e ver se as lendas são verdadeiras. Ela está em [tree_barony.GetName], caso isso desperte seu interesse.\"\n\n[tree_barony.GetNameNoTooltip]? Essa é uma jornada e tanto, mas se houver uma chance de que essa árvore seja real, eu preciso saber."
 mpo_events_ariana.0080.t:0 "Uma Árvore Mágica"
 mpo_events_ariana.0081.a:0 "Eu desejo que minhas terras e minha linhagem prosperem."
 mpo_events_ariana.0081.b:0 "Eu desejo a força para superar meus inimigos."
 mpo_events_ariana.0081.c:0 "Eu desejo sabedoria, e uma mente clara."
 mpo_events_ariana.0081.desc:0 "[tree_lover.GetSheHe|U] aparece diante de mim com um grande sorriso no rosto. [tree_lover.GetSheHe|U] me conduz até o meu pátio, onde uma árvore recém-plantada se ergue alta e orgulhosa.\n\n"
 mpo_events_ariana.0081.desc_dead:0 "[tree_giver.GetName] aparece diante de mim com uma expressão sombria. [tree_giver.GetSheHe|U] me conduz até o meu pátio, onde uma árvore recém-plantada se ergue alta e orgulhosa. \"[tree_lover.GetName] estava certo\", diz [tree_giver.GetSheHe], \"mas gostaria que [tree_lover.GetSheHe] pudesse te apresentar pessoalmente.\"\n\n"
 mpo_events_ariana.0081.desc_guy:0 "Já faz um tempo desde que falei com [tree_lover.GetName]. Encontro-me pensando frequentemente n[tree_lover.GetSheHe], e me pergunto se [tree_lover.GetSheHe] encontrou a árvore de que [tree_lover.GetSheHe] falou. Justo quando estou prestes a dispensar o pensamento,"
 mpo_events_ariana.0081.desc_outro:0 "Fico maravilhado com a visão, se não apenas porque a lenda acabou sendo verdadeira. Suas folhas brilham ao sol, caindo graciosamente no chão. A luz que passa pelos galhos pinta minha pele, e no meio da minha admiração, penso novamente em [tree_lover.GetFirstNameNoTooltip], e recordo da suposta habilidade da árvore de conceder desejos. Fecho os olhos e faço um pedido silencioso."
 mpo_events_ariana.0081.desc_self:0 "Cheguei a [tree_barony.GetName], o lugar de que [tree_lover.GetFirstName] falou. Encontro-me em um clareira, onde uma árvore emite uma suave luz dourada."
 mpo_events_ariana.0081.failure:0 "Seu desejo não foi atendido"
 mpo_events_ariana.0081.success:0 "Seu desejo foi concedido"
 mpo_events_ariana.0081.wish:0 "Você faz o seu pedido"
 mpo_events_ariana.0090.a:0 "É sábio conhecer os caminhos de um pastor."
 mpo_events_ariana.0090.a_flavor:0 "O sonho de [child.GetFirstNamePossessiveNoTooltip] é simples, mas está bem."
 mpo_events_ariana.0090.b:0 "Seu legado deve ser maior do que o de um pastor!"
 mpo_events_ariana.0090.c:0 "A vida deles não é tão simples quanto parece, filho."
 mpo_events_ariana.0090.c_1:0 "[child.GetFirstNameNoTooltip] ganha uma apreciação pelo trabalho árduo"
 mpo_events_ariana.0090.c_2:0 "[child.GetFirstNameNoTooltip] ganha força durante seu trabalho"
 mpo_events_ariana.0090.c_duel:0 "[child.GetFirstNameNoTooltip] é enviado para trabalhar nos pastos"
 mpo_events_ariana.0090.desc:0 "Depois de passar um tempo nos pastos com os pastores, [child.GetFirstName] retorna para a tenda com um sorriso no rosto.\n\n"
 mpo_events_ariana.0090.desc_older:0 "\"Eu quero ser quem cuida das ovelhas, ao invés de ser um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] como você, [child.Custom2('RelationToMeShort', ROOT.Char)],\" [child.GetSheHe] exclama. \"A vida deles parece tão simples, sem as preocupações de batalha e governar.\"\n\n[child.GetSheHe|U] me entrega um feixe de lã recém-cortada e, embora seja áspero e sujo, posso sentir a paixão nas palavras [child.GetHerHim]."
 mpo_events_ariana.0090.desc_younger:0 "\"Eu quero ser um pastor, [child.Custom2('RelationToMeShort', ROOT.Char)]!\" [child.GetSheHe] exclama. \"Eles passam o dia todo com as ovelhas, e olha como elas são felizes. Ser um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] parece entediante!\"\n\n[child.GetSheHe|U] me entrega um feixe de lã recém-cortada e, embora seja áspero e sujo, posso ver o orgulho nos olhos [child.GetHerHim]."
 mpo_events_ariana.0090.t:0 "Ambições Lãs"
 mpo_events_ariana.0100.a:0 "Um lutador como este merece liderar!"
 mpo_events_ariana.0100.b:0 "[warrior.GetFirstNameNoTooltip] pode se juntar a nós na batalha."
 mpo_events_ariana.0100.c:0 "Talvez [warrior.GetSheHe] não seja [Select_CString( warrior.IsFemale, 'a única', 'o único' )] [warrior.GetWomanMan] com essa habilidade."
 mpo_events_ariana.0100.d:0 "Impressionante, mas [warrior.GetSheHe] deve se manter nas suas funções."
 mpo_events_ariana.0100.desc:0 "Uma nuvem de poeira gira, enquanto dois dos meus [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] se enfrentam em uma luta de wrestling. O acampamento ruge de empolgação, enquanto o campeão incontestável do dia joga seu oponente no chão.\n\nEu olho mais atentamente através da multidão, tentando descobrir a identidade deste grande guerreiro. Para minha surpresa, vejo m[Select_CString( warrior.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', warrior)], [warrior.GetFirstName]! Eu nunca esperaria tamanha destreza e coragem [warrior.GetHerHim], e muitos nem olhariam para um[Select_CString( warrior.IsFemale, 'a', '' )] [warrior.GetWomanMan] de forma alguma!"
 mpo_events_ariana.0100.t:0 "Força em Lugares Improváveis"
 mpo_events_ariana.0110.a:0 "[ROOT.Char.GetFaith.HighGodName] não mente. Devemos nos mudar."
 mpo_events_ariana.0110.b:0 "Bobagem, [current_capital.GetNameNoTierNoTooltip] é minha casa."
 mpo_events_ariana.0110.c:0 "Já basta, [astrologer.GetFirstNameNoTooltip]."
 mpo_events_ariana.0110.c_cynical:0 "[ROOT.Char.GetFaith.HighGodName] não é [ROOT.Char.GetTitleAsNameNoTooltip]. Eu sou!"
 mpo_events_ariana.0110.desc:0 "\"[ROOT.Char.GetTitleAsNameNoTooltip], eu ouvi os sussurros dos espíritos,\" diz meu astrólogo, [astrologer.GetFirstName]. \"[ROOT.Char.GetFaith.HighGodNameSheHe|U] alerta para os perigos que aguardam, a menos que mantenha seus parentes em [current_capital.GetNameNoTier].\"\n\n"
 mpo_events_ariana.0110.desc_ending:0 "Sugiro mover sua tenda para [new_capital.GetNameNoTier], e você poderá encontrar prosperidade lá."
 mpo_events_ariana.0110.desc_fertility:0 "\"Como seus rebanhos não podem pastar aqui, seria um infortúnio desfrutar suas refeições neste lugar.\""
 mpo_events_ariana.0110.desc_opinion:0 "\"O povo daqui não é mais tão favorável a você como antes, sua malícia envenenando a terra.\""
 mpo_events_ariana.0110.t:0 "Solo Rebelde"
 mpo_events_ariana.0111.a:0 "Encontramos prosperidade aqui."
 mpo_events_ariana.0111.desc:0 "Já faz algum tempo desde que me mudei de [current_capital.GetNameNoTier] para [new_capital.GetNameNoTier], atendendo a um aviso do meu astrólogo, [astrologer.GetFirstName].\n\nComo uma bênção de [ROOT.Char.GetFaith.FertilityGodName], a terra se tornou mais fértil, e meu povo está contente."
 mpo_events_ariana.0111.t:0 "Um Novo Lar"
 mpo_events_ariana_0050_lose_effect_tt:0 "Perde todos os [titles|E] [criminal_family.GetHerHim]"
 mpo_home_sweet_home_modifier:0 "Yurt Doce Yurt"
 mpo_home_sweet_home_modifier_desc:0 "Este personagem se apegou bastante à sua tenda e ao seu local."
 mpo_magical_tree_fertility_modifier:0 "Bênção da Fertilidade"
 mpo_magical_tree_fertility_modifier_desc:0 "Este personagem foi abençoado por uma árvore mágica, fazendo com que suas terras sejam prósperas, e seus filhos sejam muitos."
 mpo_magical_tree_modifier:0 "Acalmado"
 mpo_magical_tree_modifier_desc:0 "Este personagem testemunhou uma árvore mágica, e é acalmado pela sua presença."
 mpo_magical_tree_power_modifier:0 "Bênção do Poder"
 mpo_magical_tree_power_modifier_desc:0 "Este personagem foi abençoado por uma árvore mágica, fazendo com que se tornem mais poderosos em batalha."
 mpo_magical_tree_wisdom_modifier:0 "Bênção da Sabedoria"
 mpo_magical_tree_wisdom_modifier_desc:0 "Este personagem foi abençoado por uma árvore mágica, fazendo com que se tornem mais sábios além de sua idade."
 mpo_yearly_bellicose:0 "são muito imprudentes, em busca de uma vingança que talvez não exista."
 mpo_yearly_bureaucratic:0 "se importam muito mais com um pergaminho ou livro do que com a vida de seus colegas [sus_councillor.GetCulture.GetCollectiveNounNoTooltip]."
 mpo_yearly_communal:0 "operam dentro de uma mentalidade de colmeia, e sua incapacidade de agir individualmente é preocupante."
 mpo_yearly_courtly:0 "estão mais propensos a ter a cabeça enfiada no traseiro de alguém do que nos campos e montanhas garantindo a sobrevivência."
 mpo_yearly_egalitarian:0 "não têm problemas com a aceitação de estrangeiros, e provavelmente teriam sua cultura apagada dentro de milênios."
 mpo_yearly_spiritual:0 "podem agir com total desdém pelos outros, desde que fosse em nome de [sus_councillor.GetFaith.HighGodName]."
 mpo_yearly_stoic:0 "não derramariam uma lágrima, nem mesmo pela morte de seus próprios parentes."
