l_spanish:
 gain_rock_artifact_tt:0 "Você ganha um [artifact|e] $artifact_pedestal_rock_name$"
 innkeeper_bad_edibles_char_modifier:0 "Anfitrião Frugal"
 innkeeper_bad_edibles_char_modifier_desc:0 "A seleção de comidas oferecidas na estalagem deste personagem tinha mais mofo do que carne."
 innkeeper_fancy_edibles_char_modifier:0 "Excesso à Mesa"
 innkeeper_fancy_edibles_char_modifier_desc:0 "Havia uma seleção luxuosa de comidas e bebidas para escolher durante a noite de inauguração da estalagem."
 innkeeper_neutral_edibles_char_modifier:0 "Dieta Balanceada"
 innkeeper_neutral_edibles_char_modifier_desc:0 "Este personagem teve poucas opções para oferecer durante a noite de inauguração de sua nova estalagem."
 yearly.0001.a.failure:0 "[mentor.GetFirstNameNoTooltip] me aconselha sobre minha situação atual"
 yearly.0001.a.success:0 "Levo as lições de [mentor.GetFirstNamePossessiveNoTooltip] a sério"
 yearly.0001.a:0 "Sua assistência é muito apreciada."
 yearly.0001.b.failure:0 "Aconselho [mentor.GetFirstNameNoTooltip] sobre sua situação atual"
 yearly.0001.b.success:0 "[mentor.GetFirstNameNoTooltip] leva a sério minhas lições"
 yearly.0001.b:0 "Uma oferta generosa, mas e se eu ajudá-lo em vez disso?"
 yearly.0001.c:0 "Ambos podemos nos beneficiar se compartilharmos nosso conhecimento!"
 yearly.0001.d:0 "Eu posso me virar bem sozinho."
 yearly.0001.desc.arrogant:0 "Como você sem dúvida notou, sou bastante proficiente nos assuntos de [ROOT.Char.Custom('YearlyEvent0001Skill')]. Ficaria feliz em compartilhar meu conhecimento sobre esses tópicos com você"
 yearly.0001.desc.councillor:0 "Ao servir como seu [mentor.Custom('CouncilPosition')], aprendi muito sobre [ROOT.Char.Custom('YearlyEvent0001Skill')]. Estou disposto a orientá-lo nessas questões"
 yearly.0001.desc.default:0 "Por anos, minha habilidade em [ROOT.Char.Custom('YearlyEvent0001Skill')] tem me servido bem, e me ocorre que esse conhecimento também pode ser útil para você. Ficaria feliz em compartilhar o que sei"
 yearly.0001.desc.favor:0 "para retribuir a ajuda que você me deu no passado."
 yearly.0001.desc.friend:0 "[ROOT.Char.Custom('YearlyEvent0001Skill')|U] sempre foram pontos fortes meus, e desejo compartilhar minha experiência nesses tópicos com você. Se você tiver algum tempo disponível para algumas lições, ficaria feliz em ensinar o que sei."
 yearly.0001.desc.nofavor:0 "para ganhar seu favor."
 yearly.0001.opening:0 "[mentor.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.0002.a:0 "Eles devem se casar para absolver seus crimes."
 yearly.0002.c:0 "Vou fazer [councillor.GetFirstNameNoTooltip] apodrecer na prisão por me desafiar!"
 yearly.0002.d:0 "Seria uma pena se isso vazasse..."
 yearly.0002.desc:0 "Após ter me servido fielmente como m[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('councillor') )], confiei [Select_CString( councillor.IsFemale, 'a', 'ao' )] [councillor.GetTitledFirstName] a capacidade de viajar livremente dentro da minha corte.\n\nNo entanto, agora descobri que [councillor.GetSheHe] se aproveitou da minha hospitalidade ao ser indiscreto com m[Select_CString( child.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('child') )] [child.GetFirstName]!"
 yearly.0002.t:0 "Conselheiro Indiscreto"
 yearly.0003.a:0 "O mundo conhecerá seus crimes contra [ROOT.Char.GetFaith.PantheonTerm]!"
 yearly.0003.b:0 "Tentar encobrir seus encontros."
 yearly.0003.c:0 "Prendê-los por envergonhar a Casa [ROOT.Char.GetHouse.GetNameNoTooltip]!"
 yearly.0003.d:0 "Convidá-los para meus aposentos para um pouco de \"tempo em família.\""
 yearly.0003.dislikes_incest.desc:0 "descreve encontros que nenhum[Select_CString( child.IsFemale, 'a', '' )] [child.GetWomanMan] deveria ter com s[Select_CString( relative.IsFemale, 'ua', 'eu' )] [child.Custom2('RelationToMeShort', SCOPE.sC('relative'))]..."
 yearly.0003.likes_incest.desc:0 "detalha de forma #EMP fascinante#! o relacionamento carnal deles..."
 yearly.0003.start.desc:0 "A princípio, achei que fosse uma piada — como poderiam m[Select_CString( child.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] e [relative.Custom2('HerHisCharacterIntroductionNoComma', SCOPE.sC('child'))] ser amantes?! No entanto, a carta interceptada por meus espiões"
 yearly.0003.t:0 "Amor Proibido"
 yearly.0011.ambitious:0 "Cometas anunciam grandes feitos e grandes [ROOT.Char.GetWomenMen]!"
 yearly.0011.arbitrary:0 "Isso significa o que eu digo que significa!"
 yearly.0011.arrogant:0 "Um bom presságio para minha família, eu acho."
 yearly.0011.brave:0 "Seja o que for, enfrentaremos de frente!"
 yearly.0011.callous:0 "Contanto que não caia sobre mim, quem se importa?"
 yearly.0011.calm:0 "Isso, também, passará."
 yearly.0011.chaste:0 "Os fornicadores trouxeram isso sobre nós!"
 yearly.0011.compassionate:0 "Espero que não caia sobre ninguém..."
 yearly.0011.content:0 "Seja o que for, foi destinado."
 yearly.0011.craven:0 "#EMP TODOS, ENTREM EM PÂNICO!#!"
 yearly.0011.cynical:0 "Provavelmente é apenas gás camponês congelado."
 yearly.0011.deceitful:0 "Fico pensando qual explicação me beneficiaria mais..."
 yearly.0011.desc:0 "A aparição de um cometa nos céus faz com que todos os mortais parem. O que poderia significar essa estranha aparição, vagando pelos nossos céus tão inesperadamente?\n\nSábi[Select_CString( ROOT.Char.IsFemale, 'as', 'os' )] [ROOT.Char.GetWomenMen] do que eu passaram suas vidas ponderando menos sobre isso, mas cada camponês presunçoso no [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] parece ter sua própria teoria mal elaborada..."
 yearly.0011.diligent:0 "Isso nos incomodaria menos se estivéssemos trabalhando."
 yearly.0011.fickle:0 "Não consigo me decidir sobre isso..."
 yearly.0011.forgiving:0 "Grande [ROOT.GetCharacter.GetFaith.HighGodName], perdoe-nos por nossos pecados!"
 yearly.0011.gain_stress:0 "O cometa causa pânico em inúmeros súditos"
 yearly.0011.generous:0 "Isso #EMP prova#! que somos todos muito egoístas!"
 yearly.0011.gluttonous:0 "A morte se aproxima! Encha os estoques!"
 yearly.0011.greedy:0 "Fico pensando que riquezas estranhas vêm de um cometa..."
 yearly.0011.gregarious:0 "Se este for o fim, vamos comemorar com os amigos!"
 yearly.0011.honest:0 "Parece apenas uma pedra para mim?"
 yearly.0011.humble:0 "Todos somos partículas diante da Criação."
 yearly.0011.impatient:0 "O que diabos isso significa?!"
 yearly.0011.just:0 "Ó cometa, ó arauto da justiça divina!"
 yearly.0011.lazy:0 "Desista disso, vou voltar para a cama."
 yearly.0011.lose_stress:0 "O cometa aterroriza muitos arruaceiros"
 yearly.0011.lustful:0 "Rápido, alguém me segure!"
 yearly.0011.new_friends:0 "Talvez ele traga novos amigos?"
 yearly.0011.paranoid:0 "Meus inimigos estão virando os Céus contra mim!"
 yearly.0011.patient:0 "Vamos decifrar esse sinal, com o tempo."
 yearly.0011.sadistic:0 "Espero que caia sobre um inimigo!"
 yearly.0011.shy:0 "Talvez eu esteja mais seguro na minha torre..."
 yearly.0011.stubborn:0 "Não me movo por menos que os Céus #EMP e#! a Terra."
 yearly.0011.t:0 "Cometa Avistado!"
 yearly.0011.temperate:0 "Isso é um julgamento por nossos excessos!"
 yearly.0011.trusting:0 "T-talvez não signifique nada afinal?"
 yearly.0011.vengeful:0 "Hah, alguém receberá o que merece!"
 yearly.0011.wrathful:0 "Eu vou arrancar a maldita coisa do céu!"
 yearly.0011.zealous:0 "O fim está próximo! Arrependam-se!"
 yearly.0025.a.tt.progress:0 "Invista recursos para restaurar a estalagem, podendo obter um resultado e recompensas #N ruins#!, #M medianas#! ou #P boas#!."
 yearly.0025.a:0 "Farei este lugar prosperar!"
 yearly.0025.b:0 "Siga em frente, é arriscado demais"
 yearly.0025.desc:0 "Passeando por uma estrada deserta de [county.GetBaseNameNoTier] com minha comitiva, vejo uma silhueta escura surgindo à distância, avançando lentamente no ritmo dos meus próprios passos.\n\nQuanto mais me aproximo, mais claro se torna — é uma velha taverna, abandonada e esquecida. Com um pouco de carinho e cuidado nesta fachada desgastada, ela poderia facilmente se tornar uma encantadora pequena estalagem.\n\nNão consigo imaginar exatamente por que este lugar foi deixado em ruínas. Sua posição é próxima a várias aldeias, a entrada parece acolhedora. Parece, com toda a certeza, que deveria estar rendendo boas moedas.\n\nCom [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetLadyLord] cert[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] na terra certa."
 yearly.0025.t.chain_title:0 "Administração de Estalagem"
 yearly.0025.t:0 "$yearly.0025.t.chain_title$: Velha e Esquecida"
 yearly.0026.a.tt.failure:0 "Não encontro uma boa solução"
 yearly.0026.a.tt.success:0 "Faço o possível com o que tenho"
 yearly.0026.a:0 "Só... joguem um pouco de feno na lama"
 yearly.0026.b:0 "Algumas partes podem ser consertadas, mas há um prazo a cumprir"
 yearly.0026.c:0 "Vamos reformar #EMP tudo!#!"
 yearly.0026.desc:0 "Ao entrar nesta carcaça de prédio, percebo rapidamente por que foi perdido e abandonado em primeiro lugar.\n\nHá um cheiro fraco de algo que não reconheço, combinado com buracos no teto pingando lentamente contra o pântano lamacento que serve de chão.\n\nConsertá-lo não seria #EMP tão#! difícil, mas parece frustrante e caro. De qualquer forma, o povo de [county.GetNameNoTier] certamente virá até aqui — um novo negócio apoiado pelo [ROOT.Char.GetTitleAsNameNoTooltip] tem um certo apelo."
 yearly.0026.t:0 "$yearly.0025.t.chain_title$: Reforma"
 yearly.0026.tt.average:0 "A estalagem fica #M razoavelmente#! melhor."
 yearly.0026.tt.bad:0 "A estalagem fica #N um pouco#! melhor."
 yearly.0026.tt.good:0 "A estalagem fica #P muito#! melhor."
 yearly.0027.a.tt.failure:0 "Não sou tão carismático quanto pensei"
 yearly.0027.a.tt.success:0 "Meus encantos convencem"
 yearly.0027.a:0 "Quem liga pra #EMP bebida#!, estarei lá!"
 yearly.0027.b:0 "Nabos salgados para todos"
 yearly.0027.c:0 "Farei esses camponeses se sentirem reis e rainhas"
 yearly.0027.desc:0 "Começo a divagar, pensando no potencial do lugar e em todas as memórias que podem ser criadas aqui dentro.\n\nClaro, poucas coisas melhoram uma boa noite como uma refeição farta, e nada afasta as tristezas mais rápido que uma caneca de boa cerveja. Um bom pedaço de carne gordurosa, um bêbado desmaiado no banco, novos amigos de rostos borrados — todos os ingredientes de um bom momento!\n\nA verdadeira questão é: com o que devo deixar os convidados se deliciar? Cerveja, vinho, destilados..."
 yearly.0027.t:0 "$yearly.0025.t.chain_title$: Um Banquete de [ROOT.Char.Custom('GetQueenKing')|U]"
 yearly.0027.tt.bad:0 "$yearly.0026.tt.bad$"
 yearly.0027.tt.good:0 "$yearly.0026.tt.good$"
 yearly.0028.a.gain.bard:0 "Há uma chance de #P ganhar#! um bardo para sua corte no final."
 yearly.0028.a:0 "Contrate um bardo eloquente"
 yearly.0028.b.gain.poet:0 "Há uma chance de #P ganhar#! um poeta para sua corte no final."
 yearly.0028.b:0 "Encontre um poeta talentoso"
 yearly.0028.c.gain.jester:0 "Há uma chance de #P ganhar#! um bobo para sua corte no final."
 yearly.0028.c:0 "Traga-me um bobo ágil"
 yearly.0028.desc:0 "Uma estalagem certamente não estaria completa sem algum tipo de entretenimento para a multidão.\n\nQue tal um bardo cantor, falando sobre sentimentos de amor e guerra? Ou talvez um poeta, capaz de inspirar outros com o peso das palavras? Por que não um bobo ágil, para fazer você chorar de tanto rir e esquecer suas mágoas — mesmo que por uma noite?\n\nTenho que considerar qual tipo de apresentação manterá os clientes encantados. Quanto mais tempo ficarem, mais vão beber."
 yearly.0028.t:0 "$yearly.0025.t.chain_title$: Que Comece o Show!"
 yearly.0028.tt.major_xp_gain:0 "Suas habilidades de negociação são extremamente úteis"
 yearly.0028.tt.minor_xp_gain:0 "Suas habilidades de negociação são de alguma utilidade"
 yearly.0029.a:0 "Que noite!"
 yearly.0029.conclusion_intro:0 "Foi uma noite longa e cansativa para a estreia da taverna — cheia de altos e baixos. Era de se esperar, mas ainda assim, exaustiva."
 yearly.0029.conclusion_outro:0 "Meu trabalho aqui está feito."
 yearly.0029.edibles_average.1:0 "Os clientes pareceram gostar da maioria das comidas, apesar de terem que espantar alguns ratos corajosos.\n\n"
 yearly.0029.edibles_average.2:0 "Alguns convidados estranharam a cerveja servida, franzindo o cenho após cheirá-la — mas mesmo assim beberam.\n\n"
 yearly.0029.edibles_average.3:0 "Mesmo que nem a comida nem a cerveja fossem particularmente boas, os fregueses pareciam animados. Muitos, literalmente.\n\n"
 yearly.0029.edibles_bad.1:0 "A comida desceu mal... a maior parte escorrendo entre as tábuas do chão.\n\n"
 yearly.0029.edibles_bad.2:0 "Os poucos clientes que se atreveram a pedir uma refeição não tiveram coragem nem de dar a primeira mordida.\n\n"
 yearly.0029.edibles_bad.3:0 "Cada prato deixado sem vigilância se tornou um banquete em miniatura para os ratos locais. Hordas e mais hordas de #EMP ratos.#!\n\n"
 yearly.0029.edibles_good.1:0 "O estalajadeiro teve dificuldade em acompanhar a demanda, já que os clientes mal se sentavam antes de pedir outra rodada.\n\n"
 yearly.0029.edibles_good.2:0 "Tantos brados e aplausos que quase fiquei surdo, de tão alto e duradouro que foi.\n\n"
 yearly.0029.edibles_good.3:0 "Nenhum prato voltou da cozinha com sequer uma migalha.\n\n"
 yearly.0029.entertainment_bard_average:0 "O bardo subiu ao palco com um andar meio confiante, pegou um banco do chão e o bateu com força enquanto colocava um dos pés em cima. Mas assim que trouxe seu alaúde, toda a confiança sumiu. A plateia foi recebida com uma balada desafinada e aguda que nem mesmo um avô surdo e moribundo teria suportado.\n\n"
 yearly.0029.entertainment_bard_bad:0 "Quando o bardo subiu ao palco, [entertainer.GetSheHe] parecia... nervoso, como se nunca tivesse se apresentado antes. Os olhos arregalados como se [entertainer.GetSheHe] estivesse num campo de batalha, [entertainer.GetSheHe] soltou um único grito agudo — e fugiu.\n\n"
 yearly.0029.entertainment_bard_good:0 "Logo no início, uma melodia suave pôde ser ouvida vindo da escuridão lá fora, aos poucos chamando a atenção de cada bêbado. Um silêncio caiu sobre a multidão, e todos os olhos se voltaram para a entrada. A música ficou mais alta, mais alta ainda, até que a porta se escancarou e um bardo encantador entrou. O refrão [entertainer.GetHerHim] chegou a um clímax, depois desceu em uma melodia animada e uma onda de aplausos estrondosos — os primeiros de muitos que viriam.\n\n"
 yearly.0029.entertainment_jester_average:0 "O bobo conseguiu deixar o ambiente um pouco mais leve na estalagem, mas às custas de alguns silêncios constrangedores e piadas que passaram direto pelas cabeças dos camponeses — já simples, e ainda por cima embriagados.\n\n"
 yearly.0029.entertainment_jester_bad:0 "Fui enganado pelo bobo por acreditar que [entertainer.GetSheHe] apareceria naquela noite, mas nenhum sinal levava de volta a [entertainer.GetSheHe]. A expectativa pela atração da noite logo azedou, e o público rabugento murmurava incrédulo diante das minhas desculpas miseráveis.\n\n"
 yearly.0029.entertainment_jester_good:0 "O bobo surgiu no palco com um grito e uma cambalhota. A estalagem inteira explodiu em aplausos e gritos enquanto [entertainer.GetSheHe] girava graciosamente no ar, saltando por cima de mesas, bancos e fregueses. Cada façanha era acompanhada de uma piada espirituosa (mesmo ofegante), deixando o pobre coitado exausto no fim da noite. Acabou sendo uma noite verdadeiramente de tirar o fôlego para todos os presentes.\n\n"
 yearly.0029.entertainment_poet_average:0 "A aura radiante do poeta chamou a atenção assim que [entertainer.GetSheHe] entrou, fazendo até o cliente mais entediado levantar os olhos da caneca. Mas assim que começou a recitar, o encanto se quebrou: com nada além de um lamento para entreter, a plateia desinteressada logo voltou para sua cerveja.\n\n"
 yearly.0029.entertainment_poet_bad:0 "O poeta subiu ao palco com um pedaço de pergaminho nas mãos, fazendo o possível para chamar a atenção da plateia antes de começar — sem sucesso. [entertainer.GetSheHe|U] deu uma olhada mais próxima em suas anotações, tentou soltar algumas linhas diretamente — apenas para ser abafado por uma onda de vaias e fugir chorando na noite.\n\n"
 yearly.0029.entertainment_poet_good:0 "O poeta avançou dramaticamente até o palco, recitando seus versos com tamanha paixão ardente que nenhum coração presente permaneceu impassível. As palavras [entertainer.GetHerHim] ecoaram tão forte entre nós que todas as emoções anteriores pareceram... leves, em comparação. Nenhuma alma deixou o local naquele dia sem uma lágrima nos olhos — fosse de alegria ou tristeza.\n\n"
 yearly.0029.refurbishment_average.1:0 "Alguns banquinhos foram roubados, mas isso é uma desculpa para investir em mais.\n\n"
 yearly.0029.refurbishment_average.2:0 "Alguns rabiscos grosseiros nas mesas, mas nada importante.\n\n"
 yearly.0029.refurbishment_average.3:0 "Felizmente, nossos reparos resistiram, apesar dos rangidos sinistros no telhado.\n\n"
 yearly.0029.refurbishment_bad.1:0 "Minha nova estalagem já viu dias melhores, provavelmente. Hoje não foi um deles.\n\n"
 yearly.0029.refurbishment_bad.2:0 "Esperava que o vazamento resistisse. Infelizmente, há mais chuva no balcão do que cerveja.\n\n"
 yearly.0029.refurbishment_bad.3:0 "O cheiro simplesmente não desaparece. Temo que vá assombrar meus sonhos para sempre.\n\n"
 yearly.0029.refurbishment_good.1:0 "Um investimento que valeu a pena para realizar os reparos.\n\n"
 yearly.0029.refurbishment_good.2:0 "Alguns assentos a mais não fariam mal.\n\n"
 yearly.0029.refurbishment_good.3:0 "Felizmente, o último cliente saiu com um sorriso no rosto.\n\n"
 yearly.0029.t:0 "$yearly.0025.t.chain_title$: Noite de Inauguração"
