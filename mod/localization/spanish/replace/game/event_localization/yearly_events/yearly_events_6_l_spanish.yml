l_spanish:
 yearly.9100.a.failure:0 "Jardinagem é uma perda de tempo!"
 yearly.9100.a.success:0 "Aprendi sobre jardinagem!"
 yearly.9100.a.tooltip_a:0 "Você aprende muito sobre jardinagem"
 yearly.9100.a.tooltip_b:0 "Você piorou a situação"
 yearly.9100.a:0 "Deixe-me ajudar!"
 yearly.9100.b:0 "Aqui está algo para o seu trabalho duro!"
 yearly.9100.c:0 "Isso é #EMP infeliz#!... Mas não pare por minha causa!"
 yearly.9100.desc:0 "Ao entrar nos jardins, mal tenho tempo de dar um único passo antes de ouvir alguém gritando impropérios. \"#EMP [gardener.Custom('CulturalCurse')|U]!#!\"\n\nCaminho ao redor de uma sebe em busca da origem e vejo [Select_CString( gardener.IsFemale, 'minha jardineira', 'meu jardineiro' )] [gardener.GetTitledFirstName] trabalhando na terra com um franzido no rosto. [gardener.GetSheHe|U] percebe minha abordagem e rapidamente se levanta.\n\n\"Oh! Perdoe-me, [ROOT.Char.Custom('FormOfAddressForLiege')]. Eu não esperava que mais ninguém estivesse aqui fora... Algum animal estúpido, [gardener.Custom('GetAnimalType')] sem dúvida, arruinou #EMP tudo#! do meu trabalho recente! Plantei essas ervas apenas anteontem!\""
 yearly.9100.t:0 "Problemas no Jardim"
 yearly.9110.a:0 "Mas arruinar meu jardim é. Você pagará pelos danos. Agora."
 yearly.9110.b:0 "Você está passando dos limites [gardener.GetFirstNameNoTooltip]!"
 yearly.9110.c:0 "Essas flores realmente fazem um excelente presente... Para #EMP [Select_CString( spouse.IsFemale, 'minha', 'meu' )]#! [spouse.GetWifeHusband]."
 yearly.9110.d:0 "Eu #EMP não#! vou me envolver! Resolvam isso vocês mesmos."
 yearly.9110.desc:0 "M[Select_CString( gardener.IsFemale, 'inha jardineira', 'eu jardineiro' )] [gardener.GetTitledFirstName] entra furiosamente na câmara do conselho e se aproxima furiosamente do meu [romantic_councillor.GetCouncilTitle], [romantic_councillor.GetTitledFirstName].\n\n\"Como #EMP se atreve#! a arruinar o jardim d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleTierNamePossessive]? Roubando flores raras e preciosas, ainda por cima!\"\n\n[romantic_councillor.GetFirstNameNoTooltip] claramente não é afetado pelo temperamento do jardineiro. \"Pensei que seriam um presente perfeito para [Select_CString( councillor_spouse.IsFemale, 'minha', 'meu' )] [councillor_spouse.GetWifeHusband]. Ser romântico não é exatamente um crime, não é?\""
 yearly.9110.t:0 "O Ladrão de Flores"
 yearly.9120.a:0 "O venenoso, por favor... Para pesquisa, é claro."
 yearly.9120.b:0 "Flores exóticas certamente impressionarão meus jardins!"
 yearly.9120.c:0 "Ervas são sempre úteis. Eu vou levar essas."
 yearly.9120.d:0 "Por #EMP esses#! preços absurdos?! Nem pensar!"
 yearly.9120.desc:0 "O mercado em [barony_market.GetName] está bastante movimentado, e um comerciante em particular chama minha atenção. [seed_merchant.GetSheHe|U] parece vender nada além de pequenas caixas. Ao perceber minha curiosidade, [seed_merchant.GetSheHe] me convida.\n\n\"Interessado em algo especial, [ROOT.Char.Custom('FormOfAddressForLiege')]? Você vê, todas essas pequenas caixas estão cheias de diferentes tipos de sementes. Algumas crescerão em flores coloridas, outras em ervas medicinais. Eu até tenho um tipo raro e venenoso, se isso lhe interessar?\""
 yearly.9120.t:0 "O Mercador de Sementes"
