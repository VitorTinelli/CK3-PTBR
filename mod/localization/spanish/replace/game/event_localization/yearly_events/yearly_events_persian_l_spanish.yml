l_spanish:
 yearly_persian.1002.a:0 "Vou honrar Jamshid com generosos presentes de gemas e ouro!"
 yearly_persian.1002.b:0 "Esta é uma ocasião alegre, melhor passada visitando outros!"
 yearly_persian.1002.c:0 "Focar no ritual tradicional Haft-sin com minha família."
 yearly_persian.1002.d:0 "Não posso descansar, há muito trabalho a fazer!"
 yearly_persian.1002.desc:0 "Enquanto minha corte celebra o festival [iranian.GetName] de Noruz todos os anos, meus deveres como [ROOT.Char.GetTitleAsNameNoTooltip] frequentemente tornam difícil para mim participar das festividades.\n\nCom o equinócio se aproximando e meu reino em um estado próspero e estável, eu me pergunto se devo dedicar um tempo extra este ano para sair do [ROOT.Char.Custom('ResidenceBuilding')] e entrar no espírito festivo?"
 yearly_persian.1002.every_friend_and_neighboring_ruler:0 "Cada [friend|E] e [ruler|E] vizinho"
 yearly_persian.1002.every_iranian_character:0 "Cada Vassalo e Cortesão [iranian.GetName]"
 yearly_persian.1002.every_spouse_and_close_family_member:0 "Cada [spouse|E] e [close_family_member|E]"
 yearly_persian.1002.t:0 "Noruz"
 yearly_persian.1101.a:0 "Vou forçá-los todos a se submeterem à supremacia [ROOT.Char.GetCulture.GetNameNoTooltip]!"
 yearly_persian.1101.b.seljuk:0 "Se eu adotar #EMP seus#! costumes, eu poderia fundar o terceiro Império Persa!"
 yearly_persian.1101.c.warning:0 "$stewardship_domain.1073.c.warning$"
 yearly_persian.1101.c:0 "Somos abençoados por ter súditos com antecedentes tão diversos!"
 yearly_persian.1101.desc.arabic:0 "Junto com a disseminação do Islã, a cultura árabe também se espalhou a partir da Península Arábica."
 yearly_persian.1101.desc.ending:0 "\n\nMuitas tribos e culturas adotaram nossa língua e tradições [ROOT.Char.GetCulture.GetName], mas os persas que vivem no Planalto Iraniano têm resistido ferozmente a essa disseminação.\n\nTirando suas próprias tradições culturais dos legados dos grandes Impérios Acaemênida e Sassânida, eles têm orgulho feroz de sua ascendência e desejam preservar sua história, mesmo diante do governo estrangeiro."
 yearly_persian.1101.desc.seljuk:0 "Desde a grande conquista Seljuk, nossa história e cultura têm se espalhado entre nossos novos súditos."
 yearly_persian.1101.every_county:0 "Cada Condado [persian.GetName]"
 yearly_persian.1101.every_family:0 "Cada [close_family_member|E]"
 yearly_persian.1101.t:0 "Shu'ubiyya"
