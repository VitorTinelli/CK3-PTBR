l_spanish:
 bp1_yearly.3001.a:0 "Louvado seja [ROOT.Char.GetFaith.WealthGodName] por esta surpresa gloriosa!"
 bp1_yearly.3001.b:0 "Eu nunca poderia impor isso a um amigo."
 bp1_yearly.3001.c.tt:0 "Você e [friend.GetFirstNameNoTooltip] desperdiçam dinheiro em favor de camaradagem e diversão"
 bp1_yearly.3001.c:0 "O que eu realmente preciso é de algumas bebidas..."
 bp1_yearly.3001.d:0 "\"Você não poderia ceder um pouco mais?\""
 bp1_yearly.3001.desc:0 "As coisas andam um pouco apertadas ao redor do [ROOT.Char.Custom( 'FortifiedBuilding' )] ultimamente. Não importa o quanto eu colete em impostos, eu simplesmente não tenho conseguido fechar as contas!\n\n[friend.GetTitledFirstNameNoTooltip], sempre [Select_CString( friend.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))] devot[Select_CString( friend.IsFemale, 'a', 'o' )], veio me visitar durante esse período de má sorte. Enquanto discutimos meus problemas atuais, [friend.GetSheHe] se oferece para reabastecer meus cofres com um robusto estímulo.\n\n[friend.GetFirstNameNoTooltip] aperta minhas mãos e diz suavemente \"Deixe-me ajudar você, m[Select_CString( friend.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))]. Eu sei que você faria o mesmo por mim.\""
 bp1_yearly.3001.t:0 "Um Amigo de Verdade"
 bp1_yearly.3002.a:0 "Eu devo ajudar no que puder."
 bp1_yearly.3002.b.tt:0 "Você ignora s[Select_CString( friend.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))] em seu momento de necessidade"
 bp1_yearly.3002.b:0 "\"Bem, é melhor eu ir...\""
 bp1_yearly.3002.c.tt:0 "Você e [friend.GetFirstNameNoTooltip] se entregam a uma noite de devassidão"
 bp1_yearly.3002.c:0 "Uma noite de festa fará bem a [friend.GetSheHe]!"
 bp1_yearly.3002.d.tt:0 "Os registros financeiros são convocados para sua investigação"
 bp1_yearly.3002.d:0 "Vamos dar uma olhada nos seus registros..."
 bp1_yearly.3002.desc:0 "Enquanto visito m[Select_CString( friend.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))], [friend.GetTitledFirstNameNoTooltip], percebo que as coisas estão bem diferentes desde a última vez que estive aqui em [friend.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip].\n\n[friend.GetSheHe|U] costumava colocar [friend.Custom('GetExpensiveDrink')] e [friend.Custom('GetExpensiveDessert')] para nós sempre que eu vinha, mas hoje mal há uma migalha à vista e água é tudo o que enfeita a mesa.\n\nPergunto [Select_CString( friend.IsFemale, 'a', 'ao' )] [friend.GetFirstNameNoTooltip] se [friend.GetSheHe] passou por tempos difíceis. Abatido, [friend.GetSheHe] responde sombriamente: \"Você não faz ideia...\""
 bp1_yearly.3002.t:0 "Um Amigo em Apuros"
 bp1_yearly.3003.a:0 "\"Vou ajudar você, mas só desta vez...\""
 bp1_yearly.3003.b:0 "\"Gaste menos com velas.\""
 bp1_yearly.3003.desc:0 "Começo a revisar as despesas recentes [Select_CString( friend.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))] [friend.GetFirstNamePossessiveNoTooltip], tentando ao máximo entender o que poderia ter levado [friend.GetHerHim] a uma situação tão terrível. Imediatamente, identifico o problema:\n\nHomens de Armas: -1.8\n[friend.Custom('GetCourt')] Comodidades: -3.2\nNovo $court_physician_court_position$: -50\n#difficulty_hard Velas: -360 #!\nPresentes para [friend.Custom('GetCourtierPlural')|U]: -15\n\n\"Velas? Você está endividado por causa de #EMP velas?!#!\"\n\n[friend.GetSheHe|U] responde timidamente, \"M[Select_CString( friend.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))], você é astuto em questões de administração. Por favor, ajude-me!"
 bp1_yearly.3004.a:0 "\"O que poderia ser a esta hora?\""
 bp1_yearly.3004.b:0 "\"Qual é a fuga mais rápida? Rappel pela janela!\""
 bp1_yearly.3004.desc:0 "Eu chego de volta ao meu [ROOT.Char.Custom('FortifiedBuilding')] após uma longa caminhada solitária. Outro ano passou, mais um ano envelhecido...\n\nHoje é meu aniversário de [ROOT.Char.GetAge] anos. Quanto mais velho eu fico, mais valorizo os relacionamentos que cultivei ao longo dos anos... "
 bp1_yearly.3004.end:0 "Sigo para os meus aposentos, a solidão impedindo meus passos preguiçosos, quando ouço um #EMP clangor#! e sussurros abafados vindo do corredor."
 bp1_yearly.3004.friends:0 "Então me entristece que eu não tenha ouvido nada dos meus amigos hoje, como [friend1.GetTitledFirstName], [friend2.GetTitledFirstName], ou de nenhum dos meus outros amigos.\n\n"
 bp1_yearly.3004.spouse:0 "Então me entristece que eu não tenha ouvido nada [Select_CString( ROOT.Char.GetPrimarySpouse.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', ROOT.Char.GetPrimarySpouse)], [ROOT.Char.GetPrimarySpouse.GetFirstName], ou de nenhum dos meus amigos hoje.\n\n"
 bp1_yearly.3004.t:0 "Um Barulho Estranho"
 bp1_yearly.3005.a.tt:0 "Você recebe o presente grande"
 bp1_yearly.3005.a:0 "\"Vou pegar o maior!\""
 bp1_yearly.3005.b.tt:0 "Você recebe o presente de tamanho médio"
 bp1_yearly.3005.b:0 "\"O de tamanho médio será perfeito.\""
 bp1_yearly.3005.c.tt:0 "Você recebe o presente pequeno"
 bp1_yearly.3005.c:0 "\"As coisas boas vêm em pequenas embalagens.\""
 bp1_yearly.3005.desc:0 "Que surpresa! Todos os meus amigos mais queridos se reuniram para me desejar bem enquanto começo este próximo ano de vida. Há até uma mesa inteira repleta de [ROOT.Char.Custom('GetExpensiveDessert')], #EMP o meu favorito!#! Eu estava pensando que todos haviam me esquecido.\n\nEu não consigo acreditar que [party_host.GetFirstName] se deu ao trabalho de organizar isso em segredo. Eu não tinha a menor ideia de que uma surpresa tão atenciosa estava sendo planejada.\n\n[Select_CString( friend2.IsFemale, 'Minha amiga', 'Meu amigo' )] [friend2.GetFirstName] se aproxima de mim, lutando para carregar três pacotes lindamente embrulhados. Sempre o brincalhão, [friend2.GetSheHe] diz: \"Tenho três presentes aqui para você escolher. Um será seu, mas qual será?\""
 bp1_yearly.3005.opinion.tt:0 "Você ganha #P 30#! [opinion|E] de todos os [Concept( 'friend', 'Amigos' )|E]"
 bp1_yearly.3005.t.gift:0 "Presente de aniversário recebido"
 bp1_yearly.3005.t:0 "Feliz Aniversário!"
 bp1_yearly.3006.a:0 "É doce relembrar os velhos tempos."
 bp1_yearly.3006.b:0 "Nunca vou te esquecer, meu amigo."
 bp1_yearly.3006.c:0 "Queime essa coisa e deixe-me esquecer esse patife!"
 bp1_yearly.3006.d:0 "Amaldiçoe-o. Espero que ele apodreça no inferno."
 bp1_yearly.3006.desc.artifact_exists:0 "Acho que ainda tenho meu [old_bday_gift.GetName] guardado em algum lugar.."
 bp1_yearly.3006.desc.artifact_negative:0 "Lembro-me como se fosse ontem: nós nos banquetamos e dançamos, e eles até me deram um presente. Isso foi antes de tudo desandar entre nós, no entanto. Agora, minhas lembranças são manchadas pela traição de [friend2.GetFirstNamePossessive].\n\n"
 bp1_yearly.3006.desc.artifact_positive:0 "Lembro-me como se fosse ontem: nós nos banquetamos e dançamos, e eles até me presentearam com um presente maravilhoso!\n\n"
 bp1_yearly.3006.desc.friend1_dead:0 "[friend1.GetFirstName] faleceu desde então e eu lamento a perda de [Select_CString( friend1.IsFemale, 'uma grande amiga', 'um grande amigo' )]. [friend1.GetSheHe|U] esteve ao meu lado nos bons e maus momentos, nunca deixando de me arrancar um sorriso nos momentos de tristeza.\n\n"
 bp1_yearly.3006.desc.friend2_dead:0 "[friend2.GetFirstNameNoTooltip] faleceu desde então e eu lamento a perda de [Select_CString( friend2.IsFemale, 'uma grande amiga', 'um grande amigo' )]. [friend2.GetSheHe|U] esteve ao meu lado nos bons e maus momentos, nunca deixando de me arrancar um sorriso nos momentos de tristeza. Embora [friend2.GetFirstNameNoTooltip] se tenha ido, eu valorizo as lembranças que tenho [friend2.GetHerHim].\n\n"
 bp1_yearly.3006.desc:0 "Conforme completo mais um ano hoje, lembro-me da esplêndida festa de aniversário que meus amigos [friend1.GetFirstName] e [friend2.GetFirstName] organizaram para mim há vários anos. Como foi alegre sentir a bondade e o calor da nossa amizade tão evidentes!\n\n"
 bp1_yearly.3006.t:0 "Relembrando Aniversários Passados"
 bp1_yearly.3007.a.regalia:0 "\"Já passou da hora de eu conquistar algum respeito!\""
 bp1_yearly.3007.a.tapestry:0 "\"Eu estava pensando exatamente a mesma coisa! Isso aqui está terrível!\""
 bp1_yearly.3007.b:0 "\"Não temos um centavo para gastar com esses luxos...\""
 bp1_yearly.3007.desc.conc:0 "Patrocine [inspired_family_member.GetSheHe] e veja como a criação [inspired_family_member.GetHerHim] irá melhorar seu humor!\""
 bp1_yearly.3007.desc.regalia:0 "[spouse.GetFirstNameNoTooltip] hesita ao comentar sobre minha aparência.\n\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [spouse.Custom2('RelationToMeShort', ROOT.Char)], você é um[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] [ROOT.GetCharacter.GetTitleAsNameNoTooltip|l] poderos[Select_CString( ROOT.GetCharacter.IsFemale, 'a', 'o' )] e grandios[Select_CString( ROOT.GetCharacter.IsFemale, 'a', 'o' )], mas alguns ainda não lhe dão o respeito que você merece. Você precisa de algo para demonstrar sua autoridade!\"\n\n\"M[Select_CString( inspired_family_member.IsFemale, 'inha', 'eu' )] [spouse.Custom2('RelationToMeShort',SCOPE.sC('inspired_family_member'))] poderia forjar um conjunto de #EMP finas#! insígnias que refletiriam seu status. "
 bp1_yearly.3007.desc.tapestry:0 "[spouse.GetFirstNameNoTooltip] hesitante comenta sobre os móveis do [ROOT.Char.Custom('GetRoom')].\n\"Essas paredes nuas não deixam você um pouco louco? Eu sei exatamente o que esse [ROOT.Char.Custom('GetRoom')] precisa: #EMP Tapeçarias!#!\"\n\n\"M[Select_CString( inspired_family_member.IsFemale, 'inha', 'eu' )] [spouse.Custom2('RelationToMeShort',SCOPE.sC('inspired_family_member'))] é #EMP excelente#! com uma agulha e linha."
 bp1_yearly.3007.desc:0 "Estou terminando os negócios do dia em meu [ROOT.Char.Custom('GetChamber')] quando m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('spouse'))] [spouse.GetTitledFirstName] entra com [Select_CString( inspired_family_member.IsFemale, 'sua', 'seu' )] [spouse.Custom2('RelationToMeShort',SCOPE.sC('inspired_family_member'))] [inspired_family_member.GetFirstName] ansiosamente atrás de [spouse.GetHerHis] passos. Eu deixo o livro de registros que estava lendo, sabendo que nenhuma coisa boa virá dessa visita inesperada.\n\n"
 bp1_yearly.3007.t:0 "A Habilidade da Família"
 bp1_yearly.3100.a:0 "Eu sei exatamente onde [3100_target_courtier.GetSheHe] pode se encaixar!"
 bp1_yearly.3100.b:0 "Eu devo educadamente declinar."
 bp1_yearly.3100.desc.conc:0 "Eu faria uso de [3100_target_courtier.GetHerHim] pessoalmente, mas infelizmente não parece possível.\n\nEu odiaria ver o grande talento de [3100_target_courtier.GetHerHis] ir para o desperdício. Não vai aceitar [3100_target_courtier.GetHerHim] e liberar o potencial de [3100_target_courtier.GetHerHis]?"
 bp1_yearly.3100.desc.diplomacy:0 "[3100_target_courtier.GetSheHe|U] é um diplomata incrivelmente talentoso - tão eloquente quanto se pode ser! "
 bp1_yearly.3100.desc.intrigue:0 "[3100_target_courtier.GetSheHe|U] tem várias redes de influência e maneiras de resolver as coisas... #EMP discretamente#!. "
 bp1_yearly.3100.desc.learning:0 "[3100_target_courtier.GetSheHe|U] é um estudioso incrivelmente talentoso - o mais brilhante de todos que já aprendi! "
 bp1_yearly.3100.desc.martial:0 "[3100_target_courtier.GetSheHe|U] é um estrategista incrivelmente talentoso! A mente [3100_target_courtier.GetHerHim|U] está sempre elaborando possíveis táticas. "
 bp1_yearly.3100.desc.prowess:0 "[3100_target_courtier.GetSheHe|U] é forte como um urso e mais poderoso ainda! "
 bp1_yearly.3100.desc.stewardship:0 "[3100_target_courtier.GetSheHe|U] é um Administrador incrivelmente talentoso!"
 bp1_yearly.3100.desc:0 "M[Select_CString( 3100_courtier_liege.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('3100_courtier_liege'))] [3100_courtier_liege.GetTitledFirstName] me honrou com uma visita e trouxe um de [3100_courtier_liege.GetHerHis] [3100_courtier_liege.Custom('GetCourtierPlural')] junto. [3100_courtier_liege.GetFirstNameNoTooltip] se aproxima de mim animadamente:\n\n\"Bem encontrado, [ROOT.Char.GetTitledFirstNameNoTooltip]! Fico feliz em ver que você está prosperando aqui em [ROOT.Char.GetCapitalLocation.GetName]. Me ocorreu que [3100_target_courtier.GetFirstName] aqui poderia ser útil em seu [ROOT.Char.Custom('GetCourt')]."
 bp1_yearly.3100.t:0 "Um Cortesão Entre Amigos"
 bp1_yearly.3101.a:0 "\"Eu aceito graciosamente! Isso deve ser suficiente...\""
 bp1_yearly.3101.b:0 "\"Eu não poderia aceitar [target_title.GetNameNoTierNoTooltip] dessa forma.\""
 bp1_yearly.3101.desc:0 "[target_title_holder.GetTitledFirstName] veio até mim com uma grande proposta. [target_title_holder.GetSheHe|U] sabe que tenho um direito legítimo sobre o [target_title.GetName] e escolheu finalmente reconhecê-lo.\n\n\"Meu amigo,\" ele diz, \"desejo profundamente conceder a você [target_title.GetNameNoTierNoTooltip] pois é seu. No entanto, não posso fazer isso sem receber algo em troca, a menos que eu retorne às minhas pessoas de mãos vazias.\"\n\n\"Forneça-me algo para mostrar às minhas pessoas quando eu voltar para [target_title_holder.GetCapitalLocation.GetName] e [target_title.GetNameNoTierNoTooltip] será seu.\""
 bp1_yearly.3101.t:0 "Um Condado Entre Amigos"
 bp1_yearly.3201.desc:0 "Eu cordialmente convido você para participar de meu banquete em [host.GetCapitalLocation.GetTitle.GetNameNoTier]! Será um grande evento, com comida deliciosa e entretenimento."
 bp1_yearly.3201.opening:0 "[host.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp1_yearly.3202.a.liege:0 "\"Peço desculpas, m[Select_CString( host.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))]...\""
 bp1_yearly.3202.a:0 "\"Peço desculpas, [host.GetTitledFirstNameNoTooltip]...\""
 bp1_yearly.3202.b.failure:0 "Você não consegue convencer [host.GetTitledFirstNameNoTooltip] da má conduta de [enemy.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.3202.b.success:0 "Você convence [host.GetTitledFirstNameNoTooltip] da má conduta de [enemy.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.3202.b:0 "\"Você deve acreditar que [enemy.GetFirstNameNoTooltip] me armou uma cilada!\""
 bp1_yearly.3202.c.tt:0 "#V Duele#! com [enemy.GetFirstName].\n#weak Este duelo NÃO é até a morte. Embora seja possível perecer.#!\nSe você vencer, a verdade do que ocorreu aqui virá à luz. Se você perder, [enemy.GetFirstNameNoTooltip] terá realmente vencido você.\n\nSua [prowess|E]: [prowess_i]#V [root_for_loc.GetProwess]#!\n[prowess|E] de [enemy.GetFirstNamePossessive]: [prowess_i]#V [enemy.GetProwess]#!"
 bp1_yearly.3202.c:0 "\"Está na hora de encerrar esses jogos, [enemy.GetFirstNameNoTooltip].\""
 bp1_yearly.3202.desc:0 "Entro em [host.Custom( 'FortifiedBuilding' )] d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNamePossessiveNoTooltip] esperando o grande e alegre banquete para o qual recebi um convite, mas não há ninguém! Após um pouco de busca, encontro [host.GetFirstNameNoTooltip] e m[Select_CString( enemy.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('enemy'))] [enemy.GetFirstNameNoTooltip] conversando sobre sabe-se lá o quê.\n\nSurpreso com minha entrada repentina, [host.GetFirstNameNoTooltip] se vira para mim e pergunta por que apareci sem aviso.\n\n\"Pensei... você me convidou para um banquete hoje... ?\"\n\n[host.GetSheHe|U] explica que estou enganado e começa a me dar uma palestra sobre etiqueta cortesã. [enemy.GetFirstNameNoTooltip], enquanto isso, não consegue parar de rir para [enemy.GetHerselfHimself] enquanto sou completamente humilhad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por m[Select_CString( host.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))]."
 bp1_yearly.3202.t:0 "Banquete de um Tolo"
 bp1_yearly.3203.sc_result_lost:0 "Você perdeu em um duelo contra [sc_victor.GetTitledFirstNameNoTooltip]"
 bp1_yearly.3203.sc_result_won:0 "Você venceu em um duelo contra [sc_loser.GetTitledFirstNameNoTooltip]"
 bp1_yearly.3204.sc_invalid:0 "Seu duelo contra [enemy.GetTitledFirstNameNoTooltip] foi invalidado"
 bp1_yearly.3300.a:0 "Acredito que sempre me sentirei mais próximo de [ROOT.Char.GetFaith.HighGodName]."
 bp1_yearly.3300.desc:0 "Enquanto estou sentado e meditando sobre os detalhes mais finos do [ROOT.Char.GetFaith.GetName], não posso deixar de pensar no momento em que [pilgrimage_memory.GetDescription]. Essa viagem estava longe do conforto cotidiano da minha vida como [ROOT.Char.GetTitleAsNameNoTooltip|l], mas o alívio que senti ao chegar em [pilgrimage_destination.GetName] tornou tudo isso valer a pena."
 bp1_yearly.3300.t:0 "Refletindo sobre [ROOT.Char.GetFaith.HighGodName]"
 bp1_yearly.3301.a:0 "Sempre me sentirei mais próximo tanto de [ROOT.Char.GetFaith.HighGodName] quanto de [pilgrimage_friend.GetFirstNameNoTooltip]."
 bp1_yearly.3301.desc:0 "Enquanto estou sentado e meditando sobre os detalhes mais finos do [ROOT.Char.GetFaith.GetName], não posso deixar de pensar no momento em que [pilgrimage_memory.GetDescription]. Essa viagem estava longe do conforto cotidiano da minha vida como [ROOT.Char.GetTitleAsNameNoTooltip|l], mas o alívio que senti ao chegar em [pilgrimage_destination.GetName] tornou tudo isso valer a pena.\n\nAproximar-me de [pilgrimage_friend.GetFirstNameNoTooltip] certamente foi um benefício adicional. Certamente desfrutamos de algum tempo de qualidade juntos nessa peregrinação."
 bp1_yearly_3100_courtier_gained:0 "[ROOT.Char.Custom('GetCourtier')|U] habilidoso recrutado"
