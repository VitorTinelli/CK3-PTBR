l_spanish:
 yearly.4001.a:0 "Faça o que for preciso para resolver isso!"
 yearly.4001.b:0 "[vassal.GetFirstNameNoTooltip] implorará publicamente pelo seu perdão."
 yearly.4001.c:0 "Hah, boa, [vassal.GetFirstNameNoTooltip]!"
 yearly.4001.desc:0 "[vassal.Custom2('YourCharacterIntroduction', ROOT.Char)|U], "
 yearly.4001.desc_end:0 "Exijo satisfação por este insulto!"
 yearly.4001.desc_lover:0 "ousou levar [Select_CString( neighboring_ruler_secondary.IsFemale, 'a minha', 'o meu' )] [neighboring_ruler.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler_secondary'))] [neighboring_ruler_secondary.GetTitledFirstName] a pecado carnal."
 yearly.4001.desc_murder:0 "assassinou [Select_CString( neighboring_ruler_secondary.IsFemale, 'a minha', 'o meu' )] [neighboring_ruler.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler_secondary'))] [neighboring_ruler_secondary.GetTitledFirstName] em uma briga desonesta."
 yearly.4001.desc_opinion:0 "insultou-me gravemente. [vassal.GetSheHe|U] teve a audácia de me chamar de [neighboring_ruler.Custom2('InsultNoun', SCOPE.sC('vassal'))] [neighboring_ruler.Custom2('InsultAdjectiveArticle', SCOPE.sC('vassal'))] na frente da minha corte."
 yearly.4001.desc_rival:0 "Não deveria esperar algo melhor de alguém associado a #EMP você#!, mas isso é inaceitável!"
 yearly.4001.opening:0 "[neighboring_ruler.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.4011.a:0 "Ver uma amizade crescer assim... Vou ajudar a fazê-la florescer!"
 yearly.4011.b:0 "Eles não podem estar tramando algo de bom; isso termina agora."
 yearly.4011.c.failure:0 "Pareço intrometido"
 yearly.4011.c.success:0 "Minha companhia é apreciada"
 yearly.4011.c.toast.failure:0 "Pareci intrometido"
 yearly.4011.c.toast.success:0 "Minha companhia foi apreciada"
 yearly.4011.c:0 "Então... sobre o que vocês estão conversando?"
 yearly.4011.desc:0 "Ultimamente, vejo frequentemente [heir.Custom2('MyCharacterIntroduction', ROOT.Char)] e [vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] juntos no [ROOT.Char.Custom('ResidenceBuilding')], envolvidos em conversas profundas. Parecem realmente ter encontrado um terreno comum!"
 yearly.4011.t:0 "Unidos como Cúmplices"
 yearly.4021.a:0 "Você não tocará [Select_CString( child.IsFemale, 'na minha filha', 'no meu filho' )]!"
 yearly.4021.b:0 "Ninguém escapa das consequências de seus atos."
 yearly.4021.c:0 "Prometo que disciplinarei [child.GetSheHe]!"
 yearly.4021.c_failure:0 "[child.GetTitledFirstNameNoTooltip] aprende que suas ações não têm consequências"
 yearly.4021.c_success:0 "[child.GetTitledFirstNameNoTooltip] escuta e aprende"
 yearly.4021.d:0 "Você precisa perdoar [child.GetSheHe]! Por favor, farei qualquer coisa..."
 yearly.4021.desc:0 "Oh, tristeza! O encontro de [child.Custom2('MyCharacterIntroduction', ROOT.Char)] e [vassal.Custom2('RelationToMeShort', SCOPE.sC('vassal_kid'))] d[Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstNamePossessive], [vassal_kid.GetTitledFirstName] terminou abruptamente quando [vassal_kid.GetFirstNameNoTooltip] foi deixado sem vida em um horrível acidente!\n\n\"Eu juro, [child.Custom2('RelationToMeShort', ROOT.Char)]. Era apenas um jogo!\" [child.GetTitledFirstNameNoTooltip] me assegura enquanto [Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitleAsNameNoTooltip] exige justiça."
 yearly.4021.t:0 "Jogo Bruto"
 yearly.4022.a:0 "Bem-vindo de volta, [child.GetFirstNameNoTooltip]."
 yearly.4022.desc:0 "\"Olá [child.Custom2('RelationToMeShort', ROOT.Char)].\" [ROOT.Char.Custom2('MyCharacterIntroduction', SCOPE.sC('child'))] parece um pouco abatido após seu tempo na prisão de [actor.GetTitledFirstNamePossessive], mas o sorriso [child.Custom('quirk_neg_adjective')] que se estampa em seu rosto o faz parecer mais vivo do que nunca.\n\n\"Mal posso esperar para lhe agradecer pela lição que você me ensinou sobre pagar as dívidas.\""
 yearly.4022.t:0 "O Retorno"
 yearly.4031.a:0 "Vou vasculhar o [ROOT.Char.Custom('ResidenceBuilding')] atrás deste assassino!"
 yearly.4031.b:0 "Vamos enterrar o corpo e esquecer essa tragédia."
 yearly.4031.b_every_courtier:0 "Todo cortesão"
 yearly.4031.c:0 "Como meu médico, você deveria estudar os corpos."
 yearly.4031.desc:0 "Mais um corpo foi encontrado... Todos têm sido pessoas de pouca importância, graças a [ROOT.Char.GetFaith.HighGodName], mas os notáveis estão ficando nervosos."
 yearly.4031.desc_opening:0 "O cheiro me atinge antes que a porta seja aberta; um odor pesado e carnal que permeia o local. É o fedor dos recém-mortos.\n\n"
 yearly.4031.desc_physician:0 "\"Outro assassinato, [ROOT.Char.Custom('FormOfAddressForLiege')].\" [physician.GetTitledFirstName] enxuga suas mãos ensanguentadas em um avental depois de olhar o corpo. \"Devemos parar esse assassino sem sentido!\""
 yearly.4031.t:0 "Assassino Entre Nós"
 yearly.4031.tt:0 "Uma investigação é lançada"
 yearly.4061.a:0 "Por favor, compartilhe sua sabedoria comigo."
 yearly.4061.a_failure:0 "Suas histórias apenas o confundem"
 yearly.4061.a_success:0 "Você obtém algumas perspicácias"
 yearly.4061.b:0 "Deixe seu conhecimento abençoar toda a corte!"
 yearly.4061.c.tt:0 "Você dispensa o homem"
 yearly.4061.c:0 "Não tenho tempo para tolos."
 yearly.4061.d.tt:0 "Passeie com ele pelas ruas como um bobo"
 yearly.4061.d:0 "Divertido! Deixe-o também divertir as massas."
 yearly.4061.desc:0 "O guarda que trouxe o homem até mim parece cético."
 yearly.4061.desc_ending:0 "\"Ele se aproximou do [ROOT.Char.Custom('ResidenceBuilding')] montado em um burro, [ROOT.Char.Custom('FormOfAddressForLiege')]. De costas.\""
 yearly.4061.desc_guard:0 "[guard.Custom2('MyCharacterIntroduction', ROOT.Char)|U], que trouxe o homem até mim, parece cético."
 yearly.4061.desc_opening:0 "\"Meu nome é [hodja.GetTitledFirstName], [ROOT.Char.Custom('FormOfAddressForLiege')]. Vim diante de você para oferecer minha sabedoria.\"\n\n"
 yearly.4061.t:0 "O Bobo Sábio"
 yearly.4071.a:0 "Estudarei tudo, em nome do [ROOT.Char.GetFaith.ReligiousText]!"
 yearly.4071.b:0 "Distribua-os entre meus [ROOT.Char.Custom('GetCourtierPlural')]."
 yearly.4071.desc:0 "[councillor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim com um monte de livros em seus braços.\n\n\"Tenho notado sua sede de conhecimento, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [councillor.Custom2('RelationToMe', ROOT.Char)]."
 yearly.4071.desc_ending:0 "Talvez esses livros possam interessá-lo?"
 yearly.4071.desc_focus:0 "Especialmente seus recentes estudos relacionados a [ROOT.Char.Custom('LifestyleFocus')]!"
 yearly.4071.desc_no_focus:0 "Sem mencionar seus estudos anteriores sobre [ROOT.Char.Custom('education_conversation_subject')]!"
 yearly.4071.t:0 "Em Busca do Conhecimento"
 yearly.4081.a.tt:0 "Você patrocina a tradução de um livro sobre medicina"
 yearly.4081.a:0 "#EMP De materia Medica#!... Parece interessante!"
 yearly.4081.b.tt:0 "Você patrocina a tradução de um livro sobre astronomia"
 yearly.4081.b:0 "Ah, este! #EMP On Ascensions#!."
 yearly.4081.c.tt:0 "Você patrocina a tradução de um livro sobre matemática"
 yearly.4081.c:0 "#EMP Elements#! parece mais recompensador."
 yearly.4081.d.tt:0 "Você não patrocina nenhum estudioso"
 yearly.4081.d:0 "Tenho coisas melhores para gastar meu dinheiro."
 yearly.4081.desc:0 "Eruditos locais necessitam de patrocínios em seus esforços para traduzir livros do grego para o árabe, [ROOT.Char.Custom('FormOfAddressForLiege')] - esforços que beneficiam todo o mundo árabe!\n\n[councillor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] trouxe-me uma lista de estudiosos que eu poderia patrocinar e os livros em que estão trabalhando atualmente."
 yearly.4081.e.tt:0 "Você patrocina a tradução de um livro sobre motivações"
 yearly.4081.e:0 "#EMP Sobre a Alma#!? Fascinante..."
 yearly.4081.f.tt:0 "Você patrocina a tradução de um livro sobre história militar"
 yearly.4081.f:0 "O que é isso... #EMP Thucydides#!?"
 yearly.4081.g.tt:0 "Você patrocina a tradução de um livro biográfico"
 yearly.4081.g:0 "Este #EMP Plutarch#! me intriga."
 yearly.4081.t:0 "Traduções"
 yearly.4081.toast:0 "Livro Traduzido"
 yearly.4081.tt:0 "Você receberá o livro"
 yearly.4091.a.tt:0 "Isso promoverá a educação d[Select_CString( ward.IsFemale, 'a', 'o' )] [ward.GetFirstNamePossessiveNoTooltip]"
 yearly.4091.a:0 "Vá em frente [ward.GetFirstNameNoTooltip]."
 yearly.4091.b:0 "Eu gostaria de participar, sim."
 yearly.4091.desc:0 "\n\n\"Saudações, [ROOT.Char.GetTitledFirstNameNoTooltip]. Saudações, jovem [ward.GetLadyLord]. Há um assento vazio em uma discussão em andamento, gostaria de se juntar a nós?\""
 yearly.4091.desc_house:0 "a Casa da Sabedoria."
 yearly.4091.desc_no_house:0 "alguns eruditos locais."
 yearly.4091.desc_opening:0 "[ward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] e eu estamos passeando em Bagdá quando nos deparamos com"
 yearly.4091.t:0 "Eruditos de Bagdá"
