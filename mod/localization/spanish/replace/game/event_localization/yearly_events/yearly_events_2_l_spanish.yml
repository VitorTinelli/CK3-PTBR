l_spanish:
 yearly.1001.a.tt:0 "Vou encontrar [married_seducer.GetTitledFirstName] quando todos estiverem dormindo."
 yearly.1001.a:0 "Vou me entregar a [married_seducer.GetSheHe]!"
 yearly.1001.b:0 "Todos saberão dos pensamentos pecaminosos [married_seducer.GetHerHim]!"
 yearly.1001.c:0 "Não! Meu coração permanece puro."
 yearly.1001.end_hesitation.desc:0 "e posso sentir meu corpo respondendo, despertando. Mas [seducer_spouse.GetTitledFirstName] – [Select_CString( seducer_spouse.IsFemale, 'sua', 'seu' )] [seducer_spouse.GetWifeHusband], e [Select_CString( seducer_spouse.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('seducer_spouse'))] – também está aqui esta noite..."
 yearly.1001.end_intimidated.desc:0 "e estou aterrorizado. [married_seducer.GetHerHim]? [Select_CString( seducer_spouse.IsFemale, 'Da', 'Do' )] [seducer_spouse.GetWifeHusband] [married_seducer.GetHerHim], [seducer_spouse.GetTitledFirstName]? Ou... do que eu poderia fazer? Não posso dizer."
 yearly.1001.end_spiteful.desc:0 "e não posso mentir, também quero [married_seducer.GetSheHe]... Ou será que punir [Select_CString( seducer_spouse.IsFemale, 'sua', 'seu' )] [seducer_spouse.GetWifeHusband], [seducer_spouse.GetTitledFirstName], é o que realmente desejo? Isso realmente importa?"
 yearly.1001.start.desc:0 "À medida que meus olhos se encontram com [married_seducer.GetTitledFirstNamePossessive] pelo que parece ser a vigésima vez esta noite, sei que não estou imaginando coisas. Mesmo do outro lado da mesa, o olhar [married_seducer.GetHerHim] parece tão intenso quanto o sol do meio-dia.\n\n[married_seducer.GetSheHe|U] me quer,"
 yearly.1001.t:0 "Através de Cílios Abatidos"
 yearly.1002.a.failure.message:0 "[married_seducer.GetFirstName] zombou de mim e saiu."
 yearly.1002.a.failure:0 "[married_seducer.GetFirstNameNoTooltip] acha que estou sendo grudento"
 yearly.1002.a.success.message:0 "[married_seducer.GetFirstName] e eu fizemos amor até o sol nascer."
 yearly.1002.a.success:0 "[married_seducer.GetFirstNameNoTooltip] fica"
 yearly.1002.a:0 "\"Você pode ficar um pouco mais? Por favor?\""
 yearly.1002.b.failure.message:0 "[married_seducer.GetFirstName] ficou magoado, como se [married_seducer.GetSheHe] tivesse esperado algo mais."
 yearly.1002.b.failure:0 "[married_seducer.GetFirstNameNoTooltip] espera algo mais"
 yearly.1002.b.success.message:0 "[married_seducer.GetFirstName] apreciou minha casualidade."
 yearly.1002.b.success:0 "[married_seducer.GetFirstNameNoTooltip] aprecia minha casualidade"
 yearly.1002.b:0 "\"De fato, você melhor se apressar.\""
 yearly.1002.desc:0 "Depois, [married_seducer.GetFirstName] cai no colchão com um baque, a respiração [married_seducer.GetHerHim] ofegante e os olhos meio cerrados. Preguiçosamente, eu enxugo o suor do peito [married_seducer.GetHerHim] com dedos delicados.\n\nApenas um momento depois, [married_seducer.GetFirstNameNoTooltip] afasta minha mão com um sorriso apologético. \"Já está quase amanhecendo. É melhor eu ir embora.\""
 yearly.1003.a:0 "Eu... Eu estava procurando o banheiro!"
 yearly.1003.end.desc:0 "Eu empurro a porta, me aproximo mais...\n\nDe repente, com um estrondo alto e dor intensa, eu caio para trás, batendo com força no chão. Há gritos, tantos gritos. E passos. Minha cabeça está girando...\n\n\"Como um rato numa armadilha\", sussurra uma voz familiar em meu ouvido. [seducer_spouse.GetTitledFirstName]. Droga."
 yearly.1003.start.desc:0 "Uma vez que estou certo de que não fui seguido, eu abro a porta de [married_seducer.GetFirstNamePossessive] e espio lá dentro. O objeto do meu desejo está de pé, com as costas viradas para mim, nu como o dia em que [married_seducer.GetSheHe] nasceu."
 yearly.1003.t:0 "Eu Deveria Ter Sabido"
 yearly.1010.a.tt:0 "Eu serei capaz de decidir se quero [abductee.GetTitledFirstName] salvo, capturado ou morto a seguir\n\n"
 yearly.1010.a:0 "Capture [abductor.GetTitledFirstNameNoTooltip] vivo."
 yearly.1010.abduction.tt:0 "[abductee.GetTitledFirstName] foi sequestrado [Select_CString( abductor.IsFemale, 'pela', 'pelo' )] [abductor.GetTitledFirstName]"
 yearly.1010.b:0 "Quero [abductor.Custom2('InsultNoun', ROOT.Char)] mort[Select_CString( abductor.IsFemale, 'a', 'o' )]."
 yearly.1010.c:0 "Tudo o que me importa é o retorno seguro de [abductee.GetFirstNamePossessiveNoTooltip]."
 yearly.1010.d:0 "Não me importo. Deixe-os ir."
 yearly.1010.end.desc:0 "Os cães e [Select_CString( dummy_gender.IsFemale, 'as', 'os' )] [dummy_gender.GetWomenMen] estão prontos. Quais são as suas ordens?\""
 yearly.1010.friend.desc:0 "[hunter.GetTitledFirstName] entra na sala, um arco pendurado no ombro [hunter.GetHerHim]. \"Sinto muito, velho amigo. Foi [abductor.GetTitledFirstName] quem levou [abductee.GetSheHe]."
 yearly.1010.friend.tt:0 "M[Select_CString( hunter.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hunter'))] [hunter.GetTitledFirstName] está aqui para ajudar."
 yearly.1010.marshal.desc:0 "M[Select_CString( hunter.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hunter'))] entra na sala, um arco pendurado no ombro [hunter.GetHerHim]. \"O guarda sobrevivente afirma que foi [abductor.GetTitledFirstName] quem levou [abductee.GetSheHe], meu senhor."
 yearly.1010.start.desc:0 "Quando entro nos aposentos de [abductee.GetTitledFirstNamePossessive], a primeira coisa que percebo é o guarda caído no canto. A segunda coisa é o corte vermelho brilhante na garganta [dummy_gender.GetHerHim]. No entanto, m[Select_CString( abductee.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('abductee'))] não está em lugar algum!\n\n"
 yearly.1010.t:0 "Desaparecido na Noite"
 yearly.1011.a:0 "Nonsense. Defenda [abductee.GetFirstNameNoTooltip] com sua vida."
 yearly.1011.b:0 "Eu quero [abductee.GetSheHe] acorrentado."
 yearly.1011.c:0 "Corte a garganta [abductee.GetHerHim] e enterre o corpo."
 yearly.1011.desc:0 "\"E [Select_CString( abductee.IsFemale, 'a sua', 'o seu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('abductee'))]?\" pergunta [hunter.GetFirstName]. \"Ninguém além do guarda [abductee.GetHerHim] viu ou ouviu alguma coisa. Tenho certeza de que há uma boa explicação, mas você deve saber — alguns d[Select_CString( dummy_gender.IsFemale, 'as', 'os' )] [dummy_gender.GetWomenMen] suspeitam que [abductee.GetSheHe] tenha ido voluntariamente...\""
 yearly.1013.a1:0 "Vou lidar com você em breve, [abductee.GetFirstNameNoTooltip]..."
 yearly.1013.a2:0 "Pelo menos [abductee.GetFirstNameNoTooltip] está a salvo..."
 yearly.1013.a3:0 "Você vai pagar por isso, [abductor.GetFirstNameNoTooltip]..."
 yearly.1013.abductee_lost.desc:0 "Me aproximo do portão, rezando para ver um vislumbre do rosto de [abductee.GetTitledFirstNamePossessive] ao virar da esquina. Mas todos os rostos que vejo são amargos, e nenhum deles é seu."
 yearly.1013.abductor_escaped_abductee_imprisoned.desc:0 "No entanto, a empreitada não foi um fracasso total. Embora eu tenha sido informado de que [abductor.GetTitledFirstName] escapou, [abductee.GetFirstName] não teve tanta sorte..."
 yearly.1013.abductor_escaped_abductee_killed.desc:0 "No entanto, a empreitada não foi um fracasso total. Enquanto [abductor.GetTitledFirstName] escapou, [hunter.GetFirstName] me assegura silenciosamente que [abductee.GetFirstName] foi colocado em uma sepultura rasa."
 yearly.1013.hunter_alive_start.desc:0 "Corro para o pátio, avistando imediatamente o rosto abatido de [hunter.GetFirstName]."
 yearly.1013.hunter_dead_abductee_lost.desc:0 "Olho ao redor, mas não há esperança à vista. Apenas rostos amargos.\n\n\"[abductor.GetTitledFirstName] levou [abductee.GetSheHe], meu senhor. Falhamos..."
 yearly.1013.hunter_dead_both_escaped.desc:0 "[abductor.GetTitledFirstName] e [abductee.GetTitledFirstName] escaparam entre meus dedos."
 yearly.1013.hunter_dead_start.desc:0 "Ao entrar no pátio, sou recebido apenas por rostos amargos e o corpo imóvel de [hunter.GetFirstName], repousando em uma maca improvisada."
 yearly.1013.start.desc:0 "A incerteza é insuportável. Uma hora passa, duas, três... Estou prestes a chamar meu cavalo quando ouço gritos do outro lado do portão.\n\n"
 yearly.1014.a:0 "Este é o destino que aguarda todos aqueles que cruzam o meu caminho!"
 yearly.1014.abductee_imprisoneid_abductor_killed.desc:0 "Ao lado [hunter.GetHerHim], com os olhos vendados e acorrentado, está [abductee.GetTitledFirstName].\n\nQuanto [Select_CString( abductee.IsFemale, 'a', 'ao' )] [abductor.GetTitledFirstName]... a ausência [abductor.GetHerHim] e a expressão no rosto de [hunter.GetFirstNamePossessive] me dizem que tudo correu conforme o planejado."
 yearly.1014.abductee_killed_abductor_imprison.desc:0 "Ao lado [hunter.GetHerHim], com os olhos vendados e acorrentado, está [abductor.GetTitledFirstName].\n\nQuanto [Select_CString( abductee.IsFemale, 'a', 'ao' )] [abductee.GetTitledFirstName]... a ausência [abductee.GetHerHim] e a expressão no rosto de [hunter.GetFirstNamePossessive] me dizem que tudo correu conforme o planejado."
 yearly.1014.abductee_saved_abductor_escaped.desc:0 "Envolto em um cobertor, sentado no cavalo [hunter.GetHerHim], está [abductee.GetFirstName]. Ileso.\n\nEnquanto ajudo [abductee.GetSheHe] a descer, lanço um olhar para [hunter.GetFirstName]. [hunter.GetSheHe|U] balança a cabeça. Não importa, pelo menos não agora. Lidaremos com [abductor.GetTitledFirstName] com o tempo."
 yearly.1014.abductee_saved_abductor_imprisoned.desc:0 "Envolto em um cobertor, sentado no cavalo [hunter.GetHerHim], está [abductee.GetFirstName]. A visão faz meu coração disparar.\n\nEntão, avisto outro rosto familiar: [abductor.GetTitledFirstName], acorrentado, sendo arrastado atrás de um dos outros cavalos. Excelente."
 yearly.1014.abductee_saved_abductor_killed.desc:0 "Envolto em um cobertor, sentado no cavalo [hunter.GetHerHim], está [abductee.GetFirstName]. Ileso.\n\nEnquanto ajudo [abductee.GetSheHe] a descer, lanço um olhar para [hunter.GetFirstName]. [hunter.GetSheHe|U] assente. [abductor.GetTitledFirstName] foi lidado."
 yearly.1014.both_imprisoned.desc:0 "[hunter.GetSheHe|U] segura uma corda em sua mão, à qual [hunter.GetSheHe] puxa. Duas pessoas tropeçam para a frente.\n\n[abductee.GetFirstName] e [abductor.GetFirstName] – amarrados e vendados."
 yearly.1014.both_killed.desc:0 "[hunter.GetSheHe|U] faz um gesto para eu segui-lo.\n\nAssim que estamos fora do alcance da audição, [hunter.GetFirstName] me conta tudo. Conforme [hunter.GetSheHe] descreve como eles morreram, onde foram enterrados e como, minha tensão se dissolve lentamente. Ninguém nunca saberá."
 yearly.1014.safe_hunter_start.desc:0 "Ao entrar no pátio, sou recebido com um largo sorriso de [hunter.GetFirstName]."
 yearly.1014.t:0 "Uma Caçada Bem-Sucedida"
 yearly.1015.a.paranoid:0 "[abductee.GetFirstNameNoTooltip] está escondendo algo, tenho certeza disso..."
 yearly.1015.a.trusting:0 "Obrigado [ROOT.Char.GetFaith.HighGodName] pelo retorno seguro de [abductee.GetFirstNamePossessiveNoTooltip]!"
 yearly.1015.a:0 "Eu não sei em que acreditar..."
 yearly.1015.escaped.desc:0 "[abductee.GetSheHe] viu uma oportunidade e conseguiu escapar. Embora pareça altamente improvável, coisas mais estranhas já aconteceram, com certeza...?"
 yearly.1015.immediate.tt:0 "[abductee.GetTitledFirstName] retornou à minha corte"
 yearly.1015.released.desc:0 "[abductor.GetTitledFirstName] decidiu libertar [abductee.GetSheHe]. Eu não achava que [abductor.GetTitledFirstNameNoTooltip] tinha um osso honrado em seu corpo, mas [abductee.GetFirstNameNoTooltip] está livre, não é verdade...?"
 yearly.1015.start.desc:0 "Quando [abductee.GetFirstName] apareceu nos portões na noite passada, pensei que o fantasma [abductee.GetHerHim] tinha voltado para me assombrar. Eu havia começado a acreditar que nunca mais veria [abductee.GetSheHe], no entanto, [abductee.GetSheHe] estava lá, tão real quanto o chão sob meus pés.\n\n[abductee.GetFirstNameNoTooltip] não disse muitas palavras desde seu retorno, apenas que"
 yearly.1015.t:0 "Meu Cordeiro Perdido"
 yearly.1020.a.capture.desc:0 "Eu capturo [enemy.GetTitledFirstNameNoTooltip]"
 yearly.1020.a.capture.tt:0 "[vip.GetTitledFirstName] entregará o restante do dinheiro quando [vip.GetSheHe] coletar [enemy.GetTitledFirstName]"
 yearly.1020.a.escape.desc:0 "[enemy.GetTitledFirstNameNoTooltip] escapa"
 yearly.1020.a.kill.desc:0 "[enemy.GetTitledFirstNameNoTooltip] é mort[Select_CString( enemy.IsFemale, 'a', 'o' )] na emboscada"
 yearly.1020.a.kill.message:0 "[enemy.GetTitledFirstName] foi mort[Select_CString( enemy.IsFemale, 'a', 'o' )] na emboscada."
 yearly.1020.a.rl.t:0 "Em alguns dias"
 yearly.1020.a:0 "Eu sei o lugar perfeito para uma emboscada..."
 yearly.1020.b.failure.desc:0 "[vip.GetTitledFirstNameNoTooltip] descobre que eu avisei [enemy.GetTitledFirstNameNoTooltip]"
 yearly.1020.b.success.desc:0 "[vip.GetTitledFirstNameNoTooltip] acredita que eu embosquei [enemy.GetTitledFirstNameNoTooltip]"
 yearly.1020.b.success.tt:0 "[vip.GetTitledFirstName] nunca saberá que agi pelas costas [vip.GetHerHim]"
 yearly.1020.b:0 "Vou fingir aceitar, mas vou avisar [enemy.GetFirstNameNoTooltip] secretamente."
 yearly.1020.c:0 "Este acordo parece ser muito perigoso."
 yearly.1020.desc:0 "Em alguns dias, m[Select_CString( enemy.IsFemale, 'inha', 'eu' )] [vip.Custom2('RelationToMeShort', SCOPE.sC('enemy'))] [enemy.Custom2('InsultAdjective', SCOPE.sC('vip'))], [enemy.GetTitledFirstName], viajará através de [my_county.GetNameNoTierNoTooltip]. Se você orquestrar uma emboscada e capturar [enemy.GetSheHe], eu o recompensarei generosamente.\n\nSe você aceitar minha oferta, receberá metade do dinheiro agora e a outra metade quando entregar [enemy.GetTitledFirstNameNoTooltip]. Se [enemy.GetSheHe] morrer na refrega, eu não derramarei lágrimas, mas também não pagarei pelo corpo [enemy.GetHerHim].\n\nConfio que as palavras neste pergaminho permanecerão entre nós. Aguardo sua resposta com expectativa."
 yearly.1020.opening:0 "[vip.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.1021.a:0 "Oh, o prazer é todo meu."
 yearly.1021.b.tt:0 "[enemy.GetTitledFirstName] permanecerá meu prisioneiro"
 yearly.1021.b:0 "Na verdade, acho que vou manter [enemy.GetSheHe]!"
 yearly.1021.desc:0 "O espião que eu havia infiltrado na festa de [enemy.GetTitledFirstNamePossessive] me enviou seu relatório. Meu Deus, foi uma leitura emocionante! Com certeza, aquela expressão arrogante desapareceu do rosto de [enemy.GetFirstNameNoTooltip] agora!\n\nOs soldados que irão coletar aquel[Select_CString( enemy.IsFemale, 'a', 'e' )] [enemy.Custom2('InsultNoun', SCOPE.sC('vip'))] [enemy.Custom2('InsultAdjective', SCOPE.sC('vip'))] já estão a caminho, e sim, eles trouxeram o ouro.\n\nFoi um prazer fazer negócios com você, [ROOT.Char.GetLadyLord|U] [ROOT.Char.GetFirstNameNoTooltip]. Espero que nossos caminhos se cruzem novamente."
 yearly.1022.a:0 "E você, [enemy.GetLadyLord] [enemy.GetFirstNameNoTooltip]."
 yearly.1022.desc:0 "Você é [Select_CString( ROOT.Char.IsFemale, 'uma', 'um' )] [ROOT.Char.GetWomanMan] muito [Select_CString( ROOT.Char.IsFemale, 'honrada', 'honrado' )], [ROOT.Char.GetLadyLord|U] [ROOT.Char.GetFirstNameNoTooltip]. Eu lhe devo minha liberdade - talvez até minha vida. Quem sabe o que aquel[Select_CString( vip.IsFemale, 'a', 'e' )] [vip.Custom2('InsultNoun', SCOPE.sC('enemy'))] [vip.Custom2('InsultAdjective', SCOPE.sC('enemy'))] [vip.GetTitledFirstName] teria feito comigo se eu tivesse acabado na masmorra [vip.GetHerHim]?\n\nEu vou retribuir, eu juro. Até lá, mantenha-se seguro."
 yearly.1022.opening:0 "[enemy.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.1023.a:0 "Isso poderia ter corrido melhor..."
 yearly.1023.desc:0 "Você realmente achou que poderia escapar com seu pequeno esquema? Eu tenho olhos em todos os lugares, [ROOT.Char.GetLadyLord|U] [ROOT.Char.GetFirstNameNoTooltip], e a partir de agora eles vão segui-lo de perto.\n\nEu juro pela minha vida - você vai se arrepender do dia em que decidiu cruzar meu caminho."
 yearly.1023.opening:0 "[vip.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 yearly.1030.a.secret_cannibal.desc:0 "sobre o apetite de [secret_character.GetTitledFirstNamePossessive] por carne humana!"
 yearly.1030.a.secret_deviant.desc:0 "sobre a perversão de [secret_character.GetTitledFirstNamePossessive]!"
 yearly.1030.a.secret_heretic.desc:0 "sobre as práticas heréticas de [secret_character.GetTitledFirstNamePossessive]!"
 yearly.1030.a.secret_homosexual.desc:0 "sobre a luxúria de [secret_character.GetTitledFirstNamePossessive] [Select_CString( secret_character.IsFemale, 'pelas', 'pelos' )] [secret_character.GetWomenMen]!"
 yearly.1030.a.secret_incest.desc:0 "sobre o relacionamento incestuoso entre [secret_character.GetTitledFirstName] e um dos parentes próximos [secret_character.GetHerHim]!"
 yearly.1030.a.secret_lover.desc:0 "sobre o relacionamento carnal secreto entre [secret_character.GetTitledFirstName] e [secret_target.GetTitledFirstName]!"
 yearly.1030.a.secret_murder.desc:0 "[secret_character.GetTitledFirstName] foi o responsável pela morte prematura de [secret_target.GetTitledFirstNamePossessive]!"
 yearly.1030.a.secret_murder_attempt.desc:0 "sobre a tentativa de assassinato fracassada de [secret_character.GetTitledFirstNamePossessive] contra [secret_target.GetTitledFirstNameOrMe]!"
 yearly.1030.a.secret_witch.desc:0 "que [secret_character.GetTitledFirstName] é [Select_CString( secret_character.IsFemale, 'uma bruxa', 'um bruxo' )]!"
 yearly.1030.a.start.desc:0 "Segredo Descoberto"
 yearly.1030.a.tt:0 "[hooked.GetTitledFirstName] vai me contar um [secret|E] sobre [secret_character.GetTitledFirstName]"
 yearly.1030.a:0 "Eu juro, depois disso, você não me deve mais nada."
 yearly.1030.b.tt:0 "Eu forço [hooked.GetTitledFirstName] a me contar um [secret|E] sobre [secret_character.GetTitledFirstName]"
 yearly.1030.b:0 "Você acha que pode fazer exigências? Conte-me, ou então!"
 yearly.1030.c:0 "Prefiro tê-lo sob meu controle do que [secret_character.GetSheHe]."
 yearly.1030.confident.desc:0 "O anúncio da minha guarda sobre a visita retira toda a sonolência da minha mente. Quem poderia estar me perturbando a essa hora?\n\nMinha visitante noturna não é outra senão [hooked.GetTitledFirstName]. \"Eu preciso falar com você em particular, longe de ouvidos curiosos. Descobri algo #EMP muito#! interessante.\""
 yearly.1030.end.desc:0 "\n\n[hooked.GetTitledFirstNameNoTooltip] descobriu um segredo de [secret_character.GetTitledFirstNamePossessive]. [hooked.GetSheHe|U] está disposto a compartilhá-lo comigo se eu deixá-lo escapar."
 yearly.1030.nervous.desc:0 "[hooked.GetTitledFirstName] está mexendo nervosamente na manga enquanto eu abro a porta para os meus aposentos. O que [hooked.GetSheHe] está fazendo aqui a esta hora?\n\n\"Peço as mais sinceras desculpas, mas preciso falar com você em particular. Descobri algo muito interessante.\""
 yearly.1030.t:0 "Cada [hooked.GetWomanMan|U] por [hooked.GetHerselfHimself|U]"
 yearly.1040.a.tt:0 "Vou descobrir o que [suspicious.GetTitledFirstName] está escondendo, seja bom ou ruim"
 yearly.1040.a:0 "\"O que você está escondendo? Mostre-me imediatamente!\""
 yearly.1040.b.failure.desc:0 "Sou descoberto [Select_CString( suspicious.IsFemale, 'pela', 'pelo' )] [suspicious.GetTitledFirstNameNoTooltip]"
 yearly.1040.b.success.desc:0 "Eu encontro o pergaminho"
 yearly.1040.b:0 "Volte mais tarde e procure nos aposentos [suspicious.GetHerHim] em segredo."
 yearly.1040.c:0 "Respeite a privacidade [suspicious.GetHerHim]."
 yearly.1040.council_meeting.desc:0 "Mais uma vez, [suspicious.GetTitledFirstName] está atrasado para uma reunião do conselho. Desta vez, não vou deixar passar em branco! Quando chego aos aposentos de [suspicious.GetFirstNamePossessiveNoTooltip], não dou a cortesia de bater.\n\n"
 yearly.1040.dinner.desc:0 "Com a mente focada em uma noite relaxante, estou indo para os aposentos [Select_CString( suspicious.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', suspicious)] [suspicious.GetFirstNamePossessive] com algumas [ROOT.Char.Custom('RegionalDrink')] e um [ROOT.Char.Custom('RegionalGameObject')]. Sem bater, empurro a porta [suspicious.GetHerHim].\n\n"
 yearly.1040.end.desc:0 "[suspicious.GetTitledFirstNameNoTooltip] está sentado à mesa, escrevendo furiosamente. Ao limpar minha garganta, [suspicious.GetSheHe] dá um salto. [suspicious.GetSheHe|U] rapidamente enfia um rolo de pergaminho no bolso e se vira para mim com um olhar inquieto no rosto."
 yearly.1040.t:0 "Uma Visita Inesperada"
 yearly.1040.tumble.desc:0 "Cheguei aos aposentos [Select_CString( suspicious.IsFemale, 'da minha querida', 'do meu querido' )] [suspicious.GetFirstNamePossessive], sem ser visto nem ouvido. Com saudades no meu coração - e nas minhas partes íntimas - empurro lentamente a porta.\n\n"
 yearly.1040.vassal_talk.desc:0 "Desde que [Select_CString( suspicious.IsFemale, 'minha vassala', 'meu vassalo' )] [suspicious.GetTitledFirstName] chegou à corte, conforme meu generoso convite, [suspicious.GetSheHe] mal saiu de seu aposento. Exijo uma explicação!\n\nQuando abro a porta,"
 yearly.1041.a.bad:0 "Prova escrita. Que atencioso."
 yearly.1041.a.good:0 "Eu... Eu sinto muito. Eu não fazia ideia!"
 yearly.1041.cross_arm.desc:0 "[suspicious.GetFirstNameNoTooltip] me entrega o pergaminho amassado e cruza os braços."
 yearly.1041.feast.desc:0 "É uma lista de comidas e bebidas, e muitos nomes familiares, incluindo o do meu [ROOT.Char.Custom('MusicalPerformer')] favorito...\n\n\"Deveria ser uma surpresa. Pensei que seria um gesto legal organizar um banquete em sua homenagem, mas é assim que você me agradece...\""
 yearly.1041.feast.tt:0 "Se eu não tivesse estragado a surpresa de [suspicious.GetTitledFirstNamePossessive], teria ganhado [prestige|E]"
 yearly.1041.friend.desc:0 "Alguém está aceitando um convite, expressando felicidade e empolgação em passar um tempo com... eu! Quem escreveu isso é [Select_CString( secret_friend.IsFemale, 'minha amiga', 'meu amigo' )], [secret_friend.GetTitledFirstName]!\n\n\"Isso deveria ser uma surpresa, uma viagem divertida e relaxante para vocês dois... Agora está tudo arruinado!"
 yearly.1041.friend.tt:0 "Se eu não tivesse estragado a surpresa de [suspicious.GetTitledFirstNamePossessive], teria reduzido meu [stress|E] e aumentado minha [opinion|E] com [secret_friend.GetTitledFirstName]"
 yearly.1041.gift.desc:0 "É uma carta. Há algo sobre uma transação financeira e as especificações para um [ROOT.Char.Custom('SuitableGiftItem')] personalizado com o brasão da [ROOT.Char.GetDynastyNameNoTooltip]...\n\n\"Eu queria te surpreender, te dar algo para mostrar minha gratidão. E agora tudo foi em vão!\""
 yearly.1041.gift.tt:0 "Se eu não tivesse estragado a surpresa de [suspicious.GetTitledFirstNamePossessive], teria recebido uma quantia de [gold|E]"
 yearly.1041.hostile_scheme_agent_me.desc:0 "É uma lista de horários e lugares, coisas ouvidas e vistas. Coisas que eu disse e fiz! [suspicious.GetFirstNameNoTooltip] tem reportado minhas atividades, ajudando alguém a conspirar contra mim!"
 yearly.1041.hostile_scheme_agent_other.desc:0 "É uma lista de horários e lugares, coisas ouvidas e vistas. Coisas privadas... [suspicious.GetFirstNameNoTooltip] está ajudando alguém a conspirar contra m[Select_CString( scheme_target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scheme_target'))] [scheme_target.GetFirstName]!"
 yearly.1041.middle.desc:0 "\n\n"
 yearly.1041.secret_angry.desc:0 "Eu leio a carta, horrorizado. É uma acusação convincente, afirmando que [suspicious.GetFirstNameNoTooltip] [secret.Custom('SecretDescriptionThirdPerson')]!"
 yearly.1041.secret_wicked.desc:0 "Ora, ora, ora. Que deliciosamente perverso. De acordo com esta carta de chantagem, [suspicious.GetFirstNameNoTooltip] [secret.Custom('SecretDescriptionThirdPerson')]!"
 yearly.1041.shivering_hand.desc:0 "Com uma mão trêmula, [suspicious.GetFirstNameNoTooltip] me oferece o pergaminho amassado."
 yearly.1041.start.desc:0 "[suspicious.GetSheHe] realmente achou que eu não veria isso? \"Dê-me isso! Imediatamente!\""
 yearly.1042.a.good:0 "Isso não era o que eu esperava."
 yearly.1042.feast.desc:0 "É uma lista de comidas e bebidas, e muitos nomes familiares, incluindo o do meu [ROOT.Char.Custom('MusicalPerformer')] favorito...\n\nParece que [suspicious.GetFirstNameNoTooltip] está planejando me surpreender com um banquete realizado em minha homenagem!"
 yearly.1042.friend.desc:0 "Alguém está aceitando um convite, expressando felicidade e empolgação em passar um tempo comigo! A pessoa que escreveu isso é [Select_CString( secret_friend.IsFemale, 'minha amiga', 'meu amigo' )], [secret_friend.GetTitledFirstName]!\n\nParece que [suspicious.GetFirstNameNoTooltip] está planejando me surpreender com uma viagem junto com [secret_friend.GetFirstNameNoTooltip]!"
 yearly.1042.gift.desc:0 "É uma carta. Há algo sobre uma transação financeira e as especificações para um [ROOT.Char.Custom('SuitableGiftItem')] personalizado com o brasão da [ROOT.Char.GetDynastyNameNoTooltip]...\n\nParece que [suspicious.GetFirstNameNoTooltip] está planejando me surpreender com um presente!"
 yearly.1042.good.tt:0 "Vou agir como se não soubesse de nada quando [suspicious.GetTitledFirstName] revelar a surpresa"
 yearly.1042.start.desc:0 "Enquanto vasculho as coisas [suspicious.GetHerHim], [suspicious.GetTitledFirstName] dorme como um bebê. O sedativo que coloquei em seu [suspicious.Custom('RegionalDrink')] certamente fez efeito! Em questão de minutos, encontro o pedaço de pergaminho que [suspicious.GetSheHe] escondeu de mim...\n\n"
 yearly.1043.a.tt:0 "Eu não descobri o que [suspicious.GetTitledFirstName] estava escondendo"
 yearly.1043.a:0 "Eu... estava de saída."
 yearly.1043.desc:0 "Eu vasculho as coisas de [suspicious.GetTitledFirstNamePossessive], sentindo meu pulso acelerar. Onde está aquele maldito pedaço de pergaminho?\n\n\"Ah... [ROOT.Char.GetFirstNameNoTooltip]? O que você está fazendo aqui?!\"\n\nViro-me e encontro um[Select_CString( suspicious.IsFemale, 'a', '' )] [suspicious.GetFirstNameNoTooltip] sonolent[Select_CString( suspicious.IsFemale, 'a', 'o' )], mas decididamente indignad[Select_CString( suspicious.IsFemale, 'a', 'o' )], saindo da cama. Parece que o sedativo que coloquei na bebida [suspicious.GetHerHim] à noite não teve o efeito esperado..."
 yearly.1043.t:0 "Pego em Flagrante"
 yearly.1044.a:0 "Obrigado, [suspicious.GetFirstNameNoTooltip]!"
 yearly.1044.feast.desc:0 "[suspicious.GetFirstNameNoTooltip] faz um gesto para eu segui-la, e me leva ao salão. Quando [suspicious.GetSheHe] abre a porta, alguém começa a tocar uma melodia alegre. Oh meu... as decorações, o cheiro! E todos estão aqui!\n\n\"É um banquete, em sua homenagem! Deixe-me pegar uma taça de [ROOT.Char.Custom('RegionalDrink')] para você!\""
 yearly.1044.friend.desc:0 "[suspicious.GetFirstNameNoTooltip] faz um gesto para eu segui-la, e me leva ao pátio. Montado em seu cavalo e vestido para viajar está [secret_friend.GetTitledFirstName]!\n\n\"Eu organizei uma pequena viagem para vocês dois!\" [suspicious.GetFirstNameNoTooltip] diz animada. \"Pensei que vocês poderiam usar um tempo de qualidade juntos!\""
 yearly.1044.gift.desc:0 "[suspicious.GetFirstNameNoTooltip] me entrega um presente cuidadosamente embrulhado, decorado com fitas coloridas. \"Eu queria te surpreender. Eu o mandei fazer sob medida, só existe um igual. Vá em frente, abra!\""
 yearly.1044.start.desc:0 "Um sorriso travesso brinca nos lábios de [suspicious.GetTitledFirstNamePossessive]. \"Eu sei que tenho agido de maneira estranha ultimamente, e por isso peço desculpas. Mas eu tinha uma boa razão!\"\n\n"
 yearly.1044.t:0 "Um Gestoda de Apreciação"
 yearly.1050.a:0 "Esses duelos cessarão imediatamente."
 yearly.1050.angry.desc:0 "[angry_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] chegou com o braço enfaixado e uma ardente sede de vingança. [angry_vassal.GetSheHe|U] me diz que [Select_CString( heir.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))], [heir.GetTitledFirstName], esteve “causando destruição” por toda [title.GetNameNoTierNoTooltip].\n\n\"[Select_CString( heir.IsFemale, 'Sua', 'Seu' )] [heir.Custom('GirlBoy')] se acha um duelista – [heir.GetSheHe] apareceu na porta da minha casa e me desafiou na frente de todo mundo! Eu não tive escolha a não ser aceitar. E não foi a primeira vez. Eu sou apenas o último de uma longa fila de vítimas!\""
 yearly.1050.b:0 "Um passatempo perigoso. Você precisa de um instrutor."
 yearly.1050.c.failure.tt:0 "[heir.GetTitledFirstName] continuará desafiando pessoas para duelos"
 yearly.1050.c.failure.wounded.tt:0 "Eu posso sair ferido"
 yearly.1050.c.success.tt:0 "[heir.GetTitledFirstName] não duelará mais"
 yearly.1050.c.success.wounded.tt:0 "[heir.GetTitledFirstName] pode sair ferid[Select_CString( heir.IsFemale, 'a', 'o' )]"
 yearly.1050.c:0 "Ah! S[Select_CString( ROOT.Char.IsFemale, 'ua', 'eu' )] [heir.Custom2('RelationToMeShort', ROOT.Char)] vai mostrar como se faz!"
 yearly.1050.critical_success.desc:0 "Eu derroto [heir.GetFirstNameNoTooltip]"
 yearly.1050.failure.desc:0 "Eu perco o duelo"
 yearly.1050.scared.desc:0 "[angry_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] chegou à corte com o braço enfaixado e medo nos olhos. [angry_vassal.GetSheHe|U] me conta que m[Select_CString( heir.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))], [heir.GetTitledFirstName], tem desafiado pessoas para duelos por todo [title.GetNameNoTierNoTooltip].\n\n\"Por favor, me perdoe, [ROOT.Char.Custom('FormOfAddressForLiege')], mas isso precisa parar. [heir.GetTitledFirstNameNoTooltip] apareceu na minha porta e me desafiou, não tive escolha a não ser aceitar. Isso não é a primeira vez, aliás. Sou apenas o último em uma longa lista de vítimas!\""
 yearly.1050.t:0 "O Grande Duelista"
 yearly.1051.decent.a:0 "Você vai descansar agora, [heir.GetFirstNameNoTooltip]?"
 yearly.1051.decent.desc:0 "[heir.GetTitledFirstName] retornou de suas aventuras como um[Select_CString( heir.IsFemale, 'a', '' )] [heir.GetWomanMan] mais forte. Embora [heir.GetSheHe] tenha perdido alguns duelos e irritado mais alguns de meus vassalos, [heir.GetSheHe] também teve sua parcela de vitórias e ganhou valiosa experiência.\n\nAgora, pode ser hora de apaziguar [angry_vassal_2.GetTitledFirstName]. [heir.GetFirstNameNoTooltip] poderia ter sido mais gentil com [angry_vassal_2.GetSheHe]..."
 yearly.1051.defeat.a:0 "Você me envergonha."
 yearly.1051.defeat.desc:0 "[heir.GetTitledFirstName] finalmente retornou com o rabo entre as pernas. [Select_CString( heir.IsFemale, 'A', 'O' )] [heir.Custom('GirlBoy')] imprudente viajou por todo o reino e desafiou vassalo após vassalo, apenas para perder todos os duelos.\n\nDepois de uma derrota humilhante nas mãos de [angry_vassal_2.GetTitledFirstName], [heir.GetSheHe] finalmente parece ter aprendido a lição."
 yearly.1051.great_victory_end.desc:0 "[heir.GetFirstNameNoTooltip] até derrotou o grande campeão [angry_vassal_2.GetTitledFirstName]!"
 yearly.1051.murder.a:0 "Você matou [angry_vassal_2.GetTitledFirstNameNoTooltip]?!"
 yearly.1051.murder.desc:0 "Antes mesmo de [heir.GetTitledFirstName] abrir a boca, posso dizer que será ruim. O pânico nos olhos [heir.GetHerHim] é muito diferente do normal.\n\n\"Por favor, [heir.Custom2('RelationToMeShort', ROOT.Char)], você tem que me ajudar. Eu não quis... [angry_vassal_2.GetSheHe|U] não era para morrer!\""
 yearly.1051.regular_victory_end.desc:0 "A vitória [heir.GetHerHim] contra [angry_vassal_2.GetTitledFirstName] dizem que foi especialmente impressionante."
 yearly.1051.t:0 "O Duelista Retorna"
 yearly.1051.victorious.a:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('heir'))|U], você me deixou orgulhoso."
 yearly.1051.victory.desc:0 "Quando [heir.GetTitledFirstName] retornou de sua aventura, todos na corte estavam lá para ver [heir.GetSheHe]. Alguns deles aplaudiram e expressaram sua admiração, enquanto outros ficaram... menos impressionados.\n\nMas ninguém pode negar que [heir.GetFirstNameNoTooltip] provou ser [Select_CString( heir.IsFemale, 'uma boa', 'um bom' )] duelista após derrotar [heir.GetLadyLord] após [heir.GetLadyLord]."
 yearly.1060.a.tt:0 "Eu me pergunto o que [joker.GetFirstNameNoTooltip] quer ouvir?\n"
 yearly.1060.a:0 "Uma chave."
 yearly.1060.amused.message:0 "[joker.GetFirstNameNoTooltip] está divertid[Select_CString( joker.IsFemale, 'a', 'o' )]"
 yearly.1060.b:0 "Uma espada."
 yearly.1060.bed.desc:0 "[joker.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se apoia em um cotovelo, com os lábios curvados em um sorriso travesso."
 yearly.1060.c.female:0 "Talvez você pudesse me mostrar?"
 yearly.1060.c.male:0 "Você quer que eu mostre?"
 yearly.1060.charmed.message:0 "[joker.GetFirstNameNoTooltip] está encantad[Select_CString( joker.IsFemale, 'a', 'o' )]"
 yearly.1060.crude.message:0 "[joker.GetFirstNameNoTooltip] me acha grosseir[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]"
 yearly.1060.d:0 "Eu não sei do que você está falando..."
 yearly.1060.dance.desc:0 "[joker.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se move graciosamente com a música, seus olhos brilhando de alegria. Quando a dança nos aproxima, [joker.GetSheHe] se inclina para perto de mim e sussurra no meu ouvido."
 yearly.1060.dinner.desc:0 "[joker.Custom2('MyCharacterIntroduction', ROOT.Char)|U] gira a taça de [joker.Custom('RegionalDrink')] e se inclina na minha direção com um sorriso travesso."
 yearly.1060.disappointed.message:0 "[joker.GetFirstNameNoTooltip] está desapontad[Select_CString( joker.IsFemale, 'a', 'o' )]"
 yearly.1060.e:0 "Que vulgar!"
 yearly.1060.garden.desc:0 "Enquanto passeamos pelos jardins, [joker.Custom2('MyCharacterIntroduction', ROOT.Char)] se inclina na minha direção com um sorriso travesso."
 yearly.1060.joke.desc:0 "\n\n\"Então, [ROOT.Char.GetFirstNameNoTooltip]... O que fica na coxa de um homem e quer enfiar o buraco que já enfiou muitas vezes antes?\""
 yearly.1060.reveal_secret.tt:0 "[joker.GetTitledFirstName] saberá do meu segredo"
 yearly.1060.ride.desc:0 "[joker.Custom2('MyCharacterIntroduction', ROOT.Char)|U] puxa as rédeas do cavalo e dá um tapinha no pescoço do animal. Quando [joker.GetSheHe] olha para cima para mim, posso ver o rubor nas bochechas [joker.GetHerHim] e o olhar travesso nos olhos [joker.GetHerHim]."
 yearly.1060.sex.tt:0 "[joker.GetFirstNameNoTooltip] e eu nos divertimos bastante"
 yearly.1060.sex_and_maybe_lover.tt:0 "[joker.GetFirstNameNoTooltip] e eu passamos a noite juntos..."
 yearly.1060.t:0 "A Piada Mais Antiga do Livro"
 yearly.1060.very_charmed.message:0 "[joker.GetFirstNameNoTooltip] está muito encantad[Select_CString( joker.IsFemale, 'a', 'o' )]"
 yearly.1070.a:0 "Expressarei meu amor eterno por [potential_soulmate.GetSheHe]!"
 yearly.1070.b:0 "Esse desejo não vem do coração..."
 yearly.1070.benevolent.desc:0 "a maneira gentil com que [potential_soulmate.GetSheHe] trata todos, nobres e plebeus?"
 yearly.1070.c:0 "Escreverei um pequeno poema para [potential_soulmate.GetSheHe]!"
 yearly.1070.d:0 "Recuso-me a ser distraído por qualquer [potential_soulmate.GetWomanMan]!"
 yearly.1070.dominant.desc:0 "sua vontade de ferro inabalável?"
 yearly.1070.emotional.desc:0 "natureza emocional e indomada?"
 yearly.1070.end.desc:0 "\n\nEu não consigo entender completamente, mas pelo menos uma coisa eu sei com certeza: quando estou na presença [potential_soulmate.GetHerHim], é difícil me concentrar em qualquer outra coisa."
 yearly.1070.extroverted.desc:0 "como [potential_soulmate.GetSheHe] faz com que todas as conversas pareçam tão fáceis e agradáveis?"
 yearly.1070.fair.desc:0 "características notavelmente justas [potential_soulmate.GetHerHim]?"
 yearly.1070.fallback.desc:0 "belos olhos [potential_soulmate.GetHerHim]?"
 yearly.1070.handsome.desc:0 "características regalmente belas [potential_soulmate.GetHerHim]?"
 yearly.1070.intelligent.desc:0 "mentes impressionantemente afiadas [potential_soulmate.GetHerHim]?"
 yearly.1070.introverted.desc:0 "a maneira como seus olhos expressam tanto, mesmo quando nenhuma palavra sai de seus lábios?"
 yearly.1070.levelheaded.desc:0 "compostura nobre e inabalável [potential_soulmate.GetHerHim]?"
 yearly.1070.middle.desc:0 "da risada [potential_soulmate.GetHerHim], ou talvez"
 yearly.1070.peal.desc:0 "badalada"
 yearly.1070.rumble.desc:0 "ronco"
 yearly.1070.scheme.tt:0 "O [scheme|E] terá um bônus de [success_chance|E]"
 yearly.1070.start.desc:0 "Há algo peculiar sobre [potential_soulmate.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. É a maneira como [potential_soulmate.GetSheHe] sorri? A inconfundível"
 yearly.1070.submissive.desc:0 "sua maneira gentil?"
 yearly.1070.t:0 "Atraído pela Chama"
 yearly.1070.zealous.desc:0 "devoção inabalável [potential_soulmate.GetHerHim] a [ROOT.Char.GetFaith.HighGodName]?"
 yearly.1080.a.failure:0 "A investigação de [investigator.GetTitledFirstNamePossessiveNoTooltip] falha"
 yearly.1080.a.friend:0 "[Select_CString( investigator.IsFemale, 'Minha confiável amiga', 'Meu confiável amigo' )] [investigator.GetFirstNameNoTooltip] deve investigar."
 yearly.1080.a.spymaster:0 "[Select_CString( investigator.IsFemale, 'A espiã', 'O espião' )] [investigator.GetFirstNameNoTooltip] deve investigar."
 yearly.1080.a.success.tt:0 "Se [suspicious.GetShortUIName] estiver escondendo algo, será revelado"
 yearly.1080.a.success:0 "A investigação de [investigator.GetTitledFirstNamePossessiveNoTooltip] tem sucesso"
 yearly.1080.b.failure:0 "Sua investigação falha"
 yearly.1080.b.success:0 "Sua investigação tem sucesso"
 yearly.1080.b:0 "Vou investigar isso imediatamente."
 yearly.1080.c.failure:0 "[suspicious.GetFirstNameNoTooltip] nega tudo"
 yearly.1080.c.lunatic:0 "[suspicious.GetFirstNameNoTooltip] acalma seus medos"
 yearly.1080.c.success:0 "[suspicious.GetFirstNameNoTooltip] diz a verdade"
 yearly.1080.c:0 "\"O que está acontecendo aqui, [suspicious.GetFirstNameNoTooltip]? Diga-me a verdade!\""
 yearly.1080.d:0 "Estou ficando paranóico..."
 yearly.1080.normal.desc:0 "Há algo estranho em [suspicious.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], mas não consigo identificar exatamente o que é. Talvez seja apenas minha imaginação correndo solta - no entanto, esse sentimento sinistro está me mantendo acordado à noite."
 yearly.1080.paranoid.desc:0 "M[Select_CString( suspicious.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('suspicious'))] [suspicious.Custom2('InsultAdjective', ROOT.Char)] [suspicious.GetTitledFirstName] está planejando algo, eu sei! Por que [suspicious.GetSheHe] se esgueira por aí assim, me lançando olhares estranhos? E minhas coisas não estão onde deixei! [suspicious.GetSheHe] esteve nos meus aposentos?!\n\n[suspicious.GetSheHe|U] sorri tão docemente, mas eu sei o que esconde por baixo!"
 yearly.1080.t:0 "Uma Suspeita Insidiosa"
 yearly.1081.a:0 "Eu sabia!"
 yearly.1081.abduct.desc:0 "[suspicious.GetSheHe|U] estava planejando sequestrar"
 yearly.1081.agent_abduct.desc:0 "[suspicious.GetSheHe|U] está trabalhando para alguém que está planejando sequestrar"
 yearly.1081.agent_elope.desc:0 "[suspicious.GetSheHe|U] está trabalhando para alguém que está planejando fugir com"
 yearly.1081.agent_murder.desc:0 "[suspicious.GetSheHe|U] está trabalhando para alguém que está planejando assassinar"
 yearly.1081.agent_scheme_type_fallback.desc:0 "[suspicious.GetSheHe|U] está trabalhando para alguém que está tramando contra"
 yearly.1081.agent_seduce.desc:0 "[suspicious.GetSheHe|U] está trabalhando para alguém que está planejando seduzir"
 yearly.1081.elope.desc:0 "[suspicious.GetSheHe|U] estava planejando fugir com"
 yearly.1081.investigator_start.desc:0 "[investigator.GetTitledFirstName] descobriu provas irrefutáveis da culpa de [suspicious.GetTitledFirstNamePossessive]."
 yearly.1081.me.desc:0 "mim!"
 yearly.1081.murder.desc:0 "[suspicious.GetSheHe|U] estava planejando assassinar"
 yearly.1081.my_introduction.desc:0 "[target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 yearly.1081.scheme_type_fallback.desc:0 "[suspicious.GetSheHe|U] estava tramando contra"
 yearly.1081.secret.desc:0 "[suspicious.GetSheHe|U] [guilty_owned_secret.Custom('SecretDescriptionThirdPerson')]!"
 yearly.1081.seduce.desc:0 "[suspicious.GetSheHe|U] estava planejando seduzir"
 yearly.1081.traitor_end.desc:0 "\n\n[Select_CString( suspicious.IsFemale, 'Essa traidora', 'Esse traidor' )] [suspicious.Custom2('InsultAdjective', ROOT.Char)] receberá o que [suspicious.GetSheHe] merece!"
 yearly.1081.useful_end.desc:0 "\n\nEss[Select_CString( suspicious.IsFemale, 'a', 'e' )] [suspicious.Custom2('InsultNoun', ROOT.Char)] astut[Select_CString( suspicious.IsFemale, 'a', 'o' )]! Essas informações certamente serão úteis."
 yearly.1081.you_start.desc:0 "Durante minha investigação, descobri provas irrefutáveis da culpa de [suspicious.GetTitledFirstNamePossessive]."
 yearly.1082.a.tt:0 "[suspicious.GetShortUIName|U] parece inocente"
 yearly.1082.a:0 "Melhor prevenir do que remediar!"
 yearly.1082.investigator_start.desc:0 "[investigator.GetTitledFirstName] concluiu sua investigação das atividades de [suspicious.GetTitledFirstNamePossessive] de mãos vazias. [investigator.GetSheHe|U] não encontrou provas de atividade criminosa ou outros atos obscuros - nem mesmo rumores suspeitos."
 yearly.1082.normal.desc:0 "\n\nEmbora pareça que eu estava enganado desta vez, não foi tempo perdido. Hoje à noite, dormirei como um bebê."
 yearly.1082.paranoid.desc:0 "\n\n[suspicious.GetFirstNameNoTooltip] pode ser inocente desta vez, mas ainda há algo n[suspicious.GetSheHe] que me incomoda. Vou manter os olhos n[suspicious.GetSheHe], com certeza."
 yearly.1082.you_start.desc:0 "Me escondi nas sombras, fui a tavernas suspeitas e virei cada pedra - ainda assim, não encontrei provas condenatórias contra [suspicious.GetTitledFirstName]. Nem mesmo um rumor suspeito!"
 yearly.1083.a.tt:0 "A investigação de [suspicious.GetShortUIName] falhou"
 yearly.1083.a:0 "Vou manter um olho n[suspicious.GetSheHe], com certeza."
 yearly.1083.investigator_start.desc:0 "[investigator.GetTitledFirstName] retornou para mim de mãos vazias. \"Não encontrei provas condenatórias contra [suspicious.GetTitledFirstName], e talvez [suspicious.GetSheHe] seja de fato inocente. Mas não posso garantir - [suspicious.GetSheHe] é um[Select_CString( suspicious.IsFemale, 'a', '' )] [suspicious.GetWomanMan] cuidados[Select_CString( suspicious.IsFemale, 'a', 'o' )]. Somente [investigator.GetFaith.HighGodName] sabe o que [suspicious.GetSheHe] pode estar escondendo.\""
 yearly.1083.you_start.desc:0 "Minha investigação de [suspicious.GetTitledFirstName] não descobriu nada digno de nota, exceto que [suspicious.GetSheHe] parece ser uma pessoa excepcionalmente cuidadosa. Só [ROOT.Char.GetFaith.HighGodName|U] sabe o que [suspicious.GetSheHe] pode estar escondendo."
 yearly.1084.a:0 "Joguem [suspicious.GetSheHe] na masmorra!"
 yearly.1084.b:0 "Saia da minha vista, s[Select_CString( suspicious.IsFemale, 'ua', 'eu' )] [suspicious.Custom2('InsultNoun', ROOT.Char)] traidor[Select_CString( suspicious.IsFemale, 'a', '' )]!"
 yearly.1084.start.desc:0 "Os guardas mantêm uma distância respeitável de [suspicious.GetTitledFirstName], mas estão prontos para capturá-lo a qualquer momento. [suspicious.GetSheHe|U] parece estar bem ciente disso; seu olhar se move nervosamente pela sala. Procurando uma rota de fuga, talvez?\n\nNão preciso me esforçar muito para obter minha confissão."
 yearly.1085.a:0 "Você pode sair."
 yearly.1085.angry.desc:0 "mas raiva.\n\n\"Como você se atreve a me acusar assim? Depois de tudo o que fiz por você!\""
 yearly.1085.b:0 "Eu estava enganado. Você tem minhas sinceras desculpas, [suspicious.GetFirstNameNoTooltip]."
 yearly.1085.c:0 "#EMP Mentira!#! Guardas, joguem [suspicious.GetSheHe] na masmorra!"
 yearly.1085.sad.desc:0 "mas tristeza.\n\n\"Sempre fui seu fiel servo,\" [suspicious.GetSheHe] chora. \"Nunca o trairia!\""
 yearly.1085.start.desc:0 "Os guardas mantêm uma distância respeitável de [suspicious.GetTitledFirstName], mas estão prontos para capturá-lo a qualquer momento. [suspicious.GetSheHe|U] parece estar bem ciente disso; há uma tensão incomum nos ombros [suspicious.GetHerHim].\n\n\"Por que você me convocou, [ROOT.Char.Custom2('RelationToMeAddress', suspicious)]? Você tem algo para me perguntar?\"\n\nA acusação escapa da minha boca como veneno, mas quando vejo a expressão no rosto de [suspicious.GetFirstNamePossessiveNoTooltip], a dúvida me assalta. Aquilo não é culpa,"
 yearly.1086.a:0 "Eu... Eu não sei o que dizer."
 yearly.1086.desc:0 "Eu tinha um plano, um discurso bem preparado. Mas quando vejo [suspicious.GetTitledFirstName], meu sangue ferve, e a acusação escapa da minha boca como veneno. Para minha surpresa, [suspicious.GetFirstNameNoTooltip] não reage com raiva, nem lágrimas.\n\n\"Oh, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [suspicious.Custom2('RelationToMeShort', ROOT.Char)] [ROOT.Char.Custom('ComplimentAdjective')], sei que você está sofrendo. Estas palavras duras não são suas. Vou responder a todas as suas perguntas, e você verá que não tem nada a temer de mim.\""
 yearly.1090.a:0 "Aceite [ROOT.Char.GetFaith.HighGodName], e este será o seu lar."
 yearly.1090.alone.desc:0 "estou cansado da estrada."
 yearly.1090.alone_stay.desc:0 "Se você me permitir ficar, ficarei feliz em compartilhar meu conhecimento do mundo com você e serei seu servo leal.\""
 yearly.1090.b:0 "Quanto mais, melhor!"
 yearly.1090.c:0 "Não temos espaço para gente como você."
 yearly.1090.family.desc:0 "minha família e eu estamos cansados da estrada."
 yearly.1090.family_member.desc:0 "m[Select_CString( traveler_family_1.IsFemale, 'inha', 'eu' )] [traveler.Custom2('RelationToMeShort', SCOPE.sC('traveler_family_1'))] [traveler_family_1.GetFistName] e eu estamos cansados da estrada."
 yearly.1090.family_stay.desc:0 "Se você nos permitir ficar, ficarei feliz em compartilhar meu conhecimento do mundo com você e serei seu servo leal.\""
 yearly.1090.start.desc:0 "Um estranho é trazido diante de mim. \"[traveler.GetSheHe|U] tem esperado do lado de fora dos portões do [ROOT.Char.Custom('ResidenceBuilding')] por uma semana, meu lorde,\" informa-me meu guarda.\n\n[Select_CString( traveler.IsFemale, 'A', 'O' )] [traveler.GetWomanMan] faz uma reverência profunda. \"Meu nome é [traveler.GetFirstName], [ROOT.Char.Custom('FormOfAddressForLiege')]. Viajei por terras distantes e vi muitas coisas, mas"
 yearly.1090.t:0 "Longe de Casa"
 yearly.1090.travelers_family:0 "[traveler.GetShortUIName|U] e sua família"
