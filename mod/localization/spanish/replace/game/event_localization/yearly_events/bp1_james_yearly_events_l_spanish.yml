 dessert_looks_like_god_desc:0 "Uma coleção de [ROOT.Char.Custom('GetExpensiveDessert')] que se assemelham a [ROOT.Char.GetFaith.HealthGodName]"
 end_marley_ghost_story_tt:0 "Você não será mais visitado por fantasmas."
 exploitative_lord_modifier:0 "Senhor Explorador"
 exploitative_lord_modifier_desc:0 "Este personagem explora até mesmo os servos mais desesperadamente pobres, se houver moedas a serem ganhas."
 full_of_jesus_modifier:0 "Cheio de Espiritualidade"
 full_of_jesus_modifier_desc:0 "Este personagem consumiu uma sobremesa que se assemelha a [ROOT.Char.GetFaith.HealthGodName]"
 ghost_stories_modifier:0 "Histórias de Fantasmas"
 ghost_stories_modifier_desc:0 "Dizem que este condado é o lar de um espírito malicioso."
