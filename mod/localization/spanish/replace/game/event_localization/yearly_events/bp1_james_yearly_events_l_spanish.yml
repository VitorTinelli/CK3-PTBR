l_spanish:
 9016_heir_wins:0 "[bp1_yearly_9016_heir.GetName] vence o duelo"
 9016_uppity_child_wins:0 "[bp1_yearly_9016_uppity_child.GetName] vence o duelo"
 9018_bully_child_wins:0 "[bp1_yearly_9018_bully.GetName] vence o duelo"
 9018_uppity_child_wins:0 "[bp1_yearly_9018_illegitimate_child.GetName] vence o duelo"
 9034_escaped_witch:0 "Você escapou da bruxa!"
 9034_failed_to_escape:0 "Você foi ferido durante a fuga."
 9038_guardian_kills_you:0 "Você foi dominado por [bp1_yearly_9037_guardian.GetName]."
 9038_killed_guardian:0 "Você empurrou com sucesso [bp1_yearly_9037_guardian.GetName] para o pântano."
 9042_you_lose:0 "Você perdeu o debate"
 9042_you_win:0 "Você venceu o debate"
 9048_you_lose:0 "Você é derrotado em combate"
 box_of_boggy_bones:0 "Caixa de Ossos do Pântano"
 box_of_boggy_bones_desc:0 "Os ossos de um cadáver de várias centenas de anos perfeitamente preservados na água do pântano, agora colocados em uma caixa conveniente."
 bp1_decrease_good_deeds_tt:0 "#EMP Os espíritos ficarão muito irritados#!"
 bp1_increase_good_deeds_tt:0 "#EMP Os espíritos ficarão satisfeitos#!"
 bp1_indulging_ghost_sex:0 "Sonhos Sensuais"
 bp1_indulging_ghost_sex_desc:0 "Este personagem está sonhando com amantes falecidos e está completamente se entregando a essas experiências sensuais de outro mundo."
 bp1_living_as_peasant_modifier:0 "Vivendo como um Camponês"
 bp1_living_as_peasant_modifier_desc:0 "Este personagem está passando uma quantidade extensa de tempo vivendo entre a plebe local para escapar das pressões do governo."
 bp1_sickness_being_doted_on:0 "Sendo mimado"
 bp1_sickness_being_doted_on_desc:0 "Este personagem está tendo todas as suas necessidades cuidadas enquanto está doente."
 bp1_withholding_ghost_sex:0 "Resistindo a Sonhos Sensuais"
 bp1_withholding_ghost_sex_desc:0 "Este personagem está sonhando com amantes falecidos, mas recusa suas investidas sensuais."
 bp1_yearly.9001.a:0 "Acho que estou velho demais para [ROOT.Char.GetSheHe] agora."
 bp1_yearly.9001.b:0 "Nunca abandonarei meu melhor amigo!"
 bp1_yearly.9001.desc.bully:0 "No entanto, [bp1_yearly_9001_toy_hater.Custom2('MyCharacterIntroduction', ROOT.Char)] tem zombado de mim implacavelmente na frente de outras crianças, dizendo que sou tão patético que nem consigo fazer amigos de verdade. Eu poderia jogar meu brinquedo favorito de lado e o bullying certamente pararia, mas isso significaria abandonar meu melhor amigo!"
 bp1_yearly.9001.desc.mentor:0 "No entanto, [bp1_yearly_9001_toy_hater.Custom2('MyCharacterIntroduction', ROOT.Char)] tem insistido para que eu deixe meu melhor amigo de lado e passe tempo com crianças \"de verdade\" e me socialize corretamente, mas [bp1_yearly_9001_toy_hater.GetSheHe] simplesmente não entende o que meu doce brinquedo significa para mim!"
 bp1_yearly.9001.opening:0 "Os amigos frequentemente são volúveis e propensos à traição, mas meu amigo mais querido nunca me traiu. Meu brinquedo favorito é mais do que apenas um brinquedo para mim, [ROOT.Char.GetSheHe] é meu melhor amigo.\n\n"
 bp1_yearly.9001.t:0 "Um Amigo de Madeira"
 bp1_yearly.9002.a:0 "Eu vou destruí-lo!"
 bp1_yearly.9002.b:0 "Talvez eu deva deixar [bp1_yearly_9001_shy_kid.GetSheHe] em paz."
 bp1_yearly.9002.c:0 "Eu vou destruí-lo e rezar para que [bp1_yearly_9001_shy_kid.GetSheHe] me perdoe."
 bp1_yearly.9002.desc.bully:0 "É totalmente patético e acho que já é hora de [bp1_yearly_9001_shy_kid.GetSheHe] aprender como essa amizade pode ser frágil."
 bp1_yearly.9002.desc.mentor:0 "Acho isso bastante estranho e me preocupo que, se eu não intervier, [bp1_yearly_9001_shy_kid.GetSheHe] crescerá como uma criança emocionalmente prejudicada em um corpo de [bp1_yearly_9001_shy_kid.GetWomanMan], mas [bp1_yearly_9001_shy_kid.GetSheHe] já rejeitou qualquer pedido razoável para deixar o brinquedo de lado."
 bp1_yearly.9002.desc.opening:0 "Todos os dias vejo [bp1_yearly_9001_shy_kid.Custom2('MyCharacterIntroduction', ROOT.Char)] correndo pelo tribunal com seu brinquedo favorito na mão. Até o vejo às vezes, conversando com ele como se fosse seu melhor amigo!\n\n"
 bp1_yearly.9003.a.child:0 "Acho que [bp1_yearly_9001_toy_hater.GetSheHe] não é tão ruim afinal."
 bp1_yearly.9003.a.mentor:0 "Veja, até mesmo os valentões podem ter seus momentos."
 bp1_yearly.9003.b.child:0 "Agora não preciso de mais ninguém!"
 bp1_yearly.9003.b.mentor:0 "Mas [bp1_yearly_9001_toy_hater.GetSheHe] #EMP poderia ter #! destruído isso!"
 bp1_yearly.9003.desc.child:0 "Felizmente, [bp1_yearly_9001_toy_hater.GetName] decidiu poupar meu melhor amigo e me deixar brincar e conversar com [ROOT.Char.GetSheHe] o dia todo! \n\nHouve um momento em que parecia que [bp1_yearly_9001_toy_hater.GetSheHe] estava decidido a destruir meu melhor amigo, mas parece que meu amigo vive para ver outro dia."
 bp1_yearly.9003.desc.mentor:0 "A doce jovem [bp1_yearly_9001_shy_kid.Custom2('MyCharacterIntroduction', ROOT.Char)] veio até mim hoje com lágrimas alegres nos olhos, me contando que seu brinquedo favorito quase foi destruído por [bp1_yearly_9001_toy_hater.GetName], mas foi poupado. \n\nA reação é um pouco excessiva para o que equivale a um pedaço de madeira que não foi esmagado por outra criança, mas esta é uma oportunidade de aprendizado, no entanto."
 bp1_yearly.9004.a:0 "Um dia, farei o mesmo com [bp1_yearly_9001_toy_hater.GetSheHe]!"
 bp1_yearly.9004.b:0 "É difícil, mas devo perdoar [bp1_yearly_9001_toy_hater.GetSheHe]"
 bp1_yearly.9004.c:0 "Nunca mais sairei de casa!"
 bp1_yearly.9004.desc:0 "Não pude acreditar. Um minuto, meu melhor amigo estava lá, protegido em meus braços, no próximo [ROOT.Char.GetSheHe] foi arrancado das mãos brutais de [bp1_yearly_9001_toy_hater.GetNamePossessive]! Como [ROOT.Char.GetFaith.DevilName] [ROOT.Char.GetFaith.DevilHerselfHimself], [bp1_yearly_9001_toy_hater.GetSheHe] riu e ergueu [ROOT.Char.GetSheHe] no ar antes de prontamente jogar [ROOT.Char.GetSheHe] no chão, deixando [ROOT.Char.GetSheHe] pouco mais do que uma bagunça esfacelada no chão. Chorei por meu querido amigo, tentando desesperadamente juntar os pedaços [ROOT.Char.GetHerHim], mas foi inútil. Eu tinha acabado de testemunhar um assassinato."
 bp1_yearly.9004.t:0 "Amizade Destroçada"
 bp1_yearly.9005.a:0 "Hora de vingança!"
 bp1_yearly.9005.b:0 "Hora de assassinato!"
 bp1_yearly.9005.c:0 "Hora de perdoar."
 bp1_yearly.9005.desc.guest:0 "Apenas quando pensei que teria um momento de paz, vejo que [bp1_yearly_9001_toy_hater.Custom2('MyCharacterIntroduction', ROOT.Char)] chegou como convidado em meu tribunal! Vejo [bp1_yearly_9001_toy_hater.GetSheHe] todos os dias, comendo minha comida e dormindo em minhas camas como se fosse dono do lugar, e não aguento mais!\n\n"
 bp1_yearly.9005.desc.imprisoned:0 "Finalmente, tranquei [bp1_yearly_9001_toy_hater.Custom2('MyCharacterIntroduction', ROOT.Char)] em meus calabouços, onde [bp1_yearly_9001_toy_hater.GetSheHe] pertence! [bp1_yearly_9001_toy_hater.SheHe|U] provavelmente esqueceu que [bp1_yearly_9001_toy_hater.GetSheHe] destruiu meu precioso brinquedo, meu melhor amigo, todos aqueles anos atrás, mas eu não esqueci. Nunca esqueço e mal perdoo.\n\n"
 bp1_yearly.9005.desc.outro:0 "A questão que permanece é: agora que [bp1_yearly_9001_toy_hater.GetSheHe] está à minha mercê, o que faço com [bp1_yearly_9001_toy_hater.GetSheHe] agora? Como se alcança justiça por um crime tão grave?"
 bp1_yearly.9005.t:0 "Nunca Perdoar"
 bp1_yearly.9006.a:0 "Uma ideia maravilhosa, digo eu!"
 bp1_yearly.9006.b:0 "Meus pensamentos pecaminosos não são motivo de orgulho!"
 bp1_yearly.9006.desc.ambitious:0 "anseiam por muito mais do que as migalhas que nos foram dadas por [ROOT.Char.GetFaith.PantheonTerm] no nascimento. Não podemos ficar contentes com o que nos foi dado quando sabemos que estamos destinados a muito mais!"
 bp1_yearly.9006.desc.arbitrary:0 "sabemos que a justiça é apenas uma palavra para validar os caprichos dos outros, e verdadeiramente ninguém sabe o que é justo. O que torna nossa vontade arbitrária, senão a vontade dos [ROOT.Char.GetFaith.PriestNeuterPlural]?"
 bp1_yearly.9006.desc.callous:0 "não se importam nem um botão com o sofrimento dos outros. Como podemos esperar nos importar com os sentimentos passageiros dos outros quando nossa própria felicidade ininterrupta está em jogo?"
 bp1_yearly.9006.desc.chaste:0 "estão cansados dos prazeres da carne nos quais outros se envolvem como animais vis. Uma noite de entretenimento tranquilo e introspecção não é mais pacífica do que se juntar a outra pilha de corpos suados e pútridos?"
 bp1_yearly.9006.desc.craven:0 "cansamos das constantes proclamações de atos de \"bravura\" que esses brutos se gabam. E daí se eles matam um(a) [ROOT.Char.Custom('GetAnimalType')]? É apenas risco desnecessário!"
 bp1_yearly.9006.desc.cynical:0 "questionam a autoridade da igreja mundana em questões espirituais. O que um [ROOT.Char.GetFaith.PriestNeuter] realmente sabe sobre [ROOT.Char.GetFaith.DivineRealm] que nós não sabemos?"
 bp1_yearly.9006.desc.deceitful:0 "sabemos que a \"verdade\" pode ser divertidamente maleável, e aqueles tolos o suficiente para cair na decepção merecem o que lhes acontece."
 bp1_yearly.9006.desc.generic:0 "são verdadeiros consigo mesmos, não importa que absurdo os [ROOT.Char.GetFaith.PriestNeuterPlural] possam pregar."
 bp1_yearly.9006.desc.gluttonous:0 "compartilhamos uma paixão pelos inúmeros sabores e texturas que este mundo tem a nos oferecer na mágica arte que é cozinhar. O mundo foi criado com tanta comida maravilhosa, o verdadeiro pecado seria não provar tudo!"
 bp1_yearly.9006.desc.greedy:0 "sabemos que devemos segurar o que é nosso e não dar nada aos pobres e \"necessitados\"! Se desejam nossa riqueza, talvez não devessem tê-la desperdiçado."
 bp1_yearly.9006.desc.intro:0 "Enquanto volto da [ROOT.Char.GetFaith.HouseOfWorship], [bp1_yearly_9006_sinful_courtier.GetNameNoTooltip] se aproxima de mim com um sorriso lascivo.\n\n\"[ROOT.Char.GetFirstNameNoTooltip], eu sei que você e eu ambos"
 bp1_yearly.9006.desc.lustful:0 "nos entregamos aos prazeres da carne que os [ROOT.Char.GetFaith.PriestNeuterPlural] nos diriam para negar!"
 bp1_yearly.9006.desc.outro:0 "Afinal, quem pode nos dizer como [ROOT.Char.GetFaith.HighGodName] gostaria que vivêssemos?\n\n\"Claramente, temos mais em comum do que não, e acho que você e eu deveríamos passar mais tempo juntos, longe dos cérebros podres das pessoas simples. O que você acha?\""
 bp1_yearly.9006.desc.sadistic:0 "ficamos empolgados com os gritos lamentáveis dos inocentes e condenados! Se eles vão morrer de qualquer maneira, por que não nos divertirmos com eles antes de partirem?"
 bp1_yearly.9006.desc.shy:0 "acham a companhia dos outros completamente exaustiva. Espera-se que falem com tantas pessoas, mas elas não têm nada interessante a dizer e nós não temos nada interessante a dizer de volta. Por que gastar tempo com eles quando podemos ficar mais felizes sozinhos?"
 bp1_yearly.9006.desc.vengeful:0 "saboreamos o sofrimento de nossos inimigos encontrando o castigo merecido. Embora os [ROOT.Char.GetFaith.PriestNeuterPlural] chamem de pecado a alegria pelo sofrimento de nossos inimigos, acredito que somos apenas os portadores da justiça divina."
 bp1_yearly.9006.desc.wrathful:0 "não escondemos nossas emoções e deixamos o ódio e a raiva fluírem livre e desimpedidos em nossos corpos. Eles nos dizem para não sentir nossos sentimentos e conter o que está dentro e chamam isso de virtude."
 bp1_yearly.9006.t:0 "Uma Consideração Sinistra"
 bp1_yearly.9007.a:0 "[bp1_yearly_9007_doppelganger.GetSheHe|U] se juntará a mim na corte!"
 bp1_yearly.9007.b:0 "Façam-se livres deste abominável sósia."
 bp1_yearly.9007.c:0 "Continuem e esqueçam essa criatura sinistra."
 bp1_yearly.9007.desc:0 "Enquanto percorro as ruas de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], cercado pela minha comitiva usual de guardas e cortesãos, vejo algo que me faz parar e suspirar.\n\nUm mendigo camponês, sem nada para protegê-lo dos elementos além de lama e trapos, olha para mim com olhos desesperadamente suplicantes. Eu teria seguido em frente, mas havia algo quase familiar nesse plebeu.\n\nÉ então que um membro da minha comitiva aponta que [bp1_yearly_9007_doppelganger.GetSheHe] é a minha imagem espelhada! É angustiante ver minha imagem espelhada atolada na sujeira, mas talvez eu possa fazer algo para corrigir essa injustiça cósmica."
 bp1_yearly.9007.t:0 "Um Espelho na Lama"
 bp1_yearly.9008.a:0 "O governante se tornará o governado por um dia!"
 bp1_yearly.9008.b:0 "Que proposta insultante."
 bp1_yearly.9008.desc:0 "Passou algum tempo desde que trouxe [bp1_yearly_9007_doppelganger.GetName] para a corte, e tem sido bastante agradável ver meu duplo participando do estilo de vida nobre, não mais se lamentando na sujeira e na pobreza.\n\n[bp1_yearly_9007_doppelganger.GetSheHe|U] se aproxima de mim com um brilho nos olhos e faz uma proposta intrigante. \"Nenhum deles lá em casa sabe que estou vivendo com a nobreza. Tenho pensado que deveríamos fazer uma troca, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord], eu vou cobrir para você como [ROOT.Char.GetTitleAsNameNoTooltip], e você pode passar o dia como um de nós, plebeus!\""
 bp1_yearly.9008.t:0 "Viver como Meu Outro Eu"
 bp1_yearly.9009.a:0 "Fora da minha vista, os dois!"
 bp1_yearly.9009.b:0 "Mantenham este miserável bonito aprisionado."
 bp1_yearly.9009.c:0 "Não posso ficar no caminho do verdadeiro amor."
 bp1_yearly.9009.d:0 "Percebo agora, me importo com ambos!"
 bp1_yearly.9009.desc.intro:0 "Me aproximo dos meus aposentos ao som alarmante do que parece uma luta maligna! Pancadas intensas, agitação, e... os gritos de [bp1_yearly_9009_lover.Custom2('MyCharacterIntroduction', ROOT.Char)]!\n\nAo entrar no quarto, vejo meu duplo [bp1_yearly_9007_doppelganger.GetNameNoTooltip] completamente nu com [bp1_yearly_9009_lover.GetNameNoTooltip] fazendo coisas indescritíveis!"
 bp1_yearly.9009.desc.lustful:0 "[bp1_yearly_9009_lover.GetSheHe|U] chora. \"Sinto muito, meu amor, é que [bp1_yearly_9007_doppelganger.GetNameNoTooltip] é apenas um pouco mais justo que você! Meu peito lateja por [bp1_yearly_9007_doppelganger.GetSheHe]!\""
 bp1_yearly.9009.desc:0 "[bp1_yearly_9009_lover.GetSheHe|U] insiste que [bp1_yearly_9009_lover.GetSheHe] não tinha ideia de que não era eu, mas não tenho certeza se acredito n[bp1_yearly_9009_lover.GetSheHe]."
 bp1_yearly.9009.t:0 "Outro Amante"
 bp1_yearly.9010.a:0 "Deve haver apenas um!"
 bp1_yearly.9010.a_tt:0 "Inicia um [single_combat_duel|E] com [bp1_yearly_9007_doppelganger.GetShortUIName]"
 bp1_yearly.9010.b:0 "Guardas, prendam este impostor!"
 bp1_yearly.9010.desc.drunk:0 "o cheiro de [ROOT.Char.Custom('RegionalDrink')] impregnando o corpo [bp1_yearly_9007_doppelganger.GetHerHim]. [bp1_yearly_9007_doppelganger.GetSheHe|U] cambaleia em minha direção com fúria nos olhos.\n\n\"Impostor! Esse *#EMP soluço#!*"
 bp1_yearly.9010.desc.intro:0 "[bp1_yearly_9007_doppelganger.GetName] irrompe na minha sala do trono,"
 bp1_yearly.9010.desc.outro:0 "[ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_9007_doppelganger'))] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('bp1_yearly_9007_doppelganger'))] não é [ROOT.Char.GetNameNoTooltip]! Eu sou o verdadeiro [ROOT.Char.GetNameNoTooltip]!\"\n\nEmbora seja uma mentira óbvia, minha corte parece de alguma forma convencida de que minha verdadeira identidade está em disputa! À medida que [bp1_yearly_9007_doppelganger.GetNameNoTooltip] saca sua arma, fica claro que a violência é a única resposta."
 bp1_yearly.9010.desc.stoner:0 "cheirando a fumaça de haxixe e suor. Seus olhos vermelhos e vagos encaram a área ao redor da minha cabeça enquanto [bp1_yearly_9007_doppelganger.GetSheHe] cambaleia preguiçosamente em minha direção, gargalhando como uma louca[o].\n\n\"Impostor! Esse *#EMP tosse#!*"
 bp1_yearly.9010.t:0 "[Select_CString( ROOT.Char.IsFemale, 'As Duas Rainhas', 'Os Dois Reis' )]"
 bp1_yearly.9012.a:0 "Estou enlouquecendo ou todos os outros estão?"
 bp1_yearly.9012.desc:0 "\"Vitória! Vejam, apenas o verdadeiro [ROOT.Char.GetNameNoTooltip] venceria em um combate justo!\"\n\nMeu duplo declara vitória e, embora muitos pareçam não estar convencidos, outros parecem ter sido persuadidos por essa exibição de habilidade e já estão me considerando suspeito. Uma pequena votação é realizada entre a nobreza e ainda sou declarado o verdadeiro [ROOT.Char.GetNameNoTooltip], embora por uma margem estreita.\n\nEmbora a maioria ainda acredite que sou quem afirmo ser, pessoas o suficiente foram convencidas de que [bp1_yearly_9007_doppelganger.GetNameNoTooltip] é, de fato, o verdadeiro [ROOT.Char.GetNameNoTooltip], que [bp1_yearly_9007_doppelganger.GetSheHe] sai deste encontro com um direito aos meus títulos e um grupo de pessoas que acreditam que [bp1_yearly_9007_doppelganger.GetSheHe] é eu!"
 bp1_yearly.9012.t:0 "Problemas em Dobro"
 bp1_yearly.9013.a:0 "Estou feliz que acabou."
 bp1_yearly.9013.desc:0 "À medida que minha vitória é declarada sobre o impostor, aqueles que teriam duvidado de minha verdadeira identidade parecem ter sido silenciados. Meus guardas seguram [bp1_yearly_9007_doppelganger.GetNameNoTooltip], que ainda sibila e zomba de mim, gritando sobre o reino que lhe foi negado.\n\nEmbora [bp1_yearly_9007_doppelganger.GetNameNoTooltip] ainda afirme ser o verdadeiro eu, haverá poucos para ouvir [bp1_yearly_9007_doppelganger.GetHerHim] das masmorras."
 bp1_yearly.9014.a.arrogant:0 "Eu me amo- quer dizer, você, muito!"
 bp1_yearly.9014.a:0 "Claro que sou!"
 bp1_yearly.9014.b:0 "N-não! Não podemos!"
 bp1_yearly.9014.desc.lover:0 "Tenho passado cada vez mais tempo com o doce e belo [bp1_yearly_9007_doppelganger.GetName]. Embora antes eu olhasse [bp1_yearly_9007_doppelganger.GetSheHe] como pouco mais do que um sombrio reflexo de mim mesmo, passei a achar a companhia [bp1_yearly_9007_doppelganger.GetHerHim] agradável e reconfortante. Enquanto passeamos juntos em minha corte, ambos congelamos quando nossas mãos se tocam.\n\nPor breve que tenha sido, aquele fugaz momento de pele com pele traz rosas ardentes às minhas bochechas e, ao voltar ansiosamente meus olhos para [bp1_yearly_9007_doppelganger.GetNameNoTooltip], parece que [bp1_yearly_9007_doppelganger.GetSheHe] sente o mesmo.\n\nSerá que sou realmente tão narcisista a ponto de considerar chamar meu duplo... de amante?"
 bp1_yearly.9014.desc.soulmate:0 "Enquanto estou na cama com meu belo amante [bp1_yearly_9007_doppelganger.GetNameNoTooltip], descubro que temos mais em comum do que apenas nossa aparência. [bp1_yearly_9007_doppelganger.GetSheHe|U] é um gênio e um estudioso, frequentemente ecoando sentimentos que muitas vezes mantive para mim mesmo, mas não consegui encontrar palavras para expressar! É como se nossas mentes fossem uma só e fôssemos capazes de completar os pensamentos um do outro. Um relacionamento assim só pode significar uma coisa: amor!\n\nMas eu sou realmente tão narcisista a ponto de chamar meu próprio duplo de algo mais do que apenas um amante, mas... uma alma gêmea?"
 bp1_yearly.9014.t:0 "Mais do que um Rosto Bonito"
 bp1_yearly.9015.a:0 "Abrace-me, [bp1_yearly_9007_doppelganger.Custom('SisterBrother')]!"
 bp1_yearly.9015.b:0 "Ninguém pode saber."
 bp1_yearly.9015.desc:0 "Desde que comecei a passar tempo com o encantador e belo [bp1_yearly_9007_doppelganger.GetName], [bp1_yearly_9015_living_parent.Custom2('MyCharacterIntroduction', ROOT.Char)] tem parecido pensativa e agitada, talvez [bp1_yearly_9015_living_parent.GetSheHe] desaprove nosso relacionamento?\n\nCom alguma pressão, [bp1_yearly_9015_living_parent.GetNameNoTooltip] irrompe em uma confissão chorosa. \"Você tem um gêmeo, [ROOT.Char.GetFirstNameNoTooltip]! Quando você nasceu, eu não quis que sua sucessão fosse contestada, então separei os dois. Nunca pensei que vocês se encontrariam!\"\n\nUma confissão chocante, para dizer o mínimo, mas o que posso fazer com essa informação?"
 bp1_yearly.9015.t:0 "São Dois"
 bp1_yearly.9016.a:0 "Ah, isso será bom."
 bp1_yearly.9016.b:0 "Sente-se, seu tolo!"
 bp1_yearly.9016.desc.bastard:0 "\"[bp1_yearly_9016_heir.GetSheHe|U] não é um[Select_CString( bp1_yearly_9016_heir.IsFemale, 'a', '' )] [bp1_yearly_9016_heir.Custom('GetDaughterSon')] legítim[Select_CString( bp1_yearly_9016_heir.IsFemale, 'a', 'o' )] desta família. Eu nasci de uma união verdadeira entre meus pais, por que esse bastardo deveria assumir o trono?"
 bp1_yearly.9016.desc.child_of_concubine:0 "\"[bp1_yearly_9016_heir.GetSheHe|U] nasceu de uma concubina humilde! Eu sou o produto de um [bp1_yearly_9016_uppity_child.Custom('GetCulturallyAppropriateMarriageReference')] entre você e [bp1_yearly_9016_uppity_child.GetMother.GetName] e a coroa me pertence por direito de nascimento!"
 bp1_yearly.9016.desc.fallback:0 "\"[bp1_yearly_9016_heir.GetSheHe|U] é completamente indigno da coroa e merece nada mais do que ser meu bobo da corte após a sucessão! Este vilão ficou em primeiro lugar pela coroa tempo demais e merece ser colocado em seu lugar."
 bp1_yearly.9016.desc.intro:0 "O que começou como um encontro familiar normal nos salões de jantar de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] rapidamente se transformou em uma acalorada discussão entre [bp1_yearly_9016_heir.Custom2('MyCharacterIntroduction', ROOT.Char)] e [bp1_yearly_9016_uppity_child.Custom2('MyCharacterIntroduction', ROOT.Char)]!\n\n[bp1_yearly_9016_uppity_child.GetSheHe|U] afirma que [bp1_yearly_9016_heir.GetNameNoTooltip] não é digno de ser meu herdeiro de forma alguma.\n\n"
 bp1_yearly.9016.desc.not_a_child:0 "\"[bp1_yearly_9016_heir.GetSheHe|U] nem mesmo é s[Select_CString( bp1_yearly_9016_heir.IsFemale, 'ua', 'eu' )] [bp1_yearly_9016_heir.Custom('GetDaughterSon')], afinal. Que direito tem [bp1_yearly_9016_heir.GetSheHe] de suceder a mim quando você partir para [ROOT.Char.GetFaith.PositiveAfterLife]?"
 bp1_yearly.9016.desc.outro:0 "Exijo um duelo com você, [bp1_yearly_9016_heir.GetNameNoTooltip]! Um duelo pelo trono!\""
 bp1_yearly.9016.desc.rival:0 "\"[bp1_yearly_9016_heir.GetSheHe|U] traiu você mil vezes, enquanto eu permaneci leal a você! Como podemos confiar nessa besta licenciosa para cuidar do [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] quando você se for, se [bp1_yearly_9016_heir.GetSheHe] nem sequer consegue cuidar de você enquanto você está aqui?"
 bp1_yearly.9016.t:0 "[Select_CString( bp1_yearly_9016_uppity_child.IsFemale, 'A', 'O' )] [bp1_yearly_9016_uppity_child.GetWomanMan|U] Que Quer Ser [ROOT.Char.GetTitleAsNameNoTooltip]"
 bp1_yearly.9017.a:0 "Nossas diferenças devem ser celebradas, m[Select_CString( bp1_yearly_9017_uppity_child.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', bp1_yearly_9017_uppity_child)]!"
 bp1_yearly.9017.b.culture:0 "[bp1_yearly_9017_uppity_child.GetCulture.GetName] ou [ROOT.Char.GetCulture.GetName], você ainda é m[Select_CString( bp1_yearly_9017_uppity_child.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', bp1_yearly_9017_uppity_child)]."
 bp1_yearly.9017.b.faith:0 "[bp1_yearly_9017_uppity_child.GetFaith.GetAdherentNameNoTooltip] ou [ROOT.Char.GetFaith.GetAdherentNameNoTooltip], você ainda é m[Select_CString( bp1_yearly_9017_uppity_child.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', bp1_yearly_9017_uppity_child)]."
 bp1_yearly.9017.c:0 "Excelente ideia, você está deserdado!"
 bp1_yearly.9017.desc.culture:0 "\"Eu sou diferente do resto de vocês! Não conheço os costumes e tradições [ROOT.Char.GetCulture.GetName]. Sinto-me sozinho aqui, um[Select_CString( bp1_yearly_9017_uppity_child.IsFemale, 'a', '' )] [bp1_yearly_9017_uppity_child.GetWomanMan] [bp1_yearly_9017_uppity_child.GetCulture.GetName] vivendo entre os [ROOT.Char.GetCulture.GetCollectiveNoun] na corte, como se tivesse algum direito de me considerar um deles."
 bp1_yearly.9017.desc.faith:0 "\"Eu não sou como eles! Não oro e adoro da mesma forma que vocês, [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]! Sou um [bp1_yearly_9017_uppity_child.GetFaith.GetAdherentNameNoTooltip], destinado a herdar um [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|L] de infiéis."
 bp1_yearly.9017.desc.intro:0 "Ao lado da fogueira à noite, vejo [bp1_yearly_9017_uppity_child.Custom2('MyCharacterIntroduction', ROOT.Char)] meditando com a intensidade de [ROOT.Char.GetFaith.KnowledgeGodName]. Pergunto a [bp1_yearly_9017_uppity_child.GetSheHe] o que a aflige, e [bp1_yearly_9017_uppity_child.GetSheHe] se vira para mim com fúria e vergonha queimando em seus olhos.\n\n"
 bp1_yearly.9017.desc.outro:0 "Sou uma fraude e não posso mais ser seu herdeiro!\""
 bp1_yearly.9017.t.culture:0 "[Select_CString( bp1_yearly_9017_uppity_child.IsFemale, 'A', 'O' )] [bp1_yearly_9017_uppity_child.Custom('GetPrincessPrince')]"
 bp1_yearly.9017.t.faith:0 "[Select_CString( bp1_yearly_9017_uppity_child.IsFemale, 'A', 'O' )] [bp1_yearly_9017_uppity_child.Custom('GetPrincessPrince')] Herege"
 bp1_yearly.9018.a:0 "Talvez seja hora de nós três conversarmos."
 bp1_yearly.9018.b:0 "[bp1_yearly_9018_bully.Custom('GirlBoyPlural')|U] serão [bp1_yearly_9018_bully.Custom('GirlBoyPlural')]!"
 bp1_yearly.9018.c:0 "Por que você está chorando? Isso claramente pode ser resolvido com violência."
 bp1_yearly.9018.desc.bastard:0 "\"[ROOT.Char.GetMotherFather|U]! É tão *#EMP sniff#!* terrível, não consigo mais suportar! [bp1_yearly_9018_bully.GetName|U] tem me provocado incessantemente, dizendo que nasci sem moral e que não sou digno do seu amor. Diga-me que não é verdade!\"\n\n"
 bp1_yearly.9018.desc.child_of_concubine:0 "\"[ROOT.Char.GetMotherFather|U]! [bp1_yearly_9018_bully.GetName|U] diz que filhos de concubinas são impuros! [bp1_yearly_9018_bully.GetSheHe|U] tem tampado o nariz e dito que cheiro a sangue de concubina. Diga-me que me ama, [ROOT.Char.GetMotherFather]!\"\n\n"
 bp1_yearly.9018.desc.intro:0 "Em um momento de vulnerabilidade, [bp1_yearly_9018_illegitimate_child.Custom2('MyCharacterIntroduction', ROOT.Char)] corre para mim, envolvendo seus braços em volta das minhas pernas, sujando-me com lágrimas e muco.\n\n"
 bp1_yearly.9018.desc.outro.callous:0 "Neste ponto, eu diria qualquer coisa para afastá-lo de mim, mas o que devo dizer?"
 bp1_yearly.9018.desc.outro:0 "Este é claramente um momento muito delicado para [Select_CString( bp1_yearly_9018_illegitimate_child.IsFemale, 'a', 'o' )] [bp1_yearly_9018_illegitimate_child.Custom('GirlBoy')], mas o que dizer?"
 bp1_yearly.9018.t:0 "Paixão ou Pureza"
 bp1_yearly.9019.a:0 "Pelo [ROOT.Char.GetFaith.FertilityGodName], todos os meus desejos se realizaram?"
 bp1_yearly.9019.b:0 "Silêncio, [bp1_yearly_9019_spouse.Custom2('InsultNoun', ROOT.Char)]! Eu irei me deitar apenas com [bp1_yearly_9019_lover.GetSheHe]!"
 bp1_yearly.9019.c:0 "O quê? Por que, eu não poderia fazer isso!"
 bp1_yearly.9019.desc.bridge.bi:0 "\"Eu já sabia há algum tempo que você anseia pelo toque de um[Select_CString( bp1_yearly_9019_lover.IsFemale, 'a', '' )] colega."
 bp1_yearly.9019.desc.bridge.gay:0 "\"Eu já sabia há algum tempo que o toque de um[Select_CString( bp1_yearly_9019_spouse.IsFemale, 'a', '' )] [bp1_yearly_9019_spouse.GetWomanMan] nunca conseguiu acender a chama em suas entranhas."
 bp1_yearly.9019.desc.bridge:0 "No entanto, para minha surpresa, vejo [bp1_yearly_9019_spouse.GetSheHe] completamente vestido ao lado de um[Select_CString( bp1_yearly_9019_lover.IsFemale, 'a', '' )] [bp1_yearly_9019_lover.GetWomanMan] nu! Exijo uma explicação, provocando um sorriso conhecedor no rosto [bp1_yearly_9019_spouse.GetHerHim].\n\n"
 bp1_yearly.9019.desc.compassionate:0 "Não estou ressentido nem com ciúmes, apenas quero que você seja feliz, então talvez nosso amor possa ser mais amoroso se envolvermos s[Select_CString( bp1_yearly_9019_lover.IsFemale, 'ua', 'eu' )] colega!"
 bp1_yearly.9019.desc.cynical:0 "Francamente, não me importo com quem ou o que você deseja copular, só quero um filho legítimo nascido de nossa união."
 bp1_yearly.9019.desc.friend:0 "\n\nEmbora eu nunca esperasse ver meu querido amigo em uma posição tão comprometedora, não posso honestamente dizer que não gosto do que vejo."
 bp1_yearly.9019.desc.intro.bi:0 "Chegou o momento de novamente entrar no meu [ROOT.Char.Custom('GetChamber')] e tentar ter um filho com [bp1_yearly_9019_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 bp1_yearly.9019.desc.intro.gay:0 "O momento que eu temia chegou. Estremeço silenciosamente e entro na ponta dos pés no meu [ROOT.Char.Custom('GetChamber')], sabendo que [bp1_yearly_9019_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] está esperando lá dentro, aguardando uma noite de fazer amor sem paixão."
 bp1_yearly.9019.desc.lover:0 "\n\nEu me pergunto se [bp1_yearly_9019_spouse.GetSheHe] está ciente de que [bp1_yearly_9019_lover.GetName] e eu já estamos muito familiarizados com os corpos um do outro, mas de qualquer forma, isso é uma surpresa tão inesperada!"
 bp1_yearly.9019.desc.lustful:0 "Não faz diferença para mim, eu só desejo uma noite de paixão! Talvez seja mais divertido para nós dois se envolvermos nosso amigo aqui em nosso amor."
 bp1_yearly.9019.desc.outro:0 ""
 bp1_yearly.9019.desc.stranger:0 "\n\nEu me pergunto onde [bp1_yearly_9019_spouse.GetSheHe] encontrou ess[Select_CString( bp1_yearly_9019_lover.IsFemale, 'a', 'e' )] pobre [bp1_yearly_9019_lover.GetWomanMan], mas [bp1_yearly_9019_lover.GetSheHe] parece certamente animado."
 bp1_yearly.9019.t:0 "Um[Select_CString( bp1_yearly_9019_lover.IsFemale, 'a', '' )] [bp1_yearly_9019_lover.GetWomanMan|U] em Nossa Cama"
 bp1_yearly.9020.a:0 "Tudo para te agradar."
 bp1_yearly.9020.b:0 "Não! Qualquer coisa, menos isso!"
 bp1_yearly.9020.c:0 "Todos saberão de sua perversão vil."
 bp1_yearly.9020.desc.bondage:0 "como seria ser um dos nossos prisioneiros? Amarrado em correntes, sujeito aos caprichos de um carcereiro cruel com o desejo de te fazer gritar. Apenas considere como seria fácil pegar algumas correntes e... equipamentos do [ROOT.Char.Custom('GetDungeon')]."
 bp1_yearly.9020.desc.feet:0 "como seria ser o chão no nosso [ROOT.Char.Custom('GetChamber')]? Aqueles pés descalços pressionando seu ser, apenas um objeto a ser usado e pisado por outros. Só de pensar nisso faz minhas partes íntimas queimarem!"
 bp1_yearly.9020.desc.goat:0 "o que se poderia fazer com uma cabra? Aqueles chifres, aquela barba desgrenhada, o jeito como ela não se importa com o que come. Ora, se pudéssemos trazer uma para o [ROOT.Char.Custom('GetChamber')], o aroma pungente dela seria suficiente para inflamar as chamas do meu coração!"
 bp1_yearly.9020.desc.hof:0 "como seria deitar com o [ROOT.Char.ReligiousHeadTitleName]? Todo aquele tempo, os dedos do [ROOT.Char.ReligiousHeadTitleName] passam sobre os livros sagrados, imagine como deve ser! Seja meu [ROOT.Char.ReligiousHeadTitle] e faça de mim seu [ROOT.Char.GetFaith.ReligiousText]!\""
 bp1_yearly.9020.desc.intro:0 "O momento chegou mais uma vez para eu tentar produzir um filho com [bp1_yearly_9020_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)], mas, enquanto me preparo para outra noite de amor sem paixão, [bp1_yearly_9020_spouse.GetSheHe] me encara com um olhar assustador em seus olhos.\n\n\"O ato sexual convencional é tão enfadonho, você não acha? Você já considerou"
 bp1_yearly.9020.desc.outro:0 "\n\nFaltam-me palavras para descrever o que acabei de ouvir, mas, como [ROOT.Char.GetTitleAsNameNoTooltip], é meu dever satisfazer m[Select_CString( bp1_yearly_9020_spouse.IsFemale, 'inha', 'eu' )] [bp1_yearly_9020_spouse.GetTitleAsNameNoTooltip] e trazer mais filhos legítimos a este mundo, não importa o custo. Quem sabe? Talvez eu goste."
 bp1_yearly.9020.desc.vegetable:0 "o erotismo natural de vegetais de raiz? Apenas imagine como seria sentir um dos presentes da terra de [ROOT.Char.GetFaith.CreatorNamePossessive] em sua pele nos lugares mais delicados?\""
 bp1_yearly.9020.t:0 "Um Pedido Estranho"
 bp1_yearly.9021.a:0 "Eu te odeio, querida! Me abrace mais."
 bp1_yearly.9021.b:0 "Devo ter imaginado uma lâmina contra esse pescoço delicado."
 bp1_yearly.9021.desc:0 "Palavras mal conseguem começar a descrever o puro ódio em meu coração por [bp1_yearly_9021_rival_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)], mas, infelizmente, meus deveres como [ROOT.Char.GetTitleAsNameNoTooltip] requerem que eu ignore meus próprios sentimentos e \"faça amor\" com est[Select_CString( bp1_yearly_9021_rival_spouse.IsFemale, 'a', 'e' )] [bp1_yearly_9021_rival_spouse.Custom2('InsultNoun', ROOT.Char)] [bp1_yearly_9021_rival_spouse.Custom2('InsultAdjective', ROOT.Char)].\n\nEu esperava odiar cada momento disso, mas à medida que começamos a fazer o coito flácido, sinto um fogo subir pelo meu corpo como nunca antes. Olhando o puro desprezo e ódio nos olhos [bp1_yearly_9021_rival_spouse.GetHerHim], sinto meu coração acelerar e minha virilha se animar para a ação. Posso dizer que [bp1_yearly_9021_rival_spouse.GetSheHe] sente o mesmo pela maneira como [bp1_yearly_9021_rival_spouse.GetSheHe] me prende e esfrega as mãos por todo o meu corpo com igual parte desprezo e paixão. O que é esse sentimento? Amor? Ódio? Alguma vil amalgamação de ambos?\n\nSeja qual for esse sentimento, provavelmente é um pecado, mas o ato de amor apaixonado entre cônjuges unidos aos olhos de [ROOT.Char.GetFaith.HighGodName] pode ser um pecado? Mesmo que nos odiemos, isso significa que não podemos desfrutar de nossa cópula obrigatória?"
 bp1_yearly.9021.t:0 "O [ROOT.Char.GetFaith.DevilName|U] em Minha Cama"
 bp1_yearly.9022.a:0 "Você está certo. Eu preciso de ajuda."
 bp1_yearly.9022.b:0 "Saia! Saia agora mesmo!"
 bp1_yearly.9022.desc.comfort_eater:0 "há algum momento em que você não esteja mastigando algo? A comida é um presente natural dado a nós por [ROOT.Char.GetFaith.CreatorName], mas quando vejo você comer, fica claro que não há alegria nisso. Quanta comida será necessária para preencher o buraco em sua alma?"
 bp1_yearly.9022.desc.drunkard:0 "sempre que conversamos, tudo o que cheira é [ROOT.Char.Custom('RegionalDrink')] em seu hálito e as palavras de um bêbado sem cérebro saindo descuidadamente de sua boca. É divertido se entregar à bebida de vez em quando, mas, para ser honesto, mal me lembro da última vez que o vi sóbrio."
 bp1_yearly.9022.desc.flagellant:0 "por que você precisa se ferir assim? Quando se machuca, é verdadeiramente por [ROOT.Char.GetFaith.HighGodName] ou é um pedido desesperado para que alguém perceba a dor que sente em sua alma? Venha, converse comigo, não suporto ver outra cicatriz aparecer no corpo do meu querido amigo."
 bp1_yearly.9022.desc.hashishiyah:0 "todos nós gostamos de um bom bolo de haxixe de vez em quando, mas quando falo com você, é como se estivesse falando apenas com o haxixe. Pouco do [ROOT.Char.GetFirstNameNoTooltip] que eu conhecia sobra em você em seu estupor quase permanente, e anseio por conversas que façam sentido para um homem sóbrio."
 bp1_yearly.9022.desc.inappetetic:0 "quando foi a última vez que você comeu alguma coisa? Você está começando a parecer um cadáver, sua pele é um saco sobre uma torre cambaleante de ossos. Quando o vejo, meus instintos de nutrição entram em ação e só quero vê-lo se encher de algo rico e nutritivo. Quanto tempo levará até você se desperdiçar em pó?"
 bp1_yearly.9022.desc.intro:0 "Volto para meu quarto depois de mais um dia difícil como [ROOT.Char.GetTitleAsNameNoTooltip], mas logo percebo que não estou sozinho. Vejo [bp1_yearly_9022_friend.Custom2('MyCharacterIntroduction', ROOT.Char)] de pé com um olhar nada satisfeito no rosto [bp1_yearly_9022_friend.GetHerHim].\n\n\"[ROOT.Char.GetFirstNameNoTooltip],"
 bp1_yearly.9022.desc.outro:0 "Deixe-me te ajudar, [ROOT.Char.GetFirstNameNoTooltip].\"\n\nFiquei completamente atordoado, quem é [bp1_yearly_9022_friend.GetSheHe] para julgar como eu vivo?\n\n\"Leve o seu tempo. Eu não vou a lugar algum.\""
 bp1_yearly.9022.desc.rakish:0 "sua dependência incontrolável de prostitutas e bordéis está trazendo uma grande praga para seu corpo e alma. Você teve tantos amantes desconhecidos que, se fosse gado, eu o mandaria matar como precaução e misericórdia."
 bp1_yearly.9022.desc.reclusive:0 "devo persegui-lo para conseguir uma palavra sua? Quando foi a última vez que você viu alguém por qualquer motivo além de seus deveres? Não suporto ficar à margem, implorando por um mínimo de atenção sua."
 bp1_yearly.9022.t:0 "Uma Intervenção Amigável"
 bp1_yearly.9023.a:0 "Murmure algo que pareça [bp1_yearly_9023_friend.GetCulture.GetLanguage.GetNameNoTooltip] e espere pelo melhor."
 bp1_yearly.9023.b:0 "Talvez eu devesse aprender [bp1_yearly_9023_friend.GetCulture.GetLanguage.GetNameNoTooltip]."
 bp1_yearly.9023.c:0 "[bp1_yearly_9023_friend.GetNameNoTooltip] deveria aprender [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]!"
 bp1_yearly.9023.desc:0 "Adoro passar tempo com [bp1_yearly_9023_friend.Custom2('MyCharacterIntroduction', ROOT.Char)], embora geralmente seja necessário um intérprete. Normalmente, a barreira linguística não é um problema, mas hoje parece que chateei meu querido amigo com algo que disse.\n\n[bp1_yearly_9023_friend.GetSheHe|U] disse algo que parecia uma piada, e eu ri, como é cortesia, mas então [bp1_yearly_9023_friend.GetSheHe] me lançou um olhar que falou mil palavras. Enquanto sentia aquele olhar perfurar minha alma, podia ver nossa amizade, que transcende a linguagem, escorrendo pelos dedos.\n\nO que posso fazer para consertar essa situação e manter essa amizade?"
 bp1_yearly.9023.t:0 "Uma Barreira Linguística"
 bp1_yearly.9024.a:0 "É bom ter amigos tão cuidadosos."
 bp1_yearly.9024.b:0 "Eu posso cuidar de mim mesmo!"
 bp1_yearly.9024.desc:0 "Esta doença está tirando minha vida, mas felizmente tenho [bp1_yearly_9024_friend.Custom2('MyCharacterIntroduction', ROOT.Char)] que tem cuidado bem de mim enquanto estou em recuperação.\n\n[bp1_yearly_9024_friend.GetSheHe|U] está realmente me fazendo sentir mimado apesar da minha condição; fazendo comida, lavando minhas roupas, cuidando de mim como se [bp1_yearly_9024_friend.GetSheHe] fosse nada mais do que um simples servo!"
 bp1_yearly.9024.t:0 "Uma Mão Cuidadosa"
 bp1_yearly.9025.a:0 "Saia da minha vista agora mesmo."
 bp1_yearly.9025.b:0 "Talvez eu ainda possa fazer isso funcionar."
 bp1_yearly.9025.desc:0 "Finalmente, eu e [bp1_yearly_9025_friend.Custom2('MyCharacterIntroduction', ROOT.Char)] compartilhamos uma língua comum e temos conversado de um lado para o outro há algum tempo.\n\nO único problema é que rapidamente percebi que detesto cada palavra podre que sai da boca dest[Select_CString( bp1_yearly_9025_friend.IsFemale, 'a', 'e' )] [bp1_yearly_9025_friend.Custom2('InsultNoun', ROOT.Char)] [bp1_yearly_9025_friend.Custom2('InsultAdjective', ROOT.Char)]. A menos que haja algum mal-entendido, estou começando a me perguntar como alguém poderia, sinceramente, chamar est[Select_CString( bp1_yearly_9025_friend.IsFemale, 'a', 'e' )] [bp1_yearly_9025_friend.GetWomanMan] de amigo.\n\nIsso é um desastre e anseio pelos dias em que podia simplesmente sentar quieto na presença reconfortante [bp1_yearly_9025_friend.GetHerHim], sem saber nada sobre a podridão em seu coração."
 bp1_yearly.9025.t:0 "Agora Eu Te Conheço"
 bp1_yearly.9026.a:0 "Eu me arrependo! Faço qualquer coisa para me redimir!"
 bp1_yearly.9026.b:0 "Estou claramente alucinando! Desapareça, espírito!"
 bp1_yearly.9026.desc.ambitious:0 "sua ambição interminável o torna insensível ao sofrimento de todos aqueles que estão no caminho do que você quer. Quantos títulos você deve manter? Quantas batalhas você deve vencer antes de ficar satisfeito?"
 bp1_yearly.9026.desc.arbitrary:0 "sua incapacidade de compreender o conceito de justiça e moralidade deixa todos tremendo de medo do seu julgamento errôneo."
 bp1_yearly.9026.desc.arrogant:0 "o amor que você sente por si mesmo o torna insensível ao amor dos seus semelhantes. Para que serve o amor que fica apenas por dentro?"
 bp1_yearly.9026.desc.callous:0 "a falta de cuidado e compaixão básica pelo sofrimento dos outros torna seu julgamento vazio, mas seu coração está pesado como um tijolo por cada ato vil que você comete."
 bp1_yearly.9026.desc.chaste:0 "[ROOT.Char.GetFaith.CreatorName|U] criou a humanidade para você se relacionar, e no entanto você permanece virgem para tantos prazeres e desejos."
 bp1_yearly.9026.desc.craven:0 "sua covardia está deixando uma mancha em sua consciência maior do que o sangue de qualquer batalha poderia dar. Quantos bravos guerreiros morreram em seu lugar?"
 bp1_yearly.9026.desc.cynical:0 "a sua dúvida na vontade de [ROOT.Char.GetFaith.HighGodName|U] está fazendo de você um servo de [ROOT.Char.GetFaith.DevilName|U]!"
 bp1_yearly.9026.desc.deceitful:0 "a trama e a mentira intermináveis nas quais você se envolve para conseguir o que quer serão a sua morte no final. Quando a verdade será suficiente? Você sequer sabe mais o que é real?"
 bp1_yearly.9026.desc.fallback:0 "todo pecado que você cometeu em sua vida foi testemunhado por [ROOT.Char.GetFaith.PantheonTerm], e nada disso é esquecido."
 bp1_yearly.9026.desc.gluttonous:0 "sua indulgência excessiva em comida, quando há aqueles que não têm nada, é uma obscenidade. Por que repetir o prato quando há aqueles que não terão nem o primeiro?"
 bp1_yearly.9026.desc.greedy:0 "seus dependentes estão sucumbindo ao peso da sua avareza impenitente e ganância."
 bp1_yearly.9026.desc.honest:0 "você acredita que a verdade o libertará, no entanto, muitas vezes as mentiras são a única maneira de proteger aqueles que amamos."
 bp1_yearly.9026.desc.impatient:0 "sua falta de paciência está transformando você em um monstro, sempre avançando para a próxima coisa e não dando quartel para aqueles que 'perdem seu tempo'."
 bp1_yearly.9026.desc.intro:0 "Me acomodo em minha cama, tão aconchegante quanto um bebê entre os seios de sua mãe, mas no momento em que meus olhos pesados finalmente se fecham para descansar, dou um salto na cama ao ver uma figura sentada ao meu lado!\n\nPara meu horror, não é ninguém menos que meu amigo falecido, [bp1_yearly_9026_dead_friend.GetFullName]! [bp1_yearly_9026_dead_friend.GetSheHe|U] ri com desdém enquanto grito de horror.\n\n\"Venha agora [ROOT.Char.GetFirstNameNoTooltip], é assim que se cumprimenta um velho amigo? Venho até você com um aviso,"
 bp1_yearly.9026.desc.killer:0 "você é a razão pela qual [bp1_yearly_9026_murder_victim.GetFullName] agora está no [ROOT.Char.GetFaith.PositiveAfterLife|U]."
 bp1_yearly.9026.desc.lazy:0 "sua inação está permitindo que a vontade de [ROOT.Char.GetFaith.DevilName|U] continue descontrolada. Você acha que está acima de seus deveres como [ROOT.Char.GetTitleAsNameNoTooltip]? E quanto aos seus deveres como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] para seus semelhantes?"
 bp1_yearly.9026.desc.lustful:0 "seus desejos carnais o distraem do verdadeiro caminho em direção ao [ROOT.Char.GetFaith.PositiveAfterLife|U]. Nenhuma quantidade de cópula jamais se comparará ao amor do divino!"
 bp1_yearly.9026.desc.murderer:0 "você nunca será perdoado pelo assassinato de [bp1_yearly_9026_murder_victim.GetName]."
 bp1_yearly.9026.desc.outro:0 "Você deve se arrepender pelo que fez. Aprendi da pior maneira que todo pecado que cometemos incorre em uma dívida com [ROOT.Char.GetFaith.HighGodName|U], meu amigo, e [ROOT.Char.GetFaith.HighGodNameSheHe|U] não perdoa os seus devedores."
 bp1_yearly.9026.desc.sadistic:0 "cada vez que você inflige dor alegremente a outro, você está apertando a corda em volta do pescoço do seu espírito."
 bp1_yearly.9026.desc.secret_murderer:0 "sabemos o que você fez com [bp1_yearly_9026_murder_victim.GetName], meu amigo."
 bp1_yearly.9026.desc.shy:0 "sua recusa em interagir com seus companheiros de viagem nesta vida está tornando você cada vez menos humano a cada dia. Você se acha acima deles?"
 bp1_yearly.9026.desc.temperate:0 "[ROOT.Char.GetFaith.CreatorName|U] criou este mundo e toda a comida nele para você se deliciar, e no entanto você recusa os presentes [ROOT.Char.GetFaith.CreatorHerHim|U]."
 bp1_yearly.9026.desc.torturer:0 "a dor que você inflige com prazer aos seus colegas é um crime contra a decência humana básica, e cada buraco que você perfura na pele de algum coitado perfura ainda mais fundo o seu coração."
 bp1_yearly.9026.desc.vengeful:0 "cada vez que você se vinga daqueles que lhe fizeram mal, você dá mais um passo para longe de [ROOT.Char.GetFaith.HighGodName|U]. Eles valem a pena?"
 bp1_yearly.9026.desc.wrathful:0 "não há uma alma que não tema seu temperamento terrível."
 bp1_yearly.9026.t:0 "Um Rosto do Passado"
 bp1_yearly.9027.a:0 "Você terá tudo o que precisa."
 bp1_yearly.9027.b:0 "Essas pessoas são tão pobres que aceitariam qualquer acordo que eu oferecesse!"
 bp1_yearly.9027.c:0 "Você quer quanto?"
 bp1_yearly.9027.desc.fallback:0 "[bp1_yearly_9027_peasant_begger.GetSheHe|U] pede o suficiente apenas para que seu povo sobreviva,"
 bp1_yearly.9027.desc.greedy:0 "O que [bp1_yearly_9027_peasant_begger.GetSheHe] pede é uma quantia escandalosa,"
 bp1_yearly.9027.desc.intro:0 "Já faz algum tempo desde que fui visitado pelo fantasma do meu antigo amigo [bp1_yearly_9027_dead_friend.GetName], mas agora começa o meu caminho em direção à redenção. Como [ROOT.Char.GetTitleAsNameNoTooltip], percebo agora que minha obrigação é com o meu povo, então entre o povo eu ando e pergunto o que eles desejariam de mim.\n\nUm[Select_CString( bp1_yearly_9027_peasant_begger.IsFemale, 'a', '' )] pobre [bp1_yearly_9027_peasant_begger.GetWomanMan] em trapos se aproxima de mim e implora que eu ajude os pobres e doentes de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], aqueles que não têm meios para cuidar de si mesmos."
 bp1_yearly.9027.desc.outro:0 "mas realmente existe um preço para a entrada no [ROOT.Char.GetFaith.PositiveAfterLife|U]?"
 bp1_yearly.9027.t:0 "Pobres Servos Infortunados"
 bp1_yearly.9028.a:0 "Farei qualquer coisa pela redenção!"
 bp1_yearly.9028.b:0 "Eu nunca vou me humilhar."
 bp1_yearly.9028.desc.bridge:0 "[bp1_yearly_9028_dead_rival.GetSheHe|U] lamenta. \"Eu fui [bp1_yearly_9028_dead_rival.GetDeathReason] e agora minha alma vaga por esta terra procurando por você! O que você fez comigo deixou uma mancha em sua alma, e você deve pedir perdão à minha família falecida!\"\n\n"
 bp1_yearly.9028.desc.callous:0 "A verdade seja dita, sinto que não devo me arrepender por nada, [Select_CString( bp1_yearly_9028_dead_rival.IsFemale, 'a', 'o' )] [bp1_yearly_9028_dead_rival.Custom2('InsultNoun', ROOT.Char)] tinha isso vindo para ele."
 bp1_yearly.9028.desc.fallback:0 "Sinto que essa mancha está afundando profundamente em minha alma, será que algum arrependimento será suficiente?"
 bp1_yearly.9028.desc.intro:0 "Acordo subitamente com aquela sensação familiar de frio por todo o meu corpo. Olho ao redor como antes, e desta vez vejo o meu antigo adversário já falecido [bp1_yearly_9028_dead_rival.GetFullName]!\n\n"
 bp1_yearly.9028.desc.murderer.fallback:0 "\"[ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_9028_dead_rival'))]!\""
 bp1_yearly.9028.desc.murderer:0 "\"Assassino!\""
 bp1_yearly.9028.desc.outro:0 "Recebi minhas instruções do outro lado, como devo proceder?"
 bp1_yearly.9028.t:0 "O Fantasma das Desavenças Passadas"
 bp1_yearly.9029.a:0 "Então, me humilharei e servirei."
 bp1_yearly.9029.b:0 "Para o [ROOT.Char.GetFaith.NegativeAfterLife] com [bp1_yearly_9029_rival.GetFirstNameNoTooltip]!"
 bp1_yearly.9029.desc.intro:0 "Já faz algum tempo desde minha primeira visita fantasmagórica, e estou completamente preparado para mais. O que eu não estava preparado era para o rosto escarnecedor de [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [bp1_yearly_9029_dead_parent.Custom2('RelationToMe', ROOT.Char)] a poucos centímetros do meu rosto!\n\n\"Filho perverso!"
 bp1_yearly.9029.desc.outro:0 "Você deve fazer esforços para encerrar sua rivalidade com [bp1_yearly_9029_rival.GetName], se humilhar e servir [bp1_yearly_9029_rival.GetSheHe] se for preciso!"
 bp1_yearly.9029.desc.rival:0 "O ódio é um caminho certo para o [bp1_yearly_9029_dead_parent.GetFaith.NegativeAfterLife], m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom('GetDaughterSon')] e você deve encerrar sua disputa se quiser mudar o seu destino."
 bp1_yearly.9029.desc.rival_sibling:0 "Você não vê como essa rixa entre o sangue do meu sangue aproxima toda a família do [bp1_yearly_9029_dead_parent.GetFaith.NegativeAfterLife]?"
 bp1_yearly.9029.desc.rival_sibling_unrelated:0 "Embora [bp1_yearly_9029_rival.GetName] não seja [Select_CString( bp1_yearly_9029_rival.IsFemale, 'minha', 'meu' )] [bp1_yearly_9029_rival.Custom('GetDaughterSon')], [bp1_yearly_9029_rival.GetSheHe] ainda é [Select_CString( bp1_yearly_9029_rival.IsFemale, 'sua', 'seu' )] [bp1_yearly_9029_rival.Custom('SisterBrother')] e sua rivalidade aproxima toda a família do [bp1_yearly_9029_dead_parent.GetFaith.NegativeAfterLife]!"
 bp1_yearly.9029.t:0 "[bp1_yearly_9029_dead_parent.Custom2('RelationToMe', ROOT.Char)|U]!"
 bp1_yearly.9030.a.tt_pilgrimage:0 "Sua próxima [pilgrimage|E] será mais barata"
 bp1_yearly.9030.a:0 "Farei o que for preciso."
 bp1_yearly.9030.b:0 "Não posso fazer mais."
 bp1_yearly.9030.desc.fallback:0 "Caridade! Quanto mais devo dizer? Um único ato não é suficiente, você deve criar o hábito de distribuir sua opulência!"
 bp1_yearly.9030.desc.intro:0 "Sinto a paralisia tomar conta do meu corpo quando [bp1_yearly_9026_dead_friend.GetFullName] aparece novamente para mim.\n\n\"Me diga, espírito, o que mais devo fazer para garantir meu lugar no [ROOT.Char.GetFaith.PositiveAfterLife]\"\n\n\"É bom que você pergunte, meu velho amigo."
 bp1_yearly.9030.desc.pilgrimage:0 "Aventure-se nas terras sagradas, lá você encontrará a redenção que busca. Não hesite, [ROOT.Char.GetFaith.HighGodName] está esperando por você lá."
 bp1_yearly.9030.t:0 "Segunda Visita de [bp1_yearly_9026_dead_friend.GetNamePossessive]"
 bp1_yearly.9031.a.forgiven:0 "Estou humilhado."
 bp1_yearly.9031.a:0 "Farei o que você pedir."
 bp1_yearly.9031.b.forgiven:0 "Retiro tudo!"
 bp1_yearly.9031.b:0 "Não serei degradado."
 bp1_yearly.9031.desc.cleanup:0 "Vejo uma ideia se formar naquela cabeça lenta e preguiçosa de [bp1_yearly_9031_rival_family.GetNamePossessiveNoTooltip].\n\n\"Oh, desde que [bp1_yearly_9031_rival.GetFirstNameNoTooltip] partiu, tive que reduzir o número de empregados de limpeza em nosso serviço. Se alguém pudesse ajudar a limpar minha casa, isso certamente conquistaria meu perdão.\""
 bp1_yearly.9031.desc.debate:0 "[bp1_yearly_9031_rival_family.GetNameNoTooltip] me olha com desprezo.\n\n\"É bom que você tenha percebido seus caminhos pecaminosos agora, mas tenho medo de que não posso perdoá-lo por crimes contra [bp1_yearly_9031_rival_family.GetFaith.ReligiousText], a menos que você possa me convencer em um debate.\""
 bp1_yearly.9031.desc.fallback:0 "[bp1_yearly_9031_rival_family.GetSheHe|U] me olha com olhos marejados.\n\n\"Perdoar você? Não, eu #EMP nunca#! vou perdoar você. Me faz adoecer ouvir você sequer mencionar o nome [bp1_yearly_9031_rival.GetHerHim]. Que ato eu poderia exigir como penitência pelo que você fez?\""
 bp1_yearly.9031.desc.flagellant:0 "Um sorriso repugnante se forma no rosto [bp1_yearly_9031_rival_family.GetHerHim].\n\n\"Ambos sabemos que é o perdão de [bp1_yearly_9031_rival_family.GetFaith.HighGodNamePossessive] que você busca, e a autoflagelação é a única maneira de alcançar isso. Faça isso com força, e eu vou perdoar você, e você melhor esperar que [bp1_yearly_9031_rival_family.GetFaith.HighGodNameSheHe|U] também faça.\""
 bp1_yearly.9031.desc.intro:0 "Finalmente consegui pegar [bp1_yearly_9031_rival_family.Custom2('MyCharacterIntroduction', bp1_yearly_9031_rival)] em um momento de folga. Frenético pela minha necessidade de perdão, caio de joelhos e imploro para ser absolvido por tudo o que fiz [Select_CString( bp1_yearly_9031_rival.IsFemale, 'a', 'ao' )] [bp1_yearly_9031_rival.GetFirstNameNoTooltip]."
 bp1_yearly.9031.desc.unconditional:0 "[bp1_yearly_9031_rival_family.GetSheHe|U] sorri e se abaixa para me encontrar.\n\n\"Levante-se, amigo. Tudo o que eu precisava ouvir era que você se arrepende, somos todos apenas crianças aos olhos de [bp1_yearly_9031_rival_family.GetFaith.HighGodName], afinal, todos nós cometemos erros.\""
 bp1_yearly.9031.t:0 "Perdoe-me"
 bp1_yearly.9032.a:0 "Farei qualquer coisa."
 bp1_yearly.9032.b:0 "Aproveite o momento e faça [bp1_yearly_9032_rival.GetSheHe] tropeçar!"
 bp1_yearly.9032.desc:0 "Assim como me foi pedido, encontrei [bp1_yearly_9032_rival.GetName] e imediatamente caí de joelhos, implorando pelo perdão [bp1_yearly_9032_rival.GetHerHim].\n\n\"Por [bp1_yearly_9032_rival.GetFaith.PantheonTerm|U], isso é bom demais! Você a meus pés, ha! Como eu sonhei com esse dia.\"\n\nEnquanto minha expressão permanecia inabalada como pedra, o tom [bp1_yearly_9032_rival.GetHerHim] começou a mudar.\n\n\"Você está falando sério? Bem, suponho que existem algumas coisas que você pode fazer para ganhar meu perdão...\""
 bp1_yearly.9032.t:0 "Fazendo as Pazes"
 bp1_yearly.9033.a:0 "Estou salvo!"
 bp1_yearly.9033.b:0 "Talvez [ROOT.Char.GetFaith.NegativeAfterLife] não seja tão ruim."
 bp1_yearly.9033.c:0 "Sou uma pessoa mudada."
 bp1_yearly.9033.desc.did_bad:0 "\"Quão bem? Quão bem? Condenado, [ROOT.Char.GetFirstNameNoTooltip]! Você está condenado ao [ROOT.Char.GetFaith.NegativeAfterLife] pela eternidade! Seu futuro é um quadro de horror e tragédia costurado por suas próprias mãos sangrentas! Eu retorno para descansar, fiz tudo o que pude para salvar sua alma.\""
 bp1_yearly.9033.desc.did_okay:0 "\"Bem, o que posso dizer? Você teve uma chance de redenção e a jogou fora. Embora você tenha dado alguns passos à frente, deu muitos mais passos para trás. Espero que você possa fazer mais para mudar, meu amigo. Por enquanto, devo voltar ao meu castigo eterno e espero não ver você lá comigo.\""
 bp1_yearly.9033.desc.did_well:0 "\"Oh amigo, você fez um trabalho incrível! Embora seu futuro ainda seja incerto, está em um estado muito melhor do que quando eu o visitei pela primeira vez! O peso em sua alma foi aliviado, e posso voltar ao meu castigo eterno, certo de que fiz tudo o que posso para salvá-lo do mesmo destino.\""
 bp1_yearly.9033.desc.intro:0 "Finalmente, [bp1_yearly_9026_dead_friend.GetFullName] vem até mim mais uma vez, e espero que seja a última. Levanto-me de meu sono e pergunto como tenho me saído em evitar meu destino.\n\n"
 bp1_yearly.9033.desc.outro:0 "\n\n[bp1_yearly_9026_dead_friend.GetFirstNameNoTooltip] desaparece mais uma vez e desta vez duvido que a verei novamente."
 bp1_yearly.9033.t:0 "A Última Noite"
 bp1_yearly.9034.a:0 "Correr!"
 bp1_yearly.9034.b:0 "Vamos ver o que [bp1_yearly_9034_witch.GetSheHe] quer."
 bp1_yearly.9034.desc.albino:0 "Entre a lama, consigo ver que a pele e o cabelo [bp1_yearly_9034_witch.GetHerHim] são brancos leitosos, e aqueles olhos vermelhos estão cheios de raiva. Antes de eu ter a chance de absorver a cena, [bp1_yearly_9034_witch.GetSheHe] começa a correr em minha direção!"
 bp1_yearly.9034.desc.beauty_bad:0 "Nunca vi uma criatura tão horrenda, mesmo a essa distância. Antes de eu ter a chance de absorver a cena, [bp1_yearly_9034_witch.GetSheHe] começa a correr em minha direção!"
 bp1_yearly.9034.desc.giant:0 "[bp1_yearly_9034_witch.GetSheHe|U] se aproxima de mim, sua figura imponente fazendo [bp1_yearly_9034_witch.GetSheHe] tropeçar e cair sob seu próprio peso!"
 bp1_yearly.9034.desc.hunchbacked:0 "[bp1_yearly_9034_witch.GetSheHe|U] se aproxima de mim, todo o seu corpo dobrado de forma anormal, como se [bp1_yearly_9034_witch.GetSheHe] estivesse amarrado em um nó."
 bp1_yearly.9034.desc.intro:0 "Estou me divertindo brincando nos pântanos de [bp1_yearly_9034_swampy_location.GetNameNoTooltip] com meu amigo [bp1_yearly_9034_friend.GetName]. Estamos tão envolvidos na brincadeira que nem percebemos que nos separamos de [bp1_yearly_9034_guardian.GetName]!\n\nDe repente, vemos uma bruxa do pântano surgir do lodo e da lama, coberta de lama. [bp1_yearly_9034_witch.GetSheHe|U] olha para nós, e antes que eu perceba, [bp1_yearly_9034_friend.GetName] já saiu correndo!"
 bp1_yearly.9034.desc.outro:0 "\n\nCom meu amigo e guardião longe, sou apenas eu e a bruxa, mas o que faço?"
 bp1_yearly.9034.desc.scaly:0 "Sua pele é semelhante à de um lagarto, cheia de protuberâncias e dobras. Antes de eu ter a chance de absorver a cena, [bp1_yearly_9034_witch.GetSheHe] começa a correr em minha direção!"
 bp1_yearly.9034.t:0 "Uma Bruxa das Águas"
 bp1_yearly.9035.a:0 "Uma curandeira? Eu poderia usar um novo médico..."
 bp1_yearly.9035.b:0 "Me ensine seus segredos, oh sábi[Select_CString( bp1_yearly_9034_witch.IsFemale, 'a', 'o' )] [bp1_yearly_9034_witch.GetWomanMan]."
 bp1_yearly.9035.c:0 "Quem perguntou?"
 bp1_yearly.9035.desc:0 "Quando finalmente a bruxa termina de se aproximar, [bp1_yearly_9034_witch.GetSheHe] dá um tapa em um inseto no meu rosto e limpa-o na túnica [bp1_yearly_9034_witch.GetHerHim].\n\n\"Cuidado por essas bandas, jovem. Até as criaturas pequenas podem te pegar se você não for cuidadoso. Eu deveria saber, já curei muitas bochechas inchadas de viajantes perdidos.\"\n\nClaramente não é o monstro que eu inicialmente pensei, [bp1_yearly_9034_witch.GetSheHe] se apresenta como uma curandeira e maga local, bem versada em medicina herbal e práticas rituais para exorcizar espíritos de pessoas e objetos. Talvez ess[Select_CString( bp1_yearly_9034_witch.IsFemale, 'a', 'e' )] [bp1_yearly_9034_witch.GetWomanMan] possa servir a um propósito mais nobre."
 bp1_yearly.9035.t:0 "A Boa Bruxa do Pântano"
 bp1_yearly.9036.a:0 "[bp1_yearly_9034_guardian.GetNameNoTooltip], me ajude!"
 bp1_yearly.9036.desc:0 "[Select_CString( bp1_yearly_9034_witch.IsFemale, 'A bruxa', 'O bruxo' )] [bp1_yearly_9034_witch.Custom2('InsultAdjective', ROOT.Char)] agarra-me com seus dedos longos e ressequidos, segurando-me tão apertado que posso sentir o sangue nos meus braços ficar parado.\n\n\"O que na nome de [bp1_yearly_9034_witch.GetFaith.WitchGodName] você está fazendo no meu pântano, s[Select_CString( ROOT.Char.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom('InsultNoun')] [ROOT.Char.Custom('InsultAdjective')]? Você tem alguma ideia dos espíritos malignos neste lugar? Criança perversa!\"\n\nTento explicar para [bp1_yearly_9034_witch.GetSheHe] que sou [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip|U], mas [bp1_yearly_9034_witch.GetSheHe] está totalmente fora de controle neste ponto. Sinto meu corpo enfraquecendo e minha pele começar a se partir quando vejo [bp1_yearly_9034_guardian.Custom2('MyCharacterIntroduction', ROOT.Char)] aparecer."
 bp1_yearly.9036.guardian_loses:0 "[bp1_yearly_9034_guardian.GetNameNoTooltip] não consegue me salvar de ferimentos"
 bp1_yearly.9036.guardian_wins:0 "[bp1_yearly_9034_guardian.GetNameNoTooltip] é vitorioso"
 bp1_yearly.9036.t:0 "A Bruxa Malvada do Pântano"
 bp1_yearly.9037.a:0 "[bp1_yearly_9037_guardian.GetNameNoTooltip], olha o que eu encontrei!"
 bp1_yearly.9037.b:0 "Corra e grite!"
 bp1_yearly.9037.custom:0 "Meu guardião [bp1_yearly_9037_guardian.GetName] saberá o que fazer..."
 bp1_yearly.9037.desc:0 "Fui levado para os pântanos de [bp1_yearly_9037_swampy_location.GetNameNoTierNoTooltip] por [bp1_yearly_9037_guardian.Custom2('MyCharacterIntroduction', ROOT.Char)], e verdadeiramente é um lugar maravilhoso!\n\nCorro e brinco, chutando a água pútrida ao redor e jogando pedras na lama, vivendo verdadeiramente a melhor vida de um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip], quando vejo algo se aproximando lentamente de mim.\n\nAbrindo caminho entre os juncos está o rosto de um estranho cadáver, seu olhar de puro terror imaculadamente preservado pelos minerais da água do pântano."
 bp1_yearly.9037.t:0 "O Corpo no Pântano"
 bp1_yearly.9038.a:0 "Não sei o que dizer."
 bp1_yearly.9038.b:0 "Corra e conte para todo mundo!"
 bp1_yearly.9038.c:0 "Empurre [bp1_yearly_9037_guardian.GetSheHe] com força para o pântano."
 bp1_yearly.9038.desc.intro:0 "À medida que [bp1_yearly_9037_guardian.Custom2('MyCharacterIntroduction', ROOT.Char)] se aproxima, o rosto [bp1_yearly_9037_guardian.GetHerHim] se contorce em uma expressão de desconforto e horror ao ver o rosto do corpo no pântano.\n\n\"Este é [bp1_yearly_9037_corpse.GetNameNoTooltip]... Eu matei [bp1_yearly_9037_corpse.GetSheHe]."
 bp1_yearly.9038.desc.killer:0 "Você entende, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] jovem [ROOT.Char.GetTitleAsNameNoTooltip], que eu não posso exatamente deixar você sair por aí contando para todo mundo o que você viu aqui. A coisa interessante sobre lugares como este é que eles são tão remotos e perigosos que ninguém jamais pensaria em procurar você aqui. Você sabe nadar bem, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip]?\""
 bp1_yearly.9038.desc.not_killer:0 "Eu nunca tive a intenção de contar a ninguém, mas não adianta esconder agora. Não me orgulho do que fiz, [ROOT.Char.GetFirstNameNoTooltip], só espero que você possa me perdoar como seu amoroso mentor.\""
 bp1_yearly.9038.t:0 "Um Segredo Revelado"
 bp1_yearly.9039.a:0 "Que presente... estranho."
 bp1_yearly.9039.b:0 "Não, tenho quase certeza de que isso é um espírito maligno."
 bp1_yearly.9039.desc:0 "[bp1_yearly_9037_guardian.GetName] parece tão chocado e horrorizado quanto eu ao ver esse corpo no pântano, mas o olhar de horror [bp1_yearly_9037_guardian.GetHerHim] logo se transforma em fascinação.\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom('GirlBoy')], você reconhece essas roupas? Sem dúvida, é um estilo camponês de trezentos anos atrás! Não há dúvida de que esse corpo foi preservado como nenhum outro que já vi! Por que, é um milagre de [bp1_yearly_9037_guardian.GetFaith.HighGodName|U]! Disso não há dúvida! Permita-me coletar esses ossos e fazer um belo presente para você.\"\n\n[bp1_yearly_9037_guardian.GetFaith.HighGodName|U] parece ter uma maneira estranha de mostrar 'milagres', mas se [bp1_yearly_9037_guardian.GetNameNoTooltip] diz que é verdade, então deve ser."
 bp1_yearly.9039.t:0 "O Cadáver Imaculado"
 bp1_yearly.9040.a:0 "Oh, me segure como fazíamos há tanto tempo!"
 bp1_yearly.9040.b:0 "Desapareça, espírito."
 bp1_yearly.9040.desc:0 "Estou deitado confortavelmente na minha cama quando sinto um toque familiar deslizando pelo meu peito nu. A princípio, não dou importância, mas à medida que meus olhos se abrem com dificuldade, vejo que é minha querida [bp1_yearly_9040_dead_lover.GetName] sentada ao meu lado!\n\n\"Oh, meu [ROOT.Char.Custom('LoverPetName')], faz tanto tempo, não é? Mas quando eu te abraço e te beijo, o amor não retorna ao seu coração como se tudo tivesse acontecido ontem? Me segure, meu [ROOT.Char.Custom('LoverPetName')], me ame novamente!\"\n\nNão posso acreditar, mas vejo [bp1_yearly_9040_dead_lover.GetSheHe] e sinto [bp1_yearly_9040_dead_lover.GetSheHe]! Embora saiba que isso seja um sonho, é tão vívido que simplesmente não posso resistir."
 bp1_yearly.9040.t:0 "A Visita de um Amante"
 bp1_yearly.9041.a:0 "Deixe sair, estou aqui."
 bp1_yearly.9041.b:0 "Haha! Que bebê chorão!"
 bp1_yearly.9041.desc:0 "Encontro [bp1_yearly_9041_sibling.Custom2('MyCharacterIntroduction', ROOT.Char)] encostado em um canto distante de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], chorando suavemente. Quando [bp1_yearly_9041_sibling.GetSheHe] percebe minha aproximação, [bp1_yearly_9041_sibling.GetSheHe] se levanta e tenta em vão enxugar os olhos.\n\n\"Ah, [ROOT.Char.Custom('SisterBrother')], me desculpe, eu não deveria estar chorando. Afinal, você tem mais motivos para sentir falta [Select_CString( bp1_yearly_9041_parent.IsFemale, 'da nossa', 'do nosso' )] [bp1_yearly_9041_parent.GetMotherFather] do que eu. Vou sair do seu caminho.\"\n\nNa verdade, não tenho tido tempo para pensar [Select_CString( bp1_yearly_9041_parent.IsFemale, 'na', 'no' )] [bp1_yearly_9041_parent.GetMotherFather] desde que assumi o trono, mas [bp1_yearly_9041_sibling.GetNameNoTooltip] parece profundamente abalado."
 bp1_yearly.9041.t:0 "Memórias de um[Select_CString( bp1_yearly_9041_parent.IsFemale, 'a', '' )] [bp1_yearly_9041_parent.GetMotherFather|U]"
 bp1_yearly.9042.a:0 "Você está completamente certo!"
 bp1_yearly.9042.b:0 "Isso é definitivamente sacrilégio."
 bp1_yearly.9042.c:0 "Que milagre, devo consumi-lo!"
 bp1_yearly.9042.desc:0 "Mais um dia liderando meu [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|L] traz poucas surpresas, exceto [bp1_yearly_9042_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)] entrando apressadamente na minha sala do trono, acenando animadamente com um saco de doces na minha frente.\n\n\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip]! M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip]! Oh, é um milagre! Eu estava inspecionando a refeição do cozinheiro para você esta noite quando percebi o quanto esses itens se parecem com o rosto de ninguém menos que [ROOT.Char.GetFaith.HealthGodName]!\"\n\nApós uma inspeção mais detalhada, devo admitir que a semelhança é impressionante, mas isso certamente deve ser heresia."
 bp1_yearly.9042.t:0 "O Rosto de [ROOT.Char.GetFaith.HealthGodName]"
 bp1_yearly.9043.a:0 "Você comeu um bebê? Parece divertido!"
 bp1_yearly.9043.b:0 "#EMP Guardas!#!"
 bp1_yearly.9043.c:0 "Apenas sorria e siga em frente."
 bp1_yearly.9043.desc:0 "É outro dia encantador de oração e serviço do meu maravilhoso [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName], e enquanto me preparo para sair, [bp1_yearly_9043_chaplain.GetName] para no meu caminho. [bp1_yearly_9043_chaplain.GetSheHe|U] espera até que todos os outros tenham ido embora e depois se inclina perto do meu ouvido.\n\n\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip], devo dizer-lhe que não sou estranho aos prazeres da vida. Nenhuma forma de perversão é muito depravada para mim: animal, vegetal ou mineral. Francamente, farei qualquer coisa a qualquer coisa, e não há alegria nesta vida melhor do que consumir a carne dos pequenos. Você não viveu até provar carne humana, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip], e eu não adoraria nada mais do que tê-lo como jantar esta noite!\"\n\nSurpreso é pouco para descrever o que sinto ao ouvir isso, mas o que diabos devo dizer?"
 bp1_yearly.9043.t:0 "O Comensal [ROOT.Char.GetFaith.BishopNeuter|U] de Bebês"
 bp1_yearly.9044.a.guilty:0 "Sinto muito que tenha terminado assim."
 bp1_yearly.9044.a.indifferent:0 "Não foi nada pessoal."
 bp1_yearly.9044.desc.outro.memory:0 "Tenho um carinho especial pelo momento em que [bp1_yearly_9044_memory_scope.GetDescription], e lamento que não compartilharemos mais bons momentos como este."
 bp1_yearly.9044.desc.outro.no_memory:0 "Só posso esperar encontrar [recipient.GetSheHe] novamente no [ROOT.Char.GetFaith.PositiveAfterLife], se [recipient.GetSheHe] me perdoar."
 bp1_yearly.9044.desc:0 "Eu havia esperado encontrar em mim mesmo a força para ficar longe da execução de [recipient.GetName], mas evidentemente não posso resistir em me despedir.\n\nEu realmente tinha me importado com [recipient.GetSheHe] de uma forma que ninguém entenderia, mas os eventos que levaram à prisão [recipient.GetHerHim] foram de sua própria autoria, e não posso fazer exceções para a justiça.\n\n[recipient.GetFirstNameNoTooltip] passou seus momentos finais olhando para mim com traição em seus olhos embaçados antes de um último #EMP estalo#! e [recipient.GetSheHe] não existia mais. Eu fico com seu corpo sem vida por um tempo e relembro todos os bons momentos que tivemos juntos na vida."
 bp1_yearly.9044.t:0 "A Execução"
 bp1_yearly.9045.a.guilty:0 "Por que você me mostrou isso?"
 bp1_yearly.9045.a.indifferent:0 "Posso ir para casa agora?"
 bp1_yearly.9045.a.sadistic:0 "Que grande espetáculo!"
 bp1_yearly.9045.desc.brave:0 "[recipient.GetFirstNameNoTooltip] encara o carrasco no rosto e parece pronto para cuspir quando finalmente [recipient.GetSheHe] me nota observando. Seus olhos nunca deixam os meus, nem por um momento, franzindo o cenho profundamente além dos meus olhos e na minha alma, com nada além de puro ódio e desprezo."
 bp1_yearly.9045.desc.fallback:0 "Os olhos de [recipient.GetNamePossessiveNoTooltip] estão vermelhos de suas lágrimas. À medida que [recipient.GetSheHe] se aproxima do carrasco, [recipient.GetSheHe] tenta ficar em silêncio, mas não consegue evitar gemer suavemente e engasgar enquanto [recipient.GetSheHe] contempla sua iminente morte."
 bp1_yearly.9045.desc.intro:0 "Um tempo depois de dar a ordem de executar [recipient.GetName], [bp1_yearly_9045_guardian.Custom2('MyCharacterIntroduction', ROOT.Char)] me levou até o cadafalso, prometendo que o que eu veria seria uma valiosa oportunidade de aprendizado.\n\n"
 bp1_yearly.9045.desc.outro:0 "\n\nIndependentemente de como este espetáculo me faça sentir, tudo termina rápido demais para eu sequer ter a chance de cancelar o ato. Uma vez que o feito está consumado e o coração de [recipient.GetNamePossessiveNoTooltip] não bate mais, [bp1_yearly_9045_guardian.GetNameNoTooltip] me deixa sozinho com o corpo para contemplar o que fiz."
 bp1_yearly.9045.desc.zealous:0 "Vejo [recipient.GetName] se aproximar do carrasco de olhos bem fechados. No silêncio do pátio, posso ouvir [recipient.GetSheHe] murmurando preces e cânticos ininteligíveis em suas mãos, como se houvesse esperança de que [recipient.GetFaith.HighGodName|U] estivesse disposto a vir e evitar sua morte prematura."
 bp1_yearly.9045.t:0 "A Execução"
 bp1_yearly.9046.a.indifferent:0 "Ha! Que espetáculo!"
 bp1_yearly.9046.a:0 "Bem, não há nada que eu possa fazer."
 bp1_yearly.9046.b:0 "Este evento não sai desta sala."
 bp1_yearly.9046.desc.christian:0 "A pia batismal agora corre com um rico marrom de matéria fecal do meu bebê. A cabeça [bp1_yearly_9046_poopy_child.GetHerHim|U] já foi mergulhada na água benta para o Pai, e posso apenas assistir enquanto ela é mergulhada mais duas vezes pelo Filho e pelo Espírito Santo."
 bp1_yearly.9046.desc.intro:0 "Chegou finalmente o momento de nomear o meu querido recém-nascido [bp1_yearly_9046_poopy_child.GetName] aos olhos de [ROOT.Char.GetFaith.HighGodName], e todos os homens e mulheres importantes do [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] se reuniram para testemunhar este dia sagrado. Enquanto [bp1_yearly_9046_chaplain.GetName] cumpre o seu dever sagrado, sinto um cheiro desagradável entrar pelas minhas narinas.\n\n"
 bp1_yearly.9046.desc.not_christian:0 "Pela substância marrom escorrendo entre as mãos de [bp1_yearly_9046_chaplain.GetNamePossessiveNoTooltip], está claro que meu querido [bp1_yearly_9046_poopy_child.GetNameNoTooltip] não conseguiu segurar para [ROOT.Char.GetFaith.HighGodName]."
 bp1_yearly.9046.desc.outro:0 "Apesar do mau cheiro e das zombarias da congregação, [bp1_yearly_9046_chaplain.GetNameNoTooltip] permanece profissional.\n\nTenho a sensação de que este evento assombrará meu recém-nascido pelo resto de sua vida, e o nome [bp1_yearly_9046_poopy_child.GetFirstNameNoTooltip] pode para sempre ser associado às fezes de bebê."
 bp1_yearly.9046.t:0 "Um Nome Marrom"
 bp1_yearly.9047.a:0 "Usarei até morrer."
 bp1_yearly.9047.b:0 "O quê? Isso é nojento!"
 bp1_yearly.9047.desc:0 "Estou envolvido com o meu querido [bp1_yearly_9047_lover.GetName] em nossa conversa habitual de travesseiro, enrolando os adoráveis cabelos [bp1_yearly_9047_lover.GetHerHim] ao redor dos meus dedos.\n\n\"Você ama meu cabelo assim, meu [ROOT.Char.Custom('LoverPetName')]? Talvez você devesse carregá-lo sempre consigo enquanto desempenha suas funções como [ROOT.Char.GetTitleAsNameNoTooltip], para que todos vejam que você e eu somos um só.\"\n\nPensei inicialmente que [bp1_yearly_9047_lover.GetSheHe] estava brincando, mas rapidamente fica claro que [bp1_yearly_9047_lover.GetSheHe] realmente pretende que eu use seu cabelo como um acessório para todos verem!"
 bp1_yearly.9047.t:0 "Um Amoroso Cabelo"
 bp1_yearly.9048.a:0 "O mundo terá um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.Custom('InsultNoun')] [ROOT.Char.Custom('InsultAdjective')] a menos quando eu terminar!"
 bp1_yearly.9048.b:0 "Oh, vá embora, [ROOT.Char.Custom('InsultNoun')]."
 bp1_yearly.9048.desc:0 "[bp1_yearly_9048_nemesis.GetName] nunca deixa de mostrar sua face horrível exatamente no momento certo para arruinar o meu dia. Desta vez, [bp1_yearly_9048_nemesis.GetSheHe] parece particularmente cheio de veneno quando se aproxima de mim na minha [ROOT.Char.Custom('GetCourt')] com fogo nos olhos.\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Sua absoluta', 'Seu absoluto' )] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_9048_nemesis'))]! [Select_CString( ROOT.Char.IsFemale, 'Sua total', 'Seu total' )] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_9048_nemesis'))]! S[Select_CString( ROOT.Char.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_9048_nemesis'))] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('bp1_yearly_9048_nemesis'))]! Cada respiração nos seus pulmões é um desperdício e um insulto a todas as coisas vivas. Estou cansado de olhar para tal perversão retorcida da criação de [bp1_yearly_9048_nemesis.GetFaith.CreatorNamePossessive], e exijo satisfação. Isso entre nós termina agora! Lute comigo!\"\n\nAntes que eu tenha chance de reagir, [bp1_yearly_9048_nemesis.GetName] já está posicionado para me derrubar!"
 bp1_yearly.9048.t:0 "Lutando contra um Demônio"
 bp1_yearly.9049.a:0 "Eu vou arrancar um pedaço de você!"
 bp1_yearly.9049.b:0 "Isso acabou."
 bp1_yearly.9049.c:0 "$bp1_yearly.9049.b$.. para você!"
 bp1_yearly.9049.desc:0 "[bp1_yearly_9048_nemesis.GetName] cai aos meus pés, ensanguentado e quebrado devido à tentativa patética [bp1_yearly_9048_nemesis.GetHerHim] de me derrotar. A luta acabou e eu sou o vencedor claro, mas ainda sinto um fogo queimando no meu coração. Meus punhos desejam nada mais do que esmagar ess[Select_CString( ROOT.Char.IsFemale, 'a', 'e' )] [bp1_yearly_9048_nemesis.Custom2('InsultNoun', ROOT.Char)] [bp1_yearly_9048_nemesis.Custom2('InsultAdjective', ROOT.Char)] no chão até que nada reste além de uma mancha ensanguentada.\n\n[bp1_yearly_9048_nemesis.GetNameNoTooltip] ergue suas mãos fracamente sobre seu rosto, olhos cheios do medo de um(a) [ROOT.Char.Custom('GetAnimalType')] que sabe que a caçada chegou ao fim."
 bp1_yearly.9049.t:0 "Apenas Sobremesas?"
 bp1_yearly.9050.a:0 "Ninguém conta uma história como [bp1_yearly_9050_friend.GetFirstNameNoTooltip]!"
 bp1_yearly.9050.b:0 "A #EMP minha#! história é claramente melhor!"
 bp1_yearly.9050.desc:0 "Uma das coisas favoritas de [bp1_yearly_9050_friend.GetNamePossessive] de fazer comigo é sentar perto do fogo e trocar histórias de guerra numa noite bonita, e esta noite temos relembrado desde o sol até a lua, até o sol novamente!\n\nEu começo contando sobre o momento em que [bp1_yearly_9050_my_memory.GetDescription], o que faz com que [bp1_yearly_9050_friend.GetFirstNameNoTooltip] segure suas mãos e ria.\n\n\"Uma bela história! Embora, verdade seja dita, digo-lhe amigo, não há evento mais glorioso em toda a história do que quando [bp1_yearly_9050_friend_memory.GetDescription]! Ha! Que dias gloriosos tivemos, e rezo para que muitas outras glórias venham!"
 bp1_yearly.9050.t:0 "Histórias de Guerra"
 bp1_yearly_9034_witchy_goodbad_tt:0 "#EMP A bruxa pode ser diferente do que você espera...#!"
