l_spanish:
 vassal_interaction.0001.a:0 "Seu desejo é uma ordem, meu Senhor."
 vassal_interaction.0001.accept:0 "[actor.GetFirstNameNoTooltip] aceita minha solicitação"
 vassal_interaction.0001.b:0 "Isso é uma questão de honra, não desistida facilmente."
 vassal_interaction.0001.c:0 "Já investi tanto nessa guerra..."
 vassal_interaction.0001.d:0 "Não, levarei isso até o fim!"
 vassal_interaction.0001.decline:0 "[actor.GetFirstNameNoTooltip] recusa"
 vassal_interaction.0001.desc:0 "Exijo que você cesse imediatamente sua guerra contra [defender.GetTitledFirstName] do [defender.GetPrimaryTitle.GetName]!\n\nO reino perdura quando estamos unidos, não divididos."
 vassal_interaction.0001.e:0 "Não. E você não pode me impedir!"
 vassal_interaction.0001.opening:0 "[actor.Custom2('GreetingToVassal', ROOT.Char)]"
 vassal_interaction.0001.request_favor_tt:0 "Eu solicito um [favor|E] em troca"
 vassal_interaction.0001.request_gold_tt:0 "Eu solicito ouro em troca"
 vassal_interaction.0002.a:0 "Um servo obediente é um bom servo."
 vassal_interaction.0002.desc:0 "É claro que obedecerei à sua sabedoria e desejo. Embora minha causa seja justa, eu a abandonarei por agora, pelo bem do reino."
 vassal_interaction.0002.opening:0 "[recipient.Custom2('GreetingToLiege', ROOT.Char)]"
 vassal_interaction.0003.a:0 "Você tem a minha palavra."
 vassal_interaction.0003.b.tt:0 "A guerra continua"
 vassal_interaction.0003.b:0 "Você deveria estar fazendo o que eu digo, não importa o quê!"
 vassal_interaction.0003.desc:0 "Estou muito perto de alcançar meus objetivos para desistir sem receber nada em troca. Eu cederei se você me prometer uma restituição futura."
 vassal_interaction.0004.a:0 "Compensação é apenas justa."
 vassal_interaction.0004.b:0 "Isso é um valor ultrajante!"
 vassal_interaction.0004.desc:0 "Essa guerra custou caro demais para mim para abandoná-la agora. No entanto, uma pequena contribuição para restaurar meu tesouro pode me convencer do contrário."
 vassal_interaction.0005.a:0 "Como você se atreve a me desafiar!"
 vassal_interaction.0005.b:0 "Terei que aceitar. Dessa vez."
 vassal_interaction.0005.desc:0 "Tenho o maior respeito pelos seus desejos, mas o destino já está selado. Levarei essa guerra até o fim."
 vassal_interaction.0005.opening:0 "[recipient.Custom2('GreetingToLiege', ROOT.Char)]"
 vassal_interaction.0006.a:0 "Obrigado por sua generosidade."
 vassal_interaction.0006.b:0 "Obrigado por sua generosidade."
 vassal_interaction.0006.desc:0 "Sua causa é justa, e seria injusto exigir isso de você sem qualquer recompensa."
 vassal_interaction.0006.favor:0 "Eu ficarei te devendo por essa."
 vassal_interaction.0006.gold:0 "Eu pagarei o ouro que você perdeu, contanto que a luta termine agora."
 vassal_interaction.0007.a:0 "Muito bem. Tenho uma guerra para voltar."
 vassal_interaction.0007.desc:0 "Estou indignado que você exija subornos para cumprir as ordens do seu senhor feudal! Você me enviou nada menos que uma recusa desonrosa à minha demanda!"
 vassal_interaction.0011.a:0 "Se é assim que deve ser, meu Senhor."
 vassal_interaction.0011.b:0 "Por favor, não me peça para abandonar minha honra por nada."
 vassal_interaction.0011.c:0 "Esse é um sacrifício custoso que você me pede..."
 vassal_interaction.0011.d:0 "Não, eu vou lutar contra [attacker.GetSheHe]!"
 vassal_interaction.0011.desc:0 "A reivindicação d[Select_CString( attacker.IsFemale, 'a', 'o' )] [attacker.GetTitledFirstName] é justa. Exijo que você se renda a [attacker.GetSheHe] imediatamente, para restaurar a ordem no reino."
 vassal_interaction.0012.a:0 "Recompensas pela lealdade sempre vêm com o tempo."
 vassal_interaction.0012.desc:0 "Eu imploro para que você considere o quanto você me pediu, mas se é sua vontade, eu me renderei [Select_CString( attacker.IsFemale, 'a', 'ao' )] [attacker.GetTitledFirstName]. Pelo bem do reino."
 vassal_interaction.0013.desc:0 "Eu perderia muito se desistisse da guerra contra [attacker.GetTitledFirstName]. Só posso ceder se você prometer restituição futura."
 vassal_interaction.0014.desc:0 "Render-se à guerra teria um custo muito alto. No entanto, se você me compensar pela perda, eu posso fazer o que você pede."
 vassal_interaction.0015.desc:0 "Eu perderia muito se me rendesse. Não desejo desobedecer, mas [attacker.GetTitledFirstName] me forçou."
 vassal_interaction.0016.a:0 "Pelo menos ainda não perdi tudo."
 vassal_interaction.0016.b:0 "Usarei isso para me recuperar."
 vassal_interaction.0016.gold:0 "Eu pagarei pelas suas perdas, contanto que a luta termine agora."
 vassal_interaction.0022.a:0 "Muito bem."
 vassal_interaction.0022.desc:0 "Estou escrevendo para informar que eu concedi independência ao seu colega vassalo, [recipient.GetName]."
 vassal_interaction.0023.a:0 "Muito bem."
 vassal_interaction.0023.desc:0 "Estou escrevendo para informar que eu concedi independência ao meu vassalo, [recipient.GetName]."
 vassal_interaction.0030.a:0 "Segurança, afinal!"
 vassal_interaction.0030.desc:0 "Seu apelo é justo, e me vejo convencido por seus argumentos.\n\nPor meio deste, eu o perdoo de todos e quaisquer crimes atuais aos olhos do [recipient.GetPrimaryTitle.GetNameNoTooltip], em perpetuidade. Você permanecerá um[Select_CString( actor.IsFemale, 'a', '' )] [actor.GetWomanMan] livre!"
 vassal_interaction.0040.a:0 "Permiti que [actor.GetFirstNameNoTooltip] se tornasse muito forte..."
 vassal_interaction.0040.desc:0 "Enquanto você mantém [target.GetBaseName], fica claro para todos que é #EMP eu#! quem o governa. Suas muitas [county_in_title.Custom('TerrainTypeProvince')] e aldeias são supervisionadas pelos #EMP meus#! bailiffs e magistrados.\n\nPortanto, estou reivindicando isso. Você pode conceder o título a mim quando desejar, caso contrário, tenho certeza de que ele acabará caindo para mim em breve.\n\nDe uma forma ou de outra."
 vassal_interaction.war_ender_gives_up:0 "[recipient.GetShortUIName|U] desistiu de sua guerra, por ordens de [actor.GetShortUINamePossessive]"
 vassal_interaction.you_owe_me:0 "Você fará o que eu digo!"
