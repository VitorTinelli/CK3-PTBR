l_spanish:
 msg_pledged_loyalty_to_liege.liege.desc:0 "[pledge_loyalty_to_liege_vassal.GetShortUIName] prestou sua lealdade a você prostrando-se formalmente diante de você"
 msg_pledged_loyalty_to_liege.subject.desc:0 "Você demonstrou sua lealdade a [pledge_loyalty_to_liege_vassal.GetLiege.GetShortUIName] ao se prostrar formalmente diante [pledge_loyalty_to_liege_vassal.GetLiege.GetHerHim]"
 msg_pledged_loyalty_to_liege:0 "Vassalo Prestou Lealdade"
 msg_pledged_loyalty_to_liege_desc:0 "$EFFECT$"
 msg_refused_pledge_loyalty_to_liege.liege.desc:0 "Você ganhou o direito de $revoke_title_interaction$ devido à falha de [SCOPE.sC('pledge_loyalty_to_liege_offender').GetShortUINamePossessive] em #V Prestar Lealdade#! a você"
 msg_refused_pledge_loyalty_to_liege.subject.desc:0 "[ROOT.Char.GetLiege.GetShortUIName] ganhou o direito de $revoke_title_interaction$ devido à sua falha em #V Prestar Lealdade#! a [ROOT.Char.GetLiege.GetSheHe]"
 msg_refused_pledge_loyalty_to_liege:0 "Recusou-se a Se Curvar"
 msg_refused_pledge_loyalty_to_liege_desc:0 "$EFFECT$"
 pledge_loyalty_to_liege.0001.a:0 "Fornecer os favores costumeiros em resposta."
 pledge_loyalty_to_liege.0001.b:0 "Não dar nada em troca para [pledge_loyalty_to_liege_vassal.GetSheHe]."
 pledge_loyalty_to_liege.0001.c.honored:0 "#EMP [pledge_loyalty_to_liege_vassal.GetShortUIName] verá isso como uma honra#!"
 pledge_loyalty_to_liege.0001.c.insulted:0 "#EMP [pledge_loyalty_to_liege_vassal.GetShortUIName] verá isso como um insulto!#!"
 pledge_loyalty_to_liege.0001.c:0 "Superar os presentes [pledge_loyalty_to_liege_vassal.GetHerHim] com dádivas ainda mais generosas."
 pledge_loyalty_to_liege.0001.desc.contract:0 "Para marcar seu domínio e minha fidelidade, oferecerei maiores obrigações como seu vassalo."
 pledge_loyalty_to_liege.0001.desc.gold:0 "Trago-lhe ricos presentes dignos de sua majestade, como um gesto de minha boa vontade e servidão."
 pledge_loyalty_to_liege.0001.desc.hook:0 "Dou minha palavra de que farei tudo o que desejar de mim, [Select_CString( pledge_loyalty_to_liege_scope.IsFemale, 'minha', 'meu' )] [pledge_loyalty_to_liege_scope.GetLadyLord]."
 pledge_loyalty_to_liege.0001.desc.submission:0 "Espero que meu juramento de submissão por si só seja prova suficiente da minha honra."
 pledge_loyalty_to_liege.0001.desc:0 "Cheguei em [pledge_loyalty_to_liege_scope.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] para prestar homenagem a você, glorios[Select_CString( pledge_loyalty_to_liege_scope.IsFemale, 'a', 'o' )] [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip], como demonstração da minha lealdade.\n\n"
 pledge_loyalty_to_liege.0001.opening:0 "[pledge_loyalty_to_liege_vassal.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 pledge_loyalty_to_liege.0009.a:0 "Ultrajante!"
 pledge_loyalty_to_liege.0009.desc:0 "Não sou enganad[Select_CString( pledge_loyalty_to_liege_scope.IsFemale, 'a', 'o' )] pelo seu ato [pledge_loyalty_to_liege_vassal.Custom2('InsultAdjective', SCOPE.sC('pledge_loyalty_to_liege_scope'))]; um juramento de homenagem vindo de você não significaria nada para mim."
 pledge_loyalty_to_liege.0009.opening:0 "[pledge_loyalty_to_liege_scope.Custom2('AppropriateGreeting', ROOT.Char )]"
 pledge_loyalty_to_liege.0101.desc.contract:0 "[pledge_loyalty_to_liege_vassal.GetSheHe|U] se ajoelha em deferência e, entre seus outros juramentos de servir [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetNameNoTooltip], oferece-me maiores contribuições como vassalo(a) do(a) [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 pledge_loyalty_to_liege.0101.desc.gold:0 "[pledge_loyalty_to_liege_vassal.GetSheHe|U] se ajoelha em deferência, enquanto atendentes trazem seus presentes de moedas e objetos preciosos. O juramento é feito, e escribas registram as promessas [pledge_loyalty_to_liege_vassal.GetHerHim] de servir [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetNameNoTooltip].\n\n"
 pledge_loyalty_to_liege.0101.desc.hook:0 "[pledge_loyalty_to_liege_vassal.GetSheHe|U] se ajoelha em deferência e, entre seus outros juramentos de servir [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetNameNoTooltip], coloca [Select_CString( pledge_loyalty_to_liege_vassal.IsFemale, 'a si mesma', 'a si mesmo' )] à minha disposição e em minha dívida.\n\n"
 pledge_loyalty_to_liege.0101.desc.submission:0 "[pledge_loyalty_to_liege_vassal.GetSheHe|U] se ajoelha em deferência, oferecendo nada além de seu juramento de servir fielmente como vassalo(a) do(a) [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 pledge_loyalty_to_liege.0101.desc.success:0 "Por fim, ordeno que [Select_CString( pledge_loyalty_to_liege_vassal.IsFemale, 'a', 'o' )] [pledge_loyalty_to_liege_vassal.GetTitleAsNameNoTooltip] se levante, confirmando minha satisfação e os direitos d[Select_CString( pledge_loyalty_to_liege_vassal.IsFemale, 'a', 'o' )] [pledge_loyalty_to_liege_vassal.GetFirstNameNoTooltip] às terras que [pledge_loyalty_to_liege_vassal.GetSheHe] governa em meu nome."
 pledge_loyalty_to_liege.0101.desc:0 "Aguardo pacientemente em meu trono pela chegada [Select_CString( pledge_loyalty_to_liege_vassal.IsFemale, 'da', 'do' )] [pledge_loyalty_to_liege_vassal.GetTitledFirstName], que logo é anunciado(a) e conduzido(a) diante de mim.\n\n"
 pledge_loyalty_to_liege.0101.smooth.contract:0 "\"Seus serviços são inestimáveis, [pledge_loyalty_to_liege_vassal.GetTitledFirstNameNoTooltip].\""
 pledge_loyalty_to_liege.0101.smooth.gold:0 "\"Aceito seus generosos presentes, [pledge_loyalty_to_liege_vassal.GetTitledFirstNameNoTooltip].\""
 pledge_loyalty_to_liege.0101.smooth.hook:0 "\"Fico feliz em saber que posso contar com você, [pledge_loyalty_to_liege_vassal.GetTitledFirstNameNoTooltip].\""
 pledge_loyalty_to_liege.0101.smooth.submission:0 "\"Sirva-me bem, [pledge_loyalty_to_liege_vassal.GetTitledFirstNameNoTooltip].\""
 pledge_loyalty_to_liege.0101.t:0 "$pledge_loyalty_to_liege_header$ Ajoelhar"
 pledge_loyalty_to_liege.0201.desc.brush_off:0 "Para minha surpresa, [pledge_loyalty_to_liege_scope.GetFirstNameNoTooltip] age quase como se nada tivesse acontecido e aceita minha homenagem com graça.\n\n"
 pledge_loyalty_to_liege.0201.desc.contract:0 "Então vem meu presente; afirmo que aumentarei minhas contribuições para o [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetTierAsNameNoTooltip] como sinal de minha lealdade e para o bem da coroa.\n\n"
 pledge_loyalty_to_liege.0201.desc.gold.received_as_expected:0 " Como é costume, [pledge_loyalty_to_liege_scope.GetSheHe] oferece alguns presentes simbólicos em troca, consolidando nossa relação para os tempos que virão.\n\n"
 pledge_loyalty_to_liege.0201.desc.gold.received_more:0 "\n\nComo eu havia antecipado, [Select_CString( pledge_loyalty_to_liege_scope.IsFemale, 'a', 'o' )] [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] me oferece presentes equivalentes — mas não para por aí! Depois de muito tempo, encontro-me cercado(a) por ainda mais riquezas do que ofereci a [pledge_loyalty_to_liege_scope.GetSheHe]. Os cortesãos ao redor tentam conter o choque com essa quebra do protocolo adequado, incertos se [Select_CString( pledge_loyalty_to_liege_scope.IsFemale, 'a', 'o' )] [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] está me recompensando, me subornando, ou simplesmente ostentando seu poder e riqueza.\n\n"
 pledge_loyalty_to_liege.0201.desc.gold.received_nothing:0 "\n\nAjoelho-me por tempo demais, até que fica claro que [Select_CString( pledge_loyalty_to_liege_scope.IsFemale, 'a', 'o' )] [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] não vai me oferecer nenhum dos presentes costumeiros. Os cortesãos ao redor parecem desconfortáveis, sem saber se os cofres do palácio estão vazios ou se [Select_CString( pledge_loyalty_to_liege_scope.IsFemale, 'a', 'o' )] [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] está tentando fazer de mim um exemplo.\n\n"
 pledge_loyalty_to_liege.0201.desc.gold:0 "Meus atendentes então avançam, apresentando meus ricos presentes [Select_CString( pledge_loyalty_to_liege_scope.IsFemale, 'a', 'ao' )] [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] diante da corte reunida."
 pledge_loyalty_to_liege.0201.desc.hook:0 "Então vem minha promessa: que [pledge_loyalty_to_liege_scope.GetSheHe] possa me chamar para qualquer favor, como [Select_CString( ROOT.Char.IsFemale, 'uma leal apoiadora', 'um leal apoiador' )] [Select_CString( pledge_loyalty_to_liege_scope.IsFemale, 'da', 'do' )] [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] em todos os seus empreendimentos.\n\n"
 pledge_loyalty_to_liege.0201.desc.outro:0 "[pledge_loyalty_to_liege_scope.GetFirstNameNoTooltip] ordena que eu me levante e confirma sua satisfação, junto com meus direitos às terras que governo em seu nome."
 pledge_loyalty_to_liege.0201.desc.submission:0 "Com isso, a cerimônia está completa; não tenho nada a oferecer [Select_CString( pledge_loyalty_to_liege_scope.IsFemale, 'a minha', 'ao meu' )] [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip], exceto minha promessa de servir fielmente como vassalo(a) do(a) [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 pledge_loyalty_to_liege.0201.desc.success:0 "Ajoelho-me aos pés [Select_CString( pledge_loyalty_to_liege_scope.IsFemale, 'da minha', 'do meu' )] [pledge_loyalty_to_liege_scope.GetLadyLord] e faço os vários juramentos de homenagem, enquanto os escribas [pledge_loyalty_to_liege_scope.GetHerHim] registram o evento.\n\n"
 pledge_loyalty_to_liege.0201.desc:0 "Criados me conduzem ao grande salão [Select_CString( pledge_loyalty_to_liege_scope.IsFemale, 'da', 'do' )] [pledge_loyalty_to_liege_scope.GetTitledFirstNamePossessiveRegnal] em [pledge_loyalty_to_liege_scope.GetCapitalLocation.GetNameNoTooltip], onde [pledge_loyalty_to_liege_scope.GetSheHe] se senta em seu trono, aguardando para ouvir meu juramento.\n\n"
 pledge_loyalty_to_liege.0201.faux_pas:0 "Um senhor justo, afinal."
 pledge_loyalty_to_liege.0201.insult:0 "Eu nunca deveria ter vindo."
 pledge_loyalty_to_liege.0201.smooth.contract:0 "Os fardos do serviço..."
 pledge_loyalty_to_liege.0201.smooth.gold:0 "O preço da lealdade..."
 pledge_loyalty_to_liege.0201.smooth.hook:0 "Esperemos que seja um favor pequeno..."
 pledge_loyalty_to_liege.0201.smooth.submission:0 "Saúdo [Select_CString( pledge_loyalty_to_liege_scope.IsFemale, 'a', 'o' )] [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip]."
 pledge_loyalty_to_liege.0201.t:0 "$pledge_loyalty_to_liege_header$ Ajoelhar"
 pledge_loyalty_to_liege.0601.a:0 "Hora de repensar as coisas..."
 pledge_loyalty_to_liege.0601.a_court:0 "Avante, para coisas maiores."
 pledge_loyalty_to_liege.0601.a_liege:0 "Muito irritante..."
 pledge_loyalty_to_liege.0601.a_prison:0 "Droga."
 pledge_loyalty_to_liege.0601.desc.court:0 "Com minha coroação como [ROOT.Char.GetTitleAsNameNoTooltip] concluída, minhas preparações para prestar homenagem não são mais necessárias..."
 pledge_loyalty_to_liege.0601.desc.imprisoned:0 "$pledge_loyalty_to_liege.0601_shared_intro$ Fui capturado [Select_CString( ROOT.Char.GetImprisonedBy.IsFemale, 'pela', 'pelo' )] [ROOT.Char.GetImprisonedBy.GetTitledFirstName]."
 pledge_loyalty_to_liege.0601.desc.imprisoned_me:0 "$pledge_loyalty_to_liege.0601_shared_intro$ [ROOT.Char.GetImprisonedBy.GetTitledFirstName] me jogou na prisão."
 pledge_loyalty_to_liege.0601.desc.liege_dead:0 "$pledge_loyalty_to_liege.0601_shared_intro$ [pledge_loyalty_to_liege_scope.GetTitledFirstName] [pledge_loyalty_to_liege_scope.GetDeathReasonHideKiller]... \n\n"
 pledge_loyalty_to_liege.0601.desc.liege_dead_me:0 "$pledge_loyalty_to_liege.0601_shared_intro$ Eu acabei matando [Select_CString( pledge_loyalty_to_liege_scope.IsFemale, 'a', 'o' )] [pledge_loyalty_to_liege_scope.GetTitledFirstName]... \n\n"
 pledge_loyalty_to_liege.0601.desc.liege_imprisoned:0 "$pledge_loyalty_to_liege.0601_shared_intro$ [pledge_loyalty_to_liege_scope.GetTitledFirstName] foi capturad[Select_CString( pledge_loyalty_to_liege_scope.IsFemale, 'a', 'o' )] [Select_CString( pledge_loyalty_to_liege_scope.GetImprisonedBy.IsFemale, 'pela', 'pelo' )] [pledge_loyalty_to_liege_scope.GetImprisonedBy.GetTitledFirstName]."
 pledge_loyalty_to_liege.0601.desc.liege_imprisoned_me:0 "$pledge_loyalty_to_liege.0601_shared_intro$ Acabei capturando [Select_CString( pledge_loyalty_to_liege_scope.IsFemale, 'a', 'o' )] [pledge_loyalty_to_liege_scope.GetTitledFirstName]!"
 pledge_loyalty_to_liege.0601.desc.new_liege:0 "Se eu devo prestar homenagem, deve ser direcionado [Select_CString( ROOT.Char.GetLiege.IsFemale, 'a minha nova senhora', 'ao meu novo senhor' )], [ROOT.Char.GetLiege.GetTitledFirstNameRegnal]."
 pledge_loyalty_to_liege.0601.desc:0 "\n\nIsso certamente muda a situação."
 pledge_loyalty_to_liege.0601.t:0 "$pledge_loyalty_to_liege_header$ Invalidated"
 pledge_loyalty_to_liege.0601_shared_intro:0 "Justo quando eu estava dando os toques finais no meu juramento de fidelidade,"
 pledge_loyalty_to_liege_DECISION_NEXT_STEP_BUTTON:0 "Escolher um presente"
 pledge_loyalty_to_liege_available_adult_tt:0 "É um Adulto disponível"
 pledge_loyalty_to_liege_available_liege_tt:0 "[ROOT.Char.GetLiege.GetTitledFirstName] é um Adulto disponível"
 pledge_loyalty_to_liege_contract_desc:0 "[ROOT.Char.GetLiege.GetTitledFirstName] receberá mais impostos ou tropas através do seu [vassal_contract|E]"
 pledge_loyalty_to_liege_contract_increasable_tt:0 "#X Seus [taxes|E] e [levies|E] não podem ser aumentados#!"
 pledge_loyalty_to_liege_contract_modifiable_tt:0 "#X Seu [vassal_contract|E] foi modificado muito recentemente#!"
 pledge_loyalty_to_liege_contract_tooltip:0 "$pledge_loyalty_to_liege_decision_second_tooltip$"
 pledge_loyalty_to_liege_costs_refunded:0 "Custos de $pledge_loyalty_to_liege_decision$ reembolsados"
 pledge_loyalty_to_liege_decision:0 "Jurar Lealdade ao [GetPlayer.GetLiege.GetTitleTierName|U]"
 pledge_loyalty_to_liege_decision_confirm:0 "$pledge_loyalty_to_liege_decision$"
 pledge_loyalty_to_liege_decision_desc:0 "Devo declarar formalmente e publicamente minha lealdade ao [GetPlayer.GetLiege.GetTitleTierName|U] na corte [ROOT.Char.GetLiege.GetHerHim]. Falhar em fazê-lo será percebido como um insulto e um desafio ao governo [ROOT.Char.GetLiege.GetHerHim]."
 pledge_loyalty_to_liege_decision_effects:0 "Você viaja para a corte [Select_CString( THIS.Char.GetLiege.IsFemale, 'da', 'do' )] [THIS.Char.GetLiege.GetTitledFirstNamePossessive] para formalmente se prostrar diante deles"
 pledge_loyalty_to_liege_decision_effects_contract_gold:0 "Seu [liege|E] receberá mais [taxes|E] de você"
 pledge_loyalty_to_liege_decision_effects_contract_levies:0 "Seu [liege|E] receberá mais [levies|E] de você"
 pledge_loyalty_to_liege_decision_effects_gold:0 "Seu [liege|E] receberá seu presente de [gold|E]"
 pledge_loyalty_to_liege_decision_effects_hook:0 "Seu [liege|E] receberá um [hook|E] forte sobre você"
 pledge_loyalty_to_liege_decision_option_contract:0 "...e Aumentar Obrigações\n#low Dar obrigações de [vassal_contract|E]#!"
 pledge_loyalty_to_liege_decision_option_gold:0 "...e Conceder Presentes\n#low Dar [gold|E]#!"
 pledge_loyalty_to_liege_decision_option_hook:0 "...e Prometer Favor\n#low Dar um [hook|E]#!"
 pledge_loyalty_to_liege_decision_option_submission:0 "Demonstrar Submissão\n#low Não dar nada#!"
 pledge_loyalty_to_liege_decision_second_tooltip:0 "$DESC$\n$pledge_loyalty_to_liege_grace_tt$"
 pledge_loyalty_to_liege_decision_tooltip:0 "Formalmente #V Jurar Lealdade#! a seu [liege|E] em sua [court|E]"
 pledge_loyalty_to_liege_gift_warning_effect:0 "#weak Presentes aumentam as recompensas por #V Jurar sua Lealdade#!#!\n$pledge_loyalty_to_liege_grace_tt$"
 pledge_loyalty_to_liege_gold_desc:0 "[ROOT.Char.GetLiege.GetTitledFirstName] receberá um presente de [gold|E] de você"
 pledge_loyalty_to_liege_gold_tooltip:0 "$pledge_loyalty_to_liege_decision_second_tooltip$"
 pledge_loyalty_to_liege_gold_tt:0 "#X Você não tem [gold|E] suficiente#!"
 pledge_loyalty_to_liege_grace_tt:0 "#weak Você só pode #V Jurar Lealdade#! ao mesmo suserano uma vez#!"
 pledge_loyalty_to_liege_grace_valid_tt:0 "Não jurou Lealdade [Select_CString( THIS.Char.GetLiege.IsFemale, 'a', 'ao' )] [THIS.Char.GetLiege.GetTitledFirstName] antes"
 pledge_loyalty_to_liege_header:0 "Jurar Lealdade:"
 pledge_loyalty_to_liege_hook_desc:0 "[ROOT.Char.GetLiege.GetTitledFirstName] receberá um [hook|E] fraco sobre você"
 pledge_loyalty_to_liege_hook_tooltip:0 "$pledge_loyalty_to_liege_decision_second_tooltip$"
 pledge_loyalty_to_liege_hook_tt:0 "#X Seu [liege|E] já tem um [hook|E] sobre você#!"
 pledge_loyalty_to_liege_overdue.1000.a.tt:0 "[SCOPE.sC('pledge_loyalty_to_liege_offender').GetTitledFirstName] receberá uma carta lembrando [SCOPE.sC('pledge_loyalty_to_liege_offender').GetSheHe] de suas obrigações. Dependendo da resposta, você pode [usurp|E] seus [titles|E]."
 pledge_loyalty_to_liege_overdue.1000.a:0 "Enviar um emissário exigindo sua presença imediata."
 pledge_loyalty_to_liege_overdue.1000.b.tt:0 "[SCOPE.sC('pledge_loyalty_to_liege_offender').GetTitledFirstName] será perdoado de suas obrigações."
 pledge_loyalty_to_liege_overdue.1000.b:0 "[SCOPE.sC('pledge_loyalty_to_liege_offender').GetSheHe|U] provavelmente está apenas ocupado."
 pledge_loyalty_to_liege_overdue.1000.desc.1:0 "Enquanto examino os registros daqueles que vieram prestar sua fidelidade a mim como [Select_CString( ROOT.Char.IsFemale, 'sua', 'seu' )] [ROOT.Char.GetTitleAsName], um nome permanece notavelmente ausente: [SCOPE.sC('pledge_loyalty_to_liege_offender').GetTitledFirstName] da dinastia [SCOPE.sC('pledge_loyalty_to_liege_offender').GetDynasty.GetName]. Mais de [SCOPE.sC('pledge_loyalty_to_liege_offender').MakeScope.Var('pledge_loyalty_to_liege_found_overdue_years').GetValue|0] anos se passaram "
 pledge_loyalty_to_liege_overdue.1000.desc.2:0 "e nem palavra nem tributo chegaram das terras [SCOPE.sC('pledge_loyalty_to_liege_offender').GetHerHim].\n\nMeus cortesãos trocam olhares inquietos. Murmúrios percorrem os salões — poderia isso ser um mero descuido, ou uma afronta deliberada ao meu direito de governar? O peso da desobediência não dita paira pesado no ar."
 pledge_loyalty_to_liege_overdue.1000.desc.new_liege:0 "desde que eu ascendi ao trono, "
 pledge_loyalty_to_liege_overdue.1000.desc.new_title:0 "desde que [SCOPE.sC('pledge_loyalty_to_liege_offender').GetSheHe] se tornou meu vassalo, "
 pledge_loyalty_to_liege_overdue.1000.t:0 "Vassalo Desonrado"
 pledge_loyalty_to_liege_overdue.1010.a.tt:0 "Abre o painel da [decision|v] #V Prestação de Lealdade [Select_CString( GetPlayer.GetLiege.IsFemale, 'a', 'ao' )] [GetPlayer.GetLiege.GetTitleTierName|U]#!"
 pledge_loyalty_to_liege_overdue.1010.a:0 "Parta imediatamente, sem demora!"
 pledge_loyalty_to_liege_overdue.1010.b.tt:0 "Se você demorar demais, seus [titles|E] podem ser [revoked|E]!"
 pledge_loyalty_to_liege_overdue.1010.b:0 "[Select_CString( ROOT.Char.GetLiege.IsFemale, 'A', 'O' )] [ROOT.Char.GetLiege.GetTitleAsName] terá que esperar."
 pledge_loyalty_to_liege_overdue.1010.desc.new_liege:0 "Com a ascensão [Select_CString( ROOT.Char.GetLiege.IsFemale, 'da', 'do' )] [ROOT.Char.GetLiege.GetTitledFirstName] ao estimado trono [Select_CString( ROOT.Char.GetLiege.IsFemale, 'da', 'do' )] [ROOT.Char.GetLiege.GetPrimaryTitle.GetName], "
 pledge_loyalty_to_liege_overdue.1010.desc.new_title:0 "Como [ROOT.Char.GetTitleTierName|U] de [ROOT.Char.GetPrimaryTitle.GetName] e vassalo do [ROOT.Char.GetLiege.GetPrimaryTitle.GetName], "
 pledge_loyalty_to_liege_overdue.1010.desc:0 "chegou a hora de eu partir em jornada e prestar meus respeitos, reafirmando minha lealdade e fidelidade.\n\nFalhar em fazer isso dentro do prazo pode ser considerado desonroso — ou pior, interpretado como uma intenção rebelde."
 pledge_loyalty_to_liege_overdue.1010.t:0 "A Honra Chama"
 pledge_loyalty_to_liege_overdue.1020.a.tt:0 "Abre o painel da [decision|v] #V Prestação de Lealdade [Select_CString( GetPlayer.GetLiege.IsFemale, 'a', 'ao' )] [GetPlayer.GetLiege.GetTitleTierName|U]#!\n$pledge_loyalty_to_liege_overdue.1020.b.tt$"
 pledge_loyalty_to_liege_overdue.1020.a:0 "Parta imediatamente, sem demora!"
 pledge_loyalty_to_liege_overdue.1020.b.tt:0 "Se você demorar demais, seus [titles|E] podem ser [revoked|E]!"
 pledge_loyalty_to_liege_overdue.1020.b:0 "Ameaças tão passageiras quanto flores de cerejeira ao vento."
 pledge_loyalty_to_liege_overdue.1020.c.tt:0 "[SCOPE.sC('spurned_liege').GetName] pode tentar [revoke|E] seus [titles|E]!"
 pledge_loyalty_to_liege_overdue.1020.c:0 "Rasgue o selo e devolva a carta."
 pledge_loyalty_to_liege_overdue.1020.desc:0 "Sua falha em se apresentar à minha corte não passou despercebida. A honra obriga você a corrigir essa negligência prontamente.\n\nIgnorar seu dever pode forçar-me a agir para preservar a harmonia e a ordem do meu reino."
 pledge_loyalty_to_liege_overdue.1020.t:0 "[spurned_liege.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 pledge_loyalty_to_liege_overdue.1030.a:0 "Menos uma preocupação."
 pledge_loyalty_to_liege_overdue.1030.b:0 "Obviamente [ROOT.Char.GetLiege.GetSheHe] tem medo do poder dos [ROOT.Char.GetDynasty.GetName]!"
 pledge_loyalty_to_liege_overdue.1030.desc:0 "Apesar da minha falta de atenção para com [Select_CString( ROOT.Char.GetLiege.IsFemale, 'a', 'o' )] [ROOT.Char.GetLiege.GetTitledFirstName], nenhuma das consequências habituais parece estar por vir. Será que o [ROOT.Char.GetLiege.GetPrimaryTitle.GetName] ignorou nossos costumes?"
 pledge_loyalty_to_liege_overdue.1030.t:0 "Perdoar e Esquecer"
