l_spanish:
 CI_GLOSS:0 "#bold Poesia Ci#! — Uma forma de poesia que se tornou cada vez mais popular durante as dinastias Tang e Song.\nOs poemas são feitos para serem cantados e adaptam seus temas às estrofes de comprimento variável que combinam com a melodia associada.\n\nComo os próprios poemas Ci frequentemente emprestam caracteres de poemas antigos, seu significado literal pode ser obscuro sem treinamento adequado."
 a_bushel_of_pearls:0 "Um Alqueire de Pérolas"
 a_quiet_night:0 "Uma Noite Silenciosa"
 anxiety_of_a_beauty:0 "Ansiedade de uma Beleza"
 as_in_a_dream:0 "Como em um Sonho"
 at_an_inn_in_xinshi:0 "Em uma Estalagem em Xinshi"
 attached_to_her_skirt:0 "Preso à Saia Dela"
 author_book.0001.a.tt:0 "#italic [SCOPE.Custom('GetCiPoemName')]#! será o nome do meu poema"
 author_book.0001.a:0 "Usarei #italic [SCOPE.Custom('GetCiPoemName')]#!"
 author_book.0001.b.tt:0 "[trusted_influencer.GetShortUIName] escolherá uma melodia para o poema"
 author_book.0001.b:0 "Consultarei [Select_CString( trusted_influencer.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] [trusted_influencer.GetShortUINameNoTooltip]"
 author_book.0001.desc:0 "Poucos gêneros são tão puros e dinâmicos quanto a [Glossary( 'Poesia Ci', 'CI_GLOSS' )]. Estrofes diferentes podem assumir a tarefa de retratar temas ou emoções distintos, permitindo que todos os meus poetas favoritos expressem sentimentos profundos de forma concisa e bela.\n\nAgora que chegou a hora de colocar minhas próprias palavras em uma melodia, devo escolher cuidadosamente qual usar."
 author_book.0001.t:0 "Virtude Poética"
 author_book.0004.a.tt:0 "O [artifact|E] de livro resultante concederá [influence_i][influence|E]"
 author_book.0004.a:0 "Uma obra histórica"
 author_book.0004.b.tt:0 "O [artifact|E] de livro resultante concederá [GetTrait('confucian_education').GetName( GetNullCharacter )]"
 author_book.0004.b:0 "Um ensaio filosófico"
 author_book.0004.desc:0 "Enquanto me sento à minha mesa para refletir sobre o trabalho que me espera, meus olhos recaem sobre os [Glossary( 'Quatro Tesouros do Estudo', 'FOUR_TREASURES')]. Como estudioso, essas são as ferramentas do meu ofício. Com elas posso empregar a razão e iluminar outros.\n\nMas o que devo dizer?\n\nEu poderia tentar lançar nova luz sobre eventos passados, ou poderia embarcar em algo mais atual, analisando ações virtuosas usando um evento recente."
 author_book.0004.t:0 "Sobre a Virtude em Nosso Tempo"
 author_book.0005.a.tt:0 "A qualidade deste livro dependerá fortemente de sua experiência em [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]"
 author_book.0005.a:0 "Geografia"
 author_book.0005.b.tt:0 "A qualidade do artefato livro dependerá fortemente de seu [learning|E]."
 author_book.0005.b:0 "Matemática"
 author_book.0005.c.tt:0 "Esta opção pode resultar em obter um [artifact|E] além do livro produzido."
 author_book.0005.c:0 "Arqueologia"
 author_book.0005.desc:0 "Com grande esforço, a mente pode penetrar o significado por trás da natureza do mundo. Descrever e organizar essas observações em um texto do qual outros possam aprender é algo maior, porém ainda mais exaustivo e demorado.\n\nEnquanto me sento para planejar uma nova monografia, devo decidir a área de foco. Matemática e Geografia são assuntos dignos, que também interessam a muitos de meus colegas."
 author_book.0005.t:0 "Descrevendo o Mundo"
 author_book.1000.a:0 "Aprendi muito com essa experiência."
 author_book.1000.b:0 "Um trabalho bem feito."
 author_book.1000.c:0 "Claramente tenho isso em mim."
 author_book.1000.d:0 "\"Este será meu presente para você!\""
 author_book.1000.poem_great.desc:0 "\"Adquira novos conhecimentos enquanto reflete sobre os antigos, e você poderá se tornar um professor para os outros\" [trusted_influencer.GetSheHe|U] está claramente apreciando meu novo opus."
 author_book.1000.poem_intro.desc:0 "Enquanto recito meu poema recém-composto para [Select_CString( trusted_influencer.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] [trusted_influencer.GetFirstName], não consigo evitar sentir um certo orgulho do que realizei. O tema, [SCOPE.Custom('GetCiPoemTheme')], é algo que sinto que nunca foi capturado desta forma antes. Expectativamente olho para [trusted_influencer.GetFirstNameNoTooltip], aguardando pela avaliação [trusted_influencer.GetHerHim] sobre meu trabalho.\n\n"
 author_book.1000.poem_mid.desc:0 "\"Uma peça comovente\" [trusted_influencer.GetSheHe] olha para mim aprovando após ficar em silêncio pelo que pareceu uma eternidade."
 author_book.1000.poem_weak.desc:0 "\"Tudo tem beleza, mas nem todos a veem.\" [trusted_influencer.GetSheHe] diz com — o que deveria ser — apreciação?\n\nTalvez este recém-criado não seja tão brilhante quanto eu esperava."
 author_book.1000.prose_great.desc:0 "\"Você conseguiu falar com uma clareza que poucos em nosso tempo possuem!\" [Select_CString( trusted_influencer.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] [trusted_influencer.GetFirstName] proclama.\nEstá claro que consegui despertar emoção genuína com minhas palavras."
 author_book.1000.prose_intro.desc:0 "Escrita argumentativa é algo que deve vir naturalmente para qualquer estudioso. Em meu texto sobre [SCOPE.Custom('GetProseTheme')], pude praticar minhas habilidades em usar exemplos para sustentar uma afirmação central.\n\n"
 author_book.1000.prose_mid.desc:0 "\"Este é um ótimo texto, você capturou bem a essência do problema\" é o que [Select_CString( trusted_influencer.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] [trusted_influencer.GetFirstName] diz, sendo o primeiro leitor do meu trabalho."
 author_book.1000.prose_weak.desc:0 "\"Seu raciocínio é sólido, mas vejo algumas áreas de melhoria\" é o que [Select_CString( trusted_influencer.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] [trusted_influencer.GetFirstName] me diz. Claramente tentando ser solidário, [trusted_influencer.GetSheHe] então prossegue descrevendo algumas observações no meu texto que [trusted_influencer.GetSheHe] teme que leitores possam não perceber."
 author_book.1000.scholarship_great.desc:0 "\"Uma obra marcante, que coloca seu nome entre os maiores autores de nosso tempo!\"\nMeu primeiro leitor, [Select_CString( trusted_influencer.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] [trusted_influencer.GetFirstName], diz após finalizar a obra. Este é um feito que não esquecerei tão cedo."
 author_book.1000.scholarship_intro.desc:0 "Não foi uma empreitada rápida, mas finalmente cheguei ao fim. Minha nova monografia sobre [SCOPE.Custom('GetMonographTopic')] está concluída, e o tempo que passei examinando a literatura relacionada me tornou mais versado neste tópico do que nunca.\n\n"
 author_book.1000.scholarship_mid.desc:0 "\"Um livro competente e informativo, que recomendarei a outros!\" é o que [Select_CString( trusted_influencer.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] [trusted_influencer.GetFirstName] disse quando [trusted_influencer.GetSheHe] terminou tudo.\nDevo me sentir feliz com meu trabalho, mas é difícil não sentir que posso escrever algo ainda melhor no futuro."
 author_book.1000.scholarship_weak.desc:0 "\"Um grande marco em sua carreira!\" proclama [Select_CString( trusted_influencer.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] [trusted_influencer.GetFirstName], e posso ver certo orgulho nos olhos [trusted_influencer.GetHerHim]. Ainda assim, me pergunto se poderia ter feito melhor caso tivesse uma segunda chance."
