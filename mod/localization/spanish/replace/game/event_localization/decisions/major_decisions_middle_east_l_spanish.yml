l_spanish:
 DAR_AL_ISLAM_GLOSS:0 "#bold Dar al-Islam#!, traduzido como \"a casa do Islã\", é um termo que se refere às terras sob soberania muçulmana, governando sobre súditos muçulmanos e não muçulmanos."
 all_held_counties:0 "Todos os Condados Infiéis"
 beth_nahrain_crusader_desc:0 "Uma confluência, conectando um império como um só."
 completely_controls_jazira_mesopotamia_tt:0 "[completely_control|E] [GetTitleByKey('k_jazira').GetNameNoTier] e [GetTitleByKey('k_mesopotamia').GetNameNoTier]"
 found_empire_of_beth_nahrain_decision_confirm:0 "Que os rios fluam como um só!"
 has_title_and_completely_control_jerusalem_tt:0 "[completely_control|E] e possua [GetTitleByKey('k_jerusalem').GetName]"
 has_title_and_completely_control_syria_tt:0 "[completely_control|E] e possua [GetTitleByKey('k_syria').GetName]"
 has_titles_jazira_mesopotamia_tt:0 "Possui os [titles|E] de [GetTitleByKey('k_jazira').GetNameNoTier] e [GetTitleByKey('k_mesopotamia').GetNameNoTier]"
 learning_beth_nahrain_house_modifier:0 "Conhecimento é Poder"
 learning_beth_nahrain_house_modifier_desc:0 "A conquista do Oriente Médio renovou a cultura siríaca, permitindo-lhes expandir sua sabedoria."
 martial_beth_nahrain_house_modifier:0 "Disciplina e Ordem"
 martial_beth_nahrain_house_modifier_desc:0 "A conquista do Oriente Médio renovou a cultura siríaca, devastando campos de batalha para expandir suas fronteiras."
 middle_east_decisions.0001.a:0 "Que Deus tenha misericórdia deles, pois eu não tenho."
 middle_east_decisions.0001.desc:0 "Desde o surgimento de Maomé, a religião muçulmana tem sido uma força a ser considerada no Oriente e uma ameaça iminente para os adoradores de Cristo. No entanto, graças aos meus esforços para garantir a Terra Santa, isso não é mais o caso. \n\nEu expulsei os infiéis das costas do Mediterrâneo e os persegui pelos desertos escaldantes da Arábia. Plantei a cruz sagrada de Nosso Senhor de mar a mar e forjei um verdadeiro Império do Céu sobre o Crescente quebrado do falso Profeta."
 middle_east_decisions.0001.t:0 "O Império do Céu"
 middle_east_decisions.0002.a:0 "Louvado seja Nosso Senhor!"
 middle_east_decisions.0002.b:0 "Mil maldições sobre a família [scoped_ruler.GetHerHim]!"
 middle_east_decisions.0002.c:0 "Entendi..."
 middle_east_decisions.0002.desc.christians:0 "Desde o surgimento de Maomé, a religião muçulmana tem sido uma força a ser considerada no Oriente e uma ameaça iminente para os adoradores de Cristo. No entanto, graças aos esforços d[Select_CString( scoped_ruler.IsFemale, 'a', 'o' )] [scoped_ruler.GetTitledFirstName] para garantir a Terra Santa, isso não é mais o caso. \n\nCom a bênção de [scoped_ruler.GetFaith.HighGodName], [scoped_ruler.GetFirstName] expulsou os infiéis das costas do Mediterrâneo e os perseguiu pelos desertos escaldantes da Arábia. [scoped_ruler.GetSheHe|U] plantou a cruz sagrada de Nosso Senhor de mar a mar e forjou um verdadeiro Império do Céu sobre o Crescente quebrado do falso Profeta."
 middle_east_decisions.0002.desc.muslims:0 "As hordas bárbaras d[Select_CString( scoped_ruler.IsFemale, 'a', 'o' )] Cruzad[Select_CString( scoped_ruler.IsFemale, 'a', 'o' )] [scoped_ruler.GetTitledFirstName] trouxeram ruína além da compreensão aos seguidores de [ROOT.Char.GetFaith.HighGodName]!\n\nEsses idolatras vis ocuparam todos os lugares sagrados de adoração de nossa fé. Até mesmo a cidade sagrada de Meca agora está sob o domínio desses porcos blasfemos. Se os verdadeiros seguidores do Profeta não reconquistarem a Arábia em breve, isso pode ser o começo do fim para o Islã."
 middle_east_decisions.0002.desc.others:0 "Desde o surgimento de Maomé, a religião muçulmana tem sido uma força a ser considerada no Oriente. No entanto, graças aos esforços d[Select_CString( scoped_ruler.IsFemale, 'a', 'o' )] [scoped_ruler.GetTitledFirstName] para garantir a Terra Santa, isso não é mais o caso. \n\nEste [scoped_ruler.GetTitleTierName] [scoped_ruler.GetFaith.GetAdjective] expulsou os seguidores de Alá das costas do Mediterrâneo e os perseguiu pelos desertos escaldantes da Arábia. [scoped_ruler.GetSheHe|U] plantou a cruz sagrada de mar a mar e forjou o que [scoped_ruler.GetSheHe] chama de Império do Céu sobre o Crescente quebrado do Profeta."
 middle_east_decisions.0003.a:0 "Allahu Akbar!"
 middle_east_decisions.0003.desc:0 "Desde a ocupação infiel da Terra Santa, os verdadeiros seguidores do Profeta têm sido dispersos pelos quatro ventos, sem liderança ou vontade para retomar a luta sagrada.\n\nIsso acaba hoje. Pela misericórdia de [reformer.GetFaith.HighGodNamePossessive], recuperei Meca e Medina e interrompi a onda de infiéis que inundavam a Arábia. Com o apoio de vários estudiosos respeitados do livro, fui reconhecido como o novo Califa do [reformer.GetFaith.GetName] e estou pronto para liderar meus seguidores contra os ímpios idólatras que ainda poluem nossa terra natal!"
 middle_east_decisions.0003.t:0 "Um Novo Califado"
 middle_east_decisions.0004.a:0 "Allahu Akbar!"
 middle_east_decisions.0004.b:0 "Melhor o diabo que você conhece, suponho..."
 middle_east_decisions.0004.desc.ashari:0 "Desde a ocupação infiel da Terra Santa, os verdadeiros seguidores do Profeta têm sido dispersos pelos quatro ventos, sem liderança ou vontade para retomar a luta sagrada.\n\nIsso acaba hoje. Pela misericórdia de [reformer.GetFaith.HighGodNamePossessive], [reformer.GetFirstName] recuperou Meca e Medina e interrompeu a onda de infiéis que inundavam a Arábia. Com o apoio de vários estudiosos respeitados do livro, [reformer.GetSheHe] foi reconhecido como o novo Califa do [reformer.GetFaith.GetName] e está pronto para liderar seus seguidores contra os ímpios idólatras que ainda poluem nossa terra natal."
 middle_east_decisions.0004.desc.other:0 "Desde a ocupação infiel da Terra Santa, os seguidores do [reformer.GetFaith.GetName] têm sido dispersos pelos quatro ventos, sem liderança ou vontade para retomar a luta sagrada.\n\nNo entanto, parece que eles finalmente se reuniram novamente, sob a sábia liderança d[Select_CString( reformer.IsFemale, 'a', 'o' )] [reformer.GetFirstName]. Depois de ter recuperado as cidades sagradas de Meca e Medina e ter legitimado sua reivindicação como novo Califa, [reformer.GetFirstName] está pronto para retomar a grande guerra contra os infiéis."
 middle_east_decisions.0004.desc.sunni:0 "Desde a ocupação infiel da terra santa, os verdadeiros seguidores do Profeta foram espalhados pelos quatro ventos, sem a liderança ou a vontade de retomar a sagrada luta.\n\nIsso acaba hoje. Pela misericórdia de [reformer.GetFaith.HighGodNamePossessive], [reformer.GetFirstName] reclaimou Meca e Medina e deteve a maré de infiéis que invadia a Arábia. Com o apoio de vários estudiosos respeitados do livro, [reformer.GetSheHe] foi reconhecido como o novo Califa de [reformer.GetFaith.GetName] e está pronto para liderar [reformer.GetHerHis] seguidores contra os ímpios idólatras que ainda poluindo nossa pátria."
 middle_east_decisions.0005.a:0 "Viva Israel!"
 middle_east_decisions.0005.desc:0 "Com Jerusalém e a Terra Prometida sob controle judaico, chegou a hora de criar um novo Reino Unido chamado Israel, como o grande reino dos tempos antigos sob David e Salomão.\n\nO povo judeu, que tanto sofreu, finalmente está no controle de seu próprio destino novamente. Não mais a Terra Santa será dilacerada pelos senhores cristãos e muçulmanos em guerra. Que este novo reino inaugure uma era de paz e prosperidade para a região!"
 middle_east_decisions.0005.t:0 "A Terra Prometida"
 middle_east_decisions.0006.a:0 "Chegou a hora!"
 middle_east_decisions.0006.b:0 "Entendi..."
 middle_east_decisions.0006.desc.others:0 "Após ter trazido Jerusalém de volta ao controle judaico, [scoped_ruler.GetTitledFirstName] decidiu se declarar [scoped_ruler.GetTitleTierName] de um Israel restaurado.\n\nO longo exílio do povo judeu pode finalmente ter chegado ao fim, já que muitas de suas comunidades decidem retornar à Terra Prometida."
 middle_east_decisions.0007.a.me:0 "Minha liderança vai nos inspirar a todos!"
 middle_east_decisions.0007.a:0 "Que a liderança [new_priest.GetHerHim] nos inspire!"
 middle_east_decisions.0007.desc.intro:0 "Não tem havido um Kohen - um Sumo Sacerdote do Judaísmo - desde que os romanos destruíram o Segundo Templo há cerca de mil anos. Finalmente, esta posição foi preenchida e o Sacerdócio reconstituído.\n\n"
 middle_east_decisions.0007.desc.me:0 "Como um líder influente e piedoso do povo judeu, a classe sacerdotal determinou que eu sou o melhor candidato para liderar a religião judaica em uma nova era. Embora eu não tenha o sangue tradicional de Arão necessário para ser Kohen Gadol, sacerdotes e leigos celebram minha ordenação como líder do Sacerdócio."
 middle_east_decisions.0007.desc.not_me:0 "Assim como os sacerdotes judeus dos tempos antigos, o Kohen Gadol tradicionalmente deveria ser descendente de Arão, o irmão mais velho de Moisés. Devido à falta de candidatos adequados, esse requisito foi dispensado, mas o novo Sumo Sacerdote ainda desfruta do respeito das comunidades religiosas [ROOT.Char.GetFaith.GetAdjective]."
 middle_east_decisions.0007.t:0 "O Novo Sacerdócio [scoped_ruler.GetFaith.GetAdjective]"
 middle_east_decisions.0008.a:0 "Que a liderança [new_priest.GetHerHim] nos inspire!"
 middle_east_decisions.0008.b:0 "Entendi..."
 middle_east_decisions.0008.desc.others:0 "Após o restabelecimento de uma presença judaica significativa em Jerusalém, [scoped_ruler.GetTitledFirstName] promoveu a fundação de um novo Sacerdócio [new_priest.GetFaith.GetAdjective] para liderar os israelitas.\n\nLiderada [Select_CString( new_priest.IsFemale, 'pela', 'pelo' )] [new_priest.GetTitledFirstName], essa congregação espera trazer unidade e orientação para as comunidades em crescimento de Israel."
 middle_east_decisions.0009.a:0 "A chama eterna queima novamente!"
 middle_east_decisions.0009.desc:0 "Após o interlúdio de exílio e perseguição após as conquistas árabes, o Zoroastrismo foi aceito pelo povo da Pérsia como o único caminho verdadeiro para a retidão. [scoped_ruler.GetTitledFirstName] ordenou a instituição do cargo do [new_priest.GetTitleTierName], um Sacerdote dos Sacerdotes para governar uma hierarquia clerical restaurada.\n\nO [new_priest.GetTitleTierName] servirá como a mais alta autoridade religiosa no mundo [scoped_ruler.GetFaith.GetAdjective], com poderes que vão desde a bênção de futuras expedições militares até a concessão de divórcios a casais casados."
 middle_east_decisions.0009.t:0 "O Novo Sacerdócio [scoped_ruler.GetFaith.GetAdjective]"
 middle_east_decisions.0010.a:0 "Glória a [scoped_ruler.GetFaith.HighGodName]!"
 middle_east_decisions.0010.b:0 "Seus demônios não os protegerão do poder de [ROOT.Char.GetFaith.HighGodName]!"
 middle_east_decisions.0010.c:0 "...Adoradores do fogo?"
 middle_east_decisions.0010.desc.muslims:0 "Os malditos seguidores de [scoped_ruler.GetFaith.HighGodName] reconquistaram terras e influência suficientes para restabelecer um sacerdócio blasfemo sob a proteção d[Select_CString( scoped_ruler.IsFemale, 'a', 'o' )] [scoped_ruler.GetTitledFirstName].\n\nSe não forem parados em breve, esses pagãos adoradores de demônios podem mudar o rumo da expansão islâmica na Pérsia, poluindo a mente de seus súditos desprevenidos com mentiras e perversões."
 middle_east_decisions.0010.desc.others:0 "Os estranhos seguidores adoradores do fogo de [scoped_ruler.GetFaith.HighGodName] reconquistaram territórios ancestrais suficientes na Pérsia para restabelecer um Sacerdócio funcional.\n\nSe não forem parados em breve, eles podem mudar o rumo da expansão islâmica e restaurar a Ásia sob a proteção de seus antigos deuses."
 middle_east_decisions.0011.a:0 "Eu trarei benefícios a todos."
 middle_east_decisions.0011.desc:0 "Desde que o Império Sassânida sucumbiu às invasões árabes, a Pérsia tem sofrido sob o jugo dos governantes muçulmanos. Os últimos vestígios da antiga ordem zoroastrista se retiraram para o norte das planícies da Ásia Central, mas agora, finalmente, o domínio zoroastrista sobre a Pérsia foi restaurado.\n\nEssa recuperação miraculosa só pode ser atribuída à minha brilhante liderança, e muitos dentre o clero me declararam ser o Saoshyant - o salvador do mundo que Zoroastro mesmo mencionou há milhares de anos. Após abraçar esse papel, sou reverenciado como um ícone sagrado pelos zoroastristas em todos os lugares."
 middle_east_decisions.0011.t:0 "O Escolhido de Zoroastro"
 middle_east_decisions.0013.a:0 "Que [scoped_ruler.GetSheHe] nos traga benefícios a todos!"
 middle_east_decisions.0013.b:0 "Loucura e bruxaria!"
 middle_east_decisions.0013.c:0 "Entendi..."
 middle_east_decisions.0013.desc.muslims:0 "Uma vez reduzidos a exilados no deserto, os sacerdotes do maldito blasfemo Zoroastro se ergueram das cinzas e reivindicaram o trono da Pérsia!\n\nCheios de orgulho enlouquecido, seu [scoped_ruler.GetTitleTierName] decidiu proclamar-se um deus vivo."
 middle_east_decisions.0013.desc.others:0 "Desde que o Império Sassânida sucumbiu às invasões árabes, os seguidores de Zoroastro têm fugido. Seu exílio chegou ao fim recentemente, pois os fiéis [scoped_ruler.GetFaith.GetAdjective] conseguiram restaurar seu antigo Império.\n\nSendo em grande parte responsável por essa reviravolta inesperada, seu [scoped_ruler.GetTitleTierName] decidiu proclamar-se Saoshyant, o salvador profetizado de sua fé."
 middle_east_decisions.0013.desc:0 "Desde que o Império Sassânida sucumbiu às invasões árabes, a Pérsia tem sofrido sob o jugo dos governantes muçulmanos. Os últimos vestígios da antiga ordem zoroastrista se retiraram para o norte das planícies da Ásia Central, mas agora, finalmente, o domínio zoroastrista sobre a Pérsia foi restaurado.\n\nEssa recuperação miraculosa só pode ser atribuída à brilhante liderança d[Select_CString( scoped_ruler.IsFemale, 'a', 'o' )] [scoped_ruler.GetFirstNamePossessive], e muitos dentre o clero o declararam ser o Saoshyant - o salvador do mundo que Zoroastro mesmo mencionou há milhares de anos. Após abraçar esse papel, [scoped_ruler.GetTitledFirstNameNoTooltip] é agora reverenciado como um ícone sagrado pelos zoroastristas em todos os lugares."
 middle_east_decisions.0014.a:0 "Que o Ocidente trema!"
 middle_east_decisions.0014.desc:0 "Com a conquista das ricas terras da Ásia Menor, acumulei poder suficiente para formar um novo Sultanato, um que certamente superará a grandeza de Roma em si.\n\nAinda há trabalho a ser feito, mas não tenho dúvidas de que os historiadores consagrarão este momento como um dos grandes passos na conquista da Europa pelos seguidores de [scoped_ruler.GetFaith.HighGodName]."
 middle_east_decisions.0014.t:0 "Uma Nova Roma"
 middle_east_decisions.0015.a:0 "Como [scoped_ruler.GetSheHe] ousa!"
 middle_east_decisions.0015.b:0 "Entendi..."
 middle_east_decisions.0015.desc.liege:0 "Após uma série de vitórias na Anatólia, [scoped_ruler.GetTitledFirstName] decidiu se coroar [scoped_ruler.GetTitleTierName] de Rum, alegando que [scoped_ruler.GetSheHe] não possui mais qualquer lealdade a mim e conduzirá a luta contra os infiéis em seus próprios termos."
 middle_east_decisions.0015.desc.others:0 "A rica província da Ásia Menor, antes um bastião do Cristianismo, agora está sob o domínio d[Select_CString( scoped_ruler.IsFemale, 'a', 'o' )] [scoped_ruler.GetTitledFirstName], que formou um novo Sultanato na região."
 middle_east_decisions.0015.desc.romans:0 "[Select_CString( scoped_ruler.IsFemale, 'A', 'O' )] bárbar[Select_CString( scoped_ruler.IsFemale, 'a', 'o' )] senhor[Select_CString( scoped_ruler.IsFemale, 'a', '' )] da guerra [scoped_ruler.GetTitledFirstName] abriu caminho através da Anatólia e estabeleceu um novo Sultanato na região.\n\nComo se isso não fosse insulto suficiente, em um show desprecível de arrogância, [scoped_ruler.GetSheHe] decidiu reivindicar para [Select_CString( scoped_ruler.IsFemale, 'si mesma', 'si mesmo' )] o título de [scoped_ruler.GetTitleTierName] de Roma."
 middle_east_decisions.1001.a:0 "Eu irei para coisas ainda maiores!"
 middle_east_decisions.1001.b:0 "Não é menos uma conquista por ser repetitiva."
 middle_east_decisions.1001.desc:0 "Passaram-se séculos desde que a Armênia exerceu esse nível de domínio no Levante e no Cáucaso, com os impérios gêmeos do Oriente e do Ocidente nos batendo implacavelmente uma e outra vez. Às vezes, o Ocidente fala em Latim, às vezes em Grego, e às vezes o Oriente fala em Persa, às vezes em Árabe, mas sempre esses impérios lutam, e sempre nossas antigas terras parecem ser o campo de batalha.\n\nA partir de hoje, não mais. Eu recuperei os antigos territórios de Tigranes, o Grande, e a bandeira da Grande Armênia se ergue novamente!"
 middle_east_decisions.1001.t:0 "Um Novo Águia Surge"
 middle_east_decisions.1002.a:0 "A dignidade imperial requer mais do que simples terras."
 middle_east_decisions.1002.b:0 "Desta vez, ninguém nos separará."
 middle_east_decisions.1002.c:0 "Tão insignificante quanto seu predecessor."
 middle_east_decisions.1002.desc:0 "Uma situação estranha vem se desenvolvendo nas montanhas do Cáucaso há algum tempo. Contra todas as probabilidades, [founder.GetFullNameNoTooltip] conseguiu esculpir um reino considerável, que se estende desde o Mar Cáspio no leste até as margens do Mediterrâneo no oeste. Embora imperfeito, isso recriou aproximadamente o antigo império de Tigranes, o Grande, uma circunstância que os arautos de [founder.GetFullNameNoTooltip] estão prontos para celebrar.\n\nA bandeira da Grande Armênia se ergue novamente, mas por quanto tempo?"
 middle_east_decisions.1020.a:0 "A caneta é mais poderosa que a espada"
 middle_east_decisions.1020.b:0 "O campo de batalha chama"
 middle_east_decisions.1020.c:0 "Eu acredito na minha fé"
 middle_east_decisions.1020.d:0 "Vamos mostrar a eles a #EMP verdadeira#! fé!"
 middle_east_decisions.1020.desc:0 "Assim como os rios fluem de forma constante, também crescerá este império que agora se estende diante de mim.\n\nA fusão dessas terras resistirá ao teste do tempo — só preciso dar um pequeno empurrão na direção certa para manter isso.\n\nAgora devo escolher um caminho a seguir, para guiar meu povo pelas ondas de inúmeras mudanças que virão."
 middle_east_decisions.1020.t:0 "O Império de Beth Nahrain"
 middle_east_decisions.1100.a:0 "Todo o mundo pertencerá à casa do Islã!"
 middle_east_decisions.1100.desc:0 "Desde o Califado Rashidun não se via o Islã unido sob um único estandarte. Guiado por um propósito, uma visão. Um verdadeiro [Glossary( 'Dar al-Islam', 'DAR_AL_ISLAM_GLOSS' )].\n\nDe todos os cantos do mundo, [GetReligionByKey('islam_religion').GetAdherentNamePluralNoTooltip] agora viajam para [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]. Peregrinos e príncipes, estudiosos e soldados. De desertos distantes e portos lotados, de cada escola e seita, eles se reúnem diante de mim — para baixar suas cabeças, para entregar seus corações.\n\nSó o tempo dirá se essa unidade irá perdurar — ou se está fadada a desaparecer na história mais uma vez. Por agora, as multidões conhecerão a paz abrangente do Islã."
 middle_east_decisions.1100.t:0 "Dar al-Islam"
 middle_east_decisions.1101.a:0 "Saudações ao [dar_al_islam_ruler.GetTitleAsNameNoTooltip]!"
 middle_east_decisions.1101.b:0 "Talvez eu também devesse me juntar a [dar_al_islam_ruler.GetSheHe]?"
 middle_east_decisions.1101.c:0 "Um acontecimento extremamente preocupante."
 middle_east_decisions.1101.intro:0 "Desde o Califado Rashidun o Islã não era uma força unificada. Ainda assim, parece que [dar_al_islam_ruler.GetShortUIName] realizou o impossível e criou um verdadeiro [Glossary( 'Dar al-Islam', 'DAR_AL_ISLAM_GLOSS' )]."
 middle_east_decisions.1101.islam_desc:0 "[GetReligionByKey('islam_religion').GetAdherentNamePluralNoTooltip] de todo o mundo estão se reunindo sob o estandarte [dar_al_islam_ruler.GetHerHim]. Fornecendo a força, a segurança e a prosperidade que este novo governo está destinado a trazer."
 middle_east_decisions.1101.other_desc:0 "O tempo dirá como este novo [dar_al_islam_ruler.GetTitleAsNameNoTooltip] irá governar. É preciso parar e se perguntar: o que isso significará para o resto do mundo?"
 middle_east_decisions.1102.a:0 "O tempo dirá se [dar_al_islam_ruler.GetSheHe] é dign[Select_CString( dar_al_islam_ruler.IsFemale, 'a', 'o' )]."
 middle_east_decisions.1102.desc:0 "Isso significa que eu não sou mais a autoridade religiosa da fé [ROOT.Char.GetFaith.GetName]. E eu, como qualquer outro [GetReligionByKey('islam_religion').GetAdherentName], terei que me submeter ao novo [dar_al_islam_ruler.GetTitleAsNameNoTooltip]."
 middle_east_major_decisions.1020.desc:0 "Seria possível unir os reinos ao redor dos rios Tigre e Eufrates sob um único estandarte? Um império tão vasto que os reis e rainhas do passado ficariam invejosos!"
 middle_east_major_decisions.1020.lack_nestorian:0 "Se você já segue a [faith|E] [GetFaithByKey('nestorian').GetAdherentName], ganha a opção de [GetTrait('crusader_king').GetName( GetNullCharacter )]"
 middle_east_major_decisions.1020.learning.desc:0 "Se você focar seu [empire|E] em [learning|E]"
 middle_east_major_decisions.1020.martial.desc:0 "Se você focar seu [empire|E] em [martial|E]"
 middle_east_major_decisions.1020.nestorian.desc:0 "Se você focar seu [empire|E] na [faith|E] [GetFaithByKey('nestorian').GetAdherentName]"
 middle_east_major_decisions.1020.no_faith.desc:0 "Se você escolher se converter para a [faith|E] [GetFaithByKey('nestorian').GetAdherentName]"
 middle_east_major_decisions.1020.promote_culture.tt:0 "A capacidade do meu [GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName] de [councillor_task|E] de $task_promote_culture|V$ se torna mais eficaz em [counties|E] onde [GetModifier('promote_culture_beth_nahrain_modifier').GetNameWithTooltip] existe"
 middle_east_major_decisions.1020.t:0 "Lar dos Rios"
 middle_east_major_decisions.1020.tt:0 "Espalhe e una a [culture|E] $assyrian$"
 middle_east_major_decisions.1020_fervor:0 "Fundação de Beth Nahrain"
 promote_culture_beth_nahrain_modifier:0 "Fluxo e Refluxo"
 promote_culture_beth_nahrain_modifier_custom_desc:0 "Cada condado dentro de Beth Nahrain sem a [culture|E] $assyrian$"
 promote_culture_beth_nahrain_modifier_desc:0 "A influência $assyrian$ agora é um aspecto aceito da vida nesta região, e seus habitantes estão mais propensos a adotar os costumes e valores $assyrian$."
