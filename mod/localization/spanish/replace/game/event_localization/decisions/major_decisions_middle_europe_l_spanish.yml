l_spanish:
 establish_the_electorate_of_saxony_decision:0 "Estabelecer o Eleitorado da Saxônia"
 establish_the_electorate_of_saxony_decision_confirm:0 "Forjar uma nova Saxônia!"
 establish_the_electorate_of_saxony_decision_desc:0 "As terras do interior a leste têm permanecido por muito tempo fora do alcance do Império. Devemos consolidar esses títulos em uma nova Saxônia, para assegurar nosso domínio sobre a região."
 establish_the_electorate_of_saxony_decision_tooltip:0 "$establish_the_electorate_of_saxony_decision_desc$"
 middle_europe_decision.0017.tt:0 "Como Imperador, a Saxônia será concedida a um [vassal|E] ou [courtier|E] ao ser criada."
 middle_europe_decisions.0001.a:0 "Permanecemos juntos!"
 middle_europe_decisions.0001.desc:0 "Por muito tempo, as cidades ao redor dos Alpes centrais têm sido ameaçadas por outros atores dentro do Império. Unidas sob uma única bandeira, elas agora forjaram alianças mutuamente benéficas e receberam a honra da imediatividade imperial.\n\nEm homenagem às contribuições da minha dinastia às cidades-estado suíças, fui escolhido como líder dessa união, aquele que será o figura central de todos os Cantões da nossa nova Confederação Suíça. Não seremos mais ameaçados por estrangeiros, mas nos ergueremos como um ator independente e forte no Império."
 middle_europe_decisions.0001.t:0 "A Confederação Suíça"
 middle_europe_decisions.0002.a:0 "Que peculiar..."
 middle_europe_decisions.0002.desc.emperor:0 "Após anos de conflitos e acordos diplomáticos incertos, fui obrigado a conceder imediatividade imperial aos Cantões Suíços.\n\nEssa coleção de cidades alpinas uniu-se em uma grande Confederação para se proteger das investidas dos Borgonheses e dos senhores alemães. Preciso ter cuidado para mantê-los sob controle, para que suas conquistas não provoquem dissensões entre os burgueses vizinhos."
 middle_europe_decisions.0002.desc.vassals:0 "Uma nova entidade conhecida como Confederação Suíça surgiu no Império. Eles são uma aglomeração de cidades com imediatividade imperial estabelecidas ao redor dos Alpes centrais e formaram uma aliança defensiva para se proteger dos outros eleitores ao redor.\n\nUma força independente a ser considerada, eles se libertaram de quaisquer reivindicações anteriores sobre suas terras, sejam dos antigos borgonheses a oeste ou dos senhores alemães ao norte.\n\nDevo ficar de olho nessa nova potencial ameaça no Império."
 middle_europe_decisions.0003.a:0 "Austria erit in orbe ultima!"
 middle_europe_decisions.0003.desc:0 "Graças às minhas ilustres conquistas consolidando as terras centrais da Áustria e ao tremendo poder que minha dinastia adquiriu sobre o Sacro Império Romano, [scoped_emperor.GetTitledFirstName] finalmente reconheceu a primazia da Áustria sobre os muitos duques insignificantes da Alemanha.\n\nDe agora em diante, todos os meus sucessores carregarão o título distinto de #EMP arquiduque#!, igual a qualquer rei, para se destacarem dos príncipes e princesas menores do Império."
 middle_europe_decisions.0003.t:0 "O Arquiducado da Áustria"
 middle_europe_decisions.0004.a:0 "Foi totalmente merecido."
 middle_europe_decisions.0004.b:0 "Que conveniente..."
 middle_europe_decisions.0004.desc.emperor:0 "É justo que os governantes das terras centrais da Áustria, lar da minha própria dinastia, sejam diferenciados dos outros Príncipes e Princesas do Império.\n\nAssim, recentemente atendi aos pedidos [Select_CString( scoped_ruler.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('scoped_ruler'))] e proclamei [Select_CString( scoped_ruler.IsFemale, 'a', 'o' )] [scoped_ruler.GetFirstName] [scoped_ruler.GetTitleTierName] da Áustria."
 middle_europe_decisions.0004.desc.emperor_archduke:0 "Aproveitando o controle do trono imperial por [scoped_ruler.GetSheHe], [scoped_ruler.GetTitledFirstName] concedeu legalmente a [scoped_ruler.GetHerselfHimself] o título de Arquiduque da Áustria, tornando o ducado igual a qualquer reino."
 middle_europe_decisions.0004.desc.emperor_blackmailed:0 "A Áustria sempre se considerou superior ao restante do Império, e hoje, [scoped_ruler.GetFirstName] confirmou isso. Usando os laços [scoped_ruler.GetHerHim] comigo, não tive escolha senão confirmar o status [scoped_ruler.GetHerHim] como arquiduque, igual a qualquer rei."
 middle_europe_decisions.0004.desc.vassals:0 "Aproveitando a influência da dinastia [scoped_ruler.GetDynastyName] sobre o trono imperial, [scoped_ruler.GetFirstName] convenceu [Select_CString( scoped_emperor.IsFemale, 'a', 'o' )] [scoped_emperor.GetTitledFirstName] a conceder a [scoped_ruler.GetSheHe] honras especiais.\n\nA partir de agora, a Áustria deve ser considerada um Arquiducado, o primeiro entre os Principados do Sacro Império Romano."
 middle_europe_decisions.0005.a:0 "Louvado seja [scoped_ruler.GetFaith.HighGodName]!"
 middle_europe_decisions.0005.desc:0 "A Europa está unida mais uma vez. Todos os descendentes dos francos foram reunidos sob uma única bandeira e permanecem unidos contra os infiéis a oeste e os pagãos a leste.\n\nPela graça de [scoped_ruler.GetFaith.HighGodName], minha família recebeu o privilégio de portar a coroa deste Império Carolíngio restaurado. E, ao contrário daqueles que vieram antes de nós, não permitiremos que disputas dinásticas desfaçam este grande reino."
 middle_europe_decisions.0005.t:0 "O Sonho de Carlos Magno"
 middle_europe_decisions.0006.a:0 "Como [scoped_ruler.GetSheHe|U] se atreve!"
 middle_europe_decisions.0006.b:0 "Será que este Império durará mais tempo, eu me pergunto?"
 middle_europe_decisions.0006.desc:0 "[scoped_ruler.GetTitledFirstName] e seu exército de francos avançaram tanto nas terras do Império que [scoped_ruler.GetSheHe] começou a afirmar que [scoped_ruler.GetSheHe] é o verdadeiro herdeiro de Carlos Magno e que o Sacro Império Romano é apenas uma pálida imitação da glória carolíngia.\n\nCom todas as províncias originais e grande parte da Europa Ocidental sob o controle [scoped_ruler.GetHerHim], tem se tornado difícil para qualquer um negar tal reivindicação."
 middle_europe_decisions.0007.a:0 "Não precisamos da proteção de ninguém!"
 middle_europe_decisions.0007.desc:0 "Todas as terras burgúndias foram unidas sob uma única coroa. Não mais divididas entre reinos mesquinhos e guerreiros, nossas terras ancestrais recuperaram a dignidade de um Reino.\n\nJá faz algum tempo desde que a autoridade d[Select_CString( former_liege.IsFemale, 'a', 'o' )] [former_liege.GetTitledFirstNamePossessive] sobre mim começou a enfraquecer a ponto de eu não sentir mais lealdade para com o que considero um igual em vez de um senhor feudal."
 middle_europe_decisions.0007.t:0 "Borgonha Unificada"
 middle_europe_decisions.0008.a:0 "[scoped_ruler.GetSheHe|U] não passa de um traidor!"
 middle_europe_decisions.0008.b:0 "Pelo menos os topógrafos ficarão felizes."
 middle_europe_decisions.0008.desc.liege:0 "Tenho me preocupado há algum tempo com as tentativas d[Select_CString( scoped_ruler.IsFemale, 'a', 'o' )] [scoped_ruler.GetTitledFirstNamePossessive] de unificar as terras burgúndias sob uma única bandeira, e agora meus piores medos se concretizaram.\n\nO ingrato decidiu proclamar [scoped_ruler.GetHerselfHimself] [scoped_ruler.GetTitleTierName] da Borgonha e rompeu seu juramento de vassalagem!"
 middle_europe_decisions.0008.desc.others:0 "Após passar vários anos unindo as terras burgúndias, [scoped_ruler.GetFirstName] decidiu coroar [scoped_ruler.GetHerselfHimself] [scoped_ruler.GetTitleTierName] da Borgonha e declarar independência d[Select_CString( former_liege.IsFemale, 'a', 'o' )] [former_liege.GetTitledFirstName].\n\nEsse ato de traição audacioso provavelmente não será esquecido tão cedo..."
 middle_europe_decisions.0010.a:0 "Em Palermo, sua antiga sede!"
 middle_europe_decisions.0010.b:0 "Será em Nápoles."
 middle_europe_decisions.0010.c:0 "Devo considerar seriamente essa decisão."
 middle_europe_decisions.0010.desc:0 "A infraestrutura deixada pelos gregos nas províncias da Sicília e Apúlia servirá como base para acelerar a transição do [scoped_ruler.GetPrimaryTitle.GetName] para uma forma de governo mais iluminada.\n\nAo reunir representantes dos três Estados em um único órgão consultivo, orientado por novas leis baseadas em antigas tradições romanas, eu garantirei estabilidade e prosperidade no Mediterrâneo para as gerações futuras. Agora, só preciso decidir onde esse Parlamento deverá ser sediado."
 middle_europe_decisions.0010.t:0 "A Assembleia dos Estados"
 middle_europe_decisions.0010.tt_napoli_warning:0 "@warning_icon! #warning Construir o parlamento em [GetTitleByKey('c_napoli').GetNameNoTier] impedirá você de construir uma universidade!#!"
 middle_europe_decisions.0011.a:0 "Entendi..."
 middle_europe_decisions.0011.desc:0 "[scoped_ruler.GetTitledFirstName] nomeou representantes da Nobreza, do Clero e dos Burgueses para formar um novo Parlamento no Reino da Sicília.\n\nEsse órgão consultivo ajudará o [scoped_ruler.GetTitleTierName] e seus sucessores a governar com sabedoria e eficiência, em benefício de todos os súditos."
 middle_europe_decisions.0012.a:0 "Que nosso grande trabalho continue!"
 middle_europe_decisions.0012.desc:0 "Uma nova era de prosperidade está sobre nós. [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] emergiu da Idade das Trevas como um farol brilhante de arte e filosofia.\n\nNossas cidades estão se tornando centros efervescentes de comércio, erguendo novas catedrais maravilhosas para rivalizar com os antigos monumentos do Império Romano, atraindo pintores, bardos e filósofos de todos os tipos. Sob o patrocínio iluminado de minha dinastia, o povo [scoped_ruler.GetCulture.GetName] se tornará a inveja de toda a Europa."
 middle_europe_decisions.0012.t:0 "Opus Francigenum"
 middle_europe_decisions.0013.a:0 "Que tempos maravilhosos em que vivemos!"
 middle_europe_decisions.0013.b:0 "Bah! Isso nunca vai durar."
 middle_europe_decisions.0013.c:0 "Bom para eles, suponho..."
 middle_europe_decisions.0013.desc.fallback:0 "[scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] está vivendo um período de grande prosperidade e crescimento, em benefício de todo o povo [ROOT.Char.GetCulture.GetNameNoTooltip].\n\nNovas cidades estão se tornando centros efervescentes de comércio, erguendo novas catedrais maravilhosas para rivalizar com os antigos monumentos do Império Romano, atraindo pintores, bardos e filósofos de todos os tipos. Sob o patrocínio iluminado d[Select_CString( scoped_ruler.IsFemale, 'a', 'o' )] [scoped_ruler.GetTitledFirstName] e da dinastia [scoped_ruler.GetDynasty.GetBaseName], esta terra se tornará a inveja de toda a Europa."
 middle_europe_decisions.0013.desc.french:0 "[scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] está vivendo um período de grande prosperidade e crescimento, em benefício de todo o nosso povo.\n\nNossas cidades estão se tornando centros efervescentes de comércio, erguendo novas catedrais maravilhosas para rivalizar com os antigos monumentos do Império Romano, atraindo pintores, bardos e filósofos de todos os tipos. Sob o patrocínio iluminado d[Select_CString( scoped_ruler.IsFemale, 'a', 'o' )] [scoped_ruler.GetTitledFirstName] e da dinastia [scoped_ruler.GetDynasty.GetBaseName], nos tornaremos a inveja de toda a Europa."
 middle_europe_decisions.0013.desc.italian:0 "Parece que o [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] está vivendo um período de grande prosperidade e crescimento. \n\nPoetas, filósofos, arquitetos... Muitas pessoas de conhecimento estão se reunindo na corte d[Select_CString( scoped_ruler.IsFemale, 'a', 'o' )] [scoped_ruler.GetTitledFirstNamePossessive], mas tudo o que eles conseguiram alcançar até agora é um interminável desfile de brutais e bárbaros monumentos."
 middle_europe_decisions.0013.t:0 "O Período Gótico"
 middle_europe_decisions.0015.a:0 "De Augusto, a Carlos Magno, [Select_CString( founder.IsFemale, 'a', 'ao' )] [founder.GetFirstNameNoTooltip]!"
 middle_europe_decisions.0015.desc.unblessed:0 "Por muito tempo, o manto de Imperador Romano no Ocidente permaneceu sem dono. A mais alta autoridade da Igreja não ofereceu nenhuma bênção, mas o império não pode permanecer vago para sempre.\n\nDiante dos meus vassalos e clérigos reunidos, pego a coroa e a espada e juro governar de acordo com a vontade de [founder.GetFaith.HighGodNamePossessive]. Algumas vozes emudecem; outras erguem-se em fúria estridente. Suas dúvidas serão respondidas pela força e justiça do meu reinado.\n\nEnfim. Sou o Sacro Romano Imperador."
 middle_europe_decisions.0015.desc:0 "Por tempo demais, a posição de Imperador Romano no Ocidente ficou sem dono. Hoje, diante d[Select_CString( founder_hof.IsFemale, 'a', 'o' )] [founder_hof.GetTitledFirstName] no maior [founder.GetFaith.HouseOfWorship] de toda [ceremony_locale.GetNameNoTooltip], cercado por meus vassalos e clérigos, isso vai mudar.\n\nNós trocamos orações e benefícios por roteiro, pedindo a [founder.GetFaith.HighGodName] que me abençoe com a força e misericórdia para governar meu império de acordo com a sua vontade. Solenemente, [founder_hof.GetTitledFirstNameNoTooltip] me presenteia com coroa e espada, e me encarrega do cuidado de toda a Cristandade.\n\nSilêncio, seguido de hinos triunfantes que ecoam, abafados apenas pelos aplausos furiosos de meus nobres.\n\nFinalmente. Sou o Imperador Romano Sagrado."
 middle_europe_decisions.0015.t:0 "O Império do Ocidente"
 middle_europe_decisions.0016.a:0 "Bah, uma pretensiosa concepção de império."
 middle_europe_decisions.0016.b:0 "Bárbaros alemães, #emphasis eu# sou o Imperador Romano!"
 middle_europe_decisions.0016.c:0 "Esperemos que o império prove ser pacífico."
 middle_europe_decisions.0016.d:0 "Um espetáculo glorioso!"
 middle_europe_decisions.0016.desc.unblessed:0 "O Império Romano no Ocidente permaneceu adormecido por algum tempo, deixando a resposta [founder.GetFaith.GetAdjectiveNoTooltip] à questão da dignidade imperial incerta, na melhor das hipóteses.\n\n[founder.GetTitledFirstName] respondeu agora restabelecendo o império de Carlos Magno perante os vassalos e clérigos reunidos — sem a bênção da mais alta autoridade da Igreja.\n\nResta saber se a sanção sagrada seguirá a reivindicação imperial de [founder.GetHerHis] ou se o novo império deverá sustentar-se apenas pela força e pelo prestígio."
 middle_europe_decisions.0016.desc:0 "O Império Romano no Ocidente tem estado adormecido por algum tempo, deixando a resposta da dignidade imperial para os [founder.GetFaith.GetAdjectiveNoTooltip] incerta, na melhor das hipóteses.\n\nIncerta, até agora, quando [Select_CString( founder.IsFemale, 'a', 'o' )] [founder.GetTitledFirstName] reestabeleceu o império de Carlos Magno em uma cerimônia luxuosa realizada no mais grandioso dos [founder.GetFaith.HouseOfWorshipPlural] em [ceremony_locale.GetNameNoTooltip], com o consentimento d[Select_CString( founder_hof.IsFemale, 'a', 'o' )] [founder_hof.GetTitledFirstName].\n\nEm todo o mundo, [founder.GetFaith.PriestNeuterPlural] [founder.GetFaith.GetAdjectiveNoTooltip] se regozijam, confiantes de que Roma finalmente tem um verdadeiro e divino herdeiro mais uma vez!"
 middle_europe_decisions.0017.a:0 "Glória à Saxônia!"
 middle_europe_decisions.0017.b:0 "[heir_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] merece esse título."
 middle_europe_decisions.0017.c:0 "Verdadeiramente, [most_powerful_saxon.GetNameNoTooltip] é digno."
 middle_europe_decisions.0017.d:0 "Este é o meu presente para a Igreja."
 middle_europe_decisions.0017.desc:0 "Por muito tempo, Polabia esteve fora das mãos dos inimigos do [hre_emperor_scope.GetPrimaryTitle.GetTierAsNameNoTooltip], mas agora sua população considera $e_hre$ como seu verdadeiro lar.\n\nCom o estabelecimento do Eleitorado da Saxônia, a região da Alta Saxônia permanecerá agora e para sempre nas mãos d[Select_CString( hre_emperor_scope.IsFemale, 'a', 'o' )] [hre_emperor_scope.GetTitleAsNameNoTooltip] e sob a orientação de [hre_emperor_scope.GetFaith.HighGodName]."
 middle_europe_decisions.0017.e:0 "Parabéns, [rando_courtier_scope.GetNameNoTooltip]!"
 middle_europe_decisions.0017.t:0 "O Eleitorado da Saxônia"
 middle_europe_decisions.0018.a.new_king:0 "Glória para mim!"
 middle_europe_decisions.0018.a.slav:0 "Malditos sejam!"
 middle_europe_decisions.0018.a:0 "Boa para eles."
 middle_europe_decisions.0018.desc:0 "$middle_europe_decisions.0017.desc$\n\n[hre_emperor_scope.GetNameNoTooltip] decidiu conceder esse novo título a [new_saxon_king.GetName], em reconhecimento ao serviço prestado ao trono."
 polabia_held_or_nonexistent.tt:0 "$k_sorbia$ não existe ou está em seu poder."
 polabia_must_be_hre_culture_tt:0 "Pelo menos 12 [counties|E] em [GetGeographicalRegion('custom_polabia').GetName] são da sua cultura ou da cultura do seu [liege|E]."
