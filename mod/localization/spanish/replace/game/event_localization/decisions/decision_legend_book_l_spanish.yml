l_spanish:
 ce1_decision_events.0001.a:0 "Encantador!"
 ce1_decision_events.0001.desc:0 "[Select_CString( chronicler.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chronicler'))] [chronicler.GetFirstName] me recebe com um sorriso satisfeito. A lâmpada de leitura [chronicler.GetHerHim] quase acabou o óleo.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [chronicler.GetSheHe] diz, enquanto [chronicler.GetSheHe] coloca um livro lindamente ornamentado, \"nós nos certificamos de acompanhar cada pequena coisa, cada feito, cada batalha, cada aventura e cada romance.\"\n\n\"Tudo isso,\" [chronicler.GetSheHe] continua, \"registrado para as eras."
 ce1_decision_events.0001.t:0 "Escreva isso"
 legend_book:0 "[ROOT.Var('finished_legend_var').Legend.GetName]"
 legend_book_desc:0 "#EMP [ROOT.Var('finished_legend_var').Legend.GetChapterDescriptionByName('opening')]#!\n\n#EMP A lenda de [ROOT.Var('finished_legend_var').Legend.GetProtagonist.GetTitledFirstNamePossessiveNoTooltip|U] culmina em uma maravilhosa aventura: seus grandes feitos de armas foram tão admirados que todos os reis ficaram maravilhados com eles e muitos nobres e plebeus vieram ao seu encontro, pois desejavam ver a lenda em carne e osso.#!\n\n#EMP [ROOT.Var('finished_legend_var').Legend.GetChapterDescriptionByName('conclusion')]#!"
