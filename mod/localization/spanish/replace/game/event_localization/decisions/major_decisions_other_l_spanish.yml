l_spanish:
 brunei_empire_high_sadaqah_modifier:0 "Sadaqah Generosamente Distribuída"
 brunei_empire_low_sadaqah_modifier:0 "Sadaqah Distribuída"
 brunei_kingdom_khutbah_piety_option_modifier:0 "Luz da Ummah"
 brunei_kingdom_khutbah_prestige_option_modifier:0 "Protetor da Ummah"
 major_decisions.0001.a:0 "Vida longa ao [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
 major_decisions.0001.desc:0 "As antigas formas nos serviram bem, e sempre as honraremos. No entanto, como [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip] do [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], concluí que devemos adotar o feudalismo e seus princípios se quisermos continuar prosperando. É o próximo passo crucial em nosso caminho para a grandeza!"
 major_decisions.0001.t:0 "Uma Nova Era"
 major_decisions.0002.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 major_decisions.0100.a:0 "Somos mais do que meros mortais."
 major_decisions.0100.b:0 "Virtude sem falhas!"
 major_decisions.0100.desc.spiritual:0 "Minha devoção inabalável aos representantes de [scoped_ruler.GetFaith.HighGodNamePossessive] na Terra não passou despercebida. \n\n[scoped_pope.GetTitledFirstName] reconheceu oficialmente as contribuições da minha família e consagrou nosso nome como defensores eternos da fé [scoped_ruler.GetFaith.GetAdjective]."
 major_decisions.0100.desc.temporal:0 "Graças à minha devoção pura e trabalho incansável, eu uni de forma indissolúvel os mais sagrados cargos da fé [scoped_ruler.GetFaith.GetAdjective] à dinastia [scoped_ruler.GetDynasty.GetBaseName].\n\nUm número crescente de pessoas no clero e entre os fiéis passou a considerar minha família como os escolhidos para zelar pelas relíquias sagradas e como os mensageiros da vontade divina."
 major_decisions.0100.t:0 "Linhagem Sagrada"
 major_decisions.0102.a:0 "Vivemos em tempos abençoados."
 major_decisions.0102.b:0 "Eles são um exemplo para todos nós!"
 major_decisions.0102.desc.spiritual:0 "Tais são as conquistas d[Select_CString( scoped_ruler.IsFemale, 'a', 'o' )] [scoped_ruler.GetTitledFirstName] que o [scoped_pope.GetFaith.ReligiousHeadName] reconheceu oficialmente [Select_CString( scoped_pope.IsFemale, 'a si mesma', 'a si mesmo' )] o papel fundamental [scoped_ruler.GetHerHim] na defesa e promoção das virtudes [scoped_ruler.GetFaith.GetAdjective].\n\nA dinastia [scoped_ruler.GetDynasty.GetBaseName] será lembrada por sua piedade e zelo graças à conduta impecável dess[Select_CString( scoped_ruler.IsFemale, 'a', 'e' )] grande [scoped_ruler.GetWomanMan]."
 major_decisions.0102.desc.temporal:0 "Graças à sua conduta impecável e governo iluminado, [scoped_ruler.GetTitledFirstName] está prestes a ser imortalizado como o pilar da fé do [scoped_ruler.GetFaith.GetName].\n\n[scoped_ruler.GetSheHe|U] se tornou, de longe, o [scoped_ruler.GetTitleTierName] mais influente e respeitado da história recente, e alguns afirmam que pode haver um toque de sangue divino correndo em suas veias."
 major_decisions.0103.a:0 "Todos deveríamos ser gratos a [scoped_ruler.GetSheHe]."
 major_decisions.0103.b:0 "Mais blasfêmia d[Select_CString( scoped_ruler.IsFemale, 'a', 'o' )] [scoped_ruler.GetFirstNameNoTooltip]..."
 major_decisions.0103.desc.spiritual:0 "[scoped_ruler.GetTitledFirstName] dedicou sua vida a conquistar o favor do clero [scoped_ruler.GetFaith.GetAdjective], e os frutos de seu trabalho finalmente estão aparecendo. \n\n[scoped_pope.GetTitledFirstName] reconheceu oficialmente as contribuições de nossa família e consagrou nosso nome como defensores eternos da fé."
 major_decisions.0103.desc.temporal:0 "[scoped_ruler.GetTitledFirstName] dedicou sua vida a envolver o manto da ascendência divina em nosso nome de família, e os frutos de seu trabalho finalmente estão aparecendo. \n\nUm número crescente de pessoas no clero e entre os fiéis passou a considerar nossa dinastia como os escolhidos para zelar pelas relíquias sagradas e como os mensageiros da vontade divina."
 major_decisions.0200.a:0 "Vou provar meu valor!"
 major_decisions.0200.desc:0 "Embora eu esteja acostumado a um sistema estritamente hierárquico e a camponeses que não fazem perguntas ao cultivar os campos, encontro-me governando apenas um grupo de pessoas indisciplinadas. Essas pessoas não me respeitam, elas só respeitam a força.\n\nEu vou mostrar-lhes força! Vou abandonar as vestimentas de majestade que meus súditos detestam e conquistar seus corações com uma espada erguida!"
 major_decisions.0200.t:0 "De Volta às Origens"
 major_decisions.0500.a:0 "Temos um futuro brilhante pela frente!"
 major_decisions.0500.desc:0 "Por gerações, nossa dinastia é conhecida pela força de seu sangue. Vigor, beleza e intelecto são atributos associados ao nome dos [ROOT.Char.GetDynasty.GetBaseNameNoTooltip].\n\nMinha própria excelência apenas confirma isso - todas as melhores qualidades de nossa dinastia em um indivíduo perfeito. Meu nome e meus dons viverão através de meus descendentes por séculos."
 major_decisions.0500.t:0 "A Força da Dinastia [ROOT.Char.GetDynasty.GetBaseNameNoTooltip]"
 major_decisions.0501.a:0 "Que nosso legado viva eternamente!"
 major_decisions.0501.desc:0 "Por meio de casamentos cuidadosamente planejados, alianças e conquistas, a dinastia [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] conquistou seu lugar entre os verdadeiros poderes do mundo conhecido.\n\n[realm_1.GetNameNoTierNoTooltip|U], [realm_2.GetNameNoTierNoTooltip|U], [realm_3.GetNameNoTierNoTooltip|U], [realm_4.GetNameNoTierNoTooltip|U]... Nosso domínio se estende longe e largo. Muitas coroas repousam sobre nossas cabeças, mas pelo sangue, estamos unidos como um só."
 major_decisions.4000.a:0 "Os céus abençoem meu clã!"
 major_decisions.4000.b:0 "Este é #italic o nosso#! estandarte."
 major_decisions.4000.c:0 "Enfrentei o sol para proteger meu povo."
 major_decisions.4000.desc:0 "Das terras sagradas de meus ancestrais até os rios sempre fluindo do Delta do Mekong, meu triunfo retumbante é inegável.\n\nNosso povo lutou por séculos para realizar seu verdadeiro potencial contra opressores do norte, e agora estamos unidos para enfrentar perigos ainda maiores.\n\nQue os domínios saibam que eu, [ROOT.Char.GetTitleAsNameNoTooltip] de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], e meu sangue abençoado, seremos os verdadeiros guardiões destas terras."
 major_decisions.4000.t:0 "Reinado do Imperador do Sul"
 major_decisions.4001.a:0 "Bem-vindo à mesa redonda."
 major_decisions.4001.b:0 "Outro?"
 major_decisions.4001.desc:0 "Notícias distantes relatam uma declaração imperial, proclamando [founder.GetFullNameNoTooltip] como governante. Após um esforço árduo para preservar sua soberania, eles adquiriram a expertise necessária para estabelecer uma pátria para seu povo.\n\nVeremos quanto tempo essa estabilidade durará antes que rivais perigosos ameacem com seu olhar hostil."
 major_decisions.4001.t:0 "Fundação de um Império Viet"
 major_decisions.5000.a:0 "Devo me tornar um com o Monte Merapi, lançando fogo e cinzas!"
 major_decisions.5000.b:0 "Om, Sri Sedana, una-nos ao espírito do mundo."
 major_decisions.5000.desc:0 "Com a formação do meu império, [ritual_guide.GetTitledFirstName] me acompanhou até o templo ao amanhecer para explicar nossa jornada que está por vir.\n\n\"O cosmos da divindade gira ao seu redor, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip]. Você não é mais um buscador, mas um moldador. Alcançará isso absorvendo as cinzas de Merapi ou purificando sua alma sob as quedas de Sri?\" [ritual_guide.GetSheHe] concluiu com um tom calmo.\n\nDevo traçar o caminho para meus súditos e para mim mesmo."
 major_decisions.5000.t:0 "O Ritual da Ascensão"
 major_decisions.5001.a:0 "Por agora, temos nossos próprios problemas."
 major_decisions.5001.b:0 "Afinal, apenas mais um concorrente ao poder."
 major_decisions.5001.desc:0 "Meus conselheiros me informaram sobre o estabelecimento do império insular de [founder.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nEmbora afirmem que [Select_CString( founder.IsFemale, 'sua', 'seu' )] [founder.GetTitleAsNameNoTooltip] é vist[Select_CString( founder.IsFemale, 'a', 'o' )] por seu povo como [Select_CString( founder.IsFemale, 'uma salvadora', 'um salvador' )] de sua fé e cultura, ainda não sabemos o que esperar de suas intenções daqui para frente.\n\nVou observar se decidirão agir de forma amigável ou não em relação ao meu domínio."
 major_decisions.5001.t:0 "Nascimento do Majapahit"
 major_decisions.6000.a:0 "Forjem um artefato que inspire meu povo."
 major_decisions.6000.b:0 "Tragam-me uma relíquia que simbolize nossa força imperial."
 major_decisions.6000.desc:0 "\"Todos os ilhéus cantam seus elogios, [Select_CString( founder.IsFemale, 'minha', 'meu' )] [founder.GetTitleAsNameNoTooltip]. Mensagens foram enviadas a todos os líderes de clã, seus humildes súditos, sobre o estabelecimento de nosso novo estandarte. O trono Ryukyuan aguarda impacientemente para que você se sente\", exclama [antiquarian.GetTitledFirstName] após um longo discurso.\n\nÉ bom ser um[Select_CString( founder.IsFemale, 'a', '' )] [founder.GetTitleAsNameNoTooltip], mas meu tempo neste mundo é limitado, assim como o de meus filhos. Devo fortalecer e imortalizar nosso governo com uma relíquia que durará incontáveis gerações."
 major_decisions.6000.t:0 "Um Herdeiro Ryukyuan"
 major_decisions.6001.a:0 "Como um só, ergueremos as Três Montanhas aos céus!"
 major_decisions.6001.desc:0 "O tão aguardado shaku, [Select_CString( ROOT.Char.IsFemale, 'digna de uma verdadeira', 'digno de um verdadeiro' )] [ROOT.Char.GetTitleAsNameNoTooltip], foi confeccionado de acordo com minhas especificações. Ele superou todas as expectativas e sem dúvida destacará meu papel como mediador entre os súditos e os espíritos divinos.\n\nMeu povo não conhecerá preguiça nem tristeza enquanto constrói meu magnífico império. Certamente, trabalhar por um propósito tão divino remove todos os obstáculos."
 major_decisions.6001.t:0 "Shaku do Imperador"
 major_decisions.6002.a:0 "Nossa força ressoará pela eternidade."
 major_decisions.6002.desc:0 "Conforme combinado, [antiquarian.GetTitledFirstName] apresenta minha nova coroa, simbolizando a disposição do meu império em explorar o desconhecido e permanecer firme diante dos perigos da inação.\n\nMuito em breve, o mundo inteiro reconhecerá e exaltará os Ryukyuans, e meu nome será lembrado com admiração e esplendor. Meus descendentes usarão este símbolo de coragem com orgulho e desafiarão seus inimigos."
 major_decisions.6002.t:0 "A Coroa do Dragão"
 major_decisions.6003.a:0 "Admirável para origens tão humildes."
 major_decisions.6003.b:0 "Ainda assim, não estou impressionado."
 major_decisions.6003.desc:0 "Chegou ao meu conhecimento que um imperador se ergueu nas ilhas Ryukyuans, afirmando domínio sobre as planícies exuberantes e montanhas lendárias, unindo seus clãs sob um único estandarte.\n\nNão é fácil manter um império unido, especialmente quando os recursos são limitados. Observaremos o que resultará disso."
 major_decisions.6003.t:0 "Despertar dos Ryukyuans"
 major_decisions.7000.a:0 "Devemos apoiar as oficinas de cerâmica sangkhalok de [kingdom_capital.GetNameNoTier]."
 major_decisions.7000.b:0 "Nossos guerreiros merecem mais se quisermos superar nossos rivais."
 major_decisions.7000.c:0 "Promover os valores Tai deve ser meu esforço constante."
 major_decisions.7000.desc:0 "Ao entrar no salão, o aroma de incenso enche o ar, e o som de gongos de bronze ecoa pelo espaço, anunciando minha chegada. Meus conselheiros e escribas reais me cumprimentam de seus bancos baixos.\n\nApós trocar cumprimentos formais, vários membros do conselho oferecem conselhos sobre a prioridade do meu reinado: selecionar uma área de investimento que definirá o legado Tai.\n\nComo não chegam a uma conclusão, começo a reunir meus pensamentos finais sobre o assunto."
 major_decisions.7000.t:0 "Aurora da Felicidade"
 major_decisions.7001.a:0 "Mais um lançado ao furacão."
 major_decisions.7001.b:0 "Eles são uma ameaça para nós? Veremos."
 major_decisions.7001.desc:0 "No coração da selva, conhecida por alguns como a Terra Dourada, [founder.GetNameNoTierNoTooltip] ascendeu ao poder como [founder.GetTitleAsNameNoTooltip] de [founder.GetPrimaryTitle.GetNameNoTierNoTooltip] e desafiou o destino de seu povo.\n\nO povo Tai passou anos em busca de uma pátria, vagando com orgulho como nômades da região e gradualmente seguindo para o sul.\n\nSua influência resistirá à passagem do tempo?"
 major_decisions.7001.t:0 "Ascensão dos Tai"
 major_decisions.8000.a:0 "Que saibam os feitos [Select_CString( founder.IsFemale, 'da sua', 'do seu' )] [founder.GetTitleAsNameNoTooltip]."
 major_decisions.8000.b:0 "Todo louvor pertence somente a Allah."
 major_decisions.8000.desc:0 "[imam.GetTitledFirstName], que irá conduzir a próxima oração obrigatória de sexta-feira, relembra-me da tradição de preparar uma khutbah em nome [Select_CString( founder.IsFemale, 'da sua', 'do seu' )] [founder.GetTitleAsNameNoTooltip]. Além das orações e versos obrigatórios, [imam.GetSheHe] me pergunta qual parte deverá ser lida aos crentes para declarar minha soberania e tutela sobre eles."
 major_decisions.8000.t:0 "A Morada da Paz"
 major_decisions.9000.a:0 "Que os crentes saibam a generosidade [Select_CString( founder.IsFemale, 'da sua', 'do seu' )] [founder.GetTitleAsNameNoTooltip]!"
 major_decisions.9000.b:0 "Que Allah aceite nossa sadaqah."
 major_decisions.9000.desc:0 "Enraizado em nossa tradição islâmica, espera-se de um[Select_CString( founder.IsFemale, 'a', '' )] [founder.GetTitleAsNameNoTooltip] que retribua aos meus abençoados guerreiros, viajantes de minha terra e necessitados com as moedas recém cunhadas em meu nome."
 major_decisions.9000.desc_steward:0 "\n\nMeu [ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName] [steward.GetTitledFirstName] pergunta qual nível de generosidade estou disposto a oferecer aos meus leais súditos, como seu protetor."
 major_decisions.9000.t:0 "O Presente de Acessão do Imperador"
