l_spanish:
 FORUM_GLOSS:0 "Um fórum, helenizado como #EMP Fóros#!, era o termo romano para uma grande praça cívica, dedicada a reuniões públicas e mercados, e muitas vezes decorada com troféus de guerra e estatuária."
 MESE_GLOSS:0 "A #EMP Mese#!, ou 'Estrada do Meio', era a via principal de Constantinopla e a rota de procissões e triunfos. Seu núcleo colunado, a #EMP Regia#!, ou 'Estrada Imperial', estendia-se para oeste desde a Hagia Sophia por cada um dos [Glossary('fora', 'FORUM_GLOSS')] da cidade, antes de divergir para os portões nas muralhas de Teodósio."
 free_triumph_tooltip:0 "Você pode usar a [decision|E] #V $hold_triumph_decision$#! gratuitamente"
 half_price_chariot_race_flag_desc:0 "Restauração"
 half_price_chariot_race_tooltip:0 "Você pode realizar uma [activity|E] #V $activity_chariot_race$#! pela metade do custo"
 roman_restoration.0001.a:0 "Esto perpetua!"
 roman_restoration.0001.desc.christians:0 "O Imperium Romanum ergue-se forte mais uma vez, restaurado em sua antiga glória sob o meu governo iluminado, pronto para espalhar civilização, segurança e a sagrada luz de Nosso Senhor a todos os cantos do mundo conhecido. Pelo Senado e pelo Povo de Roma!"
 roman_restoration.0001.desc.fallback:0 "O Imperium Romanum permanece forte mais uma vez, restaurado à sua antiga glória sob o meu governo iluminado, pronto para espalhar a civilização, a segurança e o amor de [ROOT.Char.GetFaith.HighGodName] por todos os cantos do mundo conhecido. Pelo Senado e Povo de Roma!"
 roman_restoration.0001.desc.greeks:0 "\n\nO Estado Romano não será mais chamado de \"Império dos Gregos\" por pretensiosos invejosos do Ocidente, mas será reconhecido como o verdadeiro herdeiro do legado de Roma."
 roman_restoration.0001.desc.hellenics:0 "O Imperium Romanum ergue-se forte mais uma vez, restaurado em sua antiga glória e religião sob o meu governo iluminado.\n\nNovas Legiões marcharão sobre as províncias restantes que ainda negam a soberania deste novo Império e forjarão uma nova Pax Romana em tempos sombrios. Pelo Senado e pelo Povo de Roma!"
 roman_restoration.0001.desc.intro:0 "Amigos, romanos, compatriotas, emprestem-me seus ouvidos!\n\nApós a recuperação milagrosa do território perdido séculos atrás, o Império Romano renasceu! A Europa passou por tempos sombrios desde a invasão dos bárbaros às fronteiras imperiais, mas agora uma nova era brilhante despontou para toda a civilização."
 roman_restoration.0001.desc.other:0 "\n\nOnde inúmeros pretendentes gregos falharam, foi necessária apenas uma [scoped_emperor.GetCulture.GetName] para ter sucesso, restaurando o falido \"Império dos Gregos\"."
 roman_restoration.0001.t:0 "A Aurora de uma Nova Era"
 roman_restoration.0002.a:0 "Será verdade?"
 roman_restoration.0002.b:0 "Mas... e meu Império?"
 roman_restoration.0002.c:0 "O fim está próximo!"
 roman_restoration.0002.d:0 "Eu vou detê-los!"
 roman_restoration.0002.desc.christians:0 "\n\nNão se pode mais negar que eles são os verdadeiros sucessores de Roma e de seu glorioso legado. Uma nova era está sobre nós."
 roman_restoration.0002.desc.hellenics:0 "\n\nAinda mais surpreendente, este novo Império Romano rejeitou o cristianismo em favor dos deuses pagãos antigos! Se não forem detidos em breve, essa nova onda de paganismo poderá ameaçar a própria sobrevivência do cristianismo!"
 roman_restoration.0002.desc:0 "Os Bizantinos, anteriormente chamados de \"Império dos Gregos\" por muitos no Ocidente, de alguma forma conseguiram recuperar territórios perdidos o suficiente para declarar a restauração do Império Romano!"
 roman_restoration.0002.e:0 "Eu vejo..."
 roman_restoration.0002.t:0 "A Segunda Era de Roma"
 roman_restoration.0003.a:0 "Esto perpetua!"
 roman_restoration.0003.desc.greeks:0 "Que irônico que o Império, outrora difamado como um pretensioso bárbaro pelos bizantinos, seria elevado à glória eterna sob a liderança grega...\n\n"
 roman_restoration.0003.desc.other:0 ""
 roman_restoration.0003.desc:0 "O sonho de Carlos Magno foi realizado por meio das minhas ações valentes. O Sacro Império Romano ascendeu ao seu devido lugar como verdadeiro sucessor de Roma, reivindicando domínio sobre o Oriente e o Ocidente. \n\nEste é o início de uma nova era de paz e prosperidade para todos os [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]. As abençoadas Legiões deste Império espalharão a mensagem sagrada de Nosso Senhor por todos os cantos do mundo, até que uma verdadeira Igreja Universal seja estabelecida. Pelo [ROOT.Char.GetFaith.HighGodName|U] e pelo [scoped_emperor.GetTitleTierName] de Roma!"
 roman_restoration.0003.t:0 "Santo e Romano"
 roman_restoration.0004.a:0 "Será possível...?"
 roman_restoration.0004.b:0 "Eles ainda são pretensos!"
 roman_restoration.0004.desc.byzantines:0 "O impensável aconteceu! Os pretensos do Ocidente conseguiram abrir um caminho ensanguentado nas províncias orientais e reivindicar o coração de nosso outrora glorioso Império.\n\nTendo restaurado a maioria das províncias antigas sob seu governo, [scoped_emperor.GetTitledFirstName] declarou que o Império Romano foi restaurado sob sua liderança bárbara."
 roman_restoration.0004.desc.others:0 "Desde que Carlos Magno foi coroado pelo Papa Leão III, o Império dos Gregos olhou com desprezo para o que é referido como o pretendente no Ocidente. No entanto, [scoped_emperor.GetTitledFirstName] conseguiu o impossível: a restauração das fronteiras Orientais e Ocidentais dos tempos antigos.\n\nEste novo Império, forjado sob a sagrada luz de [scoped_emperor.GetFaith.HealthGodName], se mantém como o único verdadeiro Imperium Romanum, pronto para trazer ordem a um mundo sombrio."
 roman_restoration.0004.t:0 "Santo e Romano"
 roman_restoration.0005.a:0 "Salve César!"
 roman_restoration.0005.desc.holy:0 "Aclamado pelo Clero [ROOT.Char.GetFaith.GetAdjective] e pelo Exército, fui reconhecido como o governante legítimo do restaurado Império Romano.\n\nPela graça de [ROOT.Char.GetFaith.HighGodName], poderei governar com justiça e por muito tempo."
 roman_restoration.0005.desc.regular:0 "Aclamado pelo Senado e pelo Exército, fui reconhecido como o governante legítimo do restaurado Império Romano.\n\nNenhuma honra ou responsabilidade maior pode ser concedida a [Select_CString( ROOT.Char.IsFemale, 'uma única', 'um único' )] [ROOT.Char.GetWomanMan]. Devo garantir que esteja à altura das expectativas de meus súditos se desejo permanecer no poder por muito tempo."
 roman_restoration.0005.t:0 "Augusto"
 roman_restoration.0006.a:0 "Eu voltarei!"
 roman_restoration.0006.desc:0 "Com a perda de toda legitimidade, não posso mais reivindicar o título de Augusto. O Império agora pertence [Select_CString( new_holder.IsFemale, 'a', 'ao' )] [new_holder.GetTitledFirstName]."
 roman_restoration.0006.t:0 "Um Novo Imperador"
 roman_restoration.0010.a:0 "Viva o Império!"
 roman_restoration.0010.desc:0 "Toda a antiga província da Síria Palestina finalmente foi libertada das garras vis dos bárbaros e restaurada ao Imperium Romanum. Um grande triunfo será realizado em homenagem aos bravos heróis que realizaram essa façanha. Que seus nomes ecoem na eternidade!"
 roman_restoration.0010.t:0 "A Província da Síria Palestina"
 roman_restoration.0011.desc:0 "Os tempos sombrios acabaram para o povo do Egito, pois o domínio romano foi restaurado à província mais uma vez. A Terra dos Faraós serviu bem como celeiro do antigo império, e novamente se tornará um pilar vital na contínua prosperidade do glorioso Estado Romano."
 roman_restoration.0011.t:0 "A Província do Egito"
 roman_restoration.0012.desc:0 "Os cidadãos da Cirenaica podem se alegrar, pois a lei romana mais uma vez é aplicada nesta terra árida. Mais uma antiga província romana retornou ao seio do maior império que o mundo civilizado já viu. Que nunca mais sofra o toque cruel dos bárbaros."
 roman_restoration.0012.t:0 "A Província da Cirenaica"
 roman_restoration.0013.desc:0 "As águias douradas de Roma brilham mais uma vez sobre a antiga província romana da África, como fizeram tantos séculos atrás. As tropas imperiais marcham pela cidade de Cartago, a antiga inimiga de Roma, como prova definitiva de que a história realmente se repete."
 roman_restoration.0013.t:0 "A Província da África"
 roman_restoration.0014.desc:0 "A antiga província romana da Ilíria foi mais uma vez restaurada aos seus legítimos donos no ressurgente Imperium Romanum. Com as costas orientais do Adriático seguras, este importante terreno de recrutamento pode se mostrar vital em campanhas futuras para reconquistar as fronteiras adequadas de Roma no oeste."
 roman_restoration.0014.t:0 "A Província da Ilíria"
 roman_restoration.0015.desc:0 "Pela segunda vez desde a queda do Império Ocidental, a Itália foi libertada e restaurada ao adequado domínio romano — esperançosamente, desta vez de forma definitiva. A grandiosa cidade de Roma está agora sob meu controle, e até mesmo soldados endurecidos podem ser vistos chorando enquanto o estandarte imperial tremula na brisa da Coluna de Trajano."
 roman_restoration.0015.t:0 "A Província da Itália"
 roman_restoration.0016.desc:0 "A Gália, por muito tempo considerada perdida para o domínio romano, submeteu-se a Roma e foi incorporada novamente ao Império. A província mudou muito desde que César campanhou nesta terra há mais de mil anos, mas não mais sofrerá sob o domínio de reis arrogantes ou falsos imperadores."
 roman_restoration.0016.t:0 "A Província da Gália"
 roman_restoration.0017.desc:0 "O Império Romano agora se expandiu além das fronteiras que reivindicava mesmo sob o grande [GetScriptedCharacterByHistoryID( '145279' ).GetFirstName]. A Germânia, sempre o flagelo dos exércitos romanos, finalmente foi pacificada e incorporada ao Império. Agora, será governada pela verdadeira continuação do Estado Romano — não um falso império que se faz passar por tal."
 roman_restoration.0017.t:0 "A Província da Germânia"
 roman_restoration.0018.desc:0 "Cruelmente deixados à própria sorte quando as guarnições romanas abandonaram a província da Britânia no século V, os bretões agora podem se alegrar. Após sofrer séculos de escuridão, o domínio romano finalmente foi restaurado em sua pequena ilha, e eles podem considerar-se novamente súditos imperiais."
 roman_restoration.0018.t:0 "A Província da Britânia"
 roman_restoration.0019.desc:0 "O poder e a influência do Império Romano agora se estendem novamente até a antiga província da Hispânia. Esta terra sofreu muito com as constantes escaramuças de fronteira travadas por seus senhores muçulmanos e católicos briguentos, mas agora finalmente poderá conhecer a paz novamente, à medida que a Pax Romana se estabelece sobre a península."
 roman_restoration.0019.t:0 "A Província da Hispânia"
 roman_restoration.0020.desc:0 "O grande general Belisário reconquistou partes da Mauritânia dos bárbaros vândalos no século VI, mas tudo acabou sendo perdido para os árabes em sua incessante marcha pela África do Norte. Agora que este condado foi completamente restaurado ao controle romano após séculos de má administração, ele poderá florescer novamente."
 roman_restoration.0020.t:0 "A Província da Mauritânia"
 roman_restoration.0021.desc:0 "O imperador Trajano conquistou a Mesopotâmia do Império Parta e a organizou como uma província romana, mas ela foi abandonada por seu sucessor Adriano poucos anos depois. Agora, os rios Eufrates e Tigre estão mais uma vez sob a proteção romana, e desta vez podem permanecer lá."
 roman_restoration.0021.t:0 "A Província da Mesopotâmia"
 roman_restoration.0022.desc:0 "As fronteiras de Roma agora avançaram bem além das antigas ruínas do Muro de Adriano e do Muro de Antonino, para finalmente incluir toda a Caledônia. Esta terra dura e implacável é o lar de uma raça peculiar de pessoas, mas elas serão transformadas em cidadãos romanos produtivos."
 roman_restoration.0022.t:0 "A Província da Caledônia"
 roman_restoration.0023.desc:0 "A ilha da Hibernia é a mais recente adição aos domínios em expansão do Império Romano. Esta terra de colinas suavemente ondulantes e campos verdes nunca foi conquistada pelo antigo império, mas deve se tornar um feudo agradável para governar, desde que não se importe com a chuva ou os colonos nórdicos malcheirosos ao longo da costa."
 roman_restoration.0023.t:0 "A Província da Hibernia"
 roman_restoration.0024.desc.christian:0 "\n\nSinos de igreja em toda a Europa estão tocando para celebrar esta ocasião monumental, e homens e mulheres em Roma e Constantinopla estão chorando lágrimas de alegria. Pela humanidade, a nova Pax Romana deve perdurar, para que o mundo não mergulhe em mais uma era sombria de ignorância e barbárie privada da luz orientadora de Roma."
 roman_restoration.0024.desc.fallback:0 "\n\nInúmeras pessoas de todas as raças e credos por toda a Europa estão celebrando esta ocasião monumental, e homens e mulheres tanto em Roma quanto em Constantinopla estão chorando lágrimas de alegria. Pela humanidade, a nova Pax Romana deve perdurar, para que o mundo não mergulhe em mais uma era sombria de ignorância e barbárie privada da luz orientadora de Roma."
 roman_restoration.0024.desc.hellenic:0 "\n\nAo desprezar o peso do deus morto dos galileus e reabraçar os olímpicos, o Império de César e Augusto ressurgiu das cinzas. Pela humanidade, a nova Pax Romana deve perdurar, para que o mundo não mergulhe em mais uma era sombria de ignorância e barbárie privada da luz orientadora de Roma."
 roman_restoration.0024.desc.intro:0 "A história da gloriosa recuperação do Império Romano será contada ao longo dos séculos. Aqueles que tiveram a infelicidade de viver nos dias negros em que os bárbaros saquearam Roma à vontade ou os invasores árabes avançaram vindos do deserto não ousariam sonhar com este dia. Todas as antigas províncias foram recuperadas, e o Império agora se estende mais longe do que em quase mil anos."
 roman_restoration.0024.t:0 "Fronteiras Imperiais Restauradas"
 roman_restoration.0100.a:0 "A Igreja Universal foi restaurada!"
 roman_restoration.0100.desc.catholic:0 "\n\nA luta secular do Papado para afirmar sua primazia sobre a Pentarquia finalmente chegou ao fim. Com a reunificação dos assentos originais sob o governo católico, o clero ortodoxo foi forçado a se curvar à autoridade inegável do trono de São Pedro. \n\nOs poucos entre eles que ainda se apegam a seus ritos desatualizados e heréticos em breve serão incorporados à verdadeira Igreja Ecumênica, de uma forma ou de outra."
 roman_restoration.0100.desc.generic:0 "\n\nCom a Pentarquia firmemente sob o controle [mending_faith.GetAdjective], em uma reviravolta inesperada, tanto o Papa em Roma quanto o Patriarca de Constantinopla não podem mais negar a primazia de [mending_faith.GetName] sobre todos os outros ramos do cristianismo."
 roman_restoration.0100.desc.intro:0 "Finalmente, o Grande Cisma foi resolvido."
 roman_restoration.0100.desc.orthodox:0 "\n\nNunca mais os Bispos arrogantes de Roma reivindicarão uma primazia injusta sobre seus pares, ignorando ou desobedecendo abertamente os éditos canônicos. Com a reunificação da Pentarquia sob o domínio imperial ortodoxo, a fé católica agora tem pouco domínio sobre o povo europeu. \n\nÉ apenas uma questão de tempo até que os poucos que ainda se apegam a ritos desatualizados e heréticos sejam incorporados à verdadeira Igreja Ecumênica."
 roman_restoration.0100.t:0 "O Grande Cisma Resolvido"
 roman_restoration.0101.a:0 "Se é assim que o vento está soprando..."
 roman_restoration.0101.b:0 "Hereges! Todos eles!"
 roman_restoration.0101.desc.catholic:0 "\n\nApós a conquista de todos os assentos ecumênicos da Pentarquia original [Select_CString( scoped_emperor.IsFemale, 'pela', 'pelo' )] [scoped_emperor.GetTitledFirstName], a Santa Sé finalmente alcançou sua longa ambição de erradicar a Igreja Ortodoxa e se tornar o único ramo legítimo do cristianismo. Com o Patriarca forçado ao exílio e muitos teólogos ortodoxos proeminentes submetendo-se à autoridade do trono de São Pedro, o Ortodoxismo pode em breve se extinguir na obscuridade."
 roman_restoration.0101.desc.generic:0 "\n\nApós a conquista de todos os assentos ecumênicos da Pentarquia original [Select_CString( scoped_emperor.IsFemale, 'pela', 'pelo' )] [scoped_emperor.GetTitledFirstName], a Igreja [mending_faith.GetAdjective] se impôs como o único ramo legítimo do cristianismo aos olhos de muitos. Com o Papado e o Patriarcado Ecumênico arrancados de seus assentos ancestrais de poder, muitos seguidores ortodoxos e católicos estão se juntando à nova Igreja Universal."
 roman_restoration.0101.desc.intro:0 "O Grande Cisma que afligiu o cristianismo por tanto tempo finalmente chegou ao fim."
 roman_restoration.0101.desc.orthodox:0 "\n\nApós a conquista de todos os assentos ecumênicos da Pentarquia original [Select_CString( scoped_emperor.IsFemale, 'pela', 'pelo' )] [scoped_emperor.GetTitledFirstName], a Igreja Ortodoxa conseguiu forçar a maioria do mundo católico a reconhecer sua autoridade como o único ramo legítimo do cristianismo. A aristocracia corrupta do Vaticano foi forçada ao exílio, e seus apoiadores estão diminuindo a cada dia."
 roman_restoration.0102.a:0 "Notícias perturbadoras..."
 roman_restoration.0104.a:0 "Louvado seja Deus!"
 roman_restoration.0104.desc:0 "Com a cidade novamente sob controle romano, o Patriarcado de Antioquia foi devidamente restaurado como uma das sedes episcopais da Pentarquia na Igreja Ortodoxa Oriental. Foi originalmente fundado por São Pedro, considerado o primeiro Papa pela Igreja Católica Ocidental."
 roman_restoration.0104.t:0 "O Patriarcado de Antioquia"
 roman_restoration.0105.desc:0 "Com a cidade novamente sob controle romano, o Patriarcado de Jerusalém foi devidamente restaurado como uma das sedes episcopais da Pentarquia na Igreja Ortodoxa Oriental. Foi originalmente fundado por São Tiago, o Justo, que se tornou o líder da Igreja em Jerusalém logo após a morte de Jesus."
 roman_restoration.0105.t:0 "O Patriarcado de Jerusalém"
 roman_restoration.0106.desc:0 "Com a cidade novamente sob controle romano, o Patriarcado de Alexandria foi devidamente restaurado como uma das sedes episcopais da Pentarquia na Igreja Ortodoxa Oriental. Foi originalmente fundado por São Marcos, o Evangelista, que se tornou o primeiro patriarca de Alexandria."
 roman_restoration.0106.t:0 "O Patriarcado de Alexandria"
 roman_restoration.0107.desc:0 "Com a cidade novamente sob controle romano, o Patriarcado de Roma foi devidamente restaurado como uma das sedes episcopais da Pentarquia na Igreja Ortodoxa Oriental. Se todos os cinco patriarcados históricos forem devolvidos à Pentarquia, o Grande Cisma entre as igrejas Oriental e Ocidental poderá finalmente ser reparado."
 roman_restoration.0107.t:0 "O Patriarcado de Roma"
 roman_restoration.0120.a:0 "Fora com esses ídolos blasfemos!"
 roman_restoration.0120.desc:0 "Com a grande cidade de Constantinopla nas mãos dos iconoclastas, um novo Patriarca foi colocado no comando da Igreja Oriental. Com a ajuda de [new_pope.GetFaith.HighGodName], [new_pope.GetFirstName] se provará um líder mais virtuoso e considerado do que seus predecessores ecumênicos. \n\nEste novo Patriarcado certamente se oporá aos excessos, corrupção e idolatria de seu antecessor, e inaugurará uma nova e gloriosa era para todos os fiéis iconoclastas."
 roman_restoration.0120.t:0 "O Patriarcado Iconoclasta"
 roman_restoration.0121.a:0 "Bárbaros!"
 roman_restoration.0121.b:0 "Já era hora!"
 roman_restoration.0121.c:0 "Entendi..."
 roman_restoration.0121.desc.iconoclast:0 "Com a grande cidade de Constantinopla nas mãos dos iconoclastas, um novo Patriarca foi colocado no comando da Igreja Oriental [Select_CString( reformer.IsFemale, 'pela', 'pelo' )] [reformer.GetTitledFirstName]. Com a ajuda de [new_pope.GetFaith.HighGodName], [new_pope.GetFirstName] se provará um líder mais virtuoso e considerado do que seus predecessores ecumênicos. \n\nEste novo Patriarcado certamente se oporá aos excessos, corrupção e idolatria de seu antecessor, e inaugurará uma nova e gloriosa era para todos os fiéis iconoclastas."
 roman_restoration.0121.desc.orthodox:0 "Com a grande cidade de Constantinopla caindo nas mãos de hereges, [Select_CString( reformer.IsFemale, 'a', 'o' )] vil[Select_CString( reformer.IsFemale, 'ã', '' )] iconoclasta [reformer.GetTitledFirstName] nomeou um falso Patriarca para a Igreja Ecumênica, destituindo todos os prelados ortodoxos de seus cargos.\n\nSe esse tirano não for deposto em breve e sua blasfêmia retificada, este pode ser o começo do fim para a Igreja Ortodoxa."
 roman_restoration.0121.desc.other:0 "Com a grande cidade de Constantinopla nas mãos dos iconoclastas, um novo Patriarca foi colocado no comando da Igreja Oriental [Select_CString( reformer.IsFemale, 'pela', 'pelo' )] [reformer.GetTitledFirstName].\n\nE, com a maioria do clero ortodoxo mais antigo sendo destituído, preso ou forçado ao exílio, a fé ecumênica foi reduzida ao status de heresia."
 roman_restoration.0122.a:0 "Glória!"
 roman_restoration.0122.desc:0 "O infeliz exílio do Patriarcado Ecumênico finalmente chegou ao fim.\n\nA única Igreja verdadeira retornou a Constantinopla, pronta para liderar o mundo cristão com uma mão firme, porém gentil."
 roman_restoration.0122.t:0 "O Patriarcado Ecumênico"
 roman_restoration.0123.a:0 "Finalmente, a razão foi restaurada na Igreja!"
 roman_restoration.0123.b:0 "Ímpios idólatras, todos eles!"
 roman_restoration.0123.c:0 "Entendi..."
 roman_restoration.0123.desc.iconoclast:0 "Uma cabala de ímpios idólatras organizada [Select_CString( reformer.IsFemale, 'pela', 'pelo' )] [reformer.GetTitledFirstName] conseguiu tomar Constantinopla e restaurar o corrupto e herético Patriarcado antigo. Se eles não forem detidos em breve, o Iconoclasmo poderá entrar em declínio e cair no esquecimento!"
 roman_restoration.0123.desc.orthodox:0 "O infeliz exílio do Patriarcado Ecumênico finalmente chegou ao fim.\n\nGraças à liderança piedosa d[Select_CString( reformer.IsFemale, 'a', 'o' )] [reformer.GetTitledFirstName], a única Igreja verdadeira retornou a Constantinopla, pronta para liderar o mundo cristão com uma mão firme, porém gentil."
 roman_restoration.0123.desc.other:0 "O infeliz exílio do Patriarcado Ecumênico finalmente chegou ao fim.\n\nGraças à liderança piedosa d[Select_CString( reformer.IsFemale, 'a', 'o' )] [reformer.GetTitledFirstName], a Igreja Oriental retornou ao seu assento legítimo em Constantinopla."
 roman_restoration.0124.a:0 "A Santa Sé ressurgiu das cinzas!"
 roman_restoration.0124.desc:0 "A era de turbulência e desespero para o mundo católico chegou ao fim: com um novo Papa restaurado ao histórico assento de Roma, a única Igreja verdadeira finalmente pode se recuperar dos terríveis revezes sofridos recentemente.\n\nCom a ajuda de [new_pope.GetFaith.HighGodName], [new_pope.GetTitledFirstName] trará ordem e estabilidade ao clero católico, antes disperso por toda a Europa, e restabelecerá uma hierarquia rígida para a Igreja."
 roman_restoration.0124.t:0 "A Santa Sé"
 roman_restoration.0125.a:0 "Nossa Mãe Igreja está novamente inteira!"
 roman_restoration.0125.b:0 "Interessante..."
 roman_restoration.0125.desc.catholic:0 "Graças à abençoada intervenção d[Select_CString( reformer.IsFemale, 'a', 'o' )] [reformer.GetTitledFirstName], a era de turbulência e desespero para o mundo católico chegou ao fim: com um novo Papa restaurado ao histórico assento de Roma, a única Igreja verdadeira finalmente pode se recuperar dos terríveis revezes sofridos recentemente.\n\nCom a ajuda de [new_pope.GetFaith.HighGodName], [new_pope.GetTitledFirstName] trará ordem e estabilidade ao clero católico, antes disperso por toda a Europa, e restabelecerá uma hierarquia rígida para a Igreja."
 roman_restoration.0125.desc.other:0 "Após perder seu assento ancestral e a maioria de seus seguidores, a Igreja Católica foi considerada por muitos à beira do colapso. No entanto, graças à piedosa intervenção d[Select_CString( reformer.IsFemale, 'a', 'o' )] [reformer.GetTitledFirstName], um novo Papa reina em Roma mais uma vez.\n\nCom a Santa Sé finalmente restaurada, os católicos podem recuperar seu lugar como uma importante vertente cristã."
 roman_restoration.0130.a.a:0 "[scoped_destroyer.GetFaith.HighGodName] nos abençoou!"
 roman_restoration.0130.a.b:0 "Este é o momento de nosso ressurgimento!"
 roman_restoration.0130.a.c:0 "O deus deles morto não pôde protegê-los afinal."
 roman_restoration.0130.desc.fallback:0 "Após séculos sendo menosprezados e enganados por seus missionários, os seguidores de [scoped_destroyer.GetFaith.HighGodName] finalmente se vingaram dos seguidores do deus Cristo.\n\nO berço de sua fé foi conquistado com o favor de nossos deuses, suas igrejas foram saqueadas, seus sacerdotes privados de todo poder e dignidade. Graças à minha gloriosa invasão, livrei o mundo dessa religião covarde e vinguei a desonra trazida às nossas terras e ancestrais por meio de suas artimanhas."
 roman_restoration.0130.desc.hellenic:0 "A tirania dos galileus sobre a Europa finalmente chegou ao fim.\n\nPor séculos, esses cultistas glorificados tiveram liberdade para difamar e profanar os antigos monumentos de nossos divinos protetores, mas não mais! Ao restaurar o domínio [scoped_destroyer.GetFaith.GetAdjective] sobre Roma e a península italiana, esmagamos o coração da Igreja do deus carpinteiro."
 roman_restoration.0130.desc.muslim:0 "O domínio dos cristãos sobre Roma finalmente chegou ao fim.\n\nGraças aos esforços dedicados de muitos servos devotos de [scoped_destroyer.GetFaith.HighGodName], toda a Itália caiu sob o domínio [scoped_destroyer.GetFaith.GetAdjective]. Os fiéis trabalharam incansavelmente para eliminar todos os ícones blasfemos e levar à justiça o decadente clero que governava essas terras."
 roman_restoration.0130.desc.no_pope:0 "\n\nBispos [catholic.BishopNeuterPlural] desorganizados têm tentado individualmente reunir os [catholic.GetAdherentNamePluralNoTooltip] desmoralizados, mas sem um verdadeiro [catholic.ReligiousHeadName] para liderá-los, fica claro que os dias da autoridade papal chegaram ao fim."
 roman_restoration.0130.desc.pope.crucifixion:0 "\n\n[scoped_pope.GetFirstName], ainda se agarrando teimosamente ao título indesejado de Pontifex Maximus, foi crucificado entre as ruínas incendiadas do Vaticano. Assim termina a vergonhosa linhagem dos Pontífices Cristãos de Roma."
 roman_restoration.0130.desc.pope.exile:0 "\n\nO antigo Papa [scoped_pope.GetFullName] escapou do nosso alcance, fugindo para o exílio com um punhado de servos leais. O cargo que [scoped_pope.GetSheHe] outrora ocupava, contudo, não existe mais."
 roman_restoration.0130.desc.pope.sacrificed:0 "\n\nA catedral do Vaticano foi santificada e rededicada a [scoped_destroyer.GetFaith.HighGodName] usando o sangue d[Select_CString( scoped_pope.IsFemale, 'a', 'o' )] [scoped_pope.GetTitledFirstName] [scoped_pope.GetHerselfHimself], que foi sacrificado no próprio altar de onde [scoped_pope.GetSheHe] costumava pregar."
 roman_restoration.0130.desc.pope.submission:0 "\n\nDiante de nossa inegável supremacia religiosa, o ex-Papa [scoped_pope.GetFullName] até mesmo publicamente renunciou à fé [catholic.GetAdjectiveNoTooltip] e se converteu ao [scoped_destroyer.GetFaith.GetNameNoTooltip]!"
 roman_restoration.0130.t:0 "A Dissolução do Papado"
 roman_restoration.0131.a.a:0 "Já estava na hora de alguém fazer isso."
 roman_restoration.0131.a.b:0 "O fim está próximo!"
 roman_restoration.0131.a.c:0 "Entendi..."
 roman_restoration.0131.desc.christians:0 "A monstruosa campanha de terror d[Select_CString( scoped_destroyer.IsFemale, 'a', 'o' )] [scoped_destroyer.GetTitledFirstName] trouxe ruína e escuridão ao coração de Nossa Santa Mãe Igreja!\n\nO pagão vil despojou o Papado de todas as suas posses e dignidade, assassinou brutalmente inúmeros teólogos e não parará até que [scoped_destroyer.GetSheHe] tenha subjugado todo o Cristianismo. Com o Vaticano destruído e sua hierarquia em ruínas, a fé católica foi reduzida a um culto desorganizado."
 roman_restoration.0131.desc.faithful:0 "Graças à implacável campanha de conquista d[Select_CString( scoped_destroyer.IsFemale, 'a', 'o' )] [scoped_destroyer.GetTitledFirstName], toda a península italiana caiu sob o domínio [scoped_destroyer.GetFaith.GetAdjective].\n\nCom a ajuda de [scoped_destroyer.GetFaith.HighGodName], [scoped_destroyer.GetSheHe] caçou todas as cabalas de católicos ainda se reunindo na Itália e despojou todas as principais dioceses de riqueza e influência, desferindo assim um golpe severo na autoridade da falsa Igreja."
 roman_restoration.0131.desc.fallback:0 "A ousada campanha de conquista d[Select_CString( scoped_destroyer.IsFemale, 'a', 'o' )] [scoped_destroyer.GetTitledFirstName] trouxe ruína e escuridão ao coração da Igreja Católica!\n\nTendo já despojado o Papado da maioria de suas posses e dignidade, parece que [scoped_destroyer.GetSheHe] só ficará satisfeito quando todo o Cristianismo estiver subjugado. Com o Vaticano destruído e sua hierarquia em ruínas, a fé católica foi reduzida a um culto desorganizado."
 roman_restoration.0132.a:0 "Este ministério deve pegar a estrada."
 roman_restoration.0132.b:0 "Então que termine comigo."
 roman_restoration.0132.c.tt:0 "Você toma [translation_see.GetNameNoTierNoTooltip]. Seu antigo [clerical_region|E] em Roma está destruído."
 roman_restoration.0132.c:0 "O rebanho ainda pode ser pastoreado a partir de [translation_see.GetNameNoTierNoTooltip]."
 roman_restoration.0132.d:0 "Tudo recai sobre [alt_1.GetFirstNameNoTooltipRegnal]."
 roman_restoration.0132.desc:0 "[catholic.GetAdherentNamePluralNoTooltip] em toda parte acordam sem pastor. O Papado está dissolvido, meu clero espalhado, as relíquias mais sagradas levadas como despojo. Roma é agora o domínio do Anticristo [scoped_destroyer.GetTitledFirstName]."
 roman_restoration.0132.t:0 "O Anticristo Destrói Meu Trono"
 roman_restoration.0140.a:0 "O trabalho tudo conquista!"
 roman_restoration.0140.desc:0 "Desde a queda do Império Ocidental, a península italiana tem sido fragmentada entre cidades-estado rebeldes, bispos gananciosos e conquistadores bárbaros.\n\nNo entanto, sob o domínio de minha dinastia, a Itália deixou de lado as brigas mesquinhas e se tornou unificada mais uma vez, ressurgindo como uma potência dominante no Ocidente. Não seremos mais um prêmio a ser disputado entre francos e gregos, nem seremos brutalizados por piratas e pretensos bárbaros. A partir de hoje, retomamos nosso lugar como verdadeiros herdeiros do Império Romano!"
 roman_restoration.0140.t:0 "O Império Italiano"
 roman_restoration.0141.a:0 "Isso é lamentável."
 roman_restoration.0141.b:0 "Interessante..."
 roman_restoration.0141.desc:0 "Desde a queda do Império Ocidental, a península italiana tem sido fragmentada entre cidades-estado rebeldes, bispos gananciosos e conquistadores bárbaros, sua antiga glória desperdiçada em brigas mesquinhas.\n\nNo entanto, sob o domínio d[Select_CString( scoped_ruler.IsFemale, 'a', 'o' )] [scoped_ruler.GetTitledFirstNamePossessive], a Itália foi unificada mais uma vez, ressurgindo como uma potência dominante no Ocidente. Uma vez disputada entre francos e gregos, agora se tornou um Império por direito próprio, governando sobre o núcleo das antigas terras romanas."
 roman_restoration.0150.a:0 "Todos os caminhos levam a Roma."
 roman_restoration.0150.desc:0 "Agora está claro que nenhuma tentativa de restaurar o antigo Império quebrado seria bem-sucedida enquanto fosse perseguida por germânicos bárbaros ou gregos efeminados.\n\nÉ somente através dos sacrifícios do povo italiano que Roma retornou ao seu lugar legítimo como a Rainha das Cidades.\n\n"
 roman_restoration.0150.t:0 "De Roma a Roma"
 roman_restoration.0151.desc.byzantines:0 "O impensável aconteceu! As pequenas cidades-estados da Itália conseguiram se unir sob uma única bandeira e abriram um caminho ensanguentado em nossas Províncias Orientais na tentativa de restaurar o antigo Império.\n\nTendo restaurado a maioria das antigas províncias sob seu domínio, [scoped_emperor.GetTitledFirstName] declarou que o Império Romano foi restaurado sob sua liderança bárbara. Com a pouca legitimidade que nos resta, não podemos mais descartar essa reivindicação absurda."
 roman_restoration.0151.desc.others:0 "O ascendente Império Italiano conseguiu recuperar o suficiente das antigas províncias sob a liderança d[Select_CString( scoped_emperor.IsFemale, 'a', 'o' )] [scoped_emperor.GetTitledFirstName] para proclamar-se um Império Romano renascido.\n\nDesprezando tanto os pretensos do Norte quanto do Oriente, esta nova Nação busca restaurar suas fronteiras antigas contra todos os oponentes."
 roman_restoration.0151.t:0 "A Segunda Era de Roma"
 roman_restoration.0160.a:0 "Nossas legiões os esmagarão!"
 roman_restoration.0160.desc:0 "Por tempo demais toleramos os pretensos bárbaros no Norte se envolvendo com a dignidade imperial não merecida. Roma está firmemente sob o controle do verdadeiro Império, e a patética federação de senhores da guerra germânicos que uma vez buscou governar o Ocidente foi empurrada além do Reno, nas florestas selvagens a que pertence.\n\nÉ hora de ensinar a esses bárbaros sua lição final e despojá-los de seu falso Império de uma vez por todas."
 roman_restoration.0160.t:0 "O Pretendente"
 roman_restoration.0161.a:0 "Ainda há luta em nós!"
 roman_restoration.0161.desc:0 "[byz_emperor.GetTitledFirstName] me denunciou publicamente como um falso [hre_emperor.GetTitleTierName] e está pronto para desencadear o terrível poder do [byz_emperor.GetPrimaryTitle.GetName] contra meu povo.\n\nNão foi suficiente para sua laia nos afastar cada vez mais de nossas terras. Roma não ficará satisfeita até ter derrotado todos os pretendentes à sua glória."
 roman_restoration.0161.t:0 "A Acerto de Contas Romano"
 roman_restoration.0162.a:0 "E que assim seja!"
 roman_restoration.0162.desc:0 "Está feito. Nossa grande campanha destruiu o chamado Sacro Império Romano além de qualquer reparo. [hre_emperor.GetTitledFirstName] foi completamente humilhado e despojado de toda a dignidade imperial. [hre_emperor.GetSheHe|U] não tem mais a autoridade ou os recursos para unir as tribos bárbaras da Alemanha sob uma única bandeira."
 roman_restoration.0162.t:0 "Os Francos além do Reno"
 roman_restoration.0163.a:0 "Como isso pôde acontecer?"
 roman_restoration.0163.desc:0 "Os romanos ressurgentes deixaram o Império dos germânicos em frangalhos. Após essa derrota devastadora contra suas legiões, minha palavra tem pouco peso sobre meus antigos vassalos. Este é o fim do sonho de Carlos Magno."
 roman_restoration.0163.t:0 "Acerto de Contas Romano"
 roman_restoration.0164.a:0 "E quanto às minhas Águias?!"
 roman_restoration.0164.desc:0 "Além de todas as expectativas, [hre_emperor.GetTitledFirstName] foi capaz de montar uma defesa efetiva contra minhas legiões! Com a vitória [hre_emperor.GetHerHim], [hre_emperor.GetSheHe] deu nova legitimidade ao seu Império cambaleante e manchou meu nome além de qualquer reparo."
 roman_restoration.0164.t:0 "Os Francos Contra-Atacam"
 roman_restoration.0165.a:0 "E nunca mais volte!"
 roman_restoration.0165.desc:0 "O orgulho dos romanos foi sua ruína. Apesar de todas as bravatas [byz_emperor.GetHerHim], as legiões d[Select_CString( byz_emperor.IsFemale, 'a', 'o' )] [byz_emperor.GetTitledFirstNamePossessive] provaram-se incapazes de resistir aos meus fiéis $knight_culture_player_plural_no_tooltip_lowercase$. Graças à minha defesa inabalável, dei nova dignidade ao meu título."
 roman_restoration.0165.t:0 "Os Francos Contra-Atacam"
 roman_restoration.0170.a:0 "Nós forneceremos o incentivo necessário."
 roman_restoration.0170.desc:0 "Por tempo demais permitimos que os remanescentes fracos do Império de Justiniano se agarrem à dignidade de um título que há muito tempo mancharam através de uma interminável parada de reis incompetentes, mesquinhos e decadentes.\n\nTanto a Itália quanto a Grécia já estão sob nosso controle, enquanto eles foram reduzidos a nada mais do que um despotismo oriental em decadência, ganancioso e rancoroso demais para reconhecer que seu tempo já passou há muito tempo."
 roman_restoration.0170.t:0 "O Pretendente"
 roman_restoration.0171.a:0 "Somos os únicos herdeiros verdadeiros de Roma!"
 roman_restoration.0171.desc:0 "[hre_emperor.GetTitledFirstName] me denunciou publicamente como um falso [byz_emperor.GetTitleTierName] e está pronto para desencadear o terrível poder do [hre_emperor.GetPrimaryTitle.GetName] contra meu povo.\n\nNão foi suficiente para sua laia nos afastar cada vez mais de nossas terras. Roma não ficará satisfeita até ter derrotado todos os pretendentes à sua glória."
 roman_restoration.0171.t:0 "Acerto de Contas Romano"
 roman_restoration.0172.a:0 "Já estava na hora."
 roman_restoration.0172.desc:0 "Está feito. Os restos corrompidos do Império dos gregos foram varridos das costas da Grécia e da Ásia Menor. Com seus líderes e burocratas despojados de poder e seus exércitos enfraquecidos, [byz_emperor.GetTitledFirstName] não pode mais sustentar sua corte decadente de bajuladores e traidores, nem exercer sua autoridade além das muralhas de seu palácio."
 roman_restoration.0172.t:0 "Bizâncio Desmoronando"
 roman_restoration.0173.a:0 "Vocês monstros!"
 roman_restoration.0173.desc:0 "Nosso Império está em ruínas. Após sua campanha agressiva de humilhação e destruição, as hordas bárbaras d[Select_CString( hre_emperor.IsFemale, 'a', 'o' )] [hre_emperor.GetTitledFirstName] não deixaram nada além de ruínas e cidades-estado em guerra. O título que eu um dia detive já não possui mais qualquer dignidade Imperial."
 roman_restoration.0173.t:0 "Acerto de Contas Romano"
 roman_restoration.0174.a:0 "Como isso pôde acontecer?!"
 roman_restoration.0174.desc:0 "Além de todas as expectativas, [byz_emperor.GetTitledFirstName] foi capaz de montar uma defesa efetiva contra minhas forças! Com a vitória [byz_emperor.GetHerHim], [byz_emperor.GetSheHe] deu nova legitimidade ao seu Império cambaleante e manchou meu nome além de qualquer reparo."
 roman_restoration.0174.t:0 "Os Gregos Contra-Atacam"
 roman_restoration.0175.a:0 "Nunca houve dúvida sobre isso."
 roman_restoration.0175.desc:0 "Os estudiosos discutirão por muito tempo que tipo de loucura levou [hre_emperor.GetTitledFirstName] a guerrear contra os verdadeiros herdeiros de Roma. A patética tentativa desse pretendente de me despojar do meu direito divino de governar a Europa resultou apenas em uma derrota previsível e humilhante."
 roman_restoration.0175.t:0 "Os Gregos Contra-Atacam"
 roman_restoration.1200.a:0 "O trono imperial retorna ao seu lugar de direito!"
 roman_restoration.1200.b.rome:0 "Roma victa!"
 roman_restoration.1200.b:0 "A cidade de Constantino está segura mais uma vez."
 roman_restoration.1200.desc:0 "Finalmente, a grande cidade de Constantinopla, o farol brilhante do império oriental, retornou a nós!\n\nAs multidões adoradoras enchem a [Glossary('Mese', 'MESE_GLOSS' )] enfeitada por bandeiras, desde os portões de Teodósio até o Grande Palácio, e seus gritos, saudando o retorno [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip], podem ser ouvidos até mesmo do outro lado do Bósforo.\n\nSéculos a partir de agora, será lembrado que eu, [ROOT.Char.GetFirstNameRegnal], trouxe de volta esta joia romana mais preciosa ao seio de seu império."
 roman_restoration.1200.t:0 "Cidade do Desejo do Mundo"
 roman_restoration.1204.a:0 "Eu estava apenas cuidando dela para você!"
 roman_restoration.1204.b:0 "Espero que seu traseiro choramingão fique cheio de lascas no Trono."
 roman_restoration.1204.desc_vassal:0 "Eu te arranquei da sujeira, e posso te jogar de volta lá! Você não achou mesmo que #EMP Constantinopla#!, o último pilar da erudição nesta terra desprezível, poderia ser sua! Nem mesmo seu menor dedo do pé é digno de pisar em suas brilhantes ruas! Devolva-a, ou então o Chifre de Ouro será seu poço de afogamento — Eu mesmo te lançarei lá, se for necessário."
 roman_restoration.1204.t:0 "[Select_CString( ROOT.Char.IsFemale, 'Sua', 'Seu' )] [ROOT.Char.Custom('GirlBoy')] Miserável,"
