l_spanish:
 prison_notification.0001.a:0 "Espero que isso não dure muito."
 prison_notification.0001.desc:0 "Fui capturado e detido contra minha vontade [Select_CString( imprisoner.IsFemale, 'pela', 'pelo' )] [imprisoner.GetTitledFirstName].\n\nNão estou mais livre para voltar para minha [ROOT.Char.Custom('GetCourt')], ou viajar como desejar."
 prison_notification.0001.t:0 "Aprisionado!"
 prison_notification.0002.a:0 "O que pode ser feito por [prisoner.GetSheHe]?"
 prison_notification.0002.desc:0 "[prisoner.GetTitledFirstName], [Select_CString( prisoner.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('prisoner'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))], está agora detid[Select_CString( prisoner.IsFemale, 'a', 'o' )] contra a vontade [Select_CString( imprisoner.IsFemale, 'pela', 'pelo' )] [imprisoner.GetTitledFirstName]."
 prison_notification.0002.t:0 "Aprisionado!"
 prison_notification.0003.message:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))|U] Aprisionad[Select_CString( prisoner.IsFemale, 'a', 'o' )]!"
 prison_notification.1001.a.tt:0 "Enquanto estiver nas masmorras, vou acumular [stress|E] lentamente, até níveis perigosos!"
 prison_notification.1001.a:0 "[actor.GetSheHe|U] é pior que os ratos que rastejam aqui embaixo!"
 prison_notification.1001.desc:0 "[actor.GetTitledFirstName] me jogou nas masmorras! Vou apodrecer aqui, nos túneis úmidos da sua [actor.Custom('FortifiedBuilding')]?"
 prison_notification.1001.t:0 "Fora da Luz"
 prison_notification.1002.a.tt:0 "Prisão Domiciliar não aumenta o ganho de [stress|E]."
 prison_notification.1002.a:0 "Agradeço pelas misericórdias que posso encontrar."
 prison_notification.1002.desc:0 "[actor.GetTitledFirstName] achou por bem me libertar do cativeiro em sua masmorra, mas apenas o suficiente para me manter em prisão domiciliar."
 prison_notification.1002.t:0 "Ar Mais Fresco"
 prison_notification.2001.a:0 "Pensei que nunca mais veria minhas terras novamente."
 prison_notification.2001.desc:0 "Não estou mais sob o poder d[Select_CString( prisoner.IsFemale, 'a', 'o' )] [imprisoner.GetTitledFirstName] contra minha vontade e estou livre para voltar para casa ou para qualquer outro lugar que desejar."
 prison_notification.2001.t:0 "Livre Novamente"
 prison_notification.2002.a:0 "O aprisionamento é uma crueldade."
 prison_notification.2002.desc:0 "[Select_CString( prisoner.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('prisoner'))], [prisoner.GetTitledFirstName], foi libertado de seu cativeiro pelas mãos d[Select_CString( imprisoner.IsFemale, 'a', 'o' )] [imprisoner.GetTitledFirstName] e está livre mais uma vez!"
 prison_notification.2002.t:0 "Livre Novamente"
 prison_notification.2003.message:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))|U] Em Liberdade!"
