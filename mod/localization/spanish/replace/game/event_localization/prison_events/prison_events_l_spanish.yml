l_spanish:
 prison.1001.a:0 "Eu vou te contar tudo, eu juro!"
 prison.1001.anothers_secret.desc:0 "\"Você sabe algo sobre [reveal_secret_owner.Custom2('MyCharacterIntroductionNoComma' SCOPE.sC('actor'))],\" diz [actor.GetTitledFirstName]. \"Me conte tudo, ou então...\""
 prison.1001.b:0 "..."
 prison.1001.my_secret.desc:0 "\"Você está escondendo algo, eu consigo perceber,\" diz [actor.GetTitledFirstName]. \"Me diga a verdade, ou então...\""
 prison.1001.poetry.desc:0 "[actor.GetTitledFirstName] retira um longo, longo, #EMP longo#! pergaminho escondido embaixo do braço.\n\n\"Espero que não se importe se eu recitar alguns volumes dos meus... #EMP melhores#! poemas.\""
 prison.1001.rack.desc:0 "[actor.GetTitledFirstName] me prende ao instrumento de tortura, [actor.GetHerselfHimself], um sorriso satisfeito nos lábios. \"Eu confio que você já ouviu os outros. Os gritos, o som de ossos e tendões se quebrando."
 prison.1001.rats.desc:0 "\"Esses ratos podem parecer dóceis,\" [actor.GetTitledFirstName] diz, apontando para um balde que emite sons de roedores. \"Mas se eles sentirem cheiro de fogo, vão roer alegremente #emp qualquer coisa#! para escapar."
 prison.1001.start.desc:0 "Meu devaneio é abruptamente interrompido quando a porta da cela é arremessada aberta. A silhueta do guarda é familiar, mas [Select_CString( actor.IsFemale, 'a', 'o' )] [actor.GetWomanMan] atrás dele... Oh. Oh não.\n\n"
 prison.1001.t:0 "Verdade ou Tormento"
 prison.1001.whip.desc:0 "[actor.GetTitledFirstName] gira o chicote na sua mão. \"Ah, o chicote parece inofensivo, mas pode separar carne de osso tão bem quanto qualquer faca."
 prison.1002.a:0 "Intrigante. Leve-[Select_CString( recipient.IsFemale, 'a', 'o' )] de volta para a cela."
 prison.1002.anothers_secret.desc:0 "\n\n\"Não, não, eu... Eu tenho informações! [reveal_secret_owner.GetTitledFirstName] [secret_to_reveal.Custom('SecretDescriptionThirdPerson')]! Eu vou te contar tudo!\""
 prison.1002.b:0 "Eu ainda não terminei com você #emp completamente#!..."
 prison.1002.my_secret.desc:0 "\n\n\"Por favor, não! #EMP Por favor!#! Eu vou te contar qualquer coisa que você queira saber! Eu... Eu [secret_to_reveal.Custom('SecretDescriptionFirstPerson')]!\""
 prison.1002.poetry.desc:0 "Quando alguém pode torcer palavras para prazer assim como eu, torcê-las para causar dano é algo simples.\n\nTirando o longo volume de poesia de debaixo do meu braço, eu o desenrolo, deixando o pergaminho bater no chão e rolar suavemente para trás, para fora da porta."
 prison.1002.rack.desc:0 "Por que complicar as coisas? Nada como a boa e velha tortura no instrumento de esticar. Quando o carcereiro traz [Select_CString( recipient.IsFemale, 'a', 'o' )] [recipient.GetTitledFirstName] para a sala, os seus olhos se fixam imediatamente na grande estrutura de madeira."
 prison.1002.rats.desc:0 "Os ratos no balde podem parecer tímidos no início, mas eles vão roer alegremente o peito de um[Select_CString( recipient.IsFemale, 'a', '' )] [recipient.GetWomanMan] assim que houver um pouco de calor. Enquanto explico o conceito [Select_CString( recipient.IsFemale, 'a', 'ao' )] [recipient.GetTitledFirstName], sua determinação se dissipa diante dos meus olhos."
 prison.1002.whip.desc:0 "Oh, o doce beijo do chicote! Pode parecer inofensivo, mas pode separar carne de osso tão bem quanto qualquer faca. Julgando pela expressão no rosto d[Select_CString( recipient.IsFemale, 'a', 'o' )] [recipient.GetTitledFirstName], [recipient.GetSheHe] sabe disso muito bem."
 prison.1003.a:0 "Ah... Eu poderia ouvir os seus gritos por horas."
 prison.1003.b:0 "Era necessário."
 prison.1003.poetry.desc:0 "$prison.1002.poetry.desc$\n\nEntão, começo minha leitura."
 prison.1003.rack.desc:0 "Por que complicar as coisas? Nada se compara ao bom e velho instrumento de tortura. O som quando ossos e tendões se quebram é bastante inesquecível. Mas não tão inesquecível quanto a dor que [Select_CString( recipient.IsFemale, 'a', 'o' )] [recipient.GetTitledFirstName] logo irá sentir..."
 prison.1003.rats.desc:0 "\"Esses ratos podem parecer tímidos,\" digo enquanto amarro o balde ao peito exposto d[Select_CString( recipient.IsFemale, 'a', 'o' )] [recipient.GetFirstNamePossessive]. \"Mas quando fica quente lá dentro, eles fazem de tudo para escapar. Felizmente para eles, os dentes deles são #emp muito#! afiados.\" [recipient.GetSheHe|U] implora por misericórdia enquanto eu me aproximo das brasas incandescentes."
 prison.1003.t:0 "Tortura"
 prison.1003.whip.desc:0 "Oh, o doce beijo do chicote! Pode parecer inofensivo, mas pode separar carne de osso tão bem quanto qualquer faca — uma verdade que [Select_CString( recipient.IsFemale, 'a', 'o' )] [recipient.GetTitledFirstName] logo irá experimentar. [recipient.GetSheHe|U] vai dormir de bruços por um bom tempo..."
 prison.1010.a:0 "Por favor, não, eu...! #emp Aaaaaaaah!#!"
 prison.1010.poetry.desc:0 "$prison.1001.poetry.desc$\n\nEntão [actor.GetSheHe] começa."
 prison.1010.rack.desc:0 "[actor.GetTitledFirstName] me prende ao instrumento de tortura, [actor.GetHerselfHimself], um sorriso satisfeito nos lábios. Eu ouvi os gritos, o som de ossos e tendões se #emp quebrando#!... Eu imploro por misericórdia, mas o sorriso d[Select_CString( actor.IsFemale, 'a', 'o' )] [actor.GetFirstNamePossessiveNoTooltip] só fica mais largo."
 prison.1010.rats.desc:0 "\"Esses ratos podem parecer tímidos,\" diz [actor.GetTitledFirstName] enquanto [actor.GetSheHe] prende o balde em meu peito exposto. \"Mas uma vez que fica quente lá dentro, eles farão de tudo para escapar. Felizmente para eles, seus dentes são #emp muito#! afiados.\""
 prison.1010.toast_puppeteer:0 "[puppet_or_actor.GetShortUIName] torturou [recipient.GetShortUIName], mas não encontrou segredos"
 prison.1010.whip.desc:0 "[actor.GetTitledFirstName] gira o chicote em sua mão. \"Ah, o chicote parece inofensivo, mas pode separar carne de ossos tão bem quanto qualquer faca. Deixe-me demonstrar...\""
 prison.1020.a:0 "Oh, sim, isso #emp vai#! doer."
 prison.1020.b:0 "Eu tenho meus motivos."
 prison.1020.child.desc:0 "\"Isso fará tudo ficar melhor\", diz [Select_CString( physician.IsFemale, 'a médica', 'o médico' )] enquanto [physician.GetSheHe] oferece [Select_CString( recipient.IsFemale, 'a', 'o' )] [recipient.GetTitledFirstName] a poção sedativa. A sua mãozinha está tremendo, mas [recipient.GetSheHe] bebe mesmo assim.\n\nQuando [Select_CString( recipient.IsFemale, 'a', 'o' )] [recipient.Custom('GirlBoy')] adormece, [Select_CString( physician.IsFemale, 'a médica', 'o médico' )] me olha demoradamente. \"Você tem certeza disso, [Select_CString( actor.IsFemale, 'minha', 'meu' )] [actor.GetLadyLord]?\""
 prison.1020.compassionate.desc:0 "\"Isso pode parecer bárbaro\", digo enquanto [Select_CString( physician.IsFemale, 'a médica', 'o médico' )] prepara suas ferramentas, \"mas é pela estabilidade do reino. Acredite em mim — não sinto prazer em seu sofrimento.\""
 prison.1020.compassionate.landless.desc:0 "Isto pode parecer bárbaro,\" eu digo enquanto o médico prepara suas ferramentas, \"mas é para o melhor. Confie em mim — não sinto prazer no seu sofrimento.\""
 prison.1020.cruel.desc:0 "\"Ah, [recipient.GetFirstNameNoTooltip],\" suspiro teatralmente. \"Você e eu nunca concordamos completamente. Mas pelo lado positivo, finalmente decidi como corrigir a situação.\""
 prison.1020.start.desc:0 "O carcereiro arrasta [Select_CString( recipient.IsFemale, 'a', 'o' )] [recipient.GetTitledFirstName] em pânico para a sala. \"Por favor! Farei qualquer coisa, qualquer coisa que você quiser!\" Os seus protestos são interrompidas quando o carcereiro amordaça [recipient.GetSheHe] e a amarra na mesa.\n\n"
 prison.1020.t:0 "Cegado"
 prison.1020.toast_puppeteer:0 "[puppet_or_actor.GetShortUIName] cegou [recipient.GetShortUIName]"
 prison.1021.a:0 "Meus... meus olhos? Me deixem ir! #emp Nããão!#!"
 prison.1021.b:0 "Eu... eu me sinto estranho..."
 prison.1021.child.desc:0 "\"Isso fará tudo parecer melhor\", diz o médico enquanto [physician.GetSheHe] me oferece uma pequena garrafa de vidro. Este é um lugar ruim, com pessoas ruins, mas os seus olhos... eles são gentis. Com uma mão trêmula, eu levo a garrafa aos meus lábios."
 prison.1021.compassionate.desc:0 "\"[recipient.GetFirstNmeNoTooltip], quero que você saiba que não sinto prazer com isso. Sou obrigado a cegá-lo. Pela estabilidade do reino.\""
 prison.1021.cruel.desc:0 "O olhar satisfeito no seu rosto me arrepia.\n\n\"Não se preocupe. Não vim por sua cabeça — seus olhos servirão perfeitamente.\""
 prison.1021.landless_start.desc:0 "Estou quietamente contemplando meu destino quando o carcereiro de repente entra e me arrasta para fora da minha cela. De repente, estou cara a cara com [Select_CString( actor.IsFemale, 'a', 'o' )] [actor.GetTitledFirstName].\n\n"
 prison.1021.start.desc:0 "Estou silenciosamente contemplando meu destino quando o carcereiro de repente arromba a porta e me arrasta para fora da cela. Lá, no corredor sombrio, [actor.GetTitledFirstName] espera.\n\n"
 prison.1025.cruel.desc:0 "\"Ah, [recipient.GetFirstNameNoTooltip],\" suspiro teatralmente. \"Não se preocupe. Não estou aqui para levar sua cabeça — ou qualquer outra coisa de valor. Sua virilidade será perfeita.\""
 prison.1025.t:0 "Castrado"
 prison.1025.toast_puppeteer:0 "[puppet_or_actor.GetShortUIName] castrou [recipient.GetShortUIName]"
 prison.1026.a:0 "O quê...? Me deixem ir! #emp Nããão!#!"
 prison.1026.compassionate.desc:0 "\"[recipient.GetFirstNameNoTooltip], quero que você saiba que não sinto prazer com isso. Sou obrigado a castrá-lo. Pela estabilidade do reino.\""
 prison.1026.cruel.desc:0 "O olhar satisfeito no seu rosto me arrepia.\n\n\"Não se preocupe. Não vim por sua cabeça — ou qualquer outra coisa de valor. Sua virilidade será perfeita.\""
 prison.1030.cruel.desc:0 "\"Bem, [recipient.GetFirstNameNoTooltip],\" suspiro dramaticamente. \"Parece que chegou a hora do exterior da sua morada mortal refletir a feiura interior.\""
 prison.1030.t:0 "Desfigurado"
 prison.1030.toast_puppeteer:0 "[puppet_or_actor.GetShortUIName] desfigurou [recipient.GetShortUIName]"
 prison.1031.a:0 "Meu... meu nariz? Me deixe ir! #EMP Nãooo!#!"
 prison.1031.cruel.desc:0 "A expressão satisfeita no rosto [actor.GetHerHim] faz um arrepio subir pela minha espinha.\n\n\"Não se preocupe. Não vim por sua #EMP inteira#! cabeça — apenas uma parte dela já serve...\""
 prison.1041.a:0 "Meus... meus membros? Não, você não pode, #EMP você não pode!#!"
 prison.1041.compassionate.desc:0 "\"[recipient.GetFirstName], quero que saiba que não sinto prazer nisso. Sou forçado a mutilá-lo. Pela estabilidade do reino.\""
 prison.1041.cruel.desc:0 "\"Algo que sempre admirei em você, [recipient.GetFirstName]\", eu sorrio de canto, \"é a sua capacidade de tirar o máximo de circunstâncias adversas. Você sempre parece fazer mais com menos — até alguns quilos a menos...\""
 prison.1041.t:0 "Mutilado"
 prison.1041.toast_puppeteer:0 "[puppet_or_actor.GetShortUIName] mutilou [recipient.GetShortUIName]"
 prison.1042.cruel.desc:0 "A expressão satisfeita no rosto [actor.GetHerHim] faz um arrepio subir pela minha espinha.\n\n\"Algo que sempre admirei em você, [recipient.GetFirstName]\", [actor.GetSheHe] sorri, \"é a sua capacidade de tirar o máximo de circunstâncias adversas. Você sempre parece fazer mais com menos — até alguns quilos a menos...\""
 prison.9001.a:0 "Estou livre!"
 prison.9001.desc_1:0 "Passei muitos dias planejando minha fuga, pensando na melhor estratégia e rota de escape. Mas tudo isso se torna em nada quando um dia o guarda simplesmente esquece de trancar a cela, cambaleando para longe sem olhar para trás."
 prison.9001.desc_2:0 "Uma palavra gentil aqui, um elogio sincero ali – em breve, o guarda me vê com uma familiaridade calorosa em vez da suspeita inicial que [dummy_gender.GetSheHe] abrigava. Quando peço um pouco de ar fresco, [dummy_gender.GetSheHe] nem mesmo questiona, e eu deixo [dummy_gender.GetSheHe] de bruços em uma vala."
 prison.9001.desc_3:0 "Quando a escuridão cai, eu me afasto lentamente da minha cela, gemendo com o rangido."
 prison.9001.desc_3_house_arrest:0 "Quando a escuridão cai, eu abro lentamente minha porta, gemendo com o rangido."
 prison.9001.desc_3_opening:0 "Um momento de distração, foi tudo que precisei para pegar o molho de chaves do cinto do guarda e escondê-lo atrás das minhas costas."
 prison.9001.desc_4:0 "Eu examino cada centímetro da cela. Inspeciono cada dobradiça, sinto cada barra e investigo cada pedra. Quando a escuridão cai novamente, finalmente encontro o que estava procurando – uma pedra solta! É fácil alargar o buraco e transformá-lo em um túnel depois disso."
 prison.9001.desc_5:0 "Eu percorro os corredores, cada porta tão familiar quanto um velho amigo, e espero o momento certo. Eu sei quem vai aonde e em que horário. Conheço quem chama por servos específicos e sei a rota mais rápida para sair do [imprisoner.Custom('ResidenceBuilding')]. Quando a escuridão cai, simplesmente aguardo o momento perfeito e escapo como uma sombra."
 prison.9001.desc_6:0 "Espero até que a escuridão caia e, assim que tenho certeza de que não há ninguém por perto, seguro uma barra com cada mão e #EMP dobro#!. O suor escorre nos meus olhos, e minha respiração ofegante ecoa na escuridão, mas logo tenho um buraco grande o suficiente para passar."
 prison.9001.desc_7:0 "Assim que o guarda sai, me lanço sobre a fechadura. Ela é velha e enferrujada, e tudo que tenho é um pequeno prego que encontrei no canto, mas isso não vai me deter. Um leve giro, um empurrãozinho, e – #EMP pronto!#!"
 prison.9001.desc_8:0 "Sorrio enquanto o guarda tenta conter um bocejo. Mantive a discussão por horas, e mergulho no tópico de [ROOT.Char.Custom('subject_of_interest')] sem descanso. Logo, [dummy_gender.GetSheHe] está balançando a cabeça em sua cadeira, e então é fácil pegar as chaves de [dummy_gender.GetSheHe]."
 prison.9001.desc_9:0 "Após muitos dias de olhares astutos, gestos insinuantes e convites, finalmente colho os frutos, e quando o guarda se aproxima com uma das mãos já desatando os cordões da [dummy_gender.Custom('GetUpperClothingArticle')] de [dummy_gender.GetSheHe], sorrio. É algo indolor desmaiar nos êxtases do prazer, e tomo cuidado para não causar nenhum dano desnecessário."
 prison.9001.desc_ending_1:0 "\n\nConforme desapareço nas [imprisoner.Custom('TerrainType')] ao redor da [imprisoner.Custom('ResidenceBuilding')] d[Select_CString( imprisoner.IsFemale, 'a', 'o' )] [imprisoner.GetTitledFirstNamePossessive], finalmente me atrevo a ter esperança."
 prison.9001.desc_ending_2:0 "\n\nÀ medida que desapareço na noite, quando estou longe de tudo, inclino a cabeça para trás e dou risada."
 prison.9001.t:0 "Liberdade!"
 prison.9002.a:0 "Estamos livres, [ROOT.Char.Custom('prison_pet')]!"
 prison.9002.desc_cockroach:0 "– Solto minha barata, e quando ela se esgueira sob os pés do guarda, [dummy_gender.GetSheHe] dá um solavanco violento o suficiente para bater sua cabeça na parede."
 prison.9002.desc_end:0 ", e logo eu e meu confiável [ROOT.Char.Custom('prison_pet')] estamos desaparecendo nas [imprisoner.Custom('TerrainType')] ao redor da [imprisoner.Custom('ResidenceBuilding')] d[Select_CString( imprisoner.IsFemale, 'a', 'o' )] [imprisoner.GetTitledFirstNamePossessive]."
 prison.9002.desc_opening:0 "Tudo o que eu preciso é um momento de atenção enfraquecida"
 prison.9002.desc_rat:0 "– Solto meu rato, que silenciosamente faz seu caminho pelo chão, sobe no banquinho em que o guarda está descansando e vai direto para as chaves."
 prison.9002.desc_spoon:0 "e enfio minha colher na fechadura. Depois de muitos movimentos e torções, a fechadura cede com um audível #EMP estalo#!"
 prison.9002.desc_stone:0 "– Me aproximo sorrateiramente por trás do guarda e #EMP golpeio#! minha pedra na parte de trás do seu capacete. Enquanto o guarda tomba no chão, eu procuro rapidamente as chaves em [dummy_gender.GetSheHe]."
 prison.9003.a:0 "Estamos livres!"
 prison.9003.desc:0 "Assim que as costas dos guardas d[Select_CString( imprisoner.IsFemale, 'a', 'o' )] [imprisoner.GetTitledFirstName] e [Select_CString( prison_friend.IsFemale, 'minha companheira', 'meu companheiro' )] de prisão, [prison_friend.GetTitledFirstName], se voltam para nós, atacamos.\n\nOs muitos dias de prisão me deixaram fraco, e assim que o guarda desfere um soco com punhos protegidos de ferro em meu estômago, rapidamente me vejo dominado e imobilizado. O guarda se prepara para o golpe final, mas vejo [Select_CString( prison_friend.IsFemale, 'a', 'o' )] [prison_friend.GetTitledFirstNameNoTooltip] se aproximando, segurando a faca do próprio guarda - logo estamos em movimento novamente.\n\nConforme saímos em direção à noite, apoiando-nos um no outro, rimos."
 prison.9499.a:0 "Maldito seja você, [escapee.GetFirstNameNoTooltip]!"
 prison.9499.desc_dungeon:0 "[Select_CString( escapee.IsFemale, 'Minha prisioneira', 'Meu prisioneiro' )], [escapee.GetTitledFirstName], escapou!"
 prison.9499.desc_ending:0 "\n\nOs guardas não têm nada a dizer em sua defesa, mas o estrago já está feito mesmo assim."
 prison.9499.desc_house_arrest:0 "[Select_CString( escapee.IsFemale, 'Minha prisioneira', 'Meu prisioneiro' )], [escapee.GetTitledFirstName], escapou da sua prisão!"
 prison.9499.t:0 "Escapado!"
 prison.9501.a:0 "Eu vou apodrecer aqui..."
 prison.9501.desc:0 "Enquanto o guarda está momentaneamente distraído, estendo a mão em direção ao chaveiro pendurado em seu cinto, mas uma mão firme me impede no meio do caminho.\n\n\"Oh não não. Não há escapatória aqui, #EMP [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip]#!.\" O guarda olha com desprezo para mim e ri.\n\n\"Achou que a comida ruim que você estava recebendo era ruim? Espere só um pouco.\""
 prison.9501.t:0 "Correntes Inquebráveis"
 prison.9502.a:0 "Não!! Meu [ROOT.Char.Custom('prison_pet')]!"
 prison.9502.desc_cockroach:0 "Ele se esforça para encontrar apoio, mas o movimento deve ter alertado o guarda, pois sua mão se ergue e ele esmaga impiedosamente minha amada barata no chão, com um sorriso de nojo."
 prison.9502.desc_opening:0 "Quando o guarda se vira, rapidamente pego meu [ROOT.Char.Custom('prison_pet')] e atiro na cabeça [dummy_gender.GetHerHim].\n\n"
 prison.9502.desc_rat:0 "Ele se agita, tentando encontrar apoio, mas o guarda rapidamente o pega e o joga no chão.\n\nMeus gritos de protesto quase são abafados pelo grito agonizado enquanto o guarda impiedosamente pisa com o calcanhar [dummy_gender.GetHerHim]."
 prison.9502.desc_spoon:0 "Ela quica no capacete do guarda, e [dummy_gender.GetSheHe] mal parece notar.\n\nVirando-se e vendo a colher fora de lugar, [dummy_gender.GetSheHe] a pega e enfia no próprio cinto."
 prison.9502.desc_stone:0 "Ele quica pesadamente no capacete do guarda, mas [dummy_gender.GetSheHe] apenas se vira com as sobrancelhas levantadas, surpreso.\n\nVendo a pedra, [dummy_gender.GetSheHe] a joga longe com um sorriso de desdém."
 prison.9502.t:0 "Meu Bravo [ROOT.Char.Custom('prison_pet')|U]"
 prison.9503.a:0 "Bem, pelo menos [prison_friend.GetSheHe] conseguiu escapar..."
 prison.9503.b:0 "[Select_CString( aprison_friend.IsFemale, 'A', 'O' )] [prison_friend.Custom2('InsultNoun', ROOT.Char)] [prison_friend.Custom2('InsultAdjective', ROOT.Char)] me traiu!"
 prison.9503.desc:0 "M[Select_CString( prison_friend.IsFemale, 'inha', 'eu' )] companheir[Select_CString( prison_friend.IsFemale, 'a', 'o' )] de cela [prison_friend.GetTitledFirstName] e eu passamos muitas noites planejando nossa fuga.\n\nEnquanto eu faço barulho, [prison_friend.GetSheHe] fica pront[Select_CString( prison_friend.IsFemale, 'a', 'o' )] junto à porta. O guarda abre a porta, e eu sorrio, agora [Select_CString( prison_friend.IsFemale, 'a', 'o' )] [prison_friend.GetFirstNameNoTooltip] vai atacar por trás e– e a porta fecha atrás do guarda. [prison_friend.GetTitledFirstNameNoTooltip] desaparece na noite, sem ser desafiado, enquanto todos os guardas se voltam contra mim."
 prison.9503.t:0 "Traição"
 prison.9504.a:0 "Maldito seja você, [prison_rival.GetFirstNameNoTooltip]!"
 prison.9504.desc:0 "Passei muitas horas planejando minha fuga, e enquanto percorro um corredor escuro no meio da noite, não consigo deixar de sorrir. Isso pode dar certo! O guarda está neutralizado, o portão–\n\n\"[ROOT.Char.GetFirstNameNoTooltip] está escapando! Guardas! #EMP Guardas!#!\" A voz irritante [Select_CString( prison_rival.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prison_rival'))], [prison_rival.GetTitledFirstName] quebra o silêncio, e logo estou cercado por guardas armados e furiosos."
 prison.9504.t:0 "Meu Companheiro de Cela"
 prison.9505.a:0 "Eu estou... Eu ainda estou vivo...!"
 prison.9505.camp:0 "\n\nLogo descubro, no entanto, que estou no centro de um labirinto de tendas, repleto de braseiros, soldados entediados e perigos de tropeço. Jogado no chão por uma corda traiçoeira de tenda, aceito que não havia saída, enquanto os guardas me trancam."
 prison.9505.opening:0 "Está ficando claro para mim que devo tomar meu destino em minhas próprias mãos. Também está claro que nem todas as partes das paredes estão igualmente bem guardadas."
 prison.9505.t:0 "Empurrando Limites"
 prison.9505.tumble:0 "\n\nDepois de uma queda terrível de uma saliência na parede, eu gostaria que estivesse, no entanto. Levou uma hora até alguém me encontrar e me ajudar até meus aposentos, onde um curandeiro foi chamado."
 prison.9505.tunnels:0 "\n\nLogo descobri, no entanto, que os túneis sob as paredes são escuros e confusos. Foi só depois de várias batidas e pedras atingindo minha cabeça que consegui encontrar o caminho para fora, de volta ao pátio."
