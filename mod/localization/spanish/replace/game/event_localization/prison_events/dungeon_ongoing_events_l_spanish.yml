l_spanish:
 dungeon_no_response_tooltip:0 "#F Parece que ninguém ouve seus apelos.#!"
 dungeon_ongoing.0001.a:0 "Se você ao menos parasse, até mesmo por um momento!"
 dungeon_ongoing.0001.b:0 "\"É a mim que você está falando, amigo?\""
 dungeon_ongoing.0001.desc:0 "Eu não consigo ver quem é, nem exatamente onde eles estão, mas a única vez em que seus sussurros altos não ecoam pela masmorra úmida é quando eles estão gritando em vez disso."
 dungeon_ongoing.0001.t:0 "Conversa incessante"
 dungeon_ongoing.0002.a:0 "Eu preciso sair daqui!"
 dungeon_ongoing.0002.b:0 "Eu posso esperar o tempo que for necessário."
 dungeon_ongoing.0002.desc:0 "É a passagem do tempo que realmente me afeta. Quem sabe quanto já se passou, ou quanto tempo mais minha estadia continuará? Podem ser horas... ou meses."
 dungeon_ongoing.0002.t:0 "A espera"
 dungeon_ongoing.0003.a:0 "Apelos ao dever claramente não são o caminho para a saída."
 dungeon_ongoing.0003.b:0 "Você acha que pode me calar com ameaças?!"
 dungeon_ongoing.0003.desc:0 "Tenho importunado os guardas pelas barras, dizendo-lhes que precisam me deixar sair. A única resposta deles é um olhar ameaçador, um punho erguido e um rosnado de 'fique quieto.'"
 dungeon_ongoing.0003.t:0 "\"Silêncio!\""
 dungeon_ongoing.0004.a:0 "Por favor, eu preciso de ajuda..."
 dungeon_ongoing.0004.desc:0 "Eu pensei que o ferimento estava quase cicatrizado, mas agora começou a arder. Não consigo olhá-lo adequadamente na escuridão, mas parece estar inchado ao toque.\n\nNão consigo dizer se a umidade acompanhando a dor intensa é sangue, pus ou condensação do ar úmido."
 dungeon_ongoing.0004.t:0 "Infecção"
 dungeon_ongoing.0005.a:0 "Obrigado, [ROOT.Char.GetFaith.HealthGodName]."
 dungeon_ongoing.0005.desc:0 "A pele ao redor do meu ferimento está dura, como madeira úmida, mas a sensação de queimação passou. Parece que a infecção se foi."
 dungeon_ongoing.0005.t:0 "O fim do fogo"
 dungeon_ongoing.0006.a:0 "[ROOT.Char.GetFaith.HighGodName], como eu poderia merecer algo assim?!"
 dungeon_ongoing.0006.b:0 "Ah, poderia ter sido pior."
 dungeon_ongoing.0006.desc:0 "Um frio constante, umidade perpétua e uma fome eterna devido a uma papa muito rala."
 dungeon_ongoing.0006.t:0 "Destino cruel"
 dungeon_ongoing.0007.a:0 "Eu sou digno de muito mais do que isso!"
 dungeon_ongoing.0007.b:0 "Eu tenho que me concentrar na sobrevivência, e apenas na sobrevivência."
 dungeon_ongoing.0007.desc:0 "Preso aqui na escuridão enquanto o mundo lá fora segue em frente. Eu deveria estar lá fora, buscando os céus, não enterrado no subsolo."
 dungeon_ongoing.0007.t:0 "Anseio por algo mais"
 dungeon_ongoing.0008.a:0 "Já faz tanto tempo!"
 dungeon_ongoing.0008.desc:0 "Eu estive aqui embaixo para sempre. Já se passaram meses? Anos? Décadas? Meu exílio para a escuridão nunca acaba!"
 dungeon_ongoing.0008.t:0 "A Passagem dos Dias"
 dungeon_ongoing.0009.a:0 "Você é um adorável [ROOT.Char.Custom('prison_pet')], não é mesmo?"
 dungeon_ongoing.0009.desc:0 "Eu não sei como teria sobrevivido aqui embaixo sem o conforto que meu querido [ROOT.Char.Custom('prison_pet')] me proporciona.\n\nSempre que me sinto triste, ele está lá para me confortar, sempre que sinto vontade de desistir, ele me incentiva a continuar. Nunca conheci outro [ROOT.Char.Custom('prison_pet')] como ele!"
 dungeon_ongoing.0009.t:0 "O Conforto de um Amigo"
 dungeon_ongoing.0010.a.failure.t:0 "Os guardas não são persuadidos"
 dungeon_ongoing.0010.a.success.desc:0 "[letter_recipient.GetTitledFirstNameNoTooltip] pode negociar minha libertação da prisão"
 dungeon_ongoing.0010.a.success.t:0 "Minha carta é contrabandeada para fora"
 dungeon_ongoing.0010.a.tt:0 "Devo persuadir os guardas de [imprisoner.GetShortUINamePossessiveNoTooltip] a entregarem minha carta."
 dungeon_ongoing.0010.a:0 "Os próprios guardas irão me ajudar."
 dungeon_ongoing.0010.b.failure.t:0 "Os guardas confiscam minha carta"
 dungeon_ongoing.0010.b.tt:0 "Devo passar minha carta despercebida pelos guardas de [imprisoner.GetShortUINamePossessiveNoTooltip]."
 dungeon_ongoing.0010.b:0 "Uma carta é fácil de ser ignorada..."
 dungeon_ongoing.0010.c:0 "Não, devo permanecer cauteloso."
 dungeon_ongoing.0010.desc:0 "Talvez meu aprisionamento não seja definitivo. Eu poderia escrever para [letter_recipient.Custom2('MyCharacterIntroduction', ROOT.Char)], implorando para [letter_recipient.GetSheHe] me libertar do meu destino esculpido em pedra. Mas como eu poderia entregar uma carta para [letter_recipient.GetCurrentLocation.GetNameNoTooltip] sob tantos olhares curiosos?"
 dungeon_ongoing.0010.t:0 "Minha Tábua de Salvação"
 dungeon_ongoing.0011.a.failure.t:0 "[imprisoner.GetTitledFirstNameNoTooltip] não liberta [Select_CString( prisoner.IsFemale, 'a', 'o' )] [prisoner.GetTitledFirstNameNoTooltip]"
 dungeon_ongoing.0011.a.success.t:0 "[imprisoner.GetTitledFirstNameNoTooltip] atende ao meu pedido"
 dungeon_ongoing.0011.a.tt:0 "Vou implorar para [Select_CString( imprisoner.IsFemale, 'a', 'o' )] [imprisoner.GetTitledFirstNameNoTooltip] libertar [Select_CString( prisoner.IsFemale, 'a', 'o' )] [prisoner.GetTitledFirstNameNoTooltip]"
 dungeon_ongoing.0011.a:0 "[prisoner.GetSheHe|U] não pode ficar mais um momento naquele lugar!"
 dungeon_ongoing.0011.a_not_ai:0 "[imprisoner.GetTitledFirstNameNoTooltip] considerará se deve libertar [Select_CString( prisoner.IsFemale, 'a', 'o' )] [prisoner.GetTitledFirstNameNoTooltip]"
 dungeon_ongoing.0011.b:0 "Bah, [prisoner.GetFirstNameNoTooltip] deve estar exagerando."
 dungeon_ongoing.0011.desc:0 "Recebi uma carta de uma fonte bastante improvável, [prisoner.Custom2('MyCharacterIntroduction', ROOT.Char)]. [prisoner.GetSheHe|U] conta os detalhes mais macabros de seu aprisionamento [Select_CString( imprisoner.IsFemale, 'pela', 'pelo' )] [imprisoner.GetTitledFirstName] e me implora para resgatar [prisoner.GetSheHe] imediatamente, ou [prisoner.GetSheHe] teme pela própria vida."
 dungeon_ongoing.0011.t:0 "[prisoner.Custom2('RelationToMeShort', ROOT.Char)|U] Enterrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]o Viv[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]"
 dungeon_ongoing.0012.a:0 "Talvez a carta tenha se perdido?"
 dungeon_ongoing.0012.b:0 "Eu sempre soube que [Select_CString( letter_recipient.IsFemale, 'a', 'o' )] [letter_recipient.GetTitledFirstNameNoTooltip] era um[Select_CString( letter_recipient.IsFemale, 'a', '' )] [letter_recipient.Custom2('InsultNoun', ROOT.Char)]"
 dungeon_ongoing.0012.desc:0 "Os dias se arrastam diante de mim sem resposta de [letter_recipient.Custom2('MyCharacterIntroduction', ROOT.Char)]. Para onde [letter_recipient.GetSheHe] foi? Por que [letter_recipient.GetSheHe] não respondeu? Se ao menos eu estivesse livre desse enrosco de pedra!"
 dungeon_ongoing.0012.t:0 "Cartas Queimadas"
 dungeon_ongoing.0013.a:0 "[prisoner.GetTitledFirstNameNoTooltip] será libertad[Select_CString( prisoner.IsFemale, 'a', 'o' )] hoje."
 dungeon_ongoing.0013.b:0 "[prisoner.GetSheHe|U] é minha prisioneira legítima, que se dane a família."
 dungeon_ongoing.0013.desc_intro:0 "Embora [prisoner.Custom2('MyCharacterIntroduction', ROOT.Char)] seja minha prisioneira legítima, aparentemente [Select_CString( letter_recipient.IsFemale, 'a', 'o' )] [letter_recipient.GetTitledFirstName] não concorda com minha visão.\n\n"
 dungeon_ongoing.0013.desc_reasoning_compassionate:0 "\"Você não sente compaixão por um membro de [ROOT.Char.GetHouse.GetBaseName] sendo trancado assim?\" [letter_recipient.GetSheHe] pergunta. \"Olhe além das transgressões [prisoner.GetHerHim] e pense no bem da casa, eu te imploro.\""
 dungeon_ongoing.0013.desc_reasoning_other:0 "\"Somente ficamos mais vulneráveis às ameaças externas quando estamos trancados atrás de nossas próprias paredes,\" [letter_recipient.GetSheHe] protesta. \"Você não liberará [Select_CString( prisoner.IsFemale, 'a', 'o' )] [prisoner.GetTitledFirstNameNoTooltip], então, pelo bem de [realm_title.GetNameNoTier]?\""
 dungeon_ongoing.0013.t:0 "Família Enterrada Viva"
 dungeon_ongoing.0014.a:0 "Pelo menos [Select_CString( letter_recipient.IsFemale, 'a', 'o' )] [letter_recipient.GetTitledFirstNameNoTooltip] é [Select_CString( letter_recipient.IsFemale, 'uma boa', 'um bom' )] [ROOT.Char.Custom2('RelationToMeShort', letter_recipient)] para mim."
 dungeon_ongoing.0014.b:0 "Ninguém vai me ajudar?!"
 dungeon_ongoing.0014.desc:0 "Os sussurros dos guardas chegam até mim. [letter_recipient.Custom2('MyCharacterIntroduction', ROOT.Char)] claramente atendeu minhas cartas e se aproximou [Select_CString( imprisoner.IsFemale, 'da minha carcereira', 'do meu carcereiro' )] [imprisoner.GetTitledFirstName]. Infelizmente, [Select_CString( imprisoner.IsFemale, 'a', 'o' )] [imprisoner.Custom2('InsultNoun', ROOT.Char)] endureceu o coração [imprisoner.GetHerHim] e afastou [Select_CString( letter_recipient.IsFemale, 'a', 'o' )] [letter_recipient.GetTitledFirstNameNoTooltip]. Estou tão preso quanto antes."
 dungeon_ongoing.0014.t:0 "Ecos Vazios"
 dungeon_ongoing.9001.a:0 "É tão difícil se mover."
 dungeon_ongoing.9001.desc:0 "Não me lembro da última vez que vi o sol. Não me lembro da última vez que comi comida sólida, ou qualquer outra coisa sólida.\n\nParece que a umidade no ar se fixou nos meus pulmões.\n\nSe um dente dói, eu simplesmente o arranco das minhas gengivas podres."
 dungeon_ongoing.9001.t:0 "Interior"
 dungeon_ongoing.9002.a:0 "Eu só quero que isso acabe."
 dungeon_ongoing.9002.desc:0 "A tosse nunca acaba. Já se passaram dias, e não tive uma hora de sono sem acordar com as mãos arrancando minha garganta.\n\nLamber os fios de água da parede não adianta mais."
 dungeon_ongoing.9002.t:0 "Vazio"
 dungeon_ongoing.9003.a:0 "Mal consigo lembrar dos rostos deles..."
 dungeon_ongoing.9003.desc:0 "Será que algum dia serei solto daqui? Estou simplesmente trancado, abandonado e esquecido?\n\nAlguém além do carcereiro sabe que estou aqui?\n\nAinda existe alguém que saiba meu nome?\n\nQuem sabe quem eu era?"
 dungeon_ongoing.9003.t:0 "Recordação"
 dungeon_ongoing.9004.a:0 "Este é todo o meu mundo."
 dungeon_ongoing.9004.desc:0 "Eu vou morrer aqui. Tenho certeza disso. Nunca mais sentirei o sol no meu rosto, ou ouvirei risadas sem um toque de desesperança."
 dungeon_ongoing.9004.t:0 "Abandono"
 dungeon_ongoing.9005.a:0 "Você não pode me deixar aqui sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]!"
 dungeon_ongoing.9005.desc:0 "Meu fiel companheiro, meu amigo mais precioso, minha tábua de salvação neste lugar sombrio...\n\nEnquanto embalo meu [ROOT.Char.Custom('prison_pet')] moribundo em meus braços, sou tomado pela desesperança da minha situação. Se até um ser tão puro quanto [dummy_gender.GetSheHe] deve morrer neste lugar, que chance eu tenho?"
 dungeon_ongoing.9005.t:0 "Perda Incompreensível"
