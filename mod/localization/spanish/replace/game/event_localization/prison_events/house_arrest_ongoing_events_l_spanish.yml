l_spanish:
 house_arrest_ongoing.0001.a:0 "Fico pensando em que estado estão meus assuntos."
 house_arrest_ongoing.0001.b:0 "Quando eu for libertado, estarei pronto. Preciso planejar!"
 house_arrest_ongoing.0001.desc:0 "Cada dia passado como prisioneiro d[Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitledFirstName] é mais um dia em que meus planos cuidadosamente traçados escapam ainda mais do meu alcance.\n\nA verdadeira punição não é o confinamento físico em que me encontro, é estar tão incapacitado!"
 house_arrest_ongoing.0001.t:0 "Metas e Sonhos"
 house_arrest_ongoing.0002.a:0 "Nunca fui tão insultado!"
 house_arrest_ongoing.0002.b:0 "Devo tentar manter a calma."
 house_arrest_ongoing.0002.desc:0 "Quem [Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitledFirstName] pensa que é?! Me manter aqui, enjaulado como um animal, e depois ter a audácia de afirmar que é justiça.\n\nComo se alguém além de [ROOT.Char.GetFaith.HighGodName] tivesse o direito de #EMP me#! julgar."
 house_arrest_ongoing.0002.t:0 "Julgamento equivocado"
 house_arrest_ongoing.0003.a:0 "Será que alguém poderia conversar comigo?!"
 house_arrest_ongoing.0003.b:0 "Eu ainda encontrarei alguém que esteja disposto a conversar comigo."
 house_arrest_ongoing.0003.c:0 "[friendly_prisoner.GetSheHe|U] é minha única fonte de amizade."
 house_arrest_ongoing.0003.d:0 "[friendly_prisoner.GetSheHe|U] é minha única fonte de conforto e amor."
 house_arrest_ongoing.0003.desc_friendly_prisoner:0 "\n\nA única coisa que me ajuda a passar os longos dias é minha conexão com [Select_CString( friendly_prisoner.IsFemale, 'a', 'o' )] [friendly_prisoner.GetTitledFirstName]."
 house_arrest_ongoing.0003.desc_opening:0 "Passar meu tempo separado de todos aqueles que amo é uma punição cruel. Procuro qualquer fonte de conforto e companhia que consigo encontrar, mas são poucas."
 house_arrest_ongoing.0003.e:0 "[ROOT.Char.GetFirstNameNoTooltip] é minha única fonte de conforto e amor."
 house_arrest_ongoing.0003.t:0 "Dias solitários"
 house_arrest_ongoing.0004.a:0 "Não sei o que teria feito sem [friend_at_court.GetSheHe]!"
 house_arrest_ongoing.0004.desc1:0 "\"Eu sei o quanto você sente falta de seus livros e pergaminhos, então trouxe algo para você do mercado!\""
 house_arrest_ongoing.0004.desc2:0 "\"Eu sei o quanto você gosta de bolo, e o cozinheiro não estava prestando atenção, então...\""
 house_arrest_ongoing.0004.desc3:0 "\"Vi essa pulseira na cidade hoje e sabia que você iria adorar. Por favor, coloque-a!\""
 house_arrest_ongoing.0004.desc4:0 "\"Eu só consegui convencer os guardas até certo ponto, mas espero que um passeio pelos jardins eleve seu ânimo!\""
 house_arrest_ongoing.0004.desc:0 "\n\n[Select_CString( friend_at_court.IsFemale, 'Minha querida', 'Meu querido' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend_at_court') )], [friend_at_court.GetTitledFirstName], está sempre pensando em mim e fazendo o melhor [friend_at_court.GetSheHe] pode para tornar minha punição mais confortável."
 house_arrest_ongoing.0004.t:0 "Aliviando meu tormento"
 house_arrest_ongoing.0005.a:0 "Está funcionando, também!"
 house_arrest_ongoing.0005.desc:0 "\"Ah, você deveria ter visto os atores no festival. Que espetáculo!\"\n\nJá é ruim o suficiente ficar preso aqui. Também tenho que lidar com as zombarias [Select_CString( rival_at_court.IsFemale, 'da minha', 'do meu ' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival_at_court') )] [rival_at_court.GetTitledFirstNamePossessive]. [rival_at_court.GetSheHe|U] se esforça ao máximo para tornar minha vida tão miserável quanto [rival_at_court.GetSheHe] pode, agora que estou tão humilhado."
 house_arrest_ongoing.0005.t:0 "Meu Carrasco Pessoal"
