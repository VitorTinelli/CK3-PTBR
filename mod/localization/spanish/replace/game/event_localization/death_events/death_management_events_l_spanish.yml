 death_management.2007.ruler:0 "soberano"
 death_management.2007.start:0 "Hoje, com a morte d[Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetTitledFirstName] nas masmorras d[Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitledFirstName], o futuro do [ROOT.Char.GetPrimaryTitle.GetNameNoTier] mudou de curso. Nunca saberemos que tipo de"
