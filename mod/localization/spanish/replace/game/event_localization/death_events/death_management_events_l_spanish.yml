 death_management.2008.a.tt:0 "[Select_CString( dead_character.IsFemale, 'Sua noiva', 'Seu noivo' )], [dead_character.GetTitledFirstName], faleceu nas masmorras d[Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitledFirstName] e o acordo matrimonial está anulado."
 death_management.2008.a:0 "Descanse em paz, [dead_character.GetFirstNameNoTooltip]."
 death_management.2008.b:0 "Pulamos direto para o #EMP Até que a morte nos separe#!"
 death_management.2008.desc.like:0 "Eu havia começado a imaginar o futuro com [Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetTitledFirstNamePossessive] — as coisas que alcançaríamos juntos e a família que construiríamos."
 death_management.2008.desc.neutral:0 "Desde que meu noivado com [Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetTitledFirstName] foi oficializado, tenho sentido tanto empolgação quanto medo ao pensar em nosso casamento iminente. Agora que [Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitledFirstName] causou a morte de [Select_CString( dead_character.IsFemale, 'minha pretendente', 'meu pretendente' )], sinto falta [dead_character.GetHerHim], apesar de nunca [Select_CString( dead_character.IsFemale, 'tê-la', 'tê-lo' )] conhecido de verdade. Quem sabe o que poderíamos ter tido juntos?"
 death_management.2008.dislike:0 "Quando me contaram sobre a morte de [Select_CString( dead_character.IsFemale, 'minha noiva', 'meu noivo' )] [dead_character.GetTitledFirstName] nas masmorras d[Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitledFirstName], não posso negar que me senti [Select_CString( ROOT.Char.IsFemale, 'aliviada', 'aliviado' )]. Claro, ainda sinto raiva [Select_CString( prison_holder.IsFemale, 'pela', 'pelo' )] [prison_holder.GetTitleTierName] que deixou [Select_CString( dead_character.IsFemale, 'minha noiva', 'meu noivo' )] perecer sob seus cuidados, mas estou feliz por não ter que me casar com [dead_character.GetSheHe] agora."
 death_management.2008.dislike_killer:0 "Quando me contaram sobre a morte de [Select_CString( dead_character.IsFemale, 'minha noiva', 'meu noivo' )] [dead_character.GetTitledFirstName] pelas mãos d[Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitledFirstName], não posso negar que me senti [Select_CString( ROOT.Char.IsFemale, 'aliviada', 'aliviado' )]. Claro, ainda sinto raiva [Select_CString( prison_holder.IsFemale, 'pela', 'pelo' )] [prison_holder.GetTitleTierName] que encerrou a vida de [Select_CString( dead_character.IsFemale, 'minha', 'meu' )] pretendente de forma tão violenta, mas estou feliz por não ter que me casar com [dead_character.GetSheHe] agora."
 death_management.2008.like_end:0 "Todos aqueles sonhos desmoronaram graças [Select_CString( prison_holder.IsFemale, 'a', 'ao' )] [prison_holder.GetTitledFirstName], que deixou [Select_CString( dead_character.IsFemale, 'minha noiva', 'meu noivo' )] morrer em suas masmorras."
 death_management.2008.like_end_killer:0 "Todos aqueles sonhos desmoronaram graças [Select_CString( prison_holder.IsFemale, 'a', 'ao' )] [prison_holder.GetTitledFirstName], que assassinou [Select_CString( dead_character.IsFemale, 'minha noiva', 'meu noivo' )], encerrando o sonho antes mesmo de começar."
 death_management.2008.t:0 "Tudo o Que Poderia Ter Sido"
 death_management.3000.a:0 "Que [dead_character.GetSheHe] descanse em paz."
 death_management.3000.b:0 "Quem poderia ter adivinhado?"
 death_management.3000.c:0 "Boa viagem!"
 death_management.3000.dislike:0 "[Select_CString( dead_character.IsFemale, 'Estimada', 'Estimado' )] [dead_character.GetWifeHusband], senti alívio quando você exalou seu último suspiro em minhas masmorras. Talvez eu devesse sentir vergonha, mas, na verdade, não havia amor perdido entre nós."
 death_management.3000.like:0 "Oh, [dead_character.GetFirstName], [Select_CString( dead_character.IsFemale, 'minha', 'meu' )] [dead_character.Custom('LoverPetName')]. Imaginar que você partiria em minhas masmorras... Eu me pergunto se [dead_character.GetSheHe] acreditaria em mim se eu dissesse a [dead_character.GetSheHe] que ainda [Select_CString( dead_character.IsFemale, 'a', 'o' )] amo, mesmo agora."
 death_management.3000.neutral:0 "[Select_CString( dead_character.IsFemale, 'Minha cara', 'Meu caro' )] [dead_character.GetFirstName]. Talvez eu não [Select_CString( dead_character.IsFemale, 'a', 'o' )] tenha amado, e talvez eu tenha sido a causa de sua morte, mas sinto sua partida de forma mais intensa do que jamais pensei ser possível. Você sempre esteve presente, meu constante companheiro. Imaginar que minha masmorra seria sua morte..."
 death_management.3000.t:0 "Até Que a Morte Nos Separe"
 death_management.3000.tt:0 "[Select_CString( dead_character.IsFemale, 'Sua', 'Seu' )] cônjuge, [dead_character.GetTitledFirstName], faleceu em suas masmorras."
 death_management.3001.a:0 "[dead_character.GetSheHe|U] não merecia isso."
 death_management.3001.c:0 "É tarde demais para arrependimentos."
 death_management.3001.child:0 "Eu tinha tantas esperanças para você, [Select_CString( dead_character.IsFemale, 'minha doce filha', 'meu doce filho' )]. Todas as coisas que você aprenderia, experienciaria e faria. Havia tantas possibilidades, uma vida inteira para viver. Talvez você tivesse filhos próprios um dia. Mas agora, nada disso jamais acontecerá, tudo graças às minhas ações..."
 death_management.3001.d:0 "Descanse em paz, [Select_CString( dead_character.IsFemale, 'pequena', 'pequeno' )] [dead_character.GetFirstNameNoTooltip]."
 death_management.3001.dislike:0 "Não é dever de [Select_CString( ROOT.Char.IsFemale, 'uma', 'um' )] [ROOT.Char.Custom('MotherFather')] amar os filhos? No entanto, não consigo chorar pela partida d[Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetFirstNamePossessive] pelas minhas próprias mãos."
 death_management.3001.like:0 "Oh, [ROOT.Char.GetFaith.HighGodName], como você pôde permitir que [Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetFirstName] partisse?\n\nRezo para que [dead_character.GetSheHe] encontre paz na vida após a morte e que [ROOT.Char.GetFaith.HighGodName] me perdoe por meus crimes."
 death_management.3001.neutral:0 "Pensei que fosse [Select_CString( ROOT.Char.IsFemale, 'velha', 'velho' )] demais para ser [Select_CString( ROOT.Char.IsFemale, 'surpreendida', 'surpreendido' )] pelas crueldades deste mundo, mas nunca previ a dor que causaria ao vivenciar a morte [Select_CString( dead_character.IsFemale, 'da minha própria', 'do meu próprio' )] [dead_character.Custom('GetDaughterSon')]. Minha única esperança é que [dead_character.GetSheHe] agora seja [Select_CString( dead_character.IsFemale, 'poupada', 'poupado' )] do sofrimento que devo suportar..."
 death_management.3001.t:0 "Sobrevivendo a um Filho"
 death_management.3001.tt:0 "[Select_CString( dead_character.IsFemale, 'Sua', 'Seu' )] [dead_character.Custom('GetDaughterSon')], [dead_character.GetTitledFirstName], faleceu em suas masmorras."
 death_management.3002.a:0 "Eu sempre vou te amar, [dead_character.Custom('MotherFather')]."
 death_management.3002.b:0 "Acho que nunca saberei..."
 death_management.3002.c:0 "Que bom que se foi!"
 death_management.3002.child:0 "[dead_character.Custom('MotherFather')|U]? Por que você se foi? Disseram que você não pôde evitar, que eu fui a razão pela qual você teve que partir. Mas isso não faz sentido. Certo, [dead_character.Custom('MotherFather')]?"
 death_management.3002.d:0 "Eu... Eu quero [Select_CString( dead_character.IsFemale, 'minha', 'meu' )] [dead_character.Custom('MotherFather')]!"
 death_management.3002.dislike:0 "Seu sangue pode correr em minhas veias, mas você não foi [Select_CString( dead_character.IsFemale, 'uma verdadeira', 'um verdadeiro' )] [dead_character.Custom('MotherFather')] para mim. Não senti nada com sua partida além de alívio, nem mesmo culpa por tê-la causado. Finalmente, sua sombra não paira mais sobre meus ombros."
 death_management.3002.like:0 "Oh, [dead_character.Custom('MotherFather')]. Eu posso estar [Select_CString( ROOT.Char.IsFemale, 'crescida', 'crescido' )], mas eu sempre fui [Select_CString( ROOT.Char.IsFemale, 'sua filha', 'seu filho' )]. O que devo fazer agora, quando fui eu quem causou sua partida? Quem me abraçará enquanto meus olhos são cegados pelas lágrimas?"
 death_management.3002.neutral:0 "Nós talvez não estivéssemos próximos, e talvez eu tenha causado sua morte, [dead_character.GetFirstName], mas você sempre será [Select_CString( dead_character.IsFemale, 'minha', 'meu' )] [dead_character.Custom('MotherFather')].\n\nEnquanto você deixava este mundo, milhares de perguntas inundaram minha mente. Será que te dei por garantido? Foi sua morte um erro que eu deveria ter evitado? [dead_character.Custom('MotherFather')|U]... Você realmente me amava?"
 death_management.3002.t:0 "O Longo Repouso"
 death_management.3002.tt:0 "[Select_CString( dead_character.IsFemale, 'Sua', 'Seu' )] [dead_character.Custom('MotherFather')], [dead_character.GetTitledFirstName], faleceu em seu calabouço."
 death_management.3006.a.tt:0 "[Select_CString( dead_character.IsFemale, 'Sua', 'Seu' )] [rival|E] [dead_character.GetFirstNameNoTooltip] faleceu!"
 death_management.3006.a:0 "Sobre a sepultura rasa [dead_character.GetHerHim]!"
 death_management.3006.b:0 "Uma pena, eu esperava que [dead_character.GetSheHe] durasse mais."
 death_management.3006.c:0 "$death_management.1006.e$"
 death_management.3006.d:0 "$death_management.1006.f$"
 death_management.3006.desc:0 "Quando meu carcereiro trouxe as notícias alegres, mal podia acreditar! M[Select_CString( dead_character.IsFemale, 'inha', 'eu' )] rival, [dead_character.GetTitledFirstName], finalmente pereceu em meu calabouço.\n\nPensar que vou viver num mundo livre [Select_CString( dead_character.IsFemale, 'dessa', 'desse' )] [dead_character.Custom2('InsultNoun', ROOT.Char)], e pensar que fui eu quem causou isso. Estou tão feliz que poderia dançar!"
 death_management.3006.t:0 "Sobrevivendo ao Meu Rival"
 death_management.3007.a.tt:0 "[Select_CString( dead_character.IsFemale, 'Sua herdeira', 'Seu herdeiro' )], [dead_character.GetTitledFirstName], faleceu em suas masmorras.\n[new_heir.GetTitledFirstName] é [Select_CString( new_heir.IsFemale, 'a nova herdeira', 'o novo herdeiro' )]."
 death_management.3007.a:0 "Um conto se encerra e outro começa."
 death_management.3007.end:0 "[dead_character.GetSheHe] teria se tornado, ou se a morte [dead_character.GetHerHim] é uma bênção ou uma maldição para este [ROOT.Char.GetPrimaryTitle.GetType.GetName].\n\nO que sei é que o que está feito, está feito, e a história d[Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetFirstNamePossessive] chegou ao fim."
 death_management.3007.mytitle:0 "[ROOT.Char.GetTitleTierName]"
 death_management.3007.ruler:0 "governante"
 death_management.3007.start:0 "Hoje, com a partida d[Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetTitledFirstName] em minhas masmorras, o futuro do [ROOT.Char.GetPrimaryTitle.GetNameNoTier] mudou seu curso. Nunca saberemos que tipo de"
 death_management.3007.t:0 "Um Giro do Destino"
 death_management.3008.a.tt:0 "[Select_CString( dead_character.IsFemale, 'Sua noiva', 'Seu noivo' )], [dead_character.GetTitledFirstName], faleceu em seu calabouço e o contrato de casamento está anulado."
 death_management.3008.a:0 "Descanse em paz, [dead_character.GetFirstNameNoTooltip]."
 death_management.3008.b:0 "Pulamos direto para #EMP Até que a morte nos separe#!."
 death_management.3008.desc.dislike:0 "Quando me contaram sobre a morte de [Select_CString( dead_character.IsFemale, 'minha noiva', 'meu noivo' )] [dead_character.GetTitledFirstName] em meu calabouço, não posso negar que me senti [Select_CString( ROOT.Char.IsFemale, 'aliviada', 'aliviado' )]. Fico feliz por não ter que me casar com [dead_character.GetSheHe] agora!"
 death_management.3008.desc.like:0 "Eu já havia imaginado [Select_CString( dead_character.IsFemale, 'minha', 'meu' )] [dead_character.GetTitledFirstNamePossessive] e nosso futuro - as coisas que alcançaríamos juntos e a família que construiríamos. Todos esses sonhos desabaram por causa das minhas ações quando deixei [Select_CString( dead_character.IsFemale, 'minha noiva', 'meu noivo' )] morrer em meu calabouço."
 death_management.3008.desc.neutral:0 "Desde que [Select_CString( dead_character.IsFemale, 'minha noiva', 'meu noivo' )] [dead_character.GetTitledFirstName] foi oficialmente anunciado, tenho experimentado tanto empolgação quanto medo com a ideia de nosso casamento iminente. Agora que [Select_CString( dead_character.IsFemale, 'minha pretendida', 'meu pretendido' )] pereceu em meu calabouço, sinto falta [dead_character.GetHerHim], apesar de nunca realmente ter conhecido [dead_character.GetSheHe]. Quem sabe o que poderíamos ter tido juntos?"
 death_management.3008.t:0 "Tudo o Que Poderia Ter Sido"
 death_management.4000.a:0 "Pelo menos as memórias permanecem."
 death_management.4000.b:0 "Espero que você encontre paz, [dead_character.GetFirstNameNoTooltip]."
 death_management.4000.c:0 "Não poderia ser em dia melhor!"
 death_management.4000.dislike:0 "[dead_character.GetWifeHusband|U], enquanto você exalava seu último suspiro como prisioneiro d[Select_CString( house_arrest_holder.IsFemale, 'a', 'o' )] [house_arrest_holder.GetTitledFirstName], o alívio me inundou. Talvez eu devesse ter vergonha, mas, na verdade, não havia amor perdido entre nós. Finalmente, estou livre para recomeçar minha vida!"
 death_management.4000.dislike_my_prison:0 "[dead_character.GetWifeHusband|U], enquanto você exalava seu último suspiro como [Select_CString( dead_character.IsFemale, 'minha prisioneira', 'meu prisioneiro' )], o alívio me inundou. Talvez eu devesse ter vergonha, mas, na verdade, não havia amor perdido entre nós. Finalmente, estou livre para recomeçar minha vida!"
 death_management.4000.like:0 "Oh, [dead_character.GetFirstName], [Select_CString( dead_character.IsFemale, 'minha', 'meu' )] [dead_character.Custom('LoverPetName')]. Não consigo tirar da cabeça a imagem de você definhar, [Select_CString( dead_character.IsFemale, 'aprisionada', 'aprisionado' )] [Select_CString( house_arrest_holder.IsFemale, 'pela', 'pelo' )] [house_arrest_holder.GetTitledFirstName]."
 death_management.4000.like_my_prison:0 "Oh, [dead_character.GetFirstName], [Select_CString( dead_character.IsFemale, 'minha', 'meu' )] [dead_character.Custom('LoverPetName')]. Você acreditaria em mim se eu dissesse que ainda guardo carinho por você? Mesmo depois de tudo que fiz?"
 death_management.4000.like_opening:0 "Como um coração pode suportar esse tipo de dor sem se partir? Não pode ser possível! No entanto, aqui estou eu, meu coração batendo enquanto o seu se silencia.\n\n"
 death_management.4000.neutral:0 "Você sempre esteve presente, [Select_CString( dead_character.IsFemale, 'minha companheira', 'meu companheiro' )] constante. Pensar que você pereceria como [Select_CString( dead_character.IsFemale, 'prisioneira', 'prisioneiro' )] d[Select_CString( house_arrest_holder.IsFemale, 'a', 'o' )] [house_arrest_holder.GetTitledFirstName]... Há tantas coisas que deixei não ditas!"
 death_management.4000.neutral_my_prison:0 "Espero que você possa perdoar meus pecados. Tanto o que fiz a você quanto todas as coisas que deixei não ditas."
 death_management.4000.neutral_opening:0 "[Select_CString( dead_character.IsFemale, 'Minha querida', 'Meu querido' )] [dead_character.GetFirstName]. Eu posso não ter te amado, mas sinto sua partida mais intensamente do que jamais pensei ser possível.\n\n"
 death_management.4000.t:0 "Até Que a Morte Nos Separe"
 death_management.4000.tt:0 "[Select_CString( dead_character.IsFemale, 'Sua', 'Seu' )] cônjuge, [dead_character.GetTitledFirstName], faleceu em prisão domiciliar."
 death_management.4001.a:0 "[dead_character.GetSheHe|U] não merecia isso."
 death_management.4001.c:0 "É tarde demais para arrependimentos."
 death_management.4001.child:0 "Oh, [Select_CString( dead_character.IsFemale, 'minha querida', 'meu querido' )] [dead_character.GetTitledFirstName]! Tão inocente, tão jovem, mas [Select_CString( dead_character.IsFemale, 'obrigada', 'obrigado' )] a passar seus últimos dias na prisão d[Select_CString( house_arrest_holder.IsFemale, 'a', 'o' )] [house_arrest_holder.GetTitledFirstNamePossessive]?\n\nO mundo é realmente um lugar cruel... mas pelo menos agora eu sei que você nunca experimentará o pior de seus horrores."
 death_management.4001.child_my_prison:0 "Oh, [Select_CString( dead_character.IsFemale, 'minha doce', 'meu doce' )] [dead_character.GetTitledFirstName]! Espero ter feito a escolha certa, forçando você a passar seus últimos dias [Select_CString( dead_character.IsFemale, 'trancada', 'trancado' )].\n\nTodas as coisas que você nunca aprenderá, experimentará ou fará..."
 death_management.4001.d:0 "Descanse em paz, [Select_CString( dead_character.IsFemale, 'pequena', 'pequeno' )] [dead_character.GetFirstNameNoTooltip]."
 death_management.4001.dislike:0 "No entanto, não consigo chorar pela partida d[Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetFirstNamePossessive] enquanto estava [Select_CString( dead_character.IsFemale, 'presa', 'preso' )] [Select_CString( house_arrest_holder.IsFemale, 'pela', 'pelo' )] [house_arrest_holder.GetTitledFirstName]."
 death_management.4001.dislike_end:0 "\n\nEm algum momento, devo ter cometido um erro, forçado [Select_CString( dead_character.IsFemale, 'minha', 'meu' )] [dead_character.Custom('GetDaughterSon')] por um caminho que eu jamais poderia aprovar. Embora eu possa ser responsável pelo que [dead_character.GetSheHe] se tornou, isso agora é passado. Finalmente."
 death_management.4001.dislike_my_prison:0 "No entanto, não consigo chorar pela partida d[Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetFirstNamePossessive] enquanto estava [Select_CString( dead_character.IsFemale, 'presa', 'preso' )]."
 death_management.4001.dislike_opening:0 "Não é dever de [Select_CString( ROOT.Char.IsFemale, 'uma', 'um' )] [ROOT.Char.Custom('MotherFather')] amar os filhos [ROOT.Char.GetHerHim]?"
 death_management.4001.like:0 "Oh [ROOT.Char.GetFaith.HighGodName], como você pôde permitir que [Select_CString( dead_character.IsFemale, 'minha querida', 'meu querido' )] [dead_character.Custom('GetDaughterSon')] [dead_character.GetFirstName] falecesse na prisão d[Select_CString( house_arrest_holder.IsFemale, 'a', 'o' )] [house_arrest_holder.GetTitledFirstNamePossessive]? [dead_character.GetSheHe|U] era inocente, [Select_CString( dead_character.IsFemale, 'minha perfeita', 'meu perfeito' )] [dead_character.Custom('GetDaughterSon')]!\n\nRezo para que [Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetFirstName] encontre paz e liberdade na vida após a morte."
 death_management.4001.like_my_prison:0 "Oh [ROOT.Char.GetFaith.HighGodName], como você permitiu que [Select_CString( dead_character.IsFemale, 'minha querida', 'meu querido' )] [dead_character.Custom('GetDaughterSon')] [dead_character.GetFirstName] partisse? Oro para que [dead_character.GetSheHe] encontre paz e força para me perdoar na vida após a morte."
 death_management.4001.neutral:0 "Dói-me que [dead_character.GetSheHe] tenha passado seus últimos momentos nesta terra como [Select_CString( dead_character.IsFemale, 'prisioneira', 'prisioneiro' )] d[Select_CString( house_arrest_holder.IsFemale, 'a', 'o' )] [house_arrest_holder.GetTitledFirstName], mas espero que [dead_character.GetSheHe] agora consiga encontrar paz."
 death_management.4001.neutral_my_prison:0 "Mesmo que [dead_character.GetSheHe] tenha passado seus últimos momentos nesta terra como [Select_CString( dead_character.IsFemale, 'minha prisioneira', 'meu prisioneiro' )], espero que [dead_character.GetSheHe] agora consiga encontrar paz."
 death_management.4001.neutral_opening:0 "Pensei que já era [Select_CString( ROOT.Char.IsFemale, 'velha', 'velho' )] demais para ser [Select_CString( ROOT.Char.IsFemale, 'surpreendida', 'surpreendido' )] pelas crueldades deste mundo, mas nunca previ ter que vivenciar a morte [Select_CString( dead_character.IsFemale, 'da minha própria', 'do meu próprio' )] [dead_character.Custom('GetDaughterSon')].\n\n"
 death_management.4001.t:0 "Sobrevivendo a [Select_CString( dead_character.IsFemale, 'uma Filha', 'um Filho' )]"
 death_management.4001.tt:0 "[Select_CString( dead_character.IsFemale, 'Sua', 'Seu' )] [dead_character.Custom('GetDaughterSon')], [dead_character.GetTitledFirstName], faleceu em prisão domiciliar."
 death_management.4002.a:0 "Eu sempre irei te amar, [dead_character.Custom('MotherFather')]."
 death_management.4002.b:0 "Acho que nunca saberei..."
 death_management.4002.c:0 "Descanse em paz, [dead_character.Custom('MotherFather')]."
 death_management.4002.child:0 "[dead_character.Custom('MotherFather')|U]? Por que você se foi? Disseram-me que você não podia evitar e que eu não deveria chorar porque agora você está em um lugar melhor do que a prisão d[Select_CString( house_arrest_holder.IsFemale, 'a', 'o' )] [house_arrest_holder.GetTitledFirstNamePossessive]. Mas por que eu não posso ir com você, [dead_character.Custom('MotherFather')]? Você não me ama mais? Você disse que sempre amaria..."
 death_management.4002.d:0 "Eu... Eu quero [Select_CString( dead_character.IsFemale, 'minha', 'meu' )] [dead_character.Custom('MotherFather')]!"
 death_management.4002.dislike:0 "Não senti nada quando você faleceu como [Select_CString( dead_character.IsFemale, 'prisioneira', 'prisioneiro' )] d[Select_CString( house_arrest_holder.IsFemale, 'a', 'o' )] [house_arrest_holder.GetTitledFirstName], apenas alívio. Finalmente, sua sombra não paira mais sobre meus ombros."
 death_management.4002.dislike_my_prison:0 "Não senti nada além de alívio quando você faleceu como [Select_CString( dead_character.IsFemale, 'minha prisioneira', 'meu prisioneiro' )]. Finalmente, sua sombra não paira mais sobre meus ombros."
 death_management.4002.dislike_opening:0 "Seu sangue pode correr em minhas veias, mas você nunca foi [Select_CString( dead_character.IsFemale, 'uma verdadeira', 'um verdadeiro' )] [dead_character.Custom('MotherFather')] para mim."
 death_management.4002.like:0 "O que devo fazer agora, agora que você partiu como [Select_CString( dead_character.IsFemale, 'prisioneira', 'prisioneiro' )] d[Select_CString( house_arrest_holder.IsFemale, 'a', 'o' )] [house_arrest_holder.GetTitledFirstNamePossessive]? Quem me segurará quando meus olhos estiverem cegos de lágrimas?"
 death_management.4002.like_my_prison:0 "O que devo fazer agora, agora que você partiu como [Select_CString( dead_character.IsFemale, 'minha prisioneira', 'meu prisioneiro' )]? Quem me segurará quando meus olhos estiverem cegos de lágrimas? Você alguma vez me perdoará?"
 death_management.4002.like_opening:0 "Oh, [dead_character.Custom('MotherFather')]. Eu posso ser [Select_CString( ROOT.Char.IsFemale, 'adulta', 'adulto' )] agora, mas eu sempre fui [Select_CString( ROOT.Char.IsFemale, 'sua filha', 'seu filho' )]."
 death_management.4002.neutral:0 "Pensar que você faleceria como [Select_CString( dead_character.IsFemale, 'prisioneira', 'prisioneiro' )] d[Select_CString( house_arrest_holder.IsFemale, 'a', 'o' )] [house_arrest_holder.GetTitledFirstName], deixando-me com tantas perguntas... Eu te dei como certo? Você se orgulhava de mim? [dead_character.Custom('MotherFather')|U]... Você realmente me amava?"
 death_management.4002.neutral_my_prison:0 "Pensar que você faleceria como [Select_CString( dead_character.IsFemale, 'minha prisioneira', 'meu prisioneiro' )], deixando-me com tantas perguntas... Eu te dei como certo? Você se orgulhava de mim? [dead_character.Custom('MotherFather')|U]... Você realmente me amava?"
 death_management.4002.neutral_opening:0 "Embora não fôssemos próximos, [dead_character.GetFirstName], você sempre será [Select_CString( dead_character.IsFemale, 'minha', 'meu' )] [dead_character.Custom('MotherFather')]."
 death_management.4002.t:0 "O Descanso Eterno"
 death_management.4002.tt:0 "[Select_CString( dead_character.IsFemale, 'Sua', 'Seu' )] [dead_character.Custom('MotherFather')], [dead_character.GetTitledFirstName], faleceu em prisão domiciliar."
 death_management.4007.a.tt.heir:0 "[new_heir.GetTitledFirstName] é [Select_CString( new_heir.IsFemale, 'a sua nova herdeira', 'o seu novo herdeiro' )]."
 death_management.4007.a.tt:0 "[Select_CString( dead_character.IsFemale, 'Sua herdeira', 'Seu herdeiro' )], [dead_character.GetTitledFirstName], faleceu em prisão domiciliar."
 death_management.4007.a:0 "Um conto chega ao fim, e outro começa."
 death_management.4007.b:0 "Espero que minhas ações tenham sido as corretas."
 death_management.4007.end.heir:0 "\n\nMinha única esperança é que [Select_CString( new_heir.IsFemale, 'minha nova herdeira', 'meu novo herdeiro' )] [new_heir.GetTitledFirstName] esteja à altura da tarefa."
 death_management.4007.end:0 "[dead_character.GetSheHe] teria se tornado, ou se a morte [dead_character.GetHerHim] é uma bênção ou uma maldição para este [ROOT.Char.GetPrimaryTitle.GetType.GetName]."
 death_management.4007.end_adventurer:0 "[dead_character.GetSheHe] teria se tornado, ou se a morte [dead_character.GetHerHim] é uma bênção ou uma maldição para os seguidores [dead_character.GetHerHim]."
 death_management.4007.mytitle:0 "[ROOT.Char.GetTitleTierName]"
 death_management.4007.ruler:0 "[Select_CString( dead_character.IsFemale, 'soberana', 'soberano' )]"
 death_management.4007.start:0 "Hoje, com o falecimento d[Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetTitledFirstName] como [Select_CString( dead_character.IsFemale, 'prisioneira', 'prisioneiro' )] d[Select_CString( house_arrest_holder.IsFemale, 'a', 'o' )] [house_arrest_holder.GetTitledFirstName], o futuro do [ROOT.Char.GetPrimaryTitle.GetNameNoTier] mudou de curso. Nunca saberemos que tipo de"
 death_management.4007.start_my_prison:0 "Hoje, com o falecimento [Select_CString( dead_character.IsFemale, 'da minha prisioneira', 'do meu prisioneiro' )] [dead_character.GetTitledFirstName], o futuro do [ROOT.Char.GetPrimaryTitle.GetNameNoTier] mudou de curso. Nunca saberemos que tipo de"
 death_management.4007.t:0 "Um Giro do Destino"
 death_management.4008.a.tt:0 "[Select_CString( dead_character.IsFemale, 'Sua noiva', 'Seu noivo' )], [dead_character.GetTitledFirstName], faleceu em prisão domiciliar e o acordo de casamento é anulado."
 death_management.4008.a:0 "Descanse em paz, [dead_character.GetFirstNameNoTooltip]."
 death_management.4008.b:0 "Pulamos direto para o #EMP Até que a morte nos separe#!"
 death_management.4008.desc.dislike:0 "Quando me contaram sobre a morte [Select_CString( dead_character.IsFemale, 'da minha noiva', 'do meu noivo' )] [dead_character.GetTitledFirstName] como [Select_CString( dead_character.IsFemale, 'prisioneira', 'prisioneiro' )] d[Select_CString( house_arrest_holder.IsFemale, 'a', 'o' )] [house_arrest_holder.GetTitledFirstName], não posso negar que me senti [Select_CString( ROOT.Char.IsFemale, 'aliviada', 'aliviado' )]. Claro, não estou feliz com a morte [dead_character.GetHerHim], mas estou contente por não ter que me casar com [dead_character.GetSheHe] agora. Eu teria sido infeliz, e 'até que a morte nos separe' é um tempo muito longo..."
 death_management.4008.desc.dislike_my_prison:0 "Quando me contaram que [Select_CString( dead_character.IsFemale, 'minha noiva', 'meu noivo' )] [dead_character.GetTitledFirstName] havia falecido como [Select_CString( dead_character.IsFemale, 'minha prisioneira', 'meu prisioneiro' )], não posso negar que me senti [Select_CString( ROOT.Char.IsFemale, 'aliviada', 'aliviado' )]. Claro, não estou feliz com a morte [dead_character.GetHerHim], mas estou contente por não ter que me casar com [dead_character.GetSheHe] agora. Eu teria sido infeliz, e 'até que a morte nos separe' parecia um conceito tão distante..."
 death_management.4008.desc.like:0 "Quando me contaram sobre a morte do [Select_CString( dead_character.IsFemale, 'minha noiva', 'meu noivo' )] [dead_character.GetTitledFirstName] como [Select_CString( dead_character.IsFemale, 'prisioneira', 'prisioneiro' )] d[Select_CString( house_arrest_holder.IsFemale, 'a', 'o' )] [house_arrest_holder.GetTitledFirstName], todos os meus sonhos de uma vida com [Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetTitledFirstName] desabaram. Agora, nada do que eu havia imaginado acontecerá. Nossas esperanças, sonhos e a família que teríamos construído... Tudo acabou."
 death_management.4008.desc.like_my_prison:0 "Apesar de minhas ações, eu nunca odiei [Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetTitledFirstName]. Eu até imaginava nosso futuro juntos de vez em quando - as coisas que alcançaríamos e a família que construiríamos. Todos esses sonhos se desmoronaram quando me disseram que [Select_CString( dead_character.IsFemale, 'minha noiva', 'meu noivo' )] havia falecido como [Select_CString( dead_character.IsFemale, 'minha prisioneira', 'meu prisioneiro' )]. Isso não era como as coisas deveriam ser!"
 death_management.4008.desc.neutral:0 "Desde que meu noivado com [Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetTitledFirstName] foi oficializado, tenho sentido tanto empolgação quanto medo com o pensamento de nosso casamento iminente. Agora que [dead_character.GetSheHe] faleceu como [Select_CString( dead_character.IsFemale, 'prisioneira', 'prisioneiro' )] d[Select_CString( house_arrest_holder.IsFemale, 'a', 'o' )] [house_arrest_holder.GetTitledFirstName], sinto falta [dead_character.GetHerHim], apesar de nunca realmente [Select_CString( dead_character.IsFemale, 'tê-la', 'tê-lo' )] conhecido. Quem sabe o que poderíamos ter tido juntos?"
 death_management.4008.desc.neutral_my_prison:0 "Desde que meu noivado com [Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetTitledFirstName] foi oficializado, tenho sentido tanto empolgação quanto medo com o pensamento de nosso casamento iminente. Agora que [dead_character.GetSheHe] faleceu como [Select_CString( dead_character.IsFemale, 'minha prisioneira', 'meu prisioneiro' )], sinto falta [dead_character.GetHerHim], apesar de nunca realmente [Select_CString( dead_character.IsFemale, 'tê-la', 'tê-lo' )] conhecido. Quem sabe o que poderíamos ter tido juntos?"
 death_management.4008.t:0 "Tudo Que Poderia Ter Sido"
 death_management.9998.a.tt:0 "Você deveria organizar seus assuntos."
 death_management.9998.a:0 "Estarei morto dentro de um ano."
 death_management.9998.desc:0 "Posso sentir isso em meus próprios ossos. [ROOT.Char.GetFaith.DeathDeityName] virá me buscar em breve. Como [Select_CString( ROOT.Char.IsFemale, 'uma velha amiga', 'um velho amigo' )], [ROOT.Char.GetFaith.DeathDeitySheHe] está pacientemente esperando para me receber."
 death_management.9998.t:0 "Conheça a Ti Mesmo: Próximo ao Fim"
 death_management.betrothed.desc:0 "[Select_CString( dead_character.IsFemale, 'Sua prometida', 'Seu prometido' )], [dead_character.GetFullName], [dead_character.GetDeathReason]."
 death_management.betrothed_child.desc:0 "[Select_CString( dead_character.IsFemale, 'A prometida', 'O prometido' )] d[Select_CString( betrothed_of_dead_character.IsFemale, 'a', 'o' )] [betrothed_of_dead_character.GetFirstName], [dead_character.GetTitledFirstName], [dead_character.GetDeathReason]."
 death_management.death.uninvolved:0 "'#EMP Confirmamos que [Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetTitledFirstName] foi [Select_CString( dead_character.IsFemale, 'morta', 'morto' )] resistindo firmemente aos [battle_death_leader.GetPrimaryTitle.GetAdjectiveNoTooltip] [battle_death_leader.Custom('GetRandomEmployedMAA')]."
 death_management.death.war.enemy:0 "'#EMP Confirmamos que [Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetTitledFirstName] foi [Select_CString( dead_character.IsFemale, 'morta', 'morto' )] resistindo firmemente aos [battle_death_leader.GetPrimaryTitle.GetAdjectiveNoTooltip] [battle_death_leader.Custom('GetRandomEmployedMAA')]."
 death_management.death.war.friendly:0 "'#EMP Noss[Select_CString( dead_character.IsFemale, 'a', 'o' )] corajos[Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetTitledFirstName] foi [Select_CString( dead_character.IsFemale, 'morta', 'morto' )] liderando um ataque contra os [battle_death_enemy.GetPrimaryTitle.GetAdjectiveNoTooltip] [battle_death_enemy.Custom('GetRandomEmployedMAA')]."
 death_management.death.witnessed.enemy:0 "Nossos [battle_death_leader.Custom('GetRandomEmployedMAA')] perseguem [dead_character.GetSheHe] implacavelmente, e está claro que [dead_character.GetSheHe] está praticamente [Select_CString( dead_character.IsFemale, 'exausta', 'exausto' )] conforme outr[Select_CString( dead_character.IsFemale, 'as', 'os' )] [dead_character.GetWomenMen] caem como moscas ao redor [dead_character.GetHerHim]."
 death_management.death.witnessed.friendly:0 "[battle_death_enemy.GetPrimaryTitle.GetAdjectiveNoTooltip] [battle_death_enemy.Custom('GetRandomEmployedMAA')] estão lentamente cercando [dead_character.GetSheHe], a exaustão [dead_character.GetHerHim] apenas muito evidente."
 death_management.educator.desc:0 "[dead_character.GetTitledFirstName], educador de s[Select_CString( ward_of_dead_character.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('ward_of_dead_character'))], [ward_of_dead_character.GetTitledFirstNamePossessive], [dead_character.GetDeathReasonHideKiller]."
 death_management.elder.desc:0 "Seu [elder|E], [deceased_elder.GetFullName], [deceased_elder.GetDeathReason]."
 death_management.friend.desc:0 "[Select_CString( dead_character.IsFemale, 'Sua amiga', 'Seu amigo' )], [dead_character.GetTitledFirstName], faleceu."
 death_management.intro.enemy:0 "À minha frente, [dead_character.GetFirstName] avança corajosamente em direção ao inimigo.\n\n"
 death_management.intro.friendly:0 "Ao longo do campo, vejo [Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetFirstName] lutando desesperadamente.\n\n"
 death_management.intro.letter.family:0 "Eu sei imediatamente que algo terrível aconteceu com [Select_CString( dead_character.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('dead_character'))].\n\n$death_management.intro.letter$"
 death_management.intro.letter.friend:0 "Não consigo deixar de me preocupar com o destino [Select_CString( dead_character.IsFemale, 'da minha amiga mais próxima', 'do meu amigo mais próximo' )].\n\n$death_management.intro.letter$"
 death_management.intro.letter.heir:0 "Respiro fundo; tanto repousa no destino do meu herdeiro.\n\n$death_management.intro.letter$"
 death_management.intro.letter.lover:0 "Meu estômago se revira de medo por meu amado, enquanto pego o pergaminho.\n\n$death_management.intro.letter$"
 death_management.intro.letter.rival:0 "De alguma forma, eu já sei, mesmo antes de abrir, que ele contém boas notícias.\n\n$death_management.intro.letter$"
 death_management.intro.letter.spouse:0 "Pego o pedaço de papel e procuro por notícias [Select_CString( dead_character.IsFemale, 'da minha', 'do meu' )] [dead_character.GetWifeHusband].\n\n$death_management.intro.letter$"
 death_management.intro.letter:0 "Lá, entre os despachos, está escrito:\n"
 death_management.intro.war:0 "Notícias do [battle_death_location.GetTerrain.GetNameNoTooltip] de [battle_death_location.GetNameNoTooltip] finalmente chegam às mãos de um mensageiro exausto."
 death_management.intro.witnessed:0 "Em meio ao caos que consome o [battle_death_location.GetTerrain.GetNameNoTooltip], tento me orientar."
 death_management.intro:0 "O conflito entre o [battle_death_enemy.GetPrimaryTitle.GetNameNoTierNoTooltip] e o [battle_death_leader.GetPrimaryTitle.GetNameNoTierNoTooltip] pouco me interessava, até que o resumo do meu conselho sobre a batalha de [battle_death_location.GetNameNoTooltip] apareceu."
 death_management.killer.witnessed.enemy:0 "Em questão de momentos, [battle_death_killer.GetTitledFirstName], [battle_death_killer.GetLiege.Custom2('RelationToMe', SCOPE.sC('battle_death_killer'))] d[Select_CString( battle_death_killer.GetLiege.IsFemale, 'a', 'o' )] [battle_death_killer.GetLiege.GetTitledFirstName], avança determinadamente, segurando seu [battle_death_killer.Custom('signature_weapon')] erguida, supera facilmente a força restante d[Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetFirstNameNoTooltip] e desfere o golpe de misericórdia."
 death_management.killer.witnessed.friendly:0 "O brilho de uma [battle_death_killer.Custom('signature_weapon')] chama minha atenção repentinamente, e observo enquanto [Select_CString( battle_death_killer.IsFemale, 'a', 'o' )] [battle_death_killer.GetTitledFirstName], [battle_death_killer.GetLiege.Custom2('RelationToMe', SCOPE.sC('battle_death_killer'))] d[Select_CString( battle_death_killer.GetLiege.IsFemale, 'a', 'o' )] [battle_death_killer.GetLiege.GetTitledFirstName], desfere o golpe mortal feroz."
