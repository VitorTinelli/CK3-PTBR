l_spanish:
 death_battle_new_rivalry_title:0 "[avenger.GetTitledFirstNameNoTooltip] busca vingança"
 death_management.1000.a:0 "Pelo menos as memórias permanecem."
 death_management.1000.b:0 "Espero que você encontre paz, [dead_character.GetFirstNameNoTooltip]."
 death_management.1000.c:0 "Não poderia ter chegado em melhor hora!"
 death_management.1000.dislike:0 "[dead_character.GetWifeHusband|U], enquanto você exalava seu último suspiro, um alívio me inundou. Talvez eu devesse sentir vergonha, mas, na verdade, não havia amor perdido entre nós. Finalmente, estou livre para recomeçar minha vida!"
 death_management.1000.killed.tt:0 "[dead_character.GetTitledFirstName] foi [Select_CString( dead_character.IsFemale, 'morta', 'morto' )] [Select_CString( killer.IsFemale, 'pela', 'pelo' )] [killer.GetTitledFirstName]."
 death_management.1000.like:0 "Como pode um coração suportar esse tipo de dor sem se partir? Não é possível! No entanto, aqui estou eu, meu coração batendo enquanto o seu ficou em silêncio. Oh, [dead_character.GetFirstName], meu [dead_character.Custom('LoverPetName')]. A vida não será a mesma sem você."
 death_management.1000.murder:0 "[dead_character.GetTitledFirstName] foi [Select_CString( dead_character.IsFemale, 'assassinada', 'assassinado' )]!\n\n"
 death_management.1000.murder_wedding:0 "Ah, que morte completamente inesperada. Não planejada de forma alguma. Ninguém poderia prever!"
 death_management.1000.neutral:0 "[Select_CString( dead_character.IsFemale, 'Minha querida', 'Meu querido' )] [dead_character.GetFirstName]. Talvez eu não tenha te amado, mas sinto sua partida mais intensamente do que jamais pensei ser possível. Você sempre esteve presente, [Select_CString( dead_character.IsFemale, 'minha companheira', 'meu companheiro' )] constante. Será que eu te dei como [Select_CString( dead_character.IsFemale, 'certa', 'certo' )]? Há tantas coisas que deixei não ditas..."
 death_management.1000.plaguespouse:0 "Posso apenas observar em silêncio enquanto os médicos se afastam do corpo de [Select_CString( dead_character.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_character'))]. Me aproximo, estendendo a mão para [dead_character.GetSheHe]. Ainda está quente.\n\n"
 death_management.1000.plaguestart:0 "A doença e a pestilência continuam seu avanço devastador através de [realm.GetNameNoTier], derrubando tanto os grandes quanto os humildes. Essa verdade brutal e indiscriminada raramente se revela tão claramente quanto em momentos como este.\n\n"
 death_management.1000.t:0 "Até Que a Morte Nos Separe"
 death_management.1000.tt:0 "Seu cônjuge, [dead_character.GetTitledFirstName], [dead_character.GetDeathReasonHideKiller]."
 death_management.1001.a:0 "[dead_character.GetSheHe|U] não merecia isso."
 death_management.1001.c:0 "É tarde demais para se arrepender."
 death_management.1001.child:0 "Eu tinha tantas esperanças para você, [Select_CString( dead_character.IsFemale, 'minha doce filha', 'meu doce filho' )]. Todas as coisas que você aprenderia, experimentaria e faria. Havia tantas possibilidades, uma vida inteira para viver. Talvez você tivesse seus próprios filhos um dia. Mas agora, nada disso jamais acontecerá..."
 death_management.1001.d:0 "Descanse em paz, [Select_CString( dead_character.IsFemale, 'querida', 'querido' )] [dead_character.GetFirstNameNoTooltip]."
 death_management.1001.dislike:0 "Não é um dever de [ROOT.Char.Custom('MotherFather')] amar os seus filhos? No entanto, não consigo chorar pela morte d[Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetFirstNamePossessive]. Em algum momento, devo ter falhado, forçando [dead_character.GetSheHe] a seguir um caminho que eu nunca poderia aprovar. Embora eu possa ter culpa pelo que [dead_character.GetSheHe] se tornou, isso agora está no passado. Finalmente."
 death_management.1001.like:0 "Oh [ROOT.Char.GetFaith.HighGodName], como você pôde fazer isso com [Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetFirstName]? Se eu pequei, por que você não me puniu em seu lugar? [dead_character.GetSheHe|U] era inocente, [Select_CString( dead_character.IsFemale, 'minha perfeita', 'meu perfeito' )] [dead_character.Custom('GetDaughterSon')]! A vida tinha muito mais reservado para [dead_character.GetSheHe]..."
 death_management.1001.murder:0 "[dead_character.GetTitledFirstName] foi [Select_CString( dead_character.IsFemale, 'assassinada', 'assassinado' )]!\n\n"
 death_management.1001.neutral:0 "Eu pensei que já era velho demais para ser surpreendido pelas crueldades deste mundo, no entanto, nunca previ ter que experimentar a morte [Select_CString( dead_character.IsFemale, 'da minha própria', 'do meu próprio' )] [dead_character.Custom('GetDaughterSon')]. Minha única esperança é que [dead_character.GetSheHe] esteja sendo [Select_CString( dead_character.IsFemale, 'poupada', 'poupado' )] do sofrimento que devo suportar..."
 death_management.1001.plaguechild:0 "Meu estômago se contorce e se retorce em agonia silenciosa enquanto o corpo de [Select_CString( dead_character.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_character'))] [dead_character.GetFirstName] é levado diante de mim. Médicos e curandeiros trabalharam desde o amanhecer até o anoitecer para salvar [dead_character.GetSheHe], mas seus rostos sombrios diziam mais do que eles diriam.\n\nTão jovem, tão cheio de promessas. Tantos mais destinados a morrer assim.\n\n[ROOT.Char.GetFaith.HighGodName] nos salve."
 death_management.1001.t:0 "Sobrevivendo à Perda de [Select_CString( dead_character.IsFemale, 'uma Filha', 'um Filho' )]"
 death_management.1001.tt:0 "S[Select_CString( dead_character.IsFemale, 'ua', 'eu' )] [THIS.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_character'))], [dead_character.GetTitledFirstName], [dead_character.GetDeathReasonHideKiller]."
 death_management.1004.a.tt:0 "[Select_CString( dead_character.IsFemale, 'Sua amante', 'Seu amante' )], [dead_character.GetTitledFirstName], [dead_character.GetDeathReasonHideKiller]."
 death_management.1004.a:0 "Será que a dor algum dia desaparecerá?"
 death_management.1004.desc:0 "Há uma presença em minha cama, tão intensamente física quanto costumava ser o seu corpo quando você se enrolava ao meu redor. No entanto, essa presença não é você, [dead_character.GetFirstName], mas toda a saudade e angústia que você deixou. Durante o dia, eu me ocupo, mas aqui, onde as memórias são tão vívidas, não há escapatória."
 death_management.1004.t:0 "O Vazio Deixado"
 death_management.1005.a.tt:0 "[Select_CString( dead_character.IsFemale, 'Sua amiga', 'Seu amigo' )], [dead_character.GetTitledFirstName], [dead_character.GetDeathReasonHideKiller]."
 death_management.1005.a:0 "Você nunca será esquecido, [Select_CString( dead_character.IsFemale, 'velha amiga', 'velho amigo' )]."
 death_management.1005.desc.ritual_best_friend:0 "[dead_character.GetFirstName] está [Select_CString( dead_character.IsFemale, 'morta', 'morto' )]! [Select_CString( dead_character.IsFemale, 'Minha melhor e mais verdadeira amiga foi ceifada', 'Meu melhor e mais verdadeiro amigo foi ceifado' )], levado pelo abraço frio de [ROOT.Char.GetFaith.DeathDeityName] antes do seu tempo. Eu choro, lamento, arranco meus cabelos e rasgo minhas roupas, mas sei que nunca mais verei [dead_character.GetSheHe].\n\nComo... como posso continuar agora?\n\n[dead_character.GetFirstNameNoTooltip], [Select_CString( dead_character.IsFemale, 'querida', 'querido' )] e doce [dead_character.GetFirstNameNoTooltip], gostaria que eu continuasse, e tenho que esperar que a memória [dead_character.GetHerHim] possa me sustentar durante esses tempos sombrios, mas a vida parece uma vela sem chama sem [dead_character.GetSheHe]."
 death_management.1005.desc:0 "Oh, [dead_character.GetFirstName]. Se você ainda estivesse comigo, eu sei que você me diria para ser forte. Que as coisas vão melhorar. E você estaria [Select_CString( dead_character.IsFemale, 'certa', 'certo' )], como sempre foi, mas primeiro eu devo praguejar e chorar. Como eu não poderia quando você se foi deste mundo?"
 death_management.1005.t:0 "As Memórias Permanecem"
 death_management.1006.a.tt:0 "[Select_CString( dead_character.IsFemale, 'Sua', 'Seu' )] [rival|E], [dead_character.GetFullName], [dead_character.GetDeathReasonHideKiller]."
 death_management.1006.d:0 "Menos [Select_CString( dead_character.IsFemale, 'uma', 'um' )] [dead_character.GetHouse.GetBaseNameNoTooltip] para se preocupar!"
 death_management.1006.desc:0 "As reviravoltas do destino nem sempre estiveram a meu favor - [ROOT.Char.GetFaith.HighGodName] sabe que fui [Select_CString( ROOT.Char.IsFemale, 'amaldiçoado', 'amaldiçoado' )] no dia em que conheci [Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetTitledFirstName].\n\nHoje, no entanto, essa maldição foi desfeita! O destino sorriu para mim e levou [Select_CString( dead_character.IsFemale, 'aquela', 'aquele' )] [dead_character.Custom2('InsultNoun', ROOT.Char)] [dead_character.Custom2('InsultAdjective', ROOT.Char)] para o seu túmulo!"
 death_management.1006.e:0 "Finalmente, acho que posso deixar isso para trás."
 death_management.1006.f:0 "Nunca desafie a Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 death_management.1006.t:0 "Uma Maldição Desfeita"
 death_management.1007.a.tt:0 "[Select_CString( dead_character.IsFemale, 'Sua herdeira', 'Seu herdeiro' )], [dead_character.GetTitledFirstName], [dead_character.GetDeathReasonHideKiller]."
 death_management.1007.a:0 "Um conto termina e outro começa."
 death_management.1007.end:0 "ou se a morte [dead_character.GetHerHim] é uma bênção ou uma maldição para este [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 death_management.1007.mytitle:0 "Nunca saberemos que tipo de [ROOT.Char.GetTitleTierName] [dead_character.GetSheHe] teria se tornado,"
 death_management.1007.ruler:0 "Nunca saberemos que tipo de governante [dead_character.GetSheHe] teria se tornado,"
 death_management.1007.same_or_higher_tier:0 "Nunca saberemos se seu reinado teria unido nossas terras,"
 death_management.1007.start:0 "Hoje, com a partida de [dead_character.GetTitledFirstName], o futuro do [ROOT.Char.GetPrimaryTitle.GetNameNoTier] mudou de curso."
 death_management.1007.start_murder:0 "[dead_character.GetTitledFirstName] foi [Select_CString( dead_character.IsFemale, 'assassinada', 'assassinado' )]!"
 death_management.1007.t:0 "Um Giro do Destino"
 death_management.1008.a.tt:0 "[Select_CString( spouse_of_dead_character.IsFemale, 'A', 'O' )] cônjuge d[Select_CString( spouse_of_dead_character.IsFemale, 'a', 'o' )] [spouse_of_dead_character.GetFirstName], [dead_character.GetTitledFirstName], [dead_character.GetDeathReason]."
 death_management.1008.a:0 "Descanse em paz."
 death_management.1008.desc:0 "[dead_character.GetTitledFirstName], [Select_CString( dead_character.IsFemale, 'a', 'o' )] cônjuge [Select_CString( spouse_of_dead_character.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse_of_dead_character'))] [spouse_of_dead_character.GetFirstName], faleceu. Todos aqueles planos cuidadosamente elaborados foram arruinados pelo capricho volúvel de [ROOT.Char.GetFaith.DeathDeityName], embora tais reclamações possam parecer insignificantes e insubstanciais em comparação com a dor da família [dead_character.GetHerHim]..."
 death_management.1009.a.tt:0 "[Select_CString( dead_character.IsFemale, 'A prometida', 'O prometido' )] d[Select_CString( betrothed_of_dead_character.IsFemale, 'a', 'o' )] [betrothed_of_dead_character.GetFirstName], [dead_character.GetTitledFirstName], [THIS.Char.Custom('DiedHouse_arrest')] e o acordo de casamento está anulado."
 death_management.1009.a:0 "Descanse em paz, [Select_CString( dead_character.IsFemale, 'pequena', 'pequeno' )]."
 death_management.1009.desc:0 "[dead_character.GetTitledFirstName], [Select_CString( dead_character.IsFemale, 'a prometida', 'o prometido' )] [Select_CString( betrothed_of_dead_character.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('betrothed_of_dead_character'))] [betrothed_of_dead_character.GetFirstName], faleceu. Todos aqueles planos cuidadosamente elaborados foram arruinados pelo capricho volúvel de [ROOT.Char.GetFaith.DeathDeityName], embora tais reclamações possam parecer insignificantes e insubstanciais em comparação com a dor da família [dead_character.GetHerHim]..."
 death_management.1009.t:0 "Uma Tragédia Inesperada"
 death_management.1010.12_or_over:0 "Trouxeram-me a notícia enquanto eu me preparava para minhas lições, e eu não sabia mais o que fazer comigo mesmo. [Select_CString( dead_character.IsFemale, 'Minha professora', 'Meu professor' )], [dead_character.GetTitledFirstName], faleceu.\n\nMesmo enquanto viajo para casa, parece estranho que nunca mais verei [dead_character.GetSheHe]."
 death_management.1010.a.tt:0 "Com a morte d[Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetTitledFirstName], você não tem mais tutor."
 death_management.1010.murderer:0 "À medida que a notícia de que [Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetTitledFirstName] faleceu se espalha pelos corredores, tenho que lutar para manter meu rosto sob controle.\n\nSó quando estou em uma carruagem a caminho de casa é que realmente afunda... [dead_character.GetSheHe] se foi."
 death_management.1010.over_12_disliked_educator:0 "Bom livramento, de verdade."
 death_management.1010.over_12_liked_educator:0 "Você me ensinou tanto, [dead_character.GetFirstName]."
 death_management.1010.t:0 "Sem Mais Lições"
 death_management.1010.under_12:0 "É um pouco confuso - como tudo passou d[Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetTitledFirstName] falhando em me chamar para minhas lições em uma manhã, para agora, sentado em uma carruagem rumo a casa.\n\nQuando perguntei por que [Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetFirstName] não estava me acompanhando, os sussurros ao meu redor aos poucos deixaram claro que não verei [dead_character.GetSheHe] novamente."
 death_management.1010.under_12_disliked_educator:0 "De qualquer forma, eu quero um novo professor!"
 death_management.1010.under_12_liked_educator:0 "Eu gostaria que [dead_character.GetSheHe] tivesse se despedido, pelo menos."
 death_management.1200.a:0 "[battle_death_killer.GetFirstNameNoTooltip] é [Select_CString( battle_death_killer.IsFemale, 'uma', 'um' )] [battle_death_killer.GetWomanMan] [Select_CString( battle_death_killer.IsFemale, 'morta', 'morto' )]! Morra!"
 death_management.1200.b:0 "Nunca vou esquecer de você..."
 death_management.1200.c:0 "Você provou sua valentia, meu amor..."
 death_management.1200.d:0 "Finalmente, estou livre!"
 death_management.1200.desc_happy:0 "\n\nFinalmente, [Select_CString( dead_character.IsFemale, 'aquela', 'aquele' )] [dead_character.Custom2('InsultNoun', ROOT.Char)] está [Select_CString( dead_character.IsFemale, 'morta', 'morto' )]!"
 death_management.1200.desc_sad:0 "\n\nNão deveria ter deixado [dead_character.GetSheHe] partir... não assim..."
 death_management.1200.t:0 "Cônjuge Caído"
 death_management.1201.a:0 "[battle_death_killer.GetFirstNameNoTooltip] não sairá impune!"
 death_management.1201.b:0 "#EMP [Select_CString( dead_character.IsFemale, 'Minha corajosa', 'Meu corajoso' )] [dead_character.Custom('GetDaughterSon')]...#!"
 death_management.1201.c:0 "Não era sua hora, [Select_CString( dead_character.IsFemale, 'minha filha', 'meu filho' )]..."
 death_management.1201.d:0 "Descanse em paz, [Select_CString( dead_character.IsFemale, 'minha filha', 'meu filho' )]."
 death_management.1201.desc:0 "\n\nEu não poderia ter salvado [dead_character.GetSheHe]... nenhum pai deveria viver com [Select_CString( dead_character.IsFemale, 'sua filha morta', 'seu filho morto' )]..."
 death_management.1201.t:0 "[Select_CString( dead_character.IsFemale, 'Filha Caída', 'Filho Caído' )]"
 death_management.1202.a:0 "#EMP Por que você, [dead_character.Custom('GetMamaPapa')]?#!"
 death_management.1202.b:0 "[battle_death_killer.GetFirstNameNoTooltip] pagará por isso."
 death_management.1202.desc:0 "\n\nÉ tarde demais para mudar as coisas, só espero que [dead_character.GetSheHe] encontre paz em [dead_character.GetFaith.PositiveAfterLife]."
 death_management.1202.t:0 "[Select_CString( dead_character.IsFemale, 'Mãe Caída', 'Pai Caído' )]"
 death_management.1204.a:0 "#EMP [Select_CString( dead_character.IsFemale, 'Minha corajosa', 'Meu corajoso' )] [dead_character.GetFirstNameNoTooltip]#!..."
 death_management.1204.b:0 "...você será [Select_CString( dead_character.IsFemale, 'vingada', 'vingado' )]!"
 death_management.1204.desc:0 "\n\nMeu coração se transforma em gelo, pois percebo que nunca mais sentirei o calor do abraço do meu amado..."
 death_management.1204.t:0 "Amante [Select_CString( dead_character.IsFemale, 'Caída', 'Caído' )]"
 death_management.1205.a:0 "Não, [dead_character.GetFirstNameNoTooltip]!"
 death_management.1205.b:0 "[battle_death_killer.GetFirstNameNoTooltip] pagará por isso!"
 death_management.1205.desc:0 "\n\nNunca mais compartilharei a preciosa companhia de [Select_CString( dead_character.IsFemale, 'minha amiga', 'meu amigo' )]..."
 death_management.1205.t:0 "[Select_CString( dead_character.IsFemale, 'Amiga Caída', 'Amigo Caído' )]"
 death_management.1206.a:0 "Belo livramento."
 death_management.1206.b:0 "A morte d[Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetFirstNameNoTooltip] deveria ter sido pelas minhas mãos!"
 death_management.1206.c:0 "Meu #EMP herói!#! Enviarei [Select_CString( battle_death_killer.IsFemale, 'a', 'o' )] [battle_death_killer.GetFirstNameNoTooltip] uma [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')]!"
 death_management.1206.desc:0 "\n\nNão consigo deixar de sorrir ao pensar que [Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetFirstNameNoTooltip] morreu lutando #EMP minhas#! guerras, isso elevará meu espírito por dias!"
 death_management.1206.t:0 "[Select_CString( dead_character.IsFemale, 'Rival Caída', 'Rival Caído' )]"
 death_management.1207.a:0 "Você não estava [Select_CString( dead_character.IsFemale, 'preparada', 'preparado' )]..."
 death_management.1207.b:0 "...mas [battle_death_killer.GetFirstNameNoTooltip] também não está!"
 death_management.1207.desc:0 "\n\nA sucessão do [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] deve ser reavaliada..."
 death_management.1207.t:0 "[Select_CString( dead_character.IsFemale, 'Herdeira Caída', 'Herdeiro Caído' )]"
 death_management.2000.a:0 "[Select_CString( prison_holder.IsFemale, 'Essa', 'Esse' )] [prison_holder.Custom2('InsultNoun', ROOT.Char)] [prison_holder.Custom2('InsultAdjective', ROOT.Char)] possa te levar embora de mim..."
 death_management.2000.b:0 "É um crime imperdoável!"
 death_management.2000.c:0 "É imperdoável!"
 death_management.2000.d:0 "Que maneira de partir, não é mesmo..."
 death_management.2000.dislike:0 "[dead_character.GetWifeHusband|U], ao expirar seu último suspiro, um alívio me invadiu, assim como a raiva. Talvez eu devesse me envergonhar, mas na verdade, não havia amor perdido entre nós."
 death_management.2000.dislike_end:0 "No entanto, o insulto de [Select_CString( dead_character.IsFemale, 'tê-la', 'tê-lo' )] perecer nas masmorras de [Select_CString( prison_holder.IsFemale, 'uma', 'um' )] [prison_holder.Custom2('InsultNoun', ROOT.Char)] [prison_holder.Custom2('InsultAdjective', ROOT.Char)] como [Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetFirstName]..."
 death_management.2000.dislike_end_killer:0 "No entanto, o insulto de [Select_CString( dead_character.IsFemale, 'tê-la', 'tê-lo' )] perecer nas mãos de [Select_CString( prison_holder.IsFemale, 'uma', 'um' )] [prison_holder.Custom2('InsultNoun', ROOT.Char)] [prison_holder.Custom2('InsultAdjective', ROOT.Char)] como [prison_holder.GetTitledFirstName]..."
 death_management.2000.dislike_end_no_killer:0 "$death_management.2000.dislike_end$"
 death_management.2000.dislike_end_unknown_killer:0 "No entanto, o insulto de [Select_CString( dead_character.IsFemale, 'tê-la', 'tê-lo' )] perecer nas mãos de um assassino..."
 death_management.2000.like:0 "Como um coração pode suportar esse tipo de dor sem se partir? Não pode ser possível! No entanto, aqui estou eu, meu coração batendo enquanto o seu se calou.\n\nOh, [dead_character.GetFirstName], meu [dead_character.Custom('LoverPetName')]."
 death_management.2000.like_end:0 "Não consigo tirar da minha cabeça a imagem de você definhar, [Select_CString( dead_character.IsFemale, 'trancada', 'trancado' )] na masmorra d[Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitledFirstNamePossessive]."
 death_management.2000.like_end_killer:0 "Não consigo tirar da minha cabeça a imagem d[Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitledFirstName] tirando sua vida."
 death_management.2000.murderer:0 "Oh, [dead_character.GetFirstName], a vida poderia ter sido ainda mais longa juntos, mas foi assim que tinha que ser.\n\nNão me agrada ter o seu sangue nas minhas mãos, mas eu sei que se você pudesse dizer, você teria querido que eu seguisse em frente e encontrasse a felicidade."
 death_management.2000.neutral:0 "[Select_CString( dead_character.IsFemale, 'Minha querida', 'Meu querido' )] [dead_character.GetFirstName]. Talvez eu não tenha te amado, mas sinto sua partida de maneira mais intensa do que jamais pensei ser possível. Você sempre esteve lá, [Select_CString( dead_character.IsFemale, 'minha companheira', 'meu companheiro' )] constante."
 death_management.2000.neutral_end:0 "Pensar que você pereceria nas masmorras d[Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitledFirstNamePossessive]..."
 death_management.2000.neutral_end_killer:0 "Pensar que [Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitledFirstName] te tiraria de mim de forma tão violenta..."
 death_management.2000.t.no_killer:0 "Arrancado"
 death_management.2000.t.root_killer:0 "'Até eu nos separar"
 death_management.2000.t:0 "'Até que [Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetFirstNameNoTooltip] nos separe"
 death_management.2000.tt:0 "[Select_CString( dead_character.IsFemale, 'Sua', 'Seu' )] cônjuge, [dead_character.GetTitledFirstName], faleceu nas masmorras d[Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitledFirstName]."
 death_management.2001.a:0 "[dead_character.GetSheHe|U] não merecia isso."
 death_management.2001.c:0 "É tarde demais para arrependimentos."
 death_management.2001.child:0 "Eu tinha tantas esperanças para você, [Select_CString( dead_character.IsFemale, 'minha doce filha', 'meu doce filho' )]. Todas as coisas que você aprenderia, vivenciaria e faria. Havia tantas possibilidades, uma vida inteira para viver. Talvez você tivesse filhos próprios um dia. Mas agora, nada disso jamais acontecerá, tudo por causa d[Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitledFirstName]..."
 death_management.2001.d:0 "Descanse em paz, [Select_CString( dead_character.IsFemale, 'pequena', 'pequeno' )] [dead_character.GetFirstNameNoTooltip]."
 death_management.2001.dislike:0 "Não é dever de [Select_CString( ROOT.Char.IsFemale, 'uma', 'um' )] [ROOT.Char.Custom('MotherFather')] amar seus filhos? No entanto, não consigo me forçar a chorar pela morte d[Select_CString( dead_character.IsFemale, 'a', 'o' )] [dead_character.GetFirstNamePossessive]."
 death_management.2001.dislike_end:0 "Sinto apenas raiva pelo insulto que [Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitleTierName] me infligiu ao fazer [Select_CString( dead_character.IsFemale, 'minha', 'meu' )] [dead_character.Custom('GetDaughterSon')] definhar em suas masmorras."
 death_management.2001.dislike_end_killer:0 "Sinto apenas raiva pelo insulto que [Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitleTierName] me infligiu ao fazer [Select_CString( dead_character.IsFemale, 'minha', 'meu' )] [dead_character.Custom('GetDaughterSon')] perecer por suas mãos."
 death_management.2001.like:0 "Oh, [ROOT.Char.GetFaith.HighGodName], como você permitiu que [Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitledFirstName] fizesse isso [Select_CString( dead_character.IsFemale, 'a', 'ao' )] [dead_character.GetFirstName]?"
 death_management.2001.like_end:0 "Eu rezo para que [Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.Custom2('InsultNoun', ROOT.Char)] [prison_holder.Custom2('InsultAdjective', ROOT.Char)] [Select_CString( prison_holder.IsFemale, 'da', 'do' )] [prison_holder.GetFirstName] não encontre descanso, nem paz, nem #EMP amor#!, como pagamento por permitir que [Select_CString( dead_character.IsFemale, 'minha', 'meu' )] [dead_character.Custom('GetDaughterSon')] definhasse nas masmorras [prison_holder.GetHerHim]."
 death_management.2001.like_end_killer:0 "Eu rezo para que [Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.Custom2('InsultNoun', ROOT.Char)] [prison_holder.Custom2('InsultAdjective', ROOT.Char)] [Select_CString( prison_holder.IsFemale, 'da', 'do' )] [prison_holder.GetFirstName] não encontre descanso, nem paz, nem #EMP amor#!, como pagamento por ter tirado a vida [Select_CString( dead_character.IsFemale, 'da minha', 'do meu' )] [dead_character.Custom('GetDaughterSon')]."
 death_management.2001.neutral:0 "Eu achei que já estava [Select_CString( ROOT.Char.IsFemale, 'velha', 'velho' )] demais para me surpreender com as crueldades desse mundo, mas eu nunca previ ter que experimentar a morte [Select_CString( dead_character.IsFemale, 'da minha própria', 'do meu próprio' )] [dead_character.Custom('GetDaughterSon')] pelas mãos d[Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitledFirstName]. Minha única esperança é que [dead_character.GetSheHe] agora esteja [Select_CString( dead_character.IsFemale, 'poupada', 'poupado' )] do sofrimento que [dead_character.GetSheHe] deve ter suportado..."
 death_management.2001.opening:0 "[Select_CString( dead_character.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('dead_character'))], [dead_character.GetTitledFirstName], faleceu!\n\n"
 death_management.2001.t:0 "Sobrevivendo a um Filho"
 death_management.2001.tt:0 "[Select_CString( dead_character.IsFemale, 'Sua', 'Seu' )] [dead_character.Custom('GetDaughterSon')], [dead_character.GetTitledFirstName], faleceu nas masmorras d[Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitledFirstName]."
 death_management.2002.a:0 "Eu sempre te amarei, [dead_character.Custom('MotherFather')]."
 death_management.2002.b:0 "Acho que nunca saberei..."
 death_management.2002.c:0 "Garantirei que [prison_holder.GetSheHe] pague."
 death_management.2002.child:0 "[dead_character.Custom('MotherFather')|U]? Por que você se foi? Disseram que você não pôde evitar, que foi [Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitledFirstName] a razão pela qual você teve que partir. Mas por que [prison_holder.GetSheHe] te levou longe de mim, [dead_character.Custom('MotherFather')]?"
 death_management.2002.d:0 "Eu... Eu quero [Select_CString( dead_character.IsFemale, 'minha', 'meu' )] [dead_character.Custom('MotherFather')]!"
 death_management.2002.dislike:0 "Seu sangue pode correr em minhas veias, mas você nunca foi [Select_CString( dead_character.IsFemale, 'uma verdadeira', 'um verdadeiro' )] [dead_character.Custom('MotherFather')] para mim. Se sua morte pelas mãos d[Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitledFirstName] não tivesse sido um insulto tão grande, eu não teria sentido nada além de alívio com sua partida."
 death_management.2002.like:0 "Oh, [dead_character.Custom('MotherFather')]. Eu posso ser [Select_CString( ROOT.Char.IsFemale, 'adulta', 'adulto' )] agora, mas eu sempre fui [Select_CString( ROOT.Char.IsFemale, 'sua filha', 'seu filho' )]. O que farei agora, quando [Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitledFirstName] te tirou de mim e deste mundo? Quem me abraçará quando meus olhos forem cegados pelas lágrimas?"
 death_management.2002.neutral:0 "Podemos não ter sido próximos, [dead_character.GetFirstName], mas você sempre será [Select_CString( dead_character.IsFemale, 'minha', 'meu' )] [dead_character.Custom('MotherFather')]. Pensar que [Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitledFirstName] te levaria de mim de forma tão cruel, deixando-me com tantas perguntas. O que possuía [Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitleTierName] para cometer um crime tão hediondo? Eu tomei como garantido? [dead_character.Custom('MotherFather')|U]... Você realmente me amava?"
 death_management.2002.t:0 "O Descanso Eterno"
 death_management.2002.tt:0 "[Select_CString( dead_character.IsFemale, 'Sua', 'Seu' )] [dead_character.Custom('MotherFather')], [dead_character.GetTitledFirstName], faleceu nas masmorras d[Select_CString( prison_holder.IsFemale, 'a', 'o' )] [prison_holder.GetTitledFirstName]."
