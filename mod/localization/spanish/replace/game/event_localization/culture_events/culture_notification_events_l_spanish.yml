l_spanish:
 culture_notification.0010.desc:0 "A [culture|E] [this_player.GetCulture.GetName] abandonou a [tradition|E] [tradition.GetName]"
 culture_notification.0010.t:0 "Tradição Abandonada"
 culture_notification.0011.desc:0 "A [culture|E] [this_player.GetCulture.GetName] adotou a [tradition|E] [tradition.GetName]"
 culture_notification.0011.t:0 "Tradição Adotada"
 culture_notification.1001.desc:0 "[founder.GetTitledFirstName] formou a [hybrid_culture|E] [new_culture.GetName|V] a partir das Culturas [parent_1.GetName] e [parent_2.GetName]"
 culture_notification.1001.t:0 "Cultura Híbrida: [new_culture.GetNameNoTooltip|V]"
 culture_notification.1011.a.founder:0 "$culture_notification.1111.a.founder$"
 culture_notification.1011.a.other:0 "$culture_notification.1111.a.other$"
 culture_notification.1011.blend:0 "A mistura é evidente. Eles mantêm a tradição [parent_1.GetNameNoTooltip] de [tradition_1.GetName] junto com o costume [parent_2.GetNameNoTooltip] de [tradition_2.GetName]. Juntos, eles definem este novo povo."
 culture_notification.1011.blend_fallback:0 "Nenhum dos progenitores reivindica a maior parte — o caminho [new_culture.GetNameNoTooltip] mescla ambos os mundos perfeitamente."
 culture_notification.1011.hybrid_no_primary:0 "O povo [new_culture.GetNameNoTooltip] adotou uma mistura equilibrada de elementos de ambas as Culturas, formando uma verdadeira Cultura híbrida que combina perfeitamente elementos de ambos os mundos."
 culture_notification.1011.hybrid_primary_1:0 "Tradições e valores [parent_1.GetNameNoTooltip] formam a base dessa nova Cultura, enquanto vários atributos [parent_2.GetNameNoTooltip] foram adaptados e integrados para atender às necessidades de sua nova sociedade."
 culture_notification.1011.hybrid_primary_2:0 "Tradições e valores [parent_2.GetNameNoTooltip] formam a base dessa nova Cultura, enquanto vários atributos [parent_1.GetNameNoTooltip] foram adaptados e integrados para atender às necessidades de sua nova sociedade."
 culture_notification.1011.intro:0 "Impulsionados por relações positivas e aumento do intercâmbio cultural, os povos [parent_1.GetName] e [parent_2.GetName] tornaram-se cada vez mais próximos ao longo dos anos. Agora, indivíduos dessas sociedades começaram a se enxergar não apenas como um ou outro, mas como ambos simultaneamente — uma nova Cultura [new_culture.GetName].\n\n"
 culture_notification.1011.outro.founder:0 "$culture_notification.1111.outro.founder$"
 culture_notification.1011.outro.other:0 "$culture_notification.1111.outro.other$"
 culture_notification.1011.t:0 "A Hibridização da Cultura [new_culture.GetNameNoTooltip]"
 culture_notification.1101.desc:0 "[founder.GetTitledFirstName] criou a [new_culture.GetName|V], uma [divergent_culture|E] de [parent_1.GetName]"
 culture_notification.1101.t:0 "Cultura Divergida: [new_culture.GetNameNoTooltip|V]"
 culture_notification.1111.a.founder:0 "Para uma nova era, um novo povo!"
 culture_notification.1111.a.other:0 "Vamos ver como a situação se desenvolve."
 culture_notification.1111.ethos.bellicose:0 "Diante das pressões crescentes tanto da natureza selvagem quanto de seus rivais, os [new_culture.GetCollectiveNounNoTooltip] estão se tornando cada vez mais belicosos enquanto buscam garantir e proteger seu sustento pela força das armas."
 culture_notification.1111.ethos.bureaucratic:0 "Os [new_culture.GetCollectiveNounNoTooltip] parecem estar desenvolvendo um apetite crescente por leis verbosas, crônicas longas e estatutos labirínticos, encontrando conforto em uma sociedade regida por práticas formais em constante expansão."
 culture_notification.1111.ethos.communal:0 "Ao ajudar seus vizinhos em momentos de tragédia e compartilhar seus triunfos, os [new_culture.GetCollectiveNounNoTooltip] estão formando laços estreitos de comunidade que promovem um senso de pertencimento e propósito."
 culture_notification.1111.ethos.courtly:0 "Com uma dedicação crescente às maneiras e etiqueta, os [new_culture.GetCollectiveNounNoTooltip] estão abraçando um estilo de vida estruturado e cortês para trazer uma nova era de estabilidade e prosperidade."
 culture_notification.1111.ethos.egalitatian:0 "Reconhecendo que as circunstâncias do nascimento nem sempre preveem habilidade e competência, os [new_culture.GetCollectiveNounNoTooltip] estão se tornando mais igualitários e abertos como sociedade."
 culture_notification.1111.ethos.spiritual:0 "Ao buscar respostas tanto dentro de si mesmos quanto no mundo em geral, os [new_culture.GetCollectiveNounNoTooltip] estão se tornando mais espirituais e devotos do que nunca."
 culture_notification.1111.ethos.stoic:0 "Diante de um mundo perigoso e imprevisível, os [new_culture.GetCollectiveNounNoTooltip] estão valorizando cada vez mais a coragem e a determinação."
 culture_notification.1111.ethos.unchanged:0 "Com sua visão de vida fundamentalmente inalterada, as diferenças entre os [new_culture.GetCollectiveNounNoTooltip] e os [parent_1.GetCollectiveNounNoTooltip] parecem mais políticas do que qualquer outra coisa — mas o fato permanece que divisões de tradição, política e fronteiras transformaram um grupo de pessoas em dois."
 culture_notification.1111.intro:0 "Pequenas mudanças no dialeto, costumes ligeiramente diferentes... Foi fácil não perceber no início. Com o tempo, pequenas mudanças levaram a grandes mudanças, no entanto, e agora os [parent_1.GetCollectiveNoun] que vivem no [founder.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] começaram a se identificar como [new_culture.GetName] em vez disso.\n\n"
 culture_notification.1111.outro.founder:0 "\n\nCom as pessoas de [new_culture.GetNameNoTooltip] agora buscando orientação em mim, é hora de preparar o palco para o nosso futuro compartilhado."
 culture_notification.1111.outro.other:0 "\n\nSeja por manipulação habilidosa ou um desejo genuíno de liderar seu povo para uma nova era, [founder.GetTitledFirstName] se posicionou como o líder desse despertar cultural."
 culture_notification.1111.t:0 "A Divergência da Cultura [new_culture.GetNameNoTooltip]"
 culture_notification.1111.tradition.lost:0 "Os caminhos [lost_tradition.GetName] dos [parent_1.GetCollectiveNounNoTooltip] foram postos de lado."
 culture_notification.1111.tradition.new:0 "As tradições de seus antepassados estão dando lugar a [new_tradition.GetName]."
 culture_notification_hybrid_tooltip:0 "A [hybrid_culture|E] [new_culture.GetName] formou-se a partir das [cultures|E] [parent_1.GetName] e [parent_2.GetName]."
 culture_notification_tooltip:0 "A [divergent_culture|E] [new_culture.GetName] se ramificou a partir da [culture|E] de [parent_1.GetName]."
