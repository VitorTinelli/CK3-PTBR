l_spanish:
 artifact.0011.t:0 "[this_artifact.Custom('InventoryCourtArtifact')] Perdido!"
 artifact.0011.tooltip:0 "Você perdeu o artefato [this_artifact.GetName] para [owner.GetTitledFirstNameNoTooltip]"
 artifact.0012.t:0 "Artefatos Obtidos!"
 artifact.0012.t_1:0 "Artefato Obtido!"
 artifact.0012.tooltip:0 "Você adquiriu o artefato [this_artifact.GetName] de [old_owner.GetTitledFirstNameNoTooltip]"
 artifact.0021.t:0 "[this_artifact.Custom('InventoryCourtArtifact')] Destruido!"
 artifact.1001.a.tt.free:0 "#instruction Este [artifact|E] pode ser convertido gratuitamente!#!"
 artifact.1001.a.tt:0 "[this_artifact.GetName] é convertido em um [court_artifact|E] fornecendo apenas [grandeur|E] e [prestige|E]"
 artifact.1001.a:0 "Um empreendimento que vale a pena."
 artifact.1001.b:0 "Não, é muito caro."
 artifact.1001.desc.antiquarian:0 "Meu antiquário [antiquarian.GetTitledFirstName] se aproxima de mim, segurando meu artefato [this_artifact.GetName] em suas mãos."
 artifact.1001.desc.kills_many:0 "[this_artifact.GetDesc]\n\nEmbora não seja mais adequada para batalha, as [ROOT.Var('num_kills').GetValue|V0] vidas que esta arma ceifou a tornaram um símbolo de habilidade marcial, digna de ser exibida no salão de um grande guerreiro."
 artifact.1001.desc.kills_none:0 "[this_artifact.GetDesc]\n\nNunca tendo sido usado em combate, esta arma serve apenas como um enfeite para pendurar na parede de algum nobre."
 artifact.1001.desc.kills_one:0 "[this_artifact.GetDesc]\n\nTendo sido usada uma vez para matar um inimigo em batalha, esta arma provou seu valor o suficiente para ser exibida na sala de um governante."
 artifact.1001.desc.kills_some:0 "[this_artifact.GetDesc]\n\nTendo matado [ROOT.Var('num_kills').GetValue|V0] inimigos em batalha, esta arma conquistou seu lugar no salão de um grande guerreiro ou governante."
 artifact.1001.desc.kills_tons:0 "[this_artifact.GetDesc]\n\nEmbora não seja mais adequada para batalha, as [ROOT.Var('num_kills').GetValue|V0] vidas que esta arma ceifou a tornam um símbolo lendário de habilidade marcial, inspirando admiração ou medo em todos que a contemplam."
 artifact.1001.desc.other:0 "\n\n\"Milorde, enquanto eu estava arrumando o depósito, notei que este [SCOPE.Custom('ThisArtifactType')] está tão velho que está praticamente desmoronando! O que devemos fazer com ele?'\"\n\nEu examino o [SCOPE.Custom('ThisArtifactType')]. Embora nenhum reparo possa torná-lo utilizável novamente, seria possível limpá-lo e preservá-lo para exibição com um custo marginal."
 artifact.1001.desc.servant:0 "Um dos meus servos se aproxima de mim, segurando meu artefato [this_artifact.GetName] em suas mãos."
 artifact.1001.desc.weapon:0 "\n\n\"Milorde, enquanto eu estava limpando a armaria, notei que este [SCOPE.Custom('ThisArtifactType')] aqui enferrujou até quase desaparecer. O que devemos fazer com ele?'\"\n\nEu examino o [SCOPE.Custom('ThisArtifactType')]. Embora nenhum reparo possa torná-lo digno de batalha novamente, seria possível limpá-lo e preservá-lo para exibição com um custo marginal."
 artifact.1001.t:0 "Cinzas ao Cair, Ferrugem ao...?"
 artifact.3000.a:0 "Isso me entristece, mas prossiga."
 artifact.3000.b:0 "Ainda é possível salvá-lo!"
 artifact.3000.c:0 "Aposto que foi #EMP você#! quem o quebrou!"
 artifact.3000.desc.antiquarian:0 "\n\n\"Provavelmente é tarde demais para restaurá-lo agora, mas nem tudo está perdido. Se me permitir, posso desmontá-lo e utilizar as partes úteis em um futuro artefato!\""
 artifact.3000.desc.antiquarian_intro:0 "Meu $antiquarian_court_position$, [antiquarian.GetTitledFirstName], aproxima-se de mim com uma expressão preocupada em seu rosto.\n\n\"M[Select_CString( ROOT.GetCharacter.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.GetLadyLord], estou cada vez mais preocupad[Select_CString( antiquarian.IsFemale, 'a', 'o' )] com o seu artefato [this_artifact.GetName] e o estado de total abandono em que caiu. Está se desfazendo!"
 artifact.3000.desc.armorer_intro:0 "Meu $armorer_camp_officer$, [antiquarian.GetTitledFirstName], aproxima-se de mim com uma expressão preocupada em seu rosto.\n\n\"M[Select_CString( ROOT.GetCharacter.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.GetLadyLord], estou cada vez mais preocupad[Select_CString( antiquarian.IsFemale, 'a', 'o' )] com o seu artefato [this_artifact.GetName] e o estado de total abandono em que caiu. Está se desfazendo!"
 artifact.3000.desc.servant:0 "\"Sem um especialista na corte, pode não ser possível restaurá-lo à sua antiga glória, mas podemos pelo menos guardar as peças para serem reutilizadas em um novo artefato...\""
 artifact.3000.desc.servant_intro:0 "Um servo se aproxima de mim com uma expressão culpada em seu rosto e algo escondido atrás de suas costas.\n\n\"[Select_CString( ROOT.GetCharacter.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.GetLadyLord], eu estava limpando sua coleção de artefatos como de costume quando percebi o estado de completa deterioração do seu artefato [this_artifact.GetName]."
 artifact.3000.t:0 "Artefato Degradado: Reutilização"
 artifact.3001.a:0 "Essa é uma ótima notícia!"
 artifact.3001.desc:0 "É com um sorriso no rosto que [inspiration_owner.GetFirstName] se aproxima de mim hoje.\n\n\"[Select_CString( ROOT.GetCharacter.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.GetLadyLord]! Enquanto procurava inspiração entre itens descartados e quinquilharias quebradas nas suas salas de armazenamento, encontrei um tesouro inesperado. Parece que você deixou alguns materiais sobressalentes de um artefato desmontado guardados para o futuro... Bem, o futuro é agora!\n\nSe eu utilizar essas peças sobressalentes no meu projeto, a qualidade não será afetada, e eu posso lhe devolver uma parte do ouro que você reservou para comprar materiais!\""
 artifact.3001.t:0 "Inspiração: Reutilização"
 artifact.3010.a.tt:0 "[this_artifact.GetNameNoTooltip|U] é vendido ao comerciante e perdido para sempre."
 artifact.3010.a:0 "Está bem, eu não precisava dele mesmo."
 artifact.3010.b:0 "Esse artefato é #EMP MEU!#!"
 artifact.3010.desc.antiquarian:0 "\n\n\"Talvez um comerciante de sucatas esteja interessado em comprar as peças por um preço adequado...\""
 artifact.3010.desc.servant:0 "\n\n\"Ele está completamente inútil e irreconhecível agora! Você poderia vendê-lo para um colecionador de sucatas e ganhar algumas moedas de ouro com isso...\""
 artifact.3010.t:0 "Artefato Deteriorado: Venda"
 artifact.3020.a:0 "Pelo menos ainda serve para alguma coisa..."
 artifact.3020.b:0 "Apenas faça seu trabalho e conserte-o!"
 artifact.3020.desc:0 "\n\n\"Pode ser que nunca recupere sua utilidade original, mas, se me permitir, posso ao menos recuperar uma parte dele como uma lembrança de glórias passadas! Afinal, foi um poderoso símbolo de seu poder por um tempo...\""
 artifact.3020.t:0 "Artefato Deteriorado: Adaptar"
 artifact.3030.a.bigfailure.t:0 "Artefato Destruído!"
 artifact.3030.a.bigfailure:0 "O artefato foi destruído"
 artifact.3030.a.bigsuccess.t:0 "Artefato Restaurado e Melhorado"
 artifact.3030.a.bigsuccess:0 "O artefato está mais limpo e mais forte do que nunca"
 artifact.3030.a.failure.t:0 "Tratamento Inútil"
 artifact.3030.a.failure:0 "O tratamento não foi bem-sucedido"
 artifact.3030.a.success.t:0 "Artefato Reparado"
 artifact.3030.a.success:0 "O artefato está reparado"
 artifact.3030.a:0 "Claro, não pode ficar pior do que isso..."
 artifact.3030.b:0 "Você #EMP não#! vai tocá-lo com essa mistura!"
 artifact.3030.desc:0 "\n\n\"Para salvá-lo, tenho uma proposta. Recentemente, ganhei um rolo empoeirado em um jogo de dados com um personagem suspeito em uma feira itinerante - um negócio muito afortunado, já que seu conteúdo se encaixa perfeitamente em meu crescente interesse pela alquimia! O velho rolo descreve uma poção secreta que garante tornar #EMP qualquer artefato#! ainda melhor do que novo. Por favor, deixe-me tentar!\""
 artifact.3030.t:0 "Artefato Deteriorado: Preservar"
 artifact.3040.a:0 "Eu sabia que havia uma pegadinha... Mas tudo bem!"
 artifact.3040.b:0 "Vamos considerar que estamos quites, então."
 artifact.3040.c:0 "Eu não preciso da sua ajuda."
 artifact.3040.desc.antiquarian:0 "\"Meu $antiquarian_court_position$ [antiquarian.GetTitledFirstName] se aproxima de mim acompanhado por [vassal.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n\"[Select_CString( ROOT.GetCharacter.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.GetLadyLord], fui informado de que seu artefato [this_artifact.GetName] está em condições terríveis... Apesar dos meus melhores esforços, não posso fazer mais nada para preservá-lo sem financiamento adequado!\n\nNo entanto, encontrei uma possível solução para poupar seus cofres. [vassal.GetTitledFirstNameNoTooltip|U] se ofereceu para arcar com as despesas em troca de um mero gesto de gratidão.\""
 artifact.3040.desc.no_antiquarian:0 "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim com uma expressão falsamente contrita que já me faz temer as próximas palavras [vassal.GetHerHim].\n\n\"\"[Select_CString( ROOT.GetCharacter.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.GetLadyLord], é uma #EMP vergonha#! absoluta que tesouros tão preciosos como o seu artefato [this_artifact.GetName] estejam esquecidos e abandonados ao pó! Por favor, permita-me pagar pela sua restauração - em troca de um pequeno favor.\""
 artifact.3040.t:0 "Artefato Deteriorado: Uma Oferta"
 artifact.3050.desc:0 "Um artefato de alta qualidade em sua posse – [this_artifact.GetName] – está se aproximando à [durability|E] #N 0#! e pode ser destruído!"
 artifact.3050.t:0 "Artefato Deteriorado!"
 artifact.4000.a:0 "Chame imediatamente essa pessoa!"
 artifact.4000.b:0 "Deixe todos tremerem de medo ao vê-lo!"
 artifact.4000.cursed_desc:0 "[this_artifact.GetDesc]\n\nNobres e camponeses se calam ou invocam proteção divina na presença deste item, que é famoso por ser amaldiçoado."
 artifact.4000.cursed_name:0 "[this_artifact.GetNameNoTooltip] Amaldiçoado"
 artifact.4000.desc.antiquarian_intro:0 "Meu $antiquarian_court_position$ [antiquarian.GetTitledFirstName] tem aparentado preocupação há alguns dias, até que [antiquarian.GetSheHe] finalmente se aproxima de mim.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], tenho notícias preocupantes sobre uma das suas posses mais valiosas, seu artefato [this_artifact.GetName]. Os salões murmuram com rumores sobre o item, e convidados e criados igualmente o observam com medo e suspeita... Eles acreditam que é #EMP amaldiçoado!#! Como dizem os rumores,"
 artifact.4000.desc.assassinated:0 "ele traz grande infortúnio e morte violenta para quem o possui!"
 artifact.4000.desc.end:0 "\n\n\" Talvez a intervenção de um homem ou mulher santo possa tranquilizar a todos..."
 artifact.4000.desc.fallback:0 "ele está impregnado com o poder insidioso de [ROOT.Char.GetFaith.DevilName]!"
 artifact.4000.desc.ghost:0 "ele é habitado pelo espírito raivoso dos mortos!"
 artifact.4000.desc.servant_intro:0 "Nos últimos dias, não pude deixar de perceber que minha casa tem estado ainda mais agitada com rumores do que o normal, embora todas as vozes se calem quando entro no cômodo.\n\nQuando finalmente consigo pegar um servo para pedir uma explicação, a resposta [dummy_servant_gender.GetHerHim] é: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], você não sabe? É seu artefato [this_artifact.GetName]! Todo mundo sabe que é #EMP amaldiçoado!#! Está claro que"
 artifact.4000.desc.stolen:0 "ninguém realmente pode possuí-lo, pois está destinado a ser roubado e causar conflitos perpétuos!"
 artifact.4000.t:0 "Rumores Amaldiçoados"
 artifact.4001.a.failure.desc:0 "A maldição permanece"
 artifact.4001.a.failure:0 "A Maldição Permanece"
 artifact.4001.a.success.desc:0 "A maldição foi removida"
 artifact.4001.a.success:0 "Maldição Removida"
 artifact.4001.a:0 "Faça o seu melhor, [holy_man.GetFirstNameNoTooltip]..."
 artifact.4001.desc.antiquarian_intro:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" meu [ROOT.Char.Custom('GetAntiquarianOrArmorer')] [antiquarian.GetTitledFirstName] requer minha atenção,"
 artifact.4001.desc.servant_intro:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" um servo apressado se aproxima de mim, acompanhado de uma pessoa de aparência solene,"
 artifact.4001.desc:0 "\"como você solicitou, foi encontrado um[Select_CString( holy_man.IsFemale, 'a', '' )] [holy_man.GetWomanMan] sagrad[Select_CString( holy_man.IsFemale, 'a', 'o' )] para abençoar o seu artefato [this_artifact.GetName]. \n\n\"Permita-me apresentar a você [holy_man.GetFirstName]. Tenho certeza de que a intervenção [holy_man.GetHerHim] levantará a maldição e tranquilizará as mentes de todos.\""
 artifact.4001.t:0 "Rumores Amaldiçoados: Intervenção Sagrada"
 artifact.4002.desc.antiquarian_intro:0 "Meu [ROOT.Char.Custom('GetAntiquarianOrArmorer')] [antiquarian.GetTitledFirstName] me dirige a palavra com uma expressão pensativa no rosto [antiquarian.GetHerHim]."
 artifact.4002.desc.servant_intro:0 "Um grupo de serviçais assustados me aborda enquanto caminho para meus aposentos. Um deles toma a palavra:"
 artifact.4002.desc:0 "\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], você deve estar ciente de que a reputação maléfica do seu artefato [this_artifact.GetName] como um item amaldiçoado tem crescido ao longo dos anos... Seus criados, servos e até mesmo convidados estão aterrorizados com isso!\n\nVocê concordaria em chamar um homem ou mulher sagrado para abençoar o item e finalmente conceder um pouco de paz a seus súditos assustados?"
 artifact.4002.t:0 "Rumores Amaldiçoados: Uma Fama Obscura"
 artifact.4010.a:0 "Ótima notícia!"
 artifact.4010.desc.antiquarian_intro:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], você ouviu as notícias?\" Meu [ROOT.Char.Custom('GetAntiquarianOrArmorer')] [antiquarian.GetTitledFirstName] se aproxima de mim."
 artifact.4010.desc.servant_intro:0 "Não consigo deixar de ouvir as vozes animadas que vêm de uma pequena multidão de serviçais no salão."
 artifact.4010.desc:0 "\n\n\"A fama do artefato [this_artifact.GetName] de [ROOT.Char.GetTitledFirstNamePossessiveNoTooltip] se espalha por todos os lugares e continua crescendo! Todos falam com admiração da invencível [SCOPE.Custom('ThisArtifactType')] que derruba inimigos tão facilmente quanto flores em um campo, e de seu glorioso proprietário!\""
 artifact.4010.t:0 "Uma Arma de Fama Assassina"
 artifact.4020.a:0 "Ótima notícia!"
 artifact.4020.desc:0 "\n\n\"Todos reconhecem o artefato [this_artifact.GetName] de [ROOT.Char.GetTitledFirstNamePossessiveNoTooltip], que brilha no campo de batalha como nenhum outro e deixa amigos e inimigos cientes de que um herói imortal caminha entre eles!\""
 artifact.4020.t:0 "Uma Armadura Renomada"
 artifact.4030.desc.antiquarian_intro:0 "\"Meu [ROOT.Char.Custom('GetAntiquarianOrArmorer')] [antiquarian.GetTitledFirstName] se aproxima de mim com um grande sorriso no rosto e meu artefato [this_artifact.GetName] em suas mãos."
 artifact.4030.desc.servant_intro:0 "O servo que normalmente é encarregado de limpar minhas posses mais valiosas vem até mim com meu artefato [this_artifact.GetName] em suas mãos."
 artifact.4030.desc_emperor:0 "\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], você sabia que, após tantas gerações pertencendo à [ROOT.Char.GetTitleTierName], essa coroa agora é comumente conhecida como símbolo do poder imperial?\""
 artifact.4030.desc_kingdom:0 "\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], você sabia que, após tantas gerações pertencendo à [ROOT.Char.GetTitleAsNameNoTooltip], essa coroa agora é considerada uma parte integral da identidade de [primary_title_scope.GetBaseNameNoTierNoTooltip]?\""
 artifact.4030.t:0 "A Coroa do Nosso Povo"
 artifact.4040.a.tt:0 "[this_artifact.GetName|U] é aprimorado!"
 artifact.4040.a:0 "Ótimo, faça o que precisa ser feito."
 artifact.4040.b:0 "Não preciso da sua ajuda."
 artifact.4040.desc:0 "É com um brilho nos olhos que [helpful.GetFirstNameNoTooltip] se aproxima de mim.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], não pude deixar de notar a excelente qualidade artesanal do seu artefato [this_artifact.GetName]... No entanto, somente um verdadeiro especialista do campo de batalha como eu poderia identificar os pequenos ajustes que poderiam torná-lo uma ferramenta de guerra ainda mais eficaz!\"\n\nEu ignoro [helpful.GetSheHe] quando [helpful.GetSheHe] começa a falar sobre #EMP simetria#!, #EMP equilíbrio#! e #EMP consumo de borda#!, mas entendo a ideia geral de que [helpful.GetFirstNameNoTooltip] poderia melhorar meu artefato em troca de um #EMP token simbólico de minha gratidão#!."
 artifact.4040.t:0 "O Olho do Especialista"
 artifact.4050.a:0 "Maldição!"
 artifact.4050.desc:0 "O estresse vem se acumulando sobre mim como um monte de tijolos há algum tempo. Sinto que meu temperamento tem fervido, apenas esperando uma desculpa para explodir espetacularmente.\n\nTudo desaba sobre mim quando entro no salão, e os criados estão fofocando, meus assistentes estão tagarelando, meus conselheiros disputam minha atenção todos ao mesmo tempo, e tudo isso é demais para eu suportar.\n\n\"#EMP CHEGA!#!\" eu grito enquanto agarro a primeira coisa que minha mão alcança e a arremesso contra a parede mais próxima.\n\nO silêncio toma conta da sala e, quando vejo meu artefato [this_artifact.GetName] caído danificado no chão, torto e quebrado, sinto toda a minha raiva evaporar, substituída por uma sensação de pavor..."
 artifact.4050.t:0 "Explosão de Raiva"
 artifact.4060.a:0 "Aceito humildemente sua oferta, [holy_man.GetFirstNameNoTooltip]."
 artifact.4060.b:0 "Isso não será necessário."
 artifact.4060.desc:0 "\"deixe-me apresentar-lhe [holy_man.GetFirstName], um[Select_CString( holy_man.IsFemale, 'a', '' )] [holy_man.GetWomanMan] de grande santidade, conhecido por todas as suas terras.\n\n\"[holy_man.GetSheHe|U] ficou profundamente comovido com sua fama como governante piedoso e justo, e gostaria de estender proteção divina a um de seus tesouros.\"\n\n\"Você permitirá isso?\""
 artifact.4060.t:0 "[SCOPE.Custom('ThisArtifactType')|U] Abençoado do [ROOT.Char.GetFaith.HighGodName]"
 artifact.4070.a:0 "Vamos organizá-la imediatamente!"
 artifact.4070.b:0 "Não, eles estão apenas sendo supersticiosos."
 artifact.4070.desc:0 "Ter retomado dos [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] o controle de nosso estimado artefato [this_artifact.GetName] certamente me colocou em uma posição melhor aos olhos de [ROOT.Char.GetFaith.HighGodName]. No entanto, um sentimento de inquietação permanece dentro de mim, alimentado por várias vozes em minha corte.\n\n#EMP \"Os [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] poluíram nossa relíquia!\" \"Eles lançaram uma maldição nela!\" \"Quem sabe que tipo de rituais pervertidos eles usaram com ela!\"#!\n\nProvavelmente estão exagerando, mas acho que uma pomposa procissão religiosa para \"purificá-la\" não faria mal, não é mesmo?"
 artifact.4070.t:0 "Uma Relíquia Profanada"
 artifact.4080.desc:0 "\n\n\"Todos estão falando sobre o artefato [this_artifact.GetName] d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitledFirstNamePossessiveNoTooltip]! Aparentemente, quem a empunha não pode perder nenhum duelo! Também ouvi dizer que ela escolhe apenas os mais dignos para possuí-la! E conversei com um mercador viajante outro dia: a fama dessa arma invencível até chegou à terra dele!\""
 artifact.4080.t:0 "Arma do Duelista Mestre"
 artifact.4090.a.tt:0 "Relíquia e Arma Combinadas"
 artifact.4090.a:0 "Eu estaria sempre próximo de [ROOT.Char.GetFaith.HighGodName]."
 artifact.4090.b:0 "Não seria apropriado."
 artifact.4090.desc.antiquarian:0 "Meu Antiquário [antiquarian.GetTitledFirstName] se aproximou de mim com uma ideia. Ao selar meu artefato [that_artifact.GetName] dentro do cabo do meu artefato [this_artifact.GetName], eu estaria sempre mais próximo de [ROOT.Char.GetFaith.HighGodName] quando a empunhasse.\n\n\"Você estaria literalmente tocando uma parte de [ROOT.Char.GetFaith.PositiveAfterLife] sempre que segurasse sua [this_artifact.GetType].\" [antiquarian.GetTitledFirstNameNoTooltip] disse, com um olhar de êxtase religioso brilhando em seus olhos."
 artifact.4090.desc:0 "Enquanto observava meu artefato [that_artifact.GetName] um dia, sou tomado pela inspiração. Se eu embutir a relíquia dentro do cabo do meu artefato [this_artifact.GetName], estaria sempre mais próximo de [ROOT.Char.GetFaith.HighGodName] quando a empunhasse."
 artifact.4090.t:0 "Uma Relíquia em Mãos..."
 artifact.6001.a:0 "Será uma ótima adição à minha coleção!"
 artifact.6001.b:0 "Coloque-a na pira de celebração. Não precisamos desse símbolo inútil."
 artifact.6001.desc.commander:0 "Observo o campo de batalha, refletindo sobre como essa batalha será lembrada, e olho para os mortos que permanecem. Percebo um grupo de meus soldados se aproximando e eles se curvam educadamente diante de mim.\n\n"
 artifact.6001.desc.killed_defender:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Encurralamos os inimigos restantes enquanto eles resistiam bravamente. Eles deram suas vidas protegendo esta bandeira.\""
 artifact.6001.desc.looting:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Encontramos a bandeira inimiga enquanto estávamos... 'limpando' o campo de batalha! Achamos que seria uma pena deixá-la para trás, talvez você queira mantê-la como um troféu?\""
 artifact.6001.desc:0 "A batalha de [combat_location.GetName] terminou em uma vitória surpreendente! Ouço ansiosamente o mensageiro enquanto ele lê o relatório do meu comandante, [friendly_commander.GetTitledFirstName], e depois me viro para os soldados diante de mim.\n\n"
 artifact.6001.t:0 "A Bandeira do Inimigo"
 artifact.6001.toast:0 "Padrão perdido em [combat_location.GetNameNoTooltip]"
 artifact.7000.a.boil_skull:0 "[skull_boiler.GetFirstName] ferve o crânio de [skull_to_boil.GetFirstNamePossessive], transformando-o em um [court_artifact|E]"
 artifact.7000.a:0 "[skull_boiler.GetFirstNameNoTooltip], cozinhe e limpe o crânio de [skull_to_boil.GetFirstNamePossessiveNoTooltip] para mim. Agora."
 artifact.7000.b:0 "Não, eu #EMP não posso esperar#! para esquecer completamente a existência de [skull_to_boil.GetFirstNamePossessiveNoTooltip]!"
 artifact.7000.desc:0 "Ah, obrigado [ROOT.Char.GetFaith.HighGodName] [Select_CString( skull_to_boil.IsFemale, 'pela', 'pelo' )] [skull_to_boil.GetFirstName] estar mort[Select_CString( skull_to_boil.IsFemale, 'a', 'o' )], e executado por ninguém menos que #EMP minhas#! ordens!\n\nDevo admitir que sentirei falta de ouvir seu lamentável choro em minha masmorra... Talvez eu deva guardar uma parte [skull_to_boil.GetHerHim], para que eu tenha algo para insultar enquanto descanso em meu trono?\n\nNão é como se [skull_boiler.GetFirstName] estivesse fazendo algo importante, de qualquer maneira..."
 artifact.7000.t:0 "Um Rival é para Sempre"
