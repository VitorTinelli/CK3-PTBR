l_spanish:
 trait_specific.1001.a:0 "Ali! Eu poderia jurar..."
 trait_specific.1001.desc:0 "Pessoas estranhas têm aparecido ao redor de [ROOT.Char.Custom('GetCourt')|l] ultimamente – algumas que só vejo como sombras no canto do meu olho, e outras que vejo rapidamente e depois parecem desaparecer.\n\nNão importa quantas eu coloque na tarefa, essas pessoas estranhas não podem ser encontradas, mas a intensidade das suas zombarias só aumenta!"
 trait_specific.1002.a:0 "Espere, no que eu estava pensando mesmo?"
 trait_specific.1002.desc:0 "Ultimamente tenho tido dificuldade em pensar com clareza – meus pensamentos estão dispersos como nuvens em um céu de verão.\n\nOs pássaros fora do meu [ROOT.Char.Custom('ResidenceBuilding')] começaram a cantar outra melodia. Outras pessoas falam em charadas intencionais, e #EMP ninguém#! reconhece que coentro é uma especiaria verdadeiramente horrível."
 trait_specific.1010.a:0 "Agarrando como roedores... Shoo, vão embora!"
 trait_specific.1010.desc:0 "Esta última semana tenho estado em espiral, como uma folha em um tornado, girando, girando, girando. O que é realidade? O que é #EMP real#!? Eu não consigo mais responder a isso.\n\nTudo o que sei é que a mulher nas nuvens me entende — mas as sombras que se curvam se espalham cada vez mais a cada dia."
 trait_specific.1010.t:0 "Loucura Emergente"
 trait_specific.2001.a:0 "Eu... Quanto tempo eu estive fora?"
 trait_specific.2001.desc:0 "Uma sensação de náusea está subindo no meu estômago. Tento voltar para o meu [ROOT.Char.Custom('GetChamber')], mas a entrada encolhe diante dos meus olhos! O-que está #EMP acontecendo?!#!\n\nDe repente, consigo sentir um cheiro... algo que sei que já senti antes, mas... #EMP onde#!? Alguém pergunta se estou bem, mas eu não consigo responder, não consigo fazer nada..."
 trait_specific.2001.t:0 "O Início"
 trait_specific.2002.a:0 "Eles olham para mim como se eu estivesse... #EMP possuído#!."
 trait_specific.2002.desc:0 "Ultimamente, tenho experimentado alguns... episódios. Algo toma conta de mim, assumindo o controle do meu corpo, e me deixa cansado e confuso.\n\nEu tentei esconder isso das pessoas, tentei esconder, mas é difícil controlar algo que vem e vai como quer."
 trait_specific.3001.a:0 "Acho que vou voltar para a cama."
 trait_specific.3001.desc:0 "Uma flecha perdida passa zumbindo perto da minha cabeça, e eu não sinto #EMP nada#! – nem medo, nem pânico, nem sequer raiva.\n\nIsso tem sido uma nova norma preocupante – sinto como se existisse atrás de uma cortina, me impedindo de sentir, me afastando do mundo, e estou tão #EMP cansado#!..."
 trait_specific.3002.desc_opening:0 "Qual é o significado de tudo isso? Por que passamos por esses movimentos dia após dia..."
 trait_specific.3999.a:0 "É tudo demais..."
 trait_specific.3999.desc:0 "Durante toda a minha vida, senti que a felicidade não vinha tão facilmente para mim quanto para os outros, e agora o sentimento é tão estranho para mim quanto o ar é para um peixe."
 trait_specific.3999.desc_end:0 "\n\nMotivação e energia escapam de mim. Enquanto minha vida afunda na monotonia cinzenta, sinto como se devesse entrar em pânico, mas até mesmo isso está além de mim agora."
 trait_specific.3999.t:0 "Dias Cinzentos"
 trait_specific.4001.a:0 "Interessante... Eu olho ao redor antes de me sentar para ler."
 trait_specific.4001.a_tt:0 "Espero que quem esteve lendo o livro recentemente não esteja por perto para me ver..."
 trait_specific.4001.adventurer:0 "No canto de um baú surrado, encontro um tomo"
 trait_specific.4001.b:0 "Herética! Vou entregá-lo ao [ROOT.Char.GetFaith.PriestNeuterPlural]."
 trait_specific.4001.b_priest:0 "Heresia! Cabe a mim ver esta imundície expurgada."
 trait_specific.4001.desc:0 " – encadernado em couro e inscrito com símbolos estranhos – parcialmente escondido atrás de outros livros. Está velho, mas claramente foi usado recentemente.\n\nEnquanto folheio, logo chego à conclusão de que trata de um conhecimento... #EMP incomum#!."
 trait_specific.4001.landed:0 "Em um canto empoeirado da biblioteca, encontro um tomo"
 trait_specific.4001.t:0 "Leitura Alternativa"
 trait_specific.5001.a.tt:0 "Vou procurar por tipos mais exóticos de carne."
 trait_specific.5001.a:0 "Devo experimentar tudo!"
 trait_specific.5001.b:0 "A variação que tenho aqui está boa."
 trait_specific.5001.desc:0 "Carne de veado, alce, codorna... Há tantas coisas exóticas para experimentar neste mundo!\n\nTendo provado tantas carnes requintadas ao longo dos anos, não posso deixar de me perguntar o que mais existe por aí? Que aventuras de sabor poderão aguardar minha língua?"
 trait_specific.5001.t:0 "Gourmet"
 trait_specific.5002.a:0 "Perdoe-me – eu preciso descobrir!"
 trait_specific.5002.b:0 "Não farei nada além de rezar por sua alma."
 trait_specific.5002.desc:0 "Em minha busca por carnes raras, um pensamento tomou raiz em minha mente. Mal posso admitir isso até para mim mesmo, mas não posso deixar de me perguntar como será o gosto da carne #EMP humana#!...\n\nEnquanto um servo de [ROOT.Char.Custom('GetCourt')|l] adoece, à beira da morte, me vejo ordenando que ele seja colocado sob meus cuidados pessoais."
 trait_specific.5003.a:0 "Farei o que for necessário para sobreviver..."
 trait_specific.5003.b:0 "Nós podemos resistir a isso!"
 trait_specific.5003.desc:0 "Era para ser apenas uma saída curta, um passeio agradável pelo campo. Agora, já se passaram dias desde que vimos outra pessoa viva, e nossos suprimentos já se foram – já comemos os cavalos.\n\nNosso guia promete que alcançaremos a civilização dentro da semana, mas alguns dos servos já chegaram ao seu limite, e meu estômago ronca mais alto a cada hora que passa."
 trait_specific.5003.t:0 "Levado ao Extremo"
 trait_specific.6001.a:0 "Bem, se é isso que é necessário..."
 trait_specific.6001.b:0 "Eu sou melhor que isso!"
 trait_specific.6001.desc:0 "Ultimamente, atividades regulares não têm... #EMP me satisfeito#!. Médicos recomendaram várias pomadas, mas nada desperta meu interesse.\n\nÀ medida que fico cada vez mais desesperado, tropeço em alguns livros, escondidos no fundo de uma pilha em uma barraca de mercadores, que retratam algumas... atividades incomuns. Descubro que não consigo parar de virar as páginas, e o calor começa a se agitar em minhas entranhas."
 trait_specific.6001.t:0 "Gosto Alternativo"
 trait_specific.6002.a:0 "Muito bem, não me deixe esperando!"
 trait_specific.6002.b:0 "Você gosta de coisas como... #EMP isso?!#!"
 trait_specific.6002.b_known:0 "Eu sabia que [lover.GetSheHe] gostava de coisas estranhas, mas disso?!"
 trait_specific.6002.desc:0 "Estou me aproximando para soltar a roupa superior d[Select_CString( lover.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))], [lover.GetTitledFirstNamePossessive], quando [lover.GetSheHe] de repente se afasta.\n\n\"Eu estava querendo tentar algo #EMP novo#!, meu [ROOT.Char.Custom('LoverPetName')],\" [lover.GetSheHe] diz, alcançando debaixo da cama com um sorriso travesso.\n\nA mão [lover.GetHerHim] emerge, segurando [ROOT.Char.Custom('DeviantObjectArticle')]. \"Eu estava pensando que poderíamos usar #EMP isso#!.\""
 trait_specific.6002.t:0 "Experimentando"
 trait_specific.7001.a:0 "Traga-me outro!"
 trait_specific.7001.desc:0 "Nada pode me acalmar tão eficientemente quanto uma boa dose de [ROOT.Char.Custom('RegionalAlcoholicDrink')]. Depois de um dia difícil, depois de um bom dia, depois de #EMP qualquer#! dia... Eu sempre sei que encontrarei consolo no fundo dos meus copos."
 trait_specific.7001.t:0 "Fundo do Copo!"
 trait_specific.7002.b:0 "Eu sou mais forte que isso."
 trait_specific.8001.a.failure:0 "As sementes se recusam a crescer"
 trait_specific.8001.a.small_success:0 "O projeto falha, mas você aprende muito"
 trait_specific.8001.a.success:0 "Você cultiva um jardim exuberante"
 trait_specific.8001.a:0 "Usarei essas para começar um jardim privado!"
 trait_specific.8001.desc:0 "Um comerciante jovial colocou um saco de sementes na minha mão – plantas que [ROOT.Char.Custom('RandomSheHe')] afirma fortificar tanto a saúde quanto a mente.\n\nDevo admitir que tenho pouca experiência em cultivar plantas, mas quão difícil poderia ser?"
 trait_specific.8001.t:0 "Interesse em Germinação"
 trait_specific.8002.b:0 "Elas devem valer alguma coisa..."
 trait_specific.8501.a:0 "Grosseiro, mas o que posso fazer?"
 trait_specific.8501.b:0 "Prender [mean_courtier.GetSheHe]!"
 trait_specific.8501.c:0 "Se acha tão engraçado, talvez gostasse de ter o seu próprio."
 trait_specific.8501.d.tt:0 "[mean_courtier.GetTitledFirstName] e você têm um [single_combat_duel|E]"
 trait_specific.8501.d:0 "Diga de novo, desafio você."
 trait_specific.8501.desc:0 "Estou conversando com vários dos meus [ROOT.Char.Custom('GetCourtierPlural')] sobre um assunto bastante sério, quando não posso deixar de notar [mean_courtier.GetTitledFirstName] rindo baixinho.\n\nÉ só quando confronto [mean_courtier.GetSheHe] e [mean_courtier.GetSheHe] me pede para repetir a palavra 'suspeito' que percebo que [mean_courtier.GetSheHe] está zombando do meu sequestro."
 trait_specific.8501.e:0 "Talvez gostasse de uma olhada mais de perto."
 trait_specific.8501.f:0 "Na verdade, acho que você vai descobrir que [ROOT.Char.GetFaith.HealthGodName] tinha um problema de dicção."
 trait_specific.8501.g:0 "Você não vai #EMP acreditar#! no que posso fazer com esta língua..."
 trait_specific.8501.h:0 "Está tudo bem?"
 trait_specific.8501.t:0 "Risadas Suspeitas"
 trait_specific.9001.a:0 "Um belo verso! No que devo meditar em seguida?"
 trait_specific.9001.b:0 "Escrever é divertido, mas eu não sei sobre #EMP rimar#!."
 trait_specific.9001.c:0 "Talvez eu deva mandar encher uma banheira..."
 trait_specific.9001.desc:0 "Bebo uma caneca de [ROOT.Char.Custom('GetExpensiveDrink_Singular')], os olhos vasculhando meus últimos rabiscos.\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')|U]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\nNa verdade, sou uma das grandes mentes artísticas da minha época!"
 trait_specific.9001.t:0 "Reflexões Noturnas"
