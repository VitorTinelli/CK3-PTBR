l_spanish:
 SEND_POEM_INCOMPETENCE:0 "Uma Obra detalhando a Incompetência deles"
 SEND_POEM_LEGACY:0 "Uma Obra sobre Legado"
 SEND_POEM_MOURNING:0 "Uma Obra sobre Luto"
 SEND_POEM_ROMANCE:0 "Uma Obra sobre Romance"
 SEND_POEM_STRIFE:0 "Uma Obra sobre Conflito"
 send_poem_interaction.failure:0 "O poema é zombado"
 send_poem_interaction.positive_auto_accept.tt:0 "Como este poema é positivo, [recipient.GetFirstNameNoTooltip] pode aceitá-lo imediatamente se [recipient.GetSheHe] tiver uma [opinion|E] suficientemente alta de você"
 send_poem_interaction.success:0 "O poema é elogiado"
 send_poem_interaction:0 "Enviar Poema"
 send_poem_interaction_desc:0 "Enviar uma obra pessoal tocante para [recipient.GetTitledFirstNameNoTooltip]"
 trait_specific_interactions.000.generate_poem:0 "#POE [actor.Custom('GeneratePoem_Title')]#!\n[actor.Custom('GeneratePoem_Intro_Rhyming')]\n[actor.Custom('GeneratePoem_Outro_Rhyming')]"
 trait_specific_interactions.000.intro.part1:0 "O último trabalho [Select_CString( actor.IsFemale, 'da minha', 'do meu' )] [recipient.Custom2('RelationToMe', SCOPE.sC('actor'))], [actor.GetTitledFirstName], se tornou o assunto mais comentado no [actor.Custom('GetCourt')] ultimamente:"
 trait_specific_interactions.000.intro.part3:0 "e [actor.GetFirstNameNoTooltip] a dedicou publicamente a #EMP mim.#!"
 trait_specific_interactions.000.outro:0 "Até agora, mantive meus pensamentos para mim mesmo, mas o burburinho cresceu demais para ser ignorado por muito mais tempo."
 trait_specific_interactions.0001.a:0 "Não sei bem como me sinto em relação a isso..."
 trait_specific_interactions.0001.b:0 "[actor.GetFirstNameNoTooltip], vejo que isso é #EMP verdadeiramente#! sincero!"
 trait_specific_interactions.0001.c:0 "Pfft, besteira!"
 trait_specific_interactions.0001.desc.intro:0 "$trait_specific_interactions.000.intro.part1$ a obra lida com sentimentos de amor e romance, $trait_specific_interactions.000.intro.part3$"
 trait_specific_interactions.0001.desc.outro:0 "$trait_specific_interactions.000.outro$"
 trait_specific_interactions.0001.desc.poem:0 "\n\n$trait_specific_interactions.000.generate_poem$\n\n"
 trait_specific_interactions.0001.t:0 "Um Toque de Romance"
 trait_specific_interactions.0011.a:0 "$trait_specific_interactions.0001.a$"
 trait_specific_interactions.0011.b:0 "$trait_specific_interactions.0001.b$"
 trait_specific_interactions.0011.c:0 "$trait_specific_interactions.0001.c$"
 trait_specific_interactions.0011.desc.intro:0 "$trait_specific_interactions.000.intro.part1$ a obra lida com sentimentos de tristeza e perda, $trait_specific_interactions.000.intro.part3$"
 trait_specific_interactions.0011.desc.outro:0 "$trait_specific_interactions.000.outro$"
 trait_specific_interactions.0011.desc.poem:0 "\n\n$trait_specific_interactions.000.generate_poem$\n\n"
 trait_specific_interactions.0011.t:0 "Conforto em Palavras"
 trait_specific_interactions.0021.a:0 "$trait_specific_interactions.0001.a$"
 trait_specific_interactions.0021.b:0 "$trait_specific_interactions.0001.b$"
 trait_specific_interactions.0021.desc.intro:0 "$trait_specific_interactions.000.intro.part1$ a obra lida com memória e o que deixamos para trás, $trait_specific_interactions.000.intro.part3$"
 trait_specific_interactions.0021.desc.outro:0 "$trait_specific_interactions.000.outro$"
 trait_specific_interactions.0021.desc.poem:0 "\n\n$trait_specific_interactions.000.generate_poem$\n\n"
 trait_specific_interactions.0021.t:0 "Versos sobre Legado"
 trait_specific_interactions.0031.a:0 "$trait_specific_interactions.0001.a$"
 trait_specific_interactions.0031.b:0 "$trait_specific_interactions.0001.b$"
 trait_specific_interactions.0031.desc.intro:0 "$trait_specific_interactions.000.intro.part1$ a obra lida com o sucesso e a grandeza crescente, $trait_specific_interactions.000.intro.part3$"
 trait_specific_interactions.0031.desc.outro:0 "$trait_specific_interactions.000.outro$"
 trait_specific_interactions.0031.desc.poem:0 "\n\n$trait_specific_interactions.000.generate_poem$\n\n"
 trait_specific_interactions.0031.t:0 "Esforços no Meio do Conflito"
 trait_specific_interactions.0041.a:0 "$trait_specific_interactions.0001.a$"
 trait_specific_interactions.0041.b:0 "Hmm. Sim. #EMP Que. Divertido.#!"
 trait_specific_interactions.0041.desc.intro:0 "$trait_specific_interactions.000.intro.part1$ a obra é pejorativa, inflamatória e dedicada #EMP especificamente#! a mim e ao meu 'único blend de incompetência e incontinência'."
 trait_specific_interactions.0041.desc.outro:0 "$trait_specific_interactions.000.outro$"
 trait_specific_interactions.0041.desc.poem:0 "\n\n$trait_specific_interactions.000.generate_poem$\n\n"
 trait_specific_interactions.0041.t:0 "[Select_CString( recipient.IsFemale, 'A', 'O' )] [recipient.GetTitleAsNameNoTooltip] Infame"
