l_spanish:
 all_adult_courtiers:0 "Todos os cortesãos adultos"
 trait_specific_ongoing.1001.a:0 "Ninguém me toque!"
 trait_specific_ongoing.1001.desc:0 "Bato minhas mãos contra a estrutura da cama para ter certeza. Ao olhar para elas, vejo uma rachadura atravessando uma – meus medos se tornaram realidade! Eu sou feito de vidro!\n\nTerei que me mover de forma suave e lenta, sem movimentos violentos, sem cantar em tons agudos..."
 trait_specific_ongoing.1001.t:0 "Revelações Destruidoras"
 trait_specific_ongoing.1003.a.flavor:0 "Ao sairmos, doce puff me segue"
 trait_specific_ongoing.1003.a:0 "Meus queridos! Vou encontrar mais amigos para vocês!"
 trait_specific_ongoing.1003.b:0 "Eu... eu deveria vendê-los, não deveria?"
 trait_specific_ongoing.1003.desc:0 "Entro no meu [ROOT.Char.Custom('GetChamber')] e me vejo cara a cara com um urso gigante.\n\n\"Ah, doce puff! Você abandonou seus amigos?\" pergunto a ela, tentando fazer com que me siga.\n\nAo sairmos, uma cacofonia de sons cresce — cada animal que consegui pegar me saúda em uníssono!"
 trait_specific_ongoing.1003.t:0 "Tenha Paciência"
 trait_specific_ongoing.1004.a:0 "Este gato agora é meu!"
 trait_specific_ongoing.1004.b:0 "Este cachorro agora é meu!"
 trait_specific_ongoing.1004.c_cat:0 "Um gato! Venda-o para a cozinha."
 trait_specific_ongoing.1004.c_dog:0 "Um cachorro! Venda-o para um canil."
 trait_specific_ongoing.1004.desc:0 "Sob minha ordem, todos os animais que entram na [court_location.Custom('BaronyTownType')] de [court_location.GetNameNoTier] são trazidos até mim.\n\n"
 trait_specific_ongoing.1004.desc_cat:0 "Meus servos me trazem a captura mais recente em uma pequena cesta de palha. Os olhos [ROOT.Char.Custom('RandomCatEyeColor')] de um gatinho espiam por cima da borda e um pequeno miado pode ser ouvido de dentro."
 trait_specific_ongoing.1004.desc_dog:0 "Meus servos me trazem a captura mais recente em uma pequena cesta de palha. Ao olhar para dentro, encontro um filhote de cachorro que late ao me ver e começa a abanar o rabo!"
 trait_specific_ongoing.1004.t:0 "Uma Pequena Alegria"
 trait_specific_ongoing.1005.a:0 "Alegro-me por não o ter feito!"
 trait_specific_ongoing.1005.desc:0 "Enquanto ando do lado de fora em uma noite nebulosa, uma aparição aparece de repente e, em uma voz retumbante, fala.\n\n\"[ROOT.Char.GetFirstNameNoTooltip]! Passou muito tempo!\"\n\nÉ m[Select_CString( dead_person.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('dead_person') )], [dead_person.GetTitledFirstName], que eu acreditava estar [dead_person.GetDeathReason]!"
 trait_specific_ongoing.1005.t:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_person'))|U] [Select_CString( dead_person.IsFemale, 'Querida Falecida', 'Querido Falecido' )]"
 trait_specific_ongoing.1006.a:0 "Deixe-me em paz!"
 trait_specific_ongoing.1006.desc:0 "Por um ano, tenho recebido visitas frequentes [Select_CString( dead_person.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('dead_person') )] [dead_person.GetTitledFirstName], dia após dia. [dead_person.GetSheHe|U] é firme em não permitir que mais ninguém veja [dead_person.GetSheHe], mas as pessoas estão começando a se preocupar...\n\nComo devo focar em meu [ROOT.Char.Custom('child_object_of_interest')] quando [dead_person.GetSheHe] age assim?!"
 trait_specific_ongoing.1007.a.tt:0 "Agora posso tomar uma decisão para construir um #bold Monumento de Vidro#!"
 trait_specific_ongoing.1007.a:0 "Tão esplêndido, tão grandioso!"
 trait_specific_ongoing.1007.desc:0 "Eu rastejo de volta à consciência após um sono tão profundo que quase me perdi.\n\nSonhei com grandes painéis de vidro me levando mais perto do sol em um vórtice de estrelas. Estendendo-me o máximo que pude, consegui pegar o corpo celestial e sua glória flamejante - puxando até que ele tombou e caiu na Terra. Abraçando-o, senti serenidade e calor que nunca antes experimentei!"
 trait_specific_ongoing.1007.t:0 "Um Sonho de Vidro"
 trait_specific_ongoing.1008.a:0 "[friend.GetFirstNameNoTooltip]! Oh não... Devo esconder o corpo."
 trait_specific_ongoing.1008.b:0 "Devo confessar!"
 trait_specific_ongoing.1008.desc:0 "Estou passando o dia com [Select_CString( friend.IsFemale, 'minha amiga', 'meu amigo' )] [friend.GetTitledFirstName] quando de repente tudo começa a girar...\n\nCinzas de aço, vermelho sangue, um rosto gritando, mares vermelho profundo...\n\nRecupero a consciência curvado sobre o corpo [friend.GetHerHim], com uma faca ensanguentada na mão."
 trait_specific_ongoing.1008.t:0 "Perdendo a Realidade"
 trait_specific_ongoing.1009.a.failure:0 "Eu não sou tão invencível como pensei que fosse"
 trait_specific_ongoing.1009.a.success:0 "Eu acerto a aterrissagem"
 trait_specific_ongoing.1009.a:0 "HAHAHA - AAAAH!"
 trait_specific_ongoing.1009.desc:0 "\"Não tenham medo!\" Grito do topo do prédio para acalmar as pessoas reunidas embaixo. \"Eu não posso ser ferido!\"\n\nSalto graciosamente da borda e rio enquanto meu estômago arde com a queda."
 trait_specific_ongoing.1009.t:0 "Impossível de Ferir"
 trait_specific_ongoing.1010.a:0 "Todos se curvarão diante [ROOT.Char.Custom('HorseStoryHerHim')]!"
 trait_specific_ongoing.1010.desc:0 "Meu belo corcel [ROOT.Char.Custom('WarhorseStoryName')] me carrega com facilidade diante dos meus [ROOT.Char.Custom('GetCourt')].\n\n\"Este cavalo é a perfeição! Todos vocês passarão pelo menos uma hora por dia cuidando [ROOT.Char.Custom('HorseStoryHerHim')], seja treinando ou escovando. [ROOT.Char.Custom('HorseStorySheHe')|U] é mais querido para mim do que qualquer outra pessoa. Dispensados."
 trait_specific_ongoing.1010.t:0 "Meu Cavalo [ROOT.Char.Custom('WarhorseStoryName')]"
 trait_specific_ongoing.1011.a:0 "Roupas agora estão proibidas. Tirem-nas!"
 trait_specific_ongoing.1011.desc:0 "Enquanto realizo audiências, continuo me distraindo com as vestimentas resplandecentes de todos. Tecidos luxuosos, joias - bah!\n\nPor que eles precisam se esforçar tanto? Eles não sabem que posso ver direto até o âmago deles de qualquer maneira? As coisas seriam mais fáceis se alguém pudesse simplesmente... proibir roupas.\n\n...Espera."
 trait_specific_ongoing.1011.t:0 "Fabricação de Leis"
 trait_specific_ongoing.1012.a:0 "O que está acontecendo comigo..."
 trait_specific_ongoing.1012.b:0 "Oh, estarei preparado quando eles vierem!"
 trait_specific_ongoing.1012.desc:0 "Não consigo lembrar de ter acontecido, mas quando volto para o [ROOT.Char.Custom('ResidenceBuilding')], meus [ROOT.Char.Custom('GetCourtierPlural')] me contam tudo.\n\nEstive correndo por aí, avisando as pessoas de que os morcegos estão chegando. São tantos que conseguem bloquear o sol e levar [capital.GetNameNoTier] para algum lugar terrível onde [ROOT.Char.GetFaith.PositiveAfterLife] não pode ser alcançado."
 trait_specific_ongoing.1012.t:0 "Visões de Escuridão"
 trait_specific_ongoing.2001.a.failure:0 "[clergy.GetCouncilTitle|U] [clergy.GetShortUIName] fica perturbado com seus relatos."
 trait_specific_ongoing.2001.a.success:0 "Você convence [clergy.GetCouncilTitle] [clergy.GetShortUIName] de que suas visões são sagradas."
 trait_specific_ongoing.2001.a:0 "Devem ser mensageiros de [ROOT.Char.GetFaith.HighGodName]!"
 trait_specific_ongoing.2001.anxiety.desc:0 "ansiedade,"
 trait_specific_ongoing.2001.b.failure:0 "Você encontra alguns livros interessantes, mas regulares."
 trait_specific_ongoing.2001.b.success.tt:0 "Você tem a escolha de abraçar novas verdades ou permanecer fiel a [clergy.GetFaith.HighGodName]."
 trait_specific_ongoing.2001.b.success:0 "Você encontra conhecimento secreto."
 trait_specific_ongoing.2001.b:0 "Isso é algo mais, um poder mais profundo, e eu #EMP quero#! isso."
 trait_specific_ongoing.2001.bile.desc:0 "o cheiro azedo da bile"
 trait_specific_ongoing.2001.blood.desc:0 "o cheiro metálico de sangue"
 trait_specific_ongoing.2001.c:0 "Eu... eu estou apenas cansado. Preciso cuidar melhor de mim mesmo."
 trait_specific_ongoing.2001.chimes.desc:0 "sinos."
 trait_specific_ongoing.2001.citrus.desc:0 "o toque picante de citrinos na minha língua"
 trait_specific_ongoing.2001.dark.desc:0 "seres sombrios,"
 trait_specific_ongoing.2001.dread.desc:0 "medo,"
 trait_specific_ongoing.2001.end.desc:0 "Quem são essas criaturas e o que elas querem de mim?"
 trait_specific_ongoing.2001.euphoria.desc:0 "euforia,"
 trait_specific_ongoing.2001.glowing.desc:0 "seres brilhantes,"
 trait_specific_ongoing.2001.hazy.desc:0 "silhuetas nebulosas,"
 trait_specific_ongoing.2001.incense.desc:0 "o odor doce do incenso"
 trait_specific_ongoing.2001.joy.desc:0 "alegria,"
 trait_specific_ongoing.2001.lavender.desc:0 "um sopro fresco de lavanda"
 trait_specific_ongoing.2001.nausea.desc:0 "náusea,"
 trait_specific_ongoing.2001.raindrops.desc:0 "gotas de chuva."
 trait_specific_ongoing.2001.screeches.desc:0 "gritos estridentes."
 trait_specific_ongoing.2001.shaking.desc:0 "seres trêmulos,"
 trait_specific_ongoing.2001.shimmering.desc:0 "seres brilhantes,"
 trait_specific_ongoing.2001.smoke.desc:0 "um cheiro acre de fumaça"
 trait_specific_ongoing.2001.speaking.desc:0 "falando em um coro de"
 trait_specific_ongoing.2001.stand_before_me.desc:0 "- e então eles estão diante de mim.\n\n[ROOT.Char.Custom('one_syllable_number')|U]"
 trait_specific_ongoing.2001.start.desc:0 "Eu sei que eles estão vindo antes de vê-los. Um repentino fluxo de"
 trait_specific_ongoing.2001.sulfur.desc:0 "o cheiro forte de enxofre"
 trait_specific_ongoing.2001.t:0 "Uma Mensagem do Além"
 trait_specific_ongoing.2001.thunder.desc:0 "trovão."
 trait_specific_ongoing.2001.walls.desc:0 "meu [ROOT.Char.Custom('GetChamber')] se fechando,"
 trait_specific_ongoing.2001.whispers.desc:0 "sussurros."
 trait_specific_ongoing.2002.a:0 "Sombrio [ROOT.Char.GetFaith.WitchGodMistressMaster], sou seu humilde servo!"
 trait_specific_ongoing.2002.b:0 "Estou me envolvendo demais. Isso é muito perigoso."
 trait_specific_ongoing.2002.desc:0 "Minha busca pelo conhecimento prometido pelos Mensageiros me levou a lugares incomuns. Becos escuros, tavernas sombrias, livrarias empoeiradas - fui aonde nenhum[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] já foi, e minha recompensa tem sido realmente grande.\n\nDescobri vários tomos sobre [ROOT.Char.GetFaith.WitchGodName] e os poderes que [ROOT.Char.GetFaith.WitchGodSheHe] concede a seus seguidores. Estou tentado, não posso negar."
 trait_specific_ongoing.2003.a:0 "Será que minha mente está me enganando?"
 trait_specific_ongoing.2003.desc:0 "Encontrei muitos tomos interessantes em minha busca por conhecimento oculto, mas nada realmente especial.\n\nTemo que possa ter interpretado erroneamente a vontade daqueles seres estranhos - ou imaginado tudo isso!"
 trait_specific_ongoing.2010.and_fertility.desc:0 "e [ROOT.Char.GetFaith.FertilityGodName]."
 trait_specific_ongoing.2010.and_health.desc:0 "e [ROOT.Char.GetFaith.HealthGodName]."
 trait_specific_ongoing.2010.and_household.desc:0 "e [ROOT.Char.GetFaith.HouseholdGodName]."
 trait_specific_ongoing.2010.and_knowledge.desc:0 "e [ROOT.Char.GetFaith.KnowledgeGodName]."
 trait_specific_ongoing.2010.and_trickster.desc:0 "e [ROOT.Char.GetFaith.TricksterGodName]."
 trait_specific_ongoing.2010.and_war.desc:0 "e [ROOT.Char.GetFaith.WarGodName]."
 trait_specific_ongoing.2010.and_wealth.desc:0 "e [ROOT.Char.GetFaith.WealthGodName]."
 trait_specific_ongoing.2010.end.desc:0 "\n\nTalvez eles me tenham escolhido para espalhar sua palavra e me recompensar com suas bênçãos em troca? Vou rezar para..."
 trait_specific_ongoing.2010.fallback:0 "Não posso presumir ter sido escolhido."
 trait_specific_ongoing.2010.fertility.desc:0 "[ROOT.Char.GetFaith.FertilityGodName],"
 trait_specific_ongoing.2010.fertility:0 "[ROOT.Char.GetFaith.FertilityGodName] para nova vida e fertilidade."
 trait_specific_ongoing.2010.health.desc:0 "[ROOT.Char.GetFaith.HealthGodName],"
 trait_specific_ongoing.2010.health:0 "[ROOT.Char.GetFaith.HealthGodName] para saúde e longevidade."
 trait_specific_ongoing.2010.household.desc:0 "[ROOT.Char.GetFaith.HouseholdGodName],"
 trait_specific_ongoing.2010.household.tt:0 "Todos os seus [close_family_members|E] e [spouses|E]"
 trait_specific_ongoing.2010.household:0 "[ROOT.Char.GetFaith.HouseholdGodName] para uma família feliz."
 trait_specific_ongoing.2010.knowledge.desc:0 "[ROOT.Char.GetFaith.KnowledgeGodName],"
 trait_specific_ongoing.2010.knowledge:0 "[ROOT.Char.GetFaith.KnowledgeGodName] para conhecimento e sabedoria."
 trait_specific_ongoing.2010.possessed_start.desc:0 "Tenho recebido mensagens frequentes de três seres sagrados. Eles vêm até mim quase todas as noites, seus rostos envoltos em luz divina. Acho que devem ser os espíritos de"
 trait_specific_ongoing.2010.t:0 "Foco Divino"
 trait_specific_ongoing.2010.trickster.desc:0 "[ROOT.Char.GetFaith.TricksterGodName],"
 trait_specific_ongoing.2010.trickster:0 "[ROOT.Char.GetFaith.TricksterGodName] para sagacidade e sorte."
 trait_specific_ongoing.2010.war.desc:0 "[ROOT.Char.GetFaith.WarGodName],"
 trait_specific_ongoing.2010.war:0 "[ROOT.Char.GetFaith.WarGodName] para força na batalha."
 trait_specific_ongoing.2010.wealth.desc:0 "[ROOT.Char.GetFaith.WealthGodName],"
 trait_specific_ongoing.2010.wealth:0 "[ROOT.Char.GetFaith.WealthGodName] para riqueza e abundância."
 trait_specific_ongoing.2010.zeal_start.desc:0 "Desde cerca de um mês atrás, tenho tido um sonho recorrente, no qual discuto teologia com"
 trait_specific_ongoing.2015.a.failure:0 "Seus ataques continuam acontecendo."
 trait_specific_ongoing.2015.a.success:0 "As orações são eficazes."
 trait_specific_ongoing.2015.a:0 "Vou rezar para afastar a escuridão."
 trait_specific_ongoing.2015.b.failure_eating.tt:0 "Sua atitude em relação à comida mudará."
 trait_specific_ongoing.2015.b.failure_eating:0 "Você luta com as regras rigorosas."
 trait_specific_ongoing.2015.b.failure_health:0 "O jejum deixa você enfraquecido."
 trait_specific_ongoing.2015.b.success:0 "O jejum é eficaz."
 trait_specific_ongoing.2015.b:0 "O jejum purificará minha alma."
 trait_specific_ongoing.2015.c.success:0 "O tratamento do médico é eficaz."
 trait_specific_ongoing.2015.c:0 "O que você sugere, [physician.GetFirstNameNoTooltip]?"
 trait_specific_ongoing.2015.desc:0 "As colunas do [ROOT.Char.GetFaith.HouseOfWorship] começam a se curvar enquanto outro episódio me atinge. Não faço nenhum som, mas sei que [chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)] pode perceber que algo está errado.\n\nDepois de [ROOT.Char.Custom('GetReligiousRite')], [chaplain.GetSheHe] se aproxima com uma expressão preocupada no rosto. 'Deve ser [ROOT.Char.GetFaith.DevilName] e seus lacaios que tomam posse do seu corpo, [ROOT.Char.Custom('FormOfAddressForLiege')]. Você deve recorrer a [ROOT.Char.GetFaith.HighGodName] para salvação, antes que seja tarde demais!'"
 trait_specific_ongoing.2015.e:0 "Deixe-me em paz!"
 trait_specific_ongoing.2015.physician.desc:0 "\n\n[physician.Custom2('MyCharacterIntroduction', ROOT.Char)|U] deve ter ouvido [chaplain.GetSheHe]. 'O que [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip] precisa é de paz e tranquilidade, não ameaças de condenação!'"
 trait_specific_ongoing.2015.t:0 "Pela Cura de [ROOT.Char.GetFaith.HighGodName]"
 trait_specific_ongoing.2016.a.chaplain:0 "[ROOT.Char.GetFaith.HighGodName] é poderoso!"
 trait_specific_ongoing.2016.a.physician:0 "Você tem minha gratidão, [physician.GetFirstNameNoTooltip]!"
 trait_specific_ongoing.2016.fasting1.desc:0 "[chaplain.GetTitledFirstName] me instruiu a ter apenas uma refeição pequena à noite e me deu uma longa lista de alimentos para excluir. Laticínios, carne, ovos, doces, álcool, óleos, especiarias fortes, vegetais que crescem abaixo da terra..."
 trait_specific_ongoing.2016.fasting2.desc:0 "\n\nFoi um regime difícil de seguir, mas deve ter funcionado, pois não tive nenhum episódio desde então!"
 trait_specific_ongoing.2016.physician1.desc:0 "[physician.GetTitledFirstName] me disse para descansar bastante e evitar objetos brilhantes, barulhos altos e condições climáticas extremas."
 trait_specific_ongoing.2016.physician2.desc:0 "\n\nO conselho [physician.GetHerHim] deve ter funcionado, pois não tive nenhum episódio desde então!"
 trait_specific_ongoing.2016.prayer1.desc:0 "[chaplain.GetTitledFirstName] me disse para passar pelo menos três horas por dia em oração focada e me orientou para dezenas de seções no [ROOT.Char.GetFaith.ReligiousText] para estudos mais aprofundados."
 trait_specific_ongoing.2016.prayer2.desc:0 "\n\nMinha dedicação foi recompensada, pois não tive nenhum episódio desde então!"
 trait_specific_ongoing.2017.a:0 "Talvez eu tenha feito algo errado?"
 trait_specific_ongoing.2017.physician2.desc:0 "\n\nTentei seguir à risca o conselho [physician.GetHerHim], mas meus ataques são tão regulares quanto antes."
 trait_specific_ongoing.2017.prayer2.desc:0 "\n\nFiz o meu melhor, mas parece que não sou digno da misericórdia de [ROOT.Char.GetFaith.HighGodName]. Meus ataques são tão regulares quanto antes."
 trait_specific_ongoing.2018.a:0 "Desisto. Preciso de minha força."
 trait_specific_ongoing.2018.fasting2.desc:0 "\n\nFiz o meu melhor para seguir o regime rigoroso, mas só me sinto mais fraco. Meus ataques são tão regulares quanto antes, e o cansaço que segue é ainda mais difícil de gerenciar."
 trait_specific_ongoing.2019.a:0 "Ninguém saberá se eu quebrar as regras... Apenas um pouco!"
 trait_specific_ongoing.2019.b:0 "Não posso falhar, há muito em jogo!"
 trait_specific_ongoing.2019.fasting2.desc:0 "\n\nAs regras eram difíceis de seguir e me vi obcecado por cada pequeno detalhe. A comida está constantemente em primeiro plano na minha mente."
 trait_specific_ongoing.2020.a:0 "Não de novo! Eu #EMP recuso#!! Isso #EMP não está# acontecendo..."
 trait_specific_ongoing.2020.anger.desc:0 "raiva"
 trait_specific_ongoing.2020.anxiety.desc:0 "ansiedade"
 trait_specific_ongoing.2020.dread.desc:0 "pavor"
 trait_specific_ongoing.2020.end.desc:0 "me domina à medida que o chão começa a torcer e entortar sob meus pés. Mesmo que eu tenha sido poupado por um tempo considerável, eu reconheço imediatamente os sinais.\n\nFujo para meus aposentos antes que comece a chorar — ou perca o controle do meu corpo completamente..."
 trait_specific_ongoing.2020.fear.desc:0 "medo"
 trait_specific_ongoing.2020.nausea.desc:0 "náusea"
 trait_specific_ongoing.2020.start.desc:0 "Uma súbita onda de"
 trait_specific_ongoing.2020.t:0 "Uma Sensação Familiar"
 trait_specific_ongoing.2025.a:0 "Preciso sair daqui, antes que piore!"
 trait_specific_ongoing.2025.b.failure:0 "Seus [ROOT.Char.Custom('GetCourtierPlural')] estão repulsos"
 trait_specific_ongoing.2025.b.success:0 "Seus [ROOT.Char.Custom('GetCourtierPlural')] estão impressionados com sua coragem"
 trait_specific_ongoing.2025.b:0 "Eu sou [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip] — Eu não me importo com o que eles pensam."
 trait_specific_ongoing.2025.c:0 "Onde está [helper.GetFirstNameNoTooltip]? Eu preciso da sua ajuda!"
 trait_specific_ongoing.2025.d.failure:0 "Seus [ROOT.Char.Custom('GetCourtierPlural')] acham que você está mentindo"
 trait_specific_ongoing.2025.d.success:0 "Seus [ROOT.Char.Custom('GetCourtierPlural')] acreditam em você"
 trait_specific_ongoing.2025.d:0 "É uma mensagem de [ROOT.Char.GetFaith.HighGodName]! Vou contar a eles!"
 trait_specific_ongoing.2025.e.failure:0 "Seus [ROOT.Char.Custom('GetCourtierPlural')] veem através do seu plano"
 trait_specific_ongoing.2025.e:0 "Eu poderia fingir que foi uma visão de [ROOT.Char.GetFaith.HighGodName]..."
 trait_specific_ongoing.2025.end.desc:0 "invade minhas narinas, tento falar, mas meus lábios não se movem."
 trait_specific_ongoing.2025.every_courtier:0 "Todo [actor.Custom('GetCourtier')]"
 trait_specific_ongoing.2025.start.desc:0 "[Select_CString( dummy_gender.IsFemale, 'A', 'O' )] [dummy_gender.GetWomanMan] diante de mim parece estranha. O rosto [dummy_gender.GetHerHim] está distorcido... se distorcendo? Será que [dummy_gender.GetSheHe] é até mesmo humano?\n\nA realidade #EMP vacila#!, e percebo que estou tendo outro [ROOT.Char.Custom('PossessedEpisode')] — e na frente dos meus [ROOT.Char.Custom('GetCourt')] reunidos. Como"
 trait_specific_ongoing.2025.t:0 "Lugar Nenhum Para Se Esconder"
 trait_specific_ongoing.3001.a:0 "Venha, temos muito a conversar."
 trait_specific_ongoing.3001.b.tt:0 "Ahaha... ha."
 trait_specific_ongoing.3001.b:0 "Eu não tenho tais problemas! Do que você está falando?!"
 trait_specific_ongoing.3001.desc:0 "M[Select_CString( sympathetic_character.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sympathetic_character'))] [sympathetic_character.GetTitledFirstName] se aproxima de mim enquanto termino de me dirigir aos [ROOT.Char.Custom('GetCourt')], com as pessoas ainda se misturando ao redor.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ouvi dizer que você também sofre com períodos de... melancolia. Talvez pudéssemos discutir nossas experiências?\""
 trait_specific_ongoing.3001.t:0 "A Miséria Adora Companhia"
 trait_specific_ongoing.3002.a:0 "Eu faria qualquer coisa para me livrar disso."
 trait_specific_ongoing.3002.b:0 "Tudo o que preciso é de uma longa soneca. Ou três."
 trait_specific_ongoing.3002.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" m[Select_CString( court_physician.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] se aproxima de mim em uma noite. \"Tenho alguns remédios que poderíamos tentar para a sua insistente melancolia. Pode piorar um pouco antes de melhorar, mas vale a pena tentar!\""
 trait_specific_ongoing.3002.t:0 "Soluções de Longo Prazo"
 trait_specific_ongoing.3003.a:0 "Vou tirar um tempo."
 trait_specific_ongoing.3003.b:0 "Tudo isso é demais para mim – vou voltar para a cama."
 trait_specific_ongoing.3003.desc:0 "\"Para curar esse tipo de aflição, é muito importante arejar os pensamentos ruins,\" m[Select_CString( court_physician.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] me assegura. \"Venha me ver algumas vezes a cada semana e conversaremos sobre o que está pesando em você.\""
 trait_specific_ongoing.3004.a:0 "Faz sentido!"
 trait_specific_ongoing.3004.desc:0 "\"Para você se sentir melhor, precisamos trabalhar tanto nos seus pensamentos quanto nas suas rotinas,\" m[Select_CString( court_physician.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] me informa. \"Vou ajudá-lo a identificar seus pensamentos e hábitos negativos e trabalhar para mudá-los.\""
 trait_specific_ongoing.3005.a:0 "Vou fazer o meu melhor."
 trait_specific_ongoing.3005.desc:0 "O exercício e a estimulação corporal são eficazes para equilibrar seus humores,\" m[Select_CString( court_physician.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] me diz. \"Você fará três voltas em seu [ROOT.Char.Custom('ResidenceBuilding')] todos os dias."
 trait_specific_ongoing.3006.a:0 "O poder de [ROOT.Char.GetFaith.HighGodName] me curará!"
 trait_specific_ongoing.3006.desc:0 "\"Esses maus pensamentos e essa melancolia são claramente resultado de espíritos malignos ou demônios,\" m[Select_CString( court_physician.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] me diz. \"Vamos designar um [ROOT.Char.Custom('DefaultPriestTitle')] para orar por você e banir o mal de dentro de você.\""
 trait_specific_ongoing.3007.a:0 "Eu... Eu estou feliz!"
 trait_specific_ongoing.3007.desc:0 "Após todas as coisas que m[Select_CString( court_physician.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] me fez passar, aos poucos chego à realização de que estou #EMP sentindo#! as coisas novamente."
 trait_specific_ongoing.3007.desc_ending:0 "\n\nComo o sol rompendo uma espessa camada de nuvens, sinto a felicidade retornando à minha alma."
 trait_specific_ongoing.3008.desc_fallback:0 "M[Select_CString( court_physician.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] não terminou seu tratamento da minha melancolia, mas sinto a escuridão se dissipando de mim."
 trait_specific_ongoing.3008.desc_no_depression:0 "Não preciso continuar a rotina que m[Select_CString( court_physician.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] estabeleceu para me livrar da melancolia, pois já estou livre da aflição!"
 trait_specific_ongoing.3008.desc_physician_died:0 "M[Select_CString( court_physician.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] faleceu antes que [court_physician.GetSheHe] pudesse terminar meu tratamento para a melancolia, mas as instruções que [court_physician.GetSheHe] deixou me ajudaram a seguir o tratamento por conta própria."
 trait_specific_ongoing.3009.a:0 "Só preciso deitar..."
 trait_specific_ongoing.3009.desc:0 "Um dia segue o outro, implacável, enquanto minha mente se afoga em exaustão e desespero.\n\nÀs vezes, até mesmo levantar da cama de manhã é demais para mim."
 trait_specific_ongoing.3009.t:0 "Dias Pesados"
 trait_specific_ongoing.3015.a.failure:0 "Forçar-me é exaustivo"
 trait_specific_ongoing.3015.a.neutral:0 "Ainda estou cansado"
 trait_specific_ongoing.3015.a.success:0 "Eu supero minha letargia"
 trait_specific_ongoing.3015.a:0 "Vou provar que [unsympathetic.GetSheHe] está errado!"
 trait_specific_ongoing.3015.b:0 "\"Cale-se, [Select_CString( unsympathetic.IsFemale, 'sua', 'seu' )] [unsympathetic.Custom2('InsultAdjective', ROOT.Char)] [unsympathetic.Custom2('InsultNoun', ROOT.Char)]!\""
 trait_specific_ongoing.3015.book.desc:0 "percebo que esqueci o livro que [unsympathetic.GetSheHe] me emprestou,"
 trait_specific_ongoing.3015.c:0 "[unsympathetic.GetSheHe|U] está certo. Eu sou inútil..."
 trait_specific_ongoing.3015.council.desc:0 "me apresso para a reunião do conselho, mais uma vez atrasado,"
 trait_specific_ongoing.3015.end.desc:0 "sei exatamente como [unsympathetic.GetSheHe] reagirá.\n\n\"Por que eu ainda fico surpreso,\" [unsympathetic.GetTitledFirstNameNoTooltip] diz com um suspiro, e meu coração afunda."
 trait_specific_ongoing.3015.start.desc:0 "Seja um comentário sarcástico ou um olhar desaprovador, [unsympathetic.Custom2('MyCharacterIntroduction', ROOT.Char)] constantemente demonstra seu desdém pela minha condição. Enquanto eu"
 trait_specific_ongoing.3015.t:0 "Comentários Maldosos"
 trait_specific_ongoing.3015.withdraw.desc:0 "me levanto para me retirar mais cedo do jantar,"
 trait_specific_ongoing.5001.a:0 "Um lanche à meia-noite seria bem-vindo."
 trait_specific_ongoing.5001.b:0 "\"Por favor, [victim.GetFirstNameNoTooltip], continue."
 trait_specific_ongoing.5001.desc:0 "Enquanto conversamos, não consigo deixar de notar a pele [victim.GetHerHim], e o movimento por baixo enquanto [victim.GetSheHe] se move..."
 trait_specific_ongoing.5001.desc_big:0 "Enquanto conversamos, não consigo deixar de notar os braços rechonchudos [victim.GetHerHim], carne e gordura repousando em montes suculentos..."
 trait_specific_ongoing.5001.desc_opening:0 "M[Select_CString( victim.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim'))] [victim.GetTitledFirstName] e eu nos encontramos sozinhos, enquanto o restante dos [ROOT.Char.Custom('GetCourt')] foi para a cama.\n\n"
 trait_specific_ongoing.5001.desc_small:0 "Enquanto conversamos, não consigo deixar de notar os braços sinuosos [victim.GetHerHim], a carne esticada sob tensão..."
 trait_specific_ongoing.5001.t:0 "Encontro Privado"
 trait_specific_ongoing.5002.a:0 "Não, não, por favor – NÃO! AAAH!"
 trait_specific_ongoing.5002.desc:0 "M[Select_CString( murderer.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murderer'))] [murderer.GetTitledFirstName] e eu nos encontramos sozinhos enquanto o resto da corte se afasta para dormir.\n\nÀ medida que a noite passa, [murderer.GetSheHe] fica cada vez mais intensa, seus olhos nunca se afastando muito da minha pele exposta. Justo quando estou prestes a questionar as intenções [murderer.GetHerHim], [murderer.GetSheHe] saca uma faca e sorri."
 trait_specific_ongoing.5003.a:0 "Com um movimento suave, corto a garganta [servant.GetHerHim]."
 trait_specific_ongoing.5003.b:0 "Abro [servant.Custom('GetUpperClothingArticle')] [servant.GetHerHim]."
 trait_specific_ongoing.5003.desc:0 "\"É tão cheio de #EMP vida#!!\""
 trait_specific_ongoing.5003.desc_big:0 "\"É tão rechonchudo – tão cheio de #EMP vida#!!\""
 trait_specific_ongoing.5003.desc_opening:0 "[Select_CString( servant.IsFemale, 'Minha serva', 'Meu servo' )] [servant.GetTitledFirstName] chamou minha atenção – o formato dos braços [servant.GetHerHim], o contorno do pescoço [servant.GetHerHim]... Quando eu [Select_CString( servant.IsFemale, 'a', 'o' )] encurralo sozinh[Select_CString( servant.IsFemale, 'a', 'o' )] entre os armazéns de comida, [servant.GetSheHe] pergunta o que eu quero [servant.GetHerHim], com um sorriso atrevido nos lábios [servant.GetHerHim].\n\n\"Eu desejo o seu corpo,\" respondo enquanto me pressiono contra [servant.GetSheHe]."
 trait_specific_ongoing.5003.t:0 "Tentações da Carne"
 trait_specific_ongoing.5004.a:0 "Por favor, senhora, me dê uma mão!"
 trait_specific_ongoing.5004.b:0 "Então, me diga, como estão as coisas por aqui?"
 trait_specific_ongoing.5004.desc:0 "Enquanto viajo com meu séquito em [county.GetNameNoTier], encontramos uma casa isolada com uma mulher idosa morando sozinha.\n\nPeço ao meu séquito para esperar na estrada e entro na casa sozinho."
 trait_specific_ongoing.5004.t:0 "Parada para Lanche"
 trait_specific_ongoing.5005.a:0 "É #EMP quase#! mais do que posso suportar!"
 trait_specific_ongoing.5005.b:0 "Vou acordar [courtier.GetSheHe] – [courtier.GetSheHe] não deve estar confortável aqui fora."
 trait_specific_ongoing.5005.desc:0 "Tarde da noite, deparo-me com m[Select_CString( courtier.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))] [courtier.GetTitledFirstName] tirando uma soneca.\n\nNunca tinha notado antes, mas [courtier.GetSheHe] realmente tem um corpo apetitoso..."
 trait_specific_ongoing.5005.t:0 "Lanche Tarde da Noite"
 trait_specific_ongoing.6001.a.failure:0 "[lover.GetSheHe|U] não compartilha do seu... gosto"
 trait_specific_ongoing.6001.a.success:0 "[lover.GetSheHe|U] está interessad[Select_CString( lover.IsFemale, 'a', 'o' )]"
 trait_specific_ongoing.6001.a:0 "Eu tenho um extra... Se você quiser se juntar?"
 trait_specific_ongoing.6001.b_man:0 "Eu... Um – Um médico recomendou para a virilidade!"
 trait_specific_ongoing.6001.b_woman:0 "Eu... Um – Um médico recomendou para a vitalidade!"
 trait_specific_ongoing.6001.desc:0 "Para me excitar antes de me encontrar com m[Select_CString( lover.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))] [lover.GetTitledFirstName], pego [ROOT.Char.Custom('DeviantObjectArticle')] – #EMP oh...!#!\n\nEstou tão envolvido nisso, explorando todos os seus detalhes, que não ouço alguém entrar no [ROOT.Char.Custom('GetRoom')]. O que ouço é o suspiro alto d[Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetFirstNamePossessiveNoTooltip] quando [lover.GetSheHe] percebe o que estou fazendo."
 trait_specific_ongoing.6001.t:0 "Pego com as Calças Arriadas"
 trait_specific_ongoing.6002.a:0 "Oh, oh, oh, agora #EMP isso#! é interessante!"
 trait_specific_ongoing.6002.b:0 "Oh, isso... isso parece #EMP interessante#!."
 trait_specific_ongoing.6002.c:0 "Qual o significado disso?!"
 trait_specific_ongoing.6002.d:0 "Eu vou apenas sair."
 trait_specific_ongoing.6002.desc:0 "Quando vou fazer uma visita [Select_CString( liege.IsFemale, 'a minha', 'ao meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('liege'))] [liege.GetTitledFirstName], sou levado até os aposentos [liege.GetHerHim].\n\nAbro a porta e encontro [liege.GetSheHe] em êxtase, auxiliado por [ROOT.Char.Custom('DeviantObjectArticle')] – eu nem sabia que poderia ser usado dessa forma!"
 trait_specific_ongoing.6002.t:0 "Senhor[Select_CString( liege.IsFemale, 'a', '' )] Devass[Select_CString( liege.IsFemale, 'a', 'o' )]"
 trait_specific_ongoing.6003.a:0 "#EMP Ahhh...!#!"
 trait_specific_ongoing.6003.desc_deviant:0 "Seus olhos se arregalam – não de nojo, mas de interesse. \"Oh, eu nunca pensei em usar assim #EMP isso#!. Você é uma inspiração!\""
 trait_specific_ongoing.6003.desc_ew:0 "Horrorizado, [vassal.GetSheHe] recua do quarto, \"Vamos... Vamos só fingir que eu não vi nada, ok?\""
 trait_specific_ongoing.6003.desc_exposed:0 "Horrorizado, [vassal.GetSheHe] escancara a porta, \"[liege.GetTitledFirstNameNoTooltip], qual é o significado disso?!\""
 trait_specific_ongoing.6003.desc_joined:0 "Vejo [vassal.GetSheHe] hesitar, mas então [vassal.GetSheHe] fecha a porta e entra. \"Oh, [liege.GetTitledFirstNameNoTooltip], isso parece... Isso parece #EMP interessante#!! Aqui, deixe-me ajudar.\""
 trait_specific_ongoing.6003.desc_opening:0 "Estou nos espasmos do êxtase, auxiliado por [ROOT.Char.Custom('DeviantObjectArticle')], quando m[Select_CString( vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))] [vassal.GetTitledFirstName] entra na sala.\n\n"
 trait_specific_ongoing.6003.t:0 "Depravação"
