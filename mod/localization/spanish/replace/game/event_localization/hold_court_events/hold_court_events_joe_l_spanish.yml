 hold_court.8001.desc:0 "Um comerciante provincial se adianta, claramente fora de seu elemento em meus salões luxuosos. Eu faço um sinal, 'Venha [merchant.GetWomanMan], não temos o dia todo.'\n\n\"Sim, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord]!\" [merchant.GetSheHe] gagueja, \"Eu sou [merchant.GetFirstName], representante dos comerciantes descontentes e homens livres de [town.GetNameNoTier], a maior [town.GetTierAsNameNoTooltip] de [town.GetDeJureLiege.GetNameNoTierPossessive].\" \n\n\"[mayor.GetFirstName], nosso [mayor.GetTitleTierName], [mayor.Custom('get_hold_court_8001_flaw')] - pedimos humildemente que [mayor.GetSheHe] seja substituído por outra pessoa...\""
 hold_court.8001.e:0 "Você se atreve a questionar o #EMP [ROOT.Char.GetTitleTierNamePossessive] [mayor.GetTitleTierName]?!#!"
 hold_court.8001.t:0 "Comércio Abafado"
 hold_court.8010.a:0 "Suas responsabilidades podem justificar privilégios..."
 hold_court.8010.b:0 "Você fala a verdade, [frontier_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] deve ser fortificada."
 hold_court.8010.c:0 "#EMP Dias?!#! Devemos fortificar a capital!"
 hold_court.8010.d.tt_failure:0 "[frontier_lord.GetFirstNameNoTooltip] apresenta um argumento melhor"
 hold_court.8010.d.tt_success:0 "[frontier_lord.GetFirstNameNoTooltip] é tranquilizad[Select_CString( frontier_lord.IsFemale, 'a', 'o' )]"
 hold_court.8010.d:0 "Bobagem, [neighboring_enemy.GetPrimaryTitle.GetNameNoTierNoTooltip] não é uma ameaça."
 hold_court.8010.desc:0 "[frontier_lord.GetTitledFirstName] se apresenta diante de você, seu rosto sério e preocupado. '[ROOT.Char.Custom('FormOfAddressForLiege')|U], a ameaça do [neighboring_enemy.GetPrimaryTitle.GetNameNoTier] pesa em minha mente.\" \n\n\"[neighboring_enemy.GetTitledFirstName] se aproxima da fronteira\" [frontier_lord.GetSheHe] aponta, \"a apenas alguns dias dos portões de [frontier_barony.GetNameNoTierNoTooltip] e [frontier_lord.Custom('get_hold_court_8010_stake')].\" \n\n\"Você deve ajudar a fortificar minhas terras - soldados [frontier_lord.GetPrimaryTitle.GetAdjectiveNoTooltip] e fortificações são tudo o que separa [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] da ruína!\""
 hold_court.8010.e:0 "Todos nós somos sobrecarregados pelos riscos da guerra."
 hold_court.8010.t:0 "A Fronteira do [neighboring_enemy.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 hold_court.8020.a:0 "[ROOT.Char.Custom('get_hold_court_8020_holiness_3')]"
 hold_court.8020.b.tt_failure:0 "Seus argumentos não são convincentes"
 hold_court.8020.b.tt_success:0 "Você mostra que não há requisito religioso"
 hold_court.8020.b:0 "Os [ROOT.Char.GetFaith.ReligiousText] exigem isso?"
 hold_court.8020.c:0 "Interessante, e apenas você se beneficiaria disso?"
 hold_court.8020.d:0 "Não vejo motivo para mudar as coisas."
 hold_court.8020.desc.body_1:0 "que [ROOT.Char.Custom('get_hold_court_8020_holiness_2')] deve ser inteiramente administrado por [ROOT.Char.GetFaith.AltPriestTermPlural] em vez de leigos.\""
 hold_court.8020.desc.body_2:0 "[ROOT.Char.GetFaith.BishopNeuter] cuidado d[Select_CString( candidate.IsFemale, 'a', 'o' )] [candidate.GetFirstNamePossessive], pelo bem da fé e pela glória de [ROOT.Char.GetFaith.HighGodName]!\""
 hold_court.8020.desc.body_fallback:0 "\n\n\"Há acordo"
 hold_court.8020.desc.body_personal:0 "\n\n\"Transfira esta terra para"
 hold_court.8020.desc.body_pope:0 "\n\n\"Sua santidade [pope.GetTitledFirstNameRegnal] concorda"
 hold_court.8020.desc.body_vassal:0 "\n\n\"[vassal.GetTitledFirstName] deve ceder sua propriedade para"
 hold_court.8020.desc.intro:0 "[bishop.GetCouncilTitle] [bishop.GetFirstName] se adianta solenemente. '[ROOT.Char.Custom('FormOfAddressForLiege')|U], [ROOT.Char.Custom('get_hold_court_8020_holiness_1')]'"
 hold_court.8020.e:0 "[pope.GetTitledFirstNameNoTooltip] certamente está acima de tais intromissões."
 hold_court.8020.t:0 "Reivindicações Sagradas"
 hold_court.8031.t:0 "[sc_victor.GetTitledFirstNameNoTooltip] vence o duelo"
 hold_court.8040.a:0 "O julgamento é reservado somente a [ROOT.Char.GetFaith.HighGodName]."
 hold_court.8040.b:0 "Venha, deixe-me mostrar a palavra de [ROOT.Char.GetFaith.KnowledgeGodName]."
 hold_court.8040.c.faith:0 "Você precisa reler o [ROOT.Char.GetFaith.ReligiousText]!"
 hold_court.8040.c.religion:0 "É hora de renunciar a [infidel_vassal.GetFaith.CreatorName] e todas as mentiras [infidel_vassal.GetFaith.GetReligion.GetAdjectiveNoTooltip]!"
 hold_court.8040.c.tt_accept:0 "[infidel_vassal.GetTitledFirstNameNoTooltip] converte a fé"
 hold_court.8040.c.tt_refuse:0 "[infidel_vassal.GetTitledFirstNameNoTooltip] se recusa a converter"
 hold_court.8040.d:0 "Suas crenças são toleradas, não sancionadas."
 hold_court.8040.desc.intro_fallback:0 "'Por que um [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] e um [infidel_vassal.GetFaith.GetReligion.GetAdjectiveNoTooltip] não podem viver em harmonia, separados pelos ensinamentos de [ROOT.Char.GetFaith.HighGodName] e [infidel_vassal.GetFaith.HighGodName], mas unidos em piedade? Sigamos nosso [infidel_vassal.GetFaith.ReligiousText] e você seu [ROOT.Char.GetFaith.ReligiousText] lado a lado.'"
 hold_court.8040.desc.intro_same_religion:0 "'Nós, [infidel_vassal.GetFaith.GetAdherentNamePlural], adoramos [infidel_vassal.GetFaith.CreatorName] assim como os [ROOT.Char.GetFaith.GetAdherentNamePlural] fazem. Deixe [Select_CString( ROOT.Char.IsFemale, 'suas irmãs', 'seus irmãos' )] [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] adorarem como desejarem, unidos contra os ímpios [ROOT.Char.Custom('GetUnbelieverNamePlural')], que seguem falsos demônios e permitem que [infidel_vassal.GetFaith.DevilName] corrompa seus corações.'"
 hold_court.8040.desc:0 "[infidel_vassal.GetTitledFirstName] não arrependid[Select_CString( infidel_vassal.IsFemale, 'a', 'o' )] lhe brinda com sua presença. \n\nAos tropeços, [infidel_vassal.GetSheHe] começa: 'Meu [ROOT.Char.GetTitleTierName], eu sou [Select_CString( infidel_vassal.IsFemale, 'uma súdita leal e disposta', 'um súdito leal e disposto' )] - permita-me praticar minha fé em paz.' \n\n"
 hold_court.8040.t:0 "Tratamento Especial"
 hold_court.8050.a.tt_hook:0 "Porque [Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstName] tem uma alavanca sobre você:"
 hold_court.8050.a.tt_knight:0 "[knight.GetFirstName] irá para sua corte e se tornará um [knight|E]. \nRemovê-l[Select_CString( knight.IsFemale, 'a', 'o' )] pode desagradar [vassal.GetTitledFirstName]."
 hold_court.8050.a.tt_toast:0 "[ROOT.Char.Custom('MountedWarriorTerm')|U] [knight.GetNameNoTooltip]"
 hold_court.8050.a:0 "Muito bem, você pode me acompanhar, [knight.GetFirstNameNoTooltip]."
 hold_court.8050.b:0 "Para aceitar - #EMP [knight.GetSheHe]#! - eu preciso de algo em troca."
 hold_court.8050.c:0 "[grandmaster.GetTitledFirstNameNoTooltip] sempre precisa de [knight.GetWomenMen]!"
 hold_court.8050.d.tt_bodyguard:0 "[knight.GetFirstName] irá para sua corte como s[Select_CString( knight.IsFemale, 'ua', 'eu' )] Guarda-Costas. \nRemovê-l[Select_CString( knight.IsFemale, 'a', 'o' )] pode desagradar [vassal.GetTitledFirstName]"
 hold_court.8050.d:0 "Eu encontrei meu Guarda-Costas!"
 hold_court.8050.desc:0 "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima do trono com um[Select_CString( knight.IsFemale, 'a', '' )] [knight.GetWomanMan] [knight.Custom('GetYoungMiddleAgedOld')] ao seu lado. \n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')]!\" [vassal.GetSheHe] diz, \"M[Select_CString( knight.IsFemale, 'inha', 'eu' )] [vassal.Custom2('RelationToMeShort', SCOPE.sC('knight'))], [knight.GetFullName], busca a honra de servir em seu séquito de [ROOT.Char.Custom('MountedWarriorTermPlural')] — dê a [knight.GetSheHe] a oportunidade de provar sua qualidade!\" \n\n"
 hold_court.8050.desc_passing:0 " [knight.GetFirstNameNoTooltip] sorri fracamente. \"Embora eu seja apenas um[Select_CString( knight.IsFemale, 'a', '' )] espadachim mediano, espero aprender muito em seu serviço.\""
 hold_court.8050.desc_suitable:0 "\"[Select_CString( knight.IsFemale, 'A', 'O' )] [knight.GetWomanMan] conhece bem sua [knight.Custom('SignatureWeaponArticle')] [knight.Custom('signature_weapon')], e não irá decepcioná-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] quando for necessário!\""
 hold_court.8050.desc_talented:0 "\"[knight.GetSheHe|U] já é um[Select_CString( knight.IsFemale, 'a', '' )] d[Select_CString( knight.IsFemale, 'as', 'os' )] duelistas mais renomad[Select_CString( knight.IsFemale, 'as', 'os' )] d[Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitleAsNamePossessive], e trará muita glória para você no campo de batalha!\" É verdade, você já ouviu falar de suas habilidades..."
 hold_court.8050.desc_unsuitable:0 "Me puxando de lado, [vassal.GetFirstNameNoTooltip] murmura: \"[knight.GetSheHe|U] não é renomad[Select_CString( knight.IsFemale, 'a', 'o' )] com uma espada, mas seu entusiasmo deve suprir a lacuna...\""
 hold_court.8050.e.passing:0 "Os cemitérios estão cheios de espadachins medianos."
 hold_court.8050.e.suitable:0 "Habilidoso, sim. Necessário? Não."
 hold_court.8050.e.talented:0 "Você deveria manter um talento desses por perto, [vassal.GetFirstNameNoTooltip]."
 hold_court.8050.e.unsuitable:0 "Um jumento de armadura seria mais útil..."
 hold_court.8050.t:0 "Serviço Real"
 hold_court.8051.a.tt_knight:0 "[knight.GetFirstName] voltará a se tornar um [knight|E]"
 hold_court.8051.a:0 "Fique calmo, vou reintegrá-l[Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetFirstNameNoTooltip]!"
 hold_court.8051.b.tt_return:0 "[knight.GetFirstNameNoTooltip] voltará para a corte d[Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstNamePossessiveNoTooltip]"
 hold_court.8051.b:0 "[knight.GetSheHe|U] não é uma grande perda."
 hold_court.8051.desc:0 "Parece que a notícia finalmente chegou [Select_CString( vassal.IsFemale, 'a', 'ao' )] [vassal.GetTitledFirstName] de que s[Select_CString( knight.IsFemale, 'ua', 'eu' )] [vassal.Custom2('RelationToMeShort', SCOPE.sC('knight'))] não desfruta mais de um lugar entre meus [ROOT.Char.Custom('MountedWarriorTermPlural')]. \n\nContendo cuidadosamente a raiva, [vassal.GetSheHe] exige que eu cumpra minha promessa e restaure a posição d[Select_CString( knight.IsFemale, 'a', 'o' )] [knight.GetFirstNamePossessive]!"
 hold_court.8051.t:0 "$hold_court.8050.t$: Um [ROOT.Char.Custom('MountedWarriorTerm')|U] Desprezado"
 hold_court.8052.a:0 "Ah, que drama!"
 hold_court.8052.b:0 "Guardas, prendam ess[Select_CString( vassal.IsFemale, 'a', 'e' )] [vassal.Custom2('InsultNoun', ROOT.Char)]!"
 hold_court.8052.desc.fallback:0 "[vassal.GetSheHe|U] deixa claro seu desapontamento, claramente irritad[Select_CString( vassal.IsFemale, 'a', 'o' )] com o constrangimento que minhas ações causaram a [vassal.GetSheHe]..."
 hold_court.8052.desc.intro:0 "[vassal.GetTitledFirstName] não perde tempo ao saber que [Select_CString( knight.IsFemale, 'a', 'o' )] [knight.GetFirstName] foi removid[Select_CString( knight.IsFemale, 'a', 'o' )] mais uma vez de meu séquito [ROOT.Char.Custom('MountedWarriorAdjective')], e exige uma audiência. \n\n"
 hold_court.8052.desc.wrath:0 "Apoplétic[Select_CString( vassal.IsFemale, 'a', 'o' )] de raiva, [vassal.GetSheHe] explode, \"M[Select_CString( knight.IsFemale, 'inha', 'eu' )] [vassal.Custom2('RelationToMeShort', SCOPE.sC('knight'))] foi terrivelmente maltratado e minha confiança em suas promessas foi destruída!\" antes de sair furios[Select_CString( knight.IsFemale, 'a', 'o' )]."
 hold_court.8052.t:0 "$hold_court.8050.t$: Última Palha"
 hold_court.8053.a:0 "Os riscos do combate..."
 hold_court.8053.battle:0 "no meio do caos do combate"
 hold_court.8053.desc.body:0 "\n\nVocê está certamente livre de suas obrigações para com [Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstName] agora..."
 hold_court.8053.desc.intro:0 "Chegam notícias a você do [battle_location.Custom('TerrainTypeProvince')] de [battle_location.GetName], onde relatos indicam que [Select_CString( knight.IsFemale, 'a', 'o' )] [knight.GetFirstNameNicknamed] foi abatid[Select_CString( knight.IsFemale, 'a', 'o' )]"
 hold_court.8053.desc_coward:0 "tentando fugir do campo de batalha."
 hold_court.8053.desc_passing:0 "após um duelo persistente, protegendo heroicamente seus companheiros."
 hold_court.8053.desc_suitable:0 "apesar de uma luta acirrada, derrubando muitos inimigos e recebendo muitos ferimentos."
 hold_court.8053.desc_talented:0 "em um lampejo de glória, cercado pelos cadáveres de [Select_CString( knight.IsFemale, 'outras', 'outros' )] [knight.GetWomenMen] menos [Select_CString( knight.IsFemale, 'habilidosas', 'habilidosos' )]."
 hold_court.8053.desc_unsuitable:0 "enquanto agitava sua espada como um peixe fora d'água."
 hold_court.8053.killer:0 "por [knight.GetKiller.GetName]"
 hold_court.8053.t:0 "$hold_court.8050.t$: Perigos da Prestígio"
 hold_court.8060.a.tt:0 "Quando o [temple|E] estiver concluído:"
 hold_court.8060.a:0 "Pela glória de [ROOT.Char.GetFaith.HighGodName]!"
 hold_court.8060.b:0 "[vassal.GetTitledFirstNameNoTooltip] pode contribuir financeiramente."
 hold_court.8060.c:0 "Meus súditos devem contribuir."
 hold_court.8060.d.tt_failure:0 "[royal_architect.GetTitledFirstName] faz um trabalho terrível."
 hold_court.8060.d.tt_normal:0 "[royal_architect.GetTitledFirstName] faz um trabalho adequado."
 hold_court.8060.d.tt_success:0 "[royal_architect.GetTitledFirstName] faz um ótimo trabalho."
 hold_court.8060.d:0 "Este é um trabalho para [Select_CString( royal_architect.IsFemale, 'a', 'o' )] [royal_architect.GetTitledFirstNameNoTooltip]."
 hold_court.8060.desc.end:0 "\n\n\"Você deve ajudar a financiar uma nova casa de culto em [target_province.GetName], em prol da fé [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]!\""
 hold_court.8060.desc.existing:0 "poderia abrigar mais um [ROOT.Char.GetFaith.HouseOfWorship|U] importante, como testemunho do poder de [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] e da piedade de s[Select_CString( ROOT.Char.IsFemale, 'ua', 'eu' )] [ROOT.Char.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip]."
 hold_court.8060.desc.first:0 "não possui um [ROOT.Char.GetFaith.HouseOfWorship|U] significativo onde os moradores possam orar e honrar [ROOT.Char.GetFaith.HighGodNameAlternate]."
 hold_court.8060.desc.owned:0 "seu condado [target_county.GetTierAsNameNoTooltip] de [target_county.GetNameNoTier]"
 hold_court.8060.desc.subvassal:0 "o [target_county.GetTierAsNameNoTooltip] de [target_county.GetNameNoTier], governado [Select_CString( vassal.IsFemale, 'pela', 'pelo' )] [vassal.GetTitledFirstNamePossessive] subordinado [subvassal.GetTitledFirstName],"
 hold_court.8060.desc.vassal:0 "o [target_county.GetTierAsNameNoTooltip] de [target_county.GetNameNoTier] d[Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstNamePossessive]"
 hold_court.8060.desc:0 "Meu [bishop.GetCouncilTitle], [bishop.GetFirstName], agora se curva diante de mim, ansios[Select_CString( bishop.IsFemale, 'a', 'o' )] para começar sua proposta.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],"
 hold_court.8060.e.own:0 "Eu tenho outros planos para essa terra."
 hold_court.8060.e.vassal:0 "Os vassalos devem cuidar de suas próprias terras."
 hold_court.8060.t:0 "Um [ROOT.Char.GetFaith.HouseOfWorship|U] de [target_county.GetNameNoTierNoTooltip]"
 hold_court.8061.a:0 "Que [ROOT.Char.GetFaith.HighGodNameAlternate] nos abençoe a todos!"
 hold_court.8061.desc.bishop:0 "[bishop.GetCouncilTitleFirstName] entra empolgad[Select_CString( bishop.IsFemale, 'a', 'o' )] em seus salões, \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], trago a notícia da conclusão do novo [ROOT.Char.GetFaith.HouseOfWorship|U] em [target_province.GetTitle.GetNameNoTier]!\" \n\n"
 hold_court.8061.desc.existing:0 "se alegram com a piedade de suas obras e a honra concedida a [ROOT.Char.GetFaith.HighGodName]!"
 hold_court.8061.desc.fallback:0 "O [ROOT.Char.GetFaith.HouseOfWorship] que encomendei para o povo de [target_province.GetTitle.GetNameNoTier] está agora completo após muito trabalho.\"\n\n"
 hold_court.8061.desc.first:0 "agora podem honrar [ROOT.Char.GetFaith.HighGodName] em um local digno de sua divindade!"
 hold_court.8061.desc.owned:0 "\"Os fiéis de [target_county.GetNameNoTier]"
 hold_court.8061.desc.vassal:0 "\"Os súditos d[Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstNamePossessive] em [target_county.GetNameNoTier]"
 hold_court.8061.t:0 "A Consagração de [target_province.GetNameNoTooltip] "
 hold_court.8070.a.tt:0 "Quando a [city|E] estiver concluída:"
 hold_court.8070.a:0 "O comércio deve ser incentivado."
 hold_court.8070.b:0 "Só posso ajudar [Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstNameNoTooltip]."
 hold_court.8070.c:0 "Deixe os senhores locais assumirem alguma responsabilidade."
 hold_court.8070.d:0 "Finalmente, algo para [Select_CString( royal_architect.IsFemale, 'a', 'o' )] [royal_architect.GetTitledFirstNameNoTooltip] fazer."
 hold_court.8070.desc.body:0 "para um centro regional de comércio e artesãos.\" \n\n\"Com fundos para construção, as bases para"
 hold_court.8070.desc.end:0 "uma cidade [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] poderia ser estabelecida em [target_province.GetName] consolidando vilas."
 hold_court.8070.desc.existing:0 "outro"
 hold_court.8070.desc.first:0 "o primeiro"
 hold_court.8070.desc.intro:0 "[steward.GetCouncilTitleFirstName] está visivelmente motivad[Select_CString( steward.IsFemale, 'a', 'o' )] por uma grande proposta.\n\n\"Grande [ROOT.Char.GetTitleAsNameNoTooltip]! Há muito potencial em"
 hold_court.8070.e:0 "Há assuntos mais importantes para tratar."
 hold_court.8070.t:0 "O Crescimento de [target_county.GetNameNoTierNoTooltip]"
 hold_court.8071.a:0 "Um dia, [target_province.GetNameNoTooltip] será uma grande cidade."
 hold_court.8071.desc.existing:0 "recebem esses investimentos com satisfação e aguardam a prosperidade que eles trarão para a região."
 hold_court.8071.desc.fallback:0 "O desenvolvimento de [target_province.GetName] está dando frutos; em breve a cidade estará de pé. \n\n"
 hold_court.8071.desc.first:0 "agora podem exercer suas profissões e realizar comércio mais facilmente neste centro regional."
 hold_court.8071.desc.owned:0 "Os camponeses de [target_county.GetNameNoTier]"
 hold_court.8071.desc.steward:0 "[steward.GetCouncilTitleFirstName] entrega orgulhosamente as notícias de que os esforços para transformar [target_province.GetName] em um centro de comércio estão, em suas palavras, \"Tendo sucesso!\" \n\n"
 hold_court.8071.desc.vassal:0 "[vassal.GetTitledFirstNamePossessive] súditos em [target_county.GetNameNoTier]"
 hold_court.8071.t:0 "$hold_court.8070.t$: [target_province.GetNameNoTooltip] Movimentada"
 hold_court.8080.a:0 "[target_county.GetNameNoTierNoTooltip] é sua para governar."
 hold_court.8080.b:0 "Tais privilégios devem ser justificados."
 hold_court.8080.c.tt_failure:0 "Você não consegue avançar"
 hold_court.8080.c.tt_success:0 "Você encontra um compromisso"
 hold_court.8080.c:0 "Você está pedindo demais, deve haver algum outro caminho."
 hold_court.8080.d:0 "Esteja satisfeito com suas liberdades atuais, [mayor.GetTitleAsNameNoTooltip]."
 hold_court.8080.desc.body:0 "\n\n\"Nós fizemos a nossa cidade - e você - prósperos, e merecemos maior influência sobre [target_county.GetNameNoTier]."
 hold_court.8080.desc.body_fallback:0 "os comerciantes e viajantes que passam diariamente por [target_county.GetDeJureLiege.GetNameNoTier] e nossos portões."
 hold_court.8080.desc.body_sea:0 "os navios comerciais que navegam pelos portos ao longo da costa do [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip]."
 hold_court.8080.desc.intro:0 "[mayor.GetTitledFirstName] se adianta, procedendo com cautela. \n\n\"Sua graça, meu(a) [mayor.GetPrimaryTitle.GetTierAsNameNoTooltip] em [mayor.GetPrimaryTitle.GetNameNoTier] enriquece com as negociações de nossos burgueses com"
 hold_court.8080.e:0 "Parece que os burgueses esqueceram seu lugar."
 hold_court.8080.t:0 "A República de [mayor.GetPrimaryTitle.GetDeJureLiege.GetNameNoTierNoTooltip]"
 hold_court.8090.a.bodyguard_lover:0 "\"Você nunca deve sair do meu lado, [vassal.GetFirstName]."
 hold_court.8090.a.bodyguard_soulmate:0 "#EMP Ah, meu bravo Patroclo...#!"
 hold_court.8090.a.lady_in_waiting_lover:0 "Ahem, sim, você pode me acompanhar."
 hold_court.8090.a.lady_in_waiting_soulmate:0 "Que par nós seremos!"
 hold_court.8090.a:0 "Você tem o emprego, [vassal.GetFirstNameNoTooltip]."
 hold_court.8090.b:0 "[old_holder.GetFirstNameNoTooltip] vai ceder o lugar."
 hold_court.8090.c:0 "No momento, precisamos de outros talentos."
 hold_court.8090.d.advocate:0 "Não, eu tenho algo #EMP especial#! em mente para você..."
 hold_court.8090.d:0 "Não, eu tenho algo #EMP especial#! em mente para você..."
 hold_court.8090.desc.ambitious:0 "— uma responsabilidade digna de minhas habilidades"
 hold_court.8090.desc.arrogant:0 "— um papel condizente com minha posição"
 hold_court.8090.desc.empty:0 "— eu não vou te decepcionar."
 hold_court.8090.desc.empty_advocate:0 "— [vassal.GetSheHe] não vai te decepcionar."
 hold_court.8090.desc.intro:0 "M[Select_CString( vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('vassal'))] [vassal.GetTitledFirstName] se aproxima, falando em meu ouvido diante da corte reunida. \n\n\"Glorios[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [vassal.Custom2('RelationToMeShort', ROOT.Char)], conceda-me a honra de [vassal.Custom('GetTargetCourtPositionDesc')]"
 hold_court.8090.desc.intro_advocate:0 "M[Select_CString( vassal_advocate.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('vassal_advocate'))], [vassal_advocate.GetTitledFirstName], conduz um[Select_CString( knight.IsFemale, 'a', '' )] [vassal.GetWomanMan] [vassal.Custom('GetYoungMiddleAgedOld')] diante da corte reunida. \n\n\"Glorios[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip], conceda a m[Select_CString( vassal.IsFemale, 'inha', 'eu' )] [vassal_advocate.Custom('RelationToMeShort', SCOPE.sC('vassal'))] [vassal.GetTitledFirstName], [vassal.Custom('GetTargetCourtPositionDesc')]"
 hold_court.8090.desc.other:0 "— uma posição que me adequo muito mais do que [Select_CString( old_holder.IsFemale, 'a', 'o' )] [old_holder.GetTitledFirstName]"
 hold_court.8090.desc.other_advocate:0 "— um cargo que [Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetFirstName] merece muito mais do que [Select_CString( old_holder.IsFemale, 'a', 'o' )] [old_holder.GetTitledFirstName]"
 hold_court.8090.desc.rival:0 "— e acabe com [Select_CString( old_holder.IsFemale, 'a', 'o' )] [old_holder.GetTitledFirstName], aquel[Select_CString( old_holder.IsFemale, 'a', 'e' )] [old_holder.Custom2('InsultNoun', SCOPE.sC('vassal_advocate'))] [old_holder.Custom2('InsultAdjective', SCOPE.sC('vassal_advocate'))]"
 hold_court.8090.desc.superior:0 "— um trabalho que [Select_CString( old_holder.IsFemale, 'a', 'o' )] [old_holder.GetTitledFirstName] não consegue realizar"
 hold_court.8090.e.advocate:0 "[vassal.GetSheHe|U] não é adequad[Select_CString( vassal.IsFemale, 'a', 'o' )] para o cargo."
 hold_court.8090.e:0 "Você não é adequad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] para tal posto."
 hold_court.8090.t:0 "Um Lugar na Corte"
 hold_court.8100.a:0 "Não se preocupe, eu mesmo irei criar [Select_CString( ward.IsFemale, 'a', 'o' )] [ward.Custom('GirlBoy')]."
 hold_court.8100.b:0 "Estou ocupado, mas encontrarei um lar para [ward.GetSheHe]."
 hold_court.8100.c.tt_child:0 "Toda criança"
 hold_court.8100.c:0 "[ward.GetFirstNameNoTooltip] será um[Select_CString( ward.IsFemale, 'a', '' )] [ROOT.Char.GetDynastyHouseNameNoTooltip]!"
 hold_court.8100.d:0 "Criar uma criança não é barato..."
 hold_court.8100.desc.body:0 "sem ninguém para cuidar dele desde [ward.Custom('get_hold_court_8100_situation')] de seu querido [ward.Custom('get_hold_court_8100_parent')] - por favor, olhe para o futuro dele.\" \n\n"
 hold_court.8100.desc.court:0 "sua corte"
 hold_court.8100.desc.interest_alliance:0 "Talvez [ward.GetSheHe] seja um aliado útil quando estiver adulto..."
 hold_court.8100.desc.interest_fallback:0 "O que pode ser feito com uma criança assim?"
 hold_court.8100.desc.interest_family:0 "[ward.GetSheHe|U] é meu próprio sangue afinal..."
 hold_court.8100.desc.interest_marriage:0 "A criança pode ser uma boa combinação para um dos meus..."
 hold_court.8100.desc.intro:0 "Sou confrontado com os olhos tristes de [ward.GetFullNameNicknamedPossessive], que ficam maiores e mais piedosos enquanto s[Select_CString( advocate.IsFemale, 'ua', 'eu' )] [ward.Custom2('RelationToMeShort', SCOPE.sC('advocate'))] [advocate.GetTitledFirstName] o conduz gentilmente em direção ao meu trono. \n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')]\" lamenta [advocate.GetSheHe], \"[Select_CString( ward.IsFemale, 'a', 'o' )] [ward.Custom('GirlBoy')] esteve na"
 hold_court.8100.desc.vassal:0 "corte d[Select_CString( ward.GetLiege.IsFemale, 'a', 'o' )] [ward.GetLiege.GetFirstName]"
 hold_court.8100.e:0 "Infelizmente, não é um problema da coroa."
 hold_court.8100.hook.tt:0 "[ward.GetName] lhe deve um [hook|E] forte se permanecer seu [ward|E] até crescer."
 hold_court.8100.t:0 "Um Filho da Corte"
 hold_court.8110.a:0 "Sério? Por favor, continue."
 hold_court.8110.b:0 "[steward.GetCouncilTitleFirstNameNoTooltip], vá. Resolva isso. Por favor."
 hold_court.8110.c:0 "Rir de #EMP MIM?!# À forca com eles!"
 hold_court.8110.d:0 "Você é um tolo. #EMP Meu#! tolo."
 hold_court.8110.desc.affair:0 "nosso [dummy_male.Custom2('dummy_peasant_profession', ROOT.Char)] tem se envolvido com a prima da irmã da [dummy_female.Custom2('dummy_peasant_profession', ROOT.Char)], e a vila inteira está em alvoroço! E isso faz sete luas! Ou seriam oito...?\" [peasant.GetSheHe|U] acaricia o queixo."
 hold_court.8110.desc.drink:0 "A irmã da [dummy_female.Custom2('dummy_peasant_profession', ROOT.Char)] jurou que poderia fazer uma [ROOT.Char.Custom('RegionalDrink')] melhor do que a esposa do [dummy_male.Custom2('dummy_peasant_profession', ROOT.Char)], e é claro que eles empataram na competição, e aí os maridos se envolveram!"
 hold_court.8110.desc.fence:0 "no tempo do meu avô, o [dummy_male.Custom2('dummy_peasant_profession', ROOT.Char)] cercou o campo do pai da [dummy_female.Custom2('dummy_peasant_profession', ROOT.Char)], mas agora está tudo desabando, e é claro que o neto não quer ter nada a ver com isso!\""
 hold_court.8110.desc.goat:0 "Tudo começou na última colheita. A cabra do [dummy_male.Custom2('dummy_peasant_profession', ROOT.Char)|U] invadiu a casa da sobrinha da [dummy_female.Custom2('dummy_peasant_profession', ROOT.Char)], e causou uma grande confusão, ela fez isso!\" [peasant.GetSheHe|U] bate na coxa. \"Ah, você deveria ter visto, minha magnificência!"
 hold_court.8110.desc.veg:0 "A porca da [dummy_female.Custom2('dummy_peasant_profession', ROOT.Char)] escapou de uma cerca uma noite, e e-ela... ela foi e acabou entrando na horta do velho [dummy_male.Custom2('dummy_peasant_profession', ROOT.Char)]! O orgulho e a alegria dele!\" Lágrimas de riso escorrem pelo rosto do camponês convulsionado."
 hold_court.8110.desc:0 "Um camponês assustador se aproxima demais antes que um guarda se coloque entre nós. \"Oo!\" [peasant.GetSheHe] recua com um piscar de olhos, rindo com poucos dentes.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')], vim aqui de [peasant_holding.GetNameNoTooltip] com um assunto de im-portân-cia!\" as sobrancelhas [peasant.GetHerHim] se movem.\n\n\"Veja só, [ROOT.Char.Custom('FormOfAddressForLiege')],"
 hold_court.8110.e:0 "O quê? Como ess[Select_CString( peasant.IsFemale, 'a', 'e' )] [peasant.GetWomanMan] entrou aqui? Alguém?"
 hold_court.8110.t:0 "Assunto Sério"
 hold_court.8120.a.tt_conversion:0 "Os condados [peasant.GetFaith.GetAdjective] não podem ser convertidos por 15 anos"
 hold_court.8120.a:0 "Os sacerdotes [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] deixarão em paz os seguidores [peasant.GetFaith.GetAdherentNamePluralNoTooltip]."
 hold_court.8120.b.tt_christianity:0 "O [THIS.Char.GetFaith.GetName] possui o [core_tenet|E] $tenet_christian_syncretism_name$"
 hold_court.8120.b.tt_eastern:0 "O [THIS.Char.GetFaith.GetName] possui o [core_tenet|E] $tenet_eastern_syncretism_name$"
 hold_court.8120.b.tt_islam:0 "O [THIS.Char.GetFaith.GetName] possui o [core_tenet|E] $tenet_islamic_syncretism_name$"
 hold_court.8120.b.tt_judaism:0 "O [THIS.Char.GetFaith.GetName] possui o [core_tenet|E] $tenet_jewish_syncretism_name$"
 hold_court.8120.b.tt_pagan:0 "O [THIS.Char.GetFaith.GetName] possui o [core_tenet|E] $tenet_unreformed_syncretism_name$"
 hold_court.8120.b.tt_sinitic:0 "[THIS.Char.GetFaith.GetName] possui o $tenet_sinitic_syncretism_name$ [core_tenet|E]"
 hold_court.8120.b:0 "Temos muito a aprender com os seguidores [peasant.GetFaith.GetAdherentNamePluralNoTooltip]."
 hold_court.8120.c.tt_tenet:0 "O [THIS.Char.GetFaith.GetName] não possui o [core_tenet|E] $tenet_tax_nonbelievers_name$"
 hold_court.8120.c:0 "[ROOT.Char.GetFaith.CreatorName] exige pagamento dos não-crentes."
 hold_court.8120.d:0 "[ROOT.Char.GetFaith.DevilName] espera por você, [ROOT.Char.Custom2('GetUnbelieverTerm', SCOPE.sC('peasant'))]."
 hold_court.8120.desc.other:0 "\"Nós somos [peasant.GetCulture.GetName], nossas tradições diferem do grande povo [ROOT.Char.GetCulture.GetName]. Vamos manter os costumes de nossos antepassados e adorar [peasant.GetFaith.CreatorName] em paz. Seja misericordioso, [ROOT.Char.Custom('FormOfAddressForLiege')].\""
 hold_court.8120.desc.same_culture:0 "Embora possamos ter crenças diferentes, somos todos irmãos e irmãs [peasant.GetCulture.GetName] no final das contas. Se seguimos [peasant.GetFaith.HighGodName] ou [ROOT.Char.GetFaith.HighGodName], não podemos viver juntos em paz?"
 hold_court.8120.desc.same_religion:0 "\"Todos nós seguimos os ensinamentos de [peasant.GetFaith.CreatorName] e olhamos para [peasant.GetFaith.CreatorSheHe|U] em busca de orientação e misericórdia! [Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetLadyLord], vamos manter nossos ritos locais e viver sem medo de violência ou censura.\""
 hold_court.8120.desc:0 "Sou abordad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por um[Select_CString( peasant.IsFemale, 'a', '' )] pobre [peasant.GetFaith.GetAdherentName], uma visão de humildade e súplica.\n\n\"Glorios[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip], venho suplicar que você pare com os padres que assediam o povo de [conversion_target.GetNameNoTierPossessive] e os forçam a adotar a fé do [ROOT.Char.GetFaith.GetName].\"\n\n"
 hold_court.8120.e:0 "Não."
 hold_court.8120.t:0 "Reação Evangelista"
 hold_court.8130.a.tt_conversion:0 "Os condados [peasant.GetCulture.GetName] não podem ser integrados por 15 anos"
 hold_court.8130.a:0 "Esse orgulho é admirável."
 hold_court.8130.b:0 "Nossos povos podem coexistir."
 hold_court.8130.c.tt_service:0 "Um [knight|E] [peasant.GetCulture.GetName] junta-se à sua [court|E]."
 hold_court.8130.c.tt_service_title:0 "[peasant.Custom('MountedWarriorTerm')|U] [conversion_target.GetAdjectiveNoTooltip]"
 hold_court.8130.c:0 "[conversion_target.GetNameNoTierNoTooltip] deve conquistar esse privilégio."
 hold_court.8130.d:0 "Você será um exemplo para todos os povos atrasados."
 hold_court.8130.desc.other:0 "\"Os modos [ROOT.Char.GetCulture.GetHeritage.GetNameNoTooltip] nos são estranhos, e desejamos continuar as práticas de nossos antepassados em paz. Por favor, deixe-nos em paz, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord].\""
 hold_court.8130.desc.same_ethos:0 "\"Nossos povos já são próximos; também somos um povo [ROOT.Char.GetCulture.GetEthos.GetNameNoTooltip]. Vamos manter nossas tradições e viver lado a lado em paz.\""
 hold_court.8130.desc.same_heritage:0 "\"Nossos povos já compartilham muitas coisas na tradição [ROOT.Char.GetCulture.GetHeritage.GetNameNoTooltip], mas nossas práticas locais são queridas para nós. Por favor, permita-nos permanecer fiéis aos nossos antepassados.\""
 hold_court.8130.desc.same_language:0 "\"Nossos povos já compartilham a bela língua materna [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] - vamos preservar nossas práticas locais e permanecer fiéis aos nossos antepassados.\""
 hold_court.8130.desc:0 "Curvando-se diante de mim está um camponês de origem [peasant.GetCulture.GetName], torcendo as mãos.\n\n\"Majestos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip], em minha bela terra natal de [conversion_target.GetNameNoTier], estamos sendo encorajados a abandonar nossos costumes e adotar os costumes do povo [ROOT.Char.GetCulture.GetName].\" \n\n"
 hold_court.8130.e:0 "O povo [peasant.GetCulture.GetNameNoTooltip] irá se adaptar."
 hold_court.8130.t:0 "Orgulho Cultural"
 hold_court.8140.a.tt:0 "Todos os membros poderão usar [decision|E] Adotar um Filhote"
 hold_court.8140.a:0 "Nossos canis não terão concorrência!"
 hold_court.8140.b:0 "Quem é um bom filhotinho? Você é!"
 hold_court.8140.c:0 "Gatos são companheiros superiores."
 hold_court.8140.d:0 "Você está atrasando petições sérias, [huntmaster.GetFirstNameNoTooltip]."
 hold_court.8140.desc:0 "[Select_CString( huntmaster.IsFemale, 'Minha', 'Meu' )] mestre de caça [huntmaster.GetTitledFirstName] se aproxima com cuidado, segurando um pacote de lã. \n\nCom um sorriso, [huntmaster.GetSheHe] abre o embrulho, revelando um par de olhos semicerrados acima de uma língua de fora - um filhote! [huntmaster.GetSheHe|U] mal consegue segurar o filhote agitado em seus braços. \n\n\"Um presente da melhor ninhada de [ROOT.Char.Custom('get_region_dog_type')] que já vi em um bom tempo!\" [huntmaster.GetSheHe] diz entre lambidas no rosto, \"Você deve aproveitar e expandir seus canis, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord]!\""
 hold_court.8140.t:0 "Patrocínio de Filhotes"
 hold_court.8141.a:0 "Filhotinhos, hein?"
 hold_court.8141.desc:0 "M[Select_CString( pup_house_ruler.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('pup_house_ruler'))] [pup_house_ruler.GetTitledFirstNameRegnal] expandiu seus canis sob a direção de seu mestre de caça, [huntmaster.GetTitledFirstNameRegnal]. \n\n[pup_house_ruler.GetSheHe|U] convidou todos os seus parentes a compartilhar os frutos dessa empreitada!"
 hold_court.8142.a:0 "Você me servirá bem, pequenino!"
 hold_court.8142.b:0 "Mudei de ideia."
 hold_court.8142.desc:0 "Meus servos me trazem um filhote recém-nascido de [ROOT.Char.Custom('get_region_dog_type')], vindo dos renomados canis da Casa [ROOT.Char.GetHouse.GetNameNoTooltip], estabelecidos pelo m[Select_CString( pup_house_ruler.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('pup_house_ruler'))] [pup_house_ruler.GetTitledFirstNameRegnal]. \n\nEspiando de dentro das cobertas, fareja um pequeno nariz, curioso sobre os cheiros de seu novo lar!"
 hold_court.8142.desc_alternative:0 "Meus servos me trazem um filhote recém-nascido de [ROOT.Char.Custom('get_region_dog_type')], direto dos meus próprios canis. \n\nEspiando de dentro dos cobertores, um pequeno focinho fareja, curioso sobre os cheiros de seu novo lar!"
 hold_court.8142.t:0 "$hold_court.8140.t$: Novo Companheiro"
 hold_court.8150.a.tt_contract_reduction:0 "ou as obrigações serão reduzidas em um passo"
 hold_court.8150.a.tt_faction_cooldown:0 "não poderá participar de nenhuma facção por 5 anos"
 hold_court.8150.a.tt_multiple_feudal_intro:0 "Todos os membros feudais da [target_faction.GetName]"
 hold_court.8150.a.tt_multiple_intro:0 "Todos os membros da [target_faction.GetName]"
 hold_court.8150.a.tt_shared:0 "Imposto $hold_court.8150.a.tt_contract_reduction$ e $hold_court.8150.a.tt_faction_cooldown$"
 hold_court.8150.a.tt_single_all:0 "A taxa d[Select_CString( target_faction.IsFemale, 'a', 'o' )] [target_faction.GetLeader.GetTitledFirstNamePossessive] $hold_court.8150.a.tt_contract_reduction$ e [target_faction.GetLeader.GetSheHe] $hold_court.8150.a.tt_faction_cooldown$"
 hold_court.8150.a.tt_single_cooldown:0 "Não poderá $hold_court.8150.a.tt_faction_cooldown$"
 hold_court.8150.a:0 "Eu aceito, embora isso me cause dor."
 hold_court.8150.b:0 "Então você #EMP ESTÁ#! tramando contra mim?! Prendam [target_faction.GetLeader.GetSheHe]!"
 hold_court.8150.c.tt_failure:0 "[target_faction.GetLeader.GetTitledFirstNameNoTooltip] recusa o suborno"
 hold_court.8150.c.tt_success:0 "[target_faction.GetLeader.GetTitledFirstNameNoTooltip] aceita o suborno"
 hold_court.8150.c:0 "Venha [target_faction.GetLeader.GetFirstNameNoTooltip], esqueça os outros."
 hold_court.8150.d.tt_accept:0 "[target_faction.GetLeader.GetTitledFirstNameNoTooltip] está convencid[Select_CString( target_faction.GetLeader.IsFemale, 'a', 'o' )]"
 hold_court.8150.d.tt_reject:0 "[target_faction.GetLeader.GetTitledFirstNameNoTooltip] está indignad[Select_CString( target_faction.GetLeader.IsFemale, 'a', 'o' )]"
 hold_court.8150.d:0 "Entenda! Esperteza não lhe trará benefícios."
 hold_court.8150.desc.alone:0 "\"Eu estaria disposto a ignorar minhas queixas se você revisar minhas obrigações contratuais com a coroa...\""
 hold_court.8150.desc.body:0 "\n\nEmbora haja rumores de que"
 hold_court.8150.desc.claimant:0 "apoie a falsa reivindicação d[Select_CString( target_faction.IsFemale, 'a', 'o' )] [target_faction.GetSpecialCharacter.GetTitledFirstNamePossessive] sobre [target_faction.GetSpecialTitle.GetNameNoTier],"
 hold_court.8150.desc.claimant_self:0 "esteja buscando apoio para a falsa reivindicação [target_faction.GetLeader.GetHerHim] sobre [target_faction.GetSpecialTitle.GetNameNoTier],"
 hold_court.8150.desc.few:0 "\"Posso persuadir os descontentes a recuarem se você concordar em corrigir os encargos contratuais que temos...\""
 hold_court.8150.desc.group:0 "\"Tenho a atenção dos meus companheiros descontentes, e tenho certeza de que poderia persuadi-los a recuar em troca de algumas alterações contratuais...\""
 hold_court.8150.desc.independence:0 "esteja reunindo meus vassalos para se separarem do [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip],"
 hold_court.8150.desc.intro:0 "[target_faction.GetLeader.GetTitledFirstName] dá um passo à frente, e, sem fornecer nenhum contexto, continua em tom baixo: \n\n"
 hold_court.8150.desc.liberty:0 "seja uma alavanca para os desejos traidores de maior autonomia no [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip],"
 hold_court.8150.desc.outro:0 "certamente esta é uma acusação que [Select_CString( target_faction.GetLeader.IsFemale, 'a', 'o' )] [target_faction.GetLeader.GetFirstNameNoTooltip] nunca admitiria publicamente ..."
 hold_court.8150.e:0 "Você está jogando um jogo perigoso, [target_faction.GetLeader.GetTitleAsNameNoTooltip]."
 hold_court.8150.t:0 "Compromisso Contratual"
 hold_court.8160.a:0 "Pelo [ROOT.Char.GetFaith.HighGodName]! [accused.GetSheHe|U] deve ser detido!"
 hold_court.8160.b.executioner:0 "[executioner.GetFirstNameNoTooltip] descobrirá a verdade."
 hold_court.8160.b.torturer:0 "Você não pode me esconder a verdade!!"
 hold_court.8160.b.tt_confession:0 "[accused.GetTitledFirstNameNoTooltip] confessa o complô"
 hold_court.8160.b.tt_silence:0 "[accused.GetTitledFirstNameNoTooltip] não confessa"
 hold_court.8160.c.tt_failure:0 "[accused.GetTitledFirstNameNoTooltip] nega qualquer envolvimento"
 hold_court.8160.c.tt_success:0 "[accused.GetTitledFirstNameNoTooltip] é pego em uma mentira"
 hold_court.8160.c:0 "Vou interrogar [Select_CString( accused.IsFemale, 'a', 'o' )] [accused.GetTitledFirstNameNoTooltip]."
 hold_court.8160.d.fallback:0 "Malícia não é um crime em si, [victim.GetFirstNameNoTooltip]."
 hold_court.8160.d.involved:0 "Acalme-se, não há nada com que se preocupar."
 hold_court.8160.d.proof:0 "Essa \"prova\" parece bastante frágil."
 hold_court.8160.desc.exposed:0 "Veja aqui, tenho provas de que é [Select_CString( accused.IsFemale, 'a', 'o' )] [accused.GetTitledFirstName]"
 hold_court.8160.desc.fallback:0 "– certamente não há mais ninguém que deseje mal [Select_CString( victim.IsFemale, 'a', 'ao' )] [victim.GetTitledFirstNameOrMe]!"
 hold_court.8160.desc.intrigue:0 "– dada a sua reputação de vilania – vem atrás da [victim.LocalPlayerString( 'minha', 'sua' )] garganta!"
 hold_court.8160.desc.intro_alone:0 "M[Select_CString( victim.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim'))] [victim.GetTitledFirstNameRegnal] se apressa ao meu lado, seus olhos vermelhos procurando pela corte reunida. \n\n"
 hold_court.8160.desc.intro_child:0 "M[Select_CString( concerned.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('concerned'))] [concerned.GetTitledFirstName] conduz [Select_CString( victim.IsFemale, 'a', 'o' )] jovem [victim.GetTitledFirstNameRegnal] até mim, claramente angustiado. \n\n"
 hold_court.8160.desc.intro_me:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], tenho certeza de que alguém en [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] está conspirando contra mim!"
 hold_court.8160.desc.intro_other:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], tenho certeza de que alguém em [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] está tentando prejudicar m[Select_CString( victim.IsFemale, 'inha', 'eu' )] [concerned.Custom2('RelationToMeShort', SCOPE.sC('victim'))]!"
 hold_court.8160.desc.intro_spouse:0 "[concerned.GetTitledFirstNameRegnal] e s[Select_CString( victim.IsFemale, 'ua', 'eu' )] [concerned.Custom2('RelationToMeShort', SCOPE.sC('victim'))] se aproximam cautelosamente, desconfiados da corte reunida. \n\n"
 hold_court.8160.desc.joint_claimant:0 "– [accused.GetSheHe] não quer concorrentes em sua reivindicação ao [relevant_title.GetName], incluindo a [Select_CString( victim.IsLocalPlayer, 'minha', victim.GetHerHim )]!"
 hold_court.8160.desc.my_claimant:0 "– [accused.GetSheHe] busca avançar a sua reivindicação ao [relevant_title.GetName] às [victim.LocalPlayerString( 'minhas', 'suas' )] custas!"
 hold_court.8160.desc.my_dislike:0 "– [accused.GetSheHe] ressente a [victim.LocalPlayerString( 'minha', 'sua' )] antipatia por [accused.GetSheHe] e busca vingança!"
 hold_court.8160.desc.nemesis:0 "um[Select_CString( accused.IsFemale, 'a', '' )] [accused.Custom2('InsultNoun', SCOPE.sC('victim'))] [accused.Custom2('InsultAdjective', SCOPE.sC('victim'))] não hesitará em nada, nem mesmo assassinato, para acabar com a [victim.LocalPlayerString( 'minha', 'sua' )] vida!"
 hold_court.8160.desc.outro:0 "\n\n\"Eu imploro! Prendam [Select_CString( accused.IsFemale, 'a', 'o' )] [accused.GetFirstNameNoTooltip] e ponham fim a essa loucura!\""
 hold_court.8160.desc.rival:0 "– um[Select_CString( accused.IsFemale, 'a', '' )] [accused.Custom2('InsultNoun', SCOPE.sC('victim'))] que deseja acabar com uma rivalidade pessoal através do [victim.LocalPlayerString( 'meu', 'seu' )] assassinato!"
 hold_court.8160.desc.suspicion:0 "Não tenho evidências, mas suspeito d[Select_CString( accused.IsFemale, 'a', 'o' )] [accused.GetTitledFirstName]"
 hold_court.8160.desc.their_claimant:0 "– [accused.GetSheHe] ressente as reivindicações [accused.GetHerHim] a [relevant_title.GetName], incluindo a [Select_CString( victim.IsLocalPlayer, 'minha', victim.GetHerHim )]!"
 hold_court.8160.desc.their_dislike:0 "– [accused.GetSheHe] sempre se posicionou como [victim.LocalPlayerString( 'meu', 'seu' )] inimigo!"
 hold_court.8160.t:0 "Acusação Pública"
 hold_court.8161.a.adultery:0 "Não tolerarei adúlteros em minha corte!"
 hold_court.8161.a.homosexual:0 "Tais ultrajes não serão tolerados!"
 hold_court.8161.c:0 "Veremos se há alguma verdade nisso."
 hold_court.8161.d.fallback:0 "Não há nenhuma prova?"
 hold_court.8161.d.involved:0 "Essas suspeitas certamente não têm fundamento."
 hold_court.8161.d.permitted:0 "E daí, [victim.GetPrimarySpouse.GetFaith.GetAdherentNameNoTooltip]?"
 hold_court.8161.desc.body:0 "\n\n[victim.GetFirstName] está claramente envergonhad[Select_CString( victim.IsFemale, 'a', 'o' )] por isso ser exposto tão publicamente e mal consegue olhar em meus olhos."
 hold_court.8161.desc.fallback:0 "Não consigo pensar em mais ninguém que poderia ser!"
 hold_court.8161.desc.intrigue:0 "Todos sabem que [accused.GetSheHe] é um ardiloso conspirador, tecendo teias e brincando com vidas!"
 hold_court.8161.desc.intro:0 "M[Select_CString( victim.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim'))] [victim.GetTitledFirstName] se aproxima apreensivamente, escoltado por [Select_CString( victim.GetPrimarySpouse.IsFemale, 'sua', 'seu' )] [victim.GetPrimarySpouse.GetWifeHusband] [victim.GetPrimarySpouse.GetFirstName], que parece de mau humor. \n\n[victim.GetPrimarySpouse.GetSheHe|U] exclama: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], [accused.GetTitledFirstName] está tentando seduzir [Select_CString( victim.IsFemale, 'minha', 'meu' )] [victim.GetWifeHusband] – uma afronta a [victim.GetPrimarySpouse.GetFaith.HighGodName]!"
 hold_court.8161.desc.my_dislike:0 "Nunca gostei [accused.GetHerHim], claramente por um bom motivo!"
 hold_court.8161.desc.nemesis:0 "Aquel[Select_CString( accused.IsFemale, 'a', 'e' )] [accused.Custom2('InsultNoun', SCOPE.sC('victim'))] [accused.Custom2('InsultAdjective', SCOPE.sC('victim'))] não vai parar até arruinar minha vida!"
 hold_court.8161.desc.quarry:0 "[accused.GetSheHe|U] claramente deseja meu belo cônjuge e não consegue se conter!"
 hold_court.8161.desc.rival:0 "[Select_CString( accused.IsFemale, 'A odiosa', 'O odioso' )] [accused.Custom2('InsultNoun', SCOPE.sC('victim'))] alimenta nossa rivalidade e deseja me envergonhar!"
 hold_court.8161.desc.their_dislike:0 "[accused.GetSheHe|U] nunca gostou de mim! Deve ser [accused.GetSheHe]!"
 hold_court.8161.t:0 "Assunto Pessoal"
 hold_court.8180.a.centralized_power:0 "Os soldados [contract_lord.GetPrimaryTitle.GetAdjectiveNoTooltip] servirão ao reino."
 hold_court.8180.a.coinage:0 "[contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] poderá cunhar sua própria moeda."
 hold_court.8180.a.council:0 "[contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] sempre terá minha atenção."
 hold_court.8180.a.family_entrepeneurship:0 "[contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] crescerá em tamanho."
 hold_court.8180.a.fortification:0 "[contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] será um bastião do reino."
 hold_court.8180.a.march:0 "O reino dependerá do [contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] para sua defesa."
 hold_court.8180.a.palatinate:0 "O status do [contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] não será mais questionado."
 hold_court.8180.a.religious:0 "[contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] não precisa mais temer meu [ROOT.Char.GetFaith.BishopNeuterPlural]."
 hold_court.8180.a.scutage:0 "[contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] poderá manter seus guerreiros."
 hold_court.8180.a.title_revocation:0 "[contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] será inviolável."
 hold_court.8180.a.war_declaration:0 "Os inimigos do [contract_lord.GetPrimaryTitle.GetNamePossessiveNoTooltip] tremerão mais uma vez!"
 hold_court.8180.b.tt.failure:0 "[contract_lord.GetTitledFirstNameNoTooltip] fica irritad[Select_CString( contract_lord.IsFemale, 'a', 'o' )] com a exigência"
 hold_court.8180.b.tt.success:0 "[contract_lord.GetTitledFirstNameNoTooltip] concorda em pagar"
 hold_court.8180.b:0 "Prove-me que você conhece o #EMP valor#! da liberdade."
 hold_court.8180.c.tt.success:0 "[contract_lord.GetTitledFirstNameNoTooltip] abre mão de [vassal_artifact.GetName]"
 hold_court.8180.c:0 "Ouvi dizer que você possui uma bela coleção..."
 hold_court.8180.d.tt.success:0 "[contract_lord.GetTitledFirstNameNoTooltip] abre mão de [vassal_title.GetNameNoTierNoTooltip]"
 hold_court.8180.d:0 "Tais privilégios demandam sacrifícios em troca."
 hold_court.8180.desc.centralized_power:0 "[contract_lord.GetPrimaryTitle.GetNameNoTier] geme sob as demandas tributárias do [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], mas tem muitos homens para poupar; vamos equilibrar essa desigualdade pelo bem de ambas as partes."
 hold_court.8180.desc.coinage:0 "o comércio [contract_lord.GetPrimaryTitle.GetAdjective] é sufocado pela falta de moeda, permita que a Casa [contract_lord.GetHouse.GetBaseName] estabeleça suas próprias casas da moeda com a aprovação real, para o bem do [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].\""
 hold_court.8180.desc.council:0 "a Casa [contract_lord.GetHouse.GetBaseName] está entre as maiores casas do [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]; o conselho [contract_lord.GetPrimaryTitle.GetAdjective] sempre deve ser ouvido pel[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]!\""
 hold_court.8180.desc.fallback:0 "\n\n\"Vamos garantir que a estabilidade do [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] não seja ameaçada por desacordos triviais."
 hold_court.8180.desc.family:0 "\n\n\"Que os nobres mais bem-nascidos do [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] desfrutem dos maiores benefícios."
 hold_court.8180.desc.family_entrepeneurship:0 "[contract_lord.GetPrimaryTitle.GetNameNoTier] poderia enriquecer os [ROOT.Char.GetDynasty.GetName] se desenvolvido, só precisamos preservar nossa mão de obra para projetos locais e defesa."
 hold_court.8180.desc.fortification:0 "se a Casa [contract_lord.GetHouse.GetBaseName] pretende se defender e proteger [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], [contract_lord.GetPrimaryTitle.GetNameNoTier] requer permissão e apoio para fortalecer suas fortificações.\""
 hold_court.8180.desc.intro:0 "[contract_lord.GetTitledFirstName], m[Select_CString( contract_lord.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_lord'))], avança, claramente ansioso para ouvir minha resposta ao seu pedido. \n\n\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [contract_lord.Custom2('RelationToMeShort', ROOT.Char)],"
 hold_court.8180.desc.march:0 "a Casa [contract_lord.GetHouse.GetBaseName] poderia servir melhor o [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] se o [contract_lord.GetPrimaryTitle.GetNameNoTier] recebesse o status e as isenções de uma marcha.\""
 hold_court.8180.desc.martial_defensive:0 "\n\n\"Vamos garantir a defesa do reino em seu nome, e assim ambos colheremos os benefícios da paz.\""
 hold_court.8180.desc.martial_offensive:0 "\n\n\"\"Somente pela espada nossos privilégios são protegidos – e ela deve ser mantida afiada.\""
 hold_court.8180.desc.palatinate:0 "A grande Casa [contract_lord.GetHouse.GetBaseName] e seu [contract_lord.GetPrimaryTitle.GetName] são servos leais do [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]; merecemos maior reconhecimento de nossa qualidade."
 hold_court.8180.desc.religious:0 "você nunca precisará questionar a lealdade da Casa [contract_lord.GetHouse.GetBaseName], mas nosso relacionamento seria mais forte sem a ameaça de perseguição por nossas crenças.\""
 hold_court.8180.desc.religious_heathen:0 "\n\n\"[contract_lord.GetFaith.HighGodName] me protegerá e aos meus, e talvez também vigie sobre você.\""
 hold_court.8180.desc.religious_heretic:0 "\n\n\"Cabe somente a [contract_lord.GetFaith.HighGodName] decidir quais de seus seguidores são justos.\""
 hold_court.8180.desc.scutage:0 "a Casa [contract_lord.GetHouse.GetBaseName] carece de soldados, deixe-a pagar [Select_CString( ROOT.Char.IsFemale, 'a', 'ao' )] [ROOT.Char.GetTitleAsNameNoTooltip] em vez de fornecer homens para o [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].\""
 hold_court.8180.desc.status:0 "\n\n\"Excluir seus seguidores mais qualificados e proeminentes só serve para semear divisão e desconfiança.\""
 hold_court.8180.desc.stewardship:0 "\n\n\"Não restrinja a prosperidade potencial de seus súditos e todos poderemos enriquecer juntos!\""
 hold_court.8180.desc.title_revocation:0 "é revoltante para uma grande casa como a [contract_lord.GetHouse.GetBaseName] ter a ameaça de revogação pairando sobre nós como meros barões ou vassalos.\""
 hold_court.8180.desc.war_declaration:0 "a Casa [contract_lord.GetHouse.GetBaseName] é uma casa gloriosa e nobre, deixe o [contract_lord.GetPrimaryTitle.GetNameNoTier] defender [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] e a si mesma em batalha mais uma vez.\""
 hold_court.8180.e.tt.success:0 "[contract_lord.GetTitledFirstNameNoTooltip] concorda com a partição"
 hold_court.8180.e:0 "Somente se as fronteiras do [contract_lord.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip] nunca forem alteradas."
 hold_court.8180.f:0 "Em troca de maiores compromissos, é claro."
 hold_court.8180.g:0 "Não é suficiente ser um[Select_CString( contract_lord.IsFemale, 'a', '' )] [contract_lord.GetTitleAsNameNoTooltip]?"
 hold_court.8180.t:0 "Privilégios Nobres"
 hold_court.8190.a.tt.promote:0 "Cada condado [other_vassal.GetCulture.GetName] em [THIS.Char.GetPrimaryTitle.GetBaseNameNoTier] ([SCOPE.ScriptValue('court_8190_county_value')|0X]) será mais difícil de integrar"
 hold_court.8190.a.tt.vassals:0 "Cada vassalo não-[THIS.Char.GetCulture.GetName]"
 hold_court.8190.a.tt_accept:0 "[other_vassal.GetTitledFirstName] concorda"
 hold_court.8190.a.tt_refuse:0 "[other_vassal.GetTitledFirstName] recusa"
 hold_court.8190.a:0 "Nossa nobreza deve ser [aggressor_vassal.GetCulture.GetNameNoTooltip]!"
 hold_court.8190.b.tt.vassals:0 "Cada outro vassalo [other_vassal.GetCulture.GetName]"
 hold_court.8190.b.tt_failure:0 "Suas platitudes são rejeitadas"
 hold_court.8190.b.tt_success:0 "As tensões culturais são amenizadas"
 hold_court.8190.b:0 "Há muito que você poderia aprender com outras tradições."
 hold_court.8190.c:0 "[aggressor_vassal.GetCulture.GetNameNoTooltip] ou não, [other_vassal.GetFirstNameNoTooltip] é [Select_CString( other_vassal.IsFemale, 'uma vassala', 'um vassalo' )] leal."
 hold_court.8190.d:0 "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] é uma terra de muitos povos."
 hold_court.8190.desc.body:0 "\n\n\"É hora de seus súditos estrangeiros adotarem os #EMP costumes#! dos seus superiores!"
 hold_court.8190.desc.ethos:0 "[other_vassal.Custom('get_hold_court_8190_ethos')]\""
 hold_court.8190.desc.fallback:0 "Quer dizer, você já viu como esses selvagens #EMP comem?!#!"
 hold_court.8190.desc.heritage:0 "tudo neles é estranho às virtudes [aggressor_vassal.GetCulture.GetHeritage.GetNameNoTooltip]!"
 hold_court.8190.desc.intro:0 "M[Select_CString( aggressor_vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('aggressor_vassal'))] [aggressor_vassal.GetTitledFirstName] mal consegue conter sua raiva.\n\n\"Algo precisa ser feito em relação a esse estrangeiro [other_vassal.GetCulture.GetName]!\" \n\n[aggressor_vassal.GetSheHe|U] gesticula freneticamente, \"Já tive o suficiente d[Select_CString( other_vassal.IsFemale, 'a', 'o' )] [other_vassal.GetTitledFirstName] e de suas ridículas costumes –"
 hold_court.8190.desc.language:0 "e aquela suposta língua [other_vassal.GetCulture.GetLanguage.GetNameNoTooltip] é apenas um ruído insolente!"
 hold_court.8190.t:0 "O Inimigo Interior"
 hold_court.8200.a.tt.convert:0 "Cada condado [infidel_vassal.GetFaith.GetAdjective] em [THIS.Char.GetPrimaryTitle.GetBaseNameNoTier] ([SCOPE.ScriptValue('court_8200_county_value')|0X]) será mais difícil de converter"
 hold_court.8200.a.tt.vassals:0 "Cada vassalo não-[THIS.Char.GetFaith.GetAdjective]"
 hold_court.8200.a.tt_accept:0 "[infidel_vassal.GetTitledFirstName] concorda em se converter"
 hold_court.8200.a.tt_refuse:0 "[infidel_vassal.GetTitledFirstName] se recusa a se converter"
 hold_court.8200.a:0 "Você está certo, [infidel_vassal.GetTitledFirstNameNoTooltip] deve se converter!"
 hold_court.8200.c.tt.vassals:0 "Cada vassalo [infidel_vassal.GetFaith.GetAdjective]"
 hold_court.8200.c:0 "Por [infidel_vassal.GetFaith.HighGodName], agora vejo a verdade!"
 hold_court.8200.d:0 "Eu julgo um[Select_CString( infidel_vassal.IsFemale, 'a', '' )] [infidel_vassal.GetWomanMan] por sua qualidade, não por suas crenças."
 hold_court.8200.desc.body:0 "\n\n\"[ROOT.Char.GetFaith.HighGodName] deixou suas exigências claras para nós - [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] deveria ser uma terra dos fiéis! Fora com esses cães '[infidel_vassal.GetFaith.GetAdjective]'!"
 hold_court.8200.desc.intro:0 "Parece que m[Select_CString( aggressor_vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('aggressor_vassal'))], [aggressor_vassal.GetTitledFirstName], tem alimentado sua raiva enquanto aguarda uma audiência. \n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],"
 hold_court.8200.desc.pope:0 "os [ROOT.Char.Custom2('GetUnbelieverTerm', SCOPE.sC('infidel_vassal'))] se unem em torno do falso [ROOT.Char.GetFaith.BishopNeuter] [infidel_vassal.GetTitledFirstName], e tudo sob sua proteção!"
 hold_court.8200.desc.vassal:0 "Eu não posso tolerar sua tolerância com [ROOT.Char.Custom2('GetUnbelieverTerm', SCOPE.sC('infidel_vassal'))] como [Select_CString( infidel_vassal.IsFemale, 'a', 'o' )] [infidel_vassal.GetTitledFirstName] no reino - até mesmo entre a nobreza!"
 hold_court.8200.e:0 "Todas as religiões são bem-vindas em meu [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 hold_court.8200.t:0 "Servo de [ROOT.Char.GetFaith.HighGodName]"
 hold_court.8210.a:0 "Essa injustiça termina agora."
 hold_court.8210.b.tt_aggressor:0 "[aggressor_vassal.GetTitledFirstNameNoTooltip] vence o duelo"
 hold_court.8210.b.tt_defender:0 "O título permanece com [defender_vassal.GetNameOrMeNoTooltip]"
 hold_court.8210.b:0 "Esses assuntos são tradicionalmente resolvidos pela força."
 hold_court.8210.c.none:0 "Você não tem reivindicação, [aggressor_vassal.Custom2('InsultNoun', ROOT.Char)]."
 hold_court.8210.c.other:0 "A reivindicação d[Select_CString( defender_vassal.IsFemale, 'a', 'o' )] [defender_vassal.GetFirstNamePossessiveNoTooltip] é mais verdadeira."
 hold_court.8210.c.self:0 "Minha reivindicação é mais verdadeira."
 hold_court.8210.d:0 "Eu não me intrometo em tais assuntos."
 hold_court.8210.desc.de_jure:0 "meus direitos legais sobre o [vassal_claim.GetName] são bem documentados; essas terras têm sido consideradas uma parte integral do meu [vassal_claim.GetDeJureLiege.GetName] por muito tempo."
 hold_court.8210.desc.intro:0 "Um[Select_CString( aggressor_vassal.IsFemale, 'a', '' )] [aggressor_vassal.GetTitledFirstName] visivelmente insatisfeito se apressa até o seu trono... \n\n\"[aggressor_vassal.Custom2('RelationToMeShort', ROOT.Char)|U], "
 hold_court.8210.desc.other:0 "\n\n\"Você apoiará minha reivindicação e fará com que s[Select_CString( defender_vassal.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('defender_vassal'))] [defender_vassal.GetTitledFirstName] abdique do que não lhe pertence?\""
 hold_court.8210.desc.self:0 "\n\n\"Você abdicará do que não lhe pertence, em apoio à minha reivindicação?\""
 hold_court.8210.desc.strong:0 "meu direito legítimo sobre o [vassal_claim.GetName] está além de qualquer dúvida; reconhecido tanto por seus próprios arautos quanto pelos [ROOT.Char.GetFaith.AltPriestTermPlural] [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]."
 hold_court.8210.desc.weak:0 "Eu tenho um direito sobre o [vassal_claim.GetName], não importa o que os outros digam!"
 hold_court.8210.duel_tt:0 "[defender_vassal.GetNameOrMeNoTooltip|U] duelará contra [Select_CString( aggressor_vassal.IsFemale, 'a', 'o' )] [aggressor_vassal.GetTitledFirstName] pelo [vassal_claim.GetName]"
 hold_court.8210.e:0 "[Select_CString( defender_vassal.IsFemale, 'A', 'O' )] [defender_vassal.GetTitleAsNameNoTooltip] prestará juramento de fidelidade a você."
 hold_court.8210.f.other:0 "Você decidirá isso com suas armas."
 hold_court.8210.f.self:0 "Você deve conquistá-lo pela espada."
 hold_court.8210.t:0 "Terras Legítimas"
 hold_court.8220.desc.claimant:0 "e instalar m[Select_CString( vassal_claimant.IsFemale, 'inha', 'eu' )] [vassal_faction_target.Custom2('RelationToMeShort', SCOPE.sC('vassal_claimant'))], [vassal_claimant.GetTitledFirstName], como usurpador em [vassal_faction.GetSpecialTitle.GetNameNoTier]!\""
 hold_court.8220.desc.claimant_self:0 "e me instalar como [vassal_faction.GetSpecialCharacter.GetLadyLord] de [vassal_faction.GetSpecialTitle.GetNameNoTier]!\""
 hold_court.8220.desc.liberty:0 "restringindo meu poder e contradizendo minhas decisões legais como s[Select_CString( vassal_faction_target.IsFemale, 'ua', 'eu' )] [vassal_faction_target.GetTitleAsNameNoTooltip]!"
 hold_court.8221.imprison_alone:0 "[assassin.GetTitledFirstName] está pres[Select_CString( assassin.IsFemale, 'a', 'o' )]"
 hold_court.8260.a.peace:0 "[vassal_faction.GetLeader.GetTitledFirstNameNoTooltip] porá fim a esses jogos."
 hold_court.8260.a.war:0 "[vassal_faction.GetLeader.GetTitledFirstNameNoTooltip] deve se render imediatamente!"
 hold_court.8260.b:0 "Arruaceiros não serão tolerados."
 hold_court.8260.c:0 "Haverá paz em meu [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]!"
 hold_court.8260.d:0 "Eles têm pontos válidos, não têm?"
 hold_court.8260.desc.body:0 "\n\n\"[vassal_faction.GetLeader.GetSheHe|U] está incitando os descontentes neste momento; #EMP você#! deve lembrá-los de onde o verdadeiro poder reside neste reino!\""
 hold_court.8260.desc.intro:0 "[vassal_faction_target.GetFullName] se aproxima com o rosto amargurado, impaciente para apresentar sua apelação. \n\n\"[ROOT.Char.GetTitleAsNameNoTooltip], m[Select_CString( vassal_faction_leader.IsFemale, 'inha', 'eu' )] [vassal_faction_target.Custom2('RelationToMeShort', SCOPE.sC('vassal_faction_leader'))], [vassal_faction_leader.GetTitledFirstName], busca desafiar minha posição legítima,"
 hold_court.8260.e:0 "Oh, eu #EMP devo#!, devo mesmo?"
 hold_court.8260.t:0 "A Paz d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
 hold_court.8270.a:0 "Eu aceito, [neighbor.GetTitledFirstNameNoTooltip]."
 hold_court.8270.b.accept:0 "[neighbor.GetTitledFirstNameNoTooltip] aceita suas alterações"
 hold_court.8270.b.refuse:0 "[neighbor.GetTitledFirstNameNoTooltip] recusa"
 hold_court.8270.b:0 "Acho esses termos um pouco desequilibrados..."
 hold_court.8270.d:0 "Eu acho que não."
 hold_court.8270.desc:0 "Meus heraldos anunciam a chegada de um governante vizinho de menor importância; [neighbor.GetTitledFirstName] do [neighbor.GetPrimaryTitle.GetNameNoTier]. \n\n[neighbor.GetSheHe|U] adentra seus salões com dignidade e faz uma reverência profunda: \"Sua graça, vim humildemente oferecer meu reino a você - caso aceite meus termos.\" \n\n\"Eu o servirei como um leal vassalo do [ROOT.Char.GetPrimaryTitle.GetNameNoTier] em troca de sua proteção; que nossas duas grandes casas prosperem com esse acordo!"
 hold_court.8270.t:0 "Juramento de Fidelidade"
 hold_court.8280.a.foreign:0 "Eles devem ser enviados de volta para o [nomad.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 hold_court.8280.a.local:0 "[nomad.GetTitledFirstNameNoTooltip], mantenha seus cavaleiros sob controle!"
 hold_court.8280.b:0 "Eu sempre preciso de cavaleiros habilidosos."
 hold_court.8280.c:0 "Você está claramente exagerando, [feudal_vassal.GetFirstNameNoTooltip]."
 hold_court.8280.desc.foreign:0 "[feudal_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] aguarda uma audiência, aparentemente distraíd[Select_CString( feudal_vassal.IsFemale, 'a', 'o' )] com seus problemas.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [feudal_vassal.GetSheHe] canta, \"Os [nomad_culture.GetCollectiveNoun] nômades em minhas fronteiras estão inquietos, e a cada dia mais deles cruzam o [nomad.GetTopLiege.GetPrimaryTitle.GetNameNoTier] para o meu [feudal_county.GetName].\" \n\n\"Temo que, se eles não forem expulsos, logo ocuparão todo o [feudal_county.GetTierAsNameNoTooltip]!\""
 hold_court.8280.desc.local:0 "[feudal_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] agendou uma audiência comigo e [nomad.Custom2('MyCharacterIntroduction', ROOT.Char)] - isso deve ser interessante...\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip]!\" [feudal_vassal.GetFirstNameNoTooltip] lamenta, \"Cavaleiros nômades das terras d[Select_CString( nomad.IsFemale, 'a', 'o' )] [nomad.GetTitledFirstNameNoTooltip] invadem meu [feudal_county.GetName] - eles precisam ir embora!\" \n\n[nomad.GetFirstNameNoTooltip] dá de ombros, \"Meu povo é nômade, eles apenas desejam encontrar pastagens adequadas e inexploradas para seus animais..."
 hold_court.8280.t:0 "Vizinhos Nômades"
 hold_court.8290.a:0 "Confio que sua cidade se lembrará de minha graça."
 hold_court.8290.b:0 "Um gosto da futura frutificação poderia me convencer."
 hold_court.8290.c:0 "O que você pede é inadmissível."
 hold_court.8290.desc:0 "Diante de mim está um[Select_CString( city_mayor.IsFemale, 'a', '' )] [city_mayor.GetWomanMan] desconhecid[Select_CString( city_mayor.IsFemale, 'a', 'o' )]: aparentemente [city_mayor.GetSheHe] é [city_mayor.GetFirstName], um[Select_CString( city_mayor.IsFemale, 'a', '' )] [city_mayor.GetTitleAsNameNoTooltip] em m[Select_CString( city_vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', city_vassal)], domínio d[Select_CString( city_vassal.IsFemale, 'a', 'o' )] [city_vassal.GetTitledFirstNamePossessive].\n\n\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip], venho aqui, sem a permissão [Select_CString( ROOT.Char.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.GetLadyLord], pedir que conceda à minha cidade, [city_province.GetTitle.GetNameNoTier], as terras ao redor para governar como achar melhor.\"\n\n\"Poderíamos administrar nossos próprios assuntos e trazer grande prosperidade ao [ROOT.Char.GetPrimaryTitle.Custom('GetTierBase')], se estivéssemos livres dos impostos sufocantes e responsabilidades impostas pel[Select_CString( city_vassal.IsFemale, 'a', 'o' )] [city_vassal.GetTitleAsNameNoTooltip] do [city_vassal.GetPrimaryTitle.GetNameNoTierNoTooltip].\""
 hold_court.8290.t:0 "A Carta de [city_province.GetTitle.GetAdjectiveNoTooltip]"
 hold_court.8300.a:0 "Uma ideia bastante intrigante."
 hold_court.8300.b:0 "Se #EMP você#! não quer os privilégios, outro os terá."
 hold_court.8300.c:0 "Seus direitos são invioláveis, [city_vassal.GetFirstNameNoTooltip]!"
 hold_court.8300.desc:0 "M[Select_CString( city_vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', city_vassal)], [city_vassal.GetTitledFirstName], é uma visão bem-vinda em meus salões, embora [city_vassal.GetSheHe] pareça incert[Select_CString( city_vassal.IsFemale, 'a', 'o' )] sobre como abordar seu pedido.\n\nFinalmente [city_vassal.GetSheHe] encontra as palavras: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], sou apenas um[Select_CString( city_vassal.IsFemale, 'a', '' )] humilde [city_vassal.GetTitleAsNameNoTooltip], contente com minhas pequenas posses. Busco apenas os interesses do meu povo no [city_vassal.GetPrimaryTitle.GetNameNoTier], acima de tudo os interesses das almas de [city_province.GetTitle.GetNameNoTier] — e, claro, os de #EMP todos#! [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].\"\n\n\"Peço que me permita renunciar aos direitos hereditários de minha família sobre minhas terras, para governá-las de forma comunitária, como fazem os prefeitos das cidades.\""
 hold_court.8300.t:0 "Renunciando Direitos"
 hold_court.8310.a:0 "#EMP Motivação#!?! Tal traição deve ser erradicada!"
 hold_court.8310.b:0 "Seu significado foi bem compreendido, [drifting_vassal.GetFirstNameNoTooltip]."
 hold_court.8310.body:0 "ajoelhando-se diante de mim hoje.\n\n[drifting_vassal.GetSheHe|U] começa: \"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip], todos sabemos que os tempos mudaram. As antigas leis e costumes [drifting_duchy.GetDeJureLiege.GetAdjectiveNoTooltip] devem ser varridos se [drifting_duchy.GetNameNoTierNoTooltip] deve ser corretamente reconhecido como um órgão integral de [drifting_kingdom.GetNameNoTierNoTooltip].\"\n\n\"Não é tarefa fácil erradicar esses vestígios remanescentes entre o povo, mas com a motivação certa... #EMP motivação#!..."
 hold_court.8310.c.failure:0 "Você torna as coisas mais confusas"
 hold_court.8310.c.success:0 "Suas mudanças são bem recebidas"
 hold_court.8310.c:0 "Oh? Vou analisar os estatutos [drifting_duchy.GetAdjectiveNoTooltip]."
 hold_court.8310.county_tooltip:0 "Todos os [counties|E] [de_jure|E] [drifting_duchy.GetAdjective] em seu [realm|E]"
 hold_court.8310.culture:0 "[drifting_vassal.GetCulture.GetCollectiveNoun],"
 hold_court.8310.d:0 "Tais coisas simplesmente levam tempo."
 hold_court.8310.desc:0 "Estou surpres[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ao ver m[Select_CString( drifting_vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', drifting_vassal)], [drifting_vassal.GetTitledFirstName], um[Select_CString( drifting_vassal.IsFemale, 'a', '' )] [drifting_vassal.GetLadyLord] do [drifting_duchy.GetAdjectiveNoTooltip]"
 hold_court.8310.faith:0 "[drifting_vassal.GetFaith.GetAdherentNamePlural],"
 hold_court.8310.faith_culture:0 "[drifting_vassal.GetCulture.GetCollectiveNoun] — e um [drifting_vassal.GetFaith.GetAdherentName] para completar — "
 hold_court.8310.fallback:0 "territórios,"
 hold_court.8310.t:0 "Cimentando o Reino"
 hold_court.8320.a:0 "As terras pertencem aos fiéis de [probate_priest.GetFaith.HighGodNamePossessive]."
 hold_court.8320.b:0 "Mantenha seu título [probate_vassal.GetFirstNameNoTooltip], mas compense os [probate_priest.GetFaith.AltPriestTermPlural]."
 hold_court.8320.body:0 "\"Meu nome é [probate_priest.GetFirstName], sua graça, do [probate_dead.GetFaith.HouseOfWorship] de [probate_province.GetTitle.GetNameNoTier]. Falamos a verdade! [probate_dead.GetFirstNameNoTooltip] foi um[Select_CString( probate_dead.IsFemale, 'a', '' )] [probate_dead.GetWomanMan] piedos[Select_CString( probate_dead.IsFemale, 'a', 'o' )]. [probate_dead.GetSheHe|U] passou muito tempo conosco antes de encontrar a paz de [probate_dead.GetFaith.HighGodNameAlternate] em [probate_dead.GetFaith.PositiveAfterLife]...\"\n\n[probate_vassal.GetTitledFirstNameNoTooltip] revira os olhos, ruborizando-se de raiva."
 hold_court.8320.c:0 "Muito complicado, parece que as reivindicações se anulam..."
 hold_court.8320.d:0 "Nada supera os direitos de herança de um[Select_CString( probate_vassal.IsFemale, 'a', '' )] [probate_dead.Custom2('RelationToMePossessive', probate_vassal)]."
 hold_court.8320.desc:0 "Memórias vagas deste caso surgem em minha mente — uma disputa sobre os desejos [Select_CString( probate_dead.IsFemale, 'da falecida', 'do falecido' )] [probate_dead.GetTitledFirstNamePossessive]...\n\n[probate_vassal.GetFirstNameNoTooltip] irrompe: \"[ROOT.Char.GetTitleAsNameNoTooltip], esteja cert[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], essas promessas de terras são meras falsidades! M[Select_CString( probate_dead.IsFemale, 'inha', 'eu' )] [probate_vassal.Custom2('RelationToMeShort', probate_dead)] pode ter dado esmolas aqui e ali, mas #EMP toda [probate_county.GetName|l]#!?! É simplesmente absurdo!\"\n\n"
 hold_court.8320.monk:0 "um monge [probate_priest.GetFaith.GetAdjectiveNoTooltip]."
 hold_court.8320.monk_2:0 "O monge limpa a garganta:"
 hold_court.8320.priest:0 "um [probate_priest.Custom('PriestTitle')] [probate_priest.GetFaith.GetAdjectiveNoTooltip]."
 hold_court.8320.priest_2:0 "O sacerdote limpa a garganta:"
 hold_court.8320.regent:0 "[probate_rep.GetTitledFirstName], [Select_CString( probate_vassal.IsFemale, 'a', 'o' )] [probate_vassal.GetTitleAsName] d[Select_CString( probate_rep.IsFemale, 'a', 'o' )] [probate_vassal.Custom2('RelationToMeShort', probate_rep)] do [probate_vassal.GetPrimaryTitle.GetNameNoTierPossessive], apresenta-se diante de mim, junto com"
 hold_court.8320.self:0 "M[Select_CString( probate_vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', probate_vassal)], [probate_vassal.GetName], apresenta-se diante de mim, junto com"
 hold_court.8320.t:0 "Inventário Problemático"
 hold_court.8330.a.courtly:0 "Os antigos direitos dos nobres vêm antes de todos os outros."
 hold_court.8330.a.glory_hound:0 "Seja o que for que façamos, deve tornar [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] mais forte."
 hold_court.8330.a.minority:0 "Há muito a ganhar com a pluralidade."
 hold_court.8330.a.parochial:0 "Estou aqui para fornecer uma liderança forte e estável."
 hold_court.8330.a.zealot:0 "Todos nós — #EMP até mesmo eu#! — somos apenas instrumentos de [ROOT.Char.GetFaith.HighGodName]."
 hold_court.8330.c.failure:0 "Seus apoiadores estão insatisfeitos"
 hold_court.8330.c.success:0 "Você encanta ambos"
 hold_court.8330.c:0 "Vocês são ambos súditos inestimáveis do reino."
 hold_court.8330.d:0 "Tal vaidade apenas insulta seus companheiros vassalos."
 hold_court.8330.desc:0 "Sou apresentad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] aos meus vassalos, [vassal_1.GetTitledFirstName] e [vassal_2.GetTitledFirstName], ambas vozes influentes no às vezes febril tribunal de [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierPossessiveNoTooltip]. Infelizmente, hoje suas vozes não soam em harmonia.\n\n[vassal_1.GetFirstNameNoTooltip] avança, \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], vim aqui na presença dos grandes e bons para colocar [vassal_2.GetFirstNameNoTooltip] no seu devido lugar!\"\n\n"
 hold_court.8330.end:0 "Tenho certeza de que você concorda comigo, [Select_CString( ROOT.Char.IsFemale, 'minha senhora', 'meu senhor' )].\"\n\n[vassal_2.GetFirstNameNoTooltip] apenas balança a cabeça, olhando para mim de forma expectante, junto com toda a corte..."
 hold_court.8330.intro.courtly:0 "\"As antigas famílias nobres de [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] estendem o alcance de seus privilégios mais e mais a cada ano,"
 hold_court.8330.intro.glory_hound:0 "\"Belicistas buscam arrastar o [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] para conflitos por seus próprios fins mesquinhos,"
 hold_court.8330.intro.minority:0 "Os [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] riem da sua generosidade enquanto tramam com seus inimigos,"
 hold_court.8330.intro.parochial:0 "Senhores preguiçosos e sem ambição, buscando uma vida tranquila, minam nossa força enquanto constroem suas fortunas,"
 hold_court.8330.intro.zealot:0 "\"É claro que os [ROOT.Char.GetFaith.AltPriestTermPlural] ganharam influência demais no [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip],"
 hold_court.8330.outro.courtly:0 "eles ameaçam o status das grandes casas do reino: [vassal_1.GetHouse.GetBaseNameNoTooltip], até mesmo #EMP [ROOT.Char.GetHouse.GetBaseNameNoTooltip]!#!"
 hold_court.8330.outro.glory_hound:0 "enquanto ficamos fracos e maduros para as tramas constantes de nossos inimigos sobre o reino."
 hold_court.8330.outro.minority:0 "desconsiderando as comunidades de cooperação pacífica que são a chave para nossa força."
 hold_court.8330.outro.parochial:0 "devemos ser cautelosos se quisermos manter o delicado equilíbrio dos interesses do reino."
 hold_court.8330.outro.zealot:0 "ignorando os preceitos do [ROOT.Char.GetFaith.ReligiousText] e a vontade de [ROOT.Char.GetFaith.HighGodName]."
 hold_court.8330.t:0 "Um Ruptura em [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 hold_court.8340.a:0 "Eu tenho #EMP exatamente#! o trabalho."
 hold_court.8340.b:0 "Muito bem, tenho algo para você."
 hold_court.8340.c:0 "Ah, finalmente um[Select_CString( candidate.IsFemale, 'a', '' )] [candidate.GetWomanMan] útil!"
 hold_court.8340.d:0 "Não há vagas no momento..."
 hold_court.8340.desc:0 "Um[Select_CString( candidate.IsFemale, 'a', '' )] [candidate.GetWomanMan] de [candidate.Custom('GetYoungMiddleAgedOld')] se apresenta diante de mim com dignidade silenciosa, antes de fazer uma reverência profunda: \"Saudações, sua majestade, eu sou [candidate.GetFirstName], [Select_CString( candidate.IsFemale, 'sua serva leal', 'seu servo leal' )]. Venho hoje para buscar emprego em sua corte.\"\n\n"
 hold_court.8340.diplomacy:0 "\"Eu já vi muitas cortes, oferecendo hospitalidade aos lordes locais de [birthplace.GetNameNoTierNoTooltip], minha terra natal, e seus muitos visitantes."
 hold_court.8340.intrigue:0 "\"Eu tenho uma grande quantidade de... #EMP experiência#! variada, adquirida nas cidades de [birthplace.GetNameNoTierNoTooltip], minha terra natal."
 hold_court.8340.learning:0 "\"Sou um[Select_CString( candidate.IsFemale, 'a', '' )] [candidate.GetWomanMan] de letras, tendo sido escriba para os lordes locais e [birthplace.GetCountyData.GetFaith.AltPriestTermPlural] de [birthplace.GetNameNoTierNoTooltip], minha terra natal."
 hold_court.8340.outro:0 "Seria uma honra para mim colocar meus talentos a serviço de uma causa maior, em serviço [Select_CString( ROOT.Char.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.GetTitleAsNameNoTooltip], e de todo [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].\""
 hold_court.8340.prowess:0 "\"Sou um combatente experiente, tendo servido aos lordes locais e guarnições de [birthplace.GetNameNoTierNoTooltip], minha terra natal."
 hold_court.8340.stewardship:0 "\"Sou um gestor experiente, tendo trabalhado para muitos dos lordes locais e cortes de [birthplace.GetNameNoTierNoTooltip], minha terra natal."
 hold_court.8340.t:0 "Em Busca de Trabalho"
 hold_court_8001.desc_arbitrary:0 "age injustamente, inventando infrações por capricho como se estivesse nos desafiando"
 hold_court_8001.desc_deceitful:0 "negocia em segredos e mentiras na nossa frente, mesmo em questões simples"
 hold_court_8001.desc_fallback:0 "é um obstáculo para o comércio e os interesses da cidade"
 hold_court_8001.desc_greedy:0 "cobra tarifas absurdas e multas sufocantes para seu próprio bolso"
 hold_court_8001.desc_incapable:0 "não pronuncia uma palavra há semanas, deixando o trabalho se acumular"
 hold_court_8001.desc_incompetent:0 "não consegue manter nem os registros mais rudimentares"
 hold_court_8001.desc_infirm:0 "mal consegue sair de sua cama, quanto mais resolver os problemas da cidade"
 hold_court_8001.desc_lazy:0 "escapa de todas as responsabilidades e mal cumpre a lei a menos que seja pressionado"
 hold_court_8001.desc_old:0 "já passou por muitos invernos e está perdendo a energia exigida pelo cargo"
 hold_court_8001.desc_young:0 "é inexperiente demais para ter entendimento suficiente da lei"
 hold_court_8001_compensated_modifier:0 "Comerciantes Compensados"
 hold_court_8001_deposed_modifier:0 "Intervenção Cívica"
 hold_court_8001_ignored_modifier:0 "Comércio Abafado"
 hold_court_8001_imprisoned_modifier:0 "Representante Preso"
 hold_court_8001_merchant_boon_modifier:0 "Toque do Comerciante"
 hold_court_8001_merchant_bust_modifier:0 "$hold_court_8001_merchant_boon_modifier$"
 hold_court_8010.desc_family:0 "os lares da Casa [ROOT.Char.GetDynastyHouseNameNoTooltip]"
 hold_court_8010.desc_republic:0 "os inocentes dentro de seus muros"
 hold_court_8010.desc_theocratic:0 "os humildes seguidores de [ROOT.Char.GetFaith.HighGodName]"
 hold_court_8010_fortifications_modifier:0 "Muralhas de Fronteira"
 hold_court_8010_vassal_modifier:0 "Cargas Compartilhadas"
 hold_court_8060_built_modifier:0 "Templo Financiado"
 hold_court_8070_built_modifier:0 "Cidade Financiada"
 hold_court_8080_compromise_modifier:0 "Carta Mercantil"
 hold_court_8080_granted_modifier:0 "Expansão Comercial"
 hold_court_8080_prison_modifier:0 "Prefeito Maltratado"
 hold_court_8080_upset_modifier:0 "Burgueses Ofendidos"
 hold_court_8090_favorites_modifier:0 "Jogando Favoritos"
 hold_court_8090_interest_almoner:0 "\n\n\"Só compartilhando nossos bens materiais podemos equilibrar o mal no mundo..."
 hold_court_8090_interest_antiquarian:0 "\n\n\"Tenho um grande interesse em história e garantirei o legado de seus tesouros.\""
 hold_court_8090_interest_architect:0 "\n\n\"Não se preocupe, a construção de grandes edifícios é uma das minhas paixões."
 hold_court_8090_interest_artificer:0 "\n\n\"Minha obra está entre as mais estimadas no [ROOT.Char.GetLiege.GetPrimaryTitle.GetTierAsNameNoTooltip].\""
 hold_court_8090_interest_bestie:0 "\n\n[ROOT.Char.GetFirstNameNoTooltip] tem sido [Select_CString( ROOT.Char.IsFemale, 'uma boa', 'um bom' )] e leal amig[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] para mim..."
 hold_court_8090_interest_bodyguard_bestie:0 "\n\nSe há alguém em quem posso confiar para o trabalho, é [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetFirstNameNoTooltip]..."
 hold_court_8090_interest_bodyguard_friend:0 "\n\nUm aliado tão próximo me servirá bem e me manterá companhia..."
 hold_court_8090_interest_bodyguard_lover:0 "\n\nÉ difícil não desmaiar diante do olhar ardente [ROOT.Char.GetHerHim]..."
 hold_court_8090_interest_bodyguard_soulmate:0 "\n\nSeus olhos denotam uma intensidade de emoção que mexe com meu coração..."
 hold_court_8090_interest_champion:0 "\n\n\"Pode ficar tranquilo, minha habilidade com a espada é conhecida em todo o [ROOT.Char.GetLiege.GetPrimaryTitle.GetTierAsNameNoTooltip].\""
 hold_court_8090_interest_cupbearer:0 "\n\n\"Não se preocupe, meu senhor, seu copo estará sempre cheio sob o meu cuidado!\""
 hold_court_8090_interest_emissary:0 "\n\n\"Meu histórico em negociações e compromissos é bem estabelecido.\""
 hold_court_8090_interest_eunuch:0 "\n\n\"Confie em mim, não terei distrações em meu trabalho.\""
 hold_court_8090_interest_fallback:0 "\n\nSuponho que essas tarefas precisam ser feitas por #EMP alguém#!..."
 hold_court_8090_interest_friend:0 "\n\nOh, como poderia recusar um amigo como [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetFirstNameNoTooltip]?"
 hold_court_8090_interest_gardener:0 "\n\n\"Eu tenho um grande amor por plantas; aprender seus usos e mantê-las felizes!\""
 hold_court_8090_interest_garuda:0 "\n\n\"Confio que minha reputação como duelista não lhe escapou.\""
 hold_court_8090_interest_horse:0 "\n\n\"Não tenha medo, nem mesmo a mais leve manqueira de seu destriero favorito escapará da minha atenção!\""
 hold_court_8090_interest_hunt:0 "\n\n\"Não há nada que eu aprecie mais do que uma boa caçada - é bem conhecido em todo o [ROOT.Char.GetLiege.GetPrimaryTitle.GetTierAsNameNoTooltip].\""
 hold_court_8090_interest_keeper_of_swans:0 "\n\n\"Tenho muita experiência com aves de caça, sou uma escolha óbvia.\""
 hold_court_8090_interest_lady_bestie:0 "\n\nParece que nunca precisarei me separar da minha amiga mais próxima!"
 hold_court_8090_interest_lady_friend:0 "\n\nEssa companhia bem-vinda certamente ajudará a amenizar a monotonia da vida na corte..."
 hold_court_8090_interest_lady_lover:0 "\n\nA esperta sedutora pisca para mim, e mal consigo evitar corar ao pensar nas oportunidades que isso nos dará..."
 hold_court_8090_interest_lady_soulmate:0 "\n\nNão há ninguém com quem eu prefira estar ao meu lado..."
 hold_court_8090_interest_lover:0 "\n\nÉ difícil resistir à oportunidade de manter [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetFirstNameNoTooltip] por perto..."
 hold_court_8090_interest_musician_culture:0 "\n\n\"Os [ROOT.Char.GetCulture.GetNameNoTooltip] têm muito a ensinar ao seu povo sobre as artes melódicas.\""
 hold_court_8090_interest_musician_gregarious:0 "\n\n\"Confie em mim, tornarei seus banquetes ainda mais inesquecíveis!\""
 hold_court_8090_interest_other:0 "\n\nTalvez [vassal.GetSheHe] seja uma opção melhor..."
 hold_court_8090_interest_physician_experience:0 "\n\n\"Você pode confiar que tratei de muitas doenças e ferimentos - não sou um simples charlatão."
 hold_court_8090_interest_physician_herbalist:0 "\n\n\"Meu conhecimento em elixires e bálsamos é bem estabelecido, deixe-me compartilhar meu conhecimento e talento.\""
 hold_court_8090_interest_physician_mystic:0 "\n\n\"Manter a saúde requer uma comunhão com poderes além do mundano, deixe-me mostrar a você..."
 hold_court_8090_interest_poet:0 "\n\n\"Sou um trovador renomado; seus salões ecoarão com histórias de sua distinção!\""
 hold_court_8090_interest_qadi:0 "\n\n\"Não precisa se preocupar, pois sou bem versado em todos os assuntos pertinentes.\""
 hold_court_8090_interest_seneschal_administrator:0 "\n\n\"Pode ficar tranquilo, não há ninguém mais entusiasmado em administrar seus assuntos."
 hold_court_8090_interest_seneschal_eunuch:0 "\n\n\"Não há nada que me distraia de administrar seus assuntos, eu lhe asseguro."
 hold_court_8090_interest_soulmate:0 "\n\nÉ difícil recusar [Select_CString( ROOT.Char.IsFemale, 'a', 'ao' )] [ROOT.Char.GetFirstNameNoTooltip] qualquer coisa, mesmo nos melhores momentos..."
