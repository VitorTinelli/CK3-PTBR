l_spanish:
 disabled_fallback:0 "deficiente"
 hold_court.4001.a:0 "Muito doce, [annoying_heir.GetSheHe] lembra [Select_CString( ROOT.Char.IsFemale, 'sua', 'seu' )] [ROOT.Char.GetMotherFather]!"
 hold_court.4001.accusation_default:0 "\n\n[annoyed_vassal.GetSheHe|U] suspira. \"Mas tenho certeza de que [annoying_heir.GetSheHe] negará ter feito isso.\""
 hold_court.4001.b:0 "Essa é a gota d'água! [preferred_heir.GetTitledFirstNameNoTooltip], você é [Select_CString( preferred_heir.IsFemale, 'a', 'o' )] escolhid[Select_CString( preferred_heir.IsFemale, 'a', 'o' )]."
 hold_court.4001.c:0 "Pela minha experiência, [preferred_heir.GetTitledFirstNameNoTooltip] é igualmente insuportável!"
 hold_court.4001.d:0 "Ser imperfeito faz com que os soldados vejam [annoying_heir.GetSheHe] como um deles!"
 hold_court.4001.desc.intro:0 "[annoyed_vassal.GetTitledFirstName] avança furiosamente até a frente da minha sala do trono. \"[ROOT.Char.Custom2('RelationToMeAddress', annoyed_vassal)|U], muitos acreditam que [Select_CString( preferred_heir.IsFemale, 'a', 'o' )] [preferred_heir.GetTitledFirstName] deveria se tornar seu sucessor em vez d[Select_CString( annoying_heir.IsFemale, 'a', 'o' )] [annoying_heir.GetTitledFirstName]. É conhecido em todo o [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] que [Select_CString( annoying_heir.IsFemale, 'sua herdeira', 'seu herdeiro' )] [annoying_heir.GetTitledFirstNameNoTooltip] ofende tanto a ponto de fazer da ofensa uma habilidade!"
 hold_court.4001.heir_admission:0 "\n\nUm sorriso malicioso se espalha pelo rosto d[Select_CString( annoying_heir.IsFemale, 'a', 'o' )] [annoying_heir.GetTitledFirstNameNoTooltip]. \"Ah, eu com certeza fiz.\""
 hold_court.4001.heir_diplomacy_failure:0 "[annoying_heir.GetSheHe|U] se recusa a comparecer a qualquer reunião, e quando perguntei a [annoying_heir.GetSheHe] por quê, [annoying_heir.GetSheHe] me disse 'eles são muito chatos, nos divertiríamos mais matando uns aos outros'."
 hold_court.4001.heir_hated:0 "[annoying_heir.GetSheHe|U] é um fanfarrão insuportável e se gabou para mim de que não se importa se gostamos [annoying_heir.GetHerHim] ou não."
 hold_court.4001.heir_robbery:0 "Em minha jornada até aqui, fui roubado por [Select_CString( annoying_heir.IsFemale, 'uma amazona', 'um cavaleiro' )] com roupas espalhafatosas. [annoying_heir.GetSheHe|U] me despiu e amarrou a uma árvore, antes de remover sua máscara e se gabar de que era na verdade [Select_CString( annoying_heir.IsFemale, 'a', 'o' )] [annoying_heir.GetTitledFirstNameNoTooltip]!"
 hold_court.4001.heir_street_fight:0 "O vilão ensanguentado fica rondando as tavernas e provoca camponeses bêbados para brigas. Vários morreram nesses tumultos onde [annoying_heir.GetSheHe] mata por esporte!"
 hold_court.4001.heir_tavern:0 "[annoying_heir.GetSheHe|U] praticamente vive na taverna e, assim que esgota sua mesada, os outros compram bebidas para [annoying_heir.GetSheHe] em troca de fazer imitações obscenas de você!"
 hold_court.4001.protective_parent:0 "\n\n[protective_parent.GetTitledFirstNameNoTooltip] faz tsc, horrorizado. \"Meu [annoying_heir.Custom('PetName')] nunca faria uma coisa dessas!\""
 hold_court.4001.t:0 "Flagelo"
 hold_court.4500.a:0 "Não preciso de um poeta."
 hold_court.4500.b:0 "Seus versos são encantadores, venha escrever para minha corte."
 hold_court.4500.desc:0 "Uma figura deslumbrante com um brilho de revelação sobre [demanding_poet.GetSheHe] se aproxima. \"Sou um grande poeta e viajei muito apenas para servi-lo. Compus a maior balada do cosmos, sobre sua glória e a magnificência da corte [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip].\""
 hold_court.4500.t:0 "Poesia Infinita"
 hold_court.4600.a:0 "Não sou um demônio, sou um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip], o que é muito, mas muito pior."
 hold_court.4600.b:0 "Uma ideia adorável! [chancellor.GetCouncilTitle]! Espalhe a notícia de que sou um demônio."
 hold_court.4600.c.tt:0 "Ainda não é tarde para mudar."
 hold_court.4600.c:0 "Será que realmente fui tão abominável?"
 hold_court.4600.d:0 "Tirem essa gentalha da minha vista."
 hold_court.4600.desc:0 "Um bando de camponeses imundos aparece diante do meu trono. Eles estão armados com os equipamentos agrícolas em chamas mais vis que já vi em toda a minha carreira de sufocar rebeliões.\n\n\"Este ser que nos governa é um verdadeiro demônio encarnado. Nenhum[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] [ROOT.GetCharacter.GetWomanMan] real seria capaz de tais extremidades violentas e profanidades. Exigimos o fim da sua tirania monstruosa!\""
 hold_court.4600.t:0 "[ROOT.GetCharacter.GetSheHe|U] Quem Se Transforma em um Monstro..."
 hold_court.4601.a:0 "Parece requintado!"
 hold_court.4601.b:0 "Temos banquetes mais refinados em casa..."
 hold_court.4601.d:0 "Meu coração mal parou de palpitar desde que comecei a ouvir as pessoas da cidade contar histórias de que você possui a alma de um verdadeiro demônio. Lamento não estar melhor familiarizado(a) com a sua temível pessoa.\n\nVisite meu castelo, e jantaremos das iguarias mais cruas conhecidas pelo [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]!"
 hold_court.4601.t:0 "[Select_CString( ROOT.GetCharacter.IsFemale, 'Minha deliciosa', 'Meu delicioso' )] [ROOT.GetCharacter.GetLadyLord|U],"
 hold_court.4602.a:0 "Quem devo comer como entrada?"
 hold_court.4602.b:0 "Tudo bem, você pode dar uma única mordida."
 hold_court.4602.c:0 "Eu vou embora! Isso é de mau gosto!"
 hold_court.4602.desc:0 "[cannibal_vassal.Custom('FortifiedBuilding')] d[Select_CString( cannibal_vassal.IsFemale, 'a', 'o' )] [cannibal_vassal.GetTitledFirstNameNoTooltip] é iluminado apenas por algumas velas tremeluzentes. [cannibal_vassal.GetSheHe|U] me faz sentar diante de uma mesa de banquete que não tem pratos além de diversos cortes de carne mal cozida.\n\n[cannibal_vassal.GetSheHe|U] se esgueira atrás da minha cadeira, esperando eu selecionar alguma comida. Depois de um tempo, [cannibal_vassal.GetSheHe] se inclina ao lado da minha cabeça, mostrando seus dentes.\n\n\"Há muit[Select_CString( ROOT.GetCharacter.IsFemale, 'as', 'os' )] [ROOT.GetCharacter.GetWomenMen] fin[Select_CString( ROOT.GetCharacter.IsFemale, 'as', 'os' )] cozinhando diante de nós esta noite, mas nenhuma tão deliciosa quanto você!"
 hold_court.4602.t:0 "[Select_CString( ROOT.GetCharacter.IsFemale, 'Minha deliciosa', 'Meu delicioso' )] [ROOT.GetCharacter.GetLadyLord|U]"
 hold_court.4900.a:0 "\"Eu não preciso de um pedaço de papel para me dizer isso!\""
 hold_court.4900.b:0 "\"Excelente! Garanta que a lista seja excessivamente longa!\""
 hold_court.4900.c:0 "\"[ROOT.GetCharacter.Custom('GetMythicalFounder')]? Nada comparado a mim!\""
 hold_court.4900.d:0 "\"Minha dinastia pode ser pequena, mas não somos tolos!\""
 hold_court.4900.desc:0 "Uma figura antiga se aproxima do meu trono, com um clique e um toque da bengala [suspicious_genealogist.GetHerHim], acompanhando cada passo.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], sou um genealogista, e você está ciente de que tem origem nobre. No entanto, nobre não é exatamente o mesmo que divino ou mítico. Desejo escrever um pergaminho que trace sua linhagem completa até o amanhecer da história. Por algumas poucas moedas de ouro, posso revelar a verdade para você e para o mundo: você é um verdadeiro descendente de [ROOT.GetCharacter.Custom('GetMythicalFounder')]!\""
 hold_court.4900.e:0 "\"Um argumento perfeito para cimentar meu status lendário!\""
 hold_court.4900.t:0 "Nos Tempos Antigos..."
 hold_court.4901.a.tt:0 "Você deixa o resto da corte ouvindo atentamente."
 hold_court.4901.a:0 "É hora de uma soneca. Sonharei com minha própria glória."
 hold_court.4901.b:0 "Isso emociona mais do que qualquer balada! Estou à beira do meu trono!"
 hold_court.4901.c:0 "\"Chega! A [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTooltip] lhe deve por seus serviços.\""
 hold_court.4901.desc.intro:0 "Após alguns dias, [Select_CString( suspicious_genealogist.IsFemale, 'a', 'o' )] genealogista [suspicious_genealogist.GetTitledFirstName] retorna. [suspicious_genealogist.GetSheHe|U] desenrola um pergaminho tão longo que pode cercar uma das minhas províncias. Meu [chaplain.GetCouncilTitle] tropeça nele um pouco enquanto a ponta desenrolada rola até os pés do meu trono.\n\n\"Aqui está a verdade sobre a sua origem, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [suspicious_genealogist.GetSheHe] limpa a garganta e começa a ler, \"hoje revelamos uma grande história. Diante de nós está [Select_CString( ROOT.GetCharacter.IsFemale, 'a', 'o' )] [ROOT.GetCharacter.GetTitledFirstNameNoTooltip],"
 hold_court.4901.desc.outro:0 "\n\nAlguns olhos na corte começam a se fechar."
 hold_court.4901.fathers:0 "filho de [father_1.GetFullNameNicknamedNoTooltip], gerado pelo temível [father_2.GetFullNameNicknamedNoTooltip], fruto das entranhas de [father_3.GetFullNameNicknamedNoTooltip], filho do notável [father_4.GetFullNameNicknamedNoTooltip], filho de [father_5.GetFullNameNicknamedNoTooltip]..."
 hold_court.4901.mothers:0 "filha de [mother_1.GetFullNameNicknamedNoTooltip], gerada pelo temível [mother_2.GetFullNameNicknamedNoTooltip], fruto das entranhas de [mother_3.GetFullNameNicknamedNoTooltip], emergida do ventre de [mother_4.GetFullNameNicknamedNoTooltip], filha da bela [mother_5.GetFullNameNicknamedNoTooltip]..."
