l_spanish:
 3020_MONUMENT_VALUE:0 "Estátua Restaurada"
 3020_multicultural_monument:0 "Monumento Multicultural"
 3020_multicultural_monument_desc:0 "Um importante monumento cultural foi recentemente renovado para incluir elementos de outra cultura, desfocando as linhas que dividem as duas culturas.\n\n#P +10%#! Velocidade de Conversão Cultural"
 3020_own_culture_monument:0 "Monumento Dominante"
 3020_own_culture_monument_desc:0 "Um importante monumento cultural foi recentemente derrubado e substituído por um pertencente a outra cultura, irritando os locais e desafiando sua identidade cultural.\n\n#P +10%#! Velocidade de Conversão Cultural"
 every_county_of_culture:0 "Cada [county|E] no [realm|E] da cultura [village.GetCountyData.GetCulture.GetName]"
 every_low_county_control:0 "Todo [county|E] no [realm|E] com 33 de [control|E] ou menos"
 generic_cp_discount_tt:0 "Esta [court_position|E] será #P 50%#! mais barata para empregar"
 hold_court.3000.a.tt:0 "Realizar um banquete em um futuro próximo renderá uma recompensa de [court_grandeur_value|E]."
 hold_court.3000.a:0 "Muito bem, eu aceito."
 hold_court.3000.b:0 "Sem obrigações! Seu senhor feudal exige isso!"
 hold_court.3000.c.failure:0 "[feast_vassal.GetTitledFirstNameNoTooltip] discorda e retira sua oferta de pagamento."
 hold_court.3000.c.success:0 "[feast_vassal.GetTitledFirstNameNoTooltip] concorda em abrir mão de seu pedido de um favor."
 hold_court.3000.c:0 "Talvez possamos acertar algo mais agradável?"
 hold_court.3000.d:0 "Receio que não possa aceitar."
 hold_court.3000.desc.dislikes:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')]. As pessoas em seu reino precisam de reuniões alegres ocasionais, onde possam esquecer suas tensões. Eu ficaria feliz em financiar um banquete, mesmo que seja realizado em seu nome, pois é para o bem do [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]. No entanto, eu esperaria um favor em retribuição.\""
 hold_court.3000.desc.likes:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')], há muito o que celebrar sob o seu governo! Por favor, permita-me pagar as despesas do seu próximo banquete! Talvez, em troca, você me conceda um favor no futuro?\""
 hold_court.3000.desc.opening.blind:0 "Ouço os passos d[Select_CString( feast_vassal.IsFemale, 'a', 'o' )] [feast_vassal.GetTitledFirstName] se aproximando de mim. Depois que eles param, segue-se uma evidente e praticada limpeza de garganta [feast_vassal.GetHerHim]. Talvez um método para chamar minha atenção. Posso perceber que [feast_vassal.GetSheHe] parece satisfeito com o que tem a dizer.\n\n"
 hold_court.3000.desc.opening:0 "[feast_vassal.GetTitledFirstName] se aproxima de mim com uma postura mais ereta do que o habitual e visivelmente ansioso para o que [feast_vassal.GetSheHe] tem a dizer.\n\n"
 hold_court.3000.t:0 "Um Banquete em Seu Nome"
 hold_court.3001.a:0 "Tenho certeza de que o próximo banquete será ainda melhor!"
 hold_court.3001.b:0 "Outra taça em nome [feast_vassal.GetHerHim]!"
 hold_court.3001.desc.dead:0 "Oh, que banquete maravilhoso foi aquele! É uma pena que [Select_CString( feast_vassal.IsFemale, 'a', 'o' )] [feast_vassal.GetTitledFirstName] não tenha podido vê-lo. Alguns dos presentes recordaram a memória do meu banquete prometido a [feast_vassal.GetSheHe] e falaram calorosamente do meu empenho em entreter minha corte. Alguns presumiram que esta celebração também foi dedicada à memória d[Select_CString( feast_vassal.IsFemale, 'a', 'o' )] [feast_vassal.GetFirstNameNoTooltip]. De qualquer forma, cumprir minha promessa resultou no benefício de todos os presentes falarem bem da minha corte!"
 hold_court.3001.desc:0 "Que banquete maravilhoso foi aquele! Com o banquete prometido [Select_CString( feast_vassal.IsFemale, 'a', 'ao' )] [feast_vassal.GetTitledFirstName] ainda fresco na memória daqueles que compareceram naquele dia, os presentes ao meu banquete estão entusiasmados, cantando meus louvores. Senti-me embriagado de felicidade enquanto as pessoas aplaudiam e me adoravam! Uma vantagem adicional de cumprir minha promessa [Select_CString( feast_vassal.IsFemale, 'a', 'ao' )] [feast_vassal.GetFirstNameNoTooltip] é que todos os que compareceram falam bem da minha corte!"
 hold_court.3010.a:0 "Este pregador deve se juntar à minha corte!"
 hold_court.3010.b:0 "Tirem este pregador da minha vista!"
 hold_court.3010.c:0 "Desejo empregar este pregador como meu $high_almoner_court_position$."
 hold_court.3010.d:0 "Se [unconventional_preacher.GetSheHe] pode ensinar camponeses, então [unconventional_preacher.GetSheHe] seria um bom $court_tutor_court_position$..."
 hold_court.3010.desc.closing:0 "Isso não está de acordo com a nossa fé!\"\n\n[tolerant_vassal.GetTitledFirstName] interrompe o discurso d[Select_CString( religious_vassal.IsFemale, 'a', 'o' )] [religious_vassal.GetFirstNameNoTooltip] levantando a mão e dando um passo à frente. \"[ROOT.Char.Custom2('RelationToMeAddress', tolerant_vassal)|U], embora [Select_CString( religious_vassal.IsFemale, 'a', 'o' )] [religious_vassal.GetFirstNameNoTooltip] esteja correto em sua avaliação, esse é o único defeito do pregador. Tudo o que [unconventional_preacher.GetSheHe] ensina está de acordo com a nossa fé.\""
 hold_court.3010.desc.opening:0 "\"[ROOT.Char.Custom2('RelationToMeAddress', religious_vassal)|U],\" a voz d[Select_CString( religious_vassal.IsFemale, 'a', 'o' )] [religious_vassal.GetTitledFirstName] é severa. \"Peço que lancemos uma investigação sobre um pregador infame em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. Você vê, esse pregador é... Bem..."
 hold_court.3010.desc.preacher_gender:0 "Ela é uma #EMP pregadora!#!"
 hold_court.3010.desc.preacher_marriage:0 "O problema com ess[Select_CString( unconventional_preacher.IsFemale, 'a', 'e' )] pregador[Select_CString( unconventional_preacher.IsFemale, 'a', '' )] é que [unconventional_preacher.GetSheHe] se casou com alguém além de [ROOT.Char.GetFaith.HighGodName]!"
 hold_court.3010.t:0 "Um Pregador Inconvencional"
 hold_court.3020.a:0 "\"Derrubem isso!\""
 hold_court.3020.b:0 "Dê sua aprovação formal para a restauração."
 hold_court.3020.c:0 "Construa um monumento diferente — um que represente ambas as culturas."
 hold_court.3020.desc:0 "Um camponês se aproxima, carregando uma petição. '[ROOT.Char.Custom('FormOfAddressForLiege')|U], venho até você como representante dos [village.GetCountyData.GetCulture.GetCollectiveNounNoTooltip] da [village.GetName].' O camponês faz uma breve pausa em seu discurso ensaiado.\n\n\"Nossa súplica para ver um importante monumento de nossa cultura restaurado foi ignorada pelo [holder_of_area.GetTitleTierName]. [holder_of_area.GetSheHe|U] está nos impedindo ativamente de reconstruir!\"\n\n\"[ROOT.Char.Custom2('RelationToMeAddress', holder_of_area)|U], permita-me explicar!\" [holder_of_area.GetFirstNameNoTooltip] interrompe em pânico. \"Esse monumento zomba de nossa cultura! Ele retrata os [holder_of_area.GetCulture.GetCollectiveNounNoTooltip] como monstros! Certamente, você pode entender por que me oponho à restauração de um monumento tão odioso!\""
 hold_court.3020.t:0 "Um Monumento Ofensivo"
 hold_court.3030.a:0 "\"Você receberá os fundos necessários para a restauração.\""
 hold_court.3030.b:0 "Use os materiais restantes para outras construções."
 hold_court.3030.c:0 "\"Não podemos nos dar ao luxo de gastar ouro com essa questão.\""
 hold_court.3030.desc:0 "Um[Select_CString( different_culture_peasant.IsFemale, 'a', '' )] [different_culture_peasant.GetWomanMan] camponês[Select_CString( different_culture_peasant.IsFemale, 'a', '' )] se apresenta diante de mim, informando a corte do seu pedido.\n\n\"A recente guerra causou estragos no campo, e não temos certeza de quem foi o culpado, mas eles saquearam um importante local cultural para nós [different_culture_peasant.GetCulture.GetCollectiveNounNoTooltip] de [province.GetName]. Por favor, imploramos a você, reserve alguns dos seus recursos para que possamos vê-lo restaurado!\"\n\nO camponês encerra seu pedido com uma reverência desajeitada — um claro indicador de sua baixa condição social."
 hold_court.3030.t:0 "Restauração do Monumento"
 hold_court.3040.a:0 "Eu irei empregar esse bobo da corte seu!"
 hold_court.3040.b:0 "Um papel perfeito para [Select_CString( jester_requester.IsFemale, 'a', 'o' )] [jester_requester.GetTitledFirstNameNoTooltip], mestre em parecer um tolo."
 hold_court.3040.c:0 "Se [Select_CString( kill_joy.IsFemale, 'a', 'o' )] [kill_joy.GetTitledFirstNameNoTooltip] não gosta de rir, devemos tornar [kill_joy.GetSheHe] o motivo de risada!"
 hold_court.3040.d:0 "Este não é um mercado de camponeses! Um bobo da corte não tem lugar nesta corte!"
 hold_court.3040.desc:0 "Em um breve momento de silêncio, vejo [Select_CString( jester_requester.IsFemale, 'a', 'o' )] [jester_requester.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPPPosOrNeg', SCOPE.sC('jester_requester'))] antes de perceber que é a vez [jester_requester.GetHerHim] de falar. \"[ROOT.Char.Custom2('RelationToMeAddress', jester_requester)|U]!\" [jester_requester.GetSheHe|U] diz, dando a [jester_requester.GetSheHe] algum tempo precioso para finalizar seus pensamentos antes de continuar.\n\n\"Sorrisos e risadas são um grande indicador de uma corte animada! Portanto, tenho uma sugestão de alguém que seria um ótimo bobo da corte para nos entreter em uma visita!\"\n\n\"[ROOT.Char.Custom2('RelationToMeAddress', kill_joy)|U], se me permite.\" [kill_joy.GetTitledFirstName] fala da lateral, \"Um bobo da corte estragará o ar sofisticado desta corte e substituirá sua refinamento por um humor grosseiro e infantil.\""
 hold_court.3040.e:0 "Talvez eu investigue isso em outro momento."
 hold_court.3040.t:0 "Pedindo Risadas"
 hold_court.3060.a:0 "Devemos investir nessas regiões selvagens."
 hold_court.3060.b:0 "Meu Administrador pode lhe oferecer conselhos."
 hold_court.3060.c:0 "Infelizmente, o tesouro está vazio."
 hold_court.3060.d:0 "M[Select_CString( cp_steward_replacement.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('cp_steward_replacement'))], [cp_steward_replacement.GetFirstNameNoTooltip], seria um Administrador melhor."
 hold_court.3060.desc.bandits:0 "bandidos assediando o povo modesto de [corrupt_county.GetNameNoTier]!"
 hold_court.3060.desc.closing:0 "\n\n[county_petitioner.GetSheHe|U] faz uma pausa para suspirar. \"Minhas terras são apenas uma dentre muitas no reino sofrendo com a falta de controle. Peço qualquer ajuda que você possa oferecer.\""
 hold_court.3060.desc.courts:0 "a falta de tribunais judiciais em [corrupt_county.GetNameNoTier]!"
 hold_court.3060.desc.guilds:0 "falta de cooperação das guildas em [corrupt_county.GetNameNoTier]!"
 hold_court.3060.desc.levies:0 "milícias não sendo restauradas em um ritmo aceitável em [corrupt_county.GetNameNoTier]!"
 hold_court.3060.desc.opening:0 "M[Select_CString( county_petitioner.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('county_petitioner'))], [county_petitioner.GetTitledFirstName], [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('county_petitioner'))] antes de dar um passo à frente para apresentar sua petição. \"[ROOT.Char.Custom2('RelationToMeAddress', county_petitioner)|U], eu busco sua ajuda para combater o problema dos "
 hold_court.3060.desc.rulers:0 "a administração negligente de [corrupt_county.GetNameNoTier]!"
 hold_court.3060.desc.sheriffs:0 "a falta de xerifes em [corrupt_county.GetNameNoTier]!"
 hold_court.3060.desc.tax:0 "a arrecadação de impostos não funcionando em [corrupt_county.GetNameNoTier]!"
 hold_court.3060.desc.thieves:0 "ladrões roubando de [corrupt_county.GetNameNoTier] e seu povo!"
 hold_court.3060.t:0 "Combatendo a Corrupção"
 hold_court.3080.a.tt:0 "Esquemas hostis de artefatos se tornarão mais comuns."
 hold_court.3080.a:0 "Eu quero que as pessoas paguem para contemplar um vislumbre da minha glória!"
 hold_court.3080.b:0 "Algumas pessoas precisam ver para acreditar, e isso inclui os menos afortunados."
 hold_court.3080.c:0 "Não vale a pena correr os riscos."
 hold_court.3080.desc:0 "M[Select_CString( antiquarian.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('antiquarian'))], [antiquarian.GetTitledFirstName], se aproxima de mim com um sorriso no rosto.\n\n\"[ROOT.Char.Custom2('RelationToMeAddress', antiquarian)|U]!\" [antiquarian.GetFirstNameNoTooltip] diz, cheio de empolgação. \"Eu tenho uma grande ideia que pode lhe trazer dinheiro ou fama! Você acumulou uma coleção impressionante de artefatos, [ROOT.Char.Custom('FormOfAddressForLiege')], então por que não os exibe? Você poderia cobrar pela visita à sua coleção ou oferecer gratuitamente para que mais pessoas possam vê-la.\"\n\n[antiquarian.GetSheHe|U] pigarreia antes de continuar, \"As pessoas têm uma tendência a desejar as coisas que veem, então o inconveniente pode ser que mais pessoas queiram reivindicar seus artefatos.\""
 hold_court.3080.t:0 "Exibindo a Coleção d[Select_CString( ROOT.GetCharacter.IsFemale, 'a', 'o' )] [ROOT.GetCharacter.GetTitledFirstName]"
 hold_court.3090.a:0 "Vamos realizar um grande festival, celebrando ambas as nossas culturas!"
 hold_court.3090.b:0 "Podemos organizar uma pequena feira [different_culture_vassal.GetCulture.GetNameNoTooltip] em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 hold_court.3090.c:0 "Realizar uma exposição nas terras dos [different_culture_vassal.GetCulture.GetCollectiveNounNoTooltip] para mostrar a grandeza da cultura [ROOT.GetCharacter.GetCulture.GetNameNoTooltip]!"
 hold_court.3090.d:0 "Eu não posso gastar recursos com isso."
 hold_court.3090.desc:0 "M[Select_CString( different_culture_vassal.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('different_culture_vassal'))], [different_culture_vassal.GetTitledFirstName], se aproxima de mim, [ROOT.Char.Custom2('QuirkPPPosOrNeg', SCOPE.sC('different_culture_vassal'))], como [different_culture_vassal.GetSheHe] frequentemente faz.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], eu tenho uma ideia brilhante! Que tal nós organizarmos uma feira, ou talvez até mesmo um festival para o povo comum, para expô-los a uma das diferentes culturas em nosso belo [ROOT.Char.Custom('RealmType')].\" [different_culture_vassal.GetFirstNameNoTooltip] explica sua ideia mais detalhadamente, até [different_culture_vassal.GetSheHe] perceber que está perigosamente perto de explicá-la demais.\n\n\"Isso custará dinheiro, mas tenho certeza de que ajudará a promover um relacionamento mais positivo entre nosso povo!\""
 hold_court.3090.t:0 "Celebrando Outra Cultura"
 hold_court.3091.a:0 "Vamos realizar um festival para celebrar nossa rica cultura [same_culture_vassal.GetCulture.GetNameNoTooltip]!"
 hold_court.3091.b:0 "Organize uma exposição para mostrar nossas maiores realizações."
 hold_court.3091.c:0 "Não há necessidade de exercermos superioridade sobre outras culturas."
 hold_court.3091.desc:0 "O ar está cheio de expectativa quando m[Select_CString( same_culture_vassal.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('same_culture_vassal'))], [same_culture_vassal.GetTitledFirstName], se aproxima de mim.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], venho com notícias graves, mas também com uma solução para resolver esse problema. Está cada vez mais claro que os [different_culture_vassal.GetCulture.GetCollectiveNoun] e os [same_culture_vassal.GetCulture.GetCollectiveNoun] estão se tornando cada vez mais, talvez até mesmo #EMP muito#! semelhantes. É de suma importância mostrarmos a eles que somos nós, [same_culture_vassal.GetCulture.GetCollectiveNounNoTooltip], que estamos na vanguarda da inovação!\""
 hold_court.3091.t:0 "Fusão de Identidades Culturais"
