l_spanish:
 every_county_10_dev_below_capital:0 "Cada [county|E] com pelo menos 10 níveis de [development|E] abaixo de sua [capital|E]"
 friend_beyond_faith:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUIName] deixaram de lado todas as diferenças religiosas pelo bem da família e da aliança"
 friend_united_by_faith:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUIName] se uniram na fé"
 friend_will_convert_tt:0 "[same_faith_friend.GetFirstName|U] se converterá à fé reformada com você."
 hc_7000_dev_boost:0 "Desenvolvimento Próspero"
 hc_7000_dev_boost_desc:0 "Recursos foram recentemente redirecionados para ajudar no crescimento deste condado."
 hc_7000_dev_reduction:0 "Desenvolvimento Prejudicado"
 hc_7000_dev_reduction_desc:0 "Os recursos deste condado estão sendo desviados para partes distantes do reino, prejudicando a qualidade de vida aqui."
 hc_7010_holy_war:0 "Preparando-se para Guerra Santa"
 hc_7010_holy_war_desc:0 "Este personagem decretou recentemente que todos os descrentes devem ser erradicados em suas terras e ao redor."
 hc_7010_tolerance:0 "Casamento Tolerante"
 hc_7010_tolerance_desc:0 "Este personagem recentemente casou um de seus parentes com um membro de uma fé diferente, espalhando sentimentos de tolerância por suas terras."
 hc_7020_guardian_of_the_old_ways:0 "Guardião das Antigas Tradições"
 hc_7020_guardian_of_the_old_ways_desc:0 "Este personagem se dedicou à proteção e preservação de sua fé."
 hold_court.7000.a:0 "\"Seria.\""
 hold_court.7000.b:0 "\"Seus súditos já tentaram viver em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip|U]?\""
 hold_court.7000.c:0 "\"Deveria isso me interessar? Não me interessa.\""
 hold_court.7000.desc:0 "[local_leader.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vagueia pela corte, seus olhos admirando maravilhados a riqueza que se pode permitir na capital.\n\n\"Não é segredo que [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip|U] é a inveja do mundo, [ROOT.Char.Custom('FormOfAddressForLiege')], mas nem todo o seu reino é tão afortunado. Em [low_dev_county.GetNameNoTier], por exemplo, os campos estão áridos, sem praticamente ninguém para atendê-los. Não seria grandioso se todo o reino fosse tão magnífico quanto [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip|U]?\""
 hold_court.7000.t:0 "Justa Repartição"
 hold_court.7010.a.jewish:0 "\"Mazel tov!\""
 hold_court.7010.a:0 "\"Então haverá um casamento!\""
 hold_court.7010.b:0 "\"Minha lâmina anseia pelo sangue [friendly_neighbour.GetFaith.GetAdherentNameNoTooltip]!\""
 hold_court.7010.c:0 "\"Tal casamento seria heresia.\""
 hold_court.7010.desc:0 "[friendly_neighbour.Custom2('MyCharacterIntroduction', ROOT.Char)|U] entra no salão com uma confiança que não condiz com [friendly_neighbour.GetSheHe], como se [friendly_neighbour.GetSheHe] fosse qualquer coisa menos um intruso em minha benevolente corte [ROOT.Char.GetFaith.GetAdjectiveNoTooltip].\n\n\"Bo[Select_CString( ROOT.Char.IsFemale, 'a', 'm' )] [ROOT.Char.GetTitleAsNameNoTooltip|U] [ROOT.Char.GetFirstName], não é segredo que você é um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] com muitos inimigos em suas fronteiras, mas se eu tiver sorte, espero não estar entre eles. Muitos desejariam ver todos os [ROOT.Char.GetFaith.GetAdherentNamePlural] apagados da região, mas proponho que você e eu tragam a paz. A questão é bem simples: você tem um [potential_prince.Custom('GetDaughterSon')], eu tenho uma [foreign_princess.Custom('GetDaughterSon')]. Que os dois se casem e acabem com as disputas.\""
 hold_court.7010.t:0 "Duas Fés, Uma Família"
 hold_court.7020.a:0 "\"Para perseverar, devemos mudar.\""
 hold_court.7020.b:0 "\"Permaneçam fortes, não devemos sacrificar nossos costumes.\""
 hold_court.7020.c:0 "\"Juntos podemos preservar as antigas tradições para sempre.\""
 hold_court.7020.desc.intro:0 "[same_faith_friend.Custom2('MyCharacterIntroduction', ROOT.Char)|U] entra em minha corte hoje com uma sombria procissão de [ROOT.Char.GetFaith.PriestNeuterPlural] a reboque, entoando orações tradicionais [ROOT.Char.GetFaith.GetAdjective] em seu caminho.\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Boa', 'Bom' )] [ROOT.Char.GetTitleAsNameNoTooltip|U], você e eu sabemos que as antigas tradições estão sob ameaça."
 hold_court.7020.desc.mid.holy_site:0 "Nossas terras sagradas permanecem fora de nosso alcance, e temo que os fiéis possam nunca ser capazes de visitar os lugares escolhidos de [ROOT.Char.GetFaith.HighGodName|U] nesta terra."
 hold_court.7020.desc.mid.oppression:0 "Incontáveis seguidores de [ROOT.Char.GetFaith.HighGodName|U] foram subjugados sob as mãos de [threatening_ruler.GetName], e o risco de conversão forçada cresce a cada dia."
 hold_court.7020.desc.mid.recent_war:0 "Suas terras foram violadas pelas mãos [threatening_ruler.GetPrimaryTitle.GetAdjectiveNoTooltip|U], e os templos de [ROOT.Char.GetFaith.HighGodName|U] foram queimados."
 hold_court.7020.desc.outro:0 "É óbvio para mim que devemos organizar a fé para que as antigas tradições possam sobreviver ao ataque de [threatening_ruler.GetFaith.GetReligion.GetName]."
 hold_court.7020.t:0 "O Escudo do [ROOT.Char.GetFaith.GetNameNoTooltip]"
 ignore_3_site_rule_tt:0 "Você pode reformar sua [faith|E] sem a exigência habitual de possuir [holy_sites|E]"
 rival_planning_holy_war:0 "[CHARACTER.GetShortUIName|U] rejeitou o pedido de [TARGET_CHARACTER.GetShortUIName] por paz religiosa"
 rival_planning_holy_war_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] rejeitou o pedido de [CHARACTER.GetShortUIName] por paz religiosa"
 truce_religious_tolerance:0 "Tolerância Religiosa"
