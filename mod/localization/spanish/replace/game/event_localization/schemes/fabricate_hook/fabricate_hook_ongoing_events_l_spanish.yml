l_spanish:
 fabricate_hook_ongoing.0001.a:0 "\"Será que [target.GetSheHe] tem algum ponto fraco que eu deveria saber?\""
 fabricate_hook_ongoing.0001.b:0 "\"Como posso me aproximar mais [target.GetHerHim]?\""
 fabricate_hook_ongoing.0001.desc:0 "[target.Custom2('RelationToMe', SCOPE.sC('family_member'))] de [target.GetTitledFirstNamePossessive], [family_member.GetTitledFirstName], tem sido incomumente prestativ[Select_CString( family_member.IsFemale, 'a', 'o' )]. Mesmo sabendo que posso não ter intenções inteiramente puras em relação [Select_CString( target.IsFemale, 'a', 'ao' )] [target.GetFirstName], [family_member.GetSheHe] está mais do que disposto a responder minhas perguntas."
 fabricate_hook_ongoing.0001.t:0 "$fabricate_hook_header$ Contato Familiar"
 fabricate_hook_ongoing.0002.a:0 "Meus espiões devem investigar para explicar esse mistério."
 fabricate_hook_ongoing.0002.b:0 "Eu preciso saber o que [hooking_character.GetSheHe] faz com que [target.GetSheHe] obedeça!"
 fabricate_hook_ongoing.0002.desc:0 "[target.GetTitledFirstName] parece excepcionalmente cauteloso em torno de s[Select_CString( hooking_character.IsFemale, 'ua', 'eu' )] [target.Custom2('RelationToMeShort', hooking_character )], [hooking_character.GetTitledFirstName]. Esse tipo de deferência só pode significar que [hooking_character.GetFirstNameNoTooltip] possui alguma forma de influência sobre [target.GetSheHe].\n\nTalvez haja algo para eu aprender aqui?"
 fabricate_hook_ongoing.0002.t:0 "$fabricate_hook_header$ Influência Indevida"
 fabricate_hook_ongoing.0003.a:0 "Vamos arruinar a reputação [target.GetHerHim]!"
 fabricate_hook_ongoing.0003.a_gregarious:0 "Você #EMP sabe#! que é a coisa certa a fazer."
 fabricate_hook_ongoing.0003.b:0 "Um ouvido simpático próximo a [target.GetSheHe] é o suficiente."
 fabricate_hook_ongoing.0003.b_lustful:0 "Ou #EMP nós#! poderíamos começar algo aqui ao invés disso..."
 fabricate_hook_ongoing.0003.desc:0 "Meus agentes fizeram contato com um[Select_CString( servant.IsFemale, 'a', '' )] criad[Select_CString( servant.IsFemale, 'a', 'o' )] no [target.Custom('ResidenceBuilding')] [target.GetTitledFirstNamePossessive]."
 fabricate_hook_ongoing.0003.desc_ending:0 "\n\nCom o incentivo certo, [dummy_servant_gender.GetSheHe] está dispost[Select_CString( dummy_servant_gender.IsFemale, 'a', 'o' )] a começar alguns #EMP rumores#! sobre [target.GetTitledFirstNameNoTooltip] não ser tão [target.Custom('FormalComplimentAdjective')] quanto [target.GetSheHe] parece!"
 fabricate_hook_ongoing.0003.desc_servant:0 "Meus agentes fizeram contato com [servant.GetTitledFirstName], um[Select_CString( servant.IsFemale, 'a', '' )] criad[Select_CString( servant.IsFemale, 'a', 'o' )] no [target.Custom('ResidenceBuilding')] de [target.GetTitledFirstNamePossessive]."
 fabricate_hook_ongoing.0003.t:0 "$fabricate_hook_header$ Fofocas"
 fabricate_hook_ongoing.0004.a:0 "Logo descobrirei a verdade sobre [target.GetSheHe]."
 fabricate_hook_ongoing.0004.b.failure:0 "[target.GetSheHe|U] descobre sobre você."
 fabricate_hook_ongoing.0004.b.success:0 "Você descobre sobre [target.GetSheHe]."
 fabricate_hook_ongoing.0004.b:0 "Vou tomar o meu tempo com isso."
 fabricate_hook_ongoing.0004.desc:0 "[target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] é um[Select_CString( target.IsFemale, 'a', '' )] [target.GetWomanMan] complicad[Select_CString( target.IsFemale, 'a', 'o' )].\n\nPreciso entender [target.GetSheHe] o melhor possível se eu quiser convencer as pessoas a ficarem do meu lado em quaisquer futuras... #EMP discussões#!."
 fabricate_hook_ongoing.0004.t:0 "$fabricate_hook_header$ Questão de Gosto"
 fabricate_hook_ongoing.0005.a:0 "Tenho certeza de que essas informações serão úteis."
 fabricate_hook_ongoing.0005.desc:0 "As pessoas descrevem [target.GetTitledFirstName] como sendo tanto [target.Custom('ComplimentAdjective')] quanto [target.Custom2('InsultAdjective', ROOT.Char)], o que me diz mais sobre o relacionamento delas com [target.GetSheHe] do que qualquer outra coisa.\n\nAlém disso, um número curioso de pessoas menciona com que frequência [target.GetSheHe] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('target'))] e fala sobre [target.Custom('herhis_subject_of_interest')]."
