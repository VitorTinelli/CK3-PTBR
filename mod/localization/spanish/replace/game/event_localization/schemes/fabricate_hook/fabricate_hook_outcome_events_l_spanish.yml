l_spanish:
 fabricate_hook_header:0 "Fabricar Engodo:"
 fabricate_hook_hook_gained_on_you:0 "@warning_icon [owner.GetShortUIName] fabricou um [hook|E] em você!"
 fabricate_hook_outcome.0001.a:0 "Tudo que preciso fazer é deixar [target.GetSheHe] saber o que eu sei..."
 fabricate_hook_outcome.0001.b:0 "Guardarei isso em segredo por enquanto."
 fabricate_hook_outcome.0001.c:0 "Ah, isso é algo que todos deveriam saber!"
 fabricate_hook_outcome.0001.desc:0 "[target.GetTitledFirstName] parece ter algo a esconder. Sorte a minha. Não preciso ser tão criativ[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] para fazer [target.GetSheHe] cair em minhas mãos."
 fabricate_hook_outcome.0001.t:0 "$fabricate_hook_header$ Um Segredo"
 fabricate_hook_outcome.1001.a.flavor:0 "Ah, falar com malabaristas. De novo."
 fabricate_hook_outcome.1001.a:0 "Mande os artistas!"
 fabricate_hook_outcome.1001.b:0 "Devo pensar mais cuidadosamente sobre isso."
 fabricate_hook_outcome.1001.c:0 "Tudo isso foi um grande erro."
 fabricate_hook_outcome.1001.desc:0 "Todo mundo fica nu #EMP em algum momento.#! A parte difícil é garantir que o grupo de malabaristas entre nas câmaras de [target.GetTitledFirstName] no momento certo, e que haja servos suficientes para especular sobre o caos subsequente.\n\nEu suspeito que [target.GetFirstNameNoTooltip] fará qualquer coisa para evitar que eu atice as chamas dos rumores seguintes..."
 fabricate_hook_outcome.1001.t:0 "$fabricate_hook_header$ Uma Situação Comprometedora"
 fabricate_hook_outcome.1002.a:0 "\"Esse #EMP é#! a sua assinatura, não é?\""
 fabricate_hook_outcome.1002.desc.no_vassals:0 "Ao copiar o selo de [target.GetTitleAsNamePossessive], posso fabricar uma carta ameaçando aumentar os impostos e divulgá-la entre os cortesãos [target.GetHerHim]. Ou pelo menos ameaçar fazê-lo..."
 fabricate_hook_outcome.1002.desc.vassals:0 "Ao copiar o selo de [target.GetTitleAsNamePossessive], posso fabricar uma carta ameaçando aumentar os impostos e divulgá-la entre os vassalos [target.GetHerHim]. Ou pelo menos ameaçar fazê-lo..."
 fabricate_hook_outcome.1002.desc:0 "Ao impedir um mensageiro da corte de [target.GetTitledFirstName], uma oportunidade se apresentou.\n\n"
 fabricate_hook_outcome.1002.t:0 "$fabricate_hook_header$ Uma Mensagem Comprometedora"
 fabricate_hook_outcome.1003.a:0 "Tão simples, mas tão convincente."
 fabricate_hook_outcome.1003.desc:0 "Não seria maravilhoso se [target.GetTitledFirstName] me devesse algo, não por medo, mas por gratidão? Se, por exemplo, eu salvasse [target.GetSheHe] de bandidos cruéis enquanto [target.GetSheHe] estivesse viajando? Na verdade, bandidos cruéis como os homens que estão esperando do lado de fora do portão do castelo?\n\nEu avançaria com minha guarda no último momento, afugentando-os e deixando [target.GetFirstNameNoTooltip] em dívida de vida comigo."
 fabricate_hook_outcome.1003.t:0 "$fabricate_hook_header$ Um Resgate Audacioso"
 fabricate_hook_outcome.1004.a.flavor:0 "Meu [ROOT.Char.GetFaith.PriestNeuter] não vai gostar disso."
 fabricate_hook_outcome.1004.a.flavor_sacred_shadows:0 "Meu [ROOT.Char.GetFaith.PriestNeuter] vai adorar isso!"
 fabricate_hook_outcome.1004.a:0 "Devo enfrentar essa injustiça!"
 fabricate_hook_outcome.1004.desc:0 "Iniciei uma série de rumores maldosos contra [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName]. Nenhum deles é verdadeiro, e alguém deveria denunciá-los como as mentiras óbvias que são.\n\nQue melhor maneira para #EMP alguém#! ter [target.GetFirstNameNoTooltip] em dívida?"
 fabricate_hook_outcome.1004.t:0 "$fabricate_hook_header$ Palavras Difamadoras"
 fabricate_hook_outcome.1005.a.flavor:0 "\"Minha vítima querida...\""
 fabricate_hook_outcome.1005.a:0 "Escrevente! Temos cartas para compor!"
 fabricate_hook_outcome.1005.desc:0 "A solução mais simples muitas vezes é a melhor. Por que se preocupar com toda essa intriga e manipulação quando posso simplesmente forçar [target.GetTitledFirstName] a fazer o que eu quero?\n\nAlguns homens fortes e cartas com palavras sombrias devem resolver tudo, realmente."
 fabricate_hook_outcome.1005.t:0 "$fabricate_hook_header$ Bárbaro mas Eficaz"
 fabricate_hook_outcome.2001.a:0 "Eu pensei que isso estaria abaixo de você, [owner.GetFirstNameNoTooltip]."
 fabricate_hook_outcome.2001.desc:0 "Por meios escusos, [owner.GetTitledFirstName] fabricou uma situação para ganhar vantagem sobre mim!\n\nEu denuncio tudo por mentiras e enganos, mas tenho pouca escolha a não ser seguir adiante com isso."
 fabricate_hook_outcome.2001.t:0 "$fabricate_hook_header$ Um Estratagema Enganoso"
 fabricate_hook_outcome.3001.a:0 "Isso marca o fim dos meus esforços..."
 fabricate_hook_outcome.3001.desc:0 "[target.GetTitledFirstName] descobriu que estou tentando obter vantagem sobre [target.GetSheHe] de forma desonesta!\n\nDevo fazer o que puder para preservar minha reputação!"
 fabricate_hook_outcome.3001.t:0 "$fabricate_hook_header$ Perdendo a Vantagem"
