l_spanish:
 GUANXI_GLOSS:0 "Guānxi é uma teia de laços pessoais, pessoas que confiam umas nas outras e trocam favores. Constrói-se cara a cara, entre chá, jantares, ou quando ajuda é oferecida, e muitas vezes importa mais que as regras formais."
 artifact_elder_text_description:0 "Uma coleção de reflexões cuidadosas e notas elaboradas deixadas [Select_CString( elder.IsFemale, 'pela', 'pelo' )] [elder.GetTitledFirstName], destinadas a ajudar [Select_CString( owner.IsFemale, 'sua discípula', 'seu discípulo' )], [owner.GetFirstName]."
 artifact_elder_text_name:0 "Reflexões [Select_CString( elder.IsFemale, 'da', 'do' )] [elder.GetFirstNameNoTooltip]"
 bai_juyi:0 "Bai Juyi"
 because_of_your_diplomacy:0 "Devido à sua [diplomacy_i][diplomacy|E]:"
 because_of_your_learning:0 "Devido ao seu [learning_i][learning|E]:"
 because_of_your_stewardship:0 "Devido à sua [stewardship_i][stewardship|E]:"
 confucian_xp_high_tt:0 "Você avança significativamente em seus estudos confucionistas"
 confucian_xp_low_tt:0 "Você avança um pouco em seus estudos confucionistas"
 dishonor_opinion:0 "Desonra"
 du_fu:0 "Du Fu"
 friend_praised_privately:0 "[CHARACTER.GetShortUIName|U] elogiou [TARGET_CHARACTER.GetShortUIName]."
 friend_praised_privately_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] elogiou [CHARACTER.GetShortUIName]."
 honorable_opinion:0 "Honrado"
 li_bai:0 "Li Bai"
 liu_zongyuan:0 "Liu Zongyuan"
 lover_helped_study:0 "[CHARACTER.GetShortUIName|U] apaixonou-se por [TARGET_CHARACTER.GetShortUIName] durante uma sessão de estudos."
 lover_helped_study_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] apaixonou-se por [CHARACTER.GetShortUIName] durante uma sessão de estudos."
 meng_haoran:0 "Meng Haoran"
 merit_gain_high_tt:0 "Ganho Significativo de Mérito"
 merit_gain_low_tt:0 "Ganho Leve de Mérito"
 never_study_again_tt:0 "Você nunca mais poderá realizar [GetScheme('study_confucian_classics').GetTypeName]"
 no_change_study_tt:0 "Seu [scheme|E] [GetScheme('study_confucian_classics').GetTypeName] progride sem modificações"
 preparatory.imperial_examination.advantage.tt:0 "Você ganha uma [exam_advantage|E] para o próximo [GetActivityType('activity_imperial_examination').GetName]"
 relation_servant_of_china_female:0 "companheira serva de [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier]"
 relation_servant_of_china_male:0 "companheiro servo de [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier]"
 satisfied_opinion:0 "Satisfeito"
 study_confucian_classics_outcome.10.a:0 "Não descansarei na busca pelo conhecimento!"
 study_confucian_classics_outcome.10.b:0 "Tratarei meus estudos com dignidade."
 study_confucian_classics_outcome.10.c:0 "Vai levar o tempo que levar."
 study_confucian_classics_outcome.10.desc:0 "Diante de mim estão os #EMP Analectos de [Glossary( 'Kǒngzǐ', 'CONFUCIUS_GLOSS' )]#!, o #EMP Clássico da Poesia#!, o #EMP Livro da História#!, o #EMP Livro dos Ritos#!, o #EMP I Ching#! e os #EMP Anais de Primavera e Outono#!. Preparei os [Glossary( 'Quatro Tesouros', 'FOUR_TREASURES')] — e #EMP muito#! chá...\n\nPara provar meu mérito e erudição, preciso estudar. Mas até onde estou dispost[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a ir?"
 study_confucian_classics_outcome.10.t:0 "$study_confucian_classics_title$Escolhendo uma Abordagem"
 study_confucian_classics_outcome.100.a:0 "Eu preciso passar no exame, custe o que custar."
 study_confucian_classics_outcome.100.b:0 "Sabedoria leva tempo."
 study_confucian_classics_outcome.100.c:0 "Prefiro ir dormir..."
 study_confucian_classics_outcome.100.desc:0 "Da próxima vez que o [GetActivityType('activity_imperial_examination').GetName] for realizado, estarei preparad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. A noite cai enquanto coloco diante de mim os Anais de [ROOT.Char.Custom('GetRandomAnnalsPassage')], suas páginas iluminadas por uma luz tênue.\n\nSe eu resistir pela noite adentro e memorizar os trechos mais vitais, certamente terei uma vantagem... mas será que realmente aprenderei? Talvez eu devesse dedicar tempo para realmente #EMP compreendê-los#!?"
 study_confucian_classics_outcome.100.t:0 "$study_confucian_classics_title$A Noite Inteira"
 study_confucian_classics_outcome.1000.a:0 "Não devo falhar com [Select_CString( parent.IsFemale, 'minha', 'meu' )] [parent.GetMotherFather]."
 study_confucian_classics_outcome.1000.b:0 "Nunca serei alguém de valor."
 study_confucian_classics_outcome.1000.c:0 "Perdoe-me, preciso de uma pausa."
 study_confucian_classics_outcome.1000.desc:0 "\"Por que você não estuda mais? Você traz vergonha à casa [ROOT.Char.GetHouse.GetName]!\" [Select_CString( parent.IsFemale, 'Minha', 'Meu' )] [parent.GetMotherFather] ergue as mãos em frustração. \"Suas desculpas pesam menos que a poeira sobre sua mesa.\"\n\n\"Se você não estudar, acabará trabalhando no armazém em desonra.\""
 study_confucian_classics_outcome.1000.t:0 "$study_confucian_classics_title$Paternidade/Maternidade Rigorosa"
 study_confucian_classics_outcome.1010.a:0 "Com a ajuda [elder.GetHerHim], estudarei como nunca!"
 study_confucian_classics_outcome.1010.b:0 "O pergaminho será de grande ajuda."
 study_confucian_classics_outcome.1010.desc:0 "Meus estudos não têm ido bem... os Anais de [ROOT.Char.Custom('GetRandomAnnalsPassage')] permanecem pela metade, clamando por minha atenção, mas minha mente deseja apenas outra xícara de chá. Ao servir-me, percebo um pergaminho [Select_CString( elder.IsFemale, 'da minha anciã', 'do meu ancião' )], [elder.GetTitledFirstName].\n\nEle diz: \"Car[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] discípul[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], ouvi dizer que seus estudos vacilam. Envio anexas minhas reflexões sobre os Analectos e algumas notas que podem ajudar.\"\n\nMeu desejo de aprender reacende!"
 study_confucian_classics_outcome.1010.t:0 "$study_confucian_classics_title$A Orientação do Ancião"
 study_confucian_classics_outcome.1020.a:0 "Sem mais desculpas. Eu vou continuar!"
 study_confucian_classics_outcome.1020.b:0 "Um pouco de [ROOT.Char.Custom('RegionalAlcoholicDrink')] vai me ajudar..."
 study_confucian_classics_outcome.1020.c:0 "Respire, e comece novamente."
 study_confucian_classics_outcome.1020.desc:0 "Nada está funcionando. Eu não consigo realizar nada. Meu escritório está desolado, livros não lidos empilhados como acusações contra um bandido, e pergaminhos espalhados pelo chão como folhas de uma árvore morta.\n\nMas eu #EMP sei#! que consigo.\n\nEu. Só. Preciso. Me. Concentrar."
 study_confucian_classics_outcome.1020.t:0 "$study_confucian_classics_title$Redobrar os Esforços"
 study_confucian_classics_outcome.1030.a:0 "Posso fazer uma oferenda simbólica."
 study_confucian_classics_outcome.1030.b:0 "Minhas mãos estão à sua disposição."
 study_confucian_classics_outcome.1030.c:0 "Confio apenas em [ROOT.Char.GetFaith.KnowledgeGodName]."
 study_confucian_classics_outcome.1030.desc:0 "Meus estudos não têm ido bem. Talvez o que eu precise não seja outro pergaminho... mas orientação de [ROOT.Char.GetFaith.KnowledgeGodName]. Entro no santuário local, ajoelho diante do altar e uno minhas mãos em prece.\n\n\"Buscas clareza, [Select_CString( owner.IsFemale, 'minha', 'meu' )] [priest.Custom2('RelationToMeShort', owner)]?\" [Select_CString( priest.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', priest)], [priest.GetFirstName], murmura, surgindo entre as sombras. \"Se fizer uma pequena oferenda, ou ajudar com os afazeres do santuário, posso auxiliá-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )].\""
 study_confucian_classics_outcome.1030.t:0 "$study_confucian_classics_title$Assistência Divina"
 study_confucian_classics_outcome.1040.a:0 "Por favor, traga tinta e folhas em branco."
 study_confucian_classics_outcome.1040.b:0 "Seu apoio significa tudo para mim."
 study_confucian_classics_outcome.1040.c:0 "Tudo que eu preciso neste momento é de você."
 study_confucian_classics_outcome.1040.desc:0 "É difícil demais, não consigo compreender o #EMP [ROOT.Char.Custom('GetRandomRitesPassage')]#!. Todas as minhas anotações estão erradas! Inúteis!\n\n\"[partner.Custom('LoverPetName')|U], seus estudos estão te afligindo?\" [Select_CString( partner.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', partner)], [partner.GetFirstName], pergunta docemente, trazendo uma bandeja com bolinhos de chá. \"Por que não me deixa estudar com você? Não há nada que não possamos enfrentar juntos! Ah, e coma um dos bolinhos, fiz para você.\""
 study_confucian_classics_outcome.1040.t:0 "$study_confucian_classics_title$Um Parceiro Solidário"
 study_confucian_classics_outcome.110.a:0 "Preciso aprender, custe o que custar."
 study_confucian_classics_outcome.110.b:0 "Vou dedicar o tempo necessário."
 study_confucian_classics_outcome.110.desc:0 "Os Anais de [ROOT.Char.Custom('GetRandomAnnalsPassage')], o [ROOT.Char.Custom('GetRandomPoetryPassage')], o [ROOT.Char.Custom('GetRandomRitesPassage')] — um por um, percorro os grandes clássicos confucionistas, colhendo sabedoria atemporal de suas páginas.\n\nSe desejo servir como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] governante just[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], devo trilhar o caminho estabelecido por [Glossary( 'Kǒngzǐ', 'CONFUCIUS_GLOSS' )]. São estas as palavras que devo gravar na memória."
 study_confucian_classics_outcome.110.t:0 "$study_confucian_classics_title$Clássicos Confucionistas"
 study_confucian_classics_outcome.120.a:0 "Vasculharei os textos em busca de verdades ocultas."
 study_confucian_classics_outcome.120.b:0 "Três xícaras de chá, sem dormir até virar a última página."
 study_confucian_classics_outcome.120.c:0 "A sabedoria vem para [ROOT.Char.GetSheHe] que tem paciência."
 study_confucian_classics_outcome.120.desc:0 "Antes de governar a terra, devo governar minha própria mesa. Os Anais de [ROOT.Char.Custom('GetRandomAnnalsPassage')] estão abertos diante de mim — uma obra sábia, fundamento de um governo virtuoso. Através de suas palavras, aprofundarei meu conhecimento e seguirei os passos de [Glossary( 'Kǒngzǐ', 'CONFUCIUS_GLOSS' )].\n\nSomente com disciplina prevalecerei."
 study_confucian_classics_outcome.120.t:0 "$study_confucian_classics_title$Lendo os Anais"
 study_confucian_classics_outcome.130.a:0 "Por favor, ajude-me a compreendê-los."
 study_confucian_classics_outcome.130.b:0 "Talvez devêssemos sair para beber algo."
 study_confucian_classics_outcome.130.desc:0 "Por que não consigo compreender os textos? Por que não capto seu significado sutil? Sou realmente #EMP tão#! inept[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]? Largo o pincel e apoio suavemente a testa contra a mesa.\n\n\"Trouxe-lhe chá\", diz [Select_CString( servant.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', servant)], [servant.GetFirstName], enquanto [servant.GetSheHe] entra no estudo. \"Esse é o #EMP [ROOT.Char.Custom('GetRandomRitesPassage')]?#! Tenho boas lembranças dele... Posso ler com você por um tempo?\"\n\nLevanto o olhar. Talvez uma mão amiga seja exatamente o que preciso."
 study_confucian_classics_outcome.130.t:0 "$study_confucian_classics_title$Perspectiva sobre o Aprendizado"
 study_confucian_classics_outcome.140.a:0 "Devo aprender com [diplomatic_vassal.GetSheHe]."
 study_confucian_classics_outcome.140.b:0 "Não, encontrarei mérito de outras formas."
 study_confucian_classics_outcome.140.desc:0 "Fecho os Analectos com um suspiro. [Glossary( 'Mestre Kong', 'CONFUCIUS_GLOSS' )] fala de harmonia — de expressar virtude através da retidão, não da adulação. E ainda assim [Select_CString( diplomatic_vassal.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', diplomatic_vassal)], [diplomatic_vassal.GetTitledFirstName], conquista paz com um brinde e um sorriso.\n\nFico a pensar... isso também seria o Caminho?"
 study_confucian_classics_outcome.140.t:0 "$study_confucian_classics_title$A Arte da Diplomacia"
 study_confucian_classics_outcome.150.a:0 "Muito perspicaz."
 study_confucian_classics_outcome.150.b:0 "Ah, sim, um passeio clareará minha mente."
 study_confucian_classics_outcome.150.desc:0 "\"Caminhe comigo\", diz [Select_CString( servant.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', servant)], [servant.GetFirstName], chamando-me para fora. \"Vamos observar os(as) [location_province.Custom('GetTerrainTypePlural')] de [location_province.GetName].\"\n\n\"Repare nos montes e elevações, nas encostas e gargantas, nas planícies e nos pântanos — cada um determina o melhor uso da terra. Assim ensina o #EMP Livro dos Ritos.#!\""
 study_confucian_classics_outcome.150.t:0 "$study_confucian_classics_title$Conhecer a Terra"
 study_confucian_classics_outcome.160.a:0 "Se eu servir bem [Select_CString( higher_merit_vassal.IsFemale, 'a', 'ao' )] [higher_merit_vassal.GetFirstNameNoTooltip], meu mérito será reconhecido."
 study_confucian_classics_outcome.160.b:0 "Uma inspeção adequada fala mais alto que qualquer vanglória."
 study_confucian_classics_outcome.160.c:0 "Ajudarei os magistrados."
 study_confucian_classics_outcome.160.desc:0 "Aprofundei-me no [ROOT.Char.Custom('GetRandomPoetryPassage')], no [ROOT.Char.Custom('GetRandomRitesPassage')] e nos Anais de [ROOT.Char.Custom('GetRandomAnnalsPassage')] — minha mente se aguçou, minhas habilidades se refinaram, e sinto-me pront[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] para provar meu mérito.\n\nTalvez eu devesse auxiliar os magistrados locais revisando antigos casos, inspecionar o estado das pontes locais,"
 study_confucian_classics_outcome.160.desc_other_elder:0 "ou redigir um relatório formal para [higher_merit_vassal.GetTitledFirstName], [Select_CString( higher_merit_vassal.IsFemale, 'uma renomada anciã', 'um renomado ancião' )] de grande prestígio."
 study_confucian_classics_outcome.160.desc_own_elder:0 "ou redigir um relatório formal para [Select_CString( higher_merit_vassal.IsFemale, 'minha anciã', 'meu ancião' )], [higher_merit_vassal.GetTitledFirstName]."
 study_confucian_classics_outcome.160.t:0 "$study_confucian_classics_title$Trabalho Meritório"
 study_confucian_classics_outcome.170.a:0 "Redigirei uma carta de gratidão."
 study_confucian_classics_outcome.170.b:0 "Talvez [elder.GetSheHe] possa ser persuadid[Select_CString( elder.IsFemale, 'a', 'o' )] a mover mais alguns fios?"
 study_confucian_classics_outcome.170.c:0 "Estou tão feliz que poderia lhe servir dez xícaras de chá!"
 study_confucian_classics_outcome.170.desc:0 "\"Um pergaminho com o selo [Select_CString( elder.IsFemale, 'da sua anciã', 'do seu ancião' )], [elder.GetTitledFirstName], acaba de chegar\", diz [Select_CString( letterman.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', letterman)], [letterman.GetFirstName], entregando-o. \"Acredito que sejam boas notícias!\"\n\nAbro o pergaminho com cuidado.\n\n\"Para [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] mais [ROOT.Char.Custom('ComplimentAdjective')] discípul[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] — seu traço firme, coração íntegro e mente perseverante não passaram despercebidos. Sua conduta chegou aos ouvidos de escrivães e magistrados. Seu mérito é reconhecido.\""
 study_confucian_classics_outcome.170.t:0 "$study_confucian_classics_title$Influência do Ancião"
 study_confucian_classics_outcome.180.a:0 "Agora, o que devo ler em seguida..."
 study_confucian_classics_outcome.180.desc:0 "Consegui. Terminei todo o #EMP Livro dos Ritos#! — e ainda me recordo de sua sabedoria! É como se um véu tivesse sido retirado de meus olhos. Pela primeira vez, vejo o caminho adiante com clareza.\n\nE pensar que... ninguém acreditava em mim. Nem mesmo eu.\n\nTalvez eu esteja destinad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a mais, afinal."
 study_confucian_classics_outcome.180.t:0 "$study_confucian_classics_title$Desobstruído"
 study_confucian_classics_outcome.190.a:0 "Farei com que os magistrados ouçam meu nome."
 study_confucian_classics_outcome.190.b:0 "Pedirei aos estudiosos que compartilhem suas anotações."
 study_confucian_classics_outcome.190.c:0 "Os melhores versos devem ser ouvidos, estudarei com os melhores."
 study_confucian_classics_outcome.190.d:0 "Meu mérito se sustenta por si só."
 study_confucian_classics_outcome.190.desc:0 "Uma palavra bem colocada, um presente em versos, o favor de um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] mestre dign[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]... oportunidades para [Glossary( 'guānxi', 'GUANXI_GLOSS' )]. Até mesmo um assento em uma tranquila reunião poética pode moldar um caminho.\n\nTrabalho diligentemente, mas os sábios ensinaram que a virtude precisa brilhar para ser reconhecida."
 study_confucian_classics_outcome.190.t:0 "$study_confucian_classics_title$Aproveitando Influências"
 study_confucian_classics_outcome.200.a:0 "\"A [ROOT.Char.Custom('GeneratePoem_Title_Fragment_Season')] de virtude [ROOT.Char.Custom('FormalComplimentAdjective')] chama por...\""
 study_confucian_classics_outcome.200.b:0 "Esperarei a inspiração surgir!"
 study_confucian_classics_outcome.200.c:0 "[poet.GetFirstNameNoTooltip] merece uma carta de admiração."
 study_confucian_classics_outcome.200.d:0 "Devo reler o [ROOT.Char.Custom('GetRandomPoetryPassage')]."
 study_confucian_classics_outcome.200.desc:0 "A beleza e caligrafia do [ROOT.Char.Custom('GetRandomPoetryPassage')], que coisa mais #EMP deslumbrante#!! E as obras [Select_CString( poet.IsFemale, 'da', 'do' )] [poet.GetTitledFirstName] — admiráveis, duradouras, poesia digna das eras. Passando de texto em texto, não consigo parar de ler.\n\nTalvez eu também devesse molhar meu pincel... e acrescentar ao grande acervo [Select_CString( ROOT.Char.GetTopLiege.IsFemale, 'da', 'do' )] [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier]?"
 study_confucian_classics_outcome.200.t:0 "$study_confucian_classics_title$Chamado Poético"
 study_confucian_classics_outcome.300.a:0 "Com esforço, também serei grandios[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] um dia!"
 study_confucian_classics_outcome.300.b:0 "Um poema simples, para capturar o momento."
 study_confucian_classics_outcome.300.c:0 "A sabedoria dele já é tinta suficiente para mim."
 study_confucian_classics_outcome.300.desc:0 "Ao contemplar o jardim [location_province.Custom('ProvinceCompliment')] de [ROOT.Char.Custom('GetSeason')], reflito sobre os versos do grande poeta [ROOT.Char.Custom('GetRandomAncientChinesePoet')]. Uma brisa agita a manga da minha túnica, guiando minha mão até o pincel — como se o próprio Céu me convidasse a escrever.\n\nO papel jaz diante de mim, quieto e expectante, aguardando receber minhas palavras."
 study_confucian_classics_outcome.300.t:0 "$study_confucian_classics_title$Inspiração de [ROOT.Char.Custom('GetSeason')|U]"
