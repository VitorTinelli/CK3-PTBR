l_spanish:
 elope.0001.a.failure_discover:0 "Eu #N fracasso e sou descoberto#!"
 elope.0001.a.failure_hidden:0 "Eu #N fracasso#! mas não sou descoberto"
 elope.0001.a.success:0 "Eu tenho #P sucesso#!"
 elope.0001.a.tt:0 "Tento fugir com [target.GetShortUIName]"
 elope.0001.a:0 "Estou indo atrás de você, [target.GetFirstNameNoTooltip]!"
 elope.0001.b:0 "O que estou fazendo? Isso é loucura!"
 elope.0001.negative.desc:0 "Eu repasso a lista mentalmente. A rota de fuga foi traçada, os guardas deveriam ter recebido seus subornos e espero que a nota que enviei para [target.GetTitledFirstName] tenha chegado a [target.GetSheHe] a tempo. Mas e se não tiver? Talvez [target.GetSheHe] nem sequer tenha recebido! E há tantas outras coisas que podem ter dado errado...\n\nNão há tempo para dúvidas. Esta é minha única chance. Devo ir atrás [target.GetHerHim], aconteça o que acontecer, ou abandonar a empreitada."
 elope.0001.positive.desc:0 "Os preparativos finais estão prontos. A rota de fuga foi traçada, os guardas subornados e [target.GetTitledFirstName] está pronta. Esta noite, quando a escuridão cair sobre [location.GetNameNoTooltip], libertarei minha [target.Custom('LoverPetName')] e a tornarei [Select_CString( target.IsFemale, 'minha', 'meu' )] [target.GetWifeHusband]."
 elope.0001.t:0 "$elope_event_title$ Protegido pelas Sombras"
 elope.1001.a:0 "Rápido, meu amor! O [ROOT.Char.Custom('DefaultPriestTitle')] está esperando!"
 elope.1001.end.desc:0 "A luz se aproxima e podemos distinguir duas silhuetas. Uma delas carrega uma espada, isso está claro. A outra... deve ser #EMP [target.GetSheHe]#!!\n\nCorro para encontrar minha [target.Custom('LoverPetName')], e [target.GetSheHe] se joga em meus braços abertos. O abraço é rápido, mas doce como mel. Segurando a mão [target.GetHerHim], começo a correr."
 elope.1001.start.desc:0 "Enquanto esperamos, não consigo deixar de imaginar tudo o que pode dar errado. Sinto-me completamente impotente - um sentimento que #EMP não#! desejo conhecer melhor.\n\nAvisto uma tocha à frente, movendo-se em nossa direção, e faço um gesto para meus guardas se esconderem."
 elope.1001.start.desc_brave:0 "Enquanto esperamos, não consigo deixar de me perguntar onde está [target.GetFirstName] agora. Será que [target.GetSheHe] conseguiu sair bem? Haverá perseguidores?\n\nAvisto uma tocha à frente, movendo-se em nossa direção, e faço um gesto para meus guardas se esconderem."
 elope.1001.t:0 "$elope_event_title$ O Amor Permanece"
 elope.1002.a.compassionate:0 "Espero que [target.GetSheHe] seja feliz, aconteça o que acontecer."
 elope.1002.a.fallback:0 "Como [target.GetSheHe] pôde?"
 elope.1002.a.vengeful:0 "Ess[Select_CString( target.IsFemale, 'a', 'e' )] [target.Custom2('InsultNounSexual', ROOT.Char)] traiçoeir[Select_CString( target.IsFemale, 'a', 'o' )] receberá o que merece!"
 elope.1002.apologetic_family.desc:0 "\"[ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('target'))|U], deixei você para me casar com o amor da minha vida - [owner.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)]. Tudo o que quero é ser feliz. Espero que encontre no coração o perdão."
 elope.1002.apologetic_relationship.desc:0 "\"[Select_CString( target.IsFemale, 'Minha querida', 'Meu querido' )] [target.GetFirstNameNoTooltip], sinto muito, mas preciso seguir meu coração. Deixei você para me casar com o amor da minha vida - [owner.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)].\""
 elope.1002.desc:0 "\n\nA busca continua por horas. Só ao meio-dia encontram uma carta assinada por [target.GetTitledFirstName]. A caligrafia [target.GetHerHim] é inconfundível.\n\n"
 elope.1002.desc_naked:0 "Saio da cama, dando ordens antes mesmo de chegar à porta."
 elope.1002.desc_not_naked:0 "Saio da cama, dando ordens enquanto me visto."
 elope.1002.start.desc:0 "Sou acordado com uma forte batida na porta. \"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip]! Um guarda foi encontrado morto e [Select_CString( target.IsFemale, 'a', 'o' )] [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('target'))] está desaparecid[Select_CString( target.IsFemale, 'a', 'o' )]!\""
 elope.1002.t:0 "Desaparecido na Noite"
 elope.1002.unapologetic_family.desc:0 "\"Se você realmente amasse [Select_CString( target.IsFemale, 'sua própria', 'seu próprio' )] [ROOT.Char.Custom2('RelationToMeShort' , target)], teria querido minha felicidade. Mas como você se importa tão pouco comigo, deixei você para seguir meu coração. Vou me casar com [owner.Custom2('YourCharacterIntroduction', ROOT.Char)] e não há nada que você possa fazer para me impedir!\""
 elope.1002.unapologetic_relationship.desc:0 "\"Eu deixei você para me casar com [owner.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)]. Não venha atrás de mim - eu preferiria morrer a ser sua novamente!\""
 elope.1003.a:0 "Que catástrofe!"
 elope.1003.end.desc:0 "Sejamos francos: isso é uma grande ofensa e uma mancha na honra de sua família. Se o #EMP feliz casal#! procurar refúgio em [capital.GetNameNoTooltip], confio em que você lhes dará uma lição!"
 elope.1003.middle.desc:0 "fugiu com"
 elope.1003.opening:0 "[target_keeper.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 elope.1003.owner_root_family.desc:0 "s[Select_CString( owner.IsFemale, 'ua', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('owner'))] [owner.GetFirstName]!"
 elope.1003.start.desc:0 "Escrevo para informar que"
 elope.1003.target_keeper_relation.desc:0 "m[Select_CString( target.IsFemale, 'inha', 'eu' )] [target_keeper.Custom2('RelationToMeShort' , SCOPE.sC('target'))] [target.GetFirstName]"
 elope.1003.target_liege_subject.desc:0 "[Select_CString( target.IsFemale, 'minha súdita', 'meu súdito' )] [target.GetFirstName]"
 elope.1003.target_root_family.desc:0 "s[Select_CString( target.IsFemale, 'ua', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('target'))] [target.GetFirstName]"
 elope.1003.your_character_introduction.desc:0 "[owner.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)]!"
 elope.1011.a:0 "#EMP Corram!#!"
 elope.1011.end.desc:0 "Por minha ordem, recuamos pela vegetação. Nossos perseguidores, por outro lado, não têm consideração pela sutileza e se aproximam rapidamente.\n\n\"Você não pode se esconder para sempre, [ROOT.Char.GetTitledFirstNameNoTooltip]! Capturamos um [Select_CString( dummy_soldier.IsFemale, 'das suas', 'dos seus' )] [dummy_soldier.GetWomenMen] e você será o próximo!\""
 elope.1011.middle.desc:0 "Vejo duas silhuetas, três, quatro... [ROOT.Char.GetFaith.HighGodName], isso não pode ser bom!"
 elope.1011.t:0 "$elope_event_title$ Tochas na Escuridão"
 elope.1012.a:0 "Aquel[Select_CString( owner.IsFemale, 'a', 'e' )] [owner.Custom2('InsultNounSexual', ROOT.Char)] [owner.Custom2('InsultAdjective', ROOT.Char)] nunca terá m[Select_CString( target.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('target'))]!"
 elope.1012.b:0 "Traidor! Prendam [target.GetFirstNameNoTooltip], #EMP agora!#!"
 elope.1012.c:0 "Eu os farei sofrer, marquem minhas palavras!"
 elope.1012.d:0 "Isso está me dando dor de cabeça..."
 elope.1012.desc:0 "Uma tentativa de fuga com [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] foi frustrada! O capitão da guarda me disse que [owner.Custom2('YourCharacterIntroduction', ROOT.Char)] estava tramando levar [target.GetSheHe] embora e casar-se em segredo.\n\nE como se isso não bastasse, cartas encontradas nos aposentos de [target.GetFirstNamePossessiveNoTooltip] indicam que [target.GetSheHe] estava envolvida em toda a trama!"
 elope.1012.t:0 "Uma Fuga Malsucedida"
 elope.1021.a:0 "[target.GetFirstNameNoTooltip], meu amor... Rezo para que você esteja bem."
 elope.1021.end.desc:0 "\n\nPor minha ordem, recuamos pela vegetação. Por pura sorte, conseguimos chegar de volta à carruagem e escapar durante a noite."
 elope.2000.a:0 "Vamos acelerar os planos, meu [target.Custom('LoverPetName')]."
 elope.2000.b:0 "Então você não deveria enviar cartas!"
 elope.2000.c.failure:0 "[target.GetShortUIName|U] sente-se desconsiderad[Select_CString( target.IsFemale, 'a', 'o' )]"
 elope.2000.c.success:0 "[target.GetShortUIName|U] está convencid[Select_CString( target.IsFemale, 'a', 'o' )]"
 elope.2000.c:0 "Confie em mim - tudo está sob controle."
 elope.2000.end.desc:0 "\n\nEstamos ficando sem tempo. Por favor, [Select_CString( ROOT.Char.IsFemale, 'minha querida', 'meu querido' )] [ROOT.Char.GetFirstNameNoTooltip], tenha pressa!"
 elope.2000.start.desc:0 "Você me disse para ser corajos[Select_CString( target.IsFemale, 'a', 'o' )], mas não consigo conter meus medos por mais tempo. E se"
 elope.2000.t:0 "Meu amor,"
 elope.2000.target_relation.desc:0 "[Select_CString( discoverer.IsFemale, 'a', 'o' )] [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('discoverer'))] descobrir nossos planos? Mal consigo dormir e tenho dificuldade para me alimentar. [discoverer.GetSheHe|U] está começando a se preocupar - talvez até suspeitar!"
 elope.2000.titledname.desc:0 "descobrir nossos planos? Sempre que [discoverer.GetSheHe] aparece, fico rígid[Select_CString( target.IsFemale, 'a', 'o' )] e sem palavras. É apenas questão de tempo até que [discoverer.GetSheHe] perceba!"
 elope_event_title:0 "Elopement:"
