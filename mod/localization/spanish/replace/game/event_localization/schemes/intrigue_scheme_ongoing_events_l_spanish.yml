l_spanish:
 intrigue_scheme_ongoing.1001.a:0 "O que são algumas moedas de ouro, afinal?"
 intrigue_scheme_ongoing.1001.b:0 "É muito arriscado!"
 intrigue_scheme_ongoing.1001.desc:0 "Parece que nem todo servo na corte de [scheme.GetTargetCharacter.GetTitledFirstNamePossessive] é cegamente leal... [agent.GetFirstName] me garante que [agent.GetSheHe] tem uma entrada, e que algumas moedas no bolso certo podem fazer uma grande diferença."
 intrigue_scheme_ongoing.1001.elope.desc:0 "Parece que nem todo servo na corte de [scheme.GetTargetCharacter.GetTitledFirstNamePossessive] é cegamente leal [Select_CString( scheme.GetTargetCharacter.GetLiege.IsFemale, 'a', 'ao' )] [scheme.GetTargetCharacter.GetLiege.GetTitledFirstName]... [agent.GetFirstName] me garante que [agent.GetSheHe] tem uma entrada, e que algumas moedas no bolso certo podem fazer uma grande diferença."
 intrigue_scheme_ongoing.1001.t:0 "Um Suborno Bem Planejado"
 intrigue_scheme_ongoing.1002.a.failure:0 "[agent_in_question.GetFirstNameNoTooltip] se expõe em seu fervor"
 intrigue_scheme_ongoing.1002.a.success:0 "[agent_in_question.GetSheHe|U] recruta os fiéis locais para a nossa causa"
 intrigue_scheme_ongoing.1002.a:0 "Um pouco otimista talvez, mas gosto do espírito!"
 intrigue_scheme_ongoing.1002.b:0 "[agent_in_question.GetTitledFirstNameNoTooltip] vai calar a boca, ou juro por [agent_in_question.GetFaith.HighGodName]."
 intrigue_scheme_ongoing.1002.c:0 "Vou ajudar [agent_in_question.GetSheHe] em sua nobre abordagem!"
 intrigue_scheme_ongoing.1002.desc:0 "M[Select_CString( agent_in_question.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent_in_question'))], [agent_in_question.GetTitledFirstName], condenou [scheme.GetTargetCharacter.GetTitledFirstName] por suas ofensas contra [agent_in_question.GetFaith.HighGodName].\n\n[agent_in_question.GetSheHe|U] chegou a clamar para que [agent_in_question.GetFaith.HighGodNameAlternate] castigasse [scheme.GetTargetCharacter.GetFirstName] e insinuou punições vindouras."
 intrigue_scheme_ongoing.1002.t:0 "Justiça Divina"
 intrigue_scheme_ongoing.1004.a.failure:0 "[agent_in_question.GetFirstNameNoTooltip] é descobert[Select_CString( agent_in_question.IsFemale, 'a', 'o' )]"
 intrigue_scheme_ongoing.1004.a.success:0 "[agent_in_question.GetFirstNameNoTooltip] permanece não detectad[Select_CString( agent_in_question.IsFemale, 'a', 'o' )]"
 intrigue_scheme_ongoing.1004.a:0 "As coisas que [agent_in_question.GetSheHe] aprende são muito valiosas para silenciá-l[Select_CString( agent_in_question.IsFemale, 'a', 'o' )]."
 intrigue_scheme_ongoing.1004.b:0 "Se [agent_in_question.GetSheHe] não consegue guardar segredos, então [agent_in_question.GetSheHe] deve ficar em silêncio!"
 intrigue_scheme_ongoing.1004.desc:0 "Embora a habilidade de [agent_in_question.GetFirstNamePossessive] de fazer amigos tenha se mostrado valiosa em meu esquema, [agent_in_question.GetSheHe|U] não é tão cuidadoso em torno dos outros como deveria.\n\n[agent_in_question.GetSheHe|U] gosta muito de soltar dicas vagas, e se alguém começar a fazer perguntas, não há como saber o que [agent_in_question.GetSheHe] revelaria."
 intrigue_scheme_ongoing.1004.t:0 "Excessivamente Falador"
 intrigue_scheme_ongoing.1004.toast.failure:0 "[agent_in_question.GetFirstNameNoTooltip] é descobert[Select_CString( agent_in_question.IsFemale, 'a', 'o' )]"
 intrigue_scheme_ongoing.1004.toast.success:0 "[agent_in_question.GetFirstNameNoTooltip] permanece não detectad[Select_CString( agent_in_question.IsFemale, 'a', 'o' )]"
 intrigue_scheme_ongoing.1006.a.failure:0 "[agent_in_question.GetFirstNameNoTooltip] é descobert[Select_CString( agent_in_question.IsFemale, 'a', 'o' )]"
 intrigue_scheme_ongoing.1006.a.success:0 "[agent_in_question.GetFirstNameNoTooltip] permanece não detectad[Select_CString( agent_in_question.IsFemale, 'a', 'o' )]"
 intrigue_scheme_ongoing.1006.a:0 "Vestígios de alguém se esgueirando certamente irão estressar [scheme.GetTargetCharacter.GetFirstNameNoTooltip]!"
 intrigue_scheme_ongoing.1006.b:0 "[agent_in_question.GetSheHe|U] precisa tirar um tempo para fazer melhor."
 intrigue_scheme_ongoing.1006.desc:0 "É claro que [Select_CString( agent_in_question.IsFemale, 'a', 'o' )] [agent_in_question.Custom2('InsultAdjective', ROOT.Char)] [agent_in_question.GetTitledFirstName] causaria problemas.\n\n[agent_in_question.GetSheHe|U] não toma as devidas precauções ao se movimentar pela corte de [scheme.GetTargetCharacter.GetTitledFirstNamePossessive], e [Select_CString( scheme.GetTargetCharacter.IsFemale, 'a', 'o' )] [scheme.GetTargetCharacter.GetTitleAsNameNoTooltip] está começando a perceber. É apenas uma questão de tempo até que [agent_in_question.GetSheHe] seja descobert[Select_CString( agent_in_question.IsFemale, 'a', 'o' )]!"
 intrigue_scheme_ongoing.1006.elope.desc:0 "É claro que [Select_CString( agent_in_question.IsFemale, 'a', 'o' )] [agent_in_question.Custom2('InsultAdjective', ROOT.Char)] [agent_in_question.GetTitledFirstName] causaria problemas.\n\n[agent_in_question.GetSheHe|U] não toma as devidas precauções ao se movimentar pela corte de [scheme.GetTargetCharacter.GetTitledFirstNamePossessive], e [scheme.GetTargetCharacter.GetLiege.Custom2('HerHisCharacterIntroduction', scheme.GetTargetCharacter)] está começando a perceber. É apenas uma questão de tempo até que [agent_in_question.GetFirstNameNoTooltip] seja descobert[Select_CString( agent_in_question.IsFemale, 'a', 'o' )]!"
 intrigue_scheme_ongoing.1006.t:0 "Arrumando as Coisas"
 intrigue_scheme_ongoing.1007.a:0 "Meus planos continuarão, e espero que você trabalhe duro!"
 intrigue_scheme_ongoing.1007.b:0 "Você está cert[Select_CString( others_agent.IsFemale, 'a', 'o' )], isso tem tomado muito do meu tempo. Venha, sente-se comigo."
 intrigue_scheme_ongoing.1007.desc:0 "\"E se [target.GetTitledFirstName] descobrisse você? Será sábio continuar esse esforço que consome tanto tempo?\"\n\n[others_agent.GetTitledFirstName] [others_agent.Custom('QuirkPresentPosOrNeg')], e mesmo sabendo que [others_agent.GetSheHe] seguirá meu conselho nisso, posso perceber que a preocupação [others_agent.GetSheHe] tem por mim é genuína."
 intrigue_scheme_ongoing.1007.t:0 "Preocupação Expressa"
 intrigue_scheme_ongoing.1008.a.failure:0 "[agent.GetFirstNameNoTooltip] é descobert[Select_CString( agent.IsFemale, 'a', 'o' )]"
 intrigue_scheme_ongoing.1008.a.success:0 "[agent.GetFirstNameNoTooltip] permanece não detectad[Select_CString( agent.IsFemale, 'a', 'o' )]"
 intrigue_scheme_ongoing.1008.a:0 "Confio nas habilidades de [agent.GetFirstNamePossessiveNoTooltip]."
 intrigue_scheme_ongoing.1008.b:0 "A trilha [agent.GetHerHim] até mim precisa acabar. Agora."
 intrigue_scheme_ongoing.1008.c:0 "Graças a [ROOT.Char.GetFaith.HighGodNameAlternate] que [councillor.GetTitledFirstNameNoTooltip] está lá e pode intervir."
 intrigue_scheme_ongoing.1008.desc:0 "Parece que [defender.GetTitledFirstName] está apertando a segurança na corte, na esperança de rastrear conspiradores traidores. [Select_CString( agent.IsFemale, 'Minha', 'Meu' )] colega conspirador, [agent.GetTitledFirstName], está preocupad[Select_CString( agent.IsFemale, 'a', 'o' )] que [agent.GetSheHe] possa ter atraído algumas suspeitas indesejadas."
 intrigue_scheme_ongoing.1008.t:0 "Respirando no Pescoço"
 intrigue_scheme_ongoing.1009.a:0 "Por favor, apoie minha causa, [potential_agent.GetFirstNameNoTooltip]."
 intrigue_scheme_ongoing.1009.b:0 "Eu só te pediria por um pequeno favor..."
 intrigue_scheme_ongoing.1009.desc:0 "[potential_agent.GetTitledFirstName] veio até mim, com um olhar determinado em seus olhos.\n\n\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [potential_agent.Custom2('RelationToMe', ROOT.Char)], tenho relutado em me juntar aos seus planos contra m[Select_CString( target.IsFemale, 'inha', 'eu' )] [potential_agent.Custom2('RelationToMe', SCOPE.sC('target'))], [target.GetTitledFirstName], mas sinto que é hora de confiar em seu julgamento nesta questão.\""
 intrigue_scheme_ongoing.1009.elope.desc:0 "[potential_agent.GetTitledFirstName] veio até mim, com um olhar determinado em seus olhos.\n\n\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [potential_agent.Custom2('RelationToMe', ROOT.Char)], tenho relutado em me juntar aos seus planos de fugir com [target.GetTitledFirstName], mas agora vejo que você realmente se importa com [target.GetSheHe].\""
 intrigue_scheme_ongoing.1009.t:0 "Ajuda"
 intrigue_scheme_ongoing.2001.a:0 "[agent_in_question.GetSheHe|U] deve continuar oferecendo bons conselhos, até que..."
 intrigue_scheme_ongoing.2001.b:0 "[agent_in_question.GetSheHe|U] possa garantir que outros agentes possam entrar e sair."
 intrigue_scheme_ongoing.2001.desc:0 "A natureza confiante de [scheme.GetTargetCharacter.GetFirstNamePossessive] tornou mais fácil do que o esperado para [agent_in_question.GetTitledFirstName] conquistar [agent_in_question.GetHerselfHimself] junto ao [scheme.GetTargetCharacter.GetTitleTierName] – enquanto [agent_in_question.GetFirstNameNoTooltip] oferece conselhos, [target.GetSheHe] é mais propenso a ouvir do que não."
 intrigue_scheme_ongoing.2001.t:0 "Confiança Mal Colocada"
 intrigue_scheme_ongoing.2002.a:0 "Vou ajudar [agent_in_question.GetFirstNameNoTooltip] a importar a bebida mais potente!"
 intrigue_scheme_ongoing.2002.b:0 "Faça [target.GetSheHe] se sentir segur[Select_CString( target.IsFemale, 'a', 'o' )] em sua bebedeira."
 intrigue_scheme_ongoing.2002.c:0 "Hah, o tolo não conhece a própria fraqueza!"
 intrigue_scheme_ongoing.2002.desc:0 "[target.GetTitledFirstName] é excessivamente apaixonad[Select_CString( target.IsFemale, 'a', 'o' )] por bebida, o que faz [target.GetSheHe] agir de forma irracional às vezes.\n\nSeria bastante simples para [agent_in_question.GetTitledFirstName] satisfazer [target.GetSheHe], e garantir que esses hábitos sejam mantidos."
 intrigue_scheme_ongoing.2002.t:0 "O Alvo Bêbado"
 intrigue_scheme_ongoing.2003.a:0 "Talvez isso possa ajudar em meus esforços?"
 intrigue_scheme_ongoing.2003.bad_habits:0 "Não era o que [agent.GetTitledFirstName] esperava encontrar ao espionar conversas secretas, mas descobrir a verdade sobre os hábitos incomuns de [other_secret_target.GetTitledFirstName] não faz mal..."
 intrigue_scheme_ongoing.2003.bastardy:0 "Não era o que [agent.GetTitledFirstName] esperava encontrar ao espionar conversas secretas, mas descobrir a verdade sobre a origem de [secret_target.GetTitledFirstName] não faz mal..."
 intrigue_scheme_ongoing.2003.desc:0 "Não era o que [agent.GetTitledFirstName] esperava encontrar ao espionar conversas secretas, mas descobrir a verdade sobre [other_secret_target.GetTitledFirstName] não faz mal..."
 intrigue_scheme_ongoing.2003.murder:0 "Não era o que [agent.GetTitledFirstName] esperava encontrar ao espionar conversas secretas, mas descobrir os terríveis crimes de [other_secret_target.GetTitledFirstName] não faz mal..."
 intrigue_scheme_ongoing.2003.secret_relationships:0 "Não era o que [agent.GetTitledFirstName] esperava encontrar ao espionar conversas secretas, mas descobrir os relacionamentos ilícitos de [other_secret_target.GetTitledFirstName] não faz mal..."
 intrigue_scheme_ongoing.2003.t:0 "Espionagem Feliz Acaso"
 intrigue_scheme_ongoing.3001.a:0 "Eu faço o que devo!"
 intrigue_scheme_ongoing.3001.b:0 "Se precisa ser feito, deve ser feito corretamente."
 intrigue_scheme_ongoing.3001.desc:0 "A maneira como estou agindo ultimamente... O sigilo e as tramas nas sombras. Isso não pode estar certo. Isso não pode ser justo."
 intrigue_scheme_ongoing.3001.t:0 "Justiça e Sigilo"
 intrigue_scheme_ongoing.3002.a:0 "Isso é o que precisa ser feito!"
 intrigue_scheme_ongoing.3002.b:0 "Eu passo tempo demais pensando nisso."
 intrigue_scheme_ongoing.3002.c:0 "[ROOT.Char.GetFaith.HighGodName], perdoe-me, o que eu tenho feito?"
 intrigue_scheme_ongoing.3002.d:0 "Devo ser honest[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] sobre minhas intenções."
 intrigue_scheme_ongoing.3002.desc:0 "Todos esses planos secretos e padrões sombrios... Uma mão gelada agarra meu coração sempre que penso neles. Isso parece tão errado."
 intrigue_scheme_ongoing.3002.t:0 "O Fardo da Mentira"
 intrigue_scheme_ongoing.3003.a.failure:0 "O caçador [hunter.GetShortUIName] se gaba sobre a riqueza adquirida"
 intrigue_scheme_ongoing.3003.a.success:0 "O caçador [hunter.GetShortUIName] é discreto"
 intrigue_scheme_ongoing.3003.a:0 "Pagar um caçador de [scheme_location.GetNameNoTooltip] para fazer um mapa."
 intrigue_scheme_ongoing.3003.b.hard_failure:0 "Você se perde durante a noite no [scheme_location.Custom('TerrainTypeProvince')]"
 intrigue_scheme_ongoing.3003.b.soft_failure:0 "Você se perde no [scheme_location.Custom('TerrainTypeProvince')]"
 intrigue_scheme_ongoing.3003.b.success:0 "Você mapeia a área ao redor de [scheme_location.GetNameNoTooltip]"
 intrigue_scheme_ongoing.3003.b:0 "Explore o [scheme_location.Custom('TerrainTypeProvince')] você mesmo."
 intrigue_scheme_ongoing.3003.c:0 "Abandonar a ideia."
 intrigue_scheme_ongoing.3003.d:0 "Pedir ajuda ao seu amigo [hunter.GetTitledFirstNameNoTooltip]."
 intrigue_scheme_ongoing.3003.e:0 "Peça ajuda ao seu $master_of_hunt_court_position$ [hunter.GetTitledFirstNameNoTooltip]."
 intrigue_scheme_ongoing.3003.t:0 "Em Trânsito"
 intrigue_scheme_ongoing.3004.a:0 "Obrigad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por trazer isso à minha atenção."
 intrigue_scheme_ongoing.3004.b:0 "Essa idiota pertence às minhas masmorras!"
 intrigue_scheme_ongoing.3004.c.tt:0 "Um [hostile_scheme|E] ou outro [scheme|E] malicioso é exposto"
 intrigue_scheme_ongoing.3004.c:0 "Traga [hunter.GetSheHe] para mim. Acho que posso refrescar a memória [hunter.GetHerHim]..."
 intrigue_scheme_ongoing.3004.desc:0 "Meus espiões me informaram sobre um caçador causando tumulto na taverna local. [Select_CString( hunter.IsFemale, 'A', 'O' )] [hunter.GetWomanMan] tem gastado grandes quantidades de moedas e se gabando em voz alta sobre o grande negócio que fez com \"[Select_CString( owner.IsFemale, 'uma', 'um' )] nobre [owner.GetLadyLord] em pérolas e seda.\"\n\nAparentemente, [hunter.GetSheHe] fez um mapa da [defender.Custom('TerrainType')] local para um[Select_CString( owner.IsFemale, 'a', '' )] nobre [owner.GetWomanMan] desconhecid[Select_CString( owner.IsFemale, 'a', 'o' )]. Os espiões acham que [Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetLadyLord] deve estar conspirando contra mim ou contra um dos meus súditos."
 intrigue_scheme_ongoing.3004.t:0 "O Mapa"
 intrigue_scheme_ongoing.3004.toast:0 "Esquema exposto"
 intrigue_scheme_ongoing.3005.a.failure:0 "[defender.GetShortUIName|U] dispensa o treinador de pássaros"
 intrigue_scheme_ongoing.3005.a.success:0 "O \"presente\" chega a [pigeon_recipient.GetShortUIName]"
 intrigue_scheme_ongoing.3005.a:0 "Um treinador de pássaros local poderia entregá-lo como um \"presente\"."
 intrigue_scheme_ongoing.3005.b:0 "Se eu mesmo enviar o \"presente\", [defender.GetTitledFirstNameNoTooltip] não poderia recusar."
 intrigue_scheme_ongoing.3005.c.f:0 "Essa opção está disponível porque seu agente [elope_agent.GetShortUIName] é um [friend|E], um [close_family_member|E] ou [Select_CString( elope_agent.IsFemale, 'uma serva', 'um servo' )] [elope_agent.Custom('FemaleMale')] de [pigeon_recipient.GetShortUIName]"
 intrigue_scheme_ongoing.3005.c:0 "Peça [Select_CString( elope_agent.IsFemale, 'a', 'ao' )] [elope_agent.GetTitledFirstNameNoTooltip] para entregar o pássaro."
 intrigue_scheme_ongoing.3005.d:0 "É muito arriscado."
 intrigue_scheme_ongoing.3005.desc:0 "Conforme meu esquema se aproxima da conclusão, a comunicação rápida é essencial. Eu tenho um pombo especialmente inteligente que [pigeon_recipient.GetTitledFirstName] poderia usar para enviar uma mensagem urgente para mim aqui em [root_location.GetNameNoTooltip], se houver necessidade.\n\nMas como eu faria o pássaro chegar na [defender.Custom('ResidenceBuilding')] de [target_location.GetNameNoTooltip]?"
 intrigue_scheme_ongoing.3005.t:0 "Mensageiro Alado"
 intrigue_scheme_ongoing.3010.a:0 "Vou traduzir o [target.GetCulture.GetLanguage.GetNameNoTooltip] eu mesmo."
 intrigue_scheme_ongoing.3010.b:0 "Parece ser muito trabalho para mim."
 intrigue_scheme_ongoing.3010.desc:0 "Como parte do meu plano contínuo para [scheme.GetNameNoTooltip|l] [target.GetTitledFirstName], alguns dos meus asseclas interceptam regularmente as cartas [target.GetHerHim]. Devido à minha compreensão especializada de [target.GetCulture.GetLanguage.GetName], eu mesmo poderia lê-las em vez de depender de traduções de segunda mão, embora isso certamente tomaria tempo e me afastaria de algumas de minhas obrigações.\n\nTalvez eu possa obter informações valiosas dessa maneira?"
 intrigue_scheme_ongoing.3010.t:0 "[scheme.GetNameNoTooltip]: Segredos de [target.GetCulture.GetLanguage.GetNameNoTooltip]"
 intrigue_scheme_ongoing.3011.a:0 "Excelente iniciativa."
 intrigue_scheme_ongoing.3011.b:0 "Parece ser uma perda de tempo."
 intrigue_scheme_ongoing.3011.desc:0 "Como parte do meu plano para [scheme.GetNameNoTooltip|l] [target.GetTitledFirstName], eu solicitei a ajuda de [multilingual_agent.GetName], que parece ser uma verdadeira enciclopédia quando se trata de idiomas. Usando o vasto conhecimento [multilingual_agent.GetHerHim] em diversos dialetos, [multilingual_agent.GetSheHe] criou um código que [multilingual_agent.GetSheHe] afirma ser 'indecifrável'.\n\n\"Não só seria necessário um mestre criptógrafo: essa pessoa também precisaria entender as sutilezas da gramática de [language_culture_2.GetLanguage.GetNameNoTooltip], os detalhes dos provérbios em [language_culture.GetLanguage.GetNameNoTooltip], tudo enquanto leva em consideração a estrutura das palavras em [multilingual_agent.GetCulture.GetLanguage.GetNameNoTooltip]."
 intrigue_scheme_ongoing.3011.t:0 "[scheme.GetNameNoTooltip]: O Código [language_culture.GetLanguage.GetNameNoTooltip]-[language_culture_2.GetLanguage.GetNameNoTooltip]-[multilingual_agent.GetCulture.GetLanguage.GetNameNoTooltip]"
 intrigue_scheme_ongoing.4001.a:0 "Ensine a eles o hábito de brincar longe de olhares atentos."
 intrigue_scheme_ongoing.4001.b:0 "Tente fazer amizade com [scheme.GetTargetCharacter.GetTitledFirstNameNoTooltip]. Ganhe a confiança [scheme.GetTargetCharacter.GetHerHim]."
 intrigue_scheme_ongoing.4001.desc:0 "[agent_in_question.GetTitledFirstName] me disse que [agent_in_question.GetSheHe] foi encarregado de cuidar de um grupo de crianças brincando na corte.\nPor sorte, isso inclui [scheme.GetTargetCharacter.GetTitledFirstName].\n\nEssa é uma ótima oportunidade para que [agent_in_question.GetTitledFirstName] avance com os planos."
 intrigue_scheme_ongoing.4001.t:0 "Um Adulto Responsável"
 intrigue_scheme_ongoing.4002.a:0 "Uma oportunidade de se aproximar [Select_CString( parent.IsFemale, 'da sua', 'do seu' )] [target.Custom2('RelationToMe', SCOPE.sC('parent'))]!"
 intrigue_scheme_ongoing.4002.b:0 "Um esconderijo secreto? Você poderia me mostrar?"
 intrigue_scheme_ongoing.4002.desc:0 "[target.GetTitledFirstName] não consegue sequer compreender que alguém faria planos desonestos, apesar do tumultuado tribunal ao redor [target.GetHerHim].\n\nConversando com [scheme.GetTargetCharacter.GetSheHe], parece que [scheme.GetTargetCharacter.GetSheHe] realmente confia em mim!"
 intrigue_scheme_ongoing.4002.t:0 "A Ingenuidade das Crianças"
 intrigue_scheme_ongoing.4003.a:0 "\"Não me faça lembrar o motivo pelo qual você está me ajudando em primeiro lugar!\""
 intrigue_scheme_ongoing.4003.b:0 "Vou reduzir discretamente o envolvimento deles no meu plano."
 intrigue_scheme_ongoing.4003.desc:0 "[agent_in_question.GetTitledFirstName] veio até mim preocupado com o plano no qual envolvi [agent_in_question.GetSheHe]. Embora eu tenha dado a ordem para que [agent_in_question.GetSheHe] se aproximasse de [scheme.GetTargetCharacter.GetTitledFirstName], eu nunca imaginei que eles se apegariam emocionalmente!\n\nAgora, me vejo questionando até que ponto eles podem ser confiáveis..."
 intrigue_scheme_ongoing.4003.t:0 "Segundas Intenções"
 intrigue_scheme_ongoing.5001.a:0 "Quero que você triture bem finamente quadris de rosas..."
 intrigue_scheme_ongoing.5001.b:0 "Corte buracos em suas roupas. Em áreas impróprias."
 intrigue_scheme_ongoing.5001.desc:0 "[Select_CString( servant.IsFemale, 'A', 'O' )] [servant.GetWomanMan] encarregad[Select_CString( servant.IsFemale, 'a', 'o' )] de limpar as roupas dos guardas de [target.GetTitledFirstNamePossessive] foi trazid[Select_CString( target.IsFemale, 'a', 'o' )] a mim. Ninguém notará se [servant.GetSheHe] interferir nas roupas deles, e se algo perturbador para os guardas pudesse ser plantado...\n\n\"O que você deseja de mim, [ROOT.Char.Custom('FormOfAddressForLiege')]?\""
 intrigue_scheme_ongoing.5001.t:0 "Uma Distração Necessária"
 intrigue_scheme_ongoing.5002.a.failure:0 "[target.GetSheHe|U] fica apenas mais vigilante"
 intrigue_scheme_ongoing.5002.a.success:0 "[target.GetSheHe|U] passa muitas noites sem dormir preocupad[Select_CString( target.IsFemale, 'a', 'o' )]"
 intrigue_scheme_ongoing.5002.a.tt:0 "Acredito que é mais fácil afetar [target.GetFirstNameNoTooltip] com más notícias"
 intrigue_scheme_ongoing.5002.a:0 "Um mau presságio para um[Select_CString( target.IsFemale, 'a', '' )] [target.GetTitleAsNameNoTooltip] [Select_CString( target.IsFemale, 'má', 'mau' )]!"
 intrigue_scheme_ongoing.5002.b.failure:0 "[target.GetSheHe|U] fica mais cautelos[Select_CString( target.IsFemale, 'a', 'o' )]"
 intrigue_scheme_ongoing.5002.b.success:0 "[target.GetSheHe|U] baixa a guarda"
 intrigue_scheme_ongoing.5002.b.tt:0 "Acredito que [target.GetFirstNameNoTooltip] é mais propenso a acreditar em boas notícias"
 intrigue_scheme_ongoing.5002.b:0 "Um bom presságio, para deixar [target.GetSheHe] com uma falsa sensação de segurança."
 intrigue_scheme_ongoing.5002.desc:0 "Um[Select_CString( target.IsFemale, 'a', '' )] [target.GetTitleAsNameNoTooltip] para assustar, um místico local, [local_mystic.GetName], com moral duvidosa, e um presságio fabricado... Perfeito.\n\nAntes que o místico parta para o tribunal de [target.GetTitledFirstNamePossessive], há uma única pergunta — será que meu falso presságio será de boa sorte, ou de desgraça?"
 intrigue_scheme_ongoing.5002.t:0 "Escrito nas Estrelas"
 intrigue_scheme_ongoing.5003.a:0 "Bem, isso é sinistro...!"
 intrigue_scheme_ongoing.5003.desc:0 "\"Os sinais! Os sinais não estão a seu favor, [Select_CString( target.IsFemale, 'minha', 'meu' )] [target.GetLadyLord]. Derramei as entranhas de uma galinha, e o sangue me mostrou o seu futuro – é sombrio e cheio de morte!\""
 intrigue_scheme_ongoing.5003.desc_opening:0 "Um místico local, [local_mystic.GetName], insistiu em me ver, e ao ser trazido à minha presença, [local_mystic.GetSheHe] começou a gritar, e... será que há sangue nas mãos [local_mystic.GetHerHim]?\n\n"
 intrigue_scheme_ongoing.5003.t:0 "O Presságio"
 intrigue_scheme_ongoing.5004.a:0 "Bem... obrigad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]?"
 intrigue_scheme_ongoing.5004.desc:0 "\"Os sinais! Os sinais estão a seu favor, [Select_CString( target.IsFemale, 'minha', 'meu' )] [target.GetLadyLord]. Derramei as entranhas de uma galinha, e o sangue me mostrou o seu futuro – é glorioso!\""
 intrigue_scheme_ongoing.5005.a:0 "Ora, ora, ora... eu diria que [target.GetSheHe] merece um presente."
 intrigue_scheme_ongoing.5005.b:0 "[target.GetSheHe|U] não verá nem um tostão meu!"
 intrigue_scheme_ongoing.5005.desc:0 "Meu [spymaster.GetCouncilTitle], [spymaster.GetTitledFirstName], se aproxima de mim com um sorriso malicioso.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], esta bolsa contém um pó muito maligno. Se espalhado sobre algo – digamos, um presente para [target.GetTitledFirstName] –, não deixa rastros, mas aflige quem toca com fraqueza e humor ruim.\""
 intrigue_scheme_ongoing.5005.t:0 "Tudo o que Reluz"
 intrigue_scheme_ongoing.5006.a:0 "Que inesperado! E que efeito curioso."
 intrigue_scheme_ongoing.5006.desc:0 "[owner.GetTitledFirstName] me enviou um presente, uma caixa ricamente decorada cheia de ouro. Enquanto passo as mãos pelas moedas, sinto como se o ambiente estivesse girando ao meu redor e minha respiração fica ofegante."
 intrigue_scheme_ongoing.5006.t:0 "O Presente"
 intrigue_scheme_ongoing.5007.a.tt:0 "[ROOT.Char.GetFaith.HighGodName] ajude [poisoned.GetSheHe]!"
 intrigue_scheme_ongoing.5007.a:0 "O que poderia ter... O ouro envenenado!"
 intrigue_scheme_ongoing.5007.desc:0 "\"[ROOT.Char.GetMotherFather], algo está errado. Meus humores estão desequilibrados desde que ajudei a preparar aquele presente para [target.GetTitledFirstName]...\""
 intrigue_scheme_ongoing.5007.desc_opening:0 "M[Select_CString( poisoned.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('poisoned'))], [poisoned.GetTitledFirstName], se aproxima de mim com suor escorrendo de sua testa e o rosto pálido.\n\n"
 intrigue_scheme_ongoing.5007.t:0 "O Ouro Envenenado"
 intrigue_scheme_ongoing.5008.a:0 "Maldição."
 intrigue_scheme_ongoing.5008.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], meus humores estão desequilibrados desde que ajudei a preparar aquele presente para [target.GetTitledFirstName]... Receio que o veneno do ouro também me afetou.\""
 intrigue_scheme_ongoing.5009.a.tt:0 "Pergunto onde isso #EMP roedores#!"
 intrigue_scheme_ongoing.5009.a:0 "Mostrem-me o caminho, meus amigos!"
 intrigue_scheme_ongoing.5009.b:0 "Eca. Não vou entrar lá."
 intrigue_scheme_ongoing.5009.desc:0 "Relatórios me alcançam sobre uma grande concentração de ratos ao redor de [target.Custom('ResidenceBuilding')] de [target.GetTitledFirstName], e como eu tenho um jeito com os animais, decido investigar.\n\nAo chegar ao local, os ratos convergem em minha direção, me saudando, e me levam a um túnel escuro, afastado da [target.Custom('ResidenceBuilding')]."
 intrigue_scheme_ongoing.5009.t:0 "O Túnel"
 intrigue_scheme_ongoing.5010.a:0 "Obrigad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], meus amigos!"
 intrigue_scheme_ongoing.5010.b:0 "*Cof, cof* Obrigad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], meus amigos! Mas esse cheiro...!"
 intrigue_scheme_ongoing.5010.desc:0 "Está escuro, e o som de pequenos pés ecoa no ar impregnado pelo cheiro de lixo.\n\nDe repente, um sopro de ar fresco me alcança, e vejo a luz filtrando por uma grade adiante. Os ratos me levam a um túnel que vai direto para [target.Custom('ResidenceBuilding')] de [target.GetTitledFirstName]!"
 intrigue_scheme_ongoing.5011.a.tt:0 "[target.GetSheHe|U] jamais esperará isso!"
 intrigue_scheme_ongoing.5011.a:0 "Uma das suas criaturas mais veneno– interessantes, por favor."
 intrigue_scheme_ongoing.5011.b:0 "Me dê aquela [SCOPE.Custom('VenomousCreature')] para estudos."
 intrigue_scheme_ongoing.5011.desc:0 "Uma grande variedade de criaturas venenosas me saúda em uma barraca de comerciante, e sou tomad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] pela inspiração. Não seria uma dessas criaturas exóticas o presente perfeito para [target.GetTitledFirstName]?"
 intrigue_scheme_ongoing.5011.t:0 "O Bichinho"
 intrigue_scheme_ongoing.5012.a:0 "Onde ela foi...? Onde– AHH!"
 intrigue_scheme_ongoing.5012.desc:0 "O comerciante colocou a [SCOPE.Custom('VenomousCreature')] em uma cesta de vime sem fazer perguntas. No caminho para casa, abro a tampa, mas para minha surpresa, ela está vazia..."
 intrigue_scheme_ongoing.5013.a.tt:0 "Perdi a criatura, mas ao menos não perdi a vida..."
 intrigue_scheme_ongoing.5013.a:0 "...TADÁ! Agora tirem. Tirem ela #EMP de mim#!!"
 intrigue_scheme_ongoing.5013.desc:0 "\"Olhem, mãe, olhem! Aquel[Select_CString( ROOT.Char.IsFemale, 'a', 'e' )] [ROOT.Char.GetWomanMan] está equilibrando uma criatura na cabeça!\" Uma voz encantada soa atrás de mim e, ao me virar, vejo que uma multidão se reuniu."
 intrigue_scheme_ongoing.5014.a.failure:0 "[target.GetSheHe|U] suspeita que algo se passa"
 intrigue_scheme_ongoing.5014.a.success:0 "[target.GetSheHe|U] aceita o presente"
 intrigue_scheme_ongoing.5014.a:0 "[target.GetTitledFirstNameNoTooltip] ficará honrad[Select_CString( target.IsFemale, 'a', 'e' )] com um presente assim."
 intrigue_scheme_ongoing.5014.b:0 "Ele ficaria #EMP ótimo#! nos meus aposentos..."
 intrigue_scheme_ongoing.5014.desc:0 "Macio, vibrante e suave como a primeira luz da alvorada — um comerciante me apresenta um tapete requintado na esperança de futuras boas relações.\n\nEnquanto admiro a bela trama, tenho uma ideia. Não seria um tapete como esse capaz de abafar o som dos passos? Ou até mesmo ocultar os passos de um agente desajeitado...?"
 intrigue_scheme_ongoing.5014.t:0 "Tapete Plush e Exótico"
 intrigue_scheme_ongoing.5014.t_persian:0 "$persian_has_plush_carpet_modifier$"
 intrigue_scheme_ongoing.5015.a:0 "Esse tapete cobrirá os pisos dos meus aposentos!"
 intrigue_scheme_ongoing.5015.b:0 "Acho melhor me livrar dele..."
 intrigue_scheme_ongoing.5015.desc:0 "Um tapete macio, vibrante e suave chega como presente de [owner.GetTitledFirstName].\n\nPor que [owner.GetSheHe] me enviaria um presente tão requintado, eu não sei, mas a trama do tapete é tão agradável ao toque quanto a pele de um amante."
 intrigue_scheme_ongoing.5016.a:0 "Palavras sussurradas podem derrubar [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitleAsNameNoTooltip]!"
 intrigue_scheme_ongoing.5016.b:0 "Mantenha as portas da [target.Custom('ResidenceBuilding')] abertas para mim."
 intrigue_scheme_ongoing.5016.c_man:0 "Deixe pra lá. Volte correndo para o seu mestre."
 intrigue_scheme_ongoing.5016.c_woman:0 "Deixe pra lá. Volte correndo para a sua mestra."
 intrigue_scheme_ongoing.5016.desc:0 "[servant.GetTitledFirstName] está diante de mim, [Select_CString( servant.IsFemale, 'uma serva', 'um servo' )] d[Select_CString( target.IsFemale, 'a', 'o' )] [target.Custom2('InsultAdjective', ROOT.Char)] [target.GetTitledFirstName].\n\n\"Agora, quero que você faça algo por mim... E é claro que será devidamente recompensad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )].\"\""
 intrigue_scheme_ongoing.5016.t:0 "O Poder das Palavras"
 intrigue_scheme_ongoing.5017.a.failure:0 "[Select_CString( target.IsFemale, 'A', 'O' )] [target.GetTitleAsNameNoTooltip] convence [spouse.GetSheHe] de que é uma mentira"
 intrigue_scheme_ongoing.5017.a.success:0 "[spouse.GetTitledFirstNameNoTooltip] acredita em mim"
 intrigue_scheme_ongoing.5017.a:0 "S[Select_CString( target.IsFemale, 'ua', 'eu' )] [spouse.Custom2('RelationToMe', SCOPE.sC('target'))] tem chamado você de [spouse.Custom2('InsultNoun', ROOT.Char)] [spouse.Custom2('InsultAdjectiveArticle', ROOT.Char)]."
 intrigue_scheme_ongoing.5017.b:0 "Por favor, me fale sobre [target.Custom('ResidenceBuilding')]!"
 intrigue_scheme_ongoing.5017.desc:0 "Mal consigo conter minha alegria ao encontrar [spouse.GetTitledFirstName], [target.Custom2('RelationToMe', SCOPE.sC('spouse'))] d[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstNamePossessive], esperando por mim junto a uma pequena comitiva. Se eu conseguisse #EMP convencê-l[Select_CString( target.IsFemale, 'a', 'o' )]# a me ajudar em meu plano...\n\n\"Você mandou dizer que queria me ver, [ROOT.Char.Custom('FormOfAddressForLiege')]?\""
 intrigue_scheme_ongoing.5017.t:0 "[target.Custom2('RelationToMe', SCOPE.sC('spouse'))|U] Crédul[Select_CString( spouse.IsFemale, 'a', 'o' )]"
 intrigue_scheme_ongoing.5018.a:0 "Invisíveis na multidão, eles me informarão tudo."
 intrigue_scheme_ongoing.5018.b:0 "Farinha, trigo, carne... Queime tudo."
 intrigue_scheme_ongoing.5018.desc:0 "[Select_CString( target.IsFemale, 'A', 'O' )] [target.Custom2('InsultAdjective', ROOT.Char)] [target.GetTitledFirstName] está em guerra.\n\n[target.GetSheHe|U] está acampad[Select_CString( target.IsFemale, 'a', 'o' )] em [location.GetName], e fontes me dizem que [target.GetSheHe] logo terá mais seguidores de acampamento — uma oportunidade perfeita para infiltrar alguns dos meus aliados no acampamento!"
 intrigue_scheme_ongoing.5018.msg.t:0 "Suprimentos queimados em acidente"
 intrigue_scheme_ongoing.5018.t:0 "Seguidores do Acampamento"
 intrigue_scheme_ongoing.5019.a:0 "Parece um túnel que podemos usar!"
 intrigue_scheme_ongoing.5019.b.tt:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('architect'))|U] [architect.GetFirstNameNoTooltip] supervisionará as obras de construção."
 intrigue_scheme_ongoing.5019.b:0 "Se eu tivesse tantos esconderijos assim... Chame meus arquitetos."
 intrigue_scheme_ongoing.5019.desc:0 "M[Select_CString( agent.IsFemale, 'inha', 'eu' )] agente [agent.GetTitledFirstName] se aproxima de mim com um punhado de pergaminhos em suas mãos.\n\n\"Encontrei antigas plantas arquitetônicas do [target.Custom('ResidenceBuilding')] d[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitleAsName]! Elas podem estar um pouco desatualizadas, mas veja aqui...\""
 intrigue_scheme_ongoing.5019.t:0 "Túnel Secreto"
 intrigue_scheme_ongoing.5021.a.failure:0 "[owner.GetSheHe|U] está ofendid[Select_CString( owner.IsFemale, 'a', 'o' )]"
 intrigue_scheme_ongoing.5021.a.success.tt:0 "O plano é exposto"
 intrigue_scheme_ongoing.5021.a.success:0 "[owner.GetSheHe|U] está realmente tramando matar"
 intrigue_scheme_ongoing.5021.a:0 "O que significa isso, [owner.GetFirstNameNoTooltip]?!"
 intrigue_scheme_ongoing.5021.b:0 "Eu não vi #EMP nada#!"
 intrigue_scheme_ongoing.5021.desc:0 "Vou procurar por [owner.GetTitledFirstName], m[Select_CString( owner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))], nos aposentos [owner.GetHerHim] apenas para ser recebido com uma [owner.Custom('GetChamber')] vazia.\n\nFolheando distraidamente os papéis [owner.GetHerHim], encontro algo — planos, indiscutivelmente, contra [target.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
 intrigue_scheme_ongoing.5021.t:0 "Preocupações Precárias"
 intrigue_scheme_ongoing.5022.a.failure:0 "[family_member.GetSheHe|U] não acredita em seus argumentos"
 intrigue_scheme_ongoing.5022.a.success:0 "[family_member.GetSheHe|U] acredita em você"
 intrigue_scheme_ongoing.5022.a:0 "Eu nunca #EMP faria isso#!"
 intrigue_scheme_ongoing.5022.b.failure:0 "[family_member.GetSheHe|U] não é convencid[Select_CString( family_member.IsFemale, 'a', 'o' )]"
 intrigue_scheme_ongoing.5022.b.success:0 "[family_member.GetSheHe|U] escuta seus argumentos"
 intrigue_scheme_ongoing.5022.b:0 "É o melhor a fazer. Me ouça agora..."
 intrigue_scheme_ongoing.5022.c:0 "Parece que meus planos acabaram de se complicar."
 intrigue_scheme_ongoing.5022.desc:0 "\"Você está planejando matar alguém?!\"\n\n[family_member.GetTitledFirstName], m[Select_CString( family_member.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('family_member'))], me confronta com uma expressão horrorizada no rosto. Em sua mão, [family_member.GetSheHe] segura papéis com anotações do meu plano para matar [target.GetTitledFirstName] — papéis que sei que deixei em meu estudo privado."
 intrigue_scheme_ongoing.5022.t:0 "Acusações"
 intrigue_scheme_ongoing.5023.a:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('owner'))|U], por favor– Aaaah!"
 intrigue_scheme_ongoing.5023.desc:0 "\"Você não era para ver isso.\"\n\nA voz de [owner.GetTitledFirstNamePossessive] é baixa, mas consigo sentir a raiva nela. Enquanto [owner.GetSheHe] se aproxima do cinto, dou um passo para trás, mas antes que eu possa fazer algo, [owner.GetSheHe] está em cima de mim, com uma faca na mão."
 intrigue_scheme_ongoing.5024.a:0 "Aqui. Garanta que seja realizada."
 intrigue_scheme_ongoing.5024.b:0 "Não vou desperdiçar dinheiro com [target.GetSheHe]!"
 intrigue_scheme_ongoing.5024.desc:0 "[agent.GetTitledFirstName] me diz que uma celebração local em [province.GetName] — a terra natal de [target.GetTitledFirstName] — está com dificuldades financeiras.\n\n\"Se ela for realizada, atrairá muitas pessoas, tanto nobres quanto plebeus, para a região; uma oportunidade perfeita para a infiltração!\""
 intrigue_scheme_ongoing.5024.t:0 "Celebração em [province.GetNameNoTooltip|U]"
 intrigue_scheme_ongoing.5026.a.failure:0 "[court_chaplain.GetSheHe|U] se recusa"
 intrigue_scheme_ongoing.5026.a.success:0 "[court_chaplain.GetSheHe|U] me ajuda"
 intrigue_scheme_ongoing.5026.a:0 "\"É para o bem da fé!\""
 intrigue_scheme_ongoing.5026.a_gregarious:0 "\"Vamos dar um passeio.\""
 intrigue_scheme_ongoing.5026.a_gregarious_tt:0 "[court_chaplain.GetSheHe|U] nem vai perceber que [court_chaplain.GetSheHe] está me contando #EMP tudo#!"
 intrigue_scheme_ongoing.5026.b:0 "\"Mas de acordo com [target.GetFaith.HighGodName]...\""
 intrigue_scheme_ongoing.5026.b_agent:0 "\"Você já concordou em me ajudar, então...\""
 intrigue_scheme_ongoing.5026.b_scholar:0 "\"Vamos ver o que [target.GetFaith.HighGodName] deseja.\""
 intrigue_scheme_ongoing.5026.b_scholar_tt:0 "Que coincidência que será o mesmo que eu desejo!"
 intrigue_scheme_ongoing.5026.c:0 "Isso é entre [target.GetSheHe] e [target.GetFaith.PantheonTerm]."
 intrigue_scheme_ongoing.5026.desc:0 "Como todos os [target.GetFaith.GetAdherentNamePluralNoTooltip], [target.Custom2('MyCharacterIntroduction', ROOT.Char)] compartilha mais com [target.GetFaith.HighGodName], e por extensão [court_chaplain.GetTitledFirstName], do que compartilha com a maioria dos mortais.\n\nSe ao menos eu pudesse fazer com que [Select_CString( court_chaplain.IsFemale, 'a', 'o' )] [court_chaplain.GetCouncilTitle] transmitisse algumas das preocupações e planos de [target.GetTitledFirstNamePossessiveNoTooltip] para mim...!"
 intrigue_scheme_ongoing.5026.t:0 "Uma Mão Amiga"
 intrigue_scheme_ongoing.end.3003.desc:0 "Um mapa detalhado do [scheme_location.Custom('TerrainTypeProvince')] local, com todos os seus caminhos escondidos e cavernas, seria um recurso inestimável."
 intrigue_scheme_ongoing.escape_route.3003.desc:0 "rota de fuga segura para sair de [defender.Custom('ResidenceBuilding')] de [defender.GetTitledFirstNamePossessive], caso algo dê errado."
 intrigue_scheme_ongoing.leave_with_target.3003.desc:0 "rota segura para transportar [target.GetTitledFirstName] para fora de [defender.Custom('ResidenceBuilding')] de [defender.GetTitledFirstNamePossessive]."
 intrigue_scheme_ongoing.start.3003.desc:0 "Quando chegar a hora, meus agentes vão precisar de uma"
 intrigue_scheme_ongoing_5016_every_courtier:0 "Qualquer cortesão e convidado que não seja um agente"
