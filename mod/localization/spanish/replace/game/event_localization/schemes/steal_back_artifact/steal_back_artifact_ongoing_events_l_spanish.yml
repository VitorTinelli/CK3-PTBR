l_spanish:
 steal_back_artifact_event_title:0 "Roubo do Artefato:"
 steal_back_artifact_ongoing.1001.a.tt:0 "Você acredita que a lealdade de [antiquarian.GetTitledFirstNamePossessive] pode ser comprada com riquezas..."
 steal_back_artifact_ongoing.1001.a:0 "Ouro é a linguagem universal da suborno."
 steal_back_artifact_ongoing.1001.b.tt:0 "[antiquarian.GetTitledFirstName] concordará com uma \"troca\" justa."
 steal_back_artifact_ongoing.1001.b:0 "Talvez um artefato por outro?"
 steal_back_artifact_ongoing.1001.c.tt:0 "Você está apostando que [antiquarian.GetTitledFirstName] apreciará a beleza física acima das lealdades."
 steal_back_artifact_ongoing.1001.c:0 "Uma introdução [Select_CString( random_beauty.IsFemale, 'a', 'ao' )] [random_beauty.GetTitledFirstNameNoTooltip] pode ser... #EMP estimulante#!."
 steal_back_artifact_ongoing.1001.d:0 "Vou procurar outras possibilidades em vez disso."
 steal_back_artifact_ongoing.1001.desc:0 "Um dos obstáculos óbvios para recuperar o artefato é [Select_CString( antiquarian.IsFemale, 'a antiquária', 'o antiquário' )] de [target.GetTitledFirstNamePossessive], [antiquarian.GetTitledFirstName].\n\nExistem, é claro, várias maneiras de... #EMP lidar#! com uma pessoa, mas eu me pergunto se é possível persuadir [antiquarian.GetFirstNameNoTooltip] a ignorar o que está acontecendo, oferecendo um suborno adequado."
 steal_back_artifact_ongoing.1001.t:0 "$steal_back_artifact_event_title$ [Select_CString( antiquarian.IsFemale, 'A Antiquária', 'O Antiquário' )]"
 steal_back_artifact_ongoing.1002.a:0 "Dê instruções específicas [Select_CString( agent.IsFemale, 'a', 'ao' )] [agent.GetFirstNameNoTooltip]."
 steal_back_artifact_ongoing.1002.b:0 "Eu confio que eles farão o trabalho deles."
 steal_back_artifact_ongoing.1002.desc:0 "Eu disse [Select_CString( ROOT.Char.IsFemale, 'a', 'ao' )] [agent.Custom2('MyCharacterIntroduction', ROOT.Char)] para monitorar [target.GetTitledFirstName] para que possamos encontrar a oportunidade perfeita de roubar um artefato dele(a).\n\nO progresso, no entanto, tem sido muito mais lento do que eu gostaria. Talvez eu deva dar a [agent.GetSheHe] algo específico para procurar?"
 steal_back_artifact_ongoing.1002.t:0 "$steal_back_artifact_event_title$ Gerenciamento Menor"
 steal_back_artifact_ongoing_notification.1001.failure:0 "[antiquarian.GetTitledFirstName] Recusa o Suborno"
 steal_back_artifact_ongoing_notification.1001.success:0 "[antiquarian.GetTitledFirstName] Aceita o Suborno"
 steal_back_artifact_ongoing_notification.1002.failure:0 "[antiquarian.GetTitledFirstName] Não Consegue Encontrar Nenhuma Informação"
 steal_back_artifact_ongoing_notification.1002.success:0 "[agent.GetTitledFirstName] Relata de Volta"
