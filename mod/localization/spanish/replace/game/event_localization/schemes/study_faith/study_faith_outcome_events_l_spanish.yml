l_spanish:
 child_studied_faith_desc:0 "[owner.Custom('GetDaughterSon')] aprendeu mais sobre [target.GetRite.GetName] [rite|E]"
 child_studied_faith_invalidated_desc:0 "O [GetScheme('study_faith').GetTypeName] [scheme|E] da sua Criança foi Invalidado"
 child_studied_faith_invalidated_title:0 "Esquema de Estudo de Rito da Criança Invalidado"
 child_studied_faith_title:0 "[owner.Custom('GetDaughterSon')|U] Studia um Rito!"
 holy_text_christian_quote:0 "[ROOT.Char.Custom('RandomRelevantBibleQuote')]"
 holy_text_indeterminate_quote_10:0 "Quando o mundo foi dividido em 'meu' e 'tua', o Divino riu-se, pois aos seus olhos havia apenas 'nosso'."
 holy_text_indeterminate_quote_1:0 "Assim como a traça desconhece a escritura das estrelas mas encontra a chama, também a alma não precisa nomear o Divino para ser consumida por ele."
 holy_text_indeterminate_quote_2:0 "Quando o vento do deserto apagou as pegadas do tirano, a areia lembrou-se apenas dos rastos dos sedentos e dos benevolentes."
 holy_text_indeterminate_quote_3:0 "O rio não escolhe as seixos para polir, mas com o passar dos anos tempera tudo rumo à perfeição."
 holy_text_indeterminate_quote_4:0 "Bebam da fonte do conhecimento e assim ela curvará as vossas costas."
 holy_text_indeterminate_quote_5:0 "No dia em que a montanha se curvou, não se curvou perante rei nem exército, mas inclinou-se para ouvir a pergunta de uma criança."
 holy_text_indeterminate_quote_6:0 "O Oculto fala primeiro em sussurros de dúvida para que, quando finalmente responderes, a tua fé seja verdadeiramente tua."
 holy_text_indeterminate_quote_7:0 "Cada falsidade proferida perante o altar regressa como fumo, mas cada lágrima sincera é semeada como semente nos jardins de [ROOT.Char.GetFaith.PositiveAfterLife]."
 holy_text_indeterminate_quote_8:0 "Não maldigas a escuridão que envolve o teu caminho; ela está lá para que a tua própria chama possa aprender a coragem de arder."
 holy_text_indeterminate_quote_9:0 "O Radiante não conta as preces dos orgulhosos, apenas as misericórdias silenciosas feitas quando nenhum olhar observa."
 msg_letter_from_vassal:0 "$religious_interaction.1.opening$"
 study_faith_ongoing.1000.a:0 "Vou dedicar #EMP todo#! o meu tempo a isto!"
 study_faith_ongoing.1000.b:0 "Preferia gastar o meu tempo noutro lugar..."
 study_faith_ongoing.1000.desc.theologian:0 "O meu estudo de [scheme.GetTargetCharacter.GetFaith.GetName] está a correr muito bem. É evidente que a sua estrutura não é de todo dissemelhante da de outras fés!"
 study_faith_ongoing.1000.desc.young:0 "O meu estudo de [scheme.GetTargetCharacter.GetFaith.GetName] está a progredir fantasticamente. Sinto que tenho todo o foco e energia do mundo!"
 study_faith_ongoing.1000.desc:0 "\n\n\"#EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!\"\n\nEmbora possa estar a parafrasear, sinto que o espírito da fé é claro, mesmo enquanto apuro os detalhes da palavra.\n\nSe continuar com este foco rigoroso, em breve possuirei todos os segredos de [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]!"
 study_faith_ongoing.1000.t.theologian:0 "$study_faith$: A Facilidade da Experiência"
 study_faith_ongoing.1000.t:0 "$study_faith$: A Facilidade da Juventude"
 study_faith_ongoing.1010.a:0 "Retiremos-nos para os meus aposentos, para que não sejamos incomodados."
 study_faith_ongoing.1010.b:0 "Estou apenas a estudar-te [lover_target.Custom('GetDerogatoryNonbeliever')], isso é tudo!"
 study_faith_ongoing.1010.c.tt:0 "#EMP Você bate a porta na cara de [lover_target.GetHerHis] e retoma seus estudos#!"
 study_faith_ongoing.1010.c:0 "Fora daqui, [lover_target.Custom2('InsultNounSexual', ROOT.Char)]. Preciso me concentrar!"
 study_faith_ongoing.1010.desc:0 "#EMP \"[scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]\"#!\n\nSentindo uma presença, levanto os olhos da minha análise das escrituras de [scheme.GetTargetCharacter.GetFaith.GetAdjective]. [lover_target.GetFirstName] está curvado(a) sobre mim com um olhar lascivo.\n\n\"Esse texto é sobre [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]?\", [lover_target.GetSheHe] inquiri.\n\n\"Que maravilha ter um(a) co-crente na corte, e ainda por cima [ROOT.Char.GetTitleTierName]! Talvez eu possa lhe ajudar com a minha compreensão mais... íntima?\""
 study_faith_ongoing.1010.t:0 "$study_faith$: Uma Compreensão Íntima"
 study_faith_ongoing.1011.a:0 "Não posso mais contar com [scheme.GetTargetCharacter.GetShortUINameNoTooltip]."
 study_faith_ongoing.1011.b:0 "Se [scheme.GetTargetCharacter.GetSheHe] tem escondido isso tão bem, talvez eu também possa..."
 study_faith_ongoing.1011.c.tt:0 "Vou tentar sondar as crenças secretas de [scheme.GetTargetCharacter.GetHerHis]."
 study_faith_ongoing.1011.c:0 "Ora, no que #EMP #! acredita então, [scheme.GetTargetCharacter.GetShortUINameNoTooltip]?"
 study_faith_ongoing.1011.desc:0 "Eu já desconfiava havia algum tempo, e após algumas perguntas cheias de pegadinhas, a falsidade de [scheme.GetTargetCharacter.GetTitledFirstNamePossessive] foi exposta. Apesar do que [scheme.GetTargetCharacter.GetSheHe] afirma, a crença de [scheme.GetTargetCharacter.GetHerHis] em [scheme.GetTargetCharacter.GetFaith.GetName] não é sincera!\n\nEmbora conhecer a atuação de um descrente seja interessante por si só, para que meu entendimento de [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip] progrida de forma significativa, talvez seja melhor encontrar um(a) adepto(a) mais fiel..."
 study_faith_ongoing.1011.t:0 "$study_faith$: Uma Pista Falsa"
 study_faith_ongoing.1012.a:0 "Bem, isto ainda é #EMP interessante#! de saber."
 study_faith_ongoing.1012.b.tt:0 "Você tentará encontrar um professor semelhante para continuar estudando [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]"
 study_faith_ongoing.1012.b:0 "Vou precisar de um novo professor para meus estudos."
 study_faith_ongoing.1012.c.tt:0 "Agora você estudará [actual_faith.GetNameNoTooltip]"
 study_faith_ongoing.1012.c:0 "Na verdade, isso parece muito mais atraente do que [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]!"
 study_faith_ongoing.1012.desc:0 "Minhas tentativas de investigar a fé de [scheme.GetTargetCharacter.GetTitledFirstNamePossessive] deram frutos, embora de maneiras inesperadas. Enquanto [scheme.GetTargetCharacter.GetSheHe] é indubitavelmente um(a) descrente de [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip], [scheme.GetTargetCharacter.GetSheHe] parece seguir os ritos estranhos e esquecidos de [actual_faith.GetName]. A prática deles não é muito diferente de... bruxaria.\n\nA descoberta me deixa abalado(a). Há alguma forma de tirar vantagem disso?"
 study_faith_ongoing.1012.t:0 "$study_faith$: Praticante de Ritos Antigos"
 study_faith_ongoing.1013.a:0 "Uma perda de tempo! Cansei de [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]."
 study_faith_ongoing.1013.desc:0 "Minhas tentativas de investigar a fé de [scheme.GetTargetCharacter.GetTitledFirstNamePossessive] falharam. Por trás da fachada devota de [scheme.GetTargetCharacter.GetHerHis], a visão de mundo de [scheme.GetTargetCharacter.GetHerHis] parece ser completamente desprovida de qualquer base teológica.\n\nSerá que [scheme.GetTargetCharacter.GetSheHe] segue os princípios de [scheme.GetTargetCharacter.GetFaith.GetName] simplesmente por conveniência, influência ou segurança?\n\nQuaisquer que sejam os motivos, é claro que este(a) [scheme.GetTargetCharacter.GetWomanMan] não investe nas crenças que [scheme.GetTargetCharacter.GetSheHe] professa."
 study_faith_ongoing.1013.t:0 "$study_faith$: Mais Farsante do que Místico"
 study_faith_ongoing.1020.a:0 "Se me ajudar, este ouro será seu."
 study_faith_ongoing.1020.b:0 "Uma mão lava a outra?"
 study_faith_ongoing.1020.c.failure:0 "[faith_helper.GetFirstNameNoTooltip] percebe sua manipulação imediatamente"
 study_faith_ongoing.1020.c.success:0 "Você convence [faith_helper.GetFirstNameNoTooltip] a lhe ajudar"
 study_faith_ongoing.1020.c:0 "Oh, você é #EMP tão altruísta#! oferecendo ajuda de graça!"
 study_faith_ongoing.1020.d:0 "Obrigado(a), mas consigo me virar sozinho(a)."
 study_faith_ongoing.1020.desc:0 "Parece que meus estudos da prática de [scheme.GetTargetCharacter.GetFaith.GetAdjective] chegaram aos ouvidos de [faith_helper.GetTitledFirstName]. [faith_helper.GetSheHe|U] é um(a) praticante local e está se oferecendo para me ajudar nos meus estudos.\n\n\"Não peço mais do que um sinal de apreço pelos meus esforços, [ROOT.Char.Custom('FormOfAddressForLiege')]\", diz [faith_helper.GetSheHe|U], [faith_helper.Custom('quirk_pos_pp')]."
 study_faith_ongoing.1020.t:0 "$study_faith$: Crente Local"
 study_faith_ongoing.1030.a:0 "Que golpe de sorte. Meu ouro é seu."
 study_faith_ongoing.1030.b.failure:0 "[chosen_peasant.GetFirstName] se sente insultado(a) com a sua oferta"
 study_faith_ongoing.1030.b.flavor:0 "Pechinchar com este(a) vendedor(a) de bugigangas"
 study_faith_ongoing.1030.b.success:0 "[chosen_peasant.GetFirstName] aceita o acordo"
 study_faith_ongoing.1030.b:0 "Isso não é tão raro quanto você pensa..."
 study_faith_ongoing.1030.c:0 "Guardas, tomem estes textos pagãos de [chosen_peasant.GetHerHim]."
 study_faith_ongoing.1030.d:0 "Impostor(a)! Fora daqui..."
 study_faith_ongoing.1030.desc:0 "Um(a) [chosen_peasant.GetWomanMan] se aproxima de mim com um sorriso ambicioso.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], é verdade que você está estudando os caminhos de [scheme.GetTargetCharacter.GetFaith.GetName]? Meu pai trouxe este(a) [scheme.GetTargetCharacter.GetFaith.ReligiousText] de uma de suas viagens a [holy_site.GetNameNoTier]!\"\n\n\"Não tenho uso para ele(a), pois não sei ler. Eu o(a) daria de bom grado a você em troca de algumas moedas."
 study_faith_ongoing.1030.t:0 "$study_faith$: [scheme.GetTargetCharacter.GetFaith.ReligiousText|U] Antigo"
 study_faith_ongoing.1040.a:0 "Escribas! Enviem recado demonstrando o meu apreço."
 study_faith_ongoing.1040.b:0 "A expressão de fé de [target.GetFirstNamePossessiveNoTooltip] é iluminadora..."
 study_faith_ongoing.1040.c:0 "Bah! Não preciso de validação de ninguém além de #EMP mesmo(a)!#!"
 study_faith_ongoing.1040.desc:0 "Que bênção! Recebi várias missivas em que [target.GetTitledFirstName] louva meus esforços para aprender as nuances da crença de [scheme.GetTargetCharacter.GetFaith.GetAdjective]. [target.GetSheHe|U] vai tão longe a ponto de me nomear o(a) [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] preeminente a estudar [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]!\n\nÉ bom ser reconhecido(a) pelo meu trabalho árduo!"
 study_faith_ongoing.1040.t:0 "$study_faith$: Admiração"
 study_faith_ongoing.1050.a:0 "Minhas anotações... não! Tanto trabalho perdido!"
 study_faith_ongoing.1050.b:0 "[sabotage_rival.GetTitledFirstNameNoTooltip] merece #EMP MORRER!#!"
 study_faith_ongoing.1050.c:0 "Ha-Ha! Eu sempre guardo #EMP anotações reservas!#!"
 study_faith_ongoing.1050.desc:0 "Minhas anotações descrevendo os preceitos às vezes confusos e contraditórios de [scheme.GetTargetCharacter.GetFaith.GetName] estão espalhadas por todo o meu escritório. Meses de trabalho jazem rasgados e esfarrapados, e uma folha solta na janela sugere que pelo menos algumas de minhas anotações foram jogadas fora.\n\nDevo começar de novo do zero?!\n\n#EMP Snif, snif...#!Que cheiro enjoativo é esse? Incenso ou sândalo misturado com algo... floral? O cheiro evoca a imagem presunçosa do(a) meu(minha) [sabotage_rival.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sabotage_rival'))] [sabotage_rival.GetTitledFirstName]. É [sabotage_rival.GetSheHe] quem buscou a minha ruína..."
 study_faith_ongoing.1050.t:0 "$study_faith$: O Fedor da Sabotagem"
 study_faith_ongoing.1060.a:0 "Por favor, aceite isto como prova do meu arrependimento."
 study_faith_ongoing.1060.b.failure:0 "[offended_character.GetFirstNameNoTooltip] vê através da sua mentira"
 study_faith_ongoing.1060.b.success:0 "Você engana [offended_character.GetHerHim] fazendo-o(a) pensar que você #EMP lisonjeou#! [offended_character.GetHerHis] [offended_character.GetFaith.PriestNeuterPlural]"
 study_faith_ongoing.1060.b:0 "Meu objetivo era exaltar as virtudes de [offended_character.GetFaith.PriestNeuter]!"
 study_faith_ongoing.1060.c:0 "Sabe de uma coisa!? [offended_character.GetFaith.HighGodName] é #EMP [offended_character.Custom2('InsultAdjective', ROOT.Char)]!#!"
 study_faith_ongoing.1060.d.failure:0 "[offended_character.GetFirstNameNoTooltip] não acredita em você"
 study_faith_ongoing.1060.d.success:0 "Você explica com sucesso que foi um mal-entendido"
 study_faith_ongoing.1060.d:0 "Eu só esperava compreender melhor [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]!"
 study_faith_ongoing.1060.desc:0 "Como um teste do meu progresso, tento resumir uma passagem de [scheme.GetTargetCharacter.GetFaith.ReligiousText|U] para o(a) meu(minha) [scheme.GetTargetCharacter.GetFaith.GetAdjective] [ROOT.Char.Custom2('RelationToMeShort', offended_character)] [offended_character.GetTitledFirstName] #EMP \"...o(a) [offended_character.GetFaith.PriestNeuter] deve levantar o(a) [target.Custom('GetAccessory')] para que [target.Custom('FormOfAddressForLiege')] possa colher o(a) [target.GetCurrentLocation.Custom('get_region_flower_type')]-\"#!.\n\n\"Sua interpretação não faz o menor sentido! Ela faz o(a) meu(minha) [offended_character.GetFaith.PriestNeuterPlural] parecer [offended_character.Custom2('InsultAdjective', SCOPE.sC('offended_character'))] e [offended_character.GetFaith.HighGodName] um(a) [offended_character.Custom2('InsultNounSexual', SCOPE.sC('offended_character'))]!?\".\n\nTalvez minha compreensão dos pontos mais sutis da prática de [scheme.GetTargetCharacter.GetFaith.GetAdjective] ainda deixe a desejar..."
 study_faith_ongoing.1060.t:0 "$study_faith$: Uma Interpretação Ignorante"
 study_faith_ongoing.1070.a:0 "Guardas, livrem-me deste livro amaldiçoado!"
 study_faith_ongoing.1070.b:0 "Ousa rir de mim!? #EMP Açoitai todos eles.#!"
 study_faith_ongoing.1070.c:0 "Ora, suponho que #EMP seja#! educativo, de certa forma..."
 study_faith_ongoing.1070.desc:0 "[target.GetTitledFirstNamePossessive] presente de textos mitológicos de [scheme.GetTargetCharacter.GetFaith.GetAdjective] deixou a corte agitada. Muitos observam enquanto os examinei atentamente, lendo em voz alta as passagens mais interessantes.\n\nA princípio, presumo que [ROOT.Char.GetFaith.EvilGodNames] esteja me fazendo peças sórdidas, mas após uma investigação minuciosa de certas passagens instigantes, fica claro que deve se tratar de um texto de natureza erótica.\n\nO que referências a [scheme.GetTargetCharacter.GetFaith.FertilityGodNamePossessive] [ROOT.Char.Custom('ObjectifiedFeature')] estão fazendo em um texto sagrado?! [ROOT.Char.Custom('CulturalCurse')|U]."
 study_faith_ongoing.1070.t:0 "$study_faith$: Mitos Sórdidos"
 study_faith_ongoing.1080.a:0 "[court_tutor.GetFirstNameNoTooltip], você merece uma recompensa!"
 study_faith_ongoing.1080.b:0 "[court_tutor.GetSheHe|U] está fazendo [court_tutor.GetHerHis] trabalho muito bem."
 study_faith_ongoing.1080.desc:0 "Meu/Minha [ROOT.Char.Custom2('RelationToMeShort', court_tutor)] [court_tutor.GetFirstName] tem sido incansável em auxiliar meus esforços para compreender os detalhes mais refinados de [scheme.GetTargetCharacter.GetFaith.GetName].\n\n[court_tutor.GetHerHis|U] dedicação à arte de ensinar é inspiradora! [court_tutor.GetSheHe] sempre tem um texto [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip] à mão ou me encontra um [scheme.GetTargetCharacter.GetFaith.PriestNeuter] letrado para conversar.\n\nVerdadeiramente, minha compreensão não teria chegado tão longe sem a ajuda de [court_tutor.GetHerHis]."
 study_faith_ongoing.1080.t:0 "$study_faith$: Um Ótimo Tutor"
 study_faith_ongoing.1090.a:0 "Eu sempre posso contar com a orientação de [helpful_friend.GetFirstNameNoTooltip]!"
 study_faith_ongoing.1090.b:0 "Não importa o quão estranho isso pareça, devo perseverar!"
 study_faith_ongoing.1090.c:0 "Eu só preciso largar os livros por um tempo..."
 study_faith_ongoing.1090.d:0 "Isto não tem jeito!"
 study_faith_ongoing.1090.desc.intro:0 "A teologia por trás de [scheme.GetTargetCharacter.GetFaith.GetName] é impossível de entender!"
 study_faith_ongoing.1090.desc.main:0 "\n\nMinha cabeça está cheia! Assim que um conceito entra, outro é empurrado para o abismo do esquecimento."
 study_faith_ongoing.1090.doctrine.desc:0 "Em particular, [discovered_doctrine.GetName( scheme.GetOwner.GetFaith.Self )] me escapa completamente."
 study_faith_ongoing.1090.friend.desc:0 "\n\n\"Continue assim, meu/minha amigo(a) [ROOT.Char.Custom('ComplimentAdjective')]. Eu acredito em você!\"\n\nFelizmente, [helpful_friend.GetTitledFirstName] está sempre lá para ajudar a desembaraçar esses ensinamentos desconhecidos. Sou realmente abençoado(a)."
 study_faith_ongoing.1090.no_friend.desc:0 "\n\nTalvez eu precise de uma pausa?"
 study_faith_ongoing.1090.t:0 "$study_faith$: Incompreensível!"
 study_faith_ongoing.1090.tenet.desc:0 "Em particular, a crença de [discovered_tenet.GetName( scheme.GetOwner.GetFaith.Self )] me escapa completamente."
 study_faith_ongoing.1100.a.failure:0 "Você se faz de tolo(a)"
 study_faith_ongoing.1100.a.success.tt:0 "Cada cortesão ou convido de [root_scope.GetFaith.GetNameNoTooltip] ou [target.GetFaith.GetNameNoTooltip]"
 study_faith_ongoing.1100.a.success:0 "Você faz um discurso fantástico"
 study_faith_ongoing.1100.a:0 "Um discurso inteligente poderia apaziguar meu povo e os [target.GetFaith.GetAdherentNamePluralNoTooltip]!"
 study_faith_ongoing.1100.b:0 "Meus estudos são da minha conta. Sem distrações!"
 study_faith_ongoing.1100.c:0 "Certamente, [scheme.GetTargetCharacter.GetTitledFirstNameNoTooltip] ficará impressionado(a)!"
 study_faith_ongoing.1100.desc:0 "Palavras se espalharam sobre meu estudo diligente de [scheme.GetTargetCharacter.GetFaith.GetName].\n\nEles estão se referindo a mim como 'o/a [target.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]', um título que pode causar confusão..."
 study_faith_ongoing.1100.t:0 "$study_faith$: O/A [target.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]"
 study_faith_ongoing.1110.a.failure:0 "Suas tentativas na poesia são lamentáveis"
 study_faith_ongoing.1110.a.success:0 "Você descobre ter jeito para a poesia"
 study_faith_ongoing.1110.a:0 "Vou tentar minha sorte com o verso [target.GetFaith.GetAdjectiveNoTooltip]!"
 study_faith_ongoing.1110.b:0 "Devo recitar um poema romântico #EMP #! para meu/minha [ROOT.Char.Custom2('RelationToMeShort', lover_to_be)] [lover_to_be.GetFirstNameNoTooltip]?"
 study_faith_ongoing.1110.c:0 "Analiso o poema por suas qualidades religiosas."
 study_faith_ongoing.1110.desc:0 "Ah, '[poet_location.Custom('RoamingLegendaryBeastProvinceWeather')|U] de [poet_location.Custom('GetTerrainTypePlural')|U]' por [the_poet.GetFirstName] de [poet_location.GetCounty.GetName]. Verdadeiramente uma grande coleção de poesia [scheme.GetTargetCharacter.GetFaith.GetAdjective]!\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\nSerá que a poesia é uma janela para a fé?"
 study_faith_ongoing.1110.t:0 "$study_faith$: O Charme da Poesia [target.GetFaith.GetAdjectiveNoTooltip]"
 study_faith_ongoing.1120.a.failure:0 "Seu gosto por leituras heréticas torna-se de conhecimento geral"
 study_faith_ongoing.1120.a.success:0 "Você engana [zealot.GetFirstNameNoTooltip]"
 study_faith_ongoing.1120.a:0 "Não! Estes são...#EMP veneráveis tratados teológicos [target.GetFaith.GetAdjectiveNoTooltip]!#!"
 study_faith_ongoing.1120.b.tt:0 "#V Duelo#! [zealot.GetFirstName] para punir [zealot.GetHerHim] por [zealot.GetHerHis] insolência!\n#weak Este duelo NÃO é até a morte.#!\nSe vencer, você ganhará [prestige_i] [prestige|E] e um [modifier|E] para o [scheme|E]. Se perder, será ridicularizado(a).\n\nSeu [prowess|E]: [prowess_i]#V [root_for_loc.GetProwess]#!\n[zealot.GetFirstNamePossessive] [prowess|E]: [prowess_i]#V [zealot.GetProwess]#!"
 study_faith_ongoing.1120.b:0 "Ousa me acusar de heresia!? Vou te mostrar!"
 study_faith_ongoing.1120.c:0 "Você tem razão. Tais textos não são adequados para um(a) [ROOT.Char.GetTitleTierName]."
 study_faith_ongoing.1120.d:0 "Que o povo pense o que quiser. Estes escritos são esclarecedores!"
 study_faith_ongoing.1120.desc:0 "#EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!\n\n\"O/A [ROOT.Char.GetTitleTierName], estudando fábulas de uma fé estrangeira? Não tens vergonha!?\" meu/minha [ROOT.Char.Custom2('RelationToMeShort', zealot)] [zealot.GetTitledFirstName] exclama.\n\n\"Se seus inimigos souberem que fraterniza com ideias heréticas, farão tudo ao alcance para pintá-lo(a) como herege!\"\n\nTalvez minha escolha de escritos [scheme.GetTargetCharacter.GetFaith.GetAdjective] possa ser mal interpretada por cretinos e inimigos na [ROOT.Char.Custom('GetCourt')]."
 study_faith_ongoing.1120.t:0 "$study_faith$: Contos Heréticos"
 study_faith_ongoing.1121.trigger_failure:0 "Meu duelo contra [zealot.GetFirstNameNoTooltip] foi invalidado"
 study_faith_ongoing.1123.a:0 "Como o sábio [ROOT.Char.Custom('GetAnimalType')|U] disse certa vez: \"Não insulte seus superiores!\""
 study_faith_ongoing.1123.b:0 "Você apodrecerá na masmorra por sua insolência!"
 study_faith_ongoing.1123.desc:0 "\"Eu me rendo! Por favor, me perdoe, você não é fraco(a) da cabeça! Apenas me poupe!\" [zealot.GetTitledFirstName] exclama.\n\nIsso vai ensinar a [zealot.GetHerHim] a me insultar #EMP #!."
 study_faith_ongoing.1123.t:0 "$study_faith_ongoing.1120.t$"
 study_faith_ongoing.1124.a:0 "Um revés em meus estudos..."
 study_faith_ongoing.1124.desc:0 "[zealot.GetTitledFirstName] cospe perto de onde você jaz no chão.\n\n\"Você é uma desculpa fraca e patética para um(a) [ROOT.Char.GetTitleTierName]. Agora lhe farei um favor e me livrarei desses livros inanizados.\" [zealot.GetSheHe] diz."
 study_faith_ongoing.1124.t:0 "$study_faith_ongoing.1120.t$"
 study_faith_ongoing.1130.a.failure.toast:0 "A assistência de [lover_to_help.GetFirstNameNoTooltip] é paqueradora demais para ser útil."
 study_faith_ongoing.1130.a.failure:0 "[lover_to_help.GetFirstNameNoTooltip] foca suas lições em elementos de teologia tão nichados e sensuais que você não consegue ver como são compatíveis com a fé como um todo"
 study_faith_ongoing.1130.a.success:0 "[lover_to_help.GetFirstNameNoTooltip] é um(a) bom/boa professor(a), ainda que paquerador(a)"
 study_faith_ongoing.1130.a:0 "Aceitarei toda a ajuda que puder conseguir!"
 study_faith_ongoing.1130.b:0 "Consigo pensar em uma maneira muito agradável."
 study_faith_ongoing.1130.c:0 "Eu preferiria estudar sozinho(a)."
 study_faith_ongoing.1130.desc:0 "\"Oh, meu/minha querido(a) [ROOT.Char.GetFirstNameNoTooltip]! Você realmente está aprendendo sobre meu/minha amado(a) [scheme.GetTargetCharacter.GetFaith.GetName]? Agradeço por fazer tanto esforço para me entender!\" [lover_to_help.GetTitledFirstName] diz, [lover_to_help.Custom('quirk_pos_pp')].\n\n\"Será um prazer ajudar de #EMP qualquer#! maneira possível.\""
 study_faith_ongoing.1130.t:0 "$study_faith$: Prazeres da Fé"
 study_faith_ongoing.1140.a:0 "Poderia me ajudar a entender este princípio?"
 study_faith_ongoing.1140.b:0 "Gostaria de se juntar às minhas sessões de estudo?"
 study_faith_ongoing.1140.desc:0 "\"Elogio você por aprender mais sobre [scheme.GetTargetCharacter.GetFaith.GetName], com certeza isso fortalecerá sua posição como [ROOT.Char.GetTitleTierName]!\" meu/minha [SCOPE.sC('root_for_loc').Custom2('RelationToMeShort', SCOPE.sC('close_one_to_help'))] [close_one_to_help.GetFirstName] exclama.\n\n\"Conheço os caminhos de [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip] desde o nascimento. Talvez eu possa ser de ajuda, [SCOPE.sC('close_one_to_help').Custom2('RelationToMeShort', SCOPE.sC('root_for_loc'))]?\""
 study_faith_ongoing.1140.t:0 "$study_faith$: Uma Mão Guiadora"
 study_faith_ongoing.1200.a:0 "Eu não consigo ficar com raiva de você!"
 study_faith_ongoing.1200.b:0 "Quer dar uma caminhada? Vamos então."
 study_faith_ongoing.1200.c:0 "Isso não é um brinquedo! #EMP Cão#! mau!"
 study_faith_ongoing.1200.desc:0 "Em meus esforços para aprender os mistérios de [scheme.GetTargetCharacter.GetFaith.GetName], mantenho uma coleção organizada de anotações. Realmente é meu único meio de gerenciar o caos de outro sistema de crenças. Infelizmente, parece que elas sumiram.\n\nO focinho molhado e familiar de [ROOT.Char.Custom('DogStoryName')] fareja minha mão. Olho para o meu querido cão, esperando um respiro da minha frustração.\n\nOlhando para cima, [ROOT.Char.Custom('DogStorySheHe')] abana a cauda[ROOT.Char.Custom('DogStoryHerHis')] com orgulho. É só então que percebo que [ROOT.Char.Custom('DogStorySheHe')] está com minhas anotações firmemente presas entre os dentes[ROOT.Char.Custom('DogStoryHerHis')]..."
 study_faith_ongoing.1200.t:0 "$study_faith$: Um Cão Herético"
 study_faith_ongoing.1300.a.flavor:0 "É apenas um pequeno ritual [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip], que mal poderia haver?"
 study_faith_ongoing.1300.a:0 "Mostre-me o caminho!"
 study_faith_ongoing.1300.b.failure:0 "Você falha em se comunicar com [interlocutor.GetFirstNameNoTooltip]"
 study_faith_ongoing.1300.b.flavor:0 "Você tenta envolver [interlocutor.GetFirstNameNoTooltip] em um debate amistoso"
 study_faith_ongoing.1300.b.success:0 "Você tem um debate envolvente com [interlocutor.GetFirstNameNoTooltip]"
 study_faith_ongoing.1300.b:0 "Debater os detalhes da fé [interlocutor.GetHerHis] certamente será o mais instrutivo."
 study_faith_ongoing.1300.c:0 "\"Junte-se a nós em nossa jornada para [next_destination.GetNameNoTooltip]!\""
 study_faith_ongoing.1300.desc:0 "Enquanto passamos por [ROOT.Char.GetCurrentLocation.GetTitle.GetName], os locais parecem engajados em uma celebração [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip]. Um[interlocutor.GetWomanMan] se aproxima de nós e nos convida a participar, embora sejamos [ROOT.Char.GetFaith.GetAdherentNamePlural].\n\nMeu grupo tenta se meter entre nós, receoso de que possa ser uma armadilha.\n\nQue o perigo se dane. Mal consigo imaginar uma oportunidade melhor para aprender em primeira mão sobre [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]!"
 study_faith_ongoing.1300.t:0 "$study_faith$: Aprender Fazendo"
 study_faith_outcome.0010.a:0 "Deixe-me estudar [target.GetNameNoTooltip] com você."
 study_faith_outcome.0010.b.desc:0 "[study_faith_target.GetShortUIName] será liberto, para viver [study_faith_target.GetHerHis] vida como [study_faith_target.GetSheHe] bem entender"
 study_faith_outcome.0010.b:0 "Eu mudei de ideia."
 study_faith_outcome.0010.d.intimidated:0 "\"O que mandaria eu fazer, meu [ROOT.Char.GetTitleAsName]?\" [study_faith_target.GetSheHe] pergunta, tremendo. Os guardas encaram [study_faith_target.GetHerHim] com suspeita, prontos para agir ao primeiro sinal de bruxaria."
 study_faith_outcome.0010.d.safe:0 "\"Como posso ser útil, meu [ROOT.Char.GetTitleAsName]?\" [study_faith_target.GetSheHe] pergunta, ligeiramente intimidado. Meus guardas não podem deixar de olhar para [study_faith_target.GetHerHim] com curiosidade, cientes dos boatos sobre minha busca."
 study_faith_outcome.0010.desc.in_realm:0 "Não faz muito tempo desde que pedi para conhecer um [target.GetAdherentName] do meu domínio. Agora [study_faith_target.GetShortUIName] está diante de mim, respondendo ao chamado.\n\n"
 study_faith_outcome.0010.desc:0 "Minhas investigações discretas e pequenas subornos valeram a pena! Agora [study_faith_target.GetShortUIName] está diante de mim, supostamente um[target.GetAdherentName].\n\n"
 study_faith_outcome.0010.t:0 "[target.GetAdherentNameNoTooltip] Encontrado!"
 study_faith_outcome.0101.a:0 "É hora de me comprometer com a conversão."
 study_faith_outcome.0101.b:0 "Eu não posso abandonar [ROOT.Char.GetFaith.GoodGodNames]!"
 study_faith_outcome.0101.desc:0 "O estudo árduo de [actor.GetRite.GetName] me levou a compreender melhor meu[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))] [actor.GetName] e, acima de tudo, como trilhar o caminho de [actor.GetFaith.GoodGodNames]."
 study_faith_outcome.0101.t:0 "Aparamentado com [actor.GetFaith.HighGodName]"
 study_faith_outcome.0102.a:0 "Foi apenas o correto a fazer."
 study_faith_outcome.0102.desc:0 "Agradeço pela sua paciência e generosidade em me guiar através da minha ignorância. Agora sigo o caminho de [actor.GetFaith.GoodGodNames]."
 study_faith_outcome.0103.a:0 "Há um preço para a insubordinação..."
 study_faith_outcome.0103.desc:0 "Minha lealdade está com [recipient.GetFaith.GoodGodNames]! Não serei forçado a renunciar a [recipient.GetRite.GetName]."
 study_faith_outcome.0111.a:0 "Talvez a compreensão venha com a conversão..."
 study_faith_outcome.0111.b:0 "Vou redobrar meus esforços"
 study_faith_outcome.0111.c:0 "$study_faith_outcome.0101.b$"
 study_faith_outcome.0111.desc:0 "O estudo árduo de [actor.GetRite.GetName] não me levou a lugar nenhum! Não apenas luto para seguir o caminho de [actor.GetFaith.GoodGodNames], mas temo que [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))] [actor.GetFirstNamePossessive] possa estar errado em [actor.GetHerHis] convicções."
 study_faith_outcome.0111.t:0 "Lutando para Compreender [actor.GetRite.GetNameNoTooltip]"
 study_faith_outcome.1000.a:0 "Posso aprender quase qualquer prática de qualquer fé!"
 study_faith_outcome.1000.b:0 "O rito de [scheme.GetTargetCharacter.GetRite.GetNameNoTooltip] faz mais sentido para mim do que meus próprios caminhos..."
 study_faith_outcome.1000.desc:0 "Após todo o meu trabalho duro, as peças finalmente se encaixaram. Horas sem fim debruçado sobre livros, noites sem dormir ensaiando os rituais, incontáveis lições de teologia [target.GetFaith.GetAdjective] — juntas, elas finalmente convergem para uma clara compreensão do rito [target.GetRite.GetAdjective].\n\nDurante meus esforços, busquei emular [target.GetTitledFirstName], mas agora acho que estou começando a entender como [target.GetSheHe] pode se sentir confortável no \"caloroso abraço\" do rito [target.GetRite.GetName]."
 study_faith_outcome.1000.t:0 "$study_faith$: Um Avanço"
 study_faith_outcome.1200.a:0 "Anseio por saber mais sobre estas práticas [target.GetRite.GetAdjectiveNoTooltip]!"
 study_faith_outcome.1200.b:0 "Fascinante. Me pergunto como isso se relaciona com [additional_discovered_doctrine.GetDescriptiveNameNoTooltip( target.GetFaith )]!"
 study_faith_outcome.1200.c:0 "Isto está me deixando desconfortável..."
 study_faith_outcome.1200.desc:0 "As paredes familiares do meu escritório testemunham uma vitória silenciosa enquanto compreendo o valor [target.GetRite.GetAdjective] de [discovered_tenet.GetName( target.GetRite )]. Por mais estranho que seja, com alguma imaginação consigo visualizar parentes de [target.GetTitledFirstName] e [target.GetHerHis] participando desta prática alienígena.\n\nÉ apenas um passo em uma longa estrada — contudo, minha jornada pelo rito [target.GetRite.GetNameNoTooltip] avança mesmo assim."
 study_faith_outcome.1200.t:0 "$study_faith$: Um Princípio Vem a Foco"
 study_faith_outcome.1400.a:0 "Conhecimento útil. Avante."
 study_faith_outcome.1400.alt1.desc:0 "\n\nPor sua vez, isto iluminou a nuance na prática deles de [third_discovered_doctrine.GetDescriptiveName( scheme.GetOwner.GetFaith.Self )]!"
 study_faith_outcome.1400.alt2.desc:0 "\n\nÉ apenas uma peça de um quebra-cabeça muito maior, mas cada peça me traz um pouco mais perto de compreender o rito [target.GetRite.GetNameNoTooltip] como um todo."
 study_faith_outcome.1400.b:0 "Vou queimar as pestanas à luz de velas."
 study_faith_outcome.1400.c:0 "Deixe-me pressionar [target.GetShortUINameNoTooltip] por mais."
 study_faith_outcome.1400.desc:0 "Para compreender o rito [target.GetRite.GetName], deve-se estudar não apenas sua estrutura metafísica, mas também sua influência mundana na vida cotidiana.\n\nApós refletir sobre o conceito de [discovered_doctrine.GetDescriptiveName( scheme.GetOwner.GetFaith.Self )], compreendi o suficiente de suas implicações para vincular o conceito de volta às práticas de [target.GetRite.GetNameNoTooltip] como um todo."
 study_faith_outcome.1400.t:0 "$study_faith$: Costumes de [target.GetRite.GetNameNoTooltip]"
 study_faith_outcome.1500.a:0 "Aprendi o que pude."
 study_faith_outcome.1500.desc:0 "Longo estudo me trouxe ao limite do que um forasteiro pode entender. Os mistérios [target.GetRite.GetAdjective] restantes pertencem àqueles nascidos no rito — passados, por via das regras, àqueles que vivem a vida sob suas restrições, ausentes de qualquer texto e indefiníveis mesmo para o observador paciente.\n\nEu sei tudo o que um forasteiro pode saber."
 study_faith_outcome.1500.t:0 "$study_faith$: Fora do Meu Alcance"
 study_faith_outcome.1500.toast.desc:0 "Você aprendeu todo [core_tenet|E] e [doctrine|E] do [target.GetRite.GetName] [rite|E] que um forasteiro pode conhecer."
 study_faith_outcome.1500.toast:0 "$study_faith$ Concluído"
 study_faith_outcome.3000.a:0 "[potential_continuation_target_1.GetTitledFirstNameNoTooltip] é um adorador ardente!"
 study_faith_outcome.3000.alt1.desc:0 "Infelizmente, [target.GetTitledFirstName] não foi a melhor escolha para orientação nos detalhes refinados de [target.GetFaith.GetName].\n\nDito isto, não há necessidade de encurtar meus estudos — preciso apenas encontrar outra pessoa para emular!"
 study_faith_outcome.3000.b:0 "Talvez [potential_continuation_target_2.GetTitledFirstNameNoTooltip]? A teologia de [potential_continuation_target_2.GetHerHis|U] é interessante."
 study_faith_outcome.3000.c:0 "Talvez [potential_continuation_target_3.GetTitledFirstNameNoTooltip]?"
 study_faith_outcome.3000.d:0 "Ah, eu estava procurando um motivo para parar de estudar! Que maravilha!"
 study_faith_outcome.3000.desc:0 "Infelizmente, [target.GetTitledFirstName] não está mais por perto. É uma pena, eu estava procurando por [target.GetHerHim] em busca de orientação sobre os detalhes mais refinados de [target.GetFaith.GetName].\n\nDito isso, não preciso interromper meus estudos — só preciso encontrar outra pessoa para emular!"
 study_faith_outcome.3000.t:0 "$study_faith$: Retomar os Estudos?"
 study_faith_scheme_retains_progress:0 "O [scheme|E] retém todo o progresso anterior"
 study_faith_scheme_stays_active:0 "O [scheme|E] permanece ativo"
