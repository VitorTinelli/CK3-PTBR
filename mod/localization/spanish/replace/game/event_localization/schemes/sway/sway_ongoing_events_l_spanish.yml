l_spanish:
 sway_ongoing.1001.a:0 "O povo [target.GetCulture.GetCollectiveNounNoTooltip] é bom."
 sway_ongoing.1001.b:0 "Os [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] possuem uma fibra moral superior!"
 sway_ongoing.1001.desc:0 "Um plebeu de origem [target.GetCulture.GetNameNoTooltip] foi abordado nas ruas de [capital.GetNameNoTooltip] por causa de uma pequena ofensa.\n\nAo tomar uma posição em sua defesa, posso convencer [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], igualmente [target.GetCulture.GetNameNoTooltip], de minha boa índole, mas também posso correr o risco de alienar meus pares [ROOT.Char.GetCulture.GetNameNoTooltip]..."
 sway_ongoing.1001.t:0 "Influenciar: Cultura de [target.GetCulture.GetNameNoTooltip]"
 sway_ongoing.1002.b:0 "Vou ser breve e profissional."
 sway_ongoing.1002.desc:0 "Para tornar [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] mais suscetível às minhas tentativas de aproximação, posso incluir um elogio em minha próxima mensagem para a corte [target.GetHerHim].\n\nEu certamente mencionarei seu(a)..."
 sway_ongoing.1002.success.tt:0 "À discrição de [friend.GetTitledFirstNameNoTooltip]:"
 sway_ongoing.1002.t:0 "Influenciar: Elogios"
 sway_ongoing.1003.a:0 "Excelente!"
 sway_ongoing.1003.desc:0 "Nossa recente correspondência tem sido uma fonte de alegria para mim. Não posso deixar de pensar que ambos podemos nos beneficiar de uma comunicação mais frequente."
 sway_ongoing.1003.opening:0 "[target.Custom2('AppropriateGreeting', ROOT.Char)]"
 sway_ongoing.1004.a:0 "Oh, não..."
 sway_ongoing.1004.desc:0 "Nossa recente correspondência deixou muito a desejar. Por favor, evite comentários pessoais no futuro."
 sway_ongoing.1005.a:0 "[target.GetTitledFirstNameNoTooltip], sem dúvida!"
 sway_ongoing.1005.b:0 "Bem, eu, é claro!"
 sway_ongoing.1005.desc:0 "Enquanto hospedo senhores e damas de reinos próximos e distantes, algumas oportunidades de retratar [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] sob uma boa luz têm se apresentado.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], diga-me, quem é a pessoa mais [target.Custom('FormalComplimentAdjective')] que você já ouviu falar?\""
 sway_ongoing.1005.t:0 "Influenciar: [Select_CString( target.IsFemale, 'A Boa', 'O Bom' )] [target.GetTitleAsNameNoTooltip]"
 sway_ongoing.1006.a:0 "\"Leve esse ouro e certifique-se de que sua voz seja ouvida.\""
 sway_ongoing.1006.b:0 "Não vale a pena."
 sway_ongoing.1006.desc:0 "Chamou minha atenção que alguns plebeus locais estão se mudando para [capital.GetNameNoTooltip], a capital de [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)].\n\nLocais, recém-chegados ou não, elogiando-me certamente não fará mal à percepção que [target.GetSheHe] tem de mim..."
 sway_ongoing.1006.t:0 "Influenciar: Infiltradores"
 sway_ongoing.5001.a.tt:0 "Incluirei sutilmente esse tópico em cartas futuras"
 sway_ongoing.5001.b:0 "Não é da minha conta."
 sway_ongoing.5001.desc:0 "Em nossa comunicação recente, [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] expressou o desejo de focar mais em sua ambições e interesses.\n\nEu #EMP poderia#! garantir que nossas próximas cartas contenham mais sobre um tópico próximo ao coração [target.GetHerHim]..."
 sway_ongoing.5001.diplomacy_lifestyle:0 "Acredito que [target.GetSheHe] gosta de se concentrar em questões diplomáticas."
 sway_ongoing.5001.intrigue_lifestyle:0 "[target.GetSheHe|U] certamente aprecia subterfúgio e intriga."
 sway_ongoing.5001.learning_lifestyle:0 "Acredito que nada atrai [target.GetSheHe] mais do que um bom livro!"
 sway_ongoing.5001.martial_lifestyle:0 "Ouvi dizer que [target.GetSheHe] aprecia feitos de guerra."
 sway_ongoing.5001.stewardship_lifestyle:0 "Certamente o governo de um reino interessa a [target.GetSheHe]."
 sway_ongoing.5001.t:0 "Influenciar: Tornando Pessoal"
 sway_ongoing.5002.a:0 "Vamos falar mais sobre isso!"
 sway_ongoing.5002.b.tt:0 "Acho que vou agradar [owner.GetSheHe]..."
 sway_ongoing.5002.b:0 "Oh, #EMP por favor#! me conte mais!"
 sway_ongoing.5002.c:0 "Eu agradeceria se mantivéssemos tópicos relevantes."
 sway_ongoing.5002.desc_diplomacy:0 "uma conversa recente que [owner.GetSheHe] teve"
 sway_ongoing.5002.desc_ending:0 "\n\nEssas cartas deveriam ser estritamente diplomáticas, mas, é claro, às vezes mergulhamos em tópicos mais pessoais..."
 sway_ongoing.5002.desc_failure:0 "– como se o assunto fosse me interessar!"
 sway_ongoing.5002.desc_fallback:0 "um assunto não relacionado à nossa conversa"
 sway_ongoing.5002.desc_intrigue:0 "as sutilezas da intriga na corte"
 sway_ongoing.5002.desc_learning:0 "um livro que [owner.GetSheHe] leu recentemente"
 sway_ongoing.5002.desc_martial:0 "o estado das tropas [owner.GetHerHim]"
 sway_ongoing.5002.desc_opening:0 "Em nossa última correspondência, [owner.Custom2('MyCharacterIntroductionNoComma', target)] mencionou casualmente"
 sway_ongoing.5002.desc_stewardship:0 "a administração do reino [owner.GetHerHim]"
 sway_ongoing.5002.desc_success:0 "– Eu não sabia que [owner.GetSheHe] também se interessava pelo assunto!"
 sway_ongoing.5002.t:0 "Tornando Pessoal"
 sway_ongoing.5003.a:0 "Vamos falar mais!"
 sway_ongoing.5003.b.tt:0 "Espero que [target.GetSheHe] acredite!"
 sway_ongoing.5003.b_diplomacy:0 "\"Então... sobre vassalos, huh?\""
 sway_ongoing.5003.b_intrigue:0 "\"Então... sobre conspirações, huh?\""
 sway_ongoing.5003.b_learning:0 "\"Então... sobre cartas, huh?\""
 sway_ongoing.5003.b_martial:0 "\"Então... sobre espadas, huh?\""
 sway_ongoing.5003.b_stewardship:0 "\"Então... sobre ouro, huh?\""
 sway_ongoing.5003.c:0 "Eu não posso fazer isso!"
 sway_ongoing.5003.desc:0 "\n\nQue prazer, [target.GetSheHe] também se interessa por [owner.Custom('LifestyleFocusTopic')]."
 sway_ongoing.5003.desc_nonsense:0 "\n\nAgora só preciso continuar fingindo que entendo algo sobre [owner.Custom('LifestyleFocusTopic')]..."
 sway_ongoing.5003.desc_opening:0 "Em sua resposta, [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] encorajou minha leve incursão em tópicos mais pessoais!"
 sway_ongoing.5004.a:0 "Valeu a tentativa!"
 sway_ongoing.5004.desc:0 "Em sua resposta, [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] me pediu para parar com minhas perguntas pessoais e focar no tópico em questão.\n\n\"Não aprecio essas tentativas de distração\", disse [target.GetSheHe]."
 sway_ongoing.5004.desc_nonsense:0 "\n\nTalvez seja melhor assim... Eu realmente não sei muito sobre [owner.Custom('LifestyleFocusTopic')]."
 sway_ongoing.5005.a:0 "Que mentiroso! Mas não vou contar, não se preocupe."
 sway_ongoing.5005.desc:0 "Em sua última resposta, [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] confessa que na verdade não sabe nada sobre o tópico de [owner.Custom('LifestyleFocusTopic')] e apenas fingiu por causa da nossa conversa!"
 sway_ongoing.5006.desc:0 "Em sua última resposta, [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] confessa que na verdade não sabe nada sobre o tópico de [target.Custom('LifestyleFocusTopic')] e apenas fingiu por causa da nossa conversa!"
 sway_ongoing.5007.b.tt:0 "Espero que [owner.GetSheHe] acredite!"
 sway_ongoing.5007.desc:0 "A última carta de [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] incluiu um parágrafo inteiro sobre [owner.Custom('LifestyleFocusTopic')]! Eu não fazia ideia de que [owner.GetSheHe] estava tão interessado nesses assuntos...\n\nPode até ter começado como um favor a [owner.GetSheHe], mas agora pode ser tarde demais para voltar atrás..."
 sway_ongoing.5009.a:0 "Aprendi muito mesmo!"
 sway_ongoing.5009.b:0 "Ai, isso dói."
 sway_ongoing.5009.c:0 "Não se preocupe. Não vou contar para ninguém."
 sway_ongoing.5009.desc_owner_discovered:0 "Em correspondência recente, [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] expressou clara desconfiança sobre meu verdadeiro nível de conhecimento em relação a [owner.Custom('LifestyleFocusTopic')].\n\nAo ler a última carta deles, percebo que meu disfarce foi descoberto - [target.GetSheHe] critica a \"evidente falta de compreensão\" e \"vergonhosa demonstração de ignorância\"."
 sway_ongoing.5009.desc_success:0 "Após longas discussões com [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] sobre [owner.Custom('LifestyleFocusTopic')], e a pesquisa que precisei fazer para fingir meu conhecimento, percebo que o assunto não me é mais tão estranho como antes!"
 sway_ongoing.5009.desc_target_discovered:0 "Em correspondência recente, [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] mostrou uma vergonhosa falta de compreensão sobre [owner.Custom('LifestyleFocusTopic')].\n\nE se até eu sei que [target.GetSheHe] está falando bobagem, então é #EMP ruim!#!"
 sway_ongoing.5010.desc_owner_discovered:0 "Em correspondência recente, [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] mostrou uma vergonhosa falta de compreensão sobre [owner.Custom('LifestyleFocusTopic')].\n\nE se até eu sei que [owner.GetSheHe] está falando bobagem, então é #EMP ruim!#!"
 sway_ongoing.5010.desc_success:0 "Após longas discussões com [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] sobre [owner.Custom('LifestyleFocusTopic')], e a pesquisa que precisei fazer para fingir meu conhecimento, percebo que o assunto não me é mais tão estranho como antes!"
 sway_ongoing.5010.desc_target_discovered:0 "Em correspondência recente, [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] expressou clara desconfiança sobre meu verdadeiro nível de conhecimento em relação a [owner.Custom('LifestyleFocusTopic')].\n\nAo ler a última carta deles, percebo que meu disfarce foi descoberto - [owner.GetSheHe] critica a \"evidente falta de compreensão\" e \"vergonhosa demonstração de ignorância\"."
 sway_ongoing.5011.a.tt:0 "Talvez eu possa ajudar [target.GetSheHe] com algo"
 sway_ongoing.5011.a:0 "Eu ficarei por um tempo."
 sway_ongoing.5011.b.tt:0 "Partirei logo pela manhã"
 sway_ongoing.5011.b:0 "Apenas me mostre meus aposentos."
 sway_ongoing.5011.desc:0 "e me oferece um tour. Uma coisa que me chama a atenção é que o local está cheio de projetos inacabados..."
 sway_ongoing.5011.desc_dislike:0 "[target.GetTitledFirstName] me recebe com uma carranca"
 sway_ongoing.5011.desc_friendly:0 "[target.GetTitledFirstName] me recebe de braços abertos"
 sway_ongoing.5011.desc_normal:0 "[target.GetTitledFirstName] me recebe com respeito"
 sway_ongoing.5011.desc_opening:0 "Estou passando por [capital.GetNameNoTooltip], a capital de [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], quando recebo um convite para visitar a(o) [target.Custom('ResidenceBuilding')] [target.GetHerHim].\n\nAo chegar"
 sway_ongoing.5011.t:0 "Persuadir: A Visita"
 sway_ongoing.5012.a.tt:0 "[target.GetTitledFirstName] reagirá à ação que você tomar"
 sway_ongoing.5012.a:0 "Acho que posso ajudar com o salão de jantar."
 sway_ongoing.5012.a_failure:0 "Só faço piorar a situação"
 sway_ongoing.5012.a_success:0 "Tenho sucesso"
 sway_ongoing.5012.a_trait:0 "Vou arrumar o salão de jantar rapidinho."
 sway_ongoing.5012.b.tt:0 "Vou tentar organizar a biblioteca"
 sway_ongoing.5012.b:0 "Os livros... Os pobres livros!"
 sway_ongoing.5012.b_failure:0 "Só faço mais bagunça"
 sway_ongoing.5012.b_success:0 "Tudo está organizado e bem"
 sway_ongoing.5012.b_trait:0 "Vou organizar esses livros..."
 sway_ongoing.5012.c.tt:0 "Devo alertar [target.GetSheHe]"
 sway_ongoing.5012.c:0 "Aquele baú de ouro está #EMP muito#! desprotegido."
 sway_ongoing.5012.c_failure:0 "[target.GetSheHe|U] acha que estou planejando algo"
 sway_ongoing.5012.c_success:0 "[target.GetSheHe|U] leva meu aviso a sério"
 sway_ongoing.5012.d:0 "Vou me retirar para descansar."
 sway_ongoing.5013.c.tt_intrigue:0 "E se algo acontecesse com o ouro [target.GetHerHim]..."
 sway_ongoing.5013.c:0 "Eu sei como fazer [target.GetSheHe] ouvir...!"
 sway_ongoing.5013.d:0 "#EMP Agora#! é hora de dormir."
 sway_ongoing.5013.desc_bad:0 "\n\nAs coisas podem não estar indo muito bem, mas ainda posso ajudar em outras áreas!"
 sway_ongoing.5013.desc_end_bad:0 "\n\nFoi uma jornada turbulenta, mas fiz tudo o que pude para ajudar [target.GetSheHe]."
 sway_ongoing.5013.desc_end_good:0 "\n\nFiz tudo o que estava ao meu alcance para ajudar [target.GetSheHe]."
 sway_ongoing.5013.desc_expansion_failure:0 "Apesar de todos os meus esforços, o salão de jantar de [target.GetTitledFirstName] parece estar em pior estado quando termino do que quando comecei..."
 sway_ongoing.5013.desc_expansion_success:0 "Tudo o que precisava era de um pouco de atenção dedicada - logo tenho o salão de jantar de [target.GetTitledFirstName] bem encaminhado para a conclusão."
 sway_ongoing.5013.desc_gold_failure:0 "Ao tentar explicar os riscos de manter um baú de ouro exposto, vejo os olhos de [target.GetTitledFirstName] se estreitarem.\n\n\"E exatamente #EMP por quê#! você está de olho no meu ouro?\""
 sway_ongoing.5013.desc_gold_success:0 "Ao explicar os riscos de manter um baú de ouro exposto, os olhos de [target.GetTitledFirstName] se abrem em realização.\n\n\"Ah, claro que não deveria estar lá fora! Obrigado, [ROOT.Char.GetTitledFirstNameNoTooltip].\""
 sway_ongoing.5013.desc_good:0 "\n\nAs coisas estão caminhando bem, e há outras áreas onde ainda posso ajudar [target.GetSheHe]."
 sway_ongoing.5013.desc_library_failure:0 "Livros encadernados, documentos soltos, lombadas decoradas... Não importa o quanto eu tente, não consigo encontrar sentido na bagunça que é a biblioteca de [target.GetTitledFirstName]."
 sway_ongoing.5013.desc_library_success:0 "Livros encadernados, documentos soltos, lombadas decoradas... Depois de muita rearrumação, finalmente há alguma ordem no caos que é a biblioteca de [target.GetTitledFirstName]."
 sway_ongoing.5013.desc_opening:0 "Uma biblioteca onde os livros estão empilhados em cantos, projetos de construção inacabados por toda parte - mais notavelmente um salão de jantar inteiro - e um baú de ouro simplesmente parado no meio de um corredor...\n\nA [target.Custom('ResidenceBuilding')] de [target.GetTitledFirstName] está uma bagunça!"
 sway_ongoing.5013.desc_steal_success:0 "\"Meu ouro! Onde foi parar meu ouro?!\"\n\nEncontro um[Select_CString( target.IsFemale, 'a', '' )] [target.GetTitledFirstName] angustiad[Select_CString( target.IsFemale, 'a', 'o' )] parado em um corredor, com o baú vazio à sua frente. \"Oh, [ROOT.Char.GetTitledFirstNameNoTooltip], se ao menos eu tivesse te ouvido!\""
 sway_ongoing.5014.a_bad:0 "Provavelmente é para o melhor."
 sway_ongoing.5014.a_good:0 "Fico feliz por ter ajudado!"
 sway_ongoing.5014.desc_bad:0 "\"[ROOT.Char.GetSheHe|U] realmente bagunçou o lugar\""
 sway_ongoing.5014.desc_ending:0 "\n\n\"#EMP Bem#!.\" Após uma rápida despedida, logo estou na estrada de volta para casa."
 sway_ongoing.5014.desc_failed_but:0 "mas"
 sway_ongoing.5014.desc_failed_dot:0 "–"
 sway_ongoing.5014.desc_failed_expansion:0 "[ROOT.Char.GetSheHe] arruinou meu salão de jantar..."
 sway_ongoing.5014.desc_failed_expansion_gold:0 "[ROOT.Char.GetSheHe] arruinou meu salão de jantar #EMP e#! tentou roubar meu ouro..."
 sway_ongoing.5014.desc_failed_expansion_library:0 "[ROOT.Char.GetSheHe] arruinou minha biblioteca e meu salão de jantar..."
 sway_ongoing.5014.desc_failed_gold:0 "[ROOT.Char.GetSheHe] tentou roubar meu ouro..."
 sway_ongoing.5014.desc_failed_library:0 "[ROOT.Char.GetSheHe] arruinou minha biblioteca..."
 sway_ongoing.5014.desc_failed_library_gold:0 "[ROOT.Char.GetSheHe] arruinou minha biblioteca #EMP e#! tentou roubar meu ouro..."
 sway_ongoing.5014.desc_failed_three:0 "[ROOT.Char.GetSheHe] arruinou minha biblioteca, meu salão de jantar, #EMP e#! [ROOT.Char.GetSheHe] tentou roubar meu ouro...\""
 sway_ongoing.5014.desc_good:0 "\"[ROOT.Char.GetSheHe|U] realmente arrumou o lugar\""
 sway_ongoing.5014.desc_great:0 "\"[ROOT.Char.GetSheHe|U] é incrível, a [target.Custom('ResidenceBuilding')] está como nova...\""
 sway_ongoing.5014.desc_opening:0 "Avisto [target.GetTitledFirstName] na entrada, esperando me ver partir pela manhã. Conforme me aproximo, ouço [target.GetSheHe] murmurando consigo [target.GetHerselfHimself].\n\n"
