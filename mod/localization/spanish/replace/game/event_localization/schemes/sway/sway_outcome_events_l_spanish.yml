l_spanish:
 sway_outcome.1001.a.failure:0 "[target.GetFirstNameNoTooltip] percebeu minha tentativa"
 sway_outcome.1001.a.success:0 "[target.GetFirstNameNoTooltip] está convencid[Select_CString( target.IsFemale, 'a', 'o' )]"
 sway_outcome.1001.a:0 "...eu enfatizo esses interesses compartilhados."
 sway_outcome.1001.b:0 "...eu tento manter a sutileza."
 sway_outcome.1001.desc:0 "Em minhas tentativas de alinhar [target.GetTitledFirstName] aos meus interesses, encontrei uma oportunidade. Acredito que posso argumentar que nossos objetivos são, na verdade, os mesmos. Ao ditar minha próxima carta..."
 sway_outcome.1001.t:0 "Influenciar: Uma Oportunidade"
 sway_outcome.1002.a:0 "Acredito que posso fazer um argumento bastante convincente."
 sway_outcome.1002.b:0 "Talvez eu deva manter as cortesias diplomáticas."
 sway_outcome.1002.other_faith:0 "Tive uma ideia em minhas tentativas de alinhar [target.GetTitledFirstName] aos meus interesses.\n\nTalvez eu possa argumentar que é do interesse de todos os seguidores do [target.GetFaith.GetNamePlural] me apoiar, em vez de qualquer outro governante [ROOT.Char.GetFaith.GetAdjective]?"
 sway_outcome.1002.same_faith:0 "Tive uma ideia em minhas tentativas de alinhar [target.GetTitledFirstName] aos meus interesses.\n\nCom os argumentos certos, talvez eu possa convencer [target.GetHerHim] de que estou agindo não apenas em meu próprio interesse, mas no interesse de [ROOT.Char.GetFaith.HighGodNameAlternate] [ROOT.Char.GetFaith.HighGodHerselfHimself]!"
 sway_outcome.1002.t:0 "Influenciar: Convicções Religiosas"
 sway_outcome.1003.a.failure:0 "[target.GetSheHe|U] fica insultad[Select_CString( target.IsFemale, 'a', 'o' )]"
 sway_outcome.1003.a.success:0 "[target.GetSheHe|U] aprecia o esforço"
 sway_outcome.1003.a:0 "Hora de colocar minhas habilidades diplomáticas à prova!"
 sway_outcome.1003.a_friend:0 "Deixarei que [friend.GetFirstNameNoTooltip] lide com isso."
 sway_outcome.1003.b:0 "Essa vitória é suficiente."
 sway_outcome.1003.desc:0 "Termino de ler a última carta de [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] e sorrio - [target.GetSheHe] parece ter se aproximado de mim finalmente.\n\nEmbora seja um sucesso, sinto vontade de aproveitar essa oportunidade para me aproximar ainda mais..."
 sway_outcome.1003.t:0 "Influenciar: Arriscando a Sorte"
 sway_outcome.2001.a:0 "Tudo isso foi um grande mal-entendido!"
 sway_outcome.2001.end:0 "\n\nNão preciso continuar lendo para entender o ponto."
 sway_outcome.2001.not_interested_friend:0 "\n\n\"Parece que o que você realmente precisa é de um amigo, e temo que eu não possa ser isso para você. No entanto, posso recomendar que você—\""
 sway_outcome.2001.not_interested_horses:0 "\n\n\"Não vou vender meus cavalos de raça pura, não importa quantas cartas de lisonja você envie!\""
 sway_outcome.2001.not_interested_relation:0 "\n\n\"Sou s[Select_CString( target.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))], pelo amor de [target.GetFaith.HighGodNamePossessive]!"
 sway_outcome.2001.not_interested_relics:0 "\n\n\"Não darei a você nenhuma das minhas relíquias, não importa quantas vezes você possa rezar por mim!\""
 sway_outcome.2001.not_interested_romantically:0 "\n\n\"Embora eu esteja lisonjead[Select_CString( target.IsFemale, 'a', 'o' )], acho que seu interesse é inadequado para alguém de sua posição.\""
 sway_outcome.2001.not_interested_toll_exemptions:0 "\n\n\"Não posso conceder isenções de pedágio, não importa o quanto de comércio você prometa!\""
 sway_outcome.2001.opening:0 "Parece que minhas abordagens diplomáticas em relação [Select_CString( target.IsFemale, 'a', 'ao' )] [target.GetTitledFirstName] causaram um grande mal-entendido! Recebi uma carta que deixou claro que [target.GetSheHe] pensa que estive buscando um objetivo completamente diferente..."
 sway_outcome.2001.t:0 "Influenciar: Um Mal-entendido"
 sway_outcome.2002.a:0 "Eu estava apenas tentando causar uma boa impressão..."
 sway_outcome.2002.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] encerrou toda a correspondência com você.\"\n\nVendo meu repentino interesse e a quantidade de correspondência, [target.GetSheHe] parece estar sob a impressão de que estou tramando algo contra [target.GetHerHim]!"
 sway_outcome.2002.t:0 "Influenciar: Conspiração Maliciosa"
