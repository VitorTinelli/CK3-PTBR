l_spanish:
 diplomatic_scheme_lifestyle.1001.a:0 "Mal posso esperar para ler mais dos pensamentos [target.GetHerHim]."
 diplomatic_scheme_lifestyle.1001.b:0 "Tenho uma nova ideia que certamente impressionará [target.GetHerHim]!"
 diplomatic_scheme_lifestyle.1001.desc:0 "No início, eu estava trocando cartas com [target.GetTitledFirstName] como uma forma de conhecer [target.GetSheHe]. No entanto, logo encontramos um ponto em comum e agora estamos enviando páginas inteiras com pensamentos sobre estratégia militar um para o outro!"
 diplomatic_scheme_lifestyle.1001.t:0 "Interesses Estratégicos"
 diplomatic_scheme_lifestyle.3001.a.tt:0 "#F Certamente [target.GetSheHe] vai entender!#!"
 diplomatic_scheme_lifestyle.3001.a:0 "Para conquistar a amizade [target.GetHerHim], primeiro devo conhecer [target.GetSheHe]!"
 diplomatic_scheme_lifestyle.3001.b.tt:0 "#F Preciso repensar minha estratégia.#!"
 diplomatic_scheme_lifestyle.3001.b:0 "Talvez eles estejam certos..."
 diplomatic_scheme_lifestyle.3001.desc:0 "Sei que isso pode não ser bem visto por muitos, mas manter um olhar atento sobre [target.GetTitledFirstName] não pode ser algo ruim. Pelo menos é o que eu digo a mim mesmo enquanto instruo meus agentes a registrarem todos os gostos e desgostos [target.GetHerHim]."
 diplomatic_scheme_lifestyle.3001.t:0 "Conhecendo [target.GetSheHe|U]"
 diplomatic_scheme_lifestyle.3101.a.tt:0 "#F Mas não desisti!#!"
 diplomatic_scheme_lifestyle.3101.a:0 "Vou me afastar por um tempo."
 diplomatic_scheme_lifestyle.3101.b.tt:0 "#F Certamente [target.GetSheHe] não quis dizer isso de verdade.#!"
 diplomatic_scheme_lifestyle.3101.b:0 "Não vou desistir!"
 diplomatic_scheme_lifestyle.3101.c:0 "Se é assim que [ROOT.Char.GetSheHe] se sente, talvez seja melhor encerrar isso."
 diplomatic_scheme_lifestyle.3101.desc_opening_bad:0 "\"Isso precisa parar!\"\n\n[target.GetTitledFirstName] [target.Custom('quirk_neg_present')] antes de continuar, \"Não tenho certeza qual é o seu objetivo, [ROOT.Char.GetFirstNameNoTooltip], mas se for aumentar minha antipatia por você, certamente conseguiu!\""
 diplomatic_scheme_lifestyle.3101.desc_opening_good:0 "\"Embora tudo isso seja bastante lisonjeiro, não tenho certeza de quais são suas intenções.\"\n\n[target.GetTitledFirstName] [target.Custom('quirk_pos_present')] antes de continuar, \"E você está sempre por perto... você poderia me deixar em paz por um tempo?\""
 diplomatic_scheme_lifestyle.3101.t:0 "Confronto"
 diplomatic_scheme_lifestyle.3201.a:0 "Sim! E a maneira como [sacrificial_agent.GetSheHe] sempre [sacrificial_agent.Custom('quirk_neg_present')]... #EMP Ugh#!"
 diplomatic_scheme_lifestyle.3201.b:0 "[sacrificial_agent.GetSheHe|U] é uma pessoa muito [sacrificial_agent.Custom('quirk_pos_adjective')]."
 diplomatic_scheme_lifestyle.3201.desc:0 "\"Aquel[Select_CString( sacrificial_agent.IsFemale, 'a', 'e' )] [sacrificial_agent.Custom2('InsultNoun', ROOT.Char)] [sacrificial_agent.Custom2('InsultAdjective', ROOT.Char)] [sacrificial_agent.GetFirstNameNoTooltip] está sempre espreitando - não encontro alívio algum!\"\n\nEncontrei [target.GetTitledFirstName] no meio de sua fúria, direcionada [Select_CString( sacrificial_agent.IsFemale, 'a minha', 'ao meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sacrificial_agent'))] [sacrificial_agent.GetTitledFirstName]."
 diplomatic_scheme_lifestyle.3201.t:0 "Desprezo"
