l_spanish:
 claim_throne_ongoing.1001.a:0 "É hora de [Select_CString( target.IsFemale, 'uma nova', 'um novo' )] [target.GetTitleAsNameNoTooltip]!"
 claim_throne_ongoing.1001.b:0 "Somente os [ROOT.Char.GetFaith.AltPriestTermPlural] podem interpretar esses sinais."
 claim_throne_ongoing.1001.desc:0 "Certamente não estou sozinho em minha ambição de governar [target_title.GetNameNoTooltip]! Corvos se reúnem nos telhados da [target.Custom('ResidenceBuilding')] de [target.GetTitledFirstNamePossessive], e há algumas noites até as estrelas pareciam cair, por todo [target_title.GetNameNoTierNoTooltip].\n\nTanto camponeses quanto nobres sussurram que isso é um sinal de que [target.GetFirstNameNoTooltip] perdeu o favor dos [ROOT.Char.GetFaith.PantheonTerm]."
 claim_throne_ongoing.1001.t:0 "Presságios Funestos"
 claim_throne_ongoing.1002.a:0 "\"Não se preocupe, meu senhor, cuidarei disso também...\""
 claim_throne_ongoing.1002.b:0 "Isso está se tornando um pouco demais, na verdade."
 claim_throne_ongoing.1002.desc:0 "Minha busca pelo [target_title.GetName] não é impulsionada por uma mera sede de poder, mas porque sou o único capaz de suportar a enorme responsabilidade! Até [target.GetTitledFirstName] parece reconhecer isso, concedendo-me tarefas cada vez mais importantes em serviço ao reino.\n\nEm breve, posso muito bem estar governando o [target_title.GetTierAsNameNoTooltip] de fato..."
 claim_throne_ongoing.1002.t:0 "Autoridade Conquistada"
 claim_throne_ongoing.1003.a:0 "Nada é bom demais para meus futuros servos!"
 claim_throne_ongoing.1003.b:0 "Vou precisar de todo o meu ouro para a iminente luta."
 claim_throne_ongoing.1003.desc:0 "Eu sou muito consciente de que, se eu fosse governar como [target.GetTitleAsName] de [target_title.GetNameNoTier], eu precisaria do apoio dos meus agora colegas vassalos, mais do que [target.GetTitledFirstName] tem atualmente.\n\nDemonstrar o quão generoso eu seria como [target.GetTitleAsName] pode ser muito efetivo."
 claim_throne_ongoing.1003.t:0 "Ganhando Apoio"
 claim_throne_ongoing.1004.a:0 "Castelão, traga-me meu selo de rabanete!"
 claim_throne_ongoing.1004.b:0 "Não, não [ROOT.Char.GetLadyLord] de todos os Rabanetes em [target_title.GetNameNoTierNoTooltip]..."
 claim_throne_ongoing.1004.b_flavor:0 "...mas do mundo!"
 claim_throne_ongoing.1004.desc:0 "Pode parecer que tenho que trabalhar para reivindicar a soberania sobre o [target_title.GetNameNoTier], mas eu já possuo um título de autoridade muito maior.\n\nEu sou [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetLadyLord|U] de Todos os Rabanetes em [target_title.GetNameNoTierNoTooltip]!"
 claim_throne_ongoing.1004.t:0 "Declaração de Soberania"
 claim_throne_ongoing.1005.a:0 "O que... o que eu tenho feito?"
 claim_throne_ongoing.1005.b:0 "Eu não cometo erros. Todos vocês seguirão o documento."
 claim_throne_ongoing.1005.desc:0 "Puni vários servos por uma zombaria, pois se referiram a mim como \"Vossa Senhoridade Rabanete\", mas agora meu Chanceler me mostrou o documento que eu mandei redigir, insistindo nisso.\n\nParece uma piada cruel que o mundo está fazendo comigo, mas, ao mesmo tempo, há uma vaga memória remexendo nas partes nebulosas da minha mente..."
 claim_throne_ongoing.1005.t:0 "[ROOT.Char.GetLadyLord|U] dos Rabanetes"
 claim_throne_ongoing.1006.a:0 "A amizade é a forma mais honrada de lealdade."
 claim_throne_ongoing.1006.b:0 "Gaste seus esforços fazendo os outros saberem o quão adequado eu sou."
 claim_throne_ongoing.1006.desc:0 "Como em muitas outras coisas, m[Select_CString( friend.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))], [friend.GetTitledFirstName], concorda comigo sobre o fato de que [target.GetTitledFirstName] não é adequado para governar [target_title.GetNameNoTier].\n\n\"Posso pensar em candidatos muito melhores,\" [friend.GetSheHe] me diz confidencialmente. \"Diga a palavra, e você terá meu apoio.\""
 claim_throne_ongoing.1006.t:0 "Apoio Firme"
 claim_throne_ongoing.1007.a:0 "Meus $knight_culture_player_plural_no_tooltip_lowercase$ sempre virão em primeiro lugar!"
 claim_throne_ongoing.1007.b:0 "Um $knight_culture_player_no_tooltip_lowercase$ que trai seu senhor não é um $knight_culture_player_no_tooltip_lowercase$ de verdade."
 claim_throne_ongoing.1007.desc:0 "A notícia de minha ambição de assumir o controle de [target_title.GetNameNoTier] começou a se espalhar entre os [GetPlayer.Custom('KnightCulturePluralNoTooltipLowercase')] do reino. O descontentamento cresce entre os soldados, pois muitos acreditam que é hora de uma mudança.\n\nEnquanto essa tensão aumenta, sou abordado por ninguém menos que [scheming_knight.GetTitledFirstName], um dos [GetPlayer.Custom('KnightCulturePluralNoTooltipLowercase')]. \"Nossos guerreiros merecem algo melhor. Prometa a eles um tratamento justo, bem como uma generosa recompensa em ouro, e você terá minha espada.\""
 claim_throne_ongoing.1007.t:0 "Regra da Espada"
 claim_throne_ongoing.1008.a:0 "Exibir publicamente."
 claim_throne_ongoing.1008.b:0 "Compartilhá-la com meus colegas vassalos."
 claim_throne_ongoing.1008.c.tt:0 "Você usa o tempo de forma mais sábia."
 claim_throne_ongoing.1008.c:0 "Não me envolver."
 claim_throne_ongoing.1008.desc:0 "Meus esforços para fortalecer minha reivindicação sobre [target_title.GetName] poderiam talvez ser ajudados por alguma trapaça.\n\nUma carta proclamando que o fim está próximo tem circulado pelos reinos vizinhos ultimamente. Com um pouco de falsificação e paciência, tenho certeza de que poderia redigir uma carta similar proclamando que eu deveria governar no lugar de [target.GetTitledFirstName].\n\nMas como devo usar tal carta?"
 claim_throne_ongoing.1008.t:0 "Enganar a Todos"
 claim_throne_ongoing.1009.a:0 "Isso foi um teste, e todos vocês falharam."
 claim_throne_ongoing.1009.b.duel_failure:0 "Ninguém acredita"
 claim_throne_ongoing.1009.b.duel_success:0 "Você faz um caso convincente"
 claim_throne_ongoing.1009.b:0 "Como você se atreve a me acusar de mentir?"
 claim_throne_ongoing.1009.desc:0 "Parece que [fraud_catcher.GetTitledFirstName] está tentando ganhar fama ao afirmar que minha carta recente é uma mera falsificação e que nenhuma das alegações nela é verdadeira.\n\nE pior, [target.GetTitledFirstName] está acreditando em cada palavra! Será que fui descoberto?"
 claim_throne_ongoing.1009.t:0 "Pego em uma Mentira"
 tooltip.claim_throne_ongoing.1009.b.duel_failure:0 "Você não impressiona ninguém"
 tooltip.claim_throne_ongoing.1009.b.duel_success:0 "Todos eles foram enganados"
