l_spanish:
 claim_throne_invalidate_fallback_tt:0 "Não posso mais reivindicar o trono d[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstNamePossessive]"
 claim_throne_invalidated:0 "Esquema de Reivindicar Trono encerrado"
 claim_throne_outcome.1001.a:0 "Em breve, eu governarei o [target.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
 claim_throne_outcome.1001.b:0 "Talvez eu esteja sendo muito precipitado..."
 claim_throne_outcome.1001.desc:0 "Após todo o meu trabalho árduo, chegou finalmente a hora de apresentar a evidência que \"descobri\", provando que sou o legítimo herdeiro de [target_title.GetName] através de um antigo casamento dinástico.\n\n[target.GetTitledFirstName] não passará de um simples pretensioso enquanto estiver no meu caminho!"
 claim_throne_outcome.1001.t:0 "Reivindicar Trono"
 claim_throne_outcome.1002.desc:0 "Agora tenho evidências quase incontestáveis de que sou descendente de ninguém menos que [ROOT.Char.Custom('ClaimThroneMythicalFounder')] [ROOT.Char.Custom('ClaimThroneMythicalFounderHerselfHimself')]!\n\nMesmo [target.GetTitledFirstName] não pode mais negar a legitimidade da minha reivindicação para governar o [target_title.GetName]."
 claim_throne_outcome.1003.desc:0 "Tenho vários testemunhos que jurarão aos [ROOT.Char.GetFaith.PantheonTerm] que [previous_title_holder.GetTitledFirstName], [Select_CString( previous_title_holder.IsFemale, 'a antiga', 'o antigo' )] [previous_title_holder.GetTitleAsNameNoTooltip] de [target_title.GetNameNoTier], deixou como último desejo que o [target.Custom('RealmType')] seja entregue a mim.\n\nEmbora [target.GetTitledFirstName] provavelmente não reconheça minha reivindicação, não é realmente [target.GetSheHe] que preciso convencer..."
 claim_throne_outcome.2001.a:0 "Nada pode me deter agora!"
 claim_throne_outcome.2001.b:0 "[target.GetFirstNameNoTooltip] pode reclamar o quanto quiser! Isso não muda nada."
 claim_throne_outcome.2001.discovered:0 "\n\nEmbora [target.GetTitledFirstName] acredite que minha reivindicação de antigo casamento dinástico é completamente fabricada, o que importa é que [target.GetSheHe] não pode refutá-la."
 claim_throne_outcome.2001.no_awareness:0 "\n\nEmbora os detalhes exatos do antigo casamento dinástico estejam envoltos nas brumas do tempo, não há razão para duvidar de sua veracidade. Até [target.GetTitledFirstName] deve admitir que minha reivindicação é legítima."
 claim_throne_outcome.2001.opening:0 "Finalmente, ninguém pode duvidar do fato de que tenho uma reivindicação razoável sobre o [target_title.GetName]!"
 claim_throne_outcome.2002.discovered:0 "\n\nEmbora [target.GetTitledFirstName] acredite que a linhagem até [ROOT.Char.Custom('ClaimThroneMythicalFounder')] é totalmente falsa, [target.GetSheHe] não conseguiu refutá-la, e isso é tudo o que importa."
 claim_throne_outcome.2002.no_awareness:0 "\n\nCom uma linhagem traçada até [ROOT.Char.Custom('ClaimThroneMythicalFounder')], quem poderia questionar a razoabilidade da minha reivindicação?"
 claim_throne_outcome.2003.discovered:0 "[target.GetTitledFirstName] condenou publicamente a promessa feita a mim pel[Select_CString( previous_holder.IsFemale, 'a antiga', 'o antigo' )] [previous_holder.GetTitledFirstName] como mentiras desesperadas, mas é a palavra sagrada a meu favor que importa."
 claim_throne_outcome.2003.no_awareness:0 "Com a antiga promessa d[Select_CString( previous_holder.IsFemale, 'a', 'o' )] [previous_holder.GetTitledFirstName] a meu favor e tantas pessoas dispostas a jurar que a testemunharam, não há nada que [target.GetTitledFirstName] possa fazer além de reconhecê-la. [target.GetSheHe|U] pode não desistir do [target.GetTierAsNameNoTooltip] facilmente, mas também não posso ser negado."
 claim_throne_outcome.4001.a:0 "\"Eu apenas queria participar da glória de sua família, meu Senhor Feudal!\""
 claim_throne_outcome.4001.b:0 "Darei o tempo que isso requer."
 claim_throne_outcome.4001.c:0 "Esse jogo que estou jogando é muito perigoso."
 claim_throne_outcome.4001.opening:0 "Minha reivindicação sobre o [target_title.GetName] não convenceu ninguém!"
 claim_throne_outcome.4001.owner_discovered:0 "\n\nPior ainda, [target.GetTitledFirstName] descobriu meus esforços para fabricar registros de casamento entre a dinastia [ROOT.Char.GetDynasty.GetBaseName] e a antiga dinastia governante de [target_title.GetNameNoTierNoTooltip]!"
 claim_throne_outcome.4001.owner_secret:0 "\n\nEmbora os registros de casamento entre a dinastia [ROOT.Char.GetDynasty.GetBaseName] e a antiga dinastia governante de [target_title.GetNameNoTierNoTooltip] tenham sido descartados como imprecisos, pelo menos ninguém descobriu que fui eu quem os criou."
 claim_throne_outcome.4002.a:0 "\"Eu apenas queria participar da glória, meu Senhor Feudal!\""
 claim_throne_outcome.4002.owner_discovered:0 "\n\nFoi muito mais fácil do que eu esperava para [target.GetTitledFirstName] refutar que tenho qualquer relação com o antigo governante, [owner.Custom('ClaimThroneMythicalFounder')]. [target.GetSheHe|U] até sabia que todas as minhas \"evidências\" eram totalmente fabricadas!"
 claim_throne_outcome.4002.owner_secret:0 "\n\nNinguém acredita que eu poderia ser descendente daquele antigo governante, [owner.Custom('ClaimThroneMythicalFounder')], mas pelo menos [target.GetTitledFirstName] parece não saber que todas as minhas \"evidências\" foram totalmente fabricadas desde o início."
 claim_throne_outcome.4003.a:0 "Será que não há ninguém em quem se possa confiar nos dias de hoje?"
 claim_throne_outcome.4003.owner_discovered:0 "\n\nSob pressão d[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName], todos os que juraram que [Select_CString( previous_holder.IsFemale, 'a antiga', 'o antigo' )] [previous_holder.GetTitledFirstName] havia prometido me fazer seu herdeiro, mudaram de ideia de repente! Em vez disso, eles agora afirmam que eu os subornei para fazer isso! Embora seja verdade, é uma absoluta e repugnante traição à lealdade."
 claim_throne_outcome.4003.owner_secret:0 "\n\nSob pressão de [target.GetTitledFirstName], todos os que juraram que [Select_CString( previous_holder.IsFemale, 'a antiga', 'o antigo' )] [previous_holder.GetTitledFirstName] havia prometido me fazer seu herdeiro, recuaram em suas afirmações. No entanto, como [target.GetFirstNameNoTooltip] não me acusou de nada, [target.GetSheHe] deve estar preocupado que possa haver alguma verdade nisso."
 claim_throne_outcome.5001.a:0 "Como se eu fosse entregar meu reino sem lutar!"
 claim_throne_outcome.5001.discovered:0 "\n\nEssas reivindicações são completamente fabricadas, mas há incerteza suficiente para representarem uma ameaça real, caso outras pessoas as apoiem!"
 claim_throne_outcome.5001.distant_relation:0 "\n\nAparentemente, houve um casamento estratégico entre nossas dinastias há algumas gerações, que [owner.GetSheHe] está usando agora em uma disputa de herança."
 claim_throne_outcome.5001.fallback:0 "\n\n[owner.GetFirstNameNoTooltip] se recusa a dizer em que baseia suas reivindicações, mas [owner.GetSheHe] está se recusando a desistir!"
 claim_throne_outcome.5001.mythical_founder:0 "\n\n[owner.GetFirstNameNoTooltip] alega ser descendente de ninguém menos que [owner.Custom('ClaimThroneMythicalFounder')]. [owner.GetSheHe|U] acredita que isso é motivo suficiente para ser nomeado governante do [target_title.GetNameNoTooltip]."
 claim_throne_outcome.5001.opening:0 "M[Select_CString( owner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))], [owner.GetTitledFirstName], reivindicou o [target_title.GetName]!"
 claim_throne_outcome.5001.previous_holder_promise:0 "\n\n[owner.GetFirstNameNoTooltip] afirma que [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [previous_holder.Custom2('RelationToMe', ROOT.Char)] jurou em seu leito de morte que o [target_title.GetTierAsNameNoTooltip] deveria passar para [owner.GetFirstNameNoTooltip]. Infelizmente, [owner.GetSheHe] encontrou várias pessoas que jurarão em nome sagrado que é verdade."
 claim_throne_outcome.5002.a:0 "Será que [owner.GetSheHe] realmente acredita que sairá impune com isso?!"
 claim_throne_outcome.5003.a:0 "[owner.GetSheHe|U] pagará por essa insolência."
 claim_throne_outcome.5003.opening:0 "M[Select_CString( owner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))], [owner.GetTitledFirstName], tentou reivindicar o [target_title.GetName]!"
 claim_throne_outcome.5003.owner_known:0 "\n\nEssas reivindicações são risíveis, é claro, e se essa for a extensão da ameaça de [owner.GetFirstNamePossessiveNoTooltip], tenho poucas razões para me preocupar."
 claim_throne_target_died_tt:0 "[target.GetTitledFirstName] morreu"
 claim_throne_target_lost_titles_tt:0 "[target.GetTitledFirstName] não possui mais títulos"
 claim_throne_target_no_longer_liege_tt:0 "[target.GetTitledFirstName] não é mais [Select_CString( target.IsFemale, 'minha Senhora Feudal', 'meu Senhor Feudal' )]"
 do_not_execute_claim_throne_tooltip:0 "Eu não tento Reivindicar [target.GetPrimaryTitle.GetName]"
