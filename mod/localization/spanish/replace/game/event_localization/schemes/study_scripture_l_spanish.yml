l_spanish:
 GLOSS_EXEGETE:0 "Uma pessoa que pratica a exegese — um especialista ou estudioso hábil em explicar, interpretar ou expor criticamente um texto, especialmente as escrituras religiosas."
 never_study_scripture_again_tt:0 "Você #N nunca#! mais poderá retomar [GetScheme('study_scripture').GetTypeName] [scheme|E]"
 no_change_study_scripture_tt:0 "Seu [GetScheme('study_scripture').GetTypeName] [scheme|E] progride sem modificações"
 pam_ss_conviction_spread_tt:0 "$study_scripture_title$Princípio Pessoal Adotado"
 pam_ss_devotional_book_description:0 "Um volume iluminado de textos sagrados e comentários, copiado e dourado com evidente devoção. Uma fita marca a passagem que seu destinatário mais precisava ler."
 pam_ss_devotional_book_name:0 "Livro Devocional"
 pam_ss_lettered_brother_tt:0 "Um clérigo letrado #EMP #! da ordem se junta à sua [court|E]"
 pam_ss_papabile_tt:0 "Sua [papabile_score|E] para a sucessão papal aumenta em #P +10#!"
 pam_ss_spread_tenet_tt:0 "Sua defesa escrita pode persuadir até #V 3#! [rulers|E] a abraçar [pam_ss_heart_tenet.GetBaseName]"
 piety_gain_high_tt:0 "Grande Ganho de Piedade"
 piety_gain_low_tt:0 "Pequeno Ganho de Piedade"
 scholar_xp_high_tt:0 "Você aprofunda significativamente sua erudição"
 scholar_xp_low_tt:0 "Você aprofunda levemente sua erudição"
 study_scripture_outcome.10.a:0 "Deixe o mundo esperar além da porta do claustro."
 study_scripture_outcome.10.b:0 "O estudo terá suas horas, assim como [ROOT.Char.Custom('StudyOfficesWord')] têm as suas."
 study_scripture_outcome.10.c:0 "Vou ler conforme o espírito me guiar."
 study_scripture_outcome.10.desc:0 "Os livros estão abertos no púlpito: os artigos da doutrina [ROOT.Char.GetFaith.GetAdjective] copiados com mão paciente. Uma vela vacila contra a escuridão. Lá embaixo, no [ROOT.Char.GetFaith.HouseOfWorship], os fiéis esperam, como sempre fazem.\n\n"
 study_scripture_outcome.10.desc_generic:0 "Quanto de mim mesma darei ao aprendizado sagrado?"
 study_scripture_outcome.10.desc_quote:0 "Na página mais alta, algum leitor antes de mim sublinhou um único fragmento: #EMP \"[ROOT.Char.Custom('RandomStudyVerseFragment')]\"#!\n\nQuanto de mim mesma darei à página sagrada?"
 study_scripture_outcome.10.t:0 "$study_scripture_title$Uma Regra de Estudo"
 study_scripture_outcome.100.a:0 "Um dia a pergunta será feita. Eu serei a resposta."
 study_scripture_outcome.100.b:0 "A sabedoria exige tempo; que a ambição espere."
 study_scripture_outcome.100.c:0 "Preferia ir para a cama..."
 study_scripture_outcome.100.desc:0 "Até tarde da noite, estudo os cânones da eleição: quem pode ser eleito, quem pode realizar a eleição, quais precedentes prevaleceram e quais cederam. Os cânones recompensam a paciência.\n\nPapas morrem. Conclaves se reúnem. E os cardeais não esquecerão quem conhecia a lei quando ela importava."
 study_scripture_outcome.100.t:0 "$study_scripture_title$Uma Questão de Sucessão"
 study_scripture_outcome.1000.a:0 "Não serei achado em falta novamente."
 study_scripture_outcome.1000.b:0 "Não consigo carregar isto por mais tempo. Chega — para sempre."
 study_scripture_outcome.1000.c:0 "Chega. Preciso descansar."
 study_scripture_outcome.1000.desc_dream:0 "No sonho, estou em uma grande biblioteca onde cada livro leva meu nome, e cada página está em branco. Uma figura que conheço de centenas de imagens sagradas fecha o último deles, gentilmente, do jeito que se fecham os olhos dos mortos.\n\n\"Foi-lhe dado mais do que à maioria\", diz o santo — e eu acordo com as palavras ainda ecoando no quarto."
 study_scripture_outcome.1000.desc_letter:0 "O pergaminho traz o selo de [senior.GetTitledFirstName], e cada linha medida cai como uma pedra:\n\n\"Dizem-me que seus estudos fraquejam. Um pastor relutante em aprender conduz [ROOT.Char.GetHerHis] rebanho ao erro. Foi-lhe concedido mais do que à maioria. Espero ouvir coisas melhores.\"\n\nSem assinatura. O selo basta."
 study_scripture_outcome.1000.desc_present:0 "[senior.GetTitledFirstName|U] nunca eleva [senior.GetHerHis] voz. [senior.GetSheHe|U] não precisa fazê-lo.\n\n\"Dizem-me que seus textos acumulam poeira. Um pastor relutante em aprender deixa o rebanho vagar. Foi-lhe concedido mais do que à maioria — e o que você fez com isso?\"\n\nO silêncio que se segue é pior do que qualquer grito."
 study_scripture_outcome.1000.t:0 "$study_scripture_title$Um Pastor Repreendido"
 study_scripture_outcome.101.a:0 "Pregai-o do [ROOT.Char.Custom('StudyPulpitWord')] na próxima festa."
 study_scripture_outcome.101.b:0 "Circule-o discretamente entre os letrados."
 study_scripture_outcome.101.c:0 "Foi-me dado em silêncio; em silêncio eu o devolvo."
 study_scripture_outcome.101.desc:0 "A resposta me vem durante uma ceia fria, entre uma mordida e outra. Finalmente, sei como ler a passagem:\n\n"
 study_scripture_outcome.101.desc_generic:0 "Gerações de [Glossary('exegetes', 'GLOSS_EXEGETE')] têm discutido sobre estas palavras. Agora seu significado parece perfeitamente claro. A questão é o que fazer com minha interpretação."
 study_scripture_outcome.101.desc_quote:0 "#EMP \"[ROOT.Char.Custom('RandomRelevantBibleQuote')]\"#!\n\nGerações de [Glossary('exegetes', 'GLOSS_EXEGETE')] têm discutido sobre estas palavras. Agora seu significado parece perfeitamente claro. A questão é o que fazer com minha interpretação."
 study_scripture_outcome.101.t:0 "$study_scripture_title$O Exegeta Renomado"
 study_scripture_outcome.1010.a:0 "Vou usar este presente para um bom propósito."
 study_scripture_outcome.1010.b:0 "Um belo livro. Ficará bem na minha estante."
 study_scripture_outcome.1010.desc:0 "Um pacote chega de [sender.GetTitledFirstName]."
 study_scripture_outcome.1010.end:0 "Dentro há um livro devocional ricamente encadernado, suas páginas repletas de orações, comentários e iluminuras cuidadosas.\n\nUm presente generoso e útil. As respostas que me escaparam podem já residir entre estas páginas."
 study_scripture_outcome.1010.end_christian:0 "Uma fita marca exatamente a passagem que venho falhando em dominar:\n\n#EMP \"[ROOT.Char.Custom('RandomRelevantBibleQuote')]\"#!\n\nUm presente generoso e útil."
 study_scripture_outcome.1010.t:0 "$study_scripture_title$Uma Dádiva de Tinta"
 study_scripture_outcome.102.a:0 "Devo pôr isso por escrito antes que a luz se apague."
 study_scripture_outcome.102.b:0 "Que a alegria disso seja suficiente."
 study_scripture_outcome.102.c:0 "Mesmo a revelação pode esperar até a manhã."
 study_scripture_outcome.102.desc:0 "Por anos, as doutrinas de [ROOT.Char.GetFaith.GetName] estiveram em minha mente, mas alguns ensinamentos nunca fizeram total sentido para mim.\n\n"
 study_scripture_outcome.102.desc_generic:0 "Esta noite, os ensinamentos finalmente estão claros para mim: o que eles exigem, o que eles perdoam e os limites que não ultrapassarán. Eu poderia defendê-los contra qualquer estudioso, ou ensiná-los a uma criança."
 study_scripture_outcome.102.desc_quote:0 "\n\n#EMP \"[ROOT.Char.Custom('RandomRelevantBibleQuote')]\"#!"
 study_scripture_outcome.102.desc_tenet:0 "Esta noite, [pam_ss_clarity_tenet.GetBaseName|U] finalmente está claro para mim: o que este princípio exige, o que ele perdoa e os limites que aqueles que o respeitam não podem ultrapassar. Eu poderia defender esta crença contra qualquer estudioso, ou ensiná-la a uma criança."
 study_scripture_outcome.102.t:0 "$study_scripture_title$Clareza Doutrinária"
 study_scripture_outcome.1020.a:0 "O flagelo purificará minha mente."
 study_scripture_outcome.1020.b:0 "Inanição para o corpo, banquete para a alma."
 study_scripture_outcome.1020.c:0 "Ou talvez a ceia, a cama e um recomeço amanhã."
 study_scripture_outcome.1020.desc:0 "Os textos me derrotam esta noite, assim como na noite passada, e na anterior. Meus olhos deslizam pela página; minha mente vagueia para a ceia, para a cama, para qualquer coisa que não seja a doutrina.\n\nO corpo é o problema. Os velhos ascetas sabiam disso: o conforto é o servo mais silencioso de [ROOT.Char.GetFaith.DevilName], e a fome aguça a alma. Talvez a carne deva ceder antes que o espírito possa avançar."
 study_scripture_outcome.1020.t:0 "$study_scripture_title$Mortificação da Carne"
 study_scripture_outcome.1030.a:0 "Provocar uma bênção para meus estudos."
 study_scripture_outcome.1030.b:0 "Então lerei a mesma linha por duas semanas."
 study_scripture_outcome.1030.c:0 "Vou rezar sobre isso e deixar como está."
 study_scripture_outcome.1030.desc:0 "Meus estudos estagnaram. A mesma escrivaninha, a mesma vela, as mesmas derrotas. Então procuro meu [ROOT.Char.Custom2( 'RelationToMeShort', counselor )], [counselor.GetTitledFirstName], cuja devoção não exige nenhuma posição social.\n\n"
 study_scripture_outcome.1030.desc_hermitage:0 "\"Você traz muralhas demais consigo\", diz [counselor.GetFirstNameNoTooltip], fazendo um gesto em direção à cela nua, à lâmpada, ao silêncio. \"Os eremitas de antigamente sabiam: despoje-se de tudo, e o que resta é aquilo que você buscava.\""
 study_scripture_outcome.1030.desc_monastery:0 "\"Você estuda como um soberano\", diz [counselor.GetFirstNameNoTooltip], sem maldade. \"Conquistando páginas, contando-as como impostos. Nesta casa, ficamos com uma única linha por uma semana e, no fim, é a linha que nos estuda.\""
 study_scripture_outcome.1030.t:0 "$study_scripture_title$Retiro no Claustro"
 study_scripture_outcome.1040.a:0 "Então dactilografe até o amanhecer. Vamos terminar isso."
 study_scripture_outcome.1040.b:0 "Uma hora juntos, então."
 study_scripture_outcome.1040.c:0 "A gentileza já é ajuda suficiente."
 study_scripture_outcome.1040.d:0 "Aproxime-se, a luz da vela só alcança até aqui..."
 study_scripture_outcome.1040.desc_acolyte:0 "Eu não pedi ajuda. Ela chegou mesmo assim. Meu [ROOT.Char.Custom2( 'RelationToMeShort', helper )], [helper.GetTitledFirstName], organizou minhas anotações, encontrou o comentário certo e aparou minha vela. [helper.GetSheHe|U] aprendeu silenciosamente meus hábitos — até mesmo quais passagens me fazem suspirar.\n\n\"Você reza melhor descansado\", [helper.GetSheHe] diz simplesmente, colocando um [helper.Custom('GetLocalStreetFood')] quentinho ao lado das minhas anotações."
 study_scripture_outcome.1040.desc_partner:0 "Meu [ROOT.Char.Custom2( 'RelationToMeShort', helper )], [helper.GetTitledFirstName], entra sorrateiramente, pega o códice de minhas mãos e lê a linha em voz alta. As palavras são sagradas. Que [ROOT.Char.GetFaith.HighGodName] me perdoe — esta noite acho [helper.GetHerHis] [helper.Custom('ObjectifiedFeature')] ainda mais sagrad\n\n-- \"Deixe-me ajudar\", [helper.GetSheHe] murmura, perto o bastante para compartilhar o calor da vela. \"Eu quero.\""
 study_scripture_outcome.1040.t:0 "$study_scripture_title$Um Segundo Par de Mãos"
 study_scripture_outcome.1050.a:0 "A dúvida é um texto como qualquer outro."
 study_scripture_outcome.1050.b:0 "Talvez o silêncio seja a resposta."
 study_scripture_outcome.1050.c:0 "Além das palavras, além da dúvida — rumo ao próprio mistério."
 study_scripture_outcome.1050.desc:0 "Estudei por muito tempo. Em algum momento depois da meia-noite, as respostas deram lugar a perguntas, e a certeza à dúvida.\n\n"
 study_scripture_outcome.1050.desc_generic:0 "Os santos de todas as eras conheceram esta dúvida — na hora em que [ROOT.Char.GetFaith.HighGodName] retém o calor do sopro de [ROOT.Char.GetFaith.HighGodHerHis|U] e não nos diz o porquê.\n\nA vela queima. A incerteza permanece. E agora?"
 study_scripture_outcome.1050.desc_quote:0 "Não sou o primeiro a enfrentar tal silêncio. #EMP \"Meu Deus, meu Deus, por que me abandonaste?\"#!\n\nA vela queima. O silêncio persiste. E agora?"
 study_scripture_outcome.1050.t:0 "$study_scripture_title$A Noite Escura da Alma"
 study_scripture_outcome.1060.a:0 "Meus agradecimentos a cada mão que fez as cópias."
 study_scripture_outcome.1060.b.toast:0 "[lettered_brother.GetShortUIName|U] chega de [order_head.GetPrimaryTitle.GetNameNoTier|l]"
 study_scripture_outcome.1060.b:0 "Envie-me um de seus clérigos letrados."
 study_scripture_outcome.1060.c:0 "Que [ROOT.Char.GetFaith.HighGodName] os proteja."
 study_scripture_outcome.1060.desc_far:0 "A notícia das minhas lutas chegou até [order_head.GetPrimaryTitle.GetNameNoTier|l]. A carroça deles range ao entrar no meu pátio: comentários copiados, uma caixa de velas e um bilhete selado de [order_head.GetTitledFirstName].\n\n\"Nenhum pastor estuda sozinho enquanto a Regra perdurar. Peça, e o que é nosso é seu.\""
 study_scripture_outcome.1060.desc_house:0 "Meus estudos vacilam e tenho pouco a mostrar por eles. Ainda assim, a notícia chegou a [order_head.GetPrimaryTitle.GetNameNoTier|l], que mantêm um capítulo em [order_house_county.GetNameNoTier]. A carroça deles range ao entrar no meu pátio: comentários copiados, uma caixa de velas e um bilhete selado de [order_head.GetTitledFirstName].\n\n\"Nenhum clérigo estuda sozinho enquanto nossa Regra nos guiar. Peça, e o que é nosso é seu.\""
 study_scripture_outcome.1060.t:0 "$study_scripture_title$[Select_CString( order_head.IsFemale, 'Sisters', 'Brothers' )] da Regra"
 study_scripture_outcome.110.a:0 "Devo aprender, custe o que custar."
 study_scripture_outcome.110.b:0 "A compreensão virá em seu devido tempo."
 study_scripture_outcome.110.desc:0 "Trabalho linha por linha através dos grandes textos de [ROOT.Char.GetFaith.GetName], a cera se acumulando sob o coto da vela enquanto os coelhos e caracóis nas margens discutem entre si.\n\n"
 study_scripture_outcome.110.desc_generic:0 "Se devo pastorear os fiéis de [ROOT.Char.GetFaith.HighGodNamePossessive], estas são as palavras que devo carregar em meu coração."
 study_scripture_outcome.110.desc_quote:0 "Uma passagem me fala:\n#EMP \"[ROOT.Char.Custom('RandomRelevantBibleQuote')]\"#!\n\nSe devo pastorear os fiéis de [ROOT.Char.GetFaith.HighGodNamePossessive], estas são as palavras que devo carregar em meu coração."
 study_scripture_outcome.110.t:0 "$study_scripture_title$A Página Sagrada"
 study_scripture_outcome.120.a:0 "Vou pentear o texto em busca de um significado mais profundo."
 study_scripture_outcome.120.b:0 "Horas constantes, progresso constante."
 study_scripture_outcome.120.c:0 "Uma página por noite é suficiente."
 study_scripture_outcome.120.desc:0 "Para liderar meu rebanho, devo primeiro aprender a liderar a mim mesmo. Os comentários de [commentary_writer.GetTitledFirstName] estão espalhados na minha escrivaninha — o trabalho de toda uma vida de outro erudito sobre [ROOT.Char.GetFaith.ReligiousText], denso como um arbusto espinhoso e duas vezes mais afiado. Cada linha que limpo apenas revela mais incertezas.\n\nApenas a disciplina me fará superar."
 study_scripture_outcome.120.t:0 "$study_scripture_title$O Longo Comentário"
 study_scripture_outcome.121.a:0 "Vamos ler direito, juntos."
 study_scripture_outcome.121.b:0 "Vou patrocinar [student_courtier.GetHerHim]."
 study_scripture_outcome.121.c:0 "Deixe [student_courtier.GetHerHim] estudar sozinho. Isso constrói o caráter."
 study_scripture_outcome.121.desc:0 "Encontro meu [ROOT.Char.Custom2( 'RelationToMeShort', student_courtier )], [student_courtier.GetTitledFirstName], na biblioteca muito depois de as velas se apagarem, curvado sobre um texto grandes demais para o aprendizado de [student_courtier.GetHerHis].\n\n\"Peço perdão, [ROOT.Char.Custom('FormOfAddressForLiege')].\" [student_courtier.GetSheHe|U] balbucia, sobressaltado. \"Eu... eu apenas gostaria de conseguir ler este tomo...\"\n\nLembro-me do quanto eu daria por um mestre que tivesse de fato #EMP lido#! o livro."
 study_scripture_outcome.121.t:0 "$study_scripture_title$O Professor"
 study_scripture_outcome.122.a:0 "Linha por linha, para todos. Esse é o trabalho."
 study_scripture_outcome.122.b:0 "[pupil.GetFirstNameNoTooltip|U] tem uma mente aguçada. Ensinarei mais a [pupil.GetHerHim]."
 study_scripture_outcome.122.c:0 "[stray.GetFirstNameNoTooltip|U] demorou-se depois. A porta está aberta."
 study_scripture_outcome.122.d:0 "[devout.GetFirstNameNoTooltip|U] aprendeu o suficiente. Que [devout.GetHerHim] tenha minha bênção."
 study_scripture_outcome.122.desc:0 "Meus estudos deram frutos. Esta noite, reúno minha casa no [ROOT.Char.Custom('ResidenceBuildingHallsType')] do meu [ROOT.Char.Custom('ResidenceBuilding')] e abro [ROOT.Char.GetFaith.ReligiousText] diante deles.\n\nEu leio. Eles ouvem. Logo, surgem perguntas — algumas simples, outras surpreendentemente perspicazes. Parece que não sou o único com apetite pelo aprendizado sagrado."
 study_scripture_outcome.122.t:0 "$study_scripture_title$O Catecismo"
 study_scripture_outcome.123.a:0 "Ah. Começamos com o alfabeto da fé."
 study_scripture_outcome.123.b:0 "Minha corte não é nenhum [ROOT.Char.Custom('StudySeminaryWord')]."
 study_scripture_outcome.123.desc:0 "A notícia dos meus estudos correu entre os peregrinos e os bucaneiros, e hoje trouxeram-me um aspirante a estudante. [aspirant.GetTitledFirstName] está à minha porta, esfarrapado e obstinado, um livro emprestado apertado em suas [aspirant.GetHerHis] mãos trêmulas.\n\n\"Dizem que você realmente lê o que prega. Ensina-me, e eu servirei.\""
 study_scripture_outcome.123.t:0 "$study_scripture_title$O Portão [ROOT.Char.Custom('StudySeminaryWord')|U]"
 study_scripture_outcome.130.a:0 "Ensine-me. Não sou orgulhoso demais para aprender."
 study_scripture_outcome.130.b:0 "Sente-se comigo um pouco; o texto pode esperar."
 study_scripture_outcome.130.desc:0 "Por que o sentido disso não vem? Leio a passagem pela quarta vez e ela se fecha como um punho. Apoio suavemente a testa contra a escrivaninha.\n\n\"Trouxe-lhe uma vela\", diz meu [ROOT.Char.Custom2('RelationToMeShort', tutor)], [tutor.GetFirstName], da porta. \"Ah — os velhos comentários. Conheço bem estas páginas. Devemos lê-las juntos por um tempo?\"\n\nOlho para cima. Talvez uma mão amiga seja exatamente o que preciso."
 study_scripture_outcome.130.t:0 "$study_scripture_title$Paciência nas Margens"
 study_scripture_outcome.140.a:0 "Há a doutrina, e há a pregação. Aprenderé ambas."
 study_scripture_outcome.140.b:0 "Minha vocação é a página, não o [ROOT.Char.Custom('StudyPulpitWord')]."
 study_scripture_outcome.140.desc:0 "Fecho mais um livro com um suspiro. A doutrina está exposta nestas páginas, sim, mas quando ouvi [preacher.GetTitledFirstName] pregar pela última vez, havia algo #EMP mais#!. [preacher.GetHerHis|U] sermão não continha silogismos rebuscados... apenas [ROOT.Char.GetFaith.HighGodNamePossessive] verdade amorosa.\n\nO [ROOT.Char.Custom('StudyParishWord')] chorou. #EMP Eu#! choruei."
 study_scripture_outcome.140.t:0 "$study_scripture_title$Pregando ao [ROOT.Char.Custom('StudyParishWord')|U]"
 study_scripture_outcome.150.a:0 "Ensine-me os livros de contas."
 study_scripture_outcome.150.b:0 "Uma caminhada clareará minha mente, ao menos."
 study_scripture_outcome.150.desc:0 "\"Caminhe comigo\", diz meu [ROOT.Char.Custom2( 'RelationToMeShort', steward_scope )], [steward_scope.GetFirstName], com o livro de contas sob o braço, chamando-me para fora na manhã.\n\n\"Os campos do templo, o moinho, os paióis do dízimo — note quais estão cheios, quais vazios e quais foram prometidos duas vezes. Um rebanho não se alimenta apenas de graça.\""
 study_scripture_outcome.150.t:0 "$study_scripture_title$As Temporalidades"
 study_scripture_outcome.160.a:0 "Vamos debater isso devidamente."
 study_scripture_outcome.160.b:0 "Um [ROOT.Char.GetWomanMan] erudito deve saber como [ROOT.Char.GetHerHis] domínio é governado."
 study_scripture_outcome.160.c:0 "De volta aos textos, juntos."
 study_scripture_outcome.160.desc:0 "Os meus estudos puseram-me em correspondência com [colleague.GetTitledFirstName], cuja devoção é muito elogiada para além dos muros de [colleague.GetHerHis] própria casa.\n\n"
 study_scripture_outcome.160.desc_distant:0 "Trocamos cartas sobre assuntos de fé — perguntas, argumentos e correções indo e vindo. A caligrafia de [colleague.GetHerHis|U] é terrível, mas o raciocínio de [colleague.GetHerHis] é sólido."
 study_scripture_outcome.160.t:0 "$study_scripture_title$Companhia Erudita"
 study_scripture_outcome.170.a:0 "Comporei uma resposta digna."
 study_scripture_outcome.170.b:0 "Talvez [senior.GetSheHe] possa elogiar meu aprendizado de forma mais... pública?"
 study_scripture_outcome.170.c:0 "Leia de novo. Devagar, desta vez."
 study_scripture_outcome.170.desc:0 "Meu [ROOT.Char.Custom2('RelationToMeShort', letterman)], [letterman.GetFirstName], traz a carta como uma relíquia: uma missiva ostentando o selo de [senior.GetTitledFirstName].\n\n\"A notícia de seus estudos viajou mais longe do que imagina. A fé é mais rica por ter um pastor que lê. Persevere e esteja certo de minha graça.\"\n\n"
 study_scripture_outcome.170.desc_generic:0 "A carta encerra-se com uma bênção em nome de [ROOT.Char.GetFaith.HighGodNamePossessive], escrita maior do que o resto."
 study_scripture_outcome.170.desc_quote:0 "A carta encerra-se com um único versículo, separado do resto:\n#EMP \"[ROOT.Char.Custom('RandomBibleQuoteShort')]\"#!"
 study_scripture_outcome.170.t:0 "$study_scripture_title$Uma Carta Selada"
 study_scripture_outcome.171.a:0 "Responda a todas. É para isso que serve um pastor."
 study_scripture_outcome.171.b:0 "Façam os copistas espalhar minhas respostas por todos os cantos da fé."
 study_scripture_outcome.171.c:0 "Esta noite sou um estudante. As cartas podem esperar."
 study_scripture_outcome.171.desc:0 "Cartas encontram-me de todos os cantos do mundo [ROOT.Char.GetFaith.GetAdjective]: clérigos disputando sobre uma linha da liturgia, [ROOT.Char.GetFaith.PriestNeuterPlural] locais amedrontados por suas dúvidas, um estudioso implorando por um julgamento sobre uma tradução que alma viva alguma consegue verificar. Para qualquer disputa, meu selo é uma resposta digna.\n\n"
 study_scripture_outcome.171.desc_generic:0 "A pilha em minha escrivaninha cresce. Assim como, silenciosamente, meu aprendizado."
 study_scripture_outcome.171.desc_quote:0 "A carta desta noite cita-me as escrituras, esperançosa:\n#EMP \"[ROOT.Char.Custom('RandomBibleQuoteShort')]\"#!\n\nA pilha em minha escrivaninha cresce. Assim como, silenciosamente, meu aprendizado."
 study_scripture_outcome.171.t:0 "$study_scripture_title$Cartas aos Fiéis"
 study_scripture_outcome.172.a:0 "Envie-a."
 study_scripture_outcome.172.b:0 "A lição estava em escrevê-la. Isso basta."
 study_scripture_outcome.172.desc:0 "Esta noite estudo cartas escritas por pastores a congregações distantes: os sermões e palavras de instrução variam enormemente de [ROOT.Char.Custom('StudyParishWord')] para [ROOT.Char.Custom('StudyParishWord')].\n\nMeus pensamentos voltam-se para os fiéis de [pastoral_county.GetNameNoTier], nas terras de [pastoral_lord.GetTitledFirstName]. Eles mantêm uma igreja lá. Estão fora do meu alcance e sem a minha orientação... Talvez seja hora de eu mesmo lhes escrever.\n\nPego minha pena. #EMP \"Aos fiéis de [pastoral_county.GetNameNoTier]...\"#!"
 study_scripture_outcome.172.t:0 "$study_scripture_title$Carta Pastoral"
 study_scripture_outcome.172.toast:0 "[owner.GetTitledFirstName] enviou uma carta ao povo de [pastoral_county.GetNameNoTier]"
 study_scripture_outcome.180.a:0 "Agora — o que ler a seguir..."
 study_scripture_outcome.180.desc:0 "Começo um novo texto com o maxilar cerrado e os ombros tensos, esperando um dever a ser suportado.\n\n"
 study_scripture_outcome.180.desc_confession:0 "Em algum lugar entre a primeira página e a última, minha alma desmorona. Tudo o que carreguei, digo em voz alta para ninguém além de [ROOT.Char.GetFaith.HighGodName]. O peso se foi.\n\nPela primeira vez em meses, o caminho adiante está livre."
 study_scripture_outcome.180.desc_generic:0 "Em algum lugar entre a primeira página e a última, o peso escorrega dos meus ombros. É como se um véu tivesse se levantado.\n\nPela primeira vez em meses, o caminho adiante está livre."
 study_scripture_outcome.180.t:0 "$study_scripture_title$O Descarrego"
 study_scripture_outcome.190.a:0 "Certifique-se de que o sínodo ouça meu nome."
 study_scripture_outcome.190.b:0 "Peça aos teólogos que compartilhem suas anotações."
 study_scripture_outcome.190.c:0 "Os místicos devem conhecer meu trabalho."
 study_scripture_outcome.190.d:0 "Minha devoção sustenta-se por si só."
 study_scripture_outcome.190.desc:0 "O aprendizado também tem sua política. Um livro copiado enviado ao conselho certo, um leitor promissor sentado à mesa certa, meu nome dito com carinho nos salões certos...\n\nTrabalho diligentemente. Mas diligência invisível é diligência desperdiçada."
 study_scripture_outcome.190.t:0 "$study_scripture_title$Patrocínio dos Eruditos"
 study_scripture_outcome.200.a:0 "Algo aguardava naquela escuridão. Eu o buscarei."
 study_scripture_outcome.200.b:0 "Testem-me, mistérios. Não tenho medo."
 study_scripture_outcome.200.c:0 "[mystic.GetFirstNameNoTooltip] merece uma carta de admiração."
 study_scripture_outcome.200.d:0 "Anotarei a porta e me atinham a estudos mais simples."
 study_scripture_outcome.200.desc:0 "Em algumas páginas, descubro onde as letras terminam... algo além delas começa. O místico conhecido como [mystic.GetTitledFirstName] escreve sobre uma escuridão que de alguma forma eclipsa o meio-dia, de uma prece que dura mais que a fala — e [ROOT.Char.GetFaith.GetName] ensina que há portas para o entendimento que se abrem apenas para aqueles com coragem para bater.\n\nEnquanto viro as páginas, minhas velas apagam-se uma a uma. E sento-me por um longo tempo no escuro. Ouvindo."
 study_scripture_outcome.200.t:0 "$study_scripture_title$O Visionário"
 study_scripture_outcome.300.a:0 "Mais fundo. Irei mais fundo."
 study_scripture_outcome.300.b:0 "Uma hora de quietude, depois o sono."
 study_scripture_outcome.300.c:0 "Mantive a vigília; isso basta."
 study_scripture_outcome.300.desc:0 "O [ROOT.Char.GetFaith.HouseOfWorship] está frio e completamente silencioso. Entre o último ofício e o primeiro há uma hora que não pertence a ninguém, e eu a tornei minha — uma única vela, a escuridão e o mistério apertando-se ao redor da chama.\n\nAlgo aguarda além do silêncio. É paciente. Esta noite, eu também sou."
 study_scripture_outcome.300.t:0 "$study_scripture_title$A Vigília Noturna"
 study_scripture_outcome.400.a:0 "Há apenas uma cura. Penitência."
 study_scripture_outcome.400.b:0 "Devo continuar lendo, não importa o que aconteça."
 study_scripture_outcome.400.c:0 "Santos pregam. Pecadores governam."
 study_scripture_outcome.400.desc:0 "A passagem me faz hesitar. Sua condenação parece desconfortavelmente familiar.\n\n"
 study_scripture_outcome.400.desc_end:0 "\n\nEu poderia fechar o livro e não ler mais nada. Mas a acusação permaneceria."
 study_scripture_outcome.400.desc_generic:0 "O texto não me nomeia, e ainda assim o faz: sou [penance_sin.GetName( ROOT.Char )], diz ele — claramente e sem piedade — como se o escritor me conhecesse."
 study_scripture_outcome.400.t:0 "$study_scripture_title$Médico, Cura-te a Ti Mesmo"
 study_scripture_outcome.410.a:0 "E agora uma terceira vez, lentamente."
 study_scripture_outcome.410.b:0 "Um erro tão sincero merece uma refutação adequada."
 study_scripture_outcome.410.c:0 "Para o fogo, página e tudo mais."
 study_scripture_outcome.410.desc:0 "O códice é emprestado, e seu leitor anterior deixou pensamentos próprios nas margens: objeções, preces e notas sobre o princípio que chamam de [pam_ss_margin_tenet.GetBaseName].\n\nEu deveria ignorar esses rabiscos. Em vez disso, dou por mim a lê-los duas vezes."
 study_scripture_outcome.410.t:0 "$study_scripture_title$Comentários Estranhos"
 study_scripture_outcome.430.a:0 "Eu acredito nisso. Que todo o [ROOT.Char.Custom('StudyParishWord')] me veja vivê-lo."
 study_scripture_outcome.430.b:0 "Escreverei em sua defesa."
 study_scripture_outcome.430.c:0 "Examinado de perto, todo ensinamento tem falhas..."
 study_scripture_outcome.430.desc:0 "Dos ensinamentos de [ROOT.Char.GetFaith.GetName], um é meu acima de todos os outros: [pam_ss_heart_tenet.GetBaseName], carregado desde muito antes de eu poder defendê-lo. Esta noite volto meus estudos para ele, procurando por falhas.\n\n"
 study_scripture_outcome.430.desc_generic:0 "Os textos respondem em uníssono, antigos e inabaláveis, enquanto minha voz vacila. A falha, ao que parece, não estava no ensinamento."
 study_scripture_outcome.430.desc_quote:0 "Os textos respondem com uma só voz:\n#EMP \"[ROOT.Char.Custom('PersonalTenetRelevantBibleQuote')]\"#!\n\nA falha nunca esteve no ensinamento."
 study_scripture_outcome.430.t:0 "$study_scripture_title$O Princípio e o Coração"
