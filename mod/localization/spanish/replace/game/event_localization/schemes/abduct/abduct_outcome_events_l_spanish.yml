l_spanish:
 abduct_event_title:0 "Sequestro:"
 abduct_outcome.1001.a:0 "Em breve, [target.GetSheHe] estará à minha mercê!"
 abduct_outcome.1001.arrival:0 "de [departure.GetNameNoTooltip] para [arrival.GetNameNoTooltip]."
 abduct_outcome.1001.b:0 "Não, o risco é muito grande."
 abduct_outcome.1001.ending:0 "\n\nEu arranjei para que alguns bandidos interrompam a pequena jornada de [target.GetTitledFirstName] e garantam que [target.GetSheHe] chegue aqui em vez disso."
 abduct_outcome.1001.no_arrival:0 "dentro de [departure.GetNameNoTooltip]."
 abduct_outcome.1001.opening:0 "Meus agentes me informam que [target.GetTitledFirstName] está viajando"
 abduct_outcome.1001.t:0 "$abduct_event_title$ Ataque na Estrada"
 abduct_outcome.1002.a:0 "O momento perfeito para atacar!"
 abduct_outcome.1002.desc:0 "Uma oportunidade perfeita se apresentou! [target.GetTitledFirstName] está viajando de [departure.GetNameNoTooltip] para [arrival.GetNameNoTooltip], sem nenhum guarda.\n\n[target.GetSheHe|U] deve pensar que [target.GetHerselfHimself] está seguro..."
 abduct_outcome.1002.t:0 "$abduct_event_title$ Em Andamento"
 abduct_outcome.1003.a:0 "Eu gosto do som desse plano!"
 abduct_outcome.1003.desc:0 "Com meus agentes entrando e saindo livremente da corte em [court_location.GetNameNoTierNoTooltip], [target.GetTitledFirstName] está ao meu alcance!\n\nOs agentes estão posicionados para permitir a entrada de um pequeno grupo de pessoas no meio da noite e para cobrir a saída deles sem serem detectados. Idealmente, enquanto abafam os gritos de um saco de juta chutando."
 abduct_outcome.1003.t:0 "$abduct_event_title$ Visitantes Indesejados"
 abduct_outcome.2001.a:0 "Espero que [target.GetSheHe] goste de seus novos aposentos..."
 abduct_outcome.2001.desc:0 "Sucesso! Os bandidos fizeram o trabalho deles admiravelmente, e [target.GetTitledFirstName] está seguramente em minhas mãos."
 abduct_outcome.2002.desc:0 "Antes que [target.GetTitledFirstName] sequer percebesse o que estava acontecendo, meus agentes o haviam capturado! [target.GetSheHe|U] está finalmente em minhas mãos."
 abduct_outcome.2003.desc:0 "Eu não posso acreditar que funcionou! Foi tão simples quanto deixar alguns dos meus aliados entrarem no [target.Custom('ResidenceBuilding')] no meio da noite.\n\n[target.GetTitledFirstName] está sem dúvida irritado com a falta de segurança. Felizmente, está muito melhor onde [target.GetSheHe] está agora."
 abduct_outcome.4001.a:0 "Encontrarei outra forma de lidar com [target.GetSheHe]."
 abduct_outcome.4001.b:0 "A sorte [target.GetHerHim|U] não durará. Hora de tentar novamente!"
 abduct_outcome.4001.opening:0 "Maldição! [target.GetTitledFirstName] escapou dos meus bandidos contratados e voltou em segurança para [departure.GetBaronyNameExplicitly]."
 abduct_outcome.4001.owner_discovered:0 "\n\nDesastroso, um dos bandidos foi capturado depois e confessou tudo, incluindo meu envolvimento!"
 abduct_outcome.4001.owner_secret:0 "\n\nPelo menos ninguém nunca saberá que os bandidos estavam trabalhando para mim."
 abduct_outcome.4002.opening:0 "Como isso pôde acontecer?! Meus agentes esperaram e esperaram no momento e local corretos, mas [target.GetTitledFirstName] nunca apareceu!"
 abduct_outcome.4002.owner_discovered:0 "\n\n[target.GetSheHe|U] parece ter descoberto que eu estava planejando algo!"
 abduct_outcome.4002.owner_secret:0 "\n\n[target.GetSheHe|U] deve ter descoberto que algo estava acontecendo, mas pelo menos [target.GetSheHe] nunca saberá que eu estava envolvido."
 abduct_outcome.4003.opening:0 "Não! Meus aliados foram descobertos ao tentar invadir as câmaras de [target.GetTitledFirstName]. Eu deveria saber que não seria tão fácil."
 abduct_outcome.4003.owner_discovered:0 "\n\nO pior de tudo, eles confessaram e revelaram meu envolvimento no plano!"
 abduct_outcome.4003.owner_secret:0 "\n\nPor algum milagre, meus aliados conseguiram sair, e meu envolvimento permanece desconhecido."
 abduct_outcome.5001.a:0 "Espere até que eu saia daqui!"
 abduct_outcome.5001.on_the_way:0 "\n\nEu estava a caminho da cidade com apenas alguns guardas, e [owner.GetSheHe] soube atacar quando eu estaria mais vulnerável!"
 abduct_outcome.5001.opening:0 "Eu fui sequestrado por [owner.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
 abduct_outcome.5001.seized_roadside:0 "\n\nEu estava viajando com meu séquito quando fomos abordados por bandidos. Eu não sei o que aconteceu com os outros, pois um saco foi colocado sobre minha cabeça. Quando finalmente o removeram, descobri que sou um prisioneiro em [prison_location.GetBaronyNameExplicitly]."
 abduct_outcome.5001.t:0 "Sequestrado!"
 abduct_outcome.5001.unwelcome_guests:0 "\n\nUm grupo de estranhos invadiu minhas câmaras no meio da noite. Traidores devem tê-los deixado entrar no [ROOT.Char.Custom('ResidenceBuilding')], e eu pensei que minha vida havia acabado. No entanto, eles colocaram um saco sobre minha cabeça e me arrastaram para cá, para esta masmorra úmida."
 abduct_outcome.5002.a:0 "Ah, [owner.GetSheHe] vai pagar!"
 abduct_outcome.5002.b:0 "Eu devo ficar alerta."
 abduct_outcome.5002.fallback:0 "Eu escapei de uma tentativa de sequestro!"
 abduct_outcome.5002.on_the_way:0 "Eu estava a caminho da cidade com apenas alguns poucos guardas quando eles atacaram.\n\nFelizmente, os que eu tinha comigo agiram rapidamente e corajosamente, e em pouco tempo eu estava de volta ao [target.Custom('ResidenceBuilding')]."
 abduct_outcome.5002.owner_known:0 "\n\nIsso é, sem dúvida, obra [Select_CString( owner.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))], [owner.GetTitledFirstName]!"
 abduct_outcome.5002.owner_not_known:0 "\n\nEu não sei quem está por trás dessa tentativa de sequestro, mas eles ainda estão lá fora..."
 abduct_outcome.5002.seized_roadside:0 "Eu estava viajando em [departure.GetBaronyNameExplicitly] quando um grupo de bandidos nos atacou.\n\nConsegui escapar em segurança, pois ficou claro que os bandidos não estavam dispostos a me ferir. Em vez disso, eles estavam tentando me capturar vivo!"
 abduct_outcome.5002.t:0 "Tentativa de Sequestro Prevenida!"
 abduct_outcome.5002.unwelcome_guests:0 "Uma comoção me acordou no meio da noite. Um grupo de criminosos havia sido deixado entrar no [ROOT.Char.Custom('ResidenceBuilding')], e só foram descobertos quando já estavam na porta das minhas câmaras!"
 do_not_execute_abduct_tooltip:0 "Eu não tento o Sequestro"
