l_spanish:
 court_outcome.0001.a.tt:0 "Continuo com minha tentativa de seduzir [target.GetTitledFirstName]"
 court_outcome.0001.a:0 "Nada virá entre nós!"
 court_outcome.0001.b:0 "Não posso arriscar a segurança [target.GetHerHim]..."
 court_outcome.0001.desc:0 "Oh, [target.GetFirstName], meu [target.Custom('LoverPetName')]! Eu anseio pelo seu abraço! Acho que morrerei sem o doce néctar dos seus beijos!\n\nEmbora meus sentimentos sejam puros, há tantos que nos julgariam. Devo ir até [target.GetSheHe]? Ou devo me manter afastado?"
 court_outcome.0001.t:0 "$court_event_title$ Agora ou Nunca"
 court_outcome.0003.a.tt:0 "[owner.GetShortUIName|U] pode se tornar minha Alma Gêmea"
 court_outcome.0003.a:0 "Sou s[Select_CString( ROOT.Char.IsFemale, 'ua', 'eu' )], [owner.GetFirstNameNoTooltip]. Agora e para sempre!"
 court_outcome.0003.b.failure:0 "[owner.GetSheHe|U] merece pelo menos um beijo por sua devoção."
 court_outcome.0003.b.success:0 "Um beijo de amor verdadeiro é tudo o que posso dar."
 court_outcome.0003.b.tt:0 "[owner.GetShortUIName|U] #bold não#! se tornará minha Alma Gêmea"
 court_outcome.0003.c:0 "Essa paixão termina hoje."
 court_outcome.0003.failure.desc:0 "Mal consigo lembrar como era minha vida antes de [owner.GetFirstName] declarar seu amor por mim. Fico lisonjead[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], mas também sobrecarregad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com suas atenções. Me pego ansiando por um pouco de paz e tranquilidade.\n\nNo entanto, não posso deixar de me preocupar. Estaria jogando fora minha única chance de um verdadeiro amor? Isso não pode estar certo! Ou pode...?"
 court_outcome.0003.success.desc:0 "Mal consigo lembrar como era minha vida antes de [owner.GetFirstName] declarar seus sentimentos por mim. Aqueles dias parecem tão sombrios, tão deprimentes... Mas com [owner.GetSheHe] ao meu lado, tudo e qualquer coisa de repente parece possível!\n\nGostaria que pudéssemos continuar assim para sempre, mas no fundo, sei que devo fazer minha escolha. Serei corajoso o suficiente para ceder aos meus sentimentos, ou devo fechar meu coração para [owner.GetFirstNameNoTooltip] para sempre?"
 court_outcome.0003.t:0 "É Amor?"
 court_outcome.1000.a:0 "\"Estou indo atrás de você, meu amor!\""
 court_outcome.1000.b.failure:0 "[target.GetShortUIName|U] é ferid[Select_CString( target.IsFemale, 'a', 'o' )] pela fera"
 court_outcome.1000.b.success:0 "[target.GetShortUIName|U] escapa iles[Select_CString( target.IsFemale, 'a', 'o' )]"
 court_outcome.1000.b:0 "Talvez seja mais sensato enviar o pajem..."
 court_outcome.1000.c:0 "Provavelmente foi apenas um pássaro."
 court_outcome.1000.end.desc:0 "\n\nEstou me aproximando furtivamente, meu pajem ao meu lado e meu cãozinho logo à frente. Parece que ele encontrou um rastro! Então, de repente, minha concentração é interrompida por um grito de um[Select_CString( target.IsFemale, 'a', '' )] [target.GetWomanMan]!"
 court_outcome.1000.i_invite.desc:0 "Quando [target.GetTitledFirstName] sugeriu uma caçada, não hesitei em organizá-la. Eu faria qualquer coisa por um mero vislumbre do meu [target.Custom('LoverPetName')]!"
 court_outcome.1000.liege_invite.desc:0 "Quando [target_host.Custom2('NamePossessiveCharacterIntroduction', target)] me convidou para uma caçada, não hesitei em aceitar. Eu faria qualquer coisa por um mero vislumbre do meu [target.Custom('LoverPetName')]!"
 court_outcome.1000.own_invite.desc:0 "Quando [target.GetFirstName] me convidou para uma caçada, não hesitei em aceitar. Não consigo imaginar uma visão mais adorável do que seu perfil impressionante em cima de um cavalo!"
 court_outcome.1000.t:0 "$court_event_title$ A Caçada Selvagem"
 court_outcome.1001.a:0 "Preciso de você, meu amor, aqui e agora!"
 court_outcome.1001.b:0 "Um único beijo doce é a única recompensa que desejo."
 court_outcome.1001.desc:0 "Dentro do que deve ter sido um minuto, mas pareceu uma hora, chego a um claro. [target.GetFirstName] está deitad[Select_CString( target.IsFemale, 'a', 'o' )] no chão à minha frente, desarrumad[Select_CString( target.IsFemale, 'a', 'o' )] e desarmad[Select_CString( target.IsFemale, 'a', 'o' )]. Em frente a [target.GetSheHe], prestes a atacar, está o(a) [ROOT.Char.Custom('GetAnimalType')] enorme!\n\nMinha flecha acerta em cheio e a fera cai no chão. Por um momento, tudo o que [target.GetFirstNameNoTooltip] pode fazer é olhar, mas então [target.GetSheHe] se aproxima de mim e se joga em meus braços."
 court_outcome.1002.a:0 "Eu... Eu me perdi?"
 court_outcome.1002.desc:0 "\"[target.GetFirstName]! Estou indo!\" Eu saio das sombras e entro no claro, meu coração batendo descontroladamente, suor escorrendo pelo meu rosto.\n\nMas a cena diante de mim não é o que eu esperava. Há um(a) [ROOT.Char.Custom('GetAnimalType')], sim - mas está caída no chão, uma flecha entre os olhos. [target.GetFirstNameNoTooltip] abaixa o arco ao me encarar.\n\n\"O que é isso, [owner.GetTitledFirstNameNoTooltip]? Achou que eu não era capaz de me defender?\""
 court_outcome.1003.b:0 "Compartilhamos um beijo, doce como mel."
 court_outcome.1003.t:0 "A Caçada Selvagem"
 court_outcome.1004.desc:0 "Estou cavalgando quando meu cavalo de repente se joga para fora do caminho. A queda é inevitável e tira o fôlego. Quando olho para cima, vejo-me cara a cara com o(a) [owner.Custom('GetAnimalType')]!\n\nAntes de ter uma chance de gritar, a fera desaba, uma flecha entre os olhos.\n\n\"[target.GetFirstNameNoTooltip], meu [target.Custom('LoverPetName')]! Pensei que tivesse te perdido!\" [Select_CString( owner.IsFemale, 'Minha heroína', 'Meu herói' )] é ninguém menos que [owner.GetTitledFirstName]!"
 court_outcome.1005.a:0 "[target.GetSheHe|U] claramente não tem espaço no coração [target.GetHerHim] para mim."
 court_outcome.1005.b:0 "[targets_lover.GetFirstNameNoTooltip] vai se arrepender do dia em que cruzou o meu caminho!"
 court_outcome.1005.c.murder_attempt:0 "Eu erro o tiro e fujo do local"
 court_outcome.1005.c.murder_discovered:0 "Minha flecha acerta [targets_lover.GetFirstNameNoTooltip], mas sou descobert[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]"
 court_outcome.1005.c.murder_undiscovered:0 "Minha flecha acerta [targets_lover.GetFirstNameNoTooltip]"
 court_outcome.1005.c:0 "Eu vou salvar [target.GetSheHe] daquela besta!"
 court_outcome.1005.d.murder_discovered:0 "Minha flecha acerta [target.GetFirstNameNoTooltip], mas sou descobert[Select_CString( ROOT.Char.IsFemale, 'a', '' )]"
 court_outcome.1005.d.murder_undiscovered:0 "Minha flecha acerta [target.GetFirstNameNoTooltip]"
 court_outcome.1005.d:0 "Se não posso ter [target.GetSheHe], ninguém pode!"
 court_outcome.1005.desc:0 "Conforme me aproximo, os gritos intensificam-se. Deve ser m[Select_CString( target.IsFemale, 'inha', 'eu' )] [target.Custom('RomanticComplimentAdjective')] [target.GetFirstName] — reconheceria a voz [target.GetHerHim] em qualquer lugar!\n\nMas há algo de #EMP estranho#! nos gritos [target.GetHerHim]. Não parece que [target.GetFirstNameNoTooltip] está com medo... Ou que [target.GetSheHe] está com dor...\n\nMeu coração afunda quando finalmente vejo [target.GetSheHe]: nu[Select_CString( target.IsFemale, 'a', '' )] como no dia em que nasceu, rolando na grama com [targets_lover.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]."
 court_outcome.1100.a:0 "Meu [target.Custom('LoverPetName')] está em perigo — preciso salvá-l[Select_CString( target.IsFemale, 'a', 'o' )]!"
 court_outcome.1100.b.failure:0 "[target.GetShortUIName|U] é ferid[Select_CString( target.IsFemale, 'a', 'o' )] pelo intruso"
 court_outcome.1100.b.success:0 "[target.GetShortUIName|U] escapa iles[Select_CString( target.IsFemale, 'a', 'o' )]"
 court_outcome.1100.b:0 "\"Guardas! #EMP Guardas!#! Há um intruso na torre!"
 court_outcome.1100.c:0 "Não vim aqui para lutar com um ladrão."
 court_outcome.1100.end.desc:0 "\n\nA visão da janela do quarto de [target.GetFirstNamePossessiveNoTooltip] faz meu coração falhar. Tão perto, e ainda assim tão longe!\n\nMas espere — quem é aquela pessoa, escalando a torre? A figura sombria para junto da janela de [target.GetFirstNamePossessiveNoTooltip] e abre as persianas..."
 court_outcome.1100.my_residence.desc:0 "o jardim fora dos aposentos [target.GetHerHim]."
 court_outcome.1100.start.desc:0 "Toda vez que fecho os olhos, vejo o rosto de [target.GetTitledFirstNamePossessive]. O sono não vem. Não posso esperar mais um momento — envolto nas sombras, faço meu caminho até"
 court_outcome.1100.t:0 "$court_event_title$ Intruso"
 court_outcome.1100.targets_host_residence.desc:0 "o [target.Custom('ResidenceBuilding')] de [target_host.GetTitledFirstNamePossessive]."
 court_outcome.1100.targets_residence.desc:0 "Seu [target.Custom('ResidenceBuilding')]."
 court_outcome.1101.a:0 "Nunca mais deixarei você correr perigo!"
 court_outcome.1101.end.desc:0 "\"[target.GetFirstNameNoTooltip], você está bem?\" pergunto cautelosamente. Como se minhas palavras fossem um feitiço, [target.GetSheHe] finalmente descongela e se joga em meus braços. \"Obrigad[Select_CString( target.IsFemale, 'a', 'o' )] por estar aqui, [ROOT.Char.GetFirstNameNoTooltip]!\""
 court_outcome.1101.owner_fights.desc:0 "Sinto como se tivesse mergulhado em um lago congelante. [target.GetFirstNameNoTooltip] está no chão, o intruso o empurrando para baixo, uma lâmina brilhante entre eles. Com um rugido, agarro o vilão pelo colarinho e o arremesso contra a parede. O resto é um borrão.\n\nQuando o perigo passa, viro-me para [target.GetSheHe]."
 court_outcome.1101.start.desc:0 "Os sons da luta acima são o maior motivador que já conheci. Sem se importar com a vida ou os membros, eu me impulsiono pela janela de [target.GetTitledFirstNamePossessive].\n\n"
 court_outcome.1101.target_fights.desc:0 "A cena que encontro não é o que eu esperava. Móveis virados, cortinas rasgadas e [target.GetFirstName] de pé sobre um corpo imóvel com uma adaga ensanguentada na mão.\n\n"
 court_outcome.1102.a:0 "Eu só tentei ajudar!"
 court_outcome.1102.end.desc:0 "\"O que você está fazendo aqui?!\" pergunta [target.GetSheHe], a voz del[Select_CString( target.IsFemale, 'a', 'e' )] tremendo. Levanto as mãos, um gesto de paz, mas [target.GetSheHe] saca a adaga del[Select_CString( target.IsFemale, 'a', 'e' )]. \"Não se aproxime! Saia imediatamente, ou eu #EMP vou#! machucá-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]!\""
 court_outcome.1103.desc:0 "Os sons da luta acima são o maior motivador que já conheci. Antes que eu tenha a chance de fazer um plano, alcanço a janela. Me impulsiono — mas a visão diante de mim não é o que eu esperava.\n\n[target.GetTitledFirstName] não está exatamente... #EMP lutando#!. Não, [target.GetSheHe] parece estar verdadeiramente aproveitando [target.GetHerselfHimself] — junto com [targets_lover.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]."
 court_outcome.1105.a:0 "Ah, meu amor! Nunca me deixe fora do seu campo de visão novamente!"
 court_outcome.1105.owner_fights.desc:0 "Salto da cama e corro em direção à porta, mas o intruso é mais rápido. [owner.GetSheHe|U] agarra meu braço, puxa e eu caio. Antes que eu possa gritar, uma mão cobre minha boca.\n\n\"Escute bem, [ROOT.Char.GetTitleAsNameNoTooltip]. Se você fizer o que eu mandar, ninguém se machucará —\" As palavras [owner.GetHerHim|U] se transformam em um engasgo quando uma adaga perfura profundamente o pescoço del[Select_CString( owner.IsFemale, 'a', 'e' )].\n\n\"[target.GetFirstNameNoTooltip], você está bem?\" Reconheceria aquela voz em qualquer lugar. Meu salvador é ninguém menos que [owner.GetTitledFirstName]!"
 court_outcome.1105.start.desc:0 "#EMP Batida!#! Eu... onde estou? O que está acontecendo? Observo a escuridão, meus olhos se ajustando. #EMP [ROOT.Char.GetFaith.HighGodName].#! Há alguém perto da janela do meu quarto.\n\n"
 court_outcome.1105.t:0 "Intruso"
 court_outcome.1105.target_fights.desc:0 "Salto da cama e alcanço a adaga no criado-mudo. O intruso agarra meu braço, puxa, e eu me viro — cravando a lâmina profundamente no estômago [owner.GetHerHim]. [owner.GetSheHe|U] me olha por um momento interminável, os lábios se movendo sem som. Então [owner.GetSheHe] cai no chão.\n\n\"[target.GetFirstNameNoTooltip], você está bem?\" Junto à janela está ninguém menos que [owner.GetTitledFirstName], com a adaga em mãos, pront[Select_CString( owner.IsFemale, 'a', 'o' )] para me defender. Lanço-me em seus braços e [owner.GetSheHe] me segura firmemente."
 court_outcome.kiss.tt:0 "[target.GetShortUIName|U] e eu nos damos um beijo"
