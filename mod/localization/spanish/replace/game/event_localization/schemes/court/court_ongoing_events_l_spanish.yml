l_spanish:
 court_competitor_modifier:0 "Competidor Romântico"
 court_event_title:0 "Romance:"
 court_ongoing.0001.a:0 "Ai, que desgraça!"
 court_ongoing.0001.desc:0 "[target.Custom2('MyCharacterIntroduction', ROOT.Char)|U] rejeitou meus avanços! [target.GetSheHe|U] deixou bem claro que não está interessado e provavelmente nunca estará."
 court_ongoing.0001.t:0 "$court_event_title$ Rejeição"
 court_ongoing.0501.a:0 "Cantar uma balada de amor."
 court_ongoing.0501.b:0 "Secretamente colocar uma carta no aposento [target.GetHerHim]."
 court_ongoing.0501.c:0 "Escrever um poema de amor."
 court_ongoing.0501.d:0 "Impressionar [target.GetSheHe] vencendo uma luta de treino."
 court_ongoing.0501.desc:0 "Chegou a hora de deixar meus sentimentos por [target.GetTitledFirstName] serem conhecidos. Quero que [target.GetSheHe] se lembre deste dia pelo resto de sua vida."
 court_ongoing.0501.t:0 "$court_event_title$ Declaração de Amor"
 court_ongoing.0501.tt:0 "Você declara sua devoção eterna a [target.GetShortUIName]"
 court_ongoing.0501.x:0 "Seguir minha intuição no momento."
 court_ongoing.0502.a.tt:0 "[owner.GetShortUIName|U] tentará conquistar meu coração"
 court_ongoing.0502.a:0 "Você me lisonjeia, [Select_CString( owner.IsFemale, 'minha', 'meu' )] [owner.GetLadyLord]!"
 court_ongoing.0502.b.incest:0 "O quê? Você é m[Select_CString( owner.IsFemale, 'inha', 'eu' )] #EMP [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('owner'))]#!!"
 court_ongoing.0502.b:0 "Abandone este empreendimento tolo #EMP imediatamente#!."
 court_ongoing.0502.t:0 "$court_event_title$ Declaração de Amor"
 court_ongoing.0503.a.tt:0 "Meu Plano para Conquistar [target.GetShortUIName] continua"
 court_ongoing.0503.a:0 "[target.GetFirstNameNoTooltip] não resistirá aos meus encantos por muito tempo!"
 court_ongoing.0503.b:0 "Pensei que estávamos destinados a ficar juntos..."
 court_ongoing.1000.a.failure:0 "[target.GetFirstNameNoTooltip] não foi quem peidou"
 court_ongoing.1000.a.success:0 "[target.GetFirstNameNoTooltip] fica aliviad[Select_CString( target.IsFemale, 'a', 'o' )] e grat[Select_CString( target.IsFemale, 'a', 'o' )]"
 court_ongoing.1000.a:0 "Fui eu! Eu peidei!"
 court_ongoing.1000.b.failure:0 "[target.GetFirstNameNoTooltip] sente-se muito mal por [scapegoat.GetTitledFirstNameNoTooltip]"
 court_ongoing.1000.b.rl:0 "Tento culpar [scapegoat.GetTitledFirstNameNoTooltip]"
 court_ongoing.1000.b.tt:0 "O resultado depende de quão empátic[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetFirstNameNoTooltip] é"
 court_ongoing.1000.b:0 "[scapegoat.GetTitledFirstNameNoTooltip], você é um[Select_CString( scapegoat.IsFemale, 'a', '' )] velh[Select_CString( scapegoat.IsFemale, 'a', 'o' )] [scapegoat.Custom2('InsultNoun', ROOT.Char)] fedorent[Select_CString( scapegoat.IsFemale, 'a', 'o' )]!"
 court_ongoing.1000.c:0 "Talvez eu devesse ficar quieto..."
 court_ongoing.1000.desc:0 "Consegui um convite para um banquete em [location.GetNameNoTooltip], e um assento perto de [target.GetFirstName]. Apesar das minhas tentativas determinadas, estou falhando em iniciar uma conversa. [target.GetSheHe|U] provavelmente está sem palavras diante da intensidade dos meus afetos.\n\nDe repente, o peido mais alto que já ouvi irrompe de nossa mesa. Alguns dos convidados estão olhando para [target.GetFirstNameNoTooltip]. Eu devo salvar [target.GetSheHe]!"
 court_ongoing.1000.t:0 "$court_event_title$ Um Odor Embaraçoso"
 court_ongoing.1010.a.failure:0 "Você é derrotado por [insulter.GetFirstNameNoTooltip]"
 court_ongoing.1010.a.success:0 "Você vence [insulter.GetFirstNameNoTooltip] em um duelo"
 court_ongoing.1010.a:0 "Mentiras vil! Desembainhe sua espada, [insulter.Custom2('InsultNoun', ROOT.Char)]!"
 court_ongoing.1010.b.failure:0 "[insulter.GetFirstNameNoTooltip] se recusa a ouvir"
 court_ongoing.1010.b.success:0 "Você convence [insulter.GetFirstNameNoTooltip] a se desculpar"
 court_ongoing.1010.b:0 "Você deveria se desculpar com [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetLadyLord]."
 court_ongoing.1010.c:0 "Oh, [target.GetFirstNameNoTooltip]. [insulter.GetSheHe|U] não poderia estar mais errado!"
 court_ongoing.1010.desc:0 "\"Pelo [insulter.GetFaith.HighGodName], [target.GetTitledFirstName] é um[Select_CString( target.IsFemale, 'a', '' )] [target.Custom2('InsultNoun', SCOPE.sC('insulter'))] insuportável! Você já viu como [target.GetSheHe] [target.Custom('quirk_neg_present')]? Ridículo!\"\n\n[insulter.Custom2('MyCharacterIntroduction', ROOT.Char)|U] joga a cabeça para trás com uma risada malévola.\n\n[target.GetFirstNameNoTooltip] ainda está conversando com seus amigos, mas posso perceber que [target.GetSheHe] ouviu [insulter.GetSheHe]. Detesto ver [target.GetSheHe] magoado."
 court_ongoing.1010.t:0 "$court_event_title$ A Honra de [Select_CString( target.IsFemale, 'uma', 'um' )] [target.GetLadyLord|U]"
 court_ongoing.1011.a:0 "Foi uma honra minha, [target.GetLadyLord] [target.GetFirstNameNoTooltip]."
 court_ongoing.1011.desc:0 "[insulter.GetTitledFirstName] saca sua espada com um sorriso convencido. Oh, como vou aproveitar em apagar aquela expressão arrogante do rosto [insulter.GetHerHim]!\n\nQuando termino com [insulter.GetSheHe], a humilhação de [insulter.GetTitledFirstNamePossessiveNoTooltip] é absoluta. Machucado e envergonhado, [insulter.GetSheHe] murmura um pedido de desculpas e se afasta mancando para lamber suas feridas.\n\n[target.GetTitledFirstName], por outro lado, está radiante como o sol. \"Você é um verdadeiro herói, [ROOT.Char.GetTitledFirstNameNoTooltip]! Você tem minha gratidão eterna!\""
 court_ongoing.1021.a:0 "Mate um lobo e traga-me sua pele."
 court_ongoing.1021.b:0 "Eu quero um companheiro peludo."
 court_ongoing.1021.c:0 "Colar de [necklace_owner.GetTitledFirstNamePossessive] parece adorável..."
 court_ongoing.1021.cat_pet.success:0 "[owner.GetShortUINameNoTooltip] te dá um gato"
 court_ongoing.1021.d:0 "Traga-me algo incomum — uma orquídea exótica, talvez?"
 court_ongoing.1021.desc:0 "\"[target.GetLadyLord|U] [target.GetFirstName]! M[Select_CString( target.IsFemale, 'inha', 'eu' )] [target.Custom('RomanticComplimentAdjective')] [target.Custom('RomanticComplimentNoun')]!\"\n\n[owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] está ajoelhado na poeira diante de mim, mão direita sobre o coração. \"Meu único desejo é trazer honra e felicidade para você. Por favor, diga-me — como posso provar meu amor por você?\""
 court_ongoing.1021.dog_pet.success:0 "[owner.GetShortUINameNoTooltip] te dá um cachorro"
 court_ongoing.1021.eagle_pet.success:0 "[owner.GetShortUINameNoTooltip] lhe presenteia com um filhote de águia"
 court_ongoing.1021.necklace.failure:0 "[owner.GetShortUINameNoTooltip] se recusa a te dar um colar"
 court_ongoing.1021.necklace.success:0 "[owner.GetShortUINameNoTooltip] te dá um colar"
 court_ongoing.1021.orchid.failure:0 "[owner.GetShortUINameNoTooltip] se recusa a te dar uma orquídea"
 court_ongoing.1021.orchid.success:0 "[owner.GetShortUINameNoTooltip] traz uma orquídea rara para você"
 court_ongoing.1021.pet.failure:0 "[owner.GetShortUINameNoTooltip] não te dá um animal de estimação"
 court_ongoing.1021.t:0 "Prova de Devoção"
 court_ongoing.1021.wolf_pelt.failure:0 "[owner.GetShortUINameNoTooltip] falha em matar um lobo"
 court_ongoing.1021.wolf_pelt.success:0 "[owner.GetShortUINameNoTooltip] traz a pele de um lobo para você"
 court_ongoing.1021.x:0 "Chega! Esta loucura acaba agora!"
 court_ongoing.1022.a.failure:0 "Você volta de mãos vazias"
 court_ongoing.1022.a.success:0 "Você mata um lobo"
 court_ongoing.1022.a:0 "\"Seu desejo é uma ordem!\""
 court_ongoing.1022.b.failure:0 "[target.GetShortUINameNoTooltip] vê através de sua astúcia"
 court_ongoing.1022.b.success:0 "[target.GetShortUINameNoTooltip] é convencido pela pele de cachorro"
 court_ongoing.1022.b:0 "Eu vi uma fera peluda na baia..."
 court_ongoing.1022.c.master_of_hunt.failure:0 "[master_of_hunt.GetFirstNameNoTooltip] encontra uma pele de lobo para comprar"
 court_ongoing.1022.c.master_of_hunt.success.tt:0 "Você adquire uma pele sem custo e sem risco para você."
 court_ongoing.1022.c.master_of_hunt.success:0 "[master_of_hunt.GetFirstNameNoTooltip] encontra e derruba um lobo durante uma caçada"
 court_ongoing.1022.c.master_of_hunt:0 "Meu $master_of_hunt_court_position$ me trará uma pele de lobo!"
 court_ongoing.1022.c:0 "Eu irei subornar um caçador."
 court_ongoing.1022.d:0 "\"Sinto muito, mas não posso fazer isso.\""
 court_ongoing.1022.end.desc:0 "[target.GetTitledFirstNameNoTooltip] hesita e suas bochechas ficam vermelhas. Pelo [ROOT.Char.GetFaith.HighGodName], espero que [target.GetSheHe] esteja satisfeito e não envergonhado!\n\n\"Mate um lobo para mim e traga-me sua pele. Então podemos continuar esta conversa.\""
 court_ongoing.1022.start.desc:0 "\"[Select_CString( target.IsFemale, 'Querida', 'Querido' )] [target.GetLadyLord] [target.GetFirstName]!\" Suspiro enquanto me ajoelho diante [target.GetHerHim]. \"Meu único desejo é trazer honra e felicidade para você. Diga-me, como posso provar meu amor por você?\"\n\n"
 court_ongoing.1022.t:0 "$court_event_title$ O Cinzento"
 court_ongoing.1023.a:0 "Deixe-me sozinho. Preciso de tempo para pensar..."
 court_ongoing.1023.b:0 "Assassino! Eu nunca mais quero te ver!"
 court_ongoing.1023.desc:0 "Um dos meus cachorros favoritos sumiu da baia. A [dummy_gender.Custom('MistressMaster')] dos cães organizou uma busca na noite passada, mas voltou de mãos vazias. \"Eu não faço ideia de como [dog_gender.GetSheHe] conseguiu sair\", diz [Select_CString( dummy_gender.IsFemale, 'a', 'ao' )] [dummy_gender.GetWomanMan] de cabelos grisalhos com um suspiro. \"Um cachorro não deveria conseguir abrir o portão...\"\n\n\"[ROOT.Char.GetLadyLord] [ROOT.Char.GetFirstNameNoTooltip]!\" Ao me virar, sou saudado pelo sorriso largo de [owner.GetTitledFirstName]. Há uma pele brilhante em suas mãos..."
 court_ongoing.1024.a:0 "Eu... Eu não faço ideia do que você está falando!"
 court_ongoing.1024.desc:0 "\"Pensei muito, meu [ROOT.Char.Custom('LoverPetName')],\" diz [owner.GetTitledFirstName] enquanto [owner.GetSheHe] coloca suavemente a cesta em minha mesa. \"Qual seria o companheiro perfeito para uma criatura tão leal, enérgica e sociável como você? E então eu percebi — nada ficaria melhor em você do que um cachorro!\"\n\n[owner.GetFirstNameNoTooltip|U] retira a manta que cobre a cesta, revelando um filhotinho! Ele pula em mim, tropeçando na beira da cesta de tanta excitação."
 court_ongoing.1030.a.failure:0 "[target.GetShortUINameNoTooltip] não gosta do gato"
 court_ongoing.1030.a.success:0 "[target.GetShortUINameNoTooltip] adora o gato"
 court_ongoing.1030.a:0 "Um gato esperto vai deixar [target.GetSheHe] feliz."
 court_ongoing.1030.b.failure:0 "[target.GetShortUINameNoTooltip] não gosta do cachorro"
 court_ongoing.1030.b.success:0 "[target.GetShortUINameNoTooltip] adora o cachorro"
 court_ongoing.1030.b:0 "Um cão leal seria um excelente companheiro."
 court_ongoing.1030.c:0 "\"Não tema, eu estarei sempre ao seu lado!\""
 court_ongoing.1030.d.failure:0 "[target.GetShortUINameNoTooltip] não gosta da águia"
 court_ongoing.1030.d.success:0 "[target.GetShortUINameNoTooltip] adora a águia"
 court_ongoing.1030.d:0 "Uma águia feroz ajudará [target.GetSheHe]."
 court_ongoing.1030.desc.eagle:0 "Ou talvez [target.GetSheHe] prefira um companheiro mais tático?"
 court_ongoing.1030.desc:0 "A chuva está caindo lá fora. M[Select_CString( target.IsFemale, 'inha', 'eu' )] [target.Custom('ComplimentAdjective')] [target.GetTitledFirstName] suspira enquanto [target.GetSheHe] olha pela janela embaçada.\n\n\"Como [location.GetNameNoTooltip] pode ser tão miserável. Gostaria de ter alguém para me fazer companhia durante os dias longos e sombrios...\"\n\nSerá que meu [target.Custom('LoverPetName')] é uma pessoa de gatos ou de cães, eu me pergunto?"
 court_ongoing.1030.t:0 "$court_event_title$ Companheiros Animais"
 court_ongoing.1031.a:0 "Ah! Vou cuidar muito bem de você!"
 court_ongoing.1031.b:0 "Isso... não é o que eu esperava."
 court_ongoing.1031.start.desc:0 "\"Pensei muito, meu [ROOT.Char.Custom('LoverPetName')],\" diz [owner.GetTitledFirstName] enquanto [owner.GetSheHe] coloca suavemente a cesta em minha mesa. \"Qual seria o companheiro perfeito para uma criatura tão leal, enérgica e sociável como você? E então eu percebi — nada ficaria melhor em você do que um cachorro!\"\n\n[owner.GetFirstNameNoTooltip|U] retira a manta que cobre a cesta, revelando um filhotinho! Ele pula em mim, tropeçando na beira da cesta de tanta excitação."
 court_ongoing.1032.desc:0 "\"Pensei muito, meu [ROOT.Char.Custom('LoverPetName')],\" diz [owner.GetTitledFirstName] enquanto [owner.GetSheHe] coloca suavemente a cesta em minha mesa. \"Qual seria o companheiro perfeito para uma criatura tão inteligente e independente como você? E então eu percebi — nada ficaria melhor em você do que um gato!\"\n\n[owner.GetFirstNameNoTooltip|U] retira a manta que cobre a cesta, revelando um gatinho! Ele olha para mim com seus grandes olhos de cor [ROOT.Char.Custom('RandomCatEyeColor')] e começa a ronronar."
 court_ongoing.1033.desc:0 "\"Eu pensei por muito tempo, meu [ROOT.Char.Custom('LoverPetName')],\" [owner.GetTitledFirstName] diz enquanto [owner.GetSheHe] me chama para fora. [owner.GetSheHe|U] me guia até um pedaço de pano cobrindo uma pequena protuberância. \"Qual seria o companheiro perfeito para uma criatura tão feroz e estratégica como você? E então me ocorreu — nada te ficaria melhor do que uma águia!\"\n\n[owner.GetFirstNameNoTooltip|U] retira o pano, revelando um filhote de águia sobre um poleiro de madeira. Seus olhos estão cobertos por um pequeno capô para mantê-lo calmo, mas seus trinados me enchem de emoção."
 court_ongoing.1040.a:0 "Encomendar um colar idêntico."
 court_ongoing.1040.b:0 "Oferecer um favor a [necklace_owner.GetFirstNameNoTooltip] por seu colar."
 court_ongoing.1040.c.failure:0 "Você é descoberto na câmara de [necklace_owner.GetFirstNamePossessiveNoTooltip]"
 court_ongoing.1040.c.success:0 "Você escapa com o colar"
 court_ongoing.1040.c:0 "Roube-o."
 court_ongoing.1040.d:0 "Elogie o gosto de [target.GetFirstNamePossessiveNoTooltip]."
 court_ongoing.1040.end.desc:0 "[target.GetFirstNameNoTooltip] me olha por um longo momento. \"[necklace_owner.GetLadyLord|U] [necklace_owner.GetFirstNamePossessiveNoTooltip] colar é adorável\", [target.GetSheHe] diz e acena com a cabeça na direção de [necklace_owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. \"Mas ficaria ainda melhor ao redor do meu pescoço.\""
 court_ongoing.1040.t:0 "$court_event_title$ Ouro Cintilante"
 court_ongoing.1050.a:0 "Certamente posso encontrar um comerciante disposto a me vender uma."
 court_ongoing.1050.b.friend.f:0 "Essa opção está disponível por causa da alta [prowess|E] de seu amigo [helpful_friend.GetShortUINamePossessive]"
 court_ongoing.1050.b.friend.hard_failure:0 "[helpful_friend.GetShortUIName|U] se machuca nas ruínas"
 court_ongoing.1050.b.friend.soft_failure:0 "[helpful_friend.GetShortUIName|U] não encontra nada"
 court_ongoing.1050.b.friend.success:0 "[helpful_friend.GetShortUIName|U] encontra uma orquídea nas ruínas"
 court_ongoing.1050.b.friend:0 "[helpful_friend.GetTitledFirstNameNoTooltip] pode me ajudar."
 court_ongoing.1050.b.hard_failure:0 "Você se machuca ao subir em uma torre"
 court_ongoing.1050.b.soft_failure:0 "Você procura o dia inteiro, mas não encontra nada"
 court_ongoing.1050.b.success:0 "Você encontra uma orquídea nas ruínas"
 court_ongoing.1050.b:0 "\"Eu enfrentarei as ruínas por você!\""
 court_ongoing.1050.c.friend.f:0 "Essa opção está disponível por causa da característica Herbalista de seu amigo [helpful_friend.GetShortUINamePossessive]"
 court_ongoing.1050.c:0 "Quase impossível? Eu já tenho isso em minha coleção!"
 court_ongoing.1050.d:0 "\"Ouvi dizer que as ruínas são assombradas...\""
 court_ongoing.1050.e:0 "\"Certamente elas devem empalidecer em comparação com a sua bela aparência!\""
 court_ongoing.1050.f:0 "\"Talvez um dia eu possa vê-la.\""
 court_ongoing.1050.monastery.desc:0 "A ruína do mosteiro em [orchid_location.GetNameNoTooltip] é o único lugar onde ela floresce nesta região.\""
 court_ongoing.1050.start.desc:0 "Enquanto eu e meu [target.Custom('LoverPetName')] passeamos pelos jardins de [target_location.GetNameNoTooltip], eu faço um gesto para a vegetação ao nosso redor. \"Apesar de toda a sua beleza, não há uma única flor que rivalize com a sua, [Select_CString( target.IsFemale, 'minha', 'meu' )] [target.GetLadyLord].\"\n\n\"Existe uma,\" [target.GetSheHe] diz com um sorriso travesso. \"Uma orquídea rara de [orchid_origin.GetNameNoTierNoTooltip], que é quase impossível de cultivar."
 court_ongoing.1050.t:0 "$court_event_title$ Uma Flor Rara"
 court_ongoing.1050.temple.desc:0 "O jardim abandonado do [target_host.GetFaith.HouseOfWorship] em [orchid_location.GetNameNoTooltip] é o único lugar onde ela floresce nesta região.\""
 court_ongoing.1100.beautiful:0 "Traços requintados."
 court_ongoing.1100.bold:0 "Feroz destemor."
 court_ongoing.1100.compassionate:0 "Coração bondoso e sensível."
 court_ongoing.1100.compliment.tt:0 "A resposta de [target.GetTitledFirstName] será baseada em quão bem o poema se adequa a [target.GetSheHe]."
 court_ongoing.1100.desc:0 "Não há [target.GetWomanMan] mais encantador[Select_CString( target.IsFemale, 'a', '' )] do que [target.GetTitledFirstName]! Em sua presença, minhas palavras frequentemente me falham — nenhum dos meus elogios realmente faz jus a [target.GetSheHe]. Talvez um poema cuidadosamente elaborado possa capturar melhor as virtudes [target.GetHerHim]?\n\nEu irei escrever sobre [target.GetSheHe]..."
 court_ongoing.1100.dominant:0 "Presença assertiva."
 court_ongoing.1100.energetic:0 "Vigor juvenil."
 court_ongoing.1100.extroverted:0 "Postura encantadora."
 court_ongoing.1100.failure.tt:0 "[target.GetFirstNameNoTooltip] responde negativamente"
 court_ongoing.1100.fallback:0 "A poesia não é o meu ponto forte."
 court_ongoing.1100.forgiving:0 "Natureza compassiva."
 court_ongoing.1100.greed:0 "Ambição elevada."
 court_ongoing.1100.honorable:0 "Nobre retidão."
 court_ongoing.1100.neutral.tt:0 "[target.GetFirstNameNoTooltip] não responde"
 court_ongoing.1100.rational:0 "Sabedoria infinita."
 court_ongoing.1100.strong:0 "Força física."
 court_ongoing.1100.success.tt:0 "[target.GetFirstNameNoTooltip] responde positivamente"
 court_ongoing.1100.t:0 "$court_event_title$ Licença Poética"
 court_ongoing.1100.zealous:0 "Fé ardente."
 court_ongoing.1101.a.bad:0 "Que estranho! Ainda assim, é... encantador."
 court_ongoing.1101.a.good:0 "[owner.GetSheHe|U] capturou a minha essência no pergaminho!"
 court_ongoing.1101.c.bad:0 "Será que [owner.GetSheHe] está tentando me insultar?!"
 court_ongoing.1101.c.good:0 "Que pretensioso."
 court_ongoing.1101.desc:0 "[owner.Custom2('love_letter_compliment_system', SCOPE.sC('target'))]"
 court_ongoing.1101.t:0 "Para [Select_CString( target.IsFemale, 'a', 'o' )] [target.Custom('RomanticComplimentAdjective')] [target.GetTitledFirstNameNoTooltip],"
 court_ongoing.1102.a:0 "[target.GetSheHe|U] deve ter gostado do meu poema!"
 court_ongoing.1102.desc:0 "[target.Custom2('love_letter', SCOPE.sC('owner'))]"
 court_ongoing.1102.t:0 "Para [Select_CString( owner.IsFemale, 'a', 'o' )] [owner.Custom('RomanticComplimentAdjective')] [owner.GetTitledFirstNameNoTooltip],"
 court_ongoing.1103.a:0 "Será que [target.GetSheHe]... está zombando de mim?"
 court_ongoing.1103.t:0 "[target.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 court_ongoing.1110.a.failure:0 "Você perde o duelo"
 court_ongoing.1110.a.success:0 "Você vence o duelo"
 court_ongoing.1110.a:0 "Um duelo provará quem é digno!"
 court_ongoing.1110.b.failure:0 "[competitor.GetShortUINameNoTooltip] percebe quando você coloca veneno em seu copo"
 court_ongoing.1110.b.murder:0 "O veneno é #EMP muito#! eficiente"
 court_ongoing.1110.b.success:0 "[competitor.GetShortUINameNoTooltip] faz uma cena embaraçosa no jantar"
 court_ongoing.1110.b:0 "Um \"infeliz\" caso de \"intoxicação alimentar\" resolverá o problema."
 court_ongoing.1110.c.failure:0 "[competitor.GetShortUINameNoTooltip] conta a [target.GetShortUINameNoTooltip] sobre sua oferta"
 court_ongoing.1110.c.success:0 "[competitor.GetShortUINameNoTooltip] aceita o suborno"
 court_ongoing.1110.c:0 "O amor [competitor.GetHerHim|U] não é verdadeiro; moedas o persuadirão a parar."
 court_ongoing.1110.desc:0 "Ultimamente, todas as minhas visitas a [target.GetFirstName] têm sido arruinadas por [competitor.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]! [competitor.GetSheHe|U] segue [target.GetSheHe] em todos os lugares, como um cachorrinho perdido. As tentativas [competitor.GetHerHim|U] de encantar [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetLadyLord] são risíveis, mas temo que sua persistência seja recompensada."
 court_ongoing.1110.t:0 "$court_event_title$ Competição"
 court_ongoing.1111.a.duel_failure:0 "Pobre [owner.GetTitledFirstNameNoTooltip]! Deixe-me cuidar dos seus machucados."
 court_ongoing.1111.a.poison_failure:0 "[owner.GetTitledFirstNameNoTooltip] nunca usaria truques tão desprezíveis!"
 court_ongoing.1111.a.success:0 "Ah, [owner.GetTitledFirstNameNoTooltip]! Que herói!"
 court_ongoing.1111.b.duel_success:0 "Brigas infantis #EMP não#! me impressionam."
 court_ongoing.1111.b.poison_failure:0 "Como você pôde, [owner.GetTitledFirstNameNoTooltip]?!?"
 court_ongoing.1111.b.poison_success:0 "Me deixe em paz! Eu posso me virar sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]!"
 court_ongoing.1111.b:0 "O ciúme não lhe cai bem, [owner.GetTitledFirstNameNoTooltip]."
 court_ongoing.1111.c.duel_failure:0 "Ah, [competitor.GetTitledFirstNameNoTooltip]! Que corajos[Select_CString( competitor.IsFemale, 'a', 'o' )] você é!"
 court_ongoing.1111.c:0 "Pobre [competitor.GetTitledFirstNameNoTooltip]! Meu coração dói por você!"
 court_ongoing.1111.d:0 "Já tive o bastante de vocês dois!"
 court_ongoing.1111.duel_failure.desc:0 "[owner.GetTitledFirstNameNoTooltip] não aceitou bem a atenção de [competitor.GetFirstNamePossessiveNoTooltip]. [owner.GetSheHe|U] desafiou [competitor.GetFirstNameNoTooltip] para um duelo! Quando cheguei lá, a coisa já tinha acabado; [competitor.GetTitledFirstNameNoTooltip] ficou triunfante sobre seu inimigo espancado."
 court_ongoing.1111.duel_success.desc:0 "[owner.GetTitledFirstNameNoTooltip] não aceitou bem a atenção de [competitor.GetFirstNamePossessiveNoTooltip]. [owner.GetSheHe|U] desafiou [competitor.GetFirstNameNoTooltip] para um duelo! Quando cheguei lá, a coisa já tinha acabado; [owner.GetTitledFirstNameNoTooltip] ficou triunfante sobre seu inimigo espancado."
 court_ongoing.1111.poison_failure.desc:0 "Agora [competitor.GetTitledFirstNameNoTooltip] me conta que [owner.GetTitledFirstNameNoTooltip] enlouqueceu de ciúmes e tentou envenená-lo!"
 court_ongoing.1111.poison_success.desc:0 "Mas esta noite, no jantar, [competitor.GetTitledFirstNameNoTooltip] bebeu demais e vomitou em meu vestido! Sem perder um segundo, [owner.GetTitledFirstNameNoTooltip] entrou em ação para me salvar da bagunça."
 court_ongoing.1111.start.desc:0 "[owner.GetTitledFirstName] não é [Select_CString( owner.IsFemale, 'a única', 'o único' )] tentando ganhar minha aprovação. Cada vez mais, sou abordad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por [competitor.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] e os elogios [competitor.GetHerHim] têm passado de educados a íntimos.\n\n"
 court_ongoing.1111.t:0 "Popular"
 court_ongoing.1112.a:0 "Outro inimigo vencido!"
 court_ongoing.1112.desc:0 "[competitor.GetTitledFirstName] não teve chance contra o meu poder! Sua derrota certamente foi embaraçosa — e m[Select_CString( target.IsFemale, 'inha', 'eu' )] [target.Custom('LoverPetName')] [target.GetFirstName] viu tudo! [target.GetSheHe|U] não deu atenção a [competitor.GetSheHe] desde então."
 court_ongoing.1113.a:0 "Vamos esquecer tudo isso..."
 court_ongoing.1113.b:0 "Eu vou me vingar! Confie em minhas palavras!"
 court_ongoing.1113.desc:0 "Parece que subestimei as habilidades de [competitor.GetTitledFirstNamePossessive] — minha derrota em suas mãos foi dolorosa e embaraçosa na mesma medida. Meu único consolo é que [target.GetTitledFirstName] não estava lá para testemunhar."
 court_ongoing.1114.a:0 "[target.GetSheHe|U] nunca mais olhará para o lado [competitor.GetHerHim]!"
 court_ongoing.1114.desc:0 "Nada se compara à satisfação de um plano perfeitamente executado!\n\nNinguém percebeu quando eu coloquei o veneno na taça de [competitor.GetTitledFirstNamePossessive], e o espetáculo que se seguiu não será esquecido tão cedo! [competitor.GetSheHe|U] vomitou por toda a [target.GetFirstNamePossessive] [target.Custom('GetClothingArticle')] e [target.GetSheHe] ficou imensamente grat[Select_CString( target.IsFemale, 'a', 'o' )] quando eu apareci para salvá-l[Select_CString( target.IsFemale, 'a', 'o' )] da bagunça."
 court_ongoing.1115.a:0 "Não é o que parece..."
 court_ongoing.1115.desc:0 "Acontece que [competitor.GetTitledFirstName] é muito mais perspicaz do que eu lhe dei crédito. [competitor.GetSheHe|U] me pegou em flagrante quando eu tentei envenenar sua taça e me denunciou imediatamente!"
 court_ongoing.1116.a:0 "Pelo menos [competitor.GetSheHe] não estará cortejando [target.GetFirstNameNoTooltip] novamente."
 court_ongoing.1116.desc:0 "A primeira parte do meu plano correu perfeitamente. Ninguém me viu quando eu coloquei o veneno na taça de [competitor.GetTitledFirstNamePossessive]. No entanto, parece que subestimei a sua potência.\n\nApenas alguns segundos depois de [competitor.GetFirstNameNoTooltip] levar a bebida aos lábios, [competitor.GetSheHe] começou a sufocar! Antes que alguém pudesse ajudar, [competitor.GetSheHe] desabou na comida, mort[Select_CString( competitor.IsFemale, 'a', 'o' )] como uma porta."
 court_ongoing.1120.a.failure:0 "A conversa é extremamente entediante"
 court_ongoing.1120.a:0 "Uma pequena #EMP \"distração\"#! parece apropriada."
 court_ongoing.1120.b:0 "Meu charme melhora qualquer conversa!"
 court_ongoing.1120.c:0 "Eu assumirei o lugar [target.GetHerHim]. É melhor que eu sofra em vez [target.GetHerHim]."
 court_ongoing.1120.d:0 "\"Chega! Você está entediando [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetLadyLord] até a morte!\""
 court_ongoing.1120.desc:0 "Estou participando de um baile em [target_location.GetNameNoTooltip] para passar um tempo com [target.GetTitledFirstName]. A simples ideia de tocar suas mãos faz meu coração saltar! Mas quando chego lá, encontro [target.GetSheHe] pres[Select_CString( target.IsFemale, 'a', 'o' )] em uma conversa com [unpleasant_guest.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)].\n\n[Select_CString( unpleasant_guest.IsFemale, 'A', 'O' )] [unpleasant_guest.GetWomanMan] [unpleasant_guest.Custom2('InsultAdjective', ROOT.Char)] fala sem parar, completamente alhei[Select_CString( unpleasant_guest.IsFemale, 'a', 'o' )] ao desconforto de [target.GetFirstNamePossessiveNoTooltip]."
 court_ongoing.1120.e:0 "Eu não vou chegar nem perto dess[Select_CString( unpleasant_guest.IsFemale, 'a', 'e' )] [unpleasant_guest.GetWomanMan]!"
 court_ongoing.1120.t:0 "$court_event_title$ $court_ongoing.1121.t$"
 court_ongoing.1121.a.critical_success:0 "Você aprende um novo truque de diplomacia"
 court_ongoing.1121.a.success:0 "Seu entendimento em diplomacia aumenta"
 court_ongoing.1121.a:0 "Uma lição útil, embora desagradável, em diplomacia!"
 court_ongoing.1121.b.critical_success:0 "Você aprende um novo truque de intriga"
 court_ongoing.1121.b.success:0 "Seu entendimento em intriga aumenta"
 court_ongoing.1121.b:0 "Uma lição útil, embora desagradável, em subterfúgio!"
 court_ongoing.1121.c.failure:0 "[unpleasant_guest.GetShortUIName|U] fica insultad[Select_CString( unpleasant_guest.IsFemale, 'a', 'o' )]"
 court_ongoing.1121.c.success:0 "[unpleasant_guest.GetShortUIName|U] aprecia sua honestidade"
 court_ongoing.1121.c:0 "\"De fato, já tive o bastante.\""
 court_ongoing.1121.d:0 "Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] tem tempo para todos. [owner.GetFirstNameNoTooltip] deveria saber disso."
 court_ongoing.1121.diplomacy.desc:0 "\"Boa noite,\" saúda uma voz familiar — [owner.GetTitledFirstName] se junta à conversa. [owner.GetSheHe|U] é um[Select_CString( owner.IsFemale, 'a', '' )] ouvinte atent[Select_CString( owner.IsFemale, 'a', 'o' )], e em breve a atenção de [unpleasant_guest.GetFirstNameNoTooltip] está completamente voltada para [owner.GetSheHe]. Estou livre para escapar."
 court_ongoing.1121.e:0 "Eu não vou ficar nem mais um momento do que tenho que ficar!"
 court_ongoing.1121.insult.desc:0 "\"Acho que [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetLadyLord] já teve o bastante,\" interrompe um[Select_CString( owner.IsFemale, 'a', '' )] [owner.GetWomanMan] — é [owner.GetTitledFirstName]! \"Você não percebe que está entediando [ROOT.Char.GetSheHe], [unpleasant_guest.Custom2('RelationToMeAddress', owner)]?\""
 court_ongoing.1121.intrigue.desc:0 "\"Minhas mais profundas desculpas, mas há uma situação urgente que precisa da sua atenção, [unpleasant_guest.Custom2('RelationToMeAddress', owner)].\" A voz familiar pertence a ninguém menos que [owner.GetTitledFirstName]. [owner.GetSheHe|U] pisca para mim enquanto faz um gesto para [unpleasant_guest.GetFirstNameNoTooltip] segui-l[Select_CString( unpleasant_guest.IsFemale, 'a', 'o' )]."
 court_ongoing.1121.start.desc:0 "Quando enviei os convites para um baile, estava ansios[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por uma noite de boa companhia e diversão frívola. Em vez disso, me encontro pres[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] em uma conversa terrível com [unpleasant_guest.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]...\n\n"
 court_ongoing.1121.t:0 "Prazer Desagradável"
 court_ongoing.1201.a:0 "Dormir — proteja-me de pesadelos!"
 court_ongoing.1201.a_failure:0 "[owner.GetSheHe|U] falha em seu dever"
 court_ongoing.1201.a_success:0 "[owner.GetSheHe|U] vigia me permite dormir tranquilamente"
 court_ongoing.1201.b:0 "Comida — seu amor por mim deve ser suficiente como sustento."
 court_ongoing.1201.b_success:0 "[owner.GetSheHe|U] prova sua devoção"
 court_ongoing.1201.c:0 "Não tenho interesse em testar [owner.GetSheHe]."
 court_ongoing.1201.desc:0 "\"[target.GetLadyLord|U] [target.GetFirstName], deixe-me provar minha devoção a você de qualquer maneira que você considere adequada!\" [owner.GetTitledFirstName] implora para que eu crie um teste de sua devoção — um desafio ao meu gosto. [owner.GetSheHe|U] terá que se abster por vários dias de..."
 court_ongoing.1201.t:0 "O Pedido"
 court_ongoing.1211.a.failure:0 "A tentação do sono te vence"
 court_ongoing.1211.a.success:0 "Você consegue ficar acordad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]"
 court_ongoing.1211.a:0 "Você dormirá sem ser perturbad[Select_CString( target.IsFemale, 'a', 'o' )]!"
 court_ongoing.1211.b.failure:0 "[target.GetSheHe|U] percebe a decepção"
 court_ongoing.1211.b.success:0 "Ninguém descobre a farsa"
 court_ongoing.1211.b.tt:0 "Uma vassoura com minha capa por cima pode afastar pesadelos tão bem."
 court_ongoing.1211.b:0 "Deixe-me dormir sem ser perturbad[Select_CString( target.IsFemale, 'a', 'o' )] e eu ficarei de guarda."
 court_ongoing.1211.c:0 "Eu não farei isso."
 court_ongoing.1211.desc:0 "\"Tenho sido atormentad[Select_CString( target.IsFemale, 'a', 'o' )] por pesadelos ultimamente. Se você realmente é devot[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a mim, você ficará de guarda do lado de fora das minhas câmaras e se certificará de que nenhum mal me alcance.\""
 court_ongoing.1211.desc_opening:0 "\"[target.GetLadyLord|U] [target.GetFirstName], deixe-me provar minha devoção a você de qualquer maneira que você considere adequada!\"\n\n[target.GetFirstNameNoTooltip] reflete sobre o pedido por um tempo antes que seu rosto se ilumine."
 court_ongoing.1211.t:0 "$court_event_title$ O Pedido"
 court_ongoing.1212.a:0 "Meu bravo guardião!"
 court_ongoing.1212.desc:0 "À medida que o sol se levanta após mais uma noite de bom sono, só posso agradecer [Select_CString( owner.IsFemale, 'a', 'ao' )] [owner.GetTitledFirstName] por ficar de guarda do lado de fora das minhas câmaras, mantendo meu descanso tranquilo e sem perturbações."
 court_ongoing.1213.a:0 "Meu bravo guardião..."
 court_ongoing.1213.desc:0 "Assim que estou prestes a dormir, no meio da noite mais escura, de repente ouço um #EMP estrondo#! alto! Olhando para fora das minhas câmaras, vejo nada menos que [owner.GetTitledFirstName], dormindo profundamente no chão."
 court_ongoing.1214.desc:0 "\n\nEu até espreitei a porta algumas vezes para encontrá-l[Select_CString( target.IsFemale, 'a', 'o' )] de pé, rígid[Select_CString( target.IsFemale, 'a', 'o' )] e sem balançar."
 court_ongoing.1215.a:0 "[owner.GetSheHe|U] pretendia me enganar!"
 court_ongoing.1215.desc:0 "Assim que estou prestes a dormir, no meio da noite mais escura, de repente ouço um #EMP estrondo#! alto! Olhando para fora das minhas câmaras, vejo a capa vazia de [owner.GetTitledFirstName], um capacete e uma vassoura caídos no chão."
 court_ongoing.1221.a.failure:0 "Você cede às necessidades do seu corpo"
 court_ongoing.1221.a.success:0 "Você consegue evitar a necessidade de alimento"
 court_ongoing.1221.a:0 "Minha devoção me levará adiante!"
 court_ongoing.1221.b.tt:0 "Mas eu não vou recusar um pedaço, ou um pedacinho..."
 court_ongoing.1221.b:0 "Nem um pedaço passará por estes lábios!"
 court_ongoing.1221.desc:0 "\"Você deveria ser capaz de se sustentar apenas com seu amor por mim por muitos dias.\""
 court_ongoing.1222.a:0 "[Select_CString( owner.IsFemale, 'Minha devota', 'Meu devoto' )] [owner.GetLadyLord]!"
 court_ongoing.1222.desc:0 "[owner.GetTitledFirstName] ficou cada vez mais magr[Select_CString( owner.IsFemale, 'a', 'o' )] a cada dia que passava, mas mesmo assim a vontade e a devoção [owner.GetHerHim] se mantiveram fortes.\n\nEu encontro [owner.GetSheHe] para declarar que o desafio foi vencido, e a primeira coisa a passar pelos lábios [owner.GetHerHim] é outra promessa de fidelidade."
 court_ongoing.1223.a:0 "Vejo que você encontrou outra fonte de sustento..."
 court_ongoing.1223.desc:0 "[owner.GetTitledFirstName] ficou cada vez mais magr[Select_CString( owner.IsFemale, 'a', 'o' )] a cada dia que passava."
 court_ongoing.1223.desc_ending:0 "Mas, enquanto procuro por [owner.GetSheHe] para declarar que o desafio foi vencido, encontro [owner.GetSheHe] na despensa, coberto(a) de migalhas e devorando uma roda inteira de queijo."
 court_ongoing.1225.desc:0 "[owner.GetTitledFirstName] parece estar lidando bem com o jejum, e ao procurá-l[Select_CString( owner.IsFemale, 'a', 'o' )] para expressar minha surpresa e admiração, descubro como.\n\nA capa inteira [owner.GetHerHim] está recheada de comida! Pela expressão envergonhada [owner.GetHerHim], fica claro que eu não era para ver isso..."
 court_ongoing.court_start_poem_love_letter.0502.desc:0 "[owner.Custom2('love_letter', SCOPE.sC('target'))]\n\nEsses versos são apenas um reflexo pálido dos meus sentimentos por você. Farei qualquer coisa para provar minha leal devoção."
 court_ongoing.court_start_poem_love_letter.intro.0503.desc:0 "A vela está queimando baixo quando finalmente termino meu poema. Antes de enviá-lo, leio-o mais uma vez.\n\n\"[owner.Custom2('love_letter', SCOPE.sC('target'))]\""
 court_ongoing.court_start_sneaky_love_letter.compliment.0502.desc:0 "[ROOT.Char.Custom('RomanticComplimentNoun')]"
 court_ongoing.court_start_sneaky_love_letter.end.0502.desc:0 "[ROOT.Char.GetLadyLord|U] do meu coração! Eu não consigo mais manter meus sentimentos em segredo. A partir de hoje, farei tudo ao meu alcance para provar minha leal devoção.\"\n\n\"Nos veremos em breve. Até lá, sonhe comigo, meu amor. Eternamente seu, [owner.GetTitledFirstName].\""
 court_ongoing.court_start_sneaky_love_letter.intro.0503.desc:0 "Minha declaração de amor é apenas para os olhos de [target.GetTitledFirstNamePossessive]. Mais ninguém importa! Eu derramo meu coração, página após página, meus sentimentos crescendo enquanto finalmente os coloco em palavras. A tinta mal secou quando saio para os aposentos de [target.GetFirstNamePossessive].\n\nColoco suavemente o pergaminho em sua almofada. Será que [target.GetSheHe] vai deitar-se aqui esta noite, sonhando comigo?"
 court_ongoing.court_start_sneaky_love_letter.relative.0502.desc:0 "[owner.Custom2('RelationToMeShort', ROOT.Char)]"
 court_ongoing.court_start_sneaky_love_letter.start.0502.desc:0 "Ao afastar as folhas da cama para me deitar, encontro um pequeno pergaminho repousando em meu travesseiro. Alguém entrou em meus aposentos despercebido? Um arrepio percorre minha espinha enquanto desenrolo cuidadosamente o pergaminho espesso.\n\n\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom('RomanticComplimentAdjective')]"
 court_ongoing.court_start_sneaky_love_letter.success.0503.desc:0 "\n\nA espera é insuportável. O pensamento da rejeição me deixa doente! Quando a resposta [target.GetHerHim] chega, eu quebro o selo com mãos trêmulas.\n\n\"Embora eu não possa encorajá-lo, [owner.Custom2('RelationToMeAddress', ROOT.Char)], sou muito grato por suas palavras gentis. Fielmente seu, [target.GetFirstNameNoTooltip].\""
 court_ongoing.court_start_song.bad.0502.desc:0 "Para minha grande decepção, [Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetWomanMan] diante de mim não consegue cantar uma nota. Leva um tempo para eu conseguir identificar a música - é uma famosa balada de amor [target.GetCulture.GetNameNoTooltip]. [owner.GetSheHe|U] alterou a letra incluindo meu nome e menções à minha aparência física, estragando ainda mais o ritmo."
 court_ongoing.court_start_song.good.0502.desc:0 "Reconheço rapidamente a melodia - é uma famosa balada de amor [target.GetCulture.GetNameNoTooltip]. Já a ouvi ser tocada inúmeras vezes, mas nunca com tamanha habilidade e paixão!\n\nAs intensas emoções da música se refletem no olhar de [owner.GetFirstNamePossessiveNoTooltip], que está fixado em mim. [owner.GetSheHe|U] não desvia o olhar nem por um único momento."
 court_ongoing.court_start_song.intro.0503.desc:0 "Encontrei uma clássica balada de amor [target.GetCulture.GetNameNoTooltip] que combina perfeitamente com [target.GetFirstName]! Eu a pratico repetidas vezes - tudo deve ser perfeito!\n\nEncontro [target.Custom('LoverPetName')] passeando nos jardins de [target_location.GetNameNoTooltip], rodeado por seus amigos. Com o coração batendo como um martelo, eu me ajoelho diante [target.GetHerHim] e canto."
 court_ongoing.court_start_song.start.0502.desc:0 "Estou passeando pelos jardins com algumas d[Select_CString( ROOT.Char.IsFemale, 'as', 'os' )] [ROOT.Char.Custom('LadiesLords')] na corte quando percebo [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] se aproximando. Eu me afasto para deixar [owner.GetSheHe] passar, mas para minha grande surpresa, [owner.GetSheHe] bloqueia meu caminho e se ajoelha diante de mim!\n\nAntes que eu tenha tempo para processar adequadamente essa reviravolta, [owner.GetTitledFirstNameNoTooltip] começa a cantar.\n\n"
 court_ongoing.court_start_song.success.0503.desc:0 "\n\nAs bochechas de [target.GetFirstNamePossessiveNoTooltip] ficam vermelhas como romã, mas [target.GetSheHe|U] não me interrompe. Seus companheiros todos parecem satisfeitos, ou com ciúmes - com certeza um bom sinal!\n\n\"Você tem uma bela voz, [ROOT.Char.Custom('FormOfAddressForLiege')],\" diz [target.GetFirstNameNoTooltip] antes de [target.GetSheHe|U] se apressar. Seus amigos o seguem rapidamente. Eu me levanto com as pernas trêmulas, observando-os desaparecer entre as sebes, meu coração batendo mais forte do que nunca."
 court_ongoing.court_start_sparring.bad.0502.desc:0 "luta de treino desajeitada. Eu tento não fazer careta enquanto um deles tropeça após um golpe desnecessariamente forte."
 court_ongoing.court_start_sparring.end.0502.desc:0 "\n\nCom um último ataque imprudente, um dos lutadores desarma o outro. Para minha surpresa, [owner.GetSheHe] se ajoelha diante de mim e retira seu capacete. É [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\n\"Dedico esta vitória a você, [ROOT.Char.GetTitledFirstNameNoTooltip],\" diz [owner.GetSheHe|U] solenemente. \"Trazer honra a você é meu único desejo!\""
 court_ongoing.court_start_sparring.good.0502.desc:0 "luta de treino vigorosa. Ambos foram sem dúvida testados no campo de batalha."
 court_ongoing.court_start_sparring.great.0502.desc:0 "luta de treino impressionante. Nunca vi tamanha habilidade com [owner.Custom('SignatureWeaponArticle')] [owner.Custom('signature_weapon')]! Não consigo desviar o olhar!"
 court_ongoing.court_start_sparring.other_locaton_intro.0503.desc:0 "Recruto um dos meus soldados mais experientes e partimos para [target_location.GetNameNoTooltip]. Praticamos nossa rotina após cada dia de viagem.\n\nAssim que chegamos, começamos a lutar no pátio principal. Uma multidão se forma, e seus aplausos logo atraem ninguém menos que [Select_CString( target.IsFemale, 'a', 'o' )] [target.Custom('RomanticComplimentAdjective')] [target.GetTitledFirstName].\n\nO soldado luta bravamente, mas eu desarmo [sparring_soldier.GetSheHe] com um golpe final e impecável. Eu me ajoelho diante de [target.GetFirstNameNoTooltip] e declaro minhas nobres intenções. \"Dedico esta vitória a você, [target.Custom2('RelationToMeAddress', ROOT.Char)]. Trazer honra a você é meu único desejo!\"\n\n"
 court_ongoing.court_start_sparring.same_locaton_intro.0503.desc:0 "Recruto um dos meus soldados mais experientes e pratico com [sparring_soldier.GetSheHe] por três dias seguidos. Uma vez que [sparring_soldier.GetSheHe] me considera pronto, seguimos juntos para o pátio principal.\n\nÀ medida que começamos a lutar, uma multidão se forma, e seus aplausos logo atraem ninguém menos que [Select_CString( target.IsFemale, 'a', 'o' )] [target.Custom('RomanticComplimentAdjective')] [target.GetTitledFirstName].\n\nO soldado luta bravamente, mas eu desarmo [sparring_soldier.GetSheHe] com um golpe final e impecável. Eu me ajoelho diante de [target.GetFirstNameNoTooltip] e declaro minhas nobres intenções. \"Dedico esta vitória a você, [target.GetTitledFirstNameNoTooltip]. Trazer honra a você é meu único desejo!\"\n\n"
 court_ongoing.court_start_sparring.start.0502.desc:0 "O clangor das armas e os gritos empolgados me atraem em direção ao pátio. O que está acontecendo?\n\nEncontro dois guerreiros armados envolvidos em uma"
 court_ongoing.court_start_sparring.success.0503.desc:0 "Meu [ROOT.Char.Custom('LoverPetName')] está sem palavras, mas claramente lisonjeado. Por que [target.GetSheHe] estaria sorrindo assim?"
 court_ongoing.public_incest_rejection.0503.desc:0 "A reação de [target.GetFirstNamePossessiveNoTooltip] não é o que eu esperava. \"O que você está sugerindo? Eu sou s[Select_CString( target.IsFemale, 'ua', 'eu' )] #EMP [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))]#!!\""
 court_ongoing.public_regular_rejection.0503.desc:0 "A reação de [target.GetFirstNamePossessiveNoTooltip] não é o que eu esperava. \"Não se envergonhe ainda mais, [ROOT.Char.Custom2('RelationToMeAddress', target)]. Eu preferiria comer minhas próprias [target.Custom('GetClothingArticle')] do que passar mais um minuto em sua presença!\""
 court_ongoing.public_sodomy_rejection.0503.desc:0 "A reação de [target.GetFirstNamePossessiveNoTooltip] não é o que eu esperava. \"Você enlouqueceu, [ROOT.Char.Custom2('RelationToMeAddress', target)]?! O que exatamente você está sugerindo?"
 court_ongoing.written_incest_rejection.0503.desc:0 "\n\nA resposta de [target.GetFirstNamePossessiveNoTooltip] é rápida e inequívoca. \"Você sempre foi estranho, mas isso? Uma declaração de paixão [Select_CString( target.IsFemale, 'a sua própria', 'ao seu próprio' )] #EMP [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))]#!? A mera ideia de nós juntos me deixa doente!\""
 court_ongoing.written_regular_rejection.0503.desc:0 "\n\nA resposta de [target.GetFirstNamePossessiveNoTooltip] é rápida e inequívoca. \"Tenho a mais profunda gratidão por sua mensagem. Certamente me fez dar boas risadas! Que ideia absurda, que meu coração ansiaria por #EMP você#!!\""
 court_ongoing.written_sodomy_rejection.0503.desc:0 "\n\nA resposta de [target.GetFirstNamePossessiveNoTooltip] é rápida e inequívoca. \"Você está louco? Você sabe o quão perigosas suas palavras seriam se caíssem em mãos erradas? Eu lhe peço — desista imediatamente deste empreendimento tolo!\""
