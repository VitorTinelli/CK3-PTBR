l_spanish:
 befriend_ongoing.0901.a:0 "O mundo é cruel e repentino."
 befriend_ongoing.0901.desc:0 "Recebi uma notícia chocante. [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] faleceu.\n\nComo o destino quis, nunca poderei desfrutar da amizade [target.GetHerHim]."
 befriend_ongoing.0901.t:0 "Fazer Amizade: O Que Poderia Ter Sido"
 befriend_ongoing.0902.a.other:0 "Infelizmente."
 befriend_ongoing.0902.a:0 "Por que não!? Sou [Select_CString( ROOT.Char.IsFemale, 'uma ótima captora', 'um ótimo captor' )]!"
 befriend_ongoing.0902.desc.other:0 "[target.Custom2('MyCharacterIntroduction', ROOT.Char)|U] foi aprisionad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por [imprisoner.Custom2('MyCharacterIntroduction', ROOT.Char)]! Enquanto [target.GetSheHe] permanecer cativ[Select_CString( target.IsFemale, 'a', 'o' )], não poderei conquistar a amizade [target.GetHerHim]."
 befriend_ongoing.0902.desc:0 "Eu prendi [target.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\nEmbora [target.GetSheHe] agora tenha todo o tempo do mundo para passar comigo, enquanto [target.GetSheHe] permanecer em cativeiro, é improvável que [target.GetSheHe] esteja receptivo às minhas tentativas de conquistar a amizade [target.GetHerHim]."
 befriend_ongoing.0902.t.other:0 "Fazer Amizade: Trancado"
 befriend_ongoing.0902.t:0 "Fazer Amizade: Audiência Cativa"
 befriend_ongoing.0903.a.tt:0 "Encerrei meu Plano de Fazer Amizade com [target.GetTitledFirstNameNoTooltip]"
 befriend_ongoing.0903.a:0 "Vamos esperar por tempos melhores."
 befriend_ongoing.0903.desc:0 "Enquanto nossos reinos se enfrentam em batalha, meu sonho de magnanimidade e companheirismo com [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] parece impossível, pelo menos por enquanto."
 befriend_ongoing.0903.t:0 "Fazer Amizade: Guerra e Amizade"
 befriend_ongoing.1001.a:0 "[target.GetSheHe|U] ficará imensamente impressionad[Select_CString( target.IsFemale, 'a', 'o' )] com as minhas conquistas!"
 befriend_ongoing.1001.b:0 "Vou focar nas realizações de [target.GetFirstNamePossessiveNoTooltip]."
 befriend_ongoing.1001.c:0 "Vou garantir que #EMP todos#! saibam da minha grandeza!"
 befriend_ongoing.1001.desc.end:0 "Estou convencid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] de que [target.GetTitledFirstName] também conquistou algumas coisas que enchem [target.GetSheHe] de orgulho.\n\nTalvez eu deva encomendar um pequeno poema comparando nossas façanhas, para ilustrar que somos feitos do mesmo tecido."
 befriend_ongoing.1001.desc.starthumble:0 "Embora eu raramente mencione isso, tenho algumas realizações das quais me orgulho."
 befriend_ongoing.1001.desc.startnormal:0 "Considerando as façanhas da minha vida, é natural que os outros me respeitem."
 befriend_ongoing.1001.t:0 "Fazer Amizade: Respeito em Admiração"
 befriend_ongoing.1002.a:0 "Não é hora de ser econômico."
 befriend_ongoing.1002.b:0 "É o pensamento que conta."
 befriend_ongoing.1002.c:0 "Não, não quero parecer muito intens[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 befriend_ongoing.1002.d:0 "Vou encontrar algo verdadeiramente extravagante!"
 befriend_ongoing.1002.desc.benevolent:0 "Encontrar o presente perfeito para alguém pode realmente mostrar o quanto você se importa com essa pessoa."
 befriend_ongoing.1002.desc.generic:0 "\n\nSe isso me aproximar do meu objetivo, é dinheiro bem gasto. "
 befriend_ongoing.1002.desc.greedy:0 "Todo mundo adora presentes!"
 befriend_ongoing.1002.desc.malicious:0 "As pessoas são facilmente manipuladas com bugigangas brilhantes..."
 befriend_ongoing.1002.desc.start:0 "Deveria ser capaz de ajudar minha tentativa de fazer amizade com [target.GetTitledFirstName] ao presenteá-l[Select_CString( target.IsFemale, 'a', 'o' )] com um presente.\n\n"
 befriend_ongoing.1002.t:0 "Fazer Amizade: Um Gestor de Generosidade"
 befriend_ongoing.1003.a:0 "E ele estará pegando fogo!"
 befriend_ongoing.1003.b:0 "Não preciso antagonizar ainda mais [rival.GetFirstNameNoTooltip]."
 befriend_ongoing.1003.desc:0 "Uma coisa que [target.GetTitledFirstName] e eu compartilhamos é o ódio por [rival.GetTitledFirstName].\n\nSeria uma mensagem poderosa ter um boneco do meu inimigo feito, para exibi-lo pendurado nas paredes da próxima vez que [target.GetFirstNameNoTooltip] retornar a [barony.GetTitledFirstNameNoTier]."
 befriend_ongoing.1003.t:0 "Fazer Amizade: O Inimigo do Meu Inimigo"
 befriend_ongoing.1004.a:0 "Fico feliz em ver que estamos de acordo em relação a [rival.GetSheHe]!"
 befriend_ongoing.1004.desc:0 "Em minha última visita ao [barony.GetNameNoTooltip] de [owner.GetTitledFirstNamePossessive], uma visão surpreendente me aguardava ao me aproximar da [barony.Custom('BaronyTownType')]. Pendurado nas paredes, encontrei um boneco que reconheci imediatamente como nosso inimigo em comum, [rival.GetTitledFirstName]!\n\n[owner.GetFirstNameNoTooltip] gritou saudações para mim enquanto [owner.GetSheHe] derramava piche quente sobre \"[rival.GetFirstNameNoTooltip].\""
 befriend_ongoing.1004.t:0 "O Inimigo do Meu Inimigo"
 befriend_ongoing.1005.a:0 "Eu sabia que tinha boas razões para odiá-los."
 befriend_ongoing.1005.desc:0 "O arauto está hesitante em compartilhar os rumores.\n\n\"Parece que seus inimigos, [owner.GetTitledFirstName] e [target.GetTitledFirstName], têm queimado uma efígie de você pendurada nas paredes de [barony.GetNameNoTooltip], enquanto zombam do seu nome.\"\n\nJuntos, eles são dez vezes piores do que jamais foram sozinhos."
 befriend_ongoing.1005.t:0 "O Amigo do Meu Inimigo"
 befriend_ongoing.2001.a:0 "Excelente. Vou deixar [target.GetSheHe] se aproximar de mim."
 befriend_ongoing.2001.b:0 "Não vou recusar esse tipo de convite!"
 befriend_ongoing.2001.desc:0 "Eu achava que teria que trabalhar para fazer [target.GetTitledFirstName] gostar de mim, mas [target.GetSheHe] se revelou a pessoa mais amigável que conheço!\n\n[target.GetFirstNameNoTooltip] me disse que sempre há lugar junto à lareira [target.GetHerHim] para novos conhecidos."
 befriend_ongoing.2001.t:0 "Fazer Amizade: O Calor da Amizade"
 befriend_ongoing.3001.a:0 "[befriend_envoy.GetSheHe|U] deve se aproximar de [target.GetFirstNameNoTooltip] diretamente."
 befriend_ongoing.3001.b:0 "Há muito em jogo para depender de [befriend_envoy.GetFirstNameNoTooltip]."
 befriend_ongoing.3001.desc:0 "[befriend_envoy.GetTitledFirstName], que está me ajudando em minha tentativa de me aproximar de [target.GetTitledFirstName], ofereceu-se para atuar como um enviado entre nós. [befriend_envoy.GetSheHe|U] acredita que [befriend_envoy.GetSheHe] pode me apresentar de forma brilhante."
 befriend_ongoing.3001.t:0 "Fazer Amizade: Um Elo na Cadeia"
 befriend_ongoing.3001.tt:0 "#F [befriend_envoy.GetFirstName] buscará uma audiência com [target.GetFirstName]#!"
 befriend_ongoing.3002.a:0 "Estranho, mas eu recebo [befriend_envoy.GetSheHe] para me falar sobre [owner.GetFirstNameNoTooltip]."
 befriend_ongoing.3002.b:0 "Nenhum súdito meu atuará como enviado para outra pessoa!"
 befriend_ongoing.3002.desc:0 "Embora não seja incomum que [Select_CString( befriend_envoy.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('befriend_envoy'))] [befriend_envoy.GetTitledFirstName] solicite uma audiência comigo, o motivo desta vez é realmente estranho. [befriend_envoy.GetSheHe|U] se declarou um[Select_CString( befriend_envoy.IsFemale, 'a', '' )] enviad[Select_CString( befriend_envoy.IsFemale, 'a', 'o' )] de amizade em nome de [owner.GetTitledFirstName]!"
 befriend_ongoing.3002.t:0 "Um Arranjo Incomum"
 befriend_ongoing.3003.a:0 "À nossa amizade florescente!"
 befriend_ongoing.3003.accepted_envoy:0 "[befriend_envoy.GetTitledFirstName] me trouxe notícias promissoras. [target.GetTitledFirstName] recebeu [befriend_envoy.GetSheHe] calorosamente como um[Select_CString( befriend_envoy.IsFemale, 'a', '' )] \"enviad[Select_CString( befriend_envoy.IsFemale, 'a', 'o' )]\" em nome da minha amizade."
 befriend_ongoing.3003.b:0 "Terei que ser mais cuidados[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 befriend_ongoing.3003.dismissed_envoy:0 "Eu sabia que estava ultrapassando alguns limites ao empregar [Select_CString( befriend_envoy.IsFemale, 'a própria', 'o próprio' )] [scheme.GetTargetCharacter.Custom2('RelationToMe', SCOPE.sC('befriend_envoy') )] de [target.GetTitledFirstNamePossessive], mas esperava que [target.GetSheHe] visse a boa fé por trás do gesto. Como eu estava errado. Nunca deveria ter concordado com o plano de [befriend_envoy.GetTitledFirstNamePossessive]..."
 befriend_ongoing.3003.t:0 "Fazer Amizade: O Enviado Relata"
 befriend_ongoing.3007.a:0 "Contaremos a [target.GetFirstNameNoTooltip] sobre essa visão."
 befriend_ongoing.3007.b:0 "[agent_speaking_highly.GetFirstNameNoTooltip], vamos orar juntos em gratidão."
 befriend_ongoing.3007.desc.conviction:0 "É um milagre! [agent_speaking_highly.GetTitledFirstName] teve uma visão de [agent_speaking_highly.GetFaith.HighGodName]. [agent_speaking_highly.GetSheHe|U] me assegura que [target.GetTitledFirstName] e eu somos divinamente ordenados a ser amigos!"
 befriend_ongoing.3007.desc.doubt:0 "[agent_speaking_highly.GetTitledFirstName] me contou sobre uma visão de [agent_speaking_highly.GetFaith.HighGodName]. Aparentemente, [target.GetTitledFirstName] e eu somos divinamente ordenados a ser amigos. Que vantajoso."
 befriend_ongoing.3007.t:0 "Fazer Amizade: Um Veredicto de [agent_speaking_highly.GetFaith.DivineRealm|U]"
 befriend_ongoing.3009.a.failure:0 "[target.GetFirstNameNoTooltip] continua desinteressad[Select_CString( target.IsFemale, 'a', 'o' )]"
 befriend_ongoing.3009.a.success:0 "As palavras de [spouse.GetFirstNameNoTooltip] influenciam [target.GetFirstNameNoTooltip]"
 befriend_ongoing.3009.a:0 "Ah, não esconda nada, meu bem."
 befriend_ongoing.3009.b.tt:0 "Não posso depender de outros para fazer amigos por mim."
 befriend_ongoing.3009.b:0 "Não, eu vou resolver isso."
 befriend_ongoing.3009.desc:0 "[Select_CString( spouse.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] notou meus esforços para impressionar [target.GetTitledFirstName] e agora [spouse.GetSheHe] vem a mim com uma sugestão.\n\n\"Acredito que minha palavra carrega muito peso com m[Select_CString( target.IsFemale, 'inha', 'eu' )] [spouse.Custom2('RelationToMe', SCOPE.sC('target'))]. Eu poderia dizer o quanto acho você maravilhos[Select_CString( target.IsFemale, 'a', 'o' )].\""
 befriend_ongoing.3009.t:0 "Fazer Amizade: Uma Boa Palavra"
 befriend_ongoing.3010.a:0 "Talvez eu devesse conhecer melhor [owner.GetSheHe]."
 befriend_ongoing.3010.desc:0 "M[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] tem me falado muito sobre s[Select_CString( owner.IsFemale, 'ua', 'eu' )] [spouse.Custom2('RelationToMe', SCOPE.sC('owner'))] ultimamente.\n\nTenho que admitir que [spouse.GetSheHe] faz [owner.GetTitledFirstName] parecer alguém digno do meu respeito."
 befriend_ongoing.3010.t:0 "Uma Boa Palavra"
 befriend_ongoing.3011.a:0 "Sempre posso contar com você, [spouse.GetFirstNameNoTooltip]."
 befriend_ongoing.3011.desc:0 "\"[target.GetTitledFirstName] parece estar mais interessad[Select_CString( target.IsFemale, 'a', 'o' )] em conhecê-lo agora,\" diz m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))]. Parece que o plano [spouse.GetHerHim] deu certo!"
 befriend_ongoing.3012.a:0 "Por que eu sempre confio nos outros?"
 befriend_ongoing.3012.desc:0 "\"Lamento dizer que, apesar de todos os meus esforços, m[Select_CString( target.IsFemale, 'inha', 'eu' )] [spouse.Custom2('RelationToMe', SCOPE.sC('target'))] continuou sem se impressionar com você,\" diz [spouse.GetTitledFirstName]. Parece que o plano [spouse.GetHerHim] não foi tão bom assim."
 befriend_ongoing.3014.a:0 "Quem saberia melhor?"
 befriend_ongoing.3014.desc:0 "Tenho achado [owner.GetTitledFirstName] incomumente amigável comigo ultimamente. No entanto, quando contei a s[Select_CString( spouse.IsFemale, 'ua', 'eu' )] [owner.Custom2('RelationToMe', SCOPE.sC('spouse'))], m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] [spouse.GetFirstName], [spouse.GetSheHe] riu.\n\n\"[owner.GetFirstNameNoTooltip] não é dign[Select_CString( owner.IsFemale, 'a', 'o' )] de sua amizade. Deixe-me contar o que [owner.GetSheHe] realmente é...\""
 befriend_ongoing.3014.t:0 "Uma Reputação Desagradável"
 befriend_ongoing.3015.a:0 "Como você pôde fazer isso?"
 befriend_ongoing.3015.desc:0 "[target.GetTitledFirstName] tem se mostrado um pouco mais fri[Select_CString( target.IsFemale, 'a', 'o' )] comigo, apesar de todos os meus esforços. Parece que [target.GetSheHe] ouviu alguns rumores desagradáveis sobre mim e, para meu choque, eles vieram de s[Select_CString( spouse.IsFemale, 'ua', 'eu' )] [target.Custom2('RelationToMe', SCOPE.sC('spouse'))], [Select_CString( spouse.IsFemale, 'minha própria', 'meu próprio' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))]!\n\n[spouse.GetFirstName] parece não se importar. \"Eu apenas contei a verdade a [target.GetSheHe], #EMP querid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]#!.\""
 befriend_ongoing.3015.t:0 "Fazer Amizade: Calúnia!"
 befriend_ongoing.4000.a.tt:0 "#F Nossos interesses compartilhados podem nos aproximar#!"
 befriend_ongoing.4000.a:0 "Vou me aproximar [target.GetHerHim]."
 befriend_ongoing.4000.b:0 "Encontrarei uma maneira de aproveitá-lo."
 befriend_ongoing.4000.desc:0 "Estou tentando fazer amizade com [target.GetTitledFirstName], e sei que [target.GetSheHe] é [Select_CString( target.IsFemale, 'uma estudiosa dedicada', 'um estudioso dedicado' )] de assuntos militares, assim como eu. Certamente, teríamos muito para discutir."
 befriend_ongoing.4000.t:0 "Fazer Amizade: Nós que Conhecemos a Guerra"
 befriend_ongoing.4002.a:0 "Finalmente, uma conversa interessante!"
 befriend_ongoing.4002.b:0 "[owner.GetTitledFirstNameNoTooltip]? Eu não acho."
 befriend_ongoing.4002.desc:0 "[owner.GetTitledFirstName] se aproxima de mim, mencionando nosso interesse compartilhado em assuntos militares e querendo trocar ideias. [owner.GetSheHe|U] parece estar bem informad[Select_CString( owner.IsFemale, 'a', 'o' )] sobre todos os tópicos relacionados a estratégia e táticas."
 befriend_ongoing.4002.t:0 "Nós que Conhecemos a Guerra"
 befriend_ongoing.4004.a.desc:0 "[target.GetTitledFirstName] e eu passamos um bom tempo discutindo cercos, envolvimentos, ataques de forragem, uso de arqueiros e o correto emprego de armas de cerco. Nós rimos bastante ao ver os curiosos ignorantes balançando a cabeça ao nos ouvirem."
 befriend_ongoing.4004.a:0 "A guerra é realmente a mais nobre das artes."
 befriend_ongoing.4004.b.desc:0 "[target.GetTitledFirstName] respondeu friamente que [target.GetSheHe] não estava realmente interessad[Select_CString( target.IsFemale, 'a', 'o' )] em assuntos militares. Mas eu sei que isso não é verdade."
 befriend_ongoing.4004.b:0 "Decepcionante."
 befriend_ongoing.4010.a:0 "Dois sóis juntos terão o triplo do brilho!"
 befriend_ongoing.4010.desc:0 "Quando pergunto sobre [target.GetTitledFirstName], falam do seu bom humor e charme e da facilidade natural com que domina qualquer reunião social. Parece que temos algo em comum."
 befriend_ongoing.4010.t:0 "Fazer Amizade: Os Sóis Gêmeos"
 befriend_ongoing.4012.a:0 "E [owner.GetSheHe|U] está cert[Select_CString( owner.IsFemale, 'a', 'o' )]!"
 befriend_ongoing.4012.b:0 "[owner.GetSheHe|U] não é tão interessante como [owner.GetSheHe] pensa."
 befriend_ongoing.4012.desc:0 "[owner.GetTitledFirstName] está espalhando dicas óbvias de que gostaria de fazer amizade comigo. [owner.GetSheHe|U] parece ser um[Select_CString( owner.IsFemale, 'a', '' )] natural em socialização e está insinuando que nossos talentos compartilhados nessa área naturalmente nos aproximariam."
 befriend_ongoing.4012.t:0 "Os Sóis Gêmeos"
 befriend_ongoing.4014.a.desc:0 "Após meu convite, [target.GetTitledFirstName] e eu nos encontramos em um evento social. Nos divertimos muito, assim como todos os outros. Foi gratificante ver como o evento inteiro naturalmente começou a se concentrar em nós dois após apenas alguns minutos."
 befriend_ongoing.4014.a:0 "Como moscas ao redor de duas panelas de mel!"
 befriend_ongoing.4014.b.desc:0 "[target.GetTitledFirstName] usou suas consideráveis habilidades sociais com grande efeito, dando uma resposta cruel e desprezível ao meu convite, transmitida através de dicas e sussurros de conhecidos em comum."
 befriend_ongoing.4014.b:0 "Estou impressionad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] e ofendid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ao mesmo tempo."
 befriend_ongoing.4020.a:0 "[target.GetSheHe] conhece o número zero? Preciso descobrir!"
 befriend_ongoing.4020.desc:0 "Percebi que [target.GetTitledFirstName] tem a mesma disposição que eu, pois [target.GetSheHe] compreende e aprecia corretamente a importância de manter seus números em ordem."
 befriend_ongoing.4020.t:0 "Fazer Amizade: Nada a Discutir"
 befriend_ongoing.4022.a:0 "Claro! Será muito esclarecedor!"
 befriend_ongoing.4022.b:0 "Esse número descreve adequadamente meu nível de interesse."
 befriend_ongoing.4022.desc:0 "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] se aproximou de mim, querendo discutir nosso interesse mútuo em administração e números. O número zero é um ponto específico que [owner.GetSheHe] deseja discutir."
 befriend_ongoing.4022.t:0 "Nada a Discutir"
 befriend_ongoing.4024.a.desc:0 "[target.GetTitledFirstName] e eu falamos extensivamente sobre o número zero e sua importância e possibilidades em matemática e administração. Fico feliz por ter encontrado alguém que tem uma visão inteiramente positiva sobre números e compreende seu verdadeiro valor."
 befriend_ongoing.4024.a:0 "Às vezes, é bom falar sobre nada."
 befriend_ongoing.4024.b.desc:0 "[target.GetTitledFirstName] respondeu apenas que o número zero corresponde mais de perto ao nível de interesse [target.GetHerHim] em discutir isso comigo."
 befriend_ongoing.4024.b:0 "Mas minha decepção é infinita."
 befriend_ongoing.4030.a:0 "Vou fazer isso, indiretamente e com astúcia."
 befriend_ongoing.4030.desc:0 "Dizem sobre [target.GetTitledFirstName] que [target.GetSheHe] é bastante hábil em maquinações e manipulação. Talvez eu deva abordar [target.GetSheHe] em uma conversa e descobrir se esse é um ponto em que podemos nos conectar."
 befriend_ongoing.4030.t:0 "Fazer Amizade: A Dança dos Intrigantes"
 befriend_ongoing.4032.a:0 "Vou dar a [owner.GetFirstNameNoTooltip] uma resposta positiva."
 befriend_ongoing.4032.b:0 "[owner.GetSheHe|U] é um tolo, e [owner.GetSheHe] vai perceber isso."
 befriend_ongoing.4032.desc:0 "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] se aproximou de mim, insinuando que [owner.GetSheHe] gostaria de se tornar meu amigo. Claramente, isso está sendo feito como uma forma de jogo ou dança de intriga, onde sou convidado a responder indiretamente."
 befriend_ongoing.4032.t:0 "A Dança dos Intrigantes"
 befriend_ongoing.4034.a.desc:0 "[target.GetTitledFirstName] respondeu positivamente aos meus sinais sutis, e acredito que isso nos aproximou um pouco mais. Ficou provado que temos algo em comum."
 befriend_ongoing.4034.a:0 "Empregar um plano para fazer amizade com um intrigante."
 befriend_ongoing.4034.b.desc:0 "[target.GetTitledFirstName] respondeu aos meus sinais de amizade de maneira insultuosa, se bem que sutil e indireta. Não posso nem responder sem parecer um tolo."
 befriend_ongoing.4034.b:0 "Isso não é o que eu esperava."
 befriend_ongoing.4040.a:0 "Vamos ver o que acontece com isso."
 befriend_ongoing.4040.desc:0 "[target.GetTitledFirstName] parece ser um verdadeiro estudioso, assim como eu. Certamente, há muitos tópicos acadêmicos em que poderíamos conversar. Devo abordar [target.GetSheHe]."
 befriend_ongoing.4040.t:0 "Fazer Amizade: Grandes Mentes"
 befriend_ongoing.4042.a:0 "Sim, deixe duas grandes mentes se encontrarem!"
 befriend_ongoing.4042.b:0 "O que [owner.GetSheHe] poderia ter a dizer que seria interessante?"
 befriend_ongoing.4042.desc:0 "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] se aproximou de mim, insinuando que [owner.GetSheHe] gostaria de se engajar em um discurso acadêmico sobre um tópico de minha escolha. [owner.GetSheHe|U] claramente está tentando fazer amizade comigo."
 befriend_ongoing.4042.t:0 "Grandes Mentes"
 befriend_ongoing.4044.a.desc:0 "[target.GetTitledFirstName] e eu tivemos uma longa conversa sobre a natureza do conhecimento e outros assuntos filosóficos. Sinto que nossas mentes se conectaram e estamos mais próximos de nos tornarmos amigos."
 befriend_ongoing.4044.a:0 "Grandes mentes pensam da mesma forma, afinal."
 befriend_ongoing.4044.b.desc:0 "[target.GetTitledFirstName] deixou claro que [target.GetSheHe] não está interessad[Select_CString( target.IsFemale, 'a', 'o' )] em discutir assuntos acadêmicos comigo. Houve um tom inconfundivelmente desprezível em sua resposta."
 befriend_ongoing.4044.b:0 "Decepcionante."
 befriend_ongoing.4050.a:0 "Será que [target.GetSheHe] mantém uma lista de suas conquistas?"
 befriend_ongoing.4050.desc:0 "Rumores dizem que [target.GetTitledFirstName], assim como eu, é especialista em despertar o fogo do êxtase amoroso nos outros. Parece-me que devemos nos encontrar e comparar nossas experiências."
 befriend_ongoing.4050.t:0 "Fazer Amizade: Caixas de Fósforo"
 befriend_ongoing.4052.a.tee:0 "Sim, vamos compartilhar histórias picantes!"
 befriend_ongoing.4052.a.wine:0 "Sim, vamos compartilhar histórias picantes com um copo de vinho!"
 befriend_ongoing.4052.b:0 "[owner.GetSheHe|U] realmente acha que pode se comparar a mim? Hah!"
 befriend_ongoing.4052.desc:0 "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] se aproximou de mim, fazendo referência ao nosso interesse mútuo em sedução e aventuras amorosas. [owner.GetSheHe|U] gostaria de nos encontrar para comparar nossas experiências e histórias."
 befriend_ongoing.4052.t:0 "Caixas de Fósforo"
 befriend_ongoing.4054.a.desc:0 "[target.GetTitledFirstName] e eu passamos horas conversando e comparando nossas conquistas amorosas. As estranhas e complicadas renderam melhores histórias do que as triviais, embora as últimas fossem mais numerosas."
 befriend_ongoing.4054.a:0 "Descobrimos que ambos perdemos a conta há muito tempo."
 befriend_ongoing.4054.b.desc:0 "[target.GetTitledFirstName] não quis nos encontrar e trocar histórias de conquistas amorosas. [target.GetSheHe|U] disse que não havia como me comparar a [target.GetSheHe]."
 befriend_ongoing.4054.b:0 "Hah! A inveja é uma fera vil!"
 befriend_ongoing.4060.a:0 "Devemos nos encontrar e duelar!"
 befriend_ongoing.4060.desc:0 "Falam da habilidade considerável que [target.GetTitledFirstName] demonstra com uma espada em mãos. Dizem que poucos conseguem se manter firmes por mais que alguns segundos sob os ataques [target.GetHerHim] uma vez que as lâminas são desembainhadas."
 befriend_ongoing.4060.t:0 "Fazer Amizade: Lâminas Similares"
 befriend_ongoing.4062.a:0 "Uma excelente proposta!"
 befriend_ongoing.4062.b:0 "Não, [owner.GetSheHe] não vale meu tempo."
 befriend_ongoing.4062.desc:0 "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U], um devoto da espada assim como eu, se aproximou de mim, desejando um duelo amigável e possivelmente uma conversa sobre nosso tópico favorito."
 befriend_ongoing.4062.t:0 "Lâminas Similares"
 befriend_ongoing.4064.a.desc:0 "[target.GetTitledFirstName] e eu nos encontramos para um duelo, espadas em mãos. Depois de passarmos duas boas horas em nossa ágil dança de investidas e paradas, passamos mais três discutindo técnica e tática."
 befriend_ongoing.4064.a:0 "Poucos entendem a beleza interior da espada."
 befriend_ongoing.4064.b.desc:0 "[target.GetTitledFirstName] deixou bem claro, e de forma mal-educada, que [target.GetSheHe] não tem interesse em me enfrentar em um duelo."
 befriend_ongoing.4064.b:0 "Assim fala um covarde."
 befriend_ongoing.4070.a:0 "Devemos nos encontrar e comparar nossas caçadas!"
 befriend_ongoing.4070.desc:0 "[target.GetTitledFirstName] é um caçador dedicado assim como eu. Tenho certeza de que teríamos muito para conversar e muitas experiências para compartilhar."
 befriend_ongoing.4070.t:0 "Fazer Amizade: Histórias Selvagens"
 befriend_ongoing.4072.a:0 "Qual foi a caça mais difícil de sua vida, eu me pergunto?"
 befriend_ongoing.4072.b:0 "Não estou interessad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] nesse caçador de coelhos."
 befriend_ongoing.4072.desc:0 "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] se aproximou de mim, desejando nos encontrar e discutir nossas experiências como caçadores. É uma oportunidade para compartilhar histórias das aventuras selvagens."
 befriend_ongoing.4072.t:0 "Histórias Selvagens"
 befriend_ongoing.4074.a.desc:0 "[target.GetTitledFirstName] e eu passamos uma noite inteira conversando, trocando histórias e comparando experiências de várias caçadas."
 befriend_ongoing.4074.a:0 "Tenho certeza de que [target.GetSheHe] exagerou em algumas ocasiões."
 befriend_ongoing.4074.b.desc:0 "[target.GetTitledFirstName] respondeu apenas com desprezo à minha abordagem, me chamando de caçador de coelhos."
 befriend_ongoing.4074.b:0 "Então [target.GetSheHe] que seja o coelho."
 befriend_ongoing.4080.a:0 "Isso deve ser feito!"
 befriend_ongoing.4080.desc:0 "[target.GetTitledFirstName] é conhecido por ser um festeiro assim como eu. Acredito que nos divertiríamos muito se organizássemos uma pequena sessão de folia."
 befriend_ongoing.4080.t:0 "Fazer Amizade: Noites Selvagens"
 befriend_ongoing.4082.a:0 "Isso será divertido."
 befriend_ongoing.4082.b:0 "[owner.GetFirstNameNoTooltip]? Prefiro beber sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 befriend_ongoing.4082.desc:0 "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] me perguntou se gostaria de nos encontrar para uma pequena sessão de farra e diversão. [owner.GetSheHe|U] aparentemente é conhecid[Select_CString( owner.IsFemale, 'a', 'o' )] como [Select_CString( owner.IsFemale, 'uma festeira', 'um festeiro' )] de certa notoriedade."
 befriend_ongoing.4082.t:0 "Noites Selvagens"
 befriend_ongoing.4084.a.desc:0 "[target.GetTitledFirstName] e eu passamos um dia e uma noite (ou foram dois?) em uma farra. Só consigo me lembrar claramente de onde começou e onde terminou, mas por [ROOT.Char.GetFaith.random_GoodGodNames], nos divertimos!"
 befriend_ongoing.4084.a:0 "Não é uma má maneira de passar... algum tempo."
 befriend_ongoing.4084.b.desc:0 "[target.GetTitledFirstName] declarou que prefere beber sozinh[Select_CString( target.IsFemale, 'a', 'o' )] a passar tempo comigo."
 befriend_ongoing.4084.b:0 "Parece que tive uma estreita escapada, então."
 befriend_ongoing.4090.a:0 "Precisaremos de ferramentas e sujeitos, é claro."
 befriend_ongoing.4090.desc:0 "Percebi que [target.GetTitledFirstName], assim como eu, é um dedicado estudante das delicadas artes da dor e da coerção. Seria interessante encontrar [target.GetSheHe] e discutir métodos e aplicações."
 befriend_ongoing.4090.t:0 "Fazer Amizade: Uma Sinfonia de Dor"
 befriend_ongoing.4092.a:0 "Uma excelente ideia. Eu levarei minhas ferramentas."
 befriend_ongoing.4092.b:0 "Não tenho nada a dizer para esse arrancador de unhas tosco."
 befriend_ongoing.4092.desc:0 "[owner.GetTitledFirstName] declarou que deseja se encontrar comigo para discutirmos nosso interesse mútuo pelas delicadas artes da dor e coerção."
 befriend_ongoing.4092.t:0 "Uma Sinfonia de Dor"
 befriend_ongoing.4094.a.desc:0 "[target.GetTitledFirstName] e eu passamos um dia inteiro e uma noite na companhia de alguns criminosos pobres e apressadamente reunidos, discutindo e aplicando várias técnicas e fazendo planos para experimentos futuros."
 befriend_ongoing.4094.a:0 "Isso foi inspirador e esclarecedor."
 befriend_ongoing.4094.b.desc:0 "[target.GetTitledFirstName] respondeu apenas insinuando que meus métodos são muito toscos e que [target.GetSheHe] não tem interesse em se associar comigo."
 befriend_ongoing.4094.b:0 "Eu ficaria feliz em mostrar para [target.GetSheHe] o quão tosco posso ser..."
 befriend_ongoing.4100.a:0 "A guerra forjará amizades."
 befriend_ongoing.4100.desc:0 "A guerra traz terrores, bem como oportunidades de glória. Outra coisa que traz são os laços que se formam entre aqueles que lutam do mesmo lado.\n\nEm nossos esforços contra [befriend_ongoing_4100_enemy.GetTitledFirstName], parece que [befriend_ongoing_4100_text_scope.GetTitledFirstName] e eu encontramos um interesse comum."
 befriend_ongoing.4100.t:0 "Fazer Amizade: O Inimigo do Meu Inimigo"
 befriend_ongoing.4110.a:0 "Que todos prosperemos."
 befriend_ongoing.4110.desc:0 "Interagindo com [befriend_ongoing_4110_text_scope.GetTitledFirstName] como membro da mesma facção, descobri que laços são inevitavelmente formados entre pessoas que trabalham para um objetivo comum de longo prazo."
 befriend_ongoing.4110.t:0 "Objetivos Comuns"
 befriend_ongoing.4300.a.tt:0 "#F Enviar uma carta para [target.GetSheHe]#!"
 befriend_ongoing.4300.a:0 "A justiça será servida, justiça e medo."
 befriend_ongoing.4300.b:0 "Deve haver outra maneira."
 befriend_ongoing.4300.desc:0 "Percebi que [target.GetTitledFirstName], assim como eu, é um governante cuja justiça é temida pelos outros. Devo convidar [target.GetSheHe] para se sentar ao meu lado na próxima execução pública."
 befriend_ongoing.4300.t:0 "Fazer Amizade: Espetáculo do Cadafalso"
 befriend_ongoing.4302.a:0 "Uma excelente ideia. Ficarei honrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] em observar como você administra a justiça."
 befriend_ongoing.4302.b:0 "Tenho coisas mais importantes para fazer do que assistir você lidar com criminosos insignificantes."
 befriend_ongoing.4302.c:0 "Você me considera um tolo? Não cairei tão facilmente em suas garras!"
 befriend_ongoing.4302.desc:0 "[owner.GetTitledFirstName] me convidou para um assento de honra ao seu lado para a próxima execução pública."
 befriend_ongoing.4302.t:0 "Convite para uma Execução"
 befriend_ongoing.4304.a.desc:0 "[target.GetTitledFirstName] veio à minha corte para ver o espetáculo de uma execução pública e minha noção de justiça. Esta é minha chance de impressionar [target.GetSheHe] com minha severidade. Qual prisioneiro devo executar?"
 befriend_ongoing.4304.a:0 "É hora de morrer, [prisoner_a.GetFirstNameNoTooltip]."
 befriend_ongoing.4304.b.desc:0 "[target.GetTitledFirstName] respondeu ao meu convite, declarando que não tem desejo de se associar comigo e conceder legitimidade à minha temível reputação."
 befriend_ongoing.4304.b:0 "Chegou a sua hora, [prisoner_b.GetFirstNameNoTooltip]."
 befriend_ongoing.4304.c:0 "Fora com a cabeça de [prisoner_c.GetFirstNameNoTooltip]!"
 befriend_ongoing.4304.d.tt:0 "#F [target.GetTitledFirstName] pode ver minha misericórdia como fraqueza#!"
 befriend_ongoing.4304.d:0 "Estou me sentindo bondos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. Hoje ninguém morre."
 befriend_ongoing.4304.e.tt:0 "#F [owner.GetTitledFirstName] não deseja visitar minha corte#!"
 befriend_ongoing.4304.e:0 "Um dia seu pescoço pode sentir a mordida do meu aço."
 befriend_ongoing.4304.f:0 "Mate todos eles!"
 befriend_ongoing.4304.t:0 "Fazer Amizade: Uma Exibição Temível"
 befriend_ongoing.5001.a:0 "Eu visitarei o [ROOT.Char.GetFaith.HouseOfWorship] se isso agradar a [target.GetFirstNameNoTooltip]."
 befriend_ongoing.5001.b:0 "Podemos encontrar outras coisas em comum."
 befriend_ongoing.5001.desc:0 "Meus esforços para amenizar a tensão entre [target.GetTitledFirstName] e eu são impedidos pelo fato de [target.GetSheHe] continuar condenando minha falta de piedade. As tentativas [target.GetHerHim|U] de me persuadir pouco fazem para convencer-me..."
 befriend_ongoing.5001.t:0 "Fazer Amizade: Um Cético e um Fanático"
 befriend_ongoing.5002.a:0 "Serei insistente, mas não mentirei sobre quem sou."
 befriend_ongoing.5002.b:0 "Infelizmente, as mentiras são mais convincentes que a verdade."
 befriend_ongoing.5002.desc:0 "Seria muito mais fácil fazer com que [target.GetTitledFirstName] gostasse mais de mim se [target.GetSheHe] apenas acreditasse na sinceridade da minha tentativa! Percebo que [target.GetSheHe] duvida da minha sinceridade quando [target.GetSheHe] me dá respostas vagas e se retira da conversa..."
 befriend_ongoing.5002.t:0 "Fazer Amizade: Uma Questão de Confiança"
 befriend_ongoing.5003.a:0 "[target.GetSheHe|U] tem que se recompor!"
 befriend_ongoing.5003.b:0 "Se o espaço é o que [target.GetSheHe] precisa, eu darei a [target.GetSheHe]."
 befriend_ongoing.5003.c:0 "Vou emprestar meu ouvido e tentar ser compreensiv[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 befriend_ongoing.5003.desc:0 "Tudo o que quero é fazer [target.GetTitledFirstName] sentir a alegria de estar ao redor de outras pessoas! No entanto, quanto mais eu tento, mais [target.GetSheHe] se afasta de mim. Agora [target.GetSheHe] raramente sai sequer de seus aposentos..."
 befriend_ongoing.5003.t:0 "Fazer Amizade: Uma Nuvem Escura em um Dia Ensolarado"
 befriend_ongoing.5004.a:0 "Vou me desculpar por meus excessos."
 befriend_ongoing.5004.b:0 "Que [target.Custom2('InsultNoun', ROOT.Char)] ingrat[Select_CString( target.IsFemale, 'a', 'o' )]!"
 befriend_ongoing.5004.desc:0 "Nada me alegra mais do que um [ROOT.Char.Custom('FavoriteTreat')] delicioso, então eu enviei um prato preparado por meu cozinheiro pessoal para [target.GetTitledFirstName] como prova de minhas boas intenções.\n\nNo entanto, o gesto acabou sendo um desastre, já que [target.GetSheHe] mandou um criado jogá-lo fora sem sequer prová-lo..."
 befriend_ongoing.5004.t:0 "Fazer Amizade: Não do Agrado de seu Gosto"
 befriend_ongoing.5005.a:0 "Eu posso não concordar, mas posso aceitar."
 befriend_ongoing.5005.b:0 "Uma pessoa assim vale a pena conhecer?"
 befriend_ongoing.5005.desc:0 "Estou tentando fazer com que [target.GetTitledFirstName] me entenda melhor, mas tudo o que tem resultado é que eu entendo [target.GetSheHe] cada vez menos. Onde está a determinação [target.GetHerHim], a ambição? Parece que [target.GetSheHe] não se importaria se nada mudasse."
 befriend_ongoing.5005.t:0 "Fazer Amizade: Chamado à Ação"
 befriend_ongoing.5006.a:0 "Com esforço, chegarei a entender [target.GetSheHe]."
 befriend_ongoing.5006.b:0 "Eventualmente algo surgirá, com certeza."
 befriend_ongoing.5006.desc:0 "Tenho procurado e procurado, mas [target.GetTitledFirstName] e eu parecemos não ter absolutamente nada em comum.\n\nSem terreno comum, como posso sequer começar a construir uma amizade?"
 befriend_ongoing.5006.t:0 "Fazer Amizade: Superar Diferenças"
 befriend_ongoing.5007.a.failure:0 "Esse foi o curso de estudo errado."
 befriend_ongoing.5007.a.success:0 "Você ganhou novos conhecimentos."
 befriend_ongoing.5007.a:0 "O assunto merece tanto estudo quanto posso me permitir."
 befriend_ongoing.5007.b:0 "Eu sempre posso relaxar em vez disso."
 befriend_ongoing.5007.diplomacy:0 "com etiqueta e tradição de corte adequadas."
 befriend_ongoing.5007.intrigue:0 "sobre o poder inerente aos segredos. Todo tipo de segredos."
 befriend_ongoing.5007.learning:0 "sobre a natureza metafísica da alma."
 befriend_ongoing.5007.martial:0 "sobre estratégia e linhas de suprimento."
 befriend_ongoing.5007.opening:0 "[target.GetTitledFirstName] e eu temos pouco em comum, o que tornou difícil a comunicação com [target.GetSheHe].\n\nNo entanto, com algum esforço, eu poderia me ensinar o suficiente para manter uma conversa"
 befriend_ongoing.5007.stewardship:0 "sobre as complexidades dos vários contratos feudais do reino."
 befriend_ongoing.5007.t:0 "Fazer Amizade: Conhecimento ao Alcance"
 befriend_ongoing.6001.t:0 "Liberdade e Amizade"
 befriend_ongoing.6002.a.tt:0 "Se [owner.GetFirstNameNoTooltip] aceitar:"
 befriend_ongoing.6002.a:0 "Com certeza, se [owner.GetSheHe] realmente deseja ser meu amigo..."
 befriend_ongoing.6002.b.tt:0 "#F [owner.GetFirstNameNoTooltip] pode manter [prisoner.GetSheHe]#!"
 befriend_ongoing.6002.b:0 "[prisoner.GetFirstNameNoTooltip] pode esperar um pouco mais."
 befriend_ongoing.6002.desc:0 "[owner.GetTitledFirstName] tem sido surpreendentemente amigável comigo ultimamente.\n\nSe essa mudança de tom indica uma mudança de caráter, talvez [owner.GetSheHe] possa ser convencid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a libertar m[Select_CString( prisoner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))], [prisoner.GetTitledFirstName], da prisão?"
 befriend_ongoing.6002.t:0 "Liberdade e Amizade"
 befriend_ongoing.6004.a:0 "Um jeito barato de conquistar a simpatia de [target.GetFirstNamePossessiveNoTooltip]."
 befriend_ongoing.6004.b:0 "Não, mas posso deixar [prisoner.GetSheHe] um pouco mais confortável."
 befriend_ongoing.6004.c:0 "Libertar [prisoner.GetFirstNameNoTooltip]? Jamais!"
 befriend_ongoing.6004.desc:0 "Interpretando minha recente simpatia como um sinal, [target.GetTitledFirstName] veio até mim com preocupação por um de meus prisioneiros.\n\n\"Seria de grande prazer se você libertasse m[Select_CString( prisoner.IsFemale, 'inha', 'eu' )] [target.Custom2('RelationToMe', SCOPE.sC('prisoner'))] [prisoner.GetTitledFirstName] de sua [prisoner.Custom('PrisonTypeCell')],\" diz [target.GetSheHe], [ROOT.Char.Custom2('QuirkPPPosOrNeg', SCOPE.sC('target'))]."
 befriend_ongoing.6005.a:0 "Bem-vind[Select_CString( prisoner.IsFemale, 'a', 'o' )] de volta."
 befriend_ongoing.6005.desc:0 "[owner.GetTitledFirstName] ofereceu misericórdia para m[Select_CString( prisoner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))]! [prisoner.GetTitledFirstName] finalmente está seguro."
 befriend_ongoing.6006.a:0 "Existem outras maneiras, m[Select_CString( prisoner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))]."
 befriend_ongoing.6006.desc:0 "Apesar de toda a simpatia fingida de [owner.GetTitledFirstName], [owner.GetSheHe] recusou-se a libertar [prisoner.GetFirstNameNoTooltip]."
 befriend_ongoing.6007.a:0 "Um dia você será livre novamente, m[Select_CString( prisoner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))]."
 befriend_ongoing.6007.desc:0 "Enquanto [owner.GetTitledFirstName] passava um tempo excessivamente longo explicando com pesar por que [owner.GetSheHe] não pode libertar m[Select_CString( prisoner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))], [prisoner.GetTitledFirstName] ao menos foi transferid[Select_CString( prisoner.IsFemale, 'a', 'o' )] para aposentos muito mais confortáveis."
 befriend_ongoing.6008.a:0 "Não posso agradecer o suficiente, [target.GetFirstNameNoTooltip]."
 befriend_ongoing.6008.desc:0 "Parece que minha libertação do cativeiro pelas mãos de [owner.GetTitledFirstName] foi orquestrada por m[Select_CString( target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], [target.GetTitledFirstName]!"
 befriend_ongoing.6009.a:0 "A promessa será oficial e cerimoniosa!"
 befriend_ongoing.6009.b:0 "Certifique-se de que [target.GetSheHe] lembre da promessa todos os dias."
 befriend_ongoing.6009.c.tt:0 "#F Eu não vou sofrer nenhum tipo de dívida#!"
 befriend_ongoing.6009.c:0 "É melhor evitar coisas assim."
 befriend_ongoing.6009.desc:0 "Uma promessa de dedicação enviará uma mensagem forte sobre minhas boas intenções em relação a [target.GetTitledFirstName].\n\nQualquer pessoa aprecia um favor poderoso."
 befriend_ongoing.6009.t:0 "Fazer Amizade: Boa Vontade"
 befriend_ongoing.6010.a:0 "O que [owner.GetSheHe] ganha com essa promessa?"
 befriend_ongoing.6010.desc:0 "Para minha surpresa, m[Select_CString( owner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] [owner.GetTitledFirstName] veio até mim, prometendo que qualquer coisa que eu precise, qualquer coisa que [owner.GetSheHe] possa fazer, [owner.GetSheHe] fornecerá se eu pedir."
 befriend_ongoing.6010.t:0 "Boa Vontade"
 befriend_ongoing.6011.a:0 "Amigos dão de bom grado, não por obrigação."
 befriend_ongoing.6011.b.tt:0 "#F Aparentemente, não é assim que a amizade funciona#!"
 befriend_ongoing.6011.b:0 "O favor que eles me devem não pode ser apenas amizade eterna?"
 befriend_ongoing.6011.desc:0 "Embora [target.GetTitledFirstName] me deva um favor significativo, talvez seja melhor enfatizar uma amizade equitativa.\n\n[target.GetSheHe|U] também — sem dúvida — ficaria imensamente grat[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] se eu deixasse claro que não espero o favor de volta."
 befriend_ongoing.6012.a:0 "O que [owner.GetSheHe] espera obter com isso?"
 befriend_ongoing.6012.desc:0 "Desde que a promessa foi feita, tenho estado nervos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] sobre o que [owner.GetTitledFirstName] pode exigir como pagamento pelo favor que devo a [owner.GetSheHe]. No entanto, [owner.GetSheHe] agora me informou que considerará minha dívida paga desde que eu pense favoravelmente sobre [owner.GetSheHe]."
 befriend_ongoing.6013.a:0 "A amizade sempre será mais poderosa do que a coerção."
 befriend_ongoing.6013.b:0 "Eu não posso abrir mão da minha única vantagem!"
 befriend_ongoing.6013.desc:0 "Parece haver uma grande discordância entre [target.GetTitledFirstName] e eu, causada pelo pequeno problema de eu estar chantageando [target.GetSheHe].\n\nEu poderia abandonar meus esforços, é claro, e deixar [target.GetSheHe] saber que minhas intenções são — em última análise — apenas boas."
 befriend_ongoing.6014.a:0 "Agradeço a [ROOT.Char.GetFaith.HighGodNameAlternate]!"
 befriend_ongoing.6014.desc:0 "Que alívio imenso! [owner.GetTitledFirstName] jurou — solenemente, em tudo o que é sagrado — que [owner.GetSheHe] abandonará a chantagem que [owner.GetSheHe] tem contra mim.\n\nEu não sei o que causou isso, mas parece que finalmente posso respirar novamente."
 befriend_ongoing.6015.a:0 "Isso exigirá muito, mas valerá a pena."
 befriend_ongoing.6015.b:0 "Já tenho problemas suficientes para lidar."
 befriend_ongoing.6015.benevolent:0 "distribuir doações para asilos — ou nobres menos afortunados."
 befriend_ongoing.6015.dominant:0 "fazer uma cavalgada com uma patrulha militar, garantindo que mantenham a ordem apropriadamente."
 befriend_ongoing.6015.emotional:0 "tirar a mente de assuntos de governo, comparecendo a uma peça teatral em [county.Custom('BaronyTownType')] de [county.GetNameNoTooltip]."
 befriend_ongoing.6015.extroverted:0 "passar um tempo com cortesãos despreocupados, longe de salas de conselho enfadonhas e registros administrativos empoeirados."
 befriend_ongoing.6015.introverted:0 "passar um tempo longe de cortesãos e conselheiros exigentes, permitindo um momento de paz raro."
 befriend_ongoing.6015.levelheaded:0 "ganhar um pouco de distância e perspectiva para reavaliar as prioridades."
 befriend_ongoing.6015.malicious:0 "passar algum tempo nos campos, rindo da sujeira e da falta de jeito dos camponeses."
 befriend_ongoing.6015.opening:0 "Meus esforços para me aproximar de [target.GetTitledFirstName] têm sido desafiadores, em grande parte devido à pressão com a qual [target.GetSheHe] está lutando.\n\nTalvez me ajude em mais de um sentido se eu garantir a [target.GetSheHe] um dia sozinh[Select_CString( target.IsFemale, 'a', 'o' )], onde [target.GetSheHe] possa"
 befriend_ongoing.6015.submissive:0 "se dedicar à oração e contemplação, longe das demandas dos outros."
 befriend_ongoing.6015.t:0 "Fazer Amizade: Oferecendo Alívio"
 befriend_ongoing.6016.a:0 "Eu precisava disso."
 befriend_ongoing.6016.benevolent:0 "distribuindo doações entre asilos e nobres menos afortunados."
 befriend_ongoing.6016.dominant:0 "cavalgando com uma patrulha militar, tomando o controle da ordem em meu reino diretamente."
 befriend_ongoing.6016.emotional:0 "desviando minha mente de assuntos de governo ao comparecer a uma peça teatral na [county.Custom('BaronyTownType')] de [county.GetNameNoTooltip]."
 befriend_ongoing.6016.extroverted:0 "na companhia de cortesãos despreocupados, longe de salas de conselho entediantes e registros administrativos empoeirados."
 befriend_ongoing.6016.introverted:0 "bem longe de cortesãos e conselheiros exigentes, permitindo um momento raro de paz."
 befriend_ongoing.6016.levelheaded:0 "obtendo alguma distância e perspectiva para reavaliar minhas prioridades."
 befriend_ongoing.6016.malicious:0 "cavalgando pelos campos, encontrando diversão na sujeira e na falta de jeito dos camponeses."
 befriend_ongoing.6016.opening:0 "Para minha surpresa, [owner.GetTitledFirstName] correspondeu com meus conselheiros para arranjar um dia para mim, para aliviar um pouco da pressão que tenho enfrentado.\n\nNo final, eu o gastei seguindo uma sugestão de [owner.GetFirstName] [owner.GetHerselfHimself],"
 befriend_ongoing.6016.submissive:0 "ficando sozinho em oração e contemplação, longe das demandas dos outros, mas [ROOT.Char.GetFaith.HighGodName]."
 befriend_ongoing.6016.t:0 "Oferecendo Alívio"
 befriend_ongoing.6017.a:0 "Um plano brilhante!"
 befriend_ongoing.6017.b.tt:0 "#F ... ela não é tão valiosa assim.#!"
 befriend_ongoing.6017.b:0 "Embora a amizade de [target.GetFirstNamePossessiveNoTooltip] valha seu peso em ouro..."
 befriend_ongoing.6017.desc:0 "Existem muitas diferenças entre [target.GetTitledFirstName] e eu. Uma delas é o estado um tanto lamentável de [county.GetNameNoTooltip].\n\nNo entanto, talvez alguns dos métodos que usamos em [owner_county.GetNameNoTooltip] também possam ser úteis em [county.GetNameNoTooltip]. [target.GetFirstNameNoTooltip] deixou claro que um projeto de desenvolvimento de terra bem financiado seria muito apreciado..."
 befriend_ongoing.6017.t:0 "Fazer Amizade: Desenvolvimentos Amigáveis"
 befriend_ongoing.6018.a:0 "Não convencional, mas com certeza eu acolho!"
 befriend_ongoing.6018.desc:0 "Levando minhas sugestões sutis como encorajamento ativo, [owner.GetTitledFirstName] financiou nada menos que um projeto de irrigação em larga escala em [county.GetNameNoTooltip]!\n\nPode ser uma ultrapassagem de limites de várias maneiras, mas com as técnicas empregadas em [owner_county.GetNameNoTooltip], [county.GetNameNoTooltip] poderia se tornar mais próspero do que nunca!"
 befriend_ongoing.6018.t:0 "Desenvolvimentos Amigáveis"
 befriend_ongoing.6019.a:0 "[target.GetFirstNameNoTooltip] deveria explicar, [target.GetSheHe] possui uma perspicácia afiada!"
 befriend_ongoing.6019.b:0 "Agora, me ouça..."
 befriend_ongoing.6019.c:0 "Eu acho que isso seria melhor resolvido por uma discussão em grupo!"
 befriend_ongoing.6019.desc:0 "Estou discutindo [ROOT.Char.Custom('education_conversation_subject')] com m[Select_CString( target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] [target.GetTitledFirstName] e m[Select_CString( opinion_target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('opinion_target'))] [opinion_target.GetTitledFirstName] quando percebo que [target.GetFirstNameNoTooltip] está completamente perdid[Select_CString( target.IsFemale, 'a', 'o' )] em relação ao assunto...\n\nTentando não fazer [target.GetHerHim] um tolo, eu travo quando [opinion_target.GetTitledFirstNameNoTooltip] nos pede para explicar algo para [opinion_target.GetSheHe]."
 befriend_ongoing.6019.t:0 "Fazer Amizade: Dilema de Conversa"
 befriend_ongoing.9001.a:0 "Preparem meu séquito, partimos imediatamente!"
 befriend_ongoing.9001.b:0 "Eu temo que o momento não seja oportuno..."
 befriend_ongoing.9001.desc:0 "[target.GetTitledFirstName] está viajando e passará algumas noites na mansão de um dos meus barões. Essa pode ser a oportunidade que eu estava esperando!"
 befriend_ongoing.9001.t:0 "Fazer Amizade: Um Encontro Fortuito"
 befriend_ongoing.9100.a:0 "Absurdo! Ninguém acreditaria em tais mentiras."
 befriend_ongoing.9100.b.failure.desc.tt:0 "Os rumores de [scoped_rival.GetFirstNamePossessiveNoTooltip] continuam se espalhando"
 befriend_ongoing.9100.b.success.desc.toast:0 "[target.GetFirstName] foi persuadid[Select_CString( target.IsFemale, 'a', 'o' )] pelo meu apelo"
 befriend_ongoing.9100.b.success.desc.tt:0 "Persuadi [target.GetFirstNameNoTooltip]"
 befriend_ongoing.9100.b:0 "Eu não permitirei que [scoped_rival.GetSheHe] manche meu bom nome!"
 befriend_ongoing.9100.c:0 "Melhor ignorar [scoped_rival.GetSheHe] completamente."
 befriend_ongoing.9100.desc:0 "Acabei de receber as notícias mais perturbadoras! M[Select_CString( scoped_rival.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_rival'))] [scoped_rival.Custom2('InsultAdjective', ROOT.Char)], [scoped_rival.GetTitledFirstName] tem espalhado rumores falsos sobre mim para [target.GetFirstName], afirmando que meu desejo de conquistar a confiança [target.GetHerHim] não passa de uma tentativa cínica de explorá-la."
 befriend_ongoing.9100.t:0 "Fazer Amizade: Prejudicando Relações"
 befriend_ongoing.9101.a:0 "Por favor, me diga!"
 befriend_ongoing.9101.b:0 "Obrigado, mas eu não preciso de ajuda."
 befriend_ongoing.9101.desc:0 "[Select_CString( scoped_friend.IsFemale, 'Minha querida', 'Meu querido' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scoped_friend'))] [scoped_friend.GetFirstName] ficou sabendo do meu desejo de melhorar minha posição com [target.GetTitledFirstName] e me ofereceu sua ajuda.\n\n[scoped_friend.GetSheHe|U] me assegura que [scoped_friend.GetSheHe] e [target.GetFirstNameNoTooltip] são tipos de pessoas similares. [scoped_friend.GetFirstNameNoTooltip] sabe exatamente o que eu preciso fazer para conquistar a confiança [target.GetHerHim]."
 befriend_ongoing.9101.t:0 "Fazer Amizade: Assistência Amigável"
 befriend_ongoing.9102.a:0 "Não é para isso que os amigos servem?"
 befriend_ongoing.9102.desc:0 "Esses dias, parece que [owner.GetFirstName] só consegue pensar em uma coisa. [target.GetSheHe|U] está completamente dedicad[Select_CString( target.IsFemale, 'a', 'o' )] a conquistar a confiança de [target.GetFirstNamePossessive], então eu decidi ajudar [owner.GetSheHe].\n\n[owner.GetFirstNameNoTooltip] ficou emocionad[Select_CString( owner.IsFemale, 'a', 'o' )] ao receber minha perspectiva e afirmou que não esquecerá meu gentil gesto."
 befriend_ongoing.9103.a:0 "Deixe [target.GetSheHe] pensar o que [target.GetSheHe] quiser."
 befriend_ongoing.9103.b:0 "Talvez seja necessário pedir desculpas."
 befriend_ongoing.9103.ruler.desc:0 "Recentemente, enviei um emissário à corte de [target.GetTitledFirstNamePossessive] para descrever as riquezas e poder do [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] e espero conquistar o respeito [target.GetHerHim].\n\nNo entanto, ouvindo o relatório do mensageiro, parece que dei a [target.GetSheHe] uma impressão muito diferente. [target.GetSheHe|U] acha que estou ameaçando invadir [target.GetPrimaryTitle.GetNameNoTierNoTooltip] a menos que [target.GetSheHe] se submeta a mim!"
 befriend_ongoing.9103.t:0 "Fazer Amizade: Terríveis Mal-Entendidos"
 befriend_ongoing.9103.vassal.desc:0 "Eu estava esperando surpreender [target.GetTitledFirstName] com um grande banquete em sua honra, mas [target.GetSheHe] decidiu retirar sua presença no último momento possível.\n\nParece que [target.GetSheHe] pensou que minha surpresa era, na verdade, parte de um plano para assassiná-l[Select_CString( target.IsFemale, 'a', 'o' )]!"
 befriend_ongoing.9104.a:0 "Uma humilhação pública deve resolver."
 befriend_ongoing.9104.b:0 "Fazer uma grande doação para o [target.GetFaith.HouseOfWorship] [target.GetHerHim]."
 befriend_ongoing.9104.c:0 "O sangue dos inocentes mostrará minha convicção!"
 befriend_ongoing.9104.d:0 "Minha dor pelo amor de [owner.GetFaith.HighGodName]!"
 befriend_ongoing.9104.desc:0 "Que melhor maneira de me aproximar de um[Select_CString( target.IsFemale, 'a', '' )] [target.GetWomanMan] sant[Select_CString( target.IsFemale, 'a', 'o' )] do que fazer um show público de devoção a [owner.GetFaith.HighGodName]?\n\nFico me perguntando qual seria o gesto mais apropriado para a ocasião..."
 befriend_ongoing.9104.e.tt:0 "#F Eu vou me juntar a [target.GetTitledFirstName] na comunhão sagrada#!"
 befriend_ongoing.9104.e:0 "E se eu participasse do altar [target.GetHerHim]?"
 befriend_ongoing.9104.f.tt:0 "#F [scoped_mate.GetFirstName] intercederá com [target.GetTitledFirstName] em meu nome#!"
 befriend_ongoing.9104.f:0 "Que m[Select_CString( scoped_mate.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_mate'))] aplaque a sede [target.GetHerHim]!"
 befriend_ongoing.9104.g:0 "Me dedicar ao [target.GetFaith.HouseOfWorship]."
 befriend_ongoing.9104.h:0 "Dedicar m[Select_CString( scoped_monk.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_monk'))] a uma vida de adoração."
 befriend_ongoing.9104.t:0 "Fazer Amizade: Oferta Amigável"
 befriend_ongoing.9104.z:0 "Pensando bem..."
