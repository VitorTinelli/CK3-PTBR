l_spanish:
 befriend_ongoing_rival.0001.a:0 "Que [target.Custom2('InsultNoun', ROOT.Char)] ingrat[Select_CString( target.IsFemale, 'a', 'o' )]!"
 befriend_ongoing_rival.0001.desc:0 "Pesei cuidadosamente cada palavra enquanto escrevia a carta para [target.GetTitledFirstName]. Nem mesmo quando larguei a pena e fui para meus aposentos eu parei de pensar em frases e significados ocultos que poderiam ofender.\n\nEu tinha grandes esperanças de que minha carta se tornasse um ponto de virada em meus esforços, mas estava gravemente enganad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. Hoje, a mensagem foi devolvida, sem ser aberta!"
 befriend_ongoing_rival.0001.t:0 "Fazer Amizade: Devolver ao Remetente"
 befriend_ongoing_rival.0002.desc:0 "Passei tempo suficiente na vizinhança de [target.GetTitledFirstName] para saber que [target.GetSheHe] pode falar sobre [target.Custom('herhis_subject_of_interest')] por horas. Pesquisei e preparei algumas perguntas para o que eu esperava que fosse uma discussão proveitosa.\n\nInfelizmente, eu estava terrivelmente enganad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. Em questão de minutos, encontramos algo em que discordamos e nos envolvemos em uma frenética competição de gritos."
 befriend_ongoing_rival.0002.t:0 "Fazer Amizade: A Marteladas"
 befriend_ongoing_rival.0003.desc:0 "Foram necessárias algumas discussões acaloradas e maldições para chegarmos a esse ponto, mas, no final das contas, parece que [target.GetTitledFirstName] e eu encontramos alguns pontos em comum nesta questão.\n\nPodemos não ter nos separado como amigos, mas sinto que estamos progredindo."
 befriend_ongoing_rival.0003.t:0 "Fazer Amizade: Vendo Olho no Olho"
 befriend_ongoing_rival.0004.desc:0 "Eu tentei desesperadamente explicar minha opinião de uma forma que fizesse sentido do ponto de vista de [target.GetTitledFirstName], mas só acabei me enrolando nos meus próprios argumentos.\n\nIsso deu a [target.GetSheHe] muitos ângulos para me atacar, e saí da discussão parecendo um maldito tolo."
 befriend_ongoing_rival.0004.t:0 "Fazer Amizade: Um Erro Tolo"
 befriend_ongoing_rival.0005.desc:0 "Quando [spymaster.GetTitledFirstName] me informou sobre o rumor sórdido a meu respeito circulando na corte, eu pude sentir o calor subindo em minhas veias. Fiz [spymaster.GetSheHe] investigar a fonte, e, para nenhuma grande surpresa, parece que o culpado é ninguém menos que [target.GetTitledFirstName].\n\n[ROOT.Char.GetFaith.HighGodName], por que ess[Select_CString( target.IsFemale, 'a', 'e' )] [target.Custom2('InsultNoun', ROOT.Char)] mentiros[Select_CString( target.IsFemale, 'a', 'o' )] não para com essa besteira?!"
 befriend_ongoing_rival.0005.t:0 "Fazer Amizade: Sob uma Má Luz"
 befriend_ongoing_rival.2000.desc:0 "Sempre parece que estou focando nos aspectos negativos de [target.GetTitledFirstName], o que é bastante improdutivo em relação ao meu objetivo atual. Certamente, [target.GetSheHe] deve ter virtudes admiráveis também.\n\nUm elogio discreto, mas ponderado, reconhecendo uma das virtudes [target.GetHerHim], pode ser uma boa ideia."
 befriend_ongoing_rival.2000.t:0 "Fazer Amizade: Acariciando o seu Ego"
 befriend_ongoing_rival.2001.benevolent:0 "como sempre achei que a generosidade [target.GetHerHim] estabelecia um exemplo valioso para os outros."
 befriend_ongoing_rival.2001.dominant:0 "como [target.GetSheHe] sempre chama a atenção de todos ao entrar em uma sala."
 befriend_ongoing_rival.2001.end:0 "\n\nDepois, fui informad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] que [target.GetSheHe] teve dificuldade para esconder um sorriso satisfeito ao ouvir minhas palavras."
 befriend_ongoing_rival.2001.extroverted:0 "que [target.GetSheHe] é amplamente conhecid[Select_CString( target.IsFemale, 'a', 'o' )] por ser um convidado popular, sempre animando as festas."
 befriend_ongoing_rival.2001.intro:0 "Garanti que [target.GetTitledFirstName] estivesse ao alcance de ouvido quando mencionei"
 befriend_ongoing_rival.2001.levelheaded:0 "que, apesar de nossas muitas discordâncias, sempre admirei a habilidade [target.GetHerHim] de manter a calma."
 befriend_ongoing_rival.2001.t:0 "Fazer Amizade: O Poder do Reconhecimento"
 befriend_ongoing_rival.2002.end:0 "\n\nDepois, quando [target.GetSheHe] se aproximou de mim, pensei que era para agradecer! Pelo menos até ver a expressão furiosa em seu rosto... Acontece que [target.GetSheHe] interpretou minha tentativa de elogio como uma zombaria desprezível."
 befriend_ongoing_rival.2002.t:0 "Fazer Amizade: Um Grave Mal-Entendido"
 befriend_ongoing_rival.2003.end:0 "\n\nQuando olhei para [target.GetTitledFirstNameNoTooltip], eu esperava um pequeno sinal de contentamento, pelo menos, mas [target.GetSheHe] na verdade parecia confus[Select_CString( target.IsFemale, 'a', 'o' )], talvez até um pouco irritad[Select_CString( target.IsFemale, 'a', 'o' )]."
 befriend_ongoing_rival.2003.t:0 "Fazer Amizade: Que Constrangedor"
 befriend_ongoing_rival.3000.t:0 "Fazer Amizade: Um Equilíbrio Fino"
 befriend_ongoing_rival_0002.a:0 "Vou engolir meu orgulho e apoiar a posição [target.GetHerHim]."
 befriend_ongoing_rival_0002.b.tt:0 "O progresso de meu plano será afetado positiva ou negativamente dependendo do resultado."
 befriend_ongoing_rival_0002.b:0 "Se ao menos eu conseguisse fazer [target.GetSheHe] entender..."
 befriend_ongoing_rival_0002.c:0 "Eu nunca poderia concordar com uma opinião tão absurda!"
 befriend_ongoing_rival_0003.a:0 "Pode haver alguma esperança para nós, afinal."
 befriend_ongoing_rival_0004.a:0 "Pode ser que [target.GetTitledFirstNameNoTooltip] tenha vencido desta vez..."
 befriend_ongoing_rival_0005.a:0 "Preciso me defender contra as mentiras imundas de [target.GetFirstNamePossessiveNoTooltip]!"
 befriend_ongoing_rival_0005.b:0 "Neste momento, pode ser melhor deixar seguir seu curso."
 befriend_ongoing_rival_2000.a.tt:0 "Elogie [target.GetFirstName] por ser gentil"
 befriend_ongoing_rival_2000.a:0 "Embora tenhamos tido nossas desavenças, [target.GetFirstNameNoTooltip] é uma pessoa gentil."
 befriend_ongoing_rival_2000.b.tt:0 "Elogie [target.GetFirstName] por ser assertivo"
 befriend_ongoing_rival_2000.b:0 "[target.GetSheHe|U] tem uma presença bastante imponente."
 befriend_ongoing_rival_2000.c.tt:0 "Elogie [target.GetFirstName] por ser sociável"
 befriend_ongoing_rival_2000.c:0 "Quando penso sobre isso, [target.GetSheHe] é b[Select_CString( target.IsFemale, 'oa', 'om' )] com pessoas."
 befriend_ongoing_rival_2000.d.tt:0 "Elogie [target.GetFirstName] por ser equilibrad[Select_CString( target.IsFemale, 'a', 'o' )]"
 befriend_ongoing_rival_2000.d:0 "[target.GetFirstNameNoTooltip] costuma manter a calma."
 befriend_ongoing_rival_2000.tt:0 "#F Um elogio sincero pode ajudar no progresso do meu plano, mas o elogio errado pode ofender [target.GetSheHe].#!"
 befriend_ongoing_rival_2001.a:0 "Um elogio sincero pode realmente fazer maravilhas."
 befriend_ongoing_rival_2002.a:0 "Eu nunca deveria ter aberto a boca..."
 befriend_ongoing_rival_2003.a:0 "Talvez eu devesse ter pensado mais sobre isso..."
