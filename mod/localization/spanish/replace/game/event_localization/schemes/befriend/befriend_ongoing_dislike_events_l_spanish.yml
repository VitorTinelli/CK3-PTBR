l_spanish:
 befriend_ongoing_dislike.0001.a:0 "[target.GetSheHe|U] ficará tremendamente impressionado com este!"
 befriend_ongoing_dislike.0001.b:0 "Considerando nosso relacionamento, é prudente mostrar contenção."
 befriend_ongoing_dislike.0001.c:0 "Um presente não é o caminho certo."
 befriend_ongoing_dislike.0001.desc:0 "Eu quero que [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] goste mais de mim, e quem não gosta de um presente?"
 befriend_ongoing_dislike.0001.t:0 "Fazer Amizade: Presente Encantador"
 befriend_ongoing_dislike.0002.a:0 "Isso é difícil..."
 befriend_ongoing_dislike.0002.desc:0 "[target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] continua rejeitando meus esforços para fazer amizade com [target.GetHerHim].\n\n[target.GetSheHe|U] deixou claro que [target.GetSheHe] nunca considerará que eu seja uma pessoa de valor. Nem mesmo melhor do que uma minhoca."
 befriend_ongoing_dislike.0002.t:0 "Fazer Amizade: Diante da Falta de Simpatia"
 befriend_ongoing_dislike.0003.a:0 "Pelo menos estou causando uma impressão!"
 befriend_ongoing_dislike.0003.desc:0 "As cartas e presentes que me preocupava se [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] recebia finalmente tiveram uma resposta!\n\nFoi para dizer que [target.GetHerHim] está incomodado com a minha insistência, no entanto."
 befriend_ongoing_dislike.0003.t:0 "Fazer Amizade: O Valor da Insistência"
 befriend_ongoing_dislike.0004.a:0 "Só quero que [target.GetHerHim] goste de mim."
 befriend_ongoing_dislike.0004.b:0 "Vou fazer com que um arauto entregue minhas palavras pessoalmente!"
 befriend_ongoing_dislike.0004.desc:0 "Parece que algumas das cartas amistosas que enviei para [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] foram devolvidas, sem serem abertas.\n\nComo [target.GetSheHe] não consegue entender que só estou tentando melhorar as coisas?"
 befriend_ongoing_dislike.0004.t:0 "Fazer Amizade: Devolvido ao Remetente"
 befriend_ongoing_dislike.0005.a:0 "Hah, ainda vou conseguir que [target.GetHerHim] goste de mim!"
 befriend_ongoing_dislike.0005.desc:0 "Minhas tentativas de melhorar minha posição aos olhos de [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] certamente enfrentaram desafios, mas meus mensageiros relataram que minhas cartas não são mais recebidas com o mesmo desapontamento.\n\nSeu rosto agora exibe ocasionalmente algo que pode ser... interesse."
 befriend_ongoing_dislike.0005.t:0 "Fazer Amizade: Uma Disposição Suavizada"
 befriend_ongoing_dislike.2001.a:0 "Isso é uma grave ofensa!"
 befriend_ongoing_dislike.2001.b:0 "Uma oportunidade perdida, mas não posso interpretar isso além disso."
 befriend_ongoing_dislike.2001.desc:0 "[target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] é conhecido por ser sociável e amigável, ansioso para festar e celebrar com os outros.\n\nNo entanto, [target.GetSheHe] não me convidou para a última festa em um solar de um barão, mesmo estando bem perto de minhas terras, o que me faria um convidado natural!"
 befriend_ongoing_dislike.2001.t:0 "Fazer Amizade: Não Convidado"
 befriend_ongoing_dislike.2002.a:0 "Preciso dar tempo a [target.GetHerHim]."
 befriend_ongoing_dislike.2002.b:0 "Vou garantir que [target.GetHerHim] ouça falar de mim. Muito!"
 befriend_ongoing_dislike.2002.desc:0 "É bem conhecido que [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] é bastante tímido, raramente ansioso para passar mais tempo com as pessoas do que [target.GetSheHe] julga necessário.\n\nAgora, [target.GetSheHe] parou de responder às minhas comunicações, e não sei como proceder."
 befriend_ongoing_dislike.2002.t:0 "Fazer Amizade: Aproximando-se"
 befriend_ongoing_dislike.5001.a:0 "Eu suponho que posso visitar mais frequentemente o [ROOT.Char.GetFaith.HouseOfWorship]."
 befriend_ongoing_dislike.5001.b:0 "Vamos ter que lidar com isso."
 befriend_ongoing_dislike.5001.c:0 "Quem se importa com as dúvidas que eu abrigo de qualquer maneira!"
 befriend_ongoing_dislike.5001.desc:0 "Meus esforços para amenizar a tensão entre [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] e eu são impedidos pela obsessão sem sentido de [target.GetHerHim] com minha falta de piedade.\n\nNo entanto, apesar de todas as reclamações, [target.GetTitledFirstName] ainda não consegue explicar por que vale a pena se importar mais com [ROOT.GetCharacter.GetFaith.HighGodName] do que já faço, é claro."
 befriend_ongoing_dislike.5001.t:0 "Fazer Amizade: Um Cético e um Fanático"
 befriend_ongoing_dislike.5002.a:0 "Serei persistente, mas não mentirei sobre quem sou."
 befriend_ongoing_dislike.5002.b:0 "Um, sim, talvez eu esteja tentando obter algo..."
 befriend_ongoing_dislike.5002.desc:0 "Seria muito mais fácil fazer com que [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] gostasse mais de mim se [target.GetSheHe] apenas acreditasse na sinceridade da minha tentativa! Em vez disso, [target.GetSheHe] zomba de mim e se pergunta o que estou esperando ganhar com minha gentileza."
 befriend_ongoing_dislike.5002.t:0 "Fazer Amizade: Confiança e Desconfiança"
 befriend_ongoing_dislike.5003.a:0 "[target.GetSheHe|U] deveria superar isso logo!"
 befriend_ongoing_dislike.5003.b:0 "Se [target.GetSheHe] precisa de espaço, eu lhe darei."
 befriend_ongoing_dislike.5003.desc:0 "Tudo o que quero é fazer com que [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] veja a alegria de estar perto de outras pessoas! No entanto, [target.GetSheHe] parece sempre ficar isolado e raramente quer sair de seu quarto, a menos que seja absolutamente necessário."
 befriend_ongoing_dislike.5003.t:0 "Fazer Amizade: Sentindo-se Abatido"
 befriend_ongoing_dislike.5004.a:0 "Pedirei desculpas por meus excessos."
 befriend_ongoing_dislike.5004.b:0 "[target.GetSheHe|U] pode ver a comida sua apodrecer, então."
 befriend_ongoing_dislike.5004.desc:0 "Eu desejava mostrar minhas boas intenções a [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] tendo um banquete grandioso preparado e enviado para seu [target.Custom('ResidenceBuilding')], mas acabei de ouvir a notícia de que [target.GetSheHe] supostamente nem tocou na menor parte de tudo isso!\n\nPensei que algo pudesse estar errado, mas aparentemente, é apenas que nem todos apreciam montanhas de comida tanto quanto eu."
 befriend_ongoing_dislike.5004.t:0 "Fazer Amizade: Presente Maravilhoso Desaponta"
 befriend_ongoing_dislike.5005.a:0 "Vou tentar me contentar com isso por enquanto."
 befriend_ongoing_dislike.5005.b:0 "Uma pessoa assim vale mesmo a pena conhecer?"
 befriend_ongoing_dislike.5005.c:0 "Que tipo de ambições eles estão cultivando em segredo?!"
 befriend_ongoing_dislike.5005.desc:0 "Estou tentando fazer com que [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] me entenda melhor, mas tudo o que consegui foi entender [target.GetHerHim] cada vez menos. Onde está a motivação [target.GetHerHim], a ambição? Parece que [target.GetSheHe] não se importaria se as coisas permanecessem exatamente como estão agora."
 befriend_ongoing_dislike.5005.t:0 "Fazer Amizade: Chamado à Ação"
