l_spanish:
 befriend_outcome.0002.a:0 "É tão raro encontrar um verdadeiro amigo."
 befriend_outcome.0002.b.failure:0 "Mas [owner.GetSheHe] ainda tem um certo charme..."
 befriend_outcome.0002.b.success:0 "Devemos passar mais tempo juntos!"
 befriend_outcome.0002.c.failure:0 "Por que [owner.GetSheHe] não pode me deixar em paz?"
 befriend_outcome.0002.c.success:0 "Ainda não estou convencid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 befriend_outcome.0002.critfail.desc:0 "Há algum tempo já está claro que [owner.GetTitledFirstName] tem tentado [GetScheme('befriend').GetTypeName|l] comigo.\n\nNão consigo deixar de me sentir irritad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com o interesse repentino [Select_CString( owner.IsFemale, 'da', 'do' )] [owner.GetTitledFirstNamePossessive] por mim. Se for o caso, o desejo obsessivo [owner.GetHerHim] de me impressionar e as demonstrações desajeitadas de afeto fabricado [owner.GetHerHim] só fizeram com que eu desgostasse ainda mais [owner.GetHerHim]."
 befriend_outcome.0002.critsucc.desc:0 "Há algum tempo já está claro que [owner.GetTitledFirstName] tem tentado [GetScheme('befriend').GetTypeName|l] comigo.\n\nEm várias ocasiões, [owner.GetSheHe] provou ser um[Select_CString( owner.IsFemale, 'a', '' )] [owner.GetWomanMan] confiável e diret[Select_CString( owner.IsFemale, 'a', 'o' )], tendo apenas meus melhores interesses em mente."
 befriend_outcome.0002.d:0 "Nunca quero ver o rosto [owner.GetHerHim] novamente!"
 befriend_outcome.0002.fail.desc:0 "Há algum tempo já está claro que [owner.GetTitledFirstName] tem tentado [GetScheme('befriend').GetTypeName|l] comigo.\n\nNão consigo deixar de me sentir irritad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com o interesse repentino [Select_CString( owner.IsFemale, 'da', 'do' )] [owner.GetTitledFirstNamePossessive] por mim. E não consigo afastar a sensação de que as intenções de [owner.Custom('WomanManPossessive')] não são puras..."
 befriend_outcome.0002.succ.desc:0 "Há algum tempo já está claro que [owner.GetTitledFirstName] tem tentado [GetScheme('befriend').GetTypeName|l] comigo.\n\nComecei a perceber o quanto [owner.GetTitledFirstName] e eu temos em comum, e quão confiável [owner.GetSheHe] se mostrou ser nesses últimos meses."
 befriend_outcome.0002.t:0 "Amizade com [owner.GetTitledFirstNamePossessiveNoTooltip]"
 befriend_outcome.1001.desc:0 "Ao saber que [target.GetTitledFirstName] estaria como convidad[Select_CString( target.IsFemale, 'a', 'o' )] em uma mansão na [barony.Custom('BaronyTownType')] de [barony.GetNameNoTier], percebi que seria a ocasião perfeita para me encontrar com [target.GetSheHe].\n\n"
 befriend_outcome.1001.t:0 "Fazer Amizade: Uma Noite Fora"
 befriend_outcome.1002.desc:0 "Ao saber que [target.GetTitledFirstName] estaria no baile na [barony.Custom('BaronyTownType')] de [barony.GetNameNoTier], decidi que seria a ocasião perfeita para passar por lá e garantir um tempo a sós com [target.GetSheHe]!\n\n"
 befriend_outcome.1002.t:0 "Fazer Amizade: No Baile"
 befriend_outcome.1201.desc:0 "Apesar das nossas discordâncias anteriores, os conselheiros de [target.GetTitledFirstNamePossessive] sugeriram uma reunião como uma oportunidade para resolver nossas diferenças e deixar as espadas de lado.\n\n"
 befriend_outcome.1201.t:0 "Fazer Amizade: Uma Reunião Formal"
 befriend_outcome.1301.desc:0 "Depois de pensar muito, finalmente decidi convidar [target.GetTitledFirstName] para fazer um passeio em uma de minhas propriedades em [barony.GetNameNoTier]."
 befriend_outcome.1301.t:0 "Fazer Amizade: A Propriedade"
 befriend_outcome.2001.a:0 "Que pessoa agradável!"
 befriend_outcome.2001.desc:0 "A pedido meu, fui colocad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ao lado [target.GetHerHim] durante o jantar, e ambos tivemos um ótimo momento! Fiquei surpres[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com o quanto tínhamos para conversar."
 befriend_outcome.2001.t:0 "Fazer Amizade: Uma Noite Agradável"
 befriend_outcome.2002.a:0 "Que dia bom!"
 befriend_outcome.2002.desc:0 "O baile foi requintado, e [target.GetTitledFirstName] deu um belo espetáculo! Depois, elogiei [target.GetSheHe] pelo desempenho e começamos a conversar."
 befriend_outcome.2002.t:0 "Fazer Amizade: O Baile"
 befriend_outcome.2003.a:0 "Estamos mais próximos do que nunca."
 befriend_outcome.2003.deceitful:0 "Consegui finalmente passar um tempo com [target.GetTitledFirstName] e falar sobre [target.Custom('education_conversation_subject')]. Felizmente, [target.GetSheHe] não percebeu que eu tinha muito pouca compreensão do que estava dizendo."
 befriend_outcome.2003.fallback:0 "compartilharmos algumas histórias e descobrirmos nossos interesses em comum."
 befriend_outcome.2003.great_time:0 "\n\nQuando parti, [target.GetTitledFirstName] me disse que foi bom conversar com alguém que realmente a(o) compreende. Eu concordei plenamente."
 befriend_outcome.2003.opening:0 "Depois de preparativos laboriosos, finalmente consegui passar uma noite a sós com [target.GetTitledFirstName], para"
 befriend_outcome.2003.same_education:0 "discutirmos [ROOT.GetCharacter.Custom('education_conversation_subject')]."
 befriend_outcome.2003.same_fame:0 "conversarmos sobre tempos passados, feitos passados e como o mundo é estranho."
 befriend_outcome.2003.same_lifestyle:0 "falarmos sobre as coisas que tornam a vida digna de ser vivida e compartilharmos algumas boas histórias."
 befriend_outcome.2003.t:0 "Fazer Amizade: Uma Noite de Companhia"
 befriend_outcome.2004.fallback:0 "\n\nDurante nosso encontro, aprendi muito sobre [target.GetTitledFirstNameNoTooltip] e tenho certeza de que o mesmo aconteceu com [target.GetSheHe]. Realmente acredito que essa noite passada juntos fez muito para nos ajudar a desenvolver confiança um no outro."
 befriend_outcome.2004.liege:0 "\n\nComo forma de gratidão, apenas alguns dias após nosso encontro particular, m[Select_CString( target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] decidiu elogiar minha hospitalidade diante de toda a corte, afirmando que [target.GetSheHe] tem sorte de ter um vassalo leal e acolhedor como eu sob a proteção [target.GetHerHim]."
 befriend_outcome.2004.opening:0 "Depois de preparativos laboriosos, finalmente consegui passar um tempo a sós com [target.GetTitledFirstName]."
 befriend_outcome.2004.outsider:0 "\n\nNo final das contas, a distância não foi um grande obstáculo para que eu conquistasse a confiança e a amizade de [target.GetTitledFirstNamePossessiveNoTooltip]. Só posso esperar que o vínculo que criamos hoje se fortaleça ainda mais nos próximos anos."
 befriend_outcome.2004.relative:0 "\n\nFiquei feliz por ter essa oportunidade de fortalecer nossos laços familiares e, a julgar pelo comportamento [Select_CString( target.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('target'))] no final da noite, [target.GetSheHe] também ficou."
 befriend_outcome.2004.spouse:0 "\n\nQuando voltamos para nossos aposentos no final da noite, pude sentir que m[Select_CString( target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] parecia muito mais confortável e conciliatóri[Select_CString( target.IsFemale, 'a', 'o' )] em relação a mim."
 befriend_outcome.2004.t:0 "Fazer Amizade: Mentes Afins"
 befriend_outcome.2004.vassal:0 "\n\nAo final do jantar, [target.GetTitledFirstNameNoTooltip] me disse o quanto [target.GetSheHe] estava grat[Select_CString( target.IsFemale, 'a', 'o' )] por ter um senhor feudal tão hospitaleiro e cordial, e que [target.GetSheHe] espera ter a oportunidade de retribuir minha gentileza no futuro."
 befriend_outcome.2005.a:0 "Finalmente podemos recomeçar."
 befriend_outcome.2005.fallback:0 "Não foi fácil convencer [target.GetTitledFirstName] a se encontrar comigo para resolver nossas diferenças, mas, quando finalmente consegui me sentar com [target.GetSheHe] e explicar minhas razões para nossos desentendimentos passados, descobri que [target.GetSheHe] é muito mais razoável do que eu temia."
 befriend_outcome.2005.liege:0 "A estabilidade de qualquer reino depende do acordo respeitoso entre um senhor feudal e seus vassalos. Fico feliz por ter conseguido convencer [target.GetTitledFirstName] de que o conflito entre nós só traria sofrimento desnecessário a nossos súditos.\n\nSinto grande alívio ao saber que finalmente resolvemos nossas diferenças."
 befriend_outcome.2005.relative:0 "Não foi fácil convencer m[Select_CString( target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] da sinceridade das minhas intenções no começo, mas, aos poucos, consegui fazer [target.GetSheHe] entender que eu estava dispost[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a encerrar nossa rivalidade pelo bem de ambos."
 befriend_outcome.2005.t:0 "Fazer Amizade: Pondo Fim ao Conflito"
 befriend_outcome.2005.vassal:0 "Nunca é um bom sinal quando um senhor feudal está em desacordo com seus próprios vassalos. Graças aos meus esforços diplomáticos, consegui resolver as discordâncias que tinha com [target.GetTitledFirstName].\n\nCom sorte, seremos capazes de aprender a confiar um no outro mais conforme avançamos. Por enquanto, estou feliz por não considerar [target.GetSheHe] mais um inimigo."
 befriend_outcome.2006.a:0 "É sempre bom ver a razão triunfar."
 befriend_outcome.2006.desc:0 "Finalmente consegui convencer [target.GetTitledFirstName] a abandonar seu apoio equivocado à [scoped_faction.GetName].\n\nAcontece que temos muito mais em comum do que pensávamos inicialmente."
 befriend_outcome.2006.t:0 "Fazer Amizade: Compreensão Mútua"
 befriend_outcome.2007.desc:0 "[courier.GetSheHe|U] traz boas notícias, pois [target.GetFirstNameNoTooltip] deseja formalizar nossa amizade! Eu nunca esperava que nos tornássemos tão próximos, mas [target.GetSheHe] provou ser uma pessoa confiável e sincera, sempre pensando em meu melhor interesse."
 befriend_outcome.2007.opening_no_travel:0 "Para minha grande alegria, um dos mensageiros de [target.GetTitledFirstNamePossessive] chegou aqui em minha [ROOT.Char.Custom('FortifiedBuilding')] em [ROOT.Char.GetCurrentLocation.GetName].\n\n"
 befriend_outcome.2007.opening_travel:0 "Para minha grande alegria, um dos mensageiros de [target.GetTitledFirstNamePossessive] me encontrou aqui em [current_location.GetName], enquanto minha comitiva e eu seguimos em direção a [next_destination.GetName].\n\n"
 befriend_outcome.2201.a:0 "[target.GetSheHe|U] até sorriu para mim antes de eu partir."
 befriend_outcome.2201.desc:0 "Depois de nos sentarmos e conversarmos como iguais, em vez de inimigos, sinto que aprendi muito sobre [target.GetSheHe]. [target.GetSheHe|U] também viu que, com o tempo, podemos chegar a um entendimento mútuo."
 befriend_outcome.2201.t:0 "Fazer Amizade: Diplomacia Frutífera"
 befriend_outcome.2301.a:0 "A viagem valeu o esforço."
 befriend_outcome.2301.desc:0 "\n\nA visita acabou sendo uma ideia ainda melhor do que eu esperava. Não só [target.GetTitledFirstName] ofereceu uma perspectiva inesperada sobre os assuntos da propriedade, mas [target.GetSheHe] também manteve meu humor elevado durante todo o tempo."
 befriend_outcome.2301.increase_opinion:0 "Sinto que nos conhecemos de uma forma que não conseguíamos antes."
 befriend_outcome.4001.b:0 "Argh, desisto!"
 befriend_outcome.4001.desc:0 "Quando chegou a hora, fui colocad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ao lado de [target.GetTitledFirstName] durante todo o jantar, mas me vi incapaz de dizer qualquer coisa interessante!"
 befriend_outcome.4001.t:0 "Fazer Amizade: Uma Refeição Desajeitada"
 befriend_outcome.4002.a:0 "Da próxima vez que encontrar [target.GetSheHe], então!"
 befriend_outcome.4002.b:0 "Isso é sem esperança..."
 befriend_outcome.4002.desc:0 "O dia do baile foi prenunciado por céus cinzentos, e, ao contrário da festividade que eu esperava, o clima estava sombrio."
 befriend_outcome.4002.t:0 "Fazer Amizade: O Baile"
 befriend_outcome.4003.b:0 "Nossa amizade não estava destinada a ser."
 befriend_outcome.4003.bad_time:0 "\n\nDecepcionad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], parti, e parece que [target.GetSheHe] ficou feliz em me ver partir."
 befriend_outcome.4003.deceitful:0 "Eu pensei que poderia fingir conhecimento sobre qualquer coisa que [target.GetTitledFirstName] pudesse querer discutir, mas na terceira hora de [target.Custom('education_conversation_subject')], minha tentativa de socializar completamente desmoronou."
 befriend_outcome.4003.fallback:0 "Apesar do que eu inicialmente pensava, eu simplesmente não consegui encontrar nada em comum entre eu e [target.GetTitledFirstName] para criar um vínculo."
 befriend_outcome.4003.same_education:0 "Eu realmente acreditava que [target.GetTitledFirstName] e eu enxergávamos o mundo da mesma forma, mas, depois de passar várias horas discutindo acaloradamente sobre [target.Custom('education_conversation_subject')], sem nunca encontrar nenhum ponto em comum, fui forçad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a admitir o quão terrivelmente equivocad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] eu estava."
 befriend_outcome.4003.same_fame:0 "Sendo reconhecidos por muitas das mesmas coisas, pensei que [target.GetTitledFirstName] e eu teríamos muito em comum. No entanto, se temos, eu não consegui encontrar."
 befriend_outcome.4003.same_lifestyle:0 "Eu estava tão cert[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] de que [target.GetTitledFirstName] e eu estávamos vivendo a vida de maneiras tão semelhantes, mas depois de conversar com [target.GetSheHe] por algumas horas, não tenho tanta certeza disso agora..."
 befriend_outcome.4003.t:0 "Fazer Amizade: Um Erro"
 befriend_outcome.4004.ending:0 "\n\nReceio que não há muito mais que eu possa fazer para superar a lacuna entre nós neste ponto."
 befriend_outcome.4004.liege:0 "[target.GetTitledFirstName] não ficou nada impressionad[Select_CString( target.IsFemale, 'a', 'o' )] com minhas inúmeras tentativas de ganhar a confiança [target.GetHerHim]. Ao ouvir os rumores circulando na corte [target.GetHerHim], percebi que [target.GetSheHe] me vê apenas como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] bajulador[Select_CString( ROOT.Char.IsFemale, 'a', '' )] procurando obter o favor [target.GetHerHim]."
 befriend_outcome.4004.outsider:0 "Infelizmente, parece que as diferenças e a distância entre eu e [target.GetTitledFirstName] são simplesmente grandes demais para serem superadas, independentemente da minha determinação. Após todo o tempo que passei tentando ganhar a confiança [target.GetHerHim], [target.GetTitledFirstNameNoTooltip] não mostrou nenhuma mudança na atitude del[Select_CString( target.IsFemale, 'a', 'e' )] em relação a mim."
 befriend_outcome.4004.relative:0 "Eu pensei que fortalecer o vínculo entre eu e m[Select_CString( target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] seria uma tarefa fácil... Como eu estava errad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. Apesar dos meus melhores esforços, [target.GetTitledFirstName] parece estar completamente desinteressad[Select_CString( target.IsFemale, 'a', 'o' )] em passar tempo comigo ou conhecer mais sobre meus interesses."
 befriend_outcome.4004.spouse:0 "Apesar dos meus melhores esforços para impressionar [target.GetTitledFirstName], m[Select_CString( target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] ainda me trata com desconfiança e distância."
 befriend_outcome.4004.t:0 "Fazer Amizade: Diferenças Irreconciliáveis"
 befriend_outcome.4004.vassal:0 "Apesar das minhas inúmeras tentativas de ganhar a confiança de [target.GetTitledFirstNamePossessive], [target.GetSheHe] ainda mantém a distância quando falo com [target.GetSheHe]. A diferença de posição parece ser um obstáculo muito grande para [target.GetSheHe] superar."
 befriend_outcome.4201.b:0 "Eu não deveria ter tentado isso."
 befriend_outcome.4201.desc:0 "Infelizmente, embora bem intencionado, nosso encontro não fez nada além de me lembrar por que não nos damos bem."
 befriend_outcome.4201.t:0 "Fazer Amizade: Um Encontro Frio"
 befriend_outcome.4301.b:0 "Depois de tudo isso, eu desisto."
 befriend_outcome.4301.desc:0 "\n\nInfelizmente, a viagem acabou sendo uma ideia desastrosa. [target.GetTitledFirstName] estava mal preparad[Select_CString( target.IsFemale, 'a', 'o' )], e toda vez que eu tentava animar o clima, [target.GetSheHe] respondia apenas com descontentamento furtivo."
 befriend_outcome.6001.begin_friendship:0 "\n\nQuando parti, parecia que já nos conhecíamos há uma vida inteira."
 befriend_outcome.6004.liege:0 "\n\nComo forma de gratidão, apenas alguns dias após nosso encontro particular, m[Select_CString( target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] decidiu elogiar minha hospitalidade diante de toda a corte, afirmando que [target.GetSheHe] tem sorte de ter um vassalo leal e acolhedor como eu sob a proteção [target.GetHerHim] e que [target.GetSheHe] tem orgulho de me chamar de amigo."
 befriend_outcome.6004.outsider:0 "\n\nNo final das contas, a distância não foi um grande obstáculo para que eu conquistasse a confiança e a amizade de [target.GetTitledFirstNamePossessiveNoTooltip]. Nós dois aprendemos muito um sobre o outro durante o nosso encontro, tanto que nos separamos como amigos."
 befriend_outcome.6004.relative:0 "\n\nFiquei feliz por ter essa oportunidade de fortalecer nossos laços familiares e, até o final do jantar, tinha absoluta certeza de que m[Select_CString( target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('target'))] sentia exatamente o mesmo."
 befriend_outcome.6004.spouse:0 "\n\nQuando voltamos para nossos aposentos no final da noite, eu tinha certeza de que poderia confiar plenamente [Select_CString( target.IsFemale, 'na minha', 'no meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], e sabia que [target.GetSheHe] sentia o mesmo em relação a mim."
 befriend_outcome.6004.vassal:0 "\n\nNo final do jantar, [target.GetTitledFirstNameNoTooltip] estava tão cert[Select_CString( target.IsFemale, 'a', 'o' )] de que eu tinha os melhores interesses dele em mente quanto eu estava de que [target.GetSheHe] tinha os meus. Graças aos meus esforços, estabelecemos um vínculo de confiança e lealdade que raramente é alcançado entre senhor feudal e vassalo."
 befriend_outcome.6006.desc:0 "Graças às minhas habilidades diplomáticas, consegui convencer [target.GetTitledFirstName] não apenas a abandonar a liderança da [scoped_faction.GetName], mas a dissolvê-la completamente, evitando assim o risco de guerra civil."
 befriend_outcome.6006.t:0 "Fazer Amizade: Apaziguamento Político"
 befriend_outcome.6007.a.a:0 "[target.GetTitledFirstNameNoTooltip] nos traiu!"
 befriend_outcome.6007.a.b:0 "Talvez [target.GetSheHe] tenha razão..."
 befriend_outcome.6007.desc:0 "Não consigo entender como, mas [owner.GetTitledFirstName] convenceu [target.GetTitledFirstName] a dissolver sua facção.\n\n[target.GetSheHe|U] reuniu todos os membros na noite passada, anunciando que estava equivocad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] em se opor [Select_CString( owner.IsFemale, 'a', 'ao' )] [owner.GetTitledFirstNameNoTooltip] e que [target.GetSheHe] deseja uma resolução pacífica para nosso conflito."
 befriend_outcome.6301.begin_friendship:0 "\n\n[target.GetSheHe|U] não é apenas m[Select_CString( target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], mas [Select_CString( target.IsFemale, 'minha amiga', 'meu amigo' )]."
 befriend_outcome.8001.disastrous_time:0 "\n\nQuando parti, tenho certeza de que [target.GetSheHe] me lançou um dos olhares mais rudes que já vi."
 befriend_outcome.8005.a:0 "Deveria ter esperado isso [target.GetHerHim]."
 befriend_outcome.8005.desc:0 "Fui [Select_CString( ROOT.Char.IsFemale, 'uma tola', 'um tolo' )] ao esperar que pudesse mudar a opinião de [target.GetTitledFirstNamePossessive] sobre mim. \n\n[target.GetSheHe|U] só aproveitou a minha recente abertura e cordialidade para zombar abertamente de mim, afirmando que não passo de um[Select_CString( owner.IsFemale, 'a', '' )] [owner.GetWomanMan] patétic[Select_CString( owner.IsFemale, 'a', 'o' )] sem amigos, ansios[Select_CString( owner.IsFemale, 'a', 'o' )] para me humilhar apenas por medo da solidão."
 befriend_outcome.8006.a:0 "Eu nunca deveria ter confiado n[target.GetSheHe]."
 befriend_outcome.8006.desc:0 "Passei a última semana me encontrando com [target.GetTitledFirstName] na tentativa de fazê-l[Select_CString( target.IsFemale, 'a', 'o' )] entender que não há necessidade de sermos inimigos.\n\nInfelizmente, parece que minha tentativa de apaziguar a facção [target.GetHerHim] só a fortaleceu ainda mais."
 befriend_outcome.8006.everyfactionmember.custom:0 "Cada membro da [faction|E] de [target.GetTitledFirstNamePossessive]"
 befriend_outcome.8006.t:0 "Fazer Amizade: Política Irreconciliável"
 befriend_outcome.8007.a:0 "Está bem! Quanto você precisa?"
 befriend_outcome.8007.b:0 "Como quiser, querid[Select_CString( target.IsFemale, 'a', 'o' )]!"
 befriend_outcome.8007.c:0 "Eu não vou ser chantagead[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por [Select_CString( target.IsFemale, 'minha própria', 'meu próprio' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))]!"
 befriend_outcome.8007.desc:0 "Ontem à noite, como última tentativa de conquistar afeição [Select_CString( target.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('target'))], decidi revelar a [target.GetSheHe] um dos meus segredos mais vergonhosos. Eu esperava que minha honestidade ajudasse a diminuir a distância entre nós, mas estava enganad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )].\n\n[target.GetSheHe|U] está me ameaçando agora de expor meu segredo a toda a corte, a menos que eu ceda às exigências [target.GetHerHim]!"
 befriend_outcome.8007.t:0 "Fazer Amizade: O Preço da Confiança"
 befriend_outcome.8008.a:0 "Chega! Eu desisto!"
 befriend_outcome.8008.desc:0 "Infelizmente, parece que [target.GetTitledFirstName] acredita que minha tentativa de conquistar sua confiança é apenas uma artimanha para obter absolução de meus pecados aos olhos de [ROOT.Char.GetFaith.HighGodNameAlternate].\n\nComo se rejeitar minha oferta de amizade não fosse suficiente, [target.GetTitledFirstNameNoTooltip] começou a difamar meu nome ao pregar para o povo de [owner.GetPrimaryTitle.GetName]!"
 befriend_outcome.8008.t:0 "Fazer Amizade: Desacordos Religiosos"
 befriend_outcome.8009.a:0 "Mas eu disse cada palavra com sinceridade!"
 befriend_outcome.8009.desc:0 "Eu estava cert[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] de que elogiar publicamente as muitas qualidades e habilidades de liderança de [target.GetTitledFirstNamePossessive] me ajudaria a conquistar a simpatia [target.GetHerHim]. Infelizmente, eu estava enganad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )].\n\nAssim que terminei meu discurso, [target.GetTitledFirstNameNoTooltip] zombou de mim na frente de toda a corte, afirmando que eu não passo de um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] bajulador[Select_CString( ROOT.Char.IsFemale, 'a', '' )] sem personalidade tentando elevar a posição [owner.GetHerHim] lambendo as botas de seus superiores."
 befriend_outcome.8009.everycourtier.custom:0 "Cada membro da Corte de [target.GetTitledFirstNamePossessive]"
 befriend_outcome.8009.t:0 "Fazer Amizade: Rastejamento Inadequado"
 befriend_outcome.8201.disastrous_time:0 "\n\nEm um momento, insultei acidentalmente tanto a mãe [target.GetHerHim] #EMP quanto#! o cavalo favorito [target.GetHerHim]."
 befriend_outcome.8301.disastrous_time:0 "\n\nApós o nosso retorno, [target.GetSheHe] mal quer falar comigo!"
 befriend_outcome.9800.a:0 "Nossas tristezas nos unem."
 befriend_outcome.9800.desc:0 "Quando meus espiões me informaram sobre a visita anual de [target.GetTitledFirstNamePossessive] ao"
 befriend_outcome.9800.desc_same_parent.dialogue:0 "\"Eu sei que [target_dead_parent.GetSheHe] significava muito para você. Eu também sinto falta [target_dead_parent.GetHerHim].\""
 befriend_outcome.9800.desc_same_parent.our_parent:0 "túmulo de noss[Select_CString( target_dead_parent.IsFemale, 'a', 'o' )] [target_dead_parent.Custom('MotherFather')],"
 befriend_outcome.9800.desc_strangers.dialogue:0 "\"Eu quero apresentar minhas condolências. Eu também sei como é perder um pai ou mãe.\""
 befriend_outcome.9800.desc_strangers.their_parent:0 "túmulo d[Select_CString( target_dead_parent.IsFemale, 'a', 'o' )] [target_dead_parent.Custom('MotherFather')] [target.GetHerHim],"
 befriend_outcome.9800.end:0 "\n\nAcabamos compartilhando histórias sobre entes queridos que se foram por várias horas e nos despedimos com a alma mais leve."
 befriend_outcome.9800.mid.desc:0 "imediatamente percebi que era a melhor oportunidade para aproximar nós dois.\n\nQuando o dia chegou, encontrei [target.GetTitledFirstNameNoTooltip] ajoelhad[Select_CString( target.IsFemale, 'a', 'o' )] diante do túmulo.\n\n\"Desculpe a intromissão,\" digo em voz baixa."
 befriend_outcome.9800.t:0 "Fazer Amizade: A Dor Compartilhada é Meia Dor"
 befriend_outcome.9900.b:0 "...Foi uma hora ruim?"
 befriend_outcome.9900.end:0 "Infelizmente, assim que [target.GetTitledFirstName] me viu, [target.GetSheHe] voou em direção aos meus pés e correu na minha direção, enfurecid[Select_CString( target.IsFemale, 'a', 'o' )]."
 befriend_outcome.9900.t:0 "Fazer Amizade: Sentimentos Avassaladores"
