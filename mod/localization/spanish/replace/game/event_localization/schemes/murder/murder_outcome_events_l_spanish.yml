l_spanish:
 do_not_execute_murder_tooltip:0 "Não tente o assassinato"
 every_entourage_member:0 "Cada membro do séquito de [target.GetTitledFirstNamePossessiveNoTooltip]:"
 murder_child_really_tooltip:0 "Assassinando uma criança. Você tem certeza disso?"
 murder_outcome.1001.a:0 "Faça isso."
 murder_outcome.1001.b:0 "Aguarde, ainda não estou pront[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 murder_outcome.1001.d:0 "Chegou a hora. Meus agentes estão em seus lugares. Um deles pagará ao assassino na noite em que o ato acontecerá. Outro garantirá que a parede esteja desprotegida. Um terceiro deixará um sutil rastro de velas até o quarto de [target.GetTitledFirstName].\n\nTudo está preparado."
 murder_outcome.1001.t:0 "Assassino!"
 murder_outcome.1002.a:0 "Ah, a natureza pode ser tão perigosa."
 murder_outcome.1002.b:0 "Aguarde, este não é o momento certo."
 murder_outcome.1002.d:0 "Tudo que falta é a gangue de bandidos que tristemente matará [target.GetTitledFirstName] em um assalto mal sucedido durante a viagem.\n\nJá consigo imaginar o sangue de [target.GetTitledFirstName] penetrando no solo escuro..."
 murder_outcome.1002.opening:0 "Meus agentes planejaram uma viagem para [target.GetTitledFirstName], que o levará por florestas sombrias. $murder_outcome.1002.d$"
 murder_outcome.1002.opening_travel:0 "Meus agentes descobriram que [target.GetTitledFirstName] está atualmente em uma jornada para [province.GetName], que o levará por várias áreas selvagens.\n\n$murder_outcome.1002.d$"
 murder_outcome.1002.t:0 "Abordado"
 murder_outcome.1003.a:0 "Bon appétit, [target.GetFirstNameNoTooltip]..."
 murder_outcome.1003.b:0 "Aguarde, eu preciso de mais tempo para me preparar!"
 murder_outcome.1003.d:0 "Meus agentes se prepararam durante semanas. O cozinheiro foi subornado para desviar o olhar, o veneno foi adquirido, e o pato foi presenteado exclusivamente para [target.GetTitledFirstName]. Ele será temperado com o veneno, e o leito de ervas disfarçará o cheiro ao ser servido. A amargura mortal será a última coisa que meu alvo provará."
 murder_outcome.1003.t:0 "Uma Refeição Para Morrer"
 murder_outcome.1004.a:0 "Espero que você não tenha medo de [SCOPE.Custom('VenomousCreatureTypePlural')], [target.GetFirstNameNoTooltip]..."
 murder_outcome.1004.b:0 "Este não é o caminho certo para fazer isso."
 murder_outcome.1004.desc:0 "Um de meus agentes adquiriu uma [SCOPE.Custom('VenomousCreature')], e providenciou para que um servo a esconda na cama de [target.GetTitledFirstName] antes do anoitecer.\n\nTudo que eles precisam é do meu aval, e [target.GetSheHe] estará tão bom quanto morto no momento em que a [SCOPE.Custom('VenomousCreatureType')] atacar."
 murder_outcome.1004.t:0 "Indesejado"
 murder_outcome.1005.a:0 "Hora de um bom e velho governo das massas."
 murder_outcome.1005.b:0 "Isso é muito imprevisível!"
 murder_outcome.1005.desc:0 "Com a agitação recente entre os plebeus de [home_province.GetName], um de meus agentes apresentou uma sugestão única para cuidar de [target.GetTitledFirstName].\n\nCom dinheiro nos bolsos certos e agitadores em cada esquina, poderíamos criar um motim inteiro enquanto [target.GetTitleTierName] passa pelas ruas."
 murder_outcome.1005.t:0 "$knight_culture_player_plural_no_tooltip$ e Plebeus"
 murder_outcome.1006.a:0 "Isso será fácil!"
 murder_outcome.1006.desc:0 "[target.GetTitledFirstName] participará de uma celebração local em [home_province.GetName], e eu sei que [target.GetSheHe] é um pouco aficionado por vinho.\n\nPosso atrair [target.GetSheHe] para a adega do meu [target.Custom('ResidenceBuilding')] para uma degustação exclusiva e garantir que [target.GetSheHe] nunca saia de lá novamente...!"
 murder_outcome.1006.t:0 "Um Barril de Vinho"
 murder_outcome.1007.a:0 "Coloque o plano em ação."
 murder_outcome.1007.desc:0 "[target.GetTitledFirstName] estará inspecionando um navio ancorado em um dos portos de [province.GetNameNoTier] ainda esta semana."
 murder_outcome.1007.desc_ending:0 "\n\nSeria fácil se meus agentes encharcassem o barco que levaria [target.GetSheHe] para fora em líquido inflamável, esperassem até que ele estivesse no meio do porto, lançassem uma flecha em chamas e então... deixassem a água reivindicar [target.GetSheHe]."
 murder_outcome.1007.desc_ending_travel:0 "\n\nSeria uma tragédia se meus agentes encharcassem as tábuas em líquido inflamável, escapassem no único barco a remo e ateassem fogo ao navio enquanto fazem sua fuga segura... assim garantindo a morte de [target.GetFirstNamePossessiveNoTooltip] junto com sua comitiva."
 murder_outcome.1007.desc_not_inspection:0 "[target.GetTitledFirstName] visitará um navio ancorado em um dos portos de [province.GetNameNoTier] ainda esta semana."
 murder_outcome.1007.t:0 "Em Águas Turbulentas"
 murder_outcome.1007.travel:0 "[target.GetTitledFirstName] está atualmente a bordo de um navio em algum lugar em [province.GetName]."
 murder_outcome.1008.a:0 "Um brinde à saúde de [target.GetShortUINamePossessiveNoTooltip]!"
 murder_outcome.1008.desc:0 "Meus agentes adquiriram um pó discreto que não deixa vestígios quando dissolvido em bebida. Os criados responsáveis por reabastecer e lidar com a taça de [target.GetTitledFirstNamePossessive] foram subornados para desviar o olhar, e tudo que resta é minha aprovação para contrabandear o veneno para a próxima bebida refrescante [target.GetHerHim]."
 murder_outcome.1008.t:0 "Bebida da Vida"
 murder_outcome.1201.a:0 "Uma criança perdida na floresta... Isso acontece tragicamente com frequência."
 murder_outcome.1201.b:0 "Não, preciso repensar isso!"
 murder_outcome.1201.desc:0 "[assassin.GetTitledFirstName] está preparando uma viagem especial para [Select_CString( target.IsFemale, 'a', 'o' )] jovem [target.GetTitledFirstName]. A criança confia que será levada para um dia agradável na floresta.\n\n[target.GetFirstNameNoTooltip] se perderá infelizmente, e será impossível encontrá-lo antes do anoitecer. Ah, [target.GetSheHe] era tão jovem..."
 murder_outcome.1201.no_assassin:0 "Um de meus agentes está preparando uma viagem especial para [Select_CString( target.IsFemale, 'a', 'o' )] jovem [target.GetTitledFirstName]. A criança confia que será levada para um dia agradável na floresta.\n\n[target.GetFirstNameNoTooltip] se perderá infelizmente, e será impossível encontrá-lo antes do anoitecer. Ah, [target.GetSheHe] era tão jovem..."
 murder_outcome.1201.t:0 "Um Caminho Pouco Usado"
 murder_outcome.1202.a:0 "Faça acontecer, não importa o preço."
 murder_outcome.1202.b:0 "No que estava pensando?"
 murder_outcome.1202.desc:0 "É hora. Uma das amas de leite de [target.GetTitledFirstNamePossessive] está disposta a fazer o que precisa ser feito. Por uma compensação, é claro.\n\nFaço um gesto para que meu agente vá embora antes que [dummy_gender.GetSheHe] termine de descrever o propósito da agulha afiada."
 murder_outcome.1202.t:0 "Indefeso"
 murder_outcome.1203.desc:0 "É difícil encontrar um homem disposto a levantar a mão contra um bebê, mas encontrar alguém disposto a colocar uma [SCOPE.Custom('VenomousCreatureType')] em um berço é muito mais fácil.\n\nEu observo meu agente colocando a [SCOPE.Custom('VenomousCreature')] em uma pequena bolsa e tremo - a criatura é quase tão grande quanto sua futura vítima!"
 murder_outcome.1204.a:0 "Bon appétit!"
 murder_outcome.1204.desc:0 "Se há uma coisa que [target.GetTitledFirstName] não pode resistir, é a sua guloseima favorita...\n\nO próximo lanche doce [target.GetHerHim] será uma parte [target.Custom('FavoriteTreat')] e uma parte veneno potente - \"esquecido\" pelo meu agente na frente da criança."
 murder_outcome.1204.t:0 "Desejo Doce"
 murder_outcome.1205.a:0 "Uma tragédia, verdadeiramente."
 murder_outcome.1205.desc:0 "Meu agente deixará um rastro de doces subindo, subindo, subindo, alto o suficiente para deixar o estômago d[Select_CString( target.IsFemale, 'a', 'o' )] pequen[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstNamePossessiveNoTooltip] agitado. Quando chegar ao topo, [target.GetSheHe] encontrará uma cesta cheia de guloseimas pendurada sobre o muro."
 murder_outcome.1205.desc_cat:0 "Meu agente amarrará uma corda em torno do gatinho de [target.GetTitledFirstNamePossessiveNoTooltip] e o pendurará em um muro alto - os miados certamente chamarão a criança."
 murder_outcome.1205.desc_dog:0 "Meu agente amarrará uma corda em torno do cachorrinho de [target.GetTitledFirstNamePossessiveNoTooltip] e o pendurará em um muro alto - os gemidos e gritos certamente chamarão a criança."
 murder_outcome.1205.desc_ending:0 "E quando [target.GetSheHe] se abaixar para desamarrar a corda, será tão fácil para [target.GetSheHe] escorregar..."
 murder_outcome.1205.desc_opening:0 "Chegou a hora de [target.GetTitledFirstNamePossessive]. Todas as coisas eventualmente caem: reinos, [ROOT.Char.Custom('LadiesLords')], #EMP crianças empurradas de lugares altos#!...\n\n"
 murder_outcome.1205.desc_toy:0 "Meu agente amarrará uma corda em torno do brinquedo favorito de [target.GetTitledFirstNamePossessiveNoTooltip], [target.Custom('child_favorite_toy_indefinite')], e o pendurará em um muro alto - [target.GetSheHe] certamente virá procurá-lo."
 murder_outcome.1205.t:0 "Alturas Perigosas"
 murder_outcome.1301.a:0 "Quanto tempo [prison_owner.GetFirstNameNoTooltip] levará para perceber que [target.GetFirstNameNoTooltip] está morto?"
 murder_outcome.1301.b:0 "Não, não agora."
 murder_outcome.1301.desc:0 "Parece que, pelo preço certo, um grupo de cortesãos pode convenientemente escapar da mente do carcereiro da masmorra de [prison_owner.GetTitledFirstNamePossessive], enquanto se dirigem [Select_CString( target.IsFemale, 'a', 'ao' )] [target.GetTitledFirstName] para a última visita que [target.GetSheHe] jamais terá..."
 murder_outcome.1301.t:0 "Esquecido na Escuridão"
 murder_outcome.1302.a:0 "Arme o servo e mande-o em seu caminho."
 murder_outcome.1302.b:0 "Não, não agora."
 murder_outcome.1302.desc:0 "Tem sido difícil conseguir acesso [Select_CString( target.IsFemale, 'a', 'ao' )] [target.GetTitledFirstName] durante sua prisão domiciliar. No entanto, meus agentes encontraram um antigo servo de"
 murder_outcome.1302.end:0 "disposto a se passar por um amigo de [target.GetFirstNamePossessive], que veio visitá-la..."
 murder_outcome.1302.home_court_does_not_exists:0 "a antiga corte [target.GetHerHim],"
 murder_outcome.1302.home_court_exists:0 "a corte em [target_home.GetNameNoTier],"
 murder_outcome.1302.t:0 "Um Hóspede Indesejado"
 murder_outcome.1401.a:0 "Isso é para o melhor."
 murder_outcome.1401.b:0 "Não, isso parece errado."
 murder_outcome.1401.desc:0 "Pobre e indefes[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName]... Quando é que uma vida vale a pena ser vivida?\n\nUm de meus agentes providenciou para que um assassino chegasse às câmaras onde o [target.GetTitleTierName] incapacitado está 'descansando'."
 murder_outcome.1401.t:0 "Uma Misericórdia"
 murder_outcome.2000.a.tt:0 "[target.GetTitledFirstName] [target.GetDeathReason]"
 murder_outcome.2000.a:0 "[ROOT.Char.GetFaith.DevilName|U] deve ter estado ansioso pela companhia [target.GetHerHim]!"
 murder_outcome.2000.desc:0 "Enquanto faço todos os preparativos necessários para a partida de [target.GetTitledFirstNamePossessive] deste mundo, sou interrompido por um pajem. [Select_CString( owner.IsFemale, 'A', 'O' )] [owner.Custom2('InsultNoun', ROOT.Char)] acabou de morrer sem nenhuma ajuda minha!"
 murder_outcome.2000.t:0 "Giro do Destino"
 murder_outcome.2001.a.discovered:0 "Meu assassino estava lá apenas para proteger [target.GetSheHe] do #EMP verdadeiro#! assassino! Sério!"
 murder_outcome.2001.a:0 "Eu realmente amo visitas surpresa."
 murder_outcome.2001.b:0 "Isso é apenas o começo."
 murder_outcome.2001.c:0 "A justiça foi feita."
 murder_outcome.2001.heh:0 "\nHeh."
 murder_outcome.2001.house_feud:0 "\n\nPelo menos os [target.GetHouse.GetBaseName] é uma preocupação a menos agora!"
 murder_outcome.2001.memories:0 "\n\nLembro-me quando [bad_memory.GetDescription], [ROOT.Char.Custom('MurderMemoryEnding')]"
 murder_outcome.2001.no_awareness_1:0 "\n\nFelizmente, meu envolvimento no crime permanece desconhecido."
 murder_outcome.2001.no_awareness_2:0 "\n\nEu cobri bem os meus rastros e, se alguém suspeita que estou por trás do ataque, ninguém se atreve a dizer em voz alta."
 murder_outcome.2001.opening_1:0 "O plano deu certo, e [target.GetName] finalmente está morto!"
 murder_outcome.2001.opening_2:0 "Parece que foi difícil chegar [Select_CString( target.IsFemale, 'a', 'ao' )] [target.GetTitledFirstName] por [target.GetHerselfHimself], mas uma vez que o assassino finalmente o fez, [target.GetSheHe] não durou muito neste mundo."
 murder_outcome.2001.opening_3:0 "O assassino se saiu espetacularmente, e [target.GetName] finalmente está morto!"
 murder_outcome.2001.owner_is_known_1:0 "\n\nInfelizmente, apesar de eu continuar afirmando que as acusações são infundadas, ninguém duvida que fui eu quem fez isso."
 murder_outcome.2001.owner_is_known_2:0 "\n\nNo entanto, alguém, em algum lugar, vacilou e deixou meu envolvimento no crime ser conhecido! Pelo menos posso me consolar com o fato de que [target.GetTitledFirstName] está em situação pior do que eu."
 murder_outcome.2001.t:0 "Assassino!"
 murder_outcome.2002.a.discovered:0 "Meu único crime foi confiar em bandidos plebeus..."
 murder_outcome.2002.a.less_arrogant:0 "Meus dois problemas se resolveram um ao outro!"
 murder_outcome.2002.a:0 "Hah! Talvez os plebeus não sejam tão inúteis afinal?"
 murder_outcome.2002.heh:0 "\nHeh."
 murder_outcome.2002.no_awareness_1:0 "\n\nOs bandidos estão agora sendo caçados por todos, e ninguém sequer suspeita do meu envolvimento!"
 murder_outcome.2002.no_awareness_2:0 "\n\nFelizmente, a maioria dos bandidos foi morta na luta, e os mortos não falam. Ninguém nunca saberá do meu envolvimento!"
 murder_outcome.2002.no_save:0 "\n\nEnquanto o grupo de viagem parava para acampar à noite, os bandidos saíram de dentro das árvores, exigindo sangue e ouro! Os soldados revidaram, mas felizmente não foi o suficiente. [target.GetTitledFirstName] foi tragicamente morto no tumulto."
 murder_outcome.2002.opening_1:0 "Graças ao meu brilhante plano e aos meus bandidos contratados, [target.GetTitledFirstName] finalmente está morto!"
 murder_outcome.2002.opening_2:0 "Os bandidos fizeram o trabalho deles, e [target.GetTitledFirstName] não existe mais!"
 murder_outcome.2002.opening_3:0 "[target.GetTitledFirstName] partiu deste mundo, enviado para a morte por uma lâmina de bandido."
 murder_outcome.2002.owner_is_known_1:0 "\n\nInfelizmente, um dos bandidos foi capturado e revelou que eu os havia pago para garantir a morte [target.GetTitleTierNamePossessive]."
 murder_outcome.2002.owner_is_known_2:0 "\n\nNo entanto, um dos bandidos deve ter sido capturado, pois veio à tona que eu estava por trás do ataque!"
 murder_outcome.2002.t:0 "Jornadas Perigosas"
 murder_outcome.2003.a.discovered_1:0 "Eu estava apenas tentando animar o banquete!"
 murder_outcome.2003.a.discovered_2:0 "Ah, por favor. [target.GetSheHe|U] estava estragando o clima de qualquer maneira."
 murder_outcome.2003.a:0 "Deve ter sido algo que [target.GetSheHe] comeu."
 murder_outcome.2003.no_awareness_1:0 "\n\nMelhor ainda, em seus estertores de morte, um osso ficou preso na garganta de [target.GetTitledFirstName]. Agora, não está claro exatamente o que matou [target.GetSheHe]."
 murder_outcome.2003.no_awareness_2:0 "\n\nTambém parece que nenhum dos meus agentes está sob suspeita, o que significa que ninguém pode rastrear o veneno de volta para mim!"
 murder_outcome.2003.opening_1:0 "Graças ao pato e ao frasco de veneno, [target.GetTitledFirstName] finalmente está mort[Select_CString( target.IsFemale, 'a', 'o' )]!"
 murder_outcome.2003.opening_2:0 "O veneno fez seu trabalho, e [target.GetTitledFirstName] não existe mais!"
 murder_outcome.2003.opening_3:0 "Aquele pássaro se tornou a última coisa que [target.GetFirstName] comeu na vida!"
 murder_outcome.2003.owner_is_known_1:0 "\n\nNo entanto, enquanto aparentemente engasgava com um osso, [target.GetTitledFirstName] conseguiu murmurar meu nome, me amaldiçoando como o assassino!"
 murder_outcome.2003.owner_is_known_2:0 "\n\nInfelizmente, o veneno foi descoberto, e o envenenador rapidamente me denunciou como o responsável!"
 murder_outcome.2003.owner_is_known_3:0 "\n\nUm dos criados de [target.GetTitledFirstName] estava atormentado pela culpa, no entanto, e se apresentou para confessar, me nomeando como o fornecedor do veneno."
 murder_outcome.2003.t:0 "Comedor Saudável"
 murder_outcome.2004.a.discovered:0 "Hora de [SCOPE.Custom('VenomousCreatureMovement')] como uma [SCOPE.Custom('VenomousCreatureType')]!"
 murder_outcome.2004.a:0 "Meu pequeno amigo fez seu trabalho bem."
 murder_outcome.2004.no_awareness_1:0 "\n\nFelizmente, [SCOPE.Custom('VenomousCreatureTypePlural')] não falam, então o ataque não pode ser rastreado até mim."
 murder_outcome.2004.no_awareness_1_beaked_mammal:0 "\n\nFelizmente, criaturas assim não falam — será que elas falam mesmo? — então o ataque não pode ser rastreado até mim."
 murder_outcome.2004.opening_1:0 "[target.GetTitledFirstName] está mort[Select_CString( target.IsFemale, 'a', 'o' )], pelo ataque letal de uma [SCOPE.Custom('VenomousCreature')], uma criatura [SCOPE.Custom('VenomousCreatureType')]! A [SCOPE.Custom('VenomousCreatureType')] atacou logo depois que [target.GetSheHe] se retirou para seus aposentos, e apesar de os guardas terem sido chamados, ninguém pôde fazer nada para salvá-lo."
 murder_outcome.2004.owner_is_known_1:0 "\n\nInfelizmente, [target.GetSheHe] morreu me amaldiçoando, e rumores do meu envolvimento já se espalharam por toda parte."
 murder_outcome.2005.a.discovered.less_arrogant:0 "Traído, até por meus humildes servos!"
 murder_outcome.2005.a.discovered:0 "Camponeses simplesmente não podem ser confiáveis para considerar meu bem maior."
 murder_outcome.2005.a:0 "Nunca subestime o poder da multidão."
 murder_outcome.2005.no_awareness_1:0 "\n\nMuitos camponeses foram enforcados, incluindo meus agitadores, o que significa que não pode ser rastreado até mim!"
 murder_outcome.2005.opening_1:0 "[target.GetTitledFirstName] está mort[Select_CString( target.IsFemale, 'a', 'o' )], espancad[Select_CString( target.IsFemale, 'a', 'o' )] e pisotead[Select_CString( target.IsFemale, 'a', 'o' )] por seus próprios súditos!\n\nOs camponeses agitados enlouqueceram ao ver seu senhor feudal cavalgando pelas ruas, e arrancaram tanto [target.GetSheHe] quanto vários dos seus $knight_culture_player_plural_no_tooltip_lowercase$ de suas montarias, espancando-os até a morte!"
 murder_outcome.2005.owner_is_known_1:0 "\n\nMuitos camponeses foram enforcados, mas, tragicamente, antes da execução alguns de meus agitadores me acusaram como o culpado."
 murder_outcome.2006.a.discovered:0 "[target.GetSheHe|U] estava bêbado e precisava de alojamento!"
 murder_outcome.2006.a:0 "Que [target.GetSheHe] descanse em paz!"
 murder_outcome.2006.desc:0 "[target.GetTitledFirstName] está mort[Select_CString( target.IsFemale, 'a', 'o' )], fechad[Select_CString( target.IsFemale, 'a', 'o' )] em uma parede e logo será esquecid[Select_CString( target.IsFemale, 'a', 'o' )]!\n\n[target.GetSheHe|U] me seguiu de bom grado, embriagado de alegria e vinho, até a adega. Depois de muitos copos de vinho \"fino\", [target.GetSheHe] adormeceu prontamente e nem se mexeu quando eu trouxe uma colher de pedreiro e fechei a saída de forma metódica.\n\n"
 murder_outcome.2006.scheme_owner_known:0 "Infelizmente, fui visto conduzindo [target.GetSheHe] para o porão, e dentro de semanas a parede recém-erguida foi derrubada para revelar o horror por trás dela."
 murder_outcome.2006.scheme_unknown:0 "Felizmente, parece que ninguém percebeu a nova e estranha parede em meu porão..."
 murder_outcome.2007.a.discovered:0 "Eu... eu pensei que [target.GetSheHe] sabia nadar!"
 murder_outcome.2007.a:0 "Que tragédia!"
 murder_outcome.2007.desc:0 "[target.GetTitledFirstName] está mort[Select_CString( target.IsFemale, 'a', 'o' )], abraçad[Select_CString( target.IsFemale, 'a', 'o' )] pelo frio abraço do oceano!\n\nA flecha flamejante disparada pelo meu agente traçou um caminho ardente pelo porto e apenas momentos depois o barco inteiro estava em chamas."
 murder_outcome.2007.desc_highborn:0 "Todos os passageiros acabaram na água, e os tecidos finos ficam tão pesados quando molhados..."
 murder_outcome.2007.desc_lowborn:0 "Todos os passageiros acabaram na água, e as roupas ficam tão pesadas quando molhadas..."
 murder_outcome.2007.scheme_owner_known:0 "\n\nDesastrosamente, o arqueiro foi visto e não hesitou em me entregar!"
 murder_outcome.2007.scheme_unknown:0 "\n\n#EMP Infelizmente#! o arqueiro não pôde ser encontrado."
 murder_outcome.2008.a.discovered:0 "...[target.GetSheHe|U] estava com sede?"
 murder_outcome.2008.a:0 "Saúde, [target.GetTitledFirstNameNoTooltip]!"
 murder_outcome.2008.desc:0 "\n\nMeus agentes colocaram o veneno na taça [target.GetHerHim] e observaram enquanto ele se dissolvia sem deixar rastros. Somente quando sua garganta inchou e ele percebeu que algo estava errado, mas até então já era tarde demais.\n\n"
 murder_outcome.2008.desc_drunkard:0 "[target.GetTitledFirstName] está mort[Select_CString( target.IsFemale, 'a', 'o' )], mort[Select_CString( target.IsFemale, 'a', 'o' )] pela [target.Custom('RegionalAlcoholicDrink')] que [target.GetSheHe] tanto amava!"
 murder_outcome.2008.desc_not_drunkard:0 "[target.GetTitledFirstName] está mort[Select_CString( target.IsFemale, 'a', 'o' )], mort[Select_CString( target.IsFemale, 'a', 'o' )] por um gole profundo de [target.Custom('RegionalDrink')]!"
 murder_outcome.2008.scheme_owner_known:0 "Infelizmente, meus agentes foram vistos e os criados subornados não hesitaram em revelar meu envolvimento!"
 murder_outcome.2008.scheme_unknown:0 "Felizmente, meus agentes saíram sem serem notados antes que os efeitos do veneno revelassem que algo estava acontecendo!"
 murder_outcome.2201.a.discovered:0 "Enfrentar obstáculos imprevistos faz parte da educação de qualquer criança!"
 murder_outcome.2201.a:0 "E dizem que as crianças são o futuro."
 murder_outcome.2201.opening:0 "[target.GetTitledFirstName] está mort[Select_CString( target.IsFemale, 'a', 'o' )]!\n\nA busca se prolongou até a noite antes de ser interrompida e retomada ao amanhecer. Foi só então que o corpo foi encontrado, ensanguentado, destroçado e rasgado após um ataque de alguma fera feroz e faminta. Pelo menos, espero que tenha sido obra de uma fera."
 murder_outcome.2201.scheme_owner_known:0 "\n\nDesastrosamente, meu agente confessou assim que a criança foi encontrada. Agora todos sabem que fui o responsável por essa tragédia!"
 murder_outcome.2201.scheme_unknown:0 "\n\nFelizmente, todos concordam que é uma terrível tragédia, e meu envolvimento — e a existência de qualquer plano — permanece desconhecido."
 murder_outcome.2201.t:0 "Um Cadáver Destroçado"
 murder_outcome.2202.a.sadistic:0 "Qual é o próximo da minha lista para hoje?"
 murder_outcome.2202.a.tt:0 "#F Eu tive que fazer isso!#!"
 murder_outcome.2202.a:0 "Eu tive que fazer isso. Eu tive que fazer isso."
 murder_outcome.2202.desc:0 "A tarefa está feita. [target.GetTitledFirstName] nunca crescerá ou entenderá o mundo ao seu redor. Aparentemente, foi simples, uma agulha de ferro afiada contra a orelha, perfurando facilmente a pele macia e a cartilagem."
 murder_outcome.2202.desc_normal:0 "Dispensei o cortesão antes que mais detalhes fossem fornecidos."
 murder_outcome.2202.desc_sadistic:0 "Eu faço com que o cortesão repita a descrição dos gritos e do sangue jorrando mais algumas vezes antes que minha curiosidade seja saciada."
 murder_outcome.2202.scheme_owner_known:0 "\n\nDesastrosamente, a ama-de-leite foi pega e me denunciou como o responsável pelo hediondo crime."
 murder_outcome.2202.scheme_unknown:0 "\n\nA ama-de-leite foi pega, mas executada com raiva antes que tivesse a chance de confessar meu envolvimento no crime."
 murder_outcome.2203.desc:0 "A tarefa está feita. [target.GetTitledFirstName] nunca terá a chance de crescer, de conhecer as dores e prazeres deste mundo. Aparentemente foi uma morte rápida, o veneno fez seu trabalho antes mesmo que meu agente tivesse saído do quarto.\n\n"
 murder_outcome.2203.scheme_owner_known:0 "Guardas o alcançaram rapidamente, no entanto, e o homem fraco me denunciou como o responsável pelo ato hediondo."
 murder_outcome.2203.scheme_unknown:0 "Os guardas também foram rápidos, no entanto, e logo meu agente estava acorrentado. Ele foi misericordiosamente executado antes que pudesse mencionar meu envolvimento no crime."
 murder_outcome.2204.desc:0 "[target.GetTitledFirstName] está mort[Select_CString( target.IsFemale, 'a', 'o' )]; [target.GetSheHe] engoliu a isca, [target.Custom('FavoriteTreat')] e tudo! Em pouco tempo, [target.GetSheHe] estava agarrando a garganta, ofegando por ar, antes de cair em um pequeno monte no chão, sem nunca mais se levantar."
 murder_outcome.2204.scheme_owner_known:0 "\n\nDesastrosamente, alguém viu meu agente plantando o petisco e logo fui descoberto como o cérebro por trás de toda a trama!"
 murder_outcome.2204.scheme_unknown:0 "\n\nTodos os padeiros da região foram interrogados, mas nenhuma evidência de jogo sujo foi encontrada."
 murder_outcome.2205.desc:0 "Seu rosto jovem permaneceu permanentemente distorcido em uma expressão de surpresa e terror."
 murder_outcome.2205.desc_cat:0 "agarrando o corpo do gato maltrapilho [target.GetHerHim]."
 murder_outcome.2205.desc_cat_alive:0 "mas nenhum sinal do gato maltrapilho [target.GetHerHim]."
 murder_outcome.2205.desc_dog:0 "agarrando o corpo do cão raquítico [target.GetHerHim]."
 murder_outcome.2205.desc_nothing:0 "com doces espalhados pelo chão ao redor [target.GetHerHim]."
 murder_outcome.2205.desc_opening:0 "[target.GetTitledFirstName] está mort[Select_CString( target.IsFemale, 'a', 'o' )]! Encontraram o corpo mutilado [target.GetHerHim] no chão,"
 murder_outcome.2205.desc_toy:0 "agarrando o seu brinquedo favorito, seu [target.Custom('child_favorite_toy')]."
 murder_outcome.2205.scheme_owner_known:0 "\n\nSinto o sentimento ecoado em meu próprio rosto quando fica claro que meu agente foi pego e não hesitou em me revelar!"
 murder_outcome.2205.scheme_unknown:0 "\n\nPelo menos todos pensam que [target.GetSheHe] caiu por acidente."
 murder_outcome.2205.t:0 "Queda do Poder"
 murder_outcome.2301.a.discovered:0 "Não pense nisso como assassinato, mas como libertação!"
 murder_outcome.2301.a:0 "Eu te libertei, [target.GetFirstNameNoTooltip]."
 murder_outcome.2301.heh:0 "Heh."
 murder_outcome.2301.no_awareness_1:0 "\n\nEmbora não haja dúvidas de que os assassinos pertencem à corte de [prison_owner.GetTitledFirstName], eles estão mantendo a boca fechada e meu envolvimento permanece em segredo."
 murder_outcome.2301.opening_1:0 "Finalmente, [target.GetTitledFirstName] está mort[Select_CString( target.IsFemale, 'a', 'o' )]! [target.GetSheHe|U] pereceu pelas mãos de um grupo de homens não identificados no calabouço de [prison_owner.GetTitledFirstName]. Meio faminto, pouco havia que [target.GetSheHe] pudesse fazer para se defender enquanto eles o espancavam até a morte."
 murder_outcome.2301.owner_is_known_1:0 "\n\nInfelizmente, assim que as perguntas foram feitas, um dos perpetradores quebrou o silêncio e me nomeou como o responsável."
 murder_outcome.2301.t:0 "Esquecido na Escuridão"
 murder_outcome.2302.a.discovered:0 "[target.GetFirstNameNoTooltip] não sairá tão cedo do seu confinamento domiciliar, pelo menos."
 murder_outcome.2302.a:0 "Tão fácil como uma visita amigável!"
 murder_outcome.2302.no_awareness_1:0 "\n\nO servo escapou e já havia desaparecido antes que o corpo fosse descoberto. Ninguém sabe do meu envolvimento."
 murder_outcome.2302.opening_1:0 "[target.GetTitledFirstName] está mort[Select_CString( target.IsFemale, 'a', 'o' )]! Como planejado, o servo conseguiu acesso às câmaras [target.GetHerHim], sem dúvida para a grande confusão [target.GetHerHim]. Claro que a confusão deve ter passado quando o servo desembainhou sua adaga. [target.GetFirstNameNoTooltip] não durou muito."
 murder_outcome.2302.owner_is_known_1:0 "\n\nInfelizmente, o assassinato foi descoberto antes que o servo pudesse escapar, e [dummy_gender.GetSheHe] revelou meu nome em troca de sua vida."
 murder_outcome.2302.t:0 "Um Hóspede Indesejado"
 murder_outcome.2401.a.discovered:0 "Não pense nisso como assassinato, mas como libertação!"
 murder_outcome.2401.a:0 "Descanse em paz, finalmente, [target.GetFirstNameNoTooltip]."
 murder_outcome.2401.no_awareness_1:0 "\n\nO assassino escapou e, sem outras testemunhas, parece impossível que o ato possa ser rastreado até mim."
 murder_outcome.2401.opening_1:0 "[target.GetTitledFirstName] deixou este mundo, embora se deva perguntar se isso não era verdade já há algum tempo. [target.GetSheHe|U] nem lutou quando o assassino segurou o travesseiro sobre seu rosto. [target.GetSheHe|U] apenas soltou alguns gemidos baixos através do tecido e, em seguida, ficou em silêncio."
 murder_outcome.2401.owner_is_known_1:0 "\n\nInfelizmente, os guardas descobriram o assassino, que logo admitiu meu envolvimento no assassinato!"
 murder_outcome.2500.a:0 "Você pode ter escapado de mim, mas não pode escapar da morte!"
 murder_outcome.2500.desc:0 "Enquanto continuo os preparativos para arranjar um encontro entre [target.GetTitledFirstName] e [ROOT.Char.GetFaith.DevilName|U], sou interrompido por um pajem. [Select_CString( owner.IsFemale, 'A', 'O' )] [owner.Custom2('InsultNoun', ROOT.Char)] viajou para longe e agora está além do meu alcance!"
 murder_outcome.4001.a.discovered:0 "[dummy_assassin_gender.GetSheHe|U] estava lá para assustar o #EMP verdadeiro#! assassino! E conseguiu!"
 murder_outcome.4001.a:0 "Você vai pagar um dia, [target.GetFirstNameNoTooltip]!"
 murder_outcome.4001.b:0 "Se não conseguir na primeira vez..."
 murder_outcome.4001.desc:0 "O assassino conseguiu entrar no [target.Custom('ResidenceBuilding')], mas não chegou às câmaras de [target.GetFirstNamePossessiveNoTooltip]."
 murder_outcome.4001.exposed_scheme:0 "[dummy_assassin_gender.GetSheHe|U] foi capturado e, sob ameaça de morte, revelou meu nome!"
 murder_outcome.4001.failure_declaration_1:0 "[target.GetTitledFirstName] escapou iles[Select_CString( target.IsFemale, 'a', 'o' )]!"
 murder_outcome.4001.failure_declaration_2:0 "Minha tentativa de tirar a vida de [target.GetTitledFirstName] foi frustrada!"
 murder_outcome.4001.failure_declaration_3:0 "Parece que [target.GetTitledFirstName] escapou do julgamento de [ROOT.Char.GetFaith.HighGodNamePossessive] mais uma vez."
 murder_outcome.4001.not_exposed_scheme:0 "Quando [dummy_assassin_gender.GetSheHe] foi visto e o alarme foi acionado, o assassino imediatamente fugiu e não foi mais visto desde então. [target.GetTitledFirstName] está agora em alerta."
 murder_outcome.4001.t:0 "Assassino!"
 murder_outcome.4002.a.discovered:0 "Bandidos típicos. Eles dirão qualquer coisa para escapar impunes."
 murder_outcome.4002.a.less_arrogant:0 "Tarefa tão simples, e ainda assim..."
 murder_outcome.4002.a:0 "Você não pode confiar em plebeus para fazerem qualquer coisa direito..."
 murder_outcome.4002.desc:0 "\n\nMeus capangas contratados não conseguiram vencer o séquito [target.GetHerHim]."
 murder_outcome.4002.exposed_scheme:0 "Pior ainda, alguns deles foram capturados vivos e revelaram que foram pagos pelo ataque! Não demorou muito para rastrear o pagamento até mim."
 murder_outcome.4002.not_exposed_scheme:0 "Pelo menos eles foram mortos até o último homem. Sem ninguém para falar, eles foram considerados apenas bandidos comuns."
 murder_outcome.4003.a.discovered:0 "Suponho que o pássaro não era exatamente do agrado de [target.GetFirstNamePossessiveNoTooltip]?"
 murder_outcome.4003.a:0 "Da próxima vez, vou garantir que [target.GetSheHe] engasgue com isso!"
 murder_outcome.4003.desc:0 "\n\nO veneno não teve o efeito pretendido, mas apenas deixou o [target.GetTitleTierName] acamado por uma semana."
 murder_outcome.4003.exposed_scheme:0 "Para piorar, o herborista que fornecia o veneno foi rastreado, e [target.GetFirstNameNoTooltip] agora sabe que eu estava por trás do plano!"
 murder_outcome.4003.not_exposed_scheme:0 "Felizmente, pensam que foi apenas uma doença comum, e [target.GetFirstName] não suspeita de nada."
 murder_outcome.4004.a:0 "Sua sorte vai durar apenas até certo ponto, [target.GetFirstNameNoTooltip]!"
 murder_outcome.4004.failed_attempt_1:0 "Embora a [SCOPE.Custom('VenomousCreatureType')] tenha atacado, um médico foi rapidamente chamado e conseguiu impedir que o veneno se espalhasse."
 murder_outcome.4004.failure_declaration_1:0 "[target.GetTitledFirstName] sobreviveu a [SCOPE.Custom('VenomousCreatureAttack')] da [SCOPE.Custom('VenomousCreature')]!"
 murder_outcome.4004.scheme_known:0 "\n\nA colocação de uma [SCOPE.Custom('VenomousCreature')] na cama de [target.GetTitleAsNamePossessiveNoTooltip] dificilmente passa despercebida, mas pelo menos ninguém sabe que fui eu quem fez isso."
 murder_outcome.4004.scheme_owner_known:0 "\n\nDesastrosamente, o servo que colocou a [SCOPE.Custom('VenomousCreatureType')] foi encontrado, e meu envolvimento foi revelado logo em seguida!"
 murder_outcome.4004.scheme_unknown:0 "\n\nPelo menos o [SCOPE.Custom('VenomousCreatureAttack')] foi atribuído às andanças de [SCOPE.Custom('VenomousCreatureType')], e não a mim."
 murder_outcome.4005.a.discovered:0 "Sempre confie em uma multidão para tomar a decisão errada."
 murder_outcome.4005.a:0 "É por essa incompetência que governamos e esses camponeses não."
 murder_outcome.4005.failed_attempt_1:0 "\n\nMeus agitadores conseguiram instigá-los, mas quando a multidão começou a tumultuar, os soldados de [target.GetFirstNamePossessive] os reprimiram. Os sobreviventes fugiram apavorados enquanto [target.GetTitledFirstName] retornava ao [target.Custom('ResidenceBuilding')]."
 murder_outcome.4005.failure_declaration_1:0 "[target.GetTitledFirstName] sobreviveu ao ataque da horda de camponeses!"
 murder_outcome.4005.scheme_known:0 "\n\nMuitos camponeses foram enforcados, e os agitadores confessaram o envolvimento de forças externas. Felizmente, nem eles sabiam que eu estava por trás disso."
 murder_outcome.4005.scheme_owner_known:0 "\n\nMuitos camponeses foram enforcados, e meus agitadores confessaram meu envolvimento!"
 murder_outcome.4005.scheme_unknown:0 "\n\nMuitos camponeses foram enforcados, mas, felizmente, meus agitadores também foram, o que significa que o motim não pode ser rastreado até mim."
 murder_outcome.4006.a.discovered:0 "Eu... Eu só estou fazendo algumas reformas!"
 murder_outcome.4006.a:0 "...Sim, obrigado pela ajuda."
 murder_outcome.4006.desc:0 "[target.GetTitledFirstName] me seguiu de bom grado até a adega, embriagado de alegria e vinho.\n\nDepois de muitos copos de vinho \"fino\", [target.GetSheHe] adormeceu prontamente, mas antes que eu pudesse terminar de fechar a saída, alguns servos entraram.\n\n"
 murder_outcome.4006.scheme_owner_known:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! E [target.GetTitledFirstNameNoTooltip]? E uma parede a meio caminho de fechar [target.GetHerHim]... Oh não.\""
 murder_outcome.4006.scheme_unkown:0 "\"Oh, parece que [target.GetTitledFirstNameNoTooltip] adormeceu no meio do seu projeto. Podemos ajudar a escoltá-lo para um quarto, [ROOT.Char.Custom('FormOfAddressForLiege')]?\""
 murder_outcome.4007.a.discovered:0 "Eu só queria que [target.GetSheHe] praticasse natação!"
 murder_outcome.4007.a:0 "Como é difícil acertar um barco?!"
 murder_outcome.4007.opening:0 "A flecha flamejante disparada por meu agente traçou um caminho ardente pelo porto, mas por muito pouco não acertou o barco.\n\nEnquanto o fogo se extinguia na água fria do oceano, os passageiros do barco olhavam sem compreensão por muitos segundos antes do pandemônio se instaurar.\n\n"
 murder_outcome.4007.scheme_owner_known:0 "Para piorar, o arqueiro foi capturado e revelou meu nome como o responsável pelo plano sem hesitação."
 murder_outcome.4007.scheme_unkown:0 "Felizmente, o arqueiro escapou e não foram encontrados vestígios do meu envolvimento."
 murder_outcome.4008.a.discovered:0 "A audácia das criadas de sua casa!"
 murder_outcome.4008.a:0 "Da próxima vez, as criadas vão pensar duas vezes antes de se intrometer!"
 murder_outcome.4008.desc:0 "[target.GetTitledFirstName] sobreviveu ao veneno!\n\nInfelizmente, uma das empregadas da cozinha de [target.GetTitledFirstNamePossessive] pegou um gole da bebida antes de servi-la para [target.GetLadyLord], e uma criada morta aparentemente serve de dissuasão.\n\n"
 murder_outcome.4008.scheme_owner_known:0 "E se isso não fosse ruim o suficiente, outra criada não hesitou em me apontar como o culpado da tentativa!"
 murder_outcome.4008.scheme_unkown:0 "Pelo menos nenhuma das criadas confessou meu envolvimento. Pequenos favores."
 murder_outcome.4201.a.discovered:0 "Bem... Foi uma tentativa de assassinato ou uma tentativa de #EMP compaixão#!?"
 murder_outcome.4201.a:0 "Uma facada nas costas teria resolvido."
 murder_outcome.4201.opening:0 "\n\n[assassin.GetTitledFirstName] deixou [target.GetSheHe] ao seu destino, sozinho na natureza selvagem.\n\nNo entanto, ao retornar à corte para compartilhar as terríveis notícias da criança perdida, [target.GetFirstName] já estava esperando na sala e pediu [Select_CString( assassin.IsFemale, 'a', 'ao' )] [assassin.GetFirstName] se eles poderiam brincar mais um pouco!"
 murder_outcome.4201.scheme_owner_known:0 "[assassin.GetFirstNameNoTooltip] foi interrogad[Select_CString( assassin.IsFemale, 'a', 'o' )] com eficiência, e meu plano foi revelado!"
 murder_outcome.4201.scheme_unknown:0 "Basta dizer que [assassin.GetFirstNameNoTooltip] agora está sob vigilância rigorosa."
 murder_outcome.4201.t:0 "O Caminho para Casa"
 murder_outcome.4202.a:0 "Preciso pensar com cuidado."
 murder_outcome.4202.opening:0 "[target.GetTitledFirstName] ainda está viv[Select_CString( target.IsFemale, 'a', 'o' )]! Parece que a ama não conseguiu se obrigar a esfaquear o bebê e deixou a oportunidade passar."
 murder_outcome.4202.scheme_known:0 "\n\nPara piorar, a consciência dela a dominou, e ela confessou o plano! Pelo menos o meu envolvimento continua em segredo."
 murder_outcome.4202.scheme_owner_known:0 "\n\nPara piorar, a consciência dela a dominou, e ela confessou tudo, inclusive o meu envolvimento!"
 murder_outcome.4202.scheme_unkown:0 "\n\nPelo menos ela foi inteligente o suficiente para manter o silêncio sobre o plano. Talvez isso seja o melhor..."
 murder_outcome.4203.opening:0 "[target.GetTitledFirstName] ainda está viv[Select_CString( target.IsFemale, 'a', 'o' )]! Parece que o veneno [SCOPE.Custom('VenomousCreatureType')] não foi forte o suficiente e causou apenas uma leve erupção na pele do bebê.\n\n"
 murder_outcome.4203.scheme_owner_known:0 "Como se isso não fosse ruim o suficiente, meu agente covarde foi pego e confessou, me denunciando como a força por trás do ato!"
 murder_outcome.4203.scheme_unkown:0 "Uma pequena sorte é que meu agente conseguiu sair da sala sem levantar suspeitas."
 murder_outcome.4204.a:0 "Será que isso é um sinal, talvez?"
 murder_outcome.4204.desc_opening:0 "[target.GetTitledFirstName] ainda está viv[Select_CString( target.IsFemale, 'a', 'o' )]! [target.GetSheHe|U] pegou o [target.Custom('FavoriteTreat')], mas antes que [target.GetSheHe] pudesse morder, um cachorro de rua pegou da mão [target.GetHerHim].\n\n"
 murder_outcome.4204.scheme_unkown:0 "Pelo menos ninguém saberá das minhas verdadeiras intenções..."
 murder_outcome.4205.desc_cat:0 "o maldito gato..."
 murder_outcome.4205.desc_dog:0 "o maldito cachorro..."
 murder_outcome.4205.desc_nothing:0 "o maldito doce..."
 murder_outcome.4205.desc_opening:0 "[target.GetTitledFirstName] ainda está viv[Select_CString( target.IsFemale, 'a', 'o' )]! Enquanto meu agente empurrava [target.GetSheHe], a roupa [target.GetHerHim] ficou presa em uma parte saliente da parede logo abaixo. Isso segurou [target.GetSheHe] tempo suficiente para que a ajuda chegasse para salvar tanto a criança quanto"
 murder_outcome.4205.desc_toy:0 "o maldito [target.Custom('child_favorite_toy')]..."
 murder_outcome.4205.scheme_unkown:0 "Pelo menos meu agente saiu despercebido, e a criança estava tão abalada que não se lembra claramente do que aconteceu."
 murder_outcome.4301.a.discovered:0 "Será que realmente é melhor deixar [target.GetSheHe] apodrecer?"
 murder_outcome.4301.a:0 "Maldição!"
 murder_outcome.4301.disastrous_attempt_1:0 "\n\nNão apenas minha gangue de supostos assassinos foi interrompida em seu trabalho por um guarda muito ansioso, mas vários deles me denunciaram como o responsável!"
 murder_outcome.4301.disastrous_lack_of_planning:0 "\n\nTalvez eu devesse ter sido um pouco mais paciente, pois não apenas minha gangue de supostos assassinos foi interrompida em seu trabalho por um guarda muito ansioso, mas vários deles me denunciaram como o responsável!"
 murder_outcome.4301.failed_attempt_1:0 "Enquanto meus supostos assassinos espancavam [target.GetSheHe] quase até a morte, aquele pouco de vida foi suficiente para que [target.GetSheHe] sobrevivesse."
 murder_outcome.4301.failed_lack_of_planning:0 "Talvez a tentativa devesse ter sido planejada um pouco melhor, pois minha gangue de supostos assassinos teve que fugir de um guarda muito ansioso e não concluiu o trabalho."
 murder_outcome.4301.failure_declaration_1:0 "Parece que meu plano de matar [target.GetTitledFirstName] falhou!"
 murder_outcome.4301.house_feud:0 "\n\nMalditos esses bastardos da casa [target.GetHouse.GetBaseName]!"
 murder_outcome.4301.something_is_known:0 "\n\nEmbora esteja claro para todos que foi uma tentativa de tirar a vida de [target.GetTitledFirstName], meu envolvimento permanece desconhecido."
 murder_outcome.4301.t:0 "Esquecido na Escuridão"
 murder_outcome.4301.unknown_so_far:0 "\n\nPelo menos atribuíram o incidente a uma briga entre prisioneiros, então meu envolvimento permanece desconhecido."
 murder_outcome.4302.a.discovered:0 "Ah, será que eu errei a data da execução [target.GetHerHim]?"
 murder_outcome.4302.a:0 "Sua hora chegará, [target.GetFirstNameNoTooltip]..."
 murder_outcome.4302.disastrous_attempt_1:0 "\n\nInfelizmente, parece que o criado não teve nenhuma relutância em revelar meu envolvimento no plano para salvar a própria pele [dummy_gender.GetHerHim]."
 murder_outcome.4302.failed_attempt_1:0 "[Select_CString( dummy_gender.IsFemale, 'A', 'O' )] '[Select_CString( dummy_gender.IsFemale, 'velha amiga', 'velho amigo' )]' não foi tão habilidos[Select_CString( dummy_gender.IsFemale, 'a', 'o' )] em seu disfarce como planejado, e no momento em que [dummy_gender.GetSheHe] desembainhou sua adaga oculta, [target.GetFirstName] chamou os guardas."
 murder_outcome.4302.failed_lack_of_planning:0 "Talvez eu devesse ter planejado melhor isso. Assim que [Select_CString( dummy_gender.IsFemale, 'a', 'o' )] '[Select_CString( dummy_gender.IsFemale, 'velha amiga', 'velho amigo' )]' entrou no quarto [target.GetHerHim], [target.GetSheHe] chamou os guardas. [target.GetSheHe] foi avisado?"
 murder_outcome.4302.failure_declaration_1:0 "[target.GetTitledFirstName] ainda está viv[Select_CString( target.IsFemale, 'a', 'o' )]!"
 murder_outcome.4302.something_is_known:0 "\n\nPelo menos meu envolvimento no plano continua desconhecido."
 murder_outcome.4302.t:0 "Um Convidado Indesejado"
 murder_outcome.4302.unknown_so_far:0 "\n\nNo entanto, o criado conseguiu escapar, e a maneira como [dummy_gender.GetSheHe] agarrou objetos de valor a caminho da saída fez as pessoas presumirem que foi um roubo elaborado, não um assassinato!"
 murder_outcome.4401.a:0 "É apenas uma questão de tempo, [target.GetFirstNameNoTooltip]."
 murder_outcome.4401.disastrous_attempt_1:0 "\n\nEm breve, os guardas chegaram, e o assassino confessou não apenas o plano, mas também meu envolvimento nele!"
 murder_outcome.4401.failed_attempt_1:0 "O assassino invadiu os aposentos [target.GetHerHim], mas não importa quanto tempo ele tenha mantido o travesseiro sobre o rosto de [target.GetTitleTierName], [target.GetSheHe] simplesmente não morria."
 murder_outcome.4401.failure_declaration_1:0 "De alguma forma, #EMP de alguma forma#!, [target.GetTitledFirstName] ainda vive!"
 murder_outcome.4401.something_is_known:0 "\n\nEm breve, os guardas chegaram, e o assassino teve que fazer uma fuga rápida. Pelo menos ninguém sabe que eu estava por trás da tentativa."
 murder_outcome.4401.unknown_so_far:0 "\n\nQuando os guardas apareceram, meu assassino teve que fazer uma fuga rápida, mas pelo menos ele passou despercebido, e ninguém sabe que ele esteve lá."
 murder_outcome.5001.assassin:0 "[assassin.GetFirstName] me trouxe para a floresta para brincar, e nos divertimos tanto hoje! No entanto, [assassin.GetSheHe] foi se esconder há muito tempo, e não consigo encontrar [assassin.GetSheHe], e está escurecendo e ficando assustador tão rápido..."
 murder_outcome.5001.avenge_me:0 "Meus herdeiros, vinguem minha morte!"
 murder_outcome.5001.beat_to_death_in_dungeon:0 "Quando a porta da minha cela se abre, ouso ter esperança por um breve momento de que serei libertado. No entanto, um grupo de figuras encapuzadas entra, e eu já sei o que me aguarda.\n\nA surra é feroz e cruel. Meu corpo debilitado não oferece resistência. Enquanto estou deitado no chão e sinto minha vida escapar, observo distraidamente meu sangue se misturando com a água no chão úmido."
 murder_outcome.5001.bricked:0 "Ontem passei uma noite encantadora, embriagado de alegria e vinho.\n\nQuando acordo de manhã com uma ressaca terrível e sem lembrança de onde estou ou como cheguei aqui, percebo que estou em algo que parece ser um porão úmido, com uma parede recém-construída cobrindo a única saída! Meus gritos de socorro são abafados pelas grossas paredes, e a esperança de ser encontrado se torna cada vez mais fraca a cada hora incontável. Então, apenas um crescente sentimento de fraqueza... #EMP Talvez eu só tire um cochilo...#!"
 murder_outcome.5001.child_pushed:0 "Estou brincando lá fora quando vejo: uma trilha de doces levando para cima de algumas escadas. No topo, encontro uma cesta pendurada na borda, cheia de doces! Mas quando estico a mão para pegá-la, o mundo vira e estou caindo; o chão se aproxima de mim e fecho os olhos e–"
 murder_outcome.5001.child_pushed_cat:0 "Estou brincando quando ouço: os gritos desesperados do meu amado gato [ROOT.Char.Custom('CatStoryName')]! Olho para cima e vejo o animal pendurado por uma corda em uma parede alta, e chego ao lado [ROOT.Char.Custom('CatStoryHerHim')] o mais rápido que posso.\n\nQuando me abaixo para salvar [ROOT.Char.Custom('CatStoryHerHim')], o mundo dá uma cambalhota e estou caindo; o chão está subindo para me encontrar e eu fecho os olhos e–"
 murder_outcome.5001.child_pushed_dog:0 "Estou brincando quando ouço: os gritos desesperados do meu amado cachorro [ROOT.Char.Custom('DogStoryName')]! Olho para cima e vejo o animal pendurado por uma corda em uma parede alta, e chego ao lado [ROOT.Char.Custom('DogStoryHerHim')] o mais rápido que posso.\n\nQuando me abaixo para salvar [ROOT.Char.Custom('DogStoryHerHim')], o mundo dá uma cambalhota e estou caindo; o chão está subindo para me encontrar e eu fecho os olhos e–"
 murder_outcome.5001.child_pushed_toy:0 "Estou brincando lá fora quando vejo: meu amado [target.Custom('child_favorite_toy')] pendurado por uma corda de uma parede alta. Subo as escadas o mais rápido que posso, mas quando estico a mão para salvá-lo, o mundo vira e estou caindo; o chão se aproxima de mim e fecho os olhos e–"
 murder_outcome.5001.courtier:0 "Alguns cortesãos me trouxeram para a floresta para brincar, e nos divertimos tanto hoje! No entanto, eles foram se esconder há muito tempo, e não consigo encontrá-los, e está escurecendo e ficando assustador tão rápido..."
 murder_outcome.5001.creepy_crawly_end:0 "O [ROOT.Char.Custom('VenomousCreatureAttack')] mal arde no início, mas logo meu corpo inteiro é consumido por uma dor lancinante. Tento chamar por ajuda, mas minha voz é fraca enquanto meus membros ficam dormentes e minha consciência esmaece."
 murder_outcome.5001.creepy_crawly_intro:0 "No momento em que sinto algo roçar contra minha perna, não consigo evitar um arrepio e lanço as cobertas para longe, mas o movimento rápido só agita ainda mais o hóspede indesejado."
 murder_outcome.5001.creepy_crawly_known:0 "Mesmo na luz fraca da lua, consigo reconhecer a forma de um [ROOT.Char.Custom('VenomousCreature')]."
 murder_outcome.5001.creepy_crawly_unknown:0 "Sentindo-se ameaçado, o [ROOT.Char.Custom('VenomousCreatureType')] move-se rapidamente e ataca."
 murder_outcome.5001.gang_of_thugs:0 "Viajando pela floresta com meu séquito, somos atacados por um bando de ladrões. Logo mostram estar mais interessados em nossas vidas do que em nosso ouro, e, embora meus homens lutem bravamente, os bandidos tinham o elemento surpresa.\n\nCorro o mais rápido que posso, até achar que estou a salvo. Então, sobre o ruído da batalha, ouço o som puro de uma única corda de arco."
 murder_outcome.5001.hired_assassin:0 "Acordo no meio da noite e vejo uma figura sombria em meus aposentos. Não sei o que aconteceu com meus guardas, mas ao ver o brilho da luz da lua refletida na lâmina, sei que é tarde demais para mim.\n\nUma adaga suficientemente afiada faz pouco som ao perfurar a carne, e em meio à dor agonizante não consigo perceber se meus gritos são audíveis."
 murder_outcome.5001.infant_creepy_crawly:0 "Uma cama macia sob mim e um cobertor quente me cobrindo são tudo o que desejo. Estou quase dormindo quando sinto uma sensação curiosa, como se algo estivesse subindo pelo meu corpo. Uma dor repentina surge no meu braço e começo a chorar.\n\nA dor só se espalha e cresce. #EMP Dói tanto!# A dor é tudo o que meu mundo abrange até que nada mais reste."
 murder_outcome.5001.lured_into_forest:0 "\n\nTento encontrar o caminho de volta para casa, mas todas as árvores parecem iguais para mim, e logo posso ouvir monstros vindo em minha direção. Começo a correr, mas eles são mais rápidos e maiores e mais fortes... Fecho os olhos e choro por minha mãe."
 murder_outcome.5001.not_my_time:0 "Eu tinha muito mais a viver!"
 murder_outcome.5001.option_incapable:0 "Finalmente, a morte."
 murder_outcome.5001.poisoned_candy:0 "Estou brincando lá fora, sentindo um pouco de fome, quando um servo aparece do nada trazendo o maior presente de todos: uma deliciosa [ROOT.Char.Custom('FavoriteTreat')].\n\nApenas alguns momentos se passam antes que o mundo comece a girar, meu estômago começa a gritar, e eu #EMP não consigo respirar#!! Caio no chão enquanto o pedaço da [ROOT.Char.Custom('FavoriteTreat')] mordido escapa das minhas mãos."
 murder_outcome.5001.poisoned_drink:0 "Não demora muito para eu estar #EMP lutando#! com minha garganta, tentando respirar, gritar, obter qualquer ar que seja possível passar por minha garganta inchada e sangrando. Conforme minha consciência desaparece, vejo sangue e pele sob minhas unhas; terei que lavar isso, que inapropriado..."
 murder_outcome.5001.poisoned_drink_alcohol:0 "Enquanto desfruto do jantar com um copo cheio de [ROOT.Char.Custom('RegionalAlcoholicDrink')], de repente sinto uma sensação curiosa em minha garganta."
 murder_outcome.5001.poisoned_drink_no_alcohol:0 "Enquanto desfruto do jantar com um copo cheio de [ROOT.Char.Custom('RegionalDrink')], de repente sinto uma sensação curiosa em minha garganta."
 murder_outcome.5001.poisoned_duck:0 "Estou aproveitando o pato em meu banquete quando, de repente, sinto minha garganta inchar e meus membros ficarem pesados. Consigo prever o que está por vir, mas não posso fazer nada para impedir.\n\nNão demora muito para que minha visão se obscureça e os sons distantes de risadas se transformem em gritos horrorizados, aos poucos se afastando de mim."
 murder_outcome.5001.riled_up_mob:0 "Estou cavalgando pelas ruas de [ROOT.Char.GetCurrentLocation.GetName] quando uma multidão de camponeses, gritando e berrando, ataca minha comitiva. Antes que eu perceba o que está acontecendo, os plebeus me arrancam do cavalo e começam a me espancar. Consigo ouvir meus guardas gritando, mas muito antes de me alcançarem, o mundo começa a desaparecer diante dos meus olhos."
 murder_outcome.5001.schemer_known:0 "\n\nNão há um momento de dúvida em minha mente sobre quem me trouxe isso. [owner.GetTitledFirstName]!"
 murder_outcome.5001.stab_infant:0 "Luzes mudando. Rostos familiares, rostos desconhecidos. Sons que conheço e sons que não conheço. Um som agudo e frio faz meus ouvidos doerem, e começo a chorar.\n\nSinto alguém segurando minha cabeça. Uma dor intensa e brilhante. Depois, nada."
 murder_outcome.5001.strangle_incapable:0 "O mundo ainda está lá fora? Não consigo sentir o tempo passando. Essa dor está no meu... peito? Ou... garganta? Esse é mesmo o meu corpo? É a noite caindo sobre as nuvens cinzentas da minha mente? Está tão difícil me concentrar.\n\nTão... difícil..."
 murder_outcome.5001.sunken_boat:0 "Estou em um barco, desfrutando da brisa da noite, quando de repente uma flecha em chamas atravessa o céu em nossa direção!\n\nEla atinge o barco com um pesado #EMP ruído#!, e leva apenas um momento antes que todo o barco se incendeie e eu me atire na água fria do oceano. Enquanto minhas roupas pesadas me arrastam para baixo, tento nadar, tento alcançar algo para me segurar, tento #EMP respirar#!..."
 murder_outcome.5001.sunken_boat_travel:0 "Estou a bordo de um navio em mar aberto, quando de repente uma flecha em chamas atravessa o céu em nossa direção!\n\nEla atinge o barco com um pesado #EMP ruído#!, e leva apenas um momento antes que todo o barco se incendie e eu me atire na água fria do oceano. Enquanto minhas roupas pesadas me arrastam para baixo, tento nadar, tento alcançar algo para me segurar, tento #EMP respirar#!..."
 murder_outcome.5001.t:0 "Despedindo-se Deste Corpo Mortal"
 murder_outcome.5001.unwelcome_guest_house_arrest.end:0 "Seu golpe vem rápido demais para reagir."
 murder_outcome.5001.unwelcome_guest_house_arrest.no_court:0 "a antiga corte de [target.GetFirstNamePossessiveNoTooltip]."
 murder_outcome.5001.unwelcome_guest_house_arrest.target_court:0 "a corte em [target_home.GetNameNoTier]."
 murder_outcome.5001.unwelcome_guest_house_arrest:0 "Estou em minha câmara com um[Select_CString( dummy_gender.IsFemale, 'a', '' )] [dummy_gender.GetWomanMan] desconhecid[Select_CString( dummy_gender.IsFemale, 'a', 'o' )], mesmo que [dummy_gender.GetSheHe] tenha convencido meus captores de que [dummy_gender.GetSheHe] é um antigo amigo meu.\n\nÉ somente quando [dummy_gender.GetSheHe] puxa uma adaga escondida que reconheço [dummy_gender.GetSheHe] como o antigo [dummy_gender.Custom('GenderedLowlyServantType')] de"
 murder_outcome.5002.beat_to_death_in_dungeon:0 "Quando a porta da minha cela se abriu, ousei ter esperança por um momento de que estava sendo libertado. No entanto, as figuras encapuzadas que entraram logo quebraram minha esperança e começaram a me espancar cruelmente.\n\nEmbora seja doloroso dizer isso, foi apenas a chegada acidental — mas oportuna — dos meus guardas que salvou minha vida."
 murder_outcome.5002.bricked:0 "Ontem, participei de algumas celebrações locais em [home_province.GetName] e passei uma noite encantadora, embriagado de alegria e vinho.\n\nQuando acordo pela manhã com uma ressaca gigantesca e sem lembrança de onde estou ou de como cheguei aqui, me vejo em algo que parece ser um porão úmido, com uma parede recém-construída #EMP quase#! cobrindo a única saída. Alguém pretendeu me enterrar aqui!"
 murder_outcome.5002.child:0 "Que adulto seria tão cruel?"
 murder_outcome.5002.child_pushed:0 "Estou brincando lá fora quando vejo: um rastro de doces subindo uma escada. No topo, encontro uma cesta pendurada na borda, cheia até a borda de doces! Mas, quando estico a mão para alcançá-la, o mundo vira e estou caindo; o chão se aproxima de mim e fecho os olhos e– ...me encontro pendurado na parede pela parte de trás do meu [ROOT.Char.Custom('GetUpperClothingArticle')]. #EMP Ufa!#!"
 murder_outcome.5002.child_pushed_cat:0 "Estou brincando quando ouço: os gritos desesperados do meu amado gato [ROOT.Char.Custom('CatStoryName')]! Olho para cima e vejo [ROOT.Char.Custom('CatStoryHerHim')] pendurado por uma corda em uma parede alta, e chego ao lado [ROOT.Char.Custom('CatStoryHerHim')] o mais rápido que posso.\n\nQuando me abaixo para salvar [ROOT.Char.Custom('CatStoryHerHim')], o mundo dá uma cambalhota e estou caindo; o chão está subindo para me encontrar e eu fecho os olhos e– ...me encontro pendurado na parede pelo meu [ROOT.Char.Custom('GetUpperClothingArticle')]. #EMP Ufa!#!"
 murder_outcome.5002.child_pushed_dog:0 "Estou brincando quando ouço: os gritos desesperados do meu amado cachorro [ROOT.Char.Custom('DogStoryName')]! Olho para cima e vejo [ROOT.Char.Custom('DogStoryHerHim')] pendurado por uma corda em uma parede alta, e chego ao lado [ROOT.Char.Custom('DogStoryHerHim')] o mais rápido que posso.\n\nQuando me abaixo para salvar [ROOT.Char.Custom('DogStoryHerHim')], o mundo dá uma cambalhota e estou caindo; o chão está subindo para me encontrar e eu fecho os olhos e– ...me encontro pendurado na parede pelo meu [ROOT.Char.Custom('GetUpperClothingArticle')]. #EMP Ufa!#!"
 murder_outcome.5002.child_pushed_toy:0 "Estou brincando lá fora quando vejo: meu amado [target.Custom('child_favorite_toy')] pendurado por uma corda em uma parede alta. Subo as escadas o mais rápido que posso, mas quando estico a mão para salvá-lo, o mundo vira e estou caindo; o chão se aproxima de mim e fecho os olhos e– ...me encontro pendurado na parede pela parte de trás do meu [ROOT.Char.Custom('GetUpperClothingArticle')]. #EMP Ufa!#!"
 murder_outcome.5002.creepy_crawly_end:0 "O veneno do [SCOPE.Custom('VenomousCreatureType')] se espalhou pelo meu corpo com uma sensação de queimação, mas chamei meu médico imediatamente. Foi uma tarefa dolorosa, mas, ao amanhecer, a dor do veneno finalmente começou a passar."
 murder_outcome.5002.gang_of_thugs:0 "Viajando pela floresta, minha comitiva foi atacada por bandidos! Eles não estavam atrás do meu ouro, mas atacaram diretamente — antes que eu pudesse ordenar aos meus homens que os matassem ali mesmo. A luta foi mais feroz do que o esperado, e pior, os criminosos estavam claramente me visando!\n\nAinda bem que nenhum deles ficou de pé no final, pois o ataque obstinado quase me venceu."
 murder_outcome.5002.hired_assassin:0 "Um barulho como o de um assassino tropeçando em uma câmara sanitária me despertou do meu sono noturno. Ao avistar meu agressor em potencial, gritei por meus guardas de forma composta e [Select_CString( SCOPE.GetRootScope.GetCharacter.IsFemale, 'feminina', 'máscula' )]. Quando eles chegaram, uma breve luta se seguiu, resultando na morte do intruso."
 murder_outcome.5002.house_feud:0 "\n\nCasa [owner_to_reveal.GetHouse.GetBaseName]! Eu deveria ter sabido!"
 murder_outcome.5002.infant:0 "Eu choro mais um pouco."
 murder_outcome.5002.infant_creepy_crawly:0 "Um cobertor macio sob mim, e uma capa quente. Estou quase pegando no sono quando sinto uma sensação curiosa, como se algo estivesse subindo pelo meu corpo. Uma dor repentina floresce no meu braço e eu começo a chorar.\n\nEu consigo ouvir um homem, perto de mim, e de repente consigo ouvir muitas vozes, levantadas em alarme. Conforme as vozes desaparecem, também desaparece a dor no meu braço, e logo adormeço."
 murder_outcome.5002.lured_into_forest:0 "[assassin.GetFirstName] me atraiu para a floresta para brincar, mas então [assassin.GetSheHe] se escondeu e nunca apareceu!\n\nDepois de chorar, tropeçar em galhos e gritar por ajuda até minha garganta ficar em carne viva, de repente encontro meu caminho para fora da floresta e volto para casa em segurança."
 murder_outcome.5002.memories:0 "\n\nUm bilhete amassado é encontrado perto da cena: #EMP \"Pagamento incluso na íntegra. Contrato emitido para quando [bad_memory.GetThirdPerspectiveDescription].\"#!"
 murder_outcome.5002.memories_death:0 "\n\nEnquanto desapareço, uma voz diz friamente:\n#EMP \"Contrato cumprido. Vingança pelo que [bad_memory.GetThirdPerspectiveDescription], verificado. Hora de coletar o ouro.\"#!"
 murder_outcome.5002.option_incapable:0 "O que está acontecendo?"
 murder_outcome.5002.poisoned_candy:0 "Estou brincando quando aparece diante de mim: uma deliciosa [ROOT.Char.Custom('FavoriteTreat')]. Não há ninguém por perto, e ninguém notaria se eu desse uma mordida...\n\nNo exato momento em que estou prestes a morder o doce, um cachorro de rua sarnento o arranca das minhas mãos, engole-o inteiro e desaba morto no chão."
 murder_outcome.5002.poisoned_drink:0 "Enquanto jantava, um servo entra correndo na sala e derruba a taça da minha mão #EMP justo#! quando estou prestes a dar um gole!\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], é veneno! Foi uma das criadas da cozinha... Perdoe-a, ela deu um gole e ela– ela está morta!\""
 murder_outcome.5002.poisoned_duck:0 "Quando estou prestes a dar uma mordida no pedaço mais suculento de pato que já vi, um de meus servos desaba, agarrando a própria garganta! Aparentemente, o tolo se serviu de uma prova da minha refeição.\n\nAo menos, ele serviu como um aviso para que eu não toque no pássaro envenenado, enquanto recebia a devida punição por sua indiscrição."
 murder_outcome.5002.revenge_will_be_had:0 "Eu farei [owner_to_reveal.GetSheHe] se arrepender disso!"
 murder_outcome.5002.riled_up_mob:0 "Eu estava cavalgando pelas ruas de [home_province.GetNameNoTier] quando uma multidão de camponeses gritando e berrando desceu sobre minha comitiva. Felizmente, meus guardas não hesitaram em começar a derrubá-los, enquanto eu voltava para o [ROOT.Char.Custom('ResidenceBuilding')]."
 murder_outcome.5002.schemer_known:0 "\n\nIsso foi, sem dúvida, obra daquel[Select_CString( owner_to_reveal.IsFemale, 'a', 'e' )] [owner.Custom2('InsultNoun', ROOT.Char)] [owner.Custom2('InsultAdjective', ROOT.Char)], [owner_to_reveal.GetTitledFirstName]!"
 murder_outcome.5002.stab_infant:0 "Luzes mudando. Rostos familiares, rostos desconhecidos. Sons que conheço e sons que não conheço. Um som agudo e frio faz meus ouvidos doerem, e começo a chorar.\n\nEntão ouço uma mulher soluçar, grande e adulta. Vozes gritando, em pânico. Depois sou deixado sozinho."
 murder_outcome.5002.strangle_incapable:0 "O mundo ainda está lá fora? Não consigo sentir o tempo passando. Aquela dor está no meu... peito? Ou... garganta? Isso é meu corpo? Está caindo a noite nas nuvens cinzas da minha mente? Está tão difícil focar.\n\nHá presenças ao meu redor? Não consigo ouvir, mas #EMP sinto#! como se alguém estivesse gritando. Então, mais uma vez, só há silêncio."
 murder_outcome.5002.sunken_boat:0 "Estou em um barco em um porto em [province.GetNameNoTier] quando de repente uma flecha em chamas cruza o céu em nossa direção!\n\nEla passa raspando pelo barco, e ao me inclinar para vê-la se apagar na água fria do oceano, sinto um cheiro distinto vindo da madeira do barco: fogo grego! Isso foi uma tentativa em minha vida."
 murder_outcome.5002.t:0 "Uma Tentativa em Minha Vida!"
 murder_outcome.5002.unwelcome_guest_house_arrest:0 "Supostamente, um velho amigo estava esperando em meus aposentos, então fico bastante surpreso quando sou recebido por uma figura encapuzada — uma figura notavelmente desconhecida e suspeita.\n\nPortanto, assim que uma faca escondida aparece, estou pronto para correr até a porta, gritando por ajuda dos guardas. Eles estão esperando logo do lado de fora da sala, então presumo que também não confiavam no estrangeiro, felizmente para mim."
 murder_outcome.5002.will_find_out:0 "Eu vou descobrir quem foi o responsável por isso!"
 murder_outcome_murdered_rival_tt:0 "Você ganhou [prestige_i][EmptyScope.ScriptValue('rival_outlived_prestige_value')|P0] por ter sobrevivido ao seu [rival|E]"
 murder_outcome_reworked.0000.addendum.house_feud.1:0 "Malditos esses [target.GetHouse.GetBaseName] #EMP bastardos#!."
 murder_outcome_reworked.0000.addendum.house_feud.2.2:0 "E \"$murder_outcome_reworked.0000.addendum.house_feud.2$\""
 murder_outcome_reworked.0000.addendum.house_feud.2.servants:0 "Os servos resmungam: $murder_outcome_reworked.0000.addendum.house_feud.2.2$"
 murder_outcome_reworked.0000.addendum.house_feud.2:0 "Casa [owner_to_reveal.GetHouse.GetBaseName], malditos todos até [target.GetFaith.random_NegativeAfterLife]!"
 murder_outcome_reworked.0000.failure_declaration.generic.1:0 "[target.GetTitledFirstName] escapou iles[Select_CString( target.IsFemale, 'a', 'o' )]!\n\n"
 murder_outcome_reworked.0000.failure_declaration.generic.2:0 "Minha tentativa de matar [target.GetTitledFirstName] foi frustrada!\n\n"
 murder_outcome_reworked.0000.failure_declaration.generic.3:0 "Parece que [target.GetTitledFirstName] escapou das garras de [ROOT.Char.GetFaith.DeathDeityName]!\n\n"
 murder_outcome_reworked.0000.failure_declaration.generic.4:0 "[target.GetTitledFirstName] ainda vive!\n\n"
 murder_outcome_reworked.0000.failure_declaration.generic.5:0 "Parece que meu plano de matar [target.GetTitledFirstName] falhou!\n\n"
 murder_outcome_reworked.0000.failure_declaration.generic.6:0 "De alguma forma, #EMP de alguma forma#!, [target.GetTitledFirstName] ainda está viv[Select_CString( target.IsFemale, 'a', 'o' )]!\n\n"
 murder_outcome_reworked.0000.kept_secret.generic.1:0 "\n\nFelizmente, embora sempre haja sussurros, meu envolvimento no crime permanece desconhecido."
 murder_outcome_reworked.0000.kept_secret.generic.2:0 "\n\nCobri bem minhas trilhas, e se alguém suspeitar de mim como responsável pelo ataque, não se atreve a dizer em voz alta."
 murder_outcome_reworked.0000.memories.bad.general:0 "Sempre lembrarei quando [bad_memory.GetDescription], [ROOT.Char.Custom('MurderMemoryEnding')]\n\n"
 murder_outcome_reworked.0000.memories.bad.house_feud:0 "Um [target.GetHouse.GetBaseName] a menos para me preocupar.\n\n"
 murder_outcome_reworked.0000.memories.line_break:0 "Uma dor no meu lado não mais, graças a [owner.GetFaith.FateGodName].\n\n"
 murder_outcome_reworked.0000.memories.target.note_discovered:0 "\n\nUm bilhete amassado é encontrado perto do local: #EMP \"Pagamento integral incluído. Contrato emitido para quando [bad_memory.GetThirdPerspectiveDescription].\"#!"
 murder_outcome_reworked.0000.memories.target.voice_overheard:0 "\n\nÀ medida que eu desmaio, uma voz fria sussurra: #EMP \"Considere isso como vingança pelo tempo [bad_memory.GetSecondPerspectiveDescription], car[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitleAsNameNoTooltip]. Espero que tenha valido a pena.\"#!"
 murder_outcome_reworked.0000.revealed.failure.1:0 "\n\nPior ainda, evidências suficientes surgiram para provar meu envolvimento no crime, me marcando como falho e assassino."
 murder_outcome_reworked.0000.revealed.generic.1:0 "\n\nInfelizmente, não importa o quanto eu proteste, acusações infundadas de todos os lados apontam diretamente para #EMP eu#! como a mente por trás do incidente."
 murder_outcome_reworked.0000.revealed.owner.response.1:0 "Que acusações infundadas!"
 murder_outcome_reworked.0000.revealed.scheme_target.failure.1.incapable:0 "\n\nSe as palavras ainda tivessem algum significado para mim, eu reconheceria o que todos ao meu redor murmuram e repetem com raiva: \"Foi [owner_to_reveal.GetTitledFirstName]!\""
 murder_outcome_reworked.0000.revealed.scheme_target.failure.1:0 "\n\nApesar dos fervorosos protestos [owner_to_reveal.GetHerHim], todas as evidências apontam para o envolvimento direto de [owner_to_reveal.GetTitledFirstName] no incidente."
 murder_outcome_reworked.0000.revealed.scheme_target.failure.2:0 "\n\nNão apenas o assassinato falhou, mas a trilha desajeitada de evidências deixada para trás leva diretamente ao seu cérebro: [owner_to_reveal.GetTitledFirstName]!"
 murder_outcome_reworked.0000.revealed.scheme_target.failure.baby.2:0 "\n\nNão entendo os sussurros zangados dos servos: \"Foi [owner_to_reveal.GetTitledFirstName]!\""
 murder_outcome_reworked.0000.revealed.scheme_target.failure.baby.end:0 "Eu sou apenas um bebê, afinal."
 murder_outcome_reworked.0000.revealed.scheme_target.failure.baby:0 "\n\nNão entendo os gritos dos servos quando me encontram, nem seus sussurros: \"Foi [owner_to_reveal.GetTitledFirstName]!\""
 murder_outcome_reworked.0000.revealed.scheme_target.success.1.incapable:0 "\n\nQuando meu corpo for encontrado, muitas palavras terão sido ditas, cujo significado há muito escapou da minha mente débil: \"Foi [owner_to_reveal.GetTitledFirstName]!\""
 murder_outcome_reworked.0000.revealed.scheme_target.success.1:0 "\n\nÀ medida que a morte me reclama, não há um momento de dúvida em minha mente sobre quem trouxe isso sobre mim: [owner.GetTitledFirstName]!"
 murder_outcome_reworked.0000.revealed.scheme_target.success.2:0 "\n\nMesmo enquanto minha mente se apaga, meus últimos pensamentos são de que isso foi sem dúvida obra daquel[Select_CString( owner_to_reveal.IsFemale, 'a', 'e' )] [owner.Custom2('InsultAdjective', ROOT.Char)] [owner.Custom2('InsultNoun', ROOT.Char)], [owner_to_reveal.GetTitledFirstName]!"
 murder_outcome_reworked.0000.revealed.scheme_target.success.baby.end:0 "Eu era apenas um bebê, afinal."
 murder_outcome_reworked.0000.revealed.scheme_target.success.baby:0 "\n\nEu não teria entendido o pânico quando os servos me encontraram, nem seus sussurros: \"Foi [owner_to_reveal.GetTitledFirstName]!\""
 murder_outcome_reworked.0000.revealed.scheme_target.success.child:0 "\n\nNunca verei a desesperadora angústia da minha família, nem ouvirei os sussurros entre os servos: \"Foi [owner_to_reveal.GetTitledFirstName]!\""
 murder_outcome_reworked.0000.revealed.scheme_target.success.no_linebreak.1:0 "Não há um momento de dúvida em minha mente sobre quem trouxe isso sobre mim. [owner.GetTitledFirstName]!"
 murder_outcome_reworked.0000.revealed.scheme_target.success.no_linebreak.2:0 "Isso foi sem dúvida obra daquel[Select_CString( owner_to_reveal.IsFemale, 'a', 'e' )] [owner.Custom2('InsultAdjective', ROOT.Char)] [owner.Custom2('InsultNoun', ROOT.Char)], [owner_to_reveal.GetTitledFirstName]!"
 murder_outcome_reworked.0000.revealed.success.1:0 "\n\nInfelizmente, alguém, em algum lugar, cometeu um erro e deixou meu envolvimento no crime ser conhecido; ao menos posso me consolar com o fato de que [target.GetTitledFirstName] está em pior situação do que eu."
 murder_outcome_reworked.0000.success_declaration.generic.1:0 "[target.GetTitledFirstName] finalmente está mort[Select_CString( target.IsFemale, 'a', 'o' )]!"
 murder_outcome_reworked.0000.success_declaration.generic.2:0 "Meus agentes conseguiram assassinar [target.GetTitledFirstName]!"
 murder_outcome_reworked.0000.success_declaration.generic.3:0 "[target.GetTitledFirstName] foi enviad[Select_CString( target.IsFemale, 'a', 'o' )] ao abraço fatal de [ROOT.Char.GetFaith.DeathDeityNamePossessive]!"
 murder_outcome_reworked.0000.successful_scheme_target.adult:0 "Eu ainda tinha tanto a fazer..."
 murder_outcome_reworked.0000.successful_scheme_target.child:0 "Não é justo!"
 murder_outcome_reworked.0000.successful_scheme_target.incapable:0 "Então, apenas o nada."
 murder_outcome_reworked.0001.desc.assassin_present_at_location.consort:0 "[assassin.GetFirstName], como [Select_CString( target.IsFemale, 'sua', 'seu' )] [assassin.Custom2('GetYourConsortType', target)], já estava claro no local: tudo o que [assassin.GetSheHe] tinha a fazer era esperar [target.GetFirstNameNoTooltip] adormecer, puxar a faca fornecida de baixo do travesseiro [assassin.GetHerHim] e cortar a garganta d[Select_CString( target.IsFemale, 'a', 'o' )] [target.Custom2('InsultNoun', ROOT.Char)]. Uma corda jogada pela janela, alguns cortes auto-infligidos e sinais de luta preparados abaixo falsificaram bem a fuga do \"verdadeiro\" assassino."
 murder_outcome_reworked.0001.desc.hired_assassin.assassin_present_at_location:0 "[assassin.GetFirstName] executou nosso plano perfeitamente. Na calada da noite, [assassin.GetSheHe] se esgueirou por uma brecha nas patrulhas, entrou nas câmaras de nossa presa com uma chave roubada e trouxe a existência miserável de [target.GetFirstNamePossessiveNoTooltip] a um fim úmido e gorgolejante."
 murder_outcome_reworked.0001.desc.hired_assassin.assassin_remote_working:0 "[Select_CString( dummy_assassin_gender.IsFemale, 'A', 'O' )] contratad[Select_CString( dummy_assassin_gender.IsFemale, 'a', 'o' )] de [assassin.GetFirstNamePossessive] executou nosso plano perfeitamente. Na calada da noite, [Select_CString( dummy_assassin_gender.IsFemale, 'a', 'o' )] [dummy_assassin_gender.GetWomanMan] se esgueirou por uma brecha nas patrulhas, entrou nas câmaras de nossa presa com uma chave roubada e trouxe a existência miserável de [target.GetFirstNamePossessiveNoTooltip] a um fim úmido e gorgolejante."
 murder_outcome_reworked.0002.desc:0 "$murder_outcome.5001.hired_assassin$"
 murder_outcome_reworked.0003.desc:0 "O assassino cometeu um erro crítico no momento mais delicado! [target.GetFirstNameNoTooltip] acordou para ver uma figura ameaçadora encapuzada ao lado de sua cama e imediatamente gritou por ajuda, fazendo nosso agente assustado sair correndo."
 murder_outcome_reworked.0004.desc:0 "Barulhos de mãos atrapalhadas e maldições sussurradas me acordam do meu sono.\n\nPerto de mim — #EMP perto demais para conforto#! — está uma figura encapuzada, aparentemente tão assustada quanto eu. Meu grito repentino por ajuda a faz fugir, enquanto os guardas correm para dentro."
 murder_outcome_reworked.0011.desc:0 "Não levou muito, na verdade — apenas um bando de bandidos desesperados por prata e uma oportunidade planejada para eles atacarem — mas os resultados foram #EMP impressionantes#!. A luta pegou os defensores [target.GetHerHim] completamente desprevenidos, permitindo que um dos facínoras acertasse o bastardo bem no olho."
 murder_outcome_reworked.0012.desc.alley:0 "Minha comitiva e eu estamos viajando pelas ruas estreitas de [target.GetCurrentLocation.GetName],"
 murder_outcome_reworked.0012.desc.wilderness:0 "Minha comitiva e eu estamos viajando pelas selvas de [target.GetCurrentLocation.GetName],"
 murder_outcome_reworked.0012.desc:0 "quando um grito estridente corta nossas fileiras.\n\nAparentemente do nada, somos atacados por um bando de bandidos! Flechas e espadas voam espessas e rápidas, pura ferocidade e desejo de morte dizimando meus guardas em um piscar de olhos. Não querendo que essa emboscada seja minha tumba, dou fuga, correndo para um lugar mais seguro. Então, sobre o barulho da batalha, ouço o puro som de uma única corda de arco."
 murder_outcome_reworked.0013.desc:0 "Nosso plano parecia... tão perfeito... uma distração planejada, uma horda de bandidos desesperados e uma emboscada repentina. Deveria ter sido a tumba de [target.GetFirstNamePossessiveNoTooltip], mas os malditos guardas [target.GetHerHim] se jogaram em frente a cada golpe, flecha ou lâmina, se reagruparam e contra-atacaram. Nossos contratados caíram em grande número."
 murder_outcome_reworked.0014.desc:0 "Quando um grito estridente corta nossas fileiras.\n\nAparentemente do nada, somos atacados por um bando de malfeitores! O ataque deles é feroz, mas nada comparado à fúria dos meus guardas, e nos lançamos para enfrentá-los. Uma luta brutal se segue, com os assassinos #EMP claramente#! me tendo como alvo principal. Só um tolo não reconheceria isso como uma tentativa de assassinato."
 murder_outcome_reworked.0021.desc:0 "Foram semanas de preparação para meu plano: um prato envenenado, adequado para um[Select_CString( target.IsFemale, 'a', '' )] [target.GetWomanMan] de sua estatura. Sempre [Select_CString( target.IsFemale, 'a', 'o' )] tol[Select_CString( target.IsFemale, 'a', 'o' )], [target.GetFirstNameNoTooltip] não conseguiu perceber o veneno além da cama de pato temperado com ervas exóticas. Claramente não percebeu a amargura mortal até ser tarde demais."
 murder_outcome_reworked.0022.desc:0 "Estou saboreando um pato assado particularmente delicioso no meu banquete quando... que amargor estranho é esse no final? Esse maldito cozinheiro deve ter —\n\nMinha garganta incha. Algo espesso e pesado explode em meu pescoço, nublando minha visão com uma dor de cabeça que se abate sobre minha testa como uma tempestade furiosa. Por que... por que minha visão se nublou e escureceu tanto? Em algum lugar, uma risada distante se transforma em um grito horrorizado. Não consigo me concentrar, #DIE1 não consigo pensar#!, #DIE2 não consigo...#!"
 murder_outcome_reworked.0023.desc:0 "#EMP Idiota!#! Como é possível que sempre haja um deles para arruinar até os planos mais perfeitos?!\n\nO pato estava pronto para ser servido, o cheiro do veneno habilidosamente escondido por uma cama de ervas aromáticas, o silêncio dos cozinheiros generosamente comprado... E ainda assim um tolo de um servo #EMP teve#! que provar o prato, só para cair morto na frente de [target.GetFirstNameNoTooltip]!"
 murder_outcome_reworked.0024.desc:0 "Quando estou prestes a morder o pedaço mais suculento de pato que já vi, um dos meus servos desaba, caindo de cara na mesa e se agarrando à garganta. Ele tinha se servido de um pedaço do meu prato!\n\nPelo menos ele serviu como um aviso para não tocar no pato, enquanto recebia a punição justa por seu crime."
 murder_outcome_reworked.0031.desc:0 "O plano funcionou como um charme: minha preciosa [SCOPE.Custom('VenomousCreature')] estava esperando por [target.GetFirstNameNoTooltip] na cama [target.GetHerHim] quando [target.GetSheHe] se retirou para a noite, silenciosa e pronta para atacar na primeira provocação. E então [target.GetFirstNameNoTooltip] se moveu."
 murder_outcome_reworked.0033.desc:0 "O plano era, supostamente, à prova de tolos: uma [SCOPE.Custom('VenomousCreature')] estava esperando por [target.GetFirstNameNoTooltip] na cama [target.GetHerHim] quando [target.GetSheHe] se retirou para a noite; [target.GetSheHe] só precisava deitar e deixar a pequena criatura fazer seu trabalho! Em vez disso, [Select_CString( target.IsFemale, 'a', 'o' )] [target.Custom2('InsultNoun', ROOT.Char)] percebeu o movimento suspeito nos cobertores e matou a [SCOPE.Custom('VenomousCreatureType')] antes que ela pudesse atacar."
 murder_outcome_reworked.0034.desc:0 "Quando me retiro para a noite, um movimento suspeito entre os cobertores da minha cama chama minha atenção. Eu puxo os cobertores com cuidado para não assustar nenhum visitante indesejado, só para encontrar uma [SCOPE.Custom('VenomousCreatureType')] me esperando!\n\n"
 murder_outcome_reworked.0034.desc_end:0 "Sem hesitar, agarro minha adaga e apunhalo a criatura firmemente no lugar."
 murder_outcome_reworked.0034.desc_unknown:0 "Não consigo identificar precisamente a pequena criatura, mas duvido que ela seja amigável."
 murder_outcome_reworked.0041.desc:0 "Uma multidão agitada de camponeses furiosos estava esperando por [target.GetFirstNameNoTooltip] no caminho [target.GetHerHim] pela cidade.\n\nA simples visão d[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetLadyLord] cavalgando descuidadamente foi suficiente para que eles explodissem em violência mortal. Os poucos guardas que acompanhavam seu senhor foram impotentes contra a fúria cega de uma multidão sedenta por sangue; [target.GetFirstNameNoTooltip] foi pisoteado, espancado e esfaqueado até a irreconhecibilidade — sem chance de sobrevivência."
 murder_outcome_reworked.0042.desc:0 "Estou totalmente imerso em meus pensamentos enquanto cavalo pela cidade, sem dar atenção aos murmúrios nervosos dos meus guardas ou à multidão crescente bloqueando nosso caminho. Quando percebo, já é tarde.\n\nCamponeses furiosos nos cercam, nos arrancam dos cavalos e nos espancam impiedosamente. Enquanto golpes implacáveis caem sobre mim, tantos que não consigo contar, minha visão se obstrui com sangue, e então tudo se torna negro."
 murder_outcome_reworked.0043.desc:0 "Tudo estava indo tão bem: meus agitadores haviam reunido com sucesso uma multidão de camponeses e inflamado adequadamente seus ânimos contra [target.GetFirstNameNoTooltip].\n\nNo entanto, quando [target.GetFirstNameNoTooltip] fez sua aparição cercado de guardas armados, a sede de sangue da multidão evaporou como neve ao sol! Apenas alguns desavisados atacaram, e logo foram abatidos pelos soldados."
 murder_outcome_reworked.0044.desc:0 "Enquanto cavalo pela cidade com meu séquito, não consigo deixar de notar a multidão crescente nos cercando de todos os lados.\n\nFelizmente, esta manhã decidi partir com um grupo considerável de soldados bem armados, cuja presença está fazendo maravilhas para acalmar o descontentamento da multidão. Quando um pequeno contingente de camponeses com aparência zangada tenta nos atacar, meus guardas os cortam facilmente, dispersando os remanescentes."
 murder_outcome_reworked.0051.desc:0 "O plano era elegante em sua simplicidade: convidei [target.GetFirstNameNoTooltip] para um drinque, sabendo muito bem que [target.GetSheHe] não conseguiria parar até ficar completamente embriagad[Select_CString( target.IsFemale, 'a', 'o' )]. Então, o tolo me seguiu sem protestar para o porão e logo adormeceu. [target.GetSheHe|U] nem se mexeu enquanto meus servos erguiam uma parede para selar a entrada do cômodo. #EMP Para sempre.#!"
 murder_outcome_reworked.0053.desc:0 "Tudo estava indo conforme o plano: convidei [target.GetFirstNameNoTooltip] para um drinque, sabendo muito bem que [target.GetSheHe] não conseguiria parar até ficar completamente embriagad[Select_CString( target.IsFemale, 'a', 'o' )]. Então, o tolo me seguiu sem protestar para o porão e logo adormeceu. Meus servos deveriam ter apenas construído uma parede e selado [target.GetHerHim] lá dentro, mas aparentemente estavam #EMP muito cansados#! e não terminaram o trabalho, então [target.GetFirstNameNoTooltip] conseguiu escapar!"
 murder_outcome_reworked.0061.desc:0 "Navios afundam o tempo todo. É um fato da vida. Às vezes, eles são #EMP ajudados#! a afundar por algum sabotagem, exatamente quando estão um pouco longe demais da costa. O abraço gelado do mar aberto é chocante, me dizem. Eu poderia perguntar [Select_CString( target.IsFemale, 'a', 'ao' )] [target.GetFirstNameNoTooltip], se [target.GetSheHe] não tivesse se afogado. Uma verdadeira #EMP tragédia#!."
 murder_outcome_reworked.0062.desc:0 "\n\nNão tenho tempo de reagir enquanto o mastro quebrado cai sobre mim, tirando todo o ar dos meus pulmões e me jogando para fora do navio. O choque do impacto com a água gelada faz o resto, enquanto minhas roupas pesadas me puxam para baixo... sob as ondas..."
 murder_outcome_reworked.0062.desc_port:0 "Estou a bordo de um navio local para uma viagem curta de supervisão. A costa ainda está visível e minha mente está toda absorvida por algum relatório ou outro, então mal ouço o som repentino de um estalo e os gritos dos marinheiros."
 murder_outcome_reworked.0062.desc_travel:0 "Eu adoro o mar aberto! O sol beijando meu rosto, o vento varrendo minha capa, o cheiro fresco de água salgada preenchendo meu nariz, os estranhos estalos acompanhados pelos gritos frenéticos dos marinheiros— Espera, #EMP O QUÊ#!?"
 murder_outcome_reworked.0063.desc:0 "Navios afundam o tempo todo. É um fato da vida. Ou, pelo menos, #EMP deveria#! ser! Quão difícil é sabotar um pedaço de lixo flutuante para que ele acabe sob as ondas, junto com [target.GetFirstNameNoTooltip]?!\n\nAparentemente, foi difícil demais para meus cúmplices, já que o navio de [target.GetFirstNamePossessiveNoTooltip] voltou em segurança com apenas um pequeno contratempo pelo caminho. Um contratempo claramente encenado e potencialmente letal."
 murder_outcome_reworked.0064.desc:0 "Meu navio navega tranquilamente sob o sol poente quando um estalo e os gritos frenéticos dos marinheiros chamam minha atenção. Em um instante, me vejo sendo arrastado por um dos meus guardas, enquanto uma parte do mastro cai e para exatamente na minha frente.\n\nO dano ao navio é considerável, mas o capitão está confiante de que vamos chegar ao porto mais próximo com segurança. E o mais importante, ninguém se feriu."
 murder_outcome_reworked.0071.desc:0 "Meus cúmplices conseguiram acesso nada menos que ao próprio cálice de [target.GetFirstNamePossessiveNoTooltip] no último jantar [target.GetHerHim]! Sem serem notados, derramaram apenas algumas gotas de um veneno poderoso na bebida [target.GetHerHim]. [Select_CString( target.IsFemale, 'A', 'O' )] pobre [target.Custom2('InsultNoun', ROOT.Char)] bebeu o cálice inteiro de uma vez e já era antes de perceber o que estava acontecendo!"
 murder_outcome_reworked.0073.desc:0 "Meus cúmplices conseguiram furtar um barril envenenado para a cozinha de [target.GetFirstNamePossessiveNoTooltip] e prepararam e serviram [target.GetSheHe] um cálice completo da bebida adulterada. A ideia do barril foi um erro.\n\nAntes mesmo d[Select_CString( target.IsFemale, 'a', 'o' )] [target.Custom2('InsultNoun', ROOT.Char)] levar o cálice aos lábios, os servos irromperam na sala, anunciando que alguém que havia bebido do mesmo barril havia morrido imediatamente."
 murder_outcome_reworked.0074.desc:0 "Estou desfrutando de um jantar em uma noite como qualquer outra. Um cálice adorável cheio até a borda repousa à minha frente, tentador. Quando finalmente estico a mão para pegá-lo, uma série de servos irrompe na sala gritando. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], pare! Está envenenado! Alguém de nós que bebeu do mesmo barril morreu imediatamente!\" Minha mão congela no ar."
 murder_outcome_reworked.4001.desc:0 "[target.GetSheHe|U] estava tão animado com sua viagem para a floresta! Tristemente, todo mundo sabe que florestas não são lugar para crianças — tão jovens, tão #EMP ingênuas#! — é tão fácil para elas se deixarem levar pelo entusiasmo e perderem a orientação, os guardiões e o caminho de volta para casa. Elas nunca retornam. Assim como [Select_CString( target.IsFemale, 'a', 'o' )] pequen[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetFirstNameNoTooltip]. Que tragédia."
 murder_outcome_reworked.4003.desc:0 "Era para ser tão fácil! Florestas não são lugar para crianças: escuras, perigosas, cheias de ravinas, plantas venenosas e bestas carnívoras! Quão difícil é para uma criança apenas se perder e morrer?!\n\nAparentemente foi difícil demais para [target.GetFirstNameNoTooltip], já que [Select_CString( target.IsFemale, 'a', 'o' )] pequen[Select_CString( target.IsFemale, 'a', 'o' )] imbecil teve a #EMP ousadia#! de encontrar o caminho de volta para casa são e salvo!"
 murder_outcome_reworked.4011.desc:0 "Crianças são criaturas tão frágeis... Qualquer doença pode tirá-las da família. Ou qualquer acidente! Como aqueles envolvendo cabecinhas delicadas e agulhas afiadas — eu não precisava nem queria ouvir os detalhes, contanto que o trabalho fosse feito. Tão horrível, que #EMP desgraça#!."
 murder_outcome_reworked.4013.desc:0 "As pessoas têm tantos receios quando se trata de crianças. Meus cúmplices concordaram que [target.GetFirstNameNoTooltip] precisava morrer, foram generosamente pagos para fazer isso, e ainda assim hesitaram diante da simples visão do bebê dormindo pacificamente! Era tão fácil, apenas uma punhalada onde a cabeça é mais macia, e teria acabado... Que oportunidade desperdiçada."
 murder_outcome_reworked.4021.desc:0 "As pessoas são estranhas. É difícil encontrar alguém disposto a levantar a mão contra um bebê, mas colocar uma [SCOPE.Custom('VenomousCreature')] no berço é, aparentemente, muito mais aceitável. O [SCOPE.Custom('VenomousCreatureType')], por sua vez, também não tinha qualquert hesitação e atacou com precisão. O veneno fez sua parte rápida e implacavelmente."
 murder_outcome_reworked.4023.desc:0 "A [SCOPE.Custom('VenomousCreature')] foi entregue ao berço de [target.GetFirstNamePossessiveNoTooltip] conforme o planejado, mas, aparentemente, os movimentos do bebê assustaram a criatura, fazendo-a se esconder ao invés de atacar. A criatura inútil foi encontrada algumas horas depois por um servo, escondida sob um armário. O maldito bebê ficou ileso."
 murder_outcome_reworked.4024.desc:0 "Uma cama macia abaixo de mim e um cobertor quente cobrindo-me são tudo o que desejo. Estou quase inconsciente quando sinto vagamente uma sensação curiosa, como se algo estivesse subindo pelo meu corpo. Viro bruscamente para o lado e a sensação desaparece. Adormeço.\n\nMais tarde, sou acordado pelos gritos agudos de um servo. Não tenho certeza do que está acontecendo: muitos adultos correm por aí, suas vozes fortes retumbando, e muitos apontam para algo que não consigo ver sob um armário."
 murder_outcome_reworked.4031.desc:0 "Crianças são tão ingênuas! Eu só tive que disfarçar um dos meus cúmplices como um servo, fazer com que ele trouxesse um pedaço de bolo delicioso e absolutamente envenenado para [target.GetFirstNameNoTooltip], e o pequeno idiota simplesmente engoliu tudo de uma vez, sem fazer perguntas!\n\nTalvez devêssemos começar a ensinar as crianças a não aceitar doces de estranhos..."
 murder_outcome_reworked.4033.desc:0 "Malditas crianças e sua imprevisibilidade! Era para ser tão fácil: colocar um doce envenenado, mas irresistível, na frente de [target.GetFirstNameNoTooltip], e [target.GetFirstNameNoTooltip] morre. Que tipo de criança responde \"Não estou com fome\" quando é oferecido um #EMP doce#!"
 murder_outcome_reworked.4034.desc:0 "Eu estou brincando, sentindo um pouco de sede, quando um servo aparece do nada me oferecendo um [ROOT.Char.Custom('FavoriteTreat')]. Mas eu não quero um [ROOT.Char.Custom('FavoriteTreat')], eu quero beber! Servo tolo!\n\nJá esqueci tudo sobre o incidente quando vários servos se aproximam de mim, horas depois, me parabenizando por ser tão inteligente e corajoso por frustrar algum plano maligno ou algo assim. Seja lá. Agora eu quero um [ROOT.Char.Custom('FavoriteTreat')]!"
 murder_outcome_reworked.4041.desc:0 "Tudo eventualmente cai: reinos, [ROOT.Char.Custom('LadiesLords')], #EMP crianças empurradas de altos lugares#!...\n\nUma tragédia inevitável."
 murder_outcome_reworked.4043.desc:0 "Quando meu agente empurrou [target.GetSheHe] pela borda, a roupa [target.GetHerHim] ficou presa em uma parte saliente da parede logo abaixo. Isso manteve [target.GetSheHe] tempo suficiente para que a ajuda chegasse para salvar a criança e"
 murder_outcome_reworked.7001.desc:0 "Uma certeza da vida é que os carcereiros só se importam com quem está autorizado a sair da prisão, e mal se importam com quem entra ou o que acontece com eles.\n\nQuando meus cúmplices ofereceram a eles um generoso suborno para permitir que visitassem s[Select_CString( target.IsFemale, 'ua', 'eu' )] #EMP [Select_CString( target.IsFemale, 'boa amiga', 'bom amigo' )]#! [target.GetFirstNameNoTooltip], eles estavam mais do que dispostos a aceitar. Ignorar os gritos e ossos quebrando fazia parte do serviço."
 murder_outcome_reworked.7003.desc:0 "$murder_outcome_reworked.7001.desc$ Então, por que eles tiveram que intervir antes de o trabalho ser concluído?!"
 murder_outcome_reworked.7004.desc:0 "$murder_outcome.5001.beat_to_death_in_dungeon$ Então, meus carcereiros habituais irrompem, e a surra para."
 murder_outcome_reworked.7011.desc:0 "Prisioneiros sob prisão domiciliar devem ser vigiados de perto; portanto, fazer um dos meus agentes se infiltrar na casa de [target.GetFirstNamePossessiveNoTooltip] sob o disfarce de visitar um velho amigo foi um verdadeiro golpe de genialidade, se eu posso me gabar disso! Meu cúmplice entrou e saiu antes que os guardas soubessem que algo estava errado."
 murder_outcome_reworked.7012.desc:0 "Meus guardas introduziram uma figura encapuzada desconhecida em minha sala como um velho amigo meu. Estou prestes a protestar que deve haver um engano, pois eu claramente não conheço essa pessoa, quando uma faca brilhante aparece de um bolso escondido. #EMP Oh.#! É um dos #EMP daqueles#! velhos amigos.\n\nNão tenho tempo para reagir, pois a faca voa em minha direção mais rápido do que uma flecha, e eu caio no chão sem emitir um som."
 murder_outcome_reworked.7013.desc:0 "Prisioneiros sob prisão domiciliar devem ser vigiados de perto; portanto, fazer um dos meus agentes se infiltrar na casa de [target.GetFirstNamePossessiveNoTooltip] sob o disfarce de visitar um velho amigo deveria ser um verdadeiro golpe de genialidade! Infelizmente, os guardas não compraram muito bem a história do meu cúmplice e ficaram esperando bem fora da sala, prontos para intervir em caso de qualquer movimentação suspeita. Aparentemente, tentativa de assassinato #EMP conta#! como #EMP atividade suspeita#!."
 murder_outcome_reworked.8001.desc:0 "Os dias de glória de [target.GetFirstNamePossessiveNoTooltip] ficaram para trás há muito tempo. No entanto, [target.GetSheHe] se agarrou à vida por tanto tempo, tão desesperadamente, tão #EMP vaidosamente#!... Acredito que o que meu agente fez foi nada mais do que um ato de misericórdia. [target.GetFirstNameNoTooltip] era apenas uma casca vazia. Isso é realmente assassinato?"
 murder_outcome_reworked.8003.desc:0 "É revoltante como um agente pode ser incrivelmente incompetente. Quão difícil pode ser estrangular uma pessoa frágil cuja mente já não está mais presente e que está mal viva?! E ainda assim, só encontro fracasso."
 murder_unknown_murder_against_you_was_successful:0 "#X Você foi assassinado por um agressor desconhecido!#!"
 murder_unknown_murder_against_you_was_successful_other:0 "#X [THIS.Char.GetShortUIName] foi assassinado por um agressor desconhecido!#!"
