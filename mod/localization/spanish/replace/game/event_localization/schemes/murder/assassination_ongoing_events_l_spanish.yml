l_spanish:
 assassin_doubt_event_nothing_else:0 "para que eu reafirme sua fé em [assassin.GetFaith.PositiveAfterLife3|U]."
 assassination_console.failure:0 "Você falha em tranquilizar [assassin.GetFirstNameNoTooltip]"
 assassination_console.success:0 "Você tranquiliza [assassin.GetFirstNameNoTooltip]"
 assassination_console_toast.failure:0 "[assassin.GetFirstNameNoTooltip] continua a duvidar"
 assassination_console_toast.success:0 "[assassin.GetFirstNameNoTooltip] endurece sua resolução"
 assassination_doubt_event_alcohol_desc:0 "para beber tanto que [assassin.GetSheHe] possa contemplar o mundo além."
 assassination_doubt_event_confide_desc:0 "alguém que ouvirá [assassin.GetSheHe] e o tranquilizará."
 assassination_doubt_event_food_desc:0 "para se deliciar por um momento com os prazeres que apenas boa comida pode trazer."
 assassination_doubt_event_hashish_desc:0 "para se acalmar com haxixe, para se tornar um recipiente vazio para a vontade de [assassin.GetFaith.HighGodName]."
 assassination_doubt_event_meditation_desc:0 "um momento de consolo e diálogo interno com [assassin.GetFaith.HighGodName]."
 assassination_doubt_event_orgy_desc:0 "uma noite de celebração com concubinas, que eu posso providenciar com prazer."
 assassination_hunted_down.failure:0 "Você falha em caçar [dummy_assassin_gender.GetSheHe]"
 assassination_hunted_down.success:0 "O assassino renegado é caçado e morto"
 assassination_hunted_down_toast.failure:0 "Você falhou em encontrar o renegado"
 assassination_hunted_down_toast.success:0 "Você silenciou o renegado"
 assassination_not_usury_event_title:0 "Um Pequeno Saco de Ouro"
 assassination_ongoing.0001.a:0 "Farei boas palavras sobre [secret_sympathizer.GetHerHim] diante de [ROOT.Char.GetFaith.HighGodNameAlternate]."
 assassination_ongoing.0001.b:0 "Não posso abençoar todos os desamparados que você traz até mim."
 assassination_ongoing.0001.desc:0 "[Select_CString( assassin.IsFemale, 'Minha assassina', 'Meu assassino' )], [assassin.GetName], descobriu que [secret_sympathizer.GetName], um dos cortesãos de [target.GetNamePossessive], é de certa forma simpático à nossa causa - mesmo que não pratique abertamente a fé do [ROOT.Char.GetFaith.GetName].\n\n\"[secret_sympathizer.GetSheHe|U] está dispost[Select_CString( secret_sympathizer.IsFemale, 'a', 'o' )] a nos ajudar neste plano\", explica [assassin.GetFirstNameNoTooltip]. \"Mas em troca, [secret_sympathizer.GetSheHe] quer receber suas bênçãos e seu favor como um grande campeão [ROOT.Char.GetFaith.GetAdherentNameNoTooltip].\""
 assassination_ongoing.0001.t:0 "Um Simpatizante Secreto"
 assassination_ongoing.0002.a:0 "Todo homem e mulher entre os fiéis são bem-vindos para nos ajudar!"
 assassination_ongoing.0002.b:0 "Prefiro não confiar nesses vagabundos..."
 assassination_ongoing.0002.desc:0 "[assassin.GetName] pareceu estressado ao preparar-se para sua missão. Sei, é claro, que a perspectiva de uma morte agonizante não o desencoraja, então deve ser algo mais. Quando pergunto, [assassin.GetSheHe] vai direto ao ponto.\n\n\"Eu preciso de mais associados para me ajudar a executar esta missão contra [target.GetTitledFirstName]\", [assassin.GetSheHe] me diz. \"Encontrei alguns devotos [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] no deserto, onde foram enviados para o exílio por [Select_CString(ROOT.Char.IsFemale,'uma senhora','um senhor')] hostil à nossa causa. Eles estariam dispostos a ajudar, se lhes fornecermos armas e armaduras.\""
 assassination_ongoing.0002.t:0 "Cortejando Fanáticos"
 assassination_ongoing.0003.a:0 "Errar é humano..."
 assassination_ongoing.0003.b:0 "Não vejo motivo para hesitar!"
 assassination_ongoing.0003.c:0 "Não, #italic eu vou conquistar#! a lealdade das pessoas, não comprá-la."
 assassination_ongoing.0003.c_alcohol:0 "Venha, beba comigo."
 assassination_ongoing.0003.c_confide:0 "Venha, confie em mim."
 assassination_ongoing.0003.c_food:0 "Venha, vamos comer juntos."
 assassination_ongoing.0003.c_hashish:0 "Venha, coma alguns bolos de haxixe comigo."
 assassination_ongoing.0003.c_meditation:0 "Venha, vamos meditar juntos."
 assassination_ongoing.0003.c_orgy:0 "Venha, eu vou providenciar uma prévia do [assassin.GetFaith.PositiveAfterLife3|U]..."
 assassination_ongoing.0003.outro:0 " - e eles estão dispostos a nos fornecer informações, mas por um preço. Devemos pagá-los em ouro... discretamente.\"\n\nPor apenas um momento, me pego em dúvida. Serviços podem ser comprados, sim, mas e a lealdade e a confiança?"
 assassination_ongoing.0003_opening:0 "[assassin.GetName] parece ter encontrado uma fraqueza em torno de [target.GetName] que poderíamos explorar.\n\n\"De fato\", diz [assassin.GetSheHe], \"tenho me comunicado secretamente com "
 assassination_ongoing.0004.b:0 "Você não pode vacilar. Confie na sabedoria de [assassin.GetFaith.HighGodName]."
 assassination_ongoing.0004.c:0 "Talvez devêssemos reconsiderar este assassinato..."
 assassination_ongoing.0004.t:0 "Um Momento de Dúvida"
 assassination_ongoing.0004_opening:0 "[assassin.GetName] parece atípicamente apreensivo, talvez até desanimado.\n\n\"Sim\", confessa [assassin.GetSheHe] enquanto me aproximo, \"minha fé está vacilante, [ROOT.Char.Custom('FormOfAddressForLiege')]. Tenho duvidado da promessa de grandes recompensas no além. Devo sacrificar minha vida para matar [Select_CString( target.IsFemale, 'aquela', 'aquele' )] [target.Custom2('InsultAdjective', SCOPE.sC('assassin'))] [target.GetFirstName]? E se [assassin.GetFaith.HighGodNameAlternate] não aprovar matar #EMP todos#! os descrentes?\"\n\nAo olhar para [Select_CString( assassin.IsFemale, 'minha assassina', 'meu assassino' )] mestre em conflito, percebo que tudo o que [assassin.GetSheHe] precisa é "
 assassination_ongoing.0005.a_them:0 "Você é um habilidoso herbalista, faça algo você mesmo."
 assassination_ongoing.0005.a_you:0 "Não há necessidade. Posso criar um veneno para você!"
 assassination_ongoing.0005.b:0 "Não há preço que eu não pagaria pela causa!"
 assassination_ongoing.0005.c:0 "Basta deixar a lâmina de molho em uma latrina durante a noite, isso resolverá."
 assassination_ongoing.0005.d:0 "Não, isso é uma perda de tempo, e abaixo de nós."
 assassination_ongoing.0005.desc:0 "\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetTitleTierName],\" diz [assassin.GetName], \"precisamos usar todas as vantagens à nossa disposição para eliminar [target.GetTitledFirstName]. Há um poderoso veneno, consumido em pequenas quantidades por místicos orientais, que eu poderia usar para revestir minha lâmina. Mas será caro para adquirir...\""
 assassination_ongoing.0005.t:0 "Veneno ou Peste"
 assassination_ongoing.0006.a:0 "Vamos encontrar [dummy_assassin_gender.GetSheHe] - e silenciar [dummy_assassin_gender.GetSheHe] para sempre."
 assassination_ongoing.0006.b:0 "Teremos que conviver com esse risco."
 assassination_ongoing.0006.desc:0 "Uma tentativa foi feita na vida de [target.GetNamePossessive], mas, infelizmente, assim que meu mestre assassino [assassin.GetName] viu uma abertura, um de seus associados foi dominado pelo medo da morte e fugiu.\n\nO plano teve que ser abortado. Felizmente, [target.GetTitledFirstNameNoTooltip] parece não ter percebido nada, e [assassin.GetFirstNameNoTooltip] me assegurou que uma nova tentativa pode ser feita em breve. O assassino fugitivo ainda pode ser um problema, no entanto, se não conseguirmos encontrar [dummy_assassin_gender.GetSheHe]."
 assassination_ongoing.0006.t:0 "Assassino Fugitivo"
 assassination_ongoing.0007.a:0 "Você é um #italic assassino#! Eu não o contratei para hesitar!"
 assassination_ongoing.0007.b:0 "Talvez você esteja certo... vamos parar por enquanto."
 assassination_ongoing.0007.desc:0 "\"Não posso fazer isso\", [Select_CString( assassin.IsFemale, 'minha assassina', 'meu assassino' )] [assassin.GetFirstName] declara subitamente, parecendo [Select_CString( assassin.IsFemale, 'preocupada', 'preocupado' )].\n\n\"Embora [target.GetSheHe] seja um[Select_CString( target.IsFemale, 'a', '' )] herege, [target.GetTitledFirstName] é ainda assim [Select_CString( target.IsFemale, 'uma', 'um' )] [target.GetWomanMan] de grande virtude e forte crença em [assassin.GetFaith.HighGodName]. [target.GetSheHe|U] é [Select_CString( target.IsFemale, 'conhecida', 'conhecido' )] por não ser [Select_CString( target.IsFemale, 'corrupta nem injusta', 'corrupto nem injusto' )]. Se eu matar [target.GetSheHe], temo a ira de [assassin.GetFaith.HighGodName] e terrível castigo no [ROOT.Char.GetFaith.NegativeAfterLife].\""
 assassination_ongoing.0007.t:0 "[Select_CString( target.IsFemale, 'Uma', 'Um' )] [target.GetWomanMan|U] de Virtude?"
 assassination_usury_event_gardener_desc:0 "um jardineiro discreto que costumava ser um [owner.GetFaith.GetAdherentNameNoTooltip]"
 assassination_usury_event_guard_desc:0 "um guarda corrupto"
 assassination_usury_event_harem_slave_desc:0 "um escravo do harém ambicioso"
 assassination_usury_event_minor_servant_desc:0 "um servo de pouca importância, mas de grande habilidade"
 assassination_usury_event_scullery_maid_desc:0 "uma humilde, mas vingativa criada de cozinha"
 assassination_usury_event_title:0 "Ouro e [owner.GetFaith.HighGodNameAlternate]"
 do_not_execute_assassination_tooltip:0 "Não tente o assassinato"
 fp3_sympathizer_might_betray_you.flavor:0 "[secret_sympathizer.GetFirstNameNoTooltip] pode nos atrapalhar, em vez de ajudar..."
