l_spanish:
 death_by_artifact:0 "foi morto com um artefato"
 death_by_artifact_killer:0 "foi morto com um artefato [TARGET_CHARACTER.GetUIName]"
 murder_save.0001.a:0 "Nunca conseguirei [target.GetSheHe] agora."
 murder_save.0001.b:0 "Preciso de um novo plano..."
 murder_save.0001.end:0 "[lover.GetTitledFirstName], [Select_CString( lover.IsFemale, 'a', 'o' )] amante [target.GetHerHim]!\n\n[lover.GetFirstName] se lançou em defesa de [target.GetFirstName], e a luta defensiva deixou tanto [lover.GetSheHe] quanto o assassino mortos no chão."
 murder_save.0001.opening:0 "Minha tentativa de assassinar [target.GetTitledFirstNamePossessive] vida foi frustrada!\n\nO assassino chegou à câmara do [target.GetTitleTierName], mas encontrou [target.GetSheHe] na companhia de"
 murder_save.0001.rel_to_me:0 " — m[Select_CString( lover.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))] — "
 murder_save.0001.t:0 "$murder_save_header$ Frustrado pelo Amor"
 murder_save.0002.end:0 "[lover.GetTitledFirstName], [Select_CString( lover.IsFemale, 'a', 'o' )] amante [target.GetHerHim], quem jaz mort[Select_CString( lover.IsFemale, 'a', 'o' )]!"
 murder_save.0002.opening:0 "[target.GetTitledFirstName] ainda está viv[Select_CString( target.IsFemale, 'a', 'o' )]!\n\nO [SCOPE.Custom('VenomousCreature')] foi colocado na cama do [target.GetTitleTierNamePossessive], mas atingiu o alvo errado! Em vez disso, foi"
 murder_save.0002.rel_to_me:0 " — m[Select_CString( lover.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))] — "
 murder_save.0002.t:0 "$murder_save_header$ Veneno do Amor [SCOPE.Custom('VenomousCreatureAttackPlural')|U]"
 murder_save.0003.a:0 "Que mundo injusto em que vivemos."
 murder_save.0003.b:0 "Devo tentar com um novo plano!"
 murder_save.0003.desc:0 "[target.GetTitledFirstName] ainda está viv[Select_CString( target.IsFemale, 'a', 'o' )]!\n\nMeu assassino chegou à câmara do [target.GetTitleTierName], mas [broken_person.GetTitledFirstName] — de todas as pessoas — interveio! [target.GetFirstName] não fez nada além de atormentar [broken_person.GetSheHe], e ainda assim [broken_person.GetSheHe] deu sua vida para proteger [target.GetSheHe]. Meu assassino está tão morto quanto, e [target.GetFirstName] sai iles[Select_CString( target.IsFemale, 'a', 'o' )]."
 murder_save.0003.t:0 "$murder_save_header$ Assassino"
 murder_save.0004.desc:0 "[target.GetTitledFirstName] ainda está viv[Select_CString( target.IsFemale, 'a', 'o' )]!\n\nMeus capangas contratados emboscaram o séquito [target.GetHerHim] como planejado, mas não conseguiram dominá-los! Eles poderiam ter tomado o [target.GetTitleTierName] se não fosse aquele maldito e terrível cavalo de guerra em que [target.GetSheHe] tanto se orgulha!"
 murder_save.0004.t:0 "$murder_save_header$ Emboscado"
 murder_save.0005.desc:0 "O grupo de conspiradores foi até a cela de [target.GetTitledFirstNamePossessive], mas o prisioneiro começou a fazer um tumulto terrível. Subornar o carcereiro é uma coisa, mas é outra coisa fingir que nada está acontecendo quando todo o castelo é acordado!\n\nMeus assassinos bateram em retirada rapidamente, e [target.GetFirstName] permanece a salvo..."
 murder_save.0005.t:0 "$murder_save_header$ Alarme Disparado"
 murder_save.0006.end:0 "\n\nEles lutaram terrivelmente bravos e incrivelmente bem, o suficiente para que [target.GetFirstName] ainda viva para ver outro dia."
 murder_save.0006.no_spouse:0 "foi criada pelo cônjuge [target.GetHerHim]."
 murder_save.0006.opening:0 "Meus \"ajudantes contratados\" abordaram [target.GetTitledFirstName] conforme planejado, mas o que eu não tinha planejado era a guarda pessoal que"
 murder_save.0006.spouse:0 "[spouse.GetTitledFirstName] havia criado para [target.GetSheHe]."
 murder_save.0006.t:0 "$murder_save_header$ Guardiões"
 murder_save.0007.desc:0 "[target.GetTitledFirstName] ainda está viv[Select_CString( target.IsFemale, 'a', 'o' )]!\n\nA [SCOPE.Custom('VenomousCreature')] foi colocado na cama do [target.GetTitleTierNamePossessive], mas antes que pudesse atacar, o gato do [target.GetTitleTierName] fez um tumulto e começou a lutar contra a criatura!"
 murder_save.0007.t:0 "$murder_save_header$ Guardião Peludo"
 murder_save.0008.desc:0 "Minha tentativa de assassinar [target.GetTitledFirstNamePossessive] foi frustrada!\n\nO assassino foi detido por um daqueles insuportáveis Varangianos! Suponho que [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitleAsNameNoTooltip] conseguiu sua guarda, afinal..."
 murder_save.0008.t:0 "$murder_save_header$ Guardião Peludo"
 murder_save.0009.a:0 "Eu devo recuar, antes que busquem vingança!"
 murder_save.0009.b:0 "O que foi perdido, eu posso reconstruir."
 murder_save.0009.desc:0 "Nos últimos momentos do meu plano para assassinar [target.GetTitledFirstName], tudo desmoronou!\n\nParece que meus esforços foram completamente infiltrados por apoiadores da Dinastia [target.GetDynasty.GetBaseName], e na fatídica noite, todos os outros foram impedidos antes que o plano fosse colocado em ação!"
 murder_save.0009.t:0 "$murder_save_header$ Conexões Familiares"
 murder_save.0010.a:0 "Nunca mais conseguirei [target.GetSheHe]!"
 murder_save.0010.b:0 "Preciso de um novo plano..."
 murder_save.0010.desc:0 "Minha tentativa de tirar a vida de [target.GetTitledFirstNamePossessive] foi frustrada!\n\nO assassino foi impedido por um desses insípidos Varangos! Suponho que [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitleAsNameNoTooltip] conseguiu a proteção [target.GetHerHim]."
 murder_save.0010.t:0 "$murder_save_header$ Varangos"
 murder_save.0010.varangian_dies:0 "\n\nPelo menos o assassino teve vantagem sobre o guarda. [varangian.GetTitledFirstName] não vai mais cruzar meu caminho."
 murder_save.0011.desc:0 "Minha tentativa de tirar a vida de [target.GetTitledFirstNamePossessive] foi frustrada!\n\nO veneno, o pato, a refeição... Tudo estava indo conforme o planejado até que o gato [target.GetHerHim] pegou um pedaço do prato antes que [target.GetSheHe] tivesse tempo de comer! Ao ver o gato contorcendo-se de dor até a morte, [target.GetTitledFirstNameNoTooltip] ficou desencorajado de comer a refeição."
 murder_save.0011.t:0 "$murder_save_header$ O Gato Faminto"
 murder_save.0012.desc:0 "[target.GetTitledFirstName] ainda está viv[Select_CString( target.IsFemale, 'a', 'o' )]!\n\nO veneno, o pato, a refeição... Tudo estava indo conforme o planejado até que o cachorro [target.GetHerHim] implorou por um pedaço do prato antes que [target.GetSheHe] tivesse tempo de comer! Ao ver o cachorro contorcendo-se de dor até a morte, [target.GetTitledFirstNameNoTooltip] ficou desencorajado de comer a refeição."
 murder_save.0012.t:0 "$murder_save_header$ O Cão Faminto"
 murder_save.0013.desc:0 "[target.GetTitledFirstName] ainda está viv[Select_CString( target.IsFemale, 'a', 'o' )]!\n\nO veneno, [target.Custom('GetExpensiveMeal')]... Tudo estava indo conforme o planejado até que [target.GetSheHe] percebeu que algo estava errado. Tentamos envenenar o prato favorito [target.GetHerHim], mas [target.GetSheHe] percebeu imediatamente que tinha um cheiro diferente e jogou-o fora."
 murder_save.0013.t:0 "$murder_save_header$ O Nariz Gourmet"
 murder_save.0014.desc:0 "Minha tentativa de tirar a vida de [target.GetTitledFirstNamePossessive] foi frustrada!\n\nParece que os tolos assassinos não perceberam que [target.GetSheHe] fala [owner.GetCulture.GetLanguage.GetNameNoTooltip], e estavam falando sobre o plano bem na frente do nariz [target.GetHerHim]."
 murder_save.0014.t:0 "$murder_save_header$ Compreensão Fatal"
 murder_save.0015.desc:0 "[target.GetTitledFirstName] sobreviveu à minha tentativa de assassinato, aparentemente usando seu [this_artifact.GetName] para brutalmente assassinar o assassino que enviamos."
 murder_save.0015.t:0 "$murder_save_header$ O Artefato Providencial"
 murder_save.1001.a:0 "Que degenerado cruel estava por trás disso?\"murder_save.1001.a:0 \"Que degenerado cruel estava por trás disso?"
 murder_save.1001.b:0 "[owner.GetTitledFirstNameNoTooltip] pagará por isso!\"murder_save.1001.b:0 \"[owner.GetTitledFirstNameNoTooltip] pagará por isso!"
 murder_save.1001.c:0 "Melhor [lover.GetFirstNameNoTooltip] do que eu!\"murder_save.1001.c:0 \"Melhor [lover.GetFirstNameNoTooltip] do que eu!"
 murder_save.1001.desc:0 "\"Você não machucará [target.GetSheHe]!\" gritou [lover.GetTitledFirstName] e avançou contra a figura sombria que havia entrado em minhas câmaras, com a adaga desembainhada.\n\nQue bênção e maldição que [lover.GetSheHe] estivesse comigo nesta noite. Sem [lover.GetSheHe], isso me custaria a vida, mas dessa forma a luta deixou [lover.GetSheHe] sangrando em meus braços, ao lado do assassino morto.\"murder_save.1001.desc:0 \"\"Você não machucará [target.GetSheHe]!\" gritou [lover.GetTitledFirstName] e avançou contra a figura sombria que havia entrado em minhas câmaras, com a adaga desembainhada.\n\nQue bênção e maldição que [lover.GetSheHe] estivesse comigo nesta noite. Sem [lover.GetSheHe], isso me custaria a vida, mas dessa forma a luta deixou [lover.GetSheHe] sangrando em meus braços, ao lado do assassino morto."
 murder_save.1002.desc:0 "\"Volte para a cama, meu [lover.Custom('LoverPetName')]...\"\n\nEstou prestes a seguir o convite de meu amante quando [lover.GetSheHe] começa a gritar. \"O que é isso?!\" Minha pergunta é respondida quando [lover.GetSheHe] se contorce e se debate o suficiente para revelar [SCOPE.Custom('VenomousCreatureType')] rastejando entre os lençóis.\n\nQuando um médico chega, [lover.GetFirstName] já está se tornando rígid[Select_CString( lover.IsFemale, 'a', 'o' )] e fri[Select_CString( lover.IsFemale, 'a', 'o' )]. Eu também estou gelad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. Esse [SCOPE.Custom('VenomousCreatureType')] era destinado a mim."
 murder_save.1003.a:0 "Considere isso uma punição adequada, [broken_person.GetFirstNameNoTooltip]."
 murder_save.1003.desc:0 "[broken_person.GetTitledFirstName] tenta permanecer impassível enquanto o assassino avança em minha direção.\n\n\"Liderando um assassino até minhas câmaras, [broken_person.GetFirstNameNoTooltip], mesmo depois que seus gritos professaram lealdade eterna?\" Os olhos [broken_person.GetHerHim|U] estão se movendo entre mim e a arma na mão do assassino. \"Que terrível decepção. Você não quer ser uma decepção, quer?\"\n\nAlgo muda nos olhos [broken_person.GetHerHim]. Com um grito, [broken_person.GetSheHe] se atira no assassino em potencial. Ao fim da luta, ambos estão mortos no chão."
 murder_save.1004.a:0 "Esses capangas foram contratados por alguém, mas por quem?"
 murder_save.1004.b:0 "É óbvio quem está por trás disso!"
 murder_save.1004.c:0 "Eu vou descobrir quem fez isso!"
 murder_save.1004.d:0 "Você me custou um cavalo malditamente bom, [owner.GetFirstNameNoTooltip]!"
 murder_save.1004.opening:0 "Estou viajando com meu séquito quando um grito vem de um bosque. \"Ataque! Vão atrás do [ROOT.Char.GetTitleTierName]!\" Uma emboscada!\n\nNão se tratam de bandidos comuns atrás de meu ouro, mas de capangas que querem minha vida! No entanto, meu fiel [ROOT.Char.Custom('HorseStoryMareStallion')] sabe o que fazer! [ROOT.Char.Custom('HorseStorySheHe')|U] se levanta e chuta para me proteger dos golpes enquanto meus guardas se reúnem para enfrentá-los."
 murder_save.1004.warhorse_dies:0 "\n\nÉ apenas quando a luta acaba que [ROOT.Char.Custom('WarhorseStoryName')] cai sob mim, e eu descubro seus ferimentos profundos. [ROOT.Char.Custom('HorseStorySheHe')|U] verdadeiramente me protegeu até o fim..."
 murder_save.1005.a:0 "Eu devo minha vida a você, [ROOT.Char.Custom('prison_pet')]."
 murder_save.1005.b:0 "Seu sacrifício não foi em vão, meu [ROOT.Char.Custom('prison_pet')]!"
 murder_save.1005.desc:0 "Eu não sei quem são as figuras encapuzadas que apareceram repentinamente na minha cela, mas sei que elas estão aqui para me machucar. No entanto, elas não esperavam meu protetor.\n\n\"Peguem eles!\" Grito, e meu [ROOT.Char.Custom('prison_pet')] voa sobre eles, pronto para lutar por minha vida! Sei que eles não são páreo para meu amigo, e enquanto começo a gritar e torcer eles fogem em terror absoluto!\n\nO carcereiro logo chega para me silenciar com uma surra, mas pelo menos ainda estou respirando."
 murder_save.1006.end:0 "lutou valentemente e me protegeu do ataque.\n\nEnquanto eles lutavam até o fim, ficou claro que esses bandidos não estavam atrás de ouro, mas da minha vida! No final, eles foram repelidos, mas minha guarda pessoal foi quase aniquilada."
 murder_save.1006.no_spouse:0 "meu cônjuge"
 murder_save.1006.opening:0 "Eu estava viajando quando meu séquito foi abordado por um bando de bandidos! Felizmente, a guarda criada para mim por"
 murder_save.1006.spouse:0 "[spouse.GetTitledFirstName]"
 murder_save.1007.a:0 "Eu lhe devo minha vida, [THIS.Char.Custom('CatStoryName')]!"
 murder_save.1007.b:0 "É óbvio quem está por trás disso!"
 murder_save.1007.c:0 "Eu vou descobrir quem fez isso!"
 murder_save.1007.cat_dies:0 "\n\nA criatura horrível não desiste facilmente, e quando [THIS.Char.Custom('CatStoryName')] finalmente morde o pescoço dela, [THIS.Char.Custom('CatStorySheHe')] [THIS.Char.Custom('CatStoryHerselfHimself')] está muito debilitado para ser salvo."
 murder_save.1007.d:0 "Você pagará por isso, [owner.GetFirstNameNoTooltip]!"
 murder_save.1007.opening:0 "Ao entrar na minha câmara, imediatamente noto que meu querido gato, [THIS.Char.Custom('CatStoryName')], está inquieto - [THIS.Char.Custom('CatStorySheHe')] está andando de um lado para outro antes da minha cama em óbvia agitação. Como um raio de [THIS.Char.Custom('CatFurColor')] [THIS.Char.Custom('CatStorySheHe')] pula de repente, expondo a [SCOPE.Custom('VenomousCreatureType')] entre os lençóis!"
 murder_save.1008.a:0 "Eu lhe devo minha vida, [ROOT.Char.Custom('DogStoryName')]!"
 murder_save.1008.desc:0 "Assim que entro em meus aposentos, meu querido cão, [ROOT.Char.Custom('DogStoryName')], começa a latir, e de repente [ROOT.Char.Custom('DogStorySheHe')] se lança sobre uma sombra escura... Uma sombra que tropeça! [ROOT.Char.Custom('DogStoryName')] persegue o suposto assassino até eu chamar [ROOT.Char.Custom('DogStoryHerHim')] de volta ao meu lado."
 murder_save.1009.a:0 "Meu próprio nome salvou minha vida!"
 murder_save.1009.end:0 "\n\nO plano desmoronou, mesmo enquanto estava sendo posto em prática, e minha vida ainda está segura."
 murder_save.1009.opening:0 "Uma tentativa de tirar minha vida foi frustrada!"
 murder_save.1009.owner_discovered:0 "\n\n[owner.GetTitledFirstName] havia feito planos cuidadosos, mas estes não consideraram o fato de que sua conspiração foi infiltrada por apoiadores da Casa [target.GetHouse.GetNameNoTooltip]!"
 murder_save.1009.owner_not_discovered:0 "\n\nFelizmente, quem quer que tenha tramado este plano perverso não previu que ele seria infiltrado por agentes virtuosamente leais à Casa [target.GetHouse.GetNameNoTooltip]!"
 murder_save.1010.a:0 "Quem poderia estar por trás dessa tentativa vil?"
 murder_save.1010.b:0 "[owner.GetSheHe|U] pagará por isso!"
 murder_save.1010.desc:0 "Uma tentativa de assassinato foi feita contra mim! Felizmente, [varangian.GetFirstName], um membro da minha Guarda Varangiana, estava do lado de fora das minhas câmaras e interveio rapidamente. [varangian.GetSheHe|U] fez o trabalho rapidamente, antes que eu sofresse qualquer dano."
 murder_save.1010.owner_discovered:0 "\n\nNão há dúvida de que tudo isso foi obra de [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 murder_save.1010.varangian_dies:0 "Tragicamente, [varangian.GetFirstNameNoTooltip] sofreu ferimentos fatais no processo."
 murder_save.1011.desc:0 "Enquanto me sento para comer, meu gato, [ROOT.Char.Custom('CatStoryName')], salta para o meu colo, tentando pegar um pedaço do meu prato, e eu deixo [ROOT.Char.Custom('CatStoryHerHim')] pegar um pedaço antes que [ROOT.Char.Custom('CatStorySheHe')] desça novamente.\n\nAssim que estou prestes a começar a comer, sou surpreendido por um miado alto e doloroso. [ROOT.Char.Custom('CatStoryName')] está se contorcendo no chão, seus gritos de dor enfraquecendo cada vez mais até que ele finalmente fica imóvel. A comida estava envenenada?!"
 murder_save.1012.desc:0 "Enquanto me sento para comer, meu cachorro, [ROOT.Char.Custom('DogStoryName')], me olha com olhos suplicantes, e eu rapidamente deixo um pedaço do meu prato cair no chão para [ROOT.Char.Custom('DogStoryHerHim')].\n\nAssim que estou prestes a começar a comer, sou surpreendido por um gemido alto, doloroso e triste. [ROOT.Char.Custom('DogStoryName')] está se contorcendo no chão, seus lamentos enfraquecendo cada vez mais até que ele finalmente fica imóvel. A comida estava envenenada?!"
 murder_save.1013.desc:0 "Enquanto saboreio meu jantar favorito, um cheiro curioso chega ao meu nariz. Há um leve toque de acidez sob o aroma usual, e o equilíbrio das especiarias parece errado... Depois de questionar o cozinheiro, que garantiu que tudo foi preparado normalmente, só consigo pensar em uma coisa: alguém tentou me envenenar!"
 murder_save.1014.a:0 "Agora, quem enviaria assassinos que falam [owner.GetCulture.GetLanguage.GetNameNoTooltip]?"
 murder_save.1014.desc:0 "Uma noite, enquanto me preparo para dormir, ouço dois dos meus servos falando em voz baixa. Leva um momento para eu perceber que eles estão falando em [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip], em vez de [owner.GetCulture.GetLanguage.GetNameNoTooltip]. Eles claramente não percebem que eu posso entendê-los.\n\n\"Espere [ROOT.Char.GetSheHe] adormecer. Então você vigia enquanto eu corto a garganta [ROOT.Char.GetHerHim].\"\n\nSaio rapidamente dos meus aposentos para informar aos meus guardas que há assassinos no meu quarto. Graças a [ROOT.Char.GetFaith.HighGodName] que eu falo [owner.GetCulture.GetLanguage.GetNameNoTooltip]!"
 murder_save.1015.actual_weapon_artifact.desc:0 "$murder_save.1015.start_desc$ [this_artifact.GetName]. A cor desaparece do rosto [attempted_assassin.GetHerHim], enquanto [attempted_assassin.GetSheHe] percebe que estou armado. É fácil eliminar [attempted_assassin.GetHimHer] com o [SCOPE.Custom('ThisArtifactType')]."
 murder_save.1015.blunt_artifact.desc:0 "$murder_save.1015.start_desc$ [this_artifact.GetName]. Pegando-o, uso-o primeiro para bloquear a investida da faca antes de desferir golpes repetidos na cabeça de [attempted_assassin.GetFirstNamePossessiveNoTooltip].\n\nEventualmente, recuo exausto, deixando cair o [SCOPE.Custom('ThisArtifactType')], onde fica coberto de sangue e gore."
 murder_save.1015.chest_artifact.desc:0 "$murder_save.1015.start_desc$ [this_artifact.GetName]. Lentamente, me afasto, atraindo [attempted_assassin.GetSheHe] em direção ao [SCOPE.Custom('ThisArtifactType')] aberto. No momento perfeito, agarro a cabeça [attempted_assassin.GetHerHim] e a empurro sob a tampa do baú, antes de esmagá-la em sua frágil cabeça com um estalo que causa arrepios.\n\nDerrubo mais três ou quatro vezes para garantir antes de recuar e permitir que o corpo caia ao chão."
 murder_save.1015.sculpture_artifact.desc:0 "$murder_save.1015.start_desc$ [this_artifact.GetName]. Recuando de [attempted_assassin.GetFirstNameNoTooltip], espero o momento perfeito antes de derrubar o [SCOPE.Custom('ThisArtifactType')] sobre [attempted_assassin.GetSheHe].\n\nO [this_artifact.GetNameNoTooltip] faz um ruído repugnante, esmagando [attempted_assassin.GetSheHe] abaixo."
 murder_save.1015.small_artifact.desc:0 "$murder_save.1015.start_desc$ [this_artifact.GetName]. Pegando-o, salto sobre o meu agressor, empurrando o objeto na garganta dele.\n\nEngasgando, [attempted_assassin.GetSheHe] deixa cair a faca, caindo de joelhos enquanto arranha a garganta, tentando desesperadamente respirar. Quando os guardas finalmente vêm em meu auxílio, faço uma nota mental de pedir a alguém que retire [this_artifact.GetName] do corpo mais tarde."
 murder_save.1015.start_desc:0 "[attempted_assassin.GetFirstName|U] sai das sombras, com uma faca na mão. Eu olho ao redor desesperadamente procurando algo para usar como arma antes que meus olhos se fixem no"
 murder_save.1015.strangling_artifact.desc:0 "$murder_save.1015.start_desc$ [SCOPE.Custom('ThisArtifactType')]. Pegando o [this_artifact.GetName], primeiro desvio de um golpe de faca antes de enrolar o material em torno da garganta do meu atacante.\n\nApós alguns momentos de luta, o corpo do assassino fica mole."
 murder_save.1015.throne_artifact.desc:0 "$murder_save.1015.throne_start.desc$ dura madeira do meu [this_artifact.GetName], salpicando o sangue e os dentes [attempted_assassin.GetHerHim] por todo o tecido impecável de [this_artifact.GetFeatureText('generic_material_cloth')]."
 murder_save.1015.throne_special_artifact.desc:0 "$murder_save.1015.throne_start.desc$ [this_artifact.GetName] lendário.\n\n À medida que o sangue espirra no trono, espero que os serviçais consigam remover as manchas."
 murder_save.1015.throne_start.desc:0 "Estou andando de um lado para o outro na minha sala do trono vazia, quando, das sombras, [attempted_assassin.GetFirstName] salta em minha direção com uma faca. Mal conseguindo escapar do meu agressor, eu consigo agarrar a parte de trás da cabeça [attempted_assassin.GetHerHim] e repetidamente esmago o rosto [attempted_assassin.GetHerHim] contra a"
 murder_save.dynasty_member_used_guile_legacy_5_save:0 "Tentativa de Assassinato"
 murder_save.dynasty_member_used_guile_legacy_5_save_desc:0 "[target.GetTitledFirstName] sobreviveu a uma tentativa em sua vida graças à proteção de [GetDynastyPerk('guile_legacy_5').GetName]!"
 murder_save.failure_known_owner_tt:0 "[owner.GetTitledFirstNameNoTooltip] falhou em me assassinar"
 murder_save.failure_unknown_owner_tt:0 "Alguém falhou em me assassinar"
 murder_save.targets_guile_legacy_save_used_up:0 "[target.GetShortUIName|U] não pode ser salvo novamente pelo [GetDynastyPerk( 'guile_legacy_5' ).GetName]"
 murder_save.used_up_guile_legacy_5_save:0 "Gastou a proteção de [GetDynastyPerk('guile_legacy_5').GetName]"
 murder_save_creepy_crawlies_cat_dies:0 "[THIS.Char.Custom('CatStoryName')] morre devido aos ferimentos"
 murder_save_failure_cat_tt:0 "O gato de [target.GetFirstNamePossessiveNoTooltip] morre devido aos ferimentos"
 murder_save_failure_warhorse_tt:0 "Cavalo de guerra de [target.GetFirstNamePossessiveNoTooltip] morre por causa de seus ferimentos"
 murder_save_header:0 "Interceptador de Assassinato:"
