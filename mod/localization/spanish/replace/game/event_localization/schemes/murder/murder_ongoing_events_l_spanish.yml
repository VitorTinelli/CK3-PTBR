l_spanish:
 murder_event_title:0 "Assassinato:"
 murder_ongoing.3010.a.failure:0 "[agent_in_question.GetSheHe|U] se expõe"
 murder_ongoing.3010.a.success:0 "As escapadas bêbadas [agent_in_question.GetHerHim|U] são úteis"
 murder_ongoing.3010.a:0 "Tome mais uma bebida, [agent_in_question.GetFirstNameNoTooltip]!"
 murder_ongoing.3010.b:0 "[agent_in_question.GetTitledFirstNameNoTooltip] deve se manter longe de toda bebida."
 murder_ongoing.3010.c:0 "Eu farei questão de que isso [Select_CString( agent_in_question.IsFemale, 'a', 'o' )] prejudique! Esteja preparad[Select_CString( agent_in_question.IsFemale, 'a', 'o' )]."
 murder_ongoing.3010.desc:0 "Embora isso tenha aberto algumas oportunidades para aprender mais sobre [scheme.GetTargetCharacter.GetTitledFirstName], [agent_in_question.GetSheHe] é de pouca utilidade para qualquer outra coisa..."
 murder_ongoing.3010.desc_hero:0 "Embora isso tenha aberto algumas oportunidades para aprender mais sobre [scheme.GetTargetCharacter.GetTitledFirstName], [agent_hero_of_the_moment.GetTitledFirstName] – [Select_CString( agent_hero_of_the_moment.IsFemale, 'a', 'o' )] [target.Custom2('RelationToMe', SCOPE.sC('agent_hero_of_the_moment'))] de [scheme.GetTargetCharacter.GetTitleAsNamePossessiveNoTooltip] e m[Select_CString( scheme.GetTargetCharacter.IsFemale, 'inha', 'eu' )] agente — expressou preocupações de que [Select_CString( agent_hero_of_the_moment.IsFemale, 'a', 'o' )] bêbad[Select_CString( agent_hero_of_the_moment.IsFemale, 'a', 'o' )] está colocando em risco a posição [agent_hero_of_the_moment.GetHerHim] na corte de [scheme.GetTargetCharacter.GetTitleAsNamePossessiveNoTooltip].\n\n\"É apenas questão de tempo até que seu temperamento [Select_CString( agent_hero_of_the_moment.IsFemale, 'a', 'o' )] prejudique!\""
 murder_ongoing.3010.desc_opening:0 "[agent_in_question.GetTitledFirstName] está embriagad[Select_CString( agent_in_question.IsFemale, 'a', 'o' )] diariamente."
 murder_ongoing.3010.t:0 "$murder_event_title$ Agente Bêbado"
 murder_ongoing.3301.a:0 "Eu poderia jurar que a deixei aqui!"
 murder_ongoing.3301.desc:0 "Onde está minha adaga cerimonial?! A adaga que planejei plantar no peito de [target.GetTitledFirstName]! A adaga que venho afiando há dias!\n\nReviro meus aposentos procurando-a, mas ela não está em lugar nenhum."
 murder_ongoing.3301.t:0 "$murder_event_title$ Não Muito Afiado"
 murder_ongoing.3302.a:0 "Isso me será útil."
 murder_ongoing.3302.desc:0 "De repente, lembro das ervas que adquiri quando estávamos viajando pelas [herb_location.GetTerrain.GetNameNoTooltip|l] de [herb_location.GetNameNoTooltip].\n\nElas certamente ajudarão a #EMP animar#! a situação em minha busca para libertar [target.GetTitledFirstName] de sua mortalidade."
 murder_ongoing.3302.t:0 "$murder_event_title$ Uma Pitada Disso, Uma Ramagem Daquilo..."
