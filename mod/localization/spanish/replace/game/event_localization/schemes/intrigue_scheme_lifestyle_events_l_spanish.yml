l_spanish:
 intrigue_scheme_lifestyle.1001.a.tt:0 "#F Os soldados compartilham fofocas rapidamente... Eu poderia aprender muito, contanto que meus agentes evitem problemas.#!\n"
 intrigue_scheme_lifestyle.1001.a:0 "É hora de [target.GetFirstNameNoTooltip] conseguir alguns novos recrutas."
 intrigue_scheme_lifestyle.1001.b.tt:0 "#F Eu não vou arriscar onde realmente estão as lealdades de um soldado comum.#!\n"
 intrigue_scheme_lifestyle.1001.b:0 "Não, é muito arriscado."
 intrigue_scheme_lifestyle.1001.desc:0 "Observando como os soldados se comportam uns com os outros e notando como a informação e os rumores fluem livremente, uma ideia me ocorre.\n\nSe alguns dos meus próprios soldados se infiltrassem no exército de [target.GetTitledFirstName], eles poderiam fornecer uma perspectiva diferente sobre os planos [target.GetHerHim]."
 intrigue_scheme_lifestyle.1001.t:0 "Disciplina e Lealdade"
 intrigue_scheme_lifestyle.1002.a:0 "É melhor que eles não revelem nenhum dos meus planos!"
 intrigue_scheme_lifestyle.1002.desc:0 "Acabo de receber notícias de que os soldados que enviei para se infiltrar no exército de [target.GetTitledFirstName] foram descobertos! Quem sabe que tipo de punição — ou pior, interrogatório! — eles estão sofrendo neste momento."
 intrigue_scheme_lifestyle.1002.t:0 "Disciplina e Lealdade"
 intrigue_scheme_lifestyle.3001.a.tt:0 "#F Claro que é uma empreitada arriscada...#!"
 intrigue_scheme_lifestyle.3001.a:0 "Vou estudar pessoalmente os hábitos dele."
 intrigue_scheme_lifestyle.3001.a_agent:0 "Quero alguém observando [target.GetSheHe] a todo momento!"
 intrigue_scheme_lifestyle.3001.b.tt:0 "#F [target.GetSheHe|U] pode perceber que está sendo observado!#!"
 intrigue_scheme_lifestyle.3001.b:0 "É um risco muito grande."
 intrigue_scheme_lifestyle.3001.desc:0 "Percebi que m[Select_CString( target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], [Select_CString( target.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName], mantém uma rotina bastante regular. Se esses hábitos forem observados, eles podem ser a chave para uma descoberta importante..."
 intrigue_scheme_lifestyle.3001.desc_agents:0 "Meus agentes perceberam que m[Select_CString( target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], o [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName], parece ter alguns hábitos bastante regulares.\n\nSe esses hábitos forem observados, eles podem ser a chave para uma descoberta importante..."
 intrigue_scheme_lifestyle.3001.t:0 "Hábitos Regulares"
 intrigue_scheme_lifestyle.3101.a.tt:0 "#F Informantes podem me fornecer informações inestimáveis, mas também são amadores, com todos os riscos que isso implica...#!"
 intrigue_scheme_lifestyle.3101.a:0 "Alguns serão convencidos a deixar informações escaparem para meus agentes."
 intrigue_scheme_lifestyle.3101.b.tt:0 "#F Não posso confiar em pessoas assim!#!"
 intrigue_scheme_lifestyle.3101.b:0 "O risco é muito grande!"
 intrigue_scheme_lifestyle.3101.desc:0 "O pessoal de serviço de uma corte geralmente é convenientemente ignorado, pois eles ouvem conversas, limpam e passam despercebidos pelos corredores...\n\nIsso também é verdade na corte [Select_CString( target.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] [target.GetTitledFirstName], o que apresenta uma oportunidade."
 intrigue_scheme_lifestyle.3101.t:0 "Totalmente Informado"
 intrigue_scheme_lifestyle.3102.a:0 "Eles que se mantenham calados!"
 intrigue_scheme_lifestyle.3102.desc:0 "Os funcionários que alimentam meus agentes com informações sobre [target.GetTitledFirstName] foram descobertos!"
 intrigue_scheme_lifestyle.3201.a:0 "Vamos tornar isso algo regular!"
 intrigue_scheme_lifestyle.3201.b.tt:0 "Esta opção está disponível por causa do meu Modificador $modifier_hunt_friend_of_animal$"
 intrigue_scheme_lifestyle.3201.b:0 "Tenho os mensageiros [target.GetHerHim] na palma da minha mão."
 intrigue_scheme_lifestyle.3201.c:0 "Foi uma sorte, nada mais."
 intrigue_scheme_lifestyle.3201.desc:0 "Que sorte! Meus agentes descobriram uma forma de acessar o estudo onde [target.GetTitledFirstName] guarda as cartas que escreve. Todas as mensagens [target.GetHerHim] são agora de minha leitura exclusiva!"
 intrigue_scheme_lifestyle.3201.desc_animal:0 "Que sorte! Os pombos-correio de [target.GetTitledFirstNamePossessive] têm preferência pelas sementes que podem ser encontradas em meu jardim, e eles ficam tempo suficiente para eu ler as mensagens!"
 intrigue_scheme_lifestyle.3201.elope.desc:0 "Que sorte! Meus agentes descobriram uma forma de acessar o estudo onde [target.GetLiege.Custom2('NamePossessiveCharacterIntroduction', target )] guarda as cartas que escreve. Todas as mensagens [target.GetLiege.GetHerHim] são agora de minha leitura exclusiva!"
 intrigue_scheme_lifestyle.3201.t:0 "Comunicação"
 intrigue_scheme_lifestyle.3301.a:0 "Se [target.GetSheHe] está escondendo algo, eu preciso saber!"
 intrigue_scheme_lifestyle.3301.b.tt:0 "#F Com precisão mortal!#!"
 intrigue_scheme_lifestyle.3301.b:0 "Vou manter o foco em meu objetivo."
 intrigue_scheme_lifestyle.3301.desc_child:0 "Meus agentes notaram que [Select_CString( target.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName] está muito envolvid[Select_CString( target.IsFemale, 'a', 'o' )] na vida [Select_CString( secret_to_reveal_target.IsFemale, 'da sua', 'do seu' )] [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))] [secret_to_reveal_target.GetTitledFirstName]."
 intrigue_scheme_lifestyle.3301.desc_end:0 "\n\nInvestigar mais a fundo significaria deixar de lado meus planos sombrios para [target.GetTitleTierName], mas devo admitir que minha curiosidade foi despertada!"
 intrigue_scheme_lifestyle.3301.desc_fallback:0 "Meus agentes notaram que [Select_CString( target.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName] age de forma estranha perto [Select_CString( secret_to_reveal_target.IsFemale, 'da sua', 'do seu' )] [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))] [secret_to_reveal_target.GetTitledFirstName]."
 intrigue_scheme_lifestyle.3301.desc_lover:0 "Meus agentes notaram que [Select_CString( target.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName] passa muito tempo sozinho com [Select_CString( secret_to_reveal_target.IsFemale, 'sua', 'seu' )] [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))] [secret_to_reveal_target.GetTitledFirstName]..."
 intrigue_scheme_lifestyle.3301.desc_murder:0 "Meus agentes notaram que [Select_CString( target.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName] reage estranhamente sempre que [target.GetSheHe] menciona [Select_CString( secret_to_reveal_target.IsFemale, 'sua', 'seu' )] [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))] [secret_to_reveal_target.GetTitledFirstName]..."
 intrigue_scheme_lifestyle.3301.desc_pregnancy:0 "Meus agentes notaram que [Select_CString( target.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName] parece estar muito preocupad[Select_CString( target.IsFemale, 'a', 'o' )] com a saúde [Select_CString( secret_to_reveal_target.IsFemale, 'da sua', 'do seu' )] [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))] [secret_to_reveal_target.GetTitledFirstName]."
 intrigue_scheme_lifestyle.3301.t:0 "Outro Caminho"
 intrigue_scheme_lifestyle.3302.a.tt:0 "#F Eu posso chantagear [target.GetSheHe], ou forçá-l[Select_CString( target.IsFemale, 'a', 'o' )] a fazer o que eu quiser, ou #EMP qualquer coisa#!#!"
 intrigue_scheme_lifestyle.3302.a:0 "Ah, isso é bom!"
 intrigue_scheme_lifestyle.3302.desc_child:0 "Meus agentes notam uma curiosidade após outra, e não demora muito para que a imagem se revele: [secret_to_reveal_target.GetTitledFirstName] é filh[Select_CString( secret_to_reveal_target.IsFemale, 'a', 'o' )] de [target.GetTitledFirstName] e s[Select_CString( secret_to_reveal_owner.IsFemale, 'ua', 'eu' )] [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_owner'))] [secret_to_reveal_owner.GetTitledFirstName]!"
 intrigue_scheme_lifestyle.3302.desc_fallback:0 "Meus agentes notam uma curiosidade após outra, e não demora muito para que a imagem se revele: [target.GetTitledFirstName] realmente tinha algo a esconder!"
 intrigue_scheme_lifestyle.3302.desc_lover:0 "Meus agentes notam uma curiosidade após outra, e não demora muito para que a imagem se revele: [secret_to_reveal_target.GetTitledFirstName] é [Select_CString( secret_to_reveal_target.IsFemale, 'a', 'o' )] amante de [target.GetTitledFirstName]!"
 intrigue_scheme_lifestyle.3302.desc_murder:0 "Meus agentes notam uma curiosidade após outra, e não demora muito para que a imagem se revele. [Select_CString( target.IsFemale, 'A', 'O' )] [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('target'))] [target.GetTitledFirstName] matou s[Select_CString( secret_to_reveal_target.IsFemale, 'ua', 'eu' )] [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))] [secret_to_reveal_target.GetTitledFirstName]!"
 intrigue_scheme_lifestyle.3302.desc_pregnancy:0 "Meus agentes notam uma curiosidade após outra, e não demora muito para que a imagem se revele: [secret_to_reveal_target.GetTitledFirstName] está grávida do filho de [target.GetTitledFirstName]!"
 intrigue_scheme_lifestyle.3302.t:0 "O Segredo d[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitleAsNamePossessiveNoTooltip]"
 intrigue_scheme_lifestyle.3401.a.tt:0 "#F Sou um lobo em pele de cordeiro, me aproximando da minha presa...!#!"
 intrigue_scheme_lifestyle.3401.a:0 "Por favor, [Select_CString( courtier_to_fool.IsFemale, 'minha amiga', 'meu amigo' )], conte-me sobre você!"
 intrigue_scheme_lifestyle.3401.b:0 "Esse assunto é entre [target.GetFirstNameNoTooltip] e eu."
 intrigue_scheme_lifestyle.3401.desc:0 "[Select_CString( courtier_to_fool.IsFemale, 'A', 'O' )] [target.Custom2('RelationToMe', SCOPE.sC('courtier_to_fool'))] de [target.GetTitledFirstNamePossessive] [courtier_to_fool.GetTitledFirstName] é um[Select_CString( courtier_to_fool.IsFemale, 'a', '' )] [courtier_to_fool.GetWomanMan] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('courtier_to_fool'))], e quando me encontro em companhia [courtier_to_fool.GetHerHim], a princípio, estou cautelos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. No entanto, logo percebo que [courtier_to_fool.GetSheHe] não é tão avesso à minha companhia quanto eu pensei..."
 intrigue_scheme_lifestyle.3401.t:0 "Um Caminho para Dentro"
