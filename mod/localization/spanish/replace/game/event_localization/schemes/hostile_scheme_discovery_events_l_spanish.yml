 hostile_scheme_discovery.2001.target_other:0 "m[Select_CString( target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], [target.GetTitledFirstName]!"
 hostile_scheme_discovery.2001.target_spymaster:0 "[target.GetSheHe]!\n\nEles não sabem com quem estão lidando, [ROOT.Char.Custom('FormOfAddressForLiege')]. Eles acham que podem me matar #EMP#!? Eu vou mostrar a eles. Oh, sim, vou.\""
 hostile_scheme_discovery.3001.a:0 "Maldito seja [court_owner.GetTitledFirstNameNoTooltip], e seu [spymaster.GetCouncilTitle]!"
 hostile_scheme_discovery.3001.accused:0 "\n\nAgora [agent.GetSheHe] é conhecid[Select_CString( agent.IsFemale, 'a', 'o' )] por ser desleal e não poderá mais ajudar minha causa."
 hostile_scheme_discovery.3001.imprisoned:0 "\n\nAgora [Select_CString( court_owner.IsFemale, 'a', 'o' )] [court_owner.GetTitleAsName] [Select_CString( agent.IsFemale, 'a', 'o' )] prendeu."
 hostile_scheme_discovery.3001.intro:0 "[agent.GetTitledFirstName], m[Select_CString( agent.IsFemale, 'inha', 'eu' )] agente no esquema [scheme.GetName|l] de [court_owner.GetTitledFirstNamePossessive], foi descoberto!"
 hostile_scheme_discovery.3001.t:0 "Agente Descoberto!"
 hostile_scheme_discovery.3002.a:0 "Maldição!"
 hostile_scheme_discovery.3002.desc:0 "A existência de meu plano para [scheme.GetFullActionName] foi descoberta!\n\nEmbora meu envolvimento ainda não seja conhecido, isso tornará muito mais difícil concretizar meus planos."
 hostile_scheme_discovery.3002.t:0 "Esquema Descoberto"
 hostile_scheme_discovery.3003.a:0 "Deve ter havido um mal-entendido!"
 hostile_scheme_discovery.3003.abduction:0 "para sequestrar [target.GetSheHe]!"
 hostile_scheme_discovery.3003.desc:0 "[target.Custom2('MyCharacterIntroduction', ROOT.Char)|U] descobriu que sou o mentor por trás do plano"
 hostile_scheme_discovery.3003.elope:0 "para fugir com [target.GetSheHe]!"
 hostile_scheme_discovery.3003.fallback:0 "contra [target.GetSheHe]!"
 hostile_scheme_discovery.3003.murder:0 "para matar [target.GetSheHe]!"
 hostile_scheme_discovery.3003.steal_back_artifact:0 "para roubar um artefato de [target.GetSheHe]!"
 hostile_scheme_discovery.3003.t:0 "Envolvimento Descoberto"
 hostile_scheme_discovery.4001.a:0 "Isso é tudo um grande mal-entendido!"
 hostile_scheme_discovery.4001.b:0 "Oh, eu vou mostrar o quão longe posso ir."
 hostile_scheme_discovery.4001.end:0 "\n\nAté meus próprios [ROOT.Char.Custom('GetCourtierPlural')|l] sussurram pelas minhas costas, qualquer confiança ou amor que possam ter tido por mim se despedaçando com a revelação."
 hostile_scheme_discovery.4001.opening:0 "Meu plano contra m[Select_CString( target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], [target.GetTitledFirstName], foi descoberto!"
 hostile_scheme_discovery.4001.t:0 "Esquema Descoberto!"
 hostile_scheme_discovery.4002.opening:0 "Meu esquema para ver m[Select_CString( target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] mort[Select_CString( target.IsFemale, 'a', 'o' )] foi descoberto! Agora todos sabem do meu plano de matar [target.GetTitledFirstName]."
