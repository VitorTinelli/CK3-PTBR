 hostile_scheme_discovery.2001.elope:0 "alguém está planejando fugir com"
 hostile_scheme_discovery.2001.fallback:0 "alguém está tramando contra"
 hostile_scheme_discovery.2001.intro:0 "Meu [spymaster.GetCouncilTitle] veio me trazer notícias graves. Embora ainda não saibamos quem,"
