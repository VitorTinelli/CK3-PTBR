l_spanish:
 seduce_ongoing.1001.a.tt:0 "#F Apelo ao lado brincalhão de [target.GetFirstNameNoTooltip].#!"
 seduce_ongoing.1001.a:0 "Acompanhe-me no círculo para a próxima dança, [Select_CString( target.IsFemale, 'minha', 'meu' )] [target.GetLadyLord]?"
 seduce_ongoing.1001.b.tt:0 "#F Apelo ao lado pensativo de [target.GetFirstNameNoTooltip].#!"
 seduce_ongoing.1001.b:0 "Um passeio no jardim, longe de tudo isso?"
 seduce_ongoing.1001.c.tt:0 "#F Apelo ao lado ganancioso de [target.GetFirstNameNoTooltip].#!"
 seduce_ongoing.1001.c:0 "Posso lhe oferecer mais comida?"
 seduce_ongoing.1001.close_opening:0 "Estou participando da dança não apenas porque sou [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetLadyLord|U] em [court_owner.Custom('ResidenceBuilding')], mas porque quero ver [target.GetTitledFirstName] lá."
 seduce_ongoing.1001.d.tt:0 "#F Apelo ao lado malicioso de [target.GetFirstNameNoTooltip].#!"
 seduce_ongoing.1001.d:0 "Você viu como essas pessoas \"dançam\"?"
 seduce_ongoing.1001.desc:0 "\n\n[target.GetSheHe|U] está deslumbrante, e quando finalmente temos um momento a sós, faço minha sugestão."
 seduce_ongoing.1001.distant_opening:0 "Cheguei à corte em [court_of_residence.GetNameNoTier] a tempo para a dança em [court_owner.Custom('ResidenceBuilding')]. Garanti um convite, pois preciso ver [target.GetTitledFirstName]."
 seduce_ongoing.1001.t:0 "A Dança"
 seduce_ongoing.1003.a:0 "Tive uma noite tão agradável!"
 seduce_ongoing.1003.dance:0 "\n\nEnquanto girávamos na pista, certamente chamamos a atenção, e eu ria como [Select_CString( ROOT.Char.IsFemale, 'uma pequena', 'um pequeno' )] [ROOT.Char.Custom('GirlBoy')]!"
 seduce_ongoing.1003.fallback:0 "\n\nAcabamos nos divertindo tanto que dançamos quase durante toda a celebração!"
 seduce_ongoing.1003.food:0 "\n\n[owner.GetSheHe|U] fez alguns criados trazerem mais pratos, e ficamos comendo juntos a maior parte da noite. Estava delicioso!"
 seduce_ongoing.1003.mockery:0 "\n\nSentamos fazendo piadas sobre os outros convidados, compartilhando risadas e brincadeiras. Fiquei impressionad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com a sagacidade incisiva de [owner.GetFirstNamePossessiveNoTooltip]!"
 seduce_ongoing.1003.opening:0 "Na dança em [court_owner.Custom('ResidenceBuilding')], [owner.GetTitledFirstName] veio até mim, oferecendo sua companhia."
 seduce_ongoing.1003.walk:0 "\n\nCaminhamos pelos jardins, conversando sobre diversos assuntos até percebermos que ambos perdemos a noção do tempo!"
 seduce_ongoing.1004.a:0 "Isso não correu bem."
 seduce_ongoing.1004.dance:0 "[owner.GetSheHe|U] não percebeu que eu não estava interessad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] em dançar, e depois de algumas rodadas relutantes, tive que pedir para [owner.GetSheHe] me soltar."
 seduce_ongoing.1004.fallback:0 "Continuei sugerindo maneiras de passarmos tempo na celebração, mas [target.GetTitledFirstName] parecia completamente desinteressad[Select_CString( target.IsFemale, 'a', 'o' )]. Será que fiz algo errado?"
 seduce_ongoing.1004.food:0 "Embora não me opusesse à presença [owner.GetHerHim], durante toda a noite [owner.GetSheHe] mandou criados trazerem mais e mais pratos de comida. Eu logo fiquei satisfeit[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] e inventei desculpas para voltar a dançar."
 seduce_ongoing.1004.mockery:0 "[target.GetSheHe|U] sentou ao meu lado, fazendo comentários sobre os outros convidados.\n\nNão apenas foi cruel sem necessidade, mas também grosseiro e completamente sem arte."
 seduce_ongoing.1004.walk:0 "Embora o passeio no jardim tenha sido agradável, talvez tenha sido muito frio, ou talvez eu tenha falado demais, pois [target.GetSheHe] logo inventou desculpas e voltou para a dança, nem esperando para ver se eu iria junto.\n\nQuando eu voltei, [target.GetSheHe] estava se divertindo com os outros dançarinos."
 seduce_ongoing.1005.a:0 "Que noite maravilhosa tivemos!"
 seduce_ongoing.1005.dance:0 "[target.GetTitledFirstName] e eu rodopiamos pela pista juntos, chamando a atenção enquanto [target.GetSheHe] ria à vontade."
 seduce_ongoing.1005.fallback:0 "[target.GetTitledFirstName] e eu nos divertimos tanto que dançamos quase durante toda a celebração!"
 seduce_ongoing.1005.food:0 "Fiz os criados trazerem mais comida para [target.GetTitledFirstName] e eu, e ao longo da noite, nos deliciamos com todos os pratos deliciosos que os cozinheiros de [court_of_residence.GetNameNoTier] têm a oferecer. Ess[Select_CString( target.IsFemale, 'a', 'e' )] [target.GetWomanMan] certamente aprecia as coisas mais refinadas da vida."
 seduce_ongoing.1005.mockery:0 "Sentamos juntos, fazendo piada atrás de piada sobre os outros convidados. Eu não esperava que [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName] fosse tão habilidos[Select_CString( target.IsFemale, 'a', 'o' )] na arte da zombaria!"
 seduce_ongoing.1005.walk:0 "[target.GetTitledFirstName] e eu caminhamos pelos jardins, conversando sobre diversos assuntos. Eventualmente, percebemos que ambos perdemos a noção do tempo, e quando voltamos a dança, a celebração já estava chegando ao fim."
 seduce_ongoing.1006.a:0 "Isso não correu bem."
 seduce_ongoing.1006.dance:0 "Pensei que estava bem quando [target.GetSheHe] concordou em dançar, mas mesmo assim, embora eu tenha me saído bem, [target.GetTitledFirstName] logo inventou desculpas e me deixou sozinh[Select_CString( target.IsFemale, 'a', 'o' )] entre os outros dançarinos."
 seduce_ongoing.1006.fallback:0 "Continuei sugerindo maneiras de passarmos tempo na celebração, mas [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName] pareceu completamente desinteressad[Select_CString( target.IsFemale, 'a', 'o' )]. Será que fiz algo errado?"
 seduce_ongoing.1006.food:0 "Talvez tenha havido algo errado com a comida que fiz os criados trazerem para [target.GetTitledFirstName]? Mesmo depois que [target.GetSheHe] inventou desculpas, a comida continuou vindo da cozinha, acumulando-se enquanto eu a comia sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 seduce_ongoing.1006.mockery:0 "Não importa o quanto eu tentei, [target.GetTitledFirstName] não riu das minhas piadas. No final, [target.GetSheHe] me acusou de ser cruel sem motivo e me deixou sentad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 seduce_ongoing.1006.walk:0 "Pensei que o passeio pelo jardim seria agradável, mas talvez tenha sido muito frio, ou talvez eu tenha falado demais, pois [target.GetSheHe] logo inventou desculpas e voltou para a dança, nem esperando para ver se eu iria acompanhá-l[Select_CString( target.IsFemale, 'a', 'o' )].\n\nQuando voltei, [target.GetSheHe] já estava se divertindo com os outros dançarinos."
 seduce_ongoing.1101.desc:0 "Um presente certamente chamará a atenção d[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName], e certamente qualquer pessoa apreciaria algo fino e claramente caro."
 seduce_ongoing.1101.t:0 "Algo Caro"
 seduce_ongoing.1102.desc:0 "Todo mundo aprecia um presente, mas talvez eu possa pensar em algo realmente único que cause uma verdadeira impressão [Select_CString( target.IsFemale, 'na', 'no' )] [target.GetTitledFirstName]!"
 seduce_ongoing.1102.t:0 "Um Presente de Trabalho"
 seduce_ongoing.1103.desc:0 "Nem todo presente precisa ser uma grande demonstração de riqueza. Coisas menores podem causar uma impressão muito maior, desde que sejam bem escolhidas. Fico curios[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] para saber o que [target.GetTitledFirstName] apreciaria."
 seduce_ongoing.1103.t:0 "Pequeno, mas Significativo"
 seduce_ongoing.1104.desc:0 "Qualquer um pode comprar um símbolo de afeto, grande ou pequeno. Se quiser impressionar [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName], devo enviar algo realmente especial a [target.GetSheHe]."
 seduce_ongoing.1104.t:0 "Algo Incomum"
 seduce_ongoing.1201.a:0 "[owner.GetSheHe|U] merece meu sincero agradecimento!"
 seduce_ongoing.1201.desc:0 "Recebi um presente, uma bela tapeçaria com cenas da história de minha dinastia, emoldurada por brasões habilmente tecidos!"
 seduce_ongoing.1201.t:0 "Um Presente Bem Escolhido"
 seduce_ongoing.1202.courtier:0 "Já peguei [courtier.GetTitledFirstName] de olho nele com inveja."
 seduce_ongoing.1202.no_courtier:0 "ele já tem vários admiradores na corte."
 seduce_ongoing.1202.opening:0 "Recebi um cavalo, bem criado e alimentado! A magnífica criatura parece perfeita para cavalgar, e"
 seduce_ongoing.1203.a:0 "Me sinto esplêndid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]!"
 seduce_ongoing.1203.desc:0 "Um alfaiate chegou à corte especialmente para fornecer-me qualquer roupa nova que eu deseje. Agora que seu trabalho está feito, devo dizer que [ROOT.Char.GetSheHe] é muito habilidos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] também!"
 seduce_ongoing.1204.a:0 "Que maravilhas esse livro contém?"
 seduce_ongoing.1204.desc:0 "Mal posso acreditar quando abro o pacote de couro. O tomo dentro dele deve ter um século ou mais, cuidadosamente escrito, decorado e dourado por mãos antigas."
 seduce_ongoing.1205.a:0 "Sua habilidade artesanal certamente impressionará."
 seduce_ongoing.1205.desc:0 "Recebi um lindo bordado grande, replicando o brasão de minha casa com cores vibrantes! Ele será perfeito na lareira de meus aposentos."
 seduce_ongoing.1206.a:0 "Um sopro poético de ar fresco!"
 seduce_ongoing.1206.desc:0 "Um poeta veio diante de mim para recitar uma composição sobre os prazeres da vida, dedicada ao \"[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitledFirstName]!\""
 seduce_ongoing.1207.a:0 "Que coisa incomum!"
 seduce_ongoing.1207.desc:0 "Recebi uma escultura em madeira de um castelo em miniatura! Todos os convidados que passam admiram os detalhes e a habilidade expostos."
 seduce_ongoing.1208.a:0 "Será que [owner.GetSheHe] pensa que eu jamais esqueceria?"
 seduce_ongoing.1208.desc:0 "[owner.GetTitledFirstName] me enviou [SCOPE.Custom('SeductionObjectIndefinite')], uma lembrança de nosso primeiro encontro."
 seduce_ongoing.1209.a:0 "Talvez alguém possa me ajudar a abri-lo um dia?"
 seduce_ongoing.1209.desc:0 "Recebi um pequeno medalhão, uma bela peça de prataria. Embora eu me pergunte o que há dentro, é mais importante que os outros fofocarão sobre o que ele pode conter."
 seduce_ongoing.1210.a:0 "Inconvencional, mas não desagradável."
 seduce_ongoing.1210.desc:0 "É incomum, isso é verdade, mas há algo atraente no animal de pelúcia de raposa que foi colocado diante de mim. Talvez seja o rosnado congelado e feroz em seus lábios?"
 seduce_ongoing.1211.a:0 "Eu não sabia que esse tipo de beleza me tocaria tanto."
 seduce_ongoing.1211.desc:0 "O arranjo de flores é deslumbrante, e desde que os camponeses terminaram de plantá-lo no jardim, os passeios ali se tornaram muito mais populares."
 seduce_ongoing.1212.a:0 "Com certeza, causará algum tipo de impressão."
 seduce_ongoing.1212.desc:0 "[owner.GetTitledFirstName] me enviou um presente, um lenço com o brasão dos [owner.GetDynasty.GetBaseName].\n\nCertamente será interessante ver qual reação os outros terão quando eu exibir o emblema [owner.GetTitlePossessive] tão flagrantemente."
 seduce_ongoing.1301.a:0 "Venda isso. Pode ser usado como uma manta, se nada mais servir."
 seduce_ongoing.1301.desc:0 "Recebi uma tapeçaria, com cenas da história de minha dinastia, mas as figuras parecem estranhas, e ninguém consegue interpretar exatamente o que está acontecendo em nenhuma cena."
 seduce_ongoing.1301.t:0 "Um Presente Estranho"
 seduce_ongoing.1302.a:0 "O que eu vou fazer com esse jumento? Venda-o."
 seduce_ongoing.1302.desc:0 "Recebi um cavalo, o que me faz pensar no que os outros pensam de mim. Será que eles esperam que eu vá cavalgar nesse velho magrelo?"
 seduce_ongoing.1303.a:0 "Pelo menos posso vender esses trapos feios que [ROOT.Char.GetSheHe] tentou me vestir."
 seduce_ongoing.1303.desc:0 "Um alfaiate chegou para fornecer-me qualquer roupa nova que eu deseje. [ROOT.Char.GetSheHe|U] logo ficou aterrorizad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com a ofensa causada quando perguntei exatamente o que havia de errado com minhas roupas antigas."
 seduce_ongoing.1304.a:0 "Que utilidade terei com esse livro? Venda-o."
 seduce_ongoing.1304.desc:0 "Estou um pouco confus[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ao abrir o pacote de couro e encontrar um tomo empoeirado e antigo. Folheando suas páginas, encontro algumas ilustrações bonitas, mas não consigo ler o texto."
 seduce_ongoing.1305.a:0 "Seria bom se fosse o brasão certo..."
 seduce_ongoing.1305.desc:0 "Recebi um bordado grande, supostamente reproduzindo o brasão de minha casa. No entanto, não tenho certeza do que o artista usou como referência, pois certamente não reconheço o brasão. Talvez outra pessoa goste mais dele..."
 seduce_ongoing.1306.desc:0 "Um poeta veio diante de mim para recitar uma longa composição sobre os prazeres da vida, dedicada ao \"[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitledFirstName].\" Os prazeres da vida não incluem esse poema."
 seduce_ongoing.1307.a:0 "Quanto tempo ela aguentará o fogo?"
 seduce_ongoing.1307.desc:0 "Recebi uma escultura em madeira de... algum tipo de construção? Ah, é para ser um castelo! Supostamente."
 seduce_ongoing.1308.desc:0 "[owner.GetTitledFirstName] me enviou [SCOPE.Custom('SeductionObjectIndefinite')], uma lembrança de nosso primeiro encontro. [owner.GetSheHe|U] deve ter memórias muito mais carinhosas disso do que eu."
 seduce_ongoing.1309.a:0 "Por que alguém acharia que eu gostaria disso?"
 seduce_ongoing.1309.desc:0 "Recebi um pequeno medalhão e, a princípio, não percebi que o pequeno pedaço não polido era realmente prata. Ele também não abre, então vejo pouca utilidade nele."
 seduce_ongoing.1310.a:0 "Quem gostaria de um presente desse tipo?!"
 seduce_ongoing.1310.desc:0 "\"Tire essa coisa de perto de mim!\" A raposa de pelúcia tem um rosnado repugnante nos lábios, mostrando dentes ferozes para mim."
 seduce_ongoing.1311.a:0 "Eu não quero essas coisas em lugar algum próximo dos jardins."
 seduce_ongoing.1311.desc:0 "\"Então, a senhora não quer que plantemos, [ROOT.Char.Custom('FormOfAddressForLiege')]?\" Os camponeses estão diante de mim, com terra derramando de caixas em suas cargas. O arranjo de flores que eles carregam parece gasto e surrado."
 seduce_ongoing.1312.desc:0 "[owner.GetTitledFirstName] me enviou um presente, um lenço com o brasão dos [owner.GetDynasty.GetBaseName].\n\nSe [owner.GetSheHe] acha que eu irei exibir seu emblema em público, [owner.GetSheHe] está muito enganado!"
 seduce_ongoing.1601.a.tt:0 "Acho que [target.GetSheHe] quer ouvir sobre religião."
 seduce_ongoing.1601.a:0 "Algo piedoso, como [SCOPE.Custom('RandomReligiousTextName')]."
 seduce_ongoing.1601.b.tt:0 "Acho que [target.GetSheHe] quer ouvir algo divertido."
 seduce_ongoing.1601.b:0 "Vamos nos entreter. [SCOPE.Custom('RandomEntertainmentTextName')|U]!"
 seduce_ongoing.1601.c.tt:0 "Acho que [target.GetSheHe] quer ouvir algo informativo."
 seduce_ongoing.1601.c:0 "[SCOPE.Custom('RandomInformativeTextName')|U] nos daria a chance de aprender algo."
 seduce_ongoing.1601.desc:0 "As celebrações chegaram ao fim e o entretenimento da noite parece ter acabado, quando [target.GetTitledFirstName] sugeriu uma leitura.\n\nLogo, um escriba chega, perguntando o que os convidados gostariam de ouvir, e vejo minha chance de impressionar [target.GetFirstName]."
 seduce_ongoing.1601.t:0 "Uma Leitura em [location.GetNameNoTooltip]"
 seduce_ongoing.1601.t_no_location:0 "Uma Leitura"
 seduce_ongoing.1603.a:0 "Eu também adoro esse!"
 seduce_ongoing.1603.desc:0 "Parecia que seria uma noite tediosa depois que o entretenimento do banquete terminou, mas [owner.GetTitledFirstName] salvou o dia sugerindo uma leitura de [SCOPE.Custom('BookInQuestion')]!"
 seduce_ongoing.1604.a:0 "Foi ótimo, não foi?"
 seduce_ongoing.1604.desc:0 "Enquanto o escriba lê para nós, [target.GetFirstName] parece completamente absorto.\n\n[target.GetSheHe|U] se aproxima de mim depois. \"Boa escolha, [ROOT.Char.GetFirstName],\" [target.GetSheHe] diz e [target.Custom('quirk_pos_present')]."
 seduce_ongoing.1605.a:0 "Uma escolha muito melhor!"
 seduce_ongoing.1605.desc_1:0 "Um banquete tedioso ficou ainda pior quando [owner.GetTitledFirstName] sugeriu uma leitura de [SCOPE.Custom('BookInQuestion')]."
 seduce_ongoing.1605.desc_2:0 "Felizmente, [other_guest.GetTitledFirstName] logo sugeriu ler [SCOPE.Custom('GoodBookSuggestion')] em seu lugar!"
 seduce_ongoing.1605.desc_no_other_guest:0 "Felizmente, um atendente sugeriu rapidamente ler [SCOPE.Custom('GoodBookSuggestion')] em seu lugar!"
 seduce_ongoing.1606.a:0 "Por que eu não pensei nisso?"
 seduce_ongoing.1606.desc_1:0 "Enquanto o escriba enrola e continua, percebo que a atenção de [target.GetFirstNamePossessive] está diminuindo."
 seduce_ongoing.1606.desc_2:0 "\n\nEnquanto penso em como salvar a situação, [other_guest.Custom2('MyCharacterIntroduction', ROOT.Char)] interrompe de repente e pergunta: \"Posso humildemente sugerir que leiamos [SCOPE.Custom('GoodBookSuggestion')] em vez disso?\" e "
 seduce_ongoing.1606.desc_3:0 "[target.GetFirstName] imediatamente se anima com um interesse renovado."
 seduce_ongoing.1606.desc_no_other_guest:0 "Um atendente interrompe de repente. \"Posso humildemente sugerir que leiamos [SCOPE.Custom('GoodBookSuggestion')] em vez disso?\""
 seduce_ongoing.1701.a.tt:0 "#F Apela para o lado ativo ou brincalhão de [target.GetFirstNamePossessive].#!"
 seduce_ongoing.1701.a:0 "Que tal mostrarmos a esses novatos uma justa simulada?"
 seduce_ongoing.1701.b.tt:0 "#F Apela para o lado pensativo de [target.GetFirstNamePossessive].#!"
 seduce_ongoing.1701.b:0 "Vamos dar uma volta nas ameias para discutir estratégias."
 seduce_ongoing.1701.c.tt:0 "#F Apela para o lado econômico de [target.GetFirstNamePossessive].#!"
 seduce_ongoing.1701.c:0 "Quero ouvir tudo sobre seus planos para a temporada de impostos."
 seduce_ongoing.1701.d.tt:0 "#F Apela para o lado malicioso de [target.GetFirstNamePossessive].#!"
 seduce_ongoing.1701.d:0 "Um desses '[target.Custom('MountedWarriorTermPlural')]' poderia ser feito de bobo..."
 seduce_ongoing.1701.desc:0 "Certifico-me de passar por [court_of_residence.GetNameNoTier] no dia de uma prática de justa. Os oficiais de [target.GetTitledFirstNamePossessive] estão circulando, instruindo jovens [target.Custom('MountedWarriorTermPlural')], e encontro [target.GetFirstName] entre eles.\n\nSeja qual for a intenção que eu tivesse, fica claro que a atenção [target.GetHerHim] está focada em suas obrigações como [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetLadyLord|U] desses soldados."
 seduce_ongoing.1701.t:0 "O Encontro"
 seduce_ongoing.1703.a:0 "Devo agradecer a [owner.GetFirstNameNoTooltip] por sua visita."
 seduce_ongoing.1703.duel:0 "\n\n[owner.GetSheHe|U] me desafiou para uma justa simulada, e fizemos um verdadeiro espetáculo para os jovens guerreiros. A justa rapidamente se tornou um esforço intenso, mas no final do dia, compartilhamos um abraço solidário, e nos sentimos melhores por nossos esforços."
 seduce_ongoing.1703.fallback:0 "\n\nEmbora observar os jovens guerreiros seja normalmente tedioso, [owner.GetFirstName] fez todo o dia passar em um instante."
 seduce_ongoing.1703.opening:0 "Para minha surpresa, [owner.GetTitledFirstName] veio à prática de justa para jovens [target.Custom('MountedWarriorTermPlural')] em [court_of_residence.GetNameNoTier]."
 seduce_ongoing.1703.strategy:0 "\n\nCaminhamos pelas ameias, discutindo estratégias detalhadamente enquanto observávamos os jovens guerreiros no pátio abaixo. [owner.GetFirstName] teve algumas ideias perspicazes, e agradeci [owner.GetSheHe] por me fazer repensar alguns dos pressupostos sobre meus novos soldados. Nossos muitos desvios na discussão também foram muito envolventes..."
 seduce_ongoing.1703.tax_season:0 "\n\nEmbora a prática fosse necessária, tive um tempo muito melhor sentado lá dentro, discutindo meus planos para a próxima temporada de impostos com [owner.GetFirstName]. Afinal, para que serve um exército sem meios de sustentá-lo, como [owner.GetSheHe] apontou."
 seduce_ongoing.1703.trap:0 "\n\nObservar os jovens guerreiros era necessário, mas desinteressante, então fiquei grato quando [owner.GetFirstName] sugeriu uma pequena distração divertida. Um pajem derramou sangue de porco no chão atrás da bacia de água, e o cheiro assustou alguns dos cavalos menos treinados. Vários jovens caíram, enquanto os demais mal conseguiam se segurar!"
 seduce_ongoing.1704.a:0 "O que aconteceu com [owner.GetTitledFirstNameNoTooltip]?"
 seduce_ongoing.1704.duel:0 "\n\n[owner.GetSheHe|U] insistiu em uma justa simulada na frente dos jovens guerreiros, mas eu não estava prestes a me envergonhar assim. [owner.GetFirstName] parecia desanimado, mas eu tinha coisas melhores para fazer do que consolá-lo."
 seduce_ongoing.1704.fallback:0 "\n\n[owner.GetFirstName] queria passar a visita conversando, como se [owner.GetSheHe] não percebesse que hoje é um dia muito ocupado para mim."
 seduce_ongoing.1704.strategy:0 "\n\n[owner.GetSheHe|U] me convidou para uma caminhada nas ameias, para discutir ideias para estratégias, mas me vi tendo que refutar uma má sugestão após outra. Talvez [owner.GetFirstName] devesse se ater a assuntos que [owner.GetSheHe] conhece melhor..."
 seduce_ongoing.1704.tax_season:0 "\n\nApesar de minha ocupação óbvia com os jovens guerreiros, [owner.GetSheHe] insistiu em discutir meus planos para a próxima temporada de impostos. Eventualmente, tive que deixar [owner.GetSheHe] para cuidar de assuntos realmente importantes."
 seduce_ongoing.1704.trap:0 "\n\nPara minha surpresa, [owner.GetSheHe] sugeriu que puséssemos em prática um elaborado plano para causar o caos entre os jovens [target.Custom('MountedWarriorTermPlural')]. Será que [owner.GetSheHe] não percebe que essa é a última coisa que eu gostaria?"
 seduce_ongoing.1705.a:0 "[target.GetSheHe|U] certamente lembrará deste dia."
 seduce_ongoing.1705.duel:0 "A justa simulada acabou sendo um grande sucesso com os jovens [target.Custom('MountedWarriorTermPlural')]!\n\n[target.GetTitledFirstName] também pareceu se divertir [target.GetHerselfHimself], e após nossa \"batalha\" intensa, compartilhamos um abraço de apoio, nos sentindo melhor por nossos esforços."
 seduce_ongoing.1705.fallback:0 "Ao final da minha visita, [target.GetTitledFirstName] parecia satisfeito. \"Normalmente, assistir aos novatos é entediante, mas hoje o tempo passou voando!\""
 seduce_ongoing.1705.strategy:0 "Caminhando pelas ameias, [target.GetTitledFirstName] e eu compartilhamos muitos pensamentos sobre como melhor empregar os jovens guerreiros, como os que estavam no pátio abaixo.\n\nAo final do dia, pude perceber que [target.GetSheHe] estava tão satisfeito com nossas discussões quanto eu, mesmo com tantos desvios na conversa — ou talvez por causa deles."
 seduce_ongoing.1705.tax_season:0 "[target.GetFirstName] e eu passamos a maior parte do dia discutindo nossos planos para a próxima temporada de impostos. Afinal, de que adianta ter um exército se você não pode alimentá-lo? [target.GetSheHe|U] riu muito disso.\n\nHouve ainda mais risos, já que ambos nos envolvemos em nossas diversas discussões."
 seduce_ongoing.1705.trap:0 "Depois de um curto período, sugeri uma pequena distração enquanto assistíamos aos jovens guerreiros. Um pajem derramou um pouco de sangue de porco perto dos bebedouros, e o cheiro assustou alguns dos cavalos menos treinados. Vários jovens [target.Custom('MountedWarriorTermPlural')] caíram, e outros mal conseguiam se segurar.\n\n[target.GetFirstName] riu alto da cena que eu criei."
 seduce_ongoing.1706.a:0 "Espero que [target.GetFirstNameNoTooltip] esqueça rapidamente deste dia."
 seduce_ongoing.1706.duel:0 "[target.GetTitledFirstName] simplesmente riu da minha sugestão de uma justa simulada. \"Não há necessidade de ninguém se envergonhar assim na frente desses jovens [target.Custom('MountedWarriorTermPlural')]!\"\n\nPassei o restante do dia tentando entender se [target.GetSheHe] se referia a [target.GetSheHe] ou a mim."
 seduce_ongoing.1706.fallback:0 "Tentei conversar com [target.GetTitledFirstName] o dia todo, mas sempre havia algo relacionado ao treinamento que demandava a atenção [target.GetHerHim]. No final, eu nunca consegui capturar sua atenção por mais de um momento, e me senti mais um estorvo do que qualquer outra coisa."
 seduce_ongoing.1706.strategy:0 "[target.GetTitledFirstName] e eu caminhamos pelas ameias, enquanto eu tentava oferecer conselhos estratégicos. No entanto, [target.GetSheHe|U] não parecia disposto a ouvir. Tudo o que eu sugeria tinha muitas falhas, segundo [target.GetFirstName], e era óbvio que seu foco estava mais no pátio abaixo do que em mim."
 seduce_ongoing.1706.tax_season:0 "Tentei discutir sobre a próxima temporada de impostos e como garantir que [target.GetFirstName] tivesse meios para alimentar seu exército. Infelizmente, [target.GetFirstNamePossessive] mente estava em outro lugar, e [target.GetSheHe] logo me deixou para se concentrar nos jovens guerreiros."
 seduce_ongoing.1706.trap:0 "Quando sugeri que pregaríamos uma peça nos [target.Custom('MountedWarriorTermPlural')] em treinamento, [target.GetFirstName] apenas me encarou em choque. \"Sangue de porco e cavalos descontrolados? Você está #EMP louc[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]#!, [ROOT.Char.GetWomanMan]?\""
 seduce_ongoing.1801.beautiful_female:0 "a sua Beleza incomparável e deslumbrante."
 seduce_ongoing.1801.beautiful_male:0 "a sua Aparência notavelmente bonita."
 seduce_ongoing.1801.bold:0 "o seu Espírito corajoso e destemido."
 seduce_ongoing.1801.close.desc:0 "Da próxima vez que nos encontrarmos, elogiarei [target.GetFirstNamePossessive]..."
 seduce_ongoing.1801.compassionate:0 "o seu Coração caloroso e gentil."
 seduce_ongoing.1801.compliment.tt:0 "#F O quanto o elogio é bem recebido [Select_CString( target.IsFemale, 'pela', 'pelo' )] [target.GetTitledFirstName] depende de como ele combina com [target.GetSheHe]#!"
 seduce_ongoing.1801.distant.desc:0 "Escreverei uma carta para [target.GetFirstName], elogiando..."
 seduce_ongoing.1801.dominant:0 "a sua Presença assertiva e poderosa."
 seduce_ongoing.1801.energetic:0 "a sua Espontaneidade e vigor."
 seduce_ongoing.1801.extroverted:0 "o seu Carisma irresistível."
 seduce_ongoing.1801.forgiving:0 "a sua Natureza magnânima."
 seduce_ongoing.1801.greed:0 "a sua Ambição e desejo de viver intensamente."
 seduce_ongoing.1801.honorable:0 "a sua Natureza nobre e leal."
 seduce_ongoing.1801.rational:0 "a sua Mente racional e brilhante."
 seduce_ongoing.1801.start.desc:0 "Como estudios[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] das artes diplomáticas, sei muito bem o poder de um elogio eloquente. Mostrar admiração pela melhor qualidade de um[Select_CString( target.IsFemale, 'a', '' )] [target.GetWomanMan] é um caminho certo para conquistar seu coração.\n\n"
 seduce_ongoing.1801.strong:0 "a sua Forma física impressionante."
 seduce_ongoing.1801.t:0 "[ROOT.Char.Custom('MistressMaster')|U] das Palavras"
 seduce_ongoing.1801.zealous:0 "o seu Piedade e fé inabalável."
 seduce_ongoing.1802.a.bad:0 "Um pouco ignorante, mas principalmente doce."
 seduce_ongoing.1802.a.good:0 "[owner.GetTitledFirstNameNoTooltip]... Você me lisonjeia!"
 seduce_ongoing.1802.b.bad:0 "Que constrangedor..."
 seduce_ongoing.1802.b.good:0 "Você deveria se esforçar mais na próxima vez."
 seduce_ongoing.1802.bad.desc:0 "\n\nEu suspeito que [owner.GetSheHe] tem boas intenções, mas isso parece sarcasmo disfarçado para mim."
 seduce_ongoing.1802.beautiful_female.desc:0 "\"beleza inspiradora.\""
 seduce_ongoing.1802.beautiful_male.desc:0 "\"aparência marcante.\""
 seduce_ongoing.1802.bold.desc:0 "\"coragem vigorosa.\""
 seduce_ongoing.1802.c:0 "Não tenho interesse nessas atenções!"
 seduce_ongoing.1802.close.desc:0 "Enquanto caminho pelos jardins em silenciosa contemplação, minha mente vagando por algum lugar distante, quase esbarro [Select_CString( owner.IsFemale, 'na', 'no' )] [owner.GetTitledFirstName]. Antes que eu possa me recompor, [owner.GetSheHe] pede meu perdão, dizendo que [owner.GetSheHe] nunca teve a intenção de incomodar um[Select_CString( target.IsFemale, 'a', '' )] [target.Custom('LadyLordWomanMan')] de tão"
 seduce_ongoing.1802.compassionate.desc:0 "\"gentil compaixão.\""
 seduce_ongoing.1802.distant.desc:0 "Recebi uma carta intrigante de [owner.GetTitledFirstName]. Entre as perguntas e anedotas habituais, estão elogios sutis, mas inconfundíveis, sobre meu"
 seduce_ongoing.1802.dominant.desc:0 "\"energia assertiva.\""
 seduce_ongoing.1802.energetic.desc:0 "\"energia vital.\""
 seduce_ongoing.1802.extroverted.desc:0 "\"encantos irresistíveis.\""
 seduce_ongoing.1802.forgiving.desc:0 "\"misericórdia magnânima.\""
 seduce_ongoing.1802.good.desc:0 "\n\nAs palavras [owner.GetHerHim] revelam um nível de atenção afetuosa que me pega de surpresa."
 seduce_ongoing.1802.greed.desc:0 "\"aspirações grandiosas.\""
 seduce_ongoing.1802.honorable.desc:0 "\"moral nobre.\""
 seduce_ongoing.1802.neutral.desc:0 "\n\nAs palavras [owner.GetHerHim] não fazem muito sentido, mas o gesto é gentil, suponho."
 seduce_ongoing.1802.rational.desc:0 "\"clareza singular de pensamento.\""
 seduce_ongoing.1802.strong.desc:0 "\"força física impressionante.\""
 seduce_ongoing.1802.t:0 "Palavras Encantadoras"
 seduce_ongoing.1802.zealous.desc:0 "\"fé admirável.\""
 seduce_ongoing.2001.a:0 "[target.GetSheHe|U] certamente achará divertido!"
 seduce_ongoing.2001.b:0 "[target.GetFirstNameNoTooltip] adoraria zombar de superstições como esta."
 seduce_ongoing.2001.c.tt:0 "#F Preciso de uma oportunidade melhor para mostrar meu afeto do que isso!#!"
 seduce_ongoing.2001.c:0 "Não tenho tempo para poções do amor sem sentido."
 seduce_ongoing.2001.desc:0 "Um dos meus servos adquiriu uma poção do amor de um[Select_CString( dummy_gender.IsFemale, 'a', '' )] [dummy_gender.GetWomanMan] velho na feira, mas afirmou que não teve sorte com ela.\n\nEnquanto seguro o pequeno frasco em minhas mãos, não consigo deixar de pensar em [target.GetTitledFirstName] e se talvez minha sorte seria diferente."
 seduce_ongoing.2001.t:0 "A Poção do Amor"
 seduce_ongoing.2002.a:0 "Que divertimento!"
 seduce_ongoing.2002.desc:0 "[owner.GetTitledFirstName] me presenteou com uma \"poção do amor\" que [owner.GetSheHe] conseguiu na feira. Nós colocamos um pouco em nosso vinho e tivemos uma noite divertida fingindo que ela estava nos afetando, e no final a linha entre o que fingíamos e o que era real começou a ficar um pouco confusa."
 seduce_ongoing.2003.a:0 "Tempo bem aproveitado juntos."
 seduce_ongoing.2003.desc:0 "[target.GetFirstName] e eu tomamos a \"poção do amor\" junto com um pouco de vinho e passamos a noite fingindo que ela estava nos afetando.\n\nFoi tudo um pouco de diversão inocente, mas o indício de afeto era claro no sorriso [target.GetHerHim] quando [target.GetSheHe] se despediu de mim."
 seduce_ongoing.2004.a:0 "O que deu n[owner.GetSheHe]?"
 seduce_ongoing.2004.desc:0 "Por um pouco de diversão, [owner.GetTitledFirstName] me desafiou a beber uma \"poção do amor\" que [owner.GetSheHe] havia conseguido na feira. Quando eu recusei beber algo cujo conteúdo eu não conhecia, [owner.GetSheHe] pareceu ficar um pouco chateado! Logo pedi a [owner.GetSheHe] para me desculpar para que eu pudesse me retirar mais cedo."
 seduce_ongoing.2005.a:0 "Isso foi lamentável."
 seduce_ongoing.2005.desc:0 "[target.GetFirstName] recusou a \"poção do amor\" e então se perguntou exatamente o que eu estava tentando fazer. Eu me empolguei um pouco, tentando explicar que tudo era apenas por diversão, e então [target.GetSheHe] me pediu para partir."
 seduce_ongoing.2006.a.tt:0 "#F Maldita seja sua estupidez #EMP *bluuurgh#! [owner.GetFirstNameNoTooltip]!#!"
 seduce_ongoing.2006.a:0 "Não estou me sentindo muito bem..."
 seduce_ongoing.2006.desc:0 "[owner.GetTitledFirstName] me trouxe uma poção do amor que [owner.GetSheHe] havia adquirido na feira. Eu achei divertido e cedi à insistência [owner.GetHerHim] para experimentarmos um pouco.\n\nNo entanto, [owner.GetFirstName] recusou tomar um gole, quando eu comecei a passar mal!"
 seduce_ongoing.2006.t:0 "A \"Poção do Amor\""
 seduce_ongoing.2007.a:0 "Onde está o servo que me deu isso?"
 seduce_ongoing.2007.desc:0 "Oh não! [target.GetTitledFirstName] concordou em experimentar a poção do amor, mas o que era para ser apenas um pouco de diversão terminou com [target.GetSheHe] vomitando e de cama!"
 seduce_ongoing.2008.a:0 "Me diverti tanto com [owner.GetFirstNameNoTooltip]!"
 seduce_ongoing.2008.desc:0 "[owner.GetTitledFirstName] veio até mim com uma \"poção do amor\" que um servo [owner.GetHerHim] havia adquirido na feira. Nós não bebemos o líquido desconhecido, mas sim passamos uma noite adorável com um pouco de vinho, zombando das simples superstições que existem por aí.\n\nSe você não consegue me dizer em que humor ela afeta, não pode afirmar que funciona! Ah, os plebeus acreditam em qualquer coisa..."
 seduce_ongoing.2009.a:0 "Foi uma noite muito agradável."
 seduce_ongoing.2009.desc:0 "Eu levei a \"poção do amor\" até [target.GetTitledFirstName], e [target.GetSheHe] ficou tão surpreso com a ingenuidade do meu servo quanto eu havia ficado!\n\nPassamos a noite discutindo sobre superstições e crenças ridículas. Os plebeus acreditam em qualquer coisa."
 seduce_ongoing.2010.a:0 "Se você não acredita, não me aborreça com isso!"
 seduce_ongoing.2010.desc:0 "[owner.GetTitledFirstName] veio até mim com uma \"poção do amor\" que um servo [owner.GetHerHim] havia adquirido. Não achei interessante, mas [owner.GetFirstName] continuou falando sobre isso e sobre o quão supersticiosos e ingênuos os plebeus são."
 seduce_ongoing.2011.a:0 "[target.GetSheHe|U] deve estar excepcionalmente fleumático hoje."
 seduce_ongoing.2011.desc:0 "[target.GetFirstName] pareceu pouco impressionado com a \"poção do amor\", e eu não tive mais sorte ao tentar discutir sobre ridículas superstições camponesas. Na verdade, [target.GetSheHe] parecia irritado com tudo isso!"
 seduce_ongoing.3001.a:0 "Vou dar a [close_character.GetFirstNameNoTooltip] tudo o que [close_character.GetSheHe] pedir."
 seduce_ongoing.3001.b:0 "Uma demonstração de boa vontade deve resolver."
 seduce_ongoing.3001.c:0 "Posso ajudar a pagar as dívidas [close_character.GetHerHim]."
 seduce_ongoing.3001.d:0 "Certamente qualquer um se sentiria abençoado com um presente de ouro."
 seduce_ongoing.3001.desc:0 "Fui informado de que [target.GetTitledFirstName] é muito próxim[Select_CString( target.IsFemale, 'a', 'o' )] [Select_CString( close_character.IsFemale, 'da sua', 'do seu' )] [target.Custom2('RelationToMe', SCOPE.sC('close_character'))], [close_character.GetTitledFirstName]. Ganhar o favor [close_character.GetHerHim] pode me ajudar a chamar a atenção de [target.GetFirstNamePossessive]."
 seduce_ongoing.3001.e.tt:0 "#F Vou encontrar outras formas de conquistar o afeto de [target.GetFirstNamePossessiveNoTooltip].#!"
 seduce_ongoing.3001.e:0 "Isso não parece certo."
 seduce_ongoing.3001.t:0 "Corações e Mentes"
 seduce_ongoing.3002.a:0 "Talvez eu tenha subestimado [owner.GetSheHe]?"
 seduce_ongoing.3002.b:0 "[owner.GetFirstNameNoTooltip] ajudando [close_character.GetFirstNameNoTooltip]? Impressionante, de certa forma."
 seduce_ongoing.3002.desc:0 "M[Select_CString( close_character.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('close_character'))], [close_character.GetTitledFirstName], tem me falado ultimamente como está impressionado com a generosidade de [owner.GetTitledFirstName].\n\nParece que [owner.GetSheHe] esteve ao lado [close_character.GetHerHim] quando [close_character.GetSheHe] mais precisava."
 seduce_ongoing.3003.a:0 "Qualquer coisa pel[Select_CString( close_character.IsFemale, 'a', 'o' )] [target.Custom2('RelationToMe', SCOPE.sC('close_character'))] de [target.GetFirstNamePossessiveNoTooltip]."
 seduce_ongoing.3003.desc:0 "Da próxima vez que nos encontramos, [target.GetFirstName] me oferece um sorriso mais amplo do que o habitual.\n\n\"M[Select_CString( close_character.IsFemale, 'inha', 'eu' )] [target.Custom2('RelationToMe', SCOPE.sC('close_character'))] [close_character.GetFirstName] me contou sobre como você ajudou [close_character.GetSheHe], e eu queria oferecer meu agradecimento.\""
 seduce_ongoing.3004.a:0 "O que será preciso?"
 seduce_ongoing.3004.desc:0 "Parece que [target.GetFirstName] não percebeu minha generosidade em relação [Select_CString( close_character.IsFemale, 'a', 'ao' )] [target.Custom2('RelationToMe', SCOPE.sC('close_character'))] [target.GetHerHim]. Pelo menos [close_character.GetFirstName] está grato!"
 seduce_ongoing.4001.a:0 "Seria uma declaração ousada [Select_CString( target.IsFemale, 'à', 'ao' )] [target.GetLadyLord]!"
 seduce_ongoing.4001.b.failure:0 "A dedicação passou despercebida"
 seduce_ongoing.4001.b:0 "Prefiro insinuações veladas do meu desejo por [target.GetSheHe]."
 seduce_ongoing.4001.c:0 "As pessoas em [court_location.GetNameNoTierNoTooltip] se regozijarão em minha glória!"
 seduce_ongoing.4001.d:0 "Eu não deveria me envolver em coisas assim."
 seduce_ongoing.4001.desc.court_musician:0 "Em breve, um [target.Custom('MusicalPerformer')] se apresentará na corte em [court_location.GetNameNoTier]. Eu poderia fazer o simples pedido para que [dummy_musician_gender.GetSheHe] dedicasse a apresentação a [target.GetTitledFirstName], o alvo do meu afeto.\n\nAlternativamente, se eu pedir para meu [GetCourtPositionType('court_physician_court_position').GetName()] [court_musician.GetName] se juntar à apresentação, poderia fazê-los tocar peças que me façam parecer bem diante do público presente lá."
 seduce_ongoing.4001.desc:0 "Em breve, um [target.Custom('MusicalPerformer')] se apresentará na corte em [court_location.GetNameNoTier]. Seria um simples pedido para que [dummy_musician_gender.GetSheHe] dedicasse a apresentação [Select_CString( target.IsFemale, 'a', 'ao' )] [target.GetTitledFirstName], o alvo do meu afeto."
 seduce_ongoing.4001.t:0 "Dedicação à [target.Custom('MusicalPerformerPossessive')|U]"
 seduce_ongoing.4002.a:0 "[owner.GetTitledFirstNameNoTooltip] realmente se superou."
 seduce_ongoing.4002.desc.court_musician:0 "\n\nConforme o [ROOT.Char.Custom('MusicalPerformer')] junto com [GetCourtPositionType('court_physician_court_position').GetName()] de [owner.GetTitledFirstNamePossessive] [court_musician.GetName] começa mais uma estrofe, tento não deixar minha admiração aparecer muito enquanto escuto as proezas de [owner.GetFirstNameNoTooltip]."
 seduce_ongoing.4002.desc.opening:0 "Há sempre artistas se apresentando na corte, mas desta vez nos prometeram algo especial, e certamente tivemos."
 seduce_ongoing.4002.desc:0 "\n\nConforme o [ROOT.Char.Custom('MusicalPerformer')] começa mais uma estrofe, tento não mostrar o quanto estou lisonjeado com esta dedicação, dirigida a mim na frente de toda a corte."
 seduce_ongoing.4003.a:0 "Que audácia!"
 seduce_ongoing.4003.desc.court_musician:0 "\n\nConforme o [ROOT.Char.Custom('MusicalPerformer')] junto com [GetCourtPositionType('court_physician_court_position').GetName()] de [owner.GetTitledFirstNamePossessive] [court_musician.GetName] começa mais uma estrofe, saio da sala envergonhado. Será que [owner.GetFirstNameNoTooltip] mandou seu [GetCourtPositionType('court_physician_court_position').GetName()] apenas para elogiar [owner.GetHerselfHimself]!?"
 seduce_ongoing.4003.desc:0 "\n\nConforme o [ROOT.Char.Custom('MusicalPerformer')] começa mais uma estrofe, saio da sala envergonhado. Cada canção é uma dedicação a mim, vinda de [owner.GetTitledFirstName]!"
 seduce_ongoing.4004.a:0 "Perfeito!"
 seduce_ongoing.4004.desc:0 "Obrigado pelo presente musical. A performance do [target.Custom('MusicalPerformerPossessive')] foi muito apreciada! Eu sempre soube que você é uma pessoa de gosto impecável."
 seduce_ongoing.4005.a:0 "Isso não era o que eu queria!"
 seduce_ongoing.4005.court:0 "toda a corte?"
 seduce_ongoing.4005.desc.court_musician:0 "Escrevo para dizer o quanto você fez de tolo de si mesmo forçando a audiência a ouvir suas supostas façanhas. Você realmente acredita que falar de si mesmo é uma boa forma de entreter a corte?"
 seduce_ongoing.4005.desc:0 "Como você se atreve a me envergonhar em público assim?! Você #EMP queria#! que eu explicasse o que as palavras do [target.Custom('MusicalPerformerPossessive')] significam para"
 seduce_ongoing.4005.opening:0 "[target.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 seduce_ongoing.4005.spouse:0 "m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [target.Custom2('RelationToMe', SCOPE.sC('spouse'))]?"
 seduce_ongoing.4006.a:0 "Você sabe como chamar minha atenção, [owner.GetFirstNameNoTooltip]."
 seduce_ongoing.4006.desc:0 "Enquanto [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.Custom('MusicalPerformer')] continua recitando versos de amor e desejo, tento evitar que o restante da corte perceba o quanto estou lisonjeado.\n\nApesar de [owner.GetSheHe] estar envolvido em metáforas e alegorias, eu sei que esta é uma dedicação de [owner.GetTitledFirstName] para mim."
 seduce_ongoing.4007.a:0 "Que desperdício de esforço."
 seduce_ongoing.4007.desc:0 "Talvez minha dedicação [Select_CString( target.IsFemale, 'à', 'ao' )] [target.GetLadyLord] [target.GetFirstName] tenha sido um pouco sutil demais... [target.GetSheHe|U] parece não ter notado."
 seduce_ongoing.4011.a:0 "Um passeio pela rua do mercado, para que todos vejam!"
 seduce_ongoing.4011.b.failure:0 "Não consigo impressionar [target.GetFirstNameNoTooltip]"
 seduce_ongoing.4011.b:0 "Vamos ficar pelas vielas. Quem precisa da companhia dos outros?"
 seduce_ongoing.4011.c.tt:0 "#F Posso esperar por outras oportunidades!#!"
 seduce_ongoing.4011.c:0 "Talvez não devêssemos fazer isso."
 seduce_ongoing.4011.desc:0 "Pode parecer audacioso, mas tenho pensado em convidar [target.GetTitledFirstName] para andar comigo pelas ruas do [court_location.Custom('BaronyTownType')] de [court_location.GetNameNoTier]."
 seduce_ongoing.4011.t:0 "Um Passeio em [court_location.GetNameNoTierNoTooltip]"
 seduce_ongoing.4012.a:0 "Certamente causamos uma boa impressão."
 seduce_ongoing.4012.end:0 "\n\nAcabou sendo um dia agradável, enquanto andávamos pela rua do mercado, conversando sobre diversos assuntos enquanto os comerciantes ofereciam suas mercadorias aos camponeses que olhavam admirados para nosso séquito reluzente de armaduras."
 seduce_ongoing.4012.opening:0 "Fiquei um pouco surpreso quando [owner.GetTitledFirstName] me convidou para um passeio pelas ruas do [court_location.Custom('BaronyTownType')] de [court_location.GetNameNoTier]."
 seduce_ongoing.4013.a:0 "Vamos evitar fazer isso novamente."
 seduce_ongoing.4013.end:0 "\n\nFiquei cada vez mais incerto à medida que [owner.GetSheHe] insistia em andar pela rua do mercado, e entre nosso séquito elaborado e a falta de conversa, ficou claro que [owner.GetSheHe] estava apenas querendo se exibir. Eu teria ido embora se isso não causasse um escândalo."
 seduce_ongoing.4014.a:0 "O prazer foi todo meu."
 seduce_ongoing.4014.desc:0 "Querid[Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstName],\n\nFoi simplesmente adorável ter sua companhia em [court_location.GetNameNoTier] [court_location.Custom('BaronyTownType')], e espero ver mais de você em breve."
 seduce_ongoing.4015.a:0 "Não era isso que eu queria dizer!"
 seduce_ongoing.4015.desc:0 "Para [target.GetTitledFirstName],\n\nVocê estava esperando me envergonhar em público? Me exibindo como um ridículo troféu... Você sabe o que estão dizendo na corte?"
 seduce_ongoing.4016.a:0 "[target.GetFirstNameNoTooltip] me faz enxergar tantas perspectivas novas."
 seduce_ongoing.4016.end:0 "\n\nPassamos por uma infinidade de vielas, rindo com a surpresa dos camponeses enquanto nosso séquito passava. No final do dia, eu conhecia melhor o [court_location.Custom('BaronyTownType')] do que jamais imaginaria."
 seduce_ongoing.4017.a:0 "Ficamos... só nós dois, nós—"
 seduce_ongoing.4017.desc:0 "Querid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitledFirstName],\n\nObrigado por sua companhia em minha visita a [court_location.GetNameNoTier] [court_location.Custom('BaronyTownType')], embora sua insistência em ficar nas vielas e evitar a vista tenha me deixado bastante confuso. Talvez você possa explicar outra hora."
 seduce_ongoing.4018.a:0 "O prazer foi todo meu."
 seduce_ongoing.4018.desc:0 "Querid[Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstName],\n\nMe diverti muito durante sua visita a [court_location.GetNameNoTier]. Agora conheço partes do [court_location.Custom('BaronyTownType')] que jamais imaginaria conhecer!"
 seduce_ongoing.4101.a.tt:0 "#F Vou tentar chamar a atenção [target.GetHerHim] de forma discreta!#!"
 seduce_ongoing.4101.a:0 "[target.GetFirstNameNoTooltip]! Olhe lá fora e ilumine minha noite!"
 seduce_ongoing.4101.b.tt:0 "#F Com certeza [target.GetSheHe] ficará feliz em me ver!#!"
 seduce_ongoing.4101.b:0 "Eu subo."
 seduce_ongoing.4101.c.tt:0 "#F [target.GetSheHe|U] certamente apreciará o gesto sutil, e o que [target.GetSheHe] significa para mim!#!"
 seduce_ongoing.4101.c:0 "Vou deixar [SCOPE.Custom('SeductionObjectIndefinite')] para [target.GetSheHe] encontrar, junto com um bilhete."
 seduce_ongoing.4101.d.tt:0 "#F Não vou me aproximar [target.GetHerHim] como um ladrão na noite!#!"
 seduce_ongoing.4101.d:0 "Melhor eu ir embora antes que alguém me veja."
 seduce_ongoing.4101.desc_opening:0 "As janelas de [target.GetTitledFirstNamePossessive] estão iluminadas por uma luz quente, e mesmo do chão eu consigo ver movimento lá dentro.\n\n"
 seduce_ongoing.4101.desc_other_court:0 "Meu coração pulsa alto em meus ouvidos; cortejar a chance de conquistar [target.GetSheHe], assim como visitar [court_location.GetNameNoTier], me deixou em águas profundas."
 seduce_ongoing.4101.desc_same_court:0 "Meu coração pulsa alto em meus ouvidos; eu posso estar dentro de meu próprio [ROOT.Char.Custom('ResidenceBuilding')], mas quando disputo pelo desejo [target.GetHerHim], ainda estou pisando em terreno desconhecido."
 seduce_ongoing.4101.t:0 "O Balcão de Meu Amado"
 seduce_ongoing.4102.a:0 "É como algo saído de um conto, que romântico!"
 seduce_ongoing.4102.b:0 "Para que eu seja sujeito à sua horrenda aparência? Não."
 seduce_ongoing.4102.desc:0 "Tendo recuado para meus aposentos durante a noite, fiquei surpreso ao ouvir uma voz abafada vinda do lado de fora, que se assemelha suspeitosamente [Select_CString( owner.IsFemale, 'a', 'ao' )] [owner.GetTitledFirstName].\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip], suplico-lhe, deixe-me ver a sua bela aparência!\""
 seduce_ongoing.4102.t:0 "Abaixo do Meu Balcão"
 seduce_ongoing.4103.a:0 "Oh [target.GetFirstNameNoTooltip], você é o sol em minha noite!"
 seduce_ongoing.4103.desc:0 "Assim como a luz da porta aberta de [target.GetTitledFirstNamePossessive] ilumina o balcão, ela também ilumina meu coração.\n\nO véu de escuridão ao nosso redor dá à nossa conversa uma estranha sensação de liberdade, e — mesmo que eu tenha ficado no chão — nunca estivemos tão íntimos antes."
 seduce_ongoing.4104.a:0 "Mas... Você é o sol em minha noite escura...!"
 seduce_ongoing.4104.desc:0 "Assim como a luz da porta aberta de [target.GetTitledFirstNamePossessive] ilumina o balcão, ela também ilumina meu coração.\n\nRapidamente, ela se desvanece quando vejo a careta [target.Custom('quirk_neg_adjective')] em seu rosto, e morre completamente quando [target.GetSheHe] fala. \"O que você está fazendo aqui, [ROOT.Char.GetTitledFirstNameNoTooltip]? Por favor, me deixe em paz.\""
 seduce_ongoing.4105.a:0 "Ah, você é [Select_CString( owner.IsFemale, 'uma boba', 'um bobo' )], [owner.GetWomanMan], entre!"
 seduce_ongoing.4105.b:0 "Tenho sorte de minhas cortinas serem tão grossas."
 seduce_ongoing.4105.c:0 "Guardas! Me ajudem, guardas!"
 seduce_ongoing.4105.desc:0 "#EMP Gasp!#!\n\nTendo recuado para meus aposentos durante a noite, estou de repente frente a frente com um[Select_CString( owner.IsFemale, 'a', '' )] [owner.GetWomanMan] do lado de fora da minha janela... Um[Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetWomanMan] que se parece suspeitosamente com [owner.GetTitledFirstName]."
 seduce_ongoing.4106.a:0 "Nenhuma barreira pode me impedir de chegar até você!"
 seduce_ongoing.4106.desc:0 "Assim que eu chego ao balcão de [target.GetTitledFirstNamePossessive], [target.GetSheHe] sai para fora com uma risada. \"Por que você faria uma loucura dessas, [ROOT.Char.GetFirstNameNoTooltip]? Apenas use a porta como uma pessoa normal. Você age como se tivesse intenções que quer esconder.\"\n\nA alegria brincalhona em seus olhos faz tudo valer a pena."
 seduce_ongoing.4107.a.tt:0 "#F Eu deveria ter pensado melhor antes de surpreender um[Select_CString( target.IsFemale, 'a', '' )] [target.GetWomanMan] tão paranóic[Select_CString( target.IsFemale, 'a', 'o' )]!#!"
 seduce_ongoing.4107.a:0 "Isso poderia ter sido melhor..."
 seduce_ongoing.4107.desc:0 "Assim que eu chego ao balcão de [target.GetTitledFirstNamePossessive], [target.GetSheHe] sai para fora com uma careta [target.Custom('quirk_neg_adjective')] em seu rosto.\n\n\"Que loucura é essa, [ROOT.Char.GetFirstNameNoTooltip]? Você não pode — você é um [ROOT.Char.GetTitleTierName]! Isso não é apropriado.\""
 seduce_ongoing.4107.desc_paranoid:0 "Assim que eu chego ao balcão de [target.GetTitledFirstNamePossessive], [target.GetSheHe] começa a gritar pelos guardas [target.GetHerHim]. \"Ajuda, um intruso!\"\n\nSua voz me segue enquanto eu me afasto, tropeçando até chegar ao chão antes de desaparecer na noite."
 seduce_ongoing.4108.a:0 "Vou deixar [SCOPE.Custom('SeductionObjectIndefinite')] para que [owner.GetSheHe] encontre!"
 seduce_ongoing.4108.b:0 "O que eu devo fazer com isso? Vender talvez!"
 seduce_ongoing.4108.desc:0 "Tendo recuado para meus aposentos durante a noite, sou surpreendido por um som semelhante ao de uma pedrinha batendo na minha janela. Espiando o jardim escuro, vejo [SCOPE.Custom('SeductionObjectIndefinite')] deitado no chão embrulhado em um bilhete, e um[Select_CString( owner.IsFemale, 'a', '' )] [owner.GetWomanMan] que se parece com [owner.GetTitledFirstName] desaparecendo na noite.\n\n#EMP Para [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('ComplimentAdjective', ROOT.Char)] [ROOT.Char.GetTitledFirstNameNoTooltip], como um símbolo dos meus sentimentos.#!"
 seduce_ongoing.4109.a:0 "Ah, [target.GetFirstNameNoTooltip]!"
 seduce_ongoing.4109.desc:0 "Dois [SCOPE.Custom('SeductionObjectMultiple')], esperando por mim em meus aposentos. Sem bilhete ou saudação, mas eu juro que ainda posso sentir o doce aroma d[Select_CString( target.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('ComplimentAdjective', SCOPE.sC('target'))] [target.GetTitledFirstName] no ar!"
 seduce_ongoing.4110.a:0 "Meu coração está tão partido quanto o [SCOPE.Custom('SeductionObject')]!"
 seduce_ongoing.4110.desc:0 "À medida que os dias passam sem qualquer resposta de [target.GetTitledFirstName], decido tentar minha sorte mais uma vez — talvez [target.GetSheHe] não tenha visto o presente em primeiro lugar?\n\nOh, como minha esperança morreu rapidamente quando encontrei o [SCOPE.Custom('SeductionObject')] debaixo da janela [target.GetHerHim], a marca de um calcanhar ainda visível na lama onde [target.GetSheHe] o esmagou."
 seduce_ongoing.5001.a.tt:0 "#F Apelar para o lado intelectual de [target.GetFirstNamePossessiveNoTooltip]#!"
 seduce_ongoing.5001.a:0 "O que você pensa sobre o assunto de [ROOT.GetCharacter.Custom('education_conversation_subject')]?"
 seduce_ongoing.5001.b.tt:0 "#F Apelar para o lado malicioso de [target.GetFirstNamePossessiveNoTooltip] zombando de [mocked_courtier.GetTitledFirstNameNoTooltip] juntos#!"
 seduce_ongoing.5001.b:0 "Sobre [Select_CString( mocked_courtier.IsFemale, 'a', 'o' )] [mocked_courtier.Custom2('InsultNoun', ROOT.Char)] [mocked_courtier.GetFirstNameNoTooltip]..."
 seduce_ongoing.5001.c.tt:0 "#F Apelar para o lado luxurioso de [target.GetFirstNamePossessiveNoTooltip]#!"
 seduce_ongoing.5001.c_tier_down:0 "A questão é o que #EMP eu#! posso fazer por #EMP você#!, [Select_CString( target.IsFemale, 'minha', 'meu' )] [target.GetLadyLord]."
 seduce_ongoing.5001.c_tier_up:0 "O prazer é todo meu, [Select_CString( target.IsFemale, 'minha', 'meu' )] [target.GetLadyLord]. Deveríamos resolver isso."
 seduce_ongoing.5001.d:0 "Perdoe a intromissão, eu já estava de saída."
 seduce_ongoing.5001.desc_ending:0 "\n\nAs hostilidades entre nós continuam como sempre, mas eu tenho um plano de como domar os sentimentos tempestuosos que abrigamos um pelo outro..."
 seduce_ongoing.5001.desc_tier_down:0 "\"Será que [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [target.Custom2('RelationDescriptor', ROOT.Char)] [ROOT.Char.GetWomanMan] nunca me deixará em paz...\" [target.GetTitledFirstName] murmura enquanto me aproximo. \"O que você quer, [ROOT.Char.GetTitledFirstNameNoTooltip]?\""
 seduce_ongoing.5001.desc_tier_up:0 "\"A que devo essa honra, minha #EMP [ROOT.Char.GetTitleTierName]#!?\" [target.GetTitledFirstName] pergunta com um sorriso que não chega nem perto de seus olhos."
 seduce_ongoing.5001.t:0 "[Select_CString( target.IsFemale, 'A', 'O' )] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))|U] [target.GetWomanMan]"
 seduce_ongoing.5001.t_rival:0 "M[Select_CString( target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))|U] Rival"
 seduce_ongoing.5003.a:0 "Nunca antes conheci alguém tão #EMP agradável#!"
 seduce_ongoing.5003.bodily:0 "Nada poderia me preparar para a tentação da pele nua [owner.GetHerHim] quando [owner.GetSheHe] tirou [owner.Custom('GetUpperClothingArticle')]."
 seduce_ongoing.5003.conversation:0 "Para minha surpresa, [owner.GetSheHe] me envolveu em uma conversa sobre o assunto de [ROOT.GetCharacter.Custom('education_conversation_subject')], e apesar das minhas reservas iniciais em relação à companhia [owner.GetHerHim], achei tudo muito interessante!"
 seduce_ongoing.5003.fallback:0 "Para minha surpresa, passamos uma noite bastante agradável juntos, rindo de assuntos banais e caminhando pelos jardins."
 seduce_ongoing.5003.mockery:0 "\"[ROOT.Char.GetTitledFirstNameNoTooltip]! Você não vai acreditar no que [Select_CString( mocked_courtier.IsFemale, 'a', 'o' )] [mocked_courtier.Custom2('InsultNoun', SCOPE.sC('owner'))] [mocked_courtier.GetFirstName] fez hoje!\"\nPara minha surpresa, tivemos uma conversa bastante agradável sobre os defeitos de [mocked_courtier.GetFirstNamePossessive]."
 seduce_ongoing.5003.opening:0 "A cada passo que [owner.GetTitledFirstName] dá em minha direção, sinto meu humor se esvair. O que [Select_CString( owner.IsFemale, 'a', 'o' )] [owner.Custom2('InsultNoun', ROOT.Char)] quer agora?\n\n"
 seduce_ongoing.5003.t:0 "Minha Rival [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('owner'))|U]"
 seduce_ongoing.5004.a:0 "Tão desagradável quanto sempre!"
 seduce_ongoing.5004.bodily:0 "À medida que [owner.GetSheHe] se aproxima desconfortavelmente de mim e começa a puxar sugestivamente [owner.Custom('GetUpperClothingArticle')], eu rapidamente me afasto."
 seduce_ongoing.5004.conversation:0 "\"Sobre o assunto de [owner.Custom('education_conversation_subject')]...\"\n\nNão sei por que [owner.GetSheHe] imaginou que eu estaria interessado no assunto, mas logo deixei claro, sem sombra de dúvidas, que eu não estava."
 seduce_ongoing.5004.fallback:0 "Ao que parece, [owner.GetSheHe] teve a ideia de passar o dia comigo, pois [owner.GetSheHe] se recusou a sair antes que eu deixasse claro o quanto detesto a presença [owner.GetHerHim]."
 seduce_ongoing.5004.mockery:0 "\"[ROOT.Char.GetTitledFirstNameNoTooltip]! Você não vai acreditar no que [Select_CString( owner.IsFemale, 'a', 'o' )] [mocked_courtier.Custom2('InsultNoun', SCOPE.sC('owner'))] [mocked_courtier.GetFirstName] fez hoje!\"\n\nNão consigo imaginar o que levou [owner.GetSheHe] a caluniar [mocked_courtier.GetTitledFirstName] na minha frente, mas [owner.GetSheHe] logo parou antes que fosse tarde demais."
 seduce_ongoing.5004.opening:0 "A cada passo que [owner.GetTitledFirstName] dá em minha direção, sinto meu humor se esvair. O que [Select_CString( owner.IsFemale, 'a', 'o' )] [owner.Custom2('InsultNoun', ROOT.Char)] quer agora?\n\n"
 seduce_ongoing.5005.a:0 "Ainda mostrarei a [target.GetSheHe] o quão boa companhia posso ser!"
 seduce_ongoing.5005.bodily:0 "Eu só tenho uma pequena amostra do que [target.GetTitledFirstName] tem a oferecer, mas isso me deixa com sede de mais. Enquanto um silêncio amigável se instaura entre nós, nos afastamos, e percebo que [target.GetSheHe] está mais relaxado do que nunca em minha companhia - [target.Custom('GetUpperClothingArticle')] desalinhado e tudo."
 seduce_ongoing.5005.conversation:0 "O sorriso de [target.GetTitledFirstNamePossessive] ilumina todo o seu rosto ao final de uma longa conversa sobre [target.Custom('herhis_subject_of_interest')]. Enquanto um silêncio amigável se instaura entre nós, percebo que estamos ficando muito mais próximos; minha mão quase toca [target.Custom('GetClothingArticle')]."
 seduce_ongoing.5005.ending:0 "\n\n\"Eu nunca soube que você era uma tão boa companhia, [ROOT.Char.GetFirstNameNoTooltip]!\""
 seduce_ongoing.5005.fallback:0 "Passamos a noite juntos, conversando e rindo. Enquanto um silêncio amigável se instaura entre nós, percebo que estamos ficando muito mais próximos; minha mão quase toca [target.Custom('GetClothingArticle')]."
 seduce_ongoing.5005.mockery:0 "\"... e a forma como [mocked_courtier.GetSheHe] [mocked_courtier.Custom('quirk_neg_present')] – nunca vi nada igual!\"\n\nAs risadas que compartilhamos à custa de [mocked_courtier.GetTitledFirstName] são mais genuínas do que eu esperava, e enquanto um silêncio amigável se instaura entre nós, percebo que estamos ficando muito mais próximos; minha mão quase toca [target.Custom('GetClothingArticle')]."
 seduce_ongoing.5006.a:0 "Por que estou tentando conquistar alguém tão [target.Custom2('InsultNounSexual', ROOT.Char)]?!"
 seduce_ongoing.5006.bodily:0 "Ao me aproximar de [target.GetFirstName], sorrindo [ROOT.Char.Custom('quirk_pos_adverb')] e levantando sugestivamente minha [ROOT.Char.Custom('GetUpperClothingArticle')], [target.GetSheHe] rapidamente recua com uma expressão de puro desgosto."
 seduce_ongoing.5006.conversation:0 "Depois de quase uma hora de conversa desconfortável, [target.GetFirstName] parece tão entediado quanto eu já o vi. Quando mudo de assunto de [target.Custom('herhis_subject_of_interest')] para [ROOT.GetCharacter.Custom('education_conversation_subject')], [target.GetSheHe] [target.Custom('quirk_neg_present')] e se desculpa, afastando-se."
 seduce_ongoing.5006.fallback:0 "Enquanto eu tento encontrar algum ponto em comum com [target.GetFirstName], o desdém dele se torna cada vez mais evidente a cada minuto.\n\nLogo o suficiente, [target.GetSheHe] se desculpa e foge da minha companhia."
 seduce_ongoing.5006.mockery:0 "\"[ROOT.Char.GetTitledFirstNameNoTooltip]! Você não vai acreditar no que [Select_CString( owner.IsFemale, 'a', 'o' )] [mocked_courtier.Custom2('InsultNoun', ROOT.Char)] [mocked_courtier.GetFirstName] fez hoje!\"\n\nEu rapidamente perco o fio da conversa à medida que o desdém no rosto de [target.GetFirstNamePossessive] fica cada vez mais pronunciado."
 seduce_ongoing.5011.a:0 "Vou garantir que o sorriso [target.Custom('quirk_neg_adjective')] saia do rosto [target.GetHerHim]!"
 seduce_ongoing.5011.b:0 "Posso ajudar você a se levantar?"
 seduce_ongoing.5011.c.tt:0 "#F A dor que suporto por amor!#!\nEssa opção está disponível devido ao traço Sadista de [target.GetFirstNameNoTooltip]\n\n"
 seduce_ongoing.5011.c:0 "O próximo soco [target.GetHerHim|U] vai tirar sangue."
 seduce_ongoing.5011.d:0 "Brigar como crianças não pode ser o caminho para o coração [target.GetHerHim]!"
 seduce_ongoing.5011.desc:0 "Poucos podem me provocar como [target.GetTitledFirstName], e à medida que nos encontramos sozinhos, [target.GetSheHe] logo lança tanto insulto quanto mão em mim. Eu, é claro, respondo da mesma forma.\n\nDevo admitir que a emoção disso — tanto a briga quanto a proximidade do corpo suado e ofegante [target.GetHerHim] — é o suficiente para acender meu sangue. Logo, não consigo dizer se estou realmente tentando superar [target.GetSheHe], ou apenas prolongando o conflito..."
 seduce_ongoing.5011.t:0 "Atrações Irritantes"
 seduce_ongoing.5012.a:0 "[owner.GetSheHe|U] melhor não pegar leve comigo!"
 seduce_ongoing.5012.b:0 "Chega! Deixe-me em paz."
 seduce_ongoing.5012.desc:0 "Poucos podem me provocar como [owner.GetTitledFirstName], e quando nos encontramos sozinhos, logo trocamos insultos e socos.\n\nDevo admitir que a emoção disso — tanto a briga quanto a proximidade de outro corpo suado e ofegante — é o suficiente para acender meu sangue, e [owner.GetSheHe] não mostra sinais de parar."
 seduce_ongoing.5013.a:0 "É bom extravasar um pouco!"
 seduce_ongoing.5013.desc:0 "[target.GetTitledFirstName] e eu acabamos no chão, brigando como pequen[Select_CString( target.IsFemale, 'as', 'os' )] [target.Custom('GirlsBoysChildren')]. Nossas carrancas logo se transformam em sorrisos, nossos punhos em carícias, nossos xingamentos em gemidos...\n\nSe [target.GetSheHe] percebe que fico em seu abraço restritivo por mais tempo do que o necessário, [target.GetSheHe] não parece se importar."
 seduce_ongoing.5014.a:0 "Isso foi desafortunado."
 seduce_ongoing.5014.desc:0 "[target.GetTitledFirstName] e eu acabamos no chão, brigando como pequen[Select_CString( target.IsFemale, 'as', 'os' )] [target.Custom('GirlsBoysChildren')], e a carranca [target.GetHerHim] logo se transforma em uma careta.\n\n\"Diminua o ritmo, brutamontes!\""
 seduce_ongoing.5015.a:0 "Obrigado, [owner.GetFirstNameNoTooltip]."
 seduce_ongoing.5015.b:0 "Quem [owner.GetSheHe] pensa que é?!"
 seduce_ongoing.5015.desc:0 "Poucos podem me provocar como [owner.GetTitledFirstName], e quando nos encontramos sozinhos, logo trocamos insultos e socos.\n\nDevo admitir que fiquei surpreso quando [owner.GetSheHe] estendeu a mão para mim, oferecendo ajuda para me levantar."
 seduce_ongoing.5016.desc:0 "[target.GetTitledFirstName] e eu acabamos no chão, brigando como pequen[Select_CString( target.IsFemale, 'as', 'os' )] [target.Custom('GirlsBoysChildren')], e nossas carrancas logo se transformam em sorrisos.\n\nEnquanto ofereço a mão para [target.GetSheHe] se levantar, [target.GetSheHe] a pega e acena agradecendo."
 seduce_ongoing.5017.desc:0 "[target.GetTitledFirstName] e eu acabamos no chão, brigando como pequen[Select_CString( target.IsFemale, 'as', 'os' )] [target.Custom('GirlsBoysChildren')], e a carranca [target.GetHerHim] logo se transforma em uma careta, que se intensifica quando me levanto antes [target.GetHerHim].\n\n\"Não vai nem me ajudar a levantar... Não deveria esperar nada diferente de um[Select_CString( owner.IsFemale, 'a', '' )] [owner.Custom2('InsultNoun', ROOT.Char)].\""
 seduce_ongoing.5018.a:0 "Ajoelhar-se diante de mim combina com você!"
 seduce_ongoing.5018.b:0 "Isso é patético. Deixe-me em paz."
 seduce_ongoing.5018.desc:0 "Poucos podem me provocar como [owner.GetTitledFirstName], e quando nos encontramos sozinhos, logo trocamos insultos e socos.\n\nApós uma breve hesitação de sua parte, ganho vantagem na briga, e não posso deixar de apreciar ter [owner.GetSheHe] em minhas mãos assim, ofegante e submiss[Select_CString( owner.IsFemale, 'a', 'o' )]."
 seduce_ongoing.5019.a:0 "Esse calafrio foi de antecipação! V-véritable!"
 seduce_ongoing.5019.desc:0 "Enquanto [target.GetTitledFirstName] está sobre mim, não consigo evitar o calafrio de medo que percorre minha espinha ao ver o prazer em seus olhos. Pelo menos [target.GetSheHe] parece ter apreciado o gesto..."
 seduce_ongoing.5020.a:0 "Isso poderia ter sido melhor... Mas também pior!"
 seduce_ongoing.5020.desc:0 "Enquanto [target.GetTitledFirstName] está sobre mim, não consigo evitar o calafrio de medo que percorre minha espinha ao ver o prazer em seus olhos. Ao [target.GetSheHe] se afastar de mim com um esgar de desgosto, sinto alívio e decepção ao mesmo tempo.\n\n\"Você nunca poderia me satisfazer. Deixe-me em paz, [ROOT.Char.GetFirstNameNoTooltip].\""
 seduce_ongoing.5101.a.tt:0 "#F Enfatizo nossas semelhanças#!"
 seduce_ongoing.5101.a:0 "Somos iguais perante [ROOT.Char.GetFaith.HighGodNameAlternate], [target.GetFirstNameNoTooltip]!"
 seduce_ongoing.5101.b.tt:0 "#F Eu enfatizo meu poder!#"
 seduce_ongoing.5101.b:0 "Existem mais maneiras de você me servir, [target.GetFirstNameNoTooltip]..."
 seduce_ongoing.5101.c.tt:0 "#F Deve haver maneiras melhores de deixar [target.GetSheHe] saber.#!"
 seduce_ongoing.5101.c:0 "Devo guardar meus sentimentos por enquanto."
 seduce_ongoing.5101.desc:0 "[target.GetTitledFirstName] frequentemente fala comigo de maneiras que deixam claro que seu serviço para mim cria uma distância entre nós.\n\nPreciso fazer [target.GetSheHe] entender que eu a quero de mais maneiras do que apenas como minha vassala, que anseio por seu calor, seu toque e por aqueles lábios suculentos."
 seduce_ongoing.5101.success_tt:0 "Se [target.GetFirstNameNoTooltip] responder positivamente:"
 seduce_ongoing.5101.t:0 "Obrigações e Desejos"
 seduce_ongoing.5102.a:0 "A atenção de m[Select_CString( owner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2(''RelationToMe'Possessive', SCOPE.sC('owner'))] é lisonjeir[Select_CString( owner.IsFemale, 'a', 'o' )]."
 seduce_ongoing.5102.b:0 "Não quero mais do que já temos."
 seduce_ongoing.5102.desc:0 "\"Posso ser [owner.GetTitleTierName], mas sempre pensei em nós como iguais.\" [Select_CString( owner.IsFemale, 'Minha senhora', 'Meu senhor' )], [owner.GetFirstName], veio até mim, e embora eu inicialmente esteja incert[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] sobre o porquê, logo fica claro. \"Nós... isso... Não precisamos nos prender a títulos. Somos mais do que meros nomes. Muito mais.\""
 seduce_ongoing.5103.a:0 "[target.GetFirstNameNoTooltip], eu ainda hei de tê-l[Select_CString( target.IsFemale, 'a', 'o' )]!"
 seduce_ongoing.5103.desc:0 "[Select_CString( ROOT.Char.IsFemale, 'Minha cara', 'Meu caro' )] [target.Custom2('RelationToMe', ROOT.Char)], [ROOT.Char.GetTitledFirstName],\nSinto-me lisonjead[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ao ouvir você nos descrever não apenas como senhor[Select_CString( ROOT.Char.IsFemale, 'a', '' )] e vassal[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], mas de muitas maneiras como iguais. Que possamos compartilhar um futuro igualmente brilhante para nós dois."
 seduce_ongoing.5104.a:0 "Ah, mas [target.GetFirstNameNoTooltip]..."
 seduce_ongoing.5104.desc:0 "[owner.GetFirstName], m[Select_CString( owner.IsFemale, 'inha', 'eu' )] [target.Custom2('RelationToMe', SCOPE.sC('owner'))]!\nO que você insinua, o que você pede, é muito inadequado! Eu tenho minhas obrigações de servidão ao reino, mas não confunda minha lealdade com desejo."
 seduce_ongoing.5105.a:0 "Posso cuidar de você de maneiras que ninguém mais pode."
 seduce_ongoing.5105.b:0 "Você tem minhas obrigações, mas nunca terá mais."
 seduce_ongoing.5105.desc:0 "\"Você sempre me serviu tão bem, tão lealmente.\" [Select_CString( owner.IsFemale, 'Minha senhora', 'Meu senhor' )], [owner.GetFirstName], veio até mim, e embora eu inicialmente esteja incert[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] sobre o porquê, logo fica claro. \"Eu o desejo não apenas como vassalo, mas como [Select_CString( target.IsFemale, 'uma', 'um' )] [target.GetWomanMan]. Sirva [Select_CString( owner.IsFemale, 'sua', 'seu' )] [owner.GetLadyLord] também dessa maneira!\""
 seduce_ongoing.5106.desc:0 "[Select_CString( ROOT.Char.IsFemale, 'Minha cara', 'Meu caro' )] [target.Custom2('RelationToMe', ROOT.Char)], [ROOT.Char.GetTitledFirstName],\nSinto-me lisonjead[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por ser capaz de inspirá-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] dessa maneira, mesmo eu, s[Select_CString( ROOT.Char.IsFemale, 'ua', 'eu' )] humilde súdit[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. Vamos ver onde o tempo nos leva."
 seduce_ongoing.5201.a.tt:0 "Acho que [target.GetTitledFirstName] já está fantasiando sobre nós, ou pelo menos sobre romance em geral"
 seduce_ongoing.5201.a:0 "Vamos jogar uma moeda e fazer um desejo de romance!"
 seduce_ongoing.5201.b.tt:0 "Acho que [target.GetTitledFirstName] valoriza verdadeiramente nossa amizade"
 seduce_ongoing.5201.b:0 "Lembra daquela vez em que..."
 seduce_ongoing.5201.c:0 "Não quero arriscar este momento."
 seduce_ongoing.5201.desc:0 "[target.GetFirstName] e eu caminhamos pela [court_location.Custom('BaronyTownType')] de [court_location.GetNameNoTier].\n\nAo chegarmos a uma praça com uma linda fonte, paramos para observar a atividade agitada ao nosso redor, e nossa comitiva desaparece momentaneamente em segundo plano."
 seduce_ongoing.5201.t:0 "Mais do que Amigos"
 seduce_ongoing.5202.a:0 "Vamos jogar três moedas, para dar mais sorte!"
 seduce_ongoing.5202.b:0 "Parece algo para um casal fazer, não para amigos."
 seduce_ongoing.5202.desc:0 "Enquanto m[Select_CString( owner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] [owner.GetFirstName] e eu caminhamos pela [court_location.Custom('BaronyTownType')] de [court_location.GetNameNoTier], nos deparamos com uma praça com uma linda fonte.\n\n\"Vamos jogar uma moeda juntos, [ROOT.Char.Custom('FormOfAddressForLiege')]? Dizem que isso trará romance a você...\""
 seduce_ongoing.5203.a:0 "[target.GetSheHe|U] é realmente [target.Custom2('ComplimentAdjectiveArticle', ROOT.Char)], [target.GetWomanMan]!"
 seduce_ongoing.5203.desc:0 "[target.GetFirstName] fica feliz em ficar ao meu lado, jogando uma moeda na água da fonte e sorrindo enquanto encontra meu olhar.\n\nO resto do passeio é permeado por um tom amigável, impulsionado por nosso desejo compartilhado."
 seduce_ongoing.5204.a:0 "Meu humor se tornou sombrio como as profundezas da fonte..."
 seduce_ongoing.5204.desc:0 "\"Que jogo bobo você está jogando, [ROOT.Char.GetFirstNameNoTooltip]?\"\n\n[target.GetFirstName] recusa meu pedido de desejar romance. O resto do passeio é gasto em um silêncio tenso, e logo nos despedimos um do outro."
 seduce_ongoing.5205.a:0 "Como poderia esquecer?"
 seduce_ongoing.5205.b:0 "Por que [owner.GetSheHe] está trazendo aquela noite embaraçosa à tona?!"
 seduce_ongoing.5205.desc:0 "Enquanto m[Select_CString( owner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] [owner.GetFirstName] e eu caminhamos pela [court_location.Custom('BaronyTownType')] de [court_location.GetNameNoTier], lembramos de tempos antigos.\n\n\"Lembra daquela vez em que passamos horas juntos até altas horas da noite, fazendo planos para o futuro, imaginando um compartilhado...?\""
 seduce_ongoing.5206.desc:0 "[target.GetFirstName] e eu passamos horas relembrando o passado e imaginando futuros hipotéticos juntos.\n\nO restante do passeio é tingido com um tom amigável, e não posso deixar de esperar que algumas de nossas teorias brincalhonas se tornem realidade."
 seduce_ongoing.5207.a:0 "Bem, isso poderia ter corrido melhor!"
 seduce_ongoing.5207.desc:0 "\"[Select_CString( ROOT.Char.IsFemale, 'Você é uma amiga tão boa', 'Você é um amigo tão bom' )] [ROOT.Char.GetFirstNameNoTooltip], isso é algo que eu nunca gostaria de mudar.\"\"\n\n[target.GetFirstName] deixa claro que [target.GetSheHe] não tem interesse em especulações sobre o que poderia ter sido, ou ainda pode acontecer, entre nós. O restante do passeio é passado em um silêncio tenso, e logo nos despedimos um do outro."
 seduce_ongoing.5301.a.tt:0 "#F Espero que meus sinais sutis sejam bem recebidos!#"
 seduce_ongoing.5301.a:0 "Uma mão na mão [target.GetHerHim] diria tudo."
 seduce_ongoing.5301.b.tt:0 "#F Espero que meu interesse óbvio seja bem recebido!#"
 seduce_ongoing.5301.b:0 "Estamos sozinhos, e não negarei a mim mesmo seus lábios."
 seduce_ongoing.5301.c.tt:0 "#F Haverá outras vezes. M[Select_CString( target.IsFemale, 'inha', 'eu' )] [THIS.Char.Custom2('RelationToMe', SCOPE.sC('target'))] não irá a lugar nenhum!#"
 seduce_ongoing.5301.c:0 "Seria uma pena terrível estragar uma noite maravilhosa."
 seduce_ongoing.5301.desc:0 "Ninguém acharia estranho eu ficar com m[Select_CString( target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] junto à lareira até tarde da noite. No entanto, há uma tensão no ar.\n\nEu quero nada mais do que puxar [target.GetSheHe] para perto e arrancar as roupas do corpo [target.GetHerHim], mas se [target.GetSheHe] soubesse disso, [target.GetSheHe] ficaria horrorizad[Select_CString( target.IsFemale, 'a', 'o' )]. Ou...?"
 seduce_ongoing.5301.success_tt:0 "Se [target.GetFirstName] corresponder aos meus avanços:"
 seduce_ongoing.5301.t:0 "Um Momento a Sós"
 seduce_ongoing.5302.a:0 "Recuso-me a acreditar que o que sinto está errado."
 seduce_ongoing.5302.b:0 "Fico lisonjead[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com a atenção, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))], mas não."
 seduce_ongoing.5302.desc:0 "Parece tão certo, que nem percebo de início, mas enquanto estamos sentados em frente à lareira, m[Select_CString( owner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] [owner.GetFirstName] segura minha mão com uma intensidade além das seguranças de um[Select_CString( owner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))].\n\nPosso sentir seu pulso acelerar com desejo."
 seduce_ongoing.5303.a:0 "Eu sei que você também sentiu isso, [target.GetFirstNameNoTooltip]."
 seduce_ongoing.5303.desc:0 "[target.GetFirstName] nem sequer reage quando minha mão segura [target.GetSheHe], embora ambos saibamos o que isso significa. Posso sentir o seu pulsar aumentar enquanto nossa conversa continua. Minha palma sua, e minha respiração fica ofegante antes que-\n#EMP O que foi isso?!# Ah, apenas um servo.\n\n[Select_CString( target.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] e eu damos nossas desculpas, antes de nos retirarmos. Separadamente."
 seduce_ongoing.5304.a:0 "Eu sei, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], mas mesmo assim..."
 seduce_ongoing.5304.desc:0 "Tento disfarçar como uma piada, mas [target.GetFirstName] interpretou corretamente minhas intenções.\n\n\"Um[Select_CString( owner.IsFemale, 'a', '' )] [target.Custom2('RelationToMe', SCOPE.sC('owner'))] nunca... Isso nunca deveria acontecer!\" [target.GetSheHe|U] me deixa sentad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] junto à lareira."
 seduce_ongoing.5305.a:0 "Parece que finalmente as coisas estão certas."
 seduce_ongoing.5305.desc:0 "Acontece tão de repente, e ainda assim não me surpreende. Em um momento estamos sentados junto à lareira, no próximo m[Select_CString( owner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] se aproxima. Então seu lábios estão pressionados contra os meus, mãos acariciando meu pescoço, meus ombros, minhas coxas, minhas partes íntimas-\n\nO barulho de um criado se aproximando faz com que nos afastemos às pressas, e meus pensamentos rapidamente alcançam meu desejo."
 seduce_ongoing.5306.a:0 "Você e eu, [Select_CString( target.IsFemale, 'minha querida', 'meu querido' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))]."
 seduce_ongoing.5306.desc:0 "[target.GetFirstName] retorna meu beijo, e por alguns momentos palpitantes, tudo está certo no mundo. Claro que não pode durar, pois rapidamente nos afastamos antes que sejamos vistos por um criado que passa.\n\nQuando nos separamos para seguir caminhos diferentes, [target.GetSheHe] me olha. \"Eu não entendi completamente até agora, [target.Custom2('RelationToMe', SCOPE.sC('owner'))].\""
 seduce_ongoing.5307.a:0 "[target.GetFirstNameNoTooltip], eu realmente pensei que..."
 seduce_ongoing.5307.desc:0 "[target.GetFirstName] parece perdid[Select_CString( target.IsFemale, 'a', 'o' )] no beijo por um momento, enquanto minhas mãos percorrem seu corpo, buscando famintamente. Então [target.GetSheHe] me empurra. \"O que você pensa que está fazendo?! Você é m[Select_CString( owner.IsFemale, 'inha', 'eu' )] [target.Custom2('RelationToMe', SCOPE.sC('owner'))]!\"\n\nNão tenho nada a dizer, nem maneira de me explicar, antes que [target.GetSheHe] saia correndo do quarto."
 seduce_ongoing.6001.a:0 "S[Select_CString( court_owner.IsFemale, 'ua', 'eu' )] [target.Custom2('RelationToMe', SCOPE.sC('court_owner'))] é interessante, mas o que #EMP você#! gosta?"
 seduce_ongoing.6001.b:0 "Com certeza você vai mencionar a mim para [court_owner.GetFirstNameNoTooltip]?"
 seduce_ongoing.6001.desc:0 "Ao visitar outras cortes, acho benéfico passar tempo com os cortesãos para conhecer seu senhor feudal. Se isso acontecer com [target.GetTitledFirstName], melhor ainda.\n\n[target.GetSheHe|U] responde diligentemente às minhas perguntas, e sinto que poderia passar o dia todo ouvindo, e [target.GetSheHe] parece satisfeit[Select_CString( target.IsFemale, 'a', 'o' )] em conversar."
 seduce_ongoing.6001.t:0 "Apenas Curiosidade"
 seduce_ongoing.6011.a:0 "Impressionante! Temos mais em comum do que eu pensava."
 seduce_ongoing.6011.b:0 "Você tem um olhar aguçado!"
 seduce_ongoing.6011.c:0 "Uma tática diversionária. Vejamos o que acontece agora..."
 seduce_ongoing.6011.desc:0 "Estou observando as tropas no pátio praticarem o treinamento que eu instruí, repetidas vezes. Presto tanta atenção que não percebo [target.GetTitledFirstName] se aproximando ao meu lado.\n\n\"Eles se movem bem, mas aquel[Select_CString( dummy_gender.IsFemale, 'a', 'e' )] [dummy_gender.GetWomanMan] está sempre meio passo atrás.\""
 seduce_ongoing.6011.t:0 "Uma Mostra de Força"
 seduce_ongoing.6021.a:0 "Por que [target.GetFirstNameNoTooltip], em todos os meus anos, nunca ouvi algo parecido!"
 seduce_ongoing.6021.b:0 "[target.GetFirstNameNoTooltip], eu nunca soube que tínhamos tanto em comum."
 seduce_ongoing.6021.c:0 "Me conte mais sobre suas ideias em formações de cavalaria..."
 seduce_ongoing.6021.desc:0 "Fiquei surpreendid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] que [target.GetTitledFirstName] e eu nos envolvêssemos em uma discussão sobre assuntos militares, mas [target.GetSheHe] parece quase tão apaixonad[Select_CString( target.IsFemale, 'a', 'o' )] quanto eu sobre o assunto. [target.GetSheHe|U] também está muito bem informad[Select_CString( target.IsFemale, 'a', 'o' )]!"
 seduce_ongoing.6021.t:0 "Um Encontro de Mentes"
 seduce_ongoing.6031.a:0 "Eu também vou fazer com que eles saibam que eu sei que eles sabem..."
 seduce_ongoing.6031.b:0 "Vou garantir que os espiões encontrem #EMP algo de interesse.#!"
 seduce_ongoing.6031.c:0 "Oh, que excelente oportunidade para praticar!"
 seduce_ongoing.6031.desc:0 "Assim como eu, [target.GetTitledFirstName] tem sua teia de espiões, alcançando o máximo possível de conhecimento oculto. Eu poderia deixá-los \"descobrir\" minhas intenções em relação a [target.GetFirstName] e deixar [target.GetSheHe] sentir que tem a vantagem."
 seduce_ongoing.6031.t:0 "Uma Teia"
 seduce_ongoing.6041.a:0 "#EMP Ah!#!, isso nem é um desafio!"
 seduce_ongoing.6041.b.failure:0 "[target.GetFirstName] evita minhas perguntas."
 seduce_ongoing.6041.b.success:0 "Eu aprendo mais sobre os interesses de [target.GetFirstName]"
 seduce_ongoing.6041.b:0 "Tenho certeza de que posso convencer [target.GetSheHe] a me contar."
 seduce_ongoing.6041.c.failure:0 "[target.GetFirstName] escapa dos meus espiões."
 seduce_ongoing.6041.c.success:0 "Meus espiões têm sucesso."
 seduce_ongoing.6041.c:0 "Meus espiões descobrirão isso rapidamente."
 seduce_ongoing.6041.d:0 "Sabe de uma coisa? Vou simplesmente perguntar."
 seduce_ongoing.6041.desc:0 "Na minha busca pela afeição de [target.GetTitledFirstName], seria muito útil saber exatamente quais são seus gostos e preferências..."
 seduce_ongoing.6041.t:0 "Compreensão Amorosa"
 seduce_ongoing.6042.a:0 "Isso vai me ajudar a conquistar sua afeição."
 seduce_ongoing.6042.desc:0 "Isso é muito interessante... [target.GetFirstName] tem um[Select_CString( target.IsFemale, 'a', '' )] [target.GetWomanMan] de bom gosto."
 seduce_ongoing.6043.a:0 "Isso não é um bom presságio para mim."
 seduce_ongoing.6043.desc:0 "Parece que fui talvez um pouco indelicad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ao me aproximar de [target.GetFirstName]. Agora [target.GetSheHe] se pergunta por que estou tão irracionalmente interessad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] nos objetos de valor [target.GetHerHim]!"
 seduce_ongoing.6051.a:0 "Ah, revigorante!"
 seduce_ongoing.6051.b:0 "Algumas das dicas que você me deu, [target.GetFirstNameNoTooltip]..."
 seduce_ongoing.6051.c:0 "Preciso de mais prática como essa."
 seduce_ongoing.6051.close:0 "Apresentei tudo como uma oportunidade de praticar cortesia diplomática. Tenho certeza de que [target.GetTitledFirstName] pode ver através da minha desculpa, mas [target.GetSheHe] concordou mesmo assim."
 seduce_ongoing.6051.end:0 "\n\nPara qualquer pessoa de fora, nossas trocas de palavras poderiam parecer meras platitudes exigidas pela tradição. No entanto, para nós, a paixão ardente por baixo da superfície de nossas palavras era fogo."
 seduce_ongoing.6051.far:0 "Visitar outra corte é sempre uma desculpa para trocar cortesias diplomáticas. Felizmente, [target.GetTitledFirstName] estava mais do que dispost[Select_CString( target.IsFemale, 'a', 'o' )] a me atender."
 seduce_ongoing.6051.t:0 "O Véu da Cortesia"
 seduce_ongoing.7001.a.tt:0 "#F Você acha que [target.GetFirstNameNoTooltip] tem um lado romântico secreto e prefere amantes ardentes#!"
 seduce_ongoing.7001.a:0 "Seja o mais galante e encantador possível."
 seduce_ongoing.7001.b.tt:0 "#F Você acha que [target.GetFirstNameNoTooltip] é o tipo de pessoa que prefere amantes gentis#!"
 seduce_ongoing.7001.b:0 "Aborde [target.GetFirstNameNoTooltip] com delicadeza – como [Select_CString( target.IsFemale, 'uma amiga', 'um amigo' )]."
 seduce_ongoing.7001.c:0 "Eu só vou esperar a oportunidade certa..."
 seduce_ongoing.7001.desc:0 "Como devo abordar [target.GetTitledFirstName]? [target.GetSheHe|U] parece ser uma pessoa reservada que prefere o silêncio como companhia, pelo menos é assim que [target.GetSheHe] parece ser superficialmente. Quem sabe que tipo de pessoa [target.GetSheHe] é em particular? Será que [target.GetSheHe] é submiss[Select_CString( target.IsFemale, 'a', 'o' )] e dócil ou talvez apaixonad[Select_CString( target.IsFemale, 'a', 'o' )] e ardente?\n\nVou descobrir assim que conseguir romper a exterioridade [target.GetHerHim]. Por enquanto, tenho que decidir como fazer para permanecer em seus pensamentos depois de passarmos um tempo sozinhos."
 seduce_ongoing.7001.t:0 "Atrás dessas camadas"
 seduce_ongoing.7101.a:0 "Não deve demorar até que [target.GetSheHe] corresponda meus sentimentos."
 seduce_ongoing.7101.desc_can_touch_arms:0 "estendo a mão e seguro a mão de [target.GetFirstNamePossessive]."
 seduce_ongoing.7101.desc_cannot_touch_arms:0 "Me pego estendendo a mão para segurar a mão de [target.GetFirstNamePossessive], mas recuo antes que [target.GetSheHe] perceba."
 seduce_ongoing.7101.desc_closing:0 "Eu revelo meus sentimentos por [target.GetFirstNameNoTooltip] e declaro meu amor incondicional por [target.GetSheHe]. \n\n\"Nem mesmo em meus sonhos mais loucos poderia imaginar que você era tão apaixonad[Select_CString( owner.IsFemale, 'a', 'o' )], [owner.GetFirstNameNoTooltip]!\" [target.GetSheHe|U] exclama enquanto se abana desesperadamente.\n\nEmbora [target.GetSheHe] não responda às minhas palavras de maneira semelhante, tenho certeza de que o tom avermelhado em suas orelhas se deve a [target.GetSheHe] estar corando ferozmente diante de minhas palavras ousadas."
 seduce_ongoing.7101.desc_opening:0 "Consegui um momento a sós com [target.GetTitledFirstName]. Eu aguardo o momento certo, equilibrando elogios e conversa. Então, assim que o clima certo se instala, "
 seduce_ongoing.7102.a:0 "Devo repensar minha abordagem..."
 seduce_ongoing.7102.desc:0 "Tento criar uma oportunidade para um momento íntimo com [target.GetTitledFirstName], mas o clima romântico não vem naturalmente com [target.GetSheHe]. Mesmo com minha falta de sucesso, decidi ir em frente, apesar da atmosfera não estar perfeita. Me aproximo para sussurrar doces palavras no ouvido [target.GetHerHim], mas antes que eu possa dizer algo, [target.GetFirstNameNoTooltip] recua como se tivesse sido queimad[Select_CString( target.IsFemale, 'a', 'o' )] por algo e sai apressadamente.\n\nNão tenho certeza se essa reação é devido à inexperiência, repulsa ou timidez. No entanto, sei que as coisas poderiam ter sido melhores."
 seduce_ongoing.7201.desc:0 "\"Gostaria de conhecê-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] melhor.\"\n[target.GetTitledFirstName] parece tens[Select_CString( target.IsFemale, 'a', 'o' )] no começo, mas relaxa com o tempo, à medida que [target.GetSheHe] começa a acreditar que não há motivo oculto por trás do meu pedido.\n\nAntes de nos despedirmos, agradeço a [target.GetFirstNameNoTooltip] pelo tempo adorável e [target.GetSheHe] tenta retribuir meu sorriso com um sorriso vacilante. Embora o tempo gasto não seja nada memorável, não há como negar que nunca vi [target.GetFirstNameNoTooltip] sorrir tanto em um único dia. Tenho certeza de que [target.GetFirstNameNoTooltip] vai pensar em mim por muito tempo."
 seduce_ongoing.7202.desc:0 "Conseguir um momento a sós com [target.GetTitledFirstName] não foi difícil. No entanto, descubro que a parte desafiadora é ter uma conversa normal com [target.GetSheHe]. Eu faço uma pergunta e [target.GetSheHe] responde com a resposta mais breve que pode pensar apenas para encerrar nossa conversa. É como arrancar um número infinito de dentes!"
 seduce_ongoing.7202.desc_animal:0 "\n\nNão consigo deixar de pensar que teria uma resposta melhor do(a) [ROOT.Char.Custom('GetAnimalType')] morto do que de [target.GetFirstNameNoTooltip]."
 seduce_ongoing.failure.rejection:0 "Não, não e nunca, [owner.GetFirstNameNoTooltip]."
 seduce_ongoing.gift_selection.decline:0 "Talvez não."
 seduce_ongoing.gift_selection.embroidery:0 "Uma tapeçaria com o brasão da casa [target.GetHerHim]."
