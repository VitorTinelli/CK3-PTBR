l_spanish:
 seduce_outcome.0001.a.tt:0 "Eu sigo em frente com minha tentativa de seduzir [target.GetTitledFirstName]"
 seduce_outcome.0001.a:0 "[target.GetFirstNameNoTooltip] será [Select_CString( target.IsFemale, 'minha', 'meu' )]!"
 seduce_outcome.0001.b:0 "Não posso arriscar ser [Select_CString( ROOT.Char.IsFemale, 'descoberta', 'descoberto' )]."
 seduce_outcome.0001.desc:0 "As reações de [target.GetTitledFirstNamePossessive] às minhas investidas me dizem tudo o que preciso saber. Chegou a hora de colocar meu plano em ação.\n\n"
 seduce_outcome.0001.negative.consequence.desc:0 "[discoverer.Custom2('NamePossessiveCharacterIntroduction', target)|U] e os agentes de [discoverer.GetHerHis] podem estar espreitando em qualquer sombra, ouvindo através de qualquer parede..."
 seduce_outcome.0001.negative.desc:0 "No entanto, temo as consequências. [discoverer.Custom2('NamePossessiveCharacterIntroduction', target)|U] e seus agentes podem estar escondidos em qualquer sombra, escutando através de qualquer parede..."
 seduce_outcome.0001.no_discoverer.consequence.desc:0 "$seduce_outcome.0001.negative.desc$"
 seduce_outcome.0001.positive.consequence.desc:0 "[discoverer.Custom2('NamePossessiveCharacterIntroduction', target)] está sempre a vigiar..."
 seduce_outcome.0001.positive.desc:0 "Acho que minhas chances são boas, mas devo me lembrar que [discoverer.Custom2('NamePossessiveCharacterIntroduction', target)] está sempre observando..."
 seduce_outcome.0001.t:0 "Agora ou nunca"
 seduce_outcome.0003.a.failure:0 "Vou manter [owner.GetSheHe] próximo. #EMP Muito#! próximo."
 seduce_outcome.0003.a.success:0 "Eu quero viver para sempre nesse fogo!"
 seduce_outcome.0003.a.tt:0 "[owner.GetShortUIName|U] pode se tornar [Select_CString( owner.IsFemale, 'minha', 'meu' )] amante"
 seduce_outcome.0003.b.failure:0 "Uma distração para esta noite, nada mais."
 seduce_outcome.0003.b.success:0 "Este é um romance que arderá intensamente, mas será breve."
 seduce_outcome.0003.c:0 "Que doce... mas não."
 seduce_outcome.0003.d:0 "Nunca! O mundo conhecerá a natureza pervertida [owner.GetHerHim]."
 seduce_outcome.0003.e.tt:0 "Ninguém tentará me seduzir por #V 10#! anos"
 seduce_outcome.0003.e:0 "[Select_CString( ROOT.Char.IsFemale, 'Cansada', 'Cansado' )] desses jogos. Deixem-me em paz, todos vocês!"
 seduce_outcome.0003.failure.desc:0 "Onde quer que eu vá, [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] certamente me segue. Aquele olhar em seus olhos, as palavras em seus lábios... Eu sei exatamente o que ele está buscando."
 seduce_outcome.0003.success.desc:0 "[owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] entrou em minha vida com palavras doces e toques ainda mais doces. À noite, tenho dificuldade em tirá-lo de meus pensamentos...\n\nOs sentimentos ardentes entre nós em breve se transformarão em chamas ou se apagarão."
 seduce_outcome.0003.t:0 "Uma Proposta Sensual"
 seduce_outcome.0004.a:0 "Sou a pessoa mais sortuda do mundo!"
 seduce_outcome.0004.desc:0 "Enquanto olho para baixo, vejo [Select_CString( target.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target') )], [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('target'))] [target.GetTitledFirstName], dormindo em meus braços, e me encontro sorrindo de satisfação e felicidade.\n\nPensar que [target.GetSheHe] corresponde ao afeto e devoção que sinto!"
 seduce_outcome.0004.t:0 "Meu [target.Custom('LoverPetName_uppercase')]"
 seduce_outcome.0005.a:0 "Se ao menos eu tivesse conquistado seu afeto mais cedo!"
 seduce_outcome.0005.desc:0 "Com a morte d[Select_CString( target.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target') )] [target.GetTitledFirstName], meus planos para nosso futuro já não importam.\n\nO que quer que tenha existido antes, agora está morto."
 seduce_outcome.0005.t:0 "Tragicamente Interrompido"
 seduce_outcome.2000.a:0 "[target.GetSheHe|U] possui a chave do meu reino."
 seduce_outcome.2000.b:0 "Recebi minha bênção."
 seduce_outcome.2000.desc:0 "Enquanto nos encontramos em segredo, o Sumo Pontífice e eu, meu ser é preenchido por um desejo mais carnal do que espiritual. Certamente, ninguém antes de mim recebeu a bênção de sua Santidade dessa maneira.\n\nSua mão se estende, fecho meus olhos e me ajoelho..."
 seduce_outcome.2000.t:0 "A Bênção Secreta"
 seduce_outcome.2010.a:0 "Oh, que isso dure para sempre!"
 seduce_outcome.2010.b:0 "Doce esquecimento, abrace-me."
 seduce_outcome.2010.desc:0 "Chego aos aposentos de [target.GetNamePossessive] com duas sedes, e trago muito vinho para saciar a primeira delas. É instantaneamente óbvio que [target.GetSheHe] está da mesma mente que eu.\n\nO primeiro beijo sela o acordo, e então passamos o dia e a noite bebendo, amando, bebendo, amando..."
 seduce_outcome.2010.t:0 "In Vino Voluptas"
 seduce_outcome.2020.a:0 "Devemos fazer isso de novo, mas talvez em outro lugar..."
 seduce_outcome.2020.b:0 "Vá ao banheiro para alívio, eu sempre digo."
 seduce_outcome.2020.desc:0 "O compartimento é um espaço pequeno, e o ar cheira a coisas desagradáveis recentemente depositadas. Mas é privativo, ah, tão privativo...\n\n[target.GetName] me olha famintamente, tirando suas vestes. Faço o mesmo e, enquanto nos beijamos, uma onda de luxúria nos faz esquecer tanto o desconforto espacial quanto a vista e os cheiros sombrios ao nosso redor."
 seduce_outcome.2020.t:0 "Assuntos Íntimos"
 seduce_outcome.2030.a.desc:0 "Comida. Eu sei que [target.GetSheHe] gosta, e eu trouxe bastante. Ao acenar com minha mão, [target.GetSheHe] obedientemente tira suas roupas e se deita. Eu preparo o cenário, colocando queijo, frutas, mel. N[target.GetSheHe], ao lado [target.GetHerHim]. "
 seduce_outcome.2030.a:0 "Que tenhamos muitos mais momentos como este!"
 seduce_outcome.2030.alcohol.desc:0 "Em seguida, uma rica libação de vinho sobre o peito [target.GetHerHim]."
 seduce_outcome.2030.b.desc:0 "\n\nUm beijo, um toque — logo ambos estamos envolvidos em prazer. Enquanto o gosto e o cheiro do corpo [target.GetHerHim] se misturam com o da comida, eu fecho os olhos e rio — esta é uma vida doce!"
 seduce_outcome.2030.b:0 "Que refeição compartilhada!"
 seduce_outcome.2030.t:0 "Fome Carnal"
 seduce_outcome.2040.a:0 "Mais uma vez!"
 seduce_outcome.2040.b:0 "Após tomar o castelo, eu me retiro."
 seduce_outcome.2040.desc:0 "À medida que as sombras se alongam, encontro [target.GetTitledFirstName] na escuridão sob a parede do castelo, esperando por mim.\n\n[target.GetSheHe|U] vem em minha direção, hesitante a princípio, depois ansios[Select_CString( target.IsFemale, 'a', 'o' )]. Ouço a respiração [target.GetHerHim] acelerar quando [Select_CString( target.IsFemale, 'a', 'o' )] puxo para perto. À sombra da parede, fazemos amor, os guardas patrulhando acima, alheios à nossa paixão..."
 seduce_outcome.2040.t:0 "Até a Brecha"
 seduce_outcome.2050.a:0 "Um laço para durar para sempre!"
 seduce_outcome.2050.b:0 "Uma noite de maravilha, mas não podemos nos encontrar assim novamente."
 seduce_outcome.2050.desc:0 "Nos encontramos à noite, clandestinamente, protegidos dos olhos e ouvidos do mundo exterior. Eu fiz uma promessa a [target.GetSheHe]: 'Vamos nos casar, verdadeiramente, mas em segredo. Ninguém saberá, apenas nós dois. Um casamento puro, superior ao que a convenção nos impôs!'\n\n[target.GetSheHe|U] acena em concordância, a emoção deixando [target.GetSheHe] sem fôlego. Então, sob o manto protetor da noite, consumamos nossos votos secretos..."
 seduce_outcome.2050.t:0 "Votos Secretos"
 seduce_outcome.2301.a.tt:0 "#F E de novo, e de novo, e de novo...!#!"
 seduce_outcome.2301.a:0 "Oh [target.GetFirstNameNoTooltip], meu [target.Custom('LoverPetName')], vamos nos encontrar novamente!"
 seduce_outcome.2301.b:0 "[target.GetSheHe|U] realmente sabia como agradar um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan]."
 seduce_outcome.2301.desc:0 "Um arrepio de antecipação percorre minha espinha enquanto encontro o caminho para os aposentos de [target.GetTitledFirstNamePossessive]. Assim que [target.GetSheHe] abre a porta, [target.GetSheHe] [target.Custom('quirk_pos_present')], sorri [target.Custom('quirk_pos_adverb')], e me puxa para dentro com um aperto em minha [ROOT.Char.Custom('GetUpperClothingArticle')].\n\nEnquanto os braços [target.GetHerHim] me envolvem, o fogo em meu peito irrompe em chamas, e o resto da noite é passado em um caloroso e ardente nevoeiro."
 seduce_outcome.2301.t:0 "Nos Aposentos [target.GetHerHim|U]"
 seduce_outcome.2302.a:0 "Por você, eu faria esta jornada cem vezes!"
 seduce_outcome.2302.b:0 "Foi tão doce quanto foi fugaz."
 seduce_outcome.2302.desc_court_owner:0 "\"Você veio todo esse caminho por mim, meu [ROOT.Char.Custom('LoverPetName')]?\"\n\nDepois de procurar pelos corredores de [target.Custom('ResidenceBuilding')] d[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstNamePossessive], vestid[Select_CString( target.IsFemale, 'a', 'o' )] com trajes de criado para evitar ser notad[Select_CString( target.IsFemale, 'a', 'o' )], encontro [target.GetSheHe] em um jardim isolado."
 seduce_outcome.2302.desc_end:0 "[target.GetSheHe|U] se ilumina ao me ver, e a visão [target.GetHerHim] me ilumina também.\n\nAs vestes velhas que eu havia vestido logo são esquecidas no chão enquanto passamos a noite toda garantindo que minha jornada valeu o esforço!"
 seduce_outcome.2302.desc_not_court_owner:0 "\"Você veio todo esse caminho por mim, meu [ROOT.Char.Custom('LoverPetName')]?\"\n\nDepois de procurar pelos corredores de [target.Custom('ResidenceBuilding')] d[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstNamePossessive], vestid[Select_CString( target.IsFemale, 'a', 'o' )] com trajes de criado para evitar ser notad[Select_CString( target.IsFemale, 'a', 'o' )], encontro [target.GetFirstName] em um jardim isolado."
 seduce_outcome.2302.t:0 "Em Qualquer Outra Corte"
 seduce_outcome.2303.a:0 "Quem sou eu para negar qualquer coisa a um[Select_CString( target.IsFemale, 'a', '' )] [target.GetWomanMan] tão eloquente?"
 seduce_outcome.2303.b:0 "Certamente gostei do diálogo, mas a conversa acabou."
 seduce_outcome.2303.desc:0 "\"[ROOT.Char.Custom2('ComplimentSentence', SCOPE.sC('target'))|U].\"\n\n\"Eu nunca me cansarei do seu sorriso [owner.Custom('quirk_pos_adjective')],\" responde [target.GetTitledFirstName], corando, \"nem do seu abraço.\"\n\nAs adorações murmuradas que compartilhamos logo se tornam incompreensíveis, mas o que as substitui fala uma linguagem ainda mais clara."
 seduce_outcome.2303.t:0 "Sussurros do Coração"
 seduce_outcome.2304.a:0 "Para nós estarmos juntos é natural!"
 seduce_outcome.2304.b:0 "Unir-se apenas para se separar — é tudo parte da vida."
 seduce_outcome.2304.desc:0 "[target.GetTitledFirstName] e eu agachamos lado a lado, [ROOT.Char.Custom('GetAnimalType')] [ROOT.Char.Custom('GetAnimalAdjective')] à nossa frente, sem perceber nossa presença. Minha atenção é inabalável, especialmente quando o [target.Custom('GetClothingArticle')] de [target.GetFirstNamePossessive] encosta em mim. Quando me aproximo para abraçá-la, percebo que [target.GetSheHe] também tinha a atenção #EMP em outro lugar#!.\n\nQuando um(a) [ROOT.Char.Custom('GetAnimalType')] desaparece na [ROOT.Char.Custom('TerrainType')], nossa carne nua já está acolhida pela terra macia, assim como uma a outra."
 seduce_outcome.2304.t:0 "Sob o Céu Aberto"
 seduce_outcome.2305.a:0 "Minhas ações responderão às palavras [target.GetHerHim]!"
 seduce_outcome.2305.a_amazing:0 "#F O fogo que [target.GetSheHe] acendeu com sua prosa só pode ser saciado em seu abraço!#!"
 seduce_outcome.2305.a_great:0 "#F Um autor tão eloquente merece ser recompensado!#!"
 seduce_outcome.2305.a_okay:0 "#F E compensar pelo que eles estavam faltando!#!"
 seduce_outcome.2305.a_terrible:0 "#F Ou melhor, o significado por trás das palavras — esse poema foi terrível!#!"
 seduce_outcome.2305.b:0 "Nossa união será tão singular quanto o poema [target.GetHerHim]."
 seduce_outcome.2305.desc_ending:0 "\"\n\nAssim que li a carta enviada por [target.GetTitledFirstName], estou a caminho de seus aposento."
 seduce_outcome.2305.desc_opening:0 "\"[letterAuthor.Custom2('love_letter', SCOPE.sC('love_letter_target'))]"
 seduce_outcome.2305.t:0 "A Carta de Amor"
 seduce_outcome.2306.a:0 "Assim como fomos unidos no casamento, agora estamos unidos em coração!"
 seduce_outcome.2306.b:0 "Os laços do casamento são suficientes."
 seduce_outcome.2306.desc:0 "Os criados foram enviados embora, e nossa cama foi decorada com [SCOPE.Custom('SeductionObjectMultiple')]. À medida que [target.GetTitledFirstName] entra em nossos aposentos, [target.GetSheHe] sorri [target.Custom('quirk_pos_adverb')] e se junta a mim sem hesitação.\n\nCom a ajuda de mãos, bocas e membros, reafirmamos a devoção que juramos perante [ROOT.Char.GetFaith.HighGodName] — talvez de uma forma mais carnal do que se pretendia."
 seduce_outcome.2306.t:0 "[Select_CString( target.IsFemale, 'Minha Amada', 'Meu Amado' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))|U]"
 seduce_outcome.2307.a:0 "Me beije novamente, m[Select_CString( target.IsFemale, 'inha', 'eu' )] [target.Custom2('InsultNoun', ROOT.Char)] [target.Custom2('InsultAdjective', ROOT.Char)]"
 seduce_outcome.2307.b:0 "Me deixe em paz, [target.Custom2('InsultNounSexual', ROOT.Char)]."
 seduce_outcome.2307.desc:0 "À medida que me aproximo de [target.GetTitledFirstName], não sei se quero rasgar as roupas do corpo [target.GetHerHim] ou socar o sorriso [target.Custom('quirk_neg_adjective')] em seu rosto. [target.GetSheHe|U] me beija — um desafio — e eu a puxo para mais perto — uma resposta adequada.\n\nOs sentimentos guerreiros em meu peito são ecoados por nossos corpos; passamos a noite entregando tanto insulto quanto êxtase um ao outro."
 seduce_outcome.2307.t:0 "[Select_CString( target.IsFemale, 'Minha', 'Meu' )] Amante [target.Custom2('InsultAdjective', ROOT.Char)|U]"
 seduce_outcome.2308.a:0 "O amor de um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [target.Custom2('RelationToMeShort', ROOT.Char)] por s[Select_CString( target.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))] não pode estar errado!"
 seduce_outcome.2308.b:0 "[target.GetSheHe|U] não será nada além [Select_CString( target.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))]."
 seduce_outcome.2308.desc_illigal:0 "Enquanto m[Select_CString( target.IsFemale, 'inha', 'eu' )] [target.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))] [target.GetTitledFirstName] sorri [target.Custom('quirk_pos_adverb')], fica difícil lembrar que a atração que sinto é mal vista.\n\nE então — enquanto [target.GetSheHe] puxa minha [ROOT.Char.Custom('GetUpperClothingArticle')] e deixa suas mãos vagarem — percebo que não me importo."
 seduce_outcome.2308.desc_not_illigal:0 "Enquanto m[Select_CString( target.IsFemale, 'inha', 'eu' )] [target.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))] [target.GetTitledFirstName] sorri [target.Custom('quirk_pos_adverb')], eu abandono qualquer pretensão de restrição. Rasgando [ROOT.Char.Custom('GetUpperClothingArticle')] [target.GetHerHim], colocando minhas mãos em torno de sua cintura, minha boca em seu pescoço, meu desejo ardente contra o dela...\n\n"
 seduce_outcome.2308.t:0 "[Select_CString( target.IsFemale, 'Minha Amada', 'Meu Amado' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))|U]"
 seduce_outcome.2309.a:0 "Isso foi bom demais para ser apenas uma vez."
 seduce_outcome.2309.desc_ending:0 "[ROOT.Char.Custom2('sex_scene', SCOPE.sC('target'))]"
 seduce_outcome.2309.desc_opening:0 "Encontro m[Select_CString( target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))] [target.GetTitledFirstName] esperando ansiosamente."
 seduce_outcome.2309.t:0 "Ânsias da Paixão"
 seduce_outcome.2900.a:0 "O que acontecerá conosco agora?"
 seduce_outcome.2900.capital.desc:0 "de [capital.GetNameNoTierNoTooltip]"
 seduce_outcome.2900.end.desc:0 "ainda estão desconfortavelmente perto. Antes que alguém me note, desmonto e me escondo atrás de algum [target_liege.Custom('OutdoorsHidingPlace')] à beira da estrada.\n\nMeu coração está batendo como um tambor enquanto a equipe de caça galopa à frente. \"Rápido! [ROOT.Char.GetTitledFirstNameNoTooltip] não pode ter ido muito longe!\""
 seduce_outcome.2900.start.desc:0 "Quando os gritos e os latidos começam, as paredes do [target_liege.Custom('FortifiedBuilding')]"
 seduce_outcome.2900.t:0 "Ira de [target_liege.GetTitledFirstNamePossessiveNoTooltip]"
 seduce_outcome.3000.a:0 "[owner.GetSheHe|U] detém a chave do meu reino."
 seduce_outcome.3000.desc:0 "Ao nos encontrarmos secretamente, o Sumo Pontífice e eu, meu ser é preenchido com um desejo mais carnal do que espiritual. Certamente, ninguém antes de mim recebeu a bênção de sua Santidade dessa maneira.\n\n[owner.GetSheHe|U] estende a mão, fecho os olhos e me ajoelho..."
 seduce_outcome.3010.desc:0 "[owner.GetTitledFirstName] chega aos meus aposentos, evidentemente com duas vontades e trazendo muito vinho para a primeira delas. Leva pouco esforço para mostrar que estou na mesma sintonia que [owner.GetSheHe].\n\nO primeiro beijo sela o pacto e então passamos o próximo dia e noite bebendo, amando, bebendo, amando..."
 seduce_outcome.3020.desc:0 "O sanitário é um espaço pequeno e o ar exala cheiro de coisas desagradáveis que foram depositadas recentemente. Mas é privado, ah, tão privado...\n\nOlho com desejo para [owner.GetTitledFirstName], removendo minhas roupas. [owner.GetSheHe|U] faz o mesmo, e enquanto nos beijamos, uma onda de luxúria se levanta e nos faz esquecer tanto o desconforto espacial quanto as visões e cheiros desagradáveis ao nosso redor."
 seduce_outcome.3030.a.desc:0 "[owner.GetTitledFirstName] chega, trazendo comida — muita comida; ele sabe que eu gosto. [owner.GetSheHe|U] acena com a mão, e eu obedientemente tiro minhas roupas e me deito. [owner.GetSheHe|U] prepara o cenário, colocando queijo, frutas, mel. Em mim, ao meu lado."
 seduce_outcome.3030.alcohol.desc:0 "Em seguida, uma rica libação de vinho sobre meu peito."
 seduce_outcome.3030.b.desc:0 "\n\nUm beijo, um toque — começamos a desfrutar, e logo ambos estamos envoltos em prazer. Enquanto o sabor e o cheiro do corpo [owner.GetHerHim] misturam-se com o da comida, fecho os olhos e rio — esta é uma vida doce!"
 seduce_outcome.3040.desc:0 "Conforme as sombras se alongam, vejo [owner.GetTitledFirstName] se aproximar de mim na escuridão sob a parede do castelo, sorrindo [target.Custom('quirk_pos_adverb')], enquanto [owner.GetSheHe] sussurra: “Você sabe por que estou aqui.”\n\nVou em direção a [owner.GetSheHe], hesitante a princípio, depois ansiosamente. Meu pulso acelera quando [owner.GetSheHe] me puxa para perto. À sombra da parede, fazemos amor, os guardas patrulhando acima alheios à nossa paixão."
 seduce_outcome.3050.desc:0 "Nos encontramos à noite, secretamente, protegidos dos olhos e ouvidos do mundo exterior. [owner.GetSheHe|U] se compromete comigo: \"Vamos nos casar, de verdade, mas em segredo. Ninguém além de nós dois saberá. Um casamento puro, superior ao que a convenção nos impôs!\"\n\nAssinto com a cabeça, emocionado, sem fôlego. Então, sob o manto protetor da noite, consumamos nossos votos secretos..."
 seduce_outcome.3301.a.tt:0 "#F E de novo, e de novo, e de novo...!#!"
 seduce_outcome.3301.a:0 "Oh [owner.GetFirstNameNoTooltip], meu [owner.Custom('LoverPetName')], vamos nos encontrar novamente!"
 seduce_outcome.3301.b:0 "Ess[Select_CString( owner.IsFemale, 'a', 'e' )] [owner.GetTitleTierName] certamente sabe como agradar um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan]."
 seduce_outcome.3301.desc:0 "Um arrepio de antecipação percorre minha espinha quando uma batida ressoa pelo silêncio dos meus aposentos. Será que é #EMP [owner.GetSheHe]#!?\n\nSou cumprimentad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por [owner.GetTitledFirstName], sorrindo [owner.Custom('quirk_pos_adverb')], luxúria evidente em seu rosto. Finalmente! Enquanto os braços [owner.GetHerHim] me envolvem, o fogo em meu peito explode em chamas, e o resto da noite é passado em um caloroso e ardente torpor."
 seduce_outcome.3301.t:0 "Em Meus Aposentos"
 seduce_outcome.3302.a:0 "Nunca mais ficaremos separados por muito tempo!"
 seduce_outcome.3302.desc_court_owner:0 "\"Nada poderia me afastar de você, meu [ROOT.Char.Custom('LoverPetName')] – muito menos a distância!\""
 seduce_outcome.3302.desc_end:0 "\n\nRapidamente, descarto as vestes de serviçais que [owner.GetSheHe] está usando, seguidas por todas as outras roupas. Afinal, quero agradecer [owner.GetFirstName] por ter vindo até aqui!"
 seduce_outcome.3302.desc_not_court_owner:0 "\"Nada poderia me afastar de você, meu [ROOT.Char.Custom('LoverPetName')] – nem mesmo a distância, nem [court_owner.GetTitledFirstName]!\""
 seduce_outcome.3302.desc_opening:0 "Caminhando nos jardins, sou surpreendid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por uma visão mais doce do que qualquer flor: [owner.GetTitledFirstName] vestindo trajes de serviçais e um sorriso [owner.Custom('quirk_pos_adjective')].\n\n"
 seduce_outcome.3303.a:0 "Vamos ter essa conversa repetidas vezes!"
 seduce_outcome.3303.desc:0 "\"[ROOT.Char.Custom2('ComplimentSentence', SCOPE.sC('owner'))|U].\"\n\n\"Eu nunca vou me cansar do seu sorriso [target.Custom('quirk_pos_adjective')],\" [owner.GetTitledFirstName] responde com um rubor, \"nem do seu abraço.\"\n\nAs adorações murmuradas que compartilhamos logo se tornam ininteligíveis, mas o que as substitui fala uma linguagem ainda mais clara."
 seduce_outcome.3303.t:0 "Sussurros do Coração"
 seduce_outcome.3304.a:0 "Estar juntos é apenas natural para nós!"
 seduce_outcome.3304.desc:0 "[owner.GetTitledFirstName] e eu nos agachamos lado a lado, [owner.Custom('GetAnimalType')] [owner.Custom('GetAnimalAdjective')] à nossa frente, sem perceber nossa presença. Minha própria atenção é inabalável — especialmente quando as roupas [owner.Custom('GetClothingArticle')] dele roçam em mim. Quando me aproximo para abraçá-lo, percebo que [owner.GetSheHe] também estava com a atenção #EMP em outro lugar#!.\n\nÀ medida que um(a) [owner.Custom('GetAnimalType')] desaparece na [ROOT.Char.Custom('TerrainType')], nossa pele nua já está envolta pela terra macia, assim como um ao outro."
 seduce_outcome.3305.a:0 "Deixe nossos corpos recitarem poesia juntos, meu [owner.Custom('LoverPetName')]!"
 seduce_outcome.3305.desc:0 "\"[letterAuthor.Custom2('love_letter', SCOPE.sC('love_letter_target'))]\"\n\nO apreço que sinto por [owner.GetFirstName] por ter me escrito um poema como esse é insignificante em comparação com a paixão com a qual agradeço [owner.GetSheHe]."
 seduce_outcome.3306.a:0 "Assim como fomos unidos em casamento, agora estamos unidos em coração!"
 seduce_outcome.3306.desc:0 "Quando volto aos aposentos que compartilho com [owner.GetTitledFirstName], sou recebid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por uma visão inesperada — mas apreciada. Nossa cama foi decorada com [SCOPE.Custom('SeductionObjectMultiple')], e [owner.GetFirstName] [owner.GetHerselfHimself] está deitad[Select_CString( owner.IsFemale, 'a', 'o' )] nela, sorrindo [owner.Custom('quirk_pos_adverb')].\n\nCom mãos, boca e membros, reafirmamos o compromisso que fizemos perante [ROOT.Char.GetFaith.HighGodName] — talvez de forma mais carnal do que o esperado."
 seduce_outcome.3306.t:0 "[Select_CString( owner.IsFemale, 'Minha Amada', 'Meu Amado' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))|U]"
 seduce_outcome.3307.a:0 "Me beije novamente, m[Select_CString( owner.IsFemale, 'inha', 'eu' )] [owner.Custom2('InsultNoun', ROOT.Char)] [owner.Custom2('InsultAdjective', ROOT.Char)]!"
 seduce_outcome.3307.b:0 "Este momento de fraqueza é melhor esquecido."
 seduce_outcome.3307.desc:0 "Conforme [owner.GetTitledFirstName] se aproxima, não sei se devo arrancar as roupas do corpo [owner.GetHerHim] ou dar um soco no sorriso [owner.Custom('quirk_neg_adjective')] em seu rosto. Eu o beijo — um desafio — e [owner.GetSheHe] me puxa para mais perto — uma resposta adequada.\n\nOs sentimentos conflitantes em meu peito são ecoados por nossos corpos; passamos a noite entregando tanto insulto quanto êxtase um ao outro."
 seduce_outcome.3307.t:0 "[Select_CString( owner.IsFemale, 'Minha', 'Meu' )] Amante [owner.Custom2('InsultAdjective', ROOT.Char)|U]"
 seduce_outcome.3308.a:0 "O amor que compartilhamos não pode estar errado!"
 seduce_outcome.3308.desc_illigal:0 "Ao sorrir [owner.Custom('quirk_pos_adverb')] para mim, [owner.GetTitledFirstName] m[Select_CString( owner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))], é difícil lembrar que a atração que sinto é desaprovada.\n\nE então, enquanto [owner.GetSheHe] puxa minha [ROOT.Char.Custom('GetUpperClothingArticle')], permitindo que suas mãos percorram, percebo que não me importo."
 seduce_outcome.3308.desc_not_illigal:0 "Ao sorrir [owner.Custom('quirk_pos_adverb')] para mim, [owner.GetTitledFirstName] m[Select_CString( owner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))], rasgando minhas roupas, me derreto em seus braços. [owner.GetSheHe|U] coloca as mãos em minha cintura, a boca em meu pescoço, o desejo ardente seu contra o meu...\n\n"
 seduce_outcome.3308.t:0 "[Select_CString( owner.IsFemale, 'Minha Amada', 'Meu Amado' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('owner'))|U]"
 seduce_outcome.3309.desc:0 "[ROOT.Char.Custom2('sex_scene', SCOPE.sC('owner'))]"
 seduce_outcome.3309.desc_opening:0 "M[Select_CString( owner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] [owner.GetTitledFirstName] se aproxima de mim com entusiasmo."
 seduce_outcome.3900.a:0 "Isso só pode significar uma coisa!"
 seduce_outcome.3901.desc:0 "Reconheço a expressão ansiosa no rosto de meu servo. [dummy_servant_gender.GetSheHe|U] está aqui para trazer más notícias.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], você deve vir rapidamente! [owner.Custom2('YourCharacterIntroduction', ROOT.Char)|U] foi visto saindo dos aposentos de [target.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)]!\""
 seduce_outcome.3901.t:0 "Uma Serpente na Corte"
 seduce_outcome.3902.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], tenho más notícias! [owner.Custom2('YourCharacterIntroduction', ROOT.Char)|U] acabou de ser visto a sair dos aposentos de [target.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)]!\""
 seduce_outcome.4001.a:0 "Ah... Sim, claro..."
 seduce_outcome.4001.incest.desc:0 "\"Eu gosto de você, [ROOT.Char.GetFirstNameNoTooltip], é verdade,\" [target.GetTitledFirstName] sorri [target.Custom('quirk_pos_adverb')]. \"Mas você é m[Select_CString( owner.IsFemale, 'inha', 'eu' )] #EMP [target.Custom2('RelationToMe', SCOPE.sC('owner') )]#!, e isso é... bem, quem sabe o que o futuro nos reserva.\""
 seduce_outcome.4001.regular.desc:0 "\"Você é [Select_CString( ROOT.Char.IsFemale, 'uma', 'um' )] [ROOT.Char.GetWomanMan] [target.Custom2('ComplimentAdjectiveArticle', ROOT.Char)] [ROOT.Char.GetFirstNameNoTooltip], mas eu não sinto nada além de amizade,\" diz [target.GetTitledFirstName] e [target.Custom('quirk_neg_present')]. \"Apenas [target.GetFaith.HighGodName] sabe o que o futuro nos reserva.\""
 seduce_outcome.4001.t:0 "A Dor da Rejeição"
 seduce_outcome.4002.a:0 "Bem, você é um[Select_CString( target.IsFemale, 'a', '' )]... [target.Custom('InsultNounSexual')]... [target.Custom('InsultAdjective')]!"
 seduce_outcome.4002.desc:0 "Quando entro no aposento de [target.GetTitledFirstName], tarde da noite, não sou recebid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por um doce abraço, mas sim por um[Select_CString( target.IsFemale, 'a', '' )] [target.Custom2('InsultNoun', ROOT.Char)].\n\n\"Eu suportei suas tentativas risíveis de me encantar por educação. Mas isso eu não posso tolerar! Fique longe de mim, s[Select_CString( target.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('InsultNounSexual', SCOPE.sC('target'))] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('target'))]!\""
 seduce_outcome.4003.a.plot:0 "[Select_CString( target.IsFemale, 'A', 'O' )] [target.Custom2('InsultNoun', ROOT.Char)] [target.Custom2('InsultAdjective', ROOT.Char)] irá pagar!"
 seduce_outcome.4003.a.regular:0 "Eu posso ter interpretado mal a empolgação [target.GetHerHim]."
 seduce_outcome.4003.plot.desc:0 "[target.GetTitledFirstName] me recebe com um sorriso travesso, e suas mãos ansiosas imediatamente começam a desabotoar minha roupa. Em poucos instantes, estou nu[Select_CString( ROOT.Char.IsFemale, 'a', '' )] e tremendo diante [target.GetHerHim]. Mas quando tento retribuir o gesto, [target.GetFirstNameNoTooltip] me empurra para longe e grita!\n\n\"Guardas! Há um intruso em meus aposentos! #EMP Guardas!#!\"\n\nNu[Select_CString( ROOT.Char.IsFemale, 'a', '' )] como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] recém-nascid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], eu fujo pelo quarto e rastejo para fora da janela."
 seduce_outcome.4003.regular.desc:0 "Enquanto subia até a janela de [target.GetTitledFirstNamePossessive], o grito chocado [target.GetHerHim] não foi a recepção que eu tinha em mente! Não tenho tempo para detê-l[Select_CString( target.IsFemale, 'a', 'o' )] antes que [target.GetSheHe] corra para a porta e a abra.\n\n\"Ajudem! Guardas! Há um intruso em meus aposentos!\"\n\nAntes que essa noite piore ainda mais, rastejo de volta pelo caminho que vim."
 seduce_outcome.4003.t:0 "Desmascarad[Select_CString( target.IsFemale, 'a', 'o' )]"
 seduce_outcome.4004.a:0 "Por que nos importaríamos? Por favor, abra a porta!"
 seduce_outcome.4004.end.desc:0 "\n\nA porta se abre lentamente, revelando [target.GetFirstName] angustiad[owner.GetTitleGender]. \"Me perdoe, [target.Custom2('RelationToMeShort', ROOT.Char)], mas eu não posso fazer isso. Eu desejo... Não, é muito perigoso!\"\n\nSem palavras, [target.GetSheHe] me beija rapidamente e bate a porta em meu rosto!"
 seduce_outcome.4004.incest.desc:0 "\"M[Select_CString( target.IsFemale, 'inha', 'eu' )] doce [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))], você está aí? Sou eu – [ROOT.Char.GetFirstNameNoTooltip]!\""
 seduce_outcome.4004.sodomy.desc:0 "\"[target.Custom('LoverPetName')|U], você está aí? Sou eu – [ROOT.Char.GetFirstNameNoTooltip]!\""
 seduce_outcome.4004.start.desc:0 "Meu coração bate como um martelo quando eu bato na porta."
 seduce_outcome.4004.t:0 "Um Jogo Perigoso"
 seduce_outcome.4005.a:0 "Hora de partir, eu acho!"
 seduce_outcome.4005.desc:0 "A treliça abaixo da janela de [target.GetTitledFirstNamePossessive] não parece muito resistente, mas nada vai me impedir de saciar meu desejo! No final dessa escalada perigosa, meus dedos seguram a beira da janela [target.GetHerHim].\n\n\"[target.GetFirstNameNoTooltip]! Abra, meu [target.Custom('LoverPetName')]! Sou eu – [ROOT.Char.GetFirstNameNoTooltip]!\" Eu bato nas persianas, mas ninguém responde.\n\n\"Como você ousa chamar m[Select_CString( target.IsFemale, 'inha', 'eu' )] [target_liege.Custom2('RelationToMeShort', SCOPE.sC('target'))] desse jeito, s[Select_CString( target.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('InsultNounSexual', SCOPE.sC('target_liege'))] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('target_liege'))]?\" Eu olho para cima. [target_liege.GetTitledFirstName] está se inclinando para fora da janela acima de mim!"
 seduce_outcome.4100.a:0 "\"Espere, isso não era como deveria ser!\""
 seduce_outcome.4100.desc:0 "Enquanto caminho, avisto [target.GetFirstName] acenando para mim à distância. Dou início a uma perseguição, e após alcançar [target.GetSheHe], nos escondemos para não sermos vistos. Exploramos ansiosamente os corpos um do outro, e sou envolvid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por uma tempestade de beijos apaixonados e suspiros ofegantes. De repente, [target.GetFirstNameNoTooltip] interrompe nosso beijo colocando um dedo sobre meus lábios.\n\n\"Estava divertido,\" diz [target.GetSheHe] com voz descontraída ao se afastar, \"mas eu me cansei desse jogo, é hora de "
 seduce_outcome.4100.desc_fallback:0 "Eu focar nas metas que estabeleci.\""
 seduce_outcome.4100.desc_married:0 "Eu retomar a responsabilidade que tenho como [Select_CString( owner.IsFemale, 'a', 'o' )] [target_spouse.Custom2('RelationToMeShort', target)] de [target_spouse.GetTitledFirstNamePossessive].\""
 seduce_outcome.4900.a.courtier:0 "Por [ROOT.Char.GetFaith.DevilName], você não tem vergonha? Guardas!"
 seduce_outcome.4900.a.family:0 "Como você ousa chamar m[Select_CString( target.IsFemale, 'inha', 'eu' )] [target_liege.Custom2('RelationToMeShort', SCOPE.sC('target'))], s[Select_CString( owner.IsFemale, 'ua', 'eu' )] [owner.Custom2('InsultNounSexual', SCOPE.sC('target_liege'))]?"
 seduce_outcome.4900.desc:0 "Eu estava indo para meus aposentos para desfrutar de um sono abençoado quando ouço um ruído vindo de uma janela. Apenas o vento, eu penso — até que o vento começa a falar.\n\n\"[target.GetFirstNameNoTooltip]! Abra, meu [target.Custom('LoverPetName')]! Sou eu – [owner.GetFirstNameNoTooltip]!\" Eu empurro as persianas, e eis que; um[Select_CString( owner.IsFemale, 'a', '' )] [owner.GetWomanMan] escalou até a janela de [target.GetTitledFirstNamePossessive]! É [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 seduce_outcome.8101.a:0 "Pare com essa loucura! Eu sou [Select_CString( target.IsFemale, 'a sua', 'o seu' )] #EMP [owner.Custom2('RelationToMe', SCOPE.sC('target') )] #! !"
 seduce_outcome.8101.b.tt:0 "Não vou desencorajar [owner.GetFirstNameNoTooltip] de sua busca"
 seduce_outcome.8101.b:0 "Bem, o que é a vida sem alguns indulgências?"
 seduce_outcome.8101.c:0 "O mundo saberá de suas grotescas perversões!"
 seduce_outcome.8101.desc:0 "Não pode mais haver dúvidas. [owner.GetTitledFirstName] – m[Select_CString( owner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner') )] – quer ser mais do que família...\n\n"
 seduce_outcome.8101.desc_negative:0 "Não há fim para a depravação dess[Select_CString( owner.IsFemale, 'a', 'e' )] [ROOT.Char.Custom2('InsultNounSexual', SCOPE.sC('owner'))]?"
 seduce_outcome.8101.desc_neutral:0 "Embora eu tenha grande estima por [owner.GetSheHe], a realização ainda me surpreende."
 seduce_outcome.8101.desc_positive:0 "Embora eu não possa dizer que a ideia nunca tenha passado pela minha cabeça, a realização ainda me surpreende."
 seduce_outcome.8101.t:0 "Amor de [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('owner') )|U]"
 seduce_outcome.8102.a:0 "Eu estava cert[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] de que tínhamos algo especial!"
 seduce_outcome.8102.desc:0 "\"Isso foi longe demais, [target.Custom2('RelationToMe', SCOPE.sC('owner') )]. Eu sou s[Select_CString( target.IsFemale, 'ua', 'eu' )] [owner.Custom2('RelationToMe', SCOPE.sC('target') )] pelo amor de [ROOT.Char.GetFaith.HighGodName]!\"\n\n[target.GetFirstName] [target.Custom('quirk_neg_present')] enquanto [target.GetSheHe] deixa claro seu desdém pelas minhas investidas românticas."
 seduce_outcome.8102.t:0 "A Ferida da Rejeição"
 seduce_outcome.8103.a:0 "Você faria isso com [Select_CString( owner.IsFemale, 'sua própria', 'seu próprio' )] [target.Custom2('RelationToMe', SCOPE.sC('owner') )]?"
 seduce_outcome.8103.desc:0 "\"Você me causa repulsa, [owner.GetFirstNameNoTooltip]. Eu sou s[Select_CString( target.IsFemale, 'ua', 'eu' )] [owner.Custom2('RelationToMe', SCOPE.sC('target') )] pelo amor de [ROOT.Char.GetFaith.HighGodName]! Eu vou revelar suas grotescas perversões, confie nas minhas palavras!\"\n\n[target.GetFirstName] [target.Custom('quirk_neg_present')] enquanto [target.GetSheHe] deixa claro seu desdém pelas minhas investidas românticas."
 seduce_outcome.8103.t:0 "[Select_CString( owner.IsFemale, 'Desprezada e Exposta', 'Desprezado e Exposto' )]"
 seduce_outcome.blocked_from_seduction:0 "Eu não poderei mais tentar seduzir [target.GetTitledFirstName] novamente"
