l_spanish:
 child_learned_language_desc:0 "S[Select_CString( owner.IsFemale, 'ua', 'eu' )] [owner.Custom('GetDaughterSon')] aprendeu a [language|E] [target.GetCulture.GetLanguage.GetName]"
 child_learned_language_fail_desc:0 "S[Select_CString( owner.IsFemale, 'ua', 'eu' )] [owner.Custom('GetDaughterSon')] não conseguiu aprender a [language|E] [target.GetCulture.GetLanguage.GetName]"
 child_learned_language_fail_title:0 "[owner.Custom('GetDaughterSon')|U] falhou em aprender Idioma"
 child_learned_language_invalidated_desc:0 "O [scheme|E] de [GetScheme('learn_language').GetTypeName] de s[Select_CString( owner.IsFemale, 'ua', 'eu' )] filh[Select_CString( owner.IsFemale, 'a', 'o' )] foi invalidado"
 child_learned_language_invalidated_title:0 "O Esquema de Aprender Idioma de Seu Filho foi Invalidado"
 child_learned_language_title:0 "[owner.Custom('GetDaughterSon')|U] Aprende o Idioma!"
 learn_language_outcome.1000.a:0 "Sinto-me realizad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]!"
 learn_language_outcome.1000.b.failure:0 "Minha carta soa como uma zombaria desonesta"
 learn_language_outcome.1000.b.success:0 "Eu impressiono [target.GetFirstNameNoTooltip] com meu conhecimento"
 learn_language_outcome.1000.b:0 "Talvez eu devesse enviar uma carta em [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip] para [target.GetFirstNameNoTooltip]?"
 learn_language_outcome.1000.desc:0 "Depois de muito trabalho árduo, finalmente aprendi o idioma [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName]. Horas intermináveis praticando acentuação, noites sem dormir imitando inflexões, inúmeras lições dominando a entonação... tudo valeu a pena no final.\n\nDurante meus esforços, procurei imitar o sotaque de [target.GetTitledFirstName]. Tenho certeza de que [target.GetSheHe] ficaria impressionado com meus resultados!\n\nE, é claro, os camponeses de [target.GetCulture.GetNameNoTooltip] agora me respeitam muito mais."
 learn_language_outcome.1000.t:0 "$learn_language$: Sucesso!"
 learn_language_outcome.1001.a:0 "[owner.GetSheHe|U] aprendeu [target.GetCulture.GetLanguage.GetNameNoTooltip]? Impressionante, envie minhas saudações!"
 learn_language_outcome.1001.b:0 "Hah! A vã tentativa [owner.GetHerHim|U] de ganhar glória é risível!"
 learn_language_outcome.1001.desc:0 "Estudei o idioma [target.GetCulture.GetLanguage.GetName] por muitos luas. Eu mesm[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] escrevi essa carta usando o alfabeto [target.GetCulture.GetLanguage.GetNameNoTooltip] — uma carta de amizade de um falante de [owner.GetCulture.GetLanguage.GetName]!\n\nEspero que nossas futuras relações diplomáticas nos beneficiem grandemente!"
 learn_language_outcome.1001.opening:0 "[owner.Custom2('AppropriateGreetingPositive', target)]"
 learn_language_outcome.2000.a:0 "Eu admito a derrota... [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip] está além das minhas capacidades."
 learn_language_outcome.2000.b:0 "Não! Preciso começar de novo e fazer certo desta vez."
 learn_language_outcome.2000.c:0 "Bem, pelo menos aprendi algumas cortesias muito eficazes!"
 learn_language_outcome.2000.desc:0 "Depois de muito trabalho árduo... nada! É #EMP impossível#! aprender o idioma [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName]. Não importa o quanto eu tente, falo como uma criança recém-desmamada e escrevo como um servo cego e iletrado que está faltando a maioria dos dedos!\n\nBah! Isso foi uma perda de tempo..."
 learn_language_outcome.2000.t:0 "$learn_language$: Fracasso"
 learn_language_outcome.3000.a:0 "[potential_continuation_target_1.GetTitledFirstNameNoTooltip] tem um belo sotaque!"
 learn_language_outcome.3000.b:0 "Talvez [potential_continuation_target_2.GetTitledFirstNameNoTooltip]? Seu dialeto é interessante."
 learn_language_outcome.3000.c:0 "Pode ser [potential_continuation_target_3.GetTitledFirstNameNoTooltip]?"
 learn_language_outcome.3000.d:0 "Ah, eu estava procurando uma razão para parar de estudar! Viva!"
 learn_language_outcome.3000.desc:0 "Infelizmente, [target.GetTitledFirstName] não está mais por perto. É uma pena, eu estava procurando por [target.GetSheHe] para saber como ajustar meu sotaque ao aprender [target.GetCulture.GetLanguage.GetName].\n\nMas não há necessidade de interromper meus estudos — eu só preciso encontrar outra pessoa para imitar!"
 learn_language_outcome.3000.t:0 "$learn_language$: Continuar Estudos?"
 scheme_loses_half_progress:0 "O [scheme|E] perde metade do seu progresso, mas permanece ativo"
 scheme_retains_progress:0 "O [scheme|E] mantém todo o progresso anterior"
 target_responds:0 "[target.GetTitledFirstName] responde à sua carta"
