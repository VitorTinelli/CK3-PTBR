l_spanish:
 attended_by_tutor_modifier:0 "Assistido por Tutor da Corte"
 carefully_chosen_words_modifier:0 "Palavras Bem Escolhidas"
 court_tutor_child_language_rank_1_modifier:0 "$attended_by_tutor_modifier$"
 court_tutor_child_language_rank_2_modifier:0 "$attended_by_tutor_modifier$"
 court_tutor_child_language_rank_3_modifier:0 "$attended_by_tutor_modifier$"
 court_tutor_child_language_rank_4_modifier:0 "$attended_by_tutor_modifier$"
 court_tutor_child_language_rank_5_modifier:0 "$attended_by_tutor_modifier$"
 easily_read_fables_modifier:0 "Fábulas Fácil de Ler"
 encouraged_by_friend_modifier:0 "Encorajado por um Amigo"
 erotic_novel_connoisseur_modifier:0 "Conhecedor de Novelas Eróticas"
 extra_careful_modifier:0 "Cautela Extra"
 extra_success_chance_modifier:0 "Chance de Sucesso Aumentada"
 gain_artifact_tt:0 "Você adquire o [artifact|E] [newly_created_artifact.GetName]"
 helpful_assistance_modifier:0 "Assistência Prestativa"
 interlocutor_entourage_member:0 "Integrante do Séquito como Interlocutor"
 lauded_loud_reader_modifier:0 "Leitor Barulhento Louvado"
 lauded_loud_reader_modifier_desc:0 "Este personagem divertiu a família com leituras em voz alta \"interessantes\"."
 learn_lang_cult_acceptance_gain_debate:0 "Envolvido em um debate amigável durante a viagem"
 learn_language_ongoing.1000.a:0 "Dedicarei #EMP todo#! o meu tempo a isso!"
 learn_language_ongoing.1000.b:0 "Prefiro gastar meu tempo em outro lugar..."
 learn_language_ongoing.1000.desc:0 "Meu estudo do idioma [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] está progredindo fantasticamente — sinto que tenho toda a concentração e energia do mundo!\n\n\"Meu... nome... é... [fast_learner.GetFirstNameNoTooltip]!\"\n\n\"Eu... gosto... de... comer... [fast_learner.Custom('FavoriteTreatDemand')]!\"\n\nSe eu apenas me #EMP concentrar ainda mais#!, logo falarei fluentemente!"
 learn_language_ongoing.1000.t:0 "$learn_language$: A Facilidade da Juventude"
 learn_language_ongoing.1010.a:0 "...sim, sim, claro que sim! É exatamente o que eu quis dizer!"
 learn_language_ongoing.1010.b:0 "Não, não! Tudo isso é um mal-entendido!"
 learn_language_ongoing.1010.c:0 "Afaste-se, [lover_target.Custom2('InsultNounSexual', ROOT.Char)]. Preciso me concentrar!"
 learn_language_ongoing.1010.desc:0 "\"-e assim, o [ROOT.Char.GetTitleTierName] discutiu [ROOT.Char.Custom('education_conversation_subject')] com o conselho, enquanto o [scheme.GetTarget.GetCouncillorPosition( 'councillor_steward' ).GetPositionName] prosseguiu...\"\n\nEu olho para cima assustado do livro de [scheme.GetTarget.GetCulture.GetLanguage.GetName], apenas para notar um [lover_target.GetFirstName] corado se inclinando sobre mim.\n\n\"Oh MEU, isso é #EMP [scheme.GetTarget.GetCulture.GetLanguage.GetNameNoTooltip]#! que você está falando?\" diz [lover_target.GetSheHe].\n\"Você sabe... [scheme.GetTarget.GetCulture.GetLanguage.GetNameNoTooltip] é a linguagem do amor — e se não entendi errado, você acabou de me chamar de [lover_target.Custom('RomanticComplimentNoun')] [lover_target.Custom('RomanticComplimentAdjective')]? Seu [ROOT.Char.Custom('RomanticComplimentNoun')], seu...!\""
 learn_language_ongoing.1010.t:0 "$learn_language$: Um Mal-entendido Amoroso"
 learn_language_ongoing.1020.a:0 "Se você ajudar, este ouro será seu."
 learn_language_ongoing.1020.b.failure:0 "[chosen_peasant.GetFirstName] fica insultado com sua oferta"
 learn_language_ongoing.1020.b.success:0 "[chosen_peasant.GetFirstName] aceita o acordo"
 learn_language_ongoing.1020.b:0 "Uma mão lava a outra?"
 learn_language_ongoing.1020.c.failure:0 "[language_helper.GetFirstNameNoTooltip] vê através de sua manipulação"
 learn_language_ongoing.1020.c.success:0 "Você convence [language_helper.GetFirstNameNoTooltip] a ajudá-lo"
 learn_language_ongoing.1020.c:0 "Oh, você é #EMP tão altruísta#! oferecendo ajuda a mim, de graça!"
 learn_language_ongoing.1020.d:0 "Obrigado, mas posso me virar sozinho."
 learn_language_ongoing.1020.desc:0 "Parece que meus estudos do idioma [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] chegaram aos ouvidos de [language_helper.GetTitledFirstName]. [language_helper.GetSheHe|U] é um falante nativo, e está oferecendo ajuda em meus estudos.\n\n\"Peço nada mais do que uma recompensa simbólica por meus esforços, [ROOT.Char.GetTitleTierName].\" diz [language_helper.GetSheHe|U], [language_helper.Custom('quirk_pos_pp')]."
 learn_language_ongoing.1020.t_hash_collision:0 "$learn_language$: Ajuda Externa"
 learn_language_ongoing.1030.a:0 "Interessante. Comprarei com prazer."
 learn_language_ongoing.1030.b:0 "Talvez o que você está pedindo seja um pouco... alto demais."
 learn_language_ongoing.1030.c:0 "Um ótimo presente! Guardas, façam [chosen_peasant.GetSheHe] entregar."
 learn_language_ongoing.1030.d:0 "Bobagem! Suma daqui, charlatão!"
 learn_language_ongoing.1030.desc:0 "[chosen_peasant.GetTitledFirstName] se aproxima de mim, [chosen_peasant.Custom('quirk_pos_pp')].\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ouvi dizer que você está estudando o idioma [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName]. Meu pai era um mercador e conseguia aprender qualquer idioma em um piscar de olhos!\" diz [chosen_peasant.GetSheHe].\n\"Os segredos dele estão neste manual. Não tenho utilidade para ele, pois não sei ler. Eu o venderia por uma quantia razoável.\""
 learn_language_ongoing.1030.t:0 "$learn_language$: Um Manual Desgastado"
 learn_language_ongoing.1040.a:0 "Escrevas! Envie uma mensagem de agradecimento."
 learn_language_ongoing.1040.b:0 "A caligrafia de [target.GetFirstNamePossessiveNoTooltip] é interessante..."
 learn_language_ongoing.1040.c:0 "Bah! Eu não preciso de validação de ninguém além de #EMP mim mesmo!#!"
 learn_language_ongoing.1040.desc:0 "[target.GetTitledFirstName], a quem estou me esforçando para emular em minha jornada para aprender o idioma [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName], tem enviado correspondências para mim ultimamente.\n\nRecebi várias cartas onde [target.GetSheHe] elogia meus esforços para aprender seu idioma, chamando-os de respeitáveis e admiráveis!\n\nÉ bom receber reconhecimento pelo meu trabalho árduo!"
 learn_language_ongoing.1040.t:0 "$learn_language$: Admiração"
 learn_language_ongoing.1050.a:0 "Minhas anotações... não! Tanto trabalho, perdido!"
 learn_language_ongoing.1050.b:0 "[sabotage_rival.GetTitledFirstNameNoTooltip] merece #EMP MORRER!#!"
 learn_language_ongoing.1050.c:0 "Ha-Hah! Sempre guardo #EMP cópias das minhas anotações!#!"
 learn_language_ongoing.1050.desc:0 "Minhas preciosas anotações em [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] estão espalhadas por todo o meu estudo, e o corvo encharcado de tinta ainda está #EMP voando por aí#!. Como ele chegou até aqui? #EMP Quem o cobriu de tinta!?#!\n\n\"Uma carta para você, meu [ROOT.Char.GetTitleTierName].\" Eu me viro e pego a mensagem da mão do servo.\n\n\"Uma pena o que aconteceu com suas anotações - mas olhe pelo lado bom, sua escrita já era semelhante a pés de corvo! Cumprimentos, [sabotage_rival.GetTitledFirstName].\""
 learn_language_ongoing.1050.t:0 "$learn_language$: Pés de Corvo"
 learn_language_ongoing.1060.a:0 "Peço mil desculpas! Espero que isso seja suficiente."
 learn_language_ongoing.1060.b.failure:0 "[offended_character.GetFirstNameNoTooltip] percebe a sua mentira"
 learn_language_ongoing.1060.b.success:0 "Você engana [offended_character.GetSheHe] fazendo [offended_character.GetSheHe] pensar que você #EMP elogiou#! s[Select_CString( offended_character.IsFemale, 'ua', 'eu' )] [offended_character.Custom('MotherFather')]"
 learn_language_ongoing.1060.b:0 "Oh, você entendeu errado! Eu chamei [offended_character.GetSheHe] de #EMP [offended_character.Custom('ComplimentAdjective')]#! e um #EMP [offended_character.Custom('RomanticComplimentNoun')]!#!"
 learn_language_ongoing.1060.c:0 "Hah! Sim, eu disse, e [offended_character.GetSheHe] também é #EMP [offended_character.Custom('InsultAdjective')]!#!"
 learn_language_ongoing.1060.d.failure:0 "[offended_character.GetFirstNameNoTooltip] não acredita em você"
 learn_language_ongoing.1060.d.success:0 "Você explica com sucesso que foi um mal-entendido"
 learn_language_ongoing.1060.d:0 "Eu estou apenas praticando meu [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip]! Foi um erro!"
 learn_language_ongoing.1060.desc:0 "\"...o alquimista alcançou o [target.Custom('RandomWeirdObject')] enquanto o [target.Custom('lowly_servant_type')] observava com medo, então-\" de repente sou interrompido por um[Select_CString( offended_character.IsFemale, 'a', '' )] [offended_character.GetTitledFirstName] furioso.\n\n\"Você acabou de chamar [Select_CString( offended_character.IsFemale, 'minha querida', 'meu querido' )] [offended_character.Custom('MotherFather')] de [offended_character.Custom2('InsultNoun', SCOPE.sC('offended_character'))] e [offended_character.Custom2('InsultNounSexual', SCOPE.sC('offended_character'))]!?\" [offended_character.GetSheHe] grita. \"Exijo reparação por esse grave insulto!\"\n\nTalvez meu [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] precise de mais prática..."
 learn_language_ongoing.1060.t:0 "$learn_language$: Perdido na Tradução"
 learn_language_ongoing.1070.a:0 "Guardas, livrem-me deste maldito livro!"
 learn_language_ongoing.1070.b:0 "Você ousa rir de mim?! #EMP Açoitá-los todos.#!"
 learn_language_ongoing.1070.c:0 "Bem, eu suponho que isso #EMP seja#! educacional, de certa forma..."
 learn_language_ongoing.1070.desc:0 "Enquanto leio em voz alta o livro em [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] que [target.GetTitledFirstName] me enviou há algum tempo, percebo um bando de serviçais rindo de mim...\n\n\"Por favor, não pare de ler!\" os serviçais riem.\n\"[ROOT.Char.GetSheHe|U] estava prestes a mostrar o [ROOT.Char.Custom('ObjectifiedFeature')] [ROOT.Char.GetHerHim], precisamos saber se o [ROOT.Char.GetTitleTierName] e o [target.Custom('lowly_servant_type')] acabam juntos, ou se aquel[Select_CString( target.IsFemale, 'a', 'e' )] [target.Custom2('InsultNounSexual', ROOT.Char)] vai separá-los de novo!\"\n\nSerá que estou lendo... #EMP algo obsceno?#! [ROOT.Char.Custom('CulturalCurse')|U]."
 learn_language_ongoing.1070.t:0 "$learn_language$: Literatura Libertina"
 learn_language_ongoing.1080.a:0 "[court_tutor.GetFirstNameNoTooltip], você merece uma recompensa!"
 learn_language_ongoing.1080.b:0 "[court_tutor.GetSheHe|U] está desempenhando bem o seu trabalho."
 learn_language_ongoing.1080.desc:0 "[Select_CString( court_tutor.IsFemale, 'Minha Tutora', 'Meu Tutor' )] da Corte, [court_tutor.GetFirstName], tem me ajudado dia e noite em meus esforços para aprender [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName].\n\nA dedicação [court_tutor.GetHerHim|U] à arte do ensino é inspiradora - não há um dia em que eu não seja apresentado a uma carta em [scheme.GetTarget.GetCulture.GetLanguage.GetNameNoTooltip] para ler, a um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] erudit[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [scheme.GetTargetCharacter.GetCulture.GetNameNoTooltip] para conversar ou a uma extraordinária rima mnemônica.\n\nVerdadeiramente, eu não estaria tão avançado sem a ajuda de [court_tutor.GetFirstNamePossessiveNoTooltip]."
 learn_language_ongoing.1080.t:0 "$learn_language$: Uma Lição Ensinada"
 learn_language_ongoing.1090.a:0 "Sempre posso contar com o apoio de [helpful_friend.GetFirstNameNoTooltip]!"
 learn_language_ongoing.1090.b:0 "Não importa o quão difícil seja, devo perseverar!"
 learn_language_ongoing.1090.c:0 "Preciso de uma pausa..."
 learn_language_ongoing.1090.desc:0 "Aprender [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] é difícil. Muito difícil.\n\nSinto como se não houvesse mais espaço em minha mente, está cheia. Assim que uma palavra entra em minha mente, outra cai no abismo do esquecimento. Luto em cada lição, não estou fazendo nenhum progresso."
 learn_language_ongoing.1090.friend.desc:0 "\n\nFelizmente, [helpful_friend.GetTitledFirstName] está sempre ao meu lado.\n\"Continue assim, [Select_CString( ROOT.Char.IsFemale, 'minha amiga', 'meu amigo' )] [ROOT.Char.Custom('ComplimentAdjective')], eu acredito em você!\" [helpful_friend.GetSheHe] continua dizendo. Sou realmente abençoado."
 learn_language_ongoing.1090.no_friend.desc:0 "\n\nTalvez eu precise de uma pausa?"
 learn_language_ongoing.1090.t:0 "$learn_language$: Sem Espaço Restante"
 learn_language_ongoing.1100.a.failure:0 "Você faz papel de bobo"
 learn_language_ongoing.1100.a.success:0 "Você faz um discurso fantástico"
 learn_language_ongoing.1100.a:0 "Talvez eu devesse fazer um discurso, em #EMP ambos#!, [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip] e [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]?"
 learn_language_ongoing.1100.b:0 "Faça-os me esquecer, não posso me dar ao luxo de distrações."
 learn_language_ongoing.1100.c:0 "Isso é muito afortunado!"
 learn_language_ongoing.1100.desc:0 "Não é segredo que estou me esforçando muito para aprender o idioma [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName], e parece que isso está se tornando conhecido entre o povo comum da [target.GetCulture.GetNameNoTooltip].\n\nEles estão me chamando de 'o [ROOT.Char.GetTitleTierName] que se importa', uma coisa lisonjeira de fato. Até os nobres mais baixos estão louvando meus esforços!\n\nSinto que meus esforços aproximaram os [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] e os [target.GetCulture.GetCollectiveNounNoTooltip]."
 learn_language_ongoing.1100.t:0 "$learn_language$: O [ROOT.Char.GetTitleTierName] que se Importa"
 learn_language_ongoing.1110.a.failure:0 "Você não consegue rimar nem para salvar a própria vida"
 learn_language_ongoing.1110.a.success:0 "Você se descobre bastante talentoso"
 learn_language_ongoing.1110.a:0 "Acho que vou tentar!"
 learn_language_ongoing.1110.b:0 "Talvez eu devesse recitar um poema #EMP romântico#! para [lover_to_be.GetFirstNameNoTooltip]?"
 learn_language_ongoing.1110.c:0 "Não, eu estou #EMP estudando#!, não tenho tempo para atividades frívolas!"
 learn_language_ongoing.1110.desc:0 "Ah, '[target.Custom('RegionalDrink')|U] à Beira do Lago' de [the_poet.GetFirstName] de [poet_location.GetNameNoTierNoTooltip]. Verdadeiramente uma ótima coleção de poesia em [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName].\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\nTalvez eu também devesse tentar escrever poesia?"
 learn_language_ongoing.1110.t:0 "$learn_language$: O Encanto da Poesia"
 learn_language_ongoing.1120.a.failure:0 "Você perde prestígio à medida que sua leitura de fábulas se torna conhecida"
 learn_language_ongoing.1120.a.success:0 "Você engana [insensitive_asshole.GetFirstNameNoTooltip], fazendo-o pensar que as fábulas são obras clássicas"
 learn_language_ongoing.1120.a:0 "Não! Estas são... #EMP clássicos venerados do [target.GetCulture.GetNameNoTooltip]!#! É isso!"
 learn_language_ongoing.1120.b.tt:0 "#V Duelo#! [insensitive_asshole.GetFirstName] para punir [insensitive_asshole.GetSheHe] por sua insolência!\n#weak Este duelo NÃO é até a morte.#!\nSe você vencer, ganhará [prestige_i] [prestige|E] e um [modifier|E] para o [scheme|E]. Se você perder, será ridicularizado.\n\nSua [prowess|E]: [prowess_i]#V [root_for_loc.GetProwess]#!\n[prowess] de [insensitive_asshole.GetFirstNameNoTooltip]: [prowess_i]#V [insensitive_asshole.GetProwess]#!"
 learn_language_ongoing.1120.b:0 "Você ousa me insultar!? Eu vou lhe mostrar!"
 learn_language_ongoing.1120.c:0 "Você está certo. Eles não são adequados para um [ROOT.Char.GetTitleTierName]."
 learn_language_ongoing.1120.d:0 "Deixe as pessoas pensarem o que quiserem. Essas histórias são educativas!"
 learn_language_ongoing.1120.desc:0 "\"O(a) [ROOT.Char.Custom('GetAnimalType')|U] sábio então disse [Select_CString( ROOT.Char.IsFemale, 'à pequena', 'ao pequeno' )] [ROOT.Char.Custom('GirlBoy')] — cuidado, há um...\" de repente sou interrompido.\n\n\"O quê!? O grande [ROOT.Char.GetTitleTierName] está lendo #EMP fábulas infantis!#! Você não tem orgulho?\" [insensitive_asshole.GetTitledFirstName] exclama.\n\"Isto é inaceitável! Se seus inimigos descobrirem, pensarão que você é uma pessoa sem juízo!\"\n\nTalvez minha escolha de literatura em [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] tenha sido um pouco... decepcionante, aos olhos da corte."
 learn_language_ongoing.1120.t:0 "$learn_language$: Fábulas Infantis"
 learn_language_ongoing.1121.trigger_failure:0 "Meu duelo contra [insensitive_asshole.GetFirstNameNoTooltip] foi invalidado"
 learn_language_ongoing.1123.a:0 "Como um(a) [ROOT.Char.Custom('GetAnimalType')] sábio disse uma vez: 'Não insulte seus superiores!'"
 learn_language_ongoing.1123.b:0 "Você vai apodrecer na masmorra por sua insolência!"
 learn_language_ongoing.1123.desc:0 "\"Eu me rendo! Por favor, me perdoe, você não é nada sem juízo! Apenas poupe-me!\" [insensitive_asshole.GetTitledFirstName] exclama.\n\nIsso ensinará [insensitive_asshole.GetSheHe] a não me insultar #EMP assim#!."
 learn_language_ongoing.1123.t:0 "$learn_language_ongoing.1120.t$"
 learn_language_ongoing.1124.a:0 "Um contratempo em meus estudos..."
 learn_language_ongoing.1124.desc:0 "[insensitive_asshole.GetTitledFirstName] cospe perto de onde você está caído no chão.\n\n\"Você é uma pessoa fraca e patética, desculpa para um [ROOT.Char.GetTitleTierName]. Agora eu farei um favor a você e livrarei você desses livros insensatos.\" [insensitive_asshole.GetSheHe] diz."
 learn_language_ongoing.1124.t:0 "$learn_language_ongoing.1120.t$"
 learn_language_ongoing.1130.a.failure:0 "[lover_to_help.GetFirstNameNoTooltip] acha apropriado #EMP começar#! suas lições com palavras como 'terpsichorean', 'transmogrify' e 'lugubrious'"
 learn_language_ongoing.1130.a.success:0 "[lover_to_help.GetFirstNameNoTooltip] é um b[Select_CString( lover_to_help.IsFemale, 'oa', 'om' )], embora um pouco sedutor[Select_CString( lover_to_help.IsFemale, 'a', '' )], professor[Select_CString( lover_to_help.IsFemale, 'a', '' )]"
 learn_language_ongoing.1130.a:0 "Aceito qualquer ajuda que eu possa obter!"
 learn_language_ongoing.1130.b:0 "Como se diz: \"Encontre-me em meu aposento, nu[Select_CString( lover_to_help.IsFemale, 'a', '' )]?\""
 learn_language_ongoing.1130.c:0 "Obrigado, mas estou me saindo muito bem."
 learn_language_ongoing.1130.desc:0 "\"Oh, [Select_CString( ROOT.Char.IsFemale, 'minha querida', 'meu querido' )] [ROOT.Char.GetFirstNameNoTooltip]! Você realmente está aprendendo meu amado idioma [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName]? Sinto-me tão apreciado, você está fazendo tanto esforço para me entender!\" [lover_to_help.GetTitledFirstName] diz, [lover_to_help.Custom('quirk_pos_pp')].\n\n\"Posso ajudá-lo de alguma forma? Ensiná-lo algumas palavras, talvez?\" [lover_to_help.GetSheHe] diz."
 learn_language_ongoing.1130.t:0 "$learn_language$: Amor Vocabular"
 learn_language_ongoing.1140.a:0 "Você poderia me ajudar a entender essa frase?"
 learn_language_ongoing.1140.b:0 "Gostaria de se juntar às minhas aulas, a partir de agora?"
 learn_language_ongoing.1140.desc:0 "\"Você está aprendendo [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName], vejo — boa escolha, falar isso certamente fortalecerá sua posição como [ROOT.Char.GetTitleTierName].\" exclama [close_one_to_help.GetFirstName] [Select_CString( close_one_to_help.IsFemale, 'minha', 'meu' )] [SCOPE.sC('root_for_loc').Custom2('RelationToMeShort', SCOPE.sC('close_one_to_help'))], [close_one_to_help.Custom('quirk_pos_pp')].\n\n\"Eu falo [target.GetCulture.GetNameNoTooltip] nativamente. Talvez eu possa ser de ajuda, [SCOPE.sC('close_one_to_help').Custom2('RelationToMeShort', SCOPE.sC('root_for_loc'))]?\" [close_one_to_help.GetSheHe] diz."
 learn_language_ongoing.1140.t:0 "$learn_language$: Uma Mão Amiga"
 learn_language_ongoing.1300.a.flavor:0 "Você tenta engajar em uma conversa sobre as semelhanças e diferenças entre [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] e [interlocutor.GetCulture.GetLanguage.GetNameNoTooltip]"
 learn_language_ongoing.1300.a:0 "Vamos simplesmente ter uma conversa agradável."
 learn_language_ongoing.1300.b.failure:0 "Você não consegue se comunicar com [interlocutor.GetFirstNameNoTooltip]"
 learn_language_ongoing.1300.b.flavor:0 "Você tenta engajar [interlocutor.GetFirstNameNoTooltip] em um debate amigável"
 learn_language_ongoing.1300.b.success:0 "Você tem um debate envolvente com [interlocutor.GetFirstNameNoTooltip]"
 learn_language_ongoing.1300.b:0 "Estou me sentindo um tanto #EMP briguento#! hoje..."
 learn_language_ongoing.1300.c:0 "\"Junte-se a nós em nossa jornada para [next_destination.GetNameNoTooltip]!\""
 learn_language_ongoing.1300.desc:0 "Ao passarmos pelo [ROOT.Char.GetCurrentLocation.GetTitle.GetName], um local jubilante se aproxima do meu séquito. O sorriso [interlocutor.GetHerHim] se estende de orelha a orelha. Percebo que [interlocutor.GetSheHe] está oferecendo uma calorosa recepção, mas os aspectos mais detalhados do discurso [interlocutor.GetHerHim] infelizmente se perdem para mim.\n\nSeja como for, afasto meus atentos acompanhantes e retorno a alegre saudação [interlocutor.GetHerHim] — mal posso imaginar uma oportunidade melhor para praticar meu [interlocutor.GetCulture.GetLanguage.GetName]!"
 learn_language_ongoing.1300.t:0 "$learn_language$: Conversa Agradável"
 liege_court_language_scheme_key:0 "[ROOT.GetScheme.GetOwner.GetLiege.GetCourtLanguage.GetName]"
 liege_court_language_scheme_key_no_tt:0 "[ROOT.GetScheme.GetOwner.GetLiege.GetCourtLanguage.GetNameNoTooltip]"
 massive_extra_success_chance_modifier:0 "Aumento Massivo da Chance de Sucesso"
 motivated_by_love_modifier:0 "Motivado pelo Amor"
 outside_help_modifier:0 "Ajuda Externa"
