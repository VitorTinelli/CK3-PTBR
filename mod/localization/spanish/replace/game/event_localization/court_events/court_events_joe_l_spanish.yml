l_spanish:
 best_knight_position_desc:0 "Melhor dos Cavaleiros"
 competing_knight_position_desc:0 "Cavaleiros Competidores"
 court.8001.a.diplomacy:0 "Às vezes, vale a pena ser pego, m[Select_CString( child_1.IsFemale, 'inha', 'eu' )] [child_1.Custom('GirlBoy')]."
 court.8001.a.failure:0 "Você não é útil"
 court.8001.a.intrigue:0 "O truque é não ser pego, m[Select_CString( child_1.IsFemale, 'inha', 'eu' )] [child_1.Custom('GirlBoy')]."
 court.8001.a.learning:0 "Você também pode aprender à distância, m[Select_CString( child_1.IsFemale, 'inha', 'eu' )] [child_1.Custom('GirlBoy')]."
 court.8001.a.lesson_tt:0 "[child_1.GetFirstNameNoTooltip] entende seu ponto"
 court.8001.a.martial:0 "Ah, mas é preciso escolher as batalhas, m[Select_CString( child_1.IsFemale, 'inha', 'eu' )] [child_1.Custom('GirlBoy')]!"
 court.8001.a.stewardship:0 "Conheço um lugar melhor para construir sua grande corte, m[Select_CString( child_1.IsFemale, 'inha', 'eu' )] [child_1.Custom('GirlBoy')]."
 court.8001.a.success:0 "Você transmite um pouco de sabedoria"
 court.8001.b.gardener:0 "Não! #EMP Não#! nos canteiros de flores..."
 court.8001.b.poet:0 "Beleza delicada, sempre esmagada por tolos desajeitados..."
 court.8001.c.gardener_tt:0 "[child_1.GetFirstNameNoTooltip] tem mãos habilidosas para a jardinagem"
 court.8001.c:0 "[child_1.GetFirstNameNoTooltip] ajudará a replantá-las. Todas elas."
 court.8001.d:0 "Como #EMP ousa#! tratar [child_1.GetFirstNameNoTooltip] assim?!"
 court.8001.desc.closing:0 "\n\n[gardener.GetFirstNameNoTooltip] fulmina com o olhar, \"[Select_CString( child_1.IsFemale, 'Essa maldita', 'Esse maldito' )] [child_1.Custom('GirlBoy')] pisoteou #EMP todo#! o meu trabalho árduo, [ROOT.Char.Custom('FormOfAddressForLiege')]! Vai levar #EMP semanas#! para consertar o estrago...\""
 court.8001.desc.diplomacy:0 "\"Eles estavam me perseguindo! Eu nunca perdi um jogo de #EMP pega-pega#!!\""
 court.8001.desc.fallback:0 "\"Eu não fiz nada! Só estava brincando!\""
 court.8001.desc.intrigue:0 "\"Estávamos brincando de esconde-esconde, ninguém teria me encontrado se não fosse por #EMP [gardener.GetSheHe]#!!\""
 court.8001.desc.intro:0 "\"Quantas vezes eu já te disse para ficar #EMP longe#! das #EMP recém-plantadas [ROOT.Char.GetCapitalLocation.Custom('get_region_flower_type_plural')]?!#!\"\n\n[child_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] aparece coberto de pétalas e terra, perseguido pelo meu jardineiro, [gardener.GetTitledFirstName].\n\n[child_1.GetFirstNameNoTooltip] chora,"
 court.8001.desc.learning:0 "\"Eu só estava olhando! Elas estão de uma cor diferente desta vez!\""
 court.8001.desc.martial:0 "\"Eu só estava me escondendo dos soldados... tivemos que emboscá-los para vencer a batalha!\""
 court.8001.desc.stewardship:0 "\"Não foi minha culpa! [gardener.GetSheHe|U] colocou elas em cima do nosso castelinho!\""
 court.8001.e:0 "As crianças podem brincar onde quiserem, [gardener.GetFirstNameNoTooltip]."
 court.8001.t:0 "Pisoteado"
 court.8010.a.equipped_tt:0 "Uma bela arma é forjada para [Select_CString( underequipped.IsFemale, 'a', 'o' )] [underequipped.GetTitledFirstName]"
 court.8010.a.tt:0 "Uma arma de boa qualidade, escolhida p[Select_CString( underequipped.IsFemale, 'ela', 'elo' )] [underequipped.GetTitledFirstName], será forjada para [underequipped.GetSheHe]"
 court.8010.a:0 "M[Select_CString( underequipped.IsFemale, 'inhas', 'eus' )] melhores [underequipped.GetWomenMen] precisam de armas de qualidade!"
 court.8010.c.equipped_tt:0 "[underequipped.GetTitledFirstNameNoTooltip] recebe uma arma"
 court.8010.c:0 "Suponho que eu possa abrir mão de uma das minhas próprias armas..."
 court.8010.d.equipped_tt:0 "[underequipped.GetTitledFirstName] recebe uma espada do arsenal"
 court.8010.d.tt:0 "[underequipped.GetTitledFirstNameNoTooltip] pegará uma espada de qualidade inferior no arsenal"
 court.8010.d:0 "Vá ao arsenal — como todos os outros."
 court.8010.desc.body:0 "\n\n\"Certamente a qualidade é tudo quando se trata de"
 court.8010.desc.bodyguard:0 "\"Como seu guarda-costas, tenho a honra de protegê-lo,"
 court.8010.desc.bodyguard_end:0 "proteger a vida d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]!\""
 court.8010.desc.bold:0 "mas isso é ridículo!\" \n\n[underequipped.GetSheHe|U] desembainha pela metade sua lâmina da bainha, chamando a atenção para suas muitas lascas e buracos. \"Não posso fazer meu trabalho com essa barra desajeitada!"
 court.8010.desc.champion:0 "\"Como seu campeão, tenho orgulho de representá-lo,"
 court.8010.desc.champion_end:0 "agir em nome d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]!\""
 court.8010.desc.intro:0 "Estou desfrutando de um raro momento tranquilo entre conselhos, quando [Select_CString( underequipped.IsFemale, 'a', 'o' )] [underequipped.GetTitledFirstName] me chama de lado. \n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]...\" [underequipped.GetSheHe] começa cuidadosamente,"
 court.8010.desc.knight:0 "Como seu [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')], é meu dever sagrado lutar suas batalhas,"
 court.8010.desc.meek:0 "mas...\" \n\n[underequipped.GetSheHe|U] parece duvidoso por um momento, então faz um gesto fraco, mas exasperado, com a bainha: \"Como supostamente farei meu trabalho com essa coisa velha?"
 court.8010.e:0 "Saia da minha vista, [underequipped.Custom2('InsultNoun', ROOT.Char)] insolente!"
 court.8010.t:0 "Despreparado"
 court.8020.a:0 "Venha querido, [couture_guest.GetSheHe] está apenas nos provocando."
 court.8020.b:0 "Suponho que seja um bom local para investimento..."
 court.8020.d:0 "Ultrapassadas? #EMP UTRAPASSADAS?!#!"
 court.8020.desc:0 "Ocupado em mais um dia na corte, ouço a distintiva voz irritada [Select_CString( couture_spouse.IsFemale, 'da minha', 'do meu' )] [couture_spouse.GetWifeHusband], [couture_spouse.GetTitledFirstName] — [couture_guest.GetTitledFirstName] parece ter provocado [couture_spouse.GetSheHe]. \n\nMe aproximando, vejo meu convidado zombando com arrogância: \"Essas chamadas #EMP modas#! são um constrangimento; seriam adequadas apenas para serviçais e crianças em qualquer corte respeitável do #EMP [couture_guest.GetCulture.GetNameNoTooltip]#!.\"\n\n[Select_CString( couture_spouse.IsFemale, 'Minha', 'Meu' )] [couture_spouse.GetWifeHusband] fica vermelh[Select_CString( couture_spouse.IsFemale, 'a', 'o' )] e exclama: \"Já tive #EMP o bastante#! de você — não me importa se é [Select_CString( couture_guest.IsFemale, 'a', 'o' )] convidado d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]!\" — para grande surpresa d[Select_CString( couture_guest.IsFemale, 'a', 'o' )] [couture_guest.GetFirstNameNoTooltip]. \n\nMe puxando de lado, [couture_spouse.GetFirstNameNoTooltip] lamenta amargamente: \"Ess[Select_CString( couture_guest.IsFemale, 'a', 'e' )] [couture_guest.Custom2('InsultNoun', SCOPE.sC('couture_spouse'))] ingrat[Select_CString( couture_guest.IsFemale, 'a', 'o' )] nunca deixa de nos ridicularizar; ontem meus serviçais ouviram [couture_guest.GetSheHe] chamando nossas tendências de #EMP ultrapassadas!#!\""
 court.8020.t:0 "Ferida Sartorial"
 court.8030.a:0 "Mal posso esperar pela estreia deles!"
 court.8030.b:0 "O maior irá para [Select_CString( child_1.IsFemale, 'a', 'o' )] m[Select_CString( child_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child_1'))], [child_1.GetFirstNameNoTooltip]!"
 court.8030.c:0 "Apenas [Select_CString( child_2.IsFemale, 'a', 'o' )] [child_2.GetFirstNameNoTooltip] merece um garoto tão bom."
 court.8030.d:0 "Ah, tenho esperado por um cachorro tão magnífico!"
 court.8030.desc.body:0 "\n\nPegando o maior deles, [huntmaster.GetTitledFirstNameNoTooltip] reflete: \"Este pode ser o maior cão de sua geração!\""
 court.8030.desc.intro:0 "À medida que [Select_CString( huntmaster.IsFemale, 'a', 'o' )] [huntmaster.GetTitledFirstName], m[Select_CString( huntmaster.IsFemale, 'inha', 'eu' )] mestre de caça, entra na sala, um grupo de cortesãos cooando desce sobre [huntmaster.GetSheHe]. \n\nQuando [huntmaster.GetSheHe] finalmente consegue passar, a causa do alvoroço fica clara: embalados em seus braços, há um cobertor cheio de filhotes se contorcendo, uma espécie de [ROOT.Char.Custom('get_region_dog_type')] pelo que parecem — e muito impressionantes também! \n\nMeu $master_of_hunt_court_position$ sorri amplamente: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], eu simplesmente tinha que lhe mostrar essa ninhada; uma vez que esses cãezinhos cresçam e sejam treinados, arrisco dizer que eles serão a inveja de todo grupo de caça [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]!\" \n\n"
 court.8030.desc.one:0 "Não posso deixar de notar m[Select_CString( child_1.IsFemale, 'inha', 'eu' )] [child_1.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child_1'))], [child_1.GetFirstNameNoTooltip], se esforçando para ter uma boa visão dos cachorrinhos."
 court.8030.desc.two:0 "De canto de olho, vejo dois dos meus filhos, [child_1.GetFirstName] e [Select_CString( child_2.IsFemale, 'a', 'o' )] [child_2.GetFirstName], claramente encantados pelos filhotes, principalmente pelo maior de todos."
 court.8030.t:0 "Um Punhado de Cachorros"
 court.8040.a:0 "Sim, sim, [courtier_1.GetTitledFirstNameNoTooltip]... [worst_title.GetNameNoTierNoTooltip] é s[Select_CString( courtier_1.IsFemale, 'ua', 'eu' )]."
 court.8040.b:0 "Este jogozinho pode acabar: [worst_title.GetTierAsNameNoTooltip] é d[Select_CString( courtier_2.IsFemale, 'a', 'o' )] [courtier_2.GetFirstNameNoTooltip]!"
 court.8040.c:0 "Você aí! [courtier_3.GetTitledFirstNameNoTooltip]? O título é seu!"
 court.8040.d.courtier_1_tt:0 "[courtier_1.GetFirstNameNoTooltip] quer mais"
 court.8040.d.courtier_2_tt:0 "[courtier_2.GetFirstNameNoTooltip] é [Select_CString( courtier_2.IsFemale, 'a', 'o' )] últim[Select_CString( courtier_2.IsFemale, 'a', 'o' )] [courtier_2.GetWomanMan] de pé"
 court.8040.d.courtier_3_tt:0 "[courtier_3.GetFirstNameNoTooltip] sai por cima"
 court.8040.d.flavor_tt:0 "\"Ao mais forte\""
 court.8040.d:0 "Eu sei o que vocês estão tramando! É hora de provar o seu valor!"
 court.8040.desc.ambitious:0 "[ambitious.GetName], ambicioso ávido por poder;"
 court.8040.desc.arrogant:0 "presunçoso [arrogant.GetName] — cabeça erguida;"
 court.8040.desc.body:0 "e surpreendentemente ausente: um pingo de humildade. \n\nSobre o burburinho dos cortesãos cochichando, consigo claramente distinguir as palavras: '[worst_title.GetTierAsNameNoTooltip]' e '[worst_title.GetNameNoTier]' — em um tom que tenho certeza que foi d[Select_CString( button.IsFemale, 'a', 'o' )] [button.GetFirstNameNoTooltip]. \n\nO trio sem vergonha vira na minha direção, e os encaro com desprezo."
 court.8040.desc.generic_1:0 "[ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('generic_1'))] [generic_1.GetName] — apenas feliz em estar envolvido;"
 court.8040.desc.generic_2:0 "[ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('generic_2'))] [generic_2.GetName] — como os guardas chamam [generic_2.GetSheHe];"
 court.8040.desc.generic_3:0 "[ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('generic_3'))] [generic_3.GetName] — um subordinado eminente e facilmente esquecível;"
 court.8040.desc.gentry:0 "[gentry.GetName] altivo — o privilegiado [gentry.GetHouse.GetName];"
 court.8040.desc.intro:0 "Três dos meus cortesãos estão discutindo abertamente o 'grande número' de títulos que possuo, deliberadamente perto o suficiente para serem ouvidos, lamentando em voz alta como deve ser cansativo para [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip] gerenciar tantas propriedades [ROOT.Char.GetHerselfHimself]... \n\nEles são como cúmplices:"
 court.8040.desc.knight:0 "[knight.GetName], meu distinto [ROOT.Char.Custom('MountedWarriorTerm')|U];"
 court.8040.desc.lowborn:0 "[lowborn.GetName], um autodidata que agarra qualquer oportunidade;"
 court.8040.desc.position_holder:0 "[position_holder.GetName], fiel servo da corte;"
 court.8040.desc.relative:0 "[relative.GetName], m[Select_CString( relative.IsFemale, 'inha', 'eu' )] parente e [relative.GetWomanMan] com direitos;"
 court.8040.e.courtier_1_tt:0 "[courtier_1.GetFirstNameNoTooltip] é [Select_CString( courtier_1.IsFemale, 'a', 'o' )] mais convincente"
 court.8040.e.courtier_2_tt:0 "[courtier_2.GetFirstNameNoTooltip] impressiona com sua eloquência"
 court.8040.e.courtier_3_tt:0 "[courtier_3.GetFirstNameNoTooltip] fala bem"
 court.8040.e:0 "Cada um de vocês, me diga por que merece um título."
 court.8040.f:0 "O que você está olhando?"
 court.8040.grant_tt:0 "[new_noble.GetTitledFirstNameNoTooltip] recebe [worst_title.GetNameNoTierNoTooltip]"
 court.8040.t:0 "Pretensões Aristocráticas"
 court.8050.a.tt:0 "[servant.GetFirstNameNoTooltip] se juntará à sua [court|E]"
 court.8050.a:0 "Obrigado pelo seu serviço."
 court.8050.b.tt:0 "Você descobrirá um segredo de outra pessoa na corte"
 court.8050.b.tt_secret:0 "Segredo d[Select_CString( vassal_2.IsFemale, 'a', 'o' )] [vassal_2.GetTitledFirstName]"
 court.8050.b:0 "O que mais você ouviu?"
 court.8050.c.tt:0 "Seu [spymaster|E] terá mais chances de interromper tramas enquanto esse modificador estiver presente"
 court.8050.c:0 "Leve isso — você reportará apenas a mim."
 court.8050.d.tt_imprison:0 "[servant.GetFirstNameNoTooltip] é jogado nas masmorras"
 court.8050.d:0 "Prenda esse espião furtivo!"
 court.8050.desc:0 "Inicialmente, pensei que fossem apenas peculiaridades, mas está claro que um dos muitos criados da corte tem me sinalizado furtivamente.\n\nAproximo-me [servant.GetHerHim] com meus guardas em um momento tranquilo, e [servant.GetSheHe] sussurra conspiratoriamente: 'Grande [ROOT.Char.GetTitleAsNameNoTooltip], meu nome é [servant.GetFirstName]. Ouvimos muito enquanto esperamos por seus convidados; eles mal percebem nossa presença...' \n\nOlho para [servant.GetSheHe] com dúvida, pensando se realmente quero ouvir o que [servant.GetSheHe] vai dizer em seguida. [servant.GetSheHe|U] retribui o olhar, claramente incerto se [servant.GetSheHe] está cometendo um erro. \n\nFinalmente, [servant.GetSheHe] engole em seco, '[ROOT.Char.Custom('FormOfAddressForLiege')|U], [vassal.GetTitledFirstName], s[Select_CString( vassal.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('vassal'))] [servant.Custom2('DescriptorNegative', SCOPE.sC('vassal'))], [vassal_secret.Custom('SecretDescriptionThirdPerson')] atrás das portas fechadas do seu [ROOT.Char.Custom('FortifiedBuilding')] — juro isso com [servant.GetFaith.HighGodName] como minha testemunha!'"
 court.8050.t:0 "Um Pequeno Pássaro"
 court.8060.a.fashion:0 "Estabelecerei um novo padrão de vestimenta especialmente para você, [snooty_1.GetFirstNameNoTooltip]."
 court.8060.a.food:0 "[snooty_1.GetFirstNameNoTooltip], tenho uma refeição especial planejada para amanhã."
 court.8060.a.servants:0 "Talvez você possa sugerir alguns funcionários habilidosos, [snooty_1.GetFirstNameNoTooltip]?"
 court.8060.b.food:0 "Em breve teremos um novo cozinheiro, [snooty_2.GetFirstNameNoTooltip]."
 court.8060.b.lodgings:0 "Mudarei para quartos maiores hoje à noite, [snooty_2.GetFirstNameNoTooltip]."
 court.8060.b.servants:0 "Suponho que poderíamos contar com mais algumas mãos para ajudar."
 court.8060.c:0 "Saia do meu caminho, seus ingratos sanguessugas..."
 court.8060.d:0 "Se você não gosta, vá procurar outra pessoa para parasitar!"
 court.8060.desc.body:0 "Outra voz de risadinhas interrompe: 'Nossa, pensei que eu fosse a única que percebeu! Sem mencionar"
 court.8060.desc.fashion:0 "Andando por aí, juro que às vezes parece que estou na corte d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] grã[Select_CString( ROOT.Char.IsFemale, '', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip] d[Select_CString( snooty_1.IsFemale, 'a', 'o' )] [snooty_1.GetMotherFather]; as tendências são tão cansativas e tradicionais!\" \n\n"
 court.8060.desc.food_1:0 "'Você #EMP viu#! o estado do banquete de ontem à noite? Eu preferiria mastigar a minha tábua do que comer essa comida de porco!\" \n\n"
 court.8060.desc.food_2:0 "a comida deste lugar é realmente terrível — e porções tão #EMP pequenas#!"
 court.8060.desc.intro:0 "Faço uma pausa por um momento no limiar do corredor, admirando a luz do sol, quando ouço risadas debochadas vindo logo ali na esquina. \n\n'Eu #EMP sei!#!', ouço m[Select_CString( snooty_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('snooty_1'))] [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('snooty_1'))], [snooty_1.GetFirstName], gargalhando,"
 court.8060.desc.lodgings:0 "o #EMP tamanho#! dos nossos aposentos! Mal há espaço suficiente para o catre de um criado!'"
 court.8060.desc.outro:0 "\n\nSerá que é [Select_CString( snooty_2.IsFemale, 'a', 'o' )] m[Select_CString( snooty_2.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('snooty_2'))] [snooty_2.GetTitledFirstName], agora sufocando uma gargalhada? Que audácia..."
 court.8060.desc.servants_1:0 "'Você espera #EMP o dia todo#! por um criado e então dois aparecem ao mesmo tempo — sem o que você pediu!' \n\n"
 court.8060.desc.servants_2:0 "os criados — desisti de pedir qualquer coisa a eles: ou não sabem o que é ou nunca voltam!"
 court.8060.e.pious_tt:0 "Todo vassalo ou cortesão não Cínico de uma fé Ascética"
 court.8060.e:0 "As distrações mundanas apenas nos separam do [ROOT.Char.GetFaith.PositiveAfterLife]."
 court.8060.f.flavor:0 "As aparências devem ser mantidas"
 court.8060.f:0 "Dia adorável, não é?"
 court.8060.t:0 "Lisonjeador Desdenhoso"
 court.8070.a.tt:0 "[parent.GetFirstNameNoTooltip] esperará por uma [court_position|E] nos próximos meses"
 court.8070.a:0 "Vou encontrar algo para você fazer, [parent.Custom('GetMamaPapa')]."
 court.8070.b:0 "Já pensou em dedicar sua vida a [ROOT.Char.GetFaith.HighGodName]?"
 court.8070.c:0 "Apenas arrume qualquer emprego..."
 court.8070.d:0 "Estou #EMP muito#! ocupad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], [parent.GetMotherFather]."
 court.8070.desc:0 "M[Select_CString( parent.IsFemale, 'inha', 'eu' )] [parent.GetMotherFather] [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('parent'))] vagueia sem rumo pela corte todos os dias, deixando claro seu desejo por um propósito que estou ocupado demais para fornecer. \n\nHoje [parent.GetSheHe] finalmente me encurrala: 'Ah, aí está você, [ROOT.Char.GetFirstNameNoTooltip], para mim você ainda é [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom('GirlBoy')] pequenino, sabe! Deixe-me tirar um pouco do fardo de seus ombros — há tanto que ainda posso te ensinar.' \n\nMinha comitiva faz o possível para encontrar outra coisa para olhar, mas apenas piora minha vergonha. \n\n'[ROOT.Char.Custom('GetDaughterSon')|U], qual é o problema? Você não se importa com [Select_CString( parent.IsFemale, 'sua querida', 'seu querido' )] [parent.Custom('GetMaPa')]? Afinal de contas, eu fiz tanto por você?'"
 court.8070.t:0 "Sentindo-se Útil"
 court.8071.disappoint:0 "[parent.GetMotherFather|U] se cansa de esperar"
 court.8071.satisfied:0 "[parent.GetMotherFather|U] se anima com seu papel"
 court.8080.a:0 "Sim, [parent.Custom('GetMamaPapa')], vou resolver isso..."
 court.8080.b.tt:0 "Cada [courtier|E]"
 court.8080.b:0 "Ah, então você acha que é melhor do que meus cortesãos?"
 court.8080.c.fallback:0 "Você já pensou em se dedicar a [ROOT.Char.GetFaith.HighGodName]?"
 court.8080.c.monk:0 "Talvez você prefira as vestes de um [ROOT.Char.GetFaith.DevoteeMale]?"
 court.8080.c.nun:0 "Talvez você prefira o hábito de uma [ROOT.Char.GetFaith.DevoteeFemale]?"
 court.8080.d.fashion:0 "Acho que você #EMP deveria#! costurar substituições para nós."
 court.8080.d.food:0 "Muito bem, então encontre outro lugar para comer..."
 court.8080.d.lodgings:0 "Talvez você possa ceder seu quarto para outra pessoa?"
 court.8080.d.servants:0 "Bem, por que você não dá uma mão aos servos?"
 court.8080.desc.fashion:0 "esses trapos lúgubres que você chama de roupas!"
 court.8080.desc.food:0 "as ofertas terríveis em sua mesa de banquetes!"
 court.8080.desc.intro:0 "[Select_CString( parent.IsFemale, 'Minha', 'Meu' )] [parent.GetMotherFather], [parent.GetTitledFirstName] está ficando cada vez mais irritável a cada dia. \n\nEnquanto estou sentado no meu trono, contemplando as possíveis causas, [Select_CString( parent.IsFemale, 'a', 'o' )] [Select_CString( parent.IsFemale, 'própria', 'próprio' )] [parent.GetWomanMan] se aproxima de mim, assim como [parent.GetSheHe] costumava fazer quando eu me comportava mal quando criança.\n\n'[ROOT.Char.GetFirstNameNoTooltip], m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom('GetDaughterSon')]! Você precisa fazer algo sobre"
 court.8080.desc.lodgings:0 "as acomodações escassas que você oferece aos seus hóspedes!"
 court.8080.desc.outro:0 "Você não se importa com o que as pessoas pensam de você?!\"\n\n\"Essa não é uma maneira adequada para um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] se apresentar; nesse ritmo, você se tornará o motivo de chacota do [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] — não — de todos os [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]!"
 court.8080.desc.servants:0 "seus servos incompetentes e sobrecarregados!"
 court.8080.e:0 "Você não pode mais falar comigo dessa maneira!"
 court.8080.t:0 "Repreensão [parent.Custom('GetMaternalPaternal')|U]"
 court.8090.a:0 "[my_barony.GetNameNoTierNoTooltip] #EMP poderia#! usar um pouco de trabalho..."
 court.8090.b:0 "Eles serão levados para a casa de [ROOT.Char.GetFaith.HighGodName] em [temple_barony.GetNameNoTierNoTooltip]."
 court.8090.c.tt:0 "Esta opção está disponível porque [Select_CString( architect.IsFemale, 'a', 'o' )] [architect.GetFirstNameNoTooltip] é seu $royal_architect_court_position$"
 court.8090.c:0 "Um arquiteto da sua renome pode fazer melhor, [architect.GetFirstNameNoTooltip]!"
 court.8090.d:0 "Deixe esses blocos gastos para os plebeus."
 court.8090.desc.castle:0 "[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.Custom('FortifiedBuilding')] em [my_barony.GetNameNoTier]!"
 court.8090.desc.chaplain:0 "mas é interrompid[Select_CString( steward.IsFemale, 'a', 'o' )] [Select_CString( chaplain.IsFemale, 'pela minha', 'pelo meu' )] [chaplain.GetHeldCourtAndCouncilPositionsString]: \"O [ROOT.Char.GetFaith.HouseOfWorship] próximo de [temple_barony.GetNameNoTier] está precisando urgentemente de expansão;\" [chaplain.GetTitledFirstName] exclama. \"É lá que os escombros devem ser levados!\""
 court.8090.desc.fallback:0 "zombando, \"Nós podemos aproveitá-los muito melhor do que os plebeus jamais poderiam, você sabe disso!\""
 court.8090.desc.intro:0 "M[Select_CString( architect.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))], [architect.GetTitledFirstName], certamente leva a sério suas responsabilidades como $royal_architect_court_position$."
 court.8090.desc.intro_alt:0 "Um[Select_CString( architect.IsFemale, 'a', '' )] arquitet[Select_CString( architect.IsFemale, 'a', 'o' )] conhecid[Select_CString( architect.IsFemale, 'a', 'o' )] de [my_county.GetNameNoTier], [architect.GetTitledFirstName], está visitando a corte."
 court.8090.desc.intro_end:0 "Seu debate apaixonado com m[Select_CString( steward.IsFemale, 'inha', 'eu' )] [steward.GetHeldCourtAndCouncilPositionsString], [steward.GetTitledFirstName], domina a sala. \n\n\"Sim, precisamente!\" exclama [architect.GetFirstNameNoTooltip], \"As ruínas lá estão repletas de pedras cortadas que poderiam facilmente ser transferidas para"
 court.8090.desc.outro:0 "\n\n[steward.GetFirstNameNoTooltip] coça o queixo com dúvidas, \"Ainda assim, parece muito trabalho, e os moradores que usam esses materiais não vão gostar.\" \n\n[architect.GetFirstNameNoTooltip] revira os olhos diante dessa objeção razoável,"
 court.8090.desc.religious:0 "o [ROOT.Char.GetFaith.HouseOfWorship] de [temple_barony.GetNameNoTier]!\""
 court.8090.t:0 "Blocos de Construção"
 court.8100.a:0 "A poção mais forte, você diz? Me dê aqui."
 court.8100.b.tt_forgiving:0 "[food_taster.GetTitledFirstName] não é $trait_forgiving$:"
 court.8100.b:0 "Realmente? Deixe que m[Select_CString( food_taster.IsFemale, 'inha', 'eu' )] $food_taster_court_position$ experimente primeiro."
 court.8100.c:0 "Apenas [ROOT.Char.GetFaith.HighGodName] pode nos conceder força."
 court.8100.d:0 "Essa porcaria não serve nem para uma fera, quanto mais para um homem!"
 court.8100.desc:0 "Caminhando entre audiências, ouço m[Select_CString( physician.IsFemale, 'inha', 'eu' )] $court_physician_court_position$ [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('physician'))], [physician.GetTitledFirstName], discutindo sua última ideia extravagante. \n\n\"...supostamente é a poção mais forte que existe e vem apenas dos lugares mais distantes do mundo — ou isso é o que dizem os comerciantes e alquimistas com quem conversei.\" \n\n[physician.GetSheHe|U] tira um frasco de líquido amarelo-pálido, girando-o sob os narizes curvos dos meus cortesãos. \n\n\"Dizem que ela concede vigor e vida longa, sendo favorita daqueles que estão indo para a batalha, mas apenas os mais fortes conseguem lidar com seu poder.\""
 court.8100.t:0 "Poção Questionável"
 court.8100.tt.handle_potion:0 "Você lida com a poção mais forte"
 court.8100.tt.need_weaker:0 "Deveria ter encontrado uma poção mais fraca"
 court.8100.tt.too_strong:0 "A poção é muito forte para você"
 court.8110.a:0 "Muito bem, é a vez d[Select_CString( prisoner_1.IsFemale, 'a', 'o' )] [prisoner_1.GetTitledFirstNameNoTooltip]."
 court.8110.b:0 "Não, é a vez d[Select_CString( prisoner_1.IsFemale, 'a', 'o' )] [prisoner_2.GetTitledFirstNameNoTooltip] a seguir."
 court.8110.c.flavor:0 "M[Select_CString( my_executioner.IsFemale, 'inha', 'eu' )] $executioner_court_position$ deve saber o seu lugar"
 court.8110.c:0 "Sim, e #EMP você#! é um [my_executioner.Custom('GetCrime')]"
 court.8110.d:0 "Você está gostando disso demais, [my_executioner.GetFirstNameNoTooltip]."
 court.8110.desc.body:0 "está apenas #EMP definhar#!, esperando você anunciar a data da execução."
 court.8110.desc.criminal:0 "Permita-me acabar com [prisoner_1.Custom('GetCrimeDesc')] de seu sofrimento..."
 court.8110.desc.fallback:0 "[prisoner_1.GetCrimeDesc] odios[Select_CString( prisoner_1.IsFemale, 'a', 'o' )], [prisoner_1.GetTitledFirstName],"
 court.8110.desc.heathen:0 "pagã[Select_CString( prisoner_1.IsFemale, '', 'o' )] nojent[Select_CString( prisoner_1.IsFemale, 'a', 'o' )], [prisoner_1.GetTitledFirstName],"
 court.8110.desc.heretic:0 "herege descarad[Select_CString( prisoner_1.IsFemale, 'a', 'o' )], [prisoner_1.GetTitledFirstName],"
 court.8110.desc.infidel:0 "infiel ímpi[Select_CString( prisoner_1.IsFemale, 'a', 'o' )], [prisoner_1.GetTitledFirstName],"
 court.8110.desc.intro:0 "M[Select_CString( my_executioner.IsFemale, 'inha', 'eu' )] $executioner_court_position$ [my_executioner.Custom('quirk_neg_adjective')], [my_executioner.GetTitledFirstName], vagueia pelo palácio [my_executioner.Custom('quirk_neg_pp')], com toda a sutileza de uma criança mimada.\n\nFinalmente, não consigo mais tolerar esses lamentáveis espetáculos na minha corte e exijo: \"O que está acontecendo?!\"\n\n[my_executioner.GetSheHe|U] fica surpres[Select_CString( my_executioner.IsFemale, 'a', 'o' )], mas responde prontamente: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], perdoe-me, é que não tenho feito uma boa execução há semanas...\" \n\n\"Venha, isso"
 court.8110.desc.leader_1:0 "agitador[Select_CString( prisoner_1.IsFemale, 'a', '' )] repugnante, [prisoner_1.GetTitledFirstName],"
 court.8110.desc.leader_2:0 "Enquanto [prisoner_1.GetSheHe] viver, [prisoner_1.GetSheHe] pode ser um símbolo para outros renegados..."
 court.8110.desc.noble:0 "abominável demônio, [prisoner_1.GetTitledFirstName],"
 court.8110.desc.religious:0 "Não importa para [ROOT.Char.GetFaith.DeathDeityName] quando a alma ímpia alcança o [ROOT.Char.GetFaith.NegativeAfterLife]..."
 court.8110.e:0 "Não há pressa."
 court.8110.t:0 "Sobre o Cadafalso"
 court.8120.a.accuser:0 "[accuser.GetSheHe|U] tem um ponto, no entanto, [refuter.GetFirstNameNoTooltip]."
 court.8120.a.refuter:0 "[refuter.GetSheHe|U] tem um ponto, no entanto, [accuser.GetFirstNameNoTooltip]."
 court.8120.c:0 "Venham amigos, há muitas maneiras de honrar o criador."
 court.8120.d.tt:0 "Cada vassalo [THIS.Char.GetFaith.GetAdjectiveNoTooltip] zeloso, cada cortesão [THIS.Char.GetFaith.GetAdjectiveNoTooltip] e cada convidado [THIS.Char.GetFaith.GetAdjectiveNoTooltip]"
 court.8120.d:0 "Olhem aqui, estas são as verdades [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]!"
 court.8120.desc.adultery:0 "[accuser.GetFaith.CreatorName] não pretende que cometamos fornicação fora do casamento e persigamos nossas paixões; é #EMP por isso que#! temos esses laços!"
 court.8120.desc.cosanguity:0 "[accuser.GetFaith.CreatorName] não pretendia que membros da mesma família se casassem ou se reproduzissem; essa é uma tentação que desafia a natureza!"
 court.8120.desc.divorce:0 "o divórcio é para aqueles que não estão dispostos a se dedicar a outra pessoa incondicionalmente, buscando a pureza e o [accuser.GetFaith.PositiveAfterLife]. \n\n"
 court.8120.desc.equality:0 "[accuser.GetFaith.CreatorName] criou homens e mulheres juntos, nenhum submisso ao outro, no início dos tempos."
 court.8120.desc.intro:0 "Eu sento silenciosamente, ouvindo m[Select_CString( accuser.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('accuser'))] [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('accuser') )], [accuser.GetTitledFirstName], envolvid[Select_CString( accuser.IsFemale, 'a', 'o' )] em um acirrado debate teológico com m[Select_CString( refuter.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('refuter'))], [refuter.GetTitledFirstName]. \n\nEst[Select_CString( refuter.IsFemale, 'a', 'e' )] últim[Select_CString( refuter.IsFemale, 'a', 'o' )] argumenta [refuter.Custom('quirk_pos_adverb')],"
 court.8120.desc.marriage:0 "os sagrados laços do matrimônio devem ser compartilhados apenas com uma única pessoa; é assim que nos aproximamos do [accuser.GetFaith.PositiveAfterLife]."
 court.8120.desc.other_religion:0 "\"...mas os ensinamentos ultrapassados d[Select_CString( accuser.IsFemale, 'a', 'o' )] [accuser.GetFaith.GetReligion.GetAdjectiveNoTooltip] não podem ser sinceramente comparados aos de nossa [refuter.GetFaith.GetReligion.GetNameNoTooltip]; a verdade do [accuser.GetFaith.HighGodName] é apenas uma distorção da verdade de [refuter.GetFaith.HighGodName].\"\n\n[accuser.GetTitledFirstNameNoTooltip] zomba, [accuser.Custom('quirk_neg_pp')]. \"Pense profundamente sobre isso e você verá que"
 court.8120.desc.outro:0 "\n\n\"É por isso que não falo com os perdidos...\" [refuter.GetTitledFirstNameNoTooltip] suspira com frustração. \"Se você não vai ouvir a verdade, só espero que você seja de alguma forma poupad[Select_CString( accuser.IsFemale, 'a', 'o' )] do [accuser.GetFaith.NegativeAfterLife] infernal.\""
 court.8120.desc.same_religion:0 "\"...mas o [refuter.GetFaith.GetNameNoTooltip] #EMP está#! mais próximo da verdadeira palavra de [refuter.GetFaith.HighGodName]; é a mais pura destilação das revelações [refuter.GetFaith.GetReligion.GetAdjectiveNoTooltip].\"\n\n[accuser.GetTitledFirstNameNoTooltip] zomba, [accuser.Custom('quirk_neg_pp')]. \"Leia o [accuser.GetFaith.ReligiousText] e você verá que"
 court.8120.desc.witchcraft:0 "os rituais profanos das bruxas estão em contradição com a busca pelo [accuser.GetFaith.PositiveAfterLife]."
 court.8120.e:0 "Não quero mais ouvir esse tipo de conversa, [accuser.GetFirstNameNoTooltip]."
 court.8120.f:0 "Não nos compete debater o divino."
 court.8120.t:0 "Perspectivas Novas"
 court.8130.a.tt:0 "[champion.GetTitledFirstName] e [Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstName] têm um [single_combat_duel|E]"
 court.8130.a.tt_champion:0 "[champion.GetTitledFirstNameNoTooltip] vence o duelo"
 court.8130.a.tt_vassal:0 "[vassal.GetTitledFirstNameNoTooltip] vence o duelo"
 court.8130.a:0 "[champion.GetFirstNameNoTooltip] defenderá minha honra."
 court.8130.b.tt_me:0 "Eu venço o duelo"
 court.8130.b:0 "Um mal-entendido; [vassal.GetFirstNameNoTooltip] é um[Select_CString( vassal.IsFemale, 'a', '' )] vassal[Select_CString( vassal.IsFemale, 'a', 'o' )] leal."
 court.8130.c:0 "Eu preciso de agentes mais ponderados."
 court.8130.d.tt:0 "[vassal.GetTitledFirstName] e eu temos um [single_combat_duel|E]"
 court.8130.d:0 "[vassal.GetSheHe|U] disse o quê?! Busquem minha [ROOT.Char.Custom('signature_weapon')]"
 court.8130.desc.body:0 "\"Eu ouvi com meus próprios ouvidos!\" [champion.GetFirstNameNoTooltip] retrai-se, \"Exijo satisfação por essa ofensa contra [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord]!\""
 court.8130.desc.bold:0 "\"Esse tipo de agitação é abaixo deste tribunal, não serei intimidad[Select_CString( vassal.IsFemale, 'a', 'o' )] por seus jogos.\" [vassal.GetTitledFirstNameNoTooltip] retruca [vassal.Custom('quirk_pos_adverb')]. $court.8130.desc.body$ [Select_CString( vassal.IsFemale, 'A', 'O' )] [vassal.GetTitleAsNameNoTooltip] [vassal.Custom('quirk_pos_present')] e responde: \"Muito bem, eu prontamente colocarei ess[Select_CString( champion.IsFemale, 'a', 'e' )] besta [champion.Custom2('InsultAdjective', SCOPE.sC('vassal'))] em seu lugar.\""
 court.8130.desc.craven:0 "\"M-m-mas eu não disse n-nada parecido!\" [vassal.GetTitledFirstNameNoTooltip] diz incrédul[Select_CString( vassal.IsFemale, 'a', 'o' )]. $court.8130.desc.body$ [Select_CString( vassal.IsFemale, 'A', 'O' )] [vassal.GetTitleAsNameNoTooltip] [vassal.Custom('quirk_pos_present')] e gagueja: \"O-o quê?! Vamos lá, certamente isso n-não será necessário?!\""
 court.8130.desc.intro:0 "Enquanto estou sentad[Select_CString( ROOt.Char.IsFemale, 'a', 'o' )] no meu trono, pensando sobre isso e aquilo, um tumulto irrompe. \n\nM[Select_CString( champion.IsFemale, 'inha', 'eu' )] $champion_court_position$ [champion.GetFirstName] brada: \"Eu sei exatamente o que você quis dizer, s[Select_CString( vassal.IsFemale, 'ua', 'eu' )] [vassal.Custom2('InsultNoun', SCOPE.sC('champion'))]! Como #EMP você#! se atreve a desrespeitar noss[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]?\" bem na frente de um[Select_CString( vassal.IsFemale, 'a', '' )] [vassal.GetTitledFirstName] atordoad[Select_CString( vassal.IsFemale, 'a', 'o' )]. [mediator.Custom2('MyCharacterIntroduction', ROOT.Char)|U] rapidamente intervém para separá-los, mas a atmosfera já foi irreparavelmente manchada. \n\n"
 court.8130.desc.outro:0 "\n\nTodos olham para mim em busca da minha opinião sobre o assunto, enquanto [Select_CString( mediator.IsFemale, 'a', 'o' )] [mediator.GetFirstNameNoTooltip] mantém os dois separados."
 court.8130.e:0 "Acalmem-se, não haverá duelo."
 court.8130.t:0 "Conflito Fabricado"
 court.8140.a.flavor_tt:0 "Recomponha-se, você é [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]!"
 court.8140.a:0 "Peço desculpas, você estava dizendo?"
 court.8140.b.flavor_tt:0 "Eu preciso [ROOT.Char.Custom('GetStressDesire')]. AGORA."
 court.8140.b:0 "Perdoe-me, tenho outros assuntos para tratar."
 court.8140.c.1:0 "[vassal_1.GetTitledFirstNameNoTooltip], conduza-nos em oração."
 court.8140.c.2:0 "[vassal_1.GetTitledFirstNameNoTooltip], organize um banquete para mim!"
 court.8140.c.3:0 "[vassal_1.GetTitledFirstNameNoTooltip], vamos pegar a estrada."
 court.8140.c.flavor_tt:0 "Agora, isso deixaria minha mente perturbada mais tranquila!"
 court.8140.c.tt.2:0 "Você pode organizar uma [GetActivityType('activity_pilgrimage').GetName] nos próximos 10 anos com um desconto de 25%."
 court.8140.c.tt:0 "Você pode organizar uma [GetActivityType('activity_feast').GetName] nos próximos 5 anos por metade do preço."
 court.8140.d.1:0 "[vassal_2.GetTitledFirstNameNoTooltip], convoque uma caça!"
 court.8140.d.2:0 "[vassal_2.GetTitledFirstNameNoTooltip], traga-me um novo cavalo."
 court.8140.d.3:0 "[vassal_2.GetTitledFirstNameNoTooltip], o que sua ciência recomenda?"
 court.8140.d.flavor_tt:0 "Isso parece encantador!"
 court.8140.d.tt:0 "Você pode organizar um [GetActivityType('activity_hunt').GetName] nos próximos 5 anos por metade do preço."
 court.8140.desc:0 "O aparato da corte continua, dia após dia, do amanhecer ao crepúsculo. [vassal_2.GetTitledFirstName] extemporiza sobre minha grandeza, despejando platitudes e elogios. Perto dali, [vassal_1.GetTitledFirstName] se junta, fazendo show para a multidão, sorrindo estupidamente e esperando um sinal do meu favor por suas palhaçadas. Uma única gota de suor escorre interminavelmente pela minha testa...\n\n[vassal_2.GetFirstNameNoTooltip] percebe minha distância, perguntando: \"Você está bem, [ROOT.Char.Custom('FormOfAddressForLiege')]?\" com quase genuína preocupação.\n\n\"Eu preciso de um descanso.\""
 court.8140.t:0 "Lapso Real"
 court.8150.a.tt:0 "Forjado no fogo de mil pratos, o mettle d[Select_CString( food_taster.IsFemale, 'a', 'o' )] [food_taster.GetTitledFirstNameNoTooltip] foi testado, e [food_taster.GetSheHe] emergiu vitorioso e mais forte: [aptitude|E] Aumentado."
 court.8150.a:0 "Mal posso esperar!"
 court.8150.b.tt:0 "Desde que a corte parou de comer em excesso, [high_almoner.GetTitledFirstNameNoTooltip] tem um suprimento quase inesgotável de comida para doar aos pobres: [aptitude|E] Aumentado."
 court.8150.b:0 "Apenas o melhor para a minha corte."
 court.8150.c:0 "Essa extravagância foi longe demais!"
 court.8150.d:0 "Você nunca ficará satisfeit[Select_CString( high_almoner.IsFemale, 'a', 'o' )]?"
 court.8150.desc.almoner:0 "[high_almoner.GetTitledFirstName], m[Select_CString( high_almoner.IsFemale, 'inha', 'eu' )] $high_almoner_court_position$, torce o nariz, resmungando sobre os pobres famintos..."
 court.8150.desc.almoner_chaplain:0 "M[Select_CString( high_almoner.IsFemale, 'inha', 'eu' )] $high_almoner_court_position$, [high_almoner.GetTitledFirstName], e [Select_CString( chaplain.IsFemale, 'a', 'o' )] [chaplain.GetCouncilTitleFirstName] fazem um som de desaprovação, balançando a cabeça com desprezo evidente."
 court.8150.desc.body:0 "A atividade culinária é impulsionada pela constante disputa d[Select_CString( vassal_1.IsFemale, 'a', 'o' )] [vassal_1.GetTitledFirstName], [vassal_2.GetTitledFirstName] e [Select_CString( vassal_3.IsFemale, 'a', 'o' )] [vassal_3.GetTitledFirstName] para exigir a refeição mais memorável de meus cozinheiros sobrecarregados. \n\nHoje é m[Select_CString( demander.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('demander'))], [demander.GetFirstNameNoTooltip], que saliva \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], hoje à noite estou mandando a cozinha preparar o molho mais rico conhecido pelo homem, servido com um assado de dez aves!\" lambendo os lábios vorazmente. \n\n"
 court.8150.desc.chaplain:0 "[chaplain.GetCouncilTitleFirstName] suspira desaprovadoramente: 'Esses prazeres passageiros não se comparam à graça de [chaplain.GetFaith.HighGodName]...'"
 court.8150.desc.intro:0 "A cada dia parece que minha corte está agitada com a conversa sobre o próximo banquete, e muitos têm se tornado mais corpulentos ultimamente..."
 court.8150.desc.taster:0 "\n\n[ofood_taster.GetTitledFirstName], m[Select_CString( ofood_taster.IsFemale, 'inha', 'eu' )] $food_taster_court_position$, parece mais letárgic[Select_CString( ofood_taster.IsFemale, 'a', 'o' )] a cada sessão, suando mais profusamente a cada iguaria estrangeira que é levada à sua boca. \n\n"
 court.8150.t:0 "Excesso Prandial"
 court.8160.a.tt:0 "A rivalidade entre [knight_1.GetFirstNameNoTooltip] e [Select_CString( knight_2.IsFemale, 'a', 'o' )] [knight_2.GetFirstNameNoTooltip] garante que, enquanto ambos estiverem empregados, darão o seu melhor em suas posições: [aptitude|E] Aumentado."
 court.8160.a.tt_knight_1:0 "[knight_1.GetTitledFirstNameNoTooltip] vence o duelo"
 court.8160.a.tt_knight_2:0 "[knight_2.GetTitledFirstNameNoTooltip] vence o duelo"
 court.8160.a:0 "Vocês dois me servirão diretamente."
 court.8160.b:0 "Peguem suas espadas! Dêem a eles espadas de treinamento."
 court.8160.c.tt:0 "Você lutará um combate singular com o [knight|E] de maior [prowess|E] ([knight_1.GetTitledFirstName])"
 court.8160.c.tt_lose:0 "Você foi derrotado"
 court.8160.c.tt_win:0 "Você saiu vitorioso"
 court.8160.c:0 "Eu vou humilhar ambos!"
 court.8160.d:0 "Prove isso para mim no campo de batalha, não na corte!"
 court.8160.desc.intro:0 "Uma rivalidade saudável entre lutadores corajosos é esperada, mas a crescente discórdia entre [knight_1.GetFirstName] e [Select_CString( knight_2.IsFemale, 'a', 'o' )] [knight_2.GetFirstName] está amargando o clima na corte. \n\n[knight_1.GetTitledFirstNameNoTooltip] é amplamente considerad[Select_CString( knight_1.IsFemale, 'a', 'o' )] mais habilidos[Select_CString( knight_1.IsFemale, 'a', 'o' )], mas [knight_2.GetTitledFirstNameNoTooltip] claramente discorda dessa afirmação. \n\nNo meio de uma audiência, este último invade minha sala do trono e, segurando a empunhadura de sua espada, exclama: '[knight_1.GetFirstNameNoTooltip]! Apenas um de nós pode se considerar [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip] mais habilidoso [ROOT.Char.Custom('MountedWarriorTerm')], encontre-me lá fora e eu resolverei a questão!' \n\n[knight_1.GetTitledFirstNameNoTooltip] responde [knight_2.Custom('quirk_neg_adverb')]: 'Eu te cortaria em pedaços onde você está se não fosse pela presença d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip], s[Select_CString( knight_2.IsFemale, 'ua', 'eu' )] [knight_2.Custom2('InsultNoun', SCOPE.sC('knight_1'))] [knight_2.Custom('quirk_neg_adjective')]! Peça desculpas e talvez eu poupe sua vida!' \n\nPreciso agir rapidamente se quiser interromper essa escalada..."
 court.8160.t:0 "[Select_CString( ROOT.Char.IsFemale, 'A', 'O' )] Principal [ROOT.Char.Custom('MountedWarriorTerm')]"
 court.8162.tt:0 "Tendo provado a superioridade [sc_victor.GetHerHim] em um duelo justo, [sc_victor.GetFirstNameNoTooltip] é reconhecid[Select_CString( sc_victor.IsFemale, 'a', 'o' )] como [Select_CString( sc_victor.IsFemale, 'a', 'o' )] melhor [ROOT.Char.Custom('MountedWarriorTerm')] e o mais qualificado para ser seu $bodyguard_court_position$ ou $champion_court_position$: [aptitude|E] Aumentado."
 court.8163.t:0 "Você vence o duelo"
 court.8170.a.family:0 "Não — a família vem em primeiro lugar."
 court.8170.a.other:0 "Não cabe a mim julgar."
 court.8170.b:0 "Você precisa se arrepender, [criminal.GetFirstNameNoTooltip]!"
 court.8170.c1:0 "[criminal.GetSheHe|U] que falhou em ver a justiça não verá mais!"
 court.8170.c2:0 "A maldita linhagem d[Select_CString( criminal.IsFemale, 'a', 'o' )] [criminal.GetFirstNameNoTooltip] terminará com el[Select_CString( criminal.IsFemale, 'a', 'e' )]."
 court.8170.c3:0 "Somente a morte pode purificar os crimes [criminal.GetHerHim]."
 court.8170.d:0 "Não posso mais te receber, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('criminal'))]..."
 court.8170.desc.body:0 "\n\nMinha falha em condenar, e a proximidade contínua com, [criminal.Custom('GetCrimeDesc')] é percebida como tolerância aberta, manchando a reputação da minha corte aos olhos dos [ROOT.Char.GetFaith.AltPriestTermPlural] e dos fiéis...\n\nEles me forçaram a tomar uma decisão, e agora devo decidir se os crimes de m[Select_CString( criminal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('criminal'))] superam meu afeto por [criminal.GetSheHe] — certamente algo deve ser feito,"
 court.8170.desc.fallback:0 "será que os cortesãos são tão difíceis de substituir?"
 court.8170.desc.family:0 "mesmo que [criminal.GetSheHe] seja um [criminal.GetDynasty.GetNameNoTooltip]..."
 court.8170.desc.guest:0 "[criminal.GetSheHe] é apenas um[Select_CString( criminal.IsFemale, 'a', '' )] viajante, afinal."
 court.8170.desc.intro_fallback:0 "Minha corte não pode aceitar nenhuma desculpa para minha hospitalidade em relação [Select_CString( criminal.IsFemale, 'a', 'ao' )] '[criminal.GetFirstName] [Select_CString( criminal.IsFemale, 'a', 'o' )] [criminal.Custom('GetCrime')|U]', que é vist[Select_CString( criminal.IsFemale, 'a', 'o' )] como uma aberração em um lugar normalmente distinto."
 court.8170.desc.intro_religious:0 "Sou duramente julgad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por minha hospitalidade em relação [Select_CString( criminal.IsFemale, 'a', 'ao' )] '[criminal.GetFirstName] [Select_CString( criminal.IsFemale, 'a', 'o' )] [criminal.Custom('GetCrime')|U]', que é evitad[Select_CString( criminal.IsFemale, 'a', 'o' )] por quase todos devido à sua fé maligna."
 court.8170.desc.intro_scary:0 "As crianças da corte fogem quando '[criminal.GetFirstName] [Select_CString( criminal.IsFemale, 'a', 'o' )] [criminal.Custom('GetCrime')|U]' se aproxima, e nem mesmo os mais fervorosos [ROOT.Char.GetFaith.BishopNeuterPlural] conseguem deixar de encolher diante de sua presença."
 court.8170.desc.intro_sordid:0 "'[criminal.GetFirstName] [Select_CString( criminal.IsFemale, 'a', 'o' )] [criminal.Custom('GetCrime')|U]' é uma figura de desprezo na corte, assombrad[Select_CString( criminal.IsFemale, 'a', 'o' )] pelo ostracismo social e alvo de muitas piadas sórdidas."
 court.8170.t:0 "Pária da Corte"
 court.8180.a:0 "Basta é basta. O mundo precisa saber."
 court.8180.b:0 "Só um tolo não aproveitaria esse conhecimento."
 court.8180.c:0 "[criminal.GetSheHe|U] pertence à prisão."
 court.8180.d:0 "Está na hora [criminal.GetHerHim] ir embora."
 court.8180.desc.intro:0 "Os dias passam sem que eu sequer pense nisso, mas cada vez que encontro o olhar d[Select_CString( criminal.IsFemale, 'a', 'o' )] [criminal.GetTitledFirstName] no tribunal, só consigo pensar em seus crimes.\n\nMe pergunto quantos no tribunal sabem — talvez nenhum? Talvez todos... A verdade surgirá eventualmente, e isso não fará bem à minha reputação ter tais escândalos em meio aos meus cortesãos...\n\n[criminal.GetSheHe|U] deve ser tratado, ou terei que prestar contas a [ROOT.Char.GetFaith.HighGodName], para não mencionar o tribunal."
 court.8180.e:0 "Não há necessidade de agir ainda..."
