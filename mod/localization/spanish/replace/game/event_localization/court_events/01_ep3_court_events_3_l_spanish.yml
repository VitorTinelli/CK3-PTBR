l_spanish:
 MODIFIER_DEFINITION_VALUE_ARCHITECT_SCALE:0 " \t#weak Aumento por nível de [aptitude|E] do seu [GetCourtPositionType('royal_architect_court_position').GetName()]#!"
 artifact_improved_tt:0 "Artefato Melhorado"
 chancellor_domestic_affairs_opinion_food_bonus_desc:0 "\n$TAB$$food_improves_opinion$: #P +[SCOPE.ScriptValue('chancellor_domestic_affairs_opinion_food_bonus')|2]#!"
 chancellor_domestic_affairs_tyranny_food_bonus_desc:0 "\n$TAB$$food_improves_opinion$: #P +[SCOPE.ScriptValue('chancellor_domestic_affairs_tyranny_food_bonus')|P0]%#!"
 cheaper_fashion_for_15_years:0 "$court_fashion_decent$ é #P 20%#! mais barato por 15 anos"
 cheaper_food_for_15_years:0 "$court_food_quality_decent$ é #P 20%#! mais barato por 15 anos"
 cheaper_lodgings_for_15_years:0 "$court_lodging_standards_middling$ são #P 15%#! mais baratos por 15 anos"
 cheaper_lodgings_for_15_years_1:0 "$court_lodging_standards_middling$ são #P 25%#! mais baratos por 15 anos"
 cheaper_servants_for_15_years:0 "$court_servants_some$ são #P 20%#! mais baratos por 15 anos"
 court_events.3000.a:0 "Todos devem saber que eu sou o ápice da moda."
 court_events.3000.b:0 "A moda de [ROOT.Char.GetCulture.GetNameNoTooltip] deve ser um exemplo para todos."
 court_events.3000.c:0 "Todos devem comprar nossos chapéus!"
 court_events.3000.desc:0 "[chancellor.Custom2('MyCharacterIntroduction',ROOT.Char)|U] e [steward.Custom2('MyCharacterIntroduction',ROOT.Char)] parecem estar de bom humor hoje.\n\n\"Junte-se a nós, [Select_CString( ROOT.Char.IsFemale, 'minha senhora feudal', 'meu senhor feudal' )]!\" exclama [Select_CString( chancellor.IsFemale, 'a', 'o' )] [chancellor.GetFirstNameNoTooltip]. \"Estávamos falando de algo do seu interesse. Seus investimentos para promover e manter a moda de [ROOT.Char.GetCulture.GetNameNoTooltip] como o verdadeiro pico da elegância estão dando frutos!\"\n\n\"Governantes estrangeiros o admiram e invejam, mas [Select_CString( steward.IsFemale, 'a', 'o' )] [steward.GetFirstNameNoTooltip] e eu não conseguimos chegar a um acordo sobre a melhor forma de capitalizar sua reputação.\""
 court_events.3000.t:0 "O Pico da Elegância"
 court_events.3010.a:0 "Certo, vou contratar alguns cozinheiros estrangeiros."
 court_events.3010.b:0 "Mas é saudável e piedoso!"
 court_events.3010.c.tt:0 "Quando sua sopa tem o mesmo sabor e aparência todos os dias, é muito mais difícil deslizar qualquer veneno despercebido!"
 court_events.3010.c:0 "É para a minha segurança."
 court_events.3010.desc:0 "\"Eu imploro, [ROOT.Char.Custom2('RelationToMeAddress', SCOPE.sC('courtier'))],\" [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] se aproxima de mim com olhos suplicantes.\n\n\"Você precisa fazer algo sobre a comida servida na corte! Todos nós comemos como camponeses, emissários estrangeiros fazem caretas à nossa mesa, e governantes e artistas vizinhos usam nossos pratos tradicionais como exemplos de mau gosto e hábitos bárbaros!\""
 court_events.3010.t:0 "A Mesma Velha Sopa"
 court_events.3020.a:0 "Nós merecemos melhor."
 court_events.3020.b:0 "Isso precisa de um especialista: [Select_CString( expert.IsFemale, 'A', 'O' )] [expert.GetFirstNameNoTooltip]!"
 court_events.3020.c:0 "[architect.GetFirstNameNoTooltip] e [Select_CString( physician.IsFemale, 'a', 'o' )] [physician.GetFirstNameNoTooltip], resolvam isso!"
 court_events.3020.d:0 "Tenho certeza de que não é tão ruim."
 court_events.3020.desc:0 "[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] parece particularmente miserável hoje.\n\n\"Vivemos como animais nesta corte! Ou pior, como #EMP camponeses!#! Os quartos são lotados, famílias inteiras amontoadas na mesma cama, penicos descartados em todo lugar; rolamos e nos atolamos em nossa sujeira e cheiro...\""
 court_events.3020.desc_architect:0 "\n\n\"Deve haver algo que possamos fazer\", intervém [architect.Custom2('MyCharacterIntroduction', ROOT.Char)].\""
 court_events.3020.desc_physician:0 "\n\n[physician.Custom2('MyCharacterIntroduction', ROOT.Char)|U] intervém: \"O mau miasma também contribui para epidemias!\""
 court_events.3020.t:0 "O Que Há em uma Cama?"
 court_events.3030.a:0 "Que tal uma cama ainda melhor?"
 court_events.3030.b:0 "Fico muito feliz em ouvir isso!"
 court_events.3030.desc:0 "\"Generos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]! Permita-me expressar toda a minha gratidão e trazer-lhe boas novas!\" [inspiration_owner.GetTitledFirstName] exclama enquanto se apressa em minha direção.\n\n\"Tenho aproveitado muito os aposentos que me foram designados. São tão espaçosos, posso andar de um lado para o outro enquanto penso e trabalhar sem ser perturbado; a vista para o jardim é de tirar o fôlego; e a cama — oh, a cama! — é tão confortável que sinto que estou dormindo em uma nuvem! De fato, uma inspiração divina para melhorar ainda mais sua [inspiration_owner.Custom('GetInspirationTypeObject')] me veio enquanto eu dormia. Preciso voltar ao trabalho!\""
 court_events.3030.t:0 "Veio a Mim em um Sonho"
 court_events.3040.a:0 "As portas de nossas cidades se abrirão para eles!"
 court_events.3040.b:0 "Muito bem, eles podem trabalhar para nós."
 court_events.3040.c:0 "Não precisamos deles."
 court_events.3040.desc:0 "Enquanto sou atingido por uma súbita vontade de um lanche e não consigo localizar um único servo para me ajudar, percebo que isso se tornou uma ocorrência bastante comum. Nunca consigo fazer nada na minha corte porque nunca há servos suficientes!\n\nMinhas divagações são interrompidas pela aparição de [steward.Custom2('MyCharacterIntroduction', ROOT.Char)]. \"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip], quais são seus pensamentos sobre a guerra que está devastando nosso vizinho, o [war_realm.GetName]? Incontáveis refugiados de [occupied_prov.GetName] ocupada estão atravessando nossas fronteiras neste momento!\"\n\nPoderia esta ser a solução que eu estava desejando?"
 court_events.3040.t:0 "Corte Vazia"
 court_events.3050.a.tt:0 "Você ganha #P $food_improves_opinion$#!: Aumenta a eficácia de [domestic_affairs|E] por #P 15#! anos"
 court_events.3050.a:0 "Deixe-os desejar a mesa d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]!"
 court_events.3050.b.tt:0 "Você ganha #P $food_improves_feasts$#!: #P +15#! aceitação de convidados e #P -15%#! custo em ouro para suas atividades de Festa por #P 15#! anos"
 court_events.3050.b:0 "Vamos convidá-los à mesa d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]!"
 court_events.3050.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\" — começa [chancellor.Custom2('MyCharacterIntroduction', ROOT.Char)] — \"Chegou ao meu conhecimento que as luxuosas refeições oferecidas à sua mesa conquistaram bastante reputação!\"\n\n\"Delícias tão exóticas, sabores tão atraentes... Seus vassalos #EMP anseiam#! por serem convidados a participar de seus banquetes!\"\n\nIsso me deu uma ideia..."
 court_events.3050.t:0 "À Mesa d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]"
 court_events.3060.a.tt:0 "... para enfiar uma faca nas minhas costas também!"
 court_events.3060.a:0 "Tantas possibilidades..."
 court_events.3060.b:0 "Coloque-os para trabalhar em vez disso!"
 court_events.3060.desc:0 "Onde quer que eu olhe, vejo pessoas vestindo minhas cores: apressando-se, fofocando, polindo armaduras antigas, trazendo comida, carregando mensagens...\n\nQuantos há hoje em dia? Eles vão e vêm como a maré, e acho impossível acompanhar rostos familiares! Em quem posso confiar?\n\nEnquanto estou perdido em minhas considerações, [spymaster.Custom2('MyCharacterIntroduction', ROOT.Char)] se aproxima de mim. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], vejo que está estudando os servos. Tantos deles! Em um mar sem rosto de pessoas, ninguém consegue acompanhar quem é quem. Seria tão fácil infiltrar agentes onde forem necessários... Claro, seus inimigos também poderiam se aproveitar disso, mas pense em todas as possibilidades...\""
 court_events.3060.t:0 "Um Mar Sem Rosto"
 court_events.3070.a:0 "Vamos ver o que você tem a oferecer."
 court_events.3070.b:0 "Eu abracei a humildade. Você deveria experimentar também."
 court_events.3070.c:0 "#EMP Como você se atreve?!#!"
 court_events.3070.desc:0 "Durante suas viagens, [guest.GetHerselfHimself] encontrou [Select_CString( guest.IsFemale, 'a', 'o' )] [guest.GetTitledFirstName] visitando minha corte. Até agora, [guest.GetSheHe] não ficou impressionado.\n\n\"Oh, vejo, isso é o que você considera \"moda\" por aqui... Perdoe-me, [ROOT.Char.Custom('FormOfAddressForLiege')], mas mal consigo distingui-lo de seus servos, tão humilde é seu traje! Talvez eu pudesse compartilhar alguns conselhos, se você permitir?\""
 court_events.3070.t:0 "Papel e Não Riquezas?"
 court_events.3080.a:0 "Você deverá escrever meus discursos."
 court_events.3080.b:0 "Sua expertise pode ajudar meus planos..."
 court_events.3080.c:0 "Escreva palavras doces como mel para meus amantes!"
 court_events.3080.d:0 "Não precisamos de suas habilidades agora."
 court_events.3080.desc:0 "[Select_CString( poet.IsFemale, 'A', 'O' )] [poet.GetWomanMan] que se junta à minha corte hoje tem um estilo excêntrico e um sorriso que transborda carisma e confiança.\n\n\"Glorios[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip], permita-me apresentar: meu nome é [poet.GetFirstNameNicknamed], e sou um poeta de habilidade inigualável! Minha renome se espalha por todo o continente, mas, nesta ocasião especial, decidi que meus dias de errante acabaram e gostaria de oferecer a você — [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] mais #EMP benevolente#! e #EMP magnífic[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]#! [ROOT.Char.GetLadyLord] de todos — meus serviços inestimáveis.\""
 court_events.3080.t:0 "Língua de Prata"
 court_events.3090.a:0 "Claro, vamos lá!"
 court_events.3090.b.tt:0 "Se você estudar muito agora, prometo que lhe darei o melhor cavalo de guerra quando você crescer!"
 court_events.3090.b.tt_effect:0 "[child.GetShortUIName|U] receberá um Cavalo de Guerra no aniversário de 16 anos"
 court_events.3090.b:0 "Estude agora — pônei depois!"
 court_events.3090.c:0 "Não tenho tempo para isso, [child.Custom('GetDaughterSon')]."
 court_events.3090.desc:0 "\"[ROOT.Char.GetMotherFather|U], você vai me ensinar a montar? Quero ser o maior guerreiro que já existiu!\"\n\nA voz entusiasmada de [child.GetFirstName] me encontra em um raro momento de tranquilidade entre meus muitos compromissos oficiais. A ambição de [child.GetHerHim] é um pouco prematura, mas [child.GetSheHe] é apenas uma criança, afinal de contas... qual o problema em entrar na brincadeira por um tempo?"
 court_events.3090.t:0 "Eu Quero um Ponei!"
 court_events.3091.a:0 "Vou fazer você se orgulhar!"
 court_events.3091.desc:0 "Meu décimo sexto aniversário não marca apenas minha passagem para a vida adulta, mas também a realização de uma promessa antiga que meu [parent.GetMotherFather] me fez.\n\nDurante anos, cumpri minha parte do acordo, estudando com afinco. Será que m[Select_CString( parent.IsFemale, 'inha', 'eu' )] [parent.GetMotherFather] se lembrará da parte [parent.GetHerHim]?\n\nAinda estou perdido em meus pensamentos quando [parent.Custom('GetMamaPapa')|U] surge do jardim, guiando um majestoso cavalo de guerra pela rédea. [parent.GetSheHe|U] se lembrou!"
 court_events.3091.desc_no_parent:0 "Parece que foi ontem que te surpreendi, [parent.GetMotherFather], declarando meu desejo de ser um grande guerreiro — só precisava aprender a montar primeiro.\n\nNa verdade... eu só queria passar mais tempo com você. Mas você, sabiamente, pensou no meu futuro. Estudei com dedicação desde aquele dia, como me pediu. Meu décimo sexto aniversário chegou, mas você não está mais aqui.\n\nConsegui um cavalo de guerra — exatamente como você me prometeu naquele dia — para honrar sua memória."
 court_events.3092.a:0 "De nada, [child.Custom('GetDaughterSon')]!"
 court_events.3092.desc:0 "Parece que foi ontem que você me surpreendeu, [child.GetFirstName], [Select_CString( child.IsFemale, 'uma pequena', 'um pequeno' )] [child.Custom('GirlBoy')] declarando com orgulho sua intenção de se tornar [Select_CString( child.IsFemale, 'uma grande guerreira', 'um grande guerreiro' )]!\n\nSorrindo, conduzo um majestoso cavalo de guerra pela rédea. “Naquele dia, prometi a você o melhor cavalo que já passou por nossas terras de [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], se se dedicasse aos estudos. Você se lembra?”\n\nO sorriso que toma conta do rosto [Select_CString( ROOT.Char.IsFemale, 'da minha filha', 'do meu filho' )] assim que [child.GetSheHe] monta no cavalo é todo o reconhecimento de que preciso."
 court_events.3100.a.tt:0 "Eu inicio um [scheme|E] de [GetScheme('learn_language').GetTypeName] contra [chancellor.GetShortUIName] com [GetModifier('pressured_to_learn_court_language_modifier').GetNameWithTooltip]"
 court_events.3100.a:0 "Acho que devo começar a estudar."
 court_events.3100.b:0 "[linguist.GetFirstNameNoTooltip], ensine-me!"
 court_events.3100.c:0 "Não tenho tempo para essa bobagem."
 court_events.3100.desc:0 "\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] temível [ROOT.Char.GetTitleAsNameNoTooltip], seu poder e glória estão além de qualquer dúvida, mas sua corte se sente ignorada, pois você simplesmente não fala a mesma língua que eles,\" [chancellor.Custom2('MyCharacterIntroduction', ROOT.Char)] começa nervosamente.\n\n\"Talvez, aprender [ROOT.Char.GetCourtLanguage.GetName] o aproxime mais do seu povo? Eu poderia oferecer minha humilde ajuda, se você permitir.\""
 court_events.3100.t:0 "Uma Língua para a Corte d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip|U]"
 court_events.3110.a.failure.tt:0 "Programa de Construção Falhou"
 court_events.3110.a.failure:0 "Seu programa de construção falha"
 court_events.3110.a.success.tt:0 "Programa de Construção Iniciado"
 court_events.3110.a.success:0 "Seu programa de construção começa com sucesso"
 court_events.3110.a:0 "Vou superar [vassal.GetSheHe]!"
 court_events.3110.architect:0 "Seu [GetCourtPositionType('royal_architect_court_position').GetName()] entra em ação"
 court_events.3110.b.failure.tt:0 "[vassal.GetShortUINameNoTooltip] não está em falta"
 court_events.3110.b.failure:0 "[vassal.GetTitleAsNameNoTooltip] está em posição irrepreensível"
 court_events.3110.b.success.tt:0 "[vassal.GetShortUINameNoTooltip] paga"
 court_events.3110.b.success:0 "Você encontra a desculpa perfeita"
 court_events.3110.b.tt:0 "Tenho certeza de que [vassal.GetSheHe] deve ter quebrado alguma lei em algum momento!"
 court_events.3110.b:0 "Multarei [vassal.GetSheHe] pesadamente."
 court_events.3110.c:0 "Bom para [vassal.GetSheHe], eu acho."
 court_events.3110.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] se aproxima de mim, preocupação estampada em seu rosto. \"Trago notícias preocupantes.\"\n\n\"[vassal.GetTitledFirstName|U] de [vassal.GetPrimaryTitle.GetBaseNameNoTier] tem construído sua capital de formas tão impressionantes que os plebeus começaram a compará-la com [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitly], e até se atreveram a achar a última insatisfatória!\"\n\n\"Uma forte demonstração de poder é a única maneira de manter a dignidade aqui, receio.\""
 court_events.3110.t:0 "O Melhor Construtor"
 court_events.3115.desc:0 "[relative.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim, preocupação estampada em seu rosto. \"Trago notícias preocupantes.\"\n\n\"A Casa [vassal.GetHouse.GetBaseName], sob a orientação d[Select_CString( vassal.IsFemale, 'a', 'o' )] [vassal.GetTitledFirstName], tem expandido sua propriedade familiar para refletir seu poder e riquezas além de nossas expectativas, ao ponto de nossa própria propriedade parecer insignificante em comparação!\"\n\nPrecisamos fazer algo, e rápido, se quisermos manter a dignidade!"
 court_events.3120.a.tt:0 "[artifact.GetName] receberá #V 2#! bônus #P aleatórios#!"
 court_events.3120.a:0 "Então faça algo melhor agora, [inspired.GetFirstNameNoTooltip]. Eu confio em você."
 court_events.3120.b:0 "Concentre-se na sua própria criação!"
 court_events.3120.c:0 "Mostre-me que você ainda pode fazer melhor!"
 court_events.3120.d:0 "Não incomode."
 court_events.3120.desc:0 "[inspired.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tem olhado para meu [artifact.GetName] por um tempo desconfortavelmente longo neste momento. A expressão de dor [inspired.GetHerHim] não sugere nada bom.\n\n\"O que há, [inspired.GetFirstNameNoTooltip]?! Fale!\" eu finalmente explodo.\n\n\"Desculpe-me, [ROOT.Char.Custom('FormOfAddressForLiege')], eu não quis incomodá-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. É só que este [artifact.GetType] é tão... #EMP amador?!# Não polido, não refinado, #EMP parecendo barato!#! Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] de sua posição merece melhor! #EMP Eu#! faria algo melhor..."
 court_events.3120.t:0 "Eu Poderia Fazer Melhor!"
 food_improves_feasts:0 "Cozinha Renomada"
 food_improves_feasts_desc:0 "$food_improves_feasts$: $VALUE|=+0$"
 food_improves_opinion:0 "$food_improves_feasts$"
 free_fashion_for_15_years:0 "$court_fashion_acceptable$ é #P grátis#! por 15 anos"
 gains_armor_inspiration_tt:0 "[inspired.GetShortUIName|U] ganha uma [inspiration|E] de Armadura"
 gains_artisan_inspiration_tt:0 "[inspired.GetShortUIName|U] ganha uma [inspiration|E] de Artesão"
 gains_smith_inspiration_tt:0 "[inspired.GetShortUIName|U] ganha uma [inspiration|E] de Ferreiro"
 gains_weapon_inspiration_tt:0 "[inspired.GetShortUIName|U] ganha uma [inspiration|E] de Arma"
 gains_weaver_inspiration_tt:0 "[inspired.GetShortUIName|U] ganha uma [inspiration|E] de Tecelão"
