l_spanish:
 court_events.1000.a.flavor:0 "E enriquece meu povo!"
 court_events.1000.a:0 "Somente a caridade compensa uma reputação de excesso..."
 court_events.1000.b.flavor:0 "E conduza meus cortesãos a me louvar como o mais grandioso dos soberanos!"
 court_events.1000.b:0 "\"Permaneçam aqui, na mais grandiosa das cortes.\""
 court_events.1000.c:0 "\"Conte a todos as maravilhas que viu aqui.\""
 court_events.1000.desc:0 "\"Ó grande [ROOT.Char.GetTitleAsNameNoTooltip]! Juntos, nós dois vagamos por todo o mundo conhecido,\" adula [guest.GetName], o primeiro de um par de renomados viajantes, \"Vimos domínios de prazer ensolarados! Grutas de gelo! Bebemos o leite da Palestina e nos alimentamos de orvalho de mel.\n\n\"Visitamos os acampamentos de khans, palácios de sultões, antigas salas... mas nenhum tribunal na terra se compara ao seu: nenhum igual em majestade e luxo!\"\n\nSeu companheiro [guest_2.GetName] realiza estranhas reverências estrangeiras, suplicando:\n\n\"Os confortos deste lugar — são além até mesmo das frivolidades [second_court.GetPrimaryTitle.GetAdjective]... sábi[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip], por favor, permita-nos mais vislumbres precoces de [guest_2.GetFaith.PositiveAfterLife]!\""
 court_events.1000.t:0 "O Mais Grandioso de Todos"
 court_events.1010.a.failure:0 "Os traidores são capturados e executados"
 court_events.1010.a.flavor:0 "Meu antiquário me conta sobre os grandes tesouros d[Select_CString( grander_ruler.IsFemale, 'a', 'o' )] [grander_ruler.GetTitleAsNameNoTooltip]... e um, em particular, que mãos ladrões poderiam fazer meu."
 court_events.1010.a.success:0 "Os desertores roubam o artefato de seu senhor feudal"
 court_events.1010.a:0 "\"Com sua astúcia... prove-me sua utilidade.\""
 court_events.1010.b:0 "Esses desertores conhecem bem os caminhos da refinamento."
 court_events.1010.c.flavor:0 "Se mãos mais úteis são necessárias para dirigir esta corte, meu [court_chaplain.GetCouncilTitle] poderia encontrar e supervisionar alguns que estão livres de pecado..."
 court_events.1010.c:0 "Clérigos habilidosos seriam melhores para dirigir esta corte."
 court_events.1010.d:0 "#EMP \"Corra para casa, você traiçoeiras baratas!\"#!"
 court_events.1010.desc:0 "Um cortesão [grander_ruler.GetPrimaryTitle.GetAdjectiveNoTooltip] se esgueira. [defector.GetSheHe|U] se curva diante de mim, olhando nervosamente para meus guardas.\n\n\"Venho de um lugar de esplendor,\" diz este bajulador, [defector.GetName], \"a corte de [grander_ruler.GetName].\"\n\n\"Se eu deixar o emprego [grander_ruler.GetHerHim], muitos funcionários viriam comigo. Meros insetos, mas com nosso labor diligente a corte se torna majestosa! E não desejamos continuar atados a aquel[Select_CString( grander_ruler.IsFemale, 'a', 'e' )] [grander_ruler.GetTitleAsNameNoTooltip] [grander_ruler.Custom2('InsultAdjective', SCOPE.sC('defector'))]...\"\n\n\"Ofereceríamos nosso serviço a #EMP você#!, Ó [ROOT.Char.GetTitleAsName].\""
 court_events.1010.t:0 "De Outra Formiga"
 court_events.1011.a:0 "#EMP Traidor!#!"
 court_events.1011.desc:0 "Eu, [defector.GetName], e muitos de seus servos sobrecarregados fugimos de seu serviço. Sem nossa expertise, sua corte logo se tornará as ruínas que você merece.\n\nVocê sempre foi mais [grander_ruler.Custom2('InsultNoun', SCOPE.sC('defector'))] do que um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] dign[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] senhor[Select_CString( ROOT.Char.IsFemale, 'a', '' )]. E assim seu substitut[Select_CString( root_scope.IsFemale, 'a', 'o' )], [root_scope.GetName], saboreará os confortos e glórias que você uma vez conheceu."
 court_events.1011.opening:0 "Meu antigo mestre,"
 traveling_friends_court_position_aptitude:0 "Esses amigos viajantes aumentaram [aptitude|E] quando ambos ocupam [court_positions|E]"
 visiting_gives_opinion:0 "Todo [ruler|E] que hospeda [Select_CString( guest.IsFemale, 'a', 'o' )] [guest.GetFirstName] ou [Select_CString( guest_2.IsFemale, 'a', 'o' )] [guest_2.GetFirstName] ganha #P 20#! [opinion|E] de #high você#! #EMP (Reputação)#!"
