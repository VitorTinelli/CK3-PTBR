l_spanish:
 7600_taking_child_to_hunt.tt:0 "Levar uma criança para caçar com segurança é uma responsabilidade que exige grande experiência. A [aptitude|E] do seu $master_of_hunt_court_position$ aumenta."
 7600_taking_child_to_hunt:0 "Levando Crianças para Caçar"
 court.7030.a:0 "Vamos estabelecer uma comunidade mercantil dos [foreign_merchant.GetCulture.GetCollectiveNounNoTooltip]."
 court.7030.b:0 "Um acordo pode ser firmado aqui."
 court.7030.c:0 "Vamos expandir as áreas mercantis para todos!"
 court.7030.d.tt:0 "Expulse [Select_CString( foreign_merchant.IsFemale, 'a', 'o' )] [foreign_merchant.GetFirstNameNoTooltip] de nosso reino e aproprie-se legitimamente do ouro que [foreign_merchant.GetSheHe] roubou de nossos próprios mercadores!"
 court.7030.d:0 "[foreign_merchant.GetCulture.GetCollectiveNounNoTooltip] não devem explorar nossos mercados!"
 court.7030.desc:0 "Enquanto observo minha corte, percebo m[Select_CString( steward.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetCouncillorPosition( 'councillor_steward' ).GetPositionName], [steward.GetTitledFirstName], em uma conversa animada com um dos meus convidados estrangeiros, [foreign_merchant.GetName]. Curioso, me aproximo do par.\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip], represento os interesses de um grupo mercantil dos meus compatriotas [foreign_merchant.GetCulture.GetName], que veem um grande potencial em estabelecer uma comunidade mercantil dos [foreign_merchant.GetCulture.GetCollectiveNounNoTooltip] aqui em [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier],\" declara [foreign_merchant.GetNameNoTooltip] de forma obsequiosa.\n\n\"[ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('steward'))|U], não devemos favorecer #EMP estrangeiros#! em detrimento de nosso próprio povo!\" protesta [Select_CString( steward.IsFemale, 'a', 'o' )] [steward.GetFirstNameNoTooltip]."
 court.7030.title:0 "Mercadores Estrangeiros"
 court.7040.a:0 "Ignore [ascetic.GetSheHe], [ascetic.GetSheHe] vai superar isso eventualmente."
 court.7040.b:0 "Envie [ascetic.GetSheHe] para [Select_CString( head_of_faith.IsFemale, 'a', 'o' )] [head_of_faith.GetTitledFirstNameNoTooltip], vamos ver o que [head_of_faith.GetSheHe] acha disso."
 court.7040.c:0 "A piedade de [ascetic.GetNamePossessiveNoTooltip] é inspiradora, vou imitar o exemplo [ascetic.GetHerHim]!"
 court.7040.d:0 "Se [ascetic.GetSheHe] quer viver em isolamento, [ascetic.GetSheHe] pode fazê-lo em outro lugar!"
 court.7040.desc:0 "Percebi que meu [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] está andando de um lado para o outro nervosamente na sala.\n\n\"[chaplain.GetName], qual é o problema?\" pergunto.\n\n\"É [ascetic.GetName], meu senhor feudal. [ascetic.GetSheHe|U] está escalando um pilar no pátio do palácio pela manhã e permanecendo lá o dia todo em contemplação silenciosa. [ascetic.GetSheHe] recusa comida e bebida, e diz relativamente pouco quando questionado. Práticas ascéticas como essa não são incomuns, mas isso está incomodando parte de sua corte, e eles estão me pedindo para fazer algo a respeito.\""
 court.7040.title:0 "Pilar da Comunidade"
 court.7050.a.tt:0 "Isso pode ter consequências não intencionais..."
 court.7050.a:0 "\"Claro, meu amigo, vou guardá-lo comigo para sempre!"
 court.7050.b:0 "\"Você é muito gentil, aceito seu presente!\""
 court.7050.c:0 "Eu sou [ROOT.Char.GetCulture.GetNameNoTooltip], não [friend.GetCulture.GetNameNoTooltip]! Rejeito seu presente."
 court.7050.desc:0 "Enquanto os assuntos da corte prosseguem, fiquei muito satisfeito ao ver o rosto do meu amigo [friend.GetName] entre dezenas de conspiradores e bajuladores. Cumprimentei [Select_CString( friend.IsFemale, 'a', 'o' )] [friend.GetFirstNameNoTooltip] calorosamente e conversei livremente com [friend.GetSheHe] como posso fazer com tão poucos outros. No meio de nossa conversa, [friend.GetSheHe] tira uma pequena bolsa de dentro de suas roupas e a coloca em minha mão.\n\n\"Um presente para você, meu amigo, algo para você lembrar dos bons tempos. É especial para mim e para o meu povo, os [friend.GetCulture.GetCollectiveNoun]. Espero que você aceite.\""
 court.7050.title:0 "Um Presente de um Amigo"
 court.7051.a.tt:0 "Apoie os [court_chaplain.GetFaith.GetAdherentNamePlural] em detrimento do seu amigo."
 court.7051.a:0 "Fui enganado por [ROOT.Char.GetFaith.DevilName]!"
 court.7051.b.tt:0 "Finja ignorância sobre o artefato."
 court.7051.b:0 "Símbolos? Ícones? Do que você está falando?"
 court.7051.c.failure:0 "Você não consegue convencer [court_chaplain.GetNameNoTooltip]"
 court.7051.c.success:0 "Você convence [court_chaplain.GetNameNoTooltip]"
 court.7051.c:0 "Você não consegue distinguir entre cultura e fé?"
 court.7051.d:0 "Vá embora, confio que [friend.GetNameNoTooltip] não me levará para o mau caminho!"
 court.7051.desc:0 "Desde que recebi [court_7050_artifact.GetName] como presente de [friend.GetName], tenho mantido comigo. Suponho que deve ter sido notado na corte, pois agora fui abordado pela [court_chaplain.GetCouncilTitle] [court_chaplain.GetName], que expressa sua preocupação de que eu esteja sendo desviado da verdadeira fé!\n\n\"Notei que você tem demonstrado seu afeto por símbolos e objetos hereges, coisas que estão associadas a religiões [court_chaplain.Custom('GetDerogatoryNonbeliever')]. Costuma-se dizer que [court_chaplain.GetFaith.DevilName] vem a nós disfarçado de amigo, apenas para nos desviar do caminho correto.\""
 court.7051.title:0 "Símbolos Hereges?"
 court.7070.a.tt:0 "[architect.GetFirstNameNoTooltip] buscará inspiração em outras [cultures|E] ao planejar a renovação do palácio, apresentando-lhe opções que podem aumentar a aceitação cultural em relação a outras [cultures|E]."
 court.7070.a:0 "Excelente sugestão, você pode elaborar planos."
 court.7070.b:0 "Tal extravagância é desnecessária, simples reformas serão suficientes."
 court.7070.c:0 "O palácio está bem como está!"
 court.7070.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], tenho discutido o estado atual de seu palácio em [palace_county.GetName] com seus cortesãos que têm sido hóspedes lá. Como seu $royal_architect_court_position$, seria negligente em meu dever se eu não o informasse que seu palácio em [palace_county.GetName] está precisando urgentemente de renovação!\" declara [architect.GetName].\n\n\"Eu me perguntava [ROOT.Char.Custom2('RelationToMeAddress',architect)], se poderíamos também aproveitar a oportunidade para renovar drasticamente a decoração e o estilo do palácio, talvez afastando-nos da arquitetura clássica [ROOT.Char.GetCulture.GetName] . Tudo o que eu preciso é de financiamento e algum tempo para elaborar algumas ideias\" pergunta [Select_CString( architect.IsFemale, 'a', 'o' )] [architect.GetFirstNameNoTooltip]."
 court.7070.title:0 "Potencial Palaciano"
 court.7071.a:0 "Vamos com o design [culture_option_1.GetProvince.GetCounty.GetCulture.GetNameNoTooltip]."
 court.7071.b:0 "Vamos usar o design [culture_option_2.GetProvince.GetCounty.GetCulture.GetNameNoTooltip]."
 court.7071.c:0 "Este palácio será um monumento à superioridade [ROOT.Char.GetCulture.GetNameNoTooltip]!"
 court.7071.continue:0 "O projeto continua..."
 court.7071.d:0 "Isso é demais, aborte o projeto."
 court.7071.desc:0 "Conforme prometido, [architect.GetName] retornou a mim com três planos detalhados para a proposta de renovação do palácio em [palace_county.GetName].\n\n\"Tirei inspiração dos estilos [culture_option_1.GetProvince.GetCounty.GetCulture.GetName] para o primeiro projeto, dos estilos [culture_option_2.GetProvince.GetCounty.GetCulture.GetName] para o segundo projeto e, para o plano final, mantive [ROOT.Char.GetCulture.GetName] como a influência principal, [ROOT.Char.Custom2('RelationToMeAddress',architect)].\"\n\nPelo que parece, os três designs são muito caros e incorporam novas adições, além de reformas na estrutura existente - isso provavelmente não será um trabalho rápido ou barato."
 court.7071.title:0 "Arquitetura da Imitatio"
 court.7072.a:0 "\"Magnífico, verdadeiramente magnífico!\""
 court.7072.b:0 "\"Uma aberração, eu odeio isso!\""
 court.7072.c:0 "\"Aceitável, mas valerá a despesa?\""
 court.7072.desc.other_culture:0 "Após meses de trabalho, fui informado de que as obras de construção no palácio em [palace_county.GetName] estão agora concluídas e viajei para [palace_county.GetNameNoTooltip] junto com meu $royal_architect_court_position$ [architect.GetName] para inspecionar pessoalmente os resultados.\n\nAo contemplar o novo palácio e, em seguida, adentrá-lo, [architect.GetFirstNameNoTooltip] permanece ao meu lado, esperando ansiosamente elogios e patrocínio. Após examinar o palácio com seus estilos desconhecidos e decoração estrangeira, eu o declaro..."
 court.7072.desc.own_culture:0 "Após meses de trabalho, fui informado de que as obras de construção no palácio em [palace_county.GetName] estão agora concluídas e viajei para [palace_county.GetNameNoTooltip] junto com meu $royal_architect_court_position$ [architect.GetName] para inspecionar pessoalmente os resultados. Ao contemplar o novo palácio e, em seguida, adentrá-lo, [architect.GetFirstNameNoTooltip] permanece ao meu lado, esperando ansiosamente elogios e patrocínio. Após examinar o palácio, com seus estilos familiares e decoração reconfortante, eu o declaro..."
 court.7072.title:0 "Renovações do Palácio Concluídas!"
 court.7100.a.tt:0 "Ordene [Select_CString( huntmaster.IsFemale, 'a', 'o' )] [huntmaster.GetFirstName] que se livre do animal imediatamente!"
 court.7100.a:0 "O que eu faria com [SCOPE.Custom('GetExoticPet')]?"
 court.7100.b:0 "Esta fera será meu animal de estimação adorado!"
 court.7100.c:0 "Por que não #EMP você #!fica com ela em vez disso?"
 court.7100.desc:0 "Todo tipo de estranhas ocorrências já aconteceu em minha corte, mas [Select_CString( huntmaster.IsFemale, 'a', 'o' )] $master_of_hunt_court_position$ [huntmaster.GetFirstName] liderando um #EMP [SCOPE.Custom('GetExoticPet')] #!até minha sala do trono com uma corrente não é algo que eu teria previsto, sinceramente.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], eu lhe apresento esta bela fera como presente, um prêmio de minha caçada mais recente! #EMP Todos os #!governantes hoje em dia têm animais exóticos em suas cortes para demonstrar sua majestade!\"\n\nEstá claro que [Select_CString( huntmaster.IsFemale, 'a', 'o' )] [huntmaster.GetFirstNameNoTooltip] quer que eu fique com essa criatura!"
 court.7100.title:0 "Fera Capturada"
 court.7200.a:0 "Apenas diminua a música durante a noite?"
 court.7200.b:0 "Leve sua #EMP arte #!e suma daqui!"
 court.7200.c:0 "Se sua música fosse melhor, não reclamaríamos!"
 court.7200.drum.desc:0 "\n\nRecentemente, m[Select_CString( loud_musician.IsFemale, 'inha', 'eu' )] $court_musician_court_position$ [loud_musician.GetFirstName] adquiriu um novo instrumento, algum tipo de tambor, e tem batido nele alto o tempo todo, seja de dia ou de noite."
 court.7200.guitar.desc:0 "\n\nRecentemente, m[Select_CString( loud_musician.IsFemale, 'inha', 'eu' )] $court_musician_court_position$ [loud_musician.GetFirstName] obteve um novo instrumento, uma cítola eu acredito, e tem tocado-o alto o tempo todo, seja de dia ou de noite."
 court.7200.intro.desc:0 "Eu me orgulho do luxo de minha corte, mas por várias noites, esse luxo tem se transformado em uma tortura musical exquisita."
 court.7200.outro.desc:0 "\n\nQuando confrontad[Select_CString( loud_musician.IsFemale, 'a', 'o' )] [loud_musician.GetFirstNameNoTooltip], [loud_musician.GetSheHe] declara: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], eu estou apenas praticando minha arte, para que eu possa ser o $court_musician_court_position$ que você merece!\""
 court.7200.pipes.desc:0 "\n\nRecentemente, m[Select_CString( loud_musician.IsFemale, 'inha', 'eu' )] $court_musician_court_position$ [loud_musician.GetFirstName] adquiriu um novo instrumento, algum tipo de conjunto de tubos, e tem tocado-o desafinadamente o dia e a noite toda."
 court.7200.title:0 "Alto e Orgulhoso"
 court.7200.trombone.desc:0 "\n\nRecentemente, m[Select_CString( loud_musician.IsFemale, 'inha', 'eu' )] $court_musician_court_position$ [loud_musician.GetFirstName] obteve um novo instrumento, algum tipo de trombone de latão, e tem tocado-o alto o tempo todo, seja de dia ou de noite."
 court.7300.a:0 "#EMP Mesa de camponês? #!Precisamos resolver isso imediatamente!"
 court.7300.b:0 "A comida está boa, do que você está falando?"
 court.7300.c:0 "Ótimo, vou encontrar outra pessoa para ser paga para comer minha comida!"
 court.7300.desc:0 "Tentativas contra minha vida são esperadas, e portanto as pessoas em quem confio para a segurança devem permanecer leais e bem-dispostas para comigo. Hoje, no entanto, m[Select_CString( taster.IsFemale, 'inha', 'eu' )] designad[Select_CString( taster.IsFemale, 'a', 'o' )] $food_taster_court_position$ [taster.GetFirstName] parece absolutamente enojado, e um pouco pálido, enquanto verifico como está [taster.GetSheHe].\n\n \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], eu simplesmente não consigo mais suportar. A comida que sua corte serve é absolutamente #EMP vilânica!#! Não consigo acreditar que você come esse mingau #EMP noite após noite após noite...\"#!\n\n\"...Esse entulho é mal adequado até para a mesa de um camponês!\""
 court.7300.t:0 "Onde Está o Molho de Cordeiro?"
 court.7400.a.tt:0 "Certamente eles terão utilidade em algum momento, não é mesmo?"
 court.7400.a:0 "Deixe [guest.GetSheHe] ficar."
 court.7400.b.tt:0 "Empregue [guest.GetSheHe] em uma posição servil na sua corte."
 court.7400.b:0 "Eu sei o trabalho perfeito para [guest.GetSheHe]..."
 court.7400.c:0 "Parasita repugnante, volte para onde veio!"
 court.7400.desc:0 "Minha corte tornou-se conhecida pelo nível luxuoso de hospitalidade oferecida, e os convidados aqui frequentemente se mostram... úteis.\n\nDe vez em quando, porém, recebemos #EMP convidados redundantes #!na corte, cujo propósito é incerto e cuja presença é um dreno desnecessário no meu tesouro.\n\nUm desses aproveitadores é [Select_CString( guest.IsFemale, 'a', 'o' )] [guest.GetFirstName], que tem estado aqui por algum tempo como convidad[Select_CString( guest.IsFemale, 'a', 'o' )] d[Select_CString( guest_liege.IsFemale, 'a', 'o' )] [guest_liege.GetTitledFirstName] e parece comer o suficiente para doze pessoas.\n\n[guest.GetSheHe] está me levando à falência com suas refeições, e algo #EMP precisa#! ser feito."
 court.7400.title:0 "Excedendo a Hospitalidade?"
 court.7600.a:0 "Essas saídas serão substituídas por estudos mais proveitosos."
 court.7600.b.death:0 "[child.GetNameNoTooltip] morre durante a caçada"
 court.7600.b.tt:0 "Instrua [huntmaster.GetNameNoTooltip] a levar [child.GetNameNoTooltip] ao limite em outra caçada."
 court.7600.b.victory:0 "Caçada bem-sucedida para [child.GetNameNoTooltip]"
 court.7600.b.wounding:0 "[child.GetNameNoTooltip] fica ferido durante a caçada"
 court.7600.b:0 "Hmm, talvez devamos testar mais as habilidades [Select_CString( child.IsFemale, 'da minha', 'do meu' )] [child.Custom('GetDaughterSon')]..."
 court.7600.c:0 "Eu não poderia estar mais orgulhoso!"
 court.7600.desc:0 "M[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('GetDaughterSon')] [child.GetName] entra na sala do trono com lama e sangue cobertos em todo o seu rosto. Eu me levanto em consternação, pretendendo repreender [child.GetSheHe] pela impropriedade, quando [Select_CString( huntmaster.IsFemale, 'a', 'o' )] $master_of_hunt_court_position$ [huntmaster.GetFirstName] entra, igualmente enlameado e manchado de sangue, sorrindo de orelha a orelha.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], [child.GetTitledFirstNameNoTooltip] aqui derrubou um poderoso(a) [child.Custom('GetAnimalType')] durante nossa caça, talvez o melhor que já vi este ano.\"\n\nEu suponho que as aulas de caça d[Select_CString( child.IsFemale, 'a', 'o' )] [child.GetFirstNameNoTooltip] estão indo bem, mas não consigo deixar de me perguntar se não haveria maneiras mais produtivas de investir o tempo [child.GetHerHim]."
 court.7600.t:0 "Indomável por Coração"
 court.7610.a:0 "Uma escolha audaciosa!"
 court.7610.b:0 "Que tal algo... menor?"
 court.7610.c:0 "Não seja ridícul[Select_CString( child.IsFemale, 'a', 'o' )]."
 court.7610.desc:0 "M[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('GetDaughterSon')] [child.GetName] está crescendo, e um dia será esperado que [child.GetSheHe] assuma um papel elevado na sociedade. Aparentemente, [child.GetSheHe] decidiu que hoje é o dia.\n\n\"[ROOT.Char.GetMotherFather|U], posso ter um destrier?\"\n\n#EMP Um cavalo de guerra?#! Para uma #EMP criança?!#! Enquanto pondero o pedido, percebo $master_of_horse_court_position$ [horsemaster.GetName] me lançando um olhar de soslaio do outro lado da sala do trono.\n\nPelo menos agora sei com quem m[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('GetDaughterSon')] tem conversado ultimamente..."
 court.7610.title:0 "Um Pedido Estável"
 court.7620.a.failure:0 "Você não consegue negociar com sucesso com [falconer.GetShortUINameNoTooltip]"
 court.7620.a.success:0 "Você consegue negociar com sucesso com [falconer.GetShortUINameNoTooltip]"
 court.7620.a:0 "[falconer.GetFirstNameNoTooltip], você sabe que está pedindo demais!"
 court.7620.b:0 "Venha, farei uma oferta melhor para você."
 court.7620.c:0 "Apenas mantenha-o fora da minha sala do trono, está bem?"
 court.7620.desc:0 "Nos cantos da minha sala do trono, posso ouvir $master_of_hunt_court_position$ [huntmaster.GetName] envolvido em uma negociação intensa com [falconer.GetName] pela venda de um belo falcão peregrino, uma ave altamente prestigiada para qualquer pessoa possuir.\n\n[huntmaster.GetFirstNameNoTooltip] parece estar preso em uma discussão sobre o preço, com o falcoeiro se recusando a ceder, e pela frustração em suas vozes, eles estão nisso há um #EMP tempo#!.\n\nTalvez eles apreciassem a intervenção [Select_CString( ROOT.Char.IsFemale, 'da sua', 'do seu' )] [ROOT.Char.GetTitleAsNameNoTooltip]... tanto quanto eu apreciaria um novo pássaro."
 court.7620.title:0 "Pássaros de Penas Douradas"
 court.7630.a:0 "A vitória pertence [Select_CString( horsemaster.IsFemale, 'a', 'ao' )] [horsemaster.GetFirstNameNoTooltip]."
 court.7630.b:0 "Isso foi um sucesso d[Select_CString( huntmaster.IsFemale, 'a', 'o' )] [huntmaster.GetFirstNameNoTooltip]."
 court.7630.c.failure:0 "Você só piora as coisas"
 court.7630.c.success:0 "Você consegue encontrar o meio-termo com sucesso"
 court.7630.c.tt:0 "Tente convencer o [horsemaster.GetShortUIName] e o [huntmaster.GetShortUIName] de que ambos são vencedores:"
 court.7630.c:0 "Por que vocês dois não podem compartilhar esse triunfo?"
 court.7630.desc:0 "A caça parece trazer à tona o pior em meu círculo interno de cortesãos. Meu $master_of_horse_court_position$ [horsemaster.GetName] e meu $master_of_hunt_court_position$ [huntmaster.GetName] retornaram recentemente de uma caçada juntos e agora estão envolvidos em uma acalorada discussão no meio da minha sala do trono.\n\n\"Minha ave atraiu, ela deve ter feito a captura!\" grita [Select_CString( horsemaster.IsFemale, 'a', 'o' )] [horsemaster.GetFirstNameNoTooltip].\n\n\"Minha ave tinha o cadáver, não há dúvida de que a glória é minha!\" exclama [Select_CString( huntmaster.IsFemale, 'a', 'o' )] [huntmaster.GetFirstNameNoTooltip].\n\nEles parecem furiosos sobre qual falcão foi responsável pela captura."
 court.7630.title:0 "Aves de Rapina"
 court.7640.a:0 "É apenas um pássaro, deixe [avian_abuser.GetSheHe] ir."
 court.7640.b:0 "Prendam esse #EMP canalha!#!"
 court.7640.c:0 "Multa para esse #EMP malfeitor!#!"
 court.7640.d:0 "Chicotada nesse #EMP vira-lata!#!"
 court.7640.desc:0 "\"Prendam [avian_abuser.GetSheHe]!\" $master_of_hunt_court_position$ [huntmaster.GetFirstName] brada, apontando para [avian_abuser.GetName]. Minha guarda pessoal avança hesitante, incerta se deve seguir as ordens d[Select_CString( huntmaster.IsFemale, 'a', 'o' )] [huntmaster.GetFirstNameNoTooltip]. Eu levanto minha mão para detê-los e pergunto [Select_CString( huntmaster.IsFemale, 'a', 'ao' )] [huntmaster.GetFirstNameNoTooltip] o que deu a [huntmaster.GetSheHe] motivo para causar tamanha comoção.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], esse #EMP monstro#! danificou deliberadamente o falcão [avian_abuser.GetHerHim] durante nossa última caçada! [avian_abuser.GetSheHe|U] deve ser punido severamente, a honra #EMP exige#!.\""
 court.7640.title:0 "Abuso Aviário"
 court.7700.a:0 "Ladrão! Guardas, prendam esse patife!"
 court.7700.b.tt:0 "Aproveite isso para ajudar seu [scheme.GetName] em andamento."
 court.7700.b:0 "Você poderia descobrir mais sobre [Select_CString( scheme.GetTargetCharacter.IsFemale, 'a', 'o' )] [scheme.GetTargetCharacter.GetTitledFirstNameNoTooltip]?"
 court.7700.c:0 "Que enganação deliciosamente traiçoeira..."
 court.7700.d:0 "Tal trapaça está abaixo de mim."
 court.7700.desc:0 "Hoje, no ombro de [spymaster.Custom2('MyCharacterIntroduction', ROOT.Char)], pousa um corvo de aparência curiosa. Usando o burburinho da sala do trono para proteger nossa conversa de ouvidos curiosos, [spymaster.GetFirstNameNoTooltip] exalta as qualidades incríveis do pássaro para mim.\n\n\"Ela é uma ladrã habilidosa, [Select_CString( ROOT.Char.IsFemale, 'minha senhora feudal', 'meu senhor feudal' )]. Ela não rouba ouro ou joias, mas notas, chaves e cartas — todas as pequenas coisas que contêm verdades desconfortáveis que seus donos desejam esconder.\""
 court.7700.t:0 "Aventure-se"
