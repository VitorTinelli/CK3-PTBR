l_spanish:
 ceremonial_petition_prefix:0 "Petição Cerimonial:"
 court_ceremonial.1000.a:0 "Aceito graciosamente seu sincero pedido."
 court_ceremonial.1000.b:0 "Talvez se você oferecesse seu apoio à [ROOT.Char.GetConfederation.GetName]?"
 court_ceremonial.1000.c:0 "Um favor real não deve ser esquecido."
 court_ceremonial.1000.d:0 "Tenho certeza de que você possui presentes generosos para oferecer em troca."
 court_ceremonial.1000.desc:0 "Como chefe de uma família orgulhosa de servir tão de perto, humilde e fielmente, a [petition_vassal.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTooltip], [Select_CString( petition_vassal.IsFemale, 'uma orgulhosa', 'um orgulhoso' )] [petition_vassal.GetDynasty.GetName], solicito seu apoio como regente do reino."
 court_ceremonial.1000.e:0 "Isso não será possível."
 court_ceremonial.1000.f:0 "Sim, em troca do serviço [Select_CString( knight.IsFemale, 'da', 'do' )] [knight.GetFirstNamePossessiveNoTooltip]."
 court_ceremonial.1000.g:0 "[monk.GetFirstNameNoTooltip] seria um[Select_CString( monk.IsFemale, 'a', '' )] excelente [GetTrait('devoted').GetName( monk )]."
 court_ceremonial.1000.h:0 "Vamos resolver nossos antigos acordos."
 court_ceremonial.1000.opening:0 "[petition_vassal.GetTitledFirstName] avança, curvando-se profundamente diante da corte reunida, enquanto a petição escrita à mão por [petition_vassal.GetSheHe] é entregue a mim por meus assistentes.\n\n[petition_vassal.GetSheHe|U] fala de forma clara e direta: \"Majestos[Select_CString( petition_liege.IsFemale, 'a', 'o' )] [petition_liege.GetTitleAsName], venho hoje humildemente solicitar sua intercessão em um assunto importante.\"\n\n"
 court_ceremonial.1000.t:0 "$ceremonial_petition_prefix$ Apoio do Regente"
 court_ceremonial.1100.desc:0 "\"Como chefe de uma família orgulhosa de servir tão de perto, humilde e fielmente, a [petition_vassal.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTooltip], [Select_CString( petition_vassal.IsFemale, 'uma orgulhosa', 'um orgulhoso' )] [petition_vassal.GetDynasty.GetName], solicito o apoio real para servir como governadores.\""
 court_ceremonial.1100.t:0 "$ceremonial_petition_prefix$ Apoio à Governadoria"
 court_ceremonial.1200.desc:0 "\"Como chefe de uma das principais famílias do reino, [Select_CString( petition_vassal.IsFemale, 'uma orgulhosa', 'um orgulhoso' )] [petition_vassal.GetDynasty.GetName], solicito seu assentimento formal para um casamento com sua casa mais ilustre e santificada.\""
 court_ceremonial.1200.t:0 "$ceremonial_petition_prefix$ Casamento Real"
 court_ceremonial.1300.desc:0 "\"Como chefe de uma das principais famílias do reino, [Select_CString( petition_vassal.IsFemale, 'uma orgulhosa', 'um orgulhoso' )] [petition_vassal.GetDynasty.GetName], solicito seu reconhecimento formal da nobre linhagem e pedigree de minha casa entre a nobreza [petition_vassal.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip].\""
 court_ceremonial.1300.t:0 "$ceremonial_petition_prefix$ Dignidade [petition_vassal.GetHouse.GetBaseNameNoTooltip]"
