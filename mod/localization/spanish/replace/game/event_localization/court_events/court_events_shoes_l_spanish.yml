l_spanish:
 court.1000.a.tt:0 "Dar um exemplo com [Select_CString( child.IsFemale, 'a', 'o' )] [child.GetFirstName] pode evitar que outros cortesãos ajam de maneira semelhante"
 court.1000.a:0 "Esse comportamento é inaceitável... [child.GetSheHe] deve ser punido. Humilhado, até."
 court.1000.b.failure:0 "[child.GetFirstNameNoTooltip] continua a se entregar aos vícios depois do trabalho"
 court.1000.b.success:0 "As novas responsabilidades d[Select_CString( child.IsFemale, 'a', 'o' )] [child.GetFirstNameNoTooltip] [Select_CString( child.IsFemale, 'a', 'o' )] mantêm ocupad[Select_CString( child.IsFemale, 'a', 'o' )]"
 court.1000.b:0 "[child.GetSheHe|U] só precisa de responsabilidade, algo importante para cuidar!"
 court.1000.c.tt:0 "Ser permissivo com [Select_CString( child.IsFemale, 'a', 'o' )] [child.GetFirstName] pode incentivar outros cortesãos a agir de maneira semelhante"
 court.1000.c:0 "Ha! [child.GetSheHe] sabe aproveitar as coisas boas da vida!"
 court.1000.desc.drunkard:0 "passar seus dias na taverna, afogando-se em um suprimento infinito de [child.Custom('RegionalAlcoholicDrink')]."
 court.1000.desc.ending:0 "\n\nOs enviados estrangeiros começaram a notar o comportamento [child.GetHerHim], e não posso deixar de me perguntar quais rumores estão sendo sussurrados sobre [child.GetSheHe] em cortes distantes..."
 court.1000.desc.hashishiyah:0 "passar seus dias isolado em algum canto, completamente fora de si com um suprimento interminável de bolos de haxixe."
 court.1000.desc.opening:0 "Protegido em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] com todas as suas necessidades atendidas, [child.Custom2('MyCharacterIntroduction', ROOT.Char)] tem mostrado pouca inclinação para fazer qualquer coisa além de"
 court.1000.desc.rakish:0 "passar seus dias no bordel, \"entretendo\" uma sequência infinita de \"convidados\"."
 court.1000.t:0 "Crescendo da Devassidão"
 court.1001.title:0 "[courtier.GetFirstName] Abraça a Devassidão"
 court.1010.a:0 "[courtier.GetSheHe|U] não é adequada para nada — e nunca será."
 court.1010.b:0 "[courtier.GetFirstNameNoTooltip] pode se recuperar sóbrio nas masmorras!"
 court.1010.c.failure:0 "[courtier.GetFirstNameNoTooltip] não muda seu comportamento."
 court.1010.c.success:0 "[courtier.GetFirstNameNoTooltip] desiste de beber... pelo menos em excesso."
 court.1010.c:0 "Uma conversa séria irá colocar [courtier.GetSheHe] no caminho certo."
 court.1010.d:0 "Se [Select_CString( courtier.IsFemale, 'a', 'o' )] [courtier.GetFirstNameNoTooltip] deseja agir como um[Select_CString( courtier.IsFemale, 'a', '' )] tol[Select_CString( courtier.IsFemale, 'a', 'o' )], então um[Select_CString( courtier.IsFemale, 'a', '' )] tol[Select_CString( courtier.IsFemale, 'a', 'o' )] [courtier.GetSheHe] será!"
 court.1010.desc:0 "As palhaçadas bêbadas de [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] já foram assunto de fofocas antes, mas ultimamente [courtier.GetSheHe] parece ter elevado isso a um novo nível.\n\nFicar bêbado até o meio da manhã, desmaiar no pátio da [courtier.Custom('ResidenceBuilding')], tropeçar até a taverna à tarde e acordar com ressaca no estábulo no dia seguinte... O comportamento degenerado d[Select_CString( courtier.IsFemale, 'a', 'o' )] [courtier.GetFirstNameNoTooltip] é uma vergonha para todos que residem em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 court.1010.e:0 "Deixe os outros zombarem [courtier.GetHerHim]... [ROOT.Char.GetFaith.NegativeAfterLife], eu vou rir com eles!"
 court.1010.t:0 "Beber durante o Dia"
 court.1020.a:0 "Será feito."
 court.1020.b:0 "[fugitive.GetFirstNameNoTooltip] é meu convidad[Select_CString( fugitive.IsFemale, 'a', 'o' )] — e está sob minha proteção."
 court.1020.c:0 "[fugitive.GetFirstNameNoTooltip]? Não há nenhum[Select_CString( fugitive.IsFemale, 'a', '' )] [fugitive.GetFirstNameNoTooltip] hospedad[Select_CString( fugitive.IsFemale, 'a', 'o' )] aqui..."
 court.1020.desc.forgive_all:0 "e eu perdoarei essa ofensa, bem como as anteriores."
 court.1020.desc.forgive_this:0 "e eu perdoarei essa ofensa."
 court.1020.desc.gold:0 "e eu o compensarei pelos problemas."
 court.1020.desc.opinion:0 "e eu lembrarei de sua cooperação por anos."
 court.1020.desc:0 "Chegou ao meu conhecimento que um[Select_CString( fugitive.IsFemale, 'a', '' )] fugitiv[Select_CString( fugitive.IsFemale, 'a', 'o' )] fora da lei, [fugitive.GetTitledFirstName], está se escondendo em sua corte. Entregue-o para enfrentar a minha justiça, "
 court.1020.opening:0 "[foreign_ruler.Custom2('AppropriateGreeting', ROOT.Char)]"
 court.1030.a:0 "[chaplain.GetFirstNameNoTooltip] é um[Select_CString( chaplain.IsFemale, 'a', '' )] [chaplain.GetWomanMan] de [chaplain.GetFaith.HighGodName]. Vamos tratá-lo como tal."
 court.1030.b.custom:0 "Todos os outros cortesãos"
 court.1030.b.flavor:0 "...ou então [chaplain.GetSheHe] irá comer com os porcos na pocilga!"
 court.1030.b:0 "[chaplain.Custom('GetActualBishopTitle')] ou não, [chaplain.GetFirstNameNoTooltip] #EMP irá#! aprender boas maneiras..."
 court.1030.c:0 "Ah, vamos lá, como se todos nós nunca tivéssemos soltado um antes?"
 court.1030.desc:0 "#EMP BUrRRP#!\n\nÀ medida que o arroto alto ecoa pelo salão de jantar, toda a conversa para abruptamente. [chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] bate em sua barriga e sorri. \"Ahh, é melhor sair do que ficar dentro, meu pai sempre dizia!\"\n\nVários cortesãos trocam olhares incrédulos, antes que [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] olhe diretamente para mim e exclame: \"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip], isso foi totalmente inapropriado! Certamente, você deve concordar, não é mesmo?\""
 court.1030.t:0 "Más Maneiras"
 court.placeholder_court_grandeur_loss:0 "Você perde #V 10#! Grandeza da Corte"
