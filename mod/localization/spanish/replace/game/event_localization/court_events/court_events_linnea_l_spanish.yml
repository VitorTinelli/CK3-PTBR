l_spanish:
 court.5001.a:0 "Vou arranjar mais tempo para [friend.GetHerHim]."
 court.5001.b:0 "\"Sabe o que você precisa? De um[Select_CString( friend.IsFemale, '', 'a' )] [friend.Custom('WifeHusbandOpp')].\""
 court.5001.c_cat:0 "\"Você... Você pode ter [ROOT.Char.Custom('CatStoryName')].\""
 court.5001.c_dog:0 "\"Você... Você pode ter [ROOT.Char.Custom('DogStoryName')].\""
 court.5001.d:0 "[friend.GetSheHe|U] precisa de uma tarefa para se ocupar."
 court.5001.desc:0 "[friend.Custom2('MyCharacterIntroduction', ROOT.Char)|U] está terrivelmente entediad[Select_CString( friend.IsFemale, 'a', 'o' )]; consigo ver isso em seu rosto e na maneira como [friend.GetSheHe] busca minha atenção a todo momento.\n\nEu sei que meus deveres consomem muito do meu tempo e deixam [friend.GetSheHe] solitári[Select_CString( friend.IsFemale, 'a', 'o' )] às vezes..."
 court.5001.t:0 "Dias Solitários"
 court.5010.a:0 "Acabe com essa bobagem, [family_member.GetSheHe] está mort[Select_CString( family_member.IsFemale, 'a', 'o' )] e se foi!"
 court.5010.b:0 "É uma honra que [family_member.GetSheHe] nos visite, não perturbe [family_member.GetSheHe]."
 court.5010.c:0 "Vou pedir que alguém investigue isso."
 court.5010.desc:0 "Cada vez mais criados de olhos arregalados me procuram, alegando ter visto [family_member.Custom2('MyCharacterIntroduction', ROOT.Char)] andando pelos corredores.\n\n\"[family_member.GetSheHe|U] não encontra descanso, [ROOT.Char.Custom('FormOfAddressForLiege')]. É por isso que [family_member.GetSheHe] assombra o lugar de seu falecimento!\""
 court.5010.t:0 "O Assombro"
 court.5020.a:0 "Obviamente, é o travesseiro da [ROOT.Char.Custom('CatStoryNamePossessive')] agora."
 court.5020.b:0 "Vou garantir que [ROOT.Char.Custom('CatStoryNameSheHe')] se mantenha afastada."
 court.5020.desc:0 "[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim freneticamente, com olheiras profundas sob os olhos.\n\n\"Essa maldita gata sua se recusa a sair do meu aposento; parece que meu travesseiro é o melhor lugar para dormir em todo o maldito [ROOT.Char.Custom('ResidenceBuilding')]. Essa criatura precisa ser controlada!\" [courtier.GetFirstNameNoTooltip] pausa antes de se acalmar visivelmente, \"Se isso agradar [Select_CString( ROOT.Char.IsFemale, 'a', 'ao' )] [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord].\""
 court.5020.t:0 "Conversa de Travesseiro"
 court.5021.a:0 "Onde [ROOT.Char.Custom('CatStorySheHe')] pode estar?"
 court.5021.a_mittens:0 "Que lindas luvas – Oh não, #EMP [ROOT.Char.Custom('CatStoryName')]#!!"
 court.5021.b:0 "[courtier.GetFirstNameNoTooltip] também irá desaparecer."
 court.5021.c:0 "\"Seu destino será semelhante ao de [ROOT.Char.Custom('CatStoryNamePossessive')].\""
 court.5021.desc:0 "Vejo [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] do outro lado da sala; [courtier.GetSheHe] tem estado de bom humor ultimamente, e as olheiras profundas sob seu olhos desapareceram.\n\nO que me preocupa é que minha querida [ROOT.Char.Custom('CatStoryName')] parece ter desaparecido ao mesmo tempo..."
 court.5021.desc_mittens:0 "\n\n[courtier.GetFirstNameNoTooltip] me vê olhando e acena para mim, com luvas novas de [ROOT.Char.Custom('CatFurColor')] claramente visíveis."
 court.5025.a:0 "[ROOT.Char.Custom('CatStorySheHe')|U] é seu!"
 court.5025.b:0 "Como você ousa, eu nunca venderia [ROOT.Char.Custom('CatStoryName')]!"
 court.5025.desc:0 "\"Essa pelagem brilhante de [ROOT.Char.Custom('CatFurColor')] e aqueles olhos [ROOT.Char.Custom('CatEyeColor')]... Eu nunca vi um felino tão bonito!\"\n\n[comprador.Custom2('MyCharacterIntroduction', ROOT.Char)|U] acaricia [ROOT.Char.Custom('CatStoryName')] pensativamente antes de se voltar para mim. \"[ROOT.Var('price_for_pet').GetValue|0] de ouro deve ser suficiente, não é mesmo?\""
 court.5025.t:0 "Acordo Proposto"
 court.5026.a:0 "[ROOT.Char.Custom('DogStorySheHe')|U] é seu!"
 court.5026.b:0 "Como você ousa, eu nunca venderia [ROOT.Char.Custom('DogStoryName')]!"
 court.5026.desc:0 "\"Essa pelagem brilhante de [ROOT.Char.Custom('DogFurColor')] e bem treinado ainda! Eu nunca vi um cão tão magnífico!\"\n\n[comprador.Custom2('MyCharacterIntroduction', ROOT.Char)|U] acaricia [ROOT.Char.Custom('DogStoryName')] pensativamente antes de se voltar para mim. \"[ROOT.Var('price_for_pet').GetValue|0] de ouro deve ser suficiente, não é mesmo?\""
 court.5030.a:0 "Traga-me o meu [ROOT.Char.Custom('child_favorite_toy')]."
 court.5030.b:0 "Não, eu tenho que estudar."
 court.5030.b_young:0 "Não, eu tenho que ser séria."
 court.5030.desc:0 "Tenho ouvido as pessoas resmungarem e reclamarem o dia todo e estou tão #EMP entediada#! que não consigo evitar que minha atenção se desvie para o jogo que [child.GetSheHe] está brincando..."
 court.5030.desc_ending:0 "\n\n[child.GetFirstNameNoTooltip] me vê olhando e acena para eu me juntar a [child.GetSheHe]."
 court.5030.desc_opening:0 "Do outro lado da sala, vejo [child.Custom2('MyCharacterIntroduction', ROOT.Char)] brincando com seu brinquedo favorito, [child.Custom('child_favorite_toy')]."
 court.5030.desc_young:0 "Os adultos ao meu redor estão sempre infelizes e querem que eu os ajude, mas eu prefiro ajudar a derrotar o temível dragão com o qual [child.GetSheHe] parece estar lutando!"
 court.5030.t:0 "Hora de Brincar"
 court.5040.a:0 "Devo resistir e me comportar como [Select_CString( ROOT.Char.IsFemale, 'uma verdadeira', 'um verdadeiro' )] [ROOT.Char.GetLadyLord]."
 court.5040.b:0 "Uma bexiga inflada na cadeira d[Select_CString( prank_alternative_1.IsFemale, 'a', 'o' )] [prank_alternative_1.GetFirstNameNoTooltip] – isso sim é atenção!"
 court.5040.c:0 "[prank_alternative_2.GetFirstNameNoTooltip] soltando um pum não seria nada entediante."
 court.5040.d:0 "[prank_alternative_3.GetFirstNameNoTooltip] encontrará uma bexiga em sua cadeira em vez de um prato!"
 court.5040.desc:0 "Mais uma vez, sou obrigada a ouvir as pessoas reclamarem – [prank_alternative_1.Custom2('MyCharacterIntroduction', ROOT.Char)] quer atenção, [prank_alternative_2.Custom2('MyCharacterIntroduction', ROOT.Char)] alega que minha corte ficou entediante, e [prank_alternative_3.Custom2('MyCharacterIntroduction', ROOT.Char)] acha que temos comido muitas refeições contendo bexigas de animais ultimamente, de todas as coisas.\n\n...Espere, tenho uma ideia."
 court.5040.t:0 "Brincadeira de Travessuras"
 court.5041.a:0 "Vou parar e consolar [prank_target.GetSheHe]."
 court.5041.desc_opening:0 "#EMP Brrt!#!\n\nO som rasga o corredor quando [prank_target.Custom2('MyCharacterIntroduction', ROOT.Char)] se senta, e o rosto [prank_target.GetHerHim] fica cada vez mais vermelho à medida que o silêncio se arrasta. Eu luto para conter minha risada, mas se eu quero pregar uma peça n[prank_target.GetSheHe] novamente, preciso evitar suspeitas!"
 court.5041.desc_option_1:0 "Enquanto [Select_CString( prank_target.IsFemale, 'a', 'o' )] [prank_target.GetTitledFirstName] está distraíd[Select_CString( prank_target.IsFemale, 'a', 'o' )] durante o jantar, eu espalho cuidadosamente pequenos pedaços de corda de lira em seu prato.\n\nMal consigo conter meu riso quando [prank_target.GetSheHe] se vira e encontra o prato [prank_target.GetHerHim] cheio de larvas, mas preciso evitar suspeitas se quero continuar essa cruzada!"
 court.5041.desc_option_2:0 "Eu sequei o sangue de um bezerro e o transformei em pó, que eu então espalho no bife d[Select_CString( prank_target.IsFemale, 'a', 'o' )] [prank_target.GetTitledFirstName] quando [prank_target.GetSheHe] não está olhando. Instantaneamente, o pó se liquefaz em sangue, e é tudo o que posso fazer para não rir quando o rosto d[Select_CString( prank_target.IsFemale, 'a', 'o' )] [prank_target.GetFirstNameNoTooltip] se contorce em horror ao ver o bife começar a sangrar diante [prank_target.GetHerHim]!"
 court.5041.desc_option_3:0 "Em segredo, eu dou a alguns servos a tarefa de encontrar cobras – o maior número possível. Em seguida, enquanto [Select_CString( prank_target.IsFemale, 'a', 'o' )] [prank_target.GetTitledFirstName] está fora, eu os solto nos aposentos [prank_target.GetHerHim]. Os gritos ecoando pelos corredores quando [prank_target.GetSheHe] retorna me fazem gargalhar descontroladamente!"
 court.5041.desc_option_4:0 "Eu esmago um pouco de incenso em pó muito fino e o escondo na minha mão. Então, enquanto estamos sentados um em frente ao outro na mesa com uma vela entre nós, eu arremesso minha mão em direção ao rosto d[Select_CString( prank_target.IsFemale, 'a', 'o' )] [prank_target.GetTitledFirstName]. À medida que o pó passa pela chama, ele se incendeia de forma espetacular!\n\n[prank_target.GetSheHe|U] grita, pensando que o rosto dele está em chamas, mas eu sei que é apenas uma brincadeira e rio alegremente."
 court.5041.desc_option_5:0 "Eu abro cuidadosamente a porta dos aposentos d[Select_CString( prank_target.IsFemale, 'a', 'o' )] [prank_target.GetTitledFirstName] e, equilibrando-me em uma cadeira, coloco um penico cheio sobre o batente da porta bem devagarinho. Então: uma batida rápida e uma fuga ainda mais rápida virando a esquina.\n\n“Quem é–” #EMP Splash!#!"
 court.5041.option_1:0 "A próxima refeição [prank_target.GetHerHim] estará cheia de \"larvas\"!"
 court.5041.option_2:0 "O próximo bife que [prank_target.GetSheHe] comer parecerá sangrando!"
 court.5041.option_3:0 "Vou soltar cobras nos aposentos [prank_target.GetHerHim]!"
 court.5041.option_4:0 "Vou assustar [prank_target.GetSheHe] com pó inflamável!"
 court.5041.option_5:0 "Uma surpresa estará esperando por [prank_target.GetSheHe] em cima da porta dos aposentos [prank_target.GetHerHim]!"
 court.5042.a:0 "Era apenas uma brincadeira!"
 court.5042.desc_chastiser:0 "\n\n[chastiser.Custom2('MyCharacterIntroduction', ROOT.Char)|U] falha em ver a graça nisso.\n\n\"Sei que é você quem está fazendo essas malditas brincadeiras na corte."
 court.5042.desc_chastiser_no_snake:0 "Pobre [prank_target.GetTitledFirstName] se assusta com cada sombra! É uma vergonha... vossa graça."
 court.5042.desc_chastiser_snake:0 "Pobre [prank_target.GetTitledFirstName] se assusta com cada sombra, e o que as cobras fizeram com o rosto [prank_target.GetHerHim]... É uma vergonha. Vossa graça."
 court.5042.desc_no_chastiser:0 "Meus cortesãos falham em ver a graça nisso, e deixam bem claro que condenarão qualquer outra brincadeira. E que estarão em alerta."
 court.5050.a:0 "Ah, cai na real!"
 court.5050.b:0 "Você está certo, você merece um cargo."
 court.5050.c:0 "Se você vai brincar assim, devo começar a te pagar!"
 court.5050.desc:0 "\"Por que você honraria aquel[Select_CString( courtier_given_title.IsFemale, 'a', 'e' )] [courtier_given_title.Custom2('InsultNoun', SCOPE.sC('courtier'))] [courtier_given_title.GetTitledFirstName] com um cargo na corte e não a mim?\"\n\n[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] está furioso. Aparentemente [courtier.GetSheHe] tinha certeza de que a honra seria sua e de mais ninguém."
 court.5050.t:0 "Uma Cortesã Desprezada"
 court.5055.a:0 "Você precisa se concentrar em estudos #EMP úteis#!, [painter.GetFirstNameNoTooltip]."
 court.5055.b:0 "O talento [painter.GetHerHim] será incentivado!"
 court.5055.b_tt:0 "[painter.GetFirstNameNoTooltip] continua suas atividades artísticas."
 court.5055.desc:0 "Eu encontro [painter.Custom2('MyCharacterIntroduction', ROOT.Char)] sentado no chão, cercado de tinta derramada e pedaços de tela, pela terceira vez neste mês.\n\nMeus cortesãos sussurram sobre [painter.GetSheHe] ser um gênio artístico em formação, mas os servos reclamam de ter que limpar o chão livre de tinta após as #EMP inspirações#! [painter.GetHerHim]."
 court.5055.t:0 "Talento Colorido"
 court.5056.a:0 "Claro!"
 court.5056.b:0 "Você já é adulto o suficiente para seguir seu próprio caminho na vida agora."
 court.5056.desc:0 "\"Obrigado por acreditar em mim e em meus talentos, [ROOT.Char.Custom('FormOfAddressForLiege')]."
 court.5056.desc_ending:0 "Eu tenho um novo projeto que gostaria de começar, talvez você esteja interessado em ser meu benfeitor mais uma vez?\""
 court.5056.desc_family:0 "\"Obrigado por acreditar em mim, [painter.Custom2('RelationToMeShort', ROOT.Char)]."
 court.5056.desc_opening:0 "O talento de [painter.Custom2('MyCharacterIntroduction', ROOT.Char)|U] com o pincel cresce a cada ano que passa; e o mesmo acontece com o interesse e competência [painter.GetHerHim].\n\n"
 court.5057.a:0 "Ah, as tolices da infância..."
 court.5057.b:0 "Ninguém me faz de tolo!"
 court.5057.desc:0 "À medida que os anos passam, fica dolorosamente óbvio que [painter.Custom2('MyCharacterIntroduction', ROOT.Char)] não tem o talento nem a determinação para pintar a obra-prima que [painter.GetSheHe] me prometeu.\n\n\"Eu era apenas uma criança em busca de atenção. Pensar que você realmente acreditou nas minhas bobagens!\""
 court.5060.a:0 "Bem... falarei bem [knight.GetHerHim]."
 court.5060.b:0 "[knight.GetSheHe|U] é [Select_CString( knight.IsFemale, 'a nova', 'o novo' )] [knight.GetLadyLord] de [title_to_grant.GetNameNoTooltip]!"
 court.5060.c:0 "Uma linhagem de $knight_culture_player_no_tooltip_lowercase$ digna de louvor!"
 court.5060.d.akolouthos:0 "[knight.GetSheHe|U] servirá como meu $akolouthos_court_position$!"
 court.5060.d.bodyguard:0 "[knight.GetSheHe|U] servirá como meu $bodyguard_court_position$!"
 court.5060.d.champion:0 "[knight.GetSheHe|U] servirá como meu $champion_court_position$!"
 court.5060.desc:0 "[knight.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se destacou durante nossas batalhas recentes e minha corte está cheia de entusiasmo; que $knight_culture_player_no_tooltip_lowercase$ habilidoso, que exemplo, que #EMP [knight.GetWomanMan]#!!\n\nCom todos os elogios chovendo sobre [knight.GetSheHe], fica claro que esperam que eu recompense oficialmente [knight.GetSheHe] de alguma forma."
 court.5060.t:0 "O Galante $knight_culture_player_no_tooltip$"
 court.5070.a:0 "Mas você está fazendo um ótimo trabalho como está!"
 court.5070.b.tt:0 "Isso avança a educação de todos os seus pupilos."
 court.5070.b:0 "Claro que você terá os fundos!"
 court.5070.desc:0 "[court_tutor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim com preocupações sobre o estado de nossos materiais educacionais.\n\n\"Podemos nos virar, mas imagine as alturas que nossas crianças poderiam alcançar se tivéssemos melhores materiais... Novas tábuas de cera, pergaminho, talvez até tinta!\""
 court.5070.t:0 "Tutor Dedicado"
 court.5075.a:0 "Eles servirão aos senhores e às senhoras da corte."
 court.5075.b:0 "E ambos renderão um bom preço!"
 court.5075.c.failure:0 "O cavalo te derruba."
 court.5075.c.success:0 "Você consegue treinar corretamente o cavalo."
 court.5075.c:0 "Eu mesmo treinarei o [dummy_gender.Custom('HorseMareStallion')]."
 court.5075.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" meu mestre de estábulo me chama para perto do [dummy_gender.Custom('HorseMareStallion')]."
 court.5075.desc_ending:0 "\"Olhe para esses músculos... E aquelas quartelas! Este servirá bem na guerra.\""
 court.5075.desc_horse_master:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [master_of_the_horse.Custom2('MyCharacterIntroduction', ROOT.Char)] me chama para perto do [dummy_gender.Custom('HorseMareStallion')]."
 court.5075.desc_opening:0 "[neighbor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me presenteou com um presente muito gracioso: um par de poldros de boa linhagem, uma égua e um garanhão!\n\n"
 court.5075.t:0 "Dois Poldros"
