 court.8196.c:0 "Você não pode fazer ambos?"
 court.8196.desc:0 "Os talentos [Select_CString( position_holder.IsFemale, 'da minha', 'do meu' )] [position_holder.Custom('ComplimentAdjective')] [GetCourtPositionType('master_of_horse_court_position').GetName()], [position_holder.GetTitledFirstName], são amplamente reconhecidos como inestimáveis.\n\nO treinamento e a precisão dos cavalos melhoraram significativamente, e [position_holder.GetSheHe] tem uma habilidade natural para manter tanto os animais quanto seus capitães sob controle.\n\nHoje, [position_holder.GetSheHe] se aproxima de mim na sala do trono e me pergunta diretamente: \"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip], devo elaborar diretrizes adequadas para estábulos ou focar no treinamento?\""
 court.8196.t:0 "Na Sela"
 court.8197.a:0 "Eu só quero chegar ao meu destino inteiro!"
 court.8197.b:0 "Não devemos perder tempo, tenho muito a fazer."
