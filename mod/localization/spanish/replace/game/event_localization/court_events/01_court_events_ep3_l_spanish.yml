 court.8197.c:0 "Minha segurança e meu tempo são igualmente valiosos!"
 court.8197.desc:0 "M[Select_CString( position_holder.IsFemale, 'inha', 'eu' )] [position_holder.Custom('ComplimentAdjective')] [GetCourtPositionType('travel_leader_court_position').GetName()], [position_holder.GetTitledFirstName], é um[Select_CString( position_holder.IsFemale, 'a', '' )] organizador[Select_CString( position_holder.IsFemale, 'a', '' )] magistral: desde que contratei [position_holder.GetSheHe], até a menor das viagens parece uma visão de facilidade apressada!\n\n[position_holder.GetSheHe|U] se ocupa dia e noite, reabastecendo suprimentos e atualizando os itinerários [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]. Por um momento, fico surpres[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], quando [position_holder.GetSheHe] me pergunta sinceramente: \"Meu [ROOT.Char.GetTitleAsNameNoTooltip], o que é mais valioso: seu tempo ou sua saúde?\""
 court.8197.t:0 "[position_holder.Custom('QueenKing')] da Estrada"
 court.8198.a:0 "Você poderia olhar este [weak_1.Custom('ArtifactType')]?"
 court.8198.b:0 "Há #EMP um#! [weak_2.Custom('ArtifactType')] sem brilho."
 court.8198.c:0 "Dê uma olhada neste [weak_3.Custom('ArtifactType')] para mim."
 court.8198.d:0 "Este [broken_1.Custom('ArtifactType')] poderia usar alguns reparos."
 court.8198.desc:0 "M[Select_CString( position_holder.IsFemale, 'inha', 'eu' )] [position_holder.Custom('ComplimentAdjective')] [GetCourtPositionType('antiquarian_court_position').GetName()], [position_holder.GetTitledFirstName], cuida bem de meu tesouro: os itens são mantidos bem limpos e sem poeira, e [position_holder.GetSheHe] está sempre pront[Select_CString( position_holder.IsFemale, 'a', 'o' )] para oferecer uma curiosidade a qualquer visitante curioso ou nem tanto.\n\nCom a responsabilidade de todos os tesouros do tribunal [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip], o tempo [position_holder.GetHerHim] está compreensivelmente limitado, e [position_holder.GetSheHe] me pergunta, após eu elogiar o bom trabalho [position_holder.GetHerHim], se: \"...há algum objeto que você acha que precisa de atenção especial, [ROOT.Char.Custom('FormOfAddressForLiege')]?\""
 court.8198.e:0 "Meu [broken_2.Custom('ArtifactType')] está caindo aos pedaços."
 court.8198.f:0 "Cuide deste [broken_3.Custom('ArtifactType')]."
 court.8198.g:0 "E o que acha do meu [weak_4.Custom('ArtifactType')]?"
 court.8198.h:0 "Repare o [broken_4.Custom('ArtifactType')], por favor?"
 court.8198.i:0 "Não, apenas continue com o bom trabalho!"
 court.8198.t:0 "Curador Atento"
 court.8199.a:0 "Mantenha meus súditos felizes."
 court.8199.b:0 "Melhorias, você diz?"
 court.8199.c.failure:0 "[position_holder.GetFirstNameNoTooltip] está sobrecarregad[Select_CString( position_holder.IsFemale, 'a', 'o' )]"
 court.8199.c.success:0 "Você ajuda [Select_CString( position_holder.IsFemale, 'a', 'o' )] [position_holder.GetFirstNameNoTooltip]"
 court.8199.c:0 "Por que não os dois?"
 court.8199.desc:0 "M[Select_CString( position_holder.IsFemale, 'inha', 'eu' )] [position_holder.Custom('ComplimentAdjective')] [GetCourtPositionType('master_of_hunt_court_position').GetName()], [position_holder.GetTitledFirstName], tem se destacado bastante, e todos concordam que a caça [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] nunca foi tão abundante.\n\nFico contente ao ver [position_holder.GetSheHe] adentrar minha sala do trono, vindo diretamente da natureza, com uma pergunta urgente: \"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip], alguns de seus vassalos têm pedido minha ajuda com suas caças, mas também tenho planos para melhorar seus campos de caça. O que devo fazer?\""
 court.8199.t:0 "Mestre da Caça"
 court.8200.a:0 "Você é #EMP m[Select_CString( position_holder.IsFemale, 'inha', 'eu' )]#! arquitet[Select_CString( position_holder.IsFemale, 'a', 'o' )]."
 court.8200.b:0 "Atenda às necessidades do povo."
 court.8200.c.failure:0 "[position_holder.GetFirstNameNoTooltip] está sobrecarregad[Select_CString( position_holder.IsFemale, 'a', 'o' )]"
 court.8200.c.success:0 "Você ajuda [Select_CString( position_holder.IsFemale, 'a', 'o' )] [position_holder.GetFirstNameNoTooltip]"
 court.8200.c:0 "Um[Select_CString( position_holder.IsFemale, 'a', '' )] [position_holder.GetWomanMan] talentos[Select_CString( position_holder.IsFemale, 'a', 'o' )] poderia fazer ambos."
 court.8200.desc:0 "As habilidades [Select_CString( position_holder.IsFemale, 'da minha', 'do meu' )] [position_holder.Custom('ComplimentAdjective')] [GetCourtPositionType('royal_architect_court_position').GetName()], d[Select_CString( position_holder.IsFemale, 'a', 'o' )] [position_holder.GetTitledFirstName], são muito elogiadas na corte — mesmo os reparos mais simples são feitos com um cuidado e precisão raros de se encontrar no [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] — ou em qualquer outro lugar.\n\n[position_holder.GetSheHe|U] tem estado pensativ[Select_CString( position_holder.IsFemale, 'a', 'o' )] esta semana e, finalmente, compartilha seu dilema: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], em meu trabalho notei maneiras de otimizar seus projetos de construção, mas meus esforços talvez sejam mais bem aproveitados ajudando na expansão das vilas.\""
