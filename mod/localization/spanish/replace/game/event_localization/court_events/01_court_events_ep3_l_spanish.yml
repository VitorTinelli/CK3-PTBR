 court.8201.c:0 "Eu espero o mais alto padrão de serviço."
 court.8201.desc:0 "M[Select_CString( position_holder.IsFemale, 'inha', 'eu' )] [position_holder.Custom('ComplimentAdjective')] [GetCourtPositionType('cupbearer_court_position').GetName()], [position_holder.GetTitledFirstName], é um[Select_CString( position_holder.IsFemale, 'a', '' )] [position_holder.GetWomanMan] confiável, desempenhando suas responsabilidades com grande 'aplomb'.\n\n[position_holder.GetSheHe] não só garante que minha taça esteja sempre cheia, mas também as de meus convidados e da corte, sempre com um sorriso.\n\nTal entusiasmo e destreza são raros, [position_holder.GetSheHe] pode ser muito útil..."
