 court.8195.t:0 "Cuidando de Si"
 court.8196.a:0 "Economize tudo o que puder nos cavalos."
 court.8196.b:0 "Uma sela vazia é inútil."
 court.8196.c.failure:0 "[position_holder.GetFirstNameNoTooltip] está sobrecarregad[Select_CString( position_holder.IsFemale, 'a', 'o' )]"
