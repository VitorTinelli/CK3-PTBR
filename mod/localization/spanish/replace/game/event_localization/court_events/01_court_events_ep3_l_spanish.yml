 court.8194.desc:0 "M[Select_CString( position_holder.IsFemale, 'inha', 'eu' )] [position_holder.Custom('ComplimentAdjective')] [GetCourtPositionType('high_almoner_court_position').GetName()], [position_holder.GetTitledFirstName], desempenha suas responsabilidades com grande cuidado, e a caridade [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] ganha mais reputação.\n\nFico um pouco surpres[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], portanto, quando [position_holder.GetSheHe] me pergunta, com uma bolsa de moedas tilintando na palma de sua mão: \"Meu tempo é dividido entre os verdadeiramente necessitados e os piedosos senhores e senhoras de [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] — preciso da sua orientação, [ROOT.Char.Custom('FormOfAddressForLiege')]...\""
