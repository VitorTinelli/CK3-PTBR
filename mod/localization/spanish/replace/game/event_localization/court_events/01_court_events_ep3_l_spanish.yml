 court.8203.c:0 "Segredos e charme, faça desses suas armas."
 court.8203.desc:0 "M[Select_CString( position_holder.IsFemale, 'inha', 'eu' )] [position_holder.Custom('ComplimentAdjective')] [GetCourtPositionType('lady_in_waiting_court_position').GetName()], [position_holder.GetTitledFirstName], se adaptou admiravelmente ao seu papel, aparentemente capaz de antecipar todos os meus desejos.\n\nAlém disso, [position_holder.GetSheHe] não deixa nada escapar à sua atenção na corte, desde os menores boatos até as notícias mais graves.\n\n[position_holder.GetSheHe|U] poderia ser um grande trunfo, se esses talentos fossem direcionados..."
