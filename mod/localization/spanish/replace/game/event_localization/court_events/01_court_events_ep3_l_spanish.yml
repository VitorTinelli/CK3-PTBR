 court.8192.desc:0 "Desde a nomeação [position_holder.GetHerHim] como meu [GetCourtPositionType('seneschal_court_position').GetName()], [position_holder.GetTitledFirstName] tem sido uma presença sempre [position_holder.Custom('ComplimentAdjective')], garantindo o bom funcionamento da minha corte e residência.\n\nEnquanto reflito sobre minha boa escolha, ouço a voz [position_holder.GetHerHim] atrás de mim: \"[position_holder.Custom2('RelationToMeShort', ROOT.Char)|U], descobri que há muitas economias a serem feitas nesta [ROOT.Char.Custom('ResidenceBuilding')|l], embora eu me pergunte onde você acha que as economias são mais necessárias?\"\n\n[position_holder.GetSheHe|U] levanta seu livro razão, e uma sobrancelha inquisitiva."
