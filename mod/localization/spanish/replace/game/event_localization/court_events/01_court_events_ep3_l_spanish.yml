 court.8204.c.success:0 "Você ajuda [Select_CString( position_holder.IsFemale, 'a', 'o' )] [position_holder.GetFirstNameNoTooltip]"
 court.8204.c:0 "Quero olhos na comida, #EMP e#! nos funcionários."
 court.8204.desc:0 "A julgar pelo crescimento de seu sorriso e estômago, m[Select_CString( position_holder.IsFemale, 'inha', 'eu' )] [position_holder.Custom('ComplimentAdjective')] [GetCourtPositionType('food_taster_court_position').GetName()], [position_holder.GetTitledFirstName], nasceu para jantares de um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip].\n\n[position_holder.GetSheHe|U] passa cada vez mais tempo nas cozinhas, experimentando as ofertas e dando notas aos cozinheiros.\n\nDevo me certificar de não desperdiçar o entusiasmo raro [position_holder.GetHerHim] para um papel relativamente pouco recompensador..."
 court.8204.t:0 "Medida da Corte"
 court.8301.a:0 "Vamos falar sobre sua remuneração, [position_holder.GetFirstNameNoTooltip]..."
 court.8301.b:0 "Acho que é hora de você se afastar."
 court.8301.c:0 "#weak *suspiro*#! #EMP Sim...#! Ah, sim! Você é ótimo!"
 court.8301.desc:0 "\"Venha, [Select_CString( ROOT.Char.IsFemale, 'minha senhora feudal', 'meu senhor feudal' )],\" [position_holder.GetFirstName] balbucia em meio às risadas da corte, depois que sua compreensão confusa de [position_holder.Custom('GetCourtPositionSubject')] foi novamente ridicularizada, \"Eu #EMP sou#! bom no meu trabalho... n-não sou?\""
 court.8301.detractor:0 "Entre os que mais criticam [position_holder.GetSheHe] está m[Select_CString( detractor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('detractor'))], [detractor.GetTitledFirstName], que não faz esforço para esconder seu desprezo.\n\n"
 court.8301.intro:0 "O assunto sobre [Select_CString( position_holder.IsFemale, 'a minha desajeitada', 'o meu desajeitado' )] [position_holder.GetHeldCourtPositionsString], [position_holder.GetFirstName], nível de experiência, ou a falta dela, tem sido um tema crescente de zombarias. Refletindo, os talentos [position_holder.GetHerHim] deixam muito a desejar...\n\n"
 court.8301.t:0 "Expectativas Não Atendidas"
 court.8311.a:0 "É adorável perceber isso, [position_holder.GetFirstNameNoTooltip]!"
 court.8311.desc:0 "Apesar de, a princípio, ter uma compreensão bastante questionável até mesmo dos conceitos mais básicos de [position_holder.Custom('GetCourtPositionSubject')], m[Select_CString( position_holder.IsFemale, 'inha', 'eu' )] [position_holder.GetHeldCourtPositionsString], [position_holder.GetTitledFirstName], parece finalmente estar se adaptando ao seu papel.\n\nMuitos na corte notaram as habilidades emergentes, embora ainda um tanto limitadas, [position_holder.GetHerHim]. No mínimo, parece que [position_holder.GetSheHe] está genuinamente tentando ganhar o seu sustento."
 court.8311.t:0 "Aprendendo as Manhas"
 court.8321.a:0 "Muito bem, mas é melhor que você faça por merecer."
 court.8321.b.failure:0 "[position_holder.GetSheHe|U] fica ofendid[Select_CString( position_holder.IsFemale, 'a', 'o' )]"
 court.8321.b.success:0 "[position_holder.GetSheHe|U] aceita a oferta"
 court.8321.b:0 "Que tal um pequeno bônus, em vez disso?"
 court.8321.c:0 "Não há fundos disponíveis no momento..."
 court.8321.desc:0 "M[Select_CString( position_holder.IsFemale, 'inha', 'eu' )] [position_holder.GetHeldCourtPositionsString], [position_holder.GetTitledFirstName] tem se adaptado ao seu papel, embora não sem alguns problemas iniciais.\n\n[position_holder.GetSheHe|U] não esconde o fato de que acha que deveria ser melhor recompensad[Select_CString( position_holder.IsFemale, 'a', 'o' )] se for para realmente se dedicar ao seu trabalho.\n\n\"Venha, [ROOT.Char.Custom('FormOfAddressForLiege')], estou a serviço d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip] de [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]! Não deveria eu receber mais do que sobras de mesa se vou passar meus dias absorvido em [position_holder.Custom('GetCourtPositionSubject')] em seu nome?\""
 court.8321.t:0 "A Abordagem da Cenoura"
