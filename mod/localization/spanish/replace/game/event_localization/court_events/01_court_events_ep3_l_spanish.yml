 court.8195.desc:0 "M[Select_CString( position_holder.IsFemale, 'inha', 'eu' )] [position_holder.Custom('ComplimentAdjective')] [GetCourtPositionType('bodyguard_court_position').GetName()], [position_holder.GetTitledFirstName], é um[Select_CString( position_holder.IsFemale, 'a', '' )] lutador[Select_CString( position_holder.IsFemale, 'a', '' )] inspirad[Select_CString( position_holder.IsFemale, 'a', 'o' )] de se ver no campo de treino e uma presença muito reconfortante pela [ROOT.Char.Custom('ResidenceBuilding')|l].\n\nUm dia, [position_holder.GetSheHe] se aproxima de mim, espada de treino na mão, com [Select_CString( portrait.IsFemale, 'a', 'o' )] [portrait.GetFirstName] a reboque, e pergunta: \"Recebi pedidos de treinamento e aceitarei com sua permissão, [ROOT.Char.Custom('FormOfAddressForLiege')]. Há alguém que você gostaria que eu ensinasse?\""
