l_spanish:
 court.4001.a:0 "Guardas, levem est[Select_CString( bleeding_diplomat.IsFemale, 'a', 'e' )] [bleeding_diplomat.GetWomanMan] para ver o médico."
 court.4001.b:0 "Minha agenda só tem espaço na próxima semana — você pode esperar?"
 court.4001.c:0 "Podemos conversar agora, mas seu senhor feudal pagará pelo meu tapete."
 court.4001.carpet:0 "Você precisa limpar o seu tapete."
 court.4001.cure_toast:0 "Médico cura diplomata"
 court.4001.desc:0 "Uma poça de sangue está coagulando aos pés de [bleeding_diplomat.GetName], um diplomata enviado pelo meu aliado, [bleeding_diplomat_liege.GetName]. Pela imensa quantidade absorvida pelo meu fino tapete, posso apenas supor que [bleeding_diplomat.GetSheHe] tem sangrado neste local por horas, se não mais.\n\n\"Peço desculpas por essa bagunça. Fui defenestrado por um anão que tentava me roubar em uma estalagem durante minha jornada para [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. No entanto, como o patife amorteceu minha queda, a visita diplomática pode continuar — ainda faltarão #EMP dias#! até que minha perda de sangue seja fatal!\""
 court.4001.new_carpet:0 "[bleeding_diplomat.GetSheHe|U] vai sangrar ainda mais — você terá que comprar um tapete novo."
 court.4001.t:0 "Um Ferimento Superficial"
 court.4001.toast:0 "[bleeding_diplomat.GetName] morre"
 court.4001.toast_desc:0 "[bleeding_diplomat.GetName] desangrou sobre o seu luxuoso tapete."
 court.4100.a:0 "Isso é repugnante! Prenda esse devasso na masmorra!"
 court.4100.b:0 "Tenho certeza de que as meias-calças deles são demais para as damas suportarem."
 court.4100.c:0 "Você tem o meu dinheiro, mal posso esperar pela apresentação!"
 court.4100.desc:0 "Meu Músico da Corte se aproxima de mim, quase saltitando ao som de uma melodia que apenas [court_musician.GetSheHe] consegue ouvir.\n\n\"Um pouco da sua atenção, [ROOT.Char.Custom('FormOfAddressForLiege')]. Preparei um coro exclusivamente masculino sem igual! De acordo com meu novo método, eles não apenas cantam, mas usam meias-calças, exibem ornamentos pomposos sobre suas partes íntimas brilhantes e dançam de forma sincronizada! Tudo isso enquanto louvam [ROOT.GetCharacter.GetFaith.HighGodName], é claro. Tenho certeza de que se você financiar uma grande apresentação, isso agradará bastante as damas da corte.\""
 court.4100.t:0 "Escudeiros para [GetPlayer.Custom('KnightCulturePluralNoTooltip')]"
 court.4202.b.success.tt:0 "Você envia [head_chasing_monk.GetName] para a masmorra"
 court.4250.a:0 "Enfie sua agulha celeste no seu traseiro elevado!"
 court.4250.b.tt:0 "Você vai colocar um mastro muito longo em cima do seu [THIS.GetCharacter.Custom('FortifiedBuilding')]"
 court.4250.b:0 "Vamos estender nossa torre para que ela seja um pé mais alta que a sua!"
 court.4250.c.accident.tt.flavour:0 "Quem pode dizer o que pode dar errado..."
 court.4250.c.accident.tt:0 "Um terrível acidente ocorre"
 court.4250.c.failure.tt:0 "Sua torre desmorona durante a construção"
 court.4250.c.failure_toast_title:0 "Sua torre de [ROOT.Char.Custom('FortifiedBuilding')] desmorona!"
 court.4250.c.success.tt:0 "Você constrói uma torre enorme"
 court.4250.c:0 "Exijo que construamos uma torre #EMP cem pés #!mais alta!"
 court.4250.desc:0 "\"Cortesãos choramingantes de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip],\" [tower_challenger_rival.GetTitledFirstName] avança para a frente da minha sala do trono.\n\n\"Enquanto [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitledFirstNameNoTooltip] se revolve no chão como um porco na lama, eu ergui a torre mais alta que esta terra maldita já viu em [tower_challenger_rival.GetCapitalLocation.GetTitle.GetNameNoTier]. Da minha [tower_challenger_rival.Custom('FortifiedBuilding')], eu posso quase arrancar os planetas do céu. Onde estão suas estrelas, [ROOT.Char.GetTitledFirstNameNoTooltip]?\"\n\nM[Select_CString( concerned_steward.IsFemale, 'inha', 'eu' )] [concerned_steward.GetCouncilTitle|l] [concerned_steward.GetTitledFirstName] coloca uma mão cautelosa no meu ombro. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], a torre d[Select_CString( tower_challenger_rival.IsFemale, 'a', 'o' )] [tower_challenger_rival.GetTitledFirstNameNoTooltip] tem quatrocentos pés de argila e pasta estruturalmente instável. Ignore a provocação dela e aguarde sua ruína!\""
 court.4250.t:0 "Minha Torre é Maior que a Sua!"
 court.4251.a:0 "Oh [crushed_child.GetNameNoTooltip], você era doce como uma panqueca!"
 court.4251.b:0 "Você finalmente conseguiu voar, [tower_challenger_rival.GetTitledFirstNameNoTooltip]."
 court.4251.c:0 "Quem está se revolvendo na lama agora, [tower_challenger_rival.GetTitledFirstNameNoTooltip]?"
 court.4251.desc:0 "Ao receber a notícia de que minha imponente torre finalmente está completa, convido toda a minha corte para fora para uma visualização. A torre rasga o céu, mas também balança ao vento."
 court.4251.desc_child_accident:0 "\n\nDe dentro da multidão de cortesãos maravilhados, minha criança [crushed_child.GetName] começa a rastejar com curiosidade em direção à base da imponente estrutura, olhando atentamente para ela.\n\n[crushed_child.GetNameNoTooltip] nem tem tempo para gritar quando a ponta da torre se solta, desaba e a transforma em um borrão."
 court.4251.desc_rival_accident:0 "\n\nConvido [Select_CString( tower_challenger_rival.IsFemale, 'a', 'o' )] [tower_challenger_rival.GetTitledFirstNameNoTooltip] para se juntar a mim em uma escalada. [tower_challenger_rival.GetSheHe|U] fica sem fôlego com a vista — ou talvez com as escadas. Assim que chegamos ao topo e aceno para meus cortesãos lá embaixo, [tower_challenger_rival.GetSheHe] se apoia na grade, que imediatamente cede, lançando [tower_challenger_rival.GetSheHe] em uma queda direto ao céu."
 court.4251.desc_success:0 "\n\nMeus cortesãos maravilhados recebem a torre com uma rodada de aplausos tumultuosos, mas por algum motivo todos evitam ficar à sombra dela.\n\n[tower_challenger_rival.GetTitledFirstNameNoTooltip] sussurra para mim: \"Cão, eu prometo que voltarei com uma torre #EMP duas vezes #!maior que essa.\""
 court.4300.a.tt:0 "O custo em [piety|E] e [gold|E] para fundar uma Ordem Sagrada é significativamente reduzido"
 court.4300.a:0 "\"Você tem minha caneta e minha espada!\""
 court.4300.b:0 "\"Vamos excomungar esses insetos renegados!\""
 court.4300.c:0 "\"Tenho certeza de que [Select_CString( possible_latrine_digger.IsFemale, 'a', 'o' )] [possible_latrine_digger.GetTitledFirstNameNoTooltip] está desesperado para ajudar!\""
 court.4300.d:0 "\"Meus cofres estão tão abertos quanto o céu!\""
 court.4300.e.tt:0 "[bernard_guard_1.GetTitledFirstName] e [Select_CString( bernard_guard_2.IsFemale, 'a', 'o' )] [bernard_guard_2.GetTitledFirstName] acompanharão [Select_CString( right_portrait_character.IsFemale, 'a', 'o' )] [right_portrait_character.GetTitledFirstName] em seu reino."
 court.4300.e:0 "\"Você terá uma escolta da minha guarda pessoal em sua missão.\""
 court.4300.f:0 "Indigno de falar com um[Select_CString( right_portrait_character.IsFemale, 'a', '' )] [right_portrait_character.GetWomanMan], eu me ajoelho em silêncio."
 court.4300.g:0 "O distintivo de cruz [right_portrait_character.GetHerHim] parece bastante brega, não parece?"
 court.4300.preaching_tour_bernard_of_clairvaux_flea_excommunication:0 "Agradeço por sua hospitalidade. Como forma de retribuir sua gentileza, percebo que vários de seus cortesãos estão coçando várias picadas. Certa vez, excomunguei uma infestação de moscas com milhares de exemplares, causando sua morte instantânea. Parece que você tem algumas pulgas ruins que precisam de censura eclesiástica!"
 court.4300.preaching_tour_bernard_of_clairvaux_intro:0 "Bernard de Clairvaux está aqui em uma parada durante sua turnê de pregação que atravessa o continente para acender o fogo da guerra santa em andamento. Meu [bishop.GetCouncilTitle] me informa que ele foi central na elaboração das doutrinas da primeira Ordem Sagrada dos Cavaleiros Templários.\n\n"
 court.4300.preaching_tour_bernard_of_clairvaux_standard:0 "Tenho um favor sério a pedir. Embora [ROOT.GetCharacter.GetFaith.HighGodName] tenha abençoado minha mente, [ROOT.GetCharacter.GetFaith.HighGodNameSheHe] não abençoou meus intestinos. Como minha continência está, não posso pregar sem um banheiro escavado sob mim. Haveria alguém disposto a seguir minha turnê como um escavador de fossa cristão?"
 court.4300.preaching_tour_bernard_of_clairvaux_theology:0 "Estou empolgado por estar perto de outro renomado pela sua compreensão teísta. Estou trabalhando em um novo tratado sobre nossas ordens militares: 'Em Louvor à Nova Cavalaria'. Se você der uma olhada, farei questão de enviar uma mensagem [Select_CString( ghw_sponsor.IsFemale, 'a', 'ao' )] [ghw_sponsor.GetTitledFirstName] para que [ghw_sponsor.GetSheHe] emita uma bula em apoio à sua própria ordem."
 court.4300.preaching_tour_default:0 "Um padre está bloqueando a entrada da sua sala do trono, distribuindo distintivos vermelhos em forma de cruz para aqueles que entram para fixar em suas roupas.\n\n\"Graças a [ROOT.GetCharacter.GetFaith.HighGodName]! Estou em uma turnê de pregação pelos reinos dos nossos aliados comprometidos na guerra santa, entregando sermões para fortalecer o recrutamento e os fundos.\""
 court.4300.t:0 "Quantum Praedecessores"
 court.4350.a:0 "É difícil ignorar tal estupidez, mas o comércio vem em primeiro lugar."
 court.4350.b:0 "Vamos realizar alguns saques por conta própria!"
 court.4350.c.tt:0 "#F Você interrompe o comércio com [caravan_attacker_liege.GetNameNoTooltip]#!"
 court.4350.c:0 "Vamos ver como esses bebês choram quando paramos de negociar açúcar!"
 court.4350.desc:0 "Meu [concerned_marshal.GetCouncilTitle] acabou de conversar com um par de comerciantes carbonizados que se arrastaram até minha sala do trono. \"Uma cadeia de nossas caravanas de comércio que traziam açafrão de [caravan_attacker_liege.GetCapitalLocation.GetTitle.GetNameNoTier] para [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] foi saqueada. Os vilões não eram bandidos, mas um grupo de nobres cristãos montados em armaduras completas.\"\n\n[concerned_marshal.GetSheHe|U] suspira profundamente. \"Tolos nostálgicos por massacrar nosso povo estão tentando nos provocar a uma guerra sob o nariz de seu senhor feudal. Se retaliarmos, corremos o risco de comprometer acordos com [caravan_attacker_liege.GetName] sobre importações de luxo tão amadas por nossos cortesãos.\""
 court.4350.t:0 "Açafrão em Chamas"
 court.4355.a.tt:0 "Você organiza mais saques comerciais"
 court.4355.a:0 "Bom trabalho! Pilhar incrédulos é um ato sagrado!"
 court.4355.b:0 "Guardas! Batam n[caravan_attacker.GetSheHe] com uma tigela de açúcar até que [caravan_attacker.GetSheHe] se arrependa."
 court.4355.c.tt:0 "#F [caravan_attacker.GetSheHe|U] continuará saqueando!#"
 court.4355.c:0 "Eu sinto que [caravan_attacker.GetSheHe] continuará saqueando, independentemente do meu comando."
 court.4355.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\", chama m[Select_CString( reporting_marshal.IsFemale, 'inha', 'eu' )] [reporting_marshal.GetCouncilTitle], \"eu ouvi [Select_CString( caravan_attacker.IsFemale, 'a', 'o' )] [caravan_attacker.GetTitledFirstName] se vangloriando de que [caravan_attacker.GetSheHe] e um bando de nobres têm agido como bandidos comuns e saqueado caravanas que transportam açúcar de [attacked_liege.GetCapitalLocation.GetTitle.GetNameNoTier]. Esses cães babam por uma guerra santa e estão tentando provocar [Select_CString( attacked_liege.IsFemale, 'a', 'o' )] [attacked_liege.GetTitledFirstName]. No entanto, eu sugiro que precisamos do comércio muito mais do que de qualquer batalha...\"\n\n\"Não precisamos de comida, apenas beber o sangue dos infiéis!\" brada [Select_CString( caravan_attacker.IsFemale, 'a', 'o' )] [caravan_attacker.GetTitledFirstNameNoTooltip] do outro lado da sala do trono."
 court.4355.t:0 "Quem Ousa Batalhar contra os Sarracenos?"
 court.4400.a:0 "Você tem minha permissão para procurar no [ROOT.GetCharacter.Custom('FortifiedBuilding')]."
 court.4400.b.discovery:0 "Você encontra uma antiguidade esquecida há muito tempo em seu [THIS.GetCharacter.Custom('FortifiedBuilding')]"
 court.4400.b.failure:0 "Os cultistas causam uma bagunça"
 court.4400.b.severed_head:0 "A cabeça decapitada é encontrada!"
 court.4400.b:0 "Deixe-me participar da busca!"
 court.4400.c.backdown:0 "O culto se intimida"
 court.4400.c.refusal:0 "O culto voltará"
 court.4400.c:0 "Não vou permitir que um culto revire minha corte!"
 court.4400.desc:0 "Um bando de [head_chasing_monk.GetWomenMen] de vestes roubes irrompe na minha sala do trono, procurando freneticamente pelo chão e revirando tudo, desde cadeiras até saias, em busca desesperada.\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip]!\" exclama um deles, \"nós somos seguidores d[Select_CString( the_headless.IsFemale, 'a', 'o' )] [the_headless.GetTitledFirstNameNoTooltip] [Select_CString( the_headless.IsFemale, 'a', 'o' )] Sem-Cabeça, um[Select_CString( the_headless.IsFemale, 'a', '' )] grande [the_headless.GetWomanMan] sagrad[Select_CString( the_headless.IsFemale, 'a', 'o' )] que foi decapitado como parte de uma profecia que [ROOT.GetCharacter.GetFaith.HighGodName] deu a [the_headless.GetSheHe] desde o nascimento. Como frequentemente acontece com figuras sagradas, a cabeça [the_headless.GetHerHim] começou a rolar. Nós a estamos perseguindo por toda a terra, e temos #EMP certeza#! de que ela rolou até a colina em seu [ROOT.GetCharacter.Custom('FortifiedBuilding')]!\""
 court.4400.t:0 "Em Busca da Cabeça"
 court.4401.a:0 "Ah, sim! Ahem. É [Select_CString( the_headless.IsFemale, 'a', 'o' )] [the_headless.GetTitledFirstNameNoTooltip]! Louvado seja [ROOT.GetCharacter.GetFaith.HighGodName]... e tudo isso."
 court.4401.b:0 "Olhe como o corte está limpo! Claramente, esse é meu trabalho."
 court.4401.c:0 "\"Você gostaria de vasculhar meu lixo para viver?\""
 court.4401.d:0 "Está um pouco sujo aqui embaixo - eu deveria mandar limpar."
 court.4401.desc:0 "Os porões do meu [ROOT.GetCharacter.Custom('FortifiedBuilding')] têm muito mais bugigangas inúteis do que eu gostaria de admitir."
 court.4401.desc_arbitrary:0 "Eu me vanglorio para [head_chasing_monk.GetName] do meu genial plano de segurança - se ninguém além de mim entender como as pilhas estão organizadas, eu nunca poderei ser roubado!"
 court.4401.desc_default:0 "Cada vez que [head_chasing_monk.GetName] abre uma nova porta, eu espero que [head_chasing_monk.GetSheHe] seja esmagado por uma pilha de curiosidades. Eu até tinha esquecido o meu [ROOT.Char.Custom('RandomPrivateObject')] aqui embaixo!"
 court.4401.desc_head:0 "\n\nTalvez atraído pelo cheiro rançoso, [head_chasing_monk.GetSheHe] tira uma cabeça humana do meio dos destroços como um porco farejando trufas.\n\nA proximidade do porão com a masmorra, no entanto, sugere que provavelmente é alguma alma esquecida das minhas câmaras de tortura."
 court.4401.desc_object:0 "\n\nDepois de vasculhar de maneira amigável, não encontramos a cabeça, mas [head_chasing_monk.GetName] parece fascinado com tudo. Considerando a delicadeza com que [head_chasing_monk.GetSheHe] examina um [ROOT.Char.Custom('RandomWeirdObject')] abandonado, [head_chasing_monk.GetSheHe] poderia se tornar um valioso antiquário."
 court.4402.a.tt:0 "Você leva [head_chasing_monk.GetSheHe] para os seus porões"
 court.4402.a:0 "Por que não vamos procurá-la agora mesmo?"
 court.4402.b.failure:0 "Você é ferido ou morto"
 court.4402.b.success:0 "Você luta contra o monge e envia [head_chasing_monk.GetSheHe] para a masmorra"
 court.4402.b:0 "Nós não vimos a cabeça! Me deixe em paz!"
 court.4402.c2.tt:0 "Você é parcialmente decapitado"
 court.4402.c3.tt:0 "Você é completamente decapitado"
 court.4402.c:0 "Aposto que você não conseguiria me decapitar com essa coisa insignificante!"
 court.4402.desc:0 "Uma noite, eu acordo e me vejo sendo dominado. Isso não é um sonho hedônico - o monge insano que invadiu minha sala do trono está segurando um bisturi em minha garganta!\n\n\"Suponho que, se você nos proibir de procurar a cabeça, poderíamos nos contentar com a sua. Tão rechonchuda e brilhante, aposto que vai rolar bem bonito!\""
 court.4500.a:0 "Meu sangue mal flui mais em meu corpo — vá embora!"
 court.4500.b:0 "Eu tentarei qualquer coisa neste ponto."
 court.4500.bleeder:0 "\"Eu construo artefatos para enganar tolos ricos e tirar o ouro deles. Um sussurro chegou até mim de que você tem um excesso de sangue. Tenho certeza de que você tem alguns admiradores que adorariam comprar um broche com uma esfera de vidro contendo uma gota do seu sangue.\" [artifact_peddler.GetSheHe|U] encara as veias do meu pescoço. \"Eu pagarei generosamente, e alguém se sentirá com um toque de majestade real."
 court.4500.c:0 "$court.4500.b$"
 court.4500.chastity_belt:0 "\"Todos no reino sabem que você é atormentado por desejos insaciáveis que têm a força de um catapulta lançando um cataphracto. Eu tenho um artefato que aliviará o seu fardo.\" [artifact_peddler.GetSheHe|U] revela um cinto de castidade adornado com espinhos enferrujados."
 court.4500.d:0 "Isso apenas aumentaria a queimação em minhas entranhas..."
 court.4500.dead_chicken:0 "\"Aqui tenho um trinket maravilhoso! Se você o portar, qualquer inimigo no campo de batalha pensará imediatamente que você já está morto! Um cheiro e sua segurança estão garantidas!\"\n\nDos confins do manto [artifact_peddler.GetHerHim], [artifact_peddler.GetSheHe] retira o corpo inteiro de uma galinha morta."
 court.4500.desc:0 "Um vendedor em um manto com dezenas de bugigangas costuradas nele se aproxima de mim, fazendo barulho.\n\n"
 court.4500.e:0 "O chamado do Destino está soando!"
 court.4500.f:0 "Venda suas mentiras em outro lugar!"
 court.4500.finger_bones:0 "\"Você me parece um colecionador experiente.\" [artifact_peddler.GetSheHe|U] tira e abre um baú surrado cheio de ossos de todos os membros imagináveis.\n\n\"Eu tenho alguns dos mais raros dedos de ossos de santos, alguns até folheados a ouro. Eles são vendidos individualmente, mas vou oferecer um preço especial para um conjunto completo de dez.\""
 court.4500.g:0 "Existe encanto em usar um relicário de Cristo para remendar minhas meias..."
 court.4500.h:0 "Então, é por isso que tantos camponeses têm nove dedos hoje em dia."
 court.4500.holy_needle:0 "\"Tenho comigo uma arma preciosa digna apenas de suas mãos. A Santa Lança de Antioquia, a Própria Lança do Destino! Com ela, você aniquilará completamente os infiéis no campo de batalha!\" [artifact_peddler.GetSheHe|U] puxa um pequeno pedaço de metal que se parece muito com uma agulha de costura."
 court.4500.i:0 "Eu quero um antebraço inteiro!"
 court.4500.j:0 "Oh, vá em frente, então."
 court.4500.k:0 "Já sou bastante bom em fingir estar morto."
 court.4500.l:0 "Não vou ser um manipulador de marionetes!"
 court.4500.m:0 "Eu gosto de um pouco de agitação!"
 court.4500.n:0 "$court.4500.j$"
 court.4500.psalter:0 "\"Eu tenho um magnífico Saltério - um manuscrito iluminado com uma capa esculpida em marfim adornada com contas de turquesa. Ele contém histórias de um[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] [ROOT.GetCharacter.GetWomanMan] e [cheating_character.GetWomanMan] apaixonados. A escultura certamente impressionará [Select_CString( cheating_character.IsFemale, 'a', 'o' )] [cheating_character.GetTitledFirstNameNoTooltip], fazendo com que [cheating_character.GetSheHe] nunca mais pense em se deitar com outro!\""
 court.4500.t:0 "Dedos de osso de um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip]"
 court.4500.worm:0 "\"[Select_CString( ROOT.GetCharacter.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.GetLadyLord], eu tenho um artefato de grande ilusão, com o qual você pode convencer todos de que possui poder mágico.\n\n[artifact_peddler.GetSheHe|U] brande uma minhoca de tecido colorida em um fio muito fino. \"Ela parece adormecida no início, mas ao manipular o fio, você pode criar a ilusão de que a minhoca ganhou vida! Imagine como isso impressionará as [dummy_gender.Custom('SenhorasSenhores')] na corte!\""
 court.4600.a:0 "Minha adega está fechada com muita frequência — uma garrafa para todos na corte!"
 court.4600.b.tt:0 "Se você parar de beber suas reservas, seu próximo banquete será mais barato."
 court.4600.b:0 "Minhas preciosas reservas! Você é um[Select_CString( cupbearer.IsFemale, 'a', '' )] #EMP servidor[Select_CString( cupbearer.IsFemale, 'a', '' )] indign[Select_CString( cupbearer.IsFemale, 'a', 'o' )]."
 court.4600.c.t:0 "Copeiro envenenado!"
 court.4600.c.tt:0 "Ambos devem aprender com sua falta de respeito, mas o mundo ficará cauteloso com seus venenos."
 court.4600.c:0 "\"As reservas estão fechadas porque mantenho [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')] envenenado!\""
 court.4600.d.cure.t:0 "Antídoto misturado em uma bebida"
 court.4600.d.cure.tt:0 "Seus venenos continuam em segredo"
 court.4600.d.tt:0 "Tente curar os tolos furtivamente e mantenha seus venenos em segredo."
 court.4600.d:0 "Traga rapidamente a outra garrafa onde o antídoto está guardado."
 court.4600.desc:0 "Eu vejo m[Select_CString( cupbearer.IsFemale, 'inha', 'eu' )] copeir[Select_CString( cupbearer.IsFemale, 'a', 'o' )] [cupbearer.GetTitledFirstName] e [Select_CString( cupbearer_friend.IsFemale, 'a', 'o' )] [cupbearer_friend.GetTitledFirstName] cambaleando um pouco e servindo uma bebida de uma das minhas garrafas mais raras para [Select_CString( cupbearer_friend.IsFemale, 'a', 'o' )] [cupbearer_friend.GetTitledFirstNameNoTooltip].\n\n\"É uma pena que [Select_CString( ROOT.GetCharacter.IsFemale, 'a', 'o' )] [ROOT.GetCharacter.GetTitledFirstName] tenha todo esse [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')] que [ROOT.GetCharacter.GetSheHe] acumula como um dragão."
 court.4600.desc_ending:0 "\n\nEles nem mesmo piscam quando me veem.\n\n \"Ah, [Select_CString( ROOT.GetCharacter.IsFemale, 'minha', 'meu' )] [ROOT.GetCharacter.GetLadyLord]! Estamos testando antecipadamente todas as suas bebidas em busca de veneno. Depois de sobrecarregar meu estômago com cada gole, amanhã terei apenas uma dor de cabeça como uma ferida de batalha adquirida lutando em sua honra!\""
 court.4600.desc_friend:0 "Qualquer amigo meu merece beber como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip]!\""
 court.4600.desc_lover:0 "Você é um [cupbearer.Custom('LoverPetName')] tão delicioso, você merece sabores tão maravilhosos quanto os seus."
 court.4600.e:0 "Acho que vou trancar essas malditas adegas por um tempo."
 court.4600.t:0 "A Melhor [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')|U] Disponível para a Humanidade"
 court.4700.a:0 "Que zombaria! Minha aflição é muito mais do que superstição!"
 court.4700.b.tt:0 "A operação será realizada..."
 court.4700.b:0 "Não suporto mais isso, tragam os cinzéis!"
 court.4700.c:0 "Não sou criminos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] — meu povo possui mentes atrasadas!"
 court.4700.d:0 "Vou recusar, mas talvez meu médico possa aprender com você."
 court.4700.desc_blind:0 "Sua visão não desapareceu, está apenas turva. Há espíritos nadando na polpa de seus olhos. Posso mergulhar nessas piscinas e trazê-los para fora."
 court.4700.desc_foreign_medicine:0 "Uma figura vestida de preto, vinda de uma terra estrangeira, chegou com uma maleta cheia de martelos misteriosos que se assemelham a ferramentas de escultor.\n\n\"Em minha terra, existe um ritual conhecido como trepanação, do qual você parece precisar."
 court.4700.desc_headache:0 "Dizem que você sofre de dores de cabeça esmagadoras. À medida que sua vida é preenchida com pressões, cada vez mais espíritos se reúnem e se alimentam das preocupações em seu crânio. $court.4700.desc_passage$"
 court.4700.desc_heavy_mind:0 "Sua mente está pesada, mas isso é apenas porque está sobrecarregada. Sua cabeça está repleta de espíritos roendo seu intelecto, pensamento por pensamento. $court.4700.growth$ $court.4700.desc_passage$\""
 court.4700.desc_lunatic:0 "Suas decisões são tomadas por um grupo de companheiros espirituais relutantes, eles são a assembleia lunática. $court.4700.growth$ Podemos trazê-los à tona, com a ajuda de alguns pregos."
 court.4700.desc_melancholic:0 "Imagine se todas as suas misérias pudessem simplesmente sair de seu corpo e se libertar no ar. Seus tormentos não são seus, mas espíritos vivos que posso libertar. $court.4700.growth$\""
 court.4700.desc_native_trepanning:0 "Uma figura vestida como médico aparece com uma maleta de ferramentas, mas meu estômago se revira ao ver um martelo e um cinzel entre elas.\n\n\"[Select_CString( ROOT.GetCharacter.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.GetLadyLord], sou um habilidoso trepanador."
 court.4700.desc_passage:0 "Posso criar uma passagem para libertá-los."
 court.4700.desc_possessed:0 "No meio de sua possessão, espíritos nadam ao redor de sua mente, mas eles não desejam verdadeiramente ficar. $court.4700.desc_passage$ $court.4700.growth$\""
 court.4700.desc_trepanning_vices:0 "Os vícios criminais dos quais você é acusado não são seus, você está apenas sob o domínio transitório de alguns espíritos. $court.4700.desc_passage$"
 court.4700.desc_witch:0 "Como ocultista, seus próprios poderes podem ser formidáveis, mas ainda há uma barreira que os impede. Suas magias poderiam conquistar o mundo inteiro se os espíritos do ar pudessem entrar em seu crânio.\""
 court.4700.growth:0 "Eles podem estar espreitando em um crescimento em seu cérebro."
 court.4700.headache:0 "Todas as suas preocupações desaparecem"
 court.4700.mental_faculties:0 "A trepanação danifica suas faculdades mentais"
 court.4700.no_success:0 "A trepanação não faz nada"
 court.4700.physical_faculties:0 "A trepanação danifica seu corpo"
 court.4700.removal:0 "A trepanação remove sua aflição"
 court.4700.success:0 "Você sobrevive à trepanação incólume"
 court.4700.t:0 "A Trepanação da Alma"
 court.4700.witch_power:0 "A trepanação aumenta seu poder de bruxo"
 court.4701.a:0 "Hee hee! Olá!"
 court.4701.b:0 "Desgraçado! O que você fez?!"
 court.4701.c:0 "Minha cabeça latejante!"
 court.4701.d:0 "Quem é um bom demônio? Sim, você é!"
 court.4701.e:0 "Deveria defenestrar todas as minhas roupas íntimas!"
 court.4701.f:0 "Fantástico! Gostaria de ser meu médico?"
 court.4701.g:0 "Prova de que minhas supostas 'vícios' dificilmente são obra de demônios"
 court.4701.h:0 "Devo-lhe uma dívida... depois de encontrar uma rolha para o buraco..."
 court.4701.i:0 "Meus pensamentos aflitos são um inimigo que só eu posso enfrentar."
 court.4701.mental_health_cannot_be_trepanned_away:0 "$court.4701.trepanning_vices_operation$ \n\nEmbora eu desejasse que um tratamento pudesse aliviar as dores, há alguma segurança em saber que pelo menos minha mente é minha e não de um demônio."
 court.4701.no_physician:0 "Sou levad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a uma sala nos fundos do meu [ROOT.Char.Custom('FortifiedBuilding')]. [trepanner.GetTitledFirstNameNoTooltip] me assegura que só causaria aflição se minha corte pudesse ouvir meus gritos enquanto sou amarrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a uma cadeira.\n\n"
 court.4701.physician_concerned:0 "\"Tenha cuidado com [ROOT.GetCharacter.GetSheHe]!\"\n\n"
 court.4701.physician_concerned_2:0 "\"Eu ajudarei se essa prática vulgar falhar.\"\n\n"
 court.4701.physician_excited:0 "\"Ah, como eu adoro uma boa trepanação!\"\n\n"
 court.4701.physician_excited_2:0 "\"Que empolgante! Um novo procedimento!\"\n\n"
 court.4701.physician_study:0 "Sou levad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ao estudo [Select_CString( court_physician.IsFemale, 'da minha', 'do meu' )] médic[Select_CString( court_physician.IsFemale, 'a', 'o' )] [court_physician.GetTitledFirstName], que [Select_CString( trepanner.IsFemale, 'a', 'o' )] [trepanner.GetTitledFirstName] sugere ter os talentos para ajudar em nosso empreendimento. Enquanto [trepanner.GetSheHe] me amarra a uma cadeira, [court_physician.GetTitledFirstNameNoTooltip] paira atrás."
 court.4701.pope_joan_desc:0 "\n\nAo observar as ilustrações, percebo que os desenhos de Joana usam minhas características em seu rosto, como se fossem minhas!\n\n[poet.GetTitledFirstNameNoTooltip|U] se inclina em minha direção. 'Seus encantos superam em muito os de nossa Papisa. Assim como o amante de Joana a convenceu a se vestir como homem e estudar em Atenas, concedo-lhe este texto desejando que a figura que supostamente devo adorar fosse você.'"
 court.4701.ruler_hero_desc:0 "\n\nO poema é sobre meus feitos gloriosos, alguns menos reais que outros, mas todos absolutamente impressionantes."
 court.4701.trepanning_blind_injury:0 "minha visão de repente se torna um mar de neblina. No segundo seguinte, lamento até mesmo essa neblina ao entrar em um reino de crepúsculo eterno."
 court.4701.trepanning_coordination_penalty:0 "Começo a não sentir nada. Quando o cinzel é finalmente removido, não consigo senti-lo. Ao tentar levantar, meu corpo mal obedece."
 court.4701.trepanning_deviant_injury:0 "Conforme o buraco começa a ser cavado, começo a apreciar o som das minhas entranhas esmagadas. Após uma vertigem da minha mente, sou tomado por súbitos momentos de genialidade! Devo me tornar noturno e consumir apenas cascas de pão! Por que nunca fiz amor enquanto fingia ser um cavalo?"
 court.4701.trepanning_headache_operation:0 "$court.4701.trepanning_no_result$ A dor em minha cabeça desaparece."
 court.4701.trepanning_incapable_injury:0 "Uma luz me envolve. Sinto um fluxo e vejo imagens de dias e anos passados aparecendo de uma vez. Onde estou? Por que tenho dor de cabeça? Qual é o meu nome? Qual é o meu recheio de torta favorito?"
 court.4701.trepanning_learning_penalty:0 "Conforme o bisturi gira e gira, percebo que estou lutando para sequer chorar #EMP pare! #!Quando o movimento finalmente cessa, minha mente nadante sente que precisa atravessar lama para formar uma frase."
 court.4701.trepanning_mental_injury:0 "[trepanner.GetTitledFirstNameNoTooltip] bate levemente em meu crânio com um martelo, como se [trepanner.GetSheHe] estivesse quebrando um ovo cozido."
 court.4701.trepanning_no_result:0 "Recupero o controle. Quando o cinzel é finalmente removido e não sinto diferença alguma além de uma brisa leve soprar em meu cérebro exposto."
 court.4701.trepanning_physical_injury:0 "A princípio, os cinzéis que cortam meu crânio causam tanta dor em meu corpo que minha própria coluna parece serrada ao meio. Conforme a escavação vai mais fundo,"
 court.4701.trepanning_possessed_injury:0 "Embora tenham me prometido que eu estava libertando espíritos da minha cabeça, de repente testemunho um espírito pela primeira vez. Uma sombra alada e bela dança de sombra em sombra na sala e sorri para mim."
 court.4701.trepanning_success:0 "O martelo faz o cinzel adentrar minha cabeça. Ao mesmo tempo, os portões do meu corpo se abrem. Eu palpito, tremo, arrepio e sinto minhas tormentas sendo aliviadas. Em meio a uma chuva de faíscas da dor, emergo em um mundo novo deliciosamente calmo."
 court.4701.trepanning_vices_operation:0 "O martelo se choca contra meu crânio, mas, agarrado à cadeira, $court.4701.trepanning_no_result$"
 court.4701.trepanning_witch_power:0 "Não tenho medo quando o cinzel começa a se enterrar em meu crânio. Em meio ao esfregar de pomadas em meu cérebro e à sensação ofuscante, posso ouvir a risada de [ROOT.Char.GetFaith.WitchGodName|U], e [ROOT.Char.GetFaith.WitchGodSheHe] está zombando deste ritual tolo.\n\n$court.4701.trepanning_no_result$"
 court.4750.a:0 "Invente uma história do reinado da Papa Joana!"
 court.4750.b:0 "Lady Godiva! Uma balada sobre sua cavalgada!"
 court.4750.c:0 "Sinbad é uma figura tão corajosa!"
 court.4750.d:0 "Calígula... pouco apreciado, mas uma figura intrigante."
 court.4750.desc:0 "Um novo hóspede chegou recentemente à minha corte, um poeta de língua afiada e alguma reputação local.\n\n\"M[Select_CString( ROOT.GetCharacter.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.GetLadyLord], assim como os contadores de histórias antigos sentavam-se aos pés de guerreiros lendários, eu, [poet.GetFirstName], espero encontrar emprego sob sua proteção. Por favor, permita-me demonstrar meu valor! Eu poderia dedicar minha próxima obra a você, talvez!\"\n\n\"Grandes épicos são minha especialidade, grande [ROOT.Char.GetTitleAsName]: sobre qual herói você gostaria que eu cantasse?\""
 court.4750.e:0 "As histórias de Nasrudin sempre arrancam um sorriso dos meus lábios."
 court.4750.f:0 "Fale-me sobre Valmiki, o poeta arauto!"
 court.4750.g:0 "Bem, é claro que seria eu mesmo!"
 court.4750.h:0 "Eu não tenho tempo nem ouro a perder."
 court.4750.t:0 "Eu Preciso de um Herói"
 court.4751.a:0 "De alguma forma, a impropriedade de sua admiração a torna mais sedutora..."
 court.4751.b:0 "Talvez eu deva mirar no Papado..."
 court.4751.c.tt:0 "Aqueles atraídos por você certamente notarão..."
 court.4751.c:0 "Ficarei irritado, mas isso certamente me conquistará admiradores..."
 court.4751.d:0 "Isso está plantando pensamentos impuros em minha mente."
 court.4751.e:0 "Sempre há algo a ser aprendido por trás de suas piadas."
 court.4751.f:0 "Isso é divertido, tenho certeza de que a corte irá gostar."
 court.4751.g:0 "Como deve ser!"
 court.4751.h:0 "Isso parece ser uma excelente faísca para o meu próximo incêndio."
 court.4751.intro:0 "Conforme meu pedido, [Select_CString( poet.IsFemale, 'a', 'o' )] nov[Select_CString( poet.IsFemale, 'a', 'o' )] poeta, [poet.GetFirstName], me traz uma obra inspirada em"
 court.4751.ruler_character:0 "\n\nAo folhear brevemente os manuscritos iluminados, percebo que sou retratado ao lado do herói como personagem!\n\n"
 court.4751.topic.caligula:0 "Calígula,"
 court.4751.topic.caligula_desc:0 "Sou um personagem no texto: o conselheiro cansado de Calígula, cheio de sabedoria, mas, infelizmente, raramente ouvido."
 court.4751.topic.lady_godiva:0 "Lady Godiva,"
 court.4751.topic.lady_godiva_desc:0 "Estou cavalgando ao lado de Lady Godiva neste poema. Tão belo quanto — mas igualmente nu!"
 court.4751.topic.nasreddin:0 "Nasrudin,"
 court.4751.topic.nasreddin_desc:0 "Os contos mostram Nasreddin cavalgando atrás de mim enquanto realizo minhas tarefas na corte, fazendo comentários sarcásticos a cada ação minha do alto de seu burro."
 court.4751.topic.pope_joan:0 "Papisa Joana,"
 court.4751.topic.ruler_hero:0 "minha vida heróica,"
 court.4751.topic.sinbad:0 "Sinbad,"
 court.4751.topic.sinbad_desc:0 "Eu sou um personagem misterioso que Sinbad encontra repetidamente em suas aventuras. Sou a criatura que choca do colossal ovo de Roc. Sou o Velho do Mar que se agarra aos ombros de Sinbad por anos. Sou um prisioneiro do gigante devorador de homens."
 court.4751.topic.unexpected:0 "mas não é como eu esperava."
 court.4751.topic.valmiki:0 "Valmiki,"
 court.4751.topic.valmiki_desc:0 "\n\nComo na lenda, um caçador dispara contra um belo pássaro e eu não consigo evitar recitar um dístico.\n\nAssim como o poeta precursor compôs o primeiro poema por acidente, também eu componho versos espontâneos sempre que sou pego de surpresa."
 court.4800.a:0 "Vamos ver se os gansos sabem voar!"
 court.4800.b:0 "Vamos não exagerar! Dê uma pequena surra educada n[defenestrated_character.GetSheHe]."
 court.4800.c:0 "[defenestrated_character.GetTitledFirstNameNoTooltip] está cert[Select_CString( defenestrated_character.IsFemale, 'a', 'o' )] — um bom guarda nunca se deixa provocar."
 court.4800.death_toast:0 "[defenestrated_character.GetTitledFirstName] pereceu no voo"
 court.4800.desc:0 "\"Faça o barulho mais uma vez, palhaço, e você será arremessado!\" Ao me deparar com meu Guarda-costas, [defenestrating_bodyguard.GetTitledFirstName], percebo que [defenestrating_bodyguard.GetSheHe] está acompanhado pelo traseiro d[Select_CString( defenestrated_character.IsFemale, 'a', 'o' )] [defenestrated_character.GetTitledFirstName], a quem [defenestrating_bodyguard.GetSheHe] está suspendendo pela janela.\n\n[defenestrating_bodyguard.GetTitledFirstNameNoTooltip] range os dentes. \"[defenestrated_character.GetSheHe|U] estava zombando da minha expressão séria enquanto estou de serviço. [defenestrated_character.GetSheHe|U] continuava fazendo barulhos de ganso para tentar me fazer perder a compostura. Eu digo que isso é uma ameaça à sua segurança.\"\n\nApesar do perigo, em meio a tentativas vãs de se soltar, [defenestrated_character.GetTitledFirstNameNoTooltip] solta uma risadinha. \"#EMP Honk#!.\""
 court.4800.maimed_toast:0 "[defenestrated_character.GetTitledFirstName] não consegue voar"
 court.4800.t:0 "Abra suas Asas"
 court.4801.a:0 "\"Venha para os meus braços, vamos te limpar.\""
 court.4801.b:0 "Eu prefiro perder uma guerra do que tocar nessa sujeira."
 court.4801.desc:0 "Muito antes de eu ver [Select_CString( poopy_child.IsFemale, 'a', 'o' )] pequen[Select_CString( poopy_child.IsFemale, 'a', 'o' )] [poopy_child.GetTitledFirstName] brincando em minha sala do trono, sinto um cheiro inconfundível.\n\n\"Ooh, [ROOT.GetCharacter.Custom('GetMamaPapa')]! É sempre uma alegria vê-l[Select_CString( ROOT.GetCharacter.IsFemale, 'a', 'o' )]!\" Enquanto [poopy_child.GetSheHe] se apressa para abraçar minhas pernas, sinto o peso da fralda suja [poopy_child.GetHerHim] esmagando contra minha panturrilha.\n\nConforme começa a vazar sobre meu tornozelo, pergunto a mim mesmo: Será que realmente temos tão poucos servos que devo me ocupar dessa tarefa degradante de trocar a fralda eu mesmo?"
 court.4801.t:0 "Pronto para Explodir"
 court.4802.a:0 "Oh, eles são adoráveis, não são?"
 court.4802.b:0 "Eu vou te comprar uma trombeta, [child_2.GetTitledFirstNameNoTooltip]. Isso será #EMP ainda mais#! alto!"
 court.4802.c:0 "Eu entendo, vamos procurar um novo Tutor."
 court.4802.desc:0 "Vejo m[Select_CString( court_tutor.IsFemale, 'inha', 'eu' )] Tutor[Select_CString( court_tutor.IsFemale, 'a', '' )] da Corte, [court_tutor.GetTitledFirstName], com um grupo de estudantes o cercando.\n\n\"Tutor, o que é um paralelogramo?\"\n\n\"Tutor, o que significa... 'fazer amor'?\"\n\n\"Tutor, devo tocar minha flauta mais alto, ou #EMP muito#! mais alto?\"\n\n[court_tutor.GetTitledFirstNameNoTooltip] olha para mim com olhos afundados. \"[Select_CString( ROOT.GetCharacter.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.GetLadyLord], não consigo mais suportar. Por favor, alivie-me de minha posição.\""
 court.4802.t:0 "Educação Sob Coação"
 court.4803.a:0 "Minhas palavras poderiam usar um certo... floreado."
 court.4803.b:0 "Às vezes, sinto que sou mais poeta do que [Select_CString( ROOT.GetCharacter.IsFemale, 'a', 'o' )] [ROOT.GetCharacter.GetTitleAsName], não preciso de ajuda."
 court.4803.c.fooled.tt:0 "[lover.GetFirstNameNoTooltip] fica lisonjead[Select_CString( lover.IsFemale, 'a', 'o' )] com o poema 'seu'"
 court.4803.c.intrigue.tt:0 "A habilidade alta d[Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetFirstNameNoTooltip] em [intrigue|E] pode fazer [lover.GetSheHe] perceber que foi escrito por outra pessoa."
 court.4803.c.realize.tt:0 "[lover.GetFirstNameNoTooltip] percebe o verdadeiro autor"
 court.4803.c.tt:0 "Você enviará o poema para [Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetTitledFirstName]"
 court.4803.c:0 "Eu preferiria que você escrevesse um poema de mim para o meu amado."
 court.4803.d:0 "Minhas palavras podem não ser refinadas, mas são do fundo do meu coração."
 court.4803.desc:0 "M[Select_CString( court_poet.IsFemale, 'inha', 'eu' )] Poeta, como [court_poet.GetSheHe] sempre faz assim que estou ao alcance, começa a declamar para mim. \"Ó, você, meu precioso [ROOT.GetCharacter.Custom('PetName')]! Deve ser tão difícil viver como alguém abandonado pelas musas.\"\n\n\"Você comanda exércitos, mas não consegue comandar as palavras escritas. Será que a humanidade já testemunhou uma tragédia mais exquisita?\"\n\n\"Permita-me ajudar você. Eu poderia escrever alguns de seus discursos. Diga-me o tema, e aplicarei uma bela expressão."
 court.4803.t:0 "Uma Pena Fantasmagórica"
 court.4804.a:0 "Vou pedir aos servos que encontrem novos colegas de quarto para você."
 court.4804.b:0 "Estas acomodações não são dignas de um[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] [ROOT.GetCharacter.GetTitleAsName]."
 court.4804.c:0 "Não temos espaço para conceder um quarto individual a todos."
 court.4804.desc:0 "Eu percebo dois dos meus cortesãos que compartilham a mesma acomodação discutindo, ambos com olheiras escuras sob os olhos.\n\n\"[Select_CString( ROOT.GetCharacter.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.GetLadyLord], não consigo mais dividir a cama com [Select_CString( roomate_2.IsFemale, 'a', 'o' )] [roomate_2.GetTitledFirstName] por mais uma noite. [roomate_2.GetSheHe|U] é um[Select_CString( roomate_2.IsFemale, 'a', '' )] porc[Select_CString( roomate_2.IsFemale, 'a', 'o' )] insaciável, a maneira como [roomate_2.GetSheHe] monopoliza o cobertor.\"\n\n\"E não houve uma noite nesta semana em que [Select_CString( roomate_1.IsFemale, 'a', 'o' )] [roomate_1.GetTitledFirstName] não tenha [ROOT.Char.Custom('RandomBadRoomate')].\" [roomate_2.GetSheHe|U] estremece. \"Eu imploro a você: conceda-nos acomodações melhores. Eu sonho apenas com uma cama fria e vazia.\""
 court.4804.t:0 "Companheiros de Cama Desagradáveis"
 court.4805.a:0 "Vamos construir um chiqueiro com ela!"
 court.4805.b:0 "Quero que seja exibida com orgulho!"
 court.4805.c:0 "Me arrependo da minha disputa com [rival.GetSheHe] como está. Coloque-a de volta."
 court.4805.d:0 "Por que você me trouxe esse entulho? Jogue fora!"
 court.4805.desc:0 "M[Select_CString( royal_architect.IsFemale, 'inha', 'eu' )] Arquitet[Select_CString( royal_architect.IsFemale, 'a', 'o' )], [royal_architect.GetTitledFirstName], está carregando um enorme saco e sorrindo o tempo todo. Eu me contorço ao ver o saco arranhando e riscando o chão da minha sala do trono.\n\n\"[Select_CString( ROOT.GetCharacter.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.GetLadyLord], eu fiz algo #EMP muito#! travesso, mas tenho a sensação de que você vai adorar.\"\n\nEu espero testemunhar algo obsceno quando [royal_architect.GetSheHe] abre o saco, mas dentro dele vejo apenas um grande pedaço retangular de pedra. \"Esta é a pedra fundamental de [rival.Custom('FortifiedBuilding')] [Select_CString( rival.IsFemale, 'da sua inimiga jurada', 'do seu inimigo jurado' )] [rival.GetTitledFirstName]. Agora todo o simbolismo colocada n[rival.GetSheHe] se foi!\""
 court.4805.t:0 "Cortando Caminhos"
 court.4806.a:0 "Isso é lisonjeiro, embora um pouco invasivo."
 court.4806.b:0 "Dê-me essa coisa vagabunda! Somente eu posso usar a coroa."
 court.4806.byzantine_desc:0 "À medida que o visitante animado se aproxima, os guardas têm que impedi-lo de chegar muito perto.\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip]! Embora eu seja de [adoring_fan_liege.GetCapitalLocation.GetTitle.GetNameNoTier], eu adoro os [ROOT.Char.GetCulture.GetCollectiveNoun] mais do que meu coração pode suportar.\"\n\n\"Eu dediquei minha vida a tentar viver como um de vocês, imerso no estudo da [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip].\"\n\n\"Eu só uso roupas íntimas roxas. Tenho certeza de que se o Império caísse, eu sentiria isso mais intensamente do que a morte da minha própria mãe — o mundo nunca ouviria o fim dos meus lamentos de luto!\""
 court.4806.c.byz:0 "Devido ao seu patriotismo, permitirei que você use roxo."
 court.4806.c:0 "Alguém tão entusiasmado deveria se juntar à nossa corte!"
 court.4806.d:0 "Apenas um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] pode usar roxo! Prenda est[Select_CString( adoring_fan.IsFemale, 'a', 'e' )] miserável!"
 court.4806.e:0 "Como ousa copiar [ROOT.Char.Custom('signature_weapon')]? Tire isso [adoring_fan.GetHerHim]!"
 court.4806.general_desc:0 "Há algo estranho nesse visitante e, quando [adoring_fan.GetSheHe] se aproxima, fica evidente que [adoring_fan.GetSheHe] está carregando uma réplica da minha [ROOT.Char.Custom('signature_weapon')] favorita.\n\n\"Não consigo deixar de me curvar diante de você — dediquei minha vida em [adoring_fan_liege.GetCapitalLocation.GetTitle.GetNameNoTier] para apreciar a cultura dos [ROOT.Char.GetCulture.GetCollectiveNoun]. Só falo em [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip], como [ROOT.Char.GetCulture.GetNameNoTooltip] [ROOT.GetCharacter.Custom('GetExpensiveMeal')] e estudei a lâmina no estilo [ROOT.Char.GetCulture.GetName].\"\n\n\"Minha família me proibiu de entrar em nossa casa, alegando que se eu não consigo fazer nada além de obcecar sobre o [ROOT.GetCharacter.GetPrimaryTitle.GetNameNoTooltip], eu deveria viver lá em vez disso.\""
 court.4806.hre_desc:0 "\n\n\"Meu coração! O [ROOT.GetCharacter.GetPrimaryTitle.GetNameNoTierNoTooltip] é o melhor! Embora eu viva em [adoring_fan_liege.GetCapitalLocation.GetTitle.GetNameNoTier], eu realmente acredito que nasci com o coração [ROOT.Char.GetCulture.GetName]! Eu consigo listar todos os Príncipes-Bispos. Eu até tenho uma tatuagem do rosto d[Select_CString( ROOT.GetCharacter.IsFemale, 'a', 'o' )] [ROOT.GetCharacter.GetTitledFirstNameNoTooltip] na minha panturrilha.\"\n\n[adoring_fan.GetSheHe|U] coloca a mão na mochila e tira o que parece ser uma réplica barata de bronze da Reichskrone. \"Eu uso isso na maioria dos dias e digo às pessoas 'Espero ter o seu voto, Príncipe-eleitor!'\""
 court.4806.intro:0 "Um rosto novo está passeando pela minha sala do trono, ocasionalmente rindo e pulando no lugar quando [adoring_fan.GetSheHe] avista alguma obra de arte que representa os costumes [ROOT.Char.GetCulture.GetNameNoTooltip]."
 court.4806.t:0 "[ROOT.Char.GetTitleAsNameNoTooltip]ófilo"
