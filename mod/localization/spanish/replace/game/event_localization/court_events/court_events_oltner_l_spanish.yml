l_spanish:
 absolutely_horrified_opinion:0 "Absolutamente Horrificado"
 best_meal_of_my_life_modifier:0 "Melhor Refeição da Minha Vida"
 best_meal_of_my_life_modifier_desc:0 "Este personagem comeu algo absolutamente espetacular!"
 court.9000.a:0 "[flirty_knight.GetFirstNameNoTooltip], [Select_CString( flirty_knight.IsFemale, 'sua', 'seu' )] [flirty_knight.Custom2('InsultNounSexual', ROOT.Char)]! Para a masmorra!"
 court.9000.b:0 "[flirty_spouse.GetFirstNameNoTooltip]! Afaste-se [flirty_knight.GetHerHim], [Select_CString( flirty_spouse.IsFemale, 'sua', 'seu' )] [flirty_spouse.Custom2('InsultNounSexual', ROOT.Char)]!"
 court.9000.c:0 "Ah, amor cortês! Deixem essa maravilhosa poesia ecoar pelos corredores!"
 court.9000.desc:0 "Enquanto me aproximo do meu trono, ouço m[Select_CString( flirty_knight.IsFemale, 'inha', 'eu' )] $knight_culture_player_no_tooltip_lowercase$ [flirty_knight.GetFirstName] proclamando algo para [Select_CString( flirty_spouse.IsFemale, 'minha', 'meu' )] [flirty_spouse.GetWifeHusband], [flirty_spouse.GetFirstName].\n\n\"[flirty_knight.Custom('GeneratePoem_Intro_Rhyming')]\n[flirty_knight.Custom('GeneratePoem_Outro_Rhyming')]\"\n\nSerá que [flirty_knight.GetSheHe] está recitando poesia romântica? Para #EMP [Select_CString( flirty_spouse.IsFemale, 'minha', 'meu' )]#! [flirty_spouse.GetWifeHusband]!?"
 court.9000.t:0 "Declaração de um Cavaleiro"
 court.9001.a.tt:0 "#V Duelo#! [flirty_knight.GetFirstName] para fazer [flirty_knight.GetSheHe] deixar [Select_CString( flirty_spouse.IsFemale, 'sua', 'seu' )] [flirty_spouse.GetWifeHusband] em paz!\n#weak Este duelo NÃO é até a morte.#!\nSe você vencer, o coração d[Select_CString( flirty_spouse.IsFemale, 'a', 'o' )] [flirty_spouse.GetFirstName] será apenas s[Select_CString( flirty_spouse.IsFemale, 'ua', 'eu' )]. Se você perder, quem sabe o que acontecerá?\n\nSua [prowess|E]: [prowess_i]#V [root_for_loc.GetProwess]#!\n[prowess|E] d[Select_CString( flirty_knight.IsFemale, 'a', 'o' )] [flirty_knight.GetFirstName]: [prowess_i]#V [flirty_knight.GetProwess]#!"
 court.9001.a:0 "[flirty_spouse.GetFirstNameNoTooltip] é #EMP m[Select_CString( flirty_spouse.IsFemale, 'inha', 'eu' )].#! Desembainhe sua espada!"
 court.9001.b:0 "Entregue isso! [flirty_knight.GetFirstNameNoTooltip] — Eu te desterro do reino!"
 court.9001.c:0 "O amor cortês é tão puro, tão inocente!"
 court.9001.desc:0 "Vejo [Select_CString( flirty_spouse.IsFemale, 'minha', 'meu' )] [flirty_spouse.GetWifeHusband] [flirty_spouse.GetFirstName] e m[Select_CString( flirty_knight.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('flirty_knight'))] [flirty_knight.GetFirstName] compartilhando o que parece ser um momento apaixonado — com [Select_CString( flirty_knight.IsFemale, 'a', 'o' )] [flirty_knight.GetFirstNameNoTooltip] ajoelhad[Select_CString( flirty_knight.IsFemale, 'a', 'o' )] diante [flirty_spouse.GetHerHim].\n\n\"M[Select_CString( flirty_spouse.IsFemale, 'inha', 'eu' )] [flirty_spouse.Custom('RomanticComplimentNoun')]! Por favor, aceite este humilde presente.\" [flirty_knight.GetFirstNameNoTooltip] diz, entregando [flirty_spouse.Custom('SeductionGiftTypeIndefiniteSimple')].\n\n\"Oh!\" [flirty_spouse.GetFirstNameNoTooltip] gagueja. \"Eu amei! É maravilhoso.\"\n\nO que exatamente está acontecendo aqui?"
 court.9001.t:0 "Um Presente Cortês"
 court.9002.trigger_failure:0 "Meu duelo contra [flirty_knight.GetFirstNameNoTooltip] foi invalidado"
 court.9004.a:0 "[flirty_spouse.GetFirstNameNoTooltip] é apenas m[Select_CString( flirty_spouse.IsFemale, 'inha', 'eu' )]."
 court.9004.desc:0 "\"Eu deixo minha arma diante de você — sua alma é [ROOT.Char.Custom('ComplimentAdjective')], e mais merecedora do coração d[Select_CString( flirty_spouse.IsFemale, 'a', 'o' )] [flirty_spouse.GetFirstName]!\" diz [flirty_knight.GetFirstName], derrotado.\n\"Eu servirei você sem questionar a partir de agora, [ROOT.Char.GetTitleTierName].\"\n\n[Select_CString( flirty_spouse.IsFemale, 'Minha', 'Meu' )] [flirty_spouse.GetWifeHusband] [flirty_spouse.GetFirstNameNoTooltip] se vira para mim, um novo fogo em seus olhos.\n\n\"[ROOT.Char.GetWifeHusband|U], você arriscou sua vida por meu afeto! Ah, seu coração é nobre — a partir de agora, eu sou apenas sua!\""
 court.9004.t:0 "$court.9001.t$: Vitorioso"
 court.9005.a:0 "[ROOT.Char.Custom('CulturalCurse')|U]!"
 court.9005.desc:0 "\"Você nunca mereceu o amor d[Select_CString( flirty_spouse.IsFemale, 'a', 'o' )] [flirty_spouse.GetFirstName]!\" exclama [Select_CString( flirty_knight.IsFemale, 'a', 'o' )] [flirty_knight.GetFirstName].\n\n\"Oh, m[Select_CString( flirty_spouse.IsFemale, 'inha', 'eu' )] [flirty_knight.Custom('ComplimentAdjective')] herói[Select_CString( flirty_spouse.IsFemale, 'na', '' )], eu gostaria que pudéssemos escapar deste lugar sombrio! Mas nosso amor ganhou o direito de florescer, mesmo assim,\" diz [flirty_spouse.GetFirstNameNoTooltip], com um suspiro de anseio.\n\n[flirty_knight.GetFirstNameNoTooltip] me fita, com expressão impassível."
 court.9005.t:0 "$court.9001.t$: Derrotado"
 court.9100.a:0 "Mais trabalho, menos entupir seus rostos!"
 court.9100.b:0 "Todos vocês merecem o melhor!"
 court.9100.c:0 "Deixe um pouco de bebida para mim, [food_lover_3.GetFirstNameNoTooltip] — É melhor compartilhar com os amigos!"
 court.9100.d:0 "Eu devo deixá-los em paz."
 court.9100.desc:0 "\"Ah, excelente! [food_lover_1.Custom('GetExpensiveMeal')|U], o meu favorito!\" [food_lover_1.GetFirstName] exclama alegremente, devorando [food_lover_1.GetHerselfHimself] enquanto o servo tenta equilibrar desesperadamente a bandeja de serviço.\n\n\"Oh, meu amado [food_lover_2.Custom('GetExpensiveDessert')], você é realmente delicioso!\" [food_lover_2.GetFirstName] diz com uma voz cantante.\n\n\"Agora sim, é disso que a vida se trata! Servos, mais [food_lover_1.Custom('GetExpensiveDrink')], agora!\" [food_lover_3.GetFirstName] exige.\n\nParece que meus cortesãos estão se divertindo!"
 court.9100.t:0 "Entretenimento Epicurista"
 court.9200.a:0 "Você se importa se eu me juntar a vocês para uma [food_lover_1.Custom('GetExpensiveMeal')]?"
 court.9200.b:0 "Servos, vocês não veem que eles estão morrendo de fome? Tragam mais [food_lover_2.Custom('GetExpensiveDessert')]!"
 court.9200.c:0 "Seria indelicado perturbá-los enquanto comem!"
 court.9200.desc:0 "\"Noss[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleTierName] é verdadeiramente generos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], [food_lover_2.GetFirstNameNoTooltip]! Experimente essa #EMP espetacular#! [food_lover_1.Custom('GetExpensiveMeal')]!\" [food_lover_1.GetFirstName] exclama poeticamente.\n\n\"Sim, com certeza! [ROOT.Char.GetLadyLord|U] [ROOT.Char.GetFirstNameNoTooltip] é muito [food_lover_1.Custom('ComplimentAdjective')] — assim como essa [food_lover_2.Custom('FavoriteTreat')]!\" [food_lover_2.GetFirstName] responde entusiasmado.\n\nParece que meu gasto com refeições luxuosas fez uma nova amizade florescer!"
 court.9200.t:0 "Vínculo Bacanal"
 court.9300.a:0 "#EMP Você comeu o [overindulger_target.Custom('FavoriteTreatDemand')] real!?"
 court.9300.b.failure:0 "[overindulger_target.GetFirstNameNoTooltip] não é dissuadid[Select_CString( overindulger_target.IsFemale, 'a', 'o' )] e se recusa a lhe pagar de volta."
 court.9300.b.success:0 "Você convence [Select_CString( overindulger_target.IsFemale, 'a', 'o' )] [overindulger_target.GetFirstNameNoTooltip] a parar de comer [overindulger_target.Custom('FavoriteTreatDemand')] e pagar-lhe de volta."
 court.9300.b:0 "Por [ROOT.Char.GetFaith.HighGodName], [overindulger_target.GetWomanMan]! Reaja!"
 court.9300.c:0 "Ah, você #EMP é melhor#! pagar por isso."
 court.9300.d:0 "Você está proibido de entrar na despensa a partir de agora..."
 court.9300.desc:0 "\"M... m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleTierName]. S[Select_CString( overindulger_target.IsFemale, 'ua', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('overindulger_target'))] [overindulger_target.GetFirstName], [overindulger_target.GetSheHe] simplesmente... #EMP [overindulger_target.GetSheHe] simplesmente não para de comer [overindulger_target.Custom('GetExpensiveDessert')]!#!\" M[Select_CString( worried_courtier.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', worried_courtier)] [worried_courtier.GetFirstName] balbucia.\n\nNeste exato momento, avisto [Select_CString( overindulger_target.IsFemale, 'a', 'o' )] [overindulger_target.GetFirstNameNoTooltip] saindo da despensa, carregando um monte de [overindulger_target.Custom('GetExpensiveDessert')] em ambos os braços.\n\n\"Existe algum problema, [Select_CString( ROOT.Char.IsFemale, 'minha senhora', 'meu senhor' )]?\" [overindulger_target.GetFirstNameNoTooltip] diz, [overindulger_target.Custom('quirk_neg_pp')]."
 court.9300.t:0 "Excesso Aberto"
 court.9400.a:0 "Sabe de uma coisa? Estou com fome. #EMP Entre de volta na torta.#!"
 court.9400.b:0 "Ah, [court_jester.GetFirstNameNoTooltip], que criatividade! Aqui, um presente de apreço."
 court.9400.c:0 "#EMP Assassino! Guardas!#!"
 court.9400.d:0 "Har har! Agora isso é entretenimento!"
 court.9400.desc:0 "O que é isso agora? Uma torta #EMP gigantesca#!, no meio da minha sala do trono!?\n\n\"Gostaria de um pedaço de torta, m[Select_CString( you_target.IsFemale, 'inha', 'eu' )] [pie_presenting_courtier.Custom2('RelationToMeShort', SCOPE.sC('you_target'))]?\" [pie_presenting_courtier.GetFirstName] ri.\n\"Ela tem uma surpresa! Aqui está uma faca, por favor — sinta-se à vontade para cortar um pedaço!\"\n\nRelutantemente, pego a faca e corto cuidadosamente a crosta. De repente, m[Select_CString( court_jester.IsFemale, 'inha', 'eu' )] Bob[Select_CString( court_jester.IsFemale, 'a', 'o' )] da Corte [court_jester.GetFirstName] irrompe em gargalhadas e acena com as mãos!"
 court.9400.t:0 "Diversão com Torta"
 court.9500.a:0 "Isso parece muito útil. Vou pagar #EMP qualquer coisa#! para ver isso acontecer."
 court.9500.b.failure:0 "[child_to_learn_language.GetFirstNameNoTooltip] está estressad[Select_CString( child_to_learn_language.IsFemale, 'a', 'o' )]"
 court.9500.b.success:0 "[child_to_learn_language.GetFirstNameNoTooltip] consegue aprender [culture_language_to_learn.GetLanguage.GetNameNoTooltip]"
 court.9500.b:0 "[child_to_learn_language.GetFirstNameNoTooltip], faça o seu melhor!"
 court.9500.c:0 "Pff! Quem precisa falar algo além de [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]!?"
 court.9500.desc:0 "\"Saudações, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitleTierName].\" [teacher_target.GetFirstName] diz, [teacher_target.Custom('quirk_pos_pp')].\n\n\"Estou muito interessado na educação [Select_CString( child_to_learn_language.IsFemale, 'da sua', 'do seu' )] [child_to_learn_language.Custom('GetDaughterSon')], [child_to_learn_language.GetFirstName]. Veja bem, eu falo [culture_language_to_learn.GetLanguage.GetNameNoTooltip] — uma língua que acredito ser muito útil para [child_to_learn_language.GetSheHe] aprender.\" [teacher_target.GetSheHe] explica com um tom genuíno.\n\n\"Só preciso de moedas para penas, tinta, pergaminho... e alguma compensação pessoal, é claro.\""
 court.9500.t:0 "Um Pouco de Linguagem"
 court_9000_a_tt:0 "Se algo está acontecendo entre [flirty_spouse.GetFirstName] e [Select_CString( flirty_knight.IsFemale, 'a', 'o' )] [flirty_knight.GetFirstName], termina aqui\n"
 court_9000_b_tt:0 "Se algo está acontecendo entre [flirty_spouse.GetFirstName] e [Select_CString( flirty_knight.IsFemale, 'a', 'o' )] [flirty_knight.GetFirstName], provavelmente vai terminar\n"
 court_9000_c_tt:0 "Se algo está acontecendo entre [flirty_spouse.GetFirstName] e [Select_CString( flirty_knight.IsFemale, 'a', 'o' )] [flirty_knight.GetFirstName], é permitido continuar\n"
 court_9005_tt:0 "[flirty_spouse.GetFirstName] e [Select_CString( flirty_knight.IsFemale, 'a', 'o' )] [flirty_knight.GetFirstName] deixam sua corte para consumar seu amor em outro lugar"
 court_maintenance.0010.a.tooltip:0 "Você entrará na Corte Real."
 court_maintenance.0010.a:0 "Está na hora de eu fazer uma visita à corte real."
 court_maintenance.0010.b.brave:0 "Eu desejo emoção, não cerimônia ociosa!"
 court_maintenance.0010.b.depressed:0 "Eu simplesmente não consigo ver sentido em tudo isso..."
 court_maintenance.0010.b.paranoid:0 "Eu não posso estar exposto. Eu sempre preciso estar seguro!"
 court_maintenance.0010.b.tooltip:0 "Alguns cortesãos podem deixar sua corte em favor do [great_cgv_court.GetPrimaryTitle.GetName]."
 court_maintenance.0010.b:0 "Eu visitarei minha corte quando eu achar adequado."
 court_maintenance.0010.c.tooltip:0 "Você inicia um banquete em [SCOPE.GetRootScope.GetCharacter.GetCapitalLocation.GetTitle.GetNameNoTier]"
 court_maintenance.0010.c:0 "Um banquete lhes dará algo para fazer!"
 court_maintenance.0010.desc.general_ending:0 "Meus cortesãos estão cada vez mais comparando suas circunstâncias com as de cortes estrangeiras."
 court_maintenance.0010.desc.seeking_gainful_employment:0 "Meus cortesãos estão cada vez mais comparando suas circunstâncias com as de cortes prestigiosas como a [great_cgv_court.GetPrimaryTitle.GetAdjectiveNoTooltip]."
 court_maintenance.0010.desc:0 "Meu cortesão [messenger.GetName] insistiu em me ver, mesmo sabendo que eu preferiria estar sozinho:\n\n\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitleTierName]! Já faz muito tempo desde a última vez que você apareceu na corte.\nTodos nós tentamos fazer o nosso melhor para manter as aparências na sua ausência, mas uma corte [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] não pode funcionar sem a presença do [ROOT.Char.GetTitleTierName].\"\n\nMinha longa ausência da corte real a deixou sem liderança e sem propósito."
 court_maintenance.0010.t:0 "Um Trono Vazio"
 court_maintenance.0011.a.regent:0 "Vamos fazer um tour pelo palácio."
 court_maintenance.0011.a.tooltip:0 "Você entrará na [royal_court|E]"
 court_maintenance.0011.a:0 "Deixe-os ver o seu novo [ROOT.Char.GetTitleTierName]!"
 court_maintenance.0011.artificier_crown.tooltip:0 "$court_maintenance.0011.crown_needed.tooltip$ Seu [GetCourtPositionType('court_artificer_court_position').GetName()] começará a fabricar uma imediatamente"
 court_maintenance.0011.artificier_regalia.tooltip:0 "$court_maintenance.0011.regalia_needed.tooltip$ Seu [GetCourtPositionType('court_artificer_court_position').GetName()] começará a fabricar uma imediatamente"
 court_maintenance.0011.b.tooltip.ach:0 "Você poderá hospedar uma [coronation|E] em outro momento"
 court_maintenance.0011.b.tooltip:0 "Você pode escolher entrar na [royal_court|E] em outro momento"
 court_maintenance.0011.b:0 "Outras questões exigem minha atenção."
 court_maintenance.0011.banner_dynasty_tooltip:0 "[messenger.GetName] apresenta uma nova bandeira com o emblema de sua dinastia"
 court_maintenance.0011.banner_house_tooltip:0 "[messenger.GetName] apresenta uma nova bandeira com o emblema de sua casa"
 court_maintenance.0011.banner_tooltip:0 "[messenger.GetName] apresenta duas novas bandeiras, uma para sua casa e outra para sua dinastia"
 court_maintenance.0011.coronation.tooltip:0 "Você começará a preparar sua [coronation|E]."
 court_maintenance.0011.coronation:0 "Começar os preparativos imediatamente."
 court_maintenance.0011.coronation_discount:0 "Próxima [coronation|E] Custa: #p [gold_i]-50%#!"
 court_maintenance.0011.crown_needed.tooltip:0 "Certas [activity_options|E] da [coronation|E] exigem um [artifact|E] de #V Coroa#!"
 court_maintenance.0011.desc.ach:0 "\"Este presente marcará o início de seu reinado real.\" [messenger.GetName] desenrola um belo estandarte, trazendo o emblema da Casa [ROOT.Char.GetHouse.GetName].\n\n\"Você é um [ROOT.Char.GetTitleTierName|l] de nome, mas ainda assim — o reino deve se reunir para uma grande cerimônia de coroação! Lá, você poderá consolidar sua autoridade e se comprometer com [ROOT.Char.GetFaith.HighGodName] como protetor e defensor de [ROOT.Char.GetPrimaryTitle.GetNameNoTier].\""
 court_maintenance.0011.desc.regent:0 "\"Como [ROOT.Char.GetTitleTierName], você tem novos deveres e responsabilidades. Espera-se que você mantenha a corte regularmente, resolvendo as disputas do reino e ouvindo o conselho dos outros cortesãos [Select_CString( ceremonial_liege.IsFemale, 'da', 'do' )] [ceremonial_liege.GetTitleAsNameNoTooltip] nas rotinas diárias da corte [ceremonial_liege.GetHerHim].\""
 court_maintenance.0011.desc:0 "\"Como [ROOT.Char.GetTitleTierName], você tem novos deveres e responsabilidades. Agora, espera-se que você mantenha a corte regularmente, resolvendo as disputas do reino e permitindo que seus cortesãos participem de suas rotinas diárias.\"\n\n[messenger.GetName] está me olhando severamente de forma direta, quase como se estivesse me dando uma palestra. Talvez haja também um pouco de [ROOT.GetCharacter.Custom2('GetPrideEnvy' , SCOPE.sC('messenger'))] em seu olhar?\n\n[messenger.GetSheHe|U] começa a desdobrar uma bela bandeira, com o emblema da Casa [ROOT.Char.GetHouse.GetName]. \"Uma das formas pelas quais o mundo julgará seu reinado é como você decora e cuida de sua corte real. Tomei a liberdade de mandar fazer isso como um presente para marcar o início do seu mandato real.\""
 court_maintenance.0011.local_artisan_crown.tooltip:0 "$court_maintenance.0011.crown_needed.tooltip$ Um artesão local começará a fabricar uma imediatamente"
 court_maintenance.0011.local_artisan_regalia.tooltip:0 "$court_maintenance.0011.regalia_needed.tooltip$ Um artesão local começará a fabricar uma imediatamente"
 court_maintenance.0011.regalia_needed.tooltip:0 "Certas [activity_options|E] da [coronation|E] exigem um [artifact|E] de #V Regália#!"
 court_maintenance.0011.t.regent:0 "A Corte [Select_CString( ROOT.Char.IsFemale, 'da', 'do' )] [ROOT.Char.GetTitleAsNameNoTooltip]"
 court_maintenance.0011.t:0 "A Corte [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 court_maintenance.0012.a:0 "Como deve ser."
 court_maintenance.0012.desc:0 "À medida que a renome da minha dinastia cresce, a familiaridade com o glorioso emblema dos [ROOT.Char.GetDynasty.GetName] também se espalha.\n\n"
 court_maintenance.0012.desc_famed:0 "O brasão da minha família agora é reconhecido nos círculos regionais da nobreza, sendo considerado altamente entre as proeminentes linhagens [ROOT.Char.GetCulture.GetNameNoTooltip]."
 court_maintenance.0012.desc_illustrious:0 "A insígnia da minha família agora é conhecida em todo o mundo, notada por chanceleres, ensinada a crianças e encantando comerciantes em terras onde os [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] nunca sequer pôs os pés."
 court_maintenance.0012.desc_masterwork:0 "O emblema da minha família agora é de conhecimento comum, listado entre as grandes famílias reais da região e a mais alta nobreza dos [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]."
 court_maintenance.0012.t:0 "Marca de Distinção"
 court_maintenance.0013.a:0 "Só pode haver um."
 court_maintenance.0013.desc:0 "É minha responsabilidade defender a honra da família [ROOT.Char.GetDynasty.GetName] e carregar sua bandeira."
 court_maintenance.0013.desc_creator:0 "Somente o estandarte pessoal de [banner_scope.MakeScope.Var('banner_commissioner').Char.GetNameRegnal] marcará a grandeza da linhagem [banner_scope.MakeScope.Var('banner_commissioner').Char.GetHerHim]."
 court_maintenance.0013.desc_fallback:0 "Somente meu estandarte pessoal será transmitido de geração em geração, marcando a glória de todos os meus descendentes."
 court_maintenance.0013.t:0 "Tesouro Dinástico"
 court_maintenance.0013.tt:0 "Apenas uma bandeira da [dynasty|E] pode ser possuída"
 envy_reaction:0 "inveja"
 gained_royal_court_toast:0 "Corte Real adquirida"
 gained_royal_court_toast_desc:0 "Você agora possui uma [royal_court|E]"
 how_could_you_opinion:0 "Como você pôde"
 pride_reaction:0 "orgulho"
 scorn_reaction:0 "desprezo"
 surprise_reaction:0 "surpresa"
 suspicious_against_pies_modifier:0 "Desconfiado Contra Tortas"
 suspicious_against_pies_modifier_desc:0 "Este personagem é extraordinariamente desconfiado e vigilante em relação a qualquer coisa que se pareça vagamente com uma torta. Isso se estende também a outros tipos de comida e a tudo mais, na verdade..."
