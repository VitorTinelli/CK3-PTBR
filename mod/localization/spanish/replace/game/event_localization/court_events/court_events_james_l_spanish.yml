l_spanish:
 buy_book_artifact:0 "Você ganha um Livro [court_artifact|E]"
 court.0101.a.animals:0 "Queime [lowborn_criminal.GetSheHe] vivo junto com seu gado."
 court.0101.a.baby_soup:0 "Jogue [lowborn_criminal.GetSheHe] em um caldeirão de piche."
 court.0101.a.cannibal:0 "Corte a família inteira para alimentar os cães."
 court.0101.a.devil_worshiper:0 "Talvez uma chama aberta ajude [lowborn_criminal.GetSheHe] a se sentir mais próxima de s[Select_CString( lowborn_criminal.IsFemale, 'ua', 'eu' )] [lowborn_criminal.GetFaith.WitchGodMistressMaster]."
 court.0101.a.kinky:0 "Tenha [lowborn_criminal.GetSheHe] publicamente chicoteado até a morte."
 court.0101.a.priest.sky:0 "Deixe os abutres se banquetear com o corpo [lowborn_criminal.GetHerHim]... enquanto ainda está vivo."
 court.0101.a.priest:0 "Certifique-se de que [lowborn_criminal.GetSheHe] tenha um enterro adequado... ainda vivo."
 court.0101.a.sadistic:0 "Algumas voltas na roda devem colocá-los no eixo."
 court.0101.a.stableboy:0 "Remova suas partes íntimas e alimente os cavalos com elas."
 court.0101.a.suspicious_healer:0 "Faça [lowborn_criminal.GetSheHe] provar um pouco do seu próprio \"remédio\"."
 court.0101.a:0 "Torturar até a morte é a única resposta."
 court.0101.b:0 "Faça com eles o que quiser."
 court.0101.c.beastiality:0 "... #EMP and#! um cavalo? [lowborn_criminal.GetSheHe|U] é um[Select_CString( lowborn_criminal.IsFemale, 'a', '' )] gêni[Select_CString( lowborn_criminal.IsFemale, 'a', 'o' )] criativ[Select_CString( lowborn_criminal.IsFemale, 'a', 'o' )]!"
 court.0101.c.deviant:0 "[lowborn_criminal.GetSheHe|U] parece saber se divertir!"
 court.0101.c:0 "[lowborn_criminal.GetNameNoTooltip] sabe como se divertir!"
 court.0101.d:0 "Prenda-os, decidirei mais tarde..."
 court.0101.desc.animals:0 "O prisioneiro foi pego cometendo atos impuros com um membro de seu próprio gado, um cavalo e um favo de mel. Tal ato de devassidão desafia a vontade de [lowborn_criminal.GetFaith.HighGodName] e é um crime não apenas contra a natureza, mas também contra a decência e o bom senso!"
 court.0101.desc.baby_soup:0 "[lowborn_criminal.GetName] foi denunciado pelos moradores da cidade local de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] pelo ato indescritível de cozinhar seus próprios filhos recém-nascidos vivos, juntamente com algumas ervas e legumes. Esse ato bestial foi uma tentativa de prolongar de forma antinatural sua própria vida!"
 court.0101.desc.cannibal:0 "[lowborn_criminal.GetName] e sua família têm vivido em uma caverna perto de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], atraindo viajantes com a promessa de comida e abrigo. Acredita-se que a família [lowborn_criminal.GetHerHim] tenha devorado mais de mil viajantes dessa forma, e os moradores de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] exigem justiça."
 court.0101.desc.deviant:0 "atos de bestialidade e vícios impuros!\n\n"
 court.0101.desc.devil_worshiper:0 "Pensado para ser um[Select_CString( lowborn_criminal.IsFemale, 'a', '' )] [lowborn_criminal.GetWomanMan] piedos[Select_CString( lowborn_criminal.IsFemale, 'a', 'o' )], [lowborn_criminal.GetName] mantinha um santuário privado em sua própria residência, mas, ao ser inspecionado, descobriu-se que [lowborn_criminal.GetSheHe] não estava adorando [lowborn_criminal.GetFaith.HighGodName], mas sim [lowborn_criminal.GetFaith.WitchGodName], e fazendo sacrifícios profanos para [lowborn_criminal.GetFaith.WitchGodSheHe]!"
 court.0101.desc.kinky:0 "[lowborn_criminal.GetName] foi encontrado acorrentado a um poste, coberto de grude da cabeça aos pés, com um dispositivo desagradável ligado às suas partes íntimas. Ferimentos em seu corpo indicam tortura em busca de prazer, e o prisioneiro parece não ter nenhuma vergonha de seus desejos antinaturais."
 court.0101.desc.lazy:0 "desobedecendo as ordens de seu mestre. Como aprendiz do pedreiro da vila, [lowborn_criminal.GetName] foi acusado de responder de forma insolente ao seu mestre, desobedecer ordens e até mesmo desafiar a perícia de seu mestre."
 court.0101.desc.murderer:0 "um assassinato indescritível!\n\n"
 court.0101.desc.opening:0 "Um prisioneiro pelo nome de [lowborn_criminal.GetName] foi trazido diante de [executioner.GetName] por"
 court.0101.desc.outro:0 "\n\n[executioner.GetName] insiste que [lowborn_criminal.GetSheHe] está tão chocado quanto qualquer pessoa com esse pecador, e pergunta o que deve ser feito com esse indivíduo miserável."
 court.0101.desc.priest:0 "Um [lowborn_criminal.GetFaith.PriestNeuter], [lowborn_criminal.GetName] assassinou um membro de seu próprio rebanho. Esse miserável tentou obter perdão por seu crime das autoridades [lowborn_criminal.GetFaith.GetAdjective], mas a guarda o pegou tentando reentrar em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] e prontamente deteve esse malvado [lowborn_criminal.GetFaith.PriestNeuter]."
 court.0101.desc.sadistic:0 "O criminoso cortou a garganta do moleiro e saqueou sua casa. Além disso, [lowborn_criminal.GetSheHe] obrigou a esposa do moleiro a cozinhar ovos para [lowborn_criminal.GetSheHe], que [lowborn_criminal.GetSheHe] procedeu a comer do corpo do moleiro falecido, enquanto forçava a esposa a se juntar a [lowborn_criminal.GetSheHe]."
 court.0101.desc.stableboy:0 "[lowborn_criminal.GetName] foi pego em plenos atos explícitos com o [lowborn_criminal.Custom('servant_for_romance')]. Isso não é apenas um ato de infidelidade, é uma ofensa à honra da Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip]!"
 court.0101.desc.sumptuary:0 "violando a lei sumptuária d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip].\n\n [lowborn_criminal.GetSheHe] tem usado todo tipo de tecido berrante e roupas descombinadas. Isso vai além de um simples crime contra [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip], é um crime contra a decência comum."
 court.0101.desc.suspicious_healer:0 "Como curandeiro, [lowborn_criminal.GetName] foi acusado de usar magia negra para causar a morte dos doentes e idosos de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. As más ações de [lowborn_criminal.GetName] são inúmeras, o que lhe rendeu o apelido de 'Anjo da [lowborn_criminal.GetFaith.DeathDeityName]'."
 court.0101.desc.thief:0 "inúmeros atos de roubo por todo o reino.\n\n Esse bandido sugou até a última gota deste grandioso [ROOT.Char.GetPrimaryTitle.GetName] com suas apropriações de propriedades da coroa, como pão, vegetais e até mesmo roupas!"
 court.0101.desc.witch:0 "atos de maldade e crimes contra [lowborn_criminal.GetFaith.HighGodName]!\n\n"
 court.0101.t:0 "Bandido na Corte"
 court.0102.a:0 "Durma no castelo esta noite, amigo."
 court.0102.b:0 "É uma vida difícil, mas alguém precisa vivê-la."
 court.0102.c:0 "Hah! Você não é mais digno de simpatia do que os ratos no meu esgoto!"
 court.0102.desc:0 "Vejo [executioner.Custom2('MyCharacterIntroduction', ROOT.Char)] sentada com uma expressão melancólica no rosto, e ao perguntar o que está perturbando sua mente sombria, [executioner.GetSheHe] suspira.\n\n\"Você vê, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord], todas as noites eu tenho que viajar para bem longe de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] para dormir. Carrascos não têm permissão para entrar nos limites da cidade. Não é que eu não ame torturar ou algo assim, é só que fica solitário quando as únicas vozes que ouço são os gritos dos condenados."
 court.0102.t:0 "A Mancha Social da Execução"
 court.0103.a:0 "Me inclua nisso e prometo que você terá mais prisioneiros!"
 court.0103.b:0 "Esse comércio macabro acaba agora!"
 court.0103.c:0 "Vou fingir que não ouvi isso."
 court.0103.desc.hair_and_teeth:0 "Seu empreendimento envolve vender mechas de cabelo dos prisioneiros para fabricantes de bonecas, dentes para aqueles que não têm, e até mesmo globos oculares para praticantes de bruxaria."
 court.0103.desc.jewelry:0 "[executioner.GetSheHe|U] confessou roubar roupas e joias dos condenados e vendê-los, lucrando com as poucas posses que aqueles nas masmorras possuem. [executioner.GetSheHe|U] até mesmo tem roubado dos corpos dos recentemente falecidos!"
 court.0103.desc.meat:0 "[executioner.GetSheHe|U] tem abatido os recém-falecidos e vendido suas carnes no mercado como carne exótica! [executioner.GetSheHe|U] afirma que isso é uma alternativa melhor do que dar os ritos funerários aprovados, pois os condenados não são dignos desses últimos pedidos."
 court.0103.desc.opening:0 "[executioner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tem chamado minha atenção ultimamente, pois [executioner.GetSheHe] parece estar vestindo roupas cada vez mais caras e desfilando como um pavão.\n\nApós investigar, [executioner.GetSheHe] me sorri com dentes amarelados e me conta que tem se apropriado de coisas de valor dos condenados."
 court.0103.desc.outro:0 "\n\nClaramente, [executioner.GetSheHe] tem lucrado com o empreendimento, sem se importar com o que os outros possam pensar de seu negócio monstruoso."
 court.0103.desc.saint_bones:0 "[executioner.GetSheHe|U] tem removido vísceras dos ossos de prisioneiros plebeus e vendendo-os como artefatos falsos, enganando visitantes estrangeiros e homens sagrados para que comprem esses itens como se fossem ossos de Santos!"
 court.0103.t:0 "Uma Oportunidade Macabra"
 court.0104.a:0 "Hilário! E então, o que aconteceu?"
 court.0104.b:0 "Essa fascinação sombria acaba agora!"
 court.0104.c:0 "Vou fingir que não ouvi nada."
 court.0104.desc:0 "“Ooh! Ooh! E o que você fez depois?” Ouço a melodia animada da minha querida pupila, [morbid_child.GetName], ecoando pelos corredores de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. Para minha surpresa, vejo [morbid_child.GetSheHe] olhando para [executioner.Custom2('MyCharacterIntroduction', ROOT.Char)] com uma espécie de adoração encantadora que ainda não tinha visto n[Select_CString( morbid_child.IsFemale, 'a', 'o' )] [morbid_child.Custom('GirlBoy')]. “Eu acendi a chama e o rato começou a cavar bem no peito dele para escapar! Clássico, ele cantou como um rouxinol!” O executor solta um guincho zombeteiro, muito para o divertimento de meu [morbid_child.Custom('PetName')] [morbid_child.GetName]."
 court.0104.t:0 "Uma Obsessão Doentia"
 court.0106.a:0 "Qualquer coisa para extrair uma confissão."
 court.0106.b:0 "Seja gentil com essas almas miseráveis."
 court.0106.c:0 "O que você faz naquele lugar terrível é problema seu."
 court.0106.desc:0 "Crepúsculo na corte, o executor saiu de sua moradia sombria e se apresentou à luz das tochas da corte, sangue fresco manchando seu vestuário esfarrapado e um par de alicates sujos gotejando em sua mão. “[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetLadyLord], ultimamente, tenho pensado. Até onde posso ir para fazê-los gritar?”"
 court.0106.t:0 "Teatros Sombrios para Feitos Sombrios"
 court.0107.a.tt.1:0 "Há uma chance de que a educação de [unruly_child.GetShortUINamePossessiveNoTooltip] melhore"
 court.0107.a.tt.2:0 "[tutor.GetShortUINameNoTooltip] trabalhará ainda mais como [GetCourtPositionType('court_tutor_court_position').GetName()]"
 court.0107.a:0 "[unruly_child.GetNameNoTooltip], confie que [tutor.GetNameNoTooltip] sabe o que é melhor."
 court.0107.b.tt:0 "Você ganha um Artefato de Livro"
 court.0107.b:0 "Esse livro parece fascinante; talvez eu possa comprá-lo de você?"
 court.0107.c:0 "Talvez o [unruly_child.Custom('GetLassLad')] deva aprender algo diferente..."
 court.0107.desc:0 "Do meu trono, ouço os gritos viscerais de [unruly_child.Custom2('MyCharacterIntroduction', ROOT.Char)] e os sons de uma luta. Rapidamente me levanto e corro pelo corredor, parando bruscamente quando vejo [tutor.Custom2('MyCharacterIntroduction', ROOT.Char)] segurando a pobre [unruly_child.Custom('GetLassLad')] com um braço e segurando desajeitadamente um livro com o outro.\n\nMal tenho tempo de exigir uma explicação quando ambos começam a despejar suas versões dos eventos.\n\n\"[unruly_child.GetTitledFirstNameNoTooltip] se recusa a deixar que eu leia minha obra-prima sobre a arte de [tutor.Custom('GetTutorEducation')]!\" chora o tutor.\n\n\"Já ouvi esse livro entediante mil vezes!\" protesta [unruly_child.GetNameNoTooltip]. \"É tão #EMP chato!#!\""
 court.0107.t:0 "[unruly_child.GetNameNoTooltip] em Desespero"
 court.0108.a:0 "Não seja estraga-prazeres, [sceptical_courtier.GetNameNoTooltip]. Eles devem se casar pela manhã!"
 court.0108.b:0 "[sceptical_courtier.GetNameNoTooltip] está certo! À masmorra com [foreign_prince.GetSheHe]!"
 court.0108.c:0 "Obrigado pela visita, [foreign_prince.Custom('GetPrincessPrince')] [foreign_prince.GetFirstNameNoTooltip], mas você deve ir embora."
 court.0108.desc:0 "Alegando ser um exilado de uma terra distante, [foreign_prince.Custom('GetPrincessPrince')] [foreign_prince.GetName] apareceu na corte acompanhado por uma vasta variedade de animais exóticos e já realizou obras incríveis de caridade pelas ruas de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip].\n\nO magnificamente rico estrangeiro declarou sua intenção de se casar com [available_child.Custom2('MyCharacterIntroduction', ROOT.Char)]!\n\nEmbora a corte esteja entusiasmada com esse [foreign_prince.Custom('GetPrincessPrince')] exótico, nem todos estão convencidos. [sceptical_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] afirma nunca ter ouvido falar da terra distante que o estrangeiro alega ser, e não consegue encontrá-la em nenhum mapa.\n\n[sceptical_courtier.GetSheHe|U], juntamente com vários outros seguidores com a mesma opinião, denunciou [foreign_prince.Custom('GetPrincessPrince')] [foreign_prince.GetName] como um charlatão e insiste que punamos [foreign_prince.GetSheHe] por tentar enganar [available_child.GetName] e casar-se com um #EMP plebeu#!."
 court.0108.t:0 "Um Cortesão Espetacular"
 court.0109.a:0 "Você está desperdiçado como executor! Venha ser meu médico!"
 court.0109.b:0 "Não perca seu tempo curando esses indigentes!"
 court.0109.c:0 "Fascinante, talvez você possa me ensinar alguns de seus métodos."
 court.0109.d:0 "Bom trabalho! Continue servindo os doentes e necessitados de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 court.0109.desc:0 "Enquanto eu perambulo pelo meu tribunal, ouço [executioner.Custom2('MyCharacterIntroduction', ROOT.Char)] conversando com [learned_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] sobre a natureza da cura e da medicina. [executioner.GetSheHe|U] parece incrivelmente familiarizado com o funcionamento do corpo humano.\n\n\"Você não passa todos os dias abrindo homens sem aprender uma coisa ou outra sobre o funcionamento da própria criação de [executioner.GetFaith.HighGodNamePossessive].\" [executioner.GetSheHe|U] diz após descrever como usar sanguessugas para purgar a corrupção de uma ferida infectada.\n\nParece que [executioner.GetNameNoTooltip] tem usado sua experiência em anatomia humana para ajudar os habitantes de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] e até mesmo os marginais em minha masmorra."
 court.0109.t:0 "Um Especialista Anatômico"
 court.0110.a:0 "Que insolência! Para a masmorra!"
 court.0110.b:0 "Você está certo, temo pela minha alma imortal."
 court.0110.c:0 "Não vou me restringir a uma prisão sensual!"
 court.0110.desc.deviant:0 "\"Oh [ROOT.Char.Custom('GetDaughterSon')] m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )], estou muito preocupado com sua alma. Todas as noites você se entrega a atos de bestialidade que fariam [ROOT.Char.GetFaith.FertilityGodName] se revirar de repulsa.\""
 court.0110.desc.intro:0 "Estou passeando pela minha corte, satisfeito com mais uma noite repleta de luxúria e paixão quando me vejo encurralado por [parent.Custom2('MyCharacterIntroduction', ROOT.Char)] e [chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)]! Eles me olham com um olhar que mistura desprezo, predatismo e preocupação.\n\"Qual o significado disso?\" exijo.\n\n"
 court.0110.desc.notspecial:0 "\"Seu corpo é um templo e você o trata como um bordel! Será que haverá amantes suficientes para satisfazer o vazio onde deveria estar sua alma?\""
 court.0110.desc.outro:0 "[Select_CString( parent.IsFemale, 'Minha', 'Meu' )] [parent.GetMotherFather] me repreende sem remorso.\n\n\"Todas as noites você se ocupa desfrutando desses prazeres terrenos, você está se aproximando cada vez mais de [ROOT.Char.GetFaith.NegativeAfterLife]!\" [chaplain.GetNameNoTooltip] acrescenta. \"Estamos confrontando você agora para salvar sua alma, querida criança. Um voto de celibato é necessário, somente isso e nada menos poderá salvar sua alma de uma eternidade de tormento.\""
 court.0110.desc.pox:0 "\"Você tem mais amantes do que um cão selvagem tem pulgas. Receio que a sífilis não seja a única coisa manchando seu corpo quando sua luxúria for satisfeita.\""
 court.0110.t:0 "Uma Palestra Sobre Luxúria"
 court.0111.a:0 "O crânio [rival.GetHerHim] seria uma curiosidade interessante para revelar em festas!"
 court.0111.b:0 "Uma ideia absolutamente grotesca."
 court.0111.desc:0 "Enquanto percorro a corte, me vejo envolvido em uma discussão acalorada entre [executioner.Custom2('MyCharacterIntroduction', ROOT.Char)] e [antiquarian.Custom2('MyCharacterIntroduction', ROOT.Char)] sobre se o crânio de [rival.Custom2('MyCharacterIntroduction', ROOT.Char)] seria uma relíquia adequada para minha corte.\n\n\"Ah, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord], eu estava querendo te dar o crânio d[Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetTitledFirstNameNoTooltip] como presente, caso [rival.GetSheHe] encontre um destino prematuro.\" [executioner.GetName] esfrega as mãos sujas de sangue com uma alegria infantil. \"Ou talvez juntar os dentes [rival.GetHerHim] e fazer um colar estiloso!\"\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], certamente você não pretende que eu tente disfarçar um objeto tão mórbido como uma relíquia condizente com a corte!\" protesta [Select_CString( antiquarian.IsFemale, 'a', 'o' )] [antiquarian.GetTitledFirstNameNoTooltip]. \"Talvez essa criatura deva permanecer nas masmorras, onde [executioner.GetSheHe] pertence, e deixar os assuntos de relíquias e antiguidades para os especialistas.\""
 court.0111.t:0 "Uma Relíquia de Vingança"
 court.0112.a.tt:0 "Você obtém um Artefato da Realeza"
 court.0112.a:0 "Verde como este corpo? Um bom negócio."
 court.0112.b:0 "Em breve, todos de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] saberão o que você fez!"
 court.0112.c:0 "Nunca mais vamos falar sobre isso."
 court.0112.desc:0 "Eu me pego aventurando-me profundamente no meu ilustre guarda-roupa, faminto pelo que magníficos tecidos estão mais ao fundo. Encontro uma bolsa de tartã, muito mais pesada que as outras, e ao cortá-la, caio para trás quando o fedor potente de um corpo em decomposição atinge minhas narinas.\n\nO corpo de um estranho, parcialmente decomposto, mumificado e sentado em uma poça dos próprios líquidos [corpse.GetHerHim], se revela lentamente diante de mim.\n\nEu grito como um bebê, e como se fosse invocado pelo meu chamado, [guilty_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] aparece na porta, uma expressão de culpa e repulsa evidente em seu rosto.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], você deve acreditar em mim quando digo que estava me defendendo! [corpse.GetSheHe|U] invadiu seus aposentos e se eu não tivesse agido, [corpse.GetName] teria me matado ou [guilty_courtier.GetFaith.HighGodName] sabe lá o que mais!\"\n\n[guilty_courtier.GetNameNoTooltip] está claramente tomado pela culpa, a ponto de ter confessado imediatamente para mim, sem confronto. \"Eu imploro, vire o olhar e eu mandarei confeccionar uma vestimenta para você que fará até [Select_CString( ROOT.Char.IsFemale, 'a mais rica', 'o mais rico' )] [ROOT.Char.GetTitleAsNameNoTooltip] ficar verde de inveja!"
 court.0112.t:0 "Um Cadáver Escondido"
 court_position_liege_support:0 "Apoio do Senhor Feudal"
 get_regalia_artifact:0 "Você obtém um [artifact|E] de Ornamento"
 get_skull_artifact:0 "Você obtém uma [court_artifact|E] do Crânio"
