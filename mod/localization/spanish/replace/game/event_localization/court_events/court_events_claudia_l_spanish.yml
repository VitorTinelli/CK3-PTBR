l_spanish:
 COURT_OF_NO_SECRETS_VALUE:0 "Oposição Perseguida"
 court.6000.a.tt:0 "Você envia seu Mestre Espião para investigar"
 court.6000.a:0 "#EMP ABSURDO!#! Quem poderia ter escrito mentiras tão descaradas?"
 court.6000.b.tt:0 "Você pode descobrir o passado #EMP colorido#! de alguém"
 court.6000.b:0 "Ohhh, fofocas picantes!"
 court.6000.c.tt:0 "[predecessor.GetSheHe|U] era um tiran[Select_CString( predecessor.IsFemale, 'a', 'o' )] repugnante, indigno de minha dinastia! Deixe-me contar a você #EMP exatamente#! o que eu penso daquele vil e covarde cão amarelo..."
 court.6000.c:0 "Todos merecem saber a verdade sobre [Select_CString( predecessor.IsFemale, 'a', 'o' )] [predecessor.GetTitledFirstNameNoTooltip]!"
 court.6000.d:0 "Que chato. Eu realmente não me importo."
 court.6000.desc_ending:0 "Não há nada suspeito! Nada mesmo!\" grita [courtier.GetSheHe], enquanto tenta - sem sucesso - esconder o objeto ofensivo dentro de suas vestes. \n\nQuando consigo arrancar o livro de suas mãos, fico chocado ao descobrir páginas e mais páginas de malevolências detalhadas que, supostamente, ocorreram na corte de meu antecessor com a bênção [predecessor.GetHerHim]!"
 court.6000.desc_family:0 "\n\n\"[SCOPE.sC('courtier').Custom2('RelationToMe', ROOT.GetCharacter)]!"
 court.6000.desc_liege:0 "\n\n\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [SCOPE.sC('courtier').Custom2('RelationToMe', ROOT.GetCharacter)]!"
 court.6000.desc_opening:0 "Ao entrar na sala, fico completamente surpreso com o grito de surpresa d[Select_CString( courtier.IsFemale, 'a', 'o' )] [courtier.GetFirstName], que estava antes absorto em um manuscrito intitulado 'Uma História Secreta do [ROOT.Char.GetPrimaryTitle.GetNameNoTier]'."
 court.6000.e.tt:0 "Você inicia sua própria investigação"
 court.6000.f:0 "Tudo é verdade. Mas devemos perdoar e esquecer."
 court.6000.t:0 "História Secreta"
 court.6002.a.tt2:0 "Aumenta a eficácia do $task_find_secrets$ do seu Mestre dos Espiões por 15 anos."
 court.6002.a.tt:0 "[author.GetSheHe|U] é melhor que retire suas declarações e se arrependa, ou..."
 court.6002.a:0 "Você deveria ter vergonha de suas mentiras vergonhosas!"
 court.6002.b.desc_ending:0 "Depois de muitas noites sem dormir, finalmente encontrei o culpado: é [Select_CString( author.IsFemale, 'a', 'o' )] covarde [author.GetTitledFirstName]! \n\nEnquanto [author.GetSheHe] está diante de mim tremendo, aguardando julgamento, penso cuidadosamente no que dizer em seguida."
 court.6002.b.desc_opening:0 "Nos últimos meses, dediquei todos os momentos de meu tempo livre à busca pela serpente elusiva que estava circulando um livro sobre os defeitos de meu antecessor."
 court.6002.b:0 "Guardas, prendam esse traidor!"
 court.6002.c:0 "Você realmente passou dos limites aqui, [author.GetFirstNameNoTooltip]..."
 court.6002.d:0 "Tenho certeza de que você não teve intenção de prejudicar com seu pequeno diário, não é?"
 court.6002.desc:0 "Estou ocupad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com correspondências internacionais quando [spymaster.GetTitledFirstName] entra na sala, arrastando um[Select_CString( author.IsFemale, 'a', '' )] [author.GetTitledFirstName] com expressão assustada. \n\n \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], encontrei [author.GetSheHe]! O canalha que escreveu aquele livro vergonhoso de mentiras sobre s[Select_CString( predecessor.IsFemale, 'uaa', 'eu' )] antecessor[Select_CString( predecessor.IsFemale, 'a', '' )], [predecessor.GetTitledFirstName]!\""
 court.6003.a:0 "Deixa pra lá. Não foi nada demais."
 court.6003.b.desc_ending:0 "\n\nInfelizmente, meus melhores esforços provaram ser infrutíferos, pois o culpado parece ter desaparecido e o rastro esfriou. Acho que nunca vou descobrir a verdade."
 court.6003.b:0 "Isso é muito decepcionante."
 court.6003.c.tt:0 "Você se enfurece com seus cortesãos"
 court.6003.c:0 "Vocês inúteis #EMP parasitas#! estão encobrindo o autor, não é?"
 court.6003.d:0 "Você fez o seu melhor, [spymaster.GetTitledFirstNameNoTooltip]..."
 court.6003.desc:0 "Já se passaram meses, mas [Select_CString( spymaster.IsFemale, 'minha mestre espiã', 'meu mestre espião' )], [spymaster.GetTitledFirstName], ainda não relatou nenhum progresso significativo em sua missão especial: encontrar o autor amaldiçoado de um manuscrito vergonhoso que detalha a malevolência secreta de meu antecessor! \n\nNão é surpreendente que, quando finalmente chamo [spymaster.GetSheHe], [spymaster.GetFirstNameNoTooltip] pareça nervos[Select_CString( spymaster.IsFemale, 'a', 'o' )] e bastante culpad[Select_CString( spymaster.IsFemale, 'a', 'o' )]. \"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetLadyLord]! Eu procurei por todos os lugares, mas o autor desapareceu! Talvez tenha deixado a corte, ou alguém esteja protegendo-o, ou-\" \n\nInterrompo o falatório [spymaster.GetHerHim] com um gesto de mão."
 court.6003.e:0 "Já que você não conseguiu encontrar o autor, você vai levar a culpa por ele!"
 court.6010.a:0 "Podemos tolerar isso e muito mais. [preacher.GetFirstNameNoTooltip] é inofensiv[Select_CString( preacher.IsFemale, 'a', 'o' )]."
 court.6010.a_every_county:0 "Todo [county|E] de fé do [preacher.GetFaith.GetName] em seu [realm|E] ([preacher_faith_counties_size])"
 court.6010.b:0 "Expulse esse tolo da minha corte!"
 court.6010.c.tt2:0 "A [councillor_task|E] de $task_conversion$ [Select_CString( chaplain.IsFemale, 'da sua', 'do seu' )] [chaplain.GetCouncilTitle|U] é #P mais#! eficaz em condados de fé do [preacher.GetFaith.GetName] por 20 anos"
 court.6010.c.tt3:0 "A [councillor_task|E] de $task_conversion$ [Select_CString( chaplain.IsFemale, 'da sua', 'do seu' )] [chaplain.GetCouncilTitle|U] é #N menos#! eficaz em condados de fé do [preacher.GetFaith.GetName] por 20 anos"
 court.6010.c.tt:0 "[Select_CString( preacher_liege.IsFemale, 'A', 'O' )] senhor[Select_CString( preacher_liege.IsFemale, 'a', '' )] [preacher.GetHerHim], [preacher_liege.GeTitledFirstName], ficará desapontado."
 court.6010.c:0 "[preacher.GetSheHe|U] pode pregar aos ratos, tanto faz..."
 court.6010.d:0 "CHEGA dessa #EMP BLASFÊMIA#!"
 court.6010.desc:0 "\"#EMP ARREPENDA-SE HOJE!#! APRENDA A VERDADE MAIS VERDADEIRA! ADENTRE A LUZ!\" \n\nDesde que [Select_CString( preacher.IsFemale, 'a', 'o' )] [preacher.GetTitledFirstName] se juntou à minha corte, as persistentes tentativas [preacher.GetHerHim] de converter todos para seu culto estrangeiro se tornaram o ruído de fundo em minha vida cotidiana.\n\nDia e noite, [preacher.GetSheHe] percorre os pátios, patrulha os corredores e se esconde em espera por transeuntes desprevenidos em cantos escuros, prontos para #EMP persuadi-los#! com seus gritos insistentes. \n\nMeus cortesãos estão exaustos e, depois que [Select_CString( preacher.IsFemale, 'a', 'o' )] [preacher.GetFirstNameNoTooltip] me embosca a caminho do penico, estou inclinado a concordar com o descontentamento deles."
 court.6010.t:0 "Profeta nos Salões"
 court.6011.a:0 "Não tive a intenção de ofendê-lo. Por favor, aceite essa compensação."
 court.6011.b:0 "Seus pregadores disfarçados não são bem-vindos em minha corte."
 court.6011.desc_executed:0 "Fiquei extremamente consternado ao saber que você recentemente executou um súdito meu - convidado em sua corte - como um herege perigoso. \n\nGostaria de acreditar que tenha sido um mal-entendido e que você não #EMP realmente#! desejava me ofender e desafiar minha fé."
 court.6011.desc_opening:0 "[preacher_liege.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 court.6011.desc_prisoner:0 "Percebi que você recentemente aprisionou um súdito meu por nenhum motivo além de pregar a fé [preacher.GetHerHim] - #EMP minha própria fé#! - em sua corte. \n\nEspero que seja apenas um mal-entendido e que você corrija a situação imediatamente, para que eu não tenha a impressão errada de suas intenções."
 court.6020.a.failure.tt:0 "A condição d[Select_CString( possessed_char.IsFemale, 'a', 'o' )] [possessed_char.GetTitledFirstName] não é afetada"
 court.6020.a.failure:0 "O exorcismo d[Select_CString( court_chaplain.IsFemale, 'a', 'o' )] [court_chaplain.GetFirstName] falha"
 court.6020.a.success.tt:0 "Com exorcismos regulares para manter o mal afastado, a condição d[Select_CString( possessed_char.IsFemale, 'a', 'o' )] [possessed_char.GetTitledFirstName] parece melhorar, e seus cortesãos estão satisfeitos"
 court.6020.a.success:0 "O exorcismo d[Select_CString( court_chaplain.IsFemale, 'a', 'o' )] [court_chaplain.GetFirstName] é bem-sucedido"
 court.6020.a:0 "[court_chaplain.GetTitledFirstNameNoTooltip], exorcize o demônio!"
 court.6020.b.tt:0 "Ter #EMP visões proféticas#! é considerado uma grande ajuda para um $court_poet_court_position$, $court_musician_court_position$ ou $cave_hermit_court_position$"
 court.6020.b:0 "Não tenha medo! É um sinal do favor dos deuses!"
 court.6020.c.tt:0 "Dizem que a imposição de sua [6020_relic.GetNameNoTooltip] cura qualquer doença"
 court.6020.c:0 "O poder deste objeto sagrado salvará [possessed_char.GetSheHe]."
 court.6020.d.tt.2:0 "[court_physician.GetFirstNameNoTooltip] experimenta uma mistura de ervas"
 court.6020.d.tt:0 "A experiência em artes medicinais d[Select_CString( court_chaplain.IsFemale, 'a', 'o' )] [court_physician.GetFirstName] melhora a condição d[Select_CString( possessed_char.IsFemale, 'a', 'o' )] [possessed_char.GetTitledFirstName]"
 court.6020.d:0 "[court_physician.GetTitledFirstNameNoTooltip], você conhece alguma erva que possa ajudar [possessed_char.GetSheHe]?"
 court.6020.desc_chaplain:0 "\n\nDe acordo com [court_chaplain.GetCouncilTitle|U] [court_chaplain.GetTitledFirstName],"
 court.6020.desc_ending:0 "[possessed_char.GetFirstNameNoTooltip] nunca foi perigos[Select_CString( possessed_char.IsFemale, 'a', 'o' )] #EMP em si mesm[Select_CString( possessed_char.IsFemale, 'a', 'o' )]#!, mas meus cortesãos insistem que algo seja feito."
 court.6020.desc_middle:0 "um ser sombrio habita o corpo [possessed_char.GetHerHim] e, ocasionalmente, se manifesta com um poder incontrolável; no entanto, a frequência e intensidade desses episódios estão causando cada vez mais alarme entre meus devotados cortesãos. [court_chaplain.GetSheHe|U] teme que a presença maligna assuma o controle e espalhe caos e morte entre nós."
 court.6020.desc_no_chaplain:0 "\n\nÉ uma opinião comum que"
 court.6020.desc_no_physician:0 "\n\n"
 court.6020.desc_opening:0 "A condição d[Select_CString( possessed_char.IsFemale, 'a', 'o' )] [possessed_char.GetTitledFirstName] é igualmente misteriosa e assustadora."
 court.6020.desc_physician:0 "\n\n[court_physician.GetTitledFirstName] me tranquiliza dizendo que"
 court.6020.e:0 "Isso não passa de uma doença cerebral. [court_physician.GetFirstNameNoTooltip]?"
 court.6020.f:0 "Deixe [possessed_char.GetSheHe] em paz."
 court.6020.t:0 "Possessão na Corte"
 court.6030.a:0 "Mas é uma história tão engraçada!"
 court.6030.b:0 "Isso é tão constrangedor..."
 court.6030.c:0 "#EMP VOCÊ ACHA ISSO ENGRAÇADO?!#!"
 court.6030.d.tt:0 "Você proíbe a performance da balada, ameaçando os transgressores com prisão"
 court.6030.d:0 "Isso é #EMP inaceitável#!."
 court.6030.desc:0 "\"#EMP Existe uma história em nossa pequena cidade,\nde um [ROOT.Char.Custom('GetQueenKing')] com uma Coroa de Alho,\npara enfrentar os [ROOT.Char.Custom('GetUnbelieverNamePlural')] [ROOT.Char.GetSheHe] cavalgou em um burro,\nmas seu único sucesso foi contra um macaco pequeno...#!\"\n\nEssa maldita balada se tornou muito popular entre os trovadores ambulantes e o povo comum - #EMP popular demais#! para o meu gosto, desde que descobri uma quantidade perturbadora de semelhanças entre mim e seu protagonista... Mas ouvir isso, cantado sem vergonha na minha frente por [6030_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)], já é demais!"
 court.6030.e.tt:0 "Você dá socos na próxima pessoa que te provoca cantando a estúpida balada - repetidamente"
 court.6030.e:0 "Eu. Não. Suporto. MAIS!"
 court.6030.f:0 "Bem, eles terão que parar em algum momento...?"
 court.6030.t:0 "A Balada do [ROOT.Char.Custom('GetQueenKing')] do Alho"
 court.6040.a:0 "Já que você está sempre aqui, é melhor se tornar útil!"
 court.6040.b:0 "Considerando tudo, eu acho [scrounger.GetSheHe] bastante engraçad[Select_CString( scrounger.IsFemale, 'a', 'o' )]!"
 court.6040.c:0 "Tire essa sanguessuga da minha vista."
 court.6040.desc:0 "[scrounger.GetTitledFirstName|U] se tornou uma presença constante na minha corte - e uma presença #EMP cara#! Na verdade, uma presença #EMP expansiva#!.\n\n[scrounger.GetSheHe|U] está presente em todos os banquetes, devorando tudo o que vê enquanto reclama de como sua própria despensa está vazia. \"Você serve as melhores bebidas, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" [scrounger.GetSheHe] diz, depois de beber mais um copo da minha melhor [ROOT.Char.Custom('GetExpensiveDrink')]. \"Você é a pessoa mais #EMP [SCOPE.Custom('PersonalityGetSharedTraitDescriptionFromFlag')]#!, a mais #EMP [ROOT.Char.Custom('ComplimentAdjective')]#!, [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetLadyLord] mais #EMP [Select_CString( ROOT.Char.IsFemale, 'BONITA', 'BONITO' )]#!!\" [scrounger.GetSheHe] declara, estendendo a mão para outro empréstimo que [scrounger.GetSheHe] nunca vai pagar.\n\n[scrounger.GetSheHe|U] é um desperdício de dinheiro irritante, mas suas atuações exageradas são bastante divertidas."
 court.6040.t:0 "Vida de Sanguessuga"
 court.6041.a:0 "Eu sabia que você servia para alguma coisa!"
 court.6041.b.failure.tt:0 "[scrounger.GetFirstNameNoTooltip] não consegue melhorar ainda mais"
 court.6041.b.failure:0 "Apesar de seus melhores esforços, parece que [Select_CString( scrounger.IsFemale, 'a', 'o' )] [scrounger.GetFirstNameNoTooltip] já alcançou o auge de suas habilidades"
 court.6041.b.success.tt:0 "[scrounger.GetFirstNameNoTooltip] se torna inspirad[Select_CString( scrounger.IsFemale, 'a', 'o' )]!"
 court.6041.b.success:0 "[scrounger.GetFirstNameNoTooltip] recebe inspiração para uma grande obra"
 court.6041.b:0 "... mas aposto que você pode fazer ainda melhor!"
 court.6041.c:0 "Já perdi tempo demais com você."
 court.6041.desc:0 "Passaram-se alguns meses desde que decidi permitir que [Select_CString( scrounger.IsFemale, 'a', 'o' )] [scrounger.GetTitledFirstName] continue com sua vida parasitária em minha corte.\n\nEu não esperava nada além de suas habituais histórias exageradas de pobreza e elogios exageradamente floreados, mas recentemente tenho notado que suas histórias estão ficando mais engraçadas, suas rimas mais afiadas e seus elogios mais agradáveis.\n\nTanto meus cortesãos quanto os convidados estrangeiros se divertem muito com as palavras habilmente elaboradas [scrounger.GetHerHim]. Será que [Select_CString( scrounger.IsFemale, 'a', 'o' )] [scrounger.GetFirstNameNoTooltip] encontrou uma vocação útil?"
 court.6050.a:0 "Meus pobres olhos!"
 court.6050.b.tt.2:0 "Crianças educadas em sua corte terão mais chances de desenvolver uma personalidade [GetTrait('pensive').GetName( GetNullCharacter )], [GetTrait('chaste').GetName( GetNullCharacter )] ou [GetTrait('zealous').GetName( GetNullCharacter )]"
 court.6050.b.tt:0 "Você manda queimar todas as cópias do texto escandaloso e o proíbe em sua corte"
 court.6050.b:0 "Purifique-os com fogo!"
 court.6050.c.tt:0 "Crianças educadas em sua corte terão mais chances de desenvolver uma personalidade [GetTrait('curious').GetName( GetNullCharacter )], [GetTrait('lustful').GetName( GetNullCharacter )] ou [GetTrait('cynical').GetName( GetNullCharacter )]"
 court.6050.c.unlock_text:0 "Essa opção está disponível devido à sua alta habilidade em [learning|E]"
 court.6050.c:0 "A cultura se manifesta de diversas formas. Deixe-os ler."
 court.6050.d:0 "Uhhh, suculento!"
 court.6050.desc_byz:0 "Apesar de sua capa sugerir um livro piedoso de orações, trata-se de um romance licencioso, escrito séculos atrás por nossos antepassados pagãos! Há uma bela donzela, piratas, tentações e páginas luxuriantes repletas de desejos profanos..."
 court.6050.desc_chaucer:0 "Todos são contos de peregrinos na estrada; no entanto, não tratam da salvação de suas almas, mas sim de assassinatos sangrentos e esposas infiéis..."
 court.6050.desc_ending:0 "\n\nPermaneço em silêncio enquanto pondero a provável reação d[Select_CString( court_chaplain.IsFemale, 'a', 'o' )] [court_chaplain.GetCouncilTitle] [court_chaplain.GetTitledFirstName], e [Select_CString( courtier.IsFemale, 'a', 'o' )] [courtier.GetFirstNameNoTooltip] me olha apreensiv[Select_CString( courtier.IsFemale, 'a', 'o' )]."
 court.6050.desc_generic:0 "É claramente um texto licencioso, repleto de tentações sensuais, seduções terrenas e seios macios..."
 court.6050.desc_islam:0 "Ao folhear rapidamente o texto, encontro piratas, donzelas com roupas sumárias, reis movidos pela luxúria, rainhas lascivas e ardilosas, e até mesmo um mendigo enriquecido que se casa com uma princesa com a ajuda de um djinn..."
 court.6050.desc_opening:0 "Ultimamente, não consigo deixar de notar os grupos de donzelas risonhas e guerreiros normalmente austeros se reunindo em recantos escuros para ouvir, encantados, um livro.\n\nHoje, finalmente encurralei [Select_CString( courtier.IsFemale, 'a', 'o' )] [courtier.GetTitledFirstName] com o livro em suas mãos."
 court.6050.desc_sonetti:0 "Há páginas e mais páginas de poesia, graciosa em sua forma, mas lasciva em sua natureza. A beleza angelical de todas as mulheres é exaltada por palavras suaves, que mal conseguem esconder o desejo terreno do poeta..."
 court.6050.e.tt:0 "Você se inspira nas leituras"
 court.6050.e:0 "Por que devemos nos limitar à leitura, [courtier.GetFirstNameNoTooltip]?"
 court.6050.f:0 "Faça-o desaparecer e fingirei que não vi nada."
 court.6050.t:0 "Leituras Picantes"
 court.6060.a:0 "O vinho abre a porta para [ROOT.Char.GetFaith.DevilName]!"
 court.6060.b:0 "Um pouco de vinho mantém os humores equilibrados."
 court.6060.c.tt.2:0 "Graças às contribuições d[Select_CString( courtier_drunkard.IsFemale, 'a', 'o' )] [courtier_drunkard.GetFirstNameNoTooltip] ao fornecimento de vinho, os Benefícios da Corte de Alimentos são 50% mais baratos pelos próximos 10 anos."
 court.6060.c.tt:0 "[courtier_drunkard.GetFirstNameNoTooltip|U] abre seu esconderijo secreto!"
 court.6060.c:0 "[courtier_drunkard.GetFirstNameNoTooltip|U], brinde comigo!"
 court.6060.d:0 "A resposta está no fundo deste copo!"
 court.6060.desc_drunkard_courtier:0 "\n\nDe um canto da sala, [courtier_drunkard.GetTitledFirstName] interrompe a discussão: \"A única quantidade de vinho boa para você é #EMP TODA ELA#!!\""
 court.6060.desc_ending:0 "\n\nQual é a minha posição em relação ao vinho?"
 court.6060.desc_opening:0 "De repente, [court_chaplain.GetCouncilTitle] [court_chaplain.GetTitledFirstName] e [court_physician.Custom2('MyCharacterIntroduction', ROOT.Char)] irrompem na sala do trono, discutindo.\n\n\"O vinho ofende [ROOT.Char.GetFaith.HighGodName]! Ele #EMP deve#! ser evitado!\" exclama [Select_CString( court_chaplain.IsFemale, 'a', 'o' )] [court_chaplain.GetFirstNameNoTooltip].\n\n\"Um pouco de vinho é saudável para o corpo!\" responde [Select_CString( court_chaplain.IsFemale, 'a', 'o' )] [court_physician.GetFirstNameNoTooltip]."
 court.6060.t:0 "As Alegrias do Vinho"
 court.6070.a.failure:0 "Aprender a ler e escrever é uma causa perdida para mim"
 court.6070.a.success:0 "Eu aprendo a ler e escrever com sucesso"
 court.6070.a.tt.1:0 "Ninguém mais vai zombar de mim"
 court.6070.a.tt.2:0 "Terei que encontrar outra solução"
 court.6070.a:0 "Ensine-me #EMP agora mesmo#!"
 court.6070.b:0 "Mexeção de pena é coisa de perdedores e fracos!"
 court.6070.c:0 "Vou continuar fingindo que não percebo eles."
 court.6070.d.tt.failure:0 "Eles conseguem ver através de mim"
 court.6070.d.tt.success:0 "Eles acreditam na minha mentira descarada!"
 court.6070.d.tt:0 "Se eu disser com convicção suficiente, eles podem até acreditar..."
 court.6070.d:0 "Eu #EMP sei#! escrever, muito obrigado!"
 court.6070.desc:0 "Sinto os olhares julgadores de todos os meus cortesãos sobre mim enquanto assino lentamente, com uma pena tremendo em minha mão incerta, um novo decreto. \n\nClaro, #EMP assinar#! é uma palavra forte. Estou apenas retraçando as letras esculpidas em uma tábua de madeira - e mal estou conseguindo. Hoje, até [tutor_6070.Custom2('MyCharacterIntroduction', ROOT.Char)] está olhando para mim com o que suponho ser uma mistura de pena e desprezo. \n\nAntes que eu possa repreender [tutor_6070.GetSheHe] por me desrespeitar, [tutor_6070.GetSheHe] intervém com um tom esperançoso: '[ROOT.Char.Custom('FormOfAddressForLiege')|U], talvez seja hora de você aprender a ler e escrever corretamente?'"
 court.6070.t:0 "O Valor das Letras"
 court.6071.a:0 "Eu sou simplesmente muito inteligente."
 court.6071.b.tt:0 "A Aptidão d[Select_CString( tutor_6070.IsFemale, 'a', 'o' )] [tutor_6070.GetFirstNameNoTooltip] como $court_tutor_court_position$ aumenta."
 court.6071.b:0 "[tutor_6070.GetFirstNameNoTooltip] merece uma compensação."
 court.6071.desc:0 "#EMP C...a...r...o a...m...i...g...o,#!\n\n\"Sim, isso parece bom!\"\n\nPassei horas incontáveis praticando meu alfabeto sob o olhar severo de [tutor_6070.Custom2('MyCharacterIntroduction', ROOT.Char)], e parece que meus esforços valeram a pena! Correspondências internacionais, relatórios de conselheiros e juramentos de vassalos não têm mais segredos para mim! \n\nMe passe uma caneta - quero assinar mais coisas!"
 court.6072.a.tt:0 "Ninguém está impressionado"
 court.6072.a:0 "As cartas são inúteis mesmo! Agora, devolva meu [ROOT.Char.Custom('child_object_of_interest_random')]!"
 court.6072.b.tt:0 "Certamente parece impressionante, mas não pode esconder o fato de que você não está lendo o que assina"
 court.6072.b:0 "Muito bem, assinarei de maneira fantasiosa o que #EMP eu leio#! com o selo."
 court.6072.c:0 "É tudo culpa sua, [tutor_6070.GetFirstNameNoTooltip]!"
 court.6072.desc:0 "#EMP C...a...r...o a...m...i...g...o,#!\n\n\"Olhe só isso! Estou indo muito bem, não é?\"\n\n[tutor_6070.Custom2('MyCharacterIntroduction', ROOT.Char)|U] suspira, balançando a cabeça com uma expressão triste. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], talvez você prefira usar este selo elegante e reluzente em vez de assinar?\"\n\nAparentemente, [tutor_6070.GetSheHe] não está satisfeito com o #EMP incrível#! progresso que tenho feito em minha empreitada de aprender a ler e escrever."
 court.6080.a:0 "Posso ser ainda #EMP mais#! generoso!"
 court.6080.b.failure.tt:0 "[6080_visitor.GetFirstNameNoTooltip] não está convencid[Select_CString( 6080_visitor.IsFemale, 'a', 'o' )]"
 court.6080.b.failure:0 "[6080_visitor.GetFirstNameNoTooltip] não se impressiona com minhas tentativas"
 court.6080.b.success.tt:0 "[6080_visitor.GetFirstNameNoTooltip] está convencid[Select_CString( 6080_visitor.IsFemale, 'a', 'o' )]!"
 court.6080.b.success:0 "Eu convenço [Select_CString( 6080_visitor.IsFemale, 'a', 'o' )] [6080_visitor.GetFirstNameNoTooltip] a me dar também"
 court.6080.b:0 "Devo aproveitar a generosidade boba [6080_visitor.GetHerHim] também!"
 court.6080.c:0 "Eu acredito que [Select_CString( 6080_visitor.IsFemale, 'a', 'o' )] [6080_visitor.GetFirstNameNoTooltip] já prolongou demais sua estadia..."
 court.6080.d:0 "É melhor [6080_visitor.GetSheHe] gastar do que eu."
 court.6080.desc:0 "Nos últimos dias, [6080_visitor.GetTitledFirstName] tem visitado a minha corte enquanto está a caminho de algum negócio, talvez um local sagrado ou algo assim."
 court.6080.desc_2:0 "E algumas moedas também para você, gentil [beneficiary_2.GetFirstName]!"
 court.6080.desc_3:0 "E para você, querid[Select_CString( beneficiary_child.IsFemale, 'a', 'o' )] [beneficiary_child.GetFirstName], bolinhos de mel doces!"
 court.6080.desc_end:0 "Lembre-se, as riquezas devem ser compartilhadas!"
 court.6080.desc_liege:0 "Nos últimos dias, [6080_visitor.GetTitledFirstName], [Select_CString( 6080_visitor.IsFemale, 'minha senhora', 'meu senhor' )], tem visitado a minha corte em ocasião de [GetActivityType('activity_tour').GetName] [6080_visitor.GetHerHim]."
 court.6080.desc_middle:0 "\n\nDesde a chegada [6080_visitor.GetHerHim], [6080_visitor.GetSheHe] tem me ofuscado com sua generosidade em relação aos meus próprios cortesãos, que têm aproveitado o ouro [6080_visitor.GetHerHim] sem nenhuma dignidade! Não consigo evitar zombar ao ver [6080_visitor.GetSheHe] rodeado por cortesãos adoradores pela enésima vez. #EMP Meus#! cortesãos.\n\n\"Uma bolsa para você, bo[Select_CString( beneficiary_1.IsFemale, 'a', '' )] [beneficiary_1.GetFirstName]!"
 court.6080.t:0 "A Munificência d[Select_CString( 6080_visitor.IsFemale, 'a', 'o' )] [6080_visitor.GetFirstNameNoTooltip]"
 court.6090.a:0 "Prestem atenção, crianças! Vocês precisarão disso."
 court.6090.b.failure.tt:0 "As crianças não aprendem nada"
 court.6090.b.failure:0 "Eu sou ainda mais entediante do que [Select_CString( 6090_poet.IsFemale, 'a', 'o' )] [6090_poet.GetFirstNameNoTooltip]"
 court.6090.b.success:0 "As crianças estão impressionadas"
 court.6090.b:0 "Deixem-me explicar de forma mais clara."
 court.6090.c.tt:0 "#EMP A GUERRA#! é uma busca muito mais digna para a jovem nobreza! Venha treinar comigo!"
 court.6090.c:0 "Você é simplesmente muito entediante, [6090_poet.GetFirstNameNoTooltip]!"
 court.6090.desc.cp:0 "[6090_poet.Custom2('MyCharacterIntroduction', ROOT.Char)] parece à beira das lágrimas"
 court.6090.desc.middle:0 "enquanto [6090_child_a.GetFirstNameNoTooltip] e [Select_CString( 6090_child_b.IsFemale, 'a', 'o' )] [6090_child_b.GetFirstName] encaram [6090_poet.GetSheHe] com a expressão mais desapontada que já vi em seus jovens rostos."
 court.6090.desc.teacher:0 "[6090_poet.GetFirstName], um[Select_CString( 6090_poet.IsFemale, 'a', '' )] professor[Select_CString( 6090_poet.IsFemale, 'a', '' )] localmente renomad[Select_CString( 6090_poet.IsFemale, 'a', 'o' )] que agora está visitando nossa corte, parece estar no limite da sua paciência"
 court.6090.desc:0 "\"#EMP MAS EU ESTOU MUUUUITO ENTEDIADO!#!\" Eu reconheço imediatamente a voz lamentosa de [6090_child_a.Custom2('MyCharacterIntroduction', ROOT.Char)] mesmo antes do travesso aparecer em minha visão.\n\nA cena que encontro diante de meus olhos é bastante lamentável:"
 court.6090.desc_end:0 "\n\nQuando os olhos [6090_poet.GetHerHim] encontram os meus, [6090_poet.GetFirstNameNoTooltip] implora: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], #EMP por favor#!, estou apenas tentando explicar às suas crianças a arte refinada da retórica, como exigido por sua nobre origem...\""
 court.6090.desc_other:0 "[6090_child_c.GetFirstName] se distraiu olhando pela janela, claramente mais interessado em #EMP qualquer coisa#! que esteja acontecendo lá fora."
 court.6090.t:0 "A Arte da Retórica"
