l_spanish:
 court.2001.a.sadistic.crony_a_wins:0 "[crony_a.GetFirstNameNoTooltip] se curva mais"
 court.2001.a.sadistic.crony_b_wins:0 "[crony_b.GetFirstNameNoTooltip] se curva mais"
 court.2001.a.sadistic:0 "Quem se curvar mais recebe esta moeda #EMP brilhante#!. Vamos lá."
 court.2001.a:0 "Sinceramente, vocês dois poderiam se esforçar mais nisso."
 court.2001.b:0 "Eu vejo através das suas manipulações, lacaios!"
 court.2001.c:0 "Acho que vocês estão perdendo a forma mais óbvia de conquistar meu coração..."
 court.2001.d:0 "Isso está abaixo de mim."
 court.2001.desc:0 "Nem [crony_a.GetFirstName] nem [crony_b.GetFirstName] percebem quando me aproximo furtivamente de sua conversa barulhenta nos corredores.\n\n\"#EMP A submissão física#! é a chave! Cada joelho ferido por bajulação é uma moeda fresca em minha bolsa! Você simplesmente não pode errar com prostração.\"\n\n\"Bobagem, basta empilhar adjetivos na frente do título [ROOT.Char.GetHerHim] e você ficará rico até morrer. Se você ainda tiver ar nos pulmões antes de chegar à '[ROOT.Char.GetTitleAsNameNoTooltip]', você está fazendo errado.\"\n\nEu pigarreio, silenciando instantaneamente os bajuladores mortificados."
 court.2001.t:0 "Submissão Competitiva"
 court.2201.a:0 "Você acha que é #EMP merecedor[Select_CString( eldest_heir.IsFemale, 'a', '' )]#! de mais, [eldest_heir.GetFirstNameNoTooltip]? Que tal #EMP nada#!!"
 court.2201.b:0 "Infelizmente, essas são apenas as regras do jogo, [younger_heir.GetFirstNameNoTooltip]..."
 court.2201.c:0 "Eles são família, eles vão se entender #EMP bem#! sem mim, não é mesmo?"
 court.2201.d:0 "Crianças, vocês querem saber o verdadeiro significado de família?"
 court.2201.desc:0 "\"-pertence a mim! Dividir o [ROOT.Char.GetPrimaryTitle.GetNameNoTier] entre herdeiros separados não faz sentido!\" grita [Select_CString( eldest_heir.IsFemale, 'minha', 'meu' )] [eldest_heir.GetFirstName] enquanto [eldest_heir.GetSheHe] e [younger_heir.Custom2('HerHisCharacterIntroduction', eldest_heir)] discutem alto na outra extremidade da sala. \"Estamos condenando o reino ao assassinato e à guerra civil. [ROOT.Char.GetMotherFather|U] deve deixar todas as terras [ROOT.Char.GetHerHim] para #EMP mim#!!\"\n\n\"Assassinato? Guerra civil? Exatamente #EMP o que#! você planeja quando for [ROOT.Char.GetTitleAsNameNoTooltip]?\" resmunga [Select_CString( younger_heir.IsFemale, 'minha', 'meu' )] [younger_heir.GetFirstNameNoTooltip]. \"Você será um[Select_CString( eldest_heir.IsFemale, 'a', '' )] governante complet[Select_CString( eldest_heir.IsFemale, 'a', 'o' )] e total se é assim que você pensa sobre sua família antes mesmo da coroa tocar sua cabeça feia.\"\n\nMinha cabeça lateja. Eles têm discutido. A manhã toda."
 court.2201.t:0 "Uma Fatia do Bolo"
 court.2401.a:0 "Meu, essas #EMP parecem#! ser tentadoras..."
 court.2401.b:0 "Não precisamos de besteiras estrangeiras em minha corte!"
 court.2401.c:0 "Quem se importa com o que as pessoas vestem?"
 court.2401.desc:0 "\"As melhores vestes do reino, bo[Select_CString( ROOT.Char.IsFemale, 'a', 'm' )] [ROOT.Char.GetTitleAsNameNoTooltip], principalmente porque #EMP não são#! deste reino\", ri [Select_CString( seller.IsFemale, 'a', 'o' )] [seller.GetFirstName] enquanto passo pela câmara aberta de [seller.GetHerHis]. A voz de [seller.GetHerHis|U] transborda charme e astúcia.\n\n\"Quase novas, tão boas quanto novas, e frescas dos ditadores de moda na corte d[Select_CString( grander_ruler.IsFemale, 'a', 'o' )] [grander_ruler.GetTitledFirstName]! Estas são as que #EMP todo mundo#! no [grander_ruler.GetPrimaryTitle.GetName] usará na próxima temporada.\""
 court.2401.t:0 "Glamour de Segunda Mão"
 court.2411.a:0 "Pelo [ROOT.Char.GetFaith.HighGodName], deixe-me mostrar-lhe o caminho para fora!"
 court.2411.b:0 "Como assim... Como você pode ser #EMP tão#! tolo?"
 court.2411.c:0 "Assobiando Que emaranhado de salões eu mantenho..."
 court.2411.desc:0 "Meu passeio me leva por uma ala desativada do palácio, percorrendo alguns aposentos espaçosos (embora empoeirados) que minha equipe sobrecarregada raramente visita, quando ouço um soluço rouco vindo de um corredor secundário.\n\nInvestigando, encontro [lost_guest.Custom2('MyCharacterIntroduction', ROOT.Char)], desabado em desespero. [lost_guest.GetSheHe|U] se ergue assim que me vê, segurando-me pelos ombros, e começa a tagarelar como um[Select_CString( lost_guest.IsFemale, 'a', '' )] [lost_guest.GetWomanMan] louc[Select_CString( lost_guest.IsFemale, 'a', 'o' )].\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip], estive perdido nestes corredores por #EMP três dias#!! Não consigo encontrar a saída, apenas infinitos labirintos de corredores conectados e câmaras mofadas sem um único servo à vista!\""
 court.2411.t:0 "Salões Labirínticos"
