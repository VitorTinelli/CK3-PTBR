l_spanish:
 6110_custom_every_realm_1:0 "Todos os condados no reino de [6110_vassal_1.GetShortUIName]"
 6110_custom_every_realm_2:0 "Todos os condados no reino de [6110_vassal_2.GetShortUIName]"
 6120_every_vassal:0 "Cada um de seus vassalos"
 6140_bear:0 "urso"
 6140_every_courtier_or_guest:0 "Cada cortesão ou convidado em sua corte"
 6140_every_prisoner:0 "Cada prisioneiro em suas celas"
 6140_lion:0 "leão"
 6140_tiger:0 "tigre"
 all_realm_county:0 "Cada [county|E] do [realm|E]"
 character_title_cannot_be_revoked_tt:0 "Você não poderá revogar o título por 25 anos."
 easier_to_convert:0 "Comunidade Religiosa Enfraquecida"
 easier_to_convert_desc:0 "A identidade religiosa deste condado foi recentemente enfraquecida, tornando-os mais suscetíveis a novas crenças.\n\n#P +25%#! Velocidade de Conversão de Fé"
 easier_to_culture_convert:0 "Comunidade Cultural Enfraquecida"
 easier_to_culture_convert_desc:0 "A identidade cultural deste condado foi recentemente enfraquecida, tornando-os mais suscetíveis a novas culturas.\n\n#P +25%#! Velocidade de Conversão Cultural"
 hold_court.6000.a:0 "Algum ouro ajudará a amenizar seus sofrimentos."
 hold_court.6000.b:0 "Concederei isenção de impostos para que se recuperem."
 hold_court.6000.c.tt:0 "Você envia [Select_CString( inspector.IsFemale, 'a', 'o' )] [inspector.GetTitledFirstName] como inspetor[Select_CString( inspector.IsFemale, 'a', '' )] oficial para supervisionar a recuperação do condado"
 hold_court.6000.c:0 "Eu conheço a pessoa certa para o trabalho."
 hold_court.6000.d:0 "Tenho certeza de que você pode resolver isso sozinho."
 hold_court.6000.desc_count:0 "[6000_count.Custom2('MyCharacterIntroduction', 6000_poor)|U] não tem dinheiro ou vontade de nos ajudar."
 hold_court.6000.desc_ending:0 "Imploramos que intervenha e salve seus fiéis súditos com sua grande magnanimidade!\"\n\n[6000_poor.GetSheHe|U] se curva profundamente e se cala."
 hold_court.6000.desc_epidemics:0 "epidemias."
 hold_court.6000.desc_intro:0 "Diante de mim está [6000_poor.Custom2('MyCharacterIntroduction', ROOT.Char)], com a cabeça baixa.\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetLadyLord], [6000_province.GetNameNoTooltip] foi duramente afetado pelo recente"
 hold_court.6000.desc_middle:0 "O povo está passando fome, nossas terras não estão se recuperando e nosso gado não é mais suficiente para sobreviver!"
 hold_court.6000.desc_occupation:0 "ocupação inimiga."
 hold_court.6000.desc_raiding:0 "saques e pilhagens."
 hold_court.6000.desc_winter:0 "inverno rigoroso."
 hold_court.6000.t:0 "Celeiros Vazios"
 hold_court.6030.a:0 "Aceito graciosamente."
 hold_court.6030.b.tt.2:0 "Todos os governantes da cultura [6030_monk.GetCulture.GetName]"
 hold_court.6030.b:0 "Por favor, fique e me ensine mais!"
 hold_court.6030.c:0 "Não me importo, apenas saia da minha vista."
 hold_court.6030.d.tt:0 "Todos os seus vassalos da cultura [6030_monk.GetCulture.GetName]"
 hold_court.6030.d:0 "Sua cultura inferior não merece ser lembrada!"
 hold_court.6030.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], eu venho da comunidade religiosa de [6030_church.GetName], na [6030_border.GetName].\n\n\"Lá, [Select_CString( 6030_monk.IsFemale, 'sábias e piedosas', 'sábios e piedosos' )] [6030_monk.GetWomenMen] têm coletado e preservado o conhecimento tradicional da cultura [6030_monk.GetCulture.GetName] por séculos. Como um sinal de nossa boa vontade, ofereço a você esta valiosa antologia de textos [6030_monk.GetCulture.GetNameNoTooltip] traduzidos para o seu próprio idioma.\n\n\"Esperamos que você a aceite e ganhe uma nova perspectiva sobre nosso povo.\""
 hold_court.6030.t:0 "De Além da Fronteira"
 hold_court.6040.a:0 "Obrigado, vou adicioná-lo à minha coleção."
 hold_court.6040.b.tt:0 "Seu antiquário não tem ideia"
 hold_court.6040.b:0 "#EMP Fascinante!#! Chame o meu antiquário!"
 hold_court.6040.c.tt.2:0 "O livro continua sendo um mistério para você"
 hold_court.6040.c.tt.3:0 "É um manuscrito bonito, mas nada de especial"
 hold_court.6040.c.tt.4:0 "É um texto raro e valioso"
 hold_court.6040.c.tt:0 "É uma falsificação mal feita!"
 hold_court.6040.c:0 "Deixe-me dar uma olhada nele, #EMP agora mesmo#!"
 hold_court.6040.d:0 "Deve ser obra do [ROOT.Char.GetFaith.DevilName]! QUEIME-O!"
 hold_court.6040.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], eu represento a comunidade religiosa de [6040_church.GetName].\n\n\"Enquanto vasculhávamos nosso modesto arquivo, nos deparamos com um livro muito peculiar. A capa estava empoeirada, a encadernação frágil e as páginas amareladas pelo tempo, mas continha os desenhos mais incomuns, e o próprio roteiro é desconhecido para todos [6040_monk.GetFaith.PriestNeuterPlural].\n\n"
 hold_court.6040.e:0 "Quem se importa com livros?"
 hold_court.6040.t:0 "Um Tesouro Perdido"
 hold_court.6050.a:0 "A Santidade [6050_holy.GetHerHim] receberá a veneração que [6050_holy.GetSheHe] merece."
 hold_court.6050.b:0 "Eu já sei. O Santo veio a mim em um sonho."
 hold_court.6050.c:0 "Eu vou erradicar essa blasfêmia agora mesmo!"
 hold_court.6050.d:0 "Eu não me importo com superstições camponesas."
 hold_court.6050.desc:0 "O camponês diante de mim parece prestes a explodir de empolgação.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Os milagres! A santidade! Nós fomos #EMP ABENÇOADOS#!\"\n\nSuas divagações entusiasmadas são confusas, mas finalmente entendo a essência: [6050_pop.GetSheHe] quer que eu patrocine o culto de um santo local que morreu recentemente em [6050_tomb.GetNameNoTooltip]. [6050_holy.GetFirstName] era um[Select_CString( 6050_holy.IsFemale, 'a', '' )] produtor[Select_CString( 6050_holy.IsFemale, 'a', '' )] de milagres em vida, conhecido por [6050_holy.Custom('GetMiracle1')] e [6050_holy.Custom('GetMiracle2')]. O túmulo [6050_holy.GetHerHim] está atraindo visitantes devotos de todo o reino."
 hold_court.6050.desc_hof:0 "\n\nComo [head_of_faith|E], é meu privilégio decidir se condenar ou promover esse culto."
 hold_court.6050.t:0 "Um Túmulo Sagrado"
 hold_court.6060.a:0 "Muito bem. Você pode ficar com [6060_offer.GetNameNoTooltip]."
 hold_court.6060.b.tt.failure:0 "[6060_rich.GetFirstNameNoTooltip] mantém sua última oferta e você parece ganancioso"
 hold_court.6060.b.tt.success:0 "[6060_rich.GetFirstNameNoTooltip] concorda em pagar mais"
 hold_court.6060.b:0 "Tome a terra e construa uma cidade sobre ela."
 hold_court.6060.c:0 "Eu não preciso do seu ouro."
 hold_court.6060.desc:0 "[6060_rich.Custom2('MyCharacterIntroduction', ROOT.Char)|U] está diante de mim, com uma expressão esperançosa no rosto.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],"
 hold_court.6060.desc_ending:0 "\"Não pude deixar de notar que, nos últimos tempos, as finanças do reino não estão muito saudáveis. É claro que você as tem administrado de maneira exemplar, mas - talvez - você possa encontrar algum uso para um pouco mais de ouro.\n\n\"Estou disposto a comprar um assentamento menor de suas mãos em troca de uma generosa quantia de ouro. Seria aceitável?\""
 hold_court.6060.desc_merchant:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], permita-me me apresentar: meu nome é [6060_rich.GetTitledFirstName] e sou um[Select_CString( 6060_rich.IsFemale, 'a', '' )] ric[Select_CString( 6060_rich.IsFemale, 'a', 'o' )] comerciante da capital.\n\n"
 hold_court.6060.t:0 "Uma Oferta Conveniente"
 hold_court.6070.a:0 "Eu aceito de bom grado sua oferta."
 hold_court.6070.b:0 "Claro! [6070_friend.GetFirstNameNoTooltip], mostre a [6070_child.GetSheHe] por aí!"
 hold_court.6070.c:0 "Eu aceito - mas espero um noivado em troca."
 hold_court.6070.d:0 "Sinto muito, mas não posso aceitar essa responsabilidade agora."
 hold_court.6070.desc:0 "\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetLadyLord], meu nome é [6070_embassy.GetTitledFirstName] e sou um[Select_CString( 6070_embassy.IsFemale, 'a', '' )] embaixador[Select_CString( 6070_embassy.IsFemale, 'a', '' )] [Select_CString( 6070_sender.IsFemale, 'da sua', 'do seu' )] aliad[Select_CString( 6070_sender.IsFemale, 'a', 'o' )], [6070_sender.GetTitledFirstName]. Eu trago a você as saudações amigáveis [6070_sender.GetHerHim] e uma oferta.\n\n\"Meu senhor feudal valoriza sua amizade acima de tudo, então, como um sinal de boa vontade, [6070_sender.GetSheHe] envia a você essa criança - s[Select_CString( 6070_child.IsFemale, 'ua', 'eu' )] [6070_child.Custom('GetDaughterSon')] [6070_child.GetFirstName] - para educar como você desejar.\n\n\"[Select_CString( 6070_sender.IsFemale, 'Minha', 'Meu' )] [6070_sender.GetLadyLord] espera que esse gesto fortaleça sua aliança e tem confiança de que [Select_CString( 6070_child.IsFemale, 'a', 'o' )] [6070_child.GetFirstNameNoTooltip] estará em boas mãos.\""
 hold_court.6070.e:0 "Essa criança é uma ameaça notória — Você não vai me fazer carregar [6070_child.GetSheHe]!"
 hold_court.6070.t:0 "Aliado em Crescimento"
 hold_court.6080.a.tt:0 "Você não poderá revogar esse título até a morte d[Select_CString( 6080_count.IsFemale, 'a', 'o' )] [6080_count.GetFirstNameNoTooltip]"
 hold_court.6080.a:0 "Muito bem. Seu povo pode povoar o [6080_county.GetNameNoTooltip] por mim."
 hold_court.6080.b:0 "Eu sei o que é melhor para o condado de [6080_county.GetNameNoTooltip]."
 hold_court.6080.c:0 "\"Seu povo sempre terá um lugar seguro em [6080_province.GetNameNoTooltip].\""
 hold_court.6080.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], eu represento o povo [6080_culture.GetNameNoTooltip] de [6080_county.GetNameNoTooltip],\" declara [6080_count.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n\"Somos súditos devotados e fiéis, mas nossas terras são pobres, subdesenvolvidas e escassamente povoadas. Por favor, permita-nos reassentá-las e administrá-las de acordo com nossas tradições!\n\n\"Sob sua proteção benevolente, nossas terras ainda podem prosperar, e você ganhará um novo vassalo fiel!\""
 hold_court.6080.t:0 "Assentando o [6080_culture.GetNameNoTooltip|U]"
 hold_court.6090.a:0 "[court_chaplain.GetFirstNameNoTooltip], veja o que você pode fazer."
 hold_court.6090.b:0 "[high_almoner.GetFirstNameNoTooltip], organize algumas esmolas locais."
 hold_court.6090.c:0 "A convivência pacífica é sempre a melhor solução."
 hold_court.6090.d:0 "[executioner.GetFirstNameNoTooltip], dê um exemplo com alguns descrentes."
 hold_court.6090.desc.almoner:0 "\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U] — se me permite\", interrompe [high_almoner.Custom2('MyCharacterIntroduction', ROOT.Char)], \"Talvez eles possam ser persuadidos ao receberem generosas esmolas dos fiéis à #EMP verdade#!\""
 hold_court.6090.desc.executioner:0 "\n\n\"Aposto que só precisam de #EMP uma mão firme!#!\", diz [executioner.Custom2('MyCharacterIntroduction', ROOT.Char)] com um sorriso sombrio."
 hold_court.6090.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], lamento informar que a situação religiosa em minhas terras está fora de controle...\n\n\"Tentei fazer com que meus súditos vissem a luz de nossa verdadeira fé, mas muitos deles persistem em suas crenças errôneas! Peço que você use sua autoridade e poder para me ajudar!\""
 hold_court.6090.e:0 "Isso parece ser um problema seu, não meu."
 hold_court.6090.t:0 "Hereges à Solta"
 hold_court.6100.a:0 "Qualquer um pode ver que [Select_CString( 6100_vassal_1.IsFemale, 'a', 'o' )] [6100_vassal_1.GetFirstNameNoTooltip] está certo."
 hold_court.6100.b:0 "A posição d[Select_CString( 6100_vassal_2.IsFemale, 'a', 'o' )] [6100_vassal_2.GetFirstNameNoTooltip] é legítima."
 hold_court.6100.c:0 "Parem imediatamente com a luta, ou então..."
 hold_court.6100.d:0 "Estou cansado das suas bobagens. Leve os dois para a prisão!"
 hold_court.6100.desc.jester:0 "\n\n[o bobo.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se anima: \"Ohh, eu #EMP adoro#! brigas insignificantes! Elas combinam bem com... RIMAS ENGRAÇADAS!\""
 hold_court.6100.desc:0 "Diante de mim estão [6100_vassal_1.Custom2('MyCharacterIntroduction', ROOT.Char)] e [6100_vassal_2.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\" começa [Select_CString( 6100_vassal_1.IsFemale, 'a', 'o' )] [6100_vassal_1.GetFirstNameNoTooltip], \"a guerra entre mim e [Select_CString( 6100_vassal_2.IsFemale, 'a', 'o' )] [6100_vassal_2.GetTitledFirstNameNoTooltip] está se arrastando devido à teimosa recusa [6100_vassal_2.GetHerHim] em ver a razão, então viemos até você para mediação.\"\n\n\"Então agora é #EMP culpa minha#!!?\" interrompe [Select_CString( 6100_vassal_2.IsFemale, 'a', 'o' )] [6100_vassal_2.GetFirstNameNoTooltip] \"Você incrível traste! [Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetLadyLord], diga a [6100_vassal_1.GetSheHe]!\""
 hold_court.6100.e.tt:0 "Os dois contendores resolverão a guerra por meio de um duelo"
 hold_court.6100.e:0 "Vamos resolver isso como guerreiros honrosos."
 hold_court.6100.f.1.t:0 "Você gargalha com as tentativas fracas de [6100_vassal_1.GetShortUIName|U]"
 hold_court.6100.f.1:0 "Você é um vilaninho desprezível\ndeve viver em uma toca\nEu te odeio tanto\ndeve ficar em uma cabana...?\""
 hold_court.6100.f.2.t:0 "Você ri alto das terríveis rimas de [6100_vassal_2.GetShortUIName|U]"
 hold_court.6100.f.2:0 "\"Você é um grosseiro ignorante\nnão pode assustar uma menininha\nEu vou te fazer correr\nvocê não é tão astuto...?\""
 hold_court.6100.f:0 "Haha, boa ideia! Vocês dois troquem algumas rimas!"
 hold_court.6100.g.tt:0 "A guerra continua a todo vapor"
 hold_court.6100.g:0 "Vocês estão me incomodando com suas brigas insignificantes. Saiam."
 hold_court.6100.t:0 "Uma Terra em Guerra"
 hold_court.6101.t:0 "[sc_victor.GetTitledFirstName|U] vence o duelo"
 hold_court.6101.tt:0 "[sc_victor.GetTitledFirstName|U] é declarad[Select_CString( sc_victor.IsFemale, 'a', 'o' )] [Select_CString( sc_victor.IsFemale, 'a', 'o' )] vencedor[Select_CString( sc_victor.IsFemale, 'a', '' )] da guerra"
 hold_court.6110.a:0 "\"A guerra acabou, [6110_vassal_1.GetTitledFirstNameNoTooltip] é [Select_CString( 6110_vassal_1.IsFemale, 'a', 'o' )] vencedor[Select_CString( 6110_vassal_1.IsFemale, 'a', '' )].\""
 hold_court.6110.b:0 "\"Ambas as partes devem ser interrompidas imediatamente!\""
 hold_court.6110.c:0 "\"Esta guerra é uma tolice, [6110_vassal_2.GetTitledFirstNameNoTooltip] é [Select_CString( 6110_vassal_2.IsFemale, 'a', 'o' )] vencedor[Select_CString( 6110_vassal_2.IsFemale, 'a', '' )].\""
 hold_court.6110.desc.almoner:0 "\n\n\"Que a misericórdia de [almoner.GetFaith.HighGodName] e a generosidade dos filhos de [almoner.GetFaith.HighGodName] sejam um bálsamo para o seu sofrimento\", sugere [almoner.Custom2('MyCharacterIntroduction', ROOT.Char)] suavemente."
 hold_court.6110.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], sou apenas um humilde camponês, mas imploro por sua ajuda! A terra do meu povo foi devastada pela longa e sangrenta guerra entre seus vassalos [6110_vassal_1.GetTitledFirstName] e [6110_vassal_2.GetTitledFirstName]!\n\n\"Os campos estão queimando, os animais são abatidos e os camponeses estão morrendo! Por favor, pare com o derramamento de sangue!\""
 hold_court.6110.e:0 "Um camponês não deve se intrometer nos assuntos da nobreza."
 hold_court.6110.t:0 "Uma Terra Devastada"
 hold_court.6120.a.tt:0 "A pesquisa começa. Levará alguns meses para ser concluída."
 hold_court.6120.a:0 "Muito bem, prossiga com a pesquisa."
 hold_court.6120.b:0 "[seneschal.GetFirstNameNoTooltip], cuide disso."
 hold_court.6120.c:0 "Se eu quiser melhorar a tributação, posso apenas pedir #EMP mais#! impostos..."
 hold_court.6120.d:0 "Não vale a pena."
 hold_court.6120.desc.jester:0 "\n\n\"Mas números são #EMP booooring!#!\" reclama [jester.Custom2('MyCharacterIntroduction', ROOT.Char)] \"Vamos dançar em vez disso!\""
 hold_court.6120.desc.seneschal:0 "\n\n\"Por favor, [ROOT.Char.Custom('FormOfAddressForLiege')], permita-me supervisionar o assunto.\" [seneschal.Custom2('YourCharacterIntroduction', ROOT.Char)|U] fala."
 hold_court.6120.desc.swans:0 "\n\n\"E eu fornecerei uma lista de todos os cisnes em suas terras! Minha favorita é [keeper_swans.Custom('GetSwanName')]! Já te contei recentemente como a barriguinha dela é macia e fofinha? Ontem nós saímos para passear e...\" Decido ignorar [keeper_swans.Custom2('MyCharacterIntroduction', ROOT.Char)] enquanto ele tagarela sobre a maldita ave."
 hold_court.6120.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] toma a palavra. \"Eu tenho uma ideia para melhorar a tributação.\"\n\n\"Você poderia enviar agrimensores para questionar seus súditos sobre cada propriedade: seu nome, proprietário, extensão e valor, e quantas pessoas e animais vivem lá!\""
 hold_court.6120.e:0 "De fato, vamos dançar e afastar os números malignos!"
 hold_court.6120.t:0 "O Dia da Verdade"
 hold_court.6121.a:0 "Excelente trabalho, [6121_responsible.GetFirstNameNoTooltip]!"
 hold_court.6121.desc:0 "\"Está feito, [ROOT.Char.Custom('FormOfAddressForLiege')]\" declara [6121_responsible.Custom2('MyCharacterIntroduction', ROOT.Char)] enquanto [6121_responsible.GetSheHe] se curva diante de mim.\n\n\"Há vários meses você encomendou uma pesquisa de todas as suas terras; agora ela está concluída, e os detalhes sobre propriedade e valor das terras estão todos reunidos neste livro. Desde que esta descrição seja fiel à realidade, sua tributação será mais eficiente em todo o seu reino!\""
 hold_court.6121.t:0 "O Dia da Verdade: Pesquisa Concluída"
 hold_court.6130.a.tt:0 "\"[6130_proposer.GetFirstNameNoTooltip] começa a trabalhar na pesquisa cadastral. Isso levará vários meses para ser concluído, e quando estiver completo, oferecerá as seguintes recompensas:\""
 hold_court.6130.a:0 "Muito bem, [6130_proposer.GetFirstNameNoTooltip]. Você pode prosseguir."
 hold_court.6130.d:0 "Mapas são superestimados."
 hold_court.6130.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [6130_proposer.Custom2('MyCharacterIntroduction', ROOT.Char)] se manifesta, \"proponho um levantamento cadastral de todos os condados que você possui.\n\n\"Um conhecimento aprimorado e mapeamento de suas terras certamente aumentará sua prosperidade!"
 hold_court.6130.t:0 "O Cadastro"
 hold_court.6131.a:0 "Ouro bem gasto!"
 hold_court.6131.desc:0 "[6131_proposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se curva brevemente diante de mim e explica com um sorriso satisfeito: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], você pode se lembrar que, alguns meses atrás, você investiu uma grande soma de ouro em um cadastro de seus condados. \n\n\"Eu pessoalmente supervisei o assunto e posso dizer com orgulho que o trabalho está feito!\""
 hold_court.6131.desc_dead:0 "\n\nInfelizmente, [6130_helper.GetTitledFirstName] não viveu o suficiente para ver a conclusão do cadastro que [6130_helper.GetSheHe] havia se comprometido a ajudar a fazer."
 hold_court.6131.desc_hunt:0 "\n\nTambém estou satisfeito em ouvir um relatório detalhado da grande ajuda oferecida por [6130_helper.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 hold_court.6131.desc_tutor:0 "Também estou satisfeito em ouvir um relatório detalhado do aprendizado d[Select_CString( 6130_tutored.IsFemale, 'a', 'o' )] [6130_tutored.GetTitledFirstName] sob a orientação de [6130_helper.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 hold_court.6131.t:0 "O Cadastro: Concluído!"
 hold_court.6140.a.tt:0 "O animal é morto para obter sua pele."
 hold_court.6140.a:0 "Obrigado, eu realmente precisava de um novo tapete."
 hold_court.6140.artifact_toast:0 "Pelego adquirido"
 hold_court.6140.artifact_tt:0 "Você recebe um Pelego [court_artifact|E]"
 hold_court.6140.b:0 "De fato: uma fera poderosa para um governante poderoso!"
 hold_court.6140.c.hard_failure.tt:0 "[jester.GetFirstNameNoTooltip] fracassa miseravelmente..."
 hold_court.6140.c.hard_failure:0 "[jester.GetFirstNameNoTooltip] morre!"
 hold_court.6140.c.middle_failure.tt:0 "[jester.GetFirstNameNoTooltip] não tem sucesso"
 hold_court.6140.c.middle_failure:0 "[jester.GetFirstNameNoTooltip] se machuca"
 hold_court.6140.c.soft_failure.tt:0 "Todos riem do fracasso d[Select_CString( jester.IsFemale, 'a', 'o' )] [jester.GetFirstNameNoTooltip]"
 hold_court.6140.c.soft_failure:0 "[jester.GetFirstNameNoTooltip] cai de bunda"
 hold_court.6140.c.success.tt:0 "[jester.GetFirstNameNoTooltip] aprende a montar no(a) [ROOT.Char.Custom('GetAnimalType')]"
 hold_court.6140.c.success:0 "Isso pode ser feito!"
 hold_court.6140.c:0 "[Select_CString( jester.IsFemale, 'Minha boba', 'Meu bobo' )] vai aprender a montá-lo! Não é mesmo, [jester.GetFirstNameNoTooltip]?"
 hold_court.6140.d:0 "Tenho certeza de que meus #EMP convidados#! nas masmorras vão #EMP adorar#! isso..."
 hold_court.6140.desc:0 "Toda a sala do trono fica em silêncio quando [6140_gifter.Custom2('MyCharacterIntroduction', ROOT.Char)] entra triunfante, seguido por dois servos lutando para arrastar o(a) #EMP [ROOT.Char.Custom('GetAnimalType')] acorrentado#!.\n\nSorrindo orgulhosamente, [6140_gifter.GetFirstNameNoTooltip] exclama: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], eu lhe apresento um presente digno do mais poderoso governante do mundo! Esta magnífica fera foi caçada nas [6140_province.GetTerrain.GetNameNoTooltip] de [6140_province.GetCounty.GetName], e agora eu a ofereço a você como símbolo de minha devoção e seu poder incomparável!\""
 hold_court.6140.e:0 "Isso parece perigoso e fedorento! Leve isso embora."
 hold_court.6140.t:0 "Um Presente Incômodo"
 hold_court.6150.a.tt:0 "Você já está familiarizad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com essas práticas de arrependimento."
 hold_court.6150.a.wrath:0 "Você ordena que [6150_heretics_p.GetName] seja purificada de todos os pecadores"
 hold_court.6150.a:0 "A salvação deve ser alcançada por todos os meios!"
 hold_court.6150.b:0 "Sábi[Select_CString( 6150_preacher.IsFemale, 'a', 'o' )] [6150_preacher.GetFirstNameNoTooltip], permaneça e me ensine o caminho!"
 hold_court.6150.c:0 "Absurdo! Queime esse herege delirante!"
 hold_court.6150.d:0 "Leve esse tolo para longe da minha vista."
 hold_court.6150.desc:0 "Assim que chega a vez [6150_preacher.GetHerHim] falar, [Select_CString( 6150_preacher.IsFemale, 'a', 'o' )] [6150_preacher.GetWomanMan] agitad[Select_CString( 6150_preacher.IsFemale, 'a', 'o' )] à minha frente grita: \"#EMP O FIM ESTÁ PRÓXIMO!#!\n\n\"Os sinais são claros e estão por toda parte:"
 hold_court.6150.desc_alcohol:0 "renuncie a todos os vícios, começando pelos excessos de álcool e comida!"
 hold_court.6150.desc_buddhism:0 "\n\n\"O tempo de Maitreya chegou!"
 hold_court.6150.desc_burn:0 "queime #EMP todos#! os infiéis!"
 hold_court.6150.desc_celibacy:0 "castidade e pureza! Renuncie às tentações da carne!"
 hold_court.6150.desc_christianism:0 "\n\n\"O Dia do Juízo Final está sobre nós!"
 hold_court.6150.desc_county:0 "o povo de [6150_county.GetName] sabe disso muito bem —"
 hold_court.6150.desc_eating:0 "purifique seu coração ao purificar seu corpo! A salvação não pode ser alcançada com um estômago pesado!"
 hold_court.6150.desc_end:0 "\n\n\"Arrependa-se agora!! Pois o dia está próximo!!\""
 hold_court.6150.desc_fallback:0 "violência, corrupção, vícios — os fiéis esqueceram [ROOT.GetCharacter.GetFaith.HighGodName]!"
 hold_court.6150.desc_flagellant:0 "mortifique a carne e derrame sangue por sua salvação!"
 hold_court.6150.desc_germanic:0 "\n\n\"Ragnarök está sobre nós!"
 hold_court.6150.desc_hinduism:0 "\n\n\"Kalki está chegando!"
 hold_court.6150.desc_infidels:0 "os infiéis estão em toda parte, minando-nos tanto além das fronteiras quanto dentro de nosso próprio reino!"
 hold_court.6150.desc_islam:0 "\n\n\"O Último Julgamento está chegando!"
 hold_court.6150.desc_judaism:0 "\n\n\"A Guerra de Gog e Magog está sobre nós!"
 hold_court.6150.desc_looting:0 "primeiro de tudo, os bárbaros às nossas portas, saqueando nossas colheitas, matando nosso povo, arrasando nossas cidades e espalhando doença e fome!"
 hold_court.6150.desc_lost_hgw:0 "o que poderia ser mais claro do que os exércitos de [ROOT.GetCharacter.GetFaith.HighGodName] sendo derrotados pelos infiéis?"
 hold_court.6150.desc_monk:0 "as datas e os cálculos todos batem!"
 hold_court.6150.desc_nature:0 "colheitas fracassando, gafanhotos invadindo os campos, frio interminável, enchentes e a Peste caminhando entre nós!"
 hold_court.6150.desc_reclusive:0 "rejeite o mundo e suas tentações!"
 hold_court.6150.desc_religion_fallback:0 "\n\n\"O mundo como o conhecemos está prestes a acabar!"
 hold_court.6150.desc_solution:0 "\n\n\"Há apenas uma maneira de nos salvarmos:"
 hold_court.6150.desc_unsafety:0 "distúrbios, bandidos, ladrões, violência e o desaparecimento da justiça entre os homens!"
 hold_court.6150.desc_visions:0 "raios em um céu claro, pássaros migrando fora de temporada, vozes entoando à noite, cobras falantes!"
 hold_court.6150.desc_zoroastrianism:0 "\n\n\"O Frashokereti começou!"
 hold_court.6150.t:0 "O Fim Está Próximo!"
 hold_court.6160.a:0 "Muito bem — mas você me deve!"
 hold_court.6160.b:0 "Muito bem — agora não lhe devo nada."
 hold_court.6160.c:0 "É o mínimo que eu poderia fazer por você!"
 hold_court.6160.d:0 "Como meu Grande Esmoler ensina, a caridade é o caminho dos piedosos."
 hold_court.6160.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\", começa [6160_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)], com um ar muito contrito, \"o último período foi realmente difícil em meu domínio, despesas extras foram necessárias em todos os aspectos, e meus cofres estão tristemente vazios...\n\n\"Isso me entristece, mas resolvi apelar para sua munificência para me ajudar a pagar minhas dívidas."
 hold_court.6160.desc_fallback:0 "\n\n\"Não esquecerei de sua generosidade em meu momento de necessidade!\""
 hold_court.6160.desc_friend:0 "\n\n\"Em nome dos laços que nos unem, por favor, me ajude!"
 hold_court.6160.desc_hook:0 "\n\n\"Se você fizer isso, considerarei a dívida que me deve paga."
 hold_court.6160.e:0 "Dívida significa má administração. [seneschal.GetFirstNameNoTooltip], ajude [6160_vassal.GetSheHe]!"
 hold_court.6160.f:0 "Desculpe, não tenho dinheiro para ajudar."
 hold_court.6160.t:0 "Cofres Vazios"
 hold_court.6170.a:0 "Que [6170_relative.GetFirstNameNoTooltip] seja libertad[Select_CString( 6170_relative.IsFemale, 'a', 'o' )]!"
 hold_court.6170.b:0 "[6170_rival.GetFirstNameNoTooltip] deve ter tido uma boa razão para aprisionar [6170_relative.GetSheHe]."
 hold_court.6170.c:0 "Concederei apenas uma pequena misericórdia a [6170_relative.GetSheHe]."
 hold_court.6170.d:0 "Corte-lhe a cabeça, acabe com o problema!"
 hold_court.6170.desc:0 "[6170_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] está diante de mim, com uma expressão preocupada em seu rosto. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], venho em nome de [6170_relative.Custom2('MyCharacterIntroduction', 6170_vassal)].\n\n\"[6170_relative.GetSheHe|U] foi ignobilmente aprisionad[Select_CString( 6170_relative.IsFemale, 'a', 'o' )] por [6170_rival.Custom2('YourCharacterIntroduction', 6170_vassal)] por motivos triviais e absurdos. Meu coração sangra pelas condições miseráveis que m[Select_CString( 6170_relative.IsFemale, 'inha', 'eu' )] pobre [6170_vassal.Custom2('RelationToMe', SCOPE.sC('6170_relative'))] deve suportar...\n\n\"Por favor, mostre misericórdia a [6170_relative.GetSheHe] e ordene que [6170_relative.GetSheHe] seja libertad[Select_CString( 6170_relative.IsFemale, 'a', 'o' )]!\""
 hold_court.6170.e:0 "Sinceramente, não me importo com suas disputas."
 hold_court.6170.t:0 "Prisão Ignóbil"
 hold_court.6190.a:0 "Estudar o corpo humano é uma triste necessidade."
 hold_court.6190.b:0 "Por que você não me convidou, [physician.GetFirstNameNoTooltip]?!"
 hold_court.6190.c:0 "Corpos frescos — #EMP vivos#! — são melhores como cobaias..."
 hold_court.6190.d:0 "#EMP GUARDAS!#! Prendam o ladrão de túmulos!"
 hold_court.6190.desc:0 "[Select_CString( 6190_local.IsFemale, 'A', 'O' )] [6190_local.GetWomanMan] que se aproxima do meu trono é claramente um[Select_CString( 6190_local.IsFemale, 'a', '' )] pleb[Select_CString( 6190_local.IsFemale, 'éia', 'eu' )]. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [6190_local.GetSheHe] começa o discurso, \"represento a comunidade local de [capital.GetNameNoTooltip].\"\n\n\"Nos últimos meses, nossos cemitérios têm sido assolados pelo desaparecimento de corpos! Todos foram desenterrados e não deixaram rastros. No início, temíamos animais selvagens ou forças obscuras em ação, mas então seu próprio $court_physician_court_position$ [physician.GetTitledFirstName] foi pego em flagrante levando os mortos para suas experiências!\n\n\"Por favor, ponha um fim a essa blasfêmia!\""
 hold_court.6190.e:0 "[physician.GetFirstNameNoTooltip], apenas pare com isso."
 hold_court.6190.t:0 "Uma Sombra na Noite"
 hold_court.6210.a:0 "[steward.GetFirstNameNoTooltip], mostre a eles nossos costumes."
 hold_court.6210.b.tt:0 "Você envia o seu $royal_architect_court_position$ para desenvolver a infraestrutura dos condados."
 hold_court.6210.b:0 "Vamos mostrar a eles nossa grandeza, eles mudarão de ideia!"
 hold_court.6210.c:0 "Respeitamos as tradições de todos os nossos súditos."
 hold_court.6210.d:0 "Contanto que paguem seus impostos, eu não me importo."
 hold_court.6210.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], lamento informar que estou no meu limite!\" [6210_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] está claramente exasperado.\n\n\"As pessoas sobre as quais devo governar estão além do meu entendimento, com costumes ridículos e um #EMP péssimo#! gosto por comida! Todos os meus esforços até agora foram em vão — parece impossível transformar bons servos a partir delas.\n\n\"Receio que uma forte intervenção de cima seja a única solução disponível agora.\""
 hold_court.6210.t:0 "Uma Terra de Estrangeiros"
 hold_court.6230.a:0 "Pegue algum ouro e reconstrua."
 hold_court.6230.b.failure.tt:0 "Elefantes em Fúria."
 hold_court.6230.b.failure:0 "Os elefantes continuam em sua fúria."
 hold_court.6230.b.success.tt:0 "Elefantes Domesticados."
 hold_court.6230.b.success:0 "Seus caçadores capturam os elefantes selvagens."
 hold_court.6230.b:0 "Enviarei alguém para deter as feras."
 hold_court.6230.c.success:0 "Seu $master_of_horse_court_position$ captura os elefantes."
 hold_court.6230.c:0 "Elefantes, cavalos, é a mesma coisa... [m_horse.GetFirstNameNoTooltip], resolva isso!"
 hold_court.6230.d:0 "$hinduism_good_god_ganesh$ os guia."
 hold_court.6230.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], um momento da sua atenção, se me permitir...\" [6230_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] fala. \"[6230_province.GetName] tem sofrido com um problema bastante #EMP complicado#! nas últimas semanas...\n\n\"Veja bem, uma manada de elefantes completamente #EMP fora de controle#! tem causado uma verdadeira destruição em todo o condado, deixando um rastro de devastação e, ocasionalmente, morte! Seus poderosos barulhos de trombeta ecoam em nossos ouvidos dia e noite — ainda posso ouvi-los agora mesmo!\" [6230_vassal.GetSheHe] continua a fazer sons indesejáveis de #EMP trombetas#!. \"Por favor, [ROOT.Char.Custom('FormOfAddressForLiege')], envie ajuda!\""
 hold_court.6230.e:0 "Eu não tenho tempo para essa bobagem."
 hold_court.6230.f:0 "Mate todas as feras malditas."
 hold_court.6230.t:0 "Um Problema #EMP Enorme#!"
 hold_court_6040_b_artifact:0 "O livro é uma cópia antiga e preciosa de uma obra-prima!"
 hold_court_6040_b_clueless:0 "Nem mesmo o seu antiquário pode lançar alguma luz sobre as origens e o propósito do livro"
 hold_court_6040_b_fake:0 "O livro é uma falsificação mal feita - sem valor e inútil"
 hold_court_6040_b_generic:0 "O livro é realmente antigo, mas é apenas um [6040_monk.Custom('GetOldBook')]."
 hold_court_6040_c_clueless:0 "A escrita e o conteúdo do livro estão além da sua compreensão"
 protected_from_revocation.tt:0 "Os títulos deste personagem estão protegidos contra revogação."
