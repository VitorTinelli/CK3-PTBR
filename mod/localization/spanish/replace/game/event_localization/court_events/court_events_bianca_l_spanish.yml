l_spanish:
 court.3000.a.tt.failure:0 "[foreign_guest.GetFirstNameNoTooltip] e [Select_CString( family_member.IsFemale, 'a', 'o' )] [family_member.GetFirstNameNoTooltip] ignoram meus desejos e continuam cultivando seu relacionamento"
 court.3000.a.tt.success:0 "O relacionamento entre [Select_CString( foreign_guest.IsFemale, 'a', 'o' )] [foreign_guest.GetFirstNamePossessiveNoTooltip] e [Select_CString( family_member.IsFemale, 'a', 'o' )] [family_member.GetFirstNamePossessiveNoTooltip] permanece o mesmo"
 court.3000.a:0 "Eu #EMP devo#! interromper qualquer coisa que esteja florescendo entre eles."
 court.3000.b.tt.failure:0 "[foreign_guest.GetFirstNameNoTooltip] e [Select_CString( family_member.IsFemale, 'a', 'o' )] [family_member.GetFirstNameNoTooltip] não apreciam minha intromissão"
 court.3000.b.tt.success:0 "O relacionamento entre [Select_CString( foreign_guest.IsFemale, 'a', 'o' )] [foreign_guest.GetFirstNamePossessiveNoTooltip] e [Select_CString( family_member.IsFemale, 'a', 'o' )] [family_member.GetFirstNamePossessiveNoTooltip] se aprofunda e eles apreciam meu apoio"
 court.3000.b:0 "Devo incentivar a ligação deles para garantir que a visita seja agradável."
 court.3000.better_friends_outcome:0 "Os dois podem se tornar os melhores amigos e mais do que isso..."
 court.3000.c.tt.neutral:0 "[foreign_guest.GetFirstNameNoTooltip] e [Select_CString( family_member.IsFemale, 'a', 'o' )] [family_member.GetFirstNameNoTooltip] se aproximam"
 court.3000.c.tt.success:0 "O relacionamento entre [Select_CString( foreign_guest.IsFemale, 'a', 'o' )] [foreign_guest.GetFirstNamePossessiveNoTooltip] e [Select_CString( family_member.IsFemale, 'a', 'o' )] [family_member.GetFirstNamePossessiveNoTooltip] se aprofunda"
 court.3000.c:0 "Seja qual for o relacionamento deles, vou me manter à margem."
 court.3000.d:0 "[foreign_guest.GetFirstNameNoTooltip] não é mais bem-vind[Select_CString( foreign_guest.IsFemale, 'a', 'o' )] na minha corte!"
 court.3000.desc.opening.trustful:0 "Sinto uma pontada aguda de ciúme no peito ao olhar para a fonte de risadas. É um sentimento conhecido por mim, mas não é típico de mim sentir dessa maneira.\n\n"
 court.3000.desc.opening:0 "A ansiedade aperta meu estômago enquanto o ciúme ergue sua cabeça feia. Eu suspiro e encaro a causa da minha miséria.\n\n"
 court.3000.desc:0 "Sei que devo ser grat[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por nosso convidad[Select_CString( foreign_guest.IsFemale, 'a', 'o' )], [foreign_guest.GetTitledFirstName], aparentemente se dar bem com [family_member.GetName], mas há algo na forma como os dois interagem que me preocupa.\n\nSeus sorrisos são do tipo que amigos de longa data - ou amantes devotados - compartilham. Eles agem sem cerimônia como se fossem os únicos na sala, deixando-me excluído de suas conversas. Qual é a natureza do relacionamento deles, e devo fazer algo a respeito?"
 court.3000.friendly_outcome:0 "Os dois podem se tornar amigos ou até mesmo amantes..."
 court.3000.neutral_outcome:0 "O interesse mútuo entre eles diminui para como era antes."
 court.3000.t:0 "Desconfiança da Amizade"
 court.3010.a.tt:0 "Encorajad[Select_CString( inspired_writer.IsFemale, 'a', 'o' )] pelos seus elogios, [inspired_writer.GetFirstNameNoTooltip] pedirá para você ler mais de suas obras no futuro."
 court.3010.a:0 "Meu Deus! Isso é... incrível! Você precisa escrever mais!"
 court.3010.b:0 "Estou preocupad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com sua saúde mental se isso é algo que sua mente criou."
 court.3010.c.depression:0 "Suas palavras feriram profundamente a alma deles"
 court.3010.c.neutral:0 "[inspired_writer.GetFirstNameNoTooltip], talvez a contragosto, aceita seus comentários e pode continuar escrevendo no futuro"
 court.3010.c.stress:0 "O que [inspired_writer.GetSheHe] queria - ou precisava - era encorajamento em vez de feedback"
 court.3010.c:0 "Você definitivamente tem potencial, mas pode melhorar em algumas áreas."
 court.3010.desc.adventurer_or_pilgrim:0 "O foco está em paisagens vastas e cênicas e como elas mudam com o aumento da distância de casa. Também há algumas passagens sobre desejo de viajar e saudades de casa, claramente as experiências do escritor."
 court.3010.desc.ending:0 "\n\nEu limpo a garganta e levanto o olhar do manuscrito, encontrando os olhos expectantes d[Select_CString( inspired_writer.IsFemale, 'a', 'o' )] [inspired_writer.GetFirstNameNoTooltip]."
 court.3010.desc.generic_fallback:0 "O cenário é familiar, assim como o nome do protagonista. Espere. Será que essa é uma tentativa d[Select_CString( inspired_writer.IsFemale, 'a', 'o' )] [inspired_writer.GetFirstNamePossessiveNoTooltip] de escrever uma continuação ou reescrita da obra de outra pessoa?"
 court.3010.desc.low_learning:0 "Toda descrição do protagonista menciona que ele tem 'grandes e belos olhos azuis', e [Select_CString( inspired_writer.IsFemale, 'a', 'o' )] [inspired_writer.GetFirstNameNoTooltip] enfatiza isso até mesmo em situações inapropriadas."
 court.3010.desc.lustful:0 "Cada frase que descreve uma mulher é extremamente detalhada e sempre apresenta palavras como balançando ou saltitando. Mas não são apenas as mulheres, também os homens. No entanto, suas descrições se concentram em seus músculos protuberantes e queixos cinzelados."
 court.3010.desc.opening:0 "\"[ROOT.Char.Custom2('RelationToMeAddress', inspired_writer)|U]!\" [inspired_writer.GetTitledFirstName] se aproxima de mim, segurando firmemente um manuscrito. \"Escrevi uma obra de ficção após ler literatura popular na sua corte. Por favor, aceite a honra de ser a primeira pessoa a ler minhas palavras!\" Eu aceito o manuscrito e dou uma olhada em algumas linhas.\n\n"
 court.3010.desc.sadistic:0 "A violência descrita ultrapassa a tolerância da maioria das pessoas para sangue e obscenidades. Pinta uma cena sangrenta de vermelho, com cavaleiros caminhando em meio ao sangue até os joelhos."
 court.3010.desc.shy_or_chaste:0 "Meus olhos se fixam na descrição de uma cena noturna. Dois amantes entrelaçam delicadamente os dedos mindinhos, pois estão muito tímidos para segurar as mãos. Eles sussurram doces palavras enquanto caminham sob um mar de estrelas infinitas."
 court.3010.t:0 "Obra Inspirada"
 court.3011.a:0 "Isso é adorável! Você deve continuar a escrever mais!"
 court.3011.b.blunt:0 "\"Você vai estagnar se escrever sempre a mesma coisa.\""
 court.3011.b.gregarious:0 "\"Gostaria de vê-l[Select_CString( inspired_writer.IsFemale, 'a', 'o' )] abordar um tópico diferente!\""
 court.3011.c.tt.gain_inspiration:0 "[inspired_writer.GetFirstNameNoTooltip] se sente inspirad[Select_CString( inspired_writer.IsFemale, 'a', 'o' )] para escrever uma obra-prima!"
 court.3011.c.tt.hurt:0 "[inspired_writer.GetFirstNameNoTooltip] se sente magoad[Select_CString( inspired_writer.IsFemale, 'a', 'o' )] com sua falta de apoio."
 court.3011.c.tt.stop:0 "[inspired_writer.GetFirstNameNoTooltip] para de mostrar suas escritas enquanto tenta coisas novas."
 court.3011.c:0 "Terminei de ler seus manuscritos."
 court.3011.desc.adventurer_or_pilgrim:0 "paisagens vastas e cênicas e passagens sobre desejo de viajar."
 court.3011.desc.ending:0 "\n\nÉ evidente que [Select_CString( inspired_writer.IsFemale, 'a', 'o' )] [inspired_writer.GetFirstNameNoTooltip] encontrou sua inspiração."
 court.3011.desc.generic_fallback:0 "releituras e continuações de outras histórias mais famosas."
 court.3011.desc.low_learning:0 "descrições dos 'grandes e belos olhos azuis' do protagonista em situações inapropriadas."
 court.3011.desc.lustful:0 "partes do corpo balançando, saltitando e protuberantes envolvidas nos lençóis da cama."
 court.3011.desc.opening:0 "Ouço passos de alguém se aproximando por trás e me viro para ver [Select_CString( inspired_writer.IsFemale, 'a', 'o' )] [inspired_writer.GetTitledFirstName] parecendo todo animado. \"[ROOT.Char.Custom2('RelationToMeAddress', inspired_writer)|U]!\" [inspired_writer.GetSheHe|U] me chama ansiosamente enquanto [inspired_writer.GetSheHe] reduz a distância entre nós e faz uma reverência rápida. \"Está pronto! Meu primeiro rascunho!\"\n\nO manuscrito é empurrado para as minhas mãos antes que eu possa dizer algo. Um olhar rápido revela"
 court.3011.desc.sadistic:0 "violência, gore e obscenidades."
 court.3011.desc.shy_or_chaste:0 "cenas românticas delicadas, porém irreais, entre dois amantes."
 court.3020.a:0 "Vou garantir que o problema seja resolvido o mais rápido possível."
 court.3020.b.failure:0 "[latrine_steward.GetFirstName] acaba gastando mais dinheiro do que o necessário"
 court.3020.b.success:0 "[latrine_steward.GetFirstName] negocia bem e economiza dinheiro para você"
 court.3020.b:0 "Meu [latrine_steward.GetCouncilTitle] pode cuidar desse assunto."
 court.3020.c.failure:0 "[royal_architect.GetFirstName] não consegue pensar em nada que não custe dinheiro"
 court.3020.c.success:0 "[royal_architect.GetFirstName] consegue criar uma solução sem custos"
 court.3020.c:0 "Certamente meu $royal_architect_court_position$ pode consertar isso sem gastar dinheiro..."
 court.3020.d:0 "Apenas tampe o buraco no chão!"
 court.3020.desc.castle:0 "Castelo de [capital.GetNameNoTooltip]."
 court.3020.desc.city:0 "Prefeitura de [capital.GetNameNoTooltip]."
 court.3020.desc.ending:0 "Enquanto realizávamos uma reunião em uma das salas, todos nós notamos um... cheiro horrível! Deve ter vindo das latrinas um andar abaixo. Peço que considere pagar para consertar as partes negligenciadas do prédio."
 court.3020.desc.opening:0 "\"[ROOT.Char.Custom2('RelationToMeAddress', latrine_chancellor)|U]. Uma palavra, por favor.\"\n\nMeu [latrine_chancellor.GetCouncilTitle], [latrine_chancellor.GetTitledFirstName], se aproxima de mim durante uma breve pausa enquanto trato de assuntos da corte. [latrine_chancellor.GetSheHe|U] faz um gesto para um local menos movimentado na sala, e eu [Select_CString( latrine_chancellor.IsFemale, 'a', 'o' )] sigo até lá.\n\n\"Estou preocupad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com o estado de "
 court.3020.desc.temple:0 "a casa de adoração em [capital.GetNameNoTooltip]."
 court.3020.t:0 "Um Cheiro Desagradável"
 court.3021.a:0 "Instintivamente, estendo a mão para [Select_CString( courtier1.IsFemale, 'a', 'o' )] [courtier1.GetFirstNameNoTooltip]."
 court.3021.b:0 "Eu puxo [Select_CString( courtier2.IsFemale, 'a', 'o' )] [courtier2.GetFirstNameNoTooltip], aterrorizad[Select_CString( courtier2.IsFemale, 'a', 'o' )], para o recanto seguro."
 court.3021.c:0 "Recuo horrorizad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ao ver todos caírem nas latrinas abaixo."
 court.3021.desc:0 "Minha presença foi solicitada para mediar uma discussão entre [Select_CString( courtier1.IsFemale, 'a', 'o' )] [courtier1.GetTitledFirstName] e [Select_CString( courtier2.IsFemale, 'a', 'o' )] [courtier2.GetTitledFirstName]. Meus cortesãos devem estar entediados hoje, pois muitos deles estão aqui para observar.\n\nEnquanto os dois discutem sobre [courtier1.Custom('subject_of_interest')], somos interrompidos por um estrondo ensurdecedor. Todos na sala, exceto eu, cambaleiam quando o chão de madeira visivelmente cede! [ROOT.Char.GetFaith.HighGodName] deve estar me protegendo, pois estou sentad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] em um recanto que não é afetado pelo desastre.\n\nAqueles mais próximos à porta correm para fora, enquanto outros só conseguem gritar enquanto o chão desaba. Meus olhos vão de um para o outro, os dois que estão mais perto de mim."
 court.3021.latrine_disaster:0 "Desastre das Latrinas em [capital.GetNameNoTooltip]"
 court.3021.t:0 "Cuidado embaixo!"
 court.3030.a:0 "Causar um escândalo: \"Como você ousa me tocar?!\""
 court.3030.b:0 "\"Você deveria fazer esses ajustes mais rápido e antes!\""
 court.3030.c:0 "Não digo nada, pois [fussy_liw.GetSheHe] está apenas fazendo o seu trabalho."
 court.3030.d:0 "\"Não há necessidade de ajustes.\""
 court.3030.desc.ending:0 "Não consigo deixar de sentir que [fussy_liw.GetSheHe] está me tratando como uma criança agitada!\n\nEnquanto estou em silêncio, percebo que há espectadores sussurrando entre si e sinto a necessidade de me defender!"
 court.3030.desc.generic:0 "[fussy_liw.GetFirstNameNoTooltip] parece não se importar que estejamos em público enquanto [fussy_liw.GetSheHe] ajusta minha roupa,"
 court.3030.desc.intro:0 "Sempre atenta, minha $lady_in_waiting_court_position$, [fussy_liw.GetFirstName], está aos meus calcanhares para garantir que eu me comporte e me apresente adequadamente na corte.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Por favor, fique parad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por um momento para que eu possa ajustar suas roupas!\"\n\n"
 court.3030.desc.lovers:0 "Instintivamente, me aproximo do toque d[Select_CString( fussy_liw.IsFemale, 'a', 'o' )] [fussy_liw.GetFirstNameNoTooltip], antes de me conter ao percebermos que estamos em público. Embora não seja incomum que m[Select_CString( fussy_liw.IsFemale, 'inha', 'eu' )] querid[Select_CString( fussy_liw.IsFemale, 'a', 'o' )] [fussy_liw.GetFirstNameNoTooltip] seja tão exigente com minha vestimenta,"
 court.3030.t:0 "Exigente com a Moda"
 court.3031.a:0 "Melhore minha posição com meus vassalos das minorias."
 court.3031.b:0 "Fale bem de mim entre os Barões."
 court.3031.c:0 "Desejo estabelecer uma melhor relação com os [reference_county.GetProvince.GetCounty.GetCulture.GetCollectiveNounNoTooltip]."
 court.3031.d:0 "Não me importo com o que os outros pensam."
 court.3031.desc:0 "Enquanto desfruto de um breve momento de calma em minha corte, observando as pessoas silenciosamente, m[Select_CString( liw.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('liw'))] [liw.GetFirstName] se aproxima de mim.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], um momento do seu tempo, por favor?\"\n\n[liw.GetSheHe|U] [liw.Custom('quirk_pos_present')] enquanto aguarda minha permissão. Eu aceno para [liw.GetSheHe] continuar.\n\n\"Em meu trabalho, tenho uma boa impressão do que as pessoas pensam e do que as motiva. Com esse conhecimento, posso tentar suavizar as coisas com um grupo de seu interesse, o que me diz?\""
 court.3031.t:0 "Acalmando as Coisas"
 court.3040.a.tt:0 "Aumentar um [court_amenity|E] aleatório em um nível"
 court.3040.a.tt_2:0 "Nível da Amenidade da Corte Aumentado"
 court.3040.a:0 "Você só está sentindo falta das luxúrias de [homesick_parent.GetCulture.GetNameNoTooltip]!"
 court.3040.b:0 "Você deveria se manter ocupado em vez de lamentar."
 court.3040.c.tt:0 "Um $court_jester_court_position$ da cultura [homesick_parent.GetHerHim] certamente fará [homesick_parent.GetSheHe] rir."
 court.3040.c:0 "Um pouco de humor [homesick_parent.GetCulture.GetNameNoTooltip] ajudará!"
 court.3040.d:0 "Seus sentimentos são seus problemas. Não os traga para a minha corte."
 court.3040.desc:0 "Enquanto faço minhas rondas sociais pela corte, ouço mais um suspiro pesado vindo [Select_CString( homesick_parent.IsFemale, 'da minha', 'do meu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('homesick_parent'))]. Seja intencional ou não, a presença solene d[Select_CString( homesick_parent.IsFemale, 'a', 'o' )] [homesick_parent.GetTitledFirstNamePossessive] não passou despercebida.\n\n\"Oh, olá, meu filho,\" [homesick_parent.GetSheHe] diz depois que o susto inicial passa. Não consigo dizer com certeza se [Select_CString( homesick_parent.IsFemale, 'a', 'o' )] [homesick_parent.GetTitledFirstNameNoTooltip] está sendo melodramático ou sincero. \"Por favor, não me dê atenção. Estou apenas com saudades de casa, só isso...\"\n\nEu nem tenho a chance de responder antes que [homesick_parent.GetSheHe] solte outro suspiro melancólico. Sair sem dizer uma palavra não mudará nada, então decido falar."
 court.3040.t:0 "Minha Saudade d[Select_CString( homesick_parent.IsFemale, 'a', 'o' )] [homesick_parent.GetMotherFather|U]"
 court.3050.a:0 "Lembre o tolo de que eu sei do segredo [target.GetHerHim] para fazê-lo suar."
 court.3050.b:0 "Forje uma carta de rejeição zombando d[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstNameNoTooltip] por sua indesejabilidade."
 court.3050.c:0 "Plante evidências d[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetFirstNameNoTooltip] difamando outra pessoa."
 court.3050.d:0 "Vamos deixar as coisas como estão desta vez."
 court.3050.desc:0 "\"Eu tenho uma sugestão maravilhosa para [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord]\", diz m[Select_CString( chief_eunuch.IsFemale, 'inha', 'eu' )] $chief_eunuch_court_position$, [chief_eunuch.GetFirstName], de maneira conspiratória.\n\n\"Um dos seus detratores, [target.GetTitledFirstName], está presente aqui hoje. Se for de sua vontade, posso redigir uma carta comprometedora em sua pessoa para que possamos ridicularizar [target.GetSheHe] publicamente\".\n\n[chief_eunuch.GetFirstNameNoTooltip] abre um sorriso [chief_eunuch.Custom('quirk_neg_adjective')] enquanto reprimia uma risada. \"Então, o que você quer que eu coloque na carta?\""
 court.3050.t:0 "Carta de Difamação"
 court.3060.a:0 "Eu adoraria ter um companheiro felino!"
 court.3060.b:0 "Por que você não fica com o gato, já que foi você quem o encontrou."
 court.3060.c:0 "Você não pode treinar um dos cães para caçar ratos?"
 court.3060.d:0 "Desta vez, não teremos um gato."
 court.3060.desc:0 "\"Acho que descobri o motivo de alguns dias terem menos ratos que outros!\" M[Select_CString( cat_finder.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('cat_finder'))], [cat_finder.GetTitledFirstName], declara alegremente enquanto [cat_finder.GetSheHe] se afasta para revelar um servo segurando um gato #EMP muito#! descontente.\n\nEle se contorce em uma tentativa de se libertar dos braços arranhados do servo, miando de maneira bastante cativante.\n\n\"Diria que este é um caçador de ratos bem-sucedido! Na verdade, ele estava no meio de uma luta com um rato gordo quando o encontramos! O que você acha, devemos adotar este gato?\""
 court.3060.t:0 "Um Caçador Felino"
 court.3070.a:0 "Talvez eles se lembrem de mim se eu fizer um exemplo com você!"
 court.3070.b:0 "Espalhe a palavra de que eu sou um anfitrião hospitaleiro."
 court.3070.c:0 "Vou exigir um teste obrigatório para os convidados que desejam ficar aqui..."
 court.3070.d:0 "Na verdade, não me importo que todos não saibam quem sou eu."
 court.3070.desc.closing:0 "Eu juro! É só que... a reputação da sua corte é mais comentada do que sua aparência, [ROOT.Char.Custom('FormOfAddressForLiege')]!"
 court.3070.desc.closing_fashion:0 "me cercar das pessoas mais elegantes do reino!"
 court.3070.desc.closing_food:0 "comer como [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]!"
 court.3070.desc.closing_lodging:0 "ficar na hospedagem mais luxuosa do reino!"
 court.3070.desc.closing_servants:0 "ter serviçais para atender a todas as minhas necessidades durante uma breve estadia!"
 court.3070.desc.middle:0 "\n\nPerplex[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], consigo responder: \"Eu sou [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#!...!\"\n\nO sangue some do rosto [court_enjoyer.GetHerHim] e [court_enjoyer.GetSheHe] começa a gaguejar.\n\n\"Peço minhas mais sinceras desculpas, [ROOT.Char.Custom('FormOfAddressForLiege')]! Eu... eu prometo que não estou aqui apenas para aproveitar sua fortuna e "
 court.3070.desc.opening:0 "\"Ah, e você nunca vai acreditar no que aconteceu em seguida!\" M[Select_CString( court_enjoyer.IsFemale, 'inha', 'eu' )] convidad[Select_CString( court_enjoyer.IsFemale, 'a', 'o' )], [court_enjoyer.GetTitledFirstName], não para de falar sobre [court_enjoyer.GetHerselfHimself] e todas as coisas que aconteceram com [court_enjoyer.GetSheHe]. Além do seu falatório interminável, estou incomodad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com esse estranho falando tão informalmente comigo.\n\nTento me desculpar com o convidado, dizendo que tenho outros assuntos e pessoas para atender, mas [court_enjoyer.GetSheHe] me interrompe, perguntando qual é o meu trabalho ou se estou aqui para "
 court.3070.desc.opening_fashion:0 "vestir como [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip] por um dia como todo outro convidado."
 court.3070.desc.opening_food:0 "aproveitar a boa comida como todo outro convidado."
 court.3070.desc.opening_lodging:0 "aproveitar as camas extravagantes como todo outro convidado."
 court.3070.desc.opening_servants:0 "ser tratad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] como [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip] por um dia como todo outro convidado."
 court.3070.t:0 "[Select_CString( ROOT.Char.IsFemale, 'A', 'O' )] [ROOT.Char.GetTitleTierName] Desconhecid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]"
 every_culture_county_3031:0 "Cada [county|E] do [realm|E] da [culture|E] [reference_county.GetCulture.GetName]"
