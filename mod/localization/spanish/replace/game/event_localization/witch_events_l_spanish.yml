l_spanish:
 activity_witch_ritual:0 "Grande Rito"
 activity_witch_ritual_conclusion_desc:0 "O [GetActivityType( 'activity_witch_ritual' ).GetName] foi concluído"
 activity_witch_ritual_desc:0 "Verdadeiros seguidores com o [trait|E] [GetTrait('witch').GetName( GetNullCharacter )] são convidados a celebrar o poder de [GetPlayer.GetFaith.WitchGodName] e mergulhar nas profundezas dos mistérios."
 activity_witch_ritual_destination_selection:0 "Você só pode realizar um $activity_witch_ritual$ em sua [capital|E]."
 activity_witch_ritual_guest_desc:0 "$BULLET_WITH_TAB$Participantes podem ganhar [opinion|E] de personagens presentes\n$BULLET_WITH_TAB$Participantes podem perder [stress_loss_i][stress|E]"
 activity_witch_ritual_guest_help_text:0 "$activity_witch_ritual_desc$"
 activity_witch_ritual_host_desc:0 "$BULLET_WITH_TAB$Pode ganhar Experiência de Estilo de Vida\n$BULLET_WITH_TAB$Participantes podem ganhar [opinion|E] de personagens presentes\n$BULLET_WITH_TAB$Participantes podem perder [stress_loss_i][stress|E]"
 activity_witch_ritual_name:0 "[ACTIVITY.GetOwner.LocalPlayerString( 'Meu ', '' )]Grande Rito[ACTIVITY.GetOwner.LocalPlayerString( '', 'Loc_ES_de_GetShortUIName' )]"
 activity_witch_ritual_owner:0 "Anfitriã"
 activity_witch_ritual_province_both_desc:0 "$activity_witch_ritual_province_capital_desc$ e [domicile|E]"
 activity_witch_ritual_province_capital_desc:0 "Esta é a sua [capital|E]"
 activity_witch_ritual_province_domicile_desc:0 "Este é o seu [domicile|E]"
 activity_witch_ritual_selection_tooltip:0 "Adore [GetPlayer.GetFaith.WitchGodName] e abrace o seu sombrio presente\n\nRecompensas Antecipadas:\n$BULLET_WITH_TAB$[opinion_i] [opinion|E]\n$BULLET_WITH_TAB$[stress_loss_i] Perda de [stress|E]"
 child_witch_conversion_critical_failure_effect.desc:0 "[child.GetFirstNameNoTooltip] revela meu segredo"
 child_witch_conversion_critical_failure_effect.liege.desc:0 "[child.GetFirstNameNoTooltip] revela o guardião da bruxa"
 child_witch_conversion_failure_effect.desc:0 "[child.GetFirstNameNoTooltip] está em dúvida"
 child_witch_conversion_success_effect.desc:0 "[child.GetFirstNameNoTooltip] está convencid[Select_CString( child.IsFemale, 'a', 'o' )]"
 convert_to_witchcraft:0 "$convert_to_witchcraft_key$"
 convert_to_witchcraft_action:0 "Converter"
 convert_to_witchcraft_desc:0 "Eu guiarei [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] pelo caminho de [SCHEME.GetOwner.GetFaith.WitchGodName] e mostrarei a [SCHEME.GetTargetCharacter.GetSheHe] o verdadeiro poder [SCHEME.GetOwner.GetFaith.WitchGodHerHim|U]."
 convert_to_witchcraft_desc_general:0 "Guiar um alvo pelo verdadeiro caminho e mostrar a ele o alcance desse poder."
 convert_to_witchcraft_general_desc:0 "Um esquema para introduzir um alvo na bruxaria na esperança de aumentar o seu covil."
 convert_to_witchcraft_interaction:0 "$convert_to_witchcraft_key$ #weak (Esquema)#!"
 convert_to_witchcraft_interaction_desc:0 "Tentar converter [recipient.GetShortUINameNoTooltip] para os caminhos de [actor.GetFaith.WitchGodName]"
 convert_to_witchcraft_interaction_notification:0 "Converter para Bruxaria"
 convert_to_witchcraft_key:0 "Converter para Bruxaria"
 convert_to_witchcraft_scheme_invalidated_title:0 "@scheme_icon! Esquema de Conversão para Bruxaria Terminado"
 every_grand_rite_participant:0 "Todos os convidados do $activity_witch_ritual$"
 host_witch_ritual:0 "[GetPlayer.GetFaith.WitchGodName] Honrado"
 host_witch_ritual_decision:0 "Realizar Grande Ritual"
 host_witch_ritual_decision_confirm:0 "Que o rito comece!"
 host_witch_ritual_decision_cooldown:0 "Não poderei realizar outro Grande Rito por #N 10 anos#!"
 host_witch_ritual_decision_desc:0 "Nós iremos adorar [ROOT.Char.GetFaith.WitchGodName] e adentrar nos mistérios [ROOT.Char.GetFaith.WitchGodHerHim|U]! O $activity_witch_ritual$ é uma excelente oportunidade para socializar e trocar conhecimento com minhas companheiras bruxas."
 host_witch_ritual_decision_tooltip:0 "Realizar Rito"
 host_witch_ritual_title:0 "Grande Rito"
 reveal_as_witch_interaction:0 "Revelar como Bruxa"
 reveal_as_witch_interaction_desc:0 "Revelar a sua devoção a [actor.GetFaith.WitchGodName] para uma colega [GetTrait('witch').GetName( GetNullCharacter )]"
 witch.1001.message:0 "Indução da Bruxaria"
 witch.1002.a:0 "[child.GetSheHe|U] merece conhecer o poder [ROOT.Char.GetFaith.WitchGodHerHim|U]."
 witch.1002.b:0 "[child.GetFirstNameNoTooltip] é um caso perdido."
 witch.1002.desc:0 "[child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] paira no limbo entre a infância e a idade adulta. Eu ensinei [child.GetSheHe] o suficiente para entender a verdade, e [child.GetSheHe] ainda é jovem o bastante para ter uma mente aberta. Se eu quiser induzir [child.GetSheHe] ao serviço de [ROOT.Char.GetFaith.WitchGodName], é agora ou nunca."
 witch.1002.t:0 "A Era do Conhecimento"
 witch.1003.a:0 "Sim, conte-me tudo! Por favor!"
 witch.1003.b:0 "Não, acho que não..."
 witch.1003.c:0 "Isso é blasfêmia!"
 witch.1003.desc:0 "Há certas coisas que [guardian.Custom2('MyCharacterIntroduction', ROOT.Char)] me contou e que ninguém mais fala. Nunca aprofundamos nesses assuntos, e eu sei melhor do que fazer perguntas. \n\nNo entanto, esta noite, algo parece diferente entre nós. Enquanto nos sentamos para ler, [guardian.GetSheHe] pergunta se há algo que me desperte curiosidade..."
 witch.1003.t:0 "Conhecimento Oculto"
 witch.2001.a.tt:0 "Siga em frente com seu plano de converter [target.GetShortUIName] ao caminho de [owner.GetFaith.WitchGodName]."
 witch.2001.a:0 "[target.GetSheHe|U] merece decidir por si mesm[Select_CString( target.IsFemale, 'a', 'o' )]."
 witch.2001.b1:0 "Os riscos são muito grandes."
 witch.2001.b2:0 "[target.GetFirstNameNoTooltip] não está pront[Select_CString( target.IsFemale, 'a', 'o' )]."
 witch.2001.end.desc:0 "\n\nAgora devo me aproximar [target.GetSheHe] e fazer o convite para a comunhão com [owner.GetFaith.WitchGodSheHe|U] — ou desistir dessa empreitada."
 witch.2001.no_secrecy.desc:0 "Rezo para [owner.GetFaith.WitchGodName] que [target.GetFirstNameNoTooltip] tenha se conectado a algo nessas longas discussões e nos textos sagrados que entreguei a [target.GetSheHe]."
 witch.2001.secrecy.desc:0 "Rezo para [owner.GetFaith.WitchGodName] que [target.GetFirstNameNoTooltip] tenha se conectado a algo em nossas conversas inocentes e nos textos sagrados que deixei nos seus aposentos."
 witch.2001.start.desc:0 "Eu não posso forçar [target.GetFirstName] a enxergar a verdade, mas fiz tudo o que pude para abrir a sua mente."
 witch.2001.t:0 "$convert_to_witch$: A Hora Chegou"
 witch.2002.a:0 "De todo o meu coração!"
 witch.2002.b:0 "Eu não quero ter nada a ver com isso. Desapareça, demônio!"
 witch.2002.c:0 "O mundo saberá do seu pecado, [owner.GetFirstNameNoTooltip]!"
 witch.2002.discovery.desc:0 "Eu reconheceria aquela voz em qualquer lugar. Deve ser [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]."
 witch.2002.end.desc:0 "\n\n\"[owner.GetFaith.WitchGodName|U] oferece a você sua bênção. Você irá aceitá-la?\""
 witch.2002.no_discovery.desc:0 "Eu me sento, subitamente completamente desperto. Procuro pela fonte da voz desconhecida d[Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetWomanMan], mas há apenas sombras."
 witch.2002.start.desc:0 "Ao abrir meus olhos na escuridão, sou imediatamente tomado por uma sensação sombria. Alguém está me observando?\n\n\"Você está pronto para abraçar a verdade, [ROOT.Char.GetFirstNameNoTooltip]?\""
 witch.2002.t:0 "Um Servo de [owner.GetFaith.WitchGodName]"
 witch.2003.a:0 "Bem-vind[Select_CString( target.IsFemale, 'a', 'o' )] à nossa comunhão, [target.Custom('SisterBrother')|U]."
 witch.2003.b.tt:0 "[target.GetShortUIName|U] precisa conhecer o seu [secret|E] para ser convidad[Select_CString( target.IsFemale, 'a', 'o' )] para um $activity_witch_ritual$"
 witch.2003.b:0 "Agora finalmente posso mostrar a [target.GetSheHe] meu verdadeiro eu."
 witch.2003.c:0 "[target.GetSheHe|U] precisa encontrar o próprio caminho."
 witch.2003.desc:0 "Observo a forma adormecida de [target.GetFirstName] enquanto envio uma rápida oração a [owner.GetFaith.WitchGodName]. Assim que a última palavra sussurrada passa pelos meus lábios, [target.GetSheHe] se mexe, como se sua mente subconsciente tivesse esperado por esse momento.\n\nQuando saio das sombras e ofereço [Select_CString( target.IsFemale, 'a', 'ao' )] [target.GetFirstNameNoTooltip] a bênção [owner.GetFaith.WitchGodHerHim|U], não há medo ou hesitação em seus olhos. Não, sua aceitação é completa e faminta."
 witch.2003.message:0 "[Select_CString( owner.IsFemale, 'A bruxa', 'O bruxo' )] revela para mim"
 witch.2003.t:0 "$convert_to_witch$: [Select_CString( target.IsFemale, 'Uma Nova Noviça', 'Um Novo Noviço' )]"
 witch.2004.a:0 "Quarto errado, desculpe!"
 witch.2004.discovered.desc:0 "[target.GetFirstNameNoTooltip] franze os olhos. \"[ROOT.Char.GetFirstNameNoTooltip], é você? '[owner.GetFaith.WitchGodName|U]'? O que é essa bobagem?!"
 witch.2004.not_discovered.desc:0 "[target.GetFirstNameNoTooltip] salta da cama, alcançando algo na mesa de cabeceira. Provavelmente nada bom. \"Eu não quero ter nada a ver com você ou suas mentiras! Desapareça, demônio!\" [target.GetFirstNameNoTooltip] grita, e eu não demoro a obedecer."
 witch.2004.start.desc:0 "[target.GetFirstName] desperta do sono enquanto eu [SelectLocalization( IsLandlessAdventurer(target), 'witch.2004.start_target_laamp', 'witch.2004.start_target_landed')]. \"Quem está aí?\" [target.GetSheHe] pergunta com uma voz trêmula.\n\n\"Meu nome não é relevante. Estou aqui a serviço de [owner.GetFaith.WitchGodName].\"\n\n"
 witch.2004.start_target_laamp:0 "me arrasto para dentro da tenda"
 witch.2004.start_target_landed:0 "entro pela janela"
 witch.2004.t:0 "$convert_to_witch$: Mente Fechada, Coração Frio"
 witch.2005.a.tt:0 "Na verdade, pode ser exatamente o que [target.GetSheHe] está pensando..."
 witch.2005.a:0 "Por favor, não é o que você está pensando!"
 witch.2005.end.desc:0 "[ROOT.Char.GetFirstNameNoTooltip], é você? '[owner.GetFaith.WitchGodName|U]'? [target.GetLiege.Custom2('MyCharacterIntroduction', target)|U] ouvirá falar da sua blasfêmia!\""
 witch.2005.toast:0 "Bruxaria Descoberta"
 witch.2006.a:0 "Ah, você já estava...! Olá, [target.Custom('SisterBrother')|U]!"
 witch.2006.desc:0 "[target.Custom2('MyCharacterIntroduction', ROOT.Char)|U] não está na cama quando eu entro furtivamente pela janela em minha missão de [owner.GetFaith.WitchGodName]. Onde estaria–\n\n\"Quem é aquilo?!\"\n\nEu me viro para encontrar [target.GetTitledFirstName] agachad[Select_CString( target.IsFemale, 'a', 'o' )] sobre um pentagrama desenhado no chão."
 witch.2006.t:0 "$convert_to_witch$: A Revelação"
 witch.2007.a:0 "Não há necessidade disso comigo, #EMP [owner.Custom('SisterBrother')|U]#!!"
 witch.2007.desc:0 "Estou no meio de um ritual noturno em honra a [owner.GetFaith.WitchGodName] quando há um ruído repentino atrás de mim. Um ladrão? Um visitante? Um assassino?!\n\nAo me virar, me deparo com [owner.Custom2('MyCharacterIntroduction', ROOT.Char)], vestid[Select_CString( owner.IsFemale, 'a', 'o' )] com uma capa escura adornada pela marca inconfundível de [owner.GetFaith.WitchGodName] - um traje clássico para conversões."
 witch.2007.t:0 "Aliado Oculto"
 witch.2010.a.tt:0 "Alguém conhece o seu [secret|E]"
 witch.2010.a:0 "Que [ROOT.Char.GetFaith.HighGodName] se dane!"
 witch.2010.message:0 "Segredo Descoberto"
 witch.2010.t:0 "$convert_to_witchcraft_key$: Ouvido"
 witch.2900.a:0 "Nosso número está aumentando!"
 witch.2900.desc:0 "Você tem sido uma inspiração para mim há muito tempo, e eu acho que você merece saber o que tenho escondido do mundo.\n\nEu também sou uma seguidora de [actor.GetFaith.WitchGodName] e uma estudante dos mistérios [actor.GetFaith.WitchGodHerHim|U]. É minha esperança que nossa colaboração traga-nos mais próximas.\n\nQue nossa astuta [actor.GetFaith.WitchGodMistressMaster] cuide de você."
 witch.2900.t:0 "[actor.Custom2('SaudaçãoApropriadaPositiva', ROOT.Char)]"
 witch.2901.a:0 "E que [ROOT.Char.GetFaith.WitchGodSheHe|U] cuide de você!"
 witch.2901.desc:0 "Fico feliz em saber do seu fiel serviço à nossa astuta [ROOT.Char.GetFaith.WitchGodMistressMaster]! Que [ROOT.Char.GetFaith.WitchGodSheHe|U] cuide de você e guie você pelo caminho da verdade."
 witch.2901.t:0 "[recipient.Custom2('SaudaçãoApropriadaPositiva', ROOT.Char)]"
 witch.3001.a:0 "Mal posso esperar!"
 witch.3001.b:0 "Prefiro comer uma tigela de lesmas."
 witch.3001.desc:0 "Chegou a hora do $activity_witch_ritual$ do covil [host.GetHouse.GetBaseNameNoTooltip]. Convido você para adorar [ROOT.Char.GetFaith.WitchGodName] na noite da lua cheia. Juntos, entoaremos o nome [ROOT.Char.GetFaith.WitchGodHerHim|U] e adentraremos nos seus mistérios!"
 witch.3001.t:0 "Querid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.Custom('SisterBrother')|U] [ROOT.Char.GetFirstNameNoTooltip],"
 witch.3002.a:0 "Eles conhecerão a fúria [ROOT.Char.GetFaith.WitchGodHerHim|U]."
 witch.3002.desc:0 "Ninguém aceitou meu convite. Eles não merecem as bênçãos de [ROOT.Char.GetFaith.WitchGodName]!"
 witch.3002.t:0 "Falta de Devoção"
 witch.3003.a:0 "Quanto mais, melhor!"
 witch.3003.b:0 "Você será [Select_CString( new_guest.IsFemale, 'minha convidada', 'meu convidado' )] de honra, [new_guest.GetFirstNameNoTooltip]."
 witch.3003.c:0 "O $activity_witch_ritual$ é um evento privado."
 witch.3003.desc:0 "Enquanto minhas companheiras bruxas chegam a [capital.GetNameNoTooltip], vislumbro um rosto desconhecido.\n\nQuando vou cumprimentar [inviter.Custom2('MyCharacterIntroduction', ROOT.Char)], [inviter.GetSheHe] apresenta [Select_CString( new_guest.IsFemale, 'a estranha', 'o estranho' )] [new_guest.GetWomanMan] como [new_guest.GetFirstName]. Aparentemente, elas são antigas conhecidas, e [inviter.GetFirstNameNoTooltip] pergunta se [new_guest.GetFirstNameNoTooltip] pode se juntar ao nosso rito."
 witch.3003.t:0 "Um Convidado Não Convidado"
 witch.3010.a.great:0 "Minha tradução é impressionante."
 witch.3010.a.poor:0 "Minha tradução é fraca."
 witch.3010.a:0 "Ler de um antigo grimório."
 witch.3010.b.great:0 "Meus truques são espetaculares."
 witch.3010.b.poor:0 "Meus truques são risíveis."
 witch.3010.b:0 "Fazer truques com sons e sombras."
 witch.3010.c.great:0 "Minha improvisação é inspiradora."
 witch.3010.c.poor:0 "Minha improvisação é incoerente."
 witch.3010.c:0 "Contar com meu carisma e improvisar."
 witch.3010.d:0 "Apresentar uma grande oferenda."
 witch.3010.desc:0 "Conforme a lua se ergue nos céus, anunciando a chegada [ROOT.Char.GetFaith.WitchGodHerHim|U], posso sentir meu corpo respondendo às estranhas energias no ar. As silhuetas ao redor da grande fogueira permanecem silenciosas, imóveis. Aguardando pelo que está por vir.\n\nComo anfitriã deste encontro, cabe a mim dar início ao ritual. Eu irei..."
 witch.3010.e.tt:0 "[activity.GetName] continua normalmente."
 witch.3010.e:0 "Recitar as orações tradicionais."
 witch.3010.t:0 "A Lua Cheia se Eleva"
 witch.3014.a.inspiration:0 "A conversa é inspiradora."
 witch.3014.a.knowledge:0 "[herbalist.GetFirstNameNoTooltip] me ensina algo novo."
 witch.3014.a:0 "Experimentar com ervas junto com [herbalist.GetFirstNameNoTooltip]."
 witch.3014.b.diplomacy:0 "encantar."
 witch.3014.b.intrigue:0 "intrigas."
 witch.3014.b.learning:0 "poesia."
 witch.3014.b.martial:0 "estratégia."
 witch.3014.b.start:0 "Pedir [Select_CString( teacher.IsFemale, 'a', 'ao' )] [teacher.GetFirstNameNoTooltip] para me instruir na arte de"
 witch.3014.b.stewardship:0 "comércio."
 witch.3014.c.tt:0 "Você tenta encontrar alguém com um desejo semelhante."
 witch.3014.c:0 "Compartilhar os dons carnais [ROOT.Char.GetFaith.WitchGodHerHim|U] com alguém."
 witch.3014.d.enemy:0 "Nos envolvemos em uma discussão acalorada."
 witch.3014.d.friend:0 "Nos damos bem."
 witch.3014.d.move_in:0 "Nos damos muito bem."
 witch.3014.d:0 "Passar tempo com [Select_CString( new_guest.IsFemale, 'a', 'o' )] [new_guest.Custom('ComplimentAdjective')] [new_guest.GetFirstNameNoTooltip]."
 witch.3014.e:0 "Onde está meu [sex_partner.Custom('LoverPetName')]? Eu anseio pelo toque [sex_partner.GetHerHim]..."
 witch.3014.f:0 "Rir, beber, dançar — desfrutar das suas bênçãos!"
 witch.3014.guest.bad.desc:0 "[host.GetTitledFirstName] nos conduz por uma cerimônia constrangedora. [host.GetSheHe|U] está se esforçando para tornar a noite especial, mas suas tentativas são fracas. Pelo menos a lista de convidados é interessante..."
 witch.3014.guest.end.desc:0 "\n\nAgora que a cerimônia principal terminou, estamos livres para adorar como nos agrada."
 witch.3014.guest.fallback.desc:0 "[host.GetTitledFirstName] nos conduz por uma cerimônia com todas as palavras e gestos corretos. As antigas orações rolam de nossas línguas em um padrão encantador, mas a beleza e o poder que geralmente a acompanham estão diminuídos; [host.GetTitledFirstNameNoTooltip] faz o suficiente, mas algo está faltando, no entanto."
 witch.3014.guest.good.desc:0 "[host.GetTitledFirstName] nos conduz por uma cerimônia espetacular. As antigas orações rolam de nossas línguas em um padrão encantador, cheio de beleza e promessa. Começamos a dançar, construindo em direção a um magnífico clímax. Alcançamos juntos, uivando o nome [ROOT.Char.GetFaith.WitchGodHerHim|U] para a lua como um só."
 witch.3014.guest.start.desc:0 "Na véspera do grande rito, nos reunimos em uma clareira isolada. A grande fogueira aquece nossas costas e o ar está carregado de emoção."
 witch.3014.host.end.desc:0 "\n\nAgora que a cerimônia principal terminou, meus convidados e eu estamos livres para adorar como nos agrada."
 witch.3014.host.fallback.desc:0 "As antigas orações podem não ser elaboradas, mas também não são simples. Curtas e diretas, elas guardam as suas verdades mais sagradas e poderosas. Recitá-las novamente é como cair em um abraço seguro de uma mãe."
 witch.3014.host.great_improvisation.desc:0 "Enquanto lidero a multidão na cerimônia, estudo cuidadosamente suas reações e ajusto minhas palavras de acordo. Em pouco tempo, estou sendo levad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] pela onda de entusiasmo deles, aplausos apaixonados me impulsionando enquanto eu me preparo para um magnífico clímax. Juntos, alcançamos esse clímax, uivando o nome [ROOT.Char.GetFaith.WitchGodHerHim|U] para a lua como um só."
 witch.3014.host.great_translation.desc:0 "As palavras antigas são estranhas, mas falam comigo em um nível instintivo. Elas tecem um padrão encantador, cheio de beleza e promessa. Meus convidados estão completamente enfeitiçados.\n\nAo fechar o grimório com um gesto dramático, seus aplausos ecoam pela clareira."
 witch.3014.host.great_tricks.desc:0 "As bênçãos de [ROOT.Char.GetFaith.WitchGodName] são muitas, e entre elas está saber quando aplicar um pouco de truque. Com a ajuda de alguns espelhos, chifres e assistentes dispostos, eu faço um espetáculo espetacular. O ar está carregado com uma emocionante mistura de medo e empolgação. Não me lembro da última vez que me senti tão viv[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]!"
 witch.3014.host.offering.desc:0 "Todos nós sabemos da predileção [ROOT.Char.GetFaith.WitchGodHerHim|U] por comidas e bebidas suntuosas. As mesas estão repletas de guloseimas açucaradas, barris de vinho, frutas exóticas e tortas cremosas. Juntos, oferecemos o melhor para [ROOT.Char.GetFaith.WitchGodName], antes de nos deliciarmos com o restante."
 witch.3014.host.poor_improvisation.desc:0 "Talvez eu devesse ter me preparado melhor, afinal. Minha improvisação é sem brilho e vagante. Percebo que estou perdendo a multidão, então, no final, recorro a uma oração tradicional. A multidão se dispersa rapidamente assim que termino."
 witch.3014.host.poor_translation.desc:0 "Não importa o quanto eu tente, as palavras antigas não fazem sentido. As expressões dos meus convidados vão de ansiosas a confusas e, por fim, decepcionadas. Antes de fazer ainda mais papel de bobo, improviso um final um pouco menos decepcionante. A multidão se dispersa rapidamente assim que termino."
 witch.3014.host.poor_tricks.desc:0 "Enquanto meus truques funcionaram bem quando eu os pratiquei sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] no meu quarto, parece que meus nervos me traíram esta noite. Ninguém está convencido — até consigo ouvir alguém abafar uma risada lá no fundo da multidão. Antes de me fazer de maior bob[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], improviso um final rápido para a cerimônia."
 witch.3015.a:0 "Vamos adorar juntos."
 witch.3015.b.tt:0 "Você passa a noite sozinho"
 witch.3015.b:0 "Eu... estava procurando por outra pessoa."
 witch.3015.end.desc:0 "Enquanto olho nos olhos [sex_partner.GetHerHim], tudo se encaixa. Esta é a vontade [ROOT.Char.GetFaith.WitchGodHerHim|U]. [sex_partner.GetSheHe|U] me chama para perto..."
 witch.3015.new_guest.desc:0 "Encontro meu novo conhecido, [sex_partner.GetFirstName], perto de um lago iluminado pela lua."
 witch.3015.regular.desc:0 "Encontro [sex_partner.Custom2('MyCharacterIntroduction', ROOT.Char)] perto de um lago iluminado pela lua."
 witch.3015.start.desc:0 "O poder de [ROOT.Char.GetFaith.WitchGodName] pulsa em minhas veias enquanto vago pela floresta. Um coro de suspiros e gemidos me cumprimenta — não sou o único que deseja companhia esta noite.\n\n"
 witch.3015.t:0 "Perto do Lago"
 witch.3016.a:0 "Para sempre."
 witch.3016.b:0 "Eu... Eu não estou pronto para isso."
 witch.3016.end.desc:0 "Uma voz familiar me chama — é [sex_partner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. Ao me virar e encontrar o olhar [sex_partner.GetHerHim], tudo se encaixa. Nós dois... É a vontade [ROOT.Char.GetFaith.WitchGodHerHim|U]. Estamos destinados a ficar juntos."
 witch.3016.t:0 "Os Astros se Alinham"
 witch.3017.a:0 "Quanto esperei por você."
 witch.3017.b:0 "Eu... esqueci algo! Desculpe!"
 witch.3017.end.desc:0 "Não vi para onde [sex_partner.GetFirstName] foi, mas não preciso. Sou atraíd[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por [sex_partner.GetSheHe] como uma bússola para o ferro. Quando encontro [sex_partner.GetSheHe], não há surpresa nos lindos olhos [sex_partner.GetSheHe] — apenas amor e desejo."
 witch.3098.a:0 "Que [ROOT.Char.GetFaith.WitchGodSheHe|U] nos proteja até o próximo $activity_witch_ritual$."
 witch.3098.end.desc:0 "adoramos [ROOT.Char.GetFaith.WitchGodName], compartilhamos conhecimentos sagrados e estabelecemos laços profundos. Minha mente está fervilhando de novas ideias, mas meu corpo precisa desesperadamente descansar. Uma cama quente nunca pareceu tão tentadora."
 witch.3098.start.desc:0 "Eu e meus convidados"
 witch.3098.t:0 "Até a Próxima Vez"
 witch.3099.start.desc:0 "Juntos, nós"
 witch.3099.tt:0 "Você retorna para casa quando o $activity_witch_ritual$ termina"
 witch.4001.a.failure:0 "[annoying_clergy.GetShortUINameNoTooltip] descobre seu plano"
 witch.4001.a.success:0 "Você ridiculariza [annoying_clergy.GetShortUINameNoTooltip]"
 witch.4001.a.tt:0 "[annoying_clergy.GetFaith.HighGodName] não é o único que pode julgar!"
 witch.4001.a:0 "Vou fazer de [annoying_clergy.GetSheHe] o motivo de chacota de [capital.GetNameNoTooltip]!"
 witch.4001.arbitrary.desc:0 "exige que sejamos justos e imparciais."
 witch.4001.arrogant.desc:0 "acha que se orgulhar das próprias conquistas é pecaminoso."
 witch.4001.b.failure:0 "Você não consegue influenciar [annoying_clergy.GetShortUINameNoTooltip]"
 witch.4001.b.neutral.tt:0 "Você pode escolher desistir ou continuar tentando"
 witch.4001.b.neutral:0 "[annoying_clergy.GetShortUINameNoTooltip] está incerto"
 witch.4001.b.success:0 "Você abala a fé de [annoying_clergy.GetShortUINameNoTooltip] em [annoying_clergy.GetFaith.HighGodName]"
 witch.4001.b:0 "[annoying_clergy.GetSheHe|U] não vai saber no que acreditar quando eu terminar com [annoying_clergy.GetSheHe]."
 witch.4001.c:0 "Agir como um piedosozinho covarde vai calar a boca [annoying_clergy.GetHerHim]."
 witch.4001.craven.desc:0 "punirá aqueles que são tímidos e cuidadosos demais."
 witch.4001.deceitful.desc:0 "punirá os mentirosos."
 witch.4001.fallback.desc:0 "punirá os pecadores."
 witch.4001.forgiving.desc:0 "acha que o perdão é fraqueza."
 witch.4001.gluttonous.desc:0 "punirá aqueles que se deleitam com comida e bebida."
 witch.4001.greedy.desc:0 "punirá aqueles que cobiçam riquezas."
 witch.4001.impious.desc:0 "[annoying_clergy.GetFaith.HighGodName] é um bastardo julgador!"
 witch.4001.lustful.desc:0 "punirá prostitutas e fornicadores."
 witch.4001.sadistic.desc:0 "punirá aqueles que são cruéis com os outros."
 witch.4001.start.desc:0 "[annoying_clergy.Custom2('MyCharacterIntroduction', ROOT.Char)|U] está realmente me irritando! Não há um momento em que [annoying_clergy.GetSheHe] não fique resmungando sobre [annoying_clergy.GetFaith.HighGodName] e a sua vontade.\n\n[annoying_clergy.GetSheHe|U] adora especialmente contar a todos como [annoying_clergy.GetFaith.HighGodNameAlternate]"
 witch.4001.t:0 "Julgamento Divino"
 witch.4001.vengeful.desc:0 "nos exige a oferecer a outra face."
 witch.4001.witch.desc:0 "Mas por que eu deveria ouvir [annoying_clergy.GetSheHe], quando [ROOT.Char.GetFaith.WitchGodName] nos acolhe como somos, com todas as nossas falhas? Que vida triste [annoying_clergy.GetFirstNameNoTooltip] deve viver!"
 witch.4001.wrathful.desc:0 "punirá aqueles com mau temperamento."
 witch.4002.a:0 "Bem-feito para el[Select_CString( annoying_clergy.IsFemale, 'a', 'e' )]!"
 witch.4002.arrogant.desc:0 "Embora [annoying_clergy.GetSheHe] tente esconder, eu sei que [annoying_clergy.GetTitledFirstName] se preocupa muito com sua aparência. [annoying_clergy.GetSheHe|U] tem um ungüento que [annoying_clergy.GetSheHe] aplica religiosamente todas as manhãs. Entrei sorrateiramente nos aposentos [annoying_clergy.GetHerHim] e adicionei algumas ervas irritantes a ele. No dia seguinte, o rosto de [annoying_clergy.GetTitledFirstNamePossessiveNoTooltip] estava coberto de erupções cutâneas!"
 witch.4002.craven.desc:0 "Enquanto [annoying_clergy.GetTitledFirstName] estava dormindo, eu coloquei um rato entre os lençóis [annoying_clergy.GetHerHim]. Mal tive tempo de me esconder antes que [annoying_clergy.GetSheHe] acordasse com um grito, jogou [annoying_clergy.GetHerselfHimself] para fora da cama e saiu correndo pela porta, nu como no dia em que nasceu!"
 witch.4002.end.desc:0 "\n\nFoi a única coisa de que meus cortesãos falaram a noite toda. [annoying_clergy.GetFirstNameNoTooltip] nunca vai esquecer disso!"
 witch.4002.gluttonous.desc:0 "[annoying_clergy.GetTitledFirstName] se empanturrou com os bolos drogados que eu enviei para os aposentos [annoying_clergy.GetHerHim]. Em seguida, [annoying_clergy.GetSheHe|U] perambulou pela cidade com geleia e migalhas espalhadas ao redor da boca, antes de cair dormindo nos degraus do [annoying_clergy.GetFaith.HouseOfWorship]!"
 witch.4002.impious.desc:0 "Meu plano estava perfeito!\n\n"
 witch.4002.lustful.desc:0 "Eu escrevi um poema especialmente explícito sobre [lustful_desc.Custom2('MyCharacterIntroduction', ROOT.Char)] e o \"[lustful_desc.Custom('ObjectifiedFeature')]\" [lustful_desc.GetHerHim], forjei a assinatura de [annoying_clergy.GetTitledFirstNamePossessive] e fiz com que entregassem para os aposentos [Select_CString( lustful_desc.IsFemale, 'da', 'do' )] [lustful_desc.GetLadyLord]. [lustful_desc.GetFirstName] não ficou nada satisfeito com a dedicatória, e [lustful_desc.GetSheHe] também não foi discreto sobre isso."
 witch.4002.vengeful.desc:0 "Subornei um funcionário para convencer [annoying_clergy.GetTitledFirstName] de que [vengeful_desc.Custom2('MyCharacterIntroduction', ROOT.Char)] estava insultando [annoying_clergy.GetSheHe] pelas costas. Nos dias seguintes, [annoying_clergy.GetFirstNameNoTooltip] foi incrivelmente rude com [vengeful_desc.GetFirstNameNoTooltip] toda vez que teve a chance. No final, [vengeful_desc.GetFirstNameNoTooltip] confrontou [annoying_clergy.GetSheHe] sobre seu comportamento malicioso. [annoying_clergy.GetFirstNameNoTooltip] não tinha nada a dizer em sua defesa."
 witch.4002.witch.desc:0 "[ROOT.Char.GetFaith.WitchGodName|U] deve ter me ajudado, porque meu plano saiu ainda melhor do que o esperado!\n\n"
 witch.4002.wrathful.desc:0 "Eu acontecer de saber que [annoying_clergy.GetTitledFirstName] é [Select_CString( annoying_clergy.IsFemale, 'uma bêbada malvada', 'um bêbado malvado' )] e que [annoying_clergy.GetSheHe] está um pouco apaixonad[Select_CString( annoying_clergy.IsFemale, 'a', 'o' )] por um dos meus servos. Fiz com que [Select_CString( wrathful_desc.IsFemale, 'a', 'o' )] [wrathful_desc.GetWomanMan] trouxesse uma garrafa de licor muito caro e ainda mais forte para os aposentos de [annoying_clergy.GetTitledFirstNamePossessiveNoTooltip]. Motivad[Select_CString( wrathful_desc.IsFemale, 'a', 'o' )] com a promessa de uma promoção, [wrathful_desc.GetSheHe] fez [annoying_clergy.GetSheHe] beber até ficar bêbad[Select_CString( annoying_clergy.IsFemale, 'a', 'o' )] bem a tempo do [annoying_clergy.Custom('GetReligiousRite')]."
 witch.4003.a:0 "Parto, meu trabalho está concluído."
 witch.4003.b:0 "[annoying_clergy.GetSheHe|U] está pronto para as grandes verdades."
 witch.4003.c:0 "[annoying_clergy.GetSheHe|U] se tornará [Select_CString( annoying_clergy.IsFemale, 'minha discípula', 'meu discípulo' )]!"
 witch.4003.desc:0 "Escondid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] na passagem secreta atrás dos aposentos de [annoying_clergy.GetTitledFirstNamePossessive], ouço com prazer os gemidos e suspiros [annoying_clergy.Custom2('InsultAdjective', ROOT.Char)] d[Select_CString( annoying_clergy.IsFemale, 'a', 'o' )] [annoying_clergy.Custom('WomanManPossessive')]. [annoying_clergy.GetSheHe|U] leu o livro que deixei em sua cama - na verdade, [annoying_clergy.GetSheHe] não conseguiu largá-lo.\n\nAs verdades contidas parecem ter tido um impacto significativo na fé [annoying_clergy.GetHerHim]. \"Oh, [annoying_clergy.GetFaith.HighGodNameAlternate]! Preciso de um sinal! Eu acreditei em você, exerci sua vontade na Terra, mas agora... Tudo o que consigo ver são as contradições, as falácias, as... as mentiras!\"\n\nA voz de [annoying_clergy.GetTitledFirstNamePossessiveNoTooltip] se despedaça em soluços incoerentes."
 witch.4004.a:0 "É um esforço valioso!"
 witch.4004.b:0 "Meu tempo é melhor gasto com outras coisas."
 witch.4004.desc:0 "Sob a fachada inocente de perguntas teológicas, plantei dúvidas no coração de [annoying_clergy.GetTitledFirstNamePossessive]. Posso perceber que a fé [annoying_clergy.GetHerHim] está vacilante pelas respostas incertas e pela sombra de preocupação que cai sobre seu rosto quando [annoying_clergy.GetSheHe] pensa que ninguém está olhando.\n\nAinda não estou lá, mas uma última tentativa #EMP deveria#! quebrar [annoying_clergy.GetSheHe]."
 witch.4005.a:0 "[annoying_clergy.GetSheHe|U] não era dign[Select_CString( annoying_clergy.IsFemale, 'a', 'o' )], de qualquer maneira!"
 witch.4005.desc:0 "Deixei um livro de verdades desconfortáveis nos aposentos de [annoying_clergy.GetTitledFirstNamePossessive], mas vi [annoying_clergy.GetSheHe] jogá-lo no fogo depois de ler apenas algumas páginas. O desafio deve ter fortalecido a fé de [annoying_clergy.GetSheHe] - não consigo mais detectar qualquer incerteza em seu coração."
 witch.4010.a:0 "Sorte no amor."
 witch.4010.b:0 "Encanto e tato."
 witch.4010.c:0 "Mente estrategista."
 witch.4010.d:0 "Mente para o dinheiro e a ordem."
 witch.4010.desc:0 "Derramo meus presentes sobre o solo: ervas, leite e mel. Com os olhos fechados e a fumaça picando minhas narinas, eu levanto meus braços em direção à lua.\n\n\"[ROOT.Char.GetFaith.WitchGodMistressMaster|U]! Conhecedora de todas as verdades, [ROOT.Char.GetFaith.WitchGodMotherFather] de todo o poder! Por favor, aceite meus humildes presentes e ofereça-me sua orientação em troca!\"\n\nEu peço a [ROOT.Char.GetFaith.WitchGodName] por..."
 witch.4010.e:0 "A ajuda das sombras."
 witch.4010.f:0 "Sabedoria e sagacidade."
 witch.4010.g:0 "Sorte com a lâmina."
 witch.4010.h:0 "Paz de espírito."
 witch.4010.t:0 "Os Dons [ROOT.Char.GetFaith.WitchGodHerHim|U] São Abundantes"
 witch.4020.a:0 "Sábia [ROOT.Char.GetFaith.WitchGodMistressMaster|U], traga paz e clareza [Select_CString( prayer_witch_1.IsFemale, 'a', 'ao' )] [prayer_witch_1.GetFirstNameNoTooltip]!"
 witch.4020.b:0 "Conceda suas bênçãos [Select_CString( prayer_witch_2.IsFemale, 'a', 'ao' )] [prayer_witch_2.GetFirstNameNoTooltip]!"
 witch.4020.c:0 "[ROOT.Char.GetFaith.WitchGodMotherFather|U] dos segredos, empreste-me seu poder!"
 witch.4020.end.desc:0 "em honra a [ROOT.Char.GetFaith.WitchGodName]. Como anfitriã, é meu dever liderar a oração."
 witch.4020.equinox.desc:0 "um ritual de equinócio"
 witch.4020.full_moon.desc:0 "um ritual de lua cheia"
 witch.4020.new_moon.desc:0 "um ritual de lua nova"
 witch.4020.one_witch.desc:0 "[prayer_witch_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se juntou a mim para"
 witch.4020.solstice.desc:0 "um ritual de solstício"
 witch.4020.t:0 "Tomar ou Dar"
 witch.4020.two_witches.desc:0 "[prayer_witch_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] e [prayer_witch_2.Custom2('MyCharacterIntroduction', ROOT.Char)] se juntaram a mim para"
 witch.4030.b:0 "Conheço um companheiro crente que pagaria uma boa quantia por isso."
 witch.4030.c.failure:0 "[convince_target_1.GetShortUIName|U] queima o livro"
 witch.4030.c.success:0 "[convince_target_1.GetShortUIName|U] está fascinado pelo livro"
 witch.4030.c:0 "Até [convince_target_1.GetTitledFirstNameNoTooltip] será atraído por esses segredos."
 witch.4030.d.failure:0 "[convince_target_2.GetShortUIName|U] queima o livro"
 witch.4030.d.success:0 "[convince_target_2.GetShortUIName|U] está fascinado pelo livro"
 witch.4030.d:0 "[convince_target_2.GetTitledFirstNameNoTooltip] achará isso muito interessante."
 witch.4030.friend.a:0 "Juntos, desvendaremos seus segredos."
 witch.4030.friend.desc:0 "[Select_CString( witch_friend.IsFemale, 'Minha boa', 'Meu bom' )] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('witch_friend'))] [witch_friend.GetTitledFirstName] trouxe-me um livro escrito em algum código estranho, suas capas de couro decoradas com símbolos de nossa [ROOT.Char.GetFaith.WitchGodMistressMaster|U].\n\n[witch_friend.GetSheHe|U] só conseguiu decifrar as primeiras páginas até agora, mas elas são profundamente fascinantes."
 witch.4030.no_friend.a:0 "Desvendarei seus segredos, não importa quanto tempo leve!"
 witch.4030.no_friend.desc:0 "Meus contatos me enviaram um livro escrito em algum código estranho, suas capas de couro decoradas com símbolos de minha [ROOT.Char.GetFaith.WitchGodMistressMaster|U].\n\nAté agora, só consegui decifrar as primeiras páginas, mas são profundamente fascinantes."
 witch.4030.t:0 "Segredos Encadernados em Couro"
 witch.4031.a:0 "Isso mesmo, meu amigo. Aprofunde-se, cada vez mais..."
 witch.4031.end.desc:0 "Quando [convince_target.GetFirstNameNoTooltip] termina de ler as páginas traduzidas, [convince_target.GetSheHe] começa a andar de um lado para o outro. No final, o fascínio do livro parece impossível de resistir; [convince_target.GetSheHe] corre de volta para a mesa e pega uma pena."
 witch.4031.start.desc:0 "Tenho uma visão desobstruída do tomo, que deixei entre os pertences de [convince_target.GetTitledFirstNamePossessive], por um buraco de espiada atrás de seu [convince_target.Custom('GetChamber')]. Os olhos [convince_target.GetHerHim] são atraídos para ele assim que [convince_target.GetSheHe] cruza o limiar, quase como se o livro possuísse sua própria magia estranha.\n\n"
 witch.4032.a:0 "#EMP Não!#! Que [ROOT.Char.GetFaith.HighGodName] amaldiçoe esse tolo sem coragem!"
 witch.4032.end.desc:0 "[convince_target.GetFirstNameNoTooltip] nem mesmo abre o livro. Um suspiro audível escapa dos lábios [convince_target.GetHerHim] quando [convince_target.GetSheHe] vê os símbolos estranhos, e [convince_target.GetSheHe] o joga no fogo."
 witch.end.2010:0 "\n\nAo abrir a porta do quarto, ouço passos rápidos desaparecendo pelo corredor. Será que alguém estava ouvindo?"
 witch.leave.2010:0 "Depois de transmitir a sabedoria mais essencial [ROOT.Char.GetFaith.WitchGodHerHim|U] para [target.GetFirstName], e dar a [target.GetSheHe] o seu próprio grimório, eu me retiro."
 witch.talk.2010:0 "[target.GetFirstName] e eu conversamos sobre [owner.GetFaith.WitchGodName] e a sua vontade por muitas horas. Quando o céu sutilmente muda para azul no horizonte, nos despedimos."
 witch_4001_corruption_success_effect.tt:0 "Você pode [blackmail|E] [annoying_clergy.GetShortUIName] sobre seu [secret|E]"
 witch_ritual_phase:0 "Ritual Sombrio"
 witch_ritual_phase_desc:0 "Dedique-se a [GetPlayer.GetFaith.WitchGodName]"
 worship_devil_intent:0 "Adorar [GetPlayer.GetFaith.WitchGodName]"
 worship_devil_intent_desc:0 "Dedique-se ao ser oculto. No corpo. Na mente."
