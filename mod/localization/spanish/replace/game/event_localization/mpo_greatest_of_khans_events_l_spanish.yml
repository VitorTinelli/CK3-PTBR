 mpo_great_war_of_defiance_cb:0 "Grande Guerra do Desafiante"
 mpo_greatest_of_khans.0001.a:0 "Eu terei o mundo."
 mpo_greatest_of_khans.0001.desc:0 "Nos Céus há muitas grandes luzes. Nos Céus, o sol, a lua e as estrelas. Mas na terra, só pode haver um Cã.\n\nEu, [ROOT.Char.GetFirstName], sou esse Cã — o Maior de Todos os Cãs.\n\nApós minha vitória sobre as serpentes que se enrolaram aos meus pés, ninguém ousa falar contra mim no Kurultai de todas as tribos. Ansiosos, seus chefes se submetem e dão seus juramentos, famintos pela conquista do universo.\n\nOs primeiros raios do sol da manhã rompem o horizonte. Eu monto meu cavalo, e todos os exércitos de [ROOT.Char.GetPrimaryTitle.GetNameNoTier] rugem."
 mpo_greatest_of_khans.0001.mongol_invasion_cb:0 "Eu posso usar o [mongol_invasion_casus_belli|E]"
 mpo_greatest_of_khans.0001.t:0 "Meu Kurultai Fala — Para Todo o Mundo!"
 mpo_greatest_of_khans.0002.a:0 "Tudo pertence a [genghis_khan.GetTitledFirstNameNoTooltip]."
 mpo_greatest_of_khans.0002.b:0 "Somente juntos podemos nós, chefes, resistir a [genghis_khan.GetFirstNameNoTooltip]."
 mpo_greatest_of_khans.0003.a:0 "Eu sou #EMP $nick_genghis_khan$#!."
 mpo_greatest_of_khans.0003.b:0 "Eu sou #EMP $nick_cengiz_khan$#!."
 mpo_greatest_of_khans.0003.c:0 "#EMP $nick_yekhe_khagan$#!: o Grande."
 mpo_greatest_of_khans.0003.d:0 "#EMP $nick_dort_yonlug_khagan$#!: Mestre das Quatro Direções."
 mpo_greatest_of_khans.0003.desc:0 "Os presságios poderosos são muitos.\n\nCéu e Terra, dizem, estendem as mãos para me proteger. Nos sonhos, nas nuvens de poeira, grandes touros prometem ruína aos meus inimigos. Lindos cavalos castrados e éguas, presentes das tendas do palácio... os anciãos das tribos prometem esses, e muitos mais...\n\nEu preciso de um título digno desse destino."
 mpo_greatest_of_khans.0003.e:0 "#EMP $nick_tengri_khagan$#!: o Nascido do Céu."
 mpo_greatest_of_khans.0003.f:0 "#EMP $nick_xormuzta$#!: celestial, antigo e sábio."
 mpo_greatest_of_khans.0003.g:0 "#EMP $nick_cihangir$#!: Conquistador do Mundo!"
 mpo_greatest_of_khans.0003.h:0 "#EMP $nick_mar_sargis$#!: guiado pelo santo mártir!"
 mpo_greatest_of_khans.0003.i:0 "#EMP $nick_akhshunwar$#!: o Portador do Poder!"
 mpo_greatest_of_khans.0003.j:0 "#EMP Khagan [ROOT.Char.GetCulture.GetNameNoTooltip]#!: o verdadeiro [ROOT.Char.GetCulture.GetNameNoTooltip]."
 mpo_greatest_of_khans.0003.k:0 "Eu terei apenas o meu próprio nome."
 mpo_greatest_of_khans.0003.t:0 "Um Nome para o [ROOT.Char.GetTitleAsNameNoTooltip]"
 mpo_greatest_of_khans.0020_title:0 "[recipient.GetTitledFirstNameNoTooltip] Se Submete"
 mpo_greatest_of_khans.0021.a:0 "[recipient.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] é poupado da espada da minha ira."
 mpo_greatest_of_khans.0021.desc:0 "Eu me submeto. É justo que eu, e todos os soberanos da terra, tema e honre sua grandeza e poder.\n\nSua sombra temível é projetada nas paredes da minha casa, sobre o trono de [recipient.GetPrimaryTitle.GetNameNoTier]. Nunca lhe faltará minha lealdade e tributo."
 mpo_greatest_of_khans.0021.desc_nomad:0 "O destino está com você, e assim também estão os [recipient.GetDomicile.GetCulture.GetCollectiveNoun].\n\nEu [recipient.GetFirstName], te prometo toda a minha força. Com meus melhores cavaleiros, serei empunhado em sua mão direita."
 mpo_greatest_of_khans.0021.opening:0 "Grande [actor.GetTitledFirstNameNoTooltip], Unificador dos Povos Cavaleiros,"
 mpo_greatest_of_khans.0022.a:0 "[recipient.GetPrimaryTitle.GetNameNoTierNoTooltip|U] se afogará em sangue."
 mpo_greatest_of_khans.0022.a_nomadic:0 "O destino de [recipient.GetPrimaryTitle.GetNameNoTierNoTooltip] está selado."
 mpo_greatest_of_khans.0022.desc:0 "Seus emissários cheiravam a cavalo e não ofereciam nada além de ameaças grosseiras ao nobre reino de [recipient.GetPrimaryTitle.GetNameNoTier]. Eu os mandei matar.\n\nSaia das cabanas de pele de seu lar desolado, se desejar, mas fortes muralhas aguardam você aqui."
 mpo_greatest_of_khans.0022.desc_nomad:0 "Será que [recipient.GetWomanMan] — com o sopro de vida ainda n[recipient.GetSheHe] — deixará um inimigo tomar sua aljava? Qual é o valor de sua vida então?\n\nSe eu morrer defendendo meus [recipient.GetDomicile.GetCulture.GetCollectiveNoun], enterrarão minha aljava e arco ao lado dos meus ossos. Mas se #EMP você#! morrer aqui... quebraremos seu arco. Sujaremos seu corpo com as fezes dos animais. Alimentaremos sua carne aos cães."
 mpo_greatest_of_khans.0022.opening:0 "[actor.GetFirstNameNoTooltip], O Maior dos Mestres,"
 mpo_greatest_of_khans.0030.a.flavor:0 "A vida estabelecida é inferior. Ela enfraquece os homens. A maioria dos povos do meu império deve escolher: abandonar suas casas e adotar a vida nômade... ou morrer."
 mpo_greatest_of_khans.0030.a:0 "#EMP Queime! Mate! Expulse!#! Até que todos vivam a vida nômade!"
 mpo_greatest_of_khans.0030.b.flavor:0 "Os grandes impérios administrativos do mundo duraram muito tempo, e sua extensão foi vasta."
 mpo_greatest_of_khans.0030.b:0 "Um estado administrativo, para ordenar firmemente o [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 mpo_greatest_of_khans.0030.c.flavor:0 "Nós, nômades, não somos estranhos a juramentos, e há algo agradável nas palavras feudais de honra..."
 mpo_greatest_of_khans.0030.c:0 "Uma hierarquia feudal, para enraizar o governo [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]."
 mpo_greatest_of_khans.0030.d.flavor:0 "A glória do clã [ROOT.Char.GetHouse.GetName] é a maior... se ficarmos juntos, e organizarmos nossos reinos ao longo das linhas de parentesco."
 mpo_greatest_of_khans.0030.d:0 "Deixe os clãs governarem o que os clãs conquistaram."
 mpo_greatest_of_khans.0030.desc:0 "Em milhares de cidades e vilarejos, guerreiros [ROOT.Char.GetCulture.GetName] desfilam orgulhosamente. Em palácios e grandes salões, a palavra dos meus oficiais é lei. Cada nômade, cada animal, da estepe sabe em seu coração que são governados por mim. E os mestres das terras estabelecidas se curvam aos meus pés.\n\nCom filósofos e líderes militares a meu serviço, tudo pode ser remodelado, e meu [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] dado sua forma eterna..."
 mpo_greatest_of_khans.0030.e.flavor:0 "Pela força, meu povo governa. Que nossos súditos estabelecidos se queixem. As patas dos nossos cavalos os silenciarão."
 mpo_greatest_of_khans.0030.e:0 "Meu [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] é glorioso como é."
 mpo_greatest_of_khans.0030.t:0 "O Eterno [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]"
 mpo_greatest_of_khans.0040.a:0 "Ainda assim... o mundo treme ao meu nome."
 mpo_greatest_of_khans.0040.desc:0 "Nosso grandioso império escorregou do controle de minha família! Não mais podemos reivindicar o favor do Grande Céu Azul sem desafios — não mais podemos convocar hordas para a guerra com o estalo de um chicote.\n\nNos anos vindouros, talvez eu consiga voltar ao meu trono legítimo, como um criminoso envergonhado que escapou de seu [Glossary( 'cangue', 'CANGUE_GLOSS' )]... mas nossa nobre era de conquistas acabou."
 mpo_greatest_of_khans.0040.desc_timed_out:0 "Por décadas, os [ROOT.Char.GetHouse.GetName] governaram nosso império de sangue. As orgulhosas muralhas de nossos inimigos foram destruídas, nossas hordas gordas com o saque. Do topo da montanha mais alta, cantamos as louvações de [ROOT.Char.GetFaith.HighGodName], e ouvimos cem mil vozes clamando nossos nomes em retorno!\n\nMas governamos por tempo demais. Nossas promessas de conquista já não inspiram. Os chefes e senhores brigam como abutres, e vozes surgem para questionar meus mandatos..."
 mpo_greatest_of_khans.0040.t:0 "Desvanecimento do Grande Sonho"
 mpo_greatest_of_khans.0041.a:0 "Não é este conforto o #EMP verdadeiro#! sonho dos nômades?"
 mpo_greatest_of_khans.0041.desc:0 "Dentro das belas paredes da minha [ROOT.Char.Custom('ResidenceBuilding')], dentro do meu [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] de leis, assentamentos e comércio pacífico... ainda assim, os velhos sonhos vêm?\n\nMeu coração ainda canta o destino do Grande Cã, de esmagar todo o mundo sob os cascos dos cavalos?\n\nEste reino [ROOT.Char.GetGovernment.GetAdjective] não se reúne como um só sob o estandarte de crina de cavalo. Não se põe sobre carroças ao meu chamado. Meus [ROOT.Char.Custom('GetFighterTermPlural')] e [ROOT.Char.Custom('GetLocalCommonerTermPlural')] não anseiam, juntos, por conquistar sob o Céu Azul Interminável.\n\nNosso grande sonho de conquista está enfraquecido, mas ainda somos fortes, e somos ricos."
 mpo_greatest_of_khans.0041.t:0 "Ainda Grande, Mas Menos um Cã"
 mpo_greatest_of_khans.0050.a:0 "Talvez eles partam tão rápido quanto chegaram..."
 mpo_greatest_of_khans.0050.desc:0 "[Select_CString( attacker.IsFemale, 'A', 'O' )] Grande [attacker.GetTitleAsName] — [attacker.GetSheHe], cujo destino é esmagar todos os reinos sob os cascos dos cavalos, [attacker.GetSheHe] que queima e devasta — permitirá que você viva, para que possa servir [attacker.GetPrimaryTitle.GetName].\n\n"
 mpo_greatest_of_khans.0050.desc_end:0 "Cão de [defender_primary.GetNameNoTier]: você cuidará do vasto rebanho dos povos de [attacker.GetTitleAsNamePossessiveNoTooltip] e implorará por migalhas ao sabor de sua vontade."
 mpo_greatest_of_khans.0050.desc_reorganized:0 "[Select_CString( attacker.IsFemale, 'A', 'O' )] [attacker.GetTitleAsNameNoTooltip] não tem desejo algum de ouvir sua voz insignificante. Você responderá [Select_CString( liege.IsFemale, 'a', 'ao' )] [liege.GetName]."
 mpo_greatest_of_khans.0050.opening:0 "Sua morte é suspensa por estas palavras."
 mpo_greatest_of_khans.0051.a:0 "Meu suserano falhou... estou perdido."
 mpo_greatest_of_khans.0051.desc:0 "[Select_CString( attacker.IsFemale, 'A', 'O' )] Grande [attacker.GetTitleAsName] — [attacker.GetSheHe], que tomou tudo do seu povo, cujos guerreiros inundam suas terras — ordena o seguinte:\n\nPonham seus rostos cheios de lágrimas contra o vento e cavalgem longe. Digam a todos que encontrarem que o mundo em breve pertencerá às hordas [Select_CString( attacker.IsFemale, 'da', 'do' )] [attacker.GetTitleAsNamePossessiveNoTooltip]."
 mpo_greatest_of_khans.0051.opening:0 "A todos os [defender_primary.GetAdjective] miseráveis,"
 mpo_greatest_of_khans.0101.a.flavor:0 "Mandar minha família para implorar a eles trará alguns para a batalha... à custa de nossa honra."
 mpo_greatest_of_khans.0101.a:0 "E #EMP os covardes?#! Eu os farei cavalgar também!"
 mpo_greatest_of_khans.0101.b.flavor:0 "Eu luto sozinho."
 mpo_greatest_of_khans.0101.b:0 "Salvem-se para as guerras que virão."
 mpo_greatest_of_khans.0101.c:0 "Teremos o mundo — ou morreremos!"
 mpo_greatest_of_khans.0101.desc:0 "\n\n'Todas as tribos sob [ROOT.Char.GetPrimaryTitle.GetName] estão chamadas!' grita m[Select_CString( vassal_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', vassal_1)], [vassal_1.GetTitledFirstName], 'Os valentes montam seus cavalos de guerra! Cavalgamos para onde seus estandartes de cauda de cavalo pegam o vento!'"
 mpo_greatest_of_khans.0101.desc_gok_opponent:0 "[primary_coalition_defender.GetName]. E os exércitos de [gok_opponent.GetPrimaryTitle.GetNameNoTier] se juntam a eles — [gok_opponent.GetTitledFirstName] está desesperado para ver a Grande Estepe dividida!"
 mpo_greatest_of_khans.0101.desc_intro:0 "Incontáveis tribos se levantam para me enfrentar, incitadas à guerra por"
 mpo_greatest_of_khans.0101.desc_primary_attacker:0 "a voz negra e o pesado saco de [primary_coalition_defender.GetName]."
 mpo_greatest_of_khans.0101.desc_sub:0 "\n\nOutros, os fracos e temerosos, rastejaram até [ROOT.Char.GetCapitalLocation.GetName] e se uniram a [big_sub.GetName] em me submeter."
 mpo_greatest_of_khans.0101.t:0 "Guerra pela Terra e Céus"
 mpo_greatest_of_khans.0102.a:0 "#EMP Cã dos Cãs, cavalgo ao seu lado!#!"
 mpo_greatest_of_khans.0102.b:0 "Devemos derrubar [gurkhan_to_gok.GetTitledFirstNameNoTooltip]!"
 mpo_greatest_of_khans.0102.c:0 "[gurkhan_to_gok.GetFirstNameNoTooltip] não pode ser parado. Eu devo me submeter."
 mpo_greatest_of_khans.0102.d:0 "Este conquistador pode ter meu juramento."
 mpo_greatest_of_khans.0102.desc:0 "Cavaleiros com rostos cinzentos e povos arruinados saem da terra brutal de [gurkhan_to_gok.GetPrimaryTitle.GetBaseNameNoTier], todos chorando o mesmo nome - [gurkhan_to_gok.GetName]!\n\n[gurkhan_to_gok.GetSheHe|U], o mais temido dos nômades, agora exige a submissão de todas as tribos. Que eles, unidos sob o estandarte sangrento [gurkhan_to_gok.GetHerHim], sonham em conquistar todo o mundo!\n\nUma vasta coalizão, formada por [primary_coalition_defender.GetName], cavalga em resistência ao orgulho de [gurkhan_to_gok.GetTitledFirstNamePossessiveNoTooltip]... a guerra começou, e a morte é carregada pelo som dos cascos."
 mpo_greatest_of_khans.0102.e:0 "Os céus escurecem com flechas, e o destino escapa da vista..."
 mpo_greatest_of_khans.0102.t:0 "Agarrando o Universo"
 mpo_greatest_of_khans.0103.a:0 "Ainda assim, um dia, um verdadeiro mestre para todos os nômades poderá surgir..."
 mpo_greatest_of_khans.0103.desc:0 "Os povos de [defender.GetFirstNamePossessiveNoTooltip] estão dispersos, perseguidos de pastagem em pastagem pelos aliados de [attacker.GetTitledFirstNamePossessive]. Onde antes havia uma grande ameaça, agora os carniçais brigam."
 mpo_greatest_of_khans.0103.desc_attacker:0 "Eu quebrei o controle do meu inimigo sobre os chefes! Agora, os cães vão se ferir por restos."
 mpo_greatest_of_khans.0103.desc_attackers:0 "Nossa orgulhosa vitória quebrou a vontade dos povos de [defender.GetFirstNamePossessiveNoTooltip], e nós que lutamos juntos nos alegramos! O inimigo de todos nós foi arrastado diante de [attacker.GetName] em desonra."
 mpo_greatest_of_khans.0103.desc_defender:0 "Meus próprios guerreiros desesperados se viraram contra mim, me venderam para [attacker.GetName]. Meus povos desonram minha família, meu sonho, meu nome.\n\nEu não sou um [defender.Custom('GetDaughterSon')] do destino."
 mpo_greatest_of_khans.0103.desc_defender_intro:0 "Eu, o mais poderoso de todos os nômades — o grande tigre da neve que ousou chamar todos os lobos e gatos selvagens para a coleira — fui derrotado, preso em correntes.\n\n[defender.GetFirstName], [defender.GetLadyLord] dos [defender.GetDomicile.GetCulture.GetCollectiveNoun], não será o Maior dos Cãs.\n\nA estepe cai novamente na anarquia."
 mpo_greatest_of_khans.0103.desc_defenders:0 "Curvamo-nos com nossos rostos queimados pelo vento, guardamos nossas cordas de arco desgastadas e amaldiçoamos os falsos presságios que nos fizeram seguir um [defender.GetWomanMan] indigno para a guerra..."
 mpo_greatest_of_khans.0103.desc_intro:0 "O mais poderoso de todos os nômades — o grande tigre da neve que ousou chamar todos os lobos e gatos selvagens para a coleira — foi derrotado, preso em correntes.\n\n[defender.GetFirstName], [defender.GetLadyLord] dos [defender.GetDomicile.GetCulture.GetCollectiveNoun], não será o Maior dos Cãs.\n\nA estepe cai novamente na anarquia."
 mpo_greatest_of_khans.0103.t:0 "O Menor dos Cãs"
 mpo_war_nomad_army_name:0 "Horda [army_culture.GetNameNoTooltip|U]"
 mpo_war_of_defiance_gok_loses_attacker:0 "[defender.GetShortUIName] é aprisionado por você, humilhado, empobrecido e perde todos os [titles|E] de [land|E]. [vassals|E], [counties|E] e [tributaries|E] [defender.GetHerHim] se tornam independentes."
 mpo_war_of_defiance_gok_loses_defender:0 "Você é aprisionado por [attacker.GetShortUIName], e todos os seus [titles|E], [vassals|E] e [tributaries|E] se tornam independentes. A maior parte do seu [herd|E], [prestige|E], [gold|E], [nomadic_authority|E] e [legitimacy|E] é perdida."
 mpo_war_of_defiance_gok_loses_other:0 "[defender.GetShortUIName] é aprisionado por [attacker.GetShortUIName], humilhado, empobrecido e perde todos os [titles|E] de [land|E]. [vassals|E], [counties|E] e [tributaries|E] [defender.GetHerHim] se tornam independentes."
 mpo_war_of_defiance_gok_wins_defender:0 "Os [nomads|E] [Concept('independent', 'Independentes')|E] derrotados se tornam seus [vassals|E] [obedient|E]. Todas as outras [truces|E] com você são removidas. Você se torna [GetTrait('greatest_of_khans').GetName( GetNullCharacter )] e recebe bônus poderosos para a conquista universal."
 mpo_war_of_defiance_gok_wins_other:0 "Os [nomads|E] [Concept('independent', 'Independentes')|E] derrotados se tornam [vassals|E] [obedient|E] de [defender.GetShortUINamePossessive]. Todas as outras [truces|E] com [defender.GetShortUIName] são removidas. [defender.GetShortUIName] se torna [GetTrait('greatest_of_khans').GetName( GetNullCharacter )] e recebe bônus poderosos para a conquista universal."
 mpo_war_of_defiance_gold_herd_tt:0 "Cada #high Atacante#! ganha @herd_icon![herd|E] e @gold_icon![gold|E]"
 msg_great_war_of_defiance_war_invalidated_message:0 "A [war.GetName] não tem propósito: [defender.GetShortUIName] não pode se tornar [GetTrait('greatest_of_khans').GetName( GetNullCharacter )]."
 refused_the_great_khan_opinion:0 "Rejeitou a Misericórdia do Maior dos Cãs"
 tried_to_become_gok_opinion:0 "Tentou se Tornar o Maior dos Cãs"
 war_declared_flavor_mpo_gok:0 "Toda a carne da terra não é para suas mandíbulas famintas. O mundo nunca será seu.\n\nTodos concordamos em negar-lhe poder, para derrubá-lo! Nunca antes você virou as costas ou mostrou a parte traseira do seu cavalo. E assim teremos guerra."
 war_declared_opening_mpo_gok:0 "[ROOT.War.GetActiveCB.GetDefender.GetTitledFirstNameNoTooltip], você cão babão,\n\n"
 will_become_greatest_of_khans_tt:0 "Se torna [GetTrait('greatest_of_khans').GetName( GetNullCharacter )]... e a subjugação do mundo começa"
