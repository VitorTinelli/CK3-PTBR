l_spanish:
 marriage_interaction.0001.a:0 "Um insulto terrível..."
 marriage_interaction.0001.desc.betrothedtobetrothed:0 "nosso noivado."
 marriage_interaction.0001.desc.betrothedtoliege:0 "meu noivado com s[Select_CString( rejected_betrothed.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rejected_betrothed'))], [rejected_betrothed.GetTitledFirstName]."
 marriage_interaction.0001.desc.end:0 "Peço desculpas por qualquer inconveniente que minha decisão possa causar e espero sinceramente que não prejudique as relações entre nossas famílias."
 marriage_interaction.0001.desc.liegetobetrothed:0 "seu noivado com m[Select_CString( rejecting_betrothed.IsFemale, 'inha', 'eu' )] [actor.Custom2('RelationToMe', SCOPE.sC('rejecting_betrothed'))], [rejecting_betrothed.GetTitledFirstName]."
 marriage_interaction.0001.desc.liegetoliege:0 "o noivado entre m[Select_CString( rejecting_betrothed.IsFemale, 'inha', 'eu' )] [actor.Custom2('RelationToMe', SCOPE.sC('rejecting_betrothed'))], [rejecting_betrothed.GetTitledFirstName], e s[Select_CString( rejected_betrothed.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rejected_betrothed'))], [rejected_betrothed.GetTitledFirstName]."
 marriage_interaction.0001.desc.start:0 "Para [ROOT.Char.GetFullName],\n\nApós cuidadosa consideração, decidi romper "
 marriage_interaction.0002.a:0 "Infelizmente."
 marriage_interaction.0002.desc:0 "[Select_CString( rejecting_betrothed.IsFemale, 'A minha', 'Ao meu' )] [actor.Custom2('RelationToMe', SCOPE.sC('rejecting_betrothed'))] [rejecting_betrothed.GetFullName],\n\nCheguei à conclusão de que seu casamento pendente com [rejected_betrothed.GetTitledFirstName] não é do seu melhor interesse nem do interesse de nossa família. Portanto, decidi romper o noivado."
 marriage_interaction.0004.a:0 "Isso é para o melhor."
 marriage_interaction.0004.desc:0 "Os acordos foram feitos e tudo estava em ordem, até que chegou a hora de concluir o casamento. Com ambas as partes aparentemente dispostas a fingir que o acordo nunca foi feito, parece improvável que [betrothed_1.GetTitledFirstName] e [betrothed_2.GetTitledFirstName] se casem algum dia."
 marriage_interaction.0004.t:0 "Um Noivado Abandonado"
 marriage_interaction.0005.a:0 "Quem sabe com quem serei casado agora."
 marriage_interaction.0005.desc:0 "Apesar das negociações e do planejamento cuidadoso, parece que nunca me casarei com [Select_CString( other_betrothed.IsFemale, 'minha noiva', 'meu noivo' )] [other_betrothed.GetTitledFirstName]. Apesar de chegar a hora de cumprir o casamento prometido, nenhuma das partes deu o passo para concluir o acordo."
 marriage_interaction.0005.t:0 "Um Noivado Abandonado"
 marriage_interaction.0006.a:0 "Com quem me casarei, afinal?"
 marriage_interaction.0006.desc:0 "Apesar das negociações e do planejamento cuidadoso, parece que nunca me casarei com [Select_CString( other_betrothed.IsFemale, 'minha noiva', 'meu noivo' )] [other_betrothed.GetTitledFirstName]. Apesar de chegar a hora de cumprir o casamento prometido, nenhuma das partes deu o passo para concluir o acordo."
 marriage_interaction.0006.t:0 "Um Noivado Abandonado"
 marriage_interaction.0008.a:0 "Infelizmente."
 marriage_interaction.0008.desc:0 "[betrothed_clergy.GetTitledFirstName] dedicou sua vida a [betrothed_clergy.GetFaith.HighGodName] - apesar das negociações e do planejamento cuidadoso, parece que [betrothed_clergy.GetSheHe] nunca se casará com [betrothed_2.GetTitledFirstName]."
 marriage_interaction.0008.t:0 "Noivado Rompido por Motivos Religiosos"
 marriage_interaction.0009.a:0 "Infelizmente."
 marriage_interaction.0009.desc:0 "[betrothed_clergy.GetTitledFirstName] dedicou sua vida a [betrothed_clergy.GetFaith.HighGodName] - apesar das negociações e do planejamento cuidadoso, parece que nunca me casarei com [Select_CString( betrothed_clergy.IsFemale, 'minha noiva', 'meu noivo' )]."
 marriage_interaction.0009.desc_clergy:0 "Agora que dediquei minha vida a [betrothed_clergy.GetFaith.HighGodName], sou proibido de me casar e devo deixar [Select_CString( betrothed_2.IsFemale, 'minha noiva', 'meu noivo' )] [betrothed_2.GetTitledFirstName] para trás. Espero que [betrothed_2.GetSheHe] me perdoe."
