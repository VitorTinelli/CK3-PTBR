l_spanish:
 tour_grounds_events.6000.a:0 "A tentação é grande demais..."
 tour_grounds_events.6000.b:0 "\"Eu pensei que você nunca fosse perguntar!\""
 tour_grounds_events.6000.c:0 "Não vou me sujar nessa imundície!"
 tour_grounds_events.6000.desc.one_consort:0 "[stop_host_scope.GetFirstNameNoTooltip] e [Select_CString( orgy_consort_1.IsFemale, 'sua', 'seu' )] [stop_host_scope.Custom2('RelationToMeShort', orgy_consort_1)] parados perigosamente próximos, aparentemente à beira de algo #EMP íntimo#! Velas iluminam suavemente o ambiente e o doce cheiro de lavanda paira no ar.\n\n"
 tour_grounds_events.6000.desc.outro:0 "[Select_CString( stop_host_scope.IsFemale, 'Minha vassala', 'Meu vassalo' )] sorri de maneira irônica e me chama para mais perto."
 tour_grounds_events.6000.desc.three_consorts:0 "[stop_host_scope.GetFirstNameNoTooltip] e suas consorte, [orgy_consort_1.GetFirstNameNoTooltip], [orgy_consort_2.GetFirstNameNoTooltip] e [orgy_consort_3.GetFirstNameNoTooltip], parados perigosamente próximos, aparentemente à beira de algo #EMP íntimo#!\n\n"
 tour_grounds_events.6000.desc:0 "Ficar com os vassalos e ter uma mudança de cenário tem sido agradável, mas a constante mudança de layout está se tornando cada vez mais confusa. Quando estou sozinho, raramente sei onde procurar por necessidades comuns... como encontrar um lanche da meia-noite.\n\nTentando desajeitadamente navegar pelo [stop_host_scope.Custom('FortifiedBuilding')] [Select_CString( stop_host_scope.IsFemale, 'da', 'do' )] [stop_host_scope.GetTitledFirstName], acidentalmente abro uma porta e me deparo com "
 tour_grounds_events.6000.t:0 "Um Encontro Inesperado"
 tour_grounds_events.6100.a.tt:0 "Você honra piedosamente a memória [Select_CString( tour_grounds_6100_beloved_char.IsFemale, 'da sua', 'do seu' )] [ROOT.Char.Custom2('RelationToMe', tour_grounds_6100_beloved_char)] acendendo uma vela."
 tour_grounds_events.6100.a:0 "Deveria acender uma vela em memória [Select_CString( tour_grounds_6100_beloved_char.IsFemale, 'da minha amada', 'de meu amado' )] [ROOT.Char.Custom2('RelationToMe', tour_grounds_6100_beloved_char)], [tour_grounds_6100_beloved_char.GetFirstNameNoTooltip]."
 tour_grounds_events.6100.b.tt:0 "Você honra a memória [Select_CString( tour_grounds_6100_beloved_char.IsFemale, 'da sua', 'do seu' )] [ROOT.Char.Custom2('RelationToMe', tour_grounds_6100_beloved_char)] em oração."
 tour_grounds_events.6100.b:0 "Deveria orar por [Select_CString( tour_grounds_6100_beloved_char.IsFemale, 'minha amada', 'meu amado' )] [ROOT.Char.Custom2('RelationToMe', tour_grounds_6100_beloved_char)], [tour_grounds_6100_beloved_char.GetFirstNameNoTooltip]."
 tour_grounds_events.6100.c:0 "\"Como essa maravilha foi construída?\""
 tour_grounds_events.6100.d.failure:0 "[stop_host_scope.GetFirstNameNoTooltip] desaprova seu cinismo."
 tour_grounds_events.6100.d.success:0 "[stop_host_scope.GetFirstNameNoTooltip] não percebe seu cinismo."
 tour_grounds_events.6100.d:0 "Devo tentar fingir interesse o máximo possível."
 tour_grounds_events.6100.desc.cynical:0 "Tenho temido essa excursão planejada durante toda a minha estadia aqui em [tour_grounds_event_location.GetName]. Não tenho uma relação próxima com [ROOT.Char.GetFaith.HighGodName] e não pretendo cultivar uma agora. No entanto, isso parece #EMP impressionante#!.\n\nTalvez eu possa aprender algo com isso, mas preciso pensar em algo para dizer..."
 tour_grounds_events.6100.desc.intro:0 "\"E aqui, meu senhor, está [tour_grounds_event_location.Custom('GetSpecialBuildingNameFromProvince')]!\" [stop_host_scope.GetTitledFirstName] exclama enquanto chegamos ao impressionante [stop_host_scope.Custom('GetFaithGrandTemple')].\n\n"
 tour_grounds_events.6100.desc.zealous:0 "Fico maravilhado com a grandiosidade das obras de [ROOT.Char.faith.HighGodName] no mundo. Este edifício é a divindade manifestada."
 tour_grounds_events.6100.desc:0 "Fico maravilhado com essa construção milagrosa. Os detalhes trabalhados em cada canto são belos e contrastam com a paz sentida no coração. Este é verdadeiramente um lugar especial para adorar [ROOT.Char.GetFaith.HighGodName]."
 tour_grounds_events.6100.t:0 "[tour_grounds_event_location.Custom('GetSpecialBuildingNameFromProvince')]"
 tour_grounds_events.6200.a.tt:0 "Você tenta aumentar a contribuição [Select_CString( stop_host_scope.IsFemale, 'da', 'do' )] [stop_host_scope.GetTitledFirstNameNoTooltip] para o reino."
 tour_grounds_events.6200.a:0 "[stop_host_scope.GetSheHe|U] deveria contribuir mais para o reino!"
 tour_grounds_events.6200.b:0 "\"Devo levar esse conhecimento de volta para [root_capital_scope.GetNameNoTooltip].\""
 tour_grounds_events.6200.c:0 "\"É reconfortante ver meu povo prosperando.\""
 tour_grounds_events.6200.desc.cereal_fields:0 "plantações. \"Nosso povo já não se preocupa mais com a fome ou a escassez."
 tour_grounds_events.6200.desc.hill_farms:0 "fazendas nas colinas. \"Fizemos o nosso melhor para maximizar o espaço limitado para a agricultura nessas colinas, e com grande sucesso, eu diria."
 tour_grounds_events.6200.desc.orchard:0 "pomares. \"Nossas árvores dão cestos e mais cestos de frutas suculentas a cada estação."
 tour_grounds_events.6200.desc.pastures:0 "pastos bem cuidados. Há uma abundância de animais que vagam por essas terras. \"Essas criaturas produzem mais do que sabemos o que fazer!"
 tour_grounds_events.6200.desc.plantations:0 "plantações. \"As tâmaras que produzimos aqui são nosso orgulho e alegria. Elas também são #EMP altamente#! procuradas pelos comerciantes."
 tour_grounds_events.6200.desc:0 "[Select_CString( stop_host_scope.IsFemale, 'Minha vassala', 'Meu vassalo' )], [stop_host_scope.GetTitledFirstName], me levou para ver os "
 tour_grounds_events.6200.outro:0 "Somos verdadeiramente abençoados aqui em [tour_grounds_event_location.GetName],\" diz [stop_host_scope.GetSheHe] com um sorriso satisfeito.\n\nParece que [Select_CString( stop_host_scope.IsFemale, 'minha querida vassala', 'meu querido vassalo' )] tem guardado os segredos de seu sucesso de mim."
 tour_grounds_events.6200.t:0 "Colheita Abundante"
 tour_grounds_events.6201.a.tt:0 "O vassalo concorda com o aumento de impostos."
 tour_grounds_events.6201.a:0 "Um aumento de imposto parece razoável o suficiente..."
 tour_grounds_events.6201.b.tt:0 "O vassalo compartilha os lucros."
 tour_grounds_events.6201.b:0 "Uma parcela única do lucro deve ser suficiente."
 tour_grounds_events.6201.c.tt:0 "O vassalo se recusa a compartilhar os lucros."
 tour_grounds_events.6201.c:0 "Os lucros do meu trabalho me pertencem sozinho!"
 tour_grounds_events.6201.desc:0 "Enquanto mostro [Select_CString( visiting_liege.IsFemale, 'a', 'o' )] [visiting_liege.GetTitledFirstName] ao redor de [tour_grounds_event_location.GetName] e da maravilhosa abundância que produzimos aqui com orgulho, [visiting_liege.GetSheHe] começa a agir distante. Depois de vários minutos de silêncio, [visiting_liege.GetSheHe] finalmente fala:\n\n\"Vejo que você está florescendo aqui e cuidando bem de [tour_grounds_event_location.GetNameNoTooltip]. Acredito que seja hora de revisar nossos acordos. Por sua honra, parte do lucro de suas empresas pertence legitimamente à coroa.\""
 tour_grounds_events.6201.t:0 "$tour_grounds_events.6200.t$"
 tour_grounds_events.6202.a.failure:0 "[stop_host_scope.GetFirstNameNoTooltip] falha."
 tour_grounds_events.6202.a.success:0 "[stop_host_scope.GetFirstNameNoTooltip] tem sucesso."
 tour_grounds_events.6202.a.tt:0 "Você ordena a seu vassalo que capture o ladrão."
 tour_grounds_events.6202.a:0 "\"[stop_host_scope.GetFirstNameNoTooltip]! #EMP Faça algo!#!\""
 tour_grounds_events.6202.b.failure:0 "A criança ladra se perde na multidão."
 tour_grounds_events.6202.b.success:0 "A criança ladra é capturada."
 tour_grounds_events.6202.b:0 "Ninguém rouba de mim!"
 tour_grounds_events.6202.c:0 "Essa criança deve precisar mais do que eu..."
 tour_grounds_events.6202.desc:0 "[stop_host_scope.GetTitledFirstName] e eu estamos passeando tranquilamente pelo porto comercial de [event_location.GetName]. [Select_CString( stop_host_scope.IsFemale, 'Minha vassala', 'Meu vassalo' )] aponta para os diferentes comerciantes que [stop_host_scope.GetSheHe] trouxe para o porto e as belas mercadorias que são vendidas aqui. Enquanto estamos envolvidos em uma conversa proveitosa sobre o comércio marítimo, uma criança passa por mim e corre para a multidão de compradores e marinheiros.\n\nA princípio, considero apenas uma criança que ainda não aprendeu as boas maneiras, mas logo percebo que minha bolsa de ouro... #EMP sumiu!#!"
 tour_grounds_events.6202.t:0 "Mãos Cobiçosas"
 tour_grounds_events.6203.a:0 "Substituir o que foi roubado é a maneira mais fácil."
 tour_grounds_events.6203.b:0 "\"Depois daquele pequeno ladrão!\""
 tour_grounds_events.6203.c:0 "Isso não é meu problema."
 tour_grounds_events.6203.desc:0 "[visiting_liege.GetTitledFirstName] e eu estamos passeando tranquilamente pelo porto comercial de [event_location.GetName]. Eu aponto para os diferentes comerciantes que trouxe para o porto e as belas mercadorias que são vendidas aqui. Enquanto estamos envolvidos em uma conversa proveitosa sobre o comércio marítimo, uma criança passa por meu senhor feudal e corre para a multidão de compradores e marinheiros.\n\nA princípio, [visiting_liege.GetTitledFirstNameNoTooltip] não dá importância, mas logo percebe que a criança roubou o ouro [visiting_liege.GetHerHim].\n\n\"Faça algo sobre isso #EMP imediatamente#!, [ROOT.Char.GetFirstNameNoTooltip]! ele grita, furioso...\""
 tour_grounds_events.6203.t:0 "$tour_grounds_events.6202.t$"
 tour_grounds_events.6203.toast:0 "[stop_host_scope.GetShortUINameNoTooltip] repõe o ouro roubado."
 tour_grounds_events.6204.a:0 "\"Eu pegarei meu ouro e seguirei meu caminho.\""
 tour_grounds_events.6204.b:0 "\"Tenho grandes planos para suas habilidades #EMP...#!\""
 tour_grounds_events.6204.desc.caught_by_liege:0 "Corro rapidamente atrás do pequeno ladrão, derrubando carrinhos e empurrando quem estiver no meu caminho. Estou determinado a recuperar meu ouro roubado, custe o que custar.\n\nMantendo [Select_CString( tiny_thief.IsFemale, 'a', 'o' )] [tiny_thief.Custom('GirlBoy')] à vista, rapidamente me aproximo dela, embora ela possa se esconder rapidamente debaixo das várias mesas dos comerciantes e se movimentar entre a multidão de pessoas.\n\nNo entanto, logo consigo encurralar o pequeno ladrão à beira de um cais. A perseguição acabou."
 tour_grounds_events.6204.desc.caught_by_vassal:0 "Após gritar para [stop_host_scope.GetFirstName] fazer algo em relação a esse pequeno miserável que roubou meu ouro, [stop_host_scope.GetSheHe] sai correndo atrás [tiny_thief.GetHerHim].\n\nVejo [stop_host_scope.GetFirstNameNoTooltip] voltando triunfante com o pequeno ladrão pendurado em seu forte aperto.\n\n\"Peço desculpas, meu senhor. Estou envergonhado que algo assim tenha acontecido com você aqui sob minha proteção. Encontrei [Select_CString( tiny_thief.IsFemale, 'a', 'o' )] [tiny_thief.Custom('GirlBoy')] e também o seu ouro. Trouxe ambos para você para que faça o que desejar.\""
 tour_grounds_events.6204.t:0 "$tour_grounds_events.6202.t$: Capturado"
 tour_grounds_events.6205.a.failure:0 "Ouro roubado perdido para sempre"
 tour_grounds_events.6205.a.success:0 "[stop_host_scope.GetShortUINameNoTooltip|U] repõe o ouro roubado"
 tour_grounds_events.6205.a:0 "Não irei embora sem o meu ouro."
 tour_grounds_events.6205.b.flavor:0 "Você bate em [stop_host_scope.GetFirstNameNoTooltip] por sua insolência."
 tour_grounds_events.6205.b:0 "Um preço deve ser pago..."
 tour_grounds_events.6205.c:0 "Você tem sorte de eu ser do tipo que perdoa."
 tour_grounds_events.6205.desc:0 "Após gritar para [stop_host_scope.GetFirstName] fazer algo em relação a esse pequeno miserável que roubou meu ouro, [stop_host_scope.GetSheHe] sai correndo atrás [tiny_thief.GetHerHim].\n\nVejo [stop_host_scope.GetFirstNameNoTooltip] voltando lentamente, embora o pequeno ladrão não esteja em lugar algum. Com medo nos olhos e as mãos trêmulas, [Select_CString( stop_host_scope.IsFemale, 'minha vassala', 'meu vassalo' )] gagueja:\n\n\"Peço profundas desculpas, meu senhor, mas a criança se perdeu. Nem meus guardas nem eu conseguimos encontrar [tiny_thief.GetSheHe]. Receio que seu ouro tenha desaparecido.\""
 tour_grounds_events.6205.t:0 "$tour_grounds_events.6202.t$: Perdido"
 tour_grounds_events.6300.a.failure:0 "Você perde a luta de treinamento"
 tour_grounds_events.6300.a.success:0 "Você vence a luta de treinamento"
 tour_grounds_events.6300.a:0 "Vou mostrar a eles como é feito."
 tour_grounds_events.6300.b.failure:0 "[tg_6300_stand_in.GetShortUINameNoTooltip|U] perdeu a luta de treinamento"
 tour_grounds_events.6300.b.success:0 "[tg_6300_stand_in.GetShortUINameNoTooltip|U] venceu a luta de treinamento"
 tour_grounds_events.6300.b:0 "Certamente [tg_6300_stand_in.GetFirstNameNoTooltip] forneceria uma melhor instrução!"
 tour_grounds_events.6300.c:0 "Devo recusar educadamente."
 tour_grounds_events.6300.desc:0 "Enquanto [Select_CString( stop_host_scope.IsFemale, 'a', 'o' )] [stop_host_scope.GetTitledFirstName] me mostra [event_location.GetName], chegamos aos campos de treinamento militar. Todos os homens de armas [stop_host_scope.GetHerHim] se reuniram e o ar está cheio de expectativa. [stop_host_scope.GetFirstNameNoTooltip] sorri largamente.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ouvimos tantas histórias sobre sua grande destreza. Eu estaria negligenciando uma oportunidade se não aproveitasse para mostrar a esses soldados como é um verdadeiro combate #EMP! Você gostaria de lutar contra [target_knight.GetFirstName] em prol do reino?\""
 tour_grounds_events.6300.flavor:0 "Você luta contra [target_knight.GetFirstNameNoTooltip] em combate singular."
 tour_grounds_events.6300.t:0 "Uma Chance de se Apresentar"
