l_spanish:
 homage_delivery_inconceivable_liege:0 "O discurso [Select_CString( ROOT.Char.IsFemale, 'da', 'do' )] [ROOT.Char.GetTitledFirstNameNoTooltip] é... interessante. Ele insere linguagem arcaica e palavras pomposas que claramente não têm noção do real significado, dobrando o tamanho do discurso e divertindo meus cortesãos mais instruídos."
 homage_delivery_inconceivable_vassal:0 "Dou o meu melhor, atendendo à ocasião e impressionando a corte com meu vasto vocabulário, mas... a reação não é exatamente o que eu esperava."
 homage_delivery_lisp_liege:0 "O discurso [Select_CString( ROOT.Char.IsFemale, 'da', 'do' )] [ROOT.Char.GetTitledFirstNameNoTooltip] é... memorável. Sua sigmatismo tira um pouco de sua gravidade, enquanto ele navega pelos sons sibilantes, tentando ignorar os risos de meus cortesãos menos generosos."
 homage_delivery_lisp_vassal:0 "Meu discurso é pontuado por risos abafados enquanto tento ao máximo articular as palavras devido ao meu sigmatismo, o que diminui a solenidade da cerimônia e do meu compromisso."
 homage_delivery_slow_liege:0 "O discurso [Select_CString( ROOT.Char.IsFemale, 'da', 'do' )] [ROOT.Char.GetTitledFirstNameNoTooltip] não está bom. Ele perde o fio do pensamento várias vezes, divagando por tangentes e entendendo ou pronunciando erroneamente algumas das palavras mais importantes."
 homage_delivery_slow_vassal:0 "Faço o meu melhor, mas as sobrancelhas levantadas e os olhares do meu senhor feudal e da corte indicam que meus esforços foram mais divertidos do que grandiosos."
 homage_delivery_stutter_liege:0 "[ROOT.Char.GetTitledFirstNameNoTooltip] mal consegue chegar a meio da frase antes que sua gagueira o interrompa. Meus cortesãos, angustiados, observam suas valentes tentativas de superar sua dificuldade com a voz."
 homage_delivery_stutter_vassal:0 "Mal começo o primeiro juramento quando minha gagueira me interrompe. Eventualmente, continuo enquanto a corte observa com risadas e constrangimento, mas o dia é marcado pela minha aflição."
 homage_delivery_wheeze_liege:0 "[ROOT.Char.GetTitledFirstNameNoTooltip] é interessante. Claramente nervoso com o espetáculo e empolgado com sua chegada apressada, ele parece até ter dificuldade para respirar, ofegando entre pausas para ar."
 homage_delivery_wheeze_vassal:0 "Luto para encontrar o fôlego à medida que meu coração acelera, e a pressa para terminar o discurso só piora as coisas. Não é um discurso para ser lembrado."
 pay_homage.0001.a.tt:0 "Você recebe [Select_CString( homage_vassal.IsFemale, 'a', 'o' )] [homage_vassal.GetTitledFirstName]"
 pay_homage.0001.a:0 "Apresente [Select_CString( homage_vassal.IsFemale, 'a', 'o' )] [homage_vassal.GetTitledFirstNameNoTooltip] imediatamente."
 pay_homage.0001.b.tt:0 "Você manda [Select_CString( homage_vassal.IsFemale, 'a', 'o' )] [homage_vassal.GetTitledFirstName] embora."
 pay_homage.0001.b:0 "As reverências [homage_vassal.GetHerHim|U] não significam nada para mim."
 pay_homage.0001.desc.contract:0 "Para marcar o seu domínio e minha fidelidade a você, eu me comprometo com obrigações maiores como seu vassalo."
 pay_homage.0001.desc.gold:0 "Trago ricos presentes dignos da sua majestade, como um símbolo da minha boa vontade e servidão."
 pay_homage.0001.desc.hook:0 "Declaro que farei tudo o que você desejar, [Select_CString( homage_liege.IsFemale, 'minha', 'meu' )] [homage_liege.GetLadyLord]."
 pay_homage.0001.desc.submission:0 "Espero que minha promessa de submissão seja suficiente como prova do meu honor."
 pay_homage.0001.desc:0 "Cheguei em [homage_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] para prestar homenagem a você, [Select_CString( homage_liege.IsFemale, 'gloriosa', 'glorioso' )] [homage_liege.GetTitleAsNameNoTooltip], como uma demonstração da minha lealdade.\n\n"
 pay_homage.0001.opening:0 "[homage_vassal.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 pay_homage.0009.a:0 "Uma afronta!"
 pay_homage.0009.desc:0 "Não sou enganado pelo seu ato [homage_vassal.Custom2('InsultAdjective', SCOPE.sC('homage_liege'))]; uma promessa de homenagem vinda de você não significa nada para mim."
 pay_homage.0009.opening:0 "[homage_liege.Custom2('AppropriateGreeting', ROOT.Char)]"
 pay_homage.0101.desc.clumsy:0 "Enquanto [Select_CString( homage_vassal.IsFemale, 'a', 'o' )] [homage_vassal.GetTitledFirstNameNoTooltip] se levanta, [homage_vassal.GetSheHe] tropeça desajeitadamente. A corte gaspa em uníssono enquanto [homage_vassal.GetSheHe] cai, acabando [Select_CString( homage_vassal.IsFemale, 'esparramada', 'esparramado' )] aos meus pés, com as bochechas coradas de constrangimento."
 pay_homage.0101.desc.contract:0 "[homage_vassal.GetSheHe|U] ajoelha-se em deferência e, entre seus outros juramentos de servir o [homage_liege.GetPrimaryTitle.GetNameNoTooltip], oferece contribuições maiores como um senhor vassalo [Select_CString( homage_liege.IsFemale, 'da', 'do' )] [homage_liege.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 pay_homage.0101.desc.delivery:0 "As coisas não correm bem desde o início. [homage_vassal.Custom('GetHomageDeliveryDescLiege')]"
 pay_homage.0101.desc.gold:0 "[homage_vassal.GetSheHe|U] ajoelha-se em deferência, enquanto os assistentes apresentam os presentes de moedas e objetos preciosos [homage_vassal.GetHerHim]. O juramento é feito, e os escribas registram as promessas [homage_vassal.GetHerHim] de servir o [homage_liege.GetPrimaryTitle.GetNameNoTooltip].\n\n"
 pay_homage.0101.desc.hook:0 "[homage_vassal.GetSheHe|U] ajoelha-se em deferência e, entre seus outros juramentos de servir o [homage_liege.GetPrimaryTitle.GetNameNoTooltip], [homage_vassal.GetHerselfHimself] à minha disposição e em minha dívida.\n\n"
 pay_homage.0101.desc.infatuation:0 "[homage_vassal.GetTitledFirstNameNoTooltip] se levanta, parecendo [Select_CString( homage_vassal.IsFemale, 'desajeitada', 'desajeitado' )]. De canto de olho, percebo [Select_CString( homage_infatuation.IsFemale, 'minha', 'meu' )] [SCOPE.sC('homage_liege').Custom2('RelationToMeShort', SCOPE.sC('homage_infatuation'))] [homage_infatuation.GetFullName] desmaiando, claramente [Select_CString( homage_infatuation.IsFemale, 'apaixonada', 'apaixonado' )] [Select_CString( homage_vassal.IsFemale, 'pela', 'pelo' )] [homage_vassal.GetTitleAsNameNoTooltip]!"
 pay_homage.0101.desc.language:0 "Embora [Select_CString( homage_vassal.IsFemale, 'a', 'o' )] [homage_vassal.GetTitleAsNameNoTooltip] tenha claramente praticado os votos em [homage_liege.GetCourtLanguage.GetNameNoTooltip], [homage_vassal.GetSheHe] pronuncia incorretamente algumas seções, mudando humoristicamente o significado delas e deixando meus cortesãos abafando risadas."
 pay_homage.0101.desc.submission:0 "[homage_vassal.GetSheHe|U] ajoelha-se em deferência, oferecendo apenas o seu juramento de servir fielmente como um vassalo [Select_CString( homage_liege.IsFemale, 'da', 'do' )] [homage_liege.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 pay_homage.0101.desc.success:0 "Finalmente, ordeno que [Select_CString( homage_vassal.IsFemale, 'a', 'o' )] [homage_vassal.GetTitleAsNameNoTooltip] se levante, confirmando minha satisfação e os direitos [Select_CString( homage_vassal.IsFemale, 'da', 'do' )] [homage_vassal.GetFirstNameNoTooltip] sobre as terras que [homage_vassal.GetSheHe] governa em meu lugar."
 pay_homage.0101.desc:0 "Aguardo pacientemente no meu trono pela chegada [Select_CString( homage_vassal.IsFemale, 'da', 'do' )] [homage_vassal.GetTitledFirstName], que logo é anunciado e conduzido diante de mim.\n\n"
 pay_homage.0101.faux_pas.clumsy:0 "\"Seus juramentos são tudo o que importa para mim.\""
 pay_homage.0101.faux_pas.delivery:0 "\"Sua lealdade, não sua língua, é o que importa.\""
 pay_homage.0101.faux_pas.infatuation:0 "\"Ahem... Acho que terminamos por aqui.\""
 pay_homage.0101.faux_pas.language:0 "\"Bom esforço, [homage_vassal.GetFirstNameNoTooltip]; não é uma língua fácil.\""
 pay_homage.0101.insult.clumsy:0 "\"Que desastre.\""
 pay_homage.0101.insult.delivery:0 "\"O que foi isso?\""
 pay_homage.0101.insult.infatuation:0 "\"Como você se atreve? Fora!\""
 pay_homage.0101.insult.language:0 "\"Você tem alguma ideia do que acabou de dizer?\""
 pay_homage.0101.smooth.contract:0 "\"Seus serviços são inestimáveis, [homage_vassal.GetTitledFirstNameNoTooltip].\""
 pay_homage.0101.smooth.gold:0 "\"Aceito seus generosos presentes, [homage_vassal.GetTitledFirstNameNoTooltip].\""
 pay_homage.0101.smooth.hook:0 "\"Fico feliz em saber que posso contar com você, [homage_vassal.GetTitledFirstNameNoTooltip].\""
 pay_homage.0101.smooth.submission:0 "\"Sirva-me bem, [homage_vassal.GetTitledFirstNameNoTooltip].\""
 pay_homage.0101.t.clumsy:0 "$pay_homage_header$ Constrangido"
 pay_homage.0101.t.delivery:0 "$pay_homage_header$ Enrolado"
 pay_homage.0101.t.infatuation:0 "$pay_homage_header$ Objetificado"
 pay_homage.0101.t.language:0 "$pay_homage_header$ Duplo Sentido"
 pay_homage.0101.t:0 "$pay_homage_header$ Ajoelhando-se"
 pay_homage.0201.desc.brush_off:0 "Para minha surpresa, [homage_liege.GetFirstNameNoTooltip] age como se nada tivesse acontecido e aceita minha homenagem com graça.\n\n"
 pay_homage.0201.desc.clumsy:0 "Vou me ajoelhar diante [homage_liege.GetHerHim], mas, na pressa, tropeço desajeitadamente e caio em um monte aos pés [homage_liege.GetHerHim]. Me levanto e faço os juramentos mesmo assim, minhas bochechas queimando de vergonha diante da corte reunida...\n\n"
 pay_homage.0201.desc.contract:0 "Em seguida, vem meu presente; eu afirmo que aumentarei minhas contribuições [Select_CString( homage_liege.IsFemale, 'a', 'ao' )] [homage_liege.GetPrimaryTitle.GetTierAsNameNoTooltip] como sinal de minha lealdade e pelo bem da coroa.\n\n"
 pay_homage.0201.desc.delivery:0 "Ajoelho-me diante [homage_liege.GetHerHim] e começo a proferir os juramentos, mas as coisas rapidamente se desintegram. [homage_vassal.Custom('GetHomageDeliveryDescVassal')]\n\n"
 pay_homage.0201.desc.gold:0 "Em seguida, meus assistentes apresentam meus ricos presentes [Select_CString( homage_liege.IsFemale, 'a', 'ao' )] [homage_liege.GetTitleAsNameNoTooltip] diante da corte reunida.\n\n"
 pay_homage.0201.desc.hook:0 "Em seguida, vem minha promessa de que [homage_liege.GetSheHe] pode contar comigo para qualquer favor, como um apoiador leal [Select_CString( homage_liege.IsFemale, 'da', 'do' )] [homage_liege.GetTitleAsNameNoTooltip] em todas as suas empreitadas.\n\n"
 pay_homage.0201.desc.infatuation:0 "Ajoelho-me diante [homage_liege.GetHerHim] e começo. Enquanto recito os juramentos, cruzo o olhar com [homage_infatuation.GetFullName], [SCOPE.sC('homage_liege').Custom2('RelationToMeShort', SCOPE.sC('homage_infatuation'))] [Select_CString( homage_liege.IsFemale, 'da', 'do' )] [homage_liege.GetFirstNameNoTooltip], que sorri convidativamente, com um piscar de olhos deliberado. Ao olhar de volta para meu senhor feudal, sou [Select_CString( ROOT.Char.IsFemale, 'recebida', 'recebido' )] com o olhar furioso [homage_liege.GetHerHim]! Encerro o discurso, desviando o olhar enquanto a corte murmura seus boatos...\n\n"
 pay_homage.0201.desc.insult_clumsy:0 "[homage_liege.GetFirstNameNoTooltip] sorri amplamente por trás da mão, enquanto a corte lentamente se enche de risadas. Assim serei [Select_CString( ROOT.Char.IsFemale, 'lembrada', 'lembrado' )]..."
 pay_homage.0201.desc.insult_delivery:0 "[homage_liege.GetFirstNameNoTooltip] cai na gargalhada enquanto [homage_liege.GetSheHe] relata partes do meu discurso em detalhes..."
 pay_homage.0201.desc.insult_infatuation:0 "[homage_liege.GetFirstNameNoTooltip] olha [Select_CString( homage_infatuation.IsFemale, 'sua', 'seu' )] [SCOPE.sC('homage_liege').Custom2('RelationToMeShort', SCOPE.sC('homage_infatuation'))] com raiva e me dispensa da câmara sem reconhecimento."
 pay_homage.0201.desc.insult_language:0 "[homage_liege.GetFirstNameNoTooltip] me olha severamente e então irrompe em risadas, imitando meus juramentos pronunciados incorretamente com um sotaque ruim da língua [homage_vassal.GetCulture.GetLanguage.GetNameNoTooltip]..."
 pay_homage.0201.desc.language:0 "Ajoelho-me diante [homage_liege.GetHerHim] e recito os juramentos na língua da corte que pratiquei, mas as risadas abafadas da corte deixam claro que minha língua precisa de mais prática na língua da corte de meu senhor feudal...\n\n"
 pay_homage.0201.desc.outro:0 "[homage_liege.GetFirstNameNoTooltip] me ordena que me levante e confirma sua satisfação, juntamente com meus direitos sobre as terras que governo em seu lugar."
 pay_homage.0201.desc.submission:0 "Com isso, a cerimônia está completa; não tenho nada a oferecer [Select_CString( homage_liege.IsFemale, 'a minha', 'ao meu' )] [homage_liege.GetTitleAsNameNoTooltip], exceto minha promessa de servi-lo fielmente como vassalo [Select_CString( homage_liege.IsFemale, 'da', 'do' )] [homage_liege.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 pay_homage.0201.desc.success:0 "Ajoelho-me aos pés [Select_CString( homage_liege.IsFemale, 'da minha', 'do meu' )] [homage_liege.GetLadyLord] e faço os muitos juramentos de homenagem, enquanto os escribas [homage_liege.GetHerHim] registram o evento.\n\n"
 pay_homage.0201.desc:0 "Servos me conduzem ao grande salão [Select_CString( homage_liege.IsFemale, 'da', 'do' )] [homage_liege.GetTitledFirstNamePossessiveRegnal] em [homage_liege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], onde [homage_liege.GetSheHe] se senta em seu trono, aguardando ouvir meu juramento.\n\n"
 pay_homage.0201.faux_pas:0 "Afinal, um senhor feudal justo."
 pay_homage.0201.insult:0 "Eu nunca deveria ter vindo."
 pay_homage.0201.smooth.contract:0 "Os fardos do serviço..."
 pay_homage.0201.smooth.gold:0 "O preço da lealdade..."
 pay_homage.0201.smooth.hook:0 "Esperemos que seja um favor pequeno..."
 pay_homage.0201.smooth.submission:0 "Salve [Select_CString( homage_liege.IsFemale, 'a', 'o' )] [homage_liege.GetTitleAsNameNoTooltip]."
 pay_homage.0601.a:0 "Hora de repensar as coisas..."
 pay_homage.0601.a_court:0 "Avante, para coisas maiores."
 pay_homage.0601.a_liege:0 "Muito irritante..."
 pay_homage.0601.a_prison:0 "Droga."
 pay_homage.0601.desc.court:0 "Com a minha coroação como [ROOT.Char.GetTitleAsNameNoTooltip] concluída, meus preparativos para prestar homenagem não são mais necessários..."
 pay_homage.0601.desc.imprisoned:0 "$pay_homage.0601_shared_intro$ Fui [Select_CString( ROOT.Char.IsFemale, 'capturada', 'capturado' )] por [ROOT.Char.GetImprisonedBy.GetTitledFirstName]."
 pay_homage.0601.desc.imprisoned_me:0 "$pay_homage.0601_shared_intro$ [ROOT.Char.GetImprisonedBy.GetTitledFirstName] me jogou na prisão."
 pay_homage.0601.desc.liege_dead:0 "$pay_homage.0601_shared_intro$ [homage_liege.GetTitledFirstName] [homage_liege.GetDeathReasonHideKiller]... \n\n"
 pay_homage.0601.desc.liege_dead_me:0 "$pay_homage.0601_shared_intro$ Eu acabei matando [Select_CString( homage_liege.IsFemale, 'a', 'o' )] [homage_liege.GetTitledFirstName]... \n\n"
 pay_homage.0601.desc.liege_imprisoned:0 "$pay_homage.0601_shared_intro$ [homage_liege.GetTitledFirstName] foi [Select_CString( homage_liege.IsFemale, 'capturada', 'capturado' )] [Select_CString( homage_liege.IsFemale, 'pela', 'pelo' )] [homage_liege.GetImprisonedBy.GetTitledFirstName]."
 pay_homage.0601.desc.liege_imprisoned_me:0 "$pay_homage.0601_shared_intro$ Eu acabei capturando [Select_CString( homage_liege.IsFemale, 'a', 'o' )] [homage_liege.GetTitledFirstName]!"
 pay_homage.0601.desc.new_liege:0 "Se eu devo prestar juramento, deve ser direcionado [Select_CString( ROOT.Char.GetLiege.IsFemale, 'a minha nova senhora feudal', 'ao meu novo senhor feudal' )], [ROOT.Char.GetLiege.GetTitledFirstNameRegnal]."
 pay_homage.0601.desc:0 "\n\nIsso certamente muda a situação."
 pay_homage.0601.t:0 "$pay_homage_header$ Invalidado"
 pay_homage.0601_shared_intro:0 "Assim que eu estava dando os toques finais no meu juramento de homenagem,"
 pay_homage_costs_refunded:0 "Custos de $pay_homage_decision$ reembolsados"
 pay_homage_header:0 "Homenagem:"
