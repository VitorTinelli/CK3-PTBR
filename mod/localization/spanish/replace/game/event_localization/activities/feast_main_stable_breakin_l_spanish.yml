l_spanish:
 feast_main_stable_breakin.0002.a:0 "Que grupo de tolos divertidos."
 feast_main_stable_breakin.0002.b:0 "Oh não, pobre animal!"
 feast_main_stable_breakin.0002.breakin_with_deviant:0 "A refeição estava em pleno andamento, e a bebida já tinha ido longe demais quando [Select_CString( breakin_stager.IsFemale, 'a', 'o' )] [breakin_stager.GetTitledFirstName] decidiu que era hora de montar cavalos. Os estábulos estavam trancados com segurança, mas com a orientação [Select_CString( breakin_deviant.IsFemale, 'da', 'do' )] [breakin_deviant.GetTitledFirstName], [breakin_stager.GetFirstName] logo liderou um grupo de cavaleiros ansiosos para dentro.\n\nSem absolutamente nenhum controle sobre os animais, houve xingamentos, risadas e ossos quebrados enquanto homens e mulheres caíam dos cavalos que passeavam pelo salão!"
 feast_main_stable_breakin.0002.breakin_with_helper:0 "Comendo e bebendo já estava um pouco demais quando [Select_CString( breakin_stager.IsFemale, 'a', 'o' )] [breakin_stager.GetTitledFirstName] decidiu que era hora de montar cavalos. Os estábulos estavam trancados com segurança, mas com a orientação [Select_CString( breakin_helper.IsFemale, 'da', 'do' )] [breakin_helper.GetTitledFirstName], [breakin_stager.GetFirstName] logo liderou um grupo de cavaleiros ansiosos para dentro.\n\nSem controle sobre os animais, houve xingamentos, risadas e ossos quebrados enquanto homens e mulheres caíam dos cavalos que passeavam pelo salão!"
 feast_main_stable_breakin.0002.breakin_with_noone:0 "A refeição estava em pleno andamento, e a bebida já tinha ido longe demais quando [Select_CString( breakin_stager.IsFemale, 'a', 'o' )] [breakin_stager.GetTitledFirstName] decidiu que era hora de montar cavalos. Os estábulos estavam trancados com segurança, mas [breakin_stager.GetFirstName] de alguma forma conseguiu levar um grupo de cavaleiros ansiosos para dentro.\n\nSem absolutamente nenhum controle sobre os animais, houve xingamentos, risadas e ossos quebrados enquanto homens e mulheres caíam dos cavalos que passeavam pelo salão!"
 feast_main_stable_breakin.0002.bystander_riding:0 "\n\nOutros animais nos estábulos não escaparam muito melhor, e uma cabra quase cedeu sob o peso [Select_CString( breakin_bystander.IsFemale, 'da', 'do' )] [breakin_bystander.GetTitledFirstName]."
 feast_main_stable_breakin.0002.deviant_discovered:0 "\n\nA noite deu uma reviravolta quando [Select_CString( breakin_deviant.IsFemale, 'a', 'o' )] [breakin_deviant.GetTitledFirstName] foi encontrado nos fundos dos estábulos, envolvido em atos inomináveis com um boi! A mancha da vergonha nunca deixará a alma [breakin_deviant.GetHerHim]."
 feast_main_stable_breakin.0002.secret_of_my_own:0 "Que coisa terrível... terrível de se fazer..."
 feast_main_stable_breakin.0002.t:0 "Domando Cavalos"
 feast_main_stable_breakin.0002.what_a_silly_bunch:0 "\n\nNo final, os tratadores dos estábulos conseguiram controlar os animais assustados, e pelo menos os mais sensatos de nós tiveram um grande espetáculo!"
 feast_main_stable_breakin.0003.a:0 "Tratadores, salvem essas pessoas delas mesmas!"
 feast_main_stable_breakin.0003.b:0 "Você está corrompendo moralmente meus animais!"
 feast_main_stable_breakin.0003.breakin_with_deviant:0 "A refeição já estava bem adiantada, e a bebida um pouco demais, quando [Select_CString( breakin_stager.IsFemale, 'a', 'o' )] [breakin_stager.GetTitledFirstName] decidiu que era hora de montar cavalos. Meus estábulos estavam trancados com segurança, mas com a orientação [Select_CString( breakin_deviant.IsFemale, 'da', 'do' )] [breakin_deviant.GetTitledFirstName], [breakin_stager.GetFirstName] logo liderou um grupo de cavaleiros ansiosos para dentro.\n\nSem absolutamente nenhum controle sobre meus animais, houve xingamentos, risadas e ossos quebrados enquanto homens e mulheres caíam dos cavalos que passeavam pelo salão!"
 feast_main_stable_breakin.0003.breakin_with_helper:0 "A refeição já estava bem adiantada, e a bebida um pouco demais, quando [Select_CString( breakin_stager.IsFemale, 'a', 'o' )] [breakin_stager.GetTitledFirstName] decidiu que era hora de montar cavalos. Meus estábulos estavam trancados com segurança, mas com a orientação [Select_CString( breakin_helper.IsFemale, 'da', 'do' )] [breakin_helper.GetTitledFirstName], [breakin_stager.GetFirstName] logo liderou um grupo de cavaleiros ansiosos para dentro.\n\nSem absolutamente nenhum controle sobre meus animais, houve xingamentos, risadas e ossos quebrados enquanto homens e mulheres caíam dos cavalos que passeavam pelo salão!"
 feast_main_stable_breakin.0003.breakin_with_noone:0 "A refeição já estava bem adiantada, e a bebida um pouco demais, quando [Select_CString( breakin_stager.IsFemale, 'a', 'o' )] [breakin_stager.GetTitledFirstName] decidiu que era hora de montar cavalos. Meus estábulos estavam trancados com segurança, mas [breakin_stager.GetFirstName] de alguma forma conseguiu levar um grupo de cavaleiros ansiosos para dentro.\n\nSem absolutamente nenhum controle sobre meus animais, houve xingamentos, risadas e ossos quebrados enquanto homens e mulheres caíam dos cavalos que passeavam pelo salão!"
 feast_main_stable_breakin.0003.bystander_riding:0 "\n\nOutros animais nos estábulos também não escaparam facilmente, e uma cabra quase cedeu sob o peso [Select_CString( breakin_bystander.IsFemale, 'da', 'do' )] [breakin_bystander.GetTitledFirstName]."
 feast_main_stable_breakin.0003.deviant_discovered:0 "\nA noite deu uma reviravolta quando [Select_CString( breakin_deviant.IsFemale, 'a', 'o' )] [breakin_deviant.GetTitledFirstName] foi encontrado nos fundos dos estábulos, envolvido em atos inomináveis com um dos meus bois!\nA mancha da vergonha nunca deixará a alma [breakin_deviant.GetHerHim]."
 feast_main_stable_breakin.0003.secret_of_my_own:0 "Meu querido Samson! Com [breakin_deviant.GetFirstName]?!"
 feast_main_stable_breakin.0003.t:0 "$feast_main_stable_breakin.0002.t$"
 feast_main_stable_breakin.0003.what_a_silly_bunch:0 "\n\nNo final, os tratadores dos estábulos conseguiram controlar os animais assustados, e pelo menos os mais sensatos de nós tiveram um grande espetáculo!"
 feast_main_stable_breakin.0004.a:0 "Mal posso esperar para fazer isso novamente."
 feast_main_stable_breakin.0004.breakin_with_deviant:0 "Comer e beber está tudo bem, mas eu queria me divertir!\n[breakin_deviant.GetTitledFirstName] teve um plano brilhante sobre os estábulos e logo eu conduzi um grupo de cavaleiros ansiosos além dos portões e fechaduras patéticos.\nHouve gritos e risadas quando trouxemos os cavalos para dentro do salão, onde eu proporcionava aos outros convidados um incrível espetáculo de equitação!"
 feast_main_stable_breakin.0004.breakin_with_helper:0 "Comer e beber está tudo bem, mas eu queria me divertir!\n[breakin_helper.GetTitledFirstName] teve um plano brilhante sobre os estábulos e logo eu conduzi um grupo de cavaleiros ansiosos além dos portões e fechaduras patéticos.\nHouve gritos e risadas quando trouxemos os cavalos para dentro do salão, onde eu proporcionava aos outros convidados um incrível espetáculo de equitação!"
 feast_main_stable_breakin.0004.breakin_with_noone:0 "Comer e beber está tudo bem, mas eu queria me divertir!\nEu mesmo me encarreguei de liderar um grupo de cavaleiros ansiosos além dos portões e fechaduras patéticos que guardavam os estábulos.\nLogo surgiram gritos e risadas, enquanto os convidados nos assistiam montando os animais pelo salão!"
 feast_main_stable_breakin.0004.bystander_riding:0 "\nHavia animais além de cavalos trancados nos estábulos, e [Select_CString( breakin_bystander.IsFemale, 'a', 'o' )] [breakin_bystander.GetTitledFirstName] veio montado em uma cabra! Foi muito divertido até a cabra tombar sob [breakin_bystander.GetSheHe]. E continuou sendo muito divertido depois."
 feast_main_stable_breakin.0004.deviant_discovered:0 "\nAs risadas e alegria cessaram quando [Select_CString( breakin_deviant.IsFemale, 'a', 'o' )] [breakin_deviant.GetTitledFirstName] foi descoberto nos fundos dos estábulos, cometendo pecados inomináveis com um boi! Que patife!"
 feast_main_stable_breakin.0004.signoff:0 "\n\nFoi uma noite maravilhosa, mesmo que os detalhes da minha memória estejam um pouco confusos."
 feast_main_stable_breakin.0004.t:0 "$feast_main_stable_breakin.0002.t$"
 feast_main_stable_breakin.0005.a:0 "Não consigo parar de pensar naquela noite."
 feast_main_stable_breakin.0005.breakin:0 "Nós dois muito bêbados, [breakin_stager.GetTitledFirstName] queria se divertir, e eu plantei a ideia de que talvez isso envolvesse os animais do nosso anfitrião...\n\nLogo me vi seguindo [breakin_stager.GetSheHe] até os estábulos, onde outros convidados embriagados começaram a trazer os cavalos para dentro do salão!"
 feast_main_stable_breakin.0005.bystander_riding:0 "\n\nHavia animais além de cavalos também, e [Select_CString( breakin_bystander.IsFemale, 'a', 'o' )] [breakin_bystander.GetTitledFirstName] veio montado em uma cabra, até que ela cedeu sob o peso [breakin_bystander.GetHerHim]."
 feast_main_stable_breakin.0005.deviant_discovered:0 "\n\nEu sabia o quão errado aquilo era, mas com todas as distrações simplesmente não conseguia me afastar do boi nos fundos dos estábulos.\n\nQuando ouvi gritos chocados com meu nome, soube que minha reputação estava arruinada, mas naquele exato momento estava disposto a suportar qualquer vergonha."
 feast_main_stable_breakin.0005.got_away_with_it:0 "\n\nA distração era exatamente o que eu precisava, e não conseguia mais me afastar do boi nos fundos dos estábulos. \nAs coisas que fiz eram tão erradas, mas o risco de ser descoberto tornava tudo ainda mais emocionante!"
 feast_main_stable_breakin.0005.t:0 "$feast_main_stable_breakin.0002.t$"
 feast_main_stable_breakin.0006.a:0 "Qualquer coisa por um bom banquete!"
 feast_main_stable_breakin.0006.all_in_good_fun:0 "\n\nParece que isso proporcionou um bom espetáculo, então [Select_CString( activity.GetOwner.IsFemale, 'a', 'o' )] [activity.GetOwner.GetTitledFirstName] deixou claro que [activity.GetOwner.GetSheHe] não nos punirá por nossas ações."
 feast_main_stable_breakin.0006.breakin_with_helper:0 "Nós dois muito bêbados, [breakin_stager.GetTitledFirstName] queria se divertir e teve a ideia de que isso deveria envolver os animais do nosso anfitrião...\n\nLogo me vi ajudando [breakin_stager.GetSheHe] a invadir os estábulos, onde nós e outros convidados embriagados começamos a trazer os cavalos para dentro do salão!"
 feast_main_stable_breakin.0006.bystander_riding:0 "\n\nHavia animais além de cavalos também, e [Select_CString( breakin_bystander.IsFemale, 'a', 'o' )] [breakin_bystander.GetTitledFirstName] veio montado em uma cabra, até que ela cedeu sob o peso [breakin_bystander.GetHerHim]."
 feast_main_stable_breakin.0006.deviant_discovered:0 "\n\nAs risadas e alegria haviam desaparecido quando [Select_CString( breakin_deviant.IsFemale, 'a', 'o' )] [breakin_deviant.GetTitledFirstName] foi descoberto nos fundos dos estábulos, cometendo pecados inomináveis com um boi!"
 feast_main_stable_breakin.0006.t:0 "$feast_main_stable_breakin.0002.t$"
 feast_main_stable_breakin.0007.a:0 "Vou apenas fingir que me lembro de tudo isso."
 feast_main_stable_breakin.0007.breakin:0 "Nós dois muito bêbados, [breakin_stager.GetTitledFirstName] queria se divertir e teve a ideia de que isso deveria envolver os animais do nosso anfitrião...\n\nLogo me vi ajudando [breakin_stager.GetSheHe] a invadir os estábulos, onde nós e outros convidados embriagados começamos a montar os cavalos dentro do salão!"
 feast_main_stable_breakin.0007.bystander_riding:0 "\n\nMontei qualquer animal que encontrei, mais tarde me disseram que era na verdade uma cabra, e seu colapso sob meu peso explica algumas das minhas contusões."
 feast_main_stable_breakin.0007.deviant_discovered:0 "\n\nAs coisas terminaram abruptamente, no entanto, quando [Select_CString( breakin_deviant.IsFemale, 'a', 'o' )] [breakin_deviant.GetTitledFirstName] foi pego se divertindo de uma maneira muito diferente com um boi nos fundos dos estábulos! Eu teria ficado chocado e horrorizado se ainda estivesse consciente."
 feast_main_stable_breakin.0007.t:0 "$feast_main_stable_breakin.0002.t$"
 feast_main_stable_breakin.0007.what_a_silly_bunch:0 "\n\nParece que fizemos um verdadeiro espetáculo. Felizmente, foi divertido o suficiente para os outros convidados, e nosso anfitrião parece não querer nos punir por nossas transgressões."
 feast_main_stable_breakin.9001.a:0 "Que momento maravilhoso estamos tendo!"
 feast_main_stable_breakin.9001.deviant_caught:0 "A festa [Select_CString( host_saying_goodbye.IsFemale, 'da', 'do' )] [host_saying_goodbye.GetTitledFirstName] logo chegará ao fim. É triste pensar que teremos que dizer adeus, embora não seja tão ruim não ter mais que estar na companhia [Select_CString( breakin_deviant.IsFemale, 'da', 'do' )] [breakin_deviant.GetTitledFirstName] e aquele boi..."
 feast_main_stable_breakin.9001.in_good_fun:0 "A festa [Select_CString( host_saying_goodbye.IsFemale, 'da', 'do' )] [host_saying_goodbye.GetTitledFirstName] logo chegará ao fim.\n\nÉ triste pensar que teremos que dizer adeus, mas pelo menos poderemos olhar para trás e rir das peripécias [Select_CString( breakin_stager.IsFemale, 'da', 'do' )] [breakin_stager.GetFirstName] e sua turma embriagada de foliões por muitos anos."
 feast_main_stable_breakin.9001.t:0 "Menos Brincadeiras de Cavalos"
 feast_main_stable_breakin.9002.a:0 "Mantenham-me em seus corações, vassalos!"
 feast_main_stable_breakin.9002.deviant_caught:0 "É triste pensar que em breve terei que enviar todos os meus convidados embora!\n\nSerá triste vê-los partir, com exceção [Select_CString( breakin_stager.IsFemale, 'da', 'do' )] [breakin_deviant.GetTitledFirstName].\nEmbora eu nunca consiga esquecer quando olho para meu boi premiado."
 feast_main_stable_breakin.9002.in_good_fun:0 "Meus convidados estão todos de bom humor!\n\nEsta festa nos aproximou, e poderemos olhar para trás e rir das peripécias [Select_CString( breakin_stager.IsFemale, 'da', 'do' )] [breakin_stager.GetFirstName] e sua turma embriagada de foliões por muitos anos."
 feast_main_stable_breakin.9002.in_good_fun_or_what:0 "Meus convidados estão todos de bom humor!\n\nEsta festa nos aproximou, e poderemos olhar para trás e rir das peripécias [Select_CString( breakin_stager.IsFemale, 'da', 'do' )] [breakin_stager.GetFirstName] e sua turma embriagada de foliões por muitos anos.\n\n[breakin_deviant.GetTitledFirstName] até me fez um elogio brincalhão sobre o estado saudável do meu gado!"
 feast_main_stable_breakin.9003.a:0 "O que fizemos não foi tão ruim, afinal."
 feast_main_stable_breakin.9003.deviant_caught:0 "A festa [Select_CString( host_saying_goodbye.IsFemale, 'da', 'do' )] [host_saying_goodbye.GetTitledFirstName] finalmente está chegando ao fim.\n\nEstá difícil olhar para [Select_CString( breakin_deviant.IsFemale, 'a', 'o' )] [breakin_deviant.GetTitledFirstName] da mesma maneira, mas quase devo agradecer a [breakin_deviant.GetSheHe] por desviar a atenção daqueles de nós que invadiram os estábulos em primeiro lugar."
 feast_main_stable_breakin.9003.in_good_fun:0 "Que momento estamos tendo!\n\n[host_saying_goodbye.GetTitledFirstName] parece ter nos perdoado pela nossa pequena invasão, pois [host_saying_goodbye.GetSheHe] viu o quanto os outros convidados se divertiram nos assistindo montar."
 feast_main_stable_breakin.9004.a:0 "Vou me conter no futuro! Espero."
 feast_main_stable_breakin.9004.deviant_caught:0 "Eu sei que nenhum lorde ou dama no reino mais me verá da mesma maneira. [host_saying_goodbye.GetTitledFirstName] condenou meu nome, e [breakin_stager.GetFirstName], com quem eu estava rindo e bebendo há pouco tempo, não consegue mais me encarar."
 feast_main_stable_breakin.9004.in_good_fun:0 "Não consigo acreditar que escapei impune pelo que fiz!\nDepois que os animais foram recolocados nos estábulos, elogiei [Select_CString( host_saying_goodbye.IsFemale, 'a', 'o' )] [host_saying_goodbye.GetTitledFirstName] pelo estado saudável de seus animais.\n\nSe ao menos [host_saying_goodbye.GetSheHe] soubesse!"
 feast_stable_breakin_log:0 "[TARGET_CHARACTER.GetTitledFirstName] invadiu os estábulos e soltou os animais no salão da festa."
 feast_stable_breakin_log_title:0 "Invasão aos Estábulos"
