l_spanish:
 feast_lifestyle.1001.a.tt:0 "Pelo menos [Select_CString( strategy_opponent.IsFemale, 'a', 'o' )] [strategy_opponent.GetFirstName] mostrou que você é capaz de defender sua compreensão do [martial_lifestyle|E]."
 feast_lifestyle.1001.a:0 "Eu adoraria ter a chance de resolver isso no campo de batalha."
 feast_lifestyle.1001.desc:0 "Com que direito [Select_CString( strategy_opponent.IsFemale, 'a', 'o' )] [strategy_opponent.GetTitledFirstName] acha que [strategy_opponent.GetSheHe] tem para afirmar que minhas ideias de guerra estão equivocadas?\n\nAfirmando que minhas ideias se desmoronariam no momento do combate. O que [strategy_opponent.GetSheHe] realmente sabe?"
 feast_lifestyle.1001.t:0 "Palavras de Guerra"
 feast_lifestyle.1002.a.tt:0 "Pensar que uma tigela de gororoba poderia ajudar a expandir sua compreensão do [martial_lifestyle|E]."
 feast_lifestyle.1002.a:0 "Isso parece que poderia funcionar em um campo de batalha real!"
 feast_lifestyle.1002.archers:0 "\n\n#EMP Enquanto uma chuva de flechas cai sobre o centro...#!"
 feast_lifestyle.1002.cavalry:0 "\n\n#EMP Se a cavalaria avançasse por essa ala...#!"
 feast_lifestyle.1002.heavy_infantry:0 "\n\n#EMP Com a infantaria pesada se posicionando exatamente aqui...#!"
 feast_lifestyle.1002.opening:0 "Os outros convidados estão rindo e conversando na sala barulhenta, tornando difícil se concentrar na gororoba à minha frente. Eu traço linhas e engajamentos no lodo gorduroso enquanto penso em maneiras de contra-atacar vários planos de batalha."
 feast_lifestyle.1002.pikemen:0 "\n\n#EMP Claro, meus piqueiros podem resistir nesse lado...#!"
 feast_lifestyle.1002.skirmishers:0 "\n\n#EMP Com meus batedores assediando a ala cenoura...#!"
 feast_lifestyle.1002.t:0 "Significado Oculto"
 feast_lifestyle.1003.a.tt:0 "É melhor pensar nessas coisas do que viver na feliz ignorância apenas para morrer quando chegar o dia. Você entende o [martial_lifestyle|E] melhor que isso."
 feast_lifestyle.1003.a:0 "Nunca se pode ser demasiado cauteloso."
 feast_lifestyle.1003.b.tt:0 "Seria tolice pensar que todos os convidados aqui seriam seus camaradas de armas. Você entende o [martial_lifestyle|e] melhor do que isso."
 feast_lifestyle.1003.b:0 "E se o ataque viesse de dentro?!"
 feast_lifestyle.1003.desc:0 "No meio das celebrações, estou mais intrigado com a defensabilidade desta sala. Caso um ataque seja lançado do lado de fora neste exato momento, a nobreza inferior seria a que estaria em perigo imediato. Além disso, uma pequena bastião poderia ser feito a partir das grandes mesas, oferecendo uma modicum de proteção.\n\nAgora, como deveríamos planejar um contra-ataque..."
 feast_lifestyle.1003.t:0 "Em Caso de Perigo"
 feast_lifestyle.1004.a.tt:0 "Conversar com comandantes experientes certamente ajuda na compreensão do [martial_lifestyle|E]."
 feast_lifestyle.1004.a:0 "Eu aprendo tanto nessas festas."
 feast_lifestyle.1004.desc:0 "As festas oferecem uma ótima oportunidade para conversar com pessoas cuja opinião valorizo. [consultant_3.GetTitledFirstName] teve alguns pensamentos interessantes sobre manobrabilidade militar, enquanto [Select_CString( consultant_2.IsFemale, 'a', 'o' )] [consultant_2.GetTitledFirstName] teve algumas ideias sobre novas estratégias defensivas.\n\n[consultant_1.GetTitledFirstName] foi aquele que teve a verdadeira genialidade, no entanto. Depois de algumas bebidas, [consultant_1.GetTitledFirstName] me contou confidencialmente o que [consultant_1.GetSheHe] considerava o ataque ideal a um castelo!"
 feast_lifestyle.1004.t:0 "Conhecimento Compartilhado"
 feast_lifestyle.2001.a:0 "Isso ensinará aquel[Select_CString( guest_victim.IsFemale, 'a', 'e' )] [guest_victim.Custom2('InsultNoun', ROOT.Char)] [guest_victim.Custom2('InsultAdjective', ROOT.Char)]!"
 feast_lifestyle.2001.desc_ending:0 "A caminhada desajeitada [guest_victim.GetHerHim|U] enquanto [guest_victim.GetSheHe] sai da sala traz um sorriso ao meu rosto, enquanto escondo o pequeno frasco de laxantes na minha bolsa."
 feast_lifestyle.2001.loud:0 "\"Agora, sobre o assunto de gafes, já contei a você sobre a vez que [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitledFirstNameNoTooltip]—\"\n\n[Select_CString( guest_victim.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('guest_victim'))] [guest_victim.GetTitledFirstName] de repente fica quieto, com o rosto pálido."
 feast_lifestyle.2001.mean:0 "Dando um passo rápido para o lado, eu mal evito o vinho que [Select_CString( guest_victim.IsFemale, 'minha', 'meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('guest_victim'))] [guest_victim.GetTitledFirstName] #EMP derrama acidentalmente#! ao passar por mim.\n\nDeixo para lá o mais recente dos insultos [guest_victim.GetHerHim], pois naquele momento [Select_CString( guest_victim.IsFemale, 'a', 'o' )] [guest_victim.Custom2('InsultNoun', ROOT.Char)] fica [Select_CString( guest_victim.IsFemale, 'pálida e rígida', 'pálido e rígido' )]."
 feast_lifestyle.2001.quiet:0 "Os olhares que [Select_CString( guest_victim.IsFemale, 'minha', 'meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('guest_victim'))] [guest_victim.GetTitledFirstName] me lança enquanto [guest_victim.GetSheHe] sussurra para as pessoas ao redor [guest_victim.GetHerHim] são nada menos do que fervorosos.\n\nDe repente, as costas d[Select_CString( guest_victim.IsFemale, 'a', 'o' )] [guest_victim.Custom2('InsultNoun', ROOT.Char)] ficam rígidas, o rosto pálido."
 feast_lifestyle.2001.t:0 "Conheça o Seu Lugar"
 feast_lifestyle.2002.a:0 "Isso é bom demais para guardar só para mim!"
 feast_lifestyle.2002.b:0 "Não, obrigado#EMP! por revelar isso!"
 feast_lifestyle.2002.c:0 "Meu silêncio tem um preço, você sabe."
 feast_lifestyle.2002.d:0 "Saúde! Por uma noite agradável e novos companheiros de bebida!"
 feast_lifestyle.2002.desc_cannibal:0 "\"Você até consegue dizer se eles eram fortes em vida pela textura da carne. Lembro de um soldado que comi uma vez...\""
 feast_lifestyle.2002.desc_ending:0 "\n\nDepois de muitas bebidas, [Select_CString( guest_with_secret.IsFemale, 'minha', 'meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('guest_with_secret'))] [guest_with_secret.GetTitledFirstName] está apoiado na nossa mesa, derramando tanto seu coração quanto sua bebida na minha frente.\n\n\"Me trazendo todas essas bebidas e me ouvindo falar sem parar... Obrigado, [ROOT.Char.GetFirstNameNoTooltip]!\""
 feast_lifestyle.2002.desc_homosexual_female:0 "\"E então eu a vi sorrir! Pensar que eu sou esperada a ficar satisfeita com um homem depois disso...\""
 feast_lifestyle.2002.desc_homosexual_male:0 "\"E então eu o vi sorrir! Pensar que eu sou esperado a ficar satisfeito com uma mulher depois disso...\""
 feast_lifestyle.2002.desc_lover:0 "\"E com olhos assim... Quem sou eu para resistir?\""
 feast_lifestyle.2002.t:0 "Uma Língua Solta"
 feast_lifestyle.2003.a.tt:0 "#F ...e as palavras são minhas armas!#!"
 feast_lifestyle.2003.a:0 "A festa é meu campo de treinamento..."
 feast_lifestyle.2003.b:0 "Vamos apenas desfrutar da conversa."
 feast_lifestyle.2003.desc:0 "Fluindo suavemente de uma conversa para outra, eu guio as discussões na direção que eu desejo.\n\nAlgumas palavras cuidadosamente colocadas, e eu tenho uma compreensão mais clara da vida amorosa [Select_CString( courtier_to_persuade.IsFemale, 'da minha', 'do meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('courtier_to_persuade'))] [courtier_to_persuade.GetTitledFirstName] do que [Select_CString( courtier_to_persuade.IsFemale, 'seu', 'sua' )] [courtier_to_persuade.Custom('WifeHusbandOpp')] gostaria."
 feast_lifestyle.2003.t:0 "O Poder de Influenciar"
 feast_lifestyle.2004.a:0 "Eles estão expondo sua vergonha tão abertamente!"
 feast_lifestyle.2004.b:0 "Nada pode escapar de mim!"
 feast_lifestyle.2004.desc1_a:0 "[Select_CString( ROOT.Char.IsFemale, 'Aquela', 'Aquele' )] [ROOT.Char.Custom('RandomLadyLord')] ali está sorrindo para uma criada do outro lado do salão com intimidade; um possível caso."
 feast_lifestyle.2004.desc1_b:0 "[Select_CString( ROOT.Char.IsFemale, 'Aquela', 'Aquele' )] [ROOT.Char.Custom('RandomLadyLord')] ali está enchendo um copo firmemente segurado pela terceira vez desde que se juntou ao cônjuge; um relacionamento à beira do colapso."
 feast_lifestyle.2004.desc2_a:0 "[Select_CString( ROOT.Char.IsFemale, 'Aquela', 'Aquele' )] [ROOT.Char.Custom('RandomLadyLord')] do outro lado do salão está usando as mesmas botas de ontem; problemas financeiros."
 feast_lifestyle.2004.desc2_b:0 "[Select_CString( ROOT.Char.IsFemale, 'Aquela', 'Aquele' )] [ROOT.Char.Custom('RandomLadyLord')] do outro lado do salão está se mantendo junto às paredes, evitando toda conversa e contato visual; um segredo a ser mantido em segredo?"
 feast_lifestyle.2004.desc_ending:0 "\n\nTodo mundo está escondendo algo, e com um olhar experiente até os menores detalhes mostrarão a imagem completa."
 feast_lifestyle.2004.t:0 "Uma História Detalhada"
 feast_lifestyle.3001.a:0 "[important_guest_1.GetFirstNameNoTooltip] deve sentar ao lado [Select_CString( important_guest_2.IsFemale, 'da', 'do' )] [important_guest_2.GetTitledFirstNameNoTooltip]."
 feast_lifestyle.3001.b:0 "[important_guest_1.GetFirstNameNoTooltip] certamente apreciaria a companhia [Select_CString( important_guest_3.IsFemale, 'da', 'do' )] [important_guest_3.GetTitledFirstNameNoTooltip]."
 feast_lifestyle.3001.c:0 "Ambos jantarão comigo."
 feast_lifestyle.3001.desc:0 "Que festa! Uma excelente oportunidade para mim e [Select_CString( important_guest_1.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('important_guest_1'))] [important_guest_1.GetTitledFirstName] aprendermos mais sobre as pessoas que nos servem.\n\nNem [Select_CString( important_guest_2.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('important_guest_2'))] [important_guest_2.GetTitledFirstName] nem [Select_CString( important_guest_3.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('important_guest_3'))] [important_guest_3.GetTitledFirstName] se estabeleceram ainda, e rapidamente chamo um servo para rearranjar os assentos."
 feast_lifestyle.3001.t:0 "O Assento do Poder"
