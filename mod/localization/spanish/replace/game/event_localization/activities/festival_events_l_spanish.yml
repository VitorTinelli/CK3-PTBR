 every_temperate_or_shy_attendee:0 "Todos os Participantes [GetTrait('temperate').GetName( GetNullCharacter )] ou [GetTrait('shy').GetName( GetNullCharacter )]"
 festival.001.a.tt:0 "#weak Vamos arrumar um novo lar para este filhote #!"
 festival.001.a:0 "Venha aqui, pequeno, e será bem cuidado."
 festival.001.b.custom.tooltip:0 "Você deixa o filhote ao seu destino"
 festival.001.b.tt:0 "Certamente o filhote pode encontrar um novo lar...?"
 festival.001.b:0 "Seu destino não é da minha conta."
 festival.001.desc:0 "Observando a multidão que veio celebrar, fico contente ao vê-la cheia do riso das crianças e dos sorrisos satisfeitos de seus pais. Ainda assim, um movimento repentino e irregular chama minha atenção, pequeno demais para ser uma criança, e muito... #EMP peludo#!?\n\nParece ser um filhote, mancando entre os passos dos gigantes, perdido e sozinho."
 festival.001.t:0 "Perdido na Multidão"
 festival.002.a.bored_child:0 "A criança não gosta de histórias"
 festival.002.a.inspired_child:0 "[curious_child.GetSheHe|U] parece ansioso para ouvir"
 festival.002.a:0 "Bem, deixe-me contar uma história..."
 festival.002.b.flavor:0 "#weak Este infeliz atrevido merece uma 'recompensa' por sua insolência!#!"
 festival.002.b:0 "Seus pais não te ensinaram a não falar com estranhos?"
 festival.002.c:0 "Alguém leve [curious_child.GetSheHe] de volta aos pais [curious_child.GetHerHim]. #EMP Rápido#!."
 festival.002.desc:0 "Um leve puxão na minha manga desvia minha atenção das atrações do festival — olhando para baixo, meus olhos encontram os de uma criança pequena, redondos de admiração.\n\n'Por que há tantas pessoas?' [curious_child.GetSheHe] pergunta com curiosidade simples e inocente. 'O que está acontecendo?'"
 festival.002.t:0 "Uma Mente Curiosa"
 festival.003.a:0 "Abram caminho para [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]!"
 festival.003.b:0 "Deixe o povo aproveitar seus pequenos prazeres."
 festival.003.desc:0 "O cheiro de [ROOT.Char.Custom('GetLocalStreetFoodPlural')], vindo das barracas dos vendedores, sussurra promessas doces e salgadas ao meu estômago roncando.\n\nUma longa fila serve como testemunho visível da demanda por essas guloseimas, mas certamente o anfitrião do dia pode ter #EMP alguns#! privilégios?!"
 festival.003.t:0 "Delícias Saborosas"
 festival.004.a:0 "Que os deuses tragam riqueza e abundância a todos."
 festival.004.b:0 "Desejo um amor tão eterno quanto as próprias estrelas."
 festival.004.c:0 "Concedam-me vigor para realizar minhas ambições."
 festival.004.d:0 "Desejo encontrar o amor em breve."
 festival.004.desc:0 "Os convidados se reúnem em torno do bambu, cujos galhos carregam papéis com os desejos de seus donos.\n\nSob o suave brilho das estrelas, meu povo confia seus sonhos aos amantes do céu, e percebo que eu também poderia ter um desejo a fazer."
 festival.004.t:0 "Desejos Sussurrados"
 festival.005.a:0 "[target_chaplain.GetSheHe|U] fala em nome do divino."
 festival.005.b.failure:0 "O fervor divinamente inspirado [target_chaplain.GetHerHim] não foi contido"
 festival.005.b.success:0 "Você consegue fazer com que [target_chaplain.GetSheHe] se retire do palco"
 festival.005.b.tt.failure:0 "Você falhou em convencer [target_chaplain.GetSheHe]"
 festival.005.b.tt.success:0 "Você convenceu [target_chaplain.GetSheHe]"
 festival.005.b:0 "Eu mesmo vou colocar [target_chaplain.GetSheHe] na linha."
 festival.005.c:0 "Estou cansado desta tirada; tire [target_chaplain.GetSheHe] de lá!"
 festival.005.desc:0 "À medida que o festival se aproxima do clímax, meu [target.chaplain.Custom('MyPriestTitle')] sobe ao palco, sua voz ecoando acima da multidão. [target_chaplain.GetSheHe|U] começa a exaltar a reforma moral e a disciplina espiritual, tentando desviar a alegre energia do meu festival para um sermão. Alguns acham as palavras [target_chaplain.GetHerHim] inspiradoras, enquanto outros resmungam que o festival não é lugar para tal solenidade."
 festival.005.t:0 "Uma Audiência Cativa"
 festival.006.a:0 "Hoje, a humildade serve melhor que o orgulho."
 festival.006.b:0 "Uma exibição extravagante agora pode elevar meu prestígio."
 festival.006.c:0 "Deixe que uma figura menor cuide disso; é adequado ao meu status."
 festival.006.desc:0 "Com suas orações solenes concluídas, os [ROOT.Char.GetFaith.PriestNeuterPlural] iniciam o rito de purificação, que eliminará quaisquer impurezas espirituais e garantirá um ano harmonioso. Como parte da cerimônia, será minha sagrada responsabilidade extrair água pura do poço sagrado."
 festival.006.t:0 "Rito de Purificação"
 festival.007.a.failure:0 "Seus oponentes te dominam"
 festival.007.a.success:0 "Você domina seus oponentes"
 festival.007.a.tt.failure:0 "Você Perdeu"
 festival.007.a.tt.success:0 "Você Venceu"
 festival.007.a:0 "Esta fortuna será minha!"
 festival.007.b.failure:0 "Seus oponentes não foram enganados"
 festival.007.b.success:0 "Você engana seus oponentes"
 festival.007.b:0 "Vou deixar os outros se cansarem primeiro, e então reivindicar a vitória discretamente."
 festival.007.c:0 "Alguns concursos são melhor apreciados da plateia."
 festival.007.desc:0 "O ápice da lua marca a chegada da meia-noite, e com ela o início de um concurso de força sempre popular entre o povo. Os [ROOT.Char.GetFaith.PriestMale] lançarão bastões no meio da multidão, com a tradição dizendo que aqueles que emergirem com um em mãos receberão grande fortuna no ano vindouro."
 festival.007.t:0 "Concurso ao Luar"
 festival.008.a:0 "Que dança linda."
 festival.008.b:0 "Ao observá-los, sinto verdadeira paz."
 festival.008.desc:0 "O próprio ar vibra com o assobio das flautas e o estrondo dos tambores, enquanto [Select_CString( dancer.IsFemale, 'as', 'os' )] jovens [dancer.GetWomenMen] dançam graciosamente em seus trajes vibrantes e fluidos.\n\nÉ a elegância de sua apresentação, agradável tanto aos mortais quanto ao divino, que abençoará a terra sob nossos pés com uma colheita abundante."
 festival.008.t:0 "Dança da Abundância"
 festival.009.a:0 "Conhecer os pensamentos mais íntimos de outro não é uma vantagem pequena."
 festival.009.b:0 "A malícia não tem lugar entre esses galhos."
 festival.009.desc:0 "Há uma tradição local em [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetBaronyNameExplicitlyNoTooltip] na qual as pessoas confiam seus desejos mais sinceros a tiras de papel e os penduram em uma árvore.\n\nAo inspecioná-los mais de perto, vejo que a maioria dos desejos é o que se esperaria — riqueza, amor, prosperidade —, mas entre eles há alguns inscritos com desejos mais sombrios."
 festival.009.t:0 "Um Desejo na Árvore"
 festival.010.a:0 "Um conjunto de tsurus de papel coloridos, um lembrete da importância da família."
 festival.010.b:0 "Um quimono de papel cuidadosamente dobrado, símbolo de saúde."
 festival.010.c:0 "Deixe que outros se adornem assim; a simplicidade me convém melhor."
 festival.010.desc:0 "A rua é uma explosão de cores e vivacidade, incontáveis decorações tremulando alegremente com a brisa. Aplausos e risadas enchem o ar enquanto o povo admira os produtos dos artesãos. Talvez eu deva adquirir um desses tokens para mim?"
 festival.010.t:0 "Bênçãos de Papel"
 festival.012.a:0 "Sua alegria simples suavemente acalma a alma."
 festival.012.b:0 "Esta vivacidade é verdadeiramente revigorante."
 festival.012.c:0 "O barulho é esmagador — anseio por tranquilidade."
 festival.012.desc:0 "Lanternas iluminam a festividade noturna enquanto o ar pulsa com música e explosões de risadas. Não posso deixar de me comover com a cena diante de mim."
 festival.012.t:0 "Celebração Barulhenta"
 festival.014.a:0 "Que os deuses nos olhem com favor."
 festival.014.desc:0 "Hoje é uma ocasião de celebração, mas também de assegurar as bênçãos dos deuses. Olhos mortais e divinos observarão nosso comportamento e ofertas, e portanto devemos garantir que tudo esteja em ordem."
 festival.014.t:0 "Estes Dias de Mangas Dançantes"
 festival.016.a:0 "Tolo descuidado! [clumsy_oaf.GetSheHe|U] pagará por isso!"
 festival.016.b:0 "As vestes podem ser substituídas."
 festival.016.desc:0 "[Select_CString( clumsy_oaf.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('clumsy_oaf'))] [clumsy_oaf.GetFirstName] permanece em horror absoluto enquanto ambos olhamos para o saquê escorrendo de minhas vestes, a roupa luxuosa já escurecendo com a mancha se espalhando.\n\nOs que nos cercam permanecem congelados pela curiosidade, escondendo suas reações atrás de leques pintados, esperando — não, antecipando — uma explosão iminente."
 festival.016.t:0 "Honra Manchada"
 festival.017.a:0 "Rirei mais alto que qualquer um!"
 festival.017.b:0 "Queimar essas bonecas insolentes."
 festival.017.c:0 "Meus agentes devem observar as reações do público."
 festival.017.desc:0 "Um marionetista itinerante decidiu fazer do festival seu palco, cercado por dezenas de espectadores risonhos.\n\nEnquanto observo as marionetes dançarem, sua performance começa a adquirir um aspecto desconfortável, a figura do governante executivo longe demais de ser familiar para meu gosto, e a multidão muito divertida com suas trapalhadas."
 festival.017.t:0 "Marionetes Mutantes"
 festival.018.a:0 "Traga o saquê, e bebamos juntos!"
 festival.018.b:0 "Que tal uma taça modesta e um convite..."
 festival.018.c:0 "Este espetáculo acabou."
 festival.018.desc:0 "A sacerdotisa do santuário treme violentamente, como possuída, sua voz sobrenatural entoa comandos divinos.\n\nParece que esta divindade tem afinidade com saquê, e em quantidades substanciais. Recusar seria ofender uma entidade poderosa, mas não posso deixar de me perguntar se isso é mais performance impia do que invocação."
 festival.018.t:0 "Transe e Tributo"
 festival.019.a:0 "Que seja uma saga da glória da minha família."
 festival.019.b:0 "Uma peça moral ensinará a virtude da obediência."
 festival.019.c:0 "Dedique-a aos deuses e que possamos ganhar suas bênçãos."
 festival.019.desc:0 "[Select_CString( play_planner.IsFemale, 'Minha administradora', 'Meu administrador' )] [play_planner.GetFirstName] se curva reverentemente diante de mim. 'Haverá uma peça, [ROOT.Char.Custom('FormOfAddressForLiege')],' diz [play_planner.GetSheHe]. 'Mas a escolha da história é seu privilégio.' Será algo para entreter o povo ou lembrá-los de seu lugar?"
 festival.019.t:0 "Drama por Decreto"
 festival.020.a:0 "Prepare meu corcel — o prêmio será meu!"
 festival.020.b:0 "Vou fazer uma aposta eu mesmo!"
 festival.020.c:0 "Que eles atirem, mas tragam-me um fragmento do leque para sorte."
 festival.020.desc:0 "O rio brilha sob o sol do meio-dia enquanto os arqueiros montam seus cavalos, enquanto do outro lado do córrego os assistentes levantam seu alvo: um leque de papel.\n\nEm algum lugar, um tambor ecoa, abafando momentaneamente o burburinho das apostas sobre qual arqueiro sairá vitorioso."
 festival.020.t:0 "Glória Galopante"
 festival.021.a:0 "Vou liderar este 'contra-ataque' pessoalmente!"
 festival.021.b:0 "Certifiquem-se de que cada casa tenha um balde de água pronto."
 festival.021.c:0 "Tradição ou não, o risco de incêndio é grande demais."
 festival.021.desc:0 "O ritmo previsível das festividades é repentinamente quebrado pela chegada de 'ogros' mascarados brandindo tochas flamejantes, cobrindo a multidão em fuga com faíscas. Próximos, os sacerdotes preparam seu contra-ataque, o inevitável triunfo ritual sobre os espíritos malignos."
 festival.021.t:0 "Exibição Infernal"
 festival.022.a:0 "Não permitirei violência, não importa a tradição!"
 festival.022.b:0 "Os vencedores serão bem recompensados!"
 festival.022.c:0 "Se o público quer espetáculo, que pague para vê-lo."
 festival.022.desc:0 "[Select_CString( rumbler_one.IsFemale, 'Duas', 'Dois' )] [rumbler_one.GetWomenMen] de vilarejos vizinhos convergiram para o local do festival para resolver suas diferenças como dita a tradição — erguer seus palanquins e lançá-los um contra o outro, tentando derrubar o palanquim do oponente.\n\nEstilhaços voam a cada impacto! Os vívidos aplausos da multidão levam os combatentes a colisões cada vez mais explosivas."
 festival.022.t:0 "Confronto do Festival"
 festival.023.a:0 "Mantenha firme, estou indo!"
 festival.023.b:0 "Que o tolo seja punido, e sua vila pague uma multa."
 festival.023.desc:0 "Tambores de couro de cervo trovejam, anunciando o início da procissão cerimonial. Os porta-bandeiras lideram a marcha orgulhosos, resplandecentes em suas roupas de festival, seguidos pelo majestoso palanquim, erguido nos ombros dos assistentes.\n\n'Atenção!' A procissão pitoresca é interrompida quando um carregador de palanquim solta o aperto, resultando no palanquim inclinando-se perigosamente."
 festival.023.t:0 "Procissão em Perigo"
 festival.024.a:0 "Marque os mais fortes — poderíamos usar homens assim."
 festival.024.b:0 "A precisão deles é admirável!"
 festival.024.c:0 "Que demonstração de força."
 festival.024.desc:0 "#EMP CRACK!#! #EMP CRACK!#! Estes ruídos altos devem afugentar todos os espíritos malignos! Os jovens da vila diante de mim continuam batendo os pés e estalando seus bastões de madeira com o entusiasmo de guerreiros ferozes.\n\nEsta tradição empolgante poderia ser vantajosa em outros campos se seus bastões fossem trocados por lanças."
 festival.024.t:0 "Dança de Madeira"
 festival.100.a:0 "Honrarei [target_character.GetTitledFirstNameNoTooltip] com minha presença."
 festival.100.b:0 "Creio que prefiro a companhia [Select_CString( target_character2.IsFemale, 'da', 'do' )] [target_character2.GetTitledFirstNamePossessiveNoTooltip]."
 festival.100.c:0 "Envie a cada um meus cumprimentos, junto de sinais de estima."
 festival.100.d:0 "Vamos organizar uma própria reunião e ofuscá-los ambos!"
 festival.100.desc:0 "O mensageiro que me convidava para a festa de observação da lua [Select_CString( target_character.IsFemale, 'da', 'do' )] [target_character.GetTitledFirstNamePossessive] mal terminou quando outro chega, trazendo uma carta me convidando a ir à festa [Select_CString( target_character2.IsFemale, 'da', 'do' )] [target_character2.GetTitledFirstName]!\n\nTal coincidência dificilmente é acidental. Cada um claramente deseja medir-me, e aceitar um convite será tomado como sinal de simpatia para seu autor, e igualmente como desdém pelo rival [target_character.GetHerHim]."
 festival.100.t:0 "Numa Noite de Lua"
 festival.1000.a:0 "\"Considero minha família afortunada por ter companhia de tal qualidade.\""
 festival.1000.b:0 "\"Considero a [bloc_member_head_1.GetHouse.GetBaseNameNoTooltip] entre meus amigos honrados.\""
 festival.1000.c:0 "[bloc_member_head_1.GetFirstNameNoTooltip], você gosta de se curvar perante a [bloc_member_head_1.GetHouse.GetConfederation.GetLeadingHouse.GetBaseNameNoTooltip]?"
 festival.1000.desc:0 "Aproveitando silenciosamente o progresso lento das festividades, [bloc_member_head_1.GetTitledFirstName] da [bloc_member_head_1.GetHouse.GetBaseName], [bloc_member_head_2.GetTitledFirstName] da [bloc_member_head_2.GetHouse.GetBaseName], e eu, nos encontramos trocando gentilezas e guloseimas à sombra."
 festival.1000.e:0 "\"O solar da [bloc_member_head_1.GetHouse.GetBaseNameNoTooltip] é digno de ser visto.\""
 festival.1000.f:0 "\"Uma grande demonstração da [bloc_member_head_2.GetHouse.GetBaseNameNoTooltip] este ano.\""
 festival.1000.g:0 "Tais momentos devem simplesmente ser apreciados."
 festival.1000.outro:0 "\n\nOs três podemos nos considerar entre os principais nobres do reino, e tais oportunidades de convívio tão natural vêm poucas e raras vezes."
 festival.1000.t:0 "Companhia Estimada"
 festival.101.a:0 "Envie alguém com tato... e um nariz fraco."
 festival.101.b:0 "Todos simplesmente #EMP devem#! saber disso."
 festival.101.desc:0 "Muito antes de se ver [target_character.GetTitledFirstName], é certamente possível #EMP sentir#! [target_character.GetSheHe]. Embora seja #EMP costumeiro#! embebecer as vestes em incenso aromático, o efeito raramente se espera sentir a cem passos de distância.\n\nTalvez uma nota discreta seja adequada, embora um sussurro em outro ouvido assegure que este hábito perdure muito depois do aroma se dissipar."
 festival.101.t:0 "Mangás Perfumados"
 festival.102.a:0 "O vinho desperta algo em mim; sinto que um verso vem à mente!"
 festival.102.b:0 "Esta taça eu ergo ao nobre [target_character.GetTitledFirstNameNoTooltip]!"
 festival.102.c:0 "Acho que já bebi o suficiente esta noite."
 festival.102.desc:0 "Após um dia de festividades, o crepúsculo desce e a #EMP verdadeira#! celebração finalmente começa, com o vinho do anfitrião fluindo como um rio incessante.\n\nCada gole convida outro, e então outro. [target_character2.GetTitledFirstName] faz uma piada que apenas pego o final, mas que [target_character.GetTitledFirstName] parece achar interminavelmente divertida. Talvez um pouco mais de bebida me ajude a encontrar diversão nisso..."
 festival.102.t:0 "Taças Erguidas"
 festival.103.a:0 "\"[target_character.GetSheHe|U] fala a verdade.\""
 festival.103.b.failure.toast:0 "[target_character.GetTitledFirstName] ignorou seu desafio"
 festival.103.b.failure:0 "[target_character.GetTitledFirstName] não se impressionou com seu desafio"
 festival.103.b.success.toast:0 "[target_character.GetTitledFirstName] fez uma retirada apressada"
 festival.103.b.success:0 "[target_character.GetTitledFirstName] foi acovardado e se submeteu"
 festival.103.b:0 "\"Encante-nos com seus talentos, [target_character.GetTitledFirstNameNoTooltip].\""
 festival.103.c:0 "Os talentos dos #EMP meus#! amigos são muito maiores."
 festival.103.desc:0 "Enquanto meus acompanhantes e eu atravessamos a multidão, ouço uma voz alta.\n\n\"Meu $language_chinese_name$ é #EMP exquisito#!! Pois, há apenas duas semanas [target_character2.GetTitledFirstName] colocou minha habilidade poética à prova e foi humilhado por minha arte!\" [target_character.GetTitledFirstName] se gaba.\n\nNão me recordo de qualquer boato de que [target_character.GetSheHe] possua habilidade poética; mas reforçar a alegação [target_character.GetHerHim] pode me favorecer. Ainda assim, colocar um fanfarrão em seu lugar é difícil de resistir."
 festival.103.t:0 "Línguas Fanfas"
 festival.104.a.failure.toast:0 "Sua abordagem desajeitada não foi bem-recebida"
 festival.104.a.failure:0 "Sua intromissão desajeitada não é apreciada"
 festival.104.a.success.toast:0 "Sua abordagem audaciosa foi bem-sucedida"
 festival.104.a.success:0 "Você os impressiona com sua abordagem audaciosa"
 festival.104.a:0 "Vou me juntar a eles com audácia."
 festival.104.b.failure.toast:0 "Sua tentativa de minar a reputação deles falhou completamente"
 festival.104.b.failure:0 "Sua campanha de sussurros é totalmente ignorada"
 festival.104.b.success.toast:0 "Rumores duvidosos circulam ao redor deles"
 festival.104.b.success:0 "Você lança dúvidas sobre a integridade deles"
 festival.104.b:0 "Alguns sussurros meus plantarão ideias #EMP intrigantes#!"
 festival.104.c:0 "Deixe-me retirar para junto de meus acompanhantes."
 festival.104.desc:0 "Toda reunião tem seu fluxo e refluxo, deve-se estar atento às suas correntes, sob pena de se encontrar perdido.\n\nQuando [target_character3.GetTitledFirstName] se volta para cumprimentar [target_character4.GetTitledFirstName], de repente me vejo à deriva na multidão, sem conversa.\n\nAlgumas passadas adiante, vejo [target_character.GetTitledFirstName] e [target_character2.GetTitledFirstName] olhando fixamente em minha direção e trocando palavras por trás de seus leques."
 festival.104.t:0 "À Deriva na Multidão"
 festival.105.a.failure.toast:0 "Você não consegue resolver o enigma"
 festival.105.a.failure:0 "Você está perplexo diante do enigma"
 festival.105.a.success.toast:0 "Você desvenda o enigma com destreza"
 festival.105.a.success:0 "Você resolve o enigma com impressionante facilidade"
 festival.105.a:0 "Vou desvendar este enigma e, com ele, a arrogância [Select_CString( target_character.IsFemale, 'da', 'do' )] [target_character.GetTitledFirstNamePossessiveNoTooltip]!"
 festival.105.b:0 "Que construto confuso! A astúcia [target_character.GetHerHim] é realmente incomparável."
 festival.105.c.failure.toast:0 "A festa de enigmas virou uma discussão fútil"
 festival.105.c.failure:0 "Sua performance é pouco impressionante"
 festival.105.c.success.toast:0 "A festa de enigmas foi um sucesso estrondoso"
 festival.105.c.success:0 "Você resolve enigmas e confunde seus companheiros de igual modo"
 festival.105.c:0 "O início de uma competição de astúcia!"
 festival.105.desc:0 "Uma nota, escrita com mão elegante, pende delicadamente de um galho. \"[target_character.GetTitledFirstName] nos apresentou um enigma!\" exclama [target_character2.GetTitledFirstName].\n\n\"Um desafio,\" contrapõe [target_character3.GetTitledFirstName]. \"[target_character.GetSheHe|U] se considera o mais esperto entre nós. Ofereceu ao primeiro que o resolver qualquer favor que deseje [target_character.GetHerHim]; #EMP claramente#! [target_character.GetSheHe] não espera que qualquer um de nós vença.\""
 festival.105.t:0 "Um Teste de Astúcia"
 festival.106.a:0 "Meus servos trarão algo."
 festival.106.b.failure.toast:0 "[target_character2.GetTitledFirstNameNoTooltip] está desconfiado de você"
 festival.106.b.failure:0 "[target_character2.GetTitledFirstName] percebe que algo está errado"
 festival.106.b.success.toast:0 "Você desfruta de uma conversa agradável com [target_character2.GetTitledFirstName]"
 festival.106.b.success:0 "Você consegue distrair [target_character2.GetTitledFirstName]"
 festival.106.b:0 "Vou distrair [target_character2.GetSheHe], corra agora!"
 festival.106.c:0 "[target_character2.GetFirstNameNoTooltip] achará isso #EMP bastante#! divertido."
 festival.106.desc:0 "Tive a sorte de desfrutar da sombra do pavilhão quando uma tempestade irrompeu pelo céu ensolarado; um casamento da raposa, como dizem.\n\nInfelizmente, [Select_CString( target_character.IsFemale, 'a', 'o' )] pobre [target_character.GetTitledFirstName] levou a pior, esgueirando-se para abrigo com a elegância de um gato encharcado.\n\n\"Imploro-lhe, uma troca de roupa!\" [target_character.GetSheHe] suplica. \"[target_character2.GetTitledFirstName] está a caminho, e seria uma ruína ser visto em tal desordem.\""
 festival.106.t:0 "O Casamento da Raposa"
 festival.107.a:0 "Bem, #EMP ouvi#! que [character_of_rumor.GetSheHe] manteve [target_character.GetSheHe] fora da porta a noite inteira!"
 festival.107.b:0 "Pouco viram, mas certamente #EMP ouviram#! muito!"
 festival.107.c:0 "Se admira façanhas amorosas, meus acompanhantes têm muito mais a oferecer."
 festival.107.desc:0 "\"[ROOT.Char.GetTitledFirstNameNoTooltip]!\" [target_character2.GetTitledFirstName] me saúda ao passar, conduzindo-me mais perto de seu grupo.\n\n\"Ouviste o que se passou entre [target_character.GetTitledFirstName] e [courtier_host.GetTitledFirstNamePossessive] [courtier_host.Custom2('RelationToMeShort', SCOPE.sC('character_of_rumor'))], [character_of_rumor.GetTitledFirstName]?\" [target_character2.GetSheHe] sussurra, \"Tenho motivos para acreditar que [target_character.GetSheHe] chegou até as câmaras internas [character_of_rumor.GetHerHim], mas o servo que subornei não pôde me contar mais.\" \n\nServos são, naturalmente, #EMP notoriamente#! fontes de fofoca pouco confiáveis, mas independentemente da veracidade, esta é uma excelente oportunidade para influenciar a reputação [Select_CString( target_character.IsFemale, 'da', 'do' )] [target_character.GetTitledFirstNamePossessiveNoTooltip]."
 festival.107.t:0 "Aventuras Amorosas"
 festival.108.a:0 "Excelente proposta! Que assim seja."
 festival.108.b:0 "Dê-me, e eu devolvo #EMP pessoalmente#!."
 festival.108.c:0 "Vamos manter isso entre nós por enquanto, apenas você e eu."
 festival.108.desc:0 "Vejo [target_character2.GetTitledFirstName] se aproximando, olhos cintilando com malícia. \"Encontrei isto à sombra do pavilhão,\" [target_character2.GetSheHe] começa. \"Lembro-me distintamente de estar nas mãos [Select_CString( target_character.IsFemale, 'da', 'do' )] [target_character.GetTitledFirstNamePossessive] há apenas algumas horas, e há uma mensagem bastante... #EMP sugestiva#! inscrita nela.\"\n\n\"Poderíamos #EMP devolvê-la#! a [target_character.GetSheHe]... #EMP ou#! talvez eu organize para que seja 'entregue' de forma conspícua a outro em nome [target_character.GetHerHim]. Talvez [target_character4.GetTitledFirstName], [Select_CString( target_character4.IsFemale, 'a', 'o' )] [target_character3.Custom2('RelationToMeShort', SCOPE.sC('target_character4'))] de [target_character.GetHerHis] [target_character3.Custom('MistressMaster')], [target_character3.GetTitledFirstName]?\""
 festival.108.t:0 "Lendo Entre as Dobras"
 festival.109.a:0 "Vamos trocar versos. Eu começo, e #EMP você#! continua, [target_character.GetFirstNameNoTooltip]."
 festival.109.b:0 "Deslumbre-nos com seu engenho, [target_character2.GetFirstNameNoTooltip]."
 festival.109.c:0 "Se procura verdadeira arte, encontre-a entre #EMP nós#!."
 festival.109.desc:0 "Uma onda de divertimento me atrai para onde uma pequena multidão se reuniu em torno de dois de nossos pares. \"Encante-nos com um poema, [target_character2.GetTitledFirstName]!\" [target_character.GetTitledFirstName] exorta, voz carregada de escárnio mal disfarçado. \"Certamente você pode se sair ao menos #EMP uma#! vez?\"\n\n[target_character2.GetFirstNameNoTooltip], conhecido por possuir a sensibilidade poética de uma pedra, olha para mim com os olhos suplicantes de um animal encurralado."
 festival.109.t:0 "Poesia Sob Pressão"
 festival.114.a:0 "\"Esqueça-os, e junte-se a nós!\""
 festival.114.b:0 "\"Que pena! Como é ser deixado de lado como um brinquedo quebrado?\""
 festival.114.c:0 "#EMP Nós#! jamais abandonaríamos um dos nossos."
 festival.114.desc:0 "Respirando o ar noturno, meus companheiros e eu encontramos [target_character.GetTitledFirstName] contemplando a água com saudade.\n\nA princípio presumo que esteja cativado pela beleza do reflexo da lua, mas o barulho de um grupo de festeiros chama minha atenção. Parece que eles partiram de barco e o pobre [target_character.GetTitledFirstName] ficou para trás!"
 festival.114.t:0 "Deixado à Beira"
 festival.2000.a_accept:0 "Você pode contar com meu apoio, assim como eu contarei com o seu."
 festival.2000.a_decline:0 "Agradeço, mas estou contente como estou."
 festival.2000.b_accept:0 "Tais vínculos são raros e devem ser prezados."
 festival.2000.b_decline:0 "Prezo por seu apreço, mas devo recusar."
 festival.2000.befriending:0 "\"Seria uma enorme honra se você me considerasse entre seus confidentes no futuro.\""
 festival.2000.bloc_invitation:0 "\"Tanto que meus compatriotas e eu gostaríamos de estender um convite: que você possa se considerar entre nós, e que nós, por nossa vez, estaremos sempre ao seu lado.\""
 festival.2000.c:0 "Guardaremos essas efêmeras alegrias em nossa memória."
 festival.2000.intro_desc:0 "À medida que os festejos noturnos diminuem e cedem lugar aos primeiros raios dourados do amanhecer, os participantes aproveitam estes últimos momentos antes de retornarem à rotina diária.\n\n"
 festival.2000.intro_part_two:0 "[Select_CString( friendly_attendee.IsFemale, 'Minha', 'Minha' )] [ROOT.Char.Custom2('RelationToMeShort', friendly_attendee)] [friendly_attendee.GetTitledFirstName] se aproxima, \"Sua companhia foi muito bem-vinda nestes últimos dias,\" [friendly_attendee.GetSheHe] pausa para dar um sorriso caloroso.\n\n"
 festival.2000.nobody_likes_you:0 "O fluxo constante dos sonolentos e saciados das acomodações para a estrada diminui até desaparecer, e logo minha comitiva e eu somos os únicos que permanecem."
