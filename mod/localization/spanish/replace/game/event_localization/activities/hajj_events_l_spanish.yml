l_spanish:
 hajj.0011.a:0 "Já me sinto mais próximo de [ROOT.Char.GetFaith.HighGodName]."
 hajj.0011.a_cynical:0 "Isso tinha que ser feito."
 hajj.0011.desc:0 "Agora que minha nova capital é o glorioso domínio de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], aproveitei a oportunidade para realizar os ritos e receber as bênçãos da Hajj."
 hajj.0011.t:0 "Dentro das Muralhas Brilhantes"
 hajj.0500.a.flavor:0 "Um desejo de morte é um desejo de morte."
 hajj.0500.a.tt_hajj:0 "Sua próxima [pilgrimage|E] [hajj|E] será mais barata."
 hajj.0500.a:0 "Vou garantir que seja feito."
 hajj.0500.b.flavor:0 "Eu realmente preferiria não."
 hajj.0500.b:0 "Eu... não posso fazer promessas, [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('hajj_dying_relative'))]."
 hajj.0500.desc:0 "\"#EMP As paredes brilhantes, as paredes brilhantes... #!,\" murmura [Select_CString( hajj_dying_relative.IsFemale, 'a', 'o' )] [hajj_dying_relative.GetTitledFirstName] enquanto entro em seus [ROOT.Char.Custom('GetChamber')]. Sua respiração é difícil, como se o ar estivesse evitando descer para os pulmões doentes da, antes grandiosa, [hajj_dying_relative.GetWomanMan].\n\nEu pigarreio e os olhos turvos [Select_CString( hajj_dying_relative.IsFemale, 'da', 'do' )] [hajj_dying_relative.GetFirstNameNoTooltip] lutam para focar em mim: \"[ROOT.Char.GetFirstNameNoTooltip]? ... é você?\", sussurra [hajj_dying_relative.GetSheHe]. Então o olhar [hajj_dying_relative.GetHerHim] se clareia por um momento: \"As paredes brilhantes. Meca.\"\n\n\"Você precisa realizar a Hajj, [hajj_dying_relative.Custom2('RelationToMe' , ROOT.Char)]. Você #EMP deve#! ver as paredes brilhantes!\" [hajj_dying_relative.GetFirstNameNoTooltip] começa a tossir pelo esforço físico repentino e geme levemente. Que pena."
 hajj.0500.t:0 "As Muralhas Brilhantes"
 hajj.3001.a:0 "Raspar tudo!"
 hajj.3001.b:0 "Cortar apenas uma mecha de cabelo."
 hajj.3001.desc.equal:0 "Tradicionalmente, tudo é raspado, mas ocasionalmente é concedida uma dispensa para cortar apenas parte."
 hajj.3001.desc.female_dominated:0 "Tradicionalmente, as mulheres raspam tudo, mas ocasionalmente é concedida uma dispensa para cortar apenas parte, e os homens são restritos a apenas uma mecha."
 hajj.3001.desc.male_dominated:0 "Tradicionalmente, os homens raspam tudo, mas ocasionalmente é concedida uma dispensa para cortar apenas parte, e as mulheres são restritas a apenas uma mecha."
 hajj.3001.desc:0 "Depois de orar no Lugar de Abraão, caminhar entre Safa e Marwah, beber água do poço de Zamzam e sacrificar para [ROOT.Char.GetFaith.HighGodName], agora estou pronto para completar o Hajj. O próximo rito que devo realizar é cortar meu cabelo.\n\n"
 hajj.3001.t:0 "Halq"
 hajj.3010.a.bad.desc:0 "Você alimenta sua superstição"
 hajj.3010.a.bad.t:0 "Superstição"
 hajj.3010.a.opinion.desc:0 "Você percebe como se tornar mais agradável"
 hajj.3010.a.opinion.t:0 "Código Social"
 hajj.3010.a.prestige.desc:0 "Você entende como pode se tornar mais prestigioso"
 hajj.3010.a.prestige.t:0 "Prestígio"
 hajj.3010.a.wealth.desc:0 "Você obtém ideias de como aumentar sua riqueza"
 hajj.3010.a.wealth.t:0 "Riqueza"
 hajj.3010.a:0 "Devo rezar por algo mais substancial..."
 hajj.3010.b.flavor_cynical:0 "Melhor acabar com isso logo."
 hajj.3010.b:0 "Vamos nos concentrar e contemplar."
 hajj.3010.desc:0 "Tendo entrado em Meca, minha primeira tarefa é visitar o Lugar de Abraão. Esta pedra sagrada é considerada o marco que Abraão usou ao construir a Caaba, acompanhado por Ismael, todos aqueles séculos atrás.\n\nOs peregrinos ao meu redor se aproximam do santuário e inclinam suas cabeças em oração contemplativa. Eu deveria fazer o mesmo."
 hajj.3010.t:0 "Lugar de Abraão"
 hajj.3020.a:0 "Por que se contentar com sete?"
 hajj.3020.b:0 "Sete voltas meticulosas serão suficientes."
 hajj.3020.c.failure.desc:0 "Você é pego e penalizado"
 hajj.3020.c.success.desc:0 "Você consegue evitar fazer o número completo de voltas"
 hajj.3020.c.success.t:0 "Preguiça Bem-Sucedida"
 hajj.3020.c:0 "Alguém vai perceber se eu fizer menos vezes?"
 hajj.3020.desc:0 "Minha próxima tarefa é caminhar, sete vezes, entre os dois pontos sagrados Safa e Marwah, a fim de comemorar a desesperança e os esforços de Hajar para encontrar água para seu filho Ismail.\n\nIsmail, que mais tarde se tornou o ancestral do abençoado Profeta.\n\nEnquanto me preparo para o rito, observo a vista de Safa e Marwah e noto a grande quantidade de peregrinos já percorrendo o caminho entre as colinas, vindos de todos os estilos de vida."
 hajj.3020.t:0 "Safa e Marwah"
 hajj.3021.a.flavor:0 "Damm. $hajj.3040.c.flavor$"
 hajj.3021.a:0 "Vamos sacrificar um animal."
 hajj.3021.b.flavor:0 "Sadaqah al-Fitr. Sacrificar cereais e tâmaras aos pobres parece valer a pena."
 hajj.3021.b:0 "Vou fazer uma doação."
 hajj.3021.c.flavor:0 "Ah, que aborrecimento."
 hajj.3021.c.flavor_zealous:0 "Eu #EMP sabia#! que deveria ter levado isso a sério..."
 hajj.3021.c:0 "Vamos fazer as sete voltas corretamente desta vez."
 hajj.3021.desc:0 "Ao começar a voltar das duas colinas, um dos clérigos locais me olha com um rosto severo: \"Eu #EMP acredito#! que você não tenha completado corretamente o rito de Safa e Marwah, Hajji.\"\n\n[penalizer.GetSheHe|U] continua: \"A penalidade para tais ações é ou o Damm ou o Sadaqah al-Fitr. Ou você sempre pode fazer as voltas corretamente, é claro,\" o rosto [penalizer.GetHerHim] suaviza por um segundo.\n\n\"A Hajj será incompleta se você se abster, então, o que será, Hajji?\""
 hajj.3021.t:0 "Pego!"
 hajj.3030.a.flavor:0 "Não tenho pressa."
 hajj.3030.a:0 "Devo deixar os outros irem primeiro."
 hajj.3030.b.flavor:0 "Delicioso. E dizem que também faz milagres!"
 hajj.3030.b:0 "Saciar a sede da minha alma!"
 hajj.3030.c.flavor:0 "Isso #EMP mal#! parece higiênico!"
 hajj.3030.c:0 "Talvez eu apenas mergulhe levemente as mãos."
 hajj.3030.desc:0 "Aqui estou eu, diante do místico poço de Zamzam, aquele descoberto através dos sonhos de uma fonte eterna no deserto. Beber sua água é um dos antigos ritos do Hajj, e, como tal, minha próxima empreitada.\n\nO poço, embora brotando de um intricado trabalho de pedra, está repleto de peregrinos do Hajj à minha esquerda, direita e centro, e devo me esforçar para atravessar a multidão e avançar em direção à água santificada compartilhada por muitos."
 hajj.3030.t:0 "Poço de Zamzam"
 hajj.3040.a.flavor:0 "Não serei pior que o grande profeta!"
 hajj.3040.a:0 "Sessenta e três camelos!"
 hajj.3040.b.flavor:0 "Os camelos conhecem o segredo..."
 hajj.3040.b:0 "Um camelo será suficiente."
 hajj.3040.c.flavor:0 "Nunca gostei dos olhos vidrados delas mesmo."
 hajj.3040.c:0 "Vamos com uma ovelha."
 hajj.3040.d.flavor:0 "Por que extinguir mais vidas do que o necessário?"
 hajj.3040.d:0 "Vou participar do sacrifício daquela vaca ali."
 hajj.3040.desc:0 "Chegou a hora do próximo rito: sacrificar para [ROOT.Char.GetFaith.HighGodName]. Uma parte especial do terreno cerimonial foi preparada para essa ocasião, e o aroma musgoso se torna mais forte conforme me aproximo das barracas que fornecem vários tipos de animais.\n\nConsidero cuidadosamente minhas opções; sacrificar um animal grande, como um camelo, certamente seria mais piedoso - enquanto sacrificar um animal menor ou uma ovelha seria suficiente para completar o Hajj.\n\nAlguns peregrinos em um canto também parecem ter contribuído e dividido o custo de uma vaca grande entre eles."
 hajj.3040.t:0 "Sacrifício para Allah"
