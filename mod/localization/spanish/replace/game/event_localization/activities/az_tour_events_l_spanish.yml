l_spanish:
 az_tour.0001.a.diplomacy:0 "Fale sobre como a harmonia sustenta o reino."
 az_tour.0001.a.fallback:0 "Responda com uma interpretação ponderada."
 az_tour.0001.a.intrigue:0 "Sugira que [Select_CString( stop_host_scope.IsFemale, 'a', 'o' )] [stop_host_scope.GetTitleAsName] reconheceu o poder silencioso."
 az_tour.0001.a.learning:0 "Ofereça uma exegese fundamentada nos clássicos."
 az_tour.0001.a.martial:0 "Argumente que a virtude deve ser defendida com força."
 az_tour.0001.a.stewardship:0 "Reflita sobre o fardo do governo justo."
 az_tour.0001.b:0 "Recite um verso rápido sobre impermanência."
 az_tour.0001.c:0 "Faça um discurso sobre a fome de ascender."
 az_tour.0001.desc:0 "[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ergue a mão pedindo silêncio enquanto os servos retiram os últimos pratos. Ao lado [stop_host_scope.GetHerHim], [scholar.Custom2('MyCharacterIntroduction', ROOT.Char)] avança e, com voz medida, começa a recitar um verso — linhas elegantes sobre a passagem do tempo e o peso da virtude.\n\nQuando os aplausos cessam, [stop_host_scope.GetTitledFirstNameNoTooltip] se volta para mim com um sorriso. \"E que palavras seu coração pode oferecer, [ROOT.Char.GetTitledFirstNameNoTooltip]?\""
 az_tour.0001.t:0 "A Recitação de um Erudito"
 az_tour.0002.a:0 "\"Um presente elegantíssimo. Estou honrado.\""
 az_tour.0002.b:0 "\"Seu gosto é requintado... quase suspeitosamente.\""
 az_tour.0002.c:0 "\"Não posso, em boa consciência, aceitar isto.\""
 az_tour.0002.desc:0 "[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] se aproxima com um sorriso e apresenta uma caixa laqueada, atada por uma fita de fino [stop_host_scope.Custom('RegionalFabric')].\n\n\"Seria vergonhoso permitir que [ROOT.Char.Custom('FormOfAddressForLiege')] partisse sem um símbolo de minha estima\", diz [stop_host_scope.GetSheHe]. \"Dentro há alguns tesouros modestos — peças de laca polidas, um verso antigo escrito com caligrafia fluida e incenso outrora apreciado nos salões de altos cargos.\" \n\nO gesto é gracioso. Mas o brilho das bandejas de prata, o raro veio da madeira [ROOT.Province.Custom('GetRandomRegionalWood')] — eles revelam recursos além do que esta posição deveria permitir. Olho novamente para o presente. É... extravagante."
 az_tour.0002.t:0 "O Custo do Refinamento"
 az_tour.0003.a:0 "Guardarei isto comigo... por enquanto."
 az_tour.0003.b.tt:0 "[stop_host_scope.GetTitledHouseNameOrFirstName] reagirá de acordo com [stop_host_scope.GetHerHis] personalidade."
 az_tour.0003.b:0 "Isso não deve ficar em silêncio."
 az_tour.0003.c:0 "Alguns assuntos é melhor deixar intocados."
 az_tour.0003.d:0 "Levarei isto diretamente ao topo!"
 az_tour.0003.desc:0 "Enquanto o [stop_host_scope.Custom('RegionalDrink')] flui e a conversa se espalha ao meu redor, [servant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima para encher minha taça. Mas, em vez de apenas servir, os dedos de [servant.GetHerHis] pressionam um pequeno bilhete dobrado em minha mão — e somem tão rápido quanto [servant.GetSheHe] veio.\n\nSob a mesa, eu o abro. Um nome. Um ato. Um escândalo. É sobre meu anfitrião: [stop_host_scope.GetTitledHouseNameOrFirstName]. A nota é breve, mas a implicação é inconfundível.\n\nE, do outro lado da mesa, [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] sorri, alheio."
 az_tour.0003.t:0 "Um Sussurro na Taça"
 az_tour.0004.a:0 "Devo concordar com a avaliação do nosso anfitrião."
 az_tour.0004.b.learning.tt:0 "Teste o novo método em um único distrito sob observação cuidadosa. Se provar ser sólido, expanda. Se não, descarte — como toda boa teoria deve permitir."
 az_tour.0004.b.learning:0 "Que a razão prevaleça. Sugiro uma resolução racional."
 az_tour.0004.b.martial.tt:0 "Equipe a guarnição para a função, não para a exibição — armaduras aptas para o campo e cavalos suficientes para patrulhas. A glória segue a disciplina, não o douramento."
 az_tour.0004.b.martial:0 "Segurança precisa ser prática, não ornamental. Deixe-me opinar."
 az_tour.0004.b.stewardship.tt:0 "Desvie uma parte do excedente para reparos urgentes e o restante para investimentos de longo prazo. Frugalidade não significa negligência."
 az_tour.0004.b.stewardship:0 "Um orçamento equilibrado serve a todos — ofereço este compromisso."
 az_tour.0004.c:0 "Isto é um jantar, não um salão de debates."
 az_tour.0004.desc.intro:0 "Entre mordidas e goles educados de [stop_host_scope.Custom('RegionalDrink')], uma conversa à mesa esquenta. [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] levanta uma questão urgente de governança — não diretamente para mim, mas claramente ao alcance de meus ouvidos.\n\n"
 az_tour.0004.desc.learning:0 "\"Esse novo método de topografia tem o apoio de textos respeitáveis\", argumenta [stop_host_scope.GetTitledHouseNameOrFirstName], com firmeza.\n\n\"E ainda assim nenhum erudito aqui atestou sua solidez\", responde [opposing_counsel.Custom2('MyCharacterIntroduction', ROOT.Char)], frio e incisivo."
 az_tour.0004.desc.martial:0 "\"Minha guarnição carece de cavalos, e você fala de armaduras de desfile?\" diz [opposing_counsel.Custom2('MyCharacterIntroduction', ROOT.Char)] de forma direta.\n\n\"Disciplina começa com orgulho em sua posição\", retruca [stop_host_scope.GetTitledHouseNameOrFirstName], com as sobrancelhas erguidas."
 az_tour.0004.desc.stewardship:0 "\"Não podemos perder mais uma moeda por tolice\", insiste [stop_host_scope.GetTitledHouseNameOrFirstName]. \"Os fundos de desenvolvimento devem ir para onde rendem o maior retorno.\"\n\n\"E ainda assim estradas racham e valas secam enquanto o tesouro permanece ocioso\", contrapõe [opposing_counsel.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 az_tour.0004.t:0 "Uma Questão de Governança"
 az_tour.0005.a:0 "\"Uma bela apresentação, apesar do acidente!\""
 az_tour.0005.b:0 "\"Mal começamos; tragam meu [ROOT.Char.Custom('GetMusicalInstrument')]!\""
 az_tour.0005.c:0 "\"Eu mal estava prestando atenção, para começo de conversa.\""
 az_tour.0005.desc:0 "Um silêncio cai sobre o salão quando um músico toca uma nota com força demais — um estalo agudo corta os murmúrios como um tapa. A melodia morre.\n\n[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] fica rígido no lugar.\n\n\"Ah — minhas desculpas\", gagueja o músico, curvando-se profundamente com o instrumento tremendo nas mãos de [musician.GetHerHis]. Alguns convidados param no meio de um gole de [stop_host_scope.Custom('RegionalDrink')], olhando ao redor incertos.\n\n[stop_host_scope.GetTitledHouseNameOrFirstName] força um sorriso, mas o rubor em [stop_host_scope.GetHerHis] bochechas é inconfundível. \"Um pequeno contratempo\", diz [stop_host_scope.GetSheHe] suavemente, com a voz tensa. \"Não vamos perder a alegria da noite por causa disso.\""
 az_tour.0005.t:0 "Uma Nota Quebrada"
 az_tour.0006.a:0 "\"Isso será investigado. Você tem a minha palavra.\""
 az_tour.0006.b:0 "\"Festivais não são para reclamações.\""
 az_tour.0006.c:0 "\"Tome um pouco de [stop_host_scope.Custom('RegionalDrink')] para acalmar a mente.\""
 az_tour.0006.desc:0 "Um grito irrompe no meio das risadas e da música do festival. Uma pessoa vestida com roupas gastas avança, o rosto avermelhado de indignação. [angry_farmer.GetSheHe|U] firma os pés no chão e eleva a voz acima da multidão.\n\n\"Trabalhamos duro nos campos, mas todo o dinheiro vai para sedas e banquetes! Vocês ficam sob lanternas, bebendo [stop_host_scope.Custom('RegionalDrink')] — mas quem olha por nós, que temos tigelas vazias?\"\n\nO festival silencia. [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me lança um olhar — cauteloso e claramente descontente."
 az_tour.0006.t:0 "Uma Interrupção Impertinente"
 az_tour.0007.a:0 "\"Que equilíbrio! A própria pincelada merece um posto.\""
 az_tour.0007.b:0 "\"Quando a primavera passa, também passam seus elogios.\""
 az_tour.0007.c:0 "\"A verdadeira arte aqui é a lisonja, não as flores.\""
 az_tour.0007.desc:0 "Sob um dossel iluminado por lanternas e ramos floridos, um atendente anuncia [elegant_noble.Custom2('MyCharacterIntroduction', ROOT.Char)]. A pessoa avança, carregando um pergaminho com uma pintura delicada. Montanhas pintadas se erguem na seda, seus picos coroados por árvores floridas, enquanto uma escrita fluida serpenteia ao lado — uma união de harmonia e força.\n\n\"As colinas podem ruir\", [elegant_noble.GetSheHe] diz com um sorriso modesto, \"mas a primavera sempre retorna — mesmo que apenas por um sopro. Isto\", [elegant_noble.GetSheHe] continua, prendendo meu olhar, \"é um reflexo do seu governo, [ROOT.Char.Custom('FormOfAddressForLiege')].\"\n\nA arte é inegável, o sentimento — desarmantemente lisonjeiro. [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] inclina a cabeça em aprovação silenciosa, aguardando minha resposta."
 az_tour.0007.t:0 "Lisonja em Flor"
 az_tour.0008.a.tt:0 "Você será recompensado dependendo da opinião de seu suserano sobre a demonstração"
 az_tour.0008.a:0 "Convidar [visiting_liege.GetTitledHouseNameOrFirstName] para julgar a demonstração."
 az_tour.0008.b:0 "Permitir que [visiting_liege.GetTitledHouseNameOrFirstName] aprecie em paz."
 az_tour.0008.desc:0 "A meu pedido, [revered_scholar.Custom2('MyCharacterIntroduction', ROOT.Char)] toma lugar sob o dossel de seda, uma plateia reunida de perto para assistir. Pincel em mãos, [revered_scholar.GetSheHe] inicia uma transcrição deliberada dos clássicos, cada caractere traçado com cuidado paciente até que o pergaminho parece respirar significado.\n\nSeria revelador, não seria, se [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] fosse a pessoa a julgar esta obra? Uma única declaração diante de todos estes olhos, e o discernimento de [visiting_liege.GetHerHis] estaria em plena exibição."
 az_tour.0008.t:0 "Pincel e Julgamento"
 az_tour.0009.a.tt:0 "Você será recompensado dependendo da opinião do suserano sobre a dança"
 az_tour.0009.a:0 "Deixem preparar a dança."
 az_tour.0009.b:0 "Nosso tempo é melhor gasto discutindo nossos deveres."
 az_tour.0009.desc:0 "A estação coincide com uma tradição local: dançarinos mascarados, vestidos em tecido brilhante e papel, executam uma dança ancestral diante de altares igualmente antigos. É rústica — barulhenta, brilhante, caótica — mas amada.\n\n[chancellor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima em silêncio. \"[visiting_liege.Custom2('MyCharacterIntroduction', chancellor)|U] chegará em breve. Talvez esta apresentação possa alegrar [visiting_liege.GetHerHim]. É humilde, mas sincera — um vislumbre da alma do povo.\"\n\nÉ um argumento sensato, mas nosso tempo é curto e precioso..."
 az_tour.0009.t:0 "Vamos Dançar?"
 az_tour.1003.a:0 "\"Mentiras e difamação. Não ouvirei mais nada!\""
 az_tour.1003.b:0 "\"Você tem meu silêncio... e o que vem com ele.\""
 az_tour.1003.c:0 "Uma fortuna para silenciar sua língua."
 az_tour.1003.d:0 "\"Abrirei mão da minha reivindicação.\""
 az_tour.1003.desc:0 "[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)|U] faz um leve gesto para que eu me junte a [visiting_liege.GetHerHim] próximo ao aposento lateral, justamente quando os serviçais começam a trocar o curso.\n\n\"[ROOT.Char.GetFirstName],\" começa [visiting_liege.GetSheHe], a voz aço envolto em seda. \"Uma carta chegou às minhas mãos — a tinta ainda fresca. Ela fala de certas... indiscrições. Seria fácil descartar tais rumores, não fossem sussurrados por mais de uma boca.\"\n\nLá fora, o tilintar de pratos e risadas baixas continuam, e a divisória projeta sombras trêmulas sobre o piso polido."
 az_tour.1003.e:0 "\"Compro seu silêncio com o meu.\""
 az_tour.1003.t:0 "Um Sussurro na Taça"
 az_tour.1005.a:0 "Uma apresentação de brilho inigualável — verdadeiramente magnífica!"
 az_tour.1005.b:0 "Que maestria! Sinto-me movido a me aprimorar."
 az_tour.1005.c.toast:0 "[stop_host_scope.GetTitledHouseNameOrFirstName] critica sua apresentação"
 az_tour.1005.c:0 "\"Esta apresentação está abaixo do status de [visiting_liege.GetHerHis].\""
 az_tour.1005.desc:0 "Um estalo seco — depois silêncio. O [ROOT.GetCharacter.Custom('GetMusicalInstrument')] se parte no meio de uma nota, e o silêncio atônito que segue é mais cortante que a própria música. Um segundo performer se atrapalha ao entrar. Um terceiro tosse nervosamente. A apresentação desmorona, uma nota errada de cada vez.\n\nAntes que eu possa me levantar ou chamar um substituto, [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)|U] avança e ergue um [visiting_liege.Custom('GetMusicalInstrument')] de seu estojo. Sem fanfarra, sem anúncio — apenas a confiança tranquila de alguém acostumado a ser ouvido.\n\nAs primeiras notas flutuam como incenso, lentas e investigativas. A conversa some. Cálices baixam. Até os servos param. [Select_CString( visiting_liege.IsFemale, 'A', 'O' )] [visiting_liege.GetTitleAsNameNoTooltip], antes meu convidado, agora comanda o salão como um artista.\n\nE quando o último acorde estremece no silêncio, tudo o que posso fazer é permanecer sentado sob o peso disso."
 az_tour.1005.t:0 "Uma Melodia Superior"
 az_tour.1006.a.toast:0 "[Select_CString( visiting_liege.IsFemale, 'A', 'O' )] [visiting_liege.GetTitleAsNameNoTooltip] elogiou sua postura diante do fazendeiro"
 az_tour.1006.a:0 "\"Uma atitude digna [Select_CString( stop_host_scope.IsFemale, 'da', 'do' )] mais [stop_host_scope.Custom('ComplimentAdjective')] [stop_host_scope.GetTitleAsNameNoTooltip]!\""
 az_tour.1006.b.toast:0 "[Select_CString( visiting_liege.IsFemale, 'A', 'O' )] [visiting_liege.GetTitleAsNameNoTooltip] desaprovou sua resposta ao fazendeiro"
 az_tour.1006.b:0 "\"Eu teria lidado com isso de outra forma.\""
 az_tour.1006.c.toast:0 "[Select_CString( visiting_liege.IsFemale, 'A', 'O' )] [visiting_liege.GetTitleAsNameNoTooltip] ignorou a confusão e manteve a atenção em [Select_CString( visiting_liege.IsFemale, 'si mesma', 'si mesmo' )]"
 az_tour.1006.c:0 "\"Desculpe, eu estava hipnotizado por essa dança tão colorida.\""
 az_tour.1006.desc.a:0 "\"Trabalhamos duro nos campos, mas todo o dinheiro vai para sedas e banquetes! Vocês ficam sob lanternas, bebendo [stop_host_scope.Custom('RegionalDrink')] — mas quem olha por nós, que temos tigelas vazias?\"\n\nO rosto do anfitrião se contrai, mas [stop_host_scope.GetSheHe] responde com calma, prometendo compensação e designando um administrador para avaliar os danos."
 az_tour.1006.desc.b:0 "\"Trabalhamos duro nos campos, mas todo o dinheiro vai para sedas e banquetes! Vocês ficam sob lanternas, bebendo [stop_host_scope.Custom('RegionalDrink')] — mas quem olha por nós, que temos tigelas vazias?\"\n\n[stop_host_scope.GetSheHe|U] sorri devagar, de forma indulgente. \"As suas tigelas não são problema meu. Guardas, prendam ess[Select_CString( angry_farmer.IsFemale, 'a', 'e' )] [angry_farmer.Custom2('InsultNoun', ROOT.Char)]!\" Um choque percorre a multidão enquanto o fazendeiro é detido pelos guardas [Select_CString( stop_host_scope.IsFemale, 'da', 'do' )] [stop_host_scope.GetFirstNameNoTooltip] e arrastado, com seus xingamentos se perdendo no som da música."
 az_tour.1006.desc.c:0 "\"Trabalhamos duro nos campos, mas todo o dinheiro vai para sedas e banquetes! Vocês ficam sob lanternas, bebendo [stop_host_scope.Custom('RegionalDrink')] — mas quem olha por nós, que temos tigelas vazias?\"\n\n[stop_host_scope.GetSheHe|U] ergue a mão suavemente, a voz calma porém firme. \"Estamos reunidos em paz. Que os ânimos se acalmem e as taças se encham — tenho certeza de que podemos ouvir sua reclamação sem tumulto.\" O fazendeiro se remexe desconfortável, ainda indignado, mas a postura muda sob o peso da formalidade."
 az_tour.1006.desc.intro:0 "A praça do mercado vibra com música e celebração, mas nem todas as vozes estão em alegria. Um fazendeiro local, ruborizado e exaltado, atravessa a multidão, encarando [stop_host_scope.GetTitledHouseNameOrFirstName]."
 az_tour.1006.t:0 "Uma Interrupção Impertinente"
 az_tour.1007.a:0 "Que [visiting_liege.GetHerHim] ria, se [visiting_liege.GetSheHe] quiser."
 az_tour.1007.b:0 "[visiting_liege.GetSheHe] humilha o meu povo!"
 az_tour.1007.desc:0 "O ar está impregnado de perfume e poesia — cada palavra escolhida, cada gesto ensaiado. Cortesãos se inclinam enquanto [elegant_noble.Custom2('MyCharacterIntroduction', ROOT.Char)] conclui o último verso, a voz suave como incenso.\n\n[visiting_liege.Custom2('MyCharacterIntroduction', SCOPE.sCharacter('stop_host_scope'))] oferece um sorriso lento e calculado. \"Quanta graça\", [visiting_liege.GetSheHe] diz, a voz lisa como laca. \"Há certo charme nessa honestidade provinciana.\" Mal consigo respirar antes que o sussurro comece — um farfalhar pelos bancos, leques inclinados para esconder risos. [visiting_liege.Custom2('MyCharacterIntroduction', SCOPE.sCharacter('stop_host_scope'))] inclina a cabeça, o sorriso deliberado, como se saboreasse o meu desconforto."
 az_tour.1007.t:0 "A Flor Murcha"
 az_tour.1008.a.toast:0 "[Select_CString( visiting_liege.IsFemale, 'A', 'O' )] [visiting_liege.GetTitleAsNameNoTooltip] elogiou muito a demonstração"
 az_tour.1008.a:0 "\"Uma exibição magistral: sutil, equilibrada, viva.\""
 az_tour.1008.b.toast:0 "[Select_CString( visiting_liege.IsFemale, 'A', 'O' )] [visiting_liege.GetTitleAsNameNoTooltip] zombou da demonstração"
 az_tour.1008.b:0 "\"Obra arrumada, embora um tanto... provinciana.\""
 az_tour.1008.c.toast:0 "[Select_CString( visiting_liege.IsFemale, 'A', 'O' )] [visiting_liege.GetTitleAsNameNoTooltip] louvou a demonstração"
 az_tour.1008.c:0 "\"A forma é admirável, mas devo considerar também o espírito.\""
 az_tour.1008.d.toast:0 "[Select_CString( visiting_liege.IsFemale, 'A', 'O' )] [visiting_liege.GetTitleAsNameNoTooltip] recusou julgar a demonstração"
 az_tour.1008.d:0 "\"Perdoe-me. Tenho outros assuntos a tratar.\""
 az_tour.1008.desc.arrogant_judgment:0 "Meus olhos reparam na precisão dos caracteres, mas algo parece excessivamente controlado, quase calculado demais. Falta calor ou espontaneidade."
 az_tour.1008.desc.generic_comment:0 "As linhas são claras e bem espaçadas. Ofereço um comentário reservado, cuidadoso para não falar além do que compreendo."
 az_tour.1008.desc.intro:0 "Sou conduzido sob o dossel de seda por [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)], onde uma multidão se reuniu. \"[revered_scholar.GetTitledHouseNameOrFirstName] nos mostrará a beleza dos clássicos.\" [revered_scholar.GetSheHe|U] faz uma reverência solene para mim e para [stop_host_scope.GetTitledHouseNameOrFirstName], toma seu lugar ao centro e desenrola um fino pergaminho. Com ritmo cuidadoso, [revered_scholar.GetSheHe] põe tinta no papel, cada traço fluindo para o próximo até que as palavras tomem forma graciosa. [stop_host_scope.GetTitleAsNameNoTooltip] me observa atentamente. \"[ROOT.Char.Custom('FormOfAddressForLiege')], seu julgamento carrega grande peso. Honraria nos concederia pronunciando seu veredito diante de todos?\"\n\n"
 az_tour.1008.desc.praise_subtle:0 "Percebo o equilíbrio cuidadoso e o movimento fluido de cada traço. A escrita parece deliberada, medida — habilidade unida a intenção refletida."
 az_tour.1008.desc.shy_discomfort:0 "O pergaminho é belo, mas um silêncio tenso preenche o ar. Mantenho minhas palavras curtas e cautelosas, incerto do quanto devo revelar."
 az_tour.1008.t:0 "O Pincel Fala"
 az_tour.1009.a.toast:0 "[Select_CString( visiting_liege.IsFemale, 'A', 'O' )] [visiting_liege.GetTitleAsNameNoTooltip] honrou a dança"
 az_tour.1009.a:0 "Aproximo-me dos dançarinos para honrá-los."
 az_tour.1009.b.toast:0 "[Select_CString( visiting_liege.IsFemale, 'A', 'O' )] [visiting_liege.GetTitleAsNameNoTooltip] presenteou os dançarinos"
 az_tour.1009.b:0 "Um pequeno presente, para honrar seu ofício."
 az_tour.1009.c.toast:0 "[Select_CString( visiting_liege.IsFemale, 'A', 'O' )] [visiting_liege.GetTitleAsNameNoTooltip] focou em suas orações"
 az_tour.1009.c:0 "É melhor eu me concentrar em minhas orações."
 az_tour.1009.desc:0 "Os tambores ecoam como cascos, risos ondulam pela multidão. Sob estandartes esvoaçantes e o aroma de incenso, aldeões vestidos em seda brilhante e fantasias de cavalo feitas de papel saltam e giram em uma antiga dança folclórica.\n\n[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me convidou para testemunhar esta celebração vibrante da herança [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip]. [stop_host_scope.GetSheHe|U] permanece próximo, orgulho claro em seu sorriso. Quando um dançarino se curva profundamente diante de mim, reconheço o respeito pela minha posição e a confiança depositada em meu julgamento."
 az_tour.1009.t:0 "A Dança Popular"
 tgp_dismissed_complaints_modifier:0 "Ignorou Reclamações"
 tgp_dismissed_complaints_modifier_desc:0 "O governante deste condado ignorou as reclamações de seus súditos"
 tgp_heard_complaints_modifier:0 "Ouviu Reclamações"
 tgp_heard_complaints_modifier_desc:0 "O governante deste condado ouviu as reclamações de seus súditos"
 tgp_mocked_elites_modifier:0 "Zombou da Elite"
 tgp_popular_festival_performance_modifier:0 "Apresentação de Festival Prestigiada"
 tgp_popular_festival_performance_modifier_desc:0 "Este condado teve um governante estimado que aprovou sua dança cultural durante um festival."
