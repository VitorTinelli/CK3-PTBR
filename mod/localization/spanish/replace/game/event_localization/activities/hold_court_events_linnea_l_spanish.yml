l_spanish:
 hold_court.5010.a:0 "Ideia curiosa, vamos tentar."
 hold_court.5010.b:0 "Você está certo, o que precisamos é de #EMP derramamento de sangue excessivo#!"
 hold_court.5010.c:0 "Não tenho tempo para isso."
 hold_court.5010.desc.outro:0 "\"[county.GetName|U] está tomada por agitação e bandidagem, [ROOT.Char.Custom('FormOfAddressForLiege')]. Doe apenas um pouco de moeda para a região e o controle poderá ser restaurado.\""
 hold_court.5010.desc:0 "Um[Select_CString( peasant.IsFemale, 'a', '' )] [peasant.GetWomanMan] camponês[Select_CString( peasant.IsFemale, 'a', '' )] se aproxima timidamente do meu trono, segurando seu chapéu.\n\n"
 hold_court.5010.desc_marshal:0 "[marshal.GetCouncilTitle] [marshal.GetTitledFirstName] se aproxima do trono.\n\n"
 hold_court.5010.t:0 "[county.GetNameNoTierNoTooltip|U] Fora de Controle"
 hold_court.5030.a:0 "Que ótima ideia!"
 hold_court.5030.b:0 "O Tutor da Corte [court_tutor.GetFirstNameNoTooltip] ajudará você a ensiná-la."
 hold_court.5030.c:0 "Podemos fazer melhor uso de seus talentos!"
 hold_court.5030.courtiers:0 "[Select_CString( courtier.IsFemale, 'Todas as Cortesãs', 'Todos os Cortesãos' )] [courtier.Custom('FemaleMale')|U]"
 hold_court.5030.desc:0 "[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me mostra uma página cheia de símbolos desconhecidos, insistindo em sua legibilidade.\n\n\"Desenvolvi uma linguagem escrita especificamente para [Select_CString( courtier.IsFemale, 'as', 'os' )] [courtier.GetWomenMen] da corte, uma vez que as letras são ensinadas principalmente [Select_CString( courtier.IsFemale, 'o', 'a' )] [courtier.Custom('WomenMenOpp')]. Se você permitir, começarei a ensinar [Select_CString( courtier.IsFemale, 'as', 'os' )] [courtier.Custom('LadiesLords')] imediatamente!\"\n\nNão posso deixar de imaginar a liberdade que tal linguagem poderia proporcionar!"
 hold_court.5030.t:0 "Linguagem Escrita"
