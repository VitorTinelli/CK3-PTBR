 hunt_opening:0 "O grupo é convocado para se reunir ao amanhecer em"
 hunt_opening_dangerous:0 "\n\nAcontece que [activity.Custom('GetAnimalType')] desavergonhado tem aterrorizado a área local ultimamente."
 hunt_opening_dangerous_sighting:0 "\n\nMeus homens têm coletado avistamentos de [activity.Custom('GetAnimalType')] que está aterrorizando a área local."
 hunt_opening_entourage_few:0 "Após reunir informações com os poucos guardas de caça locais, há algumas informações sobre pegadas e indícios nas proximidades."
 hunt_opening_entourage_few_dangerous:0 "Pode ser complicado com tão poucos, mas com sorte encontraremos a fera e acabaremos com seu reinado de terror."
 hunt_opening_entourage_few_falconry:0 "\n\nOs poucos batidores que trouxemos estão prontos com seus cães e já encontraram uma rota adequada."
 hunt_opening_entourage_many:0 "Meus numerosos guardas de caça e batidores têm vasculhado a área em busca de pegadas e indícios."
 hunt_opening_entourage_many_dangerous:0 "Temos muitos pares de olhos, sem mencionar lanças — o reinado de terror da fera acaba hoje!"
 hunt_opening_entourage_many_falconry:0 "\n\nMeus batidores não terão problemas em fazer as aves saírem do esconderijo e já observaram alguns lugares propícios."
 hunt_opening_entourage_normal:0 "Os guardas de caça locais vasculharam a área em busca de pegadas e indícios recentes."
 hunt_opening_entourage_normal_dangerous:0 "Deveria haver o suficiente de nós para encontrar e encurralar a fera sem muitos problemas."
 hunt_opening_entourage_normal_falconry:0 "\n\nAs equipes de batidores estão prontas com seus cães, e um local bem escolhido foi selecionado."
 hunt_opening_falconry:0 "Com sorte, encontraremos [activity.Custom('GetAnimalGroup')] de [activity.Custom('GetAnimalPlural')], e nossas [activity.Custom('GetRaptorPlural')] terão um ótimo esporte."
 hunt_opening_falconry_sighting:0 "\n\nEsperemos que os relatos possam ser confiáveis."
 hunt_opening_hunt_leader:0 "[hunt_participant.GetTitledFirstName] reúne o grupo enquanto o sol nasce sobre"
