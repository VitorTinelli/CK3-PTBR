l_spanish:
 artifact_wolf_pelt_desc:0 "Retirada de uma mãe à beira da morte."
 artifact_wolf_pelt_name:0 "Pele de Loba"
 every_consort_tt:0 "Cada [spouse|E] e [lover|E]"
 friend_made_me_moh:0 "[CHARACTER.GetShortUIName|U] ganhou a gratidão eterna [Select_CString( TARGET_CHARACTER.IsFemale, 'da', 'do' )] [TARGET_CHARACTER.GetShortUIName] ao conferir a posição de $master_of_hunt_court_position$"
 friend_made_me_moh_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] ganhou a gratidão eterna [Select_CString( CHARACTER.IsFemale, 'da', 'do' )] [CHARACTER.GetShortUIName] ao conferir a posição de $master_of_hunt_court_position$"
 hunt.0050.a:0 "Mal posso esperar pela próxima!"
 hunt.0050.b:0 "Apenas uma distração trivial..."
 hunt.0050.desc:0 "Corças, cervos, tocas! A caçada oferece muito para aprender e desfrutar; domínio da natureza, camaradagem e rituais, e é claro, a emoção!\n\nMuitos já se dedicaram a essas nobres, embora sangrentas, atividades antes de mim. Estou começando a entender porquê..."
 hunt.0050.t:0 "Chamado da Natureza"
 hunt.0080.a:0 "É um passatempo perigoso."
 hunt.0080.abduction:0 "A caçada parecia estar indo bem, até que alguém percebeu que [Select_CString( invalidated_flavor.IsFemale, 'a', 'o' )] [invalidated_flavor.GetTitledFirstName] não estava mais com o grupo e não podia ser encontrado.\n\nAo vasculharmos [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')], encontramos sinais de uma luta no [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')]."
 hunt.0080.abduction_attempt:0 "Conforme o grupo se aproximava da presa, os gritos estridentes de um[Select_CString( invalidated_flavor.IsFemale, 'a', '' )] [invalidated_flavor.GetWomanMan] se sobrepuseram até mesmo aos incessantes latidos dos cães.\n\nUm[Select_CString( invalidated_flavor.IsFemale, 'a', '' )] [invalidated_flavor.GetTitledFirstName] desalinhado surgiu atravessando o [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], pedindo ajuda e chorando que alguém tentou sequestrá-lo(a)!\n\n"
 hunt.0080.abduction_attempt_culprit:0 "\n\n[invalidated_flavor.GetSheHe|U] levantou suspeitas ao apontar o dedo para [Select_CString( invalidated_culprit.IsFemale, 'a', 'o' )] [invalidated_culprit.GetTitledFirstName], mas o repentino desaparecimento [invalidated_culprit.GetHerHim] apenas dá mais peso às acusações..."
 hunt.0080.abduction_culprit:0 "\n\nCom [Select_CString( invalidated_culprit.IsFemale, 'a', 'o' )] [invalidated_culprit.GetTitledFirstName] também estranhamente ausente, certas conclusões foram naturalmente tiradas..."
 hunt.0080.assassination:0 "O dia estava indo bem até que [Select_CString( invalidated_flavor.IsFemale, 'a', 'o' )] [invalidated_flavor.GetTitledFirstName] insiste repentinamente em encerrar a caçada, alegando que [invalidated_flavor.GetSheHe] está com medo por sua vida após um susto. Rumores de uma tentativa de assassinato se espalham."
 hunt.0080.assassination_culprit:0 "Estamos quase alcançando nossa presa quando um[Select_CString( invalidated_flavor.IsFemale, 'a', '' )] [invalidated_flavor.GetTitledFirstName] de aparência ameaçadora surge à vista - sua ausência até então passou despercebida.\n\nEntre ofegos, [invalidated_flavor.GetSheHe] afirma ter escapado por pouco de uma tentativa contra sua vida! Ainda mais chocante é o alvo de sua acusação: [invalidated_culprit.GetTitledFirstName]!\n\n[Select_CString( invalidated_culprit.IsFemale, 'A', 'O' )] [invalidated_culprit.GetWomanMan] não está em lugar algum, aparentemente tendo fugido do local..."
 hunt.0080.b:0 "Eu quero a cabeça dessa besta para pendurar na minha parede!"
 hunt.0080.death:0 "Com a trágica morte [Select_CString( invalidated_flavor.IsFemale, 'da', 'do' )] [invalidated_flavor.GetTitledFirstName], que [invalidated_flavor.GetDeathReasonHideKiller], foi decidido encerrar a caçada e o grupo retornar para casa."
 hunt.0080.death_inheritor:0 "Acabei de receber a notícia de que [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstName] está [Select_CString( host.IsFemale, 'morta', 'morto' )]! Parece que [host.GetSheHe] [host.GetDeathReason] enquanto caçava."
 hunt.0080.death_inheritor_killer:0 "Finalmente, [Select_CString( host.IsFemale, 'aquela maldita', 'aquele maldito' )] [host.Custom2('InsultNoun', ROOT.Char)], [host.GetTitledFirstName], está fora do caminho, e pelas minhas próprias mãos."
 hunt.0080.desc:0 "\n\nTeremos apenas que esperar pela próxima..."
 hunt.0080.desc_inheritor:0 "\n\nComo [Select_CString( ROOT.Char.IsFemale, 'a nova', 'o novo' )] [ROOT.Char.GetTitleAsNameNoTooltip] do [ROOT.Char.GetPrimaryTitle.GetNameNoTier], há muito o que organizar diante desse acontecimento inesperado..."
 hunt.0080.imprisoned:0 "Com [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstName] seguramente aprisionado [Select_CString( ROOT.Char.GetImprisonedBy.IsFemale, 'pela', 'pelo' )] [ROOT.Char.GetImprisonedBy.GetTitledFirstName], parece que teremos que retornar para casa de mãos vazias..."
 hunt.0080.imprisoned_self:0 "Seguramente aprisionado [Select_CString( ROOT.Char.GetImprisonedBy.IsFemale, 'pela', 'pelo' )] [ROOT.Char.GetImprisonedBy.GetTitledFirstName], minha caçada parece estar completamente encerrada..."
 hunt.0080.t.inheritor:0 "Vítima da Natureza"
 hunt.0080.t:0 "Conclusão Prematura"
 hunt.0080.wounded:0 "Devido aos ferimentos sofridos [Select_CString( invalidated_flavor.IsFemale, 'pela', 'pelo' )] [invalidated_flavor.GetTitledFirstName], foi decidido encerrar a caçada e o grupo retornar para casa."
 hunt.0080.wounded_self:0 "Devido aos meus ferimentos, foi decidido encerrar a caçada e o grupo retornar para casa."
 hunt.0081.a:0 "Creio que já fiz o suficiente."
 hunt.0081.b:0 "Estarei bem..."
 hunt.0081.guest:0 "\n\nSeria uma pena perder o resto da caçada [Select_CString( host.IsFemale, 'da', 'do' )] [host.GetTitledFirstName], mas vale o risco?"
 hunt.0081.host:0 "\n\nNão quero decepcionar todos, mas é preciso pensar na saúde..."
 hunt.0081.sick:0 "Nas minhas condições atuais, talvez seja melhor eu voltar para casa, para minha lareira e minha cama quente."
 hunt.0081.t:0 "Mudança de Planos"
 hunt.0081.wounded:0 "A dor torna difícil cavalgar, e me esforçar nessa condição certamente será sentido."
 hunt.0082.a:0 "Terrível!"
 hunt.0082.t:0 "Interrompido"
 hunt.0100.opening_desc:0 "Por meio desta, convido-o para uma grande caçada em [barony.GetNameNoTier]!"
 hunt.0101.desc:0 "Por meio desta, convido-o para uma caçada em [barony.GetNameNoTier]! Será um evento grandioso, digno de sua honrosa presença."
 hunt.0102.desc:0 "Por meio desta, convido-o para uma caçada em [barony.GetNameNoTier]! Será um evento grandioso, com ótimo esporte e companhia."
 hunt.0110.desc:0 "Não posso acreditar. Apesar dos meus convites e preparativos, nenhum convidado apareceu para minha caçada.\n\nNão importa! Vou desfrutar do esporte sozinho; toda a glória será minha!"
 hunt.0110.t:0 "Uma Participação Desanimadora"
 hunt.0120.desc:0 "Por que você aceitaria meu convite apenas para comparecer à caçada [Select_CString( other_host.IsFemale, 'da', 'do' )] [other_host.GetTitledFirstName]? Não entendo, mas saiba que vou me lembrar disso."
 hunt.0500.a:0 "Vamos lá!"
 hunt.0500.b:0 "Prefiro espantar uma raposa."
 hunt.0500.bison:0 "Um rebanho de bisões está próximo, e entre eles há um touro poderoso!"
 hunt.0500.boar:0 "Há claramente um javali robusto na região - um jogo perigoso, mas valioso."
 hunt.0500.buck:0 "Há definitivamente um veado robusto na região, e as condições dificilmente poderiam ser melhores para caçá-lo!"
 hunt.0500.c:0 "Vamos cercar uma lebre astuta."
 hunt.0500.d:0 "Eu vim para caçar um [host.Custom('GetRegionalDeerType')]"
 hunt.0500.desc_large:0 "\n\n[hunt_participant.GetFirstNameNoTooltip] sorri. 'Isso deve ser divertido!'"
 hunt.0500.desc_prestigious:0 "\n\n[hunt_participant.GetFirstNameNoTooltip] sorri. 'Temos uma grande caçada pela frente!'"
 hunt.0500.desc_small:0 "\n\n[hunt_participant.GetFirstNameNoTooltip] dá de ombros. 'Não importa, [activity.Custom('GetAnimalType')] [activity.Custom('GetAnimalAdjective')] ainda pode proporcionar um esporte fantástico!'"
 hunt.0500.f:0 "Quero caçar algo com energia!"
 hunt.0500.guest:0 "\n\nNo final, [host.GetTitledFirstName] decidiu que queria caçar [activity.Custom('GetAnimalType')] hoje."
 hunt.0500.hart:0 "Parece que um cervo magnífico está indiscutivelmente na área — uma presa digna!"
 hunt.0500.no_bison:0 "Disseram-me que não há sinais de um veado ou rebanho de bisões por perto, embora o terreno seja adequado para uma caçada de [activity.Custom('GetAnimalType')]."
 hunt.0500.no_deer:0 "Embora tristemente não haja sinal de um veado na região, evidentemente há muitos(a) [activity.Custom('GetAnimalPlural')]."
 hunt.0500.roe:0 "Há claramente um pequeno veado próximo, mas não há vestígios recentes de presas maiores."
 hunt.0500.t.boar:0 "Javali Poderoso"
 hunt.0500.t.hart:0 "Presas Nobres"
 hunt.0500.t.large:0 "Boas Perspectivas"
 hunt.0500.t.sighting:0 "Rastreando o(a) [activity.Custom('GetAnimalType')]"
 hunt.0500.t.small:0 "Escolhas Limitadas"
 hunt.0510.a:0 "A besta será minha!"
 hunt.0510.desc:0 "\n\nEles não encontraram nada, mas eu sinto: a criatura elusiva está lá fora, em algum lugar próximo..."
 hunt.0510.t:0 " [activity.Custom('GetAnimalType')|U] [activity.Custom('GetLegendaryColor')]"
 hunt.0520.a:0 "Não há tempo a perder."
 hunt.0520.b:0 "Traga [ROOT.Char.Custom('GetAnimalTypeCaptive')]! Vamos caçar!"
 hunt.0520.bear:0 "Ele ronda as [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTreePlural')], roubando animais de fazendas próximas e aterrorizando os que colhem."
 hunt.0520.c:0 "Certamente há alguns [ROOT.Char.Custom('GetRegionalWolfPlural')] por aqui."
 hunt.0520.cat:0 "Já causou a morte de várias pessoas da região e fica mais audacioso(a) a cada dia que é permitido vagar livremente."
 hunt.0520.t.bear:0 "Orientando-nos"
 hunt.0520.t.hyena:0 "Quem Está Rindo Agora?"
 hunt.0520.t.leopard:0 "Presa Manchada"
 hunt.0520.t.lion:0 "Ouro de Cabelo"
 hunt.0520.t.lynx:0 "Presa Elegante"
 hunt.0520.t.sighting:0 "[activity.Custom('GetAnimalType')|U] Problemático"
 hunt.0520.t.tiger:0 "Felis Horribilis"
 hunt.0520.t.wolf:0 "Matilha de Pestes"
 hunt.0520.wolf:0 "[activity.Custom('GetAnimalGroup')|U] é um incômodo, se alimentando de carcaças de fazendas e se refugiando nas [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTreePlural')]."
 hunt.0530.b:0 "Acho que [activity.Custom('GetAnimalTypeWaterfowl')] será suficiente."
 hunt.0530.c:0 "Sempre há [activity.Custom('GetAnimalTypeGamebird')] para capturar."
 hunt.0530.d:0 "Gostaria de ver meu [activity.Custom('GetRaptorType')] pegar uma lebre."
 hunt.0530.t.common:0 "Pelos Ares"
 hunt.0530.t.rare:0 "Aves Exóticas"
 hunt.0530.t.sighting:0 "Perseguindo [activity.Custom('GetAnimalPlural')]"
 hunt.0540.a:0 "[moh_candidate_1.GetFirstNameNoTooltip|U] é [Select_CString( moh_candidate_1.IsFemale, 'a', 'o' )] melhor [Select_CString( moh_candidate_1.IsFemale, 'candidata', 'candidato' )]."
 hunt.0540.b:0 "Posso confiar em [moh_candidate_2.GetFirstNameNoTooltip|U]."
 hunt.0540.c:0 "[moh_candidate_3.GetFirstNameNoTooltip|U] está entusiasmado(a)."
 hunt.0540.d:0 "Não preciso de ninguém."
 hunt.0540.desc.candidate_a:0 "De longe, [Select_CString( moh_candidate_1.IsFemale, 'a', 'o' )] [moh_candidate_1.GetWomanMan] [Select_CString( moh_candidate_1.IsFemale, 'mais qualificada', 'mais qualificado' )] para o cargo é [moh_candidate_1.GetName], e [moh_candidate_1.GetSheHe] parece [Select_CString( moh_candidate_1.IsFemale, 'ansiosa', 'ansioso' )] para se provar.\n\n"
 hunt.0540.desc.enthusiasm:0 "[moh_candidate_3.Custom2('MyCharacterIntroduction', ROOT.Char)|U] parece estar firmemente decidido(a) a ocupar o cargo, embora [moh_candidate_3.GetSheHe] não seja tão apto(a) quanto [moh_candidate_1.GetFirstNameNoTooltip].\n\n"
 hunt.0540.desc.hates_candidate_a:0 "Por mais que eu relute em admitir, [host.Custom2('InsultAdjective', ROOT.Char)] [moh_candidate_1.GetFirstName] é o mais qualificado para o cargo.\n\n"
 hunt.0540.desc.intro:0 "Minha caçada está prestes a começar e ainda não nomeei um [ROOT.Char.Custom('GetHuntMasterDesc')]. Eu poderia, é claro, assumir essas responsabilidades eu mesmo, mas todo bom [ROOT.Char.GetTitleAsNameNoTooltip|U] deve saber quando delegar."
 hunt.0540.desc.nepotism:0 "No entanto, [moh_candidate_2.Custom2('MyCharacterIntroduction', ROOT.Char)] seria um candidato adequado e confiável, como eu poderia pedir.\n\n"
 hunt.0540.desc.outro:0 "Mas não sou obrigado(a) a nomear ninguém, afinal."
 hunt.0540.t:0 "Um Mestre da Caçada"
 hunt.0550.a:0 "Em breve."
 hunt.0550.falconry:0 "Minha ave fica inquieta esperando, sabendo que em breve será liberada..."
 hunt.0550.guest:0 "Enquanto aguardamos a chegada do restante dos convidados, [host.GetTitledFirstName] já iniciou os preparativos. Seus [host.Custom('GetGameKeepers')] inspecionam diariamente as [activity.GetCurrentPhase.GetLocation.Custom('GetTerrainLandPlural')] em busca de sinais de caça, ao mesmo tempo em que montam um acampamento mais próximo dos terrenos de caça.\n\n"
 hunt.0550.host:0 "Enquanto esperamos a chegada dos demais convidados, meus [ROOT.Char.Custom('GetServants')] podem começar os preparativos. Os [ROOT.Char.Custom('GetGameKeepers')] verificam as [activity.GetCurrentPhase.GetLocation.Custom('GetTerrainLandPlural')] todos os dias em busca de sinais de presa, enquanto estabelecem um acampamento mais próximo dos locais de caça.\n\n"
 hunt.0550.intent:0 "\n\n[ROOT.Char.GetIntentTarget.GetTitledFirstName] ainda não chegou, não vai demorar para que meu plano de [ROOT.Char.GetInvolvedActivityIntent.GetName|l] [ROOT.Char.GetIntentTarget.GetSheHe] possa avançar."
 hunt.0550.intent_arrived:0 "\n\n[ROOT.Char.GetIntentTarget.GetTitledFirstName] permanece totalmente inconsciente do meu plano de [ROOT.Char.GetInvolvedActivityIntent.GetName|l] [ROOT.Char.GetIntentTarget.GetSheHe]."
 hunt.0550.legendary:0 "Lá fora, em algum lugar, [activity.Custom('GetAnimalType')] [activity.Custom('GetLegendaryColor')] espera e observa..."
 hunt.0550.nerge.guest.desc:0 "Enquanto aguardamos a chegada do restante dos convidados, [host.GetTitledFirstName] já iniciou os preparativos. seus [host.Custom('GetGameKeepers')] estão definindo em qual área os participantes irão reunir todos os animais para o grande Nerge. Conhecer o território é o primeiro de muitos passos rumo ao sucesso.\n\n"
 hunt.0550.nerge.host.desc:0 "Enquanto aguardamos a chegada do restante dos convidados, meus [ROOT.Char.Custom('GetServants')] já podem começar os preparativos. Os [ROOT.Char.Custom('GetGameKeepers')] estão definindo em qual área os participantes irão reunir todos os animais para o grande Nerge. Conhecer o território é o primeiro de muitos passos rumo ao sucesso.\n\n"
 hunt.0550.nerge:0 "Meu cavalo está tão empolgado com as perspectivas da caçada quanto eu. Ele sabe que grandes desafios nos aguardam nos próximos dias."
 hunt.0550.sighting:0 "[activity.Custom('GetAnimalPlural')|U] estão perto... Eu posso sentir..."
 hunt.0550.standard:0 "Eu verifiquei meu equipamento e cavalo várias vezes, não vai demorar agora..."
 hunt.0550.t:0 "Montando Acampamento"
 hunt.1001.a.flavor_1:0 "#EMP Avante!#!"
 hunt.1001.a.flavor_2:0 "#EMP Vamos à caça!#!"
 hunt.1001.a.flavor_3:0 "#EMP Halloo!#!"
 hunt.1001.a.flavor_4:0 "#EMP Avaunt!#!"
 hunt.1001.a.tt:0 "Um acidente será mais provável de ocorrer"
 hunt.1001.a:0 "Após ele(a)! Vamos montar!"
 hunt.1001.b.flavor:0 "#EMP Segurança em primeiro lugar!#!"
 hunt.1001.b:0 "Com calma! Cuidado com o(a) [host.GetCurrentLocation.Custom('GetRandomRegionalDanger')]!"
 hunt.1001.bison:0 "\n\nColocando o grupo cuidadosamente em posição, avançamos sobre as bestas [activity.Custom('GetAnimalSoundParticiple')], separando um(a) [activity.Custom('GetAnimalMale')] digno(a) do grupo em pânico.\n\n"
 hunt.1001.c.flavor:0 "#EMP Caçadores, levem-no em direção à nossa linha de arco!#!"
 hunt.1001.c:0 "Por aqui, vamos encurralá-lo(a)!"
 hunt.1001.closing:0 "Ele(a) trava os olhos comigo e — quase como se o animal sentisse minha intenção — de repente dispara em um flash de pelo [activity.Custom('GetAnimalColor')]."
 hunt.1001.closing_ambush:0 "[host.GetTitledFirstName] pensa por um momento, antes de fazer um gesto para a esquerda: 'Vamos, vamos cortar o caminho dela!'"
 hunt.1001.closing_chase:0 "[host.GetTitledFirstName] parte atrás da fera, gritando: 'Vamos, ela está escapando!'"
 hunt.1001.closing_dangerous:0 "Sem aviso, ele(a) se [activity.Custom('GetAnimalChargePresent')] em um flash de pelo [activity.Custom('GetAnimalColor')], desaparecendo atrás de uma elevação!"
 hunt.1001.closing_herd:0 "Nos reunimos entre [activity.Custom('GetAnimalType')] solitário e [activity.Custom('GetAnimalGroup')] em fuga. Agora começa a verdadeira perseguição!"
 hunt.1001.closing_plural_dangerous:0 "Perseguimos os vermes [activity.Custom('GetAnimalColor')] em fuga, focando no maior do grupo. Agora começa a verdadeira perseguição!"
 hunt.1001.d:0 "Vamos lá!"
 hunt.1001.desc:0 "\n\nO [activity.Custom('GetAnimalMale')] [activity.Custom('GetAnimalAdjective')] é difícil de distinguir, mas não há dúvidas de que está ali, nos observando através da [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')].\n\n"
 hunt.1001.desc_dangerous:0 "\n\nA fera [activity.Custom('GetAnimalAdjective')] é um espetáculo a ser visto. Os cavalos ficam nervosos ao avistarem suas [activity.Custom('GetAnimalFeature')] entre as [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')].\n\n"
 hunt.1001.desc_opening:0 "Olhando para a paisagem, faço uma pausa repentina. Lá está, [activity.Custom('GetAnimalFeature')] e tudo mais!"
 hunt.1001.desc_opening_courtier:0 "[Select_CString( hunt_participant.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)], [hunt_participant.GetTitledFirstName], é [Select_CString( hunt_participant.IsFemale, 'a primeira', 'o primeiro' )] a avistar sua [activity.Custom('GetAnimalFeature')]."
 hunt.1001.desc_opening_courtier_dangerous:0 "[Select_CString( hunt_participant.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)], [hunt_participant.GetTitledFirstName], avista [activity.Custom('GetAnimalType')] nos observando de longe, seu corpo tenso — pronto para correr."
 hunt.1001.desc_opening_courtier_plural:0 "[Select_CString( hunt_participant.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)], [hunt_participant.GetTitledFirstName], é [Select_CString( hunt_participant.IsFemale, 'a primeira', 'o primeiro' )] a avistar [activity.Custom('GetAnimalGroup')]."
 hunt.1001.desc_opening_courtier_plural_dangerous:0 "[Select_CString( hunt_participant.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)], [hunt_participant.GetTitledFirstName], sinaliza por todo o [host.GetCurrentLocation.Custom('GetTerrainType')] — [activity.Custom('GetAnimalGroup')] de [activity.Custom('GetAnimalType')] se agacha em um buraco não muito longe."
 hunt.1001.desc_opening_dangerous:0 "Observando a [host.GetCurrentLocation.Custom('GetTerrainType')], de repente o vejo, como se estivesse lá o tempo todo: [activity.Custom('GetAnimalType')]!"
 hunt.1001.desc_opening_plural:0 "Olhando para a paisagem, faço uma pausa repentina. Lá está, [activity.Custom('GetAnimalGroup')]!"
 hunt.1001.desc_opening_plural_dangerous:0 "Observando a [host.GetCurrentLocation.Custom('GetTerrainType')], de repente os vejo, como se estivessem lá o tempo todo: [activity.Custom('GetAnimalGroup')]!"
 hunt.1001.t:0 "Encurralando [activity.Custom('GetAnimalType')]"
 hunt.1001.wolf:0 "\n\nAs bestas se levantam ao nos aproximarmos, [activity.Custom('GetAnimalSoundParticiple')] o alarme enquanto recuam para a [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], rosnando de [activity.Custom('GetAnimalDanger')].\n\n"
 hunt.1002.a.alone:0 "Tão perto, quase te alcanço!"
 hunt.1002.a:0 "Vamos, [hunt_participant.GetFirstNameNoTooltip], mais rápido!"
 hunt.1002.alone:0 "Avançando em alta velocidade pela trilha, tudo o que ouço é o estrondo dos cascos, latidos dos cães, homens gritando...\n\nA excitação me percorre enquanto nos aproximamos lentamente da nossa presa!"
 hunt.1002.courtier:0 "Montando lado a lado com [Select_CString( hunt_participant.IsFemale, 'a', 'o' )] [hunt_participant.GetTitledFirstName], tudo o que ouço é o estrondo dos cascos, latidos dos cães, homens gritando...\n\nA excitação me percorre enquanto nos aproximamos lentamente da nossa presa!"
 hunt.1002.desc:0 "Meu mundo se estreita para a natureza ao nosso redor enquanto seguimos os cães por terreno acidentado no rastro de [activity.Custom('GetAnimalType')] em fuga.\n\n"
 hunt.1003.a.flavor:0 "$hunt.1012.a.tt$"
 hunt.1003.a.small:0 "Aguarde! Quero praticar minha mira."
 hunt.1003.a:0 "Vou atirar nele."
 hunt.1003.b.flavor:0 "#EMP Tome isso, brutamontes!#!"
 hunt.1003.b.small:0 "Eu o finalizo."
 hunt.1003.b:0 "Vou derrubá-lo eu mesmo!"
 hunt.1003.bay:0 "O animal exausto e em pânico se encontra encurralado, lutando para ficar em pé e [activity.Custom('GetAnimalSoundParticiple')] em desespero."
 hunt.1003.bison:0 "\n\nEnfrentar [activity.Custom('GetAnimalType')] poderoso tão de perto, especialmente um que [activity.Custom('GetAnimalStrikeParticiple')] violentamente, é suficiente para evocar terror até [Select_CString( ROOT.Char.IsFemale, 'na', 'no' )] [ROOT.Char.GetWomanMan] mais corajos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], mas os cães e caçadores o cercam devidamente."
 hunt.1003.boar:0 "\n\n[activity.Custom('GetAnimalType')|U] orgulhoso grita terrivelmente, presas afiadas prontas para partir ao meio qualquer um que se aproxime, enquanto é cercado por cães acanhados e caçadores."
 hunt.1003.c:0 "[hunt_participant.GetFirstNameNoTooltip], o tiro é seu."
 hunt.1003.claws:0 "\n\nOs caçadores o cercam timidamente com suas lanças enquanto ele ataca com suas garras mortais."
 hunt.1003.d.bad:0 "[intentee.GetFirstNameNoTooltip]! Ele é todo seu!"
 hunt.1003.d.good:0 "Dou a [intentee.GetFirstNameNoTooltip] a honra."
 hunt.1003.d.small:0 "Tenha cuidado com este, [ROOT.Char.Custom2('RelationToMe', hunt_participant)]!"
 hunt.1003.d:0 "[ROOT.Char.Custom2('RelationToMeShort', hunt_participant)|U], vamos ver você matá-lo!"
 hunt.1003.dangerous:0 "Seja por cansaço ou desafio, [activity.Custom('GetAnimalType')] finalmente para, vira-se para nós e solta um poderoso [activity.Custom('GetAnimalSound')]."
 hunt.1003.deer:0 "\n\nO ar ressoa com o som dos chifres, latidos dos cães e os gritos da comitiva enquanto o círculo se fecha ao redor do [activity.Custom('GetAnimalMale')] desafiante."
 hunt.1003.desc:0 "Após horas de cavalgada, finalmente estamos encurralando a astuta fera — nossa perseguição não foi em vão!\n\n"
 hunt.1003.dogs:0 "O cansado [activity.Custom('GetAnimalMale')] está esgotado: já foi mordido por um cão, agachando-se em terror enquanto os cães se aproximam, contidos pelos tratadores."
 hunt.1003.e.flavor:0 "#EMP Dois à esquerda, dois à direita!#!"
 hunt.1003.e:0 "Lanças prontas! Avançar!"
 hunt.1003.f.flavor:0 "#EMP Eles mereceram!#!"
 hunt.1003.f.killed:0 "...mas são feridos"
 hunt.1003.f.success:0 "Os cães o derrubam"
 hunt.1003.f:0 "Soltem os cães!"
 hunt.1003.fangs:0 "\n\nOs caçadores cercam rapidamente o animal rosnando, que me encara com presas à mostra, espumando e pingando saliva."
 hunt.1003.fox:0 "\n\n[activity.Custom('GetAnimalType')|U] aterrorizado está percebendo que não consegue escapar, enquanto os cães e caçadores se posicionam ao redor dele."
 hunt.1003.g.flavor:0 "#EMP Nós o caçamos, não há necessidade de derramar seu sangue...#!"
 hunt.1003.g:0 "Parem! Libertem o pobre animal."
 hunt.1003.h.flavor:0 "#EMP Eu... garantirei que ele não passe por vocês...#!"
 hunt.1003.h:0 "Avancem, caçadores, matem-no!"
 hunt.1003.hare:0 "\n\nEle nos deu, especialmente aos cães, uma perseguição incrível, correndo, saltando e se escondendo entre cada buraco e arbusto do(a) [host.GetCurrentLocation.Custom('GetTerrainType')] — mas o pegamos no final!"
 hunt.1003.hart:0 "\n\n[activity.Custom('GetAnimalType')|U] poderoso, com pontas de galhada eriçadas, ainda tem alguma luta em si, [activity.Custom('GetAnimalSoundParticiple')] enquanto cães e lanças o cercam."
 hunt.1003.i.flavor:0 "#EMP Seria uma pena se minha lança escapasse...#!"
 hunt.1003.i:0 "Rápido [murder_target.GetFirstNameNoTooltip], comigo, antes que ele escape!"
 hunt.1003.injured:0 "\n\n[wounded_courtier.GetTitledFirstName] ficará furios[Select_CString( wounded_courtier.IsFemale, 'a', 'o' )] por [wounded_courtier.GetSheHe] ter perdido isso!"
 hunt.1003.j:0 "Eu o quero #EMP vivo#!!"
 hunt.1004.a.tt:0 "Aguarde só!"
 hunt.1004.a:0 "A maldita coisa sumiu!"
 hunt.1004.b:0 "[wounded_guest.GetFirstNameNoTooltip] nos atrasou, o tolo!"
 hunt.1004.desc:0 "Mal conseguimos acompanhar a maldita fera enquanto ela ziguezagueia pelo(a) [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], [activity.Custom('GetAnimalSoundParticiple')] descontroladamente.\n\nEscalando um declive e desaparecendo em um denso arbusto, [activity.Custom('GetAnimalType')] some tão rapidamente quanto apareceu, deixando apenas cães ofegantes e cavalos suados."
 hunt.1004.wounded:0 "\n\n\"Talvez não tenha sido sábio esperar [Select_CString( hunt_participant.IsFemale, 'pela', 'pelo' )] [hunt_participant.GetTitledFirstName]..."
 hunt.1004.wounded_host:0 "\n\nQue maldita s- *argh* sorte... Talvez eu devesse ter voltado para o acampamento..."
 hunt.1005.a:0 "#EMP Como#! isso pôde acontecer...?"
 hunt.1005.desc:0 "Habilmente, me lanço para o(a) [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')], minha lança 'descontrolada' cortando lateralmente a garganta [Select_CString( murder_target.IsFemale, 'da', 'do' )] [murder_target.GetFirstName] rápido demais para ser evitado — quase rápido demais para ser visto.\n\nA festa chocada para em seus rastros enquanto [hunt_participant.GetFirstNameNoTooltip] segura sua ferida em choque. \"Ajuda!\" eu grito, \"[murder_target.GetFirstNameNoTooltip] está ferido(a)!\", antes de me colocar entre [murder_target.GetSheHe] e [activity.Custom('GetAnimalType')].\n\nQuando a poeira baixa, todos estão convencidos de que foi apenas um acidente trágico..."
 hunt.1005.opening:0 "Cercamos [activity.Custom('GetAnimalType')] [activity.Custom('GetAnimalSoundParticiple')], lanças eriçadas, mas meus olhos estão em [Select_CString( murder_target.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', murder_target)], [murder_target.GetFirstName], observando uma oportunidade...\n\n"
 hunt.1005.opportunity:0 "Quando o(a) [activity.Custom('GetAnimalMale')] assustado de repente [activity.Custom('GetAnimalStrikePresent')],"
 hunt.1005.t:0 "Uma Lança para [murder_target.GetFirstNameNoTooltip]"
 hunt.1006.a:0 "Sortudo(a) maldito! Você deveria estar morto(a)!"
 hunt.1006.b:0 "Desculpe! [participant_to_blame.GetFirstNameNoTooltip] me empurrou!"
 hunt.1006.c:0 "Fique fora do meu caminho da próxima vez, tolo!"
 hunt.1006.desc:0 "Desajeitadamente, finjo me afastar para o lado, mandando minha lança diretamente no lado uivante [Select_CString( murder_target.IsFemale, 'da', 'do' )] [murder_target.GetFirstName]!\n\nEmbora não seja tão letal quanto eu esperava, com sorte, essa ferida terá seu efeito. Abatemos o(a) [activity.Custom('GetAnimalMale')] enquanto [murder_target.GetSheHe] é arrastado(a) para longe..."
 hunt.1007.a.failure:0 "[murder_target.GetFirstNameNoTooltip] confia em você"
 hunt.1007.a.success:0 "[murder_target.GetFirstNameNoTooltip] está desconfiado(a)"
 hunt.1007.a:0 "Ops! #weak shrug#!"
 hunt.1007.b:0 "Considere-se sortudo(a) de não ter sido pior."
 hunt.1007.c:0 "Caramba, vamos ver se você consegue desviar #EMP disso#!, vira-lata!"
 hunt.1007.d:0 "Sinto muito, [murder_target.GetFirstNameNoTooltip]!"
 hunt.1007.desc:0 "Finjo perder o equilíbrio, fazendo minha lança arrastar pelo lado [murder_target.GetHerHim] enquanto [murder_target.GetSheHe] geme de dor.\n\nFica imediatamente claro que eu só arranhei [murder_target.GetSheHe], mas o olhar chocado [murder_target.GetHerHim] e as sobrancelhas levantadas dos outros caçadores exigem uma resposta assim que abatermos o(a) [activity.Custom('GetAnimalMale')]..."
 hunt.1007.e:0 "Acho que você não me deve mais nada."
 hunt.1008.a:0 "Droga..."
 hunt.1008.desc:0 "Tento me posicionar de forma a dar uma estocada rápida 'acidentalmente', mas [murder_target.GetFirstNameNoTooltip] simplesmente não fica parado(a)...\n\nAntes que eu perceba, o grupo já feriu mortalmente o(a) [activity.Custom('GetAnimalMale')], e um 'acidente' seria ridículo demais para ser acreditado..."
 hunt.1009.desc:0 "Conforme [activity.Custom('GetAnimalType')] desaparece no(a) [host.GetCurrentLocation.Custom('GetTerrainType')], sei que a caça está perdida."
 hunt.1009.desc_injured:0 "\n\nÉ lamentável que [Select_CString( hunt_participant.IsFemale, 'a', 'o' )] [hunt_participant.GetTitledFirstName] tenha se machucado por causa de [activity.Custom('GetAnimalType')] escapado, mas esses riscos fazem parte da emoção."
 hunt.1009.desc_uninjured:0 "\n\nDescemos dos cavalos para descansá-los, e [Select_CString( hunt_participant.IsFemale, 'a', 'o' )] [hunt_participant.GetTitledFirstName] acena com a cabeça em sinal de simpatia."
 hunt.1011.a:0 "Você está agindo como uma criança e será punido como tal."
 hunt.1011.b:0 "Isso não é forma de um(a) [murder_target.GetTitleTierName] se comportar."
 hunt.1011.c:0 "Hah, [nice_courtier.GetFirstNameNoTooltip] ficou vermelho(a) como um pimentão!"
 hunt.1011.desc_horse:0 "Assim que [Select_CString( nice_courtier.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', nice_courtier)], [nice_courtier.GetTitledFirstName], começou a desmontar, as pernas ainda balançando da sela, [Select_CString( murder_target.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('DescriptorNegative', murder_target)] [ROOT.Char.Custom2('RelationToMe', murder_target)], [murder_target.GetTitledFirstName], fez questão de esbarrar no cavalo [nice_courtier.GetHerHim], fazendo [nice_courtier.GetSheHe] cair no chão."
 hunt.1011.desc_talk:0 "Enquanto caminhamos em grupo, ouço [Select_CString( murder_target.IsFemale, 'a', 'o' )] [murder_target.GetTitledFirstName] atrás de mim, sibilando de cima de sua montaria de caça:\n\n\"Olhe só para aquel[Select_CString( nice_courtier.IsFemale, 'a', 'e' )] [nice_courtier.Custom2('InsultNoun', SCOPE.sC('murder_target'))] [nice_courtier.Custom2('InsultAdjective', SCOPE.sC('murder_target'))]!\"\n\n[murder_target.GetSheHe|U] aponta para [Select_CString( nice_courtier.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', nice_courtier)], [nice_courtier.GetTitledFirstName], que parece ter dificuldade em suportar os insultos."
 hunt.1011.t:0 "Vassalo Rude"
 hunt.1012.a.accomplice:0 "Uma pena não termos visto [murder_target.GetSheHe]..."
 hunt.1012.a.tt:0 "#EMP Pluft!#!"
 hunt.1012.a:0 "Uma pena não ter visto [murder_target.GetSheHe]..."
 hunt.1012.accomplice:0 "Dou uma olhada em [accomplice.GetFirstName], que assente quase imperceptivelmente, testa franzida de determinação, aguardando meu sinal."
 hunt.1012.alone:0 "Dou uma olhada ao redor sorrateiramente - essa pode ser a melhor oportunidade que terei..."
 hunt.1012.b.flavor:0 "#EMP A hora [murder_target.GetHerHim|U] chegará...#!"
 hunt.1012.b:0 "Não, esse não é o momento..."
 hunt.1012.closing:0 "O(a) [activity.Custom('GetAnimalMale')] se aproxima, está quase sobre nós..."
 hunt.1012.desc:0 "[Select_CString( murder_target.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('DescriptorNegative', murder_target)] [ROOT.Char.Custom2('RelationToMe', murder_target)] se agacha na [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] à minha frente, completamente [Select_CString( murder_target.IsFemale, 'concentrada', 'concentrado' )] no(a) [activity.Custom('GetAnimalMale')] que se aproxima.\n\n"
 hunt.1012.opening:0 "Arco em mãos, passos silenciosos, olhos na [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] enquanto aguardo o(a) [activity.Custom('GetAnimalType')]... Respiro fundo e — é [murder_target.GetTitledFirstName]?\n\n"
 hunt.1012.t:0 "Uma Flecha para [murder_target.GetFirstNameNoTooltip]"
 hunt.1013.a:0 "Inadmissível! Esta caçada acabou!"
 hunt.1013.b:0 "Uma tragédia. Agora, onde está o(a) [activity.Custom('GetAnimalType')]?"
 hunt.1013.desc:0 "\"Eu #EMP tentei#! intervir, mas antes que eu percebesse, [activity.Custom('GetAnimalType')] havia atropelado [murder_target.GetSheHe]! Pelo menos [murder_target.GetSheHe] não teve que morrer sozinho(a)...\"\n\nOs outros não se interessam pela minha descrição da trágica morte [Select_CString( murder_target.IsFemale, 'da', 'do' )] [murder_target.GetTitledFirstName].\n\n\"Eu só gostaria de ter feito mais...\""
 hunt.1014.a:0 "Nesse caso, foi um acerto perfeito, não foi?"
 hunt.1014.all_honorable_hunt_participants:0 "Participantes Honráveis da [activity.GetShortName]:"
 hunt.1014.all_who_dislike_or_are_evil:0 "Participantes da [activity.GetShortName] que não gostam [Select_CString( murder_target.IsFemale, 'da', 'do' )] [murder_target.GetShortUIName], ou gostam de causar sofrimento:"
 hunt.1014.b:0 "Não foi [participant_to_blame.GetFirstNameNoTooltip] que estava logo atrás de você...?"
 hunt.1014.c:0 "Você quer colocar sua própria falta de jeito na nossa conta?"
 hunt.1014.desc:0 "Enquanto [Select_CString( murder_target.IsFemale, 'a', 'o' )] [murder_target.GetTitledFirstName] sai cambaleando da [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], segurando o braço ensanguentado, eu olho para cima da minha bolsa de água e deixo escapar um suspiro muito convincente.\n\n\"#EMP Quem#! ainda precisa aprender que é a #EMP fera que devemos atingir#!?\" [murder_target.GetSheHe] grita com raiva ao se aproximar."
 hunt.1015.a:0 "Oh céus, vamos cuidar desse braço!"
 hunt.1015.b:0 "É melhor você #EMP esquecer#! tudo sobre isso."
 hunt.1015.c:0 "Eu nunca erro duas vezes."
 hunt.1015.d:0 "Foi um... acidente infeliz."
 hunt.1015.desc:0 "\"[ROOT.Char.GetTitledFirstNameNoTooltip]?! Argh! É você, [ROOT.Char.Custom('FormOfAddressForLiege')]?\"\n\n[murder_target.GetTitledFirstName] olha atônito(a) para o arco em minha mão e a flecha cravada em seu braço.\n\n\"O que você estava pensando?!\""
 hunt.1015.e:0 "Eu tenho maneiras de fazer [murder_target.GetSheHe] esquecer."
 hunt.1016.a:0 "Espere só um pouco, [murder_target.GetFirstNameNoTooltip]..."
 hunt.1016.desc:0 "\"[ROOT.Char.GetTitledFirstNameNoTooltip], é #EMP você#!?\"\n\n[murder_target.GetTitledFirstName] olha do meu arco para a flecha cravada no chão aos pés [murder_target.GetHerHim] e volta novamente.\n\n\"Hah! Tendo dificuldade com sua mira como sempre, [ROOT.Char.Custom('FormOfAddressForLiege')]?\""
 hunt.1021.a:0 "Talvez eu possa ficar só um #EMP pouco#! mais..."
 hunt.1021.b.appropriate:0 "Isso seria completamente inadequado!"
 hunt.1021.b.cruel:0 "Ficar com você, um camponês sujo?!"
 hunt.1021.b.purpose:0 "Estou aqui para caçar, nada mais."
 hunt.1021.b.thrill:0 "Há presas mais emocionantes me esperando!"
 hunt.1021.c.failure:0 "Uma Vida Simples"
 hunt.1021.c.failure_tt:0 "[beautiful_peasant.GetFirstNameNoTooltip] permanece na floresta"
 hunt.1021.c.success:0 "Uma Vida na [ROOT.Char.Custom('GetCourt')|U]"
 hunt.1021.c:0 "Por favor, [beautiful_peasant.GetFirstNameNoTooltip], deixe-me te estabelecer na [ROOT.Char.Custom('GetCourt')]."
 hunt.1021.d:0 "Por favor, [beautiful_peasant.GetFirstNameNoTooltip], deixe-me te estabelecer na [ROOT.Char.Custom('GetCourt')]."
 hunt.1021.desc:0 "Longe dos outros, encontrei uma casa que abriga uma das pessoas mais bonitas que já vi.\n\n[beautiful_peasant.GetSheHe|U] me convidou para ficar e descansar, e fiquei surpreso(a) com o quanto tenho em comum com um simples camponês.\n\n\"É necessário que você retorne à caçada tão cedo, [ROOT.Char.Custom('FormOfAddressForLiege')]? Nunca conheci um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] como você antes...\""
 hunt.1021.t:0 "Longe das Pessoas"
 hunt.1022.a.tt:0 "#EMP Certamente nunca mais verei [beautiful_peasant.GetSheHe]...#!"
 hunt.1022.a:0 "Receio que sim..."
 hunt.1022.b:0 "Venha e fique comigo, na [ROOT.Char.Custom('GetCourt')]."
 hunt.1022.desc:0 "Enquanto me preparo para partir, as memórias do rosto bonito [beautiful_peasant.GetHerHim], contorcido em paixão, persistem em minha mente. [beautiful_peasant.GetSheHe|U] acaricia a pele em que nos deitamos enquanto [beautiful_peasant.GetSheHe] me observa.\n\n\"Isso não precisa ser a única noite que passamos juntos\", [beautiful_peasant.GetSheHe] ronrona."
 hunt.1022.t:0 "Amanhecer na Solidão"
 hunt.1023.a.bad:0 "[ROOT.Char.Custom('DogStoryName')] morre na luta"
 hunt.1023.a.good:0 "[ROOT.Char.Custom('DogStoryName')] derruba [host.Custom('GetAnimalType')|l]"
 hunt.1023.a:0 "Vamos lá, [ROOT.Char.Custom('DogStoryName')], pegue-o!"
 hunt.1023.b:0 "Eu vou derrubá-lo, [ROOT.Char.GetWomanMan] para [host.Custom('GetAnimalType')|l]."
 hunt.1023.desc:0 "[ROOT.Char.Custom('DogStoryName')] troteia ao meu lado, claramente aproveitando o tempo ao ar livre.\n\nDe repente, [ROOT.Char.Custom('DogStorySheHe')] congela e começa a latir, e alguns segundos depois algo pode ser ouvido movendo-se pela vegetação rasteira. Algo grande.\n\nSeus latidos se transformam em rosnados quando [host.Custom('GetAnimalType')|l] irrompe em nosso caminho!"
 hunt.1023.t:0 "Cão de Caça"
 hunt.1030.a:0 "Uma ótima sugestão."
 hunt.1030.ambush:0 "Nosso anfitrião pensa por um momento, antes de concordar, \"Sim, faremos uma pequena emboscada!"
 hunt.1030.b:0 "Não, eu quero encurralá-lo!"
 hunt.1030.c:0 "Vamos!"
 hunt.1030.desc:0 "Meus caçadores apontaram uma clareira isolada a favor do vento do esconderijo da fera, um lugar perfeito para formar nossa linha de arcos e esperar [activity.Custom('GetAnimalType')] ser levado até lá pelas equipes de cães de caça.\n\nSeria uma ótima oportunidade para praticar tiro com arco em um alvo real em movimento."
 hunt.1030.guest:0 "Meus caçadores apontaram uma clareira isolada a favor do vento do esconderijo da fera, um lugar perfeito para formar nossa linha de arcos e esperar [activity.Custom('GetAnimalType')] ser levado até lá pelas equipes de cães de caça.\n\n"
 hunt.1030.t:0 "À Espera"
 hunt.1032.a:0 "Aguarde! Ele é #EMP meu#!!"
 hunt.1032.b:0 "Pare, é [hunt_participant.GetFirstNameNoTooltip]!"
 hunt.1032.desc:0 "O [activity.Custom('GetAnimalColor')] [activity.Custom('GetAnimalMale')] de repente salta na clareira adiante, [activity.Custom('GetAnimalDanger')] debatendo-se, [activity.Custom('GetAnimalChargeParticiple')] em nossa direção em terror."
 hunt.1032.e.tt:0 "[activity.Custom('GetAnimalType')|U] empalidece sob uma chuva de flechas"
 hunt.1032.e:0 "Agora! Todos! #EMP SOLTEM!!#!"
 hunt.1032.f:0 "#EMP Fujam!!!!#!"
 hunt.1032.opening:0 "Observamos [activity.Custom('GetAnimalType')] de nossa linha de arcos escondida, tensos de antecipação à medida que os gritos dos condutores e os latidos dos cães ficam mais altos.\n\n"
 hunt.1033.a:0 "Coisa esperta..."
 hunt.1033.b:0 "Tudo culpa [Select_CString( hunt_participant.IsFemale, 'da', 'do' )] [hunt_participant.GetFirstNameNoTooltip]!"
 hunt.1033.desc:0 "Nossos planos foram em vão, a fera sentiu nossa armadilha pelo vento ou conluio, e recusou-se a ser conduzida para nossa emboscada pelos condutores.\n\nPor fim, ela escapou completamente de suas garras, desaparecendo nas [host.GetCurrentLocation.Custom('GetTerrainTypePlural')]..."
 hunt.1040.a.flavor:0 "#EMP Silenciem os cães! Silêncio!#!"
 hunt.1040.a:0 "Vamos prosseguir sorrateiramente!"
 hunt.1040.b.flavor:0 "#EMP O último a chegar limpa os canis!#!"
 hunt.1040.b:0 "Pah, verdadeiros caçadores encurralam sua presa!"
 hunt.1040.c:0 "Que seja."
 hunt.1040.chase:0 "Nosso anfitrião pensa por um momento, antes de zombar, \"Eu vim para uma verdadeira caçada! Vamos caçar com força, não com furtividade!"
 hunt.1040.desc:0 "Meus caçadores dizem que conhecem o local do esconderijo da fera e os pontos de água e pastagens próximos que [activity.Custom('GetAnimalType')] frequenta.\n\nEmbora não seja uma tarefa fácil de realizar, se nos aproximarmos cuidadosamente do [activity.Custom('GetAnimalMale')], talvez possamos pegá-lo desprevenido com nossos arcos."
 hunt.1040.guest:0 "Os caçadores [Select_CString( host.IsFemale, 'da', 'do' )] [host.GetTitledFirstName] dizem que conhecem o local do esconderijo da fera e os pontos de água e pastagens próximos que o(a) [activity.Custom('GetAnimalType')] frequenta.\n\n"
 hunt.1040.stealth:0 "Nosso anfitrião pensa por um momento, antes de concordar que devemos nos aproximar sorrateiramente das bestas inconscientes."
 hunt.1040.t:0 "Silenciosamente"
 hunt.1043.a:0 "Não se pode vencer todas..."
 hunt.1043.b:0 "Que desastre, [hunt_participant.GetFirstNameNoTooltip]!"
 hunt.1043.desc:0 "Apesar de nossos melhores esforços, não conseguimos nos aproximar do(a) [activity.Custom('GetAnimalGroup')] de [activity.Custom('GetAnimalType')]: eles nos perceberam todas as vezes que nos aproximamos, fugindo e se escondendo.\n\nEstá quase escuro demais para continuar, teremos que admitir a derrota nas mãos dos(a) [activity.Custom('GetAnimalPlural')]..."
 hunt.1060.a:0 "Voem com precisão, meus pequenos."
 hunt.1060.b.flavor:0 "#EMP Segurança em primeiro lugar!#!"
 hunt.1060.b:0 "Eu só quero assistir."
 hunt.1060.beaters:0 "Os espantadores logo estarão em posição, prontos para assustar o jogo e fazê-lo voar."
 hunt.1060.closing:0 "\n\nO grupo para enquanto nos preparamos para remover as capas das nossas aves e soltá-las, uma por uma, para o esporte!"
 hunt.1060.d:0 "É hora!"
 hunt.1060.desc_guest:0 "Os mestres de caça [Select_CString( host.IsFemale, 'da', 'do' )] [host.GetTitledFirstName] fazem um sinal para que o grupo se cale: chegamos ao local de soltura."
 hunt.1060.desc_opening:0 "Os mestres de caça fazem um sinal para que o grupo se cale: chegamos ao local de soltura."
 hunt.1060.desc_opening_courtier:0 "[Select_CString( hunt_participant.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)], [hunt_participant.GetTitledFirstName], faz um sinal para que o grupo se cale: chegamos ao local de soltura determinado pelos mestres de caça."
 hunt.1060.exotic:0 "\n\nNão muito longe, um grupo de [activity.Custom('GetAnimalPlural')] [activity.Custom('GetAnimalColor')] exóticos voa pelo céu, seus distantes [activity.Custom('GetAnimalSoundParticiple')] anunciam nosso esporte!"
 hunt.1060.ground:0 "\n\nDo nosso ponto de vista, podemos ver vários(a) [activity.Custom('GetAnimalPlural')] [activity.Custom('GetAnimalColor')] caminhando pela [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] à frente."
 hunt.1060.hare:0 "\n\nDo nosso ponto de vista, podemos ver vários(a) [activity.Custom('GetAnimalPlural')] [activity.Custom('GetAnimalColor')] no [host.GetCurrentLocation.Custom('GetTerrainType')] à frente."
 hunt.1060.t:0 "Alçando Voo"
 hunt.1060.water:0 "\n\nHá uma linha de visão clara para [activity.Custom('GetAnimalGroup')] de [activity.Custom('GetAnimalPlural')] [activity.Custom('GetAnimalColor')], se refrescando em um lago adiante."
 hunt.1062.a.flavor:0 "Meu [activity.Custom('GetRaptorType')] se banqueteará hoje!"
 hunt.1062.a:0 "#EMP SIM!!#!"
 hunt.1062.b:0 "Muito bem feito!"
 hunt.1062.desc:0 "Observo animado enquanto meu [activity.Custom('GetRaptorType')] identifica um alvo e alça voo de seu posto, subindo alto no ar."
 hunt.1062.exotic:0 "\n\nAssumindo a posição em perseguição do(a) [activity.Custom('GetAnimalGroup')] de [activity.Custom('GetAnimalType')], o [activity.Custom('GetRaptorType')] está fazendo tudo certo! As presas em pânico se dispersam, [activity.Custom('GetAnimalSoundParticiple')] o alarme, mas é tarde demais!"
 hunt.1062.floor:0 "\n\nEle mergulha como um raio: a presa se apressa em buscar abrigo, mas já é tarde demais!!"
 hunt.1062.ground:0 "\n\nOs(a) [activity.Custom('GetAnimalPlural')|U] não têm ideia do que está acontecendo enquanto meu [activity.Custom('GetRaptorType')] observa o solo de cima."
 hunt.1062.guest:0 "[host.GetTitledFirstName] observa animado enquanto seu [activity.Custom('GetRaptorType')] identifica um alvo e alça voo de seu posto, subindo alto no ar."
 hunt.1062.sky:0 "\n\nEle mergulha como um raio: o trovão audível do impacto chega a nós momentos depois, quando a presa cai dos céus!"
 hunt.1062.t.hare:0 "Uma Lebre na Mão"
 hunt.1062.t:0 "Um Pássaro na Mão"
 hunt.1062.water:0 "\n\nOs espantadores dispersaram os [activity.Custom('GetAnimalSoundParticiple')] dos(a) [activity.Custom('GetAnimalPlural')] [activity.Custom('GetAnimalColor')], que agora preenchem o ar com seu clamor de bater asas."
 hunt.1063.a.flavor:0 "Maldita ave..."
 hunt.1063.a:0 "Sempre haverá uma próxima vez."
 hunt.1063.closing:0 "\n\nApós horas de tentativas, o jogo praticamente desapareceu, o [activity.Custom('GetRaptorType')] está quase exausto e a luz está se dissipando..."
 hunt.1063.d:0 "Uma pena."
 hunt.1063.desc:0 "Vez após vez, meu [activity.Custom('GetRaptorType')] mergulha para atacar, mas erra, recua ou apenas roça seu alvo."
 hunt.1063.desc_guest:0 "Vez após vez, o [activity.Custom('GetRaptorType')] [Select_CString( host.IsFemale, 'da', 'do' )] [host.GetTitledFirstName] mergulha para atacar, mas erra, recua ou apenas roça seu alvo."
 hunt.1063.t:0 "Dois na Moita"
 hunt.1080.a.accomplice:0 "Uh, [murderer.GetFirstNameNoTooltip]? [accomplice.GetFirstNameNoTooltip]?!"
 hunt.1080.a.bodyguard:0 "[bodyguard.GetFirstNameNoTooltip]! Rápido!"
 hunt.1080.a.dog:0 "[ROOT.Char.Custom('DogStoryName')], sim, [ROOT.Char.Custom('DogStoryGirlBoy')]!"
 hunt.1080.a.duel_failure:0 "[murderer.GetFirstNameNoTooltip] domina você"
 hunt.1080.a.duel_failure_accomplice:0 "[murderer.GetFirstNameNoTooltip] e [accomplice.GetFirstNameNoTooltip] dominam você"
 hunt.1080.a.duel_success:0 "Você domina [murderer.GetFirstNameNoTooltip]"
 hunt.1080.a.duel_success_accomplice:0 "Você domina [murderer.GetFirstNameNoTooltip] e [accomplice.GetFirstNameNoTooltip]"
 hunt.1080.a.success_accomplice_tt:0 "[accomplice.GetShortUIName|U] é morto ou dominado"
 hunt.1080.a.success_tt:0 "[murderer.GetShortUIName|U] é morto ou dominado"
 hunt.1080.a:0 "Uh, [murderer.GetFirstNameNoTooltip]?"
 hunt.1080.bodyguard:0 "\n\nOnde está meu guarda-costas, [bodyguard.GetFirstName], quando eu preciso [bodyguard.GetHerHim]? O idiota!"
 hunt.1080.bodyguard_appears:0 "\n\nOuço um grito atrás de mim: meu guarda-costas, [bodyguard.GetFirstName], está correndo pelo caminho, \"#EMP [ROOT.Char.GetTitleAsNameNoTooltip], cuidado!#!\""
 hunt.1080.bodyguard_betray:0 "\n\n[bodyguard_betray.GetFirstNameNoTooltip], o que você está fazendo?! Pare!"
 hunt.1080.bow:0 "guiados pelos constantes gritos [murderer.GetHerHim], para perseguir [activity.Custom('GetAnimalType')] em fuga.\n\nA trilha está quieta e isolada, e me ocorre: o resto do grupo ficou cada vez mais fraco - os outros não estão em lugar algum.\n\n"
 hunt.1080.chase:0 "guiados pelos constantes gritos e chamados [Select_CString( murderer.IsFemale, 'da', 'do' )] [murderer.GetFirstNameNoTooltip], para perseguir [activity.Custom('GetAnimalType')] em fuga.\n\nApenas agora percebo o quão silenciosa e isolada a trilha se tornou - o resto do grupo ficou cada vez mais fraco e não está em lugar algum.\n\n"
 hunt.1080.closing_accomplice:0 "Ao me virar, vejo [murderer.GetFirstNameNoTooltip] e [accomplice.GetFirstNameNoTooltip] se aproximando rapidamente, facas em punho, olhos brilhando."
 hunt.1080.closing_bow:0 "Ao voltar para o caminho, vejo [murderer.GetFirstNameNoTooltip] se aproximando rapidamente, sua faca em punho, um brilho aterrorizante em seus olhos."
 hunt.1080.closing_bow_accomplice:0 "Ao voltar para o caminho, vejo [murderer.GetFirstNameNoTooltip] e [accomplice.GetFirstNameNoTooltip] se aproximando rapidamente, facas em punho, brilhos aterrorizantes em seus olhos."
 hunt.1080.closing_lone:0 "Ao olhar para trás, vejo [murderer.GetFirstNameNoTooltip] se aproximando rapidamente, com a faca em punho e um brilho aterrorizante em seus olhos."
 hunt.1080.desc:0 "Pelo menos, era o que eu pensava. Quando me viro, o resto do meu grupo não está em lugar algum."
 hunt.1080.dog_appears:0 "\n\nUm latido alto soa: me viro e vejo meu amado cachorro, [ROOT.Char.Custom('DogStoryName')], correndo em minha direção, protegendo-me, anunciando ruidosamente sua chegada."
 hunt.1080.falconry:0 "incentivados ruidosamente por [murderer.GetFirstNameNoTooltip] visões duvidosas, mas insistentes, dos(a) [activity.Custom('GetAnimalPlural')].\n\nApenas agora percebo que a trilha está quieta e isolada - o resto do grupo ficou cada vez mais fraco, e os outros não estão em lugar algum.\n\n"
 hunt.1080.opening_accomplice:0 "Eu, [murderer.GetTitledFirstName], [accomplice.GetTitledFirstName], e [Select_CString( murderer.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', murderer)] estamos à frente dos outros,"
 hunt.1080.opening_lone:0 "Eu, [murderer.GetTitledFirstName], [Select_CString( murderer.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', murderer)] estamos à frente dos outros,"
 hunt.1080.t.bodyguard:0 "Não Tão Sozinho"
 hunt.1080.t:0 "Completamente Sozinho"
 hunt.1081.a:0 "Sem piedade para vermes!"
 hunt.1081.accomplice:0 "[accomplice.GetFirstNameNoTooltip] já fugiu, seu riso alegre se dissipando ao longe.\n\n"
 hunt.1081.accomplice_arrested:0 "[accomplice.GetFirstNameNoTooltip] está completamente ileso e implora por clemência com seus olhos arregalados.\n\n"
 hunt.1081.accomplice_killed:0 "[accomplice.GetFirstNameNoTooltip] jaz completamente imóvel, uma ferida horrível revelando o destino [accomplice.GetHerHim].\n\n"
 hunt.1081.accomplice_wounded:0 "[accomplice.GetFirstNameNoTooltip] foi apenas ferido, mas uiva de dor, olhos arregalados de pânico.\n\n"
 hunt.1081.b.accomplice:0 "Guardas! #EMP GUARDAS!#! Prendam [accomplice.GetSheHe]!"
 hunt.1081.b.pair:0 "Guardas! #EMP GUARDAS!#! Prendam eles!"
 hunt.1081.b:0 "Guardas! #EMP GUARDAS!#! Prendam [murderer.GetSheHe]!"
 hunt.1081.bodyguard_killed:0 "[bodyguard.GetFirstName] está esparramado entre todos nós, aparentemente morto."
 hunt.1081.bodyguard_saved:0 "[bodyguard.GetFirstName] mantém sua lâmina apontada para cada um deles, vigiando as árvores em busca de quaisquer ameaças adicionais."
 hunt.1081.bodyguard_wounded:0 "[bodyguard.GetFirstName] ajoelha-se próximo, segurando firmemente uma ferida que sangra livremente."
 hunt.1081.c.family:0 "[ROOT.Char.Custom2('RelationToMeShort', murderer)]..."
 hunt.1081.c.rival:0 "Isso... [murderer.Custom2('InsultNoun', ROOT.Char)]..."
 hunt.1081.c:0 "P-por que...?"
 hunt.1081.closing_massacre:0 "Que bagunça..."
 hunt.1081.closing_success:0 "\n\nFico sozinho, ouvindo os pássaros, clamando por ajuda fracamente..."
 hunt.1081.closing_success_bodyguard_apology:0 "Ouço [bodyguard.GetFirstNameNoTooltip] dizendo: 'Desculpe, [ROOT.Char.Custom('FormOfAddressForLiege')]..."
 hunt.1081.closing_success_bodyguard_dead:0 "Você me serviu bem... [bodyguard.GetFirstNameNoTooltip]..."
 hunt.1081.d:0 "O-que diabos..."
 hunt.1081.desc:0 "Retiro minha faca de caça, gritando por ajuda enquanto [murderer.GetFirstName] acelera seu ritmo, impulsionado por uma intenção terrivelmente feroz. Os próximos momentos são um borrão...\n\n"
 hunt.1081.desc_accomplice:0 "Retiro minha faca de caça, gritando por ajuda enquanto [murderer.GetFirstName] e [accomplice.GetFirstName] se aproximam de mim, fazendo caretas com uma intenção assustadora. Os próximos momentos são um borrão...\n\n"
 hunt.1081.dog:0 "\n\nMeu bravo cão, [ROOT.Char.Custom('DogStoryName')], está ao meu lado..."
 hunt.1081.dog_killed:0 "\n\nMeu bravo cão, [ROOT.Char.Custom('DogStoryName')], está encolhido aos meus pés, completamente imóvel, como se estivesse dormindo..."
 hunt.1081.escaped:0 "$hunt.1081.failure$.\n\n"
 hunt.1081.escaped_accomplice:0 "$hunt.1081.failure_accomplice$.\n\n"
 hunt.1081.failure:0 "Quando volto a meus sentidos, meu coração batendo forte, meu agressor se contorce no chão, sua adaga fora de alcance"
 hunt.1081.failure_accomplice:0 "Quando volto a meus sentidos, meu coração batendo forte, meus agressores estão contorcendo-se no chão, suas adagas fora de alcance."
 hunt.1081.killed:0 "De repente, estou caindo para trás nas garras da [host.GetCurrentLocation.Custom('GetProvinceGroundDesc')], segurando meu peito: a empunhadura de uma adaga aparecendo em uma mancha escura na minha camisa.\n\n"
 hunt.1081.murderer:0 "[murderer.GetFirstNameNoTooltip] parece triunfante enquanto foge para a [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]."
 hunt.1081.murderer_arrested:0 "Seguro minha faca na garganta atordoada [Select_CString( murderer.IsFemale, 'da', 'do' )] [murderer.GetFirstNameNoTooltip]."
 hunt.1081.murderer_killed:0 "[murderer.GetFirstNameNoTooltip] parece prestes a me amaldiçoar antes que a luz se apague de seus olhos."
 hunt.1081.murderer_wounded:0 "[murderer.GetFirstNameNoTooltip] faz uma careta, gemendo de dor e segurando uma ferida aberta."
 hunt.1081.wounded:0 "$hunt.1081.failure$, sangue rubi escorrendo do braço [murderer.GetHerHim].\n\n"
 hunt.1081.wounded_accomplice:0 "$hunt.1081.failure_accomplice$, sangue rubi escorrendo do braço [accomplice.GetHerHim].\n\n"
 hunt.1090.a.tt:0 "Espere só!"
 hunt.1090.a:0 "Eu #EMP vou#! encontrá-lo, fera..."
 hunt.1090.b:0 "Isso certamente foi algo."
 hunt.1090.desc:0 "Depois de horas de cavalgada, vasculhando cada canto do [host.GetCurrentLocation.Custom('GetTerrainTypePlural')], sou forçado a admitir a derrota diante da luz que se esvai.\n\n[activity.Custom('GetAnimalType')|U] [activity.Custom('GetLegendaryColor')] desapareceu como um espírito assim que o avistamos, aparentemente sem deixar rastro de seu cheiro ou pegadas...\n\nAo me virar para retornar ao acampamento, os chamados distantes do(a) [activity.Custom('GetAnimalType')] zombam de mim pela paisagem que se torna cada vez mais escura."
 hunt.1090.guest:0 "Após horas de cavalgada, vasculhando todos os cantos do [host.GetCurrentLocation.Custom('GetTerrainTypePlural')], [host.GetTitledFirstName] é obrigado a admitir a derrota diante da luz que está desaparecendo.\n\n[activity.Custom('GetAnimalType')|U] [activity.Custom('GetLegendaryColor')] desapareceu como um espírito no momento em que o avistamos, aparentemente sem deixar nenhum rastro de seu cheiro ou pegadas...\n\nAo nos virarmos para retornar ao acampamento, os chamados distantes do(a) [activity.Custom('GetAnimalType')] zombam de [host.GetFirstNameNoTooltip] pela paisagem que escurece."
 hunt.1200.a.self:0 "É assim que se faz!"
 hunt.1200.a:0 "Bom tiro!"
 hunt.1200.ambush:0 "[animal_slayer.GetTitledFirstName] mira cuidadosamente enquanto [activity.Custom('GetAnimalType')] se aproxima de nós, as [activity.Custom('GetAnimalTrackPlural')] batendo no chão do [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')]."
 hunt.1200.ambush_self:0 "Eu miro cuidadosamente enquanto [activity.Custom('GetAnimalType')] se aproxima de nós, as [activity.Custom('GetAnimalTrackPlural')] batendo no chão do [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')]."
 hunt.1200.b.self:0 "Ops, desculpe! Cuidado!"
 hunt.1200.b:0 "Ajudem [injury_target.GetSheHe]!"
 hunt.1200.c.self:0 "Maldita coisa se mexeu..."
 hunt.1200.c:0 "Azar."
 hunt.1200.chase:0 "[animal_slayer.GetTitledFirstName] mirra enquanto o grupo mantém o(a) [activity.Custom('GetAnimalType')] exausto no lugar, solta a respiração e dispara!"
 hunt.1200.chase_self:0 "Eu miro enquanto o grupo mantém o animal exausto no lugar, solto a respiração e disparo!"
 hunt.1200.critical:0 "\n\nA flecha passa por ela, [activity.Custom('GetAnimalType')] se vira rapidamente e desaparece na [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]!"
 hunt.1200.d:0 "Não tinha a menor chance."
 hunt.1200.e:0 "Que caçador!"
 hunt.1200.failure:0 "\n\nA flecha passa por ela e atinge a [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], enquanto [activity.Custom('GetAnimalType')] desfere um [activity.Custom('GetAnimalStrike')] em [injury_target.GetFirstName]!"
 hunt.1200.fled:0 "\n\nO restante de nós fica se perguntando o que fazer em seguida, enquanto saímos do caminho da fera."
 hunt.1200.group:0 "\n\nAs cordas do arco estalam quando uma dúzia de flechas assobia em direção ao animal; ele desliza em nossa direção [activity.Custom('GetAnimalSoundPresent')], cravado de setas."
 hunt.1200.slayer:0 "[host.GetTitledFirstName] grita: \"Rápido [animal_slayer.GetTitledFirstName], faça o disparo!\""
 hunt.1200.slayer_fled:0 "[host.GetTitledFirstName] de repente grita, recuando em retirada do animal."
 hunt.1200.slayer_group:0 "[host.GetTitledFirstName] grita: \"#EMP DISPARA!#!, abate-o!"
 hunt.1200.slayer_self:0 "[host.GetTitledFirstName] faz um gesto, indicando que eu devo fazer o disparo!"
 hunt.1200.slayer_self_stealth:0 "[host.GetTitledFirstName] faz um gesto, indicando que eu devo fazer o disparo!"
 hunt.1200.slayer_stealth:0 "Ouço [host.GetTitledFirstName] gritar: \"Rápido [ROOT.Char.GetFirstNameNoTooltip], faça o disparo!\""
 hunt.1200.stealth:0 "[animal_slayer.GetTitledFirstName] mira lentamente, [activity.Custom('GetAnimalType')] virando a cabeça como se estivesse antecipando algo."
 hunt.1200.stealth_self:0 "Eu miro lentamente, [activity.Custom('GetAnimalType')] virando a cabeça como se estivesse antecipando algo."
 hunt.1200.success:0 "\n\nA flecha acerta em cheio, diretamente no coração da fera!"
 hunt.1200.t:0 "A Caçada"
 hunt.1201.a.self:0 "Toma essa!"
 hunt.1201.a:0 "Uma bela morte!"
 hunt.1201.animal_spared:0 "\n\n[host.GetTitledFirstName] interrompe os caçadores, \"Isso é suficiente. Venham, vamos deixar a maldita fera em paz."
 hunt.1201.animal_spared_dharmic:0 "\n\n[host.GetTitledFirstName] interrompe os caçadores, \"A caçada está completa, não é dharma infligir dor desnecessária."
 hunt.1201.b.self:0 "Argh! Maldita criatura..."
 hunt.1201.b:0 "Rápido, [injury_target.GetSheHe] precisa de ajuda!"
 hunt.1201.c:0 "Pelo [ROOT.Char.GetFaith.HighGodName]!"
 hunt.1201.critical:0 "\n\nEnquanto [animal_slayer.GetTitledFirstNameNoTooltip] mergulha sua lâmina nele, a fera desfere um [activity.Custom('GetAnimalStrike')] feroz, deixando [animal_slayer.GetSheHe] retorcendo-se com uma ferida horrível!"
 hunt.1201.d.self:0 "Hah! Os cães terão um banquete esta noite!"
 hunt.1201.d:0 "Feroz."
 hunt.1201.dogs_failure:0 "\n\nOs cães entram em ação, latindo enquanto cercam a fera, mas são abatidos um a um com uivos e gritos..."
 hunt.1201.dogs_success:0 "\n\nOs cães entram em ação, latindo enquanto cercam a fera, aos poucos a desgastando com suas presas..."
 hunt.1201.e.critical:0 "NÃO! Não meu filhote!"
 hunt.1201.e.self:0 "Não! Malditas criaturas tolas..."
 hunt.1201.e:0 "Difícil de assistir."
 hunt.1201.f.compassionate:0 "Muito piedoso."
 hunt.1201.f.dharmic:0 "Azarado."
 hunt.1201.f:0 "Que absolutamente sem sentido..."
 hunt.1201.failure:0 "\n\nEnquanto [animal_slayer.GetTitledFirstNameNoTooltip] mergulha sua lâmina nele, a fera o atinge com um [activity.Custom('GetAnimalStrike')]. [animal_slayer.GetSheHe|U] é afastado enquanto ela [activity.Custom('GetAnimalSoundPresent')] em seus estertores finais."
 hunt.1201.failure_self:0 "\n\nEnquanto mergulho minha lâmina nele, a fera me atinge com um [activity.Custom('GetAnimalStrike')]. Sou afastado enquanto ela [activity.Custom('GetAnimalSoundPresent')] em seus estertores finais."
 hunt.1201.self:0 "Empunho minha lança e me aproximo cautelosamente da fera exausta."
 hunt.1201.slayer:0 "[host.GetTitledFirstName] se vira para nós e grita: \"[animal_slayer.GetTitledFirstName], a morte é sua!\""
 hunt.1201.slayer_dogs:0 "[host.GetTitledFirstName] se vira para os tratadores e grita: \"Soltem os cães!\""
 hunt.1201.slayer_self:0 "[host.GetTitledFirstName] se vira para mim, \"[ROOT.Char.GetTitledFirstName], a morte é sua!\""
 hunt.1201.success:0 "\n\n[animal_slayer.GetTitledFirstNameNoTooltip] escolhe cuidadosamente o momento, mergulhando sua lâmina profundamente em seu coração!"
 hunt.1201.success_self:0 "\n\nEscolho cuidadosamente o momento, mergulhando minha lâmina profundamente em seu coração!"
 hunt.1201:0 "[animal_slayer.GetTitledFirstName] empunha sua lança e se aproxima cautelosamente da fera exausta."
 hunt.1202.a.self:0 "Toma essa!"
 hunt.1202.a:0 "Uma bela caçada!"
 hunt.1202.b.self:0 "#EMP Argh!#! Maldita criatura..."
 hunt.1202.b:0 "Rápido, [injury_target.GetSheHe] precisa de ajuda!"
 hunt.1202.c:0 "Uma tragédia..."
 hunt.1202.capture:0 "[host.GetTitledFirstName] se vira para nós e grita: \"Venham, peguem a corda, vamos capturá-la viva!\""
 hunt.1202.capture_critical:0 "Depois de muita luta e [activity.Custom('GetAnimalSoundParticiple')], [activity.Custom('GetAnimalType')] é pacificado, mas não antes de derrubar [injury_target.GetFirstName]."
 hunt.1202.capture_failure:0 "Depois de muita luta e [activity.Custom('GetAnimalSoundParticiple')], [activity.Custom('GetAnimalType')] é pacificado, mas [injury_target.GetFirstName] sofre um poderoso [activity.Custom('GetAnimalStrike')] no processo."
 hunt.1202.capture_injury:0 "Depois de muita luta e [activity.Custom('GetAnimalSoundParticiple')], [activity.Custom('GetAnimalType')] é pacificado, mas eu sofro um ferimento poderoso no processo."
 hunt.1202.capture_self:0 "Os outros pegam a corda enquanto descobrimos como manobrar a fera."
 hunt.1202.capture_success:0 "Depois de muita luta e [activity.Custom('GetAnimalSoundParticiple')], [activity.Custom('GetAnimalType')] finalmente é pacificado, amarrado indefeso."
 hunt.1202.craven:0 "[host.GetTitledFirstName] se vira para nós e grita: \"Vão! O que estão esperando? Terminem com isso!\""
 hunt.1202.craven_self:0 "Os outros avançam enquanto eu fico para trás, segurando firmemente minha arma."
 hunt.1202.critical:0 "\n\nOs caçadores cercam lentamente a fera, lanças eriçadas, mas [injury_target.GetFirstName] sofre um [activity.Custom('GetAnimalStrike')] horrendo antes de pormos fim ao sofrimento da fera [activity.Custom('GetAnimalSoundParticiple')]!"
 hunt.1202.critical_self:0 "\n\nNós o cercamos lentamente, lanças em riste, mas [injury_target.GetFirstName] sofre um [activity.Custom('GetAnimalStrike')] horrendo antes de pormos fim ao sofrimento da fera [activity.Custom('GetAnimalSoundParticiple')]!"
 hunt.1202.failure:0 "\n\nOs caçadores o cercam lentamente, lanças em riste, mas [injury_target.GetFirstName] sofre um [activity.Custom('GetAnimalStrike')] antes de pormos fim ao sofrimento da fera [activity.Custom('GetAnimalSoundParticiple')]."
 hunt.1202.failure_injury:0 "\n\nNós o cercamos lentamente, lanças em riste, mas sofro um [activity.Custom('GetAnimalStrike')] antes de pormos fim ao sofrimento da fera [activity.Custom('GetAnimalSoundParticiple')]."
 hunt.1202.failure_self:0 "\n\nNós o cercamos lentamente, lanças em riste, mas [injury_target.GetFirstName] sofre um [activity.Custom('GetAnimalStrike')] antes de pormos fim ao sofrimento da fera [activity.Custom('GetAnimalSoundParticiple')]."
 hunt.1202.self:0 "Empunho minha lança e me aproximo cautelosamente da fera exausta."
 hunt.1202.slayer:0 "[host.GetTitledFirstName] se vira para nós e grita: \"Avante, pessoal, acabem com isso!\""
 hunt.1202.slayer_self:0 "O grupo avança, espalhando-se ao redor da fera aterrorizada."
 hunt.1202.success:0 "\n\nOs caçadores o cercam lentamente, lanças em riste, e põem fim ao sofrimento da fera [activity.Custom('GetAnimalSoundParticiple')]."
 hunt.1202.success_self:0 "\n\nNós o cercamos lentamente, lanças em riste, e pusemos fim ao sofrimento da fera [activity.Custom('GetAnimalSoundParticiple')]."
 hunt.1202:0 "[animal_slayer.GetTitledFirstName] empunha sua lança e se aproxima cautelosamente da fera exausta."
 hunt.1337.a:0 "[favor_to_call_in.GetTitledFirstNameNoTooltip] certamente permitirá que eu cace!"
 hunt.1337.b:0 "Que se dane esses #EMP 'direitos'#!, eu caço onde eu quiser!"
 hunt.1337.c:0 "Vou comprar os direitos."
 hunt.1337.d:0 "Bah, vamos voltar para o acampamento..."
 hunt.1337.desc:0 "Eu não tenho o direito de caçar aqui nas [host.GetCurrentLocation.Custom('GetTerrainTypePlural')] de [barony_holder.GetTitledFirstName]. Devo comprar os direitos para isso, a menos que eu queira ser visto como um fora-da-lei e caçador furtivo.\n\nÉ claro, mesmo que eu consiga os direitos, não me seria permitido abater qualquer animal que eu desejasse..."
 hunt.1337.e:0 "Ainda bem que já paguei pelos direitos!"
 hunt.1337.t:0 "O Direito de Caçar"
 hunt.2000.a:0 "Um bom farejador vale o seu peso em ouro."
 hunt.2000.b.tt:0 "Você não receberá eventos de [hunt_sighting_no_prefix|E] até realizar uma [GetActivityType('activity_hunt').GetName]"
 hunt.2000.b:0 "Esse pode derrubar um javali sozinho!"
 hunt.2000.c:0 "Impressionante, você cuidará dos meus canis, [dog_salesman.GetFirstNameNoTooltip]?"
 hunt.2000.d:0 "Não preciso de mais cães."
 hunt.2000.desc:0 "\"Eu vendo apenas os melhores cães de caça, já treinados e prontos para se juntarem a qualquer equipe de caça sem problemas. Você não encontrará nada melhor em qualquer lugar de [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveNameNoTooltip], [ROOT.Char.GetTitleAsNameNoTooltip]!\"\n\nDiante de mim está uma fila de cães com coleiras de tamanhos e estruturas diferentes, sentados calmamente enquanto os avalio."
 hunt.2000.opening:0 "Um[Select_CString( dog_salesman.IsFemale, 'a', '' )] [dog_salesman.GetWomanMan] que vende cães de caça de qualidade chegou em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], aparentemente esperando encontrar um novo cliente.\n\n"
 hunt.2000.opening_hunter:0 "[Select_CString( m_hunt.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', m_hunt)], [m_hunt.GetTitledFirstName], [Select_CString( m_hunt.IsFemale, 'uma caçadora ávida', 'um caçador ávido' )], trouxe-me um[Select_CString( dog_salesman.IsFemale, 'a', '' )] [dog_salesman.GetWomanMan] que vende cães de caça de qualidade.\n\n"
 hunt.2000.opening_master:0 "Meu [ROOT.Char.Custom('GetHuntMasterDesc')], [m_hunt.GetTitledFirstName], trouxe-me um[Select_CString( dog_salesman.IsFemale, 'a', '' )] [dog_salesman.GetWomanMan] que afirma vender cães de caça de qualidade.\n\n"
 hunt.2000.t:0 "Vendedor de Cães de Caça"
 hunt.2001.a.flavor:0 "Eu vou levá-lo!"
 hunt.2001.a:0 "Este aqui é um belo espécime!"
 hunt.2001.c:0 "Finalmente, [falcon_salesman.GetFirstNameNoTooltip]! Alguém para cuidar dos meus viveiros!"
 hunt.2001.d:0 "Muito bom, mas não estou interessado..."
 hunt.2001.desc:0 "\"Estas são as aves mais nobres; eu mesmo as criei desde filhotes; elas não irão decepcionar você, [ROOT.Char.GetTitleAsNameNoTooltip]!\"\n\nUma variedade de falcões e gaviões de diferentes tamanhos estão calmamente sentados em uma gaiola diante de mim."
 hunt.2001.opening:0 "[Select_CString( falcon_salesman.IsFemale, 'Uma', 'Um' )] [falcon_salesman.GetWomanMan] que vende aves de rapina treinadas para a caça chegou em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], aparentemente esperando encontrar um novo cliente.\n\n"
 hunt.2001.opening_hunter:0 "[Select_CString( m_hunt.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', m_hunt)], [m_hunt.GetTitledFirstName], [Select_CString( m_hunt.IsFemale, 'uma caçadora ávida', 'um caçador ávido' )], trouxe-me um[Select_CString( falcon_salesman.IsFemale, 'a', '' )] [falcon_salesman.GetWomanMan] que vende aves de rapina treinadas para a caça.\n\n"
 hunt.2001.opening_master:0 "Meu [ROOT.Char.Custom('GetHuntMasterDesc')], [m_hunt.GetTitledFirstName], trouxe-me um[Select_CString( falcon_salesman.IsFemale, 'a', '' )] [falcon_salesman.GetWomanMan] que afirma vender aves de rapina treinadas para a caça.\n\n"
 hunt.2001.t:0 "Vendedor de Aves de Rapina"
 hunt.2500.a:0 "Interessante..."
 hunt.2500.b:0 "Não me incomode com isso."
 hunt.2500.c:0 "Eu poderia usar um bom caçador."
 hunt.2500.desc:0 "\"Tenho ouvido muitos relatos da [sighting_county.GetName]: dizem que há excelentes oportunidades de caça por lá, muitos(a) [sighting_county.Custom('GetAnimalType')] digno sendo visto vagando pelos [sighting_province.Custom('GetTerrainTypePlural')]!\""
 hunt.2500.opening:0 "[Select_CString( sighting_character.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', sighting_character)], [sighting_character.GetTitledFirstName], tem me falado sobre feras avistadas em meu reino.\n\n"
 hunt.2500.opening_fallback:0 "A gente ouve todo tipo de rumor nas largas estradas de [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetDeJureLiege.GetNameNoTierNoTooltip], e hoje, um caçador particularmente tagarela tem falado sem parar no meu ouvido.\n\n"
 hunt.2500.opening_hunter:0 "[Select_CString( sighting_character.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', sighting_character)], [sighting_character.GetTitledFirstName], conhecido(a) por seu interesse em caçar, traz rumores de feras avistadas em meu reino.\n\n"
 hunt.2500.opening_master:0 "Meu [ROOT.Char.Custom('GetHuntMasterDesc')], [sighting_character.GetTitledFirstName], traz notícias de feras avistadas em meu reino.\n\n"
 hunt.2500.t:0 "[sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalPlural')|U] de [sighting_province.GetNameNoTooltip]"
 hunt.2510.a.existing:0 "Eu #EMP vou#! encontrá-lo, um dia!"
 hunt.2510.a:0 "#EMP [sighting_county.Custom('GetLegendaryColor')|U]#!, você diz?"
 hunt.2510.b:0 "Não me incomode com essas fantasias infantis."
 hunt.2510.black:0 "pelagem preta como carvão.\""
 hunt.2510.c:0 "Leve o acampamento para [sighting_county.GetNameNoTierNoTooltip] — imediatamente."
 hunt.2510.closing:0 "\n\n\"Dizem que ele vagueia pelos [sighting_province.Custom('GetTerrainTypePlural')], embora ninguém tenha chegado perto dele. Existem, de fato, lendas sobre tais criaturas...\""
 hunt.2510.desc.knight_errant:0 "“Eu estou ouvindo coisas estranhas dos guardas de caça de [sighting_county.GetName]: eles falam de vislumbres do(a) [sighting_county.Custom('GetAnimalType')] com"
 hunt.2510.desc:0 "\"Tenho ouvido coisas estranhas dos guardas de caça de [sighting_county.GetNameNoTier]: eles relatam vislumbres do(a) [sighting_county.Custom('GetAnimalType')] com"
 hunt.2510.knight_errant_closing:0 "\n\n“Apenas um $knight_culture_player_no_tooltip$ tão famoso quanto você pode domá-lo, [ROOT.Char.Custom('FormOfAddressForLiege')].”"
 hunt.2510.opening:0 "[Select_CString( sighting_character.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', sighting_character)], [sighting_character.GetTitledFirstName], entra em meus aposentos cheio de empolgação.\n\n"
 hunt.2510.opening_hunter:0 "[Select_CString( sighting_character.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', sighting_character)], [sighting_character.GetTitledFirstName], conhecido(a) por seu interesse em caçar, entra em meus aposentos cheio de empolgação.\n\n"
 hunt.2510.opening_master:0 "Meu [ROOT.Char.Custom('GetHuntMasterDesc')], [sighting_character.GetTitledFirstName], entra em meus aposentos cheio de empolgação.\n\n"
 hunt.2510.story:0 "\"Os guardas de caça de [sighting_county.GetNameNoTier] enviam relatos convincentes: parece que [sighting_county.Custom('GetAnimalType')] foi visto por lá, uma fera com"
 hunt.2510.t:0 "[sighting_county.Custom('GetAnimalType')|U] [sighting_county.Custom('GetLegendaryColor')]"
 hunt.2510.white:0 "pelagem branca como neve.\""
 hunt.2520.desc:0 "\"Tenho ouvido muitos relatos de [sighting_county.GetNameNoTier]: dizem que [sighting_county.Custom('GetAnimalType')] terrível tem aterrorizado as vilas locais, roubando gado antes de desaparecer nas [sighting_province.Custom('GetTerrainTypePlural')]!\""
 hunt.2520.t:0 "[sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalType')|U] [sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalAdjective')] de [sighting_county.GetNameNoTierNoTooltip]"
 hunt.2530.desc:0 "\"Tenho ouvido muitas conversas sobre [sighting_county.GetNameNoTier]: dizem que há excelentes perspectivas de caça por lá, com muitos(a) [sighting_county.Custom('GetAnimalType')] visto perambulando pelos [sighting_province.Custom('GetTerrainTypePlural')]!"
 hunt.2530.opening_falconer:0 "[Select_CString( sighting_character.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', sighting_character)], [sighting_character.GetTitledFirstName], conhecido(a) por seu interesse em falcoaria, entra em meus aposentos cheio de empolgação.\n\n"
 hunt.2530.opening_master:0 "Meu Mestre Falcoeiro, [sighting_character.GetTitledFirstName], entra em meus aposentos cheio de empolgação.\n\n"
 hunt.2530.t:0 "[sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalPlural')|U] de [sighting_county.GetNameNoTierNoTooltip]"
 hunt.2540.a.legendary:0 "Ele tenta me confundir!"
 hunt.2540.a:0 "Eles podem correr, mas não podem se esconder."
 hunt.2540.b:0 "Estou cansado(a) desses relatórios, [sighting_character.GetFirstNameNoTooltip]..."
 hunt.2540.black:0 "Dizem que ele surge como um mensageiro da noite, um buraco negro na paisagem...\""
 hunt.2540.closing:0 "\n\n\"Talvez seja hora de organizar uma caçada antes que seja tarde demais.\""
 hunt.2540.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], seus mestres de caça relatam que [sighting_county.Custom('GetAnimalPlural')] abundantes de [old_sighting_county.GetBaseNameNoTier] parecem ter se movido daquelas terras para [sighting_county.GetName]!\""
 hunt.2540.legendary:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], seus mestres de caça relatam que o(a) [sighting_county.Custom('GetAnimalType')] [sighting_county.Custom('GetLegendaryColor')] de [old_sighting_county.GetBaseNameNoTier] desapareceu por um tempo antes de ser avistado em [sighting_county.GetBaseNameNoTier] próximo!"
 hunt.2540.t:0 "De Aqui para Lá"
 hunt.2540.white:0 "Dizem que ele brilha como uma luz divina nas névoas da manhã...\""
 hunt.3020.a.failure:0 "Você acha que encontrou o rastro"
 hunt.3020.a.perfect:0 "Você encontra rapidamente o rastro"
 hunt.3020.a.success:0 "Você logo encontra o rastro"
 hunt.3020.a:0 "Tenha paciência, isso deve ser fácil de resolver."
 hunt.3020.b.failure:0 "Seu conselho é inútil"
 hunt.3020.b.success:0 "Seu conselho dá resultado"
 hunt.3020.b:0 "Ah sim, já ouvi falar desse truque."
 hunt.3020.beating:0 "[activity.Custom('GetAnimalMale')] tem batido e ludibriado pelos riachos do [host.GetCurrentLocation.Custom('GetTerrainType')], tentando nos despistar."
 hunt.3020.c.failure:0 "[hunt_participant.GetFirstNameNoTooltip] nos leva para o caminho errado"
 hunt.3020.c.perfect:0 "[hunt_participant.GetFirstNameNoTooltip] encontra rapidamente o rastro"
 hunt.3020.c.success:0 "[hunt_participant.GetFirstNameNoTooltip] logo encontra o rastro"
 hunt.3020.c:0 "Confio em [hunt_participant.GetFirstNameNoTooltip] nisso."
 hunt.3020.closing:0 "\n\nNão há acordo sobre qual caminho seguir, e a cada momento que hesitamos, estamos mais distantes do nosso prêmio."
 hunt.3020.d:0 "Se fosse eu, teria seguido por este caminho..."
 hunt.3020.desc:0 "As pegadas ficam confusas: astuto(a) [activity.Custom('GetAnimalType')] tem dobrado para lá e para cá, refazendo seus passos para nos despistar."
 hunt.3020.desc_courtier:0 "[Select_CString( hunt_participant.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', hunt_participant)], [hunt_participant.GetTitledFirstName], interrompeu a festa:"
 hunt.3020.desc_fallback:0 "Meus [ROOT.Char.Custom('GetGameKeepers')] interromperam à frente:"
 hunt.3020.doubling:0 "astuto(a) [activity.Custom('GetAnimalType')] tem dobrado para lá e para cá, refazendo seus passos e percorrendo trilhas para nos despistar."
 hunt.3020.e.failure:0 "Você vai pelo caminho errado"
 hunt.3020.e.success:0 "Você vai pelo caminho certo"
 hunt.3020.e:0 "Por aqui. Não! Por ali!"
 hunt.3020.f.flavor:0 "#EMP Vamos consultar um especialista...#!"
 hunt.3020.f:0 "O que o guarda de caça local pensa?"
 hunt.3020.opening:0 "Assim como todo jogo, o escorregadio [activity.Custom('GetAnimalType')] possui muitos truques, escapadas e artimanhas que podem enganar até mesmo caçadores experientes.\n\n"
 hunt.3020.rusing:0 "[activity.Custom('GetAnimalMale')] tem utilizado artifícios, correndo para cá e para lá em padrões insanos para confundir seu rastro e frustrar as tentativas de segui-lo"
 hunt.3020.squatting:0 "[activity.Custom('GetAnimalMale')] tem permanecido imóvel nas [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], inabalável em nos confundir, mesmo debaixo do nariz dos cães."
 hunt.3020.t.deer:0 "Sem Ideia"
 hunt.3020.t:0 "Caça Ardilosa"
 hunt.4001.a.both:0 "Você espanta o(a) [activity.Custom('GetAnimalType')]"
 hunt.4001.a.kill:0 "Você abate o(a) [activity.Custom('GetAnimalType')]"
 hunt.4001.a.stolen:0 "[hunt_participant.GetFirstNameNoTooltip] abate o(a) [activity.Custom('GetAnimalType')]"
 hunt.4001.a:0 "#EMP Não! É meu!#!"
 hunt.4001.b:0 "Acerte em cheio, [hunt_participant.GetFirstNameNoTooltip]."
 hunt.4001.c.tt:0 "Se eu pisasse neste graveto, [activity.Custom('GetAnimalType')] certamente se assustaria..."
 hunt.4001.c:0 "Agora, [hunt_participant.GetFirstNameNoTooltip], antes que o(a) [activity.Custom('GetAnimalType')] nos perceba!"
 hunt.4001.d:0 "Observe isso."
 hunt.4001.desc_1:0 "Olho silenciosamente para [Select_CString( hunt_participant.IsFemale, 'a minha', 'o meu' )] [ROOT.Char.Custom2('RelationToMe', hunt_participant)], [hunt_participant.GetTitledFirstName], agachado(a) no(a) [host.GetCurrentLocation.Custom('GetProvinceGroundDesc')], que faz o mesmo."
 hunt.4001.desc_2:0 "Avaliando cuidadosamente a distância até [activity.Custom('GetAnimalType')], com minha lança perfeitamente equilibrada em minha mão...\n\n[Select_CString( hunt_participant.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', hunt_participant)], [hunt_participant.GetTitledFirstName], está agachado(a) ao meu lado, empunhando sua própria lança."
 hunt.4001.desc_3:0 "Respire... mire..."
 hunt.4001.opening:0 "Há algo majestoso na maneira como [activity.Custom('GetAnimalType')] observa a paisagem. Escondido(a) na [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], eu ergo meu arco.\n\n"
 hunt.4001.t:0 "O Tiro"
 hunt.4002.a.flavor:0 "[activity.Custom('GetAnimalType')|U] é [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )]!"
 hunt.4002.a:0 "Conversamos depois, [ROOT.Char.Custom2('RelationToMe', secret_sharer)]!"
 hunt.4002.b.reveal:0 "Descubro o segredo [Select_CString( secret_owner.IsFemale, 'da', 'do' )] [secret_owner.GetFirstNameNoTooltip]"
 hunt.4002.b.tt:0 "[activity.Custom('GetAnimalType')|U] foge"
 hunt.4002.b:0 "O quê? Me conte..."
 hunt.4002.desc:0 "O barulho dos outros desapareceu à medida que eu e [Select_CString( secret_sharer.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', secret_sharer)], [secret_sharer.GetTitledFirstName], nos aproximamos sorrateiramente do(a) [activity.Custom('GetAnimalType')].\n\nEstamos quase perto o suficiente para atacar quando [secret_sharer.GetFirstNameNoTooltip] sussurra: \"Agora que finalmente estamos sozinhos, há algo que preciso te contar — sobre [secret_owner.GetTitledFirstName]...\""
 hunt.4002.t:0 "Rumores"
 hunt.4003.a:0 "Eles serão enforcados, e suas famílias pagarão."
 hunt.4003.adventurer:0 "Junte-se ao meu acampamento. [Select_CString( land_owner.IsFemale, 'A', 'O' )] [land_owner.GetTitleTierName] nunca irá encontrá-lo."
 hunt.4003.b:0 "\"Vocês todos parecem ser excelentes arqueiros...\""
 hunt.4003.c.tt_failure:0 "Indignação popular"
 hunt.4003.c.tt_success:0 "Magistrados locais concordam"
 hunt.4003.c:0 "O animal é meu, juntamente com multas por suas vidas."
 hunt.4003.d.own:0 "Saia da minha [host.GetCurrentLocation.Custom('GetTerrainType')]!"
 hunt.4003.d.rival:0 "Pegue o quanto quiser [Select_CString( land_owner.IsFemale, 'da', 'do' )] [land_owner.GetTitledFirstNameNoTooltip]."
 hunt.4003.d.vassal:0 "Saia da [host.GetCurrentLocation.Custom('GetTerrainType')] [Select_CString( land_owner.IsFemale, 'da', 'do' )] [land_owner.GetTitledFirstNameNoTooltip]!"
 hunt.4003.d:0 "\"O quanto eu me importo com o jogo [Select_CString( land_owner.IsFemale, 'da', 'do' )] [land_owner.GetTitledFirstNameNoTooltip]?\""
 hunt.4003.desc:0 "Caçadores ilegais aqui nas terras de [land_owner.GetTitleTierName]? Eles se juntam enquanto eu me aproximo com meus guardas, fazendo um trabalho ruim de esconder um [host.Custom('GetRegionalDeerType')] morto atrás deles.\n\n\"Nós não fizemos isso! Por favor, tenha misericórdia, glorioso [ROOT.Char.GetTitleAsNameNoTooltip]!\" Suas lâminas e arcos contradizem suas palavras."
 hunt.4003.e:0 "Finalmente, [Select_CString( land_owner.IsFemale, 'uma caçadora', 'um caçador' )] decente!"
 hunt.4003.t:0 "Presas Ilegais"
 hunt.4004.a:0 "Sua cabeça ficará linda em meu salão!"
 hunt.4004.b:0 "Será uma troféu para [Select_CString( trophy_recipient.IsFemale, 'a minha', 'o meu' )] [ROOT.Char.Custom2('RelationToMeShort', trophy_recipient)]."
 hunt.4004.c.tt:0 "Não, é #EMP NÃO#! berrante!"
 hunt.4004.c:0 "Ele fará um casaco esplêndido!"
 hunt.4004.credit_receiver:0 "[credit_taker.GetTitledFirstName] está igualmente impressionado(a). \"Nunca vi algo assim, [ROOT.Char.Custom('FormOfAddressForLiege')]."
 hunt.4004.d:0 "Acho que [Select_CString( credit_taker.IsFemale, 'a', 'o' )] [credit_taker.GetTitledFirstNameNoTooltip] merece o crédito por isso."
 hunt.4004.desc:0 "Você poderia pensar que é uma criatura mítica, talvez um deus disfarçado em forma animal. É o maior [activity.Custom('GetAnimalType')] que já vi.\n\nMesmo depois de ferido, a caçada durou meio dia.\n\nAinda é uma visão imponente, morto diante de mim."
 hunt.4004.e:0 "Nós o comemos aqui e agora!"
 hunt.4004.every_arrogant_vassal:0 "Todo vassalo arrogante"
 hunt.4004.every_other_vassal:0 "Vassalos não arrogantes, não contidos"
 hunt.4004.every_restrained_vassal:0 "Todo vassalo extremamente contido"
 hunt.4004.f:0 "Seu crânio fará uma bela coroa."
 hunt.4004.t:0 "Abatendo uma Besta"
 hunt.4005.a:0 "Este renderá um bom preço."
 hunt.4005.b:0 "Mandarei fazer um belo troféu para [Select_CString( trophy_recipient.IsFemale, 'a minha', 'o meu' )] [ROOT.Char.Custom2('RelationToMeShort', trophy_recipient)]."
 hunt.4005.c:0 "Ele será empalhado e enviado para o [ROOT.Char.GetFaith.ReligiousHeadName]!"
 hunt.4005.t:0 "Abatendo uma Besta"
 hunt.4006.a:0 "Expulse essa ralé das #EMP minhas#! terras de caça!"
 hunt.4006.adventurer:0 "Colher raízes e cogumelos... isso sim é uma ideia."
 hunt.4006.b:0 "Viemos aqui para caçar, não foi?"
 hunt.4006.c:0 "Ah, essa presa será perfeita..."
 hunt.4006.d:0 "Uma generosa doação deverá mantê-los afastados tempo suficiente."
 hunt.4006.desc:0 "A [host.GetCurrentLocation.Custom('GetTerrainTree')] é realmente 'o manto dos pobres', mas à medida que [activity.Custom('GetAnimalType')] foge em pânico dos camponeses que procuram alimentos, sinto minha paciência se esgotando.\n\nCertamente deve haver coisas melhores para se fazer em [host.GetCurrentLocation.GetNameNoTooltip] hoje do que catar raízes e cogumelos!"
 hunt.4006.e:0 "Esses #EMP são#! seus antigos direitos, suponho..."
 hunt.4006.special_interest:0 "Devido aos interesses incomuns [county_owner.GetHerHim]:"
 hunt.4006.t:0 "Os Forrageiros"
 hunt.4007.a.critical_failure:0 "Eu sou morto(a)"
 hunt.4007.a.failure:0 "Eu estou ferido(a)"
 hunt.4007.a.non_martial:0 "Rápido! Fiquem atrás de mim, [similar_participant.GetFirstNameNoTooltip]!"
 hunt.4007.a.non_martial_self:0 "Me dê sua faca! Eu mesmo farei isso!"
 hunt.4007.a.success:0 "Eu mato a fera"
 hunt.4007.a:0 "O caminho dele acaba aqui, comigo."
 hunt.4007.b.critical_failure:0 "[THIS.Char.GetTitledFirstNameNoTooltip] é mort[Select_CString( THIS.Char.IsFemale, 'a', 'o' )]"
 hunt.4007.b.failure:0 "[THIS.Char.GetTitledFirstNameNoTooltip] está ferid[Select_CString( THIS.Char.IsFemale, 'a', 'o' )]"
 hunt.4007.b.non_martial:0 "Ajuda! Alguém!"
 hunt.4007.b.success:0 "[THIS.Char.GetTitledFirstNameNoTooltip] mata a fera"
 hunt.4007.b:0 "[similar_participant.GetFirstNameNoTooltip], faça alguma coisa!"
 hunt.4007.c:0 "Não é mais difícil de lidar do que um cortesão desprezado!"
 hunt.4007.d:0 "[bodyguard.GetFirstNameNoTooltip]! A mim!"
 hunt.4007.desc_befriend:0 "Uma brisa suave sopra, eu e [Select_CString( similar_participant.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', similar_participant)], [similar_participant.GetTitledFirstName], estamos cochilando em uma clareira silenciosa quando ouvimos."
 hunt.4007.desc_ending:0 "\n\nEstalos de galhos, folhas se mexendo e pássaros gritando em medo anunciam a chegada do(a) [host.Custom('GetAnimalType')|l] furioso, e ele está vindo direto para nós!\n\n[similar_participant.GetSheHe|U] exclama: \"Olhe o tamanho desses #EMP [host.Custom('GetAnimalDanger')]#!!\""
 hunt.4007.desc_fallback:0 "Ao chegarmos ao topo de uma colina, eu e [Select_CString( similar_participant.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', similar_participant)], [similar_participant.GetTitledFirstName], ouvimos."
 hunt.4007.desc_lazy:0 "Uma brisa suave sopra, eu e [Select_CString( similar_participant.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', similar_participant)], [similar_participant.GetTitledFirstName], estamos cochilando em uma clareira silenciosa quando ouvimos."
 hunt.4007.desc_lustful:0 "[Select_CString( similar_participant.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', similar_participant)], [similar_participant.GetTitledFirstName], está impressionante em sua roupa de caça, e eu amaldiçoo a perturbação que tira minha atenção [similar_participant.GetHerHim]."
 hunt.4007.e:0 "#EMP PARA LONGE DE MIM, CRIATURA IMUNDA!#!"
 hunt.4007.f:0 "#EMP Fuja!#!"
 hunt.4007.t:0 "Fúria do(a) [host.Custom('GetAnimalType')]"
 hunt.4008.a.failure:0 "As pessoas não acreditam na mentira"
 hunt.4008.a.success:0 "Todos acreditam em mim"
 hunt.4008.a:0 "[hunt_participant.GetSheHe|U] lutou bravamente para salvar [peasant.GetSheHe], eu vi!"
 hunt.4008.animal:0 "o-o [activity.Custom('GetAnimalMale')] fez isso! Eu juro!\"\n\n"
 hunt.4008.b.failure:0 "O corpo é encontrado"
 hunt.4008.b.failure_tt:0 "[secret.GetName] [Select_CString( hunt_participant.IsFemale, 'da', 'do' )] [hunt_participant.GetTitledFirstName] é exposto"
 hunt.4008.b.success:0 "Conseguimos esconder o corpo"
 hunt.4008.b.success_tt:0 "O corpo permanece escondido"
 hunt.4008.b:0 "Rápido, me ajude a esconder o corpo!"
 hunt.4008.c.flavor:0 "Mesmo que seja apenas um camponês..."
 hunt.4008.c:0 "Você #EMP deve#! responder por isso, [hunt_participant.GetFirstNameNoTooltip]!"
 hunt.4008.closing:0 "Em breve, o resto do grupo alcançará e exigirá uma explicação."
 hunt.4008.d:0 "Pena que a 'besta' também te pegou #EMP..."
 hunt.4008.desc:0 "[Select_CString( hunt_participant.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)], [hunt_participant.GetTitledFirstName], foi na frente do grupo, perseguindo [activity.Custom('GetAnimalType')] sozinho(a). Quando eu alcanço, encontro [hunt_participant.GetSheHe] de pé sobre um[Select_CString( peasant.IsFemale, 'a', '' )] [peasant.GetWomanMan], puxando uma flecha do peito do(a) pobre camponês.\n\n[hunt_participant.GetSheHe|U] esconde a flecha atrás das costas quando [hunt_participant.GetSheHe] me vê. \"[ROOT.Char.GetTitleAsNameNoTooltip]! E-eu..."
 hunt.4008.fallback:0 "n-não foi minha culpa! Eu juro!\"\n\n"
 hunt.4008.t:0 "Herdeiro Desgarrado"
 hunt.4008.t_2:0 "Um Erro Honesto"
 hunt.4009.a.critical_failure:0 "[schemer.GetTitledFirstNameNoTooltip] me derrota"
 hunt.4009.a.failure:0 "Eu estou ferido, mas escapo [Select_CString( schemer.IsFemale, 'da', 'do' )] [schemer.GetTitledFirstNameNoTooltip]"
 hunt.4009.a.success:0 "Eu escapo [Select_CString( schemer.IsFemale, 'da', 'do' )] [schemer.GetTitledFirstNameNoTooltip]"
 hunt.4009.a:0 "Você não tem chance contra mim!"
 hunt.4009.b.critial_failure:0 "[saving_participant.GetTitledFirstNameNoTooltip] falha em me defender"
 hunt.4009.b.critical_failure:0 "[saving_participant.GetTitledFirstNameNoTooltip] falha em me defender"
 hunt.4009.b.critical_success:0 "[saving_participant.GetTitledFirstNameNoTooltip] fere [schemer.GetTitledFirstNameNoTooltip] e escapamos"
 hunt.4009.b.failure:0 "[saving_participant.GetTitledFirstNameNoTooltip] está ferid[Select_CString( saving_participant.IsFemale, 'a', 'o' )], mas escapamos [Select_CString( schemer.IsFemale, 'da', 'do' )] [schemer.GetTitledFirstNameNoTooltip]"
 hunt.4009.b:0 "Socorro! Socorro! [saving_participant.GetFirstNameNoTooltip]!"
 hunt.4009.c.failure:0 "[schemer.GetTitledFirstNameNoTooltip] me alcança"
 hunt.4009.c:0 "Se eu conseguir voltar para o acampamento!"
 hunt.4009.desc:0 "#EMP Crac—!#!\nConforme [activity.Custom('GetAnimalType')] [activity.Custom('GetAnimalAdjective')] que eu estava me aproximando desaparece na [host.GetCurrentLocation.Custom('GetTerrainType')], eu me viro em direção à origem do som.\n\n[schemer.GetTitledFirstName], [Select_CString( schemer.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', schemer)], está parado(a) atrás de mim com a faca em punho e determinação assassina nos olhos."
 hunt.4009.t:0 "Caçado"
 hunt.4010.a.critical_failure:0 "Eu falho em defender [targeted_participant.GetFirstNameNoTooltip]"
 hunt.4010.a.critical_success:0 "Eu ferro [schemer.GetFirstNameNoTooltip] e o(a) afasto"
 hunt.4010.a.failure:0 "[schemer.GetFirstNameNoTooltip] me fere, mas ambos escapamos"
 hunt.4010.a:0 "Não tenha medo, [Select_CString( targeted_participant.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', targeted_participant)]!"
 hunt.4010.b.critical_failure:0 "[schemer.GetFirstNameNoTooltip] derrota [targeted_participant.GetFirstNameNoTooltip] e se livra de qualquer testemunha"
 hunt.4010.b.critical_success:0 "[targeted_participant.GetFirstNameNoTooltip] fere [schemer.GetFirstNameNoTooltip] e o(a) afasta"
 hunt.4010.b.failure:0 "[targeted_participant.GetFirstNameNoTooltip] está [Select_CString( targeted_participant.IsFemale, 'ferida', 'ferido' )], mas escapa"
 hunt.4010.b:0 "Boa sorte, [targeted_participant.GetFirstNameNoTooltip]."
 hunt.4010.c:0 "Socorro! [schemer.GetFirstNameNoTooltip] está agredindo [Select_CString( targeted_participant.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', targeted_participant)]!"
 hunt.4010.d.flavor:0 "#EMP Leve-me no lugar dele(a)!#!"
 hunt.4010.d.tt:0 "Essa opção está disponível porque você é Honrado(a)"
 hunt.4010.d:0 "#EMP Nããã—!#!"
 hunt.4010.desc:0 "#EMP Crac—!#!\nConforme [activity.Custom('GetAnimalType')] [activity.Custom('GetAnimalAdjective')] que eu e [Select_CString( targeted_participant.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', targeted_participant)] estávamos nos aproximando desaparece na [host.GetCurrentLocation.Custom('GetTerrainType')], nós nos viramos em direção à origem do som.\n\n[schemer.GetTitledFirstName], [Select_CString( schemer.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', schemer)], está parado(a) atrás de nós com a faca em punho, apontando para [targeted_participant.GetFirstName]."
 hunt.4010.failure.murder_secret_tooltip:0 "Eu descubro o Segredo de Assassinato"
 hunt.4011.a.tt:0 "Vamos fazer como fazem no Bestiarum Vocabulum!"
 hunt.4011.a:0 "Oh [lover_participant.GetFirstNameNoTooltip]!"
 hunt.4011.b:0 "Mas e o(a) [activity.Custom('GetAnimalType')]...?"
 hunt.4011.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ali está o(a) [activity.Custom('GetAnimalType')]!\" [Select_CString( lover_participant.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', lover_participant)], [lover_participant.GetTitledFirstName], faz um gesto para que eu o siga até [lover_participant.GetSheHe] na [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]. Uma vez que estamos escondidos no [host.GetCurrentLocation.Custom('GetTerrainType')], [lover_participant.GetSheHe] se vira e puxa meu [ROOT.Char.Custom('GetUpperClothingArticle')] sobre minha cabeça.\n\n\"Finalmente um tempo a sós, meu [ROOT.Char.Custom('LoverPetName')]!\""
 hunt.4011.t:0 "Um Momento a Sós"
 hunt.4012.a.sighting:0 "Os rumores #EMP eram#! verdadeiros...!"
 hunt.4012.a.tt:0 "#EMP Eu tenho que ter o(a) [host.Custom('GetAnimalType')]!#!"
 hunt.4012.a:0 "Como algo de um conto..."
 hunt.4012.b:0 "É apenas um(a) [host.Custom('GetAnimalType')]."
 hunt.4012.black:0 "tão negro quanto o jet."
 hunt.4012.desc:0 "Estou indo à frente do grupo quando de repente a [host.GetCurrentLocation.Custom('GetTerrainType')] fica quieta.\n\nO silêncio é quase palpável, até mesmo o som dos cascos do meu cavalo parece desaparecer.\n\nJusto quando estou prestes a voltar para encontrar os outros, avisto-o à minha frente, borrado como um sonho — [host.Custom('GetAnimalType')|l]"
 hunt.4012.t:0 "[host.Custom('GetAnimalType')|U] [host.Custom('GetLegendaryColor')]"
 hunt.4012.white:0 "tão branco quanto a neve."
 hunt.4013.a.tt:0 "Você ganhará [stress|E] a cada ano em que a fera escapa de você"
 hunt.4013.a:0 "Escapou, #EMP desta vez#!."
 hunt.4013.a_modifier:0 "Os moradores de [activity_place.GetNameNoTier] estão perturbados"
 hunt.4013.b:0 "Eu estava... fazendo reconhecimento à frente."
 hunt.4013.c:0 "Seus tolos! Eu quase a capturei!"
 hunt.4013.closing:0 "Quando olho para trás, [activity.Custom('GetAnimalType')|l] desapareceu."
 hunt.4013.d:0 "Não vou perder tempo com essa loucura."
 hunt.4013.desc:0 "Sigo as pegadas da fera pelas [host.GetCurrentLocation.Custom('GetTerrainTypePlural')] como se estivesse em transe, um silêncio quase sobrenatural pairando sobre o mundo.\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip]! Aí está você!\" O grito repentino me assusta.\n\n"
 hunt.4013.guest:0 "[host.GetTitledFirstName] segue as pegadas da fera pelas [host.GetCurrentLocation.Custom('GetTerrainTypePlural')] como se estivesse em transe, um silêncio quase sobrenatural pairando sobre o mundo.\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip]! Aí está você!\" O grito repentino assusta [host.GetSheHe].\n\n"
 hunt.4013.participant:0 "[hunt_participant.GetFirstName] e o resto do meu grupo alcançam-me. "
 hunt.4014.a.failure:0 "Você estraga o curativo"
 hunt.4014.a.learning:0 "Aguente firme, eu sei o que fazer!"
 hunt.4014.a.physician:0 "Fique quieto, sou treinado em medicina!"
 hunt.4014.a.success:0 "Você cuida do ferimento [Select_CString( hunt_participant.IsFemale, 'da', 'do' )] [hunt_participant.GetFirstNameNoTooltip]"
 hunt.4014.a:0 "Eu vou cuidar [hunt_participant.GetHerHim]."
 hunt.4014.b.physician:0 "Diga-me como tratar você, doutor."
 hunt.4014.b:0 "Vamos dar um tempo para [hunt_participant.GetFirstNameNoTooltip]..."
 hunt.4014.branch:0 "[hunt_participant.GetTitledFirstName] se vira para me gritar, sem notar um galho baixo de [ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')] logo à frente!\n\n"
 hunt.4014.branch_host:0 "Me viro para gritar algo para [hunt_participant.GetFirstName], que olha à frente com o rosto contorcido de alarme. Tarde demais, eu vejo: bem diante dos meus olhos, um grande galho de [ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')]."
 hunt.4014.c.failure:0 "[physician.GetFirstNameNoTooltip] estraga o curativo"
 hunt.4014.c.host:0 "E então? Não fique apenas olhando [physician.GetFirstNameNoTooltip]!"
 hunt.4014.c.success:0 "[physician.GetFirstNameNoTooltip] cuida do ferimento"
 hunt.4014.c:0 "[physician.GetFirstNameNoTooltip]! #EMP Onde está [physician.GetFirstNameNoTooltip]?!#!"
 hunt.4014.cry:0 "Não consigo evitar e grito involuntariamente: \"[hunt_participant.GetFirstNameNoTooltip]!\"\n\n"
 hunt.4014.d:0 "Eu preciso continuar! [activity.Custom('GetAnimalType')|U] está escapando!"
 hunt.4014.dead:0 "[Select_CString( hunt_participant.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', hunt_participant)] jaz imóvel, contorcido em uma posição não natural, mas estranhamente sereno."
 hunt.4014.dead_care:0 "Eu desmonto, correndo em direção à figura caída [Select_CString( hunt_participant.IsFemale, 'da', 'do' )] [hunt_participant.GetWomanMan], mas meus piores medos são rapidamente confirmados..."
 hunt.4014.dead_host:0 "Não sinto o chão me receber. O tempo parece desacelerar. O céu escurece acima de mim, onde figuras se movimentam, seus gritos abafados ecoando através de uma névoa confusa."
 hunt.4014.dead_host_courtier:0 "Vejo o rosto [Select_CString( hunt_participant.IsFemale, 'da', 'do' )] [hunt_participant.GetTitledFirstName] se aproximando de mim, pálido como um fantasma, e lembro-me dos cavalos..."
 hunt.4014.desc:0 "Saltando através do [activity.GetCurrentPhase.GetLocation.Custom('GetProvinceFoliageDesc')], estamos quase alcançando nossa presa exausta; estamos perseguindo o(a) [activity.Custom('GetAnimalType')] há horas!\n\n"
 hunt.4014.e:0 "É hora de encerrar por hoje..."
 hunt.4014.f.flavor:0 "#EMP Rápido! Meu cavalo!#!"
 hunt.4014.f:0 "Estou bem! ah! #EMP Estou bem!#! Ela está fugindo!"
 hunt.4014.fall:0 "Ao meu lado, o cavalo [Select_CString( hunt_participant.IsFemale, 'da', 'do' )] [hunt_participant.GetTitledFirstName] perde repentinamente o equilíbrio, fazendo [hunt_participant.GetSheHe] cair no chão com um grito.\n\n"
 hunt.4014.fall_host:0 "Uma leve tensão em meu cavalo é meu único aviso antes de eu ser arremessado pelo ar, a terra se aproximando rapidamente."
 hunt.4014.g.flavor:0 "#EMP Preciso deitar...#!"
 hunt.4014.g:0 "L-levem-me de volta ao acampamento..."
 hunt.4014.h.physician:0 "#weak [physician.GetFirstNameNoTooltip]... Tra-traga...!#!"
 hunt.4014.h:0 "#weak ... [activity.Custom('GetAnimalType')|U]...!#!"
 hunt.4014.t:0 "Terreno Problemático"
 hunt.4014.wounded:0 "Não é nada fatal, mas [Select_CString( hunt_participant.IsFemale, 'a', 'o' )] [hunt_participant.GetWomanMan] está retorcendo de dor."
 hunt.4014.wounded_host:0 "Recupero os sentidos no [activity.GetCurrentPhase.GetLocation.Custom('GetProvinceGroundDesc')], caído em um monte, a dor percorrendo meu corpo."
 hunt.4014.wounded_host_courtier:0 "\"[Select_CString( host.IsFemale, 'Minha', 'Meu' )] [host.GetTitleAsNameNoTooltip]! Você está machucad[Select_CString( host.IsFemale, 'a', 'o' )]?!\" [hunt_participant.GetTitledFirstName] exclama, descendo de seu cavalo."
 hunt.4015.a:0 "Recuar lentamente... Eu não vi nada."
 hunt.4015.b:0 "\"Isso é uma desgraça! Parem imediatamente!\""
 hunt.4015.c_1:0 "\"[lover_participant.GetFirstNameNoTooltip], você estava me escondendo algo!\""
 hunt.4015.c_2:0 "\"[second_lover_participant.GetFirstNameNoTooltip], você estava me escondendo algo!\""
 hunt.4015.c_3:0 "\"Ohoho, esta é uma festa da qual eu posso participar!\""
 hunt.4015.c_4:0 "\"[lover_participant.GetFirstNameNoTooltip]! [second_lover_participant.GetFirstNameNoTooltip]! E quanto a #EMP mim#!?\""
 hunt.4015.d:0 "\"[second_lover_participant.GetTitledFirstNameNoTooltip], como você pôde?!\""
 hunt.4015.d_2:0 "\"[lover_participant.GetTitledFirstNameNoTooltip], como você pôde?!\""
 hunt.4015.desc:0 "Seguimos nossa presa até o [host.GetCurrentLocation.Custom('GetTerrainType')], lentamente nos aproximando do(a) [activity.Custom('GetAnimalType')] [activity.Custom('GetAnimalAdjective')].\n\nDe repente, ele se assusta, [activity.Custom('GetAnimalChargeParticiple')] em outra direção, e quando me aproximo para ver o que o assustou, mal posso acreditar no que vejo — [lover_participant.GetTitledFirstName] e [second_lover_participant.GetTitledFirstName] enredados no chão em um abraço apaixonado!"
 hunt.4015.e:0 "\"Levante-se, sinto que a fera está por perto!\""
 hunt.4015.t:0 "Os Amantes"
 hunt.4016.a:0 "O mercado mais próximo deve ter o(a) [activity.Custom('GetAnimalType')]..."
 hunt.4016.b.failure:0 "Meu engano é descoberto"
 hunt.4016.b.success:0 "As pessoas acreditam no meu plano"
 hunt.4016.b.tt:0 "O [activity.GetShortName] terá sucesso — de certa forma"
 hunt.4016.c:0 "Eu não vou me rebaixar tanto, prefiro voltar de mãos vazias!"
 hunt.4016.desc:0 "Nós devemos ter perseguido por todo o [ROOT.Char.Custom('TerrainType')] duas vezes, e ainda não estamos mais perto de encurralar o(a) [activity.Custom('GetAnimalType')]...\n\nTodos esperam que eu volte triunfante, com um troféu, mas como as coisas estão, eu voltarei para casa apenas com vergonha."
 hunt.4016.t:0 "O Troféu"
 hunt.4017.a.tt:0 "#EMP Ele nem tenta fugir...#!"
 hunt.4017.a:0 "Este é o meu momento!"
 hunt.4017.desc:0 "Eu deixo meu séquito para trás, vasculhando os [host.GetCurrentLocation.Custom('GetTerrainTypePlural')] em busca do(a) [activity.Custom('GetAnimalType')] [activity.Custom('GetLegendaryColor')] que tem me assombrado.\n\nDe repente, é como se eu estivesse debaixo d'água — o som está abafado, e a luz etérea. Ali!\n\nDiante de mim, ele está, o [host.GetCurrentLocation.Custom('GetTerrainType')] congelado ao seu redor — como se estivesse olhando diretamente para a minha #EMP alma#!."
 hunt.4018.a.animal:0 "Você encontra outro animal"
 hunt.4018.a.failure:0 "[activity.Custom('GetAnimalType')|U] [activity.Custom('GetLegendaryColor')] escapa"
 hunt.4018.a.success:0 "Você encontra [activity.Custom('GetAnimalType')] [activity.Custom('GetLegendaryColor')]"
 hunt.4018.a.tt:0 "#EMP Deve estar por aqui! Em algum lugar...#!"
 hunt.4018.a:0 "Vasculhe a área! #EMP Encontre aquele(a) [activity.Custom('GetAnimalType')]!#!"
 hunt.4018.b:0 "Esqueça. Já se foi..."
 hunt.4018.desc:0 "Uma quietude repentina cai sobre o [host.GetCurrentLocation.Custom('GetTerrainType')]. Virando-me em minha sela, vejo isso claramente — [activity.Custom('GetAnimalType')] [activity.Custom('GetLegendaryColor')].\n\nAntes que eu tenha tempo de chamar os outros, ele desaparece na [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] como uma aparição..."
 hunt.4019.a.tt:0 "Terá que servir... #EMP por enquanto#!."
 hunt.4019.a:0 "...sim, bem observado."
 hunt.4019.b:0 "Você acha que isso #EMP parece#! [activity.Custom('GetLegendaryColor')]?!"
 hunt.4019.courtier:0 "\"[[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" sibila [Select_CString( hunt_participant.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', hunt_participant)], [hunt_participant.GetFirstName], acenando para mim, apontando através dos [host.GetCurrentLocation.Custom('GetTerrainTypePlural')]."
 hunt.4019.desc:0 "\n\n\"Ali! Vê [activity.Custom('GetAnimalType')]? É o que você procura?\"\n\nÀ nossa frente está o(a) [activity.Custom('GetAnimalType')] perfeitamente comum, sem sequer um tufo de pele [activity.Custom('GetLegendaryColor')]."
 hunt.4019.fallback:0 "\"[[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" sibila de mestre, acenando para mim, apontando através do [host.GetCurrentLocation.Custom('GetTerrainType')]."
 hunt.4500.a.flavor:0 "Dos meus!"
 hunt.4500.a:0 "\"Meu/Minha [my_badge.GetNameNoTooltip] sempre me protegeu também!\""
 hunt.4500.b.flavor:0 "Nada protege esse emblema de #EMP mim#!!"
 hunt.4500.b.tt:0 "[badge_bragger.GetShortUIName] suspeita que você roubou [badge_bragger.GetHerHis] [badge_of_protection.GetName]"
 hunt.4500.b:0 "Proteção de #EMP ?#! Vamos ver sobre isso..."
 hunt.4500.c.tt:0 "Seu/Sua próximo(a)[GetActivityType('activity_pilgrimage').GetTextIcon][GetActivityType('activity_pilgrimage').GetName] [activity|E] é um pouco mais barato(a) pelos próximos #V 5#! anos"
 hunt.4500.c:0 "Talvez eu devesse conseguir meu próprio emblema."
 hunt.4500.d:0 "\"Que legal.\""
 hunt.4500.desc.no_badge:0 "[badge_bragger.GetTitledFirstName] continua tagarelando sem parar sobre [badge_bragger.GetHerHis] [badge_of_protection.GetName]. #EMP Incessantemente#!, a ponto de eu começar a temer que [badge_bragger.GetSheHe] esteja espantando a vida selvagem.\n\n\"Isso me protege de espíritos malignos, conjuradores, demônios...\" [badge_bragger.GetSheHe] insiste.\n\nEu rio zombeteiro, mas então uma vaga memória de uma história que aconteceu uma vez ao meu/minha bis[ROOT.Char.GetMotherFather] vem à tona. Certamente não é nada. Apenas uma bugiganga. Certo?"
 hunt.4500.desc:0 "Dou de encontro com meu/minha [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('badge_bragger'))], [badge_bragger.GetTitledFirstName], e outro membro do grupo de caça, profundamente absortos em admirar [badge_bragger.GetFirstNamePossessiveNoTooltip] [badge_of_protection.GetName].\n\n\"Isso tem me protegido desde que [protection_badge_holy_site.GetName]... certamente o espírito santo está comigo.\"\n\nMinha mão se move instintivamente para o meu [my_badge.GetName], alojado com segurança no forro da minha veste."
 hunt.4500.t:0 "Emblema de Proteção"
 hunt.4900.a.dead:0 "#EMP [portrait.GetFirstNameNoTooltip]...#! você morreu bravamente..."
 hunt.4900.a.flee:0 "Você não estava #EMP lá#!! Era #EMP ENORME#!!"
 hunt.4900.a.hunter:0 "#EMP É assim que se mata um(a) [ROOT.Char.Custom('GetAnimalType')]."
 hunt.4900.a.scare:0 "E não volte mais!"
 hunt.4900.assist:0 "\n\n[similar_participant.GetFirstName] pega sua faca do cinto, entrando em ação entre mim e [activity.Custom('GetAnimalTypeKill')]. Ele grita \"Recue, [ROOT.Char.GetTitleAsNameNoTooltip]!\" enquanto o animal subitamente [activity.Custom('GetAnimalChargePresentKill')] em nossa direção.\n\nO tempo parece quase parar quando [similar_participant.GetSheHe] intercepta o borrão de [activity.Custom('GetAnimalFeatureKill')].\n\nQuando a poeira assenta, [activity.Custom('GetAnimalTypeKill')] está morto(a),"
 hunt.4900.assist_dead:0 "mas [similar_participant.GetFirstNameNoTooltip] também está..."
 hunt.4900.assist_kill:0 "e [similar_participant.GetFirstNameNoTooltip] fica em pé sobre ele, limpando sua lâmina com um sorriso..."
 hunt.4900.assist_wound:0 "mas [similar_participant.GetFirstNameNoTooltip] claramente está ferido(a)..."
 hunt.4900.b:0 "Eu vou guardar algo para lembrar disso."
 hunt.4900.befriend:0 "\n\nEu estendo calmamente minha mão. [activity.Custom('GetAnimalTypeKill')|U] relaxa, confuso, antes de parar hesitante, cheirando meus dedos com desconfiança."
 hunt.4900.befriend_dead:0 "\n\nA besta repentinamente fica tensa, quase parecendo fazer uma careta. Eu fico paralisado, fechando os olhos enquanto a besta avança, [activity.Custom('GetAnimalSoundParticipleKill')] horrivelmente."
 hunt.4900.befriend_success:0 "\n\nAparentemente satisfeito(a), ele(a) boceja amplamente antes de se deitar a meus pés, como se fosse dormir."
 hunt.4900.befriend_wound:0 "\n\nSem aviso, ele avança novamente, me derrubando pesadamente antes de correr para longe e desaparecer de vista."
 hunt.4900.bodyguard:0 "\n\nMeu guarda-costas, [bodyguard.GetFirstName], entra em ação, espada em punho, enquanto [bodyguard.GetSheHe] me chama para ficar atrás [bodyguard.GetHerHim] com o outro braço. \"Recue, [ROOT.Char.Custom('FormOfAddressForLiege')]!\n\nO animal avança,"
 hunt.4900.bodyguard_dead:0 "e mal consigo assistir quando [bodyguard.GetSheHe] é jogado de lado como um boneco de pano, apesar de ferir a besta. O animal ferido foge para longe enquanto [bodyguard.GetFirstNameNoTooltip] desaba no chão da [host.GetCurrentLocation.Custom('GetProvinceGroundDesc')]!"
 hunt.4900.bodyguard_saved:0 "e mal consigo assistir enquanto ele é empalado com precisão na lâmina habilmente manejada [Select_CString( bodyguard.IsFemale, 'da', 'do' )] [bodyguard.GetFirstName]!"
 hunt.4900.bodyguard_wound:0 "e mal consigo assistir quando [bodyguard.GetSheHe] é dilacerado pela besta, embora [bodyguard.GetFirstNameNoTooltip] consiga derrubá-la no processo..."
 hunt.4900.c:0 "#weak Astuto... mald...#!"
 hunt.4900.d:0 "Chega, vamos para casa!"
 hunt.4900.desc:0 "A grande fera para bem diante de nós, [activity.Custom('GetAnimalSoundParticipleKill')] e [activity.Custom('GetAnimalStrikeParticipleKill')] selvagemente."
 hunt.4900.flee:0 "\n\nEu viro e corro o mais rápido que posso, ouvindo o ofegar frenético [Select_CString( similar_participant.IsFemale, 'da', 'do' )] [similar_participant.GetFirstName] logo atrás de mim.\n\nLogo alcançamos os outros, onde conseguimos falar entre ofegos: \"#EMP [ROOT.Char.Custom('GetAnimalType')]#!\" e \"#EMP [ROOT.Char.Custom('GetAnimalDanger')]#!\". A besta não está em lugar algum."
 hunt.4900.hunter:0 "\n\nEu pego minha faca do meu cinto e me coloco entre [activity.Custom('GetAnimalTypeKill')] e [similar_participant.GetFirstName] segundos antes de o animal subitamente [activity.Custom('GetAnimalChargePresentKill')] em nossa direção.\n\nMinha lâmina encontra seu coração,"
 hunt.4900.hunter_dead:0 "mas, olhando para baixo, suas [activity.Custom('GetAnimalDangerKill')] encontraram as minhas.\n\nA luz enfraquece enquanto eu estou caído(a) em um emaranhado de pelo, carne quente e sangue, com [similar_participant.GetFirstNameNoTooltip] chamando meu nome..."
 hunt.4900.hunter_kill:0 "suas [activity.Custom('GetAnimalDangerKill')] mal me atingem, e ele cai no chão em um monte..."
 hunt.4900.hunter_wound:0 "mas não antes de ser jogado(a) para o lado, escapando por pouco de suas [activity.Custom('GetAnimalDangerKill')]..."
 hunt.4900.scare:0 "\n\nEle rapidamente repensa sua atitude, recuando enquanto eu caminho lentamente em sua direção, agitando meus braços e gritando insultos. Por fim, ele vira e desaparece de vista."
 hunt.4900.t:0 "Fúria do(a) [activity.Custom('GetAnimalTypeKill')]"
 hunt.5001.a:0 "Devo manter as aparências."
 hunt.5001.b:0 "Por que devo me importar com o que os outros pensam?"
 hunt.5001.c.success:0 "[hunt_participant.GetTitledFirstNameNoTooltip] cai na mais antiga das artimanhas"
 hunt.5001.c:0 "\"Ei, o que é aquilo ali!?\""
 hunt.5001.d.medicinal:0 "#EMP Presentes de [ROOT.Char.GetFaith.HealthGodName]...#!"
 hunt.5001.d.poisonous:0 "#EMP Presentes de [ROOT.Char.GetFaith.DeathDeityName]...#!"
 hunt.5001.d:0 "Esqueça as flores: olhe para estas ervas!"
 hunt.5001.desc.ending:0 "\n\nTantas ervas úteis e flores bonitas! Tanto para cura quanto para intenções malignas — mas estou aqui para caçar! Colher [host.GetCurrentLocation.Custom('get_region_flower_type_plural')] pode causar algumas suspeitas..."
 hunt.5001.desc.religious:0 "Vejo ao longe o que só pode ser um presente de, ou dedicação da natureza a, [ROOT.Char.GetFaith.HealthGodName]."
 hunt.5001.desc.witch:0 "Avisto um tesouro de presentes da mãe natureza."
 hunt.5001.desc:0 "É um dia adorável para caçar, o que significa que é um bom dia para estar ao ar livre. Enquanto encho meus pulmões com o ar fresco da natureza,"
 hunt.5001.t:0 "Flores Silvestres"
 hunt.5002.a.flavor:0 "#EMP Estamos aqui pelo(a) [activity.Custom('GetAnimalType')]!#!"
 hunt.5002.a.second:0 "Voltem a montar nos seus cavalos!"
 hunt.5002.a:0 "Volte a montar no seu cavalo!"
 hunt.5002.alone:0 "[hunt_participant.GetSheHe|U] parece ter perdido todo interesse na caçada.\n\n"
 hunt.5002.b:0 "Fascinante! O que é #EMP aquela#! flor?"
 hunt.5002.c.flavor:0 "#EMP Magia negra! Veneno!#!"
 hunt.5002.c.known:0 "Pare imediatamente com essa bruxaria, maldito mago!"
 hunt.5002.c:0 "V-você está praticando #EMP bruxaria#!...?"
 hunt.5002.cp_elsewhere_flavor:0 "#EMP Você não se importa de ficar para colher, não é?#!"
 hunt.5002.cp_flavor:0 "#EMP ...mas continuaremos!#!"
 hunt.5002.cp_present_flavor:0 "#EMP [hunt_participant.GetFirstNameNoTooltip] tem um trabalho para você, curandeiro!#!"
 hunt.5002.d.flavor:0 "#EMP Devemos proteger o caminho de [ROOT.Char.GetFaith.WitchGodName]...#!"
 hunt.5002.d:0 "...você está chamando atenção, [hunt_participant.Custom('SisterBrother')]."
 hunt.5002.desc:0 "\"[ROOT.Char.GetTitleAsNameNoTooltip], que abundância da natureza! Olhe para essas plantas! Verdadeiramente, a riqueza da terra não tem limites — não apreciamos esses tesouros simples o suficiente.\""
 hunt.5002.e.flavor:0 "#EMP Deixe-me contar tudo sobre elas...#!"
 hunt.5002.e.gardener:0 "Tenho #EMP procurado#! mais dessas!"
 hunt.5002.e.herbalist:0 "Sim, e #EMP esta#! talvez seja a erva mais útil!"
 hunt.5002.e:0 "Você tem um bom olho, de fato!"
 hunt.5002.g.elsewhere:0 "[gardener.GetFirstNameNoTooltip] #EMP apreciaria#! essas flores..."
 hunt.5002.g.present:0 "[gardener.GetFirstNameNoTooltip], aqui!"
 hunt.5002.g:0 "Suponho que novas flores #EMP seriam#! agradáveis..."
 hunt.5002.gardener:0 "\"Ah, [ROOT.Char.GetTitleAsNameNoTooltip], essas flores exquisitas me deram uma ideia para novos arranjos — #EMP essas#! ficariam perfeitas nas bordas dos caminhos do palácio...\""
 hunt.5002.h.elsewhere:0 "[physician.GetFirstNameNoTooltip] poderia usar essas ervas..."
 hunt.5002.h.present:0 "[physician.GetFirstNameNoTooltip], aqui!"
 hunt.5002.h:0 "Meu médico terá o que [physician.GetSheHe] precisa."
 hunt.5002.opening:0 "[Select_CString( hunt_participant.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', hunt_participant)], [hunt_participant.GetFirstName], está agachado no chão, cantarolando alegremente, colhendo [host.GetCurrentLocation.Custom('get_region_flower_type_plural')]."
 hunt.5002.opening_position:0 "[Select_CString( hunt_participant.IsFemale, 'Minha', 'Meu' )] [hunt_participant.GetHeldCourtPositionsString], [hunt_participant.GetFirstName], desmontou para agachar-se no [hunt_participant.GetCurrentLocation.Custom('GetProvinceGroundDesc')], examinando cuidadosamente uma flor [host.GetCurrentLocation.Custom('get_region_flower_type')]."
 hunt.5002.physician:0 "\"[ROOT.Char.GetTitleAsNameNoTooltip], olhe todas as ervas e flores úteis aqui! Essa pode aliviar dores! Essa ajuda um osso [hunt_participant.Custom('RandomSaintBone')|l] quebrado! Essa afasta [hunt_participant.Custom('RandomDisease')|l]..\""
 hunt.5002.second:0 "[hunt_participant_2.GetFirstName], [Select_CString( hunt_participant_2.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', hunt_participant_2)], olha por cima do ombro [hunt_participant.GetHerHim], ouvindo atentamente.\n\n"
 hunt.5002.second_position:0 "Ao lado [hunt_participant.GetHerHim], [Select_CString( hunt_participant_2.IsFemale, 'minha', 'meu' )] [hunt_participant_2.GetHeldCourtPositionsString], [hunt_participant_2.GetFirstName], fala animadamente, apontando para as pétalas."
 hunt.5003.a:0 "Você está #EMP tentando#! ser pego(a)?!"
 hunt.5003.b.tt:0 "Alguém pode descobrir sobre o seu relacionamento [secreto|E]"
 hunt.5003.b.woo:0 "Obrigado, é muito bonito."
 hunt.5003.b:0 "Eu #EMP vou guardar#! isso, meu querido."
 hunt.5003.c:0 "Não tenho uso para isso."
 hunt.5003.d.woo:0 "Venha aqui, estamos bem sozinhos..."
 hunt.5003.d:0 "Venha aqui, meu amor."
 hunt.5003.desc.animal:0 "[hunt_participant.GetSheHe|U] ergue os restos ensanguentados de uma lebre. \"Eu matei esse pequenino em sua honra, um símbolo do meu compromisso de lutar ao seu lado para sempre.\""
 hunt.5003.desc.flower:0 "[hunt_participant.GetSheHe|U] coloca algo atrás da minha orelha. \"Embora não se compare à sua beleza, essa [newly_created_artifact.Custom('ArtifactVariableFlowerSpecies')] me fez lembrar de você.\""
 hunt.5003.desc:0 "Enquanto meu estresse se dissipa, ouço [Select_CString( hunt_participant.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)], [hunt_participant.GetFirstName], rir suavemente: \"#EMP Meu amor.#!\"\n\n"
 hunt.5003.desc_woo:0 "Sou [Select_CString( ROOT.Char.IsFemale, 'surpreendida', 'surpreendido' )] por [Select_CString( hunt_participant.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)], [hunt_participant.GetFirstName], que ri: \"Um presente, para [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip].\"\n\n"
 hunt.5003.ending:0 "\n\n[hunt_participant.GetFirstNameNoTooltip] sorri, admirando o trabalho realizado."
 hunt.5003.ending_lover:0 "\"Você parece tão em paz. Fico feliz.\" [hunt_participant.GetSheHe|U] rapidamente me dá um beijo casto na bochecha, como se fôssemos os únicos no mundo."
 hunt.5003.ending_woo:0 "\"Fico feliz em ter te encontrado sozinho(a).\" [hunt_participant.GetSheHe|U] cora levemente, seu olhar transmitindo algo... não dito."
 hunt.5003.opening:0 "Em um raro momento de tranquilidade, passo algum tempo em silêncio, apreciando a beleza da natureza."
 hunt.5010.a:0 "Presas são presas, vamos acabar com isso."
 hunt.5010.b:0 "Pegue o [activity.Custom('GetAnimalChild')] para domesticar!"
 hunt.5010.c:0 "Encontre aquele [activity.Custom('GetAnimalMale')]!"
 hunt.5010.desc:0 "Enquanto avançamos pelas [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], seguindo de perto a trilha de [activity.Custom('GetAnimalType')], chegamos a uma clareira sem saída abaixo de uma pequena falésia.\n\nUm gemido audível de desapontamento e irritação se levanta do grupo: uma cervatilha aterrorizada e seu filhote encolhem-se no [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')] — devemos ter caído em seus rastros em nossa pressa...\n\nNão faz sentido caçá-los: teremos que voltar e farejar o [activity.Custom('GetAnimalMale')] novamente antes que seja tarde demais."
 hunt.5010.t:0 "Uma Cervatilha Amedrontada [activity.Custom('GetAnimalFemale')|U]"
 hunt.5050.a.failure:0 "O pássaro escapa"
 hunt.5050.a.success:0 "Você vinga seu [activity.Custom('GetRaptorType')]"
 hunt.5050.a:0 "Maldito canalha! Vamos atrás dele!"
 hunt.5050.b:0 "Parece que eu vou precisar do #EMP seu#! [activity.Custom('GetRaptorType')], [hunt_participant.GetFirstNameNoTooltip]."
 hunt.5050.c.tt:0 "Você receberá um trinket de pena [artifact|E]"
 hunt.5050.c:0 "Ah, uma de suas penas."
 hunt.5050.d:0 "A natureza é cruel..."
 hunt.5050.desc:0 "Meu [activity.Custom('GetRaptorType')] decola magnificamente de seu posto de observação, voando direto para o(a) [activity.Custom('GetAnimalType')] [activity.Custom('GetAnimalColor')] escondido na [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')].\n\nAo atingir o pico, um grito agudo soa sobre nossas cabeças, um som alto e estridente demais para pertencer a qualquer um de nossos pássaros.\n\nAssim que meu [activity.Custom('GetRaptorType')] começa a mergulhar, ele é atacado por uma enorme [host.Custom('GetRegionalEagleType')] — arrancado do ar em um violento borrifo de penas!"
 hunt.5050.t:0 "Arrancado dos Céus"
 hunt.5060.a:0 "Levem-no de volta ao meu alojamento."
 hunt.5060.b:0 "Aqui está, [hunt_participant.GetFirstNameNoTooltip], um presente!"
 hunt.5060.c:0 "Coloque-o de volta."
 hunt.5060.desc:0 "Meu grupo e eu nos movemos furtivamente por um bosque, os olhos atentos a qualquer sinal de [activity.Custom('GetAnimalType')]. Do dossel acima, um gorjeio suave se derrama, ficando mais alto à medida que avançamos.\n\nÉ um filhote piando pela mãe!\n\nUm caçador ágil derruba um filhote de rapinante fofinho e ainda sem penas, de uma [ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')]. Que sorte! Apenas aves jovens capturadas na natureza podem ser adequadamente treinadas para caçar."
 hunt.5060.t:0 "Debaixo das Minhas Asas"
 hunt.7001.a:0 "#EMP No seu#! pântano, é? Então nos mostre ao redor."
 hunt.7001.adventurer:0 "Você não preferiria ver o mundo conosco?"
 hunt.7001.b:0 "Vamos conversar sobre isso."
 hunt.7001.b_failure:0 "O lunático é inalcançável pela lógica."
 hunt.7001.b_success:0 "O homem entende meus argumentos... acho."
 hunt.7001.c:0 "Finalmente! Algo para caçar!"
 hunt.7001.d:0 "Saia do meu caminho, rústico maldito!"
 hunt.7001.desc:0 "O solo fica mais úmido e o ar mais pesado conforme avançamos profundamente pela selvageria de [host.GetCurrentLocation.GetNameNoTooltip].\n\nDe repente, de dentro da vegetação que nos cerca, surge um homem gigante — maciço em camadas de roupas sujas.\n\nEle grita: \"Expliquem-se! O que vocês estão fazendo #EMP no#! meu pântano?\""
 hunt.7001.t:0 "Um Encontro Lamacento"
 hunt.7011.a:0 "Preciso seguir em frente, senão perderemos [activity.Custom('GetAnimalType')]!"
 hunt.7011.alive:0 "\n\n[hunt_participant.GetSheHe|U] uiva de dor,"
 hunt.7011.b:0 "[physician.GetFirstNameNoTooltip]! Onde está [physician.GetFirstNameNoTooltip]?"
 hunt.7011.bear:0 "Olho para ver [Select_CString( hunt_participant.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', hunt_participant)] com o pé preso na boca de uma armadilha de urso que se projeta ameaçadoramente do espinheiro."
 hunt.7011.c:0 "Meus homens vão levá-lo de volta."
 hunt.7011.d.failure:0 "Alguém está desconfiado"
 hunt.7011.d.flavor:0 "#EMP ...e bateu a cabeça nesta pedra...#!"
 hunt.7011.d.success:0 "Ninguém percebe"
 hunt.7011.d:0 "Infelizmente, você caiu muito forte..."
 hunt.7011.dead:0 "\n\nPrecisamos seguir em frente, senão perderemos [activity.Custom('GetAnimalType')]!"
 hunt.7011.desc:0 "Enquanto [Select_CString( hunt_participant.IsFemale, 'a', 'o' )] [hunt_participant.GetTitledFirstName] e eu avançamos a pé por um terreno problemático, quase pulo de susto com o som de um grito poderoso.\n\n"
 hunt.7011.e.flavor:0 "#EMP Ninguém rouba do [ROOT.Char.GetTitleAsNameNoTooltip]!#!"
 hunt.7011.e.hunting_grounds:0 "Essa opção está disponível por causa da [building|E] $building_type_hunting_grounds_01$ de [host.GetCurrentLocation.GetTitle.GetBaseNameNoTier]"
 hunt.7011.e.royal_forests:0 "Essa opção está disponível por causa da [building|E] $building_type_royal_forest_01$ de [host.GetCurrentLocation.GetTitle.GetBaseNameNoTier]"
 hunt.7011.e:0 "Encontrem os caçadores e cortem suas mãos."
 hunt.7011.lowborn:0 "\"Minha perna! Argh! Eu não vi essa maldita coisa! #EMP Argh!#!\""
 hunt.7011.noble:0 "\"Argh! Esses malditos plebeus! Por que [Select_CString( hunt_participant.IsFemale, 'elas não caçam como verdadeiras', 'eles não caçam como verdadeiros' )] [hunt_participant.GetWomenMen]?!\""
 hunt.7011.pit:0 "Olho para ver [Select_CString( hunt_participant.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', hunt_participant)] caída em uma armadilha de fossa oculta, que agora segura firmemente a perna [hunt_participant.GetHerHim] no lugar."
 hunt.7011.snare:0 "Olho para ver [Select_CString( hunt_participant.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', hunt_participant)] caída no chão, com uma armadilha apertando firmemente a panturrilha [hunt_participant.GetHerHim]."
 hunt.7011.t:0 "Preso em uma Armadilha"
 hunt.7020.a.flavor:0 "#EMP É apenas um seixo!#!"
 hunt.7020.a.intent:0 "Observem isso, [pertinent.GetFirstNameNoTooltip]!"
 hunt.7020.a:0 "Todos, ajudem [onlooker.GetFirstNameNoTooltip] a empurrar a grande para mim!"
 hunt.7020.b.flavor:0 "#EMP Eu vou superá-la com facilidade!#!"
 hunt.7020.b:0 "Empurre outra, eu vou saltar por cima!"
 hunt.7020.befriend:0 "Essa pode ser a oportunidade perfeita para me aproximar [Select_CString( pertinent.IsFemale, 'da', 'do' )] [pertinent.GetFirstNameNoTooltip] que eu estava esperando."
 hunt.7020.bravado:0 "Diga, essa pode ser uma chance de impressionar a todos..."
 hunt.7020.c.flavor:0 "#EMP O que poderia dar errado?#!"
 hunt.7020.c.rival:0 "Com medo de pular, [pertinent.GetFirstNameNoTooltip]?"
 hunt.7020.c:0 "[pertinent.GetFirstNameNoTooltip], você consegue pular?"
 hunt.7020.d.flavor:0 "#EMP Com cuidado agora!#!"
 hunt.7020.d:0 "Vamos lá, [pertinent.GetFirstNameNoTooltip], vamos ver quem consegue pular mais!"
 hunt.7020.desc:0 "O grupo parou, distraído por um afloramento de pedras arredondadas no topo de uma encosta. [onlooker.GetTitledFirstName] empurra uma delas solta.\n\nTodos observam com atenção enquanto a pedra rola, ganhando velocidade, chegando ao fundo do morro com um baque satisfatório.\n\n"
 hunt.7020.e.flavor:0 "#EMP Seria bobagem fazer de outra forma...#!"
 hunt.7020.e:0 "Muito bem, vamos continuar."
 hunt.7020.murder:0 "Eu me pergunto... [pertinent.GetFirstNameNoTooltip] é arrogante o suficiente para cair nisso..."
 hunt.7020.t:0 "Desafiando a Gravidade"
 hunt.7020.woo:0 "Como provar melhor meu valor para [pertinent.GetFirstNameNoTooltip] do que saltar sobre uma pedra?"
 hunt.7100.a.tt:0 "#F Apelar para o lado ativo [Select_CString( woo_target.IsFemale, 'da', 'do' )] [woo_target.GetFirstNameNoTooltip].#!"
 hunt.7100.a:0 "Não há nada melhor do que uma boa caçada!"
 hunt.7100.b.tt:0 "#F Apelar para o lado social [Select_CString( woo_target.IsFemale, 'da', 'do' )] [woo_target.GetFirstNameNoTooltip].#!"
 hunt.7100.b:0 "Domar e voar com um [activity.Custom('GetRaptorType')] é viver de verdade."
 hunt.7100.c.tt:0 "#F Apelar para o lado compassivo [Select_CString( woo_target.IsFemale, 'da', 'do' )] [woo_target.GetFirstNameNoTooltip].#!"
 hunt.7100.c:0 "Às vezes, sinto pena dos pobres animais."
 hunt.7100.currentspouse:0 "Talvez hoje eu conquiste [Select_CString( woo_target.IsFemale, 'minhas', 'meus' )] [woo_target.GetWomenMen]!"
 hunt.7100.d.tt:0 "#F Apelar para o lado diligente [Select_CString( woo_target.IsFemale, 'da', 'do' )] [woo_target.GetFirstNameNoTooltip].#!"
 hunt.7100.d:0 "Eu preferiria estar fazendo algo útil, é claro."
 hunt.7100.desc:0 "\n\n\"Ah [woo_target.GetTitledFirstName], é um belo dia para isso, espero que esteja se divertindo?\" Eu abro a conversa sem cerimônia.\n\nEstou quase certo de que o sorriso [woo_target.GetHerHim] é mais do que apenas educado."
 hunt.7100.e.tt:0 "#F Apelar para o lado de administração [Select_CString( woo_target.IsFemale, 'da', 'do' )] [woo_target.GetFirstNameNoTooltip].#!"
 hunt.7100.e:0 "Uma floresta bem cuidada transborda com os presentes de [ROOT.Char.GetFaith.HighGodName]."
 hunt.7100.married:0 "Eu me aproximo enquanto [Select_CString( woo_target.IsFemale, 'sua', 'seu' )] [woo_target.GetPrimarySpouse.GetWifeHusband], [woo_target.GetPrimarySpouse.GetTitledFirstName], está distraíd[Select_CString( woo_target.IsFemale, 'a', 'o' )]."
 hunt.7100.married_absent:0 "[Select_CString( woo_target.IsFemale, 'Sua', 'Seu' )] [woo_target.GetPrimarySpouse.GetWifeHusband], [woo_target.GetPrimarySpouse.GetTitledFirstName], está longe..."
 hunt.7100.opening:0 "Enquanto esperamos os cães encontrarem o cheiro, o grupo descansa à sombra. [woo_target.GetFirstName] descansa por perto: esse seria o momento perfeito para uma conversa inocente."
 hunt.7100.t:0 "Um Momento para Conversar"
 hunt.7101.a:0 "Não posso negar que [woo_actor.GetSheHe] tem um certo charme..."
 hunt.7101.falconer:0 "$hunt.7101.reply_falconer$Eu entendo o simbolismo ao qual [woo_actor.GetSheHe] se refere."
 hunt.7101.fallback:0 "É difícil para mim pensar em uma resposta."
 hunt.7101.hunter:0 "$hunt.7101.reply_hunter$Não posso negar que a emoção, a ação, é uma alegria."
 hunt.7101.opening:0 "[woo_actor.GetTitledFirstName] se aproxima de mim enquanto o grupo descansa à sombra, esperando os cães encontrarem o cheiro.\n\n[woo_actor.GetSheHe|U] pensa por um momento antes de oferecer:"
 hunt.7101.pity:0 "$hunt.7101.reply_pity$Talvez [woo_actor.GetSheHe] seja diferente dos outros."
 hunt.7101.reply_falconer:0 "\"$hunt.7100.b$\"\n\n"
 hunt.7101.reply_hunter:0 "\"$hunt.7100.a$\"\n\n"
 hunt.7101.reply_pity:0 "\"$hunt.7100.c$\"\n\n"
 hunt.7101.reply_steward:0 "\"$hunt.7100.e$\"\n\n"
 hunt.7101.reply_wastrel:0 "\"$hunt.7100.d$\"\n\n"
 hunt.7101.steward:0 "$hunt.7101.reply_steward$Realmente há beleza na natureza organizada."
 hunt.7101.wastrel:0 "$hunt.7101.reply_wastrel$Esta é um[Select_CString( woo_actor.IsFemale, 'a', '' )] [woo_actor.GetWomanMan] que está indo longe."
 hunt.7102.a:0 "Que [woo_actor.GetWomanMan] ridícul[Select_CString( woo_actor.IsFemale, 'a', 'o' )]."
 hunt.7102.falconer:0 "$hunt.7101.reply_falconer$\n\nTamanho arrogância..."
 hunt.7102.fallback:0 "[woo_actor.GetSheHe|U] simplesmente sorri para mim com conhecimento, me deixando #EMP profundamente#! desconfortável."
 hunt.7102.hunter:0 "$hunt.7101.reply_hunter$\n\nNão consigo evitar uma sensação de repulsa interna..."
 hunt.7102.pity:0 "$hunt.7101.reply_pity$\n\nAprenda a aceitar um elogio, pelo amor de Deus!"
 hunt.7102.steward:0 "$hunt.7101.reply_steward$\n\n"
 hunt.7102.wastrel:0 "$hunt.7101.reply_wastrel$\n\n"
 hunt.7103.a:0 "Acho que [woo_target.GetSheHe] está interessado(a)..."
 hunt.7103.desc:0 "\n\nQuando [woo_target.GetSheHe] parte, a tensão é palpável em cada cortesia - eu sabia que encontraria as palavras certas para conquistar [woo_target.GetSheHe]!"
 hunt.7103.falconer:0 "$hunt.7103.reply$, quase parecendo me examinar com um novo olhar."
 hunt.7103.fallback:0 "$hunt.7103.reply$, olhando profundamente em meus olhos."
 hunt.7103.hunter:0 "$hunt.7103.reply$, com os olhos brilhando enquanto [woo_target.GetSheHe] acena vigorosamente."
 hunt.7103.pity:0 "$hunt.7103.reply$, lamentando os esportes violentos de nosso tempo e classe."
 hunt.7103.reply:0 "[woo_target.GetTitledFirstName] parece ter reagido calorosamente ao meu estratagema."
 hunt.7103.steward:0 "$hunt.7103.reply$, feliz por ter encontrado alguém que também encontra alegria em tais coisas."
 hunt.7103.wastrel:0 "$hunt.7103.reply$, claramente surpreso(a) por ter encontrado uma alma gêmea."
 hunt.7104.a:0 "O que eu estava pensando...?"
 hunt.7104.desc:0 "\n\nFicando sozinho(a) após sua despedida, não consigo deixar de me sentir um tolo por um erro tão grande..."
 hunt.7104.falconer:0 "$hunt.7104.reply$, pois [woo_target.GetSheHe] revira os olhos com desdém."
 hunt.7104.fallback:0 "$hunt.7104.reply$, pois [woo_target.GetSheHe] não consegue deixar minha companhia rápido o suficiente."
 hunt.7104.hunter:0 "$hunt.7104.reply$, pois [woo_target.GetSheHe] evita meu olhar quando [woo_target.GetSheHe] me agradece e rapidamente se retira."
 hunt.7104.pity:0 "$hunt.7104.reply$, pois [woo_target.GetSheHe] perde rapidamente o interesse, desanimado(a) com minhas palavras."
 hunt.7104.reply:0 "Minha resposta parece não ter impressionado [Select_CString( woo_target.IsFemale, 'a', 'o' )] [woo_target.GetTitledFirstName]."
 hunt.7104.steward:0 "$hunt.7104.reply$, pois [woo_target.GetSheHe] parece distraído(a), parecendo apenas meio ouvir."
 hunt.7104.wastrel:0 "$hunt.7104.reply$, pois [woo_target.GetSheHe] parece distraído(a), parecendo apenas meio ouvir."
 hunt.7200.a:0 "Hoje é o dia."
 hunt.7200.accomplice:0 "Com a ajuda [Select_CString( accomplice.IsFemale, 'da', 'do' )] [accomplice.GetTitledFirstName], finalmente poderei me livrar dest[Select_CString( murder_target.IsFemale, 'a', 'e' )] [murder_target.GetWomanMan] odios[Select_CString( murder_target.IsFemale, 'a', 'o' )]."
 hunt.7200.accomplice_2:0 "[accomplice.GetTitledFirstName] e [accomplice_2.GetTitledFirstName] estão observando [murder_target.GetSheHe] de perto... talvez nunca tenhamos uma oportunidade melhor..."
 hunt.7200.agent:0 "[murder_schemer.GetTitledFirstName] não poderia estar aqui, mas esta pode ser a oportunidade que estávamos esperando.\n\n"
 hunt.7200.alone:0 "Posso não ter nenhum apoiador entre o grupo, mas se encontrar o momento certo, não há melhor disfarce para o ato do que uma caçada."
 hunt.7200.b:0 "[accomplice.GetFirstNameNoTooltip] irá cuidar disso."
 hunt.7200.c:0 "Confio em [accomplice_2.GetFirstNameNoTooltip] com esse assunto delicado."
 hunt.7200.d:0 "Preciso ser paciente."
 hunt.7200.desc:0 "Ao partirmos de nosso acampamento e adentrarmos mais profundamente na [host.GetCurrentLocation.Custom('GetTerrainTypePlural')], tenho um olho [Select_CString( murder_target.IsFemale, 'na', 'no' )] [murder_target.GetTitledFirstName], [ROOT.Char.Custom2('DescriptorNegative', murder_target)], seguindo em frente, alheio(a) à minha observação.\n\n"
 hunt.7200.t:0 "O Jogo Real"
 hunt.7210.a.tt:0 "#EMP Hyah!#!"
 hunt.7210.a:0 "E será um trágico acidente."
 hunt.7210.accomplice:0 "Olho para [accomplice.GetFirstName], que acena sombriamente, com determinação, esperando meu movimento."
 hunt.7210.b:0 "Não, devo aguardar o momento certo..."
 hunt.7210.desc:0 "[murder_target.GetSheHe|U] para por um momento, ponderando qual caminho seguir."
 hunt.7210.opening:0 "Galopando através da [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], seguindo os chamados dos chifres e o latido dos cães, [murder_target.GetTitledFirstName] finalmente se separa do resto do grupo.\n\n"
 hunt.7211.accomplice:0 "[accomplice_2.GetFirstName] e [accomplice.GetFirstName] se juntam rapidamente."
 hunt.7211.accomplice_2:0 "[accomplice.GetFirstName] se une rapidamente pelo outro lado."
 hunt.7211.agent:0 "Não quero decepcionar [abduct_schemer.GetFirstName]..."
 hunt.7211.desc:0 "Faço meu movimento o mais rápido possível, investindo contra [murder_target.GetTitledFirstName] pelo lado, numa tentativa de derrubar [murder_target.GetSheHe] do cavalo."
 hunt.7211.failure:0 "\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip]?! Que diabo!\" [murder_target.GetFirstNameNoTooltip] cai pesadamente de seu corcel, mas consegue se levantar. [murder_target.GetSheHe|U] corre em direção ao restante do grupo enquanto eu tento controlar meu cavalo, olhando por cima do ombro [murder_target.GetHerHim] com medo, gritando o mais alto que [murder_target.GetSheHe] pode. Não vou alcançar [murder_target.GetSheHe] a tempo..."
 hunt.7211.success:0 "\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip]?! Argh! O que você está fazend-\" [murder_target.GetFirstNameNoTooltip] cai do cavalo, indo ao chão na [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')], enquanto eu desmonto rapidamente.\n\nO ato está consumado antes que [murder_target.GetSheHe] consiga se recuperar, e qualquer observador teria dificuldade em determinar a causa da confusão."
 hunt.7212.a:0 "\"O quê-! N-\""
 hunt.7212.accomplice:0 "[accomplice.GetFirstName] está em perseguição acirrada atrás [abduct_actor.GetHerHim]."
 hunt.7212.accomplice_2:0 "[accomplice_2.GetFirstName] e [accomplice.GetFirstName] estão logo atrás."
 hunt.7212.b:0 "Apenas continue correndo!"
 hunt.7212.desc:0 "Faço uma pausa para reorganizar meu equipamento. O estalo repentino de um galho quebra o silêncio, e vejo [Select_CString( abduct_actor.IsFemale, 'a', 'o' )] [abduct_actor.GetTitledFirstName] se aproximando rapidamente de mim."
 hunt.7212.failure:0 "\n\nClaramente há algo errado aqui. [murder_actor.GetFirstNameNoTooltip] de repente se lança sobre mim, e eu caio no chão desajeitadamente, mas consigo me levantar enquanto [murder_actor.GetSheHe] perde o equilíbrio na [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')], xingando.\n\nEu disparo em direção à [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], gritando por ajuda. O grupo não pode estar longe!"
 hunt.7212.success:0 "\n\nVejo a determinação nos olhos [Select_CString( murder_actor.IsFemale, 'da', 'do' )] [murder_actor.GetFirstNameNoTooltip] tarde demais, não conseguindo desviar do ataque [murder_actor.GetHerHim], e sou jogado no chão com um estrondo na [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')].\n\nQuando recupero minha consciência e me viro, [murder_actor.GetSheHe] está de pé sobre mim, segurando uma pedra grande sobre sua cabeça! \"Adeus, [ROOT.Char.GetFirstNameNotooltip].\""
 hunt.7300.desc:0 "Aguardando notícias dos cães farejadores, o grupo descansa em um bosque sombreado. [befriend_target.GetFirstName] está não muito longe: esta é minha chance de impressionar [befriend_target.GetSheHe].\n\n\"[befriend_target.GetTitledFirstNameNoTooltip]! Como vai? Não é sempre que temos a chance de conversar.\" Começo de forma informal.\n\n[befriend_target.GetSheHe|U] parece surpresa, mas não hostil, com minha conversa."
 hunt.7300.t:0 "Um Momento para Conversar"
 hunt.7301.a:0 "Talvez tenhamos mais em comum do que eu pensava."
 hunt.7301.falconer:0 "$hunt.7301.reply_falconer$Direto ao ponto, eu entendo exatamente o que [befriend_actor.GetSheHe] quer dizer."
 hunt.7301.fallback:0 "Não tenho certeza do que dizer."
 hunt.7301.hunter:0 "$hunt.7301.reply_hunter$Não é uma afirmação com a qual eu possa discordar."
 hunt.7301.opening:0 "[befriend_actor.GetTitledFirstName] se aproxima enquanto o grupo espera notícias dos cães farejadores.\n\n[befriend_actor.GetSheHe|U] sorri calorosamente, iniciando a conversa:"
 hunt.7301.pity:0 "$hunt.7301.reply_pity$Não posso negar a verdade das palavras [befriend_actor.GetHerHim]; é um esporte cruel."
 hunt.7301.reply_falconer:0 "\"$hunt.7100.b$\"\n\n"
 hunt.7301.reply_hunter:0 "\"$hunt.7100.a$\"\n\n"
 hunt.7301.reply_pity:0 "\"$hunt.7100.c$\"\n\n"
 hunt.7301.reply_steward:0 "\"$hunt.7100.e$\"\n\n"
 hunt.7301.reply_wastrel:0 "\"$hunt.7100.d$\"\n\n"
 hunt.7301.steward:0 "$hunt.7301.reply_steward$Comandar a natureza certamente é algo em que posso me relacionar e encontrar alegria."
 hunt.7301.wastrel:0 "$hunt.7301.reply_wastrel$Certamente é verdade; todas as coisas úteis que eu poderia estar fazendo em vez disso..."
 hunt.7302.a:0 "Diga, o que é aquilo ali?"
 hunt.7302.falconer:0 "$hunt.7301.reply_falconer$\n\nUma distração trivial, nada mais..."
 hunt.7302.fallback:0 "[befriend_actor.GetSheHe|U] sorri esperançosamente, claramente esperando alguma afinidade recíproca."
 hunt.7302.hunter:0 "$hunt.7301.reply_hunter$\n\nEu discordo totalmente..."
 hunt.7302.pity:0 "$hunt.7301.reply_pity$\n\nTal fraqueza, o mundo é cruel."
 hunt.7302.steward:0 "$hunt.7301.reply_steward$\n\nQue monótono..."
 hunt.7302.wastrel:0 "$hunt.7301.reply_wastrel$\n\nTodos nós precisamos arranjar tempo para distrações."
 hunt.7303.a:0 "Acho que conquistei [befriend_target.GetSheHe]..."
 hunt.7303.desc:0 "\n\nQuando seguimos em frente, mal conseguimos nos separar - eu sabia que encontraria as palavras certas para conquistar [befriend_target.GetSheHe]!"
 hunt.7303.falconer:0 "$hunt.7303.reply$, mal contendo sua paixão pela falcoaria."
 hunt.7303.fallback:0 "$hunt.7303.reply$, relaxando seu comportamento na minha companhia."
 hunt.7303.hunter:0 "$hunt.7303.reply$, mergulhando animadamente nos detalhes das cordas de arco e armadilhas."
 hunt.7303.pity:0 "$hunt.7303.reply$, ."
 hunt.7303.reply:0 "[befriend_target.GetTitledFirstName] parece ter muito em comum comigo"
 hunt.7303.steward:0 "$hunt.7303.reply$, ansioso para compartilhar métodos de manejo florestal e de caça."
 hunt.7303.wastrel:0 "$hunt.7303.reply$, lamentando a necessidade de entreter a corte com trivialidades."
 hunt.7304.a:0 "Bom trabalho, [ROOT.Char.GetFirstNameNoTooltip]."
 hunt.7304.desc:0 "\n\nFicando sozinho depois que [befriend_target.GetSheHe] segue em frente para conversar com outros, sinto-me tolo..."
 hunt.7304.falconer:0 "$hunt.7304.reply$, pois [befriend_target.GetSheHe] apenas acena com a cabeça obedientemente antes de seguir em frente."
 hunt.7304.fallback:0 "$hunt.7304.reply$, pois [befriend_target.GetSheHe] não diz nada."
 hunt.7304.hunter:0 "$hunt.7304.reply$, pois apenas sorri educadamente, limpando sua garganta, ouvidos atentos à natureza selvagem."
 hunt.7304.pity:0 "$hunt.7304.reply$, pois [befriend_target.GetSheHe] me olha de forma estranha e coça a cabeça."
 hunt.7304.reply:0 "Minhas palavras não parecem ter tido muito impacto [Select_CString( befriend_target.IsFemale, 'na', 'no' )] [befriend_target.GetTitledFirstName]"
 hunt.7304.steward:0 "$hunt.7304.reply$, pois [befriend_target.GetSheHe] perde rapidamente o interesse, claramente não interessado em gerenciamento."
 hunt.7304.wastrel:0 "$hunt.7304.reply$, pois [befriend_target.GetSheHe] parece completamente chocado com as minhas palavras."
 hunt.7400.a:0 "O momento de agir é agora."
 hunt.7400.accomplice:0 "Tenho a ajuda [Select_CString( accomplice.IsFemale, 'da', 'do' )] [accomplice.GetTitledFirstName]; se pudermos apenas encontrar a oportunidade certa..."
 hunt.7400.accomplice_2:0 "[accomplice.GetTitledFirstName] e [Select_CString( accomplice_2.IsFemale, 'a', 'o' )] [accomplice_2.GetTitledFirstName] nos seguem, observando ambos com compreensão silenciosa..."
 hunt.7400.agent:0 "[abduct_schemer.GetTitledFirstName] não está conosco, mas talvez eu deva aproveitar essa chance se quisermos alcançar nossos objetivos.\n\n"
 hunt.7400.alone:0 "Estaria agindo sozinho, mas, com a preparação adequada e o elemento surpresa, uma pessoa pode alcançar muito."
 hunt.7400.b:0 "Deixo nas mãos [Select_CString( accomplice.IsFemale, 'da', 'do' )] [accomplice.GetFirstNameNoTooltip]."
 hunt.7400.c:0 "[accomplice_2.GetFirstNameNoTooltip] pode ser confiável para isso."
 hunt.7400.d:0 "Este não é o momento."
 hunt.7400.desc:0 "Deixamos o acampamento, adentrando a [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] em uma coluna. Observo [Select_CString( abduct_target.IsFemale, 'a', 'o' )] [abduct_target.GetTitledFirstName] atentamente; [abduct_target.GetSheHe] está completamente inconsciente de minhas intenções, totalmente distraído pela caçada.\n\n"
 hunt.7400.t:0 "[ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')|U] de Oportunidade"
 hunt.7410.a.failure:0 "[abduct_target.GetFirstNameNoTooltip] escapa"
 hunt.7410.a.success:0 "Você sequestra [abduct_target.GetFirstNameNoTooltip]"
 hunt.7410.a:0 "É hora!"
 hunt.7410.accomplice:0 "[accomplice.GetTitledFirstName] fica pronto, observando-me ansiosamente..."
 hunt.7410.accomplice_2:0 "[accomplice.GetTitledFirstName] e [Select_CString( accomplice_2.IsFemale, 'a', 'o' )] [accomplice_2.GetTitledFirstName] me observam, esperando que eu dê o primeiro passo..."
 hunt.7410.alone:0 "Eu posso fazer isso..."
 hunt.7410.b:0 "#EMP Ah...#! Eu não posso fazer isso..."
 hunt.7410.desc:0 "Finalmente encontro um momento em que eu e [Select_CString( abduct_target.IsFemale, 'a', 'o' )] [abduct_target.GetTitledFirstName] estamos praticamente sozinhos! Tudo o que resta é executar o plano!\n\n"
 hunt.7411.a:0 "Eu te peguei, verme!"
 hunt.7411.accomplice:0 "[accomplice.GetFirstName] tenta obter outro ângulo [abduct_target.GetHerHim]."
 hunt.7411.accomplice_2:0 "Ao mesmo tempo, [accomplice_2.GetFirstName] e [accomplice.GetFirstName] se aproximam de cada lado."
 hunt.7411.agent:0 "$hunt.7211.agent$"
 hunt.7411.b:0 "Maldito verme escorregadio!"
 hunt.7411.desc:0 "Aproximo-me lentamente [Select_CString( abduct_target.IsFemale, 'da', 'do' )] [abduct_target.GetTitledFirstName] por trás, escolhendo cuidadosamente o momento para atacar."
 hunt.7411.failure:0 "\n\n[abduct_target.GetSheHe|U] quase é pego desprevenido, mas é mais resistente do que [abduct_target.GetSheHe] aparenta! [abduct_target.GetSheHe|U] logo percebe o que está acontecendo, olha para a corda em minha mão e foge para a [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], gritando pelos outros..."
 hunt.7411.success:0 "\n\nPego [abduct_target.GetSheHe] desprevenido, derrubando [abduct_target.GetSheHe] com força no [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')]. Enquanto [abduct_target.GetSheHe] fica atordoado, amarro as mãos [abduct_target.GetHerHim] com uma corda.\n\n[abduct_target.GetSheHe|U] se vira, olhos cheios de medo e confusão."
 hunt.7412.a:0 "\"[abduct_actor.GetFirstNameNoTooltip]! O qu-\""
 hunt.7412.failure:0 "\n\nSinto que algo está errado; os olhos [Select_CString( abduct_actor.IsFemale, 'da', 'do' )] [abduct_actor.GetFirstNameNoTooltip] brilham com uma determinação incômoda. [abduct_actor.GetSheHe|U] tenta me empurrar, mas só me raspa, perde o equilíbrio e cai no chão, com uma bobina de corda no [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')] ao lado [abduct_actor.GetHerHim]!\n\nEu me lanço para a [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] enquanto [abduct_actor.GetSheHe] geme, chorando pelos outros..."
 hunt.7412.success:0 "\n\nAntes que eu tenha a chance de perguntar, [abduct_actor.GetFirstNameNoTooltip] se choca contra mim com toda a sua força, me jogando no chão do [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')].\n\nEnquanto fico lá, atordoado, sinto minhas mãos sendo amarradas com uma corda! Um sequestro?!"
 hunt.7800.a:0 "#EMP Ei!#! Tenha mais cuidado!"
 hunt.7800.b.failure:0 "Não há pistas"
 hunt.7800.b.success:0 "Você encontra o dono"
 hunt.7800.b.tt:0 "Você confronta o atirador"
 hunt.7800.b:0 "Isso deve pertencer a #EMP alguém#!..."
 hunt.7800.c:0 "#EMP Assassinos!#! Rápido! Tirem-me daqui!"
 hunt.7800.closing:0 "\n\nEu e aqueles mais próximos giramos em volta, mas não há ninguém ali, apenas o vento sussurrando através da [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]..."
 hunt.7800.desc:0 "Faço uma pausa para beber da minha cantina, saboreando um pouco de alívio do suor e da agitação da perseguição. Ao prendê-la ao meu lado, ouço um som de assobio baixo.\n\n"
 hunt.7800.ground:0 "Uma flecha bate no chão do [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')] aos meus pés, enterrando-se profundamente no solo."
 hunt.7800.t:0 "De Lugar Nenhum"
 hunt.7800.tree:0 "Uma flecha bate no [ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')] ao meu lado com um estrondo! #EMP THWACK#!!"
 hunt.7801.a:0 "Vou deixar passar, #EMP desta#! vez."
 hunt.7801.b:0 "Ridículo. Algemem [culprit.GetSheHe], estamos partindo."
 hunt.7801.desc:0 "Examinando a flecha cuidadosamente, percebo que as penas são de construção incomum, algo que certamente as diferencia dos outros membros do grupo.\n\nObservando furtivamente as aljavas dos meus colegas caçadores, logo encontro o culpado...\n\n\"Não, por favor! [Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetLadyLord]! Eu talvez tenha sido exagerado, disparando entre a vegetação, mas foi sem malícia! Imploro-lhe!"
 hunt.7801.t:0 "De Lugar Nenhum"
 hunt.8001.a:0 "Sua pelagem exuberante será um excelente objeto de conversa."
 hunt.8001.b:0 "Monte sua cabeça, meus convidados verão sua majestade!"
 hunt.8001.c:0 "Vamos nos concentrar no delicioso banquete em vez de uma carcaça como troféu!"
 hunt.8001.desc:0 "Ao retornarmos de [host.GetCurrentLocation.GetName] com o(a) [activity.Custom('GetAnimalType')] abatido, não consigo deixar de admirá-lo mesmo na morte. Um espécime tão belo - consigo facilmente imaginar sua pele ou crânio decorando as paredes da minha corte! Oh, mas qual opção escolher?"
 hunt.8001.t:0 "Um Espécime Bonito"
 hunt.8200.a.flavor:0 "Gosto de praticar antes do grande dia."
 hunt.8200.a:0 "Eu não entraria em batalha com uma lâmina cega."
 hunt.8200.b.flavor:0 "Insisto que façamos pressa para a caçada."
 hunt.8200.b:0 "Mas quem está aqui para testemunhar meu triunfo!?"
 hunt.8200.desc:0 "Contemplo o horizonte à minha frente, o sol da manhã anunciando um dia cheio de promessas. Meu [ROOT.Char.Custom('GetHuntMasterDesc')], [master_hunter.GetName], aproxima-se com meu [ROOT.Char.Custom('GetRaptorType')] em mãos e um brilho nos olhos.\n\n“Sei que temos uma caçada, mas que manhã clara! Com fome na barriga de sua ave e o orvalho gelando o chão, a presa estará pronta para ser capturada.”\n\nAs garras do meu [ROOT.Char.Custom('GetRaptorTypePossessive')] estarão ainda mais afiadas para o esporte que virá..."
 hunt.8200.t:0 "Prática de Falcoaria"
 hunt.8210.a.flavor:0 "Sua noite de paixão nutre sua maestria poética."
 hunt.8210.a:0 "Quem sou eu para negar o apetite do divino?"
 hunt.8210.b.flavor:0 "Você rejeita a musa."
 hunt.8210.b:0 "Solte-me, preciso guardar minha virilidade para a caçada!"
 hunt.8210.desc:0 "Em antecipação à caçada que se aproxima, tomo um banho ao luar, purificando-me junto com meu [hunted_hawker.Custom('GetRaptorType')].\n\nDe repente, atrás de mim, ouço um farfalhar e sinto o hálito de alguém em meu pescoço.\n\n“Talvez você seja minha presa esta noite? Raramente tenho uma mordida, tão consumido estou por meus deveres.”\n\nO cheiro intoxicante de incenso do [local_temple.Custom('GetLocationFaithTemple')] em [local_temple.GetBaronyNameExplicitlyNoTooltip] domina meus sentidos. Poderia ser a [shrine_maiden.Custom('PriestTitle')] local?"
 hunt.8210.t:0 "Caçando Enquanto Halcoando"
 hunt.8211.a:0 "O [ROOT.Char.Custom('GetCourt')] ouvirá sobre nosso êxtase compartilhado!"
 hunt.8211.a_effect:0 "[newly_created_artifact.GetName] é transformado em um [court_artifact|E] e ganhará um modificador de [grandeur|E]"
 hunt.8211.b:0 "Guardarei esta imortalização de nossa paixão."
 hunt.8211.b_effect:0 "Você ganha o [artifact|E] [newly_created_artifact.GetName]"
 hunt.8211.desc:0 "$love_artifact_poetry_name$\n\n#EMP “Você veio me ver na noite passada, ou fui eu que o procurei?\n\nNão me lembro.\n\nNem sei se estava imerso em um êxtase ligado ao reino dos sonhos,\n\nOu se tal prazer poderia ter sido real?”#!"
 hunt.8211.opening:0 "[shrine_maiden.Custom2('AppropriateGreeting', ROOT.Char)]"
 hunt.9001.a:0 "Voltamos, revigorados!"
 hunt.9001.b:0 "Fizemos o nosso melhor..."
 hunt.9001.befriend_best:0 "[ROOT.Char.GetIntentTarget.GetFirstName] e eu rapidamente nos tornamos amigos íntimos, superando todas as minhas expectativas...\n\n"
 hunt.9001.befriend_fail:0 "Não estou mais próximo de ganhar a confiança [Select_CString( ROOT.Char.GetIntentTarget.IsFemale, 'da', 'do' )] [ROOT.Char.GetIntentTarget.GetFirstName], devo estar fazendo algo errado...\n\n"
 hunt.9001.befriend_friend:0 "[ROOT.Char.GetIntentTarget.GetFirstName] foi muito receptivo à minha companhia, acho que posso contar com [befriend_target.GetSheHe]...\n\n"
 hunt.9001.befriend_potential:0 "Embora ainda haja algumas formalidades entre [ROOT.Char.GetIntentTarget.GetFirstName] e eu, estamos um pouco mais próximos do que antes...\n\n"
 hunt.9001.c:0 "Vamos deixar essa aventura para trás por enquanto."
 hunt.9001.credit_other:0 "[credit_taker.GetFirstName] está especialmente feliz com a caçada [credit_taker.GetHerHim].\n\n"
 hunt.9001.credit_other_big:0 "[credit_taker.GetFirstName] fez um ótimo trabalho abatendo uma fera tão poderosa.\n\n"
 hunt.9001.credit_self:0 "Não é uma fera tão grande, mas eu a matei sozinho.\n\n"
 hunt.9001.credit_self_big:0 "Ficar aqui agora, é difícil acreditar que eu mesmo abati a fera.\n\n"
 hunt.9001.credit_shared:0 "Embora a presa possa ter sido pequena, o grupo ainda está radiante com a satisfação de uma boa caçada.\n\n"
 hunt.9001.credit_shared_big:0 "Não há nada como a emoção de abater uma fera poderosa.\n\n"
 hunt.9001.d.choice:0 "Vou apenas guardar uma lembrança."
 hunt.9001.d:0 "Vou guardar uma lembrança."
 hunt.9001.desc_bad:0 "Nosso grupo parecia atormentado por misérias aparentemente intermináveis, e quase sinto alívio ao deixar o [ROOT.Char.Custom('TerrainType')] para trás."
 hunt.9001.desc_bad_good:0 "Tudo que poderia dar errado parece ter acontecido, mas ainda houve aspectos positivos."
 hunt.9001.desc_court_artifact:0 "Eu imagino sua pele ou crânio decorando as paredes da minha corte.\n\n"
 hunt.9001.desc_fallback:0 "Atender ao chamado da natureza geralmente é uma aventura, mas devo admitir que achei essa saída bastante esquecível."
 hunt.9001.desc_good:0 "Caçadas como essas são uma alegria pura, mal posso esperar pelo próximo ano!"
 hunt.9001.desc_good_bad:0 "Apesar de algumas dificuldades ao longo do caminho, a caçada foi muito bem!"
 hunt.9001.desc_hunter_1:0 "Eu participei de várias caçadas, e as pessoas ao meu redor começaram a perceber - a notícia está se espalhando sobre minhas atividades!"
 hunt.9001.desc_hunter_2:0 "As [ROOT.Char.Custom('TerrainType')] são como minha segunda casa - sentir o vento nos meus cabelos, passar tempo com meus cortesãos, sentir a emoção enquanto me aproximo da presa... Eu rezo para [ROOT.Char.GetFaith.HighGodNameAlternate] que isso nunca acabe!"
 hunt.9001.desc_hunter_3:0 "Não importa o quão rápido, forte ou astuta seja a presa, ela não tem chance contra mim! Minha habilidade como caçador é assunto de muitas conversas em todo o reino. No entanto, a verdadeira recompensa é a liberdade que as [ROOT.Char.Custom('TerrainType')] me concedem."
 hunt.9001.desc_same:0 "Atender ao chamado da natureza é uma aventura, e essa saída trouxe tanto o bom quanto o ruim em abundância!"
 hunt.9001.desc_trinket:0 "uma lembrança deste dia manteria a memória viva.\n\n"
 hunt.9001.e:0 "Vou guardar uma pena."
 hunt.9001.f.present:0 "[trophy_recipient.GetTitledFirstNameNoTooltip], [Select_CString( trophy_recipient.IsFemale, 'minha boa', 'meu bom' )] [ROOT.Char.Custom2('RelationToMeShort', trophy_recipient)], ele é s[Select_CString( trophy_recipient.IsFemale, 'ua', 'eu' )]!"
 hunt.9001.f:0 "[Select_CString( trophy_recipient.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', trophy_recipient)], [trophy_recipient.GetTitledFirstNameNoTooltip], vai apreciar o troféu."
 hunt.9001.falconry:0 "É uma pena ter que voltar tão cedo, eu poderia fazer isso o dia todo! Mas as aves precisam descansar."
 hunt.9001.g:0 "[animal_slayer.GetTitledFirstName] derrubou-o, pertence a [animal_slayer.GetSheHe]."
 hunt.9001.murder_dead:0 "[ROOT.Char.GetIntentTarget.GetFirstName] está morto, mesmo que não tenha sido pelas minhas mãos...\n\n"
 hunt.9001.murder_fail:0 "Certamente é uma pena que [ROOT.Char.GetIntentTarget.GetFirstName] ainda esteja vivo...\n\n"
 hunt.9001.murder_public:0 "[ROOT.Char.GetIntentTarget.GetFirstName] está morto, embora todos saibam que sou responsável...\n\n"
 hunt.9001.murder_secret:0 "[ROOT.Char.GetIntentTarget.GetFirstName] está morto, e ninguém tem ideia de que fui eu quem fez isso...\n\n"
 hunt.9001.opening:0 "Eu dirijo o esquartejamento, recompensando os cães com sua parte dos despojos."
 hunt.9001.opening_ambitious:0 "Só consigo imaginar outras feras orgulhosas, apenas esperando para serem caçadas...\n\n"
 hunt.9001.opening_beginner:0 "esfolando cuidadosamente a carcaça com orientação dos mestres de jogo."
 hunt.9001.opening_callous:0 "[activity.Custom('GetAnimalType')|U] inútil não teve chance contra nós...\n\n"
 hunt.9001.opening_captive:0 " observando o(a) [host.Custom('GetAnimalTypeCaptive')] amarrado e dirigindo os atendentes que o carregam com cuidado."
 hunt.9001.opening_captive_courtier:0 "[hunt_participant.GetShortUINameNoFormat] verifica as amarras do animal,"
 hunt.9001.opening_captive_master_of_hunt:0 "[hunt_participant.GetTitledFirstName], o [ROOT.Char.Custom('GetHuntMasterDesc')], verifica as amarras do animal,"
 hunt.9001.opening_captive_self:0 "Eu verifico as amarras do animal,"
 hunt.9001.opening_compassionate:0 "Não consigo deixar de admirar o(a) [activity.Custom('GetAnimalType')], mesmo na morte.\n\n"
 hunt.9001.opening_content:0 "Esses são momentos para serem apreciados: boa companhia e belo(a) [activity.Custom('GetAnimalType')].\n\n"
 hunt.9001.opening_courtier:0 "[hunt_participant.GetShortUINameNoFormat] dirige o desmembramento,"
 hunt.9001.opening_falconry:0 "uma riqueza de caça e um teste da boa treinabilidade de nossas aves."
 hunt.9001.opening_falconry_courtier:0 "[hunt_participant.GetTitledFirstName], reúne o par de aves abatidas pelos nossos [activity.Custom('GetRaptorPlural')],"
 hunt.9001.opening_falconry_master_of_hunt:0 "[hunt_participant.GetTitledFirstName], o [ROOT.Char.Custom('GetHuntMasterDesc')], reúne o par de aves abatidas pelos nossos [activity.Custom('GetRaptorPlural')],"
 hunt.9001.opening_falconry_self:0 "Reúno o par de aves abatidas pelos nossos [activity.Custom('GetRaptorPlural')],"
 hunt.9001.opening_learning:0 "Eu examino a carcaça do(a) [activity.Custom('GetAnimalType')], refletindo sobre sua anatomia e surpreendente inteligência...\n\n"
 hunt.9001.opening_martial:0 "Uma boa saída, [activity.Custom('GetAnimalType')] ofereceu um pequeno gostinho das variáveis do campo de batalha.\n\n"
 hunt.9001.opening_master:0 " esfolando habilmente a carcaça sem se sujar nem com uma gota de sangue."
 hunt.9001.opening_master_of_hunt:0 "[hunt_participant.GetTitledFirstName], o [ROOT.Char.Custom('GetHuntMasterDesc')], dirige o desmembramento,"
 hunt.9001.opening_novice:0 "esfolando desajeitadamente a carcaça antes de deixar os mestres de jogo assumirem."
 hunt.9001.opening_self:0 "Eu dirijo o desmembramento,"
 hunt.9001.opening_skilled:0 "esfolando habilmente a carcaça com precisão e rapidez."
 hunt.9001.spoils:0 "\n\nColocamos a parte dos animais de caça ansiosos na pele esticada, antes de partir para o acampamento e para casa."
 hunt.9001.spoils_captive:0 "\n\nDerrubar uma fera selvagem é uma coisa, mas capturar uma viva e intacta é uma proeza completamente diferente!"
 hunt.9001.spoils_falconry:0 "\n\nMeu [activity.Custom('GetRaptorType')] come alegremente pedaços de carne, recompensa por seu ótimo desempenho neste dia, antes de partirmos para o acampamento e para casa."
 hunt.9001.t:0 "Riqueza da Natureza"
 hunt.9001.woo_fail:0 "[ROOT.Char.GetIntentTarget.GetFirstName] não ficou impressionado com meus avanços... Terei que tentar uma abordagem diferente...\n\n"
 hunt.9001.woo_lover:0 "[ROOT.Char.GetIntentTarget.GetFirstName] não teve chance contra meus avanços sedutores...\n\n"
 hunt.9001.woo_potential:0 "Eu chamei a atenção [Select_CString( ROOT.Char.GetIntentTarget.IsFemale, 'da', 'do' )] [ROOT.Char.GetIntentTarget.GetFirstName], mas mais trabalho é necessário se eu quiser conquistar seu coração...\n\n"
 hunt.9001.woo_soulmate:0 "[ROOT.Char.GetIntentTarget.GetFirstName] e eu criamos um vínculo especial, sua força me surpreendendo...\n\n"
 hunt.9002.opening:0 "Eu reúno o grupo desapontado e os cães exaustos para a viagem de volta para casa."
 hunt.9002.opening_animal:0 "\n\n[activity.Custom('GetAnimalType')|U] realmente nos escapou desta vez, #EMP..."
 hunt.9002.opening_courtier:0 "[hunt_participant.GetTitledFirstName] reúne o grupo desapontado e os cães exaustos para a viagem de volta para casa."
 hunt.9002.opening_master_of_hunt:0 "O [ROOT.Char.Custom('GetHuntMasterDesc')], [hunt_participant.GetTitledFirstName], reúne o grupo desapontado e os cães exaustos para a viagem de volta para casa."
 hunt.9002.t:0 "De Mãos Vazias"
