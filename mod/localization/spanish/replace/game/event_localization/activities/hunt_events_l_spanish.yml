 mpo_hunt.0001.a:0 "Essa é minha!"
 mpo_hunt.0001.b.tt.failure:0 "[child.GetFirstNameNoTooltip] falha"
 mpo_hunt.0001.b.tt.success:0 "[child.GetFirstNameNoTooltip] consegue pegar o animal"
 mpo_hunt.0001.b:0 "Você consegue, [child.GetFirstNameNoTooltip]!"
 mpo_hunt.0001.c.tt.crit_success:0 "[child.GetFirstNameNoTooltip] impressiona a todos"
 mpo_hunt.0001.c:0 "Você pega assim, e então..."
 mpo_hunt.0001.d:0 "Deixe-o viver."
 mpo_hunt.0001.desc:0 "Avançamos pela [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] em busca de nossa presa. [Select_CString( child.IsFemale, 'Minha filha', 'Meu filho' )], [child.GetFirstName], mostrou-se mais resistente do que eu pensava, segurando firme seu arco.\n\n\"Pare,\" murmuro, notando um movimento na grama. Um pequeno [ROOT.Char.Custom('SmallAnimal')] está comendo algumas raízes, alheio à nossa presença."
 mpo_hunt.0001.t:0 "Desde o Berço"
 mpo_hunt.0010.a:0 "Eu sei como lidar com esses."
 mpo_hunt.0010.b.tt.crit_failure:0 "A ave fere você"
 mpo_hunt.0010.b.tt.failure:0 "Você se envergonha"
 mpo_hunt.0010.b.tt.success:0 "Você acerta a ave"
 mpo_hunt.0010.b:0 "Minha hora de brilhar!"
 mpo_hunt.0010.c.tt.success:0 "[target.GetFirstNameNoTooltip] fica impressionad[Select_CString( target.IsFemale, 'a', 'o' )]"
 mpo_hunt.0010.c:0 "\"Atrás de mim, [target.GetFirstNameNoTooltip]!\""
 mpo_hunt.0010.d:0 "Não vale a pena."
 mpo_hunt.0010.desc:0 "\"...Sempre gostei dessa parte da [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')],\" observa [target.GetTitledFirstName], enquanto marchamos juntos. \"Meu pai costumava nos trazer aqui para caçar.\"\n\nAntes que eu consiga responder, uma [ROOT.Char.Custom('GetRegionalEagleType')] mergulha em direção a [target.GetSheHe], gritando como um bebê recém-nascido.\n\n\"Ajuda!\" grita [target.GetSheHe]."
 mpo_hunt.0010.t:0 "Lá do Alto"
 mpo_hunt.0020.a:0 "O frio deve ter matado a mãe..."
 mpo_hunt.0020.b.tt.failure:0 "A mãe ataca você"
 mpo_hunt.0020.b.tt.success:0 "Você mata a loba"
 mpo_hunt.0020.b:0 "Precisamos matar a mãe!"
 mpo_hunt.0020.c.tt.success:0 "Você passa furtivamente pela mãe"
 mpo_hunt.0020.c:0 "Podemos passar furtivamente por ela..."
 mpo_hunt.0020.d:0 "Não parem."
 mpo_hunt.0020.desc.intro:0 "\"Está começando a escurecer,\" [companion.GetTitledFirstName] [companion.Custom('quirk_pos_present')]. \"É melhor encontrarmos um lugar para...\".\n\nMas sua frase é abruptamente interrompida:"
 mpo_hunt.0020.desc.normal:0 "uma loba rosna em nossa direção, seu corpo adulto protegendo um pequeno filhote."
 mpo_hunt.0020.desc.zud:0 "uma loba morta jaz sobre a neve, um filhote empurrando a cabeça contra sua barriga sem vida."
 mpo_hunt.0020.t:0 "O Amor de Mãe"
 mpo_hunt.0030.a:0 "\"Deve ter havido um motivo para isso.\""
 mpo_hunt.0030.b:0 "\"Sempre se precisa de um guerreiro capaz!\""
 mpo_hunt.0030.c:0 "\"Minha generosidade é bem conhecida.\""
 mpo_hunt.0030.d:0 "\"Só os fortes sobrevivem.\""
 mpo_hunt.0030.desc:0 "Um som de lamento chama nossa atenção enquanto seguimos nosso caminho. Um guerreiro ferido repousa sobre uma pedra, com roupas esfarrapadas e o maxilar inchado.\n\n\"Saudações, [Select_CString( other_ruler.IsFemale, 'minha temida senhora feudal', 'meu temido senhor feudal' )], [other_ruler.GetTitledFirstName], me baniu de seu domínio. Meus inimigos armaram uma armadilha e agora devo vagar sem rumo.\""
 mpo_hunt.0030.t:0 "Banido"
 mpo_hunt.0040.a:0 "A presa perseguida lentamente não foge com pressa."
 mpo_hunt.0040.b:0 "Por algumas bugigangas, os locais pouparão cavalos frescos."
 mpo_hunt.0040.c:0 "Que os cavalos passem fome! Não podemos falhar."
 mpo_hunt.0040.d:0 "Reduzam o ritmo."
 mpo_hunt.0040.desc:0 "Na implacável [root_location.GetTerrain.GetNameNoTooltip|l] de [root_location.GetName], a perseguição foi longa. Cavalgamos adiante, deixando para trás os cavaleiros mais fracos, os cavalos menos vigorosos... mas agora, até os garanhões fortes estão magros.\n\nNossos nobres animais podem nos levar até o fim desta caçada. Mas, mantendo esse ritmo, voltarão para casa exaustos e despreparados para a batalha."
 mpo_hunt.0040.t:0 "Cavalos Magros como Veados"
 mpo_hunt.0050.a:0 "Este caçador pertence ao meu povo [ROOT.Char.GetDomicile.GetCulture.GetCollectiveNounNoTooltip]."
 mpo_hunt.0050.b:0 "Troco cavalos pelos rastros da minha presa."
 mpo_hunt.0050.c.flavor:0 "Suas flechas voam em direção aos caçadores locais, e o grupo deles responde com uma saraivada própria!"
 mpo_hunt.0050.c.tt.failure:0 "A pontaria dos estranhos se prova mais precisa"
 mpo_hunt.0050.c.tt.success:0 "Você consegue sua presa"
 mpo_hunt.0050.c:0 "\"Estamos caçando, forasteiro. E vocês carregam belas peles!\""
 mpo_hunt.0050.d:0 "\"Se quiser viver, caçador... vá embora.\""
 mpo_hunt.0050.desc:0 "Enquanto trotamos em perseguição aos nossos batedores, um grupo de cavaleiros desconhecidos se aproxima. Locais. Sobre os dorsos suados de seus cavalos, peles cruas estão penduradas.\n\n\"[hunter.GetFaith.FertilityGodName] sopra vida na [root_location.GetTerrain.GetNameNoTooltip|l],\" diz o líder deles, [hunter.GetName]. \"Já conseguimos nossa presa, mas se quiser negociar — talvez possamos ajudá-los na caçada também?\""
 mpo_hunt.0050.t:0 "Caçadores de [root_location.GetNameNoTooltip]"
 mpo_hunt.0060.a:0 "Conheço #EMP exatamente#! o mercador para vender essas peles..."
 mpo_hunt.0060.b:0 "\"#EMP Atirem! Atirem!#! Por uma fortuna em peles!\""
 mpo_hunt.0060.c:0 "\"Ignorem! #EMP Sigam a presa!#!\""
 mpo_hunt.0060.desc:0 "Algo se move rápido entre os arbustos — depois outra coisa veloz — e mais uma! Corpinhos gordos e de pelo castanho, como pedras amolecidas, correm pela grama.\n\nMeus companheiros de caça estão a cavalo, flechas armadas, prontos a qualquer comando — mas devo dar o comando? As peles de marmota são bens valiosos no comércio, mas o tempo gasto em esfolá-las é tempo que perdemos da caçada..."
 mpo_hunt.0060.t:0 "Pelo na Grama"
 mpo_lean_horses_hunt_modifier:0 "Garanhões Magros"
 mpo_lean_horses_hunt_modifier_desc:0 "Caçadas longas e intensas deixaram muitos dos cavalos deste nômade magros e inapto para a batalha."
 religious_statuette:0 "Estatueta Religiosa"
 tgp_hunt.0002.a.flavor:0 "Pegue o outro também!"
 tgp_hunt.0002.a:0 "Verdadeiramente uma visão de maravilha."
 tgp_hunt.0002.b.flavor:0 "Assim é a vida."
 tgp_hunt.0002.b:0 "Talvez os animais não sejam tão diferentes de nós."
 tgp_hunt.0002.c.flavor:0 "Se a mudança deve ocorrer - minha ação será seu catalisador."
 tgp_hunt.0002.c:0 "Não consigo suportar testemunhar tais cenas tristes em meu reino."
 tgp_hunt.0002.desc:0 "Enquanto perseguia o(a) [activity.Custom('GetAnimalType')], tropeço em um pequeno rio. Lá, entre os juncos, não está minha presa, mas um par elegante de patos, com os pescoços entrelaçados em um abraço amoroso.\n\nFico ali, fascinado pelos pombinhos, quando de repente meu falcão mergulha! Apenas um pato permanece, com sangue e penas no lugar de seu parceiro. O pássaro restante grita em angústia dilacerante, sacudindo as asas desesperadamente como se pudesse voltar no tempo."
 tgp_hunt.0002.t:0 "Não Tão Diferente"
 tgp_hunt.0003.a.flavor:0 "Por que... justo agora?"
 tgp_hunt.0003.a:0 "Mas eu estava apenas começando!"
 tgp_hunt.0003.desc:0 "Quando volto ao acampamento, sou informado de uma notícia surpreendente - [host.GetName] cancelou a caça, dizendo a todos para se dispersarem imediatamente!\n\nDiz-se que [host.GetName] sentiu uma súbita onda de compaixão [GetReligionByKey('buddhism_religion').GetAdjective] após seu falcão ter matado um pato."
 tgp_hunt.0003.t:0 "Um Fim Inesperado"
 tgp_hunt.0004.a.flavor:0 "Talvez em outra ocasião."
 tgp_hunt.0004.a:0 "Há coisas mais importantes a tratar."
 tgp_hunt.0004.b.failure:0 "Você foi visto profanando a estatueta pelos locais"
 tgp_hunt.0004.b.flavor:0 "Paz de espírito."
 tgp_hunt.0004.b.success:0 "Você profanou a estátua sem ser notado"
 tgp_hunt.0004.b:0 "Rezar diante da estátua."
 tgp_hunt.0004.c.flavor:0 "$tgp_hunt.0004.b.flavor$"
 tgp_hunt.0004.c:0 "As crenças dos [local_faith.GetAdherentNamePluralNoTooltip] estão em harmonia conosco, [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]."
 tgp_hunt.0004.d.flavor:0 "Devo destruí-la!"
 tgp_hunt.0004.d:0 "A fé [local_faith.GetAdjectiveNoTooltip] ainda está perdida."
 tgp_hunt.0004.desc_astray:0 "$tgp_hunt.0004.desc_common$Suponho que os locais venerem [local_faith.HighGodName]!"
 tgp_hunt.0004.desc_common:0 "Enquanto procurava um(a) [activity.Custom('GetAnimalType')], encontrei um [activity.GetCurrentPhase.GetLocation.Custom('GetReligiousFigurineName')] empoleirado sobre uma pedra ao lado da trilha.\n\n"
 tgp_hunt.0004.desc_evil_hostile:0 "$tgp_hunt.0004.desc_common$Este símbolo vil da [local_faith.GetName] local me provoca abertamente."
 tgp_hunt.0004.desc_true:0 "$tgp_hunt.0004.desc_common$Uma excelente oportunidade para venerar [ROOT.Char.Custom('GetAppropriateGodname')]."
 tgp_hunt.0004.e.flavor:0 "$tgp_hunt.0004.d.flavor$"
 tgp_hunt.0004.e:0 "Eles deveriam venerar [ROOT.Char.GetFaith.HighGodName]!"
 tgp_hunt.0004.t:0 "Encontro com [activity.GetCurrentPhase.GetLocation.Custom('GetReligiousFigurineName')]"
 tgp_hunt.0005.a:0 "Posso ter uma manobra em mente."
 tgp_hunt.0005.b:0 "Coloque fogo para forçar o animal a sair!"
 tgp_hunt.0005.c:0 "Talvez [target_character.GetFirstNameNoTooltip] tenha uma ideia?"
 tgp_hunt.0005.d:0 "Todos aos seus postos! Vamos esperar para ver."
 tgp_hunt.0005.desc:0 "Enquanto perseguimos o(a) [activity.Custom('GetAnimalType')], nossa caçada é interrompida quando o animal se refugia em um denso campo de arroz. Toda a equipe de caça se aproxima e vasculhamos o campo em busca de movimento, mas não há sinal do(a) [activity.Custom('GetAnimalType')]!\n\nNão seremos derrotados por um arrozal!"
 tgp_hunt.0005.failure:0 "Nenhum sinal do(a) [activity.Custom('GetAnimalType')] foi encontrado"
 tgp_hunt.0005.success:0 "O(a) [activity.Custom('GetAnimalType')] foi avistado"
 tgp_hunt.0005.t:0 "Entre os Campos de Arroz"
 tgp_hunt.0006.a:0 "\"Considere o apelo tranquilizante da natureza local.\""
 tgp_hunt.0006.b:0 "\"Por que, sobre minha valentia, é claro!\""
 tgp_hunt.0006.c:0 "\"Dedique-o a [seduction_target.GetNameNoTooltip].\""
 tgp_hunt.0006.d:0 "\"Escreva sobre a habilidade de caça de [befriend_target.GetShortUINamePossessiveNoTooltip]!\""
 tgp_hunt.0006.desc:0 "Ao retornar ao acampamento, vejo [poet.GetName] olhando para o horizonte, perdido em contemplação. À minha aproximação, seu devaneio é interrompido.\n\n\"Que bom vê-lo, [Select_CString( host.IsFemale, 'minha', 'meu' )] [poet.Custom2('RelationToMe', SCOPE.sC('host'))]! Eu esperava escrever um poema sobre esta caçada emocionante, mas simplesmente não consigo decidir o tema!\""
 tgp_hunt.0006.e:0 "\"Deixe-me emprestar-lhe meu [ROOT.Char.Custom('WritingInstrument')]!\""
 tgp_hunt.0006.t:0 "O Poema de um Caçador"
 tgp_hunt.0007.a.flavor:0 "A caçada está indo muito bem!"
 tgp_hunt.0007.a:0 "A perda do caçador furtivo é nosso ganho."
 tgp_hunt.0007.b.failure:0 "[target_character.GetFirstName] está desapontad[Select_CString( target_character.IsFemale, 'a', 'o' )]"
 tgp_hunt.0007.b.flavor:0 "[target_character.GetFirstNameNoTooltip] é uma pessoa de honra?"
 tgp_hunt.0007.b.success:0 "[target_character.GetFirstName] concorda com você"
 tgp_hunt.0007.b:0 "Não ganhamos isso! Proponho libertá-la por misericórdia."
 tgp_hunt.0007.desc:0 "Ao retornar ao acampamento, ouço um grito vindo da vegetação rasteira.\n\nOs gritos angustiados revelam uma lebre em uma armadilha de caçador furtivo. [target_character.GetFirstName] se aproxima e ergue a criatura presa, lambendo seus lábios..."
 tgp_hunt.0007.t:0 "Lebre à Disposição"
 tgp_hunt.0008.a.failure:0 "[target_character.GetFirstName] permanece obstinad[Select_CString( target_character.IsFemale, 'a', 'o' )]"
 tgp_hunt.0008.a.flavor:0 "Nada que algumas palavras não possam fazer."
 tgp_hunt.0008.a.success:0 "Você convence [target_character.GetFirstName] a retornar ao antigo estilo de vida"
 tgp_hunt.0008.a:0 "Tente convencer [target_character.GetFirstNameNoTooltip] do contrário."
 tgp_hunt.0008.b.flavor:0 "Não há como argumentar com alguém que já tomou sua decisão."
 tgp_hunt.0008.b:0 "Essas são as escolhas [target_character.GetHerHim]."
 tgp_hunt.0008.desc:0 "Enquanto perseguíamos nossa presa, encontrei um [target_character.GetName] abatido com seu arco de caça quebrado ao meio.\n\nOfereci emprestar um dos meus, mas [target_character.GetSheHe] declarou:\n\n\"Renuncio ao esporte sangrento da caça, embora seja grato por ele ter revelado minha vocação como monge. De agora em diante, em vez de derramar sangue, irei venerar [target_character.GetFaith.HighGodName].\""
 tgp_hunt.0008.t:0 "Mudança de Estilo de Vida"
 tgp_hunt.0009.a.failure:0 "[buddhist_hermit.GetFirstName] percebeu a tentativa de engano"
 tgp_hunt.0009.a.flavor:0 "Não deixarei o falcão voar, apenas confie em mim."
 tgp_hunt.0009.a.success:0 "[buddhist_hermit.GetFirstName] está convencid[Select_CString( buddhist_hermit.IsFemale, 'a', 'o' )]"
 tgp_hunt.0009.a:0 "Enganar o monge."
 tgp_hunt.0009.b.failure:0 "[buddhist_hermit.GetFirstName] mantém suas crenças"
 tgp_hunt.0009.b.flavor:0 "O suficiente de ouro pode convencer qualquer um."
 tgp_hunt.0009.b.success:0 "O ouro foi suficiente para comprar os princípios [Select_CString( buddhist_hermit.IsFemale, 'da', 'do' )] [buddhist_hermit.GetFirstName]"
 tgp_hunt.0009.b:0 "Dar a [buddhist_hermit.GetSheHe] um bom negócio."
 tgp_hunt.0009.c.flavor:0 "Por que perder tempo com um pária desses?"
 tgp_hunt.0009.c:0 "Bah! Irei caçar com outros."
 tgp_hunt.0009.d.flavor:0 "Crenças assim merecem reconhecimento."
 tgp_hunt.0009.d:0 "Admiro os princípios [buddhist_hermit.GetHerHim]."
 tgp_hunt.0009.desc:0 "Enquanto perseguia minha presa, deparei-me com um asceta criando falcões.\n\n\"Admire a beleza das minhas aves!\"\n\n\"Você deve ser um caçador prodigioso.\" respondi, ansioso para ouvir histórias das façanhas [buddhist_hermit.GetHerHim].\n\n\"Não, longe disso, estas aves nunca são soltas para matar. Isso contraria os ensinamentos de [buddhist_hermit.GetFaith.HighGodName].\" É justo impedir o curso natural das coisas?"
 tgp_hunt.0009.t:0 "Um Eremita [target_faith.GetReligion.GetAdjectiveNoTooltip]"
 tgp_hunt.0010.a:0 "Contemplar esta visão."
 tgp_hunt.0010.b:0 "Bah! Preciso continuar procurando pelo(a) [activity.Custom('GetAnimalType')]."
 tgp_hunt.0010.c.failure:0 "Seu tiro quase erra"
 tgp_hunt.0010.c.success:0 "Sua flecha atinge o grou"
 tgp_hunt.0010.c:0 "Deixe-me ver quão imortais eles realmente são."
 tgp_hunt.0010.d:0 "Isso me dá um momento de inspiração."
 tgp_hunt.0010.desc_common:0 "\n\nEnquanto corremos para onde o(a) [activity.Custom('GetAnimalType')] foi visto pela última vez, avistamos algo ainda mais magnífico: um bando de grou-de-coroa-vermelha.\n\nEsses símbolos de longevidade e imortalidade me fazem refletir..."
 tgp_hunt.0010.desc_fallback:0 "Enquanto descansava no acampamento, um companheiro caçador, [target_character.GetFirstName], correu para me informar que um(a) [activity.Custom('GetAnimalType')] foi avistado a leste. $tgp_hunt.0010.desc_common$"
 tgp_hunt.0010.desc_master_of_the_hunt:0 "Enquanto descansava no acampamento, meu mestre da caça correu para me informar que um(a) [activity.Custom('GetAnimalType')] foi avistado a leste. $tgp_hunt.0010.desc_common$"
 tgp_hunt.0010.t:0 "Grou-de-Coroa-Vermelha"
