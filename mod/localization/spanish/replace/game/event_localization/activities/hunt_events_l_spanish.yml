 jizo_statue:0 "Estátua de Jizō"
 love_artifact_poetry_description:0 "Uma obra de poesia dedicada a [ROOT.Char.GetTitledFirstName] em celebração de quando [sex_memory.GetDescription], escrita [Select_CString( shrine_maiden.IsFemale, 'pela', 'pelo' )] [shrine_maiden.GetTitledFirstName] amante [Select_CString( shrine_maiden.IsFemale, 'da', 'do' )] [ROOT.Char.GetFirstNameNoTooltip].\n\n#EMP $hunt.8211.desc$#!"
 love_artifact_poetry_name:0 "Atravessei uma Ponte de Prazer"
