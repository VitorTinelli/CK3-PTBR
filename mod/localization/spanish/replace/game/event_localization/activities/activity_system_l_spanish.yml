l_spanish:
 ACTIVITY_LOG_ENTRY_EFFECT:0 "#S Efeitos#!\n$EFFECT$"
 SELECT_ACTIVITY_DECISION_NEXT_STEP_BUTTON:0 "$SELECT_ACTIVITY_DECISION_TITLE$"
 SELECT_ACTIVITY_DECISION_TITLE:0 "#D Selecionar Tipo de Atividade#!"
 activity_feast_guest_desc:0 "$BULLET_WITH_TAB$Os participantes podem ganhar [opinion|E] dos personagens presentes\n$BULLET_WITH_TAB$Os participantes podem perder [stress_loss_i][stress|E]\n$BULLET_WITH_TAB$Os participantes podem adquirir o [trait|E] [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )]"
 activity_pulse_action_guest_friendship:0 "[second.GetShortUINameNoTooltip|U] Elogia [first.GetShortUINameNoTooltip|U]"
 activity_pulse_action_guest_insulted:0 "[second.GetShortUINameNoTooltip|U] Insulta [first.GetShortUINameNoTooltip|U]"
 activity_system.0040.a:0 "Uma verdadeira pena."
 activity_system.0040.desc:0 "Ai! Com as novas circunstâncias em torno do Torneio, uma rápida conversa com os organizadores confirma seus temores: o Torneio deve ser cancelado.\n\nArquivos de pessoas desanimadas passam, crianças desapontadas segurando as mãos de seus pais. Esperançosamente, em um futuro próximo, pode haver outra chance para essas festividades serem retomadas."
 activity_system.0040.t:0 "Torneio Encerrado"
 activity_system.0080.a:0 "Vamos continuar."
 activity_system.0080.desc:0 "Com a morte do anfitrião anterior, sussurros apressados entre os organizadores relevantes ganham ritmo. Todos presentes circulam felizes, alheios ao quase pânico que ocorre nos bastidores.\n\nFinalmente, um acordo é alcançado."
 activity_system.0080.desc_me:0 "As festividades continuarão, e eu estarei à frente delas!"
 activity_system.0080.desc_other:0 "As festividades continuarão, mas agora com [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstName] à frente delas!"
 activity_system.0080.t:0 "Um Novo Anfitrião"
 activity_system.0081.a.tt:0 "[old_host.GetShortUIName] será [Select_CString( old_host.IsFemale, 'levada', 'levado' )] para descansar em [THIS.Char.GetTravelPlan.GetData.GetFinalDestination.GetProvince.GetNameNoTooltip]"
 activity_system.0081.a:0 "[ROOT.Char.GetTravelPlan.GetData.GetFinalDestination.GetProvince.GetNameNoTooltip] era o lar [old_host.GetHerHim]."
 activity_system.0081.b.tt:0 "[old_host.GetShortUIName] será [Select_CString( old_host.IsFemale, 'levada', 'levado' )] para descansar em [THIS.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]"
 activity_system.0081.b:0 "[old_host.GetSheHe|U] merece descansar na santidade de [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]."
 activity_system.0081.c.tt:0 "A [THIS.Char.GetInvolvedActivity.GetName] continuará e [old_host.GetShortUIName] será [Select_CString( old_host.IsFemale, 'levada', 'levado' )] para descansar em [THIS.Char.GetTravelPlan.GetData.GetFinalDestination.GetProvince.GetNameNoTooltip]"
 activity_system.0081.c:0 "Nós levamos [old_host.GetSheHe] para [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] e depois para casa."
 activity_system.0081.desc.outro:0 "como seu herdeiro, fui encarregado.\n\nAssim sendo, independentemente dos meus próprios sentimentos, preciso decidir como devemos lidar com os restos mortais e os ritos finais [old_host.GetHerHim]."
 activity_system.0081.desc.relation_family:0 "[Select_CString( old_host.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_host'))] [old_host.GetTitledFirstName] infelizmente partiu deste mundo e,"
 activity_system.0081.desc.relation_family_liked:0 "[Select_CString( old_host.IsFemale, 'Minha querida', 'Meu querido' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_host'))] [old_host.GetTitledFirstName] infelizmente partiu deste mundo e,"
 activity_system.0081.desc.relation_liked:0 "[Select_CString( old_host.IsFemale, 'Minha querida', 'Meu querido' )] [old_host.GetTitledFirstName] infelizmente partiu deste mundo e,"
 activity_system.0081.desc.relation_neutral:0 "Infelizmente [Select_CString( old_pilgrimage_host.IsFemale, 'a', 'o' )] [old_pilgrimage_host.GetTitledFirstName] partiu deste mundo e,"
 activity_system.0081.t:0 "O Destino Final"
 activity_system.0090.a:0 "Hora de direcionar meu foco para outro lugar."
 activity_system.0090.desc:0 "Com a mudança das circunstâncias atuais, fica claro que minha intenção anterior não pode ser seguida. Outros passam por mim felizes enquanto pondero minha situação, completamente alheio à minha leve consternação.\n\nO que mais meu coração deseja? Talvez eu deva apenas relaxar um pouco?"
 activity_system.0090.t:0 "Intenção Invalidada"
 activity_system.0091.a:0 "Bem, é hora de encontrar uma nova musa..."
 activity_system.0091.desc:0 "Com a mudança das circunstâncias atuais, fica claro que meu alvo de intenção anterior não é mais relevante para meus objetivos. Outros passam por mim felizes enquanto pondero minha situação, completamente alheio à minha leve consternação.\n\nEm quem mais devo me concentrar? Talvez eu deva simplesmente me concentrar em mim mesmo?"
 activity_system.0091.t:0 "Alvo de Intenção Invalidado"
 activity_system.0100.a:0 "Mas por quê... por que ninguém apareceu?"
 activity_system.0100.desc:0 "Absolutamente inacreditável! Apesar dos meus muitos convites e preparativos, ninguém apareceu para o meu [activity_type.GetNameNoTooltip()]. Talvez o caminho para [location.GetName] esteja mais perigoso do que eu antecipava.\n\n"
 activity_system.0100.outro_away:0 "Suponho que seja hora de iniciar minha jornada de volta para casa, em [ROOT.Char.GetCapitalLocation.GetName]."
 activity_system.0100.outro_home:0 "Pelo menos economizei o trabalho de viajar para longe de casa."
 activity_system.0100.t:0 "Uma Celebração Pobre"
 activity_system.0300.a.tt:0 "O [target_activity_type.GetNameNoTooltip] continuará"
 activity_system.0300.a:0 "Eu posso lidar com as coisas daqui."
 activity_system.0300.b.tt.cost:0 "Algumas despesas podem ser recuperadas"
 activity_system.0300.b.tt:0 "O [target_activity_type.GetNameNoTooltip] será cancelado e todos os participantes começarão a retornar para casa"
 activity_system.0300.b:0 "Esta guerra requer minha atenção total."
 activity_system.0300.desc.attacker:0 "Eu me juntei à luta contra [war_opponent.GetNameRegnal|U]."
 activity_system.0300.desc.defender:0 "[Select_CString( war_opponent.IsFemale, 'Aquela', 'Aquele' )] [war_opponent.Custom2('InsultNoun', ROOT.Char)] [war_opponent.GetNameRegnal|U] declarou guerra contra mim!\n\n"
 activity_system.0300.desc.intro.activity:0 "O estridente dos chifres de guerra chegou até mim mesmo aqui em [target_activity_location.GetName], enquanto estou no meio da realização de um [target_activity_type.GetNameNoTooltip]."
 activity_system.0300.desc.intro.traveling:0 "O som estridente dos chifres de guerra chegou até mim mesmo aqui em [target_activity_location.GetName], enquanto estou a caminho de participar do meu [target_activity_type.GetNameNoTooltip] em [target_activity_location.GetName]."
 activity_system.0300.desc.outro:0 "Muito planejamento foi feito para hospedar este [target_activity_type.GetNameNoTooltip] e não desejo mandar meus convidados para casa. No entanto, a importância deste conflito não deve ser subestimada.\n\nTalvez seja melhor concentrar todos os meus esforços em me preparar para a guerra..."
 activity_system.0300.t:0 "A Guerra não Espera [Select_CString( ROOT.Char.IsFemale, 'Pela', 'Pelo' )] [ROOT.Char.GetWomanMan|U]"
 activity_system.0301.a:0 "Que tragédia..."
 activity_system.0301.desc:0 "#EMP \"Para a guerra! Para a guerra!\"#! chamam [knights|l] [Select_CString( target_activity_host.IsFemale, 'da', 'do' )] [target_activity_host.GetTitledFirstName] enquanto eles passam, seus chifres berrando e estandartes brilhantes tremulando contra o céu.\n\nAparentemente, [Select_CString( war_opponent.IsFemale, 'aquela', 'aquele' )] [war_opponent.Custom('InsultNoun')] [war_opponent.GetNameRegnal] não tem consideração por nosso [target_activity_type.GetNameNoTooltip]! O evento será cancelado, enquanto [Select_CString( target_activity_host.IsFemale, 'a', 'o' )] [target_activity_host.GetTitleAsNameNoTooltip] convoca suas milícias e reza a [target_activity_host.GetFaith.WarGodName] por vitória.\n\nUm [target_activity_type.GetNameNoTooltip] é um entretenimento nobre e digno, mas o chamado às armas soa mais alto do que qualquer outro."
 activity_system.0301.t:0 "[target_activity_type.GetNameNoTooltip] Cancelado"
 activity_system.0310.a.tt:0 "Você continua participando de [target_activity_type.GetNameNoTooltip]"
 activity_system.0310.b.tt:0 "Você deixa o [target_activity_type.GetNameNoTooltip] e começa a retornar para casa"
 activity_system.0310.desc.intro:0 "O toque estrondoso dos chifres de guerra chegou até mim aqui em [target_activity_location.GetName], enquanto participo de [target_activity_type.GetNameNoTooltip] [Select_CString( target_activity_host.IsFemale, 'da', 'do' )] [target_activity_host.GetName|U].\n\n"
 activity_system.0310.desc.primary_defender:0 "[Select_CString( attacker.IsFemale, 'A vil', 'O vil' )] [attacker.GetTitledFirstName|U] declarou guerra contra mim!"
 activity_system.0310.desc.random_defender:0 "Fui convocado para ajudar na guerra entre [attacker.GetTitledFirstName|U] e [defender.GetTitledFirstName|U]."
 activity_system.0320.a:0 "O que está feito, está feito."
 activity_system.0320.desc:0 "[Select_CString( host.IsFemale, 'Nossa anfitriã', 'Nosso anfitrião' )], [host.GetName], perdeu suas posses territoriais e, portanto, a [activity_type.GetNameNoTooltip()] chegou a um fim prematuro.\n\nCertamente não era assim que eu esperava que este evento terminasse após todo o alarde dos convites e da preparação. Suponho que tudo o que resta é que meu séquito e eu retornemos para [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]..."
 activity_system.0320.t:0 "Uma Conclusão Inesperada"
 activity_system.0321.a:0 "Eu não acredito nisso."
 activity_system.0321.desc.intro:0 "Nosso anfitrião, [host.GetName],"
 activity_system.0321.desc.no_christian:0 "declarou que [host.GetSheHe] não acredita mais em [ROOT.Char.GetFaith.GetName]. Em vez disso, [host.GetSheHe] revelou de forma chocante [host.GetHerHis] paixão pela fé de [host.GetFaith.GetName]."
 activity_system.0321.desc.no_hof:0 "não é mais o chefe da Igreja de [ROOT.Char.GetFaith.GetName].\n\nEnquanto essa revelação chocante chega aos convidados, somos exortados a retornar para casa."
 activity_system.0321.t:0 "$activity_system.0320.t$"
 activity_system.0330.a:0 "Que meus convidados cheguem em casa em segurança."
 activity_system.0330.desc.intro:0 "Fui considerado incapaz e sou considerado completamente inadequado para gerenciar meus próprios assuntos, incluindo meu [activity_type.GetNameNoTooltip()]!\n\n"
 activity_system.0330.desc.memory:0 "Infelizmente, [incapable_memory.GetDescription].\n\n"
 activity_system.0330.desc.outro:0 "Não há mais nada a fazer além de retornar para casa em [home.GetName]."
 activity_system.0330.t:0 "Incapaz"
 activity_system.0331.a:0 "Que pena."
 activity_system.0331.desc:0 "[Select_CString( host.IsFemale, 'Nossa anfitriã', 'Nosso anfitrião' )], [host.GetName], foi considerado incapaz pelas pessoas ao redor [host.GetHerHim] e é considerado completamente inadequado para gerenciar seus próprios assuntos, incluindo seu(a) [activity_type.GetNameNoTooltip()]!\n\nInfelizmente, todos nós devemos retornar para casa de mãos vazias."
 activity_system.0331.t:0 "Incapaz"
 activity_system.0340.a:0 "Vá para algum lugar seguro!"
 activity_system.0340.desc.guest:0 "Devido a [host.Custom('GetIsolationReason')] inesperado, o [activity_type.GetNameNoTooltip()] em [location.GetName] não é mais seguro. Pelo bem dos participantes, [host.GetTitledFirstName] cancelou [host.GetHerHis] [activity_type.GetNameNoTooltip()]."
 activity_system.0340.desc.host:0 "Devido a [host.Custom('GetIsolationReason')] inesperado, o [activity_type.GetNameNoTooltip()] em [location.GetName] não é mais seguro. Pelo bem dos participantes, tenho que cancelar meu [activity_type.GetNameNoTooltip()]."
 activity_system.0340.t:0 "$isolating_modifier$"
 activity_system.0400.a.tt:0 "Você espera ganhar velocidade ao longo do caminho"
 activity_system.0400.a:0 "Vamos nos apressar."
 activity_system.0400.b:0 "Não vale realmente a pena."
 activity_system.0400.desc_leader:0 "Quando [travel_leader.Custom2('MyCharacterIntroduction', ROOT.Char)] se aproxima de mim com uma mistura de vergonha e preocupação estampada em seu rosto, sei que [travel_leader.GetSheHe] traz más notícias.\n\n\"Peço desculpas por informar que estamos atrasados em cerca de [GetTimeBetweenDates(ROOT.Char.GetInvolvedActivity.GetActiveStartDate.Self, ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetEstimatedArrivalDate)], [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip], e talvez não cheguemos ao destino a tempo.\""
 activity_system.0400.desc_no_leader:0 "Continuo avaliando o céu e todos os mapas que possuo, mas está claro que a matemática não fecha.\n\nEstamos atrasados em cerca de [GetTimeBetweenDates(ROOT.Char.GetInvolvedActivity.GetActiveStartDate.Self, ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetEstimatedArrivalDate)] e, se continuarmos no ritmo atual ao longo do itinerário atual, não chegaremos ao destino a tempo."
 activity_system.0400.t:0 "Atrasado no Cronograma"
 activity_system.0401.a:0 "Decepcionante."
 activity_system.0401.desc_leader:0 "[travel_leader.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim com uma expressão sombria em seu rosto.\n\n\"Lamento informar que não chegamos a tempo, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip]. A atividade começou hoje, e simplesmente não estamos lá para isso.\""
 activity_system.0401.desc_no_leader:0 "Hoje é o dia. A atividade começou hoje, mas apesar dos meus melhores esforços, simplesmente não estamos lá para isso.\n\nNão há mais nada a fazer além de voltar para casa."
 activity_system.0401.t:0 "Muito Tarde"
 activity_system.0500.a:0 "Uma tragédia, de fato."
 activity_system.0500.desc:0 "Recebi a notícia de que nosso anfitrião, [host.GetNameNoTooltip], faleceu. Devido a essas circunstâncias imprevistas, sua atividade foi cancelada."
 activity_system.0500.t:0 "Um Fim Sombrio"
 activity_system.0501.a:0 "Eu não posso acreditar..."
 activity_system.0501.desc:0 "O clamor ecoa por todo o salão de exames. Eruditos e monges correm de um lado para o outro. Uma multidão se reúne no pátio, e dela vem o som de choro.\n\n[Select_CString( ROOT.Char.GetTopLiege.IsFemale, 'A', 'O' )] [ROOT.Char.GetTopLiege.Custom('GetDaughterSon')] do Céu está mort[Select_CString( ROOT.Char.GetTopLiege.IsFemale, 'a', 'o' )]."
 activity_system.0501.t:0 "Uma alma partiu"
 activity_system.0550.a:0 "Isso não fazia parte do meu plano..."
 activity_system.0550.desc:0 "Devido ao meu súbito e inesperado aprisionamento, me vejo incapaz de continuar participando da minha atividade, e ela precisa ser cancelada.\n\nTodo o tempo que passei planejando..."
 activity_system.0550.t:0 "Planos Frustrados"
 activity_system.0551.a:0 "Hora de voltar para casa."
 activity_system.0551.desc:0 "Devido ao súbito e inesperado aprisionamento [Select_CString( host.IsFemale, 'da minha anfitriã', 'do meu anfitrião' )], [host.GetNameNoTooltip], a atividade da qual eu participava foi cancelada."
 activity_system.0551.t:0 "Encarceramento do Anfitrião"
 activity_system.0552.a:0 "Até a próxima..."
 activity_system.0552.desc:0 "O que significa isso? Parece que nenhum outro movimento está disposto a enfrentar o desafio do [GetPlayer.Custom('GetMyMovementNoTooltip')].\n\nSem ninguém para debater, o debate foi cancelado."
 activity_system.0552.t:0 "Desafio Ignorado"
 activity_system.0554.a:0 "Devo aceitar este desafio."
 activity_system.0554.b:0 "Pensarei em uma desculpa conveniente."
 activity_system.0554.opening:0 "[host.Custom2('AppropriateGreeting', ROOT.Char)]"
 activity_system.1010.a:0 "Descanse em paz, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('host'))]."
 activity_system.1010.desc.entourage:0 "O séquito d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetFirstNameNoTooltip] certamente começará uma jornada de luto de volta para casa, levando o corpo [Select_CString( host.IsFemale, 'da', 'do' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('host'))]."
 activity_system.1010.desc.ruler:0 "[Select_CString( host.IsFemale, 'A falecida', 'O falecido' )] [host.GetTitleAsName] não merecia morrer tão longe de casa."
 activity_system.1010.desc:0 "[Select_CString( host.IsFemale, 'Minha antecessora', 'Meu antecessor' )], [host.GetNameRegnal], partiu desta vida enquanto percorria o reino. Tragicamente, [host.GetSheHe] [host.GetDeathReason].\n\n"
 activity_system.1010.t:0 "Uma Viagem Interrompida"
 activity_system.1010.tt:0 "A [activity|E] de [host.GetShortUINameNoTooltip] foi cancelada"
 activity_system.1011.desc:0 "[Select_CString( host.IsFemale, 'Minha senhora', 'Meu senhor' )], [host.GetNameRegnal], partiu desta vida enquanto percorria o reino. Tragicamente, [host.GetSheHe] [host.GetDeathReason].\n\nO restante da turnê foi cancelado enquanto o séquito d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetFirstNameNoTooltip] inicia sua jornada de luto de volta para casa, levando o corpo [host.GetHerHim] ao seu descanso final."
 activity_tournament_guest_desc:0 "#weak Se você for elegível, participar de um Torneio oferecerá a chance de vencer competições e, portanto, prêmios, além de relaxar e apreciar as vistas e os sons. Também proporciona uma oportunidade para aprimorar suas habilidades marciais.#!"
 activity_tournament_province_desc:0 "Você realiza um Torneio em [ROOT.Province.GetName]\nProvíncias com prédios adequados concedem um desconto de [gold_i][gold|E]"
 guest_friendship_title:0 "$activity_pulse_action_guest_friendship$"
 guest_insulted_title:0 "$activity_pulse_action_guest_insulted$"
