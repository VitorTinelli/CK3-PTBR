l_spanish:
 feast_default_laurence.100.a.tt.failure:0 "[intent_target.GetTitledFirstName] foi esperto demais"
 feast_default_laurence.100.a.tt.success:0 "[intent_target.GetTitledFirstName] sangrou como um sacrifício"
 feast_default_laurence.100.a:0 "Deixe sua lâmina beber fundo!"
 feast_default_laurence.100.b:0 "O pensamento da morte [intent_target.GetHerHim] desperta algo em mim, mas vamos observar e esperar."
 feast_default_laurence.100.c:0 "Esqueça essas palavras tolas, mas lembre-se, eu vou lembrar."
 feast_default_laurence.100.desc:0 "Ao voltar de me aliviar, sou abordado por um [conspiratorial_fellow.GetName] de olhar firme. [conspiratorial_fellow.GetSheHe|U] me conta histórias da [war_memory.MakeScope.Var('war_cb').GetFlagName] que [conspiratorial_fellow.GetSheHe] lutou contra [intent_target.GetName]. Com os dentes cerrados, [conspiratorial_fellow.GetSheHe] lamenta não ter tido a chance dividi-[Select_CString( intent_target.IsFemale, 'la', 'lo' )] do umbigo ao queixo. Aproximando-se e prendendo seu olhar ao meu.\n\n\"Que o [ROOT.Char.Custom('RegionalEdibleAnimal')] que seus cozinheiros prepararam tão bem não seja a única besta assada neste banquete! Basta dizer aos seus guardas para fecharem os olhos e taparem os ouvidos. Eu cuidarei do resto.\""
 feast_default_laurence.100.t:0 "Uma Causa Comum"
 feast_default_laurence.101.a:0 "A morte me encontrou."
 feast_default_laurence.101.desc:0 "Meu anfitrião fez o possível para preparar um bom banquete. Embora humilde comparado às delícias suntuosas de [intent_target.GetCapitalLocation.GetName], aprecio a dedicação do meu vassalo à hospitalidade.\n\nDe repente percebo que há menos pessoas no salão. Sim, os guardas parecem ter se retirado.\n\nUm beliscão no meu lado! Seria uma pulga? Algo quente alivia a coceira. Olho para baixo, o punho de uma lâmina cresceu entre minhas costelas. O que está fazendo aí..."
 feast_default_laurence.102.a:0 "Que esta colaboração seja o início de uma grande amizade."
 feast_default_laurence.102.b.flavor:0 "Você tenta prender [conspiratorial_fellow.GetSheHe]."
 feast_default_laurence.102.b.tt.fail:0 "Seus guardas falham em agarrar [conspiratorial_fellow.GetName]."
 feast_default_laurence.102.b.tt.success:0 "Seus guardas dominam o traidor."
 feast_default_laurence.102.b:0 "Você trai minha hospitalidade com derramamento de sangue!"
 feast_default_laurence.102.desc:0 "Queria presentear [intent_target.GetName] com um sinal da minha fidelidade. Um sinal tão grande que exigiu todos os meus guardas para carregá-lo. Mas, quando eles saíram da sala para buscá-lo, parece que meu convidado fez crescer uma lâmina entre as costelas [intent_target.GetHerHim].\n\n[conspiratorial_fellow.GetName] sorri para mim, os olhos [conspiratorial_fellow.GetHerHim] brilham intensamente, tendo capturado a luz de uma vida extinta."
