 tour_travel.3000.a:0 "Nós poderíamos ajudar a construir um simples [ROOT.Char.GetFaith.HouseOfWorship]."
 tour_travel.3000.b:0 "Eu construirei um grandioso [ROOT.Char.GetFaith.HouseOfWorship] aqui."
 tour_travel.3000.c:0 "\"Então você deve andar.\""
 tour_travel.3000.desc:0 "Eu visito uma vila enquanto viajo por [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] e passo algum tempo discutindo assuntos de adoração local com um camponês particularmente piedoso chamado [pious_peasant.GetName].\n\n\"Aqui não temos nem mesmo um [ROOT.Char.GetFaith.HouseOfWorship]. Se quisermos pisar em uma casa de [ROOT.Char.GetFaith.HighGodName|U], precisamos viajar por dias.\""
 tour_travel.3000.t:0 "Sem [ROOT.Char.GetFaith.HouseOfWorshipPlural|U]?"
 tour_travel.3001.a.drunkard:0 "#EMP O que eu fiz?#!"
 tour_travel.3001.a:0 "Que ideia maravilhosa."
 tour_travel.3001.b:0 "Não, eu não me casarei com camponeses sujos e nojentos."
 tour_travel.3001.desc.drunkard:0 "Eu acordo confuso, minha cabeça latejando, meus ouvidos zumbindo, e a luz perfura minha mente como punhais. Minha boca está seca como um deserto, e antes que eu possa implorar por água, vejo uma estranha camponesa de pé ao lado da minha cama com uma jarra de água.\n\n\"Aqui está, [ROOT.Char.Custom('FormOfAddressForLiege')], você precisará depois da noite que teve!\"\n\nEu me viro na cama e vejo um estranho dormindo ao meu lado em um sono tranquilo.\n\n\"Afinal, não é todo dia que [Select_CString( marriage_candidate.IsFemale, 'minha', 'meu' )] [marriage_candidate.Custom('DaughterSon')] se casa com um [ROOT.Char.GetTitleAsNameNoTooltip|U]!\""
 tour_travel.3001.desc:0 "Paramos em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] em uma pequena vila. Eu consigo suportar quase todo o banquete antes de perceber que algo está errado.\n\nEu percebo que [marriage_mother.GetName], que tem falado constantemente sobre [Select_CString( marriage_candidate.IsFemale, 'sua', 'seu' )] [marriage_candidate.Custom('GetDaughterSon')] [marriage_candidate.GetName], não está apenas se gabando, ela está #EMP vendendo#!.\n\n\"Quando vocês dois se casarem, tudo será perfeito!\" diz [marriage_mother.GetNameNoTooltip], seus olhos brilhando de orgulho."
 tour_travel.3001.t:0 "Cerimônia Improvisada"
 tour_travel.3002.a:0 "\"Eu não posso trazê-los de volta, mas talvez algum ouro ajude.\""
 tour_travel.3002.b:0 "\"Essa foi um sacrifício que eu estava disposto a fazer.\""
 tour_travel.3002.desc:0 "\"Meu [widow_peasant.Custom2( 'RelationToMeShort', widow_father )], meu [widow_peasant.Custom2( 'RelationToMeShort', widow_husband )], meu [widow_peasant.Custom2( 'RelationToMeShort', widow_son )] todos morreram na #EMP sua guerra#!.\" Um camponês está gritando comigo do outro lado da praça da vila.\n\n\"Quando [battle_memory.GetSecondPerspectiveDescription], foi uma vitória para você, mas para mim foi o dia em que três gerações da minha família morreram.\"\n\nA raiva de [widow_peasant.GetHerHim] se transformou em lágrimas e as palavras que [widow_peasant.GetSheHe] disse em seguida mal chegaram aos meus ouvidos.\n\n\"Você não é [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|l].\""
 tour_travel.3002.t:0 "O Preço da Conquista"
 tour_travel.3003.a:0 "Fingir me importar com eles é meu dever."
 tour_travel.3003.b:0 "Direi a eles o que penso deles."
 tour_travel.3003.desc:0 "Em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], paramos para conversar com o centésimo camponês do dia e meu estômago se revira só de olhar para essas criaturas miseráveis.\n\nDentes amarelados e deformados, olhos opacos e vazios escondendo um cérebro apodrecido e iletrado. Cada um deles carregando doenças sem nome que marcam seus rostos em inúmeras feridas e manchas.\n\nEu simplesmente não consigo me importar com uma palavra que eles dizem."
 tour_travel.3003.t:0 "Criaturas Repugnantes"
 tour_travel.3004.a:0 "Isso é... tão ótimo"
 tour_travel.3004.b:0 "Isso é uma #EMP piada#!? Derrubem-na!"
 tour_travel.3004.c:0 "Na verdade, é bastante preciso."
 tour_travel.3004.desc:0 "Fui avisado com antecedência de que os aldeões de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] se reuniram e ergueram uma estátua minha.\n\nQuando chego e olho para ela, não consigo realmente processar o que estou vendo. Não apenas a estátua é a coisa mais feia que já vi, mas não se parece nada comigo!\n\nDando uma olhada ao redor, vejo apenas rostos orgulhosos sorrindo para mim. Será que ninguém mais percebe como isso é ruim?"
 tour_travel.3004.t:0 "A Estátua Feia"
 tour_travel.3005.a:0 "Liberte [criminal_peasant.GetSheHe]!"
 tour_travel.3005.b:0 "Que crime terrível e horrível..."
 tour_travel.3005.desc:0 "Ao passar por [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], vejo um prisioneiro lamentável, acorrentado a um poste como um cachorro. [criminal_peasant.GetSheHe] clama por misericórdia.\n\n\"Qual é o seu crime?\" Exijo com um nível de altivez digno de um [ROOT.Char.GetTitleAsNameNoTooltip].\n\n\"Sou acusado de ser um [criminal_secret.GetNameNoTooltip]: uma acusação que, infelizmente, não posso refutar.\"\n\nAlgumas pequenas gotas de suor aparecem na minha testa, afinal, #EMP eu#! também sou um [criminal_secret.GetNameNoTooltip]."
 tour_travel.3005.t:0 "Crime Familiar"
 tour_travel.3006.a:0 "Contarei a primeira história."
 tour_travel.3006.b:0 "Todo mundo adora uma história de guerra."
 tour_travel.3006.desc:0 "Vários camponeses se reúnem ao meu redor pedindo histórias da minha vida. Penso em algo que possa contar a eles e duas histórias me vêm à mente. Uma, quando [positive_memory.GetDescription] é uma lembrança adorável.\n\nPor outro lado, quando [war_memory.GetDescription] é uma história mais impressionante, provavelmente capaz de inspirar lealdade e fervor."
 tour_travel.3006.t:0 "Vida de um Governante"
 tour_travel.3007.a:0 "Preciso sair daqui agora mesmo."
 tour_travel.3007.b:0 "Pode ser que eu também participe."
 tour_travel.3007.desc:0 "Quando paramos para descansar esta noite, um morador local se ofereceu para nos mostrar a cidade local.\n\nSó entendo exatamente o que foi sugerido quando me encontro nas profundezas de um antro de prazer.\n\nÀ minha esquerda, pessoas estão se unindo como se fosse o fim do mundo. À minha direita, um artista está tentando o que parece ser a #EMP [ROOT.Char.Custom('GetDescriptorManeuver')] [random_event_culture.GetNameNoTooltip] [ROOT.Char.Custom('GetManeuver')].#!"
 tour_travel.3007.t:0 "Casa de Prazer"
 tour_travel.3010.a:0 "Derrubem essa heterodoxia!"
 tour_travel.3010.b:0 "'Santo [saint_name.GetFirstNameNoTooltip]'... tem um belo som."
 tour_travel.3010.c:0 "É melhor irmos embora."
 tour_travel.3010.desc:0 "Enquanto percorremos as [shrine_province.Custom('GetTerrainTypePlural')], atravessando o [shrine_province.Custom('GetProvinceGroundDesc')], nos deparamos com uma modesta capela desviada. Esculpida ingenuamente, ela ostenta um [shrine_province.GetCounty.GetFaith.ReligiousSymbol] em sua cabeça e, abaixo, as palavras gastas:\n\n#EMP 'Aqui repousa Santo [saint_name.GetFirstNameNoTooltip] de [shrine_province.GetCounty.GetTitle.GetDeJureLiege.GetNameNoTierNoTooltip], abençoad[Select_CString( saint_name.IsFemale, 'a', 'o' )] [saint_name.Custom('GetDaughterSon')] de [shrine_province.GetNameNoTooltip]'#!\n\nSanto [saint_name.GetFirstNameNoTooltip]? De [shrine_province.GetCounty.GetTitle.GetDeJureLiege.GetNameNoTierNoTooltip]? Parece que uma figura espiritual local está sendo apoiada nestas partes; uma que não é sancionada pelos [ROOT.Char.GetFaith.AltPriestTermPlural] [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]..."
 tour_travel.3010.t:0 "Herói Local"
 tour_travel.3020.a:0 "Venha, os outros já estão todos dormindo."
 tour_travel.3020.c:0 "Ha! Quem você pensa que é?!"
 tour_travel.3020.d:0 "Devo descansar um pouco..."
 tour_travel.3020.desc:0 "Nos abrigamos de um [ROOT.Char.GetCurrentLocation.Custom('GetBadWeatherDesc')] à noite em uma estalagem conveniente, mas apertada, saboreando bebidas enquanto o vento uiva lá fora. Um a um, os membros do grupo se retiram para os quartos para dormir.\n\nEstou perdido em pensamentos quando percebo que a vela está quase apagada, e estou sozinho com [love_professor.GetFirstName], [Select_CString( love_professor.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', love_professor)]. Há um olhar estranho nos olhos del[Select_CString( love_professor.IsFemale, 'a', 'e' )].\n\nUm momento passa entre nós antes que [love_professor.GetSheHe] franzisse a testa, escolhendo cuidadosamente as palavras. \"Sabe, eu admiro você um #EMP enorme#! [ROOT.Char.GetFirstNameNoTooltip] — Quero dizer [ROOT.Char.GetTitleAsNameNoTooltip]...\" Um sorriso brinca nos lábios [love_professor.GetHerHim]."
 tour_travel.3020.t:0 "Sozinho no Escuro"
 tour_travel.3030.a:0 "Gostaria de ouvir as acusações..."
 tour_travel.3030.b.sadistic:0 "Ah, adoro uma boa execução!"
 tour_travel.3030.b:0 "Continuem."
 tour_travel.3030.c:0 "Você tem sorte, temos aqui o melhor executor de [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]!"
 tour_travel.3030.d:0 "Estou... aqui para perdoar [wrongfully_accused.GetSheHe]! E [accused_partner.GetSheHe]!"
 tour_travel.3030.desc:0 "Nos aproximamos de uma aldeia onde um[Select_CString( wrongfully_accused.IsFemale, 'a', '' )] [wrongfully_accused.GetWomanMan] abandonad[Select_CString( wrongfully_accused.IsFemale, 'a', 'o' )] está acorrentad[Select_CString( wrongfully_accused.IsFemale, 'a', 'o' )] em um cadafalso, uma multidão se reunindo aos seus pés.\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip]! É o [ROOT.Char.GetTitleAsNameNoTooltip]!\" Um camponês se abre caminho pela multidão, gritando: \"Por favor! [Select_CString( wrongfully_accused.IsFemale, 'Minha', 'Meu' )] [wrongfully_accused.Custom('WifeHusband')] é inocente!"
 tour_travel.3030.framed:0 "[wrongfully_accused.GetSheHe|U] não fez isso, [ROOT.Char.Custom('FormOfAddressForLiege')]! Eu sei!"
 tour_travel.3030.outro:0 "Eles levam [accused_partner.GetSheHe] embora, lamentando: \"Não! #EMP [wrongfully_accused.GetFirstName]...!#!\" enquanto [accused_partner.GetSheHe] é arrastado pela rua.\n\nO oficial se curva timidamente, \"Desculpe, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord]! Ignore [accused_partner.GetSheHe], [Select_CString( wrongfully_accused.IsFemale, 'a', 'o' )] [wrongfully_accused.GetWomanMan] #EMP é#! culpad[Select_CString( wrongfully_accused.IsFemale, 'a', 'o' )] — não se preocupe com isso...\""
 tour_travel.3030.pinned:0 "Esses malfeitores colocam seus pecados aos pés dos outros!"
 tour_travel.3030.t:0 "A Verdade"
 tour_travel.3030.wrongful:0 "É uma mentira! Ninguém sequer viu isso!"
 tour_travel.3040.a.martial:0 "Comigo, guardas! Vamos surpreender esses vilões!"
 tour_travel.3040.a:0 "Venham, guardas, vamos surpreender aqueles vilões!"
 tour_travel.3040.b:0 "#EMP Quase#! tudo?"
 tour_travel.3040.c.foreign:0 "Isso é assunto para [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetHolder.GetTitleAsNameNoTooltip], camponês."
 tour_travel.3040.c:0 "Receio que tenho coisas melhores para fazer, camponês."
 tour_travel.3040.desc:0 "Enquanto trotamos nos arredores de uma pequena aldeia no cruzamento de estradas, um camponês temeroso se aproxima, seus olhos arregalados de alívio.\n\n\"Graças a Deus! Você deve nos ajudar, nobre [ROOT.Char.GetLadyLord]!\" Eu e meu grupo trocamos olhares duvidosos. \"Desertores de bandidos têm saqueado nossa vila há dias, eles levaram quase tudo!\"\n\n"
 tour_travel.3040.foreign:0 "Parece que a ordem do(a) [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetHolder.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] é negligente em comparação com a do(a) [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip]..."
 tour_travel.3040.liege:0 "Então, [ROOT.Char.GetTopLiege.GetTitledFirstName] não mantém a paz em..."
 tour_travel.3040.own:0 "É um lugar pequeno, mas a falta de lei em minhas terras não é boa."
 tour_travel.3040.realm:0 "Parece que as terras [Select_CString( ROOT.Char.GetLiege.IsFemale, 'da', 'do' )] [ROOT.Char.GetLiege.GetTitledFirstName] estão quase sem lei..."
 tour_travel.3040.t:0 "Uma Vila Desafortunada"
 tower_maneuver:0 "Torre"
 truth_of_it_skill_toast:0 "Você obtém um pouco de sabedoria"
 truth_of_it_sleuth_toast:0 "Você descobre a verdade"
 truth_of_it_stress_toast:0 "A compreensão escapa de você"
 wheelbarrow_maneuver:0 "Carriola"
