 activity_pilgrimage_host_desc:0 "$BULLET_WITH_TAB$Ganho de [piety_i|E][piety|E]\n$BULLET_WITH_TAB$Ganho de [legitimacy_i][legitimacy|E]\n$BULLET_WITH_TAB$[stress_loss_i][stress_loss|E]\n[GetPlayer.Custom('GetPilgrimOrHajjiTrait')]"
