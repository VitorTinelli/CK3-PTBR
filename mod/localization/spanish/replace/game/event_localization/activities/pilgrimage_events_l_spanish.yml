 pilgrimage_pious_type_tt_very_positive:0 "Sua [GetActivityType('activity_pilgrimage').GetName] se torna #P muito Piedosa#!"
 pilgrimage_piousness_because_i_have_tenet_armed_pilgrimages:0 "Porque a sua [faith|E] possui o [core_tenet|E] de [GetFaithDoctrine('tenet_armed_pilgrimages').GetBaseName]:\n$EFFECT_LIST_BULLET$$pilgrimage_pious_type_tt_positive$\n"
 pilgrimage_piousness_because_i_have_tenet_struggle_submission:0 "Porque a sua [faith|E] possui o [core_tenet|E] de [GetFaithDoctrine('tenet_struggle_submission').GetBaseName]:\n$EFFECT_LIST_BULLET$$pilgrimage_pious_type_tt_positive$\n"
 pilgrimage_piousness_because_i_have_tenet_warmonger:0 "Porque a sua [faith|E] possui o [core_tenet|E] de [GetFaithDoctrine('tenet_warmonger').GetBaseName]:\n$EFFECT_LIST_BULLET$$pilgrimage_pious_type_tt_positive$\n"
 pilgrimage_pomp_appropriate:0 "Apropriada"
 pilgrimage_pomp_appropriate_desc:0 "$EFFECT_LIST_BULLET$ Traga guarda-costas ou bons cavaleiros, e talvez um amigo\n$EFFECT_LIST_BULLET$ Até [EmptyScope.ScriptValue('pilgrimage_entourage_pomp_appropriate_max_value')] peregrinos aleatórios se juntam ao seu grupo\n$EFFECT_LIST_BULLET$ Recompensas de [piety|E] na conclusão não são afetadas\n\n#weak As estradas são perigosas e a jornada é longa. A pureza espiritual é uma coisa, agir imprudentemente é outra!#"
 pilgrimage_pomp_ceremonial:0 "Cerimonial"
 pilgrimage_pomp_ceremonial_desc:0 "$EFFECT_LIST_BULLET$ Você #EMP também#! traz acompanhantes e seguidores piedosos\n$EFFECT_LIST_BULLET$ Até [EmptyScope.ScriptValue('pilgrimage_entourage_pomp_ceremonial_max_value')] peregrinos aleatórios se juntam ao seu grupo\n$EFFECT_LIST_BULLET$ Mais [piety|E] é ganha na conclusão\n\n#weak A fé exige formalidade, mesmo longe de casa. E como podemos ser formais sem seguidores?#!"
 pilgrimage_pomp_humble:0 "Humilde"
 pilgrimage_pomp_humble_desc:0 "$EFFECT_LIST_BULLET$ Não traga ninguém da sua [court|E], tornando a [travel|E] perigosa\n$EFFECT_LIST_BULLET$ Você se junta a um grupo de [EmptyScope.ScriptValue('pilgrimage_entourage_pomp_humble_max_value')] peregrinos aleatórios\n$EFFECT_LIST_BULLET$ Mais [piety|E] ganha na conclusão\n\n#weak A peregrinação é um momento de reflexão silenciosa. Um grupo de peregrinos com estranhos é o melhor lugar para isso!#"
 pilgrimage_pomp_throng:0 "Multidão"
 pilgrimage_pomp_throng_desc:0 "$EFFECT_LIST_BULLET$ Todos os [character|E] interessados na [court|E] juntam-se a você\n$EFFECT_LIST_BULLET$ Até [EmptyScope.ScriptValue('pilgrimage_entourage_pomp_throng_max_value')] peregrinos aleatórios se juntam ao seu grupo\n$EFFECT_LIST_BULLET$ Muito mais [piety|E] é ganha na conclusão\n\n#weak Todos os fiéis devem ver nossos lugares sagrados... e eu pretendo ajudá-los.#!"
 pilgrimage_random_pilgrim_tt:0 "Um peregrino aleatório morrerá, afetando qualquer membro da [family|E]"
 pilgrimage_recruited_courtier_log:0 "[CHARACTER.GetShortUIName|U] recrutou o habilidoso [TARGET_CHARACTER.GetShortUIName] para se juntar à sua corte."
 pilgrimage_recruited_courtier_log_title:0 "Recrutou Cortesão"
 pilgrimage_repented_log:0 "[CHARACTER.GetShortUIName|U] arrependeu-se de seu comportamento pecaminoso"
 pilgrimage_repented_log_title:0 "Arrependimento"
 pilgrimage_robbed_log:0 "[CHARACTER.GetShortUIName|U] foi roubado ao seguir um guia local não tão confiável"
 pilgrimage_robbed_log_title:0 "Roubado"
 pilgrimage_seasia.100.a:0 "Espíritos se comunicam com esta criança, devo cuidar [pearl_diver_child.GetHerHim]."
 pilgrimage_seasia.100.b:0 "Isto é um presságio de [ROOT.Char.GetFaith.HighGodName]!"
 pilgrimage_seasia.100.c:0 "Um belo enfeite, obrigado, criança."
 pilgrimage_seasia.100.desc:0 "Enquanto nosso [Glossary( 'djong', 'DJONG_GLOSS' )] contorna a borda de [background_terrain_scope.GetName], decidimos parar por um tempo na costa [background_terrain_scope.Custom('TerrainTypeProvincePrefix')] de [background_terrain_scope.Custom('TerrainTypeProvince')].\n\nUma figura solitária emerge das águas, uma criança.\n\n\"O espírito de uma ostra gigante me disse para oferecer seu tesouro como presente para [ROOT.Char.GetTitleAsName] que espera acima.\" A criança estende sua mão, uma pérola repousando nela."
 pilgrimage_seasia.100.t:0 "$pilgrimage_header$ O Mergulhador de Pérolas"
 pilgrimage_seasia.1000.a:0 "[local_character.GetFaith.HighGodName] nos aceitará?"
 pilgrimage_seasia.1000.b:0 "[local_character.GetFaith.HighGodName]? Deixe-me explicar a divindade de [ROOT.Char.GetFaith.HighGodName]."
 pilgrimage_seasia.1000.c:0 "Vocês podem construir um [local_character.GetFaith.HouseOfWorship] em [mosque_location.GetNameNoTooltip]."
 pilgrimage_seasia.1000.d:0 "Feche alguns acordos e siga viagem."
 pilgrimage_seasia.1000.desc:0 "Enquanto navegamos por [background_terrain_scope.GetNameNoTooltip], uma imponente embarcação mercante corta os [Glossary('sampans', 'SAMPAN_GLOSS')] e se aproxima. Um[Select_CString( local_character.IsFemale, 'a', '' )] [local_character.GetWomanMan] ricamente vestid[Select_CString( local_character.IsFemale, 'a', 'o' )], aparentemente de [Glossary('Tanah Makkah', 'TANAH_MAKKAH_GLOSS')], sobe a bordo.\n\n\"Saudações, [ROOT.Char.GetTitleAsNameNoTooltip], sou [Select_CString( local_character.IsFemale, 'a', 'o' )] [local_character.GetFirstNameNicknamed], vindo de [merchant_home.GetNameNoTier]\" [local_character.GetSheHe] se curva. \"Somos comerciantes [local_character.GetFaith.GetReligion.GetAdherentName] procurando um porto para construir um [local_character.GetFaith.HouseOfWorship].\"\n\n\"Pagaremos generosamente, é claro.\""
 pilgrimage_seasia.1000.t:0 "$pilgrimage_header$ Comerciantes de Tanah Makkah"
 pilgrimage_seasia.1100.a:0 "Você pode se juntar a nós."
 pilgrimage_seasia.1100.b:0 "Conte à sua vila sobre minha piedade."
 pilgrimage_seasia.1100.c:0 "Heh. Deixe [local_character.GetSheHe] pendurad[Select_CString( local_character.IsFemale, 'a', 'o' )]."
 pilgrimage_seasia.1100.desc:0 "Enquanto caminhamos por uma trilha estreita através do [background_terrain_scope.Custom('TerrainTypeProvincePrefix')] [background_terrain_scope.Custom('TerrainTypeProvince')] de [background_terrain_scope.GetNameNoTooltip], uma voz chama lá de cima. Um[Select_CString( local_character.IsFemale, 'a', '' )] [local_character.GetWomanMan] balança de cabeça para baixo, pres[Select_CString( local_character.IsFemale, 'a', 'o' )] em uma armadilha de [Glossary('rattan', 'RATTAN_GLOSS')].\n\n\"Socorro! Pisei em uma armadilha de porco e preciso de um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.Custom('FormalComplimentAdjective')] salvador[Select_CString( ROOT.Char.IsFemale, 'a', '' )]!\" [local_character.GetSheHe] grita. \"Juro que sou um bom guia — me liberte e me juntarei a vocês!\""
 pilgrimage_seasia.1100.t:0 "$pilgrimage_header$ Laço de Rattan"
 pilgrimage_seasia.1200.a:0 "Se me contar sobre sua fé [local_character.GetFaith.GetAdjectiveNoTooltip]!"
 pilgrimage_seasia.1200.b:0 "Sim, se você abençoar meu [blessed_artifact.GetNameNoTooltip]?"
 pilgrimage_seasia.1200.c:0 "[other_barony.GetBaseNameNoTierNoTooltip] é o lugar mais sereno para meditação."
 pilgrimage_seasia.1200.desc:0 "Descendo por um caminho sinuoso, avistamos um [GetTrait('devoted').GetName( local_character )] acampado próximo a um [background_terrain_scope.Custom('GetRandomRegionalDangerSingular')] na [background_terrain_scope.Custom('TerrainTypeProvince')].\n\n\"Saudações, peregrinos\", diz suavemente [Select_CString( local_character.IsFemale, 'a', 'o' )] [local_character.GetWomanMan]. \"Sou um erudito [local_character.GetFaith.GetAdjective] da [GetBuilding('nalanda_university').GetName], buscando os lugares mais tranquilos em [exploration_target.GetBaseNameNoTier] para meditação. Poderiam compartilhar seu conhecimento sobre esta terra?\""
 pilgrimage_seasia.1200.t:0 "$pilgrimage_header$ Um Peregrino de Nalanda"
 pilgrimage_seasia.1300.a:0 "Vamos ficar e refletir um pouco."
 pilgrimage_seasia.1300.b:0 "Vamos sacrificar um pouco de arroz."
 pilgrimage_seasia.1300.c:0 "É bonito, mas devemos seguir."
 pilgrimage_seasia.1300.desc:0 "Após atravessar um [background_terrain_scope.Custom('GetRandomRegionalDangerSingular')], chegamos a uma visão rara — um lago iluminado, perfeitamente redondo. Sapos alinham-se às margens como pequenos monges, cantando em ritmo como se fosse um louvor.\n\nArroz, flores e [Glossary('folhas de betel', 'BETEL_LEAVES_GLOSS')] flutuam em sua superfície, sinais de uma oferenda feita."
 pilgrimage_seasia.1300.t:0 "$pilgrimage_header$ O Lago dos Sapos"
 pilgrimage_seasia.1400.a:0 "É [character_faith.CreatorName], o criador."
 pilgrimage_seasia.1400.b:0 "É [character_faith.WealthGodName], o avarento."
 pilgrimage_seasia.1400.c:0 "É [character_faith.WarGodName], o conquistador."
 pilgrimage_seasia.1400.d:0 "É [character_faith.HighGodName]! Fui chamado a [character_faith.GetNameNoTooltip]!"
 pilgrimage_seasia.1400.desc:0 "Enquanto marchamos pelo [background_terrain_scope.Custom('TerrainTypeProvince')] enevoado de [background_terrain_scope.GetName], uma enorme forma de pedra surge à frente — envolta em pano rasgado, entrelaçada com vinhas. Estou frente a frente com a cabeça de um deus [character_faith.GetReligion.GetAdherentName], seu olhar antigo penetrando em minha alma.\n\nQual deus é este... e eu fui #EMP destinado#! a encontrá-lo?"
 pilgrimage_seasia.1400.e:0 "É o deus das viagens, sem dúvida."
 pilgrimage_seasia.1400.t:0 "$pilgrimage_header$ O Rosto de um Deus"
 pilgrimage_seasia.1500.a:0 "Poderia usar alguém como você."
 pilgrimage_seasia.1500.b:0 "Você poderia abençoar o clima?"
 pilgrimage_seasia.1500.c:0 "Bobagem, o clima está apenas sendo caprichoso."
 pilgrimage_seasia.1500.desc:0 "Forçando nosso caminho pelo [background_terrain_scope.Custom('TerrainTypeProvince')] de [background_terrain_scope.GetName], vento e chuva açoitam nossos rostos como mil flechas. De repente, a tempestade se dissipa — o vento cessa, a chuva amolece e o sol aparece.\n\n\"Eu acalmei a tempestade quando vocês se aproximaram\", diz um[Select_CString( local_character.IsFemale, 'a', '' )] [local_character.GetWomanMan] com autoridade tranquila. \"Sou [Select_CString( local_character.IsFemale, 'a', 'o' )] [local_character.GetFirstNameNicknamed], um [Glossary('pawang', 'PAWANG_GLOSS')]. Eles me temem por estas partes.\""
 pilgrimage_seasia.1500.t:0 "$pilgrimage_header$ O Pawang"
 pilgrimage_seasia.200.a:0 "Peça ao pescador[Select_CString( local_character.IsFemale, 'a', '' )] para nos guiar."
 pilgrimage_seasia.200.b:0 "Jogue um pouco de arroz por cima do corrimão."
 pilgrimage_seasia.200.c:0 "Isto é assustador... vamos apressar-nos."
 pilgrimage_seasia.200.desc:0 "Enquanto observo a vista [background_terrain_scope.Custom('TerrainTypeProvincePrefix')] de [background_terrain_scope.GetName], sua costa é subitamente interrompida por um bosque de mangue.\n\nNosso [Glossary( 'djong', 'DJONG_GLOSS' )] desliza lentamente até um grupo de pequenos barcos, cujos pescadores lançam punhados de arroz na água lamacenta.\n\n\"Uma oferenda aos espíritos, [ROOT.Char.GetTitleAsName]\", diz um pescador[local_character.GetWomanMan]. \"Isso nos mantém protegidos do perigo.\""
 pilgrimage_seasia.200.t:0 "$pilgrimage_header$ Espíritos do Manguezal"
 pilgrimage_seasia.300.a:0 "Que esses ventos persistam!"
 pilgrimage_seasia.300.desc:0 "As ondas de [background_terrain_scope.GetName] quebram suavemente contra o casco do navio — um [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')] circula acima do mastro, aproveitando um vento que se torna cada vez mais favorável.\n\nA boa profecia que recebi se confirma. Chegaremos a [destination.GetName] em pouco tempo!"
 pilgrimage_seasia.300.t:0 "$pilgrimage_header$ Uma Boa Profecia"
 pilgrimage_seasia.400.a:0 "Conte-me a verdade sobre [local_character.GetFaith.GetNameNoTooltip]."
 pilgrimage_seasia.400.b:0 "Sábio, como se apresenta a jornada à frente?"
 pilgrimage_seasia.400.c:0 "Por favor, abençoe-nos."
 pilgrimage_seasia.400.desc:0 "À medida que a costa de [background_terrain_scope.GetName] surge à vista, também surge um grande barco transportando um santuário [local_character.GetFaith.GetAdjective] em seu convés. Ao nos aproximarmos, somos recebidos pelas figuras a bordo — [GetTrait('devoted').GetName( local_character )]s cegos, mãos fervorosamente unidas em oração.\n\n\"Vocês são bem-vindos aqui, [ROOT.Char.GetTitleAsName]\", diz o líder entre eles. \"Há alguma forma de podermos auxiliá-los, navegadores cansados?\""
 pilgrimage_seasia.400.t:0 "$pilgrimage_header$ Santuário Flutuante"
 pilgrimage_seasia.500.a:0 "Venham todos, e contemplem minha benevolência!"
 pilgrimage_seasia.500.b:0 "Dispersai, meus súditos, e falem a todos sobre [local_character.GetFaith.GetNameNoTooltip]."
 pilgrimage_seasia.500.c:0 "Juntem-se a mim, ó meus mais [local_character.Custom('RandomPositiveShallowAdjective')] súditos!"
 pilgrimage_seasia.500.d:0 "Vamos sair daqui rapidamente..."
 pilgrimage_seasia.500.desc:0 "As águas costeiras de [background_terrain_scope.GetName] estão cheias de pescadores, lançando [Glossary('jalas', 'JALA_GLOSS')] e puxando [Glossary('bubus', 'BUBU_GLOSS')]. Então, de repente — o caos irrompe!\n\n\"É [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]!\" ecoa a voz de um[Select_CString( local_character.IsFemale, 'a', '' )] [local_character.GetWomanMan]. \"Rápido, todos, devemos nos banhar em sua presença divina!\" Em instantes, nosso [Glossary( 'djong', 'DJONG_GLOSS' )] é cercado por barcos de pesca ávidos."
 pilgrimage_seasia.500.t:0 "$pilgrimage_header$ Os Pescadores de [background_terrain_scope.GetNameNoTooltip]"
 pilgrimage_seasia.600.a:0 "A cor do céu... um presságio?"
 pilgrimage_seasia.600.b:0 "Vamos apaziguar os espíritos juntos, amigo."
 pilgrimage_seasia.600.c:0 "Acho que vou jantar arroz hoje à noite."
 pilgrimage_seasia.600.desc:0 "Contemplo [background_terrain_scope.GetName] enquanto [Select_CString( entourage_character.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', entourage_character)], [entourage_character.GetFirstNameNicknamed], se inclina ao meu lado. [entourage_character.GetSheHe|U] lança um punhado de arroz ao mar.\n\n\"[Select_CString( root_scope.IsFemale, 'Minha', 'Meu' )] [entourage_character.Custom2('RelationToMeShort', root_scope)], o arroz não é para os peixes — mas para lembrar aos espíritos que somos convidados aqui.\" [entourage_character.GetSheHe|U] oferece-me o saquinho. \"Para uma viagem segura.\""
 pilgrimage_seasia.600.t:0 "$pilgrimage_header$ Uma Oferenda de Arroz"
 pilgrimage_seasia.700.a:0 "Sua sorte muda agora, você está comigo."
 pilgrimage_seasia.700.b:0 "Você está amaldiçoad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], e deve partir em breve."
 pilgrimage_seasia.700.desc:0 "Apesar da chuva turvar minha visão, avisto um[Select_CString( local_character.IsFemale, 'a', '' )] [local_character.GetWomanMan] agarrad[Select_CString( local_character.IsFemale, 'a', 'o' )] a um pedaço de madeira à deriva. Meus homens [Select_CString( local_character.IsFemale, 'a', 'o' )] puxam a bordo imediatamente.\n\n\"[ROOT.Char.Custom('ComplimentAdjective')|U] Salvador[Select_CString( ROOT.Char.IsFemale, 'a', '' )], devo-lhe minha vida!\" [local_character.GetSheHe] ofega. \"Meu [Glossary('sampan', 'SAMPAN_GLOSS')] foi arrastado por um perverso [Glossary('nāga', 'NAGA_GLOSS')], eu deveria ter sabido que não devia partir em um dia de azar...\""
 pilgrimage_seasia.700.t:0 "$pilgrimage_header$ A Vítima do Nāga"
 pilgrimage_seasia.800.a:0 "Um presságio benevolente, eles nos guiam?"
 pilgrimage_seasia.800.b:0 "Rápido, devemos fazer oferendas!"
 pilgrimage_seasia.800.c:0 "São peixes... peguem os arpões."
 pilgrimage_seasia.800.desc:0 "As águas cristalinas de [background_terrain_scope.GetNameNoTooltip] se agitam enquanto uma enorme sombra se move por baixo. Depois outra, e outra, até que parece que o [Glossary( 'djong', 'DJONG_GLOSS' )] está balançando com sua passagem.\n\nAperto meu arpão enquanto a tripulação começa a gritar. No tumulto, capturo uma palavra em pânico: #EMP \"[Glossary('nāgas!', 'NAGA_GLOSS')]\"#!"
 pilgrimage_seasia.800.t:0 "$pilgrimage_header$ Sombras na Água"
 pilgrimage_seasia.900.a:0 "Não temam, minha benevolência é grande."
 pilgrimage_seasia.900.b:0 "Vocês são soldados capazes, juntem-se a mim."
 pilgrimage_seasia.900.c:0 "[Select_CString( ROOT.Char.IsFemale, 'A', 'O' )] [ROOT.Char.GetTitleAsNameNoTooltip] exige passagem segura!"
 pilgrimage_seasia.900.desc:0 "Ao nos aproximarmos da costa de mangue de [background_terrain_scope.GetNameNoTooltip], [Glossary('sampans', 'SAMPAN_GLOSS')] surgem do esconderijo — piratas gritando e balançando ganchos de abordagem. Eles escalam o [Glossary( 'djong', 'DJONG_GLOSS' )] rapidamente, e eu me deparo com o líder deles.\n\n\"Entreguem seu ouro, cães bastardos, ou eu...\" [local_character.GetSheHe] congela, deixando cair seu [Glossary('pedang', 'PEDANG_GLOSS')]. \"Perdoe-nos, divin[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]! Não quisemos causar mal!\""
 pilgrimage_seasia.900.t:0 "$pilgrimage_header$ Piratas de Sampan"
 pilgrimage_the_calling_log:0 "[CHARACTER.GetShortUIName|U] permitiu que [TARGET_CHARACTER.GetShortUIName] ficasse para trás em [PROVINCE.GetNameNoTooltip] e cumprisse seu chamado religioso"
 pilgrimage_the_calling_log_title:0 "O Chamado"
 pilgrimage_theological_debate_log:0 "[CHARACTER.GetShortUIName|U] envolveu-se em uma disputa teológica com [TARGET_CHARACTER.GetShortUIName]"
 pilgrimage_theological_debate_log_title:0 "Disputa Teológica"
 pilgrimage_translator_log:0 "[CHARACTER.GetShortUIName|U] traduziu um monumento local para o benefício de seus companheiros peregrinos"
 pilgrimage_translator_log_title:0 "Tradutor"
 pilgrimage_type_hajj:0 "Hajj"
 pilgrimage_type_hajj_desc:0 "$EFFECT_LIST_BULLET$ Todos os muçulmanos capazes devem realizar o Hajj pelo menos uma vez\n$EFFECT_LIST_BULLET$ Outros tipos se tornam disponíveis após adquirir o [trait|E] [GetTrait('hajjaj').GetName(GetNullCharacter)]\n\n#weak Lembre-se: o Hajj não é uma obrigação, é uma oportunidade. Para submissão, humildade, perdão. Inshallah!#"
 pilgrimage_type_pious:0 "Peregrinação Piedosa"
 pilgrimage_type_pious_desc:0 "$EFFECT_LIST_BULLET$ Algumas opções de evento permitirão ações especialmente piedosas\n$EFFECT_LIST_BULLET$ Realizá-las aumentará a [piety|E] obtida na conclusão\n\n#weak O propósito da peregrinação é prestar seus respeitos ao divino, conectar-se verdadeiramente com a essência do seu espírito!#"
 pilgrimage_type_worldly:0 "Peregrinação Mundana"
 pilgrimage_type_worldly_desc:0 "$EFFECT_LIST_BULLET$ Algumas opções de evento permitirão ações de turismo\n$EFFECT_LIST_BULLET$ Realizá-las concederá um modificador multicultural em camadas na conclusão\n\n#weak Sentir o doce aroma do ar estrangeiro, decifrar as peculiaridades peculiares das línguas alienígenas... algo melhor existe?#"
 pilgrimage_worldly_type_tt_positive:0 "Sua [GetActivityType('activity_pilgrimage').GetName] se torna #P mais Mundana#!"
 pilgrimage_worldly_type_tt_very_positive:0 "Sua [GetActivityType('activity_pilgrimage').GetName] se torna #P muito Mundana#!"
 reflection_intent:0 "Reflexão"
 reflection_intent_desc:0 "Você adotou uma abordagem consciente para sua jornada e estará procurando oportunidades para aliviar o estresse."
 reflections_intent_header:0 "Reflexões:"
 two_entourage_members_die_tt:0 "Até dois membros do séquito podem morrer"
 two_entourage_members_wounded_tt:0 "Até dois membros do séquito podem ficar [GetTrait('wounded_1').GetName( GetNullCharacter )]"
 zealot_intent:0 "Zelo"
 zealot_intent_desc:0 "Você está firmemente convicto em suas crenças e estará procurando oportunidades para compartilhar sua convicção com os outros."
 zealotry_intent_header:0 "Zelo:"
 zealotry_intent_tt:0 "Você não possui a Intenção de Zealotismo"
