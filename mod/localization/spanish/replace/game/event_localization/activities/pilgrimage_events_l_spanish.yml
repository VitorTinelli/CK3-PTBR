 pilgrimage_fidelity_contemplative_desc:0 "$EFFECT_LIST_BULLET$ Velocidade de [travel|E] reduzida em #negative_value 50%#!\n$EFFECT_LIST_BULLET$ Você ganhará mais [piety|E] na conclusão\n\n#weak Se o propósito da peregrinação é a reflexão, então qual é o sentido de se apressar? A jornada é metade do ponto, afinal de contas!#"
