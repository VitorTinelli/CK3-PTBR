 activity_pilgrimage_province_desc:0 "Você inicia uma peregrinação para [ROOT.Province.GetName]\nA distância afeta o custo e as recompensas"
 activity_pilgrimage_province_desc_inspection_modifier:0 "\n#positive_value ++ Sítio Sagrado Protegido #!"
 activity_pilgrimage_province_extraordinarily_far_desc:0 "\n#positive_value +++ Extremamente Distante#!\n#negative_value --- Muito Caro#!\n\nCusto Adicional: [gold_i][SCOPE.ScriptValue('pilgrimage_length_cost_tier_7')|0]"
 activity_pilgrimage_province_intermediate_desc:0 "\n#positive_value ++ Distância Intermediária#!\n#negative_value -- Custo Intermediário#!\n\nCusto Adicional: [gold_i][SCOPE.ScriptValue('pilgrimage_length_cost_tier_3')|0]"
 activity_pilgrimage_province_long_mult_desc:0 "\n\n#bold Efeitos de hospedar uma [GetActivityType('activity_pilgrimage').GetName] aqui#!\n$BULLET_WITH_TAB$Recompensa da atividade [piety_i|E][piety|E]: #p +[EmptyScope.ScriptValue('long_pilgrimage_piety_multiplier')|0]%#!"
 activity_pilgrimage_province_medium_mult_desc:0 "\n\n#bold Efeitos de hospedar uma [GetActivityType('activity_pilgrimage').GetName] aqui#!\n$BULLET_WITH_TAB$Recompensa da atividade [piety_i|E][piety|E]: #p +[EmptyScope.ScriptValue('medium_pilgrimage_piety_multiplier')|0]%#!"
 activity_pilgrimage_province_pretty_short_desc:0 "\n#positive_value + Distância Curta#!\n#negative_value - Custo Ligeiramente Maior#!\n\nCusto Adicional: [gold_i][SCOPE.ScriptValue('pilgrimage_length_cost_tier_1')|0]"
 activity_pilgrimage_province_quite_far_desc:0 "\n#positive_value +++ Bastante Distante#!\n#negative_value --- Bastante Caro#!\n\nCusto Adicional: [gold_i][SCOPE.ScriptValue('pilgrimage_length_cost_tier_5')|0]"
 activity_pilgrimage_province_respectably_desc:0 "\n#positive_value ++ Distância Respeitável#!\n#negative_value -- Custo Alto#!\n\nCusto Adicional: [gold_i][SCOPE.ScriptValue('pilgrimage_length_cost_tier_4')|0]"
 activity_pilgrimage_province_short_desc:0 "\n#positive_value ++ Distância Moderada#!\n#negative_value -- Custo Ligeiramente Maior#!\n\nCusto Adicional: [gold_i][SCOPE.ScriptValue('pilgrimage_length_cost_tier_2')|0]"
 activity_pilgrimage_province_unique_desc:0 "\n#positive_value + Local Sagrado Único da [GetPlayer.GetFaith.GetReligion.GetAdjectiveNoTooltip]#!"
 activity_pilgrimage_province_unvisited_desc:0 "\n#positive_value + Local Sagrado Não Visitado#!"
 activity_pilgrimage_province_very_far_desc:0 "\n#positive_value +++ Muito Distante#!\n#negative_value --- Caro#!\n\nCusto Adicional: [gold_i][SCOPE.ScriptValue('pilgrimage_length_cost_tier_6')|0]"
 activity_pilgrimage_province_very_long_mult_desc:0 "\n\n#bold Efeitos de hospedar uma [GetActivityType('activity_pilgrimage').GetName] aqui#!\n$BULLET_WITH_TAB$Recompensa da atividade [piety_i|E][piety|E]: #p +[EmptyScope.ScriptValue('very_long_pilgrimage_piety_multiplier')|0]%#!"
 activity_pilgrimage_province_very_short_desc:0 "\n#positive_value + Distância Muito Curta#!\n\nCusto Adicional: Nenhum"
 activity_pilgrimage_selection_tooltip:0 "Realize uma [pilgrimage|E] para provar sua dedicação à [GetPlayer.GetFaith.PantheonTerm]\n\nRecompensas Antecipadas:\n$BULLET_WITH_TAB$Ganho de [piety_i] [piety|E]\n$BULLET_WITH_TAB$Ganho de [legitimacy_i] [legitimacy|E]\n$BULLET_WITH_TAB$[stress_loss_i] [stress_loss|E]"
 activity_window_character_pilgrim:0 "Peregrino\n[Character.GetShortUINameNoTooltip|U]"
 blessed_artifact_desc:0 "[blessed_artifact.GetDesc]\n\nEle brilha com uma aura imaculada após ser abençoado no Local Sagrado de [holy_site_scope.GetNameNoTooltip]."
 coastal_ruler_visit_travel_modifier:0 "Visita do Governante Costeiro"
 coastal_ruler_visit_travel_modifier_desc:0 "O governante deste Condado demonstrou benevolência à população costeira."
 cultural_acceptance_gain_worldly_pilgrimage:0 "Uma peregrinação mundana mudou a aceitação cultural."
 cultural_acceptance_rejected_pilgrims:0 "Peregrinos Rejeitados"
 every_family_member_tt:0 "Cada membro da família"
 every_province_faith_entourage_member_tt:0 "Cada membro do séquito [shrine_province.GetCounty.GetFaith.GetAdjective]"
 every_root_faith_entourage_member_tt:0 "Cada membro do séquito [shrine_visitor.GetFaith.GetAdjective]"
 every_zealous_root_faith_entourage_member_tt:0 "Cada membro do séquito [shrine_visitor.GetFaith.GetAdjective] e [GetTrait('zealous').GetName( GetNullCharacter )]"
 friend_prayed_against_trickster_spirits:0 "[CHARACTER.GetShortUIName|U] parou para fazer uma oração protetora contra um espírito trapaceiro por recomendação de [TARGET_CHARACTER.GetShortUINamePossessive]."
 friend_prayed_against_trickster_spirits_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] parou para fazer uma oração protetora contra um espírito trapaceiro por recomendação de [CHARACTER.GetShortUINamePossessive]."
 generic_cp_discount:0 "Redução Contratual"
 good_prophecy_travel_modifier:0 "Boa Profecia"
 good_prophecy_travel_modifier_desc:0 "A profecia que este personagem recebeu se confirmou, acelerando sua jornada."
 good_weather_modifier:0 "Bom Clima"
 good_weather_modifier_desc:0 "O bom clima abençoa este grupo."
 grateful_pilgrims_title:0 "Peregrinos Agradecidos"
 improved_artifact_tt:0 "[blessed_artifact.GetName] receberá um modificador aleatório"
 local_fishermen_modifier:0 "Pescadores Locais"
 local_fishermen_modifier_desc:0 "Este grupo de viagem é acompanhado por um grupo de pescadores locais."
 obligation_hook_salary:0 "Obrigações de Salário"
 obligation_hook_tt:0 "[hooks|E] de #EMP Obrigação#! reduzem os salários de [court_position|E] em [gold_i]#P -50%#!"
 one_entourage_members_die_tt:0 "Um membro do séquito pode morrer"
 one_entourage_members_wounded_tt:0 "Um membro do séquito pode ficar [GetTrait('wounded_1').GetName( GetNullCharacter )]"
 pilgrim.6820.b.flavor:0 "Tenho certeza de que já vi este livro antes..."
 pilgrim_guide_artifact:0 "O Guia do Peregrino"
 pilgrim_guide_artifact_desc:0 "Um livro que descreve as rotas mais seguras para um peregrino, bem como pontos de interesse no local sagrado."
 pilgrimage.0040.a:0 "Sou uma folha no rio."
 pilgrimage.0040.a_moved_capital:0 "Vamos em frente."
 pilgrimage.0040.desc:0 "E assim minha jornada espiritual chegou a um fim abrupto. Assim como a folha que cai no rio turbulento, só nos resta ver para onde as novas circunstâncias nos levam."
 pilgrimage.0040.desc_moved_capital:0 "Agora que minha capital é, de fato, a deslumbrante localização de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], não há muito sentido em continuar minha [GetActivityType('activity_pilgrimage').GetNameNoTooltip].\n\nDevo me concentrar em encerrar minha jornada lá e tentar a sorte em outro local sagrado."
 pilgrimage.0040.t:0 "$pilgrimage_header$ O Fim da Jornada"
 pilgrimage.0041.a.tt:0 "Sua [THIS.Char.GetInvolvedActivity.GetName] continuará"
 pilgrimage.0041.a:0 "Eu #EMP sou#! abençoado por [ROOT.Char.GetFaith.HighGodName]."
 pilgrimage.0041.b:0 "Não, isso é muito perigoso."
 pilgrimage.0041.desc:0 "Ai, a carne está me falhando. Mas o espírito é forte. Devo colocar minha vida nas mãos de [ROOT.Char.GetFaith.HealthGodName] e continuar minha jornada em direção a [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]?"
 pilgrimage.0041.t:0 "$pilgrimage.0040.t$?"
 pilgrimage.0042.a:0 "É o que [old_pilgrimage_host.GetSheHe] teria desejado."
 pilgrimage.0042.desc:0 "Nossa jornada foi interrompida e começaremos a voltar para [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] para dar o descanso final [Select_CString( old_pilgrimage_host.IsFemale, 'a', 'ao' )] [old_pilgrimage_host.GetTitledFirstName]."
 pilgrimage.0042.t:0 "$pilgrimage_header$ Um Enterro em Casa"
 pilgrimage.0500.a.flavor:0 "Se isso fará [pilgrimage_dying_relative.GetSheHe] descansar mais tranquilo."
 pilgrimage.0500.a.tt_pilgrimage:0 "Sua próxima [pilgrimage|E] será mais barata"
 pilgrimage.0500.a:0 "Sim, claro."
 pilgrimage.0500.b.flavor:0 "Eu realmente prefiro não fazer isso."
 pilgrimage.0500.b:0 "Estou ocupado demais como [ROOT.Char.GetWomanMan] ultimamente, [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('pilgrimage_dying_relative'))]."
 pilgrimage.0500.desc:0 "\"[first_holy_site.GetProvince.GetNameNoTooltip]. [second_holy_site.GetProvince.GetNameNoTooltip]. Ah, [second_holy_site.GetProvince.GetNameNoTooltip]...\", o frágil corpo [Select_CString( pilgrimage_dying_relative.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('pilgrimage_dying_relative'))] moribundo [Select_CString( pilgrimage_dying_relative.IsFemale, 'da', 'do' )] [pilgrimage_dying_relative.GetTitledFirstName] está deitado em sua cama, uma casca do que [pilgrimage_dying_relative.GetSheHe] era antes. Conforme me aproximo da cama, [pilgrimage_dying_relative.GetSheHe] tenta focar seu olhar em mim.\n\n\"[pilgrimage_dying_relative.Custom2('RelationToMe' , ROOT.Char)|U]... as coisas de que você se arrepende não são as coisas que você fez, mas as coisas que você deixou de fazer.\" Eu me inclino mais perto, e posso sentir o cheiro de deterioração na respiração [pilgrimage_dying_relative.GetHerHim], enquanto [pilgrimage_dying_relative.GetSheHe] continua: \"Não deixe as armadilhas diárias te afastarem do seu verdadeiro caminho para [ROOT.Char.GetFaith.HighGodName].\"\n\nUma expressão de dor cruza o rosto [pilgrimage_dying_relative.GetHerHim], e eu entendo que a conversa acabou."
 pilgrimage.0500.t:0 "Morte de um Peregrino"
 pilgrimage.1100.a.flavor:0 "Mantenha o rumo, timoneiro!"
 pilgrimage.1100.a:0 "[ROOT.Char.GetFaith.HighGodNameAlternate|U] nos guie!"
 pilgrimage.1100.alone:0 "A embarcação parece flutuar, intocada, acima das ondas violentas, seguramente guiada por uma força divina através da tempestade."
 pilgrimage.1100.b.flavor:0 "Deixe-me sentir o abraço de [ROOT.Char.GetFaith.random_DivineRealm]!"
 pilgrimage.1100.b.success.t:0 "Fogo Divino"
 pilgrimage.1100.b.wounded.t:0 "Ferido"
 pilgrimage.1100.b:0 "Eu subirei para encontrá-lo, [ROOT.Char.GetFaith.HighGodName]!"
 pilgrimage.1100.c.flavor:0 "Devemos esperar por essa rajada!"
 pilgrimage.1100.c:0 "[ROOT.Char.GetFaith.WaterGodName] exige um sacrifício!"
 pilgrimage.1100.companion:0 "\"Isso é um sinal!\" [Select_CString( panicked_pilgrim.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', panicked_pilgrim)] apavorado [panicked_pilgrim.GetTitledFirstName] grita, agarrando as cordas para não cair, mal audível acima das velas agitadas. \"Nós #EMP precisamos voltar! Antes que seja tarde demais!\"\n\n"
 pilgrimage.1100.d.flavor:0 "$pilgrimage.1100.c.flavor$"
 pilgrimage.1100.d:0 "Voltem atrás, seus tolos!"
 pilgrimage.1100.desc:0 "A tempestade no mar nos pega completamente de surpresa, enquanto o céu rasgado por raios começa a nos bombardear com chuva — e com um repentino clarão estrondoso, as pontas dos mastros se incendeiam em chamas azuis, envolvendo o navio em uma luz etérea.\n\n"
 pilgrimage.1100.failure:0 "A tempestade te desvia do curso"
 pilgrimage.1100.success:0 "Você é guiado em segurança"
 pilgrimage.1100.t.christian:0 "$pilgrimage_header$ Fogo de Santo Elmo"
 pilgrimage.1100.t.greek:0 "$pilgrimage_header$ A Chama da Helene"
 pilgrimage.1100.t.pagan:0 "$pilgrimage_header$ Chamas do [ROOT.Char.GetFaith.DivineRealm]"
 pilgrimage.1100.t:0 "$pilgrimage_header$ Chama Divina"
 pilgrimage.1110.a.beaten:0 "Por sua insolência, eles levam tudo"
 pilgrimage.1110.a.fled:0 "Os bandidos repensam a situação"
 pilgrimage.1110.a.skirmish:0 "Você consegue se defender da primeira onda"
 pilgrimage.1110.a:0 "Se você quer o meu ouro, venha e pegue."
 pilgrimage.1110.b.religion:0 "Venha [heathen_raider.Custom('SisterBrother')], ambos seguimos [ROOT.Char.GetFaith.HighGodName]."
 pilgrimage.1110.b.unreformed:0 "Venha, nunca é tarde para o [ROOT.Char.GetFaith.ReligiousText]."
 pilgrimage.1110.b:0 "Não há necessidade de violência, vamos conversar."
 pilgrimage.1110.c.failure:0 "O bandido não está impressionado"
 pilgrimage.1110.c.success:0 "Suas palavras soam verdadeiras"
 pilgrimage.1110.c:0 "Você está enganado, ouça as verdades [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]."
 pilgrimage.1110.d:0 "Pegue seu ouro, bandido."
 pilgrimage.1110.desc:0 "Ao cruzar as [heathen_raider_county.GetTerrainTypePlural] de [heathen_raider_county.GetNameNoTierNoTooltip], avistamos as bandeiras de um pequeno grupo, estampadas com o [heathen_raider.GetFaith.ReligiousSymbol] [heathen_raider.GetFaith.GetAdjective]. Eles são vagabundos desgarrados, atacando peregrinos em direção a [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName].\n\nO líder bloqueia rapidamente nosso caminho, erguendo seu cavalo e se apresentando como [heathen_raider.GetFirstName]."
 pilgrimage.1110.fallback:0 "\"Pare, [ROOT.Char.Custom2('GetUnbelieverTerm', heathen_raider)]. Eu, que mantenho a paz nessas estradas, exijo que você pague como todos os outros.\""
 pilgrimage.1110.shared_heathen_controlled:0 "\"Nossos [heathen_raider.GetFaith.HouseOfWorshipPlural] são maravilhosos de se ver, como você descobrirá assim que pagar suas dívidas.\""
 pilgrimage.1110.shared_target_controlled:0 "\"Seus [ROOT.Char.GetFaith.HouseOfWorshipPlural] ainda estarão aqui depois que você pagar nossa modesta taxa.\""
 pilgrimage.1110.shared_target_controlled_hajj:0 "\"Um pequeno pagamento para ver a Kaaba é tudo o que peço de seus [heathen_raider.Custom2('GetUnbelieverTermAdjective', ROOT.Char)] administradores [ROOT.Char.GetFaith.GetAdjective].\""
 pilgrimage.1110.shared_target_controlled_jerusalem:0 "\"Se você realmente deseja ver sua sagrada cidade almejada, minha pequena taxa não será um problema.\""
 pilgrimage.1110.shared_target_heathen:0 "\"Vocês, cães [ROOT.Char.GetFaith.GetAdjective], não sabem? [ROOT.Char.Custom2('GetUnbelieverTermPlural', heathen_raider)|U] devem oferecer tributo para ver os [heathen_raider.GetFaith.HouseOfWorshipPlural] sagrados.\""
 pilgrimage.1110.shared_target_heathen_hajj:0 "\"Pare, [ROOT.Char.Custom2('GetUnbelieverTerm', heathen_raider)]! Pelo [ROOT.Char.GetFaith.HighGodName], os [ROOT.Char.GetFaith.GetAdherentNamePlural] devem pagar a taxa da Kaaba.\""
 pilgrimage.1110.shared_target_heathen_jerusalem:0 "\"Não tema, [heathen_raider.Custom2('GetUnbelieverTermPlural', ROOT.Char)], as maravilhas de nossa cidade sagrada aguardam por você, por uma pequena taxa.\""
 pilgrimage.1110.t:0 "$pilgrimage_header$ Saqueadores [ROOT.Char.Custom2('GetUnbelieverTerm', heathen_raider)|U]"
 pilgrimage.1120.a:0 "Isso me dá uma ideia..."
 pilgrimage.1120.b:0 "Agora, isso é exatamente o que precisamos no [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
 pilgrimage.1120.c:0 "Que desculpa lamentável para um [ROOT.Char.GetFaith.HouseOfWorship]."
 pilgrimage.1120.d:0 "Sim, sim, já é o suficiente, obrigado."
 pilgrimage.1120.desc:0 "Passando pelo [temple_province.GetTitle.GetDeJureLiege.GetNameNoTooltip], aproveitamos a oportunidade para visitar o [ROOT.Char.GetFaith.HouseOfWorship] do [temple_province.GetName], um centro [temple_province.GetCounty.GetFaith.GetAdjective] de autoridade e culto.\n\n[temple_person.GetName], um [temple_person.GetFaith.PriestNeuter] local, nos guia pelos terrenos e edifícios. [temple_person.GetSheHe|U] nos conta a história e mostra as obras de arte produzidas pelos [temple_province.GetCounty.GetFaith.DevoteeNeuterPlural] locais, que agora estão reunidos em suas orações do meio-dia."
 pilgrimage.1120.e:0 "Vou me juntar em oração a [ROOT.Char.GetFaith.HighGodName]."
 pilgrimage.1120.f:0 "Agora, isso é exatamente o que precisamos no [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
 pilgrimage.1120.t:0 "$pilgrimage_header$ Arquitetura [temple_province.GetCounty.GetFaith.GetReligion.GetAdjectiveNoTooltip] do Templo"
 pilgrimage.1130.a:0 "Eu posso oferecer algo."
 pilgrimage.1130.b.flavor:0 "Mais útil para mim, afinal!"
 pilgrimage.1130.b:0 "Não vejo problema..."
 pilgrimage.1130.both:0 "\n\n[Select_CString( shrine_faithist.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', shrine_faithist)], [shrine_faithist.GetName] se curva diante do santuário enquanto [Select_CString( shrine_mocker.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', shrine_mocker)], [shrine_mocker.GetName], revirando os olhos, faz um 'tsk' audível."
 pilgrimage.1130.c.flavor:0 "Isso vai mostrar para eles!"
 pilgrimage.1130.c:0 "Derrubem essa tolice [shrine_province.GetCounty.GetFaith.GetAdjectiveNoTooltip]!"
 pilgrimage.1130.d.flavor:0 "Já que [shrine_faithist.GetFaith.HighGodName] não existe!"
 pilgrimage.1130.d:0 "[shrine_faithist.GetFaith.HighGodName] não vai conseguir isso, sabe."
 pilgrimage.1130.desc:0 "Em uma encruzilhada logo fora de [shrine_province.GetName], uma solitária capela [shrine_province.GetCounty.GetFaith.GetAdjective] marcada com um [shrine_province.GetCounty.GetFaith.ReligiousSymbol] está em meio às [shrine_province.Custom('GetProvinceGroundDesc')].\n\nUm nicho abriga oferendas humildes deixadas por viajantes e moradores locais, cercado pelos restos de inúmeras velas agora apagadas."
 pilgrimage.1130.e:0 "Mantenha sua língua quieta, [ROOT.Char.Custom2('GetUnbelieverTerm', shrine_mocker)]."
 pilgrimage.1130.f.other:0 "[ROOT.Char.GetFaith.HighGodName] não espera por nenhum [shrine_province.GetCounty.GetFaith.GetAdherentNameNoTooltip]."
 pilgrimage.1130.f:0 "Vamos, não vamos perder tempo."
 pilgrimage.1130.faithist:0 "\n\n[Select_CString( shrine_faithist.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', shrine_faithist)], [shrine_faithist.GetName], para para se curvar diante do santuário, adicionando seu próprio pequeno símbolo à coleção."
 pilgrimage.1130.mocker:0 "\n\n[Select_CString( shrine_mocker.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', shrine_mocker)], [shrine_mocker.GetName], zomba da visão disso, resmungando sobre a [shrine_mocker.GetFaith.NegativeAfterLife]."
 pilgrimage.1130.t:0 "$pilgrimage_header$ Capela de beira de estrada"
 pilgrimage.1140.a.tt:0 "[group_leader.GetFirstName] e mais três pessoas se juntarão à sua [ROOT.Char.GetInvolvedActivity.GetName]"
 pilgrimage.1140.a:0 "Quanto mais, melhor!"
 pilgrimage.1140.b.flavor:0 "Nunca confie em um [group_leader.GetCulture.GetNameNoTooltip]."
 pilgrimage.1140.b:0 "[group_leader.GetCulture.GetNameNoTooltip]? Fora de cogitação."
 pilgrimage.1140.c:0 "Tenha algumas moedas, pelos seus problemas."
 pilgrimage.1140.d.flavor:0 "Vá embora! Desapareça!"
 pilgrimage.1140.d:0 "De jeito nenhum, plebeu."
 pilgrimage.1140.desc:0 "Conforme seguimos nosso caminho por [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier], somos abordados por um plebeu [group_leader.GetCulture.GetName] que afirma ser o líder de um grupo de peregrinos [ROOT.Char.GetFaith.GetAdjective].\n\n\"Boa [ROOT.Char.GetTitleAsNameNoTooltip], estamos na estrada para [destination.GetName] há semanas, mas as estradas estão muito perigosas e agora estamos com poucos mantimentos.\"\n\n\"Ficaríamos eternamente gratos pelo seu apoio.\""
 pilgrimage.1140.t:0 "$pilgrimage_header$ Segurança em Números"
 pilgrimage.2002.a:0 "Eles não são #EMP todos#! tão maus assim."
 pilgrimage.2002.b:0 "Concordo, e não confiaria em ninguém que viesse em sua defesa!"
 pilgrimage.2002.c:0 "De fato! Eles cospem no rosto de [ROOT.Char.GetFaith.HighGodName]!"
 pilgrimage.2002.desc:0 "Entre meus companheiros de peregrinação, há um[Select_CString( heathen_hater.IsFemale, 'a', '' )] [heathen_hater.GetWomanMan] que prega compaixão e camaradagem - até que [heathen_hater.GetSheHe] chegue ao tópico dos [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')].\n\nUma noite ao redor da fogueira, [heathen_hater.GetSheHe] declara em voz alta que eles são \"monstros abomináveis aos olhos do [ROOT.Char.GetFaith.PantheonTerm]! Desviados e assassinos de crianças!\" A maioria das pessoas desvia o olhar quando [heathen_hater.GetSheHe] as olha. Hoje à noite, não fui rápido o suficiente. \"Você não concorda, ó [ROOT.Char.GetTitleAsNameNoTooltip]?\""
 pilgrimage.2002.t:0 "$pilgrimage_header$ Ame o Teu Próximo"
 pilgrimage.2003.a:0 "Devo contratar alguns deles para minha peregrinação."
 pilgrimage.2003.b:0 "[2002_local_warrior.GetTitledFirstNameNoTooltip] parece ser um espécime excelente."
 pilgrimage.2003.c:0 "Não. Tenho fé no [ROOT.Char.GetFaith.PantheonTerm]."
 pilgrimage.2003.desc:0 "Tenho sentido essa sensação incômoda há algum tempo. Minha peregrinação tem se mostrado mais perigosa do que eu esperava - ou talvez eu simplesmente não tenha passado por provações suficientes para me provar digno da proteção de [ROOT.Char.GetFaith.HighGodNameAlternate].\n\nNo entanto, #EMP tenho#! avistado algumas pessoas impressionantes no assentamento local de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] que certamente melhorariam a segurança da peregrinação - de maneira prática."
 pilgrimage.2003.t:0 "$pilgrimage_header$ Uma Questão de Segurança"
 pilgrimage.2004.a:0 "Fomos unidos pela [ROOT.Char.GetFaith.PantheonTerm]!"
 pilgrimage.2004.b:0 "Um encontro auspicioso, mas preciso rezar em solitude."
 pilgrimage.2004.desc:0 "À medida que me aproximo de [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip], encontro cada vez mais companheiros de peregrinação, vindos de todos os lugares.\n\nÉ um desses peregrinos que me reconhece de longe: \"[ROOT.Char.GetTitledFirstNameNoTooltip]?! É você?\"\n\nNada mais, nada menos que [potential_friend.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
 pilgrimage.2004.t:0 "$pilgrimage_header$ Um Encontro Inesperado"
 pilgrimage.2005.a.flavor:0 "Eu me sento perto do fogo."
 pilgrimage.2005.a:0 "\"Mesmo? Conte-me mais sobre esse [ROOT.Char.GetTitleAsNameNoTooltip].\""
 pilgrimage.2005.b:0 "\"Guardas! Tragam meu chicote.\""
 pilgrimage.2005.c:0 "Talvez seja hora de encontrar outros para viajar junto."
 pilgrimage.2005.desc:0 "Ao passar pelo acampamento, um peregrino de outro grupo conta uma história que [rude_pilgrim.GetSheHe] ouviu uma vez sobre o [ROOT.Char.GetTitleAsNameNoTooltip]"
 pilgrimage.2005.desc_close:0 "dessas terras,"
 pilgrimage.2005.desc_far:0 "de um lugar distante chamado [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip],"
 pilgrimage.2005.outro:0 "para risadas estrondosas.\n\nAo notar minha hesitação, o contador de histórias me tranquiliza: \"Não se preocupe, [ROOT.Char.Custom('FormOfAddressForLiege')] — com certeza essa história é sobre algum #EMP outr[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]#! [ROOT.Char.GetWomanMan] nobre importante!\""
 pilgrimage.2005.t:0 "$pilgrimage_header$ Uma História Rude"
 pilgrimage.2006.a:0 "Eu conheço o caminho para [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] como a palma da minha mão!"
 pilgrimage.2006.a_pious:0 "Deixaremos que [ROOT.Char.GetFaith.HighGodNameAlternate] guie o caminho."
 pilgrimage.2006.b:0 "Vamos aproveitar a criação de [ROOT.Char.GetFaith.CreatorName] por um pouco mais de tempo."
 pilgrimage.2006.b_cynical:0 "Não é o fim do mundo, suponho."
 pilgrimage.2006.c:0 "Acho que posso pedir informações aos moradores locais..."
 pilgrimage.2006.c_caravan_master:0 "Agora #EMP você#! vai ter que pedir informações."
 pilgrimage.2006.desc_alone:0 "Mantenho os olhos abertos, tentando reconhecer o caminho à frente - mas sem sucesso - e começo a ficar um pouco preocupado. Foi por #EMP este caminho, não foi...? Olho hesitante para um camponês local envolvido em tarefas um pouco mais à frente."
 pilgrimage.2006.desc_travel_leader:0 "Meu $travel_leader_court_position$ [caravan_master.GetTitledFirstName] está olhando ao redor, procurando freneticamente o caminho à frente, e as pessoas estão começando a notar.\n\nO rosto [Select_CString( caravan_master.IsFemale, 'da', 'do' )] [caravan_master.GetTitledFirstNameNoTooltip] assume um tom cinza enquanto [caravan_master.GetSheHe] vira o olhar para mim, em busca de respostas sobre o que fazer em seguida."
 pilgrimage.2006.intro:0 "A jornada espiritual foi interrompida literalmente."
 pilgrimage.2006.t:0 "$pilgrimage_header$ O Caminho Pitoresco"
 pilgrimage.2008.a.tt:0 "Viajar enquanto [GetTrait('ill').GetName( GetPlayer )] apresenta maiores riscos à saúde"
 pilgrimage.2008.a:0 "Se esta for a vontade de [ROOT.Char.GetFaith.HighGodNameAlternate]."
 pilgrimage.2008.court_physician:0 "[traveling_court_physician.GetTitledFirstNameNoTooltip|U], prepare algo para mim."
 pilgrimage.2008.desc:0 "Parece que não me adaptei bem a toda essa viagem. Talvez seja por causa das terras estranhas, cheias de ar desconhecido, ou simplesmente porque não me dou bem com o clima local.\n\nDe qualquer forma, minha tosse tem sido persistente por semanas, e esta manhã mal consegui reunir forças para sair da cama."
 pilgrimage.2008.t:0 "$pilgrimage_header$ Doença"
 pilgrimage.2008.whole_of_body:0 "Ah, essa pequena tosse passará rapidamente."
 pilgrimage.2009.a.tt:0 "Viajar enquanto [GetTrait('pneumonic').GetName( GetPlayer )] apresenta perigosos riscos à saúde"
 pilgrimage.2009.a:0 "Que [ROOT.Char.GetFaith.HighGodNameAlternate] tenha misericórdia."
 pilgrimage.2009.desc:0 "A jornada não está fazendo bem para minha saúde. Minha condição não melhorou durante minha busca pela graça de [ROOT.Char.GetFaith.PantheonTerm]. Piorou muito, muito mesmo. Não me lembro mais como é respirar sem luta."
 pilgrimage.2009.t:0 "$pilgrimage_header$ Tosse Raspante"
 pilgrimage.2010.a.tt:0 "Você entra na tenda"
 pilgrimage.2010.a:0 "Estou bastante curioso..."
 pilgrimage.2010.b:0 "Não, obrigado, tudo isso cheira a heresia para mim!"
 pilgrimage.2010.desc:0 "[2010_mystic.GetTitledFirstName] é uma das pessoas mais estranhas que conheci nessa jornada. [2010_mystic.GetSheHe|U] parece ser uma firme crente, mas também expõe a verdadeira natureza de [ROOT.Char.GetFaith.HighGodName] e o que tudo isso significa. À noite, a tenda [2010_mystic.GetHerHim] é iluminada pelas velas em seu interior, e ocasionalmente se ouvem cantos estranhos e incenso incomum.\n\nEstou completamente despreparado quando [2010_mystic.GetFirstNameNoTooltip] me convida a entrar."
 pilgrimage.2010.t:0 "$pilgrimage_header$ O Místico"
 pilgrimage.2011.a.tt:0 "Você experimenta o êxtase da divindade"
 pilgrimage.2011.a:0 "Sim! Sinto minha conexão com [ROOT.Char.GetFaith.HighGodNameAlternate]!"
 pilgrimage.2011.b.tt:0 "Você tem um agradável cochilo"
 pilgrimage.2011.b:0 "Estou tão confortável que posso até adormecer..."
 pilgrimage.2011.c.tt:0 "Você engaja o místico em debate"
 pilgrimage.2011.c:0 "Diga-me, como isso tem a ver com [ROOT.Char.GetFaith.HighGodName]?"
 pilgrimage.2011.desc:0 "Dentro da tenda [Select_CString( 2010_mystic.IsFemale, 'da', 'do' )] [2010_mystic.GetTitledFirstName], sou recebido por odores fortes e um ar quente e pesado que me envolve. \"É importante que direcionemos nosso olhar para dentro de nós mesmos\", explica [2010_mystic.GetSheHe] e se senta.\n\n\"Quero que você feche os olhos e se concentre, como eu faço. Deixe [ROOT.Char.GetFaith.PantheonTerm] fluir através de você. Busque o êxtase da divindade!\""
 pilgrimage.2012.a:0 "[2010_mystic.GetSheHe|U] tinha muitas ideias estranhas."
 pilgrimage.2012.desc:0 "Não consigo me lembrar exatamente do que aconteceu depois que entrei na tenda do místico. Tudo o que consigo recordar são imagens vagas e uma sensação de confusão.\n\nAgora me pergunto se [2010_mystic.GetSheHe] esteve realmente aqui..."
 pilgrimage.2013.a:0 "Eu era cego antes, e agora vejo."
 pilgrimage.2013.desc:0 "Após seguir as instruções [Select_CString( 2010_mystic.IsFemale, 'da', 'do' )] [2010_mystic.GetTitledFirstName], tudo fica mais claro para mim. Posso #EMP sentir#! isso. [ROOT.Char.GetFaith.PantheonTerm|U], o mundo, tudo está fluindo através do meu corpo. Da minha alma.\n\nQuando saio da tenda horas depois, tenho um novo entendimento de mim mesmo e da vida."
 pilgrimage.2014.a:0 "Por que minha bolsa parece estranhamente leve?"
 pilgrimage.2014.a_restful:0 "Foi um bom descanso."
 pilgrimage.2014.desc:0 "Quando acordo depois de adormecer na tenda [Select_CString( 2010_mystic.IsFemale, 'da', 'do' )] [2010_mystic.GetTitledFirstName], a tenda simplesmente desapareceu. Meus serviçais estão me acordando do colchonete em que adormeci, mas não há nenhum vestígio do místico.\n\nPelo menos o sono foi revigorante!"
 pilgrimage.2014.pilfered.desc:0 "Alguém mexeu em seus pertences"
 pilgrimage.2014.pilfered.t:0 "Roubado"
 pilgrimage.2014.restful.desc:0 "Você dormiu tranquilo e seguro"
 pilgrimage.2014.restful.t:0 "Bem Descansado"
 pilgrimage.2015.a:0 "Como #EMP é possível#! se aproximar de [ROOT.Char.GetFaith.PantheonTerm]?"
 pilgrimage.2015.desc:0 "Para ser honesto, eu nunca esperava que [Select_CString( 2010_mystic.IsFemale, 'a', 'o' )] [2010_mystic.GetTitledFirstName] pudesse explicar as práticas estranhas [2010_mystic.GetHerHim] tão bem quanto [2010_mystic.GetSheHe] fez.\n\nAinda estou desconfiado... seja lá o que [2010_mystic.GetSheHe] esteja tramando, mas certamente adquiri algumas perspectivas novas para considerar!"
 pilgrimage.2015.learning.desc:0 "Você aprende algo ao debater com o místico"
 pilgrimage.2015.learning.t:0 "Aumento do Conhecimento"
 pilgrimage.2015.piety.desc:0 "Você ganha piedade ao debater suas crenças"
 pilgrimage.2015.piety.t:0 "Aumento da Piedade"
 pilgrimage.2020.a.flavor:0 "[thief_to_convert.GetSheHe|U] é claramente uma criatura infeliz."
 pilgrimage.2020.a:0 "Você deveria se juntar a nós em [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]."
 pilgrimage.2020.a_child:0 "Sente-se junto ao fogo, pequeno."
 pilgrimage.2020.b.failure.desc:0 "Você não consegue convencer a criança"
 pilgrimage.2020.b.failure.t:0 "Os Ladrões Fogem"
 pilgrimage.2020.b.success.desc:0 "Você convence a criança"
 pilgrimage.2020.b.success.tt:0 "A criança precisará de mais orientação"
 pilgrimage.2020.b:0 "Essa não é a vida que [ROOT.Char.GetFaith.HighGodName] deseja para você."
 pilgrimage.2020.c.flavor:0 "Quem sou eu para interferir nos planos de [ROOT.Char.GetFaith.HighGodName]."
 pilgrimage.2020.c:0 "Todos nós fazemos o que precisamos fazer."
 pilgrimage.2020.c_cynical:0 "Então é essa a vontade de [ROOT.Char.GetFaith.HighGodName]?"
 pilgrimage.2020.desc:0 "Acordo de meu sono quando alguém no acampamento derruba uma panela de ferro. Quando olho ao redor, parece que dois indivíduos vestidos como peregrinos estavam revirando nossos suprimentos em busca de objetos de valor para roubar."
 pilgrimage.2020.desc_adult:0 "\n\nUm deles me vê se mexendo e fica imóvel, enquanto o outro ladrão se vira e foge."
 pilgrimage.2020.desc_child:0 "\n\nO menor dos dois, uma criança abatida pelo que parece, me vê se mexendo e fica imóvel, enquanto o outro ladrão se vira e foge."
 pilgrimage.2020.t:0 "$pilgrimage_header$ Ladrões"
 pilgrimage.2021.a:0 "Espalhe a palavra de [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]."
 pilgrimage.2021.b:0 "Me punir sempre me faz #EMP sentir melhor..."
 pilgrimage.2021.c.flavor:0 "[thief_to_convert.GetSheHe|U] trabalhará para se redimir de #EMP seus#! pecados."
 pilgrimage.2021.c:0 "Trabalho duro resolve tudo."
 pilgrimage.2021.desc:0 "Consegui convencer [Select_CString( thief_to_convert.IsFemale, 'a', 'o' )] [thief_to_convert.GetTitledFirstName] a mudar de vida. [thief_to_convert.GetSheHe|U] fica diante de mim, o peso da vergonha fazendo seus ombros se curvarem, enquanto [thief_to_convert.GetSheHe] evita o meu olhar.\n\n\"Não foi minha escolha, essa vida\", diz [thief_to_convert.GetFirstNameNoTooltip] lentamente. \"O que devo fazer para me arrepender dos meus pecados?\""
 pilgrimage.2021.t:0 "$pilgrimage_header$ Arrependimento"
 pilgrimage.2030.a.flavor:0 "O divino pode ter criado a chuva, mas os arco-íris são, antes de tudo, fenômenos climáticos."
 pilgrimage.2030.a:0 "#EMP Na verdade...#!"
 pilgrimage.2030.b.flavor:0 "Certamente algo tão belo #EMP deve#! ser divino!"
 pilgrimage.2030.b:0 "Sim! Sinto a presença de [ROOT.Char.GetFaith.HighGodName]!"
 pilgrimage.2030.c:0 "Fascinante como a natureza e o divino trabalham juntos."
 pilgrimage.2030.d:0 "É realmente impressionante, eu acho."
 pilgrimage.2030.desc:0 "Atravessando o mar em direção ao nosso destino em [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip], estou constantemente maravilhado com sua imensidão e os caprichos [ROOT.Char.Custom('GetWickedDangerous')] que ele apresenta.\n\nTendo enfrentado uma tempestade na noite anterior, esta manhã somos recebidos por um magnífico arco-íris, que se estende de horizonte a horizonte.\n\nOuço alguns dos outros peregrinos também contemplando sua grandiosidade, chamando a visão de #EMP divina#! e #EMP um sinal de [ROOT.Char.GetFaith.HighGodName]#!."
 pilgrimage.2030.t:0 "$pilgrimage_header$ Fenômenos Climáticos"
 pilgrimage.2040.a.flavor:0 "Ser um pescador é um ofício nobre e rústico, afinal de contas."
 pilgrimage.2040.a.less_success.desc:0 "Você pega um peixe pequeno"
 pilgrimage.2040.a.less_success.t:0 "Peixe Pequeno"
 pilgrimage.2040.a.success.desc:0 "Você pega um peixe grande"
 pilgrimage.2040.a.success.t:0 "Peixe Grande"
 pilgrimage.2040.a:0 "Vou me juntar!"
 pilgrimage.2040.b:0 "#EMP Filisteus.#! Eu deveria passar meu tempo orando em vez disso."
 pilgrimage.2040.c:0 "Que tal uma soneca?"
 pilgrimage.2040.d:0 "Não, vamos fazer algo diferente."
 pilgrimage.2040.desc:0 "Enquanto passamos nossos dias e noites neste navio, tento ocupar meu tempo com conversas interessantes, orações, contemplando a jornada ou simplesmente planejando minha viagem adiante.\n\nNo entanto, recentemente tenho visto alguns dos peregrinos da minha comitiva gastarem seu tempo em outra atividade bastante mundana - pescar.\n\nTodos eles parecem bem despreocupados e a própria atividade tem um aspecto reconfortante."
 pilgrimage.2040.t:0 "$pilgrimage_header$ Pescaria"
 pilgrimage.2050.a.tt:0 "Você deixa os peregrinos na costa mais próxima"
 pilgrimage.2050.a:0 "Subam a bordo!"
 pilgrimage.2050.b.failure.desc:0 "Os peregrinos não são convencidos, mas você os ajuda a chegar à costa"
 pilgrimage.2050.b.failure.t:0 "Não Convencidos"
 pilgrimage.2050.b.success.desc:0 "Você converte os peregrinos para o [ROOT.Char.GetFaith.GetNameNoTooltip]"
 pilgrimage.2050.b.success.t:0 "Conversão"
 pilgrimage.2050.b:0 "Você já ouviu falar da graça de [ROOT.Char.GetFaith.HighGodName]?"
 pilgrimage.2050.c:0 "Vamos simplesmente... seguir em frente."
 pilgrimage.2050.desc:0 "Logo antes do anoitecer, ouvimos os gritos de socorro e, ao olhar pela amurada para o vasto corpo de água, percebo um pequeno barco com três formas humanas.\n\nEles parecem estar à deriva pelo mar, indo sem rumo para onde as ondas os levam.\n\nTento identificar quem eles podem ser e, com meu conhecimento limitado, parecem ser náufragos... [first_pilgrim.GetCulture.GetCollectiveNounNoTooltip]? O que eles estariam fazendo por aqui?"
 pilgrimage.2050.t:0 "$pilgrimage_header$ Náufragos"
 pilgrimage.2060.a:0 "Finalmente, algum entretenimento."
 pilgrimage.2060.b.catholic:0 "\"Deixem os contos pela Ave-Maria.\""
 pilgrimage.2060.b:0 "\"Troquem os contos por preces.\""
 pilgrimage.2060.c:0 "Os assuntos da plebe me são indiferentes."
 pilgrimage.2060.desc.fallback:0 "Foi nestas terras que um/uma [ROOT.Char.Custom('RegionalMythicalCreature')] foi visto(a) frequentemente, há muito tempo...\""
 pilgrimage.2060.desc.intro:0 "Cercado(a) por viajantes, meu/minha [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('pilgrim'))], [pilgrim.GetFirstName], afasta [pilgrim.GetHerHis] [pilgrim.Custom('GetLocalStreetFood')] antes de falar:\n\n\"Parece-me que não há melhor momento para contar uma história do que uma noite em uma estalagem."
 pilgrimage.2060.desc.memory:0 "Não faz muito tempo que [memory.GetDescription]...\""
 pilgrimage.2060.t:0 "$pilgrimage_header$ Os Contos de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 pilgrimage.2070.a:0 "\"Suas superstições são uma afronta a [ROOT.Char.GetFaith.HighGodName].\""
 pilgrimage.2070.b:0 "\"Muito bem.\""
 pilgrimage.2070.c:0 "\"Devemos nos apressar.\""
 pilgrimage.2070.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" meu/minha [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('pilgrim'))] [pilgrim.GetFirstName] me chama com as bochechas coradas.\n\n\"Sabe-se que um/uma [ROOT.Char.GetCurrentLocation.Custom('GetProvinceTricksterSpirit')] se esconde nestes/nestas [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')]. Devemos fazer uma prece antes de continuarmos para proteger nossa comitiva de sua intenção maliciosa!\""
 pilgrimage.2070.t:0 "$pilgrimage_header$ O Espírito de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 pilgrimage.2101.a:0 "Apenas uma noite de conforto..."
 pilgrimage.2101.b:0 "Por que me limitar a #EMP um#! bordel?"
 pilgrimage.2101.c:0 "Devo permanecer forte e focar em minha peregrinação!"
 pilgrimage.2101.desc.lust_neutral:0 "Esse sentimento irritante é um incômodo do qual devo me livrar! Mas é claro, não sem riscos. Essas terras são diferentes de minha casa, e posso ser aproveitado neste momento de fraqueza."
 pilgrimage.2101.desc.lust_vice:0 "\n\n[ROOT.Char.GetFaith.HighGodName], eu sei que esse sentimento é pecado! Por que você precisa me testar tão severamente? Minha peregrinação não é suficiente para provar minha devoção?"
 pilgrimage.2101.desc.lust_virtue:0 "\n\nCertamente isso deve ser parte das provações de [ROOT.Char.GetFaith.HighGodName]! Será que consigo permanecer virtuoso sem me tornar vítima dos possíveis inimigos da fé durante a peregrinação?"
 pilgrimage.2101.desc:0 "Quanto tempo faz desde que senti o calor de outra pessoa contra minha pele? Esta peregrinação me afastou muito de minha casa, assim como de minhas comodidades.\n\nAh, como anseio pelos desejos da carne. Essas fantasias não param de inundar minha mente, e sinto-me tentado a ceder aos meus desejos para poder me concentrar."
 pilgrimage.2101.t:0 "$pilgrimage_header$ Desejos Íntimos"
 pilgrimage.2501.a.sin:0 "Não consigo dizer não!"
 pilgrimage.2501.a.virtue:0 "Em nome de [ROOT.Char.GetFaith.HighGodName], acho que você pode levar essas moedas..."
 pilgrimage.2501.b:0 "Bah! Arranje um emprego de verdade, ganhe seu sustento!"
 pilgrimage.2501.c.arrogant:0 "Você ousa tocar em minha roupa, camponês?!"
 pilgrimage.2501.desc.opening:0 "Enquanto meu séquito viaja por uma pequena cidade, sinto um puxão na barra de minha roupa. Ao me virar para olhar, vejo [Select_CString( beggar.IsFemale, 'uma', 'um' )] [beggar.GetWomanMan] [Select_CString( beggar.IsFemale, 'magra e esfarrapada', 'magro e esfarrapado' )], olhando para mim.\n\n\"Oh grande [ROOT.Char.GetLadyLord], suplico a você, poderia me dar algumas moedas como esmola? Estou [Select_CString( beggar.IsFemale, 'faminta', 'faminto' )], e nenhum dos moradores locais irá me ajudar.\""
 pilgrimage.2501.desc.sin.generous:0 "\n\nPor mais lamentável que o miserável pareça, lembro-me de que [ROOT.Char.GetFaith.PantheonTerm] considera a caridade como um [ROOT.Char.Custom('GetSinMisdeed')] grave..."
 pilgrimage.2501.desc.virtue.compassionate:0 "\n\nEmbora eu seja indiferente ao sofrimento [beggar.GetHerHim], estar em peregrinação me lembra que a compaixão pelos menos afortunados é esperada de todos os devotos [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]..."
 pilgrimage.2501.desc.virtue.generous:0 "\n\nEmbora a generosidade não faça parte de minha natureza, estar em peregrinação me lembra que a caridade é esperada de todos os devotos [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]..."
 pilgrimage.2501.t:0 "$pilgrimage_header$ Mendigo Miserável"
 pilgrimage.2502.a:0 "Eh... sim. Está bem. Pelos remédios."
 pilgrimage.2502.b:0 "Não, não posso! Não é #EMP certo#!!"
 pilgrimage.2502.c.gave:0 "Não, fiz minha parte!"
 pilgrimage.2502.c.refused:0 "Eu disse #EMP não#! Agora vá embora!"
 pilgrimage.2502.desc.end:0 "Minha irmã está doente e precisa desesperadamente de remédios! Seu dinheiro poderia salvar a vida dela, por favor! Seríamos extremamente gratos a você!\""
 pilgrimage.2502.desc.gave:0 "\"Sim! Sim, obrigado [ROOT.Char.Custom('LadyLordWomanMan')], obrigad... [ROOT.Char.GetFaith.HighGodName], foi isso? Agradeça a eles também! Mas, oh [Select_CString( ROOT.Char.IsFemale, 'generosa', 'generoso' )] [ROOT.Char.Custom('LadyLordWomanMan')], se eu pudesse pedir por mais um favor?"
 pilgrimage.2502.desc.refused:0 "\"Não! Não, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom('LadyLordWomanMan')], tenha piedade!"
 pilgrimage.2502.t:0 "$pilgrimage.2501.t$"
 pilgrimage.2503.a:0 "Está bem. Sim. Nenhuma criança deve passar fome."
 pilgrimage.2503.b:0 "Acho que já dei o suficiente."
 pilgrimage.2503.desc:0 "\"Maravilhoso! Que ela se recupere de sua doença em breve. Mas se eu pudesse pedir apenas mais um favor? Minha irmã tem filhos, e bem, você sabe como as crianças são. Elas comem muito! Se você pudesse fornecer alguma comida para eles também...?\""
 pilgrimage.2503.t:0 "$pilgrimage.2501.t$"
 pilgrimage.2504.a.flavor:0 "Você deixaria o melhor para trás?"
 pilgrimage.2504.a:0 "Você se esqueceu, eu também dei isso."
 pilgrimage.2504.b:0 "Endividado comigo, você diz? Hmm..."
 pilgrimage.2504.c.sin:0 "Sim, sim, apenas por favor... vá embora."
 pilgrimage.2504.c.virtue:0 "De nada. Agora vá, com a bênção de [ROOT.Char.GetFaith.HighGodName]."
 pilgrimage.2504.desc:0 "Muitíssimo obrigado, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom('LadyLordWomanMan')]! Sou eternamente [Select_CString( beggar.IsFemale, 'grata', 'grato' )], pois estou em dívida com você por algo que nunca poderei retribuir!\n\nA generosidade de [ROOT.Char.GetFaith.HighGodName] é realmente grandiosa, cantarei os seus louvores até o fim dos meus dias!"
 pilgrimage.2504.t:0 "$pilgrimage.2501.t$"
 pilgrimage.2511.a:0 "Maldito seja tudo isso, vou ensinar uma lição para aquele(a) moleque!"
 pilgrimage.2511.b:0 "Inspire... expire..."
 pilgrimage.2511.c:0 "Tem #EMP que ter#! uma forma melhor de lidar com essa raiva."
 pilgrimage.2511.desc.start:0 "[ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] atrai peregrinos de todo o mundo [ROOT.Char.GetFaith.GetAdjectiveNoTooltip], então não é inconcebível que eu me depare com [lordling.Custom2('MyCharacterIntroduction', ROOT.Char)] em minha jornada.\n\nO que #EMP é#! inconcebível é a forma insolente como [lordling.GetSheHe] me tratou, cortando minha comitiva com seu cavalo e me chamando de [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('lordling'))]... #EMP em minha cara#!, nada menos!"
 pilgrimage.2511.desc.vengeful.christian:0 "\n\nSão momentos como este que me lembram que Jesus nos ordenou virar a outra face..."
 pilgrimage.2511.desc.vengeful:0 "\n\nSão momentos como este que me lembram que [ROOT.Char.GetFaith.PantheonTerm] nos ordena perdoar aqueles que nos prejudicaram."
 pilgrimage.2511.desc.wrathful:0 "\n\nMeu sangue ferve, controlado apenas pelo conhecimento de que os [ROOT.Char.GetFaith.PriestNeuterPlural] nos dizem para exercer a contenção e não deixar nossas emoções tomar controle."
 pilgrimage.2511.t:0 "$pilgrimage_header$ Nobre Arrogante"
 pilgrimage.3001.a.tt:0 "$pilgrimage.2008.a.tt$"
 pilgrimage.3001.a:0 "O que é um pouco de chuva para um fiel [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]?"
 pilgrimage.3001.b:0 "Esqueça essa loucura, estarei em minha tenda."
 pilgrimage.3001.desc:0 "Mesmo estando em peregrinação, os padres ainda realizam a missa todos os domingos. Quando não há uma igreja por perto, ela é realizada ao ar livre. No entanto, logo cedo nesta manhã, uma tempestade se aproximou e não cessou.\n\nInabalável, um zeloso [ROOT.Char.Custom('DefaultPriestTitle')] está em pé, sob uma chuva torrencial, pregando sobre a perseverança diante da adversidade. Apesar disso, o número de pessoas que ouvem seu sermão está rapidamente diminuindo, pois os devotos desencorajados procuram abrigo da chuva intensa."
 pilgrimage.3001.t:0 "$pilgrimage_header$ Lágrimas de [ROOT.Char.GetFaith.WaterGodName]"
 pilgrimage.3002.a:0 "[naked_preacher.GetSheHe|U] está com a ideia certa! Nunca me senti tão [Select_CString( ROOT.Char.IsFemale, 'próxima', 'próximo' )] de [ROOT.Char.GetFaith.HighGodName]!"
 pilgrimage.3002.b:0 "Herege! Tirem [naked_preacher.GetSheHe] de lá!"
 pilgrimage.3002.c.failure:0 "Você não consegue refutar os argumentos [Select_CString( naked_preacher.IsFemale, 'da pregadora', 'do pregador' )]"
 pilgrimage.3002.c.success.tt:0 "Você decide o que acontece em seguida"
 pilgrimage.3002.c.success:0 "Você convence [Select_CString( naked_preacher.IsFemale, 'a pregadora', 'o pregador' )] de sua loucura"
 pilgrimage.3002.c:0 "Desafie [naked_preacher.GetSheHe] para um debate teológico."
 pilgrimage.3002.d:0 "Ignorar [naked_preacher.GetSheHe] e continuar minha jornada."
 pilgrimage.3002.desc:0 "Enquanto meu grupo se prepara para desarmar o acampamento, noto uma grande agitação nas proximidades. Um[Select_CString( naked_preacher.IsFemale, 'a', '' )] [naked_preacher.GetWomanMan] nu[Select_CString( naked_preacher.IsFemale, 'a', '' )] subiu em cima de uma grande rocha e está pregando para a multidão reunida.\n\n\"O pecado original ainda mancha nossas almas, meus amigos, mas isso não precisa ser assim! Se nos despirmos de nossas vestes, poderemos recuperar a inocência perdida de Adão e Eva... então, e #EMP somente#! então, o Espírito Santo considerará nos tocar e nos mostrar o verdadeiro amor de Deus!\""
 pilgrimage.3002.t:0 "$pilgrimage_header$ Inocência de Adão"
 pilgrimage.3003.a.flavor:0 "Você entrega roupas [Select_CString( naked_preacher.IsFemale, 'a', 'ao' )] [naked_preacher.GetWomanMan] nu[Select_CString( naked_preacher.IsFemale, 'a', '' )]."
 pilgrimage.3003.a:0 "Você pode vestir estas roupas e nos acompanhar até [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]."
 pilgrimage.3003.b:0 "Vá e espalhe a palavra #EMP correta#!."
 pilgrimage.3003.desc:0 "Após ter sido derrotado em debate teológico, [Select_CString( naked_preacher.IsFemale, 'a', 'o' )] [naked_preacher.GetWomanMan] desceu da pedra e agora está parado na minha frente, surpreso com a situação.\n\n\"... Eu realmente acreditava que a chave estava nas vestimentas,\" sussurra [naked_preacher.GetSheHe] com tristeza. \"Mas sua perspectiva é verdadeiramente esclarecedora.\"\n\n[naked_preacher.GetSheHe|U] pisca, de repente lembrando da multidão e da própria nudez, mas mantendo uma expressão corajosa: \"E agora, como devo prosseguir?\""
 pilgrimage.3003.t:0 "$pilgrimage_header$ Culpa de Adão"
 pilgrimage.3004.a.flavor:0 "A Bíblia é clara; nenhum homem sabe quando será o Dia!"
 pilgrimage.3004.a:0 "\"De die autem illa et hora nemo scit!\""
 pilgrimage.3004.b:0 "Estou feliz por esta peregrinação vir com uma indulgência!"
 pilgrimage.3004.c:0 "Ess[Select_CString( doomsayer.IsFemale, 'a', 'e' )] [doomsayer.GetWomanMan] #EMP não#! é um sacerdote! Derrubem [doomsayer.GetSheHe]!"
 pilgrimage.3004.desc:0 "Enquanto meu grupo passa por uma pequena cidade, percebo uma multidão de pessoas lotando a praça do mercado. No centro, um[Select_CString( doomsayer.IsFemale, 'a', '' )] [doomsayer.GetWomanMan] fica em cima de um carrinho de peixes virado, gritando descontroladamente para todos que quiserem ouvir.\n\n\"O Dia do Julgamento está próximo! Arrependam-se! Arrependam-se, digo, ou serão condenados eternamente!\n\nOs moradores da cidade, preocupados, sussurram entre si, temendo as palavras do pregador do apocalipse."
 pilgrimage.3004.t:0 "$pilgrimage_header$ O Fim Está Próximo"
 pilgrimage.3101.a:0 "Vou me comprometer com o Ihram com a maior dedicação."
 pilgrimage.3101.b:0 "Ah... não é como se alguém fosse saber se eu cometer algum deslize."
 pilgrimage.3101.desc:0 "Conforme me aproximo de Meca, agora estou diante do Mīqāt, a fronteira entre os espaços sagrados de Meca e o mundo exterior.\n\nA partir deste ponto, devo entrar no estado de Ihram, passar por uma limpeza ritual e usar apenas as vestes prescritas. Também devo abster-me de atos sexuais, juramentos e pensamentos arrogantes ou rudes."
 pilgrimage.3101.t:0 "Ihram"
 pilgrimage.3102.a:0 "Eu quero ver toda a gloriosa criação de Allah."
 pilgrimage.3102.b:0 "Meu zelo é tão intenso que desejo fazer mais do que apenas o Hajj."
 pilgrimage.3102.c:0 "As dúvidas que abrigo me compeliram a buscar respostas em terras distantes."
 pilgrimage.3102.desc:0 "Embora o Hajj seja obrigatório para todos os muçulmanos, peregrinações a outros locais são muito menos comuns. Como essas Ziyarat não são exigidas pela doutrina islâmica, os muçulmanos que optam por realizá-las podem ter uma ampla variedade de motivações para fazê-lo.\n\nEnquanto viajamos pela estrada até [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip], me pego pensando sobre o que me fez querer realizar esta jornada em particular..."
 pilgrimage.3102.t:0 "$pilgrimage_header$ Ziyarat"
 pilgrimage.3201.a:0 "Junte-se aos outros fiéis nas águas sagradas."
 pilgrimage.3201.b:0 "Eu não vou me banhar com #EMP camponeses#!!"
 pilgrimage.3201.desc:0 "A purificação ritual é uma parte crucial da jornada de todo peregrino hindu. Uma forma comum disso é lavar-se nas águas de um rio sagrado.\n\nHá um cruzamento desses rios logo à frente, mas não posso deixar de notar que ele está #EMP cheio#! de pessoas comuns que também vieram em peregrinação..."
 pilgrimage.3201.t:0 "$pilgrimage_header$ Purificação Ritual"
 pilgrimage.3202.a.tt:0 "Sua [THIS.Char.GetInvolvedActivity.GetName] será #N adiada por vários meses#!"
 pilgrimage.3202.a:0 "Vamos passar um tempo aqui e contemplar o universo."
 pilgrimage.3202.b.tt:0 "Você chegará ao seu destino #P várias semanas mais cedo#!"
 pilgrimage.3202.b:0 "Vamos logo, continuemos!"
 pilgrimage.3202.desc.buddhism:0 "Gautama Buda nos ensinou que toda vida é sagrada. Embora os seres sencientes sejam a forma mais elevada de vida, até a menor lâmina de grama ainda merece respeito."
 pilgrimage.3202.desc.end:0 "\n\nEnquanto passamos por uma clareira simples na floresta, percebo o quão sereno e silencioso é. Sem lutas, sem conflitos... apenas uma paz simples desfrutada pelas árvores e arbustos."
 pilgrimage.3202.desc.hinduism:0 "Embora as Sete Cidades Sagradas sejam os lugares mais sagrados, a própria natureza selvagem tem sua própria forma de santidade."
 pilgrimage.3202.desc.jainism:0 "Ahiṃsā, ou não-violência, é um dos principais preceitos do Jainismo. Mesmo a violência contra as plantas é proibida, excluindo o mínimo necessário para sustentar a vida."
 pilgrimage.3202.desc.nature:0 "A arrogância do homem levou muitos a acreditar que estão acima da natureza, mas estão errados. O mundo natural existe no estado mais verdadeiro e puro de ser."
 pilgrimage.3202.t:0 "$pilgrimage_header$ Santidade da Floresta"
 pilgrimage.3301.a:0 "Posso fazer isso, pelo menos durante esta jornada."
 pilgrimage.3301.b:0 "Mas minha barraca, minhas cobertas? É demais. Eu não estou pronto!"
 pilgrimage.3301.c:0 "Ah, mas é contra Ṛta para um [ROOT.Char.GetTitleAsNameNoTooltip] viajar com austeridade."
 pilgrimage.3301.desc:0 "Ao longo do caminho do peregrino, vejo muitos errantes, aqueles que abandonaram o mundo e se libertaram de todos os apegos mundanos.\n\nHoje, um errante idoso observa minha comitiva enquanto [wanderer.GetSheHe] caminha ao meu lado. 'Você traz consigo coisas demais. Para alcançar a iluminação, você deve se despojar de suas posses mundanas como eu e viajar apenas com vestes simples.'"
 pilgrimage.3301.t:0 "$pilgrimage_header$ Bhikkhu Crítico"
 pilgrimage.3302.a:0 "Elas deveriam abandonar sua busca por gratificação!"
 pilgrimage.3302.b:0 "Quem me dera ser tão firme na minha subida..."
 pilgrimage.3302.c.flavor:0 "Você colhe o sal para comércio."
 pilgrimage.3302.c:0 "Esse sal deveria ser meu!"
 pilgrimage.3302.desc:0 "Ao entrar pela primeira vez nas selvagens [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] de [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier], pensei que nossa jornada pelo desfiladeiro seria tranquila. Após horas de subida extenuante, sou lembrado de que devo acolher as provações do meu Yatra.\n\nParo para enxugar o suor da testa e fico impressionado ao ver cabras selvagens em pé na encosta quase vertical de [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')].\n\nUm[Select_CString( mountain_local.IsFemale, 'a', '' )] [mountain_local.GetWomanMan] anciã[Select_CString( mountain_local.IsFemale, '', 'o' )] local se volta para mim,\n\n\"Aquelas cabras gananciosas só estão subindo para lamber o sal.\""
 pilgrimage.3302.t:0 "$pilgrimage_header$ Sabedoria das Cabras"
 pilgrimage.3303.a:0 "Não siga raciocínios enganosos, mas o caminho de [ROOT.Char.GetFaith.HighGodName]!"
 pilgrimage.3303.b.flavor:0 "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] encontrará o caminho certo de pensar com o tempo."
 pilgrimage.3303.b:0 "Das fontes de onde você bebe, qual lhe dá força?"
 pilgrimage.3303.desc:0 "Ao passar por [place_to_teach.GetBaronyNameExplicitlyNoTooltip], alguns locais, liderados por [wisdom_seeker.GetName], se aproximam, seus rostos pintados de confusão.\n\n“Venerável [ROOT.Char.GetTitleAsName], há [place_to_teach.GetCounty.GetFaith.PriestNeuterPlural] que visitam [place_to_teach.GetBaronyNameExplicitlyNoTooltip]. Eles exaltam a virtude de sua doutrina, enquanto para as crenças dos outros, parecem [ROOT.Char.Custom('RegionalOnlyFerociousAnimalPlural')] e os despedaçam. Em seguida, outros [place_to_teach.GetCounty.GetFaith.PriestNeuterPlural] visitam e, por sua vez, desprezam e criticam a doutrina do grupo anterior.\n\nSomos consumidos pela incerteza, a dúvida nos visita diariamente. Qual desses reverendos [place_to_teach.GetCounty.GetFaith.PriestNeuterPlural] falou a verdade e qual a falsidade?”"
 pilgrimage.3303.t:0 "$pilgrimage_header$ Sutta de [place_to_teach.GetBaronyNameExplicitlyNoTooltip]"
 pilgrimage.3401.a:0 "Desejo como meu guia, eu me banho na beleza de [bather.GetFirstNamePossessiveNoTooltip]."
 pilgrimage.3401.b.flavor:0 "Um passo mais próximo do Nirvana."
 pilgrimage.3401.b:0 "Entro na água fresca, minhas paixões extinguidas."
 pilgrimage.3401.desc:0 "Nosso Yatra nos levou à margem de [body_of_water.GetName]. Suas águas brilham como fragmentos de folha de ouro ao sol do fim do dia, nos convidando a banhar-nos.\n\nMeu olhar se volta para um dos meus companheiros de Yatra, [bather.GetName], seu corpo nu coberto apenas pelo brilho da água.\n\nEnquanto em [ROOT.Char.GetInvolvedActivity.GetShortName], deve-se adotar quase que monásticos [Glossary('Brahmacharya', 'BRAHMACHARAYA_GLOSS')], abstendo-se de pensamentos e impulsos lujuriosos..."
 pilgrimage.3401.t:0 "$pilgrimage_header$ Brahmacharya Desafiado"
 pilgrimage.4001.a:0 "Eu percorri o caminho sagrado."
 pilgrimage.4001.a_cynical:0 "What's important is that I am seen and heard here."
 pilgrimage.4001.a_dead:0 "Nós percorremos o caminho sagrado."
 pilgrimage.4001.cynical_end:0 "\n\nMuita caminhada."
 pilgrimage.4001.desc:0 "Finalmente estou aqui, corpo e alma, no grande [ROOT.Char.GetFaith.HouseOfWorship] de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip].\n\nEnquanto o [ROOT.Char.GetFaith.BishopNeuter] me oferece bênçãos, reflito sobre tudo o que precisou acontecer para que [ROOT.Char.GetFaith.PantheonTerm] me trouxesse aqui, neste momento no tempo."
 pilgrimage.4001.t:0 "A Chegada"
 pilgrimage.4002.a:0 "De fato, é, meu amigo!"
 pilgrimage.4002.a_cynical:0 "É... algo assim, com certeza."
 pilgrimage.4002.b:0 "Ah, sim, eu gosto do que estou vendo."
 pilgrimage.4002.desc:0 "Finalmente estou aqui, corpo e alma, no final da minha grande peregrinação. E quem deveria me encontrar lá senão [Select_CString( 2010_mystic.IsFemale, 'a', 'o' )] [2010_mystic.GetTitledFirstName], o buscador do verdadeiro conhecimento divino?\n\n\"Olhe ao seu redor, [ROOT.Char.GetFirstNameNoTooltip]!\" [2010_mystic.GetSheHe] diz. \"Essa glória não é como eu disse que seria?\""
 pilgrimage.4010.a.flavor:0 "Voltar agora seria sacrilégio!"
 pilgrimage.4010.a.tt:0 "Você irá explorar o destino e permanecer em [THIS.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] pelo tempo normal\n$EFFECT_LIST_BULLET$A conclusão e as recompensas do seu [THIS.Char.GetInvolvedActivity.GetName] ainda serão afetadas negativamente"
 pilgrimage.4010.a:0 "Eu... eu mudei de ideia. Isso não parece certo."
 pilgrimage.4010.b.flavor:0 "Vamos emboraaa..."
 pilgrimage.4010.b.tt:0 "Seu [THIS.Char.GetInvolvedActivity.GetName] será concluído e você começará a viagem de volta imediatamente"
 pilgrimage.4010.b:0 "Sim. Vamos partir para [ROOT.Char.GetTravelPlan.GetData.GetFinalDestination.GetProvince.GetNameNoTooltip]."
 pilgrimage.4010.desc:0 "Cortando caminhos e apressando a comitiva, finalmente chegamos em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip].\n\nNão querendo perder tempo, assim que os deveres sagrados para nossa [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName] forem cumpridos, os servos locais me informam que nossa viagem está preparada e pronta para a volta."
 pilgrimage.4010.t:0 "Já estive lá"
 pilgrimage.4020.a.flavor:0 "Que [old_pilgrimage_host.GetSheHe] descanse em paz agora."
 pilgrimage.4020.a:0 "Essa foi a decisão certa."
 pilgrimage.4020.desc.intro:0 "Assim que chegamos em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], começo a organizar a cerimônia para"
 pilgrimage.4020.desc.liked:0 "Eu luto para manter minha compostura enquanto procuro um dos [ROOT.Char.GetFaith.AltPriestTermPlural], prontos para nos ajudar nessa partida final.\n\nDepois, encontro alguma paz sabendo que chegamos a [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] e que [old_pilgrimage_host.GetFirstName] descansará para sempre, mais próximo de [ROOT.Char.GetFaith.HighGodNameAlternate], neste lugar sagrado."
 pilgrimage.4020.desc.neutral:0 "A procissão é serena e digna, e os [ROOT.Char.GetFaith.AltPriestTermPlural] locais me asseguram que [old_pilgrimage_host.GetSheHe] está em um lugar melhor agora que [old_pilgrimage_host.GetSheHe] foi colocado para descansar aqui em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], mais próximo de [ROOT.Char.GetFaith.HighGodName]."
 pilgrimage.4020.desc.relation_family:0 "[Select_CString( old_pilgrimage_host.IsFemale, 'minha falecida', 'meu falecido' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_pilgrimage_host'))].\n\n"
 pilgrimage.4020.desc.relation_family_liked:0 "[Select_CString( old_pilgrimage_host.IsFemale, 'minha querida falecida', 'meu querido falecido' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_pilgrimage_host'))].\n\n"
 pilgrimage.4020.desc.relation_liked:0 "[Select_CString( old_pilgrimage_host.IsFemale, 'minha querida', 'meu querido' )] [old_pilgrimage_host.GetFirstName].\n\n"
 pilgrimage.4020.desc.relation_neutral:0 "[old_pilgrimage_host.GetTitledFirstName].\n\n"
 pilgrimage.4020.t:0 "Memento Mori"
 pilgrimage.4100.a:0 "\"Um emblema, por favor!\""
 pilgrimage.4100.b:0 "Tenho coisas melhores para fazer com meu ouro."
 pilgrimage.4100.desc:0 "Sigo a miríade de peregrinos pelas atrações de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], eventualmente deparando-me com as bancas que exibem emblemas abençoados pelos ministros locais.\n\nUm pouco mais adiante na rua, noto alguns peregrinos experientes comparando quantos emblemas coletaram em suas jornadas."
 pilgrimage.4100.t:0 "O Emblema"
 pilgrimage.5001.desc:0 "Peregrinos se dirigem a Roma de todos os cantos do mundo cristão. Alguns seguem a Via Francigena; outros seguem caminhos menos conhecidos. No final, todos convergimos aqui, na Basílica de São Pedro, onde o próprio grande homem foi sepultado.\n\nFicando aqui com os outros peregrinos, sinto uma sensação de solene unidade e comunhão compartilhada entre os presentes, todos tendo superado várias provações e dificuldades ao longo de sua jornada."
 pilgrimage.5001.t:0 "Todos os Caminhos Levam a Roma"
 pilgrimage.5011.desc.beginning:0 "Nenhuma outra cidade do mundo tem uma história como a de Jerusalém. Além dos muitos outros locais sagrados lá, a cidade contém "
 pilgrimage.5011.desc.christian:0 "a Igreja do Santo Sepulcro, construída nos locais combinados onde Jesus foi crucificado, sepultado e ressuscitado."
 pilgrimage.5011.desc.end:0 "\n\nFicando do lado de fora do Monte do Templo, com minha mão no Muro das Lamentações, me encontro refletindo sobre tudo o que aconteceu em minha jornada para esta cidade lendária."
 pilgrimage.5011.desc.jewish:0 "o Monte do Templo, o local do Santo dos Santos e o local onde o Terceiro Templo é profetizado para ser reconstruído."
 pilgrimage.5011.desc.muslim:0 "a Haram esh-Sharif, o local onde Maomé ascendeu aos céus após seu tempo na Terra."
 pilgrimage.5011.t:0 "Ó Jerusalém, Jerusalém!"
 pilgrimage.5021.desc:0 "Finalmente estou nas colinas fora de Constantinopla, uma joia cintilante da civilização que ecoa a glória do Império Romano. É verdadeiramente um lugar deslumbrante!\n\nPerto do centro, posso ver a Hagia Sophia, o grande centro de adoração, que é frequentemente considerado o epítome da arquitetura bizantina.\n\nNo entanto, não é a única maravilha aqui, e enquanto observo a cidade, maravilho-me com as glórias da criação de [ROOT.Char.GetFaith.CreatorName]."
 pilgrimage.5021.t:0 "A Cidade do Desejo do Mundo!"
 pilgrimage.5031.desc:0 "Finalmente cheguei em Alexandria, o lar do monasticismo cristão. Os primeiros monges e eremitas começaram suas jornadas nas cavernas do deserto ao redor da cidade, que ainda estão em uso hoje.\n\nEmbora não seja tão famosa quanto Jerusalém ou Roma, Alexandria tem uma longa história como centro de teologia e aprendizado. Mesmo após séculos de ocupação islâmica, enclaves de cristãos que vivem na cidade ainda mantêm sua fé forte."
 pilgrimage.5031.t:0 "Alexandria!"
 pilgrimage.5101.desc:0 "[ROOT.Char.GetFaith.HighGodName] falou pela primeira vez a Moisés no topo do Monte Sinai, assumindo a forma de uma sarça ardente. Mais tarde, no mesmo monte, [ROOT.Char.GetFaith.HighGodNameSheHe|U] entregou a ele os Dez Mandamentos, que formaram a base de toda a doutrina abraâmica.\n\nNão há dúvida de que [ROOT.Char.GetFaith.HighGodName] favorece este lugar, e me pego pensando se [ROOT.Char.GetFaith.HighGodNameSheHe|U] está olhando para mim enquanto fico nessas encostas sagradas..."
 pilgrimage.5101.t:0 "Sinai e Horeb"
 pilgrimage.5201.desc:0 "Maomé nem sempre foi amado, e nos primeiros dias da fé muçulmana muitos o rejeitaram a ele e a seus ensinamentos.\n\nDepois de ser alertado sobre uma trama de assassinato, ele deixou Meca para viajar a Iatrebe, onde um crescente grupo de muçulmanos o recebeu de braços abertos. Essa jornada ficou conhecida como Hégira, e em sua nova casa Maomé foi capaz de unir as tribos guerreiras ao seu redor em submissão a Alá.\n\nIatrebe seria renomeada Medina, a cidade do Profeta, em honra a isso. Agora estou aqui, pronto para honrar sua jornada eu mesmo."
 pilgrimage.5201.t:0 "A Hégira"
 pilgrimage.5301.desc:0 "Finalmente cheguei em Varanasi. Fundada pelo deus Shiva na antiguidade distante, a grande cidade atrai peregrinos de longe e de perto.\n\nNão são apenas peregrinos hindus que vêm aqui, pois a cidade está próxima do local onde Gautama Buda ensinou seus discípulos pela primeira vez.\n\nPresenciar essa mistura de fiéis em primeira mão, e o conhecimento e as discussões que dela surgem, me fazem perceber de forma nova como todos nós vivemos juntos neste mundo."
 pilgrimage.5301.t:0 "Varanasi"
 pilgrimage.5311.desc:0 "Finalmente cheguei em Ayodhya, local de nascimento do deus Rama e cenário do grande épico Ramayana. Como uma encarnação de Vishnu, o nascimento e a vida de Rama são considerados um exemplo brilhante de dharma em ação.\n\nComo uma história que inspirou gerações de hindus, estar no local do Ramayana me faz questionar que tipo de marca minha própria história deixará na história..."
 pilgrimage.5311.t:0 "Ayodhya"
 pilgrimage.5321.desc:0 "Finalmente cheguei ao meu destino, Mathura. É aqui que o deus Krishna nasceu, a divindade da compaixão, amor e ternura.\n\nOlhando ao redor, posso ver todos esses aspectos demonstrados pelos peregrinos que vêm aqui para adorar no Complexo do Templo Krishna Janmasthan, uma das mais magníficas e grandiosas construções religiosas já feitas até hoje."
 pilgrimage.5321.t:0 "Mathura"
 pilgrimage.5331.desc:0 "Finalmente cheguei à nascente do sagrado rio Ganges, em Haridwar.\n\nA cidade foi construída no local onde a deusa Ganga desceu quando o Senhor Shiva liberou o poderoso rio de seus cabelos.\n\nConhecido por ser capaz de purificar pecados, peregrinos de todo o mundo vêm aqui para banhar-se nas águas do rio. Agora serei um deles."
 pilgrimage.5331.t:0 "Haridwar"
 pilgrimage.5341.desc:0 "Finalmente cheguei a Kanchipuram, lar do Templo Kamakshi Amman.\n\nDedicado à deusa mãe, este templo é conhecido como um lugar de paz e prosperidade, e continua sendo um dos sete locais mais sagrados do hinduísmo."
 pilgrimage.5341.t:0 "Kanchipuram"
 pilgrimage.5351.desc:0 "Ao chegar na antiga cidade de Ujjain, começo a fazer meu caminho em direção ao Mahakaleshwar Jyotirlinga.\n\nDedicado ao Senhor Shiva em sua encarnação como Mahakaleshwar, a cidade tem sido há muito tempo tanto um centro de peregrinação quanto administrativo, criando uma grande metrópole movimentada que pulsa com a vida dos fiéis.\n\nDepois de chegar ao grande templo, busco a bênção do [ROOT.Char.GetFaith.BishopNeuter], purificando minha alma de seus pecados."
 pilgrimage.5351.t:0 "Ujjayini"
 pilgrimage.5361.desc:0 "Finalmente estou diante da Cidade Gateway, Dwarka, um dos maiores locais do hinduísmo.\n\nDe acordo com a lenda, a encarnação de Vishnu como Krishna recuperou grandes extensões de terra do próprio mar para que a cidade pudesse ser construída aqui. Desde então, a cidade cresceu substancialmente, tornando-se um centro religioso e econômico que atrai peregrinos de todo o mundo... eu mesmo entre eles."
 pilgrimage.5361.t:0 "Dwarka"
 pilgrimage.5401.desc:0 "Cheguei ao local mais sagrado do mundo para os budistas, Bodh Gaya, onde [ROOT.Char.GetFaith.HighGodName] atingiu a iluminação sob a Árvore Bodhi.\n\nDesde então, o elaborado Templo Mahabodi foi construído ao redor da árvore sagrada, e peregrinos de todo o mundo vêm aqui para aprender mais sobre a história de [ROOT.Char.GetFaith.HighGodName] e celebrar a sua vida."
 pilgrimage.5401.t:0 "Bodh Gaya"
 pilgrimage.5411.desc:0 "Finalmente cheguei em Kushinagar, onde se diz que [ROOT.Char.GetFaith.HighGodName] deixou o mundo mortal.\n\nTendo alcançado o Nirvana em vida, a morte de [ROOT.Char.GetFaith.HighGodName] deve ser celebrada, pois [ROOT.Char.GetFaith.HighGodNameSheHe] atingiu o Parinirvana após a morte e se libertou das correntes do renascimento. Esse moksha, ou libertação, é o objetivo final de um budista devoto."
 pilgrimage.5411.t:0 "Kushinagar"
 pilgrimage.5421.desc:0 "Minha jornada finalmente me trouxe a Sarnath, o local onde [ROOT.Char.GetFaith.HighGodName] ensinou pela primeira vez as quatro nobres verdades aos seus seguidores, bem como os ensinamentos associados a elas.\n\nFoi aqui que a primeira escola budista foi fundada, o que ainda hoje atrai peregrinos de todo o mundo."
 pilgrimage.5421.t:0 "Sarnath"
 pilgrimage.5445.a:0 "$pilgrimage.4001.a$"
 pilgrimage.5445.a_cynical:0 "$pilgrimage.4001.a_cynical$"
 pilgrimage.5445.a_dead:0 "$pilgrimage.4001.a_dead$"
 pilgrimage.5445.desc:0 "Contemplo o majestoso [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] de [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier] e prossigo para a próxima fase do meu [Glossary('Yatra', 'YATRA_GLOSS')]. Expresso minha homenagem devocional a [ROOT.Char.GetFaith.HighGodName] através do [Glossary('Puja', 'PUJA_GLOSS')]. Em seguida, junto-me à multidão no caminho do [Glossary('Pradakshina', 'PRADAKSHINA_GLOSS')], circundando no sentido horário ao redor do santuário."
 pilgrimage.5445.t:0 "Parikrama"
 pilgrimage.5501.desc:0 "De acordo com o Nirvana Kanda, vinte dos vinte e quatro tirthankaras jainistas atingiram o Moksha aqui, na montanha de Shikharji. Essa história tão lendária tornou este lugar o local de peregrinação mais importante na comunidade jainista, e enquanto meu olhar vagueia dos picos mais altos até as áreas mais baixas, encontro-me refletindo sobre minha própria jornada aqui e o que isso significa para minha vida."
 pilgrimage.5501.t:0 "Shikharji"
 pilgrimage.5601.desc:0 "Enquanto estou nas encostas do Monte Ushi-darena, a vista das áreas inferiores se desdobra diante de mim. Diante dessa visão impressionante, não posso deixar de pensar em como Zoroastro alcançou a iluminação aqui, recebendo o conhecimento de Ahura Mazda para disseminar ao mundo abaixo. Assim como a maioria dos peregrinos aqui, não sinto a centelha divina da profecia, mas mesmo assim não consigo deixar de maravilhar-me com o que está diante de mim."
 pilgrimage.5601.t:0 "A Consciência Divina"
 pilgrimage.5901.desc:0 "No coração das florestas de Paderborn, jazia uma vez Irminsul, a Grande Coluna. Erguido em honra a Odin, o monumento foi destruído por Carlos Magno durante as Guerras Saxônicas, mas nosso povo continua a se dirigir ao local onde ele se erguia em memória de sua grandiosidade. Agora posso dizer que eu também fiz uma peregrinação a esse lugar sagrado."
 pilgrimage.5901.t:0 "Paderborn!"
 pilgrimage.5911.desc:0 "O mundo é o templo de [ROOT.Char.GetFaith.HighGodName], o grande céu azul é mais grandioso do que o teto de qualquer mesquita ou igreja. Aqui, nas vastas estepes abertas de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], sinto-me especialmente próximo de [ROOT.Char.GetFaith.PantheonTerm] e me pego refletindo sobre minha jornada para alcançar este lugar sagrado."
 pilgrimage.5911.t:0 "Céu Aberto Azul"
 pilgrimage.5921.desc:0 "Finalmente, cheguei a [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]. Enquanto alguns adoram em igrejas ou mesquitas, eu sei que os lugares mais sagrados estão na floresta aberta, onde os pés descalços são acariciados pela terra suave e nutritiva.\n\nOs antigos bosques aqui são especialmente veneráveis, e me pego pensando sobre meu lugar no mundo natural enquanto permaneço entre as grandes árvores."
 pilgrimage.5921.t:0 "Bosques Sagrados"
 pilgrimage.6001.a:0 "Meus ouvidos estão sempre abertos para um amigo."
 pilgrimage.6001.b:0 "Acho que prefiro ficar sozinho, obrigado."
 pilgrimage.6001.c:0 "Vergonha para você. Estamos aqui para nos concentrar em nossa fé!"
 pilgrimage.6001.desc:0 "Estou seguindo a passos lentos nessa longa procissão em direção a [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] e pensando nos confortos que deixei para trás em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] quando ouço meu nome sendo gritado lá atrás.\n\nMeu amigo [friend.GetFirstNameNoTooltip] corre até mim e exclama: \"[ROOT.Char.GetTitledFirstNameNoTooltip]! Que sorte que estamos seguindo juntos para o mesmo local sagrado! Gostaria de ter uma companhia nesse caminho longo e solitário até [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]?\""
 pilgrimage.6001.t:0 "Quanto mais, melhor"
 pilgrimage.6002.a:0 "Uma bebida refrescante parece divina!"
 pilgrimage.6002.a_tt:0 "Visite a taverna local"
 pilgrimage.6002.b:0 "Continuem sem mim..."
 pilgrimage.6002.b_tt:0 "Prossiga com sua jornada"
 pilgrimage.6002.c:0 "Que [ROOT.Char.Custom('GetHeathenMiscreant')] visitaria a taverna durante uma peregrinação?"
 pilgrimage.6002.desc:0 "[friend.GetFirstNameNoTooltip|U] e eu passamos o restante da jornada do dia conversando sobre isso e aquilo, intrigas e brincadeiras, batalhas e amantes, velhos amigos e novos. Estamos no meio de uma conversa envolvente quando um grito cansado vem da cabeça da coluna: 'Acamparemos aqui!'\n\n[friend.GetFirstNameNoTooltip|U] olha para mim com um sorriso malicioso no rosto e diz: 'Finalmente! Mas que tal um pequeno desvio antes de montar acampamento? Uma longa jornada pode deixar qualquer [friend.GetWomanMan] com sede...' "
 pilgrimage.6003.a:0 "'A próxima rodada é por minha conta!'"
 pilgrimage.6003.a_tt:0 "Continue se divertindo com [friend.GetShortUIName]"
 pilgrimage.6003.b.tt:0 "Você e [friend.GetFirstNameNoTooltip] encerram a noite e voltam para o acampamento"
 pilgrimage.6003.b:0 "Devemos voltar ao acampamento, para não sermos notados."
 pilgrimage.6003.desc:0 "Entramos na taverna lotada e [friend.GetFirstNameNoTooltip] imediatamente pede duas canecas de [ROOT.Char.Custom('RegionalDrink')]. Sentamos e ouvimos a história de um menestrel, desfrutando de nossas bebidas, falando intermitentemente sobre as dificuldades e triunfos da vida.\n\nPor [ROOT.Char.GetFaith.HighGodName], isso é revigorante depois de um longo dia suando e trabalhando na estrada. Levanto minha caneca e grito: 'Um brinde à saúde do meu amigo [friend.GetFirstNameNoTooltip] por sugerir um descanso tão bom após a jornada de hoje!'\n\nA taverna ergue suas canecas em celebração ao meu bom amigo e todos bebem profundamente."
 pilgrimage.6004.a.tt:0 "Você abre os barris recém-descobertos e compartilha o conteúdo com a multidão"
 pilgrimage.6004.a:0 "'[ROOT.Char.Custom('RegionalDrink')|U] para todos!'"
 pilgrimage.6004.b:0 "\"Acho que já passamos da hora de irmos embora...\""
 pilgrimage.6004.desc:0 "Depois de talvez algumas rodadas a mais de [ROOT.Char.Custom('RegionalDrink')], [friend.GetFirstNameNoTooltip] e eu inspiramos os frequentadores da taverna a um coro de canções de bebedeira enquanto marcamos o ritmo nas mesas.\n\nCom um #EMP estrondo#! e mais lascas do que eu gostaria de contar, nós caímos pelo chão e vamos parar na adega de vinho, aventureiramente explorando onde pouc[Select_CString( ROOT.Char.IsFemale, 'as', 'os' )] [ROOT.Char.GetWomenMen] estiveram antes.\n\nTodos os nossos companheiros festeiros nos observam do andar principal com emoções mistas de preocupação e schadenfreude. Eles obviamente estão esperando um relatório da adega."
 pilgrimage.6005.a:0 "Que companheiros de viagem amáveis e atenciosos nós temos!"
 pilgrimage.6005.b:0 "\"Devemos pagar por nossas desventuras!\""
 pilgrimage.6005.c:0 "\"É crime se divertir?\""
 pilgrimage.6005.desc.bad:0 "e todos os membros de nossa peregrinação se viram para nos encarar.\n\nMal conseguimos manter a compostura devido à grande quantidade de [ROOT.Char.Custom('RegionalDrink')] em nossos estômagos.\n\nEnquanto contamos as aventuras da noite para qualquer um que queira ouvir, um membro especialmente zeloso do acampamento da peregrinação me olha com severidade e insiste que paguemos pelos danos na taverna próxima."
 pilgrimage.6005.desc.good:0 "mas não há nada se mexendo.\n\nA fogueira parece ter sido alimentada antes de irmos dormir para espantar o frio de nossas camas."
 pilgrimage.6005.desc:0 "Nós voltamos não tão silenciosamente para o acampamento, rezando sinceramente para que todos já tenham ido dormir. Ao nos aproximarmos das nossas tendas, podemos ver o fogo ainda aceso "
 pilgrimage.6006.a:0 "\"Seu segredo está seguro comigo, amigo.\""
 pilgrimage.6006.b:0 "\"Não tolerarei um amigo que não acredita.\""
 pilgrimage.6006.c:0 "\"Você levanta pontos interessantes...\""
 pilgrimage.6006.desc:0 "[friend.GetFirstName] e eu estamos nos aproximando do fim da jornada de hoje. Estamos lentamente seguindo em direção ao ponto determinado de parada, quando de repente alguém à frente grita: 'Olhem! Que #EMP maravilhoso#! pôr do sol!'\n\nTodos avançam com suas últimas forças para ter um vislumbre desse local majestoso. 'Que maravilhas somos privilegiados em ver nesta vida mortal! Este é um momento perfeito para meditar em nossa fé', digo a [friend.GetFirstNameNoTooltip], mas [friend.GetSheHe] não parece impressionado, soltando um riso sarcástico.\n\n'É apenas um pôr do sol!', [friend.GetSheHe] grita. 'Será que tudo que fazemos nessa viagem precisa envolver [ROOT.Char.GetFaith.HighGodName]? Eu só quero viajar e conhecer o mundo - nem mesmo estou convencido de que [ROOT.Char.GetFaith.HighGodName] existe #EMP de verdade!#!'"
 pilgrimage.6007.a.failure:0 "A condição de [friend.GetFirstNameNoTooltip] piora."
 pilgrimage.6007.a.success:0 "[friend.GetFirstNameNoTooltip] é [Select_CString( friend.IsFemale, 'curada', 'curado' )]."
 pilgrimage.6007.a:0 "[ROOT.Char.GetFaith.HighGodName] realmente cuida de nós."
 pilgrimage.6007.b:0 "[Select_CString( 6007_healer.IsFemale, 'Essa', 'Esse' )] [6007_healer.GetWomanMan] não é [Select_CString( 6007_healer.IsFemale, 'digna', 'digno' )] de nossa confiança."
 pilgrimage.6007.desc:0 "[Select_CString( friend.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('friend'))] [friend.GetFirstName], afligido pela sua aflição, luta para acompanhar-nos em nossa peregrinação. Então, eu caminho ao lado dele(a) e faço companhia. Um [ROOT.Char.GetFaith.PriestNeuter] itinerante tem viajado conosco por um tempo e nota a luta de [friend.GetFirstNameNoTooltip].\n\n\"Coitada de você. Uma criança de [ROOT.Char.GetFaith.HighGodName] não deveria se esforçar tanto em seu caminho para [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip],\" ele diz. \"Talvez [ROOT.Char.GetFaith.HealthGodName] possa me conceder o poder para curar você de sua aflição. Você me permitiria tentar?\"\n\n[Select_CString( friend.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('friend'))] se volta para mim, buscando minha orientação. \"O que você acha, [ROOT.Char.GetFirstName]?"
 pilgrimage.6007.t:0 "Vivendo de Oração"
 pilgrimage.6500.a.tt:0 "Sua cultura não possui a tradição [GetCultureTradition('tradition_xenophilic').GetName]"
 pilgrimage.6500.a:0 "Eu #EMP sei!#! Vamos aproveitar isso!"
 pilgrimage.6500.b:0 "As proezas que a espiritualidade pode alcançar!"
 pilgrimage.6500.c:0 "O homem construiu este lugar, não divindades."
 pilgrimage.6500.desc:0 "[pilgrimage_member.GetTitledFirstName], [Select_CString( pilgrimage_member.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', pilgrimage_member)], olha para o vasto local sagrado de [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier] enquanto avançamos entre a multidão:\n\n\"[ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] é verdadeiramente uma visão deslumbrante! Um lugar onde culturas se encontram e fé se une em adoração. Não somos abençoados por poder vivenciar tanta familiaridade e companheirismo?\"\n\n[pilgrimage_member.GetSheHe|U] olha para mim com expectativa."
 pilgrimage.6500.t:0 "Apreciação"
 pilgrimage.6510.a.flavor:0 "Não posso acreditar que essa placa tenha um erro de #EMP ortografia!#!"
 pilgrimage.6510.a:0 "#EMP Eu#! vou traduzir para todos vocês!"
 pilgrimage.6510.b:0 "O que essa placa diz...?"
 pilgrimage.6510.b_failure.desc:0 "A placa continua sendo um mistério"
 pilgrimage.6510.b_failure.t:0 "Placa Ininteligível"
 pilgrimage.6510.b_success.desc:0 "Decifrar a placa"
 pilgrimage.6510.b_success.t:0 "Placa Decifrada"
 pilgrimage.6510.c:0 "Eh, isso parece pouco importante."
 pilgrimage.6510.desc:0 "Enquanto caminho pelas ruas de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], paro em frente a uma pequena [ROOT.Char.GetFaith.HouseOfWorship]. O prédio é relativamente simples e modesto, mas uma pequena multidão de peregrinos se reuniu em frente a ele.\n\nQuando me aproximo, percebo que eles estão coçando a cabeça, tentando entender a placa ao lado de uma estátua guardiã, escrita em um idioma estrangeiro.\n\nEsta pode ser uma oportunidade de prestar um serviço aos meus companheiros peregrinos!"
 pilgrimage.6510.t:0 "Perdido na Tradução"
 pilgrimage.6520.a:0 "Como você #EMP ousa#! ser tão insolente!"
 pilgrimage.6520.b:0 "Venha, deixe-me mostrar aquela estátua maravilhosa ali."
 pilgrimage.6520.c:0 "Entendo o que você quer dizer."
 pilgrimage.6520.desc:0 "[impatient_pilgrim.GetTitledFirstName] caminha apressadamente junto com nosso grupo de peregrinos, suspirando alto e arrastando os pés: 'Parece que estamos aqui há séculos. Não está na hora de começarmos a voltar para casa em breve?' murmura impacientemente [impatient_pilgrim.GetSheHe].\n\nLanço um olhar de lado para [impatient_pilgrim.GetSheHe], e"
 pilgrimage.6520.desc_forgiving:0 "sinto um pouco de compaixão por [impatient_pilgrim.GetSheHe]. Não é divertido ser arrastado dessa maneira."
 pilgrimage.6520.desc_nonforgiving:0 "não consigo acreditar na #EMP audácia#! [impatient_pilgrim.GetHerHim]. Aperto os punhos."
 pilgrimage.6520.t:0 "Está na Hora de Voltar para Casa?"
 pilgrimage.6530.a:0 "Estou [Select_CString( ROOT.Char.IsFemale, 'intrigada', 'intrigado' )]."
 pilgrimage.6530.a_child.tt:0 "Você segue a criança"
 pilgrimage.6530.b.flavor:0 "[local_guide.GetShortUIName] se afasta apressadamente."
 pilgrimage.6530.b:0 "[ROOT.Char.GetFaith.HighGodName] também sorrirá para [Select_CString( local_guide.IsFemale, 'as', 'os' )] [local_guide.GetWomenMen]."
 pilgrimage.6530.b_child:0 "Mentir não combina com você, minha criança."
 pilgrimage.6530.c.flavor:0 "Todos nós pagamos pelos nossos pecados."
 pilgrimage.6530.c:0 "Me dê uma razão para não te denunciar."
 pilgrimage.6530.d.flavor:0 "Vou ensinar [local_guide.GetSheHe] a ser [Select_CString( local_guide.IsFemale, 'honesta', 'honesto' )]!"
 pilgrimage.6530.d:0 "Você está tentando me enganar, camponês?!"
 pilgrimage.6530.dangerous.desc:0 "Você é [Select_CString( ROOT.Char.IsFemale, 'enganada e colocada', 'enganado e colocado' )] em uma situação perigosa"
 pilgrimage.6530.desc_adult:0 "guia local peculiar. [local_guide.GetSheHe|U] se dirige a nós sem reservas:\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], vocês parecem pessoas refinadas! Eu conheço uma experiência simplesmente #EMP divina#! não muito longe de [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip], que certamente seria interessante para qualquer peregrino dedicado!\""
 pilgrimage.6530.desc_child:0 "criança pequena de olhos grandes e brilhantes. [local_guide.GetSheHe|U] olha para nós enquanto [local_guide.GetSheHe] exclama:\n\n\"Eu conheço um lugar secreto onde [ROOT.Char.GetFaith.HighGodName] mora!\" [local_guide.GetSheHe] coloca uma expressão determinada enquanto [local_guide.GetSheHe] continua: \"Posso mostrar para vocês, se quiserem?\""
 pilgrimage.6530.desc_intro:0 "Enquanto passamos pelas barracas do mercado de [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip], somos abordados por um"
 pilgrimage.6530.desc_learned:0 "\n\nTendo estudado os mapas, eu sei que não há nada naquele lado de [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip], exceto uma terra perigosa."
 pilgrimage.6530.desc_warning:0 "\n\n[warning_character.GetTitledFirstName], à minha direita, franzindo a testa e balançando sutilmente a cabeça. Um aviso?"
 pilgrimage.6530.divinity.desc:0 "[local_guide.GetShortUIName] mostra a você uma experiência verdadeiramente divina"
 pilgrimage.6530.e:0 "Vou passar."
 pilgrimage.6530.t:0 "Novas Experiências"
 pilgrimage.6531.a:0 "Que extraordinário!"
 pilgrimage.6531.desc_crystal_cavern:0 "Enquanto começo a me perguntar se chegaremos algum dia, nosso guia, [local_guide.GetTitledFirstName], vira bruscamente à esquerda e, antes que percebamos, entramos em uma caverna escondida no campo.\n\nUm brilho tênue, que gradualmente se torna mais intenso, começa a refletir sobre nossos equipamentos enquanto nos deparamos com uma grande gruta coberta por centenas de cristais. Os cristais capturam a luz que entra pelo buraco no teto, e o séquito, incluindo eu mesmo, se encanta com a visão."
 pilgrimage.6531.desc_cynical:0 "\n\nIsso é realmente impressionante, tenho que admitir."
 pilgrimage.6531.desc_non_cynical:0 "\n\nNunca senti a presença de [ROOT.Char.GetFaith.HighGodName] mais forte do que neste exato lugar."
 pilgrimage.6531.desc_wellspring:0 "A certa distância de [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip], paramos abruptamente. Nosso guia, [local_guide.GetTitledFirstName], nos mostra uma passagem secreta e acabamos em uma pequena caverna, iluminada pela luz do dia que entra por um buraco no teto.\n\nAtravés desse mesmo buraco, uma fonte verdadeiramente notável jorra serenamente. A água fluente brilha com um esplendor divino e arco-íris nebulosos tingem o ar ao redor."
 pilgrimage.6531.t:0 "Divindade Oculta"
 pilgrimage.6532.a:0 "[6532_protector.GetTitledFirstNameNoTooltip]! Lide com eles!"
 pilgrimage.6532.a_failure.desc:0 "[6532_protector.GetShortUIName] se machuca na luta"
 pilgrimage.6532.a_failure.t:0 "Machucado"
 pilgrimage.6532.a_success.desc:0 "[6532_protector.GetShortUIName] afugenta com sucesso os vilões"
 pilgrimage.6532.a_success.t:0 "Vilões Assustados"
 pilgrimage.6532.b:0 "#EMP O poder de [ROOT.Char.GetFaith.HighGodNameAlternate] o compeliu!#!"
 pilgrimage.6532.c:0 "Este é um lugar sagrado! Vocês não têm temor a Deus?!"
 pilgrimage.6532.c_failure.desc:0 "Você é roubado"
 pilgrimage.6532.c_failure.t:0 "Roubado"
 pilgrimage.6532.c_success.desc:0 "Você exorciza com sucesso os vilões"
 pilgrimage.6532.c_success.t:0 "Vilões Exorcizados"
 pilgrimage.6532.desc:0 "O assobio despreocupado d[Select_CString( local_guide.IsFemale, 'a', 'o' )] nosso guia [local_guide.GetTitledFirstName] é a última coisa que ouvimos antes que os bandidos se aproximem de nós, aparentemente do nada, a uma boa distância de [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]. Foi uma armadilha, e agora estamos isolados, sem esperança de intervenção.\n\nMeu coração acelera enquanto tento descobrir meu próximo movimento. Como eles ousam atacar os peregrinos?"
 pilgrimage.6532.t:0 "Presas da Peregrinação!"
 pilgrimage.6533.a.flavor:0 "Vamos ajudar a pobre criança."
 pilgrimage.6533.a:0 "Querida criança, sua honestidade aquece meu coração."
 pilgrimage.6533.b.flavor:0 "Um criminoso por associação!"
 pilgrimage.6533.b:0 "Ações tão #EMP desprezíveis#!"
 pilgrimage.6533.desc:0 "Algum tempo depois de [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip], quando viramos uma esquina, nosso guia criança [local_guide.GetTitledFirstName] para subitamente. O corpo pequeno começa a tremer e posso ouvir um soluço abafado enquanto [local_guide.GetSheHe] tenta esconder o fato de que está chorando.\n\n\"Desculpe... [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord], eles me obrigaram a fazer isso. Minha irmãzinha está doente e não comemos há dias...,\" [local_guide.GetSheHe] olha para lá, os grandes olhos brilhantes subitamente com medo. \"Devíamos voltar,\" [local_guide.GetSheHe] sussurra, cautelosamente."
 pilgrimage.6533.t:0 "Tempos Desesperados"
 pilgrimage.6540.a.flavor:0 "Devo conseguir facilmente dobrar isso."
 pilgrimage.6540.a.tt:0 "Você compra as mercadorias exóticas"
 pilgrimage.6540.a:0 "Este lote parece um investimento sábio!"
 pilgrimage.6540.b.flavor:0 "Devo conseguir facilmente triplicar isso."
 pilgrimage.6540.b:0 "Estas aqui parecem intrigantes."
 pilgrimage.6540.c:0 "Posses mundanas? Que banalidade."
 pilgrimage.6540.desc:0 "Enquanto caminho pelas ruas de [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier], os produtos de um mercado local chamam minha atenção.\n\nUm mercador sorri para mim e proclama: \"Tenho os produtos, se [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord] tiver a moeda!\"\n\nEsses produtos exóticos poderiam render um bom lucro em casa... ou talvez valha a pena guardá-los como presente."
 pilgrimage.6540.t:0 "Posso lhe interessar com..."
 pilgrimage.6750.a:0 "\"Aqui, eu renasço como [Select_CString( ROOT.Char.IsFemale, 'uma nova', 'um novo' )] [ROOT.Char.GetWomanMan].\""
 pilgrimage.6750.b:0 "\"Bem, então posso aproveitar enquanto posso.\""
 pilgrimage.6750.desc.comfort_eater:0 "[GetTrait('comfort_eater').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.contrite:0 "[GetTrait('contrite').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.drunkard:0 "[GetTrait('drunkard').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.flagellant:0 "[GetTrait('flagellant').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.hashishiyah:0 "[GetTrait('hashishiyah').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.inappetetic:0 "[GetTrait('inappetetic').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.intro:0 "Ao entrar na [ROOT.Char.GetFaith.HouseOfWorship], um sentimento formidável de culpa me aflige. A luz — iluminando o altar como um dia ensolarado de verão — é tão densa que sinto que posso tocá-la.\n\nQue tipo de vida estou vivendo? Que tipo de [ROOT.Char.GetTitleAsNameNoTooltip] eu poderia ser? Ou [ROOT.Char.GetMotherFather]? Ou [ROOT.Char.Custom('GetDaughterSon')]?\n\nSe eu não mudar minha"
 pilgrimage.6750.desc.irritable:0 "[GetTrait('irritable').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.outro:0 "natureza, a única luz que verei será a dos fogos do [ROOT.Char.GetFaith.NegativeAfterLife]."
 pilgrimage.6750.desc.profligate:0 "[GetTrait('profligate').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.rakish:0 "[GetTrait('rakish').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.secret:0 "[repent_trait.GetNameNoTooltip]"
 pilgrimage.6750.t:0 "Arrependimento em [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]"
 pilgrimage.6760.a:0 "\"Não vou ouvir essa blasfêmia absurda!\""
 pilgrimage.6760.b.failure:0 "[bishop_pilgrim.GetShortUIName] mantém sua posição"
 pilgrimage.6760.b.success:0 "[bishop_pilgrim.GetShortUIName] está convencido"
 pilgrimage.6760.b:0 "\"E você sabe como o Concílio de Éfeso aconteceu para #EMP ele#!.\""
 pilgrimage.6760.c:0 "\"Bem dito, meu amigo. Vamos dar um passeio agora.\""
 pilgrimage.6760.desc.christian:0 "\"Seria tolo dizer que 'tendo se feito carne' significa que Cristo se tornou inexplicável e incompreensivelmente homem a partir da Palavra, tendo unido hipostaticamente.\"\n\n\"Mas, como o próprio Nestório disse,\" [bishop_pilgrim.GetTitledFirstName] refuta, \"Cristo homem também poderia se tornar divino, filho por graça e não por natureza.\""
 pilgrimage.6760.desc.intro:0 "Enquanto ouvimos as orações matinais, [bishop_pilgrim.GetTitledFirstName] e eu temos uma discussão animada que rapidamente se desvia para assuntos teológicos.\n\n"
 pilgrimage.6760.t:0 "A Disputa de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 pilgrimage.6770.a:0 "Isso #EMP deve#! ser meu."
 pilgrimage.6770.b.failure:0 "[relic_merchant.GetShortUIName] se sente insultado pela sua oferta"
 pilgrimage.6770.b.success:0 "[relic_merchant.GetShortUIName] reduz o preço"
 pilgrimage.6770.b:0 "\"Tenho certeza de que você não gostaria de vender uma relíquia por um preço ganancioso...\""
 pilgrimage.6770.c:0 "\"Tenho coisas melhores para gastar ouro.\""
 pilgrimage.6770.d:0 "\"Isso não parece muito autêntico...\""
 pilgrimage.6770.desc.buddhist:0 "[SCOPE.Custom('BuddhismRelicName')|U]!"
 pilgrimage.6770.desc.christian:0 "[SCOPE.Custom('ChristianRelicName')|U]!"
 pilgrimage.6770.desc.fallback:0 "[merchant_relic.GetName|U]!"
 pilgrimage.6770.desc.intro:0 "Enquanto perambulo pelas barracas do mercado - evitando o máximo possível os alimentos locais - percebo uma aglomeração maior ao redor de um comerciante específico.\n\n\"Venham comprar uma verdadeira relíquia por um preço que faria [ROOT.Char.GetFaith.WealthGodName] rir por décadas. A"
 pilgrimage.6770.desc.islam:0 "[SCOPE.Custom('IslamRelic')|U]!"
 pilgrimage.6770.desc.judaism:0 "[SCOPE.Custom('JudaismRelicName')|U]!"
 pilgrimage.6770.desc.outro:0 "Encontrada neste próprio santuário sagrado, há apenas alguns dias!\""
 pilgrimage.6770.t:0 "Uma Verdadeira Relíquia"
 pilgrimage.6780.a:0 "Que mestre habilidoso, talvez eu devesse contratar [stolen_courtier.GetSheHe]."
 pilgrimage.6780.b.failure.desc:0 "[stolen_courtier.GetShortUIName] recusa sua oferta"
 pilgrimage.6780.b.failure.t:0 "Oferta Recusada"
 pilgrimage.6780.b.success.desc:0 "[stolen_courtier.GetShortUIName] se junta à sua corte"
 pilgrimage.6780.b.success.t:0 "Cortesão Recrutado"
 pilgrimage.6780.b:0 "\"Um especialista como esse é desperdiçado em uma corte como esta...\""
 pilgrimage.6780.c:0 "Uma pessoa não é suficiente para arriscar a fúria [Select_CString( current_employer.IsFemale, 'da', 'do' )] [current_employer.GetTitledFirstNameNoTooltip]."
 pilgrimage.6780.desc:0 "Há apenas tanto tempo que um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] pode passar rezando sem procurar outras maneiras igualmente importantes de ocupar seu tempo. E [current_employer.GetTitledFirstName] possui uma adorável residência que [current_employer.GetSheHe] gentilmente me permite visitar.\n\nOuço vozes vindas de uma das salas, '...e ao fazer isso, você alcançaria a maior técnica.' Espio pela porta e vejo [Select_CString( stolen_courtier.IsFemale, 'a', 'o' )] [stolen_courtier.GetTitledFirstName], explicando sua arte a um grupo de cortesãos interessados, que seguem ansiosamente seus ensinamentos."
 pilgrimage.6780.t:0 "Um Cortesão Habilidoso"
 pilgrimage.6790.a:0 "\"Estou. Eu #EMP estou#!.\""
 pilgrimage.6790.b:0 "\"Estou mais interessado em seus ensinamentos.\""
 pilgrimage.6790.c:0 "\"Eu não preciso mudar #EMP nada#! sobre mim mesmo.\""
 pilgrimage.6790.desc:0 "\"[spiritual_mentor.GetSheHe|U] é [Select_CString( spiritual_mentor.IsFemale, 'a', 'o' )] melhor [spiritual_mentor.GetWomanMan] em toda a extensão da terra. [spiritual_mentor.GetSheHe|U] passa todos os dias vigiando o local sagrado, a cada vigília [spiritual_mentor.GetSheHe] retorna para seu acampamento, nos arredores da cidade, e reza até o amanhecer e a lua partir.\"\n\nRespiro fundo antes de me aproximar da fogueira onde [spiritual_mentor.GetSheHe] descansa, após ouvir falar de seus prodígios.\n\n\"Eu estava esperando por você,\" [spiritual_mentor.GetSheHe] diz, olhando diretamente para mim, \"e [spiritual_mentor.GetFaith.HighGodName] também. Você está pronto para abandonar seus caminhos [ROOT.Char.Custom('SinfulTrait')|l]?\""
 pilgrimage.6790.t:0 "Um Despertar Espiritual em [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]"
 pilgrimage.6800.a:0 "\"Entendo. Você tem que fazer o que tem que fazer.\""
 pilgrimage.6800.b:0 "\"Não temos [ROOT.Char.GetFaith.HouseOfWorshipPlural] em nossa terra natal?\""
 pilgrimage.6800.c:0 "\"Abandone essa bobagem imediatamente.\""
 pilgrimage.6800.d:0 "\"Ficar para tramar #EMP contra mim#!? Nem pensar!\""
 pilgrimage.6800.desc:0 "Ao entrar nos terrenos sagrados, encontro [called_member.GetTitledFirstName], olhando para o altar com expressão ausente.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\", diz [called_member.GetSheHe], impassível, \"tenho algo a lhe dizer. [called_member.GetFaith.HighGodName] falou comigo e a voz de [called_member.GetFaith.HighGodHerHim] é clara, severa, precisa.\"\n\n\"Se eu pudesse ficar, gostaria de dedicar minha vida à fé [called_member.GetFaith.GetName] e me tornar um [GetTrait('devoted').GetName( called_member )].\""
 pilgrimage.6800.e.tt:0 "O clero local apreciará muito o gesto"
 pilgrimage.6800.e:0 "\"Maravilhoso! Também farei uma doação!\""
 pilgrimage.6800.monk_joins_court_toast:0 "[called_member.GetShortUIName|U] atendeu ao chamado de [called_member.GetHerHis] como [GetTrait('devoted').GetName( called_member )]"
 pilgrimage.6800.t:0 "O Chamado"
 pilgrimage.6810.a:0 "\"Por favor, interceda junto a [ROOT.Char.GetFaith.HighGodName] por mim.\""
 pilgrimage.6810.b:0 "Seria útil conseguir uma para [my_heir.GetFirstNameNoTooltip]."
 pilgrimage.6810.c:0 "\"Como alguém pode comprar a entrada no [ROOT.Char.GetFaith.DivineRealm]?\""
 pilgrimage.6810.desc:0 "\"...agora você pode ir, criança.\" Ouço [Select_CString( bishop_pilgrim.IsFemale, 'a', 'o' )] [bishop_pilgrim.GetTitledFirstName] murmurar quando entro na [ROOT.Char.GetFaith.HouseOfWorship]. O peregrino se curva antes de sair e consigo ver a mão do padre reluzindo em ouro.\n\n\"Ah, querido [ROOT.Char.GetTitleAsNameNoTooltip], você também deseja absolver seus pecados? [religious_head_scope.GetTitledFirstName] emitiu uma ordem para conceder indulgências a todos os peregrinos que visitam [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] — pelo preço certo, é claro.\""
 pilgrimage.6810.t:0 "Indulgência"
 pilgrimage.6820.a:0 "\"Eu vou levar um!\""
 pilgrimage.6820.b:0 "\"Deixe-me dar uma olhada — ah! E se você virar nesta rua...\""
 pilgrimage.6820.c:0 "[ROOT.Char.GetFaith.HighGodName] me guiará."
 pilgrimage.6820.desc:0 "Os mercados de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] estão agitados com comerciantes gritando em línguas que nunca ouvi, e vendendo especiarias que nunca provei.\n\n\"O guia do peregrino! Conheça as rotas mais seguras, descubra as maravilhas de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]!\" Um deles grita, acenando com um pequeno livro na minha direção."
 pilgrimage.6820.t:0 "O Guia do Peregrino"
 pilgrimage.6830.a:0 "Hora de rezar."
 pilgrimage.6830.b:0 "Olhe para esses arcos... lindos."
 pilgrimage.6830.c.tt:0 "Você perderá [votive_artifact.GetName]"
 pilgrimage.6830.c:0 "Devo fazer uma oferta."
 pilgrimage.6830.desc:0 "O eco dos meus próprios passos é o único som na [ROOT.Char.GetFaith.HouseOfWorship]. Estou sozinho. A última coisa que me lembro do mundo exterior é o rosto daqueles mendigos perto dos portões e o céu azul, azul. Tão distante agora.\n\nCaminho em direção ao altar sabendo que sou apenas eu, mas sinto um escrutínio implacável — os olhos severos de [ROOT.Char.GetFaith.HighGodName] estão sempre bem abertos."
 pilgrimage.6830.t:0 "Silêncio"
 pilgrimage.6840.a.tt:0 "Ganha [piety_i|E]#positive_value +2%#! [piety|E] mensal"
 pilgrimage.6840.a:0 "\"Por favor, torne meu [blessed_artifact.GetNameNoTooltip] mais piedoso!\""
 pilgrimage.6840.b.tt:0 "Ganha [prestige_i|E]#positive_value +0.5%#! [prestige|E] mensal"
 pilgrimage.6840.b:0 "\"Deixe todos verem a fama do meu [blessed_artifact.GetNameNoTooltip]!\""
 pilgrimage.6840.c:0 "Tenho coisas melhores para fazer com meu ouro."
 pilgrimage.6840.desc:0 "Um peregrino coloca uma boneca votiva diante do altar, inclinando a cabeça. Vejo [Select_CString( blessed_bishop.IsFemale, 'a', 'o' )] [blessed_bishop.GetTitledFirstName] abençoando-a e sussurrando algo em seu ouvido: \"...sagrado\" consigo ouvir.\n\nO [blessed_bishop.GetFaith.BishopNeuter] faz um gesto, \"Você também trouxe algo para ser abençoado, querido [ROOT.Char.GetTitleAsNameNoTooltip]?\""
 pilgrimage.6840.t:0 "Bênçãos Materiais"
 pilgrimage.6850.a:0 "Eu lançarei luz onde há sombra."
 pilgrimage.6850.b:0 "Se eu estiver cego, meu [ROOT.Char.GetCouncillorPosition( 'councillor_spymaster' ).GetPositionName] será meus olhos."
 pilgrimage.6850.c.flavor:0 "Você prende seu [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]"
 pilgrimage.6850.c:0 "Conheço um oficial corrupto que é um [ROOT.Char.GetFaith.PriestNeuter] perverso."
 pilgrimage.6850.desc:0 "Acordo de um sono agitado e diante de mim, na escuridão, surge uma figura. Enquanto reflito sobre minha próxima vida, [wise_priest.GetName] emerge das sombras, com o rosto iluminado por um sorriso irônico.\n\n“Nobre [ROOT.Char.GetTitleAsNameNoTooltip], perdoe nossa intrusão, algumas lições devem ser vividas para serem compreendidas.\n\nUm ladrão usa sombras, pontos cegos e oficiais corruptos para auxiliar em seu crime. De forma semelhante, um [ROOT.Char.GetFaith.PriestNeuter] perverso se entrega a comportamentos lascivos nas sombras, prega doutrina falsa em seus pontos cegos e é elevado a altos cargos por oficiais corruptos.\""
 pilgrimage.6850.t:0 "Um Mestre Ladrão"
 pilgrimage.7000.a.tt:0 "Hora de iniciar minha jornada de volta para casa"
 pilgrimage.7000.a:0 "[ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip], foi uma honra."
 pilgrimage.7000.a_cynical:0 "Embora interessante, estou ansioso para dormir na minha própria cama."
 pilgrimage.7000.a_hajj:0 "Que eu possa ver suas paredes novamente!"
 pilgrimage.7000.a_hajj_cynical:0 "Embora cético, foi bastante grandioso."
 pilgrimage.7000.b:0 "Eu me arrependo!"
 pilgrimage.7000.desc_high_pious:0 "Estou satisfeito sabendo que a maioria, senão todas, das minhas decisões ao longo de nossa jornada de [activity.Custom('PilgrimageLength')] foram tomadas para provar minha devoção a [ROOT.Char.GetFaith.HighGodNameAlternate] e [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]."
 pilgrimage.7000.desc_high_worldly:0 "Estou satisfeito em saber que nossa jornada de [activity.Custom('PilgrimageLength')] satisfez o aspecto mundano de [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip], e, por extensão, a mim mesmo."
 pilgrimage.7000.desc_low_pious:0 "Estou um pouco preocupado por não ter tido a chance de provar minha devoção a [ROOT.Char.GetFaith.HighGodName] tanto quanto eu gostaria."
 pilgrimage.7000.desc_low_worldly:0 "Estou um pouco preocupado por não ter vivenciado tanto de outras culturas e paisagens quanto eu gostaria."
 pilgrimage.7000.desc_mid_pious:0 "Sinto-me tranquilo sabendo que, embora eu possa não ter sido o peregrino mais piedoso, provei minha dedicação a [ROOT.Char.GetFaith.HighGodNameAlternate] de mais de uma maneira."
 pilgrimage.7000.desc_mid_worldly:0 "Eu posso ter perdido algumas oportunidades mundanas, mas estou geralmente feliz com a experiência."
 pilgrimage.7000.desc_obligatory:0 "Tendo corrido durante nossa visita aqui, minha principal preocupação é voltar para casa para que eu possa continuar minhas atividades regulares.\n\nEspero que [ROOT.Char.GetFaith.HighGodNameAlternate] entenda que estou com pouco tempo, mas que eu ainda possa receber a sua satisfação em relação à minha [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName].\n\nMeus [ROOT.Char.GetFaith.AltPriestTermPlural] não devem ter reclamações, de qualquer maneira."
 pilgrimage.7000.desc_perfect_pious:0 "Estou extasiado porque esta peregrinação foi, se não a mais devota de todas, uma das mais devotas de todos os tempos. [ROOT.Char.GetFaith.HighGodNameAlternate] está sorrindo para mim."
 pilgrimage.7000.desc_perfect_worldly:0 "Estou extasiado com o resultado desta peregrinação; as paisagens que vi e as experiências que obtive - verdadeiramente, foi um sucesso!"
 pilgrimage.7000.intro:0 "À medida que nosso tempo neste local sagrado chega ao fim,"
 pilgrimage.7000.intro_hajj:0 "O fim do Hajj deste ano se aproxima. Após dois dias de Ramy al-Jamarat, ou 'a lapidação do diabo', estou pronto para completar o ritual final de Tawaf al-Wadaa e me despedir de Meca.\n\n"
 pilgrimage.7000.outro_buried_predecessor_here:0 "\n\nApesar dos eventos infelizes que levaram ao falecimento de meu antecessor, [old_pilgrimage_host.GetTitledFirstName], e do luto evidente que coloriu esta jornada, a peregrinação em si revelou-se uma experiência interessante, que guardarei com carinho."
 pilgrimage.7000.outro_bury_predecessor_home:0 "\n\nAgora que cumprimos o ato honroso e estamos finalizando a peregrinação [Select_CString( old_pilgrimage_host.IsFemale, 'da', 'do' )] [old_pilgrimage_host.GetTitledFirstName] a este lugar, resta apenas retornar em segurança para casa e dar o descanso final a [old_pilgrimage_host.GetSheHe]."
 pilgrimage.7000.outro_first:0 "\n\nSendo esta minha primeira peregrinação, e embora nenhuma peregrinação seja exatamente igual, sinto-me confiante de que estou mais familiarizado com o que esperar desse tipo de jornada espiritual no futuro."
 pilgrimage.7000.outro_first_hajj:0 "\n\nSendo esta minha primeira Hajj, fico feliz por ter empreendido a jornada para vir até aqui, participando dos ritos e conhecendo espíritos afins. Verdadeiramente, sinto que meu espírito está elevado e mais próximo de [ROOT.Char.GetFaith.HighGodName] do que nunca."
 pilgrimage.7000.outro_multi:0 "\n\nDe todas as minhas [ROOT.Char.Custom('PilgrimageAmount')] peregrinações, esta tem sido a mais esclarecedora até agora."
 pilgrimage.7000.outro_multi_hajj:0 "\n\nTendo estado aqui muitas vezes antes, é sempre um verdadeiro prazer realizar a Hajj. Estamos unidos pela fé e verdadeiramente somos o povo de [ROOT.Char.GetFaith.HighGodName]."
 pilgrimage.7000.outro_new_holy_site:0 "\n\nTambém estou empolgado com a ideia de ter visitado um novo local sagrado!"
 pilgrimage.7000.outro_second:0 "\n\nSendo esta minha segunda peregrinação, não posso deixar de compará-la à minha visita anterior a [first_pilgrimage_memory.MakeScope.Var('pilgrimage_destination').GetProvince.GetNameNoTooltip], com toda a sua santidade."
 pilgrimage.7000.outro_second_hajj:0 "\n\nSendo esta minha segunda Hajj, conheci novos amigos e reencontrei rostos familiares desde minha última visita."
 pilgrimage.7000.outro_second_revisit:0 "\n\nEsta peregrinação marca minha segunda visita, mas também meu reencontro, ao local sagrado de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]. Não tenho arrependimentos de vir aqui novamente e maravilhar-me com sua santidade e esplendor."
 pilgrimage.7000.t:0 "Conclusão"
 pilgrimage.7000.t_hajj:0 "$pilgrimage_header$ Tawaf al-Wadaa"
 pilgrimage.7000.t_obligatory:0 "[ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]: ... Feito"
 pilgrimage.9001.a.tt:0 "Sua jornada chegou ao fim"
 pilgrimage.9001.a:0 "É bom estar em casa."
 pilgrimage.9001.a_invalidated:0 "Que seja como for."
 pilgrimage.9001.desc:0 "Embora muitas coisas permaneçam iguais, algo mudou na forma como os [ROOT.Char.GetFaith.PriestNeuterPlural] me tratam.\n\nPassei pela jornada de um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] sagrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], e eles insistem que isso mudou algo em mim, mesmo que eu não possa ver por conta própria."
 pilgrimage.9001.desc_buried_there:0 "Com a determinação de concluir a peregrinação [Select_CString( old_pilgrimage_host.IsFemale, 'da', 'do' )] [old_pilgrimage_host.GetTitledFirstName], agora descanso tranquilamente sabendo que [old_pilgrimage_host.GetSheHe] encontra-se em seu local de descanso final, na santidade de [burial_location.GetNameNoTierNoTooltip].\n\nE embora muitas coisas permaneçam iguais, meus [ROOT.Char.GetFaith.AltPriestTermPlural] insistem que esta jornada sagrada mudou algo em mim, mesmo que eu não possa ver por conta própria."
 pilgrimage.9001.desc_intro:0 "Minha jornada foi longa, mas finalmente estou em casa novamente. "
 pilgrimage.9001.desc_invalidated:0 "\n\nDevido a uma sequência de eventos infelizes, minha peregrinação foi interrompida e infelizmente não tive a oportunidade de visitar [missed_holy_site.GetNameNoTooltip]. Isso me incomoda, mas menos a cada dia.\n\nSó posso assumir que tudo isso faz parte do plano de [ROOT.Char.GetFaith.HighGodNameAlternate]."
 pilgrimage.9001.t:0 "$pilgrimage_header$ O Retorno"
 pilgrimage.9010.a.flavor:0 "$pilgrimage.4020.a.flavor$"
 pilgrimage.9010.a:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip], um coração, um lar."
 pilgrimage.9010.a_adventurer:0 "Pelo menos estamos de volta em uma só peça."
 pilgrimage.9010.a_interrupted:0 "Pelo menos estamos em casa e inteiros."
 pilgrimage.9010.desc.invalidated_pilgrimage_liked:0 "Lamento a morte [old_pilgrimage_host.GetHerHim] e sinto grande remorso por não ter conseguido [Select_CString( old_pilgrimage_host.IsFemale, 'sepultá-la', 'sepultá-lo' )] em [previous_holy_site.GetNameNoTierNoTooltip]."
 pilgrimage.9010.desc.invalidated_pilgrimage_neutral:0 "Estou um pouco [Select_CString( ROOT.Char.IsFemale, 'chateada', 'chateado' )] por não ter tido a oportunidade de sepultar [old_pilgrimage_host.GetSheHe] em [previous_holy_site.GetNameNoTierNoTooltip], mas, para todos os efeitos, [old_pilgrimage_host.GetSheHe] finalmente foi devidamente [Select_CString( old_pilgrimage_host.IsFemale, 'sepultada', 'sepultado' )]."
 pilgrimage.9010.desc.relation_family:0 "Chegamos em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] no final da tarde, e os servos, #EMP meus#! servos, imediatamente começam a fazer os arranjos necessários para sepultar [Select_CString( old_pilgrimage_host.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_pilgrimage_host'))] em seu descanso final.\n\n"
 pilgrimage.9010.desc.relation_liked:0 "Chegamos em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] no final da tarde, e os servos, #EMP meus#! servos, imediatamente começam a fazer os arranjos necessários para sepultar [Select_CString( old_pilgrimage_host.IsFemale, 'a querida', 'o querido' )] [old_pilgrimage_host.GetFirstName] em seu descanso final.\n\n"
 pilgrimage.9010.desc.relation_neutral:0 "Chegamos em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] no final da tarde, e os servos, #EMP meus#! servos, imediatamente começam a fazer os arranjos necessários para sepultar [Select_CString( old_pilgrimage_host.IsFemale, 'a', 'o' )] [old_pilgrimage_host.GetTitledFirstName] em seu descanso final.\n\n"
 pilgrimage.9010.desc.there_and_back_liked:0 "Enquanto lamento a morte [old_pilgrimage_host.GetHerHim], encontro consolo no fato de que cumpri os desejos [old_pilgrimage_host.GetHerHim] e completei nossa peregrinação a [previous_holy_site.GetNameNoTierNoTooltip].\n\nVerdadeiramente, [old_pilgrimage_host.GetSheHe] deve estar [Select_CString( old_pilgrimage_host.IsFemale, 'satisfeita', 'satisfeito' )] onde quer que esteja, e isso traz um sorriso tímido ao meu rosto."
 pilgrimage.9010.desc.there_and_back_neutral:0 "Ter viajado para [previous_holy_site.GetNameNoTierNoTooltip] e voltado para honrar os desejos [Select_CString( old_pilgrimage_host.IsFemale, 'da', 'do' )] [old_pilgrimage_host.GetTitledFirstName] me deu credibilidade com seus [ROOT.Char.Custom('GetCourtierPlural')|l], #EMP meus#! [ROOT.Char.Custom('GetCourtierPlural')|l], e estou começando a me acostumar a ser o novo [ROOT.Char.GetTitleAsNameNoTooltip] por aqui."
 pilgrimage.9010.desc.turned_back_liked:0 "É com o coração pesado que supervisiono os rituais e tento encontrar algum conforto no fato de que [ROOT.Char.GetFaith.HighGodName] realmente deve ter estado com [old_pilgrimage_host.GetSheHe] quando [old_pilgrimage_host.GetSheHe] morreu, a caminho do local sagrado de [previous_holy_site.GetNameNoTierNoTooltip].\n\nAfinal, quem mais [ROOT.Char.GetFaith.HighGodNameAlternate] protegeria se não os peregrinos?"
 pilgrimage.9010.desc.turned_back_neutral:0 "Enquanto ainda me acostumo com meu novo [ROOT.Char.Custom('GetRealmOrDomicile')|l], com [ROOT.Char.Custom('GetCourtierPlural')|l] correndo para o meu lado em um esforço para ganhar minha benevolência, trazer de volta o corpo [Select_CString( old_pilgrimage_host.IsFemale, 'da', 'do' )] [old_pilgrimage_host.GetTitledFirstName] ajuda a cimentar o fato de que [old_pilgrimage_host.GetSheHe] não está voltando e que #EMP eu#! sou o novo [ROOT.Char.GetTitleAsNameNoTooltip]."
 pilgrimage.9010.t:0 "$pilgrimage_header$ Regresso ao Lar"
 pilgrimage.9100.a:0 "O dinheiro fala comigo."
 pilgrimage.9100.a_double.tt:0 "Você vende as mercadorias pelo dobro do valor"
 pilgrimage.9100.a_has_gift:0 "Não me importo se eu fizer isso!"
 pilgrimage.9100.a_triple.tt:0 "Você vende as mercadorias pelo triplo do valor"
 pilgrimage.9100.b.tt:0 "Você terá a oportunidade de usar as mercadorias para aumentar o poder e a chance de sucesso do seu próximo [personal_scheme|E]."
 pilgrimage.9100.b:0 "Seria sábio guardar essas mercadorias."
 pilgrimage.9100.desc:0 "agora preciso decidir o que fazer com elas.\n\nDevo vendê-las com lucro ou talvez guardá-las como presente para meu próximo esquema pessoal... ?"
 pilgrimage.9100.desc_has_gift:0 "chegou a hora de colher as recompensas e vendê-las com lucro."
 pilgrimage.9100.desc_intro:0 "Depois de carregar minhas mercadorias exóticas até [ROOT.Var('6540_exotic_wares_location').GetProvince.GetName],"
 pilgrimage.9100.t:0 "$pilgrimage_header$ Mercadorias Exóticas"
