l_spanish:
 ACTIVITY_PILGRIMATE_VISITED_HOLY_SITE:0 "Visitou o [holy_site|E] de $ACTIVITY_CURRENT_LOCATION$"
 BETEL_LEAVES_GLOSS:0 "A folha brilhante da videira de betel, mastigada com noz de areca e cal em uma prática comum no Sul e Sudeste Asiático. Frequentemente usada em rituais ou comércio."
 BRAHMACHARAYA_GLOSS:0 "Sânscrito para 'engajar-se na conduta do Brahman' ou praticar um estilo de vida propício à busca de conhecimento sagrado e libertação espiritual. Isso é parcialmente alcançado ao se esforçar por um estado desprovido de desejo."
 BUBU_GLOSS:0 "Elaboradas armadilhas de bambu para peixes, frequentemente instaladas em estuários e deltas de mangue."
 DJONG_GLOSS:0 "Uma embarcação javanesa da era medieval, construída em teca e mantida unida sem ferro."
 JALA_GLOSS:0 "Redes circulares com peso de chumbo na borda, habilmente lançadas à mão a partir de barcos ou da costa."
 MATHEW_24_36_GLOSS:0 "Mas a respeito daquele dia e hora ninguém sabe, nem os anjos dos céus, nem o Filho, senão unicamente o Pai. Mateus 24:36"
 NAGA_GLOSS:0 "Um espírito serpente reverenciado no Sul e Sudeste Asiático, frequentemente visto como guardião das águas, da fertilidade e do submundo. Nem totalmente divino nem mortal, os nāgas são ao mesmo tempo temidos e venerados."
 PAWANG_GLOSS:0 "Um ritualista que supostamente controla o clima, animais selvagens e espíritos. Temido e respeitado na mesma medida."
 PEDANG_GLOSS:0 "Uma lâmina reta, de um gume, usada por guerreiros malaios e javaneses."
 PRADAKSHINA_GLOSS:0 "Sânscrito para 'à direita', denota o caminho que se segue para circundar 'no sentido do sol' um santuário em práticas hindus e budistas. Isso é feito para assegurar um renascimento favorável."
 PUJA_GLOSS:0 "Puja são expressões de honra, adoração e atenção devocional praticadas por hindus e budistas"
 RATTAN_GLOSS:0 "Uma palmeira trepadeira valorizada por sua força e flexibilidade. Tecida em cestos, amarras e armadilhas, o rattan é uma ferramenta comum da vida na selva usada por caçadores, comerciantes e aldeões."
 SAMPAN_GLOSS:0 "Um pequeno barco de fundo chato comum em rios e águas costeiras do Sudeste Asiático. Normalmente feito de madeira e remado ou empurrado com vara; usado para pesca, viagens e comércio fluvial."
 TANAH_MAKKAH_GLOSS:0 "No Sudeste Asiático, Meca (Makkah) passou a representar toda a Arábia. 'Tanah Makkah' significa 'Terra de Meca' e aparece em manuscritos islâmicos antigos da região."
 a_good_omen_tt:0 "Talvez isso seja um bom presságio para o futuro..."
 a_good_prophecy_tt:0 "Você recebe uma profecia favorável para a jornada à frente... ou talvez sejam apenas palavras vazias?"
 activity_pilgrimage:0 "Peregrinação"
 activity_pilgrimage_conclusion_desc:0 "Nossa Peregrinação foi concluída com sucesso"
 activity_pilgrimage_desc:0 "$game_concept_pilgrimage_desc$"
 activity_pilgrimage_destination_selection:0 "Quanto mais longe do seu capital for o seu destino, mais você prova sua dedicação a [GetPlayer.GetFaith.PantheonTerm] e ganha [piety|E] adicional."
