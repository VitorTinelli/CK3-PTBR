l_spanish:
 EBOSHI_GLOSS:0 "Um chapéu alto e envernizado, feito de papel rígido. Era presenteado aos nobres quando atingiam a maioridade e simbolizava status, masculinidade e pessoa. Servia para proteger o 'motodori' ou coque superior, mantendo-o limpo (e assim puro)."
 GUESTS_LIKED_DEFACING:0 "#z [CHARACTER.MakeScope.Var('num_unhappy_guests').GetValue|0]#! convidados apreciam esta ação:"
 MOTODORI_GLOSS:0 "O estilo de coque usado no período Heian. Diferente de estilos posteriores como o 'chonmage', não havia prática de raspar o topo da cabeça."
 every_attending_travel_companion_goh:0 "Cada membro do séquito"
 every_drunkard_guest_scope_tt:0 "Cada convidado bêbado presente"
 every_evil_guest_scope_tt:0 "Cada convidado antipático"
 feast_default.1001.a:0 "[impressed_guest.GetSheHe|U] reconhece o verdadeiro intelecto, eu vejo."
 feast_default.1001.average_learning:0 "Depois de ter falado durante o jantar por um tempo, [impressed_guest.GetTitledFirstName] inclina-se para me dizer que acha impressionante o quão bem informado eu sou sobre tantas assuntos diferentes."
 feast_default.1001.high_learning:0 "Após uma longa conversa durante a nossa refeição, [impressed_guest.GetTitledFirstName] expressa que está [Select_CString( impressed_guest.IsFemale, 'admirada', 'admirado' )] como sou capaz de expor longamente qualquer assunto."
 feast_default.1001.low_learning:0 "Enquanto estou conversando com as pessoas durante o jantar, [impressed_guest.GetTitledFirstName] inclina-se. \"Eu gostaria de saber como soar tão inteligente quanto você, [ROOT.Char.GetTitledFirstName]!\"\n\nLimpo a sopa do meu queixo e dou um sorriso de aparência inteligente."
 feast_default.1001.t:0 "Maravilhado"
 feast_default.1001.very_high_learning:0 "Depois de uma longa conversa sobre nossos pratos requintados, [impressed_guest.GetTitledFirstName] expressa que [impressed_guest.GetSheHe] acha-me mais erudito e sábio, e que minhas declarações são sempre de valor inestimável para aqueles menos instruídos."
 feast_default.1002.a:0 "Eu posso sentir o cheiro da cozinha, também!"
 feast_default.1002.desc:0 "Eu não posso acreditar quanto tempo estamos esperando pela comida! Estamos aqui para comer ou para admirar o grão da mesa de madeira? O que você está olhando, [other_guest.GetTitledFirstName], só estou com muita fome!"
 feast_default.1002.gluttons_and_impatients:0 "Todos os Convidados Impacientes e Gulosos"
 feast_default.1002.t:0 "A Agoniante Espera"
 feast_default.1003.a:0 "Eu digo algumas coisas inteligentes às vezes."
 feast_default.1003.b:0 "Eu não tinha percebido que [other_guest.GetSheHe] se sentiu assim!"
 feast_default.1003.desc:0 "Depois de comer juntos por um tempo, devo ter dito algo particularmente inteligente, porque [Select_CString( other_guest.IsFemale, 'a', 'o' )] [other_guest.GetTitledFirstName] me elogiou por ser inteligente!\n\nEm resposta, sorrio inteligentemente para meu colega, antes de me ocupar com a gordura escorrendo pelo meu queixo."
 feast_default.1003.t:0 "Maravilhado"
 feast_default.1004.a:0 "Delicioso!"
 feast_default.1004.a_meager:0 "Lamentável!"
 feast_default.1004.b:0 "Isso é incrível! Passe-me outra porção!"
 feast_default.1004.b_meager:0 "Isso é tudo? Haverá repetições?"
 feast_default.1004.desc:0 "Ah, que carne é essa, tão rica em sabor? O que são esses vegetais, quase doces? Ah, e essas pequenas sobremesas maravilhosas!\n\nEsta festa tem algumas das melhores comidas que já provei!"
 feast_default.1004.desc_exotic:0 "Ah, que tipo de comida é esta, tão rica em sabor? Nunca antes eu vi ou provei uma iguaria exótica tão incrível! Ah, e esses doces maravilhosamente luxuosos!\n\nEste banquete tem pratos incríveis que nunca provei antes e temo que nunca provarei novamente! Preciso perguntar a origem!"
 feast_default.1004.desc_lavish:0 "Que vasta e infindável variedade de alimentos e sobremesas! São estes o tipo de refeições que posso esperar em [ROOT.GetFaith.PositiveAfterLife]? Ah, e que variedade de doces!\n\nEsta deve ser a maior quantidade de comida que eu já vi em um só lugar!"
 feast_default.1004.desc_meager:0 "O que é isso? Há alguma carne neste osso? Os homens costumam comer vegetais tão pequenos? São estes o tipo de refeições que posso esperar em [ROOT.GetFaith.NegativeAfterLife]? Ah, e onde estão os doces?\n\nDeve ser assim que os Camponeses comem!"
 feast_default.1004.t:0 "Delícias Celestiais"
 feast_default.1005.a:0 "Deve haver algum lugar onde eu possa ficar sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 feast_default.1005.b:0 "[friendly_guest.GetFirstNameNoTooltip], não me deixe sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com essas feras!"
 feast_default.1005.c:0 "\"Uh, eu... eu... Estamos tendo um clima assustador, não é?\""
 feast_default.1005.desc:0 "É muito. A tagarelice incessante das pessoas ao meu redor, a multidão de rostos olhando para mim para conversar... #EMP Pessoal#!...\n\nEu sabia que este banquete seria uma tarefa árdua, mas nunca imaginei a escala disso."
 feast_default.1005.desc_friendly_guest:0 "\n\nTenho sorte que [friendly_guest.Custom2('MyCharacterIntroduction', ROOT.Char )] está aqui, pelo menos."
 feast_default.1005.t:0 "Isolamento"
 feast_default.1006.a:0 "Eu só faço o que parece certo!"
 feast_default.1006.b:0 "Mais uma rodada, pessoal!"
 feast_default.1006.c:0 "Não há outra maneira de viver verdadeiramente, meus amigos!"
 feast_default.1006.desc:0 "Ah, não há nada como um banquete! Isso nos faz lembrar o que é bom na vida, e os convidados também não são tão ruins! Pelo menos aqueles sentados perto de mim parecem alegres e animados.\n\nLogo [Select_CString( guest_1.IsFemale, 'a', 'o' )] [guest_1.GetTitledFirstName] me elogia na frente de todos todos no salão \"Você é uma pessoa muito especial, [ROOT.Char.GetFirstNameNoTooltip]\", meus outros convidados, [Select_CString( guest_2.IsFemale, 'a', 'o' )] [guest_2.GetTitledFirstName] e [Select_CString( guest_3.IsFemale, 'a', 'o' )] [guest_3.GetTitledFirstName] acenam com a cabeça concordando com suas palavras e brindando em minha glória."
 feast_default.1006.t:0 "Em Casa"
 feast_default.1006.table_companions:0 "Todos sentados perto de mim"
 feast_default.1007.a:0 "Juntos poderíamos comer um cavalo inteiro!"
 feast_default.1007.b:0 "Tenho certeza que posso comer mais do que [other_glutton.GetSheHe]."
 feast_default.1007.desc:0 "Com o serviço incessante de deliciosos pratos, a maioria dos convidados desistem de comer durante a noite, por estarem satisfeitas e simplesmente aproveitam o entretenimento. Fico feliz de que [Select_CString( other_glutton.IsFemale, 'a', 'o' )] [other_glutton.GetTitledFirstName] e eu sabemos das coisas!\n\n[other_glutton.GetSheHe|U] e eu estamos ansiosos para provar, enquanto houver comida!"
 feast_default.1007.t:0 "Voraz"
 feast_default.1008.a.flavor:0 "#F [secret_recipient.GetSheHe|U] não acredita em minhas desculpas...#!"
 feast_default.1008.a:0 "O que foi que eu fiz..."
 feast_default.1008.desc:0 "Quando os olhos [Select_CString( secret_recipient.IsFemale, 'da', 'do' )] [secret_recipient.GetTitledFirstName] se arregalam com minhas palavras, percebo o que acabei de admitir. Luto para afastar minha bebida.\n\n\"Bebi demais.\" Tento me levantar, cambaleando um pouco. \"Não confie em uma palavra do que eu digo!\""
 feast_default.1008.t:0 "Julgamento Manchado"
 feast_default.1009.a:0 "O que foi que eu fiz..."
 feast_default.1009.desc:0 "Quando os olhos [Select_CString( secret_recipient.IsFemale, 'da', 'do' )] [secret_recipient.GetTitledFirstName] se arregalam com minhas palavras, percebo o que acabei de dizer sobre [secret_owner.GetTitledFirstName]. Luto para afastar minha bebida.\n\n\"Bebi demais.\" Tento me levantar, cambaleando um pouco. \"Não confie em uma palavra do que eu digo!\""
 feast_default.1009.t:0 "Julgamento Manchado"
 feast_default.1010.a:0 "Uma promessa é uma promessa, não importa o quê."
 feast_default.1010.b:0 "Foram apenas divagações bêbadas!"
 feast_default.1010.desc:0 "O que eu prometi ontem à noite? Não consigo lembrar o que levou a isso, mas lembro de ter dado um tapa nas costas [Select_CString( favor_recipient.IsFemale, 'da', 'do' )] [favor_recipient.Custom2('MyCharacterIntroduction', ROOT.Char )], dizendo a [favor_recipient.GetSheHe] que eu faria qualquer coisa que [favor_recipient.GetSheHe] me pedisse.\n\nAgora abundam os rumores do \"juramento\" que fiz!"
 feast_default.1010.every_participant_with_high_opinion:0 "Todos os outros participantes respeitam [Select_CString( favor_recipient.IsFemale, 'a', 'o' )] [favor_recipient.GetFirstNameNoTooltip]"
 feast_default.1010.t:0 "Um Juramento Surpreendente"
 feast_default.1011.a.failure:0 "As pessoas não acreditam em minha mentira"
 feast_default.1011.a.success:0 "As pessoas acreditam que foi um acidente"
 feast_default.1011.a:0 "[guest_to_murder.GetSheHe|U] se jogou sobre minha faca! Eu juro!"
 feast_default.1011.b.failure:0 "Estou exposto como o assassino"
 feast_default.1011.b.success:0 "O assassinato permanece um mistério"
 feast_default.1011.b:0 "Eu..euu preciso limpar a lâmina...!"
 feast_default.1011.c:0 "[disliked_guest.GetTitledFirstNameNoTooltip], como você pode?!"
 feast_default.1011.desc:0 "É intoxicante — a bebida no meu sangue e a raiva nas minhas veias.\n\n[Select_CString( guest_to_murder.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_murder'))] [guest_to_murder.GetTitledFirstName] tromba comigo do lado de fora do salão, e eu confundo [guest_to_murder.GetSheHe] com [Select_CString( disliked_guest.IsFemale, 'a', 'o' )] [disliked_guest.Custom2('InsultAdjective', ROOT.Char)] [disliked_guest.GetTitledFirstName]. Em um instante o sangue [guest_to_murder.GetHerHim] pinga da minha lâmina. Quando o corpo [guest_to_murder.GetHerHim] desaba no chão, de repente me sinto muito sóbrio."
 feast_default.1011.t:0 "No Caminho da Guerra"
 feast_default.1012.a:0 "Um brinde a [guest_to_murder.GetTitleTierName|U], e sua sede de vida!"
 feast_default.1012.desc_opening:0 "A aceitação feliz [Select_CString( guest_to_murder.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('guest_to_murder'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_murder'))] [guest_to_murder.GetTitledFirstName] de mais um copo abafa os respingos de minha própria bebida enquanto eu a derramo no chão.\n\nÀ medida que sua respiração fica difícil e toda a cor deixa seu rosto, posso sentir o sorriso se espalhando pelo minha boca. Uma pequena risada me escapa quando seu rosto bate na mesa."
 feast_default.1012.t:0 "Líquidos Letais"
 feast_default.1013.a:0 "Quem diria que talheres poderiam ser tão afiados?"
 feast_default.1013.a_1:0 "Espero que [ROOT.Char.GetFaith.NegativeAfterLife] receba aquel[Select_CString( guest_to_kill.IsFemale, 'a', 'e' )] [guest_to_kill.Custom2('InsultNoun', ROOT.Char)] [guest_to_kill.Custom2('InsultAdjective', ROOT.Char)] calorosamente."
 feast_default.1013.b.big_failure:0 "Eu falhei"
 feast_default.1013.b.failure:0 "Eu #EMP quase#! consigo"
 feast_default.1013.b.success:0 "Ninguém se feriu"
 feast_default.1013.b:0 "Vou desviar a faca!"
 feast_default.1013.c:0 "...e corro direto para me esconder"
 feast_default.1013.d:0 "\"Eu agi em defesa d[Select_CString( guest_to_save.IsFemale, 'a', 'o' )] [guest_to_save.GetFirstNameNoTooltip], todos vocês viram.\""
 feast_default.1013.desc:0 "Enquanto [Select_CString( guest_to_kill.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('guest_to_kill'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_kill'))] [guest_to_kill.GetTitledFirstName] avança em direção [Select_CString( guest_to_save.IsFemale, 'a minha', 'ao meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_save'))] [guest_to_save.GetTitledFirstName] com fúria queimando nos olhos [guest_to_kill.GetHerHim] e uma faca na mão [guest_to_kill.GetHerHim], eu nem paro para pensar.\n\nAgarro a coisa mais próxima que possa servir como arma e avanço."
 feast_default.1013.t:0 "Protetor"
 feast_default.1014.a:0 "Por favor, [witness.GetTitledFirstNameNoTooltip], não conte para ninguém!"
 feast_default.1014.a_2:0 "Você não vai contar a ninguém o que viu."
 feast_default.1014.b:0 "Fale sobre estar no lugar errado na hora errada!"
 feast_default.1014.desc:0 "[Select_CString( guest_to_murder.IsFemale, 'Minha', 'Meu' )] [guest_to_murder.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_murder'))] [guest_to_murder.GetTitledFirstName] dá um sorriso debochado enquanto eu cambaleio para fora em busca de um lugar para me aliviar. A raiva que já ferve nas minhas veias ganha um impulso devastador quando [guest_to_murder.GetSheHe] caminha em minha direção. \"Olha só quem é! [Select_CString( ROOT.Char.IsFemale, 'A', 'O' )] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('guest_to_murder'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('guest_to_murder'))] [ROOT.Char.GetFirstNameNoTooltip]! Aposto que você—\"\n\nNo instante em que afundo minha lâmina no rosto irritante [Select_CString( guest_to_murder.IsFemale, 'da', 'do' )] [guest_to_murder.GetFirstName], ouço um leve suspiro atrás de mim."
 feast_default.1014.t:0 "A Testemunha"
 feast_default.1016.a:0 "Isso certamente #EMP é#! uma bela bugiganga."
 feast_default.1016.a_greedy:0 "Talvez não se importe se eu fizer isso!"
 feast_default.1016.a_hesitant:0 "Eu simplesmente não consigo me controlar..."
 feast_default.1016.b:0 "Não. Isso não está certo."
 feast_default.1016.desc_default:0 "\n\n[activity.GetOwner.GetTitledFirstNameNoTooltip] com certeza parece estar bem, [activity.GetOwner.GetSheHe] não poderia perder esta bugiganga minúscula..."
 feast_default.1016.desc_greedy:0 "\n\nSeria um crime para mim #EMP não#! aliviá-lo de sua solidão! Dou uma rápida olhada ao redor da sala para ter certeza de que não estou sendo observado."
 feast_default.1016.desc_hesitant:0 "\n\nEu cerro meu punho com firmeza em uma tentativa de superar meu desejo, esperando que ninguém perceba."
 feast_default.1016.desc_intro:0 "Olho ao redor da sala animada. As chamas rugem, as bebidas continuam a ser servidas. Petiscos deliciosos são entregues a toda mão vazia e o clima é de pura alegria.\n\nEm um canto escuro, captando o brilho das luzes, noto o [trinket_to_steal.GetName]. Parece abandonado em uma das mesas laterais e praticamente chama meu nome."
 feast_default.1016.t:0 "Bugigangas Brilhantes"
 feast_default.1016.tt:0 "Bugiganga Roubada"
 feast_default.1017.a:0 "Isto não é bom."
 feast_default.1017.b:0 "Isto é excelente!"
 feast_default.1017.b_honest:0 "Espero que ninguém descubra..."
 feast_default.1017.desc_discovered:0 "\n\nA adrenalina aumenta, mas... tenho a sensação desconfortável de que não fui a única testemunhando meu assalto.\n\nO tempo dirá..."
 feast_default.1017.desc_intro:0 "Eu me aproximo da mesa lateral, mantendo as conversas com os convidados pelos quais passo pelo caminho.\nComo estou perto de [new_trinket.GetName], em um único movimento eu rapidamente, mas gentilmente empurro o item para a borda da mesa e para dentro do meu guardanapo. Sucesso!"
 feast_default.1017.desc_stealth:0 "\n\nA adrenalina, o som do meu coração batendo no meu peito e aquele doce sabor de vitória sobre uma aquisição bem-sucedida.\n\nNeste momento, nada mais importa."
 feast_default.1017.t:0 "O Que Se Esconde na Sombra"
 feast_default.1018.a:0 "Eu tenho uma bolsa de moedas aqui que posso te dar."
 feast_default.1018.a_contempt:0 "Pegue esta bolsa de moedas e vá embora!"
 feast_default.1018.a_tt:0 "[witness.GetTitledFirstNameNoTooltip] melhor manter isso para [Select_CString( witness.IsFemale, 'si mesma', 'si mesmo' )]!"
 feast_default.1018.b:0 "Essa coisa velha? Nunca vi."
 feast_default.1018.b_contempt:0 "Essa coisa velha? Nunca. Vi. Isso."
 feast_default.1018.c:0 "Olhos... #EMP e mãos#! nele!"
 feast_default.1018.desc_default:0 "\n\nMeu coração bate forte nos meus ouvidos enquanto sinto um filete de suor escorrendo pelas minhas costas. Este é o risco que eu corro em troca daquele doce e único momento de aquisição."
 feast_default.1018.desc_greedy:0 "\n\nComo [witness.GetSheHe] ousa! Unhas cravadas na palma das minhas mãos, eu me esforço para não olhar abertamente para essa presunção [Select_CString( witness.IsFemale, 'da', 'do' )] [witness.GetTitledFirstNameNoTooltip] enquanto eu tento descobrir o meu próximo passo."
 feast_default.1018.desc_intro:0 "Do nada, um emissário [Select_CString( witness.IsFemale, 'da', 'do' )] [witness.GetTitledFirstName], chamado [witness_proxy.GetTitledFirstName], aparece à minha porta. \"Saudações, [ROOT.Char.Custom('FormOfAddressForLiege')]! Trago notícias [Select_CString( witness.IsFemale, 'da', 'do' )] [witness.GetTitledFirstNameNoTooltip].\"\n\nO emissário parece um pouco desconfortável: \"[witness.GetTitledFirstNameNoTooltip] tornará público que [feast_host.GetTitledFirstName] tem procurado por seu(a) [trinket_to_steal.GetName] e... \", [witness_proxy.GetSheHe] faz uma breve pausa, \"pelo visto, meu [witness.Custom('MistressMaster')] acredita que você pode ter colocado os olhos nele durante o banquete?\" [witness_proxy.GetTitledFirstNameNoTooltip] me encara de cima a baixo."
 feast_default.1018.t:0 "... Irá Emergir"
 feast_default.1019.a:0 "... talvez eu deva manter o item como um sinal das minhas falhas?"
 feast_default.1019.a_tt:0 "Tentar manter [trinket_to_steal.GetName]"
 feast_default.1019.b:0 "Eu não busco nada além do seu perdão, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('feast_host'))]."
 feast_default.1019.desc_condemnation:0 "\n\nCom as bochechas coradas de vergonha, estou enojado com meu próprio comportamento. Independentemente do que aconteceu comigo, agora estou sofrendo as consequências."
 feast_default.1019.desc_condemnation_greedy:0 "\n\nLutando para me conter, olho para o chão na frente de [feast_host.GetSheHe] e ofereço um aceno de cabeça. Sim. #EMP vou fazer melhor da próxima vez.#!"
 feast_default.1019.desc_intro_condemned:0 "$feast_default.1019_start$ olhar de desaprovação.\n\n\"Nós nunca nos olhamos olho no olho, você e eu. [Select_CString( feast_host.IsFemale, 'Minha própria', 'Meu próprio' )] [feast_host.Custom2('RelationToMe', ROOT.Char)] sucumbir a algo como um roubo mesquinho... #EMP tanto#! embaraçoso, bem como deplorável. Você precisa fazer melhor.\""
 feast_default.1019.desc_intro_redeemed:0 "$feast_default.1019_start$ olhar decepcionado.\n\n\"Eu não esperava que isso acontecesse, admito. [Select_CString( feast_host.IsFemale, 'Minha própria', 'Meu próprio' )] [feast_host.Custom2('RelationToMe', ROOT.Char)] ser vítima de tal comportamento vergonhoso... realmente isso deve pesar em você. Aplaudo sua confissão, é o primeiro passo para a melhoria.\""
 feast_default.1019.desc_redemption:0 "\n\nMortificado pelo meu próprio comportamento, sinto-me verdadeiramente grato por sua resposta benevolente ao meu pedido. Uma pedra figurativa foi de fato levantada de meus ombros."
 feast_default.1019.desc_redemption_greedy:0 "\n\nEu jogo junto neste ato teatral, enquanto eu sei que outra alternativa seria muito pior. Pelo menos estou fora de problemas... desta vez."
 feast_default.1019.t:0 "O Pedido de Desculpas"
 feast_default.1019_start:0 "Enquanto eu entro nos aposentos [Select_CString( feast_host.IsFemale, 'da', 'do' )] [feast_host.GetTitledFirstNameNoTooltip], [Select_CString( feast_host.IsFemale, 'minha própria', 'meu próprio' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('feast_host'))] me olha com um"
 feast_default.1020.a.tt_fined:0 "[activity.GetOwner.GetTitledFirstNameNoTooltip] multa você por sua ação"
 feast_default.1020.a.tt_imprisoned:0 "Retaliação [Select_CString( activity.GetOwner.IsFemale, 'da', 'do' )] [activity.GetOwner.GetTitledFirstNameNoTooltip]"
 feast_default.1020.a.tt_success:0 "Você desfigura o artefato sem ser detectado"
 feast_default.1020.a_drunkard:0 "Eu poderia derramar meu [ROOT.Char.Custom('RegionalDrink')] por cima disso..."
 feast_default.1020.a_knock_over:0 "Talvez eu vá #EMP acidentalmente#! derrubar..."
 feast_default.1020.a_lustful:0 "Eu #EMP fortemente#! desejo quebra-lo totalmente..."
 feast_default.1020.a_scratch:0 "Vou arranhar bem..."
 feast_default.1020.b:0 "Não, é melhor eu não arriscar."
 feast_default.1020.desc:0 "Enquanto ando pelos corredores [Select_CString( feast_host.IsFemale, 'da minha', 'do meu' )] desprezível [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('feast_host'))], [feast_host.GetTitledFirstNameNoTooltip], Examino sua coleção de artefatos em exibição. Tal ostentação - talvez [feast_host.GetSheHe] possa ser derrubado um pino ou dois...\n\nMeu olhar permanece no [feast_target_artifact.GetName]."
 feast_default.1020.t:0 "O Acidente"
 feast_default.1020.tt:0 "Artefato Desfigurado"
 feast_default.1020.tt_guests:0 "#z [THIS.Var('num_unhappy_guests').GetValue|0]#! hóspedes apreciam esta ação e ganham opinião sobre você"
 feast_default.1030.a.tt:0 "Que as recontagens inspirem a todos, desde o mais humilde dos servos até os maiores $knight_culture_player_plural_no_tooltip_lowercase$."
 feast_default.1030.a:0 "[knight_1.GetFirstNameNoTooltip], [accolade_1.GetNameNoTooltip]!"
 feast_default.1030.aggressive:0 "De [knight_2.GetFirstName] avançando impiedosamente?"
 feast_default.1030.amoral:0 "destruiu inimigos de todas as descrições?"
 feast_default.1030.b.tt:0 "Dirão que [knight_2.GetSheHe] não pode ser derrotado!"
 feast_default.1030.b:0 "[knight_2.GetFirstNameNoTooltip], [accolade_2.GetNameNoTooltip]!"
 feast_default.1030.c.tt:0 "Todos conhecerão [knight_3.GetSheHe] como o igual de qualquer herói do passado."
 feast_default.1030.c:0 "[knight_3.GetFirstNameNoTooltip], [accolade_3.GetNameNoTooltip]!"
 feast_default.1030.champion:0 "De [knight_2.GetFirstName] conquistando a vitória, sozinho?"
 feast_default.1030.courtly:0 "[knight_4.GetFirstName] e suas verdadeiras amizades?"
 feast_default.1030.d.tt:0 "Um executor de missões e feitos cada vez mais popular... reais e fictícios."
 feast_default.1030.d:0 "[knight_4.GetFirstNameNoTooltip], [accolade_4.GetNameNoTooltip]!"
 feast_default.1030.defensive:0 "De [knight_2.GetFirstName] permanecendo firme como uma montanha?"
 feast_default.1030.desc:0 "Um floreio encerra a primeira recitação apaixonada d[Select_CString( minstrel.IsFemale, 'a', 'o' )] [minstrel.GetFirstName]. Olhos são enxugados, mesas batidas.\n\n\"Outro conto!\" oferece [minstrel.GetSheHe]. \"Devo cantar sobre como o grande $knight_culture_player_no_tooltip_lowercase$ [knight_1.GetFirstName]"
 feast_default.1030.equestrian:0 "O cavaleiro dos [knight_3.GetCulture.GetCollectiveNounNoTooltip], [knight_3.GetFirstName]?"
 feast_default.1030.ethical:0 "nobremente defendeu os fracos?"
 feast_default.1030.fighty_neutral:0 "[knight_4.GetFirstName] e seus juramentos honrados?"
 feast_default.1030.forceful:0 "O mais poderoso dos [knight_3.GetCulture.GetCollectiveNounNoTooltip], [knight_3.GetFirstName]?"
 feast_default.1030.intensity_neutral:0 "O melhor dos [knight_3.GetCulture.GetCollectiveNounNoTooltip], [knight_3.GetFirstName]?"
 feast_default.1030.leader:0 "liderou companheiros através de grandes perigos?"
 feast_default.1030.militant:0 "[knight_4.GetFirstName] e suas batalhas vencidas?"
 feast_default.1030.morally_neutral:0 "demonstrou pela primeira vez sua virtude?"
 feast_default.1030.stance_neutral:0 "De [knight_2.GetFirstName] restaurando o seu nome manchado?"
 feast_default.1030.subtle:0 "O mais astuto dos [knight_3.GetCulture.GetCollectiveNounNoTooltip], [knight_3.GetFirstName]?"
 feast_default.1030.t:0 "Heróis do Nosso Tempo"
 feast_default.1030.wrap_up:0 "Esses guerreiros rivais aos dos tempos antigos!\"\n\nSem dúvida, enquanto os artistas deste banquete seguem para outros lugares, meu conto favorito será contado muitas vezes."
 feast_default.2001.a:0 "[glutton.GetSheHe|U] está se fazendo de bobo."
 feast_default.2001.b:0 "[glutton.GetFirstNameNoTooltip] como assim? Onde está nossa comida?!"
 feast_default.2001.desc:0 "[host.GetTitledFirstName] anunciou um pequeno atraso no serviço da comida, e [glutton.GetSheHe] parece prestes a explodir de frustração!\n\nEntre os resmungos de seu estômago, só ouço resmungos de desagrado."
 feast_default.2001.t:0 "Impaciência Embaraçosa"
 feast_default.2002.a:0 "Deve ter sido [crush_1.GetFirstNameNoTooltip]!"
 feast_default.2002.b:0 "Pode ter sido [crush_2.GetFirstNameNoTooltip]?"
 feast_default.2002.c:0 "Isso tem [crush_3.GetFirstNameNoTooltip] escrito em tudo."
 feast_default.2002.desc:0 "Alguém invisível me deu um bilhete durante o banquete:\n\n\"[letterAuthor.Custom2('love_letter', SCOPE.sC('letterRecipient'))]\"\n\nDe quem poderia ser esta carta tão afetuosa? Havia algo sobre o jeito que [Select_CString( crush_1.IsFemale, 'a', 'o' )] [crush_1.GetTitledFirstName] olhou timidamente para mim. Ou como [Select_CString( crush_2.IsFemale, 'a', 'o' )] [crush_2.GetTitledFirstName] sorriu quando nos conhecemos. Então novamente, [crush_3.GetTitledFirstName] parecia muito ansios[Select_CString( crush_3.IsFemale, 'a', 'o' )] para sentar perto de mim..."
 feast_default.2002.potential_lover_tt:0 "Se você estiver correto, será muito mais fácil torná-lo seu [lover|E]"
 feast_default.2002.t:0 "Um Admirador"
 feast_default.2003.a:0 "Que otima tarde!"
 feast_default.2003.desc:0 "O que começou como uma festa ordinária tornou-se excepcional graças à presença [Select_CString( other_guest.IsFemale, 'da', 'do' )] [other_guest.GetTitledFirstName]!\n\nConversamos a noite toda sobre todos os tipos de assuntos e parece que temos muito em comum..."
 feast_default.2003.t:0 "Espíritos Afins"
 feast_default.2005.a:0 "\"Você deveria ter vergonha de si mesm[Select_CString( drunk.IsFemale, 'a', 'o' )], [drunk.GetFirstNameNoTooltip]!\""
 feast_default.2005.b:0 "\"Ha! Que show você deu!\""
 feast_default.2005.desc:0 "Todos podíamos perceber que [drunk.GetTitledFirstName] havia bebido demais, mesmo que [drunk.GetSheHe] insistisse em nos mostrar o quão sóbrio [drunk.GetSheHe] estava.\n\nLevantar-se da própria cadeira já foi demais para [drunk.GetSheHe], e agora estou respingado com vômito fedorento!"
 feast_default.2005.t:0 "Por Todo o Meu Novo [ROOT.Char.Custom('GetClothingArticle')]"
 feast_default.2006.a:0 "É uma maneira estranha de ganhar meu favor, mas devo dizer que está funcionando."
 feast_default.2006.b:0 "Eu poderia me acostumar com isso!"
 feast_default.2006.c:0 "Não suporto ter alguém me seguindo assim!"
 feast_default.2006.d:0 "Por favor, me deixe só!"
 feast_default.2006.desc:0 "Como [befriending_guest.Custom2('MyCharacterIntroduction', ROOT.Char )] mais uma vez interrompe uma conversa com gargalhadas, Eu não posso mais negar que [befriending_guest.GetSheHe] está agindo estranho.\n\n[befriending_guest.GetSheHe|U] nunca se afasta de mim, acompanha-me em todas as conversas, expressa apreço por tudo o que digo..."
 feast_default.2006.t:0 "[Select_CString( befriending_guest.IsFemale, 'A Ansiosa', 'O Ansioso' )] [befriending_guest.GetTitleTierName|U]"
 feast_default.2007.a_chaste:0 "Não suporto olhar!"
 feast_default.2007.a_compassionate:0 "Ninguém merece esse tipo de vergonha..."
 feast_default.2007.a_lustful:0 "Apenas #EMP imagine#! o que eles estavam aprontando..."
 feast_default.2007.a_sadistic:0 "Ah! Isso é maravilhoso!"
 feast_default.2007.b:0 "Imaginar que #EMP eles#! tinha tal segredo!"
 feast_default.2007.desc:0 "Um estrondo alto ecoa pelo salão quando uma das portas dos aposentos dos servos se quebra.\n\nEm uma queda quase nua, [Select_CString( lover_guest_1.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover_guest_1'))] [lover_guest_1.GetTitledFirstName] e [Select_CString( lover_guest_2.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover_guest_2'))] [lover_guest_2.GetTitledFirstName] caem no chão à frente de todos."
 feast_default.2007.t:0 "Relacionamento Exposto!"
 feast_default.2008.a:0 "Conciliando-se com [Select_CString( homosexual_character.IsFemale, 'outra', 'outro' )] [homosexual_character.GetWomanMan]?! O Reino precisa saber!"
 feast_default.2008.b:0 "Seu segredo está seguro comigo, [homosexual_character.GetFirstNameNoTooltip]. Por enquanto."
 feast_default.2008.c:0 "Corrompendo #EMP meus#! servos sem minha aprovação?!"
 feast_default.2008.d.unlock_text:0 "Esta opção está disponível devido à sua [sexuality|E]"
 feast_default.2008.d:0 "Oh [homosexual_character.GetFirstNameNoTooltip], se eu soubesse."
 feast_default.2008.desc:0 "Como [homosexual_character.Custom2('MyCharacterIntroduction', ROOT.Char )] tentou fugir do banquete sem ser notado, pensei ter visto de relance a mão dele deslizando na mão de [Select_CString( romance_target.IsFemale, 'uma', 'um' )] [romance_target.Custom('FemaleMale')] serviçal!\n\nMinhas suspeitas foram confirmadas quando os peguei em um quarto isolado, meio despidos!"
 feast_default.2008.t:0 "Atrás de uma Porta Trancada"
 feast_default.2009.a:0 "Oh, eles simplesmente são rumores #EMP muito#! interessantes."
 feast_default.2009.desc:0 "Escuto atentamente [secret_holder.GetTitledFirstName] enquanto [secret_holder.GetSheHe] revela descuidadamente todo tipo de coisa. Distraído tentando pegar a última gota do copo [secret_holder.GetHerHim], [secret_holder.GetSheHe] não percebe o quanto estou prestando atenção.\n\nQuando [secret_holder.GetSheHe] percebe, começa a se levantar. \"Estou apenas tagarelando! De qualquer forma, nada disso é verdade!\""
 feast_default.2009.t:0 "Por Favor, Continue"
 feast_default.2011.a:0 "Você é [Select_CString( favor_character.IsFemale, 'uma', 'um' )] [favor_character.GetWomanMan] de palavra, não é?"
 feast_default.2011.b:0 "\"Hah, [favor_character.GetTitledFirstNameNoTooltip] está muito [Select_CString( favor_character.IsFemale, 'bêbada', 'bêbado' )] para saber o que [favor_character.GetSheHe] está dizendo!\""
 feast_default.2011.desc:0 "[Select_CString( favor_character.IsFemale, 'Despreocupada', 'Despreocupado' )] com qualquer etiqueta, [favor_character.Custom2('MyCharacterIntroduction', ROOT.Char )] me dá um tapa nas costas. \"Eu farei qualquer coisa que você me pedir. Qualquer coisa. Peça-me, e estará feito!\"\n\nConsigo sentir o cheiro de álcool em sua respiração, mas sua promessa foi notada por todos os convidados presentes."
 feast_default.2011.t:0 "Uma Promessa é uma Promessa"
 feast_default.2012.a:0 "O que você #EMP fez#!?!"
 feast_default.2012.b:0 "Todos saberão do seu crime!"
 feast_default.2012.c:0 "Meu silêncio tem um preço."
 feast_default.2012.desc:0 "Enquanto tropeço para fora em busca de um lugar para me aliviar, ouço gritos na esquina. Ao me virar, vejo [Select_CString( murderer.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murderer'))] [murderer.GetTitledFirstName] zombar enquanto [murderer.GetSheHe] afunda a lâmina [murderer.GetHerHim] no rosto [Select_CString( murdered_guest.IsFemale, 'da acuada', 'do acuado' )] [murdered_guest.GetTitledFirstName].\n\nQualquer som que eu tenha feito deve ter sido suficiente, pois [murderer.GetFirstName] se volta para mim, surpresa no rosto [murderer.GetHerHim]."
 feast_default.2012.t:0 "A Testemunha"
 feast_default.2013.a.failure:0 "[shared_liege.GetTitledFirstName] não se impressiona com o seu presente espontâneo"
 feast_default.2013.a.success:0 "[shared_liege.GetTitledFirstName] está impressionad[Select_CString( shared_liege.IsFemale, 'a', 'o' )] com o seu presente espontâneo"
 feast_default.2013.a:0 "\"[Select_CString( shared_liege.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('shared_liege'))]! Também tenho um presente para você!\""
 feast_default.2013.b.failure:0 "[shared_liege.GetTitledFirstName] não se impressiona com seu brinde espontâneo"
 feast_default.2013.b.success:0 "[shared_liege.GetTitledFirstName] está impressionad[Select_CString( shared_liege.IsFemale, 'a', 'o' )] com o seu brinde espontâneo"
 feast_default.2013.b:0 "\"#EMP Ahem!#! Eu declaro um brinde [Select_CString( shared_liege.IsFemale, 'a', 'ao' )] [shared_liege.GetTitledFirstNameNoTooltip]!\""
 feast_default.2013.c.failure:0 "Ninguém acredita que o derramamento foi um acidente"
 feast_default.2013.c.success:0 "Todo mundo acredita que o derramamento foi um acidente"
 feast_default.2013.c:0 "Derrame sua bebida na pele e afirme que foi um acidente."
 feast_default.2013.d:0 "Sem pressa. Vou pensar em algo outra hora."
 feast_default.2013.desc:0 "Os rumores que circulam sobre [Select_CString( bootlicker.IsFemale, 'a', 'o' )] [bootlicker.GetTitledFirstName] querendo agradar [Select_CString( shared_liege.IsFemale, 'a', 'o' )] [shared_liege.GetTitledFirstName] são confirmados quando [bootlicker.GetSheHe] entrega um presente para [shared_liege.GetSheHe].\n\n\"[Select_CString( shared_liege.IsFemale, 'Minha querida', 'Meu querido' )] [bootlicker.Custom2('RelationToMeShort', SCOPE.sC('shared_liege'))], é tão lindo ver você! Sabendo que nos encontraríamos aqui, trouxe-lhe esta pele maravilhosa, como prova do meu apreço.\"\n\n[shared_liege.GetTitledFirstName] sorri enquanto [shared_liege.GetSheHe] observa a pele do animal. Vendo o quão feliz [shared_liege.GetSheHe] está em receber um presente, percebo que corro o risco de perder esta oportunidade de melhorar minha posição com [shared_liege.GetSheHe]!"
 feast_default.2013.t:0 "O Puxa-Saco"
 feast_default.3001.a:0 "Ah, o que seria da vida sem [friend.GetFirstNameNoTooltip]?"
 feast_default.3001.desc:0 "É uma alegria tão grande ver [friend.Custom2('MyCharacterIntroductionNoComma', ROOT.Char )]! Mais uma vez, comemos, bebemos e cantamos juntos como se não tivesse passado um tempo desde a última vez que nos encontramos.\n\nPoderíamos estar jantando em um celeiro, e essa ainda assim teria sido uma das maiores festas em que ja estive."
 feast_default.3001.t:0 "Um Banquete com um Amigo"
 feast_default.3002.a:0 "Venha! Não temos um momento a perder!"
 feast_default.3002.b:0 "Não, poderíamos ser descobertos."
 feast_default.3002.desc:0 "[lover.GetTitledFirstName], [Select_CString( lover.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover') )]. Sorrimos e nos cumprimentamos como se já não nos conhecêssemos intimamente. Como se nunca tivéssemos nos abraçado no auge da paixão. Como se não desejássemos nos abraçar.\n\nQuando mais tarde nos cruzamos em um corredor abandonado, mais uma vez sinto seus lábios contra os meus. Então [lover.GetSheHe] aponta para um caminho apagado..."
 feast_default.3002.discovery_tt:0 "#F Os criados veem muito, e podem falar...#!"
 feast_default.3002.t:0 "Beijos Roubados"
 feast_default.3003.a:0 "[rival.GetSheHe|U] me faz querer socar [rival.GetSheHe] na cara!"
 feast_default.3003.desc:0 "Foi uma festa tão agradável, mas então #EMP [rival.GetSheHe]#! apareceu. Não posso ter uma única noite sem ser maculada pelo fedor invasivo [Select_CString( rival.IsFemale, 'da', 'do' )] [rival.GetTitledFirstNameNoTooltip]?\n\nO pior de tudo é a som nasal dessa voz enquanto [rival.GetSheHe] se aproxima de mim. \"Que rosto azedo, [ROOT.Char.GetFirstNameNoTooltip]?\""
 feast_default.3003.t:0 "Companhia Desagradável"
 feast_default.3004.a:0 "Acho que você já teve o suficiente por hoje."
 feast_default.3004.b.failure:0 "[rival_guest.GetFirstNameNoTooltip] vence a luta"
 feast_default.3004.b.success:0 "Você vence a luta"
 feast_default.3004.b:0 "Você não passa de um[Select_CString( rival_guest.IsFemale, 'a', '' )] [rival_guest.Custom2('InsultAdjective', ROOT.Char)] [rival_guest.Custom2('InsultNoun', ROOT.Char)]!"
 feast_default.3004.c.tt:0 "#F É hora [Select_CString( rival_guest.IsFemale, 'da', 'do' )] [rival_guest.GetFirstNameNoTooltip] espalhar um pouco de felicidade#!"
 feast_default.3004.c:0 "Alguns trazem alegria onde quer que vão; outros, sempre que o fazem."
 feast_default.3004.d:0 "Um soco na cara é uma resposta tão boa quanto qualquer outra!"
 feast_default.3004.desc:0 "Depois de consumir grandes quantidades de comida e bebida, encontro [rival_guest.Custom2('MyCharacterIntroduction', ROOT.Char)] no meio de uma conversa em voz alta. [rival_guest.GetSheHe|U] se vira para mim assim que percebe minha presença.\n\n\"E #EMP você#! – sua presença não fez falta esta noite!\""
 feast_default.3004.t:0 "Altercações Insultuosas"
 feast_default.3005.a:0 "\"Você vai pagar por tudo que fez.\""
 feast_default.3005.b:0 "\"Eu nunca cederia as #EMP suas# vontades!!\""
 feast_default.3005.c:0 "\"Por favor, não me machuque!\""
 feast_default.3005.d:0 "\"Eu quero ouvir você implorar por misericórdia.\""
 feast_default.3005.desc:0 "O salão ecoa com as risadas [Select_CString( rival_to_duel.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival_to_duel'))] [rival_to_duel.GetTitledFirstName], com suas provocações e insultos — quando [rival_to_duel.GetSheHe] me chama de [ROOT.Char.Custom2('InsultAdjectiveArticle', SCOPE.sC('rival_to_duel'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rival_to_duel'))], eu desembainho minha lâmina."
 feast_default.3005.desc_lost:0 "\n\nEu volto aos meus sentidos quando [rival_to_duel.GetSheHe] inclina-se sobre mim, coloca sua bota em meu peito. [rival_to_duel.GetSheHe|U] sussurra em meu ouvido, \"Eu quero ouvir você implorar por misericórdia.\""
 feast_default.3005.desc_won:0 "\n\nEu volto aos meus sentidos enquanto derrubo [rival_to_duel.GetSheHe], coloco minha bota em seu peito, e o vejo respirando com dificuldade."
 feast_default.3005.e:0 "Eu alcanço minha faca e corto seu tendão de Aquiles em um movimento suave."
 feast_default.3005.t:0 "Um Desafio"
 feast_default.3006.a:0 "Eu preciso te ver novamente!"
 feast_default.3006.b.mistake_tt:0 "#F [partner.GetFirstNameNoTooltip] não está [Select_CString( partner.IsFemale, 'interessada', 'interessado' )]#!"
 feast_default.3006.b:0 "Vamos aproveitar ao máximo este momento..."
 feast_default.3006.both_married:0 "\n\n[Select_CString( partner.IsFemale, 'Sua', 'Seu' )] [partner.Custom2('RelationToMe', SCOPE.sC('partner'))] não deve saber disso, sem mencionar [Select_CString( partner.IsFemale, 'minha própria', 'meu próprio' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('partner'))]!"
 feast_default.3006.both_married_love:0 "\n\nNão suporto a ideia de ficar sem [partner.GetSheHe], mas [Select_CString( partner.IsFemale, 'sua', 'seu' )] [partner.Custom2('RelationToMe', SCOPE.sC('partner'))] nunca deve saber, e nem [Select_CString( partner.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('partner'))]!"
 feast_default.3006.c.tt:0 "#F Fique longe [Select_CString( partner.IsFemale, 'da', 'do' )] [partner.GetFirstNameNoTooltip]#!"
 feast_default.3006.c:0 "Nunca mais falemos sobre isso."
 feast_default.3006.married:0 "\n\n[Select_CString( partner.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('partner'))] não deve saber da minha traição."
 feast_default.3006.married_love:0 "\n\nNão suporto a ideia de ficar sem [partner.GetSheHe], mas [Select_CString( partner.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('partner'))] não pode saber o que aconteceu aqui."
 feast_default.3006.opening_1:0 "Embriagado e cheio de desejo, [partner.Custom2('MyCharacterIntroduction', ROOT.Char)] e eu nos encontramos sozinhos. Seus braços ao meu redor, seus lábios contra o meu pescoço, saciamos as chamas que ardem em nossos peitos e nossas virilhas."
 feast_default.3006.opening_2:0 "Eu acordo em uma cama estranha, com uma companhia inesperada. Memórias da noite anterior lentamente se formam na névoa dolorosa da minha cabeça. [partner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] e eu, unidos pelo desejo."
 feast_default.3006.opening_3:0 "Eu havia sido tão insistentemente contra fazer isso. No entanto, depois de algumas bebidas, me entreguei facilmente aos braços de [partner.Custom2('MyCharacterIntroduction', ROOT.Char)] - preso em sua teia sedutora. Logo me vi em sua cama."
 feast_default.3006.partner_married:0 "\n\n[Select_CString( partner.IsFemale, 'Sua', 'Seu' )] [partner.Custom2('RelationToMe', SCOPE.sC('partner'))] não pode saber o que aconteceu aqui."
 feast_default.3006.partner_married_love:0 "\n\nNão suporto a ideia de ficar sem [partner.GetSheHe], mas considerando [Select_CString( partner.IsFemale, 'sua', 'seu' )] [partner.Custom2('RelationToMe', SCOPE.sC('partner'))], [partner.GetTitledFirstName], o que posso fazer?"
 feast_default.3006.t:0 "Uma Única Noite"
 feast_default.3006.unmarried:0 "\n\nFora dos limites do casamento e da decência, não podemos deixar o mundo saber o que aconteceu aqui."
 feast_default.3006.unmarried_love:0 "\n\nFora dos limites do casamento e da decência, não podemos deixar o mundo saber o que aconteceu aqui. Ainda assim, não suporto a ideia de ficar sem [partner.GetSheHe] nem por um dia."
 feast_default.3007.a:0 "Isso não significou nada, [Select_CString( spouse.IsFemale, 'minha querida', 'meu querido' )]!"
 feast_default.3007.ambiguous:0 "Na esperança de passar um tempo com [Select_CString( lover.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))], [lover.GetTitledFirstName] levei para longe do banquete. Justo quando eu estava me preparando para voltar, uma voz familiar me faz congelar de choque."
 feast_default.3007.b:0 "Eu amo [lover.GetSheHe]!"
 feast_default.3007.c:0 "Eu faço o que eu quero."
 feast_default.3007.end:0 "\n\n[ROOT.Char.GetFirstNameNoTooltip]?!\" [Select_CString( spouse.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))], [spouse.GetTitledFirstName], nos encara em choque. \"Como você pôde deitar com aquel[Select_CString( lover.IsFemale, 'a', 'e' )] [lover.Custom2('InsultAdjective', SCOPE.sC('spouse'))] [lover.Custom2('InsultNounSexual', SCOPE.sC('spouse'))]?!"
 feast_default.3007.love:0 "Enquanto os outros convidados estão perdendo a cabeça com as taças, [Select_CString( lover.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))] e eu encontramos um aposento para passar a noite a sós. Estou espalhando beijos pelas costas nuas de [lover.GetFirstName], quando uma voz me faz correr para me cobrir."
 feast_default.3007.not_love:0 "Levei [Select_CString( lover.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))], [lover.GetTitledFirstName], para um quarto abandonado para escaparmos da multidão. Estou no meio de saciar minha fome quando uma voz familiar faz meu sangue gelar."
 feast_default.3007.t:0 "No Ato"
 feast_default.3008.a:0 "O chapéu deve cair!"
 feast_default.3008.b:0 "Não convém nutrir tal inveja."
 feast_default.3008.c.flavor:0 "O nome [hat_man.GetHerHim] deve ser rebaixado!"
 feast_default.3008.c.tt:0 "Seu [scheme|E] ganha [GetModifier('didnt_knock_hat_off_modifier').GetNameWithTooltip]"
 feast_default.3008.c:0 "Que a luz cegue [hat_man.GetSheHe] para minhas artimanhas."
 feast_default.3008.desc:0 "Durante uma pausa nas festividades, meus olhos são capturados por um brilho dançando no laca negro do eboshi [Select_CString( hat_man.IsFemale, 'da', 'do' )] [hat_man.GetFirstNamePossessive]. Não é o curso natural das coisas, a luz deve encontrar e iluminar [hat_man.GetSheHe] acima de todos nós?\n\nO que as pessoas pensariam se de repente [hat_man.GetSheHe] perdesse seu eboshi? Quão brilhante [hat_man.GetSheHe] brilharia então?! [hat_man.GetSheHe|U] seria desfeito! Uma criança. Menos que humano até."
 feast_default.3008.t:0 "Quanto mais alto o chapéu..."
 feast_default.3009.a:0 "Que meu tempo ao sol comece!"
 feast_default.3009.desc:0 "Como uma víbora enroscada, eu ataco! O eboshi [Select_CString( hat_man.IsFemale, 'da', 'do' )] [hat_man.GetFirstNamePossessive] desliza pelo chão. [hat_man.GetSheHe|U] tenta cobrir sua vergonha, mas seu desleixado motodori está à vista de todos, sua negligência espiritual exposta. Com suas ilusões de grandeza agora dissipadas, outro ousaria se expor à luz?"
 feast_default.3009.t:0 "...Quanto mais cai."
 feast_default.3010.a.flavor:0 "Mostrarei a [hat_knocker.GetSheHe] o que significa ser uma víbora!"
 feast_default.3010.a.tt:0 "Seu [scheme|E] ganha [GetModifier('scheme_apa_positive_2101_modifier').GetNameWithTooltip]"
 feast_default.3010.a:0 "[hat_knocker.GetSheHe|U] vai se arrepender!"
 feast_default.3010.b.flavor:0 "Minha serenidade permanecerá intacta."
 feast_default.3010.b:0 "Você deve ter bebido demais, [hat_knocker.GetFirstNameNoTooltip]."
 feast_default.3010.desc:0 "Há uma pausa nas festividades. Por um momento, como se o tempo tivesse desacelerado, as preocupações do mundo e a pressão do presente desaparecem.\n\nEntão, como uma víbora das sombras, vem a mão de [hat_knocker.GetName] atingindo meu eboshi. Observo incrédulo enquanto ele desliza pelo chão. Tento cobrir minha vergonha, mas meu desleixado motodori está à vista de todos, minha negligência espiritual exposta."
 feast_default.3010.t:0 "Meu chapéu!"
 feast_default.3096.a:0 "Vamos ver aonde a noite nos leva"
 feast_default.3096.b:0 "Eu sou melhor que isso."
 feast_default.3096.desc:0 "Conforme as festividades avançam, não consigo deixar de trocar olhares com [partner.GetName].\n\nSou [Select_CString( ROOT.Char.IsFemale, 'uma', 'um' )] [ROOT.Char.GetWomanMan] honrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], mas raramente me senti tão tentado a explorar um novo relacionamento..."
 feast_default.3096.t:0 "Uma Nova Possibilidade"
 feast_default.5001.a:0 "Eu posso superar isso. É apenas um banquete."
 feast_default.5001.friend_reminder:0 "Acredito que [Select_CString( friend.IsFemale, 'a', 'o' )] [friend.GetTitledFirstName] tenha dito apenas como um aviso, mas depois que [Select_CString( friend.IsFemale, 'minha', 'meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('friend'))] me lembrou da aterrorizante reputação [Select_CString( host.IsFemale, 'da', 'do' )] [host.GetTitledFirstName], mal consigo pensar em outra coisa."
 feast_default.5001.reminder:0 "Mesmo que um banquete seja uma ocasião de celebração e alegria, é muito difícil não pensar na aterrorizante reputação [Select_CString( host.IsFemale, 'da', 'do' )] [host.GetTitledFirstName]..."
 feast_default.5001.rival_reminder:0 "Eu sei que [Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetTitledFirstName] disse apenas para me preocupar, mas agora que [Select_CString( rival.IsFemale, 'minha', 'meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('rival'))] me lembrou da aterrorizante reputação [Select_CString( host.IsFemale, 'da', 'do' )] [host.GetTitledFirstName], mal consigo pensar em outra coisa."
 feast_default.5001.sadist_reminder:0 "Foi com um sorriso perturbador que [Select_CString( sadist.IsFemale, 'a', 'o' )] [sadist.GetTitledFirstName] contou algumas das histórias mais aterrorizantes sobre os métodos de... diplomacia [Select_CString( host.IsFemale, 'da', 'do' )] [host.GetTitledFirstName]. Não deveria me afetar, mas agora está difícil pensar em outra coisa."
 feast_default.5001.spouse_reminder:0 "Tocando meu braço para chamar minha atenção, [spouse.GetTitledFirstName] falou com voz baixa e cheia de preocupação. \"[host.GetTitledFirstName] tem te olhado muito esta noite...\" Considerando a reputação [Select_CString( spouse.IsFemale, 'da', 'do' )] [spouse.GetTitledFirstName], quase desejo que [spouse.GetSheHe] não tivesse dito nada."
 feast_default.5001.t:0 "Um Sorriso Torto"
 feast_default.5001.worry:0 "\n\nCada sorriso do nosso anfitrião agora parece excessivamente largo, e cada risada súbita me faz pular, ansioso de que alguém tenha provocado a ira [host.GetHerHim] por algum pequeno deslize. Ou pior, que essa pessoa seja eu."
 feast_default.5002.a:0 "[Select_CString( lunatic_host.IsFemale, 'Minha', 'Meu' )] [lunatic_host.GetLadyLord], que tal irmos lá fora tomar um pouco de ar?"
 feast_default.5002.b:0 "Eu tenho que parar essa loucura!"
 feast_default.5002.c:0 "[lunatic_host.GetFirstNameNoTooltip]! Deixe-me juntar a vocês dois!"
 feast_default.5002.desc_chair:0 "[Select_CString( lunatic_host.IsFemale, 'Nossa anfitriã, minha', 'Nosso anfitrião, meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('lunatic_host'))] [lunatic_host.GetTitledFirstName], se inclina para conversar melhor com a cadeira ao lado [lunatic_host.GetHerHim]. Com essa demonstração, todas as outras conversas logo diminuem.\n\n\"O que você disse, [Select_CString( ROOT.Char.IsFemale, 'minha boa', 'meu bom' )] [ROOT.Char.Custom('RandomLadyLord')]? Sim, claro, eu confio mais em você do que em qualquer outra pessoa aqui!\""
 feast_default.5002.desc_chicken:0 "[Select_CString( lunatic_host.IsFemale, 'Nossa anfitriã, minha', 'Nosso anfitrião, meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('lunatic_host'))] [lunatic_host.GetTitledFirstName], abraça suavemente uma galinha depenada — e cozida — em seu peito, sussurrando palavras doces para ela. Conforme [lunatic_host.GetSheHe] começa a proclamar em voz alta sua afeição pela ave, o clima no grande salão rapidamente se torna perturbador."
 feast_default.5002.desc_drapes:0 "[Select_CString( lunatic_host.IsFemale, 'Nossa anfitriã, minha', 'Nosso anfitrião, meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('lunatic_host'))] [lunatic_host.GetTitledFirstName], entra na pista de dança, segurando um dos estandartes usados para decorar as paredes em seus braços.\n\nOs convidados não conseguem fazer nada além de observar enquanto ele conduz o pedaço de tecido em uma dança elaborada, cativados pela exibição."
 feast_default.5002.t:0 "Delírios"
 feast_default.5003.a:0 "\"Isso é inaceitável!\""
 feast_default.5003.b:0 "Eu cuidarei d[Select_CString( guest.IsFemale, 'a', 'o' )] [guest.GetFirstNameNoTooltip] por enquanto."
 feast_default.5003.c:0 "Que banquete glorioso!"
 feast_default.5003.desc:0 "Pedaços de metal afiado em alguns dos pratos, lascas nas cadeiras, pequenos #acidentes EMP#! prometendo hematomas...\n\n[Select_CString( sadistic_host.IsFemale, 'Sentada', 'Sentado' )] na cabeceira da mesa, [Select_CString( sadistic_host.IsFemale, 'minha', 'meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sadistic_host'))] [sadistic_host.GetTitledFirstName] não consegue esconder o sorriso frio que se espalha pelo rosto enquanto [Select_CString( guest.IsFemale, 'outra', 'outro' )] [guest.GetLadyLord], [guest.GetTitledFirstName], cospe sangue em seu prato."
 feast_default.5003.t:0 "Entretenimento Doloroso"
 feast_default.5004.a:0 "[Select_CString( host.IsFemale, 'Obrigada, minha', 'Obrigado, meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))]!"
 feast_default.5004.b:0 "Acho que já tive o suficiente."
 feast_default.5004.c:0 "Peço licença e escapo entre a multidão."
 feast_default.5004.desc:0 "\"Foi o som de uma taça vazia que você acabou de colocar sobre a mesa?\" Para ouvir qualquer coisa sobre este barulho, [host.GetTitledFirstName] deve ter ouvidos encantados. Meu gentil anfitrião acena para um servo. \"Mais vinho aqui! Ninguém ficará com sede!\""
 feast_default.5004.t:0 "O Fundo da Taça"
 feast_default.5005.a:0 "Preciso comer isso regularmente!"
 feast_default.5005.b:0 "\"Esta é uma refeição incrível, [host.GetFirstNameNoTooltip]!\""
 feast_default.5005.c.flavor:0 "Parece que não muitos outros convidados sabem disso!"
 feast_default.5005.c:0 "\"Você sabia que o murri foi inspirado pelo garum?\""
 feast_default.5005.d:0 "Se eu pudesse, eu #EMP respiraria#! garum!"
 feast_default.5005.desc:0 "Ah, esse sabor divino! Tão saboroso e ligeiramente salgado, reminiscente do mar...\n\nEste pode ser o melhor garum que já provei, e o cozinheiro [Select_CString( host.IsFemale, 'da', 'do' )] [host.GetTitledFirstName] o utilizou de forma especial!"
 feast_default.5005.t:0 "Garum!"
 feast_default.5010.a.failure:0 "[rando_guest.GetFirstName|U] está entediad[Select_CString( rando_guest.IsFemale, 'a', 'o' )]"
 feast_default.5010.a.success:0 "[rando_guest.GetFirstName|U] está impressionad[Select_CString( rando_guest.IsFemale, 'a', 'o' )]"
 feast_default.5010.a:0 "[rando_guest.GetFirstName|U], deixe-me contar uma história."
 feast_default.5010.b:0 "Todos devem ouvir a lenda."
 feast_default.5010.c:0 "Finalmente, um momento de silêncio."
 feast_default.5010.desc:0 "Em toda a celebração e alegria, há um silêncio na conversa de todos os presentes. [rando_guest.GetName|U] são os únicos que ainda trocam palavras, mas sinto-me compelido ao silêncio quando os olhares começam a se voltar para mim.\n\nTalvez este momento de quietude seja minha oportunidade para falar sobre [ROOT.Char.GetPromotedLegend.GetName]."
 feast_default.5010.t:0 "Um Silêncio Lendário"
 feast_default.5020.a.failure:0 "Seu discurso faz pouco para inspirar"
 feast_default.5020.a.success:0 "Seu discurso anima os convidados"
 feast_default.5020.a:0 "Eu tenho a astúcia de [ROOT.Char.GetFaith.TricksterGodName]!"
 feast_default.5020.b:0 "[ROOT.Char.GetFaith.KnowledgeGodName|U] age através de mim!"
 feast_default.5020.c:0 "Eu tenho o coração e a coragem de [ROOT.Char.GetFaith.WarGodName]!"
 feast_default.5020.d:0 "Por que sujar um silêncio tão bom?"
 feast_default.5020.desc:0 "Canecas batem, conversas ecoam, mãos batem na mesa, tudo em uma cacofonia caótica de barulho sem sentido. Sinto o som pulsar pelo meu corpo, então de repente tudo ao meu redor começa a desacelerar, pouco mais do que algumas palavras e risos ocasionais.\n\nNeste silêncio, sinto meu coração começar a acelerar e em minha mente um discurso vem a mim completamente escrito, crescendo de um sussurro a um grito, desesperado para ser compartilhado! Um discurso sobre minha legitimidade como [ROOT.Char.GetTitleAsNameNoTooltip|U]."
 feast_default.5020.t:0 "Silêncio"
 feast_default.6001.a:0 "O que eu teria feito sem [spouse.GetSheHe]."
 feast_default.6001.dislike_spouse:0 "Embora tenhamos muitas diferenças, devo confessar que [Select_CString( spouse.IsFemale, 'minha', 'meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('spouse'))] fez um ótimo trabalho com o meu banquete. [spouse.GetFirstName] garantiu que a comida chegasse na hora certa, os convidados estivessem todos sentados no lugar correto e todos parecessem satisfeitos.\n\nCom [spouse.GetSheHe] ao meu lado na grande mesa e as comemorações prestes a começar, faço questão de mostrar a [spouse.GetSheHe] que aprecio seu trabalho árduo na preparação deste banquete."
 feast_default.6001.like_spouse:0 "[Select_CString( spouse.IsFemale, 'Minha querida', 'Meu querido' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('spouse'))] [spouse.GetFirstName] tem trabalhado duro para garantir que tudo sobre o banquete ocorra sem problemas. A comida chega na hora certa, os convidados estão todos sentados no lugar correto e todos parecem satisfeitos.\n\nCom [spouse.GetFirstName] ao meu lado na grande mesa, tudo está pronto. Aperto a mão [spouse.GetHerHim] e sorrio, antes de me levantar para anunciar o início das comemorações."
 feast_default.6001.t:0 "A Pessoa Certa para o Trabalho"
 feast_default.6002.a:0 "\"Sim, fiz um ótimo trabalho, não foi?\""
 feast_default.6002.b:0 "\"[spouse.GetFirstNameNoTooltip] merece todo o crédito.\""
 feast_default.6002.desc:0 "Enquanto o banquete está em andamento e nossos convidados estão comendo e bebendo alegremente, [guest.GetTitledFirstName] se aproxima d[Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetFirstName] e eu na grande mesa.\n\"Este é um banquete maravilhoso! Meus cumprimentos aos anfitriões.\""
 feast_default.6002.t:0 "Um Esforço Louvável"
 feast_default.6003.a:0 "Expulse [Select_CString( fighter_2.IsFemale, 'a', 'o' )] [fighter_2.GetFirstNameNoTooltip] para se acalmar."
 feast_default.6003.b:0 "Contenha [Select_CString( fighter_1.IsFemale, 'a', 'o' )] [fighter_1.GetFirstNameNoTooltip] até que as coisas se acalmem."
 feast_default.6003.bodyguard:0 "\n[Select_CString( bodyguard.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('bodyguard'))], [bodyguard.GetTitledFirstName], está próximo à briga e espera minha ordem para intervir."
 feast_default.6003.c:0 "\"Parem! Vamos conversar sobre isso mais tarde.\""
 feast_default.6003.guard:0 "\nUm dos meus guardas está próximo à briga e espera minha ordem para intervir."
 feast_default.6003.opening:0 "Fiz tudo o que pude, garantindo que [fighter_1.GetTitledFirstName] e [fighter_2.GetTitledFirstName] ficassem o mais longe possível um do outro. Não foi suficiente, e agora eles quase chegaram às vias de fato, bem no meio do meu banquete!"
 feast_default.6003.t:0 "Na Minha Casa"
 feast_default.6101.a:0 "Vou distrair os convidados que estão se aproximando."
 feast_default.6101.b:0 "Venha agora, [troubled_guest.GetFirstNameNoTooltip]. Conte-nos uma história!"
 feast_default.6101.c.tt:0 "Nós dois poderíamos usar um descanso..."
 feast_default.6101.c:0 "[troubled_guest.GetFirstNameNoTooltip]! Preciso falar com você. Em particular."
 feast_default.6101.desc_disliked:0 "Pensar que [Select_CString( troubled_guest.IsFemale, 'uma', 'um' )] [troubled_guest.GetTitleTierName] agiria dessa forma..."
 feast_default.6101.desc_disliked_unlanded:0 "Pensar que [Select_CString( troubled_guest.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('troubled_guest'))] agiria dessa forma..."
 feast_default.6101.desc_liked:0 "[Select_CString( troubled_guest.IsFemale, 'A pobre', 'O pobre' )] [troubled_guest.GetWomanMan] nunca foi bo[Select_CString( troubled_guest.IsFemale, 'a', 'm' )] com pessoas!"
 feast_default.6101.desc_opening:0 "O olhar suplicante que recebo de [Select_CString( troubled_guest.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('troubled_guest'))] [troubled_guest.GetFirstName] está se tornando desesperado. Um grupo de convidados está se aproximando do canto onde [troubled_guest.GetSheHe] se escondeu a noite toda, e as paredes estão impedindo sua fuga.\n\n"
 feast_default.6101.t:0 "Problema [Select_CString( troubled_guest.IsFemale, 'da', 'do' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('troubled_guest'))|U]"
 feast_default.6111.a:0 "Não, por favor, continue!"
 feast_default.6111.b:0 "Por que não falamos mais sobre você?"
 feast_default.6111.c:0 "Você fazendo papel de bobo nunca poderia me entediar!"
 feast_default.6111.d.failure:0 "Você é entediante"
 feast_default.6111.d.success:0 "Sua lenda é cativante"
 feast_default.6111.d:0 "Já te contei sobre [ROOT.Char.GetPromotedLegend.GetName]?"
 feast_default.6111.desc:0 "Enquanto um prato de comida é substituído pelo próximo, [Select_CString( guest_to_talk_to.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_talk_to'))] [guest_to_talk_to.GetTitledFirstName] continua falando sem parar sobre [guest_to_talk_to.Custom('subject_of_interest')].\n\n\"...e foi assim que salvamos aquela confusão! Tem certeza de que não estou entediando você, [ROOT.Char.Custom('FormOfAddressForLiege')]?\""
 feast_default.6111.e:0 "Fascinante, sim, mas vamos discutir sobre o meu governo, certo?"
 feast_default.6111.t:0 "O Companheiro de Conversa"
 feast_default.6121.a:0 "Principalmente você, [hated_guest.GetFirstNameNoTooltip]. Aproveite!!"
 feast_default.6121.b:0 "O rosto [hated_guest.GetHerHim] quando 'salvei' [hated_guest.GetSheHe] da comida é definitivamente do meu agrado!"
 feast_default.6121.desc:0 "À medida que prato após prato de comida é trazido para o grande salão, um cheiro inconfundível chega até mim, e eu sorrio. O fato [Select_CString( hated_guest.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('hated_guest'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hated_guest'))] [hated_guest.GetTitledFirstName] ser sensível a [ROOT.GetCharacter.Custom('GetFoodDetail')] é algo que, infelizmente, esqueci de contar ao cozinheiro.\n\n\"Dou as boas-vindas a todos vocês e espero que apreciem a comida.\""
 feast_default.6121.t:0 "Insulto com Bom Gosto"
 feast_default.6231.a:0 "O comerciante de vinhos ainda deve estar na cidade!"
 feast_default.6231.b:0 "Todos nós temos que colaborar. Vamos lá agora."
 feast_default.6231.c:0 "Hora de abrir minhas reservas secretas."
 feast_default.6231.d:0 "Vamos trazer os meus vinhos mais finos."
 feast_default.6231.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')]. O vinho... Abrimos o próximo barril – estragou. Estragou #EMP completamente#!\"\n\nO banquete ainda continua, mas sem bebida, o ânimo certamente vai cair rapidamente."
 feast_default.6231.t:0 "O Desastre Acontece"
 feast_default.6251.a:0 "É um assunto que também me fascina!"
 feast_default.6251.b:0 "Eu não poderia me importar menos."
 feast_default.6251.c:0 "Estou mais interessado em #EMP você#!...!"
 feast_default.6251.desc:0 "A festa está chegando ao fim e me encontro em uma conversa profunda com [Select_CString( guest.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('guest'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] [guest.GetTitledFirstName].\n\n[guest.GetSheHe|U] pergunta minha opinião sobre [guest.Custom('subject_of_interest')] - um assunto que [guest.GetSheHe] [Select_CString( guest.IsFemale, 'própria', 'próprio' )] está profundamente interessad[Select_CString( guest.IsFemale, 'a', 'o' )]."
 feast_default.6251.t:0 "O Dilema"
 feast_default.6261.a:0 "Deixe [concerned_guest.GetSheHe] suspeitar do que [concerned_guest.GetSheHe] quiser."
 feast_default.6261.a_exposed:0 "É como se [concerned_guest.GetSheHe] não confiasse em mim!"
 feast_default.6261.b:0 "Traga algo a mais para [concerned_guest.GetTitleTierName] comer."
 feast_default.6261.c:0 "Acho que temos muitas ideias dietéticas para discutir!"
 feast_default.6261.desc_cannibal_guest:0 "\n\nEnquanto nos sentamos para comer, não consigo deixar de notar que [Select_CString( cannibal_guest.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('cannibal_guest'))] [cannibal_guest.GetTitledFirstName] parece especialmente apreciar a comida."
 feast_default.6261.desc_concerned_guest:0 "\n\nEnquanto nos sentamos para comer, no entanto, [Select_CString( concerned_guest.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('concerned_guest'))] [concerned_guest.GetTitledFirstName] apenas cutuca a comida à sua frente e me olha com desconfiança."
 feast_default.6261.desc_lunatic:0 "\"Eu mesmo dei uma mãozinha na preparação da refeição e espero que o resultado seja delicioso!\""
 feast_default.6261.desc_not_lunatic:0 "\"O assistente do cozinheiro deu corpo e alma para preparar esta refeição, e espero que o resultado seja delicioso!\""
 feast_default.6261.t:0 "Para Servir ao Homem"
 feast_default.6301.a:0 "Detenha [Select_CString( feast_artifact_culprit.IsFemale, 'a', 'o' )] [feast_artifact_culprit.GetTitledFirstNameNoTooltip] imediatamente!"
 feast_default.6301.b.tt:0 "[feast_artifact_culprit.GetTitledFirstNameNoTooltip] que pague pelos danos."
 feast_default.6301.b.tt_guilty:0 "[feast_artifact_culprit.GetTitledFirstNameNoTooltip] é culpad[Select_CString( feast_artifact_culprit.IsFemale, 'a', 'o' )]"
 feast_default.6301.b.tt_innocent:0 "[feast_artifact_culprit.GetTitledFirstNameNoTooltip] é inocente"
 feast_default.6301.b:0 "Traga [feast_artifact_culprit.GetSheHe] até mim."
 feast_default.6301.c.tt:0 "Você se livra do seu capitão traiçoeiro."
 feast_default.6301.c_learning:0 "Eu acredito que você sabe mais do que deixa transparecer, capitão..."
 feast_default.6301.d:0 "Eu nunca gostei dessa peça mesmo."
 feast_default.6301.desc:0 "No meio das festividades, o capitão da guarda corre em minha direção.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')], parece que alguém [feast_target_artifact.Custom('DamageArtifactAction')] o [feast_target_artifact.GetName]! As evidências apontam para [Select_CString( feast_artifact_culprit.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('feast_artifact_culprit'))] [Select_CString( ROOT.Char.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.GetLadyLord], [feast_artifact_culprit.GetTitledFirstNameNoTooltip], que tem se comportado de maneira estranha esta noite.\" [captain_of_the_guard_dummy.GetSheHe|U] lança um olhar na direção [Select_CString( feast_artifact_culprit.IsFemale, 'da', 'do' )] [feast_artifact_culprit.GetFirstNamePossessiveNoTooltip].\n\n\"O que [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord] quer que eu faça?\""
 feast_default.6301.desc_learning:0 "\n\nObservando, [feast_artifact_culprit.GetTitledFirstNameNoTooltip] parece bastante [Select_CString( feast_artifact_culprit.IsFemale, 'pertubada', 'pertubado' )]."
 feast_default.6301.desc_learning_guard:0 "\n\n[feast_target_artifact.Custom('DamageArtifactActionFollowup')]"
 feast_default.6301.t:0 "Responsabilidade Artefatual"
 feast_default.6302.a.tt:0 "[feast_artifact_culprit.GetTitledFirstNameNoTooltip] vai se lembrar disso."
 feast_default.6302.a:0 "Todos nós cometemos erros."
 feast_default.6302.a_lover:0 "#EMP [feast_trusted_friend.GetTitledFirstNameNoTooltip]!#!"
 feast_default.6302.b.tt:0 "Tenho certeza de que [Select_CString( feast_artifact_culprit.IsFemale, 'a', 'o' )] [feast_artifact_culprit.GetTitledFirstNameNoTooltip] é culpad[Select_CString( feast_artifact_culprit.IsFemale, 'a', 'o' )] de #EMP algo#!."
 feast_default.6302.b.tt_callous:0 "[feast_artifact_culprit.GetTitledFirstNameNoTooltip] será uma ótima adição aos meus prisioneiros."
 feast_default.6302.b:0 "Vamos manter isso entre nós."
 feast_default.6302.desc_intro:0 "[feast_trusted_friend.GetTitledFirstNameNoTooltip] se aproxima de mim em meu estudo. \"[Select_CString( feast_trusted_friend.IsFemale, 'Minha querida', 'Meu querido' )] [feast_trusted_friend.Custom2('RelationToMe', ROOT.Char)], eu só soube recentemente do aprisionamento d[Select_CString( feast_artifact_culprit.IsFemale, 'a', 'o' )] [feast_artifact_culprit.GetFirstNameNoTooltip]."
 feast_default.6302.desc_secret_lover:0 "\n\n[feast_trusted_friend.GetSheHe|U] me olha nervosamente. \"Isso pode ter sido um erro — eu estava... observando... [feast_artifact_culprit.GetTitledFirstNameNoTooltip] no momento do incidente e não pode ser [feast_artifact_culprit.GetSheHe].\"\nUm leve rubor se espalha pelas bochechas [feast_trusted_friend.GetHerHim]."
 feast_default.6302.desc_spirited_debate:0 "\n\n[feast_trusted_friend.GetSheHe|U] me olha com calma, mas preocupado. \"Lembro claramente que [feast_artifact_culprit.GetSheHe] estava envolvid[Select_CString( feast_artifact_culprit.IsFemale, 'a', 'o' )] em um debate acalorado com [Select_CString( feast_debatee_character.IsFemale, 'a', 'o' )] [feast_debatee_character.GetTitledFirstNameNoTooltip] na hora do incidente, então é impossível que [feast_artifact_culprit.GetSheHe] seja a culpada.\""
 feast_default.6302.t:0 "Inocência Fala"
 feast_default.6302.t_lover:0 "Inocência Repousa Aqui"
 feast_default.6351.a.tt:0 "Faça [Select_CString( feast_default_6351_fighter_1.IsFemale, 'a', 'o' )] [feast_default_6351_fighter_1.GetTitledFirstNameNoTooltip] pagar pelos danos."
 feast_default.6351.a:0 "[feast_default_6351_fighter_1.GetTitledFirstNameNoTooltip], como você pôde?"
 feast_default.6351.a_wrathful:0 "[feast_default_6351_fighter_1.GetTitledFirstNameNoTooltip], #EMP como você ousa!#!"
 feast_default.6351.b.tt:0 "Faça [Select_CString( feast_default_6351_fighter_2.IsFemale, 'a', 'o' )] [feast_default_6351_fighter_2.GetTitledFirstNameNoTooltip] pagar pelos danos."
 feast_default.6351.b:0 "Por que você permitiu que [feast_default_6351_fighter_1.GetSheHe] provocasse você, [feast_default_6351_fighter_2.GetTitledFirstNameNoTooltip]?"
 feast_default.6351.b_wrathful:0 "Minha paciência está se esgotando, [feast_default_6351_fighter_2.GetTitledFirstNameNoTooltip]..."
 feast_default.6351.c.tt:0 "Faça os dois pagarem pelos danos."
 feast_default.6351.c:0 "Não importa quem começou. Vocês dois são responsáveis."
 feast_default.6351.c_wrathful:0 "#EMP Chega!#! Vocês dois vão pagar pelos danos."
 feast_default.6351.d.tt:0 "Deixe [ROOT.Char.GetFaith.HighGodName] resolvê-los."
 feast_default.6351.d:0 "Em nome de [ROOT.Char.GetFaith.HighGodName], eu vou virar a outra face."
 feast_default.6351.desc_calm:0 "\n\nFaço um gesto para que meus guardas separem os dois que estão se rosnando."
 feast_default.6351.desc_intro:0 "Mal consigo me sentar quando ouço um grito vindo de [feast_default_6351_fighter_2.GetTitledFirstNameNoTooltip]. Parece que [feast_default_6351_fighter_2.GetSheHe] e [feast_default_6351_fighter_1.GetTitledFirstNameNoTooltip] realmente entraram em conflito, já que [feast_default_6351_fighter_2.GetFirstNameNoTooltip] está recebendo uma verdadeira surra [Select_CString( feast_default_6351_fighter_1.IsFemale, 'da', 'do' )] [feast_default_6351_fighter_1.GetWomanMan] [Select_CString( feast_default_6351_fighter_1.IsFemale, 'da', 'do' )] [feast_default_6351_fighter_1.GetFirstNameNoTooltip]. Tarde demais percebo que a briga deles seguiu direto para o [feast_target_artifact.GetName]!"
 feast_default.6351.desc_outro:0 "\n\nA dupla é apresentada diante de mim, enquanto jogam a culpa um no outro por iniciar a briga."
 feast_default.6351.desc_wrathful:0 "\n\nGrito com eles do outro lado do salão: \"#EMP Qual é o significado disso!#!\""
 feast_default.6351.e.tt:0 "Deixe-os escaparem impunes."
 feast_default.6351.e:0 "Essas coisas acontecem. Não era minha peça favorita."
 feast_default.6351.e_wrathful:0 "#EMP Felizmente para vocês, idiotas#!, eu nunca gostei dessa peça..."
 feast_default.6351.t:0 "Dano Colateral"
 feast_default.6400.a:0 "\"Não é mesmo?\""
 feast_default.6400.b:0 "\"Você deveria vir junto na próxima vez!\""
 feast_default.6400.desc:0 "Eu olho para fora através das festividades, quando sinto um puxão no meu pulso: \"Oh! Deixe-me ver!\" meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))], [guest.GetTitledFirstName], inclina-se para me inspecionar mais de perto.\n\n[guest.GetSheHe|U] cantarola e acena com a cabeça: \"Esse [admired_badge.GetName]... é #EMP maravilhoso#!.\"\n\nUm olhar sonhador entra no olhar de [guest.GetFirstNamePossessiveNoTooltip]: \"[badge_holy_site.GetName] é uma vista grandiosa, não é.\""
 feast_default.6400.t:0 "Um Distintivo com Vista"
 feast_default.6405.a.tt:0 "Ganhe [prestige_i] #V [THIS.Char.MakeScope.ScriptValue('num_badge_collection_prestige_single')]#! por @badge_icon! Distintivo [artifact|E] #weak (Atualmente [prestige_i] #V [THIS.Char.MakeScope.ScriptValue('num_badge_collection_prestige_payout')]#!)"
 feast_default.6405.a:0 "\"Eu sei, não é?\""
 feast_default.6405.b:0 "\"Você cuidaria do [gifting_badge.GetNameNoTooltip] para mim?\""
 feast_default.6405.desc:0 "Não posso deixar de notar meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))], [guest.GetTitledFirstName], me olhando apesar de tentar ser discreto. Ou melhor, olhando para o forro de distintivos de peregrino na minha vestimenta.\n\nOs pequenos amuletos capturam a luz e cintilam de forma atraente: \"Que coleção adorável de distintivos\", diz [guest.GetFirstNameNoTooltip], enquanto mais pessoas param para admirál-los.\n\n\"Quem dera eu tivesse tempo para colecionar esses...\""
 feast_default.6405.t:0 "Uma Espécie de Coleção"
 feast_default.6410.a:0 "\"Isso parece justo!\""
 feast_default.6410.b:0 "\"Hmm, preferiria não fazer isso.\""
 feast_default.6410.desc.outro:0 "Eu estive admirando seu [my_badge.GetName] por um tempo, e estava me perguntando se por acaso você gostaria de fazer uma troca...\"\n\n[guest.GetSheHe|U] puxa timidamente [guest.GetHerHis] [their_badge.GetName], movendo-o lentamente para capturar a luz em todo o seu esplendor.\n\n\"O que me diz?\" [guest.GetFirstNameNoTooltip] sorri e acena para mim."
 feast_default.6410.desc:0 "Meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))], [guest.GetTitledFirstName], aproxima-se de mim cautelosamente:"
 feast_default.6410.segway.close:0 "\"[guest.Custom2('RelationToMe', ROOT.Char )|U], "
 feast_default.6410.segway:0 "\"[ROOT.Char.GetTitledFirstName], "
 feast_default.6410.t:0 "Quer Trocar?"
 feast_default.6501.a:0 "Eu, uh... Deixa pra lá..."
 feast_default.6501.b.failure:0 "[innocent_guest.GetTitledFirstNameNoTooltip] fica chocado com seu humor perverso"
 feast_default.6501.b.success:0 "[innocent_guest.GetTitledFirstNameNoTooltip] acha a insinuação de duplo sentido engraçada"
 feast_default.6501.b.tt:0 "#F Você arrisca embaraçar [Select_CString( innocent_guest.IsFemale, 'a', 'o' )] [innocent_guest.GetTitledFirstNameNoTooltip] na esperança de que compartilhem o mesmo tipo de humor"
 feast_default.6501.b:0 "Repita o que você disse, mas devagar. Pense bem sobre isso."
 feast_default.6501.desc.ending_duo:0 "\n\nTalvez eu não esteja sozinho em achar isso engraçado; [fellow_pervert.GetTitledFirstName] cuspiu um pouco de sua bebida quando [Select_CString( innocent_guest.IsFemale, 'a', 'o' )] [innocent_guest.GetTitledFirstNameNoTooltip] repetiu a [Select_CString( innocent_guest.IsFemale, 'si mesma', 'si mesmo' )]. Os dois podem ter o mesmo tipo de humor obsceno que eu, ou podem se ofender com isso. Não vou saber o que cada um pensa a menos que eu fale."
 feast_default.6501.desc.ending_solo:0 "\n\nEstou sozinho em achar isso engraçado? Não vou saber a menos que eu fale. Vale a pena arriscar embaraçar [Select_CString( innocent_guest.IsFemale, 'a', 'o' )] [innocent_guest.GetFirstNameNoTooltip] por uma piada?"
 feast_default.6501.desc.opening:0 "\"Eu sei o que eu disse, só não entendo por que você acha tão engraçado?\"\n\n[innocent_guest.GetTitledFirstName] inclina sua cabeça para o lado enquanto seguro meu riso. Não contei a [innocent_guest.GetSheHe] que o que [innocent_guest.GetSheHe] disse poderia ser interpretado como algo indecente.\n\n"
 feast_default.6501.joke_a:0 "\"Se você apertar a cabeça, uma substância espessa vai jorrar!\""
 feast_default.6501.joke_b:0 "\"Estou com dificuldade em entender esse dialeto, e ouvi dizer que você é um linguista habilidoso!\""
 feast_default.6501.joke_c:0 "\"Ela exibia um belo decote no tribunal!\""
 feast_default.6501.t:0 "A Insinuação"
 feast_default.6510.a.tt.failure:0 "Todos parecem notar"
 feast_default.6510.a.tt.success:0 "Ninguém parece notar"
 feast_default.6510.a:0 "\"#EMP Venha aqui...\""
 feast_default.6510.b.tt.failure:0 "Não estou me sentindo muito bem"
 feast_default.6510.b.tt.success:0 "Sinto-me melhor do que esperava"
 feast_default.6510.b:0 "É melhor me preparar..."
 feast_default.6510.c:0 "Eu escolho o que comer!"
 feast_default.6510.desc.cat:0 "meu gato [ROOT.Char.Custom('CatStoryName')]"
 feast_default.6510.desc.dog:0 "meu cachorro [ROOT.Char.Custom('DogStoryName')]"
 feast_default.6510.desc.intro:0 "O próximo prato se aproxima da mesa e tudo o que vejo é uma gosma duvidosa servida no prato, mexendo-se como se estivesse viva. Meu estômago borbulha em aviso, e eu gostaria de pular esta próxima refeição... [Select_CString( primary_spouse.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('primary_spouse'))] [ROOT.Char.GetPrimarySpouse.GetFirstName] percebe meu desgosto e se inclina para frente, olhando-me severamente, balançando lentamente a cabeça em desaprovação.\n\nComo se para me salvar deste destino horrível, o próprio [ROOT.Char.GetFaith.PositiveAfterLife|U] interveio — eu acabo avistando"
 feast_default.6510.desc.outro:0 "procurando por qualquer sobra no chão. Esta é minha chance de evitar o prato desagradável!"
 feast_default.6510.desc_cat_and_dog:0 "meus animais, [ROOT.Char.Custom('CatStoryName')] e [ROOT.Char.Custom('DogStoryName')]"
 feast_default.6510.t:0 "Debaixo da Mesa"
 feast_default.8001.a:0 "Finalmente... Eles se foram."
 feast_default.8001.desc.compassionate:0 "Não consigo tirar os olhos do meu prato. A [ROOT.Char.Custom('RegionalEdibleMeat')] está quase intocada. Minha [ROOT.Char.Custom('GetExpensiveDrink_Singular')] intacta. Eu evito olhar para [Select_CString( honorary_guest.IsFemale, 'a', 'o' )] [honorary_guest.GetTitledFirstName] quando [honorary_guest.GetSheHe] fala sobre [honorary_guest.Custom('herhis_subject_of_interest')]. Vergonha.\n\n\"Por favor, meu amigo,\" me desculpo, saindo apressadamente da sala. Respiro pesadamente. É o que #EMP precisa#! ser feito. Dou um sinal para um dos serviçais e fecho os olhos.\n\nChamas, e então os gritos."
 feast_default.8001.desc.just:0 "Todos os outros foram embora. Todos — exceto meu convidado de honra e seu magnífico séquito. Dou um gole na minha taça, como [ROOT.GetCharacter.Custom('GetIncidentalDetailPresent')]. Eles não devem suspeitar. \"Com licença,\" travei o olhar com [Select_CString( honorary_guest.IsFemale, 'a', 'o' )] [honorary_guest.GetTitledFirstName] antes de sair. Ninguém deve saber. Ninguém vai saber.\n\nEnquanto dou a ordem para fechar as portas, tiro um segundo para respirar. O que é certo nem sempre é gentil.\n\nLogo, as chamas aparecem, e os gritos seguem."
 feast_default.8001.desc.random_1:0 "A conversa com [Select_CString( honorary_guest.IsFemale, 'a', 'o' )] [honorary_guest.GetTitledFirstName] não poderia ser mais amigável. Meus olhos vagam em direção ao [host.Custom('GetExpensiveDrink_Singular')] enquanto [honorary_guest.GetSheHe] faz um longo discurso sobre [honorary_guest.Custom('herhis_subject_of_interest')]. Todos os outros convidados já saíram. Claro, eles não quereriam interromper os assuntos importantes que meu convidado de honra deseja discutir.\n\nO veneno é insípido. Indetectável."
 feast_default.8001.desc.random_2:0 "A música e a dança atingiram volumes que tornam quase impossível conversar. O copeiro repõe o cálice [Select_CString( honorary_guest.IsFemale, 'da', 'do' )] [honorary_guest.GetTitledFirstName] e nossos olhos se encontram por apenas um momento.\n\n[ROOT.Char.GetHouse.GetMotto],\" murmuro, enquanto [Select_CString( honorary_guest.IsFemale, 'a', 'o' )] [honorary_guest.GetFirstNameNoTooltip] se engasga com o veneno."
 feast_default.8001.desc.sadistic:0 "As chamas lambem o telhado, e os gritos ecoam pela noite. Encosto minhas costas na porta fechada, ignorando os rostos horrorizados de minhas vítimas, e sorrio. Permitir que o ressentimento ardente se transforme em chamas é realmente a melhor maneira de lidar com a dissidência!\n\nÀ medida que os batimentos do outro lado vão ficando mais fracos e mais fracos, finalmente me permito rir."
 feast_default.8001.t.fire:0 "Das Cinzas às Chamas"
 feast_default.8001.t.knights:0 "Melhor Servido Frio"
 feast_default.8002.a:0 "Está feito."
 feast_default.8002.desc.just:0 "O momento chegou. Eu encaro [Select_CString( honorary_guest.IsFemale, 'a', 'o' )] [honorary_guest.GetTitledFirstName] enquanto [honorary_guest.GetSheHe] [honorary_guest.Custom('quirk_pos_present')]. Uma pena, mas precisa ser feito. \"Posso convidá-lo para um passeio?,\" minha pergunta é prontamente respondida com um sorriso curioso. \"Quais assuntos governamentais preocupam noss[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]?\"\n\nMuitos. Em breve, um a menos.\n\nEu lidero o caminho para uma das câmaras mais pequenas. A porta se fecha atrás. O fogo começa. Um movimento limpo."
 feast_default.8002.desc.random_2:0 "Finalmente. Sou apenas eu e [Select_CString( honorary_guest.IsFemale, 'a', 'o' )] [honorary_guest.GetTitledFirstName]. Sozinhos. \"Uma palavra, meu amigo.\" Todos os outros convidados começaram a dançar e a música chega até nós, abafada, pelas paredes de pedra. Um eco. Talvez o eco [honorary_guest.GetHerHim] também seja ouvido.\n\n[honorary_guest.GetFirstNameNoTooltip] ergue a sobrancelha, um dos meus $knight_culture_player_plural_no_tooltip_lowercase$ está servindo mais bebida a [honorary_guest.GetSheHe]. \"Há assuntos importantes?,\" [honorary_guest.GetSheHe] pergunta. O cálice quase toca os lábios [honorary_guest.GetHerHim]. Quase. Um som abafado pelas paredes de pedra. A garganta [honorary_guest.GetHerHim] foi cortada. Um eco."
 feast_default.8002.desc.sadistic:0 "\"Venha por aqui, [honorary_guest.GetFirstName], vou lhe mostrar o novo broche que encomendei para você. Um presente fino para o melhor dos convidados.\"\n\nEu lidero o caminho, e [honorary_guest.GetSheHe] segue, como [ROOT.GetCharacter.Custom('GetIncidentalDetailPresent')]. \"Aqui está,\" anuncio, abrindo a porta para uma sala pequena e fracamente iluminada. Posso ver a confusão nos olhos [honorary_guest.GetHerHim] — apenas por um momento. A realização é rápida o suficiente. \"Não... você não pode.\"\n\n\"Oh, eu lhe garanto que posso."
 feast_default.8002.t.poison:0 "Outra Bebida"
 feast_default.8002.t:0 "Uma Faca no Escuro"
 feast_default.8003.a.failure:0 "[honorary_guest.GetShortUIName] não bebe"
 feast_default.8003.a.success:0 "[honorary_guest.GetShortUIName] bebe do cálice"
 feast_default.8003.a:0 "#EMP Um brinde.#!"
 feast_default.8003.desc.compassionate:0 "Me apresso em limpar as gotas de suor que escorrem pela testa, segurando o lenço com mais força do que o necessário. [honorary_guest.GetTitledFirstName] fala sobre [honorary_guest.Custom('subject_of_interest')], e eu não consigo manter os olhos focados. \"Um momento...\" Me desculpo ao ver [honorary_guest.GetSheHe] aproximando seu cálice aos seus lábios.\n\nEu sei o que ele contém."
 feast_default.8003.desc.poison:0 "Todos os convidados parecem estar focados nas músicas e na dança. Poucos permanecem sentados. Felizmente, minha conversa com [Select_CString( honorary_guest.IsFemale, 'a', 'o' )] [honorary_guest.GetTitledFirstName] parece ser suficiente para mantê-lo por perto. \"Um banquete excelente,\" [honorary_guest.GetSheHe] diz, deixando seu cálice de lado para dar outra mordida.\n\n\"Ah, você aquece meu coração,\" respondo, enquanto faço um sinal para meu copeiro. Este será o último banquete [honorary_guest.GetHerHim]. Meus olhos encontram [Select_CString( honorary_guest.IsFemale, 'a', 'o' )] [honorary_guest.GetFirstNameNoTooltip]. Um momento de dúvida."
 feast_default.8003.desc.sadistic:0 "\"Por favor, meu amigo, permita-me encher o seu cálice, pois você é meu convidado mais amado,\" ofereço com o sorriso mais caloroso. [honorary_guest.GetTitledFirstName] acena com a cabeça, oferecendo-me seu copo. Os convidados iniciaram uma [ROOT.Char.Custom('GetMedievalDance')], e o alvoroço deles é distração suficiente.\n\nDerramo o veneno do meu anel com o máximo cuidado. \"Espero que esteja com sede.\""
 feast_default.8003.t:0 "Um Acidente Desafortunado"
 feast_default.8004.a.goh_murder.tt:0 "[honorary_guest.GetShortUIName] morre"
 feast_default.8004.a.tt.failure.host:0 "[murder_victim.GetShortUIName] sobrevive"
 feast_default.8004.a.tt.failure:0 "Você sobrevive"
 feast_default.8004.a.tt.success.host:0 "[murder_victim.GetShortUIName] morre"
 feast_default.8004.a.tt.success:0 "Você morre"
 feast_default.8004.a:0 "Espere... o que está acontecendo?"
 feast_default.8004.desc.fallback:0 "[host.GetTitledFirstName] insistiu que [Select_CString( honorary_guest.IsFemale, 'a', 'o' )] [honorary_guest.GetTitledFirstName] ficasse para uma conversa muito, muito importante. E, é claro, seu séquito devesse [Select_CString( honorary_guest.IsFemale, 'acompanhá-la', 'acompanhá-lo' )]."
 feast_default.8004.desc.goh_group:0 "$feast_default.8004.desc.goh_intro$ \"Socorro!\" Um grito interrompe a conversa. \"#EMP Socorro!#!\" Outro. Quando olho ao redor, vejo o brilho prateado das espadas. E uma delas aponta diretamente para mim.\n\n\"Acabou, [murder_victim.GetTitleAsNameNoTooltip].\""
 feast_default.8004.desc.goh_intro:0 "[host.GetTitledFirstName] insiste que eu fique para discutir os assuntos do reino. \"Como eu estava dizendo,\" [host.GetSheHe] continua, alheio aos meus bocejos disfarçados.\n\n"
 feast_default.8004.desc.goh_solo:0 "$feast_default.8004.desc.goh_intro$Mas quando abro os olhos novamente, vejo um brilho prateado. \"O banquete termina aqui.\""
 feast_default.8004.desc.intro:0 "Dou um gole na minha [host.Custom('RegionalDrink')] conforme a noite se aproxima do fim. Meus olhos estão cansados, mas"
 feast_default.8004.t:0 "Mantenha seus Olhos Abertos"
 feast_default.8052.a:0 "Sempre quis sair em glória ardente..."
 feast_default.8052.desc:0 "\"Fogo!\"\n\nÀ medida que o pânico se espalha entre os convidados, procuro por [host.Custom2('MyCharacterIntroduction', ROOT.Char)], mas encontro a sua cadeira vazia.\n\nO fogo se espalha rapidamente - pano manchado de [ROOT.Char.Custom('RegionalDrink')] e convidados supervestidos queimam rapidamente. Minha pele está queimando, #EMP descamando#!, e eu grito; mas em breve isso também se torna impossível, à medida que a fumaça densa sufoca meus gritos."
 feast_default.8052.t:0 "Um Fim Abrupto"
 feast_default.8061.a.good:0 "[murder_guest.GetFirstNameNoTooltip]... foi embora assim."
 feast_default.8061.a:0 "Acho que o banquete acabou agora."
 feast_default.8061.desc.death_alone:0 "O clima está mais sombrio do que eu esperava quando nos preparamos para sair do banquete [Select_CString( host.IsFemale, 'da', 'do' )] [host.GetTitledFirstName]. O corpo [Select_CString( murder_guest.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('murder_guest'))] [murder_guest.GetTitledFirstName] foi [Select_CString( murder_guest.IsFemale, 'encontrada', 'encontrado' )], ainda quente no chão.\n\nA morte tem assombrado essas paredes e a bebida ficou azeda em nossos lábios."
 feast_default.8061.desc.fail:0 "$feast.7151.desc$"
 feast_default.8061.desc.fail_me:0 "Minhas mãos ainda tremem após o incidente de ontem à noite, e os mercenários que deveriam tirar minha vida foram presos [Select_CString( host.IsFemale, 'pela', 'pelo' )] [host.GetTitledFirstName].\n\nNo entanto, esse sentimento de inquietação não pode ser facilmente dissipado."
 feast_default.8061.desc.fire:0 "[host.Custom2('MyCharacterIntroduction', ROOT.Char)|U] nos conduz a mim e a um punhado de outros para fora do salão do banquete antes de tentar fechar a porta.\n\nNo entanto, antes que [host.GetSheHe] consiga, os gritos surgem de dentro e todos os presentes saem para a noite, enquanto as chamas começam a subir do salão do banquete."
 feast_default.8061.t.fire:0 "Fogo! Fogo...?"
 feast_default.8061.t:0 "$feast.7151.t$"
 feast_default.9001.a:0 "Até a próxima!"
 feast_default.9001.desc:0 "Com todos indo para suas respectivas casas, estou orgulhoso em dizer que o banquete foi um sucesso!"
 feast_default.9001.desc_exotic:0 "Com todos indo para casa com barrigas cheias de iguarias exóticas, estou orgulhoso em dizer que o banquete foi um sucesso!"
 feast_default.9001.desc_lavish:0 "Com todos os meus convidados saindo com o conteúdo inteiro da minha vasta despensa em seus estômagos, posso orgulhosamente dizer que o banquete foi um sucesso!"
 feast_default.9001.desc_meager:0 "Com todos os meus convidados lutando pela última migalha de minha modesta mesa, sinto um grande alívio ao vê-los finalmente partirem com roupas largas e barrigas roncando."
 feast_default.9001.no_spouse:0 "No entanto, ainda estou grato por essa empreitada ter chegado ao fim, pelo menos por enquanto."
 feast_default.9001.spouse:0 "\n\nTenho [Select_CString( spouse.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] [spouse.GetFirstName] para agradecer por grande parte do seu sucesso, e sinto nada além de gratidão enquanto [spouse.GetSheHe] se despede dos últimos convidados."
 feast_default.9001.t:0 "Conforme Meus Convidados Partem"
 feast_default.9002.a:0 "Adeus, [Select_CString( host.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))]!"
 feast_default.9002.desc:0 "Que banquete! Vou lembrar dos dias passados nos salões [Select_CString( host.IsFemale, 'da', 'do' )] [host.GetTitledFirstName] por muito tempo."
 feast_default.9002.desc_ending:0 "\n\nAgora é hora de apagar os rastros da bebida e da diversão, e mais uma vez retomar meus deveres..."
 feast_default.9002.desc_exotic:0 "Que banquete! Antes de vir, nunca poderia imaginar as iguarias exóticas que provaria durante o meu tempo nos salões [Select_CString( host.IsFemale, 'da', 'do' )] [host.GetTitledFirstName]. Este foi um banquete que nunca esquecerei!"
 feast_default.9002.desc_lavish:0 "Que banquete! Antes de vir, minhas roupas estavam largas e desajeitadas, agora saio dos salões [Select_CString( host.IsFemale, 'da', 'do' )] [host.GetTitledFirstName] duas vezes mais cheio de comida e alegria do que quando cheguei! Este foi um banquete que vou lutar para esquecer!"
 feast_default.9002.desc_meager:0 "Que banquete? Embora geralmente esperasse muito mais comida de um banquete, saio dos salões [Select_CString( host.IsFemale, 'da', 'do' )] [host.GetTitledFirstName] com fome, mas pelo menos a companhia foi boa. Este foi um banquete que gostaria de esquecer."
 feast_default.9002.desc_roughed_up:0 "\n\nQue banquete! Minhas bolsas estão carregadas com talheres furtados e [host.Custom('GetExpensiveMeal')], aquele [host.Custom2('InsultNoun', ROOT.Char)] [host.GetFirstNameNoTooltip] nunca deveria ter me insultado!"
 feast_default_1016_observed.desc:0 "Você teve uma testemunha"
 feast_default_1016_stealth.desc:0 "Seu roubo passou despercebido"
 feast_default_1018_failure.desc:0 "[witness.GetTitledFirstNameNoTooltip] não está convencid[Select_CString( witness.IsFemale, 'a', 'o' )]"
