l_spanish:
 county_or_15_dev:0 "[county.GetName] e cada [county|E] do [realm|E] com 15 ou menos [development|E]"
 hold_court.0001.a:0 "Faça um gesto para o primeiro da fila se aproximar."
 hold_court.0001.b.tooltip:0 "Seu público termina e você manda os peticionários embora"
 hold_court.0001.b:0 "Pensando bem, está um dia bonito lá fora..."
 hold_court.0001.desc:0 "Sentado no meu trono, faço um gesto para que meus guardas abram as portas do salão. Uma fila de pessoas entra, algumas se alinhando em frente ao meu trono, enquanto outras se afastam para simplesmente observar os acontecimentos.\n\nApós alguns momentos, todo movimento na câmara cessa, todos os olhares voltados para mim com expectativa. À minha frente, conto [ROOT.Var('num_petitioners').GetValue|V0] peticionários em fila ordenada, aguardando que eu os chame."
 hold_court.0001.t:0 "$hold_court_header$ Início"
 hold_court.0021.a:0 "Meu trabalho aqui está feito."
 hold_court.0021.arrogant:0 "É bom deixar meus súditos admirados com minha presença."
 hold_court.0021.desc:0 "À medida que o último peticionário parte, vários cortesãos o seguem para fora da sala, tendo negócios a atender em outro lugar. Outros permanecem, conversando entre si sobre os recentes eventos.\n\nLogo, a formalidade cerimonial dos procedimentos desaparece completamente, dando lugar ao zumbido e agitação da vida normal da corte."
 hold_court.0021.every_guest_and_courtier:0 "Todo Convidado e Cortezão:"
 hold_court.0021.gregarious:0 "Esta parece ser uma boa oportunidade para mingular com minha corte."
 hold_court.0021.shy:0 "Mal posso esperar para voltar aos meus aposentos..."
 hold_court.0021.t:0 "$hold_court_header$ Conclusão"
 hold_court.1001.a.failure.tt:0 "[rumormonger.GetTitledFirstName] na verdade não sabe nenhum [secret|E] relevante"
 hold_court.1001.a.failure:0 "As informações [Select_CString( rumormonger.IsFemale, 'da', 'do' )] [rumormonger.GetTitledFirstName] são apenas fofocas vazias"
 hold_court.1001.a.seducer:0 "Talvez possamos chegar a outro acordo?"
 hold_court.1001.a.success.tt:0 "[rumormonger.GetTitledFirstName] revela a você todos os [secrets|E] relevantes que [rumormonger.GetSheHe] conhece"
 hold_court.1001.a.success:0 "As informações [Select_CString( rumormonger.IsFemale, 'da', 'do' )] [rumormonger.GetTitledFirstName] contêm material de chantagem valioso"
 hold_court.1001.a:0 "Uma quantia considerável, mas não posso me dar ao luxo de permanecer ignorante."
 hold_court.1001.b:0 "Ninguém me extorque diante da minha própria corte! Guardas, prendam [rumormonger.GetSheHe]!"
 hold_court.1001.c:0 "Desapareça, falastrão! Minha corte não tem lugar para gente como você!"
 hold_court.1001.desc:0 "[Select_CString( rumormonger.IsFemale, 'Minha convidada', 'Meu convidado' )] [rumormonger.GetTitledFirstName] se aproxima do meu trono com um sorriso no rosto e se curva profundamente.\n\n\"Saudações, majestade. Durante minha recente viagem a [neighboring_realm.GetName], descobri algumas #EMP informações fascinantes#! sobre vários súditos [Select_CString( neighboring_ruler.IsFemale, 'da', 'do' )] [neighboring_ruler.GetTitledFirstName]. Eu ficaria feliz em compartilhá-las com você... por um preço."
 hold_court.1001.t:0 "$hold_court_header$ Espionagem Indireta"
 hold_court.1011.a:0 "É um belo dia para a guerra!"
 hold_court.1011.b:0 "Por favor, parta imediatamente — não posso arriscar ofender [Select_CString( target_character.IsFemale, 'a', 'o' )] [target_character.GetTitleAsNameNoTooltip]."
 hold_court.1011.c:0 "Não posso ajudar você, mas por favor aproveite minha hospitalidade."
 hold_court.1011.desc:0 "\"[Select_CString( ROOT.Char.IsFemale, 'Oh magnífica', 'Oh magnífico' )] [ROOT.Char.GetTitledFirstNameNoTooltip], eu sou [claimant_guest.GetFirstName], e viajei de longe para pedir sua ajuda em corrigir uma grande injustiça!\"\n\n[Select_CString( claimant_guest.IsFemale, 'A', 'O' )] [claimant_guest.GetWomanMan] na minha frente se curva profundamente antes de continuar com seu apelo bem ensaiado. \"[target_character.Custom2('MyCharacterIntroduction', claimant_guest)|U] atualmente ocupa o trono de [target_title.GetNameNoTier], mas eu sou o verdadeiro e legítimo governante dessas terras!\"\n\n\"Se você me ajudar a pressionar minha reivindicação, eu juro lealdade a você e o servirei fielmente até o fim dos meus dias.\""
 hold_court.1011.t:0 "$hold_court_header$ Um Chamado para a Guerra"
 hold_court.1021.a.stewardship:0 "Vamos estabelecer um sistema de compartilhamento de colheitas com as aldeias vizinhas."
 hold_court.1021.a:0 "Você terá os fundos necessários para reconstruir."
 hold_court.1021.b:0 "Seu serviço pagará sua dívida."
 hold_court.1021.c:0 "Se os campos estiverem áridos, você empunhará uma espada."
 hold_court.1021.desc:0 "Um camponês magro e esfarrapado está diante de mim, boquiaberto com a opulência da minha sala do trono. Obviamente distraído, chamo [peasant.GetSheHe] para chamar sua atenção.\n\n\"Oh, desculpe, [ROOT.Char.Custom('FormOfAddressForLiege')]. Eu, uh... Minha vila em [county.GetNameNoTier] foi atingida por uma praga este ano. Perdemos não apenas a colheita, mas também as sementes. Não temos nada, morreremos de fome sem ajuda!\"\n\nOlhando novamente ao redor da minha sala do trono, [peasant.GetSheHe] acrescenta: \"Certamente você tem riqueza de sobra?\""
 hold_court.1021.t:0 "Pó ao Pó"
 hold_court_1001_pool_tt:0 "[rumormonger.GetShortUIName] deixa sua [court|E]"
 hold_court_header:0 "Realizar Audiência:"
 hold_court_placeholder_gain_cgv:0 "Você ganha #P 10#! Grandeza na Corte"
 hold_court_placeholder_lose_cgv:0 "Você perde #N 10#! Grandeza na Corte"
 hold_court_start_activity:0 "Você ouve o primeiro peticionário"
