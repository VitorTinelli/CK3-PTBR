l_spanish:
 feast_default_alex.100.a:0 "\"Que tenhamos belas memórias pela frente, [guest.GetFirstNameNoTooltip].\""
 feast_default_alex.100.aa:0 "\"Não me lembro de nada significativo.\""
 feast_default_alex.100.b:0 "\"Ah, um dia #EMP maravilhoso#! de fato!\""
 feast_default_alex.100.desc:0 "[Select_CString( guest.IsFemale, 'Minha', 'Meu' )] [root_scope.Custom2('RelationToMeShort', SCOPE.sC('guest'))], [guest.GetTitledFirstName], [guest.Custom('quirk_pos_present')] enquanto [guest.GetSheHe] se aproxima de mim.\n\n\"[Select_CString( root_scope.IsFemale, 'Minha', 'Meu' )] [root_scope.Custom('ComplimentAdjective')] [guest.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))]! Tantos momentos compartilhados! Tantas memórias!\" [guest.GetSheHe|U] ri. \"Como sempre, é um dia alegre quando sou abençoado com sua companhia.\"\n\n\"Ah, sim!\" [Select_CString( other_guest.IsFemale, 'a', 'o' )] [other_guest.GetTitledFirstName] próximo intervém entusiasmado, \"O povo conta a história do seu passado: quando [guest_memory.GetThirdPerspectiveDescription]!\""
 feast_default_alex.100.t:0 "Memórias Compartilhadas"
 feast_default_alex.200.a:0 "Hm, devemos preparar [root_scope.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]..."
 feast_default_alex.200.b:0 "Venha aqui, acalme-se."
 feast_default_alex.200.c:0 "Oremos por [afflicted_top_liege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]."
 feast_default_alex.200.d:0 "Não se preocupe, isso nunca chegará aqui!"
 feast_default_alex.200.desc:0 "\"M[Select_CString( root_scope.IsFemale, 'inha', 'eu' )] [guest.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))], ouvi rumores de uma praga chamada [epidemic.GetName]...\" diz [Select_CString( guest.IsFemale, 'a', 'o' )] [guest.GetTitledFirstName] preocupado.\n\n\"Dizem que está se espalhando pelo [afflicted_top_liege.GetPrimaryTitle.GetBaseName], com as vítimas sendo [sick_peasant.Custom('disease_desc_short')]... nem mesmo o [root_scope.Custom('GetExpensiveMeal')] consegue tirar isso da minha cabeça.\""
 feast_default_alex.200.t:0 "Uma Praga de Boatos"
 plague_preparations_modifier:0 "Preparações contra a Praga"
 plague_preparations_modifier_desc:0 "Este local está bem preparado para qualquer praga que possa surgir."
