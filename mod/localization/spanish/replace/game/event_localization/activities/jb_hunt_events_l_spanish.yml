l_spanish:
 friend_bonded_during_hunt:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUIName] criaram um vínculo durante uma caçada"
 friend_compassion_for_animals:0 "[CHARACTER.GetShortUIName|U] impressionou [TARGET_CHARACTER.GetShortUIName] ao demonstrar profunda compaixão pelos animais"
 friend_compassion_for_animals_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] impressionou [CHARACTER.GetShortUIName] ao demonstrar profunda compaixão pelos animais"
 friend_cruelty_to_animals:0 "[CHARACTER.GetShortUIName|U] horrorizou [TARGET_CHARACTER.GetShortUIName] ao demonstrar crueldade sádica contra um animal"
 friend_cruelty_to_animals_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] horrorizou [CHARACTER.GetShortUIName] ao demonstrar crueldade sádica contra um animal"
 hunt.8000.a:0 "Minhas habilidades de falcoaria irão impressionar!"
 hunt.8000.b:0 "Eu vou pegar um peixe eu mesmo!"
 hunt.8000.desc:0 "[swooning_attendee.GetName] tem admirado minha ave desde que nos separamos para uma caçada, e mal posso culpar [swooning_attendee.GetSheHe], é uma criatura magnífica e bela.\n\nNos aproximamos de um pequeno rio, rico e movimentado com peixes de tamanho generoso, e sinto que esta é a oportunidade perfeita para mostrar o que meu [activity.Custom('GetRaptorType')] pode fazer!"
 hunt.8000.falcon_failure:0 "Seu [activity.Custom('GetRaptorType')] falhou"
 hunt.8000.falcon_success:0 "Seu [activity.Custom('GetRaptorType')] pegou um peixe"
 hunt.8000.fist_failure:0 "Você fez papel de bobo"
 hunt.8000.fist_success:0 "Você pega um peixe com as mãos nuas"
 hunt.8000.t:0 "Exibicionismo"
 hunt.8010.a:0 "Voe, meu [activity.Custom('GetRaptorType')]"
 hunt.8010.b:0 "Concentre-se no rastreamento."
 hunt.8010.desc:0 "Meu [activity.Custom('GetRaptorType')] parece estar ficando bastante agitado em meu punho, batendo e bicando inquietamente em mim. Sem dúvida, a fera está ansiosa para voar novamente e trazer-me uma caça fresca!\n\nSeria bom para a ave esticar suas asas, mas ainda não avistei nenhum sinal de algo que valha a pena caçar, então é provável que meu [activity.Custom('GetRaptorType')] retornasse de mãos vazias."
 hunt.8010.falcon_failure:0 "$hunt.8000.falcon_failure$"
 hunt.8010.falcon_success:0 "Seu [activity.Custom('GetRaptorType')] trouxe uma caça de volta"
 hunt.8010.t:0 "A Festa do [activity.Custom('GetRaptorType')|U]"
 hunt.8020.a:0 "\"Uma bela descoberta, meu amigo emplumado!\""
 hunt.8020.b:0 "\"Essas riquezas pertencem a [ROOT.Char.WealthGodName].\""
 hunt.8020.desc:0 "Meu [activity.Custom('GetRaptorType')] pousa e observa atentamente a paisagem. Em um piscar de olhos, a ave desce sobre algo e entra em frenesi quando alcança sua presa. Ela bicando e arranhando algo no chão, embora eu não possa ver o que é.\n\nEu me apresso em direção ao [activity.Custom('GetRaptorType')] agitado e encontro-o não sobre uma fera morta, mas sobre uma pequena coleção de moedas e bugigangas! O valor não parece ser muito extravagante, e tenho certeza de que não conseguiria encontrar o proprietário original mesmo que quisesse."
 hunt.8020.t:0 "O Doador de Presentes"
 hunt.8030.a:0 "Vamos encontrar a fera!"
 hunt.8030.b:0 "\"Siga o rastro, eu alcançarei você depois de um breve descanso.\""
 hunt.8030.desc:0 "Meu [activity.Custom('GetRaptorType')] desapareceu completamente da minha vista, e olhando ao redor da paisagem, não vejo nada. Então, ouço-a gritando por mim e a encontro pousada com sangue pingando de suas garras, embora não haja sinal de nenhuma outra criatura por perto.\n\nClaramente, meu [activity.Custom('GetRaptorType')] recentemente se envolveu em uma luta com algo grande demais para enfrentar sozinha, e deve estar por perto!"
 hunt.8030.failure:0 "Você faz um pequeno progresso"
 hunt.8030.success:0 "Você faz um progresso significativo"
 hunt.8030.t:0 "Rastreando o [activity.Custom('GetRaptorType')|U]"
 hunt.8040.a:0 "Eu preciso tê-la!"
 hunt.8040.b:0 "Eu não preciso de sorte."
 hunt.8040.c:0 "\"Posso oferecer o preço certo.\""
 hunt.8040.desc:0 "[glove_salesman.GetName] tem sido a estrela da caçada até agora; as garras de seu [activity.Custom('GetRaptorType')] sempre pingando e vermelhas de sangue fresco, tanto que a luva [glove_salesman.GetHerHim] parece estar manchada de um carmesim permanente. Não posso deixar de perguntar o que [glove_salesman.GetSheHe] fez para treinar uma ave de caça tão obediente e habilidosa, e [glove_salesman.GetSheHe] apenas ri.\n\n\"Gostaria de poder dizer que é meu bom treinamento, mas falando sinceramente, minha luva é abençoada por [glove_salesman.GetFaith.FateGodName]. Estou disposto a abrir mão dela, pelo preço certo.\""
 hunt.8040.t:0 "A Luva da Sorte"
 hunt.8050.a:0 "Siga as pegadas mesmo assim."
 hunt.8050.b:0 "\"Suponho que você esteja certo.\""
 hunt.8050.desc:0 "Mais uma vez me encontro na natureza, em busca do elusivo(a) [activity.Custom('GetAnimalType')] [activity.Custom('GetLegendaryColor')], e ainda não avistei sequer um vestígio dele. Isso até eu ver um conjunto de pegadas de animal que se afasta bastante do caminho.\n\n[m_hunt.GetName] agarra meu braço com fervor e me puxa. [m_hunt.GetSheHe|U] me assegura que essas não são as pegadas da fera lendária, mas de um(a) [activity.Custom('GetAnimalType')] comum."
 hunt.8050.t:0 "Rastros Avistados!"
 hunt.8060.a:0 "\"Me conte tudo o que você sabe.\""
 hunt.8060.b:0 "\"Você conhece o [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l], junte-se a mim!\""
 hunt.8060.c:0 "\"Louco! Fique longe de mim!\""
 hunt.8060.desc:0 "Estamos progredindo na busca pelo(a) [activity.Custom('GetAnimalType')] [activity.Custom('GetLegendaryColor')] quando somos interrompidos por [Select_CString( eccentric_hunter_scope.IsFemale, 'uma', 'um' )] [eccentric_hunter_scope.GetWomanMan] [Select_CString( eccentric_hunter_scope.IsFemale, 'abatida', 'abatido' )] e sem dormir.\n\n\"Cuidado! Cuidado com a fera! Estou procurando o(a) [activity.Custom('GetAnimalType')] [activity.Custom('GetLegendaryColor')] há muitos anos, em todo o [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]! Ela é cruel e só sede por carne humana! Saia, isso é meu fardo para carregar!\""
 hunt.8060.failure:0 "[eccentric_hunter_scope.GetSheHe|U] não te conta nada"
 hunt.8060.success:0 "[eccentric_hunter_scope.GetSheHe|U] te conta tudo"
 hunt.8060.t:0 "Cuidado!"
 hunt.8070.a:0 "Dê o tiro!"
 hunt.8070.b:0 "Não, isso não pode ser real."
 hunt.8070.desc.intro:0 "Estou me debatendo no [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] por horas. [activity.Custom('GetAnimalType')|U] [activity.Custom('GetLegendaryColor')] assombra meus sonhos, sempre fora do meu alcance.\n\nMas então, eu o vejo! Lá em cima de um barranco, [activity.Custom('GetAnimalSoundParticiple')] e posando ao sol, zombando de mim!"
 hunt.8070.desc.mid.fallback:0 "Esse objeto da minha obsessão só me traz raiva a cada momento em que estou acordado."
 hunt.8070.desc.mid.lunatic:0 "Ouço os sussurros ambientes do meu grupo de caça, eles pensam que não consigo abater a fera!"
 hunt.8070.desc.mid.paranoid:0 "Não parece real, talvez alguém da minha comitiva tenha feito uma farsa para me enganar!"
 hunt.8070.desc.outro:0 "Não consigo evitar a sensação de que isso é apenas mais um sonho, mas estou totalmente acordado."
 hunt.8070.t:0 "Mire, Aponte..."
 hunt.8071.a:0 "Siga o rastro de sangue!"
 hunt.8071.desc.intro:0 "Disparo minha flecha e observo enquanto ela voa em direção ao barranco. Juro que ouço um grito de dor, mas não posso ter certeza.\n\nCorro em direção à origem do som"
 hunt.8071.desc.outro:0 "e encontro a fera correndo mais profundamente no [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]! Em seu rastro, deixa um rastro de sangue, embora o tiro pareça não ter ferido gravemente o maldito."
 hunt.8071.t:0 "... Atire!"
 hunt.8072.a:0 "Estou enlouquecendo."
 hunt.8072.desc.outro:0 "e encontro o corpo sem vida [Select_CString( murder_target.IsFemale, 'da', 'do' )] [murder_target.GetNamePossessive] com uma flecha cravada em seu crânio. Sinto minha pele gelar e minhas pernas fraquejarem. Como pude fazer uma coisa dessas? [murder_target.GetSheHe|U] não se parece em nada com [activity.Custom('GetAnimalType')] [activity.Custom('GetLegendaryColor')]!"
 hunt.8073.a:0 "Não sou um lunático!"
 hunt.8073.desc.outro:0 "e tudo o que resta é uma flecha fincada profundamente no chão. Não há pegadas, nem fezes, nenhum sinal de qualquer tipo de [activity.Custom('GetAnimalType')]. Será que esteve aqui mesmo ou tudo está na minha cabeça? Será que existe mesmo o(a) [activity.Custom('GetAnimalType')] [activity.Custom('GetLegendaryColor')]?"
 hunt.8074.a:0 "Um abate é um abate."
 hunt.8074.desc.outro:0 "e encontro o cadáver do(a) [activity.Custom('GetAnimalType')] comum, sem nenhum traço de [activity.Custom('GetLegendaryColor')]. Talvez tenha sido apenas um truque da luz, mas pelo menos o abate foi limpo."
 hunt.8500.a:0 "Eu mesmo vou subir lá!"
 hunt.8500.b:0 "Eu confio no treinamento do meu [activity.Custom('GetRaptorType')]."
 hunt.8500.desc:0 "Solto meu [activity.Custom('GetRaptorType')], mas em vez de voar reto e verdadeiro, a tola criatura apenas voa até a árvore mais próxima do [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTree')] e pousa lá.\n\nEla me olha com aqueles olhos vazios e insensíveis, como se não tivesse acabado de me envergonhar na frente de todo o grupo de caça. Chamo para que desça de lá, e recebo apenas o riso abafado dos meus companheiros caçadores."
 hunt.8500.failure:0 "Você cai"
 hunt.8500.falcon_failure:0 "Seu [activity.Custom('GetRaptorType')] continua lá em cima"
 hunt.8500.falcon_success:0 "Seu [activity.Custom('GetRaptorType')] retorna para você"
 hunt.8500.success:0 "Você recupera seu [activity.Custom('GetRaptorType')]"
 hunt.8500.t:0 "No topo do mundo"
 hunt.8510.a.failure:0 "Você é atacado por [ROOT.Char.Custom('GetAnimalType')]"
 hunt.8510.a.success:0 "Você espanta o(a) [ROOT.Char.Custom('GetAnimalType')]"
 hunt.8510.a:0 "Eu mesmo vou lutar contra a fera!"
 hunt.8510.b.failure:0 "Você precisa comprar uma substituição"
 hunt.8510.b.success:0 "Seu [activity.Custom('GetRaptorType')] escapa ileso"
 hunt.8510.b:0 "É melhor não interferir."
 hunt.8510.c:0 "Vou comprar um [activity.Custom('GetRaptorType')] melhor de um dos meus parceiros de caça."
 hunt.8510.d:0 "Eu sei exatamente como lidar com os(a) [ROOT.Char.Custom('GetAnimalPlural')]"
 hunt.8510.desc:0 "Logo após desaparecer na natureza, ouço meu [activity.Custom('GetRaptorType')] gritando e uivando em grande aflição. Corro em direção à fonte do som e encontro a pata de minha nobre ave de caça nas garras de [ROOT.Char.Custom('GetAnimalType')] horrenda!\n\nA luta não está indo bem para meu querido [activity.Custom('GetRaptorType')], o sangue manchando a boca do(a) [ROOT.Char.Custom('GetAnimalType')]. Corro o risco de ser atacado por [ROOT.Char.Custom('GetAnimalType')] se eu interferir, mas [activity.Custom('GetRaptorType')] são caros para substituir..."
 hunt.8510.t:0 "Sob Ataque"
 hunt.8520.a.failure:0 "O rastro não leva a lugar algum"
 hunt.8520.a.success:0 "O rastro o leva mais perto"
 hunt.8520.a:0 "Vou virar à esquerda."
 hunt.8520.b.failure:0 "$hunt.8520.a.failure$"
 hunt.8520.b.success:0 "$hunt.8520.a.success$"
 hunt.8520.b:0 "Vou seguir para a direita."
 hunt.8520.desc.intro:0 "Estamos seguindo um conjunto de pegadas do(a) [activity.Custom('GetAnimalType')] através do [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] há um tempo quando percebo que as pegadas parecem se dividir misteriosamente em duas! Começo a seguir as pegadas da esquerda, mas [m_hunt.GetName] me puxa para a direita.\n\n\"Venha agora, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|U], claramente aquelas pegadas são antigas. Devemos seguir as mais frescas.\"\n\n"
 hunt.8520.desc.outro.fallback:0 "Após observação, as pegadas da esquerda parecem um pouco mais desbotadas do que as da direita."
 hunt.8520.desc.outro.obsessed:0 "Será que [m_hunt.GetSheHe] pensa que sou um tolo? Claramente, [m_hunt.GetSheHe] quer me desviar do caminho certo."
 hunt.8520.t:0 "Caminhos Separados"
 hunt.8530.a.failure:0 "Você piora a situação"
 hunt.8530.a.success:0 "Você é libertado"
 hunt.8530.a:0 "Tenho certeza de que se eu apenas pegar o ângulo certo..."
 hunt.8530.b:0 "\"Socorro! Socorro!\""
 hunt.8530.c:0 "Eu preciso me livrar dessa maldita perna!"
 hunt.8530.desc.intro:0 "Lá! No horizonte, eu vejo! [activity.Custom('GetAnimalType')|U] [activity.Custom('GetLegendaryColor')]! Fico frenético, correndo em sua direção antes que ele possa se transformar novamente em névoa em minhas mãos!\n\n#EMP SNAP!#!\n\nEu nem sinto minha perna ficar presa entre as rochas, tudo o que vejo é o mundo afundar diante de mim enquanto caio até os quadris em uma armadilha comum de caçadores! Eu luto, mas nada que faço é suficiente para soltar minha perna."
 hunt.8530.desc.outro.fallback:0 "Pode ser que eu não tenha outra chance de capturar a fera, mas não parece haver uma saída."
 hunt.8530.desc.outro.obsessed:0 "Não posso deixar que essa maldita criatura escape de mim novamente! Talvez eu precise tomar medidas extremas..."
 hunt.8530.t:0 "Enredado"
 hunt.8540.a.failure:0 "Você não é levado a lugar algum"
 hunt.8540.a.success:0 "Você interpreta corretamente os sinais"
 hunt.8540.a:0 "Isso #EMP deve#! ser um sinal para amanhã!"
 hunt.8540.b.failure:0 "Você não encontra nenhum vestígio da fera"
 hunt.8540.b.success:0 "Você avança"
 hunt.8540.b:0 "Não consigo dormir agora, preciso começar cedo!"
 hunt.8540.c:0 "Um presente de [ROOT.Char.GetFaith.CreatorName|U]."
 hunt.8540.d:0 "Isso é lindo, devo mostrar para [intent_target_character.GetFirstNameNoTooltip]!"
 hunt.8540.desc.intro:0 "Estou sonhando novamente com o(a) [activity.Custom('GetAnimalType')] [activity.Custom('GetLegendaryColor')] e como ele me provoca. Ele me encara e, com um estrondo ensurdecedor, sou trazido de volta ao mundo acordado do acampamento de caça, gritando.\n\n"
 hunt.8540.desc.mid.comet:0 "Olhando pela janela, estou maravilhado com um cometa cruzando o céu, talvez me apontando para um local específico na [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]."
 hunt.8540.desc.mid.lights:0 "Olhando pela janela, consigo ver claramente um conjunto de orbes brancos cintilantes, que se estendem até a natureza, talvez me guiando até minha presa."
 hunt.8540.desc.mid.orion:0 "Olhando pela janela, a constelação do caçador brilha mais intensamente do que nunca, como se estivesse me chamando."
 hunt.8540.desc.mid.ursa_major:0 "Olhando pela janela, a constelação do(a) [activity.Custom('GetAnimalType')] brilha claramente no céu noturno, me chamando para a natureza."
 hunt.8540.desc.mid.witch:0 "[ROOT.Char.GetFaith.WitchGodName|U] deve estar se comunicando comigo através dos meus sonhos, dizendo que a criatura está lá fora, e que é minha para matar. Olho pela janela e vejo todas as espécies de animais lá fora, olhando na mesma direção."
 hunt.8540.desc.outro:0 "\n\nNão posso negar que o que estou vendo é real, mas meu corpo está tão cansado."
 hunt.8540.t:0 "[activity.Custom('GetAnimalType')|U] [activity.Custom('GetLegendaryColor')]: um Presságio"
 hunt.8550.a.failure:0 "Você perde qualquer vestígio da fera"
 hunt.8550.a.success:0 "As fezes o levam mais perto"
 hunt.8550.a:0 "Isso #EMP deve#! ser verdade!"
 hunt.8550.b.failure:0 "Você não consegue identificar as fezes"
 hunt.8550.b.success:0 "Você identifica corretamente as fezes"
 hunt.8550.b:0 "Talvez eu deva tentar identificá-las."
 hunt.8550.c:0 "Isso é uma distração, devemos encontrar algo mais."
 hunt.8550.d:0 "Essas são #EMP fezes lendárias#!"
 hunt.8550.desc:0 "Estou fazendo progresso ao rastrear o lendário(a) [activity.Custom('GetAnimalType')|U] [activity.Custom('GetLegendaryColor')|U]. Suas pegadas me levam para fora do caminho comum, antes de desaparecerem completamente. Sinto desespero tomar conta do meu coração, mas de repente avisto algo que tira meu fôlego.\n\nFezes de [activity.Custom('GetLegendaryColor')] puro, como nunca vi antes! Se a própria fera é [activity.Custom('GetLegendaryColor')], certamente é razoável supor que suas fezes tenham uma cor semelhante."
 hunt.8550.t:0 "As Fezes do [activity.Custom('GetLegendaryColor')|U]"
 hunt.8560.a:0 "Podemos usar seus gritos para atrair um verdadeiro(a) [activity.Custom('GetAnimalType')]!"
 hunt.8560.b:0 "Eu cuidarei dele."
 hunt.8560.c:0 "\"Jogue essa coisa de volta onde encontrou!\""
 hunt.8560.desc:0 "Enquanto vagamos pela natureza, em busca do(a) [activity.Custom('GetAnimalType')] mortal, ouço um miado patético e baixo vindo de longe. Sigo a origem do som e encontro um pequeno filhote do(a) [activity.Custom('GetAnimalType')], menor que um gato de rua comum, tremendo e parado completamente exposto.\n\n[hunt_participant.GetName|U] corre até ele e o carrega ronronando em seus braços.\n\n\"Os pais desse pobre ser devem ter morrido ou se perdido. É nosso dever proteger as criações vulneráveis de [hunt_participant.GetFaith.CreatorName], não é?\""
 hunt.8560.t:0 "Gato Grande, Filhote Pequeno"
 hunt.8570.a.crit_failure:0 "Você morre em sua tentativa"
 hunt.8570.a.failure:0 "Você resgata [stampede_victim.GetSheHe] com ferimentos"
 hunt.8570.a.failure_2:0 "Você falhou em resgatar [stampede_victim.GetSheHe]"
 hunt.8570.a.success:0 "Você resgata [stampede_victim.GetSheHe] [Select_CString( stampede_victim.IsFemale, 'ilesa', 'ileso' )]"
 hunt.8570.a:0 "\"Estou indo!\""
 hunt.8570.b.failure:0 "Você falha em redirecionar a estampida"
 hunt.8570.b.success:0 "Você redireciona a estampida"
 hunt.8570.b:0 "Talvez eu possa redirecionar a estampida."
 hunt.8570.c.death:0 "[stampede_victim.GetName] é [Select_CString( stampede_victim.IsFemale, 'pisoteada', 'pisoteado' )]"
 hunt.8570.c.failure:0 "Você falha em abater o único(a) [activity.Custom('GetAnimalType')]"
 hunt.8570.c.success:0 "Você faz alguns bons disparos"
 hunt.8570.c.survives:0 "[stampede_victim.GetName] sobrevive"
 hunt.8570.c:0 "Uma boa oportunidade para eliminar alguns rezagados!"
 hunt.8570.d:0 "[stampede_victim.GetSheHe|U] pode se ajudar."
 hunt.8570.desc:0 "Começou com apenas um tremor, e em breve o mundo inteiro começou a tremer, como se [ROOT.Char.GetFaith.DevilName] [ROOT.Char.GetFaith.DevilHerselfHimself] estivesse tentando rasgar a [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] em pedaços!\n\nEm pouco tempo, um mar de [activity.Custom('GetAnimalPlural')] engoliu toda a clareira, com [stampede_victim.Custom2('MyCharacterIntroduction', ROOT.Char)] preso no meio deles!\n\nAs feras parecem estar evitando [stampede_victim.GetSheHe] por enquanto, mas se eu não agir, [stampede_victim.GetSheHe] certamente morrerá."
 hunt.8570.t:0 "Estampida!"
 hunt.8580.a.failure:0 "Você é dilacerado pelo(a) [activity.Custom('GetAnimalType')]"
 hunt.8580.a.success:0 "[activity.Custom('GetAnimalType')|U] recua"
 hunt.8580.a:0 "Devo tentar ficar imóvel."
 hunt.8580.b.failure:0 "$hunt.8580.a.failure$"
 hunt.8580.b.success:0 "Você acerta o(a) [activity.Custom('GetAnimalType')]"
 hunt.8580.b:0 "Posso atirar nele."
 hunt.8580.c.failure:0 "$hunt.8580.a.failure$"
 hunt.8580.c.success:0 "Você escapa"
 hunt.8580.c:0 "Corra e peça ajuda!"
 hunt.8580.desc:0 "Estou separado do meu grupo de caça por apenas um momento, mas um momento foi o suficiente para [activity.Custom('GetAnimalType')] perdido aparecer no topo de uma grande rocha e parar em seus rastros para me encarar como se eu fosse sua próxima refeição. Sinto minha garganta ficar seca e aperto meu arco na mão.\n\nToda a minha experiência de caça me diz que se deve permanecer imóvel perto do(a) [activity.Custom('GetAnimalType')] se quiser sobreviver, mas, naquele momento, sou apenas escravo dos meus próprios instintos."
 hunt.8580.t:0 "Encarando"
 hunt.8590.a.failure:0 "[activity.Custom('GetAnimalType')|U] não aparece"
 hunt.8590.a.success:0 "[activity.Custom('GetAnimalType')|U] retorna para casa"
 hunt.8590.a:0 "Então, esperaremos!"
 hunt.8590.b.failure:0 "Você não consegue rastrear o(a) [activity.Custom('GetAnimalType')]"
 hunt.8590.b.success:0 "Você faz progresso no rastreamento do(a) [activity.Custom('GetAnimalType')]"
 hunt.8590.b:0 "Podemos rastreá-lo com base nisso."
 hunt.8590.desc:0 "Ao chegarmos ao topo de uma colina, meu grupo de caça encontra uma caverna escura que parece praticamente infinita. Ao redor de sua entrada, estão os sinais inconfundíveis do(a) [activity.Custom('GetAnimalType')]!\n\nSem dúvida, [activity.Custom('GetAnimalType')] ou até mesmo um grupo de [activity.Custom('GetAnimalPlural')] chama esse lugar de lar! Se esperarmos aqui até o anoitecer, certamente encontraremos nossa presa."
 hunt.8590.t:0 "A Toca dos(a) [activity.Custom('GetAnimalPlural')]"
 left_family_for_dead_opinion:0 "Abandonou Membro da Família para Morrer"
 legendary_animal_close_tt:0 "As pegadas o levam mais perto do seu objetivo"
 legendary_animal_no_trace_tt:0 "As pegadas não levam a lugar nenhum"
 legendary_fumes:0 "Fumaça Lendária"
 legendary_fumes_desc:0 "Dizem que essas fezes foram excretadas pelo(a) [activity.Custom('GetAnimalType')] lendário de cor [activity.Custom('GetLegendaryColor')]."
