l_spanish:
 didnt_knock_hat_off_modifier.tt:0 "$didnt_knock_hat_off_modifier$: $VALUE|+0=-+$"
 didnt_knock_hat_off_modifier:0 "Cegado pela Luz"
 didnt_knock_hat_off_modifier_desc:0 "O glamour do alvo será sua ruína!\n[success_chance|E] do [scheme|E] [GetScheme('slander').GetTypeName] #P +20#!"
 feast_events_ewan.0001.a.tt.failure:0 "[intent_target.GetFirstNameNoTooltip] se desvia"
 feast_events_ewan.0001.a.tt.success:0 "Lá vai [intent_target.GetSheHe]!"
 feast_events_ewan.0001.a:0 "Certo, um empurrão firme e..."
 feast_events_ewan.0001.b.tt.failure:0 "[intent_target.GetSheHe|U] tropeça, mas ainda está consciente"
 feast_events_ewan.0001.b.tt.success:0 "Atordoad[Select_CString( intent_target.IsFemale, 'a', 'o' )], [intent_target.GetFirstNameNoTooltip] desmorona sob a água"
 feast_events_ewan.0001.b:0 "Um golpe sólido, um empurrão firme, e..."
 feast_events_ewan.0001.c.tt.failure:0 "A criatura rebate e foge"
 feast_events_ewan.0001.c.tt.success:0 "O(a) [SCOPE.Custom('VenomousCreature')] ataca"
 feast_events_ewan.0001.c:0 "O arremesso tem que ter força suficiente..."
 feast_events_ewan.0001.d.tt.failure:0 "Você erra"
 feast_events_ewan.0001.d.tt.success:0 "Você acerta [intent_target.GetSheHe] na têmpora"
 feast_events_ewan.0001.d:0 "Certo, preciso acertar em cheio na cabeça [intent_target.GetHerHim]..."
 feast_events_ewan.0001.desc.critter:0 "perambula pelos caminhos do pátio. Seguro em minha mão (espero que bem restringido) está um(a) [SCOPE.Custom('VenomousCreature')] venenoso. Feroz e mortal, só preciso lançá-la em um pedaço de pele exposta para que ela faça seu trabalho perverso."
 feast_events_ewan.0001.desc.high_place:0 "olha pela janela desta torre alta e solitária. Claramente admirando uma vista para morrer — um empurrão bom e firme e todos os meus problemas estão resolvidos. Até parecerá um acidente."
 feast_events_ewan.0001.desc.intro:0 "É raro encontrar alguém que possa passar um banquete inteiro sem precisar de um pouco de tempo fora, longe do burburinho, mesmo que seja apenas para se aliviar.\n\nFelizmente para mim, [intent_target.GetTitledFirstName] não é exceção. De uma alcova próxima, observo enquanto [intent_target.GetSheHe]"
 feast_events_ewan.0001.desc.outro:0 "\n\nEu tenho o elemento surpresa, então se o plano der errado, escapar a tempo não deverá ser um problema. Infelizmente, provavelmente não será preciso muita investigação para [Select_CString( intent_target.IsFemale, 'a', 'o' )] [intent_target.GetFirstNameNoTooltip] notar minha ausência suspeita."
 feast_events_ewan.0001.desc.rock:0 "passeia pelas decorações do pátio. A pedra em minha mão tem um peso considerável, além de uma ponta afiada e maléfica — um bom e certeiro golpe na cabeça deverá ser suficiente para realizar o ato sombrio."
 feast_events_ewan.0001.desc.water:0 "passeia ao longo da margem do [activity.GetHost.Custom('IndefiniteBodyOfWater')] perto das muralhas. Com meu cacete de mão, só preciso acertar [intent_target.GetSheHe] com força suficiente para deixá-lo(a) atordoado(a) — a água se encarregará do resto, e até parecerá um acidente."
 feast_events_ewan.0001.e.tt.bonus_to_murder_scheme.overwrite:0 "Isso vai sobrescrever o seu potencial bônus para [GetScheme('murder').GetTypeName] de [ROOT.Char.Var('feast_events_ewan_0001_bonus_value').GetTitledFirstName]"
 feast_events_ewan.0001.e.tt.bonus_to_murder_scheme:0 "Você receberá um aumento de #P [EmptyScope.ScriptValue('feast_events_ewan_0001_murder_scheme_bonus_added_base_success_value')|=+0]%#! na chance de sucesso para qualquer [scheme|E] de [GetScheme('murder').GetTypeName] que iniciar contra [Select_CString( intent_target.IsFemale, 'a', 'o' )] [intent_target.GetTitledFirstName] nos próximos [EmptyScope.ScriptValue('feast_events_ewan_0001_murder_scheme_bonus_time_to_use_value')|0] anos"
 feast_events_ewan.0001.e:0 "Talvez seja melhor observar?"
 feast_events_ewan.0001.f:0 "Isso foi uma ideia tola."
 feast_events_ewan.0001.t:0 "Limpe Sua Mente"
 feast_events_ewan.0201.a.tt.failure:0 "O que #EMP você está#! fazendo?"
 feast_events_ewan.0201.a.tt.success:0 "Bem, [ROOT.Char.GetFirstNameNoTooltip]..."
 feast_events_ewan.0201.a:0 "Talvez apenas mais uma mordida, para deixar a mensagem clara."
 feast_events_ewan.0201.b.tt.failure:0 "Por [intent_target.GetFaith.KnowledgeGodName], você é entediante!"
 feast_events_ewan.0201.b.tt.success:0 "Sua conversa se mostra mais interessante"
 feast_events_ewan.0201.b:0 "Isso não está funcionando. Talvez [intent_target.GetSheHe] prefira uma conversa honesta?"
 feast_events_ewan.0201.c:0 "Isso está menos... ardente do que eu esperava..."
 feast_events_ewan.0201.desc.intro:0 "Sentar em frente [Select_CString( intent_target.IsFemale, 'a', 'ao' )] [intent_target.Custom2('MyCharacterIntroduction', ROOT.Char)] me proporciona um verdadeiro tesouro de maneiras de provocá-lo(a) sem quebrar as regras de etiqueta.\n\n"
 feast_events_ewan.0201.desc.meat.dramatic_snap:0 "\"... é claro, tudo se resume a ser\", eu quebro habilmente o pequeno osso de [activity.GetHost.Custom('RegionalEdibleAnimal')] que estou segurando em dois pedaços, \"#EMP firmes#!. Concorda?"
 feast_events_ewan.0201.desc.meat.lick:0 "Com um lampejo vigoroso, porém langoroso, recolho uma generosa porção do molho que cobre minha porção de [activity.GetHost.Custom('RegionalEdibleAnimal')]. Mantemos contato visual durante todo o tempo."
 feast_events_ewan.0201.desc.meat.sink_teeth:0 "Lentamente, de propósito, deixo meus dentes afundarem na carne de um #EMP delicioso#! pedaço de [activity.GetHost.Custom('RegionalEdibleMeat')], arrancando a carne com gentileza, mas firmeza."
 feast_events_ewan.0201.desc.outro:0 "\n\nPelo olhar no rosto [intent_target.GetHerHim], percebo que [Select_CString( intent_target.IsFemale, 'a', 'o' )] [intent_target.GetFirstNameNoTooltip] entendeu minha mensagem. O que não consigo discernir com clareza é a expressão [intent_target.GetHerHim] — é interesse lascivo ou um estômago revirado? É alarmantemente difícil dizer."
 feast_events_ewan.0201.desc.veggie.deep_bite:0 "Com estilo dramático, minha mão erguida deixa cair um pequeno pedaço de [activity.GetHost.Custom('RegionalRootVegetable')] na minha boca, e eu engulo com #EMP audível#! satisfação. Meus olhos até rolam um pouco para trás, para adicionar um toque picante."
 feast_events_ewan.0201.desc.veggie.sink_teeth:0 "Com entusiasmo, mordo com firmeza em um enorme e suculento #EMP firme#! [activity.GetHost.Custom('RegionalRootVegetable')], deixando um pouco de líquido escorrer e pingar em meu queixo. Satisfeito, minha língua sai e lambe meus lábios, os deixando limpos."
 feast_events_ewan.0201.desc.veggie.suggestive_gesture:0 "Lentamente, provocativamente, deslizo meu dedo ao redor da curva de um par de [activity.GetHost.Custom('RegionalRootVegetablePlural')], provocando suavemente os legumes com meu toque macio. Na ponta deles, arrasto a mais leve sugestão de unha pela superfície, deixando um arranhão quase imperceptível."
 feast_events_ewan.0201.t:0 "Jantar e um Espetáculo"
 feast_events_ewan.0401.a.tt.failure:0 "Você é divertido, mas não tanto assim"
 feast_events_ewan.0401.a.tt.partial_success:0 "[intent_target.GetSheHe|U] gostaria de conversar mais"
 feast_events_ewan.0401.a.tt.success:0 "Você encanta [intent_target.GetSheHe] completamente"
 feast_events_ewan.0401.a:0 "Sim, infelizmente foi apenas uma escolha ruim, acho."
 feast_events_ewan.0401.b:0 "\"Você... #EMP percebe#! que este é o meu banquete, certo?\""
 feast_events_ewan.0401.c:0 "\"Cante em alto e bom som os elogios da refeição.\""
 feast_events_ewan.0401.d:0 "Mude de assunto para algo menos controverso."
 feast_events_ewan.0401.desc.intro:0 "Levou boa parte da noite para me aproximar [Select_CString( intent_target.IsFemale, 'da', 'do' )] [intent_target.GetTitledFirstName] sem parecer forçado. Afinal, as melhores amizades são naturais, e eu quero que [intent_target.GetSheHe] pense que isso é espontâneo.\n\n"
 feast_events_ewan.0401.desc.target_personality.fallback:0 "[Select_CString( intent_target.IsFemale, 'A', 'O' )] [intent_target.GetWomanMan] limpa gentilmente os cantos da boca com um pedaço de pano de mesa sujo, afastando as migalhas de massa folhada.\n\n\"Espero que o próximo prato seja um pouco mais leve\", [intent_target.GetSheHe] opina, \"o objetivo de um banquete é proporcionar uma experiência culinária rica e variada, e até agora isso tem parecido mais uma tentativa de nos empanturrar do que nos excitar.\""
 feast_events_ewan.0401.desc.target_personality.flamboyant:0 "\"Por [intent_target.GetFaith.WealthGodName]\", exalta meu possível amigo, mal disfarçando um arroto, \"isso foi um prato #EMP pesado#!. E tão logo após o último prato pesado! Simplesmente fica muito pesado no estômago. Não posso acreditar que os serviçais esperam manter servindo sua [activity.GetHost.Custom('MistressMaster')], trabalhando tão mal.\""
 feast_events_ewan.0401.desc.target_personality.sedate:0 "[Select_CString( intent_target.IsFemale, 'A', 'O' )] [intent_target.GetWomanMan] mexe na comida, empurrando alguns pequenos pedaços em um prato de madeira gorduroso.\n\n\"É tudo um pouco... pesado, não é? Esse prato, o prato anterior, o prato antes #EMP desse#!, e\", [intent_target.GetSheHe] olha nervosamente para um serviçal trazendo a próxima rodada de pratos, \"o próximo também. Tanta comida rica, tudo seguido, quando o que realmente precisamos é de algo inovador para limpar o paladar.\""
 feast_events_ewan.0401.t:0 "Rugido no Estômago"
 feast_events_ewan.0601.a.tt.failure:0 "Você não tem a habilidade para ser furtivo"
 feast_events_ewan.0601.a.tt.success:0 "Você entra e sai como um sussurro de demônio"
 feast_events_ewan.0601.a:0 "Suje as bebidas."
 feast_events_ewan.0601.b.tt.failure:0 "$feast_events_ewan.0601.a.tt.failure$"
 feast_events_ewan.0601.b.tt.success:0 "$feast_events_ewan.0601.a.tt.success$"
 feast_events_ewan.0601.b:0 "Estrague o prato sofisticado."
 feast_events_ewan.0601.c.tt.failure:0 "$feast_events_ewan.0601.a.tt.failure$"
 feast_events_ewan.0601.c.tt.success:0 "$feast_events_ewan.0601.a.tt.success$"
 feast_events_ewan.0601.c:0 "Arruine o acompanhamento."
 feast_events_ewan.0601.d:0 "Isso está abaixo de mim."
 feast_events_ewan.0601.desc.dead_rat:0 "um rato morto especialmente fedorento, prestes a explodir."
 feast_events_ewan.0601.desc.dodgy_mushroom:0 "um cogumelo no qual estou extremamente confiante de que fará qualquer um correr para o banheiro. Provavelmente pelo resto da noite."
 feast_events_ewan.0601.desc.hank_of_hair:0 "um pequeno tufo de pelo de um dos animais do pátio. Não é pelo da cabeça."
 feast_events_ewan.0601.desc.humongous_beetle:0 "um besouro gigantesco, atualmente exausto. Deve estar ativo e se contorcendo depois de ter um bom descanso, no entanto."
 feast_events_ewan.0601.desc.intro:0 "A cozinha é, eu diria, sempre o melhor lugar para fazer um pouco de #EMP maldade#!. Pelo menos, desde que os funcionários não te peguem.\n\nTantas possíveis vítimas, tão pouco tempo: eu interferiria na bandeja de [activity.GetHost.Custom('GetExpensiveDrink')], na elaborada entrada central ou na pequena mesa de pratos entre os cursos?\n\nSeja qual for a minha escolha, tenho exatamente o item preparado para arruinar a noite de alguém —"
 feast_events_ewan.0601.desc.raw_eyeball:0 "um único, enorme, olho cru."
 feast_events_ewan.0601.desc.rotten_vegetable:0 "um [activity.GetHost.Custom('RegionalRootVegetable')] fedorento, tão mofado que estou francamente chocado por ter conseguido escondê-lo."
 feast_events_ewan.0601.desc.used_sponge:0 "uma esponja que foi muito... distintamente #EMP usada#!."
 feast_events_ewan.0601.t:0 "Uma Brincadeira Inocente"
 feast_events_ewan.0801.a:0 "É aqui que eu quero estar."
 feast_events_ewan.0801.b:0 "Boas pessoas para se socializar, aqui."
 feast_events_ewan.0801.c:0 "Uma chance de ser visto com os grandes e os bons!"
 feast_events_ewan.0801.desc.ambitious:0 "Tanta oportunidade para conversar, conhecer, discutir, planejar. Cada nova conversa é a semente de uma nova meta, cada prato uma desculpa para adicionar outro contato."
 feast_events_ewan.0801.desc.arbitrary:0 "\n\nÉ claro, nem tudo está exatamente como eu gostaria, mas essa é a natureza desses encontros. Da próxima vez as coisas serão diferentes, e o tempero da mudança dá algo a esperar."
 feast_events_ewan.0801.desc.arrogant:0 "\n\nFaz bem para mim misturar-me com alguns dos meus inferiores assim, meus [ROOT.Char.Custom('FootFeet')] apoiados em um banco, espalhando minha bondade entre as massas de nobres mesquinhos."
 feast_events_ewan.0801.desc.brave:0 "Somos um grupo heterogêneo, é verdade, mas aqui e agora sinto que essa festa poderia enfrentar o mundo e vencer."
 feast_events_ewan.0801.desc.callous:0 "\n\nNão que eu me importasse #EMP excessivamente#! se o resto deles estivesse se divertindo pouco, mas ainda consigo apreciar uma atmosfera agradável. Com moderação."
 feast_events_ewan.0801.desc.calm:0 "\n\nAlgumas pessoas pensam que um banquete é um lugar agitado, mas para mim, eles são um refúgio de calma e acordo social. Todos ficam mais relaxados com o estômago cheio e uma taça cheia, afinal."
 feast_events_ewan.0801.desc.chaste:0 "É bom ver tanta gente se divertindo sem recorrer aos prazeres da carne."
 feast_events_ewan.0801.desc.compassionate:0 "É encantador ver a generosidade humana sendo compartilhada tão livremente."
 feast_events_ewan.0801.desc.content:0 "Não consigo pensar em absolutamente nada que eu mudaria. Está tudo simplesmente... perfeito."
 feast_events_ewan.0801.desc.craven:0 "Há algo reconfortante em estar cercado por tanta gente, como se nada pudesse dar errado.\n\nProvavelmente."
 feast_events_ewan.0801.desc.cynical:0 "É claro, a maioria deles está aqui apenas para comer e beber à custa de outra pessoa, mas quem sou eu para julgar? Mal posso culpá-los por essa escolha, e a comida é #EMP deliciosa#!."
 feast_events_ewan.0801.desc.deceitful:0 "\n\nJá iniciei alguns rumores entre a multidão, apenas por diversão. Acho bastante divertido ver como uma mentira pode se espalhar rapidamente, mesmo sem qualquer motivo além de causar um pouco de caos."
 feast_events_ewan.0801.desc.diligent:0 "Coordenar tanta gente e criados é uma tarefa subvalorizada, com uma dificuldade sutil, e é prazeroso ver tudo ser feito com competência."
 feast_events_ewan.0801.desc.fickle:0 "Acho que minha coisa favorita sobre banquetes #EMP é#! a comida. Não, as pessoas. Na verdade, talvez as bebidas? Ou o entretenimento, ou..."
 feast_events_ewan.0801.desc.forgiving:0 "\n\nEstou um pouco preocupado que os serviçais tenham esquecido meu copo na última rodada, mas sempre há o próximo prato. Na verdade, essa é uma das coisas encantadoras de um banquete — há #EMP sempre#! um próximo prato."
 feast_events_ewan.0801.desc.generous:0 "\n\nHá algo tão simplesmente agradável no ato de alimentar os outros, de todos partilharem o pão e as taças na mesma sala."
 feast_events_ewan.0801.desc.gluttonous:0 "E a comida! Ah, a comida... por [ROOT.Char.GetFaith.HealthGodName], eu #EMP amo#! uma boa refeição farta. Ou cinco."
 feast_events_ewan.0801.desc.greedy:0 "\n\nNum banquete, todos estão um pouco gananciosos por algo — francamente, é relaxante ver o mundo ser tão #EMP honesto#! por uma mudança."
 feast_events_ewan.0801.desc.gregarious:0 "\n\nÉ uma pena que não tenhamos mais convidados, apenas mais uma mesa cheia ou algo assim, mas nem todos têm o espírito festivo. Nem todos, talvez, mas #EMP eu#! tenho, e sou tão bom quanto uma ou duas mesas sozinho!"
 feast_events_ewan.0801.desc.honest:0 "Há poucas expressões mais verdadeiras da experiência mortal do que esta. Tão desprotegida, tão honesta — apenas pessoas desfrutando da companhia de outras pessoas."
 feast_events_ewan.0801.desc.humble:0 "Tanta gente, vinda de todos os cantos do reino, só para estar aqui. Isso realmente dá uma perspectiva de quão vasto é o mundo."
 feast_events_ewan.0801.desc.impatient:0 "\n\nUm banquete sólido é um dos poucos ambientes onde raramente você precisa esperar por algo. Quer comida? Está ali. Precisa de uma bebida? Eles vão servir. Quer bater um papo? Boa companhia está por toda parte. Uma delícia."
 feast_events_ewan.0801.desc.intro:0 "Ahhh, há algo mais alegre do que um bom banquete?\n\nOs convidados circulam para lá e para cá, comendo e conversando enquanto a luz tremeluzente das tochas reflete em todas as paredes, a luz ressoando como risadas por todo o salão."
 feast_events_ewan.0801.desc.just:0 "\n\nSempre achei a ordem natural de um banquete encantadora de se contemplar. Mesas arrumadas com cuidado, hierarquias sociais silenciosamente impostas, todos felizes e rindo e em seu devido lugar. Exatamente onde deveriam estar."
 feast_events_ewan.0801.desc.lazy:0 "E eu? Não preciso mexer um músculo. As pessoas, a comida, a bebida, as almofadas, os criados, todos vêm até mim sem que eu precise mover um dedo. #EMP Perfeição#!."
 feast_events_ewan.0801.desc.lustful:0 "Tantas deliciosas... #EMP iguarias#! para [ROOT.Char.Custom('SenseObserve_EyeTaste')], tantas oportunidades para olhares furtivos, até mesmo um encontro ilícito.\n\nTalvez dois."
 feast_events_ewan.0801.desc.outro:0 "\n\nÀs vezes é bom simplesmente sentar e desfrutar das pequenas coisas da vida."
 feast_events_ewan.0801.desc.paranoid:0 "\n\nEstou constantemente alerta para qualquer sinal de perigo, intencional ou acidental, planejado ou improvisado. Há exatamente o suficiente para atender às minhas expectativas — não tanto a ponto de uma conspiração ser óbvia, nem tão pouco a ponto de uma conspiração ser claramente disfarçada. Do jeito que gosto."
 feast_events_ewan.0801.desc.patient:0 "\n\nAté aprecio as esperas entre os pratos — não são apenas oportunidades para rir e conversar, mas também para refletir sobre o prato que foi comido e o pensamento que foi colocado nele."
 feast_events_ewan.0801.desc.sadistic:0 "Eu aprecio gritos e soluços tanto quanto qualquer [ROOT.Char.GetTitleAsNameNoTooltip] bem-ajustad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], mas risos alegres certamente podem proporcionar uma mudança agradável de ritmo."
 feast_events_ewan.0801.desc.shy:0 "Estou confortavelmente acomodado em um assento no canto, conversando com algumas pessoas interessantes.\n\nÉ bom ter a chance de ser social sem ser sobrecarregado, pelo menos uma vez."
 feast_events_ewan.0801.desc.stubborn:0 "Eu até considerei levantar-me para passear como tantos outros, mas isso significaria abrir mão do meu assento, e não me renderei de jeito nenhum."
 feast_events_ewan.0801.desc.temperate:0 "\n\nÉ claro, não sou muito fã dos pratos elaborados, mas posso aproveitar a boa companhia e o bom humor enquanto belisco meu pedaço de pão."
 feast_events_ewan.0801.desc.trusting:0 "\n\nÉ claro, com todos em tão bom humor e tanta comida deliciosa para experimentar, quem poderia trazer más intenções para um evento tão alegre? Não, esta é uma ocasião jubilosa, e estou jubiloso com ela."
 feast_events_ewan.0801.desc.vengeful:0 "\n\nNaturalmente, uma boa parte disso é direcionada ao garçom que acabei de derrubar, agora coberto de aperitivos viscosos. Serve o desgraçado certo por ter esquecido de encher minha bebida na última rodada."
 feast_events_ewan.0801.desc.wrathful:0 "Eu #EMP posso#! ser... algo propenso à cólera, às vezes. Mas aqui, agora, estou calmo, talvez até sereno.\n\nA mudança de ritmo é agradável."
 feast_events_ewan.0801.desc.zealous:0 "\n\nMurmuro rapidamente uma devoção a [ROOT.Char.GetFaith.HealthGodName], agradecendo pelo próximo prato maravilhoso que está a caminho. Verdadeiramente, esta Criação de [ROOT.Char.GetFaith.CreatorName] está cheia de maravilhas, e a boa comida certamente não é o menor milagre oferecido."
 feast_events_ewan.0801.t:0 "Uma Atmosfera Agradável"
 feast_learnt_habits_modifier.tt:0 "$feast_learnt_habits_modifier$: $VALUE|+0=-+$"
 feast_learnt_habits_modifier:0 "Hábitos Observados"
 feast_learnt_habits_modifier_desc:0 "Os hábitos pessoais do alvo quando está sozinho são conhecidos pelos conspiradores."
 feasts_mischievous_t1_modifier:0 "Sorriso Travesso"
 feasts_mischievous_t1_modifier_desc:0 "Esse personagem parece estranhamente calmo quando aqueles ao seu redor têm acidentes inesperados e embaraçosos."
 feasts_mischievous_t2_modifier:0 "Criador de Confusão"
 feasts_mischievous_t2_modifier_desc:0 "Pequenos acidentes e descobertas embaraçosas ocorrem regularmente perto desse personagem."
 feasts_mischievous_t3_modifier:0 "Arruaceiro"
 feasts_mischievous_t3_modifier_desc:0 "Não pode ser comprovado, mas é um segredo aberto que esse personagem está constantemente planejando sua próxima \"brincadeira\"."
