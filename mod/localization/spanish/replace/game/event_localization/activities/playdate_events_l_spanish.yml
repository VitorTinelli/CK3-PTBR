 playdate.0010.a:0 "Oops."
 playdate.0010.desc:0 "Por que você aceitou meu convite apenas para ir ao encontro dos colegas [Select_CString( other_host.IsFemale, 'da', 'do' )] [other_host.GetTitledFirstName]? Eu vou me lembrar disso."
 playdate.0020.a.tt:0 "#F Sabe... até [host.GetSheHe] desaparecer.#!"
 playdate.0020.a:0 "Mas nós nos divertimos tanto!"
 playdate.0020.desc:0 "Dizem que [host.Custom2('MyCharacterIntroduction', ROOT.Char)] partiu, mas ninguém parece conseguir me dizer o que isso realmente significa. O que sei é que o encontro de colegas [host.GetHerHim] chegou ao fim."
 playdate.0020.t:0 "$playdate_header$ Fim dos Jogos"
 playdate.0021.a:0 "Toda a diversão que poderíamos ter tido..."
 playdate.0021.desc:0 "Agora que estou preso atrás das grades, meu encontro de colegas será cancelado. Ah, todas aquelas horas que passei ansioso por isso... Desperdiçadas!"
 playdate.0022.desc:0 "[host.Custom2('MyCharacterIntroduction', ROOT.Char)|U] foi preso, e o encontro de colegas [host.GetHerHim] chegou ao fim. Que azar!"
 playdate.1001.a:0 "Claro, estarei lá."
 playdate.1001.b:0 "Não, recuso!"
 playdate.1001.host_dislikes_me:0 "Estou convidando todos que são notáveis, o que inclui você, infelizmente."
 playdate.1001.host_gets_along_with_me:0 "Espero que você participe, pois sentiria muito a sua falta se você não fosse!"
 playdate.1001.host_likes_me:0 "Espero que você participe, pois tenho esperado por uma oportunidade de te ver!"
 playdate.1001.opening_desc:0 "Por favor, venha encontrar seus colegas na minha corte em [barony.GetNameNoTier]!"
 playdate.1002.a:0 "Claro que [child_scope.GetSheHe] estará lá."
 playdate.1002.b:0 "Devo declinar."
 playdate.1002.host_dislikes_child:0 "Estou convidando todos que são notáveis, o que inclui [child_scope.GetSheHe]."
 playdate.1002.host_gets_along_with_child:0 "Espero que [child_scope.GetSheHe] participe, pois sentiria muito a falta [child_scope.GetHerHim] se [child_scope.GetSheHe] não fosse!"
 playdate.1002.host_likes_child:0 "Espero que [child_scope.GetSheHe] participe, pois tenho esperado por uma oportunidade de ver [child_scope.GetSheHe]!"
 playdate.1002.opening_desc:0 "Eu ficaria encantado se [child_scope.Custom2('YourCharacterIntroduction', ROOT.Char)] pudesse visitar minha casa em [barony.GetNameNoTier] para conhecer seus colegas!"
 playdate.2001.a.tt:0 "O encontro dos colegas começa"
 playdate.2001.a:0 "Bem-vindo!"
 playdate.2001.desc:0 "Estou animado em passar um tempo com outras crianças!"
 playdate.2001.desc_guest_of_interest_1:0 "Estou animado que [guest_of_interest_1.Custom2('MyCharacterIntroduction', ROOT.Char)] tenha vindo!"
 playdate.2001.desc_guest_of_interest_1_2_3:0 "Estou animado que [guest_of_interest_1.Custom2('MyCharacterIntroduction', ROOT.Char)] e [guest_of_interest_2.Custom2('MyCharacterIntroduction', ROOT.Char)] tenham vindo. Sem mencionar [guest_of_interest_3.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 playdate.2001.desc_guest_of_interest_1_and_2:0 "Estou animado que tanto [guest_of_interest_1.Custom2('MyCharacterIntroduction', ROOT.Char)] quanto [guest_of_interest_2.Custom2('MyCharacterIntroduction', ROOT.Char)] tenham vindo!"
 playdate.2001.desc_guest_of_interest_4:0 "No entanto, estou menos animado que [guest_of_interest_4.Custom2('MyCharacterIntroduction', ROOT.Char)] parece ter aparecido também. Bem, [guest_of_interest_4.GetSheHe] não importa."
 playdate.2001.desc_opening:0 "Todos estão aqui!\n\nÀ medida que todos os pequenos senhores e damas são conduzidos para a sala, sinto-me cada vez mais animado."
 playdate.2001.t:0 "Reunião"
 playdate.2003.a:0 "Por que ninguém apareceu?"
 playdate.2003.desc:0 "Não posso acreditar! Apesar dos meus convites e preparativos, ninguém apareceu no meu encontro de colegas.\n\nBem, eu não me importo. Vou aproveitar esses doces sozinho. E esses brinquedos. E... E... Por que ninguém apareceu?"
 playdate.2003.t:0 "$playdate_header$ Uma Celebração Pobre"
 playdate.2501.a:0 "Estou ansioso por isso!"
 playdate.2501.a_dislike:0 "Vamos acabar logo com isso."
 playdate.2501.dislikes_host:0 "Todos estão reunidos no salão enquanto [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNameNoTooltip] [host.Custom2('InsultAdjective', ROOT.Char)] nos dá as boas-vindas ao encontro de colegas."
 playdate.2501.likes_host:0 "Todos estão reunidos no salão enquanto [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNameNoTooltip] nos dá as boas-vindas ao encontro de colegas!"
 playdate.2501.t:0 "Uma Recepção Calorosa"
 playdate.3001.a:0 "Eu vou salvar [guest.GetSheHe]!"
 playdate.3001.a_injured:0 "Você está machucado"
 playdate.3001.b:0 "\"Alguém, por favor, ajude!\""
 playdate.3001.c:0 "Isso parece divertido, deixe-me participar!"
 playdate.3001.desc:0 "Eu pensei que [guest.Custom2('MyCharacterIntroduction', ROOT.Char)] e [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.Custom('RandomGirlBoy')] [Select_CString( ROOT.Char.IsFemale, 'camponesa', 'camponês' )] estavam apenas fingindo brigar, mas de repente há sangue na terra.\n\n[guest.GetFirstNameNoTooltip] cai no chão com um gemido, e o camponês que está acima [guest.GetHerHim] se prepara para atacar novamente."
 playdate.3001.t:0 "Jogando Pesado"
 playdate.3002.a:0 "Claro. Não me importo com segredos bobos."
 playdate.3002.b:0 "Shhh, eu quero saber o segredo!"
 playdate.3002.desc:0 "[secret_holder.Custom2('MyCharacterIntroduction', ROOT.Char)|U] está claramente escondendo algo.\n\nMas, assim que [secret_holder.GetSheHe] concorda em me contar o que é, [close_participant.Custom2('MyCharacterIntroduction', ROOT.Char)] se aproxima de nós e insiste que eu me junte a [close_participant.GetSheHe] para um jogo de xadrez."
 playdate.3002.t:0 "Segredos"
 playdate.3003.a_cat:0 "Seu gato é tão fofo!"
 playdate.3003.a_dog:0 "Seu cachorro é tão fofo!"
 playdate.3003.b:0 "Oh, obrigado! Venha aqui, [guest.Custom('DogStoryName')]!"
 playdate.3003.c:0 "Eca, que pulguento. Nada parecido com o meu gato!"
 playdate.3003.desc_bonding_cat:0 "[guest.Custom2('MyCharacterIntroduction', ROOT.Char)|U] estende um gato [guest.Custom('CatFurColor')] para mim. \"O nome dele é [guest.Custom('CatStoryName')]!\""
 playdate.3003.desc_bonding_cat_opening:0 "\"Que gato fofo você tem! Você quer ver o meu?\""
 playdate.3003.desc_bonding_dog:0 "[guest.Custom2('MyCharacterIntroduction', ROOT.Char)|U] apresenta um cachorro [guest.Custom('DogFurColor')] para mim. \"O nome dele é [guest.Custom('DogStoryName')]!\""
 playdate.3003.desc_bonding_dog_opening:0 "\"Que gato fofo você tem! Você quer ver o meu cachorro?\""
 playdate.3003.desc_opening:0 "Eu trago meu gato [ROOT.Char.Custom('CatStoryName')] comigo para que todos possam ver o quão incrível é o meu gatinho.\n\n"
 playdate.3003.t:0 "[ROOT.Char.Custom('CatStoryName')]"
 playdate.3004.b:0 "Oh, obrigado! Venha aqui, [guest.Custom('CatStoryName')]!"
 playdate.3004.c:0 "Eca, que pulguento. Nada parecido com o meu cachorro!"
 playdate.3004.desc_bonding_cat_opening:0 "\"Que cachorro fofo você tem! Você quer ver o meu gato?\""
 playdate.3004.desc_bonding_dog_opening:0 "\"Que cachorro fofo você tem! Você quer ver o meu?\""
 playdate.3004.desc_opening:0 "Eu trago meu cachorro [ROOT.Char.Custom('DogStoryName')] comigo para que todos possam ver o quão incrível é o meu filhote.\n\n"
 playdate.3004.t:0 "[ROOT.Char.Custom('DogStoryName')]"
 playdate.3005.a:0 "Ah... Oops."
 playdate.3005.b:0 "Por favor, esqueça o que eu disse! Eu faço qualquer coisa!"
 playdate.3005.c:0 "Eu te pago! Apenas fique quieto!"
 playdate.3005.d.failure:0 "[guest.GetFirstNameNoTooltip] não está com medo de você"
 playdate.3005.d.success:0 "[guest.GetFirstNameNoTooltip] promete manter a boca fechada"
 playdate.3005.d:0 "Se você contar para alguém, eu... eu vou te machucar!"
 playdate.3005.desc:0 "Estou conversando com [guest.Custom2('MyCharacterIntroduction', ROOT.Char)] sobre a vida na corte e os rumores recentes.\n\n\"E ouvi dizer que [Select_CString( secret_owner.IsFemale, 'a', 'o' )] [secret_owner.GetTitledFirstName] [secret.Custom('SecretDescriptionThirdPerson')]–\"\n\nEu me dou conta tarde demais; [guest.GetFirstNameNoTooltip] ouviu tudo."
 playdate.3005.t:0 "O Segredo "
 playdate.3006.a:0 "Isso será uma boa discussão!"
 playdate.3006.b:0 "Vá embora, estou lendo."
 playdate.3006.desc:0 "Eu trouxe um pequeno livro comigo – como costumo fazer – e [fellow_nerd.Custom2('MyCharacterIntroduction', ROOT.Char)] me encontra quando estou me preparando para ler algumas páginas.\n\n\"Oh, é o #EMP [SCOPE.Custom('RandomInformativeTextName')|U]#!? Eu li recentemente, qual é a sua opinião sobre a prosa?\""
 playdate.3006.t:0 "Companheiro de Leitura"
 playdate.3007.a.failure:0 "Você sofre uma queda feia"
 playdate.3007.a.success:0 "Você consegue escalar"
 playdate.3007.a:0 "Eu não vou recuar!"
 playdate.3007.b:0 "Não, acho que vou ficar aqui embaixo."
 playdate.3007.desc:0 "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] escalou o [ROOT.Char.Custom('ObjectToClimb')] mais alto por perto e está gesticulando entusiasmadamente para que eu o siga.\n\nNão seria a primeira vez que eu escalo um [ROOT.Char.Custom('ObjectToClimb')], mas parece uma subida longa..."
 playdate.3007.t:0 "Escalando"
 playdate.3008.a.critical_failure:0 "Você quase se afoga"
 playdate.3008.a.failure:0 "Você não chega a tempo"
 playdate.3008.a.success:0 "Você salva [participant.GetFirstNameNoTooltip]"
 playdate.3008.a:0 "Aguente firme, estou indo!"
 playdate.3008.b.failure:0 "Ninguém vem para o resgate"
 playdate.3008.b.success:0 "Alguém ouve e ajuda"
 playdate.3008.b:0 "Por favor, alguém, ajude!"
 playdate.3008.c:0 "[participant.GetSheHe|U] deve ter voltado para casa..."
 playdate.3008.desc:0 "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vai direto para [ROOT.Char.Custom('IndefiniteBodyOfWater')] e se joga sem hesitar.\n\nO que começou como espirros brincalhões logo se transformou em algo mais frenético, e de repente [participant.GetSheHe] desaparece sob a superfície. À medida que o momento se prolonga, percebo que [participant.GetSheHe] não vai ressurgir, pelo menos não sem ajuda."
 playdate.3008.t:0 "Indo para um Mergulho"
 playdate.3009.a.failure:0 "Você leva uma bola de neve encharcada de gelo na cabeça"
 playdate.3009.a.success:0 "Você vence a guerra de neve"
 playdate.3009.a:0 "Não vou recuar!"
 playdate.3009.b:0 "Por favor, poupe-me!"
 playdate.3009.c.failure:0 "[participant.GetSheHe|U] percebe que você está mentindo"
 playdate.3009.c.success:0 "[participant.GetFirstNameNoTooltip] acredita em você"
 playdate.3009.c:0 "Foi [to_blame.GetFirstNameNoTooltip], não fui eu!"
 playdate.3009.desc:0 "\n\n[participant.GetSheHe|U] dá um grito, mas logo contra-ataca; em pouco tempo estou em retirada e [participant.GetSheHe] está vindo em minha direção com um enorme bola de neve na mão!"
 playdate.3009.desc_opening:0 "Me aproximo sorrateiramente por trás de [participant.Custom2('MyCharacterIntroduction', ROOT.Char)] com as mãos cheias de neve, e no momento em que [participant.GetSheHe] está prestes a se virar, eu ataco!"
 playdate.3009.desc_two:0 "Me aproximo sorrateiramente por trás de [participant.Custom2('MyCharacterIntroduction', ROOT.Char)] e [to_blame.Custom2('MyCharacterIntroduction', ROOT.Char)] com as mãos cheias de neve, e no momento em que [participant.GetFirstNameNoTooltip] está prestes a se virar, eu ataco!"
 playdate.3009.t:0 "Dia de Neve"
 playdate.3010.a.failure:0 "O comerciante te expulsa"
 playdate.3010.a.success:0 "Você convence o comerciante a fazer uma troca"
 playdate.3010.a:0 "Ehum, gostaria de comprar uma mercadoria, por favor."
 playdate.3010.b:0 "Você tem que me dar o que eu quero! Sou [Select_CString( ROOT.Char.IsFemale, 'uma', 'um' )] #EMP [ROOT.Char.GetLadyLord]#!"
 playdate.3010.c.tt:0 "Alguns comerciantes brincam e \"compram\" suas pedrinhas com folhas"
 playdate.3010.c:0 "Vamos montar nossa própria barraca!"
 playdate.3010.desc:0 "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] e eu concordamos que o comércio é uma habilidade importante para um nobre aprender, então decidimos visitar o mercado local em [ROOT.Char.GetCurrentLocation.GetName].\n\nSó temos algumas pedrinhas como moeda, mas elas são #EMP muito#! brilhantes!"
 playdate.3010.t:0 "Dia de Mercado"
 playdate.3011.a:0 "Só se nós formos os pais!"
 playdate.3011.b:0 "Claro. E [disliked_participant.GetFirstNameNoTooltip] é o cachorro!"
 playdate.3011.c.tt:0 "Você aprofunda seus estudos na arte de [THIS.Char.Custom('education_focus_child')]"
 playdate.3011.c:0 "Não, isso é bobagem. Vamos jogar xadrez."
 playdate.3011.desc:0 "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim com um monte de tecido em seus braços. Quando [participant.GetSheHe] despeja no chão na minha frente, percebo que é um monte de roupas - para adultos!\n\n\"Vamos brincar de casinha juntos!\""
 playdate.3011.t:0 "Brincando de Casinha"
 playdate.3012.a.failure:0 "Você é [Select_CString( ROOT.Char.IsFemale, 'atingida', 'atingido' )] na cabeça - #EMP com força#!"
 playdate.3012.a.neutral:0 "Não importa o quanto você tente, você simplesmente não entende"
 playdate.3012.a.success:0 "Você aprende o básico"
 playdate.3012.a:0 "#EMP Sim!#!"
 playdate.3012.b:0 "Prefiro assistir você treinar."
 playdate.3012.desc:0 "\n\n\"O que você acha, [participant.Custom('GirlsBoysChildren')], acha que consegue lidar com o básico?\""
 playdate.3012.desc_knight:0 "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] e eu estamos observando os $knight_culture_player_plural_no_tooltip_lowercase$ treinarem no pátio quando [knight.Custom2('MyCharacterIntroduction', ROOT.Char)] se aproxima de nós com um sorriso."
 playdate.3012.desc_no_knight:0 "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] e eu estamos observando alguns camponeses treinarem quando um deles se aproxima de nós com um sorriso."
 playdate.3012.t:0 "Bravo $knight_culture_player_plural_no_tooltip$"
 playdate.3013.a.failure:0 "Você não faz ideia do que [witch.GetSheHe] está falando"
 playdate.3013.a.success:0 "Você aprende muito sobre ervas e plantas"
 playdate.3013.a:0 "Eu só quero saber sobre aquela planta que você está segurando."
 playdate.3013.b:0 "Sim, me ensine tudo o que puder!"
 playdate.3013.c:0 "Você... Você é uma bruxa! Você é uma pessoa má."
 playdate.3013.desc:0 "Estamos brincando na floresta quando de repente me encontro completamente sozinho; eu poderia jurar que os outros estavam logo atrás de mim!\n\nNo momento em que estou prestes a começar a gritar - para que eles possam me encontrar, não porque estou #EMP com medo#! - eu me deparo com [witch.Custom2('MyCharacterIntroduction', ROOT.Char)] vestida com um manto preto. [witch.GetSheHe|U] está agachada no chão inspecionando uma planta de aparência estranha, comparando-a com uma representada em um grande livro preto aberto no chão ao lado [witch.GetHerHim].\n\n\"Olá, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] jovem [ROOT.Char.GetLadyLord]. A busca pelo conhecimento o trouxe até aqui?\""
 playdate.3013.t:0 "[witch.GetWomanMan|U] [Select_CString( witch.IsFemale, 'Sábia', 'Sábio' )]"
 playdate.3014.a.failure:0 "Você não aprende nada"
 playdate.3014.a.neutral:0 "Você aprende algumas coisas"
 playdate.3014.a.success:0 "Você se dedica à arte de escrever diários"
 playdate.3014.a.tt:0 "Você aprofunda seus estudos na arte de [ROOT.Char.Custom('education_focus_child')]"
 playdate.3014.a.tt_participant:0 "Você e [participant.GetFirstNameNoTooltip] aprofundam seus estudos na arte de [ROOT.Char.Custom('education_focus_child')]"
 playdate.3014.a:0 "Sim! Me ensine sobre eles."
 playdate.3014.b:0 "Não, estou [Select_CString( ROOT.Char.IsFemale, 'interessada', 'interessado' )] em você nos contar sobre aventuras!"
 playdate.3014.desc:0 "Estou explorando a [ROOT.Char.GetFaith.HouseOfWorship] local quando me deparo com [priest.Custom2('MyCharacterIntroduction', ROOT.Char)|U] cercado por pergaminhos.\n\n\"São diários de tempos passados, você está [Select_CString( ROOT.Char.IsFemale, 'interessada', 'interessado' )] em coisas assim?\""
 playdate.3014.desc_participant:0 "Estamos explorando a [ROOT.Char.GetFaith.HouseOfWorship] local quando [participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] e eu nos deparamos com [priest.Custom2('MyCharacterIntroduction', ROOT.Char)] cercado por pergaminhos.\n\n\"São diários de tempos passados, você está [Select_CString( ROOT.Char.IsFemale, 'interessada', 'interessado' )] em coisas assim?\""
 playdate.3014.t:0 "O [priest.GetCouncilTitle|U]"
 playdate.4000.a:0 "Espero que [participant.GetSheHe] esteja brincando na [ROOT.Char.GetFaith.PositiveAfterLife]."
 playdate.4000.b:0 "A inocência é um veneno fatal."
 playdate.4000.c:0 "Desejo o mesmo destino para [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNameNoTooltip]."
 playdate.4000.desc:0 "Um mensageiro chega trazendo notícias sombrias e uma pequena caixa preta.\n\n[Select_CString( drowned_participant.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('drowned_participant'))], [drowned_participant.GetFirstNameNoTooltip], se afogou enquanto brincava com [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstName].\n\nMal consigo enxergar através dos olhos lacrimejantes dentro da caixa - mas um vislumbre confirma que este é realmente o corpo [Select_CString( drowned_participant.IsFemale, 'da minha querida', 'do meu querido' )]."
 playdate.4000.t:0 "[Select_CString( ROOT.Char.IsFemale, 'Molhada', 'Molhado' )] de Lágrimas"
 playdate.4001.a:0 "Vou falar devagar e alto! Isso deve ajudar!"
 playdate.4001.b:0 "Talvez eu possa pedir para [participant.GetFirstNameNoTooltip] me ensinar um pouco de [participant.GetCulture.GetLanguage.GetName]?"
 playdate.4001.c:0 "Bleh, por que eu deveria me incomodar? Só quero me divertir!"
 playdate.4001.desc.pensive:0 "\"Desculpe... #EMP Abode#!. Ela volta para sua humilde morada, não seu pacote no exterior.\" Apesar dos bons modos [participant.GetHerHim], as sobrancelhas [Select_CString( participant.IsFemale, 'da', 'do' )] [participant.GetTitledFirstName] estão franzidas de frustração."
 playdate.4001.desc.rowdy:0 "\"Eu disse #EMP \"boneca\"#! e não #EMP \"entediante!\"#! Caramba!\" [participant.GetTitledFirstName] está claramente [Select_CString( participant.IsFemale, 'agitada', 'agitado' )] com a barreira linguística. O gesto de levantar as mãos no ar pinta a imagem de um acesso de raiva prestes a começar."
 playdate.4001.desc:0 "\n\nA língua [ROOT.Char.GetCulture.GetLanguage.GetName] e a língua [participant.GetCulture.GetLanguage.GetName] parecem ter mais diferenças do que semelhanças, daí nossas dificuldades em nos comunicar.\n\nTalvez eu possa fazer algo para que possamos brincar juntos sem nos irritar, ou devo apenas esperar que se resolva por si só?"
 playdate.4001.t:0 "A Barreira Linguística"
 playdate.5001.a.tt:0 "O jogo começa!"
 playdate.5001.a:0 "Vou participar!"
 playdate.5001.b:0 "Não estou com vontade..."
 playdate.5001.desc:0 "Uma bola quica na minha direção, sendo recolhida nos braços de [participant.GetFirstName].\n\n\"Você quer participar? Temos uma bola e precisamos de mais jogadores.\"\n\nA pequena multidão de crianças se reúne expectante ao nosso redor."
 playdate.5001.t:0 "Vamos Brincar?"
 playdate.5002.a.tt:0 "Bem, na verdade, acho que #EMP eu#! pagarei, mas não vou ficar no prejuízo por muito tempo..."
 playdate.5002.a:0 "\"[Select_CString( parent.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('parent'))] pagará pelos reparos!\""
 playdate.5002.b.failure:0 "[neighbour.GetSheHe|U] devolve a bola com um franzir de sobrancelha"
 playdate.5002.b.success:0 "[neighbour.GetSheHe|U] obedientemente devolve a bola"
 playdate.5002.b.tt:0 "[neighbour.GetSheHe] esqueceu que sou um [ROOT.Char.GetTitleAsNameNoTooltip]?"
 playdate.5002.b:0 "\"Ordeno que você devolva a bola, [neighbour.Custom2('InsultNoun', ROOT.Char)].\""
 playdate.5002.c.failure:0 "[neighbour.GetSheHe|U] devolve a bola com um suspiro profundo"
 playdate.5002.c.success:0 "[neighbour.GetSheHe|U] devolve a bola com um sorriso"
 playdate.5002.c:0 "\"Peço desculpas. Podemos ter a bola de volta?\""
 playdate.5002.desc:0 "A bola quica erraticamente enquanto passa por mim, ricocheteando em uma parede... e indo parar em um jardim próximo! Um barulho de estilhaços e um grito irritado anunciam as consequências vindouras.\n\n[neighbour.GetFirstName] sai de uma porta, segurando o [broken_artifact.GetName] danificado. Olhando ao redor, [neighbour.GetSheHe] me identifica como o culpado.\n\n\"O que você tem a dizer por si, seu fedelho insolente?\" [neighbour.GetSheHe|U] rosna. Eu procuro por apoio. Nenhum está por vir."
 playdate.5002.t:0 "Mirada Desastrada"
 playdate.5003.a:0 "[other_child.GetFirstNameNoTooltip] não está usando proteção para as canelas..."
 playdate.5003.b.failure:0 "[other_child.GetFirstNameNoTooltip] é simplesmente muito forte"
 playdate.5003.b.success:0 "Você consegue acompanhar"
 playdate.5003.b:0 "Só preciso me esforçar mais!"
 playdate.5003.c:0 "Talvez se eu continuar assistindo, possa aprender algo."
 playdate.5003.desc:0 "[other_child.GetFirstName] é simplesmente rápido e forte demais! Toda vez que tento acompanhá-lo, simplesmente esbarro n[other_child.GetSheHe]. Mesmo quando dou um passo para trás para assistir [other_child.GetSheHe] jogar a bola, tenho que dar um tempo para recuperar o fôlego depois de tanto correr.\n\nCertamente deve haver alguma maneira de eu competir?"
 playdate.5003.t:0 "Construído Diferente"
 playdate.5004.a:0 "\"Você se importa se eu me juntar a você?\""
 playdate.5004.b.failure:0 "Eles não se impressionam com seus esforços"
 playdate.5004.b.success:0 "Eles participam hesitantes"
 playdate.5004.b:0 "\"Vamos lá, participe!\""
 playdate.5004.c:0 "Melhor deixá-los em paz."
 playdate.5004.desc:0 "Enquanto corremos, rindo e conversando na perseguição à bola, uma figura solitária chama minha atenção.\n\n[other_child.GetFirstName] está sentado à parte, observando timidamente os acontecimentos. [other_child.GetSheHe|U] olha para mim brevemente antes de desviar o olhar imediatamente, fingindo interesse em algumas flores.\n\nParece que [other_child.GetSheHe|U] poderia gostar de um pouco de companhia."
 playdate.5004.t:0 "Outra Perspectiva"
 playdate.5005.a:0 "[bullied_kid.GetFirstNameNoTooltip] deveria pegá-la!"
 playdate.5005.b.critfailure:0 "Você erra o pulo e cai"
 playdate.5005.b.failure.gameends:0 "O jogo de futebol termina"
 playdate.5005.b.failure.tt:0 "Todos os participantes perdem #negative_value 5#! de opinião sobre você"
 playdate.5005.b.failure:0 "Você pula o muro e pega a bola"
 playdate.5005.b.success.tt:0 "Todos os participantes ganham #positive_value 15#! de opinião sobre você"
 playdate.5005.b.success:0 "Você salta o muro com muita graça"
 playdate.5005.b:0 "Tudo bem, #EMP muro#!, lá vou eu..."
 playdate.5005.c:0 "Vamos encontrar outra coisa para fazer, o que acha?"
 playdate.5005.desc:0 "Lá está a bola! Enquanto ela passa por mim, dou um chute poderoso. Bem #EMP poderoso demais#!\n\nA bola gira rapidamente pelo ar. Ela passa zunindo pela multidão, bem alto, e voa sobre um muro próximo. O baque de sua aterrissagem é sonoro.\n\nOlho para cima e vejo o muro. Ele é bem alto, mais que o dobro da minha altura."
 playdate.5005.ending:0 "Até um pouco alto demais para o meu gosto. Enquanto pondero minhas opções, noto que [bullied_kid.GetFirstName] está parado a certa distância, fazendo o possível para não olhar para o muro."
 playdate.5005.more_balls:0 "Vou comprar outra bola!"
 playdate.5005.t:0 "A Grande Parede"
 playdate.5006.a.tt:0 "Não foi culpa sua, mas está claro que [bully_kid.GetFirstNameNoTooltip] não vai pedir desculpas..."
 playdate.5006.a:0 "\"Desculpe, [ball_kid.GetFirstNameNoTooltip].\""
 playdate.5006.b.failure:0 "[ball_kid.GetSheHe|U] vai embora de qualquer maneira"
 playdate.5006.b.success:0 "Você convence [ball_kid.GetSheHe] a ficar"
 playdate.5006.b:0 "\"Espere, [ball_kid.GetFirstNameNoTooltip]! Por favor, fique.\""
 playdate.5006.c:0 "Melhor eu ficar quieto."
 playdate.5006.d:0 "\"Você está deixando a bola. Ela é nossa agora.\""
 playdate.5006.desc:0 "A competição está esquentando um pouco aqui no jogo de futebol. O pensamento mal havia se formado em minha mente quando outro conflito ocorreu, quando [ball_kid.GetFirstName] é atingido duramente por [bully_kid.GetFirstName], fazendo [ball_kid.GetSheHe] cair em um arbusto próximo. [bully_kid.GetFirstNameNoTooltip], prestativamente, começa a rir.\n\n\"Ch- chega!\" [ball_kid.GetFirstNameNoTooltip] exclama com raiva, se soltando do arbusto. [ball_kid.GetSheHe|U] pega a bola enquanto faz isso. \"Estou indo para casa e levando minha bola!\"\n\nUm silêncio constrangedor se instala."
 playdate.5006.t:0 "Estou Indo para Casa!"
 playdate.5007.a.failure:0 "[bully_kid.GetFirstNameNoTooltip] desafia você e vence"
 playdate.5007.a.success:0 "Você os intimida a recuar"
 playdate.5007.a.tt:0 "Você se aproxima para enfrentar o valentão..."
 playdate.5007.a:0 "\"Deixe [sad_kid.GetSheHe] em paz!\""
 playdate.5007.b:0 "\"Eu faria isso.\""
 playdate.5007.c:0 "Melhor eu não me envolver."
 playdate.5007.desc:0 "Risadas estridentes cortam o ar. Logo do outro lado do pátio, [sad_kid.GetFirstName] se encolhe diante de [bully_kid.GetFirstName], que está apontando para [sad_kid.GetSheHe] com deboche.\n\n\"[sad_kid.GetSheHe|U] mal consegue chutar uma bola! Quem gostaria de ser [Select_CString( sad_kid.IsFemale, 'amiga dessa', 'amigo desse' )] [sad_kid.Custom2('InsultNoun', SCOPE.sC('bully_kid'))]!\"\n\n[sad_kid.GetFirstNameNoTooltip], fungando, procura por algum apoio, mas parece estar difícil de encontrar."
 playdate.5007.t:0 "Alvo de Bullying"
 playdate.5008.a:0 "\"Fique quieto, seu velho maluco!\""
 playdate.5008.b:0 "\"Pedimos desculpas. Vamos fazer menos barulho.\""
 playdate.5008.desc:0 "\"Você poderia ficar #EMP quieto#!, pelo amor de [old_timer.GetFaith.HighGodName]?\" [old_timer.GetFirstName] está se inclinando para fora de uma janela gradeada acima de nós, apoplético, sacudindo um punho. \"Vocês garotos infernais estão fazendo um barulho tremendo! Eu mal consigo ouvir meus próprios #EMP pensamentos#!\"\n\nPego a bola enquanto ela se aproxima de mim, observando [Select_CString( old_timer.IsFemale, 'a', 'o' )] [old_timer.GetWomanMan] de idade avançada enquanto ele resmunga lá em cima. [old_timer.GetSheHe|U] é verdadeiramente #EMP antigo:#! talvez tenha trinta ou quarenta anos!\n\nNão é de se admirar que [old_timer.GetSheHe] esteja irritado."
 playdate.5008.t:0 "Momento de Ancião"
 playdate.5009.a.critical_success:0 "Você resgata [small_kid.GetSheHe] heroicamente"
 playdate.5009.a.failure:0 "Você precisa proteger seu corpo com por sua conta"
 playdate.5009.a.success:0 "Você resgata [small_kid.GetSheHe]"
 playdate.5009.a:0 "\"[small_kid.GetFirstNameNoTooltip]! Espere, estou indo ajudar!\""
 playdate.5009.b.critfailure:0 "As lesões de [small_kid.GetFirstNameNoTooltip] são terríveis"
 playdate.5009.b.failure:0 "[small_kid.GetFirstNameNoTooltip] sofre algumas lesões graves"
 playdate.5009.b:0 "Não consigo assistir..."
 playdate.5009.c.failure:0 "Suas palavras caem em ouvidos surdos"
 playdate.5009.c.success:0 "Os jogadores revoltosos de futebol ficam em sentido"
 playdate.5009.c:0 "\"Pessoal, #EMP PAREM!#!\""
 playdate.5009.desc:0 "Mesmo sendo crianças, o futebol pode se transformar em um jogo extremamente árduo. O que começou como uma partida brincalhona de repente se transformou em um tumulto total, e leva alguns segundos para que eu recupere meu equilíbrio.\n\nQuando o faço, ouço um grito agudo de dor e terror vindo da pilha de crianças brigando. Preso na parte de baixo, avisto [small_kid.GetFirstName] sendo pisoteado por dezenas de pés. [small_kid.GetSheHe|U] clama piedosamente, mas o barulho é muito alto e os outros estão muito concentrados no jogo."
 playdate.5009.t:0 "Pés Trovejantes"
 playdate.5010.a.failure:0 "Ninguém acredita em você"
 playdate.5010.a.success:0 "Todos se aglomeram em choque"
 playdate.5010.a.tt.success:0 "Sua encenação chama bastante atenção..."
 playdate.5010.a.tt:0 "Se eu fingisse que um golpe errado me atingiu, talvez [obnoxious_parent.GetSheHe] se retirasse?"
 playdate.5010.a:0 "Os braços [obnoxious_parent.GetHerHim|U] estão balançando demais..."
 playdate.5010.a_flavor:0 "Vou fingir que [obnoxious_parent.GetFirstNameNoTooltip] me atingiu!"
 playdate.5010.b:0 "\"Você poderia apenas calar a boca, por favor?!\""
 playdate.5010.c:0 "Vou apenas lidar com isso."
 playdate.5010.desc:0 "\"Pegue ele! Empurre ela contra a parede! Isso aí!\" A voz [obnoxious_parent.GetFirstName] ecoa pelo pátio. [obnoxious_parent.GetSheHe|U] se posicionou no canto para assistir [embarrassed_child.GetFirstName] jogar na partida de futebol, o viés em relação [Select_CString( embarrassed_child.IsFemale, 'a', 'ao' )] [embarrassed_child.Custom('GirlBoy')] é evidente.\n\nDigo apenas que [obnoxious_parent.GetFirstNameNoTooltip] está levando isso um #EMP pouco#! a sério demais.\n\n\"Ei! Nada de empurrar [embarrassed_child.Custom('HerHim')], isso é trapaça!\" As histrionices [obnoxious_parent.GetFirstNameNoTooltip] estão começando a irritar."
 playdate.5010.t:0 "Esse é [Select_CString( embarrassed_child.IsFemale, 'a Minha', 'o Meu' )] [embarrassed_child.Custom('GirlBoy')|U]!"
 playdate.5011.a:0 "\"Aiii, dói muito! Aiiii!\""
 playdate.5011.b:0 "Provavelmente eu deveria contar a verdade..."
 playdate.5011.desc:0 "Enquanto finjo o máximo possível com uma multidão de crianças preocupadas ao meu redor, os olhos [Select_CString( obnoxious_parent.IsFemale, 'da', 'do' )] [obnoxious_parent.GetFirstName] quase saltam de sua cabeça.\n\n\"Seu pequeno... #EMP charlatão!#!\" [obnoxious_parent.GetSheHe] rosna, apontando um dedo indignado na minha direção. \"Eu vou me certificar de que você—\"\n\n\"[obnoxious_parent.GetFirstNameNoTooltip]!\" Veio um grito distante e furioso, se aproximando rapidamente. A cor some do rosto [Select_CString( obnoxious_parent.IsFemale, 'da', 'do' )] [obnoxious_parent.GetFirstNameNoTooltip] enquanto [responsible_adult.GetFirstName] sai furiosamente para o pátio. \"O que isso significa?\"\n\nÉ sorte que eu tenha uma distração, para que apenas [obnoxious_parent.GetFirstNameNoTooltip] possa ver meu sorriso presunçoso e satisfeito."
 playdate.5011.t:0 "Merecido"
 playdate.9001.a:0 "Até a próxima!"
 playdate.9001.desc:0 "Foi bom esquecer todas as responsabilidades por um tempo e passar tempo com outras crianças, mas me disseram que agora tenho que voltar às minhas obrigações...\n\nNos divertimos muito! Espero que possamos fazer isso de novo em breve."
 playdate.9001.t:0 "Fim da Diversão"
 playdate.9002.a:0 "Adeus, [host.GetFirstNameNoTooltip]!"
 playdate.9002.desc:0 "Que divertido que tivemos! Vou me lembrar dos dias passados com [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstName] por muito tempo.\n\nAgora me disseram que é hora de arrumar as coisas e voltar para casa para minhas obrigações, mas espero que possamos fazer isso de novo em breve."
 playdate.9002.t:0 "Voltando para Casa"
