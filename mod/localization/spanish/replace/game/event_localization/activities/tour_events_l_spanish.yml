 tour_general.0001.a:0 "Seja bem-vindo, [Select_CString( visiting_liege.IsFemale, 'minha', 'meu' )] [visiting_liege.GetTitleAsNameNoTooltip]! Seja bem-vindo!"
 tour_general.0001.b:0 "Vamos fingir que não tem ninguém em casa..."
 tour_general.0001.desc.intro:0 "Finalmente, a comitiva [Select_CString( visiting_liege.IsFemale, 'da', 'do' )] [visiting_liege.GetTitledFirstName] chega aos meus portões, visitando [ROOT.Char.GetCapitalLocation.GetName] em sua turnê por [visiting_liege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]."
 tour_general.0001.desc.mid.close_family:0 "Uma oportunidade rara, mas bem-vinda, de ver [Select_CString( visiting_liege.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', visiting_liege)]; foi gentil [visiting_liege.GetSheHe] vir."
 tour_general.0001.desc.mid.default:0 "Receber [Select_CString( visiting_liege.IsFemale, 'a', 'o' )] [visiting_liege.GetLadyLord] do reino em meus próprios salões seria uma grande honra."
 tour_general.0001.desc.mid.friend:0 "Embora tenhamos que cumprir as formalidades, a visita de um bom amigo é muito bem-vinda."
 tour_general.0001.desc.mid.hates_liege:0 "Já estava na hora de aquele(a) [visiting_liege.Custom2('InsultAdjective', ROOT.Char)] [visiting_liege.Custom2('InsultNoun', ROOT.Char)] descer de seus salões sombrios e ver um pouco do verdadeiro país."
 tour_general.0001.desc.mid.house:0 "[Select_CString( visiting_liege.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', visiting_liege)] veio para fortalecer os laços de vassalagem e da Casa [ROOT.Char.GetHouse.GetBaseName]."
 tour_general.0001.desc.mid.lover:0 "Já faz muito tempo desde que senti o abraço [visiting_liege.GetHerHim] — talvez haja tempo para colocar a conversa em dia..."
 tour_general.0001.desc.mid.powerful_vassal:0 "Como um dos vassalos mais poderosos do reino, não é surpresa que [visiting_liege.GetSheHe] tenha vindo bater à minha porta."
 tour_general.0001.desc.outro:0 "e fornecer camas e entretenimento para sua comitiva.\n\nA única questão é: eu abro os portões e deixo [visiting_liege.GetSheHe] entrar?"
 tour_general.0001.desc.phase.cultural_festival:0 "\n\nDevo apresentar ao [visiting_liege.GetTitleAsNameNoTooltip] um festival que exiba o melhor entretenimento e apresentações dos [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip],"
 tour_general.0001.desc.phase.dinner:0 "\n\nDevo sediar um jantar luxuoso digno de um [visiting_liege.GetTitleAsNameNoTooltip] — uma oportunidade de mostrar a hospitalidade [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip],"
 tour_general.0001.desc.phase.tour_grounds:0 "\n\nDevo conduzir o [visiting_liege.GetTitleAsNameNoTooltip] em um tour pelo meu [ROOT.Char.Custom('FortifiedBuilding')] e pelas terras [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip],"
 tour_general.0001.desc.type.intimidation:0 "As fileiras de guardas sérios e disciplinados deixam claro que o medo é a ordem do dia.\n\n"
 tour_general.0001.desc.type.majesty:0 "As roupas esplêndidas e a apresentação nobre do grupo mostram uma ambição de me impressionar.\n\n"
 tour_general.0001.desc.type.taxation:0 "O carro do tesouro e a litania de cobradores de impostos sugerem que ficarei mais pobre com esta visita.\n\n"
 tour_general.0001.title:0 "A Chegada [Select_CString( visiting_liege.IsFemale, 'da', 'do' )] [visiting_liege.GetTitledFirstNameNoTooltip]!"
 tour_general.0500.a:0 "Eu estava [Select_CString( ROOT.Char.IsFemale, 'ansiosa', 'ansioso' )] por isso..."
 tour_general.0500.desc.already_visited:0 "Já visitei [stop_host_scope.GetName] anteriormente em minha Grande Turnê, e não posso demonstrar preferência por [stop_host_scope.GetSheHe]. [stop_host_scope.GetSheHe|U] receberá apenas uma visita, nada mais."
 tour_general.0500.desc.at_war:0 "A sombra da guerra paira sobre [tour_location.GetNameNoTooltip] e [stop_host_scope.GetName] me avisou para não me aventurar lá."
 tour_general.0500.desc.deadly_illness:0 "[stop_host_scope.GetName|U] contraiu uma doença mortal, e não posso arriscar uma visita e respirar o miasma tóxico [stop_host_scope.GetHerHim]."
 tour_general.0500.desc.gone_adventuring:0 "[stop_host_scope.GetName|U] partiu em alguma aventura para terras que não estou [Select_CString( ROOT.Char.IsFemale, 'disposta', 'disposto' )] a alcançar."
 tour_general.0500.desc.gone_travelling:0 "[stop_host_scope.GetName|U] abandonou sua casa e partiu para terras desconhecidas."
 tour_general.0500.desc.imprisoned:0 "[stop_host_scope.GetName|U] já não é [Select_CString( stop_host_scope.IsFemale, 'uma', 'um' )] [stop_host_scope.GetWomanMan] livre, pois [stop_host_scope.GetSheHe] apodrece em alguma masmorra estrangeira."
 tour_general.0500.desc.imprisoned_by_me:0 "[stop_host_scope.GetName|U] foi [Select_CString( stop_host_scope.IsFemale, 'capturada', 'capturado' )] e agora apodrece em minha masmorra."
 tour_general.0500.desc.incapable:0 "[stop_host_scope.GetName|U] já não tem controle total de suas faculdades e não seria um bom anfitrião."
 tour_general.0500.desc.intro:0 "Chegou até mim a informação de que meus planos foram interrompidos e não é mais possível realizar uma visita real a [tour_location.GetName].\n\n"
 tour_general.0500.desc.leading_army:0 "[stop_host_scope.GetName|U] está em campo de batalha e não pode mais me receber."
 tour_general.0500.desc.lowly_baron:0 "[tour_location.GetNameNoTooltip|U] agora está sob o domínio de um humilde [stop_host_scope.GetTitleAsNameNoTooltip|U], e é abaixo de mim visitar [stop_host_scope.GetWomenMen] de tão baixo status."
 tour_general.0500.desc.no_longer_liege:0 "O [stop_host_scope.GetTitleAsNameNoTooltip|U] de [tour_location.GetNameNoTooltip] não está mais sob minha autoridade direta."
 tour_general.0500.desc.outro:0 "\n\nEmbora isso não signifique o fim da minha turnê, é uma grande decepção."
 tour_general.0500.desc.self:0 "Agora sou eu [Select_CString( ROOT.Char.IsFemale, 'a nova', 'o novo' )] [ROOT.Char.GetLadyLord] de [tour_location.GetName], e ninguém além de mim pode me receber."
 tour_general.0500.title:0 "Não Há Ninguém em Casa"
 tour_general.0501.a:0 "Vamos apenas seguir em frente."
 tour_general.0501.b:0 "Esse insulto não será esquecido tão cedo."
 tour_general.0501.c:0 "Arrombe os portões malditos!"
 tour_general.0501.desc:0 "Enquanto meu séquito para nos portões de [stop_host_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTier], é solicitado que [stop_host_scope.GetName] me receba, mas depois de um tempo mais do que generoso, nem mesmo um humilde servo aparece para me cumprimentar. A chamada é feita várias vezes, mas não recebemos respostas além dos cantos dos pássaros selvagens e do assobio dos ventos suaves.\n\nTornou-se claro que fui recusado nos portões, e [Select_CString( stop_host_scope.IsFemale, 'a', 'o' )] [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] [stop_host_scope.GetTitleAsNameNoTooltip] insultou a coroa ao fazê-lo!"
 tour_general.0501.liege_angry:0 "[visiting_liege.GetFirstName] está [Select_CString( visiting_liege.IsFemale, 'insultada', 'insultado' )]"
 tour_general.0501.liege_merciful:0 "[visiting_liege.GetFirstName] te perdoou"
 tour_general.0501.raid:0 "[visiting_liege.GetFirstName] saqueou sua propriedade"
 tour_general.0501.title:0 "Recusado"
 tour_general.0510.a:0 "É hora do tributo."
 tour_general.0510.b:0 "Não faço exigências."
 tour_general.0510.desc:0 "Concluí minha visita a [ROOT.Char.GetCurrentLocation.GetName], e agora minha procissão se prepara para partir.\n\n[stop_host_scope.GetName] e a sua corte se alinharam cuidadosamente para me ver partir, e com todos presentes, é hora de recolher tributos por conceder a [stop_host_scope.GetSheHe] a minha presença."
 tour_general.0510.title:0 "Uma Exigência de Despedida"
 tour_general.0511.a:0 "Eu me submeto."
 tour_general.0511.b:0 "Eu não farei nada disso!"
 tour_general.0511.desc.factions:0 "[visiting_liege.GetSheHe|U] me apresenta a mão e exige que eu jure minha lealdade a [visiting_liege.GetSheHe] e ao [visiting_liege.GetPrimaryTitle.GetName], jurando nunca ir contra a vontade real."
 tour_general.0511.desc.kneel:0 "[visiting_liege.GetSheHe|U] exige que eu me ajoelhe diante [Select_CString( visiting_liege.IsFemale, 'da minha', 'do meu' )] [visiting_liege.GetTitleAsNameNoTooltip|U] diante de toda a minha corte, demonstrando minha submissão à coroa."
 tour_general.0511.desc.money:0 "[visiting_liege.GetSheHe|U] me apresentou uma conta de todas as despesas pagas durante a viagem [visiting_liege.GetHerHim]. Embora muitas das cobranças pareçam falsas, estou obrigado a pagar."
 tour_general.0511.desc:0 "É hora de [visiting_liege.GetName] partir, e devo dizer que me considero um anfitrião magnânimo.\n\nNo entanto, parece que [visiting_liege.GetName] não acredita que minha hospitalidade foi suficiente e fez uma exigência a mim.\n\n"
 tour_general.0511.gave_demand:0 "[stop_host_scope.GetName] cedeu"
 tour_general.0511.title:0 "Um Presente de Despedida"
 tour_general.0512.a:0 "Excelente."
 tour_general.0512.desc:0 "É hora de [visiting_liege.GetName] partir, e devo dizer que me considero um anfitrião magnânimo.\n\n[visiting_liege.GetSheHe|U] parece totalmente satisfeito com meu desempenho como anfitrião e não exigiu nada de mim, exceto uma promessa de que poderemos nos encontrar novamente."
 tour_general.0512.title:0 "Uma Despedida Cordial"
 tour_general.0513.a:0 "Isso não será esquecido em breve."
 tour_general.0513.desc:0 "[stop_host_scope.GetName] recusou-se desafiadoramente a atender minhas exigências. Há pouco que eu possa fazer agora, mas um insulto como este constitui um crime não apenas contra mim, mas contra o próprio reino!"
 tour_general.0513.title:0 "Exigência Recusada"
 tour_general.1001.a:0 "Espero que [tour_general_3001_target_courtier.GetFirstNameNoTooltip] sirva bem a [visiting_liege.GetSheHe]."
 tour_general.1001.a_theft_liege:0 "[tour_general_3001_target_courtier.GetFirstNameNoTooltip] nunca foi de grande utilidade para mim mesmo."
 tour_general.1001.b.tt:0 "Você solicita um favor em troca de [tour_general_3001_target_courtier.GetFirstName] se juntar à corte [Select_CString( visiting_liege.IsFemale, 'da', 'do' )] [visiting_liege.GetTitledFirstName]."
 tour_general.1001.b:0 "Quid pro quo, [visiting_liege.GetTitledFirstNameNoTooltip]."
 tour_general.1001.c.tt:0 "Você solicita algum ouro em troca de [tour_general_3001_target_courtier.GetFirstName] se juntar à corte [Select_CString( visiting_liege.IsFemale, 'da', 'do' )] [visiting_liege.GetTitledFirstName]."
 tour_general.1001.c:0 "Tenho certeza de que [Select_CString( visiting_liege.IsFemale, 'a', 'o' )] [visiting_liege.GetTitleAsNameNoTooltip] pode tornar isso vantajoso para mim..."
 tour_general.1001.d.flavor:0 "Vamos nos permitir."
 tour_general.1001.d.tt:0 "Você sugere compartilhar uma refeição #EMP exótica#! com [visiting_liege.GetShortUIName]."
 tour_general.1001.d.tt_extra:0 "[visiting_liege.GetShortUIName] aceitará o convite ou condenará seu canibalismo."
 tour_general.1001.d:0 "Só pode haver #EMP uma#! razão pela qual [visiting_liege.GetSheHe] quer [tour_general_3001_target_courtier.GetFirstNameNoTooltip]..."
 tour_general.1001.desc:0 "\n\nEm resumo, [Select_CString( visiting_liege.IsFemale, 'a', 'o' )] [visiting_liege.GetTitleAsNameNoTooltip] deseja realocar [tour_general_3001_target_courtier.GetSheHe] para a corte de [visiting_liege.GetTitleAsNameNoTooltip]."
 tour_general.1001.desc_theft_liege:0 "\n\nCom pouca consideração pelos meus problemas, parece também que [Select_CString( visiting_liege.IsFemale, 'a', 'o' )] [visiting_liege.GetTitleAsNameNoTooltip] tentou realocar à força [Select_CString( tour_general_3001_target_courtier.IsFemale, 'a', 'o' )] [tour_general_3001_target_courtier.GetTitledFirstNameNoTooltip] para a corte de [visiting_liege.GetTitleAsNameNoTooltip] durante a noite."
 tour_general.1001.e.bodyguard.desc:0 "Seu guarda-costas interveio para salvá-lo."
 tour_general.1001.e.bodyguard:0 "[tour_general_1001_bodyguard.GetTitledFirstNameNoTooltip] intervém."
 tour_general.1001.e.failure:0 "Seu ataque falha."
 tour_general.1001.e.flavor:0 "Pelo [ROOT.Char.GetFaith.DevilName]!"
 tour_general.1001.e.slain.desc:0 "Você perdeu a luta."
 tour_general.1001.e.slain.tt:0 "Você foi morto."
 tour_general.1001.e.success.desc:0 "Você sobreviveu à luta."
 tour_general.1001.e.success.tt:0 "Você sobreviveu."
 tour_general.1001.e.success:0 "Seu ataque é bem-sucedido."
 tour_general.1001.e.tt:0 "Você se lança sobre [visiting_liege.GetShortUIName]."
 tour_general.1001.e:0 "#EMP Você vai morrer agora!#!"
 tour_general.1001.f.tt:0 "Você não deseja abrir mão do seu cortesão."
 tour_general.1001.f:0 "Isso parece uma má ideia."
 tour_general.1001.f_theft_liege:0 "Eu mal posso concordar com esse pedido agora."
 tour_general.1001.intro:0 "Chegou ao meu conhecimento que [Select_CString( visiting_liege.IsFemale, 'a', 'o' )] [visiting_liege.GetTitledFirstName] colocou seus olhos [Select_CString( tour_general_3001_target_courtier.IsFemale, 'na', 'no' )] [tour_general_3001_target_courtier.GetTitledFirstName], [Select_CString( tour_general_3001_target_courtier.IsFemale, 'conhecida', 'conhecido' )] localmente por seu [tour_general_3001_target_courtier.Custom('GetCourtierTrait')]."
 tour_general.1001.outro:0 "\n\nCertamente, essa é uma oportunidade para mostrar minha benevolência a [visiting_liege.GetSheHe]!"
 tour_general.1001.outro_theft_liege:0 "\n\nNão preciso dizer que isso me irrita de várias maneiras."
 tour_general.1001.outro_theft_liege_unusual_courtier:0 "\n\nAdmito que não vejo motivo para [Select_CString( visiting_liege.IsFemale, 'a', 'o' )] [visiting_liege.GetTitledFirstName] querer [Select_CString( tour_general_3001_target_courtier.IsFemale, 'a', 'o' )] [tour_general_3001_target_courtier.GetTitledFirstNameNoTooltip], mas [tour_general_3001_target_courtier.GetSheHe] é #EMP [Select_CString( tour_general_3001_target_courtier.IsFemale, 'minha', 'meu' )]#! [ROOT.Char.Custom2('RelationToMeShort', tour_general_3001_target_courtier )], droga."
 tour_general.1001.outro_unusual_courtier:0 "\n\nEmbora eu não entenda muito bem a razão [Select_CString( visiting_liege.IsFemale, 'da', 'do' )] [ROOT.Char.Custom2('RelationToMePossessive', visiting_liege )], não estou muito preocupado em perder [tour_general_3001_target_courtier.GetSheHe]."
 tour_general.1001.outro_unusual_host_unusual_courtier:0 "\n\nPosso pensar em algumas razões pelas quais gostaria de manter [Select_CString( tour_general_3001_target_courtier.IsFemale, 'a', 'o' )] [tour_general_3001_target_courtier.GetTitledFirstNameNoTooltip] por perto. No entanto..."
 tour_general.1001.title:0 "$activity_tour$: Um Pedido Cortês"
 tour_general.1001.title_theft:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Uma Reivindicação Cortês"
 tour_general.1002.a.flavor:0 "Você se delicia."
 tour_general.1002.a:0 "Isso é #EMP divino#!"
 tour_general.1002.b:0 "... talvez apenas uma pequena mordida."
 tour_general.1002.c:0 "Ao nosso benfeitor, [tour_general_3001_target_courtier.GetFirstNameNoTooltip]!"
 tour_general.1002.desc_host:0 "Eu contemplo a disposição dos pratos na mesa mais uma vez. Meu cozinheiro trabalhou arduamente preparando cada pedacinho de [tour_general_3001_target_courtier.GetFirstName] para nosso prazer. A decoração é soberba.\n\nMe viro enquanto [Select_CString( visiting_liege.IsFemale, 'a', 'o' )] [visiting_liege.GetTitledFirstName] entra na câmara, [Select_CString( visiting_liege.IsFemale, 'sozinha', 'sozinho' )], conforme acordado. Observo enquanto [visiting_liege.GetSheHe] absorve tudo aquilo e um sorriso sutil surge nos cantos da boca [visiting_liege.GetHerHim]. [visiting_liege.GetSheHe|U] avança e se senta à mesa. Eu me junto a [visiting_liege.GetSheHe]."
 tour_general.1002.desc_liege:0 "Ao entrar na câmara, não tenho dúvidas de que [tour_general_3001_target_courtier.GetFirstName] é a estrela do show.\n\n[stop_host_scope.GetTitledFirstName] não poupou despesas e a mesa está repleta de pratos deliciosos, seguindo a filosofia de não desperdiçar nada e fazer uso de qualquer iguaria culinária saborosa que [tour_general_3001_target_courtier.GetFirstNameNoTooltip] tenha contribuído.\n\nAté a cabeça de [tour_general_3001_target_courtier.GetFirstNameNoTooltip], esvaziada e drenada, foi cuidadosamente colocada no final da mesa e decorada com vegetação local. Pauso por um momento para absorver tudo aquilo."
 tour_general.1002.title:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Uma Refeição Terrivelmente Gloriosa"
 tour_general.1002.title_vassal:0 "$activity_tour$: Uma Refeição Terrivelmente Gloriosa"
 tour_general.3001.a.flavor:0 "Uma vez aceito, duas vezes meu."
 tour_general.3001.a.tt:0 "Cortesão realocado"
 tour_general.3001.a:0 "Agora você faz parte da minha corte. Alegre-se."
 tour_general.3001.a_cannibal.flavor:0 "Vou garantir que [tour_general_3001_target_courtier.GetSheHe] esteja bem alimentado..."
 tour_general.3001.a_cannibal:0 "Uma adição tão deliciosa!"
 tour_general.3001.a_insanity.flavor:0 "[tour_general_3001_target_courtier.GetSheHe|U] #EMP sabe!#!"
 tour_general.3001.a_insanity:0 "Isso é o que precisa ser feito."
 tour_general.3001.b.harmful_sideeffects.tt:0 "Devido à personalidade de [stop_host_scope.GetShortUIName], isso pode ter consequências fatais"
 tour_general.3001.b:0 "Tenho certeza de que [Select_CString( stop_host_scope.IsFemale, 'a', 'o' )] [stop_host_scope.GetTitledFirstNameNoTooltip] não se importaria."
 tour_general.3001.b_host_decides.tt:0 "[stop_host_scope.GetShortUIName] decide o que acontece em seguida"
 tour_general.3001.b_liege_decides.tt:0 "[visiting_liege.GetShortUIName] decide o que acontece em seguida"
 tour_general.3001.c.tt_failure.desc:0 "Seu fracasso não passou despercebido."
 tour_general.3001.c.tt_failure:0 "Tentativa Fracassada"
 tour_general.3001.c.tt_success:0 "Levado Embora"
 tour_general.3001.c:0 "[tour_general_3001_target_courtier.GetSheHe|U] #EMP poderia#! simplesmente desaparecer na noite..."
 tour_general.3001.d:0 "Isso é bobagem."
 tour_general.3001.d_cannibal.flavor:0 "Tch!"
 tour_general.3001.d_cannibal:0 "Não. Eu preciso começar uma dieta."
 tour_general.3001.d_insanity.flavor:0 "Depende de mim agora!"
 tour_general.3001.d_insanity:0 "Não. Eu preciso enfrentar [ROOT.Char.GetFaith.random_EvilGodNames] por conta própria."
 tour_general.3001.desc_beauty:0 "Assim que ponho os olhos em [tour_general_3001_target_courtier.GetFirstName], perco o fôlego. É como se o próprio [ROOT.Char.GetFaith.HighGodName] tivesse abençoado [tour_general_3001_target_courtier.GetFirstNameNoTooltip] com a beleza de mil [ROOT.Char.Custom('get_region_flower_type_plural')], e o tempo se detém enquanto aprecio seus traços delicados.\n\nTal beleza é desperdiçada com essa plebe vulgar."
 tour_general.3001.desc_diplomacy:0 "As habilidades diplomáticas de [tour_general_3001_target_courtier.GetFirstName] nunca deixam de me surpreender. [tour_general_3001_target_courtier.GetSheHe|U] poderia informar ao [ROOT.Char.GetFaith.ReligiousHeadName] que as roupas de baixo [ROOT.Char.GetFaith.GetReligiousHead.GetHerHim] estão aparecendo, enquanto ainda receberia algumas moedas de ouro, um sorriso e um 'obrigado'."
 tour_general.3001.desc_gluttonous:0 "[tour_general_3001_target_courtier.GetFirstName] realmente parece uma pessoa que sabe o que é bom na vida. Há um leve sentimento de inveja em meu peito ao olhar para a robustez [tour_general_3001_target_courtier.GetHerHim] e o puro prazer que [tour_general_3001_target_courtier.GetSheHe] aparenta encontrar na comida.\n\n[stop_host_scope.GetTitledFirstName] não parava de elogiar a qualidade da culinária de [tour_general_3001_target_courtier.GetFirstNameNoTooltip]."
 tour_general.3001.desc_gluttonous_cannibal:0 "Como sou apreciador de #EMP carnes finas#!, [tour_general_3001_target_courtier.GetFirstName] se destaca verdadeiramente da multidão. O corpo imponente [tour_general_3001_target_courtier.GetHerHim] faz meus joelhos fraquejarem. Minhas mãos tremem ao ver [tour_general_3001_target_courtier.GetSheHe] devorar a comida, pérolas de gordura reluzindo em suas bochechas cheias.\n\n#EMP Tão cheias.#! Eu aperto meu maxilar. Era para ser assim."
 tour_general.3001.desc_insanity_courtier:0 "Há algo intrigante em [tour_general_3001_target_courtier.GetFirstName]. Não consigo identificar exatamente o que é. Mas [tour_general_3001_target_courtier.GetSheHe] tem um ar de mistério e franqueza que raramente se encontra nos dias de hoje.\n\nSinto como se [tour_general_3001_target_courtier.GetSheHe] estivesse olhando para o lugar onde minha alma estaria, se [ROOT.Char.GetFaith.DevilName] não tivesse chegado primeiro.\n\n[tour_general_3001_target_courtier.GetSheHe|U] entende."
 tour_general.3001.desc_intellect:0 "[tour_general_3001_target_courtier.GetFirstName] tem consistentemente me surpreendido com seu intelecto. Um verdadeiro pensador em nossos dias, há tanto potencial em suas habilidades e características. Certamente poderia aproveitá-los ao invés de vê-los murcharem aqui, como uma planta negligenciada sem sol."
 tour_general.3001.desc_intrigue:0 "Eu mal percebi [tour_general_3001_target_courtier.GetFirstName] até [tour_general_3001_target_courtier.GetSheHe] estar bem em cima de mim, prestando os devidos respeitos a [Select_CString( stop_host_scope.IsFemale, 'sua', 'seu' )] [tour_general_3001_target_courtier.Char.Custom2('RelationToMePossessive', stop_host_scope )] [stop_host_scope.Char.Custom2('RelationToMeShort', visiting_liege )]. Agora que percebi, observo [tour_general_3001_target_courtier.GetSheHe] movendo-se com facilidade entre os grupos de pessoas na corte. Seus olhos estão constantemente atentos, olhando para todas as direções e nenhuma direção.\n\nIsso me intriga."
 tour_general.3001.desc_learning:0 "Um indivíduo erudito, os olhos brilhantes de [tour_general_3001_target_courtier.GetFirstName] percorrem o ambiente em busca de um oponente para a afirmação científica que [tour_general_3001_target_courtier.GetSheHe] acabou de expressar. Mas ninguém se levanta para o desafio, para grande desapontamento [tour_general_3001_target_courtier.GetHerHim].\n\nNão é de se admirar, considerando o nível de inteligência em que a discussão teria que ser conduzida. Estou impressionado.\n\nEsse tipo de perspicácia é difícil de encontrar."
 tour_general.3001.desc_martial:0 "A destreza marcial de [tour_general_3001_target_courtier.GetFirstName] é amplamente conhecida na corte [Select_CString( stop_host_scope.IsFemale, 'da', 'do' )] [stop_host_scope.GetTitledFirstName]. Se você quer discutir planos de ataque, a melhor abordagem para afiar suas armas e inteligência, você procura [tour_general_3001_target_courtier.GetSheHe]. É uma habilidade muito procurada e algo que me intriga.\n\n"
 tour_general.3001.desc_negative:0 "[visiting_liege.GetShortUIName] perdeu o interesse no seu cortesão."
 tour_general.3001.desc_outro:0 "Eu simplesmente #EMP preciso#! ter [tour_general_3001_target_courtier.GetSheHe] na minha corte."
 tour_general.3001.desc_physique:0 "Enquanto [tour_general_3001_target_courtier.GetFirstName] se inclina para pegar o objeto no chão do corredor, eu também me inclino para observar os músculos definidos que se movem sob a pele. Essa forma física não pode ser comprada. Mas talvez se eu me cercar de mais indivíduos em forma...\n\n"
 tour_general.3001.desc_prowess:0 "Ágil e movendo-se pela sala como [ROOT.Char.Custom('GetAnimalType')] em busca de presas, [tour_general_3001_target_courtier.GetFirstName] não deixa de impressionar. Sigo seu movimento, uma sinfonia para os olhos, enquanto [tour_general_3001_target_courtier.GetSheHe] desaparece pelo corredor.\n\nTal destreza!"
 tour_general.3001.desc_stewardship:0 "[tour_general_3001_target_courtier.GetFirstName] é uma fonte infinita de conhecimento sobre... bem, riqueza. [tour_general_3001_target_courtier.GetSheHe|U] tem ideias sobre administração que [tour_general_3001_target_courtier.GetSheHe] lamenta não serem possíveis de implementar na corte [Select_CString( stop_host_scope.IsFemale, 'da', 'do' )] [stop_host_scope.GetTitledFirstName].\n\nSeria uma pena ver tanto talento ser desperdiçado."
 tour_general.3001.title:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Aos Olhos do Observador"
 tour_general.3001.tt_negative:0 "[visiting_liege.GetShortUIName] Recusou Sua Proposta"
 tour_general.3001.tt_positive:0 "[visiting_liege.GetShortUIName] Aceitou Sua Proposta"
 tour_general.3002.a:0 "Muito obrigado!"
 tour_general.3002.b:0 "Por que trocar por algo que eu posso #EMP tomar#!?"
 tour_general.3002.b_declined:0 "[tour_general_3001_target_courtier.GetFirstNameNoTooltip] é #EMP meu#!."
 tour_general.3002.c:0 "Um favor? Parece justo."
 tour_general.3002.d:0 "Algumas moedas de ouro? Troca justa."
 tour_general.3002.desc_cannibal:0 "Eu tenho uma ideia ainda melhor. Se você gosta de [tour_general_3001_target_courtier.GetFirstName], você #EMP vai adorar#! isso, [ROOT.Char.Custom('FormOfAddressForLiege')]. É de #EMP morrer#!.\n\n[stop_host_scope.GetSheHe|U] olha na direção de [tour_general_3001_target_courtier.GetFirstName] e depois me encara diretamente, como se estivesse sinalizando algo."
 tour_general.3002.desc_declined:0 "Não posso concordar com esse pedido. [tour_general_3001_target_courtier.GetFirstName] é muito valioso para mim e para a minha corte.'\n\nSeu olhar começa a vagar pelo salão de forma constrangedora."
 tour_general.3002.desc_free:0 "[tour_general_3001_target_courtier.GetFirstName] ficará feliz em se juntar à sua corte mais graciosa.'"
 tour_general.3002.desc_gold:0 "algum ouro pode ajudar a amenizar o impacto, caso percamos querido [tour_general_3001_target_courtier.GetFirstName]."
 tour_general.3002.desc_hook:0 "um favor aqui pode ser retribuído com um favor no futuro... ?'"
 tour_general.3002.e:0 "Pensando melhor..."
 tour_general.3002.f:0 "#EMP Oh meu Deus...#!"
 tour_general.3002.g:0 "Esse comportamento vil deve acabar!"
 tour_general.3002.h.tt.desc:0 "[visiting_liege.GetShortUIName] não está satisfeito com a sua decisão."
 tour_general.3002.h.tt:0 "[visiting_liege.GetShortUIName] está descontente"
 tour_general.3002.h:0 "Isso é lamentável."
 tour_general.3002.intro:0 "[stop_host_scope.GetTitledFirstName] se dirige a mim diretamente.\n\n'[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [stop_host_scope.Custom2('RelationToMeShort', ROOT.Char)], estive contemplando o assunto e cheguei à conclusão de que "
 tour_general.3002.title:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Pedido Concedido"
 tour_general.3002.title_denied:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Pedido Negado"
 tour_general.5000.a:0 "Droga!"
 tour_general.5000.b:0 "Vou tentar de novo!"
 tour_general.5000.desc:0 "Junto os diários, leio minuciosamente o livro de quebra-cabeças e aplico-os na fechadura com movimentos tão precisos quanto meus pensamentos.\n\nFinalmente, acho que consegui e #EMP clank!#! O diário permanece trancado e teimoso como sempre."
 tour_general.5000.title:0 "$journal_events_prefix$ Falha"
 tour_general.5001.a:0 "Maldição!"
 tour_general.5001.b:0 "Vou arrombar essa maldita fechadura!"
 tour_general.5001.desc:0 "Realmente sinto que acertei desta vez. Tudo parece fazer sentido, não há como eu estar errado.\n\nGiro para a esquerda e... #EMP clank!#! O diário permanece trancado e teimoso como sempre."
 tour_general.5001.title:0 "$journal_events_prefix$ Outra Falha"
 tour_general.5010.a:0 "Coisas estranhas podem existir."
 tour_general.5010.b:0 "Os espíritos nos observam."
 tour_general.5010.c:0 "Nossa história é apenas uma mentira."
 tour_general.5010.d:0 "Caem por suas próprias mãos."
 tour_general.5010.desc.intro:0 "Finalmente, as páginas do diário se revelaram para mim, e posso começar a decifrar! A cifra de abertura diz 'Aonde quer que eu vá, a verdade permanece dois passos atrás', e com isso posso decifrar o primeiro quebra-cabeça.\n\n"
 tour_general.5010.desc.outro:0 "\n\nIsso não faz nenhum sentidoo, mas deve ter um significado real."
 tour_general.5010.desc.puzzle.a:0 "\"Uvtcpigvjkpiueqwnfdg.\""
 tour_general.5010.desc.puzzle.b:0 "\"Vjgurktkvuycvejwucnn.\""
 tour_general.5010.desc.puzzle.c:0 "\"Qwtjkuvqtakuqpnacnkg.\""
 tour_general.5010.desc.puzzle.d:0 "\"Hcnnudavjgktqypjcpfu.\""
 tour_general.5010.title:0 "$journal_events_prefix$ Decifrando"
 tour_general.5011.a:0 "Que grotesco!"
 tour_general.5011.desc:0 "Isso mesmo! Seguindo a cifra, consigo entender todo o livro, e parece ser um relato estranho descrevendo a natureza de todos os tipos de grotescos, como os [ROOT.Char.Custom('GetGrotesquePlural')].\n\nConcretamente, descreve sua natureza e onde encontrá-los, sem dúvida um artefato importante se eu algum dia viajar para lugares distantes."
 tour_general.5011.title:0 "$journal_events_prefix$ Grotescos"
 tour_general.5012.a:0 "Fascinante!"
 tour_general.5012.desc:0 "Isso mesmo! Seguindo a cifra, consigo entender todo o livro, e é um livro complexo sobre teologia! Ele descreve [ROOT.Char.GetFaith.PantheonTerm] e apresenta ideias fascinantes sobre a relação entre [ROOT.Char.GetFaith.PositiveAfterLife] e [ROOT.Char.GetFaith.NegativeAfterLife].\n\nEste pode ser o texto teológico mais avançado do mundo [ROOT.Char.GetFaith.GetAdjectiveNoTooltip], e é meu!"
 tour_general.5012.title:0 "$journal_events_prefix$ Teologia Avançada"
 tour_general.5013.a:0 "Incrível!"
 tour_general.5013.desc:0 "Isso mesmo! Seguindo a cifra, consigo entender todo o livro, e ele descreve a história do [ROOT.Char.GetPrimaryTitle.GetName] de uma maneira que nunca ouvi antes!\n\nSe for verdadeiro, este diário ameaça minar nossa compreensão da história e as muitas figuras que ajudaram a construir esse grande [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] como conhecemos!"
 tour_general.5013.title:0 "$journal_events_prefix$ a História Secreta"
 tour_general.5014.a:0 "Incrível!"
 tour_general.5014.desc:0 "Isso mesmo! Seguindo a cifra, consigo entender todo o livro, e ele contém informações sobre técnicas secretas em todos os tipos de cenários de combate. Seja com espada, luta corpo a corpo ou até mesmo montado a cavalo, este diário descreve exatamente como contra-atacar qualquer movimento que um oponente possa fazer.\n\nAo estudar corretamente este diário e praticar suas instruções, tenho a chance de me tornar o maior duelista da história do [ROOT.Char.GetPrimaryTitle.GetName]!"
 tour_general.5014.title:0 "$journal_events_prefix$ Combate"
 tour_general.9998.a:0 "Que pena."
 tour_general.9998.desc:0 "[host.GetName] não virá mais visitar você em sua turnê."
 tour_general.9998.opening:0 "[steward.Custom2('AppropriateGreeting', ROOT.Char)]"
 tour_general.9999.a:0 "Devo cuidar dos preparativos!"
 tour_general.9999.closing:0 "\n\nEspero uma recepção condizente com um [host.GetTitleAsNameNoTooltip|U]."
 tour_general.9999.desc:0 "Estou embarcando em uma turnê e em breve visitaremos [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]"
 tour_general.9999.opening:0 "[host.Custom2('AppropriateGreeting', ROOT.Char)]"
 tour_general.9999.phase_cultural_festival:0 "para desfrutar de um festival local da cultura [ROOT.Char.GetCulture.GetNameNoTooltip]."
 tour_general.9999.phase_dinner:0 "para receber um banquete refinado em sua [ROOT.Char.Custom('FortifiedBuilding')]."
 tour_general.9999.phase_fallback:0 "para ver suas propriedades e ouvir notícias de suas ações."
 tour_general.9999.phase_tour_grounds:0 "para inspecionar sua [ROOT.Char.Custom('FortifiedBuilding')] e terras."
 tour_general.9999.type_intimidation:0 "\n\nÉ hora de lembrar [host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] a quem eles servem e as penalidades por traição."
 tour_general.9999.type_majesty:0 "\n\nÉ hora de [host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] contemplar o esplendor e a graça de [Select_CString( host.IsFemale, 'sua', 'seu' )] [host.GetLadyLord] legítim[Select_CString( host.IsFemale, 'a', 'o' )]."
 tour_general.9999.type_taxation:0 "\n\nOs senhores e senhoras de [host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] pagarão os dízimos devidos a mim."
 tour_general_3001_failed_steal:0 "[stop_host_scope.GetTitledFirstNameNoTooltip] descobre isso"
 tour_general_3001_stolen_courtier:0 "[tour_general_3001_target_courtier.GetFirstNameNoTooltip] junta-se à minha corte sem que ninguém perceba"
 tour_grounds.killed_boar:0 "Eu Abato o Animal"
 tour_grounds.liege_impressed:0 "[visiting_liege.GetName] Ficou Impressionado(a)"
 tour_grounds.liege_insulted:0 "[visiting_liege.GetName] Ficou Insultado(a)"
 tour_grounds.mauled_by_boar:0 "Eu Errei"
 tour_grounds.moment_in_the_woods:0 "Você Deu a [visiting_liege.GetName] um Momento para Lembrar"
 tour_grounds.rebuffed_in_the_woods:0 "[visiting_liege.GetName] Rejeitou Suas Investidas"
 tour_grounds.recruited_my_courtier:0 "[landless_courtier_scope.GetName] Foi [Select_CString( landless_courtier_scope.IsFemale, 'Tentada', 'Tentado' )] a Partir"
 tour_grounds.trampled_child_nemesis:0 "[stop_host_scope.GetNameNoTooltip] Jurou Vingança"
 tour_grounds.vassal_horrified:0 "[stop_host_scope.GetFirstNameNoTooltip] está horrorizado"
 tour_grounds.vassal_impressed:0 "[stop_host_scope.GetFirstNameNoTooltip] está impressionado"
 tour_grounds.vassal_paid_tax:0 "[stop_host_scope.GetName] Pagou o Imposto"
 tour_grounds.vassal_refused_to_pay_tax:0 "[stop_host_scope.GetName] Recusou o Imposto"
 tour_grounds.vassal_won_tax_duel:0 "[stop_host_scope.GetName] Evitou o Imposto"
 tour_grounds_1002.assassination_was_fake:0 "O Assassinato Foi Falso"
 tour_grounds_1002.liege_begrudgingly_played_along:0 "[visiting_liege.GetName] Não Ficou Divertido"
 tour_grounds_1002.liege_believed_it_was_real:0 "[visiting_liege.GetName] Acreditou que o Assassinato Foi Real"
 tour_grounds_1002.liege_played_along:0 "[visiting_liege.GetName] Ficou Muito Divertido"
 tour_grounds_1002_dislikes_tt:0 "Se [visiting_liege.GetName] não gosta disso"
 tour_grounds_1002_likes_tt:0 "Se [visiting_liege.GetName] gosta disso"
 tour_grounds_1002_murder_tt:0 "Se [visiting_liege.GetName] acredita que é real"
 tour_grounds_3011.vassal_did_not_pay:0 "Comprei um Novo Cavalo"
 tour_grounds_3011.vassal_paid_for_new_horse:0 "[stop_host_scope.GetNameNoTooltip] Ofereceu-se para Comprar um Novo Cavalo"
 tour_grounds_begins_tt:0 "Iniciar a atividade Tour pelos Jardins"
 tour_grounds_events.1001.a:0 "Eu nunca erro!"
 tour_grounds_events.1001.b:0 "Talvez algo mais impressione [visiting_liege.GetSheHe]..."
 tour_grounds_events.1001.desc.intro:0 "Com [visiting_liege.GetName] ainda percorrendo os terrenos da minha casa, tenho muitas oportunidades à minha frente para impressionar."
 tour_grounds_events.1001.desc.mid:0 "\n\nUma dessas oportunidades seria mostrar os terrenos de caça de [touring_grounds_scope.GetNameNoTooltip] e talvez impressionar meu senhor feudal com minhas habilidades de caça!"
 tour_grounds_events.1001.desc.outro:0 "Um triunfo no campo da caça certamente solidificaria meu status como um digno [ROOT.Char.GetTitleAsNameNoTooltip] do reino, mas igualmente um fracasso seria uma grande vergonha."
 tour_grounds_events.1001.title:0 "Habilidade de Caça"
 tour_grounds_events.1002.a:0 "Faça os preparativos!"
 tour_grounds_events.1002.b:0 "Vamos deixar pra lá."
 tour_grounds_events.1002.desc:0 "Observando [Select_CString( visiting_liege.IsFemale, 'minha', 'meu' )] [visiting_liege.GetTitleAsNameNoTooltip|U] percorrer os terrenos de [touring_grounds_scope.GetNameNoTooltip], uma ideia para uma brincadeira travessa cruza minha mente. Como se possuído pelo espírito do próprio [ROOT.Char.GetFaith.TricksterGodName], eu imagino uma tentativa de assassinato encenada para entreter meus convidados!\n\n[visiting_liege.GetNameNoTooltip] será colocado como o herói da história, frustrando a tentativa no grupo e fazendo com que o \"assassino\" fuja! Uma bela paródia dos inimigos do [visiting_liege.GetPrimaryTitle.GetNameNoTooltip], [visiting_liege.GetNameNoTooltip] certamente ficará lisonjeado e entretido com isso!"
 tour_grounds_events.1002.title:0 "Uma Trama"
 tour_grounds_events.1003.a.paranoid:0 "$murder_outcome.5001.not_my_time$"
 tour_grounds_events.1003.a:0 "Encare isso, [fake_assassin_scope.Custom2('InsultNoun', ROOT.Char)]!"
 tour_grounds_events.1003.b:0 "Eu não sou um trovador! Saiam de cima de mim!"
 tour_grounds_events.1003.c:0 "Eles não vão me levar sem luta!"
 tour_grounds_events.1003.desc.intro:0 "Enquanto continuo meu passeio pelos terrenos de [touring_grounds_scope.GetNameNoTooltip], ouço vozes desconhecidas ao nosso redor. De repente, encontro meu grupo inteiro cercado por [fake_assassin_scope.GetWomenMen] com capuzes apontando facas e arcos diretamente para mim!\n\nUm dos assassinos se aproxima de mim e pressiona sua faca firmemente ao meu lado. \"Boa caçada, [ROOT.Char.Custom('FormOfAddressForLiege')]? Viemos caçar [ROOT.Char.GetTitleAsNameNoTooltip]s!\""
 tour_grounds_events.1003.desc.not_paranoid:0 "\n\nEmbora inicialmente assustado, rapidamente fica claro que tudo isso é apenas uma encenação. O \"assassino\" pisca para mim e observo que sua arma é feita inteiramente de madeira e sem fio em todos os lados. Eles esperam que eu participe da brincadeira e frustre a tentativa contra minha vida."
 tour_grounds_events.1003.desc.paranoid:0 "\n\nSinto meu coração acelerar e um suor frio percorrer todo o meu corpo enquanto permaneço paralisado. O assassino me dá uma espécie de piscada e faz um gesto com sua arma, se vangloriando de sua vitória. Minha própria vida está em jogo com meu próximo movimento, o que devo fazer?"
 tour_grounds_events.1003.title:0 "$murder_outcome.5001.t$"
 tour_grounds_events.1004.a:0 "Me possua agora!"
 tour_grounds_events.1004.b:0 "Deixe isso pra lá."
 tour_grounds_events.1004.desc.already_shagging:0 "\n\nEmbora nossos corações e desejos já pertençam um ao outro, ser governantes nos dá muito pouco tempo para perseguir nossa paixão, mas agora temos uma oportunidade de ser como feras na selva."
 tour_grounds_events.1004.desc.intro:0 "Por um momento, me encontro sozinho nos terrenos de caça selvagem de [touring_grounds_scope.GetNameNoTooltip] com [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)]. Um momento tão raro me permitiria seguir minha paixão por [visiting_liege.GetSheHe]."
 tour_grounds_events.1004.desc.outro:0 "\n\nA vida é feita de momentos, e de vez em quando temos raridades como essas. Posso agir sobre esses sentimentos?"
 tour_grounds_events.1004.desc.trying_to_shag:0 "\n\nTalvez esta seja finalmente minha oportunidade de expressar meus sentimentos, e se [visiting_liege.GetSheHe] sentir o mesmo, poderíamos finalmente ser mais do que apenas '[visiting_liege.GetTitleAsNameNoTooltip]' e '[ROOT.Char.GetTitleAsNameNoTooltip]', mas amantes nos momentos de paixão."
 tour_grounds_events.1004.title:0 "Um Momento nas Selvas"
 tour_grounds_events.1005.a:0 "Me possua!"
 tour_grounds_events.1005.b:0 "Afasta-se de mim, [stop_host_scope.Custom2('InsultNoun', ROOT.Char)] [Select_CString( stop_host_scope.IsFemale, 'lasciva', 'lascivo' )]!"
 tour_grounds_events.1005.desc.already_shagging:0 "De repente, vejo [stop_host_scope.GetNameNoTooltip] se jogando em mim como [stop_host_scope.Custom('GetAnimalType')] selvagem, me prendendo contra uma pedra com fogo em seus olhos.\n\n\"É tão raro eu te ver sozinho, [Select_CString( LoverPetName.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom('LoverPetName')], e aqui estamos nós sozinhos, apenas pássaros e feras como testemunhas. Vamos finalmente abraçar nossa paixão um pelo outro!\""
 tour_grounds_events.1005.desc.intro:0 "Me encontro sozinho nos terrenos de caça de [touring_grounds_scope.GetNameNoTooltip] com [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)], desfrutando do silêncio relativo interrompido apenas pelo chamado ocasional de uma fera próxima."
 tour_grounds_events.1005.desc.outro:0 "\n\nEstou pasmo, encarando os olhos sedentos do [Select_CString( stop_host_scope.IsFemale, 'minha', 'meu' )] [stop_host_scope.GetTitleAsNameNoTooltip]. Seria realmente adequado para um(a) [ROOT.Char.GetTitleAsNameNoTooltip] em turnê ter um momento de paixão em um lugar como este?"
 tour_grounds_events.1005.desc.trying_to_shag:0 "Vejo [stop_host_scope.GetNameNoTooltip] me observando como [stop_host_scope.Custom('GetAnimalType')] prestes a pular em sua próxima refeição.\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|U], devo dizer que você está mais [Select_CString( ROOT.Char.IsFemale, 'divina', 'divino' )] do que qualquer criatura que já vi nessas [touring_grounds_scope.Custom('TerrainTypeProvince')].\" [stop_host_scope.GetNameNoTooltip] se aproxima de mim com aquele olhar predatório em seus olhos, e sinto minha abstinência se dissolver."
 tour_grounds_events.1005.title:0 "$tour_grounds_events.1004.title$"
 tour_grounds_events.1006.a:0 "Silêncio, seu(a) [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] [stop_host_scope.Custom2('InsultNoun', ROOT.Char)]."
 tour_grounds_events.1006.b:0 "Ignore e siga em frente."
 tour_grounds_events.1006.desc.intro:0 "Durante a turnê de [touring_grounds_scope.GetNameNoTooltip], estou [Select_CString( ROOT.Char.IsFemale, 'envolvida', 'envolvido' )] em uma conversa com [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] sobre"
 tour_grounds_events.1006.desc.mid.diplomacy:0 "a arte sutil da diplomacia e apaziguamento,"
 tour_grounds_events.1006.desc.mid.intrigue:0 "a importância da informação e da decepção,"
 tour_grounds_events.1006.desc.mid.learning:0 "o plano divino de [ROOT.Char.GetFaith.HighGodName] para a humanidade,"
 tour_grounds_events.1006.desc.mid.martial:0 "a glória da guerra e do conflito,"
 tour_grounds_events.1006.desc.mid.stewardship:0 "as complexidades do governo e contabilidade do estado,"
 tour_grounds_events.1006.desc.outro:0 "quando sou [Select_CString( ROOT.Char.IsFemale, 'interrompida', 'interrompido' )] por [landless_courtier_scope.Custom2('MyCharacterIntroduction', ROOT.Char)], que parece acreditar que [landless_courtier_scope.GetSheHe] sabe mais sobre o assunto do que eu.\n\nIndependentemente disso, é altamente inapropriado que um mero cortesão interrompa uma conversa entre [Select_CString( visiting_liege.IsFemale, 'a', 'o' )] [visiting_liege.GetTitleAsNameNoTooltip|U] do [visiting_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] e seu [ROOT.Char.GetTitleAsNameNoTooltip|U]."
 tour_grounds_events.1006.title:0 "Fora de Ordem"
 tour_grounds_events.1007.a:0 "Junte-se à minha corte!"
 tour_grounds_events.1007.b:0 "Nunca se deve falar fora de hora."
 tour_grounds_events.1007.c:0 "Isso é um crime inequívoco!"
 tour_grounds_events.1007.desc.intro:0 "Durante a turnê de [touring_grounds_scope.GetNameNoTooltip], estou [Select_CString( ROOT.Char.IsFemale, 'envolvida', 'envolvido' )] em uma conversa com [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] sobre"
 tour_grounds_events.1007.desc.outro:0 "quando [stop_host_scope.GetSheHe] é [Select_CString( stop_host_scope.IsFemale, 'interrompida', 'interrompido' )] por um dos cortesãos [stop_host_scope.GetHerHim].\n\n[Select_CString( landless_courtier_scope.IsFemale, 'A', 'O' )] [landless_courtier_scope.GetWomanMan] não pode falar por muito tempo antes de ser silenciada por seu senhor, mas a sabedoria que [landless_courtier_scope.GetSheHe] é capaz de transmitir imediatamente prova que [landless_courtier_scope.GetSheHe] sabe muito mais sobre o assunto do que [stop_host_scope.GetNameNoTooltip] jamais poderia imaginar.\n\nSe [Select_CString( stop_host_scope.IsFemale, 'a', 'o' )] [stop_host_scope.GetTitledFirstNameNoTooltip] não está [Select_CString( stop_host_scope.IsFemale, 'disposta', 'disposto' )] a ouvir as ideias [landless_courtier_scope.GetHerHim], talvez [landless_courtier_scope.GetSheHe] esteja [Select_CString( landless_courtier_scope.IsFemale, 'disposta', 'disposto' )] a se juntar à minha corte."
 tour_grounds_events.1008.a:0 "E então, o que acontece?"
 tour_grounds_events.1008.b:0 "Silêncio, [storyteller_scope.GetFirstNameNoTooltip]!"
 tour_grounds_events.1008.desc.intro:0 "Enquanto descansamos da nossa turnê, meu jovem senhor feudal continua cheio de energia e exige entretenimento enquanto o resto da procissão recupera suas energias.\n\nFelizmente, [storyteller_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] assume entusiasticamente a tarefa e começa a contar lendas locais. 'Ah, há muito mais nessas [touring_grounds_scope.Custom('TerrainTypeProvince')] do que os olhos podem ver, [visiting_liege.Custom('GetLassLad')].'"
 tour_grounds_events.1008.desc.mid.ankou:0 "O próprio Ankou perambula por estas partes em sua carruagem dos mortos, coletando almas perdidas e levando-as para onde somente [ROOT.Char.GetFaith.HighGodName] sabe. Esteja atento(a), [visiting_liege.Custom('GetLassLad')], ou ele também te levará."
 tour_grounds_events.1008.desc.mid.azdaha:0 "Um terrível e assustador Azhdaha escava logo abaixo de nossos pés, esperando. Quando ele avistar sua chance, ele irá emergir do chão com seus terríveis e horríveis dentes e te engolir por inteiro!"
 tour_grounds_events.1008.desc.mid.baba_yaga:0 "A horripilante bruxa, Baba Yaga, faz sua magia por estas partes. Esteja atento(a) a cabanas que não parecem pertencer aqui, para que ela não devore sua carne e decore com seus ossos."
 tour_grounds_events.1008.desc.mid.banshee:0 "Uma terrível banshee uiva nas terras selvagens de [touring_grounds_scope.GetNameNoTooltip], e cuidado: se você ouvir seu chamado, alguém próximo a você está destinado(a) a encontrar seu fim."
 tour_grounds_events.1008.desc.mid.ghul:0 "Um monstro ghoul perambula pelos locais de sepultamento de [touring_grounds_scope.GetNameNoTooltip], devorando carne humana, e se ele avistar você, pode decidir que [visiting_liege.GetTitleAsNameNoTooltip|U] está no cardápio!"
 tour_grounds_events.1008.desc.mid.sasabonsam:0 "O temido Sasabonsam vive por estas partes, provavelmente nos observando agora enquanto falamos, à espreita. Descuide-se e ele descerá dos céus e drenará seu sangue com seus terríveis dentes de ferro até que você fique tão rosado(a) e ensanguentado(a) quanto ele!"
 tour_grounds_events.1008.desc.mid.witt_wieven:0 "As mulheres brancas vivem entre nós aqui, procurando por [Select_CString( visiting_liege.IsFemale, 'outra', 'outro' )] [visiting_liege.GetLadyLord] como você para te desencaminhar. Fantasmas de bruxas há muito falecidas, elas te levarão e farão o trabalho de [ROOT.Char.GetFaith.DevilName] em você."
 tour_grounds_events.1008.desc.mid:0 "Há muitas coisas terríveis vagando por estas partes, coisas que não são naturais. Monstros maiores do que qualquer mera fera que adorariam nada mais do que adicionar um pouco de [visiting_liege.GetTitleAsNameNoTooltip|U] à sua dieta."
 tour_grounds_events.1008.desc.outro:0 "\n\nAs questionáveis histórias de [storyteller_scope.GetFirstNameNoTooltip] estão claramente causando um impacto em [visiting_liege.GetFirstNameNoTooltip], talvez eu deva intervir."
 tour_grounds_events.1008.title:0 "Histórias de Fantasmas"
 tour_grounds_events.1009.a:0 "Que ótima história!"
 tour_grounds_events.1009.b:0 "Isso foi horrível."
 tour_grounds_events.1009.c:0 "Você parou na melhor parte!"
 tour_grounds_events.1009.d:0 "Graças a Deus que você parou."
 tour_grounds_events.1009.desc.intro:0 "Os membros mais velhos da nossa procissão param para descansar da turnê, mas eu permaneço cheio(a) de vigor e estou rapidamente ficando impaciente com esses velhotes preguiçosos.\n\nFelizmente, [storyteller_scope.GetName] parece ansioso(a) para me entreter com histórias assustadoras deste lugar. 'Ah, há muito mais nessas [touring_grounds_scope.Custom('TerrainTypeProvince')] do que os olhos podem ver, [visiting_liege.Custom('GetLassLad')].'"
 tour_grounds_events.1009.desc.mid.finished:0 "\n\n[stop_host_scope.GetName] logo se junta à contação de histórias, e sou capturado(a) pelos dois em histórias que me deixam mais do que apenas um pouco aterrorizado(a)."
 tour_grounds_events.1009.desc.outro.interrupted:0 "\n\nJusto quando a história está ficando interessante, [stop_host_scope.GetName] interrompe e insiste que [storyteller_scope.GetSheHe] não vá adiante, e assegura-me que toda a história não passa de bobagem."
 tour_grounds_events.1009.title:0 "$tour_grounds_events.1008.title$"
 tour_grounds_events.1010.a:0 "Vamos fazer isso!"
 tour_grounds_events.1010.b:0 "Os riscos são muito grandes."
 tour_grounds_events.1010.desc:0 "Cavalgando pelos terrenos em nossas respectivas montarias o dia todo, sou subitamente atingido(a) por uma ideia inspirada!\n\nTodos conhecem a rivalidade entre [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] e [rival_courtier.GetName], e certamente isso me renderia a gratidão [Select_CString( visiting_liege.IsFemale, 'da minha', 'do meu' )] [visiting_liege.GetTitleAsNameNoTooltip] se eu capturasse o rival(a) [visiting_liege.GetHerHim] e o fizesse ser selado(a) e cavalgado(a) como um cavalo!\n\nO único desafio, é claro, seria trazer [rival_courtier.GetSheHe] aqui, mas eu tenho meus métodos..."
 tour_grounds_events.1010.title:0 "[rival_courtier.GetFirstNameNoTooltip]: O Corcel Leal"
 tour_grounds_events.1011.a:0 "Claro que sim!"
 tour_grounds_events.1011.b:0 "Até [rival_courtier.GetFirstNameNoTooltip] não merece essa humilhação."
 tour_grounds_events.1011.desc:0 "Cavalgando pelos terrenos de [touring_grounds_scope.GetNameNoTooltip], sou subitamente interrompido(a) no meio da estrada pelo meu anfitrião, [stop_host_scope.GetName].\n\nParece que [stop_host_scope.GetSheHe] conseguiu capturar [rival_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] e [rival_courtier.GetSheHe] está selado(a) como um cavalo, pronto(a) para que eu monte e cavalgue pelo campo!\n\nEmbora seja uma excelente oportunidade para mostrar minha superioridade inata, será que eu realmente vou me rebaixar tanto?"
 tour_grounds_events.1011.title:0 "$tour_grounds_events.1010.title$"
 tour_grounds_events.1012.a:0 "E eu pensei que o presente perfeito não existisse."
 tour_grounds_events.1012.b:0 "Descarte silenciosamente o [ROOT.Char.Custom('get_region_root_vegetable')]."
 tour_grounds_events.1012.c:0 "Isso deve valer uma fortuna!"
 tour_grounds_events.1012.d:0 "Guarde para uso pessoal."
 tour_grounds_events.1012.desc:0 "Nosso humilde lar carece das comodidades e grandiosidade com as quais [visiting_liege.GetName] está acostumado(a), mas o que nos falta em extravagância, mais do que compensamos em acomodação e generosidade.\n\nEu estava preocupado(a) por ter que guiar [Select_CString( visiting_liege.IsFemale, 'minha', 'meu' )] [visiting_liege.GetTitleAsNameNoTooltip] sem um presente, mas de repente avisto uma [ROOT.Char.Custom('get_region_root_vegetable')] próspera que milagrosamente se parece exatamente com [visiting_liege.GetNameNoTooltip]! [visiting_liege.GetSheHe|U] certamente se lembraria para sempre da visita a [touring_grounds_scope.GetNameNoTooltip] se [visiting_liege.GetSheHe] se separasse de seu sósia de [ROOT.Char.Custom('get_region_root_vegetable')]. Embora, [visiting_liege.GetSheHe] possa facilmente se ofender por eu compará-lo(a) a um(a) [ROOT.Char.Custom('get_region_root_vegetable')]."
 tour_grounds_events.1012.title:0 "Um [visiting_liege.GetTitleAsNameNoTooltip|U]-como [stop_host_scope.Custom('get_region_root_vegetable')|U]"
 tour_grounds_events.1013.a:0 "Que objeto maravilhoso!"
 tour_grounds_events.1013.b:0 "Nojento. Livre-se disso."
 tour_grounds_events.1013.desc:0 "[touring_grounds_scope.GetNameNoTooltip] está longe do que eu consideraria uma região civilizada. Poucas pessoas chamam este lugar de lar e as comodidades deixam muito a desejar.\n\nHoje, o [stop_host_scope.GetTitleAsNameNoTooltip] pensou em me impressionar ao me apresentar um simples [stop_host_scope.Custom('get_region_root_vegetable')] que [stop_host_scope.GetSheHe] afirma se parecer comigo.\n\nNo início, reviro os olhos, mas logo começo a ver alguma semelhança..."
 tour_grounds_events.1013.title:0 "$tour_grounds_events.1012.title$"
 tour_grounds_events.1014.a:0 "Tenho certeza de que [visiting_liege.GetSheHe] vai adorar!"
 tour_grounds_events.1014.b:0 "Que desperdício de tempo."
 tour_grounds_events.1014.desc:0 "[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] parece interessado(a) em caçar pelos terrenos de [touring_grounds_scope.GetNameNoTooltip], procurando por presas e glória como um(a) adulto(a).\n\nNo entanto, eu não posso, com boa consciência, permitir que [Select_CString( visiting_liege.IsFemale, 'uma', 'um' )] [visiting_liege.Custom('GirlBoy')] tão jovem vagueie por onde [visiting_liege.GetSheHe] possa ser atacado pelo(a) [ROOT.Char.Custom('GetAnimalType')].\n\nNo entanto, eu poderia agradar [Select_CString( visiting_liege.IsFemale, 'a pequena', 'o pequeno' )] [visiting_liege.GetLadyLord] montando uma caçada falsa sem o perigo de animais reais."
 tour_grounds_events.1014.title:0 "[visiting_liege.GetNameNoTooltip]: O Pequeno Caçador"
 tour_grounds_events.1015.a:0 "Vou abater a fera!"
 tour_grounds_events.1015.b:0 "Isso é algum tipo de piada?"
 tour_grounds_events.1015.c:0 "Exija o(a) [stop_host_scope.Custom('GetAnimalType')] verdadeiro para abater."
 tour_grounds_events.1015.desc:0 "Tenho desejado explorar a natureza e capturar uma presa fresca, como um(a) [ROOT.Char.GetTitleAsNameNoTooltip] deveria, mas até agora tenho sido impedido(a) pelos meus anciãos e guardiões.\n\nNo entanto, hoje fui abordado(a) por [stop_host_scope.GetName] e me foi oferecida a oportunidade de testar os terrenos de [touring_grounds_scope.GetNameNoTooltip] como um(a) verdadeiro(a) caçador(a)!\n\nQuando chego aos terrenos de caça, porém, não sou recebido pelo(a) [stop_host_scope.Custom('GetAnimalType')] feroz, mas por um pedaço de madeira pintado para se parecer com um(a) [stop_host_scope.Custom('GetAnimalType')]."
 tour_grounds_events.1015.title:0 "Uma Caçada Falsa"
 tour_grounds_events.1016.a:0 "Minha mira é certeira!"
 tour_grounds_events.1016.desc:0 "Minhas exigências são atendidas e logo sou recebido(a) por uma verdadeira fera para abater. Sob o meu comando, a fera é solta de suas amarras e eu fico sozinho(a) para enfrentar o monstro com meu arco.\n\nRespiro fundo e disparo, rezando para que minha flecha acerte o alvo."
 tour_grounds_events.1016.title:0 "A Verdadeira Caçada"
 tour_grounds_events.1017.a:0 "Eu irei ouvir."
 tour_grounds_events.1017.desc.outro:0 "quando [stop_host_scope.GetSheHe] é [Select_CString( stop_host_scope.IsFemale, 'interrompida', 'interrompido' )] por um dos cortesãos [stop_host_scope.GetHerHim].\n\nEmbora [Select_CString( landless_courtier_scope.IsFemale, 'a', 'o' )] humilde cortesão tenha falado completamente fora de hora, [stop_host_scope.GetNameNoTooltip] estranhamente não repreendeu [landless_courtier_scope.GetSheHe] e permitiu que [landless_courtier_scope.GetSheHe] falasse diretamente comigo.\n\nEmbora o que [landless_courtier_scope.GetSheHe] tem a dizer seja bastante interessante, essa quebra de etiqueta social me pegou de surpresa."
 tour_grounds_events.3001.a:0 "Vamos começar!"
 tour_grounds_events.3001.desc.intro:0 "Minha chegada à [stop_host_scope.Custom('FortifiedBuilding')] [Select_CString( stop_host_scope.IsFemale, 'da', 'do' )] [stop_host_scope.GetTitledFirstName] em [touring_grounds_scope.GetProvince.GetName] é marcada por festividades dignas do [ROOT.Char.GetTitleAsNameNoTooltip] do reino,"
 tour_grounds_events.3001.desc.mid.close_family:0 "Eu e [Select_CString( stop_host_scope.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', stop_host_scope)] nos abraçamos, cuidando de manter a formalidade do momento."
 tour_grounds_events.3001.desc.mid.default:0 "[Select_CString( stop_host_scope.IsFemale, 'Minha vassala', 'Meu vassalo' )] me recebe obedientemente com toda a deferência necessária."
 tour_grounds_events.3001.desc.mid.friend:0 "Embora tenhamos que suportar formalidades, visitar um bom amigo sempre é um alívio bem-vindo."
 tour_grounds_events.3001.desc.mid.hates_vassal:0 "Compartilhar os aposentos dest[Select_CString( stop_host_scope.IsFemale, 'a', 'e' )] [visiting_liege.Custom2('InsultNoun', ROOT.Char)] [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] é uma necessidade repugnante; espero que isso acabe rapidamente."
 tour_grounds_events.3001.desc.mid.house:0 "Uma oportunidade de ver [Select_CString( stop_host_scope.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', stop_host_scope)], e se a situação [stop_host_scope.GetHerHim] está à altura da nobreza da Casa [ROOT.Char.GetHouse.GetBaseName]."
 tour_grounds_events.3001.desc.mid.lover:0 "Dói-me ter que lidar com formalidades públicas com a minha amada — se ao menos houvesse tempo para nos encontrarmos a sós..."
 tour_grounds_events.3001.desc.mid.powerful_vassal:0 "Dou o devido reconhecimento à importância [stop_host_scope.GetHerHim] entre os vassalos [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip], até certo ponto..."
 tour_grounds_events.3001.desc.mid:0 "\n\n[stop_host_scope.GetFirstNameNoTooltip] descreve o tour planejado e me assegura que [stop_host_scope.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] é uma terra tão bela e magnífica que apenas contemplar suas cidades e campos será um entretenimento suficiente."
 tour_grounds_events.3001.desc.outro:0 "\n\nSó o tempo dirá."
 tour_grounds_events.3001.desc.type.intimidation:0 "enquanto a disciplina rigorosa dos meus muitos guardas causa alguma hesitação nos meus súditos.\n\n"
 tour_grounds_events.3001.desc.type.majesty:0 "e os habitantes claramente se impressionam com a grandiosidade e pompa do meu séquito.\n\n"
 tour_grounds_events.3001.desc.type.taxation:0 "e a presença da minha carroça de tesouro e dos coletores de impostos rapidamente é notada.\n\n"
 tour_grounds_events.3001.title:0 "Explorando os Terrenos de [stop_host_scope.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 tour_grounds_events.3002.a:0 "Eu sou o(a) melhor caçador(a)!"
 tour_grounds_events.3002.b:0 "Parabéns, [stop_host_scope.GetNameNoTooltip]."
 tour_grounds_events.3002.desc.intro:0 "Enquanto continuo explorando os terrenos de [touring_grounds_scope.GetNameNoTooltip], meu anfitrião decide mostrar sua habilidade de caça. Com a atenção de todos voltada para [stop_host_scope.GetSheHe],"
 tour_grounds_events.3002.desc.mid.crit:0 "[stop_host_scope.GetNameNoTooltip] perfura o crânio do(a) [stop_host_scope.Custom('GetAnimalType')] distante com um único tiro.\n\nEmbora todos pareçam impressionados, isso pode ser"
 tour_grounds_events.3002.desc.mid.fail:0 "[stop_host_scope.GetNameNoTooltip] nem sequer arranha o alvo, para diversão de minha comitiva.\n\nEnquanto todos riem, eu vejo"
 tour_grounds_events.3002.desc.mid.succ:0 "[stop_host_scope.GetNameNoTooltip] mata o(a) [stop_host_scope.Custom('GetAnimalType')] próximo(a) com o que parece ser pouco esforço.\n\nEmbora todos pareçam impressionados, isso pode ser"
 tour_grounds_events.3002.desc.outro:0 "uma oportunidade de superar meu anfitrião e mostrar a todos como um(a) [ROOT.Char.GetTitleAsNameNoTooltip] dispara uma flecha!"
 tour_grounds_events.3002.title:0 "Habilidade de Caça"
 tour_grounds_events.3003.a:0 "Isso deve ser fácil."
 tour_grounds_events.3003.b:0 "Vamos deixar outra pessoa fazer o tiro."
 tour_grounds_events.3003.desc.intro:0 "Com meu arco de caça ao lado, um membro do meu grupo me alerta sobre a presença do(a) [stop_host_scope.Custom('GetAnimalType')] logo abaixo de um barranco próximo à nossa localização. Ficando à beira do penhasco, devo ser capaz de acertar seu coração.\n\n"
 tour_grounds_events.3003.desc.mid.high_skill:0 "Para um(a) caçador(a) habilidoso(a) como eu, isso deveria ser fácil, mas não sem riscos."
 tour_grounds_events.3003.desc.mid.low_skill:0 "Parece ser um tiro difícil, mas se eu acertar, sem dúvida impressionarei toda a minha comitiva."
 tour_grounds_events.3003.desc.outro:0 "O solo parece um pouco instável, mas com cuidado ao pisar, devo ser capaz de abater a fera sem problemas."
 tour_grounds_events.3003.title:0 "Presas Precárias"
 tour_grounds_events.3004.a:0 "Excelente tiro, [Select_CString( visiting_liege.IsFemale, 'minha', 'meu' )] [visiting_liege.GetTitleAsNameNoTooltip]."
 tour_grounds_events.3004.b:0 "Eu deveria estar impressionado(a)?"
 tour_grounds_events.3004.desc.intro:0 "Enquanto explorava os terrenos, [visiting_liege.GetName] arriscou um tiro de cima de um penhasco no(a) [stop_host_scope.Custom('GetAnimalType')] próximo."
 tour_grounds_events.3004.desc:0 "Embora tenha parecido que [visiting_liege.GetSheHe] poderia cair por um momento, [visiting_liege.GetSheHe] rapidamente encontrou o equilíbrio e abateu a fera, derrubando-a imediatamente.\n\nTodos na comitiva parecem encantados e impressionados com a habilidade de caça de [visiting_liege.GetTitleAsNameNoTooltip]. [visiting_liege.GetSheHe|U] se aproxima de mim, com sangue pingando da presa fresca, esperando algum tipo de parabéns."
 tour_grounds_events.3004.title:0 "[Select_CString( visiting_liege.IsFemale, 'Minha', 'Meu' )] [visiting_liege.GetTitleAsNameNoTooltip]"
 tour_grounds_events.3005.a.bad:0 "Que [stop_host_scope.Custom2('InsultNoun', ROOT.Char)] petulante."
 tour_grounds_events.3005.a:0 "Excelente."
 tour_grounds_events.3005.desc.intro:0 "Meu equilíbrio se mantém e minha mira ainda mais certeira, quando abato a fera com uma única flecha sem nem mesmo tropeçar no precipício perigoso. A equipe de caça parece impressionada, os terrenos cheios de aplausos dos meus companheiros.\n\n"
 tour_grounds_events.3005.desc.mid.congrats:0 "Meu anfitrião, [stop_host_scope.GetName], vem pessoalmente me parabenizar pela minha caçada. Com esse assunto concluído, junto minha presa com as demais e continuo meu tour pelos terrenos."
 tour_grounds_events.3005.desc.mid.insult:0 "No entanto, meu anfitrião, [stop_host_scope.GetName], parece um pouco menos impressionado. Seu rosto cheio de desprezo e inveja, [stop_host_scope.GetSheHe] afirma que meu tiro foi totalmente desinteressante."
 tour_grounds_events.3005.title:0 "Um Risco Recompensado"
 tour_grounds_events.3006.a:0 "Eu devo proteger [Select_CString( visiting_liege.IsFemale, 'minha', 'meu' )] [visiting_liege.GetTitleAsNameNoTooltip|U]!"
 tour_grounds_events.3006.b:0 "Deixe [visiting_liege.GetSheHe] cair."
 tour_grounds_events.3006.c:0 "Empurre [visiting_liege.GetSheHe] para o lado e faça o tiro eu mesmo!"
 tour_grounds_events.3006.desc:0 "Por um momento, parecia que [visiting_liege.GetSheHe] poderia realmente acertar o alvo, mas à medida que [visiting_liege.GetSheHe] começa a perder o equilíbrio, fica claro que lesão e constrangimento estão prestes a acontecer.\n\nEu poderia, é claro, me jogar para salvar meu senhor feudal, mas isso me colocaria em risco de lesões."
 tour_grounds_events.3006.title:0 "Um(a) [visiting_liege.GetTitleAsNameNoTooltip] Vacilante"
 tour_grounds_events.3007.a:0 "Acho que já fiz o suficiente por hoje."
 tour_grounds_events.3007.desc.intro:0 "Infelizmente, meu equilíbrio não parece ser suficiente e sinto meu corpo deixar a terra, à mercê da criação de [ROOT.Char.GetFaith.CreatorName].\n\n"
 tour_grounds_events.3007.desc.mid.fell:0 "Giro no meio do voo e vejo [stop_host_scope.GetName] apenas observando passivamente a queda de seu [ROOT.Char.GetTitleAsNameNoTooltip]. Enquanto meu corpo se reencontra com o chão, sinto minha pele se rasgar e meu sangue divino derramar-se sobre o solo."
 tour_grounds_events.3007.desc.mid.protected:0 "No entanto, sou rapidamente agarrado por [stop_host_scope.GetName] e puxado de volta aos meus pés, meu salvador caindo de rosto em seu valente esforço."
 tour_grounds_events.3007.desc.mid.took_the_shot:0 "Giro no meio do voo e vejo [stop_host_scope.GetName] assumindo meu lugar e, não apenas fazendo nada para me salvar, mas assumindo o  próprio tiro! Enquanto meu corpo cai com um estrondo no chão, ouço aplausos. Claramente, [stop_host_scope.GetNameNoTooltip] teve sucesso onde falhei, e sou deixad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a me contorcer em agonia e constrangimento."
 tour_grounds_events.3007.title:0 "$tour_grounds_events.3006.title$"
 tour_grounds_events.3008.a:0 "Tente evitá-los."
 tour_grounds_events.3008.b:0 "Nada pode ficar no caminho do meu passeio."
 tour_grounds_events.3008.desc:0 "Cavalo pelos terrenos de [touring_grounds_scope.GetNameNoTooltip], mal tendo um pensamento em minha mente satisfeita.\n\nDe repente, sou trazido(a) de volta à realidade quando uma criança corre à frente de meu corcel, com os braços agitados em reverência ao ver seu [ROOT.Char.GetTitleAsNameNoTooltip]. Sua aparição é tão repentina que mal tenho tempo para reagir ou mesmo processar se é uma criança que conheço. Com as mãos suadas nas rédeas, devo reagir!"
 tour_grounds_events.3008.title:0 "Um Incidente a Cavalo"
 tour_grounds_events.3009.a.callous:0 "Nada a ver comigo."
 tour_grounds_events.3009.a:0 "Que vil!"
 tour_grounds_events.3009.b:0 "[visiting_liege.GetNameNoTooltip] é um monstro."
 tour_grounds_events.3009.desc.intro:0 "É mais um dia da visita de [visiting_liege.GetName], e embora as coisas tenham começado bem, uma criança não supervisionada, [trampled_child_scope.GetName], correu à frente do cavalo de [visiting_liege.GetFirstNameNoTooltip] e foi prontamente atropelada até a morte!\n\nO que é mais chocante é que [visiting_liege.GetNameNoTooltip] não fez nenhuma tentativa visível de impedir que isso acontecesse."
 tour_grounds_events.3009.desc.mid.my_kid:0 "Sou obrigado(a) a assistir enquanto minha própria carne e sangue é pisoteada pelos cascos de um monstro de cavalo."
 tour_grounds_events.3009.desc.mid.not_my_kid:0 "Não consigo desviar o olhar a tempo antes que a pobre criança seja pisoteada pelos cascos de um monstro."
 tour_grounds_events.3009.desc.outro.alive:0 "Felizmente, [trampled_child_scope.GetNameNoTooltip] sai dessa provação ainda com vida, mas não sem ferimentos."
 tour_grounds_events.3009.desc.outro.my_kid_dead:0 "Ao final dessa terrível provação, olho e vejo o corpo sem vida [Select_CString( trampled_child_scope.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort',trampled_child_scope)] reduzido a pouco mais do que uma polpa ensanguentada no chão."
 tour_grounds_events.3009.desc.outro.not_my_kid_dead:0 "Ao final dessa terrível provação, a pobre criança parece imóvel, em uma poça do seu próprio sangue."
 tour_grounds_events.3009.title:0 "Um Atropelamento Real"
 tour_grounds_events.3010.a:0 "Mande matar a besta e me traga outra!"
 tour_grounds_events.3010.b:0 "Todos cometem erros."
 tour_grounds_events.3010.desc.intro:0 "Meu passeio pelos terrenos de [touring_grounds_scope.GetNameNoTooltip] é interrompido bruscamente quando sinto meu valioso cavalo tropeçar em uma pedra. Embora ele se recupere rapidamente, e eu apenas perca momentaneamente o equilíbrio, posso ouvir membros da minha comitiva rindo atrás de mim.\n\n"
 tour_grounds_events.3010.desc.mid.calm:0 "Sinto um pouco de constrangimento, mas sei que na verdade não é culpa do animal."
 tour_grounds_events.3010.desc.mid.irritable:0 "Fui traído pelo meu supostamente valioso corcel, e sinto uma mistura de humilhação e raiva borbulhando nas minhas entranhas."
 tour_grounds_events.3010.desc.outro:0 "Um [ROOT.Char.GetTitleAsNameNoTooltip|U] é destinado a transmitir uma aura de regalidade intocável e comandar o respeito de todos os seus súditos, e esse incidente arruinou minha imagem de perfeição."
 tour_grounds_events.3010.title:0 "Um Corcel Inconfiável"
 tour_grounds_events.3011.a:0 "Posso conseguir outro para você, [Select_CString( visiting_liege.IsFemale, 'minha', 'meu' )] [visiting_liege.GetLadyLord]!"
 tour_grounds_events.3011.b:0 "Entendido."
 tour_grounds_events.3011.desc.intro:0 "Enquanto cavalgava pelos terrenos com [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)], o cavalo [visiting_liege.GetHerHim] tropeça em uma pedra no chão, lançando [visiting_liege.GetSheHe] momentaneamente para fora do equilíbrio. Assim que alguns membros da comitiva começam a rir, [visiting_liege.GetNameNoTooltip] desmonta"
 tour_grounds_events.3011.desc.mid.calm:0 "e cuidadosamente dispara uma flecha entre os olhos da pobre besta."
 tour_grounds_events.3011.desc.mid.irritable:0 "em um acesso de raiva e corta brutalmente a garganta do pobre animal, observando enquanto a vida escorre de seu corpo."
 tour_grounds_events.3011.desc.outro:0 "\n\n\"Não tenho uso para bestas ou súditos que me falham. Eu sempre posso conseguir outro.\""
 tour_grounds_events.3011.title:0 "$tour_grounds_events.3010.title$"
 tour_grounds_events.3012.a:0 "Hora de uma caçada."
 tour_grounds_events.3012.b:0 "Deixe-os ir, mediante uma taxa."
 tour_grounds_events.3012.c:0 "Evite-os."
 tour_grounds_events.3012.desc.intro:0 "Enquanto eu e minha comitiva cavalgamos, ouço murmúrios ecoando pelos terrenos. Ordeno a um menino que vá adiante e, quando ele retorna, ele me informa que há uma gangue de caçadores ilegais logo à nossa frente.\n\n"
 tour_grounds_events.3012.desc.mid.sadistic:0 "Isso apresenta uma oportunidade ideal para infligir dor justificada a algumas almas desprevenidas e ao mesmo tempo agradar [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 tour_grounds_events.3012.desc.mid:0 "Embora isso não seja da minha preocupação, certamente me agradaria agradar [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] se eu eliminasse essa atividade ilegal dos terrenos."
 tour_grounds_events.3012.desc.outro:0 "\n\nEu poderia reunir esses vagabundos e apresentar suas cabeças e mãos a [stop_host_scope.GetNameNoTooltip] sem muita dificuldade."
 tour_grounds_events.3012.title:0 "Caçadores ilegais!"
 tour_grounds_events.3013.a:0 "Obrigado, [Select_CString( visiting_liege.IsFemale, 'minha', 'meu' )] [visiting_liege.GetLadyLord]."
 tour_grounds_events.3013.b:0 "Que horror!"
 tour_grounds_events.3013.desc:0 "Eu fui separado de [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] por algum tempo e, quando nos reunimos, vejo [visiting_liege.GetSheHe] cavalgando com vários sacos vermelhos pingando ao seu lado.\n\n[visiting_liege.GetSheHe|U] esvazia os sacos aos meus pés e fico horrorizado ao ver mãos e cabeças decepadas de algumas almas infelizes jorrando, seus rostos permanentemente travados em uma expressão de horror.\n\n\"Eu me dei ao trabalho de limpar suas terras de caçadores ilegais e ladrões. Não se preocupe com isso, amigo.\""
 tour_grounds_events.3013.title:0 "Um Saco de Membros"
 tour_grounds_events.3014.a:0 "Imposto sobre janelas, então."
 tour_grounds_events.3014.b:0 "Vou deixar [stop_host_scope.GetSheHe] livre por enquanto."
 tour_grounds_events.3014.desc:0 "Enquanto sou levado para ver todas as maravilhas em [touring_grounds_scope.GetNameNoTooltip], começo a perceber a absoluta opulência de tudo isso.\n\nEmbora apenas um [stop_host_scope.GetTitleAsNameNoTooltip], [stop_host_scope.GetFirstNameNoTooltip] vive em relativo luxo e claramente tem mais do que moedas suficientes.\n\nOlhando para o grande número de janelas na residência [stop_host_scope.GetHerHim], eu poderia introduzir um imposto sobre janelas e drenar o excesso do [stop_host_scope.GetTitleAsNameNoTooltip|U]."
 tour_grounds_events.3014.title:0 "Extravagância Tributável"
 tour_grounds_events.3015.a:0 "Tudo bem, pagarei seu imposto sobre janelas."
 tour_grounds_events.3015.b:0 "Um imposto sobre janelas, o quê?"
 tour_grounds_events.3015.desc:0 "Tenho sido meticuloso ao mostrar [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] todas as vistas magníficas para contemplar em [touring_grounds_scope.GetNameNoTooltip], acreditando ser um ótimo anfitrião.\n\nNo entanto, percebo [visiting_liege.GetSheHe] voltando sua atenção para meus aposentos e gesticulando para eles enquanto murmura algo para [Select_CString( visiting_liege.IsFemale, 'si mesma', 'si mesmo' )]. Eu questiono [visiting_liege.GetSheHe], e [visiting_liege.GetSheHe] sorri.\n\n\"Ah, eu estava apenas contando as janelas. Você está ciente do imposto obrigatório sobre janelas, não está? Ele remonta aos primórdios do [visiting_liege.GetPrimaryTitle.GetNameNoTooltip], e eu não poderia deixar passar um número tão excessivo de janelas sem a devida tributação.\""
 tour_grounds_events.3015.title:0 "O Imposto sobre Janelas"
 tour_grounds_events.3016.a:0 "Assim será feito."
 tour_grounds_events.3016.b:0 "Não, este lugar é perfeito como está."
 tour_grounds_events.3016.desc:0 "Finalmente, encontro-me sozinho nas terras selvagens de [touring_grounds_scope.GetNameNoTooltip] e minha mente divaga em pensamentos de [liege_lover_scope.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\nNão posso negar que [touring_grounds_scope.GetNameNoTooltip] é um lugar de verdadeira beleza, quase bonito o suficiente para combinar com meu amado [liege_lover_scope.GetNameNoTooltip]. Sinto-me compelido a deixar uma marca aqui para que todos que passem por [touring_grounds_scope.GetNameNoTooltip] saibam do meu amor por [liege_lover_scope.GetSheHe]. Talvez esculpindo seu nome em uma [touring_grounds_scope.Custom('get_carvable_surface')]!"
 tour_grounds_events.3016.title:0 "Um Lembrança"
 tour_grounds_events.3017.a:0 "Uma pena."
 tour_grounds_events.3017.b:0 "Eu assumirei a culpa!"
 tour_grounds_events.3017.desc:0 "Finalmente, alcanço [Select_CString( visiting_liege.IsFemale, 'minha', 'meu' )] [visiting_liege.GetTitleAsNameNoTooltip|U] e, para minha horrorização, descubro que [visiting_liege.GetSheHe] está esculpindo seu nome em uma [touring_grounds_scope.Custom('get_carvable_surface')].\n\nSem dúvida, [visiting_liege.GetSheHe] não tinha como saber que esta [touring_grounds_scope.Custom('get_carvable_surface')] em particular tem grande significado espiritual para os habitantes locais, e se eles descobrirem que seu [visiting_liege.GetTitleAsNameNoTooltip|U] vandalizou um lugar sagrado, amaldiçoarão o nome [visiting_liege.GetName] por gerações futuras!"
 tour_grounds_events.3017.title:0 "Profanado"
 tour_grounds_events.3018.a.took_blame:0 "Obrigado."
 tour_grounds_events.3018.a.was_blamed:0 "Por que um [touring_grounds_scope.GetProvince.Custom('get_carvable_surface')] nunca é apenas um [touring_grounds_scope.GetProvince.Custom('get_carvable_surface')]?"
 tour_grounds_events.3018.desc.outro.blamed_liege:0 "Os camponeses e o clero de [touring_grounds_scope.GetNameNoTooltip] amaldiçoarão seu nome pela eternidade por sua profanação!"
 tour_grounds_events.3018.desc.outro.took_the_blame:0 "Não tema, assumirei a culpa por este. Apenas não mencione isso novamente."
 tour_grounds_events.3018.desc:0 "Estou felizmente esculpindo em [touring_grounds_scope.GetProvince.Custom('get_carvable_surface')] quando ouço um gasp repentino vindo ao meu lado.\n\n[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] parece absolutamente horrorizado enquanto [stop_host_scope.GetSheHe] contempla meu trabalho manual, e logo se aproxima para explicar.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], não há dúvida de que você não está ciente de que este [touring_grounds_scope.GetProvince.Custom('get_carvable_surface')] é considerado um objeto sagrado para os habitantes locais de [touring_grounds_scope.GetNameNoTooltip]!"
 tour_grounds_events.3018.title:0 "$tour_grounds_events.3017.title$"
 tour_grounds_events.3019.a:0 "Taxar o [stop_host_scope.GetTitleAsNameNoTooltip]!"
 tour_grounds_events.3019.b:0 "Vou relevá-los por enquanto."
 tour_grounds_events.3019.desc:0 "[touring_grounds_scope.GetNameNoTooltip] parece um lugar verdadeiramente opulento e excessivo, com um [stop_host_scope.GetTitleAsNameNoTooltip] inchado como seu governante.\n\nOnde quer que eu olhe, vejo sinais que apontam para uma coisa: amenidades tributáveis não declaradas. A contagem de gado parece ser muito maior do que a relatada, a moradia de [stop_host_scope.GetTitleAsNameNoTooltip] parece quase luxuosa o suficiente para ser de um [ROOT.Char.GetTitleAsNameNoTooltip|U]!\n\n[greedy_entourage_member.GetName] sugere que eu deveria taxar esse excesso, já que [stop_host_scope.GetName] claramente não tem pagado suas devidas contribuições."
 tour_grounds_events.3019.title:0 "Extras Tributáveis"
 tour_grounds_events.3020.a:0 "Eu paguei o que devo!"
 tour_grounds_events.3020.b:0 "Muito bem."
 tour_grounds_events.3020.desc:0 "[visiting_liege.GetName] tem parecido um pouco distante e distraído ultimamente, ocasionalmente murmurando para [Select_CString( visiting_liege.IsFemale, 'si mesma', 'si mesmo' )] e sussurrando para [greedy_entourage_member.GetName]. Finalmente, [visiting_liege.GetSheHe] se aproxima diretamente de mim e diz abertamente o que está em sua mente.\n\n\"Como um [stop_host_scope.GetTitleAsNameNoTooltip], você deve estar ciente de suas obrigações financeiras para comigo como seu senhor feudal. Quando olho ao redor de toda a grandiosidade de sua casa, não posso deixar de sentir que você tem trapaceado um pouco nos impostos. Talvez seja melhor retificar isso.\""
 tour_grounds_events.3020.title:0 "$tour_grounds_events.3019.title$"
 tour_grounds_events.3030.a:0 "Vamos ver para onde ele leva."
 tour_grounds_events.3030.b:0 "Ah, que perda de tempo."
 tour_grounds_events.3030.desc:0 "Hoje passei a maior parte do meu tempo explorando o centro de [touring_grounds_scope.GetNameNoTooltip] e me diverti sendo servido pela população local.\n\nLogo além do meu alcance, vejo uma figura encapuzada se movendo entre a multidão, em uma vã tentativa de se misturar. Um pedaço de papel cai do bolso deles e voa caprichosamente ao vento em minha direção, como se estivesse sendo guiado até mim.\n\nParece ser um mapa de algum tipo, um mapa dos terrenos ao redor de [touring_grounds_scope.GetNameNoTooltip]!"
 tour_grounds_events.3030.got_lost:0 "Você se perdeu"
 tour_grounds_events.3030.title:0 "O Mapa Misterioso"
 tour_grounds_events.3031.a:0 "Posso descobrir qual é qual."
 tour_grounds_events.3031.b:0 "Vou cavar toda a clareira!"
 tour_grounds_events.3031.c:0 "Já segui esse rastro o suficiente."
 tour_grounds_events.3031.desc:0 "Seguindo o mapa até o final, encontro apenas uma clareira no [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip] sem nenhuma significância em particular.\n\nOlhando ao redor, encontro uma série de montículos no chão, como se algo estivesse enterrado ali. Os montículos parecem estar razoavelmente espaçados, talvez indicando que há alguma lógica por trás de sua colocação..."
 tour_grounds_events.3031.fail_to_get_it_open:0 "Você não consegue encontrar o local certo"
 tour_grounds_events.3031.title:0 "Tesouro Enterrado"
 tour_grounds_events.3032.a:0 "Vou pegá-lo!"
 tour_grounds_events.3032.b:0 "$host_dinner_events.3132.b$"
 tour_grounds_events.3032.c:0 "$host_dinner_events.3132.c$"
 tour_grounds_events.3032.d:0 "Devo deixá-lo onde o encontrei."
 tour_grounds_events.3032.desc:0 "Finalmente, acho que encontrei o montículo certo, e ao desenterrá-lo, revelo... um livro estranho.\n\nA capa está surrada e praticamente desmoronando, e dentro há apenas símbolos e enigmas estranhos, aludindo a alguma verdade obscura.\n\nApós algum tempo, percebo que este é um livro de cifras, mas o que ele existe para decifrar não está claro."
 tour_grounds_events.3032.title:0 "O Livro Enterrado"
 tour_grounds_events.3040.a:0 "Prendam esses traidores!"
 tour_grounds_events.3040.b:0 "Não falem mal do [stop_host_scope.GetTitleAsNameNoTooltip|U]! Avancem!"
 tour_grounds_events.3040.c:0 "Esses camponeses têm a ideia certa."
 tour_grounds_events.3040.desc.intro:0 "Estou curioso para ver como os plebeus de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] vivem, então faço uma visita a um estabelecimento onde os moradores parecem estar se agitando bastante. Um homem fica em cima de uma mesa, chamando a atenção de todos ao redor.\n\n\"Para que diabos precisamos de um [stop_host_scope.GetTitleAsNameNoTooltip|U], afinal? [stop_host_scope.GetFirstName]"
 tour_grounds_events.3040.desc.mid.conscription:0 "nos faz lutar as suas batalhas enquanto [stop_host_scope.GetSheHe] descansa sobre seus louros,"
 tour_grounds_events.3040.desc.mid.high_taxes:0 "nos suga até a última gota com esses malditos impostos,"
 tour_grounds_events.3040.desc.mid.just_plain_dislike_em:0 "é [Select_CString( stop_host_scope.IsFemale, 'a', 'o' )] [stop_host_scope.Custom2('InsultNoun', ROOT.Char)] [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] que já vi,"
 tour_grounds_events.3040.desc.mid.shit_beer:0 "nos alimenta com essa porcaria de [angry_peasant.Custom('RegionalAlcoholicDrink')],"
 tour_grounds_events.3040.desc.mid.shit_weed:0 "nos enche com haxixe barato e espera que fiquemos quietos,"
 tour_grounds_events.3040.desc.mid.wrong_culture:0 "é um estrangeiro maldito,"
 tour_grounds_events.3040.desc.mid.wrong_faith:0 "é um [stop_host_scope.GetFaith.GetAdherentName] maldito destinado ao [angry_peasant.GetFaith.NegativeAfterLife],"
 tour_grounds_events.3040.desc.mid.wrong_language:0 "nem falam nossa língua,"
 tour_grounds_events.3040.desc.outro:0 "ainda assim, [stop_host_scope.GetSheHe] espera nossa lealdade incondicional!\"\n\nTodo o prédio explode em batidas e aplausos. Claramente, [Select_CString( stop_host_scope.IsFemale, 'minha', 'meu' )] [stop_host_scope.GetTitleAsNameNoTooltip|U] não é popular em sua própria casa."
 tour_grounds_events.3040.title:0 "Súditos Desleais"
 tour_grounds_events.3050.a:0 "Guardas! Prendam esse idiota!"
 tour_grounds_events.3050.b.failure:0 "Você perde a luta"
 tour_grounds_events.3050.b.success:0 "Você vence a luta"
 tour_grounds_events.3050.b:0 "Um bom [ROOT.Char.GetTitleAsNameNoTooltip|U] defende seus súditos!"
 tour_grounds_events.3050.c:0 "\"Ei, deixe-me espancar [beaten_peasant.GetSheHe] um pouco!\""
 tour_grounds_events.3050.desc:0 "\"Dê-me meu maldito dinheiro!\"\n\nO som de sangue espirrando e ossos quebrando chama minha atenção para uma sarjeta, onde vejo um[Select_CString( beaten_peasant.IsFemale, 'a', '' )] [beaten_peasant.GetWomanMan] empobrecid[Select_CString( beaten_peasant.IsFemale, 'a', 'o' )] sendo segurad[Select_CString( beaten_peasant.IsFemale, 'a', 'o' )] pela gola por um valentão local.\n\nNormalmente, esse tipo de coisa estaria abaixo de mim, mas eu realmente posso permitir que crimes tão flagrantes aconteçam bem na minha frente?"
 tour_grounds_events.3050.title:0 "Uma Lição Dura"
 tour_grounds_events.3060.a:0 "Eles poderiam combater o crime!"
 tour_grounds_events.3060.b.failure:0 "Seu conselho não funcionou"
 tour_grounds_events.3060.b.success:0 "Os quartéis foram melhorados"
 tour_grounds_events.3060.b.vassal:0 "[visiting_liege.GetFirstName] interfere no seu exército"
 tour_grounds_events.3060.b:0 "Talvez eles possam ser gerenciados de forma mais eficiente."
 tour_grounds_events.3060.c:0 "Eu poderia usar soldados como esses."
 tour_grounds_events.3060.d:0 "Talvez eu possa aprender algo aqui."
 tour_grounds_events.3060.desc.archers:0 "Fileira após fileira de arqueiros estão prontos, arcos em mãos."
 tour_grounds_events.3060.desc.camel_cavalry:0 "Os camelos gemem e chutam, como se estivessem loucos para aterrorizar a cavalaria inimiga."
 tour_grounds_events.3060.desc.cavalry:0 "Os cavalos resmungam e resfolegam, ansiosos para que seus cavaleiros os levem para a carga."
 tour_grounds_events.3060.desc.elephant_cavalry:0 "Eu fico maravilhado com o tamanho imponente da infantaria de elefantes e tenho receio de imaginar os momentos finais daqueles que são pisoteados sob seus pés."
 tour_grounds_events.3060.desc.heavy_infantry:0 "Um mar de armaduras brilhantes está diante de mim, cada soldado parecendo indiferente ao peso sobre seus corpos."
 tour_grounds_events.3060.desc.intro:0 "[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] decidiu me mostrar hoje seus quartéis.\n\n"
 tour_grounds_events.3060.desc.light_infantry:0 "Fileira após fileira de infantaria leve permanece atenta em suas armaduras, prontas para minha inspeção."
 tour_grounds_events.3060.desc.outro:0 "Esses são excelentes soldados, mas parece um desperdício deixá-los ociosos o dia todo."
 tour_grounds_events.3060.title:0 "Os Melhores de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip|U]"
 tour_grounds_events.3070.a:0 "Eu poderia aprender tanto deste lugar."
 tour_grounds_events.3070.b:0 "Um passeio tranquilo é um presente."
 tour_grounds_events.3070.c:0 "Estacionem as tropas, esta paz deve ser protegida!"
 tour_grounds_events.3070.desc.intro:0 "Encontro-me passeando com meu séquito pelos maravilhosos cenários fora de [ROOT.Char.GetCurrentLocation.GetName] propriamente dito e"
 tour_grounds_events.3070.desc.leisure_palace:0 "ao redor do palácio de verão magnífico de [stop_host_scope.GetName].\n\nA fachada do palácio é decorada com esculturas deslumbrantes e flora local arranjada com detalhes meticulosos, e o interior é tão grandioso e extravagante. Tudo sobre as vistas e sensações de estar neste palácio existe para acalmar uma alma sobrecarregada."
 tour_grounds_events.3070.desc.outro:0 "\n\nEu poderia ficar aqui para sempre."
 tour_grounds_events.3070.desc.royal_forest:0 "ao redor da encantadora floresta real de [stop_host_scope.GetName].\n\nEsta floresta está completamente vazia de camponeses ou nobres menores; só eu, meus confidentes mais próximos e a criação de [ROOT.Char.GetFaith.CreatorName|U]. Sinto-me transportado para um reino de calma pura, um tempo antes que os corações calamitosos dos homens contaminassem a terra com vícios e fraquezas."
 tour_grounds_events.3070.desc.royal_garden:0 "ao redor do magnífico jardim real de [stop_host_scope.GetName].\n\nDentro das paredes do jardim, só há eu, alguns nobres menores e um jardim preciso e intrincadamente arranjado. Parar por um momento aqui me enche de uma tranquilidade que raramente tenho a chance de experimentar."
 tour_grounds_events.3070.title:0 "Um Momento de Silêncio"
 tour_grounds_events.3080.a:0 "E aprender eu irei."
 tour_grounds_events.3080.b:0 "Esses homens ociosos deveriam caçar criminosos!"
 tour_grounds_events.3080.c:0 "Talvez eu deva ter uma lição."
 tour_grounds_events.3080.desc.archery_ranges:0 "Campos de Tiro com Arco.\n\nO constante som de #EMP tac-tac-tac#! das flechas atingindo os alvos é acompanhado pelo estalar das cordas dos arcos. Uma brisa leve sopra, causando todo tipo de travessura entre os arqueiros em treinamento quando sopra com mais força."
 tour_grounds_events.3080.desc.intro:0 "Encontro-me vagando pelos cenários mais militaristas de [ROOT.Char.GetCurrentLocation.GetName], e acabo chegando a [stop_host_scope.GetName]"
 tour_grounds_events.3080.desc.jousting_lists:0 "Listas de Justas.\n\nOs relinchos e grunhidos dos cavalos são interrompidos pelo repentino som de choque e estilhaços de lanças. Cascos retumbantes batem um ritmo staccato à medida que me aproximo, com gritos de encorajamento ecoando ao meu redor."
 tour_grounds_events.3080.desc.march:0 "Marchas.\n\nEm toda a fronteira, eles se preparam para qualquer invasor ou infrator que venha para a sua vista, com eficiência especializada."
 tour_grounds_events.3080.desc.military_academy:0 "academia militar.\n\nPor toda a academia, vejo $knight_culture_player_plural_no_tooltip_lowercase$ de nobre porte praticando e aprimorando suas habilidades, sabendo muito bem que a guerra está sempre no horizonte."
 tour_grounds_events.3080.desc.outro:0 "\n\n[ROOT.Char.GetCurrentLocation.GetName] é um excelente centro militar, e claramente tenho muito a aprender com suas práticas."
 tour_grounds_events.3080.desc.royal_armories:0 "Arsenais Reais.\n\nO brilho polido das armaduras alinhadas nos Arsenais Reais quase dá à sala um brilho sobrenatural quando eu entro. Fileiras e mais fileiras de elmos e malhas pendem de todas as superfícies, o leve aroma de óleo pairando sobre eles."
 tour_grounds_events.3080.desc.siege_works:0 "Oficinas de Cerco.\n\nAs máquinas recebem cuidados e manutenção constantes, algumas sendo reparadas e outras sendo montadas pela primeira vez. Eu temo pelo próximo vilão cujas muralhas enfrentarão essas máquinas."
 tour_grounds_events.3080.title:0 "As Forças Militares Locais"
 tour_grounds_events.3090.a:0 "Devemos fazer um levantamento dessas terras."
 tour_grounds_events.3090.b:0 "\"Isso é perda de tempo! Voltem para seus campos!\""
 tour_grounds_events.3090.c:0 "Que maravilha, vou julgar o concurso."
 tour_grounds_events.3090.desc.intro:0 "Caminhando pelo campo de [ROOT.Char.GetCurrentLocation.GetName], me deparo com o que parece ser uma reunião de camponeses em um pequeno povoado.\n\nAcompanhados por seus orgulhosos proprietários,"
 tour_grounds_events.3090.desc.livestock:0 "gado gordo e saudável pasta, parecendo tão delicioso que dá vontade de dar uma mordida!"
 tour_grounds_events.3090.desc.outro:0 "Os camponeses ocasionalmente trazem suas mercadorias para serem avaliadas, analisando seu tamanho e saúde. Parece que estão realizando algum tipo de festival, e assim que percebem a minha presença, estão ansiosos para me mostrar os frutos do seu trabalho."
 tour_grounds_events.3090.desc.vegetables:0 "[farmer.Custom('RegionalRootVegetablePlural')] de tamanho imenso enchem carrinhos e barracas de mercado."
 tour_grounds_events.3090.title:0 "O Orgulho de um Agricultor"
 tour_grounds_events.3100.a:0 "É preciso realizar um censo deste assentamento."
 tour_grounds_events.3100.b:0 "Devo passar o dia na presença de [ROOT.Char.GetFaith.HighGodName]."
 tour_grounds_events.3100.c:0 "Devo ver como os [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdherentNamePlural] adoram."
 tour_grounds_events.3100.d:0 "Uma excelente oportunidade para a caridade."
 tour_grounds_events.3100.desc.booze:0 "tavernas começando a receber seus primeiros bebedores,"
 tour_grounds_events.3100.desc.hash:0 "figuras suspeitas seguindo em direção a jardins secretos de haxixe,"
 tour_grounds_events.3100.desc.intro:0 "Em minha visita a [ROOT.Char.GetCurrentLocation.GetName], encontro um raro momento em que não estou sendo conduzido por meu anfitrião nem esperado para aparecer em algum lugar.\n\nVejo os lugares de culto se enchendo para o dia,"
 tour_grounds_events.3100.desc.outro:0 "e mendigos deitados nas ruas, implorando por apenas um pedaço de comida."
 tour_grounds_events.3100.e:0 "Eu só quero relaxar."
 tour_grounds_events.3100.title:0 "Um Dia Tranquilo"
 tour_grounds_if_liege_accepts_tt:0 "Se o seu senhor feudal aceitar"
 tour_grounds_if_liege_enjoys_tt:0 "Se o seu senhor feudal gostar"
 tour_grounds_if_liege_is_impressed_tt:0 "Se o seu senhor feudal estiver impressionado"
 tour_grounds_if_liege_is_insulted_tt:0 "Se o seu senhor feudal estiver insultado"
 tour_grounds_if_liege_is_scared_tt:0 "Se o seu senhor feudal estiver assustado"
 tour_grounds_if_liege_rejects_tt:0 "Se o seu senhor feudal rejeitar"
 tour_grounds_if_vassal_accepts_tt:0 "Se o seu anfitrião aceitar"
 tour_grounds_if_vassal_is_generous_tt:0 "Se o seu anfitrião for generoso"
 tour_grounds_if_vassal_is_impressed_tt:0 "Se o seu anfitrião estiver impressionado"
 tour_grounds_if_vassal_is_not_generous_tt:0 "Se o seu anfitrião não for generoso"
 tour_grounds_if_vassal_is_scared_tt:0 "Se o seu anfitrião estiver assustado"
 tour_grounds_if_vassal_refuses_tt:0 "Se o seu anfitrião recusar"
 tour_grounds_if_vassal_rejects_tt:0 "Se seu vassalo não aceitar"
 tour_travel.1001.a:0 "Diga isso na minha cara, [Select_CString( angry_peasant.IsFemale, 'sua', 'seu' )] [angry_peasant.Custom2('InsultNoun', ROOT.Char)]!"
 tour_travel.1001.b:0 "Talvez uma redução de impostos mude sua opinião."
 tour_travel.1001.c:0 "Oh, eu simplesmente pareço com [ROOT.Char.GetNameNoTooltip]!"
 tour_travel.1001.desc.intro:0 "Eu entro em uma taverna local em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], cansado de viajar e sedento por [ROOT.Char.Custom('RegionalDrink')] e descanso.\n\nMinha contemplação silenciosa é interrompida pelo som de um punho batendo em madeira rachada, seguido por um cuspe de desdém. \"Aquel[Select_CString( angry_peasant.IsFemale, 'a', 'e' )] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('angry_peasant'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('angry_peasant'))]!\""
 tour_travel.1001.desc.mid.just_plain_dislike_em:0 "Não deveríamos sequer chamar [Select_CString( ROOT.Char.IsFemale, 'aquela', 'aquele' )] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('angry_peasant'))] de [Select_CString( ROOT.Char.IsFemale, 'nossa', 'nosso' )] [ROOT.Char.GetTitleAsNameNoTooltip], deveríamos [Select_CString( ROOT.Char.IsFemale, 'chamá-la de tola', 'chamá-lo de tolo' )] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('angry_peasant'))]!"
 tour_travel.1001.desc.mid.powerful_diarch:0 "[Select_CString( ROOT.Char.IsFemale, 'Nossa suposta', 'Nosso suposto' )] [ROOT.Char.GetTitleAsNameNoTooltip|U] é [Select_CString( ROOT.Char.IsFemale, 'fraca', 'fraco' )]! O verdadeiro governante do [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] é aquel[Select_CString( ROOT.Char.GetDiarch.IsFemale, 'a', 'e' )] [ROOT.Char.GetDiarch.Custom2('InsultNoun', SCOPE.sC('angry_peasant'))] [ROOT.Char.GetDiarch.Custom2('InsultAdjective', SCOPE.sC('angry_peasant'))], [ROOT.Char.GetDiarch.GetFirstName]!"
 tour_travel.1001.desc.mid.pretender:0 "A Casa de [ROOT.Char.GetHouse.GetName], eu cuspo em todos eles! Todos sabem que os verdadeiros governantes do [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] são da casa [claimant_character_scope.GetHouse.GetName]."
 tour_travel.1001.desc.mid.wrong_culture:0 "[ROOT.Char.GetSheHe|U] é um completo estrangeiro! Como podemos ser governados por alguém que nem é [angry_peasant.GetCulture.GetName]?"
 tour_travel.1001.desc.mid.wrong_faith:0 "[ROOT.Char.GetSheHe|U] é um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('angry_peasant'))] infiel! Cada segundo que [ROOT.Char.GetSheHe] permanece no trono é um ultraje à vontade de [angry_peasant.GetFaith.HighGodName]."
 tour_travel.1001.desc.mid.wrong_language:0 "[ROOT.Char.GetSheHe|U] nem mesmo fala [angry_peasant.GetCulture.GetLanguage.GetName], mas [ROOT.Char.GetSheHe] se atreve a se chamar nosso senhor feudal legítimo!"
 tour_travel.1001.desc.outro.nudist:0 "\n\nTento manter um perfil discreto, mas parece que minha maneira [ROOT.Char.GetTitleAsNameNoTooltip|l] e a inconfundível perfeição de um corpo bem cuidado da Casa [ROOT.Char.GetHouse.GetName] me denunciaram. Preciso pensar em algo antes que a situação se agrave."
 tour_travel.1001.desc.outro:0 "\n\nTento manter um perfil discreto, mas parece que minha maneira [ROOT.Char.GetTitleAsNameNoTooltip|l] e as insígnias da Casa [ROOT.Char.GetHouse.GetName] em minhas vestes me denunciaram. Preciso pensar em algo antes que a situação se agrave."
 tour_travel.1001.title:0 "Um Servo e seu [ROOT.Char.GetTitleAsNameNoTooltip|U]"
 tour_travel.1002.a:0 "Devo expressar meus sentimentos."
 tour_travel.1002.b:0 "Oh, acho que vi algo... continuem."
 tour_travel.1002.desc:0 "Enquanto cavalgamos por [pretty_peasant_county_scope.GetName], começo a me encantar com a paisagem. Verdadeiramente, o [pretty_peasant_county_scope.GetProvince.Custom('TerrainTypeProvince')] de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] deve ser o mais belo de todos no [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], e ainda mais [Select_CString( pretty_peasant.IsFemale, 'belas são as', 'belos são os' )] [pretty_peasant.GetWomenMen] que o chamam de lar.\n\nEnquanto meu séquito me escolta por mais uma vila humilde, encontro um[Select_CString( pretty_peasant.IsFemale, 'a', '' )] [pretty_peasant.GetWomanMan] jovem particularmente bel[Select_CString( pretty_peasant.IsFemale, 'a', 'o' )], ocupad[Select_CString( pretty_peasant.IsFemale, 'a', 'o' )] com suas modestas tarefas, e meu coração começa a bater mais rápido. Observar essa [pretty_peasant.Custom('LoverPetName')] em sua cotidianidade é como ver poesia se tornar carne, e antes que eu possa pensar, meu coração já me ordenou que ordenasse ao meu séquito que parasse."
 tour_travel.1002.title:0 "A [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')|U] Entre as Ervas Daninhas"
 tour_travel.1003.a:0 "Façam essa criatura ser chicoteada por cinco milhas."
 tour_travel.1003.b:0 "As entranhas [rude_peasant.GetHerHim] vão decorar o [angry_county_scope.GetProvince.Custom('TerrainTypeProvince')]."
 tour_travel.1003.c:0 "Perdoe a ignorância [rude_peasant.GetHerHim]."
 tour_travel.1003.desc:0 "À medida que minha viagem continua avançando pelo interior de [angry_county_scope.GetName], sou informado de que marquei um encontro com um representante do campesinato descontente.\n\nUma criatura lastimável se arrasta diante de mim, argumentando sobre a suposta dignidade do povo comum de [angry_county_scope.GetAdjective]. Porém, logo percebo que [Select_CString( rude_peasant.IsFemale, 'a', 'o' )] [rude_peasant.Custom2('InsultAdjective', ROOT.Char)] [rude_peasant.Custom2('InsultNoun', ROOT.Char)] nunca sequer se dirigiu a mim como '[ROOT.Char.Custom('FormOfAddressForLiege')|U]', uma ofensa que pode ser punida da forma que eu achar adequada."
 tour_travel.1003.title:0 "Para Abordar um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip|U]"
 tour_travel.1004.a.tarantino:0 "Odeio admitir, mas isso é um pouco erótico."
 tour_travel.1004.a:0 "Uma bênção para você, uma memória ruim para mim."
 tour_travel.1004.b:0 "Oh, eu poderia massagear esses pés corposcópicos para sempre."
 tour_travel.1004.c:0 "Talvez um toque suave na testa resolva."
 tour_travel.1004.d.meat:0 "Afaste essas salsichas sujas de mim!"
 tour_travel.1004.d.two_veg:0 "Afaste esses [ROOT.Char.Custom('get_region_root_vegetable_plural')] sujos de mim!"
 tour_travel.1004.desc.intro:0 "Adentro [diseased_county_scope.GetName], [Select_CString( rude_peasant.IsFemale, 'pronta', 'pronto' )] para conceder meu toque real à população camponesa local. Sou imediatamente [Select_CString( rude_peasant.IsFemale, 'confrontada', 'confrontado' )] com o que, sem dúvida, é a criatura mais miserável que já pus meus olhos. Com pouca provocação, [diseased_peasant.GetSheHe] expõe os pés calejados [diseased_peasant.GetHerHim], a apenas alguns centímetros de minhas mãos imaculadas.\n\n"
 tour_travel.1004.desc.outro.christian:0 "Assim como Cristo lavou os pés de seus discípulos, também sou [Select_CString( rude_peasant.IsFemale, 'instada', 'instado' )] por [ROOT.Char.GetFaith.HighGodName] a lavar os pés de meus súditos leais."
 tour_travel.1004.desc.outro:0 "Embora eu deteste estar na presença desse miserável mendigo pestilento, dizem que meu toque pode curar até mesmo as doenças mais repugnantes."
 tour_travel.1004.title:0 "$altruism_intent_header$ Um Toque Curador"
 tour_travel.1005.a:0 "Distribuirei moedas abençoadas."
 tour_travel.1005.b:0 "Uma borrifada de água deve satisfazê-los."
 tour_travel.1005.c:0 "Eles não receberão nada!"
 tour_travel.1005.desc:0 "A notícia de minha chegada parece ter se espalhado para [county_to_bless_scope.GetName], pois nosso séquito logo é cercado por inúmeros camponeses pedindo para serem abençoados com o toque real.\n\nEu poderia simplesmente borrifar um pouco de água abençoada por mim sobre eles, e certamente ficariam satisfeitos, mas conceder-lhes moedas abençoadas para aliviar suas áreas infectadas os deixaria felizes e abençoados por muito mais tempo."
 tour_travel.1005.title:0 "$altruism_intent_header$ O Toque Real"
 tour_travel.1006.a:0 "Esmolas para os pobres!"
 tour_travel.1006.b:0 "Se eles quisessem dinheiro, não deveriam ter nascido pobres."
 tour_travel.1006.c:0 "Removam essas pragas dos degraus!"
 tour_travel.1006.desc:0 "Enquanto cavalgamos pelo grande [county_holder_to_bless_scope.GetFaith.HouseOfWorship] em [church_barony_scope.GetNameNoTooltip], ordeno que minha comitiva pare para admirar este local sagrado que atende às necessidades espirituais de tantos aqui em [county_to_bless_scope.GetNameNoTooltip].\n\nOs terrenos do [county_holder_to_bless_scope.GetFaith.HouseOfWorship] estão lotados de desamparados que vieram orar por uma melhora em suas circunstâncias. Esta talvez seja uma oportunidade de mostrar ao povo de [county_to_bless_scope.GetNameNoTooltip] o quanto posso ser magnânimo e bondoso."
 tour_travel.1006.title:0 "$altruism_intent_header$ Esmolas para os Pobres"
 tour_travel.1007.a:0 "Um pequeno desvio não deve ser problema."
 tour_travel.1007.b:0 "Absurdo!"
 tour_travel.1007.desc.intro:0 "Conforme minha procissão continua em nossa jornada por todo o meu reino, acabamos passando pela região remota e inesperada de [wise_woman_barony_scope.GetNameNoTier]. Eu não teria dado importância, mas [superstituous_courtier_scope.GetName] me aborda [Select_CString( superstituous_courtier_scope.IsFemale, 'entusiasmada', 'entusiasmado' )] para exaltar a virtude da chamada \"Sábi[Select_CString( wise_woman_scope.IsFemale, 'a', 'o' )] [wise_woman_scope.GetWomanMan|U] de [wise_woman_barony_scope.GetNameNoTierNoTooltip]\".\n\n"
 tour_travel.1007.desc.mid.ill:0 "\"Com licença, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord], mas vejo que você está sofrendo tremendamente com doenças e aflições. [Select_CString( wise_woman_scope.IsFemale, 'A Sábia', 'O Sábio' )] [wise_woman_scope.GetWomanMan|U] de [wise_woman_barony_scope.GetNameNoTierNoTooltip] está a apenas uma pequena distância daqui, e eu sei que [wise_woman_scope.GetSheHe] tem exatamente o que você precisa para voltar à sua saúde plena!\""
 tour_travel.1007.desc.mid.pregnant:0 "\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|U], posso ver que você está brilhando e radiante como sempre, como deveria ser quando se está grávida. No entanto, posso perceber que o árduo trabalho de carregar um bebê está causando grande desconforto, e [Select_CString( wise_woman_scope.IsFemale, 'a Sábia', 'o Sábio' )] [wise_woman_scope.GetWomanMan] próxima terá o remédio necessário para aliviar o que a está afligindo.\""
 tour_travel.1007.desc.mid.psychological:0 "\"Eu sei que você tem uma mente atormentada, [ROOT.Char.Custom('FormOfAddressForLiege')], e isso lhe causa grande angústia. Por mais forte que seja seu espírito, aquilo que aflige sua mente pode ser remediado talvez com um pouco de incenso ou medicamento [Select_CString( wise_woman_scope.IsFemale, 'da famosa Sábia', 'do famoso Sábio' )] [wise_woman_scope.GetWomanMan|U] de [wise_woman_barony_scope.GetNameNoTierNoTooltip]!\""
 tour_travel.1007.desc.mid.ugly:0 "\"Se me permitir ser tão ousado, [ROOT.Char.Custom('FormOfAddressForLiege')], alguns membros de sua comitiva têm feito comentários sobre sua... aparência. No entanto, não se preocupe! Há um[Select_CString( wise_woman_scope.IsFemale, 'a', '' )] [wise_woman_scope.GetWomanMan] Sábi[Select_CString( wise_woman_scope.IsFemale, 'a', 'o' )] nas proximidades que pode curar qualquer aflição, dizem eles.\""
 tour_travel.1007.desc.mid.weakened:0 "\"Com seus ferimentos, [ROOT.Char.Custom('FormOfAddressForLiege')], temo pela sua segurança e saúde contínuas nesta viagem. No entanto, eu conheço um médico habilidoso nas proximidades que pode ser capaz de tratar suas feridas. [Select_CString( wise_woman_scope.IsFemale, 'A', 'O' )] [wise_woman_scope.GetWomanMan|U] [Select_CString( wise_woman_scope.IsFemale, 'Sábia', 'Sábio' )] de [wise_woman_barony_scope.GetNameNoTierNoTooltip] pode curar qualquer coisa!\""
 tour_travel.1007.desc.outro:0 "\n\nEu tenho minhas dúvidas, mas [superstituous_courtier_scope.GetNameNoTooltip] parece tão completamente convencido da virtude deste curandeiro místico que sinto vontade de fazer uma visita."
 tour_travel.1007.title:0 "[Select_CString( wise_woman_scope.IsFemale, 'A', 'O' )] [wise_woman_scope.GetWomanMan|U] Sábi[Select_CString( wise_woman_scope.IsFemale, 'a', 'o' )] de [wise_woman_barony_scope.GetNameNoTierNoTooltip]"
 tour_travel.1008.a:0 "Como mágica!"
 tour_travel.1008.b:0 "[wise_woman_scope.GetSheHe|U] deveria ser meu médico!"
 tour_travel.1008.desc.intro:0 "Ao anoitecer, entro na choupana mal iluminada d[Select_CString( wise_woman_scope.IsFemale, 'a', 'o' )] [wise_woman_scope.GetWomanMan] Sábi[Select_CString( wise_woman_scope.IsFemale, 'a', 'o' )], minha comitiva permanecendo do lado de fora. Não tenho dúvidas de que [Select_CString( wise_woman_scope.IsFemale, 'a', 'o' )] [wise_woman_scope.GetWomanMan] excêntric[Select_CString( wise_woman_scope.IsFemale, 'a', 'o' )] que se arrasta dentro é quem procuro.\n\n\"Ah, eu estava esperando por você. Entre! Compartilhe meu fogo, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|U].\" Antes mesmo que eu possa pronunciar uma palavra, as mãos geladas [wise_woman_scope.GetHerHim] envolvem as minhas."
 tour_travel.1008.desc.mid.ill:0 "Passo a noite sorvendo líquidos negros de sabor repugnante e inalando incensos intoxicantes, e quando saio pela manhã, sinto-me como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] nov[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 tour_travel.1008.desc.mid.pregnant:0 "Passo a noite sendo [Select_CString( wise_woman_scope.IsFemale, 'alimentada', 'alimentado' )] com todo tipo de alimentos estranhos: globos oculares, ervas e frutas que nunca vi antes, tudo enquanto minhas necessidades são atendidas por [Select_CString( wise_woman_scope.IsFemale, 'essa', 'esse' )] [wise_woman_scope.GetWomanMan] [Select_CString( wise_woman_scope.IsFemale, 'estranha', 'estranha' )]. Saio pela manhã e me sinto [Select_CString( ROOT.Char.IsFemale, 'revigorada', 'revigorado' )]!"
 tour_travel.1008.desc.mid.psychological:0 "Suas mãos se movem para agarrar meu crânio como uma grande fera segurando sua presa. Passamos a noite entoando palavras que não compreendo, e quando saio pela manhã, sinto que minha cabeça está mais leve."
 tour_travel.1008.desc.mid.ugly:0 "[wise_woman_scope.GetSheHe|U] passa a noite toda espalhando pastas coloridas e cremes em meu rosto, cobrindo minhas várias imperfeições e áreas ásperas. Pela manhã, contemplo meu reflexo e vejo [Select_CString( ROOT.Char.IsFemale, 'uma nova', 'um novo' )] [ROOT.Char.GetWomanMan] que faria até os castos ruborizarem de luxúria!"
 tour_travel.1008.desc.mid.weakened:0 "[wise_woman_scope.GetSheHe|U] cobre minha ferida com todo tipo de fluidos viscosos e ervas ardentes, e embora o processo seja doloroso, sinto que minha ferida está se fechando mais no dia seguinte."
 tour_travel.1008.desc.outro:0 "\n\nTodas as minhas dúvidas são dissipadas e meus males estão curados."
 tour_travel.1008.title:0 "$tour_travel.1007.title$"
 tour_travel.1009.a:0 "Que perda de tempo."
 tour_travel.1009.b:0 "Enganar a [ROOT.Char.GetTitleAsNameNoTooltip|U] é um crime digno de morte."
 tour_travel.1009.desc.intro:0 "$tour_travel.1008.desc.intro$"
 tour_travel.1009.desc.mid.ill:0 "Passo a noite inteira cheirando odores absolutamente intoleráveis, bebendo fluidos viscosos repugnantes e tendo meu corpo coberto por ervas ardentes! Toda a experiência adiciona ainda mais náusea e dor à minha aflição existente, e termino a noite me sentindo pior do que quando comecei."
 tour_travel.1009.desc.mid.nothing:0 "Faço tudo o que a mulher pede: bebo chás de ervas, tenho meus membros massageados, fico sobre as chamas e ingiro ervas suficientes para derrubar um homem. No entanto, tudo isso parece ter tido pouco efeito em mim, e não me sinto melhor do que quando cheguei."
 tour_travel.1009.desc.mid.ugly:0 "[wise_woman_scope.GetSheHe|U] passa a noite toda espalhando pastas coloridas e cremes em meu rosto, cobrindo minhas várias imperfeições e áreas ásperas. Pela manhã, contemplo meu reflexo e uivo de medo ao ver o monstro em que [wise_woman_scope.GetSheHe] me transformou!"
 tour_travel.1009.desc.outro:0 "\n\nNão sei o que [superstituous_courtier_scope.GetNameNoTooltip] ouviu sobre ess[Select_CString( wise_woman_scope.IsFemale, 'a', 'e' )] [wise_woman_scope.GetWomanMan] \"sábi[Select_CString( wise_woman_scope.IsFemale, 'a', 'o' )]\", mas está claro que [wise_woman_scope.GetSheHe] é pouco mais do que um embusteiro comum à beira da estrada."
 tour_travel.1009.title:0 "O Charlatão de [wise_woman_barony_scope.GetNameNoTierNoTooltip]"
 tour_travel.9010.a:0 "Vamos seguir a rota segura."
 tour_travel.9010.b:0 "Devemos fazer justiça a esses malfeitores!"
 tour_travel.9010.desc:0 "Minha comitiva continua seguindo nossa rota planejada até [next_destination.GetName], quando de repente paramos abruptamente, por ordem de [travel_leader.GetName]!\n\n\"Parem, seus tolos! Dizem que esta estrada está infestada de bandidos e canalhas de má reputação, devemos desviar o caminho!\"\n\nA rota que [travel_leader.GetSheHe] propõe é mais longa, mas [travel_leader.GetSheHe] me garante que é mais segura."
 tour_travel.9010.failure:0 "Os bandidos te derrotaram."
 tour_travel.9010.success:0 "Os bandidos são derrotados."
 tour_travel.9010.t:0 "Cuidado com os Bandidos!"
 tour_travel.9020.a:0 "A execução é justa."
 tour_travel.9020.b:0 "As evidências são frívolas, deixe [accused_character.GetSheHe] ir."
 tour_travel.9020.c:0 "Servir-me será o castigo [accused_character.GetHerHim]."
 tour_travel.9020.desc.intro:0 "Chegamos a uma pequena vila em [ROOT.Char.GetCurrentLocation.GetName] e encontramos uma grande comoção na praça central. Uma criatura infeliz está cercada por moradores furiosos; o olhar sombrio e desesperançado em seus olhos [accused_character.GetHerHim] desaparece e se ilumina quando [accused_character.GetSheHe] percebe a aproximação de minha comitiva.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')], por favor! Não escute eles, é tudo mentira, sou inocente! Você não vai me conceder a justiça do [ROOT.Char.GetTitleAsNamePossessiveNoTooltip|U]?\"\n\n"
 tour_travel.9020.desc.outro.guilty:0 "É verdade que as evidências parecem circunstanciais, mas um camponês humilde jamais deveria falar com seu [ROOT.Char.GetTitleAsNameNoTooltip|U] sem ser solicitado."
 tour_travel.9020.desc.outro:0 "As evidências parecem bastante incriminadoras, e [accused_character.GetSheHe] falou fora de hora além disso."
 tour_travel.9020.t:0 "Justiça Local"
 tour_travel.9030.a:0 "Alegria e diversão, aqui vou eu!"
 tour_travel.9030.b:0 "Não devemos nos distrair."
 tour_travel.9030.desc.intro:0 "Ao ser acordado do meu sono da meia-noite, ouço os gritos de alegria e diversão se aproximando lentamente por trás de mim. [drunky_entourage.GetName|U] aparece, [drunky_entourage.GetSheHe]"
 tour_travel.9030.desc.mid.hashish:0 "olhos vermelhos de haxixe."
 tour_travel.9030.desc.mid:0 "hálito com o cheiro de [ROOT.Char.Custom('RegionalAlcoholicDrink')]."
 tour_travel.9030.desc.outro:0 "\n\n\"Pelo [drunky_entourage.GetFaith.HighGodName]! Há um maravilhoso covil do pecado a apenas alguns minutos daqui, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|U]. Devemos ficar aqui um tempo e nos divertir até ficarmos estúpidos de alegria!\""
 tour_travel.9030.t:0 "O Covil do Pecado"
 tour_travel.9040.a.failure:0 "Você é zombado"
 tour_travel.9040.a.success:0 "Os camponeses cantam louvores à sua história"
 tour_travel.9040.a:0 "Eu devo defender minha lenda!"
 tour_travel.9040.b:0 "Claramente a história apenas passou por cima da cabeça [peasant.GetHerHim]."
 tour_travel.9040.desc:0 "Meu grupo faz uma pausa para descansar por um momento, e eu entro em algum estabelecimento humilde para me familiarizar adequadamente com os locais. Mantendo-me desconhecido, eu escuto as conversas animadas da classe inferior.\n\n[Select_CString( peasant.IsFemale, 'Uma', 'Um' )] [peasant.GetWomanMan] está se divertindo com seus companheiros, trocando histórias de seus heróis lendários favoritos. \"...e que tal este [ROOT.Char.GetPromotedLegend.GetProtagonist.GetName]? Não tenho certeza se [ROOT.Char.GetPromotedLegend.GetProtagonist.GetSheHe] sequer existiu, quanto mais o resto dessa lorota '[ROOT.Char.GetPromotedLegend.GetName]'!\""
 tour_travel.9040.t:0 "O Maior Herói"
