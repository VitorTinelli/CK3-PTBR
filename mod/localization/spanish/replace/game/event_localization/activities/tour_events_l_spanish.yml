 host_dinner_1091_murder_succesful:0 "Você envenenou seu [visiting_liege.GetTitleAsNameNoTooltip]"
 host_dinner_3120_gift_refused:0 "[stop_host_scope.GetFirstName] recusa o presente"
 host_dinner_3120_gift_taken:0 "[stop_host_scope.GetFirstName] pegou o presente"
 host_dinner_begins_tt:0 "$tour_begin_dinner_tt$"
 host_dinner_events.1001.a:0 "\"Reabasteçam as reservas!\""
 host_dinner_events.1001.b:0 "Você já bebeu o suficiente!"
 host_dinner_events.1001.c:0 "Talvez seja hora de mudar de local."
 host_dinner_events.1001.d:0 "Eu as reabastecerei... em troca de um favor."
 host_dinner_events.1001.desc:0 "Tenho me divertido com [visiting_liege.GetName], nossa noite até agora tem sido repleta de alegrias embriagadas e brincadeiras. Embora talvez pareça que fui muito generoso com minhas reservas de álcool, um servo discretamente me informa que a última gota de [ROOT.Char.Custom('RegionalAlcoholicDrink')] foi esvaziada!\n\nMeu senhor feudal se senta impaciente do outro lado da mesa, vermelho como um recém-nascido, batendo a taça contra a mesa.\n\n\"Vamos lá! A noite é jovem! Onde está a bebida?\""
 host_dinner_events.1001.didnt_replenish_stores:0 "[stop_host_scope.GetName] repreendeu sua bebida"
 host_dinner_events.1001.replenished_stores:0 "[stop_host_scope.GetName] reabasteceu as reservas de álcool"
 host_dinner_events.1001.title:0 "Um Jantar Seco"
 host_dinner_events.1002.a:0 "Você realmente se superou, [stop_host_scope.GetFirstNameNoTooltip]!"
 host_dinner_events.1002.b:0 "Vamos mostrar um pouco de moderação."
 host_dinner_events.1002.c:0 "Vou beber até morrer."
 host_dinner_events.1002.desc:0 "Meu anfitrião, [stop_host_scope.GetName], me tirou de sua casa para uma taverna local. Ao meu redor, vejo os miseráveis e fracos envolvidos em bebida e devassidão, mas [Select_CString( stop_host_scope.IsFemale, 'a', 'o' )] [stop_host_scope.GetTitledFirstNameNoTooltip] me assegura que a [ROOT.Char.Custom('RegionalAlcoholicDrink')] servida neste estabelecimento é simplesmente divina.\n\nAo saborear o primeiro gole, sinto-me vivo. A bebida atinge como uma tonelada de tijolos, e sinto que esta será uma noite de festa sem fim."
 host_dinner_events.1002.title:0 "Uma ou Duas Canecas"
 host_dinner_events.1003.a:0 "Vamos encenar uma assombração!"
 host_dinner_events.1003.b:0 "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] sempre é um ótimo presente!"
 host_dinner_events.1003.c:0 "Bolos de haxixe irão agradar [visiting_liege.GetSheHe]."
 host_dinner_events.1003.d:0 "O toque de uma concubina é uma ótima maneira de acordar."
 host_dinner_events.1003.desc:0 "[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] finalmente se recolheu para a noite e está descansando tranquilamente em seu quarto, sem dúvida sonhando em esvaziar ainda mais minhas reservas de comida e bebida que restaram.\n\nEsta é talvez uma boa oportunidade para surpreender meu senhor feudal. Talvez com algum entretenimento noturno, ou algo agradável para [visiting_liege.GetSheHe] acordar..."
 host_dinner_events.1003.e:0 "Minha companhia certamente agradará [visiting_liege.GetSheHe]."
 host_dinner_events.1003.title:0 "Um [visiting_liege.GetTitleAsNameNoTooltip|U] Adormecido"
 host_dinner_events.1004.a:0 "Gritar por ajuda!"
 host_dinner_events.1004.b:0 "Barricar a porta!"
 host_dinner_events.1004.c:0 "Que divertido!"
 host_dinner_events.1004.d:0 "[stop_host_scope.GetFirstNameNoTooltip] perturbou meu sono por isso?"
 host_dinner_events.1004.desc.cynic:0 "Meu medo imediatamente se dissipa quando vejo que não passa de um servo com um lençol fino sobre ele. Ele faz barulhos e chama meu nome, mas até mesmo uma criança poderia dizer que isso não é um espírito.\n\nEssa é a tentativa de humor de [stop_host_scope.GetName], sem dúvida."
 host_dinner_events.1004.desc.ghost:0 "Juro que vejo, de pé no final do longo corredor escuro, algum tipo de espírito maligno. Ele sussurra para mim, chamando meu nome, talvez desejando me arrastar para [ROOT.Char.GetFaith.NegativeAfterLife]! Seja o que for que ele queira, devo agir para me salvar!"
 host_dinner_events.1004.desc.intro:0 "Eu descanso tranquilamente no melhor quarto [Select_CString( stop_host_scope.IsFemale, 'da', 'do' )] [stop_host_scope.GetTitledFirstName], sem brigas ou preocupações em minha mente. No entanto, sou arrancado de meu sono sem sonhos por uma gargalhada alta e ameaçadora vinda do final do corredor.\n\nEu saio relutantemente, minha mão trêmula balançando a vela na luz fraca, e olho para baixo no corredor."
 host_dinner_events.1004.enjoyed_spooky_ghost:0 "[visiting_liege.GetName] gostou da brincadeira"
 host_dinner_events.1004.hooked_me:0 "[stop_host_scope.GetName] baniu o espírito."
 host_dinner_events.1004.mocked_me:0 "Estou sendo ridicularizado"
 host_dinner_events.1004.title:0 "Um Despertar Assustador"
 host_dinner_events.1005.a:0 "Que tolo!"
 host_dinner_events.1005.b:0 "Posso banir esse espírito, em troca de um favor."
 host_dinner_events.1005.c:0 "Desapareça, espírito!"
 host_dinner_events.1005.desc:0 "Parece que minha brincadeira funcionou um pouco demais, pois ouço [visiting_liege.GetName] gritando como [Select_CString( visiting_liege.IsFemale, 'uma', 'um' )] [visiting_liege.Custom('GirlBoy')] e me chamando para ajudar [visiting_liege.GetSheHe].\n\nCorro rapidamente em direção ao quarto [visiting_liege.GetHerHim] e encontro [visiting_liege.GetSheHe] pálido como um lençol, apontando para o 'fantasma' no final do corredor.\n\n\"Oh, graças a Deus você está aqui! Há um espírito maligno tentando me arrastar para [visiting_liege.GetFaith.NegativeAfterLife]!\""
 host_dinner_events.1005.title:0 "O Fantasma de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 host_dinner_events.1006.a:0 "Que forma maravilhosa de acordar."
 host_dinner_events.1006.b:0 "Suma da minha vista!"
 host_dinner_events.1006.desc.alcohol:0 "Um barril inteiro de [stop_host_scope.Custom('RegionalAlcoholicDrink')] repousa ao meu lado como um amante, oscilando e rangendo com cada leve movimento que faço."
 host_dinner_events.1006.desc.hedonist:0 "Sinto o toque familiar de um[Select_CString( concubine_scope.IsFemale, 'a', '' )] [concubine_scope.GetWomanMan] deslizando seu dedo de forma curiosa pelo meu peito."
 host_dinner_events.1006.desc.intro:0 "Emerjo do meu sono após mais uma noite tranquila na companhia de [stop_host_scope.GetName]. Conforme recupero minha consciência, sinto algo pesado ao meu lado que não estava ali antes.\n\n"
 host_dinner_events.1006.desc.outro:0 "\n\nEste presente certamente é inesperado, mas será realmente uma coisa tão agradável para acordar?"
 host_dinner_events.1006.desc.vanity:0 "Me viro e vejo [stop_host_scope.GetFirstNameNoTooltip] sentado(a) na ponta da minha cama, totalmente vestido(a).\n\n\"Bom dia, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip]. Pensei que seria prudente lhe dar um presente, e que presente melhor há do que o presente da minha conversa?\""
 host_dinner_events.1006.desc.weed:0 "Ao meu lado, há bolos de haxixe suficientes para eu comer meu próprio peso se assim desejar!"
 host_dinner_events.1006.liked_gift:0 "[visiting_liege.GetTitledFirstName] gostou do presente."
 host_dinner_events.1006.refused_gift:0 "[visiting_liege.GetTitledFirstName] ficou insultad[Select_CString( visiting_liege.IsFemale, 'a', 'o' )]."
 host_dinner_events.1006.title:0 "Chamada de Despertar Inesperada"
 host_dinner_events.1007.a:0 "Uma peça sobre guerra, é claro!"
 host_dinner_events.1007.b:0 "Uma comédia sobre a morte do inimigo odiado(a) [visiting_liege.GetHerHim]!"
 host_dinner_events.1007.c:0 "[visiting_liege.GetSheHe|U] será tocado(a) por uma tragédia."
 host_dinner_events.1007.d:0 "Algo sobre as alegrias do casamento!"
 host_dinner_events.1007.desc:0 "Ultimamente, [visiting_liege.GetName] está ficando entediado(a) e desanimado(a) em minha presença, muitas vezes parecendo estar à beira do mundo desperto.\n\nUm pensamento surge em minha mente enquanto observo [visiting_liege.GetSheHe] brincando com a comida de forma distraída. [visiting_liege.GetSheHe|U] viveu uma vida plena, talvez [visiting_liege.GetSheHe] se sinta lisonjeado(a) se recriarmos uma de suas famosas façanhas na forma de uma peça de teatro!\n\nA única questão é: que tipo de peça [visiting_liege.GetNameNoTooltip] acharia mais divertida?"
 host_dinner_events.1007.disliked_performance:0 "[visiting_liege.GetFirstName] não gostou da apresentação"
 host_dinner_events.1007.e:0 "Isso é uma ideia terrível."
 host_dinner_events.1007.enjoyed_performance:0 "[visiting_liege.GetFirstName] apreciou a apresentação"
 host_dinner_events.1007.title:0 "Uma Performance Memorável"
 host_dinner_events.1008.a:0 "Que maravilha!"
 host_dinner_events.1008.b:0 "Isso é um insulto!"
 host_dinner_events.1008.desc.intro:0 "Parece que [stop_host_scope.GetName] decidiu fazer uma apresentação para me divertir esta noite. Sento-me à mesa do banquete, esperando ansiosamente pelo meu entretenimento, quando"
 host_dinner_events.1008.desc.mid.dead_positive_relation_memory:0 "[stop_host_scope.GetNameNoTooltip] aparece vestido(a) como meu amado [dead_relation.GetName].\n\n\"Ai, passo para [dead_positive_relation_memory_scope.dead_relation.GetFaith.PositiveAfterLife|U]. Penso apenas em [visiting_liege.GetNameNoTooltip] e em todos os momentos maravilhosos que tivemos juntos.\"\n\nUma apresentação trágica e comovente recriando o momento [memory_performance_scope.GetDescription]."
 host_dinner_events.1008.desc.mid.dead_rival_memory:0 "[stop_host_scope.GetNameNoTooltip] aparece com maquiagem desagradável e vestido(a) precariamente.\n\n\"Oh, ai de mim! Não posso mais suportar minha existência mortal. Maldição, nunca mais humilharei [visiting_liege.GetNameNoTooltip]!\"\n\nA apresentação envolve muitos sons de movimentos intestinais e sons doloridos zombeteiros, uma recriação do momento [memory_performance_scope.GetDescription]."
 host_dinner_events.1008.desc.mid.marriage_memory:0 "[stop_host_scope.GetNameNoTooltip] aparece vestido(a) quase exatamente como [spouse.GetName] estava no dia do nosso casamento.\n\n\"Verdadeiramente, este é o melhor dia da minha vida! Estou prestes a me casar com o maravilhoso [visiting_liege.GetNameNoTooltip]!\"\n\nSou convidado(a) a subir ao palco para entregar minha mão a [stop_host_scope.GetName], mas"
 host_dinner_events.1008.desc.mid.war_memory:0 "[stop_host_scope.GetNameNoTooltip] aparece diante de mim vestido(a) com armadura.\n\n\"Eis-me aqui! Sou o poderoso [loser.GetName] e levarei o vil [visiting_liege.GetNameNoTooltip] para o encontro com seu criador pessoalmente!\"\n\nAntes que eu possa responder, uma espada de madeira é colocada em minhas mãos. Sem dúvida, essa é uma encenação da vez em que [memory_performance_scope.GetDescription]."
 host_dinner_events.1008.desc.outro:0 "Eu me pergunto, devo me render a isso?"
 host_dinner_events.1008.title:0 "$host_dinner_events.1007.title$"
 host_dinner_events.1009.a:0 "Traga os bolos!"
 host_dinner_events.1009.b:0 "Tenho certeza de que [ROOT.Char.Custom('GetExpensiveDessert')] estará bem."
 host_dinner_events.1009.desc:0 "Ao terminarmos nossos pratos principais, olho com expectativa para [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] em busca de elogios e aprovação, apenas para encontrar um olhar expectante em seus olhos. Claramente, o que eu ofereci não é suficiente para meu estimado convidado, mas os cozinheiros já fizeram tudo o que lhes pedi e não posso ter certeza se temos algo mais para servir.\n\nEntão, o pensamento me ocorre de que ainda tenho um tesouro poderoso de bolos de haxixe em minha despensa, prontos para serem saboreados! A única pergunta é: estou [Select_CString( ROOT.Char.IsFemale, 'disposta', 'disposto' )] a compartilhar essa delícia com [Select_CString( visiting_liege.IsFemale, 'minha', 'meu' )] [visiting_liege.GetTitleAsNameNoTooltip|U]?"
 host_dinner_events.1009.didnt_enjoy_weed:0 "[visiting_liege.GetFirstName] não gostou do haxixe"
 host_dinner_events.1009.enjoyed_weed:0 "[visiting_liege.GetFirstName] apreciou o haxixe"
 host_dinner_events.1009.title:0 "Sua Alteza"
 host_dinner_events.1010.a:0 "Eu vou comer todos eles!"
 host_dinner_events.1010.b:0 "Jamais faria isso!"
 host_dinner_events.1010.desc:0 "Ao terminar minha refeição mais recente, não consigo deixar de sentir que há um vazio em meu estômago onde alguma sobremesa deveria estar. Parece que [stop_host_scope.GetName] lê minha mente, pois antes mesmo de eu ter a oportunidade de reclamar, [stop_host_scope.GetSheHe] chama um servo para trazer os 'bolos especiais' [stop_host_scope.GetHerHim].\n\n\"Nada além dos melhores bolos de haxixe para [Select_CString( visiting_liege.IsFemale, 'minha', 'meu' )] [visiting_liege.GetTitleAsNameNoTooltip|U]!\" [stop_host_scope.GetSheHe] diz enquanto uma verdadeira montanha daquela coisa é depositada em meu prato."
 host_dinner_events.1010.title:0 "Minha Alteza"
 host_dinner_events.1011.a:0 "Isso me tornaria bem visto(a) por [visiting_liege.GetSheHe]."
 host_dinner_events.1011.b:0 "Tenho certeza de que [visiting_liege.GetSheHe] não esqueceria desse favor tão cedo..."
 host_dinner_events.1011.c:0 "Enquanto [visiting_liege.GetSheHe] estiver aqui, [visiting_liege.GetSheHe] vai comer à nossa maneira!"
 host_dinner_events.1011.desc.intro:0 "Enquanto [visiting_liege.GetName] ocupa seu assento para mais uma noite de maravilhosa culinária [ROOT.Char.GetPrimaryTitle.GetAdjective], não posso deixar de perceber que [visiting_liege.GetSheHe] deve estar ficando cansado(a) de nossa comida.\n\n"
 host_dinner_events.1011.desc.vegetarian:0 "Servimos apenas os vegetais que [ROOT.Char.GetFaith.CreatorName] nos fornece, nunca a carne de aves ou animais, mas em [visiting_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], eles fazem as coisas de maneira um pouco diferente. Devo comprometer minhas crenças para ser um anfitrião mais receptivo? Devo adicionar carne ao menu?"
 host_dinner_events.1011.desc:0 "Comemos carne liberalmente, mas em [visiting_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], tal coisa é totalmente proibida. Até agora, [visiting_liege.GetName] parece estar comendo o que é fornecido, mas deixando de lado qualquer carne, o que resulta em uma refeição incompleta para [Select_CString( visiting_liege.IsFemale, 'minha', 'meu' )] [visiting_liege.GetTitleAsNameNoTooltip|U]! Será que posso permitir que isso continue? Talvez todos devamos adotar uma dieta sem carne enquanto o(a) [visiting_liege.GetTitleAsNameNoTooltip|U] estiver aqui."
 host_dinner_events.1011.title:0 "Diferenças Alimentares"
 host_dinner_events.1020.a:0 "Um forte, é claro!"
 host_dinner_events.1020.b:0 "O [visiting_liege.GetFaith.ReligiousSymbol] ficaria excelente!"
 host_dinner_events.1020.c:0 "Talvez uma certa parte da anatomia humana..."
 host_dinner_events.1020.d:0 "Isso é uma ideia terrível."
 host_dinner_events.1020.desc:0 "Outra noite, outra sobremesa, e posso perceber que [visiting_liege.GetName] já está ficando cansado(a) de nossa [ROOT.Char.Custom('GetExpensiveDessert')]. Talvez esta seja a noite para fazer algo um pouco diferente.\n\nTalvez uma solução para esse dilema seja pedir aos meus cozinheiros e padeiros para prepararem uma sobremesa em formato de algo que signifique muito para meu caro senhor feudal. Talvez um forte para simbolizar a habilidade [visiting_liege.GetHerHim], ou algo que [visiting_liege.GetSheHe] nunca esperaria..."
 host_dinner_events.1020.hates_it:0 "[visiting_liege.GetFirstName] odeia o bolo"
 host_dinner_events.1020.likes_it:0 "[visiting_liege.GetFirstName] adora isso"
 host_dinner_events.1020.title:0 "Um Bolo para Lembrar"
 host_dinner_events.1021.a:0 "Vou me lembrar disso!"
 host_dinner_events.1021.b:0 "Te devo uma!"
 host_dinner_events.1021.desc.intro:0 "Eu me sento à mesa de jantar, aguardando minha sobremesa, e quando ela finalmente chega, mal consigo conter minha alegria!\n\n"
 host_dinner_events.1021.desc.mid.castle:0 "Um delicioso bolo em forma de forte [ROOT.Char.GetCulture.GetName] é colocado na minha frente. A coisa é tão autêntica que consigo imaginar pequenos invasores melados tentando invadir as paredes da minha sobremesa."
 host_dinner_events.1021.desc.mid.lewd:0 "Não consigo mais me segurar e começo a rir incontrolavelmente quando o pilar de bolo na cor da pele é colocado à minha frente. Há todo tipo de detalhes obscenos nessa monstruosidade que tenho certeza que até mesmo [ROOT.Char.GetFaith.DevilName] coraria!"
 host_dinner_events.1021.desc.mid.lewd_woman:0 "Não consigo mais me segurar e começo a rir incontrolavelmente quando essas duas esferas tremulantes de sobremesa são colocadas à minha frente, com duas 'mamilos' frutados no topo. Há todo tipo de detalhes obscenos nessa confeição que tenho certeza que até mesmo [ROOT.Char.GetFaith.DevilName] coraria!"
 host_dinner_events.1021.desc.mid.religious:0 "Uma confeição piedosa em forma do [ROOT.Char.GetFaith.ReligiousSymbol] é deslizada até mim em um prato ornamentado. A coisa é tão decorada com detalhes intricados que é como se o próprio [ROOT.Char.GetFaith.CreatorName] tivesse feito só para mim!"
 host_dinner_events.1021.desc.outro:0 "\n\nClaro que eu amo isso, mas a única questão é: como posso mostrar melhor minha apreciação?"
 host_dinner_events.1021.title:0 "$host_dinner_events.1020.title$"
 host_dinner_events.1022.a:0 "Ah, eu adoro isso!"
 host_dinner_events.1022.b:0 "Como ousa!"
 host_dinner_events.1022.desc.intro:0 "Eu me sento à mesa de jantar, aguardando minha sobremesa, e quando ela finalmente chega, mal consigo conter minha raiva!\n\n"
 host_dinner_events.1022.desc.mid.castle:0 "Estou chocado ao ver o que supostamente é um bolo em forma de forte [ROOT.Char.GetCulture.GetName] caído miseravelmente sob o seu próprio peso no meu prato. Isso é algum tipo de insulto à minha habilidade?"
 host_dinner_events.1022.desc.mid.lewd:0 "O que vejo é uma repugnante protuberância cor de pele em cima de um prato, claramente moldada na forma de uma parte do corpo obscena. [stop_host_scope.GetName] espera que eu seja tentado por essa vulgaridade?"
 host_dinner_events.1022.desc.mid.religious:0 "Estou chocado ao ver o que parece ser um bolo em forma do [ROOT.Char.GetFaith.ReligiousSymbol]! Essa demonstração culinária de blasfêmia me deixa enjoado(a) a ponto de mal conseguir tocá-lo."
 host_dinner_events.1022.desc.outro:0 "\n\nSó consigo me sentir insultado(a) ao olhar para essa coisa, mas pelos olhos de filhote de [stop_host_scope.GetFirstNameNoTooltip], consigo perceber que essa foi uma tentativa sincera de agradar."
 host_dinner_events.1022.title:0 "$host_dinner_events.1020.title$"
 host_dinner_events.1030.a:0 "\"Guardas! Removam esse tolo imediatamente!\""
 host_dinner_events.1030.b:0 "Talvez eu possa removê-los para obter alguma vantagem."
 host_dinner_events.1030.c:0 "[rival_scope.GetFirstNameNoTooltip] é hilário! Devemos conversar!"
 host_dinner_events.1030.desc:0 "Outro jantar foi preparado para meu senhor feudal durante a estadia [visiting_liege.GetHerHim]. Parece ser um verdadeiro sucesso! [visiting_liege.GetName] parece estar salivando só de olhar para ele, e bem quando [visiting_liege.GetSheHe] está prestes a dar a primeira mordida, [rival_scope.Custom2('NamePossessiveCharacterIntroduction', visiting_liege)] invade a sala de jantar e se aproxima da comida de seu(a) inimigo(a).\n\n\"Que festim temos aqui! Uma pena que será desperdiçado na língua pútrida de um(a) vilão/vilã tão infame como [visiting_liege.GetTitleAsNameNoTooltip]!\"\n\nO humor de [visiting_liege.GetNameNoTooltip] imediatamente se deteriora, e se eu não fizer nada, em breve meu jantar pode se transformar em uma briga de socos."
 host_dinner_events.1030.liege_refuses:0 "[visiting_liege.GetFirstName] recusa o anzol"
 host_dinner_events.1030.title:0 "Um Convidado Indesejado"
 host_dinner_events.1031.a:0 "Sim, sim, qualquer coisa!"
 host_dinner_events.1031.b:0 "Já enfrentei coisas piores."
 host_dinner_events.1031.desc.intro:0 "Outro jantar foi preparado para mim durante a minha estadia, e parece ser um verdadeiro sucesso! Salivo só de olhar para esse prato suculento e fumegante, e bem quando estou prestes a dar a primeira mordida, uma voz irritantemente familiar perfura meus tímpanos.\n\n[rival_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] chegou para estragar meu apetite, e a mera presença [rival_scope.GetHerHim] está me deixando furioso(a)."
 host_dinner_events.1031.desc:0 "\n\n[stop_host_scope.GetName] se ofereceu para remover ess[Select_CString( rival_scope.IsFemale, 'a', 'e' )] [rival_scope.Custom2('InsultNoun', ROOT.Char)] problemátic[Select_CString( rival_scope.IsFemale, 'a', 'o' )], mas sinto que [stop_host_scope.GetSheHe] tem uma intenção oculta."
 host_dinner_events.1031.title:0 "$host_dinner_events.1030.title$"
 host_dinner_events.1032.a:0 "[stop_host_scope.GetFirstNameNoTooltip] está jogando um jogo perigoso."
 host_dinner_events.1032.b:0 "Devo virar a outra face."
 host_dinner_events.1032.desc:0 "\n\nO que piora as coisas é que [stop_host_scope.GetName] parece jubilante com o meu infortúnio e até começou a rir e brincar com um inimigo jurado da coroa!"
 host_dinner_events.1032.title:0 "$host_dinner_events.1030.title$"
 host_dinner_events.1040.a:0 "Vamos jogar!"
 host_dinner_events.1040.b:0 "Melhor não."
 host_dinner_events.1040.desc:0 "Os banquetes têm vindo e ido todas as noites desde a chegada de [visiting_liege.GetName], e toda noite, depois de comer o suficiente, [visiting_liege.GetSheHe] desaparece para o quarto para o resto da noite, deixando-me apenas com meus pensamentos.\n\nUltimamente, porém, tenho sentido a vontade de tirar o antigo tabuleiro de xadrez e fazer uma aposta com [Select_CString( visiting_liege.IsFemale, 'minha', 'meu' )] [visiting_liege.GetTitleAsNameNoTooltip|U]. Ainda não decidi exatamente o que seria o prêmio, mas tenho certeza de que podemos pensar em algo."
 host_dinner_events.1040.title:0 "Jogos Entediantes"
 host_dinner_events.1041.a:0 "É a minha jogada, [stop_host_scope.GetFirstNameNoTooltip]."
 host_dinner_events.1041.b:0 "Não vou arruinar minha noite com isso."
 host_dinner_events.1041.desc:0 "Ao terminar minha refeição, outro tabuleiro é colocado na minha frente, mas desta vez, em vez de comida, ele é coberto por pequenas peças de jogo.\n\n\"Meu senhor, com certeza você sabe que sou famoso como um dos melhores jogadores de xadrez do [stop_host_scope.GetPrimaryTitle.GetNameNoTierNoTooltip]! Mas gostaria de jogar não apenas por diversão, talvez possamos tornar as coisas interessantes fazendo uma aposta...\"\n\n[stop_host_scope.GetName] sorri para mim, brincando com uma peça entre os dedos, ansioso por uma partida."
 host_dinner_events.1041.title:0 "O Desafio"
 host_dinner_events.1042.a.bad:0 "Droga!"
 host_dinner_events.1042.a:0 "Excelente."
 host_dinner_events.1042.desc.loser:0 "Enquanto o rei tomba, o vencedor é declarado.\n\nFui completamente derrotado por [bg_victor.GetName], e o prêmio indeterminado [bg_victor.GetHerHim] está pronto para ser escolhido a qualquer momento."
 host_dinner_events.1042.desc:0 "Enquanto o rei tomba, o vencedor é declarado.\n\nEu conquistei meu favor com [bg_loser.GetName] e meu prêmio indeterminado está pronto para ser escolhido a qualquer momento."
 host_dinner_events.1042.title:0 "O Favor"
 host_dinner_events.1050.a:0 "Pão e água serão suficientes."
 host_dinner_events.1050.b:0 "Podemos comprar algo melhor."
 host_dinner_events.1050.c:0 "Tenho conexões que posso usar!"
 host_dinner_events.1050.desc:0 "Meus cozinheiros me informaram que os suprimentos de comida parecem estar se esgotando e muitos dos meus ingredientes mais caros e exóticos já acabaram há muito tempo.\n\nSeria preciso uma pequena fortuna para reabastecer os suprimentos de comida, e sinto meu coração palpitar nervosamente apenas com a ideia de comprar apenas pão e manteiga. [visiting_liege.GetName] pode ficar desapontado com nossa modesta refeição esta noite, mas posso me permitir fazer algo mais?"
 host_dinner_events.1050.title:0 "Suprimentos Vazios"
 host_dinner_events.1060.a:0 "Um coração digno de um [visiting_liege.GetTitleAsNameNoTooltip|U]!"
 host_dinner_events.1060.b:0 "Eu mesmo comerei o coração."
 host_dinner_events.1060.desc.cannibal_legal:0 "É claro, como [ROOT.Char.GetTitleAsNameNoTooltip|U], [dead_soldier.GetSheHe] lutou e morreu por mim, tenho o direito de consumir o coração [dead_soldier.GetHerHim] e assim adquirir o espírito guerreiro,"
 host_dinner_events.1060.desc.intro:0 "Fui informado que recentemente um dos maiores soldados de minha comitiva faleceu, mas seu corpo permaneceu imaculado, sem manchas de ferimentos ou doenças.\n\n"
 host_dinner_events.1060.desc.outro:0 "mas como [Select_CString( visiting_liege.IsFemale, 'minha', 'meu' )] [visiting_liege.GetTitleAsNameNoTooltip|U] está visitando, talvez eu deva dar a [visiting_liege.GetSheHe] a honra de consumir o coração de um dos melhores guerreiros de [ROOT.Char.GetPrimaryTitle.GetAdjective]!"
 host_dinner_events.1060.desc.secret_cannibal:0 "Embora minhas tendências canibais sejam desconhecidas para o mundo em geral, alguns de meus servos confiáveis já extraíram o coração [dead_soldier.GetHerHim] para meu consumo,"
 host_dinner_events.1060.title:0 "Bom Apetite"
 host_dinner_events.1061.a:0 "Delicioso!"
 host_dinner_events.1061.b:0 "Não, tudo bem."
 host_dinner_events.1061.desc.cannibal_legal:0 "Parece absolutamente requintado, cozido à perfeição e tão macio que nem preciso pegar minha faca."
 host_dinner_events.1061.desc.intro:0 "Minha próxima refeição me é revelada. Sentado em um prato fino está um coração assado lentamente, mergulhado em um molho de sangue.\n\n\"O coração de um poderoso guerreiro, [Select_CString( visiting_liege.IsFemale, 'minha', 'meu' )] [visiting_liege.GetTitleAsNameNoTooltip|U]! Coma-o, e você também possuirá a bravura e o espírito que [dead_soldier.GetSheHe] tinha.\"\n\n"
 host_dinner_events.1061.desc.mid:0 "Quase engasgo ao ver aquilo! Certamente [stop_host_scope.GetName] não quer dizer que isso é carne humana!#!"
 host_dinner_events.1061.desc.outro:0 "Meu anfitrião olha para mim com expectativa e empurra delicadamente o prato na minha direção."
 host_dinner_events.1061.desc.secret_cannibal:0 "Não tenho escolha senão fingir choque e desconforto diante daquilo. Será que [stop_host_scope.GetName] de alguma forma sabe do meu segredo?"
 host_dinner_events.1061.liege_ate_heart:0 "[visiting_liege.GetFirstName] comeu o coração"
 host_dinner_events.1061.liege_refused_heart:0 "[visiting_liege.GetName] recusou"
 host_dinner_events.1061.title:0 "$host_dinner_events.1060.title$"
 host_dinner_events.1070.a:0 "\"Claro, junte-se a mim!\""
 host_dinner_events.1070.b:0 "\"Não.\""
 host_dinner_events.1070.desc:0 "Não dei muita importância quando coloquei [runaway_courtier.GetName] ao meu lado esta noite, mas conforme os pratos vão e vêm, fico cada vez mais intrigado por ess[Select_CString( runaway_courtier.IsFemale, 'a', 'e' )] [runaway_courtier.GetWomanMan] interessante.\n\n\"Ah, se ao menos a vida fosse tão interessante na capital. Na maioria dos dias, apenas fico deitado na corte, cansado e preguiçoso. Aqui, não falta boa conversa. Você me receberia em sua corte?\""
 host_dinner_events.1070.title:0 "Potencial Desperdiçado"
 host_dinner_events.1071.a:0 "\"[runaway_courtier.GetNameNoTooltip] é meu!\""
 host_dinner_events.1071.b:0 "\"Vá para onde seu coração desejar.\""
 host_dinner_events.1071.desc:0 "[runaway_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproximou de mim afirmando ter recebido permissão de [stop_host_scope.GetName] para vir se juntar à corte no lugar da minha.\n\nDeixar isso passar certamente melhoraria minha relação com o [stop_host_scope.GetTitleAsNameNoTooltip|U], mas o insulto de roubar membros da minha corte é algo que realmente posso ignorar?"
 host_dinner_events.1071.refused_to_let_them_go:0 "[visiting_liege.GetName] recusou deixar [runaway_courtier.GetName] ir"
 host_dinner_events.1071.title:0 "Troca Cortesã"
 host_dinner_events.1080.a:0 "[visiting_liege.GetSheHe|U] não merece menos."
 host_dinner_events.1080.b:0 "Estou acima disso."
 host_dinner_events.1080.desc:0 "Não é segredo que considero [visiting_liege.GetName] um[Select_CString( pie_eater_scope.IsFemale, 'a', '' )] [visiting_liege.Custom2('InsultNoun', ROOT.Char)] [visiting_liege.Custom2('InsultAdjective', ROOT.Char)], e mesmo assim o tolo veio desonrar meus salões. Reluto em permanecer na companhia [visiting_liege.GetHerHim] enquanto [visiting_liege.GetSheHe] engole minha comida, mas então uma ideia me ocorre.\n\nEu poderia tornar a visita [visiting_liege.GetHerHim] inesquecível se fizer um show da vilania [visiting_liege.GetHerHim]!"
 host_dinner_events.1080.title:0 "Uma Performance Vilanesca"
 host_dinner_events.1081.a:0 "Eu terei minha vingança."
 host_dinner_events.1081.b:0 "É bem engraçado..."
 host_dinner_events.1081.desc:0 "Como é típico, minha refeição vem acompanhada de entretenimento. Os atores realizam grandes proezas de acrobacia e habilidade, mas então começo a notar algo. Durante a apresentação, há um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] vestida como eu, com o rosto sujo de algo parecido com excremento, cantando músicas sobre minha suposta maldade!\n\nOlho com choque para [stop_host_scope.GetName] apenas para vê-la rindo desse espetáculo vulgar! Não consigo tocar minha comida, assistindo e ouvindo enquanto toda a corte ri dessa zombaria distorcida do meu caráter."
 host_dinner_events.1081.liked_performance:0 "[visiting_liege.GetName] gostou da apresentação"
 host_dinner_events.1081.title:0 "[ROOT.Char.GetFirstNameNoTooltip]: o Vilão do [stop_host_scope.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 host_dinner_events.1090.a:0 "Claro que posso!"
 host_dinner_events.1090.b:0 "A hora não é adequada."
 host_dinner_events.1090.desc:0 "Parece que uma oportunidade de ouro caiu em minhas mãos com a visita de [visiting_liege.GetName] aos meus salões.\n\n[visiting_liege.GetSheHe|U] espera uma refeição memorável, e com um pouco de beladona moída, posso garantir que [visiting_liege.GetSheHe] nunca mais experimentará um jantar como esse!\n\nO momento de agir se aproxima, será que eu realmente posso correr esse risco?"
 host_dinner_events.1090.title:0 "Veneno"
 host_dinner_events.1091.a:0 "Como... você pôde..."
 host_dinner_events.1091.desc:0 "Eu saboreio [Select_CString( stop_host_scope.IsFemale, 'minha', 'meu' )] [stop_host_scope.Custom('GetExpensiveDessert')] sem me importar, satisfeito com mais uma refeição maravilhosa em meu estômago.\n\nConforme subo as escadas em direção à cama, no entanto, começo a me sentir fraco, como se o sangue em meu corpo estivesse engrossando, quase coagulando em minhas veias. Antes mesmo de chegar ao topo das escadas, eu desabo, ofegante por ar. Enquanto o mundo ao meu redor escurece, a última coisa que vejo é [stop_host_scope.GetName] olhando para mim com um sorriso cúmplice."
 host_dinner_events.1091.title:0 "Veneno!"
 host_dinner_events.1092.a:0 "O vilão!"
 host_dinner_events.1092.desc:0 "Eu me volto para [Select_CString( stop_host_scope.IsFemale, 'minha', 'meu' )] [stop_host_scope.Custom('GetExpensiveDessert')] e começo a cavar, mas então uma sensação incômoda me assalta, fazendo minhas mãos ávidas pararem.\n\nEu mexo no doce e dou algumas cheiradas agudas, e não há dúvida em minha mente de que minha comida foi envenenada! Não há outra explicação, [stop_host_scope.GetName] está tentando me matar."
 host_dinner_events.1092.title:0 "Tentativa de Assassinato"
 host_dinner_events.1093.a:0 "\"Assassino!\""
 host_dinner_events.1093.desc:0 "Meu provador de comida leal, [food_taster_scope.GetName], desempenha seu dever. [food_taster_scope.GetSheHe|U] conclui sua inspeção com um sabor do meu [stop_host_scope.Custom('GetExpensiveDessert')] e me dá um pequeno aceno de aprovação.\n\nNo entanto, logo em seguida, [Select_CString( food_taster_scope.IsFemale, 'a', 'o' )] pobre [food_taster_scope.GetWomanMan] começa a sufocar e a tossir, lutando por ar e batendo com o punho na mesa. Em questão de segundos, os lábios azuis [food_taster_scope.GetHerHim] expelem seu último suspiro e eu fico sozinho com o sorriso inquietante de [stop_host_scope.GetName]."
 host_dinner_events.1093.title:0 "$host_dinner_events.1092.title$"
 host_dinner_events.3000.a:0 "Vamos começar!"
 host_dinner_events.3000.desc.intro:0 "Recebo uma recepção digna de um [ROOT.Char.GetTitleAsNameNoTooltip] nos portões de [stop_host_scope.Custom('FortifiedBuilding')] leal [Select_CString( stop_host_scope.IsFemale, 'da', 'do' )] [stop_host_scope.GetTitledFirstName] em [ROOT.Char.GetCurrentLocation.GetName],"
 host_dinner_events.3000.desc.mid.close_family:0 "É bom ver [Select_CString( stop_host_scope.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', stop_host_scope)]! Nos abraçamos formalmente, marcando publicamente os laços de família."
 host_dinner_events.3000.desc.mid.default:0 "Meu vassalo me recebe com toda a deferência necessária."
 host_dinner_events.3000.desc.mid.friend:0 "Já faz muito tempo desde que me sentei para jantar com um bom amigo! Os fardos do reino são esquecidos nesse espírito tão raramente!"
 host_dinner_events.3000.desc.mid.hates_vassal:0 "Aceitar a hospitalidade dest[Select_CString( visiting_liege.IsFemale, 'a', 'e' )] [visiting_liege.Custom2('InsultNoun', ROOT.Char)] [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] é o suficiente para destruir meu apetite; é melhor ter um pouco de [ROOT.Char.Custom('FavoriteTreat')]..."
 host_dinner_events.3000.desc.mid.house:0 "Esta é uma oportunidade rara de me divertir na boa companhia de um[Select_CString( stop_host_scope.IsFemale, 'a', '' )] [stop_host_scope.Custom('GetDaughterSon')] da Casa [ROOT.Char.GetHouse.GetBaseName]."
 host_dinner_events.3000.desc.mid.lover:0 "Manter tais formalidades com meu querido [stop_host_scope.Custom('RomanticComplimentNoun')] é um destino cruel - talvez eu o visite após o jantar..."
 host_dinner_events.3000.desc.mid.powerful_vassal:0 "É claro, também devo reconhecer a eminência [stop_host_scope.GetHerHim] entre os vassalos de [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], pelo menos publicamente..."
 host_dinner_events.3000.desc.mid:0 "\n\n[stop_host_scope.GetFirstNameNoTooltip] explica o banquete noturno planejado, prometendo que as diversões e iguarias oferecidas estarão próximas aos padrões dos jantares de minha própria corte."
 host_dinner_events.3000.desc.outro:0 "\n\n[stop_host_scope.GetName] me assegura que essa é apenas a comida mais fina que [stop_host_scope.GetSheHe] tem a oferecer."
 host_dinner_events.3000.desc.type.intimidation:0 "e minha aceitação fria, acompanhado por guardas fortemente armados, estabelece o tom desejado.\n\n"
 host_dinner_events.3000.desc.type.majesty:0 "e não há dúvida de que o esplendor de meu séquito causou uma grande impressão.\n\n"
 host_dinner_events.3000.desc.type.taxation:0 "meu vagão do tesouro e coletores de impostos deixando claro o objetivo de minha visita.\n\n"
 host_dinner_events.3000.title:0 "Preparando-se para o Jantar"
 host_dinner_events.3001.a:0 "Com prazer!"
 host_dinner_events.3001.b:0 "Devo contar isso imediatamente [Select_CString( stop_host_scope.IsFemale, 'a', 'ao' )] [stop_host_scope.GetTitledFirstNameNoTooltip]!"
 host_dinner_events.3001.c:0 "Não vou contar, mas você me deve um favor."
 host_dinner_events.3001.d:0 "Saia de cima de mim, prostituta sem vergonha!"
 host_dinner_events.3001.desc.into_it:0 "Fico surpreso(a) com as investidas [lusty_spouse_scope.GetHerHim], mas não consigo evitar que minhas mãos percorram o corpo [lusty_spouse_scope.GetHerHim]."
 host_dinner_events.3001.desc.intro:0 "Estou aproveitando meu jantar tranquilo com [stop_host_scope.GetName] e [Select_CString( lusty_spouse_scope.IsFemale, 'sua', 'seu' )] [stop_host_scope.Custom2('RelationToMeShort', lusty_spouse_scope)] [lusty_spouse_scope.GetName].\n\nPoucos momentos depois de [stop_host_scope.GetNameNoTooltip] se desculpar a [Select_CString( stop_host_scope.IsFemale, 'si mesma', 'si mesmo' )], [lusty_spouse_scope.GetNameNoTooltip] se lança sobre mim como um cachorro raivoso!"
 host_dinner_events.3001.desc.mid:0 "Fico paralisado(a) de choque, bastante alarmado(a) ao perceber que basta [stop_host_scope.GetFirstNameNoTooltip] sair da sala para que [lusty_spouse_scope.GetFirstNameNoTooltip] considere cometer adultério com a pessoa mais próxima."
 host_dinner_events.3001.desc.not_into_it:0 "Tento afastar ess[Select_CString( lusty_spouse_scope.IsFemale, 'a', 'e' )] [lusty_spouse_scope.Custom2('InsultAdjective', ROOT.Char)] degenerad[Select_CString( lusty_spouse_scope.IsFemale, 'a', 'o' )], mas [lusty_spouse_scope.GetSheHe] insiste em perturbar minha mente com pensamentos impuros."
 host_dinner_events.3001.desc.outro:0 "\n\n\"Oh, por favor, salve-me desse tédio! [stop_host_scope.GetFirstNameNoTooltip] não é meu amante, [stop_host_scope.GetSheHe] é tão afetuoso(a) quanto um pedaço de madeira. Leve-me e ame-me como [stop_host_scope.GetSheHe] nunca fez.\""
 host_dinner_events.3001.title:0 "Uma Proposta Interessante"
 host_dinner_events.3002.a:0 "Isso é motivo para divórcio."
 host_dinner_events.3002.b:0 "Vamos manter isso entre nós."
 host_dinner_events.3002.c:0 "Vou fingir que não ouvi isso."
 host_dinner_events.3002.d:0 "Nunca vou perdoar [lusty_spouse_scope.GetSheHe]."
 host_dinner_events.3002.desc:0 "Volto para o jantar após um breve intervalo e encontro [lusty_spouse_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] sentad[Select_CString( lusty_spouse_scope.IsFemale, 'a', 'o' )] desconfortavelmente com [visiting_liege.GetName].\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip], temo ter notícias terríveis. Enquanto você estava ausente, esse libertino desavergonhado tentou me envolver em relações adúlteras!\""
 host_dinner_events.3002.title:0 "[lusty_spouse_scope.GetFirstNameNoTooltip]: o Adúltero"
 host_dinner_events.3003.a:0 "Vamos lá!"
 host_dinner_events.3003.b:0 "Não deixarei essa sujeira tocar minha língua."
 host_dinner_events.3003.c.lieges_dog:0 "Talvez eu possa dar isso sorrateiramente para o cachorro de [stop_host_scope.GetFirstNameNoTooltip]..."
 host_dinner_events.3003.c.my_dog:0 "Talvez eu possa dar isso sorrateiramente para meu cachorro..."
 host_dinner_events.3003.delicious:0 "A iguaria estava incrível"
 host_dinner_events.3003.desc:0 "O jantar desta noite é um pouco diferente do que estou acostumado(a). O cozinheiro coloca descuidadamente a tigela na minha frente e imediatamente sou surpreendido(a) pelo aroma mais incomum que já senti em toda a minha vida.\n\nEsse prato das profundezas de [ROOT.Char.GetFaith.NegativeAfterLife] ofende todos os sentidos. Alguma substância cinza e viscosa repousa em seu caldo pálido e espumoso como um penico negligenciado, com um único ramo de erva colocado no topo em um esforço fútil de tornar a coisa apetitosa.\n\nTodo o meu instinto me instiga a lançar a coisa pela janela mais próxima, mas [stop_host_scope.GetNameNoTooltip] me assegura que é uma iguaria local digna de um(a) [ROOT.Char.GetTitleAsNameNoTooltip]."
 host_dinner_events.3003.disgusting:0 "A comida estava nojenta"
 host_dinner_events.3003.host_noticed:0 "[stop_host_scope.GetNameNoTooltip] percebeu"
 host_dinner_events.3003.title:0 "Uma Delícia Local"
 host_dinner_events.3003.unnoticed:0 "[stop_host_scope.GetNameNoTooltip] não percebeu"
 host_dinner_events.3004.a.caught:0 "Sua tentativa de injustiça foi percebida"
 host_dinner_events.3004.a.not_caught:0 "As palavras foram ditas e não podem ser desditas"
 host_dinner_events.3004.a:0 "Vamos fazer isso!"
 host_dinner_events.3004.awkward_convo:0 "A conversa foi constrangedora"
 host_dinner_events.3004.b:0 "Vou apenas conversar."
 host_dinner_events.3004.desc.intro:0 "Chego ao jantar mais cedo hoje e descubro que estou sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com o herdeiro de [stop_host_scope.GetName], [stop_host_heir.GetName]."
 host_dinner_events.3004.desc.mid.adult:0 "A natureza confiante [stop_host_heir.GetHerHim] é infame. Como uma criança, sua mente é vazia e moldável, e é fácil demais alinhar a mente frágil [stop_host_heir.GetHerHim] com a minha visão."
 host_dinner_events.3004.desc.mid.child:0 "[stop_host_heir.GetSheHe|U] ainda é jovem e parece intimidad[Select_CString( stop_host_heir.IsFemale, 'a', 'o' )] por compartilhar o espaço com o(a) [ROOT.Char.GetTitleAsNameNoTooltip] [stop_host_heir.GetHerHim]."
 host_dinner_events.3004.desc.outro:0 "\n\nSeria muito fácil manipular a pobre criatura para obter o compromisso legal de lealdade antecipada, mas isso certamente deixaria [stop_host_scope.GetNameNoTooltip] incomodado(a)."
 host_dinner_events.3004.friendly_convo:0 "Você teve uma conversa amigável"
 host_dinner_events.3004.title:0 "Uma Promessa Antecipada"
 host_dinner_events.3005.a:0 "Permitirei isso, em troca de um favor próprio."
 host_dinner_events.3005.b:0 "\"Parem com essa loucura imediatamente!\""
 host_dinner_events.3005.desc:0 "Entro no salão de jantar e encontro [visiting_liege.GetName] conversando com [stop_host_heir.Custom2('MyCharacterIntroduction', ROOT.Char)] sobre assuntos de Estado e obrigações.\n\n[visiting_liege.GetName] parece estar manipulando [stop_host_heir.GetSheHe] para fazer um juramento de lealdade à coroa na minha ausência! Tal juramento assombraria [stop_host_heir.GetSheHe] pelo resto de seus dias e consolidaria nosso futuro como subordinados de [visiting_liege.GetName]."
 host_dinner_events.3005.disallowed_hook:0 "Você foi pego(a)"
 host_dinner_events.3005.hook_for_hook:0 "[stop_host_scope.GetName] exige compensação"
 host_dinner_events.3005.title:0 "Um Melhor Futuro"
 host_dinner_events.3006.a:0 "Claro, venha comigo!"
 host_dinner_events.3006.b:0 "\"Eu apreciarei mais do que apenas a sua beleza.\""
 host_dinner_events.3006.c:0 "Posso ser um ombro para você chorar, pelo menos."
 host_dinner_events.3006.d:0 "\"Conheça o seu lugar, [runaway_courtier.Custom2('InsultNoun', ROOT.Char)]!\""
 host_dinner_events.3006.desc.intro:0 "Esta noite, estou sentado(a) ao lado de [runaway_courtier.Custom2('NamePossessiveCharacterIntroduction', stop_host_scope)], observando [runaway_courtier.GetSheHe] suspirar sobre o prato com anseio.\n\n"
 host_dinner_events.3006.desc.mid.concubine:0 "\"Ah, peço desculpas pela minha melancolia, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|U]. [stop_host_scope.GetNameNoTooltip] provavelmente me sentou ao seu lado para agradá-lo(a). [stop_host_scope.GetSheHe|U] é assim, [stop_host_scope.GetSheHe] me vê apenas como um objeto para ser admirado e brincar. Para ser sincero(a), tenho sonhado em voltar com você para [ROOT.Char.GetCapitalLocation.GetName].\""
 host_dinner_events.3006.desc.mid.neutral:0 "\"Verdadeiramente, estou cansado(a) da vida aqui em [stop_host_scope.GetCapitalLocation.GetName] e desejo elevar minha posição na vida. Meus talentos são desperdiçados aqui e, ultimamente, tenho pensado em fugir com você de volta para [ROOT.Char.GetCapitalLocation.GetName], onde posso realmente mostrar o meu valor!\""
 host_dinner_events.3006.desc.outro:0 "\n\nAs lamentações [runaway_courtier.GetHerHim] parecem genuínas, mas será que posso realmente roubar alguém da corte de [stop_host_scope.GetNameNoTooltip]?"
 host_dinner_events.3006.title:0 "Sonhos de uma Vida Melhor"
 host_dinner_events.3007.a:0 "Eu proíbo!"
 host_dinner_events.3007.b:0 "Deixe [runaway_courtier.GetSheHe] ir."
 host_dinner_events.3007.desc.intro:0 "Decidi que era uma boa ideia sentar [visiting_liege.GetName] ao lado de [runaway_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)], e parece ter sido bem recebido. Um pouco bom demais."
 host_dinner_events.3007.desc.mid.concubine:0 "\n\n[runaway_courtier.GetNameNoTooltip] se contorce quando [runaway_courtier.GetSheHe] me vê e desvia o olhar."
 host_dinner_events.3007.desc.mid.neutral:0 "\n\n[runaway_courtier.GetNameNoTooltip] revira os olhos quando [runaway_courtier.GetSheHe] me vê e prontamente desvia o olhar."
 host_dinner_events.3007.desc.outro:0 "[runaway_courtier.GetSheHe|U] parece determinado(a) a deixar minha corte e ir para [visiting_liege.GetName]! Posso impedir isso, mas certamente isso estragaria o clima do jantar."
 host_dinner_events.3007.refused_to_let_them_go:0 "[stop_host_scope.GetName] se recusou a deixar [runaway_courtier.GetSheHe] ir"
 host_dinner_events.3007.title:0 "O Cortesão Roubado"
 host_dinner_events.3008.a:0 "\"Você deve me contar imediatamente!\""
 host_dinner_events.3008.acting_sussy:0 "[stop_host_scope.GetName] está desconfiado(a) de você"
 host_dinner_events.3008.b:0 "\"Será que algumas moedas soltariam esses lábios?\""
 host_dinner_events.3008.c:0 "\"Você deveria manter a boca fechada.\""
 host_dinner_events.3008.desc:0 "É de manhã e emergo relutantemente para o mundo desperto quando o sol da manhã repentinamente atravessa minha visão. Vejo um servo se movendo desajeitadamente ao redor do meu quarto, instável enquanto [nervous_servant.GetSheHe] coloca meu café da manhã ao meu lado. Pergunto o que aflige [nervous_servant.GetSheHe] e, mesmo com uma provocação tão mínima, [nervous_servant.GetSheHe] começa a vomitar palavras.\n\n\"Oh, meu sábio e bondoso [ROOT.Char.GetTitleAsNameNoTooltip], essas paredes falam. Oh, quão terríveis coisas elas dizem. Eu sei tanto, demais, acho que alguns dias. [stop_host_scope.GetName] nunca me perdoaria se eu te contasse, mas não consigo mais guardar esses segredos na minha cabeça!\""
 host_dinner_events.3008.secret_discovered:0 "[nervous_servant.GetSheHe|U] revelou um segredo"
 host_dinner_events.3008.title:0 "Um Pouco de Investigação"
 host_dinner_events.3010.a:0 "Vou apenas pedir."
 host_dinner_events.3010.b:0 "Tenho certeza de que a comida local está boa."
 host_dinner_events.3010.desc:0 "É mais uma noite da minha estadia na casa de [stop_host_scope.GetName] e mais uma refeição estrangeira é colocada à minha frente. Eu brinco um pouco com o meu garfo, observando o molho escuro e desconhecido escorregar como lama cascata.\n\nAh, como eu daria qualquer coisa por uma comida da capital, apenas uma simples [ROOT.Char.Custom('GetExpensiveDessert')] seria o suficiente. Claro, eu poderia pedir [Select_CString( stop_host_scope.IsFemale, 'a', 'ao' )] [stop_host_scope.GetTitledFirstNameNoTooltip] algo da minha terra natal, mas correria o risco de causar ofensas."
 host_dinner_events.3010.title:0 "Um Sabor Desconhecido"
 host_dinner_events.3011.a:0 "Claro!"
 host_dinner_events.3011.b:0 "Isso é um insulto!"
 host_dinner_events.3011.desc:0 "Eu realmente me superei com esta refeição! Meus cozinheiros prepararam uma variedade deslumbrante de pratos que deixam água na boca, mas [visiting_liege.GetName] parece relutante em experimentar qualquer um deles.\n\n\"Esta comida não é do meu agrado. Você pode me trazer um [ROOT.Char.Custom('GetExpensiveDessert')]? Oh, como sinto falta do doce beijo deles na minha língua.\"\n\nIsso é um pouco insultante, mas um gesto como este não será esquecido tão cedo..."
 host_dinner_events.3011.gave_local_food:0 "[stop_host_scope.GetName] concordou"
 host_dinner_events.3011.refused_local_food:0 "[stop_host_scope.GetName] ficou insultado"
 host_dinner_events.3011.title:0 "$host_dinner_events.3010.title$"
 host_dinner_events.3020.a:0 "Você subestima a minha habilidade!"
 host_dinner_events.3020.b:0 "Não tente."
 host_dinner_events.3020.desc:0 "Foi uma noite longa e maravilhosa de festa e alegria, e muitos cálices de [stop_host_scope.Custom('RegionalAlcoholicDrink')] foram compartilhados entre mim e meu bom anfitrião, [stop_host_scope.GetName].\n\nNo entanto, parece que [Select_CString( stop_host_scope.IsFemale, 'a', 'o' )] [stop_host_scope.GetTitledFirstNameNoTooltip] tem tentado beber mais do que eu, sempre enchendo seu próprio cálice um pouco mais do que o meu. Será que isso é algum tipo de desafio implícito? Talvez eu deva estabelecer algumas apostas aqui."
 host_dinner_events.3020.lost_drinking_duel:0 "Você perdeu o duelo de bebidas"
 host_dinner_events.3020.refused_to_drink:0 "[stop_host_scope.GetName] rejeitou o desafio"
 host_dinner_events.3020.title:0 "O Concurso"
 host_dinner_events.3020.won_drinking_duel:0 "Você venceu o duelo de bebidas"
 host_dinner_events.3021.a:0 "Vamos fazer isso!"
 host_dinner_events.3021.b:0 "Eu realmente deveria parar."
 host_dinner_events.3021.desc:0 "Foi uma noite longa e maravilhosa de festa e alegria, e muitos cálices de [stop_host_scope.Custom('RegionalAlcoholicDrink')] foram compartilhados entre mim e meu senhor, [visiting_liege.GetName].\n\nNo entanto, parece que eu tenho bebido um pouco demais, o que [Select_CString( visiting_liege.IsFemale, 'a', 'ao' )] [visiting_liege.GetTitledFirstNameNoTooltip] parece ter interpretado como um desafio!\n\n\"Então, você acha que pode beber mais que um(a) [visiting_liege.GetTitleAsNameNoTooltip|U]? Por que não colocamos isso à prova e bebemos juntos? O vencedor leva... bem, podemos pensar em um prêmio adequado depois, não é mesmo?\""
 host_dinner_events.3021.title:0 "$host_dinner_events.3020.title$"
 host_dinner_events.3030.a:0 "Preciso perguntar."
 host_dinner_events.3030.b:0 "Não tenho tempo."
 host_dinner_events.3030.desc:0 "Esta noite, fui colocado(a) ao lado de [promising_child.Custom2('NamePossessiveCharacterIntroduction', stop_host_scope)] e a criança tem sido um verdadeiro encanto. Quanto mais converso com [promising_child.GetSheHe], mais vejo o potencial de moldar [promising_child.GetSheHe] à minha imagem.\n\nSinto a vontade de levar [promising_child.GetSheHe] para casa como [Select_CString( promising_child.IsFemale, 'minha pupila', 'meu pupilo' )], mas não poderia fazer tal coisa sem o consentimento d[Select_CString( stop_host_scope.IsFemale, 'a', 'o' )] [stop_host_scope.GetMotherFather] [promising_child.GetHerHim] e [stop_host_scope.GetSheHe] poderia me pedir algo em troca."
 host_dinner_events.3030.refused_to_allow_ward:0 "[stop_host_scope.GetFirstName] proíbe [promising_child.GetFirstName] de partir"
 host_dinner_events.3030.title:0 "Um(a) Protegido(a)"
 host_dinner_events.3031.a:0 "Você está certo(a)."
 host_dinner_events.3031.b:0 "Errado!"
 host_dinner_events.3031.desc:0 "Parece que [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] se afeiçoou a [promising_child.Custom2('MyCharacterIntroduction', ROOT.Char)]. Os dois passaram a noite toda conversando sem esforço, como se fossem [visiting_liege.GetMotherFather] e [promising_child.Custom('GetDaughterSon')]!\n\n[visiting_liege.GetNameNoTooltip] se aproxima de mim com um sorriso no rosto. \"[Select_CString( promising_child.IsFemale, 'Essa', 'Esse' )] [promising_child.Custom('GirlBoy')] é uma verdadeira maravilha! Eu desejo nada mais do que levar [promising_child.GetSheHe] para casa e criar [promising_child.GetSheHe] na capital. Uma juventude tão promissora não deveria passar todos os dias em [ROOT.Char.GetCurrentLocation.GetName], concorda?\""
 host_dinner_events.3031.title:0 "[promising_child.GetFirstNameNoTooltip]: o(a) Pupilo(a) do(a) [visiting_liege.GetTitleAsNameNoTooltip]"
 host_dinner_events.3040.a:0 "Não é astuto demais para mim!"
 host_dinner_events.3040.b:0 "Triste."
 host_dinner_events.3040.desc:0 "A comida foi novamente servida em abundância esta noite, como eu esperava. No entanto, os pequenos pastéis dos quais eu tanto gostava parecem estar ausentes. Olho para [stop_host_scope.GetNameNoTooltip] com uma expressão perplexa no rosto.\n\n\"Eu sei que você esperava mais pastel, [Select_CString( visiting_liege.IsFemale, 'minha', 'meu' )] [visiting_liege.GetTitleAsNameNoTooltip|U], mas o cozinheiro me assegura que todos desapareceram pouco antes de serem servidos. Tentamos pegar o ladrão, mas o vilão glutão é muito astuto.\""
 host_dinner_events.3040.didnt_solve_mystery:0 "Você não conseguiu encontrá-los"
 host_dinner_events.3040.disappointed_in_vassal:0 "Não estou com raiva, apenas decepcionado(a)"
 host_dinner_events.3040.title:0 "Quem Comeu Todos os Pastéis?"
 host_dinner_events.3041.a:0 "Vou deixar passar, em troca de um favor."
 host_dinner_events.3041.b:0 "Um segredo entre você e eu."
 host_dinner_events.3041.c:0 "Nunca contarei a ninguém."
 host_dinner_events.3041.d:0 "Hah! Você está expost[Select_CString( pie_eater_scope.IsFemale, 'a', 'o' )], [pie_eater_scope.Custom2('InsultNoun', ROOT.Char)] [pie_eater_scope.Custom2('InsultAdjective', ROOT.Char)]."
 host_dinner_events.3041.desc.deviant:0 "Sigo uma trilha de migalhas e respingos de gordura e molho, até que finalmente encontro o culpado, mas acredito que nada poderia me preparar para o que estava prestes a ver.\n\nEncontro [pie_eater_scope.GetName] completamente nu(a), de costas para mim, e ao me ver [pie_eater_scope.GetSheHe] gira para me encarar, revelando uma bandeja inteira de tortas empilhadas na altura da virilha, com apenas um pastel cobrindo sua modéstia.\n\n\"Oh! Erm... nem tudo é o que parece, [Select_CString( visiting_liege.IsFemale, 'minha', 'meu' )] [visiting_liege.GetTitleAsNameNoTooltip|U]! Por favor, não conte a ninguém sobre isso!\""
 host_dinner_events.3041.desc:0 "Sigo a trilha de migalhas e respingos de molho e gordura até que finalmente encontro o culpado!\n\nEntro em um quarto e encontro [pie_eater_scope.GetName] sentado(a) sozinho(a) com a pilha inteira de pastéis ao seu lado.\n\n\"Oh! [Select_CString( visiting_liege.IsFemale, 'Minha', 'Meu' )] [visiting_liege.GetTitleAsNameNoTooltip|U], eu estava prestes a trazer os pastéis para você, é claro, mas você vê... eles sempre desaparecem quando chega a minha vez de comer, então pensei em pegar um ou dois primeiro. Por favor, não conte a ninguém sobre isso!\""
 host_dinner_events.3041.e:0 "Posso experimentar?"
 host_dinner_events.3041.f:0 "Vamos compartilhar!"
 host_dinner_events.3041.title.deviant:0 "Torta [pie_eater_scope.GetCulture.GetNameNoTooltip]"
 host_dinner_events.3041.title:0 "[pie_eater_scope.GetFirstNameNoTooltip] Comeu Todos os Pastéis!"
 host_dinner_events.3050.a:0 "\"Coma algo, pelo amor de [ROOT.Char.GetFaith.HighGodName]!\""
 host_dinner_events.3050.annoyed_courtier:0 "Você irritou [non_eater_scope.GetSheHe]"
 host_dinner_events.3050.b:0 "Vou arranjar desculpas para [non_eater_scope.GetSheHe]."
 host_dinner_events.3050.convinced_to_eat:0 "Você convenceu [non_eater_scope.GetSheHe] a comer"
 host_dinner_events.3050.desc:0 "A refeição desta noite está divina, mas enquanto os chefs continuam a empilhar comida, tenho percebido que [non_eater_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] mal toca no pouco que coloca em seu prato.\n\nEmbora a falta de apetite fosse aceitável em qualquer outro momento, [stop_host_scope.GetName] parece estar se sentindo insultado(a) pelo fato de um membro da minha comitiva estar mexendo e cutucando a sua comida."
 host_dinner_events.3050.title:0 "Inapetente"
 host_dinner_events.3060.a:0 "Elas são boas demais para resistir!"
 host_dinner_events.3060.b:0 "Não, preciso parar."
 host_dinner_events.3060.desc:0 "Verdadeiramente, a refeição desta noite tem sido um deleite. Eu me deliciei com todo tipo de comida, salgada e doce, mas nada encantou tanto o meu apetite como essas deliciosas [stop_host_scope.Custom('GetExpensiveDessert')].\n\nNão importa quantas eu coma, não importa o quanto eu aprecie o sabor delas, simplesmente não é suficiente para tirá-las da minha mente. Me vejo perdido nelas a cada mordida, o sabor explodindo em minha boca, me aproximando um passo mais de experimentar [ROOT.Char.GetFaith.PositiveAfterLife].\n\nEmbora meu estômago esteja cheio e minhas roupas estejam apertadas, sinto uma vontade irresistível de pegar mais."
 host_dinner_events.3060.satisfying_dessert:0 "Você está satisfeito"
 host_dinner_events.3060.title:0 "Uma Delícia Saborosa"
 host_dinner_events.3060.too_much_dessert:0 "Você comeu demais"
 host_dinner_events.3061.a:0 "Deve ter sido veneno!"
 host_dinner_events.3061.desc:0 "Termino minha última refeição e estou realmente satisfeito, embora um pouco desconfortável. Vou para a cama satisfeito, porém um pouco incomodado.\n\nEnquanto estou deitado lá, sinto a doçura chegar ao meu coração e #EMP thump!#! um pouco mais forte. A intensidade aumenta a cada batida, mais forte e rápida. Sinto que meu coração está prestes a explodir do meu peito. Um suor frio percorre todo o meu corpo, e minha garganta fica seca enquanto respiro superficial e rapidamente como o(a) [ROOT.Char.Custom('GetAnimalType')] encurralado!\n\nEntão, de repente, tudo para."
 host_dinner_events.3061.title:0 "O Coração Traidor"
 host_dinner_events.3070.a:0 "Algo trágico."
 host_dinner_events.3070.b:0 "Algo leve!"
 host_dinner_events.3070.boring_story:0 "Sua história foi entediante"
 host_dinner_events.3070.desc:0 "Outra noite de alegria chega ao fim, e me vejo envolvido em uma conversa com [potential_friend_scope.GetName], de todas as pessoas.\n\nAntes que eu perceba, a sala fica em silêncio, exceto por nossa conversa, e todos estão pendurados em minhas palavras seguintes. Embora um pouco constrangedor, tenho certeza de que posso contar uma história que todos aqui irão adorar!"
 host_dinner_events.3070.story_was_impressive:0 "Sua história foi impressionante"
 host_dinner_events.3070.title:0 "História para [potential_friend_scope.GetFirstNameNoTooltip]"
 host_dinner_events.3080.a:0 "Eu posso salvar [choking_character_scope.GetSheHe]!"
 host_dinner_events.3080.b:0 "Isso realmente não é problema meu."
 host_dinner_events.3080.desc:0 "Todos estão se divertindo no jantar, e eu conto outra de minhas piadas lendárias, sendo recebida com muitas risadas e aplausos... e tosses.\n\nOlho ao redor e vejo [choking_character_scope.GetName] agarrando a garganta com força e tossindo intensamente, ficando vermelho no rosto. Parece que minha piada pode ter sido um pouco boa demais para [choking_character_scope.GetSheHe]!\n\nEu poderia agir e tentar salvar [choking_character_scope.GetSheHe], é claro, mas isso realmente me preocupa?"
 host_dinner_events.3080.failed_to_save_them:0 "Você falhou em salvar [choking_character_scope.GetFirstName]"
 host_dinner_events.3080.title:0 "Um Engasgo!"
 host_dinner_events.3081.a:0 "\"Você não me deve nada além de sua companhia.\""
 host_dinner_events.3081.b:0 "\"Sim, você me deve a sua vida.\""
 host_dinner_events.3081.desc:0 "Eu me levanto e dou tapas fortes nas costas de [choking_character_scope.GetName] repetidamente, enquanto [choking_character_scope.GetSheHe] começa a ficar com o rosto azul, um pedaço grotesco do que antes era comida gourmet cai com um respingo em um molho herbal caro.\n\n\"Oh, obrigado! Você salvou uma vida hoje, [Select_CString( visiting_liege.IsFemale, 'minha', 'meu' )] [visiting_liege.GetTitleAsNameNoTooltip|U]! Eu sempre estarei em sua dívida.\""
 host_dinner_events.3081.title:0 "Uma Vida Salva"
 host_dinner_events.3090.a:0 "Uma excelente ideia."
 host_dinner_events.3090.b:0 "Isso é grotesco."
 host_dinner_events.3090.desc:0 "Eu me diverti aqui, mas não posso permitir que me distraiam da minha missão de me tornar um [ROOT.Char.GetTitleAsNameNoTooltip|U] temido e respeitado!\n\nAs masmorras de [stop_host_scope.GetName] estão repletas de vilões e traidores, que estão se aproveitando do tesouro da coroa com sua necessidade constante de comida e água. Talvez eu possa fazer um favor ao meu generoso anfitrião e ao mesmo tempo inspirar medo no coração [stop_host_scope.GetHerHim], executando um prisioneiro e bebendo [stop_host_scope.Custom('RegionalAlcoholicDrink')] de seu crânio oco."
 host_dinner_events.3090.skobletted_my_prisoner:0 "[visiting_liege.GetName] esvaziou o crânio de [skoblet_target.GetFirstName] em uma taça"
 host_dinner_events.3090.title:0 "O Crânio"
 host_dinner_events.3100.a:0 "Os pagamentos atrasados devem ser feitos."
 host_dinner_events.3100.b:0 "[stop_host_scope.GetSheHe|U] deve pagar mais no futuro."
 host_dinner_events.3100.c:0 "Vou deixar isso passar."
 host_dinner_events.3100.desc:0 "Tenho aproveitado meu tempo aqui, mas não posso deixar de notar que tenho me banquetado em extravagância todos os dias enquanto estive aqui. Talvez [stop_host_scope.GetName] seja significativamente mais rico do que eu inicialmente imaginei.\n\nSe minhas suposições se confirmarem, significaria que [stop_host_scope.GetTitleAsNameNoTooltip|U] me deve muito mais ouro do que [stop_host_scope.GetSheHe] tem me pago até agora, e eu poderia exigir um acerto de contas."
 host_dinner_events.3100.title:0 "Extravagância Suspeita"
 host_dinner_events.3100.vassal_accepts:0 "[stop_host_scope.GetFirstName] aceita"
 host_dinner_events.3100.vassal_refuses:0 "[stop_host_scope.GetFirstName] recusa"
 host_dinner_events.3101.a:0 "Está bem."
 host_dinner_events.3101.b:0 "Isso é um absurdo!"
 host_dinner_events.3101.desc.intro:0 "Tenho sido um anfitrião excelente para meu senhor, dando a [visiting_liege.GetSheHe] tudo o que [visiting_liege.GetSheHe] poderia desejar e servindo apenas a melhor comida de meus estoques.\n\nNo entanto, parece que isso foi um erro, já que [visiting_liege.GetSheHe] agora acredita que minha habilidade superior de hospedagem se deve à evasão fiscal!"
 host_dinner_events.3101.desc:0 "$host_dinner_events.3101.desc.intro$\n\n[visiting_liege.GetSheHe|U] está exigindo que eu pague de uma só vez uma \"dívida acumulada\"."
 host_dinner_events.3101.title:0 "Extravagância Tributável"
 host_dinner_events.3102.a:0 "Eu aceitarei."
 host_dinner_events.3102.b:0 "Vá para [ROOT.Char.GetFaith.NegativeAfterLife]!"
 host_dinner_events.3102.desc:0 "$host_dinner_events.3101.desc.intro$\n\nAgora [visiting_liege.GetName] exige que meus impostos sejam aumentados a partir de agora!"
 host_dinner_events.3102.title:0 "$host_dinner_events.3101.title$"
 host_dinner_events.3110.a:0 "Claro que há!"
 host_dinner_events.3110.b:0 "Vá embora."
 host_dinner_events.3110.desc.intro:0 "Parece que não sou o único convidado honrado na corte de [stop_host_scope.GetName]! Esta noite, estou sentado ao lado do fascinante [talented_pool_character.GetName], e nossa conversa me deixou muito animado.\n\n"
 host_dinner_events.3110.desc.mid.claim:0 "\"Infelizmente, eu também deveria fazer parte da classe privilegiada, nobre [visiting_liege.GetTitleAsNameNoTooltip|U]. Se o mundo fosse um lugar justo, meu legítimo direito seria reconhecido e eu também teria um grande salão de jantar para servi-lo.\""
 host_dinner_events.3110.desc.mid.learning:0 "\"Ninguém entende o mundo e a [talented_pool_character.GetFaith.ReligiousText] como eu, magnânimo [visiting_liege.GetTitleAsNameNoTooltip|U]. Se me permitir, ficarei honrado em emprestar minhas habilidades à sua corte.\""
 host_dinner_events.3110.desc.mid.martial:0 "\"Minhas habilidades em assuntos de guerra são lendárias, [visiting_liege.GetTitleAsNameNoTooltip|U]. Se me permitir, ficarei feliz em emprestar essas habilidades a você!\""
 host_dinner_events.3110.desc.mid.statecraft:0 "\"Tenho grande conhecimento em ciência política, mas minhas habilidades estão sendo desperdiçadas enquanto viajo de um lugar para outro. Se me permitir em sua corte, ficarei honrado em [Select_CString( visiting_liege.IsFemale, 'chamá-la de minha', 'chamá-lo de meu' )] [visiting_liege.GetTitleAsNameNoTooltip|U].\""
 host_dinner_events.3110.desc.outro:0 "\n\nÉ raro encontrar uma pessoa tão fascinante sem um lar próprio, mas há espaço em minha corte para [talented_pool_character.GetSheHe]?"
 host_dinner_events.3110.title:0 "Um Viajante Talentoso"
 host_dinner_events.3120.a:0 "[courtier_gift.GetNameNoTooltip] poderia ficar aqui."
 host_dinner_events.3120.b:0 "[artifact_gift.GetName] poderia ser [stop_host_scope.GetHerHim]."
 host_dinner_events.3120.c:0 "Ouro é sempre um ótimo presente."
 host_dinner_events.3120.d:0 "O presente de uma verdadeira amizade!"
 host_dinner_events.3120.desc:0 "Durante o jantar, encontro uma oportunidade de demonstrar minha majestade. Minha comitiva está repleta de objetos de valor e pessoas talentosas, e talvez eu possa me aproximar de [stop_host_scope.GetName] se deixar um pequeno pedaço de mim aqui.\n\nExistem muitas coisas que posso oferecer por minha benevolência, talvez..."
 host_dinner_events.3120.e:0 "Não devo nenhum presente."
 host_dinner_events.3120.title:0 "Um Presente à Altura de um [stop_host_scope.GetTitleAsNameNoTooltip]"
 host_dinner_events.3121.a:0 "Obrigado!"
 host_dinner_events.3121.b:0 "Somos amigos, eternamente."
 host_dinner_events.3121.c:0 "Eu não vou aceitar."
 host_dinner_events.3121.desc.artifact:0 "Meu tesouro está cheio de relíquias e artefatos valiosos. Talvez você queira levar meu [artifact_gift.GetName]."
 host_dinner_events.3121.desc.best_friend:0 "Somos amigos há algum tempo e talvez seja hora de levar isso para o próximo nível. Você gostaria de fazer um juramento de #EMP verdadeira#! amizade comigo?"
 host_dinner_events.3121.desc.courtier:0 "Prometo que [courtier_gift.GetName] é um bom e leal cortesão que servirá bem a você no futuro."
 host_dinner_events.3121.desc.gold_gift:0 "Estou sobrecarregado com minha vasta fortuna e gostaria de compartilhar um pouco dessa riqueza com meus súditos mais leais."
 host_dinner_events.3121.desc.intro:0 "Entro no salão de jantar e encontro [visiting_liege.GetName] sentado na cabeceira da mesa, com os pés levantados ao lado de sua refeição.\n\n\"Meu bom vassalo!"
 host_dinner_events.3121.desc.outro:0 "Este é meu presente para você, sem necessidade de reciprocidade."
 host_dinner_events.3121.title:0 "$host_dinner_events.3120.title$"
 host_dinner_events.3130.a:0 "Eu #EMP preciso#! chegar ao fundo disso!"
 host_dinner_events.3130.b:0 "Não posso ficar bisbilhotando por aí."
 host_dinner_events.3130.desc:0 "Me encontro acordado em uma fome agonizante, incapaz de voltar a descansar.\n\nAndo no escuro em direção à cozinha e percebo que o ambiente está levemente iluminado por algo além de minha lâmpada. As prateleiras despertam com um brilho sobrenatural, porém convidativo.\n\nSou dominado pela curiosidade, incapaz de encontrar a fonte do brilho. Com a chama da minha luz apagada, começo a verificar as bordas da despensa."
 host_dinner_events.3130.title:0 "Não é o que [stop_host_scope.GetSheHe|U] parece"
 host_dinner_events.3131.a:0 "Um quebra-cabeça, isso deve ser trivial."
 host_dinner_events.3131.b:0 "Um bom chute na porta deve resolver!"
 host_dinner_events.3131.c:0 "Isso dá muito trabalho."
 host_dinner_events.3131.desc:0 "Com um pouco de esforço, consigo encontrar arranhões no chão onde o armário está, e algumas seções da prateleira bem menos empoeiradas que o resto. As prateleiras revelam-se interruptores mecânicos ao toque, e com um pouco de esforço, consigo deslizar a despensa para longe da parede, revelando um cômodo oculto!\n\nEntre as pedras úmidas, há uma porta de madeira resistente com um cadeado ricamente decorado em sua maçaneta. Ao inspecionar, vejo que os dígitos do cadeado não são nem números nem letras, mas diagramas de toda sorte de bestas e grotescos."
 host_dinner_events.3131.fail_to_get_it_open:0 "Você não consegue abrir a porta"
 host_dinner_events.3131.title:0 "O Cômodo Atrás da Despensa"
 host_dinner_events.3132.a:0 "O que isso poderia significar?"
 host_dinner_events.3132.b:0 "Mais uma peça do mistério."
 host_dinner_events.3132.c:0 "Finalmente, tenho todos eles."
 host_dinner_events.3132.d:0 "Devo deixar isso aqui."
 host_dinner_events.3132.desc:0 "No vazio onde a porta costumava estar, vejo um estudo elaborado com todo tipo de substâncias desconhecidas borbulhando suavemente e pequenos animais presos em gaiolas. No centro do cômodo, há um único livro elevado em um pedestal, sua capa reluzente com desenhos de bestas e grotescos idênticos aos do cadeado do quarto.\n\nPego o livro em minhas mãos e sinto a curiosidade me dominar enquanto passo meu dedo por sua superfície de couro. Então, percebo escondido entre os símbolos profanos em sua capa um único caractere inteligível: o número um. Tento abrir o livro, mas encontro-o trancado com firmeza com um pequeno quebra-cabeça triangular."
 host_dinner_events.3132.title:0 "A Biblioteca Oculta"
 host_dinner_events.3133.a:0 "Agora eu sei das coisas."
 host_dinner_events.3133.desc:0 "A porta cede e me revela... algo que eu preferia não ter visto.\n\nCada parede é adornada com objetos estranhos: chicotes, troncos, fálicos de madeira, para citar alguns. O chão está úmido com o que eu #EMP espero#! que seja apenas água, mas dada a parafernália neste cômodo, temo imaginar que tipo de mistura de fluidos corporais possa ser."
 host_dinner_events.3133.title:0 "O Calabouço Oculto"
 host_dinner_events.3134.a:0 "Eu nunca poderei apagar o que foi visto."
 host_dinner_events.3134.desc:0 "Quando a porta se abre, sou derrubado ao chão por um odor ácido e repugnante, meu traseiro encharcado em uma poça de sangue fresco.\n\nO cômodo está cheio de corpos humanos, meio esquartejados e pendurados em ganchos de carne. A pele humana jaz sobre uma mesa de açougue ao lado do corpo a que um dia pertenceu, uma suja faca ao seu lado. As expressões retorcidas de horror nos rostos das vítimas são uma marca permanente do ambiente."
 host_dinner_events.3134.title:0 "A Açougue Oculto"
 host_dinner_events.3135.a:0 "Que descoberta!"
 host_dinner_events.3135.desc:0 "A porta se abre revelando um túnel escuro e viscoso, coberto de líquen e fungos. Eu me arrasto por ele e sigo essa caverna até o fim, encontrando-me emergindo do lado de fora em um caminho rural desprevenido.\n\nClaramente, este é o túnel de fuga de [stop_host_scope.GetName] em caso de emergências."
 host_dinner_events.3135.title:0 "O Túnel de Fuga"
 host_dinner_events.3136.a:0 "Todos saberão."
 host_dinner_events.3136.b:0 "Ninguém jamais saberá."
 host_dinner_events.3136.desc:0 "A porta se abre e um grito horrorizado ecoa! Parado na porta está uma [quasimodo_child.Custom('GarotaGaroto')] deformada olhando para mim com completo choque e horror em seus olhos.\n\n\"Não me olhe!\" [quasimodo_child.GetSheHe|U] grita, protegendo o rosto com as mãos. \"Oh, o horror que te espera se [Select_CString( stop_host_scope.IsFemale, 'a', 'o' )] [stop_host_scope.GetMotherFather] descobrir que você me viu!\"\n\nÉ então que percebo a semelhança, claramente este é o filho ilegítimo de [stop_host_scope.GetNameNoTooltip]!"
 host_dinner_events.3136.title:0 "O Quarto Secreto"
 host_dinner_events.3140.a:0 "Uma experiência que vale a pena."
 host_dinner_events.3140.b:0 "Eu não poderia ser tão audacioso."
 host_dinner_events.3140.desc:0 "A vida como [ROOT.Char.GetTitleAsNameNoTooltip|U] traz todo tipo de comida magnífica e fantasiosa para o meu prato, mas ultimamente tenho me cansado dos mesmos sabores e texturas. Eu desejo algo realmente extravagante, algo verdadeiramente exótico!\n\nDe um lado, vejo [stop_host_scope.Custom('GetExpensiveDessert')] e do outro estão legumes cozidos. E se eu combinar esses dois sabores distintos e prová-los juntos!"
 host_dinner_events.3140.it_did_not_work:0 "A experiência foi um fracasso."
 host_dinner_events.3140.satisfying_taste:0 "O sabor foi magnífico."
 host_dinner_events.3140.title:0 "Uma Combinação Saborosa"
 host_dinner_events.3150.a:0 "Que divertido!"
 host_dinner_events.3150.b:0 "Recue, tolo."
 host_dinner_events.3150.desc:0 "Eu tenho estado sentado ao lado do leal cavaleiro de [stop_host_scope.GetName], [joker_knight.GetName], a noite toda e até agora, [Select_CString( joker_knight.IsFemale, 'a', 'o' )] [joker_knight.GetWomanMan] tem sido uma verdadeira delícia, nunca tímido para contar uma piada.\n\n\"Eu lhe digo, de [Select_CString( ROOT.Char.IsFemale, 'todas as', 'todos os' )] [ROOT.Char.Custom2('InsultNoun', ROOT.Char)] que eu já conheci, [ROOT.Char.GetName] é [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] mais [ROOT.Char.Custom2('InsultAdjective', ROOT.Char)]! Hah!\"\n\n\"O que você se atreve a dizer sobre [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord]?\" [humorless_knight.GetName] levanta de sua cadeira. \"Eu desafio você, vilão!\""
 host_dinner_events.3150.title:0 "Uma Questão de Honra"
 host_dinner_events.3150.your_knight_loses:0 "[humorless_knight.GetName] perde"
 host_dinner_events.3150.your_knight_wins:0 "[humorless_knight.GetName] é vitorioso!"
