 artifact_secret_cipher_description:0 "Um livro estranho de enigmas e cifras."
 artifact_secret_journal_description:0 "Um livro encadernado em couro trancado com um quebra-cabeça incompreensível. Ao olhar para ele, você sente curiosidade e medo."
 artifact_secret_journal_name:0 "Diário Misterioso"
 artifact_secret_journal_unsolved_description:0 "Três diários, cada um com peças diferentes para desvendar os mistérios dos outros, embora o mistério ainda não tenha sido solucionado."
 artifact_secret_journal_with_cipher_description:0 "Um par de diários, um trancado com um quebra-cabeça ininteligível, e o outro preenchido com o código para uma espécie de linguagem codificada. Os dois parecem pertencer um ao outro."
 artifact_secret_journal_with_puzzle_description:0 "Um estranho diário encadernado em couro, trancado com um quebra-cabeça ininteligível. Junto com ele há outro diário com a chave para decifrar o quebra-cabeça."
 artifact_secret_puzzle_description:0 "Um livro contendo a chave para resolver um quebra-cabeça desconhecido."
 artifact_secret_puzzle_with_cipher_description:0 "Dois diários, um parece conter um código e o outro a chave para resolver um quebra-cabeça. Mesmo juntos, esses dois livros não revelam nenhum mistério, mas deve haver um terceiro que revele tudo."
 artifact_strange_necklace_desc:0 "Um colar ricamente decorado. Na extremidade de sua corrente está a figura de um grotesco segurando uma joia entre seus apêndices estranhos."
