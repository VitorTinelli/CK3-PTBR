 cultural_festival.9000.a:0 "Devo investigar."
 cultural_festival.9000.b:0 "Não, eu realmente não devo."
 cultural_festival.9000.desc:0 "Todas as maravilhas e alegria habituais do festival cultural estão acontecendo ao meu redor, e é como se eu tivesse sido transportado para outro mundo.\n\nNo entanto, sou trazido de volta ao mundo terreno pela visão de algumas pessoas nefastas se movendo nos arredores da multidão, esgueirando-se atrás de um palco de madeira rangente.\n\nSinto uma grande curiosidade e não consigo ver exatamente o que esses indivíduos estão tramando. Então, vejo [stop_host_scope.GetFirstName] surgir dos bastidores com um séquito de tipos sórdidos."
 cultural_festival.9000.host_noticed:0 "[stop_host_scope.GetFirstName] te pegou bisbilhotando"
 cultural_festival.9000.title:0 "Passe de Bastidores"
 cultural_festival.9001.a:0 "Eu posso resolver o quebra-cabeça facilmente!"
 cultural_festival.9001.b:0 "Eu posso simplesmente quebrá-lo!"
 cultural_festival.9001.c:0 "Isso dá muito trabalho."
 cultural_festival.9001.desc:0 "Atrás do palco, encontro nada além de um pequeno baú. Seu material parece resistente, mas sua fabricação estranhamente humilde e descuidada, não o destaque que se esperaria de um festival dessa magnitude.\n\nEle está preso por uma fechadura que parece ser um quebra-cabeça, coberta por entalhes grosseiros de grotescos e animais de todas as espécies.\n\nMinha mente está cheia de curiosidade, eu simplesmente preciso saber o que há dentro!"
 cultural_festival.9001.destroyed_what_was_inside:0 "Você destruiu o que havia dentro"
 cultural_festival.9001.fail_to_get_it_open:0 "Você não consegue abrir o baú"
 cultural_festival.9001.title:0 "A Caixa Sob o Palco"
 cultural_festival.9002.a:0 "Vou levar."
 cultural_festival.9002.b:0 "$host_dinner_events.3132.b$"
 cultural_festival.9002.c:0 "$host_dinner_events.3132.c$"
 cultural_festival.9002.d:0 "Não, eu devo deixar isso."
 cultural_festival.9002.desc:0 "Escondido atrás da caixa de madeira está apenas um velho e empoeirado diário, com papel em excesso enfiado de forma desordenada entre suas páginas.\n\nAbro o diário e vejo apenas um palavrório sem sentido, símbolos alienígenas e equações matemáticas que parecem não se relacionar com mais nada contido no livro.\n\nIsso deve ser a chave para resolver algum tipo de quebra-cabeça, mas qual exatamente?"
 cultural_festival.9002.title:0 "O Diário Secreto"
 cultural_festival.9003.a:0 "E agora ela é minha!"
 cultural_festival.9003.b:0 "Eu não posso simplesmente roubar isso!"
 cultural_festival.9003.desc:0 "Dentro do baú está uma adaga ricamente decorada. Longe da fabricação grosseira da fechadura, a adaga é tão detalhada que a cada momento que você olha para ela, mais e mais intricidades se revelam para você.\n\nUm item verdadeiramente magnífico."
 cultural_festival.9003.title:0 "Uma Lâmina"
 cultural_festival.9004.a:0 "$cultural_festival.9003.a$"
 cultural_festival.9004.b:0 "$cultural_festival.9003.b$"
 cultural_festival.9004.desc:0 "A caixa está cheia até a borda de ouro! Um tesouro secreto que [stop_host_scope.GetFirstName] estava escondendo de mim, sem dúvida."
 cultural_festival.9004.title:0 "Um Dízimo"
 cultural_festival.9005.a:0 "$cultural_festival.9003.a$"
 cultural_festival.9005.b:0 "$cultural_festival.9003.b$"
 cultural_festival.9005.desc:0 "Dentro do baú há um colar ricamente decorado. Longe da manufatura grosseira do cadeado, o colar é tão detalhado que, a cada instante que você o observa, mais e mais minúcias se revelam.\n\nUm item verdadeiramente magnífico."
 cultural_festival.9005.title:0 "Colar Ornamentado"
 cultural_festival.9006.a:0 "Que coisa curiosa!"
 cultural_festival.9006.b:0 "Queime isso."
 cultural_festival.9006.desc:0 "Abro o baú e tenho motivos para corar com o que encontro dentro.\n\nFeito de uma madeira fina, este objeto fálico é muito diferente de qualquer outro que já vi — nem mesmo parece se assemelhar a um #EMP instrumento# humano, mas sim algo que eu imaginaria pertencer a uma criatura mítica.\n\nUm item verdadeiramente perverso."
 cultural_festival.9006.title:0 "Um Item Vergonhoso"
 cultural_festival.9010.a:0 "Que legal."
 cultural_festival.9010.b:0 "\"Esteja com eles, [weeb_child.GetFirstNameNoTooltip]!\""
 cultural_festival.9010.desc:0 "Tenho aproveitado as festividades em [ROOT.Char.GetCurrentLocation.GetName] hoje, mas não tanto quanto [weeb_child.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n[weeb_child.GetSheHe|U] tem dançado e girado com os locais com uma alegria e vigor que nunca vi antes. Totalmente imerso nas tradições alienígenas da cultura [festival_culture_scope.GetName], [weeb_child.GetSheHe] parece completamente em casa, e os locais parecem adorar [weeb_child.GetSheHe] também!"
 cultural_festival.9010.title:0 "Excessivamente Entusiasmado"
 cultural_festival.9020.b:0 "\"Parem com essa loucura em nome do(a) seu(sua) [ROOT.Char.GetTitleAsNameNoTooltip|U]!\""
 cultural_festival.9020.desc:0 "O sol está se pondo em mais um dia em [ROOT.Char.GetCurrentLocation.GetName] e os locais parecem estar preparando um show final. Um grande poste de madeira foi erguido, e estou animado para ver o que acontecerá em seguida!\n\nMas então, um[Select_CString( human_sacrifice.IsFemale, 'a', '' )] [human_sacrifice.GetWomanMan] frágil é arrastada aos pontapés e gritos e amarrada ao poste. Uma faca é trazida em direção ao estômago [human_sacrifice.GetHerHim], e [human_sacrifice.GetSheHe] fecha seus olhos e se prepara para enfrentar o esquecimento."
 cultural_festival.9020.title:0 "O Grande Clímax"
 cultural_festival.9030.a:0 "\"Seria uma pena que essas tradições morressem, não é?\""
 cultural_festival.9030.b:0 "Devo apenas ficar calado(a)."
 cultural_festival.9030.desc:0 "[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)|U] parece completamente [Select_CString( visiting_liege.IsFemale, 'fascinada', 'fascinado' )] com as festividades de hoje. Dançarinos, artistas e comediantes todos buscam agradar [Select_CString( visiting_liege.IsFemale, 'a minha senhora feudal', 'o meu senhor feudal' )], e parece estar funcionando perfeitamente.\n\nNum humor tão bom e cercado(a) por nossas tradições, talvez [visiting_liege.GetFirstName] comece a se interessar por manter essas tradições vivas. As tradições dos seguidores [ROOT.Char.GetFaith.GetAdherentNamePlural|U] certamente morrerão sem as devidas proteções legais contra conversões."
 cultural_festival.9030.failure:0 "Você não conseguiu convencer [visiting_liege.GetFirstName]"
 cultural_festival.9030.success:0 "Você convenceu [visiting_liege.GetFirstName]"
 cultural_festival.9030.title:0 "Tradições dos Seguidores [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|U]"
 cultural_festival.9040.a:0 "\"Uma moeda você terá.\""
 cultural_festival.9040.b:0 "\"Não tenho interesse em charlatões comuns.\""
 cultural_festival.9040.bad_reading:0 "Sua leitura pressagia o destino"
 cultural_festival.9040.c:0 "\"Ensine-me seus caminhos, sábio(a)!\""
 cultural_festival.9040.desc:0 "Num canto remoto do festival, encontro uma tenda ricamente decorada. Os materiais e padrões são estranhos para mim, muito diferentes do que já vi em casa. Seu proprietário é ainda mais estranho, sorrindo para mim com conhecimento acima das mãos entrelaçadas.\n\n\"Ah, um [ROOT.Char.GetTitleAsNameNoTooltip|U]! Eu vejo muito em seu futuro, venha me dar uma moeda e eu contarei tudo.\""
 cultural_festival.9040.good_reading:0 "Sua leitura é positiva"
 cultural_festival.9040.t:0 "Uma Moeda por uma Fortuna"
 cultural_festival.9050.a:0 "[sexy_dancer.GetSheHe|U] deve ser [Select_CString( sexy_dancer.IsFemale, 'minha', 'meu' )]!"
 cultural_festival.9050.b:0 "Que graça!"
 cultural_festival.9050.desc:0 "Estou sentado(a) para mais um encantador espetáculo. A percussão pulsa no silêncio expectante, tambores batendo como um batimento cardíaco.\n\nPor trás das cortinas, [Select_CString( sexy_dancer.IsFemale, 'uma linda', 'um lindo' )] [sexy_dancer.GetWomanMan] aparece, movendo o seu corpo de uma maneira que é ao mesmo tempo obscena e excitante. [sexy_dancer.GetSheHe|U] envolve o seu corpo de forma escandalosamente próxima ao meu e depois me deixa apenas com um piscar de olhos, voltando para a sua adorada plateia."
 cultural_festival.9050.t:0 "Dança Erótica"
 cultural_festival.9060.a.failure:0 "A performance vai muito bem"
 cultural_festival.9060.a.success:0 "A performance alcança [stop_host_scope.GetFirstName]"
 cultural_festival.9060.a:0 "Eles deveriam realizar minha lenda!"
 cultural_festival.9060.b:0 "Devo apenas apreciar o que eles têm a oferecer."
 cultural_festival.9060.desc:0 "Em minha alegria, eu percorro o festival e eventualmente encontro um grupo de artistas. Eles parecem estar ensaiando algo e posso dizer apenas pela forma como se comportam que estou prestes a ter um maravilhoso entretenimento.\n\nA ideia me ocorre de que o grupo pode se beneficiar de algum material novo. De fato, [ROOT.Char.GetPromotedLegend.GetName] seria um material ideal para um grupo tão talentoso de atores."
 cultural_festival.9060.t:0 "Uma Performance Legendária"
