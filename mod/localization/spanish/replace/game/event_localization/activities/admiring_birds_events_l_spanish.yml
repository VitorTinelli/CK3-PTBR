l_spanish:
 admiring_birds.1001.a:0 "Se ao menos eu soubesse mais sobre pássaros..."
 admiring_birds.1001.atlantic_puffin.desc:0 "Que visão engraçada! O papagaio-do-mar-do-atlântico é um deleite para observar, me lembra de certa forma um bobo da corte colorido."
 admiring_birds.1001.b:0 "Que encontro benéfico!"
 admiring_birds.1001.barrow_goldeneye.desc:0 "O olho dourado está me encarando do meio do lago. O pato nada pacificamente, certamente procurando por comida."
 admiring_birds.1001.black_tern.desc:0 "Caminhando à beira de um campo, avisto um grupo de trinta-réis-negros perseguindo-se, subindo rapidamente com batidas exageradas de asas enquanto chamam animadamente. Será a época de reprodução?"
 admiring_birds.1001.c:0 "Uma bela adição à minha coleção de troféus"
 admiring_birds.1001.common_loon.desc:0 "Plumagem preta e branca, dedos conectados por membranas, decolagem desajeitada. Hmm... É bastante difícil de identificar, mas deve ser um mergulhão."
 admiring_birds.1001.common_merganser.desc:0 "Essa crista é bastante reconhecível. Aninhado em uma cavidade de uma árvore, o pato-mergulhão cuida cuidadosamente de seus ovos. Seu companheiro não está à vista, talvez esteja pescando."
 admiring_birds.1001.common_raven.desc:0 "A melodia que chega aos meus ouvidos não pode ser confundida: o canto de um corvo. Empoleirado em um galho, o pássaro parece estar brincando."
 admiring_birds.1001.dynasty_prestige_gain.desc:0 "Encontrar esse pássaro prova que minha Dinastia está destinada à grandeza!"
 admiring_birds.1001.gold_gain.desc:0 "Como sou sortudo! Esse encontro é um bom presságio e minha renda deverá se beneficiar com isso."
 admiring_birds.1001.golden_eagle.desc:0 "Que fera majestosa! Tive a sorte de presenciar a manobra de caça dessa águia-dourada. O pobre roedor nem percebeu a morte se aproximando. O marrom escuro dominante da plumagem serve como uma boa camuflagem, suponho."
 admiring_birds.1001.great_egret.desc:0 "A plumagem branca imaculada aparece como uma nuvem sobre o lago. As pernas longas e finas do garça-real desaparecem na luz, dando a impressão de ter um corpo superior flutuante."
 admiring_birds.1001.horned_lark.desc:0 "Um enorme bando de cotovias-dos-prados está vasculhando o solo, procurando por minhocas e conversando entre si. Eu imediatamente paro para não assustá-los."
 admiring_birds.1001.mallard.desc:0 "As penas iridescentes roxo-azuladas do espelho das aves em voo chamam minha atenção enquanto estou vagando. O marreco pousa um pouco mais longe, em um prado próximo."
 admiring_birds.1001.northern_harrier.desc:0 "Embora possa ser confundido com uma coruja, o orgulhoso gavião-asa-de-pedra se distingue caçando em plena luz do dia."
 admiring_birds.1001.northern_shoveler.desc:0 "`É uma rocha!... um pico!... uma ponta! Uma ponta, de fato! É um cuneiforme! O marreco-de-peito-roxo tem um bico bastante único."
 admiring_birds.1001.osprey.desc:0 "Ao passar ao lado de um lago, uma ave irrompe da água, um peixe em seu bico negro. O gavião-pescador voa rapidamente para longe."
 admiring_birds.1001.piety_gain.desc:0 "Sou abençoado! Isso despertou algo profundo dentro de mim."
 admiring_birds.1001.prestige_gain.desc:0 "Que encontro raro! Todos ficarão com inveja de mim."
 admiring_birds.1001.prowess_gain.desc:0 "Observar como ele persegue a presa é bastante inspirador! Poderei usar isso no campo de batalha."
 admiring_birds.1001.red_crossbill.desc:0 "Uma melodia tranquila e pacífica chama minha atenção. A princípio, não consegui identificar a fonte, com sons ecoando entre as árvores. Quando de repente vejo algumas formas de cor laranja, empoleiradas no topo de uma árvore. Alguns bicudos-alpinos estão se alimentando nos pinheiros."
 admiring_birds.1001.stress_loss_gain.desc:0 "Nada poderia ser mais relaxante do que observar esse pássaro voando."
 admiring_birds.1001.t:0 "Oh! Um pássaro!"
