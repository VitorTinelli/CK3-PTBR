l_spanish:
 cheaper_to_convert_to_pilgrim_faith_tt:0 "Você ganha um desconto de #P 50%#! ao converter para o [THIS.Char.GetFaith.GetName]"
 hit_it_off_tt:0 "Eles se dão bem"
 pilgrimage.drive_to_succeed.t:0 "Determinado a ter sucesso"
 pilgrimage.drive_to_survive.desc:0 "Você está determinado a sobreviver"
 pilgrimage.drive_to_survive.t:0 "Determinado a Sobreviver"
 pilgrimage.existential_dread.desc:0 "Você está cheio de angústia existencial"
 pilgrimage.existential_dread.t:0 "Angústia Existencial"
 pilgrimage.failed_contemplation.desc:0 "Você não faz progresso"
 pilgrimage.failed_contemplation.t:0 "Contemplação Fracassada"
 pilgrimage.godly_meditation.desc:0 "Você contempla a natureza do divino"
 pilgrimage.godly_meditation.t:0 "Meditação Divina"
 pilgrimage.imperial_contemplation.desc:0 "Você contempla a brevidade dos impérios"
 pilgrimage.imperial_contemplation.t:0 "Contemplação Imperial"
 pilgrimage.you_lose_the_animal.desc:0 "Você perdeu o(a) [ROOT.Char.Custom('GetAnimalType')]"
 pilgrimage.you_lose_the_animal.t:0 "Animal Perdido"
 pilgrimage_intent.1000.a.alternate:0 "\"Posso oferecer uma perspectiva alternativa?\""
 pilgrimage_intent.1000.a.conversion_failed.desc:0 "Você falha em converter [sad_peasant.GetSheHe]"
 pilgrimage_intent.1000.a.conversion_failed.t:0 "Conversão Mal-sucedida"
 pilgrimage_intent.1000.a.conversion_succesful.desc:0 "Você converte [sad_peasant.GetSheHe]"
 pilgrimage_intent.1000.a.conversion_succesful.t:0 "Conversão Bem-sucedida"
 pilgrimage_intent.1000.a:0 "\"Há uma resposta em [ROOT.Char.GetFaith.HealthGodName|U].\""
 pilgrimage_intent.1000.b.joined.desc:0 "[sad_peasant.GetSheHe|U] junta-se à sua peregrinação"
 pilgrimage_intent.1000.b.joined.t:0 "Junta-se à Peregrinação"
 pilgrimage_intent.1000.b.not_joined.desc:0 "[sad_peasant.GetSheHe|U] não está convencido"
 pilgrimage_intent.1000.b.not_joined.t:0 "Convite Recusado"
 pilgrimage_intent.1000.b:0 "\"Estamos em uma jornada sagrada. Junte-se a nós.\""
 pilgrimage_intent.1000.c:0 "Essas são as lágrimas de [ROOT.Char.GetFaith.TricksterGodName|U]."
 pilgrimage_intent.1000.desc:0 "Enquanto continuo minha jornada sagrada, encontro [Select_CString( sad_peasant.IsFemale, 'uma', 'um' )] [sad_peasant.GetWomanMan] à beira da estrada, coberta de sujeira e molhada pelas lágrimas.\n\n\"Você está feliz agora? Você levou tudo de mim! Como posso seguir em um mundo governado por uma criatura tão cruel como [sad_peasant.GetFaith.HighGodName|U]?\"\n\nClaramente, [sad_peasant.GetSheHe] está desesperado e passando por uma crise de fé."
 pilgrimage_intent.1000.t:0 "$zealotry_intent_header$ Uma Crise de Fé"
 pilgrimage_intent.1001.a.conversion_failed.desc:0 "Você falha em converter a criança"
 pilgrimage_intent.1001.a.conversion_failed.t:0 "$pilgrimage_intent.1000.a.conversion_failed.t$"
 pilgrimage_intent.1001.a.conversion_succesful.desc:0 "Você converte a criança"
 pilgrimage_intent.1001.a.conversion_succesful.t:0 "$pilgrimage_intent.1000.b.joined.t$"
 pilgrimage_intent.1001.a:0 "\"Eu irei te ensinar.\""
 pilgrimage_intent.1001.b:0 "Vamos seguir em frente."
 pilgrimage_intent.1001.desc:0 "Já vimos muitas crenças estranhas em nossa jornada até a terra sagrada e, ao passar por [ROOT.Char.GetCurrentLocation.GetName], avisto um grupo de crianças brincando na beira da estrada.\n\nTodas param imediatamente para nos observar com admiração nos olhos, como se fôssemos meras curiosidades. Uma criança em particular parece ter uma aparência nobre! Talvez a criança goste de ouvir algumas histórias do [ROOT.Char.GetFaith.ReligiousText]."
 pilgrimage_intent.1001.t:0 "$zealotry_intent_header$ Juventude Impressionável"
 pilgrimage_intent.1010.a.conversion_failed.desc:0 "Você falha em converter [convertable_courtier.GetSheHe]"
 pilgrimage_intent.1010.a.conversion_failed.t:0 "$pilgrimage_intent.1000.a.conversion_failed.t$"
 pilgrimage_intent.1010.a.conversion_succesful.desc:0 "Você converte [convertable_courtier.GetSheHe]"
 pilgrimage_intent.1010.a.conversion_succesful.t:0 "$pilgrimage_intent.1000.a.conversion_succesful.t$"
 pilgrimage_intent.1010.a:0 "\"Estamos em uma jornada sagrada. Junte-se a nós.\""
 pilgrimage_intent.1010.b:0 "\"Não é da sua conta!\""
 pilgrimage_intent.1010.desc:0 "Continuamos nossa jornada por [ROOT.Char.GetCurrentLocation.GetName], com nossos pés ficando cansados e exaustos.\n\nAvistamos um nobre da corte local logo adiante, e [convertable_courtier.GetSheHe] se aproxima para encontrar nosso grupo.\n\n\"Você está claramente perdido, meu amigo. O que traz um humilde [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] a [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]?\""
 pilgrimage_intent.1010.t:0 "$zealotry_intent_header$ Viajantes de Passagem"
 pilgrimage_intent.1020.a.conversion_failed.desc:0 "Você falha em converter os peregrinos"
 pilgrimage_intent.1020.a.conversion_failed.t:0 "$pilgrimage_intent.1000.a.conversion_failed.t$"
 pilgrimage_intent.1020.a.conversion_succesful.desc:0 "Você converte os peregrinos"
 pilgrimage_intent.1020.a.conversion_succesful.t:0 "$pilgrimage_intent.1000.a.conversion_succesful.t$"
 pilgrimage_intent.1020.a:0 "\"Apenas [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] podem fazer essa jornada.\""
 pilgrimage_intent.1020.b:0 "\"Me conte como vocês adoram [pilgrim_character.GetFaith.HighGodName|U].\""
 pilgrimage_intent.1020.c:0 "Somos tão parecidos, eles devem vir conosco!"
 pilgrimage_intent.1020.desc:0 "Até agora, encontramos muitos peregrinos [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] em nosso caminho, e todos têm sido piedosos e devotos à vontade de [ROOT.Char.GetFaith.HighGodName|U].\n\nNo entanto, logo nos deparamos com um grupo de viajantes estranhos de terras distantes. Eles se apresentam como [pilgrim_character.GetFaith.GetAdherentNamePlural], e nos dizem que esta rota também é sagrada para o povo deles."
 pilgrimage_intent.1020.t:0 "$zealotry_intent_header$ Peregrinos Desconhecidos"
 pilgrimage_intent.1030.a:0 "Esta é a vontade de [ROOT.Char.GetFaith.HighGodName|U]."
 pilgrimage_intent.1030.b:0 "Não devemos nos atrasar!"
 pilgrimage_intent.1030.desc:0 "Aqui, na tranquilidade da estrada de [ROOT.Char.GetCurrentLocation.GetName], sinto uma sensação avassaladora de paz e tranquilidade como nunca experimentei antes.\n\nLogo além de uma pequena colina, vejo uma clareira ao lado do caminho onde nem homem nem animal parecem ter entrado por décadas. Sinto a presença de [ROOT.Char.GetFaith.HighGodName|U] aqui, e talvez eu deva permanecer aqui em contemplação silenciosa por um tempo."
 pilgrimage_intent.1030.desc_sea:0 "Aqui no mar, quando o tempo está calmo e nenhum navio é visto no horizonte, a paz e o silêncio são avassaladores. A presença de [ROOT.Char.GetFaith.HighGodName|U] é particularmente forte aqui, e isso me enche completamente.\n\nTalvez devêssemos aproveitar a oportunidade de contemplação silenciosa, permanecendo nesta baía por um pouco mais de tempo?"
 pilgrimage_intent.1030.t:0 "$reflections_intent_header$ Uma Clareira Calma"
 pilgrimage_intent.1040.a:0 "[ROOT.Char.Custom('GetAnimalType')|U] é um mensageiro de [ROOT.Char.GetFaith.HighGodName]! Siga [ROOT.Char.GetSheHe]!"
 pilgrimage_intent.1040.b:0 "Não podemos nos distrair."
 pilgrimage_intent.1040.desc.intro:0 "Enquanto percorremos esta estrada sagrada, somos repentinamente obrigados a parar quando um animal cruza nosso caminho.\n\n"
 pilgrimage_intent.1040.desc.mid.pred:0 "Poderoso(a) [ROOT.Char.Custom('GetAnimalType')] fica entre mim e a terra sagrada."
 pilgrimage_intent.1040.desc.mid.prey:0 "[ROOT.Char.Custom('GetAnimalType')|U] humilde encara nossa caravana sagrada."
 pilgrimage_intent.1040.desc.outro:0 "\n\nHá algo como um olhar sábio no rosto do animal. Como se a mente de [Select_CString( ROOT.Char.IsFemale, 'uma sábia', 'um sábio' )] [ROOT.Char.GetWomanMan] residisse por trás desses olhos selvagens. [ROOT.Char.GetSheHe|U] pisca e continua seu caminho."
 pilgrimage_intent.1040.t:0 "$reflections_intent_header$ Um Presságio Bestial"
 pilgrimage_intent.1041.a:0 "Minhas guerras serão bem-sucedidas!"
 pilgrimage_intent.1041.b:0 "Meus inimigos cairão quando eu atacar!"
 pilgrimage_intent.1041.desc.intro:0 "Sigo diligentemente o(a) [ROOT.Char.Custom('GetAnimalType')], tendo o cuidado de não ser notado.\n\nEventualmente, [ROOT.Char.GetSheHe] encontra a presa: um pequeno pássaro."
 pilgrimage_intent.1041.desc.mid:0 "[ROOT.Char.Custom('GetAnimalType')|U] faz seu movimento, e à medida que o pássaro tenta escapar fracamente, ele é rapidamente despedaçado em penas e gore."
 pilgrimage_intent.1041.desc.outro:0 "\n\nO que [ROOT.Char.GetFaith.HighGodName|U] quis dizer com isso?"
 pilgrimage_intent.1041.t:0 "Presságio: Uma Caçada Bem-sucedida"
 pilgrimage_intent.1042.a:0 "Eu sou o(a) [ROOT.Char.Custom('GetAnimalType')], e meus inimigos me vencerão."
 pilgrimage_intent.1042.b:0 "Eu sou o pássaro, e escaparei de um destino cruel!"
 pilgrimage_intent.1042.desc.mid:0 "[ROOT.Char.Custom('GetAnimalType')|U] espera e espera por sua oportunidade, e eventualmente ataca o pássaro apenas para que ele escape e voe para longe no céu aberto."
 pilgrimage_intent.1042.t:0 "Presságio: Uma Caçada Fracassada"
 pilgrimage_intent.1043.a:0 "Em breve terei um filho!"
 pilgrimage_intent.1043.b:0 "Devo fazer amigos dos meus inimigos."
 pilgrimage_intent.1043.c:0 "Devo priorizar minha família."
 pilgrimage_intent.1043.desc.intro:0 "Sigo o(a) [ROOT.Char.Custom('GetAnimalType')], mantendo uma distância segura para não assustá-lo. Eventualmente, [ROOT.Char.GetSheHe] encontra outro(a) [ROOT.Char.Custom('GetAnimalType')] na clareira, talvez seu companheiro?\n\n"
 pilgrimage_intent.1043.desc.mid:0 "Os dois se chocam um pouco, mas logo se aninham e desaparecem juntos na selva."
 pilgrimage_intent.1043.t:0 "Presságio: Uma Família Feliz"
 pilgrimage_intent.1044.a:0 "Algo está vindo atrás de mim!"
 pilgrimage_intent.1044.b:0 "Destruirei meus inimigos sem ser notado!"
 pilgrimage_intent.1044.desc.mid:0 "Os dois se aproximam um do outro, mas antes que possam se encontrar, uma figura sombria e borrada salta do nada e reduz a pobre criatura a uma mancha ensanguentada diante dos olhos de seu companheiro."
 pilgrimage_intent.1044.t:0 "Presságio: Uma Visão Terrível"
 pilgrimage_intent.1050.a:0 "Vou aproveitar ao máximo o meu tempo."
 pilgrimage_intent.1050.b:0 "Ainda tenho tanta vida para viver!"
 pilgrimage_intent.1050.c:0 "Essas ideias fazem meu coração doer."
 pilgrimage_intent.1050.desc.intro:0 "Ao longo do caminho para a terra sagrada, encontrei todo tipo de peregrinos, jovens e idosos. É como se eu estivesse testemunhando uma tapeçaria da minha própria vida se desenrolar diante de mim.\n\n"
 pilgrimage_intent.1050.desc.mid.old:0 "Cabelos prateados e pele enrugada sempre pareceram tão distantes, até que chegaram a mim. Não consigo evitar a sensação de que esta peregrinação pode ser a minha última, antes de embarcar na jornada final para [ROOT.Char.GetFaith.PositiveAfterLife|U]."
 pilgrimage_intent.1050.desc.mid.young:0 "Ainda tenho muito tempo de vida pela frente, e no entanto, tudo parece tão curto quando confrontado com o conceito de eternidade."
 pilgrimage_intent.1050.desc.mid.young_and_dying:0 "Em minha saúde debilitada, minha vida provavelmente não será tão longa quanto a maioria. Ao ver os rostos sorridentes daqueles sortudos o suficiente para envelhecer pelo tempo, não posso deixar de sentir inveja de suas longas vidas."
 pilgrimage_intent.1050.desc.outro:0 "\n\nTalvez eu deva parar um pouco e contemplar a brevidade da vida."
 pilgrimage_intent.1050.t:0 "$reflections_intent_header$ Uma Contemplação Terrena"
 pilgrimage_intent.1060.a:0 "Devo contemplar os antigos impérios."
 pilgrimage_intent.1060.b:0 "Devo contemplar as antigas religiões."
 pilgrimage_intent.1060.c:0 "Bobagem, [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] durará para sempre!"
 pilgrimage_intent.1060.desc.intro:0 "Caminhando por este caminho, encontrei muitos lembretes daqueles que vieram antes de mim.\n\nAqui em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip],"
 pilgrimage_intent.1060.desc.mid.ashokas_pillars:0 "Encontro mais um dos pilares de Ashoka, construídos há tanto tempo. Cada um deles está inscrito com éditos emitidos pelo Imperador Ashoka séculos atrás. Esses monumentos dhármicos estão espalhados por terras que antes compunham o Império Maurya, mas o próprio império é apenas poeira."
 pilgrimage_intent.1060.desc.mid.egypt:0 "Vejo os monumentos imponentes dos antigos faraós. Eles passaram uma vida inteira construindo esses tributos gigantescos a seus deuses, feitos de alabastro e ouro, apenas para que agora fiquem empoeirados com areia e frágeis com a idade."
 pilgrimage_intent.1060.desc.mid.fallback:0 "Vejo lembranças daqueles que habitaram esta terra muito antes de nós. Templos antigos, armas quebradas, fragmentos aleatórios de objetos irreconhecíveis. O tempo nos reivindica a todos, e as divindades que adoramos e a forma como as adoramos estão sempre em fluxo."
 pilgrimage_intent.1060.desc.mid.israel:0 "Vi inúmeros lembretes dos antigos hebreus que uma vez viajaram aqui como sua terra prometida. Os antigos templos que antes se erguiam como lugares de adoração a [GetFaithByKey('rabbinism').HighGodName|U] agora foram deixados para se decompor, assim como os hebreus foram impulsionados novamente ao êxodo."
 pilgrimage_intent.1060.desc.mid.kush:0 "Vejo lembretes dos muitos impérios que surgiram e caíram aqui ao longo do Nilo. As pirâmides de Kush, templos axumitas, mal se pode viajar sem avistar um monumento em ruínas do passado."
 pilgrimage_intent.1060.desc.mid.persia:0 "Continuo encontrando lembretes dos antigos Sassânidas, Partas e Seleucidas. Inúmeros impérios surgiram e desapareceram aqui na Pérsia, e mesmo assim a própria Pérsia permanece. Antigos templos zoroastristas estão em estado de abandono por toda a nação, e talvez um dia até mesmo nossas cidades sagradas desmoronem em pó."
 pilgrimage_intent.1060.desc.mid.rome:0 "Deparei-me com os restos desmoronados de um santuário ao antigo panteão romano. [GetFaithByKey('hellenic_pagan').FertilityGodName|U], em toda a sua beleza, sorri para mim com uma boca meio rachada, e o rosto de [GetFaithByKey('hellenic_pagan').HighGodName] foi erodido quase além do reconhecimento."
 pilgrimage_intent.1060.desc.outro:0 "\n\nTalvez um dia, [Select_CString( ROOT.Char.IsFemale, 'alguma outra', 'algum outro' )] [ROOT.Char.GetWomanMan] vagará por este caminho e contemplará o [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] caído e a fé [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] praticada por seus [ROOT.Char.GetTitleAsNameNoTooltip|U]."
 pilgrimage_intent.1060.t:0 "$reflections_intent_header$ Os Impérios de Outrora"
 pilgrimage_intent.1100.a:0 "É meu dever sagrado, é claro!"
 pilgrimage_intent.1100.b:0 "O que eu realmente quero é desfrutar e vivenciar outras culturas."
 pilgrimage_intent.1100.c:0 "Faço apenas o necessário para minha posição."
 pilgrimage_intent.1100.desc:0 "Aqui fora, tarde da noite, às vezes olho para as estrelas e me pergunto. Qual é o nosso propósito na vida?\n\nSerá que [ROOT.Char.GetFaith.PantheonTerm] pode me ver, tão longe de casa? Para que estou fazendo tudo isso?"
 pilgrimage_intent.1100.t:0 "$reflections_intent_header$ Céus Estrelados"
 pilgrimage_intent.1110.a:0 "Tudo ficará bem, apenas segure firme."
 pilgrimage_intent.1110.b:0 "Provações e dificuldades são normais..."
 pilgrimage_intent.1110.c:0 "Vamos orar pela sua recuperação."
 pilgrimage_intent.1110.d:0 "Devo ter algumas ervas para isso."
 pilgrimage_intent.1110.desc.outro_altruism:0 "\n\nDevo tentar confortar [affected_pilgrim.GetSheHe] de alguma forma. Talvez eu devesse oferecer a [affected_pilgrim.GetSheHe] um pouco da minha água?"
 pilgrimage_intent.1110.desc.outro_reflection:0 "\n\nSó posso simpatizar com [affected_pilgrim.GetSheHe]. Por que nos submetemos a esses perigos, às vezes ameaçadores para a vida?"
 pilgrimage_intent.1110.desc.outro_zealot:0 "\n\nTenho certeza de que [ROOT.Char.GetFaith.PantheonTerm] nos ajudará. Talvez devêssemos fazer algumas orações para acelerar o processo?"
 pilgrimage_intent.1110.desc:0 "Andando pelo navio em nossa jornada para [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip], vejo um colega peregrino que não parece estar muito bem. Claramente, suas pernas no mar nunca foram desenvolvidas.\n\n[affected_pilgrim.GetSheHe|U] geme suavemente, [Select_CString( affected_pilgrim.IsFemale, 'agachada', 'agachado' )] próximo ao corrimão, segurando-o com todas as forças, com uma expressão pálida que varia em nuances claras."
 pilgrimage_intent.1110.e:0 "Ainda bem que não sou eu."
 pilgrimage_intent.1110.t:0 "Pernas no Mar"
 pilgrimage_intent.1110.t_altruism:0 "$altruism_intent_header$ $pilgrimage_intent.1110.t$"
 pilgrimage_intent.1110.t_reflection:0 "$reflections_intent_header$ $pilgrimage_intent.1110.t$"
 pilgrimage_intent.1110.t_zealot:0 "$zealotry_intent_header$ $pilgrimage_intent.1110.t$"
 pilgrimage_intent.9000.a.flavor:0 "Em sua união, [ROOT.Char.GetFaith.HighGodName] encontrará um novo servo!"
 pilgrimage_intent.9000.a:0 "Aceite, [ROOT.Char.GetFaith.HighGodName], e [entourage_to_marry_2.GetSheHe] será [Select_CString( entourage_to_marry_2.IsFemale, 'sua', 'seu' )]."
 pilgrimage_intent.9000.b.flavor:0 "[smitten_heathen.GetFaith.GetAdherentNamePlural] certamente possuem rituais de conquista interessantes, devo observá-los."
 pilgrimage_intent.9000.b:0 "Oh, meu querido, você deveria conversar com #EMP [entourage_to_marry_2.GetSheHe]#!, não comigo!"
 pilgrimage_intent.9000.c:0 "Não temos tempo para isso..."
 pilgrimage_intent.9000.desc:0 "Nos mercados de [background_market_scope.GetName], um[Select_CString( smitten_heathen.IsFemale, 'a', '' )] [smitten_heathen.GetWomanMan] familiar faz uma aparição. Como um filhote, [smitten_heathen.GetSheHe] tem nos seguido há dias.\n\nCom olhos suplicantes, [smitten_heathen.GetSheHe] exclama: '[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetLadyLord|U] — [Select_CString( entourage_to_marry_2.IsFemale, 'a sua', 'o seu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entourage_to_marry_2'))], [entourage_to_marry_2.GetFirstName], [entourage_to_marry_2.GetSheHe] me amará algum dia? Pois [entourage_to_marry_2.GetSheHe] é [entourage_to_marry_2.GetFaith.GetAdherentName] e eu sou da fé [smitten_heathen.GetFaith.GetAdjective]... mas há uma chance?'\n\n[smitten_heathen.GetSheHe|U] parece [Select_CString( smitten_heathen.IsFemale, 'apaixonada', 'apaixonado' )], mas [entourage_to_marry_2.GetFirstNameNoTooltip] parece menos [Select_CString( entourage_to_marry_2.IsFemale, 'certa', 'certo' )]. [ROOT.Char.GetFaith.HighGodName] aprovaria essa união?"
 pilgrimage_intent.9000.seducer.flavor:0 "Ensine um truque ou dois para conquistar [entourage_to_marry_2.GetFirstName] e envolver seu dedo."
 pilgrimage_intent.9000.seducer:0 "Deixe-me te mostrar como se faz!"
 pilgrimage_intent.9000.t:0 "$zealotry_intent_header$ Um [ROOT.Char.Custom('GetDerogatoryNonbeliever')|U] Apaixonado"
 they_fight_publicly_tt:0 "Eles causam uma cena"
 you_follow_the_animal_tt:0 "Você segue o animal mais profundamente..."
