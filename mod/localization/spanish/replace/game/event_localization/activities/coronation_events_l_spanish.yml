l_spanish:
 PISTOS_EN_CHRISTOI_BASILEUS_GLOSS:0 "Significando 'fiel em Cristo, Soberano', a substituição bizantina do termo latino 'Augustus'."
 SACRA_MAJESTAS_GLOSS:0 "Latim para #BOL 'majestade sagrada'#!, o mandato divino reivindicado pelos Imperadores do Sacro Império Romano para governar seus súditos justamente, não apenas como governante secular, mas também como espiritual."
 ach_can_refuse_reward:0 "Você poderá recusar a seguinte recompensa por [gold_i][host.MakeScope.ScriptValue('minor_gold_value')|0V] [gold|E] ou melhoria das relações com [host.GetShortUIName]:"
 ach_coronation.0001.a.bad:0 "Hora de ver em que encrenca posso me meter..."
 ach_coronation.0001.a.eccentric:0 "Para sempre..."
 ach_coronation.0001.a.good:0 "Um novo capítulo começa hoje."
 ach_coronation.0001.a:0 "Em breve, meu reinado começa!"
 ach_coronation.0001.ending.friendly_host:0 "\n\n[host.GetTitledFirstNameNoTooltip] é conhecid[Select_CString( host.IsFemale, 'a', 'o' )] por gostar de mim — que seu reinado seja frutífero para nós dois! Ou pelo menos para mim..."
 ach_coronation.0001.ending.host_ambitious:0 "\n\nA consciência de que em breve uma coroa será colocada sobre minha cabeça é jubilosa — mas é apenas o primeiro passo rumo à #EMP verdadeira#! glória."
 ach_coronation.0001.ending.host_arbitrary:0 "\n\nEm breve serei [ROOT.Char.GetTitleAsNameNoTooltip], e ninguém poderá dizer o contrário! Finalmente estarei livre para governar como #emp EU#! quiser."
 ach_coronation.0001.ending.host_arrogant:0 "\n\nLogo todos — plebeus e nobres — estarão se curvando diante de mim... ótimo."
 ach_coronation.0001.ending.host_calm:0 "\n\nEmbora a coroação deva ser um dia de alegria para todos, devo ser cuidadoso; os dias à frente podem se mostrar perigosos..."
 ach_coronation.0001.ending.host_compassionate:0 "\n\nEmbora a glória que virá seja grandiosa, devo lembrar que é ao povo do meu [ROOT.Char.GetPrimaryTitle.GetTierAsName] que preciso provar meu valor."
 ach_coronation.0001.ending.host_content:0 "\n\nSinceramente, eu poderia ter passado sem tudo isso, mas há certas coisas que um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] simplesmente deve fazer."
 ach_coronation.0001.ending.host_craven:0 "\n\nTudo vai correr bem, espero, desde que meus vassalos obedeçam... e-eles vão obedecer, não é?"
 ach_coronation.0001.ending.host_cynical:0 "\n\nAgora me preparo para me inclinar diante d[Select_CString( priest.IsFemale, 'a', 'o' )] [priest.GetFirstName] diante do reino como um tolo piedoso, mas assim que me levantar nunca mais serei forçado a tolerar as tagarelices [priest.GetHerHim]!"
 ach_coronation.0001.ending.host_cynical_hof:0 "\n\nMal posso esperar para ver [Select_CString( priest.IsFemale, 'a', 'o' )] [priest.GetTitledFirstName] desfilar com um séquito das pessoas mais entediantes imagináveis..."
 ach_coronation.0001.ending.host_eccentric:0 "\n\nLogo serei coroado, e então reinarei #EMP para sempre#!."
 ach_coronation.0001.ending.host_gluttonous:0 "\n\nMal posso esperar para ser coroado! Será glorioso banquetear com o reino como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] verdadeir[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]!"
 ach_coronation.0001.ending.host_gregarious:0 "\n\nTerei tantas pessoas com quem precisarei falar... isso pode ser bem divertido!"
 ach_coronation.0001.ending.host_impatient:0 "\n\nMal posso esperar para acabar logo com isso! A antecipação é uma tortura, [ROOT.Char.Custom('GetBusynessOpinion')] estarei ocupado demais para pensar nisso..."
 ach_coronation.0001.ending.host_just:0 "\n\nAté agora fui ilegítimo, nada mais que um pretendente. Mas quando esta cerimônia terminar, finalmente — de verdade — serei [ROOT.Char.GetTitleAsNameNoTooltip]!"
 ach_coronation.0001.ending.host_neutral:0 "\n\nEmbora eu já reine, é esta coroação que me marcará como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] verdadeir[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip], e estou pronto."
 ach_coronation.0001.ending.host_paranoid:0 "\n\nEm breve, todos os meus vassalos estarão aqui comigo e [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] será um ninho de víboras. Preciso vigiar minhas costas..."
 ach_coronation.0001.ending.host_shy:0 "\n\nTodo o reino em breve estará em [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]... quanto antes isso acabar, melhor."
 ach_coronation.0001.ending.host_trusting:0 "\n\nEm breve, todos os meus vassalos estarão aqui comigo, cada um deles certamente aclamando meu nome!"
 ach_coronation.0001.ending.host_zealous:0 "\n\nDevo orar, pois somente [ROOT.Char.GetFaith.HighGodName] pode realmente decidir se sou digno."
 ach_coronation.0001.ending.hostile_host:0 "\n\n[host.GetTitledFirstNameNoTooltip] certamente não é [Select_CString( host.IsFemale, 'minha amiga', 'meu amigo' )], mas eu — e o reino — resistiremos."
 ach_coronation.0001.ending.neutral_host:0 "\n\nAme ou odeie [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip], ninguém pode negar o sentimento de importância compartilhado entre nós que seremos testemunhas."
 ach_coronation.0001.guest:0 "[host.GetTitledFirstName] será coroad[Select_CString( host.IsFemale, 'a', 'o' )] aqui em [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], e só posso esperar que [host.GetSheHe] se prove digno da sua coroa."
 ach_coronation.0001.intro.byzantine:0 "Esses eventos colocarão [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstName] entre nomes como Heráclio e Justiniano. Governar os [Glossary( 'Romaioi', 'ROMAIOS_GLOSS' )] é governar o mundo, e só se pode esperar que [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNameNoTooltip] esteja à altura da ocasião."
 ach_coronation.0001.intro.byzantine_host:0 "Logo tomarei meu lugar de direito ao lado de Constantino e Teodósio. Serei [Glossary( 'Autokrator', 'AUTOKRATOR_GLOSS')], mestre do universo, governante de toda Roma, um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] verdadeir[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsName]!"
 ach_coronation.0001.intro.host:0 "O ar vibra de antecipação, enquanto me dou conta de que finalmente serei coroad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip] de [ROOT.Char.GetPrimaryTitle.GetNameNoTier]."
 ach_coronation.0001.intro.hre:0 "Não será pouca coisa coroar um[Select_CString( host.IsFemale, 'a', '' )] [host.GetTitleAsName]. Todo o [host.GetPrimaryTitle.GetTierAsName] parece estar se reunindo em [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], e as bandeiras dos eleitores e de centenas de nobres locais já tremulam."
 ach_coronation.0001.intro.hre_host:0 "Em breve sentarei no trono de Carlos Magno, usarei a coroa de Otão e falarei com a voz de Augusto. Os eleitores já escolheram s[Select_CString( ROOT.Char.IsFemale, 'sua', 'seu' )] [ROOT.Char.GetTitleAsNameNoTooltip], agora é a hora de todos os outros seguirem o exemplo."
 ach_coronation.0001.intro.notravel_host:0 "Somente quando o último convite é enviado e a corte começa os preparativos é que percebo: finalmente serei coroad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsName] de [ROOT.Char.GetPrimaryTitle.GetNameNoTier]."
 ach_coronation.0001.notravel:0 "Mensagens e servos foram enviados de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] para a coroação."
 ach_coronation.0001.t:0 "Chegada"
 ach_coronation.0001.travel:0 "Finalmente cheguei a [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] para a coroação."
 ach_coronation.0001.tt.hof_visit.title:0 "Visita Sagrada"
 ach_coronation.0001.tt.hof_visit:0 "[hof.GetCurrentLocation.GetBaronyNameExplicitly] recebe [GetModifier('ach_hof_visit_modifier').GetNameWithTooltip] devido à chegada d[Select_CString( hof.IsFemale, 'a', 'o' )] [hof.GetTitledFirstName]"
 ach_coronation.0010.a.tt.anger:0 "[hof.GetTitledFirstNameNoTooltip] está ofendid[Select_CString( hof.IsFemale, 'a', 'o' )] por você ter perguntado"
 ach_coronation.0010.a.tt.failure:0 "[hof.GetTitledFirstNameNoTooltip] se recusa a receber"
 ach_coronation.0010.a.tt.success:0 "[hof.GetTitledFirstNameNoTooltip] ouve suas súplicas! Louve a [ROOT.Char.GetFaith.HighGodName]!"
 ach_coronation.0010.a:0 "Espere! Devo falar com [hof.GetSheHe]!"
 ach_coronation.0010.b.cynical:0 "Bah! Muito barulho por nada."
 ach_coronation.0010.b.friend:0 "[hof.GetFirstNameNoTooltip] está aqui? Viva!"
 ach_coronation.0010.b.heathen:0 "Quem se importa?"
 ach_coronation.0010.b.heretic:0 "Ele não é m[Select_CString( hof.IsFemale, 'inha', 'eu' )] [hof.GetTitleAsNameNoTooltip]!"
 ach_coronation.0010.b.lover:0 "Mmm, devo esperar que [hof.GetSheHe] tenha tempo para nós..."
 ach_coronation.0010.b.rival:0 "Bah! Maldição a ess[Select_CString( hof.IsFemale, 'a', 'e' )] '[hof.GetTitleAsNameNoTooltip].'"
 ach_coronation.0010.b.witch:0 "Talvez agora seja hora de ficar na defensiva..."
 ach_coronation.0010.b.zealous:0 "Somos verdadeiramente abençoados!"
 ach_coronation.0010.b:0 "Uma visão impressionante!"
 ach_coronation.0010.desc.desc_ending.excommunicated:0 "Muitos se surpreendem que [Select_CString( hof.IsFemale, 'a', 'o' )] [hof.GetTitledFirstName] tenha vindo, dado a excomunhão em andamento d[Select_CString( hof.IsFemale, 'a', 'o' )] [host.GetFirstNamePossessiveNoTooltip] — [host.GetTitleAsNameNoTooltip] sem dúvida pagará caro por sua coroa..."
 ach_coronation.0010.desc.desc_ending.excommunicated_first_person:0 "Estou surpreso que [Select_CString( hof.IsFemale, 'a', 'o' )] [hof.GetTitledFirstNameNoTooltip] tenha vindo, dado minha excomunhão em andamento. Sem dúvida, o custo da bênção [hof.GetHerHim] será grande..."
 ach_coronation.0010.desc.desc_ending.low_fervor:0 "A fé [hof.GetFaith.GetName] já viu dias melhores; nunca antes as chamas da fé pareceram tão tênues e os verdadeiros crentes tão raros. Tanto os devotos quanto [Select_CString( hof.IsFemale, 'a', 'o' )] [hof.GetTitleAsNameNoTooltip] sem dúvida esperam que a coroação d[Select_CString( host.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('host'))|U] revitalize a fé do [host.GetPrimaryTitle.GetTierAsName]."
 ach_coronation.0010.desc.desc_ending.neutral:0 "É impressionante que [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip] seja coroad[Select_CString( host.IsFemale, 'a', 'o' )] p[Select_CString( hof.IsFemale, 'ela própria', 'elo próprio' )] [hof.GetTitledFirstNameNoTooltip] — mas sem dúvida o preço exigido será alto."
 ach_coronation.0010.desc.desc_ending.neutral_first_person:0 "Minha legitimidade será inquestionável quando [Select_CString( hof.IsFemale, 'a', 'o' )] [hof.GetTitledFirstName] me coroar."
 ach_coronation.0010.desc.desc_ending.opinion_bad:0 "Ainda assim, as tensões entre [Select_CString( hof.IsFemale, 'a', 'o' )] [hof.GetTitleAsNameNoTooltip] e [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip] [host.Custom2('GetRandomConflictDescriptor', SCOPE.sC('hof'))], e a atmosfera na coroação será sem dúvida tensa."
 ach_coronation.0010.desc.desc_ending.opinion_bad_first_person:0 "Ainda assim, as tensões entre [Select_CString( hof.IsFemale, 'a', 'o' )] [hof.GetTitleAsNameNoTooltip] e eu [host.Custom2('GetRandomConflictDescriptor', SCOPE.sC('hof'))], e a atmosfera na coroação será sem dúvida tensa."
 ach_coronation.0010.desc.desc_ending.opinion_good:0 "As relações entre [Select_CString( hof.IsFemale, 'a', 'o' )] [hof.GetTitleAsNameNoTooltip] e [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip] são calorosas, e o povo de [coronation_site.GetHolding.GetNameNoTooltip] sem dúvida brindará a ambos por muitas semanas."
 ach_coronation.0010.desc.desc_ending.opinion_good_first_person:0 "As relações entre [Select_CString( hof.IsFemale, 'a', 'o' )] [hof.GetTitleAsNameNoTooltip] e eu são calorosas, e o povo de [coronation_site.GetHolding.GetNameNoTooltip] sem dúvida brindará a nós por muitas semanas."
 ach_coronation.0010.desc.desc_ending.opinion_very_good:0 "Diz-se que [Select_CString( hof.IsFemale, 'a', 'o' )] [hof.GetTitleAsNameNoTooltip] e [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip] são grandes amigos, e esta coroação sem dúvida será uma ocasião alegre para ambos."
 ach_coronation.0010.desc.desc_ending.opinion_very_good_first_person:0 "[hof.GetFirstNameNoTooltip] e eu somos grandes amigos, e esta coroação sem dúvida será uma ocasião alegre para ambos."
 ach_coronation.0010.desc.desc_first.compassionate:0 "A compaixão d[Select_CString( hof.IsFemale, 'a', 'o' )] [hof.GetTitleAsNameNoTooltip] é lendária, e muitas orações ao seu coração bondoso enchem o ar junto com histórias de"
 ach_coronation.0010.desc.desc_first.cynical:0 "[hof.GetTitledFirstName] é infamemente conhecid[Select_CString( hof.IsFemale, 'a', 'o' )] menos pela fé e mais por"
 ach_coronation.0010.desc.desc_first.generous:0 "[hof.GetTitledFirstName] é conhecid[Select_CString( hof.IsFemale, 'a', 'o' )] como um[Select_CString( hof.IsFemale, 'a', '' )] [hof.GetWomanMan] generos[Select_CString( hof.IsFemale, 'a', 'o' )] — os locais sem dúvida desfrutarão de abundantes esmolas junto com"
 ach_coronation.0010.desc.desc_first.greedy:0 "Os pobres locais não devem esperar muitas esmolas — dizem que [Select_CString( hof.IsFemale, 'a', 'o' )] [hof.GetTitledFirstNameNoTooltip] é bastante avarento — embora certamente testemunhem"
 ach_coronation.0010.desc.desc_first:0 "Os fiéis se reúnem para ver [Select_CString( hof.IsFemale, 'a', 'o' )] [hof.GetTitledFirstNameNoTooltip], e cada comerciante e mendigo na cidade os segue, assim como aqueles que simplesmente esperam testemunhar"
 ach_coronation.0010.desc.desc_greeting.baron:0 "[greeter.GetTitledFirstName] e o [greeter.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] local, [greeter_2.GetTitledFirstName], são os primeiros a encontrar a delegação [hof.GetPrimaryTitle.GetAdjective], e só entram em [coronation_site.GetHolding.GetNameNoTooltip] após [greeter.Custom2('GetHoFGreeterExchange', SCOPE.sC('hof'))].\n\n"
 ach_coronation.0010.desc.desc_greeting.first_person:0 "Meu [greeter.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] [greeter_2.GetFirstName] e eu somos os primeiros a encontrar [Select_CString( hof.IsFemale, 'a', 'o' )] [hof.GetTitleAsNameNoTooltip], e após [greeter.Custom2('GetHoFGreeterExchangeFirstPerson', SCOPE.sC('hof'))], entramos em [coronation_site.GetHolding.GetNameNoTooltip].\n\n"
 ach_coronation.0010.desc.desc_greeting.host:0 "[greeter.GetTitledFirstName] e seu [greeter.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName], [greeter_2.GetFirstName], são os primeiros a encontrar a delegação [hof.GetPrimaryTitle.GetAdjective], e só entram em [coronation_site.GetHolding.GetNameNoTooltip] após [greeter.Custom2('GetHoFGreeterExchange', SCOPE.sC('hof'))].\n\n"
 ach_coronation.0010.desc.desc_opening:0 "Sinos tocam em cada [coronation_site.GetCounty.GetFaith.HouseOfWorship] e o povo comemora nas ruas de [coronation_site.GetHolding.GetName], enquanto as bandeiras d[Select_CString( hof.IsFemale, 'a', 'o' )] [hof.GetTitledFirstName] surgem no horizonte."
 ach_coronation.0010.desc.desc_second.gluttonous:0 "o infame apetite [hof.GetHerHim] — supostamente o tormento de toda [hof.Custom('GetExpensiveDessert')] em [hof.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]."
 ach_coronation.0010.desc.desc_second.lustful:0 "as infames... proclividades [hof.GetHerHim]."
 ach_coronation.0010.desc.desc_second.strong:0 "a estatura lendária [hof.GetHerHim], um físico sem dúvida abençoado por [hof.GetFaith.HighGodName]."
 ach_coronation.0010.desc.desc_second.wrathful:0 "o temperamento lendariamente inflamado e audacioso [hof.GetHerHim]."
 ach_coronation.0010.desc.desc_second.zealous:0 "os famosos sermões inflamados e o zelo excepcional [hof.GetHerHim]."
 ach_coronation.0010.desc.desc_second:0 "a grande importância e prestígio [hof.GetHerHim]."
 ach_coronation.0010.t:0 "[hof.GetTitledFirstNameNoTooltip] Chega"
 ach_coronation.0011.a.failure:0 "[plotter.GetTitledFirstName] é muito escorregadi[Select_CString( plotter.IsFemale, 'a', 'o' )]"
 ach_coronation.0011.a.success.tt:0 "O plano é revelado! Pelo menos, se existir"
 ach_coronation.0011.a.success:0 "[plotter.GetTitledFirstName] foi peg[Select_CString( plotter.IsFemale, 'a', 'o' )] em uma mentira"
 ach_coronation.0011.a:0 "Ainda vou obter a verdade [plotter.GetHerHim]..."
 ach_coronation.0011.b.flavor:0 "[coward.GetSheHe|U] já está à beira das lágrimas — um empurrão sem dúvida o/a faria desabar"
 ach_coronation.0011.b.tt:0 "[coward.GetTitledFirstName] revelará o [scheme|E], e se não existir, um [secret|E]"
 ach_coronation.0011.b:0 "[coward.GetTitledFirstNameNoTooltip], fale logo. #BER Agora.#!"
 ach_coronation.0011.c.paranoid:0 "EU #EMP SABIA#!! Prendam esses traidores!"
 ach_coronation.0011.c.wrathful:0 "Como ousa!? Você acha que sou tolo/a! Guardas!"
 ach_coronation.0011.c:0 "Você me toma por tolo/a!? #EMP Guardas!#!"
 ach_coronation.0011.coward.success:0 "[coward.GetSheHe|U] cede em segundos"
 ach_coronation.0011.d:0 "Terei que manter meus olhos n[plotter.GetSheHe]..."
 ach_coronation.0011.desc:0 "Nas sombras de [ROOT.Char.GetCurrentLocation.Custom('GetCoronationSitePrefix')][ROOT.Char.GetCurrentLocation.Custom('GetCoronationSite')], as víboras deslizam silenciosas. Entre servos e cortesãos preparando [ROOT.Char.GetCurrentLocation.Custom('GetCoronationSiteShort')], [plotter.GetTitledFirstName] sussurra para um círculo de convidados recém-chegados.\n\nEles silenciam imediatamente quando me aproximo, antes que [Select_CString( plotter.IsFemale, 'a', 'o' )] [plotter.GetFirstNameNoTooltip] se curve profundamente.\n\n\"M[Select_CString( host.IsFemale, 'inha', 'eu' )] [plotter.Custom2('RelationToMeShort', SCOPE.sC('host') )],\" começa [plotter.GetSheHe], \"Peço desculpas, estávamos apenas falando de... assuntos de natureza pessoal.\""
 ach_coronation.0011.false.toast:0 "[plotter.GetSheHe|U] Planejava um Presente Agradável"
 ach_coronation.0011.hook.toast:0 "[coward.GetTitledFirstNamePossessive] começa a chorar e tagarelar, garantindo que [coward.GetSheHe] fará qualquer coisa para mostrar sua lealdade"
 ach_coronation.0011.scheme.coward.toast:0 "[scheme|E] [coward_scheme.GetSchemeType.GetTypeNameNoTooltip] d[Select_CString( coward.IsFemale, 'a', 'o' )] [coward.GetTitledFirstName] contra [Select_CString( coward_scheme.IsFemale, 'a', 'o' )] [coward_scheme.GetTargetCharacter.GetFirstName] foi descoberto!"
 ach_coronation.0011.scheme.plotter.toast:0 "[scheme|E] [hostile_scheme.GetSchemeType.GetTypeNameNoTooltip] d[Select_CString( plotter.IsFemale, 'a', 'o' )] [plotter.GetTitledFirstName] contra [Select_CString( hostile_scheme.IsFemale, 'a', 'o' )] [hostile_scheme.GetTargetCharacter.GetFirstName] foi descoberto!"
 ach_coronation.0011.secret.coward.toast:0 "Você descobre o [secret|E] de [revealed_secret.GetName] d[Select_CString( coward.IsFemale, 'a', 'o' )] [coward.GetTitledFirstName]"
 ach_coronation.0011.t:0 "Sombras Antes do Trono"
 ach_coronation.0012.a:0 "[first.GetTitledFirstNameNoTooltip] terá a honra."
 ach_coronation.0012.b:0 "Vai para [second.GetTitledFirstNameNoTooltip]."
 ach_coronation.0012.c.flavor:0 "Talvez eles possam atravessar o corredor juntos?"
 ach_coronation.0012.c.tt.failure:0 "Eles já estão discutindo de novo"
 ach_coronation.0012.c.tt.success:0 "Você tem um ótimo plano"
 ach_coronation.0012.c:0 "Podemos fazer isso funcionar!"
 ach_coronation.0012.d.flavor:0 "É como se esses amadores nunca tivessem participado de uma cerimônia na corte antes!"
 ach_coronation.0012.d:0 "Hah! Observe como se faz."
 ach_coronation.0012.desc:0 "Enquanto se preparavam para a coroação, um servo com aparência preocupada anuncia [first.GetTitledFirstName] e [second.GetTitledFirstName] um momento antes de eles invadirem a sala. Por algum erro, ambos foram prometidos o cobiçado papel de segurar o [ROOT.Char.Custom('GetRandomCoronationObject')] durante a cerimônia.\n\nOs dois são conhecidos há muito tempo por suas disputas, e que um ceda o papel ao outro seria uma marca de humilhação para sua casa — não importa quão trivial o papel possa parecer."
 ach_coronation.0012.e:0 "[ROOT.Char.Custom('GetRandomCoronationObject')|U]? Carregado por um de #EMP vocês#!?"
 ach_coronation.0012.t:0 "Questões de Rito e Direito"
 ach_coronation.0013.a.weaken_detractors.flavor:0 "Posso pensar em alguns boatos muito melhores para eles espalharem!"
 ach_coronation.0013.a.weaken_detractors.tt:0 "Seus inimigos são ridicularizados pela plebe"
 ach_coronation.0013.a.weaken_detractors:0 "Camponeses! Tenho uma proposta."
 ach_coronation.0013.b:0 "Bem, não se pode ganhar de todos. #EMP GUARDAS!#!"
 ach_coronation.0013.c.tt.failure:0 "Os boatos se espalham de qualquer forma..."
 ach_coronation.0013.c.tt.success:0 "Os camponeses — com medo nos olhos — imploram por misericórdia"
 ach_coronation.0013.c:0 "Vou colocar o medo da coroa neles!"
 ach_coronation.0013.d.flavor:0 "Sou [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip] e quero uma bebida, maldição!"
 ach_coronation.0013.d:0 "Você aí! Me sirva uma bebida!"
 ach_coronation.0013.desc_conversation.mean.1:0 "\"Um[Select_CString( host.IsFemale, 'a', '' )] [host.Custom('InsultAdjectiveGeneric')] [host.GetTitleAsNameNoTooltip] como esse nunca existiu!\" cospe um [peasant.Custom2('dummy_peasant_profession', peasant)], para concordância da mesa."
 ach_coronation.0013.desc_conversation.mean.2:0 "\"Maldit[Select_CString( host.IsFemale, 'a', 'o' )] seja [Select_CString( host.IsFemale, 'a', 'o' )] chamad[Select_CString( host.IsFemale, 'a', 'o' )] '[host.GetTitleAsNameNoTooltip]', [host.GetSheHe] será a ruína do [host.GetPrimaryTitle.GetTierAsName] em breve!\" declara um [peasant.Custom2('dummy_peasant_profession', peasant)] a seus/suas companheiros/as."
 ach_coronation.0013.desc_conversation.mean.3:0 "\"Meu [dummy_gender.Custom('GetRandomRelation')] é um [dummy_gender.Custom('lowly_servant_type')] em [ROOT.Char.GetCurrentLocation.Custom('GetCoronationSiteShort')] e [dummy_gender.GetSheHe] diz que o hálito [host.GetHerHim] está sempre horrível!\""
 ach_coronation.0013.desc_conversation.mean.4.chaste:0 "Céus! Cubro meus ouvidos antes de ouvir outra palavra."
 ach_coronation.0013.desc_conversation.mean.4.lustful.guest:0 "Céus! Como devem pensar que [host.GetSheHe] é manso/a!"
 ach_coronation.0013.desc_conversation.mean.4.lustful.host:0 "Céus! Como devem pensar que sou manso/a!"
 ach_coronation.0013.desc_conversation.mean.4.not_lustful:0 "Céus! Por que alguém mentiria sobre isso?"
 ach_coronation.0013.desc_conversation.mean.4:0 "\"Você ouviu como [host.GetSheHe] tem dormido com um/uma [dummy_gender.Custom('lowly_servant_type')]?\" ri um [peasant.Custom2('dummy_peasant_profession', peasant)], \"[host.GetSheHe|U] faz isso com [host.Custom('DeviantObjectArticle')] onde [host.GetSheHe]-\""
 ach_coronation.0013.desc_conversation.mean.5:0 "\"Ouvi dizer que são um[Select_CString( host.IsFemale, 'a', '' )] [host.Custom('InsultAdjectiveGeneric')] bastard[Select_CString( host.IsFemale, 'a', 'o' )], as coisas que [host.GetSheHe] fez? Um verdadeiro monstro se é que algum dia houve.\""
 ach_coronation.0013.desc_conversation.nice.1:0 "\"Viva [Select_CString( host.IsFemale, 'a', 'ao' )] [host.GetTitleAsNameNoTooltip]!\" fala um [peasant.Custom2('dummy_peasant_profession', peasant)] em meio a um coro de vivas bêbados."
 ach_coronation.0013.desc_conversation.nice.2:0 "\"Ouvi dizer que [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip] é [Select_CString( host.IsFemale, 'a', 'o' )] [host.Custom('GetPrettyAdjective')] e [host.Custom('GetPiousAdj')] [host.GetTitleAsNameNoTooltip] mais incrível do mundo!\" Um conta ao outro."
 ach_coronation.0013.desc_conversation.nice.3:0 "\"Meu [dummy_gender.Custom('GetRandomRelation')] conseguiu um [ROOT.Char.Custom('GetRandomRelation')] e [ROOT.Char.GetSheHe] diz que [host.GetTitledFirstNameNoTooltip] dança a [host.Custom('GetMedievalDance')] tão bem que você vai chorar!\" anuncia um [peasant.Custom2('dummy_peasant_profession', peasant)]."
 ach_coronation.0013.desc_conversation.nice.4:0 "\"Eu vi [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip] uma vez,\" diz um [peasant.Custom2('dummy_peasant_profession', peasant)], \"Pude ver o bem [host.GetHerHim] no momento em que coloquei os olhos em '[host.Custom('GetErIm')]!\""
 ach_coronation.0013.desc_conversation.nice.5:0 "\"Morte àquel[Select_CString( claimant.IsFemale, 'a', 'e' )] [claimant.Custom('InsultAdjectiveGeneric')] pretendente, [claimant.GetTitledFirstName]!\" declara um [peasant.Custom2('dummy_peasant_profession', peasant)] a um coro de vivas, \"Viva [Select_CString( host.IsFemale, 'a', 'o' )] legítim[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip]!\""
 ach_coronation.0013.desc_opening.dry_day:0 "aproveitando um breve descanso"
 ach_coronation.0013.desc_opening.rainy_day:0 "abrigando-me da chuva"
 ach_coronation.0013.desc_opening:0 "perto da [ROOT.Char.Custom('GetMainsquareCommons')], que ouço alguém gritar #EMP \"[host.GetTitleAsNameNoTooltip]!\"#!\n\nA fonte está na esquina: alguns [ROOT.Char.Custom('GetTaverngoersTribespeople')] aproveitando [ROOT.Char.Custom('RegionalAlcoholicDrink')] e espalhando boatos."
 ach_coronation.0013.e.disagrees:0 "Existem muito acima desses tolos."
 ach_coronation.0013.e.flavor.mean:0 "Por que eu me preocuparia com as falas dos camponeses?"
 ach_coronation.0013.e.flavor.nice:0 "E quem disse que os camponeses são iletrados!?"
 ach_coronation.0013.e:0 "Ah, bem, de volta ao trabalho."
 ach_coronation.0013.ending.agrees:0 "\n\nHah! Acho que essas boas pessoas estão certas!"
 ach_coronation.0013.ending.disagrees:0 "\n\nComo ousam esses/as simples camponeses #EMP!# insultar seu/sua senhor(a) tão assim!"
 ach_coronation.0013.ending.neutral:0 "\n\nAté os camponeses parecem ter tempo para política hoje em dia."
 ach_coronation.0013.flavor:0 "Uma boa repreensão deve lembrar esses tolos de manter a boca fechada."
 ach_coronation.0013.intro:0 "Meu dia é passado cumprindo deveres na relativa paz de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]. É lá,"
 ach_coronation.0013.t:0 "[ROOT.Char.GetTitleAsNameNoTooltip]s e Camponeses"
 ach_coronation.0014.a.indoors:0 "#BER \"FOGO!\"#!"
 ach_coronation.0014.a.outdoors:0 "#EMP Mire n[Select_CString( first.IsFemale, 'a', 'o' )] [first.GetTitleAsNameNoTooltip]#!"
 ach_coronation.0014.a.rock:0 "[first.GetShortUIName] é atingido/a no rosto por uma pedra e ganha o [trait|E] [GetTrait('wounded_1').GetName( GetNullCharacter )|LV]"
 ach_coronation.0014.a.tt.failure.indoors:0 "Você não é ouvido por causa do barulho"
 ach_coronation.0014.a.tt.failure:0 "Você erra"
 ach_coronation.0014.a.tt.host.failure.crackdown:0 "[host.GetTitledFirstName] pode reagir de forma exagerada, potencialmente matando muito mais e aumentando o [dread|E] e [tyranny|E] [host.GetHerHim]"
 ach_coronation.0014.a.tt.host.failure.host:0 "[host.GetTitledFirstName] pode perder [legitimacy|E] ou [prestige|E]"
 ach_coronation.0014.a.tt.host.failure.magnificence:0 "A [coronation_magnificence|E] da coroação d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNamePossessive] pode ser grandemente diminuída"
 ach_coronation.0014.a.tt.host.success:0 "Isso pode, involuntariamente, reforçar a reputação d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNamePossessive] — seu fracasso pode causar [stress|E]"
 ach_coronation.0014.a.tt.success:0 "Você provoca uma corrida humana desordenada"
 ach_coronation.0014.b.flavor:0 "Meus agentes se movem despercebidos por todo o [coronation_site.GetHolding.GetHoldingType.GetName]."
 ach_coronation.0014.b.tt:0 "Você é ou um/a [GetTrait('schemer').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )], ou possui pelo menos [SCOPE.ScriptValue('very_high_skill_rating')|0V] de [intrigue|E]"
 ach_coronation.0014.b:0 "Talvez a multidão tenha outros usos..."
 ach_coronation.0014.c:0 "Serei o/a primeiro/a a prestar homenagens."
 ach_coronation.0014.desc.ending.byzantine:0 "\n\nA percepção surge — os [Glossary( 'hoi polloi', 'HOI_POLLOI_GLOSS')] reunidos poderiam ser levados a destruir a coroação — tudo o que precisariam é de um(a)"
 ach_coronation.0014.desc.ending.indoors:0 "palavra..."
 ach_coronation.0014.desc.ending.outdoors:0 "pedra..."
 ach_coronation.0014.desc.ending:0 "\n\nA percepção surge — a multidão poderia destruir esta coroação — tudo o que precisariam é de um(a)"
 ach_coronation.0014.desc.reason.generic_indoors:0 "e a massa de cortesãos e convidados logo luta para encontrar espaço para permitir a entrada dos recém-chegados. As multidões estão cada vez mais agitadas e o salão excessivamente quente, e vári[Select_CString( peasant.IsFemale, 'as', 'os' )] [peasant.GetWomenMen] começaram a gritar e a empurrar cotoveladas."
 ach_coronation.0014.desc.reason.generic_outdoors:0 "a multidão parece agitada. Há simplesmente muitas pessoas querendo ver a delegação. Todos estão apertados demais e os guardas d[Select_CString( first.IsFemale, 'a', 'o' )] [first.GetTitleAsNamePossessiveNoTooltip] parecem tensos."
 ach_coronation.0014.desc.reason.local_discontent:0 "as tensões no [coronation_site.GetHolding.GetHoldingType.GetName] estão altas, e vários camponeses presentes zombam e gritam para [Select_CString( first.IsFemale, 'a', 'o' )] [first.GetTitleAsNameNoTooltip] que passa — alguns até começam a entoar maldições contra o [host.GetPrimaryTitle.GetTitleAsNameNoTooltip]!"
 ach_coronation.0014.desc.reason.low_control:0 "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] tem se rebelado contra o controle [ROOT.Char.GetCurrentLocation.GetHolder.GetPrimaryTitle.GetAdjective] há algum tempo, e a multidão que observa a delegação parece nada amigável."
 ach_coronation.0014.desc.reason.rain:0 "os camponeses ficaram mais sujos e irritados do que o normal. Um local escorrega na lama e cai na rua, e não muito depois, os soldados excessivamente zelosos d[Select_CString( first.IsFemale, 'a', 'o' )] [first.GetTitleAsNamePossessiveNoTooltip] avançam contra a multidão, espancando e empurrando os camponeses para longe de seu/sua mestre."
 ach_coronation.0014.desc.weather.clear:0 "Embora tenha sido um dia bastante agradável,"
 ach_coronation.0014.desc.weather.indoors:0 "[ROOT.Char.GetCurrentLocation.Custom('GetCoronationSitePrefix')][ROOT.Char.GetCurrentLocation.Custom('GetCoronationSite')] está lotado, "
 ach_coronation.0014.desc.weather.rain:0 "A chuva caiu forte hoje, e"
 ach_coronation.0014.desc:0 "Do fundo da multidão, observo a delegação d[Select_CString( first.IsFemale, 'a', 'o' )] [first.GetTitleAsName] de [first.GetPrimaryTitle.GetNameNoTier] chegar para a coroação d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNamePossessive]."
 ach_coronation.0014.t:0 "À Beira do Caos"
 ach_coronation.0015.a.august.tt:0 "Sua autoridade inquestionável submete a multidão."
 ach_coronation.0015.a.august:0 "Povo! S[Select_CString( ROOT.Char.IsFemale, 'ua', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip] exige calma!"
 ach_coronation.0015.a.tt.critical_success.desc:0 "A multidão fica em silêncio admirado. Muitos até choram com a beleza de suas palavras."
 ach_coronation.0015.a.tt.critical_success:0 "Oratória lendária"
 ach_coronation.0015.a.tt.failure.title:0 "Fracasso"
 ach_coronation.0015.a.tt.failure:0 "Os gritos abafam sua voz"
 ach_coronation.0015.a.tt.initiator.critical_failure.desc:0 "[host.GetShortUIName] impede o caos — pior ainda, [host.GetSheHe] é celebrado/a por isso!"
 ach_coronation.0015.a.tt.initiator.critical_failure:0 "Desastre!"
 ach_coronation.0015.a.tt.initiator.critical_success.desc:0 "Os soldados de [host.GetShortUINamePossessive] reagem exageradamente e matam muitos — verdadeiro escândalo!"
 ach_coronation.0015.a.tt.initiator.critical_success:0 "Massacre!"
 ach_coronation.0015.a.tt.initiator.failure.crackdown.desc:0 "Os soldados de [host.GetShortUINamePossessive] acabam com o caos com sucesso — [host.GetSheHe] é mais temido/a do que nunca"
 ach_coronation.0015.a.tt.initiator.failure.desc:0 "[host.GetShortUIName] evita um desastre — droga!"
 ach_coronation.0015.a.tt.initiator.failure.physician.desc:0 "[host.GetShortUIName] usa suas habilidades como médico/a para ajudar os feridos e é aclamado/a como 'herói/heroína'!"
 ach_coronation.0015.a.tt.initiator.failure:0 "Fracasso!"
 ach_coronation.0015.a.tt.initiator.success.desc:0 "[host.GetShortUIName] é humilhado/a e sua coroação arruinada!"
 ach_coronation.0015.a.tt.initiator.success:0 "Sucesso!"
 ach_coronation.0015.a.tt.success.desc:0 "Você consegue evitar mais derramamento de sangue — um ótimo sinal para seu governo!"
 ach_coronation.0015.a.tt.success:0 "Sucesso!"
 ach_coronation.0015.a:0 "Devo acalmar a multidão!"
 ach_coronation.0015.b.flavor:0 "Agora devemos nos concentrar apenas em salvar vidas!"
 ach_coronation.0015.b:0 "Para os feridos! Rápido!"
 ach_coronation.0015.c:0 "Que tolos excitados!"
 ach_coronation.0015.d.byzantines:0 "Soltem os Varangianos!"
 ach_coronation.0015.d:0 "Guardas! Restaurem a ordem!"
 ach_coronation.0015.desc:0 "Desastre! Uma multidão observando a comitiva d[Select_CString( first.IsFemale, 'a', 'o' )] recentemente-chegad[Select_CString( first.IsFemale, 'a', 'o' )] [first.GetTitledFirstName] — por razões que desconheço — entrou em caos. Chego a tempo de ver um mar de locais movendo-se para frente e para trás, os guardas d[Select_CString( first.IsFemale, 'a', 'o' )] [first.GetTitleAsNamePossessiveNoTooltip] espancando camponeses caídos ou sendo arrastados e pisoteados junto deles.\n\nOs guardas mal conseguem conter a multidão e a violência só aumenta o pânico. Logo será um motim desordenado!"
 ach_coronation.0015.e.failure:0 "Um camponês ousa pisar em sua cabeça!"
 ach_coronation.0015.e.success:0 "Você se liberta da multidão!"
 ach_coronation.0015.e.tt:0 "Você terá que lutar para sair!"
 ach_coronation.0015.e:0 "Oh não, alguns camponeses podem morrer. Enfim..."
 ach_coronation.0015.has_happened:0 "Isso aconteceu devido às ações de um [coronation_detractor|E] dúbio!"
 ach_coronation.0015.t:0 "O Grande Pânico de [GetCurrentDate.GetYear]"
 ach_coronation.0016.a.diplomacy:0 "[detractor.GetTitledFirstNameNoTooltip] poderia ser convertid[Select_CString( detractor.IsFemale, 'a', 'o' )] para [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNameNoTooltip]..."
 ach_coronation.0016.a.intrigue:0 "Meus espiões estarão à disposição [host.GetHerHim]."
 ach_coronation.0016.a.learning:0 "Falarei com o clero em nome [host.GetHerHim]."
 ach_coronation.0016.a.loyal:0 "Prometerei apoio eterno."
 ach_coronation.0016.a.martial:0 "Doarei uma força de soldados!"
 ach_coronation.0016.a.stewardship.greedy.tt:0 "Você, claro, não contribuirá"
 ach_coronation.0016.a.stewardship:0 "Vou organizar um dízimo dos outros convidados!"
 ach_coronation.0016.b.bonds:0 "Cantarei os louvores [host.GetHerHim] para todos!"
 ach_coronation.0016.b.impress_attendees.writer:0 "O legado [host.GetHerHim] será imortalizado em #EMP versos!#!"
 ach_coronation.0016.b.impress_attendees:0 "Aproveitarei minha boa reputação!"
 ach_coronation.0016.c.artifact:0 "[gifted_artifact.GetNameNoTooltip] seria um presente adequado."
 ach_coronation.0016.c.gold:0 "Quem pode dizer não a ouro e bugigangas?"
 ach_coronation.0016.d.hate:0 "Farei questão de ignorar aquel[Select_CString( host.IsFemale, 'a', 'e' )] [host.Custom('InsultNoun')]!"
 ach_coronation.0016.d:0 "Apenas as amenidades habituais serão suficientes."
 ach_coronation.0016.desc:0 "Convidados para a coroação [Select_CString( host.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('host') )] [host.GetTitledFirstNameRegnal] estão chegando aos montes, todos oferecendo juramentos menores, agradecendo pelo convite e prometendo lealdade ou apoio. Em breve, será minha vez.\n\nDevo me destacar da multidão? Devo usar minha breve audiência para convencer [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip] de minha dignidade?"
 ach_coronation.0016.friendship:0 "[host.GetTitledFirstNameNoTooltip] agradece você pessoalmente"
 ach_coronation.0016.gold:0 "[host.GetTitledFirstNameNoTooltip] recompensa você por seu trabalho"
 ach_coronation.0016.praise:0 "[host.GetTitledFirstNameNoTooltip] elogia você publicamente"
 ach_coronation.0016.reward.tt:0 "#low #EMP Recompensa baseada na sua intenção de [THIS.Char.GetInvolvedActivityIntent.GetName]#!#!"
 ach_coronation.0016.t:0 "Um Presente Digno de um[Select_CString( host.IsFemale, 'a', '' )] [host.GetTitleAsNameNoTooltip]"
 ach_coronation.0017.a.christian:0 "Como cruzado, [host.GetTitledFirstNameNoTooltip] tem meu apoio!"
 ach_coronation.0017.a:0 "Como um [GetTrait('faith_warrior').GetName( GetNullCharacter )], [host.GetTitledFirstNameNoTooltip] tem meu apoio!"
 ach_coronation.0017.b:0 "Envergonharei o covarde publicamente!"
 ach_coronation.0017.c:0 "Bah! Concentre-se em suas orações."
 ach_coronation.0017.d.cynical:0 "O quê? Quem se importa com essas coisas?"
 ach_coronation.0017.d:0 "A fé não é uma competição!"
 ach_coronation.0017.desc:0 "Durante uma oração matinal em [ROOT.Char.GetCurrentLocation.Custom('GetCoronationSitePrefix')][ROOT.Char.GetCurrentLocation.Custom('GetCoronationSite')], [guest.Custom2('MyCharacterIntroduction', ROOT.Char)] me cutuca e aponta para onde [host.Custom2('MyCharacterIntroduction', ROOT.Char)] se ajoelha para a cerimônia.\n\n\"Não te incomoda que [host.GetSheHe] nunca tenha lutado pela fé "
 ach_coronation.0017.ending.civilian:0 "como você fez, ainda assim se proclama tão justo?\""
 ach_coronation.0017.ending.crusader:0 "como você e eu fizemos, ainda assim se proclama tão justo?\""
 ach_coronation.0017.t:0 "Um Direito Divino Não Merecido"
 ach_coronation.0018.a.intent:0 "Esta é minha chance!"
 ach_coronation.0018.a.seneschal:0 "[host.GetTitledFirstNameNoTooltip] [Select_CString( host.IsFemale, 'a', 'o' )] nomeia como [GetCourtPositionType('seneschal_court_position').GetName]"
 ach_coronation.0018.a.tt.vassal:0 "Você receberá um título à escolha d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNamePossessive]"
 ach_coronation.0018.a.tt_failure:0 "Seus esforços passam despercebidos"
 ach_coronation.0018.a.tt_success:0 "[host.GetTitledFirstName] nota sua ajuda"
 ach_coronation.0018.a.vassal:0 "[host.GetTitledFirstNameNoTooltip] oferece a você um [title|E]!"
 ach_coronation.0018.a:0 "Ajudarei [servant_boss.GetTitledFirstNameNoTooltip] nos preparativos."
 ach_coronation.0018.b.tt.gossip_with_servants:0 "Você se diverte muito fofocando"
 ach_coronation.0018.b.tt.secret:0 "Você descobre o [secret|E] [SECRET.GetName] d[Select_CString( secret_holder.IsFemale, 'a', 'o' )] [secret_holder.GetFirstName]"
 ach_coronation.0018.b.tt.secret_unknown:0 "Você descobre um [secret|E]"
 ach_coronation.0018.b.tt.secret_unknown_desc:0 "Ah, agora isso é #EMP suculento#!"
 ach_coronation.0018.b:0 "Por que liderar se você pode participar?"
 ach_coronation.0018.c.flavor:0 "Há muito a aprender com os erros da equipe."
 ach_coronation.0018.c:0 "Isso parece uma boa oportunidade de aprendizado!"
 ach_coronation.0018.d.annoyed_servant_boss:0 "[servant_boss.GetFirstNameNoTooltip] sente que você está tentando roubar o trabalho [servant_boss.GetHerHim]"
 ach_coronation.0018.d.pleased_servant_boss:0 "[servant_boss.GetFirstNameNoTooltip] está grat[Select_CString( servant_boss.IsFemale, 'a', 'o' )] pela sua ajuda"
 ach_coronation.0018.d:0 "Felizmente, esse é um problema [host.GetHerHim], não meu."
 ach_coronation.0018.desc.ending.no_servant_boss:0 "A falta de liderança é evidente, e aqueles que não estão em pânico parecem contentes em fofocar e vagar.\n\nEnquanto o foco d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNamePossessiveNoTooltip] deveria estar na próxima cerimônia, [host.GetSheHe] parece constantemente atormentado/a por preocupações mesquinhas."
 ach_coronation.0018.desc.ending.servant_boss:0 "[servant_boss.GetTitledFirstNameNoTooltip], entretanto, parece completamente sobrecarregado/a; enquanto isso, os servos se contentam em fofocar e vagar sem supervisão adequada.\n\n[host.GetTitledFirstNameNoTooltip] deveria estar focado/a na próxima cerimônia, mas [host.GetSheHe] parece constantemente atormentado/a por preocupações mesquinhas."
 ach_coronation.0018.desc.fallback:0 "Ninguém parece preparado para dirigir os servos."
 ach_coronation.0018.desc.seneschal:0 "Como [GetCourtPositionType('seneschal_court_position').GetName], #EMP deveria#! ser dever de [servant_boss.Custom2('MyCharacterIntroduction', ROOT.Char)] dirigir os servos."
 ach_coronation.0018.desc.steward:0 "Sem um/a [GetCourtPositionType('seneschal_court_position').GetName], #EMP deveria#! ser dever de [servant_boss.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] como [servant_boss.GetCouncilTitle|l] dirigir os servos."
 ach_coronation.0018.desc:0 "Os preparativos para a coroação d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNamePossessive] estão em caos!"
 ach_coronation.0018.diplomacy_trait.tt:0 "Como você possui os [traits|E] [GetTrait('diplomat').GetName( GetNullCharacter )] ou [GetTrait('gregarious').GetName( GetNullCharacter )], [servant_boss.GetTitledFirstNameNoTooltip] não se ofenderá"
 ach_coronation.0018.servant_boss_opinion.tt:0 "[servant_boss.GetTitledFirstNameNoTooltip] pode interpretar isso como uma tentativa de roubar o trabalho [servant_boss.GetHerHim]"
 ach_coronation.0018.t:0 "Deveres Dinásticos"
 ach_coronation.0019.a:0 "Aceito!"
 ach_coronation.0019.b:0 "Esperava algo mais... monetário."
 ach_coronation.0019.c:0 "A amizade da m[Select_CString( host.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('host'))] é suficiente!"
 ach_coronation.0019.desc.court_position:0 "Você se provou mais do que capaz como [GetCourtPositionType('seneschal_court_position').GetName]. O que você diz?"
 ach_coronation.0019.desc.praise:0 "Decidi que irei oficialmente louvar seu nome em toda a corte! Todos conhecerão sua diligência!"
 ach_coronation.0019.desc.title:0 "Preciso de vassalos em quem possa confiar, e acredito que o [grantable_title.GetName] precisa de um novo governante. O que você diz?"
 ach_coronation.0019.desc:0 "Sua ajuda aqui em [host.GetCurrentLocation.Custom('GetCoronationSitePrefix')][host.GetCurrentLocation.Custom('GetCoronationSite')] não passou despercebida."
 ach_coronation.0019.opening:0 "[host.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 ach_coronation.0020.a:0 "Agora [helpful_family.GetSheHe] seria [Select_CString( helpful_family.IsFemale, 'uma vassala', 'um vassalo' )] em quem eu poderia confiar!"
 ach_coronation.0020.b:0 "#EMP Assim#! é que a dinastia [host.GetDynastyNameNoTooltip] faz as coisas!"
 ach_coronation.0020.c:0 "[helpful_family.GetSheHe|U] realmente é um[Select_CString( helpful_family.IsFemale, 'a', '' )] excelente [host.Custom2('RelationToMeShort', SCOPE.sC('helpful_family'))]."
 ach_coronation.0020.d:0 "[helpful_family.GetSheHe|U] é um modelo para todos os meus súditos."
 ach_coronation.0020.desc:0 "Enquanto estive ocupad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com os preparativos da minha coroação, [helpful_family.Custom2('MyCharacterIntroduction', ROOT.Char)] realmente assumiu o comando! Nenhum servo me incomodou com trivialidades nos últimos dias, e finalmente posso focar na próxima cerimônia."
 ach_coronation.0020.t:0 "A Coroa d[Select_CString( helpful_family.IsFemale, 'a', 'o' )] [host.Custom2('RelationToMeShort', SCOPE.sC('helpful_family'))|U]"
 ach_coronation.0022.a.coronation_disrupt_loyalists.failure:0 "[zealot.GetShortUIName] considera esta conversa quase sacrílega"
 ach_coronation.0022.a.coronation_disrupt_loyalists.flavor:0 "[zealot.GetShortUIName] está certo! [host.GetShortUIName] #EMP é#! o culpado!"
 ach_coronation.0022.a.coronation_disrupt_loyalists.success:0 "[zealot.GetSheHe] fica convencido/a de que [host.GetShortUIName] é o culpado"
 ach_coronation.0022.a.coronation_disrupt_loyalists:0 "Certamente [zealot.GetShortUINameNoTooltip] pode ver quem é o culpado?"
 ach_coronation.0022.a.offer_support.failure:0 "A fé de [zealot.GetShortUINamePossessive] parece ainda mais abalada"
 ach_coronation.0022.a.offer_support.flavor:0 "[Select_CString( host.IsFemale, 'A', 'O' )] [host.GetTitleAsName] sem dúvida apreciaria uma lembrança de seu mandato divino."
 ach_coronation.0022.a.offer_support.success:0 "[zealot.GetShortUIName] agradece por lembrar [zealot.GetSheHe] de suas lealdades"
 ach_coronation.0022.a.offer_support:0 "Irei conversar com [zealot.GetSheHe] imediatamente."
 ach_coronation.0022.b:0 "Rezo com [zealot.GetSheHe] como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.Custom('SisterBrother')] em [zealot.GetFaith.GoodGodNames]."
 ach_coronation.0022.c.failure:0 "As pessoas ficam bastante irritadas com suas provocações"
 ach_coronation.0022.c.success:0 "A facção [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName] se alinha contra [host.GetTitledFirstNameNoTooltip]"
 ach_coronation.0022.c:0 "Há muitos que, com apenas um empurrão, concordariam..."
 ach_coronation.0022.d.flavor:0 "Em tempos de doença, vale manter os inimigos longe e os amigos ainda mais distantes"
 ach_coronation.0022.d:0 "Manter distância parece... prudente."
 ach_coronation.0022.desc.ending:0 "perguntam aos outros.\n\nTais preocupações parecem afetar [zealot.GetTitledFirstName] mais do que qualquer outro. [zealot.GetSheHe|U] passou o dia em profunda oração preocupada."
 ach_coronation.0022.desc.whisper.byzantine:0 "\"Como [host.GetTitledFirstNameNoTooltip] pode alegar ser [Glossary( 'pistos en Christôi Basileus', 'PISTOS_EN_CHRISTOI_BASILEUS_GLOSS' )] se [host.GetFaith.HighGodName] o/a pune assim?\""
 ach_coronation.0022.desc.whisper.divine_right:0 "\"Como [host.GetTitledFirstNameNoTooltip] pode reivindicar direito divino diante de tais presságios?\""
 ach_coronation.0022.desc.whisper.fallback:0 "\"[Select_CString( host.IsFemale, 'A', 'O' )] [host.GetTitleAsNameNoTooltip] está amaldiçoad[Select_CString( host.IsFemale, 'a', 'o' )]?\""
 ach_coronation.0022.desc.whisper.hre:0 "\"Como [host.GetTitledFirstNameNoTooltip] pode alegar [Glossary( 'sacra majestas', 'SACRA_MAJESTAS_GLOSS' )] em tempos como este?\""
 ach_coronation.0022.desc.whisper.sinner:0 "\"Será obra da natureza maligna d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNamePossessiveNoTooltip]?\""
 ach_coronation.0022.desc:0 "A temida [epidemic_scope.GetName] tem estado na boca de todos ultimamente, nenhum mais do que os [zealot.GetFaith.AltPriestTermPlural] do [host.GetPrimaryTitle.GetTierAsName|l]. \"Por que [zealot.GetFaith.GoodGodNames] puniu o [host.GetPrimaryTitle.GetTierAsNameNoTooltip]?\" alguns lamentam."
 ach_coronation.0022.t:0 "Uma Coroa Tosseira"
 ach_coronation.0023.a:0 "Agora #EMP eis#! um [GetCourtPositionType('bodyguard_court_position').GetNameNoTooltip]!"
 ach_coronation.0023.b:0 "[foreign_warrior.GetSheHe|U] será meu [GetCourtPositionType('champion_court_position').GetNameNoTooltip]!"
 ach_coronation.0023.c:0 "Seja bem-vindo à minha corte!"
 ach_coronation.0023.d:0 "Remova est[Select_CString( foreign_warrior.IsFemale, 'a', 'e' )] [foreign_warrior.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('GetUnbelieverTermAdjective', foreign_warrior)] imediatamente!"
 ach_coronation.0023.desc.clergy.angry:0 "\n\n[clergy.Custom2('MyCharacterIntroduction', ROOT.Char)|U] lança um olhar severo ao mencionar o deus [ROOT.Char.Custom2('GetUnbelieverTermAdjective', foreign_warrior)]."
 ach_coronation.0023.desc.clergy:0 "\n\nVejo [clergy.Custom2('MyCharacterIntroduction', ROOT.Char)] lançar um olhar curioso ao mencionar o deus [ROOT.Char.Custom2('GetUnbelieverTermAdjective', foreign_warrior)]."
 ach_coronation.0023.desc:0 "Estou cumprimentando uma fila de recém-chegados quando um estrangeiro surge à minha frente — uma lâmina exótica ao lado [foreign_warrior.GetHerHim]. [foreign_warrior.GetSheHe|U] imediatamente se ajoelha e oferece sua espada com um floreio.\n\n\"Ó grande [ROOT.Char.GetTitleAsNameNoTooltip]! Passei muito tempo na estrada, longe de [foreign_ruler.GetCapitalLocation.GetName], e ouvi dizer que procurais servos leais. Poderoso governante, permita-me encontrar glória e servi-lo como sirvo [foreign_warrior.GetFaith.HighGodName]!\""
 ach_coronation.0023.t:0 "O [foreign_warrior.Custom('KnightCultureNoTooltip')] d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]"
 ach_coronation.0025.a:0 "Pagarei pelo [baron.Custom('RegionalAlcoholicDrink')] eu mesmo!"
 ach_coronation.0025.b.flavor:0 "Com toda a bebida que ambos pudermos conseguir, [feast_location.GetName] conhecerá a verdadeira #EMP alegria#!"
 ach_coronation.0025.b.tt.failure:0 "[baron.GetTitledFirstName] não vê quão fantástica é sua ideia"
 ach_coronation.0025.b.tt.success:0 "[baron.GetTitledFirstName] concorda — que os bons momentos fluam!"
 ach_coronation.0025.b.tt:0 "Você é ou um [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )] ou um [GetTrait('drunkard').GetName( GetNullCharacter )], e tem pelo menos [gold_i][GetPlayer.MakeScope.ScriptValue('minor_gold_value')|0V] [gold|E]"
 ach_coronation.0025.b:0 "E se [baron.GetTitledFirstName] também contribuísse?"
 ach_coronation.0025.c.flavor:0 "Há muito mais diversão a ser encontrada lá dentro"
 ach_coronation.0025.c.temperate:0 "Não é preciso beber para se divertir!"
 ach_coronation.0025.c:0 "Talvez não... mais para mim!"
 ach_coronation.0025.desc.guest:0 "[host.GetTitledFirstName] sem dúvida apreciaria o povo cantando seu nome — e o povo do [feast_location.GetTitle.Custom('BaronyTownType')] uma noite de bebida gratuita — Eu só precisaria encontrar um mercador disposto a vender a esta hora..."
 ach_coronation.0025.desc.host:0 "Todo [feast_location.GetBaronyNameExplicitlyNoTooltip] poderia brindar meu nome com apenas algumas noites de bebida gratuita. Eu só precisaria encontrar um mercador disposto a vender a esta hora..."
 ach_coronation.0025.desc:0 "Fora do banquete, aproveito um pouco de ar fresco e a vista de [feast_location.GetBaronyNameExplicitly], junto aos sons de amantes em um arbusto próximo e de um [ROOT.Char.Custom('KnightCultureNoTooltip')|l] local vomitando perigosamente perto. Acima de tudo, os sons das celebrações do [feast_location.GetTitle.Custom('BaronyTownType')] ecoam no ar.\n\nEntão, uma ideia me ocorre!"
 ach_coronation.0025.t:0 "Beber e Alegrar-se"
 ach_coronation.0026.a.tt.critical_success:0 "Graças a [ROOT.Char.GetFaith.HighGodName]! A sensação passa"
 ach_coronation.0026.a.tt.sick.failure:0 "Você não consegue esconder"
 ach_coronation.0026.a.tt.sick.success:0 "Você se mantém firme"
 ach_coronation.0026.a.tt.sick:0 "Você sente que uma febre se aproxima"
 ach_coronation.0026.a.tt:0 "Você cerrará os dentes e tentará sobreviver à noite"
 ach_coronation.0026.a:0 "Devo me manter firme!"
 ach_coronation.0026.b.tt:0 "[vassal.GetTitledFirstName] passará o resto do banquete ajudando a disfarçar sua doença"
 ach_coronation.0026.b:0 "[vassal.GetTitledFirstNameNoTooltip]! Ajude-me!"
 ach_coronation.0026.c.flavor:0 "Abandonar seu próprio banquete provavelmente não será bem visto"
 ach_coronation.0026.c:0 "Basta! Preciso ir descansar."
 ach_coronation.0026.desc:0 "O banquete continua. Cada batida dos tambores me arrepia, e a ideia de mais [ROOT.Char.Custom('GetExpensiveDrink')] quase me faz vomitar. Sem dúvida, os chefes verão como mau presságio se eu adoecer, agora de todos os momentos!\n\nComo se estivesse marcado, [vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] se aproxima com um prato de comida e um copo de algo horrível."
 ach_coronation.0026.t:0 "Presságios Funestos"
 ach_coronation.0027.a:0 "Vou comprar todo o estoque [stoner.GetHerHim]!"
 ach_coronation.0027.b.hashishiyah:0 "[stoner.GetSheHe|U] parece ser um[Select_CString( stoner.IsFemale, 'a', '' )] [stoner.GetWomanMan] de cultura!"
 ach_coronation.0027.b:0 "Bem, qual seria o mal nisso?"
 ach_coronation.0027.c:0 "No #EMP meu#! banquete de coroação!? Fora!"
 ach_coronation.0027.d.host:0 "Um bom anfitrião deixa bastante para seus convidados!"
 ach_coronation.0027.d:0 "\"Aproveite sem mim, [partaker.GetFirstNameNoTooltip].\""
 ach_coronation.0027.desc.char.crusader:0 "bolos saracenos deliciosos e exóticos de suas aventuras nas cruzadas!\""
 ach_coronation.0027.desc.char.other:0 "bolos maravilhosamente florais de haxixe!\""
 ach_coronation.0027.desc.char.varangian:0 "esses estranhos bolos de suas aventuras entre os [emperor_culture.GetCollectiveNoun]!\""
 ach_coronation.0027.desc:0 "\"[ROOT.Char.Custom2('RelationToMeAddress', partaker)|U]!\" começa [partaker.Custom2('MyCharacterIntroduction', ROOT.Char)] — um odor distinto seguindo [partaker.GetSheHe] até minha mesa — \"Você precisa conhecer est[Select_CString( stoner.IsFemale, 'a', 'e' )] [stoner.GetWomanMan] tão interessante, [stoner.GetSheHe] trouxe"
 ach_coronation.0027.t:0 "Uma Deliciosa Guloseima"
 ach_coronation.0028.a.lose:0 "Você não consegue acompanhar"
 ach_coronation.0028.a.win:0 "Você vence [drinker.GetFirstNameNoTooltip] na bebida!"
 ach_coronation.0028.a:0 "[drinker.GetTitledFirstNameNoTooltip] encontrou seu par!"
 ach_coronation.0028.b.lose:0 "Sua cumplicidade é descoberta!"
 ach_coronation.0028.b.win:0 "[drinker.GetFirstNameNoTooltip] não teve chance"
 ach_coronation.0028.b:0 "Se eu pudesse colocar algo no copo [drinker.GetHerHim]..."
 ach_coronation.0028.c:0 "Acho que não."
 ach_coronation.0028.desc:0 "\"[ROOT.Char.GetFirstName]!\" grita [drinker.Custom2('MyCharacterIntroduction', ROOT.Char)] do outro lado do salão — alto o suficiente para ser ouvido sobre o barulho das celebrações da coroação. \"Você acha que uma nova coroa te torna tão poderoso!? Então, por [drinker.GetFaith.HighGodName], beba! Prove que é um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] dign[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]!\"\n\nMuitos olhos expectantes se voltam para mim, ansiosos por minha resposta."
 ach_coronation.0028.t:0 "Embriaguezes Legítimas"
 ach_coronation.0029.a.flavor.embrace_supporters:0 "Isso nos unirá a mim e meus apoiadores!"
 ach_coronation.0029.a.flavor.exalt_crown:0 "E nossa captura será um símbolo do meu governo!"
 ach_coronation.0029.a.flavor.impress_attendees:0 "E você garantirá que todo [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] saiba disso!"
 ach_coronation.0029.a.glorious_hunt:0 "Sua próxima [GetActivityType('activity_hunt').GetName] aumentará sua [legitimacy|E]"
 ach_coronation.0029.a.impressive_hunt:0 "Sua próxima [GetActivityType('activity_hunt').GetName] aumentará a opinião de seus [vassals|E] sobre você"
 ach_coronation.0029.a.personal_hunt:0 "Sua próxima [GetActivityType('activity_hunt').GetName] pode conceder aos [vassal|E] e [guests|E] o [trait|E] [GetTrait('loyal').GetName( GetNullCharacter )]"
 ach_coronation.0029.a:0 "Sim! A Caçada d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]!"
 ach_coronation.0029.b.flavor:0 "E vocês dois fornecerão as aves, é claro!"
 ach_coronation.0029.b.free_falconry:0 "Sua próxima caçada do tipo $hunt_type_falconry$ não custará [gold|E]"
 ach_coronation.0029.b:0 "E se fizéssemos falcoaria em vez disso?"
 ach_coronation.0029.c.virtuous.tt:0 "Esta opção está disponível porque sua [faith|E] [THIS.Char.GetFaith.GetAdjective] considera o [trait|E] [GetTrait('temperate').GetName( GetNullCharacter )] como [virtuous|E]"
 ach_coronation.0029.c.virtuous:0 "O que aconteceu com 'temperança em todas as coisas'?"
 ach_coronation.0029.c:0 "Hah! Estarei ocupado demais!"
 ach_coronation.0029.desc:0 "O [ROOT.Char.Custom('FunFoodPrefix')]-assado [ROOT.Char.Custom('GetFoodBird')] é delicioso, mas as histórias que contamos são ainda melhores! [first.Custom2('MyCharacterIntroduction', ROOT.Char)|U], m[Select_CString( second.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('second') )] [second.GetFirstName], e eu passamos horas trocando contos de nossas maiores caçadas.\n\n\"Basta!\" grita [first.GetTitledFirstNameNoTooltip]. \"Agora você está coroado, então pode organizar uma caçada após o banquete! Faremos especial para [Select_CString( ROOT.Char.IsFemale, 'nossa nova', 'nosso novo' )] [ROOT.Char.GetTitleAsNameNoTooltip|l]!\"\n\n\"Sim!\" [second.GetFirstNameNoTooltip] acena animadamente. \"Uma caçada para um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip|l]... a Caçada d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]!\""
 ach_coronation.0029.t:0 "A Caçada d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]"
 ach_coronation_0010_hof_desc_guest.tt:0 "A bênção d[Select_CString( hof.IsFemale, 'a', 'o' )] [hof.GetTitledFirstNamePossessive] aumentará a [legitimacy|E] d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNamePossessive] e o [fervor|E] da [faith|E] [hof.GetFaith.GetName]"
 ach_coronation_0010_hof_desc_host.tt:0 "A aprovação d[Select_CString( hof.IsFemale, 'a', 'o' )] [hof.GetTitledFirstNamePossessive] aumentará sua [legitimacy|E] e o [fervor|E] da [faith|E] [hof.GetFaith.GetAdjective]"
 activity_hof_arrival_log:0 "[TARGET_CHARACTER.GetUIName|U] e a delegação [TARGET_CHARACTER.GetPrimaryTitle.GetAdjective] chegaram à coroação d[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] [CHARACTER.GetTitledFirstNamePossessive], provocando grande celebração entre os comuns."
