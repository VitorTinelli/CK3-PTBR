 feast_turning_the_other_cheek_modifier:0 "Oferecendo a Outra Face"
 feast_turning_the_other_cheek_modifier_desc:0 "Este personagem é renomado por sua capacidade de superar rancores passados"
 feast_type_generic:0 "Banquete"
 feast_type_generic_desc:0 "$EFFECT_LIST_BULLET$ Eventos levarão a ocasiões para ganhar [opinion|E]\n$EFFECT_LIST_BULLET$ Certas opções permitirão a redução do [stress|E]\n\n#weak Um banquete #EMP precisa#! de um motivo?#!"
 feast_type_murder:0 "Banquete Assassino"
 feast_type_murder_desc:0 "$EFFECT_LIST_BULLET$ Você escolherá como assassinar seu Convidado Honorário e seu séquito\n\n#weak Você não está convidando convidados. Você está atraindo vítimas.#!\n\n@warning_icon! #X Você não poderá realizar um Banquete Assassino por 15 anos#!\n@warning_icon! #X Mirar em seu [liege|E] ou [head_of_faith|E] terá penalidades maiores#!\n\n@alert_icon! #alert_trial Personagens com as características [GetTrait('just').GetName( GetNullCharacter )], [GetTrait('compassionate').GetName( GetNullCharacter )] e [GetTrait('calm').GetName( GetNullCharacter )] ganharão [stress|E]#!"
 murder_feast_family_opinion:0 "Família Morta em um Banquete"
 murder_feast_great_murderer_modifier:0 "Um Banquete Macabro"
 murder_feast_great_murderer_modifier_desc:0 "$murder_feast_murderer_modifier_desc$"
 murder_feast_murderer_modifier:0 "Anfitrião Traidor"
 murder_feast_murderer_modifier_desc:0 "Este personagem falhou em proteger $honorary_guest$ em seu banquete."
