l_spanish:
 bloody_wedding_family_opinion:0 "Família Morta em um Casamento Sangrento"
 every_guest_scope_tt:0 "Todo convidado"
 every_ruler_guest_scope_tt:0 "Todo convidado [ruler|E]"
 feast.0010.a:0 "Infelizmente."
 feast.0010.desc:0 "Por que você aceitaria meu convite apenas para comparecer ao banquete [Select_CString( other_host.IsFemale, 'da', 'do' )] [other_host.GetTitledFirstName]? Não entendo, mas saiba que vou me lembrar disso."
 feast.0050.a:0 "Fico curioso para saber quem virá!"
 feast.0050.b:0 "Mas tenho outros interesses..."
 feast.0050.desc:0 "Vinho, cerveja e comida refinada! Que melhor alívio para os problemas do mundo do que uma noite de festa?\n\nA cada banquete que termina, me vejo planejando o próximo!"
 feast.0050.t:0 "A Arte da Diversão"
 feast.0800.a:0 "$activity_system.1010.a$"
 feast.0800.desc.entourage:0 "$activity_system.1010.desc.entourage$"
 feast.0800.desc.ruler:0 "[Select_CString( host.IsFemale, 'A falecida', 'O falecido' )] [host.GetTitleAsName] não merecia morrer dessa forma."
 feast.0800.desc:0 "[Select_CString( host.IsFemale, 'Minha antecessora', 'Meu antecessor' )], [host.GetNameRegnal], partiu dessa vida enquanto organizava um banquete. Tragicamente, [host.GetSheHe] [host.GetDeathReason].\n\n"
 feast.0800.t:0 "$feast_header$ Um Banquete Interrompido"
 feast.0800.tt:0 "A [GetActivityType('activity_feast').GetName] [Select_CString( host.IsFemale, 'da', 'do' )] [host.GetShortUINameNoTooltip] foi cancelada"
 feast.1501.a:0 "Claro que comparecerei."
 feast.1501.b:0 "Comparecerei. A contragosto."
 feast.1501.c:0 "Sinto muito, mas estou ocupado."
 feast.1501.d:0 "Não, recuso!"
 feast.1501.host_dislikes_me:0 "Espero que todos importantes estejam presentes, infelizmente isso inclui você."
 feast.1501.host_gets_along_with_me:0 "Como [Select_CString( ROOT.Char.IsFemale, 'uma', 'um' )] [ROOT.Char.GetTitleTierName] notável, ficaria honrado com sua presença."
 feast.1501.host_likes_me:0 "Espero que você compareça, pois sua ausência seria muito sentida."
 feast.1501.opening:0 "[sender.Custom2('AppropriateGreeting', ROOT.Char)]"
 feast.1501.opening_desc:0 "Convido cordialmente você a participar do meu banquete em [barony.GetNameNoTier]!"
 feast.1502.a:0 "Será um prazer."
 feast.1502.b:0 "Tenho assuntos mais importantes para tratar."
 feast.1502.desc:0 "Tenho a honra de convidá-lo para meu banquete em [barony.GetNameNoTier]! Será um evento grandioso, digno da sua honrosa presença."
 feast.1503.a:0 "Será um prazer."
 feast.1503.b:0 "Tenho assuntos mais importantes para resolver."
 feast.1503.desc:0 "Tenho a honra de convidá-lo para meu banquete em [barony.GetNameNoTier]! Será um evento grandioso, com comidas deliciosas e entretenimento."
 feast.2001.a.tt:0 "O Banquete começa"
 feast.2001.a:0 "Sejam bem-vindos, amigos!"
 feast.2001.b:0 "[honorary_guest.GetFirstNameNoTooltip] e sua comitiva. Quero todos eles fora daqui."
 feast.2001.c.people_to_spare:0 "Todos queridos para mim serão avisados"
 feast.2001.c:0 "Eu só quero [honorary_guest.GetFirstNameNoTooltip] morto."
 feast.2001.d.tt:0 "A tentativa de assassinato pode falhar"
 feast.2001.d:0 "[honorary_guest.GetFirstNameNoTooltip] precisa morrer, mas #EMP ninguém#! pode suspeitar de mim."
 feast.2001.desc_ambitious:0 "$feast.2001.desc_intro$ Ah, uma das minhas coisas favoritas é ver as pessoas ficarem intoxicadas... e ouvi-las falarem muito mais do que deveriam.$feast.2001.desc_outro$"
 feast.2001.desc_fallback:0 "$feast.2001.desc_intro$$feast.2001.desc_outro$"
 feast.2001.desc_gregarious:0 "$feast.2001.desc_intro$ Tenho estado #EMP desejando#! por uma ocasião como essa.$feast.2001.desc_outro$"
 feast.2001.desc_intro:0 "Os convidados estão reunidos na sala, senhores e damas vindos de todas as partes do reino."
 feast.2001.desc_lustful:0 "$feast.2001.desc_intro$ Tantas... #EMP guloseimas#! para escolher.$feast.2001.desc_outro$"
 feast.2001.desc_martial:0 "$feast.2001.desc_intro$ Devo admitir que não poder trazer armas diminui o apelo de uma celebração.$feast.2001.desc_outro$"
 feast.2001.desc_murder_feast:0 "Conforme os convidados entram na sala, eu os vejo um após o outro. [honorary_guest.GetTitledFirstName]... como ousa [honorary_guest.GetSheHe] pisar em minha casa? E sua comitiva... todos meus inimigos — inimigos do reino!\n\nEnquanto os serviçais acendem a grande lareira, tenho uma epifania repentina; e se a praga de suas existências pudesse ser purificada de uma só vez?"
 feast.2001.desc_nerd:0 "$feast.2001.desc_intro$ Normalmente, prefiro a companhia dos livros às pessoas, mas o dever é o dever.$feast.2001.desc_outro$"
 feast.2001.desc_outro:0 "\n\nO clima é alegre e os ânimos estão altos enquanto o banquete começa!"
 feast.2001.desc_shy:0 "$feast.2001.desc_intro$ Ajeito minhas roupas. Isso não é #EMP exatamente#! a minha ideia de uma noite perfeita, mas vai ter que servir.$feast.2001.desc_outro$"
 feast.2001.e.tt:0 "O Banquete começa — e ninguém será prejudicado"
 feast.2001.e:0 "Todos são convidados em minha casa. Nenhum mal lhes acontecerá."
 feast.2001.t:0 "Um Encontro Alegre"
 feast.2001.t_murder:0 "Um Encontro Perverso"
 feast.2002.a:0 "Posso vir a me arrepender disso."
 feast.2002.desc:0 "Que desastre!\n\nApós todas as minhas preparações, meus convidados chegaram a um banquete sem anfitrião! Eles foram embora, e deixei uma terrível impressão sobre mim."
 feast.2002.t:0 "$feast_header$ Deveres Abandonados"
 feast.2003.a:0 "Será que estou realmente tão sozinho?"
 feast.2003.b:0 "Sinto um pouco de alívio."
 feast.2003.desc:0 "Não consigo acreditar. Apesar dos meus convites e preparativos, nenhum convidado apareceu para o meu banquete.\n\nNão importa! Vou aproveitar toda essa comida e vinho sozinho, e o eco dos passos na minha grande sala é toda a companhia de que preciso!"
 feast.2003.t:0 "$feast_header$ Uma Celebração Pobre"
 feast.2010.a.tt:0 "O Banquete Assassino está cancelado"
 feast.2010.a:0 "Uma verdadeira pena."
 feast.2010.desc:0 "Chegaram a mim notícias de que meu #EMP convidado muito especial#!, [ROOT.Var('murder_guest_host_var').GetCharacter.GetTitledFirstName], encontrou seu fim um pouco mais cedo do que o esperado. Todos nós lamentaremos a morte [ROOT.Var('murder_guest_host_var').GetCharacter.GetHerHim], e cancelaremos o banquete em respeito à sua memória.\n\n#EMP Só gostaria que tivesse sido por minha mão.#!"
 feast.2010.t:0 "$feast_header$ Uma Sorte Inesperada?"
 feast.2011.a.tt:0 "O Banquete está cancelado"
 feast.2011.a:0 "$feast.2010.a$"
 feast.2011.desc:0 "A morte repentina de [host.Var('murder_guest_host_var').GetCharacter.GetTitledFirstName] nos surpreendeu a todos, e [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstName] decidiu cancelar o banquete em respeito à memória [host.Var('murder_guest_host_var').GetCharacter.GetHerHim]. Afinal, tudo isso era em honra a [host.Var('murder_guest_host_var').GetCharacter.GetSheHe]."
 feast.2011.t:0 "$feast_header$ Morte Inesperada"
 feast.2020.a.tt:0 "$feast.2010.a.tt$"
 feast.2020.a:0 "Um dia eu te pego, [ROOT.Var('murder_guest_host_var').GetCharacter.GetFirstNameNoTooltip]..."
 feast.2020.desc:0 "Não posso acreditar nisso! [ROOT.Var('murder_guest_host_var').GetCharacter.GetTitledFirstName] recusou meu convite perfeitamente não suspeito para um banquete! Mesmo sendo meu #EMP convidado muito especial#!. Completamente inaceitável!"
 feast.2020.t:0 "$feast_header$ Convite Recusado"
 feast.2021.a.tt:0 "$feast.2011.a.tt$"
 feast.2021.a:0 "$feast.2010.a$"
 feast.2021.desc:0 "Que humilhação! [host.Var('murder_guest_host_var').GetCharacter.GetTitledFirstName] recusou o convite [Select_CString( host.IsFemale, 'da', 'do' )] [host.GetTitledFirstName] como convidado especial para o banquete! E agora [host.GetSheHe] está nos mandando todos para casa! Se fosse comigo, eu #EMP jamais#! me recuperaria de algo assim..."
 feast.2021.t:0 "$feast.2020.t$"
 feast.2501.a.drunkard:0 "Cadê o [ROOT.Char.Custom('RegionalAlcoholicDrink')]!"
 feast.2501.a.gluttonous:0 "Consigo sentir o cheiro da cozinha daqui!"
 feast.2501.a.gregarious:0 "Mal posso esperar para conversar com todos!"
 feast.2501.a.shy:0 "Tem muita gente aqui..."
 feast.2501.a:0 "Estou ansioso por isso!"
 feast.2501.b:0 "Espero que isso valha meu tempo."
 feast.2501.dislikes_host:0 "Todos os convidados estão reunidos no salão, e [Select_CString( host.IsFemale, 'nossa anfitriã', 'nosso anfitrião' )] [host.Custom2('InsultAdjective', ROOT.Char)], [host.GetTitledFirstName], finalmente nos deu as boas-vindas ao banquete."
 feast.2501.likes_host:0 "Todos os convidados estão reunidos no salão, e [Select_CString( host.IsFemale, 'nossa generosa anfitriã', 'nosso generoso anfitrião' )], [host.GetTitledFirstName], nos deu as boas-vindas ao banquete!"
 feast.2501.t:0 "Uma Receção Calorosa"
 feast.3601.a.tt:0 "#F Sabe... até [host.GetSheHe] morrer.#!"
 feast.3601.a:0 "Foi um banquete tão divertido!"
 feast.3601.desc:0 "Com a partida de [host.Custom2('MyCharacterIntroduction', ROOT.Char)], o banquete chega ao fim.\n\nEnquanto os convidados saem em silêncio, rezo para que [ROOT.Char.GetFaith.HighGodNameAlternate] receba [host.GetFirstName] com a mesma calorosidade com que [host.GetSheHe] nos recebeu em seus salões em [ROOT.Char.GetFaith.PositiveAfterLife]."
 feast.5002.a:0 "Sem anfitrião, sem banquete."
 feast.5003.t:0 "Fim das Festividades"
 feast.5004.desc:0 "Agora que estou atrás das grades, meu grande banquete será cancelado. Ah, todas aquelas horas que gastei preparando... Desperdiçadas!"
 feast.5005.desc:0 "[host.Custom2('MyCharacterIntroduction', ROOT.Char)|U] foi aprisionado, e seu grande banquete chegou ao fim. Que timing infeliz!"
 feast.7002.a.bad:0 "Mal posso esperar para ir para casa."
 feast.7002.a.good:0 "Temos um tempo maravilhoso pela frente!"
 feast.7002.desc_intro:0 "Os criados correm pelo salão, trazendo as últimas decorações. Alguns dos convidados ainda não chegaram, e eu me deleito com uma deliciosa bebida junto à lareira."
 feast.7002.dislikes_host:0 "Mal posso esperar para que ess[Select_CString( host.IsFemale, 'a', 'e' )] [host.Custom2('InsultNoun', ROOT.Char)] faça papel de idiota."
 feast.7002.intent:0 "\n\nAinda não consigo encontrar [Select_CString( ROOT.Char.GetIntentTarget.IsFemale, 'a', 'o' )] [ROOT.Char.GetIntentTarget.GetTitledFirstName] em lugar algum. Mal posso esperar para que [ROOT.Char.GetIntentTarget.GetSheHe] chegue e meu plano de [ROOT.Char.GetInvolvedActivityIntent.GetName|l] [ROOT.Char.GetIntentTarget.GetSheHe] finalmente comece."
 feast.7002.intent_arrived:0 "\n\nAvisto [Select_CString( ROOT.Char.GetIntentTarget.IsFemale, 'a', 'o' )] [ROOT.Char.GetIntentTarget.GetTitledFirstName] entre a multidão, completamente inconsciente do meu plano de [ROOT.Char.GetInvolvedActivityIntent.GetName|l] [ROOT.Char.GetIntentTarget.GetSheHe]."
 feast.7002.likes_host:0 "Não há lugar onde eu preferiria estar."
 feast.7002.neutral:0 "#EMP Ah.#! Parece que já avistei alguns [ROOT.Char.Custom('GetExpensiveMeal')]..."
 feast.7002.t:0 "Fazendo Tempo"
 feast.7101.a:0 "E com isso, está tudo pronto."
 feast.7101.desc:0 "Poucas velas resistem depois que o último dos convidados sai. Posso ouvir dois criados suspirando aliviados após fechar as portas. A comida ainda está quente nos pratos de cerâmica.\n\nLogo, a notícia chegará a todos os cantos do reino e todo nobre que se preze saberá que minha magnificência é incomparável."
 feast.7101.t:0 "O Fim de uma Celebração"
 feast.7102.a.tt:0 "Cada membro próximo da família de [murder_guest.GetShortUIName]"
 feast.7102.a:0 "Considere-se sortudo por não estar lá."
 feast.7102.desc:0 "Eu sei o que você fez."
 feast.7102.opening:0 "[avenging_family.Custom2('SaudacaoApropriada', ROOT.Char)]"
 feast.7110.a.failure:0 "Da próxima vez, pegarei [honorary_guest.GetHerHim]..."
 feast.7110.a:0 "Um trabalho bem feito."
 feast.7110.desc.entourage:0 "A luz das velas faz o sangue parecer uma tapeçaria de veludo, espalhado pelo chão. Respiro aliviado quando vejo o último de meus $knight_culture_player_plural_no_tooltip$ limpando a espada — [my_knight.GetSheHe] acena silenciosamente para mim.\n\nDou um sinal para um d[Select_CString( my_knight.IsFemale, 'as', 'os' )] [my_knight.GetWomenMen] fechar as portas. Despeço-me de meus convidados, \"Uma verdadeira pena...\""
 feast.7110.desc.failed:0 "\"Obrigado pelo banquete magnífico!\" Alguns convidados me cercam e desejam expressar sua gratidão antes de partir. \"Um momento excelente!\" Nem consigo distinguir quem está falando, pois meu coração só tem um assunto a tratar.\n\nEncontro [Select_CString( honorary_guest.IsFemale, 'a', 'o' )] [honorary_guest.GetTitledFirstName] perto da saída. O sorriso [honorary_guest.GetHerHim|U] só me enfurece enquanto [honorary_guest.GetSheHe] acena dando adeus."
 feast.7110.desc.sneaky:0 "$feast.7110.desc.target_intro$ \"Que forma terrível de partir!\" diz o último, chamando os criados para ajudar, \"Sufocamento!\" \"Não é o primeiro a partir dessa forma — e certamente não será o último\", murmura o criado enquanto os cortesãos se retiram. Portas fechadas atrás deles."
 feast.7110.desc.target:0 "$feast.7110.desc.target_intro$ \"Quem poderia ter feito isso? Arruinando um banquete dessa maneira... conspiradores estão por toda parte\", murmura um cortesão, e viro-me rapidamente para meus criados. \"É hora de fechar as portas.\""
 feast.7110.desc.target_intro:0 "\"Que incidente infeliz!\" lamento audivelmente ao me despedir dos meus convidados. \"Uma verdadeira pena\", concorda outra pessoa ao se despedir. \"Verdadeiramente desafortunado\", ouço dizer, enquanto o cônjuge logo se junta.\n\n"
 feast.7110.t:0 "Um Final Feliz"
 feast.7151.a:0 "Mas agora devo partir."
 feast.7151.desc.desc_roughed_up:0 "A luz do dia invade pelas janelas e, em um instante, todo o salão fica iluminado. A maioria dos assentos agora está vazia. Talvez não seja surpresa, considerando o que fiz ao lugar!\n\n\"Eu te desprezo completamente, olhe o que você fez com a minha casa!\" [host.GetTitledFirstName] rosna para mim."
 feast.7151.desc:0 "A luz do dia entra pelas janelas e, em apenas um instante, todo o salão se ilumina. A maioria dos assentos está agora vazia. Alguns servos cumprimentam alegremente e se retiram.\n\n[host.GetTitledFirstName] sorri para mim."
 feast.7151.t:0 "Hora de Partir"
 feast.7201.a:0 "E agora, um brinde! [Select_CString( goh.IsFemale, 'A', 'Ao' )] [goh.GetTitledFirstNameNoTooltip]!"
 feast.7201.b.tt:0 "Você insulta [Select_CString( goh.IsFemale, 'a', 'o' )] [goh.GetFirstNameNoTooltip] em vez de honrar [goh.GetSheHe]"
 feast.7201.b:0 "Vamos abordar [Select_CString( goh.IsFemale, 'a', 'o' )] #EMP [goh.Custom2('InsultNoun', ROOT.Char)]#! do momento..."
 feast.7201.c:0 "E vocês são #EMP muito#! bem-vindos à minha hospitalidade."
 feast.7201.d:0 "Um brinde ao meu reinado!"
 feast.7201.desc:0 "O banquete está chegando ao fim, e meus visitantes certamente esperam que eu dedique um pouco de atenção [Select_CString( goh.IsFemale, 'a', 'ao' )] [goh.GetTitledFirstName], nosso estimado convidado de honra.\n\nTradicionalmente, um brinde elogioso e um bom gole de [host.Custom('RegionalDrink')] resolvem. Mas, por outro lado, tudo o que [Select_CString( goh.IsFemale, 'a', 'o' )] [goh.GetFirstNameNoTooltip] fez foi comparecer. Este banquete foi ideia minha, eu paguei por tudo e fui o anfitrião de todos. Hmm."
 feast.7201.e.escape.toast.tt:0 "[goh.GetFirstName] escapou antes que o sacrifício ritual pudesse começar"
 feast.7201.e.escape.toast:0 "A Refeição Escapa"
 feast.7201.e.flavor:0 "Você ergue uma taça para uma refeição deliciosa: seu Convidado de Honra."
 feast.7201.e.toast.tt:0 "Você devorou ritualmente [goh.GetFirstName]"
 feast.7201.e.toast:0 "Uma Refeição Deliciosa"
 feast.7201.e.warning.escape.tt:0 "@death_icon! #high Você#! tentará matar e devorar ritualmente [goh.GetFirstName], mas [goh.GetSheHe] pode escapar. Os convidados presentes podem escolher se vão participar se [goh.GetSheHe] for pego"
 feast.7201.e.warning.tt:0 "@death_icon! #high Você#! matará e devorará ritualmente [goh.GetFirstName]. Os convidados presentes são livres para participar ou abster-se"
 feast.7201.e:0 "Um brinde ao #EMP prato #! final: [goh.GetFirstNameNoTooltip]!"
 feast.7201.f.flavor:0 "Os ritos de hospitalidade unem anfitrião e convidado. Você honra [goh.GetFirstNameNoTooltip] como um dos seus."
 feast.7201.f:0 "Um brinde a [goh.GetTitledFirstNameNoTooltip] — e ao laço entre nós!"
 feast.7201.t:0 "Um Brinde a..."
 feast.7202.a:0 "É bom ser apreciado."
 feast.7202.adventurer_loot:0 "O quê..? #EMP Encontrem [host.GetSheHe], roubem o [host.Custom('GetExpensiveMeal')]#!"
 feast.7202.b:0 "Como você pôde fazer isso comigo?"
 feast.7202.c.tt:0 "[goh.GetFirstNameNoTooltip] levou isso para o lado pessoal"
 feast.7202.c:0 "Vou me lembrar disso."
 feast.7202.desc.bragged:0 "eu.\n\nInfelizmente, [host.GetFirstNameNoTooltip], fanfarrão que [host.GetSheHe] é, me ignora completamente e escolhe elogiar #EMP [host.GetHerselfHimself]#! por ter organizado o maldito banquete. Eu já deveria ter imaginado."
 feast.7202.desc.honoured:0 "eu.\n\nÉ um momento adorável, algo que esperei ansiosamente durante toda a noite, e passa rápido demais."
 feast.7202.desc.intro:0 "À medida que o banquete chega à sua inevitável conclusão, há um evento que todos esperam, e é o brinde [Select_CString( host.IsFemale, 'da', 'do' )] [host.GetTitledFirstName] ao convidado de honra:"
 feast.7202.desc.slagged_off:0 "eu.\n\nNo entanto, em vez de me elogiar como [host.GetSheHe] prometeu na convite, [host.GetFirstNameNoTooltip] começa um discurso vitriólico, questionando meu caráter, minha inteligência e minha higiene pessoal. Com #EMP detalhes#!."
 feast.7202.t:0 "$feast.7201.t$"
 feast.7203.a:0 "Ouçam! Ouçam!"
 feast.7203.b.goh_dishonoured:0 "Isso foi indecente."
 feast.7203.b.goh_honoured:0 "Para ser honesto, eu nunca gostei muito d[Select_CString( goh.IsFemale, 'a', 'o' )] [goh.GetFirstNameNoTooltip]."
 feast.7203.desc.bragged:0 "[goh.GetTitledFirstName]\n\nSurpreendentemente, mas não tão surpreendentemente assim, [host.GetFirstNameNoTooltip] praticamente ignora o seu convidado e elogia [Select_CString( host.IsFemale, 'si mesma', 'si mesmo' )] pela qualidade do banquete oferecido. Um pouco rude, no mínimo, e a quantidade de aplausos reflete isso."
 feast.7203.desc.honoured:0 "[goh.GetTitledFirstName]\n\nÉ um discurso decente, um pouco longo, mas é assim que as coisas costumam ser. Os convidados presentes aplaudem e comemoram educadamente quando termina, alguns com mais entusiasmo do que outros."
 feast.7203.desc.intro:0 "$feast.7202.desc.intro$"
 feast.7203.desc.slagged_off:0 "[goh.GetTitledFirstName]\n\nChocantemente, quando [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetFirstNameNoTooltip] se volta para o seu convidado, em vez de elogiar [goh.GetSheHe], [host.GetSheHe] imediatamente começa um discurso veemente e francamente inspirado, questionando a inteligência, o caráter moral e o cheiro geral d[Select_CString( goh.IsFemale, 'a', 'o' )] [goh.GetFirstNameNoTooltip]. Nós, na plateia, ficamos quase mudos de espanto."
 feast.7203.t:0 "$feast.7201.t$"
 feast.7206.a.cannibal:0 "Que irônico."
 feast.7206.a.flavor:0 "[host.GetTitledFirstName] pretende servir você como a refeição ritual; os convidados presentes podem escolher participar."
 feast.7206.a:0 "Espera... o quê?"
 feast.7206.b.failure:0 "Os guardas pegam você"
 feast.7206.b.flavor:0 "Você tenta escapar enquanto eles preparam as mesas."
 feast.7206.b.success.tt:0 "Você escapa antes que a refeição possa começar"
 feast.7206.b.success:0 "Você escapa, #EMP por pouco#!"
 feast.7206.b:0 "\"Acho que está ficando tarde.\""
 feast.7206.desc.alcohol:0 "Abastecido a noite toda com bebidas, o brinde final de [host.GetTitledFirstNamePossessive] me parece um pouco turvo e misterioso. Pego apenas o fim do discurso... algo sobre um último prato? Quão #EMP emocionante#!!\n\nTodos os convidados se viraram para me encarar. [host.GetFirstNameNoTooltip] ergue [host.GetHerHis] taça, sorrindo através de dentes salpicados de carne."
 feast.7206.desc:0 "No final do brinde final de [host.GetTitledFirstNamePossessive], eu pego apenas algumas palavras... algo sobre um prato final? Quão #EMP emocionante#!!\n\nTodo convidado se virou em minha direção. [host.GetFirstNameNoTooltip] levanta [host.GetHerHis] taça, sorrindo através de dentes salpicados de carne."
 feast.7206.t:0 "Uma Refeição Especial"
 feast.7207.b.devoured.flavor:0 "Eu pego minha faca e me uno ao banquete sagrado do anfitrião."
 feast.7207.b.devoured:0 "Bem, não posso recusar uma refeição sagrada."
 feast.7207.c.devoured.flavor:0 "Deixo o prato intocado, seja qual for a ofensa que isso cause."
 feast.7207.c.devoured:0 "Eu não consigo digerir isso."
 feast.7207.desc.devoured.guest:0 "Meu/Minha [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('goh'))] [goh.GetTitledFirstName] está ausente da mesa principal há algum tempo. Estou prestes a perguntar para onde [goh.GetSheHe] foi quando uma porção fumegante de carne vermelha suculenta chega ao meu prato.\n\n\"Sempre me perguntei qual é o gosto de [goh.GetFirstNameNoTooltip]\", diz [ritual_neighbor.GetTitledFirstName] mastigando um bocado de carne."
 feast.7207.t:0 "Brinde Fúnebre"
 feast_alliance_effect_tooltip:0 "[guest.GetTitledFirstName] e eu entramos em uma [alliance|E] mútua"
 feast_courses_bad:0 "Satisfatório"
 feast_courses_bad_desc:0 "$EFFECT_LIST_BULLET$ Pequeno ganho de [opinion|E]\n$EFFECT_LIST_BULLET$ Muito Pouco Ganho de [opinion|E] do [vassal|E] [GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName]\n\n#weak Com meia dúzia ou menos de rodadas de pratos, os convidados aqui certamente ficarão satisfeitos. Se não particularmente impressionados.#!"
 feast_courses_good:0 "Exorbitante"
 feast_courses_good_desc:0 "$EFFECT_LIST_BULLET$ Grande ganho de [opinion|E]\n$EFFECT_LIST_BULLET$ Maior ganho de [opinion|E] do [vassal|E] [GetVassalStance( 'courtly' ).GetTextIcon] [GetVassalStance( 'courtly' ).GetName]\n\n#weak Mais de duas dúzias de pratos de terras próximas e distantes! Comidas tradicionais! Comidas novas! Sopas! Limpa-palatos! Sobremesas, pratos principais e muito mais!#!"
 feast_courses_normal:0 "Apropriado"
 feast_courses_normal_desc:0 "$EFFECT_LIST_BULLET$ Ganho moderado de [opinion|E]\n$EFFECT_LIST_BULLET$ Ganho moderado de [opinion|E] do [vassal|E] [GetVassalStance( 'courtly' ).GetTextIcon] [GetVassalStance( 'courtly' ).GetName]\n\n#weak Um banquete exige certo grau de excesso de volume, e isso corresponderá a essa expectativa.#!"
 feast_events_flavor.0001.a:0 "\"Vamos brindar [Select_CString( relation_target.IsFemale, 'a', 'ao' )] [relation_target.GetFirstNameNoTooltip]! E à família [guest.GetDynasty.GetBaseNameNoTooltip]!\""
 feast_events_flavor.0001.aa:0 "\"Que as famílias [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] e [guest.GetDynasty.GetBaseNameNoTooltip] se unam!\""
 feast_events_flavor.0001.b:0 "\"E eu só tenho palavras igualmente carinhosas para [relation_target.GetSheHe].\""
 feast_events_flavor.0001.c:0 "\"Nunca confiarei em um [guest.GetDynasty.GetBaseNameNoTooltip].\""
 feast_events_flavor.0001.d:0 "\"Peço desculpas por meus erros passados.\""
 feast_events_flavor.0001.desc.bad:0 "\"[Select_CString( relation_target.IsFemale, 'Minha querida', 'Meu querido' )] [guest.Custom2('RelationToMeShort', SCOPE.sC('relation_target'))] [relation_target.GetFirstName] me diz que você é um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] #EMP [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('relation_target'))]#!. Espero sinceramente que os rumores sejam falsos e tudo não passe de um simples mal-entendido.\""
 feast_events_flavor.0001.desc.good:0 "[Select_CString( relation_target.IsFemale, 'Minha querida', 'Meu querido' )] [guest.Custom2('RelationToMeShort', SCOPE.sC('relation_target'))] [relation_target.GetFirstName] fala de você com carinho.\" [guest.GetSheHe|U] diz orgulhosamente, tomando um gole de [guest.Custom('RegionalDrink')] [guest.GetHerHim]. \"Estava ansioso para festejar com você."
 feast_events_flavor.0001.desc.intro:0 "\"[ROOT.Char.GetTitledFirstName]!\" M[Select_CString( guest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guest'))] [guest.GetTitledFirstName|U] chama meu nome.\n\n"
 feast_events_flavor.0001.e:0 "\"Não estou aqui para falar sobre [relation_target.GetSheHe]!\""
 feast_events_flavor.0001.t:0 "Ouvi Falar de Você"
 feast_events_flavor.0002.a:0 "Não sinto falta de suas provocações, querid[Select_CString( former_rival.IsFemale, 'a', 'o' )] [former_rival.GetTitledFirstName]..."
 feast_events_flavor.0002.b:0 "Antes opositores, agora mais próximos do que nunca!"
 feast_events_flavor.0002.c.forgiving_sinful.tt:0 "Você ganhará [piety|E] porque sua [faith|E] [THIS.GetCharacter.GetFaith.GetAdjective] considera o [trait|E] [GetTrait('vengeful').GetName( GetNullCharacter )] como [virtuous|E] ou [sinful|E] [GetTrait('forgiving').GetName( GetNullCharacter )]"
 feast_events_flavor.0002.c.vengeful_sinful.tt:0 "Você perderá [piety|E] porque sua [faith|E] [THIS.GetCharacter.GetFaith.GetAdjective] considera o [trait|E] [GetTrait('forgiving').GetName( GetNullCharacter )] como [virtuous|E] ou [sinful|E] [GetTrait('vengeful').GetName( GetNullCharacter )]"
 feast_events_flavor.0002.c:0 "Obrigado por me lembrar - vá embora, [former_rival.Custom2('InsultAdjective', ROOT.Char)] [former_rival.Custom2('InsultNoun', ROOT.Char)]!"
 feast_events_flavor.0002.d.virtuous.tt:0 "Esta opção está disponível porque sua [faith|E] [THIS.GetCharacter.GetFaith.GetAdjective] considera o [trait|E] [GetTrait('forgiving').GetName( GetNullCharacter )] como [virtuous|E] ou o [trait|E] [GetTrait('vengeful').GetName( GetNullCharacter )] como [sinful|E]"
 feast_events_flavor.0002.d.virtuous:0 "É realmente [ROOT.Char.GetFaith.GetReligion.GetAdjective] oferecer a outra face!"
 feast_events_flavor.0002.d:0 "Mais [former_rival.Custom('RegionalAlcoholicDrink')] para est[Select_CString( former_rival.IsFemale, 'a', 'e' )] [former_rival.Custom('ComplimentAdjective')] [former_rival.Custom2('InsultNoun', ROOT.Char)]!"
 feast_events_flavor.0002.desc:0 "M[Select_CString( former_rival.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_rival'))] e [Select_CString( former_rival.IsFemale, 'antiga', 'antigo' )] [rival|E], [former_rival.GetTitledFirstName] aproxima-se da minha mesa, duas taças em mãos, [former_rival.Custom('quirk_pos_pp')] diante de [former_rival.GetSheHe], [former_rival.Custom('quirk_pos_adverb')] sentando-se em uma cadeira vazia ao meu lado. Logo estamos ambos profundamente em conversa, relembrando nossas antigas rivalidades."
 feast_events_flavor.0002.t:0 "Perdoar é Divino"
 feast_every_guest:0 "Todos os convidados"
 feast_food_bad:0 "Pratos Simples"
 feast_food_bad_desc:0 "$EFFECT_LIST_BULLET$ Redução do ganho de [prestige|E]\n\n#weak Todo nobre certamente aprecia boa comida simples em grandes quantidades em vez de qualquer coisa requintada. Certo?#!"
 feast_food_good:0 "Obras de Arte Culinárias"
 feast_food_good_desc:0 "$EFFECT_LIST_BULLET$ Ganho significativo de [prestige|E]\n\n#weak Enfie #EMP isso#! dentro #EMP daquilo#! e prenda para trás para parecer um falcão voando! Um prato sem uma história é pouco mais do que #EMP porcaria#!.#!"
 feast_food_normal:0 "Delícias Exóticas"
 feast_food_normal_desc:0 "$EFFECT_LIST_BULLET$ Ganho moderado de [prestige|E]\n\n#weak Qualquer banquete de destaque complementa as luxúrias básicas que a nobreza espera com comidas mais estranhas e ricas, afinal de contas.#!"
