l_spanish:
 feast_main_befriend.1001.a:0 "Que noite maravilhosa!"
 feast_main_befriend.1001.arrogant_guest:0 "[arrogant_guest.GetTitledFirstName] não reagiu bem e disse a todos que era uma grande injustiça ser sentado com senhores e damas pouco melhores do que plebeus."
 feast_main_befriend.1001.arrogant_kind_link:0 "Agindo de forma totalmente oposta,"
 feast_main_befriend.1001.friendship:0 "\n\n[potential_friend.GetFirstNameNoTooltip] e eu conversamos a noite toda e concordamos que não deveria ser a última vez em que compartilhamos uma refeição e rimos juntos!"
 feast_main_befriend.1001.getting_close:0 "Como meus convidados mais ilustres e eu tivemos que nos encaixar entre a nobreza inferior, acabei próximo [Select_CString( potential_friend.IsFemale, 'a minha', 'ao meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('potential_friend'))], [potential_friend.GetTitledFirstName]!"
 feast_main_befriend.1001.kind_to_lower_nobility:0 "[kind_to_lower_nobility.GetTitledFirstName] mostrou graça e humildade entre os inferiores."
 feast_main_befriend.1001.no_kind_target:0 "Enquanto os nobres se misturavam com os menos privilegiados, palavras de amizade e inimizade foram trocadas entre pessoas que raramente se associam."
 feast_main_befriend.1001.opening:0 "A grande mesa onde os nobres de maior posição se sentam no palanque deu um alto estalo e, um momento depois, cedeu sob o peso da comida e das decorações douradas!\n\n"
 feast_main_befriend.1001.really_hungry:0 "[kind_to_lower_nobility.GetSheHe|U] continuou dizendo aos convidados mais famintos que eles deveriam visitar a sua casa o mais rápido possível."
 feast_main_befriend.1001.t:0 "A Mesa Real se Rompe"
 feast_main_befriend.2001.a:0 "Que ótima noite!"
 feast_main_befriend.2001.arrogant_guest:0 "[arrogant_guest.GetTitledFirstName], no entanto, não reagiu bem à nova posição e disse a todos como era uma grande injustiça ser sentado entre pessoas pouco melhores do que plebeus."
 feast_main_befriend.2001.arrogant_kind_link:0 "Agindo de forma totalmente oposta,"
 feast_main_befriend.2001.friendship:0 "\n\nDo meu lugar nas mesas mais baixas, o banquete foi um sucesso, especialmente porque [activity.GetOwner.GetFirstNameNoTooltip] concordou que não poderia ser a última vez que nos sentamos juntos para comer, conversar e rir."
 feast_main_befriend.2001.getting_close:0 "O que poderia ter sido um desastre se transformou em uma bênção disfarçada, já que acabei próximo [Select_CString( ROOT.Char.IsFemale, 'a nossa anfitriã', 'ao nosso anfitrião' )], [activity.GetOwner.GetTitledFirstName]!"
 feast_main_befriend.2001.kind_to_lower_nobility:0 "[kind_to_lower_nobility.GetTitledFirstName] mostrou graça e humildade entre os inferiores."
 feast_main_befriend.2001.no_kind_target:0 "\n\nEnquanto os nobres de alta posição se misturavam com os de posição inferior, palavras de amizade e inimizade eram trocadas entre pessoas que raramente se associam muito."
 feast_main_befriend.2001.opening:0 "$feast_main_befriend.1001.opening$"
 feast_main_befriend.2001.really_hungry:0 "[kind_to_lower_nobility.GetFirstName] continuava dizendo aos convidados que [kind_to_lower_nobility.GetSheHe] sempre tenta ser gentil com pessoas que estão quase tão famintas quanto [kind_to_lower_nobility.GetSheHe] está."
 feast_main_befriend.2001.t:0 "A Mesa Real se Rompe"
 feast_main_befriend.2002.a:0 "Podem me comparar a um camponês."
 feast_main_befriend.2002.arrogant_guest:0 "Não conseguia acreditar quando toda a nobreza de alta posição foi transferida do palanque para o chão entre os barões e os $knight_culture_player_plural_no_tooltip_lowercase$. O que [Select_CString( activity.GetOwner.IsFemale, 'a', 'o' )] [activity.GetOwner.GetTitledFirstName] pensa que eu sou? Apenas um plebeu?! Deixei o maior número possível de pessoas saber como me senti, especialmente aqueles falsos nobres ao meu redor!"
 feast_main_befriend.2002.because_of_hospitality_tenet:0 "Porque a sua [faith|E] supostamente honra os convidados:"
 feast_main_befriend.2002.disgusted_by_kindness:0 "\n\nComo se não bastasse, [kind_to_lower_nobility.GetTitledFirstName] foi elogiad[Select_CString( kind_to_lower_nobility.IsFemale, 'a', 'o' )] a noite toda por ser \"gentil\" e \"humilde\" entre essas pessoas. [kind_to_lower_nobility.GetSheHe] não tem nenhum respeito próprio?"
 feast_main_befriend.2002.t:0 "A Mesa Real se Rompe"
 feast_main_befriend.2003.a:0 "Estou feliz por ter conhecido essas pessoas."
 feast_main_befriend.2003.arrogant_guest:0 "\n\n[arrogant_guest.GetTitledFirstName] não reagiu bem ao novo lugar e disse a todos como era uma grande injustiça ser sentado com senhores e damas pouco melhores do que plebeus."
 feast_main_befriend.2003.cannibal_kindness:0 "\n\nDo meu novo lugar, observei os barões e os $knight_culture_player_plural_no_tooltip_lowercase$ se enchendo cada vez mais com suas bocas escancaradas, e à medida que a fome aumentava dentro de mim, ofereci-me para limpar a gordura do queixo de alguém, apenas para poder tocar aquele pescoço macio e rechonchudo..."
 feast_main_befriend.2003.ending:0 "\n\nMais tarde, [activity.GetOwner.GetTitledFirstName] me disse como todos os convidados notaram a humildade e a gentileza que demonstrei entre os meus inferiores."
 feast_main_befriend.2003.kind_to_glutton:0 "\n\nEu, por outro lado, prestei atenção especial [Select_CString( glutton_target.IsFemale, 'na', 'no' )] [glutton_target.GetTitledFirstName] e no apetite voraz dele. [glutton_target.GetSheHe|U] arrancava pedaços de carne avidamente, com os sucos escorrendo pelo rosto, enquanto a fome insaciável que conheço muito bem começava a roncar em meu estômago, ao passo que eu continuava a passar comida para [glutton_target.GetSheHe]."
 feast_main_befriend.2003.kind_to_lower_nobility:0 "\n\nOlhei para os senhores, damas e $knight_culture_player_plural_no_tooltip_lowercase$ sem desprezo. Conversando com eles, descobri que compartilham muitas das mesmas preocupações, problemas e alegrias que eu tenho em minha posição elevada. Conforme a noite avançava, compartilhei do meu prato e ofereci histórias minhas em reciprocidade."
 feast_main_befriend.2003.opening:0 "A grande mesa onde os nobres de alta posição se sentam no palanque deu um alto estalo e, um momento depois, cedeu sob o peso da comida e das decorações douradas! Todos nós tivemos que ser movidos para junto da nobreza inferior no chão do Grande Salão."
 feast_main_befriend.2003.t:0 "A Mesa Real se Rompe"
 feast_main_befriend.2004.a:0 "Tudo acabou sendo para o melhor."
 feast_main_befriend.2004.arrogant_guest:0 "\n\n[arrogant_guest.GetTitledFirstName] não reagiu bem ao novo lugar e disse a todos como era uma grande injustiça ser sentado com senhores e damas pouco melhores do que plebeus."
 feast_main_befriend.2004.kindness_from_other:0 "\n\nTive a sorte de ter sentado ao lado [Select_CString( kind_to_lower_nobility.IsFemale, 'da', 'do' )] [kind_to_lower_nobility.GetTitledFirstName], porém, e conversamos sobre as alegrias da comida e da alimentação por horas. Enquanto eu não estivesse enchendo minha boca de carne, é claro! Eu pude perceber que [kind_to_lower_nobility.GetFirstName] estava ficando com mais fome só de me observar!"
 feast_main_befriend.2004.t:0 "A Mesa Real se Rompe"
 feast_main_befriend.3001.a:0 "Sinto que aprendi algo."
 feast_main_befriend.3001.arrogant_guest:0 "\n\n[arrogant_guest.GetTitledFirstName] não reagiu bem ao novo lugar e disse a todos como era uma grande injustiça ser sentado com senhores e damas pouco melhores do que plebeus."
 feast_main_befriend.3001.ending:0 "\n\nEnquanto os nobres de alta posição social se misturavam com os menos privilegiados, palavras de amizade e inimizade foram trocadas entre pessoas que raramente se associam."
 feast_main_befriend.3001.kind_to_lower_nobility:0 "\n\n[kind_to_lower_nobility.GetTitledFirstName] demonstrou graça e humildade entre seus inferiores. A conduta [kind_to_lower_nobility.GetHerHim|U] é algo que todos nós podemos aspirar."
 feast_main_befriend.3001.really_hungry:0 "[kind_to_lower_nobility.GetSheHe|U] também oferecia comida aos outros, desejando-lhes uma constituição saudável e robusta."
 feast_main_befriend.3001.t:0 "A Mesa Real se Rompe"
 feast_main_befriend.5002.a:0 "Que [potential_friend.GetWomanMan]."
 feast_main_befriend.5002.desc:0 "Ao ver meus convidados partindo, parece que eles estão se despedindo de bom ânimo. Também estou aliviado ao ver que [Select_CString( potential_friend.IsFemale, 'a', 'o' )] [potential_friend.GetTitledFirstName] não parte sem se despedir.\n\nAmbos sabemos que nos veremos novamente em breve."
 feast_main_befriend.5002.t:0 "Uma Amizade"
 feast_main_befriend.5003.a:0 "Isso foi algo especial."
 feast_main_befriend.5003.desc:0 "Antes de deixar o banquete, eu tinha que dizer [Select_CString( host_saying_goodbye.IsFemale, 'a', 'ao' )] [host_saying_goodbye.GetTitledFirstName] o quanto me diverti. [host_saying_goodbye.GetSheHe|U] me disse para me levantar e colocou sua mão confiável no meu ombro.\n\nNão acredito que vai demorar muito para nos vermos novamente."
 feast_main_befriend.5003.t:0 "Uma Amizade"
 feast_main_befriend.5004.a:0 "Até a próxima, [Select_CString( activity.GetOwner.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', activity.GetOwner)]!"
 feast_main_befriend.5004.desc:0 "Enquanto me preparo para partir com os outros convidados, não consigo deixar de olhar para os últimos dias com um sorriso.\n\nO banquete foi esplêndido e meu contato com convidados de diferentes posições sociais me proporcionou novas perspectivas."
 feast_main_befriend.5004.t:0 "Um Acidente Memorável"
