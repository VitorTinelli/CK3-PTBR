l_spanish:
 activity_funeral:0 "Funeral"
 activity_funeral_conclusion_desc:0 "O [GetActivityType( 'activity_funeral' ).GetName] foi concluído"
 activity_funeral_desc:0 "Reúna o reino em prantos para um $activity_funeral$, uma chance de prestar uma homenagem adequada a um membro venerado da nobreza."
 activity_funeral_destination_selection:0 "O corpo deve ser enterrado em algum lugar dentro de seu próprio reino. Locais sagrados e edifícios religiosos melhorarão a qualidade do serviço."
 activity_funeral_guest_desc:0 "$BULLET_WITH_TAB$Os participantes podem aumentar a [opinion|E] dos personagens presentes\n$BULLET_WITH_TAB$Os participantes podem perder [stress_loss_i][stress|E]"
 activity_funeral_guest_help_text:0 "Quaisquer [activity_guests|E] terão a oportunidade de aumentar a [opinion|E] sobre você.\nFunerais também são uma oportunidade de liberar suas cargas emocionais e perder algum [stress|E] e ganhar [piety|E]."
 activity_funeral_holy_site:0 "#P ++ Local Sagrado#!\n"
 activity_funeral_host_desc:0 "$BULLET_WITH_TAB$Ganho de [opinion_i] [opinion|E]\n$BULLET_WITH_TAB$Perda de [stress_loss_i] [stress_loss|E]\n$BULLET_WITH_TAB$Ganho de [piety_i] [piety|E]\n$BULLET_WITH_TAB$Ganho de [legitimacy_i] [legitimacy|E]"
 activity_funeral_major_religious_building:0 "#P +++ Edifício Religioso Principal#!\n"
 activity_funeral_mountain:0 "#P ++ Montanhoso#!\n"
 activity_funeral_predicted_cost:0 "O custo de um funeral é afetado pelas [activity_options|E] que você escolhe e pelas práticas funerárias [doctrine|E] de sua [faith|E]."
 activity_funeral_province_desc:0 "Você realiza um Funeral em [ROOT.Province.GetName]\nProvíncias com uma alta pontuação fornecem [piety_i][piety|E] aumentada, perda de [stress_loss_i][stress|E], e ganho de [legitimacy|E]\n"
 activity_funeral_selection_tooltip:0 "Realize um funeral para enterrar um parente falecido\n\nRecompensas Antecipadas:\n$BULLET_WITH_TAB$[opinion_i] [opinion|E]\n$BULLET_WITH_TAB$Ganho de [legitimacy_i] [legitimacy|E]\n$BULLET_WITH_TAB$[stress_loss_i] [stress_loss|E]\n$BULLET_WITH_TAB$Ganho de [piety_i] [piety|E]"
 activity_funeral_temple:0 "#P ++ Templo#!\n"
 activity_funeral_tos:0 "#P ++ $building_type_tower_of_silence_01$#!\n"
 activity_funeral_wavel:0 "#P ++ $building_type_wawel_cathedral_01$#!\n"
 activity_window_character_body:0 "$body_to_bury_for_host$"
 body_to_bury_desc_for_host:0 "O corpo que será entregue ao além"
 body_to_bury_desc_for_host_required_tt:0 "#T Convidado Especial Necessário\n#!@warning_icon! #X Esta atividade precisa de um $body_to_bury_for_host$ para enterrar#!"
 body_to_bury_for_host:0 "Falecido"
 body_to_bury_selection_info:0 "Selecione um recém-falecido para ser entregue ao além"
 building_funeral_effect_desc:0 "$unlocks_building_desc$Aumenta o ganho de [legitimacy|E] e [piety|E] para as [activities|E] [GetActivityType('activity_funeral').GetTextIcon][GetActivityType('activity_funeral').GetName] realizadas nesta [holding|E]"
 building_funeral_wavel_effect_desc:0 "$unlocks_building_desc$Aumenta significativamente o ganho de [legitimacy|E] e [piety|E] para as [activities|E] [GetActivityType('activity_funeral').GetTextIcon][GetActivityType('activity_funeral').GetName] realizadas nesta [holding|E]"
 ceremonydesc_ceremony:0 "O corpo será entregue ao além em uma cerimônia tradicional e [Concept('pious', 'Piedosa')|E]."
 ceremonydesc_cremation:0 "O corpo é queimado em uma grande pira funerária."
 ceremonydesc_ground_burial:0 "O corpo é entregue à terra e orações são compartilhadas entre os enlutados. Embora a alma eterna viva, o corpo é colocado em seu lugar de descanso final."
 ceremonydesc_mummification:0 "O corpo mumificado é colocado em uma tumba onde pode descansar."
 ceremonydesc_public_bewailment:0 "O lamento público é um momento para liberar emoções; chorar, lamentar, lamentar ao redor do corpo do falecido antes que seja entregue à terra."
 ceremonydesc_sky_burial:0 "O corpo será entregue ao além nas barrigas das aves, para que o falecido possa alimentar o mundo como um dia os alimentou."
 ceremonyname_ceremony:0 "Cerimônia"
 ceremonyname_cremation:0 "Cremação"
 ceremonyname_ground_burial:0 "Sepultamento"
 ceremonyname_mummification:0 "Enterramento"
 ceremonyname_public_bewailment:0 "Lamento Público"
 ceremonyname_sky_burial:0 "Enterro Celestial"
 dead_hair:0 "Cabelo [Select_CString( deceased.IsFemale, 'da', 'do' )] [deceased.GetFirstNameNoTooltip]"
 dead_hair_desc:0 "Fios de cabelo extraídos do corpo morto de [deceased.GetName], valorizados pelas bruxas por suas supostas propriedades mágicas."
 deceased_selection_widget_header:0 "Selecione o corpo para enterrar"
 every_funeral_participant:0 "Cada convidado no funeral"
 friend_bonded_over_grief:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUIName] se uniram pela perda compartilhada de um ente querido"
 friend_comforted_at_funeral:0 "[CHARACTER.GetShortUIName|U] confortou [TARGET_CHARACTER.GetShortUIName] em um funeral"
 friend_comforted_at_funeral_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] confortou [CHARACTER.GetShortUIName] em um funeral"
 friend_cried_at_funeral_together:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUIName] choraram juntos em um funeral"
 friend_renounced_claim:0 "[CHARACTER.GetShortUIName|U] abandonou uma reivindicação ao título de [TARGET_CHARACTER.GetShortUIName]"
 friend_renounced_claim_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] abandonou uma reivindicação ao título de [CHARACTER.GetShortUIName]"
 funeral.0001.a.tt:0 "[host.GetName] faleceu."
 funeral.0001.a:0 "Que infelicidade."
 funeral.0001.desc:0 "Mais um motivo de luto nos acomete neste dia, pois nosso anfitrião [host.GetName] ascendeu ao [host.GetFaith.PositiveAfterLife].\n\nEmbora isso encurte as cerimônias atuais, também indica que poderá haver outro funeral bem mais cedo do que o esperado."
 funeral.0001.t:0 "Morte em um Funeral"
 funeral.0002.a.tt:0 "Os deveres de hospedagem do funeral passaram para você."
 funeral.0002.a:0 "Farei o que for necessário."
 funeral.0002.desc:0 "Mais um motivo de luto nos acomete neste dia, pois nosso anfitrião [host.GetName] ascendeu ao [host.GetFaith.PositiveAfterLife]. Como herdeir[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [host.GetHerHim], as responsabilidades de anfitriã[Select_CString( ROOT.Char.IsFemale, '', 'o' )] passaram para mim.\n\nEmbora isso não signifique o fim de nossa humilde cerimônia, indica que poderá haver outro funeral bem mais cedo do que o esperado."
 funeral.0002.t:0 "Morte em um Funeral"
 funeral.0010.a.bad:0 "Um momento de celebração por minha contagem."
 funeral.0010.a.good:0 "Nunca esquecerei [deceased.GetHerHim]."
 funeral.0010.desc_intro:0 "[ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetBaronyNameExplicitly] será o local de descanso final de [deceased.GetFirstName], e eu"
 funeral.0010.dislikes_host:0 "recebido pel[Select_CString( host.IsFemale, 'a', 'o' )] [host.Custom2('InsultNoun', ROOT.Char)] [host.Custom2('InsultAdjective', ROOT.Char)] [host.GetName]. Embora eu deteste estar na companhia [host.GetHerHim], estou realmente aqui por [deceased.GetName]. Esta é minha oportunidade de"
 funeral.0010.disrespect:0 "dar a última risada sobre aquele miserável desprezível."
 funeral.0010.intent:0 "\n\nAinda não consigo encontrar [Select_CString( ROOT.Char.GetIntentTarget.IsFemale, 'a', 'o' )] [ROOT.Char.GetIntentTarget.GetTitledFirstName] em lugar nenhum. Aguardo ansiosamente a chegada [ROOT.Char.GetIntentTarget.GetHerHim] para finalmente começar meu plano de [ROOT.Char.GetInvolvedActivityIntent.GetName|l] [ROOT.Char.GetIntentTarget.GetSheHe]."
 funeral.0010.intent_arrived:0 "\n\nVejo [Select_CString( ROOT.Char.GetIntentTarget.IsFemale, 'a', 'o' )] [ROOT.Char.GetIntentTarget.GetTitledFirstName] entre os enlutados, totalmente inconsciente de meu plano de [ROOT.Char.GetInvolvedActivityIntent.GetName|l] [ROOT.Char.GetIntentTarget.GetSheHe]."
 funeral.0010.likes_host:0 "recebido pelo magnânimo [host.GetName]. Além de poder desfrutar da boa companhia [host.GetHerHim], também estou aqui por [deceased.GetName]. Esta será minha última chance de"
 funeral.0010.neutral:0 "recebido por [host.GetName]. Embora eu me importe pouco com a companhia [host.GetHerHim], este dia realmente é sobre [deceased.GetName] e esta é minha oportunidade de"
 funeral.0010.respect:0 "dizer meu último adeus a [deceased.GetSheHe].\n\n"
 funeral.0010.self:0 "fico sozinho para reunir meus pensamentos e me preparar para a chegada dos honrados enlutados."
 funeral.0010.t:0 "Chegada"
 funeral.0100.a:0 "Belíssimo."
 funeral.0100.b:0 "Agora [deceased.GetSheHe] vive para sempre na corte."
 funeral.0100.c:0 "Vou mantê-la comigo para sempre."
 funeral.0100.d:0 "Tudo isso pertence ao túmulo."
 funeral.0100.desc.intro2.burial:0 "O corpo envolto de [deceased.GetFirstName|U] é mantido suspenso acima de uma sepultura aberta, cercado por amigos íntimos e familiares. De pé ao lado da cabeça [deceased.GetHerHim] está [host.GetNameOrMe], um lugar privilegiado de luto concedido apenas a um anfitrião magnânimo."
 funeral.0100.desc.intro2.cremation:0 "[deceased.GetFirstName] jaz envolt[Select_CString( deceased.IsFemale, 'a', 'o' )] em finos tecidos sobre uma imponente pira funerária. O(a) [host.GetFaith.PriestNeuter] permanece ao lado de [host.GetNameOrMe] com uma tocha, cuja luz dança ao sabor do vento."
 funeral.0100.desc.intro2.mummification:0 "O corpo perfeitamente preservado de [deceased.GetFirstName|U] está exposto para todos verem. O maravilhoso trabalho dos embalsamadores faz [deceased.GetSheHe] praticamente parecer que poderia se levantar e caminhar novamente, e antes que o corpo seja enterrado de uma vez por todas, ele fica sozinho com [host.GetNameOrMe] por apenas um momento."
 funeral.0100.desc.intro2.sky_burial:0 "O corpo de [deceased.GetFirstName|U] foi levado ao ponto mais alto em [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetBaronyNameExplicitly] em uma procissão de enlutados. Pouco antes do cume, o corpo é deixado exclusivamente para que [host.GetNameOrMe] leve para a última etapa da jornada."
 funeral.0100.desc.intro:0 "Chegou a hora de realizar os últimos ritos de [deceased.GetName] antes de sua jornada final para o além.\n\n"
 funeral.0100.desc.mid.child:0 "\n\nOlho para o corpo sem vida [Select_CString( deceased.IsFemale, 'da minha', 'do meu' )] [deceased.Custom('GetDaughterSon')] e lamento. [Select_CString( ROOT.Char.IsFemale, 'Nenhuma', 'Nenhum' )] [ROOT.Char.GetMotherFather] deveria jamais viver para ver seus próprios filhos serem tão cruelmente ceifados."
 funeral.0100.desc.mid.fallback:0 "\n\nO último rito do corpo [deceased.GetHerHim] é deixado para mim, e o peso de tal responsabilidade pesa muito em minha mente."
 funeral.0100.desc.mid.hate:0 "\n\nFrente a frente com o corpo [deceased.GetHerHim], vazio de vida, eu dou uma pequena risada para mim mesmo. Serei eu quem irá enterrar os restos repugnantes [deceased.GetHerHim] de uma vez por todas."
 funeral.0100.desc.mid.love:0 "\n\nMal consigo me trazer a olhar para [deceased.GetSheHe], e mesmo agora eu luto para acreditar que este é verdadeiramente nosso último momento juntos."
 funeral.0100.desc.mid.old:0 "\n\nSó consigo me confortar ao ver alguém tão idoso neste estado. Uma vida tão longa e lustrosa é a inveja de muitos, e estar cercado por tantos enlutados é tudo o que qualquer [ROOT.Char.GetWomanMan] pode esperar."
 funeral.0100.desc.mid.predecessor:0 "\n\nVer [deceased.GetSheHe] cercado por tantos enlutados e receber um enterro [ROOT.Char.GetFaith.GetAdjective] apropriado me dá esperança de que talvez eu também seja lembrado com tanto carinho quanto [ROOT.Char.GetTitleAsNameNoTooltip|U]."
 funeral.0100.desc.mid.spouse:0 "\n\nContemplo [Select_CString( deceased.IsFemale, 'minha falecida', 'meu falecido' )] [deceased.Custom('WifeHusband')] pela última vez, e não consigo deixar de imaginar todo o tempo que nos foi negado. Todos os netos que nunca criamos, todas as noites de romance que nunca compartilhamos."
 funeral.0100.desc.mid.young:0 "\n\nQue tragédia que alguém tão jovem tenha sua vida tirada [deceased.GetHerHim] bem diante dos meus olhos."
 funeral.0100.desc.outro.burial:0 "Finalmente, o corpo [deceased.GetHerHim] é baixado à terra, e o funeral é oficialmente concluído com uma oração."
 funeral.0100.desc.outro.cremation:0 "Baixo a tocha à lenha e observo enquanto a torre de madeira é acesa. Tudo o que resta agora é esperar que [deceased.GetFirstNameNoTooltip] se torne cinzas."
 funeral.0100.desc.outro.mummification:0 "Os restos mumificados são deixados para mim junto com alguns jarros de órgãos. O túmulo pode ser o lar de qualquer um deles, mas minha corte é tão adequada quanto qualquer outra."
 funeral.0100.desc.outro.sky_burial:0 "As incisões cerimoniais são feitas para auxiliar as aves necrófagas a acessarem a carne, e a cerimônia está completa por enquanto. Tudo o que resta é retornar em alguns dias para buscar os ossos."
 funeral.0100.t:0 "Pó ao Pó"
 funeral.0101.a:0 "$funeral.0100.a$"
 funeral.0101.desc.intro2.burial:0 "$funeral.0100.desc.intro2.burial$"
 funeral.0101.desc.intro2.cremation:0 "$funeral.0100.desc.intro2.cremation$"
 funeral.0101.desc.intro2.mummification:0 "$funeral.0100.desc.intro2.mummification$"
 funeral.0101.desc.intro2.sky_burial:0 "$funeral.0100.desc.intro2.sky_burial$"
 funeral.0101.desc.intro:0 "$funeral.0100.desc.intro$"
 funeral.0101.desc.outro.burial:0 "\n\nNos são oferecidas algumas orações tradicionais para o falecido, e então o corpo [deceased.GetHerHim] é lentamente baixado em sua sepultura, onde [deceased.GetSheHe] poderá descansar no paraíso pela eternidade."
 funeral.0101.desc.outro.cremation:0 "A tocha é baixada até a lenha e observo enquanto a torre de madeira se incendeia. Tudo o que resta é esperar que [deceased.GetFirstNameNoTooltip] seja reduzido a cinzas."
 funeral.0101.desc.outro.mummification:0 "\n\nOs restos são agora levados junto com os órgãos envasados [deceased.GetHerHim] por [host.GetName] para serem mantidos pela eternidade."
 funeral.0101.desc.outro.sky_burial:0 "\n\nAs incisões tradicionais são feitas no corpo, e já pássaros famintos voam sobrevoando, prontos para consumir a carne. Tudo o que resta agora é deixá-los trabalhar, e os [host.GetFaith.PriestNeuterPlural] retornarão em alguns dias para recolher os ossos."
 funeral.0101.t:0 "$funeral.0100.t$"
 funeral.1000.a:0 "As lembranças são dolorosas demais."
 funeral.1000.b.failure:0 "Ninguém acredita em você"
 funeral.1000.b.success:0 "Você finge bem"
 funeral.1000.b:0 "Ah sim, eu conhecia bem [deceased.GetSheHe]."
 funeral.1000.c:0 "Admito que não tenho nada."
 funeral.1000.d.failure:0 "Você não consegue explicar bem"
 funeral.1000.d.success:0 "Sua memória traz lágrimas"
 funeral.1000.d:0 "Como poderia esquecer?"
 funeral.1000.desc:0 "Num canto tranquilo da [host.GetFaith.HouseOfWorship], ouço [random_attendee.GetName] conversando com um grupo de enlutados. [random_attendee.GetSheHe|U] faz um gesto sombrio para mim.\n\n\"Todos nós temos boas lembranças de [deceased.GetName], eu estava apenas falando sobre a vez que [attendee_memory.GetDescription]. Me diga, você tem alguma lembrança para compartilhar?\""
 funeral.1000.e:0 "Isso não é uma competição."
 funeral.1000.t:0 "Lembro-me [deceased.GetHerHim]"
 funeral.1010.a:0 "[common_grave_good.GetNameNoTooltip] não é meu para guardar."
 funeral.1010.b:0 "[masterwork_grave_good.GetNameNoTooltip] pertence ao [ROOT.Char.GetFaith.PositiveAfterLife]."
 funeral.1010.c:0 "[famed_grave_good.GetNameNoTooltip] será enterrado."
 funeral.1010.d:0 "Nada menos que [illustrious_grave_good.GetNameNoTooltip] é digno."
 funeral.1010.desc:0 "Convidados ilustres passam diante do corpo envolto de [deceased.GetName] um após o outro, concedendo a [deceased.GetHerHim] pouco mais que uma leve inclinação ou aceno, como se tais gestos superficiais pudessem alguma vez honrar uma vida. Meu coração pesa tanto quanto meus bolsos, tão cheios de quinquilharias e lembranças de [deceased.GetFirstNameNoTooltip].\n\nNão posso deixar de me perguntar por que devo acumular objetos que pertencem justamente a [deceased.GetSheHe]."
 funeral.1010.e:0 "Não ouse pensar nisso."
 funeral.1010.t:0 "Bens Funerários"
 funeral.1020.a:0 "Todos devem saber do meu verdadeiro direito!"
 funeral.1020.b:0 "Agora não é o momento."
 funeral.1020.c:0 "[deceased.GetFirstNameNoTooltip] ia querer que eu apoiasse [host.GetSheHe]."
 funeral.1020.desc:0 "Enlutados cercam [host.GetName], oferecendo suas cortesias e votos ao chamado '[host.GetTitleAsNameNoTooltip|U]'. Nenhum deles me concede a mesma cortesia, apesar de meu status evidente.\n\nSerá que [deceased.GetName] realmente teria desejado que [host.GetFirstNameNoTooltip] fosse seu/sua sucessor(a)?"
 funeral.1020.t:0 "[Select_CString( host.IsFemale, 'A', 'O' )] [host.GetTitleAsNameNoTooltip|U] Fals[Select_CString( host.IsFemale, 'a', 'o' )]"
 funeral.1021.a.toast:0 "Você foi removido do funeral"
 funeral.1021.a:0 "\"Saia daqui!\""
 funeral.1021.b.toast:0 "Seu acesso de raiva foi ignorado"
 funeral.1021.b:0 "\"Eu não me importo.\""
 funeral.1021.desc:0 "Observo [deceased.GetName] em quieta contemplação, interrompido apenas pelo ocasional bem-querente oferecendo suas condolências.\n\n\"[ROOT.Char.Custom2('InsultNoun', SCOPE.sC('claimant'))|U]! [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('claimant'))|U]! [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('claimant'))|U]! Você ousa chamar-se [ROOT.Char.GetTitleAsNameNoTooltip|U]?\" [claimant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me aponta com o dedo furioso, a poucos centímetros do meu rosto. \"[deceased.GetNameNoTooltip|U] queria que #EMP eu#! liderasse em seu lugar! Vilã[Select_CString( ROOT.Char.IsFemale, '', 'o' )]!\""
 funeral.1021.t:0 "$funeral.1020.t$"
 funeral.1030.a:0 "\"Venha então, esteja ao meu lado no luto.\""
 funeral.1030.b:0 "\"Remova-se de seu mestre imóvel!\""
 funeral.1030.c:0 "Lamente o seu nariz, pois ele encontrará minha bota!"
 funeral.1030.desc:0 "Eu assisti enquanto muitos vão e vêm, cumprindo sua obrigação ociosa. No entanto, um visitante permanece igualmente imóvel ao lado [Select_CString( deceased.IsFemale, 'da perdida', 'do perdido' )] [deceased.GetFirstName].\n\nPor horas permanece ali, como se estivesse destinado a ficar lá para sempre, o leal cão [Select_CString( deceased.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', deceased)] geme e lamenta pel[Select_CString( deceased.IsFemale, 'a', 'o' )] [deceased.GetWomanMan] que [ROOT.Char.GetFaith.HighGodName] havia nomeado como seu mestre. Fica e espera, sem fazer nada além disso, e sem interrupção de minha parte, ele pode seguir o corpo na passagem para o além."
 funeral.1030.t:0 "Se Demorar Uma Eternidade"
 funeral.1040.a:0 "Um milagre diante dos meus olhos."
 funeral.1040.b.failure:0 "Sua defesa é ignorada"
 funeral.1040.b.success:0 "Sua defesa vai bem"
 funeral.1040.b:0 "Devo agir como o advogado de [ROOT.Char.GetFaith.DevilName]."
 funeral.1040.c:0 "O mesmo acontecerá comigo, sem dúvida."
 funeral.1040.desc:0 "O corpo [Select_CString( deceased.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', deceased)] perdido agora está sem vida há dias, ainda assim, seus olhos ainda contêm vida, o olhar do divino. [ROOT.Char.GetFaith.HighGodName|U] mantém o corpo longe dos estragos da podridão e da decomposição, como se mantendo n[deceased.GetSheHe] num sonho entre vivos e mortos.\n\nA multidão clamorosa declarou este corpo incorruptível, escolhido para ser elevado a [GetTrait('saint').GetName( deceased )]."
 funeral.1040.t:0 "Incorruptível"
 funeral.1050.a:0 "Um tempo para oração silenciosa."
 funeral.1050.b:0 "Permitir-me um momento de pesar."
 funeral.1050.c:0 "Deixar tudo sair."
 funeral.1050.d:0 "Prometo ser um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip|U] melhor."
 funeral.1050.desc:0 "De todas as figuras veneradas e vilãs, nenhuma foi desejada mais do que nosso falecido [deceased.GetName]. Com a multidão de chorões e curiosos encontrando outros assuntos para satisfazer sua fascinação, estou finalmente deixado com um momento de sol entre mim e [Select_CString( deceased.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', deceased)]."
 funeral.1050.t:0 "Nosso Momento no Tempo"
 funeral.1050.witch:0 "Vou pegar um pouco de cabelo."
 funeral.1060.a.failure:0 "Você se faz de bobo"
 funeral.1060.a.success:0 "Todos os olhos se voltam para você"
 funeral.1060.a:0 "Os olhos devem se voltar apenas para mim."
 funeral.1060.b:0 "Só posso lamentar à minha maneira."
 funeral.1060.c:0 "Ofereço conforto."
 funeral.1060.desc:0 "Todos os olhos se voltam para [other_mourner.GetName] enquanto [other_mourner.GetSheHe] cai no chão em lamentação, as mãos cobrindo os olhos avermelhados [other_mourner.GetHerHim]. Os suspiros e soluços dolorosos de [other_mourner.GetNameNoTooltip] deixaram os outros enlutados sem fôlego, e muitos oferecem conforto e reverência a [other_mourner.GetSheHe], como se fosse [other_mourner.GetSheHe] quem estivesse prestes a ser comemorado no além."
 funeral.1060.t:0 "Estrela do Luto"
 funeral.1070.a:0 "Por que todos estão tão tristes?"
 funeral.1070.b:0 "Devo apenas seguir o que os outros fazem..."
 funeral.1070.desc:0 "Morte. Ao meu redor, fala-se de morte, [ROOT.Char.GetFaith.PositiveAfterLife] e [ROOT.Char.GetFaith.NegativeAfterLife]. Isso ecoa em minha mente, pensamentos do rosto de [deceased.GetFirstName], nunca mais o vendo, e ainda assim a morte e seu significado escapam do meu entendimento como areia entre os dedos abertos.\n\nEste destino, cruel ou bondoso, deixa até mesmo os adultos mais estoicos encharcados de lágrimas, seja em silêncio ou em lamentos abertos. O que é, então? Talvez [other_mourner.GetName] me dê as respostas simples."
 funeral.1070.t:0 "O que é a Morte?"
 funeral.1071.a.failure.child:0 "Você percebe sua própria mortalidade"
 funeral.1071.a.failure:0 "A criança fica traumatizada"
 funeral.1071.a.success.child:0 "Você é confortado pelos pensamentos do além"
 funeral.1071.a.success:0 "A criança é confortada"
 funeral.1071.a.tt:0 "[other_mourner.GetFirstName] oferece conforto a você."
 funeral.1071.a:0 "\"Não se preocupe, criança.\""
 funeral.1071.b.reincarnation:0 "\"[deceased.GetSheHe|U] continua em sua jornada de reencarnação.\""
 funeral.1071.b.taoism:0 "\"[deceased.GetSheHe|U] agora retorna ao universo.\""
 funeral.1071.b:0 "\"[deceased.GetSheHe|U] está no [ROOT.Char.GetFaith.PositiveAfterLife] agora.\""
 funeral.1071.desc:0 "Sinto uma calma tranquila me envolver, olhando ao redor da sala de enlutados. Alguns olhos estão manchados de vermelho, outros veriam isso como qualquer outra causa para um encontro. No entanto, uma alma olha para mim com incerteza enquanto [confused_child.GetSheHe] puxa minha manga.\n\n[confused_child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] não chora abertamente, mas não parece impassível como muitas outras crianças presentes. \"[ROOT.Char.GetNameNoTooltip], o que aconteceu com [deceased.GetFirstName]? Por que todo mundo está triste?\""
 funeral.1071.t:0 "Juventude Mortal"
 funeral.1080.a:0 "\"Meus sentimentos exatamente.\""
 funeral.1080.b:0 "\"Agora, lembre-se. Não devemos permitir que o luto nos domine.\""
 funeral.1080.c.failure:0 "[other_mourner.GetSheHe|U] é insultad[Select_CString( other_mourner.IsFemale, 'a', 'o' )]"
 funeral.1080.c.success:0 "[other_mourner.GetSheHe|U] é confortad[Select_CString( other_mourner.IsFemale, 'a', 'o' )]"
 funeral.1080.c:0 "\"Enquanto houver vida, sempre haverá esperança.\""
 funeral.1080.d:0 "Acene silenciosamente."
 funeral.1080.desc:0 "Curvado ao meu lado, desprovido da pretensão de propriedade, [Select_CString( other_mourner.IsFemale, 'a', 'o' )] inconsolável [other_mourner.GetFirstName] olha para o nada diante [other_mourner.GetHerHim]. Nenhuma lágrima cai de seus olhos, nenhuma palavra passa por sua boca, até que [other_mourner.GetSheHe] se vira para mim.\n\n\"[other_mourner.GetFaith.HighGodName|U] pode ser cruel de fato. Por que o vento ainda sopra? Por que o mar continua seu empurrão para a costa? Por que meu corpo anseia por comida e sede por água? [other_mourner.Custom('apocalypse_name')|U] está sobre nós, [Select_CString( deceased.IsFemale, 'minha', 'meu' )] [other_mourner.Custom2('RelationToMeShort',deceased)] está mort[Select_CString( deceased.IsFemale, 'a', 'o' )].\""
 funeral.1080.t:0 "O Luto d[Select_CString( deceased.IsFemale, 'a', 'o' )] [other_mourner.Custom2('RelationToMeShort', deceased)|U]"
 funeral.1090.a:0 "Todos ouvirão meu lamento."
 funeral.1090.b:0 "Uma reverência silenciosa, e eu me afasto."
 funeral.1090.c:0 "\"Eu venci, no final.\""
 funeral.1090.d.failure:0 "Você se fez de bobo"
 funeral.1090.d.success:0 "A multidão é comovida"
 funeral.1090.d:0 "Faça um discurso prometendo dar continuidade à vontade [deceased.GetHerHim]."
 funeral.1090.desc:0 "A fila triste segue em frente, a fila para ter um último momento com [deceased.GetName]. Um último sussurro, um último adeus longo, um último nada no último lugar onde alguém verá [deceased.GetSheHe] novamente. Verdadeiramente, um privilégio estar aqui.\n\nA fila me aproxima cada vez mais até que, finalmente, a figura à minha frente se afasta, e não há nada além de um véu entre mim e [deceased.GetSheHe]."
 funeral.1090.e:0 "Fale das virtudes [deceased.GetHerHim]."
 funeral.1090.t:0 "A Última Chance"
 funeral.1100.a.failure:0 "Seu comentário causa grande insulto"
 funeral.1100.a.success:0 "A multidão é comovida"
 funeral.1100.a:0 "\"Grande de fato, e eu serei ainda maior.\""
 funeral.1100.b:0 "\"Para [deceased.GetNameNoTooltip]!\""
 funeral.1100.c:0 "\"Nos diga o que [deceased.GetSheHe] realmente significava para você.\""
 funeral.1100.d:0 "Faça uma oração silenciosa."
 funeral.1100.desc:0 "Diante de mim, uma mesa farta repleta de todo tipo de comida e bebida, como se [deceased.GetName] estivesse tentando oferecer um último ato de magnanimidade antes de partir.\n\n[other_mourner.GetName|U] até agora se recusou a tocar neste banquete, girando seu cálice em consolo ocioso. O olhar de sua distância média recai cansadamente sobre mim, e com um aceno silencioso, [other_mourner.GetSheHe] ergue sua bebida alto.\n\n\"Para [deceased.GetNameNoTooltip], verdadeiramente [Select_CString( deceased.IsFemale, 'uma das', 'um dos' )] grandes.\""
 funeral.1100.t:0 "Um dos Grandes"
 funeral.1110.a:0 "Isso parece... bom."
 funeral.1110.desc:0 "As sombras dos enlutados não pairam mais sobre mim e, finalmente, me é concedido um momento sozinho. Que conforto silencioso eu poderia encontrar em tal momento, sem o tilintar e tagarelice dos outros convidados em meus ouvidos. Apenas eu e meus pensamentos sobre [deceased.GetName]."
 funeral.1110.t:0 "Um Tempo para Lamentar"
 funeral.1120.a:0 "Junte-se à oferta."
 funeral.1120.aniconist:0 "\"Seu tolo idólatra!\""
 funeral.1120.b:0 "Uma rodada de bebidas para todos!"
 funeral.1120.c:0 "Vou lembrar [deceased.GetHerHim] do meu jeito."
 funeral.1120.desc:0 "Eu e os outros enlutados fazemos uma pausa em nosso luto para desfrutar de uma grande fartura de comida. [other_mourner.GetName|U], geralmente o coração de qualquer festa, agora se senta à minha frente com os olhos marejados e um copo intocado ao lado [other_mourner.GetHerHim].\n\n\"Como podemos nos empanturrar e alegrar em tempos como estes? Devemos nos divertir enquanto [deceased.GetFirstName] não tem nada? Juntem-se a mim! Esvaziem seus copos em oferenda!\"\n\nOs convidados parecem concordar; há sabedoria no lamentável desabafo de [other_mourner.GetFirstNamePossessiveNoTooltip]."
 funeral.1120.t:0 "A Oferta de Libações"
 funeral.1130.a:0 "Quero que o mundo saiba como é sentir isso."
 funeral.1130.b:0 "Devo permanecer forte."
 funeral.1130.desc.bewailment:0 "O quarto está denso com os lamentos dos enlutados em uma cacofonia de miséria, e eu me sento no meio de tudo isso, meus ouvidos zunindo e minha alma doendo."
 funeral.1130.desc.intro:0 "Os enlutados movem-se pelo salão chorando em uma espécie de dança macabra, tudo para [deceased.GetName]."
 funeral.1130.desc.outro:0 "\n\nEu me levanto e permito-me perder-me na dança com meus colegas enlutados."
 funeral.1130.desc.stoic:0 "O silêncio inquietante de um povo contendo o que desesperadamente desejam fazer. Gritos silenciosos nunca a escapar de seus lábios, batalhas árduas contra lágrimas sendo perdidas, tão envergonhados de seu próprio luto."
 funeral.1130.t:0 "Um Momento para Lamentar"
 funeral.1140.a.failure:0 "Você falhou em salvar a vida [soulmate.GetHerHim]"
 funeral.1140.a.success:0 "Você salvou a vida [soulmate.GetHerHim]"
 funeral.1140.a:0 "\"Isso é realmente o que [deceased.GetSheHe] teria querido?\""
 funeral.1140.b:0 "Quebre a garrafa."
 funeral.1140.c:0 "Feche silenciosamente a porta."
 funeral.1140.desc:0 "Dou uma pausa no luto em meio a todas as almas que vieram oferecer sua presença a [deceased.GetName]. Além do alcance do ruído lúgubre, ouço um uivo sobrenatural ecoando pelo vazio dos corredores.\n\nEm sua origem, encontro [soulmate.GetName] sozinho em um quarto escuro, seu choro rapidamente se tornando silencioso enquanto [soulmate.GetSheHe] me olha com olhos insensíveis. Em sua mão está uma garrafa terrível e não marcada.\n\n\"Não será muito tempo até o nosso dia do casamento.\""
 funeral.1140.t:0 "Juntos ou Não Mais"
 funeral.1150.a:0 "\"Boa viagem, querido(a) [ROOT.Char.Custom2('RelationToMeShort', deceased)].\""
 funeral.1150.b:0 "... Tenho certeza de que [deceased.GetSheHe] ficará bem de qualquer maneira."
 funeral.1150.desc:0 "Enquanto contemplo a casca mortal de [deceased.GetFirstNamePossessive], noto minha mão apertando o/a [offered_badge.GetName], meu dedo indicador traçando suavemente o metal de um lado para o outro.\n\nIsso me manteve seguro(a) até agora. Talvez faça o mesmo por [deceased.GetHerHim]?\n\nSeria o mínimo que eu poderia fazer."
 funeral.1150.t:0 "Um Presente de Despedida"
 funeral_1030_adopt_tt:0 "Você adota o cachorro de [deceased.GetFirstNameNoTooltip]."
 funeral_activity_cost_desc:0 "Custo Base"
 funeral_ceremony_bad:0 "Cerimônia Humilde"
 funeral_ceremony_bad_desc:0 "$EFFECT_LIST_BULLET$ Ganho menor de [piety|E]\n$EFFECT_LIST_BULLET$ Ganho menor de [legitimacy|E]\n$EFFECT_LIST_BULLET$ Perda menor de [stress|E]\n\n#weak A morte não é um momento para exageros e pompa, é um momento para reunir e oferecer nossos humildes respeitos.#!"
 funeral_ceremony_good:0 "Cerimônias Extravagantes"
 funeral_ceremony_good_desc:0 "$EFFECT_LIST_BULLET$ Grande ganho de [piety|E]\n$EFFECT_LIST_BULLET$ Grande ganho de [legitimacy|E]\n$EFFECT_LIST_BULLET$ Grande perda de [stress|E]\n\n#weak A morte chegou a uma grande pessoa do reino, eles não merecem tudo o que podemos oferecer? Não se poupará despesas para a cerimônia fúnebre e todos saberão da grande tragédia que atingiu o reino.#!"
 funeral_ceremony_normal:0 "Cerimônias Dignas"
 funeral_ceremony_normal_desc:0 "$EFFECT_LIST_BULLET$ ganho de [piety|E]\n$EFFECT_LIST_BULLET$ ganho de [legitimacy|E]\n$EFFECT_LIST_BULLET$ perda de [stress|E]\n\n#weak A morte chegou a estes salões, e agora é hora de realizar uma cerimônia extravagante para o falecido.#!"
