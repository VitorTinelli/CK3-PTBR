 wakedesc_bathing:0 "Os enlutados se reúnem para lavar o corpo do falecido e envolvê-lo completamente em tecidos."
 wakedesc_mummification:0 "Os enlutados se reúnem com expectativa enquanto o corpo é embalsamado e mumificado, para ser preservado para a eternidade."
 wakedesc_offering_of_libations:0 "É hora de oferecer nossa comida e água aos mortos. O corpo será lavado e embalsamado para os enlutados nos próximos dias."
 wakedesc_sky_burial:0 "Este não é o momento para explosões de emoção, mas um momento para um luto sombrio e suave. Esta é a oportunidade para os convidados oferecerem conforto à família enlutada."
 wakedesc_wake:0 "Este é o momento de vigiar o corpo do falecido, oferecendo uma última oportunidade de expressar pensamentos e sentimentos aos mortos antes que sejam conduzidos para a vida após a morte."
