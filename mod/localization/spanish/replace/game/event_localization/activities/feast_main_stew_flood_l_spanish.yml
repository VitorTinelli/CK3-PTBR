l_spanish:
 feast_main_stew_flood.0002.a:0 "Nunca vi tanto ensopado na vida."
 feast_main_stew_flood.0002.every_target:0 "\nCedendo à sua fome insaciável, [stew_sea_glutton.GetTitledFirstName] caiu no chão, engolindo o máximo que podia da bagunça carnuda enquanto [Select_CString( stew_sea_horrified_character.IsFemale, 'a', 'o' )] [stew_sea_horrified_character.GetTitledFirstName] observava horrorizado."
 feast_main_stew_flood.0002.only_glutton:0 "\n\nCedendo à sua fome insaciável, [stew_sea_glutton.GetTitledFirstName] caiu no chão, engolindo o máximo que podia da bagunça carnuda."
 feast_main_stew_flood.0002.only_horror:0 "\n\n[stew_sea_horrified_character.GetTitledFirstName] ficou paralisado no meio de tudo aquilo, chocado e horrorizado com o desperdício decadente."
 feast_main_stew_flood.0002.someone_got_covered:0 "\n\n[Select_CString( stew_sea_gets_covered.IsFemale, 'A', 'O' )] [stew_sea_gets_covered.GetTitledFirstName] [stew_sea_gets_covered.Custom('stew_flood_covered_adjective')] foi pego pela onda que avançava e praguejou alto ao ver sua aparência arruinada enquanto a gordura escorria por seu rosto."
 feast_main_stew_flood.0002.splash_desc_standard:0 "\n\nOs convidados correram para o outro lado do salão enquanto a massa espessa espalhava tentáculos gordurosos entre os pés apressados."
 feast_main_stew_flood.0002.stew_introduction:0 "Na agitação da festa, um dos serviçais [Select_CString( activity.GetOwner.IsFemale, 'da', 'do' )] [activity.GetOwner.GetTitledFirstName] acidentalmente desprendeu a enorme caldeira que pendia sobre a lareira no meio do salão de festas! O caldo saboroso jorrou, cobrindo metade do ambiente em um mar de ensopado!"
 feast_main_stew_flood.0002.stew_introduction_blame:0 "Em um tropeço bêbado, [Select_CString( stew_sea_blamed.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('stew_sea_blamed'))], [stew_sea_blamed.GetTitledFirstName], desprendeu a enorme caldeira pendurada sobre a lareira no meio do salão de festas! O caldo saboroso jorrou, cobrindo o chão em um mar de ensopado!"
 feast_main_stew_flood.0002.stew_introduction_blamed:0 "Eu já tinha bebido um pouco demais quando tropecei na enorme caldeira pendurada sobre a lareira no salão de festas. Ela se soltou e o caldo saboroso jorrou, cobrindo o chão em um mar de ensopado!"
 feast_main_stew_flood.0002.t:0 "O Mar de Ensopado"
 feast_main_stew_flood.0003.a:0 "Maldição, que bagunça!"
 feast_main_stew_flood.0003.every_target:0 "\n\nRendendo-se à sua fome insaciável, [stew_sea_glutton.GetTitledFirstName] caiu no chão, engolindo o máximo que podia da confusão carnuda, enquanto [Select_CString( stew_sea_horrified_character.IsFemale, 'a', 'o' )] [stew_sea_horrified_character.GetTitledFirstName] assistia horrorizado."
 feast_main_stew_flood.0003.only_glutton:0 "\n\nRendendo-se à sua fome insaciável, [stew_sea_glutton.GetTitledFirstName] caiu no chão, engolindo o máximo que podia da confusão carnuda."
 feast_main_stew_flood.0003.only_horror:0 "\n\n[stew_sea_horrified_character.GetTitledFirstName] ficou parado, catatônico no meio de tudo aquilo, chocado e horrorizado com o desperdício decadente."
 feast_main_stew_flood.0003.someone_got_covered:0 "\n\n[Select_CString( stew_sea_gets_covered.IsFemale, 'A', 'O' )] [stew_sea_gets_covered.GetTitledFirstName] [stew_sea_gets_covered.Custom('stew_flood_covered_adjective')], sentado ao lado da caldeira, foi atingido pela onda que avançava e praguejou em voz alta por sua aparência arruinada enquanto a gordura escorria pelo rosto dele."
 feast_main_stew_flood.0003.splash_desc_standard:0 "Os convidados correram para o outro lado do salão enquanto a massa espessa espalhava tentáculos gordurosos entre os pés que saltavam."
 feast_main_stew_flood.0003.stew_introduction:0 "Na agitação da festa, um idiota de um servo conseguiu soltar a enorme caldeira que pendia sobre a lareira no salão de festas! O caldo saboroso jorrou, cobrindo metade do chão em um mar de ensopado!"
 feast_main_stew_flood.0003.stew_introduction_blame:0 "Em um tropeção embriagado, [stew_sea_blamed.GetTitledFirstName] soltou uma enorme caldeira pendurada sobre a lareira no meio do salão de festas! O caldo saboroso jorrou, cobrindo metade do ambiente em um mar de ensopado!"
 feast_main_stew_flood.0003.t:0 "O Mar de Ensopado"
 feast_main_stew_flood.0004.a:0 "Por que isso aconteceria comigo?!"
 feast_main_stew_flood.0004.getting_covered:0 "\nEu estava sentado muito perto, e a refeição gordurosa me cobriu como uma onda feita nas profundezas do [ROOT.Char.GetFaith.NegativeAfterLife]. Minhas roupas podem ser limpas, mas a vergonha dolorosa de um salão cheio de risadas nunca sairá."
 feast_main_stew_flood.0004.stew_introduction:0 "Na agitação da festa, um dos servos [Select_CString( activity.GetOwner.IsFemale, 'da', 'do' )] [activity.GetOwner.GetTitledFirstName] acidentalmente soltou a enorme caldeira que pendia sobre a lareira no meio do salão de festas! O caldo saboroso jorrou, cobrindo metade do ambiente em um mar de ensopado!"
 feast_main_stew_flood.0004.stew_introduction_blame:0 "Em um tropeção embriagado, [stew_sea_blamed.GetTitledFirstName] soltou uma enorme caldeira pendurada sobre a lareira no meio do salão de festas! O caldo saboroso jorrou, cobrindo metade do chão em um mar de ensopado!"
 feast_main_stew_flood.0004.t:0 "Mar de Ensopado"
 feast_main_stew_flood.0005.a:0 "Estava simplesmente bom demais!"
 feast_main_stew_flood.0005.being_watched:0 "\nDurante tudo isso, eu estava vagamente ciente [Select_CString( activity.GetOwner.IsFemale, 'da', 'do' )] [stew_sea_horrified_character.GetTitledFirstName] me observando com o rosto torcido de nojo."
 feast_main_stew_flood.0005.cannot_resist:0 "\nCom toda aquela comida deliciosa derramando por todos os lados, eu simplesmente não pude resistir. Antes que eu soubesse o que estava acontecendo, eu estava de quatro, lambendo o ensopado como um cachorro comum! Nem sequer estava pensando no que os outros convidados pensariam, quanto menos no anfitrião!"
 feast_main_stew_flood.0005.stew_introduction:0 "Na agitação da festa, um dos servos [Select_CString( activity.GetOwner.IsFemale, 'da', 'do' )] [activity.GetOwner.GetTitledFirstName] soltou acidentalmente a enorme caldeira que pendia sobre a lareira no meio do salão de festas! O caldo saboroso jorrou, cobrindo metade do ambiente em um mar de ensopado!"
 feast_main_stew_flood.0005.stew_introduction_blame:0 "Em um tropeção embriagado, [stew_sea_blamed.GetTitledFirstName] soltou uma enorme caldeira pendurada sobre a lareira no meio do salão de festas! O caldo saboroso jorrou, cobrindo metade do chão em um mar de ensopado!"
 feast_main_stew_flood.0005.t:0 "Mar de Ensopado"
 feast_main_stew_flood.0006.a:0 "Preciso desviar o olhar."
 feast_main_stew_flood.0006.shocking_experience:0 "Foi tudo demais, ver a quantidade imensa de comida que seria servida aos convidados, piorado pelo fato de que agora estava sendo desperdiçada."
 feast_main_stew_flood.0006.stew_introduction:0 "Na agitação da festa, um dos servos [Select_CString( activity.GetOwner.IsFemale, 'da', 'do' )] [activity.GetOwner.GetTitledFirstName] soltou acidentalmente a enorme caldeira que pendia sobre a lareira no meio do salão de festas! O caldo saboroso jorrou, cobrindo metade do ambiente em um mar de ensopado!"
 feast_main_stew_flood.0006.stew_introduction_blame:0 "Em um tropeção embriagado, [stew_sea_blamed.GetTitledFirstName] soltou uma enorme caldeira pendurada sobre a lareira no meio do salão de festas! O caldo saboroso jorrou, cobrindo metade do chão em um mar de ensopado!"
 feast_main_stew_flood.0006.t:0 "Mar de Ensopado"
 feast_main_stew_flood.0041.a:0 "Que boa festa."
 feast_main_stew_flood.0041.blame_placed:0 "Todos nós sorrimos satisfeitos, nosso anfitrião tem motivos para se orgulhar. Embora [Select_CString( stew_sea_blamed.IsFemale, 'a', 'o' )] [stew_sea_blamed.GetTitledFirstName] possa carregar mais vergonha do que satisfação depois de derrubar a caldeira!"
 feast_main_stew_flood.0041.no_blame_placed:0 "Todos nós sorrimos satisfeitos, deixando nosso anfitrião com motivos para se orgulhar. Exceto pelo servo que derrubou a caldeira de ensopado. Aquilo foi um momento bastante vergonhoso."
 feast_main_stew_flood.0041.t:0 "Barriga Cheia"
 feast_main_stew_flood.0042.a:0 "Deveríamos fazer isso com mais frequência!"
 feast_main_stew_flood.0042.blame_placed:0 "Todos os meus convidados sorriem satisfeitos em seus pratos quando olho para eles, orgulhoso da minha demonstração de generosidade. Dito isso, [stew_sea_blamed.GetTitledFirstName] pode carregar mais vergonha do que satisfação depois de derrubar a caldeira! Limpar isso não será barato."
 feast_main_stew_flood.0042.no_blame_placed:0 "Todos os meus convidados sorriem satisfeitos em seus pratos quando olho para eles, orgulhoso da minha demonstração de generosidade. Dito isso, talvez eu precise fazer algo em relação a esse maldito servo que derrubou a caldeira de ensopado. E a limpeza não será barata."
 feast_main_stew_flood.0042.t:0 "Barrigas Cheias"
 feast_main_stew_flood.0043.a:0 "Nunca mais comerei ensopado."
 feast_main_stew_flood.0043.blame_placed:0 "A festa logo terminará, e poderei cuidar da minha vergonha.\nAquele maldito ensopado de carne foi para todos os lugares, e não tenho certeza se conseguirei tirar o cheiro do meu cabelo! Levará muito tempo antes que eu esqueça o que [Select_CString( stew_sea_blamed.IsFemale, 'a', 'o' )] [stew_sea_blamed.GetTitledFirstName] fez comigo."
 feast_main_stew_flood.0043.no_blame_placed:0 "A festa logo terminará, e poderei cuidar da minha vergonha.\nAquele maldito ensopado de carne foi para todos os lugares, e não tenho certeza se conseguirei tirar o cheiro do meu cabelo! Levará muito tempo antes que eu esqueça o que aquele servo fez comigo."
 feast_main_stew_flood.0044.a:0 "Espero que as pessoas estivessem tão bêbadas a ponto de não se lembrarem."
 feast_main_stew_flood.0044.desc:0 "A festa logo terminará, após ter o cheiro de ensopado pairando sobre ela como um espectro. Não consigo acreditar que seria o azarado, e simplesmente... desejo que isso não tivesse acontecido!"
 feast_stew_flood_log:0 "[TARGET_CHARACTER.GetTitledFirstName] ficou coberto de ensopado quente após um incidente de derramamento gigante."
 feast_stew_flood_log_title:0 "Inundação de Ensopado"
 stew_flood_covered_adjective_beautiful:0 "bonito"
 stew_flood_covered_adjective_proud:0 "orgulhoso"
 stew_flood_covered_adjective_wrathful:0 "irritado"
 stew_flood_fallback_adjective:0 "incauto"
