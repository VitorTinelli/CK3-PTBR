 activity_feast_desc:0 "Fortaleça os laços de lealdade convidando vassalos e vizinhos para seus salões para comer, beber e se divertir!\n\nBanquetes realizados no momento certo manterão seu reino estável ao agradar súditos e forjar amizades."
 activity_feast_destination_selection:0 "O condado escolhido receberá o modificador [GetModifier('feast_recent_fest_modifier').GetNameWithTooltip|L] pelos próximos 5 anos."
 activity_feast_guest_help_text:0 "Quaisquer [activity_guests|E] terão a oportunidade de interagir com outros participantes e aumentar sua [opinion|E].\n\nOs banquetes também são a ocasião perfeita para relaxar e reduzir [stress|E]."
 activity_feast_host_desc:0 "$BULLET_WITH_TAB$Pode ganhar [opinion|E] de [vassal|E] [GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName]\n$BULLET_WITH_TAB$Pode ganhar [prestige_i][prestige|E]\n$BULLET_WITH_TAB$Pode ganhar [legitimacy_i] [legitimacy|E]\n$BULLET_WITH_TAB$Os participantes podem ganhar [opinion|E] dos personagens presentes\n$BULLET_WITH_TAB$Os participantes podem perder [stress_loss_i][stress|E]\n$BULLET_WITH_TAB$Os participantes podem ganhar o [trait|E] [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )]\n[SelectLocalization( HasDlcFeature( 'royal_court' ), 'activity_feast_amenity_effect', 'blank_line' )]"
 activity_feast_magnificence_greagarious_desc:0 "Você é um [GetTrait('lifestyle_reveler').GetName(GetNullCharacter)] lendário"
