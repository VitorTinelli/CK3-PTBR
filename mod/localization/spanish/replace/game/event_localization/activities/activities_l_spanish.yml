 activity_hunt:0 "Caçada"
 activity_hunt_desc:0 "[GetPlayer.Custom('GetHuntDesc')|U]"
 activity_hunt_desc_adventurer:0 "A caça oferece emoções e perigos em abundância, e serve para fornecer uma base sólida em equitação e tiro com arco.\n\nComo um [GetGovernment('landless_adventurer_government').GetName], caçar concede menos [prestige_i][prestige|E], mas fornece [provisions_i][provisions|E]. As caçadas são supervisionadas pelo [GetCourtPositionType('huntperson_camp_officer').GetName()].\n\nNo início de uma caçada, você terá a oportunidade de comprar direitos de caça por [gold_i][gold|E], caso contrário, você receberá [trait_level_track_xp|E] [GetTrait('gallowsbait').GetName( GetNullCharacter )] [GetTrait( 'gallowsbait' ).GetTraitTrackByKey( 'poacher' ).GetName]."
 activity_hunt_desc_regular:0 "A caça oferece emoções e perigos em abundância, e serve para fornecer uma base sólida em equitação e tiro com arco.\n\nAs caçadas são supervisionadas pelo [GetCourtPositionType('master_of_hunt_court_position').GetName()], que anunciará [hunt_sightings_no_prefix|E] de bestas comuns, raras e ferozes."
