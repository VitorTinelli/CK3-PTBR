 activity_gruesome_festival:0 "$tenet_gruesome_festivals_blot_name$"
 activity_gruesome_festival_desc.non_gf_practioner:0 "Há entre meus súditos aqueles que praticam ritos sacrificiais grandiosos abençoados [Select_CString( GetPlayer.IsFemale, 'pela sua', 'pelo seu' )] [GetPlayer.GetTitleAsNameNoTooltip]. Concordar em realizar uma variante mesmo que limitada certamente conquistaria sua aprovação, embora abraçar seus costumes mais... bárbaros possa me render desprezo daqueles que desdenham de seus caminhos."
 activity_gruesome_festival_desc:0 "É hora de todo o [GetPlayer.GetPrimaryTitle.GetNameNoTierNoTooltip] se reunir para fazer sacrifícios a [GetPlayer.GetFaith.PantheonTerm]. Esses rituais não apenas unem os fiéis, mas também confirmam meu lugar como [Select_CString( GetPlayer.IsFemale, 'a', 'o' )] [GetPlayer.GetTitleAsNameNoTooltip] de toda a terra."
 activity_gruesome_festival_fallback_name:0 "Sacrifício Ritual"
 activity_gruesome_festival_guest_help_text:0 "Os [guests|E] participarão do sacrifício e do banquete subsequente. Eles ganharão ou perderão [opinion|E] de você, dependendo dos [core_tenets|E] de sua [faith|E]."
 activity_gruesome_festival_host_desc:0 "\nVocê organiza um $gruesomefestivalname_blot$, que envolve:\n#indent_newline:0 $EFFECT_LIST_BULLET$ Decidir a escala do festival\n#indent_newline:0 $EFFECT_LIST_BULLET$ Selecionar o que sacrificar, até mesmo escolhendo um de seus [prisoners|E] como [designate_chief_sacrifice_chief_sacrifice|E]\n#indent_newline:0 $EFFECT_LIST_BULLET$ Ganhar ou perder [opinion|E] de [character|E] e [county_opinion|E] dependendo dos [core_tenets|E] da fé de seus súditos"
 activity_gruesome_festival_owner:0 "Anfitrião"
