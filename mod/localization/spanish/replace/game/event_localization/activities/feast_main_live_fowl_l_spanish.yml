l_spanish:
 feast_live_fowl_log:0 "[TARGET_CHARACTER.GetTitledFirstName] foi atacado por um pássaro durante o jantar."
 feast_live_fowl_log_title:0 "Ataque de Pássaro"
 feast_main_live_fowl.0002.a:0 "Que confusão!"
 feast_main_live_fowl.0002.bird_chased_away:0 "\n\nEnquanto o [ROOT.GetCharacter.Custom('exotic_fowl_type')] corria solto, uma multidão de criados tentava impedir que ele derrubasse outros pratos. A melhor diversão veio na forma do cozinheiro correndo atrás dele com sua concha, o que finalmente fez a ave sair pelas grandes portas do salão, onde escapou para a noite."
 feast_main_live_fowl.0002.bird_chased_by_character:0 "\n\nEnquanto a ave corria solta, [fowl_bird_chaser.GetTitledFirstName] se levantou para enfrentar o desafio. Foi uma grande diversão ver [fowl_bird_chaser.GetSheHe] perseguindo desesperadamente a criatura enlouquecida através das mesas. No final, [fowl_bird_chaser.GetSheHe] conseguiu assustar o [ROOT.GetCharacter.Custom('exotic_fowl_type')] em direção às grandes portas do salão, onde escapou para o ar fresco, entre as estrelas claras."
 feast_main_live_fowl.0002.bird_killed:0 "\n\nA fuga da [ROOT.GetCharacter.Custom('exotic_fowl_type')] terminou em breve, quando [Select_CString( fowl_bird_killer.IsFemale, 'a', 'o' )] [fowl_bird_killer.GetTitledFirstName] se levantou de sua cadeira e, com eficiência fria, agarrou-a pelo pescoço. Com um giro de suas mãos, um estalo alto fez com que todo o salão caísse em silêncio. O silêncio foi interrompido pelos gemidos de dor [Select_CString( fowl_dinner_target.IsFemale, 'da', 'do' )] [fowl_dinner_target.GetFirstName] enquanto [fowl_dinner_target.GetSheHe] segurava o nariz ensanguentado."
 feast_main_live_fowl.0002.entremets_served:0 "Os criados servem sobremesas impressionantemente adornados: diversos [ROOT.GetCharacter.Custom('exotic_fowl_type')], sem pele, cozidos e recheados, depois vestidos novamente com suas magníficas plumagens. No entanto, quando [Select_CString( fowl_dinner_target.IsFemale, 'a', 'o' )] [fowl_dinner_target.GetTitledFirstName] aproximou sua faca de um deles, a ave despertou com um grito! Essa não estava cozida! Ela bicou o nariz [Select_CString( fowl_dinner_target.IsFemale, 'da', 'do' )] [fowl_dinner_target.GetFirstName] antes de sair em disparada entre os convidados gritando e rindo."
 feast_main_live_fowl.0002.t:0 "Aviário de [fowl_dinner_target.GetFirstName]"
 feast_main_live_fowl.0003.a:0 "Ah, nenhum banquete está completo sem uma brincadeira."
 feast_main_live_fowl.0003.bird_chased_away:0 "Conforme a [ROOT.GetCharacter.Custom('exotic_fowl_type')] corria solta, uma multidão de criados tentava impedi-la de derrubar outros pratos e arruinar a refeição. O melhor entretenimento veio na forma do cozinheiro correndo atrás dela com sua concha, o que finalmente fez a ave sair pelas portas do grande salão, onde ela escapou para a noite."
 feast_main_live_fowl.0003.bird_chased_by_character:0 "\n\nEnquanto a ave corria solta, [fowl_bird_chaser.GetTitledFirstName] aceitou o desafio. Foi um grande entretenimento ver [fowl_bird_chaser.GetSheHe] perseguir desesperadamente a criatura ensandecida pelas mesas. No final, [fowl_bird_chaser.GetSheHe] conseguiu assustar a [ROOT.GetCharacter.Custom('exotic_fowl_type')] em direção às portas do grande salão, onde ela escapou para a noite."
 feast_main_live_fowl.0003.bird_killed:0 "\n\nA fuga da [ROOT.GetCharacter.Custom('exotic_fowl_type')] acabou logo em seguida, quando [Select_CString( fowl_bird_killer.IsFemale, 'a', 'o' )] [fowl_bird_killer.GetTitledFirstName] se levantou de sua cadeira e, com fria eficiência, agarrou-a pelo pescoço. Com um movimento rápido das mãos, um estalo alto fez com que todo o salão ficasse em silêncio.\n\nO silêncio foi quebrado pelos gemidos de dor [Select_CString( fowl_dinner_target.IsFemale, 'da', 'do' )] [fowl_dinner_target.GetFirstName] enquanto ele segurava o nariz sangrando."
 feast_main_live_fowl.0003.entremets_served:0 "Os criados traziam sobremesas impressionantemente adornados: várias aves [ROOT.GetCharacter.Custom('exotic_fowl_type')], depenadas, cozidas e recheadas, e depois vestidas novamente com suas plumagens magníficas. No entanto, quando [Select_CString( fowl_dinner_target.IsFemale, 'a', 'o' )] [fowl_dinner_target.GetTitledFirstName] aproximou sua faca de uma delas, a ave acordou com um grito! Essa não estava cozida de jeito nenhum! Ela bicou o nariz [Select_CString( fowl_dinner_target.IsFemale, 'da', 'do' )] [fowl_dinner_target.GetFirstName], antes de sair correndo entre os convidados gritando e rindo."
 feast_main_live_fowl.0003.t:0 "Aviário de [fowl_dinner_target.GetFirstName]"
 feast_main_live_fowl.0004.a:0 "As aves são muito mais fortes do que você pensa..."
 feast_main_live_fowl.0004.bird_chased_away:0 "\n\nConforme a [ROOT.GetCharacter.Custom('exotic_fowl_type')] corria solta, uma multidão de criados tentava impedi-la de derrubar outros pratos. O melhor entretenimento veio quando o cozinheiro a perseguia com sua concha, o que finalmente fez a ave sair pelas portas do grande salão, onde ela escapou para a noite.\nEu fiquei sentado gemendo de dor, segurando meu nariz sangrando e amaldiçoando o nome de nosso anfitrião."
 feast_main_live_fowl.0004.bird_chased_by_character:0 "\n\nEnquanto a ave corria solta, [fowl_bird_chaser.GetTitledFirstName] aceitou o desafio e perseguiu desesperadamente a criatura enlouquecida. No final, [fowl_bird_chaser.GetSheHe] conseguiu assustar a [ROOT.GetCharacter.Custom('exotic_fowl_type')] em direção às portas do grande salão, onde ela escapou.\n\nEu fiquei sentado gemendo de dor, segurando meu nariz sangrando e amaldiçoando o nome de nosso anfitrião."
 feast_main_live_fowl.0004.bird_killed:0 "\n\nA fuga da [ROOT.GetCharacter.Custom('exotic_fowl_type')] acabou logo em seguida, quando [Select_CString( fowl_bird_killer.IsFemale, 'a', 'o' )] [fowl_bird_killer.GetTitledFirstName] se levantou de sua cadeira e, com fria eficiência, agarrou-a pelo pescoço. Com um movimento rápido das mãos, um estalo alto fez com que todo o salão ficasse em silêncio.\n\nEu fiquei sentado gemendo de dor, segurando meu nariz sangrando e amaldiçoando o nome de nosso anfitrião."
 feast_main_live_fowl.0004.entremets_served:0 "Entre as refeições, os criados trazem pratos impressionantemente adornados como sobremesas, exibindo a habilidade dos cozinheiros do anfitrião. Um dos pratos orgulhosos eram várias aves [ROOT.GetCharacter.Custom('exotic_fowl_type')], depenadas, cozidas e recheadas, e depois vestidas novamente com suas plumagens magníficas.\nQuando eu aproximei minha faca, a ave acordou com um grito! Uma das aves [ROOT.GetCharacter.Custom('exotic_fowl_type')] não tinha sido cozida de jeito nenhum! Ela bicou o meu nariz antes de sair correndo entre os convidados gritando e rindo."
 feast_main_live_fowl.0004.t:0 "Aviário de [fowl_dinner_target.GetFirstName]"
 feast_main_live_fowl.0005.a:0 "Ah, a sensação de uma vida terminando em suas mãos..."
 feast_main_live_fowl.0005.bird_killed:0 "\n\nEu finalmente tive o suficiente, e quando a ave passou por perto, eu a agarrei pelo pescoço. O salão ficou em silêncio enquanto eu torcia seu pescoço até ele quebrar. A bagunça amassada de penas permaneceu no chão até o fim da refeição."
 feast_main_live_fowl.0005.entremets_served:0 "Os criados estavam apresentando sobremesas impressionantemente adornados: várias aves [ROOT.GetCharacter.Custom('exotic_fowl_type')], depenadas, cozidas e recheadas, e depois vestidas novamente com suas plumagens magníficas. No entanto, quando [Select_CString( fowl_dinner_target.IsFemale, 'a', 'o' )] [fowl_dinner_target.GetTitledFirstName] aproximou sua faca de uma delas, a ave acordou com um grito! Ela bicou o nariz [Select_CString( fowl_dinner_target.IsFemale, 'da', 'do' )] [fowl_dinner_target.GetFirstName] antes de sair correndo entre os convidados que gritavam e riam."
 feast_main_live_fowl.0005.t:0 "Aviário de [fowl_dinner_target.GetFirstName]"
 feast_main_live_fowl.0006.a:0 "Espera aí, as pessoas estão rindo de mim?"
 feast_main_live_fowl.0006.bird_chased_by_character:0 "\n\nEu aproveitei imediatamente a oportunidade para deixar uma impressão nos outros convidados. Usei meus gestos mais autoritários para comandar a ave em direção à saída. Embora ela tenha escolhido um caminho atravessando várias mesas, e embora eu talvez a tenha perseguido com um pouco de entusiasmo demais, ofereci um espetáculo impressionante. Conforme o pequeno pássaro desaparecia no ar fresco da noite, senti como se tivéssemos feito algum tipo de conexão."
 feast_main_live_fowl.0006.entremets_served:0 "Os criados estavam apresentando sobremesas impressionantemente adornados: várias aves [ROOT.GetCharacter.Custom('exotic_fowl_type')], depenadas, cozidas e recheadas, e depois vestidas novamente com suas plumagens magníficas. No entanto, quando [Select_CString( fowl_dinner_target.IsFemale, 'a', 'o' )] [fowl_dinner_target.GetTitledFirstName] aproximou sua faca de uma delas, a ave acordou com um grito! Ela bicou o nariz [Select_CString( fowl_dinner_target.IsFemale, 'da', 'do' )] [fowl_dinner_target.GetFirstName] antes de sair correndo entre os convidados que gritavam e riam."
 feast_main_live_fowl.0006.t:0 "Aviário de [fowl_dinner_target.GetFirstName]"
 feast_main_live_fowl.1001.a:0 "Isso sempre me lembrará do meu verdadeiro inimigo..."
 feast_main_live_fowl.1001.desc:0 "Maldita ave na festa! Eu pensei que a ferida que ela me deixou iria cicatrizar sem problemas, mas em vez disso deixou uma cicatriz horrível no meu rosto!"
 feast_main_live_fowl.1001.t:0 "Festa das Aves: Memórias Dolorosas"
 feast_main_live_fowl.9001.a:0 "Deveríamos fazer isso com mais frequência, [Select_CString( host_saying_goodbye.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host_saying_goodbye'))]!"
 feast_main_live_fowl.9001.bird_killer:0 "A festa [Select_CString( host_saying_goodbye.IsFemale, 'da', 'do' )] [host_saying_goodbye.GetTitledFirstName] está chegando ao fim.\n\nA maioria dos convidados parece satisfeita, exceto talvez [fowl_dinner_target.GetFirstName], que ainda segura o nariz onde a [ROOT.GetCharacter.Custom('exotic_fowl_type')] o marcou.\nParece também que ninguém deseja se sentar perto [Select_CString( fowl_bird_killer.IsFemale, 'da', 'do' )] [fowl_bird_killer.GetFirstName], após o brutal abate da ave."
 feast_main_live_fowl.9001.no_bird_killer:0 "A festa [Select_CString( host_saying_goodbye.IsFemale, 'da', 'do' )] [host_saying_goodbye.GetTitledFirstName] está chegando ao fim.\n\nA maioria dos convidados parece satisfeita, exceto talvez [fowl_dinner_target.GetFirstName], que ainda segura o nariz onde a [ROOT.GetCharacter.Custom('exotic_fowl_type')] o marcou."
 feast_main_live_fowl.9001.t:0 "O Fim de um Pássaro"
 feast_main_live_fowl.9002.a:0 "Deveríamos fazer isso com mais frequência!"
 feast_main_live_fowl.9002.bird_killer:0 "Após dias e noites de companhia alegre, minha festa está chegando ao fim!\n\nA maioria dos convidados parece satisfeita, exceto talvez [fowl_dinner_target.GetFirstName], que ainda segura o nariz onde a [ROOT.GetCharacter.Custom('exotic_fowl_type')] o marcou.\nParece também que ninguém deseja se sentar perto [Select_CString( fowl_bird_killer.IsFemale, 'da', 'do' )] [fowl_bird_killer.GetFirstName], após o brutal abate da ave."
 feast_main_live_fowl.9002.no_bird_killer:0 "Após dias e noites de companhia alegre, minha festa está chegando ao fim!\n\nA maioria dos convidados parece satisfeita, exceto talvez [fowl_dinner_target.GetFirstName], que ainda segura o nariz onde a [ROOT.GetCharacter.Custom('exotic_fowl_type')] o marcou."
 feast_main_live_fowl.9002.t:0 "O Fim de um Pássaro"
 feast_main_live_fowl.9003.a:0 "Sim, sim, em breve tudo acabará."
 feast_main_live_fowl.9003.bird_killer:0 "A festa está chegando ao fim, finalmente!\n\nTodos os outros parecem ter se divertido muito, enquanto eu tenho que cuidar da dor causada por essa maldita [ROOT.GetCharacter.Custom('exotic_fowl_type')]!\n\nSuponho que devo agradecer [Select_CString( fowl_bird_killer.IsFemale, 'a', 'ao' )] [fowl_bird_killer.GetFirstName] por se livrar tão eficientemente dessa criatura infernal. Só estou um pouco preocupado em ficar muito perto [fowl_bird_killer.GetHerHim]."
 feast_main_live_fowl.9003.no_bird_killer:0 "A festa está quase acabando, finalmente!\n\nTodos os outros parecem ter se divertido muito, enquanto eu tenho que lidar com a dor causada por essa maldita [ROOT.GetCharacter.Custom('exotic_fowl_type')]! Eu esperava um tratamento melhor [Select_CString( host_saying_goodbye.IsFemale, 'da', 'do' )] [host_saying_goodbye.GetTitledFirstName].\n\nNão importa, vou mostrar a todos eles na próxima festa!"
 feast_main_live_fowl.9004.a:0 "Esta não foi uma festa tão terrível."
 feast_main_live_fowl.9004.desc:0 "A festa [Select_CString( host_saying_goodbye.IsFemale, 'da', 'do' )] [host_saying_goodbye.GetTitledFirstName] está quase chegando ao fim. As pessoas riem até me verem e ficam de repente em silêncio. Eu sei que a imagem de eu torcendo o pescoço daquele pássaro está gravada em suas memórias. Eu sei que certamente me lembro muito bem da sensação de vida fugindo do corpo impotente.\n\nÉ bom saber que todos eles se preocupam, mesmo que seja um pouco."
 feast_main_live_fowl.9005.a:0 "Na próxima festa, estarei um pouco mais calmo."
 feast_main_live_fowl.9005.desc:0 "A festa [Select_CString( host_saying_goodbye.IsFemale, 'da', 'do' )] [host_saying_goodbye.GetTitledFirstName] está quase acabando. Parece que a maioria dos convidados se divertiu até agora, mesmo que eu deseje um pouco menos que suas lembranças sejam sobre mim correndo pelas mesas.\nPelo menos [fowl_dinner_target.GetFirstName] me agradeceu por ter afugentado o pássaro depois que ele a atacou."
 fowl_dinner_child:0 "pássaro colorido"
 fowl_dinner_peacock:0 "pavão"
