l_spanish:
 hunt_events_anna.0001.a:0 "Gravar as iniciais [Select_CString( love_interest.IsFemale, 'da', 'do' )] [love_interest.GetFirstNameNoTooltip] na casca"
 hunt_events_anna.0001.b.t_toast:0 "A caça é minha principal prioridade."
 hunt_events_anna.0001.b:0 "Não há tempo para esse tipo de bobagem!"
 hunt_events_anna.0001.desc:0 "Um grande carvalho se apresenta com sua copa majestosa, estendendo-se por toda parte — cobrindo tudo abaixo na escuridão. Olhar para seus galhos me faz lembrar das várias dinastias que vêm e vão. Todos aqueles que vieram antes de mim, e aqueles que levarão meu legado adiante quando eu me for.\n\nAo me aproximar, noto várias iniciais esculpidas em sua casca, deixando um lembrete gentil de que as pessoas vêm e vão ao longo das eras. E a pessoa com quem eu gostaria de passar meu legado é tudo para mim, [love_interest.GetFirstName]."
 hunt_events_anna.0001.t:0 "Raízes Profundas"
 hunt_events_anna.0005.a.toast.good:0 "Eu consigo esfolar o animal com sucesso"
 hunt_events_anna.0005.a.toast.nothing:0 "O que resta é irreconhecível"
 hunt_events_anna.0005.a:0 "Tentar esfolar o animal."
 hunt_events_anna.0005.b:0 "Prática? Não me oponho..."
 hunt_events_anna.0005.c:0 "Não cabe a mim fazer uma tarefa tão banal."
 hunt_events_anna.0005.desc:0 "Meu breve descanso é interrompido por uma risada zombeteira vindo em minha direção. Olho para cima e, com pouca ou nenhuma surpresa, sou recebido com um largo sorriso [Select_CString( mocking_participant.IsFemale, 'da', 'do' )] [mocking_participant.GetFirstName], segurando o que parece ser um [ROOT.Char.Custom('SmallAnimal')] morto em suas mãos.\n\n\"Nunca achei que você fosse alguém capaz de sobreviver sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] na natureza, então imaginei que você poderia usar um pouco de prática,\" diz [mocking_participant.GetSheHe|U] com um tom sarcástico, jogando a carcaça diante dos meus pés."
 hunt_events_anna.0005.t:0 "Sob Minha Pele"
 hunt_events_anna.0010.a.desc.bad:0 "Escorrego e caio de volta no buraco"
 hunt_events_anna.0010.a.desc.good:0 "Consigo sair escalando"
 hunt_events_anna.0010.a.toast.bad:0 "Tropeço novamente e me machuco no processo"
 hunt_events_anna.0010.a.toast.good:0 "Consigo suportar a dor e sair"
 hunt_events_anna.0010.a:0 "Escalar para sair do buraco."
 hunt_events_anna.0010.b.flavor:0 "O grupo de caça interrompe a caçada para me ajudar."
 hunt_events_anna.0010.b:0 "\"Tem alguém aí?!\""
 hunt_events_anna.0010.desc:0 "Com passos pesados e instáveis, sigo minha presa através dos [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')], focado em manter o ritmo. Um som seco de estalo ecoa pelos meus ouvidos. Sinto uma súbita ausência de peso, e um frio profundo se instala no fundo do meu estômago. A queda termina, e uma dor lancinante percorre meu corpo com o impacto.\n\nAo olhar ao redor com dor, tudo o que vejo são quatro paredes me cercando. Caí em uma armadilha e preciso encontrar uma maneira de sair."
 hunt_events_anna.0010.t:0 "Preso Lá Embaixo"
 hunt_events_anna.0015.a.flavor:0 "Sendo eu um caçador habilidoso, devo ser capaz de usar minha própria experiência para dar a [child_with_bow.GetSheHe] melhor postura e precisão."
 hunt_events_anna.0015.a.toast.bad:0 "[child_with_bow.GetFirstNameNoTooltip] não entende minhas instruções"
 hunt_events_anna.0015.a.toast.good:0 "[child_with_bow.GetFirstNameNoTooltip] segue minhas instruções"
 hunt_events_anna.0015.a:0 "\"Aqui, deixe-me te mostrar...\""
 hunt_events_anna.0015.b:0 "Mostrar incentivo torcendo por [child_with_bow.GetSheHe]."
 hunt_events_anna.0015.c.toast:0 "[child_with_bow.GetFirstNameNoTooltip] encontra uma maneira de lidar com o arco"
 hunt_events_anna.0015.c:0 "Deixar [child_with_bow.GetFirstNameNoTooltip] descobrir sozinh[Select_CString( child_with_bow.IsFemale, 'a', 'o' )]."
 hunt_events_anna.0015.desc:0 "Batidas estranhas, murmúrios baixos e um suspiro ocasional ecoam pela clareira. Uma figura segurando um arco anda de um lado para o outro, aparentemente frustrada com alguma coisa.\n\nPara ver melhor, me escondo atrás de uma árvore e dou uma espiada discreta. Vejo [Select_CString( child_with_bow.IsFemale, 'minha', 'meu' )] [child_with_bow.Custom('GetDaughterSon')] [child_with_bow.GetFirstName], cercad[Select_CString( child_with_bow.IsFemale, 'a', 'o' )] por algumas flechas espalhadas pelo chão, mal conseguindo atingir o alvo que [child_with_bow.GetSheHe] montou. Parece que [child_with_bow.GetSheHe] poderia usar um pouco de orientação."
 hunt_events_anna.0015.t:0 "Respire Fundo... Solte o Ar"
