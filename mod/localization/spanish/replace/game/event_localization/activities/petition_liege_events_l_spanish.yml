 petition_liege.0101.bribe_contract.county_convert:0 "Maior responsabilidade compensará essa ajuda."
 petition_liege.0101.bribe_contract.county_opinion:0 "Confio que os frutos do contentamento serão compartilhados?"
 petition_liege.0101.bribe_contract.development:0 "Espero uma fração dos seus ganhos."
 petition_liege.0101.bribe_contract.faction_war:0 "Demonstre sua gratidão e eu ajudarei."
