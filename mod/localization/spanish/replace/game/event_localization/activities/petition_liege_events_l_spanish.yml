 petition_liege.0121.bribe_vows:0 "A graça do trono vai para aqueles que provam sua piedade."
 petition_liege.0121.desc.appointment:0 "Minha casa, como muitas das mais nobres famílias em [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], busca os honores do serviço do trono, servindo como governadores e burocratas.\n\n\"Provamos ser servos leais e hábeis do reino, e ficaríamos honrados em ter seu apoio na seleção de oficiais.\""
 petition_liege.0121.desc.privilege:0 "As muitas famílias briguentas do reino esquecem a graça e dignidade que aqueles em sua posição outrora conheceram. Poucas casas permanecem, embora coloque a minha entre elas, que ainda retêm verdadeira qualidade.\n\"Com toda humildade, espero que sua majestade reconheça nosso mérito, como uma das principais casas do reino."
 petition_liege.0121.desc.regent:0 "A questão de quem será o sucessor [Select_CString( petition_vassal.GetTopLiege.IsFemale, 'da', 'do' )] [petition_vassal.GetTopLiege.GetTitledFirstNamePossessive] como administrador do seu reino ainda precisa ser resolvida.\n\n\"Espero que concorde que, se eu humildemente me apresentar para esta honra, servirei melhor ao trono.\""
 petition_liege.0121.desc.wedding:0 "Apenas as famílias mais nobres poderiam esperar igualar uma fração da graça de sua linhagem real.\n\n\"Com a mais profunda humildade, contaria minha própria casa entre elas, e solicito seu apoio para um casamento real.\""
 petition_liege.0121.desc:0 "[petition_vassal.GetTitledFirstName] finalmente é mostrado em meu grande salão, e não perde tempo antes de caminhar até meu trono e curvar-se profundamente.\n\n\"Obrigado por me receber, grande [petition_liege.GetTitleAsNameNoTooltip]. Venho a você hoje para discutir um assunto importante —"
 petition_liege.0121.refusal:0 "Este pedido está abaixo da dignidade da coroa."
 petition_liege.0121.t.appointment:0 "Promoção de Casa"
 petition_liege.0121.t.privilege:0 "Dignidade Reconhecida"
 petition_liege.0121.t.regent:0 "Endosso de Cargo"
 petition_liege.0121.t.wedding:0 "Casamento Real"
 petition_liege.0201.a:0 "Obrigado, meu senhor!"
 petition_liege.0201.a_non_royal:0 "Obrigado, [Select_CString( petition_liege.IsFemale, 'minha', 'meu' )] [petition_liege.GetLadyLord]!"
 petition_liege.0201.desc.bridge:0 "\n\nApós ouvir meu discurso, [petition_liege.GetSheHe] faz um aceno curto e declara: \"Enviarei meus agentes imediatamente para cuidar deste assunto.\""
 petition_liege.0201.desc.construct_city:0 "\n\nApresento meus argumentos para o desenvolvimento do assentamento de [petition_construct.GetName] no condado de [petition_construct_county.GetName], listando os benefícios conforme ensaiado."
 petition_liege.0201.desc.construct_temple:0 "\n\nApresento humildemente o caso de um novo [petition_liege.GetFaith.HouseOfWorship] no condado de [petition_construct_county.GetName], a ser construído no assentamento de [petition_construct.GetName]."
 petition_liege.0201.desc.council_seat:0 "\n\nEu elucido as habilidades, comprovadas e outras, que me tornam um candidato adequado para ser o [petition_liege.GetTitleAsNamePossessiveNoTooltip] [petition_vassal.Custom('GetCouncilPositionRequest')], solicitando o cargo de seu conselheiro."
 petition_liege.0201.desc.council_second_party:0 "Certamente não farei pior do que [second_party.GetFullName]..."
 petition_liege.0201.desc.county_control:0 "\n\nDescrevo cuidadosamente os problemas enfrentados em minha propriedade feudal, com resistência à minha autoridade e cercada de vagabundos, e solicito assistência para restaurar a ordem."
 petition_liege.0201.desc.county_convert:0 "\n\nExplico fervorosamente a situação em minha propriedade feudal e a necessidade de apoio para levar as multidões pecadoras à luz do [petition_liege.GetFaith.GetNameNoTooltip]."
 petition_liege.0201.desc.county_opinion:0 "\n\nExplico o descontentamento em meu domínio e o grande ânimo que uma simples visita [Select_CString( petition_liege.IsFemale, 'da', 'do' )] [petition_liege.GetTitleAsNameNoTooltip] daria aos espíritos do povo comum."
 petition_liege.0201.desc.development:0 "\n\nExplico cuidadosamente as situações díspares do [petition_county_example.GetName] e [petition_liege.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier], e o que poderia ser feito para reequilibrar a situação."
 petition_liege.0201.desc.faction_war:0 "\n\nResumo os eventos que levaram à traição aberta [Select_CString( second_party.IsFemale, 'da', 'do' )] [second_party.GetTitledFirstName] e [vassal_faction.GetName|l], e solicito sua rendição forçada pelo [petition_liege.GetTitleAsNameNoTooltip]."
 petition_liege.0201.desc.fortify_border:0 "\n\nDescrevo com calma a ameaça representada pelos vizinhos do reino, chamando a atenção para o [second_party.GetPrimaryTitle.GetName] e o risco que representa para minhas terras."
 petition_liege.0201.desc.house_fief:0 "\n\nEu apresento meu caso de que me conceder direitos hereditários seria benéfico para a região."
 petition_liege.0201.desc.intro:0 "Sou escoltado até a sala do trono [Select_CString( petition_liege.IsFemale, 'da', 'do' )] [petition_liege.GetTitledFirstNamePossessive], onde [petition_liege.GetSheHe] me faz um gesto para me aproximar e me dirigir a [petition_liege.GetSheHe]."
 petition_liege.0201.desc.pay_debt:0 "\n\nImploro [Select_CString( petition_liege.IsFemale, 'a', 'ao' )] [petition_liege.GetTitleAsNameNoTooltip] que compreenda os grandes desafios que minha propriedade feudal enfrentou e que esvaziaram meus cofres, suplicando que [petition_liege.GetSheHe] liquide minhas dívidas..."
 petition_liege.0201.desc.title_liege:0 "\n\nEu afirmo respeitosamente minha reivindicação legítima a [petition_claim.GetName], apresentando os extensos documentos que a comprovam, e aguardo a resposta [Select_CString( petition_liege.IsFemale, 'da', 'do' )] [petition_liege.GetTitleAsNamePossessiveNoTooltip]."
 petition_liege.0201.desc.title_vassal:0 "\n\nApresento habilmente as evidências da minha reivindicação ao [petition_claim.GetName], destacando sua força em relação à [Select_CString( second_party.IsFemale, 'da', 'do' )] [second_party.GetTitledFirstName]."
 petition_liege.0201.desc.vassal_war:0 "\n\nDelimito as causas e eventos do meu conflito em curso com [Select_CString( second_party.IsFemale, 'a', 'o' )] [second_party.GetTitledFirstName] e solicito que [Select_CString( petition_liege.IsFemale, 'a', 'o' )] [petition_liege.GetTitleAsNameNoTooltip] imponha uma paz para pôr fim ao derramamento de sangue dentro do reino [petition_liege.GetHerHim]."
 petition_liege.0201.desc.war_aid:0 "\n\nImploro [Select_CString( petition_liege.IsFemale, 'a minha', 'ao meu' )] [petition_liege.GetLadyLord] para emprestar sua força à minha causa legítima, de qualquer maneira que [petition_liege.GetSheHe] possa, para que um vassalo leal do reino não seja derrotado."
 petition_liege.0201.t:0 "$petition_liege_header$ Aceito"
 petition_liege.0205.a:0 "Uma oferta justa - eu aceito."
 petition_liege.0205.b:0 "Você está brincando? Já estou no meu limite!"
 petition_liege.0205.counter:0 "[Select_CString( petition_liege.IsFemale, 'Minha', 'Meu' )] [petition_liege.GetTitleAsNameNoTooltip], talvez eu tenha explicado mal..."
 petition_liege.0205.desc.bridge:0 "\n\n[petition_liege.GetSheHe|U] permanece em silêncio por alguns instantes enquanto pondera sobre minha petição. \n\nEventualmente, [petition_liege.GetSheHe] se dirige a mim: \"Você fala bem, mas se eu concordar com seu pedido, precisarei de algo em troca. Certamente você vê que seria benéfico para ambos chegarmos a um acordo?\""
 petition_liege.0205.desc.intro:0 "$petition_liege.0201.desc.intro$"
 petition_liege.0205.t:0 "$petition_liege_header$ Contraproposta"
 petition_liege.0209.a:0 "Ai de mim."
 petition_liege.0209.counter:0 "Espere, [Select_CString( petition_liege.IsFemale, 'minha', 'meu' )] [petition_liege.GetLadyLord]! Ouça-me!"
 petition_liege.0209.desc.bridge.apologetic:0 "$petition_liege.0209.desc.bridge$ 'Peço desculpas, mas, pelo bem do [petition_liege.GetPrimaryTitle.GetNameNoTierNoTooltip], devo recusar seu pedido.'"
 petition_liege.0209.desc.bridge.favor:0 "$petition_liege.0209.desc.bridge$ 'Sinto muito, mas não poderei atender a esse pedido. Se eu pudesse, lhe daria o que deseja, mas por favor, que essa promessa de um favor futuro seja suficiente.'"
 petition_liege.0209.desc.bridge.unapologetic:0 "$petition_liege.0209.desc.bridge$ '#EMP Isso#! é o assunto urgente que você precisava discutir comigo? Não. Absolutamente não. Agora, se me der licença, tenho assuntos realmente #EMP importantes#! para tratar.'"
 petition_liege.0209.desc.bridge:0 "\n\nApós ouvir o discurso, [petition_liege.GetSheHe] franzir a testa e me rejeitar."
 petition_liege.0209.desc.intro:0 "$petition_liege.0201.desc.intro$"
 petition_liege.0209.favor:0 "Muito bem."
 petition_liege.0209.t:0 "$petition_liege_header$ Rejeitado"
 petition_liege.0221.a:0 "Minha eterna gratidão, grande [petition_liege.GetTitleAsNameNoTooltip]!"
 petition_liege.0221.desc.appointment:0 "\n\nSuplico a [Select_CString( petition_liege.IsFemale, 'minha', 'meu' )] [petition_liege.GetLadyLord] que reconheça minhas qualidades como servo e apoie meu avanço no serviço [petition_liege.GetHerHim] e do reino."
 petition_liege.0221.desc.bridge:0 "\n\nApós ouvir o discurso, [petition_liege.GetSheHe] espera um momento, antes de sorrir calorosamente e dizer, \"Você apresenta argumentos sábios! Muito bem, farei com que este assunto seja tratado imediatamente.\""
 petition_liege.0221.desc.privilege:0 "Exorto [Select_CString( petition_liege.IsFemale, 'a', 'o' )] [petition_liege.GetTitleAsNameNoTooltip] a assentar formalmente os reconhecimentos do nobre pedigree da minha casa entre a aristocracia de [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]."
 petition_liege.0221.desc.regent:0 "\n\nHumildemente peço o apoio [petition_liege.GetHerHim] para minha candidatura ao mais alto cargo, listando minhas conquistas anteriores e cada exemplo de minha lealdade inabalável."
 petition_liege.0221.desc.wedding:0 "\n\nExpresso a honra que minha família receberia ao ser unida em matrimônio com a casa imperial, esclarecendo a dignidade do sangue [ROOT.Char.GetHouse.GetNameNoTooltip] e a adequação de nossas donzelas e solteiros."
 petition_liege.0225.b:0 "Receio que isso não seja possível."
 petition_liege.0229.counter:0 "Vossa majestade, por favor, apenas um momento!"
 petition_liege.0301.t:0 "Contraproposta Aceita"
 petition_liege.0309.t:0 "Contraproposta Rejeitada"
 petition_liege.0401.desc.intro:0 "[petition_liege.GetTitledFirstName] pensa por um momento e exclama: '[first_portrait.GetFirstName], preciso do seu conselho sobre esse assunto!' O [first_portrait.Custom('GetNotableCharacteristic')] [first_portrait.Custom('GetPetitionLiegeTitle')] avança ansiosamente, segurando seu(a) [first_portrait.Custom('councillor_flavor_prop')]. 'Sim, um assunto muito delicado, [Select_CString( petition_liege.IsFemale, 'minha', 'meu' )] [petition_liege.GetLadyLord]...'\n\n"
 petition_liege.0401.desc.outro:0 "O [petition_liege.GetTitleAsNameNoTooltip] volta-se para mim, sua atenção já se desviando para outro lugar. Eu preciso #EMP fazer#! algo!"
 petition_liege.0401.desc.second:0 "[second_portrait.GetTitledFirstName], o [second_portrait.Custom('GetPetitionLiegeTitle')] [petition_liege.GetTitleAsNamePossessiveNoTooltip], observa em silêncio à distância"
 petition_liege.0401.desc.second_diplomacy:0 "$petition_liege.0401.desc.second$ — talvez eu possa apelar para a natureza diplomática [second_portrait.GetHerHim]?\n\n"
 petition_liege.0401.desc.second_intrigue:0 "$petition_liege.0401.desc.second$ — se eu conseguir superar [second_portrait.GetSheHe] publicamente?\n\n"
 petition_liege.0401.desc.second_learning:0 "$petition_liege.0401.desc.second$ — ninguém poderia questionar um argumento deixado sem refutação por #EMP [second_portrait.GetSheHe]#!.\n\n"
 petition_liege.0401.desc.second_martial:0 "$petition_liege.0401.desc.second$ — um argumento prático pode garantir o apoio [second_portrait.GetHerHim]?\n\n"
 petition_liege.0401.desc.second_stewardship:0 "$petition_liege.0401.desc.second$ — os números certos persuadiriam [second_portrait.GetSheHe] da minha necessidade?\n\n"
 petition_liege.0401.desc.third:0 " — talvez [third_portrait.GetSheHe] possa defender meu caso?\n\n"
 petition_liege.0401.desc.third_best_friend:0 "Meu confidente mais próximo, [third_portrait.GetTitledFirstName], está presente"
 petition_liege.0401.desc.third_fallback:0 "Dito isso, [third_portrait.GetTitledFirstName] sempre gostou de mim"
 petition_liege.0401.desc.third_friend:0 "Embora... [Select_CString( third_portrait.IsFemale, 'minha boa amiga', 'meu bom amigo' )] [third_portrait.GetTitledFirstName] também possa ter alguma influência"
 petition_liege.0401.desc.third_lover:0 "[third_portrait.GetTitledFirstName] pisca discretamente para mim"
 petition_liege.0401.desc.third_soulmate:0 "Por outro lado, [Select_CString( third_portrait.IsFemale, 'minha amada', 'meu amado' )] [third_portrait.GetTitledFirstName] não está longe"
 petition_liege.0401.failure:0 "[petition_liege.GetTitledFirstNameNoTooltip] não está convencid[Select_CString( petition_liege.IsFemale, 'a', 'o' )]"
 petition_liege.0401.first:0 "Eu sei exatamente como pegar [first_portrait.GetFirstNameNoTooltip] desprevenido..."
 petition_liege.0401.second:0 "\"[second_portrait.GetFirstNameNoTooltip]!"
 petition_liege.0401.second_diplomacy:0 "$petition_liege.0401.second$ Certamente há espaço para compromisso aqui?\""
 petition_liege.0401.second_intrigue:0 "$petition_liege.0401.second$ Certamente #EMP você#! pode ver a razão?"
 petition_liege.0401.second_learning:0 "$petition_liege.0401.second$ #EMP Você#! deve ver a sabedoria aqui?"
 petition_liege.0401.second_martial:0 "$petition_liege.0401.second$ Certamente #EMP você#! vê meu ponto?"
 petition_liege.0401.second_stewardship:0 "$petition_liege.0401.second$ A lógica aqui deve ser clara para #EMP você#!?"
 petition_liege.0401.success:0 "[petition_liege.GetTitledFirstNameNoTooltip] muda de ideia"
 petition_liege.0401.t:0 "$petition_liege_header$ Segunda Opinião"
 petition_liege.0401.wildcard:0 "[third_portrait.GetTitledFirstNameNoTooltip] vai dizer a eles!"
 petition_liege.0501.a:0 "Que escolha eu tenho...?"
 petition_liege.0501.b:0 "Eu não posso aceitar isso!"
 petition_liege.0501.desc:0 "[second_party.GetTitledFirstName], leal, é profundamente lamentável precisar colocá-lo nessa posição. \n\nPeço que você renuncie ao [petition_claim.GetName] em favor [Select_CString( petition_vassal.IsFemale, 'da', 'do' )] [petition_vassal.GetTitledFirstName], que também reivindica o título. Confio que você respeitará meus desejos nessa questão."
 petition_liege.0501.opening:0 "[second_party.Custom2('AppropriateGreeting', ROOT.Char )]"
 petition_liege.0501.refuse_tt:0 "[second_party.GetTitledFirstName] recusou abrir mão de [petition_claim.GetName]"
 petition_liege.0601.a:0 "Hora de repensar as coisas..."
 petition_liege.0601.a_court:0 "Em frente, para coisas maiores."
 petition_liege.0601.a_liege:0 "Por que eu não deveria..."
 petition_liege.0601.a_prison:0 "Maldição."
 petition_liege.0601.desc.court:0 "Com minha coroação como [ROOT.Char.GetTitleAsNameNoTooltip] completa, minha petição não é mais necessária..."
 petition_liege.0601.desc.imprisoned:0 "$petition_liege.0601_shared_intro$ Fui [Select_CString( ROOT.Char.IsFemale, 'capturada', 'capturado' )] [Select_CString( ROOT.Char.GetImprisonedBy.IsFemale, 'pela', 'pelo' )] [ROOT.Char.GetImprisonedBy.GetTitledFirstName]."
 petition_liege.0601.desc.imprisoned_me:0 "$petition_liege.0601_shared_intro$ [ROOT.Char.GetImprisonedBy.GetTitledFirstName] me jogou na prisão."
 petition_liege.0601.desc.liege_dead:0 "$petition_liege.0601_shared_intro$ [petition_liege.GetTitledFirstName] [petition_liege.GetDeathReasonHideKiller]... \n\n"
 petition_liege.0601.desc.liege_dead_me:0 "$petition_liege.0601_shared_intro$ Acabei matando [Select_CString( petition_liege.IsFemale, 'a', 'o' )] [petition_liege.GetTitledFirstName]... \n\n"
 petition_liege.0601.desc.liege_imprisoned:0 "$petition_liege.0601_shared_intro$ [petition_liege.GetTitledFirstName] foi [Select_CString( petition_liege.IsFemale, 'capturada', 'capturado' )] [Select_CString( petition_liege.IsFemale, 'pela', 'pelo' )] [petition_liege.GetImprisonedBy.GetTitledFirstName]."
 petition_liege.0601.desc.liege_imprisoned_me:0 "$petition_liege.0601_shared_intro$ Acabei capturando [Select_CString( petition_liege.IsFemale, 'a', 'o' )] [petition_liege.GetTitledFirstName]!"
 petition_liege.0601.desc.new_liege:0 "Agora, minha solicitação precisa ser direcionada [Select_CString( ROOT.Char.GetLiege.IsFemale, 'a minha nova senhora feudal', 'ao meu novo senhor feudal' )], [ROOT.Char.GetLiege.GetTitledFirstNameRegnal]."
 petition_liege.0601.desc:0 "\n\nIsso certamente muda a situação."
 petition_liege.0601.t:0 "$petition_liege_header$ Invalidado"
 petition_liege.0601_shared_intro:0 "Assim como minha petição estava em andamento e prestes a dar frutos,"
 petition_liege.9001.construct_city:0 "Financie uma nova cidade em meu reino."
 petition_liege.9001.construct_temple:0 "Financie um novo templo em meu reino."
 petition_liege.9001.council_seat:0 "Me nomeie para o conselho deles."
 petition_liege.9001.council_seat_family:0 "$petition_liege_council_seat_family$."
 petition_liege.9001.county_control:0 "Envie funcionários para ajudar a restaurar o controle sobre condados rebeldes."
 petition_liege.9001.county_convert:0 "Patrocine padres para ajudar a converter condados em meu reino."
 petition_liege.9001.county_opinion:0 "Faça uma visita real para aumentar a opinião popular em meu reino."
 petition_liege.9001.court_position:0 "$petition_liege_court_position$."
 petition_liege.9001.court_position_family:0 "$petition_liege_court_position_family$."
 petition_liege.9001.desc:0 "Não posso mais pedir [Select_CString( petition_liege.IsFemale, 'a', 'ao' )] [petition_liege.GetTitledFirstName] para [ROOT.Char.Custom('GetPetitionType')|l]. No entanto, viajei até aqui, até [petition_liege.GetCapitalLocation.GetName], para ter a atenção [petition_liege.GetHerHim], e não vou perder essa oportunidade. Eu poderia pedir a [petition_liege.GetSheHe] que..."
 petition_liege.9001.development:0 "Realoque alguns dos seus súditos em meu reino."
 petition_liege.9001.faction_war:0 "Desmantele uma facção poderosa."
 petition_liege.9001.fallback:0 "Apenas encha meus cofres."
 petition_liege.9001.fortify_border:0 "Fortaleça minhas fronteiras."
 petition_liege.9001.gold:0 "$petition_liege_gold$."
 petition_liege.9001.governorship_family:0 "$petition_liege_governorship_family$."
 petition_liege.9001.house_fief:0 "Não é mais crime estabelecer novas formas de governar."
 petition_liege.9001.house_governorship_rights:0 "$petition_liege_house_governorship_rights$."
 petition_liege.9001.pay_debt:0 "Resolva minhas dívidas."
 petition_liege.9001.t:0 "$petition_liege_header$ Mudando de Tática"
 petition_liege.9001.title_liege:0 "Conceda uma das minhas reivindicações."
 petition_liege.9001.title_vassal:0 "Transfira uma reivindicação."
 petition_liege.9001.vassal_war:0 "Imponha a paz com meus colegas vassalos."
 petition_liege.9001.war_aid:0 "Forneça ajuda na guerra."
 petition_liege.9021.appointment:0 "Apoie as carreiras de minha casa."
 petition_liege.9021.privilege:0 "Reconheça a dignidade de minha casa."
 petition_liege.9021.regent:0 "Endosse minha candidatura ao mais alto cargo."
 petition_liege.9021.wedding:0 "Assente um casamento real."
 petition_liege.9999.a:0 "Meus assuntos aqui estão concluídos."
 petition_liege.9999.arrogant:0 "É bom deixar meus súditos se maravilharem com minha presença."
 petition_liege.9999.desc:0 "À medida que o último peticionário sai, vários cortesãos os seguem para fora da sala, com negócios para tratar em outros lugares. Outros permanecem, conversando entre si sobre os acontecimentos recentes.\n\nLogo, a formalidade cerimonial dos procedimentos desaparece por completo, dando lugar ao burburinho e movimento da vida cortesã normal."
 petition_liege.9999.every_guest_and_courtier:0 "Todos os Convidados e Cortesãos:"
 petition_liege.9999.gregarious:0 "Essa parece ser uma boa oportunidade para interagir com minha corte."
 petition_liege.9999.shy:0 "Mal posso esperar para voltar aos meus aposentos..."
 petition_liege.9999.t:0 "$petition_liege_header$ Conclusão"
 petition_liege_0101_county_control_effect_tt:0 "Todos os condados controlados com menos de 66 de [control|E]."
 petition_liege_0101_county_convert_effect_tt:0 "Todas as [petition_vassal.LocalPlayerString( 'suas ', '' )][holdings|E][petition_vassal.LocalPlayerString( '', 'Loc_ES_de_GetShortUIName' )] de outra [faith|E]."
 petition_liege_0101_county_opinion_effect_tt:0 "Todas as [petition_vassal.LocalPlayerString( 'suas ', '' )][holdings|E][petition_vassal.LocalPlayerString( '', 'Loc_ES_de_GetShortUIName' )] com [county_opinion|E] igual ou abaixo de #negative_value [SCOPE.ScriptValue('petition_county_opinion_value')]."
 petition_liege_0101_fortify_border_effect_tt:0 "Todas as [petition_vassal.LocalPlayerString( 'suas ', '' )][holdings|E][petition_vassal.LocalPlayerString( '', 'Loc_ES_de_GetShortUIName' )] que fazem fronteira com outros reinos."
 petition_liege_accept_tt:0 "Sua Petição foi aceita"
 petition_liege_block_firing_councillor_effect_tt:0 "Não pode ser removido do [council|E] por 5 anos"
 petition_liege_costs_refunded:0 "Custos reembolsados de $petition_liege_decision$"
 petition_liege_county_control_modifier:0 "Bailiff Real"
 petition_liege_county_control_modifier_desc:0 "O detentor deste condado solicitou a ajuda dos bailiffs de seu senhor feudal para restaurar a ordem."
 petition_liege_county_control_modifier_tt:0 "O [increase_control|E] progredirá mais rapidamente nos condados com este modificador."
 petition_liege_county_convert_modifier:0 "Proselytizers Patrocinados"
 petition_liege_county_convert_modifier_desc:0 "O detentor deste condado solicitou a seu senhor feudal que patrocine a conversão do condado à verdadeira fé."
 petition_liege_county_convert_modifier_tt:0 "A [convert_county|E] progredirá mais rapidamente nos condados com este modificador."
