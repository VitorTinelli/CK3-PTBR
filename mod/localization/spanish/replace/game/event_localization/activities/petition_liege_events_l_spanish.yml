 petition_liege.0101.bribe_contract.house_fief:0 "Tal solicitação exige alguns sacrifícios."
 petition_liege.0101.bribe_contract.pay_debt:0 "Aumentarei suas obrigações como forma de pagamento."
 petition_liege.0101.bribe_contract.title_liege:0 "Essas terras vêm com obrigações maiores."
 petition_liege.0101.bribe_contract.title_vassal:0 "Se você contribuir mais do que [second_party.GetSheHe] tem."
 petition_liege.0101.bribe_contract.vassal_war:0 "O que você está disposto a me dar em troca da paz?"
 petition_liege.0101.bribe_contract.war_aid:0 "Presentes devem ser recíprocos."
 petition_liege.0101.bribe_factions.construct_city:0 "Esta cidade marcará sua lealdade para comigo."
 petition_liege.0101.bribe_factions.construct_temple:0 "Desista da facção e você terá seu [petition_liege.GetFaith.HouseOfWorship]."
 petition_liege.0101.bribe_factions.council_seat:0 "Meus conselheiros devem ser irrepreensíveis."
 petition_liege.0101.bribe_factions.county_control:0 "Em troca, confio que poderei contar com você?"
 petition_liege.0101.bribe_factions.county_convert:0 "Prove sua lealdade e eu enviarei os [ROOT.Char.GetFaith.AltPriestTermPlural]."
 petition_liege.0101.bribe_factions.county_opinion:0 "Eu posso comparecer, mas você deve desistir da política."
 petition_liege.0101.bribe_factions.development:0 "Sua lealdade é um preço justo por essa gentileza."
 petition_liege.0101.bribe_factions.faction_war:0 "Observe agora, pois espero o mesmo de você."
 petition_liege.0101.bribe_factions.fortify_border:0 "Sua lealdade, para sua tranquilidade."
 petition_liege.0101.bribe_factions.house_fief:0 "Seja leal, e seu novo modo de governar será aceito."
 petition_liege.0101.bribe_factions.pay_debt:0 "Você está em dívida comigo e deve agir de acordo."
 petition_liege.0101.bribe_factions.title_liege:0 "Eu poderia abrir mão disso, mas espero sua lealdade."
 petition_liege.0101.bribe_factions.title_vassal:0 "Por este título, quero sua lealdade inabalável."
 petition_liege.0101.bribe_factions.war_aid:0 "Jure lealdade, e você terá meus homens."
 petition_liege.0101.bribe_factions:0 "Não posso tolerar #EMP nenhum#! discordância interna. #EMP Ponto#!."
 petition_liege.0101.bribe_favor.construct_city:0 "Muito bem, mas você me deverá em troca."
 petition_liege.0101.bribe_favor.construct_temple:0 "[petition_liege.GetFaith.HighGodName] será testemunha de suas obrigações."
 petition_liege.0101.bribe_favor.council_seat:0 "Esses gestos de favor devem ser retribuídos."
 petition_liege.0101.bribe_favor.county_control:0 "Eu vou te ajudar, mas você deve me ajudar."
 petition_liege.0101.bribe_favor.county_convert:0 "Se você se lembrar deste dia e da ajuda que forneci."
 petition_liege.0101.bribe_favor.county_opinion:0 "Um favor por um favor."
 petition_liege.0101.bribe_favor.development:0 "[petition_vassal.GetCapitalLocation.GetNameNoTooltip] crescerá, mas #EMP você#! me deverá."
 petition_liege.0101.bribe_favor.faction_war:0 "Meus favores não devem ser esquecidos."
 petition_liege.0101.bribe_favor.fortify_border:0 "Se eu fizer isso, você deve atender ao meu chamado."
 petition_liege.0101.bribe_favor.house_fief:0 "Em troca de um favor."
 petition_liege.0101.bribe_favor.pay_debt:0 "Um dia eu chamarei você para me retribuir."
 petition_liege.0101.bribe_favor.title_liege:0 "Eu não esquecerei facilmente da dívida que você me deve."
 petition_liege.0101.bribe_favor.title_vassal:0 "Este favor deve ser totalmente retribuído."
 petition_liege.0101.bribe_favor.war_aid:0 "Eu espero sua ajuda quando eu estiver em necessidade."
 petition_liege.0101.bribe_favor:0 "[second_party.GetFirstNameNoTooltip] não vai gostar disso. Você me deverá..."
 petition_liege.0101.bribe_given:0 "Se [petition_vassal.GetSheHe] aceitar sua contraoferta"
 petition_liege.0101.bribe_gold.construct_city:0 "Certamente você sabe o quão caras são essas coisas..."
 petition_liege.0101.bribe_gold.construct_temple:0 "Certamente você patrocinará um anexo?"
 petition_liege.0101.bribe_gold.council_seat:0 "Meu círculo íntimo precisa provar que tem uma situação financeira sólida..."
 petition_liege.0101.bribe_gold.county_control:0 "Esse trabalho é difícil e caro."
 petition_liege.0101.bribe_gold.county_convert:0 "[ROOT.Char.GetFaith.WealthGodName] nos mostra que tal trabalho não é gratuito."
 petition_liege.0101.bribe_gold.county_opinion:0 "Essas visitas incorrem em muitos custos."
 petition_liege.0101.bribe_gold.development:0 "Claro, mas uma compensação menor será necessária."
 petition_liege.0101.bribe_gold.faction_war:0 "A paz tem o seu preço."
 petition_liege.0101.bribe_gold.fortify_border:0 "Venha, você sabe que tais medidas são caras."
 petition_liege.0101.bribe_gold.house_fief:0 "Somente se estiver disposto a pagar o preço."
 petition_liege.0101.bribe_gold.title_liege:0 "Quanto sua reivindicação vale para você?"
 petition_liege.0101.bribe_gold.title_vassal:0 "Quanto isso vale para você, [petition_vassal.GetFirstNameNoTooltip]?"
 petition_liege.0101.bribe_gold.war_aid:0 "Há treinamento, equipamento, e nada disso é barato."
 petition_liege.0101.bribe_gold:0 "Eu posso arranjar uma paz, mas você precisará pagar certas #EMP reparações#!..."
 petition_liege.0101.bribe_refused:0 "Se [petition_vassal.GetSheHe] rejeitar sua contraoferta"
 petition_liege.0101.council_second:0 "Tenho algo em mente."
 petition_liege.0101.council_second_occupied:0 "[second_councillor.GetTitledFirstNameNoTooltip] vai abrir mão do cargo de [second_councillor.GetCouncilTitle]."
 petition_liege.0101.desc.construct_city:0 "o [petition_construct_county.GetName] tem grande potencial, mas falta infraestrutura necessária.\" \n\n\"[Select_CString( petition_liege.IsFemale, 'Minha', 'Meu' )] [petition_liege.GetLadyLord], patrocinar uma nova cidade em [petition_construct.GetName] beneficiaria todo o reino, apenas pelos efeitos no comércio."
 petition_liege.0101.desc.construct_temple:0 "os fiéis do [petition_construct_county.GetNameNoTooltip] precisam de um local de adoração.\" \n\n\"Eu ficaria honrado se você ajudasse a financiar um novo [petition_liege.GetFaith.HouseOfWorship] em [petition_construct.GetName], pela fé [petition_liege.GetFaith.GetAdjectiveNoTooltip]."
 petition_liege.0101.desc.council_first_councillor:0 "\n\nEntão, [petition_vassal.GetSheHe] acha que pode fazer um trabalho melhor do que [Select_CString( second_party.IsFemale, 'a', 'o' )] [second_party.GetTitledFirstName]..."
 petition_liege.0101.desc.council_seat:0 "por favor, [Select_CString( petition_liege.IsFemale, 'minha', 'meu' )] [petition_liege.GetLadyLord], permita-me sentar em seu conselho.\"\n\n\"Meus talentos são negligenciados enquanto [petition_vassal.GetWomenMen] menos capazes são ouvidos nos mais altos níveis; eu compartilharia os fardos do reino como seu [petition_vassal.Custom('GetCouncilPositionRequest')].\""
 petition_liege.0101.desc.council_second_councillor:0 "Talvez eu devesse substituir [Select_CString( second_councillor.IsFemale, 'a', 'o' )] [second_councillor.GetTitledFirstName] em seu lugar."
 petition_liege.0101.desc.county_control:0 "o [petition_county_example.GetNameNoTooltip] está sendo atormentado por dissidentes que tornam a cobrança de impostos impossível!\" \n\n\"Por favor, [Select_CString( petition_liege.IsFemale, 'minha', 'meu' )] [petition_liege.GetLadyLord], ajude-me a subjugar essas víboras, pelo bem do reino.\""
 petition_liege.0101.desc.county_convert:0 "o [petition_county_example.GetNameNoTooltip] está sendo assolado pelos [petition_county_example.GetCountyData.GetFaith.GetAdherentNamePluralNoTooltip] virulentos e ímpios!\" \n\n\"Meus sacerdotes fazem o melhor que podem, mas receio que precisem de ajuda para libertar o reino do mal."
 petition_liege.0101.desc.county_opinion:0 "uma enfermidade de descontentamento prevalece em minhas terras.\"\n\n\"[Select_CString( petition_liege.IsFemale, 'Minha', 'Meu' )] [petition_liege.GetLadyLord], tenho certeza de que uma visita [petition_liege.Custom('GetRoyalCourtRank')] mudaria o humor do povo e os traria de volta ao caminho correto."
 petition_liege.0101.desc.development:0 "minhas terras são insignificantes em comparação à sua poderosa capital.\" \n\n\"Por favor, reserve parte das riquezas [Select_CString( petition_liege.IsFemale, 'da', 'do' )] [petition_liege.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierPossessive] para [Select_CString( petition_county_example.IsFemale, 'a', 'o' )] humilde [petition_county_example.GetName], em benefício do reino como um todo."
 petition_liege.0101.desc.end_war:0 "[second_party.GetTitledFirstNameNoTooltip] tem travado guerra contra mim e seus bons e leais súditos no [petition_vassal.GetPrimaryTitle.GetName]!\" \n\n\"Certamente, essa luta interna só nos enfraquece e deve ser interrompida imediatamente?\""
 petition_liege.0101.desc.faction_war:0 "Estou cercado [Select_CString( second_party.IsFemale, 'pela', 'pelo' )] [second_party.GetTitledFirstName] e os [vassal_faction.GetNameNoTooltip|l] [second_party.GetHerHim]! \n\n\"Por favor, você deve colocar esses insolentes em seu lugar, pelo bem do reino!\""
 petition_liege.0101.desc.fortify_border:0 "minhas terras estão entre o [petition_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] e seus inimigos!\" \n\n\"O [petition_county_example.GetNameNoTooltip] é uma das fronteiras do reino, e sua defesa é responsabilidade sua e minha."
 petition_liege.0101.desc.gold:0 "Eu me pergunto se poderia dispensar ouro para um súdito leal, dado o meu serviço e lealdade até agora. \n\n\"Garanto que seria gasto para promover os interesses do reino.\""
 petition_liege.0101.desc.house_fief:0 "Conceda-me direitos hereditários e a oportunidade de governar meu próprio feudo, para que o reino em geral possa prosperar."
 petition_liege.0101.desc.pay_debt:0 "Enfrentei algumas... dificuldades financeiras, devido a eventos totalmente fora do meu controle.\" \n\n\"Pelo bem do reino, você poderia me ajudar a acertar minhas contas?\""
 petition_liege.0101.desc.title_liege:0 "com todo respeito, majestade, o [petition_claim.GetName] é legitimamente meu!\" \n\n\"Você governa um poderoso [petition_liege.GetPrimaryTitle.GetTierAsNameNoTooltip], [Select_CString( petition_liege.IsFemale, 'minha', 'meu' )] [petition_liege.GetLadyLord], não poderia me conceder um único [petition_claim.GetTierAsNameNoTooltip], reivindicado com sinceridade?"
 petition_liege.0101.desc.title_liege_non_royal:0 "Com respeito, [Select_CString( petition_liege.IsFemale, 'minha', 'meu' )] [petition_liege.GetTitleAsNameNoTooltip], o [petition_claim.GetName] é de direito meu!\"\n\n\"Você supervisiona um poderoso [petition_liege.GetPrimaryTitle.GetTierAsNameNoTooltip], [Select_CString( petition_liege.IsFemale, 'minha', 'meu' )] [petition_liege.GetLadyLord], não pode conceder-me apenas um único [petition_claim.GetTierAsNameNoTooltip], reivindicado de forma justa?\""
 petition_liege.0101.desc.title_vassal:0 "[second_party.GetTitledFirstNamePossessive] [petition_claim.GetName] é legitimamente meu!\" \n\n\"[Select_CString( petition_liege.IsFemale, 'Minha', 'Meu' )] [petition_liege.GetLadyLord], você deve entender o quão vitais são as reivindicações nas terras que possuímos. Por favor, faça com que [second_party.GetTitleAsNameNoTooltip] renuncie ao que não lhe pertence."
 petition_liege.0101.desc.war_aid:0 "a [petition_war.GetName] está indo mal; [second_party.GetTitledFirstNameNoTooltip] tem a vantagem. \n\n\"[Select_CString( petition_liege.IsFemale, 'Minha', 'Meu' )] [petition_liege.GetLadyLord], minhas derrotas também são suas. Empreste-me seu apoio, pelo bem do reino."
 petition_liege.0101.desc:0 "[petition_vassal.GetTitledFirstName] é finalmente [Select_CString( petition_vassal.IsFemale, 'conduzida', 'conduzido' )] à minha grande sala e não perde tempo antes de se aproximar do meu trono e fazer uma profunda reverência. \n\n\"Obrigado por me receber, [Select_CString( ROOT.Char.IsFemale, 'minha senhora', 'meu senhor' )]. Venho até você hoje com um pedido urgente —"
 petition_liege.0101.desc_non_royal:0 "[petition_vassal.GetTitledFirstName] finalmente é mostrado no grande salão de meu [liege|E], e não perde tempo antes de caminhar até o trono e curvar-se profundamente.\n\n\"Obrigado por me receber, [petition_liege.GetTitledFirstNamePossessive]. Venho a você hoje com um pedido urgente —"
 petition_liege.0101.refusal.construct_city:0 "Suas terras são sua própria responsabilidade."
 petition_liege.0101.refusal.construct_temple:0 "Os piedosos geralmente patrocinam igrejas por conta própria."
 petition_liege.0101.refusal.council_seat:0 "Existem outras considerações em jogo."
 petition_liege.0101.refusal.county_control:0 "Suas terras vêm com responsabilidades, [petition_vassal.GetTitleAsNameNoTooltip]."
 petition_liege.0101.refusal.county_convert:0 "Essas almas são seus súditos e, portanto, #EMP seu#! problema."
 petition_liege.0101.refusal.county_opinion:0 "Infelizmente, estou ocupado demais para tais frivolidades."
 petition_liege.0101.refusal.development:0 "Infelizmente, algumas terras são mais abençoadas que outras."
 petition_liege.0101.refusal.faction_war:0 "Não lutarei suas batalhas por você."
 petition_liege.0101.refusal.fortify_border:0 "Tenho meus próprios castelos para manter."
 petition_liege.0101.refusal.house_fief:0 "Você pede demais, isto #EMP deve#! continuar sendo um crime."
 petition_liege.0101.refusal.pay_debt:0 "As contas do meu vassalo são apenas preocupação dele."
 petition_liege.0101.refusal.title_liege:0 "Eu também reivindico [petition_claim.GetNameNoTierNoTooltip]."
 petition_liege.0101.refusal.title_vassal:0 "Sua reivindicação é tão forte quanto seu braço armado."
 petition_liege.0101.refusal.war_aid:0 "Você deve buscar sua própria vitória."
 petition_liege.0101.refusal:0 "Se você é fraco demais para governar, talvez não devesse."
 petition_liege.0101.repay_favor:0 "Minha dívida com você terminará aqui."
