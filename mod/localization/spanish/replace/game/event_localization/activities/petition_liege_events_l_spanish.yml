 petition_liege.0021.desc.no_travel:0 "Seria uma grande honra ter minha audiência recebida, e minha humilde e sincera apresentação de um assunto caro ao meu coração ouvida.\n\nAguardo pacientemente o chamado do palácio na maior conveniência de sua majestade."
