l_spanish:
 I_CHING_HEAVEN_GLOSS:0 "O hexagrama do Céu representa a ordem divina, governança e liderança. Ele incorpora os princípios de autoridade e estrutura, guiando aqueles que buscam governar com sabedoria e virtude."
 I_CHING_MOUNTAIN_GLOSS:0 "O hexagrama da Montanha simboliza estabilidade, força e a capacidade de suportar dificuldades. Ele ensina a importância da perseverança e da fortaleza diante da adversidade."
 I_CHING_THUNDER_GLOSS:0 "O hexagrama do Trovão simboliza poder, autoridade e a capacidade de impor a própria vontade. Ele ensina a importância da força e da decisão diante da adversidade."
 I_CHING_WATER_GLOSS:0 "O hexagrama da Água simboliza adaptabilidade, fluxo e a habilidade de navegar os desafios da vida. Ele ensina a importância da flexibilidade e da resiliência diante da adversidade."
 I_CHING_WIND_GLOSS:0 "O hexagrama do Vento simboliza mudança, flexibilidade e a capacidade de se adaptar a novas circunstâncias. Ele ensina a importância da adaptabilidade e da resiliência diante da adversidade."
 TeachingsAccordingToMovementAdvancement_Response:0 "Alguns perseguem flores distantes e chamam isso de glória, mas esquecem os frutos que sustentam sua própria casa"
 TeachingsAccordingToMovementAdvancement_Teaching:0 "Cuidar do jardim dentro das muralhas enche o ar com uma fragrância que atrai outros. A verdadeira força e glória crescem apenas de raízes profundas em solo bem cultivado"
 TeachingsAccordingToMovementConservative_Response:0 "Temo que aqueles que se agarram demais ao passado não possam lavrar um novo solo, mesmo quando os antigos campos já estão exaustos"
 TeachingsAccordingToMovementConservative_Teaching:0 "Apesar do silêncio nos salões dos ancestrais, escute com atenção e ouvirá ecos duradouros para guiar cada passo. Honre bem o caminho trilhado que nos trouxe até este momento"
 TeachingsAccordingToMovementExpansion_Response:0 "Vi alguns tão focados em novos campos que negligenciam manter a paz em seu próprio jardim"
 TeachingsAccordingToMovementExpansion_Teaching:0 "Quando as margens do rio transbordam, alguns podem perecer, mas isso nutre novos campos para alimentar muitos. Assim a grandeza se revela na coragem de abraçar terras além das nossas"
 TeachingsAccordingToMovementFallback_Response:0 "Há alguns que voam de lanterna em lanterna, como uma mariposa atraída por qualquer chama"
 TeachingsAccordingToMovementFallback_Teaching:0 "Mesmo uma lanterna solitária dissipa a noite; a sabedoria não precisa de estandarte para guiar o caminho"
 TeachingsAccordingToMovementProHegemon_Response:0 "Há aqueles que louvam o eixo tão alto que esquecem seu propósito como raio para manter a roda unida"
 TeachingsAccordingToMovementProHegemon_Teaching:0 "O pivô do Céu, embora invisível, põe tudo sob o céu em movimento. Quando a virtude permanece firme no centro do reino, a harmonia segue"
 TeachingsAccordingToMovementUndecided_Response:0 "Infelizmente, vi muitos elogiarem o equilíbrio como desculpa para a inação enquanto o mundo passa"
 TeachingsAccordingToMovementUndecided_Teaching:0 "Quando o vento muda, os sábios guiam suas velas para captar seu poder. A dança entre contenção e ambição, tradição e mudança, sempre em busca do equilíbrio, deve guiá-lo tanto no governo quanto na vida"
 chinese_students.0002.a.tooltip:0 "Ambos os discípulos ganharão Mérito, tornar-se-ão mais competitivos e apreciarão sua orientação. Você pode ganhar estresse dependendo do seu temperamento."
 chinese_students.0002.a:0 "Não há nada de errado com uma competição saudável!"
 chinese_students.0002.b.tooltip:0 "O estudante da dinastia mais prestigiosa ganhará Mérito e apreciação (assim como o chefe dessa dinastia), enquanto o outro guardará ressentimento por seu favoritismo."
 chinese_students.0002.b:0 "Ter o favor da Casa [most_renowned_student.GetHouse.GetNameNoTooltip] pode ser útil."
 chinese_students.0002.c.tooltip:0 "O azarão perderá Mérito e ganhará estresse, enquanto o favorito ganhará Mérito. O azarão guardará ressentimento por sua severidade."
 chinese_students.0002.c:0 "[underdog.GetShortUINameNoTooltip] precisa aprender o seu lugar."
 chinese_students.0002.d.tooltip:0 "O favorito perderá Mérito e ganhará estresse, enquanto o azarão ganhará Mérito. O favorito guardará ressentimento por sua severidade."
 chinese_students.0002.d:0 "[overdog.GetShortUINameNoTooltip] deveria saber melhor do que isso!"
 chinese_students.0002.desc:0 "\"[ROOT.Char.Custom('TeachingsAccordingToMovement')].\"\n\nFaço uma pausa para deixar minhas palavras surtirem efeito, mas [second_student.GetName] aproveita o momento. Com um olhar teatral para [first_student.GetName], [second_student.GetSheHe] limpa sua garganta. \"[ROOT.Char.Custom('TeachingResponsesAccordingToMovement')]\", [second_student.GetSheHe] responde.\n\nOs dois têm estado no pescoço um do outro a semana toda."
 chinese_students.0002.e.tooltip:0 "Ambos os discípulos serão repreendidos, causando-lhes estresse e ressentimento. Você ganhará algum estresse pela interrupção, mas também algum Mérito por impor disciplina."
 chinese_students.0002.e:0 "Ambos merecem uma lição de humildade."
 chinese_students.0002.t:0 "Falta de Disciplina"
 chinese_students.0003.a:0 "Vou provar que [Select_CString( second_student.IsFemale, 'a', 'o' )] [second_student.GetTitledFirstNameNoTooltip] está errad[Select_CString( second_student.IsFemale, 'a', 'o' )]!"
 chinese_students.0003.b:0 "Isso pouco importa; serenidade é minha força."
 chinese_students.0003.c:0 "Que todos saibam que prevaleci!"
 chinese_students.0003.d:0 "O triunfo exige humildade."
 chinese_students.0003.desc.disfavor:0 "Noss[Select_CString( mentor.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] reconhece [second_student.GetSheHe] com gentileza e lança um olhar de censura em minha direção. Minhas orelhas queimam de vergonha."
 chinese_students.0003.desc.encourage_both:0 "Noss[Select_CString( mentor.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] alimenta a rivalidade. A competição agora se afiará a cada lição."
 chinese_students.0003.desc.favor:0 "Noss[Select_CString( mentor.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] corta [second_student.GetSheHe] e continua apenas com um olhar afiado na direção [second_student.GetHerHim]."
 chinese_students.0003.desc.intro:0 "\"[mentor.Custom('TeachingsAccordingToMovement')].\"\n\nEnquanto [Select_CString( mentor.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] [mentor.GetTitledFirstName] transmite sabedoria, [Select_CString( second_student.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('second_student'))] [second_student.GetTitledFirstName] limpa sua garganta e responde, \"[ROOT.Char.Custom('TeachingResponsesAccordingToMovement')]\", com um olhar de lado para mim.\n\n"
 chinese_students.0003.desc.punish_both:0 "Noss[Select_CString( mentor.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] nos dirige uma reprimenda ardente."
 chinese_students.0003.e:0 "Terei minha vingança!"
 chinese_students.0003.f:0 "Aprenderei com este fracasso."
 chinese_students.0003.t:0 "$chinese_students.0002.t$"
 chinese_students.0010.a.strength:0 "Uma oportunidade para reformar as leis ultrapassadas do reino!"
 chinese_students.0010.a.weakness:0 "Embora a legislação me desafie, devo tentar lidar com ela..."
 chinese_students.0010.b.strength:0 "Um poema para [Select_CString( beloved.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('beloved'))], cheio de insinuações e trocadilhos!"
 chinese_students.0010.b.weakness:0 "Apesar das minhas palavras desajeitadas, vou expressar meus sentimentos [Select_CString( beloved.IsFemale, 'pela minha', 'pelo meu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('beloved'))]..."
 chinese_students.0010.blank.success.tt:0 "Posso ganhar [GetModifier('left_scroll_blank_modifier').GetNameWithTooltip]"
 chinese_students.0010.c.strength.china:0 "Somente [Select_CString( ROOT.Char.GetTopLiege.IsFemale, 'a própria', 'o próprio' )] Filho do Céu merece meus traços!"
 chinese_students.0010.c.strength.other:0 "Somente [ROOT.Char.GetTopLiege.GetShortUINameNoTooltip] merece meus traços!"
 chinese_students.0010.c.weakness.china:0 "Tentarei escrever uma ode ao Filho do Céu..."
 chinese_students.0010.c.weakness.other:0 "Tentarei escrever uma ode a [ROOT.Char.GetTopLiege.GetShortUINameNoTooltip]..."
 chinese_students.0010.d.strength:0 "A filosofia flui naturalmente da minha mente para este pergaminho!"
 chinese_students.0010.d.weakness:0 "A filosofia testa meus limites, mas este tratado talvez expanda minha mente..."
 chinese_students.0010.desc:0 "[Select_CString( mentor.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] [mentor.GetTitledFirstName] aproxima-se de mim, segurando um pergaminho ornamentado nas mãos [mentor.GetHerHim]. Imaculado e intocado pela tinta, revela uma tela em branco cheia de possibilidades.\n\n\"O pergaminho em branco é um teste de sua sabedoria e caráter\", [mentor.GetSheHe] entoa solenemente. \"O que você escrever aqui reflete sua alma. Escolha suas palavras com cuidado, jovem discípulo.\"\n\n[mentor.GetSheHe|U] me deixa apenas com pincéis, tinta e meus pensamentos."
 chinese_students.0010.e.strength:0 "Estratégia militar é onde meus talentos brilham mais!"
 chinese_students.0010.e.weakness:0 "A guerra me confunde, mas o exército [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] precisa de ideias novas..."
 chinese_students.0010.f:0 "A verdade mais profunda está na palavra não dita."
 chinese_students.0010.failure.tt:0 "Posso ganhar experiência valiosa"
 chinese_students.0010.failure:0 "Texto abaixo do esperado"
 chinese_students.0010.failure_blank:0 "Sua visão é obscura demais"
 chinese_students.0010.law.success.tt:0 "Posso ganhar [GetModifier('wrote_law_modifier').GetNameWithTooltip]"
 chinese_students.0010.ode.success.tt:0 "Posso ganhar [GetModifier('wrote_ode_to_liege_modifier').GetNameWithTooltip]"
 chinese_students.0010.poem.success.tt:0 "Posso ganhar [GetModifier('wrote_poem_loved_one_modifier').GetNameWithTooltip]"
 chinese_students.0010.stratagem.success.tt:0 "Posso ganhar [GetModifier('wrote_strategy_scroll_modifier').GetNameWithTooltip]"
 chinese_students.0010.success:0 "Texto de alta qualidade"
 chinese_students.0010.success_blank:0 "O mentor compreende sua visão"
 chinese_students.0010.t:0 "O Pergaminho em Branco"
 chinese_students.0010.treatise.success.tt:0 "Posso ganhar [GetModifier('wrote_philosophical_treatise_modifier').GetNameWithTooltip]"
 chinese_students.0010.tt:0 "#weak Os esforços serão julgados...#!"
 chinese_students.0011.desc.blank:0 "totalmente em branco!"
 chinese_students.0011.desc.conclusion:0 "\n\nMostra-se uma janela reveladora para a mente e o caráter [scroll_student.GetHerHim]."
 chinese_students.0011.desc.emperor_ode:0 "uma ode à glória de [ROOT.Char.GetTopLiege.GetShortUIName], louvando as muitas virtudes [ROOT.Char.GetTopLiege.GetHerHim]."
 chinese_students.0011.desc.intro:0 "Meu estudante [scroll_student.GetShortUIName] aparece à minha porta, carregando reverentemente um pergaminho finamente caligrafado. [scroll_student.GetSheHe|U] o apresenta com mãos trêmulas, ansioso por meu veredito.\n\nEu o desenrolo com cuidado para examinar o que [scroll_student.GetSheHe] escolheu escrever. Revela-se "
 chinese_students.0011.desc.law:0 "uma proposta para uma nova lei, tratando dos detalhes mais finos da boa governança."
 chinese_students.0011.desc.love_letter:0 "uma carta de amor para [beloved.GetShortUIName], repleta de sentimentos ternos."
 chinese_students.0011.desc.quality_failure.blank:0 "No que exatamente [scroll_student.GetSheHe] estava pensando?!"
 chinese_students.0011.desc.quality_failure:0 "Infelizmente, apesar do esforço considerável [scroll_student.GetHerHim], não está... muito bom."
 chinese_students.0011.desc.quality_success.blank:0 "Que escolha interessante e profunda!"
 chinese_students.0011.desc.quality_success:0 "A qualidade do trabalho é digna de exibição na biblioteca de [scroll_student.GetTopLiege.GetCapitalLocation.GetNameNoTooltip]!"
 chinese_students.0011.desc.strategy:0 "um tratado de estratégia militar, propondo diversas manobras pouco convencionais que poderiam ser usadas nas campanhas do exército [scroll_student.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip]."
 chinese_students.0011.desc.treatise:0 "um tratado de filosofia, explorando as relações entre os cinco elementos e os quatro pilares."
 chinese_students.0011.negative.toast:0 "Mentor julga meu pergaminho severamente"
 chinese_students.0011.negative_blank:0 "Tanta substância quanto há na mente [scroll_student.GetHerHim]."
 chinese_students.0011.negative_emperor:0 "Lisonja vazia revela uma mente superficial."
 chinese_students.0011.negative_law:0 "Uma tentativa grosseira de governança. [scroll_student.GetSheHe|U] ainda tem muito a aprender."
 chinese_students.0011.negative_love:0 "Sentimentos banais envoltos em linguagem florida. Que decepção."
 chinese_students.0011.negative_philosophy:0 "[scroll_student.GetSheHe|U] apenas repetiu pensamentos alheios sem compreender."
 chinese_students.0011.negative_strategy:0 "[scroll_student.GetSheHe|U] coloca [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveNameNoTooltip] em risco só para se destacar."
 chinese_students.0011.positive.toast:0 "Mentor aplaude meu pergaminho"
 chinese_students.0011.positive_blank:0 "Extraordinário! A mais pura sabedoria não se encontra na palavra escrita."
 chinese_students.0011.positive_emperor.worst:0 "[scroll_student.GetSheHe|U] demonstra talento inesperado na arte da homenagem!"
 chinese_students.0011.positive_emperor:0 "Um tributo eloquente, digno do Filho do Céu."
 chinese_students.0011.positive_law.worst:0 "Seu entendimento sobre assuntos legais melhora a cada dia!"
 chinese_students.0011.positive_law:0 "Esta lei mostra discernimento e sabedoria notáveis."
 chinese_students.0011.positive_love.worst:0 "[scroll_student.GetSheHe|U] está aprendendo a fina arte das palavras sedutoras, pelo que vejo!"
 chinese_students.0011.positive_love:0 "Palavras tão delicadas! A emoção é genuína e tocante."
 chinese_students.0011.positive_philosophy.worst:0 "Seu domínio dos conceitos filosóficos avança com uma velocidade surpreendente!"
 chinese_students.0011.positive_philosophy:0 "Esses insights filosóficos revelam um intelecto profundo."
 chinese_students.0011.positive_strategy.worst:0 "[scroll_student.GetSheHe|U] mostra nova clareza em assuntos militares!"
 chinese_students.0011.positive_strategy:0 "Essas manobras mostram uma mente tática promissora."
 chinese_students.0011.self_improvement.toast:0 "Mentor incentiva meu aprimoramento"
 chinese_students.0011.self_improvement:0 "Aceitável, mas acredito que [scroll_student.GetSheHe] pode fazer melhor."
 chinese_students.0011.t:0 "Um Momento de Aprendizado"
 chinese_students.0020.a.strength:0 "O Céu sempre me mostra o caminho!"
 chinese_students.0020.a.weakness:0 "Talvez os mistérios do Céu não me escapem hoje..."
 chinese_students.0020.b.strength:0 "O Trovão é o meu domínio!"
 chinese_students.0020.b.weakness:0 "Este pode ser o momento em que eu compreenda a força do Trovão..."
 chinese_students.0020.c.strength:0 "A Água reflete perfeitamente meu entendimento!"
 chinese_students.0020.c.weakness:0 "A sabedoria da Água é tão evasiva quanto sua natureza..."
 chinese_students.0020.d.strength:0 "Já escalei a Montanha muitas vezes!"
 chinese_students.0020.d.weakness:0 "A Montanha pesa sobre minha mente..."
 chinese_students.0020.desc.conclusion:0 "emergem claramente diante de mim enquanto [mentor.GetSheHe] fala. Sinto que eles aguardam pacientemente para que eu revele os padrões cósmicos que guiam o mundo."
 chinese_students.0020.desc.heaven:0 "[Glossary('Céu','I_CHING_HEAVEN_GLOSS')]"
 chinese_students.0020.desc.mountain:0 "[Glossary('Montanha','I_CHING_MOUNTAIN_GLOSS')]"
 chinese_students.0020.desc.thunder:0 "[Glossary('Trovão','I_CHING_THUNDER_GLOSS')]"
 chinese_students.0020.desc.water:0 "[Glossary('Água','I_CHING_WATER_GLOSS')]"
 chinese_students.0020.desc.wind:0 "[Glossary('Vento','I_CHING_WIND_GLOSS')]"
 chinese_students.0020.desc:0 "[Select_CString( mentor.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] [mentor.GetTitledFirstName] espalha os antigos caules de milefólio diante de nós, suas superfícies gastas refletindo a luz trêmula da vela. \"O oráculo contém conhecimento infinito, jovem discípulo\", [mentor.GetSheHe] entoa reverentemente. \"Mas ele fala apenas àqueles que se aproximam com habilidade e sinceridade. O que você lê neles?\"\n\nOs hexagramas do I Ching de "
 chinese_students.0020.e.strength:0 "O Vento me é familiar!"
 chinese_students.0020.e.weakness:0 "A sutileza do Vento me confunde..."
 chinese_students.0020.failure.tt:0 "Posso ganhar experiência valiosa"
 chinese_students.0020.failure:0 "Interpretação falha"
 chinese_students.0020.heaven.success.tt:0 "Posso ganhar [GetModifier('heaven_divination_insight_modifier').GetNameWithTooltip]"
 chinese_students.0020.mountain.success.tt:0 "Posso ganhar [GetModifier('mountain_divination_insight_modifier').GetNameWithTooltip]"
 chinese_students.0020.success:0 "Percepção profunda de adivinhação"
 chinese_students.0020.t:0 "Consultando o Caminho"
 chinese_students.0020.thunder.success.tt:0 "Posso ganhar [GetModifier('thunder_divination_insight_modifier').GetNameWithTooltip]"
 chinese_students.0020.tt:0 "#weak A adivinhação será avaliada...#!"
 chinese_students.0020.water.success.tt:0 "Posso ganhar [GetModifier('water_divination_insight_modifier').GetNameWithTooltip]"
 chinese_students.0020.wind.success.tt:0 "Posso ganhar [GetModifier('wind_divination_insight_modifier').GetNameWithTooltip]"
 chinese_students.0021.balanced.toast:0 "Orientação do Mentor"
 chinese_students.0021.balanced_evaluation:0 "Mostra potencial, mas precisa de refinamento."
 chinese_students.0021.desc.heaven.failure:0 "as seis linhas contínuas significam poder ilimitado! O Imperador deve governar com punho de ferro, esmagando toda oposição como o Céu esmaga aqueles que o desafiam!\""
 chinese_students.0021.desc.heaven.success:0 "as seis linhas contínuas revelam a força criativa pura de Qian. Assim como o Céu abrange tudo abaixo dele, o governante deve incorporar força temperada com sabedoria.\""
 chinese_students.0021.desc.mountain.failure:0 "montanhas esmagam aqueles abaixo! Assim devemos ser: inamovíveis e teimosos, recusando-nos a ceder, aconteça o que acontecer!\""
 chinese_students.0021.desc.mountain.success:0 "a quietude traz clareza. Mantendo a mente calma e o corpo em repouso, Gen revela o verdadeiro caminho adiante sem distrações.\""
 chinese_students.0021.desc.thunder.failure:0 "assim como o trovão atinge rápido e alto, devemos fazer todos tremer! Hesitar é fraqueza, e o oráculo exige força imediata!\""
 chinese_students.0021.desc.thunder.success:0 "a ação decisiva no momento certo traz sucesso, de acordo com o hexagrama Zhen. Como o trovão desperta a vida dormente na primavera, a verdadeira liderança inspira outros à ação.\""
 chinese_students.0021.desc.water.failure:0 "como a água destrói tudo em seu caminho, devemos sobrecarregar nossos inimigos como uma inundação, afogando qualquer resistência!\""
 chinese_students.0021.desc.water.success:0 "como a água fluindo ao redor dos obstáculos, Kan nos ensina que a verdadeira sabedoria está em reconhecer o perigo e encontrar o caminho de menor resistência.\""
 chinese_students.0021.desc.wind.failure:0 "como a tempestade, podemos abafar a oposição falando mais e mais alto! Para vencer os debates pelo futuro [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip], precisamos ser os que falam com mais força!\""
 chinese_students.0021.desc.wind.success:0 "a persistência suave supera a força rígida. Como o vento moldando a paisagem ao longo do tempo, a influência sutil de Xun alcança o que a força bruta não pode.\""
 chinese_students.0021.desc:0 "[Select_CString( divination_student.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('divination_student'))] [divination_student.GetShortUIName] emerge da câmara de adivinhação, a mente atordoada pelo impacto das revelações do I Ching.\n\n\"[divination_student.Custom2('RelationToMe',ROOT.Char)|U], foi-me mostrado que"
 chinese_students.0021.negative.toast:0 "Correção do Mentor"
 chinese_students.0021.negative_heaven:0 "[divination_student.GetSheHe|U] carece de profundidade nos princípios de governo do Céu."
 chinese_students.0021.negative_mountain:0 "O espírito [divination_student.GetHerHim] carece de quietude. Busque contemplação."
 chinese_students.0021.negative_thunder:0 "A força decisiva do Trovão escapa a [divination_student.GetSheHe]. Aja com propósito."
 chinese_students.0021.negative_water:0 "A flexibilidade escapa a [divination_student.GetSheHe]. Essencial para a sabedoria."
 chinese_students.0021.negative_wind:0 "[divination_student.SheHe|U] não percebe o poder sutil do Vento. Aprenda a gentileza."
 chinese_students.0021.positive.toast:0 "Aprovação do Mentor"
 chinese_students.0021.positive_heaven.best:0 "Seu domínio da ordem do Céu revela verdadeira sabedoria de governo!"
 chinese_students.0021.positive_heaven.worst:0 "Apesar das dificuldades, a dedicação [divination_student.GetHerHim] à liderança impressiona."
 chinese_students.0021.positive_mountain.best:0 "A quietude [divination_student.GetHerHim] revela percepção profunda!"
 chinese_students.0021.positive_mountain.worst:0 "O estudo dedicado [divination_student.GetHerHim] sobre a Montanha merece reconhecimento."
 chinese_students.0021.positive_thunder.best:0 "[divination_student.GetSheHe|U] compreende perfeitamente a natureza da ação decisiva!"
 chinese_students.0021.positive_thunder.worst:0 "A coragem [divination_student.GetHerHim] ao enfrentar o desafio do Trovão é admirável."
 chinese_students.0021.positive_water.best:0 "Sua leitura flui com adaptabilidade natural!"
 chinese_students.0021.positive_water.worst:0 "A persistência [divination_student.GetHerHim] diante dos mistérios da Água é louvável."
 chinese_students.0021.positive_wind.best:0 "[divination_student.GetSheHe|U] captura perfeitamente a influência sutil do Vento!"
 chinese_students.0021.positive_wind.worst:0 "A sabedoria [divination_student.GetHerHim] aparece na compreensão da influência."
 chinese_students.0021.t:0 "O Julgamento do Oráculo"
 chinese_students.0030.a.diplomacy:0 "Farei um apelo eloquente pela harmonia do reino."
 chinese_students.0030.a.intrigue:0 "[mentor.GetSheHe|U] pode se interessar pelo meu cifrário engenhoso."
 chinese_students.0030.a.learning:0 "Posso recitar os Analectos de memória."
 chinese_students.0030.a.martial:0 "Mostrarei a [mentor.GetSheHe] minha forma impecável com a lança."
 chinese_students.0030.a.stewardship:0 "Posso dizer a [mentor.GetSheHe] exatamente onde os fundos do reino estão mal alocados."
 chinese_students.0030.b.diplomacy:0 "Enfrentarei [mentor.GetSheHe] #emp diretamente#! em um debate animado!"
 chinese_students.0030.b.intrigue:0 "Sei uma ou duas coisas sobre os segredos #emp [mentor.GetHerHim]#! que posso compartilhar!"
 chinese_students.0030.b.learning:0 "#emp Ninguém#! supera meu entendimento dos Clássicos!"
 chinese_students.0030.b.martial:0 "[mentor.GetSheHe|U] nem consegue #emp igualar#! minha forma impecável com a lança!"
 chinese_students.0030.b.stewardship:0 "Mostrarei a [mentor.GetSheHe] o que penso das #emp próprias#! finanças [mentor.GetHerHim]!"
 chinese_students.0030.c.diplomacy:0 "Tenho esta petição em que estou trabalhando..."
 chinese_students.0030.c.intrigue:0 "Tenho algum entendimento limitado das intrigas palacianas..."
 chinese_students.0030.c.learning:0 "Posso relatar o que sei dos ensinamentos de Confúcio..."
 chinese_students.0030.c.martial:0 "Embora imperfeita, posso demonstrar minha forma com a lança..."
 chinese_students.0030.c.stewardship:0 "Há alguns registros nos livros que tenho dificuldade..."
 chinese_students.0030.desc:0 "Em meio à prática diária, sinto os olhos [Select_CString( mentor.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] [mentor.GetShortUINamePossessive] sobre mim. Trabalho em silêncio enquanto [mentor.GetSheHe] me avalia silenciosamente. Após o que parece uma eternidade, [mentor.GetSheHe] fala.\n\n\"Não basta conhecer nossas maiores forças. Ainda mais importante é conhecer nossas limitações mais profundas. Mostre-me o que aprendeu sobre si mesmo, discípulo.\""
 chinese_students.0030.improve.failure.tt:0 "Posso receber uma bronca, mas ganharei experiência valiosa"
 chinese_students.0030.improve.failure:0 "Meu mentor me ensina"
 chinese_students.0030.improve.success.tt:0 "Posso ganhar o respeito [mentor.GetHerHim] e experiência valiosa"
 chinese_students.0030.improve.success:0 "Desempenho admirável"
 chinese_students.0030.show_off.failure.tt:0 "Posso ser punido por minha arrogância"
 chinese_students.0030.show_off.failure:0 "Passo vergonha"
 chinese_students.0030.show_off.success.tt:0 "Posso ganhar o respeito [mentor.GetHerHim] e [merit|E]"
 chinese_students.0030.show_off.success:0 "Supero os ensinamentos [mentor.GetHerHim]"
 chinese_students.0030.t:0 "Força ou Humildade"
 chinese_students.0030.talent.failure.tt:0 "Posso receber uma bronca"
 chinese_students.0030.talent.failure:0 "Desempenho ruim"
 chinese_students.0030.talent.success.tt:0 "Posso ganhar o respeito [mentor.GetHerHim]"
 chinese_students.0030.talent.success:0 "Desempenho admirável"
 chinese_students.0031.a.failure.improve:0 "[mentee.GetSheHe|U] continua preso em suas dificuldades."
 chinese_students.0031.a.failure.show_off:0 "Onde foi que eu errei com este?!"
 chinese_students.0031.a.failure.talent:0 "[mentee.GetSheHe|U] pensa muito sobre [Select_CString( mentee.IsFemale, 'si mesma', 'si mesmo' )], mas todos começamos de algum lugar."
 chinese_students.0031.a.success.improve:0 "Fico satisfeito ao ver o progresso [mentee.GetHerHim]!"
 chinese_students.0031.a.success.show_off:0 "Não há mais nada que eu possa ensinar a [mentee.GetSheHe]!"
 chinese_students.0031.a.success.talent:0 "[mentee.GetSheHe|U] executa um desempenho admirável."
 chinese_students.0031.b.failure.improve:0 "[mentee.GetSheHe|U] tem um longo caminho pela frente."
 chinese_students.0031.b.failure.show_off:0 "Sem talento e sem humildade. Hora de cortar o peso morto."
 chinese_students.0031.b.failure.talent:0 "[mentee.GetSheHe|U] precisa aprender humildade acima de tudo."
 chinese_students.0031.b.success.improve:0 "$chinese_students.0031.b.success.talent$"
 chinese_students.0031.b.success.show_off:0 "Arrogante e ousado, mas há pouco que eu possa criticar."
 chinese_students.0031.b.success.talent:0 "Não há melhoria a ser obtida com elogios!"
 chinese_students.0031.desc.action.improve.diplomacy:0 "Timidamente, [mentee.GetSheHe] apresenta uma petição humilde, buscando polir sua retórica."
 chinese_students.0031.desc.action.improve.intrigue:0 "[mentee.GetSheHe|U] compartilha pensamentos tímidos sobre intrigas palacianas, ansioso por refinamento."
 chinese_students.0031.desc.action.improve.learning:0 "Com alguma hesitação, [mentee.GetSheHe] relata fragmentos dos ensinamentos de Confúcio, buscando clareza."
 chinese_students.0031.desc.action.improve.martial:0 "Admitindo falhas, [mentee.GetSheHe] demonstra uma forma trêmula com a lança para receber correções."
 chinese_students.0031.desc.action.improve.stewardship:0 "[mentee.GetSheHe|U] apresenta registros confusos, pedindo orientação para organizá-los."
 chinese_students.0031.desc.action.show_off.diplomacy:0 "Com um gesto ousado, [mentee.GetSheHe] inicia um debate acalorado, desafiando até minha sabedoria."
 chinese_students.0031.desc.action.show_off.intrigue:0 "[mentee.GetSheHe|U] começa a revelar segredos obscuros do reino, insinuando tramas que pertencem somente a mim."
 chinese_students.0031.desc.action.show_off.learning:0 "Proclamando domínio inigualável, [mentee.GetSheHe] dispara passagens obscuras dos Clássicos."
 chinese_students.0031.desc.action.show_off.martial:0 "[mentee.GetSheHe|U] brandilha uma lança, desafiando-me a igualar sua forma impecável."
 chinese_students.0031.desc.action.show_off.stewardship:0 "Sorrindo com desprezo, [mentee.GetSheHe] critica minhas próprias contas com teatral desdém."
 chinese_students.0031.desc.action.talent.diplomacy:0 "[mentee.GetSheHe|U] dá um passo à frente para fazer um apelo eloquente pela harmonia do reino."
 chinese_students.0031.desc.action.talent.intrigue:0 "[mentee.GetSheHe|U] revela um cifrário engenhoso, convidando à minha avaliação."
 chinese_students.0031.desc.action.talent.learning:0 "Calmamente, [mentee.GetSheHe] começa a recitar os Analectos de memória."
 chinese_students.0031.desc.action.talent.martial:0 "Com a respiração medida, [mentee.GetSheHe] apresenta uma forma impecável com a lança."
 chinese_students.0031.desc.action.talent.stewardship:0 "Com o livro de contas em mãos, [mentee.GetSheHe] aponta onde os fundos do reino estão sendo desperdiçados."
 chinese_students.0031.desc.conclusion:0 "\n\nEu limpo a garganta e o pátio silencia. Meu julgamento está pronto para ser ouvido."
 chinese_students.0031.desc.improve.diplomacy.failure:0 "A fala hesitante [mentee.GetHerHim] revela incerteza, mas a humildade é o primeiro passo na estrada do diplomata."
 chinese_students.0031.desc.improve.diplomacy.success:0 "Voz firme e argumentos sólidos, [mentee.GetSheHe] superou expectativas apesar de pisar em terreno desconhecido."
 chinese_students.0031.desc.improve.intrigue.failure:0 "A enganação desajeitada [mentee.GetHerHim] é transparente, mas a honestidade sobre suas falhas é a moeda mais rara."
 chinese_students.0031.desc.improve.intrigue.success:0 "O ardil se desenrola com surpreendente finesse, sugerindo perspicácia inesperada sobre correntes ocultas."
 chinese_students.0031.desc.improve.learning.failure:0 "[mentee.GetSheHe|U] tropeçou nos Analectos, mas a sede por conhecimento ainda brilhou intensamente nos olhos [mentee.GetHerHim]."
 chinese_students.0031.desc.improve.learning.success:0 "Versos fluíram de forma hesitante, mas correta, sementes de erudição tomando raízes firmes."
 chinese_students.0031.desc.improve.martial.failure:0 "A lança trêmula [mentee.GetHerHim] vacila, mas até o maior general já tropeçou com uma espada de madeira."
 chinese_students.0031.desc.improve.martial.success:0 "Uma forma antes instável agora está posicionada com confiança, evidência de prática diligente."
 chinese_students.0031.desc.improve.stewardship.failure:0 "As somas [mentee.GetHerHim] falham e a tinta borra, mas o esforço humilde para se aproximar da maestria merece orientação."
 chinese_students.0031.desc.improve.stewardship.success:0 "Somando corretamente os totais e com a tinta limpa, a perseverança trouxe ordem do caos."
 chinese_students.0031.desc.intro:0 "Durante a prática diária com [Select_CString( mentee.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentee'))] [mentee.GetShortUIName], observo [mentee.GetSheHe] tentar demonstrar suas habilidades.\n\n"
 chinese_students.0031.desc.show_off.diplomacy.failure:0 "Mas [mentee.GetSheHe] busca aplausos em vez de concordância, transformando eloquência em vaidade deslumbrante."
 chinese_students.0031.desc.show_off.diplomacy.success:0 "Estilo encontra substância: a eloquência deslumbra e ainda guia corações rumo à concórdia."
 chinese_students.0031.desc.show_off.intrigue.failure:0 "O labirinto de segredos [mentee.GetHerHim] parece criado para efeito, não necessidade; a astúcia é embotada pelo orgulho."
 chinese_students.0031.desc.show_off.intrigue.success:0 "Estilo envolto em estratégias impecáveis; cada sugestão sussurrada guia discretamente os ouvintes."
 chinese_students.0031.desc.show_off.learning.failure:0 "[mentee.GetSheHe|U] despeja passagens mais rápido que a respiração, alheio ao significado profundo da tinta."
 chinese_students.0031.desc.show_off.learning.success:0 "A recitação rápida deslumbra e ilumina, provando compreensão por trás da exibição."
 chinese_students.0031.desc.show_off.martial.failure:0 "A lâmina brilha apenas para o espetáculo, buscando aplausos em vez de aperfeiçoar a forma perfeita."
 chinese_students.0031.desc.show_off.martial.success:0 "Flourishes espetaculares não escondem falhas; cada estocada corta o ar com verdadeira maestria."
 chinese_students.0031.desc.show_off.stewardship.failure:0 "[mentee.GetSheHe|U] ostenta colunas de moedas como adereços de palco, esquecendo que a verdadeira sabedoria repousa no equilíbrio silencioso."
 chinese_students.0031.desc.show_off.stewardship.success:0 "À parte o exibicionismo, [mentee.GetSheHe|U] entrega contas tão exatas que até a ostentação não diminui seu valor."
 chinese_students.0031.desc.talent.diplomacy.failure:0 "Com a língua enrolada e o tom incerto, [mentee.GetSheHe] semeia confusão onde se buscava harmonia."
 chinese_students.0031.desc.talent.diplomacy.success:0 "As palavras medidas e o tom respeitoso [mentee.GetHerHim] revelam um coração diplomático, tecendo harmonia habilmente a partir de vozes discordantes."
 chinese_students.0031.desc.talent.intrigue.failure:0 "Fios de engano enredados em nonsense, cada segredo exposto pelo próprio erro [mentee.GetHerHim]."
 chinese_students.0031.desc.talent.intrigue.success:0 "Sutil como sombra ao luar, o enigma astuto [mentee.GetHerHim] revela os motivos ocultos de quem escuta."
 chinese_students.0031.desc.talent.learning.failure:0 "Linhas esquecidas e significados confusos, [mentee.GetSheHe] expõe estudo superficial sob afirmações ousadas."
 chinese_students.0031.desc.talent.learning.success:0 "Sem pausa, [mentee.GetSheHe] recita os Clássicos, cada verso um traço de devoção acadêmica."
 chinese_students.0031.desc.talent.martial.failure:0 "Os passos vacilam e os golpes soam vazios, revelando lacunas na técnica [mentee.GetHerHim]."
 chinese_students.0031.desc.talent.martial.success:0 "A postura [mentee.GetHerHim] permanece firme e os golpes precisos, disciplina forjada em incontáveis horas nos campos de prática."
 chinese_students.0031.desc.talent.stewardship.failure:0 "Colunas somadas incorretamente e manchas de tinta marcam as páginas, expondo descuido em meio à expertise reivindicada."
 chinese_students.0031.desc.talent.stewardship.success:0 "O livro de contas que [mentee.GetSheHe] apresenta está equilibrado como as balanças do Céu, cada moeda colocada com discernimento deliberado."
 chinese_students.0031.harsh_evaluation.toast:0 "Avaliação Rigorosa"
 chinese_students.0031.kind_evaluation.toast:0 "Avaliação Gentil"
 chinese_students.0031.t:0 "Jade ou Pedra"
 chinese_students.0032.a:0 "Terei que me esforçar sem orientação."
 chinese_students.0032.desc:0 "[mentor.GetShortUIName] aproxima-se, mãos cruzadas nas costas. \"Nossos caminhos divergem aqui, discípulo,\" diz [mentor.GetSheHe] com voz medida. \"Busque a sabedoria por conta própria agora. Minhas lições terminaram.\""
