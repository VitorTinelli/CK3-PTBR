l_spanish:
 child_culture_and_faith_converted.parent.message:0 "As crenças e cultura de [Select_CString( ward.IsFemale, 'sua', 'seu' )] [ward.Custom('GetDaughterSon')] [ward.GetTitledFirstName] mudaram sob a tutela [Select_CString( guardian.IsFemale, 'da', 'do' )] [guardian.GetTitledFirstName]"
 child_culture_and_faith_converted.parent.title:0 "[ward.Custom('GetDaughterSon')|U] Influenciad[Select_CString( ward.IsFemale, 'a', 'o' )] pelo Guardião"
 child_culture_converted.parent.message:0 "A cultura [Select_CString( ward.IsFemale, 'da sua', 'do seu' )] [ward.Custom('GetDaughterSon')] [ward.GetTitledFirstName] mudou sob a tutela [Select_CString( guardian.IsFemale, 'da', 'do' )] [guardian.GetTitledFirstName]"
 child_faith_converted.parent.message:0 "As crenças [Select_CString( ward.IsFemale, 'da sua', 'do seu' )] [ward.Custom('GetDaughterSon')] [ward.GetTitledFirstName] mudaram sob a tutela [Select_CString( guardian.IsFemale, 'da', 'do' )] [guardian.GetTitledFirstName]"
 childhood_education.0004.a:0 "[ward.GetTitledFirstNameNoTooltip] está estudando [ward.Custom('education_focus_child')]!"
 childhood_education.0004.desc1:0 "Pensar que agora [ward.GetSheHe] aspira a se aprofundar na arte de [ward.Custom('education_focus_child')], um campo de estudo no qual eu me destaco... Isso aquece meu coração!"
 childhood_education.0004.desc2:0 "Pensar que [ward.GetSheHe] abandonaria nosso interesse comum pela arte de [ROOT.Char.Custom('education_focus')]!"
 childhood_education.0004.desc_fallback:0 "[ward.GetSheHe|U] agora busca conhecimento na arte de [ward.Custom('education_focus_child')]."
 childhood_education.0004.opening:0 "[Select_CString( ward.IsFemale, 'Minha pupila', 'Meu pupilo' )], [ward.GetTitledFirstName], mudou o foco de seus estudos.\n\n"
 childhood_education.0004.t:0 "A Volubilidade da Juventude"
 childhood_education.1011.a:0 "É a única forma como desejo viver."
 childhood_education.1011.desc:0 "[guardian.GetTitledFirstName] me ensinou muito sobre os costumes do seu povo— do #EMP nosso#! povo, pois não apenas professo a fé [guardian.GetFaith.GetAdjective], mas me considero totalmente [guardian.GetCulture.GetName]."
 childhood_education.1011.t:0 "É Quem Eu Sou"
 childhood_education.1012.a:0 "Finalmente, [ward.GetSheHe] enxerga a luz!"
 childhood_education.1012.desc:0 "Com sua contínua educação na fé e práticas do meu povo, [ward.GetTitledFirstName] me disse que [ward.GetSheHe] se sente um bom [guardian.GetFaith.GetAdjective] [guardian.GetCulture.GetName]."
 childhood_education.1012.t:0 "Um Dia Abençoado"
 childhood_education.1021.a:0 "Encontrei minha verdadeira fé."
 childhood_education.1021.desc:0 "A tutela [Select_CString( guardian.IsFemale, 'da', 'do' )] [guardian.GetTitledFirstName] me ensinou muito, e sinto que compreendo a verdadeira natureza do mundo.\n\nComo pude duvidar que o [guardian.GetFaith.GetName] tinha todas as respostas?"
 childhood_education.1021.t:0 "Na Fé, a Verdade"
 childhood_education.1022.a:0 "[ROOT.Char.GetFaith.KnowledgeGodName] guiou minha mão."
 childhood_education.1022.desc:0 "Depois de todas as minhas palestras e todo meu conhecimento compartilhado, [Select_CString( ward.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('ward'))], [ward.GetTitledFirstName], finalmente abraçou a verdadeira fé.\n\nEu sempre soube que [ward.GetSheHe] se tornaria um bom [ROOT.Char.GetFaith.GetAdjective] um dia."
 childhood_education.1022.t:0 "Na Fé, a Verdade"
 childhood_education.1031.a:0 "É quem eu sou."
 childhood_education.1031.desc:0 "Eu posso ter nascido [ward.GetCulture.GetName], mas não posso negar que agora nem mesmo sei o que isso significa. Após a tutela [Select_CString( guardian.IsFemale, 'da', 'do' )] [guardian.GetTitledFirstName], sinto-me [guardian.GetCulture.GetName] por completo."
 childhood_education.1031.t:0 "Natureza e Criação"
 childhood_education.1032.a:0 "E, de fato, [ward.GetSheHe] é!"
 childhood_education.1032.desc:0 "Depois de minha longa tutela d[Select_CString( ward.IsFemale, 'a', 'o' )] jovem [ward.GetTitledFirstName], fiquei extremamente satisfeito quando [ward.GetSheHe] me disse que [ward.GetSheHe] se considera [guardian.GetCulture.GetName]!"
 childhood_education.1032.t:0 "Natureza e Criação"
 childhood_education.9004.child_message:0 "[guardian.GetTitledFirstNamePossessiveNoTooltip] é [GetPerk( 'pedagogy_perk' ).GetName( GetPlayer )]"
 childhood_education.9004.guardian_message:0 "[GetPerk( 'pedagogy_perk' ).GetName( GetPlayer )]"
 childhood_education.9010.child_message:0 "[parent.GetTitledFirstNamePossessiveNoTooltip] é [GetPerk( 'just_one_more_hill_perk' ).GetName( GetPlayer )]"
 childhood_education.9010.parent_message:0 "[GetPerk( 'just_one_more_hill_perk' ).GetName( GetPlayer )]"
