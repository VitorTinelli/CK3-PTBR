l_spanish:
 child_personality.7000.a:0 "Me dê aqui – eu vou devolver tudo como estava, sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 child_personality.7000.b:0 "Você é um verdadeiro amigo, [other_child.GetFirstNameNoTooltip]. Saúde!"
 child_personality.7000.c:0 "Ah, isso não é para mim. Mas você pode beber."
 child_personality.7000.desc:0 "\"Olha só o que eu encontrei, [child.GetFirstNameNoTooltip] – um barril inteiro de [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')]! Eu peguei enquanto os cozinheiros não estavam olhando.\" [other_child.GetFirstName] diz para mim, um olhar diabólico em seus olhos.\n\n\"O que você está esperando? Vamos beber tudo antes que alguém perceba que sumiu!\" [other_child.GetSheHe|U] exclama.\n\nUma oferta tentadora... mas será que é certo?"
 child_personality.7000.t:0 "O Barril Roubado"
 child_personality.7001.change.diligent:0 "Eu acredito que alguém precisa aprender sobre responsabilidade pessoal."
 child_personality.7001.change.gregarious:0 "Agora escute, a bebida é a chave para a diversão e alegria!"
 child_personality.7001.change.temperate:0 "Você vai ficar longe de bebidas alcoólicas a partir de agora, entendeu?"
 child_personality.7001.desc:0 "\"Peguei esses dois se escondendo nos estoques de comida!\" Um cozinheiro muito irritado grita para mim, arrastando m[Select_CString( child.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] e [other_child.GetFirstName] junto com el[Select_CString( child.IsFemale, 'a', 'e' )].\n\n"
 child_personality.7001.diligent:0 "[Select_CString( child.IsFemale, 'Sozinha', 'Sozinho' )]? Isso é muito diligente da sua parte, [Select_CString( child.IsFemale, 'boa', 'bom' )] [child.Custom('GirlBoy')]!"
 child_personality.7001.gregarious:0 "Hah! Você se divertiu muito, não é mesmo!"
 child_personality.7001.t:0 "$child_personality.7000.t$"
 child_personality.7001.temperate:0 "Foi muito bom da sua parte abster-se da bebida."
 child_personality.7010.a:0 "\"Minha crença em [ROOT.Char.GetFaith.HighGodName|U] #EMP nunca#! vacilará, [sermon_priest.GetFirstNameNoTooltip]!\""
 child_personality.7010.b:0 "\"O que foi dito sobre o #EMP 'Direito Divino dos [ROOT.Char.Custom('GetQueenKing')]s'#!?\""
 child_personality.7010.c:0 "\"Esse '[ROOT.Char.GetFaith.DevilName]' parece #EMP aspiracional!#!\""
 child_personality.7010.desc:0 "\"Escutem minhas palavras, crianças. Hoje eu vou falar sobre [ROOT.Char.GetFaith.HighGodName], [ROOT.Char.GetFaith.PositiveAfterLife], [ROOT.Char.GetFaith.NegativeAfterLife] e até mesmo #EMP [ROOT.Char.GetFaith.DevilName]#! [ROOT.Char.GetFaith.DevilHerselfHimself]!\" [sermon_priest.GetFirstName] exclama, fervor queimando em seus olhos.\n\nEu e as outras crianças ficamos hipnotizadas pelo sermão de [sermon_priest.GetFirstNameNoTooltip], quem diria que o [ROOT.Char.GetFaith.ReligiousText] poderia ser tão #EMP fascinante!#!\n\nQuando o sermão termina, preciso contar a [sermon_priest.GetFirstNameNoTooltip] os meus pensamentos."
 child_personality.7010.t:0 "O Sermão"
 child_personality.7011.ambitious:0 "Isso mesmo, nunca se esqueça que o divino está ao seu lado!"
 child_personality.7011.change.ambitious:0 "A fé é #EMP apenas um meio para um fim!#!"
 child_personality.7011.change.sadistic:0 "Criança, este mundo é sombrio e cheio de horrores. É matar ou morrer."
 child_personality.7011.change.zealous:0 "Sua #EMP fé#! está acima de tudo, [Select_CString( child.IsFemale, 'minha querida filha', 'meu querido filho' )]."
 child_personality.7011.desc:0 "Hoje [sermon_priest.GetFirstName] realizou um sermão inflamado para todas as crianças da corte, aparentemente eles ficaram hipnotizados enquanto ele fervorosamente lia do [sermon_priest.GetFaith.ReligiousText].\n\n[Select_CString( child.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] "
 child_personality.7011.sadistic:0 "Diga o que quiser, mas não ter escrúpulos será útil para [child.GetSheHe]."
 child_personality.7011.t:0 "$child_personality.7010.t$"
 child_personality.7011.zealous:0 "Uma forte crença será útil para você, [child.Custom('GirlBoy')]."
 child_personality.7020.a:0 "O... como as pessoas podem ser tão cruéis..."
 child_personality.7020.b:0 "E se houver mais pessoas como [evil_person.GetSheHe]!? Eu devo #EMP sempre#! estar vigilante..!"
 child_personality.7020.c:0 "Por favor! Não me machuque, eu farei qualquer coisa!"
 child_personality.7020.desc:0 "\"[Select_CString( child.IsFemale, 'Sua pequena', 'Seu pequeno' )] [child.Custom2('InsultNoun', SCOPE.sC('evil_person'))] estúpid[Select_CString( child.IsFemale, 'a', 'o' )]! Por que você sempre tem que atrapalhar meu caminho!? Eu vou te ensinar uma lição...\" [evil_person.GetFirstName] exclama, estendendo a mão em direção a um porrete próximo.\n\nO que eu fiz de errado? Eu só queria ver o que [evil_person.GetFirstNameNoTooltip] estava fazendo! [evil_person.GetSheHe|U] está se aproximando rapidamente, levantando o porrete no ar! Socorro!\n\n\"Se você contar a alguém quem fez isso com você, eu vou garantir que você pereça...\" [evil_person.GetSheHe|U] sorri."
 child_personality.7020.t:0 "A Surra"
 child_personality.7021.change.craven:0 "Você deveria ter fugido, criança!"
 child_personality.7021.change.paranoid:0 "Há inimigos #EMP por toda parte#! Você precisa aprender isso."
 child_personality.7021.change.shy:0 "Evite as pessoas, e você estará seguro..."
 child_personality.7021.craven:0 "Corra, se esconda e nunca dê aos seus inimigos a chance de te machucar."
 child_personality.7021.desc:0 "O que diabos aconteceu com [Select_CString( child.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName]!? [child.GetSheHe|U] está [Select_CString( child.IsFemale, 'toda machucada e espancada', 'todo machucado e espancado' )] - e [child.GetSheHe] se recusa a dizer quem fez isso com [child.GetSheHe]! Foi uma criança mais velha? Ou [child.GetSheHe] importunou um nobre ao ponto de fúria?\n\n"
 child_personality.7021.paranoid:0 "Fique alerta, [child.Custom('GirlBoy')]. Não dê a eles outra oportunidade."
 child_personality.7021.shy:0 "[Select_CString( child.IsFemale, 'Querida', 'Querido' )] [child.Custom('GirlBoy')], você não precisa falar com ninguém se não quiser..."
 child_personality.7021.t:0 "$child_personality.7020.t$"
 child_personality.7030.a:0 "...comer um pouco de tudo e depois tirar um cochilo em um saco de farinha!"
 child_personality.7030.b:0 "...comer o máximo que eu puder, não vou deixar nem uma migalha!"
 child_personality.7030.c:0 "...lavar as panelas, é claro!"
 child_personality.7030.desc:0 "Finalmente, eu tenho a cozinha #EMP só pra mim!\n\nConsegui convencer o cozinheiro, [cook.GetFirstName], de que vou lavar as panelas. Com essa promessa feita, [cook.GetSheHe] saiu para pegar uma [ROOT.Char.Custom('GetLivestockFowlIndef')] para o jantar de hoje à noite - deixando a cozinha #EMP deliciosamente#! desprotegida.\n\nTem mel e [child.Custom('FavoriteTreatDemand')] e geleia e [child.Custom('GetExpensiveDessert')] e maçãs e... e... #EMP E EU NÃO AGUENTO MAIS!#!\n\nÉ hora de..."
 child_personality.7030.t:0 "Sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] na Cozinha"
 child_personality.7031.change.compassionate:0 "Você deveria tratar [cook.GetFirstNameNoTooltip] melhor!"
 child_personality.7031.change.gluttonous:0 "Você deveria ter comido todos os doces, é #EMP seu direito.#!"
 child_personality.7031.change.lazy:0 "Não gaste sua energia com pessoas assim, [child.Custom('GirlBoy')]."
 child_personality.7031.compassionate:0 "Um gesto tão doce! Você irá longe na vida."
 child_personality.7031.desc:0 "\"Saudações, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord].\" diz [cook.GetFirstName], um dos cozinheiros. \"Eu tenho aqui [Select_CString( child.IsFemale, 'a vossa', 'o vosso' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName]. [child.GetSheHe|U] prometeu lavar as panelas na cozinha, sabe como é...\" [cook.GetSheHe|U] respira fundo.\n\n"
 child_personality.7031.gluttonous:0 "Lembre-se, ninguém pode dizer o que você pode ou não pode comer."
 child_personality.7031.lazy:0 "Bom, nunca desperdice energia quando não for necessário!"
 child_personality.7031.t:0 "$child_personality.7030.t$"
 child_personality.7040.a.crush_version:0 "[child_crush_target.GetFirstNameNoTooltip] é... #EMP lind[Select_CString( child_crush_target.IsFemale, 'a', 'o' )]!#!, como [child_crush_target.Custom('GetBeautifulMetaphor')]."
 child_personality.7040.a:0 "Agora isso parece #EMP MUITO#! mais divertido do que esconde-esconde!"
 child_personality.7040.b:0 "Meus pobres olhos inocentes, façam isso parar! #EMP Façam isso parar!#!"
 child_personality.7040.desc:0 "O guarda-roupa nos aposentos dos criados é #EMP o melhor#! esconderijo, sou um gênio do esconde-esconde! Enquanto olho pela pequena abertura entre as portas, vejo [lover_1.GetFirstName] e [lover_2.GetFirstName] entrarem repentinamente pela porta.\n\n\"Oh, [Select_CString( lover_2.IsFemale, 'minha', 'meu' )] [lover_2.Custom('RomanticComplimentNoun')] [lover_2.Custom('RomanticComplimentAdjective')], eu mal posso #EMP esperar#! para tirar suas roupas!\" [lover_1.GetFirstNameNoTooltip] resmunga, suas mãos agarrando todo o corpo de [lover_2.GetFirstNameNoTooltip].\n\n\"Me possua, me possua agora, você [lover_1.Custom('RaunchyComplimentNoun')]!\" [lover_2.GetFirstNameNoTooltip] geme alto, jogando-se na cama.\n\n"
 child_personality.7040.desc_default:0 "O que eles estão fazendo... oh... eu não deveria ter #EMP visto isso!#!"
 child_personality.7040.desc_father:0 "P... pai? O que você está #EMP fazendo!?#!"
 child_personality.7040.desc_mother:0 "M... mãe? O que você está #EMP fazendo!?#!"
 child_personality.7040.desc_motherfather:0 "Mãe? Pai? O que eles estão #EMP fazendo!?#!"
 child_personality.7040.t:0 "Esconde-Esconde"
 child_personality.7041.change.chaste:0 "Contenha-se! Essa não é uma maneira adequada para [Select_CString( child.IsFemale, 'uma', 'um' )] [child.GetLadyLord] se comportar!"
 child_personality.7041.change.lustful:0 "Não tenha medo, [child.Custom('GirlBoy')]! Quando você for adulto, vai entender!"
 child_personality.7041.chaste:0 "Não ser mais íntimo do que o necessário será benéfico para [child.GetSheHe]."
 child_personality.7041.desc:0 "O que diabos [Select_CString( child.IsFemale, 'a minha', 'o meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] estava fazendo naquele guarda-roupa nos aposentos dos criados? Brincando de esconde-esconde, [child.GetSheHe] alega?\n\n"
 child_personality.7041.lustful:0 "[Select_CString( child.IsFemale, 'Sua safadinha', 'Seu safadinho' )]! Guarde isso para quando crescer!"
 child_personality.7041.t:0 "$child_personality.7040.t$"
 child_personality.7050.a:0 "Sem justiça, o reino irá falhar!"
 child_personality.7050.b:0 "Bah! Quando eu governar, os impostos serão #EMP altos#! e #EMP abundantes!#!"
 child_personality.7050.c:0 "Para fazer uma omelete dourada, é preciso quebrar alguns camponeses..."
 child_personality.7050.desc:0 "\"Sem impostos, o tesouro real logo ficaria vazio. Vassalos leais ficam mais do que felizes em pagar.\" [teacher.GetFirstName], meu professor, diz e [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('teacher'))].\n\n\"Portanto, é de extrema importância manter seus súditos felizes, não os tribute demais - nem de menos, para que não o considerem complacente.\" [teacher.GetFirstNameNoTooltip] continua, virando uma página.\n\n\"Do mais alto [ROOT.Char.GetTitleTierName] ao mais baixo [ROOT.Char.Custom('lowly_servant_type')], todos desempenham seu papel.\" [teacher.GetSheHe|U] diz, fechando o livro. \"A lição terminou, você pode ir agora.\""
 child_personality.7050.t:0 "Uma Lição em Riqueza"
 child_personality.7051.callous:0 "Ótimo. Não deixe que meros #EMP sentimentos#! o impeçam."
 child_personality.7051.change.callous:0 "Emoções geram fraquezas, criança. Suprima-as."
 child_personality.7051.change.greedy:0 "...hahaha! Não, [child.Custom('GirlBoy')], o que você precisa fazer é #EMP espremê-los até o último centavo!#!"
 child_personality.7051.change.just:0 "Você não aprendeu nada!? A lição era sobre #EMP justiça!#!"
 child_personality.7051.desc:0 "[Select_CString( child.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName]"
 child_personality.7051.desc_1:0 "acabou de terminar uma das minhas lições"
 child_personality.7051.desc_2:0 "acabou de terminar uma lição ministrada por [teacher.GetFirstName]"
 child_personality.7051.desc_fin:0 " – sobre a administração do tesouro e as moedas nele contidas.\n\n"
 child_personality.7051.greedy:0 "Isso mesmo. Nada é mais importante do que #EMP riqueza!#!"
 child_personality.7051.just:0 "Um forte senso de justiça vai te servir bem na vida!"
 child_personality.7051.t:0 "$child_personality.7050.t$"
 child_personality.7060.a:0 "Há tanta sabedoria nesse livro!"
 child_personality.7060.b:0 "Bleh, você não preferiria brincar com o meu #EMP [child.Custom('child_favorite_toy')]!?#!"
 child_personality.7060.c:0 "Ah, estou feliz com o que já sei."
 child_personality.7060.desc:0 "\"Olhe esta página, [child.GetFirstNameNoTooltip]! Acho que fala sobre [child.GetFaith.random_GoodGodNames], é realmente interessante.\" [other_child.GetFirstName] diz, com uma cópia aberta do [child.GetFaith.ReligiousText] em frente a [other_child.GetSheHe] no chão.\n\n\"Há tanto que não sabemos, tanto para aprender! Tantos mistérios, tanto conhecimento - vamos tentar descobrir mais verdades, imagine o que poderíamos nos tornar!\" [other_child.GetFirstNameNoTooltip|U] diz, com o olhar lentamente se voltando para cima."
 child_personality.7060.t:0 "Mistérios dos [child.GetFaith.ReligiousText|U]"
 child_personality.7061.change.content:0 "Esteja satisfeito com o que você já sabe, e você será feliz."
 child_personality.7061.change.cynical:0 "É tudo um absurdo, [child.Custom('GirlBoy')]. Ignore."
 child_personality.7061.change.humble:0 "Respeite essas palavras! Elas contêm #EMP sabedoria#! e #EMP significado!#!"
 child_personality.7061.content:0 "Esteja satisfeito em não saber, eu digo."
 child_personality.7061.cynical:0 "Hah! É tudo bobagem de qualquer maneira."
 child_personality.7061.desc:0 "[Select_CString( child.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] e o amiguinho [other_child.GetFirstName] pegaram uma cópia do [child.GetFaith.ReligiousText] do estudo e trouxeram para a sala de brinquedos...\n\n"
 child_personality.7061.humble:0 "Você faz bem em tratar as palavras sagradas com reverência.."
 child_personality.7061.t:0 "$child_personality.7060.t$"
 child_personality.7070.a:0 "Agora você fez, [other_child.Custom2('InsultNoun', ROOT.Char)]!"
 child_personality.7070.b:0 "A partir de agora, eu vou cuspir secretamente nas refeições [other_child.GetHerHim]... #EMP bon appétit.#!"
 child_personality.7070.c.flavor:0 "Leve na esportiva e aguente firme."
 child_personality.7070.c:0 "Engula o sapo e aguente."
 child_personality.7070.desc:0 "Ah, [child.Custom('GetExpensiveMeal')], o meu #EMP favorito!#! Enquanto estou prestes a me deliciar, minha alegria é interrompida abruptamente por [other_child.GetFirstName]. O que [other_child.GetSheHe] quer?\n\n\"Olá, #EMP [child.Custom2('InsultNoun', SCOPE.sC('other_child'))]!#! O que você está comendo? Parece nojento - deixe-me #EMP dar um pouco de tempero!#!\" [other_child.GetFirstNameNoTooltip] exclama, se aproximando do meu prato.\n\n#flatulence Ptooey!#! Uma vileza de saliva cai diretamente na minha comida.\n\n\"Aqui está, muito mais saboroso! Bwahaha!\" [other_child.GetSheHe|U] ri e sorri."
 child_personality.7070.t:0 "Sangue e Saliva"
 child_personality.7071.calm:0 "Apenas ignore [other_child.GetFirstNameNoTooltip] e [other_child.GetSheHe] se cansará."
 child_personality.7071.change.calm:0 "Apenas vire a outra face, [Select_CString( child.IsFemale, 'minha', 'meu' )] [child.Custom('GirlBoy')]."
 child_personality.7071.change.deceitful:0 "A vingança é um prato que se serve... #EMP indiretamente.#!"
 child_personality.7071.change.vengeful:0 "Não seja tão [Select_CString( child.IsFemale, 'submissa', 'submisso' )]! #EMP Vingue-se!#!"
 child_personality.7071.deceitful:0 "Exatamente o que [other_child.GetFirstNameNoTooltip] merece!"
 child_personality.7071.desc:0 "Aparentemente, [other_child.GetFirstName] cuspiu na comida [Select_CString( child.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] durante o jantar algumas noites atrás.\n\n"
 child_personality.7071.t:0 "$child_personality.7070.t$"
 child_personality.7071.vengeful:0 "Você terá sua vingança, com o tempo."
 child_personality.7080.a:0 "Todos merecem! Devemos ter mais para dar?"
 child_personality.7080.b:0 "O [ROOT.Char.Custom('lowly_servant_type')]! Não... esse camponês aqui! Espera, talvez..."
 child_personality.7080.c:0 "Nenhum deles. São todos escória!"
 child_personality.7080.desc_1:0 "\"Olhe para os pobres e oprimidos, [child.GetFirstNameNoTooltip]. Há muitos deles, e alguns realmente precisam de ajuda - outros são meros charlatães em busca de uma esmola.\" "
 child_personality.7080.desc_2:0 "me explica, tirando uma pequena bolsa de ouro.\n\n\"Quem entre eles merece mais a nossa caridade hoje, [Select_CString( child.IsFemale, 'minha querida', 'meu querido' )] [child.Custom('GirlBoy')]?\" [teacher.GetSheHe] diz, me entregando a bolsa.\n\nParece que [teacher.GetFirstNameNoTooltip] quer que eu entregue o ouro para aqueles que mais precisam..."
 child_personality.7080.desc_name_1:0 "[teacher.GetTitledFirstName] $child_personality.7080.desc_2$"
 child_personality.7080.desc_name_2:0 "[teacher.GetCouncilTitle] [teacher.GetFirstName] $child_personality.7080.desc_2$"
 child_personality.7080.t:0 "Uma Lição de Caridade"
 child_personality.7081.arrogant:0 "Isso mesmo, [child.Custom('GirlBoy')]. Você é #EMP melhor#! do que eles."
 child_personality.7081.change.arrogant:0 "Bah! Esses coitados são todos inferiores a você!"
 child_personality.7081.change.fickle:0 "Você sempre deve considerar suas escolhas. Cuidadosamente. Constantemente."
 child_personality.7081.change.generous:0 "Não, você #EMP deve#! cuidar dos pobres!"
 child_personality.7081.desc:0 "[teacher.GetTitledFirstName] levou [Select_CString( child.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] ao mercado hoje. [child.GetFirstNameNoTooltip] deveria distribuir esmolas aos pobres e necessitados, aprender sobre caridade e a responsabilidade de um governante com os menos afortunados.\n\n"
 child_personality.7081.fickle:0 "Por que escolher um caminho, quando você pode escolher #EMP todos eles?#!"
 child_personality.7081.generous:0 "É nossa responsabilidade dar o máximo que pudermos!"
 child_personality.7081.t:0 "$child_personality.7080.t$"
 child_personality.7090.a:0 "Todos cometem erros, eu não devo julgar."
 child_personality.7090.b:0 "Que confiar em seus súditos é muito importante!"
 child_personality.7090.c:0 "Paciência. Deixe as coisas levarem o tempo necessário."
 child_personality.7090.desc:0 "\"Vassalos, às vezes, ultrapassarão seus limites.\" Meu professor [teacher.GetFirstName] diz. \"O perdão fortalecerá seus laços.\"\n\n\"Em certas ocasiões, confie em um súdito, apesar de sua reputação. Caso contrário, você será sobrecarregado.\" [teacher.GetSheHe|U] continua.\n\n\"É importante que você dê a eles o tempo necessário para corrigirem seus erros.\" [teacher.GetFirstNameNoTooltip] diz, enrolando o pergaminho.\n\n\"Agora, o que você aprendeu aqui hoje?\" [teacher.GetSheHe|U] pergunta, olhando atentamente para mim."
 child_personality.7090.t:0 "Os Pontos Finos da Diplomacia"
 child_personality.7091.change.forgiving:0 "O perdão é uma virtude acima de todas as outras!"
 child_personality.7091.change.patient:0 "Seja paciente, deixe as coisas acontecerem e então faça seu julgamento."
 child_personality.7091.change.trusting:0 "Confie em seus súditos, eles nunca lhe fariam mal!"
 child_personality.7091.desc:0 "Hoje [Select_CString( child.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] recebeu uma lição sobre gerenciamento de vassalos de [teacher.GetFirstName]. Foi um curso bastante complicado, necessário, mas talvez um pouco além da compreensão de [child.GetFirstNameNoTooltip]?\n\n"
 child_personality.7091.forgiving:0 "Apenas ao perdoar podemos avançar."
 child_personality.7091.patient:0 "A paciência lhe servirá bem, criança."
 child_personality.7091.t:0 "$child_personality.7090.t$"
 child_personality.7091.trusting:0 "Bom, deixe a suspeita ser vencida em sua mente!"
 child_personality.7100.a:0 "Devemos admitir o que fizemos #EMP agora mesmo!#!"
 child_personality.7100.b:0 "Deixa pra lá, não suje meu roupa. [child.Custom('SignatureWeaponFlourishThirdPersonPresentParticiple')|U] [child.Custom('signature_weapon')]"
 child_personality.7100.c:0 "EU PRECISO DE UM CURATIVO, AGOOOORA!"
 child_personality.7100.desc:0 "Finalmente, estamos dentro! Todas as armas da armaria ao nosso alcance, que divertido! Tomem isso, seus adultos fedorentos e estúpidos tentando nos manter fora!\n\n\"Olhem! Eu encontrei [other_child.Custom('SignatureWeaponArticle')] [other_child.Custom('signature_weapon')]!\" Meu companheiro de equipe [other_child.GetFirstName] exclama, [other_child.Custom('SignatureWeaponActionPresentParticiple')] a arma.\n\nEnquanto estendo a mão para [child.Custom('SignatureWeaponArticle')] [child.Custom('signature_weapon')], ouço um alto #EMP 'Ai!'#! atrás de mim – [other_child.GetFirstNameNoTooltip] machucou [other_child.GetHerselfHimself] e há sangue!\n\nO que devo fazer?!"
 child_personality.7100.t:0 "Invasão à armaria"
 child_personality.7101.arbitrary:0 "Compreeensível. Quem se importa com [other_child.GetFirstNameNoTooltip] mesmo?"
 child_personality.7101.change.arbitrary:0 "Você deveria ter continuado brincando, [other_child.GetFirstNameNoTooltip] é dispensável."
 child_personality.7101.change.honest:0 "Você deveria ter admitido seus erros, seu pestinha!"
 child_personality.7101.change.impatient:0 "Por que você não ajudou [other_child.GetSheHe] #EMP imediatamente?!#!"
 child_personality.7101.desc:0 "[ROOT.Char.Custom('CulturalCurse')|U]! Aquelas malditas crianças, [Select_CString( child.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] e [Select_CString( other_child.IsFemale, 'sua', 'seu' )] comparsa [other_child.GetFirstName] foram pegos em flagrante ao terem se infiltrado na armaria, eles não sabem que armas são perigosas?! \n\n"
 child_personality.7101.honest:0 "Foi bom que você admitiu o que fez."
 child_personality.7101.impatient:0 "Agir rapidamente para salvar seu amigo? Admirável!"
 child_personality.7101.t:0 "$child_personality.7100.t$"
 child_personality.7200.a:0 "Não tenha medo, vou recuperar seu [other_child.Custom('child_favorite_toy')]!"
 child_personality.7200.b:0 "Guardas! #EMP Façam#! [other_child.GetFirstNameNoTooltip] recuperá-lo."
 child_personality.7200.c:0 "Isso me deixa FURIOSO! Vou acabar com você!"
 child_personality.7200.desc:0 "\"Você quer seu [other_child.Custom('child_favorite_toy')]? Huh, quer? #EMP Então vá pegá-lo!#!\" [other_child.GetFirstName] grita, jogando o [other_child.Custom('child_favorite_toy')] [Select_CString( other_child.IsFemale, 'da pequena', 'do pequeno' )] [other_child.Custom('GirlBoy')] bem fundo na caverna escura e sombria. [Select_CString( other_child.IsFemale, 'A pequena', 'O pequeno' )] [other_child.Custom('GirlBoy')] começa a chorar incontrolavelmente.\n\n\"Agora ele vai fazer companhia para as #EMP aranhas#! e #EMP cobras#!! Está perdido, para sempre!\" [other_child.GetFirstNameNoTooltip] exclama, rindo.\n\nComo [other_child.GetFirstNameNoTooltip] pode ser tão cruel com [Select_CString( other_child.IsFemale, 'essa', 'esse' )] pobre [other_child.Custom('GirlBoy')]!? A caverna está cheia de criaturas assustadoras... mas eu #EMP preciso#! fazer algo!"
 child_personality.7200.t:0 "A Caverna Escura"
 child_personality.7201.brave:0 "Tamanha coragem é louvável!"
 child_personality.7201.change.brave:0 "Você deveria ter entrado lá você mesmo, sem medo."
 child_personality.7201.change.stubborn:0 "Você deveria ter feito [other_child.GetFirstNameNoTooltip] recuperar o brinquedo."
 child_personality.7201.change.wrathful:0 "Como você não deu um soco em [other_child.GetFirstNameNoTooltip] naquele momento!?"
 child_personality.7201.desc:0 "Uma das crianças da corte, [other_child.GetFirstName], pegou o [other_child.Custom('child_favorite_toy')] de [Select_CString( other_child.IsFemale, 'uma', 'um' )] [other_child.Custom('GirlBoy')] mais nov[Select_CString( other_child.IsFemale, 'a', 'o' )] e jogou dentro de uma caverna próxima. [Select_CString( child.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] estava lá e viu tudo acontecer.\n\n"
 child_personality.7201.stubborn:0 "Seja feita a sua vontade, criança."
 child_personality.7201.t:0 "$child_personality.7200.t$"
 child_personality.7201.wrathful:0 "[other_child.GetFirstNameNoTooltip] precisava pagar pelo que [other_child.GetSheHe] fez!"
 child_personality.ambitious.desc:0 "agora parece estar certo de que [child.GetSheHe] está destinad[Select_CString( child.IsFemale, 'a', 'o' )] à grandeza, afirmando que [child.GetFaith.HighGodName] apoia [child.GetSheHe] indiscriminadamente."
 child_personality.arbitrary.desc:0 "Um dos servos os pegou em flagrante. [other_child.GetFirstNameNoTooltip] estava chorando e sangrando no chão, enquanto [child.GetFirstNameNoTooltip] simplesmente continuava brincando com sua [child.Custom('signature_weapon')] roubada...\n\nAparentemente, [child.GetFirstNameNoTooltip] não queria #EMP 'parar de se divertir só porque [other_child.GetFirstNameNoTooltip] errou'#!, o que acontecerá com [Select_CString( child.IsFemale, 'essa', 'esse' )] [child.Custom('GirlBoy')]..."
 child_personality.arrogant.desc:0 "\"[child.GetSheHe|U] se recusou a dar uma única moeda para #EMP ninguém!#!\" [teacher.GetFirstNameNoTooltip] exclama. \"Todos que encontramos eram ou 'indignos' ou 'abaixo [child.GetHerHim]'... no final, [child.GetSheHe] ficou com o ouro.\"\n\n[child.GetFirstNameNoTooltip] parece ter desenvolvido uma atitude arrogante..."
 child_personality.brave.desc:0 "[child.GetSheHe|U] entrou na caverna e não saiu por quase meia hora! Mas quando [child.GetSheHe] voltou, tinha recuperado o brinquedo, para a irritação de [other_child.GetFirstNameNoTooltip].\n\nMuito corajoso, embora talvez um pouco imprudente."
 child_personality.callous.desc:0 "[child.GetFirstNameNoTooltip] parece ter levado a lição... de certa forma... a sério.\n\nEmbora [child.GetSheHe] entenda o papel das classes mais baixas, [child.GetSheHe] também insiste que 'se um camponês para de pagar seus impostos, ele não tem mais utilidade e deve ser descartado' - uma visão muito insensível da vida humana..."
 child_personality.calm.desc:0 "Parece que [child.GetFirstNameNoTooltip] está tentando cansar [other_child.GetFirstNameNoTooltip] ao não reagir ao bullying [other_child.GetSheHe]. Não importa quantas vezes [other_child.GetFirstNameNoTooltip] chame [child.GetSheHe] de [child.Custom2('InsultNoun', SCOPE.sC('other_child'))] ou dê um tapa n[child.GetSheHe] na bochecha..."
 child_personality.chaste.desc:0 "[child.GetSheHe|U] parece um fantasma; tremendo, olhos arregalados, encarando as paredes...\n\nOh não... eu sei o que aconteceu. [child.GetSheHe|U] deve ter visto dois dos [ROOT.Char.Custom('lowly_servant_type')], hm, #EMP abatendo [ROOT.Char.Custom('GetLivestockFowlIndef')]#! juntos.\n\n[Select_CString( child.IsFemale, 'A', 'O' )] pobre [child.Custom('GirlBoy')] parece chocada, não ficaria surpreso se [child.GetSheHe] tiver dificuldade em encontrar intimidade quando [child.GetSheHe] crescer..."
 child_personality.compassionate.desc:0 "\"...e lavou #EMP todas#! as panelas! Até esfregou o caldeirão, sem eu sequer pedir! Isso é um gesto doce, [child.Custom('GirlBoy')] que você tem aí.\"\n\nIsso é realmente altruísta, mas será que esse ato condiz com a estatura de [child.GetFirstNameNoTooltip]?"
 child_personality.content.desc:0 "[child.GetFirstNameNoTooltip] tentou ler, mas rapidamente percebeu que as palavras ali eram melhor deixadas para os [child.GetFaith.PriestNeuterPlural].\n\n[child.GetSheHe|U] parece completamente satisfeito com a sua atual incapacidade de entender o significado mais profundo do livro..."
 child_personality.craven.desc:0 "Se um simples alfinete cair, [child.GetFirstNameNoTooltip] vai correr em busca da segurança de um armário vazio. [Select_CString( child.IsFemale, 'A', 'O' )] pobre [child.Custom('GirlBoy')] parece viver em constante medo..."
 child_personality.cynical.desc:0 "...e completamente estragaram! Páginas rasgadas, pegadas na capa - nenhum respeito nenhum!\n\nParece que o pequeno [child.GetFirstNameNoTooltip] não se importa com a palavra divina..."
 child_personality.deceitful.desc:0 "Um dos cozinheiros encontrou [child.GetFirstNameNoTooltip] se vingando ao cuspir na comida de [other_child.GetFirstNameNoTooltip] em segredo! Isso explica por que [other_child.GetFirstNameNoTooltip] tem parecido um pouco... #EMP verde#! durante o jantar – [child.GetSheHe] deve estar cuspindo na comida de [other_child.GetFirstNameNoTooltip] há dias, [Select_CString( child.IsFemale, 'a pequena ardilosa', 'o pequeno ardiloso' )]..."
 child_personality.diligent.desc:0 "\"[other_child.GetFirstNameNoTooltip] roubou um barril #EMP inteiro#! de [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')]! [child.GetFirstNameNoTooltip] tentou devolver por conta própria antes que eu percebesse – mas sem sorte para [child.GetSheHe]!\" [cook.GetSheHe|U] diz irritado.\n\nParece que [Select_CString( child.IsFemale, 'minha protegida é uma pequena encrenqueira', 'meu protegido é um pequeno encrenqueiro' )], mas teve uma mudança de coração!"
 child_personality.fickle.desc:0 "\"A criança desatenta não conseguia decidir para quem dar o ouro.\" [teacher.GetFirstNameNoTooltip] diz, visivelmente irritado/a. \"No final, [child.GetSheHe] deu uma moeda para o [ROOT.Char.Custom('lowly_servant_type')] de uma perna só, uma para um menino cego, usou outra moeda para comprar [child.Custom('FavoriteTreatDemand')], deu uma para #EMP mim#!, de todas as pessoas, e perdeu a última em um buraco.\"\n\nParece que o/a pequeno/a [child.GetFirstNameNoTooltip] não consegue tomar uma decisão..."
 child_personality.forgiving.desc:0 "\"Todos cometem erros!\" [child.GetFirstNameNoTooltip] exclama. \"Quando eu governar, vou perdoar e deixar viver - para que meu reino possa prosperar!\"\n\nTalvez [child.GetSheHe] seja [Select_CString( child.IsFemale, 'uma', 'um' )] governante #EMP muito#! indulgente...?"
 child_personality.generous.desc:0 "\"A [child.Custom('ComplimentAdjective')] criança deu algo para todos.\" [teacher.GetFirstNameNoTooltip] diz. \"E quando a bolsa ficou vazia, [child.GetSheHe] insistiu em ir buscar outra. Muito altruísta, talvez até excessivamente.\"\n\nParece que o/a pequeno/a [child.GetFirstNameNoTooltip] tem um coração muito generoso."
 child_personality.gluttonous.desc:0 "\"...mas [child.GetSheHe] devorou todos os doces que encontrou, como um porquinho! Agora [child.GetSheHe] está toda suada e vermelha de tanto comer...\" \n\n[child.GetFirstNameNoTooltip] nunca resistiu a coisas doces, mas isso pode estar indo um pouco longe..."
 child_personality.greedy.desc:0 "Mas parece que apenas as partes que mencionam #EMP ouro#! ficaram na cabeça...\n\nAgora, [child.GetSheHe] está impondo pequenos impostos a todos os servos que [child.GetSheHe] consegue alcançar, para o desgosto de todos."
 child_personality.gregarious.desc:0 "\"Eles roubaram um barril #EMP inteiro#! de [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')] e beberam a maior parte. Olha só eles agora – bêbados como lordes, os dois! Mal conseguem ficar em pé...\" [cook.GetSheHe|U] diz irritado.\n\nParece que [Select_CString( child.IsFemale, 'minha protegida', 'meu protegido' )] cedeu à pressão dos amigos, mas pelo menos [child.GetSheHe] e [other_child.GetFirstNameNoTooltip] parecem ser amigos inseparáveis."
 child_personality.honest.desc:0 "[other_child.GetFirstNameNoTooltip] havia machucado [other_child.GetHerselfHimself], mas felizmente [child.GetFirstNameNoTooltip] correu para fora e pegou o adulto mais próximo, admitindo tudo o que tinham feito.\n\n[child.GetFirstNameNoTooltip] parece genuinamente angustiado, acho que [child.GetSheHe] nunca mais será desonesto."
 child_personality.humble.desc:0 "Eles passaram horas tentando entender o que estava escrito em suas páginas, falando sobre [child.GetFaith.random_GoodGodNames] e os muitos mistérios do divino.\n\n[child.GetFirstNameNoTooltip] parece ter desenvolvido um profundo respeito pelas palavras da fé [child.GetFaith.GetAdjective]."
 child_personality.impatient.desc:0 "[child.GetFirstNameNoTooltip] foi apreendid[Select_CString( child.IsFemale, 'a', 'o' )] por um servo depois de derrubar uma armadura enquanto procurava um curativo para [other_child.GetFirstNameNoTooltip], que tinha se machucado.\n\nParece que [child.GetFirstNameNoTooltip] gosta de planos precipitados e desinformados..."
 child_personality.just.desc:0 "[child.GetFirstNameNoTooltip] parece ter levado a lição a sério, com um senso de justiça reforçado.\n\n[child.GetSheHe|U] está constantemente falando sobre como todos, 'Do mais alto [ROOT.Char.GetTitleTierName] ao mais baixo [ROOT.Char.Custom('lowly_servant_type')]', desempenham seu papel na economia do reino."
 child_personality.lazy.desc:0 "\"...mas [child.GetSheHe] deu uma beliscada em toda a comida como um ratinho e depois caiu no sono em cima de um saco de farinha! [child.GetSheHe|U] merecia uma surra, se me perguntar, mas vou deixar [child.GetSheHe] com você para fazer o que achar melhor!\"\n\nEssa criança é tão desmotivada e letárgica que você poderia confundi-la com um cadáver!"
 child_personality.lustful.desc:0 "[child.GetSheHe|U] parece um tolo; sorrindo, bochechas coradas, babando, mal ouvindo o que estou dizendo...\n\nOh não... eu sei o que aconteceu. [child.GetSheHe|U] deve ter visto dois dos [ROOT.Char.Custom('lowly_servant_type')], hm, #EMP fazendo amor com [ROOT.Char.Custom('GetLivestockFowlIndef')]#! juntos - esses são, sem dúvida, desejos nos olhos de [child.GetFirstNameNoTooltip]."
 child_personality.paranoid.desc:0 "Parece que até sombras tremulantes fazem [child.GetSheHe] pular de medo, talvez [Select_CString( child.IsFemale, 'a', 'o' )] pobre [child.Custom('GirlBoy')] veja seu agressor nelas? [child.GetSheHe|U] está sempre olhando por cima dos ombros, sempre alerta..."
 child_personality.patient.desc:0 "\"Devo deixar as coisas seguirem seu curso.\" [child.GetFirstNameNoTooltip] diz. \"Somente sendo paciente e permitindo que meus súditos trabalhem no seu próprio ritmo, poderei governar com sabedoria.\"\n\n[child.GetFirstNameNoTooltip] parece não perceber que alguns súditos desperdiçariam voluntariamente o tempo [child.GetHerHim]..."
 child_personality.sadistic.desc:0 "continua me contando o quanto [child.GetSheHe] gostou das passagens sobre #EMP [child.GetFaith.DevilName]#! e como [child.GetFaith.DevilSheHe] é alguém cujos ideais [child.GetSheHe] aspira emular..."
 child_personality.shy.desc:0 "Agora [child.GetSheHe] praticamente parou de falar e constantemente se esconde quando há pessoas por perto... [Select_CString( child.IsFemale, 'coitada da', 'coitado do' )] [child.Custom('GirlBoy')]..."
 child_personality.stubborn.desc:0 "[child.GetFirstNameNoTooltip] chamou os guardas da casa e obrigou [other_child.GetFirstNameNoTooltip] a entrar na caverna! Os gritos aterrorizados de [other_child.GetFirstNameNoTooltip] puderam ser ouvidos por vários minutos antes de [other_child.GetSheHe] surgir com o brinquedo.\n\nParece que quando [child.GetFirstName] acha que algo é a coisa certa a se fazer, [child.GetSheHe] não vai parar até conseguir..."
 child_personality.temperate.desc:0 "\"Eles roubaram um barril #EMP inteiro#! de [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')], e [child.GetFirstNameNoTooltip] apenas ficou ali enquanto [other_child.GetFirstNameNoTooltip] bebia até quase desmaiar!\" [cook.GetSheHe|U] diz irritado.\n\nParece que [Select_CString( child.IsFemale, 'minha protegida', 'meu protegido' )] protegeu seu parceiro no crime, vigiando enquanto abstinha-se de beber qualquer coisa [child.GetHerselfHimself]."
 child_personality.trusting.desc:0 "\"Meus súditos só desejam o meu bem!\" [child.GetFirstNameNoTooltip] exclama. \"Eu confiarei indiscriminadamente nos meus súditos - para que possamos construir o reino juntos!\"\n\nOh, doce criança ingênua... esse nível de confiança pode ser perigoso..."
 child_personality.vengeful.desc:0 "\"Você é [Select_CString( other_child.IsFemale, 'uma', 'um' )] [other_child.Custom2('InsultNoun', SCOPE.sC('child'))]!\" [child.GetFirstNameNoTooltip] grita. \"Mas você é [Select_CString( child.IsFemale, 'uma', 'um' )] [child.Custom2('InsultNoun', SCOPE.sC('other_child'))]!\" [other_child.GetFirstNameNoTooltip] grita de volta.\n\n[child.GetFirstNameNoTooltip] tem brigado com [other_child.GetFirstNameNoTooltip] todos os dias desde então! Não passa um minuto sem que [child.GetSheHe] planeje alguma forma de vingança mesquinha..."
 child_personality.wrathful.desc:0 "[child.GetFirstNameNoTooltip] ficou furios[Select_CString( child.IsFemale, 'a', 'o' )] e espancou [other_child.GetFirstNameNoTooltip] até [Select_CString( other_child.IsFemale, 'deixá-la ensanguentada', 'deixá-lo ensanguentado' )]! Isso não ajudou [Select_CString( other_child.IsFemale, 'a', 'o' )] [other_child.Custom('GirlBoy')] mais nov[Select_CString( other_child.IsFemale, 'a', 'o' )], que começou a chorar ainda mais...\n\nParece que [child.GetFirstNameNoTooltip] tem dificuldade em controlar a raiva..."
 child_personality.zealous.desc:0 "parece ter levado a sério, talvez um pouco #EMP demais#!. [child.GetSheHe|U] tem perseguido os criados por horas desde então, apontando como eles podem ser melhores [child.GetFaith.GetAdherentNamePlural]..."
 clever_child_opinion:0 "Criança Inteligente"
 delightfully_devilish_opinion:0 "Deliciosamente Diabólico"
 lazy_child_opinion:0 "Criança preguiçosa"
 little_pig_opinion:0 "[Select_CString( ROOT.Char.IsFemale, 'Pequena porquinha', 'Pequeno porquinho' )]"
 spoilsport_opinion:0 "Estraga-prazeres"
 sweet_child_opinion:0 "Criança doce"
 thankful_opinion:0 "Agradecido"
 worried_opinion:0 "Preocupado"
