l_spanish:
 child_personality.0001.a:0 "Pelo menos estou ficando muito, muito b[Select_CString( ROOT.Char.IsFemale, 'oa', 'om' )] em me esconder."
 child_personality.0001.b:0 "Eu quero ficar no meu quarto o dia todo, de qualquer maneira."
 child_personality.0001.bullying_1:0 "\n\nDesta vez, [bully.GetSheHe] ameaçou enfiar minha cabeça na abertura do muro da privada!"
 child_personality.0001.bullying_2:0 "\n\nDesta vez, [bully.GetSheHe] me seguiu o dia inteiro, fazendo barulhos de latidos e me chamando de vira-lata!"
 child_personality.0001.bullying_3:0 "\n\nDesta vez, [bully.GetSheHe] derrubou um candelabro e colocou a culpa em mim!"
 child_personality.0001.c:0 "Talvez eu possa fazer com que [bully.GetSheHe] seja enforcad[Select_CString( bully.IsFemale, 'a', 'o' )] por isso?"
 child_personality.0001.end:0 "\n\n[bully.GetSheHe|U] me assusta, mas o que posso fazer?"
 child_personality.0001.no_bully_fallback:0 "A filha do [ROOT.GetCharacter.Custom('lowly_servant_type')] é uma terrível valentona. Sempre que a vejo, ela inventou uma nova maneira de me atormentar. Ela é tão grande e forte, o que posso fazer mesmo?"
 child_personality.0001.opening:0 "Sempre que vejo [Select_CString( bully.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('bully'))] [bully.GetTitledFirstName], [bully.GetSheHe] inventou uma nova maneira de me atormentar."
 child_personality.0001.t:0 "Uma Figura Ameaçadora"
 child_personality.0002.a:0 "Esse criminoso nem deveria se atrever a olhar para mim!"
 child_personality.0002.b:0 "Vou buscar água para ele no poço."
 child_personality.0002.c:0 "Água? Espero que essa lama sirva!"
 child_personality.0002.guardian:0 "Enquanto passava pelas ruas com [Select_CString( guardian.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] [guardian.GetTitledFirstName], nos deparamos com a picota. Um homem estava preso ali, implorando por água ou qualquer tipo de alívio para o seu destino."
 child_personality.0002.no_guardian:0 "Enquanto passava pelas ruas, nos deparamos com a picota. Um homem estava preso ali, implorando por água ou qualquer tipo de alívio para o seu destino."
 child_personality.0002.t:0 "O Criminoso"
 child_personality.0003.a:0 "Fui desafiad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] para um jogo por uma das outras crianças."
 child_personality.0003.b:0 "Pensei que pudesse sair impune, mas nunca farei isso novamente."
 child_personality.0003.c:0 "Eu não tenho mais direito a nada do que os outros têm."
 child_personality.0003.guardian:0 "[Select_CString( guardian.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] [guardian.GetTitledFirstName] me pegou roubando o baú de viagem d[Select_CString( robbed_guest.IsFemale, 'a', 'o' )] [robbed_guest.GetTitledFirstNamePossessive] enquanto [robbed_guest.GetSheHe] estava visitando o castelo. Ameaçando punição, [guardian.GetFirstName] exigiu uma explicação."
 child_personality.0003.no_guardian:0 "Fui pego roubando o baú de viagem d[Select_CString( robbed_guest.IsFemale, 'a', 'o' )] [robbed_guest.GetTitledFirstNamePossessive] enquanto [robbed_guest.GetSheHe] estava visitando o castelo. Ameaçando punição, [robbed_guest.GetFirstName] exigiu uma explicação."
 child_personality.0003.t:0 "Pego em Flagrante!"
 child_personality.0004.a:0 "\"Dê a cada um o que lhe é devido, e você receberá o seu em troca.\""
 child_personality.0004.b:0 "\"Trabalhe duro, e você pode dominar qualquer coisa.\""
 child_personality.0004.c:0 "\"A grandeza vem com o tempo. Esteja preparado para agarrá-la quando chegar.\""
 child_personality.0004.desc:0 "Estou incrivelmente impressionad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por um dos $knight_culture_player_plural_no_tooltip_lowercase$ do castelo. Finalmente fui apresentad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a ele pessoalmente, e não estou menos impressionado agora. Lembrarei de suas palavras pelo resto da minha vida."
 child_personality.0004.desc_knight:0 "Estou incrivelmente impressionad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por um dos $knight_culture_player_plural_no_tooltip_lowercase$ do castelo. Finalmente fui apresentad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a [knight.GetSheHe] pessoalmente, e não estou menos impressionado agora. Lembrarei das palavras [knight.GetHerHim] pelo resto da minha vida."
 child_personality.0004.t:0 "Inspiração Cortesã"
 child_personality.0005.a:0 "Vou mostrar o que acontece com alguém que me empurra!"
 child_personality.0005.b:0 "Por que você está me empurrando? Eu só quero brincar com você."
 child_personality.0005.c:0 "Ah, espere, acabei de pensar em um jogo diferente!"
 child_personality.0005.desc:0 "Eu estava brincando com outras crianças quando [doing_push.GetFirstName] tentou me derrubar!\n\n[doing_push.GetSheHe|U] me persegue constantemente, tentando me empurrar sempre que [doing_push.GetSheHe] tem a chance... Está começando a me irritar, eu devo fazer algo a respeito."
 child_personality.0005.t:0 "Hora de Brincar"
 child_personality.0006.a:0 "Vou mostrar para eles o que significa me desprezar assim!"
 child_personality.0006.a_crush:0 "Vou mostrar para [crush.GetSheHe] o que significa me desprezar assim!"
 child_personality.0006.b:0 "Se isso é amor, eu não quero nada com isso."
 child_personality.0006.c:0 "Será que eles realmente pensam que eu desisto tão facilmente?"
 child_personality.0006.c_crush:0 "Será que [crush.GetSheHe] realmente pensa que eu desisto tão facilmente?"
 child_personality.0006.desc:0 "Uma [child.Custom('servant_for_romance')] comum roubou meu coração! Cada olhar na minha direção faz meu coração palpitar.\n\nNo entanto, quando me declarei, a [child.Custom('servant_for_romance')] me rejeitou com uma risada!"
 child_personality.0006.desc_crush:0 "Oh, passo noites e dias pensando [Select_CString( crush.IsFemale, 'na', 'no' )] [crush.GetTitledFirstName], e meu coração palpita sempre que vejo [crush.GetSheHe] pelos corredores do castelo!\n\nNo entanto, quando me declarei [crush.GetSheHe], [crush.GetSheHe] me rejeitou com uma risada, esmagando meu coração sob seus pés enquanto [crush.GetSheHe] se afastava."
 child_personality.0006.t:0 "Rejeição Dilacerante"
 child_personality.0007.a:0 "Foi demais. A punição deve ser proporcional ao crime."
 child_personality.0007.b:0 "Essa não é a lei de um reino justo."
 child_personality.0007.c:0 "Devemos estar satisfeitos com o que já temos."
 child_personality.0007.desc:0 "[Select_CString( guardian.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] [guardian.GetTitledFirstName] conversou comigo sobre a sentença capital que um ladrãozinho insignificante recebeu dois dias atrás.\n\n[guardian.GetSheHe|U] queria saber o que eu achava de uma pena tão severa por um crime tão pequeno."
 child_personality.0007.t:0 "Um Julgamento"
 child_personality.0008.a:0 "Tudo é tão brilhante!"
 child_personality.0008.b:0 "Os adultos podem ser tão divertidos de conversar!"
 child_personality.0008.c:0 "Não consigo parar de me obcecar pelo brilho nos olhos daquele servo!"
 child_personality.0008.desc:0 "Estar em um banquete é uma enxurrada de impressões. As pessoas estão conversando, o cheiro de toda sorte de comida enche minha cabeça. Os convidados estão vestindo roupas lindas, os servos estão carregando pratos intermináveis e—\n"
 child_personality.0008.desc_not_server:0 "\nNão consigo superar o quão impressionante tudo isso é! Que maravilhoso espetáculo de poder."
 child_personality.0008.servant_boy:0 "\nQual era o significado do piscar de olho do garoto de recados agora mesmo?"
 child_personality.0008.serving_wench:0 "\nQual foi o significado da piscadela daquela serva agora há pouco?"
 child_personality.0008.t:0 "Um Banquete para os Sentidos"
 child_personality.0009.a.tt:0 "Existe a chance de você ficar ferid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 child_personality.0009.a:0 "Eu vou te proteger!"
 child_personality.0009.b:0 "Vamos parar agora e conversar sobre isso."
 child_personality.0009.c:0 "É assim que vocês tratam alguém que prega a palavra divina!?"
 child_personality.0009.d:0 "Isso vai ser divertido!"
 child_personality.0009.desc:0 "Eu vi [Select_CString( child_preacher.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('child_preacher'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child_preacher'))] [child_preacher.GetTitledFirstName] conversando com outras crianças sobre [child_preacher.GetFaith.random_GoodGodNames]. Eles estavam rindo e zombando [child_preacher.GetHerHim] por um tempo antes de começarem a empurrar. Apesar da zombaria, [child_preacher.GetSheHe] tentou continuar a lição, até que o primeiro golpe caiu."
 child_personality.0009.desc_fallback:0 "Eu vi meu amigo conversando com outras crianças sobre [ROOT.Char.GetFaith.random_GoodGodNames]. Eles estavam rindo e zombando por um tempo antes de começarem a empurrar. Apesar da zombaria, meu amigo tentou continuar a lição, até que o primeiro golpe caiu."
 child_personality.0009.t:0 "[Select_CString( child_preacher.IsFemale, 'A Pequena Pregadora', 'O Pequeno Pregador' )]"
 child_personality.0010.a:0 "Essa será a maior presa que já abati!"
 child_personality.0010.b:0 "Ela está tão lenta, eu poderia esfaqueá-la e assistir ao sangramento até a morte."
 child_personality.0010.c:0 "Isso é um teste proposto por [guardian.GetFirstNameNoTooltip], não é?"
 child_personality.0010.desc:0 "[Select_CString( guardian.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] [guardian.GetTitledFirstName] me levou para a floresta para brincar com um arco. Correndo sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], não demorou muito para eu encontrar uma corça ferida, tentando fugir mancando de mim."
 child_personality.0010.t:0 "Uma Vida em Minhas Mãos"
 child_personality.0011.a:0 "Eu gosto bastante do tipo de estudo que estou fazendo agora."
 child_personality.0011.b:0 "Ah, na verdade, não quero mais um."
 child_personality.0011.c:0 "Eu vou estudar muito!"
 child_personality.0011.desc:0 "Eu venho desejando [ROOT.GetCharacter.Custom('child_object_of_interest_indefinite')] há muito tempo, e [Select_CString( guardian.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] [guardian.GetTitledFirstName] está prometendo me dar um em três meses se eu começar a ser mais rigoros[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com meus estudos."
 child_personality.0011.t:0 "Objeto do Meu Desejo"
 child_personality.0012.a:0 "Vou sair furtivamente. Talvez haja outras crianças por perto."
 child_personality.0012.b:0 "Não consigo lidar com tanta gente! Hora de me esconder debaixo da mesa."
 child_personality.0012.c:0 "Pelo menos posso continuar comendo enquanto estiver aqui!"
 child_personality.0012.desc:0 "Essa festa é barulhenta, os adultos são chatos e a comida não é muito boa.\n\n[Select_CString( guardian.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] [guardian.GetFirstName] parece estar se divertindo, então não consigo chamar a atenção [guardian.GetHerHim] para dizer que não quero estar aqui."
 child_personality.0012.t:0 "Uma Festa Bagunçada"
 child_personality.0021.a:0 "Então, minha imaginação pode fazer o resto..."
 child_personality.0021.desc:0 "Um dos poucos consolos em meu aprisionamento é observar as pessoas, mesmo que seja de trás das grades"
 child_personality.0021.desc_no_gender:0 "– todas as manhãs, espero conseguir apenas um olhar para [Select_CString( ROOT.Char.IsFemale, 'uma das serviçais bonitas', 'um dos serviçais bonitos' )]."
 child_personality.0021.servant_boy:0 "– todas as manhãs, espero conseguir apenas um olhar para aquele belo serviçal."
 child_personality.0021.serving_wench:0 "– toda manhã eu espero conseguir apenas um olhar para aquela bela serva."
 child_personality.0021.t:0 "Personalidade Emergente"
 child_personality.0022.a:0 "Isso me dá arrepios!"
 child_personality.0022.desc:0 "Eu me acostumei a ficar sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. Sem ninguém para conversar, brincar ou aprender junto. A mera ideia de outra pessoa me tocando agora..."
 child_personality.0023.a:0 "É uma das poucas alegrias que tenho!"
 child_personality.0023.desc:0 "Eu nunca sei quando vou receber minha próxima refeição, então quando um prato é dado a mim, devoro tudo sem hesitação, não importa a quantidade.\n\nSó quando estou chei[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] é que me sinto um pouco mais tranquil[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 child_personality.0024.a:0 "A moderação é essencial."
 child_personality.0024.desc:0 "Eu nunca sei quando vou conseguir minha próxima refeição, então quando um prato é dado para mim eu me forço a racionar a comida e ficar satisfeito com o que recebo.\n\nNo começo foi difícil, mas agora isso é algo natural."
 child_personality.0025.a:0 "Eu coleciono todos os tesouros que encontro."
 child_personality.0025.desc:0 "Uma colher descartada, um seixo brilhante, um prato quebrado... Uma vez eu desprezaria essas bugigangas, mas agora percebi que nada é verdadeiramente sem valor!"
 child_personality.0026.a:0 "O que é meu é... de todos!"
 child_personality.0026.desc:0 "Quando não se possui nada, um ato de bondade significa tudo - aprendi isso da maneira mais difícil. É incrível pensar no impacto que posso causar nas pessoas com um simples ato de generosidade!"
 child_personality.0027.a:0 "Eu vou voltar a dormir."
 child_personality.0027.desc:0 "Meus dias passam vagamente envoltos nessas barras. Eu acordo, ando de um lado para o outro, eu – esperançosamente – como...\n\nNão faz diferença se eu tento preencher meus dias com atividades ou não. Não faz diferença se eu tento de qualquer forma."
 child_personality.0028.a:0 "A diligência é fundamental!"
 child_personality.0028.desc:0 "Meus dias passam vagamente envoltos nessas barras. Eu acordo, ando de um lado para o outro, eu – esperançosamente – como...\n\nPara preencher meus dias com algo, aprendi a me dar tarefas e concluí-las bem."
 child_personality.0029.a:0 "Eu... só... ARGH!"
 child_personality.0029.desc:0 "Os guardas subservientes seguem todos os meus movimentos, [Select_CString( imprisoner.IsFemale, 'a', 'o' )] [imprisoner.Custom2('InsultNoun', ROOT.Char)] [imprisoner.Custom2('InsultAdjective', ROOT.Char)] [imprisoner.GetTitledFirstName] me mantém trancad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], os ratos se arrastam nos cantos escuros... Há uma raiva crescendo dentro de mim, e ela está ficando mais forte a cada dia que passa!"
 child_personality.0030.a:0 "Aprendi a levar tudo numa boa."
 child_personality.0030.desc:0 "Há pouco que posso fazer para afetar minha situação, tanto no dia a dia quanto em sentido mais amplo. Há pouco a fazer e pouco a dizer."
 child_personality.0031.a:0 "A paciência é fundamental."
 child_personality.0031.desc:0 "Há pouco que posso fazer para afetar minha situação, tanto no dia a dia quanto em sentido mais amplo. Só tenho que esperar e ver o que acontece."
 child_personality.0032.a:0 "Não posso desperdiçar o tempo que tenho!"
 child_personality.0032.desc:0 "Se ficar pres[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] atrás das barras me ensinou alguma coisa, é que as coisas não podem esperar; você nunca sabe o que vai acontecer em um dia, em uma hora, em um minuto! Será que estarei viv[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] até lá?"
 child_personality.0033.a:0 "Sou simplesmente muito b[Select_CString( ROOT.Char.IsFemale, 'oa', 'om' )]!"
 child_personality.0033.desc:0 "Quando me jogaram aqui dentro, questionei; por que eles me manteriam atrás das barras?\n\nÀ medida que os dias passam, percebo que é porque eles têm medo de mim; têm medo do que me tornarei e, por isso, me trancaram aqui."
 child_personality.0034.a:0 "Não peço muito."
 child_personality.0034.desc:0 "Quando me jogaram aqui dentro, questionei; por que eles me manteriam atrás das barras?\n\nÀ medida que os dias passam, percebo que devo ter feito algo para merecer isso e que devo ser grato por tudo o que a vida decide me dar apesar disso."
 child_personality.0035.a:0 "Apenas tolos falam a verdade."
 child_personality.0035.desc:0 "Se ficar pres[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] atrás das barras me ensinou alguma coisa, é que nada nesta vida é de graça; para conseguir o que você quer, você tem que trapacear e mentir. Tenho sorte de que meus guardas são facilmente enganados!"
 child_personality.0036.a:0 "Mentir só traz problemas de qualquer forma."
 child_personality.0036.desc:0 "Se ficar pres[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] atrás das barras me ensinou alguma coisa, é que as pessoas não hesitam em aplicar punições, e a melhor coisa que posso fazer é não dar a elas nenhum motivo. Além disso, sempre há alguém #EMPobservando#!."
 child_personality.0037.a:0 "Todo dia traz um novo medo..."
 child_personality.0037.desc:0 "Os guardas do lado de fora da minha prisão são tão musculosos quanto amargos, e eles observam todos os meus movimentos.\n\nMas quando tento me esconder, é apenas questão de tempo até que ratos, ou algo pior, se aproximem sorrateiramente de mim!"
 child_personality.0038.a:0 "Não temo nada."
 child_personality.0038.desc:0 "Os guardas do lado de fora da minha prisão são tão musculosos quanto amargos, e eles observam todos os meus movimentos. Há ratos nas sombras, e cada dia traz um novo horror.\n\n[imprisoner.GetTitledFirstName] terá que elevar o nível se [imprisoner.GetSheHe] quiser me assustar agora!"
 child_personality.0039.a:0 "As pessoas são assustadoras!"
 child_personality.0039.desc:0 "Passou muito tempo desde que vi outra pessoa, e não sei se estou devastad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ou aliviad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )].\n\nPor um lado, sinto falta de qualquer tipo de contato social após tanto tempo atrás das barras, mas, por outro lado, nunca sei mais o que dizer..."
 child_personality.0040.a:0 "Por favor, me conte mais!"
 child_personality.0040.desc:0 "Passar todos os dias atrás das barras é tão #EMPentediante#!! Uma das poucas coisas que me traz alegria são as conversas que consigo iniciar com os guardas; eles podem ser brutamontes, mas alguns deles são surpreendentemente interessantes!"
 child_personality.0041.a:0 "Nada me deterá!"
 child_personality.0041.desc:0 "Pensar em todas as coisas que passam por mim enquanto desperdiço minha vida atrás dessas barras me mantém acordad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] à noite; todas aquelas oportunidades, perdidas...\n\nQuando finalmente sair deste maldito buraco de prisão, vou compensar todo o tempo perdido!"
 child_personality.0042.a:0 "Independentemente de seu valor."
 child_personality.0042.desc:0 "Pres[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] nesta prisão, aprendi que não preciso de muito para me sustentar; opulência e riqueza não possuem valor intrínseco.\n\nQuando finalmente sair daqui, vou apreciar todas as coisas que tenho!"
 child_personality.0043.a:0 "Elas não significam nada!"
 child_personality.0043.desc:0 "Atrás dessas barras, aprendi uma lição valiosa: o único em quem você pode confiar verdadeiramente é você mesmo. O que a opinião das outras pessoas significa no final das contas? Aliás, o que as outras pessoas significam afinal?"
 child_personality.0044.a:0 "Sem leis, não somos melhores que animais."
 child_personality.0044.desc:0 "A injustiça que presenciei nesta prisão - tanto dos guardas quanto dos outros prisioneiros - é suficiente para me dar pesadelos.\n\nSe não podemos tratar uns aos outros com justiça, então qual é o sentido?!"
 child_personality.0045.a:0 "As pessoas só se importam consigo mesmas."
 child_personality.0045.desc:0 "As pessoas são egoístas; se há algo que meu tempo atrás das barras me ensinou, é isso.\n\nUma refeição inesperadamente decente? Os prisioneiros farão de tudo para roubar uns dos outros. Um guarda provocando-os para renunciar a [ROOT.Char.GetFaith.HighGodName] por um agrado? Sem hesitação."
 child_personality.0046.a:0 "Louvado seja [ROOT.Char.GetFaith.HighGodName]!"
 child_personality.0046.desc:0 "A única constante durante meu tempo atrás das barras tem sido [ROOT.Char.GetFaith.HighGodNameAlternate]. Sempre que estive abatid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], sempre que duvidei, [ROOT.Char.GetFaith.HighGodNameSheHe] esteve presente em minhas orações.\n\nÀ medida que os dias passam, tenho cada vez mais certeza de que nada importa verdadeiramente além da minha fé."
 child_personality.0047.a:0 "Sempre tem alguém observando..."
 child_personality.0047.desc:0 "Onde quer que eu vá, os guardas estão lá, observando. Mesmo quando acredito estar sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], eles soltam um comentário depois que me assegura que viram tudo; que sempre tenho olhos sobre mim."
 child_personality.0048.a:0 "Confio neles."
 child_personality.0048.desc:0 "[imprisoner.GetTitledFirstName] disse que eu seria vestid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] e alimentad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], e fui. Os guardas prometeram que não veria a luz do dia, e não vi.\n\nA única coisa da qual tenho certeza atrás dessas barras é que as pessoas geralmente falam a verdade."
 child_personality.0049.a:0 "A bondade é tudo o que importa."
 child_personality.0049.desc:0 "Há pouca felicidade para encontrar atrás dessas barras, e o menor gesto de bondade faz uma grande diferença. Ver a alegria nos olhos das outras pessoas, ver seus espíritos se elevarem... Nada me traz tanta calma."
 child_personality.0050.a:0 "Todos são capazes de crueldade."
 child_personality.0050.desc:0 "A injustiça que presenciei nesta prisão - tanto dos guardas quanto dos outros prisioneiros - é suficiente para me dar pesadelos. Ou... era. Agora nada mais me surpreende."
 child_personality.0051.a:0 "Essa sensação... Eu quero mais!"
 child_personality.0051.desc:0 "Alegria é escassa atrás dessas barras. Os guardas são tão antipáticos quanto são robustos, [imprisoner.GetTitledFirstName] é rude ou hostil, e meus colegas prisioneiros estão tão profundamente feridos para me entreter. Ou... pelo menos eu pensava. Quando um deles está sofrendo, sinto os resquícios de alegria se agitando em minha alma."
 child_personality.0052.a:0 "Eu sou a única constante neste lugar."
 child_personality.0052.desc:0 "Outras pessoas decidem o que como, quando e onde durmo, para onde vou... A única coisa que tenho atrás dessas barras é a minha convicção, e não vou ceder."
 child_personality.0053.a:0 "Quem sabe o que eu quero fazer?"
 child_personality.0053.desc:0 "Faz tanto tempo desde que fui livre que não me lembro como era segurar minha vida em minhas próprias mãos; tomar minhas próprias decisões. Agora, até mesmo a pergunta mais simples pode me confundir.\n\nEmbora às vezes seja difícil saber minhas preferências, isso também abre tantas portas!"
 child_personality.0054.a:0 "[imprisoner.GetTitledFirstNameNoTooltip], terei minha vingança."
 child_personality.0054.desc:0 "Se alguém te prejudica e você prontamente perdoa e esquece, certamente serão prejudicados novamente. Os guardas e os outros prisioneiros me ensinaram isso.\n\nFelizmente, há pouco a fazer nesta prisão além de lembrar."
 child_personality.0055.a:0 "Guardar rancor só traz dor."
 child_personality.0055.desc:0 "Quando você está preso com as mesmas pessoas dia após dia, percebe que nada é preto e branco; as pessoas sempre têm uma razão para agir da maneira como agem, e a maioria está dando o melhor de si.\n\nEu teria apenas inimigos ao meu redor nesta prisão se não perdoasse."
 child_personality.0061.a.tt:0 "#EMP Existe a chance de que você melhore sua diplomacia e desenvolva uma propensão para a bebida.#!"
 child_personality.0061.a:0 "Será que é a cura para minha timidez?"
 child_personality.0061.b:0 "Não, minha timidez é uma provação de [ROOT.Char.GetFaith.HighGodName]! Isso deve ser [ROOT.Char.GetFaith.DevilName] me tentando!"
 child_personality.0061.desc_ending:0 "Eu vislumbrei [Select_CString( guardian.IsFemale, 'a', 'o' )] [guardian.GetTitledFirstNameNoTooltip] durante um evento social, onde todos os presentes tinham um drinque na mão e sorrisos largos. Talvez haja alguma verdade no ditado de que o vinho ajuda a relaxar."
 child_personality.0061.desc_fallback:0 "Não sei se estou sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com esses pensamentos..."
 child_personality.0061.desc_gregarious:0 "[guardian.GetTitledFirstNameNoTooltip], [ROOT.GetCharacter.Custom2('RelationToMe' , guardian)], é meu completo oposto nesse sentido."
 child_personality.0061.desc_opening:0 "Não gosto de solidão, mas também tenho dificuldade em apreciar a companhia dos outros. Sempre sinto uma preocupação de estar me ridicularizando durante as interações sociais."
 child_personality.0061.desc_shy:0 "Assim, sinto uma forte afinidade com [Select_CString( guardian.IsFemale, 'a', 'o' )] [guardian.GetTitledFirstNameNoTooltip], [ROOT.GetCharacter.Custom2('RelationToMe' , guardian)], que parecem atormentados por pensamentos semelhantes."
 child_personality.0061.t:0 "A Influência de um Guardião"
 child_personality.101.arbitrary:0 "\n\n[child.GetSheHe|U] começou a perguntar como enforcar alguém, se [child.GetSheHe] sentisse que deveriam."
 child_personality.101.arbitrary_change:0 "Um valentão merece qualquer punição que você possa imaginar."
 child_personality.101.confirm_craven:0 "Bom. Não procure problemas quando não forem necessários."
 child_personality.101.confirm_lazy:0 "Você não precisa enfrentar o mundo se não quiser."
 child_personality.101.craven:0 "\n\n[child.GetSheHe|U] tem se escondido por todo o castelo para evitar enfrentar a outra criança."
 child_personality.101.craven_change:0 "Certifique-se de ficar escondido onde quer que vá!"
 child_personality.101.desc:0 "[child.GetTitledFirstName] veio até mim reclamando que [Select_CString( bully.IsFemale, 'a', 'o' )] [bully.GetTitledFirstName] está intimidando [child.GetSheHe]."
 child_personality.101.desc_no_bully:0 "[child.GetTitledFirstName] veio até mim reclamando que [Select_CString( child.IsFemale, 'uma', 'um' )] [child.Custom('GetDaughterSon')] de um[Select_CString( child.IsFemale, 'a', '' )] [child.Custom('lowly_servant_type')] está intimidando [child.GetSheHe]."
 child_personality.101.lazy:0 "\n\n[child.GetSheHe|U] tem ficado na cama por dias para evitar enfrentar a outra criança."
 child_personality.101.lazy_change:0 "Por que não se esconder em seu quarto em vez disso?"
 child_personality.1011.t:0 "[child.GetFirstNameNoTooltip] se Escondendo"
 child_personality.1012.t:0 "Trancado em seu Quarto"
 child_personality.1013.confirm_arbitrary:0 "Sua vontade é a única lei que realmente importa."
 child_personality.1013.t:0 "Questões de Punição"
 child_personality.102.arrogant:0 "\n\n[child.GetFirstNameNoTooltip] ergueu a cabeça e fez um show de ignorar as súplicas do criminoso por água."
 child_personality.102.arrogant_change:0 "Esse criminoso nem vale a sua atenção."
 child_personality.102.callous:0 "\n\n[child.GetFirstNameNoTooltip] observou-o por um tempo. Quando ele apenas tossiu e implorou por água, [child.GetFirstNameNoTooltip] revirou os olhos e continuou andando."
 child_personality.102.callous_change:0 "Cuspa nele. Bata nele. Ele merece nada menos."
 child_personality.102.compassionate:0 "\n\nQuando o homem implorou por água, [child.GetFirstNameNoTooltip] imediatamente prometeu trazer e logo voltou de um poço próximo, deixando o criminoso beber em suas mãos conchas."
 child_personality.102.compassionate_change:0 "Não, criança, traga água para o pobre homem que pede."
 child_personality.102.confirm_arrogant:0 "Ótimo, deixe-o saber o seu lugar."
 child_personality.102.confirm_callous:0 "Um criminoso merece nada além de desprezo de você."
 child_personality.102.confirm_compassionate:0 "Sem bondade, o mundo se desmorona."
 child_personality.102.desc:0 "Enquanto eu estava no mercado com [Select_CString( child.IsFemale, 'a', 'o' )] [child.GetTitledFirstName], a atenção [child.GetHerHim] foi capturada por um criminoso acorrentado na picota."
 child_personality.102.desc_court_location:0 "Enquanto eu estava no [court_location.Custom('BaronyTownType')] com [Select_CString( child.IsFemale, 'a', 'o' )] [child.GetTitledFirstName], a atenção [child.GetHerHim] foi capturada por um criminoso acorrentado na picota."
 child_personality.1021.t:0 "Camponeses Indignos"
 child_personality.1022.t:0 "Aliviando a Dor"
 child_personality.1023.t:0 "Sal na Ferida"
 child_personality.103.confirm_deceitful:0 "Você precisa aprender a se safar com suas mentiras."
 child_personality.103.confirm_honest:0 "A honestidade será sua melhor aliada a longo prazo, criança."
 child_personality.103.confirm_humble:0 "Somos todos pequenas peças do mundo."
 child_personality.103.deceitful:0 "\n[child.GetSheHe|U] culpou um jogo inventado por outra criança, mas eu pude perceber que [child.GetSheHe] estava mentindo."
 child_personality.103.deceitful_change:0 "Não, precisamos encobrir suas ações erradas!"
 child_personality.103.desc:0 "Fiquei chocado quando peguei [Select_CString( child.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetTitledFirstName] tentando roubar o baú de viagem d[Select_CString( robbed_guest.IsFemale, 'a', 'o' )] visitante [robbed_guest.GetTitledFirstName]."
 child_personality.103.honest:0 "\n[child.GetSheHe|U] confessou que [child.GetSheHe] achava que poderia se safar, mas agora sabe que foi errado."
 child_personality.103.honest_change:0 "Seja honest[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] e verá que os outros se abrirão para você."
 child_personality.103.humble:0 "\n[child.GetSheHe|U] fez um discurso impressionante sobre como [child.GetSheHe] agora entende por que o que [child.GetSheHe] fez estava errado."
 child_personality.103.humble_change:0 "Todos nós somos guiados por regras maiores do que nós mesmos, criança."
 child_personality.1031.t:0 "O Pagamento de um Mentiroso"
 child_personality.1032.t:0 "Servo da Honestidade"
 child_personality.1033.t:0 "Bem-aventurados os Mansos"
 child_personality.104.confirm_diligent:0 "De fato. O trabalho árduo levará [child.GetSheHe] onde [child.GetSheHe] deseja."
 child_personality.104.confirm_generous:0 "Conforme os outros crescem ao redor [child.GetHerHim], assim também [child.GetSheHe] crescerá."
 child_personality.104.confirm_patient:0 "Sim, as oportunidades sempre chegam a seu tempo."
 child_personality.104.desc:0 "[child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tem se impressionado com um dos $knight_culture_player_plural_no_tooltip$ da casa por muito tempo. Após finalmente conhecer pessoalmente, [child.GetSheHe] tem repetido as palavras do guerreiro para [child.GetHerselfHimself]."
 child_personality.104.diligent:0 "\n\n\"Trabalhe duro, e você poderá dominar qualquer coisa.\""
 child_personality.104.diligent_change:0 "[child.GetSheHe|U] deve aprender que o trabalho árduo sempre traz resultados."
 child_personality.104.generous:0 "\n\n\"Dê a cada um o que lhe é devido, e receberá o seu em troca.\""
 child_personality.104.generous_change:0 "[child.GetSheHe|U] nunca deve esquecer o papel que os outros desempenham em sua grandeza."
 child_personality.104.patient:0 "\n\n\"A grandeza chega com o tempo. Esteja lá para agarrá-la quando isso acontecer.\""
 child_personality.104.patient_change:0 "Todas as coisas precisam de tempo, querida [child.GetFirstNameNoTooltip]."
 child_personality.1041.t:0 "O Dom da Generosidade"
 child_personality.1042.t:0 "Trabalho e Dedicação"
 child_personality.1043.t:0 "Tudo a seu Tempo"
 child_personality.105.confirm_fickle:0 "Seguir em frente muitas vezes é a melhor abordagem."
 child_personality.105.confirm_forgiving:0 "[child.GetFirstNameNoTooltip] sabe virar a outra face quando necessário."
 child_personality.105.confirm_wrathful:0 "[child.GetFirstNameNoTooltip] respondeu à altura!"
 child_personality.105.desc:0 "Eu estava observando [Select_CString( child.IsFemale, 'a', 'o' )] [child.GetTitledFirstName] brincar com outras crianças quando [Select_CString( doing_push.IsFemale, 'a', 'o' )] [doing_push.GetTitledFirstName] tentou derrubá-l[Select_CString( child.IsFemale, 'a', 'o' )]."
 child_personality.105.fickle:0 "O momento não durou muito, pois [child.GetFirstName] logo inventou um novo jogo completamente e esqueceu o jogo anterior por completo."
 child_personality.105.fickle_change:0 "[child.GetFirstNameNoTooltip] não deve se prender a assuntos como esse."
 child_personality.105.forgiving:0 "\n[child.GetFirstName] levou tudo numa boa e sentou-se para conversar com [doing_push.GetFirstName] em vez disso."
 child_personality.105.forgiving_change:0 "[child.GetFirstNameNoTooltip] deve ser ensinad[Select_CString( child.IsFemale, 'a', 'o' )] a virar a outra face."
 child_personality.105.wrathful:0 "Logo uma briga começou entre as crianças!"
 child_personality.105.wrathful_change:0 "[child.GetSheHe|U] nunca deve permitir que os outros pisem n[child.GetSheHe]!"
 child_personality.1051.t:0 "Pronto para a Ira"
 child_personality.1052.t:0 "Equilibrado"
 child_personality.1053.t:0 "Interesses Variáveis"
 child_personality.106.chaste:0 "\n\nA rejeição parece ter deixado [child.GetFirstName] desconfiad[Select_CString( child.IsFemale, 'a', 'o' )] de qualquer tipo de atração."
 child_personality.106.chaste_change:0 "Talvez o amor não seja para [child.GetFirstNameNoTooltip]..."
 child_personality.106.confirm_chaste:0 "Não se deve se envolver em assuntos de luxúria de forma alguma."
 child_personality.106.confirm_stubborn:0 "Se falhar na primeira vez, tudo o que se pode fazer é tentar novamente."
 child_personality.106.confirm_vengeful:0 "Ah, vícios infantis."
 child_personality.106.desc:0 "[child.GetTitledFirstName] tem guardado um afeto secreto [Select_CString( crush.IsFemale, 'pela', 'pelo' )] [crush.GetTitledFirstName] há algum tempo. No entanto, quando [child.GetSheHe] finalmente confessou seus sentimentos, [crush.GetFirstName] respondeu de forma rude."
 child_personality.106.stubborn:0 "\n\n[child.GetFirstName] ainda persegue [crush.GetSheHe] obstinadamente."
 child_personality.106.stubborn_change:0 "[child.GetFirstNameNoTooltip] não deve desistir tão facilmente!"
 child_personality.106.vengeful:0 "\n\nAgora [child.GetFirstName] resmunga sempre que [crush.GetSheHe] passa."
 child_personality.106.vengeful_change:0 "[child.GetFirstNameNoTooltip] não deve permitir que ninguém a trate assim!"
 child_personality.1061.t:0 "Ressentimento Duradouro"
 child_personality.1062.t:0 "Perda de Interesse"
 child_personality.1063.t:0 "Persistência"
 child_personality.107.confirm_cynical:0 "Não espere ver a justiça de [child.GetFaith.HighGodName]."
 child_personality.107.confirm_just:0 "A punição realmente não condizia com o crime."
 child_personality.107.confirm_temperate:0 "Ultrapassar os limites pode ser terrivelmente perigoso."
 child_personality.107.cynical:0 "\n\n[child.GetSheHe|U] expressou dúvidas sobre se algum deus poderia querer que um reino fosse governado por uma lei tão rigorosa."
 child_personality.107.cynical_change:0 "É hora de mostrar a [child.GetSheHe] o quanto [ROOT.Char.GetFaith.HighGodName] se importa."
 child_personality.107.desc:0 "[child.GetTitledFirstName] tem emitido um julgamento severo sobre [Select_CString( crush.IsFemale, 'a', 'o' )] [crush.GetTitledFirstName] por um tempo. No entanto, quando [child.GetSheHe] finalmente confessou seus sentimentos, [crush.GetFirstName] respondeu de forma rude."
 child_personality.107.just:0 "\n\n[child.GetSheHe|U] respondeu que a sentença era muito severa para um crime tão pequeno."
 child_personality.107.just_change:0 "[child.GetSheHe|U] deve ser ensinad[Select_CString( child.IsFemale, 'a', 'o' )] a aplicar corretamente a lei."
 child_personality.107.temperate:0 "\n\n[child.GetSheHe|U] afirmou que havia aprendido uma lição sobre não buscar mais do que se pode lidar."
 child_personality.107.temperate_change:0 "Esta é uma lição sobre moderação em todas as coisas."
 child_personality.1071.t:0 "Um Julgamento Severo"
 child_personality.1072.t:0 "Em Nome do Divino"
 child_personality.1073.t:0 "Moderação Inspirada"
 child_personality.108.confirm_greedy:0 "Esses são os símbolos de poder pelos quais nosso mundo é governado."
 child_personality.108.confirm_gregarious:0 "Nunca é demais fazer amigos."
 child_personality.108.confirm_lustful:0 "Ah, o jovem está amadurecendo, não é verdade?"
 child_personality.108.desc:0 "[child.GetTitledFirstName] parecia ter desfrutado imensamente de nossa última festa!"
 child_personality.108.greedy:0 "\nDentre todas as coisas, [child.GetSheHe] não conseguia parar de falar sobre as roupas luxuosas e o ouro reluzente que [child.GetSheHe] viu lá."
 child_personality.108.greedy_change:0 "Note como o verdadeiro valor reside nos luxuosos símbolos de poder!"
 child_personality.108.gregarious:0 "\n[child.GetSheHe|U] se deu muito bem com todos com quem conversou, até mesmo com os convidados adultos."
 child_personality.108.gregarious_change:0 "Eu mostrarei a [child.GetSheHe] como fazer amizades em uma festa!"
 child_personality.108.lustful:0 "\nDepois, [child.GetSheHe] não conseguia parar de falar sobre os sentimentos que trocar olhares com um dos jovens serviçais causou n[child.GetSheHe]."
 child_personality.108.lustful_change:0 "Eu vi como você olhou para aquele serviçal, [child.GetFirstNameNoTooltip]."
 child_personality.1081.t:0 "Um Olhar Atento"
 child_personality.1082.t:0 "Fazendo Amizades"
 child_personality.1083.t:0 "Uma Troca Inadequada"
 child_personality.109.brave:0 "\n\n[child.GetTitledFirstName] interveio e fez o que [child.GetSheHe] pôde para proteger [child_preacher.GetHerHim]."
 child_personality.109.brave_change:0 "Não tenha medo. Avance quando necessário."
 child_personality.109.brave_fallback:0 "\n\n[child.GetTitledFirstName] interveio e fez o que [child.GetSheHe] pôde para proteger o pequeno pregador."
 child_personality.109.calm:0 "\n\n[child.GetTitledFirstName] interveio e conseguiu interromper a briga antes que alguém se machucasse."
 child_personality.109.calm_change:0 "Deixe-me lhe mostrar como você poderia ter mediado isso..."
 child_personality.109.confirm_brave:0 "Nunca recue diante de um desafio, [child.GetFirstNameNoTooltip]."
 child_personality.109.confirm_calm:0 "Manter a calma diante da pressão é extremamente importante."
 child_personality.109.confirm_zealous:0 "Você servirá bem ao divino, criança!"
 child_personality.109.desc:0 "Houve uma confusão entre as crianças hoje. [child_preacher.GetTitledFirstName] estava tentando pregar entre seus companheiros mais jovens e se tornou alvo de uma pequena briga."
 child_personality.109.desc_fallback:0 "Houve uma confusão entre as crianças hoje. Uma criança estava tentando pregar entre seus companheiros mais jovens e se tornou alvo de uma pequena briga."
 child_personality.109.zealous:0 "\n\n[child.GetTitledFirstName] estava furios[Select_CString( child.IsFemale, 'a', 'o' )] que alguém pudesse atacar alguém que estivesse tentando falar em nome de [child.GetFaith.random_GoodGodNames], e afastou as outras crianças."
 child_personality.109.zealous_change:0 "Nunca permita que alguém despreze o divino dessa maneira."
 child_personality.1091.t:0 "Participando Ativamente"
 child_personality.1092.t:0 "O Jovem Mediador"
 child_personality.1093.t:0 "Defensor da Fé"
 child_personality.110.ambitious:0 "\n\n[child.GetSheHe|U] não hesitou nem um pouco em abatê-la."
 child_personality.110.ambitious_change:0 "Então me mostre que você seria capaz de derrubar um animal por si mesmo!"
 child_personality.110.confirm_ambitious:0 "A grandeza te espera, [child.GetFirstNameNoTooltip]."
 child_personality.110.confirm_paranoid:0 "Sim, foi definitivamente um teste. Muito bem, [child.GetFirstNameNoTooltip]."
 child_personality.110.confirm_sadistic:0 "É apenas um animal."
 child_personality.110.desc:0 "Levei [child.GetFirstName] para brincar com um arco, e para minha surpresa [child.GetSheHe] encontrou uma corça ferida."
 child_personality.110.paranoid:0 "\n\nMais tarde, [child.GetSheHe|U] se enfureceu comigo, achando que eu tinha encenado todo o encontro como algum tipo de teste."
 child_personality.110.paranoid_change:0 "Isso foi um teste. Espero que você se saia melhor da próxima vez."
 child_personality.110.sadistic:0 "\n\nQuando [child.GetSheHe] me mostrou o animal, suas feridas eram evidência de uma morte lenta e torturante. [child.GetFirstNameNoTooltip] apenas sorriu."
 child_personality.110.sadistic_change:0 "Sempre alguém sofre. Certifique-se de que não seja você."
 child_personality.1101.t:0 "Com Certeza"
 child_personality.1102.t:0 "Com Alegria"
 child_personality.1103.t:0 "Com Suspeita"
 child_personality.111.confirm_content:0 "Todos aprendemos a lidar com o que temos na vida."
 child_personality.111.confirm_fickle:0 "Mudar de ideia é sinal de uma mente saudável."
 child_personality.111.confirm_trusting:0 "Eu nunca enganaria você, [child.GetFirstNameNoTooltip]."
 child_personality.111.content:0 "\n\n[child.GetSheHe|U] respondeu que estava bem com a dedicação atual aos estudos, recompensa ou não."
 child_personality.111.content_change:0 "[child.GetSheHe|U] deve se concentrar nas bênçãos que já possui."
 child_personality.111.desc:0 "[child.GetTitledFirstName] tem me pedido [child.Custom('child_object_of_interest_indefinite')] há muito tempo, e eu disse a [child.GetSheHe] que conseguiria um para [child.GetSheHe] em três meses se [child.GetSheHe] demonstrasse mais foco em seus estudos."
 child_personality.111.fickle:0 "\n\n[child.GetSheHe|U] simplesmente ignorou minha oferta, dizendo que não se importava mais com isso."
 child_personality.111.fickle_change:0 "Devo ensinar [child.GetSheHe] a pensar de forma mais flexível."
 child_personality.111.trusting:0 "\n\nDesde que fiz a promessa, [child.GetSheHe] tem redobrado o esforço nos estudos."
 child_personality.111.trusting_change:0 "[child.GetFirstNameNoTooltip] precisa aprender a confiar em mim."
 child_personality.1111.t:0 "Bastante Satisfeito"
 child_personality.1112.t:0 "Mudando de Ideia"
 child_personality.1113.t:0 "Confiando em Mim"
 child_personality.112.confirm_gluttonous:0 "Comida sempre traz alegria!"
 child_personality.112.confirm_impatient:0 "Se você tem coisas melhores para fazer, faça essas coisas."
 child_personality.112.confirm_shy:0 "O importante é que os convidados saibam que você estava lá."
 child_personality.112.desc:0 "[child.GetTitledFirstName] parece ter tido dificuldades em nosso último banquete."
 child_personality.112.gluttonous:0 "[child.GetSheHe|U] mergulhou o rosto na comida e a única coisa que [child.GetSheHe] fez foi pedir por porções após porções."
 child_personality.112.gluttonous_change:0 "Concentre-se na comida se a companhia te incomoda."
 child_personality.112.impatient:0 "[child.GetSheHe|U] saiu furtivamente cedo e não foi vist[Select_CString( child.IsFemale, 'a', 'o' )] pelo resto da noite."
 child_personality.112.impatient_change:0 "Se foi um incômodo, então você simplesmente deveria ter ido embora."
 child_personality.112.shy:0 "[child.GetSheHe|U] se escondeu debaixo de uma das mesas e lá ficou escondid[Select_CString( child.IsFemale, 'a', 'o' )] das pessoas durante toda a refeição."
 child_personality.112.shy_change:0 "É um dever ser visto, quer você queira ou não!"
 child_personality.1121.t:0 "Escapando"
 child_personality.1122.t:0 "Solidão no Salão"
 child_personality.1123.t:0 "O Pequeno Gourmand"
 child_personality.2001.a:0 "O que [child.GetSheHe] é, um covarde?"
 child_personality.2001.craven:0 "\n\nEu juro, se eu não soubesse melhor, diria que [child.GetSheHe] está se escondendo de mim."
 child_personality.2001.desc:0 "Eu gosto de brincar com [Select_CString( child.IsFemale, 'a', 'o' )] [child.GetTitledFirstName], deixando [child.GetSheHe] saber quando [child.GetSheHe] age de forma estranha, às vezes empurrando [child.GetSheHe] um pouco."
 child_personality.2001.t:0 "Perdido de Vista"
 child_personality.2002.a:0 "[child.GetSheHe|U] não é nada divertid[Select_CString( child.IsFemale, 'a', 'o' )]."
 child_personality.2002.lazy:0 "\n\nAgora [child.GetSheHe] passa o dia todo trancad[Select_CString( child.IsFemale, 'a', 'o' )] no quarto, sem fazer nada."
 child_personality.2002.t:0 "Trancad[Select_CString( child.IsFemale, 'a', 'o' )]"
 child_personality.2003.a:0 "Isso é severo!"
 child_personality.2003.arbitrary:0 "\n\nAgora [child.GetSheHe] já teve o suficiente e correu para os adultos dizendo que eu deveria ser enforcad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por isso!"
 child_personality.2003.t:0 "Exigência Irreversível"
 child_personality.2004.a:0 "Estou feliz por ter um amigo como [child.GetFirstNameNoTooltip] por perto."
 child_personality.2004.desc:0 "Eu pensei que [Select_CString( child.IsFemale, 'a', 'o' )] [child.GetTitledFirstName] ia brigar comigo depois de eu acidentalmente empurrá-l[Select_CString( child.IsFemale, 'a', 'o' )] enquanto brincava, mas a raiva del[Select_CString( child.IsFemale, 'a', 'e' )] passou rapidamente.\n\nEm vez disso, começamos a conversar e depois brincar mais. Foi muito divertido, e agora brincamos todos os dias!"
 child_personality.2004.t:0 "De Briga para Amizade"
 child_personality.2005.a:0 "[child.GetSheHe|U] precisa parar com isso de uma vez!"
 child_personality.2005.b:0 "É fofo que [child.GetSheHe] não desista."
 child_personality.2005.c:0 "[child.GetFirstNameNoTooltip]? Quem é ess[Select_CString( child.IsFemale, 'a', 'e' )]?"
 child_personality.2005.desc:0 "[child.GetTitledFirstName] me pediu tantas vezes para brincar e passear com [child.GetSheHe] que eu finalmente tive que deixar claro que eu simplesmente não quero.\n\nDesanimad[Select_CString( child.IsFemale, 'a', 'o' )] no começo, logo ficou claro que [child.GetSheHe] não desistiria de tentar me fazer gostar del[Select_CString( child.IsFemale, 'a', 'e' )]."
 child_personality.2005.t:0 "Persistência"
 child_personality.2006.a:0 "Nós temos sido próximos desde então."
 child_personality.2006.bully:0 "Apesar de como [child.GetSheHe] me tratou no passado, [child.GetTitledFirstName] foi o único que se atreveu a intervir e se certificou de que eu ficasse segur[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 child_personality.2006.desc:0 "O único que se atreveu a intervir foi [Select_CString( child.IsFemale, 'a', 'o' )] [child.GetTitledFirstName], que se certificou de que eu ficasse segur[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]"
 child_personality.2006.opening:0 "Eu estava tentando ensinar as outras crianças o que sei sobre Deus quando elas começaram a zombar de mim e levantar os punhos contra mim."
 child_personality.2006.t:0 "M[Select_CString( child.IsFemale, 'inha', 'eu' )] Salvador[Select_CString( child.IsFemale, 'a', '' )]"
 child_personality.2006.victim:0 "Apesar de como eu tratei [child.GetSheHe] no passado, [child.GetTitledFirstName] foi o único que se atreveu a intervir e se certificou de que eu ficasse segur[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 child_personality.2007.a:0 "Eu estava apenas me divertindo um pouco, idiota!"
 child_personality.2007.desc:0 "[child_preacher.GetTitledFirstName] estava falando com muitas crianças sobre [child_preacher.GetFaith.HighGodName] e começou a me irritar.\n\nEu estava apenas provocando [child_preacher.GetSheHe] um pouco quando [Select_CString( child.IsFemale, 'a', 'o' )] [child.GetTitledFirstName] do nada começou a me bater ferozmente, dizendo para eu deixar [child_preacher.GetFirstName] em paz."
 child_personality.2007.t:0 "Um Encontro"
 child_personality.3001.a:0 "Há tantas perguntas!"
 child_personality.3001.desc:0 "Há tanto para ver, cheirar e tocar! De onde você vem? Por que o céu é azul? O que está além daquela colina? Por favor, por favor, eu quero ir descobrir!"
 child_personality.3001.message:0 "[Select_CString( personality_child.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', personality_child)] [personality_child.GetTitledFirstName] está sempre chei[Select_CString( personality_child.IsFemale, 'a', 'o' )] de perguntas!"
 child_personality.3001.t:0 "O quê? Por quê? Como?"
 child_personality.3002.a:0 "Quando um pai e uma mãe se amam muito..."
 child_personality.3002.desc:0 "Nunca há um momento de silêncio! [Select_CString( personality_child.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , personality_child) ] [personality_child.GetTitledFirstName] está sempre chei[Select_CString( personality_child.IsFemale, 'a', 'o' )] de perguntas! Eu faço o meu melhor para incentivar a curiosidade [personality_child.GetHerHim], mas às vezes não consigo evitar ficar exaust[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com o fluxo constante de pensamentos e perguntas."
 child_personality.3003.a:0 "Eu faço o que quero!"
 child_personality.3003.desc:0 "[Select_CString( guardian.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))] [guardian.GetFirstName] continua me ordenando a ficar quiet[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] e sentad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], mesmo que eu diga a [guardian.GetSheHe] que é impossível! É como se meus braços e pernas estivessem se movendo por conta própria e, se eu não os seguir, eles vão cair e fugir sem mim!"
 child_personality.3003.message:0 "[Select_CString( personality_child.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe',personality_child)] [personality_child.GetTitledFirstName] está sempre aprontando algo!"
 child_personality.3003.t:0 "Uma Fogueira Acesa"
 child_personality.3004.a:0 "Nunca há um momento de tédio!"
 child_personality.3004.desc:0 "Embora eu espere travessuras [Select_CString( personality_child.IsFemale, 'da minha', 'do meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , personality_child)], a criatividade del[Select_CString( personality_child.IsFemale, 'a', 'e' )] me deixa sempre alerta. Quando não é uma travessura, é uma briga, um tutor insatisfeito ou joelhos ralados de uma aventura que deu errado."
 child_personality.3004.t:0 "Uma Criadora de Problemas"
 child_personality.3005.a:0 "Eles não são meus chefes!"
 child_personality.3005.desc:0 "[Select_CString( guardian.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))] [guardian.GetFirstName] continua me pedindo para deixar as outras crianças escolherem os jogos às vezes, mas por que eu deveria fazer isso, se eu sempre sei qual é o melhor? Estou cansad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [guardian.GetHerHim] e de todos os outros adultos me dizendo o que fazer!"
 child_personality.3005.message:0 "[Select_CString( personality_child.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe',personality_child)] [personality_child.GetTitledFirstName] realmente sabe o que [personality_child.GetSheHe] quer!"
 child_personality.3005.t:0 "Um Governante em Ascensão"
 child_personality.3006.a:0 "Formidável ou irritante - é uma linha tênue a percorrer."
 child_personality.3006.desc:0 "Não há fim para as opiniões e desejos [Select_CString( personality_child.IsFemale, 'da minha', 'do meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , personality_child)], [personality_child.GetTitledFirstName]. Metade do tempo, [personality_child.GetSheHe] está tentando me dizer o que fazer, em vez de ser ao contrário!"
 child_personality.3007.a:0 "E todo mundo é tão fácil de enganar!"
 child_personality.3007.desc:0 "'Seja gentil e trabalhe duro', [Select_CString( guardian.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))] [guardian.GetFirstName] continua me dizendo. Eu faço o meu melhor, mas às vezes é simplesmente exaustivo! Não é mais inteligente trapacear e mentir um pouco para conseguir o que eu quero?!"
 child_personality.3007.message:0 "[Select_CString( personality_child.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', personality_child)] [personality_child.GetTitledFirstName] é astut[Select_CString( personality_child.IsFemale, 'a', 'o' )] e sorrateir[Select_CString( personality_child.IsFemale, 'a', 'o' )]!"
 child_personality.3007.t:0 "Trabalhe de Forma Inteligente, Não Difícil"
 child_personality.3008.a:0 "Vou ficar de olho ness[Select_CString( personality_child.IsFemale, 'a', 'e' )] aqui."
 child_personality.3008.desc:0 "Assim como outras crianças da idade [Select_CString( personality_child.IsFemale, 'dela, minha', 'dele, meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , personality_child)] [personality_child.GetTitledFirstName] às vezes mente e testa os limites. No entanto, [personality_child.GetSheHe] geralmente evita suspeitas com seu jeito doce, e as pessoas sempre [Select_CString( personality_child.IsFemale, 'a', 'o' )] perdoam quando [personality_child.GetSheHe] é peg[Select_CString( personality_child.IsFemale, 'a', 'o' )].\n\nFico pensando o quanto [personality_child.GetSheHe] consegue se safar..."
 child_personality.3008.t:0 "Sorrisos Doces e Pequenas Mentiras"
 child_personality.3009.a:0 "Há tanto para pensar..."
 child_personality.3009.desc:0 "[Select_CString( guardian.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))] [guardian.GetFirstName] me diz para brincar com as outras crianças. Mas elas são tão barulhentas! Tem que ser quieto para que eu possa ouvir meus pensamentos!"
 child_personality.3009.message:0 "[Select_CString( personality_child.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', personality_child)] [personality_child.GetTitledFirstName] está sempre perdid[Select_CString( personality_child.IsFemale, 'a', 'o' )] em pensamentos!"
 child_personality.3009.t:0 "Perdid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] em Pensamentos"
 child_personality.3010.a:0 "Fico pensando no que está passando na mente [personality_child.GetHerHim]."
 child_personality.3010.desc:0 "[Select_CString( personality_child.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , personality_child)] [personality_child.GetTitledFirstName] é uma criança incomumente calma. Quando os outros brincam seus jogos selvagens, [personality_child.GetFirstNameNoTooltip] muitas vezes se retira para algum canto silencioso. [personality_child.GetSheHe] não fala muito, mas consigo perceber que [personality_child.GetSheHe] está sempre pensando em algo."
 child_personality.3010.t:0 "Perdid[Select_CString( personality_child.IsFemale, 'a', 'o' )] em Pensamentos"
 child_personality.4011.a:0 "... menino."
 child_personality.4011.b:0 "... menina."
 child_personality.4011.c:0 "... menina. Ou será que era um menino? Não consigo lembrar claramente."
 child_personality.4011.d:0 "... pessoa. Sinceramente, estou apenas aliviad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] que tenha sido apenas um sonho."
 child_personality.4011.desc_1:0 "Diante de mim está o(a) [ROOT.Char.Custom('GetAnimalType')] magnífico que me instiga a segui-lo para dentro do [ROOT.Char.Custom('TerrainType')]. Ao chegarmos a uma clareira, meu coração começa a bater forte, meu corpo arrepia, minha alma anseia. Quando me viro, [ROOT.Char.Custom('GetAnimalType')] desapareceu, e em seu lugar há uma pessoa bonita..."
 child_personality.4011.desc_2:0 "Diante de mim está uma pessoa envolta em névoa, fazendo um gesto de convite. Ao me juntar a ela, ao tocá-la, a névoa começa a se dissipar e, em seu lugar, um rubor quente se espalha pela nossa pele. Eu me inclino para beijá-la. Quando me afasto, sou recebido por um sorriso caloroso de uma pessoa bonita..."
 child_personality.4011.desc_3:0 "Eu desperto no meio da noite em um sobressalto - o peito arfando e a pele formigando. Nunca me senti assim antes; será que estou doente? O que eu sonhei? Tudo que consigo lembrar é de uma pessoa bonita..."
 child_personality.4011.desc_opening:0 "Aninhado na cama sob a pele do(a) [ROOT.Char.Custom('GetAnimalType')], eu adormeço em um calor reconfortante.\n\n"
 child_personality.4011.t:0 "Atração Iniciante"
 child_personality.4012.a:0 "[ROOT.Char.Custom('GirlBoyPlural')|U] realmente são [Select_CString( ROOT.Char.IsFemale, 'as', 'os' )] melhores!"
 child_personality.4012.desc:0 "Me disseram que é natural sentir atração por certas pessoas - que com o tempo eu vou querer conhecê-las intimamente.\n\nTenho tentado entender o que isso significa, mas o único progresso que fiz foi perceber que é divertido explorar esse mistério quando há outr[Select_CString( ROOT.Char.IsFemale, 'as', 'os' )] [ROOT.Char.Custom('GirlBoyPlural')] por perto."
 child_personality.4013.a:0 "Tanto meninas quanto meninos são tão interessantes!"
 child_personality.4013.desc:0 "Enquanto brinco com outras crianças, descobri que não me importo se sou pareado com uma menina ou um menino em nossos jogos mais íntimos. Muitas das outras crianças parecem ter preferências e algumas até fazem um grande alvoroço, mas eu não entendo por quê."
 child_personality.4014.a:0 "Sinceramente, eu não entendo..."
 child_personality.4014.desc:0 "Todos ao meu redor parecem ansiosos para se juntar - sorrindo e brincando de beijo e toque com outras crianças. Quando mostro desinteresse, eles parecem confusos e [Select_CString( dummy_opposite_gender.IsFemale, 'as', 'os' )] [dummy_opposite_gender.Custom('GirlBoyPlural')] me dizem que eu deveria gostar del[Select_CString( dummy_opposite_gender.IsFemale, 'as', 'es' )] mais."
 child_personality.4015.a:0 "[dummy_opposite_gender.Custom('GirlBoyPlural')|U] são tão fascinantes!"
 child_personality.4015.b:0 "Eu sei que [crush.GetSheHe] é apenas um plebeu... mas oh, meu coração!"
 child_personality.4015.desc:0 "Ao olhar para um jovem [ROOT.Char.Custom('OppositeGenderedLowlyServantType')] passando, suado de trabalho, mas com um rubor nas bochechas, fico fascinado. O que é esse sentimento? Essa vontade?"
 child_personality.9900.a.dull:0 "Eu passo muito tempo pensando..."
 child_personality.9900.a.sinful:0 "Isso não é justo! Por que devo ser julgad[Select_CString( child.IsFemale, 'a', 'o' )] pelas ações [ancestor.GetHerHim]?"
 child_personality.9900.a:0 "Vou deixar [ancestor.GetSheHe] orgulhos[Select_CString( ancestor.IsFemale, 'a', 'o' )]!"
 child_personality.9900.ambitious.desc:0 "destinad[Select_CString( child.IsFemale, 'a', 'o' )] à grandeza,"
 child_personality.9900.arrogant.desc:0 "um[Select_CString( child.IsFemale, 'a', '' )] [child.Custom('GirlBoy')] orgulhos[Select_CString( child.IsFemale, 'a', 'o' )] e nobre,"
 child_personality.9900.brave.desc:0 "sem medo de nada,"
 child_personality.9900.calm.desc:0 "[Select_CString( child.IsFemale, 'pacífica e equilibrada', 'pacífico e equilibrado' )],"
 child_personality.9900.compassionate.desc:0 "uma alma bondosa e gentil,"
 child_personality.9900.deceitful.desc:0 "[Select_CString( child.IsFemale, 'uma menina astuta', 'um menino astuto' )],"
 child_personality.9900.diligent.desc:0 "[Select_CString( child.IsFemale, 'uma aluna atenta e ávida', 'um aluno atento e ávido' )],"
 child_personality.9900.dull.desc:0 "[Select_CString( child.IsFemale, 'uma menina pensativa', 'um menino pensativo' )],"
 child_personality.9900.end.desc:0 "assim como [Select_CString( ancestor.IsFemale, 'minha', 'meu' )] [child.Custom2('RelationToMe', ancestor)] [ancestor.GetFirstNameNoTooltip]!"
 child_personality.9900.father.desc:0 "Meu pai diz que eu sou"
 child_personality.9900.forgiving.desc:0 "nunca guarda rancor,"
 child_personality.9900.generous.desc:0 "desprendid[Select_CString( child.IsFemale, 'a', 'o' )],"
 child_personality.9900.greedy.desc:0 "sempre em busca de novas oportunidades,"
 child_personality.9900.gregarious.desc:0 "muito bo[Select_CString( child.IsFemale, 'a', 'm' )] em fazer novos amigos,"
 child_personality.9900.honest.desc:0 "sempre falando a verdade,"
 child_personality.9900.humble.desc:0 "uma alma humilde,"
 child_personality.9900.just.desc:0 "just[Select_CString( child.IsFemale, 'a', 'o' )] e imparcial,"
 child_personality.9900.lunatic.desc:0 "chei[Select_CString( child.IsFemale, 'a', 'o' )] de ideias 'inusitadas',"
 child_personality.9900.mother.desc:0 "Minha mãe diz que eu sou"
 child_personality.9900.nurse.desc:0 "Minha ama diz que eu sou"
 child_personality.9900.shrewd.desc:0 "[Select_CString( child.IsFemale, 'uma menina esperta', 'um menino esperto' )],"
 child_personality.9900.sinful.ambitious.desc:0 "sempre exigindo novos brinquedos para brincar,"
 child_personality.9900.sinful.arrogant.desc:0 "[Select_CString( child.IsFemale, 'orgulhosa e altiva', 'orgulhoso e altivo' )],"
 child_personality.9900.sinful.brave.desc:0 "chei[Select_CString( child.IsFemale, 'a', 'o' )] de bravata,"
 child_personality.9900.sinful.calm.desc:0 "estranhamente desapaixonad[Select_CString( child.IsFemale, 'a', 'o' )],"
 child_personality.9900.sinful.compassionate.desc:0 "ceg[Select_CString( child.IsFemale, 'a', 'o' )] pela empatia,"
 child_personality.9900.sinful.deceitful.desc:0 "[Select_CString( child.IsFemale, 'uma mentirosa dissimulada', 'um mentiroso dissimulado' )],"
 child_personality.9900.sinful.diligent.desc:0 "irritantemente hiperativ[Select_CString( child.IsFemale, 'a', 'o' )],"
 child_personality.9900.sinful.forgiving.desc:0 "muito pront[Select_CString( child.IsFemale, 'a', 'o' )] para perdoar uma ofensa,"
 child_personality.9900.sinful.generous.desc:0 "frequentemente desperdiçando dinheiro,"
 child_personality.9900.sinful.greedy.desc:0 "egoísta e relutante em compartilhar,"
 child_personality.9900.sinful.gregarious.desc:0 "muito amigável demais,"
 child_personality.9900.sinful.honest.desc:0 "desagradavelmente honest[Select_CString( child.IsFemale, 'a', 'o' )],"
 child_personality.9900.sinful.humble.desc:0 "completamente carente de autoconfiança,"
 child_personality.9900.sinful.just.desc:0 "um[Select_CString( child.IsFemale, 'a', '' )] arrogante santarrão,"
 child_personality.9900.sinful.postscript.desc:0 "Quanto mais as pessoas falam sobre isso, pior sou tratad[Select_CString( child.IsFemale, 'a', 'o' )]. Já até me culparam por coisas que não fiz!"
 child_personality.9900.sinful.stubborn.desc:0 "incansavelmente teimos[Select_CString( child.IsFemale, 'a', 'o' )],"
 child_personality.9900.sinful.temperate.desc:0 "desinteressad[Select_CString( child.IsFemale, 'a', 'o' )] em desfrutar dos prazeres da vida,"
 child_personality.9900.sinful.zealous.desc:0 "[Select_CString( child.IsFemale, 'uma adepta', 'um adepto' )] irracional de [child.GetFaith.GetNameNoTooltip],"
 child_personality.9900.start.desc:0 "As pessoas continuam me dizendo que sou a viva imagem [Select_CString( ancestor.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', ancestor)], [ancestor.GetTitledFirstName]. Nunca conheci [ancestor.GetSheHe], mas eles sorriem quando dizem isso, então deve ser algo bom.\n\n"
 child_personality.9900.start.sinful.desc:0 "As pessoas continuam me dizendo que sou a viva imagem [Select_CString( ancestor.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', ancestor)], [ancestor.GetTitledFirstName]. Nunca conheci [ancestor.GetSheHe], mas [ancestor.GetSheHe] aparentemente era um[Select_CString( ancestor.IsFemale, 'a', '' )] [ancestor.GetWomanMan] malvad[Select_CString( ancestor.IsFemale, 'a', 'o' )].\n\n"
 child_personality.9900.strong.desc:0 "muito forte,"
 child_personality.9900.stubborn.desc:0 "não desiste facilmente,"
 child_personality.9900.t:0 "A Viva Imagem"
 child_personality.9900.temperate.desc:0 "moderado e sempre no controle de mim mesm[Select_CString( child.IsFemale, 'a', 'o' )],"
 child_personality.9900.zealous.desc:0 "[Select_CString( child.IsFemale, 'uma fiel adepta', 'um fiel adepto' )] de [child.GetFaith.GetNameNoTooltip],"
 child_personality.9901.a:0 "O universo está repleto de mistérios sagrados."
 child_personality.9901.dull.desc:0 "um pouco lent[Select_CString( child.IsFemale, 'a', 'o' )], por assim dizer,"
 child_personality.9901.end.desc:0 "assim como s[Select_CString( ancestor.IsFemale, 'ua', 'eu' )] [child.Custom2('RelationToMe', ancestor)] antes [child.GetHerHim]. Talvez seja [Select_CString( ancestor.IsFemale, 'a verdadeira', 'o verdadeiro' )] [ancestor.GetTitledFirstNameNoTooltip] que retornou a este mundo?"
 child_personality.9901.start.desc:0 "[child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] é a cara d[Select_CString( ancestor.IsFemale, 'a', 'o' )] [child.Custom2('RelationToMe', ancestor)] [ancestor.GetTitledFirstName]! Mas a semelhança não se limita à aparência — ela vai muito além.\n\n[child.GetFirstNameNoTooltip] é"
 child_personality.9901.t:0 "Renascid[Select_CString( child.IsFemale, 'a', 'o' )]"
