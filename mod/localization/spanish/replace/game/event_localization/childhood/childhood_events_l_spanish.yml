l_spanish:
 childhood.0002.a:0 "Esta flor é para você, [crush.GetFirstNameNoTooltip]!"
 childhood.0002.b:0 "Não... devemos apenas ser amigos."
 childhood.0002.end:0 "\n\nSempre que nossos olhares se encontram, meu estômago se enche de borboletas... Oh, eu me pergunto se [crush.GetSheHe] iria gostar desta [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')] que eu encontrei?"
 childhood.0002.fallback:0 "Toda vez que vejo [crush.GetSheHe], meu dia fica melhor, e eu gostaria que pudéssemos brincar o tempo todo."
 childhood.0002.loud:0 "[crush.GetSheHe|U] geralmente exige muita atenção, mas eu não me importo. Sempre que vejo [crush.GetSheHe], meu dia fica melhor!"
 childhood.0002.opening:0 "[crush.GetTitledFirstName] é muito divertid[Select_CString( crush.IsFemale, 'a', 'o' )] de se estar por perto!\n\n"
 childhood.0002.quiet:0 "[crush.GetSheHe|U] é um pouco tímid[Select_CString( crush.IsFemale, 'a', 'o' )] na maioria das vezes, mas [crush.GetSheHe] ainda torna cada vez mais especial quando vejo [crush.GetSheHe]!"
 childhood.0002.t:0 "Encontro de Brincadeira"
 childhood.0004.a:0 "[friend.GetSheHe|U] é um[Select_CString( friend.IsFemale, 'a', '' )] ótim[Select_CString( friend.IsFemale, 'a', 'o' )] amig[Select_CString( friend.IsFemale, 'a', 'o' )]!"
 childhood.0004.a_alt:0 "Vamos fazer um juramento - amigos #EMP para sempre!#!"
 childhood.0004.b:0 "Eu realmente gosto de brincar com [friend.GetSheHe]!"
 childhood.0004.c:0 "É difícil encontrar um[Select_CString( friend.IsFemale, 'a', '' )] amig[Select_CString( friend.IsFemale, 'a', 'o' )] melhor do que [friend.GetSheHe]!"
 childhood.0004.c_alt:0 "Você é um[Select_CString( child.IsFemale, 'a', '' )] #EMP tol[Select_CString( child.IsFemale, 'a', 'o' )]!#! por confiar em mim, #EMP [child.Custom2('InsultNoun', ROOT.Char)]!#!"
 childhood.0004.d:0 "...você quer o [friend.Custom('child_favorite_toy')] #EMP de volta#!? Sem chance!"
 childhood.0004.desc1:0 "Tenho brincado muito com [Select_CString( friend.IsFemale, 'a', 'o' )] [friend.GetTitledFirstName] ultimamente. Outro dia, [friend.GetSheHe] até me emprestou seu brinquedo favorito, [friend.Custom('child_favorite_toy')]! Nós realmente nos damos bem e estamos nos divertindo muito!"
 childhood.0004.desc2:0 "[friend.GetTitledFirstName] e eu temos passado muito tempo juntos recentemente, conversando e brincando. Nós estamos nos divertindo muito!"
 childhood.0004.desc3:0 "Tenho passado muito tempo com [friend.GetFirstName] recentemente."
 childhood.0004.t:0 "Amizade Florescente"
 childhood.0006.a:0 "[bully.GetSheHe|U] é [Select_CString( bully.IsFemale, 'a', 'o' )] pior!"
 childhood.0006.b.critical_failure:0 "[bully.GetSheHe|U] te bate gravemente"
 childhood.0006.b.critical_success:0 "Você bate n[bully.GetSheHe] até a morte"
 childhood.0006.b.death:0 "[bully.GetSheHe|U] te espanca até a morte #EMP#!"
 childhood.0006.b.failure:0 "[bully.GetSheHe|U] te bate"
 childhood.0006.b.success:0 "Você bate n[bully.GetSheHe] e [bully.GetSheHe] te deixa em paz"
 childhood.0006.b:0 "Grrr... Vou te bater sem dó!"
 childhood.0006.c:0 "Olha, eu vou te pagar cinco ouros para sumir."
 childhood.0006.c_leave:0 "[bully.GetSheHe|U] não dá a mínima para sumir"
 childhood.0006.end:0 "Não consigo fazer [bully.GetSheHe] parar, não importa o que eu faça!"
 childhood.0006.fallback:0 "[bully.GetSheHe|U] aproveita cada oportunidade para me encarar e me zombar."
 childhood.0006.loud:0 "Muitas das outras crianças ouvem [bully.GetSheHe], e [bully.GetSheHe] usa sua influência para virar todos contra mim."
 childhood.0006.mean:0 "[bully.GetSheHe|U] é cruel, zombando de mim e me empurrando."
 childhood.0006.nice:0 "[bully.GetSheHe|U] faz todos acreditarem que [bully.GetSheHe] é [Select_CString( bully.IsFemale, 'uma santa', 'um santo' )], mas [bully.GetSheHe] me zomba implacavelmente por cada pequeno erro que cometo."
 childhood.0006.opening:0 "[bully.GetTitledFirstName] tem me importunado por muito tempo agora.\n\n"
 childhood.0006.quiet:0 "[bully.GetSheHe|U] geralmente passa despercebid[Select_CString( bully.IsFemale, 'a', 'o' )], me atormentando quando ninguém está olhando."
 childhood.0006.t:0 "Atenção Indesejada"
 childhood.0006.toy:0 "E não é só isso... [bully.GetSheHe] quebrou meu [ROOT.Char.Custom('child_favorite_toy')], que #EMP [bully.Custom2('InsultNoun', ROOT.Char)]!#!"
 childhood.0008.a:0 "Isso vai ensinar uma lição a [victim.GetSheHe] por ser tão irritante!"
 childhood.0008.b:0 "Da próxima vez que nos encontrarmos, eu #EMP vou tentar#! ser legal..."
 childhood.0008.c:0 "Oh, como eu #EMP odeio#! [victim.GetSheHe]! [victim.GetSheHe|U] estaria melhor... mort[Select_CString( victim.IsFemale, 'a', 'o' )]."
 childhood.0008.desc:0 "[Select_CString( victim.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('victim'))], [victim.GetTitledFirstName], está me deixando nervos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )].\n\n"
 childhood.0008.fallback:0 "[victim.GetSheHe|U] está sempre no meu caminho, [victim.GetSheHe] fala das coisas mais entediantes, [victim.GetSheHe] sempre consegue dizer exatamente a coisa errada em cada conversa..."
 childhood.0008.loud:0 "[victim.GetSheHe|U] fica tagarelando sem parar, não importa o assunto e não importa o quanto eu diga que não estou interessado. Isso nunca acaba!"
 childhood.0008.mean:0 "[victim.GetSheHe|U] aproveita todas as oportunidades para me irritar, aparentemente encontrando prazer na irritação e dor que [victim.GetSheHe] causa."
 childhood.0008.nice:0 "[victim.GetSheHe|U] é sempre #EMP [Select_CString( victim.IsFemale, 'a', 'o' )] certinh[Select_CString( victim.IsFemale, 'a', 'o' )]!#, pregando uma virtude após a outra. As constantes lições [victim.GetHerHim|U] estão tendo o efeito oposto em mim..."
 childhood.0008.quiet:0 "Eu tentei fazer [victim.GetSheHe] falar, expressar uma opinião, dizer #EMP qualquer coisa#!... Não importa o que eu faça, [victim.GetSheHe] só fica cada vez mais retraíd[Select_CString( victim.IsFemale, 'a', 'o' )], o que há de errado com [victim.GetSheHe]?!"
 childhood.0008.t:0 "Controle de Raiva"
 childhood.0009.a:0 "É tudo diversão!"
 childhood.0009.desc1:0 "Um dos meus jogos favoritos é ver quantas vezes consigo provocar [victim.GetSheHe] antes que [victim.GetSheHe] fique irritad[Select_CString( victim.IsFemale, 'a', 'o' )]!"
 childhood.0009.desc2:0 "Eu tenho seguido [victim.GetSheHe] por aí, criticando cada movimento [victim.GetHerHim] o mais alto possível."
 childhood.0009.desc3:0 "Eu peguei emprestado o brinquedo favorito [victim.GetHerHim], e [victim.GetSheHe] agora tem que fazer o que eu mandar!"
 childhood.0009.fallback:0 "Por acidente, encontrei o [victim.Custom('child_favorite_toy')], brinquedo favorito [victim.GetHerHim], o esconder e assistir [victim.GetSheHe] procurar desesperadamente tem sido o ponto alto da minha semana!"
 childhood.0009.opening:0 "Finalmente poder colocar [victim.GetFirstName] em seu lugar está melhorando consideravelmente meu humor.\n\n"
 childhood.0009.t:0 "Indulgências Inocentes"
 childhood.0012.a:0 "[crush_holder.GetTitledFirstNameNoTooltip], acho que gosto de você!"
 childhood.0012.b:0 "[crush_holder.GetTitledFirstNameNoTooltip] é apenas [Select_CString( crush_holder.IsFemale, 'uma amiga', 'um amigo' )]."
 childhood.0012.desc:0 "Quando estava brincando com [Select_CString( crush_holder.IsFemale, 'a', 'o' )] [crush_holder.GetTitledFirstName] outro dia, [crush_holder.GetSheHe] foi excepcionalmente atencios[Select_CString( crush_holder.IsFemale, 'a', 'o' )] comigo. Nunca senti por [crush_holder.GetSheHe] dessa forma antes, mas talvez esteja começando a ver [crush_holder.GetSheHe] como mais do que [Select_CString( crush_holder.IsFemale, 'uma amiga', 'um amigo' )]."
 childhood.0012.t:0 "Atenção Recebida"
 childhood.0013.a:0 "Estou tão feliz por nos conhecermos!"
 childhood.0013.desc1:0 "Outro dia, eu até deixei [child.GetSheHe] pegar emprestado o meu [child.Custom('child_favorite_toy')] favorito! Nós realmente nos damos bem e estamos nos divertindo muito!"
 childhood.0013.desc2:0 "Eu e [Select_CString( child.IsFemale, 'a', 'o' )] [child.GetTitledFirstName] temos passado muito tempo juntos ultimamente, conversando e brincando. Estamos nos divertindo muito!"
 childhood.0013.desc3:0 ""
 childhood.0013.desc3_bossy:0 "[child.GetSheHe|U] sempre segue meu exemplo, nunca fico entediad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] quando estou com [child.GetSheHe]!"
 childhood.0013.desc3_charming:0 "Ninguém mais ri das minhas piadas tanto quanto [child.GetSheHe]!"
 childhood.0013.desc3_curious:0 "[child.GetSheHe|U] é ótim[Select_CString( child.IsFemale, 'a', 'o' )] em ouvir todos os boatos e sussurros que eu escuto na corte, fornecendo comentários perspicazes e uma nova perspectiva."
 childhood.0013.desc3_pensive:0 "[child.GetSheHe|U] sempre aprecia minha companhia, ouvindo meus pensamentos e me fazendo companhia com longas conversas."
 childhood.0013.desc3_rowdy:0 "[child.GetSheHe|U] sempre aguenta minhas brincadeiras e me acompanha em todas as minhas aventuras, o tempo que passamos juntos nunca é entediante!"
 childhood.0013.desc:0 "Ultimamente, eu e [Select_CString( child.IsFemale, 'a', 'o' )] [child.GetTitledFirstName] temos passado muito tempo juntos.\n\n"
 childhood.0013.desc_end:0 "Realmente gosto da companhia [child.GetHerHim] e acho que nós dois vamos ser próximos por muito tempo."
 childhood.0013.desc_fallback:0 "[child.GetSheHe|U] é sempre divertid[Select_CString( child.IsFemale, 'a', 'o' )] estar por perto, tanto quando brincamos quanto quando algo precisa ser discutido!"
 childhood.0013.t:0 "Interações Amigáveis"
 childhood.0910.a:0 "Nunca vou perdoar [bully.GetSheHe]!"
 childhood.0910.desc1:0 "Os olhares, as risadas, a dor... Toda vez que vejo [bully.GetSheHe], meu humor certamente fica ruim.\n\n[bully.GetSheHe|U] pode ter se tornado adulto agora, mas eu sei que [bully.GetSheHe] nunca se tornará uma pessoa decente!"
 childhood.0910.desc2:0 "\n\nÀs vezes, ainda consigo ouvir a risada zombeteira [bully.GetHerHim] enquanto [bully.GetSheHe] pisoteava o meu querido [ROOT.Char.Custom('child_favorite_toy')]."
 childhood.0910.opening:0 "As coisas que [Select_CString( bully.IsFemale, 'a', 'o' )] [bully.GetTitledFirstName] me fez passar quando eu era criança ainda pesam muito em mim."
 childhood.0910.t:0 "Tormento Constante"
 childhood.0911.a:0 "Vejo você por aí, [victim.GetTitledFirstNameNoTooltip]."
 childhood.0911.desc1:0 "\n\nAgora que [victim.GetSheHe] está crescendo, no entanto, preciso deixar essas indulgências infantis para trás e focar em outras coisas."
 childhood.0911.desc2:0 "Sempre vou me lembrar do rosto horrorizado [victim.GetHerHim] quando destruí o [victim.Custom('child_favorite_toy')] del[Select_CString( victim.IsFemale, 'a', 'e' )], foi hilário!\n\nAgora que [victim.GetSheHe] está crescendo, no entanto, preciso deixar as indulgências infantis para trás e focar em outras coisas."
 childhood.0911.desc_rival:0 "Embora [Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetTitledFirstName] já seja adult[Select_CString( victim.IsFemale, 'a', 'o' )] agora, isso não significa que [victim.GetSheHe] tenha me perdoado pelo que fiz a [victim.GetSheHe] quando éramos crianças.\n\nDe qualquer forma, é melhor assim, porque o ódio que guardo por [victim.GetSheHe] também cresceu!"
 childhood.0911.opening:0 "Fico pensando se [Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetTitledFirstName] se lembra das coisas que fiz a [victim.GetSheHe] quando éramos jovens."
 childhood.0911.t:0 "Indulgências da Infância"
 childhood.0998.a:0 "Tenho sorte de ter conhecido [crush.GetSheHe]."
 childhood.0998.desc:0 "Lembro-me com carinho de todos os bons momentos que compartilhei com [Select_CString( crush.IsFemale, 'a', 'o' )] [crush.GetTitledFirstName] quando criança.\n\n[crush.GetSheHe|U] sempre será querid[Select_CString( crush.IsFemale, 'a', 'o' )] para mim, mesmo que nada aconteça entre nós conforme crescemos!"
 childhood.0998.t:0 "Sentimentos Amadurecendo"
 childhood.0999.a:0 "Tenho sorte de ter conhecido [root_crush.GetSheHe]."
 childhood.0999.desc:0 "Lembro-me com carinho de todos os bons momentos que compartilhei com [Select_CString( root_crush.IsFemale, 'a', 'o' )] [root_crush.GetTitledFirstName] quando éramos mais jovens.\n\nMesmo que [root_crush.GetSheHe] tenha entrado no mundo dos adultos, [root_crush.GetSheHe] sempre será querid[Select_CString( root_crush.IsFemale, 'a', 'o' )] para mim!"
 childhood.0999.desc_unrequited:0 "Mesmo que [root_crush.GetSheHe] nunca tenha correspondido aos meus sentimentos..."
 childhood.0999.t:0 "Sentimentos Amadurecendo"
 childhood.1000.a:0 "Acho que gosto [friend_to_crush.GetHerHim] mais do que como amig[Select_CString( friend_to_crush.IsFemale, 'a', 'o' )]!"
 childhood.1000.b:0 "Eu trouxe [friend_to_crush.Custom('FavoriteTreatDemand')]... quer dar as mãos?"
 childhood.1000.c:0 "[friend_to_crush.GetSheHe|U] é [Select_CString( friend_to_crush.IsFemale, 'uma amiga', 'um amigo' )], nada mais!"
 childhood.1000.desc:0 "[friend_to_crush.GetTitledFirstName] é [Select_CString( friend_to_crush.IsFemale, 'uma amiga muito boa', 'um amigo muito bom' )]! \n\nSempre me divirto quando passamos tempo juntos, e [friend_to_crush.GetSheHe] me entende como ninguém mais. \n\nMesmo sendo tão bons amigos, às vezes me pergunto se não quero algo mais em nosso relacionamento..."
 childhood.1000.t:0 "Uma Amizade Profunda"
 childhood.1001.a.failure:0 "[bully.GetTitledFirstNameNoTooltip] me bateu"
 childhood.1001.a.success:0 "Eu dou uma lição [Select_CString( bully.IsFemale, 'na', 'no' )] [bully.GetTitledFirstNameNoTooltip]"
 childhood.1001.a:0 "Sobre a sua falta de educação..."
 childhood.1001.b.success:0 "Eu convenço [Select_CString( bully.IsFemale, 'a', 'o' )] [bully.GetTitledFirstNameNoTooltip] a parar de me intimidar"
 childhood.1001.b:0 "Vamos conversar sobre como você tem se comportado..."
 childhood.1001.c:0 "Maldito seja você, [bully.GetTitledFirstNameNoTooltip]."
 childhood.1001.d:0 "[adult_friend.GetFirstNameNoTooltip], você é adult[Select_CString( adult_friend.IsFemale, 'a', 'o' )] - por favor, me ajude!"
 childhood.1001.desc:0 "Isso não pode continuar! É hora de mostrar a [bully.GetSheHe] com quem [bully.GetSheHe] está mexendo."
 childhood.1001.fallback:0 "Mesmo que isso me pese, não tenho poder para parar [bully.GetSheHe]!"
 childhood.1001.opening:0 "O tormento interminável que [Select_CString( bully.IsFemale, 'a', 'o' )] [bully.GetTitledFirstName] me submete precisa parar! [bully.GetSheHe|U] me provoca impiedosamente, me empurra e me humilha.\n\n"
 childhood.1001.t:0 "O Último Confronto"
 childhood.1002.a:0 "[guardian_parent.Custom('MotherFather')|U], por favor, me ajude!"
 childhood.1002.b:0 "Eu consigo lidar com isso sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 childhood.1002.b_1:0 "Não vai bem"
 childhood.1002.b_2:0 "Você se sai bem"
 childhood.1002.desc1:0 "Ai! Enquanto brincava no jardim junto com [Select_CString( friend.IsFemale, 'a', 'o' )] [friend.GetTitledFirstName], caí e ralei o joelho. [Select_CString( guardian_parent.IsFemale, 'Minha', 'Meu' )] [guardian_parent.Custom('MotherFather')] estava do outro lado do quintal, aproveitando o bom tempo, e [Select_CString( friend.IsFemale, 'a', 'o' )] [friend.GetTitledFirstName] me incentivou a ir até [guardian_parent.GetSheHe]."
 childhood.1002.desc2:0 "Ai! Enquanto brincava com meu [ROOT.Char.Custom('child_favorite_toy')], caí e ralei o joelho. Assim que me levantei, [Select_CString( guardian_parent.IsFemale, 'minha', 'meu' )] [guardian_parent.Custom('MotherFather')] veio caminhando pelo caminho ao meu lado e perguntou se eu estava bem."
 childhood.1002.desc2_add:0 "\n\n\"Seja corajos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], [ROOT.Char.Custom('GetDaughterSon')].\" [guardian_parent.GetSheHe|U] diz. \"Vai ficar tudo bem, estou aqui para ajudar - apenas ouça o que tenho a dizer, e você aprenderá como evitar que isso aconteça novamente.\""
 childhood.1002.desc3:0 "Conforme eu mergulhava mais no livro que deveria estar estudando, percebi que tinha dificuldade em compreender os detalhes mais sutis do assunto. Em breve, devo apresentar o conteúdo para [Select_CString( guardian_parent.IsFemale, 'minha', 'meu' )] [guardian_parent.Custom('MotherFather')], mas se eu continuar sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], posso ficar pres[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com esse livro a noite toda."
 childhood.1002.t:0 "[guardian_parent.Custom('MotherFather')|U] Apoiador[Select_CString( guardian_parent.IsFemale, 'a', '' )]"
 childhood.1003.a:0 "Fico feliz que [child.GetSheHe] possa contar comigo!"
 childhood.1003.desc1:0 "Eu estava aproveitando o tempo, ouvindo as risadas [Select_CString( child.IsFemale, 'da minha', 'do meu' )] [child.Custom('GetDaughterSon')] [child.GetTitledFirstName] e [Select_CString( friend.IsFemale, 'da amiga', 'do amigo' )] [friend.GetTitledFirstName] del[Select_CString( child.IsFemale, 'a', 'e' )], quando de repente vi [Select_CString( child.IsFemale, 'a', 'o' )] [child.GetTitledFirstName] cair e machucar o joelho. [child.GetSheHe|U] se aproximou de mim, depois de ser [Select_CString( child.IsFemale, 'incentivada', 'incentivado' )] [Select_CString( friend.IsFemale, 'pela amiga', 'pelo amigo' )], e pediu minha ajuda para cuidar do ferimento."
 childhood.1003.desc2:0 "Eu estava passeando pelos jardins, aproveitando o tempo, quando vi [Select_CString( child.IsFemale, 'minha', 'meu' )] [child.Custom('GetDaughterSon')] [child.GetTitledFirstName] cair e ralar o joelho enquanto brincava com o seu [child.Custom('child_favorite_toy')]. Quando me aproximei [child.GetHerHim], perguntando se [child.GetSheHe] estava bem, [child.GetSheHe] pediu minha ajuda para cuidar do ferimento."
 childhood.1003.desc3:0 "Eu havia dado uma tarefa exigente para [Select_CString( child.IsFemale, 'a minha', 'o meu' )] [child.Custom('GetDaughterSon')] [child.GetTitledFirstName], pedindo para [child.GetSheHe] ler um livro complicado em apenas alguns dias. Na véspera de [child.GetSheHe] apresentar o material para mim, [child.GetSheHe] veio até mim e pediu minha ajuda."
 childhood.1003.t:0 "Dores do Crescimento"
 childhood.1004.a:0 "Obrigad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], [guardian_parent.Custom('MotherFather')]."
 childhood.1004.b:0 "Uma oportunidade perfeita para ler na cama!"
 childhood.1004.c:0 "Vou ficar acordad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] e fazer um presente para [Select_CString( guardian_parent.IsFemale, 'a minha', 'o meu' )] [guardian_parent.Custom('MotherFather')]!"
 childhood.1004.desc:0 "\"Você está dormindo o suficiente?\"\n\nA pergunta preocupada [Select_CString( guardian_parent.IsFemale, 'da minha', 'do meu' )] [guardian_parent.Custom('MotherFather')] me lembra que ultimamente eu não tenho dormido bem. A pressão constante para me sair bem em todas as tarefas é maior do que meu desejo de dormir.\n\n[guardian_parent.GetSheHe|U] me diz para tirar a noite de folga e ir para a cama cedo, e é uma oferta que eu aceito felizmente."
 childhood.1004.t:0 "Uma Mente Cansada"
 childhood.1005.a:0 "Vou tentar fazer melhor!"
 childhood.1005.b:0 "Já estou me esforçando ao máximo."
 childhood.1005.c:0 "#EMP Você não pode me dizer o que fazer, [guardian_parent.Custom('MotherFather')]!#!"
 childhood.1005.desc:0 "\"O que você está fazendo com todo o seu tempo?!\"\n\nA acusação [Select_CString( guardian_parent.IsFemale, 'da minha', 'do meu' )] [guardian_parent.Custom('MotherFather')] pesa em minha mente. Tenho tentado concluir todas as tarefas que me são impostas, mas [guardian_parent.GetSheHe] nunca parece estar satisfeit[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 childhood.1005.t:0 "Uma Mente Cansada"
 childhood.1006.a:0 "[Select_CString( guardian_parent.IsFemale, 'A', 'O' )] [guardian_parent.Custom('MotherFather')|U] nunca está satisfeit[Select_CString( guardian_parent.IsFemale, 'a', 'o' )]!"
 childhood.1006.b:0 "Acho que vou tentar..."
 childhood.1006.c:0 "ZZZzzz#DIE1 zzz#!#DIE2 zzz...#!"
 childhood.1006.desc:0 "[Select_CString( guardian_parent.IsFemale, 'Minha', 'Meu' )] [guardian_parent.Custom('MotherFather')] nunca me deixa em paz. Desde que [guardian_parent.GetSheHe] decidiu que eu não era diligente o suficiente, [guardian_parent.GetSheHe] assumiu como missão nunca mais me deixar relaxar novamente.\n\n[guardian_parent.GetSheHe|U] até reclama assim que tento escapar para uma soneca rápida!"
 childhood.1006.t:0 "Quando os Opostos se Chocam"
 childhood.1007.a:0 "[bully.GetSheHe|U] é o pior!"
 childhood.1007.b.failure:0 "[bully.GetSheHe|U] continua a praticar bullying"
 childhood.1007.b.success:0 "[bully.GetSheHe|U] eventualmente vê a razão"
 childhood.1007.b:0 "[bully.GetFirstNameNoTooltip|U] #EMP deve#! ser capaz de ver a razão!"
 childhood.1007.c.toast:0 "[child.GetFirstNameNoTooltip] pratica bullying com você"
 childhood.1007.c:0 "#DIE1 Resmungo#! #DIE2 resmungo#! Vou descontar minha frustração em [victim.GetFirstNameNoTooltip]..."
 childhood.1007.d.failure:0 "[bully.GetFirstNameNoTooltip] não cede"
 childhood.1007.d.success:0 "Você reverte a situação contra [bully.GetFirstNameNoTooltip]"
 childhood.1007.d:0 "Não. #EMP Sou eu quem pratica bullying.#!"
 childhood.1007.dominant:0 "[bully.GetSheHe|U] aparentemente ordenou às outras crianças que me evitem, e agora todas ficam quietas quando estou por perto. Eu sei que é culpa [bully.GetHerHim] e que as outras crianças não têm nada a ver com isso, mas ainda dói."
 childhood.1007.end:0 "\n\n[bully.GetSheHe|U] não me deixa em paz, não sei o que fazer."
 childhood.1007.extroverted:0 "Sempre que [bully.GetSheHe] tem a chance, [bully.GetSheHe] faz o possível para convencer as outras crianças de que eu sou uma pessoa horrível. [bully.GetSheHe|U] mente e inventa histórias, e apenas eu sei que não é verdade."
 childhood.1007.fallback:0 "Enquanto eu passava por [bully.GetSheHe], [bully.GetSheHe] esticou a perna e me fez tropeçar!"
 childhood.1007.malicious:0 "Eu estava passeando pelos jardins quando de repente [bully.GetSheHe] saiu da vegetação e me empurrou na lama. [bully.GetSheHe|U] estava rindo o tempo todo."
 childhood.1007.opening:0 "[bully.GetTitledFirstName] é uma verdadeira dor de cabeça!\n\n"
 childhood.1007.t:0 "Uma Sombra em Crescimento"
 childhood.1007.young_dominant:0 "Quando eu estava brincando no jardim com outras crianças, [bully.GetSheHe] de repente chegou e ordenou a todos que parassem de brincar comigo."
 childhood.1007.young_emotional:0 "Eu estava apenas passando por [bully.GetSheHe] no corredor quando de repente [bully.GetSheHe] começou a chorar alto, dizendo que eu tinha batido nel[Select_CString( bully.IsFemale, 'a', 'e' )]."
 childhood.1007.young_extroverted:0 "[bully.GetSheHe|U] sempre conta mentiras sobre mim para as outras crianças, fazendo com que elas gostem menos de mim."
 childhood.1007.young_malicious:0 "Eu estava brincando com o meu amado [ROOT.Char.Custom('child_favorite_toy')] quando [bully.GetSheHe] irrompeu na sala e arrancou o [ROOT.Char.Custom('child_favorite_toy')] das minhas mãos."
 childhood.1008.1:0 "Eu encontrei [victim.GetSheHe] no corredor, e assim que [victim.GetSheHe] estava passando por mim, estiquei minha perna e fiz [victim.GetSheHe] tropeçar. A expressão no rosto [victim.GetHerHim] foi impagável!"
 childhood.1008.2:0 "Sempre que estamos em uma conversa juntos, faço questão de questionar tudo o que [victim.GetSheHe] diz e fazer piadas sobre as conclusões que [victim.GetSheHe] apresenta."
 childhood.1008.3:0 "Justo quando [victim.GetSheHe] estava prestes a dar uma mordida no pão do café da manhã, dei um tapinha nas costas [victim.GetHerHim]. A bagunça na mesa foi bastante nojenta, mas o som que [victim.GetSheHe] fez foi hilário!"
 childhood.1008.a:0 "Isso ajuda a aliviar a tensão!"
 childhood.1008.b:0 "Vamos seguir isso com uma boa surra!"
 childhood.1008.c:0 "[extra_bully.GetFirstNameNoTooltip]! Me ajude a implicar com ess[Select_CString( victim.IsFemale, 'a', 'e' )] [victim.Custom2('InsultNoun', ROOT.Char)] [victim.Custom2('InsultAdjective', ROOT.Char)]!"
 childhood.1008.opening:0 "[victim.GetTitledFirstName] finalmente serve para algo!\n\nA vida tem sido bastante estressante ultimamente, mas [victim.GetSheHe] conseguiu me ajudar a relaxar.\n\n"
 childhood.1008.t:0 "Lidar de Forma Não Convencional"
 childhood.1009.1:0 "\"Para que estamos aqui mesmo? Qual é o plano de [ROOT.Char.GetFaith.FateGodName] para todos nós?\""
 childhood.1009.2:0 "\"O que eu realmente devo ser quando crescer?\""
 childhood.1009.3:0 "\"Como você pode saber se o afeto de alguém por você é genuíno?\""
 childhood.1009.a:0 "Tenho sorte de ter um amigo tão bom."
 childhood.1009.b:0 "Você é tão gentil, quero que fique com meu [ROOT.Char.Custom('child_favorite_toy')]!"
 childhood.1009.c:0 "Você é tão sábio, [friend.GetFirstNameNoTooltip]. Conte-me mais!"
 childhood.1009.end:0 "\n\nApenas conversar sobre isso com [friend.GetSheHe] já me fez sentir melhor!"
 childhood.1009.opening:0 "[friend.GetTitledFirstName] é um bom amigo. [friend.GetSheHe|U] percebeu que algo estava me incomodando e [friend.GetSheHe] me convenceu a compartilhar meus pensamentos com [friend.GetSheHe].\n\n"
 childhood.1009.t:0 "A Preocupação de um Amigo"
 childhood.1010.a:0 "Meu querido [crush.GetTitledFirstNameNoTooltip]!"
 childhood.1010.b:0 "Oh, tristeza!"
 childhood.1010.c:0 "O amor é uma mentira... #EMP uma mentira!#!"
 childhood.1010.d.effect:0 "Outro presente pode derreter o coração [crush.GetHerHim]... ou partir o seu, novamente"
 childhood.1010.d:0 "[crush.GetFirstNameNoTooltip], eu trouxe [ROOT.Char.Custom('SeductionGiftTypeIndefiniteSimple')] para você!"
 childhood.1010.e:0 "Oh, meu coração está cheio de felicidade e alegria ao ver você!"
 childhood.1010.not_returned:0 "O fato de [crush.GetSheHe] não parecer corresponder aos meus sentimentos pesa muito no meu coração."
 childhood.1010.opening:0 "Não consigo parar de pensar [Select_CString( crush.IsFemale, 'na', 'no' )] [crush.GetTitledFirstName], na maneira como [crush.GetSheHe] sorri e na maneira como [crush.GetSheHe] fala.\n\n"
 childhood.1010.returned:0 "Apenas saber que meus sentimentos são correspondidos me traz grande alegria e tranquiliza meu coração."
 childhood.1010.t:0 "Sempre em Meus Pensamentos"
 childhood.1011.a:0 "[crush_returned.GetFirstNameNoTooltip], acho que gosto de você."
 childhood.1011.b:0 "[crush_returned.GetSheHe|U] está me irritando."
 childhood.1011.c:0 "Não, meu coração pertence a [true_crush.GetFirstNameNoTooltip]!"
 childhood.1011.not_returned:0 "Embora a apreciação seja agradável, está chegando a um ponto de irritação. Por que [crush_returned.GetSheHe] não me deixa em paz?"
 childhood.1011.opening:0 "Notei que [Select_CString( crush_returned.IsFemale, 'a', 'o' )] [crush_returned.GetTitledFirstName] tem prestado uma atenção extra em mim ultimamente, apreciando tanto minhas piadas quanto minhas opiniões.\n\n"
 childhood.1011.returned:0 "É bom ser apreciad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] assim, e isso me fez perceber o quanto [crush_returned.GetFirstNameNoTooltip] pode ser legal.\n\nNa verdade, acho que estou tão interessad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [Select_CString( crush_returned.IsFemale, 'nela', 'nele' )] quanto [crush_returned.GetSheHe] está em mim!"
 childhood.1011.t:0 "O Caminho do Coração"
 childhood.1012.a:0 "[guardian_parent.GetSheHe|U] pode ser tão cruel!"
 childhood.1012.b:0 "Como... como #EMP você pôde!#! Eu te odeio!"
 childhood.1012.desc2:0 "O pior é que [guardian_parent.GetSheHe] parecia indiferente ao meu sofrimento."
 childhood.1012.desc3:0 "O pior é que [guardian_parent.GetSheHe] parecia desfrutar do meu sofrimento."
 childhood.1012.desc:0 "Eu sei que tenho lutado com meus estudos recentemente, e sei que [Select_CString( guardian_parent.IsFemale, 'minha', 'meu' )] [guardian_parent.Custom('MotherFather')] está desapontad[Select_CString( guardian_parent.IsFemale, 'a', 'o' )] comigo. O que eu nunca esperava era que [guardian_parent.GetSheHe] fosse tão longe a ponto de pegar meu brinquedo favorito, meu querido [ROOT.Char.Custom('child_favorite_toy')], e tirá-lo de mim!\n\n"
 childhood.1012.desc_2:0 "\"Lá vai ele para a lareira.\" [guardian_parent.Custom('MotherFather')|U] diz, lançando-o nas chamas abertas. \"Agora talvez você repense em ser um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.Custom('GetDaughterSon')] tão sem valor.\"\n\n"
 childhood.1012.t:0 "Punição Severa"
 childhood.1013.a:0 "Você deveria ter visto a cara [victim.GetHerHim]!"
 childhood.1013.b:0 "Eu... eu não consigo acreditar no que fiz... Eu fui [Select_CString( ROOT.Char.IsFemale, 'uma', 'um' )] #EMP [ROOT.Char.Custom('GirlBoy')] m[Select_CString( ROOT.Char.IsFemale, 'á', 'au' )]!#!"
 childhood.1013.desc:0 "Encontrei [victim.GetFirstName], [Select_CString( victim.IsFemale, 'minha', 'meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('victim'))], brincando com seu [victim.Custom('child_favorite_toy')] no jardim, rindo e gritando.\n\n[victim.GetSheHe|U] não tinha o direito de estar tão feliz, e o que há de tão especial naquele bobo [victim.Custom('child_favorite_toy')]? Quebrou como qualquer coisa velha quando eu o arranquei das mãos [victim.GetHerHim] e o esmaguei."
 childhood.1013.t:0 "A Destruição do [victim.Custom('child_favorite_toy')|U]"
 childhood.1014.a:0 "[bully.GetSheHe|U] é horrível!"
 childhood.1014.desc:0 "[bully.GetTitledFirstName], [Select_CString( bully.IsFemale, 'minha', 'meu' )] tormentor constante, destruiu meu precioso [ROOT.Char.Custom('child_favorite_toy')]! Enquanto eu estava brincando, [bully.GetSheHe] se aproximou calmamente de mim e pegou o brinquedo das minhas mãos, pisoteando-o no chão.\n\n\"\"Quem ainda brinca com um [ROOT.Char.Custom('child_favorite_toy')]?\"\""
 childhood.1014.t:0 "A Destruição do [ROOT.Char.Custom('child_favorite_toy')|U]"
 childhood.1015.a.flavor:0 "Por que eles estão rindo? Minhas ideias são #MP ótimas!#!"
 childhood.1015.a:0 "\"Se você apenas me ouvisse por um momento...\""
 childhood.1015.b.tt:0 "Isso beneficiará tanto os estudos de [study_friend.GetFirstNameNoTooltip] quanto os seus estudos de [diplomacy|E]"
 childhood.1015.b:0 "Tenho muito a aprender – devo ouvir."
 childhood.1015.desc:0 "A pedido [Select_CString( educator.IsFemale, 'da', 'do' )] [educator.GetTitledFirstName], [Select_CString( study_friend.IsFemale, 'minha', 'meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('study_friend'))] [study_friend.GetFirstName] e eu temos acompanhado as negociações em andamento sobre o envolvimento da coroa na administração local da [province.GetName].\n\nDurante as discussões, não posso deixar de notar que [Select_CString( province_holder.IsFemale, 'a', 'o' )] [province_holder.GetTitledFirstName] não faz ideia de como coordenar tal esforço, e como estudei o assunto por um tempo, talvez eu deva intervir."
 childhood.1015.t:0 "Soluções Diplomáticas"
 childhood.1016.a:0 "\"Na verdade, acho que um ataque direto funcionaria melhor.\""
 childhood.1016.b.tt:0 "Isso beneficiará tanto os estudos de [study_friend.GetFirstNameNoTooltip] quanto os seus estudos de [martial|E]"
 childhood.1016.b:0 "Faço um gesto para [commander.GetSheHe] – devo apenas observar."
 childhood.1016.desc:0 "[Select_CString( study_friend.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('study_friend'))] [study_friend.GetFirstName] e eu estamos assistindo às tropas realizarem uma batalha simulada fora da cidade como parte dos nossos estudos.\n\n\"Agora, contornem e ataquem pelo flanco!\" [commander.GetTitledFirstName] grita, e antes que eu perceba, dou um passo à frente e chamo a atenção [commander.GetHerHim]."
 childhood.1016.t:0 "Questões Marciais"
 childhood.1017.a.tt:0 "Às vezes, aprendemos com os erros – isso beneficiará tanto os estudos de [study_friend.GetFirstNameNoTooltip] quanto os seus estudos de [stewardship|E]"
 childhood.1017.a:0 "Fico curios[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] para saber o que mudar esses números irá causar."
 childhood.1017.b:0 "É melhor deixar como está."
 childhood.1017.desc:0 "As negociações com [Select_CString( province_holder.IsFemale, 'a', 'o' )] [province_holder.GetTitledFirstName] da [province.GetName] sobre o manejo dos grãos têm se arrastado por horas. [Select_CString( study_friend.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('study_friend'))], [study_friend.GetFirstName], tem me lançado olhares nas últimas meia hora, mostrando que não estou sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] em meu sofrimento.\n\nEnquanto todos deixam a câmara para um intervalo, avisto um livro aberto na mesa [Select_CString( province_holder.IsFemale, 'da', 'do' )] [province_holder.GetTitledFirstName]. Anotações sobre o manejo do trigo estão rabiscadas na página, e ao fazer algumas pequenas alterações, posso afetar seriamente a produção da região."
 childhood.1017.t:0 "Uma Questão de Grãos"
 childhood.1018.a.tt:0 "Isso beneficiará tanto os estudos de [study_friend.GetFirstNameNoTooltip] quanto os seus estudos de [intrigue|E]"
 childhood.1018.a:0 "Essa informação precisa chegar até [educator.GetFirstNameNoTooltip]!"
 childhood.1018.b:0 "Eles realmente poderiam #EMP usar#! esse dinheiro extra."
 childhood.1018.desc:0 "Se há uma coisa que [Select_CString( educator.IsFemale, 'a', 'o' )] [educator.GetTitledFirstName] tem tentado me ensinar, é que às vezes uma mentira é necessária.\n\nQuando eu e [Select_CString( study_friend.IsFemale, 'minha', 'meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('study_friend'))] [study_friend.GetFirstName] ouvimos [Select_CString( province_holder.IsFemale, 'a', 'o' )] [province_holder.GetTitledFirstName] da [province.GetName] falar sobre adulterar os números de seu relatório de impostos para possivelmente fazer a região prosperar, começo a pensar na lição de [educator.GetFirstName]."
 childhood.1018.t:0 "Incidente Intrigante"
 childhood.1019.a.tt1:0 "Isso beneficiará tanto os estudos de [study_friend.GetFirstNameNoTooltip] quanto os seus estudos de [learning|E]"
 childhood.1019.a.tt2:0 "Isso beneficiará tanto os estudos de [study_friend.GetFirstNameNoTooltip] quanto os seus estudos de [stewardship|E]"
 childhood.1019.a:0 "Vamos garantir que os livros sejam estudados #EMP minuciosamente#!."
 childhood.1019.b:0 "Os livros chegarão ao seu destino no prazo!"
 childhood.1019.desc:0 "Eu e [Select_CString( study_friend.IsFemale, 'minha', 'meu' )] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('study_friend'))] [study_friend.GetFirstName] fomos encarregados de entregar uma pilha de livros para os delegados da [province.GetName]. A vontade de tirar alguns minutos, ou alguns dias até, para estudá-los é quase irresistível.\n\nO fato de que uma entrega rápida dos livros aparentemente é de grande importância para a produtividade contínua da região só aumenta nossa curiosidade."
 childhood.1019.t:0 "Ler ou Não Ler"
 childhood.2001.a:0 "Agora ele é meu gatinho!"
 childhood.2001.b:0 "Às vezes, [educator.GetTitledFirstNameNoTooltip] parece solitári[Select_CString( educator.IsFemale, 'a', 'o' )]..."
 childhood.2001.c:0 "Fico curios[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] para saber o que ele está escondendo lá dentro...!"
 childhood.2001.desc:0 "Enquanto estou brincando perto de [ROOT.Char.Custom('TerrainType')], de repente ouço um som. É pequeno e fraco, mas está lá!"
 childhood.2001.desc_educator:0 "Enquanto estou brincando sob a supervisão [Select_CString( educator.IsFemale, 'da', 'do' )] [educator.GetTitledFirstName], de repente ouço um som. É pequeno e fraco, mas está lá!"
 childhood.2001.desc_ending:0 "\n\nOlho em cada arbusto, sob cada pedra, em todas as direções e... lá! Um gatinho pequenino está sentado debaixo de um arbusto espinhoso, completamente sozinho."
 childhood.2001.t:0 "O Gatinho"
 childhood.2002.a:0 "Obrigad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]!"
 childhood.2002.b:0 "Eca, coloque de volta onde encontrou."
 childhood.2002.c:0 "Ah, você encontrou #EMP meu#! presente para #EMP você#! E como lidamos com dívidas?"
 childhood.2002.d:0 "Finalmente, algo para torturar!"
 childhood.2002.desc:0 "Estou do lado de fora com [Select_CString( ward.IsFemale, 'a', 'o' )] [ward.GetTitledFirstName] quando, de repente, [ward.GetSheHe] desaparece. Mas, antes que eu tenha tempo para me preocupar de verdade, [ward.GetSheHe] volta correndo, segurando um gatinho pequeno em sua mãos!\n\n\"[educator.GetFirstNameNoTooltip], [educator.GetFirstNameNoTooltip]! Olha o que eu encontrei. É um presente para você!\""
 childhood.2003.a:0 "Agora ele é meu cachorrinho!"
 childhood.2003.b:0 "Aqui, [friend.GetFirstNameNoTooltip], fique com ele."
 childhood.2003.c:0 "Às vezes, [educator.GetTitledFirstNameNoTooltip] parece solitári[Select_CString( educator.IsFemale, 'a', 'o' )]..."
 childhood.2003.d:0 "Fico curios[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] para saber o que ele está escondendo lá dentro...!"
 childhood.2003.desc:0 "Estou brincando quando ouço um som. É um som pequeno, frágil e assustado."
 childhood.2003.desc_educator:0 "Estou passeando com [Select_CString( educator.IsFemale, 'a', 'o' )] [educator.GetTitledFirstName] quando ouço um som. É um som pequeno, frágil e assustado."
 childhood.2003.desc_ending:0 "\n\nProcuro por todos os lados — debaixo de cada pedra, ao redor de cada esquina, atrás de cada arbusto — e finalmente encontro! Um cachorrinho pequeno, completamente sozinho, sentado entre duas pedras."
 childhood.2003.desc_friend:0 "Estou brincando com [Select_CString( friend.IsFemale, 'a', 'o' )] [friend.GetTitledFirstName] quando ouço um som. É um som pequeno, frágil e assustado."
 childhood.2003.t:0 "O Cachorrinho"
 childhood.2004.desc:0 "Estou do lado de fora com [Select_CString( ward.IsFemale, 'a', 'o' )] [ward.GetTitledFirstName] quando, de repente, [ward.GetSheHe] desaparece. Mas, antes que eu tenha tempo para me preocupar de verdade, [ward.GetSheHe] volta correndo, segurando um cachorrinho pequeno em suas mãos!\n\n\"[educator.GetFirstNameNoTooltip], [educator.GetFirstNameNoTooltip]! Olha o que eu encontrei. É um presente para você!"
 childhood.2005.a:0 "Um cachorrinho!!!"
 childhood.2005.b:0 "Eca, guarda isso."
 childhood.2005.desc:0 "Estou brincando com [Select_CString( ward.IsFemale, 'a', 'o' )] [ward.GetTitledFirstName] quando, de repente, [ward.GetSheHe] desaparece no [ROOT.Char.Custom('TerrainType')]. Para onde [ward.GetSheHe] foi? Giro em círculos, procurando, e de repente [ward.GetSheHe] reaparece, segurando um cachorrinho pequeno em minha direção.\n\n\"[friend.GetFirstNameNoTooltip]! É para você!\""
 childhood.2006.a:0 "Um gatinho!!!"
 childhood.2006.b:0 "Eca, guarda isso."
 childhood.2006.desc:0 "Estou brincando com [Select_CString( ward.IsFemale, 'a', 'o' )] [ward.GetTitledFirstName] quando, de repente, [ward.GetSheHe] desaparece no [ROOT.Char.Custom('TerrainType')]. Para onde [ward.GetSheHe] foi? Giro em círculos, procurando, e de repente [ward.GetSheHe] reaparece, segurando um gatinho pequeno em minha direção.\n\n\"[friend.GetFirstNameNoTooltip]! É para você!\""
 childhood.2010.a:0 "Quando eu precisar, espero que você esteja lá por mim também."
 childhood.2010.b:0 "Isso é o que significa ser um guardião."
 childhood.2010.desc_fallback:0 "[ward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim em um raro momento de contemplação."
 childhood.2010.desc_mean:0 "[ward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim em um raro momento de honestidade."
 childhood.2010.desc_opening:0 "\"Você está sempre lá para mim, e espero que você saiba que sou grat[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )].\"\n\n"
 childhood.2010.desc_proud:0 "[ward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim em um raro momento de apreciação."
 childhood.2010.desc_shy:0 "[ward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim em uma rara demonstração de coragem e abertura."
 childhood.2010.t:0 "Expectativas"
 childhood.2011.a:0 "[guardian.GetSheHe|U] é meu professor afinal."
 childhood.2011.desc:0 "[guardian.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tem trabalhado duro em minha educação ultimamente. Sou grat[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], mas [guardian.GetSheHe] também deixou claro que espera que eu retribua seu trabalho árduo no futuro; é assim que funciona. Tenho certeza de que [guardian.GetSheHe] está corret[Select_CString( guardian.IsFemale, 'a', 'o' )]."
 childhood.2011.tt:0 "Isso aprimora um pouco a sua educação"
 childhood.2100.a:0 "Devo ouvir e me concentrar, talvez eu aprenda?"
 childhood.2100.b_hash:0 "Não, prefiro ir brincar!"
 childhood.2100.desc:0 "[Select_CString( educator.IsFemale, 'Minha guardiã', 'Meu guardião' )], [educator.GetTitledFirstName], me ensina bem. Às vezes, eu o ouço falando em [educator.GetCulture.GetLanguage.GetNameNoTooltip] — é o que [educator.GetSheHe] fala em casa, eu acho.\n\nEmbora [educator.GetSheHe] fale principalmente [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] comigo, [educator.GetSheHe] também está tentando me ensinar um pouco da língua materna [educator.GetHerHim].\n\nManter duas línguas em minha cabeça é difícil... mas talvez valha o esforço?"
 childhood.2100.t:0 "L de Linguagem"
 childhood.2200.a:0 "Posso falar como os adultos!"
 childhood.2200.b:0 "Isso é chato, fale apenas em [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]!"
 childhood.2200.desc-nudged:0 "Enquanto acompanho [educator.GetNameNoTooltip], vejo [educator.GetHerHim] falando na linguagem da corte ao meu redor, e estranhamente estou começando a entendê-la. Se eu me esforçar, poderei me tornar proficiente na língua da nossa corte!"
 childhood.2200.desc:0 "Enquanto acompanho [educator.GetNameNoTooltip], percebo [educator.GetSheHe] falando no idioma da corte ao meu redor, e estranhamente estou começando a entender. Se eu me esforçar, posso me tornar proficiente em nosso idioma da corte!"
 childhood.2200.t:0 "Você Fala Meu Idioma?"
 childhood.2300.a.success_parent_desc:0 "[ward.GetFirstName] aprendeu a língua [parent.GetCulture.GetLanguage.GetName] por meio da observação."
 childhood.2300.a:0 "Posso falar como [parent.Custom('GetMamaPapa')]!"
 childhood.2300.b:0 "Isso é chato! Por que aprender [parent.GetCulture.GetLanguage.GetNameNoTooltip] afinal!?"
 childhood.2300.desc:0 "[Select_CString( parent.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('parent'))] ocasionalmente insere uma palavra de [parent.GetCulture.GetLanguage.GetName] aqui e ali, e me vejo entendendo melhor o idioma. Tenho certeza de que, se eu me esforçar, posso me tornar proficiente o suficiente para falar com [Select_CString( parent.IsFemale, 'minha', 'meu' )] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('parent'))] de uma nova maneira!"
 childhood.2300.t:0 "Os Idiomas em Minha Árvore Familiar"
 childhood.2400.a.neutral:0 "Deixe-me acalmar suas dúvidas."
 childhood.2400.a.toast.fail:0 "[questioning_ward.GetTitledFirstName] ainda abriga suas dúvidas."
 childhood.2400.a.toast.succ:0 "[questioning_ward.GetTitledFirstName] está convencido pela sua fé."
 childhood.2400.a.zealous:0 "Eu vou apagar essas dúvidas de sua mente."
 childhood.2400.b.toast.fail:0 "[ROOT.Char.Custom('MyPriestTitle')|U] [realm_priest.GetFirstName] não conseguiu convencer [questioning_ward.GetTitledFirstName]."
 childhood.2400.b.toast.succ:0 "[ROOT.Char.Custom('MyPriestTitle')|U] [realm_priest.GetFirstName] convenceu [questioning_ward.GetTitledFirstName]."
