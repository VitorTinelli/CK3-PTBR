l_spanish:
 coming_of_age.0001.a:0 "[ROOT.Char.GetTitledFirstNameNoTooltip], você é um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] adult[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] agora!"
 coming_of_age.0001.bully1:0 "\nAs coisas que [Select_CString( bully.IsFemale, 'a', 'o' )] [bully.GetTitledFirstName] me fez passar quando criança ainda me pesam, e toda vez que vejo [bully.GetSheHe] meu humor certamente fica ruim."
 coming_of_age.0001.bully2:0 "\nAs coisas que [Select_CString( bully.IsFemale, 'a', 'o' )] [bully.GetTitledFirstName] me fez passar quando criança ainda me pesam. Às vezes ainda consigo ouvir a risada [bully.GetHerHim] enquanto [bully.GetSheHe] destruía meu [ROOT.Char.Custom('child_favorite_toy')]."
 coming_of_age.0001.crush:0 "\nTive momentos memoráveis com [crush.GetFirstName], [crush.GetSheHe] realmente me ajudou a entender a mim mesm[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] e o amor."
 coming_of_age.0001.desc1:0 "Concluí minha educação nas artes de [ROOT.Char.Custom('education_focus_child')]."
 coming_of_age.0001.desc1_bad_trait:0 "Mesmo que os resultados que alcancei tenham deixado muito a desejar, isso não surpreendeu ninguém. Pelo menos o trabalho árduo finalmente acabou!"
 coming_of_age.0001.desc1_fallback_trait:0 "Mesmo que eu não tenha alcançado muito, é um alívio finalmente ver alguns resultados."
 coming_of_age.0001.desc1_good_trait:0 "Apesar das altas expectativas de todos, não alcancei muito e meus resultados deixaram muito a desejar."
 coming_of_age.0001.desc2:0 "Finalmente concluí meus estudos na arte de [ROOT.Char.Custom('education_focus_child')]!"
 coming_of_age.0001.desc2_bad_trait:0 "Eu me saí razoavelmente bem, pelo menos considerando o fato de que o assunto não me é natural."
 coming_of_age.0001.desc2_fallback_trait:0 "Minhas conquistas não foram grandes, mas também poderia ter sido pior."
 coming_of_age.0001.desc2_good_trait:0 "Estou desapontad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com meus resultados, pois realmente acredito que poderia ter feito melhor."
 coming_of_age.0001.desc3:0 "Completei meus estudos de [ROOT.Char.Custom('education_focus_child')]!"
 coming_of_age.0001.desc3_bad_trait:0 "Mesmo que eu não compreenda completamente os aspectos mais avançados do assunto, desafiei as baixas expectativas de todos e aprendi mais do que a maioria!"
 coming_of_age.0001.desc3_fallback_trait:0 "Mesmo que eu não compreenda completamente os aspectos mais avançados do assunto, me saí muito bem."
 coming_of_age.0001.desc3_good_trait:0 "Mesmo que eu não compreenda completamente os aspectos mais avançados do assunto, correspondo às expectativas de todos e aprendi mais do que a maioria!"
 coming_of_age.0001.desc4:0 "Alcancei um entendimento de [ROOT.Char.Custom('education_focus_child')] que supera em muito o de qualquer um dos meus colegas."
 coming_of_age.0001.desc4_bad_trait:0 "Desafiei as expectativas de todos e alcancei o que foi considerado impossível para mim; a maestria de [ROOT.Char.Custom('education_focus_child')]!"
 coming_of_age.0001.desc4_fallback_trait:0 "Chegar tão longe no assunto tem sido verdadeiramente gratificante."
 coming_of_age.0001.desc4_good_trait:0 "Mesmo tendo uma inclinação natural para o assunto, minha maestria nele ainda é uma conquista!"
 coming_of_age.0001.desc_confucian_education:0 "Com a maioridade [educated_child.GetHerHim], [educated_child.GetFirstName] está preparad[Select_CString( educated_child.IsFemale, 'a', 'o' )] para propagar os ensinamentos confucianos.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.0001.educator:0 "Com a ajuda [Select_CString( educator.IsFemale, 'da', 'do' )] [educator.GetTitledFirstName],"
 coming_of_age.0001.educator_confucian_education:0 "Com a ajuda dos ensinamentos confucianos [Select_CString( educator.IsFemale, 'da', 'do' )] [educator.GetTitledFirstName]"
 coming_of_age.0001.educator_university:0 "Com a ajuda [Select_CString( educator.IsFemale, 'da', 'do' )] [educator.GetTitledFirstName] e da Universidade,"
 coming_of_age.0001.friend:0 "\nA amizade que compartilhei com [friend.GetFirstName] significava muito para mim quando éramos jovens, e ainda tê-la ao meu lado significa muito."
 coming_of_age.0001.no_relationships:0 "\n\nAo pensar em minha infância, percebo que nunca me conectei verdadeiramente com ninguém... Mesmo enquanto via outras pessoas brincando com amigos ou cochichando sobre amor, nunca experimentei tais coisas por mim mesm[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )].\n\nTenho certeza de que os próximos anos me levarão a novos amigos e novas oportunidades!"
 coming_of_age.0001.patronaged_spouse_plus_1.desc:0 "[patronage_spouse_tutor.GetTitledFirstName] supervisionou minha educação e contribuiu muito para meu conhecimento em [ROOT.Char.Custom('education_focus_child')]."
 coming_of_age.0001.patronaged_spouse_plus_2_or_more.desc:0 "[patronage_spouse_tutor.GetTitledFirstName] supervisionou minha educação e me ajudou a alcançar um nível de conhecimento que eu nem mesmo sonhava em possuir."
 coming_of_age.0001.relationships:0 "\n\nEnquanto dou meus primeiros passos na vida adulta, me pego relembrando algumas das pessoas que tiveram um impacto na pessoa que me tornei..."
 coming_of_age.0001.relationships_end:0 "\n\nAgora que sou adult[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], no entanto, preciso deixar essas indulgências infantis para trás e focar nas coisas que estão por vir."
 coming_of_age.0001.t:0 "Passagem para a Vida Adulta"
 coming_of_age.0001.tt.1:0 "Você ainda tem muito a aprender no campo de [THIS.Char.Custom('education_focus_child')]!\n"
 coming_of_age.0001.tt.2:0 "Você ainda tem algumas coisas para aprender no campo de [THIS.Char.Custom('education_focus_child')]\n"
 coming_of_age.0001.tt.3:0 "Você se saiu bem no campo de [THIS.Char.Custom('education_focus_child')]!\n"
 coming_of_age.0001.tt.4:0 "Você se saiu muito bem no campo de [THIS.Char.Custom('education_focus_child')]!\n"
 coming_of_age.0001.tt.5:0 "Você não vai esquecer sua afeição por [crush.GetFirstNameNoTooltip]: #P +20 opinião#!"
 coming_of_age.0001.tt.7:0 "Você não vai esquecer [Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetTitledFirstNameNoTooltip] tão cedo: #N -5 opinião#!"
 coming_of_age.0001.tt.9:0 "Você não vai esquecer [Select_CString( bully.IsFemale, 'a', 'o' )] [bully.GetTitledFirstNameNoTooltip] tão cedo: #N -10 opinião#!"
 coming_of_age.0001.victim1:0 "\nFico imaginando se [Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetTitledFirstName] lembra das coisas que fiz [victim.GetSheHe] passar quando éramos jovens."
 coming_of_age.0001.victim2:0 "\nAinda consigo lembrar do rosto horrorizado d[Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetTitledFirstName] naquela vez em que destruí seu [victim.Custom('child_favorite_toy')]."
 coming_of_age.0003.desc_child_1:0 "ido mal, e aprendi pouco com meus instrutores de combate."
 coming_of_age.0003.desc_child_2:0 "procedido de forma aceitável, e lutei contra alguns camponeses atrevidos com certo sucesso."
 coming_of_age.0003.desc_child_3:0 "sido bem-sucedido, e matei inúmeros bandidos apesar da minha juventude."
 coming_of_age.0003.desc_child_4:0 "sido excelente, tornando-me um dos melhores $knight_culture_player_plural_no_tooltip_lowercase$ do reino."
 coming_of_age.0003.desc_child_start:0 " Meu treinamento de cavaleiro $knight_culture_player_adjective_no_tooltip_lowercase$ junto com isso tem "
 coming_of_age.1001.a:0 "Eles crescem rápido."
 coming_of_age.1001.desc:0 "Com [Select_CString( educated_child.IsFemale, 'a', 'o' )] [educated_child.GetFirstName] tornando-se adult[Select_CString( educated_child.IsFemale, 'a', 'o' )], minha tutela sobre sua educação chegou ao fim.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1001.desc_university:0 "Com [Select_CString( educated_child.IsFemale, 'a', 'o' )] [educated_child.GetFirstName] tornando-se adult[Select_CString( educated_child.IsFemale, 'a', 'o' )], o tempo que [educated_child.GetSheHe] passará na Universidade chegou ao fim.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1001.patronaged_spouse_plus_1.desc:0 "\n\nAs contribuições d[Select_CString( patronage_spouse_tutor.IsFemale, 'a', 'o' )] [patronage_spouse_tutor.GetTitledFirstName] para a educação de [educated_child.GetFirstName] não podem ser ignoradas. A orientação [patronage_spouse_tutor.GetHerHim|U] ajudou a criança a alcançar mais do que eu poderia sozinho."
 coming_of_age.1001.patronaged_spouse_plus_2_or_more.desc:0 "\n\n[patronage_spouse_tutor.GetTitledFirstName] também deu orientação inestimável à criança. [educated_child.GetFirstName] nunca teria chegado tão longe sem [patronage_spouse_tutor.GetSheHe]."
 coming_of_age.1001.t:0 "[educated_child.GetFirstNameNoTooltip] Torna-se Adult[Select_CString( educated_child.IsFemale, 'a', 'o' )]"
 coming_of_age.1002.desc:0 "Estou orgulhos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] de ver [Select_CString( educated_child.IsFemale, 'minha', 'meu' )] [educated_child.Custom('GetDaughterSon')] não mais como uma criança, mas como um[Select_CString( educated_child.IsFemale, 'a', '' )] adult[Select_CString( educated_child.IsFemale, 'a', 'o' )].\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1002.patronaged_spouse_plus_1.desc:0 "\n\nAs contribuições d[Select_CString( patronage_spouse_tutor.IsFemale, 'a', 'o' )] [patronage_spouse_tutor.GetTitledFirstName] para a educação de [educated_child.GetFirstName] não podem ser ignoradas. As lições [patronage_spouse_tutor.GetHerHim|U] têm dado conhecimento valioso a [educated_child.GetFirstName] para sua vida futura."
 coming_of_age.1002.patronaged_spouse_plus_2_or_more.desc:0 "\n\n[patronage_spouse_tutor.GetTitledFirstName] tem dado orientação inestimável à criança. [educated_child.GetFirstName] nunca teria chegado tão longe sem [patronage_spouse_tutor.GetSheHe]."
 coming_of_age.1002.t:0 "[educated_child.GetFirstNameNoTooltip] Torna-se Adult[Select_CString( educated_child.IsFemale, 'a', 'o' )]"
 coming_of_age.1003.a:0 "Até nos encontrarmos novamente, [educated_child.GetFirstName]."
 coming_of_age.1003.rank_1:0 "\n\nTenho certeza de que os pais [educated_child.GetHerHim] ficarão felizes que a educação esteja completa."
 coming_of_age.1003.rank_2:0 "\n\nEmbora os resultados não sejam excelentes, tenho certeza de que os pais [educated_child.GetHerHim] não terão reclamações."
 coming_of_age.1003.rank_3:0 "\n\nTenho certeza de que os pais [educated_child.GetHerHim] ficarão satisfeitos com minha tutela."
 coming_of_age.1003.rank_4:0 "\n\nOs pais [educated_child.GetHerHim|U] certamente se orgulharão de chamar [educated_child.GetSheHe] de [Select_CString( educated_child.IsFemale, 'sua', 'seu' )] [educated_child.Custom('GetDaughterSon')]"
 coming_of_age.1003.standard:0 "[Select_CString( educated_child.IsFemale, 'Minha', 'Meu' )] pupil[Select_CString( educated_child.IsFemale, 'a', 'o' )], [educated_child.GetTitledFirstName], tornou-se adult[Select_CString( educated_child.IsFemale, 'a', 'o' )], e é hora de [educated_child.GetSheHe] deixar os meus cuidados.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1003.t:0 "Educação Concluída"
 coming_of_age.1004.a:0 "Até nos encontrarmos novamente, [educated_child.GetFirstName]."
 coming_of_age.1004.desc:0 "[Select_CString( educated_child.IsFemale, 'Minha', 'Meu' )] pupil[Select_CString( educated_child.IsFemale, 'a', 'o' )], [educated_child.GetTitledFirstName], tornou-se adulto, e é hora de [educated_child.GetSheHe] deixar os meus cuidados.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1004.t:0 "Educação Concluída"
 coming_of_age.1005.a:0 "Até nos encontrarmos novamente, [educated_child.GetFirstNameNoTooltip]."
 coming_of_age.1005.desc:0 "[Select_CString( educated_child.IsFemale, 'Minha', 'Meu' )] pupil[Select_CString( educated_child.IsFemale, 'a', 'o' )], [educated_child.GetTitledFirstName], tornou-se adulto, e é hora de [educated_child.GetSheHe] deixar os meus cuidados.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')] [educated_child.Custom('DescribingEducationOutcomeProwess')]"
 coming_of_age.1005.t:0 "Educação Concluída"
 coming_of_age.3011.a:0 "Este é meu destino!"
 coming_of_age.3011.b:0 "Uma #EMP vida inteira#! pela frente..."
 coming_of_age.3011.c:0 "Espero estar pront[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] para isso."
 coming_of_age.3011.desc:0 "Desde que fui nomeado [senior_emp.GetDiarchTitle] por [junior_emp.MakeScope.Var('co_emp_appointer').Char.Custom2('MyCharacterIntroduction', junior_emp)], eu sabia que esse dia chegaria.\n\nSou um[Select_CString( junior_emp.IsFemale, 'a', '' )] [junior_emp.GetWomanMan] agora, e isso significa que o poder que possuo não é mais meramente nominal. Quando eu falo, [senior_emp.GetPrimaryTitle.GetDefinitiveName] escuta, e quando eu comando, ele obedece.\n\nÉ meu primeiro passo real no caminho para o trono."
 coming_of_age.3011.t:0 "Em Muito Mais do que Nome"
 coming_of_age.3011.tt.convert_sop_swing:0 "Manteve ['50%'|P] do balanço de [scales_of_power|E] que [CharYouSheHe(junior_emp)] ganhou durante a infância"
 coming_of_age.3011.tt.fake_diarchy_transition:0 "[power_sharing|E] de [senior_emp.GetShortUIName|U] transicionou para um [duumvirate|E]"
 coming_of_age.3011.tt.not_enough_sop_swing_to_buffs:0 "Não teve balanço suficiente de [scales_of_power|E] para ganhar pontos extras de [skills|E]"
 coming_of_age.3011.tt.various_new_powers:0 "[CharWereWas(junior_emp)|U] recebeu acesso a muitos novos [diarch_powers|E]"
 coming_of_age.3012.a:0 "O púrpura exige muito de nós..."
 coming_of_age.3012.desc.intro:0 "O dia finalmente chegou: [junior_emp.Custom2('MyCharacterIntroduction', senior_emp)] é verdadeiramente um[Select_CString( junior_emp.IsFemale, 'a', '' )] [junior_emp.GetWomanMan], pront[Select_CString( junior_emp.IsFemale, 'a', 'o' )] para assumir seu lugar como a segunda pessoa mais poderosa em toda [senior_emp.GetPrimaryTitle.GetDefinitiveName].\n\nDepois de mim, é claro.\n\nEmbora um[Select_CString( senior_emp.IsFemale, 'a', '' )] jovem [senior_emp.GetDiarchTitle] tenha pouca influência sobre o estado do reino, uma vez que crescem em seu papel, há pouco que eles #EMP não#! possam influenciar.\n\n"
 coming_of_age.3012.desc.junior_emp_appointed_elsewhere:0 "Só posso esperar que [junior_emp.MakeScope.Var('co_emp_appointer').Char.GetFirstName] tenha escolhido bem"
 coming_of_age.3012.desc.outro:0 "elevando [junior_emp.GetSheHe] a esta alta posição."
 coming_of_age.3012.desc.senior_emp_appointed_junior_emp:0 "Só posso esperar que eu tenha feito uma escolha sábia "
 coming_of_age.3012.t:0 "$coming_of_age.3011.t$"
