l_spanish:
 bully_stops:0 "[bully.GetFirstName] para de te intimidar"
 childhood.7000.a.failure:0 "[stolen_clothes.GetSheHe|U] pega você no ato"
 childhood.7000.a.success:0 "Você rouba as roupas"
 childhood.7000.a:0 "Vou entrar sorrateiramente nos aposentos [stolen_clothes.GetHerHim] e pegar as roupas!"
 childhood.7000.b:0 "[child_helper.GetFirstNameNoTooltip], distraia [stolen_clothes.GetSheHe]. #EMP Vamos lá!#!"
 childhood.7000.c:0 "Não, devo ser legal. Tire um descanso, [stolen_clothes.GetFirstNameNoTooltip]."
 childhood.7000.d:0 "Hm, a hora não está certa..."
 childhood.7000.desc:0 "[Select_CString( stolen_clothes.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('stolen_clothes'))] [stolen_clothes.GetFirstName] parece um pouco... #EMP restrit[Select_CString( stolen_clothes.IsFemale, 'a', 'o' )],#! eu diria! [stolen_clothes.GetSheHe|U] está levando as coisas muito a sério, lidando com assuntos na corte dia após dia. Talvez eu devesse #EMP alegrar#! o ambiente um pouco?\n\n"
 childhood.7000.desc_child:0 "Eu sei que [child_helper.GetFirstName] estaria dispost[Select_CString( child_helper.IsFemale, 'a', 'o' )] a me ajudar a executar meu #EMP plano malicioso#! se eu chamá-l[Select_CString( child_helper.IsFemale, 'a', 'o' )].\n\n"
 childhood.7000.desc_end:0 "Fico imaginando como [stolen_clothes.GetFirstNameNoTooltip] reagiria se as roupas [stolen_clothes.GetHerHim] desaparecessem. #EMP risadinha#!"
 childhood.7000.t:0 "Prendendo [stolen_clothes.GetFirstNameNoTooltip] de surpresa"
 childhood.7001.a:0 "E farei de novo! E de novo! E #EMP de novo!#!"
 childhood.7001.b:0 "Não teria conseguido sem você, [child_helper.GetFirstNameNoTooltip]!"
 childhood.7001.c:0 "Uma boa brincadeira faz toda a diferença!"
 childhood.7001.desc_angry:0 "[stolen_clothes.GetFirstNameNoTooltip] levantou-se furios[Select_CString( stolen_clothes.IsFemale, 'a', 'o' )] e correu atrás de mim pelo corredor, sem uma única peça de roupa no corpo!\n\n\"Seu pirralho irritante! Devolva minhas roupas imediatamente, ou vou torcer seu pescoço!\" [stolen_clothes.GetSheHe|U] grita, bufando de raiva.\n\n[stolen_clothes.GetFirstNameNoTooltip] pode não ter gostado da minha brincadeira inteligente, mas todos os outros acharam #EMP hilário#!"
 childhood.7001.desc_funny:0 "[stolen_clothes.GetFirstNameNoTooltip] se levanta rapidamente e sai correndo pelo corredor, sem uma única peça de roupa no corpo!\n\n\"Filho! Devolva minhas roupas, não tenho tempo para isso!\" [stolen_clothes.GetSheHe|U] grita, correndo até o salão principal antes de parar e perceber o que [stolen_clothes.GetSheHe] fez!\n\nTodos, incluindo [stolen_clothes.GetFirstNameNoTooltip], acharam a situação #EMP muito#! engraçada e riram até ficarem vermelhos de tanto rir."
 childhood.7001.desc_helper:0 "Sucesso! [child_helper.GetFirstName] distraiu [stolen_clothes.GetFirstName] soltando [ROOT.Char.Custom('GetLivestockFowlIndef')] no quarto [stolen_clothes.GetHerHim] cedo esta manhã - enquanto isso, eu roubei todas as peças de roupa que pude encontrar!"
 childhood.7001.desc_nohelper:0 "Sucesso! Consegui entrar sorrateiramente no quarto de [stolen_clothes.GetFirstNameNoTooltip] e pegar todas as roupas antes de [stolen_clothes.GetSheHe] acordar!"
 childhood.7002.a:0 "#EMP Não! Ewww!#!"
 childhood.7002.b:0 "Isso nunca mais vai acontecer, prometo!"
 childhood.7002.c:0 "Foi #EMP TUDO#! ideia de [child_helper.GetFirstNameNoTooltip]!"
 childhood.7002.desc_angry:0 "[stolen_clothes.GetSheHe|U] rapidamente alcança o vaso sanitário cheio de conteúdo, jogando-o com incrível precisão. Com um alto #flatulence splash#! Estou cobert[Select_CString( stolen_clothes.IsFemale, 'a', 'o' )] do que só posso assumir serem #EMP várias noites#! de excremento!\n\n\"Isso vai te ensinar a me perturbar! Saia daqui, senão tem mais de onde veio!\" [stolen_clothes.GetSheHe|U] grita."
 childhood.7002.desc_funny:0 "\"Agora, escute aqui!\" [stolen_clothes.GetFirstNameNoTooltip] diz, segurando firme a minha orelha. \"Você não pode sair por aí roubando roupas! Acho que você está atrasad[Select_CString( stolen_clothes.IsFemale, 'a', 'o' )] para uma lição de etiqueta...\"\n\nOh não, não a #EMP etiqueta!#!"
 childhood.7002.desc_helper:0 "Oh não! [child_helper.GetFirstName] soltou [ROOT.Char.Custom('GetLivestockFowlIndef')] no quarto de [stolen_clothes.GetFirstNameNoTooltip], mas ele nos traiu! Ele gritou alto quando entramos, e [stolen_clothes.GetFirstNameNoTooltip] pulou direto da cama, nos vendo.\n\n"
 childhood.7002.desc_nohelper:0 "Maldição! Enquanto eu entro sorrateiramente, os olhos de [stolen_clothes.GetFirstNameNoTooltip] se abrem e [stolen_clothes.GetSheHe] pula da cama!\n\n"
 childhood.7100.a:0 "O.. o quê!? N.. não!"
 childhood.7100.b:0 "...#MORRA1 ha#!haHA! Vocês viram isso!"
 childhood.7100.beating_target_2:0 "Ou talvez [Select_CString( beating_target_2.IsFemale, 'a', 'o' )] [beating_target_2.GetTitledFirstName] seja mais digno da minha atenção? [beating_target_1.GetSheHe|U], também é frac[Select_CString( beating_target_1.IsFemale, 'a', 'o' )].\n\n"
 childhood.7100.beating_target_3:0 "E sempre há [Select_CString( beating_target_3.IsFemale, 'a', 'o' )] insignificante [beating_target_3.GetTitledFirstName], eu poderia apenas #EMP encarar#! [beating_target_3.GetSheHe]!"
 childhood.7100.c:0 "Meh."
 childhood.7100.d.friend:0 "Seu amigo [friend_to_comfort.GetFirstNameNoTooltip] faz o possível para te consolar"
 childhood.7100.d:0 "S.. você pode me abraçar por um tempo, [friend_to_comfort.GetFirstNameNoTooltip]?"
 childhood.7100.desc:0 "Enquanto estou brincando no pátio, vejo [child_to_annihilate.GetFirstName] brincando com outras crianças.\n\n"
 childhood.7100.desc_end:0 "O silêncio repentino logo é substituído pelos gritos aterrorizados dos espectadores. Como [ROOT.Char.GetFaith.HighGodName] permitiria que isso acontecesse!?"
 childhood.7100.kicked_by_camel:0 "Sem aviso, enquanto [child_to_annihilate.GetSheHe] passa perto de um camelo, ele empina. [child_to_annihilate.GetFirstNameNoTooltip] é arremessad[Select_CString( child_to_annihilate.IsFemale, 'a', 'o' )] a vários metros de distância e fica ensanguentad[Select_CString( child_to_annihilate.IsFemale, 'a', 'o' )] e imóvel no chão.\n\n"
 childhood.7100.kicked_by_horse:0 "Sem aviso, enquanto [child_to_annihilate.GetSheHe] passa perto de um cavalo, ele empina. [child_to_annihilate.GetFirstNameNoTooltip] é arremessad[Select_CString( child_to_annihilate.IsFemale, 'a', 'o' )] a vários metros de distância e fica ensanguentad[Select_CString( child_to_annihilate.IsFemale, 'a', 'o' )] e imóvel no chão.\n\n"
 childhood.7100.killed_by_sow:0 "De repente, enquanto [child_to_annihilate.GetFirstNameNoTooltip] pula perto do chiqueiro, uma porca enorme agarra o braço [child_to_annihilate.GetHerHim]. Ela não solta. Eu viro o rosto conforme os gritos ficam mais altos e altos, até que eventualmente param.\n\n"
 childhood.7100.smashed_by_roof_tile:0 "Enquanto [child_to_annihilate.GetSheHe] passa embaixo de um prédio próximo, uma telha pesada do telhado de solta subitamente. Com um alto #EMP baque#! ela acerta a cabeça de [child_to_annihilate.GetFirstNameNoTooltip], derrubando-[Select_CString( child_to_annihilate.IsFemale, 'a', 'o' )] instantaneamente.\n\n"
 childhood.7100.stomped_by_elephant:0 "Sem aviso, enquanto [child_to_annihilate.GetSheHe] passa perto de um elefante, ele se levanta e trombeta selvagemente. O elefante desce uma de suas patas gigantes em cima de [child_to_annihilate.GetFirstNameNoTooltip], esmagando [child_to_annihilate.GetSheHe] no chão.\n\n"
 childhood.7100.t:0 "Uma Visão Traumatizante"
 childhood.7200.a:0 "Vou estudar noite e dia!"
 childhood.7200.b:0 "Hm, vou pedir a um servo para ler algumas fábulas em [language_friend.GetCulture.GetLanguage.GetNameNoTooltip]."
 childhood.7200.c:0 "Não, é muito trabalho. E temos #EMP brincadeiras#! para fazer!"
 childhood.7200.desc:0 "Eu realmente gosto de brincar com [language_friend.GetFirstName], mas às vezes é difícil entender o que [language_friend.GetSheHe] está dizendo...\n\nEmbora seja perfeitamente possível se comunicar apenas com gestos e caretas, sinto que seria muito divertido se eu pudesse falar [language_friend.GetCulture.GetLanguage.GetNameNoTooltip] com [language_friend.GetSheHe]!\n\nTalvez eu devesse estudar bastante, pelo bem de [language_friend.GetFirstNameNoTooltip]?"
 childhood.7200.t:0 "Barreira Linguística"
 childhood.7300.a.failure:0 "Você não consegue intimidar [beating_target_1.GetFirstNameNoTooltip]"
 childhood.7300.a.success:0 "Você intimida [beating_target_1.GetFirstNameNoTooltip]"
 childhood.7300.a:0 "[beating_target_1.GetFirstNameNoTooltip], deixe-me apresentar meus punhos a você!"
 childhood.7300.b.failure:0 "Você não consegue intimidar [beating_target_2.GetFirstNameNoTooltip]"
 childhood.7300.b.success:0 "Você intimida [beating_target_2.GetFirstNameNoTooltip]"
 childhood.7300.b:0 "Venha aqui, [beating_target_2.GetFirstNameNoTooltip]..."
 childhood.7300.c.failure:0 "Você não consegue intimidar [beating_target_3.GetFirstNameNoTooltip]"
 childhood.7300.c.success:0 "Você intimida [beating_target_3.GetFirstNameNoTooltip]"
 childhood.7300.c:0 "Nada pessoal, [beating_target_3.GetFirstNameNoTooltip], é apenas negócios."
 childhood.7300.d:0 "Isso está abaixo de mim..."
 childhood.7300.desc:0 "Em breve, vou governar de verdade – sem ser supervisionado por guardiões volúveis e professores sabichões... e quando isso acontecer, devo garantir que meus súditos estejam sob meu controle.\n\n[beating_target_1.GetTitledFirstName] é fraco e submisso, tenho certeza de que minha presença intimidadora inspiraria [beating_target_1.GetSheHe] a ser... #EMP leal#! no futuro.\n\n"
 childhood.7300.desc_end:0 "Escolhas, escolhas..."
 childhood.7300.t:0 "'Preparando' para o Futuro"
 childhood.7400.a:0 "Você vai fazer o que eu mandar a partir de agora, entendeu?"
 childhood.7400.b:0 "[bodyguard.GetFirstNameNoTooltip], dê uma lição n[bully.GetSheHe]!"
 childhood.7400.c:0 "Você precisa aprender a ser legal."
 childhood.7400.desc:0 "Oh não... [Select_CString( bully.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('bully'))] [bully.GetFirstName] está aqui de novo. Eu só quero brincar em paz, por que [bully.GetSheHe] não pode me deixar em paz!\n\n\"O que você está fazendo, #EMP [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bully'))]!#!\" [bully.GetFirstNameNoTooltip] grita na minha cara."
 childhood.7400.desc_2:0 "\n\nDe repente, um toque no meu ombro. \"Está te incomodando?\" [bodyguard.GetFirstName], meu guarda-costas, diz com uma voz calma. \"Devo ensinar a [bully.GetSheHe] alguns modos?\""
 childhood.7400.t:0 "Guardião contra Bullying"
 childhood.7400_father_dead:0 "\"Você é um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bully'))] [ROOT.Char.Custom2('InsultAdjective'), bully] nojento! Ah, e também... seu pai está morto! Ha-hah!\""
 childhood.7400_mother_dead:0 "\"Você é um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bully'))] repugnante! Ah, e também... sua mãe está morta! Ha-hah!\""
 childhood.7400_none_dead:0 "\"Você é um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bully'))] podre, ninguém quer brincar com você!\""
 childhood.7500.a:0 "Que história maravilhosa, [guardian.GetFirstNameNoTooltip]."
 childhood.7500.b:0 "#DIE2 ...z#!#DIE1 z#!zZ"
 childhood.7500.childhood:0 "\n\n\"...uma história da minha própria infância! Ah, como me sinto velh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )].\""
 childhood.7500.death:0 "\n\n\"...querid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetFirstNameNoTooltip], lembre-se da moral da minha história. A morte vem para todos nós — certifique-se de que ela venha para os seus inimigos antes de vir para você.\""
 childhood.7500.desc:0 "\"Chegue mais perto, tenho uma história que quero contar.\" [Select_CString( guardian.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] [guardian.GetTitledFirstName] diz, me chamando em direção à fogueira.\n\n"
 childhood.7500.family:0 "\n\n\"...lembre-se da importância da sua família, [ROOT.Char.GetFirstNameNoTooltip]. Carregue o nome da Casa [ROOT.Char.GetHouse.GetNameNoTooltip] com orgulho. #EMP [ROOT.Char.GetHouse.GetMotto].#!\""
 childhood.7500.martial:0 "\n\n\"...aperfeiçoe suas habilidades, sua destreza e sua sagacidade na batalha. [ROOT.Char.GetFirstNameNoTooltip], você terá inimigos sem limites, treine para poder derrotá-los.\""
 childhood.7500.midpoint:0 "[guardian.GetFirstNameNoTooltip] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('guardian'))] e continua a contar a história enquanto as chamas da fogueira lambem o céu noturno."
 childhood.7500.no_participant:0 "\"É uma história de quando [guardian_memory.GetDescription]...\""
 childhood.7500.participant:0 "\"É uma história de quando [guardian_memory.GetDescription]. Sim, [Select_CString( memory_participant.IsFemale, 'minha', 'meu' )] [guardian.Custom2('RelationToMe', SCOPE.sC('memory_participant'))]...\""
 childhood.7500.participant_dead:0 "\"É uma história de quando [guardian_memory.GetDescription]. [memory_participant.GetSheHe|U] era [Select_CString( memory_participant.IsFemale, 'minha', 'meu' )] [guardian.Custom2('RelationToMe', SCOPE.sC('memory_participant'))], que [memory_participant.GetDeathReason]...\""
 childhood.7500.relationships:0 "\n\n\"...aqueles ao seu redor, seus amigos, seus conselheiros, até mesmo seus rivais — são eles que importam. Mantenha-os por perto, especialmente seus inimigos.\""
 childhood.7500.t:0 "Uma História do Passado"
 childhood.7500.war:0 "\n\n\"...as devastadoras consequências da guerra testarão a coragem de tod[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetWomanMan]. Lembre-se, a verdadeira estratégia requer astúcia, [ROOT.Char.GetFirstNameNoTooltip].\""
 culture_tradition_events.2100.b:0 "Suas histórias sempre me fazem sentir melhor, de verdade."
 culture_tradition_events.2100.t:0 "Uma História ao Redor da Fogueira"
 death_camel:0 "foi morto por um camelo empinado"
 death_horse:0 "foi morto por um cavalo empinado"
 death_roof_tile:0 "teve sua cabeça esmagada por uma telha que caiu"
 death_sow:0 "foi morto por uma porca"
 entertained_opinion:0 "Entretido"
 every_parent_of_bully:0 "Todos os Pais de [bully.GetFirstName]"
 funny_opinion:0 "Engraçado"
 skill_increased:0 "Aumento de Habilidade"
