l_spanish:
 marriage_effect.0001.a:0 "Esse segredo não vai mais me assombrar."
 marriage_effect.0001.a_not_knowing:0 "Oh, eu... fico feliz."
 marriage_effect.0001.desc.child:0 "Passei muitas noites sem dormir preocupada com m[Select_CString( illegitimate_child.IsFemale, 'inha', 'eu' )] [illegitimate_child.Custom('GetDaughterSon')] [illegitimate_child.GetTitledFirstName] e o que aconteceria conosco se a verdade sobre sua paternidade viesse à tona.\n\nAgora que seu pai, [new_spouse.GetTitledFirstName], e eu estamos legalmente casados, meus antigos medos finalmente podem descansar."
 marriage_effect.0001.desc.multiple:0 "Finalmente, as coisas estão como sempre deveriam ter sido. O segredo pairando sobre meus [illegitimate_child.Custom('TwinDaughtersSonsChildren')] não pode mais nos machucar, agora que seu pai, [new_spouse.GetTitledFirstName], e eu estamos legalmente casados."
 marriage_effect.0001.desc.pregnancy:0 "Desde o dia em que descobri que estava grávida, tenho me preocupado muito com o futuro do meu filho. Finalmente estou livre desses medos, agora que seu pai, [new_spouse.GetTitledFirstName], e eu estamos legalmente casados."
 marriage_effect.0001.t:0 "Corrigindo Tudo"
 marriage_effect.0002.desc.child:0 "Passei muitas noites sem dormir preocupado com m[Select_CString( illegitimate_child.IsFemale, 'inha', 'eu' )] [illegitimate_child.Custom('GetDaughterSon')] [illegitimate_child.GetTitledFirstName] e o que aconteceria com [illegitimate_child.GetSheHe] se a verdade sobre sua paternidade viesse à tona.\n\nAgora que sua mãe, [real_mother.GetTitledFirstName], e eu estamos legalmente casados, meus antigos medos finalmente podem descansar."
 marriage_effect.0002.desc.multiple:0 "Finalmente, as coisas estão como sempre deveriam ter sido. O segredo pairando sobre meus [illegitimate_child.Custom('TwinDaughtersSonsChildren')] não pode mais machucá-los ou sua mãe, [real_mother.GetTitledFirstName], agora que estamos legalmente casados."
 marriage_effect.0002.desc.pregnancy:0 "Desde o dia em que descobri que [real_mother.GetTitledFirstName] estava grávida de nosso filho, tenho me preocupado muito com o futuro de nossa criança. Agora que estamos legalmente casados, meus medos finalmente podem ser deixados de lado."
 marriage_effect.0002.desc.pregnancy_not_knowing:0 "[real_mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim com uma mão na barriga.\n\n\"Eu não te contei isso antes, mas... O filho que estou esperando é seu. Agora que estamos legalmente casados, esse segredo não pode nos prejudicar.\""
 marriage_effect.0003.desc.multiple:0 "Tenho me preocupado com m[Select_CString( real_mother.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_mother') )] [real_mother.GetTitledFirstName] e m[Select_CString( illegitimate_child.IsFemale, 'inhas', 'eus' )] [illegitimate_child.Custom('TwinDaughtersSonsChildren')] desde que nasceram, sabendo que foram concebidos pela união ilícita [real_mother.GetHerHim] com [new_spouse.GetTitledFirstName].\n\nAgora que [new_spouse.GetTitledFirstName] e [real_mother.GetFirstName] estão legalmente casados, meus antigos medos finalmente podem descansar."
 marriage_effect.0003.desc.pregnancy:0 "Desde o dia em que descobri que m[Select_CString( real_mother.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_mother') )] [real_mother.GetTitledFirstName] estava grávida do filho de [new_spouse.GetTitledFirstNamePossessive], carreguei o segredo deles perto do meu peito. Agora que eles estão legalmente casados, finalmente posso relaxar."
 marriage_effect.0003.desc:0 "Tenho me preocupado com m[Select_CString( real_mother.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_mother') )] [real_mother.GetTitledFirstName] e m[Select_CString( illegitimate_child.IsFemale, 'inha', 'eu' )] [illegitimate_child.Custom('GetDaughterSon')] [illegitimate_child.GetTitledFirstName] desde que a criança nasceu, sabendo que ela foi concebida pela união ilícita [real_mother.GetHerHim] com [new_spouse.GetTitledFirstName].\n\nAgora que [new_spouse.GetTitledFirstName] e [real_mother.GetFirstName] estão legalmente casados, meus antigos medos finalmente podem descansar."
 marriage_effect.0011.desc.child:0 "Passei muitas noites sem dormir preocupada com m[Select_CString( illegitimate_child.IsFemale, 'inha', 'eu' )] [illegitimate_child.Custom('GetDaughterSon')] [illegitimate_child.GetTitledFirstName] e o que aconteceria conosco se a verdade sobre sua paternidade viesse à tona.\n\nAgora que seu pai, [new_spouse.GetTitledFirstName], e eu estamos legalmente unidos, meus antigos medos finalmente podem descansar."
