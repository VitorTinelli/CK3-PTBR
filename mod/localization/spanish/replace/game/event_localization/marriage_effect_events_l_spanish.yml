 marriage_effect.0011.desc.pregnancy:0 "Desde o dia em que descobri que estava grávida, tenho me preocupado muito com o futuro do meu filho. Finalmente estou livre desses medos, agora que seu pai, [new_spouse.GetTitledFirstName], e eu estamos legalmente unidos."
