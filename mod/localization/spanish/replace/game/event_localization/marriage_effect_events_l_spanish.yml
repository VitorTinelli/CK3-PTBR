 marriage_effect.0012.desc.pregnancy_not_knowing:0 "[real_mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim com uma mão em sua barriga.\n\n\"Eu não te contei isso antes, mas... A criança que estou esperando é sua. Agora que estamos legalmente unidos, este segredo não pode mais nos prejudicar.\""
 marriage_effect.0013.desc.multiple:0 "Tenho me preocupado com minha [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_mother') )] [real_mother.GetTitledFirstName] e m[Select_CString( illegitimate_child.IsFemale, 'inhas', 'eus' )] [illegitimate_child.Custom('TwinDaughtersSonsChildren')] desde que nasceram, sabendo que foram concebidos pela união ilícita [real_mother.GetHerHim] com [new_spouse.GetTitledFirstName].\n\nAgora que [new_spouse.GetTitledFirstName] e [real_mother.GetFirstName] estão legalmente unidos, meus antigos medos finalmente podem descansar."
 marriage_effect.0013.desc.pregnancy:0 "Desde o dia em que descobri que minha [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_mother') )] [real_mother.GetTitledFirstName] estava grávida do filho de [new_spouse.GetTitledFirstNamePossessive], carreguei o segredo deles perto do meu peito. Agora que eles estão legalmente unidos, finalmente posso relaxar."
 marriage_effect.0013.desc:0 "Tenho me preocupado com minha [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_mother') )] [real_mother.GetTitledFirstName] e m[Select_CString( illegitimate_child.IsFemale, 'inha', 'eu' )] [illegitimate_child.Custom('GetDaughterSon')] [illegitimate_child.GetTitledFirstName] desde que a criança nasceu, sabendo que ela foi concebida pela união ilícita [real_mother.GetHerHim] com [new_spouse.GetTitledFirstName].\n\nAgora que [new_spouse.GetTitledFirstName] e [real_mother.GetFirstName] estão legalmente unidos, meus antigos medos finalmente podem descansar."
 marriage_effect.1001.a:0 "Venha aqui, m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse') )]!"
 marriage_effect.1001.desc:0 "Oh [spouse.GetTitledFirstName], m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [spouse.Custom('LoverPetName')]! Pensar que agora posso abraçar você abertamente, com a bênção tanto de [ROOT.Char.GetFaith.FertilityGodName] quanto das pessoas ao nosso redor... Sou a pessoa mais feliz do mundo!"
 marriage_effect.1001.t:0 "O Amor Prevalece"
 marriage_effect.1002.a:0 "Venha aqui, m[Select_CString( spouse_2.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse_2') )]!"
 marriage_effect.1002.desc:0 "Oh [spouse_2.GetTitledFirstName], m[Select_CString( spouse_2.IsFemale, 'inha', 'eu' )] [spouse_2.Custom('LoverPetName')]! Pensar que agora posso abraçar você abertamente, com a bênção tanto de [ROOT.Char.GetFaith.FertilityGodName] quanto das pessoas ao nosso redor... Sou a pessoa mais feliz do mundo!"
 marriage_effect.2001.a:0 "Claro que vou cobrar! Quem paga pelo próprio casamento?"
 marriage_effect.2001.b:0 "Vou deixar meus súditos aproveitarem as festividades sem preocupações."
 marriage_effect.2001.desc.end:0 "\n\nTenho todo o direito de cobrar um tributo real como parte disso, mas alguns podem considerar desagradável impor um imposto extra durante um momento de jubilação..."
 marriage_effect.2001.desc.start_divine_marriage:0 "Com meu casamento com [new_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)], o reino está ansioso por uma grande recepção para celebrar a reunião de nosso sangue divino."
 marriage_effect.2001.desc.start_normal:0 "Com meu casamento com [new_spouse.GetTitledFirstName], nós esperamos que realizemos uma celebração de casamento adequadamente extravagante."
 marriage_effect.2001.desc.start_prison:0 "[Select_CString( new_spouse.IsFemale, 'Minha nova', 'Meu novo' )] cônjuge, [new_spouse.GetTitledFirstName], está atualmente preso. Mesmo assim, nosso casamento é válido e o reino ainda espera uma celebração de casamento extravagante."
 marriage_effect.2001.t:0 "Celebração de Casamento"
