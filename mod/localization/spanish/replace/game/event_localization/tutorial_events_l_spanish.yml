l_spanish:
 tutorial.0001.a:0 "Vou falar com [bad_guy.GetTitledFirstNameNoTooltip]."
 tutorial.0001.a_flavor:0 "#TUT Ao escolher esta opção, você tentará se tornar amigo de [bad_guy.GetTitledFirstName], potencialmente fazendo um novo [friend|e] e evitando uma [war|e] completamente.#!"
 tutorial.0001.b:0 "Não temo tolos bêbados."
 tutorial.0001.b_flavor:0 "#TUT Ao escolher esta opção, você declara que não tem medo de uma possível [war|e] liderada por [bad_guy.GetTitledFirstName]. Isso lhe rende uma quantidade moderada de [prestige|e]."
 tutorial.0001.c.tt.failure:0 "Você ofende [potential_ally.GetTitledFirstNameNoTooltip]"
 tutorial.0001.c.tt.success:0 "Você convence [potential_ally.GetTitledFirstNameNoTooltip]"
 tutorial.0001.c:0 "Uma pequena doação para o cofre de guerra é necessária."
 tutorial.0001.c_flavor:0 "#TUT Esta opção permite que você tente convencer [potential_ally.GetTitledFirstName] a ajudá-lo financeiramente. Se conseguir convencer [potential_ally.GetSheHe], o extra de [gold|e] pode ser benéfico para evitar ou vencer uma [war|e].#!"
 tutorial.0001.desc:0 "Tarde da noite, [Select_CString( potential_ally.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('potential_ally'))] [potential_ally.GetFirstName] bate à porta do meu quarto. Eu deixo [potential_ally.GetSheHe] entrar, e [potential_ally.GetSheHe] diz algo preocupante, sua expressão completamente solene. \n\n\"[GetPlayer.GetFirstNameNoTooltip], você ouviu as notícias? [bad_guy.GetTitledFirstName] está prestes a reivindicar falsamente suas terras. Receio dizer, mas temo que [bad_guy.GetSheHe] esteja se preparando para a guerra.\""
 tutorial.0001.t:0 "Um Desenvolvimento Preocupante em Ennis"
 tutorial.0002.a.tt.crit_success:0 "Você faz um argumento muito convincente"
 tutorial.0002.a.tt.failure:0 "Você ofende [bad_guy.GetTitledFirstNameNoTooltip]"
 tutorial.0002.a.tt.success:0 "Você faz um bom argumento"
 tutorial.0002.a.tt:0 "Você entra em uma [alliance|e] com [bad_guy.GetTitledFirstName]"
 tutorial.0002.a:0 "Deve haver outro caminho..."
 tutorial.0002.a_flavor:0 "#TUT Esta opção permite que você tente conversar com [bad_guy.GetTitledFirstName]. Existe a chance de [bad_guy.GetSheHe] ser receptivo à sua [diplomacy|e], mas também há o risco de [bad_guy.GetSheHe] se ofender.#!"
 tutorial.0002.b:0 "Hah! Um brincalhão, aquel[Select_CString( bad_guy.IsFemale, 'a', 'e' )] [bad_guy.GetFirstNameNoTooltip]."
 tutorial.0002.b_flavor:0 "#TUT Por ser [Concept('friends', 'amigo')|E] de [bad_guy.GetTitledFirstName], você sabe que enquanto [bad_guy.GetSheHe] fala muito, [bad_guy.GetSheHe] na verdade não está tramando nada.#!"
 tutorial.0002.c:0 "Estou cansado desses jogos. [bad_guy.GetFirstNameNoTooltip] se submeterá a mim. #!"
 tutorial.0002.c_flavor:0 "#TUT Esta opção permitirá que você tente transformar [bad_guy.GetTitledFirstNameNoTooltip] à força em um [vassal|e] sob seu governo. Para fazer isso, você terá que vencer uma [war|e] contra [bad_guy.GetSheHe]!#!"
 tutorial.0002.desc:0 "Sou mais uma vez abordado por [Select_CString( potential_ally.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('potential_ally'))] [potential_ally.GetFirstName], seus lábios curvados em um sorriso tímido. [potential_ally.GetSheHe|U] limpa a garganta desconfortavelmente. \n\n\"[GetPlayer.GetFirstNameNoTooltip], meu amigo! Houve um pequeno desenvolvimento em relação [Select_CString( bad_guy.IsFemale, 'a', 'ao' )] [bad_guy.GetTitledFirstName]. Você vê, estávamos bebendo outro dia, e ouvi [bad_guy.GetSheHe] se vangloriar de seus planos de invasão.\"\n\n\"Receio que você tenha pouco tempo antes que [bad_guy.GetSheHe] faça o movimento.\""
 tutorial.0002.t:0 "[bad_guy.GetTitledFirstNameNoTooltip] se Prepara para a Guerra"
