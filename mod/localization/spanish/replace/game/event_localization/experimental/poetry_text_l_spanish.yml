l_spanish:
 0002.blank_verse_line_1_A:0 " Rei Marsílio, ele repousava em Sarraguce,"
 0002.blank_verse_line_1_B:0 " Blancandrins era um pagão muito sábio,"
 0002.blank_verse_line_1_C:0 " Carlos, o Rei, nosso Senhor e Soberano,"
 0002.blank_verse_line_1_D:0 " Alegre e destemido é agora esse Imperador,"
 0002.blank_verse_line_2_A:0 " Ele foi seu caminho para um pomar fresco;"
 0002.blank_verse_line_2_B:0 " Em vassalagem ele era um cavaleiro valente,"
 0002.blank_verse_line_2_C:0 " Passou sete anos na Espanha,"
 0002.blank_verse_line_2_D:0 " Cordres ele detém, as muralhas estão desmoronadas,"
 0002.blank_verse_line_3_A:0 " Lá em um trono ele se sentava, de mármore azul,"
 0002.blank_verse_line_3_B:0 " Primeiro em destreza, ele estava ao lado de seu senhor."
 0002.blank_verse_line_3_C:0 " Conquistou a terra e venceu o oceano ocidental,"
 0002.blank_verse_line_3_D:0 " Suas catapultas derrubaram cidade e torre."
 0002.blank_verse_line_4_A:0 " Ao seu redor, seus homens, vinte mil, estavam."
 0002.blank_verse_line_4_B:0 " E assim ele falou: 'Não vos assusteis!'"
 0002.blank_verse_line_4_C:0 " Agora nenhuma fortaleza permanece contra ele,"
 0002.blank_verse_line_4_D:0 " Prata e ouro e muitos vestidos adornados."
 0003.line_1_A:0 "Uma terra devastada por [ROOT.GetCharacter.Custom('noun_specific_singular_one')|D] malicioso"
 0003.line_1_B:0 "Em uma era duradoura de [ROOT.GetCharacter.Custom('noun_abstract_plural_one')|D]"
 0003.line_1_C:0 "[ROOT.GetCharacter.Custom('noun_specific_singular_two')|D] Carlos, o Rei, nosso Senhor e Soberano,"
 0003.line_1_D:0 "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] Alegre e destemido é agora esse Imperador,"
 0003.line_2_A:0 "Todos nos rendemos a [ROOT.GetCharacter.Custom('noun_abstract_singular_one')|D] tão cruel"
 0003.line_2_B:0 "Vendo agora com olhos de [ROOT.GetCharacter.Custom('noun_abstract_plural_two')|D]"
 0003.line_2_C:0 "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] Passou sete anos na Espanha,"
 0003.line_2_D:0 "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] Cordres ele detém, as muralhas estão desmoronadas,"
 0003.line_3_A:0 "Se o seu [ROOT.GetCharacter.Custom('noun_specific_singular_two')|D] eu não alcançar"
 0003.line_3_B:0 "Após [ROOT.GetCharacter.Custom('two_syllable_number')|D] anos de [ROOT.GetCharacter.Custom('noun_abstract_plural_two')|D]"
 0003.line_3_C:0 "[ROOT.GetCharacter.Custom('noun_specific_singular_two')|D] Conquistou a terra, e venceu o oceano ocidental,"
 0003.line_3_D:0 "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] Suas catapultas derrubaram cidade e torre."
 0003.line_4_A:0 "Eles podem nunca levar meu [ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D]"
 0003.line_4_B:0 "Logo os [ROOT.GetCharacter.Custom('noun_specific_plural_two')|D] são todos esquecidos"
 0003.line_4_C:0 "[ROOT.GetCharacter.Custom('noun_specific_singular_two')|D] Agora nenhuma fortaleza permanece contra ele,"
 0003.line_4_D:0 "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] Prata e ouro e muitos vestidos adornados."
 0003.poetry_from:0 "[actor.GetTitledFirstName] escreveu um poema para você\n\n"
 first_line_text_set_1_A:0 "Eu sou uma flor gentil e delicada"
 first_line_text_set_1_B:0 "Eu gostaria que você me convidasse para o seu bower"
 first_line_text_set_2_A:0 "Você é minha estrela guia neste"
 first_line_text_set_2_B:0 "Tenho quase certeza de que não sou suíço"
 fourth_line_text_set_1_A:0 "Mas estou apaixonado pela sensação de afundar"
 fourth_line_text_set_1_B:0 "Brincadeira, vamos beber mais"
 fourth_line_text_set_2_A:0 "É apenas uma única palavra"
 fourth_line_text_set_2_B:0 "Desculpe por ficar absurdo"
