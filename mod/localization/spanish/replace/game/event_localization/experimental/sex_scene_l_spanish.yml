 sex_scene.0001.a:0 "Até a próxima vez, [second.GetFirstNameNoTooltip]."
 sex_scene.0001.last_1:0 "Depois, movo minha mão em carícias suaves pelo corpo [second.GetHerHim]."
 sex_scene.0001.last_2:0 "Encharcados de suor, [second.GetSheHe] cede e desaba sobre mim."
 sex_scene.0001.last_3:0 "Quando finalmente nos separamos, posso ver as lembranças de prazer passando diante dos olhos [second.GetHerHim], uma imagem espelhada da minha."
 sex_scene.0001.last_4:0 "Com um último beijo, consumidor de tudo, termina. Este momento voltará em sonhos pelo resto da minha vida."
 sex_scene.0001.last_5:0 "[second.GetSheHe|U] parece quase tímido quando nos separamos. Um contraste encantador com a paixão que acabamos de compartilhar."
 sex_scene.0001.last_6:0 "Quando [second.GetSheHe] se afasta, [second.GetSheHe] olha para trás para mim. [second.GetSheHe|U] morde seus lábios em um sorriso afetuoso."
 sex_scene.0001.opening_1:0 "Eu abraço [second.GetSheHe] – seu corpo ansioso contra o meu, sua respiração pesada no meu ouvido."
 sex_scene.0001.opening_2:0 "Pele contra pele – nenhuma barreira existe entre nossos corpos enquanto buscamos um ao outro."
 sex_scene.0001.opening_3:0 "Os olhos [second.GetHerHim|U] estão ardendo de desejo enquanto encaram os meus, enquanto percorrem meu corpo, enquanto minhas roupas caem."
 sex_scene.0001.opening_4:0 "\"Mostre-me como você se sente\", [second.GetSheHe] sussurra, a respiração pesada, enquanto desamarro minha [ROOT.GetCharacter.Custom('GetClothingArticle')]."
 sex_scene.0001.opening_5:0 "À medida que a pele suave é libertada do tecido, uma onda de desejo súbito e forte me percorre."
 sex_scene.0001.opening_6:0 "A boca [second.GetHerHim|U], aqueles lábios macios, aquela língua inquisitiva. Os olhos [second.GetHerHim|U] sorriem para mim."
 sex_scene.0001.opening_7:0 "Vendo [second.GetSheHe] diante de mim, a necessidade é grande demais para controlar."
 sex_scene.0001.opening_8:0 "Nenhum som jamais inspirou tanto desejo em mim quanto as palavras que [second.GetSheHe] sussurra agora no meu ouvido."
 sex_scene.0001.second_1:0 "Sinto a fome pelo toque [second.GetHerHim] queimando na minha pele."
 sex_scene.0001.second_2:0 "Os gemidos [second.GetHerHim] dizendo meu nome logo se tornam mais altos à medida que nossos movimentos se tornam mais frenéticos."
 sex_scene.0001.second_3:0 "Entre beijos apaixonados, respiração pesada e corações acelerados, não há fronteira entre o prazer [second.GetHerHim] e o meu."
 sex_scene.0001.second_4:0 "[second.GetSheHe|U] envolve uma mão suave em volta do meu pescoço, puxando meus lábios para mais perto. Por um momento, resisto, mas apenas por um momento."
 sex_scene.0001.second_5:0 "Não há hesitação, nenhum atraso, nenhum tempo para gentileza. Há apenas meu desejo."
 sex_scene.0001.second_6:0 "Dedos traçando levemente pelo corpo [second.GetHerHim] fazem [second.GetSheHe] torcer e se contorcer sob meu toque, arqueando para cima em busca de mais."
 sex_scene.0001.second_7:0 "Nossos desejos doloridos se encontram, e com um empurrão suave, nos tornamos um só."
 sex_scene.0001.second_8:0 "[second.GetSheHe|U] se esfrega contra mim, seu corpo implorando por algum tipo de liberação."
 sex_scene.0001.second_9:0 "[second.GetSheHe|U] guia minha mão entre as pernas, mostrando-me como [second.GetSheHe] está [second.Custom('wet_hard')]."
 sex_scene.0001.t:0 "Um Momento Juntos"
 sex_scene.0001.third_1:0 "A intensidade nos consome ambos, o mundo girando em um eixo centrado neste momento."
 sex_scene.0001.third_2:0 "Eu sei que neste momento, [second.GetSheHe] é minha, e apenas minha..."
 sex_scene.0001.third_3:0 "Arrepios surgem na pele [second.GetHerHim] quando deixo meus dedos levemente percorrerem seu corpo. Logo, o toque se torna mais firme, e mais faminto. Agarrando."
 sex_scene.0001.third_4:0 "Eu continuo, além de qualquer ponto de exaustão ou razão; não há nada além de nós dois."
 sex_scene.0001.third_5:0 "Ninguém nunca me fez sentir assim antes. [second.GetSheHe|U] sorri para mim. [second.GetSheHe|U] sabe."
 sex_scene.0001.third_6:0 "Eu pensava que sabia como saciar esse fogo, mas [second.GetSheHe] só faz ele queimar ainda mais forte, até que seja maior do que qualquer um pode resistir."
 sex_scene.0003.conclusion_copse_1:0 "Por um tempo depois que [second.GetSheHe] foi embora, a grama em que eu estava deitado guardou o calor [second.GetHerHim]."
 sex_scene.0003.conclusion_garden_1:0 "[second.GetSheHe|U] me deixou satisfeito e tranquilo atrás de uma sebe."
 sex_scene.0003.conclusion_kitchen_2:0 "Horas depois, eu ainda podia sentir a pegajosidade do creme que [second.GetSheHe] tinha derramado sobre meu peito."
 sex_scene.0003.conclusion_kitchen_3:0 "Foi uma emoção tão intensa, por mais breve que tenha sido. Eu posso pular a sopa de amanhã, no entanto."
 sex_scene.0003.conclusion_private_chambers_1:0 "Horas depois, ainda estávamos traçando padrões com dedos acariciantes, escrevendo mensagens de amor na pele um do outro."
 sex_scene.0003.conclusion_stables_1:0 "Só espero que nossos gemidos de paixão tenham sido abafados pelos pisoteios e relinchos dos cavalos."
 sex_scene.0003.opening_copse_1:0 "Encontrei [Select_CString( second.IsFemale, 'minha', 'meu' )] [second.Custom2('RelationToMe', SCOPE.sC('second'))] em um bosquezinho não muito longe de [second.Custom('ResidenceBuilding')]. Meu coração batia forte, mesmo sabendo que ninguém nos veria lá..."
 sex_scene.0003.opening_garden_1:0 "[Select_CString( second.IsFemale, 'Minha', 'Meu' )] [second.Custom2('RelationToMe', SCOPE.sC('second'))] veio até mim enquanto eu passeava pelos jardins. O aroma da pele [second.GetHerHim] misturava-se com a doçura das flores."
 sex_scene.0003.opening_kitchen_1:0 "Um servo poderia entrar na cozinha a qualquer momento! Eu quase protestei quando [second.GetSheHe] me puxou em direção a uma bancada, puxando minha [second.Custom('GetClothingArticle')]. Mas apenas quase."
 sex_scene.0003.opening_private_chambers_1:0 "Com o coração batendo forte, destranquei a porta para deixar [second.GetSheHe] entrar em meus quartos privados."
 sex_scene.0003.opening_stables_1:0 "O escândalo que isso causaria se eu fosse pego com [Select_CString( second.IsFemale, 'minha', 'meu' )] [second.Custom2('RelationToMe', SCOPE.sC('second'))], mas não havia mais ninguém nos estábulos naquela noite."
