l_spanish:
 aging_gracefully_modifier:0 "Envelhecendo com Graça"
 aging_gracefully_modifier_desc:0 "Este personagem está começando a declinar, mas o passar do tempo parece pesar um pouco menos sobre ele do que sobre a maioria."
 harm.0000.tt.death.failure:0 "Você perece"
 harm.0000.tt.death.success:0 "Você sobrevive"
 harm.0000.tt.incapable.failure:0 "A experiência deixa você enfraquecido"
 harm.0000.tt.incapable.success:0 "Você não fica permanentemente ferido"
 harm.0000.tt.no_permanent_damage:0 "Você não sofre danos permanentes."
 harm.0000.tt.physician:0 "#EMP [ROOT.Char.Custom('GetRandomCourtMedic')|U]! [medic.GetFirstNameNoTooltip]!#!"
 harm.0000.tt.spared_for_now:0 "Você foi poupado. Por enquanto."
 harm.0001.a.tt.failure:0 "Você não está tão em forma quanto pensava"
 harm.0001.a.tt.success:0 "Seu corpo está saudável, sua mente está clara"
 harm.0001.a:0 "Eu ainda vou durar por muitos anos, tenho certeza!"
 harm.0001.b.tt.failure:0 "Nada impede o avanço do tempo"
 harm.0001.b.tt.success:0 "Você faz algumas mudanças necessárias"
 harm.0001.b:0 "Talvez eu possa viver um pouco mais saudável..."
 harm.0001.c:0 "Eu irei quando eu estiver pronto, [ROOT.Char.GetFaith.DeathDeityName], não antes."
 harm.0001.d.tt.failure:0 "Seu corpo adoece com a idade"
 harm.0001.d.tt.success:0 "O tempo é gentil com você"
 harm.0001.d:0 "Eu não sou mais jovem como antes."
 harm.0001.desc:0 "Eu acordo tossindo e engasgando, minha mente nublada, minha cabeça latejando. Quase vomitando, tento me levantar da cama, mas minha força no apoio da cama é fraca, fraca como um recém-nascido.\n\nCom um esforço enorme, eu me levanto e caminho cambaleante até a pia. Pelo [ROOT.Char.GetFaith.HealthGodName], de onde veio essa fraqueza? Eu... eu me sinto tão doente.\n\nA água fresca não me refresca muito. Com os olhos embaçados, encaro o reflexo sombrio e nebuloso no meu espelho de prata polido. [Select_CString( ROOT.Char.IsFemale, 'A', 'O' )] [ROOT.Char.GetWomanMan] que me encara parece tão, tão velh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 harm.0001.t.pre_title:0 "Enfraquecendo com a Idade"
 harm.0001.t:0 "$harm.0001.t.pre_title$: Enfraquecido"
 harm.0002.a.tt:0 "Sua mente não é tão rápida como antes..."
 harm.0002.a:0 "No que eu estava pensando mesmo?"
 harm.0002.desc:0 "Onde eu estava indo? Por que eu entrei aqui? Eu poderia jurar... certo, eu estava procurando por. Por um. Por alguma coisa.\n\nEra urgente? Eu precisava voltar para #EMP alguém#!. Rápido! Próxima semana? Sim, acho que sim.\n\nAh! Aí está, era isso que eu queria, eu precisava disso para... para..."
 harm.0002.t:0 "$harm.0001.t.pre_title$: Confuso"
 harm.0003.a.tt:0 "Seu corpo está começando a desacelerar..."
 harm.0003.a:0 "Argh, as articulações de todo mundo #EMP rangem#! assim?"
 harm.0003.desc.blind:0 "Eu passo minhas [ROOT.Char.Custom('HandHands')] sobre minha pele, sentindo a textura papelosa e o que parecem ser rugas excessivamente espessas entupindo minha casca."
 harm.0003.desc.intro:0 "Pela vontade de [ROOT.Char.GetFaith.HealthGodName], por que estou tão #EMP dolorido#!? Eu dormi bem, tão bem quanto costumo, mas quando me alongo, consigo sentir meus ossos faiscando enquanto raspam uns nos outros.\n\n"
 harm.0003.desc.outro:0 "É difícil imaginar que a juventude uma vez percorreu essa carne, quente e vital."
 harm.0003.desc.sighted:0 "Eu encaro minhas [ROOT.Char.Custom('HandHands')], observando atentamente as unhas. Amareladas pela idade, sobre uma pele que está enrugando mais do que eu gostaria."
 harm.0003.t:0 "$harm.0001.t.pre_title$: Dolorido"
 harm.0011.a.tt.failure:0 "Você não está bem"
 harm.0011.a.tt.success.bone:0 "Seu crânio resistente te salva"
 harm.0011.a.tt.success.brain:0 "Pura força de vontade te leva adiante"
 harm.0011.a.tt.success:0 "Você se recupera com o tempo"
 harm.0011.a:0 "Estou bem! E-eu estou bem..."
 harm.0011.b.tt.failure:0 "O melhor de [medic.GetFirstNamePossessive|U] não foi suficiente"
 harm.0011.b.tt.success:0 "Com a ajuda [medic.GetHerHim], você se recupera"
 harm.0011.b:0 "[medic.GetFirstNameNoTooltip]. Por favor. Minha #EMP cabeça.#!"
 harm.0011.desc.default_body:0 "Com o conflito em [battle_location.GetName] terminado, os feridos e aleijados se afastam do campo de batalha, enquanto os mais notáveis dos mortos são levados por amigos e servos.\n\nNo que me diz respeito, fui pego em um dos combates mais intensos — pouco refinamento a ser feito, apenas golpear, gritar e matar. Minha cabeça ainda está girando pelos golpes e adrenalina, pelas ondas de medo, raiva, exultação e...\n\nGirando. Minha cabeça está girando. Minha visão embaça, depois duplica, e começo a cair na [ROOT.Char.Custom('GritType')].\n\n\"Tragam um [ROOT.Char.Custom('GetRandomBattlefieldMedic')|U], [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip] foi atingid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]!\", é o grito,"
 harm.0011.desc.medic_present:0 "e a última coisa que vejo é [medic.GetTitledFirstName] abrindo caminho na multidão."
 harm.0011.desc.no_medic:0 "mas ninguém responde. Ninguém mesmo."
 harm.0011.t:0 "Quebrado pela Batalha"
 harm.0501.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0501.a.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0501.a:0 "Onde... onde estou?"
 harm.0501.b:0 "Eu posso #EMP me controlar#!."
 harm.0501.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0501.c.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0501.c:0 "Minha mente está mais afiada do que isso."
 harm.0501.desc:0 "Todo o meu ser está em chamas — é como se minha alma estivesse se inflamando e queimando por dentro. Onde eu estava indo... por que eu estou aqui? Por que isso #EMP dói tanto#!?\n\nNervo por nervo, a agonia ardente se espalha por todo o meu miserável corpo, lambendo aqui e ali em ondas antes de recuar. Estou tão quente e ao mesmo tempo tão frio, cheio de dores agudas e faíscas.\n\nEm um único momento ardente de clareza, a fonte da minha aflição se torna aparente. Meu corpo está sofrendo as falhas da minha linhagem."
 harm.0501.t.prefix:0 "Pecados da Família"
 harm.0501.t:0 "$harm.0501.t.prefix$: O Melhor da Raça"
 harm.0502.a.tt:0 "#WEAK A dor desaparece novamente...#!"
 harm.0502.a:0 "Que mal estranho é esse?"
 harm.0502.desc:0 "Apressando-me pelo pátio em uma tarefa trivial, sinto uma dor súbita e intensa na perna, e então outra no braço. Minha mão está tremendo? Por que minha cabeça está latejando? Onde...\n\nPor um breve instante, tropeço, quase caindo no chão. Então me recupero e continuo."
 harm.0502.t:0 "$harm.0501.t.prefix$: Estrelas Cadentes"
 harm.0511.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0511.a.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0511.a:0 "Espera, n-!"
 harm.0511.b:0 "Agache e role."
 harm.0511.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0511.c.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0511.c:0 "Aguente no ombro."
 harm.0511.desc:0 "Eu e minha comitiva estamos desfrutando de uma longa e tranquila cavalgada perto de [ROOT.Char.GetCurrentLocation.GetName] — nossos negócios do dia concluídos, voltamos para casa a tempo da refeição da noite.\n\nO sol está começando a se pôr, enviando raios vermelhos de luz cascata por entre nós, quando meu cavalo empina de repente. O movimento é muito forte e rápido para eu retomar o controle, me lançando para fora da sela."
 harm.0511.t.prefix:0 "Provando o Chão"
 harm.0511.t:0 "$harm.0511.t.prefix$: Um Pequeno Tombo"
 harm.0512.a.tt:0 "#WEAK Seu cavalo permanece inquieto pelo resto da cavalgada...#!"
 harm.0512.a:0 "Heh, não vou deixar #EMP que#! isso aconteça novamente."
 harm.0512.desc:0 "Cavalgar pelas terras selvagens perto de [ROOT.Char.GetCurrentLocation.GetName] é uma parte simples e prazerosa da vida como [ROOT.Char.GetTitleAsNameNoTooltip] de [ROOT.Char.GetPrimaryTitle.GetNameNoTier]. Algo que posso desfrutar, seja em solidão ou com minha comitiva, quando o dia a dia da liderança se torna demais.\n\nPerdido em meus pensamentos, quase não percebo quando minha montaria avista um pequeno réptil ameaçador e tenta se empinar. Rapidamente, tomando as rédeas com mais firmeza, a acalmo.\n\nNossa cavalgada continua."
 harm.0512.t:0 "$harm.0511.t.prefix$: Quase"
 harm.0521.a.tt.failure:0 "Você fica debaixo d'água por muito tempo"
 harm.0521.a.tt.success:0 "Suas mãos se seguram em algo"
 harm.0521.a:0 "Uma corda, uma rede, uma tábua, jogue algo para mim!"
 harm.0521.b.tt.unlocked_by_cultrad:0 "Esta opção é desbloqueada pelas [traditions|E] da sua [culture_possessive|E]"
 harm.0521.b:0 "Nade em direção à superfície!"
 harm.0521.c.tt.failure:0 "Leva muito tempo"
 harm.0521.c.tt.success:0 "Você chega à superfície a tempo"
 harm.0521.c:0 "Nade, #EMP nade#!!"
 harm.0521.desc.coastal:0 "As costas atormentadas pela tempestade de [ROOT.Char.GetCurrentLocation.GetName] às vezes são perigosas para viajar, mas ainda gosto de navegar por elas. Elas me fazem sentir—"
 harm.0521.desc.outro:0 "\n\nA embarcação se inclina para o lado, e sou lançado para dentro da água. O impacto tira o ar dos meus pulmões, a súbita mudança de temperatura fazendo meu corpo entrar em choque estupefato.\n\nAo voltar a si, tossindo e engasgando debaixo d'água, meu corpo e cérebro estão em chamas. Minha consciência já está se esvaindo novamente, meu cérebro se afogando e ficando mais opaco a cada segundo."
 harm.0521.desc.river:0 "O rio perto de [ROOT.Char.GetCurrentLocation.GetName] geralmente não está tão agitado, mas ainda estou aproveitando meu passeio. É reconfortante, ele—"
 harm.0521.desc.sea:0 "Eu sempre aprecio estar no mar. Mesmo em um dia agitado como hoje, ele tem uma beleza austera, uma sensação de fragilidade, de—"
 harm.0521.t.prefix:0 "Onda após Onda"
 harm.0521.t:0 "$harm.0521.t.prefix$: Gorgolejando e Agarrando"
 harm.0522.a.tt:0 "#WEAK Quase... hipnótica...#!"
 harm.0522.a:0 "A água é quase hipnótica..."
 harm.0522.desc.coastal:0 "É raro um ano passar sem que eu tenha motivo para usar o transporte marítimo. Dada sua proximidade com [ROOT.Char.GetCurrentLocation.GetName], seria um tolo se não o fizesse.\n\nA jornada de hoje foi rápida, minha presença necessária para resolver uma pequena disputa, me deixando aproveitar a sensação pacífica de ser conduzido para casa — observando a costa passar sem me importar com nada no mundo."
 harm.0522.desc.outro:0 "\n\nDe pé na plataforma do barco, inclinando-me sobre a borda, sinto-me muito em paz."
 harm.0522.desc.river:0 "O rio perto de [ROOT.Char.GetCurrentLocation.GetName] oferece uma maravilhosa fonte de transporte fácil, algo que ocasionalmente tive motivo para usar, como hoje.\n\nÉ revigorante, realmente. Ouvir os grunhidos e chamados dos remadores nos levando com a correnteza, observar a paisagem passar enquanto permaneço completamente imóvel."
 harm.0522.desc.sea:0 "Existe algo tão revigorante quanto o mar? O cheiro do sal, os chamados às vezes das gaivotas ao passar pela terra, o suave som da água batendo no casco."
 harm.0522.t:0 "$harm.0521.t.prefix$: Um Rosto de Calma"
 harm.0531.a.tt.failure:0 "Você sucumbe a um derrame massivo"
 harm.0531.a.tt.success:0 "O vazio se dissipa"
 harm.0531.a:0 "Minha mente está... em #EMP chamas#!..."
 harm.0531.b:0 "Eu me conheço, e isso vai passar."
 harm.0531.c.tt.failure:0 "$harm.0531.a.tt.failure$"
 harm.0531.c.tt.success:0 "$harm.0531.a.tt.success$"
 harm.0531.c:0 "[ROOT.Char.GetFaith.HealthGodName], dê-me forças."
 harm.0531.desc:0 "Sinto-me tão. Entorpecido. O que está... acontecendo...\n\nNão consigo ficar em pé. Não consigo me concentrar. Não consigo sentir. Exceto a dor lancinante e—\n\nAjuda.\n\nDe alguma forma.\n\nAlguém.\n\nPor favor.\n\n#EMP Por favor#!."
 harm.0531.t.prefix:0 "Problema Interno"
 harm.0531.t:0 "$harm.0531.t.prefix$: O Mundo Escorregando"
 harm.0532.a.tt:0 "#WEAK Provavelmente... vão...#!"
 harm.0532.a:0 "Essas dores de cabeça infernais, elas nunca vão cessar?"
 harm.0532.desc:0 "Ultimamente, sou atormentado pelas piores enxaquecas. Elas dilaceram minha mente e arranham meu corpo, enviando estilhaços pontiagudos de agonia ricocheteando através do meu crânio.\n\nCom o tempo, cada uma delas #EMP passa#!, mas nunca rápido o suficiente para o meu gosto."
 harm.0532.t:0 "$harm.0531.t.prefix$: Não Consigo Pensar"
 harm.0541.a.tt.failure:0 "O frio exerce sua maldade"
 harm.0541.a.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0541.a:0 "..."
 harm.0541.b:0 "Já enfrentei coisas piores que isso."
 harm.0541.c.tt.failure:0 "$harm.0541.a.tt.failure$"
 harm.0541.c.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0541.c:0 "Não vou ser derrubado pelo #EMP gelo#!!"
 harm.0541.desc.baby:0 "...\n\nEu me pergunto. Eu me pergunto como teria sido a vida.\n\n..."
 harm.0541.desc.fallback:0 "Aperto os cobertores com mais força. Enfio meus membros com mais firmeza. Trinco os dentes congelados contra o frio.\n\nEsse pesadelo congelante de inverno parece sugar cada vestígio de saúde do meu corpo, me deixando uma criatura triste mal capaz de tossir. Não vou sucumbir.\n\nNão vou..."
 harm.0541.t.prefix:0 "Males do Meio do Inverno"
 harm.0541.t:0 "$harm.0541.t.prefix$: Quietude & Calmaria"
 harm.0542.a.tt:0 "#WEAK Um fogo... você precisa de outro fogo...#!"
 harm.0542.a:0 "Eu gostaria tanto que estivesse mais quente..."
 harm.0542.desc.baby:0 "Meu pequeno mundo é tão estranho. O que é essa sensação? Por que não estou quente?\n\nNão era sempre assim, mas agora é. Eu não entendo. Eu tento gritar, chamar os cuidadores por ajuda, mas meus pulmões não produzem mais do que uma pequena tosse."
 harm.0542.desc.fallback:0 "Não importa o quão apertado eu puxe as cobertas da noite ao meu redor, ainda sinto um frio muito, muito intenso. Esse amargo frio do inverno se agarra a mim como carne no osso, me envolvendo em seu abraço mordaz.\n\nAperto os olhos firmemente fechados — logo o amanhecer chegará, trazendo consigo a luz e a vida do sol e da lareira."
 harm.0542.t:0 "$harm.0541.t.prefix$: Congelado até os Ossos"
 harm.0551.a.tt.failure:0 "Um Baque e um Estalo"
 harm.0551.a.tt.success:0 "Você consegue descer"
 harm.0551.a:0 "Só... tenho que ter cuidado..."
 harm.0551.b:0 "Ajuda. Ajuda! AJUDA!"
 harm.0551.c.tt.failure:0 "$harm.0551.a.tt.failure$"
 harm.0551.c.tt.success:0 "$harm.0551.a.tt.success$"
 harm.0551.c:0 "Não parece #EMP tão#! alto..."
 harm.0551.desc:0 "Por [ROOT.Char.GetFaith.FateGodName], adoro explorar [ROOT.Char.GetCurrentLocation.GetName]! Se não fosse pelo meu caminho secreto passando pelas muralhas, eu nunca teria a oportunidade de passar um tempo longe dos meus guardiões exigentes, muito menos brincar sozinho assim.\n\nComo eu teria a chance de encontrar uma árvore tão grande como esta, muito menos escalá-la? Aquelas pessoas ocupadas nunca me deixariam... nunca me deixariam...\n\nEsta é uma árvore bem alta, não é?"
 harm.0551.t.prefix:0 "Crescendo em Estatura"
 harm.0551.t:0 "$harm.0551.t.prefix$: Um Baque e um Estalo"
 harm.0552.a.tt:0 "#WEAK Certamente ninguém vai te encontrar assim...#!"
 harm.0552.a:0 "Que divertido!"
 harm.0552.desc:0 "Como [ROOT.Char.GetTitleAsNameNoTooltip], não tenho muito tempo sozinho. Supervisores e guardas estão por toda parte, me mantendo seguro tanto de danos quanto de qualquer diversão.\n\nFinalmente, porém, consegui! Levou um pouco de coragem, mas eles não conhecem a rota passando pelas muralhas que #EMP eu#! conheço.\n\nNão posso usá-la com muita frequência, mas quando o faço, todo [ROOT.Char.GetCurrentLocation.GetName] se estende diante de mim. Liberdade."
 harm.0552.t:0 "$harm.0551.t.prefix$: O Caminho Secreto"
 harm.0561.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0561.a.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0561.a:0 "Oh — espera — NÃÃÃO-"
 harm.0561.b:0 "Um pé na frente do outro, mantenha a calma."
 harm.0561.c.adventurer:0 "São apenas #EMP tendas#!."
 harm.0561.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0561.c.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0561.c:0 "São apenas #EMP escadas#!."
 harm.0561.desc:0 "Mais uma vez, olho para as escadas que descem do meu quarto e me pergunto se preciso de um acompanhante.\n\nDeveria ser simples. Sou um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] adult[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] e sei usar as escadas sem quebrar o pescoço, droga.\n\nDeveria ser tão, mas tão simples.\n\nE ainda assim..."
 harm.0561.desc_adventurer:0 "Mais uma vez, me vejo olhando para o pântano de lama e cordas de tendas, e me perguntando se preciso de um acompanhante.\n\nDeveria ser simples. Sou um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] adult[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] e sei como atravessar um acampamento sem quebrar o pescoço, caramba.\n\nDeveria ser tão, #EMP tão#! simples.\n\nE ainda assim..."
 harm.0561.t.prefix:0 "Não Mais Tão Jovem"
 harm.0561.t:0 "$harm.0561.t.prefix$: A Descida"
 harm.0562.a.tt:0 "#WEAK Quando isso se tornou um problema tão grande para você?#!"
 harm.0562.a:0 "Preocupante."
 harm.0562.desc:0 "Ao descer os degraus do meu quarto, me encontro quase agarrando a parede.\n\nIsso... isso deveria ser simples. No entanto, parece tão difícil, tão sombrio, a estreita escadaria se estendendo diante de mim como a eternidade em pessoa...\n\nNão, não. Estou sendo dramático demais. Sou [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsName] e posso sair do meu quarto sem ajuda."
 harm.0562.desc_adventurer:0 "Levantando-me da cama, saindo para o movimento do acampamento, encontro-me quase segurando o poste da tenda.\n\nIsso... isso deveria ser simples. No entanto, parece tão difícil, tão ameaçador, o emaranhado de lama, cordas de tendas e bagagens se estendendo diante de mim como se fosse a própria eternidade...\n\nNão, não. Estou sendo dramátic[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. Sou [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#!, e posso atravessar meu acampamento sem ajuda."
 harm.0562.rump:0 ""
 harm.0562.t:0 "$harm.0561.t.prefix$: Fragilidade Crescente"
 harm.0571.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0571.a.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0571.a:0 "Por [ROOT.Char.GetFaith.TricksterGodName], seu tolo, foi na minha cabeça!"
 harm.0571.b:0 "Apenas um arranhão."
 harm.0571.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0571.c.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0571.c:0 "Respire — poderia ser pior."
 harm.0571.desc:0 "Treinar [sparring_partner.GetTitledFirstName] para ser um lutador melhor é uma das minhas obrigações mais árduas, mas ainda algo que vem com o título de [ROOT.Char.GetTitleAsName].\n\nO combate de hoje tem sido especialmente frustrante, com [sparring_partner.GetFirstNamePossessiveNoTooltip] se mostrando pior do que nunca. Às vezes, me pergunto se—\n\nA dor floresce em meu crânio. Eu... [sparring_partner.GetSheHe] me acertou #EMP nas têmporas#!? Que tipo de #EMP idiota#!..."
 harm.0571.t.prefix:0 "Treinamento Necessário"
 harm.0571.t:0 "$harm.0571.t.prefix$: Um Golpe Acidental"
 harm.0572.a.tt:0 "#WEAK Você poderia ter saído muito pior...#!"
 harm.0572.a:0 "Tenha cuidado, seu imbecil!"
 harm.0572.desc:0 "Treinando no pátio da minha moradia em [ROOT.Char.GetCurrentLocation.GetName], [sparring_partner.GetTitledFirstName] e eu unimos nossas espadas de treinamento em uma dança que, no campo de batalha, provavelmente teria resultado em [sparring_partner.GetSheHe] morrendo mil vezes.\n\n[sparring_partner.GetSheHe|U] simplesmente não é o guerreiro que eu sou.\n\nAinda assim, é um treinamento necessário para alguém que supostamente me representa no campo de batalha, então eu faço o tempo p— por [ROOT.Char.GetFaith.WarGodName], aquele golpe quase acertou minha cabeça!"
 harm.0572.t:0 "$harm.0571.t.prefix$: Apenas um Acidente"
 harm.0581.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0581.a.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0581.a:0 "Espera, [ROOT.Char.GetFaith.TricksterGodName], n—"
 harm.0581.b:0 "Vá devagar, vá com cuidado."
 harm.0581.desc:0 "Desfrutar de um banho raro e solitário, longe dos serviçais e dos resmungões é um deleite encantador para mim. É tão raro ter tempo inteiramente para mim mesma, e eu aprecio cada instante disso.\n\nNo entanto, todas as coisas boas chegam ao fim, e começo a sair do banho.\n\nMas— mas minha aderência não está tão firme quanto eu pensava, meu pé escorrega e começo a deslizar rapidamente e inesperadamente."
 harm.0581.t.prefix:0 "Solidão Rara"
 harm.0581.t:0 "$harm.0581.t.prefix$: Passo Descuidado"
 harm.0582.a.tt:0 "#WEAK Não é como se você tomasse banho sem acompanhantes com frequência...#!"
 harm.0582.a:0 "Devo ter mais cuidado, suponho."
 harm.0582.desc:0 "Tomar banho sozinho é um prazer raro para mim. Como [ROOT.Char.GetTitleAsNameNoTooltip], é difícil encontrar um momento sem ser seguido pelos meus servos ou um [ROOT.Char.Custom('GetCourtier')|l] procurando falar em particular sem interrupção — até algo tão íntimo quanto me limpar está sujeito a isso.\n\nCom cuidado, aproveito a preguiça do meu corpo fora do banho, agarro a borda e dou um passo em direção a uma pilha de toalhas dobradas que me aguarda.\n\nExceto... não exatamente.\n\nMeu pé, ainda molhado, escorrega, e são apenas meus reflexos que me impedem de cair no chão."
 harm.0582.t:0 "$harm.0581.t.prefix$: Escorregadio quando Molhado"
 harm.0591.a.tt.failure:0 "Uma panela de um cidadão acerta sua cabeça"
 harm.0591.a.tt.success:0 "Você está seguro"
 harm.0591.a:0 "Jogue-se para o lado."
 harm.0591.b.tt:0 "Você reage com velocidade induzida pela paranoia"
 harm.0591.b:0 "#EMP Eu nunca estou seguro?!#!"
 harm.0591.c.tt.failure:0 "$harm.0591.a.tt.failure$"
 harm.0591.c.tt.success:0 "$harm.0591.a.tt.success$"
 harm.0591.c:0 "Já estou me movendo."
 harm.0591.desc:0 "Uma pequena tarefa na cidade me tomou mais tempo do que eu gostaria, mas, finalmente, eu e meu séquito seguimos para casa.\n\nOs moradores de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] se apressam pelas ruas de sua maior cidade, cada um seguindo suas humildes vidas sem dar muita atenção [Select_CString( ROOT.Char.IsFemale, 'a', 'ao' )] [ROOT.Char.GetTitleAsNameNoTooltip] cavalgando por suas ruas.\n\nUma repentina e ardente sensação se crava em minha consciência: #EMP perigo#!. Algo está diretamente acima de mim, descendo rapidamente."
 harm.0591.t.prefix:0 "Sem Cuidado"
 harm.0591.t:0 "$harm.0591.t.prefix$: Morte do Alto"
 harm.0592.a.tt:0 "#WEAK Isso poderia ter machucado alguém...#!"
 harm.0592.a:0 "Esses #EMP plebeus#!."
 harm.0592.desc:0 "Cavalgando pelas ruas de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], tendo resolvido uma tarefa trivial na cidade, eu e meu séquito ouvimos um estrondo alto.\n\nUma pequena investigação revela que era algum burguês jogando um pote de barro pela janela, sem se importar se poderia atingir alguém lá embaixo.\n\nCruel, sim, mas o que se pode esperar?\n\nDe qualquer forma, não é algo que mereça muito mais atenção."
 harm.0592.t:0 "$harm.0591.t.prefix$: Descarte"
 harm.0601.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0601.a.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0601.a:0 "Eu... não estou me sentindo bem..."
 harm.0601.desc:0 "Como costumamos fazer, [playmate.GetFirstName] e eu estamos brincando em uma parte desativada do meu palácio.\n\nGrandes amigos, sempre conseguimos #EMP sempre#! encontrar alguma forma de nos divertir, e é bom ter alguém que não seja um guarda ou um acompanhante por perto para variar.\n\nHoje, estamos lutando de brincadeira longe dos guardiões enfadonhos que normalmente interferem. Tem sido muito divertido! Exceto... exceto que aquele último estrangulamento me deixou um pouco tonto e... #DIE1 e...#!"
 harm.0601.t.prefix:0 "Brincadeira Bruta"
 harm.0601.t:0 "$harm.0601.t.prefix$: Consequências"
 harm.0602.a.tt:0 "#WEAK Vocês dois são apenas crianças, afinal de contas...#!"
 harm.0602.a:0 "Devemos brincar todos os dias!"
 harm.0602.desc:0 "Eu adoro brincar com [playmate.GetFirstName], [playmate.GetSheHe] sempre sabe como nos divertir!\n\nSubir em prédios, assustar animais, pregar peças nos meus cortesãos... é tudo só uma diversão, e anima a corte. Eu só quero me divertir com [playmate.GetSheHe] para sempre."
 harm.0602.t:0 "$harm.0601.t.prefix$: Onde está o Prejuízo?"
 harm.0611.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0611.a.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0611.a:0 "Espera... o quê... meu..."
 harm.0611.b:0 "Aperte os dentes contra a vertigem."
 harm.0611.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0611.c.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0611.c:0 "Concentre-se. Clareza. #EMP Concentre-se#!."
 harm.0611.desc.blind:0 "É como se eu tivesse subido diretamente às nuvens. Não ouço nada. Não sinto nada. Apenas uma sensação de distância, altura vertiginosa e o pulsar do sangue em minhas veias."
 harm.0611.desc.fallback:0 "Minha visão começa a se condensar, a visão e o som substituídos por uma escuridão iminente e a perspectiva de um fim rápido."
 harm.0611.desc.intro:0 "Depois de mais uma noite ocupada respondendo correspondências, me levanto. O jantar chama, e eu desejo t— pelo [ROOT.Char.GetFaith.HealthGodName], o que é esse surto #EMP#!? Por que estou tonto?\n\nOnde está o... Onde estou? O que está acontecendo?\n\n"
 harm.0611.t.prefix:0 "Longe Demais, Rápido Demais"
 harm.0611.t:0 "$harm.0611.t.prefix$: Alturas Tontas"
 harm.0612.a.tt:0 "#WEAK Seu corpo está realmente tão fraco?#!"
 harm.0612.a:0 "Ainda estou tonto."
 harm.0612.desc:0 "Esses são os últimos. Cem e umas cartas, ou pelo menos foi o que pareceu, dos vários nobres menores e funcionários que mantêm meu reino em funcionamento — sem mencionar uma noite inteira perdida respondendo cada uma delas.\n\nAgora, penso, uma pequena refeição antes de dormir.\n\nEmpurrando minha cadeira para trás, levanto-me rapidamente e... e... tão... tonto. Sangue pulsando em minhas veias.\n\nConcentre-se.\n\n#EMP Concentre-se#!.\n\nUgh, o que foi #EMP isso#!?"
 harm.0612.t:0 "$harm.0611.t.prefix$: Uma Vertigem"
 harm.0621.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0621.a.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0621.a:0 "*HIC*... *hic*... ..."
 harm.0621.b:0 "Hehe, acho que vou sentir isso amanhã de manhã."
 harm.0621.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0621.c.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0621.c:0 "Ooph, minha cabeça. Essa foi feia, né?"
 harm.0621.desc:0 "Outra noite, outro pint, isso é o que eu sempre digo! E sempre há #EMP sempre#! outra noite!\n\nO pequeno taverna em [ROOT.Char.GetCurrentLocation.GetName] gira ao meu redor, uma montagem embaçada de rostos e ações. Mais um! Mais um... essa... essa mesa é difícil de sair. Como eu fico em pé?\n\nComo eu... Oops, caí ah — ai, por [ROOT.Char.GetFaith.HealthGodName], minha cabeça..."
 harm.0621.t.prefix:0 "Embebedado"
 harm.0621.t:0 "$harm.0621.t.prefix$: Uma Boa Diversão"
 harm.0622.a.tt:0 "#WEAK E melhor com mais bebida!#!"
 harm.0622.a:0 "A vida é boa."
 harm.0622.desc:0 "\"Barman, mais uma rodada!\" Eu grito, com muitas comemorações e gritos.\n\nEnquanto um coro se ergue dos outros frequentadores da taverna, eu sorrio. Metade de [ROOT.Char.GetCurrentLocation.GetName] deve estar aqui agora, todos aplaudindo e torcendo [Select_CString( ROOT.Char.IsFemale, 'pela sua', 'pelo seu' )] [ROOT.Char.GetTitleAsName].\n\nAfinal, quem pode tomar uma pint como #EMP eu#!?"
 harm.0622.t:0 "$harm.0621.t.prefix$: Maus Hábitos"
 harm.0631.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0631.a.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0631.a:0 "Espere — eu não posso — meu peito!"
 harm.0631.b:0 "Não, você não vai, coração, não #EMP agora#!..."
 harm.0631.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0631.c.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0631.c:0 "Eu só preciso aguentar isso."
 harm.0631.desc:0 "[bonker.GetFirstName] me faz sentir [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetWomanMan] mais sortud[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] do mundo. Em noites como esta, quando nosso amor pode se manifestar fisicamente, o carinho [bonker.GetHerHim] é supremo.\n\nMeus dedos se curvam, meus olhos reviram e eu me entrego ao meu amante mais entusiasmado de toda a minha vida.\n\nCom o coração acelerado, mal consigo me concentrar. Sangue. Sangue... acelerado... O que é isso... isso não é..."
 harm.0631.t.prefix:0 "Êxtase"
 harm.0631.t:0 "$harm.0631.t.prefix$: Uma Noite Empolgante"
 harm.0632.a.tt:0 "#WEAK Tão, tão vivo...#!"
 harm.0632.a:0 "[bonker.GetFirstNameNoTooltip] me faz sentir tão #EMP viv[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]#!."
 harm.0632.desc:0 "Por todas as estrelas lá em cima, [bonker.GetFirstName] desperta em mim as chamas mais intensas do amor. Nenhum[Select_CString( bonker.IsFemale, 'a', '' )] [bonker.GetWomanMan] é capaz de me proporcionar uma experiência tão selvagem, uma noite tão prazerosa como [bonker.GetSheHe], e neste instante, não consigo pensar em nenhum—\n\n...\n\n— com quem eu preferiria estar."
 harm.0632.t:0 "$harm.0631.t.prefix$: Doce Música"
 harm.0641.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0641.a.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0641.a:0 "O que há de errado comigo..."
 harm.0641.b:0 "Isso vai passar."
 harm.0641.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0641.c.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0641.c:0 "Certamente isso deve ser tratável?"
 harm.0641.desc:0 "Maldição e explosão a essa hidropisia infernal, eu não posso ter nada em paz? Minha carne... #EMP incha#! com essa corrupção, fluido pálido e tecido esbranquiçado se projetando suavemente muito além do que é devido.\n\nMinha forma corpulenta e abaulada é atormentada pela agonia, e eu com ela.\n\nEu não consigo pensar direito.\n\nSó posso sofrer.\n\nSofrer, sofrer e gemer..."
 harm.0641.t.prefix:0 "Ingestão de Líquidos"
 harm.0641.t:0 "$harm.0641.t.prefix$: Algum Inchaço Leve"
 harm.0642.a.tt:0 "#WEAK Certamente vai passar...#!"
 harm.0642.a:0 "Aggh, está um pouco sensível."
 harm.0642.desc:0 "Ultimamente, minhas articulações doem tanto.\n\nTem havido uma certa... contusão? Inflamação? Pelo menos, uma acumulação de fluidos nas partes móveis dos meus membros que me causa muito sofrimento.\n\nSó tenho a esperança de que isso diminua com o tempo e o repouso."
 harm.0642.t:0 "$harm.0641.t.prefix$: Sensibilidade"
 harm.1001.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1001.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1001.a:0 "Tente tossir para expelir."
 harm.1001.b:0 "Fique calmo, respire."
 harm.1001.c.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1001.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1001.c:0 "Bata no seu peito e nos pulmões."
 harm.1001.desc:0 "O jantar de hoje é uma mistura de vários dos meus pratos favoritos - recentemente, a comida produzida tem sido inesperadamente deliciosa, e eu a devoro com entusiasmo.\n\nExceto. Exceto algo não está... minha garganta, tem algo preso na minha garganta!\n\nAr, não consigo... #EMP ar#!."
 harm.1001.t.prefix:0 "Refeição Noturna"
 harm.1001.t:0 "$harm.1001.t.prefix$: Engasgue com Isso"
 harm.1002.a.tt:0 "#WEAK É um prazer inofensivo...#!"
 harm.1002.a:0 "Eu só estou realmente apreciando a comida ultimamente."
 harm.1002.desc:0 "Com uma tosse e uma espirrada, eu limpo reflexivamente minha via aérea. O jantar da noite está adorável, mas talvez... #EMP demais#! adorável, já que eu engulo um pouco rápido demais.\n\nFique calmo, eu me digo.\n\nNão há motivo para pressa."
 harm.1002.t:0 "$harm.1001.t.prefix$: Quase Preso"
 harm.1011.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1011.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1011.a:0 "Segure-se com todas as suas forças."
 harm.1011.b:0 "Mantenha a cabeça abaixada, segure firme."
 harm.1011.c.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1011.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1011.c:0 "Essa não é a primeira vez que meu corcel se assusta."
 harm.1011.desc:0 "Enquanto meu séquito e eu retornamos de uma tarefa na área rural de [ROOT.Char.GetCurrentLocation.GetName], algo pequeno e feroz se esgueira de debaixo de uma pedra e sibila para o meu corcel.\n\nInesperadamente, o cavalo entra em pânico, partindo em um galope feroz e desordenado, disparando a uma velocidade vertiginosa.\n\nAterrorizado tanto por sua própria reação instintiva quanto por qualquer outra coisa, a besta empina e dá coices enquanto corre, quase se derrubando, quanto mais eu."
 harm.1011.t.prefix:0 "Tempestuoso"
 harm.1011.t:0 "$harm.1011.t.prefix$: Cavalgada ou Morte"
 harm.1012.a.tt:0 "#WEAK Isso poderia ter sido perigoso...#!"
 harm.1012.a:0 "Whoah, calma aí, garota..."
 harm.1012.desc:0 "Como todos que lideram, espera-se de mim que eu saiba montar um cavalo, tanto com frequência quanto com destreza. Eu mal poderia gerenciar meu [ROOT.Char.Custom('GetRealmOrDomicile')|l] se não soubesse, afinal.\n\nA tarefa de hoje é uma tarefa trivial na zona rural de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], algo que meu séquito e eu somos os mais capacitados para resolver rapidamente e com precisão.\n\nSem aviso, minha montaria empina, assustada por algum pequeno animal na trilha. Estou quase sendo jogado ao chão, conseguindo retomar o controle no último momento."
 harm.1012.t:0 "$harm.1011.t.prefix$: No Retorno"
 harm.1021.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1021.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1021.a:0 "Eu... não estou me sentindo bem..."
 harm.1021.b:0 "Traga-me água fresca - preciso me deitar. Agora."
 harm.1021.c.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1021.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1021.c:0 "Nós devemos ter algum tipo de remédio em estoque para isso!"
 harm.1021.desc:0 "O jantar, a melhor, sem mencionar a maior, refeição do dia!\n\nAhhh, que momento delicioso estar vivo: tantas texturas para apreciar, tantos sabores para absorver, tanto tempero rico para — para —\n\nHá um nó no meu estômago.\n\nUm tumor de dor em expansão, sugando meu estômago enquanto traça dedos gelados de agonia sobre o resto dos meus órgãos. Nenhum veneno maligno, apenas uma horrível confluência de alimentos ricos rasgando meu interior.\n\nO que eu comi... #DIE1 Eu#!... #DIE2 urgh#!..."
 harm.1021.t.prefix:0 "Barriga Cheia"
 harm.1021.t:0 "$harm.1021.t.prefix$: Demais"
 harm.1022.a.tt:0 "#WEAK De volta ao jantar...#!"
 harm.1022.a:0 "Fico feliz que tenha passado rapidamente."
 harm.1022.desc:0 "Por [ROOT.Char.GetFaith.HouseholdGodName], estou #EMP saciado#!. Reclinando-me na minha cadeira após o jantar, ouvindo meus [ROOT.Char.Custom('GetCourtierPlural')] tagarelando entre si, o mundo parece certo pela primeira vez.\n\nRealmente, tenho esperado cada vez mais pelo jantar ultimamente. As vistas, os sabores, os sons... apenas a sensação de sucos ricos e molhos cremosos escorrendo pelo meu queixo.\n\nPelo menos, até que meu estômago ronque com o esforço de tanta comida rica, e uma leve reviravolta ameace derramar meus intestinos.\n\nAinda assim, passa tão rápido quanto vem. Na maioria das noites."
 harm.1022.t:0 "$harm.1021.t.prefix$: Insuficiente"
 harm.1031.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1031.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1031.a:0 "Não consigo... respirar..."
 harm.1031.b:0 "Apenas preciso me controlar. Respirando. Até conseguir encontrar. Médico."
 harm.1031.c.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1031.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1031.c:0 "Calma. Pequenas respirações. Para o médico."
 harm.1031.desc:0 "Um fogo abrasador em minhas veias me desperta abruptamente, o grito ardente da carne clamando por ar, por alívio, por algo.\n\nMinha boca... minha garganta... entupida? Não cheia, mas bloqueada por algo fétido que se acumula de dentro para fora.\n\nEu expulso globos espessos e amarelados de pus doentio e adocicado, o cheiro de morte e carne podre impregnando cada fio viscoso de catarro, mas continua a vir.\n\nAjuda. Eu preciso. #EMP Ajuda#!."
 harm.1031.t.prefix:0 "Garganta Entupida"
 harm.1031.t:0 "$harm.1031.t.prefix$: Sufocação"
 harm.1032.a.tt:0 "#WEAK O alívio chegará em breve...#!"
 harm.1032.a:0 "Essas coisas costumam passar."
 harm.1032.desc:0 "Pelo [ROOT.Char.GetFaith.HealthGodName], já se passaram dois #EMP dias#! de dor desta vez.\n\nMinha mandíbula dói, minha garganta está rouca e áspera, e o interior da minha boca parece... inchado? Dói para comer. Dói para engolir. Dói até mesmo para #EMP mastigar#!.\n\nO boticário me assegura que provavelmente não é nada para se preocupar, apenas um desequilíbrio natural que se resolverá com o tempo.\n\nEu... eu espero que sim."
 harm.1032.t:0 "$harm.1031.t.prefix$: Dificuldade para Respirar"
 harm.1041.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1041.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1041.a:0 "Preciso... me mover... não consigo... respirar..."
 harm.1041.b:0 "#EMP Eu preciso sobreviver!#!"
 harm.1041.desc:0 "Com meus guardas dispensados em segurança, fora de vista, mas ao alcance da audição, estou desfrutando de um pouco de solidão em [ROOT.Char.Custom('IndefiniteBodyOfWater_Static')] por onde já passei antes.\n\nMergulhando o pé nas águas frescas, exulto na sensação de limpeza que já está lavando a poeira do dia. Este será um banho para as eras!\n\nSem pensar, meu pé escorrega e eu tropeço, caindo de cara na água. Minha cabeça bate em algo duro, me atordoando.\n\nIsso... isso é mais profundo do que eu pensava. Estou sendo puxado para baixo, para o escuro..."
 harm.1041.t.prefix:0 "Águas Serenas"
 harm.1041.t:0 "$harm.1041.t.prefix$: Um Acidente Inevitável"
 harm.1042.a.tt:0 "#WEAK Certamente vale a pena revisitar...#!"
 harm.1042.a:0 "Um local agradável, este."
 harm.1042.desc:0 "É raro eu ter algum tempo sozinho em [ROOT.Char.GetCurrentLocation.GetName], mas acontece. Relativamente sozinho, isto é, meus acompanhantes estão ao alcance da audição, mas longe o suficiente para me dar um pouco de espaço enquanto eu cavalgo por minhas terras.\n\nPor um tempo, paro ao lado de [ROOT.Char.Custom('IndefiniteBodyOfWater_Static')]. Um local isolado, acho que nunca passei por aqui antes... é tranquilo. As águas claramente correm profundas, embora pequenos redemoinhos e remansos na superfície sugiram que elas drenam para algo maior nas proximidades.\n\nTalvez eu volte aqui em breve."
 harm.1042.t:0 "$harm.1041.t.prefix$: Provavelmente Seguro"
 harm.1051.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1051.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1051.a:0 "A única saída é atravessar!"
 harm.1051.b:0 "Pela janela, é a rota mais rápida!"
 harm.1051.desc:0 "Sou despertado por um grito de fora: \"[ROOT.Char.GetTitledFirstName]!\" O grito de aviso de um servo horrorizado.\n\nEnquanto volto à consciência, sinto o doce molhando meu corpo, seguido de perto pelo calor abrasador, escaldante. A sala de estar está em chamas, minha pele já meio enrugada pelo fogo!\n\nEu tenho-COF-o sair daqui, como isso... #EMP malditas velas#!!\n\nO fogo está bloqueando a porta e está apenas piorando."
 harm.1051.t.prefix:0 "Chamas Tremulantes"
 harm.1051.t:0 "$harm.1051.t.prefix$: O Inferno"
 harm.1052.a.tt:0 "#WEAK Isso poderia ter sido muito pior...#!"
 harm.1052.a:0 "Preciso ter mais cuidado com essas velas."
 harm.1052.desc:0 "Com um sobressalto, acordo, retirando rapidamente a mão da vela acesa em que ela tinha escorregado. Pelos inúmeros tormentos de [ROOT.Char.GetFaith.random_EvilGodNames], isso arde!\n\nCom os olhos embaçados, olho ao redor da sala de estar. Devo ter adormecido sem apagar a vela — é sorte que minha mão tenha caído sobre ela.\n\nSe ela tivesse caído no sofá..."
 harm.1052.t:0 "$harm.1051.t.prefix$: À Luz de Velas"
 harm.1061.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1061.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1061.a:0 "Agarre a moldura da janela."
 harm.1061.b:0 "agarre-#EMP agarre#!-AGARRE!"
 harm.1061.c.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1061.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1061.c:0 "Recue bruscamente."
 harm.1061.desc:0 "Como tento fazer na maioria dos dias, começo minha manhã apreciando as vistas e os sons do mundo além da janela do meu quarto.\n\nComo tudo é vibrante lá fora, cheio de luz e vida, como a criação parece ser perfeita; oh, apenas um pouco mais de uma vista panorâmica, apenas um pouco mo—\n\n#EMP Merda#!, muito longe, #EMP escorregando!#!"
 harm.1061.t.prefix:0 "Que Vista"
 harm.1061.t:0 "$harm.1061.t.prefix$: Cair Rolar"
 harm.1062.a.tt:0 "#WEAK Uma maneira adorável e inofensiva de começar a manhã...#!"
 harm.1062.a:0 "Deslumbrante!"
 harm.1062.desc:0 "Meu, que dia deslumbrante lá fora!\n\nDe pé na janela do meu quarto, sinto-me tão feliz por estar vivo, observando as pessoas se movendo lá embaixo e a distante natureza selvagem lá fora. Revigorado, estou pronto para começar os negócios do dia.\n\nAinda assim... um pouco mais não faria mal. Bebendo tudo avidamente, inclino minha cabeça para fora, saboreando o ar fresco que passa pelo cômodo elevado.\n\nE já chega disso."
 harm.1062.t:0 "$harm.1061.t.prefix$: Admiração Inofensiva"
 harm.1071.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1071.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1071.a:0 "Esquive-se da faca."
 harm.1071.b:0 "Desvie facilmente da lâmina."
 harm.1071.c.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1071.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1071.c:0 "Confie em seus reflexos."
 harm.1071.desc:0 "A porta quase é arrancada de suas dobradiças enquanto passo por ela, [other.GetTitledFirstName] fugindo o mais rápido que pode, me fazendo cambalear para trás.\n\nVejo um lampejo de aço prateado atrás [other.GetHerHim], e o rosnado de [killer.GetTitledFirstName] enquanto [killer.GetSheHe] os persegue, a faca já brilhando em minha direção — a raiva diminui quando [killer.GetSheHe] percebe que eu não sou seu alvo pretendido, mas seu avanço descontrolado está rápido demais para parar.\n\nA ponta da adaga corre em direção ao meu pescoço."
 harm.1071.t.prefix:0 "Crimes Passionais"
 harm.1071.t:0 "$harm.1071.t.prefix$: Agindo"
 harm.1072.a.tt:0 "#WEAK Isso é problema deles...#!"
 harm.1072.a:0 "Apenas mais um dia emocionante na corte, não é?"
 harm.1072.desc:0 "\"E mais uma coisa, s[Select_CString( other.IsFemale, 'ua', 'eu' )] [other.Custom2('InsultNoun', SCOPE.sC('killer'))] [other.Custom2('InsultAdjective', SCOPE.sC('killer'))]\", grita [killer.GetTitledFirstName], atacando [other.GetTitledFirstName] em mais uma discussão que facilmente é a terceira briga do dia deles.\n\nEu ignoro suas discussões apesar do volume, continuando meu caminho. Os dois estão sempre discutindo, e apesar de barulhentos, eles são inofensivos no final das contas.\n\nTenho coisas maiores com que me preocupar do que uma pequena briga entre cortesãos."
 harm.1072.t:0 "$harm.1071.t.prefix$: Uma Pequena Desavença"
 harm.1081.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1081.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1081.a:0 "Se cavalgarmos rápido o suficiente, podemos chegar em casa."
 harm.1081.b:0 "Aquele abrigo, podemos nos abrigar lá!"
 harm.1081.c.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1081.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1081.c:0 "Eu — Eu acho que posso ter um esconderijo nas proximidades?"
 harm.1081.desc:0 "Maldito seja o espírito volúvel de [ROOT.Char.GetFaith.WaterGodName], [ROOT.Char.GetFaith.WaterGodSheHe] condenou meu séquito e a mim a morrer nesta terrível tempestade!\n\nO que deveria ser uma pequena tarefa em uma vila próxima se transformou de um dia claro e ensolarado em uma penúria sombria, uma jornada através de vendavais lançados pelo vento, espancados pela chuva que cai como pedras e ameaçados por relâmpagos e trovões.\n\nSe não encontrarmos abrigo em breve, o frio e a umidade levarão nossas vidas tão certamente quanto qualquer lâmina."
 harm.1081.t.prefix:0 "Clima Instável"
 harm.1081.t:0 "$harm.1081.t.prefix$: Ira da Tempestade"
 harm.1082.a.tt:0 "#WEAK Não é um bom momento para estar do lado de fora...#!"
 harm.1082.a:0 "Espero que [ROOT.Char.GetFaith.FateGodName] não esteja sinalizando algo."
 harm.1082.desc:0 "Da janela do meu quarto, observo as tempestades inusitadamente intensas roncando pela paisagem, um estrondo distante de um conjunto de nuvens a poucas milhas de distância.\n\nUm dilúvio problemático — será que as chuvas indicam algum problema divino que deixei de ordenar, ou são apenas movimentos aleatórios do vento?\n\nDe qualquer forma, não desejo ser pego nelas."
 harm.1082.t:0 "$harm.1081.t.prefix$: Trovão Distante"
 harm.1091.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1091.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1091.a:0 "#EMP Minha mente?!#!"
 harm.1091.b:0 "Eu. Vou. Resistir."
 harm.1091.c.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1091.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1091.c:0 "Clareza, clareza, eu preciso de #EMP clareza#!."
 harm.1091.desc:0 "#EMP Doce misericórdia de [ROOT.Char.GetFaith.HighGodName], por favor, poupe-me desta aflição#!!\n\nO que é essa agonia pulsante que martela meu crânio em fitas ensanguentadas, esse pulsar ardente que ecoa em minhas veias ao ritmo do tambor de [ROOT.Char.GetFaith.DevilNamePossessive]...\n\nEu — Eu estava bem, e então eu... engasgando-me para conter o vômito, sem aviso, e então eu... #EMP aggggh#!, faça isso parar, faça isso parar, #BER FAÇA ISSO PARAR#!!\n\nP-por favor. #DIE1 Faça parar#! #DIE2 isso#!."
 harm.1091.t.prefix:0 "Coração Acelerado"
 harm.1091.t:0 "$harm.1091.t.prefix$: Pensamentos Ardentes"
 harm.1092.a.tt:0 "#WEAK Talvez você devesse descansar um pouco...#!"
 harm.1092.a:0 "Ai, minha cabeça..."
 harm.1092.desc.blind:0 "Não consigo pensar, não consigo me concentrar, mal consigo ouvir — os sons parecem desaparecer completamente, a menos que sejam muito agudos ou muito graves.\n\n[ROOT.Char.GetFaith.HealthGodName|U] deve realmente achar uma grande crueldade me amaldiçoar com dores de cabeça que filtram tudo, exceto os gritos de bebês e o relinchar de cavalos."
 harm.1092.desc.fallback:0 "Quando elas surgem, minha visão parece diminuir, toda a luz e a vista se esvaindo até que resta apenas um pequeno canto do mundo para mim, para sempre no limite do foco e acompanhado de uma fonte inesgotável de dor.\n\n[ROOT.Char.GetFaith.HealthGodName|U] claramente acha meu sofrimento divertido, pois os ataques são assustadoramente regulares."
 harm.1092.desc.intro:0 "Nas últimas duas semanas, tenho sido afligido por enxaquecas tão... #EMP intensas#!.\n\n"
 harm.1092.t:0 "$harm.1091.t.prefix$: Mente Dolorida"
 harm.1101.a.tt.failure:0 "O mundo se torna um borrão de madeira estilhaçada e membros quebrados."
 harm.1101.a.tt.success:0 "Um estrondo poderoso e um relincho angustiante atrás de você."
 harm.1101.a:0 "Tente pular para fora do caminho."
 harm.1101.b:0 "Leve seu cavalo ainda mais perto da parede."
 harm.1101.c.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1101.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1101.c:0 "Jogue-se para frente e espere."
 harm.1101.desc:0 "Mais uma vez, eu cavalgo pelas ruas de [ROOT.Char.GetCurrentLocation.GetName], meu séquito orgulhosamente carregando minha bandeira atrás de mim. Uma pequena tarefa na cidade requer minha atenção, então fizemos um dia disso, mas anseio pelas comodidades do lar.\n\nConforme chegamos a uma travessia, sou distraído pelas risadas de um grupo de jovens impressionados e não consigo ouvir o som de uma carroça acelerada e barulhenta se aproximando de mim até que o cocheiro grite alarmado."
 harm.1101.t.prefix:0 "Um Povoado Movimentado"
 harm.1101.t:0 "$harm.1101.t.prefix$: Cuidado!"
 harm.1102.a.tt:0 "#WEAK Mesmo que seja apenas enquanto passa pelas suas moradias...#!"
 harm.1102.a:0 "Os plebeus precisam ver s[Select_CString( ROOT.Char.IsFemale, 'ua', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip]."
 harm.1102.desc:0 "Cavalgando com meu séquito pelas ruas de [ROOT.Char.GetCurrentLocation.GetName], mantenho uma postura austera. Às vezes, é importante ser visto, mas é igualmente importante permanecer como uma figura de certa autoridade.\n\nParamos quando uma carroça passa chacoalhando rapidamente por nós em uma intersecção movimentada, totalmente rápida demais para ser segura.\n\nSorte para o cocheiro também — não é sábio cortar o caminho d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip], mas o cavalo deles os carrega rápido demais para ver, quanto mais parar."
 harm.1102.t:0 "$harm.1101.t.prefix$: Segurança nas Ruas"
 harm.1111.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1111.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1111.a:0 "Gah, estou perdido!"
 harm.1111.b:0 "Vai precisar de mais do que isso para me matar #EMP!."
 harm.1111.c.tt.dread:0 "Esta opção é desbloqueada por seu alto [dread|E]"
 harm.1111.c.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1111.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1111.c:0 "#EMP Outro#! assassino? Patético!"
 harm.1111.desc:0 "Ao atravessar minha [ROOT.Char.Custom('GetCourt')], estou sempre flanqueado por guardas para minha proteção. Ainda mais protegem a entrada, sem contar meu [ROOT.Char.Custom('GetChamber')]. O suficiente para parar qualquer intruso, mas aparentemente não o suficiente para impedir que um maldito servo colidisse comigo e —\n\nDor. Uma dor aguda, um golpe literal de dor. O sangue já jorra do meu ventre enquanto eu recuo, a faca do servo protrusa de mim.\n\nMeus guarda-costas estão sobre [killer.GetSheHe] em segundos, derrubando o assassino no chão. Sorrindo com um ar de satisfação enquanto [killer.GetSheHe] morre — não há dúvida de que isso foi inteiramente, puramente pessoal.\n\nTodos querem morrer como heróis."
 harm.1111.t.prefix:0 "Reino do Terror"
 harm.1111.t:0 "$harm.1111.t.prefix$: Justiça Popular"
 harm.1112.a.tt:0 "#WEAK Você simplesmente não consegue bons ajudantes nos dias de hoje...#!"
 harm.1112.a:0 "Poderia ter sido pior, suponho."
 harm.1112.desc:0 "Ao virar a esquina, meus guardas me seguem fielmente, quando um servo quase esbarra em mim carregando uma tigela.\n\nNo último momento, eles se desviam, evitando por pouco derramar sopa escaldante em meu rosto.\n\n\"Olhe por onde anda!\" rosna um dos meus acompanhantes.\n\nO servo acena profusamente, com medo demais para falar, antes de sair correndo na direção oposta. A abordagem adequada após um erro tão grave."
 harm.1112.t:0 "$harm.1111.t.prefix$: Obediência Assustada"
 harm.2001.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2001.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2001.a:0 "Minhas — minhas entranhas... bleargh..."
 harm.2001.b:0 "Não vou terminar aqui."
 harm.2001.c.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2001.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2001.c:0 "Eu sei o que preciso. Traga-me... traga-me..."
 harm.2001.desc:0 "Maldição a todos em [ROOT.Char.GetCurrentLocation.GetName]! Que ironia infernal é essa, que, embora os cercos sejam sobre desgastar os defensores, os #EMP acampamentos de cerco#! são atoleiros de sujeira e doença?\n\nQuando acordei esta manhã, foi com o estômago revirando e fogo líquido percorrendo meu ventre. Não consigo parar de soltar por todos os orifícios, nem mesmo consigo mais ficar em pé.\n\nEu nunca quis morrer assim."
 harm.2001.t:0 "Febre no Acampamento"
 harm.2011.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2011.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2011.a:0 "Por que... o que é..."
 harm.2011.b:0 "Meus soldados sofrem apenas o que eu posso suportar."
 harm.2011.c.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2011.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2011.c:0 "Eu já suportei coisas piores, com certeza?"
 harm.2011.desc:0 "A dor tem me atormentado por quase uma semana — suores frios e uma febre debilitante, intestinos agitados e mãos trêmulas. Não sei o que peguei, mas está claro que é algum mal inesperado causado pelas condições na marcha e em nossos acampamentos noturnos.\n\nMesmo agora, minha visão começa a se turvar, mas devo continuar.\n\nDevo. Seguir em frente. Temos que... continuar..."
 harm.2011.t:0 "Mal-estar em Marcha"
 harm.2021.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2021.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2021.a:0 "..."
 harm.2021.b:0 "Eu. Tenho. Um destino. Maior."
 harm.2021.c.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2021.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2021.c:0 "Eu. Não vou. Terminar."
 harm.2021.desc:0 "Não é correto estar em campanha em um frio tão intenso. Não é correto. A cada noite no acampamento, cavamos covas frescas para as perdas que descobriremos pela manhã, para aqueles que devem ser deixados para trás, mas não deveriam estar à mercê de bandos de corvos insensíveis.\n\nQuase invejo-os. Para eles, a luta acabou. Eles não precisam enfrentar essa #EMP geada#! sem sentido.\n\nO frio do inverno me corta até os ossos, interrompendo constantemente meus pensamentos com rajadas de dor entorpecente, negando-me descanso, negando-me foco.\n\nTalvez... talvez seria melhor se..."
 harm.2021.t:0 "Tão... Frio..."
 harm.2031.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2031.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2031.a:0 "A tirania da luz e da sede nos desfaz..."
 harm.2031.b:0 "Eu. Tenho. Um destino. Maior."
 harm.2031.c.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2031.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2031.c:0 "Eu não sou o tolo de [ROOT.Char.GetFaith.DeathDeityName]."
 harm.2031.desc:0 "O sol sempre foi tão brilhante? Tão quente? Tão opressor?\n\nEu nem sei há quanto tempo estamos nesta terra abandonada por [ROOT.Char.GetFaith.HealthGodName], privados de acesso fácil à água boa e forçados a continuar a jornada.\n\nA campanha exige que continuemos, mas a cada dia nossa força diminui um pouco mais. Um pouco mais, suado e salpicado no chão sempre sedento. Um pouco mais de nós perdido para sempre para o calor insensível.\n\nTodos os dias, sem exceção."
 harm.2031.t:0 "Tão... Quente..."
 harm.2041.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2041.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2041.a:0 "Traidores! TRAIDORES!"
 harm.2041.b:0 "Apenas seis? Venham, covardes!"
 harm.2041.c.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2041.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2041.c:0 "#BER EU VOU FAZER VOCÊS SANGRAREM POR ISSO!#!"
 harm.2041.desc:0 "Mesmo eu perdi praticamente a conta de quantos anos estamos em guerra. A trilha da campanha é difícil para todos nós, tirando um pouco mais a cada dia e oferecendo apenas um breve descanso a cada acampamento ao anoitecer.\n\nVoltando para minha tenda após uma discussão com o intendente, encontro o lugar estranhamente deserto. Nenhum guarda cansado, nenhum mercenário amargurado, nenhuma milícia com saudade de casa. Desertado, isso é, até que meia dúzia de soldados armados e vestidos com armaduras deslizam das sombras de todos os lados.\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip]\", cospe o líder rebelde, \"suas guerras insensatas custaram caro demais a todos nós. Desta vez, #EMP vocês#! pagarão o preço.\""
 harm.2041.t:0 "Pelo Reino"
 harm.2051.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2051.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2051.a:0 "Minha pele... como papel..."
 harm.2051.b:0 "A situação ainda é recuperável."
 harm.2051.c.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2051.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2051.c:0 "Temos reservas, nós #EMP precisamos#! ter reservas!"
 harm.2051.desc:0 "Poucas coisas destroem um exército tão completamente quanto a fome — nenhum escudo pode evitá-la, nenhuma lâmina pode afastá-la, nenhuma armadura pode abafar suas dores.\n\nSem comida, sem água, sem nada para nos sustentar além dos animais de carga que impulsionam nosso progresso, minhas tropas estão aos poucos parando.\n\nAté... até eu... estou definhando sem sustento..."
 harm.2051.t:0 "Fome"
 harm.2061.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2061.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2061.a:0 "Afaste-se de mim, seus bastardos!"
 harm.2061.b:0 "FUJA!"
 harm.2061.c.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2061.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2061.c:0 "Toquem a trompa, [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip] precisa de ajuda!"
 harm.2061.desc:0 "Com meu exército fugindo do campo de batalha de [ROOT.Char.GetCurrentLocation.GetName], grupos de tropas estão em escaramuças, correndo ou perseguindo em todas as direções. Minha comitiva está dispersa, meus guardas mortos ou fugidos, e eu me disperso com eles.\n\nSe pudermos apenas nos reagrupar, se pudermos apenas...\n\nContorno uma grande rocha, apenas para me deparar com um grupo de soldados vestindo o uniforme inimigo.\n\nDentes à mostra, eles avançam gritando."
 harm.2061.t:0 "Perseguido a Cada Passo"
 harm.2071.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2071.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2071.a:0 "Você ainda não vai me levar, [ROOT.Char.GetFaith.DeathDeityName]!"
 harm.2071.b:0 "FUJA!"
 harm.2071.c.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2071.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2071.c:0 "Reúnam-se! Reúnam-se [Select_CString( ROOT.Char.IsFemale, 'a', 'ao' )] [ROOT.Char.GetTitleAsNameNoTooltip]!"
 harm.2071.desc:0 "Meu exército vitorioso varre o campo em [ROOT.Char.GetCurrentLocation.GetName]. Em toda parte, os gritos triunfantes de minha tropa podem ser ouvidos enquanto corremos atrás do inimigo.\n\nAté eu e minha comitiva nos entregamos à carnificina frutífera, exultando em nossa vitória. Isso nos dispersa um pouco, sim, mas o inimigo está derrotado e não pode—\n\nOnde estão meus guardas? Os soldados ao meu redor... eles empunham o estandarte do [actor.GetPrimaryTitle.GetNameNoTier]! Ódio nos olhos e sangue nos dentes, os inimigos derrotados se atiram contra mim, prontos para meu fim."
 harm.2071.t:0 "Uma Vitória Desastrosa"
 strong_willed_modifier:0 "Determinação Forte"
 strong_willed_modifier_desc:0 "Este personagem está acostumado a superar até mesmo a dor mais intensa."
 thick_skulled_modifier:0 "Cabeça Dura"
 thick_skulled_modifier_desc:0 "Aparentemente, a cabeça deste personagem pode resistir a muitos golpes."
