l_spanish:
 south_asia.0001.a:0 "O mundo pronuncia meu nome."
 south_asia.0001.desc:0 "Multidões entoam meu nome enquanto sou purificado nas águas das fontes celestiais. Eu me levanto como o Chakravarti, governante legítimo e benevolente de todo o mundo.\n\nMeus [ROOT.Char.GetFaith.AltPriestTermPlural] me dizem que é hora de o mundo ser guiado pela minha luz, mas eu não preciso de suas garantias. Ao contemplar as planícies, posso sentir isso em minha alma."
 south_asia.0001.t:0 "Uma Nova Era"
 south_asia.0002.a:0 "É uma honra ter testemunhado este momento."
 south_asia.0002.b:0 "Permita-me me prostrar aos seus pés em exaltação!"
 south_asia.0002.intro:0 "Multidões têm caminhado por dias, ou até semanas, para participar da cerimônia. A vida inteira de [chakravarti.GetTitledFirstNamePossessive] levou a este momento único."
 south_asia.0002.t:0 "O Chakravarti"
 south_asia.0002.text:0 "\n\nAssisto em silêncio atônito enquanto m[Select_CString( chakravarti.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chakravarti'))] emerge das fontes sagradas. Seus [chakravarti.GetFaith.AltPriestTermPlural] anunciam [chakravarti.GetSheHe] como o Chakravarti, [Select_CString( chakravarti.IsFemale, 'nossa', 'nosso' )] benevolente [chakravarti.GetLadyLord].\n\nNinguém pode mais contestar que [chakravarti.GetSheHe] é o governante legítimo de todo o mundo."
 south_asia.0003.a:0 "Permita-me unir-me a você em sua vitória, meu senhor feudal!"
 south_asia.0003.b:0 "O que está por vir para o governante do mundo?"
 south_asia.0003.text:0 "\n\nÉ somente quando m[Select_CString( chakravarti.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chakravarti'))] emerge das fontes sagradas que a plena força do momento me atinge. Seus [chakravarti.GetFaith.AltPriestTermPlural] anunciam [chakravarti.GetSheHe] como o Chakravarti, o governante legítimo de todo o mundo.\n\nEnquanto [chakravarti.GetTitledFirstName] contempla as planícies abaixo, não consigo deixar de sentir que é verdade."
 south_asia.0004.a:0 "[chakravarti.GetSheHe] será uma nova ameaça ou um grande aliado?"
 south_asia.0004.b:0 "Os [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] podem ficar com suas reivindicações ridículas!"
 south_asia.0004.desc:0 "Heraldos chegaram em grande número da terra da Índia, anunciando o surgimento de seu 'Chakravarti', entusiasmados com a benevolência [chakravarti.GetHerHim]."
 south_asia.0004.relevant_religion:0 "Heralds têm chegado em grande número para trazer notícias do Império da Índia. Pela primeira vez em eras, um Chakravarti surgiu."
 south_asia.0004.text:0 "\n\nCom grandes rituais e multidões de fiéis aos pés [chakravarti.GetHerHim], [chakravarti.GetTitledFirstName] assumiu o manto [Select_CString( chakravarti.IsFemale, 'da governante legítima', 'do governante legítimo' )] de todo o mundo."
 south_asia.0011.a:0 "Ninguém pode duvidar de minha dedicação a [ROOT.Char.GetFaith.HighGodName]."
 south_asia.0011.desc:0 "Durante um dia inteiro, do amanhecer ao pôr do sol, eu fico com a água fluindo pelo rio até a altura da minha cintura. Segurando-a em minhas mãos, eu levanto a água em direção ao céu antes de deixá-la cair. Repito isso várias vezes.\n\nEstou tremendo quando volto à terra seca, onde sou recebido pelos [ROOT.Char.GetFaith.PriestNeuterPlural] subordinados. Eu jurei minha proteção não apenas à água que fluiu por minhas mãos hoje, mas ao rio inteiro e, por meio dele, à eternidade da existência."
 south_asia.0011.t:0 "As Águas Sagradas"
 south_asia.0012.a.dislike:0 "Como se alguém respeitasse uma oportunista como [ruler_of_ganges.GetSheHe]!"
 south_asia.0012.a.like:0 "Parece que a eternidade tem um novo protetor."
 south_asia.0012.desc:0 "Com controle sobre todo o curso do Ganges, [ruler_of_ganges.GetTitledFirstName] reivindicou a tutela espiritual de suas águas sagradas. É uma autoridade sem precedentes para alguém reivindicar, mas os [ruler_of_ganges.GetFaith.PriestNeuterPlural] a declararam verdadeira."
 south_asia.0013.a:0 "Essa intrusa não passa de uma fraude!"
 south_asia.0013.desc:0 "Com a perda do meu território, minha autoridade sobre o Ganges não é mais respeitada pelo povo e pelos [ROOT.Char.GetFaith.PriestNeuterPlural] do meu reino! Em vez disso, [ruler_of_ganges.GetTitledFirstName] reivindicou a posição que eu antes comandava como Administrador do Rio Sagrado."
 south_asia.0013.t:0 "Meu Propósito Divino Usurpado"
 south_asia.0021.a:0 "Um novo lar para nós!"
 south_asia.0021.b:0 "Há apenas um Israel!"
 south_asia.0021.c:0 "Que coroação improvável."
 south_asia.0021.desc:0 "Forçado a viver uma vida nômade e em pequenos enclaves ao redor do mundo, o povo judeu tem sido privado de um lar para chamar de seu. Os séculos de peregrinação, aparentemente, estão finalmente chegando ao fim.\n\n[founder.GetNameNoTooltip] foi coroad[Select_CString( founder.IsFemale, 'a', 'o' )] [founder.GetTitleAsNameNoTooltip] de $k_bene_israel$. Embora improvável, parece que o povo judeu encontrou sua casa ao longo da costa oeste da Índia, com o [founder.GetFaith.ReligiousHeadTitleName] restaurado e a declaração de uma nova Israel. [founder.GetTitledFirstNameNoTooltip] acredita estar inaugurando uma nova era de ouro para os seguidores do judaísmo em todo o mundo."
 south_asia.0021.t:0 "[Select_CString( founder.IsFemale, 'A', 'O' )] [founder.GetTitleAsNameNoTooltip] de $k_bene_israel$"
 south_asia.0030.a.ari.tt:0 "Todos os vassalos Ari"
 south_asia.0030.a.tt:0 "Todos os condados na região de Burma"
 south_asia.0030.a:0 "Esses camponeses simplórios precisam ser subjugados!"
 south_asia.0030.b.theravada.tt:0 "Todos os vassalos Theravada"
 south_asia.0030.b:0 "Eles são livres para adorar seus deuses antigos, dentro dos limites razoáveis."
 south_asia.0030.c:0 "Vou lidar com isso depois."
 south_asia.0030.desc:0 "Embora sejamos um dos últimos bastiões dos ensinamentos Theravada, nossos nobres continuam a abraçar a fé entusiasticamente. No entanto, o povo comum mantém um orgulho feroz em suas tradições e a adoração aos seus deuses malévolos Nat continua generalizada.\n\nUm governante prudente pode achar sábio fazer concessões ao lidar com essas questões, mas talvez uma abordagem mais rigorosa seja necessária..."
 south_asia.0030.t:0 "Espalhando a Fé Theravada"
 south_asia.0031.a.tt:0 "Todos os condados"
 south_asia.0031.a:0 "Esmague a ralé e identifique qualquer um que ouse protegê-los."
 south_asia.0031.b.theravada:0 "Todos os vassalos Theravada"
 south_asia.0031.b:0 "Não podemos arcar com a destruição do reino."
 south_asia.0031.c.all.tt:0 "Todos os outros vassalos"
 south_asia.0031.c:0 "Envie uma mensagem. Execute publicamente os líderes do motim."
 south_asia.0031.d:0 "Eu fiz o máximo que pude."
 south_asia.0031.desc:0 "Uma coisa é ser um intruso cultural; é outra coisa afirmar hegemonia religiosa. O povo comum está irritado, e não faltam murmúrios de desprezo ao mencionarem seu nome entre os tipos mais tradicionais na corte, incluindo [ari_vassal.GetTitledFirstName].\n\nMinha mão pode se estender como pacificadora, ou cerrar-se como o punho de um governante implacável. Ou, ainda, posso recuá-la completamente e permitir que a chama se extinga com o tempo. Devo escolher sabiamente..."
 south_asia.0031.t:0 "Situação Religiosa se Agrava"
 south_asia.0032.a.lankan:0 "Refugiados religiosos de Lanka chegaram à sua corte"
 south_asia.0032.a.ruler.tt:0 "Todos os governantes Sinhala Theravada"
 south_asia.0032.a.tt:0 "[guests|E] lankanos chegam"
 south_asia.0032.a:0 "Convide refugiados religiosos de Lanka para sua corte."
 south_asia.0032.b:0 "Nós seremos os únicos guardiões do [ROOT.Char.GetFaith.GetNameNoTooltip]."
 south_asia.0032.desc:0 "As divindades folclóricas tradicionais de Burma ainda permanecem enraizadas, especialmente nas áreas rurais. Remover o direito das pessoas de adorar como desejam faria mais mal do que bem. Portanto, a introdução de uma trigésima sétima divindade — Thagyamin, o Deus protetor budista — no panteão, como a primeira e principal delas, foi recebida de forma totalmente amigável.\n\nUma oportunidade de ouro se apresenta diante de você. As terras tradicionais do Budismo [ROOT.Char.GetFaith.GetAdjective] ficam em Lanka, mas estão constantemente ameaçadas por poderes no continente. Alternativamente, talvez seja hora de decidirmos o caminho de nossa fé recém-fortalecida."
 south_asia.0032.t:0 "Tensões Religiosas se Aliviam"
 south_asia.0033.a:0 "Todos na minha corte devem admitir sua adesão à verdadeira fé!"
 south_asia.0033.b:0 "Sangue suficiente foi derramado; deixe-os ir."
 south_asia.0033.c:0 "Você teve sua chance. GUARDAS!"
 south_asia.0033.desc:0 "Os insurgentes religiosos se foram. Aqueles corajosos e tolos o suficiente para resistir foram eliminados, mas a maioria manteve a boca fechada e a cabeça baixa por medo de perseguição. Os líderes religiosos [ari_vassal.GetFaith.GetAdjective] fugiram para o campo, onde puderam continuar a praticar seus rituais animistas. \n\nA questão agora se volta para aqueles que antes eram tão audaciosos em seu apoio, e agora encontram suas línguas tão silenciosas."
 south_asia.0033.t:0 "Imposição da Vontade Religiosa"
 south_asia.0034.a:0 "Siddhārtha Gautama aprovaria minha compaixão."
 south_asia.0034.aricounties:0 "Todos os condados Ari"
 south_asia.0034.b:0 "E nós os converteremos."
 south_asia.0034.counties:0 "Todos os condados"
 south_asia.0034.desc:0 "Levar o país à beira de uma guerra civil para defender a fé mostra zelo, mas saber quando manter minha mão mostra compaixão. O povo continua resmungando, mas que assim seja.\n\nA divisão religiosa no Vale Irrawaddy continua, mas pelo menos meu domínio sobre ele permanece intacto, e a possibilidade de conversão adicional por meios convencionais permanece possível."
 south_asia.0034.t:0 "Conflito Religioso Evitado"
 south_asia.0034.vassals:0 "Todos os vassalos"
 south_asia.0035.a.lanka:0 "Todos os condados em Lanka"
 south_asia.0035.a:0 "Enviaremos fiéis seguidores [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip], para ajudar a preservar a fé."
 south_asia.0035.b.theravada.tt:0 "Qualquer governante independente Theravada"
 south_asia.0035.b:0 "Envie enviados e ofereça um vínculo de amizade."
 south_asia.0035.desc:0 "Qualquer verdadeiro seguidor dos conceitos de Buda pode apreciar a importância sagrada de preservar suas palavras. O Cânone Pali, apesar de ter sido escrito centenas de anos após a morte de Siddhārtha Gautama, representa a coleção mais precisa das palavras de Buda no mundo conhecido.\n\nCom as maquinações políticas no continente indiano, há uma crescente ameaça à segurança desses textos sagrados nas terras natais [ROOT.Char.GetFaith.GetAdjective] na península de Lanka. Eu devo agir!"
 south_asia.0035.t:0 "Preservando as Terras do Theravada"
 south_asia.0036.a:0 "O povo precisa saber de seus pecados. Dividir e conquistar."
 south_asia.0036.b.tt:0 "Todos os outros condados em Burma"
 south_asia.0036.b:0 "Eles podem se converter ou podem fugir para as florestas e montanhas."
 south_asia.0036.desc:0 "Com o futuro da fé fora do Vale Irrawaddy agora garantido, a única pergunta que resta é o que fazer com os monges restantes da fé [ari_faith.GetName] que ainda possuem tanto poder, mas ostentam seu hedonismo a cada oportunidade. Sua influência pode ser minada, mas não pode ser subestimada.\n\nEsses líderes religiosos que bebem vinho e sacrificam animais devem ser tratados, mas de maneira delicada, para que sua perseguição não seja vista como uma ameaça à paz ainda vulnerável na região."
 south_asia.0036.t:0 "Lidando com os Ari"
 south_asia.0037.a:0 "Vamos fortalecer ainda mais a fé!"
 south_asia.0037.b.tt:0 "Todos os vassalos"
 south_asia.0037.b:0 "Eu apenas sigo a vontade de Buda."
 south_asia.0037.desc:0 "À medida que os últimos vestígios do poder dos monges desaparecem, é como se uma pedra de moinho tivesse sido retirada dos meus ombros. As relações religiosas no reino estão harmoniosas, a fé está florescendo, e o povo olha para mim como seu líder tanto politicamente quanto espiritualmente.\n\nMinha grande jornada chegou ao fim, e meu reino pode orgulhosamente se chamar de um verdadeiro bastião de uma fé do [ROOT.Char.GetFaith.GetName] forte e saudável."
 south_asia.0037.t:0 "A Fé Garantida"
 south_asia.0038.a:0 "A fé Theravada prosperará!"
 south_asia.0038.b:0 "Isso é um ultraje!"
 south_asia.0038.c:0 "Isso não passa de bobagem de sempre."
 south_asia.0038.desc:0 "Há muitos anos, os fiéis em todo o Vale Irrawaddy têm lutado com uma verdadeira divisão religiosa. Os nobres da cidade e seus semelhantes são adeptos do [proselytiser.GetFaith.GetName], enquanto o povo comum e aqueles que vivem nas vastas florestas do vale continuam a adorar as diversas divindades e espíritos da fé Ari.\n\nMeu senhor feudal [proselytiser.GetFullName] assumiu a responsabilidade de curar essa divisão e estabelecer a fé Theravada como dominante em suas terras e, por extensão, também nas minhas. Até mesmo agora, os monges [proselytiser.GetHerHim] estão percorrendo minhas terras, remodelando o cenário religioso conforme sua preferência."
 south_asia.0038.t:0 "A Grande Divisão"
 south_asia.0038.tt:0 "Vários dos seus [counties|E] podem adotar a fé Theravada."
 south_asia.0039.a:0 "Não passa de merecido."
 south_asia.0039.b:0 "Um dia, os fiéis caídos serão vingados."
 south_asia.0039.c:0 "Apenas mais brigas mesquinhas entre [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')]."
 south_asia.0039.desc:0 "O trabalho evangelizador de [proselytiser.GetFullName] parece ter sido mal-sucedido. A abordagem autoritária [proselytiser.GetHerHim] na disseminação da fé Theravada resultou em protestos e tumultos, que subsequentemente foram brutalmente reprimidos.\n\nQualquer senhor ou senhora que ousou proteger um seguidor da fé Ari em dificuldades desapareceu ou agora insiste que foi mal interpretado, e ninguém se atreve a desafiar a paciência de seu zeloso senhor feudal.\n\nSe haverá mais ramificações para aqueles que eram conhecidos por estarem do lado dos oprimidos, ainda está por ser visto..."
 south_asia.0039.t:0 "Um Zelote Brutal"
 south_asia.0040.a:0 "Maravilhoso! A verdadeira fé florescerá!"
 south_asia.0040.b:0 "Essas ações não serão esquecidas."
 south_asia.0040.c:0 "Isso realmente não é da minha preocupação."
 south_asia.0040.desc:0 "[proselytiser.GetFullName], meu senhor e o governante destas terras, tem trabalhado arduamente para converter a população à sua fé, o [proselytiser.GetFaith.GetName]. À medida que suas maquinações avançam, tem sido impossível deter a inundação de pregadores e Bhāṇakas que atravessam minhas terras para espalhar sua fé e a de [Select_CString( proselytiser.IsFemale, 'sua', 'seu' )] [proselytiser.GetLadyLord].\n\nMesmo enquanto o Theravada se estabelece, os seguidores tradicionais dos Ari se refugiam em fortalezas nas florestas ao redor das montanhas de Arakan, diminuindo em número e evitando adoração aberta."
 south_asia.0040.t:0 "Uma Fé Garantida?"
 south_asia.0040.tt:0 "Vários dos seus [counties|E] podem adotar a fé Theravada."
 south_asia.0041.a:0 "Não esquecerei esse gesto."
 south_asia.0041.desc:0 "É o quinto monge do dia que passa pela minha corte que desperta meu interesse; é raro ver membros da fé tão comumente em público. Uma rápida investigação revela o motivo desse novo dilúvio de fiéis atravessando minhas terras.\n\n[proselytiser.GetFullName], [Select_CString( proselytiser.IsFemale, 'uma', 'um' )] [proselytiser.GetLadyLord] [Select_CString( proselytiser.IsFemale, 'estrangeira', 'estrangeiro' )], tem estabelecido a fé do [proselytiser.GetFaith.GetName] em seu reino, e a notícia sobre as provações e tribulações que nossa fé compartilhada enfrentou em meu reino ao longo de gerações também chegou até eles.\n\nEm resposta, [proselytiser.GerSheHe] enviou muitos bhikku para ajudar a espalhar e apoiar a fé em suas terras ancestrais."
 south_asia.0041.t:0 "Um Presente do Exterior"
 south_asia.0050.a:0 "Uma nova capital se erguirá em Delhi!"
 south_asia.0050.b:0 "Faremos de Lahore o centro do Império"
 south_asia.0050.c:0 "O Império será governado de [founder.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 south_asia.0050.desc:0 "Mauryas, Kushanas, Guptas, Palas e Pratiharas, por milênios, a planície Indo-Gangética foi tanto o assento quanto o campo de batalha para muitos grandes impérios. Alguns governantes eram estrangeiros e muitos outros surgiram do próprio subcontinente.\n\nOs [founder.GetHouse.GetNameNoTooltip] não são tão antigos, mas conseguimos criar nosso próprio reino onde essas dinastias falharam. O tempo agora chegou para construirmos um império e uma estrutura governamental para governar a miríade de povos e crenças que habitam estas terras."
 south_asia.0050.t:0 "Os Reinos de Hindustão"
 south_asia.0051.a:0 "$middle_europe_decisions.0016.a$"
 south_asia.0051.b:0 "Vamos esmagar esses pretensiosos iniciantes!"
 south_asia.0051.c:0 "Finalmente, um campeão da verdadeira fé!"
 south_asia.0051.d:0 "Um desenvolvimento preocupante"
 south_asia.0051.desc:0 "Chegou-nos a notícia de que os [founder.GetHouse.GetNameNoTooltip] consolidaram seu controle sobre a planície Indo-Gangética, fundando um novo Império Islâmico sobre as ruínas deixadas pelas dinastias hindus e budistas de outrora.\n\nIntitulando si mesmo como [founder.GetFullName], com a ambição imperial de governar toda a Índia a partir de [founder.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], [founder.GetFirstNameNoTooltip] está rapidamente se tornando tanto temido quanto admirado."
 south_asia.0051.e:0 "$middle_europe_decisions.0016.d$"
 south_asia.0051.t:0 "O Sultanato de [founder.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
