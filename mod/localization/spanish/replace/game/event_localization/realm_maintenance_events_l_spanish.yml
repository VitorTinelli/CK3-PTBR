 realm_maintenance.2001.a.ceremonial_regent:0 "É uma grande honra ajudar [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetPrimaryTitle.MakeScope.Var('administrative_ui_special_title').Title.GetHolder.GetTitleAsNameNoTooltip]!"
 realm_maintenance.2001.a:0 "Vida longa [Select_CString( ROOT.Char.IsFemale, 'a', 'ao' )] [ROOT.Char.GetTitleAsNameNoTooltip]!"
 realm_maintenance.2001.desc:0 "\n\nEu componho minha expressão em uma postura digna de um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip], fico diante dos meus vassalos e [ROOT.Char.Custom('quirk_pos_personal_present')]. Ah, as coisas que eu vou conquistar!"
 realm_maintenance.2001.desc_alive:0 "Agora cabe a mim liderar o aparato que meu predecessor, [previous_holder.GetTitledFirstName], deixou para trás."
 realm_maintenance.2001.desc_ceremonial_regent:0 "Com isso, é meu dever solene orientar [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] em nome de [ROOT.Char.GetPrimaryTitle.MakeScope.Var('administrative_ui_special_title').Title.GetHolder.GetTitledFirstName].\n\nSento-me com dignidade diante da corte reunida, absorvendo o momento, e [ROOT.Char.Custom('quirk_pos_personal_present')]. Ah, as coisas que realizarei!"
 realm_maintenance.2001.desc_dead:0 "Com o falecimento [Select_CString( previous_holder.IsFemale, 'da', 'do' )] [previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)], a responsabilidade de liderar o vasto [title.GetTierAsNameNoTooltip|l] agora recai sobre meus ombros."
 realm_maintenance.2001.desc_murdered:0 "Após a trágica e #EMP infeliz#! morte [Select_CString( previous_holder.IsFemale, 'da', 'do' )] [previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)], a responsabilidade de liderar o vasto [title.GetTierAsNameNoTooltip] agora recai sobre meus ombros."
 realm_maintenance.2001.t:0 "[Select_CString( ROOT.Char.IsFemale, 'A Nova', 'O Novo' )] [ROOT.Char.GetTitleAsNameNoTooltip|U]"
 realm_maintenance.2001.t_ceremonial_regent:0 "Administrador do [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]"
