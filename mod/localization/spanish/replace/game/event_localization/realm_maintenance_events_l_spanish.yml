 realm_maintenance.1001.swear_fealty:0 "Você prestou juramento de fidelidade [Select_CString( new_liege.IsFemale, 'a', 'ao' )] [new_liege.GetTitledFirstName] e se tornou [vassal|E] del[Select_CString( new_liege.IsFemale, 'a', 'e' )]"
