l_spanish:
 AETHELINGS_GLOSS:0 "\"Ætheling\" é um termo anglo-saxão usado para designar qualquer anglo-saxão de nascimento nobre, e o prefixo 'Æthel' era frequentemente anexado a seus nomes."
 FENS_GLOSS:0 "As férteis terras pantanosas ao redor de The Wash são comumente conhecidas localmente como 'Os Fens'. Elas contêm muitas das igrejas e catedrais mais notáveis da Inglaterra.\n\nAs Fenlands são comumente aceitas como contendo os seguintes [baronies|E]:\n\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_lynn').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_cambridge').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_radfield').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_papworth').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_ely').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_hurstingstone').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_norman_cross').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_stamford').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_boston').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_peterborough').GetBaseName]"
 adventurer_titles_renounced_by_me_desc:0 "Eu renunciei meus novos [titles|E] [Select_CString( beneficiary.IsFemale, 'a', 'ao' )] [beneficiary.GetTitledFirstName]"
 adventurer_titles_renounced_title:0 "Títulos Renunciados"
 adventurer_titles_renounced_to_me_desc:0 "[adventurer.GetFirstName] renunciou seus novos [titles|E] para permanecer um [adventurer|E]"
 allowed_runaway_laamp_opinion:0 "Permitido a Aventurar-se"
 cultural_acceptance_gain_food_acceptance:0 "Duas culturas trocaram técnicas culinárias."
 duel_to_the_death.tt:0 "@death_icon! #X Você imediatamente entra em um [single_combat_duel|E] até a [character_death_death|E]#!"
 ep3_laamp_flavour_ewan.0001.a:0 "Demore-se e aprecie a solidão."
 ep3_laamp_flavour_ewan.0001.b:0 "[watch_partner_1.GetFirstNameNoTooltip], suba aqui!"
 ep3_laamp_flavour_ewan.0001.c:0 "Chame [Select_CString( watch_partner_2.IsFemale, 'a', 'o' )] [watch_partner_2.GetFirstNameNoTooltip] em vez disso."
 ep3_laamp_flavour_ewan.0001.d:0 "Um momento agradável, mas o trabalho chama."
 ep3_laamp_flavour_ewan.0001.desc.desert:0 "deserto se estendendo diante de mim, um oceano de areia rosa se estendendo até o horizonte. Além disso, até mesmo. Árido, mas longe de ser sem características, o terreno se desloca com os ventos do final do dia."
 ep3_laamp_flavour_ewan.0001.desc.desert_mountains:0 "picos menores abaixo, as montanhas ressecadas bebendo profundamente e avidamente da luz rosada, lançando vales inteiros em sombra enquanto esgotam-na."
 ep3_laamp_flavour_ewan.0001.desc.drylands:0 "terras secas abaixo, banhando a paisagem em uma suave luz rosa, de colina a colina, de vila a vila, cobrindo as muitas pequenas aldeias da área em uma calma imobilidade."
 ep3_laamp_flavour_ewan.0001.desc.farmlands:0 "terras agrícolas abaixo, capturando as cercas e as casas e suavizando suas bordas com a mais sutil sugestão de sombras profundas. Tantos pequenos mundos para pequenas pessoas sob o mesmo céu brilhante."
 ep3_laamp_flavour_ewan.0001.desc.floodplains:0 "planícies alagadas se estendendo diante de mim, altas, gramas luxuriosas e fileiras de árvores florescentes lançando finas franjas de sombra para todos os lados. A terra toda parece brilhar, suavemente."
 ep3_laamp_flavour_ewan.0001.desc.forest:0 "floresta abaixo, uma confusão de esporas nodosas e pequenos caminhos com patches de sombra suficientes para esconder um exército, embora dois ou três soldados ao mesmo tempo."
 ep3_laamp_flavour_ewan.0001.desc.hills:0 "colinas abaixo, criando dezenas de pequenos bolsões de sombra, um cobertor marcado por manchas de rosa e vales escuros."
 ep3_laamp_flavour_ewan.0001.desc.intro.diligent:0 "organizar mentalmente minhas tarefas para amanhã.\n\n"
 ep3_laamp_flavour_ewan.0001.desc.intro.fallback:0 "escapar do barulho por um tempo.\n\n"
 ep3_laamp_flavour_ewan.0001.desc.intro.lazy:0 "evitar todas as pequenas tarefas e perguntas que vêm de meus seguidores.\n\n"
 ep3_laamp_flavour_ewan.0001.desc.intro.preamble:0 "O início da noite é um momento de intensa atividade para o acampamento, pessoas e suprimentos sendo jogados para lá e para cá enquanto nossa casa portátil é instalada mais uma vez. Habitualmente, é também quando dou uma caminhada para clarear minha cabeça e"
 ep3_laamp_flavour_ewan.0001.desc.jungle:0 "dossel da selva se estendendo abaixo, um patchwork de sombras já profundamente alongadas e árvores majestosas parecendo se esticar para cima por apenas uma última visão de luz difusa."
 ep3_laamp_flavour_ewan.0001.desc.midtro.dusty_hill:0 "Ao alcançar o topo de uma colina empoeirada, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
 ep3_laamp_flavour_ewan.0001.desc.midtro.dusty_ridge:0 "Ao alcançar o topo de uma crista empoeirada, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
 ep3_laamp_flavour_ewan.0001.desc.midtro.small_dune:0 "Ao alcançar o topo de uma pequena duna, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
 ep3_laamp_flavour_ewan.0001.desc.midtro.small_hill:0 "Ao alcançar o topo de uma pequena colina, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
 ep3_laamp_flavour_ewan.0001.desc.midtro.small_ridge:0 "Ao alcançar o topo de uma pequena crista, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
 ep3_laamp_flavour_ewan.0001.desc.midtro.stubby_hillock:0 "Ao alcançar o topo de um morrinho, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
 ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate:0 "Vejo os últimos raios rosados do sol moribundo banhando o"
 ep3_laamp_flavour_ewan.0001.desc.midtro.tree_covered_hill:0 "Ao alcançar o topo de uma colina coberta de árvores, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
 ep3_laamp_flavour_ewan.0001.desc.mountains:0 "picos menores abaixo, lançando vales inteiros em sombras rápidas enquanto banham as pontas das montanhas em luz rosada."
 ep3_laamp_flavour_ewan.0001.desc.oasis:0 "deserto se estendendo diante de mim, capturando as águas do oásis mais brilhante de todos. A preciosa poça brilha ainda mais, tornando-se mais do que apenas um farol metafórico por um tempo."
 ep3_laamp_flavour_ewan.0001.desc.outro:0 "\n\nUma visão linda — talvez até uma que valha a pena compartilhar?"
 ep3_laamp_flavour_ewan.0001.desc.plains:0 "planícies abaixo, esculpindo bolsões de luz cintilante onde atingem poças e riachos, e banhando o restante em um brilho suave."
 ep3_laamp_flavour_ewan.0001.desc.steppe:0 "estepes se estendendo diante de mim, um mar de grama amarela e marrom ondulante repentinamente iluminado por um suave rosa. A estranha planura da terra privando a sombra de apoio, criando um tableau confortavelmente uniforme."
 ep3_laamp_flavour_ewan.0001.desc.taiga:0 "floresta abaixo, pinheiros e abetos se estendendo através de colinas rochosas por léguas, mesclados com sombras e luz rosada."
 ep3_laamp_flavour_ewan.0001.desc.wetlands:0 "terras úmidas abaixo, as águas fétidas do pântano se transformando instantaneamente em um cobertor rosa de escalas prateadas, a luz transformando cada poça em uma joia cintilante."
 ep3_laamp_flavour_ewan.0001.t:0 "Tons Rosados"
 ep3_laamp_flavour_ewan.0011.a.tt.failure:0 "Passou dos Limites"
 ep3_laamp_flavour_ewan.0011.a.tt.success:0 "A Vida da Festa"
 ep3_laamp_flavour_ewan.0011.a:0 "Junte-se à provocação [Select_CString( mockee.IsFemale, 'a', 'ao' )] [mockee.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.0011.b.tt.failure:0 "$ep3_laamp_flavour_ewan.0011.a.tt.failure$"
 ep3_laamp_flavour_ewan.0011.b.tt.success:0 "$ep3_laamp_flavour_ewan.0011.a.tt.success$"
 ep3_laamp_flavour_ewan.0011.b:0 "Vire o jogo contra [Select_CString( mocker.IsFemale, 'a', 'o' )] [mocker.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.0011.c.tt.failure:0 "O Que Isso Até #EMP Significa#!?"
 ep3_laamp_flavour_ewan.0011.c.tt.success:0 "$ep3_laamp_flavour_ewan.0011.a.tt.success$"
 ep3_laamp_flavour_ewan.0011.c:0 "Conte uma piada sua."
 ep3_laamp_flavour_ewan.0011.d:0 "Absorva tudo isso."
 ep3_laamp_flavour_ewan.0011.desc.ambitious:0 "pode ter ideias grandiosas sobre o potencial [mockee.GetHerHim] na vida, mas você tem que admitir, não são muitas as pessoas que conseguem divagar por um minuto inteiro sem respirar!\""
 ep3_laamp_flavour_ewan.0011.desc.arbitrary:0 "não pode ser responsabilizado por não entender todas essas #EMP regras#! — afinal, [mockee.GetSheHe] não consegue nem ler!\""
 ep3_laamp_flavour_ewan.0011.desc.arrogant:0 "não pode ser culpado pelo ego #EMP colossal#! [mockee.GetHerHim] — afinal, é a maior coisa que [mockee.GetSheHe] tem para seu nome hoje em dia!\""
 ep3_laamp_flavour_ewan.0011.desc.brave:0 "está pronto para lutar a qualquer momento, e isso é uma coisa boa. Melhor que os rostos mais feios ao redor façam a luta, eles têm menos a perder!\""
 ep3_laamp_flavour_ewan.0011.desc.callous:0 "Pode mostrar o mesmo nível de consciência social que a média de uma cabra, mas, ao contrário de uma cabra, [mockee.GetSheHe], uhh... bem, [mockee.GetFirstNameNoTooltip], isso é constrangedor.\""
 ep3_laamp_flavour_ewan.0011.desc.calm:0 "pode ser entediante, seco, cronicamente impassível, a maior arma do acampamento contra a insônia, e... oh, desculpe, [mockee.GetFirstNameNoTooltip], não vi você aí!\""
 ep3_laamp_flavour_ewan.0011.desc.chaste:0 "aqui está um verdadeiro apóstolo da castidade — e eu realmente espero que sim, porque seria uma sorte horrível para [mockee.GetSheHe] com aquele rosto, caso contrário!\""
 ep3_laamp_flavour_ewan.0011.desc.compassionate:0 "foi descrito como um pouco sensível. Ou muito sensível. Todo sensível, na verdade. Como um fino cobertor de penas de ganso que ganhou forma humana.\""
 ep3_laamp_flavour_ewan.0011.desc.content:0 "sabe manter suas ambições bem pequenas — combinando com seus talentos!\""
 ep3_laamp_flavour_ewan.0011.desc.craven:0 "é uma alma gentil da qual todos nós devemos ter cuidado para não assustar, para que seu coração não falhe de medo!\""
 ep3_laamp_flavour_ewan.0011.desc.cynical:0 "não é conhecid[Select_CString( mockee.IsFemale, 'a', 'o' )] como um[Select_CString( mockee.IsFemale, 'a', '' )] [mockee.GetWomanMan] divin[Select_CString( mockee.IsFemale, 'a', 'o' )], com certeza, mas para ser #EMP estritamente#! justo, eu teria meus problemas também se [mocker.GetFaith.CreatorName] me tivesse amaldiçoado com aquele rosto!\""
 ep3_laamp_flavour_ewan.0011.desc.deceitful:0 "pode ser a #EMP menos#! honesta que eu já conheci, mas você não pode dizer que uma conversa com [mockee.GetSheHe] não é uma montanha-russa! Eh [mockee.GetFirstNameNoTooltip]? Se esse for seu nome de verdade!\""
 ep3_laamp_flavour_ewan.0011.desc.diligent:0 "não pode ser culpado pelo péssimo ritmo de marcha [mockee.GetHerHim] — deve ser difícil com aquele bastão enfiado reto em seu traseiro!\""
 ep3_laamp_flavour_ewan.0011.desc.eccentric:0 "pode ser estranho, pode falar de forma esquisita, pode cheirar inexplicavelmente a fervido na maior parte do tempo, mas pelo menos você não pode dizer que [mockee.GetSheHe] é previsível!\""
 ep3_laamp_flavour_ewan.0011.desc.fickle:0 "pode mudar sua mente mais vezes do que o vento muda de direção, mas você tem que admitir, nunca há um momento monótono falando com [mockee.GetSheHe]!\""
 ep3_laamp_flavour_ewan.0011.desc.forgiving:0 "pode ser um pouco #EMP demais#! disposto a deixar as coisas no passado, mas o que é um pouco de assassinato de cachorro entre amigos, certo? Acontece com os melhores de nós — e também com [mockee.GetSheHe]!\""
 ep3_laamp_flavour_ewan.0011.desc.generous:0 "é uma alma bondosa que só não está nos dando a camisa das costas [mockee.GetHerHim] agora porque nenhum bugre a pegaria!\""
 ep3_laamp_flavour_ewan.0011.desc.gluttonous:0 "é a #EMP verdadeira#! razão pela qual temos que nos mudar com tanta frequência. Toda vez que [mockee.GetSheHe] vai ao mercado, causa uma fome!\""
 ep3_laamp_flavour_ewan.0011.desc.greedy:0 "não fez #EMP tecnicamente#! nada de errado quando [mockee.GetSheHe] jogou aquela moeda para o mendigo — não é culpa [mockee.GetHerHim] que [mockee.GetSheHe] a pegou antes deles!\""
 ep3_laamp_flavour_ewan.0011.desc.gregarious:0 "é conhecido por todos como uma pessoa sociável, um verdadeiro animador de multidões — o que é bom, porque [mockee.GetSheHe] nunca agradou ninguém um a um!\""
 ep3_laamp_flavour_ewan.0011.desc.honest:0 "não consegue contar uma mentira para salvar a vida [mockee.GetHerHim] — ou, para o caso, uma piada!\""
 ep3_laamp_flavour_ewan.0011.desc.humble:0 "se menospreza o suficiente para que eu realmente não precise tentar — mas vou fazer isso mesmo assim!\""
 ep3_laamp_flavour_ewan.0011.desc.impatient:0 "pode ter o foco de um mosquito, mas [mockee.GetSheHe] compensa isso com seu... natural... uhhh entusiasmo por coisas novas, né [mockee.GetFirstNameNoTooltip]?\""
 ep3_laamp_flavour_ewan.0011.desc.intro:0 "Todas as noites, a fogueira se torna #EMP o#! centro da atividade social do acampamento, com as pessoas se reunindo ao meu redor para conversar e trocar provocações amigáveis. Esta noite não é exceção.\n\n\"Olha, tudo o que estou dizendo\", gargalha [mocker.GetFirstName], \"é que [Select_CString( mockee.IsFemale, 'a', 'o' )] pobre [mockee.GetFirstName]\""
 ep3_laamp_flavour_ewan.0011.desc.just:0 "pode ser uma pessoa rigorosa quanto às regras, é verdade, mas dado o quão firmemente enfiadas elas parecem estar no traseiro [mockee.GetHerHim], isso era de se esperar!\""
 ep3_laamp_flavour_ewan.0011.desc.lazy:0 "não pode ser culpado por desaparecer mais rápido do que uma lebre assustada sempre que alguém começa uma frase com 'pode' — em certo ponto, a preguiça se torna uma forma de arte!\""
 ep3_laamp_flavour_ewan.0011.desc.lustful:0 "contraiu mais doenças venéreas do que [mockee.GetSheHe] tem dedos — e não podemos saber mais do que isso, pois [mockee.GetSheHe] não consegue contar mais alto!\""
 ep3_laamp_flavour_ewan.0011.desc.outro:0 "\n\nUm coro de gargalhadas explode entre os espectadores embriagados, embora tudo isso pareça estar afetando [mockee.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.0011.desc.paranoid:0 "é conhecido por ter feito alguns inimigos em tempos — talvez alguns deles estejam aqui agora, talvez até... #EMP atrás de você#!, [mockee.GetFirstNameNoTooltip], CUIDADO!\""
 ep3_laamp_flavour_ewan.0011.desc.patient:0 "teria vencido aquela pedra no concurso de olhar se não tivéssemos que mover o acampamento após uma semana ou duas!\""
 ep3_laamp_flavour_ewan.0011.desc.sadistic:0 "#EMP deu#! um chute naquele órfão morro abaixo, e #EMP deu#! risada na cara daquela mulher mendiga, mas [mockee.GetSheHe] tem qualidades redentoras também... eu presumo. Em algum lugar. Provavelmente.\""
 ep3_laamp_flavour_ewan.0011.desc.shy:0 "foi muito corajoso ao vir e se sentar ao lado da fogueira esta noite — já estou ansioso pela visita [mockee.GetHerHim] no próximo ano!\""
 ep3_laamp_flavour_ewan.0011.desc.stubborn:0 "pode ser a coisa mais teimosa que o acampamento tem a oferecer, mas isso é bem impressionante se você considerar todos os mulas!\""
 ep3_laamp_flavour_ewan.0011.desc.temperate:0 "não pode ser culpado por acidentalmente beber xixi de cabra e não notar o gosto. Não é a primeira vez, isso é um acidente, mas a #EMP segunda#!? Agora isso é um padrão!\""
 ep3_laamp_flavour_ewan.0011.desc.trusting:0 "pode ter perdido algumas moedas para um ou dois trapaceiros, mas em defesa [mockee.GetHerHim], como [mockee.GetSheHe] poderia saber que aquele mendigo banguela não era #EMP na verdade#! o Rei de [current_county.GetBaseNameNoTier]?"
 ep3_laamp_flavour_ewan.0011.desc.vengeful:0 "pode ter jurado uma eterna vingança de sangue sobre toda a linhagem daquela família, mas o que mais [mockee.GetSheHe] poderia fazer? Eles cortaram a fila da comida!\""
 ep3_laamp_flavour_ewan.0011.desc.wrathful:0 "não é culpado pelo temperamento [mockee.GetHerHim] — se eu tivesse que acordar como [mockee.GetSheHe] todas as manhãs, eu também ficaria puto!\""
 ep3_laamp_flavour_ewan.0011.desc.zealous:0 "é conhecido por ser um dos seguidores mais justos e altruístas de [mockee.GetFaith.HighGodName] na Terra — [mockee.GetSheHe] até mesmo abriu mão de todo o seu senso de humor!\""
 ep3_laamp_flavour_ewan.0011.t:0 "Fogo & Amigos"
 ep3_laamp_flavour_ewan.0021.a:0 "Venha aqui, pequeno amigo, você não é um belo companheiro?"
 ep3_laamp_flavour_ewan.0021.b:0 "Isso... é uma refeição..."
 ep3_laamp_flavour_ewan.0021.c:0 "Chute a criatura o mais forte possível."
 ep3_laamp_flavour_ewan.0021.d:0 "É apenas um companheiro de viagem, deixe-o em paz."
 ep3_laamp_flavour_ewan.0021.desc.cat.1:0 "caçando os ratos locais e afastando vigorosamente seguidores inferiores com a indignação altiva da verdadeira realeza.\n\nPode haver uma maior síntese da vida de um nobre do que esses dois atos?"
 ep3_laamp_flavour_ewan.0021.desc.cat.2:0 "levantando-se com o acampamento ao amanhecer, cochilando durante a trilha diária no #EMP meu#! carro, antes de se levantar sonolento para buscar uma refeição noturna de restos de mesa e provisões roubadas.\n\nUm animal presunçoso, mas certamente determinado."
 ep3_laamp_flavour_ewan.0021.desc.cat.3:0 "desaparecendo sempre que alguém se aproxima, apenas para reaparecer silenciosamente minutos depois — observando à distância.\n\nTímido, mas eternamente curioso. Uma combinação pesada para qualquer um suportar, e menos ainda para um gato tão pequeno."
 ep3_laamp_flavour_ewan.0021.desc.cat.4:0 "enrolando-se ansiosamente ao redor dos pés de cada um dos meus visitantes — e até mesmo muitos transeuntes — conseguindo um petisco ou um carinho no queixo antes de abandonar os infelizes sem pensar duas vezes.\n\nImplacável, talvez, mas eficaz."
 ep3_laamp_flavour_ewan.0021.desc.cat.5:0 "e nunca conheci um animal tão barulhento e furioso. Pouco mais do que uma bola de dentes, garras e raiva, sua pequena estatura desmente a aparente magnitude do #EMP ódio#! dentro dele.\n\nTalvez seja uma boa coisa que o animal tenha nascido gato e não pantera."
 ep3_laamp_flavour_ewan.0021.desc.dog.1:0 "uivando e choramingando sempre que saio de sua vista, lamentando como... bem, como um cachorro pelo seu mestre, embora eu só tenha conhecido o cão há pouco.\n\nTalvez o animal sinta algum tipo de afinidade comigo, embora durante o dia ele trote atrás de mim a uma distância razoável."
 ep3_laamp_flavour_ewan.0021.desc.dog.2:0 "rosnando e tentando morder qualquer um que se aproxime a um pé de distância, por ter a ousadia de se aproximar da minha moradia.\n\nImpraticável em muitos níveis, mas não há nada melhor para proteger você do que um hound leal."
 ep3_laamp_flavour_ewan.0021.desc.dog.3:0 "correndo círculos e círculos e círculos e #EMP círculos#! com a energia infinita de um hound que tem lugares para ir, mas nenhum para estar.\n\nSomos, talvez, um pouco semelhantes nesse aspecto. Ambos são estranhos à deriva no mundo."
 ep3_laamp_flavour_ewan.0021.desc.dog.4:0 "parecendo fazer o melhor para ensinar #EMP a si mesmo#! truques, talvez esperando me impressionar. É um hound mais esperto do que a maioria, algo que percebi apenas quando a criatura saltou de uma vez para pegar um nabo cozido da minha mão.\n\nEu gritei com o animal, mas não posso dizer que não foi engraçado. Até impressionante, considerando que é um cachorro."
 ep3_laamp_flavour_ewan.0021.desc.dog.5:0 "seguindo-me com nada além de um ofegar semi-silencioso sempre que eu saio, antes de me acompanhar em minha jornada de volta. Não sei por que me protege, mas parece contente em fazê-lo por qualquer razão.\n\nTalvez eu lembre o animal de um antigo [ROOT.Char.Custom('MistressMaster')]? Difícil de dizer, embora a rotina certamente pareça fácil para ele."
 ep3_laamp_flavour_ewan.0021.desc.intro.cat:0 "Há vários dias, vi um pequeno gato se esgueirando ao redor do meu pavilhão,"
 ep3_laamp_flavour_ewan.0021.desc.intro.dog:0 "Há vários dias, um cachorrinho esfarrapado passou suas noites sentado do lado de fora do meu pavilhão,"
 ep3_laamp_flavour_ewan.0021.desc.outro:0 "\n\nA besta parece amigável o suficiente para mim, felizmente esfregando e lambendo meus dedos por minutos a fio, mesmo que se recuse a aceitar qualquer outra pessoa."
 ep3_laamp_flavour_ewan.0021.t:0 "Um Pequeno Seguidor"
 ep3_laamp_flavour_ewan.0031.a:0 "Rir em voz alta."
 ep3_laamp_flavour_ewan.0031.b:0 "Rir de forma contida, mas não mais."
 ep3_laamp_flavour_ewan.0031.c:0 "Tal malícia mesquinha está abaixo de mim."
 ep3_laamp_flavour_ewan.0031.desc.desert:0 "descer girando por uma alta duna, fazendo barulho enquanto se move para frente"
 ep3_laamp_flavour_ewan.0031.desc.desert_mountains:0 "$ep3_laamp_flavour_ewan.0031.desc.mountains$"
 ep3_laamp_flavour_ewan.0031.desc.drylands:0 "rolar por uma colina empoeirada, levantando uma grossa nuvem de areia e"
 ep3_laamp_flavour_ewan.0031.desc.farmlands:0 "passar por uma cerca grossa e cair em uma vala cheia de espinhos,"
 ep3_laamp_flavour_ewan.0031.desc.floodplains:0 "rolar em que parece ser algum tipo de vala de drenagem turva,"
 ep3_laamp_flavour_ewan.0031.desc.forest:0 "rolar pela encosta de uma colina coberta de árvores, pegando galhos e espinhos enquanto"
 ep3_laamp_flavour_ewan.0031.desc.hills:0 "rolar direto pela encosta de uma colina íngreme, de ponta-cabeça até cair em um desfiladeiro,"
 ep3_laamp_flavour_ewan.0031.desc.intro:0 "Enquanto cavalgamos por [current_county.GetBaseNameNoTier], meus pensamentos vagueiam despretensiosamente, entediados pela monotonia do simples trânsito, quando há um repentino #EMP grito#! de alarme.\n\nUm ataque? Viro a cabeça — não — é aquel[Select_CString( stooge.IsFemale, 'a', 'e' )] maldit[Select_CString( stooge.IsFemale, 'a', 'o' )] [stooge.GetTitledFirstName], [stooge.GetSheHe] conseguiu cair de seu cavalo e"
 ep3_laamp_flavour_ewan.0031.desc.jungle:0 "rolar pela encosta de uma colina coberta de árvores, pegando cipós e espinhos estranhos enquanto"
 ep3_laamp_flavour_ewan.0031.desc.midtro:0 "gritando e chorando enquanto [stooge.GetSheHe] vai.\n\n"
 ep3_laamp_flavour_ewan.0031.desc.mountains:0 "deslizar pela encosta, levantando pedras e poeira até tombar sobre uma borda"
 ep3_laamp_flavour_ewan.0031.desc.oasis:0 "$ep3_laamp_flavour_ewan.0031.desc.desert$"
 ep3_laamp_flavour_ewan.0031.desc.outro.dead:0 "Quando [Select_CString( stooge.IsFemale, 'a', 'o' )] [stooge.GetFirstNameNoTooltip] não aparece após vários minutos, um carregador desce para verificar. Momentos depois, um grito de choque ressoa.\n\nParece que [stooge.GetSheHe] morreu na queda."
 ep3_laamp_flavour_ewan.0031.desc.outro.fallback:0 "Momentos depois, [stooge.GetFirstNameNoTooltip] aparece, xingando profusamente e vivo, mas não ileso."
 ep3_laamp_flavour_ewan.0031.desc.plains:0 "rolar por uma pequena ladeira direto em um matagal de aparência maligna,"
 ep3_laamp_flavour_ewan.0031.desc.steppe:0 "encontrar o #EMP um#! morro em léguas em todas as direções para rolar para baixo,"
 ep3_laamp_flavour_ewan.0031.desc.taiga:0 "rolar pela encosta de uma colina coberta de árvores, pegando galhos e pinhas velhas enquanto"
 ep3_laamp_flavour_ewan.0031.desc.wetlands:0 "deslizar por um morro atarracado, levantando lama e grama úmida,"
 ep3_laamp_flavour_ewan.0031.t:0 "Rolando para Baixo"
 ep3_laamp_flavour_ewan.0041.a:0 "Sobre o que você está reclamando?"
 ep3_laamp_flavour_ewan.0041.b.tt.failure:0 "Negociações fracas com os locais"
 ep3_laamp_flavour_ewan.0041.b.tt.success:0 "Você faz bons negócios"
 ep3_laamp_flavour_ewan.0041.b:0 "Tudo bem, podemos reabastecer."
 ep3_laamp_flavour_ewan.0041.c:0 "De jeito nenhum, trabalhe com o que você tem."
 ep3_laamp_flavour_ewan.0041.d:0 "Tenho certeza de que você pode pensar em algo entre vocês."
 ep3_laamp_flavour_ewan.0041.desc.desert:0 "\"Com os braços enfiados até o fundo deste deserto, sem um assentamento à vista, e nós tão desprovidos que não conseguimos nem"
 ep3_laamp_flavour_ewan.0041.desc.desert_mountains:0 "\"Erguendo-se metade do caminho até o céu e com as gargantas secas, e nem mesmo conseguimos tentar"
 ep3_laamp_flavour_ewan.0041.desc.drylands:0 "\"Banidos aqui para este inferno empoeirado, muito longe de qualquer lugar importante o suficiente para até mesmo"
 ep3_laamp_flavour_ewan.0041.desc.farmlands:0 "\"Toda essa bela terra agrícola e não conseguimos encontrar um pouco de tempo para"
 ep3_laamp_flavour_ewan.0041.desc.floodplains:0 "\"Descartados aqui nessas planícies alagadas apodrecidas, à mercê das marés e das margens, incapazes de até mesmo"
 ep3_laamp_flavour_ewan.0041.desc.forest:0 "\"Mesmo nesta rica floresta, não conseguimos nos dar ao luxo de"
 ep3_laamp_flavour_ewan.0041.desc.has_cook:0 "\"Não acho que estou sendo irrazonável\", provoca [Select_CString( camp_cook.IsFemale, 'a', 'o' )] [camp_cook.GetFirstName] — meu [GetCourtPositionType( 'camp_cook_camp_officer' ).GetName()] — enquanto [camp_cook.GetSheHe] acena um braço de forma desdenhosa para o terreno ao redor.\n\n"
 ep3_laamp_flavour_ewan.0041.desc.hills:0 "\"Tantos pastos nas colinas por milhas ao redor, ainda assim não conseguimos nos dar ao luxo de"
 ep3_laamp_flavour_ewan.0041.desc.jungle:0 "\"Mesmo com as muitas iguarias exóticas da selva ao nosso alcance, não conseguimos nem encontrar a vontade de"
 ep3_laamp_flavour_ewan.0041.desc.mountains:0 "\"Toda essa caça nas montanhas ao redor e nem mesmo podemos nos dar ao luxo de"
 ep3_laamp_flavour_ewan.0041.desc.nameless_cook:0 "\"Não acho que estamos sendo irrazonáveis\", provoca o cozinheiro que presumivelmente puxou a palha curta para vir falar comigo, acenando um braço de forma desdenhosa para o terreno ao redor o tempo todo.\n\n"
 ep3_laamp_flavour_ewan.0041.desc.oasis:0 "\"Mesmo em um verdadeiro oásis, parecemos tão ansiosos para voltar à dureza do deserto, que nem conseguimos"
 ep3_laamp_flavour_ewan.0041.desc.outro:0 "estocar algumas das pequenas luxúrias que tornam nossa comida suportável?\"\n\nEu suspiro, cansado da conversa já. Me pergunto qual de nós quebrará primeiro."
 ep3_laamp_flavour_ewan.0041.desc.plains:0 "\"Há muitas fazendas aqui, mesmo que não sejam boas, não pode ser tão difícil para nós parar brevemente e"
 ep3_laamp_flavour_ewan.0041.desc.provisions.high:0 "\n\nIsso parece as devaneios de um lunático. Verifiquei os estoques esta manhã e deveríamos estar bem supridos por meses ainda."
 ep3_laamp_flavour_ewan.0041.desc.provisions.low:0 "\n\nNossos estoques estão no estado em que estão e esse idiota está aqui discutindo se o último de nossos suprimentos irá combinar certo com o paladar."
 ep3_laamp_flavour_ewan.0041.desc.provisions.medium:0 "\n\nSim, nossos suprimentos estão, talvez, um #EMP pouco#! abaixo do que eu gostaria, mas não há motivo para tal alarme."
 ep3_laamp_flavour_ewan.0041.desc.provisions.sahara:0 "\n\nEu olho ao redor para o quase infinito deserto se estendendo em todas as direções, para sempre."
 ep3_laamp_flavour_ewan.0041.desc.steppe:0 "\"Perdidos aqui neste mar de grama sem características, muito longe de qualquer lugar para até mesmo"
 ep3_laamp_flavour_ewan.0041.desc.taiga:0 "\"Aqui fora, em algum remoto inferno de floresta abandonada, tão longe da vida que não conseguimos nem"
 ep3_laamp_flavour_ewan.0041.desc.wetlands:0 "\"Condenado a vagar por este pântano fétido por toda a eternidade, incapaz até mesmo de"
 ep3_laamp_flavour_ewan.0041.e.tt.failure:0 "Quase de mãos vazias"
 ep3_laamp_flavour_ewan.0041.e.tt.success:0 "Seus esforços são bem-sucedidos"
 ep3_laamp_flavour_ewan.0041.e:0 "Provavelmente podemos encontrar algo..."
 ep3_laamp_flavour_ewan.0041.f.tt.failure:0 "$ep3_laamp_flavour_ewan.0041.b.tt.failure$"
 ep3_laamp_flavour_ewan.0041.f.tt.success:0 "$ep3_laamp_flavour_ewan.0041.b.tt.success$"
 ep3_laamp_flavour_ewan.0041.f:0 "Reabastecer seria uma boa ideia de qualquer maneira, eu suponho."
 ep3_laamp_flavour_ewan.0041.g:0 "Não está no orçamento."
 ep3_laamp_flavour_ewan.0041.h:0 "Apenas dobre as rações de cerveja e chame isso de dia."
 ep3_laamp_flavour_ewan.0041.i.tt.failure:0 "$ep3_laamp_flavour_ewan.0041.e.tt.failure$"
 ep3_laamp_flavour_ewan.0041.i.tt.success:0 "$ep3_laamp_flavour_ewan.0041.e.tt.success$"
 ep3_laamp_flavour_ewan.0041.i:0 "Podemos parar para forragear."
 ep3_laamp_flavour_ewan.0041.j.tt.failure:0 "$ep3_laamp_flavour_ewan.0041.b.tt.failure$"
 ep3_laamp_flavour_ewan.0041.j.tt.success:0 "$ep3_laamp_flavour_ewan.0041.b.tt.success$"
 ep3_laamp_flavour_ewan.0041.j:0 "Vamos comprar o que pudermos de suprimentos extras..."
 ep3_laamp_flavour_ewan.0041.k:0 "Temos que seguir em frente."
 ep3_laamp_flavour_ewan.0041.l:0 "Hmm, pode ser que tenhamos algo reservado."
 ep3_laamp_flavour_ewan.0041.m:0 "Você vê algum lugar para comprar suprimentos, seu idiota?"
 ep3_laamp_flavour_ewan.0041.n:0 "Não me importo se estivermos comendo mingau até passar por isso."
 ep3_laamp_flavour_ewan.0041.t:0 "Dificuldades de um Cozinheiro"
 ep3_laamp_flavour_ewan.0051.a:0 "Retirar-me para minha própria tenda e simplesmente ouvir."
 ep3_laamp_flavour_ewan.0051.b:0 "Verificar nossos suprimentos."
 ep3_laamp_flavour_ewan.0051.c.bald.female:0 "Talvez eu deva verificar meus humores?"
 ep3_laamp_flavour_ewan.0051.c.bald.male:0 "Talvez uma barba?"
 ep3_laamp_flavour_ewan.0051.c.fallback:0 "Talvez um corte de cabelo?"
 ep3_laamp_flavour_ewan.0051.c.hairy.male:0 "Talvez uma barba e um corte de cabelo?"
 ep3_laamp_flavour_ewan.0051.d:0 "Hora de controlar o caos do comboio de bagagens..."
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_01:0 "o caos e a confusão do trem de bagagens se desenrolando após um dia em movimento,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_ample_steeds:0 "o relinchar de nossa legião de cavalos,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_bartering_grounds:0 "os gritos e clamores de comerciantes e seguidores no local de troca,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_kennel:0 "os latidos e choros dos canis,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_pleasure_tents:0 "o fluxo constante de pessoas vagando de volta da tenda de prazer com sorrisos sonolentos,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_porters:0 "as piadas e gemidos dos carregadores levando suas cargas de um lugar para outro,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_ransom_cages:0 "os gritos e lamentos baixos dos prisioneiros em suas algemas e gaiolas,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_scribes:0 "a sagacidade seca e as observações irônicas dos muitos escribas vagando por aí sem serem úteis,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_shrine:0 "a fila constante de fiéis se enrolando ao redor do santuário portátil,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_siege_engineers:0 "o rangido incessante da carroça dos engenheiros enquanto se queixa sob o peso de seus próprios suprimentos,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_trackers:0 "os grupos silenciosos de caçadores se movendo como um só pelos caminhos e tendas,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.barber_tent_01:0 "os gritos mistos e a polidez forçada da tenda do barbeiro,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.barber_tent_dentists_tools:0 "os gritos roucos dos seguidores tendo pinças e mãos firmes aplicadas em seus dentes ruins,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.barber_tent_surgeons_tools:0 "os gritos mal contidos do que passa por cirurgia vindos da tenda do barbeiro,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.barber_tent_torturers_tools:0 "os gritos roucos dos prisioneiros acampando muito perto da tenda do barbeiro,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_01:0 "o cheiro das fogueiras começando a ser acesas,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_capering_fools:0 "as traquinagens dos tolos saltando de fogueira em fogueira,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_juicy_rumors:0 "o suspiro chocado de fofocas já começando a se espalhar ao redor das fogueiras,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_local_hangers_on:0 "os curiosos locais aparecendo e observando tantos estranhos com medo e espanto,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_trailing_musicians:0 "a deliciosa cacofonia dos nossos músicos acompanhantes começando,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_wandering_poets:0 "os suspiros chocados dos seguidores ouvindo poesia arriscada,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_perimeter_01:0 "as ordens gritas e os pés arrastados que marcam o estabelecimento de nosso perímetro,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_perimeter_ditch:0 "o som das pás mordendo a terra enquanto a vigilância de hoje treina suas obras de terra simuladas,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_perimeter_fixed_layout:0 "as discussões silenciosas e suspiros resignados enquanto nosso layout definido se estabiliza, argumentando em meu favor,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_perimeter_palisade:0 "o toque de madeira em madeira enquanto torres de vigia temporárias são levantadas para a noite,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.fallback:0 "o entusiasmo que vem com acampar sob um céu aberto,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.mess_tent_01:0 "o barulho de seguidores famintos subindo da tenda de refeições,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.mess_tent_bakers:0 "o cheiro de pão crescendo para a refeição da noite,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.mess_tent_brewers:0 "o som de seguidores barulhentos se embriagando com a cerveja recém-preparada,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.mess_tent_cooks:0 "as habituais discussões entre os cozinheiros sobre essa ou aquela escolha mesquinha que um força sobre os outros,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.mess_tent_herbalists:0 "o cheiro de ervas secando das prateleiras do lado de fora da tenda de refeições,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_01:0 "os gritos e berros distantes de frustração dos campos de provas,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_bodyguard_drills:0 "o berreiro gutural dos meus guardas pessoais treinando a plenos pulmões,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_camel_run:0 "o trote estrondoso e os latidos distantes dos camelos,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_elephantry_reserve:0 "o trombeteio descontente dos elefantes,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_horse_run:0 "o pisar de cascos enquanto nossa cavalaria leve pratica sua arte,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_mock_battle_drills:0 "o barulho menor de uma batalha simulada enquanto os lanceiros trabalham na disciplina conjunta,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_nightly_barding_drills:0 "os gemidos e clangores vindos dos pesados reparos de armaduras dos cavalos,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_personal_bouts:0 "os rugidos de sucesso e os aplausos de escárnio dos lutadores um contra um,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_the_stick_game:0 "a ocasional maldição realmente #EMP obscena#! quando alguém perde o jogo do bastão,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_the_stump:0 "as barragens intermitentes de #EMP thwick#! enquanto mais um disparo é lançado em [ROOT.Char.Custom('GetStumpName')] de hoje,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_training_circle:0 "o clangor de escudo contra escudo nos círculos de treinamento,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.supply_tent_01:0 "o vasculhar de caixas e barris da tenda de suprimentos,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.supply_tent_arsenal:0 "a contagem focada de cada estoque de cada arma e armamento no arsenal,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.supply_tent_smithy:0 "os gritos ecoantes de metal contra metal da fundição,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.supply_tent_sutler:0 "os gritos de venda dos sutlers,"
 ep3_laamp_flavour_ewan.0051.desc.followers.connector:0 "ou até mesmo o"
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_count.many_children:0 "as gargalhadas e risos de tantas crianças brincando, enquanto [Select_CString( leading_child.IsFemale, 'a', 'o' )] [leading_child.GetFirstName] grita passando por mim, liderando um jogo de pega-pega."
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_count.many_faiths:0 "sons de orações noturnas subindo para o [faith_1.GetAdjective] [faith_1.HealthGodName], [faith_2.GetAdjective] [faith_2.HouseholdGodName], e [faith_3.GetAdjective] [faith_3.NightGodName]."
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_count.many_knights:0 "os gritos d[Select_CString( leading_knight.IsFemale, 'a', 'o' )] [leading_knight.GetFirstName] enquanto [leading_knight.GetSheHe] lidera os $knight_culture_player_plural_no_tooltip$ em seus combates diários."
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_count.many_languages:0 "muitas línguas sendo faladas por transeuntes, de [culture_1.GetLanguage.GetNameNoTooltip] a [culture_2.GetLanguage.GetNameNoTooltip] a [culture_3.GetLanguage.GetNameNoTooltip]."
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.best_friends:0 "as provocações afetuosas d[Select_CString( courtier_best_friend_1.IsFemale, 'a', 'o' )] [courtier_best_friend_1.GetFirstName] e [Select_CString( courtier_best_friend_2.IsFemale, 'a', 'o' )] [courtier_best_friend_2.GetFirstName] enquanto os dois melhores amigos cuidam dos assuntos da noite."
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.friends:0 "as brincadeiras de bom humor d[Select_CString( courtier_friend_1.IsFemale, 'a', 'o' )] [courtier_friend_1.GetFirstName] e [Select_CString( courtier_friend_2.IsFemale, 'a', 'o' )] [courtier_friend_2.GetFirstName] passando pelo meu pavilhão."
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.lovers:0 "as risadinhas e sussurros d[Select_CString( courtier_lover_1.IsFemale, 'a', 'o' )] [courtier_lover_1.GetFirstName] e [Select_CString( courtier_lover_2.IsFemale, 'a', 'o' )] [courtier_lover_2.GetFirstName], passando de braços dados em um de seus passeios regulares."
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.nemeses:0 "o rosnar contido d[Select_CString( courtier_nemesis_1.IsFemale, 'a', 'o' )] [courtier_nemesis_1.GetFirstName] e [Select_CString( courtier_nemesis_2.IsFemale, 'a', 'o' )] [courtier_nemesis_2.GetFirstName], aproveitando suas oportunidades habituais de atacar um ao outro."
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.rivals:0 "as farpas amargas d[Select_CString( courtier_rival_1.IsFemale, 'a', 'o' )] [courtier_rival_1.GetFirstName] e [Select_CString( courtier_rival_2.IsFemale, 'a', 'o' )] [courtier_rival_2.GetFirstName], discutindo como sempre."
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.soulmates:0 "os platitudes excessivamente doces trocados entre [Select_CString( courtier_soulmate_1.IsFemale, 'a', 'o' )] [courtier_soulmate_1.GetFirstName] e [Select_CString( courtier_soulmate_2.IsFemale, 'a', 'o' )] [courtier_soulmate_2.GetFirstName], passando como sempre apaixonados."
 ep3_laamp_flavour_ewan.0051.desc.followers.fallback.1:0 "o bramido semi-distante de mulas obstinadas sendo acomodadas para a noite."
 ep3_laamp_flavour_ewan.0051.desc.followers.fallback.2:0 "os gritos inquietantes de pássaros locais enquanto a noite começa a cair."
 ep3_laamp_flavour_ewan.0051.desc.followers.fallback.3:0 "o som rítmico de pregos sendo martelados no terreno macio ao meu redor."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.arbitrary:0 "exigindo que alguém troque de tenda com [notable_char.GetSheHe] — de novo."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.arrogant:0 "pegando casualmente vários seguidores menores para resolver algum trabalho insignificante para [notable_char.GetSheHe]."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.callous:0 "ouvindo impassivelmente a história triste de algum local."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.calm:0 "acalmando uma briga entre dois seguidores menores."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.compassionate:0 "em seu púlpito falando sobre alguém supostamente chutando um cachorro."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.cynical:0 "zombando das devoções noturnas de alguém."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.deceitful:0 "no meio de contar uma longa e duvidosa história para um local creduloso."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.diligent:0 "organizando vários seguidores menores enquanto eles realizam suas tarefas noturnas."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.fallback:0 "cantando junto com [notable_char.GetHerselfHimself] enquanto [notable_char.GetSheHe] passa."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.fickle:0 "envolvido em uma discussão confusa com alguém, mudando sua posição a cada outra frase."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.generous:0 "rindo enquanto [notable_char.GetSheHe] joga moedas para algum seguidor sortudo."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.gluttonous:0 "devorando um prato local fresco."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.greedy:0 "contando suas moedas — o segundo de três, para ter certeza de que não perdeu nenhuma na marcha."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.gregarious:0 "rindo e brincando com alguns dos seguidores menores."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.honest:0 "explicando algum problema constrangedor para um local irritado."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.humble:0 "parando para ajudar alguém a montar sua tenda."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.impatient:0 "interrompendo a história de alguém para dizer a eles que vão direto ao ponto."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.intro:0 "o som reconhecível d[Select_CString( notable_char.IsFemale, 'a', 'o' )] [notable_char.GetFirstName]"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.just:0 "exercendo uma palestra audível para alguém tão alto e confiantemente quanto um[Select_CString( notable_char.IsFemale, 'a', '' )] [notable_char.GetLadyLord] na corte."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.lazy:0 "isentando casualmente [notable_char.GetHerselfHimself] de montar sua própria tenda — de novo."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.lustful:0 "flertando com algum pobre seguidor."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.paranoid:0 "murmurando e resmungando para [notable_char.GetHerselfHimself]."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.patient:0 "acertando a cabeça e fazendo sons afirmativos enquanto um local conta uma longa história prolixa."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.sadistic:0 "rindo maliciosamente da história triste de algum local."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.stubborn:0 "mantendo teimosamente sua posição contra um grupo de locais irritados."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.temperate:0 "exercendo uma palestra audível sobre os perigos de comer muito jantar."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.trusting:0 "ouvindo credulamente a longa e duvidosa história de algum tolo."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.vengeful:0 "jurando outra vingança intergeracional contra alguém por... algo ou outro."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.wrathful:0 "gritando com algum pobre seguidor desafortunado."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.zealous:0 "liderando uma pequena congregação de fiéis em adoração."
 ep3_laamp_flavour_ewan.0051.desc.intro:0 "É difícil descrever o que é tão intimamente atraente sobre o zumbido suave de um acampamento se acomodando para a noite.\n\nTalvez seja o"
 ep3_laamp_flavour_ewan.0051.desc.outro:0 "\n\nTudo isso forma um manto silencioso e confortável de familiaridade. Este é meu domínio, e estas são minhas pessoas — um pequeno reino, mas um onde conheço cada vista, som e alma."
 ep3_laamp_flavour_ewan.0051.desc.purpose.brigands.1:0 "a fome por saques e pilhagens no rosto de cada seguidor,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.brigands.2:0 "acusações de trapaça e ameaças de assassinato que surgem da jogatina,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.brigands.3:0 "troca de contos macabros fora das tendas dos amigos,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.explorers.1:0 "discussões sobre lugares distantes como se todos já tivéssemos estado lá,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.explorers.2:0 "ambições flagrantes de ver o mundo constantemente exibidas,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.explorers.3:0 "um amor genuíno pelo que as maravilhas do mundo ainda podem conter,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.legitimists.1:0 "o conhecimento de que essas pessoas me seguiriam até [ROOT.Char.random_NegativeAfter] se eu pedisse,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.legitimists.2:0 "o murmúrio silencioso de votos diários sendo afirmados em cada outra tenda,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.legitimists.3:0 "as histórias de triunfo e heroísmo que meus seguidores tecem sobre meu retorno."
 ep3_laamp_flavour_ewan.0051.desc.purpose.mercenaries.1:0 "clangor de armas sendo jogadas para lá e para cá,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.mercenaries.2:0 "gargalhadas de guerreiros contando piadas sujas,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.mercenaries.3:0 "aplausos e vaias característicos de jogos distantes de dados,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.scholars.1:0 "confortante arranhar de penas em diários noturnos,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.scholars.2:0 "sons distantes dos mesmos argumentos da noite passada recomeçando sem mais delongas,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.scholars.3:0 "gritos altivos de indignação de estudiosos vivendo na selva,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.wanderers.1:0 "desfile de novos rostos ansiosos por escapar da vida estabelecida,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.wanderers.2:0 "coro de discussões no início da noite sobre o planejamento de amanhã,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.wanderers.3:0 "piadas levemente melancólicas sobre o que fazer a seguir,"
 ep3_laamp_flavour_ewan.0051.e:0 "É melhor eu pegar minha refeição antes que a cozinha fique lotada."
 ep3_laamp_flavour_ewan.0051.f:0 "Acho que vou ocupar meu lugar habitual ao redor do fogo."
 ep3_laamp_flavour_ewan.0051.g:0 "O treino noturno não espera por nenhum[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan]."
 ep3_laamp_flavour_ewan.0051.h:0 "Uma caminhada ao longo do perímetro soa agradável."
 ep3_laamp_flavour_ewan.0051.t:0 "Um Clamor Amigável"
 ep3_laamp_flavour_ewan.0061.a:0 "Que surpresa bem-vinda!"
 ep3_laamp_flavour_ewan.0061.b:0 "Talvez [Select_CString( local_merchant.IsFemale, 'a', 'o' )] [local_merchant.GetFirstNameNoTooltip] gostaria de um emprego..."
 ep3_laamp_flavour_ewan.0061.c:0 "Pegar alguns suprimentos enquanto estamos aqui."
 ep3_laamp_flavour_ewan.0061.d:0 "Acho que vou ficar no acampamento, mesmo assim."
 ep3_laamp_flavour_ewan.0061.desc:0 "Embora nem todo lugar receba um acampamento como o nosso, parece que [current_county.GetBaseNameNoTier] certamente o faz — ou pelo menos [Select_CString( local_merchant.IsFemale, 'a', 'o' )] [local_merchant.GetFirstName] fez parecer que sim, organizando uma feira improvisada para trocar bens e drenar os seguidores de suas moedas.\n\nCínico? Talvez, mas é difícil negar o sorriso que isso coloca nos rostos da maioria, e às vezes isso é o suficiente."
 ep3_laamp_flavour_ewan.0061.t:0 "Uma Feira Inesperada"
 ep3_laamp_flavour_ewan.0061.tt.everyone_loves_faires:0 "Todos amam feiras"
 ep3_laamp_flavour_ewan.0071.a:0 "Desacelere para [hanger.GetSheHe]."
 ep3_laamp_flavour_ewan.0071.b:0 "Rir da situação [hanger.GetHerHim]."
 ep3_laamp_flavour_ewan.0071.c:0 "Espancar o cavalo [hanger.GetHerHim] para acelerar."
 ep3_laamp_flavour_ewan.0071.d:0 "Cavalgar, deixando [hanger.GetSheHe] em sua miséria."
 ep3_laamp_flavour_ewan.0071.desc:0 "\"Ugggh, minha #EMP cabeça#!\" geme [Select_CString( hanger.IsFemale, 'a', 'o' )] [hanger.GetFirstName] enquanto [hanger.GetSheHe] cavalga ao meu lado. Levanto uma sobrancelha em inquérito silencioso à exclamativa d[Select_CString( hanger.IsFemale, 'a', 'o' )] [hanger.GetWomanMan].\n\nEm resposta, [hanger.GetFirstNameNoTooltip] simplesmente se afunda sobre seu cavalo, choramingando e segurando as têmporas.\n\nClaramente #EMP alguém#! teve uma boa noite na noite passada."
 ep3_laamp_flavour_ewan.0071.t:0 "Cavalos Batendo"
 ep3_laamp_flavour_ewan.1001.a:0 "Hah, corram então, vocês dois."
 ep3_laamp_flavour_ewan.1001.b:0 "Acho que você fez um amigo para a vida, m[Select_CString( own_child.IsFemale, 'inha', 'eu' )] [own_child.Custom('GetDaughterSon')]."
 ep3_laamp_flavour_ewan.1001.c:0 "[own_child.GetFirstNameNoTooltip], [other_child.GetSheHe] está abaixo de você."
 ep3_laamp_flavour_ewan.1001.desc:0 "\"[ROOT.Char.GetMotherFather|U], [ROOT.Char.GetMotherFather]!\" grita m[Select_CString( own_child.IsFemale, 'inha', 'eu' )] [own_child.Custom('GetDaughterSon')] enquanto [own_child.GetSheHe] corre até mim, \"Quero que você conheça alguém!\"\n\n[Select_CString( own_child.IsFemale, 'A', 'O' )] [own_child.Custom('GirlBoy')] se vira para apresentar outra criança, abrindo os braços como se estivesse apresentando o presente de [ROOT.Char.GetFaith.HighGodNamePossessive] aos fiéis, em vez de algo que parece um pobre desprivilegiado.\n\n\"Este é [Select_CString( other_child.IsFemale, 'a', 'o' )] [other_child.GetFirstName], m[Select_CString( other_child.IsFemale, 'inha', 'eu' )] nov[Select_CString( other_child.IsFemale, 'a', 'o' )] companheir[Select_CString( other_child.IsFemale, 'a', 'o' )] de brincadeiras. #EMP Algum dia#!, [other_child.GetSheHe] vai me ajudar a administrar este acampamento.\""
 ep3_laamp_flavour_ewan.1001.friendship_fizzles:0 "A amizade se desfaz"
 ep3_laamp_flavour_ewan.1001.set_best_friendship:0 "Nós contra o mundo"
 ep3_laamp_flavour_ewan.1001.set_friendship:0 "Uma amizade nasce"
 ep3_laamp_flavour_ewan.1001.set_hidden_potential_friendship:0 "Companheiro de brincadeiras favorito"
 ep3_laamp_flavour_ewan.1001.t:0 "Amigos em Lugares Baixos"
 ep3_laamp_flavour_ewan.1011.a:0 "Meu Segundo em Comando."
 ep3_laamp_flavour_ewan.1011.b:0 "Meu $quartermaster_camp_officer$."
 ep3_laamp_flavour_ewan.1011.c:0 "Meu $armorer_camp_officer$."
 ep3_laamp_flavour_ewan.1011.d:0 "Meu $chief_forager_camp_officer$."
 ep3_laamp_flavour_ewan.1011.desc:0 "[child.GetFirstName|U] está naquela idade em que a criança absorve tudo e qualquer coisa ao seu redor como uma esponja absorvendo água.\n\nEmbora as circunstâncias atuais me impeçam de dar a [child.GetSheHe] a melhor educação, [Select_CString( child.IsFemale, 'a', 'o' )] jovem [child.Custom('GetLassLad')] parece não estar menos ansios[Select_CString( child.IsFemale, 'a', 'o' )] para aprender por isso. Em vez de tutores e livros que alguém com mais... riqueza fixa poderia sentir-se no direito, [child.GetSheHe] perambula pelo acampamento, seguindo meus oficiais e ajudando-os com entusiasmo em suas tarefas.\n\nUm pequeno empurrão em direção a alguém específico provavelmente faria maravilhas para focar os esforços [child.GetHerHim]."
 ep3_laamp_flavour_ewan.1011.e:0 "Meu $master_thief_camp_officer$."
 ep3_laamp_flavour_ewan.1011.f:0 "Meu $head_porter_camp_officer$."
 ep3_laamp_flavour_ewan.1011.g:0 "Meu $head_groom_camp_officer$."
 ep3_laamp_flavour_ewan.1011.h:0 "Meu $huntperson_camp_officer$."
 ep3_laamp_flavour_ewan.1011.i:0 "Meu $kennelperson_camp_officer$."
 ep3_laamp_flavour_ewan.1011.j:0 "Meu $chief_engineer_camp_officer$."
 ep3_laamp_flavour_ewan.1011.k:0 "Meu $witness_camp_officer$."
 ep3_laamp_flavour_ewan.1011.l:0 "Meu $person_haggler_camp_officer$."
 ep3_laamp_flavour_ewan.1011.m:0 "Meu $camp_cook_camp_officer$."
 ep3_laamp_flavour_ewan.1011.n:0 "Meu $master_bard_camp_officer$."
 ep3_laamp_flavour_ewan.1011.o:0 "Meu $master_of_arms_camp_officer$."
 ep3_laamp_flavour_ewan.1011.p:0 "Meu $master_of_spoils_camp_officer$."
 ep3_laamp_flavour_ewan.1011.t:0 "Aprendendo pelo Exemplo"
 ep3_laamp_flavour_ewan.1021.a:0 "Suponho que poderíamos acomodar outra família..."
 ep3_laamp_flavour_ewan.1021.b:0 "Você vai parar de ver [crush_child.GetSheHe] neste instante!"
 ep3_laamp_flavour_ewan.1021.c.crush_endures:0 "paixão d[Select_CString( child.IsFemale, 'a', 'o' )] [child.GetFirstNamePossessiveNoTooltip] persiste"
 ep3_laamp_flavour_ewan.1021.c.crush_fades:0 "A paixão desvanece"
 ep3_laamp_flavour_ewan.1021.c:0 "Certamente é apenas uma paixão sazonal, você vai superar isso."
 ep3_laamp_flavour_ewan.1021.desc:0 "\"[ROOT.Char.Custom('StammerLetterMotherFather')|U]-[ROOT.Char.GetMotherFather], eu t-tenho um pedido\", balbucia m[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('GetDaughterSon')] [child.GetFirstName]. Atrás [child.GetHerHim], timidamente segurando a mão [Select_CString( child.IsFemale, 'da minha', 'do meu' )] [child.Custom('GirlBoy')], está um[Select_CString( crush_child.IsFemale, 'a', '' )] jovem magr[Select_CString( crush_child.IsFemale, 'a', 'o' )] da cultura [crush_child.GetCulture.GetName].\n\n\"Este é [Select_CString( crush_child.IsFemale, 'a', 'o' )] [crush_child.GetFirstName]. Eu g-gosto muito [crush_child.GetHerHim] e estava me perguntando, p-poderia [crush_child.GetSheHe] vir conosco? Seus pais também, [crush_child.GetSheHe] não pode deixá-los para trás!\""
 ep3_laamp_flavour_ewan.1021.t:0 "Amor à Primeira Vista no Acampamento"
 ep3_laamp_flavour_ewan.1031.a:0 "Ahhh, a vontade de viajar pegou '[child.Custom('GetErIm')]'."
 ep3_laamp_flavour_ewan.1031.b:0 "[child.GetSheHe|U] será um guerreiro algum dia."
 ep3_laamp_flavour_ewan.1031.c:0 "Tanta empolgação em um tão jovem!"
 ep3_laamp_flavour_ewan.1031.d:0 "Eu me pergunto quais lugares [child.GetSheHe] verá..."
 ep3_laamp_flavour_ewan.1031.desc.intro:0 "Dizem que as crianças reagem mais do que qualquer outra pessoa aos lugares em que se encontram.\n\nÉ sorte para m[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('GetDaughterSon')] [child.GetFirstName] então que [child.GetSheHe] se encontre na companhia dos mais"
 ep3_laamp_flavour_ewan.1031.desc.outro:0 "que consegui reunir.\n\nUm ótimo ambiente para um[Select_CString( child.IsFemale, 'a', '' )] [child.Custom('GirlBoy')] jovem crescer, e um onde [child.GetSheHe] parece decidid[Select_CString( child.IsFemale, 'a', 'o' )] a levar a sério suas muitas lições."
 ep3_laamp_flavour_ewan.1031.desc.purpose.brigands:0 "ladrões astutos, bandidos impiedosos e escória viciosa"
 ep3_laamp_flavour_ewan.1031.desc.purpose.explorers:0 "aventureiros ambiciosos, locais exóticos e viajantes robustos"
 ep3_laamp_flavour_ewan.1031.desc.purpose.legitimists:0 "leais determinados, guardas de elite e contratados valiosos"
 ep3_laamp_flavour_ewan.1031.desc.purpose.mercenaries:0 "resistentes $knight_culture_player_plural_no_tooltip$, ferozes mercenários e soldados obstinados"
 ep3_laamp_flavour_ewan.1031.desc.purpose.scholars:0 "eruditos sábios, diplomatas eloquentes e os melhores sábios"
 ep3_laamp_flavour_ewan.1031.desc.purpose.wanderers:0 "companheiros leais, conhecidos interessantes e criados prestativos"
 ep3_laamp_flavour_ewan.1031.e:0 "Essa atitude servirá bem a [child.GetSheHe]."
 ep3_laamp_flavour_ewan.1031.f:0 "Tal ambição é apenas natural."
 ep3_laamp_flavour_ewan.1031.g.tt.failure:0 "Suas lições foram ignoradas"
 ep3_laamp_flavour_ewan.1031.g.tt.success:0 "Você incutiu um pouco de sabedoria"
 ep3_laamp_flavour_ewan.1031.g:0 "Talvez pudéssemos considerar outro caminho?"
 ep3_laamp_flavour_ewan.1031.h:0 "*suspira* Pare com isso, [child.Custom('GirlBoy')]."
 ep3_laamp_flavour_ewan.1031.t:0 "Nutrindo"
 ep3_laamp_flavour_ewan.1031.tt.skill_gain:0 "Habilidade Ganha"
 ep3_laamp_flavour_ewan.1031.tt.trait_adopted:0 "Traço Ganho"
 ep3_laamp_flavour_ewan.1041.a.tt.diplomacy:0 "Histórias da Velha Pátria"
 ep3_laamp_flavour_ewan.1041.a.tt.learning:0 "$ep3_laamp_flavour_ewan.1041.a.tt.diplomacy$"
 ep3_laamp_flavour_ewan.1041.a.tt.stewardship:0 "$ep3_laamp_flavour_ewan.1041.a.tt.diplomacy$"
 ep3_laamp_flavour_ewan.1041.a:0 "Era linda, pequena."
 ep3_laamp_flavour_ewan.1041.b.tt.intrigue:0 "$ep3_laamp_flavour_ewan.1041.a.tt.diplomacy$"
 ep3_laamp_flavour_ewan.1041.b.tt.martial:0 "$ep3_laamp_flavour_ewan.1041.a.tt.diplomacy$"
 ep3_laamp_flavour_ewan.1041.b:0 "Um lugar horrível que nos desprezou."
 ep3_laamp_flavour_ewan.1041.c:0 "Algum dia, você conhecerá por si mesma."
 ep3_laamp_flavour_ewan.1041.d:0 "Talvez voltemos algum dia; pergunte-me então."
 ep3_laamp_flavour_ewan.1041.desc:0 "\"[ROOT.Char.GetMotherFather|U], como era a casa?\" pergunta m[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('GetDaughterSon')] [child.GetFirstName] durante o café da manhã.\n\nUm pouco atordoado com a pergunta repentina, eu vasculho minha tigela de mingau por um momento, recordando quando [memory.GetDescription].\n\nFaz anos agora... Suponho que seja natural para alguém tão jovem quanto [Select_CString( child.IsFemale, 'a', 'o' )] [child.GetFirstNameNoTooltip] querer saber como as coisas #EMP eram#!."
 ep3_laamp_flavour_ewan.1041.e:0 "Não vou falar sobre isso."
 ep3_laamp_flavour_ewan.1041.t:0 "A Velha Pátria"
 ep3_laamp_flavour_ewan.1051.a:0 "Venha aqui, m[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('GirlBoy')], ficará tudo bem."
 ep3_laamp_flavour_ewan.1051.b:0 "Justo? Você é um [child.GetHouse.GetNameNoTooltip]! Mantenha a postura!"
 ep3_laamp_flavour_ewan.1051.c:0 "Eu sei, mas é o que é."
 ep3_laamp_flavour_ewan.1051.d.tt.annoyance_fades:0 "Seu aborrecimento se desvanece com o tempo"
 ep3_laamp_flavour_ewan.1051.d.tt.grudge_held:0 "[child.GetFirstNameNoTooltip] guarda um rancor"
 ep3_laamp_flavour_ewan.1051.d:0 "Deixe [child.GetSheHe] ter seu ataque de raiva."
 ep3_laamp_flavour_ewan.1051.desc:0 "Grito de petulância d[Select_CString( child.IsFemale, 'a', 'o' )] [child.GetFirstNamePossessive|U] poderia acordar os mortos.\n\n\"Eu disse que #EMP não é justo#! De forma alguma! Por que #EMP temos#! que viver aqui fora, assim? Como se fôssemos apenas... animais, vagando de lugar para lugar, sem palácios, sem castelos, nem mesmo camas adequadas. Eu não pedi por essa #EMP pobreza#! e mereço melhor!\"\n\nAtravés dos gritos e da indignação, posso [ROOT.Char.Custom('SenseObserve_SenseSee')] perceber que a frustração [Select_CString( child.IsFemale, 'da minha', 'do meu' )] [child.Custom('GetDaughterSon')] é real. Lágrimas de raiva e tristeza rolam pelas bochechas [child.GetHerHim]."
 ep3_laamp_flavour_ewan.1051.t:0 "Não É Justo"
 ep3_laamp_flavour_ewan.1051.tt.failure:0 "[child.GetFirstNameNoTooltip] está inconsolável"
 ep3_laamp_flavour_ewan.1051.tt.success:0 "[child.GetFirstNameNoTooltip] se acalma"
 ep3_laamp_flavour_ewan.1061.a:0 "Hmm, [child.Custom('GirlBoy')] inteligente."
 ep3_laamp_flavour_ewan.1061.b.tt.failure:0 "Você tenta e falha"
 ep3_laamp_flavour_ewan.1061.b.tt.success:0 "Você aprende a língua juntos"
 ep3_laamp_flavour_ewan.1061.b:0 "Talvez [child.GetSheHe] possa me ensinar também..."
 ep3_laamp_flavour_ewan.1061.c:0 "Tire essa sujeira estrangeira da boca!"
 ep3_laamp_flavour_ewan.1061.desc:0 "Parece que nosso tempo em [current_county.GetBaseNameNoTier] tem sido benéfico para [Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('GetDaughterSon')] [child.GetFirstName].\n\nAlgo sobre a cultura local simplesmente #EMP fascina#! [child.GetSheHe], tanto que em nosso breve tempo aqui [child.GetSheHe] conseguiu aprender um [current_county.GetProvince.GetCulture.GetLanguage.GetName] razoável, uma conquista que [Select_CString( child.IsFemale, 'a', 'o' )] [child.Custom('GetLassLad')] está alardeando aos quatro ventos ao falar isso ao redor do acampamento constantemente, até mesmo inserindo pequenas palavras e frases nas conversas com seus inferiores.\n\nComportamento presunçoso, sem dúvida, mas talvez com boa razão."
 ep3_laamp_flavour_ewan.1061.t:0 "Aprendizagem Rápida"
 ep3_laamp_flavour_ewan.1071.a:0 "Fique à vista!"
 ep3_laamp_flavour_ewan.1071.b:0 "Vá em frente, explore."
 ep3_laamp_flavour_ewan.1071.c:0 "Crianças, animadas pelas coisas mais simples..."
 ep3_laamp_flavour_ewan.1071.desc.desert:0 "se lançando de uma alta duna, espalhando jatos de areia por toda parte. Risadinhas e espirros de #EMP ptth#!, #EMP ptth#! seguem sempre que uma criança acaba levando um pouco de areia na boca. O que acontece com frequência."
 ep3_laamp_flavour_ewan.1071.desc.desert_mountains:0 "$ep3_laamp_flavour_ewan.1071.desc.mountains$"
 ep3_laamp_flavour_ewan.1071.desc.drylands:0 "um animado jogo de pega-pega, levantando poeira e gritando de alegria ou indignação sempre que algum deles é pego."
 ep3_laamp_flavour_ewan.1071.desc.farmlands:0 "escalando uma árvore solitária e retorcida que se ergue torta no meio do campo de um fazendeiro. As crianças mais velhas chegaram muito mais alto, enquanto as mais novas brincam ao redor da base."
 ep3_laamp_flavour_ewan.1071.desc.floodplains:0 "uma batalha de bolas de lama tão tensa quanto qualquer confronto entre adultos. Certamente, ambos os lados parecem dispostos a dar suas vidas por... qualquer que seja a causa pela qual estão lutando."
 ep3_laamp_flavour_ewan.1071.desc.forest:0 "defendendo os galhos superiores de uma árvore contra várias crianças tentando escalar de baixo. Quando os que estão no chão começam a conseguir um apoio, os jovens no ar os atingem com gravetos, folhas e bolotas de seiva."
 ep3_laamp_flavour_ewan.1071.desc.hills:0 "rolando ferozmente, de ponta-cabeça, por uma colina gramada. Não parece haver muita habilidade envolvida, mas as crianças competem para ver quem consegue ir mais rápido."
 ep3_laamp_flavour_ewan.1071.desc.intro:0 "Meu caminho de volta de [ROOT.Char.Custom('GetRandomCampBuilding')] me leva perto da borda do acampamento, onde os gritos e clamores de crianças brincando chamam minha atenção.\n\nM[Select_CString( own_child.IsFemale, 'inha', 'eu' )] [own_child.Custom('GetDaughterSon')] [own_child.GetFirstName] está liderando várias outras em"
 ep3_laamp_flavour_ewan.1071.desc.jungle:0 "cutucando uma cobra morta com um graveto. O animal está claramente acabado, sua cabeça foi horrivelmente arrancada por algum outro predador, mas as crianças estão se divertindo sem fim tentando levantar seu corpo mole com seus gravetos, apenas para ele desabar novamente."
 ep3_laamp_flavour_ewan.1071.desc.mountains:0 "arremessando pequenas pedras e seixos de uma crista, vendo quão longe conseguem lançar seus pequenos projéteis nos vales abaixo. Elas gritam quando um deles vai mais longe do que os outros e riem daqueles que param onde ainda podem ser vistos."
 ep3_laamp_flavour_ewan.1071.desc.oasis:0 "construindo... pequenos pacotes de areia usando folhas e grama? Não está claro para que isso seria usado... outro criança se aproxima por trás de uma duna próxima, e de repente uma chuva de sacos de areia começa a voar como se fossem potes de fogo."
 ep3_laamp_flavour_ewan.1071.desc.outro:0 "\n\nDepois de um momento, [own_child.GetFirstNameNoTooltip] [own_child.Custom('Saying_3p_AwareSight')] de mim. [Select_CString( own_child.IsFemale, 'A', 'O' )] [own_child.Custom('GirlBoy')] sorri em minha direção, claramente indecis[Select_CString( own_child.IsFemale, 'a', 'o' )] entre levar seus amigos de volta ao acampamento ou se aventurar um pouco mais nas terras selvagens."
 ep3_laamp_flavour_ewan.1071.desc.plains:0 "uma carga de cavalaria simulada por um terreno plano, batendo pequenos gravetos e galhos em inimigos imaginários enquanto enviam um inimigo ilusório a fugir em medo."
 ep3_laamp_flavour_ewan.1071.desc.steppe:0 "o que parece ser um jogo bastante tenso de ossos. A cada lançamento, alguém anuncia uma nova regra, e os outros torcem ou aplaudem se aprovam ou não."
 ep3_laamp_flavour_ewan.1071.desc.taiga:0 "$ep3_laamp_flavour_ewan.1071.desc.forest$"
 ep3_laamp_flavour_ewan.1071.desc.wetlands:0 "criando uma ilha improvisada. Eles encontraram uma estreita saliência lamacenta cercada por águas salobras e estão progressivamente trabalhando para separá-la do resto do pântano com mãos sujas e gravetos podres."
 ep3_laamp_flavour_ewan.1071.t:0 "À Beira do Acampamento"
 ep3_laamp_flavour_ewan.1071.tt.every_playing_child:0 "Toda criança que está brincando"
 ep3_laamp_flavour_ewan.1081.a:0 "Hmm, tudo bem. Você é um[Select_CString( child.IsFemale, 'a', '' )] [child.GetWomanMan] agora."
 ep3_laamp_flavour_ewan.1081.b.f:0 "Você impõe um desafio [Select_CString( child.IsFemale, 'a', 'ao' )] [child.Custom('GetDaughterSon')], determinado pelo seu [education_trait|E]."
 ep3_laamp_flavour_ewan.1081.b.tt.failure:0 "[child.GetSheHe|U] não consegue impressioná-lo"
 ep3_laamp_flavour_ewan.1081.b.tt.success:0 "[child.GetFirstNameNoTooltip] triunfa"
 ep3_laamp_flavour_ewan.1081.b:0 "Quer? Ganhe isso."
 ep3_laamp_flavour_ewan.1081.c:0 "Bah, você é uma criança até eu dizer o contrário."
 ep3_laamp_flavour_ewan.1081.desc:0 "\"[ROOT.Char.GetMotherFather|U]\", começa m[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('GetDaughterSon')] [child.GetFirstName] enquanto [child.GetSheHe] se aproxima de mim, \"Decidi que, como agora sou um[Select_CString( child.IsFemale, 'a', '' )] [child.GetWomanMan], terei minha própria tenda. Nada de compartilhar com ninguém para mim!\"\n\nA juventude fica parada, o discurso terminado, a petulância transbordando da sua postura. Quase involuntariamente, eu levanto uma sobrancelha diante dessa exibição não provocada.\n\n\"Não vou ceder nisso! Sou um adulto e exijo ser tratad[Select_CString( child.IsFemale, 'a', 'o' )] como um adulto!\""
 ep3_laamp_flavour_ewan.1081.t:0 "Crescendo"
 ep3_laamp_flavour_ewan.1091.a:0 "Lembre-se, seja firme, mas respeitoso."
 ep3_laamp_flavour_ewan.1091.b:0 "Não tenha medo de estalar o chicote!"
 ep3_laamp_flavour_ewan.1091.c:0 "Domine o cavalo ou ele vai te jogar."
 ep3_laamp_flavour_ewan.1091.d.tt.failure:0 "[child.GetFirstNameNoTooltip] não consegue se virar sozinho"
 ep3_laamp_flavour_ewan.1091.d.tt.success:0 "[child.GetSheHe|U] se sai bem o suficiente"
 ep3_laamp_flavour_ewan.1091.d:0 "Não diga nada."
 ep3_laamp_flavour_ewan.1091.desc:0 "\"E não vai apenas me jogar fora?\" questiona m[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('GetDaughterSon')] [child.GetFirstName], tentando — e falhando — em manter o tremor da voz.\n\nOlho para o pequeno pônei em que [child.GetSheHe] está sentado: o mais fácil e mais plácido aprendiz que consegui encontrar em todo o acampamento. Eu estava tão assustado quando m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetMotherFather] me ensinou a montar?\n\n\"O-ok, então eu apenas a espeto para um trote e...\""
 ep3_laamp_flavour_ewan.1091.t:0 "Dever de Todo Pai"
 ep3_laamp_flavour_ewan.1091.tt.failure:0 "Não-não-não-não-NÃO!"
 ep3_laamp_flavour_ewan.1091.tt.success:0 "Estou fazendo isso, [ROOT.Char.Custom('GetMumDad')], estou fazendo isso!"
 ep3_laamp_flavour_ewan.1101.a:0 "O que você está fazendo aí, pequen[Select_CString( child.IsFemale, 'a', 'o' )] [child.Custom('GetLassLad')]?"
 ep3_laamp_flavour_ewan.1101.b:0 "Saia, você ameaça!"
 ep3_laamp_flavour_ewan.1101.desc:0 "Mesmo que o acampamento precise mudar de lugar a cada poucos dias, algumas viagens implicam em transições mais longas — e, com elas, definitivamente mais embalagens.\n\nCom a maioria dos meus carregadores ocupados lidando com as consequências de uma festa na noite passada, sou deixado para embalar a maioria das minhas coisas por conta própria. Uma situação lamentável, e uma que já me rendeu mais do que alguns suspiros.\n\nUm puxão repentino em minha manga me alerta para a presença [Select_CString( child.IsFemale, 'da minha', 'do meu' )] jovem [child.Custom('GetDaughterSon')] [child.GetFirstName], segurando uma túnica amontoada em uma tentativa pobre de me ajudar."
 ep3_laamp_flavour_ewan.1101.t:0 "Ajudando"
 ep3_laamp_flavour_ewan.1103.a:0 "Uhh, obrigad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [child.GetFirstNameNoTooltip], agora vá se limpar."
 ep3_laamp_flavour_ewan.1103.b:0 "Bagunce o cabelo [child.GetHerHim]."
 ep3_laamp_flavour_ewan.1103.c:0 "Útil como sempre!"
 ep3_laamp_flavour_ewan.1103.d:0 "Ria e abrace [Select_CString( child.IsFemale, 'a', 'o' )] [child.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.1103.desc.child_adult:0 "M[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('GetDaughterSon')] [child.GetFirstName] entra na minha tenda esta noite para me encontrar já embalando para a jornada de amanhã, embora claramente indo um pouco mais devagar por causa [child.GetHerHim].\n\n[child.GetSheHe|U] não diz nada enquanto [child.GetSheHe] se move para me ajudar a organizar meu equipamento, simplesmente sorrindo suavemente e cantando uma melodia familiar enquanto [child.GetSheHe] trabalha.\n\n\"Você não está um pouco velho para isso agora?\" eu pergunto.\n\n\"Nunca se é velho demais para ajudar um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] velh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] em necessidade\", resmunga [Select_CString( child.IsFemale, 'a', 'o' )] [child.GetFirstNameNoTooltip] de volta."
 ep3_laamp_flavour_ewan.1103.desc.child_older:0 "Ao entrar na minha tenda antes da mudança de amanhã, não me surpreendo ao encontrar m[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('GetDaughterSon')] [child.GetFirstName] aqui já.\n\nAo lado [child.GetHerHim] na minha cama está uma pilha de roupas dobradas e efeitos pessoais empilhados de maneira grosseira, e [child.GetSheHe] se vira orgulhosamente para me mostrar seu trabalho.\n\n\"Tudo organizado como você gosta, [child.Custom('GetMumDad')], quase pela metade!\""
 ep3_laamp_flavour_ewan.1103.desc.child_teen:0 "Mesmo que [child.GetSheHe] esteja quase um[Select_CString( child.IsFemale, 'a', '' )] [child.GetWomanMan] agora, uma viagem longa significa minha visita habitual [Select_CString( child.IsFemale, 'da minha', 'do meu' )] [child.Custom('GetDaughterSon')] [child.GetFirstName] para ajudar a embalar.\n\nDesta vez, pelo menos, eu cheguei antes [child.GetHerHim], e já havia começado quando o adolescente chegou.\n\n\"Você poderia ter esperado por mim!\" meio geme, meio brincando [Select_CString( child.IsFemale, 'a', 'o' )] [child.GetFirstNameNoTooltip]. Minha risada zombeteira provoca um grito de indignação, e o próximo item de roupa dobrada é jogado direto na minha cabeça em vez de no cesto."
 ep3_laamp_flavour_ewan.1103.desc.child_younger:0 "Com outra mudança amanhã e meus carregadores mais uma vez ocupados, entro em meus aposentos pessoais para encontrar m[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('GetDaughterSon')] [child.GetFirstName], coberto de [ROOT.Char.Custom('GritType')] de brincar lá fora, tentando embalar minhas coisas por mim.\n\n\"[child.Custom('GetMaMaPaPa')|U]!\" sorri [Select_CString( child.IsFemale, 'a', 'o' )] [child.Custom('GirlBoy')], correndo em direção a um abraço. Uma única mão suja segura a forma amassada e arruinada do meu chapéu favorito."
 ep3_laamp_flavour_ewan.1103.e:0 "Você deveria parar de fazer isso, [child.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.1103.t:0 "$ep3_laamp_flavour_ewan.1101.t$: Rituais Pessoais"
 ep3_laamp_flavour_ewan.1104.a:0 "O que eu fiz..."
 ep3_laamp_flavour_ewan.1104.b:0 "Eu terei minha vingança!"
 ep3_laamp_flavour_ewan.1104.c:0 "#EMP Eh.#!"
 ep3_laamp_flavour_ewan.1104.d:0 "Tente seguir em frente."
 ep3_laamp_flavour_ewan.1104.desc.child_dead:0 "A mudança da manhã parece tão... sombria. Há um peso indefinível, uma ausência que não consigo identificar de imediato enquanto lentamente embalo minhas coisas.\n\nMe atinge como um balde de água gelada.\n\n[child.GetFirstName|U]. [child.GetSheHe|U] não está aqui, não me ajudando. [child.GetSheHe|U] nunca mais estará."
 ep3_laamp_flavour_ewan.1104.desc.child_rival:0 "Não é um trabalho árduo, ter que embalar minhas próprias coisas para a mudança de amanhã, mas um suspiro triste escapa de meus lábios, mesmo assim.\n\nFazer isso me lembra [Select_CString( child.IsFemale, 'da minha', 'do meu' )] [child.Custom('GetDaughterSon')] [child.GetFirstName], de tempos mais felizes quando [Select_CString( child.IsFemale, 'a', 'o' )] [child.Custom('GirlBoy')] era jovem e não queria nada mais do que passar tempo com s[Select_CString( child.IsFemale, 'ua', 'eu' )] [child.Custom('GetMaPa')].\n\nNa época em que [child.GetSheHe] ainda falava comigo, ainda sorria para mim.\n\nAquele sorriso dentuço..."
 ep3_laamp_flavour_ewan.1104.t:0 "$ep3_laamp_flavour_ewan.1101.t$: As Pequenas Ausências"
 ep3_laamp_flavour_ewan.1111.a:0 "Um[Select_CString( child.IsFemale, 'a', '' )] [child.Custom('GirlBoy')] e seu cachorro."
 ep3_laamp_flavour_ewan.1111.b:0 "Afogue o filhote."
 ep3_laamp_flavour_ewan.1111.c:0 "#EMP Meu#!, que cão gordinho. Boa descoberta, [child.Custom('GetLassLad')]!"
 ep3_laamp_flavour_ewan.1111.d:0 "[child.GetFirstNameNoTooltip]! Pare de brincar com aquele vira-lata imundo!"
 ep3_laamp_flavour_ewan.1111.desc.has_kennels:0 "Certamente não é um dos cães do canil, e,"
 ep3_laamp_flavour_ewan.1111.desc.intro:0 "\"[ROOT.Char.GetMotherFather|U]!\" grita m[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('GetDaughterSon')] [child.GetFirstName], correndo até mim rapidamente e quase me derrubando, \"olha o que eu encontrei! É um CACHORRINHO!\"\n\n[Select_CString( child.IsFemale, 'A', 'O' )] [child.Custom('GirlBoy')] parece, de fato, estar quase balançando um filhote recém-nascido que [child.GetSheHe] colocou em seu braço."
 ep3_laamp_flavour_ewan.1111.desc.no_kennels:0 "[ROOT.Char.GetFaith.KnowledgeGodName] sabe onde [child.GetSheHe] o pegou, mas,"
 ep3_laamp_flavour_ewan.1111.desc.outro:0 "apesar do movimento desajeitado, o animal parece muito animado por estar aqui. [child.GetFirstNameNoTooltip] parece mais feliz do que eu a vi em semanas."
 ep3_laamp_flavour_ewan.1111.t:0 "Um Nariz Para Problemas"
 ep3_laamp_flavour_ewan.2001.a.tt.failure:0 "Líder opressivo"
 ep3_laamp_flavour_ewan.2001.a.tt.success:0 "Uma amizade floresce"
 ep3_laamp_flavour_ewan.2001.a:0 "Incentive a amizade."
 ep3_laamp_flavour_ewan.2001.b.tt.failure:0 "$ep3_laamp_flavour_ewan.2001.a.tt.failure$"
 ep3_laamp_flavour_ewan.2001.b.tt.success:0 "Uma amizade arruinada"
 ep3_laamp_flavour_ewan.2001.b:0 "Tente separá-los."
 ep3_laamp_flavour_ewan.2001.c:0 "Bom para eles!"
 ep3_laamp_flavour_ewan.2001.desc.ambitious:0 "ganhos futuros e planos elaborados"
 ep3_laamp_flavour_ewan.2001.desc.arbitrary:0 "desconsiderando regras e regulamentos que se tornam inconvenientes para eles"
 ep3_laamp_flavour_ewan.2001.desc.arrogant:0 "sua própria alegada superioridade"
 ep3_laamp_flavour_ewan.2001.desc.brave:0 "enfrentando desafios — e desafiadores — de frente, não importa os riscos"
 ep3_laamp_flavour_ewan.2001.desc.callous:0 "sendo tão áspero com os outros quanto a vida foi com eles"
 ep3_laamp_flavour_ewan.2001.desc.calm:0 "manter-se ereto e calmo diante da adversidade"
 ep3_laamp_flavour_ewan.2001.desc.chaste:0 "restrição física e castidade pública"
 ep3_laamp_flavour_ewan.2001.desc.compassionate:0 "permanecendo cuidadoso e empático em quaisquer circunstâncias"
 ep3_laamp_flavour_ewan.2001.desc.content:0 "mantendo-se feliz com sua modesta condição na vida"
 ep3_laamp_flavour_ewan.2001.desc.craven:0 "viver para lutar outro dia, não importa o que,"
 ep3_laamp_flavour_ewan.2001.desc.cynical:0 "uma perspectiva decididamente terrena sobre a vida"
 ep3_laamp_flavour_ewan.2001.desc.deceitful:0 "contar mentiras cada vez mais grandiosas"
 ep3_laamp_flavour_ewan.2001.desc.diligent:0 "acordar cedo e trabalhar com dedicação"
 ep3_laamp_flavour_ewan.2001.desc.eccentric:0 "o estranho, o bizarro e o downright-bizarre"
 ep3_laamp_flavour_ewan.2001.desc.fickle:0 "tendo opiniões que mudam radicalmente de um dia para o outro"
 ep3_laamp_flavour_ewan.2001.desc.forgiving:0 "deixando de lado seus ódios e perdoando seus transgressores"
 ep3_laamp_flavour_ewan.2001.desc.generous:0 "os benefícios de um espírito generoso e uma vida altruísta"
 ep3_laamp_flavour_ewan.2001.desc.gluttonous:0 "boa comida e bebida melhor"
 ep3_laamp_flavour_ewan.2001.desc.greedy:0 "ouro, prata e a aquisição de riqueza"
 ep3_laamp_flavour_ewan.2001.desc.gregarious:0 "o clamor constante e as risadas dos eternamente sociáveis"
 ep3_laamp_flavour_ewan.2001.desc.honest:0 "evitar os perigos de mentir a todo custo"
 ep3_laamp_flavour_ewan.2001.desc.humble:0 "os benefícios de uma atitude modesta e uma perspectiva humilde"
 ep3_laamp_flavour_ewan.2001.desc.impatient:0 "agir enquanto o ferro está quente, sempre,"
 ep3_laamp_flavour_ewan.2001.desc.intro:0 "A vida em estreita convivência tende a magnificar relacionamentos, bons e maus.\n\nFelizmente para [Select_CString( follower_1.IsFemale, 'a', 'o' )] [follower_1.GetFirstName] e [Select_CString( follower_2.IsFemale, 'a', 'o' )] [follower_2.GetFirstName], seu interesse comum em"
 ep3_laamp_flavour_ewan.2001.desc.just:0 "obedecendo às leis devidamente estabelecidas do país, de fato, de qualquer país,"
 ep3_laamp_flavour_ewan.2001.desc.lazy:0 "os males do trabalho duro e os benefícios de uma boa soneca"
 ep3_laamp_flavour_ewan.2001.desc.lustful:0 "piadas obscenas e comentários lascivos"
 ep3_laamp_flavour_ewan.2001.desc.outro:0 "se provou ser um forte agente de união.\n\nOs dois rindo e brincando juntos no acampamento e cavalgando lado a lado na estrada estão se tornando uma visão cada vez mais comum."
 ep3_laamp_flavour_ewan.2001.desc.paranoid:0 "impedindo que os muitos planos de seus inimigos se concretizem"
 ep3_laamp_flavour_ewan.2001.desc.patient:0 "ouvir um ao outro e esperar pelo momento oportuno"
 ep3_laamp_flavour_ewan.2001.desc.sadistic:0 "humor maligno e o lado mais sombrio da vida"
 ep3_laamp_flavour_ewan.2001.desc.shy:0 "evitando situações sociais barulhentas e apreciando o silêncio"
 ep3_laamp_flavour_ewan.2001.desc.stubborn:0 "mantendo-se firme em sua posição a qualquer custo"
 ep3_laamp_flavour_ewan.2001.desc.temperate:0 "uma dieta moderada e uma vida saudável"
 ep3_laamp_flavour_ewan.2001.desc.trusting:0 "evitando todas as complexidades de intriga e suspeita"
 ep3_laamp_flavour_ewan.2001.desc.vengeful:0 "guardando cada e toda ofensa que os aflige"
 ep3_laamp_flavour_ewan.2001.desc.wrathful:0 "violência e a arte de gritar"
 ep3_laamp_flavour_ewan.2001.desc.zealous:0 "devotando-se completamente a [follower_1.GetFaith.HighGodName]"
 ep3_laamp_flavour_ewan.2001.t:0 "Muito em Comum"
 ep3_laamp_flavour_ewan.2011.a.tt.explanation:0 "Se os rumores forem falsos, então você não encontrará nada mesmo se tiver sucesso"
 ep3_laamp_flavour_ewan.2011.a.tt.failure:0 "Quem pode dizer o que é verdade?"
 ep3_laamp_flavour_ewan.2011.a.tt.success:0 "Você persegue o assunto com sucesso"
 ep3_laamp_flavour_ewan.2011.a:0 "Investigue a verdade do assunto."
 ep3_laamp_flavour_ewan.2011.b:0 "Concorde com as acusações sem fundamento."
 ep3_laamp_flavour_ewan.2011.c:0 "Deixe como está."
 ep3_laamp_flavour_ewan.2011.desc.affair:0 "são sobre um suposto caso de algum tipo, embora #EMP quem#! os parceiros infiéis possam ser seja uma questão de debate pseudo-acadêmico e ocasionalmente de risadas ruidosas."
 ep3_laamp_flavour_ewan.2011.desc.cruel_pranks:0 "dizem respeito a uma sequência particularmente cruel de má sorte para [Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetFirstName]. Acidentes infelizes, desagradáveis ou embaraçosos continuam #EMP acontecendo#! com [Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetWomanMan], e a boca do povo diz que isso pode ser deliberado."
 ep3_laamp_flavour_ewan.2011.desc.hidden_feud:0 "sugerem que duas pessoas entre nosso grupo estão travando uma guerra privada uma contra a outra, mas ambas mantêm isso em segredo para evitar que sua indisciplina seja descoberta e punida."
 ep3_laamp_flavour_ewan.2011.desc.intro:0 "Não é incomum ouvir rumores circulando por este — ou de fato, qualquer — acampamento. Noções lascivos e sussurros de escândalos podem passar muitas longas noites, afinal. Às vezes, eles são até verdadeiros.\n\nAs fofocas desta semana"
 ep3_laamp_flavour_ewan.2011.desc.nasty_rumours:0 "são um paradoxo: há muito papo sobre os hábitos pouco saudáveis d[Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetFirstName], mas várias pessoas afirmam sentir um cheiro de traição, argumentando que [victim.GetSheHe] é simplesmente a vítima de uma campanha difamatória."
 ep3_laamp_flavour_ewan.2011.desc.outro:0 "\n\nNão é uma coisa gentil para as pessoas dizerem apenas para entretenimento, mas então, fofocas raramente são."
 ep3_laamp_flavour_ewan.2011.desc.petty_theft:0 "relacionam-se [Select_CString( victim.IsFemale, 'a', 'ao' )] [victim.GetFirstName], que supostamente perdeu pequenas quantias de dinheiro várias vezes ultimamente. Pelo menos algumas pessoas afirmam ter visto uma figura espreitando perto da tenda [victim.GetHerHim], mirando deliberadamente [Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetWomanMan]."
 ep3_laamp_flavour_ewan.2011.t:0 "Fofocas do Acampamento"
 ep3_laamp_flavour_ewan.2012.a:0 "Revele imediatamente."
 ep3_laamp_flavour_ewan.2012.b:0 "Mantenha o segredo — por enquanto."
 ep3_laamp_flavour_ewan.2012.desc:0 "Investigações habilidosas de um investigador competente sempre trazem frutos.\n\nAo encontrar [Select_CString( lover_1.IsFemale, 'a', 'o' )] [lover_1.GetFirstName] e [Select_CString( lover_2.IsFemale, 'a', 'o' )] [lover_2.GetFirstName], envolvidos em um #EMP abraço íntimo#! nas sombras atrás de [ROOT.Char.Custom('GetRandomCampBuilding')], consigo ficar por escassos momentos antes que os dois reconheçam minha presença e corram para arrumar suas roupas.\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip], por favor, estou implorando\", sussurra [Select_CString( lover.IsFemale, 'a', 'o' )] [lover.GetFirstNameNoTooltip], \"não nos revele para o acampamento — os outros não vão entender.\""
 ep3_laamp_flavour_ewan.2012.t:0 "$ep3_laamp_flavour_ewan.2011.t$: Amantes Secretos"
 ep3_laamp_flavour_ewan.2013.a:0 "Puna [Select_CString( thief.IsFemale, 'a', 'o' )] [thief.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.2013.b:0 "Cubra [Select_CString( thief.IsFemale, 'a', 'o' )] [thief.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.2013.c:0 "Deixe a verdade ser conhecida, mas pare por aí."
 ep3_laamp_flavour_ewan.2013.desc:0 "Uma armadilha simples é tudo o que leva para pegar [Select_CString( thief.IsFemale, 'a', 'o' )] [thief.GetFirstName] em flagrante — fazer com que [Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetFirstName] saia conspicuamente de sua tenda, com a entrada aberta, moedas empilhadas neatmente em um banquinho dentro.\n\nApós um minuto para ter certeza de que [Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetFirstNameNoTooltip] não retornaria imediatamente, o ladrão saiu de seu esconderijo próximo, apenas para se virar e encontrar-me de pé ali, [ROOT.Char.Custom('ArmArms')] cruzados.\n\n\"Eu- eu juro que não é o que parece! Eu apenas estava fazendo uma brincadeira com [Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetFirstNameNoTooltip]!\" [thief.GetSheHe] clama. Um escárnio audível d[Select_CString( victim.IsFemale, 'a', 'o' )] retornad[Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetFirstNameNoTooltip] indica que [victim.GetSheHe] não vê muita graça na situação."
 ep3_laamp_flavour_ewan.2013.t:0 "$ep3_laamp_flavour_ewan.2011.t$: Roubo Mesquinho"
 ep3_laamp_flavour_ewan.2014.a:0 "Puna [Select_CString( prankster.IsFemale, 'a', 'o' )] [prankster.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.2014.b:0 "Cubra [Select_CString( prankster.IsFemale, 'a', 'o' )] [prankster.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.2014.c:0 "Deixe a verdade ser conhecida, mas pare por aí."
 ep3_laamp_flavour_ewan.2014.desc:0 "Com apenas um pouco de questionamento, [prankster.GetFirstName] aparece como [Select_CString( prankster.IsFemale, 'a', 'o' )] perpetrador[Select_CString( prankster.IsFemale, 'a', '' )] mais óbvi[Select_CString( prankster.IsFemale, 'a', 'o' )] — [prankster.GetSheHe] foi visto próximo antes, depois ou durante quase todos os #EMP acidentes notáveis#!, geralmente sem muita razão.\n\n\"Sim, eu fiz algumas brincadeiras com [Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetFirstName]. Isso é tão errado? [victim.GetSheHe|U] é uma miséria de se estar por perto, e na última verificação a piada estranha não era motivo para fazer de alguém um fora da lei.\""
 ep3_laamp_flavour_ewan.2014.t:0 "$ep3_laamp_flavour_ewan.2011.t$: Brincadeiras Cruéis"
 ep3_laamp_flavour_ewan.2015.a:0 "Puna [Select_CString( rumourmonger.IsFemale, 'a', 'o' )] [rumourmonger.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.2015.b:0 "Cubra [Select_CString( rumourmonger.IsFemale, 'a', 'o' )] [rumourmonger.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.2015.c:0 "Deixe a verdade ser conhecida, mas pare por aí."
 ep3_laamp_flavour_ewan.2015.desc:0 "Não demora muito até que eu consiga facilmente apontar o dedo para [Select_CString( rumourmonger.IsFemale, 'a', 'o' )] [rumourmonger.GetFirstName], e quando confrontado sobre o assunto, [rumourmonger.GetSheHe] admite prontamente, sem remorso.\n\n\"E daí se eu exagerei uma ou duas coisas sobre aquel[Select_CString( victim.IsFemale, 'a', 'e' )] [victim.Custom2('InsultNoun', SCOPE.sC('rumourmonger'))] pompos[Select_CString( victim.IsFemale, 'a', 'o' )]. [victim.GetSheHe|U] é um tolo e um canalha, e não há mentira sobre [victim.GetSheHe] pior do que a verdade.\"\n\nUm[Select_CString( victim.IsFemale, 'a', '' )] [victim.GetFirstName] enfurecid[Select_CString( victim.IsFemale, 'a', 'o' )] brada atrás de mim, prestes a estrangular [Select_CString( rumourmonger.IsFemale, 'a', 'o' )] [rumourmonger.GetWomanMan]."
 ep3_laamp_flavour_ewan.2015.t:0 "$ep3_laamp_flavour_ewan.2011.t$: Fofqueiro"
 ep3_laamp_flavour_ewan.2016.a.tt.failure:0 "Apenas piorando a situação"
 ep3_laamp_flavour_ewan.2016.a.tt.success:0 "As tensões diminuem"
 ep3_laamp_flavour_ewan.2016.a:0 "Tente reconciliar os dois."
 ep3_laamp_flavour_ewan.2016.b:0 "Você não permitirá que isso se espalhe, entendido?"
 ep3_laamp_flavour_ewan.2016.desc:0 "Em retrospecto, talvez devesse ter sido óbvio que [Select_CString( rival_1.IsFemale, 'a', 'o' )] [rival_1.GetFirstName] e [Select_CString( rival_2.IsFemale, 'a', 'o' )] [rival_2.GetFirstName] estavam se atacando.\n\nQuando você os procura, os sinais de animosidade entre os dois são claros como o dia, mesmo que, quando convocados para interrogatório, ambos #EMP insistem#! que não deixaram isso afetar o acampamento mais amplo.\n\nEm espaços tão apertados como estes, a história soa #EMP improvável#!."
 ep3_laamp_flavour_ewan.2016.t:0 "$ep3_laamp_flavour_ewan.2011.t$: Conflito Oculto"
 ep3_laamp_flavour_ewan.2017.a:0 "Estou satisfeito, pelo menos."
 ep3_laamp_flavour_ewan.2017.b:0 "Eu não estava interessado de qualquer forma..."
 ep3_laamp_flavour_ewan.2017.desc.affair:0 "Por todas as grandes histórias de casos, romances sob a luz da lua atrás de [ROOT.Char.Custom('GetRandomCampBuilding')] e olhares furtivos compartilhados durante o jantar, o amor em [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] parece... decididamente ortodoxo."
 ep3_laamp_flavour_ewan.2017.desc.cruel_pranks:0 "Sou forçado a concluir que [Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetFirstName] é apenas desajeitad[Select_CString( victim.IsFemale, 'a', 'o' )], azarad[Select_CString( victim.IsFemale, 'a', 'o' )], ou ambos. Não há uma rima ou razão comum para os muitos pequenos problemas [victim.GetHerHim], e não há um suspeito claro que possa ter gerido todos eles."
 ep3_laamp_flavour_ewan.2017.desc.duel.lost:0 "\n\nFiz o meu melhor, mas tudo o que descobri foram mais rumores e boatos.\n\nAs pessoas notam quando [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip] está bisbilhotando, eu suponho, e isso, por sua vez, excita mais comentários infundados."
 ep3_laamp_flavour_ewan.2017.desc.duel.won:0 "\n\nMinha investigação minuciosa não trouxe nada, mas estou satisfeito assim mesmo. Se houvesse algo para encontrar, eu já teria encontrado."
 ep3_laamp_flavour_ewan.2017.desc.hidden_feud:0 "Conflito secreto? A ideia de que duas pessoas aqui poderiam manter sua raiva durante o jantar, sem mencionar secretamente enquanto se incomodam uma à outra, é completamente risível. Não com o desfile de mímicos com quem viajo."
 ep3_laamp_flavour_ewan.2017.desc.nasty_rumours:0 "[victim.GetFirstName|U] pode ser o elemento problemático afinal. Cada pista sobre quem poderia desejar mal a [victim.GetSheHe] se dissipa após uma inspeção mais próxima, enquanto as histórias das faltas [victim.GetHerHim] só aumentam."
 ep3_laamp_flavour_ewan.2017.desc.petty_theft:0 "Apesar dos gritos d[Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetFirstNamePossessive] em contrapartida, nenhuma testemunha credível pode nomear quaisquer características comuns da figura misteriosa supostamente roubando [victim.GetSheHe] às cegas, e mesmo [victim.GetSheHe] luta para somar suas perdas."
 ep3_laamp_flavour_ewan.2017.t:0 "$ep3_laamp_flavour_ewan.2011.t$: Nada para Ver Aqui"
 ep3_laamp_flavour_ewan.2021.a:0 "Permita a união."
 ep3_laamp_flavour_ewan.2021.b:0 "Permita, mas não autorize nenhuma cerimônia formal."
 ep3_laamp_flavour_ewan.2021.c.tt:0 "Instruir amantes a simplesmente parar de se ver raramente é totalmente eficaz."
 ep3_laamp_flavour_ewan.2021.c:0 "Proíba-os."
 ep3_laamp_flavour_ewan.2021.desc:0 "Como [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip] deste acampamento, quando dois dos meus seguidores mais notáveis desejam se casar, é meu direito ter a palavra final. Afinal, eles vivem sob minha proteção, viajam em meus animais e quebram meu pão.\n\nO casal esperançoso de hoje é [Select_CString( follower_1.IsFemale, 'a', 'o' )] [follower_1.GetFirstName] e [Select_CString( follower_2.IsFemale, 'a', 'o' )] [follower_2.GetFirstName], e com tudo mais em ordem, eles apenas aguardam que eu acene minha permissão — ou sinalize minha recusa."
 ep3_laamp_flavour_ewan.2021.t:0 "Amarrados Juntos"
 ep3_laamp_flavour_ewan.2031.a.tt.failure:0 "Palavras inúteis de um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] inútil"
 ep3_laamp_flavour_ewan.2031.a.tt.success:0 "Você acalma o descontentamento"
 ep3_laamp_flavour_ewan.2031.a:0 "Talvez eu possa persuadi-los..."
 ep3_laamp_flavour_ewan.2031.b:0 "Vocês não estão indo a lugar algum, coloquem [firebrand.GetSheHe] em grilhões!"
 ep3_laamp_flavour_ewan.2031.c.tt.failure:0 "Sua arrogância forma muitas opiniões"
 ep3_laamp_flavour_ewan.2031.c.tt.success:0 "Você enfrenta [firebrand.GetSheHe] com firmeza"
 ep3_laamp_flavour_ewan.2031.c:0 "Saia se quiser, mas levará nada e ninguém."
 ep3_laamp_flavour_ewan.2031.d.multi:0 "Vão então, todos vocês."
 ep3_laamp_flavour_ewan.2031.d.solo:0 "Saia então."
 ep3_laamp_flavour_ewan.2031.desc.intro:0 "\"... e seus discursos chorosos, seus desfiles de morte a lugar nenhum, e seu completo fracasso em fornecer como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip]! Você me ouve? Eu estou #EMP cansad[Select_CString( firebrand.IsFemale, 'a', 'o' )]#!\" grita [Select_CString( firebrand.IsFemale, 'a', 'o' )] [firebrand.GetFirstName], braços agitando-se descontroladamente enquanto [firebrand.GetSheHe] gesticula para uma multidão de espectadores.\n\n"
 ep3_laamp_flavour_ewan.2031.desc.waverers.none:0 "O restante dos meus seguidores parece insensível. Apesar de todo o seu descontentamento sobre meus males, [firebrand.GetFirstNameNoTooltip] está sozinh[Select_CString( firebrand.IsFemale, 'a', 'o' )] em tal intenso desgosto por mim."
 ep3_laamp_flavour_ewan.2031.desc.waverers.some:0 "Muitos dos meus outros seguidores também exibem expressões descontentes, aparentemente prontos para sair junto com [Select_CString( firebrand.IsFemale, 'a', 'o' )] [firebrand.GetFirstNameNoTooltip] — #EMP se#! [firebrand.GetSheHe] for permitido."
 ep3_laamp_flavour_ewan.2031.t:0 "Cansado de Você"
 ep3_laamp_flavour_ewan.2031.tt.failure.wavering_courtiers_move_to_pool:0 "$ep3_laamp_flavour_ewan.2031.tt.success.wavering_courtiers$"
 ep3_laamp_flavour_ewan.2031.tt.success.wavering_courtiers:0 "Todos os [followers|E] hesitantes"
 ep3_laamp_flavour_ewan.2041.a.tt.failure:0 "O coração quer o que quer"
 ep3_laamp_flavour_ewan.2041.a.tt.success:0 "Um amor murchou"
 ep3_laamp_flavour_ewan.2041.a:0 "Separe-os."
 ep3_laamp_flavour_ewan.2041.b:0 "Não é realmente da minha conta."
 ep3_laamp_flavour_ewan.2041.desc:0 "Entre o caos de locais em movimento regular e a chegada e saída de rostos novos a cada cidade, há muito tempo no dia para que os seguidores descubram que têm uma conexão inesperada com alguém novo e inesperado.\n\nA julgar pelas piadas internas compartilhadas, sussurros trocados e fugas ocasionais e pouco sutis, esse parece ser o caso d[Select_CString( follower_1.IsFemale, 'a', 'o' )] [follower_1.GetFirstName] e [Select_CString( follower_2.IsFemale, 'a', 'o' )] [follower_2.GetFirstName].\n\nClaramente, os dois pombinhos se acham furtivos. Não são."
 ep3_laamp_flavour_ewan.2041.t:0 "Espaços Mais Próximos"
 ep3_laamp_flavour_ewan.2051.a.athletic:0 "Suor regular requer banhos regulares, droga."
 ep3_laamp_flavour_ewan.2051.a.diligent_and_humble:0 "Esta não é uma tarefa pequena a ser pulada."
 ep3_laamp_flavour_ewan.2051.a.gregarious:0 "Droga, pense nos outros!"
 ep3_laamp_flavour_ewan.2051.a.lazy:0 "Sua preguiça vai longe demais!"
 ep3_laamp_flavour_ewan.2051.b:0 "Você faz um bom ponto."
 ep3_laamp_flavour_ewan.2051.c:0 "Simplesmente siga em frente — #EMP bem#! à frente."
 ep3_laamp_flavour_ewan.2051.desc.athletic:0 "Passo meus dias caminhando, correndo ou montando, tudo pelo bem do acampamento, assim é apenas natural que eu exale um pouco de #EMP almíscar#!, dado tudo que faço por aqui. É realmente tão errado abandonar as pretensões de tudo isso?"
 ep3_laamp_flavour_ewan.2051.desc.diligent_and_humble:0 "Bem o oposto! Eu sou um[Select_CString( smelly.IsFemale, 'a', '' )] [smelly.GetWomanMan] simples, dedicad[Select_CString( smelly.IsFemale, 'a', 'o' )] às minhas tarefas, e há apenas tanto tempo no dia. Por que se preocupar em limpar quando a poeira da estrada de amanhã estará sobre mim de qualquer forma?"
 ep3_laamp_flavour_ewan.2051.desc.gregarious:0 "Sou a vida de toda festa e popular entre todos, desde o círculo interno até o seguidor menos importante, pelo menos eu acho que sou, o que me torna crítico para a moral. Realmente importa se eu sujar e suar um pouco, dado a alegria que trago?"
 ep3_laamp_flavour_ewan.2051.desc.intro:0 "[smelly.GetFirstName|U] parou de se banhar. Parou até mesmo de tentar se limpar — um fato que sou brutalmente confrontado quando vários dos meus seguidores imploram para eu lidar com [smelly.GetSheHe].\n\n\"Eu sei o que você está pensando, [ROOT.Char.GetTitleAsName], mas não é preguiça.\""
 ep3_laamp_flavour_ewan.2051.desc.lazy:0 "É uhhh... uma busca por eficiência? Na verdade, posso fazer #EMP mais#! trabalho se gastar menos tempo limpando o suor da estrada. Isso é o que um foco implacável em valor parece."
 ep3_laamp_flavour_ewan.2051.desc.outro:0 "\n\n[smelly.GetSheHe|U] está louco/a. Ou é um/a tolo/a. Ou ambos."
 ep3_laamp_flavour_ewan.2051.t:0 "Qual é o Objetivo?"
 ep3_laamp_flavour_ewan.2061.a:0 "Fique do lado d[Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.2061.b:0 "Fique do lado d[Select_CString( thief.IsFemale, 'a', 'o' )] [thief.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.2061.c:0 "Temos regras por uma razão, [thief.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.2061.d:0 "Resolva isso entre vocês."
 ep3_laamp_flavour_ewan.2061.desc:0 "\"Mova sua tenda amaldiçoada, droga, [thief.GetFirstName]! Este é meu lugar!\" grita [Select_CString( victim.IsFemale, 'a', 'o' )] [victim.GetFirstName], interrompendo minha caminhada noturna. [thief.GetFirstNameNoTooltip|U] parece indiferente, simplesmente cruzando seus ombros sobre seu peito.\n\n\"Não pode ser seu lugar se está com a minha tenda em cima, não pode?\" [thief.GetSheHe] responde de forma sarcástica.\n\nDesesperado por uma autoridade maior, [victim.GetFirstNameNoTooltip] se volta para mim: \"[ROOT.Char.GetTitledFirstName], por favor, eu imploro, discipline este #EMP infeliz#!.\""
 ep3_laamp_flavour_ewan.2061.t:0 "Meu Lugar"
 ep3_laamp_flavour_ewan.2071.a.tt.candidate_aptitude:0 "[aptitude|E] d[Select_CString( candidate_1.IsFemale, 'a', 'o' )] [candidate_1.GetFirstNamePossessive] seria [candidate_1.GetCourtPositionAptitude( GetCourtPositionType( 'second_camp_officer') )]"
 ep3_laamp_flavour_ewan.2071.a:0 "Aceitar a lealdade d[Select_CString( candidate_1.IsFemale, 'a', 'o' )] [candidate_1.GetFirstNamePossessiveNoTooltip]."
 ep3_laamp_flavour_ewan.2071.b.tt.candidate_aptitude:0 "[aptitude|E] d[Select_CString( candidate_2.IsFemale, 'a', 'o' )] [candidate_2.GetFirstNamePossessive] seria [candidate_2.GetCourtPositionAptitude( GetCourtPositionType( 'second_camp_officer') )]"
 ep3_laamp_flavour_ewan.2071.b:0 "Aproveitar a ética de trabalho d[Select_CString( candidate_2.IsFemale, 'a', 'o' )] [candidate_2.GetFirstNamePossessiveNoTooltip]."
 ep3_laamp_flavour_ewan.2071.c.tt.candidate_aptitude:0 "[aptitude|E] d[Select_CString( candidate_3.IsFemale, 'a', 'o' )] [candidate_3.GetFirstNamePossessive] seria [candidate_3.GetCourtPositionAptitude( GetCourtPositionType( 'second_camp_officer') )]"
 ep3_laamp_flavour_ewan.2071.c:0 "Usar as evidentes habilidades d[Select_CString( candidate_3.IsFemale, 'a', 'o' )] [candidate_3.GetFirstNamePossessiveNoTooltip]."
 ep3_laamp_flavour_ewan.2071.d.post_empty:0 "Permanecerá vago."
 ep3_laamp_flavour_ewan.2071.d.post_filled:0 "[current_sic.GetFirstNameNoTooltip] deve manter seu cargo!"
 ep3_laamp_flavour_ewan.2071.desc.outro:0 "A insatisfação com este estado de coisas finalmente transbordou o suficiente para que três candidatos se apresentassem para oferecer seus serviços para o cargo.\n\n[candidate_1.GetFirstName], que se oferece para jurar [candidate_1.GetHerselfHimself] a mim até o último suspiro.\n\n[candidate_2.GetFirstName], que parece pronto para trabalhar [candidate_2.GetHerselfHimself] até a exaustão por mim.\n\nE, claro, [candidate_3.GetFirstName] — indubitavelmente o mais qualificado do acampamento para o cargo."
 ep3_laamp_flavour_ewan.2071.desc.sic_exists:0 "Não é segredo que [Select_CString( current_sic.IsFemale, 'a', 'o' )] [current_sic.GetFirstName] é, talvez, não o melhor segundo que eu poderia ter."
 ep3_laamp_flavour_ewan.2071.desc.sic_vacant:0 "Há algum tempo, o cargo do meu segundo está vago."
 ep3_laamp_flavour_ewan.2071.t:0 "Segundo em Comando"
 ep3_laamp_flavour_ewan.2081.a:0 "Você precisa de mais uma mão?"
 ep3_laamp_flavour_ewan.2081.b:0 "Depois de terminar aqui, vá ajudar a levantar meu pavilhão."
 ep3_laamp_flavour_ewan.2081.c:0 "Hmmm... não gosto disso, separe-os."
 ep3_laamp_flavour_ewan.2081.d:0 "Como deveria ser."
 ep3_laamp_flavour_ewan.2081.desc.dislike:0 "Até mesmo [Select_CString( follower_1.IsFemale, 'a', 'o' )] [follower_1.GetFirstName] e [Select_CString( follower_2.IsFemale, 'a', 'o' )] [follower_2.GetFirstName], nenhum dos quais historicamente se deu bem, estão se ajudando esta noite, rindo como velhos amigos enquanto trabalham."
 ep3_laamp_flavour_ewan.2081.desc.intro:0 "Nossa pequena floresta de tendas montando-se a cada poucas noites é algo em que nos tornamos muito, muito bons ultimamente. Primeiro uma, depois outra, depois outra, com pessoas e ferramentas se espalhando ao longo das linhas para ajudar seus vizinhos em um modelo de velocidade e eficiência.\n\n"
 ep3_laamp_flavour_ewan.2081.desc.like:0 "[follower_1.GetFirstName] e [Select_CString( follower_2.IsFemale, 'a', 'o' )] [follower_2.GetFirstName], que geralmente se deram bem no passado, parecem estar especialmente se unindo esta noite enquanto se ajudam."
 ep3_laamp_flavour_ewan.2081.desc.neutral:0 "Até mesmo [Select_CString( follower_1.IsFemale, 'a', 'o' )] [follower_1.GetFirstName] e [Select_CString( follower_2.IsFemale, 'a', 'o' )] [follower_2.GetFirstName], que não são geralmente conhecidos por se moverem nos mesmos círculos, estão suavemente cantando enquanto se ajudam."
 ep3_laamp_flavour_ewan.2081.desc.outro:0 "\n\nUm lugar para tudo, e tudo em seu lugar."
 ep3_laamp_flavour_ewan.2081.e:0 "Bom ver esses dois se dando bem!"
 ep3_laamp_flavour_ewan.2081.t:0 "Uma Máquina Bem Lubrificada"
 ep3_laamp_flavour_ewan.2091.a.tt.failure:0 "Alguns golpes são trocados de qualquer forma"
 ep3_laamp_flavour_ewan.2091.a.tt.success:0 "Você interrompe isso"
 ep3_laamp_flavour_ewan.2091.a:0 "Intervir."
 ep3_laamp_flavour_ewan.2091.b:0 "Por que não resolver isso com um duelo apropriado?"
 ep3_laamp_flavour_ewan.2091.c:0 "Prendam [Select_CString( attacker.IsFemale, 'a', 'o' )] [attacker.GetFirstNameNoTooltip]! Para a cela!"
 ep3_laamp_flavour_ewan.2091.d:0 "Deixe-os resolver isso."
 ep3_laamp_flavour_ewan.2091.desc:0 "Ao redor da fogueira, alguns seguidores compartilham sua refeição da noite.\n\nCuriosamente, [Select_CString( attacker.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('attacker'))] [attacker.GetFirstName] e [Select_CString( defender.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('defender'))] [defender.GetFirstName] estão sentados entre eles — apesar da antipatia mútua.\n\n[defender.GetFirstNameNoTooltip|U] murmura algo sob sua respiração. Seja o que for, isso leva [attacker.GetFirstNameNoTooltip] a uma fúria cega. O aço reluz. O sangue está prestes a ser derramado."
 ep3_laamp_flavour_ewan.2091.t:0 "Crimes de Paixão"
 ep3_laamp_flavour_ewan.2091.tt.duel_commences:0 "[attacker.GetFirstName] e [Select_CString( defender.IsFemale, 'a', 'o' )] [defender.GetFirstName] duelarão imediatamente até a morte"
 ep3_laamp_flavour_ewan.2092.tt.attacker_won.tt:0 "[attacker.GetSheHe|U] massacra [Select_CString( defender.IsFemale, 'a', 'o' )] [defender.GetFirstName]"
 ep3_laamp_flavour_ewan.2092.tt.attacker_won:0 "[attacker.GetFirstNameNoTooltip] Vence"
 ep3_laamp_flavour_ewan.2092.tt.defender_won.tt:0 "[defender.GetSheHe|U] mata [Select_CString( attacker.IsFemale, 'a', 'o' )] [attacker.GetFirstName] em legítima defesa"
 ep3_laamp_flavour_ewan.2092.tt.defender_won:0 "[defender.GetFirstNameNoTooltip] Vence"
 ep3_laamp_flavour_ewan.3001.a:0 "Claro, nós os aceitaremos..."
 ep3_laamp_flavour_ewan.3001.b.tt.failure:0 "Sem honra entre ladrões, então!"
 ep3_laamp_flavour_ewan.3001.b.tt.success:0 "Eles esvaziam seus estoques para você"
 ep3_laamp_flavour_ewan.3001.b:0 "... mas vocês têm que contribuir para o #EMP fundo#! primeiro."
 ep3_laamp_flavour_ewan.3001.c:0 "Heh, saiam daqui, vira-latas."
 ep3_laamp_flavour_ewan.3001.desc.disgraced:0 "\"Nós uhh... cruzamos a linha da lei em [current_county.GetBaseNameNoTier] uma vez demais e estamos procurando qualquer bilhete para sair daqui. Sua gangue parecia tão boa quanto qualquer outra.\""
 ep3_laamp_flavour_ewan.3001.desc.distinguished:0 "\"Ouvimos falar de você, desde que você chegou aqui, e achamos que poderíamos realmente ser ativos em suas operações.\""
 ep3_laamp_flavour_ewan.3001.desc.established:0 "\"Somos trabalhadores esforçados — pelo menos dentro de nosso #EMP campo#! — e do jeito que vemos, você poderia usar uma ajuda para construir seu nome e encher seus bolsos.\""
 ep3_laamp_flavour_ewan.3001.desc.exalted:0 "\"Levamos a sério o que fazemos, e isso significa não deixar que o orgulho nos impeça de aproveitar uma oportunidade única na vida. Leve-nos com você, e iremos roubar o mundo para você.\""
 ep3_laamp_flavour_ewan.3001.desc.illustrious:0 "\"Fomos os maiores peixes neste lago — até você aparecer. Não que nos importemos. Negócios são negócios, e não faz sentido competir quando podemos trabalhar juntos.\""
 ep3_laamp_flavour_ewan.3001.desc.intro:0 "Seguindo um sentinela, entro em uma tenda mal iluminada ao lado de [ROOT.Char.Custom('GetRandomCampBuilding')], onde um trio desgastado de locais me aguarda. Eles [ROOT.Char.Custom('SenseObserve_SeemLook')] nervosos, como se estar aqui fosse um risco.\n\nUm deles se levanta, antes de me fazer uma reverência realmente #EMP horrível#!. \"Saudações, sua senhoria, meu nome é [brains.GetFirstName]. [Select_CString( brawn.IsFemale, 'A', 'O' )] grande [brawn.Custom('GetLassLad')] é [brawn.GetFirstName], e o outro é [fingers.GetFirstName]. Estamos aqui para nos alistar.\"\n\n"
 ep3_laamp_flavour_ewan.3001.desc.legendary:0 "\"Nós somos artistas por natureza — seja com faca, laço ou flecha entalhada — e não conseguimos pensar em um [ROOT.Char.Custom('MistressMaster')] mais digno para nossos talentos.\""
 ep3_laamp_flavour_ewan.3001.t:0 "Ouvi Falar de Você"
 ep3_laamp_flavour_ewan.3011.a.tt.failure:0 "Palavras finas e conversas finas"
 ep3_laamp_flavour_ewan.3011.a.tt.success:0 "Um debate para a eternidade"
 ep3_laamp_flavour_ewan.3011.a:0 "[eloquent_follower.GetFirstNameNoTooltip] é interessante..."
 ep3_laamp_flavour_ewan.3011.b.tt.failure:0 "Divagações divertidas"
 ep3_laamp_flavour_ewan.3011.b.tt.success:0 "Uma discussão elucidativa"
 ep3_laamp_flavour_ewan.3011.b:0 "Mente d[Select_CString( wise_follower.IsFemale, 'a', 'o' )] [wise_follower.GetFirstNamePossessiveNoTooltip] me estimulará!"
 ep3_laamp_flavour_ewan.3011.c:0 "Aproveitar o caos erudito."
 ep3_laamp_flavour_ewan.3011.d:0 "Acenar com a cabeça durante a conversa."
 ep3_laamp_flavour_ewan.3011.desc:0 "Ter opiniões é garantido, discutir é inevitável.\n\nUm truísmo simples para qualquer reunião de mais de duas pessoas de uma tendência acadêmica, e há decididamente mais de duas pessoas assim em [ROOT.Char.GetPrimaryTitle.GetDefinitiveName].\n\nNesta bela noite, há duas discussões sobrepostas — e bastante altas — acontecendo, uma sobre retórica e fina política com [Select_CString( eloquent_follower.IsFemale, 'a', 'o' )] [eloquent_follower.GetFirstName], e outra sobre história e sabedoria filosófica com [Select_CString( wise_follower.IsFemale, 'a', 'o' )] [wise_follower.GetFirstName]."
 ep3_laamp_flavour_ewan.3011.t:0 "Discutindo o Assunto"
 ep3_laamp_flavour_ewan.3021.a:0 "[kingdom_1.GetBaseNameNoTierNoTooltip] me interessa."
 ep3_laamp_flavour_ewan.3021.b:0 "Sempre quis ver [kingdom_2.GetBaseNameNoTierNoTooltip]!"
 ep3_laamp_flavour_ewan.3021.c:0 "Acho [kingdom_3.GetBaseNameNoTierNoTooltip] fascinante."
 ep3_laamp_flavour_ewan.3021.d:0 "Ainda tenho lugares para refletir..."
 ep3_laamp_flavour_ewan.3021.desc:0 "Sentado em minha tenda, encontro-me analisando contas, mapas e manuscritos que detalham reinos exóticos e distantes. Histórias tão tentadoras que eles contam, lugares tão #EMP estranhos#! que este mundo tem a oferecer...\n\nEu me pergunto, será que o povo deles ouve histórias sobre nós? Estou apenas decifrando rumores ou relatos verídicos — e fantásticos — de lugares aparentemente distantes do olhar de [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 ep3_laamp_flavour_ewan.3021.t:0 "Além do Horizonte"
 ep3_laamp_flavour_ewan.3021.tt.failure:0 "Essas palavras são difíceis"
 ep3_laamp_flavour_ewan.3021.tt.kingdom_1.contracts_appear:0 "Vários contratos de alto valor aparecerão em [kingdom_1.GetDefinitiveName]"
 ep3_laamp_flavour_ewan.3021.tt.kingdom_2.contracts_appear:0 "Vários contratos de alto valor aparecerão em [kingdom_2.GetDefinitiveName]"
 ep3_laamp_flavour_ewan.3021.tt.kingdom_3.contracts_appear:0 "Vários contratos de alto valor aparecerão em [kingdom_3.GetDefinitiveName]"
 ep3_laamp_flavour_ewan.3021.tt.success:0 "Que sintaxe elegante"
 ep3_laamp_flavour_ewan.3031.a:0 "[family_title.GetBaseNameNoTierNoTooltip] é meu por direito!"
 ep3_laamp_flavour_ewan.3031.b:0 "[adjacent_title.GetBaseNameNoTierNoTooltip] é certamente meu domínio natural..."
 ep3_laamp_flavour_ewan.3031.c:0 "Em meu coração, nunca desisti de [memory_title.GetBaseNameNoTierNoTooltip]."
 ep3_laamp_flavour_ewan.3031.d:0 "Algum dia, todos esses e mais..."
 ep3_laamp_flavour_ewan.3031.desc.adjacent_title:0 "Não é [adjacent_title.GetBaseNameNoTier] logicamente meu?"
 ep3_laamp_flavour_ewan.3031.desc.family_title:0 "Não tenho um bom direito a [family_title.GetBaseNameNoTier]?"
 ep3_laamp_flavour_ewan.3031.desc.intro:0 "Deveria ser meu.\n\nNão é justo que eu me sente aqui, em uma tenda fria, em vez de um confortável leito em meu palácio na capital. Minha determinação em ver minha propriedade — meu #EMP direito de nascimento#! — restaurada a mim arde um pouco mais a cada noite, uma motivação que me força a seguir em frente apesar dessas... indignidades.\n\nÉ tudo isso, porém?"
 ep3_laamp_flavour_ewan.3031.desc.memory_title:0 "Não foi [memory_title.GetBaseNameNoTier] roubado de mim?"
 ep3_laamp_flavour_ewan.3031.desc.outro:0 "\n\nMeu humor escurece com o céu."
 ep3_laamp_flavour_ewan.3031.t:0 "Minas por Direito"
 ep3_laamp_flavour_ewan.3041.a.imperial:0 "Mais tropas para o exército imperial em exílio!"
 ep3_laamp_flavour_ewan.3041.a.royal:0 "Mais tropas para o exército real em exílio!"
 ep3_laamp_flavour_ewan.3041.b:0 "Sua lealdade é notada, mas eu preciso de subversivos."
 ep3_laamp_flavour_ewan.3041.c:0 "Retorne para casa e atormente o usurpador onde quer que esteja."
 ep3_laamp_flavour_ewan.3041.d:0 "Agradeço, mas não #EMP preciso#! de vocês."
 ep3_laamp_flavour_ewan.3041.desc.ambitious:0 "sem seu impulso e ambições, somos como cordeiros perdidos."
 ep3_laamp_flavour_ewan.3041.desc.arbitrary:0 "sem seus caprichos orientadores, a lei se tornou tirânica."
 ep3_laamp_flavour_ewan.3041.desc.arrogant:0 "sem sua autoridade natural, seu reino é deixado em caos perpétuo."
 ep3_laamp_flavour_ewan.3041.desc.callous:0 "sem sua firme disciplina orientadora, seu reino escorregou para a decadência.\""
 ep3_laamp_flavour_ewan.3041.desc.calm:0 "sem sua mão firme e orientadora, seu reino está caindo em ruínas.\""
 ep3_laamp_flavour_ewan.3041.desc.compassionate:0 "sua natureza compassiva e coração gentil sempre o marcaram como nosso legítimo senhor.\""
 ep3_laamp_flavour_ewan.3041.desc.content:0 "sem sua sabedoria e perspectiva, somos como cães selvagens."
 ep3_laamp_flavour_ewan.3041.desc.fallback:0 "fizemos nossos votos, e pretendemos mantê-los até a morte nos levar."
 ep3_laamp_flavour_ewan.3041.desc.humble:0 "sem sua humildade para nos guiar, a arrogância e a crueldade correm soltas."
 ep3_laamp_flavour_ewan.3041.desc.intro:0 "[Select_CString( commander.IsFemale, 'A', 'O' )] [commander.GetWomanMan] [commander.GetCulture.GetName] se mantém rígid[Select_CString( commander.IsFemale, 'a', 'o' )] em minha tenda, sua cabeça inclinada respeitosamente para baixo.\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip], sou [commander.GetFirstName], e trago comigo o máximo de seus seguidores leais de [former_title.GetBaseNameNoTier] que consegui reunir. Usurpadores governam suas terras, e nós, seus fiéis servos, não pudemos suportar mais —"
 ep3_laamp_flavour_ewan.3041.desc.just:0 "sem sua justiça justa, o estado de direito está morto."
 ep3_laamp_flavour_ewan.3041.desc.sadistic:0 "sem sua justiça implacável, os criminosos florescem e se reproduzem.\""
 ep3_laamp_flavour_ewan.3041.desc.title_claimed:0 "\n\n\"Você ainda reivindica [former_title.GetBaseNameNoTierNoTooltip], leve #EMP nós#! como seu direito legítimo!\""
 ep3_laamp_flavour_ewan.3041.desc.title_forsaken:0 "\n\n\"Se você deseja retomar [former_title.GetBaseNameNoTierNoTooltip] ou não, preferimos servi-lo a permanecer lá.\""
 ep3_laamp_flavour_ewan.3041.desc.wrathful:0 "sem seu temperamento militar, nossos inimigos ameaçam nos apagar da Terra.\""
 ep3_laamp_flavour_ewan.3041.t:0 "Pessoas de um Tempo Melhor"
 ep3_laamp_flavour_ewan.3041.tt.up_to_ten_usurper_held_counties:0 "Até dez [counties|E] controladas por usurpadores"
 ep3_laamp_flavour_ewan.3051.a:0 "Eu criarei uma obra ilustre!"
 ep3_laamp_flavour_ewan.3051.b:0 "Meu mapa será famoso em todo o mundo."
 ep3_laamp_flavour_ewan.3051.c:0 "Eu sempre busco criar obras-primas..."
 ep3_laamp_flavour_ewan.3051.d:0 "Apenas divirta-se com isso."
 ep3_laamp_flavour_ewan.3051.desc:0 "Há algo terapêutico na cartografia.\n\nColocando caneta e pincel na tela, vendo as curvas e contornos de uma região ganhar vida, vendo o mundo sob uma nova perspectiva. É simplesmente um exercício agradável, um que descubro ocupando muitas das minhas noites ociosas ultimamente.\n\nEste mais recente pode ser minha maior criação até agora, um mapa ilustrado e anotado completo de [kingdom.GetBaseNameNoTier]."
 ep3_laamp_flavour_ewan.3051.t:0 "Pintura de Mapas"
 ep3_laamp_flavour_ewan.3051.tt.failure:0 "Seus rabiscos não valem nada"
 ep3_laamp_flavour_ewan.3051.tt.success:0 "Uma bela obra"
 ep3_laamp_flavour_ewan.3061.a:0 "\"Povos & Lugares.\""
 ep3_laamp_flavour_ewan.3061.b:0 "\"Prosa & Poesia.\""
 ep3_laamp_flavour_ewan.3061.c:0 "\"Plantas & Animais.\""
 ep3_laamp_flavour_ewan.3061.d:0 "Apenas continue rabiscando pensamentos."
 ep3_laamp_flavour_ewan.3061.desc:0 "Apenas... algumas... últimas... pinceladas de pena... e...\n\nPronto! Um panfleto completo sobre os locais de [current_county.GetBaseNameNoTier] e suas peculiaridades. Certo, não é um exaustivo, mas as palavras não crescem em árvores — elas devem ser copiadas laboriosamente, letra por letra.\n\nAgora, qual título dar a esta pequena maravilha do conhecimento?"
 ep3_laamp_flavour_ewan.3061.t:0 "Um Guia para ..."
 ep3_laamp_flavour_ewan.3071.a:0 "Duelo com o atacante principal."
 ep3_laamp_flavour_ewan.3071.b:0 "Desencadeie sua emboscada!"
 ep3_laamp_flavour_ewan.3071.c.tt.failure:0 "Desastre!"
 ep3_laamp_flavour_ewan.3071.c.tt.success:0 "Suas tropas nas proximidades os atacam."
 ep3_laamp_flavour_ewan.3071.c:0 "Toque a corneta!"
 ep3_laamp_flavour_ewan.3071.d:0 "Contra-ataque facilmente."
 ep3_laamp_flavour_ewan.3071.desc:0 "A emboscada ataca quase assim que tenho motivo para entrar na selva, enxames de lutadores [local_soldier.GetCulture.GetCollectiveNoun] saem de esconderijos preparados e vão direto em direção a mim e meu pequeno grupo de retenções.\n\nEles estão bem armados e armadurados, até demais para um ataque oportunista. Uma milícia, então, ou talvez tropas domésticas, vieram me cortar por meus crimes.\n\nUm[Select_CString( local_soldier.IsFemale, 'a', '' )] gigante de um[Select_CString( local_soldier.IsFemale, 'a', '' )] [local_soldier.GetWomanMan] lidera a carga, bradando seu desafio para mim no topo de seus poderosos pulmões: \"#EMP Morte!#! #BER MORTE OU GLÓRIA!\""
 ep3_laamp_flavour_ewan.3071.e.tt.failure:0 "Desastre!"
 ep3_laamp_flavour_ewan.3071.e.tt.success:0 "Você os afasta."
 ep3_laamp_flavour_ewan.3071.e:0 "Reúna seu grupo para um contra-ataque."
 ep3_laamp_flavour_ewan.3071.f.failure:0 "O inimigo alcança você."
 ep3_laamp_flavour_ewan.3071.f.success:0 "Você escapa."
 ep3_laamp_flavour_ewan.3071.f:0 "Fuja."
 ep3_laamp_flavour_ewan.3071.t:0 "A Lei em [current_county.GetBaseNameNoTierNoTooltip]"
 ep3_laamp_flavour_ewan.3073.a:0 "Pobre tolo."
 ep3_laamp_flavour_ewan.3073.desc:0 "Quando o corpo espancado d[Select_CString( local_soldier.IsFemale, 'a', 'o' )] [local_soldier.GetFirstNamePossessive] se desmorona no chão, um grito de desespero ecoa entre as tropas [local_soldier.GetHerHim].\n\nCom seu comandante morto, a moral dos locais se despedaça completamente, e eles quebram em uma retirada desordenada com meus soldados colando nos seus calcanhares.\n\nOlho para o corpo. Hmmph.\n\nMorte ou glória, de fato."
 ep3_laamp_flavour_ewan.3073.t:0 "$ep3_laamp_flavour_ewan.3071.t$: Duelo Vitorioso"
 ep3_laamp_flavour_ewan.3081.a.tt.failure:0 "Derrota."
 ep3_laamp_flavour_ewan.3081.a.tt.success:0 "Você luta com [Select_CString( challenger.IsFemale, 'a', 'o' )] [challenger.GetFirstNameNoTooltip] até a submissão."
 ep3_laamp_flavour_ewan.3081.a:0 "Palavras corajosas para um perdedor iminente."
 ep3_laamp_flavour_ewan.3081.b:0 "Dê uma surra [Select_CString( challenger.IsFemale, 'nela', 'nele' )] por sequer perguntar."
 ep3_laamp_flavour_ewan.3081.c:0 "Hah, #EMP não#!."
 ep3_laamp_flavour_ewan.3081.desc:0 "Adversário mais recente d[Select_CString( challenger.IsFemale, 'a', 'o' )] [challenger.GetFirstNamePossessive|U] desaba, ofegante e derrotado.\n\nLutar é um esporte bastante popular entre a maioria dos mercenários, por razões óbvias, mas [Select_CString( challenger.IsFemale, 'a', 'o' )] [challenger.GetFirstNameNoTooltip] o persegue como se fosse uma forma de arte. Às vezes, me pergunto se [challenger.GetSheHe] não preferiria lutar desarmado, não precisando de outra arma.\n\n[Select_CString( challenger.IsFemale, 'A', 'O' )] [challenger.GetWomanMan] vê meu olhar pensativo e ergue seus punhos em uma brincadeira educada — mas zombeteira. \"Bem, [ROOT.Char.GetFirstNameNoTooltip], que tal?\""
 ep3_laamp_flavour_ewan.3081.t:0 "Lute por Isso"
 ep3_laamp_flavour_ewan.4001.a.tt.failure:0 "Eles fogem com o loot, independentemente."
 ep3_laamp_flavour_ewan.4001.a.tt.success:0 "Os bandidos são derrotados."
 ep3_laamp_flavour_ewan.4001.a:0 "Repele-os!"
 ep3_laamp_flavour_ewan.4001.b:0 "Prepare-se para provar o aço, bandido!"
 ep3_laamp_flavour_ewan.4001.c.tt.failure:0 "Sua reputação falha."
 ep3_laamp_flavour_ewan.4001.c.tt.success:0 "Você intimida os criminosos locais."
 ep3_laamp_flavour_ewan.4001.c:0 "Afaste-se, #EMP peixes pequenos#!."
 ep3_laamp_flavour_ewan.4001.d:0 "Renda as provisões."
 ep3_laamp_flavour_ewan.4001.desc:0 "Os bandidos lançam seu ataque enquanto ainda estamos em movimento, nossos defensores e membros vulneráveis espalhados em uma longa linha sinuosa.\n\nEles coordenam bem, soando um longo toque de corneta antes de emergirem de seus esconderijos, atingindo vários pontos ao longo de nosso comboio de uma só vez com uma fúria terrível.\n\nMesmo assim, fica imediatamente óbvio qual é seu objetivo, já que s[Select_CString( bandit_leader.IsFemale, 'ua', 'eu' )] líder, um[Select_CString( bandit_leader.IsFemale, 'a', '' )] [bandit_leader.GetWomanMan] temível [bandit_leader.GetCulture.GetName], leva seu gangue direto para as carroças carregadas pesadamente com provisões."
 ep3_laamp_flavour_ewan.4001.t:0 "Bandidos!"
 ep3_laamp_flavour_ewan.4003.a:0 "Ninguém rouba de mim."
 ep3_laamp_flavour_ewan.4003.desc:0 "A morte de seu líder provoca um pânico frenético nos bandidos.\n\nGritos e clamor passam de não-combatentes aterrorizados no trem de bagagens para assassinos impiedosos vendo um plano desmoronar da pior forma diante de seus olhos.\n\nOs mais covardes quebram e fogem, os mais impiedosos ferem camaradas para cobrir sua fuga. De qualquer forma, o ataque termina em minutos."
 ep3_laamp_flavour_ewan.4003.t:0 "$ep3_laamp_flavour_ewan.4001.t$: Duelo Vitorioso"
 ep3_laamp_flavour_ewan.4011.a:0 "Aproveite os frutos da abundância."
 ep3_laamp_flavour_ewan.4011.desc:0 "Existem muitos lugares duros e implacáveis neste mundo.\n\n[current_county.GetBaseNameNoTier] não é um deles.\n\nNão, em vez disso, sua terra abundante gera pessoas generosas e forragens fáceis. As tensões diminuem e a comida para todo o grupo parece, temporariamente, se tornar um não-problema: que inesperada #EMP felicidade#!."
 ep3_laamp_flavour_ewan.4011.t:0 "Uma Terra de Leite e Mel"
 ep3_laamp_flavour_ewan.4021.a.tt.failure:0 "Seco como um osso"
 ep3_laamp_flavour_ewan.4021.a.tt.success:0 "Fonte de água encontrada"
 ep3_laamp_flavour_ewan.4021.a:0 "Deve haver #EMP algo#! por aqui..."
 ep3_laamp_flavour_ewan.4021.b:0 "[forager.GetFirstNameNoTooltip], vá procurar."
 ep3_laamp_flavour_ewan.4021.c:0 "[hunter.GetFirstNameNoTooltip], vá procurar."
 ep3_laamp_flavour_ewan.4021.d:0 "Podemos racionar até superarmos isso."
 ep3_laamp_flavour_ewan.4021.desc:0 "Já faz dias desde a última vez que o acampamento conseguiu encontrar água estável.\n\nComida, comida que um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] pode ficar sem — por um tempo. Um estômago roncando pode levar semanas para te matar.\n\nSem água, porém, sem nenhum lugar à vista para repor e com os estoques se esgotando, a sede ameaça uma extinção muito mais #EMP rápida#!."
 ep3_laamp_flavour_ewan.4021.e.tt.failure:0 "[ROOT.Char.GetFaith.WaterGodName] te despreza"
 ep3_laamp_flavour_ewan.4021.e.tt.success:0 "A água aparece, eventualmente"
 ep3_laamp_flavour_ewan.4021.e:0 "Ore para [ROOT.Char.GetFaith.WaterGodName] para que saíamos disso logo."
 ep3_laamp_flavour_ewan.4021.t:0 "Sedento"
