 ep3_laamp_flavour_ewan.9531.a:0 "Pensar que nunca mais veremos [visitor.GetSheHe]..."
 ep3_laamp_flavour_ewan.9531.b:0 "#EMP Eh.#!"
 ep3_laamp_flavour_ewan.9531.desc:0 "Já se passaram anos, e agora está claro que [Select_CString( visitor.IsFemale, 'minha seguidora', 'meu seguidor' )] ausente [visitor.GetTitledFirstNameNicknamed] não voltará.\n\nAlgo sobre a falta de notícias me diz que [visitor.GetSheHe] morreu durante sua jornada, embora eu não consiga dizer exatamente por quê.\n\nApenas pare de esperar pelo retorno [visitor.GetHerHim]."
 ep3_laamp_flavour_ewan.9531.t:0 "Seguidor Ausente: [visitor.GetTitledFirstNameNicknamedNoTooltip]"
 ep3_laamp_flavour_ewan.9531.tt.follower_is_dead:0 "[visitor.GetTitledFirstName] morreu enquanto estava longe de [camp|E]"
 ep3_laamp_flavour_ewan.9532.a:0 "Devemos libertar [visitor.GetFirstNameNoTooltip]!"
 ep3_laamp_flavour_ewan.9532.b:0 "[imprisoner.GetFirstNameNoTooltip] pode ficar com [visitor.GetSheHe] para o que me importa."
 ep3_laamp_flavour_ewan.9532.desc:0 "Embora [Select_CString( visitor.IsFemale, 'minha seguidora', 'meu seguidor' )] [visitor.GetTitledFirstNameNicknamed] esteja longe de nós há anos, esperávamos que [visitor.GetSheHe] voltasse relativamente em breve.\n\nInfelizmente, um mensageiro transmite que isso é impossível: parece que [visitor.GetSheHe] está sendo mantid[Select_CString( visitor.IsFemale, 'a', 'o' )] prisioneir[Select_CString( visitor.IsFemale, 'a', 'o' )] pel[Select_CString( imprisoner.IsFemale, 'a', 'o' )] cruel [imprisoner.GetTitledFirstName]! Se quisermos ver [visitor.GetSheHe] novamente, teremos que pagar um resgate."
 ep3_laamp_flavour_ewan.9532.t:0 "$ep3_laamp_flavour_ewan.9531.t$"
 ep3_laamp_flavour_ewan.9533.a:0 "O que aconteceu com [visitor.GetSheHe]?"
 ep3_laamp_flavour_ewan.9533.b:0 "Não se preocupe, [visitor.GetFirstNameNoTooltip], cuidaremos de você."
 ep3_laamp_flavour_ewan.9533.c:0 "Afaste esse imbecil antes que alguém veja [visitor.GetSheHe]."
 ep3_laamp_flavour_ewan.9533.desc:0 "Depois de muitos anos longe, estávamos começando a nos preocupar com [Select_CString( visitor.IsFemale, 'a', 'o' )] [visitor.GetTitledFirstNameNicknamed], que já deveria ter voltado.\n\nInfelizmente, parece que nossas preocupações estavam bem fundamentadas, pois esta noite [visitor.GetSheHe] tropeçou de volta no acampamento e desabou, um ser quebrado de um[Select_CString( visitor.IsFemale, 'a', '' )] [visitor.GetWomanMan]. Como isso aconteceu com [visitor.GetSheHe], e como [visitor.GetSheHe] chegou até nós nessas condições, não posso dizer.\n\nNo estado em que [visitor.GetSheHe] está, [visitor.GetSheHe] também não pode."
 ep3_laamp_flavour_ewan.9533.t:0 "$ep3_laamp_flavour_ewan.9531.t$"
 ep3_laamp_flavour_ewan.9533.tt.follower_is_incapable:0 "[visitor.GetTitledFirstName] foi deixad[Select_CString( visitor.IsFemale, 'a', 'o' )] [GetTrait('incapable').GetName( GetNullCharacter )] enquanto estava longe de [camp|E]"
 ep3_laamp_flavour_ewan.9534.a:0 "Eu me pergunto o que poderia ter acontecido com [visitor.GetSheHe]..."
 ep3_laamp_flavour_ewan.9534.desc:0 "[visitor.GetTitledFirstNameNicknamed] já deveria ter voltado.\n\n[visitor.GetSheHe|U] não deveria estar longe por tanto tempo, e ainda assim, [visitor.GetSheHe] não retornou nem enviou notícias por qualquer meio. Talvez [visitor.GetSheHe] tenha perdido nosso rastro e não consiga recuperá-lo novamente.\n\nQualquer que seja o caso, parece claro que [Select_CString( visitor.IsFemale, 'a', 'o' )] [visitor.GetFirstNameNoTooltip] nunca voltará para nós."
 ep3_laamp_flavour_ewan.9534.t:0 "$ep3_laamp_flavour_ewan.9531.t$"
 ep3_laamp_flavour_ewan.9534.tt.follower_is_lost:0 "[visitor.GetTitledFirstName] se perdeu em algum lugar, de alguma forma, e não voltará para [camp|E]"
 ep3_laamp_flavour_ewan.9541.desc.cat_gained:0 "[pet_owner.GetFirstNameNicknamed] agora é acompanhad[Select_CString( pet_owner.IsFemale, 'a', 'o' )] por um pequeno felino."
 ep3_laamp_flavour_ewan.9541.desc.dog_gained:0 "[pet_owner.GetFirstNameNicknamed] obteve um cão de estimação."
 ep3_laamp_flavour_ewan.9541.desc.nickname_gained:0 "As pessoas ao redor do acampamento deram [Select_CString( eponymee.IsFemale, 'a', 'ao' )] [eponymee.GetFirstName] um apelido baseado na [personality|E] e [traits|E] [eponymee.GetHerHim].\n$EFFECT_LIST_BULLET$[eponymee.GetSheHe|U] agora é conhecido como #V [eponymee.GetFirstNameNicknamed]#!"
 ep3_laamp_flavour_ewan.9541.desc.opinion_gained:0 "[follower_1.GetFirstNameNicknamed] e [Select_CString( follower_2.IsFemale, 'a', 'o' )] [follower_2.GetFirstNameNicknamed] estão se unindo por interesses comuns."
 ep3_laamp_flavour_ewan.9541.desc.opinion_lost:0 "[follower_1.GetFirstNameNicknamed] e [Select_CString( follower_2.IsFemale, 'a', 'o' )] [follower_2.GetFirstNameNicknamed] estão em conflito por suas diferenças."
 ep3_laamp_flavour_ewan.9541.desc.stress_gained:0 "[stressee.GetFirstNameNicknamed] não está lidando bem com as dificuldades da vida agora."
 ep3_laamp_flavour_ewan.9541.desc.stress_lost:0 "[stressee.GetFirstNameNicknamed] aprecia a liberdade da vida na estrada."
 ep3_laamp_flavour_ewan.9541.t.cat_gained:0 "Seguidor Adotado por um Gato"
 ep3_laamp_flavour_ewan.9541.t.dog_gained:0 "Seguidor Adota um Cão"
 ep3_laamp_flavour_ewan.9541.t.nickname_gained:0 "Seguidor Ganha Apelido"
 ep3_laamp_flavour_ewan.9541.t.opinion_gained:0 "Convívio Amigável"
 ep3_laamp_flavour_ewan.9541.t.opinion_lost:0 "Convívio Hostil"
 ep3_laamp_flavour_ewan.9541.t.stress_gained:0 "Uma Vida Difícil"
 ep3_laamp_flavour_ewan.9541.t.stress_lost:0 "A Vida Tranquila"
 ep3_laamp_flavour_ewan_0001_all_business_modifier:0 "Apenas Negócios"
 ep3_laamp_flavour_ewan_0001_all_business_modifier_desc:0 "Quando há trabalho a ser feito, tudo o mais pode esperar."
 ep3_laamp_flavour_ewan_0001_the_little_things_modifier:0 "As Pequenas Coisas"
 ep3_laamp_flavour_ewan_0001_the_little_things_modifier_desc:0 "Este personagem se certifica de reservar tempo para apreciar as pequenas alegrias da vida."
 ep3_laamp_flavour_ewan_0021_respected_cat_modifier:0 "Gato Respeitado"
 ep3_laamp_flavour_ewan_0021_respected_cat_modifier_desc:0 "Este personagem sabe quem é verdadeiramente o melhor amigo do homem."
 ep3_laamp_flavour_ewan_0021_respected_dog_modifier:0 "Cachorro Respeitado"
 ep3_laamp_flavour_ewan_0021_respected_dog_modifier_desc:0 "$ep3_laamp_flavour_ewan_0021_respected_cat_modifier_desc$"
 ep3_laamp_flavour_ewan_0031_grisly_modifier:0 "Sentido de Humor Macabro"
 ep3_laamp_flavour_ewan_0031_grisly_modifier_desc:0 "A vida está rindo de você, por que não rir junto?"
 ep3_laamp_flavour_ewan_0031_macabre_modifier:0 "Sentido de Humor Macabro"
 ep3_laamp_flavour_ewan_0031_macabre_modifier_desc:0 "Só porque é sombrio não significa que não seja engraçado."
 ep3_laamp_flavour_ewan_0041_doubled_beer_rations_camp_modifier:0 "Rações de Cerveja Dobradas"
 ep3_laamp_flavour_ewan_0041_doubled_beer_rations_camp_modifier_desc:0 "O acampamento deste personagem é muito alegre — apenas não muito focado."
 ep3_laamp_flavour_ewan_0041_quite_stern_camp_modifier:0 "Bastante Sério em Suprimentos"
 ep3_laamp_flavour_ewan_0041_quite_stern_camp_modifier_desc:0 "$ep3_laamp_flavour_ewan_0041_stern_camp_modifier_desc$"
 ep3_laamp_flavour_ewan_0041_stern_camp_modifier:0 "Sério em Suprimentos"
 ep3_laamp_flavour_ewan_0041_stern_camp_modifier_desc:0 "Os seguidores deste personagem aprendem a se virar com o que têm ou então a se virar sem."
 ep3_laamp_flavour_ewan_0041_very_stern_camp_modifier:0 "Muito Sério em Suprimentos"
 ep3_laamp_flavour_ewan_0041_very_stern_camp_modifier_desc:0 "$ep3_laamp_flavour_ewan_0041_stern_camp_modifier_desc$"
 ep3_laamp_flavour_ewan_0041_well_provided_camp_modifier:0 "Acampamento Bem Suprido"
 ep3_laamp_flavour_ewan_0041_well_provided_camp_modifier_desc:0 "Lembranças de abundância podem durar muito tempo."
 ep3_laamp_flavour_ewan_0051_check_building_baggage_train_modifier:0 "Comboio Disciplinado"
 ep3_laamp_flavour_ewan_0051_check_building_baggage_train_modifier_desc:0 "Os comboios de bagagens são misturas caóticas de pessoas — a menos que você os mantenha firmemente sob controle."
 ep3_laamp_flavour_ewan_0051_check_building_barber_tent_modifier:0 "Parecendo Impecável"
 ep3_laamp_flavour_ewan_0051_check_building_barber_tent_modifier_desc:0 "Uma vida em movimento não é desculpa para descuidar da higiene pessoal."
 ep3_laamp_flavour_ewan_0051_check_building_camp_fire_modifier:0 "Líder do Círculo"
 ep3_laamp_flavour_ewan_0051_check_building_camp_fire_modifier_desc:0 "Uma posição de comando gera uma postura de comando."
 ep3_laamp_flavour_ewan_0051_check_building_camp_perimeter_modifier:0 "Observando os Vigias"
 ep3_laamp_flavour_ewan_0051_check_building_camp_perimeter_modifier_desc:0 "Uma caminhada noturna para patrulhar o perímetro mantém os sentinelas alertas."
 ep3_laamp_flavour_ewan_0051_check_building_mess_tent_modifier:0 "Come Com o Acampamento"
 ep3_laamp_flavour_ewan_0051_check_building_mess_tent_modifier_desc:0 "Um líder não precisa quebrar o pão com seus seguidores, mas ajuda."
 ep3_laamp_flavour_ewan_0051_check_building_proving_grounds_modifier:0 "Sempre em Treinamento"
 ep3_laamp_flavour_ewan_0051_check_building_proving_grounds_modifier_desc:0 "Um olhar firme de cima faz maravilhas pela disciplina."
 ep3_laamp_flavour_ewan_0051_check_building_supply_tent_modifier:0 "Suprimentos Todos em Ordem"
 ep3_laamp_flavour_ewan_0051_check_building_supply_tent_modifier_desc:0 "Um toque pessoal realmente ajuda a motivar a manutenção de registros precisos."
 ep3_laamp_flavour_ewan_1041_beautiful_home_diplomacy_modifier.boilerplate:0 "Saudade de uma Terra Perdida"
