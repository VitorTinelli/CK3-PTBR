 ep3_laamp_flavour_ewan.4021.tt.dehydration_increments:0 "[GetModifier('ep3_laamp_flavour_ewan_4021_extended_period_of_dehydration_t1_modifier').GetNameWithTooltip] se torna muito pior"
 ep3_laamp_flavour_ewan.4021.tt.delegated_to_officer.failure:0 "Seu oficial falha com você"
 ep3_laamp_flavour_ewan.4021.tt.delegated_to_officer.success:0 "Seu oficial tem sucesso"
 ep3_laamp_flavour_ewan.4021.tt.every_courtier_at_your_location_with_less_than_excellent_health:0 "Todo [follower|E] com menos que [health|E] Excelente"
 ep3_laamp_flavour_ewan.4021.tt.officer_aptitude:0 "#WEAK Este duelo é decidido pela [aptitude|E] do seu [officer|E]#!"
 ep3_laamp_flavour_ewan.4031.a.tt.failure:0 "A doença se espalha pelo rebanho."
 ep3_laamp_flavour_ewan.4031.a.tt.success:0 "Você consegue tratar a doença."
 ep3_laamp_flavour_ewan.4031.a:0 "Certamente podemos tratá-los?"
 ep3_laamp_flavour_ewan.4031.b.tt.failure:0 "$ep3_laamp_flavour_ewan.4031.a.tt.failure$"
 ep3_laamp_flavour_ewan.4031.b.tt.success:0 "Alivie o fardo, alivie o sofrimento"
 ep3_laamp_flavour_ewan.4031.b:0 "Podemos redistribuir nosso equipamento até que eles se recuperem."
 ep3_laamp_flavour_ewan.4031.c:0 "[groom.GetFirstNameNoTooltip], esta é sua responsabilidade."
 ep3_laamp_flavour_ewan.4031.d:0 "Abate e descarte os doentes, salve os restantes."
 ep3_laamp_flavour_ewan.4031.desc:0 "Não há como negar: seja pelo clima, terreno, sobrecarga ou simples azar, alguma doença entrou nos animais de carga do acampamento.\n\nEles gemem, relincham, caminham, mas tudo está ficando mais lento e mais letárgico a cada hora, sem contar o dia.\n\nAlguns dos cavalos têm febres claras, e uma das mulas mais velhas parece pronta para morrer — uma ameaça grave se isso se espalhar ainda mais."
 ep3_laamp_flavour_ewan.4031.e:0 "Temos reservas, abata os piores deles."
 ep3_laamp_flavour_ewan.4031.f:0 "$ep3_laamp_flavour_ewan.4031.e$"
 ep3_laamp_flavour_ewan.4031.g.tt.sickness_contained:0 "A doença se contém naturalmente"
 ep3_laamp_flavour_ewan.4031.g.tt.sickness_fades:0 "A doença diminui"
 ep3_laamp_flavour_ewan.4031.g.tt.sickness_spreads:0 "Surto se espalha"
 ep3_laamp_flavour_ewan.4031.g.tt.sickness_spreads_wildly:0 "Surto se espalha como fogo em palha"
 ep3_laamp_flavour_ewan.4031.g.tt.some_of_herd.tt:0 "Apenas alguns animais morrem"
 ep3_laamp_flavour_ewan.4031.g:0 "Continue e ore para [ROOT.Char.GetFaith.HealthGodName] por misericórdia."
 ep3_laamp_flavour_ewan.4031.t:0 "Doença no Rebanho"
 ep3_laamp_flavour_ewan.4031.tt.delegated_to_officer.failure:0 "[groom.GetFirstNameNoTooltip] falha"
 ep3_laamp_flavour_ewan.4031.tt.delegated_to_officer.success:0 "Seu oficial consegue conter a propagação"
 ep3_laamp_flavour_ewan.4041.a.tt.failure:0 "O clima semeia muita confusão"
 ep3_laamp_flavour_ewan.4041.a.tt.success:0 "O treinamento salva o dia"
 ep3_laamp_flavour_ewan.4041.a:0 "Vamos lá, coloquem suas costas nisso!"
 ep3_laamp_flavour_ewan.4041.b.tt.failure:0 "$ep3_laamp_flavour_ewan.4041.a.tt.failure$"
 ep3_laamp_flavour_ewan.4041.b.tt.success:0 "Um bom planejamento vence"
 ep3_laamp_flavour_ewan.4041.b:0 "Pegue o equipamento, vão, #EMP movam-se#!"
 ep3_laamp_flavour_ewan.4041.c.tt.failure:0 "$ep3_laamp_flavour_ewan.4041.a.tt.failure$"
 ep3_laamp_flavour_ewan.4041.c.tt.success:0 "A pura teimosia triunfa"
 ep3_laamp_flavour_ewan.4041.c:0 "Forcem, seus bastardos!"
 ep3_laamp_flavour_ewan.4041.d.tt.failure:0 "Orações não atendidas"
 ep3_laamp_flavour_ewan.4041.d.tt.success:0 "Favor divino"
 ep3_laamp_flavour_ewan.4041.d:0 "Reze para [ROOT.Char.GetFaith.FateGodName] e tenha esperança."
 ep3_laamp_flavour_ewan.4041.desc.outro:0 "meus seguidores à beira do colapso."
 ep3_laamp_flavour_ewan.4041.desc.weather_type.avalanche:0 "É um som surpreendentemente suave que prenuncia o perigo iminente: um vasto #EMP whumph#! de longe.\n\nDezenas de olhos no meio do comboio se levantam para os picos que nos cercam, antes que o estrondo de um raio maior do que qualquer tempestade ecoe pela cadeia montanhosa.\n\n\"#BER AVALANCHE!#!\" grita alguém. De repente, tudo é caos, homens e animais quebrando rapidamente em busca de qualquer abrigo do cascato de morte branca que agora avança em nossa direção, deixando"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.earthquake:0 "O mundo se desloca sob nossos pés. Homens e mulas cambaleiam, bebês emitem um grito unificado, e várias rodas de carrinhos se quebram quando são levantadas e depois arremessadas de volta ou empurradas para o lado.\n\nUm meio segundo de pânico se instala em todo o comboio após o tremor: o que foi isso? Haverá mais ou foi só isso? \n\n#EMP A própria terra começa a tremer#!. A uma certa distância, uma fenda se abre e começa a serpenteá-la, mais rápido do que um homem pode correr, diretamente em nossa direção. A visão imediatamente deixa"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.flood:0 "A névoa parece surgir do nada — num momento o ar está úmido, depois se espessa até quase uma sopa.\n\nDe cima, algumas gotas de chuva caem, e um riacho próximo começa a inchar rapidamente suas margens. A tensão atinge o comboio, fazendo com que homens e carrinhos parem gradualmente. Ninguém consegue dizer exatamente qual é o problema, mas #EMP algo#! está errado.\n\nEm um minuto, o solo antes estável se transformou em lama espessa, e a água começa a inchar de baixo.\n"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.frozen_water:0 "A neve aqui é persistente, mas não severa o suficiente para causar problemas, apenas o suficiente para cobrir o mundo com um espesso tapete branco. Nosso comboio passa por um ponto claro na floresta, saboreando a pausa da cobertura das árvores, uma pequena chance de apreciar o mundo encantado ao nosso redor.\n\n#BER Crack.#!\n\nDezenas de olhos se voltam para baixo, vendo com crescente horror uma vasta fenda se abrindo no solo — não, na superfície do #EMP lago congelado#! Não há tempo a perder, não há tempo para pensar, como um só fugimos — mesmo com"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.storm.sand:0 "Areia está #EMP em todo lugar#! — meus olhos, meu nariz, minha garganta. Mesmo cobrindo meu rosto, pouco faz para desacelerá-la, a sujeira infernal chicoteando furiosamente em tudo e qualquer coisa que puder.\n\nA tempestade de areia surgiu de repente, aparentemente do nada. Em minutos, todo o comboio estava envolto, e agora tudo o que posso distinguir do resto deles são os gritos enquanto nossos suprimentos são arrancados e levados pelo vendaval, e tosses convulsivas onde os pulmões de jovens e velhos falham.\n\nTodos os nossos cuidadosos preparativos estão de repente em desordem, deixando"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.storm.snow:0 "Dormência.\n\nMesmo envolto o mais quente possível, o frio corrói, grandes jatos de neve lançados pelo vento encharcando cada pedaço de carne exposta, drenando o calor como cera de uma vela gasta. O resto do comboio está pior — homem, besta e carrinho continuamente atolados neste inferno branco descolorido, crianças e idosos tremendo sob canópias cobertas de neve enquanto adultos trabalham freneticamente para libertar nossos transportes presos.\n\nA tempestade de neve está gradualmente aumentando, deixando"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.storm.thunder:0 "O trovão ecoa ominosamente acima, uma interrupção surda para os ventos e a chuva que chicoteiam tentando dispersar nosso comboio.\n\nGritos distantes ecoam para cima e para baixo da linha enquanto carrinhos e animais afundam em [ROOT.Char.Custom('RainySoilType')], a tempestade fazendo o melhor para nos lavar todos até [ROOT.Char.GetFaith.NegativeAfterLife]. Crianças e idosos tremem em silêncio miserável, encharcados até os ossos e se perguntando quando a hipotermia começará a se instalar.\n\nO ar estala com eletricidade e tensão igualmente."
 ep3_laamp_flavour_ewan.4041.desc.weather_type.storm.wind:0 "O uivo do vento torna quase impossível ser ouvido a mais de alguns pés de distância.\n\nA intensidade desta maldita tempestade só aumenta, a chuva queimando nossos olhos e prendendo carrinhos pesados e animais carregados em um caldo de [ROOT.Char.Custom('RainySoilType')]. O mesmo tableau silencioso pode ser visto ao longo da linha, seguidores mais fortes ajudando a soltar os transportes enquanto os jovens e idosos se agacham sob qualquer abrigo que consigam encontrar ou formar.\n\nA própria natureza parece estar contra nós, deixando"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.wild_fires.fallback:0 "O incêndio florestal está se movendo mais rápido do que nós, encontrando #EMP combustível suficiente#! para queimar vorazmente em direção ao nosso comboio. Qualquer um e qualquer coisa que seja muito lento para escapar será queimado vivo — mula carregada e criança que demora para ir embora.\n\nPior ainda, vastas nuvens de fumaça se expandem à frente das chamas, ocasionalmente nos cobrindo para sufocar a vida dos vulneráveis, deixando"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.wild_fires.intro:0 "Mesmo a esta distância, podemos sentir o intenso calor das chamas correndo em nossa direção.\n\n"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.wild_fires.scrub:0 "O incêndio florestal está avançando mais rápido através do mato seco do que nós pelo terreno aberto, ventos traiçoeiros levando-o fortemente em nossa direção, ameaçando cozinhar qualquer um e qualquer coisa que seja muito lento para escapar — mula carregada e criança que demora para ir embora.\n\nGrandes plumas de fumaça se estendem à frente do corpo principal das chamas, sufocando nossos doentes e idosos, deixando"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.wild_fires.slopes:0 "Embora continuemos a avançar firme pela ladeira, ventos constantes e solo seco significam que o incêndio florestal está nos alcançando, ameaçando cozinhar qualquer um e qualquer coisa que seja muito lento para escapar — mula carregada e criança que demora para ir embora.\n\nPlumas de fumaça se contorcem acima do corpo principal das chamas, infiltrando nossas fileiras para sufocar até os mais fortes e deixando"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.wild_fires.treeline:0 "Com tanto folhagem para queimar, o incêndio florestal está alcançando em grandes saltos — a detonação ocasional de árvores especialmente secas e cheias de resina um lembrete sombrio e assustador do destino horrível que aguarda qualquer um e tudo que for lento demais para escapar.\n\nTendrilas oleosas de fumaça de cheiro perversamente agradável nos perseguem à frente das chamas, sufocando os fracos e deixando"
 ep3_laamp_flavour_ewan.4041.t:0 "[ROOT.Char.GetFaith.TricksterGodNamePossessive] Dízimo"
 ep3_laamp_flavour_ewan.4041.tt.every_regiment:0 "Cada [regiment|E]"
 ep3_laamp_flavour_ewan.4041.tt.hypothermia_already_at_worst:0 "[GetModifier('ep3_laamp_flavour_ewan_4041_hypothermia_t3_modifier').GetNameWithTooltip] não pode piorar mais"
 ep3_laamp_flavour_ewan.4041.tt.hypothermia_increments:0 "[GetModifier('ep3_laamp_flavour_ewan_4041_hypothermia_t1_modifier').GetNameWithTooltip] piora"
 ep3_laamp_flavour_ewan.4041.tt.hypothermia_increments_twice:0 "[GetModifier('ep3_laamp_flavour_ewan_4041_hypothermia_t1_modifier').GetNameWithTooltip] piora muito"
 ep3_laamp_flavour_ewan.4041.tt.modifier_worse_for_vulnerable_characters:0 "#WEAK Este modificador é pior para [characters|E] jovens e idosos#!"
 ep3_laamp_flavour_ewan.4041.tt.regiments_take_damage_range.avalanche:0 "Perde muitos soldados para as avalanches que caem"
 ep3_laamp_flavour_ewan.4041.tt.regiments_take_damage_range.earthquake:0 "Perde muitos soldados para a boca da Terra"
 ep3_laamp_flavour_ewan.4041.tt.regiments_take_damage_range.flash_floods:0 "Perde muitos soldados para as águas turvas da inundação"
 ep3_laamp_flavour_ewan.4041.tt.regiments_take_damage_range.frozen_water:0 "Perde muitos soldados para as profundezas geladas"
 ep3_laamp_flavour_ewan.4041.tt.regiments_take_damage_range.wildfire:0 "Perde muitos soldados para o fogo e a fumaça"
 ep3_laamp_flavour_ewan.4041.tt.struck_by_lightning.alive:0 "Foi atingido e morto por um raio"
 ep3_laamp_flavour_ewan.4041.tt.struck_by_lightning.dead:0 "Foi atingido por um raio, mas sobreviveu por pouco"
 ep3_laamp_flavour_ewan.4041.tt.struck_by_lightning:0 "Foi atingido por um raio"
 ep3_laamp_flavour_ewan.4051.a.tt.failure:0 "Eles te escapam"
 ep3_laamp_flavour_ewan.4051.a.tt.success:0 "Você pega o ladrão"
 ep3_laamp_flavour_ewan.4051.a:0 "Tragam-me um chicote e encontraremos o culpado!"
 ep3_laamp_flavour_ewan.4051.b.tt.failure:0 "$ep3_laamp_flavour_ewan.4051.a.tt.failure$"
 ep3_laamp_flavour_ewan.4051.b.tt.success:0 "$ep3_laamp_flavour_ewan.4051.a.tt.success$"
 ep3_laamp_flavour_ewan.4051.b:0 "Os registros mostrarão tudo — eventualmente."
 ep3_laamp_flavour_ewan.4051.c.tt.failure:0 "$ep3_laamp_flavour_ewan.4051.a.tt.failure$"
 ep3_laamp_flavour_ewan.4051.c.tt.success:0 "$ep3_laamp_flavour_ewan.4051.a.tt.success$"
 ep3_laamp_flavour_ewan.4051.c:0 "Certamente podemos pegá-los em flagrante..."
 ep3_laamp_flavour_ewan.4051.desc:0 "Com tantos soldados sob um único estandarte errante, e todo este território #EMP duvidoso#! a atravessar, é de se esperar que alguns suprimentos desapareçam de tempos em tempos.\n\nIsso não é apenas alguns suprimentos.\n\nÉ uma vasta, #EMP vasta#! quantidade de suprimentos que algum tolo egoísta vendeu para locais ou desonestos dentro das minhas tropas, perdido devido à incompetência, que não comprou para começar, ou simplesmente se esvaiu, e representa uma violação imperdoável da disciplina."
 ep3_laamp_flavour_ewan.4051.t:0 "Suprimentos Não Registrados"
 ep3_laamp_flavour_ewan.4051.tt.most_provisions_regained:0 "A maior parte das $game_concept_provisions$ foi recuperada"
 ep3_laamp_flavour_ewan.4051.tt.provisions_lost:0 "Todas as $game_concept_provisions$ permanecem perdidas"
 ep3_laamp_flavour_ewan.4051.tt.some_provisions_regained:0 "Algumas $game_concept_provisions$ foram recuperadas"
 ep3_laamp_flavour_ewan.4061.a.tt.duel.risky.are_you_sure:0 "@alert_icon! #alert_trial Dependendo do que for — e do quão grande ele realmente é — isso pode ser bastante fácil ou muito, muito difícil, e você não pode recuar uma vez que parta#!"
 ep3_laamp_flavour_ewan.4061.a.tt.duel.risky:0 "Você persegue a besta pessoalmente, arriscando uma potencial [character_death_death|E] em troca de [prestige|E]"
 ep3_laamp_flavour_ewan.4061.a.tt.duel.safe:0 "Na pior das hipóteses, a besta comerá alguns de seus [followers|E] nomeados."
 ep3_laamp_flavour_ewan.4061.a.tt.failure:0 "Mais algumas mortes"
 ep3_laamp_flavour_ewan.4061.a.tt.success:0 "Interceptado e eliminado"
 ep3_laamp_flavour_ewan.4061.a:0 "Apertem a vigilância."
 ep3_laamp_flavour_ewan.4061.b:0 "Eu irei pegar sua cabeça!"
 ep3_laamp_flavour_ewan.4061.c.tt.failure:0 "Ele comeu"
 ep3_laamp_flavour_ewan.4061.c.tt.success:0 "Ele não comeu"
 ep3_laamp_flavour_ewan.4061.c:0 "Contanto que não coma ninguém importante."
 ep3_laamp_flavour_ewan.4061.desc.intro:0 "A manhã traz um relato de que uma besta devoradora de homens atacou novamente:"
 ep3_laamp_flavour_ewan.4061.desc.midtro:0 "\n\nOs sentinelas não conseguem ver a maldita coisa. Seja lá o que for, tem um gosto por nós e parece esperta o suficiente para nos seguir durante o dia ou no início da noite.\n\n"
 ep3_laamp_flavour_ewan.4061.desc.outro:0 "Observando. Aguardando. A fome lentamente aumentando por sua refeição da noite."
 ep3_laamp_flavour_ewan.4061.desc.sight.blind:0 "Eu concentro minha mente"
 ep3_laamp_flavour_ewan.4061.desc.sight.sighted:0 "Eu concentro meus olhos"
 ep3_laamp_flavour_ewan.4061.desc.size.colossal:0 "três desaparecidos na noite passada, nada sobrando além de fragmentos de osso e a maior parte de um braço, consumidos por algum monstro colossal."
 ep3_laamp_flavour_ewan.4061.desc.size.huge:0 "dois desaparecidos na noite passada, o que restou deles encontrado não muito longe do perímetro, apenas retalhos emaranhados de carne deixados por alguma besta enorme."
 ep3_laamp_flavour_ewan.4061.desc.size.large:0 "outro seguidor abatido, a maior parte do corpo do homem encontrada ao lado de [ROOT.Char.Custom('GetRandomCampBuilding')] onde o grande animal o deixou."
 ep3_laamp_flavour_ewan.4061.desc.size.mammoth:0 "dois desaparecidos na noite passada, encontrados despedaçados e espalhados por meio milha por algum predador mamute."
 ep3_laamp_flavour_ewan.4061.desc.size.nimble:0 "outra vida desapareceu sem deixar rastro, exceto pelas leves marcas de arrasto e algumas manchas de sangue onde a criatura ágil incapacitou sua presa."
 ep3_laamp_flavour_ewan.4061.desc.size.titanic:0 "três desaparecidos na noite passada, nada restou deles além de manchas vermelhas e as trilhas lamacentas de algo verdadeiramente titânico."
 ep3_laamp_flavour_ewan.4061.desc.terrain.desert:0 "para o mar de dunas ao nosso redor. Parece tão aberto, mas um terror astuto da noite pode nadar por isso tão facilmente quanto um tubarão nas ondas."
 ep3_laamp_flavour_ewan.4061.desc.terrain.desert_mountains:0 "para os picos empoeirados e as cristas arenosas que nos protegem da brilhante luz da manhã. Muitos lugares para um terror faminto esperar o calor do dia."
 ep3_laamp_flavour_ewan.4061.desc.terrain.drylands:0 "para o solo seco e empoeirado por onde estamos nos movendo. Quebrado por colinas e árvores ocasionais, qualquer terror salivante poderia facilmente nos seguir por este terreno."
 ep3_laamp_flavour_ewan.4061.desc.terrain.farmlands:0 "para as terras agrícolas ao redor, um denso mar de sebes e campos pontuados por pequenos bosques. A cada seis metros pode haver outro terror escondido."
 ep3_laamp_flavour_ewan.4061.desc.terrain.floodplains:0 "para as planícies de inundação lamacentas, cercadas por árvores, por onde estamos nos movendo. Terreno perfeito para qualquer terror inclinado a emboscadas se esgueirar."
 ep3_laamp_flavour_ewan.4061.desc.terrain.forest:0 "para a cobertura de árvores que se estende em todas as direções. Denso demais para ver mais de trinta metros além do perímetro do acampamento, oferecendo muito espaço para o terror se esconder."
 ep3_laamp_flavour_ewan.4061.desc.terrain.hills:0 "para o tapete de colinas por onde nos movemos. Cada uma quebrando a fácil visão do lado oposto, facilitando para um terror animal nos seguir."
 ep3_laamp_flavour_ewan.4061.desc.terrain.jungle:0 "para o emaranhado de árvores e a densa copa coberta de vinhas acima. O terror animal pode estar a três metros de nós agora e nunca saberíamos."
 ep3_laamp_flavour_ewan.4061.desc.terrain.major_river:0 "para o rio que nosso caminho acompanha. Um corpo de água tão vasto pode esconder todo tipo de terrores submersos."
 ep3_laamp_flavour_ewan.4061.desc.terrain.mountains:0 "para os picos e cristas escarpados que se erguem sobre nós na pálida luz da manhã. Um número incontável de lugares para algum terror que habita cavernas se esconder."
 ep3_laamp_flavour_ewan.4061.desc.terrain.oasis:0 "$ep3_laamp_flavour_ewan.4061.desc.terrain.desert$"
 ep3_laamp_flavour_ewan.4061.desc.terrain.plains:0 "para as amplas e onduladas planícies por onde estamos nos movendo. Planas, mas não #EMP totalmente#! planas, com picos e vales suficientes para esconder todo tipo de terrores."
 ep3_laamp_flavour_ewan.4061.desc.terrain.steppe:0 "para o mar de grama ao nosso redor. Apenas um tolo pensaria que o terreno plano significa que não há onde se esconder, sem elevações ou vales, sem cavernas para conter estranhos terrores."
 ep3_laamp_flavour_ewan.4061.desc.terrain.taiga:0 "$ep3_laamp_flavour_ewan.4061.desc.terrain.forest$"
 ep3_laamp_flavour_ewan.4061.desc.terrain.wetlands:0 "para o horizonte nebuloso e os morros arredondados que pontuam as terras úmidas. A maior parte do chão é plano, mas não o suficiente para fornecer #EMP nenhuma#! cobertura para algum estranho terror."
 ep3_laamp_flavour_ewan.4061.size_adjective.colossal:0 "#EMP colossal#!"
 ep3_laamp_flavour_ewan.4061.size_adjective.huge:0 "#EMP enorme#!"
 ep3_laamp_flavour_ewan.4061.size_adjective.large:0 "#EMP grande#!"
 ep3_laamp_flavour_ewan.4061.size_adjective.mammoth:0 "#EMP mamute#!"
 ep3_laamp_flavour_ewan.4061.size_adjective.sizeable:0 "#EMP considerável#!"
 ep3_laamp_flavour_ewan.4061.size_adjective.titanic:0 "#BER titânico#!"
 ep3_laamp_flavour_ewan.4061.t:0 "Olhos na Noite"
 ep3_laamp_flavour_ewan.4062.a:0 "Cerquem, cerquem-no!"
 ep3_laamp_flavour_ewan.4062.b:0 "Atacá-lo, besta!"
 ep3_laamp_flavour_ewan.4062.c.tt.failure:0 "Apenas o deixando mais furioso"
 ep3_laamp_flavour_ewan.4062.c.tt.success:0 "Direto pelo olho"
 ep3_laamp_flavour_ewan.4062.c:0 "[huntsperson.GetFirstNameNoTooltip], soltem, SOLTEM!"
 ep3_laamp_flavour_ewan.4062.d.tt.failure:0 "Um espetáculo macabro"
 ep3_laamp_flavour_ewan.4062.d.tt.success:0 "O cachorro foi dominado"
 ep3_laamp_flavour_ewan.4062.d:0 "[kenneler.GetFirstNameNoTooltip], traga-me aquele cão!"
 ep3_laamp_flavour_ewan.4062.desc.animal.bear:0 "Um grunhido gutural de trás nos faz girar, onde o focinho ensanguentado de um urso nos observa com olhos excessivamente inteligentes. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate:0 "A criatura, sua armadilha tecida, parte em uma corrida."
 ep3_laamp_flavour_ewan.4062.desc.animal.cannibal_chad:0 "\"Eu não queria machucar ninguém\", se queixa uma voz tremula e desconhecida atrás de nós. Girando, encontramos... um homem? Um acadêmico de aparência estudiosa, até. Um que está totalmente fora de lugar aqui e agora. \"Eu só... eu precisava de #EMP carne#!. Eu ainda preciso dela!\", ele grita, com a arma subitamente em mãos enquanto salta direto para mim."
 ep3_laamp_flavour_ewan.4062.desc.animal.cannibal_existing.anna:0 "Um grito de pura raiva quebra nosso quase silêncio, antes que uma javelina lançada de uma altura que deve ter sido na altura da canela acerte um dos meus membros na base da coluna, derrubando-o instantaneamente. Girando, sou confrontado pelo rosto ensanguentado de um anão furioso, suas mãos cobertas de sangue segurando uma arma que segue diretamente para meu baixo ventre."
 ep3_laamp_flavour_ewan.4062.desc.animal.cannibal_existing.fallback:0 "\"Ora, ora, ora\", ri uma voz desconhecida atrás de nós. Como um só, giramos para encontrar um[Select_CString( cannibal.IsFemale, 'a', '' )] [cannibal.GetWomanMan], segurando uma arma e sorrindo loucamente. \"Parece que o almoço se entregou!\" [cannibal.GetSheHe] provoca, lançando [cannibal.GetHerselfHimself] diretamente em mim."
 ep3_laamp_flavour_ewan.4062.desc.animal.cannibal_existing.secret:0 "\"Eu tive que fazer isso. Eu #EMP tive#! que\", grita uma voz desconhecida e angustiada atrás de nós. Girando, encontramos um[Select_CString( cannibal.IsFemale, 'a', '' )]... [cannibal.GetWomanMan]? Apenas um[Select_CString( cannibal.IsFemale, 'a', '' )] [cannibal.GetWomanMan] — rosto e dentes cobertos de sangue vermelho enferrujado. \"Você não conhece a #EMP fome#!, você não — você #EMP não entenderá#!\", grita [Select_CString( cannibal.IsFemale, 'a', 'o' )] canibal enquanto [cannibal.GetSheHe] se lança em minha direção."
 ep3_laamp_flavour_ewan.4062.desc.animal.cannibal_generated:0 "\"Você foi o primeiro, sabia?\", murmura uma voz desconhecida de trás. Girando, encontramos um[Select_CString( cannibal.IsFemale, 'a', '' )] [cannibal.GetWomanMan] com cabelo emaranhado de sangue e pedaços de carne crua em seus dentes. \"Meu primeiro gosto — e que gosto foi! Mas você... você será um #EMP banquete#!\" Com a arma em mãos, o canibal se lança contra mim."
 ep3_laamp_flavour_ewan.4062.desc.animal.caracal:0 "Um rosnado alto de trás me faz girar, onde aguarda o rosto coberto de sangue de um caracal. Parece quase anormalmente grande para sua espécie, mais um pequeno leão do que um gato selvagem. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.crocodile:0 "Um rugido profundo e gutural de trás nos faz girar, onde o focinho de um crocodilo está apontado diretamente para nós — ainda coberto de vísceras dos meus seguidores. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.dog:0 "Um baixo rosnado vindo de trás me faz girar, onde um mastim feroz, com o focinho ainda ensopado pelo sangue dos assassinatos da noite passada, está quase sobre nós. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.hippo.fallback:0 "Um rugido profundo e retumbante de trás nos faz girar, onde a boca de um hipopótamo, com dentes grandes, nos aguarda. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.hippo.largest:0 "O rugido mais alto e mais bravo que já ouvi vem de trás de nós — ao girar, encontramos um hipopótamo. Com dentes como galhos de árvores e a massa de uma carroça carregada em músculos puros, pode ser a maior besta já encontrada. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.hyena:0 "Um riso maníaco de trás me faz girar, onde uma hiena — focinho ensopado de sangue e salpicada com pedaços de carne humana — nos observa faminta. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.leopard:0 "Um rosnado alto de trás me faz girar, onde uma leopardus raivoso — rosto e patas ainda ensopados de sangue — nos aguarda. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.lion:0 "Um rugido estrondoso de trás nos faz girar, onde um único leão — focinho atarracado ainda coberto de vísceras da noite anterior — ofega com fome óbvia. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.lynx:0 "Um sussurro baixo de trás me faz girar, onde uma lince — olhos brilhando com astúcia sobrenatural, avança à vista. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.panther:0 "Um rosnado alto de trás me faz girar, onde fico quase atordoado ao ver uma pantera negra em onyx nos encarar, ainda cheia de adrenalina e sede de sangue de sua caça noturna. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.tiger:0 "Um rugido arrepiante de trás nos faz girar, onde um tigre, ainda fedendo das mortes da noite, nos observa faminto. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.wolf:0 "Um rosnado feroz atrás de nós me faz girar, onde sou confrontado por um lobo, olhos em chamas com fome feroz, dentes estalando, grossos pedaços de saliva voando de sua boca. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.intro:0 "Não podemos nos dar ao luxo de esperar outra noite para escapar da coisa. Reunindo meu grupo de caça, pretendo acabar com isso, e para fazer isso, esta mesma manhã.\n\nAs pegadas da besta"
 ep3_laamp_flavour_ewan.4062.desc.terrain.connector:0 "onde as pegadas simplesmente parecem desaparecer.\n\n"
 ep3_laamp_flavour_ewan.4062.desc.terrain.desert:0 "chegamos à base de uma duna alta"
 ep3_laamp_flavour_ewan.4062.desc.terrain.desert_mountains:0 "$ep3_laamp_flavour_ewan.4062.desc.terrain.mountains$"
 ep3_laamp_flavour_ewan.4062.desc.terrain.drylands:0 "chegamos a um vale empoeirado"
 ep3_laamp_flavour_ewan.4062.desc.terrain.farmlands:0 "chegamos a uma abertura em uma longa sebe"
 ep3_laamp_flavour_ewan.4062.desc.terrain.floodplains:0 "chegamos a uma estreita península"
 ep3_laamp_flavour_ewan.4062.desc.terrain.forest:0 "chegamos a um amplo bosque"
 ep3_laamp_flavour_ewan.4062.desc.terrain.hills:0 "ultrapassamos a elevação de uma colina alta"
 ep3_laamp_flavour_ewan.4062.desc.terrain.jungle:0 "chegamos a uma ampla clareira na selva"
 ep3_laamp_flavour_ewan.4062.desc.terrain.major_river:0 "chegamos a um trecho arenoso de praia ao longo do rio"
 ep3_laamp_flavour_ewan.4062.desc.terrain.mountains:0 "chegamos à borda de um penhasco íngreme"
 ep3_laamp_flavour_ewan.4062.desc.terrain.oasis:0 "$ep3_laamp_flavour_ewan.4062.desc.terrain.desert$"
 ep3_laamp_flavour_ewan.4062.desc.terrain.plains:0 "atravessamos uma colina baixa"
 ep3_laamp_flavour_ewan.4062.desc.terrain.steppe:0 "chegamos a um desfiladeiro rochoso"
 ep3_laamp_flavour_ewan.4062.desc.terrain.taiga:0 "$ep3_laamp_flavour_ewan.4062.desc.terrain.forest$"
 ep3_laamp_flavour_ewan.4062.desc.terrain.wetlands:0 "chegamos a uma área de solo mais seco"
 ep3_laamp_flavour_ewan.4062.desc.tracks.canine:0 "são suaves e difíceis de seguir, mas inconfundivelmente caninas."
 ep3_laamp_flavour_ewan.4062.desc.tracks.connector:0 "Depois de quase uma hora,"
 ep3_laamp_flavour_ewan.4062.desc.tracks.crocodyline:0 "parecem mais com... mãos humanas, arrastando-se com dedos pontudos."
 ep3_laamp_flavour_ewan.4062.desc.tracks.feline:0 "são mal perceptíveis, embora pareçam ser felinas."
 ep3_laamp_flavour_ewan.4062.desc.tracks.hippopotomine:0 "são pesadas e... estranhas. Não consigo identificá-las."
 ep3_laamp_flavour_ewan.4062.desc.tracks.human:0 "são leves como um sussurro e indetectáveis, como se estivessem deliberadamente disfarçadas."
 ep3_laamp_flavour_ewan.4062.desc.tracks.ursine:0 "são surpreendentemente leves, mas claramente ursinas."
 ep3_laamp_flavour_ewan.4062.e:0 "Prepare-se para morrer, monstro!"
 ep3_laamp_flavour_ewan.4062.t.bear:0 "$ep3_laamp_flavour_ewan.4061.t$: Urso"
 ep3_laamp_flavour_ewan.4062.t.cannibal_chad:0 "$ep3_laamp_flavour_ewan.4062.t.cannibal_generated$"
 ep3_laamp_flavour_ewan.4062.t.cannibal_existing:0 "$ep3_laamp_flavour_ewan.4062.t.cannibal_generated$"
 ep3_laamp_flavour_ewan.4062.t.cannibal_generated:0 "$ep3_laamp_flavour_ewan.4061.t$: Canibal"
 ep3_laamp_flavour_ewan.4062.t.caracal:0 "$ep3_laamp_flavour_ewan.4061.t$: Caracal"
 ep3_laamp_flavour_ewan.4062.t.crocodile:0 "$ep3_laamp_flavour_ewan.4061.t$: Crocodilo"
 ep3_laamp_flavour_ewan.4062.t.dog:0 "$ep3_laamp_flavour_ewan.4061.t$: Cão Feral"
 ep3_laamp_flavour_ewan.4062.t.hippo:0 "$ep3_laamp_flavour_ewan.4061.t$: HIPOPÓTAMO!"
 ep3_laamp_flavour_ewan.4062.t.hyena:0 "$ep3_laamp_flavour_ewan.4061.t$: Hiena"
 ep3_laamp_flavour_ewan.4062.t.leopard:0 "$ep3_laamp_flavour_ewan.4061.t$: Leopardo"
 ep3_laamp_flavour_ewan.4062.t.lion:0 "$ep3_laamp_flavour_ewan.4061.t$: Leão"
 ep3_laamp_flavour_ewan.4062.t.lynx:0 "$ep3_laamp_flavour_ewan.4061.t$: Lince"
 ep3_laamp_flavour_ewan.4062.t.panther:0 "$ep3_laamp_flavour_ewan.4061.t$: Pantera"
 ep3_laamp_flavour_ewan.4062.t.tiger:0 "$ep3_laamp_flavour_ewan.4061.t$: Tigre"
 ep3_laamp_flavour_ewan.4062.t.wolf:0 "$ep3_laamp_flavour_ewan.4061.t$: Lobo"
 ep3_laamp_flavour_ewan.4062.tt.failure:0 "A besta escapa"
 ep3_laamp_flavour_ewan.4062.tt.success:0 "A besta cai para os seus números"
 ep3_laamp_flavour_ewan.4064.a.is_cannibal:0 "Bem, agora #EMP estou#! com fome..."
 ep3_laamp_flavour_ewan.4064.a.not_cannibal:0 "Uma loucura perversa."
 ep3_laamp_flavour_ewan.4064.desc:0 "O corpo do canibal tomba para trás, com o sangue jorrando primeiro e depois escorrendo de seus ferimentos fatais.\n\nNão era o resultado que eu esperava, com certeza, mas o mundo não pode dizer que eu não matei um devorador de homens de qualquer forma.\n\nÀ medida que a tensão da luta se esvai do meu corpo, um coro de aplausos ecoa do resto do grupo de caça. Dou uma última olhada para [Select_CString( cannibal.IsFemale, 'a', 'o' )] [cannibal.GetWomanMan] deitad[Select_CString( cannibal.IsFemale, 'a', 'o' )] mort[Select_CString( cannibal.IsFemale, 'a', 'o' )] no chão e me viro para voltar para casa."
 ep3_laamp_flavour_ewan.4064.t:0 "$ep3_laamp_flavour_ewan.4061.t$: Duelo Vitorioso"
 ep3_laamp_flavour_ewan.4071.a.tt.failure:0 "Uma luta brutal"
 ep3_laamp_flavour_ewan.4071.a.tt.success:0 "Seus defensores avançam"
 ep3_laamp_flavour_ewan.4071.a:0 "Reúnam-se! Reúnam-se e exterminem esses escórias!"
 ep3_laamp_flavour_ewan.4071.b:0 "Enfrente o mercador de escravos líder em um duelo."
 ep3_laamp_flavour_ewan.4071.c.sale_explanation.death:0 "Vender um [character|E] para a escravidão o removerá do jogo, contando efetivamente como a [character_death_death|E]"
 ep3_laamp_flavour_ewan.4071.c.sale_explanation.limitations:0 "Qualquer um que seja importante para você, especialmente habilidoso, ou que esteja doente ou ferido está isento da venda"
 ep3_laamp_flavour_ewan.4071.c.sale_explanation.profit:0 "Você será paga [gold|E] equivalente à soma das [skills|E] dos seus cinco piores [followers|E]"
 ep3_laamp_flavour_ewan.4071.c:0 "Negocie e venda alguns seguidores menos importantes."
 ep3_laamp_flavour_ewan.4071.d.tt.failure:0 "Lamentos se afastando na noite"
 ep3_laamp_flavour_ewan.4071.d.tt.success:0 "[ROOT.Char.GetFaith.FateGodName] sorri para você"
 ep3_laamp_flavour_ewan.4071.d:0 "Ignore os gritos e espere o melhor."
 ep3_laamp_flavour_ewan.4071.desc:0 "A emboscada é desencadeada de forma habilidosa.\n\nUm estrangulamento vulnerável no terreno permite que uma horda de mercadores de escravos — algemas e espadas em mãos — nos ataque de dois lados enquanto um terceiro grupo atrasa o corpo principal do comboio, impedindo sua ajuda. Um coro de gritos irrompe daqueles em meu grupo que não têm armas, ao perceberem a realidade.\n\nSe esses monstros vencerem, um destino horrível aguarda muitos de nós."
 ep3_laamp_flavour_ewan.4071.t:0 "Mercadores de Escravos"
 ep3_laamp_flavour_ewan.4073.a:0 "Isso é o que eu penso de você, escória."
 ep3_laamp_flavour_ewan.4073.desc:0 "A morte d[Select_CString( slaver.IsFemale, 'a', 'o' )] [slaver.GetWomanMan] envia uma onda de confusão em pânico pelas fileiras dos inimigos.\n\nA batalha ao meu redor muda, um coro de gritos e gorgolejos molhados se ergue do inimigo enquanto os traficantes de escravos são abatidos a dezenas, morrendo em massa. Em minutos, uma força de alívio do corpo principal do comboio rompe a retaguarda dos mercadores de escravos, e tudo acaba.\n\nCom um chute desprezível, dou uma rasteira no que resta do líder deles, de cara para baixo no [ROOT.Char.Custom('GritType')]."
 ep3_laamp_flavour_ewan.4073.t:0 "$ep3_laamp_flavour_ewan.4071.t$: Duelo Vitorioso"
 ep3_laamp_flavour_ewan.4081.a.tt.failure:0 "Palavras significam pouco para eles"
 ep3_laamp_flavour_ewan.4081.a.tt.success:0 "Você consegue acalmar a multidão"
 ep3_laamp_flavour_ewan.4081.a:0 "Tente acalmar a multidão."
 ep3_laamp_flavour_ewan.4081.b.tt.failure:0 "Frenesi de fome"
 ep3_laamp_flavour_ewan.4081.b.tt.success.every_callous_greedy_or_sadistic_follower:0 "Cada [follower|E] [GetTrait('greedy').GetName( GetNullCharacter )] ou [GetTrait('sadistic').GetName( GetNullCharacter )]"
 ep3_laamp_flavour_ewan.4081.b.tt.success.every_compassionate_or_generous_follower:0 "Cada [follower|E] [GetTrait('compassionate').GetName( GetNullCharacter )] ou [GetTrait('generous').GetName( GetNullCharacter )]"
 ep3_laamp_flavour_ewan.4081.b.tt.success:0 "Um lucro saudável"
 ep3_laamp_flavour_ewan.4081.b:0 "Se eles querem provisões, devem #EMP pagar!#!"
 ep3_laamp_flavour_ewan.4081.c.tt.failure:0 "Você não consegue deter todos"
 ep3_laamp_flavour_ewan.4081.c.tt.success:0 "Seus retentores armados quebram ossos suficientes"
 ep3_laamp_flavour_ewan.4081.c:0 "Forçe essa turba para trás."
 ep3_laamp_flavour_ewan.4081.d:0 "Simplesmente deixe-os levar algumas provisões"
 ep3_laamp_flavour_ewan.4081.desc.epidemic:0 "eles parecem doentes, infectados com alguma doença terrível, sem dúvida —"
 ep3_laamp_flavour_ewan.4081.desc.intro:0 "A princípio, são apenas alguns camponeses magros de [current_county.GetCountyData.GetCulture.GetName] que vemos. Eles aparecem à distância, ou espiando por pequenas características do terreno, fugindo quando nos notam.\n\nHoras passam, os locais assustados nos observando de longe o tempo todo.\n\nQuando parece que finalmente se afastaram, um grito se ergue e uma horda frenética avança contra nós a partir da cobertura de uma crista. Com os olhos selvagens e emagrecidos,"
 ep3_laamp_flavour_ewan.4081.desc.mundane:0 "eles parecem frágeis, nas primeiras etapas da fome, sem dúvida —"
 ep3_laamp_flavour_ewan.4081.desc.outro:0 "embora não tão fracos que não pudessem roubar muitas de nossas provisões antes de serem afastados."
 ep3_laamp_flavour_ewan.4081.t:0 "Nascidos da Desesperação"
 ep3_laamp_flavour_ewan.4091.a.tt.failure:0 "Sangrentos e quebrados"
 ep3_laamp_flavour_ewan.4091.a.tt.success:0 "Uma vitória tática"
 ep3_laamp_flavour_ewan.4091.a:0 "Contra-ataquem, comigo!"
 ep3_laamp_flavour_ewan.4091.b.tt.failure:0 "$ep3_laamp_flavour_ewan.4091.a.tt.failure$"
 ep3_laamp_flavour_ewan.4091.b.tt.success:0 "Um ataque bem-sucedido"
 ep3_laamp_flavour_ewan.4091.b:0 "Vou para o combate!"
 ep3_laamp_flavour_ewan.4091.c.every_non_craven_follower:0 "Cada [follower|E] não [GetTrait('craven').GetName( GetNullCharacter )]"
 ep3_laamp_flavour_ewan.4091.c:0 "Esconda-se do caos."
 ep3_laamp_flavour_ewan.4091.desc:0 "É de noite quando os atacantes caem sobre nosso perímetro, um grupo heterogêneo de armaduras brilhantes e armas reluzentes iluminadas apenas pela luz distante do fogo.\n\nSe estão usando alguma cor, não são visíveis, mas suas intenções são claras. Remover-nos de [current_county.GetBaseNameNoTier], mortos ou vivos.\n\nO acampamento não está sem defensores, e com um grito de indignação nos preparamos para repelir essa praga local."
 ep3_laamp_flavour_ewan.4091.t:0 "Ataque Noturno"
 ep3_laamp_flavour_ewan.9511.a:0 "Bem-vindo, bem-vindo!"
 ep3_laamp_flavour_ewan.9511.b:0 "#EMP Casado?#! De jeito nenhum!"
 ep3_laamp_flavour_ewan.9511.c:0 "Você não é mais necessário. Vá embora."
 ep3_laamp_flavour_ewan.9511.desc.intro:0 "Depois de anos longe com [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstName], m[Select_CString( visitor.IsFemale, 'inha', 'eu' )] seguidor[Select_CString( visitor.IsFemale, 'a', '' )] leal [visitor.GetFirstNameNicknamed] finalmente encontrou seu caminho de volta até nós.\n\n"
 ep3_laamp_flavour_ewan.9511.desc.outro:0 "\n\nVelhos amigos e rostos novos se agitam para ver [Select_CString( visitor.IsFemale, 'a', 'o' )] [visitor.GetWomanMan] retornad[Select_CString( visitor.IsFemale, 'a', 'o' )], todos igualmente felizes com uma boa notícia inesperada."
 ep3_laamp_flavour_ewan.9511.desc.spouse.got_married:0 "Embora [visitor.GetSheHe] mesm[Select_CString( visitor.IsFemale, 'a', 'o' )] não tenha mudado muito desde que se afastou de [ROOT.Char.GetPrimaryTitle.GetDefinitiveName], parece que [visitor.GetSheHe] #EMP adquiriu#! um[Select_CString( visitor_spouse.IsFemale, 'a', '' )] [visitor_spouse.Custom('WifeHusband')] local de [capital.GetBaseNameNoTier] — [visitor_spouse.GetFirstName], que acompanhou s[Select_CString( visitor.IsFemale, 'ua', 'eu' )] [visitor.Custom('WifeHusband')] de volta ao acampamento."
 ep3_laamp_flavour_ewan.9511.desc.spouse.nope:0 "[visitor.GetSheHe|U] mal mudou desde o dia em que [visitor.GetSheHe] deixou [ROOT.Char.GetPrimaryTitle.GetDefinitiveName], para o bem ou para o mal, e está principalmente contente por estar de volta entre pessoas conhecidas."
 ep3_laamp_flavour_ewan.9511.t:0 "Seguido Retornado: [visitor.GetTitledFirstNameNicknamedNoTooltip]"
 ep3_laamp_flavour_ewan.9512.a:0 "Como você cresceu, [visitor.GetFirstNameNoTooltip]!"
 ep3_laamp_flavour_ewan.9512.b:0 "Vá embora, vagabundo."
 ep3_laamp_flavour_ewan.9512.desc:0 "\"[ROOT.Char.GetTitledFirstNameNoTooltip]!\" — grita a voz semi-familiar de [visitor.GetFirstName], entrando no acampamento com entusiasmo após alguns anos afastado de [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]. \"Eu voltei, e não estive ocioso durante meu exílio!\"\n\nDe fato, [visitor.GetSheHe] não esteve — parece que o tempo [visitor.GetHerHim] com [host.GetTitledFirstName] deu a [visitor.GetSheHe] ampla oportunidade para praticar suas habilidades, algo que [visitor.GetSheHe] parece ansioso para colocar em uso agora que [visitor.GetSheHe] está de volta conosco."
 ep3_laamp_flavour_ewan.9512.t:0 "Retorno do Seguidor Melhorado: [visitor.GetTitledFirstNameNicknamedNoTooltip]"
 ep3_laamp_flavour_ewan.9521.a.changed_away:0 "Peculiar, mas você ainda é um de nós!"
 ep3_laamp_flavour_ewan.9521.a.changed_to:0 "Uma decisão sensata!"
 ep3_laamp_flavour_ewan.9521.a.uninvolved:0 "Bem-vindo de volta!"
 ep3_laamp_flavour_ewan.9521.b:0 "Não precisamos de algum/a #EMP [visitor.GetCulture.GetNameNoTooltip]#! estranho/a, saia fora."
 ep3_laamp_flavour_ewan.9521.desc.intro:0 "Depois de alguns anos longe de nós, m[Select_CString( visitor.IsFemale, 'inha', 'eu' )] seguidor[Select_CString( visitor.IsFemale, 'a', '' )] [visitor.GetTitledFirstNameNicknamed] finalmente retornou.\n\nAinda assim... [visitor.GetSheHe] não é exatamente como [visitor.GetSheHe] nos deixou."
 ep3_laamp_flavour_ewan.9521.desc.outro:0 "\n\n[visitor.GetFirstNameNoTooltip] mesm[Select_CString( visitor.IsFemale, 'a', 'o' )] parece não estar perturbado por sua metamorfose, simplesmente contente por estar de volta no acampamento."
 ep3_laamp_flavour_ewan.9521.desc.reaction.changed_away:0 "Sendo [old_culture.GetNameNoTooltip] eu mesmo, essa mudança é... inquietante."
 ep3_laamp_flavour_ewan.9521.desc.reaction.changed_to:0 "Claro, sendo [new_culture.GetNameNoTooltip] eu mesmo, poderia ter educado [visitor.GetSheHe] perfeitamente bem #EMP sem#! precisar passar anos longe de nós."
 ep3_laamp_flavour_ewan.9521.desc.reaction.uninvolved:0 "É estranho ver como o tempo mudou [visitor.GetSheHe], mas suponho que todos nós passamos por períodos de transição."
 ep3_laamp_flavour_ewan.9521.desc.source.capital:0 "Claramente os dias [visitor.GetHerHim] em [capital.GetBaseNameNoTier] foram formativos, pois todos os vestígios dos antigos modos [old_culture.GetName] [visitor.GetHerHim] desapareceram, substituídos pela fala e pelos modos dos [new_culture.GetCollectiveNoun].\n\n"
 ep3_laamp_flavour_ewan.9521.desc.source.host:0 "Parece que o tempo passado com [host.GetTitledFirstName] deixou uma marca indelével nos modos e no caráter [visitor.GetHerHim] — [visitor.GetSheHe] parece muito mais [new_culture.GetName] do que [old_culture.GetName] agora.\n\n"
 ep3_laamp_flavour_ewan.9521.t:0 "Não É Como Eu Me Lembro de Você: [visitor.GetTitledFirstNameNicknamedNoTooltip]"
 ep3_laamp_flavour_ewan.9521.tt.primary_skill.diplomacy:0 "Ganhou [skill_1.GetValue|V0] de [skill|E] em [diplomacy|E] ao aprender a adotar a [ethos|E] [new_culture.GetName]"
 ep3_laamp_flavour_ewan.9521.tt.primary_skill.learning:0 "Ganhou [skill_1.GetValue|V0] de [skill|E] em [learning|E] ao aprender a adotar a [ethos|E] [new_culture.GetName]"
 ep3_laamp_flavour_ewan.9521.tt.primary_skill.martial:0 "Ganhou [skill_1.GetValue|V0] de [skill|E] em [martial|E] ao aprender a adotar a [ethos|E] [new_culture.GetName]"
 ep3_laamp_flavour_ewan.9521.tt.primary_skill.stewardship:0 "Ganhou [skill_1.GetValue|V0] de [skill|E] em [stewardship|E] ao aprender a adotar a [ethos|E] [new_culture.GetName]"
 ep3_laamp_flavour_ewan.9521.tt.secondary_skill.diplomacy:0 "Ganhou [skill_2.GetValue|V0] de [skill|E] em [diplomacy|E] ao aprender a adotar a [ethos|E] [new_culture.GetName]"
 ep3_laamp_flavour_ewan.9521.tt.secondary_skill.intrigue:0 "Ganhou [skill_2.GetValue|V0] de [skill|E] em [intrigue|E] ao aprender a adotar a [ethos|E] [new_culture.GetName]"
 ep3_laamp_flavour_ewan.9521.tt.secondary_skill.learning:0 "Ganhou [skill_2.GetValue|V0] de [skill|E] em [learning|E] ao aprender a adotar a [ethos|E] [new_culture.GetName]"
 ep3_laamp_flavour_ewan.9521.tt.secondary_skill.prowess:0 "Ganhou [skill_2.GetValue|V0] de [skill|E] em [prowess|E] ao aprender a adotar a [ethos|E] [new_culture.GetName]"
 ep3_laamp_flavour_ewan.9521.tt.secondary_skill.stewardship:0 "Ganhou [skill_2.GetValue|V0] de [skill|E] em [stewardship|E] ao aprender adotar a [ethos|E] [new_culture.GetName]"
 ep3_laamp_flavour_ewan.9522.a:0 "Bem-vindo, [visitor.Custom('SisterBrother')]!"
 ep3_laamp_flavour_ewan.9522.b:0 "Mas por que se converter a [new_faith.GetNameNoTooltip]..."
 ep3_laamp_flavour_ewan.9522.c:0 "O que você fez, seu tolo?!"
 ep3_laamp_flavour_ewan.9522.d:0 "[old_faith.GetAdherentNameNoTooltip], [new_faith.GetAdherentNameNoTooltip], você ainda é [visitor.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.9522.desc.intro:0 "Embora tenha levado vários longos anos, eventualmente [Select_CString( visitor.IsFemale, 'minha antiga seguidora', 'meu antigo seguidor' )] [visitor.GetTitledFirstNameNicknamed] encontrou seu caminho de volta a [ROOT.Char.GetPrimaryTitle.GetDefinitiveName].\n\nSomente... algo mudou —"
 ep3_laamp_flavour_ewan.9522.desc.outro:0 "\n\nDesprezando o alvoroço que o retorno repentino e as mudanças [visitor.GetHerHim] trazem, [visitor.GetFirstNameNoTooltip] simplesmente cuida de seus negócios como se [visitor.GetSheHe] nunca tivesse partido."
 ep3_laamp_flavour_ewan.9522.desc.reaction.changed_away:0 "Deixar para trás o modo de vida [old_faith.GetAdjectiveNoTooltip], lançar fora nossas tradições mais sagradas como uma capa jogada ao chão, é quase impensável."
 ep3_laamp_flavour_ewan.9522.desc.reaction.changed_to_acceptable:0 "Não posso afirmar saber o que motivou a escolha d[Select_CString( visitor.IsFemale, 'a', 'o' )] [visitor.GetWomanMan], mas pelo menos [new_faith.GetNameNoTooltip] é uma fé mais aceitável do que muitas neste mundo sem deus."
 ep3_laamp_flavour_ewan.9522.desc.reaction.changed_to_lovable:0 "Embora a escolha tenha me surpreendido, não posso dizer que [new_faith.GetNameNoTooltip] seja uma má maneira de viver. O [ROOT.Char.GetFaith.GetName] pensa muito bem disso, afinal."
 ep3_laamp_flavour_ewan.9522.desc.reaction.changed_to_ours:0 "Naturalmente, estou exultante em saber da escolha correta [visitor.GetHerHim], abraçando a salvação e o verdadeiro significado da existência com [new_faith.HighGodName]."
 ep3_laamp_flavour_ewan.9522.desc.reaction.give_a_shit:0 "Não que isso importe tanto para mim quanto para alguns, mas ainda assim, é surpreendente."
 ep3_laamp_flavour_ewan.9522.desc.reaction.uninvolved:0 "Sendo eu mesmo [ROOT.Char.GetFaith.GetAdjective], a conversão [visitor.GetHerHim] não importa #EMP muito#! para mim, mas é certamente inesperada."
 ep3_laamp_flavour_ewan.9522.desc.source.bridge:0 "em vez do/a [old_faith.GetAdherentName] que deixamos para trás.\n\n"
 ep3_laamp_flavour_ewan.9522.desc.source.capital:0 "[visitor.GetSheHe] fala sobre a luz de [new_faith.GetName], as crenças de [capital.GetBaseNameNoTier], com reverência, afirmando ter encontrado a verdadeira salvação com os ensinamentos de [new_faith.HighGodNamePossessive]"
 ep3_laamp_flavour_ewan.9522.desc.source.host:0 "[visitor.GetSheHe] fala sobre seu [new_faith.CreatorName] [new_faith.GetAdjective] d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstName] com reverência, afirmando ter encontrado a verdadeira salvação com os ensinamentos de [new_faith.GetNameNoTooltip]"
 ep3_laamp_flavour_ewan.9522.e:0 "Bom ter você de volta, [visitor.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.9522.f:0 "Você não é mais bem-vindo aqui."
 ep3_laamp_flavour_ewan.9522.t:0 "$ep3_laamp_flavour_ewan.9521.t$"
 ep3_laamp_flavour_ewan.9523.a:0 "$ep3_laamp_flavour_ewan.9522.a$"
 ep3_laamp_flavour_ewan.9523.b:0 "$ep3_laamp_flavour_ewan.9522.b$"
 ep3_laamp_flavour_ewan.9523.c:0 "$ep3_laamp_flavour_ewan.9522.c$"
 ep3_laamp_flavour_ewan.9523.d:0 "$ep3_laamp_flavour_ewan.9522.d$"
 ep3_laamp_flavour_ewan.9523.desc.intro:0 "$ep3_laamp_flavour_ewan.9522.desc.intro$ [visitor.GetSheHe] fala e se veste mais como os [new_culture.GetCollectiveNoun] com quem [visitor.GetSheHe] ficou, e afirma ter encontrado a luz da verdadeira fé [new_faith.GetAdjective]"
 ep3_laamp_flavour_ewan.9523.desc.outro:0 "$ep3_laamp_flavour_ewan.9522.desc.outro$"
 ep3_laamp_flavour_ewan.9523.desc.reaction.changed_away:0 "$ep3_laamp_flavour_ewan.9522.desc.reaction.changed_away$"
 ep3_laamp_flavour_ewan.9523.desc.reaction.changed_to_acceptable:0 "$ep3_laamp_flavour_ewan.9522.desc.reaction.changed_to_acceptable$"
 ep3_laamp_flavour_ewan.9523.desc.reaction.changed_to_lovable:0 "$ep3_laamp_flavour_ewan.9522.desc.reaction.changed_to_lovable$"
 ep3_laamp_flavour_ewan.9523.desc.reaction.changed_to_ours:0 "$ep3_laamp_flavour_ewan.9522.desc.reaction.changed_to_ours$"
 ep3_laamp_flavour_ewan.9523.desc.reaction.give_a_shit:0 "$ep3_laamp_flavour_ewan.9522.desc.reaction.give_a_shit$"
 ep3_laamp_flavour_ewan.9523.desc.reaction.uninvolved:0 "$ep3_laamp_flavour_ewan.9522.desc.reaction.uninvolved$"
 ep3_laamp_flavour_ewan.9523.desc.source.bridge:0 "em vez de [old_faith.GetAdherentName] que deixamos para trás.\n\n"
 ep3_laamp_flavour_ewan.9523.desc.source.capital:0 "[capital.GetBaseNameNoTier]"
 ep3_laamp_flavour_ewan.9523.desc.source.host:0 "[Select_CString( host.IsFemale, 'Sua anfitriã', 'Seu anfitrião' )] [host.GetTitledFirstName]"
 ep3_laamp_flavour_ewan.9523.e:0 "$ep3_laamp_flavour_ewan.9522.e$"
 ep3_laamp_flavour_ewan.9523.f:0 "$ep3_laamp_flavour_ewan.9522.f$"
