 guide_map:0 "Mapas Detalhados"
 guide_map_desc:0 "Este conjunto de mapas mostra o relevo da terra em grande detalhe, em grande parte do mundo conhecido. É particularmente útil ao navegar por terrenos difíceis e traiçoeiros."
 handcrafted_map:0 "Mapa Iluminado de [kingdom.GetBaseNameNoTierNoTooltip]"
 handcrafted_map_desc.boilerplate:0 "Este mapa cuidadosamente elaborado cobre toda a extensão de [kingdom.GetBaseNameNoTier], seus territórios fronteiriços e seus vizinhos mais importantes.\n\nAtenção particular foi dada a"
 handcrafted_map_desc.fauna:0 "as criaturas da terra, desde o menor jogo e as menores aves até os reis e rainhas locais do reino animal — ilustrações de muitas delas enchem as margens e saltitam por qualquer espaço em branco disponível."
 handcrafted_map_desc.flora:0 "a vegetação da terra, desde a menor erva daninha até a maior e mais expansiva árvore — uma espessa borda de flores afunila suas bordas, cada uma meticulosamente detalhada."
 handcrafted_map_desc.geography:0 "a geografia, anotando regiões, características principais dos vários terrenos locais e até mesmo contornos aproximados sempre que possível."
 handcrafted_map_desc.government:0 "como os locais conduzem os negócios do governo, quem são seus líderes mais famosos e como se legitimam. Pequenos retratos de monarcas celebrados ocupam cada canto."
 handcrafted_map_desc.mythic_beasts:0 "detalhar mitos e lendas locais, pintando monstros, bestas e coisas estranhas nos cantos e recantos onde se supõe que se escondem."
 handcrafted_map_desc.people.rural:0 "anotando os hábitos e reputações das pessoas das muitas áreas rurais: onde a classe camponesa negocia com mais firmeza, quem cultiva as melhores uvas e onde é mais provável que se tornem um pouco... excessivamente íntimos entre familiares."
 handcrafted_map_desc.people.urban:0 "anotando os hábitos e reputações das pessoas de seus principais centros urbanos: quem é bom para convidar para um jantar formal, quem cria os melhores cavalos, quem é mais facilmente enganado, e assim por diante."
 handcrafted_map_desc.routes:0 "os caminhos mais curtos, as estradas mais bem conservadas e as rotas mais seguras para se mover — pequenas ilustrações de feras, bandidos e bárbaros marcam claramente as áreas mais perigosas."
 handcrafted_map_desc.settlements:0 "os assentamentos que pontilham a terra, cobrindo cada cidade importante, cada vila, até algumas das maiores aldeias — a capital sozinha é muito ampliada e tem distritos individuais marcados."
 handcrafted_map_desc.tourism_sites:0 "marcos interessantes que peregrinos, viajantes e aventureiros de todos os tipos podem desejar visitar — os locais maiores até apresentam pequenas ilustrações."
