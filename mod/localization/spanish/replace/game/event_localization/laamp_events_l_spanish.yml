 ep3_laamps.0001.a:0 "Um dia, eu #EMP vou#! recuperar minhas terras!"
 ep3_laamps.0001.b:0 "Tudo recai sobre [Select_CString( alt_1.IsFemale, 'a', 'o' )] [alt_1.GetFirstNameNoTooltipRegnal]."
 ep3_laamps.0001.c:0 "[alt_2.GetFirstNameNoTooltipRegnal] deve forjar o futuro da nossa casa."
 ep3_laamps.0001.d:0 "Agora olhamos para [Select_CString( alt_3.IsFemale, 'a', 'o' )] [alt_3.GetFirstNameNoTooltipRegnal]."
 ep3_laamps.0001.desc:0 "Estou lançado à selvageria, enquanto [Select_CString( winner.IsFemale, 'a', 'o' )] [winner.GetTitledFirstName] e seus soldados celebram sua vitória!\n\nPerdi o trono [lost_primary_title.GetAdjectiveNoTooltip]... e aquel[Select_CString( winner.IsFemale, 'a', 'e' )] [winner.Custom2('InsultNoun', ROOT.Char)] [winner.Custom('PersonalityGetNegativeTraitDesc')] pode neste exato momento estar assumindo os ornamentos do #EMP meu#! [lost_primary_title.GetTierAsNameNoTooltip]!"
 ep3_laamps.0001.e:0 "O tempo passou..."
 ep3_laamps.0001.fallback:0 "Esta miserável guerra tirou tudo de mim!"
 ep3_laamps.0001.intro:0 "Derrota vil e ignominiosa!"
 ep3_laamps.0001.memory:0 "Esta miserável [war_memory.MakeScope.Var('war_cb').GetFlagName] tirou tudo de mim!"
 ep3_laamps.0001.t.female:0 "Uma vez e Antiga [lost_primary_title.Custom('GetTierBaseTitleFemale')]"
 ep3_laamps.0001.t.male:0 "Uma vez e Antigo [lost_primary_title.Custom('GetTierBaseTitleMale')]"
 ep3_laamps.0003.a:0 "Haha! O tolo tem coragem!"
 ep3_laamps.0003.desc:0 "Você e seus vis exércitos podem ter arrancado de mim meu [lost_primary_title.GetTierAsNameNoTooltip|l], mas marque minhas palavras: eu ainda não terminei, nem desistirei de [lost_primary_title.GetBaseNameNoTierNoTooltip] tão facilmente!"
 ep3_laamps.0003.opening:0 "[adventurer.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 ep3_laamps.0004.desc:0 "Esses malditos traidores tomaram meu [conquered.GetTierAsNameNoTooltip|l], lançando-me à selvageria, enquanto [Select_CString( winner.IsFemale, 'a', 'o' )] [winner.GetTitledFirstName] e seus soldados aclamam [Select_CString( heir.IsFemale, 'a', 'o' )] [heir.GetTitledFirstName] em meu lugar!\n\nEu permiti que renegados e mentirosos tomassem de mim o trono [conquered.GetAdjectiveNoTooltip]... somos verdadeiramente apenas os brinquedos de [ROOT.Char.GetFaith.FateGodName]..."
 ep3_laamps.0010.a:0 "Ai, alguns não estão destinados a governar..."
 ep3_laamps.0010.b:0 "...embora eu #EMP realmente inveje#! a liberdade d[Select_CString( potential_laamp.IsFemale, 'a', 'o' )] [potential_laamp.GetFirstNamePossessiveNoTooltip]."
 ep3_laamps.0010.connector:0 "e"
 ep3_laamps.0010.desc:0 "e eu lamentamos a perda [Select_CString( deceased.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('deceased'))], [deceased.GetTitledFirstNameRegnal], ocupamo-nos com a divisão das terras [deceased.GetHerHim].\n\n[inherited.GetBaseNameNoTierNoTooltip] coube a mim,"
 ep3_laamps.0010.inheritor_1:0 "[inherited_1.GetBaseNameNoTierNoTooltip] para [Select_CString( inheritor_1.IsFemale, 'a', 'o' )] [inheritor_1.GetFirstName];"
 ep3_laamps.0010.inheritor_2:0 "[inherited_2.GetBaseNameNoTierNoTooltip] para [Select_CString( inheritor_2.IsFemale, 'a', 'o' )] [inheritor_2.GetFirstName];"
 ep3_laamps.0010.inheritor_3:0 "[inherited_3.GetBaseNameNoTierNoTooltip] para [Select_CString( inheritor_3.IsFemale, 'a', 'o' )] [inheritor_3.GetFirstName];"
 ep3_laamps.0010.laamp:0 "mas e quanto [Select_CString( potential_laamp.IsFemale, 'a minha', 'ao meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('potential_laamp'))] [potential_laamp.Custom('PersonalityGetPositiveTraitDesc')], [potential_laamp.GetFirstName]?\n\nDe mãos vazias, [potential_laamp.GetSheHe] assistiu à transição de poder à distância: sem cerimônias para #EMP [potential_laamp.GetSheHe]#!, apenas juramentos a outros. Sangue nobre e a espada ao lado [potential_laamp.GetHerHim] são seus únicos direitos de nascença."
 ep3_laamps.0010.multi:0 "Como meus irmãos"
 ep3_laamps.0010.single:0 "Como [Select_CString( potential_laamp.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('potential_laamp'))]"
 ep3_laamps.0010.t:0 "Um[Select_CString( potential_laamp.IsFemale, 'a', '' )] [potential_laamp.Custom('GetDaughterSon')|U] Menor de [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 ep3_laamps.0020.a:0 "Eu não desistirei de [revoked.GetBaseNameNoTierNoTooltip] tão facilmente!"
 ep3_laamps.0020.desc:0 "Eu perdi tudo em um piscar de olhos: meu [revoked.GetTierAsNameNoTooltip|l], meus títulos, minha dignidade...\n\nAquel[Select_CString( banisher.IsFemale, 'a', 'e' )] [Select_CString( banisher.IsFemale, 'cadela', 'cão' )] traiçoeir[Select_CString( banisher.IsFemale, 'a', 'o' )], [banisher.GetTitledFirstName], espera que eu seja grato por minha vida ter sido poupada, e que eu tenha sido apenas banido de [banisher.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]! Até os tolos sabem que o exílio pode ser um destino #EMP pior#! do que a morte..."
 ep3_laamps.0020.t:0 "O Exílio [revoked.GetAdjectiveNoTooltip]"
 ep3_laamps.0022.a:0 "Um latido ousado, com pouca mordida."
 ep3_laamps.0022.desc:0 "Você pode ter tomado meu [revoked.GetTierAsNameNoTooltip|l] em troca da minha liberdade, mas [revoked.GetBaseNameNoTier] não era seu para tomar, e eu não deixarei que minhas reivindicações sejam esquecidas.\n\nUm dia pode chegar em que nossos papéis serão invertidos, e sua vida estará nas #EMP minhas#! mãos."
 ep3_laamps.0030.a:0 "Bem, o que estamos esperando?"
 ep3_laamps.0030.desc:0 "Finalmente, eu deixarei para trás as aparências, responsabilidades mesquinhas e a rotina diária da minha vida em [old_capital_province.GetNameNoTooltip], e montarei acampamento nas abertas [old_capital_province.Custom('GetTerrainTypePlural')]!\n\nEstou acompanhado por meus servos e seguidores mais confiáveis, com variados graus de entusiasmo por suas novas vidas nas terras selvagens.\n\n"
 ep3_laamps.0030.heir:0 "No meu lugar, [Select_CString( laamp_inheritor.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('laamp_inheritor'))] e herdeir[Select_CString( laamp_inheritor.IsFemale, 'a', 'o' )], [laamp_inheritor.GetFirstName], assumiu meus títulos como [Select_CString( laamp_inheritor.IsFemale, 'a', 'o' )] [laamp_inheritor.GetTitleAsNameNoTooltip] do [laamp_inheritor.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 ep3_laamps.0030.liege:0 "Meu antigo reino passa para [Select_CString( laamp_inheritor.IsFemale, 'minha antiga senhora feudal', 'meu antigo senhor feudal' )], [laamp_inheritor.GetTitledFirstName], que aceitou minha decisão de deixar o serviço [laamp_inheritor.GetHerHim]."
 ep3_laamps.0030.new:0 "Em meu lugar, [laamp_inheritor.GetFirstName], um[Select_CString( laamp_inheritor.IsFemale, 'a', '' )] potentad[Select_CString( laamp_inheritor.IsFemale, 'a', 'o' )] local, foi escolhid[Select_CString( laamp_inheritor.IsFemale, 'a', 'o' )] pela nobreza para governar meu antigo reino."
 ep3_laamps.0030.t:0 "Além de [old_primary_title.GetBaseNameNoTierNoTooltip]"
 ep3_laamps.0032.a:0 "Uma atitude ousada, alguns poderiam chamar de tola."
 ep3_laamps.0032.desc:0 "Uma vida mais emocionante, viajando pelo mundo, me chama. Depois de longa deliberação, decidi ceder minhas terras a você, meu senhor feudal, para que as mantenha como suas. Em breve partirei de [old_primary_title.GetBaseNameNoTierNoTooltip] para a estrada aberta."
 ep3_laamps.0032.opening:0 "[adventurer.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 ep3_laamps.0040.a:0 "[actor.GetSheHe|U] não vai escapar impune."
 ep3_laamps.0040.desc:0 "encontrou a #EMP audácia#! Meus títulos estão perdidos! Minhas terras se foram! Meu status em frangalhos!\n\nSe eu devo defender e restaurar minha propriedade legítima, e ainda por cima minha honra, parece que devo começar do zero!\n\nA ganância d[Select_CString( actor.IsFemale, 'a', 'o' )] [actor.GetTitledFirstNamePossessive] deve ser vingada, por mais longo que seja o caminho..."
 ep3_laamps.0040.family:0 "Onde #EMP está#! m[Select_CString( actor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))] [actor.Custom2('InsultAdjective', ROOT.Char)]"
 ep3_laamps.0040.other:0 "Onde #EMP estava#! [Select_CString( actor.IsFemale, 'minha', 'meu' )] [actor.Custom2('InsultAdjective', ROOT.Char)] senhor[Select_CString( actor.IsFemale, 'a', '' )]"
 ep3_laamps.0040.t:0 "Da Riqueza à Miséria"
 ep3_laamps.0042.a:0 "Eu dou a [actor.GetSheHe] duas semanas, no máximo."
 ep3_laamps.0042.desc:0 "Sua confiscação do meu [landed_title.GetTierAsNameNoTooltip|l] me deixa sem escolha; você me forçou à vida de aventureiro.\n\nAinda não terminei, nem esquecerei minha reivindicação legítima a [landed_title.GetNameNoTierNoTooltip]!"
 ep3_laamps.0050.a:0 "Você enche a Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip] de orgulho!"
 ep3_laamps.0050.b:0 "Se você precisa ir, não vou te manter aqui."
 ep3_laamps.0050.c:0 "Não seja ridículo!"
 ep3_laamps.0050.desc:0 "M[Select_CString( potential_laamp.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('potential_laamp'))], [potential_laamp.GetFirstName], tem se mostrad[Select_CString( potential_laamp.IsFemale, 'a', 'o' )] inquiet[Select_CString( potential_laamp.IsFemale, 'a', 'o' )] ultimamente, e não me surpreendo quando [potential_laamp.GetSheHe] me aborda certa noite, enquanto olhamos para o [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip].\n\n\"[potential_laamp.Custom2('RelationToMeShort', ROOT.Char)|U],\" [potential_laamp.GetSheHe] suspira com nostalgia, olhando para o horizonte, \"Estou cansado de [ROOT.Char.Custom('ResidenceBuildingPlural')]. Quero sair #EMP por aí#!, ver o mundo! Quero deixar minha #EMP própria#! marca nele.\"\n\n[potential_laamp.GetSheHe|U] parece genuinamente determinado, animado com um entusiasmo que não via [Select_CString( potential_laamp.IsFemale, 'nela', 'nele' )], ou em qualquer outra pessoa, há muito tempo."
 ep3_laamps.0050.t:0 "Seguindo o Seu Próprio Caminho"
 ep3_laamps.0051.a:0 "Esse insolente..."
 ep3_laamps.0051.b:0 "...certamente tem coragem!"
 ep3_laamps.0051.desc:0 "Quando me levanto na manhã seguinte, ainda com a discussão com [Select_CString( potential_laamp.IsFemale, 'a', 'o' )] [potential_laamp.GetFirstName] em mente, sou informad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] de que [Select_CString( potential_laamp.IsFemale, 'a', 'o' )] [potential_laamp.Custom('PersonalityGetNegativeTraitDesc')] atrevid[Select_CString( potential_laamp.IsFemale, 'a', 'o' )] desapareceu durante a noite!\n\nO tolo desobedeceu minhas ordens explícitas para partir em direção à selva e brincar com um bando de desordeiros!"
 ep3_laamps.0100.a:0 " Ha — e dizem que 'a nobreza não pode ser comprada'!"
 ep3_laamps.0100.desc:0 "Eu mal podia acreditar quando recebi a aprovação d[Select_CString( recipient.IsFemale, 'a', 'o' )] [recipient.GetTitledFirstNamePossessive] para minha oferta; finalmente terei um [ROOT.Char.Custom('FortifiedBuilding')] só meu, com um telhado e quatro paredes sólidas!\n\nSerei [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] nov[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip] do [ROOT.Char.GetPrimaryTitle.GetNameNoTier],"
 ep3_laamps.0100.desc_nomadic:0 "Mal pude acreditar quando recebi o consentimento [Select_CString( recipient.IsFemale, 'da', 'do' )] [recipient.GetTitledFirstNamePossessive] à minha oferta; finalmente terei terras próprias, um lugar para pastar um rebanho!\n\nSerei [Select_CString( ROOT.Char.IsFemale, 'a nova', 'o novo' )] [ROOT.Char.GetTitleAsNameNoTooltip] de [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier],"
 ep3_laamps.0100.fallback:0 "\n\nFoi um longo caminho, mas finalmente posso deixar meu catre de campista para trás..."
 ep3_laamps.0100.fellow_vassal:0 "governando a área como um vassalo de [new_liege.GetName], dependente e submisso ao meu novo senhor feudal em igual medida."
 ep3_laamps.0100.independent:0 "governando esta outrora terra [recipient.GetPrimaryTitle.GetAdjectiveNoTooltip] como meu próprio feudo!"
 ep3_laamps.0100.liege:0 "governando a área como um vassalo [recipient.GetPrimaryTitle.GetAdjectiveNoTooltip], dependente e submisso ao meu novo senhor feudal em igual medida."
 ep3_laamps.0100.t:0 "Um Preço para Tudo"
 ep3_laamps.0100.unpopular:0 "\n\nEmbora minha rápida ascensão no [actor.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip] poleiro escorregadio certamente tenha levantado as sobrancelhas dos meus colegas lordes e damas..."
 ep3_laamps.0101.a:0 "É melhor [actor.GetSheHe] saber seu lugar."
 ep3_laamps.0101.b:0 "Espero que isso não tenha sido um erro."
 ep3_laamps.0101.c:0 "Um acordo justo, espero."
 ep3_laamps.0101.desc:0 "Fiquei muito animado ao ouvir que você aceitou minha oferta!\n\nO ouro foi enviado, e me mudo para minha residência em [new_primary_title.GetPreferredCapital.GetName]"
 ep3_laamps.0101.fellow_vassal:0 "como um vassalo de [new_liege.GetName]."
 ep3_laamps.0101.independent:0 "e governá-la como meu próprio feudo."
 ep3_laamps.0101.liege:0 "como seu humilde vassalo."
 ep3_laamps.0101.liege_message.title:0 "Vassalo Vendeu Terra"
 ep3_laamps.0101.opening:0 "[recipient.Custom2('AppropriateGreetingPositive', actor)]"
 ep3_laamps.0102.a:0 "Não precisa ser rude."
 ep3_laamps.0102.desc:0 "Que oferta ridícula você faz. Você realmente acha que eu venderia meus títulos? E para um[Select_CString( actor.IsFemale, 'a', '' )] [actor.GetWomanMan] como você?!#!"
 ep3_laamps.0102.opening:0 "[recipient.Custom2('AppropriateGreetingNegative', actor)]"
 ep3_laamps.0200.a:0 "Excelente!"
 ep3_laamps.0200.desc:0 "Muito bem, eu ajudarei em sua invasão a [secondary_recipient.GetPrimaryTitle.GetTierAsNameNoTooltip] d[Select_CString( secondary_recipient.IsFemale, 'a', 'o' )] [secondary_recipient.GetTitledFirstNamePossessive], desde que você jure lealdade a mim se sair vitorioso."
 ep3_laamps.0200.opening:0 "[recipient.Custom2('AppropriateGreeting', actor)]"
 ep3_laamps.0201.a:0 "Não preciso [recipient.GetHerHim] de qualquer forma..."
 ep3_laamps.0201.desc:0 "Considerei sua proposta com muito cuidado e conclui que não posso oferecer minha ajuda à sua causa neste momento."
 ep3_laamps.0201.opening:0 "[recipient.Custom2('AppropriateGreeting', actor)]"
 ep3_laamps.0300.a:0 "Isso melhor ser o fim disso."
 ep3_laamps.0300.desc:0 "Após aguardar ansiosamente a resposta d[Select_CString( recipient.IsFemale, 'a', 'o' )] [recipient.GetFirstNamePossessive] à minha oferta, não posso negar o alívio que sinto ao ver a aprovação [recipient.GetHerHim] escandalizada no missiva.\n\nIsso é tudo: [recipient.GetSheHe] será [Select_CString( recipient.IsFemale, 'a', 'o' )] nov[Select_CString( recipient.IsFemale, 'a', 'o' )] [recipient.GetTitleAsNameNoTooltip] do [recipient.GetPrimaryTitle.GetNameNoTier],"
 ep3_laamps.0300.fallback:0 "\n\nTalvez eu possa finalmente mover minha atenção para assuntos mais urgentes..."
 ep3_laamps.0300.fellow_vassal:0 "governando a área como um vassalo de [new_liege.GetName]."
 ep3_laamps.0300.independent:0 "governando as terras [recipient.GetPrimaryTitle.GetAdjectiveNoTooltip] que lhe pertencem como seu próprio feudo!"
 ep3_laamps.0300.liege:0 "governando a área como meu vassalo — se [recipient.GetSheHe] se comportar."
 ep3_laamps.0300.t:0 "...E Seus Inimigos Mais Próximos"
 ep3_laamps.0300.unpopular:0 "\n\nA ascensão rápida [recipient.GetHerHim] nas fileiras da nobreza [actor.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] certamente levantará muitas sobrancelhas no [actor.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]..."
 ep3_laamps.0301.a:0 "Estou ao seu serviço."
 ep3_laamps.0301.b:0 "Como os caídos se tornaram poderosos!"
 ep3_laamps.0301.c:0 "Finalmente um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip]."
 ep3_laamps.0301.desc:0 "Fico feliz que você tenha visto a razão, e confio que isso põe fim às nossas disputas.\n\n[new_primary_title.GetPreferredCapital.GetNameNoTier] foi preparado para sua chegada, para governar"
 ep3_laamps.0301.fellow_vassal:0 "como um vassalo de [new_liege.GetName]."
 ep3_laamps.0301.independent:0 "como seu próprio feudo."
 ep3_laamps.0301.liege:0 "como meu vassalo."
 ep3_laamps.0301.liege_message.title:0 "Vassalo Acomodou Aventureiro"
 ep3_laamps.0301.opening:0 "[actor.Custom2('AppropriateGreetingPositive', recipient)]"
 ep3_laamps.0302.a:0 "Oh! Esse maldito ninguém!"
 ep3_laamps.0302.desc:0 "Você acha que eu posso ser subornado com esses títulos medíocres tão facilmente? Se eu for tê-los, eu os tomarei de você pela espada."
 ep3_laamps.0302.opening:0 "[recipient.Custom2('AppropriateGreetingNegative', actor)]"
 ep3_laamps.0800.a.tt:0 "#mixed_value #BER [THIS.Char.GetShortUIName|U] se tornará um [ruler|E] [landed|E]#!#!"
 ep3_laamps.0800.a:0 "Sim, é hora de deixar meu acampamento para trás..."
 ep3_laamps.0800.abdication:0 "Um arauto chegou trazendo a pesada revelação da minha herança de [new_title.GetBaseNameNoTier], e seus territórios associados, após a abdicação de [previous_holder.GetFullNamePossessive]..."
 ep3_laamps.0800.b.claimant:0 "A estrada me chama: que [Select_CString( alt_1.IsFemale, 'a', 'o' )] [alt_1.GetFirstNameNoTooltip] assuma sua reivindicação!"
 ep3_laamps.0800.b:0 "A estrada me chama: m[Select_CString( alt_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('alt_1'))], [alt_1.GetFirstNameNoTooltip], pode tê-l[Select_CString( alt_1.IsFemale, 'a', 'o' )]!"
 ep3_laamps.0800.c.claimant:0 "Confiarei [Select_CString( alt_2.IsFemale, 'a sua', 'ao seu' )] legítim[Select_CString( alt_2.IsFemale, 'a', 'o' )] reclamante: [alt_2.GetFirstNameNoTooltip]!"
 ep3_laamps.0800.c:0 "Confiarei [new_title.GetBaseNameNoTierNoTooltip] [Select_CString( alt_2.IsFemale, 'a minha', 'ao meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('alt_2'))], [alt_2.GetFirstNameNoTooltip]."
 ep3_laamps.0800.claim.tt:0 "@warning_icon! #N Você perderá todas as [claims|E] sobre os [titles|E] renunciados#!"
 ep3_laamps.0800.claim_war:0 "Finalmente, eu derrotei [Select_CString( previous_holder.IsFemale, 'a', 'o' )] [previous_holder.GetTitledFirstName] e tomei minhas terras justas. Agora tenho o futuro de [new_title.GetBaseNameNoTier] em minha palma..."
 ep3_laamps.0800.conquest:0 "Finalmente, eu derrotei [Select_CString( previous_holder.IsFemale, 'a', 'o' )] [previous_holder.GetTitledFirstName] e conquistei suas terras. Agora tenho o futuro de [new_title.GetBaseNameNoTier] em minha palma..."
 ep3_laamps.0800.d.claimant:0 "Meu apoio vai para a reivindicação d[Select_CString( alt_3.IsFemale, 'a', 'o' )] [alt_3.GetFirstNamePossessiveNoTooltip]!"
 ep3_laamps.0800.d:0 "M[Select_CString( alt_3.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('alt_3'))], [alt_3.GetFirstNameNoTooltip], governará [new_title.Custom('GetTierBase')|l]!"
 ep3_laamps.0800.desc:0 "\n\nA vida na estrada é certamente cheia de provações e perigos, mas que liberdade! Não posso negar seu apelo, livre das muitas responsabilidades do governo.\n\n"
 ep3_laamps.0800.e.liege:0 "Renuncio a essas terras, [Select_CString( new_liege.IsFemale, 'a', 'o' )] [new_liege.GetTitleAsNameNoTooltip] pode tê-las!"
 ep3_laamps.0800.e:0 "Renuncio a essas terras, que algum outro as tenha!"
 ep3_laamps.0800.election:0 "Um arauto chegou trazendo a pesada revelação da minha eleição como governante de [new_title.GetBaseNameNoTier], e seus territórios associados..."
 ep3_laamps.0800.faction:0 "Um arauto chegou trazendo a pesada revelação de que os nobres de [new_title.GetBaseNameNoTier] conferiram seu governo a mim, expulsando [previous_holder.GetFullName]..."
 ep3_laamps.0800.granted:0 "Um arauto chegou trazendo a pesada revelação da concessão de [new_title.GetBaseNameNoTier], e seus territórios associados, [Select_CString( new_liege.IsFemale, 'pela', 'pelo' )] [new_liege.GetTitledFirstNamePossessive]..."
 ep3_laamps.0800.holy_war:0 "Finalmente, eu derrotei [Select_CString( previous_holder.IsFemale, 'a', 'o' )] [previous_holder.GetTitledFirstName] e tomei suas terras em nome de [ROOT.Char.GetFaith.HighGodName]. Agora tenho o futuro de [new_title.GetBaseNameNoTier] em minha palma..."
 ep3_laamps.0800.independent:0 "\n\nEstou fadado a assumir o manto e sentar em [new_capital.GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip], um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetLadyLord] soberan[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por direito?"
 ep3_laamps.0800.inherited:0 "Um arauto chegou trazendo a pesada revelação da minha herança de [new_title.GetBaseNameNoTier], e seus territórios associados, de [previous_holder.GetFullName]..."
 ep3_laamps.0800.t:0 "Encruzilhada"
 ep3_laamps.0800.vassal:0 "\n\nEstou fadado a assumir o manto e sentar em [new_capital.GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip], servindo [Select_CString( new_liege.IsFemale, 'a', 'o' )] [new_liege.GetTitledFirstNameRegnal] como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetLadyLord] vassal[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [new_liege.GetPrimaryTitle.GetAdjectiveNoTooltip]?"
 ep3_laamps.1001.a.tt:0 "Você começa com dois [followers|E] habilidosos em [diplomacy|E]"
 ep3_laamps.1001.a:0 "Felizmente, aqueles que conheço são conversadores eloquentes."
 ep3_laamps.1001.b.tt:0 "Você começa com dois [followers|E] habilidosos em [martial|E]"
 ep3_laamps.1001.b:0 "Isso será um exército, algum dia."
 ep3_laamps.1001.c.tt:0 "Você começa com dois [followers|E] habilidosos em [stewardship|E]"
 ep3_laamps.1001.c:0 "Com essas pessoas eu construirei um império."
 ep3_laamps.1001.d.tt:0 "Você começa com dois [followers|E] habilidosos em [intrigue|E]"
 ep3_laamps.1001.d:0 "Hmm, e nenhuma ladroagem na noite, nem mesmo."
 ep3_laamps.1001.desc.at_least_one_working_eye:0 "Poucas faces atraem meu olhar como aquelas que reconheço, pelo menos mais do que superficialmente."
 ep3_laamps.1001.desc.blind:0 "Poucas vozes são aquelas que reconheço, pelo menos mais do que superficialmente."
 ep3_laamps.1001.desc.intro:0 "O caminho à frente se estende e se estende, um solitário fio sinuoso se entrelaçando em direção ao horizonte distante.\n\nMeu acampamento está... silencioso, apenas algumas tendas dispersas e animais de carga bocejando na brisa. Estranhos e acompanhantes se levantam com o dia, preparando-se para suas tarefas matinais com relutância.\n\nA maioria é a palha miscigenada que flutua dentro e fora de um grupo na estrada com cada novo assentamento."
 ep3_laamps.1001.e.tt:0 "Você começa com dois [followers|E] habilidosos em [learning|E]"
 ep3_laamps.1001.e:0 "Graças a [ROOT.Char.GetFaith.KnowledgeGodName] temos pelo menos alguns intelectuais!"
 ep3_laamps.1001.f.tt:0 "Você começa com dois [followers|E] habilidosos em [prowess|E]"
 ep3_laamps.1001.f:0 "Pelo menos conto com alguns bons lutadores."
 ep3_laamps.1001.g.tt.difficulty:0 "@alert_icon! #alert_trial Você pode achar [task_contracts|E] difíceis, ou impossíveis, até adquirir [followers|E]#!"
 ep3_laamps.1001.g.tt.followers:0 "Você começa com nenhum [followers|E] gerado — apenas aqueles [Concept('family', 'Familiares')|E] e [friends|E] que já possui"
 ep3_laamps.1001.g:0 "Não tomei seguidores dignos — ainda."
 ep3_laamps.1001.t:0 "Os Caminhos que Percorremos"
 ep3_laamps.1011.a:0 "M[Select_CString( recipient.IsFemale, 'inha', 'eu' )] [recipient.Custom('SisterBrother')], você sempre terá um lugar à minha mesa."
 ep3_laamps.1011.b:0 "Que meu triunfo ganhe sua lealdade, [recipient.GetFirstNameNoTooltip]."
 ep3_laamps.1011.desc.first_sword:0 "A primeira espada jurada tão carinhosamente a mim"
 ep3_laamps.1011.desc.four_plus_titles:0 "\"... e eu juro defender para sempre seus direitos a [title_1.GetNameNoTier], a [title_2.GetNameNoTier], a [title_3.GetNameNoTier], e a qualquer e todo reino que deva ser seu, meu senhor feudal\", "
 ep3_laamps.1011.desc.midtro:0 "declara [recipient.Custom2('MyCharacterIntroduction', actor)].\n\n[Select_CString( recipient.IsFemale, 'A', 'O' )] [recipient.GetWomanMan] deixa sua cabeça inclinada em respeitosa submissão enquanto [recipient.GetSheHe] termina seu longo e sinuoso juramento, aguardando minha resposta.\n\n"
 ep3_laamps.1011.desc.one_title:0 "\"... e eu juro defender para sempre seus direitos a seu domínio mais justo de [title_1.GetNameNoTier], meu senhor feudal\", "
 ep3_laamps.1011.desc.outro:0 "— a lealdade [recipient.GetHerHim] agora além de reprovação — a única pergunta que resta é quanta lealdade estou #EMP eu#! disposto a dar em troca?"
 ep3_laamps.1011.desc.prior_swords:0 "Outro bom braço de espada jurado à minha causa"
 ep3_laamps.1011.desc.three_titles:0 "\"... e eu juro defender para sempre seus direitos a seu domínio natural, de [title_1.GetNameNoTier] a [title_2.GetNameNoTier] a [title_3.GetNameNoTier], meu senhor feudal\", "
 ep3_laamps.1011.desc.two_titles:0 "\"... e eu juro defender para sempre seus direitos a seus reinos gêmeos de [title_1.GetNameNoTier] e [title_2.GetNameNoTier], meu senhor feudal\", "
 ep3_laamps.1011.t:0 "Juramentado pela Espada"
 ep3_laamps.5000.a.critfailure:0 "[local_lord.GetFirstNameNoTooltip] recusa"
 ep3_laamps.5000.a.failure:0 "[local_lord.GetFirstNameNoTooltip] insiste que você pague pelo direito de caçar"
 ep3_laamps.5000.a.success:0 "[local_lord.GetFirstNameNoTooltip] aquiesce"
 ep3_laamps.5000.a.tt:0 "Eu enviarei uma carta pedindo direitos de caça."
 ep3_laamps.5000.a:0 "Nada de caça sem permissão."
 ep3_laamps.5000.b.critfailure:0 "[hunter.GetFirstNameNoTooltip] é peg[Select_CString( hunter.IsFemale, 'a', 'o' )] e aprisionad[Select_CString( hunter.IsFemale, 'a', 'o' )]"
 ep3_laamps.5000.b.failure:0 "[hunter.GetFirstNameNoTooltip] é peg[Select_CString( hunter.IsFemale, 'a', 'o' )] e multad[Select_CString( hunter.IsFemale, 'a', 'o' )], com metade da sua captura confiscada"
 ep3_laamps.5000.b.success:0 "[hunter.GetFirstNameNoTooltip] caça sem ser detectad[Select_CString( hunter.IsFemale, 'a', 'o' )]"
 ep3_laamps.5000.b:0 "Vá rápido e silenciosamente."
 ep3_laamps.5000.c.failure:0 "Os arbustos de frutas vermelhas estão vazios"
 ep3_laamps.5000.c.success:0 "[hunter.GetFirstNameNoTooltip] traz algumas frutas vermelhas"
 ep3_laamps.5000.c:0 "Não podemos arriscar. Em vez disso, procure por frutas."
 ep3_laamps.5000.desc:0 "Eu olho tristemente para minha refeição. Uma maçã mal madura se destaca como a mais atraente da comida.\n\n"
 ep3_laamps.5000.ending:0 "\n\n[hunter.GetFirstName] salta para seus pés, arco em mãos, alcançando um aljava.\n\n\"Já tive o suficiente disso. Estas podem ser as terras d[Select_CString( local_lord.IsFemale, 'a', 'o' )] [local_lord.GetTitledFirstNamePossessive], mas tenho certeza de que [local_lord.GetSheHe] pode ceder os meros restos de sua gordura.\""
 ep3_laamps.5000.provisionslow:0 "Nossas provisões continuam a se esgotar, e agora estamos realmente em apuros. Estômagos roncando pelo acampamento, e nossos cintos quase não têm mais fivelas para apertar."
 ep3_laamps.5000.provisionsok:0 "Não há falta de comida no acampamento, mas a variedade é escassa. Temos muitos vegetais murchos, mas eu realmente gostaria de um bom pedaço de carne."
 ep3_laamps.5000.t:0 "Caixas Vazias"
 ep3_laamps.5005.a.failure:0 "[priest.GetSheHe|U] tem planos muito além do acampamento"
 ep3_laamps.5005.a.success:0 "[priest.GetSheHe|U] concorda em ficar um tempo"
 ep3_laamps.5005.a:0 "Poderíamos nos beneficiar de um[Select_CString( priest.IsFemale, 'a', '' )] [priest.GetWomanMan] de tal mundanidade..."
 ep3_laamps.5005.b:0 "\"Sente-se, fique uma noite e conte-nos suas histórias!\""
 ep3_laamps.5005.c.tt:0 "Simplesmente não há espaço suficiente: eu nunca pediria a um de meus seguidores que desistisse de sua cama por um estranho!"
 ep3_laamps.5005.c:0 "\"Eu devo pedir que você se retire.\""
 ep3_laamps.5005.d:0 "\"Vá embora! Não queremos o seu tipo aqui!\""
 ep3_laamps.5005.desc:0 "A fogueira crepita, iluminando uma figura que entra em nosso círculo. [priest.GetSheHe|U] se move com vigor apesar da hora avançada, com a mão envolta em um bastão. Aqueles que estão de guarda já estão interceptando, mas eu os afasto.\n\n\"Você tem um lugar para um homem de [priest.GetFaith.HighGodName]?\" [priest.GetSheHe|U] sorri para mim esperançosamente, roupas sujas estalando na brisa firme. Um [ROOT.Char.GetFaith.PriestNeuter] errante!\n\n"
 ep3_laamps.5005.difffaith:0 "Um [ROOT.Char.GetFaith.PriestNeuter], talvez, mas não um [ROOT.Char.GetFaith.PriestNeuter] de fé [ROOT.Char.GetFaith.GetAdjective], isso eu posso dizer. Alguns dos meus companheiros crentes se mexem desconfortavelmente enquanto fazem a mesma realização."
 ep3_laamps.5005.samefaith:0 "Essas figuras são bem conhecidas em círculos [ROOT.Char.GetFaith.GetAdjective]. Os pregadores viajantes espalham a palavra de [priest.GetFaith.HighGodName] para cada canto e recanto do mundo."
 ep3_laamps.5005.t:0 "Um Visitante Fiel"
 ep3_laamps.5010.a:0 "Aquela pousada que passamos tinha muitas camas sobrando..."
 ep3_laamps.5010.b.tt:0 "Atualize sua [building|E] $camp_main_01_domicile_building$ com desconto"
 ep3_laamps.5010.b:0 "Minhas costas pobres exigem móveis mais luxuosos."
 ep3_laamps.5010.c.failure:0 "Você continua a sofrer"
 ep3_laamps.5010.c.success:0 "Seu corpo se acostuma com isso"
 ep3_laamps.5010.c:0 "Devemos prosseguir."
 ep3_laamps.5010.desc:0 "#EMP Oof!#!\n\nAcho que faço tais barulhos ao me sentar à fogueira do acampamento à noite agora. Os mais velhos sempre falam sobre como isso acontece quando você envelhece, mas eu tenho apenas [ROOT.Char.GetAge]...\n\nNão, tal é o desgaste de uma vida vivida de forma dura. Posso ver o custo que isso traz aos outros também: [follower.GetName] faz uma expressão de dor enquanto [follower.GetSheHe] se deixa cair ao meu lado."
 ep3_laamps.5010.t:0 "Dores e Sofrimentos"
 ep3_laamps.5015.a.tt:0 "Leve cada último centavo e bugiganga da posse [knight.GetHerHim]."
 ep3_laamps.5015.a:0 "\"Você é melhor do que eu. E mais tolo.\""
 ep3_laamps.5015.b:0 "Há mais de vocês, você diz?"
 ep3_laamps.5015.c.success:0 "A palavra se espalha sobre sua generosidade"
 ep3_laamps.5015.c:0 "Podemos usar mais uma espada..."
 ep3_laamps.5015.d:0 "Venha, sente-se e recupere-se. Coma."
 ep3_laamps.5015.desc:0 "Uma figura tropeça no acampamento, suja e cansada, claramente precisando de uma refeição. O nome [knight.GetHerHim] é [knight.GetFirstName], [knight.GetSheHe] diz.\n\n\"Há mais como eu,\" [knight.GetSheHe] gesticula ao longe, \"todos nós deixados para apodrecer após cada conflito mesquinho. Nossas habilidades com a espada ainda funcionam bem, mas nosso destino é vagar e morrer de fome.\"\n\n\"Somos os únicos que não roubarão os vulneráveis por comida e bens. Os olhos [knight.GetHerHim] brilham com determinação, apesar de sua aparência desgastada. \"Prefiro morrer.\""
 ep3_laamps.5015.t:0 "Soldados Famintos"
 ep3_laamps.5020.a.tt:0 "E talvez [Select_CString( cook.IsFemale, 'a', 'o' )] [cook.GetFirstNameNoTooltip] ache isso especial também."
 ep3_laamps.5020.a:0 "...talvez precise de um pouco de #EMP algo#! extra especial."
 ep3_laamps.5020.b:0 "Misture com ervas da culinária [culture.GetNameNoTooltip]."
 ep3_laamps.5020.c.failure:0 "É abominável"
 ep3_laamps.5020.c.success:0 "Está delicioso"
 ep3_laamps.5020.c:0 "Bem, vou experimentar."
 ep3_laamps.5020.d.tt:0 "Sua reticência se torna infame"
 ep3_laamps.5020.d:0 "O que é esse lodo?!"
 ep3_laamps.5020.desc:0 "A cultura em [location.GetName] é desconhecida para mim, e alguns de seus costumes igualmente estranhos. Isso se prova especialmente verdadeiro quando [Select_CString( cook.IsFemale, 'a', 'o' )] [cook.GetFirstName], atuando como nosso cozinheiro para a noite, me chama para olhar o caldeirão.\n\n\"É uma receita local,\" [cook.GetSheHe] começa, \"supostamente #EMP autenticamente#! [local_culture.GetName]. Fui assegurado disso por um comerciante que passou.\"\n\nOlho para a substância com suspeita. É isso... carne de [cook.Custom('GetRandomRegionalSmallGame')] cozida? Com #EMP [cook.Custom('RegionalRootVegetablePlural')]?!#!"
 ep3_laamps.5020.t:0 "Rações Não Familiar"
 ep3_laamps.5020.tt:0 "Requer um de: [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )], [GetTrait('eccentric').GetName( GetNullCharacter )], ou [GetTrait('gluttonous').GetName( GetNullCharacter )]"
 ep3_laamps.5025.a:0 "Eu #EMP devo#! reivindicar algumas terras no futuro."
 ep3_laamps.5025.b.flavor:0 "Hora de se acostumar com isso, então!"
 ep3_laamps.5025.b.tt:0 "Adiciona #value 2#! novas [task_contracts|E]"
 ep3_laamps.5025.b:0 "Gosto bastante desta vida."
 ep3_laamps.5025.c.flavor:0 "...e também é melhor se preparar para o que vem pela frente."
 ep3_laamps.5025.c.toast:0 "Você aprende o valor da flexibilidade"
 ep3_laamps.5025.c:0 "É melhor manter minhas opções em aberto."
 ep3_laamps.5025.desc:0 "Sento-me ao lado de [ROOT.Char.Custom('GetRandomCampBuilding')], deixando os sons e cheiros do acampamento me lavarem. É diferente de uma vida dentro das seguras paredes de um palácio, muito diferente.\n\nA liberdade é fácil de aproveitar. Sem obrigações, sem conselheiros tagarelando, sem dignitários para entreter, nenhum dos contratempos das armadilhas do poder.\n\nAinda assim, essas liberdades são compradas a preço de ouro. A constante luta pela sobrevivência é desgastante. Cada vez mais, a cada noite, anseio por uma cama adequada..."
 ep3_laamps.5025.t:0 "Meios para um Fim?"
 ep3_laamps.5030.a.tt:0 "Esta opção está disponível para você devido a sua alta [dynasty_prestige|E]\n"
 ep3_laamps.5030.a:0 "Ah, não importa. Vamos apenas tomar algumas bebidas."
 ep3_laamps.5030.b.tt:0 "\"E eu #EMP exijo#! hospitalidade!\""
 ep3_laamps.5030.b:0 "Não sou um mendigo. Sou [ROOT.Char.GetFirstNameNoTooltip] da Casa [ROOT.Char.GetHouse.GetNameNoTooltip]."
 ep3_laamps.5030.c.critfailure:0 "As coisas saem do controle"
 ep3_laamps.5030.c.failure:0 "Sua ameaça se torna evidente"
 ep3_laamps.5030.c.success:0 "Seu aviso é compreendido, com um desconto adicional"
 ep3_laamps.5030.c:0 "Temo que eu absolutamente precise de um lugar para ficar."
 ep3_laamps.5030.d.failure:0 "[innkeeper.GetFirstNameNoTooltip] não cede"
 ep3_laamps.5030.d.success:0 "Sua barganha se mostra bem-sucedida"
 ep3_laamps.5030.d:0 "Certamente podemos chegar a um acordo?"
 ep3_laamps.5030.desc:0 "Enquanto caminhamos pela estrada, um edifício aparece à vista. A placa desgastada do lado de fora lê \"[ROOT.Char.Custom('GetPubName')] - Pousada\".\n\n\"Sem sorte aqui esta noite. Mal temos espaço para nossos atuais hóspedes, quanto mais para alguém novo.\" Dentro, o estalajadeiro balança sua cabeça de forma desdenhosa. \"E #EMP especialmente#! não para vocês, tipos desorganizados!\"\n\n#EMP Desorganizados?!#!"
 ep3_laamps.5030.t:0 "Pousadas e Saídas"
 ep3_laamps.5035.a:0 "Eu poderia usar um[Select_CString( guide.IsFemale, 'a', '' )] [guide.GetWomanMan] como você no acampamento."
 ep3_laamps.5035.b:0 "Quanto você disse que esses mapas custam?"
 ep3_laamps.5035.c.critfailure:0 "O caminho do guia leva você diretamente para uma armadilha"
 ep3_laamps.5035.c.failure:0 "As informações do guia são falhas"
 ep3_laamps.5035.c.success:0 "O conselho se prova útil"
 ep3_laamps.5035.c:0 "Precisamos da sua ajuda para passar por #EMP estas#! áreas..."
 ep3_laamps.5035.d.toast:0 "Você se perde"
 ep3_laamps.5035.d.tt:0 "Vamos apenas ter que esperar que não nos percamos..."
 ep3_laamps.5035.d:0 "Não há necessidade de seus serviços."
 ep3_laamps.5035.desc:0 "Ninguém no meu acampamento está intimamente familiarizado com o terreno em [location.GetName], e essas terras não são para se brincar. É por isso que me encontro em frente a um guia local, negociando pelos serviços a serem prestados.\n\n\"Não é brincadeira lá fora!\" [guide.GetSheHe|U] oferece, puxando o ar entre dentes cerrados; um gesto teatralmente preocupado. \"Você precisará ou desses mapas ou dos meus serviços, isso posso garantir de graça.\"\n\n[guide.GetSheHe|U] está certo, mas... há algo na atitude [guide.GetHerHim] que me faz hesitar."
 ep3_laamps.5035.t:0 "Terreno Conhecido"
 ep3_laamps.5035.tt:0 "Requer um de: [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )], [GetTrait('eccentric').GetName( GetNullCharacter )], ou [GetTrait('gluttonous').GetName( GetNullCharacter )]"
 ep3_laamps.5040.a.bigsuccess.tt:0 "Você descobre uma arma empoeirada"
 ep3_laamps.5040.a.bigsuccess:0 "Sua busca vai muito bem"
 ep3_laamps.5040.a.failure.tt:0 "Você não descobre nada"
 ep3_laamps.5040.a.failure:0 "Sua busca é inútil"
 ep3_laamps.5040.a.success.tt:0 "Você descobre uma pequena bugiganga"
 ep3_laamps.5040.a.success:0 "Sua busca vai bem"
 ep3_laamps.5040.a:0 "Bem, vamos tentar minha sorte nessas ruínas..."
 ep3_laamps.5040.b:0 "É melhor ficar seguro e comprar provisões."
 ep3_laamps.5040.c.critsuccess.tt:0 "Dois [followers|E] se juntam"
 ep3_laamps.5040.c.critsuccess:0 "Um casal aceita sua oferta"
 ep3_laamps.5040.c.failure.tt:0 "Ninguém se junta"
 ep3_laamps.5040.c.failure:0 "Ninguém se apresenta"
 ep3_laamps.5040.c.success.tt:0 "Um [follower|E] se junta"
 ep3_laamps.5040.c.success:0 "Alguém decide se juntar a você"
 ep3_laamps.5040.c:0 "Talvez alguns deles queiram se juntar a mim?"
 ep3_laamps.5040.desc:0 "Explorando à frente do acampamento, encontro um grupo de comerciantes em uma coleção precária. Eles estão reunidos em torno de alguns grandes, mas velhos e ruídos edifícios, os que ainda estão em boas condições ocupados pelos mercadores.\n\nSeus produtos são bastante comuns. Comida, principalmente, estando em uma estrada bem movimentada que, sem dúvida, atrairia muitos compradores. No entanto, meu olhar é irresistivelmente atraído pelas paredes cinzentas e marcadas das ruínas.\n\nSão tão magníficas! Os mercadores ocupam apenas os arredores, mas seu coração dilapidado permanece intocado."
 ep3_laamps.5040.t:0 "Divagação sobre Ruínas"
 ep3_laamps.5045.a.failure:0 "[local_lord.GetSheHe|U] ri disso"
 ep3_laamps.5045.a.success:0 "Suas palavras se mostram persuasivas"
 ep3_laamps.5045.a.tt:0 "Isso está disponível para você porque você tem o [modifier|E] [GetModifier( 'ep3_lust_for_land_modifier' ).GetNameWithTooltip]"
 ep3_laamps.5045.a:0 "Você sabe, estou bastante cansado da vida errante..."
 ep3_laamps.5045.b:0 "Bem, ouro nunca faz mal..."
 ep3_laamps.5045.c:0 "Mais um pouco dessa comida seria ótimo."
 ep3_laamps.5045.d:0 "Tudo o que preciso é trabalho para servir estas terras."
 ep3_laamps.5045.desc:0 "A comida na residência de [local_lord.GetFullNamePossessive] em [location.GetName] é excelente, claro. Um grande contraste com a comida simples e robusta à qual estou tão acostumado.\n\n\"Fico muito feliz que você tenha podido atender ao meu chamado.\" [local_lord.GetFirstNameNoTooltip] diz, gesticulando na minha direção. \"Gostaria de ver se há algo que possamos fazer para ajudar um ao outro.\"\n\n\"Afinal, há certos momentos em que um[Select_CString( local_lord.IsFemale, 'a', '' )] [local_lord.GetWomanMan] da minha estatura não consegue se sujar tanto quanto alguns trabalhos exigem...\""
 ep3_laamps.5045.t:0 "Os Corredores do Poder"
 ep3_laamps.5999.a:0 "Devo ficar de olho na situação."
 ep3_laamps.5999.b.tt:0 "Adiciona uma nova [task_contract|E]"
 ep3_laamps.5999.b:0 "Meu destino não está na Inglaterra."
 ep3_laamps.5999.desc:0 "Meu pai era um homem severo. Com a vantagem dos anos, agora posso ver que minhas... indiscrições em relação a ele foram tomadas com o humor que mereciam. Seu apelo [Select_CString( edward.IsFemale, 'a', 'ao' )] [edward.GetTitledFirstName] foi ouvido, e assim me encontrei aqui em [location.GetName], fazendo trabalhos sujos para [Select_CString( flanders.IsFemale, 'a', 'o' )] [flanders.GetTitledFirstName].\n\nMas já se passaram longos anos, e a Inglaterra encontra-se em fluxo. [edward.GetTitledFirstNameNoTooltip] está morto, [harold.GetTitledFirstName] tomou o trono, e seus inimigos [william.GetTitledFirstName] e [Select_CString( harald.IsFemale, 'a', 'o' )] [harald.GetTitledFirstName] tramam sua queda.\n\nSó espero que a turbulência que os próximos dias trazem fique longe da minha família e de nossas terras."
 ep3_laamps.5999.t:0 "Notícias da Ilha"
 ep3_laamps.6000.a.dead:0 "Não abandonarei minha herança legítima!"
 ep3_laamps.6000.a.flavor:0 "Traçar um caminho para minha terra natal."
 ep3_laamps.6000.a.tt:0 "Começar a viajar para [ely.GetName]"
 ep3_laamps.6000.a:0 "Não abandonarei minha família em sua hora de necessidade!"
 ep3_laamps.6000.b.tt:0 "@alert_icon!#alert_trial Não haverá como voltar atrás, uma vez que este caminho for escolhido...#!"
 ep3_laamps.6000.b:0 "Não sou mais um [ROOT.Char.GetHouse.GetBaseNameNoTooltip] há muito tempo."
 ep3_laamps.6000.body.alive:0 "Meu irmão [brother.GetFirstName] está vivo — e de fato é a mão dele que escreveu esta missiva — mas os rumores vindos da Normandia se provaram verdadeiros."
 ep3_laamps.6000.body.dead:0 "Meu irmão, [brother.GetFirstName], está morto — dizem que [brother.GetSheHe] [brother.GetDeathReasonHideKiller] — e os rumores vindos da Normandia se provam verdadeiros."
 ep3_laamps.6000.closing.alive:0 "Meu irmão pede ajuda..."
 ep3_laamps.6000.closing.dead:0 "Minha família está em ruínas..."
 ep3_laamps.6000.desc:0 "\n\n[harold.GetFirstName] de [harold.GetHouse.GetBaseName] foi deposto à força, agora está morto ou escondido. O Duque [william.GetFirstName], o bastardo pretendente ao trono inglês, é agora [Select_CString( william.IsFemale, 'a', 'o' )] [william.GetTitledFirstNameNoTooltip] do [william.GetPrimaryTitle.GetNameNoTier]. [william.GetSheHe|U] já começou a distribuir parcelas de terra para seus seguidores, arrancando-as das garras dos derrotados [ROOT.Char.GetCulture.GetCollectiveNoun].\n\n"
 ep3_laamps.6000.intro:0 "Viro a carta em minhas mãos, sentindo sua superfície áspera, o selo de cera e o emblema estampado nela. O emblema de [ROOT.Char.GetHouse.GetBaseName]. Corto o selo e começo a ler.\n\nAs notícias são realmente sombrias."
 ep3_laamps.6000.t:0 "Destino"
 ep3_laamps.6001.a:0 "\"Você vai morrer pelo que fez aqui.\""
 ep3_laamps.6001.b.one.tt:0 "Você recupera o corpo do [brother.GetFirstNamePossessiveNoTooltip] sem ser molestado"
 ep3_laamps.6001.b.one:0 "[Select_CString( frederick.IsFemale, 'A', 'O' )] [frederick.GetWomanMan] foge"
 ep3_laamps.6001.b.two.tt:0 "Um [single_combat_duel|E] começa"
 ep3_laamps.6001.b.two:0 "[Select_CString( frederick.IsFemale, 'A', 'O' )] [frederick.GetWomanMan] avança sobre você, arma erguida"
 ep3_laamps.6001.b:0 "\"Você tem uma única chance de correr, seu miserável.\""
 ep3_laamps.6001.desc:0 "No momento em que coloco os pés em meus antigos domínios familiares, sei que algo está errado. Um formato deformado aparece através da névoa, um fino poste se elevando acima dele. Um passo adiante e...\n\nA cabeça [Select_CString( brother.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('brother'))] [brother.GetFirstNamePossessive] está empoleirada no topo de uma estaca, o resto do seu corpo em um monte amassado e salpicado de sangue abaixo.\n\n\"Quem é você?\" A voz, com um sotaque que não reconheço, me surpreende. Viro-me para ver um[Select_CString( frederick.IsFemale, 'a', '' )] [frederick.GetWomanMan] limpando manchas de sangue da arma em suas mãos, a sobrancelha levantada diante da minha presença. \"Se você está aqui pelo corpo, não vou pagar para você levá-lo.\"\n\nOlho para baixo novamente para o corpo quebrado e retorcido do meu irmão."
 ep3_laamps.6001.t:0 "Lar Doce Lar?"
 ep3_laamps.6003.a:0 "\"Eu vou te vingar, irmão. Isto eu prometo.\""
 ep3_laamps.6003.b.flavor:0 "Aquela imundície que matei parecia ter pelo menos alguma riqueza para seu nome..."
 ep3_laamps.6003.b.tt:0 "Adquirir um [artifact|E] bugiganga"
 ep3_laamps.6003.b:0 "O primeiro de muitos reparos aguarda."
 ep3_laamps.6003.desc:0 "Passo com desdém sobre o corpo contorcido d[Select_CString( frederick.IsFemale, 'a', 'o' )] [frederick.GetFirstNamePossessive], voltando-me para o corpo do [brother.GetFirstNamePossessive]. Com o tempo, haverá uma cova cavada, um serviço realizado, uma cerimônia para lembrar a vida cruelmente curta [brother.GetHerHim]. Por enquanto, a noite se aproxima e eu me sento para relembrar.\n\n[brother.GetSheHe|U] era um[Select_CString( brother.IsFemale, 'a', '' )] [brother.GetWomanMan] pacífic[Select_CString( brother.IsFemale, 'a', 'o' )]. Não era justo que alguém que só queria viver sua vida sem ser ferido sofresse um destino tão cruel. Sem querer, uma realização surge em minha mente.\n\n[frederick.GetCulture.GetCollectiveNoun]. [brother.GetSheHe|U] estaria vivo se não fosse por eles. Haverá mil irmãos, mil irmãs, mil pais e mães e filhos e filhas, #EMP todos#! por toda a terra, #EMP todos#! morrendo esta noite, #EMP todos#! devido a aqueles...\n\n#EMP Malditos. [frederick.GetCulture.GetCollectiveNounNoTooltip|U].#!"
 ep3_laamps.6003.t:0 "Um Prato Melhor Servido..."
 ep3_laamps.6005.a.tt:0 "Acho que avisto um nobre mal defendido trotando por ali mesmo agora..."
 ep3_laamps.6005.a:0 "Devemos primeiro encher os cofres, por qualquer meio necessário."
 ep3_laamps.6005.b.tt:0 "E, sendo local, talvez eles tenham um bom conhecimento de como navegar melhor por este terreno..."
 ep3_laamps.6005.b:0 "Talvez um cavaleiro local possa ser persuadido a se juntar à minha causa?"
 ep3_laamps.6005.desc:0 "Faz muitos anos desde que pisei pela última vez nessas terras. Um passo que não foi dado com leveza, por boas razões. Mesmo agora, o solo pantanoso suga minhas botas.\n\nEssas terras — minha casa — têm sido chamadas de '[Glossary( 'Os Pântanos', 'FENS_GLOSS' )]' por muitas gerações. De fato, as águas sobem tão alto em partes que Ely em si é tecnicamente uma ilha.\n\nNão há tempo a perder. Mesmo agora, aquele miserável normando aperta seu controle sobre as boas terras anglo-saxônicas. Para oferecer qualquer resistência, precisaremos dos dois principais elementos de qualquer guerra: dinheiro e homens."
 ep3_laamps.6005.t:0 "De Volta aos Pântanos"
 ep3_laamps.6010.a.flavor:0 "[powerful_vassal_capital.GetNameNoTooltip], é? Melhor eu começar a me organizar."
 ep3_laamps.6010.a.tt:0 "Você parte para [powerful_vassal_capital.GetNameNoTooltip]."
 ep3_laamps.6010.a:0 "Você pode contar comigo nos próximos dias."
 ep3_laamps.6010.b:0 "Sigo meu próprio caminho."
 ep3_laamps.6010.desc:0 "Ouvi falar de suas proezas e do bom trabalho que você está fazendo em Os Fens.\n\nGostaria que você se juntasse a mim em [powerful_vassal_capital.GetName]: temos muito o que discutir."
 ep3_laamps.6010.t:0 "[powerful_vassal.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 ep3_laamps.6015.a:0 "Você tem meu apoio."
 ep3_laamps.6015.b:0 "Preciso de mais tempo."
 ep3_laamps.6015.desc:0 "[powerful_vassal.GetTitledFirstNameRegnal], [Select_CString( powerful_vassal.IsFemale, 'a', 'o' )] mais poderos[Select_CString( powerful_vassal.IsFemale, 'a', 'o' )] dos restantes [powerful_vassal.GetCulture.GetName] senhores, me recebeu de braços abertos. Durante nossas conversas, o tópico raramente se desviou do óbvio.\n\n\"Não somos estranhos a ser governados por estranhos aqui em cima.\" [powerful_vassal.GetFirstNameNoTooltip] afirma, com um sorriso irônico diante de sua própria leveza, dedos entrelaçados de forma propositada. \"Nossos pais foram sujeitos a mais de um dinamarquês, afinal. Mas isso... isso é diferente.\"\n\n\"Eu pretendo desafiar est[Select_CString( william.IsFemale, 'a', 'e' )] #EMP [william.GetFirstNameNoTooltip]#!\" [powerful_vassal.GetSheHe] cospe o nome com veneno, \"mas preciso de apoio. A lealdade de quase todos é tênue.\" [powerful_vassal.GetSheHe|U] levanta seus olhos para os meus.\n\n\"Posso contar com sua ajuda?\""
 ep3_laamps.6015.t:0 "Por Inglaterra"
 ep3_laamps.6016.a.tt:0 "Você pega a missiva oferecida..."
 ep3_laamps.6016.a:0 "\"O que é?\""
 ep3_laamps.6016.ending:0 "[powerful_vassal.GetSheHe|U] abre sua boca mais uma vez, mas a porta se abre com um estrondo e corta [powerful_vassal.GetSheHe]. Um mensageiro, encharcado e com os olhos arregalados, interrompe a resposta indignada d[Select_CString( powerful_vassal.IsFemale, 'a', 'o' )] [powerful_vassal.GetFirstNamePossessiveNoTooltip] brandindo uma missiva.\n\nEu espero enquanto [Select_CString( powerful_vassal.IsFemale, 'a', 'o' )] [powerful_vassal.GetFirstNameNoTooltip] corta o selo e examina o pergaminho.\n\nA cor lentamente desaparece do rosto [powerful_vassal.GetHerHim]."
 ep3_laamps.6016.frustrated:0 "\"Esse é um tempo que não temos!\" [powerful_vassal.GetFirstName|U] bate na mesa para enfatizar o ponto, um lampejo de raiva surgindo no rosto [powerful_vassal.GetHerHim]. \"Mesmo agora há sussurros de retaliação! Quanto mais tempo levarmos, mais tempo [william.GetSheHe] terá para reunir apoio.\"\n\n\"Nós #EMP devemos#! agir rapidamente. Leve o tempo que precisar, mas só posso implorar que escolha seu lado enquanto ainda pode.\"\n\n"
 ep3_laamps.6016.happy:0 "\"Excelente! Muito excelente!\" [powerful_vassal.GetFirstName] bate na mesa em alívio. \"Mal posso pensar em um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] melhor para lutar ao meu lado.\" [powerful_vassal.GetSheHe|U] estende a mão e agarra minhas mãos com as [powerful_vassal.GetHerHim].\n\n\"Juntos, podemos ainda retomar essas terras daquela cobra normanda. Agora, devemos ser rápidos-\"\n\n"
 ep3_laamps.6016.t:0 "Um Fim Inauspicioso"
 ep3_laamps.6020.a:0 "A Inglaterra está em jogo."
 ep3_laamps.6020.desc:0 "A instalação de um novo rei estrangeiro — e um bastardo [william.GetCulture.GetName], para piorar — foi suficiente para romper a corda desgastada que mantém a Inglaterra unida. Levantes locais, patrocinados e instigados pelos derrotados e ressentidos anglo-saxões [Glossary( 'Æthelings', 'AETHELINGS_GLOSS' )], se espalham pelo país como fogo em palha.\n\n[william.GetTitledFirstName], tendo consolidado sua base de poder no sul, agora olha para o norte para pacificar aqueles que são ousados e tolos o suficiente para se opor a ele. Onde quer que seu olhar caia, a morte e a destruição o seguirão, e uma luta desesperada pela terra se desenvolveu.\n\n[william.GetFirstNameNoTooltip] terá que andar uma linha fina entre luva e manopla. Um toque muito leve pode fazer [william.GetSheHe] perder seu reino, mas uma retaliação muito brutal deixará não muito do reino para governar.\n\nPara os Æthelings, apenas a morte ou a glória os espera."
 ep3_laamps.6020.t:0 "A Destruição do Norte"
 ep3_laamps.6021.desc:0 "Minha legítima instalação no trono da Inglaterra foi suficiente para romper a corda desgastada que mantém o reino unido. Levantes locais, patrocinados e instigados pelos derrotados e ressentidos anglo-saxões [Glossary( 'Æthelings', 'AETHELINGS_GLOSS' )], se espalham pelo país como fogo em palha.\n\nCom minha base de poder no sul consolidada, agora devo olhar para o norte para pacificar aqueles que são ousados e tolos o suficiente para se opor a mim. Onde quer que meu olhar caia, a morte e a destruição seguirão, a menos que eu encontre minha posição usurpada pelos locais traiçoeiros.\n\nDevo andar uma linha fina entre luva e manopla. Um toque muito leve me fará perder meu reino, mas ser muito brutal na retaliação deixará não muito do reino para governar. Quanto aos Æthelings, no entanto...\n\nDeve não haver misericórdia para aqueles que não derem sua lealdade."
 ep3_laamps.7000.a:0 "A Escócia parece um plano."
 ep3_laamps.7000.b:0 "Já posso sentir o gosto do azeite apuliano!"
 ep3_laamps.7000.c:0 "Não devo negligenciar meus deveres."
 ep3_laamps.7000.desc:0 "Com tanta turbulência tomando conta das terras de [england.GetName], às vezes me pergunto se meu destino está em outro lugar.\n\nJá o tumulto está começando, na esteira do controle que [Select_CString( william.IsFemale, 'a', 'o' )] [william.GetTitledFirstNamePossessive] tomou do reino. Suspeito que ficará ainda mais feio do que está atualmente, e uma vida na estrada, seguindo os passos de meu pai, tem um certo apelo.\n\nTalvez eu possa ir para o norte, para a Escócia? Ou talvez para o sul da Itália, nas encostas apulianas?"
 ep3_laamps.7000.t:0 "Outro Caminho"
 ep3_laamps.7001.a:0 "\"[siward.GetFirstNameNoTooltip], é? Bem-vindo!\""
 ep3_laamps.7001.b:0 "\"Estamos cheios, receio.\"\n"
 ep3_laamps.7001.desc:0 "\"[ROOT.Char.GetFirstNameNoTooltip]? É aqui que [ROOT.Char.GetFirstNameNoTooltip] vive? Ah- solte-me, você-\" Uma voz poderosa sinaliza a chegada de um visitante, rapidamente cercado por meus guardas. Eu saio da tenda para ver um[Select_CString( siward.IsFemale, 'a', '' )] [siward.GetWomanMan] robust[Select_CString( siward.IsFemale, 'a', 'o' )] com uma espada apoiada no ombro [siward.GetHerHim].\n\n\"Você! Você é [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetFirstNameNoTooltip], não é?\" Eu aceno em assentimento enquanto [siward.GetSheHe] avança, o braço livre estendido.\n\n\"Seu nome o precede! Eu sou [siward.GetFirstName], da [siward.GetHouse.GetBaseName]. Eu vim para me juntar a você.\""
 ep3_laamps.7001.t:0 "Há Outro"
 ep3_laamps.7002.a:0 "\"Boas viagens. Que você encontre sua paz.\""
 ep3_laamps.7002.b:0 "Agora isso soa #EMP muito#! interessante..."
 ep3_laamps.7002.c.failure:0 "[siward.GetFirstNameNoTooltip] vai embora"
 ep3_laamps.7002.c.success:0 "[siward.GetFirstNameNoTooltip] fica"
 ep3_laamps.7002.desc:0 "[siward.GetFirstName], m[Select_CString( siward.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('siward'))] leal, se aproxima de mim com um brilho nos olhos [siward.GetHerHim].\n\n\"Vim para me despedir.\" [siward.GetSheHe|U] interrompe minhas próximas protestos com uma mão levantada. \"Tomei minha decisão, não há como me deter.\" [siward.GetSheHe|U] faz um gesto para que eu me sente.\n\n\"Há sussurros vindo de Constantinopla. [emperor.GetTitledFirstName] oferece passagem segura para qualquer refugiado da ira d[Select_CString( king_england.IsFemale, 'a', 'o' )] [king_england.GetTitledFirstNamePossessive], e uma chance de reconstruir.\" [siward.GetFirstNameNoTooltip] bate nas coxas e olha ao redor.\n\n\"Sentirei falta deste lugar. Adeus, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom('SisterBrother')].\""
 ep3_laamps.7002.t:0 "Uma Nova Inglaterra"
 ep3_laamps.7003.a.tt:0 "Você parte para as novas terras..."
 ep3_laamps.7003.a:0 "\"Eu aceito sua proposta, poderos[Select_CString( emperor.IsFemale, 'a', 'o' )] [emperor.GetTitleAsNameNoTooltip].\""
 ep3_laamps.7003.b:0 "\"Prefiro ficar aqui, em Constantinopla.\""
 ep3_laamps.7003.desc:0 "Ser concedida uma audiência com [Select_CString( emperor.IsFemale, 'a', 'o' )] [emperor.GetTitleAsNameNoTooltip] não é pouca coisa, mas claramente minha chegada com meu grupo desajustado de estrangeiros agitou algumas línguas.\n\n\"Bem-vindo, [ROOT.Char.GetFirstName] da [ROOT.Char.GetHouse.GetBaseName]. Você veio reivindicar um refúgio contra as desgraças de sua terra natal?\" Eu só consigo balançar a cabeça em sinal afirmativo; [Select_CString( emperor.IsFemale, 'a', 'o' )] [emperor.GetTitleAsNameNoTooltip] oferece um sorriso sombrio e sem humor. \"Você estará seguro aqui, mas coisas maiores estão ao seu alcance.\"\n\n\"Ao nordeste, há terras governadas por um vassalo falso de meu. Viaje até lá, tome-as para si, e você poderá mantê-las em troca de lealdade.\"\n\nAs palavras d[Select_CString( emperor.IsFemale, 'a', 'o' )] [emperor.GetTitleAsNamePossessiveNoTooltip] ecoam entre suspiros dispersos. Um novo reino? Para nós, fugitivos?"
 ep3_laamps.7003.t:0 "Uma Audiência Regal"
 ep3_laamps.7004.a:0 "\"Eu ficaria honrado.\""
 ep3_laamps.7004.b:0 "\"Essas terras me foram prometidas. Eu as tomarei pela força.\""
 ep3_laamps.7004.desc:0 "\"[emperor.GetSheHe] te mandou aqui? Chama essas terras de sua?\" O lábio d[Select_CString( title_holder.IsFemale, 'a', 'o' )] [title_holder.GetFirstNamePossessive] se enrosca em raiva e desdém. \"Você foi vendido por uma história, seu tolo.\"\n\nParece que o Império d[Select_CString( emperor.IsFemale, 'a', 'o' )] [emperor.GetTitleAsNamePossessiveNoTooltip] não se estende tão longe quanto [emperor.GetSheHe] insinuou. As terras que descobrimos ao chegar — densamente florestadas, mas surpreendentemente férteis — não estavam de fato nas mãos gregas, mas sim nas d[Select_CString( title_holder.IsFemale, 'a', 'o' )] [title_holder.GetTitleAsNameNoTooltip] [title_holder.GetFirstNameNoTooltip].\n\n\"Aquele canalha em seu trono elegante te levou a um engano. Mas...\" [title_holder.GetSheHe|U] faz uma pausa para me observar e observar meus seguidores desmazelados, mas cheios de espírito. \"...talvez você #EMP possa#! oferecer algo. Se você tiver o dinheiro para comprar seu caminho, poderá ter essas terras. Como meu vassalo, é claro.\""
 ep3_laamps.7004.t:0 "Outra Audiência Regal"
