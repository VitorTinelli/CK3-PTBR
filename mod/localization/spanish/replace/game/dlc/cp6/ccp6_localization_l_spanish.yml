 building_yazd_mosque_01:0 "Grande Mesquita de Yazd"
 building_yazd_mosque_01_desc:0 "Construído sobre o local de um Templo do Fogo do século IV, este ilustre edifício encanta viajantes e peregrinos com seus grandes iwans, cúpula revestida de azulejos e seu majestoso portal de entrada com um par de minaretes altíssimos."
