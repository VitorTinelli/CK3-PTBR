l_spanish:
 building_boudhanath_01:0 "Boudhanath"
 building_boudhanath_01_desc:0 "A Estupa de Boudha de Catmandu, também conhecida como Jarung Kashor e Khāsa Chaitya, é uma das maiores estupas do Budismo e pode ser o local de origem do que se tornou o ramo tibetano do Budismo. Sua enorme cúpula e mandala abrigam os restos de múltiplos budas e inúmeras relíquias sagradas de diversas formas e tamanhos. \n\nDevido à sua localização em uma antiga rota comercial entre o Nepal e o Tibete, viajantes e mercadores frequentemente param ali para descansar e rezar."
 building_holy_site_st_peters_basilica_01:0 "Basílica de São Pedro"
 building_holy_site_st_peters_basilica_01_desc:0 "Construída sobre o local do túmulo de São Pedro na Colina do Vaticano por ordem do Imperador Constantino I após sua conversão ao Cristianismo, a Basílica de São Pedro serve como o centro da Cristandade no Ocidente. \n\nEsta igreja tradicionalmente serve como a sede do Papa da Igreja Católica Romana e cresceu ao longo dos séculos, tornando-se um vasto complexo protegido pela Muralha Leonina."
 building_mont_st_michel_01:0 "Oratório de São Aubert a São Miguel"
 building_mont_st_michel_01_desc:0 "Em 708, São Aubert, Bispo de Avranches, teve em um sonho a visão do Arcanjo Miguel, instruindo-o a construir um oratório sobre uma ilha de marés próxima. Aubert inicialmente ignorou essa visão, atribuindo-a a um truque do Diabo. Eventualmente, o Arcanjo conseguiu convencê-lo — segundo a lenda, perfurando seu crânio com um toque — e o bispo ordenou a construção de um novo santuário no Monte Tombe. \n\nAssim começa a história de Mont-Saint-Michel."
 building_mont_st_michel_02:0 "A Abadia Românica de Mont-Saint-Michel"
 building_mont_st_michel_02_desc:0 "A nova igreja da abadia está situada no ponto mais alto da ilha, como um testemunho do poder de Deus acima de tudo no Céu e na Terra, e da engenhosidade da humanidade. \n\nSob a abadia, uma pequena cidade de peregrinos e pescadores cresce lentamente."
 building_mont_st_michel_03:0 "A Maravilha"
 building_mont_st_michel_03_desc:0 "A abadia foi expandida com uma série de claustros, uma capelania, uma adega, a Sala dos Cavaleiros e muitas acomodações, formando um complexo gótico que só pode ser descrito como uma maravilha da engenharia. \n\nA abadia possui novas e formidáveis fortificações, e o assentamento abaixo dela agora é uma verdadeira cidade, abrigando muitos peregrinos e habitantes locais."
 building_mont_st_michel_04:0 "Mosteiro Fortificado de Mont-Saint-Michel"
 building_mont_st_michel_04_desc:0 "Guerras recentes deixaram claro que até mesmo uma ilha de paz como Mont-Saint-Michel pode ser um ponto estratégico essencial. Por isso, o rochedo foi completamente fortificado com pesadas muralhas e baluartes, e várias novas acomodações foram criadas para a guarnição. \n\nA cidade costeira agora é um centro urbano vibrante, com quase toda a ilha coberta por casas."
 building_qutb_minar_01:0 "Pilar de Ferro de Déli"
 building_qutb_minar_01_desc:0 "O imponente Pilar de Ferro de Déli ergue-se como um símbolo da glória do rei Chandragupta II, embora governantes posteriores também tenham gravado seus nomes nele. Apesar de estar de pé há muito tempo, não há qualquer vestígio de ferrugem — um testemunho da habilidade dos ferreiros indianos!"
 building_qutb_minar_02:0 "Qutb Minar"
 building_qutb_minar_02_desc:0 "A Quwwat-ul-Islam, uma grande mesquita que circunda o antigo local onde ficava o Pilar de Ferro de Déli, é coroada por um minarete verdadeiramente gigantesco chamado Qutb Minar. \n\nUm monumento magnífico ao poder dos governantes de Déli."
 building_qutb_minar_03:0 "Mesquita Quwwat-ul-Islam Expandida"
 building_qutb_minar_03_desc:0 "O complexo ao redor do Qutb Minar foi expandido com vários outros pátios, portais e mausoléus, alcançando proporções lendárias."
 building_qutb_minar_04:0 "Alai Minar"
 building_qutb_minar_04_desc:0 "Um segundo minarete foi adicionado ao complexo, projetado à imagem do Qutb Minar, porém com o dobro do tamanho. Este colosso que se eleva sobre Déli representa o ápice da arquitetura indo-islâmica."
 building_sanchi_stupa_01:0 "Grande Estupa de Sanchi"
 building_sanchi_stupa_01_desc:0 "A Grande Estupa foi construída pelo imperador máuria Ashoka no século III a.C., perto do local de seu casamento com sua esposa Devi. A grandiosa estrutura que abriga relíquias do Buda é uma das mais antigas de seu tipo, e também é famosa por seus portais torana ricamente esculpidos."
