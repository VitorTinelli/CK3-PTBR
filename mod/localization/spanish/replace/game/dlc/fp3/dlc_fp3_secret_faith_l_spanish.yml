 child_secret_faith_conversion_critical_failure_effect.desc:0 "[child.GetFirstNameNoTooltip] revela meu segredo"
 child_secret_faith_conversion_critical_failure_effect.liege.desc:0 "[child.GetFirstNameNoTooltip] revela o guardião de [guardian.GetSecretFaith.GetName]"
 child_secret_faith_conversion_failure_effect.desc:0 "[child.GetFirstNameNoTooltip] está em dúvida"
 child_secret_faith_conversion_success_effect.desc:0 "[child.GetFirstNameNoTooltip] está convencido"
 secret_faith.1001.message:0 "Indução de [guardian.GetSecretFaith.GetName]"
 secret_faith.1002.a:0 "[child.GetSheHe|U] merece saber do poder de [ROOT.Char.GetSecretFaith.HighGodNameAlternatePossessive]."
 secret_faith.1002.b:0 "[child.GetFirstNameNoTooltip] é uma causa perdida."
 secret_faith.1002.desc:0 "[child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] paira no limbo entre a infância e a idade adulta. Eu ensinei [child.GetSheHe] o suficiente para entender a verdade, e [child.GetSheHe] ainda é jovem o suficiente para ter uma mente aberta.\n\nSe eu quiser iniciar [child.GetSheHe] no serviço de [ROOT.Char.GetSecretFaith.HighGodName], é agora ou nunca."
 secret_faith.1002.t:0 "A Era do Conhecimento"
 secret_faith.1003.a:0 "Sim, me conte tudo! Por favor!"
 secret_faith.1003.b:0 "Não, acho que não..."
 secret_faith.1003.c:0 "Isso é blasfêmia!"
 secret_faith.1003.desc:0 "Há certas coisas que [guardian.Custom2('MyCharacterIntroduction', ROOT.Char)] me contou que ninguém mais menciona. Nunca aprofundamos muito nesses tópicos, e sei melhor do que fazer perguntas. \n\nNo entanto, esta noite, algo parece diferente entre nós. Enquanto nos sentamos para ler, [guardian.GetSheHe] pergunta se há algo que estou curioso para saber..."
 secret_faith.1003.t:0 "Conhecimento Oculto"
