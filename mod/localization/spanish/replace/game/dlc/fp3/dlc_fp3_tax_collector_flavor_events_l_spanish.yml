l_spanish:
 fp3_clan.1000.a:0 "Algumas moedas pelo seu esforço."
 fp3_clan.1000.b:0 "Um trabalho tão magnífico merece um prêmio!"
 fp3_clan.1000.c:0 "#EMP Delicioso#!! Excelente trabalho, [target_tax_collector.GetFirstNameNoTooltip]!"
 fp3_clan.1000.desc:0 "Meu arrecadador de impostos, [target_tax_collector.GetFirstName], voltou de sua recente jornada pelo reino. [target_tax_collector.GetSheHe|U] solicitou uma audiência, alegando ter trazido algo #EMP mais valioso#! que ouro.\n\n\"Meu senhor feudal, acabei de coletar o que é devido à coroa em [secret_holder.GetCapitalLocation.GetName]. Durante minha estadia lá, ouvi rumores discretos de que [secret_holder.GetTitledFirstName] [target_secret.Custom('SecretDescriptionThirdPerson')]...\"\n\n\"...e após uma investigação mais aprofundada, esses rumores parecem ser genuínos."
 fp3_clan.1000.t:0 "Vale Mais que Ouro?"
 fp3_clan.1010.a.failure:0 "[target_tax_collector.GetFirstNameNoTooltip] não está convencido"
 fp3_clan.1010.a.success:0 "Você convence [target_tax_collector.GetFirstNameNoTooltip] a devolver o dinheiro"
 fp3_clan.1010.a:0 "Você devolverá o que é devido #EMP imediatamente!#!"
 fp3_clan.1010.b.flavor:0 "Você elogia [target_tax_collector.GetFirstNameNoTooltip] por sua astúcia"
 fp3_clan.1010.b:0 "Oportunidade mais instinto é igual a lucro."
 fp3_clan.1010.c:0 "Uma dúzia de chibatadas deve lembrar quem é o dono do ouro que você coleta."
 fp3_clan.1010.desc:0 "Meu Administrador, [steward.GetTitledFirstName], tem revisado os registros fiscais e identificado algumas inconsistências nos registros de arrecadação de [target_tax_collector.GetFirstNamePossessive] - inconsistências que somam quase [ROOT.Var('embezzled_gold').GetValue] de ouro...\n\nA única razão lógica para tais discrepâncias é que [target_tax_collector.GetFirstNameNoTooltip] tem desviado fundos da coroa. Eu o chamei diante de mim para responder a essas acusações.\n\n\"É verdade, meu senhor feudal. Embora eu esteja um pouco envergonhado, imploro para que veja a astúcia em minhas ações - uma habilidade que talvez você possa aproveitar em empreendimentos futuros...\""
 fp3_clan.1010.t:0 "Seu Cálice Transborda"
 fp3_clan.1020.a:0 "\"Bem feito, [target_tax_collector.GetFirstNameNoTooltip]! Você deveria se orgulhar de seu ofício.\""
 fp3_clan.1020.b.improved_tax_collectors.desc:0 "[target_tax_collector.GetFirstNameNoTooltip] compartilhou seus conhecimentos com [ROOT.Var('num_improved_tax_collectors').GetValue] arrecadadores de impostos"
 fp3_clan.1020.b.improved_tax_collectors:0 "Arrecadadores de Impostos Aprimorados"
 fp3_clan.1020.b.none_improved.desc:0 "[target_tax_collector.GetFirstNameNoTooltip] não conseguiu transmitir nenhum ensinamento aos colegas arrecadadores de impostos"
 fp3_clan.1020.b.none_improved:0 "Nenhum Arrecadador de Impostos Aprimorado"
 fp3_clan.1020.b:0 "\"Talvez você pudesse ensinar algumas coisas aos outros arrecadadores de impostos?\""
 fp3_clan.1020.c:0 "\"Eu não tenho tempo para inflar seu ego!\""
 fp3_clan.1020.desc:0 "Meu Administrador, [steward.GetTitledFirstName], se aproxima de mim com [target_tax_collector.GetFirstName], meu arrecadador de impostos, seguindo de perto.\n\n\"[target_tax_collector.GetFirstNameNoTooltip] tem se saído especialmente bem ultimamente. "
 fp3_clan.1020.diplomacy:0 "[target_tax_collector.GetSheHe|U] mostrou uma habilidade profunda na arte da diplomacia.\"\n\n"
 fp3_clan.1020.every_tax_collector:0 "Cada [tax_collector|E]"
 fp3_clan.1020.intrigue:0 "[target_tax_collector.GetSheHe|U] demonstrou uma inclinação para as artes mais sutis de seu ofício.\"\n\n"
 fp3_clan.1020.outro:0 "\"Eu diria que [target_tax_collector.GetSheHe] merece alguma forma de elogio, meu senhor feudal. Afinal, aprimorar essa habilidade pode significar mais ouro nos cofres do reino.\""
 fp3_clan.1020.stewardship:0 "[target_tax_collector.GetSheHe|U] tem mostrado promessa em assuntos de administração e números.\"\n\n"
 fp3_clan.1020.t:0 "Aprendizado Prático"
 fp3_clan.1030.a:0 "Claramente [target_tax_collector.GetFirstNameNoTooltip] não está apto para este distrito fiscal."
 fp3_clan.1030.b:0 "[target_taxed_vassal.GetFirstNameNoTooltip] pagará o que é devido [target_taxed_vassal.GetHerHim]."
 fp3_clan.1030.c:0 "Resolvam isso entre vocês."
 fp3_clan.1030.desc:0 "\"Eu me recuso a pagar impostos a um[Select_CString( target_taxed_vassal.IsFemale, 'a', '' )] [target_tax_collector.Custom2('InsultAdjective', SCOPE.sC('target_taxed_vassal'))] [target_tax_collector.GetFaith.GetAdherentNameNoTooltip]!\" [target_taxed_vassal.GetTitledFirstName] grita na cara de [target_tax_collector.GetFirstName].\n\n\"É meu dever arrecadar impostos para a coroa! Um insulto ao meu caráter é um insulto a [ROOT.Char.GetNameNoTooltip]!\" [target_tax_collector.GetFirstNameNoTooltip] retruca. \"Meu senhor feudal, por favor resolva essa disputa para que eu possa continuar meu trabalho.\"\n\n[target_taxed_vassal.GetTitledFirstNameNoTooltip] fica furioso enquanto [target_tax_collector.GetFirstNameNoTooltip] bate o pé impacientemente. Claramente, devo decidir se satisfaço meu vassalo ou apoio meu arrecadador de impostos..."
 fp3_clan.1030.t:0 "Disputa de Impostos"
 fp3_clan.1040.a:0 "Lembrar todos os meus vassalos de suas responsabilidades."
 fp3_clan.1040.b.failure:0 "[target_taxed_vassal.GetTitledFirstNameNoTooltip] não compreende seus ensinamentos"
 fp3_clan.1040.b.success:0 "Você instrui com sucesso [target_taxed_vassal.GetTitledFirstNameNoTooltip]"
 fp3_clan.1040.b:0 "Eu mesmo ensinarei uma ou duas coisas a [target_taxed_vassal.GetSheHe]!"
 fp3_clan.1040.c:0 "Talvez um lembrete mais #EMP físico#! da minha autoridade seja necessário..."
 fp3_clan.1040.desc:0 "Meu arrecadador de impostos, [target_tax_collector.GetFirstName], apresenta um relatório de sua última pesquisa no reino e destaca um assunto de grande preocupação:\n\n\"Meu senhor feudal, a forma como [target_taxed_vassal.GetTitledFirstName] administra as terras [target_taxed_vassal.GetHerHim] é completamente inaceitável! Muito mais poderia ser feito com as terras de [target_taxed_vassal.GetPrimaryTitle.GetNameNoTier] se tivessem um zelador competente.\""
 fp3_clan.1040.t:0 "Terra Mal Administrada"
 tax_collector_fired_on_religious_grounds:0 "Arrecadador de Impostos Demitido por Motivos Religiosos"
