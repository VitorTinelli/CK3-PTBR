l_spanish:
 clan_event.2000.a.success:0 "[improved_tax_collector.GetNameNoTooltip] agradou os vassalos"
 clan_event.2000.a:0 "Atender às necessidades do povo."
 clan_event.2000.b.success:0 "[improved_tax_collector.GetNameNoTooltip] deixa os vassalos nervosos"
 clan_event.2000.b:0 "Organizar patrulhas de guarda. #EMP Isso#! manterá os vassalos na linha."
 clan_event.2000.c.success:0 "[improved_tax_collector.GetNameNoTooltip] melhora a arrecadação de impostos"
 clan_event.2000.c:0 "Manter um livro-caixa e organizar seu trabalho."
 clan_event.2000.d.success:0 "[improved_tax_collector.GetNameNoTooltip] descobriu um segredo"
 clan_event.2000.d.tt:0 "Se houver um segredo desconhecido disponível, aprenda um segredo de um vassalo taxado por [improved_tax_collector.GetName]."
 clan_event.2000.d:0 "Espiar meus súditos. Você aprenderá muito mantendo um olhar atento."
 clan_event.2000.desc:0 "Parece que m[Select_CString( improved_tax_collector.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('improved_tax_collector'))] [improved_tax_collector.GetName] tem se saído excepcionalmente bem ultimamente. E assim, uma oportunidade se apresentou, permitindo-me orientar e influenciar grandemente o trabalho [improved_tax_collector.GetHerHim] no futuro previsível.\n\nTalvez esta seja uma oportunidade para [improved_tax_collector.GetSheHe] aprimorar ainda mais suas habilidades?"
 clan_event.2000.e1:0 "Dedicar seu tempo a estudos acadêmicos."
 clan_event.2000.e2:0 "Dedicar seu tempo a assuntos de fé. Ninguém está acima de [ROOT.Char.GetFaith.HighGodName]."
 clan_event.2000.g:0 "Fale favoravelmente de mim enquanto viaja."
 clan_event.2000.option_f:0 "Você está aqui para coletar impostos, não é? Então, #EMP me#! traga impostos!"
 clan_event.2000.t:0 "Aprendendo no Trabalho"
 clan_event.2001.a:0 "Impostos beneficiam a ambos!"
 clan_event.2001.b:0 "Certamente você poderia fazer melhor?"
 clan_event.2001.education_diplomacy:0 "\"... e consegui resolver toda a situação apenas com palavras! A maravilhosa arte da diplomacia.\""
 clan_event.2001.education_intrigue:0 "\"... depois de algumas ameaças veladas, finalmente pagaram e pude seguir meu caminho. Fico pensando se terei que cuidar das minhas costas quando for lá na próxima vez...\""
 clan_event.2001.education_learning:0 "\"... e então acabamos em um debate acalorado. Naturalmente, usei uma lógica superior para vencer a argumentação. No final, eles estavam até #EMP felizes#! em pagar aquelas últimas moedas!\""
 clan_event.2001.education_martial:0 "\"... mas fiz bom uso dos soldados que me acompanhavam, garantindo que conseguíssemos cada moeda que lhe deviam, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord]!\""
 clan_event.2001.education_stewardship:0 "... descobri que era #EMP muito#! grato por manter registros tão detalhados. Vou garantir trazer os livros-caixa comigo daqui para frente."
 clan_event.2001.opening_desc:0 "[educational_tax_collector.GetName] parece ter aprendido muito em seu dever como coletor de impostos. O que fica claro ao relatar seus esforços mais recentes.\n\n"
 clan_event.2001.success:0 "Habilidade aumentada de [educational_tax_collector.GetNameNoTooltip]"
 clan_event.2001.t:0 "Impostos Educacionais"
 clan_event.2002.a:0 "Permita-me ajudar!"
 clan_event.2002.b:0 "Por que você não tira um descanso?"
 clan_event.2002.c:0 "Bom. Meus vassalos #EMP esperam#! que seus impostos sejam tratados eficientemente..."
 clan_event.2002.desc:0 "A hora está tarde, mas vejo um lampejo de luz vindo do próximo quarto, onde a porta foi deixada entreaberta. Empurro suavemente a porta e encontro m[Select_CString( troubled_tax_collector.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('troubled_tax_collector'))] [troubled_tax_collector.GetName] com olhos cansados, curvado sobre um livro aberto. Outra pilha de livros ao lado [troubled_tax_collector.GetHerHim].\n\n[troubled_tax_collector.GetSheHe|U] levanta sua cabeça e percebe minha presença: 'Ah, perdoe-me [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord], mas ainda tenho que classificar essas últimas contas de impostos...'"
 clan_event.2002.t:0 "Coletor de Impostos Sobrecarregado"
 clan_event.2005.a:0 "Um presente muito apreciado!"
 clan_event.2005.b:0 "Você pode manter seu servo. Sua lealdade é suficiente."
 clan_event.2005.c:0 "[bad_tax_collector.GetNameNoTooltip] simplesmente terá que trabalhar mais..."
 clan_event.2005.desc:0 "Meu(a) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('loyal_vassal'))] [loyal_vassal.GetName] apareceu em minha corte inesperadamente, com um[Select_CString( tax_collector_replacement.IsFemale, 'a', '' )] [tax_collector_replacement.GetWomanMan] seguindo de perto.\n\n'Grande [ROOT.Char.GetTitleAsNameNoTooltip]! Não escapei à minha atenção que seu coletor de impostos [bad_tax_collector.GetName] é, digamos, #EMP carente#! das habilidades necessárias para desempenhar seu trabalho adequadamente. Por isso, trago-lhe um presente.'\n\n[loyal_vassal.GetFirstNameNoTooltip] faz um gesto para seu companheiro: \"'[tax_collector_replacement.GetName] servirá admiravelmente a você.'"
 clan_event.2005.t:0 "Oferecendo uma Substituição"
 clan_event.2007.a:0 "Ehm. Talvez você pudesse me ajudar com isso?"
 clan_event.2007.b:0 "Eu consigo lidar com isso sozinho, muito obrigado."
 clan_event.2007.c:0 "Você acabou de se voluntariar para cuidar disso? Obrigado!"
 clan_event.2007.desc:0 "Estou encarando este estúpido livro-caixa há horas. Ele #EMP claramente#! não fecha. No entanto, não consigo encontrar o problema real...\n\nDe repente, percebo que m[Select_CString( helping_tax_collector.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('helping_tax_collector'))] [helping_tax_collector.GetName] olha por cima do meu ombro, inspecionando o livro-caixa à minha frente. [helping_tax_collector.GetSheHe|U] toca seu dedo no topo da página.\n\n'Talvez você queira começar por aí, [ROOT.Char.Custom('FormOfAddressForLiege')].'"
 clan_event.2007.failure:0 "O livro-caixa continua uma bagunça caótica"
 clan_event.2007.failure_tt:0 "Você não consegue entender"
 clan_event.2007.success:0 "Você classificou com sucesso o livro-caixa"
 clan_event.2007.success_tt:0 "Você supera o livro-caixa e encontra o problema"
 clan_event.2007.successful_tax_collector:0 "[helping_tax_collector.GetName] coletou os impostos em falta"
 clan_event.2007.t:0 "Um Livro-caixa Problemático"
 clan_event.2007.tt:0 "#weak [helping_tax_collector.GetName] encontra irregularidades adicionais no livro-caixa, onde alguns pequenos detentores de terras lhe devem impostos.#!"
 every_taxed_vassal_tt:0 "Todo [taxpayer|E] atribuído a [tax_collector_name.GetName]"
 fp3_diplomatic_tax_collection_opinion:0 "Satisfeito com [tax_collector|E]"
 fp3_efficient_tax_collector:0 "Coletor de Impostos Habilidoso"
 fp3_efficient_tax_collector_desc:0 "Um coletor de impostos no governo deste personagem é especialmente habilidoso e não deixa uma única pedra sem ser virada em busca de moedas."
 fp3_outrageous_tax_collection_opinion:0 "Indignado com a Tributação"
 fp3_thankful_tax_collector_opinion:0 "Grato"
