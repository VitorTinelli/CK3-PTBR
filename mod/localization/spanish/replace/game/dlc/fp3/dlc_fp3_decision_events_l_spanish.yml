l_spanish:
 cultural_acceptance_built_magnificent_capital:0 "Magnífico projeto de construção local"
 destroy_the_magi_opinion_tooltip:0 "Os governantes [root_religion.GetAdjective] com crenças menos radicais ficarão muito chateados com isso."
 every_house_member:0 "Cada membro da [house|E] [root_scope.MakeScope.Char.GetHouse.GetBaseNameNoTooltip]"
 fervor_gain_magi_destroyed:0 "Os Magos Reformados"
 fp3_decision.0001.a.tt:0 "Você faz um voto solene de apagar as chamas sagradas."
 fp3_decision.0001.a:0 "O que estou fazendo? Os templos deveriam ser destruídos."
 fp3_decision.0001.b:0 "Uma cerimônia elaborada, condizente com a glória dos reis persas!"
 fp3_decision.0001.c:0 "Uma cerimônia modesta será suficiente."
 fp3_decision.0001.d:0 "As chamas podem esperar."
 fp3_decision.0001.desc_general_zoroastrian:0 "Agora que sou [ROOT.Char.GetTitleTierName], devo governar guiado pela luz da glória de meus antepassados e buscar o favor de [ROOT.Char.GetFaith.HighGodNamePossessive]."
 fp3_decision.0001.desc_khurramite:0 "Talvez ninguém devesse ser [ROOT.Char.GetTitleTierName] deste mundo. No entanto, as pessoas me confiaram essa posição, e merecem a proteção de Ātar, o #italic yazata#! do calor e da luz."
 fp3_decision.0001.desc_less_recently:0 "Nos primeiros dias do califado Abássida, seus exércitos perseguiram o líder Khurramite Babak até uma fortaleza alta em uma montanha na floresta Arasbaran, onde ele fez sua última resistência. Embora a ruína tenha sido desgastada pelos elementos ao longo dos anos, o local permanece impressionante e será uma ótima fortificação."
 fp3_decision.0001.desc_long_ago:0 "Lá no alto das Montanhas Negras da floresta Arasbaran, uma ruína de fortaleza repousa no topo de um pico coberto de neve. Este ninho de águia foi o local da última resistência do herói Khurramite Babak, há muito tempo, e eu o restaurarei para a glória que poderia ter tido nos dias antigos."
 fp3_decision.0001.desc_mazdakist:0 "Embora Mazdak, se estivesse vivo, quisesse que eu fechasse os templos do fogo, chamando-os de monumentos à vaidade, eu sou [ROOT.Char.GetTitleTierName], e posso escolher outro caminho. Se eu devo honrar seu legado, devo abençoar meu reinado no fogo, como os grandes reis do passado."
 fp3_decision.0001.t:0 "Acender o Fogo Real"
 fp3_decision.0001_desc_ending:0 "Realizarei uma cerimônia na corte para acender uma grande chama na [ROOT.Char.Custom('ResidenceBuilding')] de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], e que ela queime durante todo o meu reinado."
 fp3_decision.0001_pledged_to_quench_fire:0 "Esta decisão ficará indisponível por 20 anos."
 fp3_decision.0001_vassal_and_courtier_opinion:0 "Cortesãos e vassalos de fé hostil podem não gostar disso, mas outros ficarão impressionados."
 fp3_decision.0001_vassal_and_courtier_opinion_impressed:0 "Cortesãos e vassalos de fé hostil podem não gostar disso, mas outros podem ficar #italic muito#! impressionados."
 fp3_decision.0002.a:0 "Não importa, um símbolo era tudo o que era."
 fp3_decision.0002.b:0 "Essa atrocidade será vingada!"
 fp3_decision.0002.c:0 "O que devo fazer agora?"
 fp3_decision.0002.desc:0 "O desastre atinge! Enquanto os exércitos de [occupant.GetName] saqueavam [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] e assaltavam a [ROOT.Char.Custom('ResidenceBuilding')], alguns de seus soldados chegaram à sala que abrigava meu fogo real e o apagaram cruelmente. Isso pode ser percebido como um presságio terrivelmente ruim para a dinastia [ROOT.Char.GetDynastyNameNoTooltip]."
 fp3_decision.0002.t:0 "Apagar do Fogo Real"
 fp3_decision.0002_fire_destroyed_tt:0 "Cortesãos e vassalos supersticiosos ou ardentes veem isso como um presságio muito ruim para o seu reinado."
 fp3_decision.0003.a:0 "Posso ver uma maneira de recuperar alguns custos..."
 fp3_decision.0003.b:0 "Será uma fortaleza poderosa!"
 fp3_decision.0003.c:0 "Não preciso de glória, apenas de uma fortaleza segura."
 fp3_decision.0003.desc_ending:0 "Chegou a hora de estabelecer um novo assento para a casa [ROOT.Char.GetDynastyHouseNameNoTooltip], e que ele perdure por muito tempo!"
 fp3_decision.0003.desc_fallback:0 "A população local é belicosa e propensa a rebeliões, mas adora a memória de Babak, consagrada em sagas e canções, e me ajudará a reconstruir sua antiga casa de montanha.\n\n"
 fp3_decision.0003.desc_khurramite:0 "Os [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] locais são muito simpáticos ao meu empreendimento e se comprometeram a me ajudar a restaurar e garantir o local.\n\n"
 fp3_decision.0003.desc_recently:0 "Apenas algumas décadas atrás, durante o auge da rebelião Khurramite contra os Abássidas, o líder camponês Babak se refugiou com seus seguidores em uma antiga fortaleza parta. Aquilo se tornou sua última resistência, mas os Abássidas pagaram caro pela vitória."
 fp3_decision.0003.desc_zandik:0 "Os camponeses e pastores dessas montanhas acidentadas são notoriamente indisciplinados, mas detestam o antigo clero [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] e me prometeram apoio.\n\n"
 fp3_decision.0003.t:0 "A Fortaleza de Badd"
 fp3_decision.0004.a:0 "Isso abrirá muitas portas... para mim!"
 fp3_decision.0004.b:0 "E que as brasas se transformem em cinzas frias!"
 fp3_decision.0004.c:0 "Até um mendigo pode agora se tornar um sacerdote."
 fp3_decision.0004.d:0 "Isso foi para o bem de todos."
 fp3_decision.0004.t:0 "Uma Fé para o Povo"
 fp3_decision.0004_alternate.t:0 "Apagando as Chamas Eternas"
 fp3_decision.0004_alternate_desc:0 "Por muito tempo, os [ROOT.Char.GetFaith.random_AltPriestTermPlural] nos perseguiram, [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]. Por muito tempo, eles se apegaram às chamas sagradas, ao poder e riqueza herdada. De fora de nossa fé, outros observaram essas práticas arcaicas com desprezo. Chega! Dentro do [ROOT.Char.GetFaith.GetNameNoTooltip], os [ROOT.Char.GetFaith.HouseOfWorshipPlural] serão fechados, e as chamas eternas serão apagadas para sempre. Isso quebrará o poder dos [ROOT.Char.GetFaith.random_AltPriestTermPlural] e anunciará um novo começo para [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]. De agora em diante, não seremos liderados por [ROOT.Char.Custom('DefaultPriestWomenMen')] mortais — apenas por [ROOT.Char.GetFaith.HighGodName]."
 fp3_decision.0004_desc:0 "Por muito tempo, nós [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] seguimos nosso próprio caminho e adoramos [ROOT.Char.GetFaith.HighGodName] de uma maneira que melhor satisfazia nossos corações. Nem mesmo nos grandes dias antigos precisávamos dos altos [ROOT.Char.GetFaith.random_AltPriestTermPlural] e seus rituais intrincados. E agora vivemos em um mundo diferente, com muitos desafios para nossa fé atribulada, e a necessidade de reforma nunca foi tão grande. Daqui para frente, o sacerdócio estará mais próximo do povo. Forjaremos nosso próprio futuro, com a posição de [ROOT.Char.GetFaith.PriestNeuter] aberta a qualquer pessoa que tenha a confiança da comunidade."
 fp3_decision.0008.a:0 "Isso será meu dever e fardo."
 fp3_decision.0008.b:0 "Que a luz sem calor brilhe sobre minha casa!"
 fp3_decision.0008.desc:0 "Os [founder.GetFaith.GetAdherentNamePlural] atribulados há muito tempo lutaram em vão, sem uma liderança devidamente orientada. Agora, sua ignomínia acabou, pois eu reivindiquei o #italic walayah#!, a guarda sobre os fiéis, e a #italic luz sobre luz#! de [ROOT.Char.GetFaith.HighGodNameAlternate]. Eu os liderarei com toda a habilidade e previsão que [ROOT.Char.GetFaith.HighGodNameAlternate] em sua sabedoria achar conveniente me conceder, e meus descendentes farão o mesmo depois de mim. Que isso anuncie um novo começo para os [founder.GetFaith.GetAdherentNamePluralNoTooltip]!"
 fp3_decision.0008.t:0 "Reivindicando a Luz"
 fp3_decision.0009.a.tt:0 "Você aceita de todo o coração este [founder.GetFaith.ReligiousHeadName]."
 fp3_decision.0009.a:0 "[founder.GetTitledFirstNameNoTooltip] certamente se mostrará digno."
 fp3_decision.0009.b.tt:0 "Você silenciosamente se alinha... por enquanto."
 fp3_decision.0009.b:0 "Isso é um ultraje."
 fp3_decision.0009.c:0 "Os [founder.GetFaith.GetAdherentNamePluralNoTooltip] merecem um verdadeiro líder..."
 fp3_decision.0009.desc:0 "[founder.GetFirstName] assumiu a responsabilidade de reivindicar o manto de [founder.GetFaith.ReligiousHeadName] para os [founder.GetFaith.GetAdherentNamePlural], e parece que muitos de seus seguidores estão apoiando esse movimento audacioso. Dizem que [founder.GetSheHe] possui a #italic walayah#!, a orientação mística de [ROOT.Char.GetFaith.HighGodNameAlternate] que permite [founder.GetSheHe] liderar os fiéis. Embora eu talvez não esteja atualmente em posição de desafiar essa afirmação diretamente, como uma das principais figuras do [founder.GetFaith.GetNameNoTooltip], minha opinião importará. Devo aceitar [founder.GetFirstNameNoTooltip] como o novo líder dos fiéis ou discretamente me opor a [founder.GetSheHe]?"
 fp3_decision.0009.t:0 "Um Novo [founder.GetFaith.ReligiousHeadName]"
 fp3_decision.0010.a:0 "Preciso pensar sobre isso..."
 fp3_decision.0010.b:0 "Devo estar vigilante..."
 fp3_decision.0010.desc:0 "[founder.GetFirstName] reuniu apoio suficiente e piedade percebida para se autointitular [founder.GetFaith.ReligiousHeadName] dos [founder.GetFaith.GetAdherentNamePlural]. Enquanto alguns xiitas comemoram isso como uma pequena vitória para sua crença em #italic ismah#!, a incorruptibilidade do [founder.GetFaith.ReligiousHeadTitleName], adeptos mais comunitários lamentam o surgimento de mais uma fratura na Ummah. Os [founder.GetFaith.GetAdherentNamePluralNoTooltip], por sua vez, parecem mais radicais do que nunca."
 fp3_decision.0010.t:0 "Um Novo [founder.GetFaith.ReligiousHeadName]"
 fp3_decision.0011.a:0 "Lā ḥukma illā lillāh!"
 fp3_decision.0011.t:0 "Vingando Nossos Mártires"
 fp3_decision.0011_fanatic_murderer.desc:0 "Logo, todo [ROOT.Char.GetFaith.GetReligion.GetName] renunciará às suas falsas convicções e se unirá à nossa causa justa — ou morrerá!"
 fp3_decision.0011_opening.desc:0 "Há muito tempo, a oposição firme da Muhakkima ao outrora grande [ali.GetFirstNamePossessive] compromisso covarde com o usurpador [muawiya.GetFirstName] nos tornou anátema tanto para os sunitas quanto para os xiitas. Desde então, nossos #italic fedayeen#! deram suas vidas para matar os traidores e apóstatas, e trazer a Muhakkima de volta à proeminência.\n\nAgora, esse dia chegou — os califados traidores caíram, e comigo à frente, os [ROOT.Char.GetFaith.GetAdherentNamePlural] reconquistaram a Mesopotâmia e nossos antigos locais sagrados."
 fp3_decision.0011_unfanatic_unmurderer.desc:0 "Em breve, nossos grandes oradores e poetas serão ouvidos por toda a Ummah, convertendo um número incontável para nossa causa justa."
 fp3_decision.0012.a:0 "Este é um grande dia para o Islã!"
 fp3_decision.0012.b:0 "Isso é horrível..."
 fp3_decision.0012.desc:0 "[avenger.GetName] reuniu apoio e piedade suficientes para iniciar uma onda de apoio [avenger.GetFaith.GetAdherentName] sobre grandes áreas do mundo muçulmano. Rumores dizem que muitos governantes e cidades se converteram à fé [avenger.GetHerHim], de bom grado ou não, e somente [ROOT.Char.GetFaith.HighGodName] sabe o que [avenger.GetSheHe] planeja a seguir."
 fp3_decision.0012.t:0 "Ascensão do [avenger.GetFaith.GetNameNoTooltip]"
 fp3_decision.0013.a:0 "Ai, meu caminho está traçado."
 fp3_decision.0013.b:0 "Muito bem, vou reverter a política."
 fp3_decision.0013.desc:0 "O enviado do [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetNamePossessive], [hof_emissary.GetName], parece bastante chateado, o que pode indicar algo sobre os próprios sentimentos de [righteous_caliph.GetTitledFirstNamePossessive] nesse assunto.\n\n\"O [ROOT.Char.GetFaith.ReligiousText] foi revelado ao mundo em árabe, e em nenhuma outra língua será lido\", declara [hof_emissary.GetFirstNameNoTooltip], \"nem haverá outros livros, pergaminhos ou tabuletas de cera sobre assuntos de fé, enquanto meu mestre, o grande [righteous_caliph.GetTitleTierName], ainda respirar. [righteous_caliph.GetSheHe|U] exige que você interrompa imediatamente seus esforços de tradução equivocados e rompa os laços que você fez com acadêmicos sacrílegos.\" [hof_emissary.GetSheHe|U] faz uma pausa.\n\n\"Mas não desespere, o [righteous_caliph.GetTitleTierName] em sua generosidade lhe reembolsará a maior parte do ouro que você gastou com essa tragédia.\""
 fp3_decision.0013.t:0 "Objeções do [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetAdjectiveNoTooltip]"
 fp3_decision.0014.a:0 "Isso parece promissor!"
 fp3_decision.0014.b:0 "Você deveria ficar e trabalhar diretamente para mim."
 fp3_decision.0014.t:0 "Orgulho Persa"
 fp3_decision.0014_no_caliph.desc:0 "Eu olho para esse ambicioso [persian_genius_ulama.GetWomanMan]. Talvez eu possa fazer melhor uso [persian_genius_ulama.GetHerHim]?"
 fp3_decision.0014_opening.desc:0 "Embora meu patrocínio mal tenha começado, alguns #italic ulama#! em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] já começaram a produzir obras na língua local, e [persian_genius_ulama.GetName] parecem especialmente entusiasmados.\n\n\"Eu tenho defendido isso há muito tempo\", diz [persian_genius_ulama.GetSheHe]. \"A grandeza de [ROOT.Char.GetFaith.GetReligion.GetName] foi construída no casamento entre a destreza árabe e o refinamento e conhecimento persa, e já passou da hora de a Pérsia recuperar seu papel como farol de iluminação espiritual. Já traduzi e comentei muitos hadiths e até redescobri algumas obras perdidas de Hasan al-Basri, preservadas nas antigas bibliotecas de Gundeshapur...\"\n\n"
 fp3_decision.0014_there_is_caliph.desc:0 "Enquanto isso, [uncaring_caliph.GetTitledFirstName] permanece em silêncio, observando esses desenvolvimentos com apreensão."
 fp3_decision.0015.a.tt:0 "Seu nome é lido no lugar de [ROOT.Char.Custom2('YourCharacterIntroduction', ROOT.Char.GetLiege)]"
 fp3_decision.0015.a:0 "Eu apoio meu [ROOT.Char.GetFaith.GetReligiousHead.GetTitleAsNameNoTooltip], mas não meu [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]."
 fp3_decision.0015.b:0 "[ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstNameNoTooltip] tem a minha lealdade!"
 fp3_decision.0015.c.tt:0 "$fp3_decision.0015.a.tt$"
 fp3_decision.0015.c:0 "Eu sou mais importante do que esses tolos."
 fp3_decision.0015.d:0 "Seu lugar é em [ROOT.Char.GetFaith.GetReligiousHead.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], não em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 fp3_decision.0015.desc.liege.aligning:0 "Felizmente, isso me coloca em perfeita sintonia com meu senhor feudal [ROOT.Char.GetLiege.GetTitledFirstName], que compartilha das minhas novas crenças."
 fp3_decision.0015.desc.liege.contradicting:0 "Ainda assim, é preocupante que meu senhor feudal [ROOT.Char.GetLiege.GetTitledFirstName] não compartilhe da minha posição e provavelmente pensará mal da minha nova postura."
 fp3_decision.0015.desc.liege.fallback:0 "Embora de grande importância para mim e [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstNameNoTooltip], duvido que meu senhor feudal [ROOT.Char.GetLiege.GetTitledFirstName] se importe muito com tais questões políticas internas sunitas."
 fp3_decision.0015.desc.liege.presently_neutral:0 "Sem dúvida, meu [ROOT.Char.GetLiege.GetTitledFirstName] espera que eu pretenda seguir os passos [ROOT.Char.GetLiege.GetHerHim] sobre essa questão."
 fp3_decision.0015.desc.switch.detractor_becoming_supporter:0 "Declaro que, daqui para frente, em minhas terras, o nome do [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstNamePossessive] será lido em primeiro lugar durante a Oração de Sexta-feira.\n\nComo este é o momento em que [ROOT.Char.Custom('LevyMenWomen')] do reino se reúnem em suas [ROOT.Char.GetFaith.HouseOfWorshipPlural] locais para adorar, isso deverá servir como uma marca clara de minha submissão e apoio à unidade do califado.\n\n"
 fp3_decision.0015.desc.switch.presently_neutral:0 "Governantes ao meu redor estão tomando partido, apoiando a unidade do [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetName] ou afirmando sua independência.\n\nEmbora eu ainda não tenha declarado minha posição, mudar minha postura é simples. Basta anunciar se o nome do [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstNamePossessive] será lido primeiro ou por último durante a Oração de Sexta-feira — na frente dos [ROOT.Char.Custom('LevyMenWomen')] reunidos do reino em suas [ROOT.Char.GetFaith.HouseOfWorshipPlural] locais.\n\n"
 fp3_decision.0015.desc.switch.supporter_becoming_detractor:0 "Declaro que, daqui para frente, em minhas terras, o nome do [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstNamePossessive] será lido por último durante a Oração de Sexta-feira, quando todos os [ROOT.Char.Custom('LevyMenWomen')] do reino se reúnem em suas [ROOT.Char.GetFaith.HouseOfWorshipPlural] locais.\n\nEsse claro sinal de separatismo certamente irritará os lacaios que deixo para trás, mas quem se importa com as opiniões de bajuladores?\n\n"
 fp3_decision.0015.e.tt:0 "$fp3_decision.0015.a.tt$"
 fp3_decision.0015.e:0 "Talvez meu nome devesse substituir o do meu senhor feudal..."
 fp3_decision.0015.f:0 "Fiz algo audacioso aqui."
 fp3_decision.0015.t:0 "Anúncios na Oração de Sexta-feira"
 fp3_decision.0015.vassal_semi_rebel:0 "Vassalo Despreza sua Suserania"
 fp3_decisons_closer_to_love.tt:0 "Você e [chosen_architect.GetFirstNameNoTooltip] estão se aproximando"
 fp3_dynasty_decision.0003.a:0 "Deixe que o povo de [target_county.GetNameNoTierNoTooltip] demonstre sua lealdade!"
 fp3_dynasty_decision.0003.b:0 "Eu financiarei este empreendimento."
 fp3_dynasty_decision.0003.c:0 "Pensando melhor, talvez em outro dia."
 fp3_dynasty_decision.0003.char:0 "Não poderia ter escolhido uma carga melhor para esta empreitada do que [chosen_architect.GetName]. [chosen_architect.GetSheHe|U] tem minha total confiança."
 fp3_dynasty_decision.0003.desc:0 "\n\nPodemos usar o saque recentemente pilhado do [target_county.GetName] para garantir que o edifício se torne suficientemente esplêndido, mas isso certamente irritaria a população.\n\nAlternativamente, eu poderia financiar benevolentemente este empreendimento com meus próprios cofres..."
 fp3_dynasty_decision.0003.intro:0 "Já passou da hora de o povo de [capital_county.GetName] apreciar a visão de um grande e novo projeto de construção."
 fp3_dynasty_decision.0003.t:0 "Um Projeto Persa"
 fp3_dynasty_decision.0004.a:0 "Um mausoléu para a dinastia [ROOT.Char.GetDynastyNameNoTooltip]."
 fp3_dynasty_decision.0004.b:0 "Reformar minha [ROOT.Char.Custom('ResidenceBuilding')]."
 fp3_dynasty_decision.0004.c:0 "Banheiros e fontes ricamente adornados."
 fp3_dynasty_decision.0004.desc:0 "\"Tudo estará em breve no lugar, [ROOT.Char.Custom('FormOfAddressForLiege')]\", declara [chosen_architect.GetSheHe]. \"Mas o que construir?\"\n\n\"Pensei em um grande mausoléu, revestido em lápis-lazúli das minas de Sar-i Sang. Ou talvez uma reforma em sua [ROOT.Char.Custom('ResidenceBuilding')] no estilo tradicional — isso certamente impressionaria seus súditos em [capital_province.GetNameNoTooltip]. Também poderíamos expandir nossos #italic qanats#!, fontes e banhos, e decorá-los ricamente.\" \n\n\"O que você preferiria, [ROOT.Char.GetTitleTierName]?\""
 fp3_dynasty_decision.0004.intro:0 "[chosen_architect.GetFirstName] está trabalhando diligentemente, reunindo uma força de trabalho para o nosso novo projeto."
 fp3_dynasty_decision.0004.plunder.desc:0 "Recursos e trabalhadores estão sendo transportados em massa de [target_county.GetNameNoTier]."
 fp3_dynasty_decision.0004.t:0 "Ambições Arquitetônicas"
 fp3_dynasty_decision.0005.a:0 "O hammam parece encantador."
 fp3_dynasty_decision.0005.b:0 "Eu preferiria ter um [ROOT.Char.GetFaith.HouseOfWorship]."
 fp3_dynasty_decision.0005.c:0 "Uma [ROOT.Char.GetWomanMan] pode ter palácios demais?"
 fp3_dynasty_decision.0005.desc:0 "Círculos escuros pesam sobre o normalmente rosto brilhante de [chosen_architect.GetName]. [chosen_architect.GetSheHe|U] trabalhou a noite toda, elaborando um plano para o futuro adorno de [capital_province.GetName].\n\n\"Eu imagino, [ROOT.Char.Custom('FormOfAddressForLiege')], um belo banho hammam, revestido em azulejos cerâmicos multicoloridos. Dentro, pisos de mosaico, banhos de vapor, piscinas frias e árvores exuberantes plantadas em potes de porcelana chinesa...\"\n\n\"... mas se você preferir ter um [ROOT.Char.GetFaith.HouseOfWorship] ou um pequeno palácio, eu certamente elaborarei novos planos.\""
 fp3_dynasty_decision.0005.t:0 "Uma Visão de Esplendor"
 fp3_dynasty_decision.0007.a:0 "Eu quero um [ROOT.Char.GetFaith.HouseOfWorship], se puder torná-lo verdadeiramente grandioso."
 fp3_dynasty_decision.0007.b:0 "Construa a dakhma para que possamos honrar os mortos com segurança."
 fp3_dynasty_decision.0007.c:0 "Uma nova madrasa certamente melhoraria o reino."
 fp3_dynasty_decision.0007.d:0 "Eu adoraria ver esse afresco..."
 fp3_dynasty_decision.0007.t:0 "Construção Clerical"
 fp3_dynasty_decision.0007_dakhma:0 "\"Ou uma dakhma, uma Torre do Silêncio, onde os mortos podem descansar em silêncio até que o [ROOT.Char.Custom('GetRegionalEagleType')] desça para se alimentar. Mas faríamos isso tão grandioso e tão bonito em seu esplendor solene que até mesmo os pássaros carniceiros teriam que parar para apreciá-lo.\"\n\n"
 fp3_dynasty_decision.0007_desc_beginning:0 "[chosen_architect.GetTitledFirstName] não perde tempo e começa a elaborar os planos para uma nova adição em [capital_province.GetName].\n\n\"Poderíamos construir um novo [ROOT.Char.GetFaith.HouseOfWorship]\", sugere [chosen_architect.GetSheHe], \"com um arco esplêndido e fachada de mármore no último estilo persa.\"\n\n"
 fp3_dynasty_decision.0007_madrasa:0 "\"Ou uma grande madrasa, com salas tranquilas para estudo e contemplação, um ponto de encontro para [ROOT.Char.Custom('LevyMenWomen')] aprendidos de todos os povos da terra.\"\n\n"
 fp3_dynasty_decision.0007_outro:0 "\"Alternativamente, um grande afresco narrativo ao longo da parede leste, entrelaçando temas piedosos com a história da casa [ROOT.Char.GetDynastyNameNoTooltip], seria notável!\""
 fp3_dynasty_decision.0008.a:0 "Embelezar e expandir o bazar."
 fp3_dynasty_decision.0008.b:0 "Construir uma praça grande e poço."
 fp3_dynasty_decision.0008.c:0 "Construir um grande mausoléu, para quando chegar a minha hora."
 fp3_dynasty_decision.0008.d:0 "Projetar uma luxuosa casa de banhos."
 fp3_dynasty_decision.0008.desc:0 "Passei longas horas em solidão, elaborando designs para melhorias em [capital_province.GetName].\n\nCertamente este projeto será melhor agora que é produto apenas da minha mente, em vez de intermediários intrometidos e cortesãos bajuladores. Mas o que ele se tornará?\n\nOlho para as minhas anotações, vendo três designs promissores. Eu poderia..."
 fp3_dynasty_decision.0008.e:0 "Erguer uma alta e brilhante torre de vigia."
 fp3_dynasty_decision.0008.f:0 "Construir um palácio de verão tranquilo."
 fp3_dynasty_decision.0008.g:0 "Inaugurar uma maravilhosa [ROOT.Char.GetFaith.HouseOfWorship]."
 fp3_dynasty_decision.0008.t:0 "Um Monumento a Mim Mesmo"
 fp3_misc_decisions.0010.a:0 "Esplêndido."
 fp3_misc_decisions.0010.desc_intro:0 "Seria uma honra reconhecer seu reinado abençoado e virtuoso sobre este mundo."
 fp3_misc_decisions.0010.desc_struggle:0 "Que [recipient.GetFaith.HighGodName] abençoe seus esforços contra aqueles rebeldes malvados que ameaçam seu domínio."
 fp3_misc_decisions.0010.opening:0 "Ao Comandante dos Fiéis,"
 fp3_misc_decisions.0011.a:0 "Descrente perverso!"
 fp3_misc_decisions.0011.desc:0 "Embora eu o reconheça como meu [recipient.GetFaith.ReligiousHeadName] legítimo, não posso concordar com suas exigências."
 fp3_misc_decisions.0015.a:0 "Praticarei [zoroastrian_faith_1.GetName]."
 fp3_misc_decisions.0015.b:0 "[zoroastrian_faith_2.GetName|U] é a escolha óbvia."
 fp3_misc_decisions.0015.c:0 "Meu coração está com [zoroastrian_faith_3.GetName]."
 fp3_misc_decisions.0015.desc:0 "Independentemente do que aconteça, seguirei os ensinamentos de $zoroastrianism_good_god_zoroaster$ e defenderei contra a destruição de $zoroastrianism_devil_name$. Mas, em minha hora de necessidade, qual fé chamarei de minha?"
 fp3_misc_decisions.0015.t:0 "Abraçar o Zoroastrismo"
 fp3_misc_decisions.0020.desc.a.lethal:0 "[recipient.GetFirstName], essa mancha no nome de nossa família, está morto, e minha reivindicação à liderança da casa é incontestável.\n\nA força por si só não me tornou digno; no final, foi minha determinação de conduzir a Casa [ROOT.Char.GetHouse.GetBaseName] à grandeza — como meu(a) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] fraco nunca poderia — que venceu o dia."
 fp3_misc_decisions.0020.desc.a:0 "Espancado e machucado, [recipient.GetFirstName] chegou a entender que [recipient.GetSheHe] deve ceder a alguém que possa manter um domínio mais forte sobre nossa casa.\n\nA força por si só não me tornou digno; no final, foi minha determinação de conduzir a Casa [ROOT.Char.GetHouse.GetBaseName] à grandeza — como meu(a) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] fraco nunca poderia — que venceu o dia."
 fp3_misc_decisions.0020.desc.b:0 "Exausto, eu encaro [recipient.GetFirstNamePossessive]. O olhar duro do(a) meu(a) [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('recipient'))] confirma o que eu já sei: falhei...\n\n\"É preciso coragem para liderar uma casa\", [recipient.GetSheHe] suspira. \"Sou eu quem deve suportar os fardos da Casa [ROOT.Char.GetHouse.GetBaseName].\"\n\nNão há dúvida, [recipient.GetFirstNameNoTooltip] provou minha fraqueza perante a corte..."
 fp3_misc_decisions.0020.lose.a:0 "Eu não fui forte o suficiente."
 fp3_misc_decisions.0020.lose.b:0 "A Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip] é #bold #EMP MINHA!#!#!"
 fp3_misc_decisions.0020.t:0 "Desafio Aceito: Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 fp3_misc_decisions.0020.win.a:0 "A Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip] se curva a mim!"
 fp3_misc_decisions.0020.win.b:0 "Você lutou valentemente, líder de nossa casa!"
 fp3_misc_decisions.0022.a.tt:0 "O [single_combat_duel|E] começa!"
 fp3_misc_decisions.0022.a:0 "Que o melhor [actor.GetWomanMan] vença."
 fp3_misc_decisions.0022.desc.body:0 "\n\n\"Venha então\", diz [recipient.GetSheHe] bruscamente, \"Vamos decidir o destino da Casa [ROOT.Char.GetHouse.GetBaseName]."
 fp3_misc_decisions.0022.desc.intro:0 "Quando chego em [duel_location.GetBaseNameNoTierNoTooltip], meu(a) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))], [recipient.GetTitledFirstName], está pronto e esperando. [recipient.GetSheHe|U] me cumprimenta como um parente, me avaliando enquanto a corte se reúne para testemunhar meu desafio."
 fp3_misc_decisions.0022.t:0 "Desafio Proposto: Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 fp3_misc_decisions.0022.trigger_failure.actor:0 "Meu [trial_by_combat_trial|E] contra [recipient.GetFirstNameNoTooltip] foi invalidado"
 fp3_misc_decisions.0022.trigger_failure.recipient:0 "Meu [trial_by_combat_trial|E] contra [actor.GetFirstNameNoTooltip] foi invalidado"
 fp3_misc_decisions.0023.desc.a.lethal:0 "Finalmente, [actor.GetFirstName] jaz morto, junto com todas as suas ambições destrutivas e malignas.\n\nMeu desafiante fraco, [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('actor'))] só provou minha própria dignidade como líder para ambos a Casa [ROOT.Char.GetHouse.GetBaseName] e meus súditos."
 fp3_misc_decisions.0023.desc.a:0 "Espancado e machucado, [actor.GetFirstName] chegou a entender que [actor.GetSheHe] foi tolo ao desafiar-me como líder de nossa casa.\n\nMeu desafiante fraco [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('actor'))] só provou minha própria dignidade como líder para ambos a Casa [ROOT.Char.GetHouse.GetBaseName] e meus súditos."
 fp3_misc_decisions.0023.desc.b:0 "Exausto, eu olho para o rosto de [actor.GetFirstNamePossessive]. O olhar triunfante do(a) meu(a) [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('recipient'))] confirma o que eu já sei: falhei...\n\n\"Finalmente, nossa casa terá um líder forte\", [actor.GetSheHe] suspira. \"Sou eu quem deve suportar os fardos da Casa [ROOT.Char.GetHouse.GetBaseName].\"\n\nNão há dúvida, [actor.GetFirstNameNoTooltip] provou minha fraqueza perante a corte..."
 fp3_misc_decisions.0023.lose.a:0 "Eu não fui forte o suficiente."
 fp3_misc_decisions.0023.win.a:0 "Um líder deve manter seu rebanho sob controle."
 fp3_misc_decisions.0025.a:0 "Eventualmente, você será forçado a me reconhecer!"
 fp3_misc_decisions.0025.b:0 "Seu tolo desprezo não será esquecido."
 fp3_misc_decisions.0025.desc:0 "Você está claramente despreparado para assumir os fardos de liderar a Casa [ROOT.Char.GetHouse.GetBaseName].\n\nDevo recusar seu desafio equivocado, pelo bem da família."
 fp3_misc_decisions.0025.t:0 "Meu(a) [SCOPE.sC('recipient').Custom2('RelationToMeShort', SCOPE.sC('actor'))] [ROOT.Char.GetFirstNameNoTooltip],"
 fp3_misc_decisions.0026.a.tt:0 "As conversas começam!"
 fp3_misc_decisions.0026.a:0 "Por onde começar..."
 fp3_misc_decisions.0026.desc.no_court:0 "Quando chego em [duel_location.GetBaseNameNoTierNoTooltip], m[Select_CString( recipient.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))], [recipient.GetTitledFirstName], está me aguardando calmamente. Nós nos abraçamos, cumprindo todas as formalidades de nossa casa.\n\n[recipient.GetSheHe|U] sorri de forma contida: \"Venha, [recipient.Custom2('RelationToMeShort', SCOPE.sC('actor'))], vamos ouvir o que você tem a dizer.\"\n\n[recipient.GetFirstNameNoTooltip] pede refrescos enquanto nos sentamos, antes de se virar para mim, esperando minha fala."
 fp3_misc_decisions.0026.desc:0 "Quando chego em [duel_location.GetBaseNameNoTierNoTooltip], m[Select_CString( recipient.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))], [recipient.GetTitledFirstName], está me aguardando calmamente. [recipient.GetSheHe|U] me abraça diante da corte, cumprindo todas as formalidades de nossa casa.\n\n[recipient.GetSheHe|U] sorri de forma contida: \"Venha, [recipient.Custom2('RelationToMeShort', SCOPE.sC('actor'))], vamos ouvir o que você tem a dizer.\"\n\n[recipient.GetFirstNameNoTooltip] pede refrescos enquanto nos sentamos, antes de se virar para mim, esperando minha fala."
 fp3_misc_decisions.0027.a.old.tt:0 "Esta opção está disponível porque [recipient.GetSheHe] é consideravelmente mais velho que você"
 fp3_misc_decisions.0027.a.old:0 "Agora é a hora da próxima geração conduzir nossa família."
 fp3_misc_decisions.0027.a.sick.tt:0 "Esta opção está disponível porque [recipient.GetSheHe] está com a saúde debilitada"
 fp3_misc_decisions.0027.a.sick:0 "Olhe para a sua saúde, posso assumir o seu fardo."
 fp3_misc_decisions.0027.a.trigger:0 "[recipient.GetSheHe|U] deve estar com a saúde debilitada, ou um pouco mais velho, ou mais jovem que você"
 fp3_misc_decisions.0027.a.young.tt:0 "Esta opção está disponível porque [recipient.GetSheHe] é mais jovem que você"
 fp3_misc_decisions.0027.a.young:0 "Você ainda é jovem e inexperiente, com muito a aprender."
 fp3_misc_decisions.0027.accept:0 "[recipient.GetFirstNameNoTooltip] aceita o seu argumento"
 fp3_misc_decisions.0027.b.dread.tt:0 "Esta opção está disponível porque [recipient.GetSheHe] está intimidado por você"
 fp3_misc_decisions.0027.b.dread:0 "Você realmente quer ficar do meu lado ruim?"
 fp3_misc_decisions.0027.b.military.tt:0 "Esta opção está disponível porque o exército [recipient.GetHerHim] é consideravelmente menor"
 fp3_misc_decisions.0027.b.military:0 "Somente eu tenho a força para defender nossa casa."
 fp3_misc_decisions.0027.b.tier.tt:0 "Esta opção está disponível porque sua [rank|E] é mais baixa"
 fp3_misc_decisions.0027.b.tier:0 "Como [recipient.GetTitleAsNameNoTooltip], ouça minhas palavras como [actor.GetTitleAsNameNoTooltip]."
 fp3_misc_decisions.0027.b.trigger:0 "Você deve ser o [liege|E] [recipient.GetHerHim], ter uma [rank|E] mais alta, ter um exército consideravelmente maior, ou ser [dreadful|E]"
 fp3_misc_decisions.0027.b.vassal.tt:0 "Esta opção está disponível porque [recipient.GetSheHe] é seu [vassal|E] ou inferior"
 fp3_misc_decisions.0027.b.vassal:0 "Como súdito de [actor.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], ouça-me."
 fp3_misc_decisions.0027.bargain.tt:0 "[recipient.GetFirstName] fará uma exigência"
 fp3_misc_decisions.0027.bargain:0 "[recipient.GetFirstNameNoTooltip] quer algo em troca"
 fp3_misc_decisions.0027.c.trigger:0 "A sua [skill|E] combinada deve ser maior que a [recipient.GetHerHim]"
 fp3_misc_decisions.0027.c.tt:0 "Esta opção está disponível porque a sua [skill|E] combinada é maior que [recipient.GetFirstNamePossessiveNoTooltip]"
 fp3_misc_decisions.0027.c:0 "Perdoe-me, mas você #EMP sabe#! que eu sou mais capaz."
 fp3_misc_decisions.0027.d:0 "Venha, [recipient.GetFirstNameNoTooltip], afaste-se."
 fp3_misc_decisions.0027.desc.founder:0 "Começo com a história da Casa [actor.GetHouse.GetBaseName] e os feitos de nossos ancestrais, lentamente avançando até os dias atuais.\n\n[recipient.GetFirstName] ouve pacientemente, ocasionalmente acenando com a cabeça enquanto resumo as ameaças que nossa família enfrenta e como combatê-las.\n\nQuando termino, m[Select_CString( recipient.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] diz calmamente: \"Sim, sim, muito bom. Mas por que #EMP você#! deveria liderar nossa família em vez de mim?\""
 fp3_misc_decisions.0027.desc:0 "Começo com a história da Casa [actor.GetHouse.GetBaseName] e as façanhas de [actor.GetHouse.GetFounder.GetTitledFirstName], avançando lentamente até os dias atuais.\n\n[recipient.GetFirstName] ouve pacientemente, acenando ocasionalmente enquanto resumo as ameaças que nossa família enfrenta e como combatê-las.\n\nQuando termino, m[Select_CString( recipient.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] diz calmamente: 'Sim, sim, muito bom. Mas por que #EMP você#! deveria liderar nossa família em vez de mim?'"
 fp3_misc_decisions.0027.reject:0 "[recipient.GetFirstNameNoTooltip] rejeita o seu argumento"
 fp3_misc_decisions.0028.a:0 "Você está certo, #EMP você#! deveria liderar nossa casa."
 fp3_misc_decisions.0028.b:0 "Muito bem, mas eu gostaria de permanecer em uma posição consultiva."
 fp3_misc_decisions.0028.bargain.tt:0 "Se [actor.GetShortUIName] aceitar:"
 fp3_misc_decisions.0028.c:0 "Um líder digno certamente tem a moeda para respaldar a palavra [actor.GetHerHim]."
 fp3_misc_decisions.0028.d:0 "Talvez você possa assumir, mas quero a sua garantia."
 fp3_misc_decisions.0028.desc.founder:0 "[actor.GetFirstName] chegou a [duel_location.GetBaseNameNoTierNoTooltip] para apresentar sua lógica falsa sobre assumir a liderança da Casa [actor.GetHouse.GetBaseName]. Sou educad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] o suficiente para abraçar [actor.GetSheHe] antes das negociações.\n\n[actor.GetSheHe|U] fala sobre a história de nossa casa, desde os tempos de ancestrais distantes até o presente, e eu espero pacientemente pelo cerne de seu argumento.\n\nPor fim, el[Select_CString( recipient.IsFemale, 'a', 'e' )] chega ao ponto: \"[actor.Custom2('RelationToMeShort', SCOPE.sC('recipient'))|U]...\""
 fp3_misc_decisions.0028.desc:0 "[actor.GetFirstName] chegou em [duel_location.GetBaseNameNoTierNoTooltip] para apresentar sua lógica espúria para assumir como líder da Casa [actor.GetHouse.GetBaseName]. Sou educad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] o suficiente, abraçando [actor.GetSheHe] antes das conversas.\n\n[actor.GetSheHe|U] fala sobre a história de nossa casa, desde os dias de [actor.GetHouse.GetFounder.GetTitledFirstName] até o presente, e eu espero pacientemente pelo cerne do argumento [actor.GetHerHim].\n\nFinalmente, chega: \"[actor.Custom2('RelationToMeShort', SCOPE.sC('recipient'))|U]..."
 fp3_misc_decisions.0028.dread:0 "$fp3_misc_decisions.0027.b.dread$\" A audácia! Embora... $fp3_misc_decisions.0028.perhaps$"
 fp3_misc_decisions.0028.e:0 "Não, eu não acho."
 fp3_misc_decisions.0028.fallback:0 "$fp3_misc_decisions.0027.a.sick$\" Será que isso é realmente tudo o que [actor.GetSheHe] tem a dizer?"
 fp3_misc_decisions.0028.military:0 "$fp3_misc_decisions.0027.b.military$\" Não posso negar isso. $fp3_misc_decisions.0028.perhaps$"
 fp3_misc_decisions.0028.old:0 "$fp3_misc_decisions.0027.a.old$\" Então é a minha idade que está em questão... $fp3_misc_decisions.0028.perhaps$"
 fp3_misc_decisions.0028.perhaps:0 "Talvez [actor.GetSheHe] tenha razão."
 fp3_misc_decisions.0028.sick:0 "$fp3_misc_decisions.0027.a.sick$\" Então é a minha saúde que está em questão... $fp3_misc_decisions.0028.perhaps$"
 fp3_misc_decisions.0028.skill:0 "$fp3_misc_decisions.0027.c$\" Eu não sou tão incompetente assim! Será que...?"
 fp3_misc_decisions.0028.tier:0 "$fp3_misc_decisions.0027.b.tier$\" Não posso negar isso. $fp3_misc_decisions.0028.perhaps$"
 fp3_misc_decisions.0028.vassal:0 "$fp3_misc_decisions.0027.b.vassal$\" Não posso negar isso. $fp3_misc_decisions.0028.perhaps$"
 fp3_misc_decisions.0028.young:0 "$fp3_misc_decisions.0027.a.young$\" Então é a minha juventude que está em questão... $fp3_misc_decisions.0028.perhaps$"
 fp3_misc_decisions.0029.a:0 "Farei o meu melhor."
 fp3_misc_decisions.0029.accept:0 "assente.\n\n\"Sim. Você pode estar certo.\" [recipient.GetSheHe|U] diz pensativamente. \"A partir de hoje, você será o líder da Casa [actor.GetHouse.GetBaseName]. Que [recipient.GetFaith.HighGodName] o guie e guie nossa casa.\""
 fp3_misc_decisions.0029.b:0 "Muito bem, será feito."
 fp3_misc_decisions.0029.c:0 "O destino de nossa família não deve ser negociado."
 fp3_misc_decisions.0029.d:0 "O tolo #EMP aprenderá#! o meu valor, de uma forma ou de outra."
 fp3_misc_decisions.0029.desc.no_court:0 "[recipient.GetFirstName] reflete sobre minhas palavras, observando atentamente meu rosto enquanto a sala murmura ao nosso redor. Após o que parece uma eternidade, [recipient.GetSheHe]"
 fp3_misc_decisions.0029.desc:0 "[recipient.GetFirstName] pondera minhas palavras, estudando meu rosto atentamente enquanto a corte murmura ao nosso redor. Após o que parece uma eternidade, [recipient.GetSheHe]"
 fp3_misc_decisions.0029.fail:0 "franziu o cenho.\n\n\"Não. Seus argumentos são fracos,\" [recipient.GetSheHe|U] diz com desdém. \"Como o legítimo chefe da Casa [actor.GetHouse.GetBaseName], ordeno que esqueça essa noção ridícula.\""
 fp3_misc_decisions.0029.gold:0 "ergue uma sobrancelha.\n\n\"Eu poderia estar disposto a me afastar,\" [recipient.GetSheHe|U] diz cuidadosamente. \"Se você primeiro provar que tem a riqueza para cuidar de nossa casa...\""
 fp3_misc_decisions.0029.hook:0 "sorri.\n\n\"Eu poderia estar disposto a me afastar,\" [recipient.GetSheHe|U] diz cuidadosamente. \"Se você puder garantir que será um amigo...\""
 fp3_misc_decisions.0029.regent:0 "senta-se.\n\n\"Eu poderia estar disposto a me afastar,\" [recipient.GetSheHe|U] diz cuidadosamente. \"Se você me der um lugar no governo de [actor.GetPrimaryTitle.GetBaseNameNoTooltip]...\""
 fp3_misc_decisions.0030.a:0 "Muito bem!"
 fp3_misc_decisions.0030.accept:0 "Finalmente [recipient.GetSheHe] suspira, \"Muito bem, [house_challenger.Custom2('RelationToMeShort', SCOPE.sC('house_head'))], você terá o que deseja.\""
 fp3_misc_decisions.0030.b:0 "Então não há mais nada a discutir..."
 fp3_misc_decisions.0030.desc:0 "[recipient.GetFirstName] considera minha proposta pensativamente, me sondando com os olhos [recipient.GetHerHim].\n\n"
 fp3_misc_decisions.0030.reject:0 "Finalmente [recipient.GetSheHe] balança a cabeça e diz, com certo desprezo, \"O destino de nossa família não deve ser negociado!\""
 fp3_misc_decisions.0031.a:0 "[batch_a_char1.GetFirstNameNoTooltip] e seus companheiros serão ótimos cortesãos."
 fp3_misc_decisions.0031.b:0 "Estou mais impressionado com [batch_b_char1.GetFirstNameNoTooltip]..."
 fp3_misc_decisions.0031.c.tt:0 "Os estrangeiros perdem a chance de se destacar"
 fp3_misc_decisions.0031.c:0 "Nenhum de vocês servirá — voltem aos seus postos!"
 fp3_misc_decisions.0031.desc.cultures.fallback:0 "O grupo de [batch_a_char1.GetFirstNamePossessiveNoTooltip] vem dos [batch_a_county.GetProvince.GetCounty.GetCulture.GetCollectiveNoun] de [batch_a_county.GetBaseNameNoTier], são capazes, embora um pouco menos educados, enquanto [batch_b_char1.GetFirstNameNoTooltip] e o comparsa [batch_b_char1.GetHerHim] são [batch_b_county.GetProvince.GetCounty.GetCulture.GetCollectiveNoun] de [batch_b_county.GetBaseNameNoTier] e apenas um #EMP pouquinho#! mais refinados."
 fp3_misc_decisions.0031.desc.cultures.single:0 "Todos eles vêm da população [batch_a_county.GetProvince.GetCounty.GetCulture.GetName] de [batch_a_county.GetBaseNameNoTier], sendo que o grupo de [batch_a_char1.GetFirstNamePossessiveNoTooltip] é capaz, mas talvez um pouco carente de uma educação refinada, enquanto [batch_b_char1.GetFirstNameNoTooltip] e o comparsa [batch_b_char1.GetHerHim] são um pouco mais refinados, mas são apenas os dois."
 fp3_misc_decisions.0031.desc.intro:0 "Assim como eu pensava, não importa o escândalo que alguns dos nobres do reino possam ter com o conceito, há talento nos cargos subalternos e ministérios menores de [ROOT.Char.GetPrimaryTitle.GetDefinitiveName].\n\nOs candidatos para promoção podem ser reduzidos a apenas dois grupos facilmente: de um lado, [batch_a_char1.GetFirstName], [batch_a_char2.GetFirstName] e [batch_a_char3.GetFirstName], e do outro, [batch_b_char1.GetFirstName] e [batch_b_char2.GetFirstName].\n\n"
 fp3_misc_decisions.0031.tt.all_outsiders.you_gain_hook:0 "Você ganha um [strong_hook|E] #WEAK ($loyalty_hook$)#! sobre eles"
 fp3_misc_decisions.0031.tt.all_outsiders:0 "Todos os estrangeiros que se juntarem à sua corte"
 fp3_misc_decisions.0041.a:0 "É preciso astúcia para liderar uma casa, [house_challenger.Custom2('RelationToMeShort', SCOPE.sC('house_head'))]!"
 fp3_misc_decisions.0041.b:0 "Você pagará por isso!"
 fp3_misc_decisions.0041.desc.failure:0 "O astuto se esquiva a tempo de evitar minha adaga errante, gritando por seus guardas! Eu não consigo encurralar [house_head.GetHerHim] antes que eles estejam sobre mim, me prendendo fortemente ao chão.\n\nMeu(a) [house_challenger.Custom2('RelationToMeShort', SCOPE.sC('house_head'))] fica sobre mim e rosna, \"Joguem esta serpente nas masmorras!\""
 fp3_misc_decisions.0041.desc.success:0 "O tolo mal percebe minha abordagem rápida, reagindo pouco enquanto enfio minha adaga no peito [house_head.GetHerHim].\n\nEnquanto [house_head.GetSheHe] olha para baixo, sem compreender, eu me aproximo e sussurro: \"Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip], é #bold #EMP MINHA!#!#!\", antes de arrancar a lâmina de sua barriga."
 fp3_misc_decisions.0041.intro:0 "Quando [house_head.GetFirstName] se vira para sair, seu rosto contorcido de desprezo, eu aproveito minha chance.\n\n"
 fp3_misc_decisions.0042.a:0 "Jogue esta serpente nas masmorras!"
 fp3_misc_decisions.0042.desc:0 "$fp3_misc_decisions.0042.intro$\n\nEu me esquivo a tempo para evitar a adaga errante [house_challenger.GetHerHim], gritando pelos meus guardas.\n\n[house_challenger.GetSheHe|U] logo é preso ao chão, contorcendo-se e gritando: \"Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip] é #bold #EMP MINHA!#!#!\""
 fp3_misc_decisions.0042.intro:0 "Ao me virar para deixar o [house_challenger.GetFirstName] desgraçado aos seus pensamentos malignos, um brilho chama minha atenção."
 fp3_misc_decisions.0043.a:0 "#DIE1 [house_head.Custom2('RelationToMeShort', SCOPE.sC('house_challenger'))]....#!"
 fp3_misc_decisions.0043.desc:0 "$fp3_misc_decisions.0042.intro$\n\nO vilão fica diante de mim, um brilho maligno nos olhos [house_challenger.GetHerHim], seu braço estendido, seu punho envolto em um cabo...\n\n[house_challenger.GetSheHe|U] se aproxima e sussurra: \"Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip] é #bold #EMP MINHA!#!#!\", antes de arrancar a lâmina de minha barriga."
 fp3_misc_decisions.0051.a:0 "A família vem primeiro!"
 fp3_misc_decisions.0051.desc:0 "Vejo agora que os laços familiares são a chave mais importante para um governo justo e estável.\n\nSeguindo o exemplo de [ROOT.Char.GetHouse.GetHeadOfHouse.GetTitledFirstName], ordenei que o governo de [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] seja reorganizado ao longo das linhas da [ROOT.Char.GetHouse.GetBaseName]."
 fp3_misc_decisions.0051.t:0 "Costumes da Casa"
 fp3_struggle.0051.a:0 "Que [ROOT.Char.GetFaith.HighGodName] esteja comigo!"
 fp3_struggle.0051.b:0 "Essas ambições tolas devem ser postas de lado!"
 fp3_struggle.0051.desc.caliph:0 "Atrás de mim está uma fila pálida de fantasmas; os [Mostaza.GetTitleTierName]s [Mutawakkil.GetFirstName], [Muntasir.GetFirstName] e [Mustain.GetFirstName] — todas vítimas deste [struggle|E]. Os persas rebeldes e os turcos traiçoeiros estão ansiosos para me ver juntar ao espectro de meus antecessores, mas ainda posso virar o jogo!"
 fp3_struggle.0051.desc.detractor:0 "Com os Mestres do Islã trancados em uma crise perpétua, esta é uma oportunidade como nenhuma outra para a casa [ROOT.Char.GetHouse.GetNameNoTooltip] se tornar mestra do próprio destino e esculpir nosso nome nos anais da história."
 fp3_struggle.0051.desc.interloper:0 "Com os últimos três [Mostaza.GetTitleAsNameNoTooltip]s levados a um fim rápido e prematuro, todos esperam que [Mostaza.GetFirstName] siga. Nessa turbulência e incerteza, oportunidades surgem para a casa[ROOT.Char.GetHouse.GetNameNoTooltip]..."
 fp3_struggle.0051.desc.involved:0 "Este é o momento para a casa [ROOT.Char.GetHouse.GetNameNoTooltip] agir e se elevar à glória — seremos os salvadores do Califado ou despedaçaremos o sonho de uma Ummah unida de uma vez por todas?"
 fp3_struggle.0051.desc.stabilization:0 "Após um período de crise, [Mostaza.GetPrimaryTitle.GetName] está se recuperando, a luta ensanguentada diminuindo lentamente no Irã."
 fp3_struggle.0051.desc.stabilization_actor:0 "A casa [ROOT.Char.GetHouse.GetNameNoTooltip] deve agir com cuidado aqui. Podemos usar a situação para preparar o terreno para um futuro próspero ou semear novo caos e discórdia que podem nos permitir alcançar alturas ainda maiores..."
 fp3_struggle.0051.desc.supporter:0 "Nunca houve tanta necessidade da lealdade e diligência estabilizadora da casa [ROOT.Char.GetHouse.GetNameNoTooltip]. Este é nosso momento de buscar a glória, salvar o Califado e nos tornar verdadeiros campeões da causa [ROOT.Char.GetFaith.GetAdjective]!"
 fp3_struggle.0051.desc.unrest:0 "$fp3_struggle.0051.desc$"
 fp3_struggle.0051.desc:0 "Uma luta civil sangrenta envolve o outrora inatingível [Mostaza.GetPrimaryTitle.GetBaseName]: a família governante se assassina e guerreia entre si, competindo para usurpar o [GetFaithByKey('ashari').ReligiousHeadTitleName|U]. O Iraque cambaleia enquanto, além das montanhas orientais, senhores fronteiriços persas aproveitam a situação para afirmar sua independência, construindo impérios próprios a partir dos destroços de Bagdá.\n\n"
 fp3_struggle.0051.t:0 "O Intermezzo Iraniano"
 fp3_struggle.0071.a:0 "Eu triunfo!"
 fp3_struggle.0071.b:0 "A vitória é doce, mas podemos nos tornar algo mais!"
 fp3_struggle.0071.desc.caliph:0 "A luta acabou! Seja por sucesso na guerra, diplomacia habilidosa ou a supremacia inerente da minha posição, os traidores e rebeldes mudaram de ideia. Agora, estão correndo para prestar novos juramentos diante do meu trono, disputando para se curvar mais profundamente e reafirmar sua fé em seu [ROOT.Char.GetTitleTierName] corretamente guiado e legítimo.\n\nOs senhores persas rebeldes se comprometeram à submissão e se arrependeram de sua loucura, ou foram substituídos por governadores [ROOT.Char.GetCulture.GetName], confiáveis e piedosos. Completei a conquista do Irã que o Califado Rashidun começou há dois séculos, para a glória imortal da [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]."
 fp3_struggle.0071.desc.supporter:0 "Através de promessas e ameaças, astúcia e poder, a autoridade do [struggle_liege.GetTitledFirstName] foi reafirmada. Os antigos rebeldes foram trazidos à razão, e os senhores persas indisciplinados estão correndo para se prostrar diante do trono do [struggle_liege.GetTitleTierName].\n\nMas atrás desse trono, #italic eu#! estou. Nesse tempo de turbulência, eu assumi o desafio, me provei como o maior apoiador do [Mostaza.GetTitleTierName] e trouxe ordem de volta ao mundo. Certamente, todos devem reconhecer em breve minha contribuição, com glória eterna para a casa [ROOT.Char.GetHouse.GetNameNoTooltip]..."
 fp3_struggle.0071.t:0 "[struggle_liege.GetFirstNameNoTooltip|U] Reafirma Dominância"
 fp3_struggle.0072.a:0 "[ROOT.GetCharacter.GetFaith.HighGodNameAlternate] está comigo!"
 fp3_struggle.0072.b:0 "Um novo dia virá!"
 fp3_struggle.0072.desc.caliph:0 "Através de promessas e ameaças, astúcia e poder, minha autoridade sobre o #italic dar-al-Islam#! foi reafirmada. Embora muitos afirmem que isso se deve à graça de [ROOT.GetCharacter.GetFaith.HighGodNameAlternate], apenas com minha habilidade e manobras inteligentes [struggle_liege.GetPrimaryTitle.GetNameNoTooltip] foi salvo de uma guerra civil ainda mais sangrenta.\n\nIsso anunciará um novo e grande dia para a Pérsia e para o mundo! E para #italic mim!#!"
 fp3_struggle.0072.desc.detractor:0 "Através de promessas vazias e ameaças infames, [struggle_liege.GetTitleTierName] reafirmou sua assim chamada autoridade e reconquistou a lealdade dos tolos e bajuladores que costumavam se reunir à corte [struggle_liege.GetHerHim].\n\nApesar de meus melhores esforços, o corrupto Califado [struggle_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] perdura. Este é um dia sombrio para a Pérsia, mas talvez nem tudo esteja perdido. Um novo dia surgirá, trazendo novas oportunidades..."
 fp3_struggle.0072.desc.interloper:0 "A luta pela Pérsia se acalma, agora que [struggle_liege.GetTitledFirstName] não apenas restaurou sua autoridade e império, mas também ganhou mais poder do que nunca.\n\nAo inserir marionetes [struggle_liege.GetCulture.GetName] para governar sobre a Pérsia e subjugar todos os que desafiaram [struggle_liege.GetSheHe], [struggle_liege.GetSheHe] reafirmou a supremacia [struggle_liege.GetFaith.GetAdjective] em [struggle_liege.GetPrimaryTitle.GetBaseNameNoTooltip].\n\nDado que a autoridade [struggle_liege.GetHerHim] será agora assustadora de desafiar, talvez eu também deva me aproximar [struggle_liege.GetHerHim], para ganhar um controle mais firme sobre as terras persas..."
 fp3_struggle.0072.desc.involved:0 "A agitação que envolve a Pérsia diminui, agora que [struggle_liege.GetTitledFirstName] não apenas restaurou sua autoridade e império, mas também reivindicou maior prestígio e poder do que [struggle_liege.GetSheHe] jamais teve.\n\nAo inserir marionetes [struggle_liege.GetCulture.GetName] para governar sobre a Pérsia e subjugar todos os que desafiaram [struggle_liege.GetSheHe], [struggle_liege.GetSheHe] reafirmou a supremacia [struggle_liege.GetFaith.GetAdjective] em [struggle_liege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip].\n\nAs pessoas agora afirmam que a autoridade [struggle_liege.GetHerHim] será impossível de desafiar, mas talvez eu deva colocar isso à prova..."
 fp3_struggle.0072.desc.supporter:0 "Através de promessas e ameaças, astúcia e poder, a autoridade do [struggle_liege.GetTitledFirstName] foi reafirmada. Embora muitos agora afirmem que isso se deve à graça de [ROOT.GetCharacter.GetFaith.HighGodNameAlternate], apenas com o apoio de aliados como eu [struggle_liege.GetPrimaryTitle.GetNameNoTooltip] foi salvo de uma guerra civil ainda mais sangrenta.\n\nNão duvido que serei recompensado por meus esforços e minha lealdade, embora eu não possa deixar de pensar se poderia ter mais a ganhar escolhendo o outro lado..."
 fp3_struggle.0072.desc.uninvolved:0 "A luta pela Pérsia se acalma, agora que [struggle_liege.GetTitledFirstName] não apenas restaurou sua autoridade e império, mas também ganhou mais poder do que nunca.\n\nAo inserir marionetes [struggle_liege.GetCulture.GetName] para governar sobre a Pérsia e subjugar todos os que desafiaram [struggle_liege.GetSheHe], [struggle_liege.GetSheHe] reafirmou a supremacia [struggle_liege.GetFaith.GetAdjective] em [struggle_liege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip].\n\nÉ difícil ver como alguém poderia desafiar [struggle_liege.GetSheHe] agora, mas talvez nem tudo esteja perdido..."
 fp3_struggle.0072.t:0 "$fp3_struggle.0071.t$"
 fp3_struggle.0082.a:0 "Eles lamentarão o dia em que nos traíram..."
 fp3_struggle.0082.b:0 "A aurora virá novamente!"
 fp3_struggle.0082.c:0 "Pela glória eterna da Pérsia!"
 fp3_struggle.0082.desc.detractor:0 "Depois de anos de lutas infrutíferas e amarguras, [struggle_liege.GetTitledFirstName] finalmente foi forçado a ceder. Qualquer autoridade que os [struggle_liege.GetHouse.GetNameNoTooltip]s já tiveram sobre a Pérsia se foi, incentivando todos os rebeldes e rivais.\n\nA casa [ROOT.Char.GetHouse.GetNameNoTooltip] pode surgir deste caos, mais forte do que nunca, orgulhosa e #italic livre#!."
 fp3_struggle.0082.desc.interloper:0 "Tendo sido um intruso no palco persa, talvez esta seja minha oportunidade de reivindicar um grande papel e preencher o vazio deixado pelos [struggle_liege.GetHouse.GetNameNoTooltip]. Ou eu poderia deixar essa bagunça de lado e procurar em outro lugar o futuro lar da casa [ROOT.Char.GetHouse.GetNameNoTooltip]..."
 fp3_struggle.0082.desc.intro:0 "Depois de anos de luta em vão contra chances desesperadoras, [struggle_liege.GetTitledFirstName] concedeu e abandonou qualquer esperança de reunificar a região. A fronteira oriental agora pertence a novos governantes, que continuarão a lutar contra os nômades das estepes e entre si, assim como sempre foi.\n\n"
 fp3_struggle.0082.desc.involved:0 "Independentemente de ter sido o resultado que eu poderia ter desejado, ainda pode ser usado em meu benefício, se meu reino puder se elevar à glória no vazio deixado pelos [struggle_liege.GetHouse.GetNameNoTooltip]."
 fp3_struggle.0082.desc.supporter:0 "Cercado por inimigos por todos os lados, a traição e a desgraça dilaceraram o Califado da [struggle_liege.GetHouse.GetNameNoTooltip]. Se eu pudesse ter mudado o rumo, apenas [ROOT.GetCharacter.GetFaith.HighGodName] sabe, mas fui tratado com uma mão ruim e só posso imaginar o que o futuro reserva. Embora este seja um golpe terrível, #italic não#! é o fim!\n\nDeixem que os tolos que escolheram me desafiar tenham algum respiro, pois quando menos esperarem, meus exércitos marcharão novamente e pisotearão as bandeiras dos traidores na poeira."
 fp3_struggle.0082.desc.uninvolved:0 "Depois de anos de atrito e anarquia, [struggle_liege.GetTitledFirstName] cedeu silenciosamente e abandonou qualquer esperança de reunificar a Arábia e a Pérsia.\n\nO leste agora pertence a novos governantes, que continuarão a lutar contra os nômades das estepes e entre si, enquanto o Califa assiste impotente de longe.\n\nEstá claro que a queda dos [struggle_liege.GetHouse.GetNameNoTooltip] pode proporcionar muitas oportunidades para uma casa corajosa o suficiente para aproveitá-las..."
 fp3_struggle.0082.t:0 "O [GetTitleByKey('d_sunni').GetNameNoTooltip] Concede"
 fp3_struggle.0091.a:0 "Isso deve garantir o legado da casa [ROOT.Char.GetHouse.GetNameNoTooltip]."
 fp3_struggle.0091.desc.detractor:0 "Ao nascer do sol atrás do Monte Damavand, seu brilho suave aquece os campos pálidos. A coroa da [GetTitleByKey('e_persia').GetBaseName|U] não será mais apenas uma linhagem histórica, mas um símbolo de nossa luta heróica contra [struggle_liege.GetTitledFirstName].\n\nNenhum invasor estrangeiro nos restringirá novamente; recuperamos o poder e a glória dos dias antigos, quando o mundo tremia diante do Rei dos Reis.\n\nEm breve, toda a Pérsia hasteará as bandeiras de um novo império. #italic Meu#! império!"
 fp3_struggle.0091.desc.supporter:0 "Embora a causa de [struggle_liege.GetName] fosse justa, ela poderia ter sido condenada. O povo da Pérsia queria um novo líder, uma reacendendo das chamas antigas e da glória perdida da antiguidade. E eu atendi ao chamado deles. A partir da fundação que estabeleci, um novo império pode surgir, o primeiro na Pérsia desde a queda dos [sassanid_dynasty.GetName]. Ou eu poderia ficar satisfeito com o que já conquistei, fortalecendo a terra e acendendo uma chama no coração de todo persa..."
 fp3_struggle.0091.t:0 "[struggle_ender.GetPrimaryTitle.GetNameNoTooltip|U] Fundação: Uma Nova Pérsia"
 fp3_struggle.0092.a:0 "Foi inevitável"
 fp3_struggle.0092.desc.iranian:0 "Meu próprio papel no império de [struggle_ender.GetTitledFirstNamePossessivesNoTooltip] ainda está por ser visto - com minha ajuda, [struggle_ender.GetSheHe] poderia construir um legado duradouro, ou talvez [struggle_ender.GetSheHe] seja apenas outro conquistador para os anais, grande mas efêmero."
 fp3_struggle.0092.desc.non-iranian:0 "O que antes era apenas mais uma fronteira de um califado moribundo agora é o núcleo de um império ascendente. O mundo observa com interesse, perguntando se [struggle_ender.GetTitledFirstNameNoTooltip] pode construir um legado duradouro, ou é apenas outro conquistador para os anais, grande mas efêmero."
 fp3_struggle.0092.intro:0 "Ao nascer do sol atrás do Monte Damavand, seu brilho suave aquece os campos pálidos. [struggle_ender.GetName] cresceu o suficiente em força e legitimidade para proclamar a reformulação de [persia_loc.GetName|U], e um novo grande poder agora governa esta terra, um baluarte contra os senhores vingativos na Arábia e os nômades selvagens das estepes, recuperando a glória dos antigos reis.\n\n"
 fp3_struggle.0092.t:0 "$fp3_struggle.0091.t$"
 fp3_struggle.0095.a:0 "Que [ROOT.Char.GetFaith.HighGodNameAlternate] guie meu governo!"
 fp3_struggle.0095.desc.fallback:0 "O califado deve liderar a ummah na Terra ao longo do caminho sagrado, mas em nossa loucura, permitimos que o califado enfraquecesse e se corrompesse. Isso muda hoje, enquanto inauguro uma nova era para a Pérsia e o Islã sob minha liderança sábia e incorruptível.\n\nEmbora ainda haja muito trabalho a ser feito, é inegável que o que fiz alterará o curso da história persa para sempre. Agora avançamos para o futuro; em direção à fé [ROOT.Char.GetFaith.GetAdjective] e [GetTitleByKey('e_persia').GetName]!"
 fp3_struggle.0095.desc.muhakkima:0 "Os ignorantes sunitas presumiam há muito tempo que seu califado corrupto deveria ser a autoridade mais alta deste mundo, mas em sua loucura, esqueceram que o julgamento pertence apenas a Deus! Eu fiz o que muitos [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] se esforçaram para fazer antes de mim e encerrei o califado sunita. Embora longe de ser uma vingança adequada pela Batalha de Nahrawan e pelos séculos de perseguição, este é apenas o começo. Tornei-me o califa [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] e os liderarei para o grande acerto de contas com os xiitas, que certamente virá em seguida."
 fp3_struggle.0095.desc.shia_and_zandaqa:0 "Os equivocados sunitas assumiram por muito tempo que seu califado moribundo era a autoridade mais alta deste mundo, salvo Deus apenas; como estavam errados.\n\nCom a queda de [struggle_liege.GetTitledFirstName], eu assumi a liderança da #EMP ummah#!, vingando a Batalha de Karbala pelos seguidores de [ali.GetFirstName]. Eu vou inaugurar uma nova era de domínio [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] e reivindicar o maior trono deste mundo.\n\nOs sunitas, antes tão confiantes em sua arrogante superioridade, não terão escolha a não ser se alinhar."
 fp3_struggle.0095.t:0 "Ascensão dos [struggle_ender.GetFaith.GetAdherentNamePluralNoTooltip]"
 fp3_struggle.0096.a:0 "Que [ROOT.Char.GetFaith.HighGodNameAlternate] seja grande e misericordioso!"
 fp3_struggle.0096.b:0 "Este é um dia sombrio..."
 fp3_struggle.0096.desc.detractor:0 "Finalmente, o reino corrupto de [struggle_liege.GetTitledFirstName] caiu. De suas cinzas, [struggle_ender.GetTitledFirstName] surgiu, anunciando um califado [struggle_ender.GetFaith.GetAdherentName] e uma nova era.\n\nMinha longa luta contra [struggle_liege.GetTitledFirstNameNoTooltip] deu frutos, embora talvez não seja o fim que eu teria desejado. No entanto, ainda há esperança para a causa sunita, e eu poderia me tornar seu farol. Ou eu poderia me alinhar completamente com os [struggle_ender.GetFaith.GetAdherentNamePluralNoTooltip]..."
 fp3_struggle.0096.desc.interloper:0 "$fp3_struggle.0096.desc.involved$"
 fp3_struggle.0096.desc.involved:0 "A agitação e anarquia parecem ter chegado ao fim, com [struggle_ender.GetName] superando todos os desafiantes e reivindicando o califado em nome de [struggle_ender.Char.GetFaith]. Com certeza, [struggle_ender.GetSheHe] agora tem tanto apoiadores quanto detratores, com alguns chamando isso de o fim da #italic ummah#! e outros celebrando o triunfo de sua fé, devo pensar cuidadosamente em qual dos dois serei. [struggle_ender.GetTitledFirstNameNoTooltip] está pronto para inaugurar uma nova era para o Islã e trazer paz à Mesopotâmia e à Pérsia - mas pode cair ou se manter com meu apoio..."
 fp3_struggle.0096.desc.supporter:0 "Ai, o reino de [struggle_liege.GetName] caiu, e das suas cinzas, [struggle_ender.GetName] surgiu, reivindicando o califado para os [struggle_ender.GetFaith.GetAdherentNamePlural]. Meu apoio a [struggle_liege.GetTitledFirstNameNoTooltip] foi, portanto, em vão, e todo o ouro e todos os esforços foram em vão. No entanto, talvez não seja tarde demais para salvar a causa sunita - ou mudar de lado e me alinhar completamente com os [struggle_ender.GetFaith.GetAdherentNamePluralNoTooltip]..."
 fp3_struggle.0096.desc.uninvolved:0 "A longa luta na Pérsia terminou, com [struggle_ender.GetName] superando todos os desafiantes e reivindicando o califado em nome de [struggle_ender.Char.GetFaith]. Se [struggle_ender.GetSheHe] fez isso justa ou injustamente, ninguém pode dizer, mas parece claro que [struggle_ender.GetSheHe] está pronto para inaugurar uma nova era para o Islã e trazer paz à Mesopotâmia e à Pérsia. Embora nem todos na #italic ummah#! estejam felizes com esse desenvolvimento e senhores de fronteira possam se revoltar em suas fortalezas distantes, por enquanto eles terão que cerrar os dentes."
 fp3_struggle.0096.t:0 "$fp3_struggle.0095.t$"
 fp3_struggle.0100.a:0 "Um novo dia para o Islã!"
 fp3_struggle.0100.desc.muhakkima:0 "Por muito tempo, os sunitas aceitaram que o Califado era a mais alta autoridade deste mundo, salvo Deus, mas uma vez que o reino tremeu diante do poder dos Muhakkima, eles viram o erro de seus caminhos.\n\nComigo à frente, os [ROOT.Char.GetFaith.GetAdherentNamePlural] tomaram posse do miserável Califado [struggle_liege.GetPrimaryTitle.GetNameNoTierNoTooltip], e toda a #EMP ummah#! em breve terá que abraçar nossas palavras sagradas - o julgamento pertence apenas a Deus!"
 fp3_struggle.0100.desc.shia_and_zandaqa:0 "Por muito tempo, os muçulmanos aceitaram que o Califado era a mais alta autoridade deste mundo, salvo Deus, mas à medida que o reino caía na desesperança e decadência, tornou-se aparente que os seguidores de Ali tinham uma reivindicação melhor sobre os fiéis.\n\nEu assumi a responsabilidade de colocar o Califado [struggle_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] sob minha proteção e vigilância. Vou inaugurar uma nova era de domínio [ROOT.Char.GetFaith.GetAdherentName] na #EMP ummah#!, e nossos detratores fariam bem em se alinhar!"
 fp3_struggle.0100.desc:0 "Por muito tempo, os muçulmanos aceitaram que o Califado era a mais alta autoridade deste mundo, salvo Deus, mas à medida que o reino caía na desesperança e decadência, houve a necessidade de repensar esse estado de coisas.\n\nAgora, um novo [ROOT.GetCharacter.GetPrimaryTitle.GetNameNoTooltip|U] surgiu, comigo à sua frente, para guiar o Califado sob minha proteção e vigilância. [struggle_liege.GetName] pode ser o líder dos fiéis, mas #italic eu#! serei daqui para frente o seu senhor, o novo [Select_CString( ROOT.Char.IsFemale, 'Administrador', 'Administrador' )] do Islã, e [struggle_liege.GetSheHe] faria #EMP muito bem#! em lembrar disso!"
 fp3_struggle.0100.t:0 "Fundação: Um Califado Subjugado"
 fp3_struggle.0101.a:0 "Que isso anuncie um novo dia!"
 fp3_struggle.0101.b:0 "Este é um dia sombrio para o Islã."
 fp3_struggle.0101.desc.detractor:0 "Que o Califado [struggle_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] era um tigre de papel não deveria surpreender ninguém, e de fato, seus exércitos se dispersaram, seus leais quebraram seus votos ou se esconderam em terras de fronteira esquecidas. [struggle_ender.GetName] agora reivindica ser o #italic protetor#! do Calif, mas apenas tolos não o reconhecerão pelo que é - o califado sunita foi subjugado e humilhado, com [struggle_ender.GetSheHe] como seu novo mestre.\n\nComo oponente de longa data de [struggle_liege.GetTitledFirstNameNoTooltip], devo garantir um lugar importante nesta nova ordem para mim e para a casa [ROOT.Char.GetHouse.GetNameNoTooltip]..."
 fp3_struggle.0101.desc.interloper:0 "Os atos decisivos de [struggle_ender.GetName] parecem ter encerrado, embora de maneira frágil, a anarquia e a agitação na Pérsia. Tendo subjugado [struggle_liege.GetTitledFirstName], [struggle_ender.GetTitledFirstNameNoTooltip] agora reivindica a tutela do califado sunita e o reconhecimento como o maior governante da terra.\n\nA pergunta agora é - a casa [ROOT.Char.GetHouse.GetNameNoTooltip] deve aceitar esse estado de coisas ou contestá-lo?"
 fp3_struggle.0101.desc.involved:0 "$fp3_struggle.0101.desc.interloper$"
 fp3_struggle.0101.desc.supporter:0 "Apesar do meu apoio firme, o Califado [struggle_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] mostrou-se muito fraturado, ou seus inimigos muito numerosos e tenazes. [struggle_ender.GetName] agora reivindica ser o #italic protetor#! do Calif, mas o que isso significa na prática, é claro, é que [struggle_ender.GetSheHe] subjugou vergonhosamente o soberano justo do #italic dar-al-Islam#!.\n\nAgora devo pisar com cuidado, para garantir o futuro da casa [ROOT.Char.GetHouse.GetNameNoTooltip]..."
 fp3_struggle.0101.desc.uninvolved:0 "A luta na Pérsia e na Mesopotâmia terminou, com [struggle_ender.GetName] subjugando [struggle_liege.GetName] e assumindo o controle de partes significativas do #italic dar-al-Islam#!. A autoridade e a glória do Califado Sunita foram para sempre diminuídas, enquanto [struggle_ender.GetPrimaryTitle.GetName] se tornou uma luz brilhante em ascensão. Só o tempo dirá se durará ou se é apenas uma estrela cadente..."
 fp3_struggle.0101.t:0 "$fp3_struggle.0100.t$"
 fp3_struggle.0123.d:0 "Que calamidade..."
 fp3_struggle.0191.a:0 "Este é o meu maior momento!"
 fp3_struggle.0191.b:0 "Eu fiz o que precisava ser feito."
 fp3_struggle.0191.desc:0 "Lutando em vão contra generais ambiciosos, vassalos descontentes e seus próprios ex-escravos, o [GetTitleByKey('d_sunni').GetNameNoTooltip] colheu o que havia semeado. A arrogância e a vaidade cresceram demais, os gastos foram desperdiçados e volúveis, a corte traiçoeira como nenhuma outra.\n\nO império caiu, e #italic eu#! fui o arquiteto de sua queda. Aqui estou eu em glória, enquanto o reinado de [struggle_liege.GetFirstNamePossessive], no máximo, se tornará uma história exemplar nos livros de história, um breve interlúdio nos anais da Pérsia."
 fp3_struggle.0191.t:0 "O Fim do [GetTitleByKey('d_sunni').GetName]"
 fp3_struggle.0192.a:0 "Custe o que custar, devo garantir o futuro da dinastia."
 fp3_struggle.0192.b:0 "É apenas um contratempo temporário."
 fp3_struggle.0192.c:0 "Isso anuncia novas oportunidades — para mim."
 fp3_struggle.0192.desc.caliph:0 "Todos me traíram. Meus conselheiros, meus vassalos, meus amigos. Por mais que eu tentasse salvar o reino da [ROOT.Char.GetHouse.GetNameNoTooltip], foi sem esperança final, e embora eu possa agora me perguntar se poderia ter feito algo diferente, apenas [ROOT.GetCharacter.GetFaith.HighGodName] conhece a verdade. O reino está devastado e quebrado, entre torres derrubadas e as ruínas da glória passada. Não tenho escolha senão me esconder em minha [ROOT.Char.Custom('ResidenceBuilding')], enquanto tudo desmorona ao meu redor, e me contentar que pelo menos eu ainda estou vivo."
 fp3_struggle.0192.desc.detractor:0 "Lutando em vão contra generais ambiciosos, vassalos descontentes e seus próprios ex-escravos, [struggle_liege.GetPrimaryTitle.GetNameNoTooltip] colheu o que havia semeado. A arrogância e a vaidade cresceram demais, os gastos foram desperdiçados e volúveis, a corte traiçoeira como nenhuma outra. As casas [struggle_liege.GetHouse.GetNameNoTooltip] caíram, e sua queda é tão grande que ninguém pode prever que se levantarão novamente. Seu nome, no máximo, se tornará uma história exemplar nos livros de história, um breve interlúdio nos anais da Pérsia."
 fp3_struggle.0192.desc.supporter_or_vassal:0 "Trancado em uma luta sem esperança contra generais ambiciosos, vassalos descontentes e seus próprios ex-escravos, [struggle_liege.GetPrimaryTitle.GetNameNoTooltip] não pôde durar. Os gastos de ouro, sangue e trabalho foram enormes, e embora o mundo possa não reconhecer o papel que desempenhei, os sacrifícios que fiz, [ROOT.GetCharacter.GetFaith.HighGodName] reconhecerá. Mas para o bem ou para o mal, agora enfrentamos um reino partido, aberto àqueles que atacariam os reis deste mundo com um ataque fatal. No entanto, o destino das casas [struggle_liege.GetHouse.GetNameNoTooltip] pode não ser o meu, e dessas cinzas, novas flores podem florescer."
 fp3_struggle.0192.t:0 "$fp3_struggle.0191.t$"
 fp3_struggle.8000.a:0 "De fato?"
 fp3_struggle.8000.desc:0 "O fim do seu senhor feudal, [defender.GetTitledFirstNamePossessive], traição contra o Califa legítimo está próximo.\n\nComo um apoiador leal, eu vou garantir que você assuma o trono de [defender.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] em seu lugar."
 fp3_struggle.8000.t:0 "[attacker.Custom2('AppropriateGreeting', ROOT.Char)]"
 fp3_struggle.8001.a:0 "Sobre o meu cadáver!"
 fp3_struggle.8001.desc:0 "O fim de sua traição contra seu Califa legítimo está próximo.\n\nÉ hora de [loyalist_puppet.GetTitledFirstName], um apoiador leal, governar [defender.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] em seu lugar."
 fp3_struggle.8002.a:0 "Viva!"
 fp3_struggle.8002.alliance_tt:0 "[attacker.GetTitledFirstName] agora é seu [ally|E]"
 fp3_struggle.8002.desc:0 "Finalmente, aquele traidor [defender.GetTitledFirstName] foi derrotado, e [defender.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] está mais uma vez nas mãos de um apoiador leal do Califa.\n\nQue o seu reinado seja longo e abençoado!"
 install_loyalist_puppet_declared_defender:0 "$install_loyalist_puppet_declared_puppet$"
 install_loyalist_puppet_declared_puppet:0 "Guerra para Instalar Apoiador Leal"
 install_loyalist_puppet_won_puppet:0 "$install_loyalist_puppet_declared_puppet$"
 pledged_to_not_promote_persian_desc:0 "Você fez um compromisso de não promover escrituras persas."
 promote_persian_scripture_cannot_take_decision.tt:0 "Você não poderá tomar esta [decision|E] novamente por 30 anos."
 replace_the_high_priest_effect_tooltip:0 "[head_of_faith|E] muda de [GetFaithDoctrine('doctrine_temporal_head').GetBaseName] para [GetFaithDoctrine('doctrine_no_head').GetBaseName]"
 splurge_above_expectations_toast:0 "O projeto supera as expectativas"
 splurge_as_expected_toast:0 "O projeto segue conforme o planejado"
 sway_outcome.1004.a:0 "Muito bem... mas estarei de olho em você!"
 sway_outcome.1004.b:0 "Tudo está perdoado."
 sway_outcome.1004.t:0 "Um Juramento de Lealdade"
 sway_outcome_blessed.1004.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\", declara [target.GetName], curvando-se profundamente. \"Pode ser que você seja de fato abençoado por [ROOT.GetCharacter.GetFaith.HighGodName], como alguns dizem, ou talvez suas palavras tenham acertado seu alvo pura e simplesmente por acaso, mas o que importa é que eu fui tocado por nossas interações recentes. Precisamos manter o reino unido durante esta turbulência, e estarei aqui por você.\""
 sway_outcome_caliph.1004.desc:0 "[target.GetName] encontra meu olhar por apenas um momento, antes de se curvar profundamente. \"Você é o [ROOT.Char.GetTitleTierName], meu senhor feudal, e o líder legítimo da #italic ummah#! Eu tive minhas dúvidas, não vou negar, mas não posso permitir que a causa dos fiéis seja ameaçada. Não esqueci o juramento que fiz a você e não vacilarei novamente.\""
 sway_outcome_dharmic.1004.desc:0 "\"Oh [ROOT.Char.GetTitleTierName]\", declara [target.GetName] solenemente. \"Todo reino precisa de um governante acima dos outros, aquele que gira a roda, que pode ver além deste mundo passageiro de carne e loucura. Pode ser de fato que você é esse [ROOT.Char.GetTitleTierName], e, portanto, esquecerei minhas dúvidas e minha vaidade, e renovarei meu juramento a você.\""
 sway_outcome_flattery.1004.desc:0 "\"Oh grande [ROOT.Char.GetTitleTierName]\", diz [target.GetName], se curvando. \"Você em cuja sombra sou afortunado em estar, meu piedoso e glorioso senhor feudal, como eu lamento ter duvidado de você. Eu me distancio de quaisquer coisas infelizes, reais ou imaginárias, que se saiba que eu disse sobre você.\""
 sway_outcome_grudgingly.1004.desc:0 "\"Meu [ROOT.Char.GetTitleTierName]\", diz [target.GetName] relutantemente, \"parece claro para mim agora, com inimigos mútuos por toda parte, que devemos fazer um esforço para confiar um no outro. Portanto, me curvo diante de você e professo minha lealdade mais uma vez.\""
 sway_outcome_magnanimity.1004.desc:0 "\"Meu [ROOT.Char.GetTitleTierName]\", diz [target.GetName], \"posso ver agora que estava errado em duvidar de você. Sua magnanimidade faz jus a você nestes tempos difíceis, quando todos deveríamos nos unir pelo bem do reino.\" [target.GetSheHe|U] se curva diante de mim e parece sinceramente. Talvez eu tenha realmente influenciado [target.GetSheHe] para o meu lado."
