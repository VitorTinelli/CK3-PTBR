l_spanish:
 fp3_8007_studies_pay_off_toast:0 "[empowered_child.GetFirstName] mostra promessa"
 fp3_clan.3000.a:0 "Que fofo, sua [SCOPE.sC('fp3_clan_3000_bad_child').Custom2('RelationToMeShort', SCOPE.sC('fp3_clan_3000_random_family_member'))] vai adorar!"
 fp3_clan.3000.b:0 "Saia do meu jardim! #italic Devolva essas flores!!#!"
 fp3_clan.3000.c.flavor:0 "Você aproveita essa oportunidade para ensinar [fp3_clan_3000_bad_child.GetFirstNameNoTooltip] as alegrias da jardinagem"
 fp3_clan.3000.c:0 "Que tal plantarmos o próximo lote juntos?"
 fp3_clan.3000.d:0 "É isso. #italic Vou transformar você em adubo.#!"
 fp3_clan.3000.desc:0 "Hoje, o clima agradável me convidou para o jardim.\nFileira após fileira das mais belas flores em [fp3_clan_3000_loc_loc.GetNameNoTooltip] foram cuidadosamente plantadas aqui para o meu deleite pessoal.\n\nNo entanto, meu deleite é interrompido quando eu visito minhas preciosas tulipas, meu(a) [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fp3_clan_3000_bad_child'))] [fp3_clan_3000_bad_child.GetFirstName] cruelmente arrancou as belas tulipas de seu lugar para dar a elas seu(a) [SCOPE.sC('fp3_clan_3000_bad_child').Custom2('RelationToMeShort', SCOPE.sC('fp3_clan_3000_random_family_member'))] como presente. \"Olhe, eu encontrei algumas flores bonitas, acho que [fp3_clan_3000_random_family_member.GetFirstName] vai gostar delas!\""
 fp3_clan.3000.t:0 "Tulipas Devastadas"
 fp3_clan.8000.a:0 "Tempo na masmorra mudará seus modos, [usurer.GetFirstName]."
 fp3_clan.8000.b:0 "Compartilhe seus ganhos ilícitos, e podemos esquecer disso."
 fp3_clan.8000.c:0 "Parece algo para resolverem entre vocês."
 fp3_clan.8000.desc:0 "[concerned_one.GetName] se aproxima de mim, aparentemente preocupado. 'Ouvi dizer que [usurer.GetTitledFirstName] está emprestando dinheiro a cortesãos com problemas financeiros, alimentando-se de sua desgraça com suas taxas de juros exorbitantes. Todos estão dizendo que [usurer.GetSheHe] é um usurário e precisa ser responsabilizado.\n\nQuando confronto meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('usurer'))] [usurer.GetSheHe], [usurer.GetSheHe] se opõe veementemente. 'Esta é uma acusação vil! Alguns amigos pediram ajuda financeira, isso é verdade, mas eu não tinha más intenções nem pedi mais do que é justo.\n\n[concerned_one.GetTitledFirstNameNoTooltip] realmente me deve dinheiro, daí sua intromissão neste assunto.'"
 fp3_clan.8000.t:0 "Usura contra a Unidade"
 fp3_clan.8001.a.failure.tt:0 "Sua mediação falhou"
 fp3_clan.8001.a.failure:0 "Você só piora as coisas"
 fp3_clan.8001.a.success.tt:0 "Sua mediação teve sucesso"
 fp3_clan.8001.a.success:0 "Você resolveu com sucesso essa divisão"
 fp3_clan.8001.a:0 "É hora de deixar isso para trás, para o bem de todos."
 fp3_clan.8001.b.failure.tt:0 "Você falhou em semear a discórdia"
 fp3_clan.8001.b.failure:0 "Eles enxergam através do seu engano"
 fp3_clan.8001.b.success.tt:0 "Você causou uma ruptura no clã"
 fp3_clan.8001.b.success:0 "Eles caem na sua manipulação"
 fp3_clan.8001.b:0 "[bickerer_1.GetFirstNameNoTooltip] tem alguns pontos válidos, na verdade..."
 fp3_clan.8001.c:0 "Tenho algo mais importante para fazer... em algum lugar."
 fp3_clan.8001.d:0 "Me deixe fora disso."
 fp3_clan.8001.t:0 "Disputa no Clã"
 fp3_clan.8001_beginning:0 "[bickerer_1.GetTitledFirstName] e [bickerer_2.GetTitledFirstName] se envolveram em uma briga durante uma celebração privada recentemente, e ambos insistem em me envolver em seu lado do conflito."
 fp3_clan.8001_faith_schism:0 "A discordância deles parece derivar de uma discussão acalorada sobre a natureza de [bickerer_1.GetFaith.PantheonTerm].\n\n'[bickerer_1.GetFirstNameNoTooltip] tem algumas #EMP muito#! opiniões questionáveis', alega [bickerer_2.GetFirstNameNoTooltip]. 'Eu o removeria da corte se fosse você!'\n\n\"Vou poupar você dos detalhes sórdidos dos chamados argumentos de [bickerer_2.GetFirstNamePossessiveNoTooltip]\", [bickerer_1.GetFirstNameNoTooltip] contesta, \"mas acredite em mim, #EMP eu#! não sou o sacrílego aqui...'"
 fp3_clan.8001_generic_fallback:0 "Embora não esteja claro o que aconteceu exatamente, ambos estão ansiosos para me contar detalhadamente o que pensam um do outro.\n\n'[bickerer_2.GetFirstNameNoTooltip] é um [Select_CString(bickerer_2.IsFemale,'idiota','camponês')] nascido na sarjeta, simples assim', argumenta [bickerer_1.GetFirstNameNoTooltip].\n\n\"Fique em silêncio, [bickerer_1.Custom2('InsultNoun', SCOPE.sC('bickerer_2'))]\", retruca [bickerer_2.GetFirstNameNoTooltip].\n\nMediar entre eles parece uma tarefa infrutífera neste momento, mas temo que só piore se não fizer nada."
 fp3_clan.8002.a:0 "Talvez eu tenha falhado e negligenciado meu dever..."
 fp3_clan.8002.b.failure.tt:0 "Sua falsa devoção foi revelada"
 fp3_clan.8002.b.failure:0 "Você não engana ninguém"
 fp3_clan.8002.b.success.tt:0 "Sua piedade está além de qualquer reprovação"
 fp3_clan.8002.b.success:0 "Sua decepção foi bem-sucedida"
 fp3_clan.8002.b:0 "Uma doação será reservada para o [ROOT.Char.GetFaith.HouseOfWorship] local."
 fp3_clan.8002.c:0 "Deixe aqueles tolos crédulos #EMP pensarem#! que eu me importo..."
 fp3_clan.8002.d:0 "[clan_member.GetFirstNameNoTooltip], você diz? Farei [clan_member.GetSheHe] pagar por isso..."
 fp3_clan.8002.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\", meu [chaplain.GetCouncilTitle] [chaplain.GetFirstName] diz apreensivo, \"precisamos falar sobre assuntos espirituais.\" [chaplain.GetSheHe|U] faz uma pausa, para garantir que estamos a sós.\n\n\"Eu ouvi [clan_member.GetName] fofocar sobre como raramente você visita a [ROOT.Char.GetFaith.HouseOfWorship].\n\nAgora, eu não me atreveria a especular sobre sua relação pessoal com o divino, oh [ROOT.Char.GetTitleTierName]. Mas o quão piedoso você é #EMP percebido#! é crucial para aqueles que você governa.\""
 fp3_clan.8002.e:0 "Não preciso mentir sobre minha fidelidade."
 fp3_clan.8002.t:0 "Laços de Fé"
 fp3_clan.8003.a:0 "É uma honra."
 fp3_clan.8003.b:0 "Lê-lo uma vez será suficiente."
 fp3_clan.8003.c:0 "Eu não mereço isso."
 fp3_clan.8003.t:0 "O Poder de um Nome"
 fp3_clan.8003_ending:0 "\"Essas foram as palavras do [righteous_caliph.GetTitleTierName]\", [hof_emissary.GetSheHe] declara em seguida, \"e [righteous_caliph.GetSheHe] decidiu conceder a você uma grande honra. Seu nome será lido durante a Oração de Sexta-feira, em [caliphal_location.GetName] próprio. Tudo que o [righteous_caliph.GetTitleTierName] pede em troca é que você não esqueça a benevolência [righteous_caliph.GetHerm] ao conceder-lhe essa dádiva...\"\n\nA voz [hof_emissary.GetHerHim|U] se perde, como se enfatizando um significado oculto nessas palavras."
 fp3_clan.8003_fear_opening:0 "\"[ROOT.Char.GetName], você se tornou grandioso entre os [ROOT.Char.Custom('LevyMenWomen')], e suas ações e seu nome são respeitados... e temidos.\" O enviado [hof_emissary.GetFirstName] do [righteous_caliph.GetTitledFirstNamePossessive] pausa apreensivo.\n\n"
 fp3_clan.8003_respect_opening:0 "\"[ROOT.Char.GetName], você se tornou grandioso entre os [ROOT.Char.Custom('LevyMenWomen')], e suas ações e sua casa são respeitadas e honradas por todos.\" O enviado [hof_emissary.GetFirstName] do [righteous_caliph.GetTitledFirstNamePossessive] pausa solenemente.\n\n"
 fp3_clan.8004.a.failure.tt:0 "[clan_member.GetTitledFirstNameNoTooltip] não se abala"
 fp3_clan.8004.a.failure:0 "Seu plano fracassa"
 fp3_clan.8004.a.success.tt:0 "Você é temido no clã"
 fp3_clan.8004.a.success:0 "Você intimidou com sucesso [clan_member.GetTitledFirstNameNoTooltip]"
 fp3_clan.8004.a:0 "Faça isso, mas seja discreto."
 fp3_clan.8004.b:0 "Não há necessidade de discrição - apenas os mate sem rodeios."
 fp3_clan.8004.c:0 "Não, e nunca fale disso novamente."
 fp3_clan.8004.desc:0 "Meu [murder_enthusiast.Custom('GetCouncilOrCourtPosition')] [murder_enthusiast.GetFirstName] pediu por uma conversa privada, com uma expressão preocupada no rosto.\n\n\"Escute, oh [ROOT.Char.GetTitleTierName]\", [murder_enthusiast.GetSheHe] diz, quase sussurrando. \"[clan_member.GetName] está planejando algo, provavelmente conspirando contra você novamente. Talvez seja hora de agir contra alguém próximo a [clan_member.GetSheHe] para enviar uma mensagem? Ouvi dizer que [clan_member.GetSheHe] tem um criado que [clan_member.GetSheHe] favorece..."
 fp3_clan.8004.t:0 "Laços de Medo"
 fp3_clan.8005.a:0 "#EMP Nunca#!, me ouviu? E não ouse falar disso novamente."
 fp3_clan.8005.b:0 "Isso é absurdo, mas muito bem..."
 fp3_clan.8005.d:0 "[empowered_child.GetSheHe|U] é muito jovem para possuir um título!"
 fp3_clan.8005.desc:0 "\"Não é justo\", [ambitious_consort.GetTitledFirstName] reclama, finalmente dando voz a um ressentimento que parece ter sido guardado por muito tempo.\n\n\"[heir_child.GetFirstName], o mimado [heir_child.Custom('GetDaughterSon')] de [heir_parent.GetTitledFirstName], herdará o [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], enquanto [Select_CString( empowered_child.IsFemale, 'minha', 'meu' )] [empowered_child.Custom('GirlBoy')], [empowered_child.GetFirstName], inteligente, receberá quase nada.\n\nQuero que você conceda a [empowered_child.GetFirstNameNoTooltip] o [title_to_grant.GetName] imediatamente, para que [empowered_child.GetSheHe] tenha a chance de provar que é tão capaz quanto seus pares."
 fp3_clan.8005.e.failure.tt:0 "[ambitious_consort.GetFirstNameNoTooltip] desconfia de você"
 fp3_clan.8005.e.failure:0 "Você não consegue convencer [ambitious_consort.GetSheHe]"
 fp3_clan.8005.e.success.tt:0 "Você apaziguou [ambitious_consort.GetFirstNameNoTooltip]"
 fp3_clan.8005.e.success:0 "Você tranquiliza [ambitious_consort.GetFirstNameNoTooltip]"
 fp3_clan.8005.e:0 "Prometo que [empowered_child.GetSheHe] receberá uma herança no devido tempo."
 fp3_clan.8005.t:0 "Uma Posição Adequada"
 fp3_clan.8006.a:0 "Minha [sneaky_child.Custom('GetDaughterSon')] é nobre, não uma espiã menor!"
 fp3_clan.8006.b:0 "Continue assim, pequenina, mantenha seus olhos abertos para traições em nossa casa..."
 fp3_clan.8006.c:0 "Aqui, contrate alguns espiões, mas mantenha-se afastada da minha família."
 fp3_clan.8006.desc:0 "[paranoia_enthusiast.GetName], meu [paranoia_enthusiast.Custom('GetCouncilOrCourtPosition')], parece ter desenvolvido um interesse especial em meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sneaky_child'))] [sneaky_child.GetFirstName] ultimamente.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], a situação na casa [ROOT.Char.GetDynastyHouseNameNoTooltip] está ficando mais tensa a cada dia. Seus parentes estão sempre conspirando contra você.\" [paranoia_enthusiast.GetSheHe|U] diz, cutucando [sneaky_child.GetFirstNameNoTooltip] para se aproximar. \n\n\"Mas eu venho cultivando uma rede de informantes jovens, para ajudar você a ganhar vantagem, pois espiões menores têm muitos usos... Embora essas crianças sejam plebeias, [Select_CString( sneaky_child.IsFemale, 'a', 'o' )] jovem [sneaky_child.GetLadyLord] [sneaky_child.GetFirstNameNoTooltip] aqui tem talentos notáveis e poderia beneficiar você..."
 fp3_clan.8006.t:0 "Espiões Menores"
 fp3_clan.8008.a:0 "Quanto mais, melhor!"
 fp3_clan.8008.b:0 "Vamos nos concentrar em [beleaguered_clan_member.GetTitledFirstNameNoTooltip]."
 fp3_clan.8008.c:0 "Não permitirei que a ganância cause uma divisão em minha casa."
 fp3_clan.8008.desc:0 "Ultimamente, meu impiedoso coletor de impostos [ambitious_tax_collector.GetName] passou muito tempo em pensamento silencioso. Mas algo parece ter amadurecido finalmente, já que [ambitious_tax_collector.GetSheHe] me procura.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], seus vassalos têm inventado todo tipo de justificativas para não pagar tanto de imposto quanto deveriam. Mas eu também posso produzir... #italic justificativas#!...\n\n[ambitious_tax_collector.GetSheHe|U] traz um documento de aparência antiga, \"Este documento aqui mostra que seu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('beleaguered_clan_member'))] [beleaguered_clan_member.GetTitledFirstName] lhe deve mais do que se pensava anteriormente, e tenho alguns para seus outros súditos também..."
 fp3_clan.8008.t:0 "Sangrando-os Até o Fim"
 fp3_clan.8009.a.eccentric:0 "Como ousa [corrupt_mayor.GetSheHe] me desafiar!"
 fp3_clan.8009.a.failure.tt:0 "Sua crueldade foi em vão"
 fp3_clan.8009.a.failure:0 "As pessoas ficam mais irritadas do que com medo"
 fp3_clan.8009.a.success.tt:0 "Sua crueldade foi recompensada"
 fp3_clan.8009.a.success:0 "Você assusta os seguidores de [corrupt_mayor.GetFirstNamePossessiveNoTooltip] até a submissão"
 fp3_clan.8009.a:0 "Roubar de mim? Preguem [corrupt_mayor.GetSheHe] numa cruz!"
 fp3_clan.8009.b:0 "A lei está do nosso lado – removam [corrupt_mayor.GetSheHe]."
 fp3_clan.8009.c:0 "Pfft, [corrupt_mayor.GetTitleAsNameNoTooltip]? Apenas um pequeno [ROOT.Char.Custom('GetRegionalFish')]."
 fp3_clan.8009.desc:0 "\"Além disso, [corrupt_mayor.GetName] é um[Select_CString( corrupt_mayor.IsFemale, 'a', '' )] administrador[Select_CString( corrupt_mayor.IsFemale, 'a', '' )] bastante capaz e popular tanto em seu próprio domínio quanto em toda [fawazil_county.GetNameNoTier]. No entanto, [corrupt_mayor.GetSheHe] tem o hábito de deduzir sorrateiramente quantias significativas dos impostos que envia para você, como podemos ver claramente na coluna superior esquerda da receita do último ano.\"\n\nO relatório extenso e exaustivo de [righteous_tax_collector.GetNamePossessive] termina com uma grande revelação."
 fp3_clan.8009.t:0 "Popular entre o Povo"
 fp3_clan.8010.a:0 "Minha [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('capable_magistrate_candidate'))] [capable_magistrate_candidate.GetFirstNameNoTooltip] é competente, você pode se virar com [capable_magistrate_candidate.GetSheHe]."
 fp3_clan.8010.b:0 "Deixe comigo, fornecerei o que você precisa."
 fp3_clan.8010.c:0 "Eu pareço feito de dinheiro?"
 fp3_clan.8010.desc_beginning:0 "\"Não posso trabalhar assim\", exclama meu coletor de impostos [competent_tax_collector.GetName], frustrado e abatido.\n\n"
 fp3_clan.8010.t:0 "Mais Magistrados"
 fp3_clan.8010_muslim.t:0 "Qadis Competentes"
 fp3_clan.8010_muslim_version:0 "\"Cada #italic sharia#! da [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] é um covil miserável de incompetência, prejudicando todos os meus esforços. Boa arrecadação de impostos precisa de #italic qadis#! competentes, para manter os magnatas locais sob controle, para tornar seu governo justo aos olhos de [ROOT.Char.GetFaith.HighGodNameAlternate] e sua reivindicação à maior parte dos impostos justificada.\n\nVocê deve me fornecer fundos para empregar mais e melhores pessoas nos tribunais, e a autoridade para demitir os qadis corruptos."
 fp3_clan.8010_non_muslim_version:0 "\"Cada tribunal da [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] é um lugar triste onde a ganância reina sobre a eficiência e a justiça, prejudicando todos os meus esforços. Boa arrecadação de impostos precisa de magistrados competentes, para manter os magnatas locais sob controle, para tornar seu governo justo e sua reivindicação aos impostos justificada.\n\nVocê deve me fornecer fundos para empregar mais e melhores pessoas nos tribunais, e a autoridade para demitir os imbecis atualmente alojados lá."
 fp3_clan.8011.a:0 "[concerned_marshal.GetSheHe|U] já tem muito com o que se preocupar..."
 fp3_clan.8011.b.failure.tt:0 "Seu compromisso falhou"
 fp3_clan.8011.b.failure:0 "Ambos detestam essa reforma"
 fp3_clan.8011.b.success.tt:0 "Você negociou um compromisso"
 fp3_clan.8011.b.success:0 "[competent_tax_collector.GetFirstNameNoTooltip] e [concerned_marshal.GetFirstNameNoTooltip] concordam relutantemente em colaborar"
 fp3_clan.8011.b:0 "Você pode compartilhar essa responsabilidade entre vocês."
 fp3_clan.8011.c:0 "Não, deixarei as coisas como estão."
 fp3_clan.8011.desc:0 "Sempre cheio de ideias para melhorar as receitas do reino, [competent_tax_collector.GetName] se aproxima de mim enquanto realizo uma inspeção de rotina nas tropas.\n\n\"Oh [ROOT.Char.GetTitleTierName], observei que em seu próprio domínio, magnatas locais menores estão sempre tentando encher os bolsos às custas de suas tropas. Sugiro que me dê autoridade para supervisionar os pagamentos dos soldados, assim eu poderia combater a corrupção para garantir que seu exército seja financiado de maneira mais eficiente.\"\n\n\"No entanto, prevejo que [concerned_marshal.GetTitledFirstName] ficará irritado, já que todas as coisas relacionadas aos seus soldados até agora foram seu domínio."
 fp3_clan.8011.t:0 "Um Pagador Adequado"
 fp3_clan.8012.a:0 "Bom trabalho!"
 fp3_clan.8012.b:0 "Doe para a [ROOT.Char.GetFaith.HouseOfWorship], assim [extorted_vassal.GetSheHe] não pode reclamar."
 fp3_clan.8012.c:0 "Mostrarei generosidade, devolvendo parte disso como presente para [extorted_vassal.GetSheHe]."
 fp3_clan.8012.desc:0 "\"Às vezes, [ROOT.Char.Custom('FormOfAddressForLiege')], acontecem golpes de sorte.\" Meu coletor de impostos [greedy_tax_collector.GetName] esfrega as mãos em satisfação mal contida.\n\n\"Tropecei em testemunhas dispostas a testemunhar que [extorted_vassal.GetTitledFirstName] lhe devia uma quantia significativa, convenientemente #italic esquecida#! em impostos sobre terras de árvores perenes e rodas d'água. Tomei a liberdade de coletá-los.\n\nUm dos meus retentores teve dificuldade em escoltar o ouro para fora de [extorted_vassal.GetCapitalLocation.GetName], assediado pelas guardas locais, então você talvez precise ficar de olho em [extorted_vassal.GetFirstNameNoTooltip]..."
 fp3_clan.8012.t:0 "A Avareza Auspiciosa"
 fp3_clan.8013.a.failure.tt:0 "[stressed_tax_collector.GetFirstNameNoTooltip] ficou descuidado"
 fp3_clan.8013.a.failure:0 "[stressed_tax_collector.GetSheHe|U] continua a desesperar"
 fp3_clan.8013.a.success.tt:0 "[stressed_tax_collector.GetFirstNameNoTooltip] ganhou um novo foco"
 fp3_clan.8013.a.success:0 "Você tranquiliza [stressed_tax_collector.GetFirstNameNoTooltip]"
 fp3_clan.8013.a:0 "Acalme-se, podemos dar uma olhada juntos."
 fp3_clan.8013.b.failure.tt:0 "[stressed_tax_collector.GetFirstNameNoTooltip] percebeu sua ameaça"
 fp3_clan.8013.b.failure:0 "Sua intimidação tem pouco efeito"
 fp3_clan.8013.b.success.tt:0 "[stressed_tax_collector.GetFirstNameNoTooltip] tem medo de você"
 fp3_clan.8013.b.success:0 "Você assusta [stressed_tax_collector.GetFirstNameNoTooltip] a trabalhar mais"
 fp3_clan.8013.b:0 "Faça seu trabalho, ou mandarei açoitar você!"
 fp3_clan.8013.c:0 "Apenas continuarei andando..."
 fp3_clan.8013.desc:0 "Ao passear na [ROOT.Char.Custom('ResidenceBuilding')], passo pela biblioteca, onde meu coletor de impostos [stressed_tax_collector.GetName] parece estar em um estado bastante desanimado.\n\n\"Oh [ROOT.Char.GetFaith.HighGodNameAlternate]\", [stressed_tax_collector.GetSheHe] murmura para [stressed_tax_collector.GetHerselfHimself], \"Não consigo fazer isso. Esses tratados de leis tributárias são muito antigos, vagos e desorganizados. Como eu vou encontrar alguma coisa aqui?\n\nEu só queria verificar um detalhe antes de ir para as províncias novamente..."
 fp3_clan.8013.t:0 "O Ônus da Arrecadação de Impostos"
 fp3_clan.8015.a:0 "Muito bem, [scandalous_scion.GetSheHe] pode se juntar à minha corte."
 fp3_clan.8015.b:0 "[scandalous_scion.GetSheHe|U] é fruto de suas entranhas, não das minhas."
 fp3_clan.8015.desc:0 "[concerned_parent.GetName] entra em meu salão, arrastando consigo seu(a) [scandalous_scion.Custom('GetDaughterSon')], [scandalous_scion.GetFirstName], que parece menos do que feliz.\n\n\"Meu [ROOT.Char.GetTitleTierName]\", [concerned_parent.GetFirstNameNoTooltip] diz, \"você pode ter ouvido falar sobre o comportamento desta [scandalous_scion.Custom('GetDaughterSon')] minha - confraternizando nos clubes de #EMP futuwwa#! com os guerreiros vagabundos que se reúnem lá, bebendo com eles em tavernas suspeitas e perambulando pela cidade.\" [concerned_parent.GetSheHe|U] suspira profundamente.\n\n\"Devemos proteger a reputação [scandalous_scion.GetHerHim], para que isso não se torne um escândalo público. Eu estava pensando que [scandalous_scion.GetSheHe] poderia ficar aqui, para aprender algumas maneiras na sua corte."
 fp3_clan.8015.t:0 "Descendência Escandalosa"
 fp3_clan.8016.a:0 "Muito bem, eu o repreenderei."
 fp3_clan.8016.b:0 "Não, eu apoio os membros da minha família, quaisquer que sejam suas diversões."
 fp3_clan.8016.deviant_desc:0 ", devassos e um burro."
 fp3_clan.8016.drunkard_desc:0 ", ébrios e devassos."
 fp3_clan.8016.ending_desc:0 "Então, eles se envolveram em atos que mal consigo descrever, e mostraram-se relutantes em serem expulsos das instalações. E isso está longe de ser a primeira ofensa de [scandalous_clan_member.GetFirstNamePossessiveNoTooltip], aliás.\" [chaplain.GetFirstNameNoTooltip] faz uma pausa, parecendo apreensivo.\n\n\"Você deveria denunciar [scandalous_clan_member.GetSheHe], antes que suas propensões se tornem uma mancha em toda a casa."
 fp3_clan.8016.hashishiyah_desc:0 " e delinquentes viciados em drogas."
 fp3_clan.8016.opening_desc:0 "Enquanto desfruto de um banho relaxante com meu [chaplain.GetCouncilTitle] [chaplain.GetFirstName], [chaplain.GetSheHe] de repente traz um assunto mais sério.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\", [chaplain.GetSheHe] sussurra, \"ontem à noite [scandalous_clan_member.GetName] estava aqui na casa de banho, com um séquito de malfeitores barbudos."
 fp3_clan.8016.rakish_desc:0 ", prostitutas e degenerados."
 fp3_clan.8016.t:0 "Caos no Hammam"
 fp3_clan.8017.a:0 "[tax_collector.GetSheHe|U] está fazendo o trabalho de [ROOT.Char.GetFaith.HighGodNameAlternatePossessive]."
 fp3_clan.8017.b:0 "Do que você tem medo que [tax_collector.GetNameNoTooltip] descubra?"
 fp3_clan.8017.c:0 "Muito bem, mas não esqueça deste favor."
 fp3_clan.8017.corrupt.desc:0 "Infelizmente, parece que [tax_collector.GetSheHe] não foi justo nem correto, aceitando prata em troca de fazer vista grossa."
 fp3_clan.8017.cruel.desc:0 "Temo que [tax_collector.GetSheHe] tenha se mostrado bastante cruel, ansioso por empregar açoitamento ou até apedrejamento como punição pelos crimes mais leves."
 fp3_clan.8017.d:0 "Vocês devem resolver isso entre vocês."
 fp3_clan.8017.ending.desc:0 "\n\n\"Por favor, eu sei que [tax_collector.GetSheHe] é s[Select_CString( tax_collector.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('tax_collector'))], mas você deve dizer a [tax_collector.GetSheHe] para parar.\""
 fp3_clan.8017.generic.desc:0 "Não é um vício ser zeloso, nem corrupto ou cruel, mas os locais detestam [tax_collector.GetSheHe]."
 fp3_clan.8017.opening_desc:0 "\"[tax_collector.GetName] tem servido há algum tempo como seu coletor de impostos em minhas terras, e fez um trabalho suficientemente bom, mas [tax_collector.GetSheHe] também começou a agir como supervisor da moral pública.\"\n[unclan_taxpayer.GetTitledFirstName] parece preocupado e talvez um pouco culpado.\n\n"
 fp3_clan.8017.overly_eager.desc:0 "\"[tax_collector.GetSheHe|U] tem sido excessivamente diligente, açoitando súditos pela menor infração - desde travessuras inofensivas bêbadas, até tocar música nas ruas, ou homens e mulheres se intermisturando nos banhos...\""
 fp3_clan.8017.t:0 "Uma Posição Questionável"
 fp3_clan_accuse_accuser_flavor:0 "Ameaçar [unclan_taxpayer.GetTitledFirstNameNoTooltip] fará [unclan_taxpayer.GetSheHe] reconsiderar seu pedido"
 fp3_clan_making_conflict_worse_flavor:0 "Você tenta aprofundar a divisão entre [bickerer_1.GetFirstNameNoTooltip] e [bickerer_2.GetFirstNameNoTooltip]."
 fp3_clan_protect_kinsman_flavor:0 "Você protege [tax_collector.GetNameNoTooltip] contra essas acusações"
 fp3_empowered_child.tt:0 "Daqui a alguns anos, se [empowered_child.GetFirstNameNoTooltip] ainda possuir este título, [empowered_child.GetSheHe] terá melhorias de [skill|E] dependendo de seus [traits|E] atuais."
 fp3_pretending_to_be_pious_flavor:0 "Você passa mais tempo na [ROOT.Char.GetFaith.HouseOfWorship] - ou melhor, faz as pessoas pensarem que você faz."
 fp3_relations_reaction_to_imprisonment.tt:0 "Membros do clã e vassalos que gostam de [usurer.GetTitledFirstNameNoTooltip] reagirão negativamente a isso."
 increase_aptitude.tt:0 "Este modificador pode aumentar a [aptitude|E] de [competent_tax_collector.GetFirstNamePossessiveNoTooltip]"
 original_heir_upset_flavor:0 "O herdeiro original do título ficará chateado se você fizer isso."
 tax_farming_capable_courtier_flavor:0 "Você envia [capable_magistrate_candidate.GetFirstNameNoTooltip] para trabalhar como magistrado."
 unlock_extortion.tt:0 "Desbloqueia a [decision|E] [extort_subjects|E] por 20 anos."
