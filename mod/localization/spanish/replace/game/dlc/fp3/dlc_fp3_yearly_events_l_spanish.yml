 fp3_gross_persecutions_toast:0 "Os hereges estão dispersos"
 fp3_h_yearly.0001.a.notif.t:0 "Faça como eu digo, não como eu faço!"
 fp3_h_yearly.0001.a:0 "Palavras corajosas para um colega escravo de [ulema_member.Custom('RegionalAlcoholicDrink')]!"
 fp3_h_yearly.0001.b.desc:0 "Você tenta convencer [ulema_member.GetFirstNameNoTooltip] e sua corte de que beber pode ser benéfico"
 fp3_h_yearly.0001.b.failure:0 "Você se faz de tolo"
 fp3_h_yearly.0001.b.success:0 "Você consegue humilhar [ulema_member.GetFirstNameNoTooltip]"
 fp3_h_yearly.0001.b:0 "Embora [ROOT.Char.Custom('RegionalAlcoholicDrink')] possa inibir a mente, ela acalma o espírito."
 fp3_h_yearly.0001.bb:0 "Beber é a alegria de todos os [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]. Não podemos existir sem esse prazer!"
 fp3_h_yearly.0001.c.failure:0 "[ulema_member.GetNameNoTooltip] rejeita o suborno"
 fp3_h_yearly.0001.c.success:0 "A doação silencia as objeções de [ulema_member.GetNameNoTooltip]"
 fp3_h_yearly.0001.c.tt:0 "Você tenta subornar [ulema_member.GetNameNoTooltip]."
 fp3_h_yearly.0001.c:0 "Estou disposto a fazer uma doação de caridade"
 fp3_h_yearly.0001.d:0 "Eu sou apenas um pecador, mas vou tentar me melhorar."
 fp3_h_yearly.0001.desc.main:0 "Enquanto relaxo em um canto tranquilo do meu [ROOT.Char.Custom('FortifiedBuilding')] em [ROOT.GetCharacter.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip], um copo de [ROOT.Char.Custom('RegionalAlcoholicDrink')] na mão, [Select_CString( ulema_member.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', ulema_member)] [ulema_member.GetName] se aproxima com uma expressão séria.\n\n\"Sua obsessão por #italic al-khul#! é vergonhosa!\nMetade das pessoas nesta corte perdeu o respeito por você e a outra metade perdeu seu próprio senso de moral! Nas ruas, descontentes estão desafiando abertamente as regras de nossa fé, um reflexo dos pecados de seus mestres neste mesmo palácio!\"\n\n[ulema_member.GetNameNoTooltip|U] está agora fervendo, [ulema_member.GetSheHe] está gritando e chamando a atenção. Alguns cortesãos colocam silenciosamente seus próprios copos, ansiosos para não atrair a atenção do clérigo enfurecido."
 fp3_h_yearly.0001.e:0 "Silêncio! Você esquece com quem está falando."
 fp3_h_yearly.0001.t:0 "O Fascínio de Al-Khul"
