 fp3_mediate_between_them.flavor:0 "Você tenta esclarecer a situação entre [snubbed_poet.GetNameNoTooltip] e [former_employer.GetFirstNameNoTooltip]."
 fp3_mediation_fails.tt:0 "Sua mediação falha"
 fp3_mediation_succeeds.tt:0 "Sua mediação é bem-sucedida"
 fp3_pay_for_upkeep_flavor:0 "Você terá que pagar pelas despesas deles."
