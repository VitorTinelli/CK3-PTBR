 fp3_polymath_stays_flavor:0 "[persian_polymath.GetFirstNameNoTooltip] permanece em sua corte."
 fp3_promise_to_pay_for_book.tt:0 "Você promete pagar 495 [ouro|E] pelo livro quando ele estiver terminado."
 fp3_refusing_faith_treatment_flavor:0 "Você recusa esse tratamento, mas os esforços de [persian_polymath.GetFirstNamePossessiveNoTooltip] podem continuar."
 fp3_relations_care_about_sky_burial.tt:0 "Seus [courtiers|E], [vassals|E] e [close_family_members|E] terão opiniões sobre isso."
 fp3_research_project_title:0 "Pesquisa:"
 fp3_rival_gave_title_away:0 "[CHARACTER.GetShortUIName|U] deu terras pertencentes a [TARGET_CHARACTER.GetShortUIName]."
 fp3_rival_stayed_out_of_my_business:0 "[CHARACTER.GetShortUIName|U] não se intrometeu nos negócios de [TARGET_CHARACTER.GetShortUIName]."
 fp3_scholarship.0001.desc:0 "[scholar.GetTitledFirstName] chegou na esperança de receber patrocínio científico."
 fp3_scholarship.0001.t:0 "Erudito Chegou"
 fp3_scholarship.1000.a:0 "[nearby_indian_ruler.GetSheHe|U] certamente não negará meu pedido."
 fp3_scholarship.1000.b:0 "Um presente generoso adoçará a proposta."
 fp3_scholarship.1000.c:0 "Eruditos [ROOT.Char.GetCulture.GetNameNoTooltip|U] não precisam da ajuda de [nearby_indian_ruler.GetCulture.GetNameNoTooltip]!"
 fp3_scholarship.1000.d:0 "Eu não tenho tempo nem inclinação para isso."
 fp3_scholarship.1000.desc:0 "A reputação da matemática indiana chegou aos meus ouvidos, pronunciada até pelos mais humildes estudantes de aritmética. Se eu encher meus salões com eruditos [nearby_indian_ruler.GetCulture.GetName], talvez [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] possa se tornar um centro de matemática por si só.\n\nEu poderia pedir a [nearby_indian_ruler.GetTitledFirstName] que me enviasse vários desses eruditos, mas [nearby_indian_ruler.GetSheHe] aceitaria tal proposta?"
 fp3_scholarship.1000.duel_failure:0 "[nearby_indian_ruler.GetNameNoTooltip] zomba da minha impudência."
 fp3_scholarship.1000.duel_success:0 "[nearby_indian_ruler.GetNameNoTooltip] aceita meu pedido."
 fp3_scholarship.1000.duel_success_tt:0 "Vários matemáticos [nearby_indian_ruler.GetCulture.GetNameNoTooltip] chegarão em breve à minha corte."
 fp3_scholarship.1000.gift_failure:0 "[nearby_indian_ruler.GetNameNoTooltip] guarda meu presente."
 fp3_scholarship.1000.native_tt:0 "Um matemático da cultura [SCOPE.GetRootScope.GetCharacter.GetCulture.GetNameNoTooltip] será elevado à corte graças ao nosso financiamento."
 fp3_scholarship.1000.t:0 "Um Segundo Aryabhata"
 fp3_scholarship.1001.desc:0 "[mathematician.GetTitledFirstName] foi enviado por [nearby_indian_ruler.GetTitledFirstNameNoTooltip] para se juntar à minha corte."
 fp3_scholarship.1001.native.desc:0 "[mathematician.GetTitledFirstName] agora faz parte da minha corte."
 fp3_scholarship.1001.t:0 "Matemático Chegou"
 fp3_scholarship.1010.a:0 "Nunca, a vontade de [ROOT.Char.GetFaith.HighGodName] é sua ruína!"
 fp3_scholarship.1010.b.tt:0 "[magus_county.GetNameNoTooltip] não pode ser convertido por 20 anos\n[magus.GetShortUINameNoTooltip] nunca pode ser convertido"
 fp3_scholarship.1010.b:0 "Vou conceder proteção a [magus_county.GetNameNoTooltip]."
 fp3_scholarship.1010.c:0 "Sem promessas para o futuro, mas podemos deixar você ir."
 fp3_scholarship.1010.desc_dying_faith:0 "\"Apenas desejamos praticar nossa fé em paz até o fim de nossos dias. Se você nos prometer isso, pessoalmente servirei a você até meu último suspiro.\"\n\nEmbora a fé [magus_faith.GetName] esteja claramente morrendo, ainda assim, os adoradores errantes parecem persistir nos templos abandonados de [magus_county.GetProvince.GetCounty.GetName]. Este sacerdote agora se lançou aos pés do meu [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')], implorando por minha misericórdia.\n\n"
 fp3_scholarship.1010.desc_living_faith:0 "\"Tenha piedade! Apenas desejamos honrar nossos ancestrais. Se você nos conceder proteção, prometo servi-lo pessoalmente até meu último dia.\"\n\nA fé [magus_faith.GetName] continua sendo um espinho em meu lado; parece que os templos de fogo de [magus_county.GetProvince.GetCounty.GetName] estão fervendo novamente sob o manto da noite. Meu [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] e eu parecemos ter pegado um mago renegado em seus rituais inescrutáveis, mas, em vez de fugir, ele se joga corajosamente diante de mim."
 fp3_scholarship.1010.t:0 "O Mago Solitário"
 fp3_scholarship.2000.a:0 "Todo papel será confiscado para seus propósitos."
 fp3_scholarship.2000.b:0 "Devemos importar o papel, então."
 fp3_scholarship.2000.c:0 "Você terá que se contentar com o que tem."
 fp3_scholarship.2000.desc:0 "O fornecimento de papel do Oriente praticamente secou, com alguns poetas menores recorrendo a folhas de palmeira e casca para registrar seus devaneios. Em breve, nem mesmo meu Erudito da Corte [court_scholar.GetTitledFirstName] poderá adquirir confiavelmente as folhas douradas.\n\n\"Poderia voltar ao pergaminho, eu suponho, mas é terrivelmente raro de se obter nos dias de hoje. Mais papel certamente seria uma solução melhor...\""
 fp3_scholarship.2000.t:0 "Vale Seu Peso"
 fp3_scholarship.2010.a:0 "Nosso dever para com [ROOT.Char.GetFaith.HighGodName] vem primeiro."
 fp3_scholarship.2010.b:0 "Talvez eles estejam apenas tomando chá?"
 fp3_scholarship.2010.desc:0 "Meus censores me informam que meu Erudito da Corte [court_scholar.GetTitledFirstName] está bebendo em segredo com um erudito estrangeiro.\n\nSe fosse com qualquer outra pessoa, eu interromperia o envolvimento e daria a [court_scholar.GetTitledFirstNameNoTooltip] um aviso severo. [court_scholar.GetSheHe|U], no entanto, parece estar envolvido em uma conversa esclarecedora com seu companheiro, ou é o que me dizem."
 fp3_scholarship.2010.t:0 "Sabedoria Líquida"
 fp3_scholarship.2020.a:0 "Você tem minha permissão total."
 fp3_scholarship.2020.b:0 "Mantenha seus experimentos distorcidos dentro de seus diários."
 fp3_scholarship.2020.desc:0 "\"Meus estudos atingiram um impasse,\" meu Erudito da Corte [court_scholar.GetTitledFirstNameNoTooltip] me diz [ROOT.Char.Custom2('QuirkAdverbPosOrNeg', court_scholar)]. \"Só é possível extrair tanto dos livros. Mas se você apenas me emprestar [specimen.GetTitledFirstName] por um curto período, tenho certeza de que podemos alcançar um avanço juntos.\"\n\n[court_scholar.GetSheHe|U] não pode garantir a segurança de [specimen.GetTitledFirstNameNoTooltip]."
 fp3_scholarship.2020.t:0 "Visões Mórbidas"
 fp3_scholarship.2030.a:0 "O progresso só pode ser algo bom."
 fp3_scholarship.2030.desc:0 "\"...e assim é com grande prazer que posso relatar meu constante progresso na compreensão de [ROOT.Char.Custom('education_conversation_subject')].\"\n\nÀs vezes, pode ser difícil justificar manter eruditos em nossa folha de pagamento. Seu trabalho raramente beneficia diretamente o reino.\nSem dúvida, isso é algo que meu Erudito da Corte [court_scholar.GetName] está bastante ciente [court_scholar.GetHerselfHimself]. O relatório detalhado de progresso de hoje é entregue com tanto entusiasmo que beira a insinceridade."
 fp3_scholarship.2030.t:0 "Resultados Publicados"
 fp3_scholarship.2030.tt:0 "[court_scholar.GetNameNoTooltip] se beneficiou dos centros de estudos superiores dentro do seu reino."
 fp3_scholarship.8000.a.tt:0 "[court_scholar.GetFirstNameNoTooltip] começará a realizar um [research_project|E]"
 fp3_scholarship.8000.a:0 "Assuma as rédeas, [court_scholar.GetFirstNameNoTooltip]."
 fp3_scholarship.8000.b:0 "Talvez em outra ocasião?"
 fp3_scholarship.8000.desc:0 "Meu Erudito da Corte [court_scholar.GetName] se apressa até mim com vários servos, todos eles carregando livros, pergaminhos ou pergaminhos antigos.\n\n\"Acredito que posso alcançar uma descoberta, se apenas me der tempo suficiente, fundos amplos e tinta suficiente para colorir o Indo de preto."
 fp3_scholarship.8000.t:0 "Um Novo $game_concept_research_project$"
 fp3_scholarship.8100.a:0 "A biblioteca real será equipada conforme o seu desejo."
 fp3_scholarship.8100.b:0 "A biblioteca real está perfeita como está."
 fp3_scholarship.8100.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tem reclamado incessantemente do estado da biblioteca real, apresentando diante de mim pilhas de rolos amarelados e livros murchos.\n\n\"Alguns desses textos estão centenas de anos atrasados, ou até mais. Como posso conduzir as pesquisas mais recentes com tomos tão arcaicos?\""
 fp3_scholarship.8100.t:0 "$fp3_research_project_title$ Uma Biblioteca Melhor"
 fp3_scholarship.8500.a.tt:0 "[court_scholar.GetFirstNameNoTooltip] começará a realizar uma [inspiration|E] de Alquimia"
 fp3_scholarship.8500.desc:0 "\"Estou certo de que posso descobrir os segredos da própria criação, se você apenas me fornecer as ferramentas e assistentes adequados!\"\n\n [court_scholar.GetName], meu Erudito da Corte, tem falado sobre isso há algum tempo. [court_scholar.GetSheHe|U] está implorando para que eu deixe [court_scholar.GetSheHe] gastar #EMP meu ouro e prata#!, tentando descobrir os segredos de como elementos, como #EMP ouro#! e #EMP prata#!, são feitos.\n\n [court_scholar.GetFirstNameNoTooltip] está claramente muito empolgado, e é impressionante que [court_scholar.GetSheHe] tenha conseguido fazer algum sentido de notas tão crípticas como as que [court_scholar.GetSheHe] decifrou sobre este assunto, mas não está claro se isso será um empreendimento lucrativo."
 fp3_scholarship.8500.t:0 "O Chamariz do Ouro"
 fp3_scholarship.8600.a.tt:0 "[court_scholar.GetFirstNameNoTooltip] começará a realizar uma [inspiration|E] para escrever um Livro"
 fp3_scholarship.8600.desc:0 "\"Seu apoio contínuo é muito nobre e altruísta como é, mas observações brilhantes que não são registradas correm o risco de serem esquecidas! Quem saberá de meus pensamentos quando eu estiver morto e não puder mais falar sobre eles? O mundo seria um lugar pobre se eles não fossem preservados.\"\n\n[court_scholar.GetName], meu Erudito da Corte, tem um novo projeto. [court_scholar.GetSheHe|U] quer me convencer a financiar a criação de um novo livro. Um manuscrito suntuoso que [court_scholar.GetSheHe] afirma que fará meus rivais empalidecerem de inveja.\nTalvez essa ideia seja tanto para o prestígio [court_scholar.GetHerHim] quanto para o meu, mas isso não significa necessariamente que seja uma má ideia..."
 fp3_scholarship.8600.t:0 "Poder da Palavra Escrita"
 fp3_scholarship.8999.tt_crit_success:0 "[court_scholar.GetShortUINameNoTooltip] descobre uma nova inovação para a cultura [THIS.Char.GetCulture.GetName]"
 fp3_scholarship.8999.tt_failure:0 "A pesquisa de [court_scholar.GetShortUINamePossessiveNoTooltip] não produz nada útil"
 fp3_scholarship.8999.tt_success:0 "[court_scholar.GetShortUINameNoTooltip] faz uma pequena descoberta científica para a casa de [THIS.Char.GetHouse.GetNameNoTooltip]"
 fp3_scholarship.9000.a:0 "Muito bem então."
 fp3_scholarship.9000.b:0 "Eu te pago para pesquisar, não para inventar desculpas!"
 fp3_scholarship.9000.desc:0 "\"Não adianta!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] exclama para mim. Seus olhos estão escuros de incontáveis noites sem dormir.\n\n\"Não consigo enxergar além dos mares de números. Terei que abandonar este projeto, pelo menos por enquanto.\""
 fp3_scholarship.9000.t:0 "$fp3_research_project_title$ Fracasso"
 fp3_scholarship.9100.a:0 "Bom trabalho, [inspiration_owner.GetShortUINameNoTooltip]."
 fp3_scholarship.9100.desc:0 "\"[ROOT.Char.Custom2('RelationToMeAddress', inspiration_owner)|U]! Meu trabalho está feito.\"\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] fala extensivamente sobre suas descobertas e como isso pode afetar nosso reino. Eu tento dizer alguma coisa, mas em vão.\n\nQuando [inspiration_owner.GetSheHe] finalmente se senta, posso ver minha própria confusão refletida nos olhos dos meus cortesãos, mas ainda assim dou a única resposta que consigo pensar."
 fp3_scholarship.9100.t:0 "$fp3_research_project_title$ Uma Nova Descoberta"
 fp3_scholarship.9200.a:0 "Muito bem feito."
 fp3_scholarship.9200.desc:0 "\"[ROOT.Char.Custom2('RelationToMeAddress', inspiration_owner)|U]!\" grita para mim. Eu viro e encontro os olhos [inspiration_owner.GetHerHim] cansados de alegria e os braços cheios de rabiscos; seu trabalho está feito.\n\nEu só vou entender mais tarde a importância da descoberta [inspiration_owner.GetHerHim], e não vou viver o suficiente para ver isso mudar toda a história. Mas por agora, é suficiente para mim dizer:"
 fp3_scholarship.9200.t:0 "$fp3_research_project_title$ Uma Nova Inovação"
 fp3_scholarship.9900.t:0 "$fp3_research_project_title$ Descartado"
 fp3_scholarship.9900.tt:0 "[court_scholar.GetShortUIName|U] faleceu e não pode continuar sua pesquisa."
 fp3_scholarship.9901.tt:0 "[court_scholar.GetShortUIName|U] não é mais meu $court_scholar_court_position$ e não pode continuar sua pesquisa."
 fp3_scholarship_research_success_gain_effect:0 "[research_project|E] de [inspiration_owner.GetShortUINamePossessive|U] terá uma #P chance maior#! de sucesso"
 fp3_scholarship_research_success_loss_effect:0 "[research_project|E] de [inspiration_owner.GetShortUINamePossessive|U] terá uma #N chance menor#! de sucesso"
 fp3_scholarship_research_success_slight_gain_effect:0 "[research_project|E] de [inspiration_owner.GetShortUINamePossessive|U] terá uma #P ligeiramente maior#! chance de sucesso"
 fp3_scholarship_research_success_slight_loss_effect:0 "[research_project|E] de [inspiration_owner.GetShortUINamePossessive|U] terá uma #N ligeiramente menor#! chance de sucesso"
 fp3_sharhabanu_devotees_angry.tt:0 "Devotos de [bibi_shahrbanu.GetFirstNameNoTooltip] em sua corte podem discordar disso"
 fp3_silence_architecture_failure_toast:0 "A construção é #italic muito#! questionável"
 fp3_silence_architecture_success_toast:0 "A economia de custos foi bem-sucedida"
 fp3_story_cycle_seljuks_invasion_events.0001.a:0 "[fp3_seljuk_settle_target.GetNameNoTierNoTooltip] é seu, vizinho!"
 fp3_story_cycle_seljuks_invasion_events.0001.a_liege:0 "Contanto que você atenda ao chamado do seu senhor feudal, [fp3_seljuk_settle_target.GetNameNoTierNoTooltip] será seu."
 fp3_story_cycle_seljuks_invasion_events.0001.b:0 "Nunca! Não permitirei que minhas terras sejam ocupadas por sua sujeira!"
 fp3_story_cycle_seljuks_invasion_events.0001.desc:0 "nômades [lead_seljuk.GetCulture.GetNameNoTooltip] das terras fronteiriças vieram suplicar diante de mim. Eles buscam se estabelecer em [fp3_seljuk_settle_target.GetNameNoTier]"
 fp3_story_cycle_seljuks_invasion_events.0001.desc_independent:0 " como meus novos vizinhos, oferecendo sua perícia em batalha em troca de uma parte das minhas terras.\n\nSua desesperança é evidente. Mas seu exército feroz atrás deles me diz que é mais um ultimato do que um pedido."
 fp3_story_cycle_seljuks_invasion_events.0001.desc_vassal:0 " como meus súditos, oferecendo sua lealdade e perícia em batalha em troca de 'descansar em minha grande sombra'.\n\nSua desesperança é evidente. Sem outro lugar para onde ir, recusar o pedido deles inevitavelmente levará a um conflito."
 fp3_story_cycle_seljuks_invasion_events.0001.t:0 "Nômades Desesperados"
 fp3_story_cycle_zanj_rebellion_events.0002.a.failure.tt:0 "A causa [outspoken_rebel.GetHerHim] ganhará mais seguidores"
 fp3_story_cycle_zanj_rebellion_events.0002.a.failure:0 "[outspoken_rebel.GetSheHe|U] escapa do seu alcance"
 fp3_story_cycle_zanj_rebellion_events.0002.a.success:0 "Você prende o agitador"
 fp3_story_cycle_zanj_rebellion_events.0002.a:0 "Vamos armar uma armadilha para [outspoken_rebel.GetSheHe]."
 fp3_story_cycle_zanj_rebellion_events.0002.c:0 "Ignore [outspoken_rebel.GetSheHe], [outspoken_rebel.GetSheHe] é inofensivo."
 fp3_story_cycle_zanj_rebellion_events.0002.desc:0 "[outspoken_rebel.GetName], um rebelde carismático conhecido por ter tentado anteriormente uma revolta no Bahrein, foi avistado agora em [outspoken_rebel.GetCurrentLocation.GetCounty.GetName].\n\nEsse autoproclamado homem santo tem percorrido os pântanos salgados, causando problemas com os locais. Entre eles estão os Zanj, um povo das terras orientais da África, muitos dos quais trabalham lá, escravizados ou como homens livres. Isso pode ser uma chance de capturar e punir [outspoken_rebel.GetSheHe]."
 fp3_story_cycle_zanj_rebellion_events.0002.t:0 "O Rebelde Falador"
 fp3_story_cycle_zanj_rebellion_events.0004.a.failure:0 "Não consigo refutar a alegação exagerada [zanj_leader.GetHerHim]"
 fp3_story_cycle_zanj_rebellion_events.0004.a.success:0 "Você prova que [zanj_leader.GetSheHe] é uma fraude"
 fp3_story_cycle_zanj_rebellion_events.0004.a:0 "Vou refutar as reivindicações [zanj_leader.GetHerHim]."
 fp3_story_cycle_zanj_rebellion_events.0004.b:0 "Vou ignorar esse tolo."
 fp3_story_cycle_zanj_rebellion_events.0004.desc:0 "[zanj_leader.GetName], um provocador notório, apareceu em Bagdá. [zanj_leader.GetSheHe|U] escapou de Basra após uma tentativa fracassada de iniciar uma revolta. O agitador arrogante alega ser descendente de Zayd Ibn Ali e, portanto, parte da casa do Profeta.\n\nEmbora essas reivindicações sejam ridículas, meus oponentes podem achar conveniente dar-lhes credibilidade e fazer com que esse intruso levante dúvidas sobre a legitimidade do meu próprio governo."
 fp3_story_cycle_zanj_rebellion_events.0004.t:0 "Reivindicações de Divindade"
 fp3_story_cycle_zanj_rebellion_events.0006.a:0 "Você será recompensado por seu trabalho árduo."
 fp3_story_cycle_zanj_rebellion_events.0006.b:0 "Posso fazer pequenas concessões..."
 fp3_story_cycle_zanj_rebellion_events.0006.c:0 "Isso é o destino dos Zanj."
 fp3_story_cycle_zanj_rebellion_events.0006.desc.a:0 "[zanj_representative.GetName], um líder dos trabalhadores Zanj, designado para a tarefa interminável de drenar os pântanos salgados de Basra, vem a mim suplicando por melhores condições de trabalho. Eles estão na região há gerações e formam uma minoria significativa em Basra.\n\n"
 fp3_story_cycle_zanj_rebellion_events.0006.desc.b:0 "Eu suspeito que a intromissão de [zanj_leader.GetName] e seu discurso rebelde podem ter algo a ver com o crescente descontentamento deles.\n\n"
 fp3_story_cycle_zanj_rebellion_events.0006.desc.c:0 "\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetTitleAsName], por favor, [ROOT.Char.GetFaith.HighGodName] não valoriza o tratamento digno dos trabalhadores, independentemente de sua origem?\""
 fp3_story_cycle_zanj_rebellion_events.0006.t:0 "Um Zanj Se Apresenta"
 fp3_story_cycle_zanj_rebellion_events.0008.a:0 "O Arvand se tornará um rio de sangue."
 fp3_story_cycle_zanj_rebellion_events.0008.desc.a:0 "Chegam até mim relatos de uma insurreição aberta nos pântanos salinos de Basra."
 fp3_story_cycle_zanj_rebellion_events.0008.desc.b:0 "[zanj_leader.GetName], que muitos consideravam um charlatão inofensivo, conseguiu unir trabalhadores Zanj insatisfeitos e tribos árabes rebeldes sob a bandeira [zanj_leader.GetHerHim]. Apesar [zanj_leader.GetHerHim] ser [zanj_leader.GetCulture.GetName] e não um Zanj [zanj_leader.GetHerHim] em si, os rebeldes passaram a ver [zanj_leader.GetSheHe] como líder."
 fp3_story_cycle_zanj_rebellion_events.0008.desc.c:0 "[zanj_leader.GetName], um Zanj especialmente eloquente, uniu trabalhadores sobrecarregados e tribos árabes rebeldes sob a bandeira [zanj_leader.GetHerHim]. Apesar [zanj_leader.GetHerHim] ser [zanj_leader.GetCulture.GetName] e não árabe mesmo, os rebeldes passaram a ver [zanj_leader.GetSheHe] como líder."
 fp3_story_cycle_zanj_rebellion_events.0008.desc.d:0 "\n\nEles enviaram uma balsa rio abaixo em direção a Basra, e nela estão as cabeças dos senhores assassinados dos Zanj. Um desafio inconfundível à minha autoridade."
 fp3_story_cycle_zanj_rebellion_events.0008.t:0 "A Rebelião Zanj"
 fp3_story_cycle_zanj_rebellion_events_cause_greatly_strengthened_tt:0 "A causa de [outspoken_rebel.GetName] é grandemente fortalecida"
 fp3_story_cycle_zanj_rebellion_events_cause_strengthened_tt:0 "A causa de [outspoken_rebel.GetName] é fortalecida"
 fp3_story_cycle_zanj_rebellion_leaves_for_baghdad:0 "[outspoken_rebel.GetName] parte para Bagdá"
 fp3_studying_acid_ominously_tooltip:0 "Você busca estudos adicionais..."
 fp3_treating_with_turks.failure.tt:0 "Você não consegue convencê-los"
 fp3_treating_with_turks.success.tt:0 "[turkic_leader.GetCulture.GetName] concorda em negociar"
 fp3_treating_with_turks_toast.failure:0 "Os nômades se recusaram a negociar com você."
 fp3_unhidden_sky_burial.tt:0 "O ritual é descoberto após o fato"
 fp3_unlock_meditation.tt:0 "Desbloqueia a [decision|E] Meditar em Solidão"
 fp3_wait_and_see.tt:0 "Apenas o tempo dirá se a cura se mostrará eficaz"
 fp3_yearly.2000.a:0 "Sim, você sabe melhor."
 fp3_yearly.2000.b:0 "O [prudish_liege.GetTitleAsNameNoTooltip] nunca me prenderia!"
 fp3_yearly.2000.b_failure:0 "[prudish_liege.GetTitledFirstNamePossessiveNoTooltip|U] #italic muhtasib#! me pega e me açoita"
 fp3_yearly.2000.b_flavor:0 "Acredito que [prudish_liege.GetTitledFirstName] não me prejudicaria deliberadamente em nome da lei [prudish_liege.GetFaith.GetAdjective]."
 fp3_yearly.2000.b_success:0 "Eu volto para casa em segurança"
 fp3_yearly.2000.desc_drinking:0 "A noite toda eu estive bebendo com meus colegas vassalos e companheiros. Enquanto saboreio o último gole da bebida matinal,"
 fp3_yearly.2000.desc_hashish:0 "A noite toda eu tenho compartilhado haxixe com meus colegas vassalos e companheiros até o sol nascer. Enquanto roubo o último pedaço dos bolos de haxixe,"
 fp3_yearly.2000.desc_warning:0 "[cautious_vassal.GetTitledFirstName] me puxa de lado em minha euforia:\n\n\"Se [prudish_liege.GetTitledFirstNamePossessive] muhtasib ver você assim no bazar, [prudish_liege.GetSheHe] vai te prender e te açoitar. Descanse aqui dentro até a oração do #italic dhuhr#! à tarde e só vá quando estiver sóbrio.\""
 fp3_yearly.2000.t:0 "Sensores da Luz do Dia"
 fp3_yearly.2001.a:0 "Poupe a vara..."
 fp3_yearly.2001.b:0 "[ROOT.Char.GetFaith.HighGodName] perdoará, desta vez."
 fp3_yearly.2001.desc_drinking:0 "tropeçando e balbuciando seu discurso,"
 fp3_yearly.2001.desc_hashish:0 "rir e olhar para as nuvens"
 fp3_yearly.2001.desc_intro:0 "Meus #italic muhtasib#! me informam que [intoxicated.Custom2('MyCharacterIntroduction', ROOT.Char)] está vagando pelo bazar,"
 fp3_yearly.2001.desc_outro:0 "em plena luz do dia! O castigo normal para esse comportamento devasso, eles me informam, é prender e açoitar esse crente desgarrado."
 fp3_yearly.2001.t:0 "Embriaguez Pública"
 fp3_yearly.2010.a.tt:0 "[greedy_baker.GetFirstName] é pisoteado e nós compensamos a falta de trigo local para acalmar os locais"
 fp3_yearly.2010.a:0 "[greedy_baker.GetSheHe|U] será jogado sob os pés de"
 fp3_yearly.2010.a_camels:0 "camelos!"
 fp3_yearly.2010.a_elephants:0 "elefantes!"
 fp3_yearly.2010.a_horses:0 "cavalos!"
 fp3_yearly.2010.b:0 "Interessante, eu devo manter [greedy_baker.GetSheHe] por perto."
 fp3_yearly.2010.c:0 "O verdadeiro crime é esconder esses lucros de mim."
 fp3_yearly.2010.desc:0 "Nenhuma notícia de secas ou fome chegou aos meus ouvidos, mas mesmo assim o povo de [bakers_county.GetNameNoTier] reclama que o pão está ficando injustificadamente caro.\n\n\"É o seu padeiro real [greedy_baker.GetFirstName],\" [random_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] me diz. \"[greedy_baker.GetSheHe|U] comprou cada carga de trigo e farinha que entra na cidade e não nos permite comprar nem mesmo um único #italic alqueire#! para nós mesmos."
 fp3_yearly.2010.t:0 "Alqueires de Trigo"
 fp3_yearly.2020.a:0 "[liege.GetTitledFirstNameNoTooltip] deve responder pelos pecados de [sinful_tax_collector.GetTitledFirstNamePossessiveNoTooltip]."
 fp3_yearly.2020.a_failure.tt:0 "[sinful_tax_collector.GetTitledFirstNameNoTooltip] pode começar a causar problemas para mim."
 fp3_yearly.2020.a_failure:0 "Minhas protestos não são ouvidos"
 fp3_yearly.2020.a_success:0 "[sinful_tax_collector.GetTitledFirstNameNoTooltip] é demitido de seu cargo"
 fp3_yearly.2020.b.desc:0 "Isso aconteceu porque seu vassalo [denouncing_taxpayer.GetShortUIName] denunciou a maldade de [sinful_tax_collector.GetShortUIName]."
 fp3_yearly.2020.b.t:0 "Coletor de Impostos Denunciado"
 fp3_yearly.2020.b:0 "Eu devo denunciar [sinful_tax_collector.GetTitledFirstNameNoTooltip] pelo bem do reino."
 fp3_yearly.2020.c:0 "Direi uma oração por [sinful_tax_collector.GetSheHe]."
 fp3_yearly.2020.desc_arbitrary:0 "[sinful_tax_collector.GetSheHe|U] não tem amor pela justiça; [sinful_tax_collector.GetSheHe|U] coleta impostos de acordo com seus caprichos e ignorará qualquer regulamento que [sinful_tax_collector.GetSheHe] considere problemático."
 fp3_yearly.2020.desc_contrite:0 "[sinful_tax_collector.GetSheHe|U] não pode ser confiável com discrição e compartilhará livremente as finanças de qualquer um; nada chega aos ouvidos do meu senhor sem também chegar a outros nove."
 fp3_yearly.2020.desc_cynical:0 "[sinful_tax_collector.GetSheHe|U] mostra pouco interesse em assuntos religiosos e nenhum amor pelo [ROOT.Char.GetFaith.HighGodName]; [sinful_tax_collector.GetSheHe|U] dorme durante as orações da manhã e pode ser encontrado roubando migalhas durante todo o Ramadã."
 fp3_yearly.2020.desc_greedy:0 "Seu amor pelo ouro se iguala apenas ao seu amor pela vida em si; [sinful_tax_collector.GetSheHe|U] fará qualquer coisa para coletar até mesmo um centavo a mais do que é devido."
 fp3_yearly.2020.desc_intro:0 "O coletor de impostos de meu senhor [sinful_tax_collector.GetTitledFirstName] está longe de ser uma [sinful_tax_collector.GetWomanMan] virtuosa."
 fp3_yearly.2020.desc_outro:0 "\n\nComo tal [sinful_tax_collector.GetWomanMan] pode ser confiado com as finanças do reino – e as minhas também?"
 fp3_yearly.2020.t:0 "Ajustar a Balança"
 fp3_yearly.2021.a:0 "[sinful_tax_collector.GetTitledFirstNameNoTooltip|U] será demitido, inshallah."
 fp3_yearly.2021.b:0 "Vou ter suas palavras em mente."
 fp3_yearly.2021.desc_arbitrary:0 "\"[sinful_tax_collector.GetTitledFirstNameNoTooltip] raramente segue leis ou regulamentos, em vez disso, coletando impostos com base em seus caprichos. Os camponeses frequentemente são perturbados pelas coletas inconsistentes [sinful_tax_collector.GetHerHim].\""
 fp3_yearly.2021.desc_contrite:0 "\"[sinful_tax_collector.GetTitledFirstNameNoTooltip] não pode ser confiado com discrição; [sinful_tax_collector.GetSheHe|U] compartilhará livremente as finanças do reino com qualquer um que apenas ouvir. É apenas uma questão de tempo até que essas informações caiam nas mãos do inimigo.\""
 fp3_yearly.2021.desc_cynical:0 "\"[sinful_tax_collector.GetTitledFirstNameNoTooltip] não tem medo de [ROOT.Char.GetFaith.HighGodName], frequentemente dormindo durante as orações da manhã e roubando migalhas durante o Ramadã. Todos nós tememos a justiça de [ROOT.Char.GetFaith.HighGodNamePossessive] por causa [sinful_tax_collector.GetHerHim].\""
 fp3_yearly.2021.desc_greedy:0 "\"[sinful_tax_collector.GetTitledFirstNameNoTooltip] é totalmente egoísta, impulsionado pelo amor ao dinheiro em vez da justiça. [sinful_tax_collector.GetSheHe|U] geralmente coleta mais do que é devido e não dá nada ao zakat.\""
 fp3_yearly.2021.desc_intro:0 "Embora meu coletor de impostos [sinful_tax_collector.GetTitledFirstName] seja de um tipo capaz, [denouncing_taxpayer.GetName] veio até mim com fortes reservas.\n\n"
 fp3_yearly.2021.desc_outro:0 "\n\n[denouncing_taxpayer.GetTitledFirstNameNoTooltip] [denouncing_taxpayer.Custom('quirk_pos_present')], claramente esperando que eu demita [sinful_tax_collector.GetTitledFirstNameNoTooltip] por essas transgressões."
 fp3_yearly.2030.a:0 "Então, deixe-me ser amigo de todo o reino."
 fp3_yearly.2030.b:0 "Obrigado, [reassuring_courtier.GetNameNoTooltip]."
 fp3_yearly.2030.c:0 "O medo, não o amor, comprará a lealdade deles."
 fp3_yearly.2030.d:0 "Com o tempo, eles vão me conhecer."
 fp3_yearly.2030.desc_albino:0 "pele espectral e olhos demoníacos,"
 fp3_yearly.2030.desc_beauty_bad:0 "feiúra terrível,"
 fp3_yearly.2030.desc_disfigured:0 "rostro torturado por trás da máscara,"
 fp3_yearly.2030.desc_hunchbacked:0 "protrusão infeliz,"
 fp3_yearly.2030.desc_inbred:0 "corpo distorcido,"
 fp3_yearly.2030.desc_intro:0 "Enquanto eu olho para minha imagem no espelho, apoiado no meu"
 fp3_yearly.2030.desc_outro:0 "Preocupo-me que meu povo me odeie devido à minha aparência desagradável. É então que [reassuring_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] oferece sua sabedoria:\n\n\"Se você aceitar o ouro como seu inimigo, então todos [ROOT.Char.GetWomenMen] o considerarão como amigo.\""
 fp3_yearly.2030.desc_scaly:0 "pele manchada e coçante,"
 fp3_yearly.2030.desc_spindly:0 "membros finos e nodosos,"
 fp3_yearly.2030.t:0 "Um Governo Belo"
 fp3_yearly.2040.a.flavor:0 "Minha piedade e conhecimento do [caliph.GetFaith.ReligiousText] guiarão minhas palavras."
 fp3_yearly.2040.a:0 "O Mensageiro me guiará!"
 fp3_yearly.2040.a_failure:0 "Os soldados zombam do seu apelo e o derrubam"
 fp3_yearly.2040.a_success:0 "Os soldados obedecem à sua autoridade"
 fp3_yearly.2040.b.flavor:0 "[imam.GetTitledFirstNameNoTooltip] é mais versado em assuntos religiosos do que eu."
 fp3_yearly.2040.b:0 "O Mensageiro guiará [imam.GetTitledFirstName]."
 fp3_yearly.2040.b_failure:0 "Os soldados derrubam o seu [imam.Custom('MyPriestTitle')]"
 fp3_yearly.2040.b_success:0 "Os soldados respeitam o seu [imam.Custom('MyPriestTitle')]"
 fp3_yearly.2040.c:0 "Não, é muito arriscado."
 fp3_yearly.2040.desc_attacker_is_muslim:0 "Quem se opõe a mim se opõe ao Próprio Profeta, e ainda assim aquel[Select_CString( infidel.IsFemale, 'a', 'e' )] [infidel.Custom2('InsultNoun', ROOT.Char)] [infidel.GetTitledFirstName] ousou declarar guerra contra mim.\n\nNo entanto, nem todos são tão ímpios. Se eu ficasse diante do exército de [infidel.GetTitledFirstNameNoTooltip] e lembrasse a eles da minha autoridade perante o Profeta, certamente alguns soldados se renderiam."
 fp3_yearly.2040.desc_attacker_is_not_muslim:0 "Ignorante das palavras do Profeta, aquel[Select_CString( infidel.IsFemale, 'a', 'e' )] [infidel.Custom2('InsultNoun', ROOT.Char)] [infidel.GetTitledFirstName] declarou guerra contra mim e busca destruir meu reinado divino.\n\nNo entanto, nem todos são tão ímpios: há alguns nas terras de [infidel.GetTitledFirstNamePossessiveNoTooltip] que obedecem às palavras de [caliph.GetFaith.HighGodName]. Se eu ficasse diante deles e lembrasse a eles da minha autoridade perante o Profeta, certamente eles se renderiam."
 fp3_yearly.2040.t:0 "Comandante dos Fiéis"
 fp3_yearly.2041.a:0 "[caliph.Custom2('InsultNoun', ROOT.Char)] Maldit[Select_CString( caliph.IsFemale, 'a', 'o' )]!"
 fp3_yearly.2041.desc_cynical:0 "[caliph.GetTitledFirstName|U] exigiu que meus soldados [caliph.GetFaith.GetReligion.GetAdjectiveNoTooltip] se rendam sob a alegação de que [caliph.GetSheHe] é o sucessor legítimo do Profeta, e eles obedeceram a [caliph.GetSheHe]!\n\nQuem se importa se [caliph.GetSheHe] é sucessor do próprio traseiro? Isso não me impedirá de plantar meu pé nele."
 fp3_yearly.2041.desc_fallback:0 "Eu mesmo sei que minha guerra contra [caliph.GetName] é sancionada por [ROOT.Char.GetFaith.HighGodName]. Ainda assim, aquel[Select_CString( caliph.IsFemale, 'a', 'e' )] [caliph.Custom2('InsultNoun', ROOT.Char)] conseguiu convencer meus soldados [caliph.GetFaith.GetReligion.GetAdjectiveNoTooltip] de que, porque [caliph.GetSheHe] é sucessor do Profeta, eles devem se render e voltar para casa.\n\nMuitos dos meus soldados obedeceram, e agora devo lidar com as consequências de um exército devoto, mas menor..."
 fp3_yearly.2050.t:0 "Lojas Futuwaa"
 fp3_yearly.2060.t_houses_of_worship:0 "Educação em [ROOT.Char.GetFaith.HouseOfWorshipPlural|U]"
 fp3_yearly.2060.t_madrasas:0 "Madrasas"
 fp3_yearly.8000.a:0 "Eu também segui o caminho sagrado - vá em paz."
 fp3_yearly.8000.b:0 "Eu tenho uma cela nova e bonita, só para você!"
 fp3_yearly.8000.c:0 "Eu poderia usar um homem com seus talentos..."
 fp3_yearly.8000.desc:0 "\"Este [raging_ghazi.GetWomanMan] deve ser severamente punido\", diz meu íntegro [righteous_marshal.GetCouncilTitle] [righteous_marshal.GetFirstName], \"para aplacar os bons cidadãos de [murder_barony.GetNameNoTierNoTooltip].\"\n\n\"Não\", [raging_ghazi.GetFirstNameNoTooltip] suplica, pendurado em correntes na minha masmorra, \"você deve permitir que eu vá para a fronteira, pois esse é o propósito de [ROOT.Char.GetFaith.HighGodNameAlternatePossessive].\""
 fp3_yearly.8000.desc_opening:0 "[raging_ghazi.GetFirstName] era um dos muitos autointitulados #italic ghazis#! indo para a fronteira para lutar contra os infiéis,"
 fp3_yearly.8000.desc_unislamic_opening:0 "[raging_ghazi.GetFirstName] era um autodenominado #italic campeão de [ROOT.Char.GetFaith.WarGodName]#! indo para a fronteira lutar contra os bárbaros,"
 fp3_yearly.8000.flavor.a.tt:0 "Você permite que [raging_ghazi.GetFirstNameNoTooltip] continue em sua busca pelo martírio."
 fp3_yearly.8000.flavor.b.tt:0 "Isso aplacará os habitantes da cidade."
 fp3_yearly.8000.t:0 "Um Ghazi no Mau Caminho"
 fp3_yearly.8000_bath_inspector.desc:0 "quando [raging_ghazi.GetSheHe] resolveu se divertir com cortesãs e patifes na cidade de [murder_barony.GetNameNoTier]. Nessa companhia desonrosa, [raging_ghazi.GetSheHe] se envolveu em uma briga com um guarda e um inspetor de banho, esfaqueando ambos até a morte.\n\n"
 fp3_yearly.8000_dancing_girl.desc:0 "quando [raging_ghazi.GetSheHe] resolveu se embriagar na cidade de [murder_barony.GetNameNoTier]. Lá, em um estado muito embriagado, [raging_ghazi.GetSheHe] se envolveu em uma briga e espancou até a morte um estalajadeiro, uma dançarina e seu macaco de estimação.\n\n"
 fp3_yearly.8000_townsfolk.desc:0 "quando [raging_ghazi.GetSheHe] foi enganado e roubado por alguns charlatães sensuais na cidade de [murder_barony.GetNameNoTier]. [raging_ghazi.GetSheHe|U] descontou sua raiva no mercado local, espancando com assiduidade um vendedor de chá e um burro até a morte com um banquinho almofadado.\n\n"
 fp3_yearly.8001.a:0 "Muito bem, irei."
 fp3_yearly.8001.b:0 "[Select_CString( dutiful_spouse.IsFemale, 'Minha', 'Meu' )] [dutiful_spouse.GetWifeHusband] [dutiful_spouse.GetFirstName] precisa de mais tarefas, [dutiful_spouse.GetSheHe] pode ir."
 fp3_yearly.8001.c:0 "Vou sair... em alguns dias..."
 fp3_yearly.8001.d:0 "A fronteira é para soldados e colonos, não para mim."
 fp3_yearly.8001.desc:0 "Meu vigilante [concerned_councillor.GetCouncilTitle] [concerned_councillor.GetFirstName] ultimamente ficou preocupado com o estado das nossas defesas na fronteira.\n\n\"Você deve fazer imediatamente uma visita às fortalezas em [frontier_fort_county.GetName], [ROOT.Char.Custom('FormOfAddressForLiege')]. Isso melhoraria muito a moral dos seus soldados, que de outra forma ficaram bastante desanimados.\"\n\n[concerned_councillor.GetSheHe|U] pausa. \"Mas devo mencionar que houve rumores, completamente infundados, sobre um pequeno surto de doença..."
 fp3_yearly.8001.flavor.b.tt:0 "[concerned_councillor.GetFirstNameNoTooltip] não aprova [dutiful_spouse.GetWomenMen] em papéis militares."
 fp3_yearly.8001.flavor.c.tt:0 "Você não pretende realmente fazer isso."
 fp3_yearly.8001.t:0 "Benfeitor da Fortaleza da Fronteira"
 fp3_yearly.8002.a:0 "Vou queimá-los todos e salgar a terra."
 fp3_yearly.8002.b:0 "[regional_heresy.GetNameNoTooltip], você diz? Parece interessante..."
 fp3_yearly.8002.c:0 "Já que você está tão preocupado, #italic você#! pode ir lá e convertê-los de volta."
 fp3_yearly.8002.d:0 "Devemos esperar para ver como a situação se desenvolve."
 fp3_yearly.8002.desc:0 "[Select_CString( concerned_person.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('concerned_person'))] [concerned_person.GetFirstName] recebeu notícias preocupantes sobre os soldados que guarnecem as fortalezas no [frontier_fort_county.GetName].\n\n\"Eles se converteram sorrateiramente à heresia vil de [regional_heresy.GetName]\", [concerned_person.GetSheHe] me diz com a voz trêmula. \"Embora eu não saiba quem é o líder deles, temo que, se nada for feito, logo eles empunharão as armas #italic que#! você pagou e tentarão te derrubar."
 fp3_yearly.8002.t:0 "Fé na Fronteira"
 fp3_yearly.8003.a:0 "Coloque sua fé em [ROOT.Char.GetFaith.HighGodNameAlternate], não em superstições bobas."
 fp3_yearly.8003.b:0 "Vou enviar os melhores exploradores que o ouro pode comprar."
 fp3_yearly.8003.c:0 "Vou enviar meu [quest_chaplain.GetCouncilTitle] [quest_chaplain.GetFirstName] para pegá-las para você."
 fp3_yearly.8003.d:0 "Você não pode pegar espand normal como todo mundo?"
 fp3_yearly.8003.desc:0 "[Select_CString( superstitious_consort.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('superstitious_consort'))] [superstitious_consort.GetFirstName] tem o hábito de queimar sementes de #italic espand#! para afastar as forças do mal. Mas agora [superstitious_consort.GetSheHe] alega que m[Select_CString( cruel_consort.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('cruel_consort'))] [cruel_consort.GetFirstName] a amaldiçoou com o Olho do Mal e roubou seu suprimento de espand. [cruel_consort.GetFirstNameNoTooltip], é claro, nega qualquer conhecimento sobre o assunto. Mas [superstitious_consort.GetFirstNameNoTooltip] parece totalmente focado em adquirir novos espand, para se livrar dessa suposta maldição.\n\n\"Por favor, [ROOT.Char.Custom('FormOfAddressForLiege')]\", [superstitious_consort.GetSheHe] implora, \"Um mago me contou sobre uma montanha sagrada na [espad_mountain_province.GetName], apenas lá as melhores flores de espand florescem. Você deve mandar buscá-las para mim."
 fp3_yearly.8003.t:0 "Espand Exótica"
 fp3_yearly.8004.a.tt:0 "#V Duelo#! [fp3_child_to_leave.GetFirstName] para fazer [fp3_child_to_leave.GetSheHe] ficar!\n#weak Este duelo NÃO é até a morte.#!\nSe você vencer, ganhará [prestige_i] [prestige|E]\n\nSua [prowess|E]: [prowess_i]#V [parent.GetProwess]#!\n[prowess_i]#V A Prowess de [fp3_child_to_leave.GetFirstNameNoTooltip]#!"
 fp3_yearly.8004.a:0 "Desembainhe a espada, seu rebento desprezível!"
 fp3_yearly.8004.b.failure:0 "[fp3_child_to_leave.GetFirstNameNoTooltip] permanece determinado a partir"
 fp3_yearly.8004.b.success:0 "[fp3_child_to_leave.GetFirstNameNoTooltip] desiste de seus sonhos de aventura"
 fp3_yearly.8004.b:0 "Você não ficará, pelo bem de [worried_relation.GetFirstNamePossessiveNoTooltip]?"
 fp3_yearly.8004.c.flavor:0 "Você deserdará [fp3_child_to_leave.GetFirstNameNoTooltip] se [fp3_child_to_leave.GetSheHe] partir."
 fp3_yearly.8004.c:0 "Se você partir, não será mais m[Select_CString( fp3_child_to_leave.IsFemale, 'inha', 'eu' )] [fp3_child_to_leave.Custom('GetDaughterSon')]."
 fp3_yearly.8004.d:0 "Eu também senti esse chamado. Você deve ir, m[Select_CString( fp3_child_to_leave.IsFemale, 'inha', 'eu' )] [fp3_child_to_leave.Custom('GetDaughterSon')]."
 fp3_yearly.8004.desc:0 "Para alguns que habitam nas esplêndidas cidades desta terra, os ventos uivantes das estepes do norte ainda ecoam em seus corações. Para o bem ou para o mal, m[Select_CString( fp3_child_to_leave.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fp3_child_to_leave'))] [fp3_child_to_leave.GetFirstName] começou a sentir esse chamado.\n\n\"[parent.GetMotherFather|U], você deve me deixar ir. Quero aprimorar minha mente e minha espada na fronteira selvagem, viajar com caravanas e montanheses, e talvez até encontrar a montanha #italic Hara Berezaiti#! da lenda.\"\n\nMas [worried_relation.GetFirstName] ama [fp3_child_to_leave.GetFirstNameNoTooltip] profundamente e está me suplicando para recusar o pedido [fp3_child_to_leave.GetHerHim]."
 fp3_yearly.8004.t:0 "A Fronteira Chama"
 fp3_yearly.8007.a:0 "Não serei considerado insuficiente."
 fp3_yearly.8007.b:0 "Bom. Tenho #italic verdadeiras#! responsabilidades para você."
 fp3_yearly.8007.c:0 "E agora você deve se casar!"
 fp3_yearly.8007.desc:0 "\"Eu cedo! Eu cedo, [parent.GetMotherFather]! Não mais!\" [Select_CString( fp3_child_to_leave.IsFemale, 'Minha', 'Meu' )] [fp3_child_to_leave.Custom('GetDaughterSon')] recua.\n\n\"Se é isso que você quer que eu fique, assim será. Serei o [fp3_child_to_leave.Custom('GetDaughterSon')] obediente que você quer que eu seja. [ROOT.Char.GetFaith.HighGodNameAlternate] julgará você no final.\""
 fp3_yearly.8007.t:0 "[ROOT.Char.GetCulture.GetName] Paternidade"
 fp3_yearly.8008.a:0 "Eu posso perder [Select_CString( fp3_child_to_leave.IsFemale, 'minha', 'meu' )] [fp3_child_to_leave.Custom('GetDaughterSon')], mas também meu ouro?"
 fp3_yearly.8008.b:0 "Seria melhor ser um eunuco..."
 fp3_yearly.8008.c:0 "O destino o trará de volta para mim, você verá..."
 fp3_yearly.8008.desc:0 "Eu recuo, ensanguentado e exausto, enquanto [fp3_child_to_leave.GetFirstNameNoTooltip] se aproxima de mim com arma em punho.\n\n\"Eu já disse, [parent.GetMotherFather], eu #italic vou#! partir. Vou viajar para a fronteira, como meu coração desejava, longe ao longo da Rota da Seda, e #italic você#! vai pagar por isso.\"\n\nSó posso assistir enquanto [Select_CString( fp3_child_to_leave.IsFemale, 'minha', 'meu' )] [fp3_child_to_leave.Custom('GetDaughterSon')] parte, cabeça erguida, com uma sacola de moedas de ouro Kushan e Sasanian do meu tesouro."
 fp3_yearly.8008.t:0 "Uma Derrota Ignominiosa"
 fp3_yearly.8009.a:0 "Farei um exemplo deles."
 fp3_yearly.8009.b:0 "A escritura na língua apropriada mostrará o caminho para eles."
 fp3_yearly.8009.c:0 "[Select_CString( loyal_chaplain.IsFemale, 'Minha', 'Meu' )] [loyal_chaplain.GetCouncilTitle], [loyal_chaplain.GetFirstNameNoTooltip], irá pregar para eles."
 fp3_yearly.8009.d:0 "Infelizmente, tenho preocupações mais urgentes."
 fp3_yearly.8009.desc_beginning:0 "A Fronteira Oriental tem sido há muito tempo um refúgio para hereges e seitas estranhas. No entanto, em [caliphal_location.GetName], o [righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName] tem ficado cada vez mais preocupado com isso.\n\n\"Ouvimos falar sobre os [very_heretic_county.GetCountyData.GetFaith.GetAdherentNamePlural] em [very_heretic_county.GetName], que praticam rituais bizarros.\" O enviado [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetAdjectiveNoTooltip] [hof_emissary.GetName] faz uma pausa, como se reunindo coragem, antes de [hof_emissary.GetSheHe] continuar em voz baixa e escandalizada. \"Alguns até falam, de rituais de natureza #italic carnal#!. Já é o suficiente."
 fp3_yearly.8009.desc_muslim_or_jewish_insult_ending:0 "O [righteous_caliph.GetTitleTierName] quer que você lide com esses malfeitores."
 fp3_yearly.8009.desc_other_insult_ending:0 "O [righteous_caliph.GetTitleTierName] quer que você lide com esses blasfemadores imundos."
 fp3_yearly.8009.qurans.flavor:0 "Você patrocina cópias do [righteous_caliph.GetFaith.ReligiousText] em [righteous_caliph.GetCulture.GetLanguage.GetNameNoTooltip]."
 fp3_yearly.8009.t:0 "Preocupações do [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetAdjectiveNoTooltip]"
 fp3_yearly.8010.a:0 "Vou atacar [pagan_ruler.GetSheHe] imediatamente!"
 fp3_yearly.8010.b:0 "Ajude-me a financiar esta guerra, e eu a começarei."
 fp3_yearly.8010.c:0 "Você deve entender, grande [righteous_caliph.GetTitleTierName], que o momento não é adequado."
 fp3_yearly.8010.d:0 "Você não tem autoridade sobre minhas terras."
 fp3_yearly.8010.desc_muslim:0 "Os estudiosos da Mesopotâmia dividiram o mundo em três partes. Eles falam do #italic Dar al-Tawhid#! dos fiéis e do #italic Dar al-'Ahd#! dos nossos aliados, mas também do #italic Dar al-Harb#!, a fronteira, o Domínio da Guerra. O [righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName] acredita fervorosamente nessa visão de mundo e está perpetuamente preocupado com a ameaça oriental.\n\n\"É seu dever como um [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] trazer a fronteira pagã sob nossa vigilância\", [righteous_caliph.GetSheHe] me diz. \"Há muito tempo toleramos as práticas idólatras de [pagan_ruler.GetTitledFirstName]. Enviarei tropas leais #italic ghazi#! e mercenários turcos para que você possa libertar [pagan_county.GetNameNoTier] do domínio [pagan_ruler.GetHerHim]."
 fp3_yearly.8010.desc_not_muslim:0 "O [righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName] acredita fervorosamente em uma visão do mundo como uma luta interminável entre civilização e barbárie, e está perpetuamente preocupado com inimigos sem fé que se escondem e conspiram no selvagem Oriente.\n\n\"É seu dever como um [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip]\", [righteous_caliph.GetSheHe] me diz, \"trazer a fronteira pagã sob nossa vigilância. Há muito tempo toleramos as práticas idólatras de [pagan_ruler.GetTitledFirstName]. Enviarei tropas leais #italic ghazi#! e mercenários turcos para que você possa libertar [pagan_county.GetNameNoTier] do domínio [pagan_ruler.GetHerHim]."
 fp3_yearly.8010.t:0 "O Domínio da Guerra"
 fp3_yearly.8010_warmonger.tt:0 "Espera-se que você capture [pagan_county.GetNameNoTier] dentro de #bold cinco anos#!."
 fp3_yearly.8012.a:0 "Fiz o que qualquer [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] faria."
 fp3_yearly.8012.desc:0 "\"Parece\", declara o [righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName], \"que você não demorou em cumprir sua promessa de conquistar [pagan_county.GetNameNoTier] em nome de nossa fé. Você provou ser um governante confiável e um [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] devoto, e não esqueceremos tão cedo.\""
 fp3_yearly.8012.t:0 "Uma Promessa Cumprida"
 fp3_yearly.8013.a:0 "Peço desculpas, as circunstâncias conspiraram contra mim."
 fp3_yearly.8013.b:0 "Não reconheço você, nem qualquer juramento feito."
 fp3_yearly.8013.desc:0 "\"Cinco anos atrás\", declara o [righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName], \"você prometeu diante de nós libertar [pagan_county.GetNameNoTier] dos pagãos. Como pode ser, então, que isso não tenha acontecido?\""
 fp3_yearly.8013.t:0 "Desapontamento do [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetAdjectiveNoTooltip]"
 fp3_yearly.8014.a:0 "Que boa ideia!"
 fp3_yearly.8014.b:0 "[ROOT.Char.Custom('LevyMenWomen')|U] pode não me julgar, mas [ROOT.Char.GetFaith.HighGodNameAlternate] o fará."
 fp3_yearly.8014.c:0 "Eu não farei isso, e #italic nem você#!."
 fp3_yearly.8014.desc:0 "Por muito tempo, lutei para conciliar meu amor por bebidas intoxicantes com a visão piedosa dos [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]. Felizmente, m[Select_CString( smart_courtier.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('smart_courtier'))] [smart_courtier.GetFirstName] encontrou uma solução.\n\n\"Soube de antigos [ROOT.Char.Custom('LevyMenWomen')] em Osrushana\", [smart_courtier.GetSheHe] diz, \"que precisam de uma certa quantidade de bebida para lidar com o clima frio. E para se divertirem em geral, é claro. Eles têm o hábito de despejar suas bebidas em um bule de cobre, para que qualquer observador excessivamente zeloso assuma que estão bebendo chá, não vinho. Eu mesmo tenho feito isso por um bom tempo, e é bastante conveniente.\""
 fp3_yearly.8014.t:0 "Segredos do Bule"
 fp3_yearly.8016.a:0 "Me entregue um martelo grande!"
 fp3_yearly.8016.b:0 "Não, vamos ouvir os habitantes da floresta."
 fp3_yearly.8016.c:0 "Eu os farei remover e erguê-los fora do meu [ROOT.Char.Custom('ResidenceBuilding')]..."
 fp3_yearly.8016.desc:0 "M[Select_CString( hyrcanian_vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hyrcanian_vassal'))] [hyrcanian_vassal.GetFirstName] me convidou para dar uma olhada em um trio de estranhas pedras esculpidas, profundamente na floresta de Hyrcanian em seu domínio.\n\n\"Elas devem ter sido erguidas por uma expedição perdida dos selvagens #italic Rusiyyah#!\", [hyrcanian_vassal.GetSheHe] me diz. \"Agora, os habitantes locais da floresta tomaram gosto por essas pedras e acreditam que seus criadores desconhecidos descerão sobre eles do Mar Cáspio com vingança rápida e sangrenta caso as pedras sejam destruídas. Mas eu não acredito em tais contos. Embora eu não consiga ler as letras nessas pedras, com certeza são ídolos pagãos e devem ser esmagados em pedaços. Não é assim, meu senhor?"
 fp3_yearly.8016.t:0 "Pedras Esquecidas"
 fp3_yearly.8017.a:0 "[ROOT.Char.GetFaith.HighGodNameAlternate], o que fizemos para te irritar?"
 fp3_yearly.8017.b:0 "Enviarei algum ouro, seja lá qual for sua utilidade."
 fp3_yearly.8017.c:0 "Isso é um mau presságio... Eu deveria restaurar as pedras para [runestone_county.GetNameNoTierNoTooltip]."
 fp3_yearly.8017.desc:0 "O desastre aconteceu! Guerreiros irados #italic Rus#! desceram sobre [runestone_county.GetNameNoTier] como abutres sobre um cadáver, massacrando todos à vista. [hyrcanian_vassal.GetTitledFirstName] [hyrcanian_vassal.GetHerselfHimself] foi derrubado por um golpe de machado e está em estado crítico, gravemente mutilado. Mas tão rapidamente quanto vieram, os saqueadores voltaram para seus barcos e desapareceram na névoa da manhã no Mar Cáspio.\n\nHá rumores se espalhando entre os sobreviventes de que os agressores podem ter buscado vingança contra [hyrcanian_vassal.GetFirstNameNoTooltip] pela profanação das runas Rus', todos aqueles anos atrás..."
 fp3_yearly.8017.t:0 "Devastação Hyrcanian"
 fp3_yearly.8018.a:0 "Muito bem, vou vender meu cavalo."
 fp3_yearly.8018.b:0 "Eu nunca me separaria de [ROOT.Char.Custom('WarhorseStoryName')]."
 fp3_yearly.8018.c:0 "Saia da minha vista, velha sem cavalo!"
 fp3_yearly.8018.desc_eunuch:0 "Enquanto estou treinando com [ROOT.Char.Custom('WarhorseStoryName')], um viajante de longe se aproxima de mim. Ele se curva com movimentos sutis, cuidadosamente medidos, indicando uma longa carreira em cortes esplêndidos.\n\n\"Sirvo uma grande dama\", diz ele, \"na China, além dessas grandes montanhas. Minha senhora é uma ávida jogadora de #italic chovgan#!, mas também propensa a jactâncias, e ela disse a seus amigos que no próximo jogo, ela cavalgaria o cavalo mais fino sob o céu. Meu povo há muito tempo aprecia os #italic cavalos celestiais#! de sua terra, e parece que, [ROOT.Char.Custom('FormOfAddressForLiege')], você possui o melhor de todos eles. Mas eu também sei que você tem algumas dificuldades #italic financeiras#!..."
 fp3_yearly.8018.desc_grand_old_lady:0 "Enquanto estou treinando com [ROOT.Char.Custom('WarhorseStoryName')], uma senhora elegante com trajes exóticos se aproxima de mim com sua comitiva.\n\n\"Venho\", ela me diz, \"dos grandes tribunais da China. Ultimamente, tenho me interessado por #italic chovgan#!, o esporte equestre que é popular até mesmo em seu pequeno reino. Mas, para o próximo jogo, prometi cavalgar um #italic cavalo celestial#!, os corcéis que sangram sangue de Ferghana, que meu povo preza acima até mesmo da Pílula da Imortalidade. Agora, chegou ao meu conhecimento que você, [Select_CString( ROOT.Char.IsFemale, 'a', 'ao' )] insignificante [ROOT.Char.GetLadyLord] destas terras, tem um [ROOT.Char.Custom('HorseStoryMareStallion')] mais fino do que qualquer outro. Também chegou ao meu conhecimento que você está endividado..."
 fp3_yearly.8018.t:0 "Um Cavalo Celestial"
 fp3_yearly.8019.a:0 "Aceito de bom grado essa proposta."
 fp3_yearly.8019.b:0 "Vocês podem se estabelecer em [refuge_of_light.GetNameNoTierNoTooltip] - se pagarem os impostos apropriados."
 fp3_yearly.8019.c:0 "Não abrigarei vocês em minhas terras."
 fp3_yearly.8019.desc:0 "[hateful_ruler.GetTitleTierName] [hateful_ruler.GetFirstName] iniciou uma perseguição aos restantes [manichean_leader.GetFaith.GetAdherentNamePlural] em suas terras. [manichean_leader.GetName], líder desta fé aflita, agora procura por mim, carregando uma grande pilha de livros empoeirados.\n\n\"Grande [ROOT.Char.GetTitleTierName]\", [manichean_leader.GetSheHe] diz, \"minha fé é antiga, uma concorrente do cristianismo quando este ainda era jovem. Possuímos muito conhecimento sobre este mundo caído da matéria, e até mesmo alguma humilde compreensão do mundo superior da luz. Alguns de nossos compatriotas já se estabeleceram em [refuge_of_light.GetNameNoTier] - você permitiria que meus seguidores fizessem o mesmo?\"\n\n\"Em troca, posso ficar e servi-lo, e compartilhar contigo este tesouro de conhecimento de nossas bibliotecas antigas em Bagdá e Ctesifonte antes de sua queda."
 fp3_yearly.8019.t:0 "Refúgio da Luz"
 fp3_yearly.8020.a:0 "Até mesmo colocarei guardas para protegê-lo, por sua causa."
 fp3_yearly.8020.b:0 "Ela era uma #italic princesa#! da Pérsia! Ninguém deve danificar esse santuário."
 fp3_yearly.8020.c:0 "Ai, ele deve ser destruído."
 fp3_yearly.8020.desc:0 "Há um santuário em [temple_county.GetNameNoTier], dedicado a [bibi_shahrbanu.GetFirstName], uma princesa sassânida que se casou com o grande [imam_husayn.GetTitledFirstName]. Fugindo a cavalo da Batalha de Carbala, dizem que [bibi_shahrbanu.GetFirstNameNoTooltip] clamou por salvação, e uma montanha se abriu e a acolheu. Desde então, muitas peregrinas têm vindo a esse local para venerá-la.\n\nMas [righteous_caliph.GetTitledFirstName] afirma que o santuário era originalmente dedicado à divindade pagã [GetFaithByKey('mazdayasna').FertilityGodName], e que a devoção demonstrada lá é distorcida e ímpia. [righteous_caliph.GetSheHe|U] quer destruí-lo.\n\n\"Você não pode fazer isso\", implora m[Select_CString( pious_woman.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('pious_woman'))] [pious_woman.GetFirstName]. \"[bibi_shahrbanu.GetFirstNameNoTooltip] é um ícone para todas as mulheres na Pérsia. Você deve deixar o santuário em paz."
 fp3_yearly.8020.t:0 "A Dama da Terra"
 fp3_yearly.8021.a:0 "[enthusiastic_alchemist.GetNameNoTooltip], me conte mais sobre essas descobertas..."
 fp3_yearly.8021.b:0 "Muito bem, [upset_vassal.GetTitledFirstNameNoTooltip], eu farei executar [enthusiastic_alchemist.GetSheHe]."
 fp3_yearly.8021.c:0 "Eu tenho espaço em minha masmorra para este alquimista magricela..."
 fp3_yearly.8021.d:0 "Ninguém tem culpa aqui, vocês devem se perdoar mutuamente."
 fp3_yearly.8021.desc:0 "Há alguns dias, [alchemy_enthusiast.GetName], [Select_CString( alchemy_enthusiast.IsFemale, 'a', 'o' )] [alchemy_enthusiast.Custom2('RelationToMe', SCOPE.sC('upset_vassal'))] erudit[Select_CString( alchemy_enthusiast.IsFemale, 'a', 'o' )] [Select_CString( upset_vassal.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('upset_vassal'))] [upset_vassal.GetFirstName], participou de um experimento com óleo de vitríolo concebido pelo célebre alquimista [enthusiastic_alchemist.GetName]. Aparentemente, algo deu terrivelmente errado.\n\n\"Você deve punir severamente [enthusiastic_alchemist.GetFirstNameNoTooltip]\", [upset_vassal.GetTitledFirstNameNoTooltip] me diz, \"veja o estado miserável [Select_CString( upset_vassal.IsFemale, 'da minha', 'do meu' )] [alchemy_enthusiast.Custom2('RelationToMe', SCOPE.sC('upset_vassal'))]!\"\n\n\"Não, minha [ROOT.Char.GetTitleTierName]\", [enthusiastic_alchemist.GetFirstNameNoTooltip] implora, \"eu apenas aperfeiçoei uma fórmula há muito tempo procurada pelos sábios. Não é minha culpa que [alchemy_enthusiast.GetTitledFirstNameNoTooltip] tenha sido descuidado com um inteiro #italic uqiyyah#! da substância mais corrosiva já vista na terra."
 fp3_yearly.8021.t:0 "Um Acidente Ácido"
 fp3_yearly.8022.a:0 "Estudarei a substância pessoalmente!"
 fp3_yearly.8022.b.flavor:0 "[enthusiastic_alchemist.GetNameNoTooltip] permanece em sua corte para continuar a pesquisa."
 fp3_yearly.8022.b:0 "Poderia ter algum... uso militar? #italic military#!"
 fp3_yearly.8022.c.flavor:0 "[enthusiastic_alchemist.GetNameNoTooltip] leva seu conhecimento para outro lugar."
 fp3_yearly.8022.c:0 "Bem feito, mas eu não tenho uso para isso."
 fp3_yearly.8022.desc:0 "O que inventei é derivado de um mineral vítreo que os babilônios e gregos antigos chamavam de #italic vitríolo#!\", [enthusiastic_alchemist.GetName] explica. \"Ao assar meticulosamente vitríolo verde em um alambique de ferro, criei essa substância corrosiva. Eu poderia ver usos tanto acadêmicos quanto medicinais para ela, mas cuidado, [ROOT.Char.Custom('FormOfAddressForLiege')], não é para ser tratada levianamente, como [alchemy_enthusiast.GetTitledFirstName] aprendeu. Talvez você queira patrocinar minha pesquisa adicional?"
 fp3_yearly.8022.t:0 "Visões Vitríolicas"
 fp3_yearly.8023.a:0 "Não, eu verei isso até o fim."
 fp3_yearly.8023.b:0 "Talvez você tenha razão. Ainda assim, você deveria ficar e me servir."
 fp3_yearly.8023.c:0 "Como desejar. Vá e leve seu ácido consigo."
 fp3_yearly.8023.desc:0 "Enquanto despejo líquidos sibilantes e ameaçadores de uma garrafa para outra, [enthusiastic_alchemist.GetName] me olha com apreensão.\n\n\"Oh [ROOT.Char.GetTitleTierName]\", [enthusiastic_alchemist.GetSheHe] diz, \"eu sou principalmente um estudioso de história e teologia; comparado a você, sou apenas um experimentador em alquimia, parece. No entanto, minha experiência diz que não podemos aprender mais nada por agora. Devemos parar de experimentar com este óleo de vitríolo que criei, ou temo que [ROOT.GetCharacter.GetFaith.HighGodNameAlternate] nos punirá por nossa vaidade. Pode ser que tal ácido não devesse ter sido colocado nesta terra."
 fp3_yearly.8023.t:0 "Enigmas Corrosivos"
 fp3_yearly.8024.a:0 "Verei que isso seja feito, prometo."
 fp3_yearly.8024.b:0 "Posso lhe proporcionar um funeral celeste em segredo, mas o reino nunca deve saber."
 fp3_yearly.8024.c:0 "Ai, não posso cometer tal afronta ao [ROOT.GetCharacter.GetFaith.HighGodNameAlternate]."
 fp3_yearly.8024.desc:0 "À medida que a febre e os arrepios diminuem por um breve momento, [dying_consort.GetFirstName] me olha com um sorriso pálido. \"[Select_CString( ROOT.Char.IsFemale, 'Minha boa', 'meu bom' )] [ROOT.Char.GetWifeHusband], não me resta muito tempo neste mundo. Mesmo os melhores médicos só poderiam adiar o inevitável, eu posso sentir.\" Parece exigir grande esforço para [dying_consort.GetSheHe] permanecer consciente por mais um tempo.\n\n\"Escute\", [dying_consort.GetSheHe] diz com uma voz enfraquecida, \"por este ser meu último desejo. Eu quero que meu corpo seja dado aos abutres, à maneira de meus antepassados, para que minha alma possa ser levada de volta ao seu lugar no céu. Nenhuma sepultura ou cremação, por favor, eu te imploro. Eu vislumbrei o mundo além em meus sonhos febris... quero terminar da maneira antiga, como uma verdadeira [dying_consort.Custom('GetDaughterSon')] da Pérsia."
 fp3_yearly.8024.t:0 "O Retorno ao Céu"
 fp3_yearly.8025.a:0 "Que [dying_consort.GetSheHe] passe pacificamente para a outra margem."
 fp3_yearly.8025.b:0 "Honrei o último desejo [dying_consort.GetHerHim]."
 fp3_yearly.8025.desc:0 "Com toda a cerimônia apropriada, o corpo de [dying_consort.GetName] é colocado para descansar nos nichos de um antigo #italic dakhma#!, exposto ao céu e aos abutres da estepe que já circulam acima.\n\nJá se passaram três dias desde a morte [dying_consort.GetHerHim], e eu me pego permanecendo perto do dakhma até o nascer do sol. De acordo com a tradição antiga, na quarta manhã após a morte, a alma retornaria ao seu espírito #italic fravashi#! no mundo superior. Lá, ela transmitiria à fravashi tudo o que aprendeu na vida, para ajudar na batalha eterna contra o mal. Mas eu não vejo alma alguma subindo para o céu das paredes ressequidas do dakhma, apenas a silhueta escura dos abutres contra a luz pálida do sol nascendo."
 fp3_yearly.8025.t:0 "A Quarta Manhã"
 fp3_yearly.8026.a:0 "Espero que ninguém descubra isso..."
 fp3_yearly.8026.b:0 "Deveria silenciar [helpful_courtier.GetFirstNameNoTooltip] para ter certeza..."
 fp3_yearly.8026.desc:0 "Longe de meu [ROOT.Char.Custom('ResidenceBuilding')], há um antigo #italic dakhma#!, uma Torre do Silêncio, desmoronando lentamente nos ventos frios das estepes. Aqui, parece que não há olhos curiosos, e junto com [helpful_courtier.GetFirstName], carrego o corpo de [dying_consort.GetTitledFirstName] para seu local de descanso final nos nichos ressequidos. Observo em silêncio enquanto os abutres da estepe descem como uma nuvem negra, e me pergunto, por um momento, de onde vieram - foram enviados pelos deuses antigos ou por [ROOT.Char.GetFaith.DevilName]? Eu nunca saberei.\n\n[helpful_courtier.GetFirstNameNoTooltip] permanece em silêncio, aparentemente afetado pelo clima sombrio."
 fp3_yearly.8026.t:0 "O Dakhma Secreto"
 fp3_yearly.8027.a:0 "Eu lhe darei #italic metade#! dessa quantia - quando eu vir o livro terminado."
 fp3_yearly.8027.b:0 "Isso deve ser um mal-entendido com [former_employer.GetTitledFirstNameNoTooltip]..."
 fp3_yearly.8027.c:0 "Você me toma por um gastador? Vá a outro lugar."
 fp3_yearly.8027.desc:0 "O famoso escritor [snubbed_poet.GetName] teve um desentendimento com seu antigo patrono, [former_employer.GetName].\n\n\"[former_employer.GetSheHe|U] me prometeu novecentos e noventa talentos de ouro\", [snubbed_poet.GetFirstNameNoTooltip] me conta, \"um para cada capítulo no poema épico que preparei há muito tempo em nome [former_employer.GetHerHim]. Eu planejava usá-lo para restaurar os #italic qanats# desmoronados em minha vila natal. Mas quando estava no banho, um mensageiro veio com minha recompensa prometida - mas as moedas eram de #italic prata#! Aborrecido por esta traição, entreguei tudo ao mensageiro, ao dono do banho e a um vendedor de sucos. Agora, preciso de um novo empregador enquanto termino os últimos capítulos, e ouvi dizer que você tem ouro suficiente para igualar a oferta anterior..."
 fp3_yearly.8027.t:0 "Novecentos e Noventa Capítulos de Ouro"
 fp3_yearly.8028.a:0 "Eles são seus, e você deve ficar e me servir."
 fp3_yearly.8028.b:0 "Sim, pegue-os e vá ajudar sua vila."
 fp3_yearly.8028.c:0 "#italic Isso#! é pelo que paguei? Que decepção."
 fp3_yearly.8028.desc:0 "Está concluído\", declara [snubbed_poet.GetName], \"como eu prometi, todos os 990 capítulos, contos épicos do heroísmo persa e maravilhas em eras longínquas. Eu derramei minha alma neste trabalho, e nunca mais farei outro igual. Sou apenas um humilde poeta mortal. No entanto, graças ao seu patrocínio, talvez meu livro possa durar através das eras, e tornar-se um farol de orgulho ressurgente para a Pérsia.\"\n\n\"Agora... você tinha me prometido 495 talentos de ouro?"
 fp3_yearly.8028.t:0 "O Livro dos Reis"
 fp3_yearly.8029.a:0 "Eles são seus, e você deve ficar e me servir."
 fp3_yearly.8029.b:0 "Sim, pegue-os e vá ajudar sua vila."
 fp3_yearly.8029.c:0 "Tanto ouro por #italic isso#!?"
 fp3_yearly.8029.desc:0 "[snubbed_poet.GetName] me entrega seu roteiro, e muitas páginas já estão decoradas com belas miniaturas desenhadas com mão habilidosa. \"Aqui está o livro que prometi a você\", declara [snubbed_poet.GetSheHe] triunfante. \"E com a humilde habilidade que possuo, prometo que não o achará insatisfatório. Conta histórias de heróis como Arash, o Arqueiro, Fereydun, o Matador de Dragões, belas princesas e a antiga glória da Pérsia. Eu até fiz um par de versos ligando sua grande dinastia a tudo isso...\"\n\n\"Agora, falamos algo sobre 495 talentos de ouro?"
 fp3_yearly.8029.t:0 "Um Conto da Antiga Glória"
 fp3_yearly.8030.a:0 "Uma pena que você não possa ver a razão..."
 fp3_yearly.8030.desc:0 "Você me considera um tolo? [snubbed_poet.GetName] gastou minhas riquezas com miseráveis vendedores de rua e depravados anfitriões de #italic hammam#!, e embora [snubbed_poet.GetSheHe] agora alegue que recebeu prata, fui informado por pessoas mais confiáveis do que você que, de fato, era ouro. No entanto, [snubbed_poet.GetSheHe] fugiu com o livro que me foi prometido, para #italic você#!. Que [former_employer.GetFaith.HighGodNameAlternate] te remova do jardim do paraíso!"
 fp3_yearly.8030.opening:0 "[former_employer.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 fp3_yearly.8031.a:0 "Foi um prazer."
 fp3_yearly.8031.desc:0 "Na verdade, acontece que um cortesão ressentido meu me traiu e deu a [snubbed_poet.GetName] menos do que eu havia prometido a [snubbed_poet.GetSheHe]. Obrigado por esclarecer esse mal-entendido entre mim e o poeta, que agora voltará ao meu serviço. Falarei bem de você aos outros governantes deste mundo."
 fp3_yearly.8031.opening:0 "[former_employer.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 fp3_yearly.8032.a:0 "Ai, eu não celebro rituais pagãos."
 fp3_yearly.8032.b:0 "É claro, meu querido."
 fp3_yearly.8032.c:0 "A casa [ROOT.Char.GetDynastyHouseName] é bastante gloriosa, agora que você mencionou..."
 fp3_yearly.8032.d:0 "De fato... a vida é como uma vela breve, facilmente apagada."
 fp3_yearly.8032.desc:0 "À medida que o fim do antigo ano do calendário persa se aproxima, é hora do #italic Frawardigan#, um antigo festival que comemora as almas dos mortos. M[Select_CString( death_enthusiast.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('death_enthusiast'))] [death_enthusiast.GetTitledFirstName] tornou-se visivelmente silencioso e quase desanimado, colocando ofertas de comida para os espíritos ancestrais junto às portas.\n\n\"Você deveria acender as lâmpadas\", [death_enthusiast.GetSheHe] me diz, \"para receber os espíritos #italic fravashi#, pois certamente seus ancestrais estão nos observando agora, além das finas paredes deste mundo material. Pense em [ancestor_1.GetName] e outros poderosos antepassados de sua casa."
 fp3_yearly.8032.t:0 "Os Dez Dias dos Mortos"
 fp3_yearly.8033.a:0 "Devo garantir todo o suprimento de faloodeh do reino, enquanto ainda posso!"
 fp3_yearly.8033.b:0 "Não preciso desse tipo de excesso, nem você."
 fp3_yearly.8033.c:0 "Você está certo. Vou enviar ouro para restaurar as casas de gelo."
 fp3_yearly.8033.d:0 "Da próxima vez, me incomode com um problema #italic real#!"
 fp3_yearly.8033.desc:0 "Antes de todos, m[Select_CString( sorbet_enthusiast.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sorbet_enthusiast'))] [sorbet_enthusiast.GetTitledFirstName], de olhos atentos e apaixonado por doces, notou uma deficiência evidente nas mesas de jantar.\n\n\"Não há #italic faloodeh#!\", [sorbet_enthusiast.GetSheHe] exclama, referindo-se àquele doce gelado com macarrão, xarope e água de rosas que é a delícia de todo persa. \"Chamei o fornecedor\", [sorbet_enthusiast.GetSheHe] continua, \"e me disseram que as casas de gelo #italic yakhchal#! em [yakhchal_county.GetNameNoTier] desabaram em um terremoto. Devemos fazer algo imediatamente, senão toda a corte sofrerá e ficará tão abatida que poderíamos ser confundidos com místicos orientais!"
 fp3_yearly.8033.t:0 "Delícias Congeladas"
 fp3_yearly.8034.a:0 "Vamos facilitar isso - #italic Eu#! ficarei com o ouro."
 fp3_yearly.8034.b:0 "Você deve dar tudo a [greedy_vassal.GetFirstNameNoTooltip]."
 fp3_yearly.8034.c:0 "Um compromisso é necessário - dê ao povo de [hephthalite_hoard_province.GetNameNoTierNoTooltip]."
 fp3_yearly.8034.d:0 "Vou deixar você ficar com ele - mas não esqueça deste favor."
 fp3_yearly.8034.desc:0 "\"Escute, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleTierName]\", [wronged_vassal.GetName] implora diante de mim. \"Há um mês, eu estava fazendo levantamentos de terras ao lado de um rio em [hephthalite_hoard_province.GetNameNoTier], quando encontrei um magnífico tesouro dourado. Pude ver pelos formatos alongados dos crânios dos reis representados nas moedas que o tesouro deve ter sido escondido por um povo huno, talvez os Hefthalitas Imperiais, que governaram minhas terras não muito tempo atrás. Agora, sendo descendente de seu povo, acho que é meu direito reivindicar este tesouro. Mas meu senhor feudal [greedy_vassal.GetTitledFirstName] está contestando isso. [greedy_vassal.GetSheHe|U] está tentando tirar o tesouro de mim, alegando ser seu direito como sucessor a Soberania Hefthalita dessas terras. Por favor, me apoie."
 fp3_yearly.8034.t:0 "O Tesouro dos Hephtalitas"
 fp3_yearly.8035.a:0 "Sim, estou preparado para tentar."
 fp3_yearly.8035.b:0 "Seja o que for, deve ser profano."
 fp3_yearly.8035.c:0 "Prefiro dormir, obrigado."
 fp3_yearly.8035.desc:0 "Enquanto caminho inquieto na noite iluminada pela lua, [sufi_mystic.GetTitledFirstName] junta-se a mim.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\", [sufi_mystic.GetSheHe] diz solenemente, \"gostaria de se aproximar de [ROOT.GetCharacter.GetFaith.HighGodNameAlternate]? Conheci um místico sufista de Coração, que me ensinou a meditação #italic muraqabah#!. O caminho não é fácil, mas por meio dele, você pode purgar seus instintos mortais básicos, revelar conhecimentos ocultos e ascender a estados bem-aventurados de unidade com o [ROOT.Char.GetFaith.ReligiousText] e o universo. Você me permitirá guiá-lo?"
 fp3_yearly.8035.t:0 "O Coração e o Criador"
 fp3_yearly.8036.a:0 "Ficaremos por um momento e investigaremos este lugar."
 fp3_yearly.8036.b:0 "Deixemos este lugar com pressa e encontremos mais guardas..."
 fp3_yearly.8036.c:0 "Acalme-se, [superstitious_councillor.GetFirstNameNoTooltip]. São apenas sombras e poeira."
 fp3_yearly.8036.d:0 "Devo ler uma prece, apenas para ter certeza."
 fp3_yearly.8036.desc:0 "O sol se pôs enquanto cavalgo pela selva fora de [spooky_county.GetNameNoTier], com m[Select_CString( superstitious_councillor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('superstitious_councillor'))] [superstitious_councillor.GetTitledFirstName] em reboque.\n\nÀ luz sombria da lua, chegamos a um lugar que ouvi falar antes. Um vasto labirinto de pedras eretas — irregulares e entreabertas — um local de sepultamento ou local sagrado para um povo esquecido de muito tempo atrás. Mas nas pedras foi esculpida a semelhança de humanos, exceto pela falta de bocas. Esses ídolos ressecados nos encaram friamente enquanto tentamos passar e quase parecem se mover.\n\n\"Não devemos demorar aqui\", [superstitious_councillor.GetFirstNameNoTooltip] diz, tremendo. No entanto, não consigo deixar de me perguntar — quem eram essas pessoas? Será que existem realmente fantasmas?"
 fp3_yearly.8036.t:0 "A Cidade dos Sem Bocas"
 fp3_yearly.8037.a:0 "Chame [persian_polymath.GetSheHe] então, não importa o que [persian_polymath.GetSheHe] custe."
 fp3_yearly.8037.b:0 "Deixe-me em paz."
 fp3_yearly.8037.desc:0 "Enquanto eu vagueio sem rumo à luz do luar, [Select_CString( court_physician.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] se aproxima.\n\n \"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetTitleAsNameNoTooltip]\", [court_physician.GetSheHe] diz, \"Ultimamente você parece bastante melancólico. Não pude deixar de tentar um diagnóstico... Acredito que você esteja sofrendo de acedia, aquele estado miserável de tédio que comumente aflige eremitas e sábios [Select_CString(ROOT.Char.IsFemale,'mulheres','homens')]. Mas há o erudito [persian_polymath.GetName], um médico muito mais competente do que eu. [persian_polymath.GetSheHe|U] recentemente escreveu um livro sobre aflições da mente, e pode ser capaz de tratá-lo.\""
 fp3_yearly.8037.t:0 "Uma Cura para Acedia"
 fp3_yearly.8038.a:0 "Muito bem, vou tentar."
 fp3_yearly.8038.b:0 "#italic Isso#! é o melhor tratamento que você tem? Vou procurar alguém mais..."
 fp3_yearly.8038.desc:0 "Após me observar atentamente desde que chegou [Select_CString( persian_polymath.IsFemale, 'a minha', 'ao meu' )] [ROOT.Char.Custom('GetCourt')], [persian_polymath.GetFirstName] agora tem um diagnóstico.\n\n\"É um excesso de bile negra no cérebro, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleTierName]. Até os antigos compreendiam os conceitos básicos dessa condição, mas meus colegas eruditos de Corasão e Corásmio a estudaram por muito tempo. #italic Malikhulia#! chamamos, e isso o torna infeliz e desanimado. Alguns pacientes tornam-se inapetentes ou imitam o comportamento de animais, mas também podem se tornar propensos à inovação e à inteligência, o que talvez não seja tão infeliz assim.\"\n\n\"Mas eu divago... você tentaria uma dieta de peixe salgado e talos de aipo? A experiência mostrou que pode ser eficaz.\""
 fp3_yearly.8038.t:0 "Bílis Negra"
 fp3_yearly.8039.a:0 "Parece valer a pena tentar."
 fp3_yearly.8039.b:0 "Prefiro manter a fé na minha dieta, vamos mantê-la um pouco mais."
 fp3_yearly.8039.c:0 "Cansado de seus remédios ineficazes. Deixe-me."
 fp3_yearly.8039.desc:0 "[persian_polymath.GetFirstName] está pensativo. \"A dieta que prescrevi parece não ter tido efeito, [ROOT.Char.Custom('FormOfAddressForLiege')]. No entanto, você deve se abster de buscar consolo na lua e nas estrelas, amuletos e tais remédios primitivos, pois não têm efeito. Eu sugeriria o consumo diário de certas ervas medicinais, como talos de funcho, pepinos e incenso. Isso pode neutralizar a bile negra, reequilibrar seus humores e melhorar sua potência espiritual, o que certamente beneficiaria seu governo."
 fp3_yearly.8039.t:0 "Ervas e Humores"
 fp3_yearly.8040.a:0 "Buscarei ensinamentos sufistas."
 fp3_yearly.8040.b:0 "Consultarei [court_chaplain.GetTitledFirstName]."
 fp3_yearly.8040.c:0 "Minha fé nunca vacilou. Quem você pensa que sou?"
 fp3_yearly.8040.d:0 "Isso é inútil, vá e venda suas 'soluções' em outro lugar."
 fp3_yearly.8040.desc:0 "\"Ai de mim, [ROOT.Char.Custom('FormOfAddressForLiege')]\", [persian_polymath.GetFirstName] diz. \"Embora eu ache que tenhamos visto alguma melhoria em seu humor e em sua condição física, ainda não curei sua melancolia. As doenças da mente são inimigas obstinadas. Ainda assim, há remédios a serem tentados. Em meu livro, estipulei que a psique humana é um sistema independente que influencia seu aspecto físico. Devemos melhorar sua potência psíquica, provando ao seu subconsciente que o espírito é eterno, não afetado pela morte. Em termos simples - você deve reafirmar sua fé em [ROOT.GetCharacter.GetFaith.HighGodNameAlternate]."
 fp3_yearly.8040.t:0 "Potência Psíquica"
 fp3_yearly.8041.a:0 "Estou pronto."
 fp3_yearly.8041.b:0 "Prefiro buscar algum outro remédio..."
 fp3_yearly.8041.desc:0 "\"Este seria um caminho difícil\", [sufi_mystic.GetName] declara depois de ter sido informado sobre meus problemas.\n\n\"Os caminhos das ordens sufistas #italic tariqa#! podem trazer grande compreensão sobre o eu e o universo, mas é preciso uma tremenda disciplina para alcançá-lo. Eu mesmo sou apenas um iniciante no caminho. No entanto, minha [ROOT.Char.GetTitleTierName], poderíamos tentar alcançar #italic fana#!, aquele estado de meditação em que você, sendo apenas uma pequena gota d'água no sonho de [ROOT.GetCharacter.GetFaith.HighGodNameAlternate], torna-se consciente do oceano ao seu redor. Acho que isso poderia trazer a você uma nova perspectiva sobre esta breve vida."
 fp3_yearly.8041.t:0 "O Consolo do Silêncio"
 fp3_yearly.8042.a:0 "Os textos serão suficientes."
 fp3_yearly.8042.b:0 "Talvez o [ROOT.Char.GetFaith.HouseOfWorship] seja mais para mim."
 fp3_yearly.8042.c:0 "Parece que você não pode me ajudar afinal."
 fp3_yearly.8042.desc:0 "\"De fato\", m[Select_CString( court_chaplain.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_chaplain'))] [court_chaplain.GetFirstName] diz, \"nossos problemas e vexações nesta vida terrena são coisas passageiras, mas seu espírito persistirá. Embora eu entenda, [ROOT.Char.Custom('FormOfAddressForLiege')], se essa afirmação sozinha não for suficiente para consolá-la.\"\n\n[court_chaplain.GetSheHe|U] desenrola um pergaminho. \"Isso é uma parte do [ROOT.Char.GetFaith.ReligiousText2], transcrito pelos santos [ROOT.Char.Custom('LevyMenWomen')] muito mais sábios que nós. Ele contém descrições vívidas do além e versos que podem conter algumas pistas sobre o significado de tudo isso. Sugiro que você estude-o, muitas vezes, se necessário, até que sua alma esteja em paz. Mas se a leitura não for do seu agrado, você pode visitar o [ROOT.Char.GetFaith.HouseOfWorship], para um diálogo interno com [ROOT.GetCharacter.GetFaith.HighGodName]."
 fp3_yearly.8042.t:0 "O Espírito Imortal"
 fp3_yearly.8043.a:0 "Vou comprar todos os livros que você quiser. Ainda preciso de você."
 fp3_yearly.8043.b:0 "Talvez tenha sido sem esperança desde o início."
 fp3_yearly.8043.desc:0 "[persian_polymath.GetFirstName] me observou por muitas semanas, profundamente pensativo.\n\n\"Infelizmente, estou no meu limite, grande [ROOT.Char.GetTitleTierName]. Empreguei todo o conhecimento e habilidade que possuo, mas como disse antes, doenças da mente são muito difíceis de curar. No entanto, acho que fizemos progresso, pois seus humores parecem estar melhor equilibrados e seu espírito se fortaleceu. Se você for paciente e continuar a consumir quantidades saudáveis de peixe, bem como algumas das ervas que prescrevi, acredito que, se [ROOT.GetCharacter.GetFaith.HighGodNameAlternate] quiser, você ainda pode vencer o #italic malikhulia#!.\"\n\n\"Mas devo partir, pois tenho conhecimento a buscar em outro lugar."
 fp3_yearly.8043.t:0 "Fim dos Remédios"
 fp3_yearly.8044.a:0 "Devo valorizar esse sentimento, pode não durar."
 fp3_yearly.8044.desc:0 "Por tanto tempo, o mundo parecia opaco e triste. Coisas que eu costumava desfrutar pareciam distrações passageiras, carentes de significado ou substância. Meus pensamentos vagueavam por regiões escuras e sombrias, e meus sonhos estavam cheios de medo. No entanto, essa longa despondência começou a desaparecer.\n\nEnquanto contemplo as terras ao meu redor, vejo a luz perfurando as nuvens. Vejo a beleza da terra e todos os seus mistérios. Talvez tenha sido todos os tratamentos que [persian_polymath.GetFirstName] me prescreveu, talvez algo mais. Eu posso nunca saber. Mas algo mudou dentro de mim. Sinto-me completo novamente."
 fp3_yearly.8044.t:0 "A Luz do Mundo"
 fp3_yearly.8045.a:0 "Meu médico provavelmente tem algum remédio..."
 fp3_yearly.8045.b:0 "Pago a você para coletar ouro, #EMP não macacos!#!"
 fp3_yearly.8045.c:0 "Não sei sobre isso..."
 fp3_yearly.8045.desc:0 "Durante um passeio à luz da lua, encontro [Select_CString( buzina_enthusiast.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('buzina_enthusiast'))], [buzina_enthusiast.GetName], embalando um pacote do tamanho de um bebê. Mas as aparências podem enganar — sons estranhos emanam dos embrulhos e o rosto de [buzina_enthusiast.GetNamePossessiveNoTooltip] está cheio de arranhões.\n\n\"Isso não é uma criança, [ROOT.Char.Custom('FormOfAddressForLiege')], mas um macaco\", [buzina_enthusiast.GetSheHe] sussurra. \"Ao coletar impostos para o [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], aceitei-a como pagamento em vez de ouro. Dizem que ela pertencia anteriormente a um grande rei do Oriente que a ensinou a jogar xadrez. Mas, infelizmente, ela adoecera e ficara um tanto... agressiva.\"\n\n[buzina_enthusiast.GetSheHe|U] me entrega o pacote e continua. \"Mas, com certeza, sob seus cuidados, ela logo recuperará a saúde."
 fp3_yearly.8045.t:0 "O Pacote Misterioso"
 fp3_yearly.8046.a:0 "Não poupe despesas."
 fp3_yearly.8046.b:0 "Ela é forte, uma dieta saudável será suficiente."
 fp3_yearly.8046.desc:0 "\"Até onde eu sei\", [court_physician.GetName] diz, \"macacos são descendentes de Gayōmart, o primeiro homem. Sua condição corporal é semelhante à nossa, e talvez sua condição espiritual também. Alguns, ouvi dizer, até conseguem falar!\"\n\n\"Devo ser capaz de curar essa pequena com sua doença, mas o melhor método seria uma mistura de ervas que é cara de se obter. A alternativa seria uma dieta de peixe salgado e incenso...\"\n\n[court_physician.GetSheHe|U] olha para as garras afiadas do macaco com grande preocupação."
 fp3_yearly.8046.t:0 "Remédio para o Macaco"
 fp3_yearly.8047.a:0 "Hora de enviar os convites!"
 fp3_yearly.8047.desc:0 "Meu médico vem até mim segurando o macaco doente que [Select_CString( buzina_enthusiast.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('buzina_enthusiast'))], [buzina_enthusiast.GetName], trouxe para casa anteriormente.\n\n\"Meu lorde, estou feliz em informar que o macaco recuperou seu ânimo pela vida e seu temperamento se suavizou. Embora ela não pareça ser uma #EMP mestre#! do xadrez, certamente foi treinada para jogar o jogo de alguma forma.\"\n\nMesmo que este macaco não seja um mestre no jogo, as pessoas virão de longe para testemunhar tal maravilha de treinamento..."
 fp3_yearly.8047.t:0 "Sentindo-se Melhor"
 fp3_yearly.8050.a:0 "Meu arquiteto [architect.GetFirstNameNoTooltip] pode nos ajudar a economizar algum dinheiro aqui..."
 fp3_yearly.8050.b:0 "Certamente, posso contribuir com parte do meu tesouro para isso."
 fp3_yearly.8050.c:0 "Esses hereges podem deixar seus mortos em uma vala, tanto faz para mim."
 fp3_yearly.8050.d:0 "Isso parece caro. O que funcionava no passado pode funcionar agora também."
 fp3_yearly.8050.t:0 "O Destino dos Mortos"
 fp3_yearly.8050_early_period.desc:0 "\n\n\"No passado, meu sábio [ROOT.Char.GetTitleTierName]\", [dakhma_enthusiast.GetSheHe] começa, \"o costume era deixar os corpos dos mortos expostos na natureza, onde não podiam poluir os três elementos sagrados.\"\n\n\"Mas à medida que os assentamentos cresceram em [dakhma_county.GetNameNoTierNoTooltip], não há mais espaço suficiente, e as pessoas começaram a perturbar acidentalmente os mortos. Devemos construir um #italic dakhma#!, uma Torre do Silêncio, onde os mortos possam ser abrigados com segurança, expostos a cães e aves de rapina, até que apenas poeira reste.\""
 fp3_yearly.8050_late_period.desc:0 "\n\n\"Há muito tempo, meu sábio [ROOT.Char.GetTitleTierName]\", [dakhma_enthusiast.GetSheHe] diz, \"uma pequena #italic dakhma#! foi construída em [dakhma_county.GetNameNoTierNoTooltip], onde os corpos mortos podiam ser expostos aos elementos e às aves de rapina. Mas esta torre é antiga e desmoronando, e há preocupação de que a matéria do cadáver tenha vazado, poluindo os três elementos sagrados.\"\n\n\"O povo local ficaria muito agradecido se os ajudássemos a construir uma nova torre, onde seus mortos possam descansar com segurança.\""
 fp3_yearly.8050_unzoroastrian.desc:0 "Houve reclamações sobre as práticas funerárias de meus súditos zoroastristas no [dakhma_county.GetName], e meu [dakhma_enthusiast.GetCouncilTitle] [dakhma_enthusiast.GetFirstName] parece especialmente preocupado."
 fp3_yearly.8050_zoroastrian.desc:0 "Como [ROOT.Char.GetFaith.GetAdherentNameNoTooltip], temos o dever sagrado de combater a influência de Nasu, o dava da decadência. Meu [dakhma_enthusiast.GetCouncilTitle] [dakhma_enthusiast.GetFirstName] parece bastante preocupado com as notícias que [dakhma_enthusiast.GetSheHe] traz do [dakhma_county.GetName]."
 fp3_yearly.8051.a:0 "Só um raio servirá. Vou encontrá-lo para você."
 fp3_yearly.8051.b:0 "Vamos conseguir um fogo de ourives."
 fp3_yearly.8051.c:0 "Não me preocupo muito com presságios. Uma chama doméstica será suficiente."
 fp3_yearly.8051.t:0 "O Fogo Mais Puro"
 fp3_yearly.8051_chasing_lightning.tt:0 "Você aguardará a próxima tempestade..."
 fp3_yearly.8051_earthquake:0 "apagado quando um terremoto atingiu o templo, quase dividindo o prédio ao meio."
 fp3_yearly.8051_ending.desc:0 "Apesar desse mau presságio, [magi.GetName] não parece se desesperar.\n\n\"Devemos reacender o fogo\", [magi.GetSheHe] declara. \"O mais puro e grandioso de todos os fogos seria #italic Atash Behram#!, o Fogo da Vitória, nascido do raio entre as nuvens. Mas como este é um templo menor, talvez devêssemos nos contentar com #italic Atash Adaran#!, o Fogo dos Fogos, que uma forja de ourives poderia nos fornecer. Ou mesmo o grau mais baixo, o #italic Atash Dadgah#!, que pode ser consagrado de qualquer chama doméstica...\""
 fp3_yearly.8051_gust_of_wind:0 "apagado por uma rajada de vento gelado, que deve ter vindo de alguma fenda oculta nas paredes do templo."
 fp3_yearly.8051_invisible_hand:0 "e bastante misteriosamente apagado, como por uma mão invisível."
 fp3_yearly.8051_islamic_zealots:0 "extinto por fanáticos muçulmanos, que invadiram o templo e o profanaram de maneiras muito criativas."
 fp3_yearly.8051_opening.desc:0 "O fogo sagrado que costumava queimar no templo de [sacred_fire_province.GetName] foi recentemente"
 fp3_yearly.8051_sandstorm:0 "apagado por uma tempestade de areia tão violenta que quebrou as portas do templo."
 fp3_yearly.8051_torrential_rain:0 "apagado por uma chuva torrencial, tão intensa que vazou através das rachaduras no teto do templo e atingiu o fogo abaixo."
 fp3_yearly.8052.a:0 "Deveria apenas levar ao templo um fogo de ourives..."
 fp3_yearly.8052.b:0 "Posso muito bem me contentar com uma chama inferior."
 fp3_yearly.8052.desc:0 "Os [ROOT.Char.GetFaith.AltPriestTermPlural] têm me lembrado constantemente do meu compromisso de encontrar um Fogo da Vitória para o templo em [sacred_fire_province.GetName]. Não que eu tenha esquecido... Enviei exploradores em todas as direções para procurar uma tempestade, em busca de um sinal de [ROOT.GetCharacter.GetFaith.HighGodName]. Mas o raio se mostrou elusivo.\n\nAgora, eu estou do lado de fora de minha [ROOT.Char.Custom('ResidenceBuilding')], enquanto o trovão ribomba ao longe e raios cruzam as nuvens escuras. Meus servos correm por aí, tentando pegar o raio com longas varas, enquanto eu olho para a terra, em busca de qualquer indício de uma chama. Nossos esforços são em vão - as nuvens logo se dissipam, e o raio desaparece nos céus altos.\n\n[ROOT.GetCharacter.GetFaith.HighGodName], isso é verdadeiramente sua vontade? Nunca encontrarei o fogo que procuro?"
 fp3_yearly.8052.t:0 "Perseguindo as Nuvens"
 fp3_yearly.8053.a:0 "Não posso acreditar nisso..."
 fp3_yearly.8053.desc:0 "Dias e semanas se passaram, meus exploradores vasculhando o reino em busca de fogo gerado por raios, sem sucesso. Mas, à medida que começo a ficar desanimado, nuvens escuras surgem no horizonte, um som retumbante de trovão ecoando ao longe. Eu saio apressado de minha [ROOT.Char.Custom('ResidenceBuilding')] em direção à tempestade, com servos ao meu lado, e de fato, ela se aproxima, como se fosse chamada por uma mão invisível.\n\nEntão, bem na minha frente, uma luz brilhante perfura as nuvens e desce como uma lança de [ROOT.Char.GetFaith.DivineRealm], atingindo uma árvore solitária. A madeira seca se inflama imediatamente, queimando com uma chama branca, tão pura quanto os espíritos #italic fravashi#!. Eu encontrei, o Fogo da Vitória. Ele veio até mim!"
 fp3_yearly.8053.t:0 "O Fogo da Vitória"
 fp3_yearly.8888.a:0 "Não, irei falar com eles pessoalmente."
 fp3_yearly.8888.b:0 "Muito bem, [possibly_capable_marshal.GetFirstNameNoTooltip] - leve suas tropas para [nomads_county.GetNameNoTierNoTooltip]."
 fp3_yearly.8888.c:0 "[upset_vassal.GetTitledFirstNameNoTooltip], isso é entre você e [turkic_leader.GetFirstNameNoTooltip]."
 fp3_yearly.8888.desc:0 "[upset_vassal.GetName] me procura, visivelmente chateado.\n\n\"Meu senhor\", [upset_vassal.GetSheHe] declara, \"a tribo [turkic_leader.GetCulture.GetName] liderada por [turkic_leader.GetName] tem roubado todas as terras de pastagem em [nomads_county.GetNameNoTier] e causado problemas para os bons habitantes. Tentei enviar guerreiros #italic ghazi#! para expulsá-los, mas eles simplesmente recuam e se escondem nos ermos, apenas para retornar um mês depois. Você deve me ajudar a expulsar esses bárbaros imundos - de uma vez por todas.\"\n\n\"Posso lidar com eles\", meu [possibly_capable_marshal.GetCouncilTitle] [possibly_capable_marshal.GetFirstName] diz, \"me envie para [nomads_county.GetNameNoTierNoTooltip].\""
 fp3_yearly.8888.t:0 "Uma Ofensa no Pasto"
 fp3_yearly.8889.a:0 "Isso parece razoável."
 fp3_yearly.8889.b:0 "Você não pode ficar aqui, mas venha pastar em [nomads_new_county.GetNameNoTierNoTooltip]."
 fp3_yearly.8889.c:0 "Ai, não pode haver tal acordo."
 fp3_yearly.8889.desc:0 "[turkic_leader.GetName] me recebe com toda a hospitalidade que meu cargo demandaria, oferecendo chá e carne seca de cavalo, e água fresca da primavera. Mas [turkic_leader.GetSheHe] fala de [upset_vassal.GetName] com desdém.\n\n\"[upset_vassal.GetTitledFirstNameNoTooltip] está mentindo\", diz-me o líder nômade, \"há grama suficiente para todos. Deixe meu povo ficar em [nomads_county.GetNameNoTierNoTooltip], e podemos emprestar nossos arcos e espadas para seus exércitos. Eu até irei à sua corte e servirei como seu [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')].\""
 fp3_yearly.8889.t:0 "Grama Suficiente para Todos"
 fp3_yearly.8890.a:0 "Muito bem, deixe seu povo se estabelecer em [nomads_new_county.GetNameNoTierNoTooltip] - e me sirva."
 fp3_yearly.8890.b:0 "Não, sua vida é perdida."
 fp3_yearly.8890.c:0 "Eu só vou mantê-lo como refém, para acalmar sua tribo."
 fp3_yearly.8890.desc_beginning:0 "Arrastado perante mim, o chefe nômade [turkic_leader.GetName] parece bastante desamparado. [turkic_leader.GetSheHe|U] tem poucos aliados aqui, se é que tem algum.\n\n\"Conseguimos emboscar o [turkic_leader.GetCulture.GetName]\", explica [possibly_capable_marshal.GetFirstName], \"e capturar essa [turkic_leader.GetWomanMan] e alguns de seus guerreiros.\"\n\n"
 fp3_yearly.8890.desc_ending:0 "\"De fato\", diz [turkic_leader.GetNameNoTooltip], \"não tenho medo de matar aqueles que vêm com lanças contra mim. Mas minha espada e arco, e os de meus guerreiros, poderiam estar a serviço de você, grande [ROOT.Char.GetTitleTierName], se me deixar ir.\""
 fp3_yearly.8890.t:0 "O Destino de uma [Select_CString(turkic_leader.IsFemale,'Chefe','Chefes')]"
 fp3_yearly.8890_brutal_demands:0 "\"Peguem suas cabeças\", insiste [upset_vassal.GetName], \"pois esses selvagens mataram muitos dos meus súditos.\"\n\n"
 fp3_yearly.8890_nonbrutal_demands:0 "\"Façam-nos prometer que deixarão minhas terras para sempre\", sugere [upset_vassal.GetTitledFirstName], \"mantenham [turkic_leader.GetFirstNameNoTooltip] como refém para garantir sua conformidade.\"\n\n"
