 fp3_frontier_story_cycle.0001.a:0 "O que..."
 fp3_frontier_story_cycle.0001_letter:0 "Estarei enviando a você dois órfãos pobres, cujos pais pereceram pela fome depois que uma horda de [turkic_leader.GetCulture.GetName] deixou seus cavalos pisotearem seus campos e pomares. Como você tem uma queda por nômades selvagens, confio que você também pode se responsabilizar pelas vítimas deles. Que a luz de [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] brilhe sobre o seu reinado."
 fp3_frontier_story_cycle.0001_opening:0 "Meu querido senhor"
 fp3_frontier_story_cycle.0002.a:0 "Um presente excelente. Tudo está perdoado."
 fp3_frontier_story_cycle.0002.b:0 "Não preciso de seus trinkets, nem aceito sua desculpa."
 fp3_frontier_story_cycle.0002_letter:0 "Lamento meu comportamento durante o incidente com os nômades. Eles realmente deixaram [nomads_county.GetNameNoTier], e ouvi dizer que os conflitos entre eles e os agricultores diminuíram. Embora eu ainda insista que você deve levar a sério a ameaça nômade, gostaria de lhe oferecer estas belas moedas de ouro, cunhadas no Império Kushan há muito tempo, como um símbolo do meu respeito."
 fp3_frontier_story_cycle.0002_opening:0 "Grande [ROOT.Char.GetTitleTierName]"
 fp3_frontier_story_cycle.0003.a:0 "Vamos encontrar cada moeda que a sua tribo escondeu."
 fp3_frontier_story_cycle.0003.b:0 "Não, [greedy_chaplain.GetFirstNameNoTooltip] está certo, você deve ser taxado."
 fp3_frontier_story_cycle.0003.c:0 "Muito bem, [turkic_leader.GetFirstNameNoTooltip], isso parece justo."
 fp3_frontier_story_cycle.0003.t:0 "Pagando Sua Parte"
 fp3_frontier_story_cycle.0003_beginning:0 "M[Select_CString( greedy_chaplain.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('greedy_chaplain'))] [greedy_chaplain.GetFirstName] aparentemente passou muito tempo pensando em [turkic_leader.GetName] e na tribo nômade [turkic_leader.GetHerm].\n\n\"Na verdade, [ROOT.Char.Custom('FormOfAddressForLiege')]\", diz [greedy_chaplain.GetFirstNameNoTooltip], \"eles estiveram em minhas orações. Pois eu soube que alguns deles ainda seguem sua fé pagã."
 fp3_frontier_story_cycle.0003_ending:0 "\"Isso não é justo\", protesta [turkic_leader.GetFirstNameNoTooltip]. \"Dediquei cem arqueiros a cavalo ao seu serviço, assim como a mim mesmo. Se você se abstiver de nos taxar dessa maneira, prometo não esquecer o favor.\""
 fp3_frontier_story_cycle.0003_jizya:0 "Deveríamos fazê-los pagar um imposto #italic jizya#! pelo privilégio de manterem seus costumes idólatras.\"\n\n"
 fp3_frontier_story_cycle.0003_not_jizya:0 "Devemos fazer como os muçulmanos costumam fazer e fazê-los pagar um imposto extra, pois certamente você foi generoso o suficiente com eles?\"\n\n"
 fp3_frontier_story_cycle.0004.a:0 "Não se preocupe, eu vou cuidar de vocês."
 fp3_frontier_story_cycle.0004.b:0 "Parece justo que vocês sejam adotados pela tribo de [turkic_leader.GetFirstNamePossessiveNoTooltip]."
 fp3_frontier_story_cycle.0004.c:0 "Vou enviá-los para um mosteiro."
 fp3_frontier_story_cycle.0004.d:0 "Não faço ideia do que [upset_vassal.GetFirstNameNoTooltip] esperava. Vão encontrar um orfanato."
 fp3_frontier_story_cycle.0004.desc:0 "[orphan_girl.GetName] parece realmente miserável, assim como seu pequeno irmão [orphan_boy.GetName], que parece afligido por todo tipo de infortúnio.\n\n\"Por favor, minha [ROOT.Char.GetTitleTierName]\", ela diz com voz trêmula, \"não comemos há uma semana. Posso apenas pedir por um pouco de pão? Não importa se estiver mofado, contanto que você possa poupar...\"\n\nApós mais indagações, ela não parece saber exatamente quem é o culpado pelo infortúnio de sua família. \"Cavaleiros vieram e destruíram nossas colheitas e roubaram nossas ovelhas... então desapareceram. Agora não sei o que acontecerá conosco, mas sinto muito que [upset_vassal.GetTitledFirstName] tenha lhe incomodado com este assunto trivial.\""
 fp3_frontier_story_cycle.0004.t:0 "Órfãos pela [turkic_leader.GetCulture.GetNameNoTooltip]"
 fp3_frontier_story_cycle.0005.a:0 "Posso concordar com isso."
 fp3_frontier_story_cycle.0005.b:0 "Estou farto desta conversa de favores!"
 fp3_frontier_story_cycle.0005.c:0 "Não, obrigado, posso me virar sem eles."
 fp3_frontier_story_cycle.0005.desc:0 "Enquanto pondero estratégias e batalhas, [turkic_leader.GetName] chega com centenas de cavaleiros a reboque.\n\n\"Minha [ROOT.Char.GetTitleTierName]\", [turkic_leader.GetSheHe] diz, curvando-se, \"eu prometi apoiar você, assim como toda a minha tribo. Agora que você está em guerra, podemos oferecer mais duzentos habilidosos arqueiros a cavalo, mas só podemos poupá-los para o conflito atual. Quando as coisas se acalmarem, eles voltarão para suas tendas e suas famílias. Tudo o que pedimos em troca é que você não esqueça deste favor.\""
 fp3_frontier_story_cycle.0005.t:0 "Duzentos Cavaleiros"
 fp3_frontier_story_cycle.0006.a:0 "Você pode ponderar suas habilidades de arquearia... na masmorra."
 fp3_frontier_story_cycle.0006.b:0 "Daqui em diante, a arquearia está proibida ao redor do [ROOT.Char.Custom('ResidenceBuilding')]."
 fp3_frontier_story_cycle.0006.c:0 "Acho que foi a vontade de [ROOT.Char.GetFaith.HighGodNameAlternatePossessive]."
 fp3_frontier_story_cycle.0006.t:0 "Uma Flecha Desgarrada"
 fp3_frontier_story_cycle.0006_beginning:0 "[one_eyed_child.GetName] estava correndo explorando o [ROOT.Char.Custom('ResidenceBuilding')], como [one_eyed_child.GetSheHe] adora fazer, quando o desastre ocorreu. [turkic_leader.GetName] estava praticando tiro com arco com alguns de seus guerreiros, e uma flecha perdida atingiu m[Select_CString( one_eyed_child.IsFemale, 'inha', 'eu' )] selvagem [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('one_eyed_child'))] diretamente no olho."
 fp3_frontier_story_cycle.0006_ending:0 "\"Foi um acidente\", [turkic_leader.GetFirstName] implora. \"Não esteja tão ansiosa para me punir, [ROOT.Char.Custom('FormOfAddressForLiege')]. Se não praticarmos, como defenderemos suas terras?\""
 fp3_frontier_story_cycle.0006_has_court_physician:0 "\"[one_eyed_child.GetSheHe|U] ficará bem, eu acredito\", diz meu médico [scoped_physician.GetFirstName], \"mas, infelizmente, caminhará pela vida com um olho a menos. Permita-me humildemente alertar que você tenha menos flechas voando pelo pátio no futuro?\"\n\n"
 fp3_frontier_story_cycle.0006_no_court_physician:0 "Um médico local chamado às pressas confirmou que [one_eyed_child.GetSheHe] se recuperará, mas o olho está perdido para sempre.\n\n"
 fp3_frontier_story_cycle.0007.a:0 "Ainda assim, o plano de [turkic_leader.GetFirstNamePossessiveNoTooltip] é o melhor."
 fp3_frontier_story_cycle.0007.b:0 "Justo o suficiente, vou lhe dar essa chance."
 fp3_frontier_story_cycle.0007.c:0 "Se apenas esperarmos, os comerciantes voltarão eventualmente."
 fp3_frontier_story_cycle.0007.desc:0 "\"Oh [ROOT.Char.GetTitleTierName]\", m[Select_CString( warmonger_councillor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('warmonger_councillor'))] [warmonger_councillor.GetFirstName] diz, \"os mercadores no [bandits_county.GetName] falam de ataques de bandidos a cavalo. Agora as caravanas desviam daquelas terras, prejudicando nosso comércio na Rota da Seda. Rezo para que você me envie para investigar este assunto.\"\n\n\"Não\", [turkic_leader.GetName] intervém ferozmente, \"posso enviar meus guerreiros para proteger permanentemente as rotas das caravanas - se pudermos pastar nossos cavalos em [bandits_county.GetNameNoTierNoTooltip] daqui para frente. Certamente, seria uma ação melhor?\"\n\nMas [warmonger_councillor.GetFirstNameNoTooltip] protesta. \"Cuidado, [ROOT.Char.Custom('FormOfAddressForLiege')] - os agricultores detestam quando você deixa os nômades vagarem livremente.\""
 fp3_frontier_story_cycle.0007.t:0 "Calamidade de Caravana"
 fp3_frontier_story_cycle.0099.a:0 "Considere-o seu."
 fp3_frontier_story_cycle.0099.b:0 "Você não pegaria o [extra_title_to_grant.GetNameNoTooltip] em vez disso?"
 fp3_frontier_story_cycle.0099.c:0 "Posso lhe conceder [extra_extra_title_to_grant.GetNameNoTierNoTooltip], mas é só isso."
 fp3_frontier_story_cycle.0099.d:0 "Não."
 fp3_frontier_story_cycle.0099.desc:0 "\"Há muito tempo eu o sirvo lealmente, meu senhor feudal, e dou muito apoio à sua causa, a grande custo pessoal.\" [turkic_leader.GetName] parece que [turkic_leader.GetSheHe] esperou por este momento, e não é necessário ser uma [Select_CString(turkic_leader.IsFemale,'sacerdotisa','sacerdote')] para perceber o que está por vir em seguida.\n\n\"Já passou da hora de você me dar a recompensa e a responsabilidade que me são devidas. Conceda-me o [title_to_grant.GetName], para manter perpetuamente, e minha tribo servirá à casa [ROOT.Char.GetDynastyHouseName] por eras. Está longe de ser sua terra mais rica, mas precisa de uma governança mais direta. Honre-me dessa maneira, ou posso levar meus guerreiros para outro lugar.\""
 fp3_frontier_story_cycle.0099.t:0 "Distribuição de [turkic_leader.GetFirstNamePossessiveNoTooltip]"
 fp3_galvanized_heretics_toast:0 "Os hereges estão revigorados"
