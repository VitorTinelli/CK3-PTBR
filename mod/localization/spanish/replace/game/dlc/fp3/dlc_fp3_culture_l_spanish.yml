l_spanish:
 PAM_ORIGINAL_SIN_HARDER_TO_CONVERT_CULTURE_MODIFIER:0 "Penalidade de [core_tenet|E] de [faith|E] local"
 TRADITION_HARDER_TO_CULTURE_CONVERT:0 "Penalidade de [tradition|E] [cultural|E] local"
 asawira:0 "Asawira"
 asawira_flavor:0 "#F As fileiras dos Asawira são compostas por nobres iranianos habilidosos com lança e arco. Agora restaurados como uma força militar, eles estão prontos para atacar os inimigos da Pérsia.#!"
 building_sar_i_sang_mines_01:0 "Mina Antiga de Sar-i Sang"
 building_sar_i_sang_mines_01_desc:0 "$building_type_sar_i_sang_mines_01_desc$"
 building_sar_i_sang_mines_02:0 "Mina Restaurada de Sar-i Sang"
 building_sar_i_sang_mines_02_desc:0 "Os túneis antigos foram expandidos e seguros, e engenheiros foram trazidos para abrir um novo poço, e novas possibilidades."
 building_sar_i_sang_mines_03:0 "Mina de Sar-i Sang Expandida"
 building_sar_i_sang_mines_03_desc:0 "À medida que as operações de mineração crescem, as próprias minas também crescem. Mais entradas são construídas, e o poço antigo fica cada vez mais profundo."
 building_sar_i_sang_mines_04:0 "Complexo de Mineração de Sar-i Sang"
 building_sar_i_sang_mines_04_desc:0 "A extração de pedras de lápis-lazúli atingiu uma escala quase industrial, com milhares de trabalhadores. Esta antiga montanha, uma vez remota, é agora o centro de uma economia vibrante."
 building_type_sar_i_sang_mines_01:0 "Minas de Sar-i Sang"
 building_type_sar_i_sang_mines_01_desc:0 "A principal fonte de lápis-lazúli no mundo, as minas de Sar-i Sang estão ativas desde tempos pré-históricos, e suas pedras azuis podem ser vistas em todas as cortes da antiguidade. Trabalhadores locais se esforçam aqui dia e noite para extrair as cobiçadas pedras azuis."
 cannot_have_tradition_dryland_dwellers:0 "$cannot_combine_tradition_trigger_desc$ #high $tradition_dryland_dwellers_name$#!"
 cannot_have_tradition_futuwaa:0 "$cannot_combine_tradition_trigger_desc$ #high $tradition_futuwaa_name$#!"
 cannot_have_tradition_irrigation_experts:0 "$cannot_combine_tradition_trigger_desc$ #high $tradition_fp3_irrigation_experts_name$#!"
 cannot_have_tradition_roman_legacy:0 "$cannot_combine_tradition_trigger_desc$ #high $tradition_roman_legacy_name$#!"
 cannot_have_tradition_tribe_unity:0 "$cannot_combine_tradition_trigger_desc$ #high $tradition_tribe_unity_name$#!"
 court_scholar_court_position:0 "Erudito da Corte"
 court_scholar_court_position_desc:0 "Representando o corpus intelectual de seu reino, o Erudito da Corte auxilia na descoberta de futuras [innovations|E]."
 culture_not_iranian_desc:0 "A [culture|E] não possui herança iraniana."
 culture_on_eastern_frontier_desc:0 "A [culture|E] não possui #V 20%#! de seus [counties|E] em [GetGeographicalRegion('world_transoxiana').GetName], [GetGeographicalRegion('world_khorasan').GetName] ou [GetGeographicalRegion('world_steppe_tarim').GetName]."
 culture_parameter_can_appoint_court_scholar:0 "Pode nomear o #high $court_scholar_court_position$#! [court_position|E]"
 culture_parameter_characters_are_better_tax_collector:0 "[characters|E] desta [culture|E] desempenham melhor como [tax_collectors|E]."
 culture_parameter_faith_warrior_traits_more_valued:0 "Os [traits|E] [GetTrait('faith_warrior').GetName( GetNullCharacter )] e [GetTrait('order_member').GetName(GetNullCharacter)] são vistos como [prestige_i][prestigious|E]."
 culture_parameter_guardian_education_better_outcomes:0 "[guardians|E] desta cultura têm mais probabilidade de proporcionar melhores [education_traits|E] aos seus [wards|E]"
 culture_parameter_harder_to_convert_county_culture:0 "Mais difícil de [promote_culture|E] em [counties|E] desta [culture|E]"
 culture_parameter_innovative_traits_more_valued:0 "Os [traits|E] [GetTrait('lifestyle_gardener').GetName( GetNullCharacter )], [GetTrait('patient').GetName(GetNullCharacter)] e [GetTrait('scholar').GetName(GetNullCharacter)] conferem um bônus de [tax|E] em Desertos, Terras Secas e Montanhas Desertas."
 culture_parameter_pardoning_gives_prestige:0 "A [interaction|E] #V $pardon_interaction$#! concede [prestige|E]."
 culture_parameter_pragmatic_traits_county_opinion_modifiers:0 "Os [traits|E] [GetTrait('diligent').GetName( GetNullCharacter )] e [GetTrait('shrewd').GetName(GetNullCharacter)] concedem [county_opinion|E]."
 culture_parameter_tribal_elective_enabled:0 "Pode promulgar a [succession_law|E] [GetLaw('tribal_elective_succession_law').GetName]."
 culture_parameter_unlock_maa_tarkhan:0 "Pode recrutar [GetMaA('tarkhan').GetName] como [men_at_arms|E]."
 culture_parameter_unlock_maa_tawashi:0 "Pode recrutar [GetMaA('tawashi').GetName] como [men_at_arms|E]"
 culture_parameter_unlock_maa_zupin_warrior:0 "Pode recrutar [GetMaA('zupin_warrior').GetName] como [men_at_arms|E]."
 culture_parameter_unlock_tax_obligation_deqhan:0 "Pode promulgar a #high $deqhan_special_rights_tax_collector$ #![tax_decree|E]."
 culture_parameter_unlocks_qanat_building:0 "A linha de [buildings|E] #V $building_type_qanats_01$#! pode ser construída em Montanha Desértica, Montanha, Colina, Deserto e [holdings|E] de Terra Seca desta [culture|E]."
 has_no_particular_noble_roots_trigger:0 "É [lowborn|E] ou de uma [dynasty|E] insignificante"
 master_assassin_court_position:0 "Mestre Assassino"
 master_assassin_court_position_desc:0 "Vinculado pela fé ou credo, o Mestre Assassino auxilia seu senhor feudal com abordagens não convencionais para a guerra, espionagem, terror e assassinato."
 not_of_central_asian_heritage_desc:0 "A [culture|E] não tem herança iraniana, tocariana, turca ou mongólica."
 steppe_or_desert_percentage_desc:0 "A [culture|E] não possui #V 30%#! de seus [counties|E] em terreno de Estepes ou Deserto."
 tarkhan:0 "Tarkhans"
 tarkhan_flavor:0 "#F Cavalaria de elite das estepes, a combinação de lança, maça e arco dos Tarkhans pode quebrar quase qualquer defesa.#!"
 tawashi:0 "Tawashi"
 tawashi_flavor:0 "#F Esta força de cavalaria flexível combina espada, lança e arco para defender suas terras montanhosas de intrusos.#!"
 tradition_fp3_beacon_of_learning_desc:0 "Nexo de erudição grega, indiana e árabe, esta cultura se orgulha do avanço científico."
 tradition_fp3_beacon_of_learning_name:0 "Farol do Conhecimento"
 tradition_fp3_enlightened_magnates_desc:0 "Esta cultura tem uma herança célebre de astúcia administrativa e habilidade poética. Um bom governante deve possuir uma mistura gloriosa de ambos - ou procurar conselhos daqueles que a possuem."
 tradition_fp3_enlightened_magnates_name:0 "Magnatas Iluminados"
 tradition_fp3_fierce_independence_desc:0 "Ao longo dos anos, muitos tiranos tentaram suprimir essa cultura. No entanto, por meio de resiliência e conquistas militares, ela sobreviveu."
 tradition_fp3_fierce_independence_name:0 "Independência Feroz"
 tradition_fp3_frontier_warriors_desc:0 "Esta cultura está em constante luta para domar a fronteira selvagem, utilizando uma mistura volátil de soldados de elite, mercenários tribais e voluntários fanáticos."
 tradition_fp3_frontier_warriors_name:0 "Guerreiros da Fronteira"
 tradition_fp3_irrigation_experts_desc:0 "Esta cultura é mestra em tecnologia da água e, por meio da inventividade e esforço comunitário, pode fazer até os desertos mais áridos florescerem."
 tradition_fp3_irrigation_experts_name:0 "Especialistas em Irrigação"
 tradition_fp3_jirga_desc:0 "Os anciãos e líderes desta cultura podem realizar assembleias para resolver disputas de acordo com seu antigo código tribal - e coroar reis da terra."
 tradition_fp3_jirga_name:0 "Jirga"
 tradition_fp3_pragmatic_creed_desc:0 "Os guerreiros desta cultura não estão presos a pompas e enfatizam o valor e a adaptabilidade do soldado comum em detrimento da elite montada tradicional."
 tradition_fp3_pragmatic_creed_name:0 "Credo Pragmático"
 unlock_tax_obligation_deqhan_name:0 "[GetCultureTradition('tradition_fp3_enlightened_magnates').GetName]"
 unlocks_cereal_fields_and_orchards:0 "As linhas de [buildings|E] #V $building_type_cereal_fields_01$#! e #V $building_type_orchards_01$#! podem ser construídas nesta [holding|E]."
 zupin_warrior:0 "Lanceiros Zupin"
 zupin_warrior_flavor:0 "#F Esses guerreiros Daylamitas são uma força altamente flexível, igualmente capazes de formar fortes paredes de escudos e se espalhar para arremessar suas lanças curtas no inimigo.#!"
