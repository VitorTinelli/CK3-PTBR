 fp3_antagonize_character_interaction.recipient_message.01:0 "Você deveria saber que seu próprio senhor feudal, [secondary_recipient.GetTitledFirstName], está tramando contra você às escondidas. Você deveria ter cautela em seu relacionamento com esse ratinho!"
 fp3_antagonize_character_interaction.recipient_message.02:0 "Tenho motivos para acreditar que seu próprio senhor feudal, [secondary_recipient.GetTitledFirstName], está planejando assassiná-lo! Cuidado com [secondary_recipient.GetSheHe], não importa quão amigável possa parecer!"
 fp3_antagonize_character_interaction.recipient_message.03:0 "A palavra entre meus cortesãos é que seu senhor feudal, [secondary_recipient.GetTitledFirstName], está observando você de perto sem o seu conhecimento. Não está claro para mim quais são as intenções [secondary_recipient.GetHerHim], mas eu ficaria atento a [secondary_recipient.GetSheHe]."
 fp3_antagonize_character_interaction.recipient_message.04:0 "Seu [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], fez um tolo de si mesmo recentemente e manchou o bom nome da casa [recipient.GetHouse.GetBaseNameNoTooltip] entre o povo."
 fp3_antagonize_character_interaction.recipient_message.05:0 "Pensei em informar a você que seu senhor feudal, [secondary_recipient.GetTitledFirstName], é secretamente um fantoche de seus cortesãos! Cada vez que [secondary_recipient.GetSheHe] ignorou seus conselhos, foi a pedido da ralé plebeia!"
 fp3_antagonize_character_interaction.recipient_message.06:0 "Você deveria saber que seu [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], fez algumas perguntas #italic perigosas#! sobre a casa [recipient.GetHouse.GetBaseNameNoTooltip]... Esteja atento a esse aviso, mas não conte a ninguém que eu o informei sobre isso!"
 fp3_antagonize_character_interaction.recipient_message.07:0 "Seu [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], está tentando manchar o bom nome da casa [recipient.GetHouse.GetBaseNameNoTooltip], afirmando pelas suas costas que você está roubando gado!"
 fp3_antagonize_character_interaction.recipient_message.08:0 "Seu [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], não para de enviar cartas à minha corte proclamando a \"superioridade\" da casa [recipient.GetHouse.GetBaseNameNoTooltip]. Por favor, faça algo a respeito!"
 fp3_antagonize_character_interaction.recipient_message.09:0 "[secondary_recipient.GetTitledFirstName] está espalhando rumores desagradáveis sobre você e depois alegando que \"era uma brincadeira\" quando descoberto! Pessoas que espalham boatos são terríveis, e elas mancharam seu nome!"
 fp3_antagonize_character_interaction.recipient_message.10:0 "Seu [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], foi aparentemente pego comendo comida do chão como se fosse um cachorro! Na minha humilde opinião, você deveria tratá-lo como tal!"
 fp3_antagonize_character_interaction.recipient_message.11:0 "Fique sabendo que [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], derrotou recentemente uma dúzia de assassinos armados sozinho. [secondary_recipient.GetSheHe|U] não contou a ninguém sobre isso — para não preocupar a corte, mas eu pensei em informar você sobre essa grande conquista para que os feitos [secondary_recipient.GetHerHim] não fiquem sem reconhecimento!"
 fp3_antagonize_character_interaction.recipient_message.12:0 "Você tem sorte de ter um [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] tão bom quanto [secondary_recipient.GetTitledFirstName]. Ouvi dizer que [secondary_recipient.GetSheHe] devolveu recentemente uma grande quantia de ouro a um dos vassalos [secondary_recipient.GetHerHim] ao descobrir que o intendente havia calculado erroneamente o que era devido!"
 fp3_antagonize_character_interaction.recipient_message.13:0 "Você tem um [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] muito gentil. [secondary_recipient.GetTitledFirstName] encontrou-se recentemente com outro membro da [house|E] [secondary_recipient.GetHouse.GetBaseName] e o ajudou a resolver uma disputa que poderia ter prejudicado a reputação de [secondary_recipient.GetFirstName] se feito errado."
 fp3_antagonize_character_interaction.recipient_message.14:0 "Seu [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], é verdadeiramente único — nunca antes vi alguém tão disposto a defender sua [house|E] quanto [secondary_recipient.GetSheHe]. Você foi muito abençoado com um [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] confiável."
 fp3_antagonize_character_interaction.recipient_message.15:0 "[secondary_recipient.GetTitledFirstName] é uma pessoa maravilhosa, você já considerou reavaliar sua concepção sobre [secondary_recipient.GetSheHe]?"
 fp3_antagonize_character_interaction.recipient_message.fallback:0 "Você deveria saber que [secondary_recipient.GetTitledFirstName] é um[Select_CString( secondary_recipient.IsFemale, 'a', '' )] [secondary_recipient.Custom2('InsultNoun', SCOPE.sC('secondary_recipient'))] e deve ser tratado como tal, concorda?"
 fp3_antagonize_character_interaction.success_notif.discovered.tooltip:0 "[secondary_recipient.GetTitledFirstName] rastreou o boato até você!"
 fp3_antagonize_character_interaction.success_notif.discovered:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] sabe!"
 fp3_antagonize_character_interaction.success_notif.negative.desc.alt.alt:0 "O boato não é rastreado até você..."
 fp3_antagonize_character_interaction.success_notif.negative.desc.alt:0 "[actor.GetTitledFirstName] tem espalhado mentiras ultrajantes sobre você, fazendo com que [secondary_recipient.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetTitledFirstName] pense menos de você!\n"
 fp3_antagonize_character_interaction.success_notif.negative.desc:0 "Rumores desagradáveis e mentiras estão por aí, [secondary_recipient.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetTitledFirstName] caiu neles e começou a pensar menos de você!\n"
 fp3_antagonize_character_interaction.success_notif.positive.desc.alt:0 "[actor.GetTitledFirstName] tem espalhado rumores agradáveis sobre você, fazendo com que [secondary_recipient.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetTitledFirstName] pense melhor de você.\n"
 fp3_antagonize_character_interaction.success_notif.positive.desc:0 "Rumores agradáveis sobre você estão em circulação, fazendo com que [secondary_recipient.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetTitledFirstName] pense melhor de você.\n"
