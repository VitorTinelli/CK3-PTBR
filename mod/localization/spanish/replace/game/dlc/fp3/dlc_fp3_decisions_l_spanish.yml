 fp3_embellish_capital_decision.desc:0 "Na grande tradição persa, o trono deve ser envolto por uma cidade esplêndida e próspera. [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] se tornará esse lugar. Que ele evoco o esplendor da Babilônia antes de sua queda!"
