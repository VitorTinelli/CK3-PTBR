 claim_the_imamate_decision_confirm:0 "Abraçar a luz"
 claim_the_imamate_decision_desc:0 "Há muito tempo os [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] languidecem na obscuridade, sem uma liderança devidamente orientada. Mas eu posso reivindicar a #italic Luz da Walayah#! e ser reconhecido como o verdadeiro [ROOT.Char.GetFaith.ReligiousHeadName]."
 claim_the_imamate_decision_name:0 "Reivindicar o [ROOT.Char.GetFaith.ReligiousHeadTitleName]"
