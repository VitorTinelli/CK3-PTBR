 adopt_a_new_faith_for_persia_decision_confirm:0 "Insha'Allah!"
 adopt_a_new_faith_for_persia_decision_desc:0 "O Califa tem um controle total sobre a Pérsia, promovendo uma fé repleta de ortodoxia árabe. Acredito que a região precisa de sua própria identidade, e há muitas opções para escolher..."
 adopt_a_new_faith_for_persia_decision_tooltip:0 "O Califa tem um controle total sobre a Pérsia, promovendo uma fé repleta de ortodoxia árabe. Acredito que a região precisa de sua própria identidade, e há muitas opções para escolher..."
 avenge_the_battle_of_nahrawan_decision_confirm:0 "Morte aos apóstatas!"
 avenge_the_battle_of_nahrawan_decision_desc:0 "Nos primeiros dias de [ROOT.Char.GetFaith.GetReligion.GetName], após serem traídos pelo Califado Rashidun, os Muhakkima foram derrotados de forma vergonhosa na Batalha de Nahrawan. Desde então, lutamos relentlessmente para destruir todos os apóstatas e provar que o julgamento pertence apenas a [ROOT.Char.GetFaith.HighGodNameAlternate]. Eu resolvo encerrar a luta contra os falsos crentes de uma vez por todas."
 avenge_the_battle_of_nahrawan_decision_name:0 "Vingar a Batalha de Nahrawan"
 avenge_the_battle_of_nahrawan_decision_toast:0 "Vitória!"
 avenge_the_battle_of_nahrawan_decision_tooltip:0 "Liderar os [ROOT.Char.GetFaith.GetAdherentNamePlural] para a glória."
 avenge_the_battle_of_nahrawan_shia_caliphate_irrelevant:0 "O Califado Xiita está vago ou destruído"
 avenge_the_battle_of_nahrawan_sunni_caliphate_irrelevant:0 "O Califado Sunita está vago ou destruído"
 babak_fortress_faith_requirements:0 "A [faith|E] em [GetTitleByKey('c_tabriz').GetNameNoTier] considera sua fé [faith_righteous|L] ou [faith_astray|L]"
 choose_alevi_desc:0 "[GetFaithByKey('alevi').GetName]"
 choose_alevi_name:0 "[GetFaithByKey('alevi').GetNameNoTooltip]"
 choose_alevi_tooltip:0 "Uma das muitas coisas boas popularizadas pelas tribos turcas é a [faith|E] [GetFaithByKey('alevi').GetAdjective]. Seu foco no [GetFaithDoctrine('tenet_esotericism').GetBaseName] e na [GetFaithDoctrine('tenet_inner_journey').GetBaseName] fará com que nossos governantes se tornem mais sábios do que nunca, embora sejamos considerados [GetFaithDoctrine('muhammad_succession_zandaqa_doctrine').GetBaseName]."
 choose_azariqa_desc:0 "[GetFaithByKey('azariqa').GetName]"
 choose_azariqa_name:0 "[GetFaithByKey('azariqa').GetNameNoTooltip]"
 choose_azariqa_tooltip:0 "Escolher adotar a [faith|E] indiscutivelmente violenta [GetFaithByKey('azariqa').GetAdjective] é uma ideia radical... mas não se pode negar que um [GetCourtPositionType('master_assassin_court_position').GetName()] seria um grande trunfo contra o Califa [GetFaithDoctrine('muhammad_succession_sunni_doctrine').GetBaseName]."
 choose_imami_desc:0 "[GetFaithByKey('imami').GetName]"
 choose_imami_name:0 "[GetFaithByKey('imami').GetNameNoTooltip]"
 choose_imami_tooltip:0 "Não precisamos mais nos curvar à vontade do Califa [GetFaithDoctrine('muhammad_succession_sunni_doctrine').GetBaseName]! A [faith|E] [GetFaithDoctrine('muhammad_succession_shia_doctrine').GetBaseName] [GetFaithByKey('imami').GetAdjective] nos mostrará o caminho — e, com o tempo, o [GetTitleByKey('d_imami').GetNameNoTier] será restaurado para o bem de toda a Pérsia!"
 choose_maturidi_desc:0 "[GetFaithByKey('maturidi').GetNameNoTooltip]"
 choose_maturidi_name:0 "[GetFaithByKey('maturidi').GetNameNoTooltip]"
 choose_maturidi_tooltip:0 "Embora a [faith|E] [GetFaithByKey('maturidi').GetAdjective] ainda esteja sujeita à doutrina [GetFaithDoctrine('muhammad_succession_sunni_doctrine').GetBaseName] do Califa, sua natureza [GetFaithDoctrine('tenet_adaptive').GetBaseName] nos permitirá controlar melhor as diversas fé que povoam a Pérsia."
 choose_mutazila_desc:0 "[GetFaithByKey('mutazila').GetName]"
 choose_mutazila_name:0 "[GetFaithByKey('mutazila').GetNameNoTooltip]"
 choose_mutazila_tooltip:0 "A [faith|E] [GetFaithByKey('mutazila').GetAdjective] ainda está sujeita à doutrina [GetFaithDoctrine('muhammad_succession_sunni_doctrine').GetBaseName] do Califa, mas como uma escola de pensamento menos ortodoxa e mais racionalista, nos permitirá maior autonomia."
 choose_nizari_desc:0 "[GetFaithByKey('nizari').GetName]"
 choose_nizari_name:0 "[GetFaithByKey('nizari').GetNameNoTooltip]"
 choose_nizari_tooltip:0 "De todas as [faith|E] [GetFaithDoctrine('muhammad_succession_shia_doctrine').GetBaseName], os [GetFaithByKey('nizari').GetAdjective] se destacam como racionalistas e quase fanaticamente dedicados à sua causa. A [GetFaithDoctrine('tenet_fp3_fedayeen').GetBaseName] nos servirá muito bem."
 choose_zayidi_desc:0 "[GetFaithByKey('zayidi').GetName]"
 choose_zayidi_name:0 "[GetFaithByKey('zayidi').GetNameNoTooltip]"
 choose_zayidi_tooltip:0 "A [faith|E] [GetFaithDoctrine('muhammad_succession_shia_doctrine').GetBaseName] [GetFaithByKey('zayidi').GetAdjective] pode ser a escolha certa para a região, sendo [GetFaithDoctrine('doctrine_pluralism_pluralistic').GetBaseName] enquanto ainda é [GetFaithDoctrine('tenet_unrelenting_faith').GetBaseName]. Força na diversidade — não unidade através da servidão califal!"
 choose_zurvanism_desc:0 "[GetFaithByKey('zurvanism').GetName]"
 choose_zurvanism_name:0 "[GetFaithByKey('zurvanism').GetNameNoTooltip]"
 choose_zurvanism_tooltip:0 "Eu vou assumir o manto deixado pelo profeta [GetReligionByKey('zoroastrianism_religion').GetAdjective] [GetFaithByKey('zurvanism').GetAdjective] e promover [GetFaithDoctrine('tenet_islamic_syncretism').GetBaseName] — veremos o retorno das glórias do passado, mas a marca deixada por [GetReligionByKey('islam_religion').GetName] é inexorável e deve ser abraçada. Este é verdadeiramente o caminho #EMP único#! para o futuro da minha amada Pérsia!"
 claim_the_imamate_decision.need_at_least_fifteen_same_faith_counties:0 "Seu [realm|E] possui pelo menos [EmptyScope.ScriptValue('claim_the_imamate_decision_same_faith_greater_county_count')|0] [counties|E] [CHARACTER.GetFaith.GetAdjective]"
