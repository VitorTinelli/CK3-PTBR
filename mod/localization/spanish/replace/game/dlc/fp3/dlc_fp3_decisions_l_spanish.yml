 destroy_the_magi_decision_alternate:0 "Apagar os Fogos Eternos"
 destroy_the_magi_decision_alternate_desc:0 "Há muito tempo [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] foi envolvido em superstições e rituais arcaicos, mantido por sacerdotes ávidos por poder. Chegou a hora de iniciar uma nova era, uma fé para o mundo moderno. Vou encerrar a prática moribunda do culto ao fogo e reformar os [ROOT.Char.GetFaith.random_AltPriestTermPlural] em minhas terras."
 destroy_the_magi_decision_confirm:0 "Já era hora"
 destroy_the_magi_decision_desc:0 "Há muito tempo, as pessoas do campo têm suas próprias práticas e cuidam dos fogos eternos por conta própria. É hora de pôr fim aos rituais complicados e doutrinas hierárquicas do sacerdócio estabelecido, para que o papel do [ROOT.Char.GetFaith.PriestNeuter] esteja disponível para qualquer pessoa que tenha a confiança da comunidade."
