 favour_skilled_outsiders_decision_desc:0 "Há aqueles em minha administração que ocupam posições de comando para as quais têm pouca aptidão — enquanto talentosos subalternos são deixados para definhar sob uma espessa camada de ineptidão e mediocridade, simplesmente porque parecem estranhos à nobreza [ROOT.Char.GetCulture.GetName] como eu.\n\nPor que tantos dos meus melhores súditos não conseguem ascender mais em meu serviço?"
