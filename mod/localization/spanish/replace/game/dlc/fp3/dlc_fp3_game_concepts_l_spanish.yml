l_spanish:
 game_concept_assassin:0 "Assassino"
 game_concept_ending_phase:0 "Fase Final"
 game_concept_ending_phase_desc:0 "Uma $game_concept_ending_phase$ é um tipo especial da [struggle_phase|E] que encerra o [struggle|E] quando é acionada. [characters|E] [Concept('struggle_involved', 'Envolvidos')|E] e [struggle_interloper_interlopers|E] podem progredir para a fase final de maneira normal, usando os [struggle_catalyst_catalysts|E]."
 game_concept_fp3_demand_submission_interaction:0 "$fp3_demand_submission_interaction$"
 game_concept_fp3_demand_submission_interaction_desc:0 "Exija a lealdade de [character_possessive|E] na forma de um [hook|E], usando piedade, astúcia ou intimidação."
 game_concept_fp3_embellish_capital_decision:0 "Decisão de $fp3_embellish_capital_decision_name$"
 game_concept_fp3_embellish_capital_decision_desc:0 "Uma [decision|E] que permite melhorar sua [capital|E] ao custo de um [county|E] recentemente conquistado"
 game_concept_fp3_free_house_member_cb:0 "$fp3_free_house_member_cb_name$"
 game_concept_fp3_free_house_member_cb_desc:0 "Um [casus_belli|E] disponível para [house_heads|E] que força o alvo a libertar cada membro [imprisoned|E] da [house|E]."
 game_concept_fp3_install_loyalist_cb:0 "Instalar um Apoiador"
 game_concept_fp3_install_loyalist_cb_desc:0 "Permite que você inicie uma [war|E] para instalar um [GetTrait('fp3_struggle_supporter').GetName(GetNullCharacter)] do Califado no comando do [realm|E] alvo."
 game_concept_fp3_request_honorary_titles_interaction:0 "$fp3_request_honorary_titles_interaction$"
 game_concept_fp3_request_honorary_titles_interaction_desc:0 "$fp3_request_honorary_titles_interaction_desc$"
 game_concept_fp3_request_house_unity_change_interaction:0 "$fp3_request_house_unity_change_interaction$"
 game_concept_fp3_request_house_unity_change_interaction_desc:0 "$fp3_request_house_unity_change_interaction_desc$"
 game_concept_fp3_request_turkic_invasion_interaction:0 "$fp3_request_turkic_invasion_interaction$"
 game_concept_fp3_request_turkic_invasion_interaction_desc:0 "Financie qualquer [ruler|E] de herança turca para conquistar qualquer um dos governantes vizinhos."
 game_concept_fp3_unify_house_cb:0 "$fp3_unify_house_cb_name$"
 game_concept_fp3_unify_house_cb_desc:0 "Um [casus_belli|E] que permite a um [house_head|E] recuperar membros da [house|E] de outro [realm|E] como [vassal|E]."
 game_concept_kindle_royal_fire_decision:0 "Decisão Acender Fogo Real"
 game_concept_kindle_royal_fire_decision_desc:0 "Uma [decision|E] que permite acender um fogo real, ganhando bônus para [health|E] e [dynasty_prestige|E]."
 game_concept_master_assassin:0 "Mestre Assassino"
 game_concept_master_assassin_desc:0 "O $game_concept_master_assassin$ é uma [court_position|E] ativada por [faiths|E] com o [core_tenet|E] de [GetFaithDoctrine('tenet_fp3_fedayeen').GetBaseName]. O $game_concept_master_assassin$ é um fanático perigoso que trabalha junto com assassinos menores para matar inimigos percebidos da fé."
 game_concept_persian_struggle:0 "Intermezzo Iraniano"
 game_concept_persian_struggle_desc:0 "O $game_concept_persian_struggle$ retrata o declínio tumultuado do Califado Abássida, em que a Mesopotâmia foi devastada por rebeliões, lutas pelo poder, e vários governantes persas afirmaram sua independência.\n\nEmbora os [characters|E] [Concept('struggle_involved', 'Envolvidos')|E] possam ter muitas agendas, a maioria desejará se tornar um [GetTrait('fp3_struggle_supporter').GetName(GetNullCharacter)] e trabalhar para restaurar o poder do Califado, ou um [GetTrait('fp3_struggle_detractor').GetName(GetNullCharacter)] e tentar destruí-lo.\n\nO [struggle|E] alterna entre duas [struggle_phase_phases|E] - [struggle_persia_phase_unrest|E] e [struggle_persia_phase_stabilisation|E]."
 game_concept_research_project:0 "Projeto de Pesquisa"
 game_concept_research_project_desc:0 "Um Projeto de Pesquisa é uma [inspiration|E] que depende da [aptitude|E] de um $court_scholar_court_position$ para trazer benefícios ao seu empregador.\n\nEm alguns casos raros, o Projeto de Pesquisa pode descobrir uma nova [innovation|E]."
 game_concept_research_projects:0 "Projetos de Pesquisa"
 game_concept_struggle_ending_decision:0 "Decisão Final"
 game_concept_struggle_ending_decision_desc:0 "Uma $game_concept_struggle_ending_decision$ é uma [decision|E] única que encerra um [struggle|E]. Tais decisões muitas vezes só estão disponíveis durante [struggle_phase_phases|E] específicas."
 game_concept_struggle_ending_decisions:0 "Decisões Finais"
 game_concept_struggle_persia_phase_concession:0 "Concessão"
 game_concept_struggle_persia_phase_concession_desc:0 "Com o tempo, à medida que as tensões na Pérsia se acalmam e tanto apoiadores quanto detratores do Califado se cansam do derramamento constante de sangue, o [persian_struggle|E] pode chegar ao fim naturalmente: não com um estrondo, mas com um sussurro."
 game_concept_struggle_persia_phase_stabilisation:0 "Estabilização"
 game_concept_struggle_persia_phase_stabilisation_desc:0 "Apesar dos problemas crescentes, o califa ainda comanda respeito. Rebeliões e facções estão recuando, mas os senhores da Pérsia não serão facilmente trazidos à razão.\n\nA tensão pode se transformar em [struggle_persia_phase_unrest|E], o que significaria mais caos pela frente."
 game_concept_struggle_persia_phase_unrest:0 "Inquietação"
 game_concept_struggle_persia_phase_unrest_desc:0 "Açoitado por rebeliões e intrigas, o Califado desmorona. Senhores da guerra ambiciosos e governadores astutos agarram-se ao poder que podem usurpar, brigando constantemente.\n\nCom o tempo, a menos que a situação seja resolvida por uma [ending_phase|E], o reino entrará em uma fase de [struggle_persia_phase_stabilisation|E], à medida que apoiadores desesperados recuperam a autoridade califal."
