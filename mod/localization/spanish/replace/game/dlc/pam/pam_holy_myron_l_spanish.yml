l_spanish:
 pam_anoint_artifact_decision:0 "Ungir um Artefato com o Santo Myron"
 pam_anoint_artifact_decision_confirm:0 "Ungi-lo"
 pam_anoint_artifact_decision_desc:0 "O crisma não deve obediência ao clero. Lâmina, livro ou berloque — o que ele toca torna-se [sanctified|E] para [ROOT.Char.GetFaith.GetName] apenas pelo óleo, e nenhum princípio ou bispo pode contestá-lo."
 pam_anoint_artifact_decision_no_item_selected:0 "Nenhum [artifact|E] selecionado"
 pam_anoint_artifact_decision_tooltip:0 "Gasta uma carga do Santo Myron para marcar um de seus [artifacts|E] como [sanctified|E], independentemente do que suas doutrinas normalmente permitirem"
 pam_anoint_artifact_has_eligible_artifact_tt:0 "Deve possuir um [artifact|E] que ainda não seja [sanctified|E]"
 pam_anoint_artifact_needs_myron_tt:0 "Deve possuir uma #V Ampola de Santo Myron#! com óleo restante"
 pam_anoint_artifact_not_already_chrismated_tt:0 "Ainda não deve ter sido crismado"
 pam_anoint_artifact_not_myron_tt:0 "O Santo Myron não pode ungir a si mesmo"
 pam_anoint_artifact_toast:0 "Artefato Crismado"
 pam_anointed_with_holy_oil_modifier:0 "Ungido com Óleo Santo"
 pam_anointed_with_holy_oil_modifier_desc:0 "Este personagem recebeu a unção dos enfermos: óleo com aroma de [Glossary('balsam','pam_myron_gloss_balsam')] na testa e nas mãos, fortalecendo corpo e alma durante a provação."
 pam_chrismated_artifact_desc:0 "[pam_anointed_artifact.GetDesc]\n\nEle foi ungido com o Santo Myron e brilha fracamente com o óleo sagrado."
 pam_chrismated_artifact_modifier:0 "Crismado"
 pam_chrismated_artifact_modifier_desc:0 "Este artefato foi ungido com o Santo Myron, e o aroma de [Glossary('myrrh','pam_myron_gloss_myrrh')] ainda permanece nele."
 pam_chrismated_artifact_name:0 "[pam_anointed_artifact.GetNameNoTooltip] Crismado"
 pam_chrismated_child_modifier:0 "Crismado"
 pam_chrismated_child_modifier_desc:0 "Este personagem foi crismado logo após o nascimento, selado com o dom do Espírito Santo em óleo abençoado."
 pam_chrismated_regalia_desc:0 "[pam_regnal_artifact.GetDesc]\n\nEm uma coroação, foi tocado com o Santo Myron e ainda carrega a bênção."
 pam_chrismated_regalia_modifier:0 "Regália Crismada"
 pam_chrismated_regalia_modifier_desc:0 "Este artefato foi tocado com o Santo Myron em uma coroação, e a bênção não desapareceu."
 pam_give_holy_myron_interaction:0 "Presentear o Santo Myron"
 pam_give_holy_myron_interaction_desc:0 "Encha uma ampola nova com o seu próprio Santo Myron e presenteie [recipient.GetShortUIName]. Seu receptáculo perde uma carga; você ganha [piety|E] e a gratidão de [recipient.GetShortUINamePossessive]."
 pam_give_holy_myron_recipient_toast:0 "Um Presente de Santo Myron"
 pam_give_holy_myron_recipient_tt:0 "Você recebe uma Ampola de [common|E] de Santo Myron [artifact|E] com uma carga"
 pam_holy_myron.0011.a:0 "Que o resto da estrada seja rápido."
 pam_holy_myron.0011.desc_arabia:0 "A rota do incenso era longa e os poços poucos, mas Dhofar nos rendeu nosso prêmio: [Glossary('frankincense','pam_myron_gloss_frankincense')] pálido como geada e [Glossary('myrrh','pam_myron_gloss_myrrh')] da cor de sangue seco. Os mestres da caravana juram que nenhuma resina mais fina passa por nenhum porto do mundo. Eu acreditei neles e paguei de acordo."
 pam_holy_myron.0011.desc_india:0 "A travessia marítima testou todas as almas a bordo, mas os mercados da costa de Malabar nos recompensaram: [Glossary('spikenard','pam_myron_gloss_spikenard')] das altas montanhas e o [Glossary('cinnamon','pam_myron_gloss_cinnamon')] mais doce que já provei. O último dos ingredientes está garantido. Nós navegamos para casa."
 pam_holy_myron.0011.desc_levant:0 "Escrevo das margens do Mar Salgado, onde o [Glossary('bálsamo da Judeia','pam_myron_gloss_balsam')] chora da casca sulcada como lágrimas douradas. Os produtores fazem um acordo difícil, mas a resina é verdadeira — uma gota no pulso perfuma uma sala inteira. O primeiro dos ingredientes está garantido."
 pam_holy_myron.0011.opening:0 "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U],"
 pam_holy_myron.0012.a:0 "Pague-os. O crisma vale mais do que moedas."
 pam_holy_myron.0012.b.tt:0 "Os bálsamos reunidos serão saqueados, e o lote final do Santo Myron será de qualidade #N inferior#!"
 pam_holy_myron.0012.b:0 "As moedas da Igreja não são para bandidos."
 pam_holy_myron.0012.desc:0 "Bandidos armados barram a passagem à frente e se chamam de cobradores de pedágio, embora nenhuma coroa jamais tenha concedido esse direito. Eles contaram nossos baús e sabem o seu valor; por um preço, podemos passar sem ser saqueados.\n\nAguardo sua resposta e mantenha os bálsamos por perto."
 pam_holy_myron.0012.opening:0 "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U], o infortúnio atinge,"
 pam_holy_myron.0013.a:0 "Vou rezar por [myron_chaplain.GetHerHim]."
 pam_holy_myron.0013.desc:0 "Uma febre me pegou no caminho. Meus dedos tremem enquanto escrevo, e a esposa do estalajadeiro jura por um remédio diferente a cada dia, cada um mais fétido que o anterior. Não tema pelos bálsamos — eles estão lacrados e melhor guardados do que eu. Eu cavalgo assim que puder montar a cavalo."
 pam_holy_myron.0013.opening:0 "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U],"
 pam_holy_myron.0020.a:0 "Que [ROOT.Char.GetFaith.HighGodName] descanse [myron_chaplain.GetHerHim]."
 pam_holy_myron.0020.desc:0 "Um comerciante escreve para me dizer que [myron_chaplain.GetTitledFirstName], a quem mandei buscar os ingredientes do Santo Myron, morreu em uma terra estranha. Os bálsamos estão perdidos entre estranhos, e minha prata e meus trabalhos [myron_chaplain.GetHerHis] não renderão nenhum crisma."
 pam_holy_myron.0020.t:0 "A Jornada Termina"
 pam_holy_myron.0100.a:0 "A corrente da bênção permanece inquebrável."
 pam_holy_myron.0100.desc.intro:0 "Um [myron_chaplain.GetTitledFirstName] gasto pela estrada retorna a mim finalmente, e minha corte consegue sentir o cheiro da carga desde o portão. Com as portas fechadas, o óleo é misturado e uma gota do myron antigo é dobrada no novo, um costume inquebrável desde os Apóstolos.\n\n"
 pam_holy_myron.0100.desc_full:0 "Cada ingrediente sobreviveu à jornada. Dourado e perfumado, o crisma acabado é derramado na ampola e colocado no meu altar."
 pam_holy_myron.0100.desc_robbed:0 "Muito foi perdido na jornada e a mistura é mais rala do que eu esperava — mas a consagração restaura o que a jornada diminuiu, e a ampola é colocada no meu altar mesmo assim."
 pam_holy_myron.0100.t:0 "A Consagração do Myron"
 pam_holy_myron.0200.a.saint_tt:0 "#V [deceased.GetFirstNameNoTooltip]#! será visto com mais favor ao ser considerado para a santidade"
 pam_holy_myron.0200.a:0 "Deixe [deceased.GetFirstNameNoTooltip] ir ungido."
 pam_holy_myron.0200.b.tt:0 "Você administra o crisma sagrado para aqueles que ele ainda pode abençoar"
 pam_holy_myron.0200.b:0 "O crisma é para os vivos."
 pam_holy_myron.0200.desc:0 "Os enlutados se afastam enquanto me aproximo do esquife com o [pam_holy_myron_artifact.GetName]. Sob os olhos da corte reunida, uma cruz de crisma sagrado na testa enviaria [deceased.GetTitledFirstName] para o trono de [ROOT.Char.GetFaith.HighGodName] como um dos ungidos, uma honra que todos os presentes testemunhariam e recontariam. Mas cada gota que gasto nos mortos é uma gota que os vivos nunca verão."
 pam_holy_myron.0200.t:0 "Uma Ungimento Final"
 pam_holy_myron.0300.a:0 "O óleo abençoado da igreja é suficiente."
 pam_holy_myron.0300.b:0 "Nada menos do que o Santo Myron servirá."
 pam_holy_myron.0300.desc:0 "Meu [child.Custom('GetDaughterSon')] [child.GetFirstName] uiva contra o peito do [myron_officiant.GetFaith.PriestNeuter] enquanto o crisma é trazido à frente.\n\nA igreja tem óleo abençoado de sobra para qualquer recém-nascido — mas minha ampola de Santo Myron está à mão, e uma gota brilhante dele selaria esta criança por toda a vida."
 pam_holy_myron.0300.desc_twin:0 "\n\nE não apenas uma testa, mas duas — [pam_myron_twin.GetFirstName] está envolto junto com [pam_myron_twin.GetHerHis] gêmeo, aguardando o mesmo selo."
 pam_holy_myron.0300.t:0 "O Selo do Espírito"
 pam_holy_myron_artifact_desc_charged_common:0 "$pam_holy_myron_artifact_desc_common$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_famed:0 "$pam_holy_myron_artifact_desc_famed$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_illustrious:0 "$pam_holy_myron_artifact_desc_illustrious$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_masterwork:0 "$pam_holy_myron_artifact_desc_masterwork$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_common:0 "Um vaso tampado de crisma consagrado: [Glossary('bálsamo da Judeia','pam_myron_gloss_balsam')] macerado em azeite puro, com uma gota do lote anterior dobrada no novo, para que a corrente da bênção corra inquebrável de volta aos Apóstolos."
 pam_holy_myron_artifact_desc_famed:0 "Um vaso tampado de crisma consagrado: [Glossary('bálsamo da Judeia','pam_myron_gloss_balsam')], [Glossary('frankincense','pam_myron_gloss_frankincense')], [Glossary('myrrh','pam_myron_gloss_myrrh')], [Glossary('spikenard','pam_myron_gloss_spikenard')] e [Glossary('cinnamon','pam_myron_gloss_cinnamon')] macerados em azeite puro, com uma gota do lote anterior dobrada no novo, para que a corrente da bênção corra inquebrável de volta aos Apóstolos."
 pam_holy_myron_artifact_desc_illustrious:0 "Um vaso tampado de crisma consagrado, misturado em perfeita fé com as receitas mais antigas: [Glossary('bálsamo da Judeia','pam_myron_gloss_balsam')], [Glossary('frankincense','pam_myron_gloss_frankincense')], [Glossary('myrrh','pam_myron_gloss_myrrh')], [Glossary('spikenard','pam_myron_gloss_spikenard')], [Glossary('cinnamon','pam_myron_gloss_cinnamon')], [Glossary('calamus','pam_myron_gloss_calamus')] e [Glossary('cassia','pam_myron_gloss_cassia')] macerados em azeite puro, com uma gota do lote anterior dobrada no novo, para que a corrente da bênção corra inquebrável de volta aos Apóstolos."
 pam_holy_myron_artifact_desc_masterwork:0 "Um vaso tampado de crisma consagrado: [Glossary('bálsamo da Judeia','pam_myron_gloss_balsam')], [Glossary('frankincense','pam_myron_gloss_frankincense')] e [Glossary('myrrh','pam_myron_gloss_myrrh')] macerados em azeite puro, com uma gota do lote anterior dobrada no novo, para que a corrente da bênção corra inquebrável de volta aos Apóstolos."
 pam_holy_myron_artifact_name:0 "Ampola de Santo Myron"
 pam_holy_myron_charges_line:0 "Unções restantes: #V [pam_myron_vessel.MakeScope.Var('pam_holy_myron_charges').GetValue|V0]#!"
 pam_holy_myron_chrismation_toast:0 "Crismação do Recém-Nascido"
 pam_holy_myron_coronation_memory:0 "foi ungido com o Santo Myron"
 pam_holy_myron_coronation_memory_desc:0 "Na minha coroação, [anointer.GetTitledFirstName] me ungiu com o próprio crisma sagrado."
 pam_holy_myron_coronation_memory_desc_second_perspective:0 "na sua coroação, [anointer.GetTitledFirstName] ungiu você com o próprio crisma sagrado."
 pam_holy_myron_coronation_memory_desc_third_perspective:0 "[owner.GetTitledFirstName] foi ungido com o próprio crisma sagrado na coroação de [owner.GetHerHis]."
 pam_holy_myron_coronation_option.flavor:0 "Gaste uma carga do crisma sagrado em sua própria unção."
 pam_holy_myron_coronation_option:0 "Deixe o Santo Myron selar esta coroa."
 pam_holy_myron_journey_abandoned_toast:0 "A Expedição ao Santo Myron Foi Abandonada"
 pam_holy_myron_pilgrim_modifier:0 "Portador dos Bálsamos"
 pam_holy_myron_pilgrim_modifier_desc:0 "Este personagem viaja em busca dos ingredientes do Santo Myron — [Glossary('balsam','pam_myron_gloss_balsam')], [Glossary('frankincense','pam_myron_gloss_frankincense')] e coisas mais raras — e não arrisca nada na estrada."
 pam_holy_myron_spend_last_tt:0 "A #N última#! carga da sua Ampola de Santo Myron foi gasta — o vaso esvaziado será #N perdido#!"
 pam_holy_myron_spend_tt:0 "Uma carga da sua Âmpola de Santo Myron foi gasta"
 pam_holy_myron_unction_toast:0 "A Unção dos Enfermos"
 pam_holy_myron_vessel_modifier:0 "Vaso do Santo Myron"
 pam_holy_myron_vessel_modifier_desc:0 "Este vaso contém crisma consagrado, e o aroma de [Glossary('bálsamo da Judeia','pam_myron_gloss_balsam')] santifica o seu guardião."
 pam_holy_myron_vessel_potent_modifier:0 "Vaso de Santo Myron Potente"
 pam_holy_myron_vessel_potent_modifier_desc:0 "Este vaso contém crisma de rara potência, rico em [Glossary('frankincense','pam_myron_gloss_frankincense')] e [Glossary('spikenard','pam_myron_gloss_spikenard')], e a fragrância por si só atesta a santidade."
 pam_holy_myron_vessel_spent_toast:0 "A Âmpola Seca"
 pam_holy_myron_vessel_spent_tt:0 "Com a sua última medida de crisma vertida, o vaso é retirado de uso"
 pam_myron_arabia_journey_tooltip:0 "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_myron_chrismated_child_modifier:0 "Crisamado com o Santo Myron"
 pam_myron_chrismated_child_modifier_desc:0 "Este personagem foi crisamado logo após o nascimento com o próprio Santo Myron — [Glossary('bálsamo da Judeia','pam_myron_gloss_balsam')] sobre a testa recém-nascida — uma unção que nunca desvanecerá."
 pam_myron_gloss_balsam:0 "O famoso bálsamo da Judeia: uma resina perfumada chorada por um arbusto baixo cultivado em Jericó e En-Gedi, junto ao Mar Morto, gota a gota o perfume mais custoso do mundo antigo. É o coração do crisma, e seus bosques zelosamente guardados não crescem em nenhum outro lugar."
 pam_myron_gloss_calamus:0 "A cana doce das Escrituras: uma cana aromática colhida em pântanos do Extremo Oriente, nomeada no Livro do Êxodo entre os ingredientes do óleo sagrado da unção."
 pam_myron_gloss_cassia:0 "Um primo mais rústico da canela, retirado da casca de árvores do Extremo Oriente e listado no Livro do Êxodo entre os ingredientes do óleo sagrado da unção."
 pam_myron_gloss_cinnamon:0 "A casca interna doce de árvores da Índia e das ilhas além, listada no Livro do Êxodo entre os ingredientes do óleo sagrado da unção. Ela viaja a extensão do mundo conhecido até qualquer altar cristão."
 pam_myron_gloss_frankincense:0 "Uma resina dourada extraída das árvores retorcidas do sul da Arábia, e de quase nenhuma outra terra. Queimada em altares desde tempos imemoriais, ela adoaça o crisma enquanto sua fumaça eleva a prece."
 pam_myron_gloss_myrrh:0 "Uma resina amarga e escura como o sangue, sangrada das árvores espinhosas do sul da Arábia e do Chifre da África. Listada no Livro do Êxodo entre os ingredientes do óleo sagrado da unção, era a dádiva dos Magos ao Menino Jesus e a oferenda dos fiéis para o Seu sepulcro."
 pam_myron_gloss_spikenard:0 "Um óleo pesado e doce espremido das raízes de uma planta das altas montanhas orientais, trazido para os portos da Índia. Com tal nardo o Senhor foi ungido em Betânia, a um custo que escandalizou os discípulos."
 pam_myron_india_journey_tooltip:0 "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_myron_levant_journey_tooltip:0 "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_prepare_holy_myron_decision:0 "Preparar o Santo Myron"
 pam_prepare_holy_myron_decision_afford_arabia_tt:0 "Você deve poder arcar com [gold_i][GetPlayer.MakeScope.ScriptValue('major_gold_value')|0V] [gold|E]"
 pam_prepare_holy_myron_decision_afford_india_tt:0 "Você deve poder arcar com [gold_i][GetPlayer.MakeScope.ScriptValue('pam_holy_myron_india_journey_gold_value')|0V] [gold|E]"
 pam_prepare_holy_myron_decision_already_owned:0 "Você não deve possuir já uma Âmpola de Santo Myron"
 pam_prepare_holy_myron_decision_arabia_desc:0 "Seu [court_chaplain|E] recolhe [Glossary('balsam','pam_myron_gloss_balsam')] em #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, e [Glossary('frankincense','pam_myron_gloss_frankincense')] e [Glossary('myrrh','pam_myron_gloss_myrrh')] em #V [GetTitleByKey('c_dhofar').GetNameNoTier]#! — um par de paragens na rota do incenso.\n\nRende uma Âmpola de Santo Myron [masterwork|E]."
 pam_prepare_holy_myron_decision_arabia_effect_tt:0 "Seu [court_chaplain|E] parte rumo a #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#! e #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!. No seu regresso, uma Âmpola de Santo Myron [masterwork|E] será consagrada — bandidos ou infortúnios na estrada poderão diminuir o lote"
 pam_prepare_holy_myron_decision_arabia_name:0 "Bálsamo e Incenso"
 pam_prepare_holy_myron_decision_confirm:0 "Enviar a expedição"
 pam_prepare_holy_myron_decision_desc:0 "O crisma sagrado não pode ser misturado com restos de cozinha. As Escrituras nomeiam seus ingredientes — [Glossary('myrrh','pam_myron_gloss_myrrh')], [Glossary('cinnamon','pam_myron_gloss_cinnamon')] doce, [Glossary('calamus','pam_myron_gloss_calamus')] e [Glossary('cassia','pam_myron_gloss_cassia')] em azeite puro — e cada um deve ser buscado na terra que o produz.\n\nQuanto mais longe a expedição se estende, mais rica é a mistura trazida de volta para a consagração. Mas o caminho é longo e raramente clementes; bandidos e febres podem diluir o lote ou reclamar seu portador."
 pam_prepare_holy_myron_decision_india_desc:0 "Seu [court_chaplain|E] recolhe [Glossary('balsam','pam_myron_gloss_balsam')] em #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, [Glossary('frankincense','pam_myron_gloss_frankincense')] e [Glossary('myrrh','pam_myron_gloss_myrrh')] em #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!, e [Glossary('spikenard','pam_myron_gloss_spikenard')] e [Glossary('cinnamon','pam_myron_gloss_cinnamon')] em #V [GetTitleByKey('c_kerala').GetNameNoTier]#!, uma longa jornada.\n\nRende uma Âmpola de Santo Myron [famed|E]. Se o seu [court_chaplain|E] seguir as antigas receitas fielmente — uma chance de #V [ROOT.Char.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0]%#!, escalando com [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetHerHis] [learning|E] —, o lote será [illustrious|E] em vez disso."
 pam_prepare_holy_myron_decision_india_effect_tt:0 "Seu [court_chaplain|E] parte rumo a #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, #V [GetTitleByKey('c_dhofar').GetNameNoTier]#! e #V [GetTitleByKey('c_kerala').GetNameNoTier]#!. No seu regresso, uma Âmpola de Santo Myron [famed|E] será consagrada, com uma chance de #V [GetPlayer.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0]%#! de ser uma [illustrious|E] — bandidos ou infortúnios na estrada poderão diminuir o lote"
 pam_prepare_holy_myron_decision_india_name:0 "Cada Ingrediente Sagrado"
 pam_prepare_holy_myron_decision_journey_underway:0 "Seu [court_chaplain|E] já está recolhendo os bálsamos"
 pam_prepare_holy_myron_decision_levant_desc:0 "Seu [court_chaplain|E] recolhe [Glossary('bálsamo da Judeia','pam_myron_gloss_balsam')] em #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#! — um único destino e a mistura mais simples.\n\nRende uma Âmpola de Santo Myron [common|E]."
 pam_prepare_holy_myron_decision_levant_effect_tt:0 "Seu [court_chaplain|E] parte rumo a #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!. No seu regresso, uma Âmpola de Santo Myron [common|E] será consagrada — se a estrada for clemente"
 pam_prepare_holy_myron_decision_levant_name:0 "O Bálsamo da Judeia"
 pam_prepare_holy_myron_decision_needs_chaplain:0 "Seu [court_chaplain|E] deve ser um adulto disponível que não esteja a viajar"
 pam_prepare_holy_myron_decision_tooltip:0 "Envie seu [court_chaplain|E] para recolher bálsamos raros e consagrar uma Âmpola de Santo Myron #V #!, um [artifact|E] cujas cargas são gastas em unções sagradas"
 pam_prepare_holy_myron_journey_toast:0 "A Expedição pelo Santo Myron Partiu"
 pam_prepare_holy_myron_journey_toast_tt:0 "Seu [court_chaplain|E] parte para recolher os ingredientes do Santo Myron"
