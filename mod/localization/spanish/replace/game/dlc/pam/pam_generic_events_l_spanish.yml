l_spanish:
 JAMES_4_8_GLOSS:0 "#weak Tiago 4:8, NRSVUE#!"
 JOHN_14_2_GLOSS:0 "#weak João 14:2, NRSVUE#!"
 PAM_GENERIC_0005_MURDER_BONUS:0 "Um vassalo leal tem homens no domínio deste alvo: $VALUE|+0=$"
 friend_comforted_child_doubts:0 "[CHARACTER.GetShortUIName|U] confortou [TARGET_CHARACTER.GetShortUIName] quando [TARGET_CHARACTER.GetSheHe] duvidou de [TARGET_CHARACTER.GetHerHis] própria bondade."
 friend_comforted_child_doubts_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] confortou [CHARACTER.GetShortUIName] quando [CHARACTER.GetSheHe] duvidou de [CHARACTER.GetHerHis] própria bondade."
 friend_comforted_hell_nightmare_reason:0 "[CHARACTER.GetShortUIName|U] buscou conforto de [TARGET_CHARACTER.GetShortUIName] após um pesadelo de condenação."
 friend_comforted_hell_nightmare_reason_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] buscou conforto de [CHARACTER.GetShortUIName] após um pesadelo de condenação."
 friend_praised_hunting_reason:0 "[CHARACTER.GetShortUIName|U] elogiou a habilidade de [TARGET_CHARACTER.GetShortUINamePossessive] na caça."
 friend_praised_hunting_reason_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] elogiou a habilidade de [CHARACTER.GetShortUINamePossessive] na caça."
 lover_promised_to_change_ways:0 "[CHARACTER.GetShortUIName|U] prometeu a [TARGET_CHARACTER.GetShortUIName] emendar [CHARACTER.GetHerHis] caminhos e partir em peregrinação."
 lover_promised_to_change_ways_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] prometeu a [CHARACTER.GetShortUIName] emendar [TARGET_CHARACTER.GetHerHis] caminhos e partir em peregrinação."
 pam_generic_events.0001.a:0 "Um esforço meritório."
 pam_generic_events.0001.b:0 "Governar já exige toda a minha atenção."
 pam_generic_events.0001.desc:0 "Meu [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] parece imerso em leituras quando entro no [ROOT.Char.GetFaith.HouseOfWorship].\n\n\"Ah, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [chaplain.GetSheHe] finalmente parece me notar. \"Seu interesse pela palavra de [ROOT.Char.GetFaith.HighGodName] está crescendo? Posso lhe ensinar os caminhos.\""
 pam_generic_events.0001.t:0 "Estudioso da Fé"
 pam_generic_events.0002.a:0 "Livre-se do que te envergonha."
 pam_generic_events.0002.b:0 "Você já é amado."
 pam_generic_events.0002.c:0 "Então vamos rezar."
 pam_generic_events.0002.desc.intro:0 "Meu [ROOT.Char.Custom2( 'RelationToMeShort', doubting_child )], [doubting_child.GetFirstName], entra sorrateiramente em meus aposentos muito depois de as velas terem sido apagadas. Lágrimas sulcam [doubting_child.GetHerHis] bochechas.\n\n\"Sou uma boa pessoa?\" [doubting_child.GetSheHe] sussurra. \"Se o que sou é um pecado..."
 pam_generic_events.0002.desc.outro:0 "como [ROOT.Char.GetFaith.HighGodName] ainda pode me querer?\""
 pam_generic_events.0002.desc.sin:0 "tão #EMP repugnantemente#! [sinful_trait.GetName( ROOT.Char )|l]..."
 pam_generic_events.0002.desc.sp:0 "se minha alma parece tão vazia..."
 pam_generic_events.0002.t:0 "Sou Bom?"
 pam_generic_events.0003.a:0 "Por você? Farei reparação."
 pam_generic_events.0003.b:0 "É assim que [ROOT.Char.GetFaith.HighGodName] me fez."
 pam_generic_events.0003.c:0 "Você se preocupa demais."
 pam_generic_events.0003.desc:0 "Meu [ROOT.Char.Custom2( 'RelationToMeShort', worried_spouse )], [worried_spouse.GetFirstName], espera entre as sebes após o anoitecer. [worried_spouse.GetHerHis|U] mãos se contorcem em [worried_spouse.GetHerHis] colo.\n\n\"Você é tão #EMP [sinful_trait.GetName( ROOT.Char )|l]#!,\" [worried_spouse.GetSheHe] diz, com voz baixa. \"Isso envergonha a nós dois perante [ROOT.Char.GetFaith.HighGodName]. Como pode ser tão descuidado com sua fé? Não vê o que isso está fazendo com você?\""
 pam_generic_events.0003.t:0 "O Que Você É"
 pam_generic_events.0004.a:0 "Fui eu! #EMP Eu#! fiz isso!"
 pam_generic_events.0004.b:0 "[Glossary('$pam_john_14_2_english|q$','JOHN_14_2_GLOSS')]"
 pam_generic_events.0004.c:0 "Então vamos rezar."
 pam_generic_events.0004.d:0 "Venha. Beberemos à memória deles."
 pam_generic_events.0004.desc:0 "As velas tremeluzem no [ROOT.Char.GetFaith.HouseOfWorship] vazio por meu [ROOT.Char.Custom2( 'RelationToMeShort', deceased )], [deceased.GetFirstName], que [deceased.GetDeathReasonHideKiller].\n\nMeu [ROOT.Char.Custom2( 'RelationToMeShort', comforter )], [comforter.GetFirstName], está tão perto que [comforter.GetHerHis] manga roça na minha. \"O luto é uma estrada,\" [comforter.GetSheHe] diz suavemente. \"Trilhe-a, e ela ainda poderá levá-lo a [ROOT.Char.GetFaith.PositiveAfterLife].\""
 pam_generic_events.0004.t:0 "Uma Luz na Escuridão"
 pam_generic_events.0005.a.tt:0 "[loyal_vassal.GetTitledFirstName] viajará para [clerical_holder.GetCapitalLocation.GetName]. Ao retornar de [loyal_vassal.GetHerHis], você ganhará [dread|E] e [GetVassalStance('belligerent').GetTextIcon][GetVassalStance('belligerent').GetName] [vassal|E] [opinion|E]."
 pam_generic_events.0005.a:0 "Muito bem, vá."
 pam_generic_events.0005.b.tt:0 "Você ganha um bônus #P massivo#! para [GetScheme('murder').GetTypeName] de [schemes|E] visando [clerical_holder.GetShortUIName] por #V 15 anos#!"
 pam_generic_events.0005.b:0 "Há maneiras mais inteligentes."
 pam_generic_events.0005.c.tt2:0 "O #V $lift_excommunication_interaction$#! [character_interaction|E] tem mais chances de ser usado contra você durante os próximos #V 10 anos#!"
 pam_generic_events.0005.c.tt:0 "O #V $declaration_of_repentance_interaction$#! [character_interaction|E] tem uma aceitação aumentada de #P +20#! por #V 10 anos#!"
 pam_generic_events.0005.c:0 "Me ensinaram a dar a outra face."
 pam_generic_events.0005.desc:0 "\"Como #EMP ousa#! [clerical_holder.GetSheHe]!?\"\n\nMeu [ROOT.Char.Custom2( 'RelationToMeShort', loyal_vassal )], [loyal_vassal.GetTitledFirstName], entra a passos largos na câmara do conselho com uma lâmina já parcialmente desembainhada.\n\n\"Como ousa [clerical_holder.GetTitledFirstName] expulsá-lo?\" [loyal_vassal.GetSheHe|U] cospe no chão. \"Eu tenho homens no [clerical_region.GetName]. Dê a ordem, e faremos uma visita a [clerical_holder.GetHerHim].\""
 pam_generic_events.0005.t:0 "Um Punho Leal"
 pam_generic_events.0007.a:0 "Bom."
 pam_generic_events.0007.desc:0 "O ato está feito. Encontrei [clerical_holder.GetTitledFirstName] e deixei [clerical_holder.GetHerHim] sangrando."
 pam_generic_events.0007.opening:0 "A [ROOT.Char.GetTitledFirstName]"
 pam_generic_events.0008.a:0 "Sim. #EMP Sim!!#!"
 pam_generic_events.0008.b:0 "Deve ser Ele!"
 pam_generic_events.0008.c:0 "Os antigos poderes estão despertando..."
 pam_generic_events.0008.d:0 "Às vezes a comida tem esse efeito."
 pam_generic_events.0008.desc:0 "O jantar ainda pesa em meu estômago enquanto tropeço em direção aos meus aposentos. Minha visão está turva e o corredor inclina-se sob meus pés.\n\nEntão... uma voz. \"Tão [virtuous_trait.GetName( ROOT.Char )|l] [ROOT.Char.GetTitleAsNameNoTooltip|l]...\" diz ela. \"Quão virtuoso. Você agrada ao seu senhor.\"\n\nIsto é verdadeiramente [ROOT.Char.GetFaith.HighGodName]? Ou apenas a doença que sinto?"
 pam_generic_events.0008.e:0 "Talvez... algo que comi?"
 pam_generic_events.0008.f:0 "É melhor dizer uma prece, por via das dúvidas."
 pam_generic_events.0008.t:0 "Uma Voz no Escuro"
 pam_generic_events.0009.a:0 "O flagelo conhece o caminho."
 pam_generic_events.0009.b:0 "A carne deve responder pela carne."
 pam_generic_events.0009.c:0 "[Glossary('$pam_james_4_8_english|q$','JAMES_4_8_GLOSS')]"
 pam_generic_events.0009.d:0 "Conversar com [comforting_courtier.GetTitledFirstName] sempre ajuda."
 pam_generic_events.0009.desc:0 "Acordo encharcado, com o coração batendo fortemente contra minhas costelas.\n\nEm meu sonho, eu ardia. A carne desprendeu-se dos meus ossos como manteiga. \"[sinful_trait.GetNameNoTooltip( ROOT.Char )|U]! [sinful_trait.GetNameNoTooltip( ROOT.Char )|U]!\" Uma horda de demônios gritava para mim.\n\nAs chamas de [ROOT.Char.GetFaith.NegativeAfterLife] me reclamavam, e cada grito era o meu próprio."
 pam_generic_events.0009.e:0 "Um sonho é apenas um sonho."
 pam_generic_events.0009.t:0 "As Chamas do Inferno"
 pam_generic_events.0010.a:0 "Um conselho, se quiseres ouvir..."
 pam_generic_events.0010.b.failure:0 "Seu louvor cai por terra"
 pam_generic_events.0010.b.success:0 "Seu louvor é bem recebido"
 pam_generic_events.0010.b.toast.failure:0 "[hunting_ruler.GetSheHe|U] se encolhe diante de sua bajulação vazia"
 pam_generic_events.0010.b.toast.success:0 "[hunting_ruler.GetSheHe|U] leva seu louvor a sério"
 pam_generic_events.0010.b.tt:0 "[hunting_ruler.GetTitledFirstName] tem mais propensão a aceitar uma #high $negotiate_alliance_interaction$#! [character_interaction|E] por #V 10 anos#!"
 pam_generic_events.0010.b:0 "Seu olhar é tão afiado quanto sua lança."
 pam_generic_events.0010.c:0 "Louvado seja!"
 pam_generic_events.0010.d:0 "Empreste-me alguns de seus cavaleiros para a estrada."
 pam_generic_events.0010.desc:0 "[ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] abrem-se ao nosso redor. O som trovejante de dezenas de cavalos a galope logo se segue, com [hunting_ruler.GetName] liderando-os orgulhosamente.\n\n#EMP \"Paraaaaaaaaaaada!\"#! [hunting_ruler.GetSheHe|U] ergue uma mão em cumprimento, fazendo com que [hunting_ruler.GetHerHis] comitiva pare. \"Louvado seja [ROOT.Char.GetFaith.HighGodName] por este clima!\" [hunting_ruler.GetSheHe|U] exclama, \"e pela caça que perseguimos!\""
 pam_generic_events.0010.t:0 "Caça Abençoada"
 pam_generic_events.0011.a:0 "Você abandonará seus modos [sinful_trait.GetNameNoTooltip( ROOT.Char )|l]."
 pam_generic_events.0011.b.failure:0 "Eles não querem aprender"
 pam_generic_events.0011.b.success:0 "A lição é assimilada"
 pam_generic_events.0011.b.toast.failure:0 "[sinful_courtier.GetSheHe|U] desdenha do seu ensinamento"
 pam_generic_events.0011.b.toast.success:0 "[sinful_courtier.GetSheHe|U] compreende o peso de [sinful_courtier.GetHerHis] pecado"
 pam_generic_events.0011.b:0 "Ouça as lições que [ROOT.Char.GetFaith.HighGodName] nos ensina."
 pam_generic_events.0011.c.failure:0 "Sua brandura colhe apenas desprezo"
 pam_generic_events.0011.c.success:0 "O conselho gentil os suaviza"
 pam_generic_events.0011.c.toast.failure:0 "[sinful_courtier.GetSheHe|U] toma sua bondade por fraqueza"
 pam_generic_events.0011.c.toast.success:0 "[sinful_courtier.GetSheHe|U] é comovido por seu cuidado"
 pam_generic_events.0011.c:0 "Isto não lhe faz bem..."
 pam_generic_events.0011.d:0 "Talvez não seja tão grave."
 pam_generic_events.0011.desc:0 "Os atos pecaminosos de [sinful_courtier.GetTitledFirstNamePossessive] já duram há tempo demais. Minha corte está repleta de boatos sobre o comportamento [sinful_courtier.GetHerHis] [sinful_trait.GetName( ROOT.Char )|l], e tenho visto servos recuarem sempre que [sinful_courtier.GetSheHe] passa.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [sinful_courtier.GetSheHe|U] exclama quando entro no escritório, [sinful_courtier.Custom('quirk_neg_pp')]. \"Que grande honra estar em sua presença.\""
 pam_generic_events.0011.t:0 "Uma Mancha de Pecado"
 pam_james_4_8_english:0 "#EMP Limpai as mãos, pecadores, e purificai os corações.#!"
 pam_john_14_2_english:0 "#EMP Na casa de meu Pai há muitas moradas.#!"
 pam_praised_hunting_alliance_accept_reason:0 "Elogiou minha caçada"
 pam_turned_the_other_cheek_accept_reason:0 "Ofereceu a outra face"
 rival_embraced_sinful_ways:0 "[CHARACTER.GetShortUIName|U] recusou-se a se arrepender quando [TARGET_CHARACTER.GetShortUIName] implorou a [CHARACTER.GetHerHim] que mudasse."
 rival_embraced_sinful_ways_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] recusou-se a se arrepender quando [CHARACTER.GetShortUIName] implorou a [TARGET_CHARACTER.GetHerHim] que mudasse."
