l_spanish:
 pam_adorcism_battle_guidance_modifier:0 "Estratégia Guiada por Espíritos"
 pam_adorcism_battle_guidance_modifier_desc:0 "Este personagem acredita que os espíritos revelaram sinais favoráveis para a batalha."
 pam_adorcism_campaign_endurance_modifier:0 "Exército Sustentado por Espíritos"
 pam_adorcism_campaign_endurance_modifier_desc:0 "Os exércitos deste personagem resistem a longas campanhas com convicção renovada."
 pam_adorcism_curse_anxiety_modifier:0 "Temendo a Maldição"
 pam_adorcism_curse_anxiety_modifier_desc:0 "Este personagem não consegue afastar o pensamento de que cada infortúnio vindouro foi evocado contra ele."
 pam_adorcism_curse_focus_modifier:0 "Raiva Redirecionada"
 pam_adorcism_curse_focus_modifier_desc:0 "Este personagem nomeou o objeto de sua fúria e o projetou para fora através de um ritual."
 pam_adorcism_events.0001.a:0 "Meu propósito é claro."
 pam_adorcism_events.0001.desc:0 "Em um lugar isolado, eu gravo o nome de [pam_adorcism_curse_target.GetTitledFirstNamePossessive] na terra e expresso cada queixa em voz alta. O rito não pode quebrar ossos ou definhar colheitas, mas esse não é o seu propósito.\n\nQuando me levanto, minha raiva se transformou em intenção. Cada rumor sobre [pam_adorcism_curse_target.GetHerHim] agora parece um fio esperando ser puxado."
 pam_adorcism_events.0001.t:0 "Um Nome Diante dos Espíritos"
 pam_adorcism_events.0002.a.flavor:0 "A maldição consome seus pensamentos, e cada sombra parece um presságio."
 pam_adorcism_events.0002.a:0 "Alguém busque o [ROOT.Char.GetFaith.PriestNeuter] — rápido!"
 pam_adorcism_events.0002.desc.christian:0 "\n\n[pam_adorcism_curser.Custom('christian_curse')|U], eu disse o seu nome diante dos espíritos e lancei uma maldição sobre você. Quando o infortúnio te encontrar, lembre-se de que foi a minha vontade que o convocou."
 pam_adorcism_events.0002.desc.default:0 "\n\nEu disse o seu nome diante dos espíritos e lancei uma maldição sobre você. Quando o infortúnio te encontrar, lembre-se de que foi a minha vontade que o convocou."
 pam_adorcism_events.0002.desc.intro:0 "[pam_adorcism_curser.Custom2('NegativeSupplimentaryGreeting', ROOT.Char)]"
 pam_adorcism_events.0002.opening:0 "[pam_adorcism_curser.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 pam_adorcism_events.0101.a:0 "Mostre-me o caminho para a vitória."
 pam_adorcism_events.0101.b:0 "Dê força ao meu braço armado."
 pam_adorcism_events.0101.c:0 "Dê resistência ao meu exército."
 pam_adorcism_events.0101.desc:0 "Além da última fogueira do acampamento, eu derramo uma oferenda e escuto enquanto os sons do exército desaparecem atrás de mim. O vento agita a poeira, sem carregar nenhuma voz clara, mas o ritual acalma meus pensamentos.\n\nDevo decidir que ajuda buscar para a campanha que se avizinha."
 pam_adorcism_events.0101.t:0 "Conselho do Invisível"
 pam_adorcism_ill_omen_modifier:0 "Marcado por Mau Presságio"
 pam_adorcism_ill_omen_modifier_desc:0 "Os membros do rito deste personagem o encaram com suspeita após rumores de uma maldição."
 pam_adorcism_personal_vigor_modifier:0 "Vigor Concedido por Espíritos"
 pam_adorcism_personal_vigor_modifier_desc:0 "A confiança ritual confere força a este personagem em combate pessoal."
 pam_curse_enemy_decision:0 "Maldição de Inimigo"
 pam_curse_enemy_decision_confirm:0 "Iniciar o Rito"
 pam_curse_enemy_decision_desc:0 "#F Quem é este tolo para se opor a mim? Vou nomeá-lo diante dos espíritos e despejar cada queixa, cada insulto e cada maldição sobre ele. Que ria enquanto pode; sua hora de acerto de contas chegará em breve.#!"
 pam_curse_enemy_decision_no_item_selected:0 "Nenhum inimigo selecionado"
 pam_curse_enemy_decision_selected_target_valid:0 "O inimigo selecionado ainda é um adulto vivo [rival|E], [nemesis|E] ou inimigo de guerra"
 pam_curse_enemy_decision_tooltip:0 "Realize um ritual contra um rival ou oponente em uma de suas [wars|E]"
 pam_curse_enemy_decision_valid_target:0 "Você tem um adulto vivo [rival|E], [nemesis|E] ou inimigo de guerra"
 pam_seek_war_aid_decision:0 "Buscar Ajuda para a Guerra"
 pam_seek_war_aid_decision_confirm:0 "Invocar os Espíritos"
 pam_seek_war_aid_decision_desc:0 "#F A guerra testa mais do que armas e números. Pedirei aos espíritos discernimento, vigor ou resistência suficientes para levar minha causa adiante através das provações que se aproximam.#!"
 pam_seek_war_aid_decision_tooltip:0 "Peça ajuda aos espíritos em suas guerras atuais"
