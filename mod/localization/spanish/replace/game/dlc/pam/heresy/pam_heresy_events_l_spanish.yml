l_spanish:
 adoptionist_rite:0 "$adoptionist$"
 adoptionist_rite_adherent:0 "Adocionista"
 adoptionist_rite_adherent_plural:0 "Adocionistas"
 adoptionist_rite_adj:0 "adocionista"
 adoptionist_rite_desc:0 "Um rito cristológico da Ibéria que ensina que Cristo, em sua humanidade, era o Filho adotivo e não o Filho natural de Deus — uma doutrina que a igreja carolíngia condenou como criptonestorianismo."
 adoptionist_rite_name:0 "Adocionismo"
 bogomilist_rite:0 "$bogomilist$"
 bogomilist_rite_adherent:0 "Bogomilo"
 bogomilist_rite_adherent_plural:0 "Bogomilos"
 bogomilist_rite_adj:0 "bogomilo"
 bogomilist_rite_desc:0 "Um rito dualista eslavo que rastreia suas raízes até o sacerdote Bogomil. Seus pregadores viajam descalços, rejeitam hierarquias, recusam-se a pegar em armas e ensinam que Satanás é o criador do mundo visível."
 bogomilist_rite_name:0 "Bogomilismo"
 cathar_rite:0 "$cathar$"
 cathar_rite_adherent:0 "Cátaro"
 cathar_rite_adherent_plural:0 "Cátaros"
 cathar_rite_adj:0 "cátaro"
 cathar_rite_desc:0 "Um rito dualista austero que considera o mundo material como obra de um demiurgo maligno. Seus perfecti fazem votos de pobreza e castidade, rejeitam os sacramentos da igreja estabelecida e recusam o serviço militar em nome de Deus."
 cathar_rite_name:0 "Catarismo"
 heresy_dangerous_rite.0010.a:0 "Que comece."
 heresy_dangerous_rite.0010.c:0 "Tem cheiro de heresia para mim..."
 heresy_dangerous_rite.0010.desc.body.alarming:0 "rompeu drasticamente com [source_rite.GetAdjective] e proclamou [new_rite.GetName] — "
 heresy_dangerous_rite.0010.desc.body.severe:0 "desvencilhou-se de [source_rite.GetAdjective] em tudo, exceto no nome, e proclamou [new_rite.GetName] — "
 heresy_dangerous_rite.0010.desc.differing.doctrine:0 "o mais ousado entre seus novos éditos, [differing_doctrine.GetDescriptiveName( source_rite.GetFaith.Self )] é pregado abertamente."
 heresy_dangerous_rite.0010.desc.differing.fallback:0 "os novos éditos são numerosos demais para serem estabelecidos em uma única linha."
 heresy_dangerous_rite.0010.desc.differing.tenet:0 "o mais ousado entre seus novos éditos, [differing_tenet.GetBaseName] é pregado abertamente."
 heresy_dangerous_rite.0010.desc.intro.descriptor_archbishop:0 "O arcebispo [founder.GetCulture.GetName] [founder.GetFirstName] "
 heresy_dangerous_rite.0010.desc.intro.descriptor_ruler:0 "[founder.GetTitledFirstName] "
 heresy_dangerous_rite.0010.desc.opener.archbishopric:0 "da [founder_clerical_title.GetNameNoTier] "
 heresy_dangerous_rite.0010.desc.opener.lands:0 "de [founder.GetPrimaryTitle.GetBaseNameNoTier] "
 heresy_dangerous_rite.0010.desc.outro:0 "\n\nOs pregadores estão se espalhando pelo reino — [origin_faith.ReligiousText] em uma mão, tochas na outra. Os anciãos de [origin_faith.GetName] não terão nenhuma boa palavra sobre nada disso.\n\nUma heresia potencial foi posta no papel e proclamada do púlpito; a espada e o fogo responderão onde os sermões não puderem."
 heresy_dangerous_rite.0010.t:0 "Um Rito Herético"
 heresy_dangerous_rite.spread.title:0 "O Novo Rito se Espalha"
 heresy_historical.0050.a:0 "A causa deles é justa. Vou abraçá-la."
 heresy_historical.0050.b:0 "Tanta convicção... Quem dera fosse eu."
 heresy_historical.0050.c.insider:0 "Resistimos. A causa cresce."
 heresy_historical.0050.c:0 "Hereges..."
 heresy_historical.0050.desc.distant.first:0 "Peregrinos e comerciantes nos trazem notícias da causa [heresy_faith.GetAdjective], que inflamou as mentes de [epicenter_ruler.GetCapitalLocation.GetTitle.GetName] distantes. Os sermões de [founder.GetTitledFirstName] chegam lentamente aos nossos portões.\n\n"
 heresy_historical.0050.desc.distant.resurgence:0 "Chegam notícias de que a causa [heresy_faith.GetAdjective] foi reavivada em [epicenter_ruler.GetCapitalLocation.GetTitle.GetName] distantes. Parece que [founder.GetTitledFirstName] não teme o fogo da condenação, nem as censuras e decretos lançados contra todo tipo de blasfêmia de [founder.GetHerHis].\n\n"
 heresy_historical.0050.desc.insider.first:0 "Em [epicenter_ruler.GetCapitalLocation.GetTitle.GetName], [founder.GetTitledFirstName] professa corajosamente a causa [heresy_faith.GetAdjective]. Os sussurros de anos passados finalmente se tornaram um sermão para todo o mundo ouvir.\n\n"
 heresy_historical.0050.desc.insider.resurgence:0 "[founder.GetTitledFirstName] reaviva a causa [heresy_faith.GetAdjective] em [epicenter_ruler.GetCapitalLocation.GetTitle.GetName]. O mundo desperta mais uma vez para nossa luz sagrada, e a verdade divina é professada novamente!\n\n"
 heresy_historical.0050.desc.nearby.first:0 "Tornou-se impossível ignorar [founder.GetTitledFirstName] enquanto [founder.GetSheHe] prega a causa [heresy_faith.GetAdjective] na vizinha [epicenter_ruler.GetCapitalLocation.GetTitle.GetName]. Nossos [origin_faith.PriestMalePlural] denunciaram os ensinamentos de [founder.GetHerHis] de seus púlpitos, o que parece ter apenas os tornado mais atraentes para os homens e mulheres comuns da igreja.\n\n"
 heresy_historical.0050.desc.nearby.resurgence:0 "A causa [heresy_faith.GetAdjective] foi reavivada em [epicenter_ruler.GetCapitalLocation.GetTitle.GetName], não muito longe de onde antes ardia intensamente. Enquanto [founder.GetTitledFirstName] fala, cortesãos e plebeus ainda se lembram da tentação ímpia da heresia.\n\n"
 heresy_historical.0050.gloss.adoptionist:0 "[founder.GetSheHe|U] revive o argumento ibérico: na humanidade de [founder.GetHerHis], Cristo foi adotado."
 heresy_historical.0050.gloss.bogomilist:0 "[founder.GetSheHe|U] prega um dualismo eslavo: o mundo é de Satanás, e apenas a oração incessante reconquista a alma."
 heresy_historical.0050.gloss.cathar:0 "[founder.GetSheHe|U] prega um dualismo severo, chamando o mundo de obra de um deus maligno e a Igreja de Roma de a Grande Prostituta."
 heresy_historical.0050.gloss.generic:0 "[founder.GetSheHe|U] prega uma doutrina de renovação severa, enraizada na tradição [heresy_faith.GetAdjective]."
 heresy_historical.0050.gloss.hussite:0 "[founder.GetSheHe|U] prega a comunhão em ambas as espécies para os leigos, as escrituras em boêmio e uma Igreja despojada de suas dignidades compradas."
 heresy_historical.0050.gloss.iconoclast:0 "[founder.GetSheHe|U] prega a causa iconoclasta renascida: cada Cristo pintado e santo dourado é um ídolo, Niceia II um erro nunca expiado."
 heresy_historical.0050.gloss.joachimite:0 "[founder.GetSheHe|U] prega a iminente Era do Espírito, na qual as ordens sacerdotais de Roma dão lugar a uma igreja contemplativa de homens pobres."
 heresy_historical.0050.gloss.lollard:0 "[founder.GetSheHe|U] prega as escrituras na língua comum, sem terras para o sacerdócio e sem teatro no altar."
 heresy_historical.0050.gloss.messalian:0 "[founder.GetSheHe|U] prega a oração sem fim no lugar dos sacramentos, e um demônio interior, além do poder de qualquer sacerdote para expulsar."
 heresy_historical.0050.gloss.paulician:0 "[founder.GetSheHe|U] prega o antigo fogo oriental — dualismo, iconoclasmo e uma leitura rígida de Paulo. Os seguidores de [founder.GetHerHis|U] preferem a espada à fogueira."
 heresy_historical.0050.gloss.waldensian:0 "[founder.GetSheHe|U] prega uma igreja pobre de pregadores leigos descalços: juramentos e guerras renunciados, e as Escrituras pertencendo a todos."
 heresy_historical.0050.history.adoptionist:0 "\n\nNas terras de fronteira ibéricas, certos bispos ensinam que o filho do carpinteiro foi adotado na glória, em vez de nascer nela. Frankfurt e Aachen condenaram isso, mas os locais continuam perguntando onde a verdade realmente reside."
 heresy_historical.0050.history.bogomilist:0 "\n\nEste movimento agitou-se pela primeira vez quando sacerdotes de aldeia ensinaram que o pão e o vinho eram simplesmente isso: pão e vinho. Os camponeses eslavos apegam-se a esta revelação, e nenhum anátema de patriarca os dissuadiu até agora."
 heresy_historical.0050.history.cathar:0 "\n\nEstas crenças cruzaram para oeste a partir dos Bálcãs, e agora em Languedoc são professadas tanto por tecelões quanto por viscondes. Seus líderes espirituais, os Perfecti, andam descalços aos pares e cuidam dos doentes e moribundos."
 heresy_historical.0050.history.generic:0 "\n\nCada época evoca o seu próprio fogo — claustros que quebraram a sua regra, pregadores que saíram da catedral e nunca mais voltaram. Este está na estrada agora."
 heresy_historical.0050.history.hussite:0 "\n\nEste movimento começou na Capela de Belém em Praga, onde os sermões foram dados pela primeira vez na língua boêmia, e o cálice sagrado foi oferecido pela primeira vez aos lábios dos leigos."
 heresy_historical.0050.history.iconoclast:0 "\n\nDuas vezes o império despiu as suas igrejas de Cristos pintados e santos dourados, e duas vezes estes ícones retornaram. Agora a questão da idolatria foi levantada mais uma vez."
 heresy_historical.0050.history.joachimite:0 "\n\nComeçou num claustro calabrês, onde um abade leu o Apocalipse como um calendário e contou os anos até a próxima idade vindoura. Mendicantes de longo alcance assumiram esta contagem, e agora é o assunto dos mercados por toda a terra."
 heresy_historical.0050.history.lollard:0 "\n\nComeçou em Oxford, onde mestres e estudantes vinham questionando o direito canônico. Agora as suas escrituras traduzidas estão a espalhar-se do claustro para a cidade, a uma velocidade que nenhum padre pode impedir."
 heresy_historical.0050.history.messalian:0 "\n\nSurgiu nos desertos da Mesopotâmia — monges errantes que rezavam sem dormir e sustentavam que cada alma abrigava um demônio que nenhum padre podia exorcizar. Condenados em Éfeso, os fiéis ainda perseveram."
 heresy_historical.0050.history.paulician:0 "\n\nFundado em torno de uma leitura rigorosa de Paulo, este movimento é mais antigo do que qualquer catedral no Bósforo. Em Tefrike, nas terras altas arménias, os paulicianos prosperaram outrora, antes de o Império Bizantino extinguir o seu estado."
 heresy_historical.0050.history.waldensian:0 "\n\nComeçou com um mercador de Lyon que deu a sua riqueza aos pobres e pregou nas ruas. Agora, aqueles que ele inspirou caminham descalços pelas altas montanhas e partilham a palavra de Deus com o mais humilde dos homens."
 heresy_historical.0050.t.bogomilist.first:0 "A Heresia de Bogomil"
 heresy_historical.0050.t.cathar.first:0 "A Heresia Cátara"
 heresy_historical.0050.t.fallback:0 "Uma Heresia [heresy_faith.GetAdjectiveNoTooltip]"
 heresy_historical.0050.t.hussite.first:0 "A Heresia de Hus"
 heresy_historical.0050.t.joachimite.first:0 "A Heresia de Joaquim"
 heresy_historical.0050.t.lollard.first:0 "A Heresia de Wycliffe"
 heresy_historical.0050.t.resurgence:0 "O Retorno da Heresia [heresy_faith.GetAdjectiveNoTooltip]"
 heresy_historical.0050.t.waldensian.first:0 "A Heresia de Waldo"
 heresy_historical.spread.title:0 "A Heresia Propaga-se"
 heresy_light.0010.a:0 "Vou rezar por orientação."
 heresy_light.0010.b:0 "Há sabedoria em [new_rite.GetNameNoTooltip]. Seguirei esse caminho."
 heresy_light.0010.c.own_rite:0 "Em frente, então. O caminho é nosso."
 heresy_light.0010.c:0 "Isto cheira a heresia para mim..."
 heresy_light.0010.desc.body.alarming:0 "puxou [new_rite.GetName] perigosamente para longe da prática aceita de [source_rite.GetAdjective], "
 heresy_light.0010.desc.body.dangerous:0 "divergiu [new_rite.GetName] para algo que [source_rite.GetAdjective] mal consegue reconhecer como parente, "
 heresy_light.0010.desc.body.uneasy:0 "inclinou [new_rite.GetName] ainda mais para longe de [source_rite.GetAdjective], "
 heresy_light.0010.desc.differing.doctrine:0 "sendo o desvio mais marcante [differing_doctrine.GetDescriptiveName( source_rite.GetFaith.Self )]."
 heresy_light.0010.desc.differing.fallback:0 "as novas ênfases são demasiado subtis para um único nome."
 heresy_light.0010.desc.differing.tenet:0 "sendo o desvio mais marcante [differing_tenet.GetBaseName]."
 heresy_light.0010.desc.intro.descriptor_archbishop:0 "O arcebispo [founder.GetCulture.GetName] [founder.GetFirstName] "
 heresy_light.0010.desc.intro.descriptor_ruler:0 "[founder.GetTitledFirstName] "
 heresy_light.0010.desc.opener.archbishopric:0 "da arquidiocese de [founder_clerical_title.GetNameNoTier] "
 heresy_light.0010.desc.opener.lands:0 "de [founder.GetPrimaryTitle.GetBaseNameNoTier] "
 heresy_light.0010.desc.outro.own_rite:0 "\n\nNós ainda não somos heréticos. A linha, no entanto, já não está longe."
 heresy_light.0010.desc.outro:0 "\n\nEles ainda não são heréticos. A linha, no entanto, já não está longe."
 heresy_light.0010.t:0 "Divergência Herética"
 heresy_light.notification.hof.title:0 "Um Rito Desvia-se para a Heresia"
 heresy_light.notification.hof.tt:0 "[new_rite.GetName] distanciou-se ainda mais de [source_rite.GetAdjective] sob [founder.GetTitledFirstName]."
 heresy_light.notification.mainline.title:0 "Um Rito Vizinhança Desvia-se"
 heresy_light.notification.mainline.tt:0 "[new_rite.GetName] distanciou-se ainda mais de [source_rite.GetAdjective] sob [founder.GetTitledFirstName]."
 heresy_light.notification.member.title:0 "O Nosso Rito Desvia-se"
 heresy_light.notification.member.tt:0 "[new_rite.GetName] distanciou-se ainda mais de [source_rite.GetAdjective] sob [founder.GetTitledFirstName]."
 hussite_rite:0 "$hussite$"
 hussite_rite_adherent:0 "Hussita"
 hussite_rite_adherent_plural:0 "Hussitas"
 hussite_rite_adj:0 "hussita"
 hussite_rite_desc:0 "Um rito de reforma boémio que exige o cálice para os leigos, as escrituras na língua vernácula, e o fim da riqueza clerical e da venda de indulgências. Os seus pregadores baseiam-se fortemente nos argumentos de Wycliffe e na convicção ardente de que Roma se desviou do caminho apostólico."
 hussite_rite_name:0 "Hussita"
 iconoclast_rite:0 "$iconoclast$"
 iconoclast_rite_adherent:0 "Iconoclasta"
 iconoclast_rite_adherent_plural:0 "Iconoclastas"
 iconoclast_rite_adj:0 "iconoclasta"
 iconoclast_rite_desc:0 "Um renascimento do antigo movimento aniconista oriental, condenando a veneração de imagens como uma idolatria rastejante e exigindo que os ícones sejam removidos tanto das igrejas como das casas."
 iconoclast_rite_name:0 "Iconoclasta"
 joachimite_rite:0 "$joachimite$"
 joachimite_rite_adherent:0 "Joaquimita"
 joachimite_rite_adherent_plural:0 "Joaquimitas"
 joachimite_rite_adj:0 "joaquimita"
 joachimite_rite_desc:0 "Um rito apocalíptico que lê a história em três eras: Pai, Filho, e uma vinda da Era do Espírito Santo que dissolverá a Igreja institucional e erguerá uma nova ordem contemplativa. Os seus adeptos vagueiam na pobreza apostólica, pregam nos mercados e olham com olhos brilhantes para o fim iminente do mundo."
 joachimite_rite_name:0 "Joaquimita"
 lollard_rite:0 "$lollard$"
 lollard_rite_adherent:0 "Lolar"
 lollard_rite_adherent_plural:0 "Lolares"
 lollard_rite_adj:0 "lolar"
 lollard_rite_desc:0 "Um rito de reforma vernáculo que rejeita o ritual ornamentado, a transubstanciação, o culto das relíquias e um clero rico. A Bíblia é lida na língua comum e cada crente é considerado um sacerdote por direito próprio."
 lollard_rite_name:0 "Lolar"
 messalian_rite:0 "$messalian$"
 messalian_rite_adherent:0 "Messaliano"
 messalian_rite_adherent_plural:0 "Messalianos"
 messalian_rite_adj:0 "messaliano"
 messalian_rite_desc:0 "Um rito esotérico e ascético que considera a oração incessante como o único sacramento de qualquer valor. Pois uma vez que o demônio que habita dentro de um crente é expulso, nenhum ato carnal pode contaminar esse crente novamente."
 messalian_rite_name:0 "Messaliano"
 pam_heresy_fervor_reset_component_1_desc:0 "Fiéis mobilizados contra a [rite_divergence|E] crescente"
 pam_heresy_fervor_reset_component_2_desc:0 "Fiéis mobilizados contra um novo [rite|E] cismático"
 pam_heresy_fervor_reset_component_3_desc:0 "Fiéis mobilizados contra um renascimento herético"
 paulician_rite:0 "$paulician$"
 paulician_rite_adherent:0 "Pauliciano"
 paulician_rite_adherent_plural:0 "Paulicianos"
 paulician_rite_adj:0 "Pauliciano"
 paulician_rite_desc:0 "Um rito dualista de orientação marcial nascido na Ásia Menor. Desdenhoso de ícones e hierarquias religiosas estabelecidas, seus seguidores prezam pela leitura sem intermediários das epístolas de Paulo, e estão bastante dispostos a pegar em armas em defesa de sua pureza."
 paulician_rite_name:0 "Pauliciano"
 waldensian_rite:0 "$waldensian$"
 waldensian_rite_adherent:0 "Valdês"
 waldensian_rite_adherent_plural:0 "Valdenses"
 waldensian_rite_adj:0 "Valdense"
 waldensian_rite_desc:0 "Um rito de pregadores mendicantes descalços que insistem que os leigos podem pregar as escrituras, que a igreja institucional não tem exclusividade sobre a graça e que os cristãos não devem possuir propriedades ou pegar em armas."
 waldensian_rite_name:0 "Valdense"
