l_spanish:
 building_pam_abbey_of_st_gall_01:0 "Abadia de São Galo"
 building_pam_abbey_of_st_gall_01_desc:0 "Erguida em torno da ermida de São Galo, esta abadia é famosa por sua escola, seu scriptorium e sua biblioteca. Sob suas paredes, os mongescopiam textos sagrados e treinam clérigos cujo aprendizado alcança muito além das margens do Lago de Constança."
 building_pam_abbey_of_st_gall_01_destination_desc:0 "A [GetBuilding('pam_abbey_of_st_gall_01').GetName] reúne peregrinos e estudiosos sob suas muralhas. Seus monges preservam manuscritos, ensinam clérigos e mantêm viva a memória de São Galo nas encostas alpinas."
 building_pam_lateran_basilica_01:0 "Arquibasílica de São João de Latrão"
 building_pam_lateran_basilica_01_desc:0 "A igreja catedral de Roma é mãe e cabeça das igrejas da cidade e do mundo. Em sua basílica e salões anexos reúnem-se concílios, fixa-se a doutrina e exibe-se a autoridade do pontífice romano a todos."
 building_pam_lateran_basilica_01_destination_desc:0 "A [GetBuilding('pam_lateran_basilica_01').GetName] recebe peregrinos e prelados na sede episcopal de Roma, onde o culto solene e o governo da igreja se encontram sob paredes veneráveis."
 building_pam_palais_de_papes_01:0 "Palácio dos Papas"
 building_pam_palais_de_papes_01_desc:0 "Erguido sobre Avinhão como fortaleza e residência, este palácio abriga a corte papal por trás de maciças muralhas de pedra. Capelas, salões de audiência e câmaras administrativas tornam a cidade um centro de poder eclesiástico."
 building_pam_palais_de_papes_01_destination_desc:0 "O [GetBuilding('pam_palais_de_papes_01').GetName] domina Avinhão com suas muralhas fortificadas e capelas solenes, um palácio construído para abrigar os negócios e as cerimônias da Igreja."
 building_pam_reims_cathedral_01:0 "Catedral de Reims"
 building_pam_reims_cathedral_01_desc:0 "Em Reims, a catedral ergue-se como o local sagrado do batismo de Clóvis e da coroação dos reis. Aqui, a bênção do clero pode transformar as pretensões de um governante em autoridade divina, forjando um laço entre a fé e o poder real."
 building_pam_reims_cathedral_01_destination_desc:0 "A [GetBuilding('pam_reims_cathedral_01').GetName] atrai viajantes ao coração sagrado da consagração real, onde os reis francos ajoelham-se perante o altar e partem ungidos perante o reino."
