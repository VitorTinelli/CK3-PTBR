 ASK_FOR_DIVORCE_NOTIFICATION_MULTIPLE_CONSORTS_SECONDARY:0 "\n\n[secondary_recipient.GetFirstNameNoTooltip] é um(a) polígamo(a)! Meu(minha) [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))] não passa de uma cabeça no rebanho de bens de [secondary_recipient.GetHerHis]. Liberte [secondary_actor.GetHerHim]!"
 ASK_FOR_DIVORCE_NOTIFICATION_NOT_JUSTIFIED:0 "\n\nNão trago nenhuma justificativa legal... mas confio na sua maestria da lei religiosa para #EMP descobrir#! motivos para a anulação."
