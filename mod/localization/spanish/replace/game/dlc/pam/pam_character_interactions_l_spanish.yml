 pam_interaction_clerical_gender_tt:0 "Deve corresponder ao Gênero Clerical [doctrine|E] deste [rite|E]"
 pam_interactions_events.0001.a.high_zeal:0 "Duvidar de mim é duvidar da palavra de [ROOT.Char.GetFaith.HighGodName]!"
 pam_interactions_events.0001.a.low_zeal:0 "Ainda bem que o povo é mais fácil de convencer do que eu..."
 pam_interactions_events.0001.a:0 "De [ROOT.Char.GetFaith.HighGodName] me foi dado [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 pam_interactions_events.0001.donate:0 "\n\nEm gratidão pela sua doação,"
 pam_interactions_events.0001.hook:0 "\n\nMeu favor a você:"
 pam_interactions_events.0001.hook_intro:0 "Naturalmente! Devo auxiliá-lo,"
 pam_interactions_events.0001.intro:0 "É justo e conveniente que busque a aprovação de um [recipient.GetTitleAsNamePossessive],"
 pam_interactions_events.0001.mid:0 "os [recipient.GetFaith.HouseOfWorshipPlural] do seu reino ressoarão com sermões elevando o seu mandato e louvando [recipient.GetFaith.HighGodName] por trazer um [ROOT.Char.GetTitleAsNameNoTooltip] como você para [actor.GetPrimaryTitle.GetNameNoTier]."
 pam_interactions_events.0001.monks:0 "\n\nOs mosteiros e"
 pam_interactions_events.0001.normal:0 "\n\nPor minha insistência,"
 pam_interactions_events.0001.opening:0 "Nobre [ROOT.Char.GetTitledFirstNameRegnal],"
 pam_interactions_events.0001.tithe:0 "\n\nConforme o dízimo é pago,"
 pam_interactions_events.0001.toast_puppeteer:0 "[recipient.GetShortUIName] concedeu [puppet_or_actor.GetShortUIName] [legitimacy|E] clerical"
 pam_interactions_events.0001:0 "pois todos os títulos [recipient.GetFaith.GetReligion.GetAdjective] deste mundo são detidos apenas pela santa vontade de [recipient.GetFaith.HighGodNamePossessive]."
 pam_interactions_events.0001_approve:0 "\n\nNosso louvor será verdadeiro e grato."
 pam_interactions_events.0001_disapprove:0 "\n\nPor favor, faça jus a estas palavras laudatórias."
 pam_interactions_events.0001_disgust:0 "\n\nNão manche estas palavras com atos malignos."
 pam_interactions_events.0001_offer_hook_end:0 "\n\nQue este favor não seja esquecido."
 pam_interactions_events.0002.a:0 "Maldita seja a arrogância de [recipient.GetFaith.PriestNeuterPlural]!"
 pam_interactions_events.0002.opening:0 "[ROOT.Char.GetTitledFirstNameRegnal],"
 pam_interactions_events.0002.toast_puppeteer:0 "[recipient.GetShortUIName] recusou o pedido de [puppet_or_actor.GetShortUINamePossessive] por [legitimacy|E]"
 pam_interactions_events.0002:0 "Os símbolos de sua autoridade já preenchem suas mãos, adornam seu corpo... que necessidade tem das vozes reverentes que servem a [recipient.GetFaith.HighGodName]? Força brutal, atos sombrios e tramas hediondas estão todos à sua disposição.\n\nGuarde bem suas pompas de [ROOT.Char.Custom('GetTitleTierAdjective')]. Pois os servos de [recipient.GetFaith.HighGodName] não participarão de sua preservação."
 pam_interactions_events.0010.a.high_zeal:0 "Que a salvação de [target.GetNameNoTierPossessiveNoTooltip] venha muito antes disso!"
 pam_interactions_events.0010.a.low_zeal:0 "E assim, um direito ancestral é forjado..."
 pam_interactions_events.0010.a:0 "Que jamais seja esquecido."
 pam_interactions_events.0010.opening:0 "Ó Protetor Legítimo de [target.GetNameNoTier],"
 pam_interactions_events.0010.toast_puppeteer:0 "[recipient.GetShortUIName] concordou em apoiar a reivindicação de [puppet_or_actor.GetShortUINamePossessive] sobre [target.GetNameNoTier]"
 pam_interactions_events.0010:0 "Por quanto tempo a própria dispensação de terras e títulos de [actor.GetFaith.HighGodNamePossessive] foi ignorada? Por quanto tempo o povo [target.GetTierAsNamePossessiveNoTooltip] definhou sem um pastor do sangue de [actor.GetHouse.GetName]?\n\nApoiaraei a vossa reivindicação de [target.GetNameNoTierNoTooltip] em cada corte, em cada concelho, em cada tratado.\n\nA vossa reivindicação não morrerá convosco."
 pam_interactions_events.0011.a:0 "O [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('recipient'))] me recusa?!?"
 pam_interactions_events.0011.opening:0 "Sempre insatisfeito [actor.GetTitleAsName],"
 pam_interactions_events.0011.toast_puppeteer:0 "[recipient.GetShortUIName] recusou apoiar a reivindicação de [puppet_or_actor.GetShortUINamePossessive] sobre [target.GetNameNoTier]"
 pam_interactions_events.0011:0 "Envio esta missiva com cuidado e preocupação. Acaso não degrada a vossa dignidade... insistir tão descaradamente naquilo que não vos pertence? Não temeis ofender a [actor.GetFaith.HighGodName]? A vossos irmãos e irmãs [actor.GetFaith.GetReligion.GetAdjective]?\n\nQuando o vosso espírito descansar em [actor.GetFaith.PositiveAfterLife] ou — se o destino for vingativo — em [actor.GetFaith.NegativeAfterLife], roguemos que então [target.GetNameNoTier] conheça a paz."
 pam_interactions_events.0020.a.high_zeal:0 "[target.GetNameNoTierNoTooltip] é meu por direito sagrado!"
 pam_interactions_events.0020.a.low_zeal:0 "E assim a história é reescrita..."
 pam_interactions_events.0020.a:0 "A minha reivindicação está feita, que [recipient.GetTitledFirstNameNoTooltip] vá para o inferno."
 pam_interactions_events.0020.opening:0 "[actor.GetFirstName], ó [actor.GetTitledFirstNameNoTooltip] injustamente despojado!"
 pam_interactions_events.0020.toast_puppeteer:0 "[secondary_recipient.GetShortUIName] concedeu a [puppet_or_actor.GetShortUIName] uma reivindicação sobre [target.GetNameNoTier]"
 pam_interactions_events.0020:0 "É vosso direito reivindicar [target.GetNameNoTier]: um direito antigo por providência divina! Forneci ao vosso conselho provas de que assim é."
 pam_interactions_events.0020_end:0 "\n\n[recipient.GetNameRegnal] dificilmente ficará satisfeito com esta revelação. Mas [secondary_recipient.GetFaith.FateGodName] não dá ouvidos aos protestos de um charlatão."
 pam_interactions_events.0020_indebted:0 "Este humilde [secondary_recipient.GetFaith.PriestNeuter] vos deve favor e, portanto, busquei — e encontrei — provas indiscutíveis de que [target.GetNameNoTier] pertence por direito à vossa linhagem, e vos tem sido negado!"
 pam_interactions_events.0020_offer_hook:0 "A vossa promessa de favorecer [secondary_recipient.GetPrimaryTitle.GetNameNoTier] moveu a minha mão, e assim descobri o vosso direito há muito ignorado — de reivindicar [target.GetNameNoTier]!"
 pam_interactions_events.0020_threatened:0 "Contenha os deveres punitivos, a censura vil, a força perversa que desferiríeis contra meus [secondary_recipient.GetFaith.GetReligion.GetAdjective] [secondary_recipient.GetFaith.HouseOfWorshipPlural]! A vossa resoluta firmeza será necessária nos dias que virão — pois a reivindicação de [target.GetNameNoTier] é vossa."
 pam_interactions_events.0021.a:0 "As paredes de [secondary_recipient.GetFaith.HouseOfWorship|U] emprestam a [secondary_recipient.GetHerHim] a coragem de um tolo!"
 pam_interactions_events.0021.opening:0 "[actor.GetName],"
 pam_interactions_events.0021.toast_puppeteer:0 "[secondary_recipient.GetShortUIName] recusou o pedido de [puppet_or_actor.GetShortUINamePossessive] por uma reivindicação sobre [target.GetNameNoTier]"
 pam_interactions_events.0021:0 "Se vos fora destinado governar [target.GetNameNoTier], acaso [secondary_recipient.GetFaith.HighGodName] não vo-lo teria concedido por direito de nascimento?\n\nNão, não ultrajarei [recipient.GetTitledFirstNameRegnal] — traindo nossas almas mortais, tanto a vossa quanto a minha — escrevendo falsidades para vossa causa ímpia.\n\nRefleti sobre o erro de vossos caminhos."
 pam_interactions_events.0022.a:0 "Mentiras! Uma reivindicação falsa apoiada por um falso [secondary_recipient.GetFaith.PriestNeuter]!"
 pam_interactions_events.0022.opening:0 "Detentor do meu direito de primogenitura,"
 pam_interactions_events.0022:0 "Entre estudiosos eruditos, sempre foi sabido — e agora recém-provado — que [target.GetName] é meu por direito."
 pam_interactions_events.0022_end:0 "\n\n[secondary_recipient.GetTitledFirstNameRegnal] deu sua sanção sagrada à minha reivindicação. [secondary_recipient.GetPrimaryTitle.GetName] me apoia incondicionalmente.\n\nE assim começo a esperar e rezar para que, um dia, eu seja acolhido como senhor da bela [target.GetNameNoTierNoTooltip]..."
 pam_interactions_events.0022_shark:0 "[target.GetName] pertence aos títulos passados de [actor.GetFaith.HighGodName] para a minha linhagem [actor.Custom('GetTitleTierAdjective')]. Isso sempre foi assim, embora permanecesse oculto até agora."
 pam_interactions_events.0022_shrimp:0 "Embora eu seja um mero [actor.GetTitleAsName], os [actor.GetFaith.GetAdjective] [secondary_recipient.GetFaith.AltPriestTermPlural] descobriram que em meu sangue corre uma reivindicação ancestral sobre todo o domínio de [target.GetName]."
 pam_interactions_events.0023.a:0 "Que [target.GetNameNoTierNoTooltip] seja vosso, meu [actor.Custom('GetDaughterSon')]."
 pam_interactions_events.0023.b:0 "Um [secondary_recipient.GetTitleAsNameNoTooltip] não deve negociar falsidades."
 pam_interactions_events.0023.opening:0 "Santo [secondary_recipient.GetMotherFather],"
 pam_interactions_events.0023:0 "Há confusão entre os fiéis. Alguns desejam ardentemente que eu reivindique [target.GetName], enquanto outros negam que eu tenha qualquer direito ao título."
 pam_interactions_events.0023_end:0 "\n\nCertamente, alguém tão erudito quanto vós poderíeis #EMP descobrir#! as provas necessárias nas crônicas... e suprir-me com uma reivindicação sancionada sobre [target.GetNameNoTierNoTooltip]?"
 pam_interactions_events.0023_shark:0 "Por vontade de [actor.GetFaith.HighGodNamePossessive], já sou senhor e protetor de diversas terras e povos. Contudo, [target.GetName] jaz além do meu reino e dos meus direitos."
 pam_interactions_events.0023_shrimp:0 "Se eu estivesse armado com uma reivindicação legítima, não poderia eu guiar [target.GetName] com mais virtude do que os [actor.Custom2('InsultAdjective', recipient)] [recipient.GetFirstNameRegnal]? Por favor, permiti que a luz de [actor.GetFaith.HighGodNamePossessive] brilhe sobre este mero [actor.GetTitleAsName]."
 pam_interactions_events.0030.a.flavor:0 "E que é o [actor.GetTitleAsNameNoTooltip] de [actor.GetPrimaryTitle.GetNameNoTierNoTooltip] quem pode exigi-las!"
 pam_interactions_events.0030.a:0 "Lembrai a [recipient.GetFirstNameNoTooltip] que [recipient.GetSheHe] tem certas... obrigações."
 pam_interactions_events.0030.b.flavor:0 "Deixai claro: se [recipient.GetFirstNameNoTooltip] recusar isto, [recipient.GetSheHe] nada significa para vós."
 pam_interactions_events.0030.b:0 "Não preciso de [ROOT.Char.Custom2('RelationToMe', recipient)]. Preciso de [target.GetNameNoTierNoTooltip]."
 pam_interactions_events.0030.c.tt:0 "Atacai o pecador imundo com acusações vis! Invocai a danação e o escárnio sobre ambos! [secondary_recipient.GetTitledFirstNameNoTooltip] e todos os demais [actor.GetFaith.PriestNeuterPlural] farão [recipient.GetFirstNameNoTooltip] ceder!"
 pam_interactions_events.0030.c:0 "Se [recipient.GetSheHe] não ceder, desonrai este solo sagrado."
 pam_interactions_events.0030.d.flavor:0 "O pouco respeitado [recipient.GetTitleAsNameNoTooltip] dificilmente durará se nomes e reputações forem postos em jogo..."
 pam_interactions_events.0030.d:0 "Ameaçai transformar isto num escândalo deslegitimador."
 pam_interactions_events.0030.desc:0 "Palavras de concórdia pacífica, temperadas com ameaças de guerra. Declarações dos meus direitos ordenados. E mais, e mais...\n\n"
 pam_interactions_events.0030.desc_intro:0 "Com a bênção de [secondary_recipient.GetTitledFirstNameRegnal] e a proteção do solo sagrado, apresento minha causa por [target.GetNameNoTier]."
 pam_interactions_events.0030.desc_intro_envoy:0 "Em solo sagrado, meu enviado [secondary_recipient.GetTitledFirstNameRegnal] apresenta minha causa por [target.GetNameNoTier]."
 pam_interactions_events.0030.desc_target:0 "[recipient.GetTitledFirstNameNicknamed] não será expulso de [recipient.GetHerHis] [target.GetTierAsNameNoTooltip] tão facilmente. Esta questão de terras deve ser selada com promessas terrenas, ou com ameaças cruéis."
 pam_interactions_events.0030.desc_vassal:0 "[recipient.GetTitledFirstNameNicknamed] não afrouxará o aperto sobre [recipient.GetHerHis] [vassal.GetName] tão facilmente. Com ofertas douradas ou ameaças terríveis: meu vassalo deve ser conquistado."
 pam_interactions_events.0030.e:0 "Simplesmente oferecei comprar o [target.GetTierAsNameNoTooltip]."
 pam_interactions_events.0030.f:0 "Deixo isto a cargo de [ROOT.Char.GetFaith.HighGodName] e do julgamento de [recipient.GetFirstNamePossessiveNoTooltip]."
 pam_interactions_events.0030.t:0 "Negociações por [target.GetNameNoTierNoTooltip]"
 pam_interactions_events.0031.a:0 "O [secondary_recipient.GetTitleAsNameNoTooltip] recusa a minha causa!"
 pam_interactions_events.0031.desc:0 "[actor.GetFaith.HighGodName] vos deu lábios para proferir justas palavras. [actor.GetFaith.HighGodName] vos deu mãos para empunhar a espada. E [actor.GetFaith.HighGodName] deu [actor.GetFaith.PriestNeuterPlural] ao mundo para que pudéssemos acatar sua sabedoria. \n\nConsumido pela ganância, proferis palavras injustas. Assolado por medrosa dúvida, detendes a espada que desejais usar contra [target.GetNameNoTier].\n\nE assim a questão chega a isto: deveis acatar minha sabedoria... e deixar o [target.GetTierAsName] em paz."
 pam_interactions_events.0031.opening:0 "Meu obstinado [actor.Custom('GetDaughterSon')],"
 pam_interactions_events.0032.a:0 "Se [actor.GetFaith.HighGodName] assim o deseja, abdicarei de [target.GetNameNoTierNoTooltip]."
 pam_interactions_events.0032.aa.flavor:0 "Para todo o mundo, provarei que: [recipient.GetFaith.HighGodName] negou a estes charlatões pecaminosos toda virtude [recipient.GetFaith.GetAdjectiveNoTooltip]. Tudo o que possuem — e sempre possuirão — é uma audácia descarada."
 pam_interactions_events.0032.aa:0 "Ora, onde está minha pena..."
 pam_interactions_events.0032.b.tt:0 "Se ao menos [actor.GetTitledFirstNameNoTooltip] e [secondary_recipient.GetTitledFirstNameNoTooltip] pudessem ser silenciados tão facilmente..."
 pam_interactions_events.0032.b:0 "Não. Não estou convencido por nenhum de vocês."
 pam_interactions_events.0032.opening:0 "Como árbitro sagrado, dou início às negociações."
 pam_interactions_events.0032_claim:0 "Pois, aos olhos do Todo-Poderoso, a reivindicação de [actor.GetHerHis] a [target.GetNameNoTierNoTooltip] é a mais verdadeira de todas."
 pam_interactions_events.0032_de_jure:0 "Pois [target.GetNameNoTierNoTooltip] é [actor.GetHersHis] por direito #EMP de jure#!."
 pam_interactions_events.0032_intro:0 "Você cuidou de [target.GetNameNoTier] com habilidade, mas é da vontade de [recipient.GetFaith.HighGodName] que este [target.GetTierAsNameNoTooltip] pertença a [actor.GetName]. Por favor, podemos fazer com que você ceda esta terra a [actor.GetHerHim] sem derramamento de sangue?\n\n"
 pam_interactions_events.0033.a.tt:0 "Envie a [recipient.GetTitledFirstNameNoTooltip] uma missiva: apegar-se à terra mantida injustamente de [recipient.GetHerHis] é desprezar a [secondary_recipient.GetFaith.HighGodName] e a [secondary_recipient.GetTitleAsNameNoTooltip]!"
 pam_interactions_events.0033.a:0 "[target.GetNameNoTierNoTooltip] deve ser [actor.GetFirstNamePossessiveNoTooltip], por meu decreto."
 pam_interactions_events.0033.aa:0 "Sim. Está feito."
 pam_interactions_events.0033.b.tt:0 "O mundo está bem ordenado como está. [recipient.GetTitledFirstNameNoTooltipRegnal] deve manter [target.GetNameNoTierNoTooltip]."
 pam_interactions_events.0033.b:0 "Não posso sancionar esta exigência impertinente."
 pam_interactions_events.0033.opening:0 "Guardião da ordem celestial e terrena,"
 pam_interactions_events.0033_claim:0 "Busco cumprir minha reivindicação sobre [target.GetNameNoTier]. Conceda-me sua sanção sagrada, para que [recipient.GetName] possa entregar o [target.GetTierAsName] sem que sangue [actor.GetFaith.GetAdjective] seja derramado.\n\n"
 pam_interactions_events.0033_de_jure:0 "Peço sua ajuda. Proclame que meu domínio se estende justamente sobre [target.GetName] — que é meu por direito de jure. Arme-me com sua sanção, para que eu possa convencer [recipient.GetName] sem derramamento de sangue.\n\n"
 pam_interactions_events.0033_donate:0 "Conceda-me sua ajuda, enriqueça meu domínio com terras, e doarei de bom grado aos seus cofres piosos."
 pam_interactions_events.0033_fallback:0 "A menos que iniciadas por um intercessor sagrado, estas negociações por terra e título darão em nada. Você emprestará sua autoridade sagrada à minha causa?"
 pam_interactions_events.0033_offer_hook:0 "Emprestar sua reputação piedosa à minha causa não é pequeno favor. Apoie-me nestas políticas mortais, e eu o apoiarei nos dias por vir."
 pam_interactions_events.0033_pilgrimage:0 "Em troca de seu assentimento sagrado neste assunto terreno, prometo empreender uma peregrinação: um ato de gratidão pelas bênçãos a mim dadas por [actor.GetFaith.HighGodName]."
 pam_interactions_events.0033_succession:0 "Se falar em meu nome, ofereço a seguinte promessa: caso eu morra como [actor.GetTitleAsName] de [actor.GetPrimaryTitle.GetNameNoTier] — sem filhos de minha casa — [actor.GetPrimaryTitle.GetNameNoTier] pertencerá então à igreja."
 pam_interactions_events.0033_threaten:0 "Se me recusar este pedido... é a #EMP você#! quem poderá explicar a [ROOT.Char.GetFaith.HighGodName] a grande matança e incêndio que trarei a [target.GetNameNoTierNoTooltip]."
 pam_interactions_events.0033_use_hook:0 "Certamente não se esqueceu... de que seu nome está inscrito por meu comando, e as palavras de sua pena devem ser as de meus caprichos...?"
 pam_interactions_events.0034.a:0 "[actor.GetSheHe|U] pode erguer [actor.GetHerHis] estandarte sobre [target.GetNameNoTierNoTooltip]."
 pam_interactions_events.0034.b:0 "Enquanto eu viver, a [target.GetTierAsNameNoTooltip] é minha."
 pam_interactions_events.0034.desc:0 "\n\nAbordado em solo sagrado, suporto estes ataques aos meus direitos em paz. Posso apenas contemplar o que é oferecido...\n\n"
 pam_interactions_events.0034.desc_intro:0 "[actor.GetName] apresenta [actor.GetHerHis] argumento para [target.GetNameNoTier]: [actor.GetSheHe] retoma a exigência protegida e endossada pela fé [recipient.GetFaith.GetAdjective]."
 pam_interactions_events.0034.desc_intro_envoy:0 "[secondary_recipient.GetTitledFirstNameRegnal] argumenta ainda após [target.GetNameNoTier] em nome de [actor.GetNamePossessive] — em nome também, [secondary_recipient.GetSheHe] afirma, da ordem terrena de [recipient.GetFaith.HighGodNamePossessive] e de todo o clero [recipient.GetFaith.GetAdjective]."
 pam_interactions_events.0034.desc_method_gold:0 "Uma pilha de moedas brilhantes. Um preço adequado, afirma o [actor.GetTitleAsNameNoTooltip], por um [target.GetTierAsNameNoTooltip]."
 pam_interactions_events.0034.desc_method_hook:0 "A promessa de que as obrigações mantidas sobre mim por [actor.GetTitledFirstNameNoTooltip] serão anuladas."
 pam_interactions_events.0034.desc_method_legitimacy:0 "Uma grave ameaça contra minha legitimidade. Uma discussão pública hedionda sobre [target.GetNameNoTierNoTooltip], um escândalo que faz de nós dois motivo de chacota..."
 pam_interactions_events.0034.desc_method_piety:0 "A ameaça de que minha já tênue relação com a fé encontre a ruína total. Isto impugnaria a [actor.GetTitledFirstNameNoTooltip] também, mas a piedade de [actor.GetHerHis] é mais bem estabelecida que a minha."
 pam_interactions_events.0034.desc_method_relation:0 "Um fim ruinoso a todo calor, confiança e amor entre nós. O coração de [actor.GetHerHim|U], segundo [actor.GetFirstNameNoTooltip], repousa sobre esta questão de terra.\n\n[actor.GetSheHe|U] me odiará para sempre por negar-lhe isso."
 pam_interactions_events.0034.desc_no_method:0 "...#EMP absolutamente nada#!. Há simplesmente a exigência feita por [target.GetNameNoTier], e a suposição de que temo o desprezo de [recipient.GetFaith.PriestNeuterPlural] e os horrores da guerra."
 pam_interactions_events.0034.desc_target:0 "Não importa que a [target.GetTierAsNameNoTooltip] seja minha por sangue e conquista. Qualquer coisa nesta terra pode ser negociada."
 pam_interactions_events.0034.desc_vassal:0 "Não importa que eu tenha jurado a lealdade de [target.GetHolder.GetName] até a morte. Essa lealdade, ao que parece, pode ser negociada."
 pam_interactions_events.0034.t:0 "A Disputa de [target.GetNameNoTierNoTooltip]"
 pam_interactions_events.0035.a:0 "Por todo [target.GetNameNoTierNoTooltip], ergam meus estandartes bem alto!"
 pam_interactions_events.0035.desc:0 "\n\nA [target.GetTierAsNameNoTooltip] é minha."
 pam_interactions_events.0035.desc_fallback:0 "Tanto poder [actor.GetFaith.HighGodName] investido em nosso [actor.GetFaith.GetAdjective] [actor.GetFaith.PriestNeuterPlural], e em mim! Sem necessidade de exércitos ou guerras — o mundo é reordenado por nosso comando."
 pam_interactions_events.0035.desc_gold:0 "Com palavra enviada aos meus guardiões do tesouro e credores, o preço que pago de bom grado."
 pam_interactions_events.0035.desc_hook:0 "A obrigação que eu mantinha sobre [recipient.GetFirstNameNoTooltip] foi cumprida honrosamente."
 pam_interactions_events.0035.desc_intro:0 "Após alguma deliberação, [recipient.GetFirstNameNicknamed] cede! As negociações para a cessão de [target.GetNameNoTier] são rápidas e frutíferas.\n\n[secondary_recipient.GetTitledFirstNamePossessive] decreto de meus direitos é cumprido."
 pam_interactions_events.0035.desc_legitimacy:0 "E, assim, minhas ameaças de controvérsia e difamação... não precisam se realizar."
 pam_interactions_events.0035.desc_piety:0 "E, assim, minhas ameaças de afogar tanto [recipient.GetFirstNameNoTooltip] quanto a mim em ignomínia ímpia... não precisam se realizar."
 pam_interactions_events.0035.desc_relation:0 "Sim, lágrimas amargas são derramadas, alegria e admiração encerradas. Afligi gravemente [recipient.GetFirstNameNoTooltip] por falta de [target.GetNameNoTierNoTooltip]. Mas..."
 pam_interactions_events.0035.desc_vassal:0 "\n\n[vassal.GetName] jurará [vassal.GetHerHis] lealdade a mim."
 pam_interactions_events.0035.t:0 "[target.GetNameNoTierNoTooltip], Adquirido"
 pam_interactions_events.0036.a:0 "Negar a vontade de um [secondary_recipient.GetTitleAsNameNoTooltip]? Vergonhoso..."
 pam_interactions_events.0036.a_relation:0 "Como [recipient.GetSheHe] pôde me recusar?!?"
 pam_interactions_events.0036.desc:0 "Enviem mais [recipient.GetFaith.PriestNeuterPlural] lamuriantes, enviem hordas de [actor.Custom('GetFighterTermPlural')] para [target_capital.GetTitle.GetNameNoTier] em armas...\"\n\n\"Não desistirei da [target.GetTierAsNameNoTooltip] tão facilmente.\""
 pam_interactions_events.0036.desc_afraid:0 "Envie [recipient.GetFaith.PriestNeuterPlural], e eu os receberei. Envie emissários, e tratarei com eles...\"\n\n\"Mas não posso desistir da [target.GetTierAsNameNoTooltip] assim.\""
 pam_interactions_events.0036.desc_fallback:0 "\"Pode um [actor.GetTitleAsName] e um [secondary_recipient.GetTitleAsNameNoTooltip] conquistar [target.GetNameNoTier] com apenas algumas palavras simples...? Não."
 pam_interactions_events.0036.desc_gold:0 "\"Acha que pode comprar [target.GetNameNoTier] com ouro e prata? Uma transação simples demais para um [target.GetTierAsNameNoTooltip] tão nobre."
 pam_interactions_events.0036.desc_hook:0 "\"[target.GetNameNoTierPossessive] lugar em meu coração está acima de qualquer obrigação que você possa invocar sobre mim."
 pam_interactions_events.0036.desc_intro:0 "[recipient.GetTitledFirstName] dá [recipient.GetHerHis] resposta guarnecido por robustos [recipient.Custom('KnightCulturePluralNoTooltip')|l], escarnecendo da mediação pacífica de [secondary_recipient.GetTitledFirstNamePossessive]:\n\n"
 pam_interactions_events.0036.desc_intro_admin:0 "[recipient.GetTitledFirstName] dá [recipient.GetHerHis] resposta guarnecido por guarda-costas, escarnecendo da mediação pacífica de [secondary_recipient.GetTitledFirstNamePossessive]:\n\n"
 pam_interactions_events.0036.desc_intro_afraid:0 "[recipient.GetTitledFirstName] dá [recipient.GetHerHis] resposta guardado por robustos [recipient.Custom('KnightCulturePluralNoTooltip')|l], desconfortável apesar da mediação pacífica de [secondary_recipient.GetTitledFirstNamePossessive]:\n\n"
 pam_interactions_events.0036.desc_intro_afraid_admin:0 "[recipient.GetTitledFirstName] dá [recipient.GetHerHis] resposta guardado por soldados valorosos, desconfortável apesar da mediação pacífica de [secondary_recipient.GetTitledFirstNamePossessive]:\n\n"
 pam_interactions_events.0036.desc_intro_pious:0 "[recipient.GetTitledFirstName] dá [recipient.GetHerHis] resposta sozinho e inabalado, encorajado pela mediação pacífica de [secondary_recipient.GetTitledFirstNamePossessive]:\n\n"
 pam_interactions_events.0036.desc_legitimacy:0 "\"Fale suas mentiras venenosas. Volte o povo de [target.GetNameNoTier], e todos os outros povos, contra nós dois."
 pam_interactions_events.0036.desc_piety:0 "\"Se for recusado [target.GetNameNoTier], você nos degradará a ambos com pecado e acusação? Muito bem."
 pam_interactions_events.0036.desc_pious:0 "Envia mais corruptos [recipient.GetFaith.PriestNeuterPlural], envia hostes diabólicas para [target_capital.GetTitle.GetNameNoTier] de armas em punho...\"\n\n\"Não abrirei mão do [target.GetTierAsNameNoTooltip] [recipient.GetFaith.HighGodName] que me foi concedido.\""
 pam_interactions_events.0036.desc_relation:0 "\"O [actor.GetTitleAsName] de [actor.GetPrimaryTitle.GetNameNoTier] cospe no meu coração. Rasga minha alma em farrapos. Não ouvirei mais falar de [actor.GetHerHim]."
 pam_interactions_events.0036.t:0 "[target.GetNameNoTierNoTooltip], Negado"
 pam_interactions_events.0037.a.tt:0 "[recipient.GetTitledFirstNameNoTooltip] cedeu a suserania de [recipient.GetHerHis]. E se [actor.GetTitledFirstNameNoTooltip] deseja assumi-la... [actor.GetSheHe] deve vir até [target.GetNameNoTierNoTooltip] bem-armado."
 pam_interactions_events.0037.a:0 "Meu juramento agora está anulado. Ninguém pode me ordenar daqui em diante."
 pam_interactions_events.0037.b.tt:0 "Onde antes meu povo olhava para [recipient.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], imagino que agora olhem para [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 pam_interactions_events.0037.b:0 "[actor.GetPrimaryTitle.GetNameNoTierNoTooltip]? Sutilmente?"
 pam_interactions_events.0037.desc:0 "Lamento a rapidez destas notícias, mas devo informar: o [actor.GetTitleAsName] de [actor.GetPrimaryTitle.GetNameNoTier] é seu suserano de agora em diante.\n\nTal é a vontade de [secondary_recipient.GetTitledFirstNameRegnal], que conduziu as negociações sobre o seu [ROOT.Char.GetPrimaryTitle.GetTierAsName] entre [actor.GetTitledFirstNameNicknamed] e eu mesmo. Assim como foste verdadeiro com [recipient.GetPrimaryTitle.GetNameNoTier], sê verdadeiro com teu novo suserano."
 pam_interactions_events.0037.opening:0 "[ROOT.Char.GetFirstNameNicknamed], [ROOT.Char.GetTitleAsNameNoTooltip] de [ROOT.Char.GetPrimaryTitle.GetNameNoTier],"
 pam_interactions_events.0037_new_liege_tt:0 "[actor.GetShortUIName] tornou-se seu [liege|E]"
 pam_interactions_events.0039.a:0 "Parece que estou sem trabalho..."
 pam_interactions_events.0039.desc:0 "Lamento a rapidez destas notícias, mas devo informar: estou liberando [target.GetName] para [actor.GetTitleAsName] de [actor.GetPrimaryTitle.GetNameNoTier].\n\nTal é a vontade de [secondary_recipient.GetTitledFirstNameRegnal], que conduziu as negociações sobre o seu [ROOT.Char.GetPrimaryTitle.GetTierAsName] entre [actor.GetTitledFirstNameNicknamed] e eu mesmo. Retorna a [recipient.GetCapitalLocation.GetTitle.GetNameNoTier] e logo serás reatribuído."
 pam_interactions_events.0039.opening:0 "[ROOT.Char.GetFirstName], meu leal servo,"
 pam_interactions_events.0039_governorship_transfer_tt:0 "[target.GetName] foi transferido para [actor.GetShortUIName]"
 pam_interactions_events.0039_revoked_governorship_tt:0 "#high Seu #! [governorship|E] foi revogado"
 pam_interactions_events.0050.a.tt:0 "Sob a vossa orientação, este casal quase desfeito poderá encontrar salvação um no outro."
 pam_interactions_events.0050.a:0 "Os caminhos para [recipient.GetFaith.PositiveAfterLife]? Amor. Devoção."
 pam_interactions_events.0050.aa.tt:0 "Ensina a este rústico sem amor o que [puppet_or_actor.GetSheHe] precisa para abandonar todas as necessidades e expectativas da carne..."
 pam_interactions_events.0050.aa:0 "É o desejo carnal que vos traz a miséria."
 pam_interactions_events.0050.b:0 "Honrai os votos que fizestes perante [recipient.GetFaith.GoodGodNames]."
 pam_interactions_events.0050.c:0 "Este desprezo pelo santo matrimônio é blasfêmia!"
 pam_interactions_events.0050.d:0 "Orai, juntos, pela orientação de [recipient.GetFaith.HighGodNamePossessive]."
 pam_interactions_events.0050.desc:0 "Em [puppet_or_actor.GetFaith.ReligiousText], o casamento é uma união sagrada. No mundo terreno dos homens e mulheres... é um tanto menos perfeito.\n\nRecusaste separar [secondary_recipient.GetTitledFirstName] e a mim. O que devemos fazer com os escombros que restam...?"
 pam_interactions_events.0050.opening:0 "[recipient.GetTitledFirstNameRegnal],"
 pam_interactions_events.0060.a.tt:0 "Não produzirei mentiras nobres, mas sim acusações vis contra [secondary_recipient.GetFirstNameNoTooltip]! A família de [secondary_recipient.GetHerHis|U] será forçada a vir em [secondary_recipient.GetHerHis] defesa... e os parentes de [puppet_or_actor.GetFirstNamePossessiveNoTooltip] em [puppet_or_actor.GetHerHis]."
 pam_interactions_events.0060.a:0 "Esta separação merece... um escândalo sangrento."
 pam_interactions_events.0060.b.tt:0 "Conceder um título ao [lease_order.GetName] aliviará este fardo em todas as nossas almas..."
 pam_interactions_events.0060.b:0 "Fazei com que o [puppet_or_actor.GetTitleAsNameNoTooltip] doe terras aos fiéis."
 pam_interactions_events.0060.c:0 "Um favor que merece outro em troca."
 pam_interactions_events.0060.d.tt:0 "Se [secondary_recipient.GetSheHe] fez votos ao [divorcee_joining_order.GetName] há muito tempo, este casamento estaria invalidado! E então, quem melhor para guiar a nova vida de [secondary_recipient.GetFirstNamePossessiveNoTooltip] do que eu?"
 pam_interactions_events.0060.d:0 "Afirmar que [secondary_recipient.GetFirstNameNoTooltip] foi prometido à clerezia."
 pam_interactions_events.0060.desc:0 "[puppet_or_actor.GetTitledFirstName] deseja um fim ao casamento de [puppet_or_actor.GetHerHis], sim, mas por toda a má vontade que [puppet_or_actor.GetSheHe] e [secondary_recipient.GetTitledFirstName] possam ter um com o outro... eles fizeram sua união perante [puppet_or_actor.GetFaith.HighGodName]. E não têm uma razão sólida para terminá-la.\n\nPortanto, devo fabricar alguma mentira para vindicar a anulação deles. Uma blasfêmia que merece, talvez, alguma recompensa..."
 pam_interactions_events.0060.e:0 "Não façais exigências ao casal infeliz."
 pam_interactions_events.0060.t:0 "Justificando o Divórcio"
 pam_interactions_events.0070.a:0 "\"[ROOT.Char.GetFaith.WarGodName] está conosco! #EMP À guerra!#!\""
 pam_interactions_events.0070.b:0 "Deixai o povo de [recipient.GetTitledFirstNamePossessiveNoTooltip] em paz."
 pam_interactions_events.0070.desc:0 "#EMP condenação, ruína — morte pela espada!#!\" chora [puppet_or_actor.GetTitledFirstNameRegnal], e a mensagem de [puppet_or_actor.GetHerHis] é levada às massas inquietas de [secondary_recipient.GetPrimaryTitle.GetNameNoTier].\n\n\"Erguei o santo estandarte de [ROOT.Char.GetFaith.random_GoodGodNames], [ROOT.Char.GetTitledFirstName]! Convoco-vos a expulsar [recipient.GetTitledFirstName] da terra de [target.GetNameNoTierNoTooltip]! A lançar [recipient.GetHerHis] [recipient.GetPrimaryTitle.GetAdjective] [recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)] nas fogueiras de [ROOT.Char.GetFaith.NegativeAfterLife]!\"\n\n"
 pam_interactions_events.0070.desc_intro_heathen:0 "\"Pelo ímpio [recipient.GetFaith.GetReligion.GetAdherentNamePlural] de [target.GetNameNoTier],"
 pam_interactions_events.0070.desc_intro_heretic:0 "\"Pelo herege [recipient.GetFaith.GetAdherentNamePlural] de [target.GetNameNoTier],"
 pam_interactions_events.0070.desc_intro_infidel:0 "\"Pelos infiéis [recipient.GetFaith.GetReligion.GetAdjective] de [target.GetNameNoTier],"
 pam_interactions_events.0070.desc_intro_pagan:0 "\"Pelos pagãos perversos de [target.GetNameNoTier],"
 pam_interactions_events.0070.desc_outro_funding_war:0 "Estas exigências são apoiadas por moedas: o [puppet_or_actor.GetTitleAsNameNoTooltip] promete um cofre de guerra cheio de fundos, para que o meu [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] seja inflamado por algo mais do que apenas fé."
 pam_interactions_events.0070.desc_outro_joining_war:0 "Em verdade, o [puppet_or_actor.GetTitleAsNameNoTooltip] anseia por espalhar o domínio [puppet_or_actor.GetFaith.HighGodNamePossessive]! [puppet_or_actor.GetSheHe|U] jura cavalgar para a guerra [puppet_or_actor.GetHerselfHimself] e colocar as forças de [puppet_or_actor.GetHerHis] à minha disposição."
 pam_interactions_events.0070.t:0 "Uma Guerra pelo [puppet_or_actor.GetTitleAsNameNoTooltip]"
 pam_interactions_events.0071.a:0 "Que aqueles que morrem por esta causa sejam para sempre invejados."
 pam_interactions_events.0071.desc_intro:0 "Em gritos de guerra, em canções, em preces pela vitória — a santa palavra de [ROOT.Char.GetFaith.HighGodNamePossessive] é levada a um [target.GetTierAsNameNoTooltip] de [recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)]! Do principal [ROOT.Char.GetFaith.HouseOfWorship] de [secondary_recipient.GetCapitalLocation.GetTitle.GetNameNoTier], [secondary_recipient.GetName] proclama guerra santa contra"
 pam_interactions_events.0071.desc_intro_heathen:0 "o [recipient.GetTitleAsName] de [recipient.GetPrimaryTitle.GetNameNoTier].\n\nPor [ROOT.Char.GetFaith.WarGodName], [secondary_recipient.GetSheHe] estilhaçará as hostes pagãs! E todos os povos [ROOT.Char.GetFaith.GetReligion.GetAdjective] contemplarão com espanto."
 pam_interactions_events.0071.desc_intro_heretic:0 "os heréticos de [recipient.GetPrimaryTitle.GetAdjective].\n\nEm uma grande maré de sangue, [recipient.GetTitledFirstName] e o seu imundo [recipient.GetHerHis] [recipient.GetFaith.GetAdherentNamePlural] serão varridos da terra! Assim, sempre, àqueles que corrompem a palavra de [ROOT.Char.GetFaith.HighGodName]!"
 pam_interactions_events.0071.desc_intro_infidel:0 "o [recipient.GetTitleAsName] de [recipient.GetPrimaryTitle.GetNameNoTier].\n\nOs infiéis [recipient.GetFaith.GetReligion.GetAdjective], como todos que falharam perante a jihad do Profeta #EMP #!, logo serão forçados a se submeter!"
 pam_interactions_events.0071.desc_intro_pagan:0 "os pagãos [recipient.GetPrimaryTitle.GetAdjective].\n\nComo animais brutos, [recipient.GetTitledFirstName] e seus [recipient.GetHerHis] [recipient.GetCulture.GetCollectiveNoun] certamente se dispersarão com a justa vinda das hostes [secondary_recipient.GetPrimaryTitle.GetNameNoTierPossessive] [secondary_recipient.GetFaith.GetReligion.GetAdjective]!"
 pam_interactions_events.0071.desc_outro_funding_war:0 "\n\nSó a graça de [ROOT.Char.GetFaith.HighGodNamePossessive] promete a vitória de [secondary_recipient.GetTitledFirstNameNoTooltip]. Mas minha generosa doação garante a confiança de [secondary_recipient.GetHerHis]."
 pam_interactions_events.0071.desc_outro_joining_war:0 "\n\nMinhas próprias tropas não ficarão de braços cruzados. Não! Elas invadirão [recipient.GetCapitalLocation.GetTitle.GetNameNoTier] junto com [secondary_recipient.GetTitledFirstNamePossessiveNoTooltip] [secondary_recipient.Custom('KnightCulturePluralNoTooltip')|l]."
 pam_interactions_events.0071.desc_outro_rally_crusaders:0 "\n\nJá, de [secondary_recipient.GetPrimaryTitle.GetNameNoTierNoTooltip] e além, guerreiros fervorosos reúnem-se sob o estandarte de [secondary_recipient.GetTitledFirstNamePossessiveNoTooltip]."
 pam_interactions_events.0071.t:0 "Conquista de [target.GetNameNoTierNoTooltip] por [ROOT.Char.GetFaith.HighGodNamePossessive]"
 pam_interactions_events.0072.a:0 "[puppet_or_actor.GetFaith.HighGodName] deve ser cruel para desencadear tais [puppet_or_actor.GetWomenMen] sobre nós!"
 pam_interactions_events.0072.desc:0 "É tarde demais para ti. Não pode haver arrependimento.\n\nEis que a terra ímpora de [recipient.GetPrimaryTitle.GetNameNoTier] será fendida! Eis que os servos de [puppet_or_actor.GetFaith.DevilName] serão chacinados! Ergui os braços dos fiéis e ordenei [secondary_recipient.GetName] para a vossa destruição!"
 pam_interactions_events.0072.desc_joined_war:0 "Venho a ti agora. Como um missionário, para trazer luz à tua escuridão. Como [puppet_or_actor.GetMotherFather], para trazer punição.\n\nE ao teu lado vem um guerreiro de [puppet_or_actor.GetFaith.GoodGodNames], [secondary_recipient.GetName], [puppet_or_actor.Custom('MotherFatherPossessive')]. Os exércitos de [secondary_recipient.GetHerHis|U] libertarão [target.GetNameNoTier] de seu mal."
 pam_interactions_events.0072.opening:0 "Vilo [recipient.Custom2('GetUnbelieverTerm', puppet_or_actor)],"
 pam_interactions_events.0080.a:0 "Assim seja."
 pam_interactions_events.0080.opening:0 "Pela autoridade investida em [recipient.GetFaith.GetReligion.GetNameNoTooltip],"
 pam_interactions_events.0080:0 "Sabei que ouvi as súplicas de [actor.GetTitledFirstName] e, como [recipient.GetTitleAsNameNoTooltip] de [recipient.GetPrimaryTitle.GetName], imponho uma paz branca à vossa guerra.\n\nQue o derramamento de sangue cristão cesse."
 pam_interactions_events.0081.a:0 "Um decreto justo."
 pam_interactions_events.0081.desc:0 "Sua petição a respeito de [target.GetDefinitiveName] foi ouvida e concedida.\n\n[succession_holder.GetTitledFirstName] deixará de deter [target.GetNameNoTier], e [enforced_heir.GetTitledFirstName] se tornará seu legítimo governante aos olhos de [recipient.GetFaith.HighGodName]."
 pam_interactions_events.0081.opening:0 "Graça e paz do [recipient.GetPrimaryTitle.GetName],"
 pam_interactions_events.0082.a:0 "Ouço e obedeço."
 pam_interactions_events.0082.desc:0 "Saiba que julguei a sucessão de sua casa deficiente.\n\n[target.GetNameNoTier] e seus vassalos devem ser tirados de você e conferidos a [enforced_heir.GetTitledFirstName], seu herdeiro legítimo."
 pam_interactions_events.0082.opening:0 "Pela autoridade do [recipient.GetPrimaryTitle.GetName],"
 pam_interactions_events.0083.a:0 "Assim, minha derrota está decretada."
 pam_interactions_events.0083.desc:0 "Saiba que pesei sua guerra com [puppet_or_actor.GetTitledFirstName] e a achei decidida. Lutar continuadamente seria gastar vidas cristãs em uma causa já perdida, e não terei esse sangue em minhas mãos.\n\nDeclarei a guerra vencida. Aqueles que carregam as decisões da Igreja não ficam sem recompensa."
 pam_interactions_events.0083.opening:0 "Pela autoridade investida em [recipient.GetFaith.GetReligion.GetNameNoTooltip],"
 pam_interactions_events.0090.a.flavor:0 "E, na sabedoria de [actor.GetFaith.HighGodHerHis|U]... [recipient.GetFirstNameNoTooltip] é um [recipient.GetTitleAsNameNoTooltip] profundamente endividado comigo."
 pam_interactions_events.0090.a:0 "[actor.GetFaith.HighGodName] nos concedeu um novo [recipient.GetTitleAsNameNoTooltip]."
 pam_interactions_events.0090.desc:0 "Em verdade, [recipient.GetFaith.HighGodName] contempla [recipient.GetPrimaryTitle.GetNameNoTier] com amoroso favor! Por tua pronúncia, sou feito [recipient.GetTitleAsName] da terra, e os fiéis [recipient.GetFaith.GetAdjective] se regozijam.\n\nCom minha vida, guardarei este [recipient.GetPrimaryTitle.GetTierAsName]. Com minhas leis, governarei sabiamente. Com minha espada e cetro, reinarei firmemente. E atentarei bem ao teu conselho."
 pam_interactions_events.0090.opening:0 "Ó [puppet_or_actor.GetMotherFather|U] do Reino,"
 pam_interactions_events.0091.a:0 "Vigiarei [target.GetNameNoTierNoTooltip] atentamente."
 pam_interactions_events.0091.desc:0 "Sua intercessão é uma bênção além do que eu julgava possível. Longo é o alcance do Santo [ROOT.Char.GetMotherFather|U], e bondoso também — graças sejam dadas a [recipient.GetFaith.HighGodName]!\n\n[target.GetName] é uma terra nobre. Portarei seu título e governarei seus [recipient.GetFaith.GetAdherentNamePlural] com humildade e graça."
 pam_interactions_events.0091.desc_hook:0 "Sua intercessão me deixa com uma grande obrigação. Em uma mão é colocado o cetro do governo; ao redor da outra, a própria mão de [recipient.GetFaith.HighGodName] se aperta com força. Assim deve ser. [target.GetNameNoTier] é uma grande dádiva, e eu um beneficiário grato.\n\nQue se saiba por todas as terras: pela vontade de [ROOT.Char.GetTitledFirstNameRegnal], o [target.GetTierAsName] é meu!"
 pam_interactions_events.0091.desc_hook_theocrat:0 "Sua intercessão me deixa com uma grande obrigação. Em uma mão é colocado o báculo do pastor; ao redor da outra, a própria mão de [recipient.GetFaith.HighGodName] se aperta com força. Assim deve ser, pois sou o servo fiel de [recipient.GetFaith.HighGodHerHis|U]! [target.GetNameNoTier] é uma grande dádiva, e eu um beneficiário grato.\n\nQue se saiba por todas as terras: pela vontade de [ROOT.Char.GetTitledFirstNameRegnal], este [target.GetTierAsName] pertence ao clero!"
 pam_interactions_events.0091.opening:0 "Meu benfeitor,"
 pam_interactions_events.0092.a:0 "Um mandato diretamente de [recipient.GetFaith.PositiveAfterLife]!"
 pam_interactions_events.0092.desc:0 "Seu [target.GetTierAsNameNoTooltip] está proclamado!\n\nGuiado por minhas orações, tomei de fato um interesse especial em seu avanço. Peço apenas que governe bem, para que seu reinado prove ser uma bênção para os [recipient.GetFaith.GetAdherentNamePlural] de [target.GetNameNoTier]."
 pam_interactions_events.0092.desc_hook:0 "Enquanto reza sobre a poderosa dádiva que [recipient.GetFaith.HighGodName] e os prelados [recipient.GetFaith.HighGodHerHis|U] lhe concederam, considere bem quão verdadeiramente digno você é deste [target.GetTierAsName]. Restam, talvez, devoções devotas ainda a serem feitas em seu favor.\n\nEu o ajudarei com meu conselho nisto. Devemos garantir que seu governo em [target.GetNameNoTierNoTooltip] agrade e sirva a [recipient.GetFaith.HighGodName]."
 pam_interactions_events.0092.opening:0 "Meu [ROOT.Char.Custom('GetTitleTierAdjective')] filho,"
 pam_interactions_events.0092.opening_theocratic:0 "Mais reverendo [ROOT.Char.GetFaith.PriestNeuter],"
 pam_interactions_events.0094.a:0 "[target.GetNameNoTierNoTooltip] e [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] estão eternamente unidos."
 pam_interactions_events.0094.desc:0 "É um dia abençoado para o [cleric.GetFaith.GetAdherentNamePlural] de [target.GetNameNoTooltip]! Oh, como eles ansiaram por se tornarem um com seus irmãos e irmãs em [ROOT.Char.GetPrimaryTitle.GetNameNoTier]!\n\nO que vivia nos corações [target.GetAdjectiveNoTooltip] é tornado lei por [cleric.GetFaith.HighGodNamePossessive] [cleric.GetTitleAsName]: os soberanos de muitas terras agora reconhecem o [target.GetTierAsNameNoTooltip] como um reino #EMP de jure#! de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 pam_interactions_events.0094.desc_conversion:0 "Envia a palavra de [cleric.GetFaith.HighGodName] através de [target.GetNameNoTier]! Não poupe a vara em seu povo desobediente, nem o poder de seu [ROOT.Char.Custom('GetFighterTermPlural')] em defesa das virtudes da terra.\n\nO [target.GetTierAsNameNoTooltip] é seu para governar. Ele está submetido à providência de todo [ROOT.Char.GetPrimaryTitle.GetAdjective] [ROOT.Char.GetTitleAsName], #EMP de jure#! até o fim dos tempos."
 pam_interactions_events.0094.opening:0 "Legítimo [ROOT.Char.GetTitleAsName]!"
 pam_interactions_events.0095.a:0 "Maldita seja a cobiça do [de_jure_master.GetFaith.GetAdherentNamePluralNoTooltip]!"
 pam_interactions_events.0095.a_same_faith:0 "De fato, quem pode distribuir reinos senão [ROOT.Char.GetFaith.HighGodName]."
 pam_interactions_events.0095.desc:0 "Você está sujeito a uma bênção de [cleric.GetFaith.HighGodName]! Na sabedoria de [cleric.GetFaith.HighGodHerHis|U], [cleric.GetFaith.HighGodNameSheHe|U] colocou todos os [target.GetName] sob a proteção eterna do [de_jure_master.GetTitleAsName] de [de_jure_master.GetPrimaryTitle.GetName].\n\nComo [cleric.GetTitleAsName], emito este decreto em nome do [target.GetAdjectiveNoTooltip] [cleric.GetFaith.GetAdherentNamePlural], do [de_jure_master.GetTitleAsNameNoTooltip] e daqueles que conhecem a sabedoria nesta divisão #EMP de jure#! dos reinos mortais de [cleric.GetFaith.HighGodNamePossessive]."
 pam_interactions_events.0095.opening:0 "[ROOT.Char.GetTitleAsName] de [target_county.GetNameNoTier] e terras adjacentes,"
 pam_interactions_events.0096.a:0 "Que isto, de fato, prove ser uma união harmoniosa."
 pam_interactions_events.0096.desc:0 "O desmembramento de [target.GetNameNoTier] de [former_de_jure_liege.GetNameNoTier] é um ato muitíssimo sábio e abençoado!\n\nQue seja como você decretou: por todas as eras, [de_jure_master.GetPrimaryTitle.GetNameNoTier] será um baluarte erguendo-se entre este [target.GetTierAsNameNoTooltip] e [ROOT.Char.GetFaith.PositiveAfterLife], para que os fiéis [target.GetAdjectiveNoTooltip] [ROOT.Char.GetFaith.GetAdherentNamePlural] sejam para sempre guiados à luz de [ROOT.Char.GetFaith.HighGodNamePossessive].\n\nIsto adotarei em meu sagrado juramento de [de_jure_master.Custom('GetTitleTierAdjective')]."
 pam_interactions_events.0096.opening:0 "Judiciosa é a mão de [ROOT.Char.GetFaith.random_GoodGodNames]!"
 pam_interactions_events.0097.a:0 "[target.GetNameNoTierNoTooltip] é minha responsabilidade responder."
 pam_interactions_events.0097.desc:0 "Sua petição foi concedida. [target.GetName] permaneceu vago enquanto as almas [ROOT.Char.GetFaith.GetAdherentName] lá ficavam sem pastor, uma pobre maneira de honrar [ROOT.Char.GetFaith.HighGodName].\n\nVista-o com humildade. Um [title|E] que a Igreja concede permanece preocupação da Igreja."
 pam_interactions_events.0097.desc_holy_war:0 "Sua petição foi concedida, e seu voto está escrito onde não será esquecido. [target.GetName] é seu, contudo parte dele ainda se curva àqueles que negam [ROOT.Char.GetFaith.HighGodName].\n\nVá e tome o que seu título já nomeia como seu. Nenhum [ROOT.Char.GetFaith.PriestNeuter] fiel questionará sua guerra, mas daqui a cinco anos perguntaremos o que dela resultou, e um voto deixado ocioso é um voto quebrado."
 pam_interactions_events.0097.opening:0 "Meu [ROOT.Char.Custom('GetTitleTierAdjective')] filho,"
 pam_interactions_events.0100.a:0 "A mancha foi lavada!"
 pam_interactions_events.0100.desc:0 "À vista de [ROOT.Char.GetFaith.HighGodName] e dos fiéis reunidos, [actor.GetTitledFirstName] proclamou-me legítimo. O clero concedeu, com ritos sagrados e um traço de tinta, o que meu nascimento me negara.\n\nBastardo é um nome que não tornarei a ouvir."
 pam_interactions_events.0100.t:0 "Não Mais Bastardo"
 pam_interactions_events.0101.a:0 "Notícia deveras bem-vinda."
 pam_interactions_events.0101.desc:0 "É minha alegria enviar-lhe boas novas. Declarei seu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetFirstNameNoTooltip] legítimo perante [ROOT.Char.GetFaith.HighGodName].\n\nNenhuma lei ou fofoca poderá usar o nascimento de [recipient.GetHerHis] contra [recipient.GetHerHim] por mais tempo."
 pam_interactions_events.0101.opening:0 "Bênçãos sobre a sua casa,"
 pam_interactions_events.0111.a:0 "O pecado é de [recipient.GetHerHis] para carregar."
 pam_interactions_events.0111.desc:0 "Sua exigência foi lida e recusada. Quem mantenho ao meu lado não é de sua conta. Cuide de seu altar, [actor.GetTitledFirstName] — e deixe meu casamento comigo."
 pam_interactions_events.0111.opening:0 "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_interactions_events.0130.a:0 "Louvado seja [actor.GetFaith.HighGodName|U]."
 pam_interactions_events.0130.desc:0 "[actor.GetTitledFirstName] buscou a comunhão, e a comunhão é concedida.\n\n[actor.GetFaith.GetName] não será mais considerado uma heresia.\n\n$pam_1_corinthians_10_17_latin$"
 pam_interactions_events.0130.desc_seeker:0 "[actor.GetFaith.GetName] será recebido novamente na comunhão da Igreja.\n\n$pam_1_corinthians_10_17_latin$"
 pam_interactions_events.0130.opening:0 "Aos fiéis de [actor.GetFaith.GetName],"
 pam_interactions_events.0131.a:0 "Então manteremos nossos próprios altares."
