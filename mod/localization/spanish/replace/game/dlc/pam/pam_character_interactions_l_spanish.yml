 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_LOVER_SECONDARY:0 "\n\n[secondary_recipient.GetFirstNameNoTooltip] comete incesto vil abertamente, em desprezo à união deles! É uma desgraça!"
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_SECONDARY:0 "\n\nÉ uma união incestuosa, um arranjo antinatural, que você estaria desfazendo!"
