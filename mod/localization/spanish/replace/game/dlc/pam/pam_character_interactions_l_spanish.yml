 ASK_FOR_DIVORCE_NOTIFICATION_ADULTERY_TRAIT_SECONDARY:0 "\n\nNão é segredo o motivo de eu lhe implorar isto! [secondary_recipient.GetFirstNameNoTooltip], o lascivo [puppet_or_actor.Custom2('InsultNoun', SCOPE.sC('secondary_recipient'))], tem sido infiel ao(à) meu(minha) [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))]."
 ASK_FOR_DIVORCE_NOTIFICATION_ATTEMPTED_MURDER:0 "\n\nPor [puppet_or_actor.GetFaith.HighGodName], meu maldito [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))] tentou mandar me assassinar!"
 ASK_FOR_DIVORCE_NOTIFICATION_ATTEMPTED_MURDER_SECONDARY:0 "\n\nPor [puppet_or_actor.GetFaith.HighGodName], aquele maldito [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))] tentou mandar assassinar meu(minha) [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))]!"
 ASK_FOR_DIVORCE_NOTIFICATION_EUNUCH:0 "\n\n[puppet_or_actor.GetFaith.HighGodName] quer que eu seja casada com um homem! E [secondary_recipient.GetFirstNameNoTooltip]... não tem masculinidade alguma."
 ASK_FOR_DIVORCE_NOTIFICATION_EUNUCH_SECONDARY:0 "\n\n[puppet_or_actor.GetFaith.HighGodName] quer que meu(minha) [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))] seja casado(a) com um homem! E [secondary_recipient.GetFirstNameNoTooltip]... não tem masculinidade alguma."
 ASK_FOR_DIVORCE_NOTIFICATION_EXPOSED_CHEATING:0 "\n\n[secondary_recipient.GetFirstNameNoTooltip] não tem me sido fiel, e todos sabem disso!"
 ASK_FOR_DIVORCE_NOTIFICATION_EXPOSED_CHEATING_SECONDARY:0 "\n\n[secondary_recipient.GetFirstNameNoTooltip] não tem sido fiel ao(à) meu(minha) [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))], e todos sabem disso!"
 ASK_FOR_DIVORCE_NOTIFICATION_HATRED:0 "\n\nVocê precisa fabricar alguma justificativa, mas por [puppet_or_actor.GetFaith.HighGodName]! Meu ódio por [secondary_recipient.GetFirstNameNoTooltip] já deve ser motivo suficiente."
 ASK_FOR_DIVORCE_NOTIFICATION_HATRED_SECONDARY:0 "\n\nVocê precisa fabricar alguma justificativa, mas por [puppet_or_actor.GetFaith.HighGodName]! Nosso ódio por [secondary_recipient.GetFirstNameNoTooltip] já deve ser motivo suficiente."
 ASK_FOR_DIVORCE_NOTIFICATION_HOSTILE_FAITH:0 "\n\nCertamente [puppet_or_actor.GetFaith.HighGodName] não deseja que eu continue a partilhar minha cama com um(a) desprezível pagão(ã) [secondary_recipient.GetFaith.GetAdjective]?"
 ASK_FOR_DIVORCE_NOTIFICATION_HOSTILE_FAITH_SECONDARY:0 "\n\nCertamente [puppet_or_actor.GetFaith.HighGodName] não deseja que meu(minha) [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))] continue a partilhar [secondary_actor.GetHerHis] cama com um(a) desprezível pagão(ã) [secondary_recipient.GetFaith.GetAdjective]?"
 ASK_FOR_DIVORCE_NOTIFICATION_IMPOTENCE:0 "\n\nNote que [secondary_recipient.GetFirstNameNoTooltip] é acusado(a) de deplorável impotência..."
