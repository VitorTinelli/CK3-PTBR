l_spanish:
 MARANATHA_GLOSS:0 "Um grito aramaico que significa #bold \"Nosso Senhor, vem!\" #! Extraído de 1 Coríntios 16:22, tornou-se uma fórmula de anátema: os amaldiçoados são banidos até o retorno do Senhor."
 MIAPHYSITISM_GLOSS:0 "#bold \"Há uma só Natureza do Verbo de Deus feito carne!\" #! São Cirilo de Alexandria proclamou no Concílio de Éfeso em 431 d.C. Esta visão cristológica conhecida como miafisismo é amplamente seguida pelos ortodoxos orientais."
 pam_investiture_upcoming_council_tt:0 "Um concílio especial da Igreja logo se reunirá para decidir a próxima Nomeação Clerical [doctrine|E] da sua [faith|E]."
 pam_the_christian_church.0051.a:0 "Com Cristo como nosso guia!"
 pam_the_christian_church.0051.b:0 "Devemos ficar de olho nestes seguidores de Cristo."
 pam_the_christian_church.0051.desc.eastern:0 "Cercados pelos inimigos de Cristo, devemos buscar uma causa comum com o Bispo de Roma enquanto nos aproximamos do Juízo Final."
 pam_the_christian_church.0051.desc.heathen_rulers:0 "Nossos vizinhos [christian|E] são povos rudes e briguentos. São como lodo na água, um espelho tosco para os seguidores de [ROOT.Char.GetFaith.HighGodName]. Presos ao passado, suas falsas crenças só os levarão à ruína.\n\nSeus tesouros, por mais escassos que sejam, estão prontos para ser tomados. Seu povo, indisciplinado como é, está maduro para a subjugação."
 pam_the_christian_church.0051.desc.heretic_rulers:0 "O asno na cadeira de [st_peter.GetName] nos chamaria de heréticos por sermos verdadeiros crentes. Se Cristo renascesse, ele certamente se faria fariseu e clamaria novamente pela crucificação de nosso Senhor.\n\nVejam a divisão entre nós que chamamos Cristo de nosso senhor! O falso sacerdote em Roma é o semeador desta lavoura de discórdia.\n\nEste vice-regente de Satanás busca nos martirizar. Em verdade, este cancro deve ser extirpado para a salvação de todos os [christians|E]!"
 pam_the_christian_church.0051.desc.intro:0 "[GetSituation('the_christian_church').GetTopSubRegion.GetName] abrange muitos reinos e é composta por uma miríade de povos diversos, juntamente com suas línguas, culturas e conflitos.\n\nEmbora as disputas doutrinárias sejam tão antigas quanto a Igreja, nestes últimos tempos, assolados pela peste, pela guerra e pela heresia, nossa unidade é testada.\n\nAssim como [st_paul.GetName] o Apóstolo suplicou aos coríntios que buscassem a unidade, todos os [christians|E] devem acatar [st_paul.GetHerHis] orientação e [Glossary( 'non sint in vobis schismata', '1_CORINTHIANS_1_10_LATIN_GLOSS' )]. Caso contrário, nos veremos atolados na heresia, servindo apenas de brinquedo para o Anticristo.\n\n"
 pam_the_christian_church.0051.desc.investiture_temporal:0 "\n\nO concílio deixou as coroas livres para depor os prelados que a Igreja nomeia."
 pam_the_christian_church.0051.desc.oriental_orthodox:0 "\"[Glossary( 'Mia physis tou theou logou sesarkomene', 'MIAPHYSITISM_GLOSS' )]\". Devemos trazer nossos irmãos de volta à luz à medida que nos aproximamos do Juízo Final."
 pam_the_christian_church.0051.desc.unreformed_pagan:0 "Nossos vizinhos de corpo mole, os [christians|E], seguem um deus fraco e ciumento, discutindo como crianças sobre a natureza de sua boneca. Todo esse tempo sua vigilância é entorpecida, suas espadas definham, pois há tanto tempo não festejam com derramamento de sangue honesto.\n\nEles esperam nos enviar homens santos para espalhar sua fraqueza em nossas terras. Poderíamos nós fazer-lhes uma visita e pilhar seus cofres! Por nosso exemplo, talvez aprendam novamente a ser fortes."
 pam_the_christian_church.0051.desc.western:0 "Com o poder do Bispo de Roma diminuído, devemos remendar essas fissuras na fé à medida que nos aproximamos do Juízo Final."
 pam_the_christian_church.0051.t:0 "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0052.a:0 "Que o Senhor ilumine nosso caminho!"
 pam_the_christian_church.0052.b:0 "$pam_the_christian_church.0051.b$"
 pam_the_christian_church.0052.desc.eastern:0 "Cercados pelos inimigos de Cristo, devemos curar a corrupção em Roma ou ser consumidos por ela."
 pam_the_christian_church.0052.desc.heathen_rulers:0 "\"Nossa Igreja está em crise!\", clamam os [christians|E].\n\nAinda bem que admitem o que sempre soubemos. Esses tolos pagãos só podem esperar um dia seguir nosso exemplo e abraçar os caminhos de [ROOT.Char.GetFaith.HighGodName].\n\nSeus tesouros, por mais escassos que sejam, estão prontos para serem tomados. Seu povo, por mais indisciplinado que seja, está maduro para a subjugação."
 pam_the_christian_church.0052.desc.heretic_rulers:0 "Este Anticristo vestindo as roupas de São Pedro deve ser detido!"
 pam_the_christian_church.0052.desc.intro:0 "Um coro de vozes ressoa na escuridão que envolve [GetSituation('the_christian_church').GetTopSubRegion.GetName].\n\n#EMP \"Roma se atira para representar uma Sodoma moderna!\"#!\n\n#EMP \"O Papa se faz de cafetão e prostituta!\"#!\n\nMesmo aqueles com uma visão mais moderada devem admitir que a Igreja está em crise e que a reforma deve ser buscada."
 pam_the_christian_church.0052.desc.oriental_orthodox:0 "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0052.desc.unreformed_pagan:0 "Nossos vizinhos de espírito fraco, os [christians|E], clamam: \"Nosso fim está próximo! Nosso Papa é tão selvagem quanto um pagão.\"\n\nAo menos uma dessas coisas é verdadeira. Ajudemos-lhe a encontrar o fim que tanto invocam!"
 pam_the_christian_church.0052.desc.western:0 "A mudança deve primeiro ser encontrada em Roma, e só então [GetSituation('the_christian_church').GetTopSubRegion.GetNameNoTooltip] poderá se curar."
 pam_the_christian_church.0052.t:0 "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0053.a:0 "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0053.b:0 "$pam_the_christian_church.0051.b$"
 pam_the_christian_church.0053.desc.eastern:0 "Embora Roma afirme buscar apenas a conversão daqueles fora de [GetSituation('the_christian_church').GetTopSubRegion.GetName], devemos permanecer vigilantes, caso nos roubem nosso [ROOT.Char.GetRite.GetName] ou, pior, voltem suas espadas recém-afiadas com sangue pagão contra seus irmãos cristãos."
 pam_the_christian_church.0053.desc.heathen_rulers:0 "Nossos vizinhos, os [christians|E], convertem à força os idólatras, quando estes valem pouco mais do que para ser massacrados.\n\nEnquanto suas espadas estão apontadas para longe de nós, [ROOT.Char.GetFaith.HighGodName] abre uma janela de oportunidade. Seus tesouros, por mais escassos que sejam, estão prontos para serem tomados. Seu povo, por mais indisciplinado que seja, está maduro para a subjugação."
 pam_the_christian_church.0053.desc.heretic_rulers:0 "O pretendente em Roma espera converter os pagãos ao seu culto equivocado! Este anticristo não se contenta em simplesmente envenenar as mentes de [christians|E], mas seu apetite perverso exige trazer aqueles ingênuos idólatras para seu abraço infernal."
 pam_the_christian_church.0053.desc.intro:0 "Devemos nos regozijar com o grande progresso de nossa missão! As fronteiras de [GetSituation('the_christian_church').GetTopSubRegion.GetName] se expandem enquanto brutos pagãos aprendem a trilhar o caminho de Cristo.\n\nInfelizmente, nem todos dão as boas-vindas aos ensinamentos da Igreja. Não temam, se eles negam nossos missionários, podem aprender nossas orações na ponta da espada!\n\n"
 pam_the_christian_church.0053.desc.oriental_orthodox:0 "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0053.desc.unreformed_pagan:0 "Os [christians|E] vêm às nossas terras com seus homens santos. Se os mandamos embora, eles voltam com suas espadas.\n\nEnquanto muitos de nós tentam manter os caminhos de [ROOT.Char.GetFaith.HighGodName], há alguns que veem vantagens em servir a este homem-deus, este Cristo. O poder de alguém torna-se ordenado divinamente, a igreja pode servir como nossos mensageiros e, o mais atraente de tudo, eles cobram impostos."
 pam_the_christian_church.0053.desc.western:0 "Devemos ter cuidado para que estes cristãos recém-nascidos sejam guiados para adorar [ROOT.Char.GetRite.GetName], conforme sancionado pela sede de São Pedro."
 pam_the_christian_church.0053.t:0 "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0054.a:0 "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0054.b:0 "$pam_the_christian_church.0051.b$"
 pam_the_christian_church.0054.desc.eastern:0 "Roma, ou seja qual for a câmara curial que se autoproclama árbitra da oikoumene, esforça-se para polir seus ritos: novos cânones, novos juramentos, novas reprimendas para antigos pecados. Nós observamos, repreendemos e fortalecemos nossos próprios sínodos, para que uma temperança ocidental não seja confundida com um jugo universal."
 pam_the_christian_church.0054.desc.heathen_rulers:0 "Os [christianity.GetAdherentNamePlural] estão ensaiando uma grande renovação de suas leis e altares, com cada facção clamando por um serviço mais puro a um deus de sofrimento. Podemos notar seus novos slogans, mas o fio de nossos machados ainda responde de forma mais clara do que seus conselhos."
 pam_the_christian_church.0054.desc.heretic_rulers:0 "Os sectários de Roma agora discutem sobre a reforma! O que chamam de renovação é a reordenação do mesmo jugo, apertado por uma autodefesa ainda mais mortal. Que a reforma deles rache crânios em suas próprias basílicas antes de lembrarem das nossas."
 pam_the_christian_church.0054.desc.intro.common:0 "Nossa fé em Deus pode ser inabalável, mas muitos perderam a fé na Igreja. Antes exemplares em suas ações semelhantes às de Cristo, o clero agora discute sobre as doutrinas mais básicas."
 pam_the_christian_church.0054.desc.intro.head:0 "$pam_the_christian_church.0054.desc.intro.common$\n\n[christianity.GetReligiousHead.GetTitledFirstName] tem uma tarefa árdua pela frente, mas a Igreja não está além de ser salva.[christianity.GetReligiousHead.GetHerHim]\n\n"
 pam_the_christian_church.0054.desc.intro.no_head:0 "$pam_the_christian_church.0054.desc.intro.common$\n\nAinda assim, a Igreja não está além de ser salva!\n\n"
 pam_the_christian_church.0054.desc.investiture_spiritual:0 "\n\nO concílio decidiu a favor do direito de nomeação da Igreja, mantido por toda a vida."
 pam_the_christian_church.0054.desc.oriental_orthodox:0 "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0054.desc.unreformed_pagan:0 "Os [christianity.GetAdherentNamePlural] estão rasgando suas próprias vestes clericais, esperando que Deus não note os remendos. Se estão ocupados consertando casulas e anais, talvez enviem menos clérigos para perturbar nossos bosques e santuários fluviais."
 pam_the_christian_church.0054.desc.western:0 "Embora alguns chamem isso de endireitar o leme da reforma, o povo desconfia de inovações e pode ser mais receptivo se isso for retratado como um 'retorno aos velhos hábitos'."
 pam_the_christian_church.0054.t:0 "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0055.a:0 "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0055.b:0 "$pam_the_christian_church.0051.b$"
 pam_the_christian_church.0055.desc.eastern:0 "Reis ocidentais discutem com Roma sobre anéis e cajados, e seus pecados mancham toda a Igreja.\n\n"
 pam_the_christian_church.0055.desc.heathen_rulers:0 "$pam_the_christian_church.0054.desc.heathen_rulers$"
 pam_the_christian_church.0055.desc.heretic_rulers:0 "Roma chora tirania por causa da investidura, mas colocaria nossos professores em correntes se pudesse alcançá-los! Tirem as coleiras de seus pescoços, fariseus, e só então nos deem lições de moral!"
 pam_the_christian_church.0055.desc.intro.common:0 "Em todo o território de [GetSituation('the_christian_church').GetTopSubRegion.GetName], a contienda entre o altar e o trono já não é mero mexerico."
 pam_the_christian_church.0055.desc.intro.head:0 "$pam_the_christian_church.0055.desc.intro.common$\n\nPríncipes leigos impõem juramentos sobre os bispos de [christianity.GetReligiousHeadTitle.GetNamePossessive|U], como se a ordenação fosse apenas mais uma fazenda para arrendar. Enquanto isso, [christianity.GetReligiousHeadTitle.GetName] proíbe mãos coroadas de abençoar mitras que não consagração.\n\n"
 pam_the_christian_church.0055.desc.intro.no_head:0 "$pam_the_christian_church.0055.desc.intro.common$\n\nSem um pastor que todos possam reconhecer, cada trono nomeia bispos como bem entende; as vestes são santas, mas as consagrações cheiram a moeda, e não a incenso.\n\n"
 pam_the_christian_church.0055.desc.oriental_orthodox:0 "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0055.desc.unreformed_pagan:0 "Enquanto [christianity.GetAdherentNamePlural] discutem sobre quem consagra um bispo, a coroa ou a capa, menos missionários olham para o nosso lado. Que reis e pontífices se engasguem com as cartas uns dos outros; sua divisão deixa nossos bosques em paz."
 pam_the_christian_church.0055.desc.western:0 "Se curvarmos o báculo demais em direção ao cetro, os dois podem até acabar se confundindo.\n\n"
 pam_the_christian_church.0055.t:0 "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0056.a:0 "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0056.b:0 "$pam_the_christian_church.0051.b$"
 pam_the_christian_church.0056.desc.eastern:0 "Os exércitos ocidentais marcham em direção à Terra Santa.\n\n"
 pam_the_christian_church.0056.desc.heathen_rulers:0 "$pam_the_christian_church.0053.desc.heathen_rulers$"
 pam_the_christian_church.0056.desc.heretic_rulers:0 "Seus pregadores de guerra clamam por cruzada enquanto negligenciam suas próprias terras: que os romanos se exaustem em dunas distantes."
 pam_the_christian_church.0056.desc.intro:0 "Por toda a extensão de [GetSituation('the_christian_church').GetTopSubRegion.GetName], os fiéis clamam pela libertação do Santo Sepulcro. Cruzes são polidas para a marcha, relíquias penhoradas em cofres de guerra.\n\nO fervor arde com paixão, mas se essa febre esfriar, o zelo pode se transformar em dúvida tão rapidamente quanto a cinza flutua de uma pira.\n\n"
 pam_the_christian_church.0056.desc.oriental_orthodox:0 "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0056.desc.unreformed_pagan:0 "$pam_the_christian_church.0053.desc.unreformed_pagan$"
 pam_the_christian_church.0056.desc.western:0 "O aço pode conseguir o que os sermões não alcançam.\n\n"
 pam_the_christian_church.0056.t:0 "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0057.a:0 "$pam_the_christian_church.0054.a$"
 pam_the_christian_church.0057.b:0 "$pam_the_christian_church.0051.b$"
 pam_the_christian_church.0057.desc.eastern:0 "Ainda erguemos orações em canto enquanto as mesas ocidentais gemem sob pesados tratados. A harmonia é bem-vinda, mas suas brigas escolares não devem invadir nossas chancelarias."
 pam_the_christian_church.0057.desc.heathen_rulers:0 "$pam_the_christian_church.0054.desc.heathen_rulers$"
 pam_the_christian_church.0057.desc.heretic_rulers:0 "$pam_the_christian_church.0054.desc.heretic_rulers$"
 pam_the_christian_church.0057.desc.intro.common:0 "As contendas da Igreja chegam ao fim. [GetSituation('the_christian_church').GetTopSubRegion.GetName] acolhe uma era de paz e comunhão."
 pam_the_christian_church.0057.desc.intro.head:0 "$pam_the_christian_church.0057.desc.intro.common$ sob o olhar atento de [christianity.GetReligiousHeadTitle.GetNamePossessive|U].\n\n"
 pam_the_christian_church.0057.desc.intro.no_head:0 "$pam_the_christian_church.0057.desc.intro.common$.\n\nMesmo sem um pastor incontestável, a fé deve raciocinar novamente.\n\n"
 pam_the_christian_church.0057.desc.oriental_orthodox:0 "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0057.desc.unreformed_pagan:0 "$pam_the_christian_church.0054.desc.unreformed_pagan$"
 pam_the_christian_church.0057.desc.western:0 "As escolas podem acumular argumento sobre argumento, mas a maioria das almas ainda alcança a Deus pelas palavras de um sacerdote.\n\nNão devemos esquecer que a nossa é uma religião do povo."
 pam_the_christian_church.0057.t:0 "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0058.a:0 "Que seja decidido."
 pam_the_christian_church.0058.desc:0 "Os longos anos de [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] chegam ao clímax. Um concílio é convocado para decidir, de uma vez por todas, quem investirá o clero: a Igreja ou a coroa."
 pam_the_christian_church.0058.t:0 "Um Concílio é Convocado"
 pam_the_christian_church.0059.a:0 "Que eles deliberem."
 pam_the_christian_church.0059.desc.located:0 "As convocações são enviadas, e os pais da Igreja se reunem para o Concílio de Investidura, convocado por [investiture_convene_host.GetTitledFirstName] em [investiture_convene_location.GetName]. Para toda a Cristandade, sua decisão determinará quem investe o clero: a Igreja ou a coroa."
 pam_the_christian_church.0059.desc:0 "As convocações são enviadas, e os pais da Igreja se reunem para o Concílio de Investidura. Para toda a Cristandade, sua decisão determinará quem investe o clero: a Igreja ou a coroa."
 pam_the_christian_church.0059.t:0 "O Concílio se Reúne"
 pam_the_christian_church.0060.a.tt:0 "Contribui para [GetDecisionWithKey('pam_cause_great_schism_decision').GetName] [decision|E]"
 pam_the_christian_church.0060.a:0 "Eu estou com [schism_mainline_rite.GetNameNoTooltip]."
 pam_the_christian_church.0060.b.tt:0 "Contribui para [GetDecisionWithKey('pam_cause_great_schism_decision').GetName] [decision|E]"
 pam_the_christian_church.0060.b:0 "Eu estou com [schism_competitor_rite.GetNameNoTooltip]."
 pam_the_christian_church.0060.c.tt:0 "Contribui para [GetDecisionWithKey('pam_prevent_great_schism_decision').GetName] [decision|E]"
 pam_the_christian_church.0060.c:0 "Um corpo deve ter dois braços."
 pam_the_christian_church.0060.desc:0 "A Cristandade equilibra-se no fio da navalha. [schism_mainline_rite.GetName] reivindica a herança dos apóstolos, e [schism_competitor_rite.GetName] se recusa a ceder.\n\nO próprio Cristo alertou que [Glossary( 'Omne regnum divisum contra se desolabitur', 'MATTHEW_12_25_LATIN_GLOSS' )]. Se a ferida fester através desta crise, a Igreja pode nunca mais ter uma só voz."
 pam_the_christian_church.0060.t:0 "Não haja divisões entre vós"
 pam_the_christian_church.0061.a.bystander:0 "Que pena quando irmãos lutam."
 pam_the_christian_church.0061.a.shame:0 "Verdadeiramente uma pena."
 pam_the_christian_church.0061.a:0 "Que assim seja."
 pam_the_christian_church.0061.desc.bystander:0 "Chegam notícias de [schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip]: os legados impuseram uma sentença de anátema sobre o altar, e [schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip] respondeu à altura.\n\nAqueles que se chamavam de uma só Igreja agora estão divididos em [schism_western_faith.GetAdherentNamePlural] e [schism_eastern_faith.GetAdherentNamePlural]. A querela deles nunca foi minha, e a fé [ROOT.Char.GetFaith.GetName] permanece inalterada por isso, mas é algo amargo de se ver."
 pam_the_christian_church.0061.desc:0 "Embaixadores de [schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip] lançaram sua sentença sobre o altar:\n\n\"Seja [schism_eastern_faith.GetReligiousHead.GetFirstName], falsamente chamado [schism_eastern_faith.ReligiousHeadName], e todos os seus seguidores anatemizados. [Glossary( 'Maranatha', 'MARANATHA_GLOSS' )] com todos os heréticos! Sim, com o diabo e seus anjos, a menos que se arrependam.\"\n\n\"Este documento ímpio será anatemizado junto com aqueles que o editaram, escreveram ou tiveram qualquer envolvimento com ele\", responde [schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip].\n\nOs fiéis estão divididos em [schism_western_faith.GetAdherentNamePlural] e [schism_eastern_faith.GetAdherentNamePlural]. Minha alma agora é [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]."
 pam_the_christian_church.0061.t:0 "O Grande Cisma"
 pam_the_christian_church.0062.a.peacemaker:0 "Nenhuma sé isolada governará o resto."
 pam_the_christian_church.0062.a:0 "Bendito seja o Senhor."
 pam_the_christian_church.0062.b.self:0 "Então todo o rebanho responderá a mim."
 pam_the_christian_church.0062.b:0 "Que [new_head_of_faith.GetTitledFirstNameNoTooltip] nos guie a todos."
 pam_the_christian_church.0062.desc:0 "A ferida que ameaçava dividir a Cristandade foi costurada. Graças aos esforços de [schism_peacemaker.GetTitledFirstName], as sés em conflito partilham a mesma mesa mais uma vez.\n\n[Glossary( 'Solliciti servare unitatem Spiritus in vinculo pacis. Unum corpus, et unus Spiritus... Unus Dominus, una fides, unum baptisma.', 'EPHESIANS_4_3_6_LATIN_GLOSS' )]\n\n[ROOT.Char.GetFaith.GetName] permanece em comunhão."
 pam_the_christian_church.0062.t:0 "Comunhão Preservada"
 pam_the_christian_church.0063.a:0 "O mesmo Deus nos ouve a ambos."
 pam_the_christian_church.0063.b.failure:0 "[schism_dissenter.GetTitledFirstNameNoTooltip] não será movido"
 pam_the_christian_church.0063.b.success:0 "[schism_dissenter.GetTitledFirstNameNoTooltip] atravessa comigo"
 pam_the_christian_church.0063.b:0 "Deixe-me mostrar por que atravessei."
 pam_the_christian_church.0063.c:0 "Guarde seus temores para si mesmo."
 pam_the_christian_church.0063.desc:0 "Atravessei para [ROOT.Char.GetRite.GetName], mas [schism_dissenter.GetTitledFirstName] não me acompanhou. [schism_dissenter.GetSheHe|U] não cessa de se preocupar com minha alma e com o rebanho que abandonei:\n\n\"Você nos deixou\", diz [schism_dissenter.GetSheHe] calmamente. \"Quando a Igreja for despedaçada... e ela será... você e eu ficaremos em lados opostos da ferida.\""
 pam_the_christian_church.0063.t:0 "Aquele que Ficou para Trás"
 pam_the_christian_church.0064.a.tt:0 "O progresso do Grande Cisma atingiu o seu limite"
 pam_the_christian_church.0064.a:0 "Deus, não nos desampare."
 pam_the_christian_church.0064.desc.opening.self_competitor:0 "Minha voz ressoa contra a de [schism_mainline_head.GetTitledFirstName]."
 pam_the_christian_church.0064.desc.opening.self_mainline:0 "Minha voz ressoa contra a de [schism_competitor_head.GetTitledFirstName]."
 pam_the_christian_church.0064.desc.opening:0 "As vozes de [schism_mainline_head.GetTitledFirstName] e [schism_competitor_head.GetTitledFirstName] ressoam uma contra a outra. "
 pam_the_christian_church.0064.desc:0 "Não vejo caminho de volta à concórdia entre [schism_mainline_rite.GetName] e [schism_competitor_rite.GetName].\n\nO aviso das Escrituras tornou-se uma sentença: [Glossary( 'Omne regnum divisum contra se desolabitur', 'MATTHEW_12_25_LATIN_GLOSS' )]. A comunhão dentro de [christianity.GetName] ainda não se rompeu, mas a ferida se abrirá. Sua hora é inevitável."
 pam_the_christian_church.0064.t:0 "A Ferida se Abrirá"
 pam_the_christian_church_not_hof_trigger_tt:0 "Você não é o Chefe da Fé"
