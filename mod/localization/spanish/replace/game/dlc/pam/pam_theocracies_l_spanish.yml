 can_be_appointed_interaction_can_inherit_tt:0 "[THIS.Char.GetWomenMen|U] deve ser capaz de herdar [titles|E] #weak (não [GetTrait('disinherited').GetName( THIS.Char )], [GetTrait('gallivanter').GetName( THIS.Char )] ou [GetTrait('order_member').GetName( THIS.Char )])#!"
 can_be_appointed_interaction_clergy_tt:0 "[THIS.Char.GetWomenMen|U] deve ser um membro do [clergy|E], ou [THIS.Char.GetFaith.GetName] deve ter a $doctrine_theocracy_lay_clergy_name$ [doctrine|E]"
