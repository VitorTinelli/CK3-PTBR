 church_benefices_law:0 "[treasury_cardinal_budget_benefices|E]"
 church_benefices_law_singular:0 "$church_benefices_law$"
 ecclesiastical_lease:0 "Arrendamento Eclesiástico"
 ecclesiastical_lease_desc:0 "Esta jurisdição está [leased|E] arrendada a um [realm_priest|E] da [ecclesiastical|E] [faith|E] do detentor.\n\nEles contribuirão diretamente com [tax|E] e [levies|E] para o seu [liege|E] (se tiverem aprovação), seu [religious_superior|E] e seu [head_of_faith|E].\n\nSeu superior religioso é o [holder|E] da [clerical_title|E] eclesiástica à qual pertence a capital de seu suserano. Caso contrário, será o [head_of_faith|E] de sua fé."
 no_benefices:0 "Sem Benefícios"
 only_theocratic_tt:0 "[THIS.Char.GetShortUINamePossessive|U] [government|E] não permite nomeações [theocratic|E] #weak ([THIS.Char.GetGovernment.GetAdjective])#!"
 theocracy_lease:0 "Arrendamento Teocrático"
 theocracy_lease_desc:0 "Esta jurisdição está [leased|E] arrendada a um [realm_priest|E] da [faith|E] do detentor.\n\nEles contribuirão com [tax|E] e [levies|E] tanto para o seu [liege|E] (se tiverem aprovação) quanto para o seu [religious_superior|E].\n\nSeu superior religioso é o [realm_priest|E] de seu [liege|E], caso tenham a mesma fé. Caso contrário, será o [head_of_faith|E] de sua fé."
 treasury_budget_cardinal_increase_large:0 "Grande Aumento de [treasury_cardinal_budget|E]"
