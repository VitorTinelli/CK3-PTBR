l_spanish:
 TRAVEL_NAME_FOR_activity_investiture_council:0 "Jornada de [Character.GetFirstNamePossessiveNoTooltip] para o Conselho da Investidura"
 activity_investiture_council:0 "O Conselho da Investidura"
 activity_investiture_council_desc:0 "Um concílio convocado no fim da [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] para resolver, de uma vez por todas, quem deve investir o clero: a Igreja ou a coroa."
 activity_investiture_council_guest_desc:0 "Compareça ao Conselho da Investidura e empreste sua voz à nomeação do clero."
 activity_investiture_council_host_desc:0 "Convoque o Conselho da Investidura para resolver a nomeação do clero."
 activity_investiture_council_province_desc:0 "Hospede o Conselho da Investidura aqui."
 activity_window_character_conclusion_church_rep:0 "Conservador\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_conclusion_crown_rep:0 "Inovador\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_prelate_guest_arrived:0 "Prelado\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_secular_guest_arrived:0 "[activity_guest_short|E]\n[Character.GetShortUINameNoTooltip|U]"
 investiture_council_phase_debate:0 "O Debate"
 investiture_council_phase_debate_desc:0 "O concílio debate quem deve investir o clero, a Igreja ou a coroa, e submete a questão a voto."
 investiture_council_phase_summons:0 "Convocação"
 investiture_council_phase_summons_desc:0 "Os fiéis se reunem enquanto se espalham as notícias do próximo acerto de contas sobre a nomeação do clero."
 pam_investiture_council_concluded_spiritual_log:0 "[CHARACTER.GetTitledFirstName] proclamou o veredito do concílio: o clero é investido unicamente pela Igreja, e nenhuma coroa pode destituí-lo."
 pam_investiture_council_concluded_spiritual_log_title:0 "A Igreja Prevalece"
 pam_investiture_council_concluded_temporal_log:0 "[CHARACTER.GetTitledFirstName] proclamou o veredito do concílio: a Igreja investe o clero, mas um senhor secular ainda pode depor um prelado que o desaponte."
 pam_investiture_council_concluded_temporal_log_title:0 "A Coroa Prevalece"
 pam_investiture_council_conclusion.intro:0 "O Conselho da Investidura chegou ao seu fim."
 pam_investiture_council_conclusion.spiritual:0 "Os pais reunidos sustentaram o direito exclusivo da Igreja de investir o clero, pondo-o além do alcance de qualquer coroa: uma vez consagrado, um prelado permanece no cargo por toda a vida.\n\nA longa [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] terminou; a Igreja emerge triunfante e volta-se imediatamente para reformar a si mesma a partir de dentro."
 pam_investiture_council_conclusion.temporal:0 "Os padres reunidos deixaram a nomeação do clero para a Igreja, mas reservaram aos senhores seculares o direito de destituir qualquer prelado que os desaponte. A longa [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] chegou ao fim, mas a autoridade da Igreja encontra-se diminuída e a sua unidade, fragilizada."
 pam_investiture_council_events.0001.a.tt:0 "O debate começará assim que o resto dos convidados tiver chegado."
 pam_investiture_council_events.0001.a:0 "Sinto-me honrado por estar entre eles."
 pam_investiture_council_events.0001.desc:0 "[arrival_host.GetTitledFirstName] saúda-me calorosamente no limiar; além, [arrival_host.GetHerHim], prelados e príncipes da fé agitam-se. Em breve, a grande questão da nomeação do clero será submetida à assembleia."
 pam_investiture_council_events.0001.t:0 "Chegada"
 pam_investiture_council_events.0002.a:0 "Assim seja."
 pam_investiture_council_events.0002.desc:0 "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] seguiu o seu curso. Agora, os fiéis reunidos devem decidir como o clero será nomeado daqui em diante, e pretendo zelar para que a autoridade da Igreja seja mantida."
 pam_investiture_council_events.0002.t:0 "Um Acerto de Contas para a Igreja"
 pam_investiture_council_events.0003.a:0 "Chegou o momento."
 pam_investiture_council_events.0003.desc:0 "A assembleia silencia-se à medida que o concílio se inicia sobre a questão que colocou a Igreja contra a coroa: qual delas investirá o clero. Cada voz presente pesará na resposta."
 pam_investiture_council_events.0003.t:0 "O Debate Começa"
 pam_investiture_council_events.0004.a:0 "Largue tudo e rume a cavalo para o concílio."
 pam_investiture_council_events.0004.b:0 "Deixe-os decidir sem mim."
 pam_investiture_council_events.0004.desc:0 "Chegam notícias de que o Concílio de Investidura está a convocar para deliberar sobre a nomeação do clero, e eu estou a muitos dias de viagem. Poderia largar tudo e cavalgar a toda a pressa para fazer ouvir a minha voz, ou deixar os prelados decidirem na minha ausência."
 pam_investiture_council_events.0004.t:0 "O Concílio o Conoca"
 pam_investiture_council_events.0010.a:0 "Defender a autoridade da Igreja."
 pam_investiture_council_events.0010.desc:0 "Submeto a questão ao concílio: o direito de investir o clero pertence à Igreja, e nenhuma coroa pode desfaz o que ela consagrou. Que a assembleia fale, e que as suas vozes decidam."
 pam_investiture_council_events.0010.t:0 "O Direito da Igreja"
 pam_investiture_council_events.0031.a:0 "Apoiar a Igreja: nomeação pela Igreja e com mandato vitalício."
 pam_investiture_council_events.0031.b:0 "Defender as coroas: nomeação pela Igreja, mas revogável pelos seus senhores."
 pam_investiture_council_events.0031.desc:0 "O Chefe da Fé reivindica o direito exclusivo da Igreja de nomear o clero, além do poder de qualquer coroa para o anular. Os senhores seculares guardariam para si o direito de destituir um prelado que os desaponte. O concílio aguarda a vossa voz."
 pam_investiture_council_events.0031.t:0 "Qual é a Vossa Posição?"
 pam_investiture_council_events.0032.a:0 "Influenciar a assembleia para a minha causa."
 pam_investiture_council_events.0032.b:0 "Deixar estar."
 pam_investiture_council_events.0032.desc:0 "A votação ainda não está selada. Uma palavra persuasiva no ouvido certo pode trazer os indecisos do lado oposto para a minha causa, embora um apelo desajeitado possa sair caro."
 pam_investiture_council_events.0032.t:0 "Uma Palavra no Ouvido Certo"
 pam_investiture_council_events.0033.a:0 "Vamos tentar subornar para votar na igreja."
 pam_investiture_council_events.0033.b:0 "Vamos tentar convencer a votar na igreja."
 pam_investiture_council_events.0033.c:0 "Tentarei subornar em prol do temporal."
 pam_investiture_council_events.0033.d:0 "Tentarei convencer em prol do temporal."
 pam_investiture_council_events.0033.desc:0 "Não tenho voto nesta assembleia de eclesiásticos, mas a um senhor secular nunca faltam meios. Uma bolsa pesada suaviza consciências, e um argumento bem fundamentado comove os indecisos. Posso emprestar o meu peso à causa da Igreja ou à da coroa, ou permanecer em silêncio."
 pam_investiture_council_events.0033.e:0 "Ficar fora disto."
 pam_investiture_council_events.0033.t:0 "O Peso de uma Coroa"
 pam_investiture_council_events.0050.a:0 "Muito bem."
 pam_investiture_council_events.0050.desc.named:0 "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] chega ao fim, e um concílio resolverá a nomeação do clero.\n\n[investiture_nominee_host.GetTitledFirstName] assume a tarefa de o acolher. Como chefe da fé, espera-se que compareça e expresse a sua opinião sobre a decisão, embora seja informado do resultado mesmo que não compareça."
 pam_investiture_council_events.0050.desc:0 "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] chega ao fim, e um concílio deve resolver a nomeação do clero. Como não o acolherá pessoalmente, um arcebispo sénior da fé assume a tarefa em seu lugar. Poderá ainda comparecer e juntar a sua voz."
 pam_investiture_council_events.0050.t:0 "Um Concílio Reúne-se"
 pam_investiture_council_events.0060.a:0 "Ler o decreto."
 pam_investiture_council_events.0060.desc.spiritual:0 "O concílio concluiu-se e, como não estava entre nós, registei imediatamente o resultado em pergaminho. Os padres reunidos afirmaram o direito exclusivo da Igreja de investir o clero, colocando-o fora do alcance de qualquer coroa: aqueles que ela consagra mantêm o seu cargo vitaliciamente. A [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] terminou."
 pam_investiture_council_events.0060.desc.temporal:0 "O concílio concluiu-se e, como não estava entre nós, registei imediatamente o resultado em pergaminho. Pesa-me escrever que os padres reunidos, embora tenham deixado a nomeação nas nossas mãos, concederam aos senhores seculares permissão para destituir qualquer prelado que os desaponte. A [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] terminou."
 pam_investiture_council_events.0060.opening:0 "Santíssimo Padre,"
 pam_investiture_council_events.0061.a:0 "Assim está resolvido."
 pam_investiture_council_events.0061.desc.spiritual:0 "Chegam notícias da vossa capela vindas do grande concílio. Os padres reunidos afirmaram o direito exclusivo da Igreja de investir o clero, e aqueles que ela nomeia estão agora fora do vosso poder de destituir. A longa [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] terminou, e o báculo retém o que a coroa cobiçava."
 pam_investiture_council_events.0061.desc.temporal:0 "Chegam notícias da vossa capela vindas do grande concílio. Os padres reunidos deixaram a nomeação do clero para a Igreja, mas qualquer prelado que vos desaponte continua a ser vosso para destituir do cargo. A longa [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] terminou, e a coroa prevaleceu sobre o báculo."
 pam_investiture_council_events.0061.opening:0 "Meu senhor,"
 pam_investiture_council_haste_modifier:0 "A Pressa para o Concílio"
 pam_investiture_council_haste_modifier_desc:0 "Este [ruler|E] abandonou todos os outros assuntos para comparecer ao Concílio de Investidura antes da sua decisão sobre a nomeação de [clergy|E]."
 pam_investiture_council_start_log:0 "[CHARACTER.GetTitledFirstName] abriu o concílio para resolver a nomeação do clero."
 pam_investiture_council_start_log_title:0 "O Concílio de Investidura Reúne-se"
 pam_investiture_council_summons_clergy_value:0 "Convocado para o Concílio de Investidura"
 pam_investiture_crisis_lapsed_toast:0 "A [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetNameNoTooltip] Termina"
 pam_investiture_crisis_lapsed_tt:0 "Sem nenhum concílio reunido, a [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] caduca a favor da Igreja: o clero passa a ser nomeado pela Igreja e detém o seu cargo vitaliciamente."
 pam_investiture_persuade_target_spiritual_tt:0 "Há votantes ainda por conquistar para o lado da Igreja"
 pam_investiture_persuade_target_temporal_tt:0 "Há votantes ainda por conquistar para o lado da coroa"
 pam_investiture_persuade_toast_backfired_tt:0 "O seu passo em falso afastou #N [investiture_persuader.MakeScope.Var('investiture_swayed_count').GetValue|0]#! votantes para o outro lado."
 pam_investiture_persuade_toast_swayed_tt:0 "Conquistou #P [investiture_persuader.MakeScope.Var('investiture_swayed_count').GetValue|0]#! votantes."
 pam_investiture_persuade_toast_title:0 "A Assembleia Responde"
 pam_investiture_persuade_tt_backfire_conservative:0 "Um passo em falso conduz #N 5#! votantes para a causa da coroa."
 pam_investiture_persuade_tt_backfire_innovator:0 "Um passo em falso conduz #N 5#! votantes para a causa da Igreja."
 pam_investiture_persuade_tt_good_conservative:0 "Conquiste até #P 5#! votantes para a causa da coroa."
 pam_investiture_persuade_tt_good_innovator:0 "Persuadir até #P 5#! eleitores para a causa da Igreja."
 pam_investiture_persuade_tt_great_conservative:0 "Persuadir até #P 10#! eleitores para a causa da coroa."
 pam_investiture_persuade_tt_great_innovator:0 "Persuadir até #P 10#! eleitores para a causa da Igreja."
 pam_investiture_persuade_tt_modest_conservative:0 "Persuadir até #P 3#! eleitores para a causa da coroa."
 pam_investiture_persuade_tt_modest_innovator:0 "Persuadir até #P 3#! eleitores para a causa da Igreja."
 pam_investiture_resolution_spiritual_tt:0 "Substituiu a [GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName] Nomeação Clerical [doctrine|E] por [GetDoctrineType('doctrine_clerical_succession_spiritual_fixed_appointment').GetBaseName]"
 pam_investiture_resolution_temporal_tt:0 "Substituiu a [GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName] Nomeação Clerical [doctrine|E] por [GetDoctrineType('doctrine_clerical_succession_spiritual_appointment').GetBaseName]"
