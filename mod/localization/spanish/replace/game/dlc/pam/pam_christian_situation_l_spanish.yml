 concord:0 "Concórdia"
 concord_desc:0 "A concórdia é um capítulo estabelecido para a Cristandade. A Igreja dedica sua energia à razão, à lei e à teologia sistemática, e os clássicos redescobridores ensinam a responder à dúvida com argumentos em vez de crise."
