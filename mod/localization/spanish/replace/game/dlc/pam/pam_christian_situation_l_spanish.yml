l_spanish:
 CHRISTIAN_CHURCH_EVENT_CURRENT_CHAPTER:0 "[the_christian_church_chapter_type|E] [SituationPhase.GetName]"
 CHRISTIAN_CHURCH_INVESTITURE_TIME_REMAINING:0 "Próximo concílio: [GetGameTimeDifferenceForDiffDays( Situation.MakeScope.VarRemaining('investiture_council_countdown') )]"
 CHRISTIAN_CHURCH_INVESTITURE_TIME_REMAINING_TT:0 "Tempo restante antes que [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] alcance seu clímax e seja resolvido.\n\nQuando o tempo se esgotar, um Concílio de Investidura se reunirá para disputar a [GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName] Nomeação Clerical [doctrine|E], substituindo-a por [GetDoctrineType('doctrine_clerical_succession_spiritual_fixed_appointment').GetBaseName] ou [GetDoctrineType('doctrine_clerical_succession_spiritual_appointment').GetBaseName] com base nos votos. [rulers|E] seculares podem forçar [clergy|E] a votar de outra forma usando $PAM_INVESTITURE_CONFLICT_WAR_CB_NAME$ [casus_belli|E], ou obtendo [puppets|E]."
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_BALANCED:0 "#weak A próxima votação está equilibrada.#!"
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_CHURCH_AHEAD:0 "#weak A Igreja leva vantagem#!"
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_CROWN_AHEAD:0 "#weak As coroas levam vantagem#!"
 CHRISTIAN_CHURCH_SCHISM_PROGRESS:0 "Progresso de [schism|e]: [Situation.MakeScope.ScriptValue('pam_great_schism_progress_value')|V0] / [Situation.MakeScope.ScriptValue('pam_great_schism_progress_threshold_value')|V0]"
 CHRISTIAN_CHURCH_SCHISM_PROGRESS_TT:0 "Quão perto as querelas entre [GetRiteByKey('roman_rite').GetAdherentNamePlural] e [GetRiteByKey('byzantine_rite').GetAdherentNamePlural] trouxeram a Cristandade para [Concept( 'schism', 'Grande Cisma')|E].\n\nQuando as queixas se acumulam, a Igreja pode se dividir. $GREAT_SCHISM_PROGRESS_EFFECT_TT$\n\n@alert_icon! #alert_trial [GetFaithByKey( 'christian_faith').GetName] não pode estabelecer um [head_of_faith|E] enquanto [Concept( 'schism', 'Grande Cisma')|E] permanecer inconclusivo#!\n\n#help Aumentado por:\n$BULLET_WITH_TAB$[GetActivityType('activity_ecumenical_council').GetName] votando pela remoção de [core_tenet|E] ou [doctrine|E] de [rites|E]\n$BULLET_WITH_TAB$Uma querela entre os Ritos antes dos debates de [GetActivityType('activity_ecumenical_council').GetName]\n$BULLET_WITH_TAB$Uma [war|E] entre [kings|E] ou governantes maiores dos Ritos dentro de [GetSituation('the_christian_church').GetName]\n$BULLET_WITH_TAB$Um [holy_site|E] convertendo-se de Rito para Rito\n$BULLET_WITH_TAB$Rebaixar [holy_site|E] de qualquer Rito\n$BULLET_WITH_TAB$Um [head_of_rite|E] assassinado pelo outro Rito#!"
 GREAT_SCHISM_PROGRESS_EFFECT_TT:0 "O próximo [GetSituationType('the_christian_church').GetPhaseType('saeculum_obscurum').GetName] desbloqueará o acesso a [GetDecisionWithKey('pam_prevent_great_schism_decision').GetName] e [GetDecisionWithKey('pam_cause_great_schism_decision').GetName] [decisions|E], e #V $pam_sway_schism_stance_interaction$#! [interaction|E]"
