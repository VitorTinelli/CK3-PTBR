 conversion_phase:0 "Conversão"
 conversion_phase_desc:0 "Uma estação de novos batizados. Os reis erguem cruzes sobre fortalezas fluviais e vilas mercantes, negociantes missionários e exércitos reais disputam as almas das marcas fronteiriças, e a conversão de um único soberano pode inclinar povos inteiros para a mesma pia batismal."
