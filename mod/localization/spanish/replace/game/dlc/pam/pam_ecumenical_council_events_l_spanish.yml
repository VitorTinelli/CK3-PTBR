 ecumenical_council_events.0080.a:0 "Assim fica decidido."
 ecumenical_council_events.0080.desc.failed:0 "Os votos foram contados. [lead_portrait.GetTitledFirstName] se adianta:\n\n\"O Espírito Santo nos guiou através do concílio, e estamos decididos. A proposta falha. [host.GetFaith.GetName] permanece como era.\""
 ecumenical_council_events.0080.desc.outcome.failed:0 "\n\n[ec_current_topic.GetName( ROOT.GetCharacter.GetRite )] não se torna [activity.Custom('GetEcumenicalCouncilCurrentProposal')]."
 ecumenical_council_events.0080.desc.outcome.passed.make_core:0 "\n\n[ec_current_topic.GetName( ROOT.GetCharacter.GetRite )] torna-se central, substituindo [core_tenet_to_swap.GetName( ROOT.GetCharacter.GetRite )]."
 ecumenical_council_events.0080.desc.outcome.passed:0 "\n\n[ec_current_topic.GetName( ROOT.GetCharacter.GetRite )] torna-se [activity.Custom('GetEcumenicalCouncilCurrentProposal')]."
 ecumenical_council_events.0080.desc.passed:0 "Os votos foram contados. [lead_portrait.GetTitledFirstName] se adianta:\n\n\"O Espírito Santo nos guiou através deste concílio, e estamos decididos. O assunto está resolvido — a favor!\""
 ecumenical_council_events.0080.t:0 "Votação do Concílio"
 ecumenical_council_events.0081.a:0 "Assim fica decidido."
 ecumenical_council_events.0081.desc.conservative_failed:0 "Nós que defendemos a tradição mantivemos a linha. A proposta é rejeitada, e nosso rito preservado."
 ecumenical_council_events.0081.desc.conservative_passed:0 "Apesar de nossa defesa da tradição, os reformadores venceram a votação. A mudança é adotada, apesar de nossas hesitações."
 ecumenical_council_events.0081.desc.innovator_failed:0 "Embora tenhamos pressionado por mudanças, a contagem ficou aquém contra nós. Os velhos caminhos persistem, e nossos argumentos são postos de lado por ora."
 ecumenical_council_events.0081.desc.innovator_passed:0 "Nós que argumentamos pela mudança prevalecemos. Nossos argumentos persuadiram o concílio o suficiente, e o novo caminho foi adotado."
 ecumenical_council_events.0081.desc.neutral:0 "O concílio emite seu veredito, e o assunto está resolvido."
 ecumenical_council_events.0081.t:0 "O Concílio Vota"
 ecumenical_council_events.0082.a.tt.doctrine_1:0 "[GetPlayer.GetFaith.GetName] agora possui [ec_letter_doctrine_1.GetDescriptiveName( GetPlayer.GetFaith )]"
 ecumenical_council_events.0082.a.tt.tenet_1:0 "[ec_letter_tenet_1.GetName( GetPlayer.GetRite )] agora é [ec_council.Custom('GetEcumenicalCouncilTenet1Proposal')]"
 ecumenical_council_events.0082.a.tt.tenet_2:0 "[ec_letter_tenet_2.GetName( GetPlayer.GetRite )] agora é [ec_council.Custom('GetEcumenicalCouncilTenet2Proposal')]"
 ecumenical_council_events.0082.a:0 "A Igreja age sem mim."
 ecumenical_council_events.0082.desc.unchanged:0 "O clero se levantou, e sua longa discussão não alterou sequer uma vírgula. Permanecemos como antes."
 ecumenical_council_events.0082.desc:0 "O clero se levantou e formou uma resolução que agora nos vincula a todos."
 ecumenical_council_events.0082.opening:0 "A [ROOT.GetCharacter.GetTitledFirstName],"
 ecumenical_council_events.0101.conservatives_custom:0 "[ec_conservatives|E] Sábios (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0101.conservatives_custom_halved:0 "[ec_conservatives|E] Sábios (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0101.desc:0 "Estudiosos trocam citações pelo salão, cada verso acirrando a disputa.\n\n\"O [lead_conservative.GetFaith.ReligiousText|U] é claro,\" insiste [lead_conservative.GetTitledFirstName]. \"[ec_current_topic.GetName( activity.GetHost.GetRite )] deve permanecer inalterado.\"\n\n\"Leia por completo a passagem que cito,\" responde [lead_innovator.GetTitledFirstName]. \"Você verá que ela praticamente exige esta mudança!\""
 ecumenical_council_events.0101.innovators_custom:0 "[ec_innovators|E] Sábios (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0101.innovators_custom_halved:0 "[ec_innovators|E] Sábios (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0101.oppose:0 "Apoiar [lead_conservative.GetTitledFirstNameNoTooltip]: o texto deve permanecer inalterado."
 ecumenical_council_events.0101.oppose_duel.failure:0 "A interpretação deles sobre a mudança prevalece"
 ecumenical_council_events.0101.oppose_duel.success:0 "O círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cede"
 ecumenical_council_events.0101.oppose_duel.success_halved:0 "Alguns do círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cedem"
 ecumenical_council_events.0101.oppose_duel:0 "Contestar que a mudança nasce da passagem."
 ecumenical_council_events.0101.support:0 "Apontar a falta de contexto na passagem deles."
 ecumenical_council_events.0101.support_duel.failure:0 "Eles ainda dizem que o texto é claramente contra isso"
 ecumenical_council_events.0101.support_duel.success:0 "Eles aceitam a mudança originada do texto"
 ecumenical_council_events.0101.support_duel.success_halved:0 "Alguns aceitam a mudança originada do texto"
 ecumenical_council_events.0101.support_duel:0 "Superá-los com erudição mais profunda."
 ecumenical_council_events.0101.t:0 "Os Sábios se Pronunciam"
 ecumenical_council_events.0102.conservatives_custom:0 "[ec_conservatives|E] Devotos (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0102.conservatives_custom_halved:0 "[ec_conservatives|E] Devotos (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0102.desc:0 "Os mais devotos entre os reunidos dividiram-se em dois círculos de oração sobre a proposta.\n\n[lead_innovator.GetTitledFirstName] convoca [lead_innovator.GetFaith.HighGodName] a afirmar que suas revelações são um reflexo da vontade de [lead_innovator.GetFaith.HighGodHerHis|U]. O círculo de [lead_conservative.GetTitledFirstNamePossessive] responde de imediato, implorando a [lead_innovator.GetFaith.random_GoodGodNames] que mantenha as tradições que há tanto servem à Igreja."
 ecumenical_council_events.0102.innovators_custom:0 "[ec_innovators|E] Devotos (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0102.innovators_custom_halved:0 "[ec_innovators|E] Devotos (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0102.oppose:0 "Juntar-se às orações pela antiga lei."
 ecumenical_council_events.0102.oppose_duel.failure:0 "As orações deles se mantêm; seu sermão não surte efeito"
 ecumenical_council_events.0102.oppose_duel.success:0 "Seu sermão persuade os clérigos reformistas"
 ecumenical_council_events.0102.oppose_duel.success_halved:0 "Seu sermão persuade alguns dos clérigos reformistas"
 ecumenical_council_events.0102.oppose_duel:0 "Pregar pela antiga lei até que o círculo deles ceda."
 ecumenical_council_events.0102.support:0 "Juntar-se às orações pela mudança."
 ecumenical_council_events.0102.support_duel.failure:0 "As orações deles se mantêm; seu sermão não surte efeito"
 ecumenical_council_events.0102.support_duel.success:0 "Seu sermão persuade os clérigos resistentes"
 ecumenical_council_events.0102.support_duel.success_halved:0 "Seu sermão persuade alguns dos clérigos resistentes"
 ecumenical_council_events.0102.support_duel:0 "Pregar a mudança até que o círculo deles ceda."
 ecumenical_council_events.0102.t:0 "Orações Concorrentes"
 ecumenical_council_events.0103.conservatives_custom:0 "[ec_conservatives|E] Mundanos (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0103.conservatives_custom_halved:0 "[ec_conservatives|E] Mundanos (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0103.desc:0 "\"Sua intransigência será a nossa ruína!\" grita [lead_innovator.GetTitledFirstName].\n\n\"Os fiéis de [lead_conservative.GetPrimaryTitle.GetNameNoTooltip] agradeceriam a um patrono que restaurasse seu [lead_conservative.Custom('GetFaithTemple')],\" diz [lead_conservative.GetTitledFirstName]."
 ecumenical_council_events.0103.innovators_custom:0 "[ec_innovators|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0103.innovators_custom_halved:0 "[ec_innovators|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0103.oppose:0 "Oferecer patrocínio."
 ecumenical_council_events.0103.oppose_duel.failure:0 "Todos ainda protestam contra a intransigência"
 ecumenical_council_events.0103.oppose_duel.success:0 "Eles aprendem a temer tal blasfêmia"
 ecumenical_council_events.0103.oppose_duel.success_halved:0 "Alguns evitam sua blasfêmia"
 ecumenical_council_events.0103.oppose_duel:0 "Avisar que a inovação empobrecerá o rebanho de [lead_innovator.GetHerHis]."
 ecumenical_council_events.0103.support:0 "Oferecer patrocínio."
 ecumenical_council_events.0103.support_duel.failure:0 "Todos ainda retêm seus votos"
 ecumenical_council_events.0103.support_duel.success:0 "Eles veem o valor da inovação"
 ecumenical_council_events.0103.support_duel.success_halved:0 "Alguns aceitam o valor da inovação"
 ecumenical_council_events.0103.support_duel:0 "Detalhar como o rebanho de [lead_conservative.GetHerHis] pode se enriquecer."
 ecumenical_council_events.0103.t:0 "O Preço da Mudança"
 ecumenical_council_events.0104.conservatives_custom:0 "[ec_conservatives|E] de sua [dynasty|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0104.conservatives_custom_halved:0 "[ec_conservatives|E] de sua [dynasty|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0104.desc:0 "Os clérigos do meu sangue debatem para qual lado a Casa [ROOT.Char.GetHouse.GetName] deve pender. [lead_conservative.GetTitledFirstName] diz: \"Nossa casa não deve ser vista dividida, e não ficarei do lado de [host.GetTitledFirstName]!\"\n\nPor trás das costas de [lead_conservative.GetTitledFirstNamePossessiveNoTooltip], [lead_innovator.GetTitledFirstName] faz caretas: nem todos da minha casa se opõem à inovação."
 ecumenical_council_events.0104.innovators_custom:0 "[ec_innovators|E] da sua [dynasty|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0104.innovators_custom_halved:0 "[ec_innovators|E] da sua [dynasty|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0104.oppose:0 "Apoiar [lead_conservative.GetFirstNameNoTooltip] contra a inovação."
 ecumenical_council_events.0104.oppose_duel.failure:0 "[lead_innovator.GetTitledFirstNameNoTooltip] mantém a posição"
 ecumenical_council_events.0104.oppose_duel.success:0 "Seus kin rejeitam a mudança"
 ecumenical_council_events.0104.oppose_duel.success_halved:0 "Poucos de seus parentes recusam a mudança"
 ecumenical_council_events.0104.oppose_duel:0 "Avisar [lead_innovator.GetFirstNameNoTooltip]: a casa não deve estar dividida."
 ecumenical_council_events.0104.support:0 "Pedir a [ROOT.Char.GetHouse.GetNameNoTooltip] que fique a favor."
 ecumenical_council_events.0104.support_duel.failure:0 "Sua Casa está dividida"
 ecumenical_council_events.0104.support_duel.success:0 "Sua Casa ficará a favor"
 ecumenical_council_events.0104.support_duel.success_halved:0 "Alguns ficarão a favor"
 ecumenical_council_events.0104.support_duel:0 "Conquistar aqueles que recusam a inovação."
 ecumenical_council_events.0104.t:0 "Clérigos do Meu Sangue"
 ecumenical_council_events.0105.conservatives_custom:0 "[ec_conservatives|E] da sua [culture|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0105.conservatives_custom_halved:0 "[ec_conservatives|E] da sua [culture|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0105.desc:0 "Os sons familiares de [ROOT.Char.GetCulture.GetLanguage.GetName] destacam-se entre as muitas línguas faladas aqui. É, naturalmente, [lead_conservative.GetTitledFirstName] importunando nossos parentes.\n\n\"Nós, [lead_conservative.GetCulture.GetCollectiveNounNoTooltip], não temos apreço por tais inovações!\" [lead_conservative.GetSheHe] esbraveja.\n\n\"Mas você quer que sejamos culpados pela Igreja estagnada?\" [lead_innovator.GetTitledFirstName] desafia."
 ecumenical_council_events.0105.innovators_custom:0 "[ec_innovators|E] da sua [culture|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0105.innovators_custom_halved:0 "[ec_innovators|E] da sua [culture|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0105.oppose:0 "Apoiar a tradição de [ROOT.Char.GetCulture.GetNameNoTooltip]!"
 ecumenical_council_events.0105.oppose_duel.failure:0 "A convicção de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] se mantém"
 ecumenical_council_events.0105.oppose_duel.success:0 "O círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cede"
 ecumenical_council_events.0105.oppose_duel.success_halved:0 "Alguns do círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cedem"
 ecumenical_council_events.0105.oppose_duel:0 "Argumentar em favor da tradição."
 ecumenical_council_events.0105.support:0 "Você não fala por todos nós, [lead_conservative.GetFirstNameNoTooltip]."
 ecumenical_council_events.0105.support_duel.failure:0 "Eles ainda rejeitam a inovação"
 ecumenical_council_events.0105.support_duel.success:0 "Todos os presentes concordam em apoiar"
 ecumenical_council_events.0105.support_duel.success_halved:0 "Alguns concordam em apoiar"
 ecumenical_council_events.0105.support_duel:0 "Nós, [lead_conservative.GetCulture.GetCollectiveNounNoTooltip], temos um histórico de inovação."
 ecumenical_council_events.0105.t:0 "Sensibilidades de [ROOT.Char.GetCulture.GetNameNoTooltip]"
 ecumenical_council_events.0106.conservatives_custom:0 "[ec_conservatives|E] entre seus [vassals|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0106.conservatives_custom_halved:0 "[ec_conservatives|E] entre seus [vassals|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0106.desc:0 "Meus vassalos e eu nos reunimos em uma das câmaras.\n\n\"Mesmo aqui, seu suserano é seu senhor\", adverte [lead_conservative.GetTitledFirstName] aos outros. \"Se nosso [ROOT.Char.GetTitleAsName] não falar a favor desta inovação herética, suas vozes também devem emudecer.\"\n\n\"Nosso [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] nos mantém na linha em outros lugares. Mas aqui não!\" retruca [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0106.desc_innovator:0 "Meus vassalos e eu nos reunimos em uma das câmaras.\n\n\"Um suserano merece uma resposta\", diz [lead_conservative.GetTitledFirstName]. \"Infelizmente, temo que este assunto esteja além de [ROOT.Char.GetHerHim]. Apenas [lead_conservative.GetFaith.HighGodName] guia nossos corações, e [lead_conservative.GetFaith.HighGodName] traça o caminho que devemos defender sem hesitar!\"\n\n\"Ah, mas os desejos do nosso [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] não desafiam [ROOT.Char.GetFaith.HighGodNamePossessive]\", responde [lead_innovator.GetTitledFirstName]. \"Considere seu juramento e atente para a sabedoria de [ROOT.Char.GetHerHis]!\""
 ecumenical_council_events.0106.innovators_custom:0 "[ec_innovators|E] entre seus [vassals|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0106.innovators_custom_halved:0 "[ec_innovators|E] entre seus [vassals|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0106.oppose:0 "Apoiar [lead_conservative.GetTitledFirstNameNoTooltip]: isto está além de um suserano."
 ecumenical_council_events.0106.oppose_duel.failure:0 "A resposta deles se mantém"
 ecumenical_council_events.0106.oppose_duel.success:0 "O círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cede"
 ecumenical_council_events.0106.oppose_duel.success_halved:0 "Alguns do círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cedem"
 ecumenical_council_events.0106.oppose_duel:0 "Contestar que os desejos de um senhor não desafiam a Deus."
 ecumenical_council_events.0106.support:0 "\"Como [ROOT.Char.GetTitleAsNameNoTooltip], sou o representante de [ROOT.Char.GetFaith.HighGodName].\""
 ecumenical_council_events.0106.support_duel.failure:0 "Seus vassalos reservam sua lealdade para [lead_conservative.GetFaith.HighGodName]"
 ecumenical_council_events.0106.support_duel.success:0 "Eles obedecerão a você"
 ecumenical_council_events.0106.support_duel.success_halved:0 "Alguns concordam em obedecer a você"
 ecumenical_council_events.0106.support_duel:0 "Exigir o serviço leal que estes vassalos juraram."
 ecumenical_council_events.0106.t:0 "Fidelidade Devida"
 ecumenical_council_events.0107.conservatives_custom:0 "Jovens [ec_conservatives|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0107.conservatives_custom_halved:0 "Jovens [ec_conservatives|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0107.desc:0 "Um grupo de clérigos mais jovens conversa animadamente, claramente entusiasmados com o que é, para muitos deles, seu primeiro concílio.\n\n\"Um movimento está surgindo aqui: podem sentir o toque de [lead_innovator.GetFaith.HouseholdGodName]? Deixemos nossa marca na Igreja, com uma ousadia há muito esquecida!\", diz [lead_innovator.GetTitledFirstName].\n\n\"Tolice desprezível! Devemos nos curvar aos Pais da Igreja e rejeitar essas inovações repugnantes\", insiste [lead_conservative.GetTitledFirstName]."
 ecumenical_council_events.0107.innovators_custom:0 "Jovens [ec_innovators|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0107.innovators_custom_halved:0 "Jovens [ec_innovators|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0107.oppose:0 "[lead_conservative.GetTitledFirstNameNoTooltip] diz a verdade."
 ecumenical_council_events.0107.oppose_duel.failure:0 "Eles desprezam sua covardia"
 ecumenical_council_events.0107.oppose_duel.success:0 "O círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cede"
 ecumenical_council_events.0107.oppose_duel.success_halved:0 "Alguns do círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cedem"
 ecumenical_council_events.0107.oppose_duel:0 "Condenar os perigos da ousadia!"
 ecumenical_council_events.0107.support:0 "Uma manhã para a fé!"
 ecumenical_council_events.0107.support_duel.failure:0 "Eles continuam desdenhosos"
 ecumenical_council_events.0107.support_duel.success:0 "Os olhos deles brilham com promessa"
 ecumenical_council_events.0107.support_duel.success_halved:0 "Alguns prometem apoio"
 ecumenical_council_events.0107.support_duel:0 "Rebater esta covardia conservadora."
 ecumenical_council_events.0107.t:0 "Seu Primeiro Concílio"
 ecumenical_council_events.0108.a:0 "Fique comigo, [friend.GetFirstNameNoTooltip]."
 ecumenical_council_events.0108.b:0 "Você pode manter suas próprias convicções."
 ecumenical_council_events.0108.conservatives_custom:0 "[ec_conservatives|E] entre seus [friends|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0108.desc:0 "É um conforto encontrar [friend.GetTitledFirstName], meu [ROOT.Char.Custom2('RelationToMe', friend)], entre a assembleia.\n\n\"Certamente você sabe onde eu estou,\" diz [friend.GetSheHe]. \"Diga a palavra e eu sigo.\""
 ecumenical_council_events.0108.innovators_custom:0 "[ec_innovators|E] entre seus [friends|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0108.t:0 "Entre Amigos"
 ecumenical_council_events.0109.conservatives_custom:0 "[ec_conservatives|E] reformistas (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0109.conservatives_custom_halved:0 "[ec_conservatives|E] reformistas (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0109.desc:0 "Longe do plenário, um pequeno conselho parece estar em andamento. Quem estaria tentando refazer a fé sem mim?\n\n\"Se esta questão pode ser questionada, por que não o resto?\" avisa [lead_conservative.GetTitledFirstName]. \"Não abrirei essa porta para convidar a incerteza para a casa de [lead_conservative.GetFaith.HighGodName].\"\n\n\"Você não sente coceira para se livrar de tradições que não nos servem mais?\" responde [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0109.innovators_custom:0 "[ec_innovators|E] reformistas (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0109.innovators_custom_halved:0 "[ec_innovators|E] reformistas (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0109.oppose:0 "Fechar essa porta silenciosamente."
 ecumenical_council_events.0109.oppose_duel.failure:0 "Eles ainda desejam discórdia e ruína"
 ecumenical_council_events.0109.oppose_duel.success:0 "Eles não arriscarão o caos"
 ecumenical_council_events.0109.oppose_duel.success_halved:0 "Alguns recuam em seu apoio"
 ecumenical_council_events.0109.oppose_duel:0 "\"Você sempre negocia no caos, [lead_innovator.GetFirstNameNoTooltip]?\""
 ecumenical_council_events.0109.support:0 "Um ouvido simpático servirá."
 ecumenical_council_events.0109.support_duel.failure:0 "Eles fecham fileiras contra você"
 ecumenical_council_events.0109.support_duel.success:0 "Eles não barrarão o caminho"
 ecumenical_council_events.0109.support_duel.success_halved:0 "Alguns dão ouvidos a você"
 ecumenical_council_events.0109.support_duel:0 "Eu sei como fazer os cautelosos ouvirem..."
 ecumenical_council_events.0109.t:0 "Descontentamentos Silenciosos"
 ecumenical_council_events.0110.conservatives_custom:0 "[ec_conservatives|E] ambiciosos (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0110.conservatives_custom_halved:0 "[ec_conservatives|E] ambiciosos (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0110.desc:0 "\"É apenas uma pequena emenda!\" diz [lead_innovator.GetTitledFirstName], \"e nos colocamos em boa posição como candidatos a [lead_innovator.GetFaith.ReligiousHeadName], se ajudarmos a aprová-la.\"\n\n\"Sua ambição desenfreada passa dos limites e será a ruína de todos nós,\" zomba [lead_conservative.GetTitledFirstName]."
 ecumenical_council_events.0110.innovators_custom:0 "[ec_innovators|E] ambiciosos (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0110.innovators_custom_halved:0 "[ec_innovators|E] ambiciosos (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0110.oppose:0 "A soberba precede a queda"
 ecumenical_council_events.0110.oppose_duel.failure:0 "A promessa deles de emenda se mantém"
 ecumenical_council_events.0110.oppose_duel.success:0 "O círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cede"
 ecumenical_council_events.0110.oppose_duel.success_halved:0 "Alguns do círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cedem"
 ecumenical_council_events.0110.oppose_duel:0 "Alertar contra os males da ambição!"
 ecumenical_council_events.0110.support:0 "Um pouco de ambição tem seu lugar"
 ecumenical_council_events.0110.support_duel.failure:0 "Sua ganância é evidente"
 ecumenical_council_events.0110.support_duel.success:0 "Eles aceitam: é apenas uma pequena emenda"
 ecumenical_council_events.0110.support_duel.success_halved:0 "Alguns aceitam os méritos do apoio"
 ecumenical_council_events.0110.support_duel:0 "Argumentar mais a favor do avanço!"
 ecumenical_council_events.0110.t:0 "Ambição Desenfreada"
 ecumenical_council_events.0111.conservatives_custom:0 "[ec_conservatives|E] idosos (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0111.conservatives_custom_halved:0 "[ec_conservatives|E] idosos (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0111.desc:0 "Os anciãos de cabelos brancos perambulam discutindo.\n\n\"Já vimos concílios irem e virem, erros cometidos em todos eles. Em vez de retificar essas perversões, parece que esperamos decretar mais!\" resmunga [lead_conservative.GetTitledFirstName].\n\n\"Seu velho [lead_conservative.Custom('RegionalFarmAnimal')]! Você disse praticamente a mesma coisa da última vez, e fará o mesmo barulho até estar na cova!\" retruca [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0111.innovators_custom:0 "[ec_innovators|E] idosos (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0111.innovators_custom_halved:0 "[ec_innovators|E] idosos (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0111.oppose:0 "Apoiar [lead_conservative.GetTitledFirstNameNoTooltip]: chega de loucuras."
 ecumenical_council_events.0111.oppose_duel.failure:0 "Os inovadores permanecem imaculados"
 ecumenical_council_events.0111.oppose_duel.success:0 "O círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cede"
 ecumenical_council_events.0111.oppose_duel.success_halved:0 "Alguns do círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cedem"
 ecumenical_council_events.0111.oppose_duel:0 "Reduzir os velhos sonhadores a pó intelectual!"
 ecumenical_council_events.0111.support:0 "Esta mudança retificará velhos erros!"
 ecumenical_council_events.0111.support_duel.failure:0 "Eles ainda clamam \"Perversão!\""
 ecumenical_council_events.0111.support_duel.success:0 "Eles chegam a uma aceitação resmungada"
 ecumenical_council_events.0111.support_duel.success_halved:0 "Alguns aceitam esta retificação"
 ecumenical_council_events.0111.support_duel:0 "Reiterar os argumentos a favor para ouvidos idosos."
 ecumenical_council_events.0111.t:0 "Os Anciãos Resmungões"
 ecumenical_council_events.0112.conservatives_custom:0 "[ec_conservatives|E] enfrentando uma [epidemic|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0112.conservatives_custom_halved:0 "[ec_conservatives|E] enfrentando uma [epidemic|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0112.desc:0 "\"Os mortos se acumulam nas minhas terras! No início, perguntei-me sobre a causa do castigo de [lead_conservative.GetFaith.HighGodNamePossessive], mas agora — está claro demais! A humanidade sofre enquanto nosso mundo rejeita esta mutação do direito canônico\", diz [lead_conservative.GetTitledFirstName].\n\n\"Você está tão iludido pelo seu ódio a este concílio que não consegue ver sua salvação?\" retruca [lead_innovator.GetTitledFirstName]. \"Nossa reforma aplacará a ira de [lead_innovator.GetFaith.HighGodName]!\""
 ecumenical_council_events.0112.innovators_custom:0 "[ec_innovators|E] enfrentando um [epidemic|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0112.innovators_custom_halved:0 "[ec_innovators|E] enfrentando um [epidemic|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0112.oppose:0 "Ou irrite [ROOT.Char.GetFaith.HighGodName] ainda mais!"
 ecumenical_council_events.0112.oppose_duel.failure:0 "Eles ainda têm esperança na mudança"
 ecumenical_council_events.0112.oppose_duel.success:0 "O círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cede"
 ecumenical_council_events.0112.oppose_duel.success_halved:0 "Alguns do círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cedem"
 ecumenical_council_events.0112.oppose_duel:0 "Avisar que isso destruiria a lei canônica."
 ecumenical_council_events.0112.support:0 "Sim. [ROOT.Char.GetFaith.HighGodName|U] exige que a Igreja mude."
 ecumenical_council_events.0112.support_duel.failure:0 "Destruir a lei canônica é um risco grave demais"
 ecumenical_council_events.0112.support_duel.success:0 "Muitos veem um fim para a ira divina"
 ecumenical_council_events.0112.support_duel.success_halved:0 "Alguns tentarão apaziguar [lead_innovator.GetFaith.HighGodName]"
 ecumenical_council_events.0112.support_duel:0 "Usar a lógica do defensor contra [lead_conservative.GetHerHim] pode funcionar!"
 ecumenical_council_events.0112.t:0 "Doença no Reino"
 ecumenical_council_events.0113.conservatives_custom:0 "[besieged|E] [ec_conservatives|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0113.conservatives_custom_halved:0 "[besieged|E] [ec_conservatives|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0113.desc:0 "Aqueles cujos domínios sofrem sob o ataque de fés ímpias afastam-se do plenário em solidariedade mútua.\n\n\"Enquanto os inimigos da fé queimam meus campos\", declara [lead_conservative.GetTitledFirstName], \"vamos discutir sobre sonhos tolos? Como se nenhuma espada perfurasse nossos corações?\"\n\n\"Um credo fraturado é um escudo quebrado\", responde [lead_innovator.GetTitledFirstName]. \"Resolvam o cânone, e lutaremos como um só, renovados!\""
 ecumenical_council_events.0113.innovators_custom:0 "[besieged|E] [ec_innovators|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0113.innovators_custom_halved:0 "[besieged|E] [ec_innovators|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0113.oppose:0 "Não há assuntos mais urgentes do que esta tolice?"
 ecumenical_council_events.0113.oppose_duel.failure:0 "Eles ainda esperam em vão"
 ecumenical_council_events.0113.oppose_duel.success:0 "O círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cede"
 ecumenical_council_events.0113.oppose_duel.success_halved:0 "Alguns do círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cedem"
 ecumenical_council_events.0113.oppose_duel:0 "Avisá-los contra essa imprudência."
 ecumenical_council_events.0113.support:0 "Seria bom provar da esperança novamente."
 ecumenical_council_events.0113.support_duel.failure:0 "Eles não conseguem se lembrar da esperança"
 ecumenical_council_events.0113.support_duel.success:0 "Eles aceitam, e lutaremos como um só"
 ecumenical_council_events.0113.support_duel.success_halved:0 "Alguns são persuadidos a reformar"
 ecumenical_council_events.0113.support_duel:0 "Vamos consertar a Igreja, nosso escudo!"
 ecumenical_council_events.0113.t:0 "Fé Sob As Armas"
 ecumenical_council_events.0114.conservatives_custom:0 "Belicosos [ec_conservatives|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0114.conservatives_custom_halved:0 "Belicosos [ec_conservatives|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0114.desc.conservative:0 "\"Já derrubamos muitos [ec_hostile_faith.GetAdherentName] como estamos\", diz [lead_conservative.GetTitledFirstName]. \"[lead_conservative.GetFaith.WarGodName] já não abençoa nossos estandartes?\""
 ecumenical_council_events.0114.desc.conservative_generic:0 "\"Já derrubamos muitos inimigos como estamos\", diz [lead_conservative.GetTitledFirstName]. \"[lead_conservative.GetFaith.WarGodName] já não abençoa nossos estandartes?\""
 ecumenical_council_events.0114.desc.intro:0 "Como é de hábito entre homens que conhecem a guerra, os velhos guerreiros entre nós encontram-se passando o tempo juntos.\n\n\"Por [lead_innovator.GetFaith.HighGodName], será bom ter estas mudanças acordadas. Os fiéis poderão se unir sob um único estandarte mais uma vez!\", pondera [lead_innovator.GetTitledFirstName]\n\n"
 ecumenical_council_events.0114.innovators_custom:0 "Belicosos [ec_innovators|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0114.innovators_custom_halved:0 "Belicosos [ec_innovators|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0114.oppose:0 "Apoiar [lead_conservative.GetTitledFirstNameNoTooltip], defensor da ortodoxia."
 ecumenical_council_events.0114.oppose_duel.failure:0 "Eles avançarão em vão"
 ecumenical_council_events.0114.oppose_duel.success:0 "A coorte de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cede"
 ecumenical_council_events.0114.oppose_duel.success_halved:0 "Alguns da coorte de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cedem"
 ecumenical_council_events.0114.oppose_duel:0 "Um duelo de palavras, então!"
 ecumenical_council_events.0114.support:0 "Vamos erguer bem alto um novo estandarte abençoado."
 ecumenical_council_events.0114.support_duel.failure:0 "Eles mantêm sua linha teimosamente"
 ecumenical_council_events.0114.support_duel.success:0 "Um soldado deve servir"
 ecumenical_council_events.0114.support_duel.success_halved:0 "Alguns são recrutados"
 ecumenical_council_events.0114.support_duel:0 "Recrutar os medrosos para o estandarte abençoado de [ROOT.Char.GetFaith.HighGodNamePossessive]!"
 ecumenical_council_events.0114.t:0 "Armados com Fé e Aço"
 ecumenical_council_events.0115.conservatives_custom:0 "[ec_conservatives|E] de alta [intrigue|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0115.conservatives_custom_halved:0 "[ec_conservatives|E] de alta [intrigue|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0115.desc:0 "Embora me custe admitir, nem todos os clérigos conquistaram suas vestes nobremente. Mesmo entre este corpo augusto, devo estar extremamente ciente daqueles que preferem as sombras à luz pura das escrituras. Não demora muito para tropeçar em sussurros no escuro.\n\n\"Cada alma aqui tem fome de... algo. Devemos nos perguntar, os sábios, quem pagará o preço da fome\", sussurra [lead_conservative.GetTitledFirstName] em ouvidos dispostos. \"Ideologia desaforada, reforma apaixonada... nada custa tão caro...\"\n\nOutra víbora, [lead_innovator.GetTitledFirstName], levanta-se para desafiar [lead_conservative.GetHerHim]: \"Você acha que será #EMP você#! pagando o preço do caos? No tempo de desordem que se avizinha, quando seremos livres para agir como quisermos...?\""
 ecumenical_council_events.0115.innovators_custom:0 "[ec_innovators|E] de alta [intrigue|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0115.innovators_custom_halved:0 "[ec_innovators|E] de alta [intrigue|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0115.oppose:0 "Uma pequena refeição, e então [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] morreremos de fome para sempre."
 ecumenical_council_events.0115.oppose_duel.failure:0 "Eles estão perdidos para desejos sombrios"
 ecumenical_council_events.0115.oppose_duel.success:0 "O círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cede"
 ecumenical_council_events.0115.oppose_duel.success_halved:0 "Alguns do círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cedem"
 ecumenical_council_events.0115.oppose_duel:0 "Busque a verdade nas escrituras, ou estará perdido."
 ecumenical_council_events.0115.support:0 "A desrupção tem seus usos."
 ecumenical_council_events.0115.support_duel.failure:0 "Eles provam ser cegos à oportunidade"
 ecumenical_council_events.0115.support_duel.success:0 "A cobiça deles os conduz até você"
 ecumenical_council_events.0115.support_duel.success_halved:0 "Poucos procurarão causar perturbação"
 ecumenical_council_events.0115.support_duel:0 "Fale de oportunidade para aqueles espertos o bastante para ouvir."
 ecumenical_council_events.0115.t:0 "Sussurros e Influência"
 ecumenical_council_events.0116.conservatives_custom:0 "[ec_conservatives|E] de alto [stewardship|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0116.conservatives_custom_halved:0 "[ec_conservatives|E] de alto [stewardship|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0116.desc:0 "Vejo os administradores de várias sés discutindo números como agiotas.\n\n\"Minha diocese não suporta outra agitação\", diz [lead_conservative.GetTitledFirstName]. \"Novos livros para cada paróquia, cavaleiros para cada [lead_conservative.GetFaith.HouseOfWorship]. Se isso for aprovado, o dízimo não será suficiente.\"\n\n\"E se fracassar?\", pergunta [lead_innovator.GetTitledFirstName]. \"Disputamos por anos, e essa prata estará perdida de qualquer forma, seja qual for nosso voto. Ao menos financiemos uma lei que o rebanho cumprirá.\""
 ecumenical_council_events.0116.innovators_custom:0 "[ec_innovators|E] de alto [stewardship|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0116.innovators_custom_halved:0 "[ec_innovators|E] de alto [stewardship|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0116.oppose:0 "Minha diocese não pode arcar com essa agitação."
 ecumenical_council_events.0116.oppose_duel.failure:0 "Eles mantêm seu investimento"
 ecumenical_council_events.0116.oppose_duel.success:0 "O círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] retrata-se"
 ecumenical_council_events.0116.oppose_duel.success_halved:0 "Alguns do círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] retratam-se"
 ecumenical_council_events.0116.oppose_duel:0 "\"Por [ROOT.Char.GetFaith.HighGodName]! É fiscalmente irresponsável!\""
 ecumenical_council_events.0116.support:0 "Sim, por que lamentar prata que já foi gasta?"
 ecumenical_council_events.0116.support_duel.failure:0 "Eles ainda lamentam os gastos"
 ecumenical_council_events.0116.support_duel.success:0 "Eles são tentados a apoiar a reforma"
 ecumenical_council_events.0116.support_duel.success_halved:0 "Alguns aceitam esta formulação"
 ecumenical_council_events.0116.support_duel:0 "Argumente assim: o apoio é um investimento!"
 ecumenical_council_events.0116.t:0 "Quem Paga por Isso?"
 ecumenical_council_events.0117.conservatives_custom:0 "[ec_conservatives|E] de alta [diplomacy|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0117.conservatives_custom_halved:0 "[ec_conservatives|E] de alta [diplomacy|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0117.desc:0 "Aflagro dois negociadores experientes redigindo nas margens do decreto, riscando e restaurando uma cláusula como se fosse um tratado.\n\n\"Mantenham como está! Arriscamos que metade deles parta antes mesmo de abordarmos os assuntos mais espinhosos\", diz [lead_conservative.GetTitledFirstName]. \"Passei meses mantendo esta gente na mesma mesa. Suavizem ou perderemos o próprio concílio.\"\n\n\"E deixar esta bagunça que ninguém fará cumprir após o término do concílio?\", responde [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0117.innovators_custom:0 "[ec_innovators|E] de alta [diplomacy|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0117.innovators_custom_halved:0 "[ec_innovators|E] de alta [diplomacy|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0117.oppose:0 "Não podemos arriscar perder o concílio!"
 ecumenical_council_events.0117.oppose_duel.failure:0 "Eles mantêm sua mensagem"
 ecumenical_council_events.0117.oppose_duel.success:0 "O círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cede"
 ecumenical_council_events.0117.oppose_duel.success_halved:0 "Alguns do círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cedem"
 ecumenical_council_events.0117.oppose_duel:0 "Isto é grosseiro, não pode ser aprovado!"
 ecumenical_council_events.0117.support:0 "Devemos ser convincentes. Devemos ser claros."
 ecumenical_council_events.0117.support_duel.failure:0 "Eles ainda temem a alienação"
 ecumenical_council_events.0117.support_duel.success:0 "Eles aceitam que uma ambiguidade não será aplicada"
 ecumenical_council_events.0117.support_duel.success_halved:0 "Alguns aceitam que uma ambiguidade não será aplicada"
 ecumenical_council_events.0117.support_duel:0 "Mais vale um decreto firme do que o silêncio, não?"
 ecumenical_council_events.0117.t:0 "Emendas Demais"
 ecumenical_council_events.0118.conservatives_custom:0 "[ec_conservatives|E] que viajaram de longe (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0118.conservatives_custom_halved:0 "[ec_conservatives|E] que viajaram de longe (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0118.desc:0 "[lead_conservative.GetTitledFirstName], um proeminente membro do concílio de origem [lead_conservative.GetCulture.GetNameNoTooltip], está junto a um grupo de outros clérigos que viajaram longas distâncias para defender as tradições da Igreja.\n\n\"O mundo [lead_conservative.GetFaith.GetAdjective] é tão vasto quanto o amor de [lead_conservative.GetFaith.HighGodName]\", diz [lead_conservative.GetSheHe]. \"Esperamos que esta peregrinação não tenha sido feita para testemunhar [lead_innovator.GetTitledFirstName] pregar a anulação da obra dos padres da Igreja.\""
 ecumenical_council_events.0118.innovators_custom:0 "[ec_innovators|E] pregando pela mudança (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0118.innovators_custom_halved:0 "[ec_innovators|E] pregando pela mudança (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0118.oppose:0 "\"Honremos todos o vosso sacrifício.\""
 ecumenical_council_events.0118.oppose_duel.failure:0 "Os discípulos de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] permanecem irredutíveis"
 ecumenical_council_events.0118.oppose_duel.success:0 "O círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cede"
 ecumenical_council_events.0118.oppose_duel.success_halved:0 "Alguns do círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cedem"
 ecumenical_council_events.0118.oppose_duel:0 "\"Vou pregar contra [lead_innovator.GetTitledFirstNameNoTooltip].\""
 ecumenical_council_events.0118.support:0 "As peregrinações mais duras trazem as maiores revelações."
 ecumenical_council_events.0118.support_duel.failure:0 "Eles ainda temem a pregação de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip]"
 ecumenical_council_events.0118.support_duel.success:0 "Eles aceitam que as tradições dos padres estão a salvo"
 ecumenical_council_events.0118.support_duel.success_halved:0 "Alguns aceitam que as tradições dos padres estão a salvo"
 ecumenical_council_events.0118.support_duel:0 "Assegure-lhes sobre a visão de [lead_innovator.GetFirstNamePossessiveNoTooltip]."
 ecumenical_council_events.0118.t:0 "Tradições de uma Sé Distante"
 ecumenical_council_events.0120.conservatives_custom:0 "[ec_conservatives|E] de grande [prestige|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0120.conservatives_custom_halved:0 "[ec_conservatives|E] de grande [prestige|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0120.desc:0 "Alguns dos convidados mais renomados mantêm-se afastados, ponderando como suas reputações ficarão após tudo isso ser posto por escrito.\n\n\"Meu nome pode ser encontrado em cada crónica escrita recentemente. Que necessidade tenho de me ver atrelado a um decreto que poderá ser ridicularizado por toda a eternidade?\", diz [lead_conservative.GetTitledFirstName].\n\n\"Os homens recordam quem resolveu a querela, não quem manteve as mãos limpas. E serei lembrado assim\", responde [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0120.innovators_custom:0 "[ec_innovators|E] de grande [prestige|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0120.innovators_custom_halved:0 "[ec_innovators|E] de grande [prestige|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0120.oppose:0 "Não associaré o meu nome a motivo de chacota."
 ecumenical_council_events.0120.oppose_duel.failure:0 "Eles não aceitam o seu insulto"
 ecumenical_council_events.0120.oppose_duel.success:0 "O círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cede"
 ecumenical_council_events.0120.oppose_duel.success_halved:0 "Alguns do círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cedem"
 ecumenical_council_events.0120.oppose_duel:0 "\"Tolos resolvem querelas... impondo farsas.\""
 ecumenical_council_events.0120.support:0 "\"Não somos nós os líderes da Igreja?\""
 ecumenical_council_events.0120.support_duel.failure:0 "Eles continuam esquivos"
 ecumenical_council_events.0120.support_duel.success:0 "Os hesitantes se entregam à história"
 ecumenical_council_events.0120.support_duel.success_halved:0 "Alguns se entregam à história"
 ecumenical_council_events.0120.support_duel:0 "\"Você não estará sozinho!\""
 ecumenical_council_events.0120.t:0 "Nomes na Crônica"
 ecumenical_council_events.0122.conservatives_custom:0 "[ec_conservatives|E] com [health|E] ruim (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0122.conservatives_custom_halved:0 "[ec_conservatives|E] com [health|E] ruim (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0122.desc:0 "Alguns padres adoentados sentam-se afastados do tumulto do salão, buscando o calor do sol.\n\n\"Será que ouvirei as últimas palavras deste concílio antes de encontrar [lead_conservative.GetFaith.HighGodName]... e assim ser condenado ao [lead_conservative.GetFaith.NegativeAfterLife] fétido por seus novos horrores?\", resfolega [lead_conservative.GetTitledFirstName].\n\n\"Lhe resta tão pouco a perder, [lead_conservative.GetFirstNameNoTooltip], mas certamente ainda tem alguma esperança a oferecer ao mundo, para que possa partir beatificamente para [lead_innovator.GetFaith.PositiveAfterLife]?\", responde [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0122.innovators_custom:0 "[ec_innovators|E] com [health|E] ruim (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0122.innovators_custom_halved:0 "[ec_innovators|E] com [health|E] ruim (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0122.oppose:0 "Nossa última força pertence a [ROOT.Char.GetFaith.HighGodName] e à Palavra de [ROOT.Char.GetFaith.HighGodHerHis|U]."
 ecumenical_council_events.0122.oppose_duel.failure:0 "Eles continuam condenados"
 ecumenical_council_events.0122.oppose_duel.success:0 "O círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cede"
 ecumenical_council_events.0122.oppose_duel.success_halved:0 "Alguns do círculo de [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cedem"
 ecumenical_council_events.0122.oppose_duel:0 "\"Não manchemos nossas vidas com isto!\""
 ecumenical_council_events.0122.support:0 "\"Por [ROOT.Char.GetFaith.HighGodName], estes últimos momentos são preciosos!\""
 ecumenical_council_events.0122.support_duel.failure:0 "Eles definharão amargamente"
 ecumenical_council_events.0122.support_duel.success:0 "Eles são inspirados a um ato reformador final"
 ecumenical_council_events.0122.support_duel.success_halved:0 "Alguns são inspirados a um ato reformador final"
 ecumenical_council_events.0122.support_duel:0 "Não encontrarei [ROOT.Char.GetFaith.HighGodName] tendo me mantido em silêncio."
 ecumenical_council_events.0122.t:0 "Enquanto Eu Ainda Puder"
 ecumenical_council_events.0123.conservatives_custom:0 "[allied|E] [ec_conservatives|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0123.conservatives_custom_halved:0 "[allied|E] [ec_conservatives|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0123.desc:0 "Encontro meus aliados discutindo, quase como divisões posicionadas umas contra as outras no campo de batalha. Este é um mau presságio.\n\n\"Temos apenas um interesse em comum, malditos sejam! Não me peçam para votar como se eu fosse algum animalzinho, algum cão uivante na coleira de [ROOT.Char.GetTitledFirstName]!\", esbraveja [lead_conservative.GetTitledFirstName].\n\n\"O que devo achar de um aliado que não iguala com palavras simples o que [lead_innovator.GetSheHe] jurou a [ROOT.Char.GetPrimaryTitle.GetNameNoTier] em vidas mortais?\", retruca [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0123.innovators_custom:0 "[allied|E] [ec_innovators|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0123.innovators_custom_halved:0 "[allied|E] [ec_innovators|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0123.oppose:0 "\"Aqui, sua lealdade pertence apenas às escrituras.\""
 ecumenical_council_events.0123.oppose_duel.failure:0 "Seus aliados não serão reunidos em oposição"
 ecumenical_council_events.0123.oppose_duel.success:0 "Seus aliados cedem"
 ecumenical_council_events.0123.oppose_duel.success_halved:0 "Alguns aliados cedem"
 ecumenical_council_events.0123.oppose_duel:0 "Pedirei lealdade... de aliados como [lead_innovator.GetFirstNameNoTooltip]."
 ecumenical_council_events.0123.support:0 "\"Devo apelar a todas as lealdades, sim.\""
 ecumenical_council_events.0123.support_duel.failure:0 "Seus aliados não podem ser intimidados"
 ecumenical_council_events.0123.support_duel.success:0 "Seus aliados ficarão ao seu lado"
 ecumenical_council_events.0123.support_duel.success_halved:0 "Alguns aliados ficarão ao seu lado"
 ecumenical_council_events.0123.support_duel:0 "Aviso que você considera isso uma desonra."
 ecumenical_council_events.0123.t:0 "Caso a Guerra Venha Logo"
 ecumenical_council_events.0126.a:0 "Vote segundo sua consciência, não seu ódio."
 ecumenical_council_events.0126.b:0 "Guarde seu rancor. Não me rebaixarei a ele."
 ecumenical_council_events.0126.c.tt:0 "O [scheme|E] terá uma #P chance de sucesso #! aumentada [success_chance|E]"
 ecumenical_council_events.0126.c:0 "O concílio deixou [rival.GetHerHim] distraído..."
 ecumenical_council_events.0126.conservatives_custom:0 "[ec_conservatives|E] entre seus [rivals|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0126.desc:0 "É uma provação encontrar [rival.GetTitledFirstName], meu [ROOT.Char.Custom2('RelationToMe', rival)], entre a assembleia.\n\n\"Certamente você sabe por que estou aqui\", rosna [rival.GetSheHe]. \"Diga o que tem a dizer, escolha seu lado... Só espero para votar contra você.\""
 ecumenical_council_events.0126.innovators_custom:0 "[ec_innovators|E] entre seus [rivals|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0126.t:0 "Entre Rivais"
 ecumenical_council_events.0129.conservatives_custom:0 "[intimidated|E] [ec_conservatives|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0129.conservatives_custom_halved:0 "[intimidated|E] [ec_conservatives|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0129.desc:0 "Aqueles que tremem diante de mim observam o debate com olhos como gotas trêmulas de creme. O mais humilde deles, [lead_conservative.GetTitledFirstName], sequer ousa encontrar meu olhar.\n\n\"Diga o que tem a dizer\", sussurra [lead_conservative.GetSheHe]. \"Eu já sei o que acontece se eu lhe recusar.\""
 ecumenical_council_events.0129.innovators_custom:0 "[intimidated|E] [ec_innovators|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0129.innovators_custom_halved:0 "[intimidated|E] [ec_innovators|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0129.oppose:0 "E, assim, o terror devora a esperança."
 ecumenical_council_events.0129.oppose_duel.failure:0 "O medo deles se coalha em desafio"
 ecumenical_council_events.0129.oppose_duel.success:0 "Os amedrontados entram na linha"
 ecumenical_council_events.0129.oppose_duel.success_halved:0 "Alguns entram na linha"
 ecumenical_council_events.0129.oppose_duel:0 "Não permitirei que ninguém me desafie."
 ecumenical_council_events.0129.support:0 "A crueldade nunca me falhou antes."
 ecumenical_council_events.0129.support_duel.failure:0 "O medo deles se coalha em desafio"
 ecumenical_council_events.0129.support_duel.success:0 "O medo os dobra a ti"
 ecumenical_council_events.0129.support_duel.success_halved:0 "O medo faz escravos de apenas alguns"
 ecumenical_council_events.0129.support_duel:0 "Garantirei que os outros também saibam disso."
 ecumenical_council_events.0129.t:0 "Medo no Salão"
 ecumenical_council_events.doctrine.chaplain_suggestion:0 "\n\n\"[ec_chaplain_pick.GetDescriptiveName( ROOT.GetCharacter.GetFaith )] é o mais adequado às necessidades de [ROOT.Char.GetFaith.GetName],\" aconselha [court_chaplain.GetName]."
 ecumenical_council_events.doctrine.intro:0 "A questão de [ec_debate_topic_3.GetGroup.GetName( ROOT.GetCharacter.GetFaith )] é o tópico final a ser debatido. [ec_debate_topic_3.GetDescriptiveName( ROOT.GetCharacter.GetFaith )] é a postura atual do direito canônico. [lead_portrait.GetTitledFirstName] inicia:\n\n"
 ecumenical_council_events.doctrine.t:0 "A Questão de [ec_debate_topic_3.GetGroup.GetName( ROOT.GetCharacter.GetFaith )]"
 ecumenical_council_events.schism_crisis_end:0 "\n\nCada delegação retorna para casa com uma versão diferente do que foi concedido e de quem traiu quem. Uma casa tão dividida não pode subsistir para sempre."
 ecumenical_council_events.schism_crisis_intro:0 "\n\nAs saudações são calorosas; os silêncios que se seguem, não. Roma e Constantinopla já não trocam cortesias, e cada desavença não curada é uma nova fenda no único Corpo de Cristo."
 ecumenical_council_guests_swayed_to_conservatives_log:0 "Os seguintes participantes foram persuadidos a se opor à mudança proposta, juntando-se aos [ec_conservatives|E]:"
 ecumenical_council_guests_swayed_to_conservatives_log_title:0 "Convidados Persuadidos para [ec_conservatives|E]"
 ecumenical_council_guests_swayed_to_innovators_log:0 "Os seguintes participantes foram persuadidos a apoiar a mudança proposta, juntando-se aos [ec_innovators|E]:"
 ecumenical_council_guests_swayed_to_innovators_log_title:0 "Convidados Persuadidos para [ec_innovators|E]"
 ecumenical_council_proposal_set_log:0 "Uma proposta foi apresentada ao concílio para debate:[CHARACTER.GetInvolvedActivity.Custom('GetEcumenicalCouncilProposalSetLog')]"
 ecumenical_council_proposal_set_log_title:0 "A Proposta do Concílio"
 ecumenical_council_summons_events.0001.a.learn_secret_tt:0 "Você descobre o segredo de [guest_1.GetShortUINamePossessive]"
 ecumenical_council_summons_events.0001.a:0 "O que poderia preocupar tanto [guest_1.GetHerHim]..."
 ecumenical_council_summons_events.0001.b:0 "[guest_1.GetFirstNameNoTooltip] apenas precisa de algum conforto amigável."
 ecumenical_council_summons_events.0001.c:0 "É melhor não saber."
 ecumenical_council_summons_events.0001.desc:0 "\"E aquele meu problema... por [guest_1.GetFaith.HighGodName], ele me consome. Mal consigo dormir...\" [guest_1.GetTitledFirstName] confidencia a [guest_2.GetTitledFirstName] em um sussurro magoado.\n\n\"Eu entendo...\" [guest_2.GetFirstNameNoTooltip] assente. \"Talvez se você falar com nosso anfitrião, o [host.GetTitleAsNameNoTooltip], [host.GetSheHe] possa oferecer algum conselho espiritual?\""
 ecumenical_council_summons_events.0001.t:0 "As Preocupações do [guest_1.GetTitleAsNameNoTooltip|U]"
 ecumenical_council_summons_events.0010.a.learn_secret_tt:0 "Você descobre o segredo de [host.GetShortUINamePossessive]"
 ecumenical_council_summons_events.0010.a:0 "\"Vejo que estás arrependido, [host.GetTitleAsNameNoTooltip].\""
 ecumenical_council_summons_events.0010.b.flavor:0 "[host.GetSheHe|U] encontrará consolo nas escrituras!"
 ecumenical_council_summons_events.0010.b:0 "\"[ROOT.Char.Custom('RandomBibleQuoteShort')]\""
 ecumenical_council_summons_events.0010.c:0 "Algumas coisas é melhor deixar desconhecidas."
 ecumenical_council_summons_events.0010.desc:0 "Nosso anfitrião [host.GetTitledFirstName] não parece notar minha presença enquanto [host.GetSheHe] é ajudado por um servo a ajustar as vestimentas de [host.GetHerHis].\n\n\"[host.GetFaith.HighGodName] perdoa-me...\" [host.GetSheHe] murmura. \"Estes rumores sobre as minhas... tendências. Pensar que eu, o Vigário de Cristo, me entrego a tais proclividades! Tais rumores jamais devem chegar aos meus cardeais.\""
 ecumenical_council_summons_events.0010.t:0 "O Segredo"
 ecumenical_council_summons_events.0020.a:0 "\"Não há ouro que não resolva, Santidade!\""
 ecumenical_council_summons_events.0020.aa:0 "Eu conheço #EMP tantas#! pessoas que me devem um favor..."
 ecumenical_council_summons_events.0020.aaa:0 "\"Estas são minhas terras, Santidade. Tratarei de resolver isso.\""
 ecumenical_council_summons_events.0020.b.flavor:0 "[host.GetShortUIName] se lembrará de mim como um candidato influente..."
 ecumenical_council_summons_events.0020.b:0 "\"Vou cobrar todos os meus favores!\""
 ecumenical_council_summons_events.0020.c:0 "Só posso oferecer uma modesta prece..."
 ecumenical_council_summons_events.0020.desc.caravans:0 "\"As caravanas que transportam nossas provisões ainda não chegaram."
 ecumenical_council_summons_events.0020.desc.intro:0 "\"Se tem de ser assim...\" [host.GetTitledFirstName] despede-se de um dos padres com um gesto.\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip]!\" [host.GetSheHe|U] chama minha atenção."
 ecumenical_council_summons_events.0020.desc.outro:0 "Imagino que não tenhas uma solução para os nossos problemas?\""
 ecumenical_council_summons_events.0020.desc.overcrowded:0 "\"Há simplesmente convidados demais para as acomodações em [ROOT.Char.GetCurrentLocation.GetName] providenciadas para o nosso concílio."
 ecumenical_council_summons_events.0020.desc.servants:0 "\"Simplesmente não há servos suficientes para atender a todos os nossos convidados."
 ecumenical_council_summons_events.0020.papabile_tt:0 "Sua [papabile_score|E] para a sucessão papal aumenta em #P +10#!"
 ecumenical_council_summons_events.0020.t:0 "Problemas Logísticos"
 ecumenical_council_summons_events.0030.a:0 "Devo chamar o melhor médico!"
 ecumenical_council_summons_events.0030.aa:0 "\"Eu li #EMP bastante#! sobre esta aflição!\""
 ecumenical_council_summons_events.0030.b:0 "\"Manter-te-ei em minhas orações.\""
 ecumenical_council_summons_events.0030.c:0 "A vida seguirá seu curso."
 ecumenical_council_summons_events.0030.desc.dry_season:0 "Bastante incomum para esta época do ano."
 ecumenical_council_summons_events.0030.desc.intro:0 "Os ventos uivam e a chuva açoita a estrada enquanto o concílio se aproxima."
 ecumenical_council_summons_events.0030.desc.outro:0 "Meu [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('chaplain') )] [chaplain.GetFirstName] treme incontrolavelmente.\n\n\"Meu suserano... Temo não poder comparecer ao concílio. Esta tempestade, este frio... não me faz bem ao corpo. Tenho tanto catarro...\""
 ecumenical_council_summons_events.0030.desc.wet_season:0 "Tal clima inclemente é perfeitamente esperado nesta época do ano."
 ecumenical_council_summons_events.0030.t:0 "À Mercê dos Elementos"
 ecumenical_council_summons_events.0040.a.tt.failure:0 "[chaplain.GetShortUIName] não tem certeza de suas intenções"
 ecumenical_council_summons_events.0040.a.tt.success:0 "Sua diplomacia dá frutos"
 ecumenical_council_summons_events.0040.a:0 "[chaplain.GetSheHe|U] deve ser lembrado de que [chaplain.GetSheHe] também me representa."
 ecumenical_council_summons_events.0040.aa.flavor:0 "Um pouco de orientação espiritual certamente trará tranquilidade."
 ecumenical_council_summons_events.0040.aa:0 "\"Deves lembrar-te de [ROOT.Char.GetFaith.KnowledgeGodName], [chaplain.GetFirstNameNoTooltip].\""
 ecumenical_council_summons_events.0040.b:0 "Sempre posso usar minha posição em favor de [chaplain.GetHerHis]..."
 ecumenical_council_summons_events.0040.c:0 "Nada que a prece não possa remediar."
 ecumenical_council_summons_events.0040.desc:0 "À medida que o momento do concílio se aproxima, vejo meu [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('chaplain') )] [chaplain.GetFirstName] andar de um lado para o outro no pátio, cheio de ansiedade.\n\n\"Há a questão do [ROOT.Char.GetFaith.ReligiousSymbol], é claro, é claro... e quanto ao [chaplain.CustomFixedRandom('random_learning_topic')]...?\" ouço [chaplain.GetHerHim] murmurar para [chaplain.GetHerselfHimself]."
 ecumenical_council_summons_events.0040.t:0 "Medo de Palco"
 ecumenical_council_summons_events.0050.a:0 "\"Eu poderia fazer #EMP com que todos#! ficassem cientes disso... por um preço.\""
 ecumenical_council_summons_events.0050.aa:0 "Um bom pastor deve erguer-se do meio das ovelhas..."
 ecumenical_council_summons_events.0050.aaa:0 "[chaplain.GetTitledFirstNameNoTooltip] seria [chaplain.GetWomanMan] perfeito para a função."
 ecumenical_council_summons_events.0050.b:0 "\"Como #EMP você#! sabe quem frequenta as casas de banho, [pious_guest.GetTitleAsNameNoTooltip]?\""
 ecumenical_council_summons_events.0050.c:0 "Agradeçam a [ROOT.Char.GetFaith.HighGodName] por um pouco de entretenimento."
 ecumenical_council_summons_events.0050.desc.intro:0 "[pious_guest.GetTitledFirstName] mal consegue conter [pious_guest.GetHerHis] diversão ao ver [non_pious_guest.GetTitledFirstName].\n\n\"Viu isto, [ROOT.Char.GetTitleAsNameNoTooltip]?\", dirige-se a mim [pious_guest.GetSheHe]. \"[non_pious_guest.GetFirstNameNoTooltip] deve ser elogiado! Eu tinha começado a pensar que o único assento que [non_pious_guest.GetSheHe] conhecia era o das [Glossary( 'bath houses', 'BATHHOUSES_GLOSS' )].\""
 ecumenical_council_summons_events.0050.desc.non_pious_fallback:0 "Espanta-me que [non_pious_guest.GetSheHe] tenha decidido juntar-se a nós neste concílio.\""
 ecumenical_council_summons_events.0050.desc.non_pious_host:0 "E pensar que [non_pious_guest.GetSheHe] se declara [non_pious_guest.GetHerselfHimself] de todo o [ROOT.Char.GetFaith.GetAdherentNamePlural].\""
 ecumenical_council_summons_events.0050.t:0 "Fé Questionada"
 ecumenical_council_summons_events.0060.a.failure:0 "Nenhum dos dois me ouve, e o salão toma partido"
 ecumenical_council_summons_events.0060.a.success:0 "Os dois debatedores são demoverem, evitando o caos"
 ecumenical_council_summons_events.0060.a:0 "\"Paz, ambos. O concílio nem sequer começou.\""
 ecumenical_council_summons_events.0060.b:0 "Pedro recebeu as chaves, e Roma as guarda."
 ecumenical_council_summons_events.0060.c:0 "Roma é a primeira entre iguais. Nada mais."
 ecumenical_council_summons_events.0060.d:0 "Eu detenho este cargo. A questão está encerada."
 ecumenical_council_summons_events.0060.desc:0 "[ec_roman_champion.GetTitledFirstName], falando pela [GetRiteByKey('roman_rite').GetName], não larga o assunto:\n\n\"Toda igreja responde a Roma, e Roma a ninguém!\"\n\n[ec_greek_champion.GetTitledFirstName] conta cinco patriarcas nos seus [ec_greek_champion.GetHerHis] dedos:\n\n\"Qual deles jamais se ajoelhou?\""
 ecumenical_council_summons_events.0060.t:0 "Primeiro Entre Iguais"
 ecumenical_council_summons_events.0061.a.failure:0 "A discussão endurece em doutrina de ambos os lados"
 ecumenical_council_summons_events.0061.a.success:0 "A redação é posta de lado antes que a discussão possa endurecer"
 ecumenical_council_summons_events.0061.a:0 "O Credo sobreviveu a coisas piores do que uma discussão sobre ele."
 ecumenical_council_summons_events.0061.b:0 "As palavras foram adicionadas porque são verdadeiras."
 ecumenical_council_summons_events.0061.c:0 "Um concílio escreveu o Credo. Apenas um concílio pode mudá-lo."
 ecumenical_council_summons_events.0061.d:0 "O Credo será dito aqui como eu o digo."
 ecumenical_council_summons_events.0061.desc:0 "\"Duas palavras\", começa [ec_greek_champion.GetTitledFirstName] da [GetRiteByKey('byzantine_rite').GetName]. \"Duas palavras que [GetRiteByKey('roman_rite').GetAdherentNamePlural] deslizaram para o Credo, e o Oriente não foi consultado.\"\n\n\"A verdade responde apenas a Deus\", responde [ec_roman_champion.GetTitledFirstName]."
 ecumenical_council_summons_events.0061.t:0 "E o Filho"
 ecumenical_council_summons_events.0062.a.failure:0 "Dois altares são preparados naquela noite, e o corredor entre eles permanece vazio"
 ecumenical_council_summons_events.0062.a.success:0 "Ambos os pães são comidos, e a desavença com eles"
 ecumenical_council_summons_events.0062.a:0 "Ambos os pães serão abençoados no meu altar amanhã, e comeremos de cada um."
 ecumenical_council_summons_events.0062.b:0 "Ázimo, como estava na Última Ceia."
 ecumenical_council_summons_events.0062.c:0 "Pão levedado, para um Senhor ressuscitado."
 ecumenical_council_summons_events.0062.d:0 "Pão é pão. É a bênção que importa."
 ecumenical_council_summons_events.0062.desc:0 "[ec_roman_champion.GetTitledFirstName] levanta uma hóstia, fina e pálida como pergaminho:\n\n\"[GetRiteByKey('roman_rite').GetAdherentNamePlural] nunca precisaram de mais.\"\n\n[ec_greek_champion.GetTitledFirstName] coloca um pão levedado ao lado dela:\n\n\"Então os [GetRiteByKey('byzantine_rite').GetAdherentNamePlural] têm estado errados desde os Apóstolos?\""
 ecumenical_council_summons_events.0062.t:0 "O Pão do Altar"
 ecumenical_council_summons_events.0063.a.failure:0 "Ambos os lados saem certos de que o outro argumentou de má-fé"
 ecumenical_council_summons_events.0063.a.success:0 "Uma formulação é encontrada que nenhum dos lados pode torcer"
 ecumenical_council_summons_events.0063.a:0 "Então encontremos palavras que funcionem em ambas as línguas."
 ecumenical_council_summons_events.0063.b:0 "Diz-o em latim, e diz-o claramente."
 ecumenical_council_summons_events.0063.c:0 "Os Padres escreveram em grego. Conseguimos lê-lo."
 ecumenical_council_summons_events.0063.d:0 "Vou emiti-lo em ambas as línguas. O assunto está encerrado."
 ecumenical_council_summons_events.0063.desc:0 "As orações são recitadas em latim. Os bancos dos [GetRiteByKey('byzantine_rite').GetAdherentNamePlural] aguardam a sua tradução, e fustigam quando ela chega. [ec_greek_champion.GetTitledFirstName] resmunga:\n\n\"Os romanos argumentam como advogados. Muitas palavras, e nenhuma substância.\"\n\n\"Os gregos argumentam como filósofos! Nunca resolveram uma única coisa\", responde [ec_roman_champion.GetTitledFirstName]."
 ecumenical_council_summons_events.0063.t:0 "Questão de Idioma"
