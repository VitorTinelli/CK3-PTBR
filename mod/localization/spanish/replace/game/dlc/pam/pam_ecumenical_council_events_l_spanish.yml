l_spanish:
 BATHHOUSES_GLOSS:0 "Em muitas vilas medievais, as casas de banho — outrora destinadas a abluções modestas — ganharam uma reputação notória. Seus aposentos ocultos ofereciam privacidade suficiente para que cortesãs e amantes levassem adiante seus casos."
 CHRISM_GLOSS:0 "Do grego para \"unguento.\" Consagrado por um bispo, #bold o crisma#! é o óleo santo e perfumado usado para ungir os fiéis no batismo e na crisma, e por vezes em uma coroação real."
 ec_becomes_conservative_tt:0 "[ec_switch_stance.GetShortUIName|U] [CharJoinJoins( ec_switch_stance )] os [ec_conservatives|E]"
 ec_becomes_innovator_tt:0 "[ec_switch_stance.GetShortUIName|U] [CharJoinJoins( ec_switch_stance )] os [ec_innovators|E]"
 ec_conservative_becomes_innovator_tt:0 "[ec_switch_stance.GetShortUIName|U] [CharSwitchSwitches( ec_switch_stance )] de [ec_conservative|E] para [ec_innovator|E]"
 ec_current_topic_name:0 "[ec_current_topic.GetName( activity.GetHost.GetRite )]"
 ec_innovator_becomes_conservative_tt:0 "[ec_switch_stance.GetShortUIName|U] [CharSwitchSwitches( ec_switch_stance )] de [ec_innovator|E] para [ec_conservative|E]"
 ec_sway_leave:0 "Deixar [ROOT.Char.GetFaith.HighGodName|U] decidir."
 ec_sway_oppose_tt:0 "Vota para manter [ec_current_topic.GetName( activity.GetHost.GetRite )] [activity.GetHost.Custom('GetEcumenicalDebateTenet1Status')]"
 ec_sway_oppose_tt_2:0 "Vota para manter [ec_current_topic.GetName( activity.GetHost.GetRite )] [activity.GetHost.Custom('GetEcumenicalDebateTenet2Status')]"
 ec_sway_oppose_tt_3:0 "Vota para manter [ec_current_topic.GetGroup.GetName( actor.GetFaith )] [doctrine|E] como [activity.GetSelectedDoctrine1.GetName( activity.GetHost.GetFaith )]"
 ec_sway_support_tt:0 "Vota a favor de tornar [ec_current_topic.GetName( activity.GetHost.GetRite )] [activity.Custom('GetEcumenicalCouncilTenet1Proposal')]"
 ec_sway_support_tt_2:0 "Vota a favor de tornar [ec_current_topic.GetName( activity.GetHost.GetRite )] [activity.Custom('GetEcumenicalCouncilTenet2Proposal')]"
 ec_sway_support_tt_3:0 "Vota a favor de tornar [ec_current_topic.GetGroup.GetName( actor.GetFaith )] [doctrine|E] como [activity.Custom('GetEcumenicalCouncilDoctrine1Proposal')]"
 ecumenical_council_debate_outcome_log:0 "O concílio deliberou sobre uma questão de fé:"
 ecumenical_council_debate_outcome_log_title:0 "O Desfecho do Concílio"
 ecumenical_council_events.0001.a.bad:0 "Se for preciso."
 ecumenical_council_events.0001.a.good:0 "Sagrado é o nosso dever."
 ecumenical_council_events.0001.desc_intro:0 "[ROOT.Char.GetFaith.HouseOfWorshipPlural] de [my_location.GetBaronyNameExplicitly] foram belamente decorados para a ocasião. Os melhores da Cristandade responderam"
 ecumenical_council_events.0001.dislikes_host:0 "[host.Custom('InsultAdjective')] chamada de [host.GetTitledFirstNamePossessive]."
 ecumenical_council_events.0001.host:0 "à minha chamada."
 ecumenical_council_events.0001.intent_arrived:0 "\n\nE, já vejo [intent_target.GetTitledFirstName] entre a assembleia. Perfeito!"
 ecumenical_council_events.0001.likes_host:0 "[host.Custom('ComplimentAdjective')] chamada de [host.GetTitledFirstNamePossessive]."
 ecumenical_council_events.0001.neutral:0 "chamada de [host.GetTitledFirstNamePossessive]."
 ecumenical_council_events.0001.no_intent_target:0 "\n\nPreciso apenas aguardar a chegada deles!"
 ecumenical_council_events.0001.waiting_for_intent:0 "\n\nÉ apenas uma questão de tempo até que [intent_target.GetTitledFirstName] dê as caras..."
 ecumenical_council_events.0001:0 "O Concílio de [my_location.GetBaronyNameExplicitlyNoTooltip]"
 ecumenical_council_events.0002.a:0 "Amém."
 ecumenical_council_events.0002.desc_intro:0 "As portas para [host.GetFaith.HouseOfWorship] agora podem se abrir e nossa grande obra pode começar. Em preparação, é hora de formar alianças"
 ecumenical_council_events.0002.first_tenet:0 "\n\nO ar está vivo com cochichos. Os convocados começam a formar suas posturas sobre [ec_debate_topic_1.GetName( ROOT.GetCharacter.GetRite )] e outros assuntos urgentes."
 ecumenical_council_events.0002.guest:0 "\n\n\"Bem-vindos, meus filhos. Que o Senhor nos guie em nossa tarefa monumental!\" [host.GetTitledFirstName] nos faz um gesto para nos aproximarmos."
 ecumenical_council_events.0002.host:0 "\n\nAbro meus braços e dou as boas-vindas aos meus filhos, para juntos enfrentarmos nossa tarefa monumental."
 ecumenical_council_events.0002.reformist:0 "entre reis e sacerdotes igualmente."
 ecumenical_council_events.0002.t:0 "A Convocação"
 ecumenical_council_events.0010.a_1:0 "Isso substituirá [current_core_1.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]."
 ecumenical_council_events.0010.a_2:0 "Vou abrir espaço removendo [current_core_2.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]."
 ecumenical_council_events.0010.a_3:0 "[current_core_3.GetNameNoTooltip(ROOT.GetCharacter.GetRite)] deve partir."
 ecumenical_council_events.0010.b:0 "Proibir a prática!"
 ecumenical_council_events.0010.c:0 "Por ora, apenas permitirei sua observância."
 ecumenical_council_events.0010.d:0 "Vamos, ao menos, reconhecer este princípio."
 ecumenical_council_events.0010.desc.acts_of_apostles.explanation:0 "\"Nos perguntam se a Igreja [ROOT.Char.GetFaith.GetAdjective] deve viver como nos Atos dos Apóstolos. Devemos soltar nossos missionários, com zelo apostólico, levando a Palavra àqueles que ainda estão nas trevas?\""
 ecumenical_council_events.0010.desc.adaptive.explanation:0 "\"Nos perguntam se exigir a adesão universal aos nossos costumes e restrições prejudica o rebanho. Desde que o núcleo de nossa fé permaneça inalterado, podem nossas leis ser adaptadas ao mundo em que devem existir?\""
 ecumenical_council_events.0010.desc.adoptionism.explanation:0 "\"Nos perguntam se Cristo, em sua humanidade, é Filho de [ROOT.Char.GetFaith.HighGodName] por adoção.\""
 ecumenical_council_events.0010.desc.adorcism.explanation:0 "\"Nos perguntam: os espíritos deste mundo devem ser honrados e bem-vindos para que possam nos ajudar? Ou devem ser banidos como poderes impuros?\""
 ecumenical_council_events.0010.desc.alexandrian_catechism.explanation:0 "\"Nos perguntam: devem as Escrituras ser vasculhadas em busca de sentidos espirituais ocultos? Podem a erudicção grega e a alegoria desvendar o que as palavras cruas ocultam?\""
 ecumenical_council_events.0010.desc.anachoresis.explanation:0 "\"Nos perguntam se a retirada do mundo é sagrada. É a solidão do eremita um verdadeiro caminho para [ROOT.Char.GetFaith.HighGodName]?\""
 ecumenical_council_events.0010.desc.ancestor_worship.explanation:0 "\"Nos perguntam: devem nossos ancestrais ser honrados com preces e oferendas, para que possam nos guardar e guiar?\""
 ecumenical_council_events.0010.desc.aniconism.explanation:0 "\"Nos perguntam se toda imagem sagrada deve ser banida de nossas igrejas. É sua veneração verdadeiramente a idolatria de imagens mundanas, desviando nossos olhos e mentes de [ROOT.Char.GetFaith.HighGodName]?\""
 ecumenical_council_events.0010.desc.apostolic_succession.explanation:0 "\"Nos perguntam: a autoridade dos bispos provém verdadeiramente de sua sucessão ininterrupta a partir dos Apóstolos?\""
 ecumenical_council_events.0010.desc.armed_pilgrimages.explanation:0 "\"Nos perguntam: tomar a cruz e marchar sob um propósito sagrado é um ato de devoção a Cristo? Pode a espada proteger a peregrinação e reaver o que os incrédulos detêm?\""
 ecumenical_council_events.0010.desc.asceticism.explanation:0 "\"Nos perguntam: busca-se [ROOT.Char.GetFaith.HighGodName] através da fome, da privação e da negação de todo o conforto corporal?\""
 ecumenical_council_events.0010.desc.astrology.explanation:0 "\"Nos perguntam: está a vontade de [ROOT.Char.GetFaith.HighGodNamePossessive] escrita nas estrelas? Conhecem os céus os segredos de nossos fados?\""
 ecumenical_council_events.0010.desc.be_fruitful_and_multiply.explanation:0 "\"Nos perguntam: gerar filhos é um encargo sagrado? Devem os fiéis encher a terra com sua prole?\""
 ecumenical_council_events.0010.desc.benevolent_governance.explanation:0 "\"Nos perguntam se o governo justo é um encargo sagrado que os príncipes [ROOT.Char.GetFaith.GetAdjective] devem cumprir.\""
 ecumenical_council_events.0010.desc.bhakti.explanation:0 "\"Nos perguntam: deve cada alma vincular-se, em amorosa devoção, a um aspecto do divino?\""
 ecumenical_council_events.0010.desc.carnal_exaltation.explanation:0 "\"Nos perguntam: os prazeres da carne aproximam a alma do divino? Deve o desejo ser honrado e buscado, e não evitado como pecado?\""
 ecumenical_council_events.0010.desc.celestial_hierarchy.explanation:0 "\"Nos perguntam: estão os santos anjos postados em fileiras sob [ROOT.Char.GetFaith.HighGodName]? Devem os ofícios da Igreja [ROOT.Char.GetFaith.GetAdjective] espelhar essa ordem celestial?\""
 ecumenical_council_events.0010.desc.christian_syncretism.explanation:0 "\"Nos perguntam: podem aqueles fora de Cristo ainda honrar Seus ensinamentos e exemplo, enquanto O negam como o verdadeiro Deus?\""
 ecumenical_council_events.0010.desc.communal_identity.explanation:0 "\"Perguntam-nos se a fé e a ancestralidade são una sob [ROOT.Char.GetFaith.HighGodName]. Devem os forasteiros permanecer fora do verdadeiro rebanho?\""
 ecumenical_council_events.0010.desc.communal_possessions.explanation:0 "\"Perguntam-nos se os fiéis devem possuir todos os bens em comum.\""
 ecumenical_council_events.0010.desc.communion.explanation:0 "\"Perguntam-nos se os ritos sagrados compartilhados invocam a presença de [ROOT.Char.GetFaith.HighGodName]. Devem aqueles que não se unem a nós nesses ritos ser contados fora do verdadeiro rebanho?\""
 ecumenical_council_events.0010.desc.confession.explanation:0 "\"Perguntam-nos: deve cada [ROOT.Char.GetFaith.GetAdherentName] confessar seus pecados a um sacerdote para obter a absolvição? É o sigilo da confissão inviolável?\""
 ecumenical_council_events.0010.desc.consolamentum.explanation:0 "\"Perguntam-nos: pode uma purificação espiritual final próxima da morte lavar todo pecado, e devem os purificados recusar depois o alimento e a vida, para que o pecado não retorne?\""
 ecumenical_council_events.0010.desc.cranial_trophies.explanation:0 "\"Perguntam-nos: devem as cabeças dos mortos em batalha ser transformadas em troféus sagrados?\""
 ecumenical_council_events.0010.desc.cthonic_redoubts.explanation:0 "\"Perguntam-nos se os altos lugares e as raízes da terra são sagrados. Devemos buscar [ROOT.Char.GetFaith.HighGodName] sobre os cumes e ao longo de trilhas ocultas de pedra?\""
 ecumenical_council_events.0010.desc.dharmic_pacifism.explanation:0 "\"Perguntam-nos se todo mal aos seres vivos é proibido. Devemos evitar o mal mesmo às humildes feras e insetos?\""
 ecumenical_council_events.0010.desc.divine_liturgy.explanation:0 "\"Perguntam-nos se a [ROOT.Char.Custom('GetReligiousRite')], com canto, incenso e rito ordenado, é o principal caminho pelo qual os fiéis se aproximam de [ROOT.Char.GetFaith.HighGodName].\""
 ecumenical_council_events.0010.desc.divine_marriage.explanation:0 "\"Perguntam-nos se o casamento deve permanecer dentro da linhagem sagrada, e mesmo entre parentes cuja proximidade a Igreja [ROOT.Char.GetFaith.GetAdjective] chamaria de proibida.\""
 ecumenical_council_events.0010.desc.dulia.explanation:0 "\"Perguntam-nos se os santos devem ser altamente venerados. Podem suas relíquias ser tidas como sagradas, seus dias de festa guardados e sua intercessão buscada, enquanto nossa adoração ainda se reserva apenas a [ROOT.Char.GetFaith.HighGodName]?\""
 ecumenical_council_events.0010.desc.eastern_syncretism.explanation:0 "\"Perguntam-nos: podemos aprender com as fés do Oriente — credos que vivem lado a lado e não se declaram malignos — embora não compartilhemos de seus deuses?\""
 ecumenical_council_events.0010.desc.esotericism.explanation:0 "\"Perguntam-nos se os mistérios de [ROOT.Char.GetFaith.HighGodName] nos impelem a buscar o conhecimento do mundo ao nosso redor.\""
 ecumenical_council_events.0010.desc.exaltation_of_pain.explanation:0 "\"Perguntam-nos: é a dor em si sagrada? É infligi-la uma bênção, e recebê-la uma graça de [ROOT.Char.GetFaith.HighGodName|U]?\""
 ecumenical_council_events.0010.desc.extinction_of_dharma.explanation:0 "\"Perguntam-nos: esta era torna-se sombria, com demônios à solta sob disfarce piedoso? Devemos matar tais inimigos para defender a lei sagrada à medida que ela decai?\""
 ecumenical_council_events.0010.desc.fallback.explanation:0 "\"Este é um ensinamento que nossa fé ainda não firmou completamente; um ato de deliberação que agora se apresenta a este concílio.\""
 ecumenical_council_events.0010.desc.false_conversion_sanction.explanation:0 "\"Perguntam-nos se um [ROOT.Char.GetFaith.GetAdherentName] pode fingir outra fé sob perseguição.\""
 ecumenical_council_events.0010.desc.filial_piety.explanation:0 "\"Perguntam-nos: é a honra aos nossos pais e anciãos mandatada por [ROOT.Char.GetFaith.HighGodName]?\""
 ecumenical_council_events.0010.desc.gnosticism.explanation:0 "\"Perguntam-nos: repousa a salvação no conhecimento oculto, revelado apenas aos iniciados, que liberta a centelha divina e a restitui à fonte?\""
 ecumenical_council_events.0010.desc.gruesome_festivals.explanation:0 "\"Perguntam-nos se os dias santos podem ser marcados com sangue e espetáculo cruel. É tal festança verdadeira adoração perante [ROOT.Char.GetFaith.HighGodName]?\""
 ecumenical_council_events.0010.desc.harmonious_society.explanation:0 "\"Perguntam-nos: é a harmonia social, cada alma em seu lugar, o coração da ordem [ROOT.Char.GetFaith.GetAdjective]?\""
 ecumenical_council_events.0010.desc.hedonistic.explanation:0 "\"Perguntam-nos: é o prazer uma dádiva a ser buscada como forma de adoração?\""
 ecumenical_council_events.0010.desc.hesychasm.explanation:0 "\"Perguntam-nos: podem a quietude sagrada e a simples oração do coração — repetida sem fim — conceder à alma uma visão da luz incriada de [ROOT.Char.GetFaith.HighGodNamePossessive|U]?\""
 ecumenical_council_events.0010.desc.holy_myron.explanation:0 "\"Perguntam-nos se o santo [Glossary( 'chrism', 'CHRISM_GLOSS' )] deve selar o batismo e a coroação com a dádiva do Espírito Santo.\""
 ecumenical_council_events.0010.desc.household_gods.explanation:0 "\"Perguntam-nos: podem os deuses do lar e da lareira ser honrados e servidos dentro dos lares [ROOT.Char.GetFaith.GetAdjective]?\""
 ecumenical_council_events.0010.desc.human_sacrifice.explanation:0 "\"Perguntam-nos se a vida humana pode ser oferecida no altar. Pode o sangue ser derramado por [ROOT.Char.GetFaith.HighGodName] como uma dádiva sagrada?\""
 ecumenical_council_events.0010.desc.hyperdulia.explanation:0 "\"Perguntam-nos: deve a Santa Mãe Maria, a Portadora de Deus, ser honrada acima de todos os outros santos?\""
 ecumenical_council_events.0010.desc.inner_journey.explanation:0 "\"Perguntam-nos se [ROOT.Char.GetFaith.HighGodName] é buscado principalmente através da contemplação e do conhecimento de si mesmo.\""
 ecumenical_council_events.0010.desc.intro:0 "O primeiro debate gira em torno de [ec_debate_topic_1.GetName( ROOT.GetCharacter.GetRite )]. A lei canônica atual mantém seu status como [host.Custom('GetEcumenicalDebateTenet1StatusText')|l]. [lead_portrait.GetTitledFirstName] prepara o terreno:\n\n"
 ecumenical_council_events.0010.desc.intro_core_demote_bad:0 "\n\n\"A prática ainda é popular. Emitir sua condenação... traz certos riscos\", levanta preocupação meu [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_core_demote_good:0 "\n\n\"A prática está perdendo popularidade. Este é um momento oportuno para encerrar seu endosso\", aconselha meu [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_permit_demote:0 "\n\n\"Banir uma prática tem seus riscos, mas neste caso é algo muito justificado\", tranquiliza meu [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_permit_promote:0 "\n\n\"Mais e mais pessoas consideram isso central para sua adoração\", relata meu [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_prohibited_promote_bad:0 "\n\n\"A prática é obscura; uma causa perigosa para se defender\", avisa meu [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_prohibited_promote_good:0 "\n\n\"A prática está ganhando popularidade. Seria prudente considerar seu endosso\", sugere meu [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.islamic_syncretism.explanation:0 "\"Perguntam-nos: pode a lei dos sarracenos ser trazida para a Igreja [ROOT.Char.GetFaith.GetAdjective], seus ensinamentos mesclados com o Evangelho?\""
 ecumenical_council_events.0010.desc.jewish_syncretism.explanation:0 "\"Perguntam-nos se a lei e o saber dos judeus devem ser acolhidos na Igreja [ROOT.Char.GetFaith.GetAdjective], ainda que não compartilhemos de todas as suas pretensões.\""
 ecumenical_council_events.0010.desc.khachkar.explanation:0 "\"Perguntam-nos: podem cruzes de pedra esculpidas erguer-se entre nós como testemunhas públicas e duradouras da fé, marcando o solo sagrado e os mortos?\""
 ecumenical_council_events.0010.desc.legalism.explanation:0 "\"Perguntam-nos: deve a lei sagrada vincular cada ato da vida [ROOT.Char.GetFaith.GetAdjective]? Pode algum pecador, por mais real ou imperioso que seja, estar acima de seus rigores?\""
 ecumenical_council_events.0010.desc.literalism.explanation:0 "\"Perguntam-nos: é a escritura sagrada imutável e completa, o único repositório da sabedoria de [ROOT.Char.GetFaith.HighGodNamePossessive]?\""
 ecumenical_council_events.0010.desc.love_thy_neighbour.explanation:0 "\"Perguntam-nos se o amor ao próximo deve vincular todo [ROOT.Char.GetFaith.GetAdherentName], mesmo o estrangeiro e o inimigo, como a verdadeira medida do amor a [ROOT.Char.GetFaith.HighGodName].\""
 ecumenical_council_events.0010.desc.megaliths.explanation:0 "\"Perguntam-nos: devem grandes monumentos de pedra ser erguidos como testamentos à glória duradoura de [ROOT.Char.GetFaith.HighGodNamePossessive]?\""
 ecumenical_council_events.0010.desc.mendicant_preachers.explanation:0 "\"Perguntam-nos: devem os frades não possuir nada? Devem vagar de vila em vila, alimentados por esmolas, para pregar a Palavra de [ROOT.Char.GetFaith.HighGodName]?\""
 ecumenical_council_events.0010.desc.miaphysitism.explanation:0 "\"Perguntam-nos se, em Cristo, o divino e o humano são uma só natureza encarnada, sem divisão e sem confusão.\""
 ecumenical_council_events.0010.desc.miles_christi.explanation:0 "\"Perguntam-nos: devem os fiéis ser soldados de Cristo? Estamos obrigados a pegar em espada e defender a Igreja [ROOT.Char.GetFaith.GetAdjective] quando convocados?\""
 ecumenical_council_events.0010.desc.monophysitism.explanation:0 "\"Perguntam-nos: tem Cristo apenas uma natureza, inteiramente divina? É sua humanidade engolida, restando apenas o divino no Verbo feito carne?\""
 ecumenical_council_events.0010.desc.mortification_of_the_flesh.explanation:0 "\"Perguntam-nos: é o espírito enriquecido quando o corpo se submete ao jejum, ao silício e ao flagelo?\""
 ecumenical_council_events.0010.desc.mountain_worship.explanation:0 "\"Perguntam-nos: são os altos lugares verdadeiramente elevados e sagrados? É [ROOT.Char.GetFaith.HighGodName] melhor buscado no topo das montanhas?\""
 ecumenical_council_events.0010.desc.mystical_birthright.explanation:0 "\"Perguntam-nos: estão certas almas marcadas desde o nascimento para o poder sagrado e a liderança espiritual, antes de qualquer unção pela Igreja [ROOT.Char.GetFaith.GetAdjective]?\""
 ecumenical_council_events.0010.desc.natural_primitivism.explanation:0 "\"Perguntam-nos: acha-se a santidade no abandono das cidades e na adoção de uma vida nos ermos, um retorno ao primeiro estado de ser?\""
 ecumenical_council_events.0010.desc.no_mind.explanation:0 "\"Perguntam-nos: é [ROOT.Char.GetFaith.HighGodName] buscado através do esvaziamento da mente e de um silêncio do eu?\""
 ecumenical_council_events.0010.desc.ora_et_labora.explanation:0 "\"Perguntam-nos se a vida sagrada deve alinhar oração e trabalho. É a ociosidade a inimiga da alma? Deve nosso labor no campo ou no scriptorium ser tão reverenciado quanto as horas da [ROOT.Char.Custom('GetReligiousRite')]?\""
 ecumenical_council_events.0010.desc.original_sin.explanation:0 "\"Perguntam-nos: herda cada alma o pecado de Adão? Estamos corrompidos desde o nascimento e necessitados da graça batismal?\""
 ecumenical_council_events.0010.desc.pacifism.explanation:0 "\"Perguntam-nos: não tem a espada lugar na vida de um [ROOT.Char.GetFaith.GetAdherentName]? É falsa a ideia de uma guerra justa?\""
 ecumenical_council_events.0010.desc.pastoral_isolation.explanation:0 "\"Perguntam-nos: deve o rebanho ser deixado só, para manter seus próprios costumes? Deve a Igreja [ROOT.Char.GetFaith.GetAdjective] desconfiar dos forasteiros e recusar sua interferência?\""
 ecumenical_council_events.0010.desc.peace_of_god.explanation:0 "\"Perguntam-nos: manteremos uma Paz e Trégua de [ROOT.Char.GetFaith.HighGodName]? Devem nossos povos jurar juramentos para poupar igrejas, clero e desarmados de pilhagens e derramamento de sangue? Podemos proibir a guerra nas estações sagradas, sob pena de banimento da Igreja [ROOT.Char.GetFaith.GetAdjective]?\""
 ecumenical_council_events.0010.desc.pentarchy.explanation:0 "\"Perguntam-nos: deve a Igreja [ROOT.Char.GetFaith.GetAdjective] ser governada por cinco sedes patriarcais em regra colegiada? Negaria isso a primazia do principal intercessor de [ROOT.Char.GetFaith.HighGodNamePossessive]?\""
 ecumenical_council_events.0010.desc.philanthropia.explanation:0 "\"Perguntam-nos: é o cuidado com os pobres um dever obrigatório da Igreja [ROOT.Char.GetFaith.GetAdjective]? Devemos financiar esmolas, hospitais e casas de misericórdia?\""
 ecumenical_council_events.0010.desc.polyamory.explanation:0 "\"Perguntam-nos: podem os fiéis compartilhar o amor com muitos, rejeitando a tese de que uma alma possui a afeição de outra?\""
 ecumenical_council_events.0010.desc.preservation.explanation:0 "\"Perguntam-nos: repousa a santidade no que é construído e preservado? Devem os templos e obras de [ROOT.Char.GetFaith.GetAdjective] ser cuidados para que possam florescer para sempre?\""
 ecumenical_council_events.0010.desc.pure_land.explanation:0 "\"Nos perguntam: o reino abençoado além do sofrimento é alcançado apenas pela confiança e devoção, e não pela riqueza, estudo ou domínio ritual?\""
 ecumenical_council_events.0010.desc.purgatory.explanation:0 "\"Nos perguntam: podem as almas nem totalmente puras nem totalmente condenadas ser purificadas após a morte? Poderão as orações e os ritos dos vivos auxiliá-las em seu caminho rumo a [ROOT.Char.GetFaith.HighGodName]?\""
 ecumenical_council_events.0010.desc.pursuit_of_knowledge.explanation:0 "\"Nos perguntam se a busca pelo conhecimento é um dever sagrado.\""
 ecumenical_council_events.0010.desc.pursuit_of_power.explanation:0 "\"Nos perguntam: o domínio sobre este mundo é um fim sagrado? A tomada de poder cumprirá a vontade de [ROOT.Char.GetFaith.HighGodNamePossessive]?\""
 ecumenical_council_events.0010.desc.reincarnation.explanation:0 "\"Nos perguntam: a alma retorna através de muitas vidas em vez de enfrentar o julgamento de [ROOT.Char.GetFaith.HighGodNamePossessive] apenas uma vez?\""
 ecumenical_council_events.0010.desc.religious_legal_pronouncements.explanation:0 "\"Nos perguntam: podem os doutores da Igreja [ROOT.Char.GetFaith.GetAdjective] emitir decretos vinculantes sobre cada nova questão de fé e lei?\""
 ecumenical_council_events.0010.desc.ritual_cannibalism.explanation:0 "\"Nos perguntam: pode a carne dos mortos ser consumida como um rito sagrado?\""
 ecumenical_council_events.0010.desc.ritual_celebrations.explanation:0 "\"Nos perguntam se o calendário [ROOT.Char.GetFaith.GetAdjective] deve ser pródigo em festas sagradas, para unir os fiéis.\""
 ecumenical_council_events.0010.desc.ritual_hospitality.explanation:0 "\"Nos perguntam: é nosso dever sagrado acolher qualquer estrangeiro em nossa mesa?\""
 ecumenical_council_events.0010.desc.sacred_childbirth.explanation:0 "\"Nos perguntam se o parto deve ser preparado com ritos sagrados. Deve o local do nascimento ser purificado para que [ROOT.Char.GetFaith.HighGodName] abençoe mãe e filho?\""
 ecumenical_council_events.0010.desc.sacred_destruction.explanation:0 "\"Nos perguntam: pode a destruição ser sagrada em si mesma? É a derrocada do antigo o que [ROOT.Char.GetFaith.HighGodName] exige de nós?\""
 ecumenical_council_events.0010.desc.sacred_shadows.explanation:0 "\"Nos perguntam: pode a decepção ser sagrada? Podem os fiéis mentir, e até passar a acreditar nessas mentiras, quando a verdade colocar a fé em perigo?\""
 ecumenical_council_events.0010.desc.sacrificial_ceremonies.explanation:0 "\"Nos perguntam se a vida humana pode ser oferecida em cerimônia sagrada. Podem os voluntários dar a si mesmos, e os culpados serem entregues, sobre os altares de [ROOT.Char.GetFaith.GetAdjective]?\""
 ecumenical_council_events.0010.desc.sanctity_of_nature.explanation:0 "\"Nos perguntam se o bosque florestal, o rio caudaloso e o vale banhado pelo orvalho são sagrados. É nos ermos que devemos buscar [ROOT.Char.GetFaith.HighGodName]?\""
 ecumenical_council_events.0010.desc.scholasticism.explanation:0 "\"Nos perguntam: pode a fé buscar a compreensão através da razão? Devem as escolas aplicar a dialética e a filosofia à ordenação e defesa da doutrina?\""
 ecumenical_council_events.0010.desc.simony.explanation:0 "\"Nos perguntam: podem o santo ofício, a bênção ou o sacramento ser comprados e vendidos por ouro?\""
 ecumenical_council_events.0010.desc.sinitic_syncretism.explanation:0 "\"Nos perguntam: podem os ritos e o cânon do Oriente distante ser entrelaçados em nossa fé?\""
 ecumenical_council_events.0010.desc.struggle_submission.explanation:0 "\"Nos perguntam se a vida [ROOT.Char.GetFaith.GetAdjective] deve moldar-se ao redor da luta e da submissão. Deve o crente render-se inteiramente à vontade de [ROOT.Char.GetFaith.HighGodNamePossessive|U]?\""
 ecumenical_council_events.0010.desc.sun_worship.explanation:0 "\"Nos perguntam se devemos direcionar nossas preces ao sol. É esta luz que dá vida a nossa [ROOT.Char.GetFaith.HighGodName]?\""
 ecumenical_council_events.0010.desc.takamin.explanation:0 "\"Nos perguntam: é o poderoso urso um receptáculo do divino? Deve a caçada honrar a grande besta como sagrada e abatê-la apenas com santo respeito?\""
 ecumenical_council_events.0010.desc.tax_nonbelievers.explanation:0 "\"Nos perguntam: podem os descrentes permanecer sob o domínio [ROOT.Char.GetFaith.GetAdjective] pagando um tributo por proteção?\""
 ecumenical_council_events.0010.desc.transubstantiation.explanation:0 "\"Nos perguntam se, pela consagração do sacerdote, o pão e o vinho no altar são verdadeiramente transformados no Corpo e Sangue de Cristo.\""
 ecumenical_council_events.0010.desc.unreformed_syncretism.explanation:0 "\"Nos perguntam: podem os antigos costumes populares dos novos conversos ser deixados intactos, aprendendo-se deles discretamente em vez de derrubados e condenados?\""
 ecumenical_council_events.0010.desc.unrelenting_faith.explanation:0 "\"Nos perguntam: deve a fé perseverar inabalavelmente através da perseguição, das dificuldades e da dúvida? Estamos obrigados a manter-nos firmes, custe o que custar?\""
 ecumenical_council_events.0010.desc.vows_of_poverty.explanation:0 "\"Nos perguntam se servimos melhor a [ROOT.Char.GetFaith.HighGodName] ao fazermos votos de pobreza, como fizeram os Apóstolos.\""
 ecumenical_council_events.0010.desc.warmonger.explanation:0 "\"Nos perguntam: são a guerra e a conquista um santo serviço em si mesmas? É a espada a maneira mais segura de espalhar a palavra de [ROOT.Char.GetFaith.HighGodName]?\""
 ecumenical_council_events.0010.t:0 "\"Nossa Postura sobre [ec_debate_topic_1.GetNameNoTooltip( ROOT.GetCharacter.GetRite )]\""
