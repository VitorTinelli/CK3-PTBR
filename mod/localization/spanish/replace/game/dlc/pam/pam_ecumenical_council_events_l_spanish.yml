 ecumenical_council_events.0011.desc.outro:0 "Nosso anfitrião [host.GetTitledFirstName] proclama:\n\n\"Proponho tornar [ec_debate_topic_1.GetNameNoTooltip( ROOT.GetCharacter.GetRite )]"
