l_spanish:
 pam_mystical_birthright_spiritual_leader_modifier:0 "Direito de Primogenitura Auspicioso"
 pam_mystical_birthright_spiritual_leader_modifier_desc:0 "Um sinal congênito presente desde o nascimento moldou a criação espiritual deste personagem."
 pam_personal_sacrifice_of_wealth_county_modifier:0 "Investimento Devocional"
 pam_personal_sacrifice_of_wealth_county_modifier_desc:0 "A oferenda devocional de um governante está fomentando o crescimento deste condado."
 pam_religious_delirium_modifier:0 "Delírio Religioso"
 pam_religious_delirium_modifier_desc:0 "Este personagem tem certeza de que o próprio paraíso fala com ele:\n$EFFECT_LIST_BULLET$[spiritual_fulfillment|E] ganho: #P +50%#!\n$EFFECT_LIST_BULLET$[spiritual_fulfillment|E] perda: #N +50%#!"
 pam_sf_besieged_by_demons_modifier:0 "Asediado por Demônios"
 pam_sf_besieged_by_demons_modifier_desc:0 "A mente deste personagem está sob cerco demoníaco, delirando, convulsionando e distanciando-se ainda mais da razão a cada dia que passa."
 pam_sf_blessed_bell_county_modifier:0 "Um Sino Batizado"
 pam_sf_blessed_bell_county_modifier_desc:0 "O sino da igreja deste condado foi lavado, ungido e batizado. O povo confia em sua voz para afastar tempestades e demônios."
 pam_sf_church_ale_county_modifier:0 "Cerveja da Igreja"
 pam_sf_church_ale_county_modifier_desc:0 "O governante deste condado bebeu a cerveja da igreja com a paróquia, e a paróquia ainda está agitada."
 pam_sf_church_builder_modifier:0 "Construtor de Igrejas"
 pam_sf_church_builder_modifier_desc:0 "Tendo erguido uma primeira casa de adoração, este personagem constrói igrejas de forma um pouco mais barata e obtém um fluxo constante de piedade."
 pam_sf_consecrated_arms_modifier:0 "Armas Consagradas"
 pam_sf_consecrated_arms_modifier_desc:0 "Este personagem teve as armas de sua casa abençoadas em um dia de festa sagrada."
 pam_sf_consecrated_county_modifier:0 "Recentemente Consagrado"
 pam_sf_consecrated_county_modifier_desc:0 "Este condado tem uma igreja recentemente consagrada."
 pam_sf_consolation_modifier:0 "Em Paz"
 pam_sf_consolation_modifier_desc:0 "Este personagem está em paz."
 pam_sf_demon_torment_modifier:0 "Tormento Demoníaco"
 pam_sf_demon_torment_modifier_desc:0 "Este personagem está convencido de que é assombrado por um demônio, e precisa construir um [GetBuilding('temple_01').GetName] [holding|E] ou partir em uma [GetActivityType('activity_pilgrimage').GetName]."
 pam_sf_devotion_modifier:0 "Devoção à Prosperidade"
 pam_sf_devotion_modifier_desc:0 "Este personagem fez uma dedicação privada de devoção, recompensada silenciosamente em piedade e moedas."
 pam_sf_doctrine_clarity_modifier:0 "Epifania"
 pam_sf_doctrine_clarity_modifier_desc:0 "Este personagem teve um raro momento de clareza, uma epifania."
 pam_sf_ear_of_clergy_modifier:0 "O Ouvido do Clero"
 pam_sf_ear_of_clergy_modifier_desc:0 "A Igreja é mais propensa a aceitar as petições deste personagem:\n$EFFECT_LIST_BULLET$#V $hof_ask_for_claim_interaction$#! Aceitação: #P +25#!\n$EFFECT_LIST_BULLET$#V $hof_ask_for_gold_interaction$#! Aceitação: #P +25#!\n$EFFECT_LIST_BULLET$#V $request_excommunication_interaction$#! Aceitação: #P +25#!\n$EFFECT_LIST_BULLET$#V $request_legitimacy_interaction$#! Aceitação: #P +25#!\n$EFFECT_LIST_BULLET$#V $ecclesiastic_grant_claim_interaction$#! Aceitação: #P +25#!\n$EFFECT_LIST_BULLET$#V $strengthen_claim_interaction$#! Aceitação: #P +25#!\n$EFFECT_LIST_BULLET$#V $request_enforce_succession_interaction$#! Aceitação: #P +25#!\n$EFFECT_LIST_BULLET$#V $request_white_peace_interaction$#! Aceitação: #P +25#!"
 pam_sf_extolled_pilgrimage_county_modifier:0 "Boas-Vindas de um Peregrino"
 pam_sf_extolled_pilgrimage_county_modifier_desc:0 "A notícia da peregrinação de seu governante ecoa por este condado, e o povo prospera com o orgulho disso."
 pam_sf_favorable_omen_modifier:0 "Presságio Favorável"
 pam_sf_favorable_omen_modifier_desc:0 "Este personagem lê os céus como um sinal de favor divino, e os fiéis se animam com a bênção."
 pam_sf_flagellant_cults_county_modifier:0 "Cultos Flagelantes"
 pam_sf_flagellant_cults_county_modifier_desc:0 "Bandos de penitentes fustigam a si mesmos pelas ruas deste condado."
 pam_sf_free_feast_discount_desc:0 "Um Banquete à Vista"
 pam_sf_free_feast_modifier:0 "Anseio por Banquete"
 pam_sf_free_feast_modifier_desc:0 "Um vislumbre de indulgência sagrada aumentou o apetite deste personagem:\n$EFFECT_LIST_BULLET$Próximo [GetActivityType( 'activity_feast').GetName] Custo: [gold_i]#P -100%#!\n#weak Gasto quando o banquete começa.#!"
 pam_sf_grace_modifier:0 "Uma Graça Recebida"
 pam_sf_grace_modifier_desc:0 "Este personagem recebeu uma graça, um agradecimento ou voto silencioso que eleva o espírito."
 pam_sf_grief_solace_modifier:0 "Consolado por um Espírito"
 pam_sf_grief_solace_modifier_desc:0 "Este personagem encontrou conforto silencioso após supostamente receber a visita de uma aparição."
 pam_sf_grief_warning_modifier:0 "Avisado por um Espírito"
 pam_sf_grief_warning_modifier_desc:0 "Este personagem acredita ter sido avisado por uma aparição."
 pam_sf_grinding_modifier:0 "Trabalho Sem Alma"
 pam_sf_grinding_modifier_desc:0 "Este personagem está trabalhando exaustivamente, e a alma sofre por isso."
 pam_sf_humiliated_modifier:0 "Votos Humilhantes"
 pam_sf_humiliated_modifier_desc:0 "Este personagem foi forçado a fazer votos sagrados e trancado em um claustro."
 pam_sf_immured_anchorite_modifier:0 "Anacoreta Emparedado"
 pam_sf_immured_anchorite_modifier_desc:0 "Este templo tem um anacoreta emparedado dentro de suas paredes."
 pam_sf_lingering_stench_modifier:0 "Fedor Persistente"
 pam_sf_lingering_stench_modifier_desc:0 "Por mais que este personagem tente, ele não consegue tirar o cheiro dos pés do mendigo que lavou."
 pam_sf_omen_of_victory_modifier:0 "Presságio de Vitória"
 pam_sf_omen_of_victory_modifier_desc:0 "Certos de que os céus prometeram a vitória, este personagem e seu exército marcham sem medo."
 pam_sf_peace_of_god_modifier:0 "Paz de Deus"
 pam_sf_peace_of_god_modifier_desc:0 "Este personagem jurou e impôs a Paz de Deus em todo o reino."
 pam_sf_penance_ambitious_modifier:0 "Contendo a Ambição"
 pam_sf_penance_ambitious_modifier_desc:0 "Este personagem está baixando os olhos ambiciosos em penitência, e com eles o seu renome."
 pam_sf_penance_arbitrary_modifier:0 "Governando com Justiça"
 pam_sf_penance_arbitrary_modifier_desc:0 "Este personagem está governando com justiça equânime em penitência por uma mão arbitrária, mais justo mas mais pobre."
 pam_sf_penance_arrogant_modifier:0 "Praticando a Humildade"
 pam_sf_penance_arrogant_modifier_desc:0 "Este personagem está humilhando um porte orgulhoso em penitência, e o renome diminui com isso."
 pam_sf_penance_brave_modifier:0 "Temperando o Valor"
 pam_sf_penance_brave_modifier_desc:0 "Este personagem está contendo em cautela o valor que sua fé considera pecaminoso, tornando o guerreiro embotado."
 pam_sf_penance_callous_modifier:0 "Cultivando a Misericórdia"
 pam_sf_penance_callous_modifier_desc:0 "Este personagem está cultivando a misericórdia em penitência por um coração insensível, com uma mão mais suave e o temor que inspirava a desaparecer."
 pam_sf_penance_calm_modifier:0 "Despertando o Espírito"
 pam_sf_penance_calm_modifier_desc:0 "Este personagem está transformando em fervor a calmaria que sua fé considera pecaminosa, tornando-se mais feroz, porém mais tenso."
 pam_sf_penance_chaste_modifier:0 "Livre de Restrições"
 pam_sf_penance_chaste_modifier_desc:0 "Este personagem está abrindo mão de uma castidade que sua fé considera pecaminosa, contra a sua própria natureza."
 pam_sf_penance_compassionate_modifier:0 "Sufocando a Misericórdia"
 pam_sf_penance_compassionate_modifier_desc:0 "Este personagem está reprimindo a misericórdia que sua fé considera pecaminosa, assumindo uma expressão mais severa por causa disso."
 pam_sf_penance_content_modifier:0 "Despertando o Desejo"
 pam_sf_penance_content_modifier_desc:0 "Este personagem está instigando o desejo contra um contentamento que sua fé considera pecaminoso, tornando-se inquieto e lutador."
 pam_sf_penance_craven_modifier:0 "Enfrentando o Medo"
 pam_sf_penance_craven_modifier_desc:0 "Este personagem está mantendo sua posição em penitência pela covardia, temendo cada momento disso."
 pam_sf_penance_cynical_modifier:0 "Rekindling Faith"
 pam_sf_penance_cynical_modifier_desc:0 "Este personagem está reacendendo a crença em penitência pelo cinismo, vestindo a fé como um casaco desconhecido."
 pam_sf_penance_deceitful_modifier:0 "Um Voto de franqueza"
 pam_sf_penance_deceitful_modifier_desc:0 "Este personagem está mantendo um voto de franqueza em penitência pela falsidade, com sua astúcia embotada."
 pam_sf_penance_diligent_modifier:0 "Descanso Forçado"
 pam_sf_penance_diligent_modifier_desc:0 "Este personagem está deixando de lado uma diligência que sua fé considera pecaminosa, mais calmo porém menos produtivo."
 pam_sf_penance_eccentric_modifier:0 "Adotando as Convenções"
 pam_sf_penance_eccentric_modifier_desc:0 "Este personagem está pondo de lado pensamentos mais estranhos em penitência pela excentricidade."
 pam_sf_penance_fickle_modifier:0 "Firmando a Alma"
 pam_sf_penance_fickle_modifier_desc:0 "Este personagem está mantendo um curso firme em penitência por uma alma inconstante, e isso causa incômodo."
 pam_sf_penance_forgiving_modifier:0 "Alimentando o Rancor"
 pam_sf_penance_forgiving_modifier_desc:0 "Este personagem está alimentando um rancor que sua fé exige acima do perdão, tornando-se mais frio e temido."
 pam_sf_penance_generous_modifier:0 "Fechando a Bolsa"
 pam_sf_penance_generous_modifier_desc:0 "Este personagem está contendo uma generosidade que sua fé considera pecaminosa, mais rico porém ressentido."
 pam_sf_penance_gluttonous_modifier:0 "Dias de Jejum"
 pam_sf_penance_gluttonous_modifier_desc:0 "Este personagem está jejuando em penitência pela gula, desgastando o corpo para alimentar a alma."
 pam_sf_penance_greedy_modifier:0 "Esmola Penitente"
 pam_sf_penance_greedy_modifier_desc:0 "Este personagem está dando esmolas em penitência pela ganância, com o cofre e a consciência mais leves."
 pam_sf_penance_gregarious_modifier:0 "Retirando-se para o Silêncio"
 pam_sf_penance_gregarious_modifier_desc:0 "Este personagem está se retirando de festas pecaminosas para o silêncio, conquistando menos amigos por isso."
 pam_sf_penance_honest_modifier:0 "Aprendendo a Dissimular"
 pam_sf_penance_honest_modifier_desc:0 "Este personagem está aprendendo a astúcia que sua fé preza acima da honestidade, tornando-se mais sagaz, mas menos confiável."
 pam_sf_penance_humble_modifier:0 "Adotando uma Postura Orgulhosa"
 pam_sf_penance_humble_modifier_desc:0 "Este personagem está exibindo o orgulho que sua fé exige em detrimento da humildade, tornando-se renomado, mas considerado vaidoso."
 pam_sf_penance_impatient_modifier:0 "Cultivando a Paciência"
 pam_sf_penance_impatient_modifier_desc:0 "Este personagem está disciplinando um temperamento impaciente em penitência, e a espera é angustiante."
 pam_sf_penance_just_modifier:0 "Governando por Capricho"
 pam_sf_penance_just_modifier_desc:0 "Este personagem está governando pelo capricho que sua fé exige em detrimento da justiça, tornando-se mais rico, mas menos amado."
 pam_sf_penance_lazy_modifier:0 "Trabalho Penitente"
 pam_sf_penance_lazy_modifier_desc:0 "Este personagem está assumindo um trabalho extenuante como penitência pela preguiça."
 pam_sf_penance_lustful_modifier:0 "Suprimindo a Luxúria"
 pam_sf_penance_lustful_modifier_desc:0 "Este personagem está cumprindo penitência pela luxúria, dominando o desejo ao custo de ter menos filhos."
 pam_sf_penance_paranoid_modifier:0 "Aprendendo a Confiar"
 pam_sf_penance_paranoid_modifier_desc:0 "Este personagem está aprendendo a confiar como penitência pela desconfiança, com portas abertas e guarda baixa."
 pam_sf_penance_patient_modifier:0 "Forçando o Ritmo"
 pam_sf_penance_patient_modifier_desc:0 "Este personagem está descartando a paciência que sua fé considera pecaminosa, andando apressado e desconfortável."
 pam_sf_penance_sadistic_modifier:0 "Renunciando à Crueldade"
 pam_sf_penance_sadistic_modifier_desc:0 "Este personagem está renunciando à crueldade em penitência, e o terror que ela comprava está desaparecendo."
 pam_sf_penance_shy_modifier:0 "Forçando a Ousadia"
 pam_sf_penance_shy_modifier_desc:0 "Este personagem está forçando uma fachada ousada como penitência por sua natureza reservada, tornando cada reunião um tormento."
 pam_sf_penance_stubborn_modifier:0 "Curvando a Vontade"
 pam_sf_penance_stubborn_modifier_desc:0 "Este personagem está curvando uma vontade obstinada à correção em penitência, cedendo onde antes não cederia."
 pam_sf_penance_temperate_modifier:0 "Quebrando o Longo Jejum"
 pam_sf_penance_temperate_modifier_desc:0 "Este personagem está abandonando a moderação que sua fé considera pecaminosa, tornando-se mais liberal de coração e de bolsa."
 pam_sf_penance_trusting_modifier:0 "Protegendo o Coração"
 pam_sf_penance_trusting_modifier_desc:0 "Este personagem está protegendo um coração que sua fé considera confiante demais, tornando-se mais cauteloso, mas tido como frio."
 pam_sf_penance_vengeful_modifier:0 "Praticando o Perdão"
 pam_sf_penance_vengeful_modifier_desc:0 "Este personagem está abandonando velhas inimizades como penitência pela vingança, tornando-se mais gentil com os cativos, mas mais lento para revidar."
 pam_sf_penance_wrathful_modifier:0 "Contendo a Ira"
 pam_sf_penance_wrathful_modifier_desc:0 "Este personagem está refreando sua ira em penitência, exibindo uma mão mais gentil e uma lâmina menos afiada."
 pam_sf_penance_zealous_modifier:0 "Temperando o Zelo"
 pam_sf_penance_zealous_modifier_desc:0 "Este personagem está brandindo um zelo que sua fé considera excessivo, e os devotos, por sua vez, tornam-se mais frios."
 pam_sf_pilgrimage_funded_discount_desc:0 "Peregrinação Patrocinada"
 pam_sf_pilgrimage_funded_modifier:0 "Peregrinação Patrocinada"
 pam_sf_pilgrimage_funded_modifier_desc:0 "Um patrono prometeu cobrir parte do custo da próxima peregrinação deste personagem:\n$EFFECT_LIST_BULLET$[GetActivityType( 'activity_pilgrimage').GetName] Custo: [gold_i]#P -50%#!"
 pam_sf_promised_acclaim_modifier:0 "A Promessa de um Peregrino"
 pam_sf_promised_acclaim_modifier_desc:0 "O capelão da corte deste personagem prometeu proclamar sua próxima peregrinação concluída ao povo da capital.\n\nAo concluir uma peregrinação, seu [capital|E] ganhará [GetModifier('pam_sf_extolled_pilgrimage_county_modifier').GetNameWithTooltip] por #V 15#! anos."
 pam_sf_relic_procession_county_modifier:0 "A Aparição do Santo"
 pam_sf_relic_procession_county_modifier_desc:0 "A relíquia de um santo foi carregada por este condado em procissão solene, e o povo caminha um pouco mais orgulhoso por isso."
 pam_sf_safe_passage_modifier:0 "Passagem Segura"
 pam_sf_safe_passage_modifier_desc:0 "Este viajante recebeu uma escolta e passagem segura após um resgate na estrada."
 pam_sf_scriptorium_county_modifier:0 "Escribas em Ação"
 pam_sf_scriptorium_county_modifier_desc:0 "Estudiosos estabelecidos copiam e mantêm as contas desta baronia."
 pam_sf_serenity_modifier:0 "Exaltando Rituais Públicos"
 pam_sf_serenity_modifier_desc:0 "As devoções públicas deste personagem o cativaram perante o clero e a corte."
 pam_sf_site_of_miracle_county_modifier:0 "Local de um Milagre"
 pam_sf_site_of_miracle_county_modifier_desc:0 "Este condado é o local de um milagre, atraindo peregrinos e bandidos igualmente."
 pam_sf_stroke_of_god_modifier:0 "Golpe Divino"
 pam_sf_stroke_of_god_modifier_desc:0 "Uma apoplexia súbita abateu este personagem, o que os médicos chamam de 'golpe de Deus', um golpe divino que inunda o cérebro e deixa o corpo e a mente incapacitados em seu rastro."
 pam_sf_visionary_renown_modifier:0 "Uma Visão Proclamada"
 pam_sf_visionary_renown_modifier_desc:0 "Este personagem proclamou uma visão divina à corte, polindo sua reputação."
 pam_sf_voice_of_jesus_modifier:0 "Voz de Deus"
 pam_sf_voice_of_jesus_modifier_desc:0 "Este personagem foi interpelado por uma voz divina e ergueu-se transfigurado, com todas as faculdades aguçadas, como se tocado pela mão de Deus."
 pam_sf_waylaid_road_modifier:0 "Atacado na Estrada"
 pam_sf_waylaid_road_modifier_desc:0 "A jornada deste viajante tornou-se perigosa após um ataque na estrada."
