l_spanish:
 pam_clergy_events.0001.a:0 "Que seja conhecido por todos os tempos."
 pam_clergy_events.0001.desc:0 "Meu [chaplain.GetCouncilTitle|l] [chaplain.GetFirstName] vira para a próxima linha em branco no registro dos sucessores de São Pedro, um testemunho vivo de [GetTenetType('tenet_apostolic_succession').GetName( GetPlayer.GetRite )].\n\n#emp \"O nome que você escolher sobreviverá ao seu reinado por mil gerações.\"#! \n\n[chaplain.GetHerHis|U] a pena marca o local onde a tinta deve ser colocada.\n\n#emp \"Quo nomine vis vocari?\"#!"
 pam_clergy_events.0001.t:0 "Quo Nomine Vis Vocari?"
 pam_clergy_events.0003.desc:0 "Um princípio fundamental de [pam_recast_rite.GetNameNoTooltip] mudou sob [pam_recast_pope.GetTitledFirstName]: [tenet_to_remove.GetBaseName] dá lugar a [tenet_to_add.GetBaseName]."
 pam_clergy_events.0003.t:0 "Um Princípio Reformulado"
 pam_clergy_events.0010.a:0 "\"Assim o farei, [actor.Custom('FormOfAddressForLiege')]!\""
 pam_clergy_events.0010.b:0 "Os dízimos podem ser melhor empregados..."
 pam_clergy_events.0010.desc.convert_faith:0 "uma missão para impulsionar a conversão de [ROOT.Char.Custom('GetUnbelieverNamePlural')] em e ao redor de [archdiocese.GetName]."
 pam_clergy_events.0010.desc.cultural_fascination:0 "uma missão para acelerar a pesquisa de novas tecnologias para [actor.GetHerHis] colega [actor.GetCulture.GetCollectiveNoun]."
 pam_clergy_events.0010.desc.develop:0 "o desenvolvimento de obras públicas para a prosperidade de todos os [recipient.GetFaith.GetAdherentNamePlural] em [archdiocese.GetName]."
 pam_clergy_events.0010.desc.epidemic_resistance:0 "a mobilização de recursos da igreja para ajudar na mitigação de pragas em [archdiocese.GetName]."
 pam_clergy_events.0010.desc.improve_legitimacy:0 "uma missão para reforçar a legitimidade de monarcas [recipient.GetFaith.GetAdjective] em [archdiocese.GetName]."
 pam_clergy_events.0010.desc.increase_control:0 "uma missão para pacificar a população em [archdiocese.GetName]."
 pam_clergy_events.0010.desc.intro:0 "Como [cardinalate.GetHolder.GetTitleAsNameNoTooltip], sou uma extensão da vontade de [actor.Custom('GetMotherFatherPossessive')|U] Santa.\n\n"
 pam_clergy_events.0010.desc.puppet.intro:0 "Meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))], a quem honro acima de todos os outros, guia minha mão em meus deveres como [cardinalate.GetHolder.GetTitleAsNameNoTooltip].\n\n"
 pam_clergy_events.0010.desc.undermine_legitimacy:0 "uma missão para minar a legitimidade de monarcas [recipient.GetFaith.GetAdjective] em [archdiocese.GetName]."
 pam_clergy_events.0010.desc:0 "Na infinita sabedoria de [actor.GetHerHis], [actor.GetTitledFirstName] julgou necessário que eu buscasse"
 pam_clergy_events.0010.t:0 "A Vontade de [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))|U]"
 pam_clergy_events.0030.a:0 "Glória ao trono de São Pedro."
 pam_clergy_events.0030.aa.tt:0 "Futuros eventos de Habemus Papam aparecerão como mensagens"
 pam_clergy_events.0030.aa:0 "Quem se importa com os assuntos da Igreja?"
 pam_clergy_events.0030.b.tt:0 "[GetDecisionWithKey('declare_antipope_decision').GetName] [decision|E] é mais barato por #V 15 anos#!"
 pam_clergy_events.0030.b:0 "Um falso profeta parece ter surgido."
 pam_clergy_events.0030.desc:0 "A fumaça branca proclama o novo [new_pope.GetTitledFirstName] no centro de [new_pope.GetCurrentLocation.GetName]:\n\n\"Que os Santos Apóstolos Pedro e Paulo, em cujo poder e autoridade confiamos, intercedam por nós perante o Senhor. E que a bênção de Deus Todo-Poderoso, o Pai, o Filho e o Espírito Santo, desça sobre vós e permaneça convosco para sempre.\"\n\n\"Amém.\""
 pam_clergy_events.0030.feed:0 "[new_pope.GetTitledFirstName] foi eleito [head_of_faith|E]."
 pam_clergy_events.0030.t.female:0 "Habemus Mamam"
 pam_clergy_events.0030.t:0 "Habemus Papam"
 pam_clergy_events.0040.a:0 "Aceito este fardo sagrado."
 pam_clergy_events.0040.appoint_tt:0 "Você foi nomeado [cardinal|E]"
 pam_clergy_events.0040.desc:0 "Com o Colégio Sagrado diminuído, achei por bem elevá-lo ao cardinalato. Que sua piedade e sabedoria fortaleçam a Igreja nesta hora de necessidade."
 pam_clergy_events.0040.opening:0 "Ao piadoso [head_of_faith.Custom2('AppropriateGreeting', ROOT.Char)],"
 pam_clergy_events.0041.a:0 "Esta insolência não será esquecida."
 pam_clergy_events.0041.appoint_tt:0 "[cardinal_candidate.GetShortUIName|U] proclama [cardinal_candidate.GetHerselfHimself] [cardinal|E]"
 pam_clergy_events.0041.desc:0 "O Colégio Cardinalício permanece incompleto, e você ainda não preencheu os assentos deixados vagos pelo nosso piíssimo [ROOT.Char.GetWomenMen].\n\nNão deixarei a Igreja desprotegida! Tomarei o chapéu vermelho para mim."
 pam_clergy_events.0041.opening:0 "Para a sede de São Pedro,"
 pam_clergy_events.0042.a:0 "Um Colégio completo me serve melhor do que um vazio."
 pam_clergy_events.0042.desc:0 "Os assentos do Colégio estavam vazios, e a Igreja não pode esperar por cerimônias. Vários de nossos irmãos piíssimos assumiram o chapéu vermelho juntos, e o Colégio está completo mais uma vez.\n\nEsperamos que perdoe nossa pressa."
 pam_clergy_events.0042.opening:0 "$pam_clergy_events.0041.opening$"
 pam_clergy_events.0051.a.keep_see_tt:0 "Você mantém o controle de [title.GetName]"
 pam_clergy_events.0051.a:0 "O que for necessário para servir ao meu rebanho."
 pam_clergy_events.0051.b.tt:0 "Todos os seus [landed|E] [titles|E] são destruídos"
 pam_clergy_events.0051.b:0 "Só posso servir a outros [old_faith.GetAdherentNamePluralNoTooltip]."
 pam_clergy_events.0051.c.tt:0 "[SelectLocalization( HasDlcFeature( 'roads_to_power' ), 'pam_clergy_events.0051.c.tt_ep3', 'pam_clergy_events.0051.c.tt_no_ep3' )]"
 pam_clergy_events.0051.c.tt_ep3:0 "#mixed_value #BER Você estabelecerá um [adventurer|E] [camp|E]#!#!"
 pam_clergy_events.0051.c.tt_no_ep3:0 "#negative_value #BER Você [game_over|E]#!#!"
 pam_clergy_events.0051.c:0 "Aceito o fim do meu cargo."
 pam_clergy_events.0051.desc:0 "Minha sede em [county.GetNameNoTier|U] treme sob meus pés. As almas a cujo serviço dediquei minha vida agora rezam como [new_faith.GetAdherentNamePlural].\n\nDevo me converter e manter o controle? Eu poderia cuidar do povo de [title.GetName], mas posso realmente ajudar aqueles que não são mais [old_faith.GetAdherentNamePlural]? Pode vir algum bem do fato de sermos todos forçados a praticar [new_faith.GetNameNoTooltip]?!"
 pam_clergy_events.0051.t:0 "Uma Mudança Sísmica na Fé"
 pam_clergy_events.0052.a:0 "Que assim seja."
 pam_clergy_events.0052.desc:0 "Apesar de como aconteceu, não posso mais pastorear legitimamente [title.GetDefinitiveName]. O que a Igreja um dia colocou em minhas mãos agora passa para longe dela."
 pam_clergy_events.0052.t:0 "O Fim de [title.GetNameNoTooltip]"
 pam_clergy_events.0060.a.antipope:0 "Essa contenda não é minha para herdar."
 pam_clergy_events.0060.a:0 "Uma bênção para a Igreja e para [new_prelate.GetDynasty.GetNameNoTooltip]."
 pam_clergy_events.0060.b.antipope:0 "Apenas eu posso resolver esta crise."
 pam_clergy_events.0060.b.antipope_tt:0 "[new_prelate.GetTitledFirstName|U] ocupa o cargo por desafio e não por eleição. Todos que rejeitam a reivindicação virão atrás dele."
 pam_clergy_events.0060.b.faith_tt:0 "[new_prelate.GetTitledFirstName|U] não compartilha da sua fé. Você continuará como [new_prelate.GetFaith.GetAdherentName]."
 pam_clergy_events.0060.b.tt:0 "@warning_icon! Você abandonará seu personagem atual e não poderá retomar o controle dele mais tarde.\n\n#TUT Quando [new_prelate.GetShortUINameNoTooltip] morrer, você jogará com seu [player_heir|E], que herda este [ecclesiastical|E] cargo por [appointment|E] ou eleição, e não por sucessão [dynasty|E].#!"
 pam_clergy_events.0060.b:0 "Eu gostaria de examinar mais de perto [prelate_title.GetDefinitiveNameNoTooltip]."
 pam_clergy_events.0060.desc.antipope:0 "Meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] foi proclamado [new_prelate.GetFaith.ReligiousHeadName|U] enquanto outro ainda está no trono. Todo [new_prelate.GetFaith.GetAdherentName] deve agora escolher quem é o representante de [new_prelate.GetFaith.HighGodName|U]. Até que isso se resolva, todas as nossas almas estão em perigo."
 pam_clergy_events.0060.desc.archbishop:0 "Meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] foi investido com [prelate_title.GetDefinitiveName]. Dízimos, abadias e a sagração de cada [new_prelate.GetFaith.BishopNeuter] sob [new_prelate.GetHerHim] agora são guiados por um [new_prelate.GetDynasty.GetNameNoTooltip]."
 pam_clergy_events.0060.desc.different_faith:0 "\n\n[new_prelate.GetHerHis|U] fé é [new_prelate.GetFaith.GetNameNoTooltip] e não [ROOT.Char.GetFaith.GetNameNoTooltip], mas ainda assim somos da mesma família."
 pam_clergy_events.0060.desc.head_of_faith:0 "Meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] detém [prelate_title.GetDefinitiveName]."
 pam_clergy_events.0060.desc.hof_outro:0 "Reis e Imperadores não passam de crianças à sombra da vontade de seu Santo [new_prelate.Custom('GetMotherFatherPossessive')|U]. Um exército de [new_prelate.GetFaith.BishopMalePlural] está agora sob o comando de um [new_prelate.GetDynasty.GetNameNoTooltip]."
 pam_clergy_events.0060.desc.intro:0 "Há muito nossa dinastia busca guiar a Cristandade. Agora [new_prelate.GetFaith.HighGodName|U] achou por bem elevar [new_prelate.GetDynasty.GetName] a novos patamares.\n\n"
 pam_clergy_events.0060.desc.pope:0 "Meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] foi elevado ao Trono de São Pedro, vigário de [new_prelate.GetFaith.HighGodNamePossessive] na terra."
 pam_clergy_events.0060.t.antipope:0 "Um [new_prelate.GetDynasty.GetNameNoTooltip] Reivindica [new_prelate.GetFaith.ReligiousHeadTitleName|U]"
 pam_clergy_events.0060.t.archbishop:0 "Um [new_prelate.GetDynasty.GetNameNoTooltip] Pega no báculo"
 pam_clergy_events.0060.t.head_of_faith:0 "Um [new_prelate.GetDynasty.GetNameNoTooltip] [new_prelate.GetFaith.ReligiousHeadName|U]"
 pam_clergy_events.0060.t.pope:0 "Um [new_prelate.GetDynasty.GetNameNoTooltip] no Trono de São Pedro"
