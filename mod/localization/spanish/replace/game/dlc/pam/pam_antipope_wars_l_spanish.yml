l_spanish:
 PAM_ANTIKING_WAR_CB_NAME:0 "Depor [challenger_hof|E]"
 PAM_CHALLENGE_HOF_WAR_CB_NAME:0 "Desafiar [head_of_faith|E]"
 ROMANS_1_32_GLOSS:0 "#weak Romanos 1:32, NRSVUE#!"
 msg_pam_antiking_cb_invalidated_message:0 "A guerra terminou: o defensor não patrocina mais um [challenger_hof|E]."
 msg_pam_challenge_hof_cb_invalidated_message:0 "A guerra terminou: o defensor não é mais [head_of_faith|E]."
 msg_pam_challenge_hof_cb_invalidated_no_challenger_message:0 "A guerra terminou: não há mais um desafiante para a cabeça da fé."
 pam_antiking_cb:0 "$PAM_ANTIKING_WAR_CB_NAME$"
 pam_antiking_cb_defeat_desc:0 "O [challenger_hof|E] sobrevive."
 pam_antiking_cb_defeat_desc_attacker:0 "Sua tentativa de remover o [challenger_hof|E] falha."
 pam_antiking_cb_victory_desc:0 "O [challenger_hof|E] é deposto."
 pam_antiking_cb_victory_desc_attacker:0 "Você remove [defender.GetShortUINamePossessive] [challenger_hof|E] e ganha a gratidão de [attacker.GetFaith.GetReligiousHead.GetShortUINamePossessive]."
 pam_antiking_cb_victory_desc_attacker_no_gratitude:0 "Você remove [defender.GetShortUINamePossessive] [challenger_hof|E]."
 pam_antiking_cb_white_peace_desc:0 "O [challenger_hof|E] permanece."
 pam_antipope_events.0010.a.christian:0 "Uma cela pode tornar [pam_ch_hof_challenger.GetHerHim] tão penitente quanto Jonas."
 pam_antipope_events.0010.a:0 "Tranque [pam_ch_hof_challenger.GetHerHim]."
 pam_antipope_events.0010.b.christian:0 "Execute [pam_ch_hof_challenger.GetHerHim]. O Senhor conhece os Seus."
 pam_antipope_events.0010.b:0 "Execute [pam_ch_hof_challenger.GetHerHim]. [ROOT.Char.GetFaith.HighGodName] julgará o resto."
 pam_antipope_events.0010.c:0 "Mostrar piedade."
 pam_antipope_events.0010.d:0 "[pam_ch_hof_challenger.GetSheHe|U] gritará o nome do verdadeiro [ROOT.Char.GetFaith.ReligiousHeadName|U]."
 pam_antipope_events.0010.desc.christian:0 "O [pam_ch_hof_challenger.Custom('InsultAdjectiveGeneric')] cismático [pam_ch_hof_challenger.GetTitledFirstName] ajoelha-se diante de mim, agora despojado de [pam_ch_hof_challenger.GetHerHis] falso [ROOT.Char.GetFaith.ReligiousHeadTitleName|U].\n\nSempre desafiador, [pam_ch_hof_challenger.GetSheHe] declara: \"A Arca está onde quer que eu esteja. Não aos seus pés.\"\n\n[pam_ch_hof_challenger.GetHerHis|U] língua ainda é serva de Satanás, ao que parece."
 pam_antipope_events.0010.desc:0 "O impostor [pam_ch_hof_challenger.GetTitledFirstName] ajoelha-se diante de mim, despojado de [pam_ch_hof_challenger.GetHerHis] falso [ROOT.Char.GetFaith.ReligiousHeadTitleName|U].\n\nSempre desafiador, [pam_ch_hof_challenger.GetSheHe] responde: \"Eu sou o verdadeiro [ROOT.Char.GetFaith.ReligiousHeadName].\""
 pam_antipope_events.0010.t:0 "O Pretendente Derrotado"
 pam_antipope_events.0011.a:0 "Confiscar a bolsa que fomentou isso."
 pam_antipope_events.0011.b:0 "Execute [pam_ch_hof_sponsor.GetHerHim]. O consentimento tem um preço."
 pam_antipope_events.0011.c:0 "A desonra na casa de [pam_ch_hof_sponsor.GetHerHis] já é punição suficiente."
 pam_antipope_events.0011.d:0 "Açoite [pam_ch_hof_sponsor.GetHerHim] até que a carne ceda."
 pam_antipope_events.0011.desc.christian:0 "A bolsa de [pam_ch_hof_sponsor.GetTitledFirstNamePossessive] fomentou esta ruptura ímpia, erguendo um [ROOT.Char.GetFaith.ReligiousHeadName|U] rival contra [ROOT.Char.GetRite.GetName].\n\nAs Escrituras não são gentis com tais patronos: [Glossary('$pam_romans_1_32_english|q$','ROMANS_1_32_GLOSS')]\n\n[pam_ch_hof_sponsor.GetSheHe|U] olha para cima, desafiador até o fim: \"Você não é [ROOT.Char.GetFaith.ReligiousHeadName], mas um falso monge. Desça, desça, para ser condenado por todas as idades.\""
 pam_antipope_events.0011.desc:0 "O ouro de [pam_ch_hof_sponsor.GetTitledFirstNamePossessive] levantou um [ROOT.Char.GetFaith.ReligiousHeadName|U] rival para dividir a [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip].\n\n[pam_ch_hof_sponsor.GetSheHe|U] olha para cima: \"Você não é [ROOT.Char.GetFaith.ReligiousHeadName]. Você é uma farsa.\""
 pam_antipope_events.0011.t:0 "O Preço do Patronato"
 pam_antipope_events.0012.a:0 "Uma cela pode esfriar esse orgulho."
 pam_antipope_events.0012.b:0 "Duas cabeças fazem um monstro; uma precisa ir embora."
 pam_antipope_events.0012.c:0 "Já houve conflito suficiente. Deixe [pam_ch_hof_old_hof.GetHerHim] ir em paz."
 pam_antipope_events.0012.d:0 "[pam_ch_hof_old_hof.GetSheHe|U] gritará o nome do verdadeiro [ROOT.Char.GetFaith.ReligiousHeadName|U]."
 pam_antipope_events.0012.dialogue.christian:0 "\n\nSempre desafiador, [pam_ch_hof_old_hof.GetSheHe] vocifera: \"Pela espada tomaste o trono da paz.\"\n\n\"O Senhor achou por bem dar-me as ferramentas necessárias para cumprir Seu plano,\" respondo."
 pam_antipope_events.0012.dialogue:0 "\n\n[pam_ch_hof_old_hof.GetSheHe|U] diz: \"Você tomou isto pela espada.\"\n\n\"E pela espada eu a mantenho,\" eu respondo."
 pam_antipope_events.0012.intro.christian:0 "[ROOT.Char.GetRite.GetName] responde a mim. O falso [ROOT.Char.GetFaith.ReligiousHeadName|U], [pam_ch_hof_old_hof.GetTitledFirstName], ajoelha-se aos meus pés."
 pam_antipope_events.0012.intro.sponsor:0 "Meu [ROOT.Char.GetFaith.ReligiousHeadName|U] [pam_ch_hof_new_hof.GetFirstName] está entronizado. O pretendente, [pam_ch_hof_old_hof.GetTitledFirstName], ajoelha-se perante mim."
 pam_antipope_events.0012.intro:0 "Os [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip] respondem a mim. O falso [ROOT.Char.GetFaith.ReligiousHeadName|U], [pam_ch_hof_old_hof.GetTitledFirstName], ajoelha-se aos meus pés."
 pam_antipope_events.0012.t.christian:0 "Uma Sentença para o Soldado de Satanás"
 pam_antipope_events.0012.t:0 "Julgamento do Deposto"
 pam_antipope_events.0014.a:0 "Que minha casa seja lembrada como fiel a [ROOT.Char.GetFaith.HighGodName]."
 pam_antipope_events.0014.b.toast:0 "Você está manchado com [GetModifier('pam_ch_hof_sacred_bloodguilt_modifier').GetName]"
 pam_antipope_events.0014.b:0 "Suas mãos não ficarão limpas."
 pam_antipope_events.0014.c:0 "Proteja minha casa desta vergonha."
 pam_antipope_events.0014.d:0 "Farei as pazes com o verdadeiro [ROOT.Char.GetFaith.ReligiousHeadName]."
 pam_antipope_events.0014.desc.broken:0 "\n\n[pam_ch_hof_judge.GetSheHe|U] e [pam_ch_hof_judge.GetHerHis] homens zombam de mim com risadas enquanto açoitam meu corpo. Não sou mais do que uma casca, tendo o trigo sido debulhado."
 pam_antipope_events.0014.desc.captive.christian:0 "\n\nDeram-me uma cela. Sempre me disseram que uma cela basta para um [ROOT.Char.GetWomanMan] santo."
 pam_antipope_events.0014.desc.captive:0 "\n\nDeram-me uma cela. É só isso que me será permitido."
 pam_antipope_events.0014.desc.condemned.christian:0 "\n\nAmei a justiça e odiei a iniquidade, e por isso morro."
 pam_antipope_events.0014.desc.condemned:0 "\n\nMorro pelo que considerava verdadeiro."
 pam_antipope_events.0014.desc.generic:0 "\n\nO julgamento foi proferido. O que vem a seguir cabe a mim escolher."
 pam_antipope_events.0014.desc.spared.christian:0 "\n\nParece que as pedras continuam em suas mãos e eu andarei em liberdade. Não devo desperdiçar esta misericórdia."
 pam_antipope_events.0014.desc.spared:0 "\n\nParece que andarei em liberdade. Não devo desperdiçar esta misericórdia."
 pam_antipope_events.0014.e.tt:0 "$prelude_events.0040.c.tt$"
 pam_antipope_events.0014.e:0 "A vilania que [pam_ch_hof_judge.GetTitledFirstNameNoTooltip] me ensinou, eu executarei."
 pam_antipope_events.0014.f:0 "Caminharei descalço até que minha penitência esteja cumprida."
 pam_antipope_events.0014.intro.judge:0 "\"Absolvo todos os [pam_ch_hof_judge.GetFaith.GetAdherentNamePlural] da obediência a ti,\" diz [pam_ch_hof_judge.GetTitledFirstName]."
 pam_antipope_events.0014.intro.mercy.christian:0 "\"Vai, e não peques mais,\" diz [pam_ch_hof_judge.GetTitledFirstName]."
 pam_antipope_events.0014.intro.mercy:0 "\"Vai. Não tornes a este caminho,\" diz [pam_ch_hof_judge.GetTitledFirstName]."
 pam_antipope_events.0014.t:0 "Julgamento Sobre Mim"
 pam_antipope_events.0015.a:0 "Que assim seja."
 pam_antipope_events.0015.desc.attacker_victory.christian:0 "Saibam que a guerra pela [ROOT.Char.GetFaith.ReligiousHeadTitleName|U] terminou. Iliberi a sede do jugo de Satanás, e [ROOT.Char.GetRite.GetName] seguirá minhas ordens."
 pam_antipope_events.0015.desc.attacker_victory:0 "Saibam que a guerra pela [ROOT.Char.GetFaith.ReligiousHeadTitleName|U] terminou. Eu detenho a sede, e os [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip] me seguem. Que os fiéis saibam que um novo [ROOT.Char.GetFaith.ReligiousHeadName] reina."
 pam_antipope_events.0015.desc.defender_victory.christian:0 "Saibam que o desafio cismático à [ROOT.Char.GetFaith.ReligiousHeadName|U] foi esmagado. O cargo do pretendente foi destruído, e [ROOT.Char.GetRite.GetName] mantém-se forte. Que nenhum príncipe ou prelado duvide a quem deve lealdade."
 pam_antipope_events.0015.desc.defender_victory:0 "Saibam que o desafio à [ROOT.Char.GetFaith.ReligiousHeadName|U] foi esmagado. O cargo do pretendente foi destruído, e os [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip] mantêm-se firmes. Que nenhum governante duvide a quem deve lealdade."
 pam_antipope_events.0015.opening:0 "Ao [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetTitledFirstNameNoTooltip],"
 pam_antipope_sponsor_vassalize_hof_tt:0 "[new_hof.GetShortUIName|U] [CharBecomeBecomes(new_hof)] [sponsor.GetShortUINamePossessive] [vassal|E]"
 pam_challenge_hof_cb:0 "$PAM_CHALLENGE_HOF_WAR_CB_NAME$"
 pam_challenge_hof_cb_defeat_desc:0 "$pam_challenge_hof_cb_defeat_desc_attacker$"
 pam_challenge_hof_cb_defeat_desc_attacker:0 "Seu desafio contra [head_of_faith|E] falha."
 pam_challenge_hof_cb_victory_desc:0 "O [challenger_hof|E] torna-se [head_of_faith|E]."
 pam_challenge_hof_cb_victory_desc_attacker:0 "Você toma os títulos de [head_of_faith_possessive|E] e [attacker.GetRite.GetName] torna-se o [mainline_rite|E]."
 pam_challenge_hof_cb_victory_desc_attacker_sponsor:0 "O [challenger_hof|E] que você patrocina toma os títulos de [head_of_faith_possessive|E] e [attacker.GetRite.GetName] torna-se o [mainline_rite|E]."
 pam_challenge_hof_cb_white_peace_desc:0 "[defender.GetShortUIName|U] continua a ser o [head_of_faith|E]."
 pam_challenge_hof_war_random_permanent_harm_tt:0 "Sofre um ferimento permanente aleatório"
 pam_clerical_disgrace_candidacy_penalty_desc:0 "Humilhado em uma guerra religiosa"
 pam_clerical_disgrace_modifier:0 "Desgraça Clerical"
 pam_clerical_disgrace_modifier_desc:0 "Este personagem foi humilhado em uma guerra religiosa, enfraquecendo sua [candidate_score|E] por [clerical_titles|E]."
 pam_humiliation_cb_papabile_score_loss_attacker_tt:0 "[attacker.GetShortUINamePossessive|U] [papabile_score|E] para a sucessão papal diminui em #N -25#!"
 pam_humiliation_cb_papabile_score_loss_tt:0 "[defender.GetShortUINamePossessive|U] [papabile_score|E] para a sucessão papal diminui em #N -25#!"
 pam_romans_1_32_english:0 "Os que praticam tais coisas merecem a morte... contudo, não apenas as fazem, como também aplaudem os que as praticam."
