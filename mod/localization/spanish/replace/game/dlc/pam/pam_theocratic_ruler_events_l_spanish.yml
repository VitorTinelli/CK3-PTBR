l_spanish:
 TRUCE_PAM_NEIGHBOR_GIFT:0 "\nTrégua baseada em presentes e respeito mútuo entre vizinhos"
 pam_fallen_knight_crusader_sword_desc:0 "A lâmina de um cavaleiro caído em defesa da fé, entalhada por espadas pagãs, com uma pequena cruz gravada no punho."
 pam_fallen_knight_crusader_sword_name:0 "Espada de Cruzado"
 pam_theocratic_ruler_events.0001.a:0 "Encontro evidências de que [subordinate_priest.GetSheHe] administrou mal os fundos sagrados…"
 pam_theocratic_ruler_events.0001.b.failure:0 "O padre não quer saber de razão"
 pam_theocratic_ruler_events.0001.b.success:0 "Os caminhos de Deus são misteriosos"
 pam_theocratic_ruler_events.0001.b.toast.failure:0 "[subordinate_priest.GetSheHe|U] fica com a doação para [ROOT.Char.GetFaith.HighGodName]."
 pam_theocratic_ruler_events.0001.b.toast.success:0 "Você persuade [subordinate_priest.GetHerHim] e toma o legado."
 pam_theocratic_ruler_events.0001.b:0 "\"Raciocinemos juntos como clérigos.\""
 pam_theocratic_ruler_events.0001.c:0 "Para o tesouro, com gratidão e zelo."
 pam_theocratic_ruler_events.0001.desc:0 "Um comerciante rico deixou um legado para a Igreja, e a quantia não é trivial.\n\nMeu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('subordinate_priest'))] [subordinate_priest.GetFirstName] trouxe os balanços e as cartas de intenção. [subordinate_priest.GetSheHe|U] olha para mim em busca de julgamento. \n\n\"O testamento afirma que os fundos devem ser usados para fortalecer a crença em [ROOT.Char.GetFaith.HighGodName]\"."
 pam_theocratic_ruler_events.0001.t:0 "Um Legado para a Igreja"
 pam_theocratic_ruler_events.0002.a:0 "Um presente modesto e uma oferta de paz."
 pam_theocratic_ruler_events.0002.b.acceptance:0 "Embaixada cortesã"
 pam_theocratic_ruler_events.0002.b.failure:0 "Minhas palavras soam vazias"
 pam_theocratic_ruler_events.0002.b.success:0 "Minha cortesia os conquista"
 pam_theocratic_ruler_events.0002.b.toast.failure:0 "[foreign_ruler.GetSheHe|U] permanece indiferente; suas palavras soam vazias"
 pam_theocratic_ruler_events.0002.b.toast.success:0 "Sua cortesia vence, a tolerância entre seus povos cresce"
 pam_theocratic_ruler_events.0002.b:0 "\"Busco um entendimento honesto entre nossos povos.\""
 pam_theocratic_ruler_events.0002.c:0 "Os pagãos não têm lugar em nossas terras."
 pam_theocratic_ruler_events.0002.desc:0 "[foreign_ruler.GetTitledFirstName], um vizinho e seguidor dos velhos caminhos de [foreign_ruler.GetFaith.GetName], cruzou para as minhas terras.\n\nO pequeno séquito tem outro destino, mas passa tão perto que o costume exige que eu os cumprimente formalmente em sua passagem.\n\nComo devo recebê-los?"
 pam_theocratic_ruler_events.0002.t:0 "Um Viajante do Outro Lado da Fronteira"
 pam_theocratic_ruler_events.0003.a.tt:0 "Você forma uma [alliance|E] com [alliance_target.GetShortUINameNoTooltip]"
 pam_theocratic_ruler_events.0003.a:0 "Envie emissários. Devemos permanecer unidos."
 pam_theocratic_ruler_events.0003.b.army:0 "Camponeses Fiéis"
 pam_theocratic_ruler_events.0003.b:0 "Reúna camponeses fiéis para a defesa da fronteira."
 pam_theocratic_ruler_events.0003.c:0 "Envie ajuda e restaure um condado recentemente saqueado."
 pam_theocratic_ruler_events.0003.d:0 "Coloco isso nas mãos de [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_theocratic_ruler_events.0003.desc:0 "A guerra e os saqueadores já testaram minhas terras o suficiente. Chamo [advisor.GetTitledFirstName], meu confiável [advisor.GetCouncilTitle], e ponderamos o que deve ser feito. \n\n\"Podemos estender a mão para [alliance_target.GetTitledFirstName]. Como um governante teocrático irmão de nossa fé, [alliance_target.GetSheHe] pode vir em nosso auxílio.\"\n\nOu devo manter este fardo em minhas próprias mãos?"
 pam_theocratic_ruler_events.0003.t:0 "Conselho para uma Fronteira Rigorosa"
 pam_theocratic_ruler_events.0004.a:0 "Por favor, deixem seus irmãos abençoarem minhas terras."
 pam_theocratic_ruler_events.0004.b:0 "Seu discípulo [monastic_monk.GetTitledFirstNameNoTooltip] fortaleceria minha corte."
 pam_theocratic_ruler_events.0004.c:0 "Vamos compartilhar algumas preces."
 pam_theocratic_ruler_events.0004.desc:0 "Com [monastic_order_head.GetPrimaryTitle.GetName] tão perto, convidei [monastic_order_head.GetTitledFirstName] para discutirmos como podemos aprofundar nossa colaboração.\n\n\"[monastic_order_head.GetFaith.HighGodName], não nos julgue pelo nosso orgulho, mas pela nossa disposição de servir\", diz [monastic_order_head.GetTitledFirstNameNoTooltip] suavemente."
 pam_theocratic_ruler_events.0004.t:0 "Irmãos como Vizinhos"
 pam_theocratic_ruler_events.0005.a:0 "Treine meu [ROOT.Char.Custom('GetFighterTermPlural')] na disciplina de sua ordem."
 pam_theocratic_ruler_events.0005.b:0 "Que [order_knight.GetTitledFirstNameNoTooltip] sirva como meu guarda-costas."
 pam_theocratic_ruler_events.0005.c:0 "Falemos de guerra justa."
 pam_theocratic_ruler_events.0005.desc:0 "Com [military_order_head.GetPrimaryTitle.GetName] estabelecido em meu reino, convido [military_order_head.GetTitledFirstName] para discutir como as espadas dos fiéis podem servir umas às outras.\n\n\"[military_order_head.GetFaith.HighGodName] não abençoa o aço ocioso, mas as lâminas erguidas em defesa dos fiéis\", diz [military_order_head.GetTitledFirstNameNoTooltip], enquanto o seguidor [military_order_head.GetHerHis] de [order_knight.GetTitledFirstName] se inclina em silêncio ao lado de [military_order_head.GetHerHim]."
 pam_theocratic_ruler_events.0005.t:0 "Espadas pela Fé"
 pam_theocratic_ruler_events.0006.a.tt:0 "Você ganha [gold_i][EmptyScope.ScriptValue('minor_gold_value')|0], aprisiona [local_peasant_leader.GetShortUINameNoTooltip] e [troubled_county.GetName] ganha #N Dízimos Forçados#! por 5 anos (#N -20#! [county_opinion|E])."
 pam_theocratic_ruler_events.0006.a:0 "Sem exceções e prendam o cabeço."
 pam_theocratic_ruler_events.0006.b.tt:0 "Você ganha [piety_i][EmptyScope.ScriptValue('minor_piety_gain')|0] e [troubled_county.GetName] ganha #P Dízimos Misericordiosos#! por 5 anos (#P +20#! [county_opinion|E])."
 pam_theocratic_ruler_events.0006.b:0 "Deixe isso passar. A misericórdia também pode servir a Deus."
 pam_theocratic_ruler_events.0006.c.tt:0 "Se possível, você ganha um [hook|E] sobre [ROOT.Char.GetCouncillor('councillor_steward').GetShortUINameNoTooltip] (um gancho de obrigação mais forte é usado quando disponível). [ROOT.Char.GetCouncillor('councillor_steward').GetShortUINameNoTooltip] perde [opinion|E] de você (#N -20#!, decai ao longo de 5 anos)."
 pam_theocratic_ruler_events.0006.c:0 "Meu intendente falhou comigo. A culpa é dele."
 pam_theocratic_ruler_events.0006.desc:0 "Um líder local, [local_peasant_leader.GetTitledFirstName], é trazido à minha presença. [local_peasant_leader.GetHerHis|U] aldeões retiveram o dízimo da igreja, alegando dificuldades.\n\n\"O inverno foi cruel, minha [ROOT.Char.GetLadyLord], e nossos celeiros estão praticamente vazios\", lamenta [local_peasant_leader.GetSheHe].\n\nVejo poucas alternativas: essas almas descontentes devem ser subjugadas pelo medo ou redimidas pela minha misericórdia."
 pam_theocratic_ruler_events.0006.t:0 "Dízimos ou Misericórdia"
 pam_theocratic_ruler_events.0007.a:0 "A paz é doce, mas [ROOT.Char.GetFaith.HighGodName] ainda tem obras maiores para mim."
 pam_theocratic_ruler_events.0007.b:0 "Espalhe o evangelho de uma vida pia e bem ordenada."
 pam_theocratic_ruler_events.0007.c:0 "Deixe-me apenas ouvir e ficar em silêncio."
 pam_theocratic_ruler_events.0007.desc:0 "Enquanto os raios suaves do sol dissipam o orvalho matinal e aquecem as pedras do pátio da igreja, percebo: por uma vez, o dever não me puxa a manga. Até mesmo uma abelha industriosa parece fazer pausas para aquecer as costas nos raios do alvorecer.\n\nMinhas terras estão em tranquila ordem. Há ouro nos cofres, e meu rebanho está contente e respeitoso. Até mesmo meu suserano, [ROOT.Char.GetLiege.GetTitledFirstName], fala com aprovação sobre como conduzo [ROOT.Char.GetLiege.GetHerHis] súditos em direção a Cristo."
 pam_theocratic_ruler_events.0007.t:0 "Harmonia Bem-Aventurada"
 pam_theocratic_ruler_events.0008.a:0 "Posso usar a pedra excedente destas muralhas primitivas."
 pam_theocratic_ruler_events.0008.b:0 "Derrube as muralhas e erga o meu [GetDomicileBuilding('episcopal_palace_01').GetNameNoTooltip]."
 pam_theocratic_ruler_events.0008.c.flavor:0 "Você tem o princípio [GetTenetType('tenet_ora_et_labora').GetName( ROOT.Char.GetRite )]"
 pam_theocratic_ruler_events.0008.c:0 "Toda obra das mãos humanas é oração tornada visível."
 pam_theocratic_ruler_events.0008.d:0 "Eles podem precisar das muralhas."
 pam_theocratic_ruler_events.0008.desc:0 "Desde que herdei [stone_province.GetName], um castelo com [GetBuilding('curtain_walls_01').GetName], tenho observado sua alvenaria impressionante, construída para se adequar a um governo mais mundano. Os fiéis realmente precisam de tais defesas?\n\nMinha propriedade não tem nenhum [GetDomicileBuilding('episcopal_palace_01').GetName] digno do meu nome, e a pedra trabalhada está lá pronta para ser pega."
 pam_theocratic_ruler_events.0008.t:0 "Pedra sobre Pedra"
 pam_theocratic_ruler_events.0009.a.failure:0 "Suas palavras falham em acalmar [heir.GetHerHim]"
 pam_theocratic_ruler_events.0009.a.success:0 "Seu conselho alcança [heir.GetHerHim]"
 pam_theocratic_ruler_events.0009.a.toast.failure:0 "Conselho falho"
 pam_theocratic_ruler_events.0009.a.toast.success:0 "Conselho bem-sucedido"
 pam_theocratic_ruler_events.0009.a:0 "\"Um pastor é calmo. Brande sua paixão.\""
 pam_theocratic_ruler_events.0009.b.flavor:0 " [heir.GetSheHe|U] não tem minha bênção e é inadequado para governar "
 pam_theocratic_ruler_events.0009.b:0 "Balanço a cabeça gentilmente em desapontamento."
 pam_theocratic_ruler_events.0009.c:0 "\"Diga suas preces. Discipline sua carne.\""
 pam_theocratic_ruler_events.0009.desc:0 "Recebi relatos cheios de lágrimas da minha congregação, transmitindo que [heir.GetTitledFirstName] perdeu [heir.GetHerHis] temperamento durante [heir.GetHerHis] último sermão, e que eles são incapazes de se manterem dentro das regras estritas que [heir.GetSheHe] exige deles.\n\nAo questionar [heir.GetHerHim], [heir.GetSheHe] entra em fúria.\n\n\"Oh, esses vis pecadores! Não consigo suportar suas tentativas patéticas de redenção.\""
 pam_theocratic_ruler_events.0009.t:0 "Tente Ser o Pastor"
 pam_theocratic_ruler_events.0010.a:0 "Honre a espada."
 pam_theocratic_ruler_events.0010.b:0 "O báculo deve liderar."
 pam_theocratic_ruler_events.0010.c:0 "Deixe que espada e báculo sirvam juntos."
 pam_theocratic_ruler_events.0010.desc:0 "Como governante das minhas terras, fui forçado a servir a [ROOT.Char.GetFaith.HighGodName] tanto com a lâmina quanto com bênçãos.\n\nCom clareza vívida, lembro-me de quando [pilgrimage_memory.GetDescription], e de quando [battle_memory.GetDescription]. Cadáveres empilhados no campo; meus seguidores sabem que não fujo da tarefa em questão.\n\nOlhando para o futuro do reino, meu [ROOT.Char.GetCouncillor('councillor_marshal').GetCouncilTitle], [ROOT.Char.GetCouncillor('councillor_marshal').GetTitledFirstName], e meu [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetCouncilTitle], [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetTitledFirstName], ambos querem que eu coloque sua ferramenta na vanguarda de nosso esforço."
 pam_theocratic_ruler_events.0010.t:0 "A Espada ou o Báculo"
 pam_theocratic_ruler_events.0011.a.flavor:0 "O cavaleiro descansará dentro da igreja."
 pam_theocratic_ruler_events.0011.a:0 "Pague pela pedra, e ele descansará aqui."
 pam_theocratic_ruler_events.0011.b.flavor:0 "O cavaleiro descansará sem sua espada."
 pam_theocratic_ruler_events.0011.b:0 "Podemos usar a cripta, se você doar a lâmina."
 pam_theocratic_ruler_events.0011.c.flavor:0 "O cavaleiro está enterrado fora das muralhas da igreja."
 pam_theocratic_ruler_events.0011.c:0 "Homens de luta pertencem sob o céu aberto."
 pam_theocratic_ruler_events.0011.desc:0 "[landed_subject.GetTitledFirstName] ajoelha-se diante de mim com notícias de [landed_subject.GetHerHis] parente que caiu defendendo [ROOT.Char.GetFaith.HighGodName]. \n\n\"Ele resistiu a muitos pagãos, mas seus ferimentos eram profundos demais. Pelo menos pudemos dizer nossas despedidas finais.\" \n\n\"Por favor, conceda-lhe um lugar de descanso sob o corredor do altar, com sua espada ao lado. Serei eternamente grato.\""
 pam_theocratic_ruler_events.0011.t:0 "Descanso para o Cavaleiro Caído"
 pam_theocratic_ruler_events.0012.a:0 "Deixe a natureza guiar minha fé."
 pam_theocratic_ruler_events.0012.b.failure:0 "[grove_subject.GetShortUINameNoTooltip] vê através do seu ardil"
 pam_theocratic_ruler_events.0012.b.success:0 "Seus homens retornam mais tarde para coletar a madeira"
 pam_theocratic_ruler_events.0012.b.toast.failure:0 "[grove_subject.GetShortUINameNoTooltip] espalha a palavra sobre sua profanação."
 pam_theocratic_ruler_events.0012.b.toast.success:0 "As árvores antigas são levadas embora por moedas."
 pam_theocratic_ruler_events.0012.b:0 "Mostre-me estes bosques."
 pam_theocratic_ruler_events.0012.c:0 "Esta natureza selvagem fede a Diabo."
 pam_theocratic_ruler_events.0012.desc:0 "Minha comitiva desacelera onde a floresta fecha o caminho. [grove_subject.GetTitledFirstName], um dos fiéis de [grove_county.GetNameNoTier], sai das árvores com as palmas abertas em saudação.\n\n\"Deseja conquistar um grande rebanho nestas terras? Ouça e abrace alegremente o que o próprio [ROOT.Char.GetFaith.HighGodName] plantou neste solo há muito tempo. Honre os bosques antigos de [grove_province.GetName] com um templo sagrado, e o povo saberá de quem você é o pastor.\""
 pam_theocratic_ruler_events.0012.t:0 "Um Bosque Outrora Sagrado"
 pam_theocratic_ruler_events.0013.a.failure:0 "[angelic_singer.GetShortUINameNoTooltip] não será persuadido"
 pam_theocratic_ruler_events.0013.a.success:0 "Suas palavras comovem [angelic_singer.GetHerHim] à devoção"
 pam_theocratic_ruler_events.0013.a.toast.failure:0 "[angelic_singer.GetShortUINameNoTooltip] recusa e vai embora."
 pam_theocratic_ruler_events.0013.a.toast.success:0 "[angelic_singer.GetShortUINameNoTooltip] faz os votos e se junta à sua corte."
 pam_theocratic_ruler_events.0013.a:0 "\"Sua dádiva pertence a [ROOT.Char.GetFaith.HighGodName]. Faça os votos e sirva.\""
 pam_theocratic_ruler_events.0013.b:0 "Fique como meu convidar. Gostaria de ouvir essa voz novamente."
 pam_theocratic_ruler_events.0013.c:0 "Deixe que nossos cantores façam o canto."
 pam_theocratic_ruler_events.0013.desc:0 "Na missa de hoje, como se tocada por inspiração divina, uma voz ergueu-se acima do cantor, clara e sobrenatural em sua beleza.\n\nOs fiéis calam-se quando [angelic_singer.GetTitledFirstName] canta, e muito depois de a nota final desvanecer-se, continuo a ouvir."
 pam_theocratic_ruler_events.0013.t:0 "Uma Inspiração Angélica"
 pam_theocratic_ruler_events.0014.a.acceptance:0 "Apelo do converso rejeitado"
 pam_theocratic_ruler_events.0014.a.flavor:0 "Você tem o traço [GetTrait('arrogant').GetName( GetNullCharacter )] [trait|E]"
 pam_theocratic_ruler_events.0014.a:0 "Remova esta imundície da minha vista."
 pam_theocratic_ruler_events.0014.b.tt:0 "Sua próxima contribuição de #V $great_project_type_pam_mass_rite_conversion_contribution_integrate_existing_rituals$#! em um [GetGreatProjectType('pam_mass_rite_conversion').GetName|V] [great_project|E] é gratuita."
 pam_theocratic_ruler_events.0014.b:0 "Abrace [offered_tenet_a.GetBaseNameNoTooltip] como minha própria."
 pam_theocratic_ruler_events.0014.c.tt:0 "Sua próxima contribuição de #V $great_project_type_pam_mass_rite_conversion_contribution_integrate_existing_rituals$#! em um [GetGreatProjectType('pam_mass_rite_conversion').GetName|V] [great_project|E] é gratuita."
 pam_theocratic_ruler_events.0014.c:0 "Abrace [offered_tenet_b.GetBaseNameNoTooltip] como minha própria."
 pam_theocratic_ruler_events.0014.d:0 "A ovelha guia o pastor?"
 pam_theocratic_ruler_events.0014.desc:0 "Durante o meu sermão, [convert_peasant.GetTitledFirstName], um converso [convert_peasant.GetCulture.GetNameNoTooltip] das antigas práticas de [neighbour_faith.GetNameNoTooltip], abre caminho pela multidão.\n\n\"Ainda há muito a aprender com as antigas vias. Sei que, se puder encontrar em seu coração considerá-las, nosso povo saberá que honra nossas tradições. Meu povo afluirá ao seu lado e apoiará cada esforço.\"\n\n[convert_peasant.GetSheHe|U] aguarda a minha bênção, e um aceno silencioso como resposta."
 pam_theocratic_ruler_events.0014.t:0 "A Súplica de um Converso"
 pam_theocratic_ruler_events.0015.a:0 "Tutelar [succession_heir_first.GetFirstNameNoTooltip] nas escrituras."
 pam_theocratic_ruler_events.0015.b:0 "Guiar [succession_heir_second.GetFirstNameNoTooltip] através dos textos sagrados."
 pam_theocratic_ruler_events.0015.c.failure:0 "Você tropeça em uma passagem que eles sabem de cor"
 pam_theocratic_ruler_events.0015.c.success:0 "Seu aprendizado supera a recitação deles"
 pam_theocratic_ruler_events.0015.c.toast.failure:0 "Seus subordinados trocam olhares diante do seu erro."
 pam_theocratic_ruler_events.0015.c.toast.success:0 "Eles estão comovidos pelo seu domínio da doutrina."
 pam_theocratic_ruler_events.0015.c:0 "Ainda sou o Pastor. Farei a recitação."
 pam_theocratic_ruler_events.0015.desc:0 "Depois de mim, a sede precisará de um pastor que saiba liderar tanto na oração quanto no julgamento. [succession_heir_first.GetTitledFirstName], primeiro na linha de sucessão, e [succession_heir_second.GetTitledFirstName], logo atrás, foram chamados para recitar as escrituras perante mim em privado. \n\nUm deles herdará o meu fardo e não posso moldar ambos igualmente hoje.\n\n\"Meus filhos na fé. Mostrem-me não apenas o que memorizaram, mas o que tornaram parte de si.\""
 pam_theocratic_ruler_events.0015.t:0 "Guiando os Sucessores"
 pam_theocratic_ruler_events_0014_mass_conversion_discount_desc:0 "A Súplica de um Converso"
