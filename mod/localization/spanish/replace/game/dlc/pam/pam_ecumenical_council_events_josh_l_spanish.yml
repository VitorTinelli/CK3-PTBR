l_spanish:
 COMPLINE_GLOSS:0 "Completas é a oração da noite. A última oração do dia na Liturgia das Horas, o ciclo diário de oração usado na tradição cristã."
 LAUD_GLOSS:0 "Laudes é a oração da alvorada da Liturgia das Horas, o ciclo diário de oração na tradição cristã."
 VESPER_GLOSS:0 "Vésperas é a oração da tarde. Geralmente a oração antes da ceia na Liturgia das Horas, o ciclo diário de oração usado na tradição cristã."
 alliance_target_at_council_reason:0 "[TARGET_CHARACTER.GetShortUIName|U] recusou uma aliança inadequada."
 ecumenical_council_events_josh.0001.a.flavor:0 "Alguém que reza tanto deve ser um pecador..."
 ecumenical_council_events_josh.0001.a.toast.failure:0 "Tentativa de assassinato falhou"
 ecumenical_council_events_josh.0001.a.toast.success:0 "Assassinato bem-sucedido"
 ecumenical_council_events_josh.0001.a.tt2:0 "[murder_target.GetSheHe|U] escapa do meu alcance"
 ecumenical_council_events_josh.0001.a.tt:0 "Um pouco apertado demais para o conforto"
 ecumenical_council_events_josh.0001.a:0 "Aperte os adornos de [murder_target.GetHerHis]."
 ecumenical_council_events_josh.0001.b:0 "Não, não durante um ato sagrado..."
 ecumenical_council_events_josh.0001.desc:0 "Os fiéis são tão previsíveis. Enquanto [murder_target.GetTitledFirstName] se inclina em oração em [Glossary( 'Compline', 'COMPLINE_GLOSS' )], eu espreito nas sombras. \n\n[murder_target.GetHerHis|U] longas orações deixam [murder_target.GetHerHim] exposto. Quando estamos sozinhos, até mesmo vestes finas — paramentos ou veludo — podem se tornar um laço."
 ecumenical_council_events_josh.0001.t:0 "Assassinato nas Completas"
 ecumenical_council_events_josh.0010.a:0 "Dedicar a missa."
 ecumenical_council_events_josh.0010.b:0 "Farei um sermão."
 ecumenical_council_events_josh.0010.c:0 "Apenas adicione um salmo ou hino extra."
 ecumenical_council_events_josh.0010.desc:0 "O clero se reuniu, e não há alegria maior do que celebrar uma de nossas estrelas-guia. Este mês, achamos mais apropriado homenagear [monthly_saint.GetTitledFirstName].\n\n\"Em nome de [ROOT.Char.GetFaith.HighGodNamePossessive], conduziremos a adoração deste dia.\""
 ecumenical_council_events_josh.0010.t:0 "Uma Celebração Santa"
 ecumenical_council_events_josh.0011.a.flavor:0 "[ROOT.Char.GetFaith.HighGodName] e todos os reunidos ficam admirados."
 ecumenical_council_events_josh.0011.a:0 "Deixe que a voz de [guest_giant.GetHerHis] leve nossas preces a [ROOT.Char.GetFaith.HighGodName]."
 ecumenical_council_events_josh.0011.b.flavor:0 "Com [guest_giant.GetTitledFirstName] gritando aprovações nos momentos certos, terei vantagem."
 ecumenical_council_events_josh.0011.b.toast.failure:0 "[guest_giant.GetSheHe|U] quer algo em troca para apoiá-lo."
 ecumenical_council_events_josh.0011.b.toast.success:0 "Você convence [guest_giant.GetHerHim] a apoiá-lo."
 ecumenical_council_events_josh.0011.b.tt2:0 "[guest_giant.GetSheHe|U] só pode ser confiável quando [guest_giant.GetSheHe] recebe sua parte"
 ecumenical_council_events_josh.0011.b.tt:0 "[guest_giant.GetSheHe|U] torna-se alguém em quem confiar"
 ecumenical_council_events_josh.0011.b:0 "Eu poderia usar o apoio ressonante dele no debate."
 ecumenical_council_events_josh.0011.c.flavor:0 "Que [guest_giant.GetHerHim] encontre [guest_giant.GetHerHis] próprio lugar entre nós."
 ecumenical_council_events_josh.0011.c.tt:0 "Você não força [guest_giant.GetTitledFirstName] ao coro ou debate"
 ecumenical_council_events_josh.0011.c:0 "[guest_giant.GetSheHe|U] é um convidar, não um instrumento."
 ecumenical_council_events_josh.0011.desc:0 "Quando cumprimento os convidados, não posso deixar de notar [guest_giant.GetTitledFirstName] destacando-se na multidão com sua postura de [guest_giant.GetHerHis] gigante. Mas é quando [guest_giant.GetSheHe] fala: \"Saudações, meus fellow guardiões da Fé\", que vejo seu verdadeiro potencial. \n\nCom uma voz estrondosa como um trovão, [guest_giant.GetSheHe] poderia ser muito útil. Os salmos nas [Glossary( 'Vesper', 'VESPER_GLOSS' )] poderiam precisar de outro baixo..."
 ecumenical_council_events_josh.0011.t:0 "Como um Trovão"
 ecumenical_council_events_josh.0012.b:0 "\"Dê-me o anel e fique em silêncio\"."
 ecumenical_council_events_josh.0012.bishopringdesc:0 "[newly_created_artifact.GetDesc]\n\nUm sinal visível do ministério apostólico de quem o usa."
 ecumenical_council_events_josh.0012.bishopringname:0 "Anel Episcopal"
 ecumenical_council_events_josh.0012.c:0 "\"Isto é entre mim, você e [ROOT.Char.GetFaith.HighGodName]\"."
 ecumenical_council_events_josh.0012.desc:0 "[guest_bishoplover.GetTitledFirstName] e [guest_bishop.GetTitledFirstName] têm sido inseparáveis desde que o concílio começou. Durante [Glossary( 'Laud', 'LAUD_GLOSS' )], [guest_bishoplover.GetFirstName] chega atrasado e desalinhado, e aquele é o anel de [guest_bishop.GetFirstNamePossessive] no dedo de [guest_bishoplover.GetHerHis]? Aceno para [guest_bishoplover.GetHerHim] e levanto uma sobrancelha.\n\n[guest_bishoplover.GetFirstName] percebe [guest_bishoplover.GetHerHis] erro, cora e gagueja:\n\n\"Por favor, isto deve ficar entre nós...\""
 ecumenical_council_events_josh.0012.t:0 "Um Anel Episcopal"
 ecumenical_council_events_josh.0013.a:0 "\"Remova esta desonra da minha vista.\""
 ecumenical_council_events_josh.0013.b.toast.failure:0 "[fashion_criminal.GetSheHe|U] consegue permanecer no concílio."
 ecumenical_council_events_josh.0013.b.toast.success:0 "Você consegue que [fashion_criminal.GetHerHim] seja expulso."
 ecumenical_council_events_josh.0013.b:0 "\"Vá embora, você provou não ser digno!\""
 ecumenical_council_events_josh.0013.desc:0 "[fashion_criminal.GetTitledFirstName|U] está vestido com esplendor. Usando uma vestimenta recém-tecida feita para a ocasião, sem dúvida um presente de [fashion_criminal.GetHerHis] rebanho adorador. Um bordado de [ROOT.Char.GetFaith.WealthGodName] observa da estola feita de seda. \n\nQue audácia! [fashion_criminal.GetSheHe] está violando abertamente os princípios de [fashion_criminal.GetFaith.GetName], ou [fashion_criminal.GetSheHe] é apenas um pavão vaidoso?"
 ecumenical_council_events_josh.0013.t:0 "Um Crime da Moda"
 ecumenical_council_events_josh.0020.a.flavor:0 "Minhas ações comoveram o clero presente."
 ecumenical_council_events_josh.0020.a:0 "\"Em nome de [ROOT.Char.GetFaith.HighGodNamePossessive] nós prevaleceremos!\""
 ecumenical_council_events_josh.0020.b:0 "Vou apenas me banhar na glória."
 ecumenical_council_events_josh.0020.desc.fallback:0 " está reconhecendo minhas contribuições recentes à fé. Ser chamado na companhia do clero reunido faz meu peito explodir de orgulho.\""
 ecumenical_council_events_josh.0020.desc.intro:0 "\"Olhai para este pilar de [ROOT.Char.GetFaith.GetName]! Um verdadeiro testamento de como os justos seguem a cruz.\" \n\n[host.GetTitledFirstName]"
 ecumenical_council_events_josh.0020.desc_battle_memory:0 " está se referindo a quando [faith_battle_memory.GetDescription]. Os pagãos devem ser combatidos a cada passo. Ergo minha espada e aceito seus elogios. \"Pelos fiéis!\""
 ecumenical_council_events_josh.0020.t:0 "O Farol de Fervor"
 ecumenical_council_events_josh.0021.a.ct:0 "[council_opponent.GetShortUINameNoTooltip|U] abandona os [ec_conservatives|E] e se junta aos [ec_innovators|E]"
 ecumenical_council_events_josh.0021.a:0 "Pressionar minha vantagem contra [council_opponent.GetFirstName]."
 ecumenical_council_events_josh.0021.b.ct:0 "Até #V 3#! [ec_conservatives|E] se juntam aos [ec_innovators|E]"
 ecumenical_council_events_josh.0021.b:0 "Deixar a luz vencer perante a assembleia."
 ecumenical_council_events_josh.0021.c.ct:0 "Adicionar #V 50#! [appointment|E] de investimento para um [clerical_title|E]"
 ecumenical_council_events_josh.0021.c:0 "Deixar que vejam meu esplendor."
 ecumenical_council_events_josh.0021.desc:0 "Um feixe de luz se espalha pelo chão enquanto o debate se arrasta. Eu entro nele, e de repente todos os olhares se voltam para mim. \n\nComo se minhas palavras não bastassem, a luz divina fortalece minha causa. Meu oponente no debate [council_opponent.GetFirstName] fica nas sombras. Os argumentos de [council_opponent.GetHerHis|U] parecem ainda mais obscuros."
 ecumenical_council_events_josh.0021.t:0 "Na Luz"
 ecumenical_council_events_josh.0022.a.flavor:0 "Usarei minha posição piedosa para selar a aliança."
 ecumenical_council_events_josh.0022.a:0 "Que a Igreja abençoe nossa aliança."
 ecumenical_council_events_josh.0022.b.flavor:0 "Meu jeito charmoso com as pessoas certamente será o suficiente."
 ecumenical_council_events_josh.0022.b.toast.failure:0 "[alliance_target.GetSheHe|U] se sente ofendido por seus avanços."
 ecumenical_council_events_josh.0022.b.toast.success:0 "[alliance_target.GetHerHim|U] concorda com a aliança."
 ecumenical_council_events_josh.0022.b:0 "A aliança será construída sobre mútua compreensão."
 ecumenical_council_events_josh.0022.c.flavor:0 "Uma vénia em respeito é o bastante."
 ecumenical_council_events_josh.0022.c:0 "Um concílio não é o lugar."
 ecumenical_council_events_josh.0022.desc:0 "Ao fazer suas rondas no concílio, [host.GetTitledFirstName|U] vê a oportunidade de alinhar [host.GetHerHis] seguidores contra ameaças externas. [host.GetSheHe|U] chama a mim e a [alliance_target.GetTitledFirstName] para ficarmos diante de [host.GetHerHim].\n\n\"Meus devotos, assim como estais firmes na fé, deveis também estar lado a lado ao enfrentar a adversidade.\""
 ecumenical_council_events_josh.0022.t:0 "Unidos na Fé"
 ecumenical_council_events_josh.0023.a:0 "\"Uma doação generosa, para me manter em suas preces.\""
 ecumenical_council_events_josh.0023.b.toast.failure:0 "[host.GetTitledFirstName|U] afasta seu pedido."
 ecumenical_council_events_josh.0023.b.toast.success:0 "[host.GetTitledFirstName|U] rezará por você."
 ecumenical_council_events_josh.0023.b.tt2:0 "Quebro a etiqueta e sou empurrado para o lado"
 ecumenical_council_events_josh.0023.b.tt:0 "Asseguro-me de que meu pedido seja ouvido"
 ecumenical_council_events_josh.0023.b:0 "Beijar a bainha da vestimenta do anfitrião"
 ecumenical_council_events_josh.0023.c:0 "É melhor afastar-se e ser piedoso."
 ecumenical_council_events_josh.0023.desc:0 "\"Graça e paz estejam convosco.\" [host.GetTitledFirstName|U] está abençoando os convidados conforme se aproximam. Posso aproveitar este momento para me lançar diante deste pilar da fé. Se eu puder fazer [host.GetHerHim] me colocar em [host.GetHerHis] [Glossary( 'Laud', 'LAUD_GLOSS' )] preces, certamente me aproximarei da salvação. \n\n \"Afastai-vos e parai de balbuciar. Estais a reter a fila.\" [prayer_opponent.GetFirstName|U], o próximo na fila, sussurra atrás de mim."
 ecumenical_council_events_josh.0023.t:0 "Rezai por Mim"
 ecumenical_council_events_josh.0024.a:0 "\"Sabedoria, dizes, [tenet_target_a.GetFirstNameNoTooltip]?\""
 ecumenical_council_events_josh.0024.b:0 "Aquele livro parece bastante interessante."
 ecumenical_council_events_josh.0024.c:0 "[ROOT.Char.GetFaith.HighGodName] já me mostrou o verdadeiro caminho."
 ecumenical_council_events_josh.0024.desc:0 "Alguns vieram aqui sedentos por falar de mistérios sagrados, ávidos por fazer interpretações novatos e discutir. [tenet_target_a.GetName] é um desses participantes.\n\n\"[tenet_target_a_shareable_tenet.GetName( tenet_target_a.GetRite )]! [tenet_target_a_shareable_tenet.GetName( tenet_target_a.GetRite )], meus irmãos. Honrai estas estritas regras que [ROOT.Char.GetFaith.HighGodName] estabeleceu perante nós, buscai a sabedoria neste caminho, e vireis a compreender o divino!\"\n\nVozes elevam-se e caem em meio à multidão. O [tenet_target_b.Custom('FormalComplimentAdjective')] [tenet_target_b.GetTitledFirstName], enquanto isso, está enfeitiçado por um texto desconhecido. As únicas palavras dele que consigo distinguir são: \"[tenet_target_b_shareable_tenet.GetName( tenet_target_b.GetRite )].\""
 ecumenical_council_events_josh.0024.t:0 "A Beleza dos Mistérios"
 ecumenical_council_events_josh.0025.a.flavor:0 "Posso facilmente adicionar [theologian.GetHerHim] ao final do meu convite."
 ecumenical_council_events_josh.0025.a:0 "A entrada terá um custo..."
 ecumenical_council_events_josh.0025.b:0 "\"Seus ensinamentos são uma desonra!\""
 ecumenical_council_events_josh.0025.c:0 "\"Fascinante. Façamos nosso próprio concílio mais tarde.\""
 ecumenical_council_events_josh.0025.d:0 "Conduzir educadamente [theologian.GetHerHim] para longe."
 ecumenical_council_events_josh.0025.desc:0 "Um tumulto agita-se na borda da grande assembleia. Alguns novos e incomuns recém-chegados sacodem a poeira da estrada; nossos prelados sussurram, encaram e fazem gestos para afastar os recém-chegados. O [theologian.GetWomanMan] que lidera os estrangeiros clama:\n\n\"Viajei longas distâncias para dar testemunho por meus irmãos [theologian.GetFaith.GetAdherentNamePlural]. Nossos pais de outrora, os santos apóstolos, eram como irmãos. Por que, então, não posso ser admitido entre vós?\""
 ecumenical_council_events_josh.0025.t:0 "Um Teólogo a Mais"
 fashion_criminal_at_council_reason:0 "[TARGET_CHARACTER.GetShortUIName|U] vestiu algo inadequato em um Concílio Ecumênico."
 friend_giant_support_at_council_reason:0 "[TARGET_CHARACTER.GetShortUIName|U] decidiu apoiar [CHARACTER.GetShortUIName] em um Concílio Ecumênico."
