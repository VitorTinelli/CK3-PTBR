l_spanish:
 PAM_NECROLOGY_GLOSS:0 "O registro em que uma casa monástica registrava os nomes de seus mortos — irmãos, patronos e benfeitores. Todos os dias, os nomes devidos eram lidos em voz alta no capítulo, e a comunidade orava por aquelas almas; um nome inserido era lembrado enquanto a casa de pé estivesse."
 activity_funeral_monastic:0 "#P +++ Mosteiro#!\n"
 pam_monastic_chronicle_modifier:0 "Local de Descanso de um Nobre"
 pam_monastic_chronicle_modifier_desc:0 "O local de descanso de um nobre está atraindo peregrinos piedosos para rezar por ele."
 pam_monastic_commemoration_modifier:0 "Comemoração Perpétua"
 pam_monastic_commemoration_modifier_desc:0 "A casa deste personagem está registrada no necrológio de uma ordem monástica, e seus mortos são lembrados nas orações diárias da ordem."
 pam_monastic_funeral.0001.a:0 "Reze por minha casa, agora e sempre."
 pam_monastic_funeral.0001.b:0 "Convidar peregrinos para rezar pela alma de [deceased.GetFirstNamePossessiveNoTooltip]."
 pam_monastic_funeral.0001.c:0 "Os mortos estão em boas mãos. Isso me basta."
 pam_monastic_funeral.0001.desc.brothers:0 "Os irmãos retiram-se dois a dois, com capuzes abaixados, deixando-nos a todos em silêncio reverente."
 pam_monastic_funeral.0001.desc.intro:0 "O canto final desvanece-se sob as abóbadas. Os ritos por [deceased.GetTitledFirstName] terminaram, e a calmaria retorna à casa de [abbot.GetPrimaryTitle.GetNameNoTier|l].\n\n"
 pam_monastic_funeral.0001.desc.outro:0 "\n\n[abbot.GetTitledFirstName] permanece ao meu lado. \"Os mortos estão em boas mãos aqui, [ROOT.Char.Custom('FormOfAddressForLiege')]\", diz [abbot.GetSheHe]. \"E nossas preces não precisam terminar à beira do túmulo. O nome de [deceased.GetHerHis|U] permanecerá em [Glossary( 'our necrology', 'PAM_NECROLOGY_GLOSS' )] enquanto houver uma voz para lê-lo.\""
 pam_monastic_funeral.0001.desc.sisters:0 "As irmãs retiram-se duas a duas, com véus abaixados, deixando-nos a todos em silêncio reverente."
 pam_monastic_funeral.0001.t:0 "Orações Sem Fim"
