l_spanish:
 AD_SUCCURRENDUM_GLOSS:0 "Morrer #G ad succurrendum#! — adotando os votos e o Hábito monásticos no leito de morte — era o último recurso de grandes senhores por toda a cristandade medieval. Sepultado em um capuz simples em vez de sedas, o governante moribundo esperava enfrentar o julgamento como um irmão humilde e não como um príncipe."
 BEDE_SPARROW_GLOSS:0 "Segundo Beda, um conselheiro do Rei Edwin comparou a vida a um pardal cruzando um banquete aquecido em uma noite de inverno: uma breve passagem de luz e conforto de tempestade em tempestade, com começo e fim desconhecidos. Se a nova fé pudesse dizer o que havia além do banquete, ela merecia ser ouvida — e Edwin foi persuadido."
 BELL_BAPTISM_GLOSS:0 "Os sinos das igrejas eram consagrados quase da mesma forma que os cristãos: lavados com água benta, ungidos com óleo, recebendo o nome de um santo — alguns até tinham padrinhos. O #G Admonitio Generalis#! de Carlos Magno proibiu o batismo de sinos em 789, mas o costume continuou por séculos, independentemente disso. Acreditava-se que um sino batizado afastava tempestades, granizo e demônios onde quer que sua voz alcançasse; fundidores posteriores gravavam em seus sinos o lema #G Fulgura frango#! — 'eu quebro os relâmpagos.'"
 CHURCH_ALE_GLOSS:0 "Uma festa paroquial onde a cerveja feita de malte doado era vendida no adro da igreja, com a renda revertida para a manutenção do templo — um telhado com goteiras, um novo sino, pão para os pobres. Sínodo após sínodo condenou a bebedeira em solo sagrado, e paróquia após paróquia continuou a fabricar cerveja; para muitas igrejas de aldeia, a cerveja pagava mais do que o dízimo jamais pagou."
 ISSEDONES_GLOSS:0 "Um povo das estepes do extremo norte descrito por Heródoto. Quando um pai morria, sua família misturava sua carne com a de gado abatido para um banquete fúnebre. Eles douravam o crânio dele, honrando-o com sacrifícios anuais. Heródoto registrou esses costumes não para condená-los, mas para mostrar que 'o costume é o senhor de tudo.'"
 LORDS_DAY_GLOSS:0 "O primeiro dia da semana, guardado como sagrado em memória da Ressurreição. Os concílios da igreja proibiam o trabalho servil, mercados e diversões ociosas nele, e reis cristãos colocaram a proibição em lei — embora muitos senhores considerassem o veado, assim como o sermão, um assunto entre si mesmos e Deus."
 MANDATUM_GLOSS:0 "O rito do lava-pés, a partir das palavras de Cristo na Última Ceia: #G 'Mandatum novum do vobis'#! — 'um novo mandamento vos dou.' Assim, na Quinta-Feira Santa, os governantes ajoelhavam-se com bacia e toalha para lavar os pés de alguns indigentes e pressionar prata em suas palmas."
 OSTENSION_GLOSS:0 "A solene exibição das relíquias de um santo. Em grandes dias de festa, as relíquias eram retiradas de seus cofres e levadas em procissão por ruas e campos, para que uma bênção ligada ao seu altar pudesse tocar cada alma no trajeto. Uma relíquia em peregrinação atraía multidões, moedas e renome."
 PYX_GLOSS:0 "Uma pequena caixa com tampa, geralmente de prata ou dourada, na qual o pão consagrado da missa é guardado. O direito canônico exigia que fosse mantida limpa, trancada e a salvo de mãos profanas — ou visitantes mais famintos."
 QUID_MUS_SUMIT_GLOSS:0 "#G Quid mus sumit?#! — 'o que come o rato?' Os escolásticos debateram isso a sério: se um rato roesse a Hóstia consagrada, ele teria comido o corpo de Deus? O direito canônico impunha penitências a sacerdotes descuidados, e os grandes doutores decidiram que o rato recebia apenas a aparência do pão, retirando-se o sacramento de dentes indignos."
 RESERVED_HOST_GLOSS:0 "Pão consagrado na Missa e reservado na igreja para que os enfermos e os moribundos pudessem recebê-lo a qualquer hora. Uma vez consagrado, acreditava-se que o pão era o verdadeiro corpo de Deus, sendo sua guarda um assunto da maior importância."
 gains_religious_inspiration_tt:0 "[prophet.GetShortUIName|U] obtém uma [inspiration|E] Religiosa"
 no_miracles_tt:0 "Este milagre está mal contado..."
 pam_my_liege_captain:0 "capitão"
 pam_my_liege_chieftain:0 "meu chefe"
 pam_my_liege_khan:0 "grande cã"
 pam_my_liege_khatun:0 "grande catum"
 pam_my_liege_lady:0 "minha senhora"
 pam_my_liege_liege:0 "meu suserano"
 pam_my_liege_lord:0 "meu senhor"
 pam_my_liege_reverend_father:0 "reverendo padre"
 pam_my_liege_reverend_mother:0 "reverenda madre"
 pam_my_liege_serene_lady:0 "sereníssima senhora"
 pam_my_liege_serene_lord:0 "sereníssimo senhor"
 pam_omen_blood_moon:0 "lua avermelhada"
 pam_omen_comet:0 "cometa de cauda dupla"
 pam_omen_eclipse:0 "lua eclipsada em um crescente de cobre"
 pam_omen_falling_stars:0 "chuva de estrelas cadentes"
 pam_omen_moon_halo:0 "halo de luz pálida ao redor da lua"
 pam_omen_star_host:0 "hoste de estrelas onde nenhuma deveria estar"
 pam_omen_wandering_star:0 "estrela errante brilhante"
 pam_secular_faith_events.0001.a:0 "Vou me perder em orações."
 pam_secular_faith_events.0001.b:0 "Este rito deve ser dedicado a [ROOT.Char.GetFaith.WealthGodName]."
 pam_secular_faith_events.0001.c:0 "A corte deve participar dessa devoção."
 pam_secular_faith_events.0001.desc:0 "Meu [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], conduz o incensário pela nave. A fumaça sagrada sobe até as vigas, carregando consigo as orações murmuradas da congregação.\n\nPor um momento, toda a criação parece se estender em direção a [ROOT.Char.GetFaith.PositiveAfterLife], e eu com ela."
 pam_secular_faith_events.0001.t:0 "Fumaça Sagrada"
 pam_secular_faith_events.0002.a:0 "Uma vida vale mais que tudo. Vamos cavalgar."
 pam_secular_faith_events.0002.b:0 "Devo consultar meu [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstNameNoTooltip]."
 pam_secular_faith_events.0002.c:0 "Não quebrarei o Sábado."
 pam_secular_faith_events.0002.desc:0 "[traveler_in_danger.GetTitledFirstName], um viajante cruzando minhas terras, foi atacado por bandidos em [background_terrain_scope.GetName]!\n\nA vida de [traveler_in_danger.GetHerHis|U] está em risco, mas pegar em armas no dia santo de [ROOT.Char.GetFaith.HighGodNamePossessive] é proibido. O Sábado não é meu para quebrar. Se eu esperar o anoitecer, poderei cavalgar apenas para enterrar [traveler_in_danger.GetHerHim].\n\nAinda assim, posso ficar de braços cruzados enquanto uma vida está por um fio?"
 pam_secular_faith_events.0002.t:0 "Pikuach Nefesh"
 pam_secular_faith_events.0003.a:0 "A voz sussurrou verdades bem-aventuradas..."
 pam_secular_faith_events.0003.b:0 "Humor febril... devo ler sobre tais casos."
 pam_secular_faith_events.0003.c:0 "O [ROOT.Char.Custom('GetCourt')] deve ouvir o que eu vi!"
 pam_secular_faith_events.0003.desc:0 "Acordo tomado por algo mais do que um sonho — uma coluna de fogo, uma voz que sabia meu nome, um rosto que não consigo esquecer...\n\nFoi [ROOT.Char.GetFaith.HighGodName] quem veio até mim? [ROOT.Char.GetFaith.HealthGodName]? Ou [ROOT.Char.GetFaith.DevilName] disfarçado...\n\nTalvez tenha sido apenas um humor febril do sangue."
 pam_secular_faith_events.0003.t:0 "Uma Visão na Noite"
 pam_secular_faith_events.0004.a:0 "Manterei esta verdade — mas em silêncio."
 pam_secular_faith_events.0004.b:0 "Não. Não me desviarei."
 pam_secular_faith_events.0004.desc:0 "Sem sono e em dúvida, ando de um lado para o outro no [ROOT.Char.Custom('ResidenceBuildingHallsType')] do meu [ROOT.Char.Custom('ResidenceBuilding')].\n\nMinha mente ronda algo que minha fé condena: [pam_sf_forbidden_tenet.GetBaseName]. Deveria me perturbar — mas sinto uma verdade justa nessa crença, e não consigo banir esta suspeita."
 pam_secular_faith_events.0004.t:0 "Verdade Proibida"
 pam_secular_faith_events.0005.a:0 "Devo passar meus pensamentos para o papel."
 pam_secular_faith_events.0005.b:0 "Não há mal em compreender."
 pam_secular_faith_events.0005.c:0 "A oração purificará estes pensamentos."
 pam_secular_faith_events.0005.desc_doctrine:0 "Diz respeito à doutrina de [pam_sf_revelation_doctrine.GetDescriptiveName( ROOT.Char.GetFaith.Self )], um ensinamento que minha fé condenaria prontamente. Digo a mim mesmo que é um engano."
 pam_secular_faith_events.0005.desc_end:0 "E, no entanto, à luz de velas, percebo como outra alma poderia se apegar a isso."
 pam_secular_faith_events.0005.desc_intro:0 "O estudo noturno deveria ter acalmado minha mente, mas certa passagem não sai dos meus pensamentos.\n\n"
 pam_secular_faith_events.0005.desc_tenet:0 "Diz respeito ao princípio que conhecem como [pam_sf_revelation_tenet.GetBaseName], uma prática que minha fé condenaria prontamente. Digo a mim mesmo que é bárbara."
 pam_secular_faith_events.0005.t:0 "À Luz de Velas"
 pam_secular_faith_events.0006.a:0 "Deixe-me avaliá-lo antes de me desfazer de moedas."
 pam_secular_faith_events.0006.b:0 "Eu o terei."
 pam_secular_faith_events.0006.c:0 "Não tenho uso para os ossos de um estranho. Vá embora."
 pam_secular_faith_events.0006.desc:0 "Um peregrino esfarrapado me chama atenção no mercado. Nas mãos trêmulas de [relic_seller.GetHerHis] repousa um osso de dedo amarelado.\n\n\"O osso de um santo\", jura [relic_seller.GetWomanMan]. \"O encontrei em minha jornada para [GetTitleByKey('c_jerusalem').GetNameNoTier], mas estaria mais seguro nas mãos de [ROOT.Char.GetTitleAsNameNoTooltip].\"\n\nUm olho culto poderia julgar a afirmação. Convenientemente, a relíquia está à venda."
 pam_secular_faith_events.0006.t:0 "Ossos de um Santo"
 pam_secular_faith_events.0007.a:0 "Vamos proceder com a dignidade que seu cargo merece."
 pam_secular_faith_events.0007.b:0 "Por favor. Apenas realize o rito."
 pam_secular_faith_events.0007.c:0 "[ROOT.Char.GetFaith.HighGodName] pode ser seu senhor, mas eu sou seu suserano. Fora!"
 pam_secular_faith_events.0007.desc:0 "Um dos meus próprios [defiant_bishop.GetTitleAsNameNoTooltip]s, [defiant_bishop.GetFirstName], é orgulhoso, bem-conectado e tem certeza silenciosa de que [defiant_bishop.GetSheHe] é superior a mim. Vários servos adoeceram recentemente, e preciso que [defiant_bishop.GetHerHim] abençoe minha casa.\n\nApós ignorar meus chamados por dias, [defiant_bishop.GetSheHe] finalmente chega. \"Gostaria de pedir perdão pelo atraso\", sorri [defiant_bishop.GetSheHe] com empáfia, \"mas eu respondo a um senhor maior do que qualquer [ROOT.Char.GetTitleAsNameNoTooltip].\""
 pam_secular_faith_events.0007.t:0 "Bispo Arrogante"
 pam_secular_faith_events.0008.a:0 "Farei o que [confessor.GetFirstNameNoTooltip] aconselha."
 pam_secular_faith_events.0008.b:0 "Agora não. Não estou pronto."
 pam_secular_faith_events.0008.desc:0 "As velas queimam baixo, e o mesmo pensamento retorna. Sou [penance_sin.GetName( ROOT.Char )], e minha fé conta isso entre seus pecados.\n\nNão importa quantas vezes eu afaste esse pensamento, a culpa permanece.\n\n\"Disciplinai-vos, e vossa alma será aliviada de seus fardos.\" Meu [ROOT.Char.Custom2( 'RelationToMeShort', confessor )], [confessor.GetFirstName], não repreende nem condena. \"Segui esta penitência. Não vos desvieis.\""
 pam_secular_faith_events.0008.t:0 "O Peso do Pecado"
 pam_secular_faith_events.0009.a:0 "Entre, meu [ROOT.Char.Custom('ResidenceBuilding')] está aberto para você."
 pam_secular_faith_events.0009.b:0 "Pegue este pão e vá em paz."
 pam_secular_faith_events.0009.desc:0 "Um estranho solitário e marcado pede esmola em meus portões.\n\n\"Perdoai a intrusão, [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitleAsNameNoTooltip]\", diz [stranger.GetSheHe] com uma reverência graciosa. \"Se vossas circunstâncias permitirem esmolas, imploro apenas por uma pequena parcela de vossa fortuna.\"\n\n[stranger.GetSheHe|U] fala de maneira incomum para um mendigo. Nunca se sabe quem estamos mandando embora."
 pam_secular_faith_events.0009.t:0 "Um Estranho Crístico"
 pam_secular_faith_events.0010.a:0 "Você foi enviado para cá por uma razão."
 pam_secular_faith_events.0010.b:0 "Convidei uma víbora para a minha mesa."
 pam_secular_faith_events.0010.desc_blessed:0 "O [stranger.GetWomanMan] que deixei entrar por meus portões não é um mero vagabundo — [stranger.GetFirstName] fala sobre as escrituras e a arte de governar com tanta facilidade que até meus homens letrados calam-se para ouvir.\n\nParece que [ROOT.Char.GetFaith.HighGodName] veio aos meus portões afinal. Não deixarei [stranger.GetHerHim] partir."
 pam_secular_faith_events.0010.desc_thief:0 "Acordo com cinzas na lareira e um cofre vazio.\n\nPão e abrigo, retribuídos com a mais antiga das traições.\n\n[stranger.GetFirstName] escapou na noite, e minha riqueza com [stranger.GetHerHim].\n\nQuando os servos começam a se mexer, [stranger.GetSheHe] já está bem longe dos meus muros e perdido para mim."
 pam_secular_faith_events.0010.t:0 "Quem Veio do Frio"
 pam_secular_faith_events.0011.a:0 "Há uma verdade mais profunda nisso?"
 pam_secular_faith_events.0011.b:0 "Dê-me um chicote — pois eu também pequei."
 pam_secular_faith_events.0011.c:0 "Expulsem esta loucura de minhas terras!"
 pam_secular_faith_events.0011.desc:0 "Acordo não com trovões, mas com o estalar de flagelos.\n\nUm bando de penitentes se reuniu fora do meu [ROOT.Char.Custom('ResidenceBuilding')], com as costas cruas e ensanguentadas enquanto proclamam que [ROOT.Char.GetFaith.HighGodName] exige [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetNullCharacter.GetRite )].\n\nMinha casa olha para mim em busca de orientação."
 pam_secular_faith_events.0011.t:0 "Os Penitentes"
 pam_secular_faith_events.0012.a:0 "Abençoe meus estandartes e lâminas para o dia da necessidade."
 pam_secular_faith_events.0012.b:0 "Oremos pela paz em vez disso."
 pam_secular_faith_events.0012.c:0 "Uma bênção silenciosa bastará."
 pam_secular_faith_events.0012.desc:0 "A paz é um empréstimo, nunca um presente.\n\nNa festa de [ROOT.Char.GetFaith.WarGodName], meu [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], oferece-se para consagrar as armas da minha casa.\n\n\"Deus, que deu a Davi força contra Golias, coloque essa mesma força na casa [ROOT.Char.GetHouse.GetBaseName] — que possüais sempre erguer-vos em defesa dos fracos\", reza [chaplain.GetSheHe]."
 pam_secular_faith_events.0012.t:0 "Bênção das Armas"
 pam_secular_faith_events.0013.a:0 "[ROOT.Char.GetFaith.HighGodName] fala através de bocas estranhas..."
 pam_secular_faith_events.0013.b:0 "Fora daqui, tolo delirante!"
 pam_secular_faith_events.0013.desc:0 "Um pregador de olhos selvagens é arrastado perante mim. Acusado de agitação e adivinhação, [prophet.GetSheHe] não perde tempo apontando um dedo trêmulo para meu [ROOT.Char.Custom2( 'RelationToMeShort', doomed_soul )], [doomed_soul.GetTitledFirstName].\n\n\"Marcai este!\" chora [prophet.GetSheHe]. \"Antes da próxima lua, [doomed_soul.GetSheHe] jazerá frio na terra. [ROOT.Char.GetFaith.HighGodName] me mostrou a própria hora!\"\n\n[prophet.GetHerHis|U] certeza é desconcertante. [doomed_soul.GetFirstNamePossessiveNoTooltip] medo, ainda mais."
 pam_secular_faith_events.0013.t:0 "Uma Morte Anunciada"
 pam_secular_faith_events.0014.a:0 "[prophet.GetSheHe|U] é um verdadeiro profeta!"
 pam_secular_faith_events.0014.b:0 "[ROOT.Char.GetFaith.HighGodName] opera de maneiras misteriosas."
 pam_secular_faith_events.0014.c:0 "Por que acreditei na maldita profecia de [prophet.GetHerHis]!?"
 pam_secular_faith_events.0014.d:0 "Eu deveria ter acreditado na profecia..."
 pam_secular_faith_events.0014.desc_failed:0 "Uma lua nova se passou, e [doomed_soul.GetTitledFirstName] ainda vive. A hora nomeada pelo pregador maltrapilho veio e se foi, sem levar nada consigo.\n\n[prophet.GetSheHe|U] é uma fraude, ou um tolo, mas com certeza não é a voz de [ROOT.Char.GetFaith.HighGodName]."
 pam_secular_faith_events.0014.desc_fulfilled:0 "Uma lua nova se passou, e [doomed_soul.GetTitledFirstName] está morto — levado calmamente em seu sono.[doomed_soul.GetHerHis]\n\nO pregador maltrapilho nomeou exatamente a hora. Não consigo esquecer disso.\n\nFoi esta uma profecia... ou o medo tornado carne?"
 pam_secular_faith_events.0014.desc_wrong_prediction:0 "\n\nSinto-me bastante tolo."
 pam_secular_faith_events.0014.e:0 "O pregador era uma fraude, assim como eu disse!"
 pam_secular_faith_events.0014.t:0 "Acerto de Contas Profético"
 pam_secular_faith_events.0015.a:0 "Um milagre? Deve ser examinado."
 pam_secular_faith_events.0015.b:0 "Que os fiéis venham. Vamos recebê-los."
 pam_secular_faith_events.0015.c:0 "Esta bênção não deve ser compartilhada."
 pam_secular_faith_events.0015.d:0 "Meu reino é abençoado!"
 pam_secular_faith_events.0015.desc:0 "Meu [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], me apressa em direção a [miracle_church.GetName]. Lá dentro, os olhos pintados de um santo choram óleo perfumado.\n\nA notícia de um milagre corre mais rápido que qualquer mensageiro, e um milagre é uma coisa poderosa e perigosa."
 pam_secular_faith_events.0015.t:0 "O Ícone Choroso"
 pam_secular_faith_events.0016.a:0 "O ouro pesa mais do que o pecado, afinal..."
 pam_secular_faith_events.0016.b:0 "Um preço justo, pago justamente. O cargo é seu."
 pam_secular_faith_events.0016.c:0 "O cargo não está à venda."
 pam_secular_faith_events.0016.desc_intro:0 "[ROOT.Char.Custom2('DescriptorMixedArticle', SCOPE.sC('candidate'))|U] [candidate.GetWomanMan] entra em meu [ROOT.Char.Custom('ResidenceBuilding')], não para suplicar um favor, mas para comprar um.\n\n\"Seu [old_realm_priest.GetCouncilTitle], [old_realm_priest.GetFirstName], é um bom pastor,\" [candidate.GetSheHe] murmura, soltando uma bolsa pesada sobre a mesa, \"mas eu me mostraria um... mais grato. Nomeie-me para [old_realm_priest.GetHerHis] cargo, e colha [ROOT.Char.GetFaith.WealthGodNamePossessive] bênção.\""
 pam_secular_faith_events.0016.desc_sanctioned:0 "\n\nNão há vergonha em [GetTenetType('tenet_simony').GetName( GetNullCharacter.GetRite )], e a prata é boa."
 pam_secular_faith_events.0016.desc_sinful:0 "\n\n[GetTenetType('tenet_simony').GetName( GetNullCharacter.GetRite )] é um pecado. Aceitar esse ouro mancharia minha alma."
 pam_secular_faith_events.0016.t:0 "Um Preço para o Púlpito"
 pam_secular_faith_events.0017.a.failure:0 "[accused.GetFirstName] não se comove"
 pam_secular_faith_events.0017.a.success:0 "[accused.GetFirstNameNoTooltip] se converte"
 pam_secular_faith_events.0017.a:0 "[accused.GetFirstNameNoTooltip], deixe-me trazê-lo para a fé."
 pam_secular_faith_events.0017.b:0 "Então se arrependa em uma cela. Capture [accused.GetHerHim]."
 pam_secular_faith_events.0017.c:0 "[accused.GetFirstNameNoTooltip] está sob minha proteção. Basta."
 pam_secular_faith_events.0017.desc:0 "\"Herege!\" meu [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], aponta um dedo acusador para [accused.GetFirstName]. \"Não consegue ver [accused.GetFirstNamePossessiveNoTooltip] vil influência [accused.GetRite.GetAdjective] sobre seu [ROOT.Char.Custom('GetCourt')]? [accused.GetSheHe|U] deve se arrepender e aceitar [ROOT.Char.GetFaith.HighGodName]!\"\n\n[accused.GetFirstNameNoTooltip] mantém um rosto estóico, embora a acusação claramente [accused.GetHerHim] fira."
 pam_secular_faith_events.0017.t:0 "Um Herege em [ROOT.Char.Custom('GetCourt')|U]"
 pam_secular_faith_events.0018.a:0 "Sirva a [ROOT.Char.GetFaith.HighGodName], mas fique aqui."
 pam_secular_faith_events.0018.b:0 "A igreja terá meu/minha [pious_child.Custom('GetDaughterSon')]."
 pam_secular_faith_events.0018.c:0 "Não, [pious_child.GetSheHe] pertence à casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 pam_secular_faith_events.0018.desc:0 "Meu [ROOT.Char.Custom2( 'RelationToMeShort', pious_child )], [pious_child.GetFirstName], é diferente da maioria das crianças. Enquanto outras brincam, [pious_child.GetSheHe] passa [pious_child.GetHerHis] dias na capela.\n\n\"Nunca vi uma criança como [pious_child.GetHerHim],\" meu [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], diz calmamente. \"[pious_child.GetSheHe|U] passa horas em oração e chora durante a missa. É claro como o dia: [pious_child.GetFirstNameNoTooltip] deseja a vida de [GetTrait('devoted').GetName( pious_child )].\""
 pam_secular_faith_events.0018.t:0 "Uma Criança para Deus"
 pam_secular_faith_events.0019.a:0 "Pela vontade de [ROOT.Char.GetFaith.HighGodName], haverá paz."
 pam_secular_faith_events.0019.b:0 "Cada lorde que empunhou aço responderá por isso."
 pam_secular_faith_events.0019.c:0 "As querelas dos meus vassalos cabem a mim julgar."
 pam_secular_faith_events.0019.desc:0 "Meu [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], chega com notícias graves.\n\n\"Irmão não matará irmão sob o olhar de [ROOT.Char.GetFaith.HighGodNamePossessive],\" [chaplain.GetSheHe|U] proclama. \"[feud_attacker.GetTitledFirstName] e [feud_defender.GetTitledFirstName] desembainharam aço um contra o outro, e o povo sangra por sua querela!\"\n\n\"Acabe com isso. Una-os com a [GetTenetType('tenet_peace_of_god').GetName( GetNullCharacter.GetRite )].\""
 pam_secular_faith_events.0019.t:0 "A Paz de Deus"
 pam_secular_faith_events.0020.a:0 "Conduza-nos em oração, [chaplain.GetFirstNameNoTooltip]."
 pam_secular_faith_events.0020.b:0 "Que [consecrated_county.GetNameNoTierNoTooltip] floresça ao redor de [ROOT.Char.GetFaith.HouseOfWorship]."
 pam_secular_faith_events.0020.c:0 "Buscarei sabedoria dentro destas paredes."
 pam_secular_faith_events.0020.d:0 "Eu apenas comecei a obra de [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_secular_faith_events.0020.desc:0 "Os pedreiros colocam a última pedra no primeiro [ROOT.Char.GetFaith.HouseOfWorship] que já ergui, aqui em [temple_location.Custom('TerrainTypeProvincePrefix')] [temple_location.Custom('TerrainTypeProvince')] de [temple_location.GetName].\n\nMeu [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], caminha pelos terrenos, com o incensário na mão.\n\n\"Você será lembrado pelo [ROOT.Char.GetFaith.HouseOfWorshipPlural] que dedica a [ROOT.Char.GetFaith.HighGodName],\" [chaplain.GetSheHe] diz. \"Que este seja o primeiro de muitos.\""
 pam_secular_faith_events.0020.t:0 "[ROOT.Char.GetFaith.HouseOfWorship|U] de [temple_location.GetNameNoTooltip]"
 pam_secular_faith_events.0021.a:0 "Estudarei este presságio."
 pam_secular_faith_events.0021.b:0 "O favor de [ROOT.Char.GetFaith.HighGodNamePossessive] brilha através dele."
 pam_secular_faith_events.0021.c:0 "Tal sinal anuncia a conquista!"
 pam_secular_faith_events.0021.d:0 "Os céus não me devem respostas."
 pam_secular_faith_events.0021.desc:0 "O sono não vem. Busco a escuridão silenciosa de [ROOT.Char.Custom('GetCourtyard')] e olho para o céu. Esta noite, os céus me mostram [ROOT.Char.Custom('GetPamCelestialOmen')].\n\nTais sinais nunca vêm sem significado."
 pam_secular_faith_events.0021.t:0 "Um Sinal nos Céus"
 pam_secular_faith_events.0022.a:0 "Venha. Deixe minhas mãos descansarem sobre você."
 pam_secular_faith_events.0022.b:0 "Não... Eu o abençoarei de onde estou."
 pam_secular_faith_events.0022.desc_end:0 "\"Dizem que a realeza carrega a graça de [ROOT.Char.GetFaith.HighGodNamePossessive] em seus dedos... e essa é a única esperança que me resta.\""
 pam_secular_faith_events.0022.desc_ill:0 "\"Eu definho, [ROOT.Char.Custom('FormOfAddressForLiege')], terrivelmente [illness_trait.GetName( GetNullCharacter )], sem cura à vista. Nem mesmo o médico, [physician.GetTitledFirstName], sabe o que há de errado comigo!\" [sick_courtier.GetSheHe] lamenta.\n\n"
 pam_secular_faith_events.0022.desc_intro:0 "Meu [ROOT.Char.Custom2( 'RelationToMeShort', sick_courtier )], [sick_courtier.GetFirstName], arrasta-se em minha direção, pálido e instável.\n\n"
 pam_secular_faith_events.0022.desc_other:0 "\"Eu definho, aometido por [illness_trait.GetName], e não há cura à vista. Nem mesmo [physician.GetTitledFirstName] pode me ajudar!\" [sick_courtier.GetSheHe] lamenta.\n\n"
 pam_secular_faith_events.0022.t:0 "O Toque do [ROOT.Char.GetTitleAsNameNoTooltip]"
 pam_secular_faith_events.0023.a:0 "Um erudito? Ensine-me o que sabe."
 pam_secular_faith_events.0023.b:0 "[scholar_church.GetNameNoTooltip] precisa de você."
 pam_secular_faith_events.0023.c:0 "Meus livros de contas precisam de uma mão firme."
 pam_secular_faith_events.0023.d:0 "Não preciso de você. Fora daqui."
 pam_secular_faith_events.0023.desc:0 "Um [scholar.GetWomanMan] esquelético é trazido à minha presença, com tinta manchando [scholar.GetHerHis] dedos e tomos enfiados sob [scholar.GetHerHis] braço.\n\n\"Sou [scholar.GetFirstName], escriba e estudioso\", continua [scholar.GetSheHe]. \"Não tenho lar nem patrono. Estas mãos não foram feitas para o trabalho físico, mas para registrar a palavra de um [ROOT.Char.GetTitleAsNameNoTooltip] em [ROOT.Char.Custom('GetWritingMaterial')].\"\n\n\"Eu vos suplico, dai-me pão e teto, e vos servirei fielmente.\""
 pam_secular_faith_events.0023.t:0 "Um Escriba Errante"
 pam_secular_faith_events.0024.a:0 "Assim, [ROOT.Char.GetFaith.HighGodName] recebe mais um servo 'voluntário'!"
 pam_secular_faith_events.0024.b:0 "Prefiro manter meu inimigo à vista."
 pam_secular_faith_events.0024.desc:0 "Meu [ROOT.Char.Custom2( 'RelationToMeShort', rival_character )], [rival_character.GetFirstName], é, como de costume, um [rival_character.Custom2('InsultAdjectiveClumsy', ROOT.Char)] [rival_character.Custom2('InsultNounClumsy', ROOT.Char)] e um [rival_character.Custom2('InsultAdjective', ROOT.Char)] [rival_character.Custom2('InsultNoun', ROOT.Char)] em [ROOT.Char.Custom('GetCourt')]. Contudo, meu ânimo se eleva com uma carta de [archbishop.GetTitledFirstName], de [archdiocese.GetName].\n\n\"[rival_character.GetFirstName] serviria bem a [ROOT.Char.GetFaith.HighGodName]\", escreve [archbishop.GetSheHe]. \"O claustro acolheria [rival_character.GetHerHim] com alegria.\"\n\nO mundo logo esquece aqueles que lá se ajoelham."
 pam_secular_faith_events.0024.t:0 "Rumo ao Claustro"
 pam_secular_faith_events.0025.a:0 "Então que todos vejam nosso novo laço!"
 pam_secular_faith_events.0025.b:0 "A fé não precisa de grandes espetáculos."
 pam_secular_faith_events.0025.c:0 "Não posso aceitar esta honra."
 pam_secular_faith_events.0025.desc:0 "\"Desejo me unir à fé de [ROOT.Char.GetFaith.GetAdjective], em corpo e espírito\", diz solenemente meu [ROOT.Char.Custom2( 'RelationToMeShort', converting_char )], [converting_char.GetFirstName]. \"Quero ser batizado e me tornar um [ROOT.Char.GetRite.GetAdherentName]... e peço que estejais junto à pia batismal como meu padrinh[ROOT.Char.GetMotherFather].\""
 pam_secular_faith_events.0025.t:0 "Padrinh[ROOT.Char.GetMotherFather]"
 pam_secular_faith_events.0026.a:0 "[afflicted.GetSheHe|U] precisa de cuidados adequados."
 pam_secular_faith_events.0026.b:0 "Eu mesma liderarei o exorcismo."
 pam_secular_faith_events.0026.c:0 "Esta é uma obra sagrada. Cuidai disso."
 pam_secular_faith_events.0026.d:0 "Fora com [afflicted.GetHerHim], antes que o pânico se espalhe!"
 pam_secular_faith_events.0026.desc:0 "Meu [ROOT.Char.Custom2( 'RelationToMeShort', afflicted )], [afflicted.GetFirstName], nunca esteve totalmente em seu juízo... mas [afflicted.GetSheHe] já nem é mais [afflicted.GetHerselfHimself].\n\n\"[ROOT.Char.GetFaith.EvilGodNames]! [ROOT.Char.GetFaith.EvilGodNames] está dentro de mim!\", delira [afflicted.GetSheHe], convulsionando no chão de [ROOT.Char.GetFaith.HouseOfWorship].\n\nMeu [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], empalidece. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], temo que [afflicted.GetHerHis] alma esteja sitiada por demônios. A única forma de ajudar [afflicted.GetHerHim] é realizar um exorcismo.\""
 pam_secular_faith_events.0026.t:0 "Uma Alma Sitiada"
 pam_secular_faith_events.0027.a:0 "[ROOT.Char.GetFaith.HighGodName] exige [new_tenet.GetNameNoTooltip( ROOT.Char.GetRite )]!"
 pam_secular_faith_events.0027.b:0 "Quem sabe... [forbidden_tenet.GetNameNoTooltip( ROOT.Char.GetRite )]?"
 pam_secular_faith_events.0027.c:0 "Estou condenado. E todos os outros também estarão..."
 pam_secular_faith_events.0027.desc:0 "\"Ouvis-me, [ROOT.Char.GetFaith.HighGodName]?\", sussurro. Mas, no fundo, sei que [ROOT.Char.GetFaith.HighGodNameSheHe|U] não ouve pecadores como eu.\n\nTertei compreendido mal a vontade de [ROOT.Char.GetFaith.HighGodHerHis|U]? Acaso [old_tenet.GetName( ROOT.Char.GetRite )] não é a verdadeira forma da sabedoria de [ROOT.Char.GetFaith.HighGodHerHis|U]?\n\nA luz incide sobre o crucifixo, e a esperança desperta em meu interior."
 pam_secular_faith_events.0027.t:0 "Crise de Fé"
 pam_secular_faith_events.0028.a:0 "Encontrarei ouvidos dispostos."
 pam_secular_faith_events.0028.b:0 "Mas minha verdadeira paixão é [forbidden_tenet.GetNameNoTooltip( ROOT.Char.GetRite )]!"
 pam_secular_faith_events.0028.c:0 "Deveria colocar meus sentimentos em [ROOT.Char.Custom('GetWritingMaterial')]."
 pam_secular_faith_events.0028.desc:0 "Ajoelho-me no [ROOT.Char.GetFaith.HouseOfWorship], e a presença de [ROOT.Char.GetFaith.HighGodName] infiltra-se em cada canto da minha alma.\n\nReverenciar [old_tenet.GetName( ROOT.Char.GetRite )] revelou-me a verdade. Nunca conheci tanta paz. Como poderia guardar uma alegria assim só para mim? Não deveria guiar os outros para a mesma luz, para lhes mostrar a verdade?"
 pam_secular_faith_events.0028.t:0 "Minha Alma, Em Paz"
 pam_secular_faith_events.0029.a:0 "[departed.GetSheHe|U] está em segurança e zela por mim."
 pam_secular_faith_events.0029.b:0 "Seria... um aviso?"
 pam_secular_faith_events.0029.c:0 "Uma ilusão da mente. Nada mais."
 pam_secular_faith_events.0029.desc:0 "\"Acorde, [ROOT.Char.GetFirstNameNoTooltip]\", ecoa uma voz familiar. \"Estou aqui, [departed.Custom2( 'RelationToMeShort', root_scope )]... em sua hora de necessidade.\"\n\nDesperto, com a testa coberta de suor frio. A aparição cintila brevemente antes de desaparecer.\n\nSeria aquilo... meu [ROOT.Char.Custom2( 'RelationToMeShort', departed )]?"
 pam_secular_faith_events.0029.t:0 "Uma Visita dos Mortos"
 pam_secular_faith_events.0030.a:0 "Se este é o vosso desejo, meus pedreiros estão às vossas ordens."
 pam_secular_faith_events.0030.b:0 "Não, isto eu não vos concederei."
 pam_secular_faith_events.0030.desc:0 "\"Desejo aproximar-me de [ROOT.Char.GetFaith.HighGodName]\", diz solenemente meu [ROOT.Char.Custom2( 'RelationToMeShort', would_be_anchorite )], [would_be_anchorite.GetFirstName]. \"O mundo está cheio de distrações, e desejo completa solidão.\"\n\n[would_be_anchorite.GetSheHe|U] contempla a parede de [ROOT.Char.Custom('ResidenceBuilding')], tocando-a com [would_be_anchorite.GetHerHis] dedos.\n\n\"[ROOT.Char.GetFaith.HouseOfWorship] de [church_scope.GetName] é belo. Desejo ser enclausurado dentro de suas paredes e passar o resto de minha vida em oração ininterrupta.\""
 pam_secular_faith_events.0030.t:0 "O Anacoreta"
 pam_secular_faith_events.0031.a:0 "Um debate erudito? Deixai-me pegar minhas anotações..."
 pam_secular_faith_events.0031.b:0 "Sinto-me atraído por [tenet_1.GetBaseNameNoTooltip]."
 pam_secular_faith_events.0031.c:0 "[tenet_2.GetBaseNameNoTooltip] soa verdadeiro."
 pam_secular_faith_events.0031.d:0 "Uma [ROOT.Char.Custom('GetCourt')] animada é uma [ROOT.Char.Custom('GetCourt')] culta."
 pam_secular_faith_events.0031.desc:0 "\"Como pode alguém negar a santidade de [tenet_1.GetBaseName]?\", clama meu [ROOT.Char.Custom2( 'RelationToMeShort', disputant_one )], [disputant_one.GetFirstName].\n\n\"Absurdo! É claro como o dia que [tenet_2.GetBaseName] vos aproxima do divino! Nada aprendestes?\", retruca meu [ROOT.Char.Custom2( 'RelationToMeShort', disputant_two )], [disputant_two.GetFirstName]."
 pam_secular_faith_events.0031.t:0 "Uma Discussão de Eruditos"
 pam_secular_faith_events.0032.a:0 "Meus impulsos são justificados por [ROOT.Char.GetFaith.HighGodName]!"
 pam_secular_faith_events.0032.b:0 "Não. O jejum continua, e eu também."
 pam_secular_faith_events.0032.c:0 "Um pequeno gosto... quem há de saber?"
 pam_secular_faith_events.0032.desc_food:0 "Desperto com o travesseiro molhado de baba. Das cozinhas sobe o aroma de [ROOT.Char.Custom('RegionalEdibleMeat')] assado e [ROOT.Char.Custom('GetRandomRegionalSmallGame')] recheado com [ROOT.Char.Custom('GetFoodDetail')], enquanto o tinir de taças de [ROOT.Char.Custom('RegionalDrink')] e vozes alegres ecoam por [ROOT.Char.Custom('ResidenceBuildingHallsType')].\n\nSendo [vice_trait.GetName( GetNullCharacter )], [ROOT.Char.GetFaith.PriestNeuterPlural] ordenaram-me o jejum... mas por que [ROOT.Char.GetFaith.HighGodName] haveria de me testar justamente nesta noite?\n\nSinto minha determinação esvair-se junto com o ronco do meu estômago."
 pam_secular_faith_events.0032.t:0 "A Hora da Tentação"
 pam_secular_faith_events.0033.a:0 "Hm, contai-me mais..."
 pam_secular_faith_events.0033.b:0 "#EMP Você#! é fascinante! Venha aqui."
 pam_secular_faith_events.0033.c:0 "Por favor, meu [believing_spouse.Custom('RomanticComplimentNoun')], preciso dormir."
 pam_secular_faith_events.0033.desc:0 "Meu [ROOT.Char.Custom2( 'RelationToMeShort', believing_spouse )], [believing_spouse.GetFirstName], segue [believing_spouse.GetRite.GetName], cujos ensinamentos [believing_spouse.GetSheHe] me sussurra alegremente à noite.\n\n\"Meu [ROOT.Char.Custom('RomanticComplimentAdjective')] [believing_spouse.Custom2( 'RelationToMeShort', root_scope )], sabias que [new_tenet.Custom('GetGenericTenetSentence')]? Não é #EMP fascinante?#!\", pergunta [believing_spouse.GetSheHe|U], abraçando-me.\n\nA paixão de [believing_spouse.GetHerHis|U] é tão charmosa quanto [believing_spouse.GetHerHis] sorriso."
 pam_secular_faith_events.0033.t:0 "Sermões no Travesseiro"
 pam_secular_faith_events.0034.a:0 "[ROOT.Char.GetFaith.HighGodName] me deu [foundling.Custom('GetDaughterSon')]."
 pam_secular_faith_events.0034.b:0 "[archdiocese.GetNameNoTooltip] acolherá [foundling.GetHerHim]."
 pam_secular_faith_events.0034.c:0 "[chaplain.GetFirstNameNoTooltip] criará a criança."
 pam_secular_faith_events.0034.d:0 "Não me importa o que aconteça com criatura tão infeliz."
 pam_secular_faith_events.0034.desc:0 "É estranho meu [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], se atrasar. O silêncio do [ROOT.Char.GetFaith.HouseOfWorship] é quebrado pelos gritos fracos de um recém-nascido.\n\n\"Misericordioso [ROOT.Char.GetFaith.HighGodName]...\" sussurra [chaplain.GetFirstNameNoTooltip], embalando suavemente a criança. \"Abandonado por ser [trait_scope.GetName( GetNullCharacter )]... nenhuma alma merece tal destino.\"\n\nOs dedinhos da criança curvam-se ao redor do polegar de [chaplain.GetHerHis]."
 pam_secular_faith_events.0034.t:0 "A Criança Encontrada"
 pam_secular_faith_events.0035.a:0 "Intrigante... trazei-me o flagelo."
 pam_secular_faith_events.0035.b:0 "Deixe [sufferer.GetHerHim] mortificar-se."
 pam_secular_faith_events.0035.c:0 "Pelo amor de [ROOT.Char.GetFaith.HighGodNamePossessive], pare com essa loucura."
 pam_secular_faith_events.0035.desc:0 "Há sangue no chão. Seguindo o som de chibatadas, encontro meu [ROOT.Char.Custom2( 'RelationToMeShort', sufferer )], [sufferer.GetFirstName]. Um flagelo carmesim está nas mãos de [sufferer.GetHerHis], e lágrimas escorrem pelo rosto de [sufferer.GetHerHis].\n\n\"Minhas paixões [sinful_trait.GetName( GetNullCharacter )] ameaçam me consumir\", gasta o fôlego [sufferer.GetSheHe]. \"Antes a ardência do chicote do que o fogo da tentação.\"\n\n\"Esta dor passa. [ROOT.Char.GetFaith.NegativeAfterLife|U] não.\""
 pam_secular_faith_events.0035.t:0 "A Mortificação"
 pam_secular_faith_events.0036.a:0 "Que mistérios você pode transmitir?"
 pam_secular_faith_events.0036.b:0 "Estou disposto a aprender."
 pam_secular_faith_events.0036.c:0 "Vá embora, mendigo."
 pam_secular_faith_events.0036.desc:0 "Um [hermit.GetWomanMan] esfarrapado busca audiência, afirmando ser um eremita da remota [hermit_location.Custom('TerrainTypeProvince')] de [hermit_location.GetName].\n\n\"Por sete noites [ROOT.Char.GetFaith.HighGodName] me negou o sono\", diz [hermit.GetSheHe] severamente. \"Não para me punir, mas para encher meus pensamentos com verdades destinadas a outros, a você.\"\n\n\"Ouça minhas palavras e preste atenção. Depois, retornarei à minha solidão.\""
 pam_secular_faith_events.0036.t:0 "A Sabedoria do Anacoreta"
 pam_secular_faith_events.0037.a:0 "Mostre-me. Tranque a porta atrás de você."
 pam_secular_faith_events.0037.b:0 "Cubra-se, [reveler.GetWomanMan]."
 pam_secular_faith_events.0037.desc:0 "Logo pouca coisa prende minha atenção além de [reveler.GetHerHis] [reveler.Custom('ObjectifiedFeature')].\n\n\"Há preces ditas com a língua\", diz [reveler.GetSheHe], removendo lentamente [reveler.GetHerHis] [reveler.Custom('GetClothingArticle')]. \"E há preces ditas com a carne. Deixe-me mostrar [reveler.Custom('pam_sf_carnal_art')], meu [ROOT.Char.Custom('RaunchyComplimentNoun')].\"\n\n[reveler.GetSheHe|U] me oferece a mão de [reveler.GetHerHis]. \"O êxtase que virá rivalizará com a bem-aventurança de [ROOT.Char.GetFaith.PositiveAfterLife].\""
 pam_secular_faith_events.0037.desc_normal:0 "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] flui tarde, e meu [ROOT.Char.Custom2( 'RelationToMeShort', reveler )], [reveler.GetFirstName], inclina-se para perto."
 pam_secular_faith_events.0037.desc_wanderer:0 "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] flui tarde, e um andarilho visitante, [reveler.GetFirstName], inclina-se para perto."
 pam_secular_faith_events.0037.t:0 "Revelação Carnal"
 pam_secular_faith_events.0038.a:0 "Talvez a santidade esteja na taça..."
 pam_secular_faith_events.0038.b:0 "Então prepararei um banquete em sua honra."
 pam_secular_faith_events.0038.c:0 "Decadência disfarçada de devoção. Não."
 pam_secular_faith_events.0038.desc:0 "Meu [ROOT.Char.Custom2( 'RelationToMeShort', reveler )], [reveler.GetFirstName], enche outro prato com [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_plural')] e sorri para mim do outro lado da mesa.\n\n\"Você caça [ROOT.Char.GetFaith.HighGodName] com o estômago roncando e o cálice vazio. Eu encontro [ROOT.Char.GetFaith.CreatorHerHim] em frutas maduras, carne rica, risos e canções\", [reveler.GetSheHe] ergue um cálice transbordante.\n\n\"As dádivas de [ROOT.Char.GetFaith.HighGodNamePossessive] foram feitas para serem saboreadas, [ROOT.Char.Custom('FormOfAddressForLiege')]. Desperdiçar o que nos é dado? Ora, isso é um pecado horrível!\""
 pam_secular_faith_events.0038.t:0 "Um Gosto do Paraíso"
 pam_secular_faith_events.0039.a:0 "[ROOT.Char.GetFaith.HighGodName] realmente age nas sombras..."
 pam_secular_faith_events.0039.b:0 "Um truque deplorável... apenas me conte o segredo."
 pam_secular_faith_events.0039.desc:0 "Meu [ROOT.Char.Custom2( 'RelationToMe', spymaster_scope )], [spymaster_scope.GetFirstName], vem até mim, ainda inquieto com os frutos da astúcia de [spymaster_scope.GetHerHis].\n\n\"Ajoelhei-me ao lado de [secret_keeper.GetTitledFirstName] na prece, [ROOT.Char.Custom('FormOfAddressForLiege')], e menti — uma inverdade pequena e piedosa, sussurrada para soltar a língua de [secret_keeper.GetHerHis].\"\n\n\"[secret_keeper.GetSheHe|U] confessou a [secret_keeper.Custom('GetSecretCrimeConfessionIndef')] na casa de [ROOT.Char.GetFaith.HighGodName]\", [spymaster_scope.GetSheHe] baixa a voz de [spymaster_scope.GetHerHis]. \"Falei [GetTenetType('tenet_sacred_shadows').GetName( GetPlayer.GetRite )]... talvez esse engano seja um dever que devemos a [ROOT.Char.GetFaith.HighGodName]?\""
 pam_secular_faith_events.0039.t:0 "Uma Prece no Escuro"
 pam_secular_faith_events.0040.a:0 "Ah, eu sei tudo sobre isso."
 pam_secular_faith_events.0040.b:0 "Um costume sombrio... conte-me mais."
 pam_secular_faith_events.0040.c:0 "Por [ROOT.Char.GetFaith.HighGodName], [scholar.GetWomanMan]. Estou tentando comer!"
 pam_secular_faith_events.0040.desc:0 "Durante a refeição da noite, meu [ROOT.Char.Custom2( 'RelationToMeShort', scholar )], [scholar.GetFirstName], abre um tomo gasto de tanto manusear. Outra preleção está prestes a começar.\n\n\"Os [Glossary( 'Issedones', 'ISSEDONES_GLOSS' )] não enterravam seus mortos, [ROOT.Char.Custom('FormOfAddressForLiege')]. Eles se banquetearam com eles!\" diz [scholar.GetSheHe], mal parando para respirar. \"A carne de um pai misturada com carneiro, seu crânio dourado e guardado como uma relíquia sagrada. Para eles, era o amor mais verdadeiro que uma criança podia demonstrar.\"\n\n\"E a melhor parte?\" [scholar.GetSheHe] sorri. \"Heródoto em pessoa não os julgou nem perversos nem loucos. #EMP 'O costume,' #! disse ele, #EMP 'é o senhor de tudo.'#!\""
 pam_secular_faith_events.0040.t:0 "A Carne dos Fiéis"
 pam_secular_faith_events.0041.a:0 "Eu também anseio por essa liberdade."
 pam_secular_faith_events.0041.b:0 "Coma do meu fruto, conte sua história e depois vá embora."
 pam_secular_faith_events.0041.c:0 "Mandem prender o intruso."
 pam_secular_faith_events.0041.desc:0 "Enquanto caminho pelos meus jardins, avisto um estranho entre os canteiros de [ROOT.Char.GetCapitalLocation.Custom('get_region_flower_type')], colhendo frutos do meu [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_tree_type')] — nu como no dia em que nasceu, tendo como [adamite.GetHerHis] única vestimenta as folhas caídas.\n\n\"Oh, [ROOT.Char.GetTitleAsName]! Por que você se esconde atrás de panos e coroas?\" pergunta [adamite.GetSheHe], sem vergonha diante de [ROOT.Char.GetFaith.HighGodName] e de mim. \"Abracei a primeira inocência, quando vivíamos nus e sem medo.\"\n\n[adamite.GetSheHe|U] morde outro pedaço de fruta, com o suco escorrendo pela pele de [adamite.GetHerHis]. \"Talvez você devesse fazer o mesmo.\""
 pam_secular_faith_events.0041.t:0 "A Nua Verdade"
 pam_secular_faith_events.0042.a:0 "Caminharei pela estrada com um coração grato."
 pam_secular_faith_events.0042.b:0 "Vou pegar a moeda e guardá-la."
 pam_secular_faith_events.0042.c:0 "Guarde sua moeda, amigo."
 pam_secular_faith_events.0042.desc:0 "Meu [ROOT.Char.Custom2( 'RelationToMeShort', sponsor_character )], [sponsor_character.GetFirstName], vem ao meu encontro no jardim com uma bolsa solta e um sorriso caloroso.\n\n\"Permita-me arcar com o custo de sua [GetActivityType( 'activity_pilgrimage').GetName], [ROOT.Char.Custom('FormOfAddressForLiege')]. Um peregrino não deveria ficar contando moedas — vá livremente e ore por nós dois.\"\n\nA prata é real. A confiança também."
 pam_secular_faith_events.0042.t:0 "A Estrada Facilitada"
 pam_secular_faith_events.0043.a:0 "Então seguirei pela estrada dos peregrinos."
 pam_secular_faith_events.0043.b:0 "Tenho assuntos mais mundanos para cuidar."
 pam_secular_faith_events.0043.desc:0 "Meu [ROOT.Char.Custom2( 'RelationToMeShort', holy_man )], [holy_man.GetFirstName], toma minhas mãos diante do altar.\n\n\"Caminhe pela estrada dos peregrinos, [ROOT.Char.Custom('FormOfAddressForLiege')]. Quando retornar, proclamarei sua [GetActivityType( 'activity_pilgrimage').GetName] em cada praça de [capital_county.GetNameNoTier]. Seu povo saberá que [ROOT.Char.GetTitleAsNameNoTooltip] se ajoelhou por eles.\""
 pam_secular_faith_events.0043.t:0 "A Boas-Vindas do Peregrino"
 pam_secular_faith_events.0044.a:0 "Então fale em meu nome."
 pam_secular_faith_events.0044.b:0 "Sua amizade já é bênção suficiente."
 pam_secular_faith_events.0044.desc:0 "Meu [ROOT.Char.Custom2( 'RelationToMeShort', friendly_bishop )], [friendly_bishop.GetFirstName], chega com um ânimo incomum.\n\n\"Tenho encontrado favor entre meus pares ultimamente — bispos, abades, as vozes que têm peso na Igreja. Se você precisa da sabedoria piedosa deles, da autoridade moral deles, posso falar em seu nome.\"\n\nO favor de [friendly_bishop.GetFirstNamePossessiveNoTooltip] junto a [ROOT.Char.GetFaith.PriestNeuterPlural] famintos por poder é facilmente gasto."
 pam_secular_faith_events.0044.t:0 "O Ouvido do Clero"
 pam_secular_faith_events.0045.a:0 "O futuro me chama a liderar."
 pam_secular_faith_events.0045.b:0 "Aproveitarei este momento ao máximo."
 pam_secular_faith_events.0045.desc:0 "A clareza atinge como um relâmpago em céu limpo.\n\nDoutrina. Princípios. Ritos. Crença. Mil pensamentos dispersos fundiram-se em uma única verdade, que agora vejo diante de mim em sua totalidade."
 pam_secular_faith_events.0045.t:0 "Epifania"
 pam_secular_faith_events.0046.a:0 "Que a convicção compartilhada aprofunde nosso vínculo!"
 pam_secular_faith_events.0046.b:0 "Compartilhar esta convicção... é como o amor."
 pam_secular_faith_events.0046.c:0 "Obrigado por compartilhar."
 pam_secular_faith_events.0046.desc:0 "Meu [ROOT.Char.Custom2( 'RelationToMeShort', intimate )], [intimate.GetFirstName], não consegue esconder [intimate.GetHerHis] convicção enquanto [intimate.GetSheHe] fala sobre [shared_tenet.GetName( intimate.GetRite )].\n\n\"[shared_tenet.GetNameNoTooltip( GetNullCharacter.GetRite )] dá sentido a tudo o que faço\", diz [intimate.GetSheHe]. \"Apenas uma coisa importa tanto para mim... você, meu [ROOT.Char.Custom('ComplimentAdjective')] [intimate.Custom2('RelationToMe', SCOPE.sC('root_scope'))].\"\n\nUma única lágrima rola pela bochecha de [intimate.GetHerHis]. \"Eu só queria que você soubesse.\""
 pam_secular_faith_events.0046.t:0 "Convicção Compartilhada"
 pam_secular_faith_events.0047.a:0 "Então sime-me por completo."
 pam_secular_faith_events.0047.b:0 "Você deve sempre servir a [ROOT.Char.GetFaith.HighGodName] primeiro."
 pam_secular_faith_events.0047.desc:0 "Meu [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], traça o sinal da cruz e inclina a [chaplain.GetHerHis] cabeça.\n\n\"[ROOT.Char.GetFaith.HighGodName] colocou a coroa sobre a sua fronte por um motivo. Ao servir-vos fielmente, sirvo a [ROOT.Char.GetFaith.HighGodHerHis|U] vontade\", proclama [chaplain.GetSheHe].\n\n\"Jurei minha lealdade a [ROOT.Char.GetFaith.HighGodName]. Agora, gostaria de jurá-la a vós também.\""
 pam_secular_faith_events.0047.t:0 "Devoção Sacerdotal"
 pam_secular_faith_events.0048.a:0 "Este sonho... deve significar algo."
 pam_secular_faith_events.0048.b:0 "Apenas um sonho. De volta ao sono."
 pam_secular_faith_events.0048.c:0 "[ROOT.Char.GetFaith.HighGodName] me proteja! Devo me arrepender."
 pam_secular_faith_events.0048.desc:0 "Acordo, mas não consigo me mover.\n\nUma figura contorcida dança diante de mim, gargalhando. Um demônio? O terror toma lentamente o meu ser. \"Heh... heh... seus pecados pesam muito. Em breve [ROOT.Char.GetFaith.EvilGodNames] vai pegar você!\"\n\nSeja sonho ou demônio, não posso ignorar o que vi. Devo fazer as pazes com [ROOT.Char.GetFaith.HighGodName]."
 pam_secular_faith_events.0048.t:0 "Sonhos Demoniacos"
 pam_secular_faith_events.0049.a:0 "Deve ser ritualístico, eu deveria... tomar notas."
 pam_secular_faith_events.0049.b:0 "Se for em #EMP minha#! capela, então #emp eu vou#! participar!"
 pam_secular_faith_events.0049.c:0 "[lustful_priest.GetFirstNameNoTooltip], um desviante?! Desprezível, mas útil."
 pam_secular_faith_events.0049.desc:0 "Os sons que vêm da minha capela não são de oração.\n\n\"Sim, #emp SIM#!, Alteza! Mostre a este pecador miserável o [lustful_priest.GetHerHis] lugar devido na [GetTenetType('tenet_celestial_hierarchy').GetName( GetNullCharacter.GetRite )]!\", chora meu [ROOT.Char.Custom2( 'RelationToMeShort', lustful_priest )] [lustful_priest.GetFirstName] em êxtase. \"Sou um verme rastejando na lama, cheio de luxúria terrena. #emp PUNI-ME!#!\"\n\nPor [ROOT.Char.GetFaith.HighGodName], o que está acontecendo na minha capela!?"
 pam_secular_faith_events.0049.t:0 "'Hierarquia Celestial'"
 pam_secular_faith_events.0050.a:0 "...há espaço para dois no seu confessionário?"
 pam_secular_faith_events.0050.b:0 "Perdoai-me, [chaplain.GetMotherFather], porque tive pensamentos impuros."
 pam_secular_faith_events.0050.desc:0 "As velas tremeluzentes na [ROOT.Char.GetFaith.HouseOfWorship] pouco fazem para me distrair dos pensamentos impuros que enchem minha mente.\n\n\"Siga-me até o confessionário, [ROOT.Char.Custom('FormOfAddressForLiege')]\", sussurra meu [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]. Meus olhos demoram-se em [chaplain.GetHerHis] [chaplain.Custom('ObjectifiedFeature')]. \"Quaisquer que sejam os fardos da sua alma, fale sem medo.\"\n\nA [GetTenetType('tenet_confession')GetName( GetPlayer.GetRite )] é sagrada... mas um pecado pesa mais do que todos os outros: [chaplain.GetFirstNamePossessive] [chaplain.Custom('AdmiredFeature')]."
 pam_secular_faith_events.0050.t:0 "O [chaplain.Custom('RomanticComplimentAdjective')|U] [chaplain.GetCouncilTitle]"
 pam_secular_faith_events.0051.a:0 "Eu irei... obedecer..."
 pam_secular_faith_events.0051.desc:0 "#EMP \"Eu sou o Senhor, teu Deus\",#! uma voz estrondosa ecoa na [ROOT.Char.GetFaith.HouseOfWorship]. #EMP \"Tu te prostrarás perante mim.\"#!\n\nCaio de joelhos, com a visão turva. Limpo um rastro de sangue do meu rosto.\n\n#EMP \"Eu, o Senhor teu Deus, ordeno-te: Obedece-me com todo o teu coração e com toda a tua alma.\"#! Uma voz torna-se cem. Cem tornam-se mil. #EMP \"Se não o fizeres, amaldiçoar-te-ei até que sejas destruído, pois abandonaste a mim, o Senhor teu Deus.\"#!"
 pam_secular_faith_events.0051.t:0 "O Senhor Teu Deus"
 pam_secular_faith_events.0052.a:0 "Tallhe minha imagem... mas mais jovem e de boa aparência."
 pam_secular_faith_events.0052.b:0 "O capuz simples será suficiente."
 pam_secular_faith_events.0052.c:0 "A sepultura é paciente."
 pam_secular_faith_events.0052.desc:0 "Na [ROOT.Char.GetFaith.HouseOfWorship] de [resting_church.GetNameNoTier], meu [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], detém-se junto às lides funerárias gastas daqueles que governaram antes de mim.\n\n\"[ROOT.Char.GetFaith.HighGodName] concedeu-lhe mais invernos do que à maioria, [ROOT.Char.Custom('FormOfAddressForLiege')]. Não há pecado em escolher como irá descansar.\"\n\n\"Sua efígie esculpida em pedra, ou [Glossary( 'o capuz simples', 'AD_SUCCURRENDUM_GLOSS' )] de um monge — a escolha é sua.\""
 pam_secular_faith_events.0052.t:0 "Depois que Você Se For"
 pam_secular_faith_events.0053.a:0 "Eu mesma carregarei o relicário."
 pam_secular_faith_events.0053.b:0 "Manterei esta vigília sozinho."
 pam_secular_faith_events.0053.c:0 "Não ouso movê-lo."
 pam_secular_faith_events.0053.desc:0 "Meu [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], levanta a tampa de um relicário com o cuidado de uma parteira. Dentro repousa o tesouro de minha casa: o [procession_relic.GetName].\n\n\"A santidade sob chave e tranca não serve a nenhum propósito, [ROOT.Char.Custom('FormOfAddressForLiege')]\", diz [chaplain.GetSheHe]. \"Conceda ao seu povo uma [Glossary( 'ostension', 'OSTENSION_GLOSS' )] — a relíquia deve ser vista, e cada rua desta porta até os portões, abençoada.\""
 pam_secular_faith_events.0053.t:0 "O Santo Avança"
 pam_secular_faith_events.0054.a:0 "Ajoelha-te e pega no pano."
 pam_secular_faith_events.0054.b:0 "Ajoelha-te e beija estes pés cansados."
 pam_secular_faith_events.0054.c:0 "Eu... não posso. Leve a bacia embora."
 pam_secular_faith_events.0054.desc:0 "A bacia fumega e a [ROOT.Char.Custom('GetCourt')] reuniu-se para assistir. Um [pauper.Custom2('dummy_peasant_profession', pauper)] nervoso empoleira-se no banquinho, com os pés nus [pauper.GetHerHis] encrostados de lama. O cheiro é... distinto.\n\nNesta mesma noite, o Salvador ajoelhou-se com a bacia e o pano. O [Glossary( 'Mandatum', 'MANDATUM_GLOSS' )] está preparado, e todos os olhos na sala estão postos em mim.\n\nTudo o que resta é ajoelhar-se — ou pensar melhor sobre isso."
 pam_secular_faith_events.0054.deviant:0 "#EMP Limparei esses pés deliciosos com a minha língua.#!"
 pam_secular_faith_events.0054.t:0 "A Bacia e o Pano"
 pam_secular_faith_events.0055.a:0 "Então que seja lavado, ungido e batizado."
 pam_secular_faith_events.0055.b:0 "É bronze, não uma alma — os capitulares dizem o mesmo."
 pam_secular_faith_events.0055.c:0 "Uma breve bênção bastará. Deixe-o soar."
 pam_secular_faith_events.0055.desc:0 "O velho sino da [bell_church.GetName] rachou e, por isso, foi fundido novamente. O novo brilha em sua torre alta. Abaixo, meu [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] está pronto com água, óleo sagrado e sal.\n\n\"Um sino deve ser [Glossary( 'baptized', 'BELL_BAPTISM_GLOSS' )] para dar voz a [ROOT.Char.GetFaith.HighGodName]\", insiste [chaplain.GetSheHe], com as mangas arregaçadas. \"Lavado, ungido e batizado — e depois disso nenhum demônio ou tempestade poderá calar a sua voz.\""
 pam_secular_faith_events.0055.t:0 "A Voz de Bronze"
 pam_secular_faith_events.0056.a:0 "Então que o momento na luz seja bem aproveitado."
 pam_secular_faith_events.0056.b:0 "Era um pássaro. Mais vinho."
 pam_secular_faith_events.0056.desc:0 "Um pardal irrompe da noite de inverno, atravessa toda a extensão do [ROOT.Char.Custom('ResidenceBuildingHallType')] em meio à fumaça das tochas e risadas, e desaparece novamente pela [ROOT.Char.Custom('ResidenceBuildingWindowType')].\n\nO [ROOT.Char.Custom('GetCourt')] ri. Meu [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], não.\n\n\"[Glossary( 'Assim é a vida humana', 'BEDE_SPARROW_GLOSS' )], [ROOT.Char.Custom('FormOfAddressForLiege')] — um momento na luz e no calor, entre uma escuridão e outra. O que vem antes e depois é conhecido apenas por [ROOT.Char.GetFaith.HighGodName].\""
 pam_secular_faith_events.0056.scholar:0 "Beda escreveu o mesmo, quase palavra por palavra."
 pam_secular_faith_events.0056.t:0 "Um Pardal no Salão"
 pam_secular_faith_events.0057.a:0 "Então sirva-me uma caneca. Para o telhado."
 pam_secular_faith_events.0057.b:0 "Poupe a cerveja — eu mesma pagarei pelo telhado."
 pam_secular_faith_events.0057.c:0 "Beber? Em solo sagrado? Despeje tudo."
 pam_secular_faith_events.0057.desc:0 "Meu [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], preside no adro da [ale_church.GetName] sobre mesas que acomodam a maior parte da paróquia e barris trazidos diretamente da [GetBuilding('breweries_01').GetName], segurando uma caneca transbordante.\n\n\"O telhado deixa entrar chuva, [ROOT.Char.Custom('FormOfAddressForLiege')], e o dízimo é escasso. Então os irmãos fabricam, nós vendemos, e a paróquia bebe a [Glossary( 'church ale', 'CHURCH_ALE_GLOSS' )] até o telhado estar pago.\"\n\n\"Cada caneca é uma boa ação. Aceitará uma?\""
 pam_secular_faith_events.0057.t:0 "A Cerveja da Igreja"
 pam_secular_faith_events.0058.a:0 "Compre uma píxide com uma fechadura melhor."
 pam_secular_faith_events.0058.b:0 "Então o camundongo está condenado? Há!"
 pam_secular_faith_events.0058.desc:0 "Meu [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], irrompe, pálido como uma toalha de altar, segurando uma pequena [Glossary( 'píxide', 'PYX_GLOSS' )] de prata como se ela queimasse em [chaplain.GetHerHis] mãos.\n\n\"Um camundongo, [ROOT.Char.Custom('FormOfAddressForLiege')]. Roeu a caixa esta noite e comeu da [Glossary( 'hóstia consagrada', 'RESERVED_HOST_GLOSS' )]!\"\n\n[chaplain.GetSheHe|U] mal consegue falar. \"Os eruditos perguntam [Glossary( 'quid mus sumit', 'QUID_MUS_SUMIT_GLOSS' )] — o que, então, o camundongo comeu? O que devo fazer?\""
 pam_secular_faith_events.0058.mean:0 "Você deixou um #EMP camundongo#! saborear [ROOT.Char.GetFaith.HighGodName]?! Fora da minha [ROOT.Char.Custom('GetCourt')]!"
 pam_secular_faith_events.0058.scholar:0 "Acalme-se. O camundongo comeu pão, nada mais."
 pam_secular_faith_events.0058.t:0 "Quid Mus Sumit?"
 pam_secular_faith_events.0059.a:0 "Desencabrestem os cavalos. Ouviremos a missa."
 pam_secular_faith_events.0059.b:0 "O [sighting_county.Custom('GetAnimalType')] não vai esperar. Cavalgai!"
 pam_secular_faith_events.0059.desc:0 "Ao amanhecer, chegaram notícias de um [sighting_county.Custom('GetAnimalAdjective')] [sighting_county.Custom('GetAnimalType')] no [sighting_province.Custom('GetTerrainTypePlural')] de [sighting_county.GetBaseNameNoTier]. Os cães uivam e os cavalos batem os cascos no pátio — mas meu [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], permanece firme no portão.\n\n\"É [Glossary( 'o dia de descanso', 'LORDS_DAY_GLOSS' )], [ROOT.Char.Custom('FormOfAddressForLiege')]. O sino tocou e a missa nos aguarda!\"\n\n\"Seis dias vos deu [ROOT.Char.GetFaith.HighGodName] para cavalgar. Precisais cobiçar este também?\""
 pam_secular_faith_events.0059.t:0 "O Dia do Senhor"
 pam_secular_faith_events.0060.a:0 "Quanto menos tenho, mais sou!"
 pam_secular_faith_events.0060.b:0 "Vou dourar esta minha gaiola mais uma vez!"
 pam_secular_faith_events.0060.c:0 "Tirem-me desta chuva."
 pam_secular_faith_events.0060.desc:0 "Enquanto cavalgo pelas ruas de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], aflito por meus cofres vazios e tumulto interior, avisto um mendigo.\n\nDesembaraçado de posses terrenas, [hermit.GetSheHe] dança com a paz e a compreensão de alguém que aceitou seu lugar no mundo. Uma alma livre das misérias que sofro.\n\nTalvez [hermit.GetSheHe] enxergue uma verdade que também possa me libertar."
 pam_secular_faith_events.0060.t:0 "Uma Vida Sem Fardos"
