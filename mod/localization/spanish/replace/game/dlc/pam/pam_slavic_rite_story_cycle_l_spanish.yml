l_spanish:
 pam_brothers_travel_safety_modifier:0 "Viagem Cautelosa"
 pam_cyril_statue_modifier:0 "Memorial de Cirilo"
 pam_slavic_rite_clergy_opinion_modifier:0 "Monarca Bendito"
 pam_slavic_rite_culture_opinion_modifier:0 "Monarca do Povo"
 pam_slavic_rite_great_project_speed_modifier:0 "Projeto de Conversão Financiado"
 preacher_left.t:0 "Pregador Partiu"
 preacher_recruited.t:0 "Pregador Recrutado"
 slavic_rite.0001.a:0 "Vá com Deus."
 slavic_rite.0001.a_tt:0 "[cyril_scope.GetFirstName] e [methodius_scope.GetFirstName] iniciarão sua jornada. Se for bem-sucedida, o retorno deles poderá desencadear um novo movimento religioso em todo o seu reino."
 slavic_rite.0001.b:0 "Não vou deixar você ir de mãos abrevadas."
 slavic_rite.0001.desc:0 "Sinto-me aliviado ao ver [Glossary( 'Cirilo e Metódio', 'CYRIL_AND_METHODIUS_GLOSS' )] novamente, e espero que tenham um plano para lidar com a interferência de [GetRiteByKey('carolingian_christianity').GetAdherentName].\n\n\"Nobre [ROOT.Char.GetTitleAsNameNoTooltip], parece que a única maneira de garantir a segurança da forma de adoração do seu povo é viajar para [pope_scope.GetCapitalLocation.GetBaronyNameExplicitly] e receber a bênção de [pope_scope.GetTitledFirstName].\"\n\nEspero realmente que a autoridade do trono de São Pedro consiga conter o dominante [GetRiteByKey('carolingian_christianity').GetAdherentNamePluralNoTooltip], mas eles parecem honrar apenas aos seus."
 slavic_rite.0001.t:0 "A Missão Moraviana"
 slavic_rite.0003.a:0 "Vamos ver quão bem-sucedidos são os caminhos de [methodius_scope.GetHerHis]."
 slavic_rite.0003.desc:0 "Recebi notícias de que [methodius_scope.GetFirstNameNoTooltip], com a ajuda de [moravia_liege_scope.GetTitledFirstNameNoTooltip], está tentando espalhar uma nova maneira de praticar [methodius_scope.GetFaith.GetNameNoTooltip] por toda parte nas terras de [moravia_liege_scope.GetCulture.GetNameNoTooltip]. Meus eruditos chamam isso de [methodius_scope.GetRite.GetName].\n\nApesar dos nossos esforços anteriores para aproximar os locais de nós, [methodius_scope.GetSheHe] conseguiu garantir a aprovação de [pope_scope.GetTitledFirstName] para exercer uma nova escrita sobre eles."
 slavic_rite.0003.t:0 "Nascimento de [methodius_scope.GetRite.GetName]"
 slavic_rite.0004.a_chalcedonian:0 "Não tenho o menor desejo de me desviar do verdadeiro caminho."
 slavic_rite.0004.a_pagan:0 "Os costumes de nossos ancestrais são superiores."
 slavic_rite.0004.b_chalcedonian:0 "Tragam os eruditos."
 slavic_rite.0004.b_pagan:0 "Talvez haja alguma verdade nisso..."
 slavic_rite.0004.desc_chalcedonian:0 "Nosso [liege_scope.GetTitleAsNameNoTooltip] decretou o estabelecimento de [methodius_scope.GetRite.GetNameNoTooltip] para ser espalhado por todo o reino de [liege_scope.GetHerHis]. De acordo com meus estudiosos, é um caminho mais conveniente para praticar [methodius_scope.GetFaith.GetNameNoTooltip] sem comprometer nosso modo de vida.\n\nTalvez valha a atenção?"
 slavic_rite.0004.desc_pagan:0 "Notícias intrigantes chegaram à minha corte esta manhã.\n\n[liege_scope.GetTitledFirstNameNoTooltip] permitiu que o sacerdote [methodius_scope.GetCulture.GetNameNoTooltip] de [methodius_scope.GetFirstNam] espalhasse ainda mais as formas profanas de [methodius_scope.GetHerHis] em nossas terras por anos. [methodius_scope.GetFaith.GetNameNoTooltip] será moldada para facilitar o modo de vida de [ROOT.Char.GetCulture.GetNameNoTooltip] para aqueles que desejam praticá-lo.\n\nTem havido muito alvoroço ultimamente sobre a natureza espiritual de nossas tradições. Talvez eu finalmente tenha que pensar em como proceder com tudo isso."
 slavic_rite.0004.t:0 "O [ROOT.Char.GetCulture.GetNameNoTooltip] [methodius_scope.GetRite.GetNameNoTooltip]"
 slavic_rite.0005.a:0 "Juntos, deixaremos seu irmão orgulhoso!"
 slavic_rite.0005.b:0 "O mínimo que posso fazer é honrar o legado dele."
 slavic_rite.0005.c:0 "Boa sorte em sua missão."
 slavic_rite.0005.desc:0 "[methodius_scope.GetFirstName] está diante de mim, sozinho desta vez após o retorno de [methodius_scope.GetHerHis] de [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. Quando lhe pergunto sobre [cyril_scope.GetFirstName], a expressão de [methodius_scope.GetHerHis] se fecha.\n\n\"A boa notícia, misericordioso [ROOT.Char.GetTitleAsNameNoTooltip], é que [pope_scope.GetTitledFirstName] deu [pope_scope.GetHerHis] bênção para espalharmos a fé entre o povo de [ROOT.Char.GetCulture.GetNameNoTooltip] e por todo o seu reino, usando nossos próprios métodos e escrituras.\" Ele respira fundo. \"Mas, ai de mim, fui forçado a deixar meu irmão para trás. Farei o meu melhor para garantir que nossos esforços não sejam em vão. Que [ROOT.Char.GetFaith.HighGodName] nos ajude a todos.\""
 slavic_rite.0005.t:0 "Uma Jornada Agridoce"
 slavic_rite.0006.a.brothers_are_dead:0 "Não era para ser..."
 slavic_rite.0006.a.no_longer_christian:0 "Louvado seja [ROOT.Char.GetFaith.HighGodName]!"
 slavic_rite.0006.a.no_longer_king:0 "Não posso mais arcar com tais ambições."
 slavic_rite.0006.a.no_longer_slav:0 "O alfabeto glagolítico era um fardo para o meu povo."
 slavic_rite.0006.a.tooltip:0 "$story_slavic_rite$ para evangelizar o reino tornou-se obsoleto."
 slavic_rite.0006.desc.brothers_are_dead:0 "Com o falecimento dos irmãos, [Glossary('Cirilo e Metódio', 'CYRIL_AND_METHODIUS_GLOSS')], ninguém está suficientemente qualificado para continuar seu trabalho litúrgico. Devemos desenvolver nossas próprias abordagens para realizar a conversão completa do meu povo, se ainda o desejarmos."
 slavic_rite.0006.desc.no_longer_christian:0 "Eu vi o caminho para a glória. O que antes me motivava a trazer felicidade ao meu povo e à minha casa agora parece absolutamente insignificante. A rota para a qual estavam destinados era diferente da que eu desejava para eles. Felizmente, [ROOT.Char.GetFaith.HighGodName] nos mostrou o caminho reto."
 slavic_rite.0006.desc.no_longer_king:0 "Eventos recentes e a perda da minha posição poderosa me ensinaram a não assumir mais do que se pode suportar. No momento, não conseguimos sustentar a missão moraviana. Talvez, uma vez recuperados, possamos tentar novamente sob novos termos.\n\nAté lá, [ROOT.Char.GetPrimaryTitle.GetNameNoTier] precisa ser protegido para evitar o mesmo destino."
 slavic_rite.0006.desc.no_longer_slav:0 "Meus ancestrais provavelmente não estariam tão orgulhosos de quem me tornei.\n\nQue assim seja. Não cabe a eles decidir como governar [ROOT.Char.GetPrimaryTitle.GetNameNoTier], apenas a mim."
 slavic_rite.0006.t:0 "Fim da Missão Moraviana"
 slavic_rite.0007.a:0 "Estávamos destinados a trilhar o caminho consagrado."
 slavic_rite.0007.b:0 "Não há nada que meu povo não possa suportar."
 slavic_rite.0007.desc:0 "\"#italic ...para que sob o governo de [ROOT.Char.GetHerHis] possamos levar uma vida tranquila e pacífica \n em toda a piedade e dignidade.\n\nPois teu é o reino, o poder e a glória,\nagora e para todo o sempre, e por todas as idades. Amém.#!\"\n\nQuando [archdiocese_holder.GetTitledFirstName] conclui a oração, uma sensação de eterna bem-aventurança toma conta da minha alma. Nossa missão de fazer com que nossa própria tradição celestial alcance todos os cantos do meu reino provou ser triunfante. Que [ROOT.Char.GetFaith.HighGodName] abençoe minha casa, [Glossary( 'Cirilo e Metódio', 'CYRIL_AND_METHODIUS_GLOSS' )], e o bom povo de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 slavic_rite.0007.t:0 "Um Reino Unido por [ROOT.Char.GetFaith.HighGodName]"
 slavic_rite.0010.a:0 "Vá embora e nunca mais retorne às minhas terras."
 slavic_rite.0010.b:0 "Nossos avisos anteriores não foram suficientes, pelo visto."
 slavic_rite.0010.c.failure:0 "[undercover_preacher.GetSheHe|U] não se deixa persuadir"
 slavic_rite.0010.c.success:0 "[undercover_preacher.GetSheHe|U] está ansioso para começar uma nova vida em sua corte"
 slavic_rite.0010.c:0 "Você não precisa enfrentar seus mestres desapontados."
 slavic_rite.0010.desc:0 "Escoltados pelo meu capelão, [court_chaplain.GetTitledFirstName], uma comitiva de pregadores de [undercover_preacher.GetCulture.GetNameNoTooltip] [undercover_preacher.Custom('MyPriestTitle')] e [undercover_preacher.GetHerHis] entra no meu salão com rostos descarados.\n\n\"Saudações, meu [ROOT.Char.GetTitleAsNameNoTooltip]. Encontramos esses infiltrados pregando as palavras de [ROOT.Char.GetFaith.HighGodName] sem honrar a autoridade de [court_chaplain_superior.GetTitledFirstName], ou de vocês.\" [court_chaplain.GetSheHe|U] faz uma pausa para observar o estrangeiro da cabeça aos pés, antes de encarar você mais uma vez.\n\n\"Dizem que eles andam espreitando nas sombras há um bom tempo, tentando persuadir e corromper as almas de seus súditos desavisados. Como você gostaria que os tratássemos?\""
 slavic_rite.0010.t:0 "Pregadores Clandestinos"
 slavic_rite.0020.a:0 "Quanto mais rápido livrarmos meu povo da impiedade, melhor."
 slavic_rite.0020.b:0 "Isto é tudo o que podemos poupar."
 slavic_rite.0020.c:0 "Absolutamente não."
 slavic_rite.0020.desc:0 "\"Eles não desejam tirar vantagem dos locais, meu [ROOT.Char.GetTitleAsNameNoTooltip]. Os pregadores itinerantes de [court_chaplain_superior.GetTitledFirstNamePossessive] são muito atenciosos nesse aspecto. Eles até queriam que eu falasse com você, o que foi uma humildade louvável. Uma confirmação tornaria todo o esforço muito mais fácil para eles e para o seu povo.\"\n\n[court_chaplain.GetTitledFirstNamePossessive] O esforço para me persuadir em nome de outros é notável, mas não posso deixar de me perguntar se [court_chaplain.GetSheHe] deveria focar esses talentos em ajudar meu povo a abandonar suas velhas tradições.\n\n\"Tenho a sensação de que esta é a maneira de [ROOT.Char.GetFaith.HighGodNamePossessive] lhe dar a oportunidade de se aproximar.\""
 slavic_rite.0020.t:0 "Subsídio para uma Causa Piedosa"
 slavic_rite.0030.a:0 "O [visiting_byzantine_clergy.GetCulture.GetNameNoTooltip] [visiting_byzantine_clergy.Custom('MyPriestTitle')] faz muito sentido."
 slavic_rite.0030.b:0 "Há algo de intrigante no argumento de [visiting_carolingian_clergy.GetNamePossessiveNoTooltip]."
 slavic_rite.0030.c:0 "Conhecimento é conhecimento, concordo com ambos."
 slavic_rite.0030.d:0 "Nossos caminhos são superiores a esses princípios antigos."
 slavic_rite.0030.desc:0 "Uma brisa suave balança as folhas no jardim do mosteiro enquanto dois clérigos convidados de [court_chaplain_superior.GetTitledFirstName] se encaram entre grupos em debate. Um está vestido com a tradição oriental, o outro comanda a autoridade ocidental. Suas vozes inicialmente humildes tornam-se confiantes e apaixonadas.\n\nEles discutem muitos tópicos litúrgicos, passando de debates acadêmicos a argumentos fascinantes enquanto me interesso cada vez mais por cada frase.\n\nIsso é mais do que uma conversa; simboliza uma disputa entre dois mundos, sugerindo uma harmonia frágil ou uma divisão mais profunda."
 slavic_rite.0030.t:0 "Um Debate do Oriente e do Ocidente"
 slavic_rite.1000.a:0 "Chegamos até aqui. Estou contando com eles."
 slavic_rite.1000.a_tt:0 "[Glossary( 'Cirilo e Metódio', 'CYRIL_AND_METHODIUS_GLOSS' )], os irmãos que criaram uma nova escrita eslava, em breve o informarão sobre seu próximo passo para espalhar um novo [court_chaplain.GetFaith.GetAdjective] [rite|E] em seu reino."
 slavic_rite.1000.b:0 "É melhor abandonar este curso do que sentir a ira de [GetRiteByKey('carolingian_christianity').GetAdherentNameNoTooltip]."
 slavic_rite.1000.b_tt:0 "Todos os esforços para desenvolver uma escrita local e estabelecer um novo [rite|E] por [Glossary('Cirilo e Metódio', 'CYRIL_AND_METHODIUS_GLOSS')] foram abandonados."
 slavic_rite.1000.b_tt_2:0 "$story_slavic_rite$ [story_cycle|E] chega ao fim."
 slavic_rite.1000.desc:0 "\"Continue, irmão [greek_preacher.GetFirstName]\", meu [court_chaplain.GetActiveCouncilTask.GetPositionName] introduz o [greek_preacher.Custom('MyPriestTitle')] que é um seguidor do [GetRiteByKey('byzantine_rite').GetAdjective].\n\n\"Abençoado seja o seu reino, ó [ROOT.Char.GetTitleAsNameNoTooltip]. Meus irmãos estão progredindo bem em uma escrita para o seu povo. Infelizmente, trabalhamos sob a sombra e a ameaça de sacerdotes [GetRiteByKey('carolingian_christianity').GetAdherentName] que esperam reivindicar autoridade eclesiástica sobre suas terras. [Glossary('Cirilo e Metódio', 'CYRIL_AND_METHODIUS_GLOSS')] pediu-me para solicitar mais tempo para desenvolver uma estratégia para evitar conflitos e encontrar uma solução diplomática.\""
 slavic_rite.1000.t:0 "A Escrita Glagolítica"
 slavic_rite_ecclesiastical_title:0 "$d_et_archdiocese_prefix$ da Morávia"
 slavic_rite_ecclesiastical_title_creation_tooltip:0 "$slavic_rite_ecclesiastical_title$ é criado e [methodius_scope.GetFirstName] se torna seu primeiro [holder|E]"
 slavic_rite_ecclesiastical_title_name:0 "Morávia"
 slavic_rite_mass_conversion_tooltip:0 "Uma Conversão em Massa [great_project|E] está planejada para todos os [duchies|E] em [moravia_liege_scope.GetPrimaryTitle.GetNameNoTier] com o objetivo de converter seus [counties|E] para [methodius_scope.GetRite.GetName]"
 slavic_rite_moravian_mission_gift_received_tooltip:0 "Sua dádiva para [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] foi recebida com gratidão."
 slavic_rite_moravian_mission_gift_sent_tooltip:0 "Um pacote de presentes será enviado para [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. Os irmãos o informarão sobre o recebimento ao retornarem."
 slavic_rite_travel_toast_title:0 "Cirilo e Metódio iniciam sua jornada"
