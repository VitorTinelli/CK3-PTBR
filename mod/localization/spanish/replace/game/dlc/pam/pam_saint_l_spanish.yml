 pam_saint_events.0006.desc_relic:0 "Dos restos consagrados de [relic_saint.GetFirstName], [GetPlayer.Custom('PamConsecratedEnshrined')] dentro de [extract_site.GetName], extraímos uma relíquia sagrada: #EMP [relic_artifact.GetName]#!. Que ela abençoe os fiéis do meu reino por gerações."
