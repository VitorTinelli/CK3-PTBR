 pam_saint_events.0001.a.tt_saint:0 "Uma petição para reconhecer [saint_candidate.GetFirstName] como um [Concept('canonized','Saint')|E] sagrado, a ser consagrado em [consecration_province.GetName], foi enviada a [petition_recipient.GetTitledFirstName]. A resposta deles virá a seu tempo."
 pam_saint_events.0001.a.tt_va:0 "Uma petição para honrar [saint_candidate.GetFirstName] como [saint_candidate.Custom('PamVeneratedSaintOrAncestor')], a ser [saint_candidate.Custom('PamConsecratedEnshrined')] em [consecration_province.GetName], foi enviada a [petition_recipient.GetTitledFirstName]. A resposta deles virá a seu tempo."
 pam_saint_events.0001.a:0 "Então esperamos e rezamos."
 pam_saint_events.0001.desc:0 "A causa de [saint_candidate.GetFirstName] está pronta, e um lugar de honra em [consecration_province.GetName] aguarda seus restos abençoados.\n\nAgora o assunto está fora de minhas mãos: uma petição viaja até [petition_recipient.GetTitledFirstName], e só posso rezar para que o julgamento seja favorável."
 pam_saint_events.0001.t:0 "A Petição Parte"
 pam_saint_events.0002.a.dynasty_opinion_tt:0 "[canonizer.GetShortUINamePossessive] [canonizer.GetFaith.GetAdherentName] membros da [Concept('dynasty','dynasty')|E] ganham #P 10#! [Concept('opinion','Opinion')|E] de você por 20 anos"
 pam_saint_events.0002.a:0 "[saint_candidate.GetFirstName] é verdadeiramente digno."
 pam_saint_events.0002.b.dynasty_opinion_tt:0 "[canonizer.GetShortUINamePossessive] [canonizer.GetFaith.GetAdherentName] membros da [Concept('dynasty','dynasty')|E] perdem #N 10#! [Concept('opinion','Opinion')|E] de você por 20 anos"
 pam_saint_events.0002.b:0 "Não aprovaremos."
 pam_saint_events.0002.desc.traits_1:0 "\n\nEm vida, [saint_candidate.GetFirstNameNoTooltip] foi [saint_candidate.GetWomanMan] conhecido por ser [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l]."
 pam_saint_events.0002.desc.traits_2:0 "\n\nEm vida, [saint_candidate.GetFirstNameNoTooltip] foi [saint_candidate.GetWomanMan] conhecido como [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l] e [pam_saint_ptrait_2.GetNameNoTooltip( saint_candidate.Self )|l]."
 pam_saint_events.0002.desc.traits_3:0 "\n\nEm vida, [saint_candidate.GetFirstNameNoTooltip] foi [saint_candidate.GetWomanMan] conhecido como [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l], [pam_saint_ptrait_2.GetNameNoTooltip( saint_candidate.Self )|l] e [pam_saint_ptrait_3.GetNameNoTooltip( saint_candidate.Self )|l]."
 pam_saint_events.0002.desc.virtue_1:0 "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0002.desc.virtue_1_saint', 'pam_saint_events.0002.desc.virtue_1_va' )]"
 pam_saint_events.0002.desc.virtue_1_saint:0 "Uma luz cintilante emana desta alma; uma chama modesta, mas nem todo santo foi forjado em um fogo maior.\n\nO julgamento cabe a nós."
 pam_saint_events.0002.desc.virtue_1_va:0 "Uma luz cintilante emana desta alma; uma chama modesta, mas nem toda alma venerada foi forjada em um fogo maior.\n\nO julgamento cabe a nós."
 pam_saint_events.0002.desc.virtue_2:0 "As realizações desta alma para agradar [saint_candidate.GetFaith.HighGodName] não podiam ser diminuídas — a marca de uma graça evidente, embora imperfeita.\n\nO julgamento cabe a nós."
 pam_saint_events.0002.desc.virtue_3:0 "A virtude é a personificação desta alma; raro é o mortal que ostenta tanto do divino de maneira tão clara.\n\nO julgamento cabe a nós."
 pam_saint_events.0002.desc_saint:0 "[canonizer.GetTitledFirstName] nos suplica para incluir [saint_candidate.GetFirstName] entre os santos abençoados, consagrados dentro de [consecration_province.GetName]."
 pam_saint_events.0002.desc_va:0 "[canonizer.GetTitledFirstName] nos suplica para honrar [saint_candidate.GetFirstName] entre [saint_candidate.Custom('PamBlessedOnesOrAncestors')], [saint_candidate.Custom('PamConsecratedEnshrined')] dentro de [consecration_province.GetName]."
