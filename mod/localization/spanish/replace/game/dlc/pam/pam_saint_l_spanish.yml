 pam_saint_events.0003.desc_va:0 "Está feito. [saint_candidate.GetFirstName] é honrado entre [saint_candidate.Custom('PamBlessedOnesOrAncestors')], [saint_candidate.Custom('PamConsecratedEnshrined')] dentro de [consecration_province.GetName]. Que a luz de [saint_candidate.GetHerHis] abençoe nosso domínio por gerações."
