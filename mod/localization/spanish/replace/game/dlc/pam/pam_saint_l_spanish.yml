 pam_saint_events.0005.a:0 "Que seja feito com toda a reverência."
 pam_saint_events.0005.desc:0 "Em [extract_site.GetName], mãos reverentes dedicam-se ao seu trabalho solene, para que uma relíquia sagrada de [relic_saint.GetShortUIName] possa ser extraída de [relic_saint.GetHerHis] restos abençoados.\n\nPreparações estão em andamento para celebrar esta ocasião sagrada."
