 pam_saint_events.0007.desc:0 "Minhas viagens me trazem diante do local de descanso de [visited_saint.GetShortUIName], [visited_saint.Custom('PamVeneratedSaintOrAncestor')] da minha fé. O ar é denso de santidade, e ao redor do túmulo os fiéis ajoelham-se em oração silenciosa."
