 pam_harmonious_society_five_bonds_toast:0 "Os Cinco Laços"
 pam_harmonious_society_five_bonds_toast_desc:0 "Tudo o que uma sociedade é repousa sobre os Cinco Laços, e o cálculo dos seus próprios mudou."
 pam_holy_weapon_blessing_toast:0 "Uma Arma Sagrada Sangrada"
 pam_holy_weapon_blessing_toast_desc:0 "Outra vitória sobre um [religion|E] rival, conquistada com um [holy_relic|E] em punho. O [artifact|E] carrega sua bênção com ainda mais força por causa disso."
 pam_pentarchy_circuit_completed_toast:0 "[GetTenetType('tenet_pentarchy').GetName( pam_pentarchy_pilgrim.GetRite )]: Peregrino de Cada Sé"
 pam_pentarchy_circuit_completed_toast_desc:0 "Cada sé que sua fé reconhece o recebeu, e todas foram igualmente honradas"
 pam_pentarchy_circuit_entourage_tt:0 "Todos que viajam com você ganham #V 1#! ponto de [skill|E]"
 pam_pentarchy_see_visited_message:0 "[GetTenetType('tenet_pentarchy').GetName( pam_pentarchy_pilgrim.GetRite )]: Uma Sé Mantida"
 pam_pentarchy_see_visited_message_desc:0 "Outra das sés sagradas da sua fé o recebeu.\n\nVocê visitou [pam_pentarchy_pilgrim.MakeScope.Var('pam_pentarchy_sees_count').GetValue|0] de [pam_pentarchy_pilgrim.MakeScope.Var('pam_pentarchy_sees_total').GetValue|0] [holy_sites|E]."
 pam_tenet_events.0004.a.tt.consolidated:0 "O [diverged_rite.GetName] [rite|E] aproximou-se do [diverged_rite.GetFaith.GetMainRite.GetName] [mainline_rite|E], fazendo com que a [fervor_i][fervor|E] anual diminua mais devagar"
 pam_tenet_events.0004.a.tt.diverged:0 "O [diverged_rite.GetName] [rite|E] afastou-se ainda mais do [diverged_rite.GetFaith.GetMainRite.GetName] [mainline_rite|E], fazendo com que a [fervor_i][fervor|E] anual diminua mais rápido"
 pam_tenet_events.0004.a:0 "Que assim seja."
 pam_tenet_events.0004.desc.backward_doctrine:0 "Escrevo para informá-lo de que [diverged_rite.GetName] observa [diverged_added_doctrine.GetDescriptiveName( diverged_rite.GetFaith.Self )] a partir de hoje.\n\nCom isso, aproximamo-nos de [diverged_rite.GetFaith.GetMainRite.GetName]. E quando as seitas têm uma só mente, a fé [diverged_rite.GetFaith.GetAdjective] fortalece-se!"
 pam_tenet_events.0004.desc.backward_tenet:0 "Escrevo para informá-lo de que [diverged_rite.GetName] adotou [diverged_added_tenet.GetBaseName] como um de seus princípios.\n\nCom isso, aproximamo-nos de [diverged_rite.GetFaith.GetMainRite.GetName]. Quando seus ritos falam a uma só voz, a fé [diverged_rite.GetFaith.GetAdjective] floresce!"
 pam_tenet_events.0004.desc.forward_doctrine:0 "Escrevo para informá-lo de que [diverged_rite.GetName] agora observa formalmente [diverged_added_doctrine.GetDescriptiveName( diverged_rite.GetFaith.Self )].\n\nUm rito que guia bem seu povo fortalece a fé [diverged_rite.GetFaith.GetAdjective] como um todo. Isso não passa de simples sabedoria."
 pam_tenet_events.0004.desc.forward_tenet:0 "Escrevo para informá-lo de que [diverged_rite.GetName] adotou [diverged_added_tenet.GetBaseName] entre seus princípios.\n\nUm rito que guia seu povo com sabedoria fortalece toda a fé [diverged_rite.GetFaith.GetAdjective]. Esta é uma sabedoria simples."
 pam_tenet_events.0004.opening.hof:0 "Estimadíssimo [diverged_rite.GetFaith.GetReligiousHead.GetTitleAsNameNoTooltip],"
 pam_tenet_events.0004.opening.ruler:0 "[diverged_hor.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_tenet_events.0005.a:0 "Se o meu [redistributing_liege.GetTitleAsNameNoTooltip] consegue suportar, eu também consigo."
 pam_tenet_events.0005.b.tt:0 "Seus cofres permanecem como estão, e seus [counties|E] não recebem nada"
 pam_tenet_events.0005.b:0 "Minhas mãos estão cheias, e assim permanecerão."
 pam_tenet_events.0005.desc:0 "Abri mão de metade de minha riqueza em prol dos pobres, e sou mais rico por isso.\n\nExijo de você a mesma metade. Mãos vazias são perdoadas. Mãos cheias são lembradas."
 pam_tenet_events.0005.opening:0 "[redistributing_liege.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_tenet_events.0006.a:0 "Nada nestas páginas está acima de mim. Continue lendo."
 pam_tenet_events.0006.b:0 "Vá até onde a lâmpada queima, e não mais além."
 pam_tenet_events.0006.desc_alone:0 "\n\nNem uma só alma entre meus cortesãos sentar-se-á comigo sobre estas páginas. Encaro seus conteúdos sozinho e desaconselhado."
 pam_tenet_events.0006.desc_intro:0 "Os livros sem marcação estão espalhados na minha mesa, seus diagramas expostos, seus nomes impróprios para qualquer boca pronunciar. Este é o saber contra o qual os modestamente devotos são avisados, e comprei para mim uma noite com ele."
 pam_tenet_events.0006.desc_witness:0 "\n\n[mystic_witness.GetTitledFirstName] detém-se no umbral e recusa-se a cruzar. \"Estas coisas são trancadas e sobre elas se reza por uma razão\", [mystic_witness.GetSheHe] murmura. \"Uma vez que você olhe, não poderá desaprender o que está lá.\""
 pam_tenet_events.0006.t:0 "Os Ensinamentos Ocultos"
 pam_tenet_events.0007.a:0 "Empreste-me a sabedoria que o guiou."
 pam_tenet_events.0007.b:0 "Conceda-me paz suficiente para encarar a alvorada."
 pam_tenet_events.0007.desc:0 "As portas estão trancadas e as lâmpadas apagadas, o mundo encolhendo até que restem apenas uma única chama vacilante e a fumaça rodopiando espessa ao meu redor. Já consigo sentir a presença de [guiding_forebear.GetTitledFirstName] contorcendo-se por trás do véu fumarento.\n\nNa escuridão, exponho os graves problemas que não ouso nomear à luz do dia. Os espíritos não respondem como os mortais, mas através de sussurros sepulcrais, do estalido de uma chama inconstante, do roçar furtivo de um ar invisível e dos espectros agitando-se na fumaça.\n\nDesesperado por orientação, meus olhos esforçam-se em cada sinal pela resposta de que mais preciso."
 pam_tenet_events.0007.t:0 "Conselho dos Mortos"
 pam_tenet_events.0008.a:0 "Esse era eu: [remembered_trait_1.GetNameNoTooltip( ROOT.Char )|l], da cabeça aos pés."
 pam_tenet_events.0008.b:0 "Desperto com [remembered_trait_2.GetNameNoTooltip( ROOT.Char )|l] no coração, e reconheço isso como minha própria essência."
 pam_tenet_events.0008.c:0 "Sim. Eu era [remembered_trait_3.GetNameNoTooltip( ROOT.Char )|l] então, e posso sê-lo novamente."
 pam_tenet_events.0008.d:0 "Essas vidas já se foram. Continuo sendo eu mesmo."
 pam_tenet_events.0008.desc:0 "O selo, a taça, o anel tirados da mão do meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('remembered_forebear'))] [remembered_forebear.GetTitledFirstName]. Eu os arrumei e sento-me com eles; lentamente, deixam de parecer emprestados.\n\nNada aparece. Nada é dito. Não estão me falando sobre [remembered_forebear.GetHerHim]; estão me lembrando de mim mesmo, de uma natureza que deixei de lado com aquela vida e nunca perdi."
 pam_tenet_events.0008.t:0 "Um Eu Lembrado"
 pam_tenet_events.0009.a:0 "Arrombe as trancas. Que todos levem sua parte."
 pam_tenet_events.0009.b.tt:0 "Você compartilha apenas o que é seu. Seus [vassals|E] mantêm seus cofres fechados e não guardam ressentimento por isso"
 pam_tenet_events.0009.b:0 "Um momento. Apenas a minha própria riqueza deve ir."
 pam_tenet_events.0009.desc_alone:0 " Estou sozinho nisso, e os administradores recuam em silêncio para ver como isso termina."
 pam_tenet_events.0009.desc_end:0 "\n\nPosso destrancar meu baú com um giro de pulso. O restante terei de tomar."
 pam_tenet_events.0009.desc_intro:0 "Os baús foram arrastados para o pátio, e as chaves estão em minha mão."
 pam_tenet_events.0009.desc_witness:0 " [redistribution_witness.GetTitledFirstName] caminha pela fileira.\n\n\"Um [ROOT.Char.GetTitleAsNameNoTooltip] generoso ainda é um [ROOT.Char.GetTitleAsNameNoTooltip]\", diz [redistribution_witness.GetSheHe]. \"Ninguém se salva dando bem, apenas não tendo mais nada para guardar.\""
 pam_tenet_events.0009.flavor:0 "Seus vassalos com moedas de sobra serão compelidos a abrir seus cofres, seus condados crescerão mais livres e difíceis de comandar, e aqueles que não compartilham este princípio ressentir-se-ão com você por isso."
 pam_tenet_events.0009.t:0 "Abrir os Baús"
 pam_tenet_events.0010.a:0 "O flagelo, até que minha mente se acalme."
 pam_tenet_events.0010.b:0 "Que eu me aparte da visão do mundo."
 pam_tenet_events.0010.c:0 "Tirai o apetite, e o pecado se vai com ele."
 pam_tenet_events.0010.desc_alone:0 "\n\nNenhuma alma erguerá a lâmpada por mim esta noite. O que retiro daquela mesa, retiro sem testemunhas."
 pam_tenet_events.0010.desc_intro:0 "O flagelo permanece em seu lugar habitual. Esta noite ele tem companhia: os ferros e a faca curta, trazidos em segredo, e por mim sozinho."
 pam_tenet_events.0010.t:0 "O que a Carne Deve"
