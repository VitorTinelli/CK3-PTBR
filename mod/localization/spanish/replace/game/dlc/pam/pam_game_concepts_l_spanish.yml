l_spanish:
 CARDINAL_BENEFICES_GLOSS:0 "Os benefício eram propriedades locais ou remotas, cargos ou receitas papais compartilhadas que podiam ser concedidas a um membro do clero #i in commendam#! (em confiança). Eles geravam renda, geralmente sem responsabilidades administrativas diretas."
 clerical_electors:0 "Eleitores Clericais"
 game_concept_agnostic_knowledge:0 "Conhecimento"
 game_concept_antipope:0 "Antipapa"
 game_concept_antipope_desc:0 "$game_concept_challenger_hof_desc$"
 game_concept_archabbot:0 "Abade"
 game_concept_archabbot_desc:0 "Um $game_concept_archabbot$ é o [ruler|E] de uma [monastic_holy_order|E] e o [head_of_rite|E] da [rite|E] que sua ordem defende, guiando seus membros no estudo, na contemplação e na propagação de seus [core_tenets|E].\n\nUma ordem pode ser apoiada por um [monastic_order_patron|E], cuja [monastic_order_patronage|E] lhe concede riqueza e influência.\n\nApós a morte de um $game_concept_archabbot$, seus [titles|E] passam para um sucessor, geralmente seu [courtier|E] com maior [learning|E]."
 game_concept_archbishop:0 "Arcebispo"
 game_concept_archbishop_desc:0 "Um Arcebispo é o detentor cristão de uma [archdiocese|E], um [clerical_title|E] de nível de ducado cujo [clerical_region|E] pode abranger vários [realms|E].\n\nComo [religious_superior|E] dos [bishops|E] e [clergy|E] menores dentro dessa região, um Arcebispo está acima de um [bishop|E] comum e responde diretamente ao [head_of_faith|E]."
 game_concept_archbishop_possessive:0 "do Arcebispo"
 game_concept_archbishops:0 "Arcebispos"
 game_concept_archbishops_possessive:0 "dos Arcebispos"
 game_concept_archdiocese:0 "Arquidiocese"
 game_concept_archdiocese_desc:0 "Uma Arquidiocese é a forma [christian|E] de um [clerical_region|E], um domínio eclesiástico detido por um [archbishop|E] através de seu [clerical_title|E] e sediado em um [county|E] capital, onde uma [grand_cathedral|E] pode ser erguida.\n\nUm [christian|E] [ruler|E] responde em questões espirituais ao [archbishop|E] da Arquidiocese que contém seu [capital|E] [county|E], e o território sujeito às Arquidioceses constitui coletivamente [the_christian_church|E] [situation|E]."
 game_concept_archdioceses:0 "Arquidioceses"
 game_concept_bishop:0 "Bispo"
 game_concept_bishop_desc:0 "Um $game_concept_bishop$ pertence ao [clergy|E] de uma [faith|E] cristã e possui ou arrenda [temple_holdings|E].\n\nUm Bispo reside em uma [archdiocese|E] e responde ao [archbishop|E] local como [religious_superior|E]. Um Bispo sem terras com títulos [leased|E] serve sob um [liege|E] secular; um Bispo com [landed|E] [titles|E] não arrendados pode governar como um [ecclesiastical|E] [ruler|E]."
 game_concept_bishop_possessive:0 "do Bispo"
 game_concept_bishops:0 "Bispos"
 game_concept_bishops_possessive:0 "dos Bispos"
 game_concept_bull:0 "Bula"
 game_concept_bulls:0 "Bulas"
 game_concept_canonization:0 "Canonização"
 game_concept_canonization_desc:0 "$game_concept_canonized_desc$"
 game_concept_canonized:0 "Canonizado"
 game_concept_canonized_desc:0 "Um [character|E] que, após a morte, foi declarado santo ou o equivalente de outra fé, como um Wali ou um ancestral venerado, obtendo o [GetTrait('saint').GetName( GetNullCharacter )] [trait|E].\n\nUma vida virtuosa pode terminar em $game_concept_canonization$: é solicitada por meio de uma [decision|E], pode exigir a bênção do [head_of_faith|E] e é selada pela consagração do local de sepultamento do santo. Seu local de descanso atrai viajantes piedosos, e seus restos mortais podem render [holy_relics|E]."
 game_concept_cardinal:0 "Cardeal"
 game_concept_cardinal_desc:0 "Um [clergy|e] membro selecionado pelo Papa para ajudar a exercer ainda mais a vontade da [the_christian_church|e]. Todos os membros do [college_of_cardinals|E] são candidatos e eleitores ao Papado e possuem uma [papabile_score|E]."
 game_concept_cardinal_possessive:0 "do Cardeal"
 game_concept_cardinalate:0 "Cardinalato"
 game_concept_cardinalates:0 "Cardinalatos"
 game_concept_cardinals:0 "Cardeais"
 game_concept_cardinals_possessive:0 "dos Cardeais"
 game_concept_cathedral_complex:0 "Complexo da Catedral"
 game_concept_cathedral_complex_building:0 "Edifício de $game_concept_cathedral_complex$"
 game_concept_cathedral_complex_building_desc:0 "$game_concept_ecclesiastical_estate_building_desc$"
 game_concept_cathedral_complex_buildings:0 "Edifícios de $game_concept_cathedral_complex$"
 game_concept_cathedral_complex_desc:0 "$game_concept_ecclesiastical_estate_desc$"
 game_concept_cathedral_complexes:0 "Complexos de Catedral"
 game_concept_challenger_hof:0 "Líder da Fé Desafiante"
 game_concept_challenger_hof_desc:0 "Um $game_concept_challenger_hof$ é um [head_of_faith|E] rival erguido contra o [mainline_rite|E] $game_concept_head_of_faith$.\n\nUm [ruler|E] pode patrocinar um membro de seu [clergy|E] como $game_concept_challenger_hof$. Um [clergy|E] [ruler|E] ou um governante de um [faith|E] com um Líder da Fé Temporal pode declarar-se como um Desafiante.\n\nUm $game_concept_challenger_hof$ patrocinado assume o [rite|E] de seu patrocinador, torna-se o [external_clerical_puppet|E] desse patrocinador e deve a ele um [weak_hook|E].\n\nO $game_concept_mainline_rite$ $game_concept_head_of_faith$ não pode [excommunicate|E] ninguém que siga um $game_concept_challenger_hof$: o patrocinador e seus [vassals|E].\n\nTodos que seguem um $game_concept_challenger_hof$ trazem seus pedidos clericais para ele em vez do $game_concept_mainline_rite$ $game_concept_head_of_faith$, entre eles estes [interactions|E]:\n$EFFECT_LIST_BULLET$[petition_antipope_indulgences_interaction|E]\n$EFFECT_LIST_BULLET$[petition_antipope_gold_interaction|E]\n\nUm $game_concept_challenger_hof$ ou seu patrocinador pode usar o [pam_challenge_hof_cb|E] [casus_belli|E] contra o $game_concept_head_of_faith$ legítimo.\n\n[kings|E] rivais ou superiores da mesma [faith|E] podem, em vez disso, usar o [pam_antiking_cb|E] contra um patrocinador, depondo o pretendente rival."
 game_concept_christendom:0 "Cristandade"
 game_concept_christendom_desc:0 "$game_concept_christendom$ abrange os [realm|E]s de todos os [independent|E]s [christian|E] [ruler|E]s que são membros de [the_christian_church|E] [situation|E]."
 game_concept_christian:0 "Cristão"
 game_concept_christian_desc:0 "Um seguidor da [religion|E] cristã."
 game_concept_christian_possessive:0 "do Cristão"
 game_concept_christians:0 "Cristãos"
 game_concept_church_centralization:0 "Centralização da Igreja"
 game_concept_church_centralization_desc:0 "$game_concept_church_centralization$ representa o grau em que a Igreja adotou autoridade centralizada e estruturas financeiras. Uma centralização mais forte significa que mais renda flui para cima na hierarquia clerical.\n\nOs tipos são:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_minimal_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_mild_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_strong_centralization$"
 game_concept_church_obligations:0 "Obrigações da Igreja"
 game_concept_church_obligations_desc:0 "As Obrigações da Igreja representam as obrigações combinadas sobre a renda de [church_holding|E]. Essas obrigações são pagas ao [superior|E], [head_of_faith|E] e/ou ao [ruler|E] secular local. Exemplo de [church_centralization|E] e [secular_obligations|E]."
 game_concept_clerical_puppet:0 "Marionete de Sacerdote do Domínio"
 game_concept_clerical_puppet_desc:0 "Um [realm_priest|E] que é uma [puppet|E] de seu [liege|E].\n\nPor meio dele, seu Marionetista pode interferir nos assuntos da [faith|E]: peticionando ao [head_of_faith|E] por [clerical_titles|E] ou [excommunication|E], gerenciando [holy_sites|E], fundando um novo [rite|E] ou hospedando um [ecumenical_council|E]."
 game_concept_clerical_puppets:0 "Marionetes de Sacerdotes do Domínio"
 game_concept_clerical_region:0 "Região Clerical"
 game_concept_clerical_region_capital:0 "Capital da Região Clerical"
 game_concept_clerical_region_capital_desc:0 "A Capital da Região Clerical é o [county|E] sobre o qual um [clerical_region|E] foi fundado com um [ecclesiastical_estate|E], servindo como a sede do [clerical_title|E] que governa a região. Ao contrário de um [de_jure_capital|E], ela é fixa na região e não pode ser realocada."
 game_concept_clerical_region_capitals:0 "Capitais da Região Clerical"
 game_concept_clerical_region_desc:0 "Uma Região Clerical é uma região geográfica que cai sob a jurisdição de um [clerical_title|E]. Qualquer membro do clero dentro da região será um [subordinate|E] para o detentor do [title|E] associado à região.\n\nUm [ruler|E] pertence à Região Clerical que contém seu [capital|E] [county|E], e uma nova região é fundada sobre o [capital|E] do [primary_title|E] de seu fundador. A região pode abranger vários [realms|E] e ter subordinados que estão em domínios diferentes.\n\nUm $game_concept_ruler$ só pode possuir um $game_concept_clerical_region$ por vez. Se receber uma nova Região, o Governante perde todas as suas terras mantidas na anterior."
 game_concept_clerical_region_possessive:0 "da Região Clerical"
 game_concept_clerical_regions:0 "Regiões Clericais"
 game_concept_clerical_regions_possessive:0 "das Regiões Clericais"
 game_concept_clerical_title:0 "Título Clerical"
 game_concept_clerical_title_desc:0 "Um $game_concept_clerical_title$ é um [ecclesiastical|E] [title|E] do [clergy|E] que governa um [clerical_region|E] dentro de uma [faith|E]. Entre as fés [christian|E], esta é uma [archdiocese|E].\n\nO detentor é o [religious_superior|E] do [clergy|E] nessa região e geralmente é nomeado pelo [head_of_faith|E]."
 game_concept_clerical_titles:0 "Títulos Clericais"
 game_concept_college_of_cardinals:0 "Colégio dos Cardeais"
 game_concept_college_of_cardinals_desc:0 "O $game_concept_college_of_cardinals$ é o corpo de [cardinals|E] que assessoram o Papa e elegem o próximo [head_of_faith|E] de [the_christian_church|E].\n\nTodo [cardinal|E] é tanto um candidato quanto um eleitor para o Papado."
 game_concept_core_tenet_status:0 "Central"
 game_concept_core_tenet_status_desc:0 "Um $game_concept_core_tenet_status$ [tenet_status|E] significa que o [rite|E] está promovendo ativamente este [core_tenet|E] ou [doctrine|E] como uma de suas práticas definidoras. Todos os [followers|E] da $game_concept_rite$ estão sujeitos aos seus efeitos."
 game_concept_divergence:0 "Divergência"
 game_concept_divergence_desc:0 "$game_concept_rite_divergence_desc$"
 game_concept_divergence_i:0 "@divergence_icon!"
 game_concept_doctrine_knowledge:0 "Conhecimento da Doutrina"
 game_concept_doctrine_knowledge_desc:0 "$game_concept_tenet_knowledge_desc$"
 game_concept_doctrine_status_desc:0 "$game_concept_tenet_status_desc$"
 game_concept_ec_conservative:0 "$game_concept_ecumenical_council_conservative$"
 game_concept_ec_conservatives:0 "$game_concept_ecumenical_council_conservatives$"
 game_concept_ec_innovator:0 "$game_concept_ecumenical_council_innovator$"
 game_concept_ec_innovators:0 "$game_concept_ecumenical_council_innovators$"
 game_concept_ecclesiastic_grant_claim_interaction:0 "$ecclesiastic_grant_claim_interaction$"
 game_concept_ecclesiastic_grant_claim_interaction_desc:0 "Uma [interaction|E] que fornece uma [claim|E] para um [title|E] pertencente a outro [ruler|E]. Requer a aceitação de um [ecclesiastical|E] ou [theocratic|E] [character|E] relevante."
 game_concept_ecclesiastic_incite_claim_war_interaction:0 "$ecclesiastic_incite_claim_war_interaction$"
 game_concept_ecclesiastic_incite_claim_war_interaction_desc:0 "Uma [interaction|E] através da qual [ecclesiastical|E] [rulers|E] podem fazer governantes seculares da mesma [faith|E] declararem [war|E] para pressionar uma [claim|E] sobre um [ruler|E] secular."
 game_concept_ecclesiastic_incite_holy_war_interaction:0 "$ecclesiastic_incite_holy_war_interaction$"
 game_concept_ecclesiastic_incite_holy_war_interaction_desc:0 "Uma [interaction|E] através da qual [ecclesiastical|E] [rulers|E] podem fazer governantes seculares da mesma [faith|E] declararem [holy_war|E] contra governantes de fé hostil."
 game_concept_ecclesiastic_transfer_land_interaction:0 "$ecclesiastic_transfer_land_interaction$"
 game_concept_ecclesiastic_transfer_land_interaction_desc:0 "Uma [interaction|E] que facilita a transferência pacífica de um [title|E] ou [vassal|E] entre dois [rulers|E], contando com a aceitação do [ruler|E] alvo e um intercessor secundário.\n\nA recusa geralmente custará ao destinatário [piety|E] e [legitimacy|E], bem como um custo adicional selecionado pelo ator como método de compelir a aceitação.\n\nO intercessor, um governante [ecclesiastical|E] ou [theocratic|E] relevante, pode tanto proibir que esta interação ocorra quanto, com o [GetLaw('church_authority_3').GetName] [law|E], forçar sua aceitação."
 game_concept_ecclesiastical:0 "Eclesiástico"
 game_concept_ecclesiastical_desc:0 "$game_concept_ecclesiastical$ é uma [theocratic|E] [government_form|E] mantida por [christian|E] [clergy|E] [rulers|E], como [bishops|E] e [archbishops|E].\n\nA maioria dos governantes eclesiásticos são vassalos [vassals|E] que [lease|E] seus [temple_holdings|E] de um [liege|E] secular e respondem ao [head_of_faith|E], embora um [bishop|E] que possua [landed|E] [titles|E] que não estejam [leased|E] possa governar como um [independent|E] governante [ruler|E] por direito próprio. O poder que tal governante detém sobre seus próprios [vassals|E] é determinado por sua [church_authority|E]."
 game_concept_ecclesiastical_domicile:0 "$game_concept_ecclesiastical_estate$"
 game_concept_ecclesiastical_domicile_building:0 "$game_concept_ecclesiastical_estate_building$"
 game_concept_ecclesiastical_domicile_building_desc:0 "$game_concept_ecclesiastical_estate_building_desc$"
 game_concept_ecclesiastical_domicile_buildings:0 "$game_concept_ecclesiastical_estate_buildings$"
 game_concept_ecclesiastical_domicile_desc:0 "$game_concept_ecclesiastical_estate_desc$"
 game_concept_ecclesiastical_domiciles:0 "$game_concept_ecclesiastical_estates$"
 game_concept_ecclesiastical_estate:0 "Propriedade Eclesiástica"
 game_concept_ecclesiastical_estate_building:0 "Edifício de Propriedade Eclesiástica"
 game_concept_ecclesiastical_estate_building_desc:0 "$game_concept_ecclesiastical_estate_buildings$ são melhorias únicas e persistentes em um [ecclesiastical_estate|E].\n\nUma grande variedade de estruturas está disponível para construção e pode ser construída pelo detentor para gerar renda privada, [piety|E], [spiritual_fulfillment|E] e obter acesso a vários [decisions|E], [interactions|E] e muito mais."
 game_concept_ecclesiastical_estate_buildings:0 "Edifícios de Propriedade Eclesiástica"
 game_concept_ecclesiastical_estate_desc:0 "Uma $game_concept_ecclesiastical_estate$ — ou $game_concept_cathedral_complex$ — é um tipo de [domicile|E] anexada a um [clerical_title|E], representando as posses de terras íntimas de um [archbishop|E] e sua sé. [clergy|E] inferiores em um [GetGovernment('ecclesiastical_government').GetName] devem ascender a tal [title|E] antes de receberem uma.\n\n[ecclesiastical_estate_buildings|E] podem ser construídos aqui para expandir a riqueza, [piety|E] e [spiritual_fulfillment|E] do detentor. A $game_concept_ecclesiastical_estate$ não muda de localização e será herdada pelo próximo [holder|E] do título."
 game_concept_ecclesiastical_estates:0 "Propriedades Eclesiásticas"
 game_concept_ecclesiastical_government:0 "Governo Eclesiástico"
 game_concept_ecclesiastical_i:0 "@government_type_ecclesiastical!"
 game_concept_ecumenical_council:0 "Concílio Ecumênico"
 game_concept_ecumenical_council_conservative:0 "Conservador"
 game_concept_ecumenical_council_conservative_desc:0 "Os conservadores são [activity_guests_short|E] no [ecumenical_council|E] [activity|E] votando contra o [activity_host_short|E] em suas sugestões para alterar o status de um [core_tenet|E] ou de uma [doctrine|E].\n\nEles se opõem diretamente aos [ec_innovators|E], convidados que estão tentando promulgar as mudanças.$game_concept_ecumenical_council_groups_help$"
 game_concept_ecumenical_council_conservatives:0 "Conservadores"
 game_concept_ecumenical_council_desc:0 "Um $game_concept_ecumenical_council$ é um [activity|E] no qual os principais [clergy|E] de toda a Cristandade se reunem para definir o futuro da Igreja.\n\nAo longo de debates sucessivos, os prelados reunidos decidem sobre o [tenet_status|E] de [core_tenets|E] contestados — declarando-os [permitted_tenet_status|E] ou [prohibited_tenet_status|E], ou elevando-os a [core_tenet_status|E] — e definem as [doctrines|E] da [faith|E]."
 game_concept_ecumenical_council_groups_help:0 "\n\n#help Os [characters|E] autorizados a votar são: [clergy|E], [rulers|E] com [clerical_puppet|E] e o [activity_host|E]#!"
 game_concept_ecumenical_council_innovator:0 "Inovador"
 game_concept_ecumenical_council_innovator_desc:0 "Os inovadores são [activity_guests_short|E] no [ecumenical_council|E] [activity|E] votando com o [activity_host_short|E] em suas sugestões para alterar o status de um [core_tenet|E] ou de uma [doctrine|E].\n\nEles se opõem diretamente aos [ec_conservatives|E], convidados que votam contra quaisquer mudanças, desejando preservar o status quo.$game_concept_ecumenical_council_groups_help$"
 game_concept_ecumenical_council_innovators:0 "Inovadores"
 game_concept_ecumenical_councils:0 "Concílios Ecumênicos"
 game_concept_ecumenical_councils_desc:0 "$game_concept_ecumenical_council_desc$"
 game_concept_enshrine:0 "Consagrar"
 game_concept_enshrined:0 "Consagrado"
 game_concept_enshrined_desc:0 "Um [holy_relic|E] consagrado em um [holy_site|E] ativa bônus de local sagrado e melhora os bônus concedidos, escalonados pelos níveis totais de [rarity|E] de todos os artefatos consagrados.\n\nUm artefato consagrado não pertence mais a um personagem, mas pode ser manuseado pelo [holder|E], [top_liege|E] ou detentor da [clerical_region|E] do local sagrado. O artefato não sofrerá mais decaimento. Você só pode consagrar relíquias sagradas da sua própria [faith|E]; relíquias sagradas consagradas de outras fés não fornecerão benefícios.\n\nPode haver recompensas ou custos associados à consagração ou remoção de um artefato consagrado."
 game_concept_external_clerical_puppet:0 "Marionete de Sacerdote Gobernante"
 game_concept_external_clerical_puppet_desc:0 "Um membro poderoso do [clergy|E] — um [archbishop|E] ou até mesmo o [head_of_faith|E] — que se tornou a [puppet|E] de outro [ruler|E].\n\nQuanto mais poderoso o clérigo, maior o alcance: um Líder da Fé fantoche pode [excommunicate|E] seus inimigos, nomear [cardinals|E], conceder uma [pressed_claim|E] ou incitar uma [holy_war|E] em seu nome."
 game_concept_external_clerical_puppets:0 "Marionetes de Sacerdotes Gobernante"
 game_concept_external_ruler_puppet:0 "Marionete de Gobernante Secular"
 game_concept_external_ruler_puppet_desc:0 "Um [ruler|E] não pertencente ao [clergy|E] que se tornou [puppet|E] de outro [character|E].\n\nPor meio desta marionete, você pode interferir nos assuntos de outros [realms|E], por exemplo, usando [schemes|E] ou [imprisonment|E].\n\n\nAdquirir uma marionete deste tipo requer a interação #V $make_external_ruler_puppet_interaction$#! [interaction|E], que é desbloqueada quando pelo menos uma destas condições for verdadeira:\n$BULLET_WITH_TAB$Você é um [clergy|E] [vassal|E] do alvo\n$BULLET_WITH_TAB$Você é um [GetTrait('seducer').GetName( GetNullCharacter )] e o alvo é seu [lover|E], ou sua [soulmate|E] se o alvo for de categoria de [king|E] ou superior\n$BULLET_WITH_TAB$Você é um [GetTrait('torturer').GetName( GetNullCharacter )] e mantém o alvo em sua [dungeon|E]\n$BULLET_WITH_TAB$Você é [GetTrait('family_first').GetName( GetNullCharacter )] e o alvo é sua [close_family|E]\n$BULLET_WITH_TAB$Você é um [GetTrait('diplomat').GetName( GetNullCharacter )] e o alvo é um [independent_ruler|E]\n$BULLET_WITH_TAB$Você é um [GetTrait('gallant').GetName( GetNullCharacter )] e o alvo é seu [spouse|E]\n$BULLET_WITH_TAB$Você é um [diarch|E] do alvo em uma [entrenched_regency|E]"
 game_concept_external_ruler_puppets:0 "Marionetes de Gobernante Secular"
 game_concept_fixed_obligations:0 "Obrigações Fixas"
 game_concept_fulfillment:0 "Plenitude"
 game_concept_grand_cathedral:0 "Grande Catedral"
 game_concept_grand_cathedral_desc:0 "Uma Grande Catedral é um [great_building|E] erguido por meio de um [great_project|E] na capital de um [archdiocese|E], a sede de seu [archbishop|E].\n\nErguer a primeira Catedral é um ato monumental de devoção: seu fundador ganha duradouras [piety|E], [legitimacy|E] e [spiritual_fulfillment|E], um espaço de [personal_tenet|E] adicional e um bônus permanente para a [opinion|E] da mesma [faith|E]. Uma vez erguida, ela atrai peregrinos cristãos de toda a [christendom|E], expande o [cathedral_complex|E] do detentor e pode posteriormente ser ampliada em uma [GetBuilding('great_project_cathedral_02').GetName|V] ou [GetBuilding('great_project_cathedral_03').GetName|V]."
 game_concept_grand_cathedrals:0 "Grandes Catedrais"
 game_concept_head_of_rite:0 "Líder do Rito"
 game_concept_head_of_rite_desc:0 "O principal [character|E] de um [rite|E]: o [head_of_faith|E] se o seguir; caso contrário, o detentor da [clerical_region|E] onde o rito tem sua maior adesão e, na falta disso, o [ruler|E] que governa a maioria dos [counties|E] [rite_possessive|E].\n\nApenas o $game_concept_head_of_rite$ pode editar seus [rite_possessive|E] [core_tenets|E] e [doctrines|E], e é ele quem fala por seu rebanho quando a igreja caminha rumo ao [schism|E]."
 game_concept_holy_relic:0 "Relíquia Sagrada"
 game_concept_holy_relic_desc:0 "Uma $game_concept_holy_relic$ é um [artifact|E] que possui significado religioso para uma [faith|E]. Uma $game_concept_holy_relic$ pode ser [enshrined|E] em um [holy_site|E] dessa fé para obter benefícios.\n\nAlguns artefatos são inerentemente sagrados para uma fé, mas os artefatos também podem ser [sanctified|E] para se tornarem uma relíquia sagrada."
 game_concept_holy_relics:0 "Relíquias Sagradas"
 game_concept_known_tenet_status:0 "Conhecido"
 game_concept_known_tenet_status_desc:0 "Um [tenet_status|E] $game_concept_known_tenet_status$ significa que o [rite|E] está ciente deste [core_tenet|E] ou [doctrine|E], mas não endossa nem proíbe sua prática. Ele pode ser considerado ao criar ou divergir o $game_concept_rite$, e pode ser elevado a um [tenet_status|E] superior."
 game_concept_lease_contract:0 "Contrato de Arrendamento"
 game_concept_lease_contract_desc:0 "As condições legais sob as quais um personagem está [leasing|E] um título. Também determina quem é seu [religious_superior|E]."
 game_concept_mainline_rite:0 "Rito Principal"
 game_concept_mainline_rite_desc:0 "O [rite|E] Principal representa o conjunto de crenças mais proeminente de uma [faith|E]. Um $game_concept_rite$ não principal é considerado [rite_divergent|E] deste $game_concept_rite$.\n\nQual $game_concept_rite$ é Principal depende de o $game_concept_faith$ ter um [head_of_faith|E].\n\nSe o $game_concept_faith$ tiver um $game_concept_head_of_faith$, o $game_concept_rite$ Principal é aquele que ele segue. Isso significa que ele pode mudar quando o sucessor de um $game_concept_rite$ diferente assumir o lugar, incluindo um potencial [challenger_hof|E].\n\nSem um $game_concept_head_of_faith$, qualquer $game_concept_rite$ que reúna mais [counties|E] de seguidores do que o Principal o suplanta, desde que possua pelo menos tantos [holy_sites|E] quanto o $game_concept_rite$ que tenta substituir."
 game_concept_mainline_rite_short:0 "Principal"
 game_concept_mainline_rites:0 "Ritos Principais"
 game_concept_mendicant:0 "Mendicante"
 game_concept_mild_centralization:0 "Centralização Suave"
 game_concept_military_holy_order:0 "Ordem Militar"
 game_concept_military_holy_order_desc:0 "Uma $game_concept_military_holy_order$ é um tipo de [holy_order|E] povoada por guerreiros jurados a defender e expandir as terras de sua [faith|E].\n\nGovernantes da mesma fé podem contratar a Ordem se estiverem em [war|E] com um [faith_hostile|L] ou [faith_evil|L] $game_concept_faith$, ao custo de [piety|E]. Uma vez terminada esta Guerra, a Ordem deixa de lutar por esse Governante.\n\nUm $game_concept_holy_order$ pode ter um [military_holy_order_patron|E], que não precisa pagar para contratar seus serviços."
 game_concept_military_holy_order_i:0 "@government_type_holy_order!"
 game_concept_military_holy_order_patron:0 "Patrono da Ordem Militar"
 game_concept_military_holy_order_patron_desc:0 "O $game_concept_holy_order_patron$ de uma [military_holy_order|E] é um [ruler|E] de [duke|E]-[title_tier|E] ou superior que compartilha sua [faith|E] e cuja [realm|E] contém sua Capital.\n\nO $game_concept_holy_order_patron$ pode convocar o apoio da $game_concept_holy_order$ contra inimigos religiosos gratuitamente, em vez de pagar [piety|E].\n\nO patrocínio pode ser perdido para [vassals|E] de [duke|E]-[title_tier|E] ou superior, se o controle da Capital da Ordem for cedido."
 game_concept_military_holy_order_patronage:0 "Patrocínio da Ordem Militar"
 game_concept_military_holy_order_patronize:0 "Patrocinar"
 game_concept_military_holy_order_possessive:0 "da Ordem Militar"
 game_concept_military_holy_orders:0 "Ordens Militares"
 game_concept_military_holy_orders_possessive:0 "das Ordens Militares"
 game_concept_minimal_centralization:0 "Centralização Mínima"
 game_concept_monastic:0 "Monástico"
 game_concept_monastic_holy_order:0 "Ordem Monástica"
 game_concept_monastic_holy_order_desc:0 "Uma Ordem Monástica é um tipo de [holy_order|E] dedicado à oração, ao aprendizado e à difusão de um único [core_tenet|E]. Ela pertence ao [rite|E] de seu fundador e defende um dos [rite_possessive|E] [core_tenets|E] dessa fé, espalhando a prática entre os fiéis.\n\nLiderada por um [archabbot|E], uma Ordem Monástica é sustentada pelas [temple_holdings|E] e pelo [gold|E] concedidos por seus [monastic_order_patrons|E]. Em troca, a Ordem fornece [spiritual_fulfillment|E] e [piety|E].\n\nQualquer [ruler|E] cuja [faith|E] permita o monaquismo pode estabelecer uma com a [decision|E] #high Fundar Ordem Monástica#!."
 game_concept_monastic_holy_order_i:0 "@government_type_monastic_holy_order!"
 game_concept_monastic_holy_order_possessive:0 "da Ordem Monástica"
 game_concept_monastic_holy_orders:0 "Ordens Monásticas"
 game_concept_monastic_holy_orders_possessive:0 "Ordens Monásticas"
 game_concept_monastic_order_patron:0 "Patrono de Ordem Monástica"
 game_concept_monastic_order_patron_desc:0 "Um Patrono de Ordem Monástica é um [ecclesiastical|E] ou [ruler|E] secular de [duchy|E] [title_tier|E] ou superior que sustenta uma [monastic_holy_order|E], mais frequentemente o governante que a fundou. Um patrono dota a ordem de riqueza mundana, arrendando-lhe [temple_holdings|E] e doando [gold|E] para os seus cofres.\n\nEm troca dessa generosidade, o patrono ganha [piety|E] e [spiritual_fulfillment|E]. Eles também podem assumir o controle do líder da Ordem e fazê-los executar interações [clerical|E] como um [puppet|E]."
 game_concept_monastic_order_patronage:0 "Patrocínio"
 game_concept_monastic_order_patronize:0 "Patrocinar"
 game_concept_monastic_order_patronized:0 "Patrocinado"
 game_concept_monastic_order_patrons:0 "Patronos de Ordens Monásticas"
 game_concept_pam_antiking_cb:0 "Depor Antipapa"
 game_concept_pam_antiking_cb_desc:0 "Um [casus_belli|E] disponível para [christian|E] [kings|E] e acima que nem patrocinam nem servem como [challenger_hof|E]. Movido contra um patrocinador [independent|E] de sua própria [faith|E] para depor seu $game_concept_challenger_hof$ e ganhar a gratidão do [head_of_faith|E] legítimo."
 game_concept_pam_challenge_hof_cb:0 "Desafiar Chefe da Fé"
 game_concept_pam_challenge_hof_cb_desc:0 "Um [casus_belli|E] usado por um [challenger_hof|E] ou seu patrocinador contra o [head_of_faith|E] legítimo de sua [faith|E]. A vitória instala o $game_concept_challenger_hof$ como $game_concept_head_of_faith$ e torna seu [rite|E] o [mainline_rite|E]. Um patrocinador que vence a guerra e supera em categoria o seu $game_concept_challenger_hof$ também o toma como [vassal|E]."
 game_concept_pam_shape_the_christian_church_decision:0 "$pam_shape_the_christian_church_decision$"
 game_concept_pam_shape_the_christian_church_decision_desc:0 "Uma [decision|E] disponível para prelados e governantes poderosos, empurrando [the_christian_church|E] para o capítulo de sua escolha."
 game_concept_papabile_score:0 "Pontuação Papável"
 game_concept_papabile_score_desc:0 "Todos os membros do [college_of_cardinals|E] possuem uma $game_concept_papabile_score$ que leva em conta suas [traits|E], [piety_level|E], [rite|E] e a [opinion|E] de outros cardeais.\n\n[cardinals|E] com a $game_concept_papabile_score$ mais alta provavelmente receberão mais votos durante uma eleição papal.\n\nA $game_concept_papabile_score$ pode ser aumentada através da #high $increase_papabile_score_interaction$#! [character_interaction|E] e da [GetDecisionWithKey('pam_promulgate_word_of_pious_deeds_decision').GetName] [decision|E]."
 game_concept_papabile_scores:0 "Pontuações Papáveis"
 game_concept_papal_bull:0 "Bula Papal"
 game_concept_papal_bull_desc:0 "Uma Bula Papal é um decreto solene do [head_of_faith|E] de uma [christian|E] [faith|E], apoiado pela autoridade de [the_christian_church|E].\n\nUm [head_of_faith|E] cristão com [church_authority|E] suficiente pode proclamar uma Bula através da [GetDecisionWithKey('enact_a_bull_decision').GetName] [decision|E], gastando [piety|E] para:\n\n$EFFECT_LIST_BULLET$Conocar uma [great_holy_war|E]\n$EFFECT_LIST_BULLET$Denunciar um [rite|E] como uma [heresy|E]\n$EFFECT_LIST_BULLET$Declarar um [core_tenet|E] [permitted_tenet_status|E] ou [prohibited_tenet_status|E]"
 game_concept_papal_bulls:0 "Bulas Papais"
 game_concept_permit_tenet_status:0 "Permitir"
 game_concept_permitted_tenet_status:0 "Permitido"
 game_concept_permitted_tenet_status_desc:0 "Um $game_concept_permitted_tenet_status$ [tenet_status|E] significa que o [rite|E] aprova este [core_tenet|E] ou [doctrine|E] sem promovê-lo ativamente. Um [character|E] do $game_concept_rite$ pode adotar o $game_concept_core_tenet$ como um [personal_tenet|E] sem penalidade espiritual."
 game_concept_personal_obligations:0 "Obrigações Pessoais"
 game_concept_personal_tenet:0 "Princípio Pessoal"
 game_concept_personal_tenet_desc:0 "Um $game_concept_personal_tenet$ é um [core_tenet|E] que um [ruler|E] adota como parte central de sua espiritualidade.\n\nAdotar um $game_concept_personal_tenet$ que seja [core_tenet_status|E] ou tenha sido [permitted_tenet_status|E] pelo [faith|E] rende [spiritual_fulfillment|E], enquanto assumir um [prohibited_tenet_status|E] resultará em um [secret|E]. $game_concept_personal_tenets$ também fornecem efeitos adicionais e desbloqueiam mecânicas especiais.\n\nO número de $game_concept_personal_tenets$ aos quais um personagem pode aderir é afetado por seu [piety_level|E] e pelo [GetTrait('theologian').GetName( GetNullCharacter )] [trait|E]."
 game_concept_personal_tenets:0 "Princípios Pessoais"
 game_concept_personal_tenets_desc:0 "$game_concept_personal_tenet_desc$"
 game_concept_petition_antipope_gold_interaction:0 "Peticionar Ouro ao Antipapa"
 game_concept_petition_antipope_gold_interaction_desc:0 "Uma [interaction|E] disponível para qualquer pessoa que siga um [challenger_hof|E]. Solicite [gold|E] ao seu $game_concept_antipope$. O patrocínio deles é aceito automaticamente."
 game_concept_petition_antipope_indulgences_interaction:0 "Buscar Indulgência do Antipapa"
 game_concept_petition_antipope_indulgences_interaction_desc:0 "Uma [interaction|E] disponível para qualquer pessoa que siga um [challenger_hof|E]. Pague [gold|E] ao seu $game_concept_antipope$ por perdão e [piety|E], contornando o [mainline_rite|E] [head_of_faith|E]. O patrocínio deles é aceito automaticamente."
 game_concept_prohibit_tenet_status:0 "Proibir"
 game_concept_prohibited_tenet_status:0 "Proibido"
 game_concept_prohibited_tenet_status_desc:0 "Um $game_concept_prohibited_tenet_status$ [tenet_status|E] significa que o [rite|E] proíbe explicitamente este [core_tenet|E] ou [doctrine|E]. Um [character|E] do $game_concept_rite$ que adote o $game_concept_core_tenet$ como um [personal_tenet|E] o mantém como um [secret|E], e um $game_concept_rite$ que adote [prohibited_tenet_status|E] [core_tenets|E] como [core_tenet_status|E] torna-se muito mais [rite_divergent|E] de sua [faith|E]."
 game_concept_puppet:0 "Marionete"
 game_concept_puppet_desc:0 "Uma Marionete é um [character|E] sob o controle de um [puppeteer|E], que pode realizar ações especiais de Marionete através deles.\n\nAgir através de uma Marionete abre portas que de outra forma permaneceriam fechadas: um [clerical_puppet|E] pode peticionar por [clerical_titles|E] ou uma [excommunication|E] em seu nome, enquanto um [external_ruler_puppet|E] pode ser forçado a libertar [tributaries|E], conceder independência ou divorciar-se de seu [spouse|E].\n\nAs ações disponíveis são determinadas pelo [puppet_type|E]."
 game_concept_puppet_type:0 "Tipo de Marionete"
 game_concept_puppet_type_desc:0 "Um [puppet|e] sempre tem um tipo que determina as ações que ele pode tomar em seu nome.\n\nEmbora a maioria de suas ações especiais sejam compartilhadas, cada $game_concept_puppet_type$ vem com ações exclusivas disponíveis apenas para esse tipo.\n\nPor exemplo, um [clerical_puppet|e] pode [excommunicate|e] alguém em seu nome, enquanto um [external_ruler_puppet|e] pode ser compelido a libertar um [tributary|e] ou divorciar-se de seu [spouse|e].\n\nVocê só pode ter uma $game_concept_puppet$ por tipo."
 game_concept_puppet_types:0 "Tipos de Marionete"
 game_concept_puppeted:0 "Controlado como Marionete"
 game_concept_puppeteer:0 "Marionetista"
 game_concept_puppeteer_desc:0 "Um Marionetista é um [character|E] no controle de uma ou mais [puppets|E].\n\nAgindo através de suas Marionetes, um Marionetista exerce poderes além de sua posição, como a influência do [clergy|E] ou a autoridade de um [realm|E] estrangeiro."
 game_concept_puppeteer_possessive:0 "do Marionetista"
 game_concept_puppeteers:0 "Marionetistas"
 game_concept_puppeteers_possessive:0 "dos Marionetistas"
 game_concept_puppeting:0 "Controlar como Marionete"
 game_concept_puppets:0 "Marionetes"
 game_concept_religious_subordinate:0 "Subordinado Religioso"
 game_concept_religious_subordinate_desc:0 "Um Subordinado Religioso é um [character|E] que possui um [religious_superior|E] dentro de uma estrutura religiosa hierárquica."
 game_concept_religious_subordinates:0 "Subordinados Religiosos"
 game_concept_religious_superior:0 "Superior Religioso"
 game_concept_religious_superior_desc:0 "Um Superior religioso é um [character|E] que detém jurisdição religiosa sobre um ou mais clérigos religiosos [subordinate|E] em uma estrutura religiosa hierárquica."
 game_concept_religious_superiors:0 "Superiores Religiosos"
 game_concept_request_clerical_chastity_interaction:0 "$request_clerical_chastity_interaction$"
 game_concept_request_clerical_chastity_interaction_desc:0 "Uma [interaction|E] que exige que outro [character|E] assuma votos de castidade e assuma uma penalidade de [fertility|E] de longo prazo."
 game_concept_request_ecclesiastical_title_expansion_interaction:0 "$request_ecclesiastical_title_expansion_interaction$"
 game_concept_request_ecclesiastical_title_expansion_interaction_desc:0 "Uma [interaction|E] usada por [ecclesiastical|E] [rulers|E] para expandir sua [clerical_region|E] para o [de_jure|E] [counties|E] de um [duchy|E] adjacente.\n\nIsso só é possível com a aprovação do [head_of_faith|E]."
 game_concept_rite:0 "Rito"
 game_concept_rite_desc:0 "Um Rito é um ramo de uma [faith|E]: uma variação local de suas práticas religiosas, liderada por um [head_of_rite|E] e seguida por seus próprios [counties|E] e [characters|E]. Toda fé tem um [mainline_rite|E] e pode gerar vários outros.\n\nUm Rito define-se pelos [core_tenets|E] e [doctrines|E] que defende. Se um Princípio é [permitted_tenet_status|E] ou [prohibited_tenet_status|E] é julgado pela [faith|E] através de seu [mainline_rite|E], e quanto mais as escolhas de um [rite_possessive|E] desafiam esses julgamentos, maior é a sua [rite_divergence|E]: Ritos divergentes drenam o [faithpossessive|E] [fervor|E], passam a ser vistos como [heresy|E] e, no #V 100#! [divergence|E], se afastam como um [faith|E] próprio.\n\nNovos Ritos podem ser fundados pelos piedosos, [rulers|E] podem ser influenciados de um Rito para outro, e apenas o [head_of_rite|E] pode editar um."
 game_concept_rite_divergence:0 "Divergência"
 game_concept_rite_divergence_desc:0 "A divergência mede o quanto [rite_possessive|E] [core_tenets|E] e [doctrines|E] se afastaram da [faith|E] original. Um rito que adota os princípios de [prohibited_tenet_status|E] como [core_tenet_status|E] é mais divergente.\n\nUma divergência alta enfraquece o [fervor|E] da fé original, tornando surtos de [heresy|E] mais comuns. Um rito que atingir #V 100#! de divergência será automaticamente declarado uma heresia e se tornará uma nova [faith|E]."
 game_concept_rite_divergence_i:0 "@divergence_icon!"
 game_concept_rite_divergent:0 "Divergente"
 game_concept_rite_knowledge:0 "Conhecimento de Rito"
 game_concept_rite_knowledge_desc:0 "$game_concept_tenet_knowledge_desc$"
 game_concept_rite_possessive:0 "do Rito"
 game_concept_rites:0 "Ritos"
 game_concept_rites_possessive:0 "dos Ritos"
 game_concept_sainthood:0 "Santidade"
 game_concept_sainthood_desc:0 "$game_concept_canonized_desc$"
 game_concept_sanctified:0 "Santificado"
 game_concept_sanctified_desc:0 "Santificar um [artifact|E] o torna uma [holy_relic|E] para uma [faith|E]. Um artefato pode ser santificado para múltiplas fés."
 game_concept_sanctify:0 "Santificar"
 game_concept_sanctifying:0 "Santificando"
 game_concept_schism:0 "Cisma"
 game_concept_schism_desc:0 "O Grande $game_concept_schism$ é o momento em que a $christian_faith$ unificada [faith|E] se divide ao longo de seus [rites|E] romano e grego, dividindo-se em $catholic$ e $orthodox$.\n\nIsso ameaça quando [the_christian_church|E] [situation|E] entra em certos [the_christian_church_chapters_short|E], e os governantes da Cristandade devem escolher um lado. A menos que as divisões sejam reparadas — ou forçadas — por meio de [decisions|E], a divisão se torna permanente quando o capítulo termina."
 game_concept_schisms:0 "Cismas"
 game_concept_schisms_desc:0 "$game_concept_schism_desc$"
 game_concept_secular_obligations:0 "Obrigações Seculares"
 game_concept_secular_obligations_desc:0 "$game_concept_secular_obligations$ representam como é determinado qual montante de renda de [church_holdings|E] pertence ao [secular_ruler|E] local.\n\nOs tipos são:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_personal_secular_obligations$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_fixed_secular_obligations$\n\nEm alguns capítulos, os governantes seculares também detêm poder local sobre a Igreja:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_local_secular_power$"
 game_concept_situation_the_christian_church_phase:0 "Capítulo da Igreja Cristã"
 game_concept_situation_the_christian_church_phase_desc:0 "Os capítulos são as [situation_phases|E] de [the_christian_church|E]. Há um total de sete capítulos, organizados em quatro [the_christian_church_chapter_types|E]."
 game_concept_situation_the_christian_church_phases:0 "Capítulos da Igreja Cristã"
 game_concept_spiritual_counsel_interaction:0 "$spiritual_counsel_interaction$"
 game_concept_spiritual_counsel_interaction_desc:0 "Uma [interaction|E] na qual uma autoridade [clerical|E] troca o conforto da [spiritual_fulfillment|E] por um [hook|E]"
 game_concept_spiritual_fulfillment:0 "Plenitude Espiritual"
 game_concept_spiritual_fulfillment_desc:0 "$game_concept_spiritual_fulfillment$ é a medida de quão em paz um [character|E] se sente em relação à sua [faith|E].\n\nA base é calculada com base nos [traits|E] que ele possui e se é considerado [sinful|E] ou [virtuous|E].\n\n$game_concept_spiritual_fulfillment$ pode ser ganho ou perdido agindo de maneiras que a [faith|E] considera apropriadas, e [personal_tenets|E] podem ser adotados para compensar traços nocivos."
 game_concept_spiritual_fulfillment_i:0 "@spiritual_fulfillment_icon!"
 game_concept_spiritual_fulfillment_level:0 "Nível de Plenitude Espiritual"
 game_concept_spiritual_fulfillment_level_desc:0 "[character_possessive|E] [spiritual_fulfillment|E] é dividido em $game_concept_spiritual_fulfillment_levels$ por limites, cada um aplicando seus próprios efeitos.\n\nNíveis baixos tornam a vida mais difícil e atos pecaminosos mais baratos. Níveis altos tornam a devoção mais fácil e abrem novas opções religiosas."
 game_concept_spiritual_fulfillment_levels:0 "Níveis de Plenitude Espiritual"
 game_concept_strengthen_claim_interaction:0 "$strengthen_claim_interaction$"
 game_concept_strengthen_claim_interaction_desc:0 "Uma [interaction|E] que fortalece um [unpressed_claim|E] em uma [pressed_claim|E] através do endosso de um [ecclesiastical|E] ou [theocratic|E] [ruler|E] relevante."
 game_concept_strong_centralization:0 "Centralização Forte"
 game_concept_subordinate:0 "Subordinado"
 game_concept_subordinates:0 "Subordinados"
 game_concept_superior:0 "Superior"
 game_concept_tenet_knowledge:0 "Conhecimento Religioso"
 game_concept_tenet_knowledge_desc:0 "Os personagens não conhecem todos os detalhes de cada prática religiosa.\n\nPrincípios e doutrinas conhecidos podem ser usados ao criar um [rite_divergent|E] $game_concept_rite$ e podem ser adotados como [personal_tenets|E]. Conhecer todos os $game_concept_core_tenets$ e $game_concept_doctrines$ de uma $game_concept_rite$ facilita a conversão.\n\nTodos os [core_tenets|E] e [doctrines|E] dentro de sua [faith|E] são conhecidos por você. Novo conhecimento pode ser obtido através de relações como [spouses|E] ou [friends|E], [traveling|E], [activities|E] ou o rito de Estudo [scheme|E]."
 game_concept_tenet_popularity:0 "Popularidade de Princípios"
 game_concept_tenet_popularity_desc:0 "À medida que [personal_tenets|E] se espalham dentro de uma [faith|E], sua prática se torna mais comum. $game_concept_tenet_popularity$ rastreia quão difundido é um [core_tenet|E] e afeta a probabilidade de ser escolhido como tópico de debate em um [ecumenical_council|E] ou como alvo de uma [papal_bull|E].\n\nQuanto maior o $game_concept_tenet_popularity$, mais o [clergy|E] ficará do lado de um princípio quando ele for debatido em um [ecumenical_council|E]. Uma vez que um princípio atinge #high [EmptyScope.ScriptValue('pam_tenet_popularity_ai_override_threshold')|0]#! $game_concept_tenet_popularity$, o [head_of_faith|E] provavelmente o declarará [permitted_tenet_status|E], independentemente de suas próprias convicções."
 game_concept_tenet_status:0 "Status de Princípio"
 game_concept_tenet_status_desc:0 "$game_concept_tenet_status$ é a postura de [rite_possessive|E] sobre um [core_tenet|E] ou [doctrine|E]. Existem cinco posturas possíveis:\n\n$EFFECT_LIST_BULLET$[unknown_tenet_status|E] — o $game_concept_rite$ nunca ouviu falar deste $game_concept_core_tenet$ ou $game_concept_doctrine$.\n\n$EFFECT_LIST_BULLET$[known_tenet_status|E] — o $game_concept_rite$ está ciente dele e não se pronunciou sobre sua prática.\n\n$EFFECT_LIST_BULLET$[permitted_tenet_status|E] — o $game_concept_rite$ aprova a prática.\n\n$EFFECT_LIST_BULLET$[prohibited_tenet_status|E] — o $game_concept_rite$ proíbe a prática.\n\n$EFFECT_LIST_BULLET$[core_tenet_status|E] — o $game_concept_rite$ permite e promove ativamente o $game_concept_core_tenet$.\n\nA postura de um rito governa se um $game_concept_core_tenet$ ou $game_concept_doctrine$ pode ser escolhido ao criar ou divergir de um $game_concept_rite$, e quais práticas custam penalidades espirituais aos [followers|E].\n\nO status de princípio é distinto de [character_possessive|E] [tenet_knowledge|E], que é a conscientização pessoal, não a postura geral $game_concept_rite$."
 game_concept_the_christian_church:0 "A Igreja Cristã"
 game_concept_the_christian_church_chapter_short:0 "Capítulo"
 game_concept_the_christian_church_chapter_type:0 "Tipo de Capítulo"
 game_concept_the_christian_church_chapter_type_desc:0 "Existem quatro $game_concept_the_christian_church_chapter_types$ em [the_christian_church|E], eles categorizam [situation_the_christian_church_phases|E].\n\n$game_concept_the_christian_church_chapter_types$: [the_christian_church_unstable_short|E], [the_christian_church_crisis_short|E], [the_christian_church_zeal_short|E] e [the_christian_church_stability_short|E]"
 game_concept_the_christian_church_chapter_types:0 "Tipos de Capítulo"
 game_concept_the_christian_church_chapters_short:0 "Capítulos"
 game_concept_the_christian_church_crisis:0 "Capítulo de Crise"
 game_concept_the_christian_church_crisis_desc:0 "#high Um $game_concept_the_christian_church_crisis$ #! é [the_christian_church|E] em seu estado mais severo:\n\nAs indulgências podem ser mais baratas, [ecumenical_councils|E] mais frequentes, [rulers|E] podem nomear seu próprio [court_chaplain|E], [clergy|E] podem se casar, o [head_of_faith|E] pode recusar a realizar uma [anointment|E] e [taxes|E] podem sofrer.\n\n#high $saeculum_obscurum$#! e #high $investiture_crisis$#! são $game_concept_the_christian_church_crisis_short$ [the_christian_church_chapters_short|E]."
 game_concept_the_christian_church_crisis_short:0 "Crise"
 game_concept_the_christian_church_desc:0 "A Igreja Cristã é o corpo eclesiástico que supervisiona e guia os seguidores de Jesus Cristo, representado como um [situation|E] que avança por uma sequência de [the_christian_church_chapters_short|E].\n\nSeus limites abrangem todos os [archdiocese|E] do mundo; todo [christian|E] [ruler|E] de patente [county|E] ou superior com qualquer parte de seu [realm|E] dentro de uma Arquidiocese é membro, sejam clérigos ou seculares."
 game_concept_the_christian_church_stability:0 "Capítulo de Estabilidade"
 game_concept_the_christian_church_stability_desc:0 "#high Um $game_concept_the_christian_church_stability$ #! é uma rara calmaria para [the_christian_church|E]:\n\nConstruir em um [temple_holding|E] é mais barato, Grandes Catedrais progridem mais rápido, [characters|E] têm mais chances de se tornarem [GetTrait('devoted').GetName( GetNullCharacter )], e o Grande Cisma pode ser sanado.\n\n#high $concord$#! é o único $game_concept_the_christian_church_stability$."
 game_concept_the_christian_church_stability_short:0 "Estabilidade"
 game_concept_the_christian_church_unstable:0 "Capítulo de Instabilidade"
 game_concept_the_christian_church_unstable_desc:0 "#high Um $game_concept_the_christian_church_unstable$ #! de [the_christian_church|E] é aquele em que a obediência é frágil:\n\n[rulers|E] podem ser facilmente persuadidos a uma [rite|E] diferente, excomunhões podem acontecer com mais frequência, e [gold|E] pode ser gasto para benefício próprio.\n\n#high $fragile_unity$#! e #high $reform_phase$#! são $game_concept_the_christian_church_unstable_short$ [the_christian_church_chapters_short|E]."
 game_concept_the_christian_church_unstable_short:0 "Instabilidade"
 game_concept_the_christian_church_zeal:0 "Capítulo de Zelo"
 game_concept_the_christian_church_zeal_desc:0 "#high $game_concept_the_christian_church_zeal$#! desperta fogo exterior:\n\nConversões em massa podem ocorrer, [great_holy_wars|E] podem se tornar mais comuns, [papal_bulls|E] podem ser mais frequentes, e a conversão de [faith|E] pode ser mais fácil.\n\n#high $conversion_phase$#! e #high $crusade_phase$#! são $game_concept_the_christian_church_zeal_short$ [the_christian_church_chapters_short|E]."
 game_concept_the_christian_church_zeal_short:0 "Fervor"
 game_concept_treasury_cardinal_budget:0 "Orçamento Cardinalício"
 game_concept_treasury_cardinal_budget_benefices:0 "Benefícios Cardinalícios"
 game_concept_treasury_cardinal_budget_desc:0 "Tesouro alocado para [cardinals|E] a partir do tesouro central da igreja, representando [Glossary( 'benefices', 'CARDINAL_BENEFICES_GLOSS' )] diretos e indiretos atribuídos a eles."
 game_concept_treasury_cardinal_budget_short:0 "Cardeal"
 game_concept_unknown_tenet_status:0 "Desconhecido"
 game_concept_unknown_tenet_status_desc:0 "Um $game_concept_unknown_tenet_status$ [tenet_status|E] significa que a [rite|E] não tem conhecimento algum deste [core_tenet|E] ou [doctrine|E]. Os [followers|E] do $game_concept_rite$ não o conhecem implicitamente e não podem escolhê-lo ao criar um novo $game_concept_rite$ ou como um [personal_tenet|E]."
