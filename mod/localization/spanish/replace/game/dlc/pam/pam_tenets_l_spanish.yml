 religious_decision.0211_anachoresis_tt:0 "#EMP Devido ao seu [GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetRite )] [personal_tenet|E]:#!"
 tenet_acts_of_apostles_default_desc:0 "Traga a luz celestial para aqueles nas trevas, e esperança para os desesperados.\n\n$pam_acts_1_8_default$\n\n[Glossary('Fervent Proselytism Historical Background','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_default_name:0 "Prosélitos Fervorosos"
 tenet_acts_of_apostles_greek_desc:0 "Retorno a Ti, Teu povo, Teu dom para mim. Guia-os com Tua poderosa mão direita e protege-os sob a sombra de Tuas asas.\n\n$pam_acts_1_8_greek$\n\n[Glossary('Práxeis tõn Apostólōn Historical Background','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_greek_name:0 "Práxeis tõn Apostólōn"
 tenet_acts_of_apostles_historical_desc:0 "O cristianismo espalhou-se rapidamente nos primeiros séculos d.C., em grande parte devido aos esforços missionários dos apóstolos e dos primeiros discípulos. Suas jornadas levaram-nos por todo o Império Romano, estabelecendo comunidades cristãs e convertendo indivíduos de diversas origens. O zelo pelo proselitismo era alimentado por uma profunda convicção na mensagem da salvação através de Jesus Cristo, levando ao crescimento do cristianismo, de uma pequena seita no judaísmo para uma religião mundial importante.\n\nNa época medieval, vários futuros santos e mártires empreenderam jornadas missionárias em terras pagãs, espalhando implacavelmente a fé cristã."
 tenet_acts_of_apostles_latin_desc:0 "Assim como Moisés esteve perante o Faraó proclamando ousadamente a sua tarefa, os nossos missionários estão perante os outros.\n\n$pam_acts_1_8_latin$\n\n[Glossary('Actus Apostolorum Historical Background','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_latin_name:0 "Actus Apostolorum"
 tenet_acts_of_apostles_name:0 "$tenet_acts_of_apostles_default_name$"
 tenet_acts_of_apostles_toast_conversion_title:0 "$tenet_acts_of_apostles_default_name$"
 tenet_adoptionism_default_desc:0 "Ó Senhor, ajuda-nos a compreender o mistério da exaltação do Teu Filho. Que possamos seguir o Seu exemplo de retidão, para que também nós sejamos chamados filhos de Deus.\n\n$pam_mark_1_11_default$\n\n[Glossary('Adoptionism Historical Background','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_default_name:0 "Adocionismo"
 tenet_adoptionism_greek_desc:0 "Ó Deus, que exaltas os humildes e escolhes os justos para Ti, louvamos-Te pelo mistério da adoção. Assim como Cristo foi elevado à filiação divina pela Tua graça, que também nós sejamos contados entre os Teus filhos.\n\n$pam_mark_1_11_greek$\n\n[Glossary('Hyiothesía Historical Background','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_greek_name:0 "Hyiothesía"
 tenet_adoptionism_historical_desc:0 "O adocionismo ensina que Jesus nasceu um humano comum e mais tarde foi 'adotado' como Filho de Deus, geralmente no seu batismo quando o Espírito Santo desceu sobre ele. As formas iniciais apareceram no século II com Teodoto de Bizâncio, cuja monarquianismo dinâmico enfatizava a unidade de Deus.\n\nO ensinamento ressurge na Espanha do século VIII sob o arcebispo Elipando de Toledo e o bispo Félix de Urgell, para quem a natureza divina de Cristo era gerada eternamente e a sua natureza humana adotada. O Concílio de Frankfurt condenou o adocionismo espanhol como heresia em 794 d.C., e as ideias adocionistas influenciaram posteriormente movimentos antitrinitários."
 tenet_adoptionism_latin_desc:0 "Ó Pai, que olhaste para o homem justo Jesus e o escolheste para Ti, concede que também nós sejamos considerados dignos de adoção. Assim como o levantaste das águas e o declaraste Teu amado, levanta-nos da nossa pequenez para a Tua família divina.\n\n$pam_mark_1_11_latin$\n\n[Glossary('Filius Adoptivus Historical Background','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_latin_name:0 "Filius Adoptivus"
 tenet_adoptionism_name:0 "$tenet_adoptionism_default_name$"
 tenet_alexandrian_catechism_default_desc:0 "A escola alexandrina enfatiza a interpretação alegórica da Escritura e a síntese da teologia cristã com a filosofia grega, buscando significados espirituais mais profundos sob o texto literal.\n\n$pam_1_corinthians_1_30_default$\n\n[Glossary('Alexandrian Catechism Historical Background','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_default_name:0 "$tenet_alexandrian_catechism_name$"
 tenet_alexandrian_catechism_greek_desc:0 "A tradição alexandrina sustenta que a sabedoria divina é revelada através da interpretação alegórica da Escritura. Cristo é o Logos, a Palavra divina através da qual toda a verdade é dada a conhecer.\n\n$pam_1_corinthians_1_30_greek$\n\n[Glossary('Alexandrinē Katēkhēsis Historical Background','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_greek_name:0 "Alexandrinē Katēkhēsis"
 tenet_alexandrian_catechism_historical_desc:0 "A Escola Catequética de Alexandria, fundada no final do século II, foi a mais antiga instituição cristã de ensino superior. Sob professores como Clemente de Alexandria e Orígenes, desenvolveu um método sofisticado de interpretação bíblica que buscava significados alegóricos e espirituais na Escritura. A escola sintetizou a teologia cristã com a filosofia platônica, argumentando que o aprendizado grego preparava o caminho para o Evangelho.\n\nOs métodos exegéticos e as especulações teológicas de Orígenes influenciaram profundamente o cristianismo oriental, enquanto a ênfase da escola no método alegórico contrastava com a abordagem mais literal da Escola de Antioquia."
 tenet_alexandrian_catechism_latin_desc:0 "Ó Cristo, eterna Sabedoria de Deus, ilumina as nossas mentes para que possamos perceber os mistérios ocultos da Tua Santa Escritura. Concede-nos olhos para ver além da letra, rumo ao espírito que dá vida.\n\n$pam_1_corinthians_1_30_latin$\n\n[Glossary('Catechesis Alexandrina Historical Background','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_latin_name:0 "Catechesis Alexandrina"
 tenet_anachoresis_always_cave_hermit_name:0 "o [GetCourtPositionType('cave_hermit_court_position').GetName()] [court_position|E]"
 tenet_anachoresis_default_desc:0 "Através da retirada da sociedade mundana para o deserto, os fiéis podem alcançar a pureza espiritual, subjugar as paixões e aproximar-se de Deus por meio da oração solitária e da disciplina ascética.\n\n$pam_matthew_4_1_2_default$\n\n[Glossary('Anachoresis Historical Background','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_default_name:0 "Anacorese"
 tenet_anachoresis_greek_desc:0 "Bem-aventurados aqueles que se retiram do mundo, pois encontrarão a Deus no silêncio do deserto. Assim como os profetas habitaram em cavernas e buracos na terra, também os servos de Cristo buscam a solidão para travar guerra contra as paixões.\n\n$pam_matthew_4_1_2_greek$\n\n[Glossary('Anakhōrēsis Historical Background','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_greek_name:0 "Anakhōrēsis"
 tenet_anachoresis_historical_desc:0 "A anacrese, do grego #weak anakhorēsis#! que significa retirada, é a prática de ermitões que deixavam a sociedade rumo aos ermos para buscar uma vida de oração, jejum e combate espiritual contra as forças demoníacas. O movimento começou no Egito do século III com São Paulo de Tebas, tradicionalmente considerado o primeiro ermitão cristão, que fugiu da perseguição do imperador Décio para o deserto tebano por volta de 250 d.C.\n\nOs anacoretas continuaram comuns por toda a Idade Média, vivendo em celas isoladas anexas a mosteiros e recebendo a Eucaristia através de uma pequena janela chamada hagioscópio. Textos de orientação como o Ancrene Wisse inglês do século XIII estabeleceram regras para anacoretas."
 tenet_anachoresis_latin_desc:0 "Ó Senhor, assim como conduziste teu Filho ao deserto para preparar seu ministério, conduz-nos também ao deserto de nossos corações. Na solidão e no silêncio, que possamos fugir das distrações do mundo e encontrar somente a Ti.\n\n$pam_matthew_4_1_2_latin$\n\n[Glossary('Vita Eremitica Historical Background','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_latin_name:0 "Vita Eremitica"
 tenet_anachoresis_name:0 "$tenet_anachoresis_default_name$"
 tenet_aniconism_default_desc:0 "Não farás para ti imagem de escultura, nem semelhança alguma. A adoração de imagens é uma corrupção da verdadeira fé.\n\n$pam_exodus_20_4_default$\n\n[Glossary('Aniconism Historical Background','tenet_aniconism_historical_desc')]"
 tenet_aniconism_default_name:0 "$tenet_aniconism_name$"
 tenet_aniconism_greek_desc:0 "A veneração de imagens não é sancionada pelas Escrituras, nem pela tradição dos Padres. A iconoclastia é o verdadeiro ensinamento da Igreja, purificando os fiéis da idolatria das imagens.\n\n$pam_exodus_20_4_greek$\n\n[Glossary('Eikonomakhía Historical Background','tenet_aniconism_historical_desc')]"
 tenet_aniconism_greek_name:0 "Eikonomakhía"
 tenet_aniconism_historical_desc:0 "A evitação, proibição e destruição de imagens religiosas possuem raízes profundas nas tradições abraâmicas. No cristianismo, a expressão mais significativa foi a Primeira Iconoclastia Bizantina (726-843 d.C.), iniciada pelo imperador Leão III e continuada por Constantino V, um período de ampla destruição de imagens religiosas e perseguição àqueles que veneravam ícones.\n\nOs iconoclastas argumentavam que a veneração de ícones violava a proibição bíblica contra imagens de escultura. O Segundo Concílio de Niceia, em 787 d.C., condenou a iconoclastia, apontando semelhanças entre o culto por meio de ícones e por meio do evangelho escrito. A iconoclastia ressurgiu sob Leão V em 814 d.C. Tendências iconoclastas semelhantes apareceram mais tarde em vários movimentos protestantes."
 tenet_aniconism_latin_desc:0 "Ó Senhor, só Tu és digno de adoração. Preserva-nos da armadilha dos ídolos, para que possamos adorar-Te em espírito e verdade, não por meio de imagens feitas por mãos humanas, mas por corações puros elevados a Ti.\n\n$pam_exodus_20_4_latin$\n\n[Glossary('Iconomachia Historical Background','tenet_aniconism_historical_desc')]"
 tenet_aniconism_latin_name:0 "Iconomachia"
 tenet_apostolic_succession_default_desc:0 "A ininterrupta linha de bispos desde os apóstolos até os dias atuais, garantindo a autêntica transmissão da fé.\n\n$pam_matthew_16_18_default$\n\n[Glossary('Apostolic Succession Historical Background','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_default_name:0 "Sucessão Apostólica"
 tenet_apostolic_succession_greek_desc:0 "Da igreja de Roma, Lino, filho de Cláudia, foi o primeiro, ordenado por Paulo.\n\n$pam_matthew_16_18_greek$\n\n[Glossary('Apostolikē Diadokhē Historical Background','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_greek_name:0 "Apostolikē Diadokhē"
 tenet_apostolic_succession_historical_desc:0 "A doutrina da sucessão apostólica sustenta que os bispos derivam sua autoridade de uma cadeia ininterrupta de ordenações que remonta aos próprios apóstolos. Ireneu de Lyon, no século II, usou a sucessão apostólica como argumento contra as heresias gnósticas, demonstrando que o verdadeiro ensinamento de Cristo era preservado por meio dos bispos legítimos da Igreja.\n\nA partir do século XIII, os papas ostentam o Anel do Pescador como símbolo da sucessão de São Pedro. Os cristãos ortodoxos orientais reconhecem a linhagem dos papas ocidentais e seu papel no cristianismo primitivo, mas não concedem a Pedro status elevado sobre os outros apóstolos, e consideram o Papa Lino como o primeiro Bispo de Roma."
 tenet_apostolic_succession_latin_desc:0 "A primazia de honra e jurisdição que Cristo conferiu ao Apóstolo Pedro, e que é herdada por seus sucessores, os Papas.\n\n$pam_matthew_16_18_latin$\n\n[Glossary('Successio Apostolica Historical Background','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_latin_name:0 "Successio Apostolica"
 tenet_apostolic_succession_name:0 "$tenet_apostolic_succession_default_name$"
 tenet_apostolic_succession_requires_head_of_faith_tt:0 "Sua [faith|E] deve ter um [head_of_faith|E]"
 tenet_armed_pilgrimages_default_desc:0 "A peregrinação aos lugares santos é um dever sagrado, e os fiéis são chamados a proteger esses locais e os companheiros peregrinos pela força das armas, se necessário.\n\n$pam_matthew_16_24_default$\n\n[Glossary('Armed Pilgrimages Historical Background','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_default_name:0 "$tenet_armed_pilgrimages_name$"
 tenet_armed_pilgrimages_greek_desc:0 "Os fiéis são chamados a seguir a Cristo tomando a cruz, não apenas espiritualmente, mas em defesa dos lugares santos. A peregrinação armada é um ato de devoção, uma jornada de fé protegida pela espada.\n\n$pam_matthew_16_24_greek$\n\n[Glossary('Énoplon Proskýnēma Historical Background','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_greek_name:0 "Énoplon Proskýnēma"
 tenet_armed_pilgrimages_historical_desc:0 "Uma combinação da prática espiritual de visitar locais santos com a ação militar para defendê-los ou recapturá-los. As Cruzadas, iniciadas em 1095 com o chamado do Papa Urbano II no Concílio de Clermont, representaram a forma mais organizada de peregrinação armada. Os cruzados recebiam indulgências plenárias e consideravam seu serviço militar um ato de penitência e devoção.\n\nO conceito baseou-se em tradições anteriores de guerra penitencial e na defesa da cristandade contra ameaças externas, transformando a peregrinação de uma jornada pacífica em uma expressão militante da fé."
 tenet_armed_pilgrimages_latin_desc:0 "Ó Senhor, fortalece nossos braços ao tomarmos a cruz em Teu santo nome. Guia nossos passos na jornada sagrada, para que possamos defender a fé e libertar os lugares santos das mãos dos infiéis.\n\n$pam_matthew_16_24_latin$\n\n[Glossary('Peregrinatio Armata Historical Background','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_latin_name:0 "Peregrinatio Armata"
 tenet_be_fruitful_and_multiply_birthday_title:0 "$tenet_be_fruitful_and_multiply_default_name$"
 tenet_be_fruitful_and_multiply_child_modifier:0 "Enmimado"
 tenet_be_fruitful_and_multiply_child_modifier_desc:0 "A reverência fervorosa à fertilidade resulta em maior cuidado e foco de todos os fiéis para com os jovens e seus pais"
 tenet_be_fruitful_and_multiply_default_desc:0 "No plano de Deus, a família é uma comunidade íntima de vida e amor, um esforço que encontrará realização, assim como tudo o que foi criado e remido, no Reino de Deus.\n\n$pam_genesis_1_28_default$\n\n[Glossary('Be Fruitful and Multiply Historical Background','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_default_name:0 "Sede Fecundosos e Multiplicai-vos"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_close:0 "Criado com Amor"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_close_desc:0 "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_desc:0 "Uma criança nascida de uma união amorosa conhece o calor e o carinho de seus pais, e prospera sob seus cuidados gentis"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_devoted:0 "Criado com Devoção"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_devoted_desc:0 "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_fond:0 "Criado com Carinho"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_fond_desc:0 "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_greek_desc:0 "Eis que os filhos são herança do Senhor, e o fruto do ventre é o seu galardão.\n\n$pam_genesis_1_28_greek$\n\n[Glossary('Auxánesthe kaì Plēthýnesthe Historical Background','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_greek_name:0 "Auxánesthe kaì Plēthýnesthe"
 tenet_be_fruitful_and_multiply_historical_desc:0 "Sede fecundosos e multiplicai-vos é uma injunção bíblica encontrada em Gênesis 1:28, onde Deus comanda Adão e Eva a procriarem e encherem a terra."
 tenet_be_fruitful_and_multiply_latin_desc:0 "O casal não dá apenas a si mesmo, mas também a realidade dos filhos, que são um reflexo vivo de seu amor, uma síntese viva e inseparável de seu ser.\n\n$pam_genesis_1_28_latin$\n\n[Glossary('Crescite et Multiplicamini Historical Background','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_latin_name:0 "Crescite et Multiplicamini"
 tenet_be_fruitful_and_multiply_name:0 "$tenet_be_fruitful_and_multiply_default_name$"
 tenet_be_fruitful_and_multiply_parent_modifier:0 "Elogiado pela Fecundidade"
 tenet_be_fruitful_and_multiply_parent_modifier_desc:0 "$tenet_be_fruitful_and_multiply_child_modifier_desc$"
 tenet_be_fruitful_and_multiply_personal_health_on_birth:0 "Fecundo e Multiplicador"
 tenet_be_fruitful_and_multiply_personal_health_on_birth_desc:0 "A devoção deste personagem à fecundidade o deixou vigoroso após o nascimento de uma criança."
 tenet_be_fruitful_and_multiply_spouse_romance_fertility:0 "Paixão Rekindled"
 tenet_be_fruitful_and_multiply_spouse_romance_fertility_desc:0 "O ardor renovado entre este personagem e seu cônjuge os deixou ansiosos por serem fecundosos."
 tenet_celestial_hierarchy_default_desc:0 "Os anjos são organizados em nove ordens, desde os Serafins até os Anjos comuns, cada um servindo a Deus em seu papel designado e ministrando à humanidade.\n\n$pam_hebrews_1_14_default$\n\n[Glossary('Celestial Hierarchy Historical Background','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_default_name:0 "Hierarquia Celestial"
 tenet_celestial_hierarchy_greek_desc:0 "Sê tu um Anjo guardião, sábio conselheiro e companheiro do povo cristão, trazendo-lhe iluminação, força, alegria, paz e consolo.\n\n$pam_hebrews_1_14_greek$\n\n[Glossary('Ouranía Hierarkhía Historical Background','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_greek_name:0 "Ouranía Hierarkhía"
 tenet_celestial_hierarchy_historical_desc:0 "O conceito de hierarquia celestial foi sistematizado pelo Pseudo-Dionísio, o Areopagita, no século V ou VI em sua obra 'De Coelesti Hierarchia'. Ele organizou os anjos em três tríades: a mais alta consistindo de Serafins, Querubins e Tronos; a do meio de Dominações, Virtudes e Potestades; e a mais baixa de Principados, Arcanjos e Anjos.\n\nEsta hierarquia influenciou profundamente a teologia cristã medieval e foi adotada tanto pelo cristianismo oriental quanto pelo ocidental. Tomás de Aquino incorporou essa angelologia em sua Suma Teológica, e ela moldou as representações artísticas do céu ao longo da Idade Média."
 tenet_celestial_hierarchy_latin_desc:0 "Santos anjos, cercai meu trono e minha família. Pai Celestial, permiti que vossos anjos silenciem toda voz de condenação e medo que fale contra mim, e levem minhas preces rapidamente ao vosso trono.\n\n$pam_hebrews_1_14_latin$\n\n[Glossary('Hierarchia Caelestis Historical Background','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_latin_name:0 "Hierarchia Caelestis"
 tenet_celestial_hierarchy_name:0 "$tenet_celestial_hierarchy_default_name$"
 tenet_communal_identity_default_desc:0 "Os fiéis estão unidos como o povo escolhido de Deus, uma comunidade separada do mundo, compartilhando uma identidade comum e um propósito em Cristo.\n\n$pam_1_peter_2_9_default$\n\n[Glossary('Communal Identity Historical Background','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_default_name:0 "$tenet_communal_identity_name$"
 tenet_communal_identity_greek_desc:0 "Chamados das trevas para Sua luz maravilhosa, somos uma nação santa, um povo que Deus reivindica como Sua posse. Em Cristo somos feitos um só corpo.\n\n$pam_1_peter_2_9_greek$\n\n[Glossary('Laòs Theoũ Historical Background','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_greek_name:0 "Laòs Theoũ"
 tenet_communal_identity_historical_desc:0 "O conceito da Igreja como o 'Povo de Deus' baseia-se na imaginação do Antigo Testamento de Israel como o povo escolhido de Deus, reinterpretado através das lentes da Nova Aliança. Os primeiros cristãos entendiam-se como um novo Israel, unidos não pelo sangue ou etnia, mas pela fé em Cristo.\n\nEssa identidade social transcendia fronteiras sociais, étnicas e nacionais, criando uma irmandade universal. A Lumen Gentium do Segundo Concílio do Vaticano destacou o 'Povo de Deus' como uma imagem eclesiológica central, enfatizando a natureza peregrina da Igreja e a dignidade comum de todos os batizados."
 tenet_communal_identity_latin_desc:0 "Somos a raça escolhida, um sacerdócio real, uma nação santa, separada por Deus. Que possamos proclamar Seus grandes feitos e caminhar dignos de nosso chamado como Seu povo.\n\n$pam_1_peter_2_9_latin$\n\n[Glossary('Populus Dei Historical Background','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_latin_name:0 "Populus Dei"
 tenet_communal_possessions_redistribution_modifier:0 "Riqueza Redistribuída"
 tenet_communal_possessions_redistribution_modifier_desc:0 "As riquezas dos grandes e poderosos foram libertadas de seus cofres e acumuladas sobre os muitos. O povo comum pouco deseja e ainda menos se importa em obedecer ao comando de seu senhor."
 tenet_confession_default_desc:0 "Por meio da confissão, os pecadores podem receber absolvição e reconciliar-se com Deus e com a Igreja.\n\n$pam_james_5_16_default$\n\n[Glossary('Sacrament of Confession Historical Background','tenet_confession_historical_desc')]"
 tenet_confession_default_name:0 "Sacramento da Confissão"
 tenet_confession_greek_desc:0 "Atende à minha oração, o miserável, e destrói a serpente que nidifica em mim, ó Senhor!\n\n$pam_james_5_16_greek$\n\n[Glossary('Exomológēsis Historical Background','tenet_confession_historical_desc')]"
 tenet_confession_greek_name:0 "Exomológēsis"
 tenet_confession_historical_desc:0 "A prática de confessar pecados evoluiu significativamente ao longo da história cristã. Na Igreja primitiva, a confissão pública era comum para pecados graves. A confissão privada a um padre tornou-se mais difundida nas igrejas celtas durante o século VI e espalhou-se por todo o cristianismo ocidental. O Quarto Concílio de Latrão em 1215 exigiu a confissão anual para todos os cristãos. O segredo de confissão, a confidencialidade absoluta dos pecados confessados, tornou-se uma característica definidora do sacramento, com sacerdotes dispostos a enfrentar o martírio em vez de quebrar esse sigilo."
 tenet_confession_latin_desc:0 "Bendizei-me, Pai, porque pequei. Ó Deus mui misericordioso! Prostrado aos vossos pés, imploro o vosso perdão. Confesso os meus pecados com toda a sinceridade a vós e ao vosso sacerdote\n\n$pam_james_5_16_latin$\n\n[Glossary('Confessio Historical Background','tenet_confession_historical_desc')]"
 tenet_confession_latin_name:0 "Confessio"
 tenet_confession_name:0 "$tenet_confession_default_name$"
 tenet_consolamentum_default_desc:0 "Por meio do rito sagrado da consolação espiritual, os crentes recebem o Espírito Santo e preparam-se para a sua jornada deste mundo para o próximo.\n\n$pam_2_timothy_4_7_default$\n\n[Glossary('Consolamentum Historical Background','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_default_name:0 "Consolamentum"
 tenet_consolamentum_greek_desc:0 "Pela imposição das mãos e pela oração dos fiéis, o espírito recebe a consolação divina. O bom combate é travado, a corrida é terminada e a fé é guardada até o fim.\n\n$pam_2_timothy_4_7_greek$\n\n[Glossary('Paráklēsis Historical Background','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_greek_name:0 "Paráklēsis"
 tenet_consolamentum_historical_desc:0 "O Consolamentum era o sacramento central da fé cátara, combinando elementos de batismo, crisma, ordenação e extrema-unção. Administrado pela imposição das mãos, acreditava-se que conferia o Espírito Santo e libertava a alma do mundo material.\n\nPara a maioria dos crentes, era recebido apenas no leito de morte, enquanto aqueles que o recebiam com plena saúde tornavam-se 'Perfecti' ou 'Bons Hommes', comprometendo-se com uma vida de rigoroso ascetismo. O rito tinha raízes em práticas cristãs primitivas de batismo espiritual e mostra possível influência de tradições bogomilas orientais."
 tenet_consolamentum_latin_desc:0 "Ó Senhor, combatemos o bom combate, terminamos a corrida, guardamos a fé. Recebe agora o Teu servo na consolação do Espírito, para que a alma seja liberta dos laços deste mundo material.\n\n$pam_2_timothy_4_7_latin$\n\n[Glossary('Consolamentum Historical Background','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_latin_name:0 "Consolamentum"
 tenet_divine_liturgy_default_desc:0 "A liturgia é a principal expressão da fé, onde o céu e a terra se encontram, e os fiéis participam da adoração eterna a Deus junto aos anjos e santos.\n\n$pam_isaiah_6_3_default$\n\n[Glossary('Divine Liturgy Historical Background','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_default_name:0 "Liturgia Divina"
 tenet_divine_liturgy_greek_desc:0 "Na Liturgia Divina, os fiéis participam da adoração celestial, transcendendo o tempo e o espaço para comparecer perante o trono de Deus com os querubins e serafins.\n\n$pam_isaiah_6_3_greek$\n\n[Glossary('Theía Leitourgía Historical Background','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_greek_name:0 "Theía Leitourgía"
 tenet_divine_liturgy_historical_desc:0 "A Liturgia Divina desenvolveu-se a partir dos primeiros cultos cristãos, com a Liturgia de São Basílio e a Liturgia de São João Crisóstomo tornando-se as formas padrão no cristianismo oriental. Essas liturgias enfatizavam a participação mística dos fiéis na adoração celestial, com cerimônias elaboradas, incenso, ícones e cantos criando uma experiência sensorial do divino. A liturgia era entendida não meramente como adoração humana a Deus, mas como a entrada dos fiéis na adoração eterna do céu, transcendendo as fronteiras do tempo e do espaço."
 tenet_divine_liturgy_latin_desc:0 "A sagrada liturgia é o céu trazido à terra, onde nos juntamos aos anjos e santos em adoração eterna, clamando santo, santo, santo ao Senhor dos exércitos, cuja glória enche toda a criação.\n\n$pam_isaiah_6_3_latin$\n\n[Glossary('Divinum Officium Historical Background','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_latin_name:0 "Divinum Officium"
 tenet_divine_liturgy_name:0 "$tenet_divine_liturgy_default_name$"
 tenet_divine_marriage_default_desc:0 "O casamento sagrado dentro da comunidade de fé mantém a pureza espiritual e preserva a santidade da linhagem religiosa através das gerações.\n\n$pam_tobit_8_7_default$\n\n[Glossary('Divine Marriage Historical Background','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_default_name:0 "$tenet_divine_marriage_name$"
 tenet_divine_marriage_greek_desc:0 "O casamento dentro da comunidade de fé preserva a linhagem sagrada e mantém a pureza perante Deus. Não na luxúria, mas na verdade tais uniões são abençoadas, para que a misericórdia seja encontrada pelo marido e pela esposa.\n\n$pam_tobit_8_7_greek$\n\n[Glossary('Hieròs Gámos Historical Background','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_greek_name:0 "Hieròs Gámos"
 tenet_divine_marriage_historical_desc:0 "O conceito de casamento sagrado ou endogamia, casamento apenas dentro de comunidades religiosas, tem raízes antigas em muitas tradições. No zoroastrismo, o xwedodah (casamento entre parentes próximos) era praticado para manter o mérito espiritual e a propriedade familiar. A prática visava preservar a pureza religiosa, consolidar o poder espiritual e manter linhagens sagradas e reais.\n\nEmbora controverso e frequentemente mal compreendido por observadores externos, os adeptos viam tais casamentos como o cumprimento de mandamentos divinos para manter a santidade de sua comunidade."
 tenet_divine_marriage_latin_desc:0 "Ó Senhor, não foi por luxúria que fomos unidos nesta união sagrada, mas com sinceridade e em verdade. Concede que possamos encontrar misericórdia e envelhecer juntos, preservando a santidade do nosso vínculo.\n\n$pam_tobit_8_7_latin$\n\n[Glossary('Matrimonium Sacrum Historical Background','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_latin_name:0 "Matrimonium Sacrum"
 tenet_dulia_default_desc:0 "Que todos os que buscam a intercessão dos santos se aproximem deles com reverência e devoção.\n\n$pam_philippians_4_21_default$\n\n[Glossary('Veneration of Saints Historical Background','tenet_dulia_historical_desc')]"
 tenet_dulia_default_name:0 "Veneração aos Santos"
 tenet_dulia_greek_desc:0 "De hieroconfesores e portadores de mirra a loucos por Cristo, a Igreja honrou aqueles que mostraram devoção excepcional a Deus com um título especial e comemoração em um dia específico do calendário litúrgico.\n\n$pam_philippians_4_21_greek$\n\n[Glossary('Hagiokatátaxis Historical Background','tenet_dulia_historical_desc')]"
 tenet_dulia_greek_name:0 "Hagiokatátaxis"
 tenet_dulia_historical_desc:0 "No cristianismo primitivo, os mártires, aqueles que morreram pela fé, eram venerados e suas relíquias preservadas como objetos sagrados. A partir do século IV, os confessores, aqueles que haviam confessado sua fé não morrendo, mas por palavra e vida, também foram honrados.\n\nA aprovação de seu status era inicialmente concedida por um bispo local, após a condução de uma investigação sobre sua vida e milagres. São Udalrico, bispo de Augsburgo, confirmado pelo Papa João XV em 993, foi o primeiro santo fora de Roma sujeito à canonização papal. Um decreto do Papa Alexandre III em 1170 deu a prerrogativa de canonização exclusivamente ao papa."
 tenet_dulia_latin_desc:0 "Aqueles que escolheram o Senhor como sua rocha devem ser venerados. Santificado é seu corpo eterno, sagrada a sua relíquia e santa a sua memória.\n\n$pam_philippians_4_21_latin$\n\n[Glossary('Dulia Historical Background','tenet_dulia_historical_desc')]"
 tenet_dulia_latin_name:0 "Dulia"
 tenet_dulia_name:0 "$tenet_dulia_default_name$"
 tenet_gnosticism_default_desc:0 "A salvação é alcançada através do conhecimento espiritual secreto, revelando a centelha divina interior e o caminho para escapar do mundo material criado pelo Demiurgo.\n\n$pam_1_corinthians_2_7_default$\n\n[Glossary('Gnosticism Historical Background','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_default_name:0 "$tenet_gnosticism_name$"
 tenet_gnosticism_greek_desc:0 "A verdadeira salvação vem através da gnosis, o conhecimento secreto das coisas divinas ocultas do mundo material. Falamos a sabedoria de Deus em mistério, a sabedoria oculta decretada antes dos séculos para a nossa glória.\n\n$pam_1_corinthians_2_7_greek$\n\n[Glossary('Gnõsis Historical Background','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_greek_name:0 "Gnõsis"
 tenet_gnosticism_historical_desc:0 "O gnosticismo engloba diversos movimentos religiosos da era cristã primitiva que enfatizavam a salvação através da gnosis, ou conhecimento esotérico. Os gnósticos tipicamente viam o mundo material como a criação defeituosa de uma divindade menor (o Demiurgo), enquanto o Deus verdadeiro permanecia oculto e transcendente. Acreditava-se que as almas humanas continham centelhas divinas presas na matéria, que podiam ser libertadas através do conhecimento secreto.\n\nGrandes professores gnósticos incluíam Valentim, Basilides e Marcião. Pais da Igreja como Irineu e Tertuliano escreveram extensivamente contra os ensinamentos gnósticos, que consideravam desvios heréticos do cristianismo apostólico."
 tenet_gnosticism_latin_desc:0 "Ó sabedoria divina, oculta desde os séculos, revela-nos os mistérios do reino espiritual. Liberta nossas almas da prisão da matéria, para que possamos ascender à plenitude da luz e do conhecimento.\n\n$pam_1_corinthians_2_7_latin$\n\n[Glossary('Gnosis Historical Background','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_latin_name:0 "Gnosis"
 tenet_hesychasm_default_desc:0 "Através da quietude interior, da oração contemplativa e da repetição da Oração de Jesus, os fiéis podem experimentar comunhão direta com Deus e contemplar Sua luz não criada.\n\n$pam_psalm_46_10_default$\n\n[Glossary('Hesychasm Historical Background','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_default_name:0 "Hesicasmo"
 tenet_hesychasm_greek_desc:0 "Senhor Jesus Cristo, Filho de Deus, tende piedade de mim, pecador. Através da quietude do corpo e da mente, através da repetição incessante da Oração do Coração, permiti-me ascender à theoria, a visão da luz divina não criada.\n\n$pam_psalm_46_10_greek$\n\n[Glossary('Hēsykhasmós Historical Background','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_greek_name:0 "Hēsykhasmós"
 tenet_hesychasm_historical_desc:0 "Hesicasmo, do grego #weak hēsykhía#! que significa quietude, é uma tradição contemplativa no cristianismo oriental que enfatiza a oração do coração, enraizada nos Padres do Deserto do Egito do século IV. Sua prática central tornou-se a Oração de Jesus repetida, #weak Senhor Jesus Cristo, Filho de Deus, tende piedade de mim, pecador#!, frequentemente coordenada com a respiração e os batimentos cardíacos.\n\nNo século XIV, São Gregório Palamas defendeu os monges hesicastas do Monte Atos, e suas visões da Luz não criada do Tabor da Transfiguração, contra acusações de heresia por Barlaão da Calábria. Concílios em Constantinopla em 1341 e 1351 vindicaram Palamas e estabeleceram o Hesicasmo como doutrina ortodoxa."
 tenet_hesychasm_latin_desc:0 "Ó Senhor, concede-nos a graça da santa quietude. Que possamos encontrar-Te, Tu que habitas em luz inacessível. Ensina-nos a rezar sem cessar, para que nossos corações se tornem templos da Tua presença.\n\n$pam_psalm_46_10_latin$\n\n[Glossary('Hesychasmus Historical Background','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_latin_name:0 "Hesychasmus"
 tenet_hesychasm_name:0 "$tenet_hesychasm_default_name$"
 tenet_holy_myron_default_desc:0 "O Santo Myron, ou Crisma sagrado, é um óleo especialmente consagrado usado no sacramento da Crisma para selar os recém-batizados com o dom do Espírito Santo, completando sua iniciação na Igreja.\n\n$pam_john_3_5_default$\n\n[Glossary('Holy Myron Historical Background','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_default_name:0 "Santo Myron"
 tenet_holy_myron_ethiopic_desc:0 "Pelo sagrado Meron consagrado pelo Abuna, os fiéis recebem o selo do Espírito Santo. Assim como a pomba desceu sobre Cristo em Seu batismo no Jordão, assim também o Espírito desce sobre os recém-batizados através desta santa unção, marcando-os como filhos de Deus.\n\n$pam_john_3_5_default$\n\n[Glossary('Qeddus Meron Historical Background','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_ethiopic_name:0 "Qeddus Meron"
 tenet_holy_myron_greek_desc:0 "O Santo Myron, consagrado pelo Patriarca, é o selo do dom do Espírito Santo. Através desta unção sagrada, os recém-iluminados recebem a plenitude dos dons do Espírito, tornando-se templos do Deus vivo.\n\n$pam_john_3_5_greek$\n\n[Glossary('Hágion Mýron Historical Background','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_greek_name:0 "Hágion Mýron"
 tenet_holy_myron_historical_desc:0 "O Santo Myron, do grego #weak mýron#! que significa óleo perfumado, é usado no sacramento da crisma ou confirmação. No Oriente, ele segue imediatamente o Batismo, mesmo para recém-nascidos; no Ocidente, é administrado separadamente por um bispo. A unção tem raízes bíblicas profundas: tanto #weak Cristo#! quanto #weak Messias#! significam #weak o Ungido#!.\n\nConsagrar um novo Myron é um evento raro e solene: uma porção do lote anterior é sempre adicionada ao novo, uma corrente inquebrantável que se diz remontar aos Apóstolos. A tradição etíope sustenta que a receita do #weak Meron#! foi trazida pelos Nove Santos, missionários sírios do século V, e reserva sua consagração ao Patriarca, o Abuna."
 tenet_holy_myron_latin_desc:0 "Por meio do Crisma sagrado, consagrado pelo bispo, os fiéis recebem o selo do dom do Espírito Santo. A unção completa a graça do Batismo.\n\n$pam_john_3_5_latin$\n\n[Glossary('Sanctum Chrisma Historical Background','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_latin_name:0 "Sanctum Chrisma"
 tenet_holy_myron_name:0 "$tenet_holy_myron_default_name$"
 tenet_hyperdulia_default_desc:0 "Santíssima Virgem Maria, Mãe de Deus, Mãe de Misericórdia, Madonna.\n\n$pam_proverbs_31_20_default$\n\n[Glossary('Mother of God Historical Background','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_default_name:0 "Mãe de Deus"
 tenet_hyperdulia_greek_desc:0 "Aceita nossas súplicas e apresenta-as ao teu Filho e nosso Deus, para que Ele, por amor a ti, ilumine e salve nossas almas. Santíssima Theotokos, salva-nos!\n\n$pam_proverbs_31_20_greek$\n\n[Glossary('Theotókos Historical Background','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_greek_name:0 "Theotókos"
 tenet_hyperdulia_historical_desc:0 "Desde os primeiros dias do cristianismo, Maria, a mãe de Jesus, tem ocupado um lugar especial de honra e veneração. O Concílio de Éfeso em 431 d.C. confirmou seu título de Theotokos, #weak portadora de Deus#!, ao mesmo tempo em que condenava a preferência nestoriana por Christotokos, #weak portadora de Cristo#!. São João Damasceno escreveu no século VIII que Maria foi exaltada acima de todos os outros santos devido ao seu papel único na história da salvação. Ao longo dos séculos, várias doutrinas relativas a Maria, como sua Imaculada Conceição e Assunção, foram desenvolvidas e formalmente definidas pelas Igrejas Cristãs."
 tenet_hyperdulia_latin_desc:0 "Sob a vossa compaixão, nós nos acolhemos. Não desprezeis as nossas súplicas no momento da prova, mas livrai-nos dos perigos, ó virgem pura e bendita.\n\n$pam_proverbs_31_20_latin$\n\n[Glossary('Hyperdulia Historical Background','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_latin_name:0 "Hiperdulia"
 tenet_hyperdulia_name:0 "$tenet_hyperdulia_default_name$"
 tenet_khachkar_armenian_desc:0 "Os khachkars erguem-se como testemunhas eternas de nossa fé. Esculpidos com desenhos complexos de cruzes, videiras e símbolos sagrados, cada khachkar é uma oração em pedra, glorificando a Cruz pela qual o mundo foi salvo.\n\n$pam_galatians_6_14_default$\n\n[Glossary('Khachkar Historical Background','tenet_khachkar_historical_desc')]"
 tenet_khachkar_armenian_name:0 "Khachkar"
 tenet_khachkar_default_desc:0 "Cruzes de pedra esculpidas com imagética religiosa complexa servem como monumentos sagrados marcando locais santos, comemorando os mortos e celebrando a providência divina.\n\n$pam_galatians_6_14_default$\n\n[Glossary('Khachkar Historical Background','tenet_khachkar_historical_desc')]"
 tenet_khachkar_default_name:0 "Khachkars"
 tenet_khachkar_greek_desc:0 "Monumentos de pedra, esculpidos com símbolos sagrados, testemunham a vitória de Cristo e erguem-se como memoriais eternos aos fiéis.\n\n$pam_galatians_6_14_greek$\n\n[Glossary('Líthinos Staurós Historical Background','tenet_khachkar_historical_desc')]"
 tenet_khachkar_greek_name:0 "Líthinos Staurós"
 tenet_khachkar_historical_desc:0 "Os khachkars, do armênio #weak khach#! (cruz) e #weak k'ar#! (pedra), são estelas de pedra intrinsecamente esculpidas com uma cruz, frequentemente colocadas sobre uma roseta ou uma roda da eternidade. Únicos da cultura cristã armênia, eles marcam locais sagrados, comemoram eventos e vitórias, e servem como memoriais para os mortos.\n\nA tradição emergiu no século IX a partir das cruzes de madeira que São Gregório, o Iluminador, ergueu sobre templos pagãos após a conversão da Armênia em 301 d.C., e alcançou seu apogeu nos séculos XII e XIII sob os príncipes zacáridas. Cada um é único, obra de mestres escultores como Momik de Noravank, e alguns, considerados dotados de poderes milagrosos, tornaram-se objetos de peregrinação."
 tenet_khachkar_latin_desc:0 "Assim como os armênios elevam suas cruzes de pedra aos céus, marcos esta Terra com os símbolos da Salvação, a Cruz de Nosso Senhor Jesus Cristo.\n\n$pam_galatians_6_14_latin$\n\n[Glossary('Crux Lapidea Historical Background','tenet_khachkar_historical_desc')]"
 tenet_khachkar_latin_name:0 "Crux Lapidea"
 tenet_khachkar_name:0 "$tenet_khachkar_default_name$"
 tenet_love_thy_neighbour_boon_reason:0 "$tenet_love_thy_neighbour_name$: $VALUE|=+0$"
 tenet_love_thy_neighbour_default_desc:0 "O amor ao próximo é inseparável do amor a Deus e, por meio de atos de caridade e misericórdia, cumprimos toda a lei divina.\n\n$pam_matthew_22_39_default$\n\n[Glossary('Love Thy Neighbour Historical Background','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_default_name:0 "Amar o Próximo"
 tenet_love_thy_neighbour_greek_desc:0 "O que pode ser mais doce e belo do que o amor ao próximo? O amor é bem-aventurança, e o ódio é tormento. Toda a lei e os profetas dependem destes dois mandamentos: Amarás ao Senhor teu Deus de todo o teu coração e ao teu próximo como a ti mesmo\n\n$pam_matthew_22_39_greek$\n\n[Glossary('Agapēseis tòn Plēsíon Historical Background','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_greek_name:0 "Agapēseis tòn Plēsíon"
 tenet_love_thy_neighbour_historical_desc:0 "O mandamento de amar o próximo é central para a ética cristã, extraído de Levítico 19:18 e elevado por Cristo para figurar ao lado do amor a Deus como o resumo de toda a lei divina. Os primeiros Padres da Igreja, como Clemente de Alexandria e João Crisóstomo, enfatizaram que o verdadeiro amor deve ir além da família e dos amigos para abranger toda a humanidade, incluindo estranhos e inimigos. Este ensinamento inspirou o desenvolvimento de instituições de caridade cristãs, hospitais e a prática da esmola ao longo do período medieval."
 tenet_love_thy_neighbour_latin_desc:0 "Que possamos olhar para os outros como se através dos Teus olhos, julgando menos, amando mais e vendo neles, assim como em nós, uma obra que será completada a seu tempo pelas Tuas mãos.\n\n$pam_matthew_22_39_latin$\n\n[Glossary('Diliges Proximum Historical Background','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_latin_name:0 "Diliges Proximum"
 tenet_love_thy_neighbour_modifier:0 "$tenet_love_thy_neighbour_default_name$"
 tenet_love_thy_neighbour_modifier_desc:0 "O amor ao próximo é inseparável do amor a Deus; por meio de atos de caridade e misericórdia, obedecemos à lei divina."
 tenet_love_thy_neighbour_name:0 "$tenet_love_thy_neighbour_default_name$"
 tenet_mendicant_preachers_default_desc:0 "Ordens religiosas dedicadas à pobreza e à pregação, errantes sem posses para espalhar a fé, confiando na providência divina para suas necessidades diárias.\n\n$pam_matthew_10_9_default$\n\n[Glossary('Mendicant Preaching Historical Background','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_default_name:0 "$tenet_mendicant_preachers_name$"
 tenet_mendicant_preachers_greek_desc:0 "Seguindo o exemplo de Cristo, que não tinha onde reclinar a cabeça, os pregadores mendicantes abraçam a pobreza voluntária. Não levando nada para a jornada, eles confiam na providência de Deus enquanto espalham o Evangelho.\n\n$pam_matthew_10_9_greek$\n\n[Glossary('Ptōkhoì Kērykes Historical Background','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_greek_name:0 "Ptōkhoì Kērykes"
 tenet_mendicant_preachers_historical_desc:0 "As ordens mendicantes emergiram no século XIII como uma resposta à riqueza e mundanismo da Igreja estabelecida. O Segundo Concílio de Leão em 1274 reconheceu quatro ordens principais: os carmelitas, os franciscanos de Francisco de Assis, os dominicanos de Domingo de Guzmán e os agostinianos.\n\nDiferente das ordens monásticas que possuíam propriedades coletivamente, os mendicantes abraçaram tanto a pobreza corporativa quanto a individual, vivendo quase inteiramente de esmolas. Eles tinham foco urbano, pregando em vilas e cidades, e enfatizavam a educação e erudição. O ideal mendicante derivava diretamente das instruções de Cristo aos apóstolos em Mateus 10:9-10 de não levar nada para a jornada."
 tenet_mendicant_preachers_latin_desc:0 "Ó Senhor, assim como enviaste Vossos apóstolos sem ouro ou prata, assim partimos na pobreza, confiando unicamente na Tua providência. Concede-nos a graça de pregar o Teu Evangelho com simplicidade e verdade.\n\n$pam_matthew_10_9_latin$\n\n[Glossary('Pax et Bonum Historical Background','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_latin_name:0 "Pax et Bonum"
 tenet_miaphysitism_default_desc:0 "Cristo tem uma natureza unida que é tanto divina quanto humana, inseparavelmente unidas na Encarnação.\n\n$pam_colossians_2_9_default$\n\n[Glossary('Miaphysitism Historical Background','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_default_name:0 "Miafisismo"
 tenet_miaphysitism_greek_desc:0 "O Concílio de Éfeso estava certo ao restaurar Êutiques e condenar Flaviano. Cristo tem uma natureza divinos-humana unida, plenamente Deus e plenamente humano, livre de toda confusão ou separação.\n\n$pam_colossians_2_9_greek$\n\n[Glossary('Miaphysitismós Historical Background','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_greek_name:0 "Miaphysitismós"
 tenet_miaphysitism_historical_desc:0 "Do grego mia, #weak um#! e physis, #weak natureza#!, o miafisismo sustenta que em Cristo as naturezas divina e humana estão unidas em uma natureza composta, sem confusão ou separação. Defendido por Cirilo de Alexandria usando a fórmula #weak mia physis tou theou logou sesarkōménē#! (uma natureza encarnada de Deus o Verbo), distingue-se do monofisisismo por manter a plena realidade de ambas as naturezas dentro da unidade.\n\nO Concílio de Calcedônia em 451 d.C. rejeitou esta fórmula em favor do diofisismo (duas naturezas), e as Igrejas Ortodoxas Orientais (copta, armênia, etíope, siríaca) separaram-se da Igreja bizantina, mantendo sua teologia miafisita até hoje."
 tenet_miaphysitism_latin_desc:0 "O Concílio de Éfeso não foi um latrocínio. O erro de Calcedônia deve ser corrigido. As naturezas divina e humana estão unidas sem confusão, sem mudança, sem divisão, sem separação na única pessoa de Cristo.\n\n$pam_colossians_2_9_latin$\n\n[Glossary('Miaphysitismus Historical Background','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_latin_name:0 "Miaphysitismus"
 tenet_miaphysitism_name:0 "$tenet_miaphysitism_default_name$"
 tenet_miles_christi_default_desc:0 "Os fiéis são chamados a ser guerreiros espirituais, lutando contra o pecado e o mal com a armadura de Deus, prontos para sofrer por Cristo como os soldados sofrem por seu comandante.\n\n$pam_ephesians_6_11_default$\n\n[Glossary('Soldiery of Christ Historical Background','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_default_name:0 "Soldadesca de Cristo"
 tenet_miles_christi_greek_desc:0 "Todo cristão fiel deve estar preparado para sofrer por amor a Cristo, mantendo-se firme contra as forças espirituais da maldade e suportando aflições com a coragem de um soldado.\n\n$pam_ephesians_6_11_greek$\n\n[Glossary('Stratiōtēs Christoũ Historical Background','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_greek_name:0 "Stratiōtēs Christoũ"
 tenet_miles_christi_historical_desc:0 "O conceito do 'Soldado de Cristo' (Miles Christi) tem raízes profundas na tradição cristã, originando-se nas epístolas de São Paulo, onde ele utilizou metáforas militares para descrever a vida espiritual. Durante o período medieval, esse conceito foi aplicado tanto à guerra literal quanto à espiritual.\n\nAs Ordens Militares, como os Cavaleiros Templários e Hospitalários, encarnaram esse ideal, combinando a disciplina monástica com a proeza marcial. O 'De Laude Novae Militiae' de Bernardo de Claraval elogiou esses monges guerreiros como exemplares da virtude cristã, lutando não por ganho mundano, mas pela defesa da Cristandade."
 tenet_miles_christi_latin_desc:0 "Estai, pois, firmes, tendo cingido os vossos lombos com a verdade, e vestida a couraça da justiça. Combateu o bom combate da fé, como um verdadeiro soldado de Cristo.\n\n$pam_ephesians_6_11_latin$\n\n[Glossary('Miles Christi Historical Background','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_latin_name:0 "Miles Christi"
 tenet_miles_christi_name:0 "$tenet_miles_christi_default_name$"
 tenet_monophysitism_default_desc:0 "Cristo tem apenas uma natureza, plenamente divina.\n\n$pam_john_1_1_default$\n\n[Glossary('Monophysitism Historical Background','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_default_name:0 "Monofisismo"
 tenet_monophysitism_greek_desc:0 "Uma Physis do Verbo Encarnado.\n\n$pam_john_1_1_greek$\n\n[Glossary('Monophysitismós Historical Background','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_greek_name:0 "Monophysitismós"
 tenet_monophysitism_historical_desc:0 "Do grego monos, #weak solitário#! e physis, #weak natureza#!, este princípio afirma que Jesus Cristo possui apenas uma natureza divina, o Verbo Encarnado de Deus. Condenado como heresia no Concílio de Calcedônia em 451 d.C., encontrou apoio no imperador Basilisco e proteção sob o imperador Justiniano I. Isso levou a cismas como o dos acéfalos, que rejeitaram a autoridade do Patriarca de Alexandria, e dos docetas, que acreditavam que a natureza humana de Jesus era apenas um fantasma."
 tenet_monophysitism_latin_desc:0 "O Filho é um e sua natureza é uma, mesmo que seja concebido como tendo assumido a carne com uma alma racional.\n\n$pam_john_1_1_latin$\n\n[Glossary('Monophysitismus Historical Background','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_latin_name:0 "Monophysitismus"
 tenet_monophysitism_name:0 "$tenet_monophysitism_default_name$"
 tenet_mortification_of_the_flesh_default_desc:0 "Os fiéis mortificam a carne e seus desejos pecaminosos, partilhando do sofrimento de Cristo para purificar a alma e alcançar a perfeição espiritual.\n\n$pam_galatians_5_24_default$\n\n[Glossary('Mortification of the Flesh Historical Background','tenet_mortification_of_the_flesh_historical_desc')]"
 tenet_mortification_of_the_flesh_default_name:0 "Mortificação da Carne"
 tenet_mortification_of_the_flesh_greek_desc:0 "Por meio de jejuns, vigílias e mortificação corporal, os servos de Deus subjugam a carne e a trazem sob sujeição, para que o espírito possa elevar-se rumo ao céu.\n\n$pam_galatians_5_24_greek$\n\n[Glossary('Nékrōsis tẽs Sarkós Historical Background','tenet_mortification_of_the_flesh_historical_desc')]"
 tenet_mortification_of_the_flesh_greek_name:0 "Nékrōsis tẽs Sarkós"
 tenet_mortification_of_the_flesh_historical_desc:0 "Arraigada no apelo de São Paulo para #weak matar as obras do corpo#! (Romanos 8:13) e para #weak punir o corpo e subjugá-lo#! (1 Coríntios 9:27), a mortificação foi central para o ascetismo cristão desde os primeiros séculos. Seus praticantes mais extremos foram os estilitas: São Simeão, o Antigo, passou 37 anos no topo de uma coluna perto de Alepo em constante oração sob calor abrasador e frio congelante.\n\nA autoflagelação espalhou-se pela cristandade ocidental medieval, defendida entre o clero por São Pedro Damião (1007-1072). O movimento flagelante dos séculos XIII e XIV fez com que leigos desfilassem pelas vilas, flagelando-se como penitência em tempos de peste e desastre."
 tenet_mortification_of_the_flesh_latin_desc:0 "Ó Senhor, concedei-nos a graça de crucificar nossa carne com suas paixões e desejos. Por meio do santo sofrimento, possamos participar da Paixão de Cristo e mortificar as obras do corpo, para que possamos verdadeiramente viver.\n\n$pam_galatians_5_24_latin$\n\n[Glossary('Mortificatio Carnis Historical Background','tenet_mortification_of_the_flesh_historical_desc')]"
 tenet_mortification_of_the_flesh_latin_name:0 "Mortificatio Carnis"
 tenet_mortification_of_the_flesh_name:0 "$tenet_mortification_of_the_flesh_default_name$"
 tenet_ora_et_labora_default_desc:0 "Orar é trabalhar e trabalhar é orar. A ociosidade é inimiga da alma; deve-se ser diligente tanto no pensamento quanto na ação.\n\n$pam_proverbs_6_6_default$\n\n[Glossary('To Work Is to Pray Historical Background','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_default_name:0 "Trabalhar é Orar"
 tenet_ora_et_labora_greek_desc:0 "Sem intermissão, dia e noite, os monges devem celebrar o culto divino. Seus coros alternados e salmos sem fim trazem glória à sua Ordem e a Deus.\n\n$pam_proverbs_6_6_greek$\n\n[Glossary('Akoímētoi Historical Background','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_greek_name:0 "Akoímētoi"
 tenet_ora_et_labora_historical_desc:0 "Originado na Regra de São Bento, o lema #weak Ora et labora#! resume o ideal monástico de oração e trabalho. Esperava-se que os monges dedicassem horas específicas do dia à oração comunitária, à meditação pessoal e ao trabalho manual. Esse equilíbrio era visto como essencial para o crescimento espiritual e a disciplina. Os mosteiros beneditinos tornaram-se centros de aprendizado, agricultura e artesanato, contribuindo significativamente para a vida cultural e econômica da Europa medieval."
 tenet_ora_et_labora_latin_desc:0 "Sede obedientes ao vosso superior. Sede pacientes em meio às dificuldades. Aceitai as tarefas mais humildes e considerai-vos servos inúteis.\n#weak Capítulo VII da Regra de São Bento#!\n\n$pam_proverbs_6_6_latin$\n\n[Glossary('Ora et Labora Historical Background','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_latin_name:0 "Ora et Labora"
 tenet_ora_et_labora_name:0 "$tenet_ora_et_labora_default_name$"
 tenet_original_sin_default_desc:0 "Toda a humanidade herda a mancha do primeiro pecado de Adão, da qual somente a graça divina por meio de Cristo pode nos redimir.\n\n$pam_romans_5_12_default$\n\n[Glossary('Original Sin Historical Background','tenet_original_sin_historical_desc')]"
 tenet_original_sin_default_name:0 "Pecado Original"
 tenet_original_sin_greek_desc:0 "Nosso Criador e Autor, nossa é a culpa. Adão e Eva, ouvindo a Satanás, blasfemaram. Por egoísmo, permitiram ser enganados. Enfraqueceram a natureza da humanidade. A imaginação do nosso coração é má.\n\n$pam_romans_5_12_greek$\n\n[Glossary('Propatorikē Hamartía Historical Background','tenet_original_sin_historical_desc')]"
 tenet_original_sin_greek_name:0 "Propatorikē Hamartía"
 tenet_original_sin_historical_desc:0 "A doutrina do pecado original foi desenvolvida extensivamente por Santo Agostinho de Hipona no início do século V, particularmente em resposta à heresia pelagiana, que negava a pecaminosidade herdada. Agostinho ensinou que o pecado de Adão foi transmitido a todos os seus descendentes, corrompendo a natureza humana e tornando a salvação impossível sem a graça divina. O Concílio de Cartago em 418 d.C. confirmou este ensinamento, e ele se tornou uma pedra angular da teologia cristã ocidental. O cristianismo oriental desenvolveu uma compreensão um tanto diferente, enfatizando o pecado ancestral em vez da culpa herdada diretamente."
 tenet_original_sin_latin_desc:0 "Todos os homens perderam sua inocência na prevaricação de Adão. As consequências para a natureza, enfraquecida e inclinada ao mal, persistiram no homem e o convocam à batalha espiritual. \n\n$pam_romans_5_12_latin$\n\n[Glossary('Peccatum Originale Historical Background','tenet_original_sin_historical_desc')]"
 tenet_original_sin_latin_name:0 "Peccatum Originale"
 tenet_original_sin_name:0 "$tenet_original_sin_default_name$"
 tenet_peace_of_god_default_desc:0 "A violência insensata contra nossos irmãos e irmãs é uma afronta a Deus.\n\n[Glossary('Peace of God Historical Background','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_default_name:0 "Paz de Deus"
 tenet_peace_of_god_greek_desc:0 "Os discípulos de Cristo, que fizeram todas as coisas para a paz, devem ser artífices da paz. Aquele que busca a paz busca a Cristo. Sem amor pelos outros, sem uma atitude de paz para com todos os homens, ninguém pode ser chamado de verdadeiro servo de Cristo.\n\n$pam_colossians_3_15_greek$\n\n[Glossary('Ekekheiría Theoũ Historical Background','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_greek_name:0 "Ekekheiría Theoũ"
 tenet_peace_of_god_historical_desc:0 "Ao longo da Idade Média, vários movimentos cristãos buscaram limitar o derramamento de sangue estabelecendo regras formais de engajamento. Do Cáin Adomnáin irlandês no século VII até o movimento da Paz de Deus na França do século X, esses esforços concentraram-se em proteger a propriedade e as pessoas da igreja, limitar a violência contra não-combatentes e restringir a guerra entre a nobreza a tempos e lugares específicos.\n\nEssas regras foram frequentemente estendidas aos não-crentes. O Cânon XXI do Terceiro Concílio de Latrão em 1179 estendeu tréguas periódicas a toda a Cristandade, enquanto o Cânon XXVII convocou a pegar em armas contra cátaros, bascos e outros heréticos."
 tenet_peace_of_god_irish_desc:0 "Conhecida também como a Lei dos Inocentes, estabeleceu regras para garantir a segurança de não-combatentes na guerra. Os transgressores, juntamente com os espectadores que nada fizeram para impedir o crime, ficavam sujeitos a multas seculares e maldições rituais.\n\n$pam_colossians_3_15_default$\n\n[Glossary('Cáin Adomnáin Historical Background','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_irish_name:0 "Cáin Adomnáin"
 tenet_peace_of_god_latin_desc:0 "As tréguas devem ser inviolavelmente observadas desde o Advento até a oitava da Epifania, e qualquer infrator da trégua deve receber a sentença de excomunhão.\n\n$pam_colossians_3_15_latin$\n\n[Glossary('Pax et Treuga Dei  Historical Background','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_latin_name:0 "Pax et Treuga Dei"
 tenet_peace_of_god_name:0 "$tenet_peace_of_god_default_name$"
 tenet_pentarchy_default_desc:0 "A Igreja universal é governada por cinco antigas sedes patriarcais, cada uma com autoridade sobre sua região, mantendo a unidade através da comunhão conciliar.\n\n$pam_matthew_18_20_default$\n\n[Glossary('Pentarchy Historical Background','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_default_name:0 "$tenet_pentarchy_alternate_name$"
 tenet_pentarchy_development_growth_in_holy_sites_toast:0 "Do seu [GetTenetType('tenet_pentarchy').GetName( GetPlayer.GetRite )] princípio pessoal"
 tenet_pentarchy_greek_desc:0 "Nossa Igreja é governada pelos cinco patriarcados estabelecidos nos tempos apostólicos. Cristo está presente onde quer que Seu povo se reúna, e através da pentarquia Sua autoridade é exercida sobre todo o mundo.\n\n$pam_matthew_18_20_greek$\n\n[Glossary('Pentarkhía Historical Background','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_greek_name:0 "Pentarkhía"
 tenet_pentarchy_historical_desc:0 "A Pentarquia foi o modelo de governança da Igreja que reconheceu cinco principais sedes patriarcais: Roma, Constantinopla, Alexandria, Antioquia e Jerusalém. Formalizada pelo Concílio de Calcedônia em 451 d.C., ela refletia o peso político dessas cidades no Império Romano, com cada patriarca governando sua região e as disputas sendo remetidas a concílios ecumênicos.\n\nRoma, reivindicando a supremacia papal, nunca aceitou plenamente o sistema, que o Cerco de Alexandria em 641 d.C. abalou e o Grande Cisma de 1054 despedaçou. A Ortodoxia Oriental continuou honrando o ideal pentárquico, e novos patriarcados surgiram mais tarde na Rússia, Sérvia e em outros lugares."
 tenet_pentarchy_latin_desc:0 "Onde quer que nos reunamos em nome de Cristo, Ele está conosco. As cinco grandes sedes de Roma, Constantinopla, Alexandria, Antioquia e Jerusalém são as colunas da Igreja.\n\n$pam_matthew_18_20_latin$\n\n[Glossary('Quinque Sedes Historical Background','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_latin_name:0 "Quinque Sedes"
 tenet_philanthropia_default_desc:0 "A Fé preza a generosa distribuição de esmolas, o cuidado com os pobres e a caridade institucional como um dever cristão central, seguindo os Padres e o exemplo dos primeiros hospícios e hospitais.\n\n[Glossary('Charity Historical Background','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_default_name:0 "Caridade"
 tenet_philanthropia_greek_desc:0 "Philanthrōpia — amor à humanidade — encontrou sua expressão mais plena nos hospitais, hospícios e esmolas imperiais e eclesiásticas da Nova Roma. Alimentar os famintos e resgatar o cativo é imitar a Cristo, que esvaziou a si mesmo por amor a nós.\n\n[Glossary('Philanthrōpía Historical Background','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_greek_name:0 "Philanthrōpía"
 tenet_philanthropia_historical_desc:0 "No cristianismo bizantino, philanthrōpia nomeava tanto a virtude do amor universal quanto as instituições concretas — hospitais, xenodocheia, orfanatos e esmolas — apoiadas por imperadores, bispos e fiéis. Basílio de Cesareia, João Crisóstomo e imperadores posteriores, como Justiniano, ataram a legitimidade imperial ao cuidado com os necessitados. A Igreja não glorificava a guerra como um caminho para a santidade; ela insistia que a riqueza e o poder eram justificados em parte pela forma como serviam aos pobres."
 tenet_philanthropia_latin_desc:0 "Tudo o que fizestes a um destes meus irmãos mais pequeninos, a mim o fizestes. A esmola e o cuidado com os pobres não são meros deveres cívicos, mas uma forma de se aproximar do próprio Cristo.\n\n[Glossary('Caritas Historical Background','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_latin_name:0 "Caritas"
 tenet_philanthropia_name:0 "$tenet_philanthropia_default_name$"
 tenet_purgatory_default_desc:0 "A purificação final daqueles que morreram em Estado de Graça, deixando neles apenas a santidade necessária para entrar na Alegria do Céu.\n\n$pam_2_macabees_12_44_default$\n\n[Glossary('Purgatory Historical Background','tenet_purgatory_historical_desc')]"
 tenet_purgatory_default_name:0 "Purgatório"
 tenet_purgatory_greek_desc:0 "E as pessoas que estão no céu, por não terem corpo, não podem crescer na Theosis, então nossas orações as ajudam a crescer na Theosis.\n\n$pam_2_macabees_12_44_greek$\n\n[Glossary('Kathartērion Historical Background','tenet_purgatory_historical_desc')]"
 tenet_purgatory_greek_name:0 "Kathartērion"
 tenet_purgatory_historical_desc:0 "A ideia de almas persistindo em um estado de transição a caminho do Céu era amplamente aceita, mas a natureza exata desse estado foi longamente debatida: um lugar real, um estado de espírito, uma metáfora ou uma purificação física, dependendo do teólogo. Santa Catarina de Gênova descreveu-o como um estado de alegria misturado com dor voluntária pelos próprios pecados, enquanto Orígenes de Alexandria escreveu sobre Deus como um fogo consumidor.\n\nA Igreja Católica definiu o Purgatório nos Concílios de Florença (1439) e Trento (1545-63) como uma purificação temporária, ensinando que as orações e boas obras daqueles que ainda vivem beneficiam as almas ali."
 tenet_purgatory_latin_desc:0 "Temo muito mais a punição abaixo, minha alma está ansiosa, em suspenso; já sinto os pesos pesados do primeiro terraço.\n\n$pam_2_macabees_12_44_latin$\n\n[Glossary('Purgatorium Historical Background','tenet_purgatory_historical_desc')]"
 tenet_purgatory_latin_name:0 "Purgatorium"
 tenet_purgatory_name:0 "$tenet_purgatory_default_name$"
 tenet_sacred_childbirth_pregnancy_health:0 "Parto Sagrado"
 tenet_sacred_childbirth_pregnancy_health_desc:0 "Ritos de parto sagrados e cuidado atento fortalecem a saúde desta mãe expectante."
 tenet_scholasticism_court_scholar_effect:0 "Pode nomear um [GetCourtPositionType('court_scholar_court_position').GetName] sem a $tradition_fp3_beacon_of_learning_name$ [culture_tradition|E], a #P sem salário#!"
 tenet_scholasticism_court_scholar_name:0 "$tenet_scholasticism_name$"
 tenet_scholasticism_default_desc:0 "Através da investigação intelectual rigorosa e do método dialético, fé e razão podem ser reconciliadas, e uma compreensão mais profunda da verdade divina alcançada.\n\n$pam_proverbs_1_7_default$\n\n[Glossary('Scholasticism Historical Background','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_default_name:0 "Escolástica"
 tenet_scholasticism_greek_desc:0 "Fé e razão não são opostas, mas complementares, pois Deus nos deu mentes para buscar a verdade e corações para I-lo amar. Através do estudo e da contemplação, ascendemos a um conhecimento superior.\n\n$pam_proverbs_1_7_greek$\n\n[Glossary('Skholastikē Historical Background','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_greek_name:0 "Skholastikē"
 tenet_scholasticism_historical_desc:0 "A Escolástica foi o método de aprendizado dominante nas universidades europeias medievais, atingindo seu auge nos séculos XII e XIII. Buscou reconciliar a teologia cristã com a filosofia clássica, particularmente as obras de Aristóteles.\n\nGrandes pensadores escolásticos como Anselmo de Cantuária, Pedro Abelardo, Alberto Magno e Tomás de Aquino desenvolveram abordagens sistemáticas da teologia que enfatizavam o rigor lógico e a disputa. A Summa Theologica de Tomás de Aquino permanece a conquista suprema do método escolástico, tentando sintetizar todo o conhecimento humano dentro de uma estrutura cristã."
 tenet_scholasticism_latin_desc:0 "A busca pelo conhecimento é uma forma de adoração, pois ao compreender a criação, chegamos mais perto de compreender o Criador. Buscai a sabedoria, e ela vos será dada.\n\n$pam_proverbs_1_7_latin$\n\n[Glossary('Sacra Doctrina Historical Background','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_latin_name:0 "Sacra Doctrina"
 tenet_scholasticism_modifier:0 "$tenet_scholasticism_default_name$"
 tenet_scholasticism_modifier_desc:0 "A busca pelo conhecimento é uma forma de adoração, pois ao compreender a criação, chegamos mais perto de compreender o Criador."
 tenet_scholasticism_name:0 "$tenet_scholasticism_default_name$"
 tenet_simony_default_desc:0 "Deus criou o ouro sob a Terra que Ele nos deu, como um favor aos Seus escolhidos.\n\n$pam_proverbs_21_20_english$\n\n[Glossary('Simony Historical Background','tenet_simony_historical_desc')]"
 tenet_simony_default_name:0 "Simonia"
 tenet_simony_ecclesiastical_purchase_name:0 "a #high $buy_ecclesiastical_title_interaction$#! [interaction|E]"
 tenet_simony_greek_desc:0 "Deus criou o ouro sob a Terra que Ele nos deu, como um favor aos Seus escolhidos.\n\n$pam_proverbs_21_20_greek$\n\n[Glossary('Simōnía Historical Background','tenet_simony_historical_desc')]"
 tenet_simony_greek_name:0 "Simōnía"
 tenet_simony_historical_desc:0 "A prática de vender cargos eclesiásticos, relíquias e práticas. Nomeado em homenagem a Simão Mago, um samaritano que #weak enfeitiçou #! pessoas, que ofereceram dinheiro aos apóstolos pelo batismo.\n\nMúltiplos Sínodos, desde o Sínodo de Elvira em 305 d.C. até o Concílio de Trento em 1545 d.C., condenaram fervorosamente a simonia, impondo as mais severas punições espirituais e leigas. Se uma prática é condenada tantas vezes, por tantos séculos, significa que era bastante comum. Também criticada nas 95 Teses de Martinho Lutero e no Inferno de Dante 19: #weak Ó rapaces, que as coisas de Deus, que devem ser as esposas da Justiça, fazeis fornicar por ouro e prata!#!"
 tenet_simony_latin_desc:0 "Deus criou o ouro sob a Terra que Ele nos deu, como um favor aos Seus escolhidos.\n\n$pam_proverbs_21_20_latin$\n\n[Glossary('Simonia Historical Background','tenet_simony_historical_desc')]"
 tenet_simony_latin_name:0 "Simonia"
 tenet_simony_name:0 "$tenet_simony_default_name$"
 tenet_transubstantiation_default_desc:0 "Antes da consagração tem outro nome, depois chama-se Sangue. E dizeis, Amém, isto é, É verdade.\n\n$pam_luke_22_19_default$\n\n[Glossary('Transubstantiation Historical Background','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_default_name:0 "Transubstanciação"
 tenet_transubstantiation_greek_desc:0 "Mas Ele está presente verdadeira e realmente, de modo que após a consagração do pão e do vinho, o pão é transmutado, transubstanciado, convertido e transformado no próprio Corpo verdadeiro do Senhor.\n\n$pam_luke_22_19_greek$\n\n[Glossary('Metousíōsis Historical Background','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_greek_name:0 "Metousíōsis"
 tenet_transubstantiation_historical_desc:0 "A natureza da presença de Cristo na Eucaristia tem sido objeto de debate teológico desde a Igreja primitiva. Embora a divindade do pão e do vinho como Corpo e Sangue de Cristo raramente fosse disputada, sua natureza exata era fonte de muitos debates, seitas e cismas. A interpretação católica foi desenvolvida posteriormente por Tomás de Aquino no século XIII. Foi formalmente definida pelo Quarto Concílio de Latrão em 1215. Durante a Missa, a substância do pão e do vinho é mudada para a substância do Corpo e Sangue de Cristo, enquanto os acidentes (aparências) do pão e do vinho permanecem."
 tenet_transubstantiation_latin_desc:0 "No sacramento da Eucaristia, contudo, a consagração do pão termina não no nada, mas no corpo de Cristo. Caso contrário, não haveria explicação para como o corpo de Cristo passa a existir sob o sacramento. Pois ele não começa a existir aí através de um movimento local, pois de outra forma cessaria de existir no céu.\n\n$pam_luke_22_19_latin$\n\n[Glossary('Transubstantiatio Historical Background','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_latin_name:0 "Transubstantiatio"
 tenet_transubstantiation_name:0 "$tenet_transubstantiation_default_name$"
 tenet_unrelenting_faith_default_desc:0 "Uma fé que não pode ser abalada por perseguição, dificuldades ou dúvida. Os crentes são chamados a permanecer firmes em suas convicções, independentemente das consequências mundanas.\n\n$pam_hebrews_11_1_default$\n\n[Glossary('Unrelenting Faith Historical Background','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_default_name:0 "$tenet_unrelenting_faith_name$"
 tenet_unrelenting_faith_greek_desc:0 "A fé é a garantia das coisas que se esperam, a convicção das coisas que não se veem. Através de crença inabalável, os fiéis superam todas as provações e perseguições, mantendo-se firmes até a morte.\n\n$pam_hebrews_11_1_greek$\n\n[Glossary('Pístis Akatapónētos Historical Background','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_greek_name:0 "Pístis Akatapónētos"
 tenet_unrelenting_faith_historical_desc:0 "Os exemplos de mártires e confessores foram apresentados como modelos ao longo da história cristã. Desde as primeiras perseguições sob Nero e Diocleciano até julgamentos posteriores, passando por missionários que viajavam e morriam tentando converter populações hostis como Adalberto de Praga, os cristãos eram chamados a manter sua fé mesmo até a morte.\n\nA convicção de que a fé deve ser defendida, mantida e difundida, independentemente do custo, inspirou muitos movimentos monásticos e empreendimentos missionários. As histórias de santos que suportaram tortura e execução por suas crenças serviram para fortalecer a resolução dos fiéis e ofereceram um caminho garantido de salvação."
 tenet_unrelenting_faith_latin_desc:0 "Ó Senhor, fortalecei nossa fé, essa substância das coisas esperadas, essa convicção das coisas não vistas. Que possamos permanecer firmes contra toda adversidade, nunca vacilando em nossa devoção a Vós.\n\n$pam_hebrews_11_1_latin$\n\n[Glossary('Fides Indefessa Historical Background','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_latin_name:0 "Fides Indefessa"
