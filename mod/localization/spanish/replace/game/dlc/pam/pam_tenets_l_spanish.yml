 pam_romans_1_4_english:0 "E declarado Filho de Deus com poder, segundo o espírito de santidade, pela ressurreição dos mortos, Jesus Cristo, nosso Senhor."
 pam_romans_1_4_greek:0 "[Glossary('Roũ horisthentos hyioũ theoũ en dynάmei katà pneũma hagiōsýnēs ex anastάseōs nekrõn, Iēsoũ Christoũ toũ kyríou hēmõn', 'ROMANS_1_4_GREEK_GLOSS')]"
 pam_romans_1_4_latin:0 "[Glossary('Qui praedestinatus est Filius Dei in virtute secundum spiritum sanctificationis ex resurrectione mortuorum Jesu Christi Domini nostri.','ROMANS_1_4_LATIN_GLOSS')]"
 pam_romans_2_13_default:0 "[Glossary('$pam_romans_2_13_english|q$','ROMANS_2_13_GLOSS')]"
 pam_romans_2_13_english:0 "Porque os ouvidores da lei não são justos diante de Deus, mas os praticantes da lei serão justificados."
 pam_romans_2_13_greek:0 "[Glossary('Ou gàr hoi akroataì nómou díkaioi parà tõͅ theõͅ, all hoi poiētaì nómou dikaiōthesontai.','ROMANS_2_13_GREEK_GLOSS')]"
 pam_romans_2_13_latin:0 "[Glossary('Non enim auditores legis justi sunt apud Deum, sed factores legis justificabuntur.','ROMANS_2_13_LATIN_GLOSS')]"
 pam_romans_5_12_default:0 "[Glossary('$pam_romans_5_12_english|q$','ROMANS_5_12_GLOSS')]"
 pam_romans_5_12_default_short:0 "[Glossary('Therefore, just as sin came into the world through one man...','ROMANS_5_12_GLOSS')]"
 pam_romans_5_12_english:0 "Portanto, assim como por um só homem o pecado entrou no mundo, e pelo pecado a morte, assim também a morte passou a todos os homens, porque todos pecaram."
 pam_romans_5_12_greek:0 "[Glossary('Dià toũto hosper di henòs anthropou hē hamartía eis tòn kósmon eisẽlthen kaì dià tẽs hamartías ho thánatos, kaì hoútōs eis pántas anthropous ho thánatos diẽlthen eph ho pántes hemarton', 'ROMANS_5_12_GREEK_GLOSS')]"
 pam_romans_5_12_latin:0 "[Glossary('Propterea sicut per unum hominem peccatum in hunc mundum intravit, et per peccatum mors, et ita in omnes homines mors pertransiit, in quo omnes peccaverunt.','ROMANS_5_12_LATIN_GLOSS')]"
 pam_romans_8_13_default:0 "[Glossary('$pam_romans_8_13_english|q$','ROMANS_8_13_GLOSS')]"
 pam_romans_8_13_default_short:0 "[Glossary('If by the Spirit you put to death the deeds of the body...','ROMANS_8_13_GLOSS')]"
 pam_romans_8_13_english:0 "Porque, se viverdes segundo a carne, morrereis; mas, se pelo Espírito mortificaredes as obras do corpo, vivereis."
 pam_romans_8_13_greek:0 "[Glossary('Ei gàr katà sárka zẽte, méllēte apothneͅskein; ei dè pneúmati tàs práxeis toũ somatos thanatoũte, zesesthe.','ROMANS_8_13_GREEK_GLOSS')]"
 pam_romans_8_13_latin:0 "[Glossary('Si enim secundum carnem vixeritis, moriemini: si autem spiritu facta carnis mortificaveritis, vivetis.','ROMANS_8_13_LATIN_GLOSS')]"
