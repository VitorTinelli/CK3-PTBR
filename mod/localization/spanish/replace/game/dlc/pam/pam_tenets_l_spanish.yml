 pam_philippians_2_6_7_default:0 "[Glossary('$pam_philippians_2_6_7_english|q$','PHILIPPIANS_2_6_7_GLOSS')]"
 pam_philippians_2_6_7_default_short:0 "[Glossary('Who, being in the form of God...','PHILIPPIANS_2_6_7_GLOSS')]"
 pam_philippians_2_6_7_english:0 "O qual, subsistindo em forma de Deus, não julgou como pirataria o ser igual a Deus, antes a si mesmo se esvaziou, assumindo a forma de servo, tornando-se semelhante aos homens."
 pam_philippians_2_6_7_greek:0 "[Glossary('Hòs en morphe theoũ hypárkhōn oukh harpagmòn hēgesato tò eĩnai ĩsa theõͅ, all heautòn ekenōsen morphèn doúlou labon, en homoiomati anthropōn genómenos.','PHILIPPIANS_2_6_7_GREEK_GLOSS')]"
 pam_philippians_2_6_7_latin:0 "[Glossary('Qui cum in forma Dei esset, non rapinam arbitratus est esse se aequalem Deo: sed semetipsum exinanivit formam servi accipiens, in similitudinem hominum factus, et habitu inventus ut homo.','PHILIPPIANS_2_6_7_LATIN_GLOSS')]"
 pam_philippians_4_21_default:0 "[Glossary('$pam_philippians_4_21_english|q$','PHILIPPIANS_4_21_GLOSS')]"
 pam_philippians_4_21_default_short:0 "[Glossary('Greet every saint in Christ Jesus...','PHILIPPIANS_4_21_GLOSS')]"
 pam_philippians_4_21_english:0 "Saudai a todos os santos em Cristo Jesus. Os irmãos que estão comigo vos saúdam."
 pam_philippians_4_21_greek:0 "[Glossary('Aspásasthe pánta hágion en Christo Iēsoũ. aspázontai hymãs hoi sỳn emoì adelphoí.', 'PHILIPPIANS_4_21_GREEK_GLOSS')]"
 pam_philippians_4_21_latin:0 "[Glossary('Salutate omnem sanctum in Christo Jesu.','PHILIPPIANS_4_21_LATIN_GLOSS')]"
 pam_proverbs_1_7_default:0 "[Glossary('$pam_proverbs_1_7_english|q$','PROVERBS_1_7_GLOSS')]"
 pam_proverbs_1_7_default_short:0 "[Glossary('The fear of the Lord is the beginning of knowledge...','PROVERBS_1_7_GLOSS')]"
 pam_proverbs_1_7_english:0 "O temor do Senhor é o princípio do conhecimento; os tolos desprazem a sabedoria e a instrução."
 pam_proverbs_1_7_greek:0 "[Glossary('Arkhe sophías phóbos Kyríou; sýnesin dè agathen pántes hoi poioũntes auten.','PROVERBS_1_7_GREEK_GLOSS')]"
 pam_proverbs_1_7_latin:0 "[Glossary('Timor Domini principium sapientiae. Sapientiam, atque doctrinam stulti despiciunt.','PROVERBS_1_7_LATIN_GLOSS')]"
 pam_proverbs_21_20_default:0 "[Glossary('$pam_proverbs_21_20_english|q$','PROVERBS_21_20_GLOSS')]"
 pam_proverbs_21_20_default_short:0 "[Glossary('Precious treasure remains in the house of the wise...','PROVERBS_21_20_GLOSS')]"
 pam_proverbs_21_20_english:0 "Tesouro precioso permanece na casa do sábio, mas o insensato o devora."
 pam_proverbs_21_20_greek:0 "[Glossary('Thēsauròs epithymētòs anapaúsetai epì stómatos sophoũ, áphrones dè ándres katapíontai autón.', 'PROVERBS_21_20_GREEK_GLOSS')]"
 pam_proverbs_21_20_latin:0 "[Glossary('Thesaurus desiderabilis, et oleum in habitaculo justi: et imprudens homo dissipabit illud.','PROVERBS_21_20_LATIN_GLOSS')]"
 pam_proverbs_31_20_default:0 "[Glossary('$pam_proverbs_31_20_english|q$','PROVERBS_31_20_GLOSS')]"
 pam_proverbs_31_20_default_short:0 "[Glossary('She opens her hand to the poor...','PROVERBS_31_20_GLOSS')]"
 pam_proverbs_31_20_english:0 "Ela abre a mão ao pobre e estende os braços ao necessitado."
 pam_proverbs_31_20_greek:0 "[Glossary('Ithi pròs tòn mýrmēka, o oknēré, kaì zelōson idon tàs hodoùs autoũ kaì genoũ ekeínou sophoteros;', 'PROVERBS_31_20_GREEK_GLOSS')]"
 pam_proverbs_31_20_latin:0 "[Glossary('Manum suam aperuit inopi, et palmas suas extendit ad pauperem.','PROVERBS_31_20_LATIN_GLOSS')]"
 pam_proverbs_6_6_default:0 "[Glossary('$pam_proverbs_6_6_english|q$','PROVERBS_6_6_GLOSS')]"
 pam_proverbs_6_6_default_short:0 "[Glossary('Go to the ant, you lazybones...','PROVERBS_6_6_GLOSS')]"
 pam_proverbs_6_6_english:0 "Vai ter com a formiga, ó preguiçoso; considera os seus caminhos e sê sábio."
 pam_proverbs_6_6_greek:0 "[Glossary('Noesei te parabolen kaì skoteinòn lógon rheseis te sophon kaì ainígmata.', 'PROVERBS_6_6_GREEK_GLOSS')]"
 pam_proverbs_6_6_latin:0 "[Glossary('Vade ad formicam, o piger, et considera vias ejus, et disce sapientiam.','PROVERBS_6_6_LATIN_GLOSS')]"
 pam_psalm_127_3_default:0 "[Glossary('$pam_psalm_127_3_english|q$','PSALM_127_3_GLOSS')]"
 pam_psalm_127_3_english:0 "Os filhos são deveras uma herança do Senhor, o fruto do ventre é uma recompensa."
 pam_psalm_127_3_greek:0 "[Glossary('Idoù hē klēronomía kyríou hyioí, ho misthòs toũ karpoũ tẽs gastrós.','PSALM_127_3_GREEK_GLOSS')]"
 pam_psalm_127_3_latin:0 "[Glossary('Ecce haereditas Domini filii, merces fructus ventris.','PSALM_127_3_LATIN_GLOSS')]"
 pam_psalm_134_2_default:0 "[Glossary('$pam_psalm_134_2_english|q$','PSALM_134_2_GLOSS')]"
 pam_psalm_134_2_default_short:0 "[Glossary('Lift up your hands to the holy place...','PSALM_134_2_GLOSS')]"
 pam_psalm_134_2_english:0 "Levantai as vossas mãos para o santuário e bendizei ao Senhor."
 pam_psalm_134_2_greek:0 "[Glossary('Arate tàs kheĩras hymõn eis tà hágia kaì eulogeĩte tòn Kýrion.','PSALM_134_2_GREEK_GLOSS')]"
 pam_psalm_134_2_latin:0 "[Glossary('In noctibus extollite manus vestras in sancta, et benedicite Dominum.','PSALM_134_2_LATIN_GLOSS')]"
 pam_psalm_144_1_default:0 "[Glossary('$pam_psalm_144_1_english|q$','PSALM_144_1_GLOSS')]"
 pam_psalm_144_1_english:0 "Bendito seja o Senhor, a minha rocha, que adestra as minhas mãos para a guerra e os meus dedos para a peleja."
 pam_psalm_144_1_greek:0 "[Glossary('Eulogētòs kýrios ho theós mou ho didáskōn tàs kheĩrás mou eis parátaxin, toùs daktýlous mou eis pólemon.','PSALM_144_1_GREEK_GLOSS')]"
 pam_psalm_144_1_latin:0 "[Glossary('Benedictus Dominus Deus meus, qui docet manus meas ad proelium, et digitos meos ad bellum.','PSALM_144_1_LATIN_GLOSS')]"
 pam_psalm_150_3_4_default:0 "[Glossary('$pam_psalm_150_3_4_english|q$','PSALM_150_3_4_GLOSS')]"
 pam_psalm_150_3_4_english:0 "Louvai-o ao som de trombeta; louvai-o com saltério e harpa. Louvai-o com adufe e dança; louvai-o com instrumentos de corda e flautas."
 pam_psalm_150_3_4_greek:0 "[Glossary('Aineĩte autòn en ekhōͅ sálpingos, aineĩte autòn en psaltēríōͅ kaì kitháraͅ; aineĩte autòn en tympánōͅ kaì khorõͅ, aineĩte autòn en khordaĩs kaì orgánōͅ.','PSALM_150_3_4_GREEK_GLOSS')]"
 pam_psalm_150_3_4_latin:0 "[Glossary('Laudate eum in sono tubae; laudate eum in psalterio et cithara. Laudate eum in tympano et choro; laudate eum in chordis et organo.','PSALM_150_3_4_LATIN_GLOSS')]"
 pam_psalm_24_1_default:0 "[Glossary('$pam_psalm_24_1_english|q$','PSALM_24_1_GLOSS')]"
 pam_psalm_24_1_english:0 "Do Senhor é a terra e tudo o que nela há, o mundo e aqueles que nela habitam."
 pam_psalm_24_1_greek:0 "[Glossary('Toũ kyríou hē gẽ kaì tò pleroma autẽs, hē oikouménē kaì pántes hoi katoikoũntes en autẽͅ.','PSALM_24_1_GREEK_GLOSS')]"
 pam_psalm_24_1_latin:0 "[Glossary('Domini est terra, et plenitudo ejus; orbis terrarum, et universi qui habitant in eo.','PSALM_24_1_LATIN_GLOSS')]"
 pam_psalm_2_8_default:0 "[Glossary('$pam_psalm_2_8_english|q$','PSALM_2_8_GLOSS')]"
 pam_psalm_2_8_english:0 "Pede-me, e eu te darei as nações por herança e os confins da terra por tua possessão."
 pam_psalm_2_8_greek:0 "[Glossary('Aítēsai par emoũ, kaì dosō soi éthnē tèn klēronomían sou kaì tèn katáskhesín sou tà pérata tẽs gẽs.','PSALM_2_8_GREEK_GLOSS')]"
 pam_psalm_2_8_latin:0 "[Glossary('Postula a me, et dabo tibi gentes hereditatem tuam, et possessionem tuam terminos terrae.','PSALM_2_8_LATIN_GLOSS')]"
 pam_psalm_46_10_default:0 "[Glossary('$pam_psalm_46_10_english|q$','PSALM_46_10_GLOSS')]"
 pam_psalm_46_10_default_short:0 "[Glossary('Be still, and know that I am God...','PSALM_46_10_GLOSS')]"
 pam_psalm_46_10_english:0 "Aquietai-vos e sabei que eu sou Deus! Serei exaltado entre as nações, serei exaltado na terra."
 pam_psalm_46_10_greek:0 "[Glossary('Skholásate kaì gnõte hóti ego eimi ho Theós; hypsōthesomai en toĩs éthnesin, hypsōthesomai en te ge.','PSALM_46_10_GREEK_GLOSS')]"
 pam_psalm_46_10_latin:0 "[Glossary('Vacate, et videte quoniam ego sum Deus: exaltabor in gentibus, et exaltabor in terra.','PSALM_46_10_LATIN_GLOSS')]"
 pam_psalm_51_5_default:0 "[Glossary('$pam_psalm_51_5_english|q$','PSALM_51_5_GLOSS')]"
 pam_psalm_51_5_default_short:0 "[Glossary('Indeed, I was born guilty...','PSALM_51_5_GLOSS')]"
 pam_psalm_51_5_english:0 "Eis que em iniquidade fui gerado, e em pecado me concebeu minha mãe."
 pam_psalm_51_5_greek:0 "[Glossary('Idoù gàr en anomíais synelemphthēn, kaì en hamartíais ekíssēsén me hē metēr mou.','PSALM_51_5_GREEK_GLOSS')]"
 pam_psalm_51_5_latin:0 "[Glossary('Ecce enim in iniquitatibus conceptus sum: et in peccatis concepit me mater mea.','PSALM_51_5_LATIN_GLOSS')]"
 pam_psalm_91_11_default:0 "[Glossary('$pam_psalm_91_11_english|q$','PSALM_91_11_GLOSS')]"
 pam_psalm_91_11_default_short:0 "[Glossary('For he will command his angels concerning you...','PSALM_91_11_GLOSS')]"
 pam_psalm_91_11_english:0 "Porque aos seus anjos dará ordens a teu respeito, para te guardarem em todos os teus caminhos."
 pam_psalm_91_11_greek:0 "[Glossary('Hóti toĩs aggélois autoũ enteleĩtai perì soũ toũ diaphylázai se en pásais taĩs hodoĩs sou.','PSALM_91_11_GREEK_GLOSS')]"
 pam_psalm_91_11_latin:0 "[Glossary('Quoniam angelis suis mandavit de te: ut custodiant te in omnibus viis tuis.','PSALM_91_11_LATIN_GLOSS')]"
 pam_purgatory_prayers_for_the_dead_toast:0 "Da tua [GetTenetType('tenet_purgatory').GetName( GetPlayer.GetRite )]: orações pelos mortos"
 pam_pursuit_of_power_war_victory_toast:0 "Do teu princípio [GetTenetType('tenet_pursuit_of_power').GetName( GetPlayer.GetRite )]"
 pam_revelation_12_1_default:0 "[Glossary('$pam_revelation_12_1_english|q$','REVELATION_12_1_GLOSS')]"
 pam_revelation_12_1_default_short:0 "[Glossary('A great portent appeared in heaven...','REVELATION_12_1_GLOSS')]"
 pam_revelation_12_1_english:0 "Viu-se um grande sinal no céu: uma mulher vestida do sol, com a lua debaixo dos pés e uma coroa de doze estrelas sobre a cabeça."
 pam_revelation_12_1_greek:0 "[Glossary('Kaì sēmeĩon méga ophthē en to ourano, gyne peribeblēménē tòn helion, kaì hē selenē hypokάtō tõn podõn autẽs kaì epì tẽs kephalẽs autẽs stéphanos astérōn dodeka', 'REVELATION_12_1_GREEK_GLOSS')]"
 pam_revelation_12_1_latin:0 "[Glossary('Et signum magnum apparuit in cælo: mulier amicta sole, et luna sub pedibus ejus, et in capite ejus corona stellarum duodecim.','REVELATION_12_1_LATIN_GLOSS')]"
