 pam_tobit_8_7_english:0 "Agora, não por luxúria, mas com fidelidade, tomo esta parenta por esposa. Derrama a tua misericórdia sobre mim e sobre ela, e concede que envelheçamos juntos. Abençoa-nos com filhos."
