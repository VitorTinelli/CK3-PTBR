 pam_1_corinthians_10_16_default:0 "[Glossary('$pam_1_corinthians_10_16_english|q$','1_CORINTHIANS_10_16_GLOSS')]"
 pam_1_corinthians_10_16_default_short:0 "[Glossary('The cup of blessing that we bless...','1_CORINTHIANS_10_16_GLOSS')]"
 pam_1_corinthians_10_16_english:0 "The cup of blessing that we bless, is it not a sharing in the blood of Christ? The bread that we break, is it not a sharing in the body of Christ?"
 pam_1_corinthians_10_16_greek:0 "[Glossary('Tò poterion tẽs eulogías hò eulogoũmen, ouchì koinōnía estin toũ haímatos toũ Christoũ? tòn árton hòn klõmen, ouchì koinōnía toũ somatos toũ Christoũ estín?', '1_CORINTHIANS_10_16_GREEK_GLOSS')]"
 pam_1_corinthians_10_16_latin:0 "[Glossary('Calix benedictionis, cui benedicimus, nonne communicatio sanguinis Christi est? Et panis, quem frangimus, nonne participatio corporis Domini est?','1_CORINTHIANS_10_16_LATIN_GLOSS')]"
 pam_1_corinthians_10_17_default:0 "[Glossary('$pam_1_corinthians_10_17_english|q$','1_CORINTHIANS_10_17_GLOSS')]"
 pam_1_corinthians_10_17_default_short:0 "[Glossary('Because there is one bread...','1_CORINTHIANS_10_17_GLOSS')]"
 pam_1_corinthians_10_17_english:0 "Because there is one bread, we who are many are one body, for we all partake of the one bread."
 pam_1_corinthians_10_17_greek:0 "[Glossary('hóti heĩs ártos, hèn sõma hoi polloí esmen, hoi gàr pántes ek toũ henòs ártou metéchomen.', '1_CORINTHIANS_10_17_GREEK_GLOSS')]"
 pam_1_corinthians_10_17_latin:0 "[Glossary('Quoniam unus panis, unum corpus multi sumus, omnes qui de uno pane participamus.','1_CORINTHIANS_10_17_LATIN_GLOSS')]"
 pam_1_corinthians_1_10_default:0 "[Glossary('$pam_1_corinthians_1_10_english|q$','1_CORINTHIANS_1_10_GLOSS')]"
 pam_1_corinthians_1_10_english:0 "Now I appeal to you, brothers and sisters, by the name of our Lord Jesus Christ, that all of you be in agreement and that #bold there be no divisions among you#! but that you be knit together in the same mind and the same purpose."
 pam_1_corinthians_1_10_greek:0 "[Glossary('Parakalõ dè hymãs, adelphoí, dià toũ onómatos toũ kyríou hēmõn Iēsoũ Christoũ, hína tò autò légēte pántes kaì me e en hymĩn schísmata, ẽte dè katērtisménoi en to auto noï kaì en te aute gnome.', '1_CORINTHIANS_1_10_GREEK_GLOSS')]"
 pam_1_corinthians_1_10_latin:0 "[Glossary('Obsecro autem vos fratres per nomen Domini nostri Jesu Christi: ut idipsum dicatis omnes, et non sint in vobis schismata: sitis autem perfecti in eodem sensu, et in eadem sententia.','1_CORINTHIANS_1_10_LATIN_GLOSS')]"
 pam_1_corinthians_1_18_default:0 "[Glossary('$pam_1_corinthians_1_18_english|q$','1_CORINTHIANS_1_18_GLOSS')]"
 pam_1_corinthians_1_18_default_short:0 "[Glossary('For the message about the cross is foolishness to those who are perishing...','1_CORINTHIANS_1_18_GLOSS')]"
 pam_1_corinthians_1_18_english:0 "For the message about the cross is foolishness to those who are perishing, but to us who are being saved it is the power of God."
 pam_1_corinthians_1_18_greek:0 "[Glossary('Ho lógos gàr ho toũ stauroũ toĩs mèn apollyménois mōría estín, toĩs dè sōͅzoménois hēmĩn dýnamis theoũ estin.','1_CORINTHIANS_1_18_GREEK_GLOSS')]"
 pam_1_corinthians_1_18_latin:0 "[Glossary('Verbum enim crucis pereuntibus quidem stultitia est: iis autem qui salvi fiunt, id est nobis, Dei virtus est.','1_CORINTHIANS_1_18_LATIN_GLOSS')]"
 pam_1_corinthians_1_30_default:0 "[Glossary('$pam_1_corinthians_1_30_english|q$','1_CORINTHIANS_1_30_GLOSS')]"
 pam_1_corinthians_1_30_default_short:0 "[Glossary('Who became for us wisdom from God...','1_CORINTHIANS_1_30_GLOSS')]"
 pam_1_corinthians_1_30_english:0 "God is why you are in Christ Jesus, who became for us wisdom from God, and righteousness and sanctification and redemption."
 pam_1_corinthians_1_30_greek:0 "[Glossary('Ex autoũ dè hymeĩs este en Christo Iēsoũ, hòs egenethē sophía hēmĩn apò theoũ, dikaiosýnē te kaì hagiasmos kaì apolýtrōsis', '1_CORINTHIANS_1_30_GREEK_GLOSS')]"
 pam_1_corinthians_1_30_latin:0 "[Glossary('Ex ipso autem vos estis in Christo Jesu, qui factus est nobis sapientia a Deo, et justitia, et sanctificatio, et redemptio.','1_CORINTHIANS_1_30_LATIN_GLOSS')]"
 pam_1_corinthians_2_7_default:0 "[Glossary('$pam_1_corinthians_2_7_english|q$','1_CORINTHIANS_2_7_GLOSS')]"
 pam_1_corinthians_2_7_default_short:0 "[Glossary('But we speak the wisdom of God, a hidden mystery...','1_CORINTHIANS_2_7_GLOSS')]"
 pam_1_corinthians_2_7_english:0 "But we speak God's wisdom, a hidden mystery, which God decreed before the ages for our glory."
 pam_1_corinthians_2_7_greek:0 "[Glossary('Allà laloũmen theoũ sophían en mystērío ten apokekrymménēn, hen proorisen ho theòs prò tõn aionōn eis dóxan hēmõn', '1_CORINTHIANS_2_7_GREEK_GLOSS')]"
 pam_1_corinthians_2_7_latin:0 "[Glossary('Sed loquimur Dei sapientiam in mysterio, quæ abscondita est, quam praedestinavit Deus ante saecula in gloriam nostram.','1_CORINTHIANS_2_7_LATIN_GLOSS')]"
 pam_1_corinthians_9_22_default:0 "[Glossary('$pam_1_corinthians_9_22_english|q$','1_CORINTHIANS_9_22_GLOSS')]"
 pam_1_corinthians_9_22_english:0 "I have become all things to all people, so that I might by any means save some."
 pam_1_corinthians_9_22_greek:0 "[Glossary('Toĩs pãsin gégona pánta, hína pántōs tinàs sosō.','1_CORINTHIANS_9_22_GREEK_GLOSS')]"
 pam_1_corinthians_9_22_latin:0 "[Glossary('Omnibus omnia factus sum, ut omnes facerem salvos.','1_CORINTHIANS_9_22_LATIN_GLOSS')]"
 pam_1_corinthians_9_27_default:0 "[Glossary('$pam_1_corinthians_9_27_english|q$','1_CORINTHIANS_9_27_GLOSS')]"
 pam_1_corinthians_9_27_default_short:0 "[Glossary('I punish my body and enslave it...','1_CORINTHIANS_9_27_GLOSS')]"
 pam_1_corinthians_9_27_english:0 "But I punish my body and enslave it, so that after proclaiming to others I myself should not be disqualified."
 pam_1_corinthians_9_27_greek:0 "[Glossary('All hypōpiázō mou tò sõma kaì doulagōgõ, me pōs állois kērýxas autòs adókimos génōmai.','1_CORINTHIANS_9_27_GREEK_GLOSS')]"
 pam_1_corinthians_9_27_latin:0 "[Glossary('Sed castigo corpus meum, et in servitutem redigo: ne forte cum aliis praedicaverim, ipse reprobus efficiar.','1_CORINTHIANS_9_27_LATIN_GLOSS')]"
 pam_1_john_1_9_default:0 "[Glossary('$pam_1_john_1_9_english|q$','1_JOHN_1_9_GLOSS')]"
 pam_1_john_1_9_default_short:0 "[Glossary('If we confess our sins, he who is faithful and just will forgive us...','1_JOHN_1_9_GLOSS')]"
 pam_1_john_1_9_english:0 "If we confess our sins, he who is faithful and just will forgive us our sins and cleanse us from all unrighteousness."
 pam_1_john_1_9_greek:0 "[Glossary('Eàn homologõmen tàs hamartías hēmõn, pistós estin kaì díkaios hína aphe hēmĩn tàs hamartías kaì katharíse hēmãs apò pάsēs adikías.', '1_JOHN_1_9_GREEK_GLOSS')]"
 pam_1_john_1_9_latin:0 "[Glossary('Si confiteamur peccata nostra: fidelis est, et justus, ut remittat nobis peccata nostra, et emundet nos ab omni iniquitate.','1_JOHN_1_9_LATIN_GLOSS')]"
 pam_1_kings_19_12_default:0 "[Glossary('$pam_1_kings_19_12_english|q$','1_KINGS_19_12_GLOSS')]"
 pam_1_kings_19_12_default_short:0 "[Glossary('And after the fire a sound of sheer silence...','1_KINGS_19_12_GLOSS')]"
 pam_1_kings_19_12_english:0 "After the earthquake a fire, but the Lord was not in the fire; and after the fire a sound of sheer silence."
 pam_1_kings_19_12_greek:0 "[Glossary('Kaì metà tò pỹr phōnè aúras leptẽs, kakeĩ Kýrios.','1_KINGS_19_12_GREEK_GLOSS')]"
 pam_1_kings_19_12_latin:0 "[Glossary('Et post terraemotum ignis: non in igne Dominus: et post ignem sibilus aurae tenuis.','1_KINGS_19_12_LATIN_GLOSS')]"
 pam_1_peter_2_9_default:0 "[Glossary('$pam_1_peter_2_9_english|q$','1_PETER_2_9_GLOSS')]"
 pam_1_peter_2_9_default_short:0 "[Glossary('But you are a chosen people, a royal priesthood...','1_PETER_2_9_GLOSS')]"
 pam_1_peter_2_9_english:0 "Mas vós sois a geração eleita, o sacerdócio real, a nação santa, o povo adquirido, para que anuncieis as virtudes daquele que vos chamou das trevas para a sua maravilhosa luz."
 pam_1_peter_2_9_greek:0 "[Glossary('Hymeĩs dè génos eklektón, basíleion hierάteuma, éthnos hágion, laòs eis peripoíēsin, hópōs tàs aretàs exaggeílēte toũ ek skótous hymãs kalésantos eis tò thaumastòn autoũ phõs', '1_PETER_2_9_GREEK_GLOSS')]"
 pam_1_peter_2_9_latin:0 "[Glossary('Vos autem genus electum, regale sacerdotium, gens sancta, populus acquisitionis: ut virtutes annuntietis ejus qui de tenebris vos vocavit in admirabile lumen suum.','1_PETER_2_9_LATIN_GLOSS')]"
 pam_1_thessalonians_4_11_default:0 "[Glossary('$pam_1_thessalonians_4_11_english|q$','1_THESSALONIANS_4_11_GLOSS')]"
 pam_1_thessalonians_4_11_default_short:0 "[Glossary('To aspire to live quietly...','1_THESSALONIANS_4_11_GLOSS')]"
 pam_1_thessalonians_4_11_english:0 "E ambicioneis viver em sossego, cuidar dos vossos próprios negócios e trabalhar com vossas próprias mãos, como vos mandamos."
 pam_1_thessalonians_4_11_greek:0 "[Glossary('Kaì philotimeĩsthai hēsychάzein kaì prάssein tà ídia kaì ergάzesthai taĩs chersìn hymõn, kathos hymĩn parēngeílamen', '1_THESSALONIANS_4_11_GREEK_GLOSS')]"
 pam_1_thessalonians_4_11_latin:0 "[Glossary('Et operam detis ut quieti sitis, et ut vestrum negotium agatis, et operemini manibus vestris, sicut præcepimus vobis.','1_THESSALONIANS_4_11_LATIN_GLOSS')]"
 pam_1_thessalonians_5_16_20_default:0 "[Glossary('$pam_1_thessalonians_5_16_20_english|q$','1_THESSALONIANS_5_16_20_GLOSS')]"
 pam_1_thessalonians_5_16_20_default_short:0 "[Glossary('Rejoice always, pray without ceasing...','1_THESSALONIANS_5_16_20_GLOSS')]"
 pam_1_thessalonians_5_16_20_english:0 "Regozijai-vos sempre. Orai sem cessar. Em tudo dai graças, porque esta é a vontade de Deus em Cristo Jesus para convosco. Não extinguais o Espírito. Não desprezeis as profecias."
 pam_1_thessalonians_5_16_20_greek:0 "[Glossary('Pántote chaírete, adialeíptōs proseúchesthe, en pantì eucharistẽite; toũto gàr thélēma theoũ en Christo Iēsoũ eis hymãs. tò pneũma me sbénnyte, prophēteías me exoutheneĩte', '1_THESSALONIANS_5_16_20_GREEK_GLOSS')]"
 pam_1_thessalonians_5_16_20_latin:0 "[Glossary('Semper gaudete. Sine intermissione orate. In omnibus gratias agite: hæc est enim voluntas Dei in Christo Jesu in omnibus vobis. Spiritum nolite extinguere. Prophetias nolite spernere.','1_THESSALONIANS_5_16_20_LATIN_GLOSS')]"
 pam_1_timothy_6_12_default:0 "[Glossary('$pam_1_timothy_6_12_english|q$','1_TIMOTHY_6_12_GLOSS')]"
 pam_1_timothy_6_12_default_short:0 "[Glossary('Fight the good fight of the faith...','1_TIMOTHY_6_12_GLOSS')]"
 pam_1_timothy_6_12_english:0 "Milita o bom combate da fé, tomai posse da vida eterna, para a qual fostes chamados, tendo já feito boa confissão diante de muitas testemunhas."
 pam_1_timothy_6_12_greek:0 "[Glossary('Agōnízou tòn kalòn agõna tẽs písteōs, epilaboũ tẽs aiōníou zōẽs eis hen eklethēs kaì hōmológēsas ten kalen homologían enopion pollõn martýrōn.', '1_TIMOTHY_6_12_GREEK_GLOSS')]"
 pam_1_timothy_6_12_latin:0 "[Glossary('Certa bonum certamen fidei, apprehende vitam aeternam, in qua vocatus es, et confessus bonam confessionem coram multis testibus.','1_TIMOTHY_6_12_LATIN_GLOSS')]"
 pam_2_corinthians_1_21_22_default:0 "[Glossary('$pam_2_corinthians_1_21_22_english|q$','2_CORINTHIANS_1_21_22_GLOSS')]"
 pam_2_corinthians_1_21_22_default_short:0 "[Glossary('He anointed us, set his seal of ownership on us...','2_CORINTHIANS_1_21_22_GLOSS')]"
 pam_2_corinthians_1_21_22_english:0 "Mas o que nos confirma convosco em Cristo e nos ungiu é Deus, o qual também nos selou e deu o penhor do Espírito em nossos corações."
 pam_2_corinthians_1_21_22_greek:0 "[Glossary('Ho dè bebaion hēmãs sỳn hymĩn eis Khristòn kaì khrísas hēmãs theós, ho kaì sphragisámenos hēmãs kaì doùs tòn arrabõna toũ pneúmatos en taĩs kardíais hēmõn.','2_CORINTHIANS_1_21_22_GREEK_GLOSS')]"
 pam_2_corinthians_1_21_22_latin:0 "[Glossary('Qui autem confirmat nos vobiscum in Christo, et qui unxit nos Deus: qui et signavit nos, et dedit pignus Spiritus in cordibus nostris.','2_CORINTHIANS_1_21_22_LATIN_GLOSS')]"
 pam_2_kings_5_18_19_default:0 "[Glossary('$pam_2_kings_5_18_19_english|q$','2_KINGS_5_18_19_GLOSS')]"
 pam_2_kings_5_18_19_english:0 "Nisto perdoe o Senhor a teu servo: quando o meu senhor entra na casa de Rimom para ali adorar, e ele se apoia na minha mão, e eu me encoste na casa de Rimom; quando eu assim me encoste na casa de Rimom, o Senhor perdoe a teu servo isto em paz. E ele lhe disse: Vai em paz."
 pam_2_kings_5_18_19_greek:0 "[Glossary('Kaì en tõͅ eisporeúesthai tòn kýrión mou eis oĩkon Remman proskynẽsai autòn kaì proskyneso en oíkōͅ Remman, hilásetai dè kýrios tõͅ doúlōͅ sou en tõͅ lógōͅ toútōͅ. kaì eĩpen autõͅ; Deũro eis eirenēn.','2_KINGS_5_18_19_GREEK_GLOSS')]"
 pam_2_kings_5_18_19_latin:0 "[Glossary('Quando ingredietur dominus meus templum Remmon ut adoret, et illo innitente super manum meam, si adoravero in templo Remmon, ignoscat mihi Dominus servo tuo pro hac re. Qui dixit ei: Vade in pace.','2_KINGS_5_18_19_LATIN_GLOSS')]"
 pam_2_macabees_12_44_default:0 "[Glossary('$pam_2_macabees_12_44_english|q$','2_MACABEES_12_44_GLOSS')]"
 pam_2_macabees_12_44_default_short:0 "[Glossary('For if he were not expecting that those who had fallen would rise again...','2_MACABEES_12_44_GLOSS')]"
 pam_2_macabees_12_44_english:0 "Porque, se não esperasse que os mortos haveriam de ressucitar, seria vão e supérfluo orar pelos defuntos."
 pam_2_macabees_12_44_greek:0 "[Glossary('Ei gàr me toùs propeptōkótas anastenai prosedóka, perissòn àn en kaì lērodes hypèr nekron proseúkhesthai.','2_MACABEES_12_44_GREEK_GLOSS')]"
 pam_2_macabees_12_44_latin:0 "[Glossary('Nisi enim eos, qui ceciderant, resurrecturos speraret, superfluum videretur et vanum orare pro mortuis.','2_MACABEES_12_44_LATIN_GLOSS')]"
 pam_2_timothy_2_2_default:0 "[Glossary('$pam_2_timothy_2_2_english|q$','2_TIMOTHY_2_2_GLOSS')]"
 pam_2_timothy_2_2_default_short:0 "[Glossary('And what you have heard from me through many witnesses...','2_TIMOTHY_2_2_GLOSS')]"
 pam_2_timothy_2_2_english:0 "E o que de mim ouviste entre muitas testemunhas, confia-o a homens fiéis, que sejam idôneos para ensinar também os outros."
 pam_2_timothy_2_2_greek:0 "[Glossary('Kaì hà ekousas par emoũ dià pollõn martýrōn, taũta paráthọu pistoĩs anthropois, hoítines hikanoì ésontai kaì hetérous didάxai.', '2_TIMOTHY_2_2_GREEK_GLOSS')]"
 pam_2_timothy_2_2_latin:0 "[Glossary('Et quae audisti a me per multos testes, haec commenda fidelibus hominibus, qui idonei erunt et alios docere.','2_TIMOTHY_2_2_LATIN_GLOSS')]"
 pam_2_timothy_2_3_default:0 "[Glossary('$pam_2_timothy_2_3_english|q$','2_TIMOTHY_2_3_GLOSS')]"
 pam_2_timothy_2_3_default_short:0 "[Glossary('Share in suffering like a good soldier of Christ Jesus.','2_TIMOTHY_2_3_GLOSS')]"
 pam_2_timothy_2_3_english:0 "Sofre as aflições como bom soldado de Jesus Cristo."
 pam_2_timothy_2_3_greek:0 "[Glossary('Synkakopάthēson hōs kalòs stratiotēs Christoũ Iēsoũ.', '2_TIMOTHY_2_3_GREEK_GLOSS')]"
 pam_2_timothy_2_3_latin:0 "[Glossary('Labora sicut bonus miles Christi Jesu.','2_TIMOTHY_2_3_LATIN_GLOSS')]"
 pam_2_timothy_3_16_default:0 "[Glossary('$pam_2_timothy_3_16_english|q$','2_TIMOTHY_3_16_GLOSS')]"
 pam_2_timothy_3_16_english:0 "Toda a Escritura é divinamente inspirada e proveitosa para ensinar, para redarguir, para corrigir, para instruir em justiça."
 pam_2_timothy_3_16_greek:0 "[Glossary('Pãsa graphè theópneustos kaì ōphélimos pròs didaskalían, pròs elegmón, pròs epanórthōsin, pròs paideían tèn en dikaiosýnēͅ.','2_TIMOTHY_3_16_GREEK_GLOSS')]"
 pam_2_timothy_3_16_latin:0 "[Glossary('Omnis scriptura divinitus inspirata utilis est ad docendum, ad arguendum, ad corripiendum, ad erudiendum in justitia.','2_TIMOTHY_3_16_LATIN_GLOSS')]"
 pam_2_timothy_4_7_default:0 "[Glossary('$pam_2_timothy_4_7_english|q$','2_TIMOTHY_4_7_GLOSS')]"
 pam_2_timothy_4_7_default_short:0 "[Glossary('I have fought the good fight, I have finished the race...','2_TIMOTHY_4_7_GLOSS')]"
 pam_2_timothy_4_7_english:0 "Combati o bom combate, acabei a carreira, guardei a fé."
 pam_2_timothy_4_7_greek:0 "[Glossary('Tòn kalòn agõna ēgonismai, tòn drómon tetéleka, ten pístin teterēka.', '2_TIMOTHY_4_7_GREEK_GLOSS')]"
 pam_2_timothy_4_7_latin:0 "[Glossary('Bonum certamen certavi, cursum consummavi, fidem servavi.','2_TIMOTHY_4_7_LATIN_GLOSS')]"
 pam_acts_10_38_default:0 "[Glossary('$pam_acts_10_38_english|q$','ACTS_10_38_GLOSS')]"
 pam_acts_10_38_default_short:0 "[Glossary('God anointed Jesus of Nazareth with the Holy Spirit and with power...','ACTS_10_38_GLOSS')]"
 pam_acts_10_38_english:0 "Como Deus ungiu a Jesus de Nazaré com o Espírito Santo e com virtude; o qual andou fazendo o bem e curando a todos os oprimidos do diabo, porque Deus era com ele."
 pam_acts_10_38_greek:0 "[Glossary('Iēsoũn tòn apò Nazaréth, hōs ékhrísen autòn ho theòs pneúmati hagíōͅ kaì dynámei, hòs diẽlthen euergetõn kaì iomenos pántas toùs katadynasteuoménous hypò toũ diabólou, hóti ho theòs ẽn met autoũ.','ACTS_10_38_GREEK_GLOSS')]"
 pam_acts_10_38_latin:0 "[Glossary('Jesum a Nazareth: quomodo unxit eum Deus Spiritu Sancto, et virtute, qui pertransiit benefaciendo, et sanando omnes oppressos a diabolo, quoniam Deus erat cum illo.','ACTS_10_38_LATIN_GLOSS')]"
 pam_acts_13_33_default:0 "[Glossary('$pam_acts_13_33_english|q$','ACTS_13_33_GLOSS')]"
 pam_acts_13_33_default_short:0 "[Glossary('God has fulfilled this promise to us their children by raising Jesus...','ACTS_13_33_GLOSS')]"
 pam_acts_13_33_english:0 "Como também está escrito no salmo segundo: Meu Filho sou eu, hoje te gerei."
 pam_acts_13_33_greek:0 "[Glossary('Hóti taútēn ho theòs ekpeplerōken toĩs téknois hēmõn anastesas Iēsoũn, hōs kaì en to psalmo gégraptai to deutéro; Hyiós mou eĩ sý, ego semeron gegénnēká se.', 'ACTS_13_33_GREEK_GLOSS')]"
 pam_acts_13_33_latin:0 "[Glossary('Quoniam Deus adimplevit filiis nostris resuscitans Jesum, sicut et in psalmo secundo scriptum est: Filius meus es tu, ego hodie genui te.','ACTS_13_33_LATIN_GLOSS')]"
 pam_acts_1_8_default:0 "[Glossary('$pam_acts_1_8_english|q$','ACTS_1_8_GLOSS')]"
 pam_acts_1_8_default_short:0 "[Glossary('But you will receive power when the Holy Spirit has come upon you...','ACTS_1_8_GLOSS')]"
 pam_acts_1_8_english:0 "Mas recebereis a virtude do Espírito Santo que descerá sobre vós, e ser-me-eis testemunhas tanto em Jerusalém como em toda a Judeia e Samaria, e até aos confins da terra."
 pam_acts_1_8_greek:0 "[Glossary('Allà lempsesthe dýnamin epelthóntos toũ hagíou pneúmatos eph hymãs kaì ésesthé mou mártyres én te Ierousalem kaì en pάse te Ioudaía kaì Samarίa kaì héōs eschάtou tẽs gẽs.', 'ACTS_1_8_GREEK_GLOSS')]"
 pam_acts_1_8_latin:0 "[Glossary('Sed accipietis virtutem supervenientis Spiritus Sancti in vos, et eritis mihi testes in Jerusalem, et in omni Judaea, et Samaria, et usque ad ultimum terrae.','ACTS_1_8_LATIN_GLOSS')]"
 pam_acts_2_38_default:0 "[Glossary('$pam_acts_2_38_english|q$','ACTS_2_38_GLOSS')]"
 pam_acts_2_38_default_short:0 "[Glossary('Repent and be baptized every one of you...','ACTS_2_38_GLOSS')]"
 pam_acts_2_38_english:0 "E Pedro lhes disse: Arrependei-vos, e cada um de vós seja batizado em nome de Jesus Cristo para perdão dos pecados; e recebereis o dom do Espírito Santo."
 pam_acts_2_38_greek:0 "[Glossary('Pétros dè pròs autoús; Metanoesate, kaì baptisthetō hékastos hymõn en to onómati Iēsoũ Christoũ eis áphesin tõn hamartiõn hymõn kaì lempsesthe ten dōreàn toũ hagíou pneúmatos.', 'ACTS_2_38_GREEK_GLOSS')]"
 pam_acts_2_38_latin:0 "[Glossary('Petrus vero ad illos: Poenitentiam, inquit, agite, et baptizetur unusquisque vestrum in nomine Jesu Christi in remissionem peccatorum vestrorum: et accipietis donum Spiritus Sancti.','ACTS_2_38_LATIN_GLOSS')]"
 pam_acts_2_4_default:0 "[Glossary('$pam_acts_2_4_english|q$','ACTS_2_4_GLOSS')]"
 pam_acts_2_4_default_short:0 "[Glossary('All of them were filled with the Holy Spirit...','ACTS_2_4_GLOSS')]"
 pam_acts_2_4_english:0 "E todos ficaram cheios do Espírito Santo, e começaram a falar noutras línguas, conforme o Espírito lhes concedia que falassem."
 pam_acts_2_4_greek:0 "[Glossary('Kaì eplesthēsan hápantes pneúmatos hagíou kaì erxanto laleĩn hetérais glossais kathos tò pneũma edídou apophthéngesthai autoĩs.', 'ACTS_2_4_GREEK_GLOSS')]"
 pam_acts_2_4_latin:0 "[Glossary('Et repleti sunt omnes Spiritu Sancto, et coeperunt loqui variis linguis, prout Spiritus Sanctus dabat eloqui illis.','ACTS_2_4_LATIN_GLOSS')]"
 pam_acts_4_32_default:0 "[Glossary('$pam_acts_4_32_english|q$','ACTS_4_32_GLOSS')]"
 pam_acts_4_32_english:0 "E da multidão dos que criam era um o coração e uma a alma, e ninguém dizia que coisa alguma do que possuía era sua própria, mas todas as coisas lhes eram comuns."
 pam_acts_4_32_greek:0 "[Glossary('Toũ dè plethous tõn pisteusántōn ẽn kardía kaì psykhè mía, kaì oudè heĩs ti tõn hyparkhóntōn autõͅ élegen ídion eĩnai, all ẽn autoĩs hápanta koiná.','ACTS_4_32_GREEK_GLOSS')]"
 pam_acts_4_32_latin:0 "[Glossary('Multitudinis autem credentium erat cor unum et anima una: nec quisquam eorum quae possidebat, aliquid suum esse dicebat, sed erant illis omnia communia.','ACTS_4_32_LATIN_GLOSS')]"
 pam_acts_7_59_default:0 "[Glossary('$pam_acts_7_59_english|q$','ACTS_7_59_GLOSS')]"
 pam_acts_7_59_default_short:0 "[Glossary('While they were stoning Stephen, he prayed...','ACTS_7_59_GLOSS')]"
 pam_acts_7_59_english:0 "E apedrejaram a Estêvão, que orava e dizia: Senhor Jesus, recebe o meu espírito."
 pam_acts_7_59_greek:0 "[Glossary('Kaì elithoboloun tòn Stéphanon epikaloúmenon kaì légonta; kýrie Iēsoũ, déxai tò pneũmá mou.', 'ACTS_7_59_GREEK_GLOSS')]"
 pam_acts_7_59_latin:0 "[Glossary('Et lapidabant Stephanum invocantem, et dicentem: Domine Jesu, suscipe spiritum meum.','ACTS_7_59_LATIN_GLOSS')]"
 pam_acts_8_18_default:0 "[Glossary('$pam_acts_8_18_english|q$','ACTS_8_18_GLOSS')]"
 pam_acts_8_18_default_short:0 "[Glossary('Now when Simon saw that the Spirit was given...','ACTS_8_18_GLOSS')]"
 pam_acts_8_18_english:0 "E Simão, vendo que pela imposição das mãos dos apóstolos era dado o Espírito Santo, lhes ofereceu dinheiro,"
 pam_acts_8_18_greek:0 "[Glossary('Idon dè ho Símōn hóti dià tẽs epithéseōs tõn cheirõn tõn apostólōn dídotai tò pneũma prosenenken autoĩs chremata', 'ACTS_8_18_GREEK_GLOSS')]"
 pam_acts_8_18_latin:0 "[Glossary('Cum vidisset autem Simon quia per impositionem manus Apostolorum daretur Spiritus Sanctus, obtulit eis pecuniam.','ACTS_8_18_LATIN_GLOSS')]"
 pam_adaptive_study_rite_cultural_acceptance:0 "Estudou um [rite|E] entre culturas"
