 pam_colossians_2_3_default:0 "[Glossary('$pam_colossians_2_3_english|q$','COLOSSIANS_2_3_GLOSS')]"
 pam_colossians_2_3_default_short:0 "[Glossary('In whom are hidden all the treasures of wisdom and knowledge.','COLOSSIANS_2_3_GLOSS')]"
 pam_colossians_2_3_english:0 "Em quem estão escondidos todos os tesouros da sabedoria e da ciência."
 pam_colossians_2_3_greek:0 "[Glossary('En ho eisin pántes hoi thēsauroì tẽs sophías kaì gnoseōs apókryphoi.', 'COLOSSIANS_2_3_GREEK_GLOSS')]"
 pam_colossians_2_3_latin:0 "[Glossary('In quo sunt omnes thesauri sapientiae, et scientiae absconditi.','COLOSSIANS_2_3_LATIN_GLOSS')]"
 pam_colossians_2_9_default:0 "[Glossary('$pam_colossians_2_9_english|q$','COLOSSIANS_2_9_GLOSS')]"
 pam_colossians_2_9_default_short:0 "[Glossary('For in him the whole fullness of deity dwells bodily...','COLOSSIANS_2_9_GLOSS')]"
 pam_colossians_2_9_english:0 "Porque nele habita corporalmente toda a plenitude da divindade."
 pam_colossians_2_9_greek:0 "[Glossary('Hóti en autõͅ katoikeĩ pãn tò plerōma tẽs theótētos sōmatikõs.','COLOSSIANS_2_9_GREEK_GLOSS')]"
 pam_colossians_2_9_latin:0 "[Glossary('Quia in ipso inhabitat omnis plenitudo divinitatis corporaliter.','COLOSSIANS_2_9_LATIN_GLOSS')]"
 pam_colossians_3_15_default:0 "[Glossary('$pam_colossians_3_15_english|q$','COLOSSIANS_3_15_GLOSS')]"
 pam_colossians_3_15_default_short:0 "[Glossary('And let the peace of Christ rule in your hearts...','COLOSSIANS_3_15_GLOSS')]"
 pam_colossians_3_15_english:0 "E a paz de Cristo para a qual também fostes chamados em um corpo, domine em vossos corações; e sede agradecidos."
 pam_colossians_3_15_greek:0 "[Glossary('Kaì hē eirenē toũ Christoũ brabeuétō en taĩs kardíais hymõn, eis hen kaì eklethēte en henì somati; kaì euchάristoi gínesthe.', 'COLOSSIANS_3_15_GREEK_GLOSS')]"
 pam_colossians_3_15_latin:0 "[Glossary('Et pax Christi exsultet in cordibus vestris, in qua et vocati estis in uno corpore: et grati estote.','COLOSSIANS_3_15_LATIN_GLOSS')]"
 pam_cthonic_redoubts_hike_toast:0 "A Caminhada na Montanha traz Piedade e Plenitude Espiritual"
 pam_cthonic_redoubts_mountain_travel_toast:0 "A Viagem pela Montanha traz Piedade e Plenitude Espiritual"
 pam_ecclesiastes_8_15_default:0 "[Glossary('$pam_ecclesiastes_8_15_english|q$','ECCLESIASTES_8_15_GLOSS')]"
 pam_ecclesiastes_8_15_english:0 "Portanto, louvei eu a alegria, porquanto não há outra felicidade para o homem debaixo do sol senão comer, beber e alegrar-se."
 pam_ecclesiastes_8_15_greek:0 "[Glossary('Kaì epenesa egò sỳn tèn euphrosýnēn, hóti ouk éstin agathòn tõͅ anthropōͅ hypò tòn helion hóti ei mè toũ phageĩn kaì toũ pieĩn kaì toũ euphranthẽnai.','ECCLESIASTES_8_15_GREEK_GLOSS')]"
 pam_ecclesiastes_8_15_latin:0 "[Glossary('Laudavi igitur laetitiam, quod non esset homini bonum sub sole nisi quod comederet et biberet atque gauderet.','ECCLESIASTES_8_15_LATIN_GLOSS')]"
 pam_ephesians_4_3_6_english:0 "Procurando guardar a unidade do espírito pelo vínculo da paz. Há um só corpo e um só Espírito, assim como também fostes chamados em uma só esperança da vossa vocação; um só Senhor, uma só fé, um só batismo."
 pam_ephesians_4_3_6_greek:0 "[Glossary('Spoudázontes tēreĩn ten henótēta toũ pneúmatos en to syndésmõi tẽs eirénēs. Hen sõma kaì hen pneũma, kathos kaì eklethēte en mia elpidi tẽs kléseōs hymõn. Heĩs kýrios, mía pístis, hen báptisma. Heĩs theòs kaì pater pántōn, ho epì pántōn kaì dià pántōn kaì en pãsin.', 'EPHESIANS_4_3_6_GREEK_GLOSS')]"
 pam_ephesians_4_3_6_latin:0 "[Glossary('Solliciti servare unitatem Spiritus in vinculo pacis. Unum corpus, et unus Spiritus, sicut vocati estis in una spe vocationis vestrae. Unus Dominus, una fides, unum baptisma. Unus Deus et Pater omnium, qui est super omnes, et per omnia, et in omnibus nobis.','EPHESIANS_4_3_6_LATIN_GLOSS')]"
 pam_ephesians_5_25_default:0 "[Glossary('$pam_ephesians_5_25_english|q$','EPHESIANS_5_25_GLOSS')]"
 pam_ephesians_5_25_default_short:0 "[Glossary('Husbands, love your wives, just as Christ loved the church...','EPHESIANS_5_25_GLOSS')]"
 pam_ephesians_5_25_english:0 "Maridos, amai vossas mulheres, assim como Cristo amou a igreja e a si mesmo se entregou por ela."
 pam_ephesians_5_25_greek:0 "[Glossary('Hoi ándres, agapãte tàs gynaĩkas, kathos kaì ho Christòs ēgάpēsen ten ekklēsían kaì heautòn parédōken hypèr autẽs', 'EPHESIANS_5_25_GREEK_GLOSS')]"
 pam_ephesians_5_25_latin:0 "[Glossary('Viri, diligite uxores vestras, sicut et Christus dilexit Ecclesiam, et seipsum tradidit pro ea.','EPHESIANS_5_25_LATIN_GLOSS')]"
 pam_ephesians_6_11_default:0 "[Glossary('$pam_ephesians_6_11_english|q$','EPHESIANS_6_11_GLOSS')]"
 pam_ephesians_6_11_default_short:0 "[Glossary('Put on the whole armor of God...','EPHESIANS_6_11_GLOSS')]"
 pam_ephesians_6_11_english:0 "Revesti-vos de toda a armadura de Deus, para que possais ficar firmes contra as ciladas do diabo."
 pam_ephesians_6_11_greek:0 "[Glossary('Endýsasthe ten panoplían toũ theoũ pròs tò dýnasthai hymãs stẽnai pròs tàs methodeías toũ diabólou', 'EPHESIANS_6_11_GREEK_GLOSS')]"
 pam_ephesians_6_11_latin:0 "[Glossary('Induite vos armaturam Dei, ut possitis stare adversus insidias diaboli.','EPHESIANS_6_11_LATIN_GLOSS')]"
 pam_exodus_20_4_default:0 "[Glossary('$pam_exodus_20_4_english|q$','EXODUS_20_4_GLOSS')]"
 pam_exodus_20_4_default_short:0 "[Glossary('You shall not make for yourself an idol...','EXODUS_20_4_GLOSS')]"
 pam_exodus_20_4_english:0 "Não farás para ti imagem de escultura, nem semelhança alguma do que há em cima nos céus, nem embaixo na terra, nem nas águas debaixo da terra."
 pam_exodus_20_4_greek:0 "[Glossary('Ou poiēseis seautō eidōlon oude pantos homoiōma, hosa en tō ouranō anō kai hosa en tē gē katō kai hosa en tois hydasin hypokatō tēs gēs. Ou proskynēseis autois oude mē latreusēs autois.','EXODUS_20_4_GREEK_GLOSS')]"
 pam_exodus_20_4_latin:0 "[Glossary('Non facies tibi sculptile, neque omnem similitudinem quæ est in cælo desuper, et quæ in terra deorsum, nec eorum quae sunt in aquis sub terra.','EXODUS_20_4_LATIN_GLOSS')]"
 pam_galatians_5_14_default:0 "[Glossary('$pam_galatians_5_14_english|q$','GALATIANS_5_14_GLOSS')]"
 pam_galatians_5_14_default_short:0 "[Glossary('For the whole law is summed up in a single commandment...','GALATIANS_5_14_GLOSS')]"
 pam_galatians_5_14_english:0 "Porque toda a lei se cumpre numa só palavra, nesta: Amarás o teu próximo como a ti mesmo."
 pam_galatians_5_14_greek:0 "[Glossary('Ho gàr pãs nómos en henì lógo peplerōtai en to; Agapeseis tòn plēsíon sou hōs seautón.', 'GALATIANS_5_14_GREEK_GLOSS')]"
 pam_galatians_5_14_latin:0 "[Glossary('Omnis enim lex in uno sermone impletur: Diliges proximum tuum sicut teipsum.','GALATIANS_5_14_LATIN_GLOSS')]"
 pam_galatians_5_24_default:0 "[Glossary('$pam_galatians_5_24_english|q$','GALATIANS_5_24_GLOSS')]"
 pam_galatians_5_24_default_short:0 "[Glossary('Those who belong to Christ Jesus have crucified the flesh...','GALATIANS_5_24_GLOSS')]"
 pam_galatians_5_24_english:0 "E os que são de Cristo Jesus crucificaram a carne com as suas paixões e concupiscências."
 pam_galatians_5_24_greek:0 "[Glossary('Hoi dè toũ Khristoũ (Iēsoũ) tèn sárka estaúrōsan sỳn toĩs pathemasin kaì taĩs epithymíais.','GALATIANS_5_24_GREEK_GLOSS')]"
 pam_galatians_5_24_latin:0 "[Glossary('Qui autem sunt Christi, carnem suam crucifixerunt cum vitiis et concupiscentiis.','GALATIANS_5_24_LATIN_GLOSS')]"
 pam_galatians_6_14_default:0 "[Glossary('$pam_galatians_6_14_english|q$','GALATIANS_6_14_GLOSS')]"
 pam_galatians_6_14_default_short:0 "[Glossary('May I never boast of anything except the cross of our Lord Jesus Christ...','GALATIANS_6_14_GLOSS')]"
 pam_galatians_6_14_english:0 "Mas longe esteja de mim gloriar-me, a não ser na cruz de nosso Senhor Jesus Christo, pela qual o mundo está crucificado para mim e eu para o mundo."
 pam_galatians_6_14_greek:0 "[Glossary('Emoì dè me génoito kaukhãsthai ei me en tõͅ staurõͅ toũ kyríou hēmõn Iēsoũ Khristoũ, di hoũ emoì kósmos estaúrōtai kago kósmōͅ.','GALATIANS_6_14_GREEK_GLOSS')]"
 pam_galatians_6_14_latin:0 "[Glossary('Mihi autem absit gloriari, nisi in cruce Domini nostri Jesu Christi: per quem mihi mundus crucifixus est, et ego mundo.','GALATIANS_6_14_LATIN_GLOSS')]"
 pam_genesis_1_28_default:0 "[Glossary('$pam_genesis_1_28_english|q$','GENESIS_1_28_GLOSS')]"
 pam_genesis_1_28_default_short:0 "[Glossary('God blessed them, and God said to them: Be fruitful and multiply...','GENESIS_1_28_GLOSS')]"
 pam_genesis_1_28_english:0 "E Deus os abençoou e lhes disse: Frutificai e multiplicai-vos, e enchei a terra, e sujeitai-a; e dominai sobre os peixes do mar e sobre as aves dos céus e sobre todo o animal que se move sobre a terra."
 pam_genesis_1_28_greek:0 "[Glossary('Kaì eulógēsen autoùs ho Theós, légōn; auxánesthe kaì plēthýnesthe kaì plērosate ten gen kaì katakyrieúsate autes kaì árkhete ton ikhthýōn tes thalássēs kaì ton peteinon toũ ouranoũ kaì pántōn ton ktēnon kaì pásēs tes ges kaì pántōn ton herpeton ton herpóntōn epì tes ges.','GENESIS_1_28_GREEK_GLOSS')]"
 pam_genesis_1_28_latin:0 "[Glossary('Benedixitque illis Deus, et ait: Crescite et multiplicamini, et replete terram, et subjicite eam, et dominamini piscibus maris, et volatilibus caeli, et universis animantibus, quae moventur super terram.','GENESIS_1_28_LATIN_GLOSS')]"
 pam_genesis_2_25_default:0 "[Glossary('$pam_genesis_2_25_english|q$','GENESIS_2_25_GLOSS')]"
 pam_genesis_2_25_english:0 "E ambos estavam nus, o homem e a sua mulher, e não se envergonhavam."
 pam_genesis_2_25_greek:0 "[Glossary('Kaì ẽsan hoi dýo gymnoí, hó te Adàm kaì hē gynè autoũ, kaì ouk ēskhýnonto.','GENESIS_2_25_GREEK_GLOSS')]"
 pam_genesis_2_25_latin:0 "[Glossary('Erat autem uterque nudus, Adam scilicet et uxor ejus: et non erubescebant.','GENESIS_2_25_LATIN_GLOSS')]"
 pam_genesis_3_6_default:0 "[Glossary('$pam_genesis_3_6_english|q$','GENESIS_3_6_GLOSS')]"
 pam_genesis_3_6_default_short:0 "[Glossary('So when the woman saw that the tree was good for food...','GENESIS_3_6_GLOSS')]"
 pam_genesis_3_6_english:0 "E, vendo a mulher que a árvore era boa para se comer, e agradável aos olhos, e árvore desejável para dar entendimento, tomou do seu fruto, e comeu, e deu também a seu marido, que estava com ela, e ele comeu."
 pam_genesis_3_6_greek:0 "[Glossary('Kaì eĩden hē gyne hóti kalòn tò xýlon eis brõsin kaì hóti arestòn toĩs ophthalmoĩs ideĩn kaì hōraĩón estin toũ katanoẽsai, kaì laboũsa toũ karpoũ autoũ éphagen kaì édōken kaì to andrì autẽs met autẽs, kaì éphagon.','GENESIS_3_6_GREEK_GLOSS')]"
 pam_genesis_3_6_latin:0 "[Glossary('Vidit igitur mulier quod bonum esset lignum ad vescendum, et pulchrum oculis, aspectuque delectabile: et tulit de fructu illius, et comedit: deditque viro suo, qui comedit.','GENESIS_3_6_LATIN_GLOSS')]"
 pam_gnostic_learning_piety.t:0 "Doutrinas Gnósticas"
 pam_hebrews_11_1_default:0 "[Glossary('$pam_hebrews_11_1_english|q$','HEBREWS_11_1_GLOSS')]"
 pam_hebrews_11_1_default_short:0 "[Glossary('Now faith is the assurance of things hoped for...','HEBREWS_11_1_GLOSS')]"
 pam_hebrews_11_1_english:0 "Ora, a fé é a certeza das coisas que se esperam, a convicção de fatos que não se vêem."
 pam_hebrews_11_1_greek:0 "[Glossary('Éstin dè pístis elpizomenōn hypóstasis, pragmátōn élenkhos ou blepomenōn.','HEBREWS_11_1_GREEK_GLOSS')]"
 pam_hebrews_11_1_latin:0 "[Glossary('Est autem fides sperandarum substantia rerum, argumentum non apparentium.','HEBREWS_11_1_LATIN_GLOSS')]"
 pam_hebrews_11_38_default:0 "[Glossary('$pam_hebrews_11_38_english|q$','HEBREWS_11_38_GLOSS')]"
 pam_hebrews_11_38_default_short:0 "[Glossary('Of whom the world was not worthy...','HEBREWS_11_38_GLOSS')]"
 pam_hebrews_11_38_english:0 "Dos quais o mundo não era digno, errantes pelos desertos e montes, e pelas covas e cavernas da terra."
 pam_hebrews_11_38_greek:0 "[Glossary('Hōn ouk ēn áxios ho kósmos, epì erēmíais planomenoi kaì óresin kaì spēlaíois kaì taĩs opaĩs tēs gēs.','HEBREWS_11_38_GREEK_GLOSS')]"
 pam_hebrews_11_38_latin:0 "[Glossary('Quibus dignus non erat mundus: in solitudinibus errantes, in montibus, et speluncis, et in cavernis terrae.','HEBREWS_11_38_LATIN_GLOSS')]"
 pam_hebrews_12_1_default:0 "[Glossary('$pam_hebrews_12_1_english|q$','HEBREWS_12_1_GLOSS')]"
 pam_hebrews_12_1_default_short:0 "[Glossary('Therefore, since we are surrounded by so great a cloud of witnesses...','HEBREWS_12_1_GLOSS')]"
 pam_hebrews_12_1_english:0 "Portanto, nós também, pois que estamos rodeados de uma tão grande nuvem de testemunhas, deixemos todo o peso, e o pecado que tão de perto nos rodeia, e corramos com paciência a carreira que nos está proposta."
 pam_hebrews_12_1_greek:0 "[Glossary('Toigaroũn kaì hēmeĩs tosoũton ékhontes perikeímenon hēmĩn néphos martýrōn, ógkon apothémenoi pánta kaì ten euperístaton hamartían, di hypomones tréchōmen tòn prokeímenon hēmĩn agõna', 'HEBREWS_12_1_GREEK_GLOSS')]"
 pam_hebrews_12_1_latin:0 "[Glossary('Ideoque et nos tantam habentes impositam nubem testium, deponentes omne pondus, et circumstans nos peccatum, per patientiam curramus ad propositum nobis certamen.','HEBREWS_12_1_LATIN_GLOSS')]"
 pam_hebrews_12_29_default:0 "[Glossary('$pam_hebrews_12_29_english|q$','HEBREWS_12_29_GLOSS')]"
 pam_hebrews_12_29_default_short:0 "[Glossary('For indeed our God is a consuming fire...','HEBREWS_12_29_GLOSS')]"
 pam_hebrews_12_29_english:0 "Pois, de fato, o nosso Deus é um fogo consumidor."
 pam_hebrews_12_29_greek:0 "[Glossary('Kaì gàr ho theòs hēmõn pỹr katanalískon.', 'HEBREWS_12_29_GREEK_GLOSS')]"
 pam_hebrews_12_29_latin:0 "[Glossary('Etenim Deus noster ignis consumens est.','HEBREWS_12_29_LATIN_GLOSS')]"
 pam_hebrews_13_2_default:0 "[Glossary('$pam_hebrews_13_2_english|q$','HEBREWS_13_2_GLOSS')]"
 pam_hebrews_13_2_english:0 "Não vos esqueçais da hospitalidade para com os estrangeiros, pois por ela alguns, sem o saberem, hospedaram anjos."
 pam_hebrews_13_2_greek:0 "[Glossary('Tẽs philoxenías mè epilanthánesthe, dià taútēs gàr élathón tines xenísantes angélous.','HEBREWS_13_2_GREEK_GLOSS')]"
 pam_hebrews_13_2_latin:0 "[Glossary('Hospitalitatem nolite oblivisci: per hanc enim latuerunt quidam, angelis hospitio receptis.','HEBREWS_13_2_LATIN_GLOSS')]"
 pam_hebrews_1_14_default:0 "[Glossary('$pam_hebrews_1_14_english|q$','HEBREWS_1_14_GLOSS')]"
 pam_hebrews_1_14_default_short:0 "[Glossary('Are not all angels spirits in the divine service...','HEBREWS_1_14_GLOSS')]"
 pam_hebrews_1_14_english:0 "Não são todos eles espíritos ministradores, enviados para servir a favor daqueles que hão de herdar a salvação?"
 pam_hebrews_1_14_greek:0 "[Glossary('Ouchì pántes eisìn leitourgikà pneúmata eis diakonían apostellómena dià toùs méllontas klēronomein sōtērían?', 'HEBREWS_1_14_GREEK_GLOSS')]"
 pam_hebrews_1_14_latin:0 "[Glossary('Nonne omnes sunt administratorii spiritus, in ministerium missi propter eos, qui haereditatem capient salutis?','HEBREWS_1_14_LATIN_GLOSS')]"
 pam_hebrews_1_3_default:0 "[Glossary('$pam_hebrews_1_3_english|q$','HEBREWS_1_3_GLOSS')]"
 pam_hebrews_1_3_default_short:0 "[Glossary('He is the reflection of glory of God...','HEBREWS_1_3_GLOSS')]"
 pam_hebrews_1_3_english:0 "Ele é o resplendor da glória de Deus e a expressão exata do seu ser, sustentando todas as coisas pela palavra do seu poder. Havendo feito a purificação dos pecados, assentou-se à destra da Majestade nas alturas."
 pam_hebrews_1_3_greek:0 "[Glossary('Hòs on apaúgasma tẽs dóxēs kaì charakter tẽs hypostάseōs autoũ, phérōn te tà pánta to rhemati tẽs dynάmeōs autoũ, katharismòn tõn hamartiõn poiēsάmenos ekάthisen en dexia tẽs megalōsýnēs en hypsēloĩs', 'HEBREWS_1_3_GREEK_GLOSS')]"
 pam_hebrews_1_3_latin:0 "[Glossary('Qui cum sit splendor gloriae, et figura substantiae ejus, portansque omnia verbo virtutis suae, purgationem peccatorum faciens, sedet ad dexteram Majestatis in excelsis','HEBREWS_1_3_LATIN_GLOSS')]"
 pam_hesychasm_meditation_toast:0 "Da sua [GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )]: bônus da meditação em quietude no lar"
 pam_hesychasm_stillness_toast:0 "Da sua [GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )]: quietude do coração"
 pam_holy_myron_param_coronation_append:0 ", sua [coronation|E]"
 pam_holy_myron_param_funeral_append:0 ", e os mortos em [funerals|E]"
 pam_isaiah_19_19_default:0 "[Glossary('$pam_isaiah_19_19_english|q$','ISAIAH_19_19_GLOSS')]"
 pam_isaiah_19_19_default_short:0 "[Glossary('There will be an altar to the Lord in the center of the land of Egypt and a pillar to the Lord...','ISAIAH_19_19_GLOSS')]"
 pam_isaiah_19_19_english:0 "Naquele dia haverá um altar ao Senhor no meio da terra do Egito, e uma coluna ao Senhor junto à sua fronteira."
 pam_isaiah_19_19_greek:0 "[Glossary('Te hēméraͅ ekeínēͅ éstai thysiasterion tõͅ kyríōͅ en khoraͅ Aigyptíōn kaì stelē pròs tò hórion autẽs tõͅ kyríōͅ.','ISAIAH_19_19_GREEK_GLOSS')]"
 pam_isaiah_19_19_latin:0 "[Glossary('In die illa erit altare Domini in medio terrae Aegypti, et titulus Domini juxta terminum ejus.','ISAIAH_19_19_LATIN_GLOSS')]"
 pam_isaiah_6_3_default:0 "[Glossary('$pam_isaiah_6_3_english|q$','ISAIAH_6_3_GLOSS')]"
 pam_isaiah_6_3_default_short:0 "[Glossary('Holy, holy, holy is the Lord of hosts...','ISAIAH_6_3_GLOSS')]"
 pam_isaiah_6_3_english:0 "E clamavam uns aos outros, dizendo: Santo, Santo, Santo é o Senhor dos Exércitos; toda a terra está cheia da sua glória."
 pam_isaiah_6_3_greek:0 "[Glossary('Kaì ekékragon héteros pròs tòn héteron kaì élegon; Hágios, hágios, hágios Kýrios Sabaoth, plerēs pãsa hē gẽ tẽs dóxēs autoũ.','ISAIAH_6_3_GREEK_GLOSS')]"
 pam_isaiah_6_3_latin:0 "[Glossary('Et clamabant alter ad alterum, et dicebant: Sanctus, Sanctus, Sanctus, Dominus Deus exercituum, plena est omnis terra gloria ejus.','ISAIAH_6_3_LATIN_GLOSS')]"
 pam_isaiah_7_14_default:0 "[Glossary('$pam_isaiah_7_14_english|q$','ISAIAH_7_14_GLOSS')]"
 pam_isaiah_7_14_default_short:0 "[Glossary('Therefore the Lord himself will give you a sign...','ISAIAH_7_14_GLOSS')]"
 pam_isaiah_7_14_english:0 "Portanto, o Senhor mesmo vos dará um sinal: Eis que a virgem conceberá e dará à luz um filho, e o chamará pelo nome de Emanuel."
 pam_isaiah_7_14_greek:0 "[Glossary('Dià toũto dosei Kýrios autòs hymĩn sēmeĩon; idoù hē parthénos en gastrì héxei, kaì téxetai hyión, kaì kaléseis tò ónoma autoũ Emmanouel.', 'ISAIAH_7_14_GREEK_GLOSS')]"
 pam_isaiah_7_14_latin:0 "[Glossary('Propter hoc dabit Dominus ipse vobis signum: Ecce virgo concipiet, et pariet filium, et vocabitur nomen ejus Emmanuel.','ISAIAH_7_14_LATIN_GLOSS')]"
 pam_james_1_5_default:0 "[Glossary('$pam_james_1_5_english|q$','JAMES_1_5_GLOSS')]"
 pam_james_1_5_default_short:0 "[Glossary('If any of you is lacking in wisdom, ask God...','JAMES_1_5_GLOSS')]"
 pam_james_1_5_english:0 "Se algum de vós tem falta de sabedoria, peça-a a Deus, que a todos dá liberalmente e não o lança em rosto, e ser-lhe-á dada."
 pam_james_1_5_greek:0 "[Glossary('Ei dé tis hymõn leípetai sophías, aiteítō parà toũ didóntos theoũ pãsin haplõs kaì me oneidízontos, kaì dothesetai auto.', 'JAMES_1_5_GREEK_GLOSS')]"
 pam_james_1_5_latin:0 "[Glossary('Si quis autem vestrum indiget sapientia, postulet a Deo, qui dat omnibus affluenter, et non improperat: et dabitur ei.','JAMES_1_5_LATIN_GLOSS')]"
 pam_james_5_16_default:0 "[Glossary('$pam_james_5_16_english|q$','JAMES_5_16_GLOSS')]"
 pam_james_5_16_default_short:0 "[Glossary('Therefore confess your sins to one another...','JAMES_5_16_GLOSS')]"
 pam_james_5_16_english:0 "Portanto, confessai os vossos pecados uns aos outros e orai uns pelos outros, para serdes curados. A súplica do justo é muito poderosa e eficaz."
 pam_james_5_16_greek:0 "[Glossary('Exomologeĩsthe oũn allelois tàs hamartías kaì proseúchesthe hypèr allelōn, hópōs iathẽte. polỳ ischýei déēsis dikaíou energouménē.', 'JAMES_5_16_GREEK_GLOSS')]"
 pam_james_5_16_latin:0 "[Glossary('Confitemini ergo alterutrum peccata vestra, et orate pro invicem ut salvemini: multum enim valet deprecatio justi assidua.','JAMES_5_16_LATIN_GLOSS')]"
 pam_jeremiah_1_5_default:0 "[Glossary('$pam_jeremiah_1_5_english|q$','JEREMIAH_1_5_GLOSS')]"
 pam_jeremiah_1_5_english:0 "Antes que eu te formasse no ventre materno, eu te conheci, e antes que saísses da madre, eu te consagrei."
 pam_jeremiah_1_5_greek:0 "[Glossary('Prò toũ me plásai se en koilíaͅ epístamaí se, kaì prò toũ se exeltheĩn ek metras hēgíaká se.','JEREMIAH_1_5_GREEK_GLOSS')]"
 pam_jeremiah_1_5_latin:0 "[Glossary('Priusquam te formarem in utero, novi te: et antequam exires de vulva, sanctificavi te.','JEREMIAH_1_5_LATIN_GLOSS')]"
 pam_john_10_30_default:0 "[Glossary('$pam_john_10_30_english|q$','JOHN_10_30_GLOSS')]"
 pam_john_10_30_default_short:0 "[Glossary('The Father and I are one...','JOHN_10_30_GLOSS')]"
 pam_john_10_30_english:0 "Eu e o Pai somos um."
 pam_john_10_30_greek:0 "[Glossary('Ego kaì ho pater hén esmen.', 'JOHN_10_30_GREEK_GLOSS')]"
 pam_john_10_30_latin:0 "[Glossary('Ego et Pater unum sumus.','JOHN_10_30_LATIN_GLOSS')]"
 pam_john_19_26_27_default:0 "[Glossary('$pam_john_19_26_27_english|q$','JOHN_19_26_27_GLOSS')]"
 pam_john_19_26_27_default_short:0 "[Glossary('When Jesus saw his mother and the disciple whom he loved standing beside her...','JOHN_19_26_27_GLOSS')]"
 pam_john_19_26_27_english:0 "Quando Jesus viu sua mãe e o discípulo a quem ele amava em pé junto a ela, disse à sua mãe: “Mulher, eis aí o teu filho.” Depois disse ao discípulo: “Eis aí a tua mãe.” E desde aquela hora o discípulo a levou para a sua própria casa."
 pam_john_19_26_27_greek:0 "[Glossary('Iēsoũs oũn idon ten mētéra kaì tòn mathēten parestõta hòn ēgάpa légei te mētrí; Gýnai, íde ho hyiós sou. eĩta légei to mathēte; Íde hē metēr sou. kaì ap ekeínēs tẽs horas élaben ho mathētes auten eis tà ídia.', 'JOHN_19_26_27_GREEK_GLOSS')]"
 pam_john_19_26_27_latin:0 "[Glossary('Cum vidisset ergo Jesus matrem, et discipulum stantem, quem diligebat, dicit matri suae: Mulier, ecce filius tuus. Deinde dicit discipulo: Ecce mater tua. Et ex illa hora accepit eam discipulus in sua.','JOHN_19_26_27_LATIN_GLOSS')]"
 pam_john_1_14_default:0 "[Glossary('$pam_john_1_14_english|q$','JOHN_1_14_GLOSS')]"
 pam_john_1_14_default_short:0 "[Glossary('And the Word became flesh and dwelt among us...','JOHN_1_14_GLOSS')]"
 pam_john_1_14_english:0 "E o Verbo se fez carne e habitou entre nós, e vimos a sua glória, a glória como do filho unigênito de um pai, cheio de graça e de verdade."
 pam_john_1_14_greek:0 "[Glossary('Kaì ho lógos sàrx egéneto kaì eskenōsen en hēmĩn, kaì etheasámetha tèn dóxan autoũ, dóxan hōs monogenoũs parà patrós, plerēs khárites kaì alētheías.','JOHN_1_14_GREEK_GLOSS')]"
 pam_john_1_14_latin:0 "[Glossary('Et Verbum caro factum est, et habitavit in nobis: et vidimus gloriam ejus, gloriam quasi unigeniti a Patre plenum gratiae et veritatis.','JOHN_1_14_LATIN_GLOSS')]"
 pam_john_1_1_default:0 "[Glossary('$pam_john_1_1_english|q$','JOHN_1_1_GLOSS')]"
 pam_john_1_1_default_short:0 "[Glossary('In the beginning was the Word...','JOHN_1_1_GLOSS')]"
 pam_john_1_1_english:0 "No princípio era o Verbo, e o Verbo estava com Deus, e o Verbo era Deus."
 pam_john_1_1_greek:0 "[Glossary('En arche ẽn ho lógos, kaì ho lógos ẽn pròs tòn theón, kaì theòs ẽn ho lógos.', 'JOHN_1_1_GREEK_GLOSS')]"
 pam_john_1_1_latin:0 "[Glossary('In principio erat Verbum, et Verbum erat apud Deum, et Deus erat Verbum.','JOHN_1_1_LATIN_GLOSS')]"
 pam_john_20_23_default:0 "[Glossary('$pam_john_20_23_english|q$','JOHN_20_23_GLOSS')]"
 pam_john_20_23_default_short:0 "[Glossary('If you forgive the sins of any, they are forgiven them...','JOHN_20_23_GLOSS')]"
 pam_john_20_23_english:0 "Se perdoardes os pecados a alguém, sê-lhes perdoados; se os retiverdes, sê-lhes retidos."
 pam_john_20_23_greek:0 "[Glossary('An tinōn aphẽte tàs hamartías aphíentai autoĩs; án tinōn kratẽte kekrátēntai.', 'JOHN_20_23_GREEK_GLOSS')]"
 pam_john_20_23_latin:0 "[Glossary('Quorum remiseritis peccata, remittuntur eis: et quorum retinueritis, retenta sunt.','JOHN_20_23_LATIN_GLOSS')]"
 pam_john_3_5_default:0 "[Glossary('$pam_john_3_5_english|q$','JOHN_3_5_GLOSS')]"
 pam_john_3_5_default_short:0 "[Glossary('No one can enter the kingdom of God without being born of water and Spirit...','JOHN_3_5_GLOSS')]"
 pam_john_3_5_english:0 "Respondeu Jesus: Em verdade, em verdade vos digo que ninguém pode entrar no reino de Deus sem nascer da água e do Espírito."
 pam_john_3_5_greek:0 "[Glossary('Apekríthē Iēsoũs; amen amen légō soi, eàn me tis gennēthe ex hýdatos kaì pneúmatos, ou dýnatai eiseltheĩn eis tèn basileían toũ theoũ.','JOHN_3_5_GREEK_GLOSS')]"
 pam_john_3_5_latin:0 "[Glossary('Respondit Jesus: Amen, amen dico tibi, nisi quis renatus fuerit ex aqua, et Spiritu Sancto, non potest introire in regnum Dei.','JOHN_3_5_LATIN_GLOSS')]"
 pam_john_6_41_default:0 "[Glossary('$pam_john_6_41_english|q$','JOHN_6_41_GLOSS')]"
 pam_john_6_41_default_short:0 "[Glossary('I am the bread that came down from heaven...','JOHN_6_41_GLOSS')]"
 pam_john_6_41_english:0 "Então os judeus começaram a murmurar contra ele porque ele disse: Eu sou o pão que desceu do céu."
 pam_john_6_41_greek:0 "[Glossary('Egóggyzon oũn hoi Ioudaĩoi perì autoũ hóti eĩpen; Ego eimi ho ártos ho katabàs ek toũ ouranoũ', 'JOHN_6_41_GREEK_GLOSS')]"
 pam_john_6_41_latin:0 "[Glossary('Murmurabant ergo Judaei de illo, quia dixisset: Ego sum panis vivus, qui de caelo descendi.','JOHN_6_41_LATIN_GLOSS')]"
 pam_khachkar_building_toast:0 "[GetTenetType('tenet_khachkar').GetName( GetPlayer.GetRite )] [personal_tenet|E]"
 pam_khachkar_grief_toast:0 "Do seu [GetTenetType('tenet_khachkar').GetName( GetPlayer.GetRite )]: luto esculpido em pedra"
 pam_love_thy_neighbor_toast_title:0 "$tenet_love_thy_neighbour_default_name$"
 pam_luke_10_27_default:0 "[Glossary('$pam_luke_10_27_english|q$','LUKE_10_27_GLOSS')]"
 pam_luke_10_27_default_short:0 "[Glossary('You shall love the Lord your God with all your heart...','LUKE_10_27_GLOSS')]"
 pam_luke_10_27_english:0 "Ele respondeu: Amarás ao Senhor teu Deus de todo o teu coração, e de toda a tua alma, e de todas as tuas forças, e de todo o teu entendimento, e ao teu próximo como a ti mesmo."
 pam_luke_10_27_greek:0 "[Glossary('Ho dè apokritheìs eĩpen; Agapeseis kýrion tòn theón sou ex hólēs tẽs kardías sou kaì en hóle te psykhe sou kaì en hóle te ischýï sou kaì en hóle te dianoía sou, kaì tòn plēsíon sou hōs seautón.', 'LUKE_10_27_GREEK_GLOSS')]"
 pam_luke_10_27_latin:0 "[Glossary('Ille respondens dixit: Diliges Dominum Deum tuum ex toto corde tuo, et ex tota anima tua, et ex omnibus viribus tuis, et ex omni mente tua: et proximum tuum sicut teipsum.','LUKE_10_27_LATIN_GLOSS')]"
 pam_luke_16_11_default:0 "[Glossary('$pam_luke_16_11_english|q$','LUKE_16_11_GLOSS')]"
 pam_luke_16_11_default_short:0 "[Glossary('If, then, you have not been faithful with the dishonest wealth...','LUKE_16_11_GLOSS')]"
 pam_luke_16_11_english:0 "Se, pois, não fostes fiéis com as riquezas injustas, quem vos confiará as verdadeira riquezas?"
 pam_luke_16_11_greek:0 "[Glossary('Ei oũn en to adíko mamōna pistoì ouk egénesthe, tò alēthinòn tís hymĩn pisteúsei?', 'LUKE_16_11_GREEK_GLOSS')]"
 pam_luke_16_11_latin:0 "[Glossary('Si ergo in iniquo mammona fideles non fuistis: quod verum est, quis credet vobis?','LUKE_16_11_LATIN_GLOSS')]"
 pam_luke_1_42_default:0 "[Glossary('$pam_luke_1_42_english|q$','LUKE_1_42_GLOSS')]"
 pam_luke_1_42_default_short:0 "[Glossary('Blessed art thou among women...','LUKE_1_42_GLOSS')]"
 pam_luke_1_42_english:0 "Bendita és tu entre as mulheres, e bendito é o fruto do teu ventre."
 pam_luke_1_42_greek:0 "[Glossary('Eulogēménē sỳ en gynaixín, kaì eulogēménos ho karpòs tês koilías sou.', 'LUKE_1_42_GREEK_GLOSS')]"
 pam_luke_1_42_latin:0 "[Glossary('Et exclamavit voce magna, et dixit: Benedicta tu inter mulieres, et benedictus fructus ventris tui.','LUKE_1_42_LATIN_GLOSS')]"
 pam_luke_1_79_default:0 "[Glossary('$pam_luke_1_79_english|q$','LUKE_1_79_GLOSS')]"
 pam_luke_1_79_default_short:0 "[Glossary('To shine upon those who sit in darkness...','LUKE_1_79_GLOSS')]"
 pam_luke_1_79_english:0 "Para alumiar a os que estão assentados nas trevas e na sombra da morte, para guiar os nossos pés pelo caminho da paz."
 pam_luke_1_79_greek:0 "[Glossary('Epiphãnai toĩs en skótei kaì skia thanátou kathēménois, toũ kateuthỹnai toùs pódas hēmõn eis hodòn eirenēs.', 'LUKE_1_79_GREEK_GLOSS')]"
 pam_luke_1_79_latin:0 "[Glossary('Illuminare his qui in tenebris et in umbra mortis sedent: ad dirigendos pedes nostros in viam pacis.','LUKE_1_79_LATIN_GLOSS')]"
 pam_luke_22_19_default:0 "[Glossary('$pam_luke_22_19_english|q$','LUKE_22_19_GLOSS')]"
 pam_luke_22_19_default_short:0 "[Glossary('Then he took a loaf of bread...','LUKE_22_19_GLOSS')]"
 pam_luke_22_19_english:0 "Então tomou um pão e, tendo dado graças, o partiu e lho deu, dizendo: Isto é o meu corpo, que é dado por vós; fazei isto em memória de mim."
 pam_luke_22_19_greek:0 "[Glossary('Kaì labon árton eucharistesas éklasen kaì édōken autoĩs légōn; Toũtó estin tò sõmá mou tò hypèr hymõn didómenon; toũto poieĩte eis ten emen anάmnēsin.', 'LUKE_22_19_GREEK_GLOSS')]"
 pam_luke_22_19_latin:0 "[Glossary('Et accepto pane gratias egit, et fregit, et dedit eis, dicens: Hoc est corpus meum, quod pro vobis datur: hoc facite in meam commemorationem.','LUKE_22_19_LATIN_GLOSS')]"
 pam_luke_5_16_default:0 "[Glossary('$pam_luke_5_16_english|q$','LUKE_5_16_GLOSS')]"
 pam_luke_5_16_default_short:0 "[Glossary('But he would withdraw to deserted places and pray...','LUKE_5_16_GLOSS')]"
 pam_luke_5_16_english:0 "Ele retirava-se para lugares desertos e orava."
 pam_luke_5_16_greek:0 "[Glossary('Autòs dè ēn hypōkhōrõn en taĩs erēmois kaì proseukhómenos.','LUKE_5_16_GREEK_GLOSS')]"
 pam_luke_5_16_latin:0 "[Glossary('Ipse autem secedebat in desertum, et orabat.','LUKE_5_16_LATIN_GLOSS')]"
 pam_malachi_1_11_default:0 "[Glossary('$pam_malachi_1_11_english|q$','MALACHI_1_11_GLOSS')]"
 pam_malachi_1_11_default_short:0 "[Glossary('For from the rising of the sun to its setting my name is great among the nations...','MALACHI_1_11_GLOSS')]"
 pam_malachi_1_11_english:0 "Pois, desde o nascer do sol até o seu ocaso, grande é o meu nome entre as nações, e em todo lugar o incenso é oferecido ao meu nome e uma oferta pura; pois grande é o meu nome entre as nações, diz o Senhor dos Exércitos."
 pam_malachi_1_11_greek:0 "[Glossary('Dióti apò anatolõn hēlíou héōs dysmõn tò ónomá mou dedóxastai en toĩs éthnesin, kaì en pantì tópo thymíama proságetai to onómatí mou kaì thysía kathará, dióti méga tò ónomá mou en toĩs éthnesin, légei Kýrios pantokrátōr.','MALACHI_1_11_GREEK_GLOSS')]"
 pam_malachi_1_11_latin:0 "[Glossary('Ab ortu enim solis usque ad occasum, magnum est nomen meum in gentibus, et in omni loco sacrificatur, et offertur nomini meo oblatio munda: quia magnum est nomen meum in gentibus, dicit Dominus exercituum.','MALACHI_1_11_LATIN_GLOSS')]"
 pam_mark_1_11_default:0 "[Glossary('$pam_mark_1_11_english|q$','MARK_1_11_GLOSS')]"
 pam_mark_1_11_default_short:0 "[Glossary('And a voice came from heaven: You are my Son, the Beloved...','MARK_1_11_GLOSS')]"
 pam_mark_1_11_english:0 "E veio uma voz do céu: Tu és o meu Filho amado; em ti me comprazo."
 pam_mark_1_11_greek:0 "[Glossary('Kaì phōne egéneto ek tõn ouranõn; Sỳ eĩ ho hyiós mou ho agapētós, en soì eudókēsa.', 'MARK_1_11_GREEK_GLOSS')]"
 pam_mark_1_11_latin:0 "[Glossary('Et vox facta est de caelis: Tu es filius meus dilectus, in te complacui.','MARK_1_11_LATIN_GLOSS')]"
 pam_matthew_10_9_default:0 "[Glossary('$pam_matthew_10_9_english|q$','MATTHEW_10_9_GLOSS')]"
 pam_matthew_10_9_default_short:0 "[Glossary('Take no gold, or silver, or copper in your belts.','MATTHEW_10_9_GLOSS')]"
 pam_matthew_10_9_english:0 "Não vos procureis ouro, nem prata, nem cobre em vossos cintos."
 pam_matthew_10_9_greek:0 "[Glossary('Me ktesēsthe chrysòn mēdè árgyron mēdè chalkòn eis tàs zonas hymõn, me peran eis hodòn mēdè dýo chitõnas mēdè hypodemata mēdè rhάbdon, áxios gàr ho ergάtēs tẽs trophẽs autoũ.', 'MATTHEW_10_9_GREEK_GLOSS')]"
 pam_matthew_10_9_latin:0 "[Glossary('Nolite possidere aurum, neque argentum, neque pecuniam in zonis vestris.','MATTHEW_10_9_LATIN_GLOSS')]"
 pam_matthew_12_25_english:0 "Todo reino dividido contra si mesmo é devastado, e nenhuma cidade ou casa dividida contra si mesma subsistirá."
 pam_matthew_12_25_greek:0 "[Glossary('Pãsa basileía meristheĩsa kath heautẽs erēmoũtai, kaì pãsa pólis e oikía meristheĩsa kath heautẽs ou stathésetai.','MATTHEW_12_25_GREEK_GLOSS')]"
 pam_matthew_12_25_latin:0 "[Glossary('Omne regnum divisum contra se desolabitur: et omnis civitas vel domus divisa contra se, non stabit.','MATTHEW_12_25_LATIN_GLOSS')]"
 pam_matthew_12_32_default:0 "[Glossary('$pam_matthew_12_32_english|q$','MATTHEW_12_32_GLOSS')]"
 pam_matthew_12_32_default_short:0 "[Glossary('Whoever speaks a word against the Son of Man will be forgiven...','MATTHEW_12_32_GLOSS')]"
 pam_matthew_12_32_english:0 "Qualquer que disser alguma palavra contra o Filho do Homem, ser-lhe-á perdoado; mas qualquer que falar contra o Espírito Santo, não lhe será perdoado, nem neste século nem no futuro."
 pam_matthew_12_32_greek:0 "[Glossary('Kaì hòs eàn eípe lógon katà toũ hyioũ toũ anthropou, aphethesetai auto; hòs d àn eípe katà toũ pneúmatos toũ hagíou, ouk aphethesetai auto oúte en toúto to aiõni oúte en to méllonti.','MATTHEW_12_32_GREEK_GLOSS')]"
 pam_matthew_12_32_latin:0 "[Glossary('Et quicumque dixerit verbum contra Filium hominis, remittetur ei: qui autem dixerit contra Spiritum Sanctum, non remittetur ei neque in hoc saeculo, neque in futuro.','MATTHEW_12_32_LATIN_GLOSS')]"
 pam_matthew_16_18_default:0 "[Glossary('$pam_matthew_16_18_english|q$','MATTHEW_16_18_GLOSS')]"
 pam_matthew_16_18_default_short:0 "[Glossary('And I tell you, you are Peter, and on this rock I will build my church...','MATTHEW_16_18_GLOSS')]"
 pam_matthew_16_18_english:0 "E eu te digo que tu és Pedro, e sobre esta pedra edificarei a minha igreja, e as portas do inferno não prevalecerão contra ela."
 pam_matthew_16_18_greek:0 "[Glossary('Kago dé soi légō hóti sỳ eĩ Pétros, kaì epì taúte te pétra oikodomesō mou ten ekklēsían kaì pýlai hadou ou katischýsousin autẽs.', 'MATTHEW_16_18_GREEK_GLOSS')]"
 pam_matthew_16_18_latin:0 "[Glossary('Et ego dico tibi, quia tu es Petrus, et super hanc petram aedificabo Ecclesiam meam, et portae inferi non praevalebunt adversus eam.','MATTHEW_16_18_LATIN_GLOSS')]"
 pam_matthew_16_24_default:0 "[Glossary('$pam_matthew_16_24_english|q$','MATTHEW_16_24_GLOSS')]"
 pam_matthew_16_24_default_short:0 "[Glossary('Deny themselves and take up their cross and follow me...','MATTHEW_16_24_GLOSS')]"
 pam_matthew_16_24_english:0 "Então Jesus disse aos seus discípulos: Se alguém quer vir após mim, negue-se a si mesmo, tome a sua cruz e siga-me."
 pam_matthew_16_24_greek:0 "[Glossary('Ei tis thélei opísō mou eltheĩn aparnēsάsthō heautòn kaì arάtō tòn stauròn autoũ kaì akoloutheitō moi.', 'MATTHEW_16_24_GREEK_GLOSS')]"
 pam_matthew_16_24_latin:0 "[Glossary('Tunc Jesus dixit discipulis suis: Si quis vult post me venire, abneget semetipsum, et tollat crucem suam, et sequatur me.','MATTHEW_16_24_LATIN_GLOSS')]"
 pam_matthew_18_10_default:0 "[Glossary('$pam_matthew_18_10_english|q$','MATTHEW_18_10_GLOSS')]"
 pam_matthew_18_10_default_short:0 "[Glossary('Take care that you do not despise one of these little ones...','MATTHEW_18_10_GLOSS')]"
 pam_matthew_18_10_english:0 "Vede que não desprezeis a um destes pequeninos, porque eu vos digo que os seus anjos nos céus sempre veem a face de meu Pai que está nos céus."
 pam_matthew_18_10_greek:0 "[Glossary('Horãte me kataphronesēte henòs tõn mikrõn toútōn, légō gàr hymĩn hóti hoi ággeloi autõn en ouranoĩs dià pantòs blépousin tò prósōpon toũ patrós mou toũ en ouranoĩs.', 'MATTHEW_18_10_GREEK_GLOSS')]"
 pam_matthew_18_10_latin:0 "[Glossary('Videte ne contemnatis unum ex his pusillis: dico enim vobis quia angeli eorum in cælis semper vident faciem Patris mei, qui in caelis est.','MATTHEW_18_10_LATIN_GLOSS')]"
 pam_matthew_18_18_default:0 "[Glossary('$pam_matthew_18_18_english|q$','MATTHEW_18_18_GLOSS')]"
 pam_matthew_18_18_english:0 "Em verdade vos digo que tudo o que ligardes na terra será ligado no céu, e tudo o que desligardes na terra será desligado no céu."
 pam_matthew_18_18_greek:0 "[Glossary('Amèn légō hymĩn, hósa eàn desēte epì tẽs gẽs éstai dedeména en ouranõͅ, kaì hósa eàn lýsēte epì tẽs gẽs éstai lelyména en ouranõͅ.','MATTHEW_18_18_GREEK_GLOSS')]"
 pam_matthew_18_18_latin:0 "[Glossary('Amen dico vobis, quaecumque alligaveritis super terram, erunt ligata et in caelo: et quaecumque solveritis super terram, erunt soluta et in caelo.','MATTHEW_18_18_LATIN_GLOSS')]"
 pam_matthew_18_20_default:0 "[Glossary('$pam_matthew_18_20_english|q$','MATTHEW_18_20_GLOSS')]"
 pam_matthew_18_20_default_short:0 "[Glossary('For where two or three are gathered in my name...','MATTHEW_18_20_GLOSS')]"
 pam_matthew_18_20_english:0 "Pois onde estiverem dois ou três reunidos em meu nome, aí estou eu no meio deles."
 pam_matthew_18_20_greek:0 "[Glossary('Hoũ gάr eisin dýo e treĩs synēgménoi eis tò emòn ónoma, ekeĩ eimi en méso autõn.', 'MATTHEW_18_20_GREEK_GLOSS')]"
 pam_matthew_18_20_latin:0 "[Glossary('Ubi enim sunt duo vel tres congregati in nomine meo, ibi sum in medio eorum.','MATTHEW_18_20_LATIN_GLOSS')]"
 pam_matthew_19_5_default:0 "[Glossary('$pam_matthew_19_5_english|q$','MATTHEW_19_5_GLOSS')]"
 pam_matthew_19_5_default_short:0 "[Glossary('For this reason a man shall leave his father and mother...','MATTHEW_19_5_GLOSS')]"
 pam_matthew_19_5_english:0 "Por esta causa deixará o homem pai e mãe, e se unirá à sua mulher, and os dois serão uma só carne."
 pam_matthew_19_5_greek:0 "[Glossary('Kaì eĩpen; héneka toútou kataleípsei ánthrōpos tòn patéra kaì ten mētéra kaì kollēthesetai te gynaikì autoũ, kaì ésontai hoi dýo eis sárka mían', 'MATTHEW_19_5_GREEK_GLOSS')]"
 pam_matthew_19_5_latin:0 "[Glossary('Et dixit: Propter hoc dimittet homo patrem, et matrem, et adhaerebit uxori suae, et erunt duo in carne una.','MATTHEW_19_5_LATIN_GLOSS')]"
 pam_matthew_22_39_default:0 "[Glossary('$pam_matthew_22_39_english|q$','MATTHEW_22_39_GLOSS')]"
 pam_matthew_22_39_default_short:0 "[Glossary('You shall love your neighbor as yourself...','MATTHEW_22_39_GLOSS')]"
 pam_matthew_22_39_english:0 "E o segundo, semelhante a este, é: Amarás o teu próximo como a ti mesmo."
 pam_matthew_22_39_greek:0 "[Glossary('Deutéra dè homoía aute; Agapeseis tòn plēsíon sou hōs seautón.', 'MATTHEW_22_39_GREEK_GLOSS')]"
 pam_matthew_22_39_latin:0 "[Glossary('Secundum autem simile est huic: Diliges proximum tuum, tamquam teipsum.','MATTHEW_22_39_LATIN_GLOSS')]"
 pam_matthew_25_40_default:0 "[Glossary('$pam_matthew_25_40_english|q$','MATTHEW_25_40_GLOSS')]"
 pam_matthew_25_40_english:0 "Em verdade vos digo que, quando o fizestes a um destes meus pequeninos irmãos, a mim o fizestes."
 pam_matthew_25_40_greek:0 "[Glossary('Amèn légō hymĩn, eph hóson epoiesate henì toútōn tõn adelphõn mou tõn elakhístōn, emoì epoiesate.','MATTHEW_25_40_GREEK_GLOSS')]"
 pam_matthew_25_40_latin:0 "[Glossary('Amen dico vobis, quamdiu fecistis uni ex his fratribus meis minimis, mihi fecistis.','MATTHEW_25_40_LATIN_GLOSS')]"
 pam_matthew_2_2_default:0 "[Glossary('$pam_matthew_2_2_english|q$','MATTHEW_2_2_GLOSS')]"
 pam_matthew_2_2_english:0 "Onde está o recém-nascido rei dos Judeus? Pois vimos a sua estrela no oriente e viemos adorá-lo."
 pam_matthew_2_2_greek:0 "[Glossary('Poũ estin ho tekhtheìs basileùs tõn Ioudaíōn? eídomen gàr autoũ tòn astéra en tẽͅ anatolẽͅ kaì elthomen proskynẽsai autõͅ.','MATTHEW_2_2_GREEK_GLOSS')]"
 pam_matthew_2_2_latin:0 "[Glossary('Ubi est qui natus est rex Judaeorum? vidimus enim stellam ejus in oriente, et venimus adorare eum.','MATTHEW_2_2_LATIN_GLOSS')]"
 pam_matthew_4_1_2_default:0 "[Glossary('$pam_matthew_4_1_2_english|q$','MATTHEW_4_1_2_GLOSS')]"
 pam_matthew_4_1_2_default_short:0 "[Glossary('Then Jesus was led up by the Spirit into the wilderness...','MATTHEW_4_1_2_GLOSS')]"
 pam_matthew_4_1_2_english:0 "Então Jesus foi levado pelo Espírito ao deserto para ser tentado pelo diabo. Jejuou quarenta dias e quarenta noites, e depois teve fome."
 pam_matthew_4_1_2_greek:0 "[Glossary('Tóte ho Iēsoũs anekhthē eis tèn érēmon hypò toũ pneúmatos peirasthēnai hypò toũ diabólou. kaì nēsteúsas hēméras tesserákonta kaì nýktas tesserákonta, hýsteron epeínasen.','MATTHEW_4_1_2_GREEK_GLOSS')]"
 pam_matthew_4_1_2_latin:0 "[Glossary('Tunc Jesus ductus est in desertum a Spiritu, ut tentaretur a diabolo. Et cum jejunasset quadraginta diebus, et quadraginta noctibus, postea esuriit.','MATTHEW_4_1_2_LATIN_GLOSS')]"
 pam_matthew_5_9_default:0 "[Glossary('$pam_matthew_5_9_english|q$','MATTHEW_5_9_GLOSS')]"
 pam_matthew_5_9_default_short:0 "[Glossary('Blessed are the peacemakers...','MATTHEW_5_9_GLOSS')]"
 pam_matthew_5_9_english:0 "Bem-aventurados os pacificadores, pois serão chamados filhos de Deus."
 pam_matthew_5_9_greek:0 "[Glossary('Makάrioi hoi eirēnopoioí, hóti autoì hyioì theoũ klēthesontai.', 'MATTHEW_5_9_GREEK_GLOSS')]"
 pam_matthew_5_9_latin:0 "[Glossary('Beati pacifici: quoniam filii Dei vocabuntur.','MATTHEW_5_9_LATIN_GLOSS')]"
 pam_matthew_6_6_default:0 "[Glossary('$pam_matthew_6_6_english|q$','MATTHEW_6_6_GLOSS')]"
 pam_matthew_6_6_default_short:0 "[Glossary('But whenever you pray, go into your room and shut the door...','MATTHEW_6_6_GLOSS')]"
 pam_matthew_6_6_english:0 "Mas tu, quando orares, entra no teu aposento e, fechada a porta, ora a teu Pai que está em oculto; e teu Pai, que vê em oculto, te recompensará."
 pam_matthew_6_6_greek:0 "[Glossary('Sỳ dè hótan proseúkhēͅ, eíselthe eis tò tameĩón sou kaì kleísas tèn thýran sou próseuXai tõͅ patrí sou tõͅ en tõͅ kryptõͅ; kaì ho pater sou ho blépōn en tõͅ kryptõͅ apodosei soi.','MATTHEW_6_6_GREEK_GLOSS')]"
 pam_matthew_6_6_latin:0 "[Glossary('Tu autem cum oraveris, intra in cubiculum tuum, et clauso ostio, ora Patrem tuum in abscondito: et Pater tuus, qui videt in abscondito, reddet tibi.','MATTHEW_6_6_LATIN_GLOSS')]"
