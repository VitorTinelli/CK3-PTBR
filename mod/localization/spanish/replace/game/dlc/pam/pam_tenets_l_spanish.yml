 pam_tobit_8_7_latin:0 "[Glossary('Et nunc Domine, tu scis quia non luxuriae causa accipio sororem meam, sed sola posteritatis dilectione, in qua benedicatur nomen tuum in saecula saeculorum.','TOBIT_8_7_LATIN_GLOSS')]"
