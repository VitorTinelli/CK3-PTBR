l_spanish:
 UNLOCK_SPREAD_PERSONAL_TENET_INTENT:0 "Desbloqueia a #EMP $spread_personal_tenet_intent$#! [intent|E] em [activities|E] com convidados, permitindo que você aumente [tenet_popularity|E]"
 apa_pam_spread_tenet_guest_title:0 "[first.GetShortUINameNoTooltip|U] [CharWinWins(Character)] Sobre [second.GetShortUINameNoTooltip]"
 apa_pam_spread_tenet_host_title:0 "[first.GetShortUINameNoTooltip|U] [CharWinWins(Character)] Sobre [second.GetShortUINameNoTooltip]"
 pam_spread_tenet_events.0001.desc:0 "A mesa range com boa [ROOT.Char.Custom('GetExpensiveMeal')], e brindes e risos preenchem o aposento.\n\n\"Você parece bem versado em assuntos sagrados\", diz [pam_spread_listener_1.GetTitledFirstName], inclinando-se sobre as travessas repletas de [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit')]. \"Continue.\"\n\nA mesa silencia — uma audiência calorosa e disposta a ouvir..."
 pam_spread_tenet_events.0001.t:0 "Conversa de Mesa"
 pam_spread_tenet_events.0101.desc:0 "Uma breve pausa na caçada. Sentamo-nos perto da fogueira, com [ROOT.Char.Custom('GetRandomRegionalSmallGame')] pingando no espeto.\n\n\"Uma caçada como esta volta a alma para coisas mais elevadas\", murmura [pam_spread_listener_1.GetTitledFirstName], com os olhos fixos nas chamas.\n\nLuz da fogueira, silêncio e ouvidos dispostos a escutar."
 pam_spread_tenet_events.0101.t:0 "Ao Redor da Fogueira"
 pam_spread_tenet_events.0201.desc:0 "As listas estão vazias entre as lutas. Escudeiros arrastam lanças estilhaçadas enquanto a multidão busca sombra e fofoca.\n\n\"Cada vencedor agradece a [ROOT.Char.GetFaith.HighGodName], e cada perdedor amaldiçoa a [ROOT.Char.GetFaith.DevilName]\", graceja [pam_spread_listener_1.GetTitledFirstName] do banco ao meu lado. \"Será que algum deles se pergunta o porquê?\"\n\nUma calmaria, um banco de nobres ociosos e uma pergunta no ar."
 pam_spread_tenet_events.0201.t:0 "Entre as Lutas"
 pam_spread_tenet_events.0301.desc:0 "Taça após taça é erguida — aos recém-casados, aos herdeiros ainda não nascidos.\n\n\"E a [ROOT.Char.GetFaith.HighGodName], que une todas as almas!\", acrescenta [pam_spread_listener_1.GetTitledFirstName], sob um murmúrio de aprovação.\n\nCorações se abrem — ao amor, à esperança, às coisas sagradas. Palavras ditas nesta hora criarão raízes."
 pam_spread_tenet_events.0301.t:0 "Um Brinde à Convicção"
 pam_spread_tenet_events.0401.desc:0 "Os enlutados se aglomeram em pequenos grupos, murmurando sobre o falecido e sobre o destino comum a todos nós.\n\n\"A eternidade reclama cada um de nós no fim\", [pam_spread_listener_1.GetTitledFirstName] murmura perto do meu ombro. \"E ainda assim discutimos por frivolidades.\"\n\nTalvez o luto tenha aberto uma alma..."
 pam_spread_tenet_events.0401.t:0 "Palavras no Velório"
 pam_spread_tenet_events.forbidden.desc:0 "\n\nMas a convicção no meu coração é [spread_tenet.GetBaseName] — uma crença que minha fé condena. Exprimir isso nesta companhia é colocar meu destino nas mãos de quem me escuta."
 pam_spread_tenet_forbidden_flavor:0 "Nem todo ouvido voltado para mim é amigável..."
 pam_spread_tenet_option_decline:0 "Outra hora, talvez."
 pam_spread_tenet_option_forbidden:0 "A verdade vale o risco. Aproxime-se."
 pam_spread_tenet_option_preach:0 "Ouça aquilo em que acredito!"
 pam_spread_tenet_option_scripture:0 "As próprias escrituras falam por mim."
 pam_spread_tenet_overheard_toast:0 "Ouvidos Inamistosos"
 spread_personal_tenet_intent:0 "Evangelizar Princípio"
 spread_personal_tenet_intent_desc:0 "Você deseja pregar seu [personal_tenet|E] a convidados receptivos, para que o adotem como próprio, aumentando [tenet_popularity|E]."
 spread_personal_tenet_intent_not_valid_desc:0 "Você não possui mais um [personal_tenet|E]"
