 pam_develop_clerical_court_decision_tt:0 "Você reúne sua casa e escolhe #EMP um#! dos seguintes:\n$EFFECT_LIST_BULLET$ Até [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] [courtiers|E] leigos se juntam ao [clergy|E], cada um concedendo [piety_i][piety|E] extra\n$EFFECT_LIST_BULLET$ Até [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] [clergy|E] da corte ganham [learning_i][learning|E] e [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] ou [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [trait|E] / [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ Até [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] noviços das terras ao redor entram para sua corte e o [clergy|E]\n\nQualquer que seja o caminho escolhido, você ganha [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_piety_reward_value')|V0] [piety_i][piety|E]\n\n#weak As recompensas aumentam com sua [learning|E], [piety_level|E] e [traits|E] religiosas; ocasionalmente, uma oportunidade rara se apresenta#!"
