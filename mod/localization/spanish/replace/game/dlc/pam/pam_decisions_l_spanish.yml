 pam_antipope_events.0001.desc.intro:0 "Tudo em [ROOT.Char.GetRite.GetName] parece estar reunido neste [ROOT.Char.GetFaith.HouseOfWorship].\n\n"
 pam_antipope_events.0001.desc.self:0 "Eu ergo minha mão bem alto no ar. O governo falso de [pope.GetTitledFirstName] logo chegará ao fim. Cabe a mim guiar o rebanho maltratado de [pope.GetHerHis] agora."
 pam_antipope_events.0001.desc.sponsor:0 "\"Que os arautos proclamam que #EMP eu#! sou o verdadeiro [ROOT.Char.GetFaith.ReligiousHeadName|U]!\" [antipope.GetTitledFirstName] ruge. \"Que todos saibam que o falso [pope.GetTitledFirstName] se esconde no palácio de [pope.GetHerHis] em [pope_capital.GetName] enquanto os fiéis correm maltratados e desguidados!\"\n\n[antipope.GetSheHe|U] se vira em minha direção. \"Mas não temas mais. O piadoso [ROOT.Char.GetTitledFirstName] resolveu dar fim às vossas dores. E eu junto a [ROOT.Char.GetHerHim].\""
 pam_antipope_events.0001.t:0 "Um [ROOT.Char.GetFaith.ReligiousHeadName|U] Rival"
 pam_antipope_events.0002.a:0 "Um $anti_religious_head_name$ rival...?"
