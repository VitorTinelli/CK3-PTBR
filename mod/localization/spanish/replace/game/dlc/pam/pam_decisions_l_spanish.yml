 pam_antipope_events.0002.desc.challenger_sponsor:0 "Saiba que eu, [sponsor.GetTitledFirstName], levantei [antipope.GetTitledFirstName]"
 pam_antipope_events.0002.desc.outro:0 "como um [ROOT.Char.GetFaith.ReligiousHeadName|U] rival, para me opor ao falso [pope.GetTitledFirstName] e guiar os fiéis de [antipope.GetRite.GetName] como nossa tradição exige."
 pam_antipope_events.0002.opening:0 "Ao [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetTitledFirstNameNoTooltip],"
 pam_bull_events.0001.a.flavor:0 "#EMP Em nome do Senhor.#!"
 pam_bull_events.0001.a:0 "#EMP In nomine Domini.#!"
 pam_bull_events.0001.desc:0 "\"Exorto a todos vós a vos opordes aos infiéis de [title.GetName], a livrardes a terra de sua tirania e a arrancardes muitos milhares de vossos irmãos cativos de suas mãos.\"\n\n\"Para que a dignidade do nome cristão seja aumentada em vosso tempo, e que o vosso valor, que é louvado em todo o mundo, permaneça intacto e inabalável.\""
 pam_bull_events.0001.t:0 "A Bula de [GetCurrentDate.GetYear]"
 pam_bull_events.0002.a.flavor:0 "$pam_bull_events.0001.a.flavor$"
 pam_bull_events.0002.a:0 "$pam_bull_events.0001.a$"
 pam_bull_events.0002.desc.tenet_forbidden:0 "\"A doutrina de [tenet_scope.GetName( ROOT.GetCharacter.GetRite )] agora não tem lugar em nosso lar. Que qualquer um que a pratique saiba que está violando a santidade da Igreja e que pecou mortalmente.\""
 pam_bull_events.0002.desc.tenet_permitted:0 "\"Que qualquer um de vós que acredite em [tenet_scope.GetName( ROOT.GetCharacter.GetRite )] saiba que agora é permitido sob a permissão de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].\""
 pam_bull_events.0002.t:0 "$pam_bull_events.0001.t$"
 pam_bull_events.0003.a.flavor:0 "$pam_bull_events.0001.a.flavor$"
 pam_bull_events.0003.a:0 "$pam_bull_events.0001.a$"
 pam_bull_events.0003.desc.heresiarch:0 "e seu líder [heresiarch.GetTitledFirstName] será conhecido como herearca.\""
 pam_bull_events.0003.desc.no_heresiarch:0 "para os séculos vindouros.\""
 pam_bull_events.0003.desc:0 "\"Para dar fim ao mal de [heresy_rite.GetName], com autoridade apostólica, eu condeno todos eles como heréticos, e eles jazerão sob um anátema perpétuo,"
 pam_bull_events.0003.t:0 "$pam_bull_events.0001.t$"
 pam_bull_events.0004.a:0 "Assim seja."
 pam_bull_events.0004.b:0 "Vou me converter a [bull_issuer.GetRite.GetNameNoTooltip]."
 pam_bull_events.0004.c:0 "Em nome de [ROOT.GetCharacter.GetFaith.HighGodName]!"
 pam_bull_events.0004.desc.crusade:0 "Exorto a todos vós a vos opordes aos infiéis de [title.GetName]."
 pam_bull_events.0004.desc.fallback:0 "[bull_issuer.GetTitledFirstName] emitiu uma nova bula para todos os governantes da fé."
 pam_bull_events.0004.desc.heresy:0 "Que seja sabido por todos que [heresy_rite.GetName] agora é anátema e seus seguidores heréticos."
 pam_bull_events.0004.desc.tenet_forbidden:0 "\"A doutrina de [tenet_scope.GetName( ROOT.GetCharacter.GetRite )] não tem lugar entre os fiéis a partir deste dia. Quem a praticar ofende a santidade da Igreja e peca mortalmente.\""
 pam_bull_events.0004.desc.tenet_permitted:0 "\"Que qualquer um de vós que acredite em [tenet_scope.GetName( ROOT.GetCharacter.GetRite )] saiba que agora é permitido sob a permissão de [bull_issuer.GetPrimaryTitle.GetNameNoTierNoTooltip].\""
 pam_bull_events.0004.opening:0 "Ao [ROOT.GetCharacter.GetFaith.GetAdjectiveNoTooltip] [ROOT.GetCharacter.GetTitledFirstNameNoTooltip],"
 pam_bull_events.desc.intro:0 "Eu, [ROOT.Char.GetTitledFirstNameNoTooltip], servo dos servos de Deus, aos meus amadíssimos filhos em Cristo:\n\n"
 pam_bull_events.desc.outro:0 "\n\n#EMP Dado em [ROOT.Char.GetCurrentLocation.GetName], em [GetCurrentDate.GetStringLong]#!"
 pam_cardinal_endow_masses_decision:0 "Dotar Missas"
 pam_cardinal_endow_masses_decision_confirm:0 "Selar a doação"
 pam_cardinal_endow_masses_decision_desc:0 "Os benefícios do meu cargo chegam com enfadonha regularidade, e o que não é gasto ainda deve ser prestado contas.\n\nQue sejam destinados a capelas, para que padres sejam pagos para cantar pelos mortos em perpetuidade. A dotação será registrada, selada e lida em cada igreja sob meus cuidados."
 pam_cardinal_endow_masses_decision_subordinates_tt:0 "O seu [subordinate|E] [clergy|E] ganha [piety|E] e [opinion|E] de você"
 pam_cardinal_endow_masses_decision_toast:0 "Missas Dotadas"
 pam_cardinal_endow_masses_decision_tooltip:0 "Gaste [treasury|E] para ganhar [piety|E]. O seu [subordinate|E] [clergy|E] ganha [piety|E] e [opinion|E] de você"
 pam_cardinal_endowed_masses_opinion:0 "Missas Dotadas"
 pam_cause_great_schism_decision:0 "Causar o Grande Cisma"
 pam_cause_great_schism_decision_confirm:0 "Deixar a velha ordem quebrar"
 pam_cause_great_schism_decision_desc:0 "A comunhão está quebrada. Com um golpe decisivo, posso forçar uma nova ordem a surgir."
 pam_cause_great_schism_decision_tooltip:0 "Forçar uma resolução da crise cristã."
 pam_caused_great_schism_character_modifier:0 "$pam_caused_great_schism_dynasty_modifier$"
 pam_caused_great_schism_character_modifier_desc:0 "Este personagem forçou uma ruptura final no mundo cristão, colocando os fiéis em caminhos divergentes por gerações."
 pam_caused_great_schism_dynasty_modifier:0 "Ruptores da Comunhão"
 pam_caused_great_schism_dynasty_modifier_desc:0 "Esta dinastia forçou uma ruptura final no mundo cristão, colocando os fiéis em caminhos divergentes por gerações."
 pam_clerical_court_instruct_toast:0 "[pam_clerical_instructed.GetShortUIName] Cresce em Sabedoria"
 pam_clerical_court_joins_clergy_tt:0 "Entra para o [clergy|E] de [pam_clerical_patron.GetFaith.GetName]"
 pam_clerical_court_ordain_toast:0 "[pam_clerical_ordained.GetShortUIName] Entra para o Clero"
 pam_clerical_court_recruit_toast:0 "[pam_clerical_novice_current.GetShortUIName] Atende ao Chamado"
 pam_confession_penalty_modifier:0 "Penalidade de Confissão"
 pam_confession_penalty_modifier_desc:0 "Este personagem deve realizar uma ação a pedido de seu confessor"
 pam_confession_penalty_var.no_war_toast:0 "Você prometeu não declarar nenhuma guerra"
 pam_convert_theocracy_to_feudal_decision:0 "Restaurar o Governo Temporal"
 pam_convert_theocracy_to_feudal_decision_confirm:0 "Retornar o Reino ao [ROOT.Char.GetWomenMen|U] Mortal"
 pam_convert_theocracy_to_feudal_decision_desc:0 "Como a autoridade nominal da lei de [ROOT.Char.GetFaith.HighGodNamePossessive|U], [ROOT.Char.GetFaith.GetAdherentNamePlural] olham para mim em busca de orientação espiritual. Infelizmente, sinto-me inadequado para a tarefa e repudio tais julgamentos ao meu [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]. \n\nMinha experiência está no temporal, e é justo que eu assuma uma coroa secular! Que o povo saiba que quem manda sou eu, e não [ROOT.Char.GetFaith.PriestNeuterPlural], ou mesmo [ROOT.Char.GetFaith.HighGodName]."
 pam_convert_theocracy_to_feudal_decision_tooltip:0 "Converter seu [realm|E] em [feudal|E] em vez de [theocracy|E]"
 pam_convert_to_theocracy_decision:0 "Adotar Regra Teocrática"
 pam_convert_to_theocracy_decision_confirm:0 "Exercer Autoridade de [ROOT.Char.GetFaith.HighGodNamePossessive|U]"
 pam_convert_to_theocracy_decision_desc:0 "A hierarquia atual é uma perversão das regras estabelecidas por [ROOT.Char.GetFaith.GoodGodNames]. Foi-me dado o único caminho para desfazê-la, um que louvará [ROOT.Char.GetFaith.CreatorHerHim|U] e cumprirá meus deveres para com meu povo ao mesmo tempo. Esta é a palavra de [ROOT.Char.GetFaith.GoodGodNames]."
 pam_convert_to_theocracy_decision_tooltip:0 "Mudar seu [government|E] para uma [theocracy|E]"
 pam_create_great_schism_effect_tt:0 "[old_rite.GetName] é destruído e [roman_rite.GetName] e [byzantine_rite.GetName] são elevados a [faiths|E]"
 pam_decision_act_of_devotion:0 "Realizar um Ato de Devoção"
 pam_decision_act_of_devotion_confirm:0 "Fazei soar os sinos!"
 pam_decision_act_of_devotion_desc:0 "Minha profunda conexão interna com [ROOT.Char.GetFaith.HighGodName] é tão forte que preciso externá-la!\n\nConvocai o [ROOT.Char.GetFaith.PriestNeuterPlural], celebridade uma grande missa, chamai todos no reino. Que vejam quão devoto é seu suserano."
 pam_decision_act_of_devotion_desc_tooltip:0 "Trocar [piety|E] por [prestige|E]"
 pam_decision_act_of_devotion_fame_tooltip:0 "Seu [prestige_level|E] deve estar abaixo de [GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]"
 pam_decision_act_of_devotion_sp_tooltip:0 "Seu [spiritual_fulfillment|E] é de pelo menos #V [EmptyScope.ScriptValue('spiritual_fulfillment_2')|0]#!"
 pam_decision_act_of_devotion_tooltip_effect:0 "Você escolherá entre:\n$BULLET_WITH_TAB$ [prestige_i]#P [EmptyScope.ScriptValue('major_prestige_gain')|0]#! [prestige|E]\n$BULLET_WITH_TAB$ [prestige_i]#P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#! [prestige|E] e um extra [prestige_level|E] em troca de um [piety_level|E]"
 pam_decision_confession_confirm:0 "Conocar o [ROOT.Char.GetFaith.PriestNeuter]"
 pam_decision_confession_desc:0 "Quando um [ROOT.Char.GetWomanMan] toma ciência da culpa que [ROOT.Char.GetSheHe] carrega, [ROOT.Char.GetSheHe] deve confessar [ROOT.Char.GetHerHis] pecados."
 pam_decision_confession_name:0 "Tomar Confissão"
 pam_decision_confession_name_low:0 "Confessar Meus Pecados"
 pam_decision_confession_sp_court_chaplain:0 "Você emprega um [court_chaplain|E]"
 pam_decision_confession_tooltip:0 "Confesse seus pecados"
 pam_decision_confession_tooltip_sp_effect:0 "Você ganhará algo de [spiritual_fulfillment|E]"
 pam_decision_confession_tooltip_stress_effect:0 "Você perderá algo de [stress|E]"
 pam_decision_events.0001.a.confession_random_outcome:0 "Seu [court_chaplain|E] pode vos pedir algo, ou podereis ouvir algo durante a confissão..."
 pam_decision_events.0001.a.conversion.toast:0 "Cumpristes vossa promessa"
 pam_decision_events.0001.a.conversion.toast_puppeteer:0 "[puppet_or_actor.GetShortUIName] cumpriu sua promessa"
 pam_decision_events.0001.a.conversion:0 "[chaplain.GetShortUIName] pede que convertais [target.GetShortUIName]"
 pam_decision_events.0001.a.courtier_secret:0 "Ovis [my_courtier.GetShortUIName] a tomar confissão"
 pam_decision_events.0001.a.high_almoner:0 "[chaplain.GetShortUIName] pede que contrateis um [GetCourtPositionType('high_almoner_court_position').GetName()]"
 pam_decision_events.0001.a.hook:0 "[chaplain.GetShortUIName] tomou conhecimento de uma nova informação"
 pam_decision_events.0001.a.no_war:0 "[chaplain.GetShortUIName] pede que não declareis nenhuma guerra ofensiva em #V 5 anos#!"
 pam_decision_events.0001.a.opinion_malus:0 "[chaplain.GetShortUIName] desaprova vossos traços pecaminosos"
 pam_decision_events.0001.a.piety:0 "Vossa confissão pareceu sincera"
 pam_decision_events.0001.a.pilgrimage:0 "[chaplain.GetShortUIName] pede que partais em uma [pilgrimage|E]"
 pam_decision_events.0001.a.random_confession:0 "Ovis outra pessoa a tomar confissão"
 pam_decision_events.0001.a:0 "Perdoai-me, [chaplain.GetMotherFather], porque pequei."
 pam_decision_events.0001.desc.bad:0 "O olhar severo de [chaplain.GetHerHis|U] imita o que espero do Pai."
 pam_decision_events.0001.desc.good:0 "Ainda que o peso sobre meus ombros não seja pesado, ele ainda pode ser aliviado."
 pam_decision_events.0001.desc.intro:0 "[chaplain.GetTitledFirstName] aguarda pacientemente na capela vazia.\n\n"
 pam_decision_events.0001.desc.neutral:0 "Perdido como uma rês, incerto da bondade de meu coração, aproximo-me de [chaplain.GetHerHim]."
 pam_decision_events.0001.desc.outro:0 "\n\n\"[Glossary('$pam_john_20_22_english|q$','JOHN_20_22_GLOSS')]\""
 pam_decision_events.0001.desc.sin.ambitious:0 "A ambição superou minha consciência."
 pam_decision_events.0001.desc.sin.arbitrary:0 "Governei por capricho em vez de justiça."
 pam_decision_events.0001.desc.sin.arrogant:0 "O orgulho inflou meu coração."
 pam_decision_events.0001.desc.sin.brave:0 "Minha ousadia ultrapassou a prudência e tornou-se insensatez."
 pam_decision_events.0001.desc.sin.callous:0 "Endureci meu coração ao sofrimento alheio."
 pam_decision_events.0001.desc.sin.calm:0 "Minha calma tem sido indiferença disfarçada de virtude."
 pam_decision_events.0001.desc.sin.chaste:0 "Minha castidade tornou-se um refúgio frio contra o dever."
 pam_decision_events.0001.desc.sin.compassionate:0 "A piedade levou-me a desculpar o que deveria ser condenado."
 pam_decision_events.0001.desc.sin.content:0 "A complacência entorpeceu minha fome por retidão."
 pam_decision_events.0001.desc.sin.craven:0 "O medo levou-me a abandonar o que era correto."
 pam_decision_events.0001.desc.sin.cynical:0 "O cinismo corroeu minha fé."
 pam_decision_events.0001.desc.sin.deceitful:0 "Proferi falsidades e ocultei o que devia em honestidade."
 pam_decision_events.0001.desc.sin.diligent:0 "Meu afinco pelo trabalho atropelou a misericórdia."
 pam_decision_events.0001.desc.sin.eccentric:0 "Meus modos excêntricos escandalizaram os fiéis."
 pam_decision_events.0001.desc.sin.fickle:0 "A inconstância tornou minha palavra indigna de confiança."
 pam_decision_events.0001.desc.sin.forgiving:0 "O perdão veio com demasiada facilidade para ofensas graves."
 pam_decision_events.0001.desc.sin.generous:0 "Minha generosidade ultrapassou a sabedoria e deixou-me esvaziado."
 pam_decision_events.0001.desc.sin.gluttonous:0 "Alimentei a carne além de toda moderação."
 pam_decision_events.0001.desc.sin.greedy:0 "Apeguei-me ao ouro quando deveria ter dado."
 pam_decision_events.0001.desc.sin.gregarious:0 "Meu amor pela companhia abafou a voz da consciência."
 pam_decision_events.0001.desc.sin.honest:0 "Minha franqueza brutal feriu onde a brandura era devida."
 pam_decision_events.0001.desc.sin.humble:0 "A falsa humildade manteve-me afastado da verdade."
 pam_decision_events.0001.desc.sin.impatient:0 "A impaciência tornou-me áspero e precipitado."
 pam_decision_events.0001.desc.sin.just:0 "Minha justiça tem sido implacável e orgulhosa."
 pam_decision_events.0001.desc.sin.lazy:0 "A preguiça afastou-me da oração e do dever."
 pam_decision_events.0001.desc.sin.lustful:0 "Deixei a luxúria dominar minha vontade."
 pam_decision_events.0001.desc.sin.paranoid:0 "A suspeita envenenou minhas relações com os outros."
 pam_decision_events.0001.desc.sin.patient:0 "A paciência coalhou em hesitação covarde."
 pam_decision_events.0001.desc.sin.preamble:0 "\n\nA culpa que sinto pelos meus pecados não me é estranha."
 pam_decision_events.0001.desc.sin.sadistic:0 "Encontrei prazer na crueldade."
 pam_decision_events.0001.desc.sin.shy:0 "A timidez impediu-me de fazer o bem que deveria."
 pam_decision_events.0001.desc.sin.stubborn:0 "A teimosia tornou-me surdo à correção."
 pam_decision_events.0001.desc.sin.temperate:0 "Minha temperança endureceu-se na negação das necessidades."
 pam_decision_events.0001.desc.sin.trusting:0 "A confiança tornou-me cego para a maldade."
 pam_decision_events.0001.desc.sin.vengeful:0 "A vingança consumiu-me."
 pam_decision_events.0001.desc.sin.wrathful:0 "A ira levou-me ao pecado."
 pam_decision_events.0001.desc.sin.zealous:0 "O zelo ardeu mais forte que a caridade."
 pam_decision_events.0001.t:0 "Confissão"
 pam_decision_events.0002.a:0 "Devo dirigir-me à multidão pessoalmente."
 pam_decision_events.0002.b:0 "Um simples reconhecimento será suficiente."
 pam_decision_events.0002.desc.bad:0 "enquanto me esforço para prestar atenção."
 pam_decision_events.0002.desc.crowned:0 "minha coroa como uma auréola."
 pam_decision_events.0002.desc.good:0 "enquanto o público parece focado unicamente em mim."
 pam_decision_events.0002.desc.intro:0 "[my_chaplain.GetTitledFirstName] está de pé ao meu lado, junto ao altar. Os raios suaves do sol iluminam"
 pam_decision_events.0002.desc.mid:0 "\n\n\"[ROOT.Char.Custom('RandomBibleQuote')]..\" O sermão de [my_chaplain.GetHerHis|U] continua sem fim"
 pam_decision_events.0002.desc.neutral:0 "enquanto examino a multidão à procura de rostos impressionados."
 pam_decision_events.0002.desc.outro:0 "\n\n\"E nosso [ROOT.Char.GetNameNoTooltip], sábio e virtuoso, guiar-nos-á nestes tempos sombrios.\""
 pam_decision_events.0002.desc.uncrowned:0 "minhas vestes como um manto sagrado."
 pam_decision_events.0002.t:0 "Uma Demonstração de Devoção"
 pam_decision_events.0003.a:0 "Um [ROOT.Char.GetTitleAsNameNoTooltip|l] podre em breve envenenará [target_child.GetHerHis] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]."
 pam_decision_events.0003.after_tt:0 "Algo pode ser revelado sobre [target_child.GetFirstName]..."
 pam_decision_events.0003.b:0 "Apenas... Seja bom."
 pam_decision_events.0003.desc.bad:0 "[target_child.GetHerHis|U] rosto afundado, olhar desinteressado, quase adormecido.\n\n\"[ROOT.Char.GetMotherFather|U],\" [target_child.GetSheHe] pergunta com impaciência, \"por que me mandaste chamar?\""
 pam_decision_events.0003.desc.good:0 "[target_child.GetHerHis|U] olhos brilhantes à luz da vela. [target_child.GetSheHe|U] é um bom [target_child.GetWomanMan].\n\n\"[ROOT.Char.GetMotherFather|U],\" [target_child.GetSheHe] pergunta, \"será que te falhei?\""
 pam_decision_events.0003.desc.intro:0 "A noite caiu, e a torre fortificada está silenciosa. Meu [target_child.Custom('GetDaughterSon')] senta-se ao meu lado na capela privada.\n\nDou uma olhada em [target_child.GetHerHim]."
 pam_decision_events.0003.desc.neutral:0 "[target_child.Custom('ComplimentAdjective')|U]. Já tem idade suficiente.\n\n\"[ROOT.Char.GetMotherFather|U],\" [target_child.GetSheHe] pergunta suavemente, \"como se vive de forma correta?\""
 pam_decision_events.0003.education:0 "[target_child.GetShortUIName] melhora [target_child.GetHerHis] educação"
 pam_decision_events.0003.learning:0 "[target_child.GetShortUIName] melhora [target_child.GetHerHis] conhecimento"
 pam_decision_events.0003.lover:0 "[target_child.GetShortUIName] rompe com [lover_scope.GetShortUIName]"
 pam_decision_events.0003.mystic:0 "[target_child.GetShortUIName] demonstra grande interesse pelo assunto"
 pam_decision_events.0003.secret:0 "[target_child.GetShortUIName] confessa-se a ti"
 pam_decision_events.0003.stress:0 "[target_child.GetShortUIName] sofre uma crise"
 pam_decision_events.0003.t:0 "A Lição Mais Importante"
 pam_decision_events.0003.trait:0 "[target_child.GetShortUIName] tem um momento de revelação"
 pam_decision_events.0004.a:0 "#EMP [ROOT.Char.GetHouse.GetMotto].#!"
 pam_decision_events.0004.desc:0 "Durante anos, vesti hábitos em vez de ostentar um estandarte. No entanto, a posição e o poder chegaram até mim da mesma forma.\n\nPor que deveria o meu legado desaparecer comigo, simplesmente por não ter nascido com um nome ilustre?"
 pam_decision_events.0004.t:0 "Um Novo Começo"
 pam_decision_events.0004.tt:0 "#high A dinastia [THIS.Char.GetDynasty.GetName] é fundada#!"
 pam_decision_events.0005.a:0 "O sacramento da penitência aguarda-me."
 pam_decision_events.0005.b:0 "Que o Diabo me leve! Livrai-me deste padre."
 pam_decision_events.0005.desc.alone:0 "Tremeu de pavor, sozinho, sem entes queridos por perto para rezar pela minha alma."
 pam_decision_events.0005.desc.bad:0 "Esforcei-me por honrar [ROOT.Char.GetFaith.HighGodName] e, na minha arrogância, tentei esconder o meu pecado dos seus olhos oniscientes.\n\n"
 pam_decision_events.0005.desc.good:0 "Misericordiosamente, sinto como se os anjos estivessem próximos, guardando a minha alma dos demónios que esperam reclamá-la.\n\n"
 pam_decision_events.0005.desc.healthtrait:0 "O pecado tornou-me [death_trait.GetName(soon_dead)|l] e é provavelmente a causa da minha morte iminente."
 pam_decision_events.0005.desc.neutral:0 "Embora tenha procurado honrar [ROOT.Char.GetFaith.HighGodName], ao aproximar-me do limiar da eternidade, preocupo-me se a minha alma será julgada digna do seu Reino dos Céus.\n\n"
 pam_decision_events.0005.desc.notalone:0 "Ao meu lado estão o meu [ROOT.Char.Custom2('PartnerOpinionDescription', SCOPE.sC('fam_or_friend_1') )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('fam_or_friend_1'))], [fam_or_friend_1.GetFirstName], e outros que rezam pela minha alma."
 pam_decision_events.0005.desc.outro:0 "O meu confessor, [Glossary('sacramentary','SACRAMENTARY_GLOSS')] na mão, aconselha-me: \"Encara [ROOT.Char.GetFaith.HighGodName] sem enganos!\"\n\nAté o Rei David, envolto em pecado, foi purificado após a sua confissão...[Glossary('$pam_psalm_51_english|q$','PSALM_51_5_GLOSS')]"
 pam_decision_events.0005.details:0 "Terás a oportunidade de [lease|E] [titles|E] ou, se não tiveres nenhum disponível, doar [gold|E] a [monastic_holy_orders|E], [holy_orders|E] ou [the_christian_church|E] — isto proporcionará [modifiers|E] benéficos para o teu [player_heir|E]"
 pam_decision_events.0005.no_last_rites_warning:0 "@warning_icon! #X Se não receberes os Últimos Sacramentos:\n$BULLET_WITH_TAB$Perdes [legitimacy_i][EmptyScope.ScriptValue('massive_legitimacy_gain')]\n$BULLET_WITH_TAB$$every_zealot_vassal$:\n$TAB$$BULLET_WITH_TAB$Perde #N 30#! [opinion|E] de #V ti#! #!"
 pam_decision_events.0005.secret_reveal:0 "@alert_icon! #alert_trial Poderás ter de revelar um [secret|E]"
 pam_decision_events.0005.t:0 "Últimos Sacramentos: A Minha Hora Final"
 pam_decision_events.0006.a:0 "\"Perdoai-me, [confessor.GetMotherFather]...\""
 pam_decision_events.0006.b.flavor:0 "Você confessa alguns pecados, mas oculta segredos que podem implicar outros."
 pam_decision_events.0006.b:0 "Alguns pecados devem ir para a cova comigo."
 pam_decision_events.0006.desc.bad:0 "\n\nMeus pecados foram grandes e frequentes. Minha alma pesa, aprisionada pelos dedos ardentes de Satanás, decidido a tomar o que é claramente dele.\n\n"
 pam_decision_events.0006.desc.good:0 "\n\nMeu coração está leve, pois minhas ações estiveram de acordo com a vontade do Senhor.\n\n"
 pam_decision_events.0006.desc.my_criminal_trait_sin:0 "Talvez o pior de tudo, sou um [my_criminal_trait.GetName(soon_dead)]! Minha culpa sufocante trava cada respiração."
 pam_decision_events.0006.desc.my_sinful_trait_sin:0 "Quão frequentemente fui desviado pela minha natureza [my_sinful_trait.GetName(soon_dead)]!"
 pam_decision_events.0006.desc.neutral:0 "\n\nNão passo de um [ROOT.Char.GetWomanMan], e o pecado me encontrou apesar de minhas melhores intenções.\n\n"
 pam_decision_events.0006.desc.outro:0 "Devo expor meus pecados com a devida contrição, ou ser negado a Eucaristia."
 pam_decision_events.0006.desc.secret_sin:0 "Guardei em um porto de trevas o fato de ser um [my_secret.GetName]."
 pam_decision_events.0006.desc.sin_default:0 "Meus pecados, embora certamente muitos, são difíceis de lembrar. Tenho certeza de que fluirão como um oceano rompendo um dique, assim que eu falar com [confessor.GetTitledFirstNameNoTooltip]."
 pam_decision_events.0006.desc.sin_default_good_sp:0 "Que [ROOT.Char.GetFaith.HighGodName] esmague meus ossos e apague a iniquidade."
 pam_decision_events.0006.intro:0 "\"Errar é humano. Mas sem confissão, não pode haver absolvição\", diz [confessor.GetTitledFirstName]."
 pam_decision_events.0006.t:0 "Últimos Ritos: Meu Pecado Está Sempre Diante de Mim"
 pam_decision_events.0007.a:0 "Que o [monastic_order.GetName] reze por mim."
 pam_decision_events.0007.b:0 "Quero reforçar a [military_order.GetName]."
 pam_decision_events.0007.c:0 "[religious_head.GetTitledFirstNameNoTooltip] pode ter minha riqueza, e eu [religious_head.GetHerHis] preces."
 pam_decision_events.0007.d:0 "Uma palavra piedosa a [confessor.GetTitledFirstNameNoTooltip] basta."
 pam_decision_events.0007.desc.bad:0 "Mesmo agora, enquanto o corpo e o sangue do meu Senhor são apresentados, ouço os sussurros de diabretes implorando para que eu entregue minha alma, para que eu possa continuar vivendo e me indulgenciar em prazeres mundanos.\n\n"
 pam_decision_events.0007.desc.good:0 "Tendo me descarregado, salto para o abraço da morte. Anseio por consumir o corpo e o sangue do meu Senhor, de quem logo estarei ao lado.\n\n"
 pam_decision_events.0007.desc.neutral:0 "Que o corpo e o sangue do Senhor me protejam contra os demônios que espreitam como lobos, aqui para me levar antes do meu tempo marcado.\n\n"
 pam_decision_events.0007.desc.oil.bad:0 "Minha alma continua perturbada.\n\n"
 pam_decision_events.0007.desc.oil.good:0 "Minha alma irradia com o amor do Senhor.\n\n"
 pam_decision_events.0007.desc.oil.intro:0 "[confessor.GetSheHe|U] então unge minha testa, mãos e pés com óleo santo."
 pam_decision_events.0007.desc.oil.neutral:0 "Minha alma se sente protegida para sua jornada.\n\n"
 pam_decision_events.0007.desc.outro:0 "Completados o [Glossary('viaticum','VIATICUM_GLOSS')] e a [Glossary('unction','UNCTION_GLOSS')], posso planejar quem rezará por mim."
 pam_decision_events.0007.intro:0 "Assim passou a contagem dos meus pecados. Uma coisa é dever um vintém, e outra dez mil talentos.\n\nMeu confessor apresenta o pão e o vinho consagrados."
 pam_decision_events.0007.t:0 "Últimos Ritos: Carne, Sangue e Óleo"
 pam_decision_events.0008.a:0 "A generosidade não é uma virtude?"
 pam_decision_events.0008.desc.chaplain:0 "\"O [ROOT.Char.GetTitleAsNameNoTooltip|l] agora se regozija em humilhar os servos de [ROOT.Char.GetFaith.HighGodName]?\", repreende [chaplain.GetTitledFirstName]. \"Você obtém algum prazer em despir a casa de [ROOT.Char.GetFaith.HighGodHerHis|U] como uma #EMP imunda#! meretriz?\""
 pam_decision_events.0008.desc.fallback:0 "[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] desviam o rosto com desgosto. Os servos de [ROOT.Char.GetFaith.HighGodName] parecem ter um interesse terrível em ouro."
 pam_decision_events.0008.desc.intro:0 "Arcas cheias repousam em [ROOT.Char.GetFaith.HouseOfWorshipPlural] ao meu alcance. O som dos meus guardas entrando nos templos é logo seguido pelo tintilar de moedas.\n\n"
 pam_decision_events.0008.t:0 "Cobrar os Dízimos"
 pam_decision_events.0009.a:0 "[new_capital.GetNameNoTierPossessiveNoTooltip] [ROOT.Char.Custom('GetFaithTemple')] é a nova capital!"
 pam_decision_events.0009.b:0 "Assim é a vontade de [ROOT.Char.GetFaith.HighGodName]."
 pam_decision_events.0009.desc:0 "Adoro o [ROOT.Char.Custom('ReligiousHeadHeadgear')], colocando-o sobre minha cabeça, e venho perante meu devoto [ROOT.Char.GetFaith.GetAdherentNamePlural]:\n\n\"As velhas formas de feudos e escritos nos serviram bem, até começarem a nos desviar. Movidos pela palavra de [ROOT.Char.GetFaith.HighGodName], é [ROOT.Char.GetFaith.HighGodNameSheHe|U] quem define como devemos governar sobre [ROOT.Char.GetPrimaryTitle.GetNameNoTier]. Sou apenas [ROOT.Char.GetFaith.HighGodHerHis|U] humilde servo, e assim são todos vocês.\""
 pam_decision_events.0009.liege_msg_desc:0 "[ROOT.Char.GetShortUIName] reorganizou [ROOT.Char.GetHerHis] reino para se tornar uma [theocracy|E]."
 pam_decision_events.0009.liege_msg_title:0 "Teocracia Adotada"
 pam_decision_events.0009.t:0 "Uma Administração Sagrada"
 pam_decision_events.0010.a:0 "Entendido."
 pam_decision_events.0010.b:0 "Manterei a estrutura atual."
 pam_decision_events.0010.desc:0 "Segui o caminho de uma ordenação sagrada do governo. Espera-se que suas terras sigam o caminho divino. Essa é a vontade de [theocratic_ruler.GetFaith.GoodGodNames]."
 pam_decision_events.0010.opening:0 "[theocratic_ruler.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_decision_events.0011.b:0 "E ainda assim mantenho a fé com este ensinamento..."
 pam_decision_events.0011.desc.fallback:0 "Emiti uma proclamação a respeito de [pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )]."
 pam_decision_events.0011.desc.permitted:0 "Meu selo está no assunto. A partir deste dia, [pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )] é considerado um ensinamento da fé em boa situação.\n\nQue seus praticantes ocultos venham à luz."
 pam_decision_events.0011.desc.prohibited:0 "Meu selo está no assunto. A partir deste dia, [pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )] é anátema. Aqueles que se agarram a ele se afastaram dos fiéis."
 pam_decision_events.0011.opening:0 "Aos [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] de todas as terras,"
 pam_decision_events.0012.a:0 "Que assim seja."
 pam_decision_events.0012.desc:0 "[bull_issuer.GetTitledFirstName] declarou [heresy_rite.GetName] uma heresia.\n\nQue todo governante da fé tome nota."
 pam_decision_events.0012.opening:0 "Aos [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] de todas as terras,"
 pam_decision_events.0013.a:0 "Ficaremos sozinhos, e com alegria."
 pam_decision_events.0013.b:0 "Não serei expulso. Recebei-me de volta."
 pam_decision_events.0013.desc.intro:0 "Está feito. [heresy_rite.GetName] é proclamado heresia, e todos os que a ele se agarram são cortados de [bull_issuer.GetFaith.GetName], raiz e ramo."
 pam_decision_events.0013.desc.outro:0 "\n\nPortanto, escolham: ajoelhem-se mais uma vez e sejam acolhidos de volta ao rebanho, ou apeguem-se à sua falsidade e sejam condenados."
 pam_decision_events.0013.opening:0 "A [ROOT.Char.GetTitledFirstNameNoTooltip], outrora contado entre os fiéis,"
 pam_decision_events.0015.b.flavor:0 "Por que se contentar com o Papado, quando você pode ser canonizado?"
 pam_decision_events.0015.b.tt:0 "#V Aumenta a Chance de Canonização#! após a morte\n#weak Requer uma [dynasty|E] para ser canonizado#!"
 pam_decision_events.0015.b:0 "\"Tenho muitos milagres em meu nome.\""
 pam_decision_events.0015.c.flavor:0 "...Devho me erguer à altura da ocasião"
 pam_decision_events.0015.c.tt:0 "#V Aumentar a Pontuação Eleitoral#! para [praise_worthy_priest_superior_title.GetName]: #P +30#!"
 pam_decision_events.0015.c:0 "Se o Senhor deseja que eu governe..."
 pam_decision_events.0015.d.flavor:0 "Esvazio os cofres da minha devoção; não serei o segundo"
 pam_decision_events.0015.d.tt:0 "#V Aumentar a Pontuação Eleitoral#! para [praise_worthy_priest_superior_title.GetName]: #P +[praise_worthy_priest.MakeScope.ScriptValue('pam_papabile_place_first_populist_value')|0]#!, o suficiente para ficar em primeiro como $theocratic_elective_populist$\nRequer @piety_icon![praise_worthy_priest.MakeScope.ScriptValue('pam_place_first_as_populist_piety_cost_value')|0] [piety|E]"
 pam_decision_events.0015.d:0 "Que nenhum outro nome seja pronunciado."
 pam_decision_events.0015.desc.bad:0 "\n\nApesar das palavras laudatórias, meu coração teme o beijo do fogo do inferno."
 pam_decision_events.0015.desc.good:0 "\n\nNa verdade, sou um instrumento do Senhor, uma manifestação da sua beleza na terra."
 pam_decision_events.0015.desc.intro.no_praiser:0 "Meus padres leais compartilham"
 pam_decision_events.0015.desc.intro.praiser:0 "Meu influente [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('my_praiser'))], [my_praiser.GetTitledFirstName], compartilha"
 pam_decision_events.0015.desc.intro:0 "o encômio elaborado por meu [GetDomicileBuilding('chancery_01').GetName]:\n\n\"Os atos virtuosos são como sementes, plantadas pelo Senhor, para florescerem em generosidade piedosa. Todos devem conhecer [praise_worthy_priest.GetName], pois [praise_worthy_priest.GetHerHis] nobre"
 pam_decision_events.0015.desc.mid:0 "virtudes, sempre guiadas por"
 pam_decision_events.0015.desc.neutral:0 "\n\nApesar das palavras laudatórias, somente na morte saberei se minha alma está reta perante o Senhor."
 pam_decision_events.0015.desc.novirtuoustenet:0 "Deus...\""
 pam_decision_events.0015.desc.outro:0 "\n\n\"...de fato, pela retidão de [praise_worthy_priest.GetHerHis] atos, esta é a maneira de [praise_worthy_priest.GetWomanMan] que um dia poderia liderar a Igreja!\""
 pam_decision_events.0015.desc.virtuoustenet:0 "[my_virtuous_tenet.GetName( praise_worthy_priest.GetRite )]...\""
 pam_decision_events.0015.desc.virtuoustrait:0 "e [my_virtuous_trait.GetName(praise_worthy_priest)]"
 pam_decision_events.0015.t:0 "Promulgar Palavra de Atos Piedosos"
 pam_decision_events.0017.a:0 "Que a cruz permaneça por eras."
 pam_decision_events.0017.b:0 "O momento não é oportuno."
 pam_decision_events.0017.desc:0 "Escolhi um lugar alto com vista para [khachkar_location.GetNameNoTier] para a cruz de pedra.\n\nPermitirei que os mestres escultores criem algo verdadeiramente humilde para comemorar [khachkar_ancestor.GetTitledFirstNameNicknamed]. Uma cruz cercada por rosetas, ornamentos e uma inscrição que [khachkar_ancestor.GetHerHis] [khachkar_ancestor.Custom2('RelationToMeShort', ROOT.Char)] honrou [khachkar_ancestor.GetHerHis] memória.\n\nQue os peregrinos locais rezem sob ela, e que todos vejam nosso domínio legítimo da terra."
 pam_decision_events.0017.t:0 "Erguer um Khachkar Ancestral"
 pam_decision_events.0018.a:0 "Assim seja."
 pam_decision_events.0018.desc.armed_pilgrimages:0 "Selei o assunto. A partir deste dia, [GetTenetType('tenet_armed_pilgrimages').GetName( hof_scope.GetRite )] fará parte das crenças fundamentais de [hof_scope.GetFaith.GetName].\n\nQue todo governante da fé preste atenção."
 pam_decision_events.0018.desc.struggle_submission:0 "Selei o assunto. A partir deste dia, [GetTenetType('tenet_struggle_submission').GetName( hof_scope.GetRite )] fará parte das crenças fundamentais de [hof_scope.GetFaith.GetName].\n\nQue todo governante da fé preste atenção."
 pam_decision_events.0018.opening:0 "Para [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] de todas as terras,"
 pam_decision_events.0019.a:0 "Ó Senhor, fortalecei nossos braços."
 pam_decision_events.0019.desc:0 "Minha palavra para todos os [ROOT.Char.GetFaith.GetAdherentNamePlural]:\n\n\"Os caminhos para os lugares sagrados tornaram-se perigosos. Sabe-se que os fiéis podem portar armas em peregrinação e podem defender-se contra aqueles que barram o caminho para o Paraíso.\""
 pam_decision_events.0019.t:0 "Defensor dos Peregrinos"
 pam_decision_events.0020.a:0 "Focarei o texto restante em outros senhores."
 pam_decision_events.0020.b:0 "Dedicarei a próxima parábola aos meus vassalos."
 pam_decision_events.0020.c:0 "Perca-se em [ROOT.Char.GetFaith.ReligiousText|U]."
 pam_decision_events.0020.desc:0 "Após uma missa em [clerical_region.GetName], reuni um grupo de fiéis para ouvir de mim a palavra de [ROOT.Char.GetFaith.HighGodName|U]. Escolhi uma passagem de [ROOT.Char.GetFaith.ReligiousText|U] para ensinar sobre minha crença em [selected_item.GetName( actor.GetRite )]:\n\n\"[ROOT.Char.Custom('PersonalTenetRelevantBibleQuote')]\""
 pam_decision_events.0020.t:0 "Evangelizar [selected_item.GetNameNoTooltip(actor.GetRite)]"
 pam_decision_events.0021.a:0 "Que a misericórdia seja meu sermão."
 pam_decision_events.0021.b:0 "Ligarei a palavra com fogo e espada."
 pam_decision_events.0021.desc:0 "Não há mais espaço para se ajoelhar em [ROOT.Char.Custom('GetFaithTemple')]. Peregrinos pressionam ombro a ombro com [ROOT.Char.GetFaith.PriestNeuterPlural], barões com mendigos, e ainda assim a multidão aumenta nas portas.\n\nMeus atos foram contados mais de perto do que qualquer cronista poderia gerenciar — cada estrada percorrida, cada vigília mantida, cada moeda dada em nome de [ROOT.Char.GetFaith.HighGodNamePossessive]. Um dos [ROOT.Char.GetFaith.PriestNeuterPlural] pega minha mão e a pressiona contra [ROOT.Char.GetFaith.HighGodNamePossessive] altar: \"Fale, e nós ouviremos.\"\n\nO silêncio que se segue pertence a mim. Com o que eu o preencher ecoará muito além destas paredes."
 pam_decision_events.0021.t:0 "A Palavra Viva"
 pam_decision_events.0030.a:0 "Um novo reino [religious_authority.GetFaith.GetReligion.GetAdjectiveNoTooltip] é consagrado."
 pam_decision_events.0030.b.decline:0 "O [religious_authority.GetTitleAsName] Repudia Seu Reino"
 pam_decision_events.0030.b:0 "[religious_authority.GetFaith.HighGodName] não tem tais planos para você, [king_aspirant.GetFirstNameNoTooltip]..."
 pam_decision_events.0030.desc:0 "[religious_authority.GetFaith.HighGodName] ordena apenas alguns preciosos para servirem como os altos guardiões de [ROOT.Char.GetFaith.HighGodHerHis|U] [religious_authority.GetFaith.GetReligion.GetAdjectiveNoTooltip] crianças, como soberanos cuidando das belas terras que [ROOT.Char.GetFaith.HighGodNameSheHe|U] concedeu à Terra.\n\nPeço para servir como um daqueles poucos abençoados. Crie um Reino de [king_aspirant.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], e eu o defenderei contra todos os males."
 pam_decision_events.0030.opening:0 "Santíssimo [religious_authority.GetMotherFather|U],"
 pam_decision_events.0031.a:0 "Que [ROOT.Char.GetFaith.HighGodName] sempre ame meu [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 pam_decision_events.0031.desc.self_crowning:0 "Que terra é mais abençoada do que [ROOT.Char.GetPrimaryTitle.GetNameNoTier]? Qual feudo mais merecedor de auspícios reais? [ROOT.Char.GetFaith.WarGodName] não tem guardado seu povo contra os ais e preservado minha santa sede dentro de suas fronteiras?\n\n Exercendo a vontade de [ROOT.Char.GetFaith.HighGodNamePossessive], consagrei o [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]. Tornei-me o guardião sagrado da terra, e nunca mais minha vontade será rejeitada.\n\nVassalos e devotos — curvem-se! O bom [religious_authority.GetFaith.GetReligion.GetAdherentNamePlural] sabe como reverenciar seu [ROOT.Char.GetTitleAsName]."
 pam_decision_events.0031.desc:0 "Por decreto de [religious_authority.GetTitledFirstNamePossessiveRegnal], um novo nome [ROOT.Char.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l] é inscrito nos anais. O [ROOT.Char.GetFaith.PriestNeuterPlural] e o povo me erguem em exaltação! Enquanto [ROOT.Char.GetPrimaryTitle.GetNameNoTier] escapar das garras de pagãos e heréticos, permanecerei seu legítimo [ROOT.Char.GetFaith.GetAdjective] [ROOT.Char.GetTitleAsName].\n\nO [religious_authority.GetTitleAsNameNoTooltip], meu criador, abençoou verdadeiramente este reino modesto... e certamente se interessará pelos meus feitos reais."
 pam_decision_events.0031.desc_three_duchies:0 "Por decreto de [religious_authority.GetTitledFirstNamePossessiveRegnal], as terras do meu reino estão alinhadas como estrelas destinadas no céu em constante movimento. De [duchy_1.GetName], [duchy_2.GetName] e [duchy_3.GetName], um [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] unido e abençoado é feito.\n\nE, de uma alma justa e digna, surge um novo [ROOT.Char.GetTitleAsName]! É pelo mandato de [religious_authority.GetTitleAsNamePossessiveNoTooltip] que sou erguido, e agora pela linhagem de [religious_authority.GetHerHis] devo liderar."
 pam_decision_events.0031.t:0 "Um [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]"
 pam_decision_events.0032.a.christian:0 "Ordenou os mais dignos da minha casa."
 pam_decision_events.0032.a.tt:0 "Até [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] dos seus leigos mais instruídos [courtiers|E] #weak (parentes incluídos)#! cada:\n$EFFECT_LIST_BULLET$ Junte-se ao [clergy|E] de [pam_clerical_patron.GetFaith.GetName]\n$EFFECT_LIST_BULLET$ Ganha [learning_i][learning|E] e [opinion|E] de você\n$EFFECT_LIST_BULLET$ Concede a você [piety_i][piety|E]"
 pam_decision_events.0032.a:0 "Elevar os mais dignos da minha casa ao serviço da fé."
 pam_decision_events.0032.b.tt:0 "Até [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] da sua corte mais instruída [clergy|E] cada:\n$EFFECT_LIST_BULLET$ Ganha [learning_i][learning|E] #weak (até [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_learning_cap_value')|V0])#!\n$EFFECT_LIST_BULLET$ Ganha ou avança o [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] ou [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [trait|E]"
 pam_decision_events.0032.b:0 "Instruir o clero já sob meus cuidados."
 pam_decision_events.0032.c.named:0 "Receba [pam_clerical_novice.GetFirstNameNoTooltip] e mande avisar que os noviços são bem-vindos."
 pam_decision_events.0032.c.tt:0 "Até [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] noviços das terras vizinhas cada:\n$EFFECT_LIST_BULLET$ Junte-se à sua corte e ao [clergy|E] de [pam_clerical_patron.GetFaith.GetName]\n$EFFECT_LIST_BULLET$ Converte-se ao seu [rite|E]"
 pam_decision_events.0032.c:0 "Enviar palavra de que os noviços são bem-vindos."
 pam_decision_events.0032.desc.intro.christian:0 "Dirijo-me aos clérigos e ao clero da minha casa, ponderando quem será ordenado e quem ainda precisa de orientação."
 pam_decision_events.0032.desc.intro:0 "Dirijo-me àqueles que servem [ROOT.Char.GetFaith.GetName] na minha corte: quem entrará no seu serviço e quem precisa de orientação?"
 pam_decision_events.0032.desc.no_pupil:0 "\n\nPoucos entre eles entraram no serviço da fé — uma carência que pretendo remediar."
 pam_decision_events.0032.desc.novice:0 "\n\nAlém da minha casa, um estranho esperançoso chamado [pam_clerical_novice.GetFirstName] implora por um lugar no serviço da fé."
 pam_decision_events.0032.desc.outro.christian:0 "\n\nComo devo cuidar do rebanho que [ROOT.Char.GetFaith.HighGodName] me confiou?"
 pam_decision_events.0032.desc.outro:0 "\n\nComo devo criar aqueles que [ROOT.Char.GetFaith.HighGodName] confiou a mim?"
 pam_decision_events.0032.desc.pupil:0 "\n\nMinha pupila, [pam_clerical_pupil.GetFirstName], está em oração, ansiosa para provar [pam_clerical_pupil.GetHerHis] valor."
 pam_decision_events.0032.language:0 "Colocar minha pupila para estudar os textos sagrados."
 pam_decision_events.0032.miracle:0 "Dizem que minha pupila realiza maravilhas."
 pam_decision_events.0032.novice:0 "Uma alma promissora — acolha [pam_clerical_novice.GetHerHim] imediatamente."
 pam_decision_events.0032.oblates:0 "Que todos saibam que acolho aqueles chamados ao serviço."
 pam_decision_events.0032.piety:0 "A devoção deles fortalece a minha própria."
 pam_decision_events.0032.prodigy:0 "Minha pupila tem um dom divino!"
 pam_decision_events.0032.relic.christian:0 "Este texto sagrado pertence ao meu tesouro!"
 pam_decision_events.0032.relic:0 "Que estes escritos enriqueçam minha corte."
 pam_decision_events.0032.scriptorium.christian:0 "Ponha cada pena do scriptorium para trabalhar."
 pam_decision_events.0032.scriptorium:0 "Ponha cada escriba da minha corte para trabalhar."
 pam_decision_events.0032.t:0 "Cuidando do Rebanho"
 pam_decision_last_rites_confirm:0 "Reúnam-se ao redor do meu leito"
 pam_decision_last_rites_desc:0 "#EMP Tende piedade de mim, ó [ROOT.Char.GetFaith.HighGodName]! Lava-me completamente da minha iniquidade e purifica-me do meu pecado.#!\n\nCom a minha partida iminente desta existência carnal, espero pôr minha alma em ordem. Protegido contra a influência infernal, poderei então encontrar uma boa morte e a vida eterna, abrigado no Reino dos Céus."
 pam_decision_last_rites_doctrine_tt:0 "[faith|E] deve ter a [GetDoctrineType('doctrine_sacraments_central').GetBaseName] [doctrine|E]"
 pam_decision_last_rites_name:0 "Receber Últimos Ritos"
 pam_decision_last_rites_name_low:0 "Receber Últimos Ritos"
 pam_decision_last_rites_sp_tooltip:0 "Sua [spiritual_fulfillment|E] é de pelo menos #V [EmptyScope.ScriptValue('spiritual_fulfillment_1')|0]#!"
 pam_decision_last_rites_tooltip:0 "Prepare sua alma para a partida"
 pam_decision_last_rites_tooltip_sp_effect:0 "Você ganhará alguma [spiritual_fulfillment|E] @spiritual_fulfillment_icon!"
 pam_declare_rite_heresy_bull_decision:0 "$pam_declare_rite_heresy_decision$"
 pam_declare_rite_heresy_bull_decision_confirm:0 "$pam_declare_rite_heresy_decision_confirm$"
 pam_declare_rite_heresy_bull_decision_desc:0 "Um rito que se afastou demais do caminho verdadeiro deve ser chamado pelo que é.\n\nUma [papal_bull|E] será emitida condenando-o como heresia."
 pam_declare_rite_heresy_bull_decision_tooltip:0 "$pam_declare_rite_heresy_decision_tooltip$"
 pam_declare_rite_heresy_bull_effect_tt:0 "$pam_declare_rite_heresy_effect_tt$"
 pam_declare_rite_heresy_decision:0 "Declarar um Rito Herético"
 pam_declare_rite_heresy_decision_confirm:0 "Pronunciar a condenação"
