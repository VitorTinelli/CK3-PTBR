 pam_kingdom_of_heaven.0001.b:0 "O que é a Sé de São Pedro comparada à Sé de Cristo?"
 pam_kingdom_of_heaven.0001.desc:0 "\"O reino de Deus é assim como se alguém lançasse semente à terra; e dormisse e se levantasse de noite e de dia, e a semente brotasse e crescesse, não sabendo ele como.\"\n\nVolto meu corpo para a Cristandade. Em meus dedos, seguro terra da Terra Santa.\n\n\"A terra de si mesma produz primeiro a erva,\" abro minha mão e a terra se dissipa no ar. \"Depois a espiga,\" apontei para meu povo. \"Por fim o trigo cheio na espiga.\" Ergo meu báculo.\n\n\"E, quando o fruto já está maduro, logo ele lança a foice, porque é chegada a ceifa.\""
