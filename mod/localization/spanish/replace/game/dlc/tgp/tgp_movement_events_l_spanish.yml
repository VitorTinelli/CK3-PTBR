l_spanish:
 MODIFIER_DEFINITION_SUBSIDISED_ESTATE:0 "#emp Usado ao construir um novo prédio de domicílio#!\nRecursos restantes de [domicile_building|E]: #bold $MULTIPLIER|0$/3#!"
 artifact_movement_gift_desc:0 "[newly_created_artifact.GetDesc]\n\nUm presente de [other_ruler.GetShortUIName] para [root_scope.GetShortUIName] como membros do [my_movement.GetName]."
 cheaper_to_convert_to_monk_faith_tt:0 "Você ganha #P 50%#! de desconto ao se converter à fé [monk.GetFaith.GetName]"
 disciple_gift_desc:0 "[newly_created_artifact.GetDesc]\n\nUm presente de [disciple.GetShortUIName] para [root_scope.GetShortUIName] por ser um excelente mentor."
 dynastic_cycle_cannot_leave_movement_tt:0 "@warning_icon! #X Você não poderá deixar o [my_movement.GetName] por #V 15 anos#!#!"
 event_decrease_movement_power_medium_effect_tooltip:0 "Diminui o [movement_power_i][movement_power|E] de [GetPlayer.Custom('GetMyMovement')] em #N [EmptyScope.ScriptValue('event_decrease_movement_power_medium_value')|0]#!"
 event_decrease_movement_power_minor_effect_tooltip:0 "Diminui o [movement_power_i][movement_power|E] de [GetPlayer.Custom('GetMyMovement')] em #N [EmptyScope.ScriptValue('event_decrease_movement_power_minor_value')|0]#!"
 event_increase_movement_power_major_effect_tooltip:0 "Aumenta o [movement_power_i][movement_power|E] de [GetPlayer.Custom('GetMyMovement')] em [EmptyScope.ScriptValue('event_increase_movement_power_major_value')|+0]"
 event_increase_movement_power_medium_effect_tooltip:0 "Aumenta o [movement_power_i][movement_power|E] de [GetPlayer.Custom('GetMyMovement')] em [EmptyScope.ScriptValue('event_increase_movement_power_medium_value')|+0]"
 event_increase_movement_power_minor_effect_tooltip:0 "Aumenta o [movement_power_i][movement_power|E] de [GetPlayer.Custom('GetMyMovement')] em [EmptyScope.ScriptValue('event_increase_movement_power_minor_value')|+0]"
 event_increased_personal_movement_power_tt:0 "Você aumenta seu [movement_power_i][personal_movement_power|E] em [EmptyScope.ScriptValue('event_increased_personal_movement_power_value')|+0] por #V 15 anos#!"
 friend_rejected_funds:0 "[CHARACTER.GetShortUIName|U] encorajou [TARGET_CHARACTER.GetShortUIName] a não gastar seu ouro em nome de [CHARACTER.GetShortUINamePossessive]."
 friend_rejected_funds_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] foi encorajado por [CHARACTER.GetShortUIName] a não gastar seu ouro em nome de [TARGET_CHARACTER.GetShortUINamePossessive]."
 friend_same_movement_reason:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUIName] concordaram em proteger os interesses um do outro como membros do mesmo movimento."
 friend_same_movement_reason_corresponding:0 "$friend_same_movement_reason$"
 friend_sent_books_reason:0 "[TARGET_CHARACTER.GetShortUIName|U] enviou alguns livros interessantes para [CHARACTER.GetShortUIName] porque faziam parte do mesmo movimento."
 friend_sent_books_reason_corresponding:0 "[CHARACTER.GetShortUIName|U] enviou alguns livros interessantes para [TARGET_CHARACTER.GetShortUIName] porque faziam parte do mesmo movimento."
 friend_studied_together:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUIName] compartilharam uma tarde estudando seu assunto favorito."
 friend_studied_together_corresponding:0 "$friend_studied_together$"
 no_scheming_allowed_var_tt:0 "Você e [recipient.GetShortUIName] prometeram não iniciar [hostile_schemes|E] um contra o outro até [GetCurrentDateWithDiff(GetVarTimeRemaining(actor.MakeScope, 'no_scheming_allowed_var'))]"
 personal_movement_power:0 "$game_concept_personal_movement_power$"
 situation_dynastic_cycle_choose_movement_decision_cannot_leave_var:0 "Você prometeu ao [GetTitleByKey('h_china').GetHolder.GetTitleAsName] que não abandonaria [GetTitleByKey('h_china').GetHolder.GetSheHe]"
 tgp_advancement_innovations_modifier:0 "O Grande Avanço"
 tgp_advancement_innovations_modifier_desc:0 "Este personagem usou seu conhecimento arquitetônico para focar em inovações e impulsionar o reino rumo a futuros mais brilhantes."
 tgp_cultural_harmony_modifier:0 "Harmonia Cultural"
 tgp_cultural_harmony_modifier_desc:0 "Este personagem decidiu concentrar seus esforços em viver em harmonia com a cultura da capital."
 tgp_loyal_subject_modifier:0 "Leal ao Céu"
 tgp_loyal_subject_modifier_desc:0 "Este personagem demonstrou lealdade ao hegemon ao se juntar ao movimento Pró-Hegemon."
 tgp_movement_events.0001.a:0 "O [my_movement.GetNameNoTooltip] obedecerá."
 tgp_movement_events.0001.aa:0 "Você está certo. Ensine-me como."
 tgp_movement_events.0001.b:0 "Devo reunir aliados."
 tgp_movement_events.0001.c.tt:0 "Você ganha um [commander_trait|E]"
 tgp_movement_events.0001.c:0 "Aprenderei com os generais do passado."
 tgp_movement_events.0001.desc:0 "\"[ROOT.Char.GetTitledFirstName]!\" M[Select_CString( marshal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))] [marshal.GetName] avança em minha direção, [marshal.Custom('quirk_pos_pp')].\n\n\"Não podemos ficar parados como ovelhas, esperando os lobos nos devorarem. Estes podem ser tempos de [my_situation.GetTopCurrentPhase.GetName|l], mas em breve devemos marchar. Para o leste, oeste, norte e sul. Exorto você a estar preparado, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip|l].\""
 tgp_movement_events.0001.t:0 "Afiar a Lâmina"
 tgp_movement_events.0010.a.failure:0 "[other_ruler.GetShortUIName] ignora seu conselho"
 tgp_movement_events.0010.a.success:0 "Você convence [other_ruler.GetShortUIName]"
 tgp_movement_events.0010.a:0 "O [my_movement.GetNameNoTooltip] deve liderar o caminho."
 tgp_movement_events.0010.b:0 "Mais devem buscar meu conselho!"
 tgp_movement_events.0010.c:0 "Não posso tomar a decisão por [other_ruler.GetSheHe], mas posso ajudá-[Select_CString( other_ruler.IsFemale, 'la', 'lo' )]."
 tgp_movement_events.0010.desc:0 "Enquanto caminho pelo pátio, um[Select_CString( courtier.IsFemale, 'a', '' )] [courtier.GetWomanMan] bem-vestido me cumprimenta com uma reverência cortês.\n\n\"Sou [other_ruler.GetTitledFirstNamePossessive] [other_ruler.Custom2('RelationToMe', SCOPE.sC('courtier'))], [courtier.GetName].\" [courtier.GetSheHe|U] apresenta-se educadamente. \"[other_ruler.GetTitledFirstNameNoTooltip] enviou-me para ouvir sua sabedoria, [ROOT.Char.GetTitleAsNameNoTooltip|l]. [other_ruler.GetSheHe|U] deseja ouvir outros conselhos antes de tomar sua decisão.\""
 tgp_movement_events.0010.t:0 "Um Visitante Bem-vindo"
 tgp_movement_events.0020.a:0 "E avançaremos."
 tgp_movement_events.0020.aa:0 "É o único caminho."
 tgp_movement_events.0020.b:0 "Não há avanço sem o [my_movement.GetNameNoTooltip]!"
 tgp_movement_events.0020.c:0 "O curso deve ser definido de dentro do navio."
 tgp_movement_events.0020.desc:0 "\"Mais [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitleAsNameNoTooltip|l],\" um[Select_CString( courtier.IsFemale, 'a', '' )] [courtier.GetWomanMan] [courtier.GetCulture.GetNameNoTooltip] faz uma profunda reverência ao entrar no salão do trono. \"Trago o selo do grande [other_ruler.GetTitledFirstName]. M[Select_CString( other_ruler.IsFemale, 'eu', 'inha' )] [other_ruler.GetLadyLord] pede que eu preste respeito a um colega do honrado [my_movement.GetName].\"\n\n[courtier.GetSheHe|U] [courtier.Custom('quirk_pos_present')] antes de continuar: \"[other_ruler.GetTitledFirstNameNoTooltip] acredita que o reino deve se concentrar em inovações. A busca pelo poder pessoal é egoísta e fútil. Devemos todos #EMP avançar#!.\""
 tgp_movement_events.0020.t:0 "Avante! Avante!"
 tgp_movement_events.0030.a:0 "Que possamos concordar."
 tgp_movement_events.0030.b:0 "Agradeço, mas não preciso de ajuda."
 tgp_movement_events.0030.desc:0 "Como membro do [my_movement.GetName], escrevo para que cuidemos de nossos interesses comuns.\n\nFalarei bem de você, se você puder fazer o mesmo por mim."
 tgp_movement_events.0030.opening:0 "[other_ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 tgp_movement_events.0040.a:0 "Sou igualmente grato."
 tgp_movement_events.0040.b:0 "Serei eternamente leal [Select_CString( hegemon.IsFemale, 'a', 'ao' )] [hegemon.GetTitleAsNameNoTooltip]."
 tgp_movement_events.0040.c:0 "Que essas paredes falem!"
 tgp_movement_events.0040.desc:0 "\"Seus esforços não passaram despercebidos, [ROOT.Char.GetTitledFirstNameNoTooltip].\" Uma voz firme chama meu nome. [Select_CString( courtier.IsFemale, 'A', 'O' )] [courtier.GetWomanMan] que se curva à minha frente carrega o selo [Select_CString( hegemon.IsFemale, 'da', 'do' )] [hegemon.GetTitledFirstNameNoTooltip].\n\n\"[hegemon.GetTitledFirstName] é grato pelo seu apoio e deseja recompensá-lo por isso. O [my_movement.GetName] será exaltado nos corredores do palácio, e seus nomes lembrados.\""
 tgp_movement_events.0040.t:0 "Gratidão do Céu"
 tgp_movement_events.0050.a:0 "[new_elder.GetTitledFirstNameNoTooltip] será um[Select_CString( new_elder.IsFemale, 'a', '' )] excelente mentor[Select_CString( new_elder.IsFemale, 'a', '' )]."
 tgp_movement_events.0050.b:0 "Serei eternamente leal a [old_elder.GetTitledFirstNameNoTooltip]!"
 tgp_movement_events.0050.c:0 "Concentrar-se nos estudos é o único caminho."
 tgp_movement_events.0050.desc.diplomacy:0 "diplomático"
 tgp_movement_events.0050.desc.intrigue:0 "intriga"
 tgp_movement_events.0050.desc.intro:0 "\"Saudações, [ROOT.Char.GetTitledFirstNameNoTooltip].\" Um[Select_CString( new_elder.IsFemale, 'a', '' )] [new_elder.GetWomanMan] ponderad[Select_CString( new_elder.IsFemale, 'a', 'o' )] entra suavemente no meu estudo, acompanhado(a) por alguns dos meus próprios oficiais. \"Venho solicitar uma audiência privada, se me permite.\"\n\n\"Em você, percebo os traços de um(a) estudioso(a), uma mente cujo(a)"
 tgp_movement_events.0050.desc.learning:0 "aprendizado"
 tgp_movement_events.0050.desc.martial:0 "marcial"
 tgp_movement_events.0050.desc.outro:0 "disciplina reflete virtude. Gostaria de oferecer minha humilde sabedoria, para que sua governança seja temperada e sua lâmina afiada.\""
 tgp_movement_events.0050.desc.stewardship:0 "administrativo"
 tgp_movement_events.0050.t:0 "Um Novo Caminho"
 tgp_movement_events.0060.a.rival_tt:0 "Diminui o [movement_power_i][movement_power|E] do [rival_movement.GetName] em #N [EmptyScope.ScriptValue('event_decrease_movement_power_medium_value')|0]#!"
 tgp_movement_events.0060.a.tt:0 "$prelude_events.0040.c.tt$"
 tgp_movement_events.0060.a:0 "O [rival_movement.GetNameNoTooltip] sofrerá."
 tgp_movement_events.0060.b:0 "Devo focar em exaltar as virtudes do [my_movement.GetNameNoTooltip]."
 tgp_movement_events.0060.c:0 "[ROOT.Char.GetFaith.HighGodName] nos ensina a ter compaixão."
 tgp_movement_events.0060.desc:0 "O [ROOT.Char.Custom('GetWritingMaterial')] repousa frio sobre minha escrivaninha. Um único traço poderia manchar [rival.GetTitledFirstName] e seu [rival_movement.GetName] por gerações. Ainda assim, hesito, caminhando [ROOT.GetCharacter.Custom('quirk_pos_adverb')] pelo estudo.\n\nO pensamento persiste como fumaça de uma chama não atendida."
 tgp_movement_events.0060.t:0 "Tinta Nefasta"
 tgp_movement_events.0070.a:0 "\"Haha! Podemos definitivamente conversar sobre [councillor.Custom('MatchingConversationSubject_alone')].\""
 tgp_movement_events.0070.b.councillor:0 "\"Você deve focar em ser um(a) [councillor.GetCouncilTitle].\""
 tgp_movement_events.0070.b.spouse:0 "\"Me preocupo mais com sua educação.\""
 tgp_movement_events.0070.c:0 "Nunca devo parar de aprender."
 tgp_movement_events.0070.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" m[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] [councillor.GetTitledFirstName] entra em meu estudo, [councillor.Custom('quirk_pos_pp')]. \"Ouvi falar do seu interesse compartilhado em [councillor.Custom('MatchingConversationSubject_alone')].\"\n\n\"Posso propor que estudemos os clássicos juntos? Em reflexão conjunta, até governantes e servos podem elevar-se em sabedoria, como dois espelhos polidos lado a lado.\""
 tgp_movement_events.0070.t:0 "O Pergaminho Compartilhado"
 tgp_movement_events.0080.a:0 "\"Agradeço por esta contribuição.\""
 tgp_movement_events.0080.aa:0 "\"O nome [ROOT.Char.GetHouse.GetNameNoTooltip] será conhecido!\""
 tgp_movement_events.0080.c:0 "\"Não desperdice seu ouro comigo.\""
 tgp_movement_events.0080.desc:0 "M[Select_CString( family_member.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('family_member'))] [family_member.GetTitledFirstName] [family_member.Custom('quirk_pos_present')] entra na sala. \"Querid[Select_CString( root_scope.IsFemale, 'a', 'o' )] [family_member.Custom2('RelationToMe', SCOPE.sC('root_scope'))],\" [family_member.GetSheHe] me oferece uma reverência cortês, vestes limpas, olhar baixo em respeito.\n\n\"Tenho refletido por muito tempo sobre a honra de nossa casa. Isso pode não ser muito, mas ainda assim quero oferecer a você, para que o [ROOT.Char.GetDomicile.GetName] brilhe intensamente, para todos verem.\""
 tgp_movement_events.0080.t:0 "Para Nossa Casa"
 tgp_movement_events.0090.a:0 "\"Um pedido de desculpas para #EMP todos#! ouvirem.\""
 tgp_movement_events.0090.aa:0 "\"Negado.\""
 tgp_movement_events.0090.b:0 "Apenas pelo bem do [my_movement.GetNameNoTooltip]."
 tgp_movement_events.0090.c:0 "\"Envie [Select_CString( other_ruler.IsFemale, 'a', 'ao' )] [other_ruler.GetTitleAsNameNoTooltip] meus melhores cumprimentos.\""
 tgp_movement_events.0090.desc:0 "\"[ROOT.Char.GetTitledFirstNameNoTooltip],\" um[Select_CString( courtier.IsFemale, 'a', '' )] [courtier.GetWomanMan] portando o selo da casa [other_ruler.GetHouse.GetName] se curva profundamente diante de mim. \"M[Select_CString( other_ruler.IsFemale, 'eu', 'inha' )] [other_ruler.GetLadyLord] [other_ruler.GetTitledFirstName] me ordena a ler esta mensagem.\"\n\n\"Embora em tempos passados tenhamos caminhado em oposição, o caminho que agora trilhamos como membros do [my_movement.GetName] nos leva ao mesmo objetivo. Devemos esquecer as feridas do passado.\""
 tgp_movement_events.0090.t:0 "Velhas Feridas"
 tgp_movement_events.0100.a.failure:0 "Você foi exposto como desonroso"
 tgp_movement_events.0100.a.success:0 "[rival.GetShortUIName] deixa o [rival_movement.GetName]"
 tgp_movement_events.0100.a:0 "\"Vá em frente.\""
 tgp_movement_events.0100.aa:0 "[rival.GetSheHe|U] deve saber o que é melhor para [rival.GetSheHe]."
 tgp_movement_events.0100.b:0 "Nenhuma sugestão melhor do que ouro."
 tgp_movement_events.0100.c:0 "Não precisa cortar a cabeça. Dano no corpo."
 tgp_movement_events.0100.desc:0 "\"[ROOT.Char.GetTitleAsNameNoTooltip] Exaltad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )].\" M[Select_CString( spymaster.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spymaster'))] [spymaster.GetTitledFirstName] chama minha atenção no escuro. A madeira range sob os passos ágeis [spymaster.GetHerHim].\n\n\"Recebemos informações de que [rival.GetTitledFirstName], líder do [rival_movement.GetName], pode ser mais suscetível a... sugestões do que se esperava.\""
 tgp_movement_events.0100.t:0 "Uma Palavra de Conselho"
 tgp_movement_events.0110.a:0 "Seguirei seu conselho."
 tgp_movement_events.0110.b:0 "Isso ficará fantástico em minha biblioteca."
 tgp_movement_events.0110.desc:0 "Como membros do [my_movement.GetName], é nosso dever manter não apenas nossas lâminas afiadas, mas também nossas mentes.\n\nPor favor, aceite este livro e estude-o com cuidado."
 tgp_movement_events.0110.opening:0 "[other_ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 tgp_movement_events.0120.a:0 "\"Por favor, ensine-me.\""
 tgp_movement_events.0120.b:0 "Devemos contar apenas com o poder."
 tgp_movement_events.0120.c:0 "\"Um banquete não é lugar para estudar!\""
 tgp_movement_events.0120.desc:0 "Enquanto as taças são reabastecidas com [host.Custom('GetExpensiveDrink')] e os pratos de [host.Custom('GetExpensiveMeal')] desaparecem, [other_ruler.GetTitledFirstName] se inclina mais próximo.\n\n\"Não podemos desapontar o [my_movement.GetName],\" diz [other_ruler.GetSheHe], [other_ruler.Custom('quirk_pos_pp')]. \"Você estudou o [other_ruler.Custom('GetRandomHistoryPassage')], [ROOT.Char.GetTitledFirstNameNoTooltip]?\""
 tgp_movement_events.0120.t:0 "Um Brinde à Virtude"
 tgp_movement_events.0130.a:0 "Devo aprender a língua deles!"
 tgp_movement_events.0130.b:0 "Por que não simplesmente se tornar [capital_culture.GetNameNoTooltip]?"
 tgp_movement_events.0130.c:0 "Em harmonia, viveremos."
 tgp_movement_events.0130.desc:0 "Um[Select_CString( courtier.IsFemale, 'a', '' )] [courtier.GetWomanMan] vestido com fino [other_ruler.Custom('RegionalFabric')] se curva diante de mim:\n\n\"M[Select_CString( other_ruler.IsFemale, 'inha', 'eu' )] [other_ruler.GetLadyLord] [other_ruler.GetTitledFirstName] me ordena a falar em seu nome, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. [other_ruler.GetSheHe|U] teme que as vozes do [my_movement.GetName] possam vacilar na capital se sua língua não for falada.\"\n\n[courtier.GetSheHe|U] [courtier.Custom('quirk_pos_present')] e continua: \"Seria uma honra guiar você nessa jornada.\""
 tgp_movement_events.0130.t:0 "A Língua dos [capital_culture.GetCollectiveNounNoTooltip]"
 tgp_movement_events.0140.a:0 "\"E com prazer aceitarei.\""
 tgp_movement_events.0140.b:0 "\"Lembre-se de que fazemos isso pelo [my_movement.GetNameNoTooltip].\""
 tgp_movement_events.0140.c:0 "\"E quanto ao [ROOT.Char.Custom('GetRandomPoetryPassage')]?\""
 tgp_movement_events.0140.desc:0 "\"Mestre!\" ouço a voz [Select_CString( disciple.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('disciple'))] [disciple.GetTitledFirstNamePossessive] antes mesmo de ver [disciple.GetSheHe].\n\n\"Você me ensinou grandemente sobre os anais do [ROOT.Char.Custom('GetRandomAnnalsPassage')] e os [ROOT.Char.Custom('GetRandomHistoryPassage')], e nutriu meu intelecto com grande cuidado. Como sinal de gratidão, desejo lhe oferecer este presente.\"\n\n[disciple.GetSheHe|U] [disciple.Custom('quirk_pos_present')] e me entrega um pacote [ROOT.Char.Custom('GetSimpleColor')]."
 tgp_movement_events.0140.t:0 "O Presente do Discípulo"
 tgp_movement_events.0150.a:0 "\"Conte-me sobre os [monk.GetFaith.GetAdherentNamePluralNoTooltip].\""
 tgp_movement_events.0150.aa.alliance:0 "Você entra em uma [alliance|E] com [other_ruler.GetShortUIName]"
 tgp_movement_events.0150.aa:0 "\"Diga [Select_CString( other_ruler.IsFemale, 'a sua', 'ao seu' )] [other_ruler.GetLadyLord] que admiro sua diplomacia.\""
 tgp_movement_events.0150.b.failure:0 "[monk.GetShortUIName] mantém sua fé"
 tgp_movement_events.0150.b.success:0 "[monk.GetShortUIName] converte-se"
 tgp_movement_events.0150.b:0 "\"#EMP Isto#! é a terra de [ROOT.Char.GetFaith.HighGodName].\""
 tgp_movement_events.0150.c:0 "\"Você é bem-vindo a ficar.\""
 tgp_movement_events.0150.desc.alone:0 "\"Venho trazendo a vontade de [monk.GetFaith.HighGodName], pois dediquei minha vida ao estudo da fé [monk.GetFaith.GetName].\""
 tgp_movement_events.0150.desc.intro:0 "Vestido com robes da cor de [monk.Custom('GetComplexColor')], um [monk.GetFaith.DevoteeNeuter] entra na sala do trono. Um pequeno amuleto de madeira pende do cinto [monk.GetHerHim], e um leve aroma de incenso o acompanha.\n\n"
 tgp_movement_events.0150.desc.other_ruler:0 "\"Venho trazendo a vontade [Select_CString( other_ruler.IsFemale, 'da minha', 'do meu' )] [other_ruler.GetLadyLord], [other_ruler.GetTitledFirstName],\" diz [monk.GetSheHe], [monk.Custom('quirk_pos_pp')]. \"É meu dever espalhar a palavra de [monk.GetFaith.HighGodName].\""
 tgp_movement_events.0150.desc.outro:0 "Por favor, me aceite em sua corte para que possamos aprender um com o outro."
 tgp_movement_events.0150.t:0 "O [monk.GetFaith.GetNameNoTooltip] [monk.GetFaith.DevoteeNeuter|U]"
 tgp_movement_events.0160.a:0 "Palavras honestas devem bastar."
 tgp_movement_events.0160.b:0 "Nada que um pouco de ouro não possa transmitir."
 tgp_movement_events.0160.c:0 "Não sou de perder opções."
 tgp_movement_events.0160.desc:0 "A vela estala enquanto olho para o [ROOT.Char.Custom('GetWritingMaterial')] em branco à minha frente. [rival.GetTitledFirstName] guia o [rival_movement.GetName] com mão firme, e seria útil não cruzar caminhos com [rival.GetSheHe].\n\nMas tal carta... uma promessa de não guardar ressentimentos... poderia ser vista como um sinal de fraqueza?"
 tgp_movement_events.0160.t:0 "Facas em Descanso"
 tgp_movement_events_0010_add_to_movement_effect_tt:0 "[other_ruler.GetShortUIName|U] se juntará ao [GetPlayer.Custom('GetMyMovement')]"
 tgp_movement_events_0100_remove_from_movement_effect_tt:0 "[rival.GetShortUIName] se juntará ao [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey('undecided_movement').GetName]"
 tgp_movement_events_0160_scheme_blocking_effect_tt:0 "@alert_icon! #alert_trial Você e [rival.GetShortUIName] não poderão iniciar quaisquer [hostile_schemes|E] um contra o outro por #V 15 anos#!#!"
