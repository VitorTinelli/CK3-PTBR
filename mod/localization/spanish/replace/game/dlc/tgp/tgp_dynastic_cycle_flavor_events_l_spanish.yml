l_spanish:
 friend_together_in_preparation:0 "[CHARACTER.GetShortUIName] enviou uma carta para [TARGET_CHARACTER.GetShortUIName] prometendo estar juntos quando a estabilidade retornar ao reino."
 friend_together_in_preparation_corresponding:0 "[TARGET_CHARACTER.GetShortUIName] recebeu uma carta de [CHARACTER.GetShortUIName] prometendo estar juntos quando o avanço chegar."
 tgp_advancement_focus_modifier:0 "Foco no Avanço"
 tgp_advancement_focus_modifier_desc:0 "Este personagem decidiu focar no avanço de seu reino, deixando de lado áreas mais expansivas."
 tgp_debate_discount_var_desc:0 "Do Evento"
 tgp_debate_discount_var_tt:0 "Você pode organizar um [GetActivityType('activity_debate').GetName] nos próximos #V 5 anos#! com um desconto de #P 25%#!"
 tgp_dynastic_cycle_events.0001.a.friend:0 "#EMP Devo enviar uma carta [Select_CString( friend.IsFemale, 'a minha querida', 'ao meu querido' )] [friend.GetTitledFirstNameNoTooltip]#!"
 tgp_dynastic_cycle_events.0001.a.potential_friend:0 "#EMP Devo enviar uma carta ao confiável [potential_friend.GetTitledFirstNameNoTooltip]#!"
 tgp_dynastic_cycle_events.0001.a:0 "É melhor ter amigos quando chegar a hora..."
 tgp_dynastic_cycle_events.0001.aa:0 "O [my_movement.GetNameNoTooltip] trará iluminação!"
 tgp_dynastic_cycle_events.0001.b:0 "O momento de avançar é #EMP agora#!."
 tgp_dynastic_cycle_events.0001.c:0 "Não podemos viver no futuro."
 tgp_dynastic_cycle_events.0001.desc:0 "O jardim está tranquilo, exceto pelo farfalhar das folhas ao vento. No silêncio, meus pensamentos se voltam para o reino nestes tempos de [my_situation.GetTopCurrentPhase.GetName|l].\n\nSerá que apenas resistir será suficiente? O reino pode perseverar quando está tão imóvel quanto este jardim?\n\nO chá na bandeja do meu servo já esfriou."
 tgp_dynastic_cycle_events.0001.t:0 "O Caminho à Frente"
 tgp_dynastic_cycle_events.0010.a:0 "\"Não permitirei que digam que o discípulo d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetFirstNameNoTooltip] é frac[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]!\""
 tgp_dynastic_cycle_events.0010.b:0 "Pobre criança. Devo confortar [disciple.GetSheHe]."
 tgp_dynastic_cycle_events.0010.c:0 "\"É através da dificuldade que se aprende.\""
 tgp_dynastic_cycle_events.0010.desc:0 "[Select_CString( disciple.IsFemale, 'Minha discípula', 'Meu discípulo' )] [disciple.GetTitledFirstName] me visitou, mas seus motivos não são alegres.\n\n'Mestre... o reino deriva como um navio na tempestade. Cada dia traz novos conflitos e novos inimigos. [my_situation.GetTopCurrentPhase.GetName] cresce. Não sei como será o amanhã, o que acontecerá.'\n\nNão posso deixar de notar que suas mãos estão trêmulas."
 tgp_dynastic_cycle_events.0010.t:0 "Sob Pressão"
 tgp_dynastic_cycle_events.0020.a:0 "\"Meus agentes os encontrarão. E #EMP acabarão#! com eles.\""
 tgp_dynastic_cycle_events.0020.b:0 "\"Contrate esses guardas!\""
 tgp_dynastic_cycle_events.0020.c:0 "Pessoas desesperadas fazem coisas desesperadas."
 tgp_dynastic_cycle_events.0020.desc:0 "'[ROOT.Char.Custom('FormOfAddressForLiege')|U], notícias ruins.' M[Select_CString( marshal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))] [marshal.GetName] aproxima-se de mim, [marshal.Custom('quirk_pos_pp')].\n\n'No meio da noite, os camponeses de [peasant_county.GetName] arrombaram os celeiros. Se eu pudesse contratar mais guardas, ainda poderíamos encontrá-los.'\n\nMesmo nosso reino não está seguro de [my_situation.GetTopCurrentPhase.GetName]."
 tgp_dynastic_cycle_events.0020.t:0 "A Mão Ousada da Fome"
 tgp_dynastic_cycle_events.0030.a:0 "É hora de ousar!"
 tgp_dynastic_cycle_events.0030.b:0 "'Estou ansioso para aprender, mas não para mudar.'"
 tgp_dynastic_cycle_events.0030.c:0 "Não há maior honra do que o governo civil."
 tgp_dynastic_cycle_events.0030.desc:0 "'O tempo de [my_situation.GetTopCurrentPhase.GetName] é #EMP agora#!!'\n\nOs passos trovejantes [Select_CString( marshal.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))] [marshal.GetNamePossessive] anunciam sua presença melhor do que palavras.\n\n'Admiro sua dedicação ao caminho civil, mas [my_situation.GetTopCurrentPhase.GetType.GetNameNoTooltip|l] exige ousadia! Lembre-se da história de [ROOT.Char.Custom('GetRandomAnnalsPassage')] e lidere nossas tropas!'"
 tgp_dynastic_cycle_events.0030.t:0 "Mudança de Caminho"
 tgp_dynastic_cycle_events.0040.a:0 "'Este tempo de [my_situation.GetTopCurrentPhase.GetType.GetNameNoTooltip|l] é a ocasião perfeita!'"
 tgp_dynastic_cycle_events.0040.b:0 "'Não desperdice tempo!'"
 tgp_dynastic_cycle_events.0040.c:0 "A Rota da Seda continuará. Com ou sem nós."
 tgp_dynastic_cycle_events.0040.desc:0 "M[Select_CString( steward.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('steward'))] [steward.GetTitledFirstName] entra no estudo com um sorriso no rosto e moedas na mão.\n\n'[ROOT.Char.Custom('FormOfAddressForLiege')|U], as caravanas do oeste se tornam mais frequentes, seguindo [silk_road_situation.GetName]. Com um investimento modesto em melhores conexões, podemos atrair a riqueza de muitos reinos para o nosso.'"
 tgp_dynastic_cycle_events.0040.t:0 "Um Caminho de Oportunidades"
 tgp_dynastic_cycle_events.0050.a:0 "Não posso me permitir duvidar."
 tgp_dynastic_cycle_events.0050.b:0 "O [my_movement.GetNameNoTooltip] terá seus próprios méritos."
 tgp_dynastic_cycle_events.0050.c:0 "Por que arriscar minha própria dignidade pelo movimento?"
 tgp_dynastic_cycle_events.0050.desc:0 "O controle que o [favored_movement.GetName] exerce sobre o trono se fortalece, seu conselho moldando a política a seu gosto.\n\nSe minha própria causa deve subir, devo enfraquecer sua reputação. Um debate público pode influenciar o julgamento da corte e talvez até d[Select_CString( top_liege.IsFemale, 'a', 'o' )] [top_liege.GetTitleAsNamePossessiveNoTooltip].\n\nMas desafiá-los é arriscar a humilhação, caso minhas palavras vacilem."
 tgp_dynastic_cycle_events.0050.t:0 "Uma Mudança de Favor"
 tgp_executed_peasants_county_modifier:0 "Camponeses Executados"
 tgp_executed_peasants_county_modifier_desc:0 "Este condado não esqueceu o tratamento dado aos camponeses famintos."
 tgp_silk_road_advancement_modifier:0 "Avanço na Rota da Seda"
 tgp_silk_road_advancement_modifier_desc:0 "Este personagem investiu na Rota da Seda #EMP exatamente na hora certa#!."
