l_spanish:
 grand_campaign_added_war_target_tt:0 "[target_title.GetName] foi adicionado como [title|E] contestado e objetivo de guerra para a [war|E] #V [grand_campaign_war.GetName]#!"
 single_quotation_desc:0 "\""
 tgp_china_ministry.0001.a:0 "Que a [GetTitleByKey('h_china').GetNameNoTooltip] cresça!"
 tgp_china_ministry.0001.desc:0 "[great_project.GetName] está em andamento. O orgulho e as ambições de [owner.GetNamePossessive] estão em jogo.\n\n\"É uma grande honra fazer parte da história em formação.\" exclama orgulhosamente [contributor.GetName]. \"Nossa vitória sobre [defender.GetName] será rápida e tema de poemas vindouros. Em breve, todo [target_title.GetName] estará sob o Céu!\""
 tgp_china_ministry.0001.t:0 "$great_project_type_grand_campaign_project$: Avante"
 tgp_china_ministry.0002.a:0 "Avante!"
 tgp_china_ministry.0002.desc:0 "[great_project.GetName] toma a vitória das mãos de [defender.GetName].\n\n\"Em breve traremos todo [target_title.GetName] sob o Céu!\" afirma confiante [attacker.GetName]."
 tgp_china_ministry.0002.t:0 "$great_project_type_grand_campaign_project$: Sucesso"
 tgp_china_ministry.0003.a:0 "Minha paciência está se esgotando."
 tgp_china_ministry.0003.desc:0 "[great_project.GetName] sofre uma derrota pelas mãos de [defender.GetName].\n\n\"Um pequeno obstáculo no caminho para a vitória!\" tranquiliza [attacker.GetName]."
 tgp_china_ministry.0003.t:0 "$great_project_type_grand_campaign_project$: Fracasso"
 tgp_china_ministry.0004.a:0 "Considere [target_title.GetNameNoTierNoTooltip] sob o Céu."
 tgp_china_ministry.0004.desc:0 "[great_project.GetName] já está em movimento. [contributor.GetName] declara disposição para se juntar ao esforço de guerra.\n\n\"[Select_CString( title_holder.IsFemale, 'A fraca', 'O fraco' )] [title_holder.GetName] não é páreo para a [GetTitleByKey('h_china').GetName]. Tenho planos de como tomar [target_title.GetName].\""
 tgp_china_ministry.0004.t:0 "$great_project_type_grand_campaign_project$: Mais Além"
 tgp_china_ministry.0005.a_lost:0 "Toda [GetTitleByKey('h_china').GetNameNoTooltip] deveria se envergonhar."
 tgp_china_ministry.0005.a_win:0 "Ótimo esforço!"
 tgp_china_ministry.0005.desc_lost:0 "[great_project.GetName] foi um desastre terrível. As terras de [target_kingdom.GetName] resistiram ao poder da [GetTitleByKey('h_china').GetName]\n\n\"Resultado inesperado.\" [owner.GetTitleAsName] segura sua raiva, \"Que o povo saiba que [ROOT.Char.GetPrimaryTitle.GetName] trouxe grande vergonha sobre os Céus!\""
 tgp_china_ministry.0005.desc_won:0 "[great_project.GetName] foi um grande sucesso. As terras de [target_kingdom.GetName] agora são parte integral da [GetTitleByKey('h_china').GetName]\n\n\"Resultado esperado, mas ainda assim uma razão para celebrar.\" Regozija-se o imperador, \"Que o povo saiba que [ROOT.Char.GetPrimaryTitle.GetName] é o maior sob o Céu!\""
 tgp_china_ministry.0005.t:0 "$great_project_type_grand_campaign_project$: Pôr do Sol"
 tgp_china_ministry.0006.a:0 "Que pena."
 tgp_china_ministry.0006.desc:0 "Lamento informar que [great_project.GetName] teve que ser cancelado."
 tgp_china_ministry.0006.opening:0 "[founder.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 tgp_china_ministry.0007.a:0 "$tgp_china_ministry.0001.a$"
 tgp_china_ministry.0007.desc:0 "$tgp_china_ministry.0001.desc$"
 tgp_china_ministry.0007.t:0 "$tgp_china_ministry.0001.t$"
 tgp_china_ministry.0100.a:0 "Muito bem. Vamos definir um novo orçamento."
 tgp_china_ministry.0100.a_tooltip:0 "Você poderá escolher um [treasury_budget|E] entre várias opções"
 tgp_china_ministry.0100.b:0 "Mantenha as alocações como estão."
 tgp_china_ministry.0100.c:0 "Confio no seu julgamento neste assunto."
 tgp_china_ministry.0100.deficit_desc:0 "Nossas despesas são muito altas, e o tesouro entrará em colapso sem ação."
 tgp_china_ministry.0100.fallback_desc:0 "Já se passaram vários anos desde que o último orçamento entrou em vigor."
 tgp_china_ministry.0100.income_desc:0 "Nossa receita atual excede em muito nossas despesas."
 tgp_china_ministry.0100.intro:0 "Chegou a hora de revisar o orçamento de [ROOT.Char.Custom('GetRealmRank')]."
 tgp_china_ministry.0100.solo_desc:0 "Encontro-me cercado por um pequeno exército de escribas, carregando pergaminhos, tomos e notas fiscais. Todos aguardam que eu termine minha revisão.\n\n"
 tgp_china_ministry.0100.steward_desc:0 "[steward.GetShortUIName] está diante de mim, testa franzida, livro de contas em mãos. Um pequeno exército de assistentes segue [steward.GetSheHe], carregando pergaminhos, tomos e notas fiscais.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]. Nós #EMP devemos#! revisar nossas despesas e preparar um novo orçamento para o tesouro. Receio que não possamos adiar essa questão.\""
 tgp_china_ministry.0100.t:0 "O Tesouro de [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 tgp_china_ministry.0101.a:0 "Os salários devem ser nossa prioridade."
 tgp_china_ministry.0101.b:0 "Assegure que todos os ministros recebam uma boa parcela."
 tgp_china_ministry.0101.c:0 "Um exército forte significa um reino forte."
 tgp_china_ministry.0101.d:0 "Reserve uma maior porção apenas para uso imperial."
 tgp_china_ministry.0101.desc:0 "Diversos documentos com propostas estão diante de mim, cada um traçando um caminho diferente para o tesouro — onde gastar e onde apertar os recursos.\n\nQual devo escolher?"
 tgp_china_ministry.0101.e:0 "Uma economia equilibrada nos servirá melhor."
 tgp_china_ministry.0200.a:0 "Excelente. Coloque em prática imediatamente!"
 tgp_china_ministry.0200.b:0 "Receio que eu tenha outros planos para o tesouro."
 tgp_china_ministry.0200.desc:0 "Mais uma vez [Select_CString( minister_of_revenue.IsFemale, 'minha', 'meu' )] [minister_of_revenue.GetCouncilTitle], [minister_of_revenue.GetFirstName], está diante de mim, livro de contas em mãos.\n\n\"Asseguro-lhe, [ROOT.Char.Custom('FormOfAddressForLiege')] — o tesouro prosperará se seguirmos minha sugestão!\""
 tgp_china_ministry.0200.t:0 "O Orçamento de um Ministro"
 tgp_china_ministry.0200.toast_desc_failure:0 "[treasury_ruler.GetShortUIName|U] rejeitou sua proposta"
 tgp_china_ministry.0200.toast_desc_success:0 "[treasury_ruler.GetShortUIName|U] aprovou sua proposta"
 tgp_china_ministry.0200.toast_t_failure:0 "Orçamento Rejeitado"
 tgp_china_ministry.0200.toast_t_success:0 "Orçamento Aceito"
 tgp_treasury_enact_balanced_budget_desc:0 "Promulgue um [treasury_budget|E] com o seguinte:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] definido para [GetLaw('budget_allocation_salary_35').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_ministry_budget|E] definido para [GetLaw('budget_allocation_ministry_30').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] definido para [GetLaw('budget_allocation_military_25').GetShortName|V]#!"
 tgp_treasury_enact_balanced_budget_info_desc:0 "Foco da [treasury_budget_category|E]: @law_icon!Equilibrado\nUm [treasury_budget|E] que busca distribuir a [treasury|E] de maneira uniforme entre todas as categorias."
 tgp_treasury_enact_hegemon_budget_desc:0 "Promulgue um [treasury_budget|E] com o seguinte:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] definido para [GetLaw('budget_allocation_salary_30').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_ministry_budget|E] definido para [GetLaw('budget_allocation_ministry_25').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] definido para [GetLaw('budget_allocation_military_25').GetShortName|V]#!"
 tgp_treasury_enact_hegemon_budget_info_desc:0 "Foco da [treasury_budget_category|E]: @legitimacy_icon_mandate![son_of_heaven|E]\nUm [treasury_budget|E] que deixa uma maior porção da [treasury|E] não alocada, permitindo que o [liege|E] gaste como desejar."
 tgp_treasury_enact_meritocratic_balanced_budget_desc:0 "Promulgue um [treasury_budget|E] com o seguinte:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] definido para [GetLaw('budget_allocation_salary_45').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] definido para [GetLaw('budget_allocation_military_45').GetShortName|V]#!"
 tgp_treasury_enact_meritocratic_military_budget_desc:0 "Promulgue um [treasury_budget|E] com o seguinte:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] definido para [GetLaw('budget_allocation_salary_35').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] definido para [GetLaw('budget_allocation_military_55').GetShortName|V]#!"
 tgp_treasury_enact_meritocratic_salary_budget_desc:0 "Promulgue um [treasury_budget|E] com o seguinte:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] definido para [GetLaw('budget_allocation_salary_55').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] definido para [GetLaw('budget_allocation_military_35').GetShortName|V]#!"
 tgp_treasury_enact_military_budget_desc:0 "Promulgue um [treasury_budget|E] com o seguinte:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] definido para [GetLaw('budget_allocation_salary_30').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_ministry_budget|E] definido para [GetLaw('budget_allocation_ministry_20').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] definido para [GetLaw('budget_allocation_military_40').GetShortName|V]#!"
 tgp_treasury_enact_military_budget_info_desc:0 "Foco da [treasury_budget_category|E]: @celestial_military_administration![treasury_military_budget_short|E]\nUm [treasury_budget|E] geralmente apreciado pelos [governors|E] militares — que recebem fundos adicionais para recrutar e manter [title_men_at_arms|E]."
 tgp_treasury_enact_ministry_budget_desc:0 "Promulgue um [treasury_budget|E] com o seguinte:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] definido para [GetLaw('budget_allocation_salary_25').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_ministry_budget|E] definido para [GetLaw('budget_allocation_ministry_45').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] definido para [GetLaw('budget_allocation_military_20').GetShortName|V]#!"
 tgp_treasury_enact_ministry_budget_info_desc:0 "Foco da [treasury_budget_category|E]: @government_type_celestial![treasury_ministry_budget_short|E]\nUm [treasury_budget|E] geralmente apreciado pelos [ministers|E] — que recebem fundos adicionais para gastar em suas responsabilidades, como iniciar [great_projects|E]."
 tgp_treasury_enact_salary_budget_desc:0 "Promulgue um [treasury_budget|E] com o seguinte:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] definido para [GetLaw('budget_allocation_salary_45').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_ministry_budget|E] definido para [GetLaw('budget_allocation_ministry_25').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] definido para [GetLaw('budget_allocation_military_20').GetShortName|V]#!"
 tgp_treasury_enact_salary_budget_info_desc:0 "Foco da [treasury_budget_category|E]: @gold_icon![treasury_salary_budget_short|E]\nUm [treasury_budget|E] geralmente apreciado pelos [governors|E] — que podem ganhar opinião positiva se a nova alocação melhorar seus salários."
