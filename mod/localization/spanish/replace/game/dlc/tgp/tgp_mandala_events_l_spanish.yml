 maximum_devotion_reached_msg_desc:0 "O [maximum_piety_level|E] foi alcançado.\nPara permitir que seu [heir|E] de [close_family|E] progrida ainda mais, procure encontrar sua [character_death_death|E] de uma forma digna do seu [aspect|E]."
