 piety_inherited_msg:0 "Expectativas do Devoto"
 piety_inherited_msg_desc:0 "Uma parte da devoção do seu predecessor [deceased_mandala_ruler.GetShortUINamePossessive] brilha sobre você"
 tgp_east_asia_mandala_events.1000.a:0 "Tudo está como deve ser."
 tgp_east_asia_mandala_events.1000.desc.02:0 "Para grande alegria, danças e ritos de [ROOT.Char.Custom('GetAspectNoun')], trouxe orgulho à casa [ROOT.Char.GetHouse.GetBaseName] ao ascender ao próximo passo do aspeto de [ROOT.Char.Custom('GetAspectNoun')].\n\nOs tremores dos nossos #EMP poderes#! e atos divinos atraem mais seguidores a cada dia.\n\nPermito-me saborear isso por um momento, observando o espetáculo dos celebrantes diante de mim."
 tgp_east_asia_mandala_events.1000.desc.03.outro:0 "Reclino-me e observo os sacrifícios simbólicos e os artistas dançando em minha honra. #EMP Nosso poder cresce.#!"
 tgp_east_asia_mandala_events.1000.desc.05.intro:0 "Por fim, a jornada da casa [ROOT.Char.GetHouse.GetBaseName] e de seus descendentes divinos chega à conclusão."
 tgp_east_asia_mandala_events.1000.desc.creation_03:0 "Um banquete para homenagear um aspeto de criação — um espetáculo delicioso de cor, dança e música — é realizado como celebração da ascensão da casa [ROOT.Char.GetHouse.GetBaseName] ao passo intermediário da criação.\n\nProvando-nos divinos, ato após ato, estamos reunindo uma grande quantidade de seguidores.\n\nCorreção — #EMP eu#! estou reunindo uma grande quantidade de seguidores. E eles acreditam #EMP em mim#!."
 tgp_east_asia_mandala_events.1000.desc.creation_04:0 "Um banquete significativamente barulhento — que outra forma haveria de celebrar um aspeto quase impecável de criação? Os dançarinos, os ritos, os vislumbres de pele nua, celebrando a criação e a nova ascensão da casa [ROOT.Char.GetHouse.GetBaseName].\n\nNossa vasta quantidade de fiéis nos consolida firmemente como uma força imparável, reivindicando nosso lugar no mundo.\n\nPego um saboroso [ROOT.Char.Custom('GetAspectNoun')] de uma mesa próxima e me delicio enquanto aprecio o espetáculo."
 tgp_east_asia_mandala_events.1000.desc.creation_05:0 "$tgp_east_asia_mandala_events.1000.desc.05.intro$\n\nAgora não resta dúvida na mente de ninguém de que as irmãs e irmãos de [ROOT.Char.GetHouse.GetBaseNameNoTooltip] carregam as marcas e atributos do aspeto da criação, trazendo à terra as obras do criador.\n\nCom #EMP mim#! como seu gestalt, é claro.\n\nTomo outro gole de [ROOT.Char.Custom('RegionalDrink')], marcando o início de semanas de celebrações."
 tgp_east_asia_mandala_events.1000.desc.destruction_03:0 "Um ruído ensurdecedor enquanto as tropas batem suas armas contra os escudos, chamando atenção para a ascensão da casa [ROOT.Char.GetHouse.GetBaseName] ao passo intermediário do aspeto de destruição.\n\nAs notícias do nosso legado se espalham rapidamente e nosso número de seguidores é ainda maior que antes.\n\n$tgp_east_asia_mandala_events.1000.desc.03.outro$"
 tgp_east_asia_mandala_events.1000.desc.destruction_04:0 "#EMP TROMP, TROMP.#! Nenhum som é ouvido além das pisadas trovejantes dos soldados de [ROOT.Char.GetPrimaryTitle.GetBaseName] enquanto realizam seus ritos de celebração, imitando a dança da destruição agora que a casa [ROOT.Char.GetHouse.GetBaseName] está tão próxima da transcendência completa.\n\nNossos seguidores estão ansiosos para se juntar à nossa causa e servir sob um verdadeiro aspeto de destruição.\n\nSorrio de canto e acaricio cuidadosamente minha lâmina com a pedra de amolar enquanto observo a cerimônia.\n\n#EMP TROMP, TROMP.#!"
 tgp_east_asia_mandala_events.1000.desc.destruction_05:0 "$tgp_east_asia_mandala_events.1000.desc.05.intro$\n\nA própria terra parece tremer e sacudir enquanto as tropas juramentadas de [ROOT.Char.GetPrimaryTitle.GetBaseName] realizam suas pisadas, cantos e rituais temíveis, em servidão às irmãs e irmãos de [ROOT.Char.GetHouse.GetBaseNameNoTooltip].\n\nEles se ajoelham brevemente diante de mim, seu deus, antes de continuar a cerimônia.\n\nAcaricio distraidamente um crânio, presente recebido em um dos ritos, enquanto me recosto no trono."
 tgp_east_asia_mandala_events.1000.desc.serenity_03:0 "Uma celebração organizada com o máximo cuidado; a ascensão da casa [ROOT.Char.GetHouse.GetBaseName] ao passo intermediário do aspeto de serenidade não poupa despesas.\n\nOs seguidores dos nossos caminhos pacíficos crescem constantemente, enquanto as pessoas vêm perceber os benefícios do nosso modo de viver.\n\nAproveito a oportunidade para tornar este mundo um lugar melhor. Um lugar mais tranquilo."
 tgp_east_asia_mandala_events.1000.desc.serenity_04:0 "Uma celebração magnífica começando com uma meditação comunitária — a vasta quantidade de cabeças inclinadas em tranquilidade realmente faz meu coração cantar. Que melhor maneira de honrar a casa [ROOT.Char.GetHouse.GetBaseName] estando à beira de um aspeto impecável de serenidade?\n\nEssa grande quantidade de fiéis simboliza nosso lugar neste mundo. Uma sede por paz e silêncio. Por aceitação e harmonia.\n\nMais uma vez abaixo minha cabeça em oração silenciosa e meditação, ponderando sobre isso."
 tgp_east_asia_mandala_events.1000.desc.serenity_05:0 "$tgp_east_asia_mandala_events.1000.desc.05.intro$\n\nInimigos tornados amigos. Paz e prosperidade permeando o reino. A sabedoria e tranquilidade instauradas pelas irmãs e irmãos da casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip] deixaram uma marca duradoura em [ROOT.Char.GetPrimaryTitle.GetBaseName].\n\nUma celebração genuinamente serena, para o genuíno gestalt do aspeto de serenidade.\n\nInclino minha cabeça benevolentemente em resposta às suas graciosas orações e bons votos."
 tgp_east_asia_mandala_events.1000.desc.trickery_03:0 "Avancei com sucesso o legado de divindades travessas da casa [ROOT.Char.GetHouse.GetBaseName], e as celebrações rituais são proporcionalmente alegres.\n\nUm por um, os inimigos da casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip] misteriosamente caem ou juntam-se a nós como seguidores.\n\n$tgp_east_asia_mandala_events.1000.desc.03.outro$"
 tgp_east_asia_mandala_events.1000.desc.trickery_04:0 "Oferendas, tantas oferendas para apaziguar a casa [ROOT.Char.GetHouse.GetBaseName], agora à beira de se tornar aspectos impecáveis da trapaça.\n\nOuro, peles, especiarias. Conchas, animais exóticos. Nossos seguidores sabem como nos agradar. Ou sabem?\n\nIsso cabe #EMP a mim#! decidir, lançando minha teia de sombras sobre qualquer um que se oponha a mim.\n\nDou uma risadinha contida."
 tgp_east_asia_mandala_events.1000.desc.trickery_05:0 "$tgp_east_asia_mandala_events.1000.desc.05.intro$\n\nTudo parece festivo e regular na superfície, mas todos sabem que o menor deslize ou falha moral pode resultar em uma visita de uma das imprevisíveis divindades [ROOT.Char.GetHouse.GetBaseNameNoTooltip].\n\nTodos estão desesperados para manter nosso favor divino e permanecer na linha. #EMP Na minha#! linha.\n\nLanço um olhar sobre a multidão, ponderando astutamente quem será o próximo digno da minha atenção."
 tgp_east_asia_mandala_events.1000.t.final:0 "$aspect_upgrade_event_header$ Transcendência"
 tgp_east_asia_mandala_events.1000.t:0 "$aspect_upgrade_event_header$ Ascensão"
 tgp_east_asia_mandala_events.8497.t.lose_by_default:0 "Provas de Sucessão Mandala Não Prosseguiram"
 tgp_east_asia_mandala_events.8497.tt.lose_by_default:0 "$tgp_east_asia_mandala_events.8499.a.tt.imprisoned$"
 tgp_east_asia_mandala_events.8499.a.flavor.imprisoned:0 "Não era assim que deveria ter acontecido..."
 tgp_east_asia_mandala_events.8499.a.imprisoned:0 "Eu juro."
 tgp_east_asia_mandala_events.8499.a.tt.imprisoned:0 "Você falha nas Provas de [mandala_succession_succession|E] por não comparecer"
 tgp_east_asia_mandala_events.8499.a.tt.trials:0 "A primeira Prova de [mandala_succession_succession|E] começa"
 tgp_east_asia_mandala_events.8499.a:0 "Estou tão pronto quanto posso estar."
 tgp_east_asia_mandala_events.8499.desc.imprisoned:0 "\n\nMas como posso fazer tal coisa enquanto estou aqui, nesta prisão, sendo #EMP tudo menos divino#!? Coberto de imundície, tratado como um animal.\n\nJuro que terei minha vingança quando sair daqui. #EMP Que minha fúria caia sobre meus inimigos#!."
 tgp_east_asia_mandala_events.8499.desc.recent_adult:0 "Chegou a hora! Finalmente é o meu momento de suceder [Select_CString( deceased_mandala_ruler.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )], [deceased_mandala_ruler.GetFirstName], participando das provas.\n\nDemonstrando minha excelência em cada área, meu desempenho e recepção determinarão o quanto meus seguidores terão fé em mim como o aspecto de [ROOT.Char.Custom('GetAspectNoun')], daqui em diante.\n\nEu #EMP devo#! suceder [Select_CString( deceased_mandala_ruler.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )]!"
 tgp_east_asia_mandala_events.8499.desc.was_traveling:0 "A poeira mal havia baixado antes que eu fosse conduzido às câmaras, banhos preparados, vestes trocadas pelas de um próprio [ROOT.Char.GetTitleAsNameNoTooltip].\n\nArrepiado pelo tratamento brusco e pela súbita mudança de temperatura, preparo-me mentalmente para as provações que me aguardam.\n\nMinha oportunidade de provar que sou um sucessor digno [Select_CString( deceased_mandala_ruler.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )], e de encarnar o aspecto de [ROOT.Char.Custom('GetAspectNoun')]. É hora."
 tgp_east_asia_mandala_events.8499.desc:0 "M[Select_CString( deceased_mandala_ruler.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )], [deceased_mandala_ruler.GetFirstName], já não está mais entre nós. [deceased_mandala_ruler.GetSheHe|U] ascendeu deste plano de existência, deixando para mim o dever de assumir, canalizar o aspecto de [ROOT.Char.Custom('GetAspectNoun')] e guiar nosso reino, gravando-o nos anais da história.\n\nDevo realizar as provas, mostrando o quão divino e onipresente sou, destacando-me em uma infinidade de aspectos.\n\n... um arrepio percorre minha espinha ao considerar, por um instante, a alternativa."
 tgp_east_asia_mandala_events.8499.intro.imprisoned:0 "A notícia chega até mim, nas profundezas das masmorras [Select_CString( ROOT.Char.GetImprisonedBy.IsFemale, 'da', 'do' )] [ROOT.Char.GetImprisonedBy.GetTitledFirstName]. [Select_CString( deceased_mandala_ruler.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )], [deceased_mandala_ruler.GetFirstName], deixou este mundo, deixando para mim o dever de liderar o reino."
 tgp_east_asia_mandala_events.8499.intro.recent_adult.imprisoned:0 "Finalmente alcancei o limiar da idade adulta; chegou o momento de participar das provas e mostrar ao reino o quanto sou digno de suceder [Select_CString( deceased_mandala_ruler.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )], [deceased_mandala_ruler.GetFirstName]."
 tgp_east_asia_mandala_events.8499.t:0 "$mandala_succession_header$ as Provas"
 tgp_east_asia_mandala_events.8500.a.final_aspect:0 "Você não está no nível final de [aspect_of_creation|E]"
 tgp_east_asia_mandala_events.8500.a:0 "\"Meus pecados e o ciúme dos outros, meu filho.\""
 tgp_east_asia_mandala_events.8500.b.flavor:0 "Tenho #EMP quase certeza#! de que foi assim?"
 tgp_east_asia_mandala_events.8500.b.t.failure:0 "Sem Impressão"
 tgp_east_asia_mandala_events.8500.b.t.success:0 "Muito Convincente"
 tgp_east_asia_mandala_events.8500.b.tt.failure:0 "Um murmúrio de descrença percorre a multidão"
 tgp_east_asia_mandala_events.8500.b.tt.success:0 "Você consegue convencê-los"
 tgp_east_asia_mandala_events.8500.b:0 "\"Ah, deixe-me lhe contar...\""
 tgp_east_asia_mandala_events.8500.desc:0 "Estamos no meio dos rituais de criação, celebrando minha ascensão ao trono. Misturo-me à multidão, sorrindo benevolentemente para meus seguidores enquanto eles se aproximam com suas oferendas.\n\nUma criança pequena surge da multidão, envolvendo meus quadris com os braços em um abraço espontâneo. [Select_CString( dummy_gender.IsFemale, 'A', 'O' )] [dummy_gender.Custom('GirlBoy')] então olha para mim e pergunta: \"[ROOT.Char.GetTitleAsNameNoTooltip|U]... o que #EMP aconteceu#! com sua quinta cabeça?\"\n\nSeu cuidador parece petrificado com a insolência, mas percebo que todos na câmara se endireitam, ansiosos pela minha resposta."
 tgp_east_asia_mandala_events.8500.dynasty.override:0 "\"Seus professores deveriam ser capazes de lhe dizer.\""
 tgp_east_asia_mandala_events.8500.success.tt:0 "Você é bem-sucedido na Prova de [stewardship|E] da [mandala_succession_succession|E]"
 tgp_east_asia_mandala_events.8500.t:0 "$mandala_succession_header$ Perdendo a Cabeça"
 tgp_east_asia_mandala_events.8510.a.final_aspect:0 "Você não está no nível final de [aspect_of_serenity|E]"
 tgp_east_asia_mandala_events.8510.a:0 "\"Vocês compartilham a terra #EMP e#! compartilham a colheita.\""
 tgp_east_asia_mandala_events.8510.b.flavor:0 "Por que as pessoas são tão mesquinhas..."
 tgp_east_asia_mandala_events.8510.b.t.failure:0 "$tgp_east_asia_mandala_events.8500.b.t.failure$"
 tgp_east_asia_mandala_events.8510.b.t.success:0 "$tgp_east_asia_mandala_events.8500.b.t.success$"
 tgp_east_asia_mandala_events.8510.b.tt.failure:0 "$tgp_east_asia_mandala_events.8500.b.tt.failure$"
 tgp_east_asia_mandala_events.8510.b.tt.success:0 "$tgp_east_asia_mandala_events.8500.b.tt.success$"
 tgp_east_asia_mandala_events.8510.b:0 "\"E se resolvêssemos isso #EMP deste#! jeito...\""
 tgp_east_asia_mandala_events.8510.desc:0 "Os assistentes estão ajoelhados em fileiras ordenadas, e um cântico baixo ecoa pela câmara durante o ritual de ascensão. Caminho suavemente entre eles, tocando levemente algumas testas, tentando transmitir paz e serenidade.\n\nNo meio disso, [Select_CString( dummy_gender.IsFemale, 'duas', 'dois' )] [dummy_gender.GetWomenMen] estão discutindo em voz alta lá fora por causa de um pedaço de terra.\n\nO tumulto fez com que todos na sala voltassem sua atenção para mim, observando ansiosamente como lidarei com essa perturbação da paz."
 tgp_east_asia_mandala_events.8510.dynasty.override:0 "\"Este é um lugar sagrado, controlem-se.\""
 tgp_east_asia_mandala_events.8510.success.tt:0 "Você é bem-sucedido na Prova de [diplomacy|E] da [mandala_succession_succession|E]"
 tgp_east_asia_mandala_events.8510.t:0 "$mandala_succession_header$ Tranquilo como um Lago"
 tgp_east_asia_mandala_events.8520.a.final_aspect:0 "Você não está no nível final de [aspect_of_destruction|E]"
 tgp_east_asia_mandala_events.8520.a:0 "Eu poderia fazer isso até #EMP dormindo#!!"
 tgp_east_asia_mandala_events.8520.b.flavor:0 "Um, dois, ah... de lado?"
 tgp_east_asia_mandala_events.8520.b.t.failure:0 "$tgp_east_asia_mandala_events.8500.b.t.failure$"
 tgp_east_asia_mandala_events.8520.b.t.success:0 "$tgp_east_asia_mandala_events.8500.b.t.success$"
 tgp_east_asia_mandala_events.8520.b.tt.failure:0 "$tgp_east_asia_mandala_events.8500.b.tt.failure$"
 tgp_east_asia_mandala_events.8520.b.tt.success:0 "$tgp_east_asia_mandala_events.8500.b.tt.success$"
 tgp_east_asia_mandala_events.8520.b:0 "Certo, vamos tentar isso..."
 tgp_east_asia_mandala_events.8520.desc:0 "Minha lança reflete a luz trêmula das tochas, e a multidão silenciosa observa ansiosamente meu rosto coberto de cinzas. Um mar de flores me cerca enquanto as conchas emitem um som baixo e vibrante.\n\nEspera-se que eu realize a dança cósmica; a dança da destruição, simbolizando a dualidade divina. A destruição do antigo, criando espaço para que o novo floresça e cresça.\n\nA pedra cilíndrica no centro da clareira emana uma calma refrescante enquanto me aproximo dela."
 tgp_east_asia_mandala_events.8520.dynasty.override:0 "\"Nasci para isso, é meu direito.\""
 tgp_east_asia_mandala_events.8520.success.tt:0 "Você é bem-sucedido na Prova de [martial|E] da [mandala_succession_succession|E]"
 tgp_east_asia_mandala_events.8520.t:0 "$mandala_succession_header$ A Dança da Destruição"
 tgp_east_asia_mandala_events.8530.a.final_aspect:0 "Você não está no nível final de [aspect_of_trickery|E]"
 tgp_east_asia_mandala_events.8530.a:0 "\"Deixem-me lhes falar sobre a ilusão da dualidade.\""
 tgp_east_asia_mandala_events.8530.b.flavor:0 "Pelo menos é isso que eu #EMP quero#! que eles pensem."
 tgp_east_asia_mandala_events.8530.b.t.failure:0 "$tgp_east_asia_mandala_events.8500.b.t.failure$"
 tgp_east_asia_mandala_events.8530.b.t.success:0 "$tgp_east_asia_mandala_events.8500.b.t.success$"
 tgp_east_asia_mandala_events.8530.b.tt.failure:0 "$tgp_east_asia_mandala_events.8500.b.tt.failure$"
 tgp_east_asia_mandala_events.8530.b.tt.success:0 "$tgp_east_asia_mandala_events.8500.b.tt.success$"
 tgp_east_asia_mandala_events.8530.b:0 "\"... e se eu dissesse que a enganação não é #EMP real#!?\""
 tgp_east_asia_mandala_events.8530.desc:0 "A multidão se reuniu aqui para me ver. Para ser encantada por #EMP mim#!. Grupos conversam em sussurros, e um sino toca em algum lugar, indicando que chegou a hora.\n\nEntro no círculo, ao lado da pedra cilíndrica, e descanso minha palma sobre sua superfície lisa e fria.\n\nUma infinidade de rostos, jovens e velhos, se cala e volta-se para mim enquanto limpo a garganta, preparando meu discurso:"
 tgp_east_asia_mandala_events.8530.dynasty.override:0 "\"Permitam-me falar sobre aqueles que vieram antes de mim.\""
 tgp_east_asia_mandala_events.8530.success.tt:0 "Você é bem-sucedido na Prova de [intrigue|E] da [mandala_succession_succession|E]"
 tgp_east_asia_mandala_events.8530.t:0 "$mandala_succession_header$ Verdadeiras Ilusões"
 tgp_east_asia_mandala_events.8550.a.failed.tt:0 "Sua inadequação fez com que o [realm|E] se dissolvesse"
 tgp_east_asia_mandala_events.8550.a.failed:0 "Não era assim que isso devia acontecer!"
 tgp_east_asia_mandala_events.8550.a:0 "Estou pronto."
 tgp_east_asia_mandala_events.8550.desc.critical_success:0 "Saudações, aplausos, vivas por todos os lados. A multidão está em êxtase, e o alívio de ver sua nova divindade estar à altura da divindade de [Select_CString( deceased_mandala_ruler.IsFemale, 'sua predecessora', 'seu predecessor' )] [deceased_mandala_ruler.GetFirstName] é palpável.\n\nFlores são jogadas em minha direção, pessoas cantam, outras batem palmas ou pisam no chão em exaltação. Um pequeno banquete se forma espontaneamente, e meus seguidores continuam entoando meu nome e brindando até tarde da noite.\n\nFiz um bom trabalho, e o caminho à frente é promissor. Permito-me um sorriso discreto."
 tgp_east_asia_mandala_events.8550.desc.failed:0 "Meus joelhos tremem e minha cabeça gira levemente ao perceber o que está prestes a acontecer. Falhei com [Select_CString( deceased_mandala_ruler.IsFemale, 'a', 'o' )] [deceased_mandala_ruler.GetFirstName] e falhei com o reino.\n\nNão sou um sucessor digno do [ROOT.Char.GetPrimaryTitle.GetName]. Não há nada sobre o que construir.\n\nNum momento de clareza, olho ao redor e percebo que todos se foram — ou estão saindo — de costas, entre murmúrios decepcionados e resmungos. Caio de joelhos, permitindo que o peso do mundo me derrube momentaneamente."
 tgp_east_asia_mandala_events.8550.desc.success:0 "Um sussurro silencioso percorre a sala, transformando-se em murmúrios intermediários e, por fim, em aplausos sinceros quando provei ser uma divindade em ascensão.\n\nEmbora eu não tenha alcançado completamente o nível de divindade [Select_CString( deceased_mandala_ruler.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )] [deceased_mandala_ruler.GetFirstNamePossessive], mostrei aos meus seguidores que tenho a capacidade de nos salvar de situações complicadas, mais ou menos fora do meu controle.\n\nHá um claro potencial de crescimento aqui, e aguardo ansiosamente para me provar ainda mais."
 tgp_east_asia_mandala_events.8550.desc:0 "A câmara explode em murmúrios entre grupos de servos; cortesãos que sempre considerei meus amigos e súditos leais. Seus olhos me observam com desconfiança, pois ficou provado que eu #EMP não#! sou tão divino quanto [Select_CString( deceased_mandala_ruler.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )], [deceased_mandala_ruler.GetFirstName].\n\nBaixo levemente a cabeça, ansioso pelo que está por vir. Então percebo como isso pode ser interpretado e ergo as costas, enfrentando desafiadoramente o olhar de cada grupo murmurante na sala.\n\nHá muita confiança a ser restaurada aqui, e o caminho à frente será #EMP turbulento#!."
 tgp_east_asia_mandala_events.8550.t.failed:0 "$mandala_succession_header$ Sem Caminho à Frente"
 tgp_east_asia_mandala_events.8550.t:0 "$mandala_succession_header$ O Caminho à Frente"
 tgp_east_asia_mandala_events.9000.a.diff_faith:0 "\"[bystander.GetFaith.HighGodName]? O que isso significa?\""
 tgp_east_asia_mandala_events.9000.a:0 "\"Eu #EMP sempre#! me senti um pouco diferente...\""
 tgp_east_asia_mandala_events.9000.b:0 "\"A divindade terá que esperar.\""
 tgp_east_asia_mandala_events.9000.desc.lightning_strike:0 "#EMP SHKRRASCHHH#! — o clarão do relâmpago realmente veio do nada. Me vejo caído no chão, atordoado, mas praticamente ileso.\n\nAo meu redor, uma multidão começou a se reunir em um pequeno semicírculo, e um[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetWomanMan] proclama que fui testado pelo divino. Outro insiste que agora estou #EMP imbuído#! com a essência de [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]."
 tgp_east_asia_mandala_events.9000.desc.scar:0 "\"[ROOT.Char.GetFirstNameNoTooltip]!\", [Select_CString( bystander.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', bystander)] [bystander.GetTitledFirstName] exclama, visivelmente corado(a). “Essa cicatriz! No seu ombro! Ela... sempre foi assim...” [bystander.GetSheHe] pausa por um instante, visivelmente perplexo(a), “Parece o rosto de [bystander.GetFaith.HighGodName]!”\n\nPisco algumas vezes enquanto [bystander.GetSheHe] reflete sobre a situação, então [bystander.GetSheHe] exclama com uma força surpreendente: “Claramente você é abençoad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [bystander.Custom2('RelationToMe', ROOT.Char )]! Você foi marcado(a) para transcender este mundo!”\n\nAgora, servos e plebeus próximos percebem o alvoroço, me observam de cima a baixo e murmuram em concordância: “#EMP Olhe só para isso...#!”"
 tgp_east_asia_mandala_events.9000.outro.diff_faith.lightning_strike:0 "\n\nUm[Select_CString( bystander.IsFemale, 'a', '' )] [bystander.GetWomanMan] silencios[Select_CString( bystander.IsFemale, 'a', 'o' )], mais afastad[Select_CString( bystander.IsFemale, 'a', 'o' )], me lança um olhar calmo e comenta: “Então [bystander.GetFaith.HighGodName] se manifestou em nossa era...”"
 tgp_east_asia_mandala_events.9000.outro.lightning_strike:0 "\n\nUm[Select_CString( bystander.IsFemale, 'a', '' )] [bystander.GetWomanMan] calm[Select_CString( bystander.IsFemale, 'a', 'o' )], mais afastad[Select_CString( bystander.IsFemale, 'a', 'o' )], me lança um olhar sereno e comenta: “Então [ROOT.Char.GetFaith.HighGodName] se manifestou em nossa era...”"
 tgp_east_asia_mandala_events.9000.t:0 "Intervenção Divina"
 tgp_east_asia_mandala_events.lose_3_tributaries.tt:0 "#alert_trial Até #V 3#! [tributaries|E] o abandonam#!"
 tgp_east_asia_mandala_events.lose_all_tributaries.tt:0 "@alert_icon! #alert_trial Todos os seus [tributaries|E] o abandonam#!"
