 tenet_mountain_worship_desc:0 "Longe de vilarejos e fazendas, as montanhas tocam as nuvens acima. É lá, entre picos e penhascos, que o sagrado pode ser verdadeiramente encontrado."
 tenet_mountain_worship_name:0 "Montanhas Sagradas"
 tenet_no_mind_desc:0 "A mente que é sem mente é a mente que atingiu verdadeira atenção plena. Um estado cultivado por artistas, artesãos e artistas marciais, onde o corpo responde a todos os desafios sem pensar."
 tenet_no_mind_name:0 "Mente Sem Mente"
 tenet_pure_land_desc:0 "Aqui em #EMP paścima-kāla#! — a Era Degenerada do Dharma — riquezas, estudos ou nascimento elevado não oferecem consolo. Apenas verdadeiros devotos dos preceitos do Buda podem encontrar renascimento na Terra Pura."
 tenet_pure_land_name:0 "Renascimento Justo"
 tenet_sohei_name:0 "Sōhei"
