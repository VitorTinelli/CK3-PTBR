 tgp_admin_contract_natural_disaster_failure_tt:0 "Você pode sofrer penalidades, como perder [prestige_i|E][prestige|E] ou [influence_i|E][influence|E]"
 tgp_admin_contract_natural_disaster_tt_rewards:0 "Você pode escolher entre uma variedade de recompensas, incluindo:#indent_newline:3 \n$EFFECT_LIST_BULLET$$admin_contract_success_tt_xp$\n$EFFECT_LIST_BULLET$[experience|E] nos [lifestyles|E]\n$EFFECT_LIST_BULLET$[influence_i|E][influence|E]\n$EFFECT_LIST_BULLET$[prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$[piety_i|E][piety|E]\n$EFFECT_LIST_BULLET$[county_opinion|E]\n$EFFECT_LIST_BULLET$Melhorias em seus [counties|E]#!"
 tgp_assisting_physician_modifier:0 "Apoio Médico"
 tgp_assisting_physician_modifier_desc:0 "Um conjunto de médicos foi enviado a este condado para aliviar o sofrimento dos feridos e mutilados."
 tgp_demand_food_from_nobles_modifier:0 "Exigir Alimentos dos Nobres"
 tgp_demand_food_from_nobles_modifier_desc:0 "As reservas de grãos deste condado foram reforçadas ao obrigar a assistência de notáveis locais."
 tgp_deployed_troops_character_modifier:0 "Mantenedor da Ordem"
 tgp_deployed_troops_character_modifier_desc:0 "Este personagem é um defensor entusiástico da aplicação rigorosa da lei, usando força se necessário."
 tgp_deployed_troops_modifier:0 "Saques Desenfreados"
 tgp_deployed_troops_modifier_desc:0 "Mesmo a visão impressionante de nossas tropas não conseguiu conter a ganância desenfreada dos saqueadores e pilhadores deste condado."
 tgp_disaster_displacement:0 "Ceifadores da Ruína"
 tgp_disaster_displacement_contract:0 "$tgp_disaster_displacement$"
 tgp_disaster_displacement_desc:0 "Ladrões e saqueadores dominaram este condado, na esteira da recente devastação."
 tgp_disaster_displacement_desc_title:0 "$task_contract_governance_desc_title$"
 tgp_disaster_displacement_request:0 "$admin_request_choose_opportunity$"
 tgp_distribution_of_food_character_modifier:0 "Alimentando os Necessitados"
 tgp_distribution_of_food_character_modifier_desc:0 "Este personagem convenceu seus súditos a distribuir alimentos aos desamparados da região."
 tgp_distribution_of_food_modifier:0 "Distribuição de Alimentos"
 tgp_distribution_of_food_modifier_desc:0 "Este condado ganhou suprimentos adicionais na forma de alimentos."
 tgp_food_shortage:0 "Escassez de Alimentos"
 tgp_food_shortage_contract:0 "$tgp_food_shortage$"
 tgp_food_shortage_desc:0 "Um desastre atingiu este condado, tornando os alimentos escassos entre a população."
 tgp_food_shortage_desc_title:0 "$task_contract_governance_desc_title$"
 tgp_food_shortage_request:0 "$admin_request_choose_opportunity$"
 tgp_haggle_with_merchants_modifier:0 "Comerciantes Benevolentes"
 tgp_haggle_with_merchants_modifier_desc:0 "Este condado recebeu ajuda adicional de comerciantes viajantes."
 tgp_labor_exchange_character_modifier:0 "Força de Trabalho Relutante"
 tgp_labor_exchange_character_modifier_desc:0 "Em troca de abrigo contra a tempestade, este personagem negociou mão de obra adicional dentro de seu domínio."
 tgp_medical_assistance_character_modifier:0 "Mangás Arregaçados"
 tgp_medical_assistance_character_modifier_desc:0 "Este personagem participou pessoalmente no atendimento aos mutilados e feridos."
 tgp_medical_assistance_modifier:0 "Medicina Imperfeita"
 tgp_medical_assistance_modifier_desc:0 "Boas intenções nem sempre levam a bons resultados. Os habitantes deste condado vivenciaram de perto as mãos bem-intencionadas, mas inexperientes, de seu governador."
 tgp_medieval_medicine:0 "Tratando os Desafortunados"
 tgp_medieval_medicine_contract:0 "$tgp_medieval_medicine$"
 tgp_medieval_medicine_desc:0 "Um desastre atingiu este condado! O número de mortos é considerável, superado apenas pelo número de deslocados e feridos que necessitam de assistência."
 tgp_medieval_medicine_desc_title:0 "$task_contract_governance_desc_title$"
 tgp_medieval_medicine_request:0 "$admin_request_choose_opportunity$"
 tgp_natural_disaster_contract_event.0001.a:0 "O povo clama de fome, e não ficará sem resposta."
 tgp_natural_disaster_contract_event.0001.b:0 "Nossas reservas são preciosas e não temos nada a oferecer."
 tgp_natural_disaster_contract_event.0001.desc:0 "Os alimentos tornaram-se escassos em [natural_disaster_contract_destination.GetName], deixando os cidadãos sem escolha a não ser buscar desesperadamente fontes alternativas – e às vezes #EMP pouco ortodoxas#! – de sustento. Aqueles com recursos estão fazendo o possível para ajudar, mas nossa intervenção foi solicitada."
 tgp_natural_disaster_contract_event.0001.t:0 "$tgp_food_shortage$"
 tgp_natural_disaster_contract_event.0002.a:0 "Alcance todos os súditos possíveis!"
 tgp_natural_disaster_contract_event.0002.b:0 "Consiga o que precisam, custe o que custar: pagarei eu mesmo."
 tgp_natural_disaster_contract_event.0002.c.tt.failure:0 "Os comerciantes escolheram o lucro sobre a benevolência"
 tgp_natural_disaster_contract_event.0002.c.tt.success:0 "Os comerciantes concordaram em ajudar na operação de socorro"
 tgp_natural_disaster_contract_event.0002.c:0 "Persuadirei os comerciantes a abrir seus armazéns."
 tgp_natural_disaster_contract_event.0002.d:0 "Obrigue os privilegiados a contribuir com o socorro."
 tgp_natural_disaster_contract_event.0002.desc:0 "Os lamentáveis gritos dos famintos ecoam pelas ruas enquanto meu séquito é cercado por esfomeados assim que chegamos, os olhos ocos desses mendigos tão desprovidos de esperança quanto seus estômagos de alimento. O grão que trouxemos é suficiente para alimentar alguns, mas não todos – e a privação rapidamente se transforma em desespero perigoso."
 tgp_natural_disaster_contract_event.0002.t:0 "$tgp_food_shortage$"
 tgp_natural_disaster_contract_event.0005.a:0 "Vou supervisionar pessoalmente os esforços de socorro."
 tgp_natural_disaster_contract_event.0005.b:0 "Sua situação é trágica, mas suas desventuras são apenas algumas entre muitas."
 tgp_natural_disaster_contract_event.0005.desc:0 "Após um desastre recente, os cidadãos de [natural_disaster_contract_destination.GetName] estão inundando meu escritório com petições e pedidos de assistência para reconstruir suas casas."
 tgp_natural_disaster_contract_event.0005.t:0 "$tgp_ravaged_buildings$"
 tgp_natural_disaster_contract_event.0006.a:0 "Leve o máximo possível para a segurança, ficaremos para resgatar o resto."
 tgp_natural_disaster_contract_event.0006.b:0 "Os enterrados não podem ser salvos, devemos abrigar os sobreviventes."
 tgp_natural_disaster_contract_event.0006.c.tt.desc.failure:0 "As ruínas desabaram antes que você pudesse libertar os presos"
 tgp_natural_disaster_contract_event.0006.c.tt.desc.success:0 "As vítimas presas foram libertadas com sucesso"
 tgp_natural_disaster_contract_event.0006.c.tt.failure:0 "As ruínas desabaram na tempestade, esmagando aqueles presos abaixo"
 tgp_natural_disaster_contract_event.0006.c.tt.success:0 "As vítimas presas foram libertadas com sucesso"
 tgp_natural_disaster_contract_event.0006.c:0 "Nossa primeira prioridade deve ser libertar os presos sob os escombros."
 tgp_natural_disaster_contract_event.0006.d:0 "Um lugar para viver em troca de sua força parece um acordo justo."
 tgp_natural_disaster_contract_event.0006.desc:0 "Os destroços espalhados diante dos meus olhos são um testemunho da gravidade do desastre que atingiu [natural_disaster_contract_destination.GetName].\n\nDesprovidos de suas casas, os feridos e desesperados recorrem a mim em busca de abrigo, enquanto os fracos gritos dos presos ecoam das ruínas. E com nuvens de tempestade se formando no horizonte, sua necessidade se torna ainda mais urgente."
 tgp_natural_disaster_contract_event.0006.t:0 "$tgp_ravaged_buildings$"
 tgp_natural_disaster_contract_event.0010.a:0 "Despache um novo mensageiro informando que estou a caminho."
 tgp_natural_disaster_contract_event.0010.b:0 "Os mortos já não podem ser ajudados; meu dever é com os que ainda estão em perigo."
 tgp_natural_disaster_contract_event.0010.desc:0 "Um mensageiro chegou com notícias terríveis de uma calamidade que atingiu [natural_disaster_contract_destination.GetName] — os mortos são incontáveis, e os sobreviventes estão feridos e em extrema necessidade de cuidados."
 tgp_natural_disaster_contract_event.0010.t:0 "$tgp_medieval_medicine$"
 tgp_natural_disaster_contract_event.0011.a:0 "Que nossos médicos atendam primeiro aos feridos."
 tgp_natural_disaster_contract_event.0011.b.tt.failure:0 "Tentativa infrutífera de ajudar pessoas necessitadas"
 tgp_natural_disaster_contract_event.0011.b.tt.success:0 "Pessoas necessitadas foram assistidas com sucesso"
 tgp_natural_disaster_contract_event.0011.b:0 "Traga-me as crianças e os idosos, cuidarei deles pessoalmente."
 tgp_natural_disaster_contract_event.0011.c:0 "Honre os mortos e garanta que recebam enterros apropriados."
 tgp_natural_disaster_contract_event.0011.d:0 "Cuidados podem ser fornecidos àqueles que podem pagar por eles."
 tgp_natural_disaster_contract_event.0011.desc:0 "A mensagem do mensageiro mal fez justiça à situação, os mortos superam em muito os vivos, e o fedor podre da morte e da decomposição é inescapável.\n\nOs próprios sobreviventes parecem estar em situação melhor do que seus parentes falecidos, e quase nenhum deles saiu ileso do desastre.\n\nDiante de tanto sofrimento e luto, mal sei por onde começar a direcionar nossos esforços."
 tgp_natural_disaster_contract_event.0011.t:0 "$tgp_medieval_medicine$"
 tgp_natural_disaster_contract_event.0015.a:0 "Parece que uma mão firme é necessária para restaurar a ordem."
 tgp_natural_disaster_contract_event.0015.b:0 "Os males que os homens fazem estão além de qualquer remédio."
 tgp_natural_disaster_contract_event.0015.desc:0 "O pior do recente desastre em [natural_disaster_contract_destination.GetName] pode ter passado, mas aqueles com ganância no coração aproveitaram a oportunidade para se enriquecer às custas dos deslocados."
 tgp_natural_disaster_contract_event.0015.t:0 "$tgp_disaster_displacement$"
 tgp_natural_disaster_contract_event.0016.a.tt.desc.failure:0 "Os saqueadores escorregadios escapam dos seus esforços para capturá-los"
 tgp_natural_disaster_contract_event.0016.a.tt.desc.success:0 "Suas tropas conseguiram prender os saqueadores"
 tgp_natural_disaster_contract_event.0016.a.tt.failure:0 "Suas tropas não conseguiram prender os saqueadores"
 tgp_natural_disaster_contract_event.0016.a.tt.success:0 "Suas tropas prenderam os saqueadores com sucesso"
 tgp_natural_disaster_contract_event.0016.a:0 "Desloque nossas tropas e faça com que prendam os saqueadores."
 tgp_natural_disaster_contract_event.0016.b:0 "Mate alguns dos saqueadores, isso servirá de exemplo para os demais."
 tgp_natural_disaster_contract_event.0016.c:0 "Confisque o que foi recuperado para minha #EMP inspeção pessoal#!"
 tgp_natural_disaster_contract_event.0016.d:0 "Pague aos saqueadores para que partam de vez."
 tgp_natural_disaster_contract_event.0016.desc:0 "A baixeza da natureza humana está plenamente visível em [natural_disaster_contract_destination.GetName], as pessoas aqui parecem mais interessadas em tomar os bens de seus vizinhos do que em oferecer ajuda.\n\nAlguma medida de ordem deve ser restaurada aqui antes que qualquer tentativa de reconstrução possa ser feita."
 tgp_natural_disaster_contract_event.0016.t:0 "$tgp_disaster_displacement$"
 tgp_natural_disaster_travel_to_contract_destination:0 "Viajar para [natural_disaster_contract_destination.GetName] e investigar o problema"
 tgp_pay_from_own_pocket_character_modifier:0 "Pagou do Próprio Bolso"
 tgp_pay_from_own_pocket_character_modifier_desc:0 "Este personagem usou altruisticamente seu próprio dinheiro para alimentar os famintos."
 tgp_pay_from_own_pocket_modifier:0 "Dinheiro do Bolso"
 tgp_pay_from_own_pocket_modifier_desc:0 "Este condado recebeu ajuda diretamente do bolso de seu governador."
 tgp_paying_off_the_looters_modifier:0 "Saqueadores Subornados"
 tgp_paying_off_the_looters_modifier_desc:0 "Em troca de algum ouro, os saques desenfreados desapareceram da área, permitindo a recuperação."
 tgp_prayers_to_the_people_character_modifier:0 "Respeitador dos Mortos"
 tgp_prayers_to_the_people_character_modifier_desc:0 "Este personagem demonstrou claramente o respeito que tem pelos falecidos."
 tgp_ravaged_buildings:0 "Destruído pela Natureza"
 tgp_ravaged_buildings_contract:0 "$tgp_ravaged_buildings$"
 tgp_ravaged_buildings_desc:0 "Esta terra foi atingida por uma calamidade, sua infraestrutura desmoronada e em extrema necessidade de reparos."
 tgp_ravaged_buildings_desc_title:0 "$task_contract_governance_desc_title$"
 tgp_ravaged_buildings_request:0 "$admin_request_choose_opportunity$"
 tgp_rebuild_settlement_character_modifier:0 "Virtuoso Reconstrutor"
 tgp_rebuild_settlement_character_modifier_desc:0 "Este personagem está acostumado a lidar com as consequências de desastres e domina as complexidades da reconstrução."
 tgp_rebuild_settlement_modifier:0 "Reconstruindo o Assentamento"
 tgp_rebuild_settlement_modifier_desc:0 "Medidas extensas foram tomadas para reconstruir o que este condado perdeu em um desastre recente."
 tgp_remove_debris_modifier:0 "Fora dos Escombros"
 tgp_remove_debris_modifier_desc:0 "No processo de libertar os presos nas ruínas de suas casas, os locais também foram convenientemente limpos para a reconstrução."
 tgp_setting_an_example_character_modifier:0 "Ordem pela Espada"
 tgp_setting_an_example_character_modifier_desc:0 "Este personagem demonstrou disposição para trazer ordem de forma rápida, eficaz e sem hesitação."
 tgp_temporary_shelters_modifier:0 "Abrigo da Tempestade"
 tgp_temporary_shelters_modifier_desc:0 "Embora privados de suas casas em um desastre recente, as pessoas aqui receberam acomodações temporárias."
