l_spanish:
 claim_mandate_decision_modifier:0 "$game_concept_son_of_heaven$"
 hegemony_of_china_desc:0 "$game_concept_de_jure$ da [GetTitleByKey('h_china').GetName]: $VALUE|+0=$"
 impugned_my_sovereignty:0 "Contestou Minha Soberania"
 is_already_administrative:0 "Já é $game_concept_administrative_government$: $VALUE|+0=$"
 minister_scheme_slots_modifier:0 "Chefe do Ministério"
 minister_scheme_slots_modifier_desc:0 "Este personagem está no comando de um dos departamentos mais altos do governo Celestial. Ter todo o aparato à disposição aumenta enormemente o alcance de qualquer esquema potencial."
 tea_ceremony_family:0 "Chá em Família"
 tea_ceremony_family_desc:0 "Este personagem reuniu sua família em torno de um bule de chá."
 tea_ceremony_health_benefit:0 "Uma Xícara de Chá Saudável"
 tea_ceremony_health_benefit_desc:0 "Este personagem tomou uma xícara de chá e se sente muito melhor por isso."
 tea_ceremony_peace_of_mind:0 "Chá para a Mente"
 tea_ceremony_peace_of_mind_desc:0 "Este personagem tomou uma xícara de chá benéfica para a mente."
 tea_ceremony_perfect_tea:0 "Chá Perfeito Servido"
 tea_ceremony_perfect_tea_desc:0 "Este personagem serviu um bule de chá perfeito — pelo menos segundo os presentes."
 tea_ceremony_spirit:0 "Chá para o Espírito"
 tea_ceremony_spirit_desc:0 "Este personagem tomou uma xícara de chá enquanto refletia sobre o mundo espiritual."
 tgp_adequately_trained_monks_modifier:0 "Monjes Adequadamente Treinados"
 tgp_adequately_trained_monks_modifier_desc:0 "Os monges desta região foram supervisionados nas artes marciais pelo marechal de seu senhor e estão pelo menos parcialmente preparados para defender sua posição contra qualquer atacante."
 tgp_aided_farmers_modifier:0 "Apoio aos Camponeses"
 tgp_aided_farmers_modifier_desc:0 "Este condado foi permitido a recuperar seus jovens dos esforços de guerra de seu senhor."
 tgp_aspiration_great_salary_modifier:0 "Salário Muito Melhorado"
 tgp_aspiration_great_salary_modifier_desc:0 "Este personagem desempenhou suas funções excepcionalmente bem e ganhou um significativo bônus salarial."
 tgp_aspiration_modest_salary_modifier:0 "Salário Melhorado"
 tgp_aspiration_modest_salary_modifier_desc:0 "Este personagem desempenhou bem suas funções e ganhou um bônus salarial."
 tgp_bypassed_provincial_exam_modifier:0 "Exame Pulado"
 tgp_bypassed_provincial_exam_modifier_desc:0 "Este personagem completou com sucesso os exames de nível superior sem passar primeiro pelo exame local."
 tgp_child_exam_cooldown_modifier:0 "Exame Infantil Fracassado"
 tgp_child_exam_cooldown_modifier_desc:0 "Participar dos Exames Imperiais é um evento formativo para todos que aspiram às alturas do céu, mas este personagem teve dificuldades sob a pressão."
 tgp_child_focused_studies_modifier:0 "Estudos Focados"
 tgp_courtly_influence_modifier:0 "Influência na Corte"
 tgp_courtly_influence_modifier_desc:0 "Os camponeses deste condado se beneficiam dos conhecimentos adquiridos por um deles durante seu tempo na corte."
 tgp_debunked_deity_modifier:0 "Divindade Desmascarada"
 tgp_debunked_deity_modifier_desc:0 "Este personagem destruiu com sucesso uma divindade em sua infância, matando-a por meio de retórica habilidosa."
 tgp_diligent_workers_modifier:0 "Trabalhadores Diligentes"
 tgp_diligent_workers_modifier_desc:0 "Os camponeses desta região trabalham arduamente para agradar seu senhor, a fim de proteger seus jovens do recrutamento."
 tgp_disciplined_farmers_modifier:0 "Camponeses Disciplinares"
 tgp_disciplined_farmers_modifier_desc:0 "Os camponeses deste condado têm trabalhado vigorosamente após testemunharem uma execução pública."
 tgp_fattened_vanguard_modifier:0 "Vanguarda Fortalecida"
 tgp_fattened_vanguard_modifier_desc:0 "Este condado fornece todos os homens aptos disponíveis ao exército de seu senhor."
 tgp_forced_labor_modifier:0 "Trabalho Forçado"
 tgp_forced_labor_modifier_desc:0 "Os súditos deste condado são obrigados a trabalhar sob ameaça de violência, e seu ressentimento em relação à autoridade aumenta."
 tgp_forced_to_retake_exam_modifier:0 "Aguardando Exame no Palácio"
 tgp_forced_to_retake_exam_modifier_desc:0 "Este personagem aguarda nervosamente o próximo [GetActivityType('activity_imperial_examination').GetName], pressionado por sua família a competir no mais alto nível."
 tgp_grand_canal_modifier:0 "Grande Canal"
 tgp_grand_canal_modifier_desc:0 "Esta área se beneficia de um canal, várias vias navegáveis e aquedutos que facilitam o transporte de mercadorias e o movimento de comerciantes."
 tgp_greatly_equipped_soldiers_modifier:0 "Soldados Impressionantemente Equipados"
 tgp_greatly_equipped_soldiers_modifier_desc:0 "Equipados com o melhor equipamento disponível, os soldados destacados aqui tendem a ter bom desempenho em batalha."
 tgp_honor_is_the_way_modifier:0 "A Honra é o Caminho"
 tgp_honor_is_the_way_modifier_desc:0 "Este personagem é inspirado pela influência orientadora de seus professores e familiares."
 tgp_joined_grand_campaign_modifier:0 "Participou da Grande Campanha"
 tgp_joined_grand_campaign_modifier_desc:0 "Este personagem contribuiu para a guerra ordenada pelo estado. Grandes expectativas vêm com o apoio do governo."
 tgp_known_exam_cheater_modifier:0 "Trapaceiro em Exame"
 tgp_known_exam_cheater_modifier_desc:0 "Este personagem foi exposto como um trapaceiro em exames."
 tgp_local_exam_impressed_examiner:0 "Examinador Impressionado"
 tgp_local_exam_initial_success:0 "Bom Começo no Exame"
 tgp_local_exam_initial_success_desc:0 "Um começo bem-sucedido cria uma impressão duradoura."
 tgp_local_exam_strong_finish:0 "Final Forte no Exame"
 tgp_local_exam_strong_finish_desc:0 "No final da tarde de um teste longo e desafiador, os alunos mais brilhantes se destacam na multidão."
 tgp_lowborn_chastiser_modifier:0 "Castigador dos Plebeus"
 tgp_lowborn_chastiser_modifier_desc:0 "Este personagem ajudou a livrar seus súditos da vergonha de serem pobres, usando ameaças e ordens de violência física."
 tgp_lowborn_tenderizer_modifier:0 "Amansador dos Plebeus"
 tgp_lowborn_tenderizer_modifier_desc:0 "Este personagem ajudou a livrar seus súditos da vergonha de serem pobres, e as medidas disciplinares deixaram pouca coisa restante."
 tgp_minister_project_conduct_census_fertility_effort_modifier:0 "$great_project_type_minister_project_conduct_census_contribution_fertility_effort$"
 tgp_minister_project_conduct_census_fertility_effort_modifier_desc:0 "O [holder|E] deste condado se beneficiará do programa do Ministério da Receita para incentivo à fertilidade, emitido durante o [GetGreatProjectType('minister_project_conduct_census').GetName]. O Ministério pagará o [treasury|E] pelo próximo recém-nascido."
 tgp_minister_project_conduct_census_modifier:0 "Censo Realizado"
 tgp_minister_project_conduct_census_modifier_desc:0 "Este condado teve um censo conduzido pelo [minister_of_revenue|E]"
 tgp_minister_project_conduct_census_natural_disaster_insurance_modifier:0 "$great_project_type_minister_project_conduct_census_contribution_natural_disaster_insurance$"
 tgp_minister_project_conduct_census_natural_disaster_insurance_modifier_desc:0 "O [holder|E] deste condado se beneficiará do seguro do Ministério da Receita contra [natural_disasters|E], emitido durante o [GetGreatProjectType('minister_project_conduct_census').GetName]. O Ministério pagará o [treasury|E] durante um surto de desastre."
 tgp_minister_project_conduct_census_purge_treasury_debt_modifier:0 "Medidas Anti-Dívida"
 tgp_minister_project_conduct_census_purge_treasury_debt_modifier_desc:0 "Este personagem se beneficia do programa do Ministério da Receita para prevenção de [treasury_debt|E], emitido durante o [GetGreatProjectType('minister_project_conduct_census').GetName]."
 tgp_minister_project_development_modifier:0 "Comunidades Desenvolvidas"
 tgp_minister_project_development_modifier_desc:0 "Um [great_project|E] recentemente dedicou consideráveis esforços para desenvolver esta área, melhorando cidades, vilarejos locais e as estradas que os conectam."
 tgp_minister_project_establish_control_modifier:0 "Burocracia Integrada"
 tgp_minister_project_establish_control_modifier_desc:0 "Este condado passou recentemente por melhorias em sua administração, aumentando grandemente o controle do governo sobre a área."
 tgp_minister_project_train_troops_levy_bootcamp_modifier:0 "$great_project_type_minister_project_train_troops_contribution_levy_bootcamp$"
 tgp_minister_project_train_troops_levy_bootcamp_modifier_desc:0 "As levas deste condado são treinadas por generais do departamento central do Ministério da Guerra."
 tgp_minister_project_train_troops_modifier:0 "$great_project_type_minister_project_train_troops_contribution_train_troops$"
 tgp_minister_project_train_troops_modifier_desc:0 "Os Soldados de Elite deste condado completaram um treinamento rigoroso sancionado pelo Ministério da Guerra."
 tgp_minister_project_train_troops_natural_disaster_test_modifier:0 "$great_project_type_minister_project_train_troops_contribution_natural_disaster_test$"
 tgp_minister_project_train_troops_natural_disaster_test_modifier_desc:0 "Este condado está preparado para evacuação organizada, mitigação de danos e reconstrução rápida em caso de desastre natural graças aos treinamentos obrigatórios do Ministério da Guerra."
 tgp_minister_project_train_troops_siege_exercise_modifier:0 "$great_project_type_minister_project_train_troops_contribution_siege_exercise$"
 tgp_minister_project_train_troops_siege_exercise_modifier_desc:0 "Este condado foi treinado pelo Ministério da Guerra para lançar cercos devastadores e resistir a cercos duas vezes mais fortes."
 tgp_outmatched_local_warriors_modifier:0 "Instintos de Batalha Afiados"
 tgp_outmatched_local_warriors_modifier_desc:0 "Este personagem buscou novos desafios em novos lugares, apenas para se encontrar superior a todos."
 tgp_passed_metropolitan_exam_modifier:0 "Exame Metropolitano Aprovado"
 tgp_passed_palace_exam_modifier:0 "Exame do Palácio Aprovado"
 tgp_passed_provincial_exam_modifier:0 "Exame Provincial Aprovado"
 tgp_recruited_charlatan_modifier:0 "Charlatão Recrutado"
 tgp_recruited_charlatan_modifier_desc:0 "Este personagem ganhou experiência em intriga a partir de sua interação com um poeta medíocre."
 tgp_resisted_alcohol_modifier:0 "Resistiu ao Álcool"
 tgp_resisted_alcohol_modifier_desc:0 "Este personagem absteve-se de participar de uma festa de bebida de Baijiu."
 tgp_sanctioned_deity_modifier:0 "Divindade Aprovada"
 tgp_sanctioned_deity_modifier_desc:0 "Este condado adora uma divindade recém-aprovada, e o fluxo constante de visitantes ao seu santuário é benéfico para os habitantes."
 tgp_stationed_troops_modifier:0 "Região Fortificada"
 tgp_strengthen_capital_architects_modifier:0 "Arquitetura Impecável"
 tgp_strengthen_capital_architects_modifier_desc:0 "A capital do Filho do Céu foi reformada sob a supervisão de arquitetos habilidosos, melhorando grandemente a capacidade da capital para crescimento populacional e comércio."
 tgp_strengthen_capital_character_modifier:0 "Construtor da Capital"
 tgp_strengthen_capital_character_modifier_desc:0 "A capital do Filho do Céu passou por reformas recentes, melhorando grandemente sua majestade. A área da capital agora é o centro indiscutível do reino."
 tgp_strengthen_capital_engineers_modifier:0 "Engenharia Genial"
 tgp_strengthen_capital_engineers_modifier_desc:0 "A capital do Filho do Céu foi reformada sob a supervisão de engenheiros talentosos, melhorando grandemente sua infraestrutura e conexões com assentamentos próximos."
 tgp_strengthen_capital_modifier:0 "Capital Celestial"
 tgp_strengthen_capital_modifier_desc:0 "$tgp_strengthen_capital_character_modifier_desc$\n\n[dynastic_cycle|E]: #EMP Não#! haverá Desvio Anual de [favored_movement|E] em qualquer [dynastic_cycle_era_type_stable|E] enquanto esta for a [realm_capital|E][AddLocalizationIf( HasDlcFeature( 'wards_and_wardens' ), 'tgp_strengthen_capital_modifier_education_bonus')]"
 tgp_strengthen_capital_modifier_education_bonus:0 "\nAumenta o sucesso para a [activity|E] [GetActivityType('activity_adult_education').GetTextIcon][GetActivityType('activity_adult_education').GetName] nesta [location|E]"
 tgp_strengthen_capital_sculptors_modifier:0 "Esculturas Gloriosas"
 tgp_strengthen_capital_sculptors_modifier_desc:0 "Durante a reforma da capital do Filho do Céu, os melhores escultores do reino foram contratados para embelezar cuidadosamente cada aspecto da nova arquitetura."
 tgp_sworn_service_modifier:0 "Juramento de Serviço"
 tgp_sworn_service_modifier_desc:0 "Este personagem está pagando a dívida de seus pais servindo na corte. Não pode partir até que a dívida seja quitada."
 tgp_trained_monks_modifier:0 "Monjes Bem Treinados"
 tgp_trained_monks_modifier_desc:0 "Os monges desta região foram supervisionados nas artes marciais por seu senhor e estão preparados para defender sua posição contra qualquer atacante."
 tgp_unpressed_taxes_modifier:0 "Impostos Não Cobráveis"
 tgp_unpressed_taxes_modifier_desc:0 "Este condado está prosperando sob o governo de um magistrado benevolente."
 tgp_well_equipped_soldiers_modifier:0 "Soldados Bem Equipados"
 tgp_well_equipped_soldiers_modifier_desc:0 "Os soldados destacados nesta posse estão melhor equipados que a maioria."
 tgp_wiles_is_the_way_modifier:0 "A Astúcia é o Caminho"
 tgp_wiles_is_the_way_modifier_desc:0 "Por que seguir o Caminho quando você pode cortá-lo?"
