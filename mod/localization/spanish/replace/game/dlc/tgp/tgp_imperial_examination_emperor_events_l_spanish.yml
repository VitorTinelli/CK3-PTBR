l_spanish:
 becomes_imperial_examiner.tt:0 "Torna-se um Examinador"
 custom_every_examiner:0 "Todos os Examinadores"
 emperor_imperial_examination.100.a:0 "Lealdade; uma virtude acima de todas."
 emperor_imperial_examination.100.b:0 "O elogio é passageiro, ações demonstram esforço."
 emperor_imperial_examination.100.desc:0 "\"Mais august[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] e sábi[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip], é a maior honra estar em sua presença.\" M[Select_CString( examination_character_2.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)], [examination_character_2.GetTitledFirstName], fala em admiração. \"Que este exame prove que sou seu leal servo.\"\n\n\"Que o poder e esplendor de [ROOT.Char.GetPrimaryTitle.GetNameNoTier], e [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.Custom('GetDaughterSon')|U] do Céu, perdurem por dez mil anos!\""
 emperor_imperial_examination.100.t:0 "Em Reverência"
 emperor_imperial_examination.1000.a:0 "Seus esforços serão reconhecidos."
 emperor_imperial_examination.1000.b:0 "Imitações de [examination_character_2.GetCulture.GetNameNoTooltip] não têm lugar aqui."
 emperor_imperial_examination.1000.desc:0 "\"Sábi[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip], venho diante de você com humilde gratidão,\" diz o candidato ao palácio, [examination_character_2.GetTitledFirstName], falando fluentemente [chinese.GetLanguage.GetName]. \"Embora eu seja [examination_character_2.GetCulture.GetName] de nascimento e língua, cheguei até aqui graças à sua graça — e nada desejo mais do que servir [ROOT.Char.GetPrimaryTitle.GetNameNoTier].\"\n\n\"Assim, aprendi a língua dos céus — [chinese.GetLanguage.GetName] — como marca da humildade [examination_character_2.GetCulture.GetName]."
 emperor_imperial_examination.1000.t:0 "Talento Estrangeiro"
 emperor_imperial_examination.200.a:0 "[examination_character_1.GetSheHe|U] pode juntar-se ao harém."
 emperor_imperial_examination.200.b:0 "Conte-me sobre suas viagens."
 emperor_imperial_examination.200.c:0 "Meu palácio parece um bordel?"
 emperor_imperial_examination.200.desc:0 "\"Vossa majestade estimada,\" m[Select_CString( examination_character_2.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)], [examination_character_2.GetTitledFirstName], fala reverentemente. \"Durante minhas viagens em [concubine_origin.GetNameNoTier] conheci uma família de bom nome, a [examination_character_1.GetHouse.GetName], e conversei com os anciãos [examination_character_1.GetCulture.GetName].\"\n\n\"Eles me pediram para selecionar um[Select_CString( examination_character_1.IsFemale, 'a', '' )] [examination_character_1.GetLadyLord] para servir em seu palácio — escolhi [examination_character_1.GetFirstName], um[Select_CString( examination_character_1.IsFemale, 'a', '' )] [examination_character_1.GetWomanMan] de rara graça. Esperamos que [examination_character_1.GetSheHe] lhe agrade, ó [ROOT.Char.Custom('GetDaughterSon')|U] do Céu.\""
 emperor_imperial_examination.200.t:0 "Uma Beleza Selecionada"
 emperor_imperial_examination.300.a:0 "Uma oferta digna."
 emperor_imperial_examination.300.b:0 "Artesanato inferior, descarte-o."
 emperor_imperial_examination.300.c:0 "A casa [examination_character_2.GetHouse.GetNameNoTooltip] precisa focar no exame."
 emperor_imperial_examination.300.desc:0 "\"Grande [ROOT.Char.GetTitleAsNameNoTooltip], sua graça sábia é vasta.\" M[Select_CString( examination_character_2.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)], [examination_character_2.GetTitledFirstName], prostra-se diante de mim. \"Trago uma oferta humilde, um artefato para exibição no palácio.\"\n\n\"Este [newly_created_artifact.GetName] é uma herança da casa [examination_character_2.GetHouse.GetName]. Não pedimos nada além de que sua majestade soberana nos reconheça como servos leais.\""
 emperor_imperial_examination.300.t:0 "Oferta de Herança"
 emperor_imperial_examination.400.a:0 "...os Anais de [ROOT.Char.Custom('GetRandomAnnalsPassage')]."
 emperor_imperial_examination.400.b:0 "...o [ROOT.Char.Custom('GetRandomPoetryPassage')]."
 emperor_imperial_examination.400.c:0 "...o [ROOT.Char.Custom('GetRandomRitesPassage')]."
 emperor_imperial_examination.400.desc:0 "Os examinadores e os candidatos do palácio estão reunidos, lendo e sussurrando intensamente entre si em tons nervosos. É justo que eu, [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.Custom('GetDaughterSon')|U] do Céu, compartilhe alguma sabedoria atemporal. Ao meu sinal, a sala silencia em reverência, aguardando.\n\nEu faço um gesto para as prateleiras, e os servos trazem..."
 emperor_imperial_examination.400.t:0 "Recitando os Anais"
 emperor_imperial_examination.500.a:0 "Seus versos são contidos, mas cheios de significado."
 emperor_imperial_examination.500.b:0 "Palavras tão vazias quanto seu mérito."
 emperor_imperial_examination.500.desc:0 "\"Majestade celestial, escrevi um poema em honra à sua graça infinita.\" M[Select_CString( examination_character_2.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)], [examination_character_2.GetTitledFirstName], abre um livro e recita:\n\n#EMP \"O [examination_character_2.Custom('GetAdventureNameBand')|l] de [examination_character_2.Custom('GeneratePoem_Title_Fragment_Season')], o [examination_character_2.Custom('GetAdventureNameBand')|l] de [examination_character_2.Custom('GetAdventureNameSuffix')|l] e [examination_character_2.Custom('GetAdventureNameSuffix')|l] — [examination_character_2.Custom('GetAdventureNamePrefixes')|l] nos [poetry_province.Custom('GetTerrainTypePlural')], o [examination_character_2.Custom('GetRandomSmallPreciousItem')] nas mãos. De [poetry_county.GetNameNoTier], em [poetry_province.Custom('ProvinceCompliment')] [examination_character_2.Custom('GeneratePoem_Title_Fragment_Noun')|l], dentro d[Select_CString( examination_character_2.IsFemale, 'a', 'o' )] [examination_character_2.Custom('FormalComplimentAdjective')|l] [ROOT.Char.GetPrimaryTitle.GetNameNoTier].\"#!\n\n[examination_character_2.GetSheHe|U] aguarda ansiosamente meu veredito."
 emperor_imperial_examination.500.t:0 "A Poesia de [examination_character_2.GetFirstNameNoTooltip]"
 emperor_imperial_examination.600.a:0 "Muito divertido."
 emperor_imperial_examination.600.b:0 "Basta, concentre-se no exame."
 emperor_imperial_examination.600.c:0 "Um desrespeito; saia imediatamente."
 emperor_imperial_examination.600.desc:0 "Enquanto supervisiono a multidão, um dos candidatos, [examination_character_2.GetTitledFirstName], se empolga tanto contando piadas que [examination_character_2.GetSheHe] mal percebe para onde está indo. Lentamente, andando de costas, [examination_character_2.GetSheHe] se aproxima inadvertidamente de mim, exclamando: \"...e foi assim que o [examination_character_2.Custom('GetAdventureNameBand')|l] perdeu o [examination_character_2.Custom('GetAdventureNameSuffix')|l]!\"\n\nEu tosso suavemente.\n\nA multidão à frente [examination_character_2.GetHerHim] silencia. [examination_character_2.GetFirstNameNoTooltip] congela de medo."
 emperor_imperial_examination.600.t:0 "De Bom Humor"
 emperor_imperial_examination.700.a:0 "Aceito magnanimamente."
 emperor_imperial_examination.700.b:0 "Conte-me sobre [silver_county_top_liege.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]."
 emperor_imperial_examination.700.c:0 "Divida entre vocês; use para seus estudos."
 emperor_imperial_examination.700.desc:0 "\"Grande [ROOT.Char.GetTitleAsNameNoTooltip],\" m[Select_CString( examination_character_2.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)], [examination_character_2.GetTitledFirstName], se prostra profundamente. \"Minha família, a [examination_character_2.GetHouse.GetName], tem conexões com mercadores na [GetSituationType('silk_road_situation').GetName|l] e no $sea_yellow_sea$ — conexões que usei para oferecer-lhe um presente humilde.\"\n\n\"Este é um cofre de moedas de prata de [silver_county.GetNameNoTier], com o selo do [silver_county_top_liege.GetTitleAsNameNoTooltip] de [silver_county_top_liege.GetPrimaryTitle.GetDefinitiveName|l].\""
 emperor_imperial_examination.700.t:0 "Presente de Prata"
 emperor_imperial_examination.800.a:0 "Encontraremos uma posição para ele."
 emperor_imperial_examination.800.b:0 "Ele poderia ser um examinador."
 emperor_imperial_examination.800.c:0 "Guarde seu servo."
 emperor_imperial_examination.800.desc:0 "\"Magnânim[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip], seu humilde servo pede desculpas por esta interrupção,\" diz m[Select_CString( examination_character_2.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)], [examination_character_2.GetTitledFirstName], curvando-se profundamente com um gongshou. \"Este é [examination_character_1.GetFirstName] — um [GetTrait('eunuch_1').GetName( GetNullCharacter )] extremamente habilidoso, há muito leal à casa [examination_character_2.GetHouse.GetName].\"\n\n\"Oferecemos seus serviços ao palácio, para que [ROOT.Char.GetPrimaryTitle.GetNameNoTier] prospere sob sua graça.\""
 emperor_imperial_examination.800.t:0 "Um Eunuco em Tributo"
 emperor_imperial_examination.900.a:0 "As habilidades [examination_character_2.GetHerHim] são bem-vindas."
 emperor_imperial_examination.900.b:0 "[examination_character_2.GetSheHe|U] servirá melhor a você."
 emperor_imperial_examination.900.desc:0 "\"[ROOT.Char.GetTitleAsNameNoTooltip] Celestial, agradecemos por este banquete,\" diz m[Select_CString( examination_character_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', examination_character_1)], [examination_character_1.GetTitledFirstName], curvando-se profundamente com um servo ao lado [examination_character_1.GetHerHim]. \"Este é m[Select_CString( examination_character_2.IsFemale, 'inha', 'eu' )] [examination_character_1.Custom2('RelationToMeShort', examination_character_2)], [examination_character_2.GetFirstName] — portador de um humilde presente: [examination_character_1.Custom('GetExpensiveDrink')] de minha terra natal, [origin_county.GetNameNoTier].\"\n\n\"Mas mais do que bebida, ofereço o serviço [examination_character_2.GetHerHim]. O conhecimento de [examination_character_2.Custom('highest_skill_noun')] servirá ao palácio.\""
 emperor_imperial_examination.900.t:0 "Um[Select_CString( examination_character_2.IsFemale, 'a', '' )] Serv[Select_CString( examination_character_2.IsFemale, 'a', 'o' )] [examination_character_2.Custom('ComplimentAdjective')|U]"
 every_palace_entrant:0 "Todos os Candidatos do Palácio"
 imperial_examination.advantage.dynasty_legacy.tt:0 "Como desbloqueou a [GetDynastyPerk( 'tgp_chinese_legacy_1' ).GetName] Dynasty Legacy, você começará a atividade com um [exam_advantage|E]"
 imperial_examination.advantage.other.tt:0 "Ganha um [exam_advantage|E]"
 situation_type_silk_road_situation:0 "A Rota da Seda"
 situation_type_silk_road_situation_desc:0 "$game_concept_silk_road_situation_desc$"
