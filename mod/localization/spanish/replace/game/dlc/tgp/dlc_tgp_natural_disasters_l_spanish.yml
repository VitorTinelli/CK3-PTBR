 tgp_natural_disaster_earthquake_2_county_modifier:0 "Terremoto Severo"
 tgp_natural_disaster_earthquake_2_county_modifier_desc:0 "Este condado sofre atividade sísmica intensa, com um poderoso terremoto causando destruição generalizada.\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_earthquake_3_county_modifier:0 "Terremoto Terrível"
 tgp_natural_disaster_earthquake_3_county_modifier_desc:0 "Este condado está à beira da devastação devido a um enorme abalo sísmico.\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_exodus_1_county_modifier:0 "Êxodo Limitado"
 tgp_natural_disaster_exodus_1_county_modifier_desc:0 "Muitos habitantes deste condado fugiram devido a um recente [natural_disaster|E].\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_exodus_2_county_modifier:0 "Êxodo"
 tgp_natural_disaster_exodus_2_county_modifier_desc:0 "Devido a um [natural_disaster|E], a maioria da população deste condado fugiu em busca de segurança.\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_exodus_3_county_modifier:0 "Êxodo Extenso"
 tgp_natural_disaster_exodus_3_county_modifier_desc:0 "Um devastador [natural_disaster|E] deixou este condado quase desabitado.\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_fertility_1_county_modifier:0 "Pastos Encharcados"
 tgp_natural_disaster_fertility_1_county_modifier_desc:0 "Uma inundação recente deixou parte do solo deste condado incapaz de produzir.\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_fertility_2_county_modifier:0 "Pastos Alagados"
 tgp_natural_disaster_fertility_2_county_modifier_desc:0 "Uma inundação desastrosa devastou os campos deste condado, tornando-os impróprios para cultivo.\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_fertility_3_county_modifier:0 "Pastos Enlameados"
 tgp_natural_disaster_fertility_3_county_modifier_desc:0 "Uma inundação deixou os pastos deste condado completamente estéreis e incapazes de sustentar vida.\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_flood_1_county_modifier:0 "Inundação"
 tgp_natural_disaster_flood_1_county_modifier_desc:0 "Este condado está passando por uma inundação leve.$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_flood_2_county_modifier:0 "Inundação Severa"
 tgp_natural_disaster_flood_2_county_modifier_desc:0 "Este condado sofre uma inundação grave, causando danos por onde passa.\n$tgp_natural_disaster_cleanup_tt$"
