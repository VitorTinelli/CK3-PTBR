 natural_disaster_earthquake_recovery_situation_phase:0 "Recuperação"
 natural_disaster_earthquake_recovery_situation_phase_desc:0 "Após o impacto principal, os efeitos completos do desastre se tornam aparentes. Os súditos podem se sentir descontentes, pois suas propriedades e meios de subsistência foram danificados ou destruídos. Os escombros dificultam os esforços de reconstrução, e com vidas perdidas, a recuperação é retardada por uma população e força de trabalho reduzidas."
