 natural_disaster_earthquake_warning_situation_phase:0 "Pré-sismo"
 natural_disaster_earthquake_warning_situation_phase_desc:0 "Na fase de Pré-sismo [situation_phase|E], pequenos tremores são sentidos pela terra. Embora apenas tão intensos quanto um rebanho galopante, esse tremor pode ser o prenúncio de uma força muito maior e devastadora movendo-se sob a terra."
