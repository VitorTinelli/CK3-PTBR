 natural_disaster_earthquake_impact_situation_phase:0 "Impacto"
 natural_disaster_earthquake_impact_situation_phase_desc:0 "Após tremores sutis, o solo treme violentamente. Edifícios podem desabar, e pessoas podem ser feridas ou mortas por destroços. Uma ruptura pode se formar no epicentro do terremoto, dividindo a paisagem em dois. O movimento repentino pode levantar poeira e escombros, aumentando a letalidade para qualquer pessoa próxima."
 natural_disaster_earthquake_participant_group_affected_ruler:0 "$game_concept_independent_rulers$"
 natural_disaster_earthquake_participant_group_affected_ruler_desc:0 "[independent_rulers|EU] cujo [realm|E] é afetado pelo [disaster|E]"
