 tgp_decision_events.0100.a:0 "[petition_recipient.GetTitleAsNameNoTooltip] terá que considerar minha proposta."
 tgp_decision_events.0100.b:0 "[house_movement_member.GetFirstNameNoTooltip] precisa disso."
 tgp_decision_events.0100.c:0 "Cumprirei o dever [Select_CString( disciple_movement_member.IsFemale, 'da minha Anciã', 'do meu Ancião' )], [disciple_movement_member.GetFirstNameNoTooltip]."
 tgp_decision_events.0100.d:0 "Eu apresento a petição em nome de [other_movement_member.GetFirstNameNoTooltip]."
 tgp_decision_events.0100.desc:0 "Como humilde representante do [petitioner.Custom('GetMyMovement')], apresento uma petição para"
 tgp_decision_events.0100.desc_change_army_laws_decrease:0 "diminuir a Estrutura de Comando do Exército! Governadores individuais precisam de mais poder para proteger o Império."
 tgp_decision_events.0100.desc_change_army_laws_increase:0 "aumentar a Estrutura de Comando do Exército! Apenas a burocracia pode garantir a segurança do Império."
 tgp_decision_events.0100.desc_change_bureaucracy_laws_decrease:0 "limitar a $game_concept_celestial_bureaucracy$! Os governadores locais devem ter mais poder para cumprir suas funções no Império de forma mais eficiente."
 tgp_decision_events.0100.desc_change_bureaucracy_laws_increase:0 "expandir a $game_concept_celestial_bureaucracy$! Você deve consolidar seu direito divino e centralizar o poder no governo."
 tgp_decision_events.0100.desc_change_candidate_score_law:0 "alterar a [GetLawGroup('candidate_score_laws').GetNameNoTooltip]! Para garantir o melhor para o cargo, devemos considerar [Select_CString(petition_recipient.HasRealmLaw('candidate_score_merit_law'), 'todos independentemente do status', 'apenas famílias influentes')]."
 tgp_decision_events.0100.desc_change_province_disciple:0 "Mas eu devo pensar no meu discípulo [disciple_movement_member.GetName]."
 tgp_decision_events.0100.desc_change_province_house:0 "Enquanto isso, meu membro da casa, [house_movement_member.GetName], também tem um forte desejo e necessidade dessa mudança."
 tgp_decision_events.0100.desc_change_province_industrial:0 "alterar o $game_concept_province_administration$ para $celestial_province_industrial_short$!\n\n'Investimentos a longo prazo nas terras do Império são necessários para que ele prospere eternamente.'"
 tgp_decision_events.0100.desc_change_province_metropolitan:0 "alterar o $game_concept_province_administration$ para $celestial_province_metropolitan_short$!\n\nO Império é tão forte quanto sua cidade mais fraca."
 tgp_decision_events.0100.desc_change_province_military:0 "alterar o $game_concept_province_administration$ para $celestial_province_military_short$!\n\n'Devemos cultivar os caminhos dos guerreiros para garantir o futuro eterno do Império.'"
 tgp_decision_events.0100.desc_change_province_no_petitioner:0 "E há muitos lugares pelo reino que eu poderia reivindicar."
 tgp_decision_events.0100.desc_change_province_other:0 "No entanto, lembro de um colega do $game_concept_movement$, [other_movement_member.GetName], sendo um bom candidato também."
 tgp_decision_events.0100.desc_change_province_petitioner:0 "E eu poderia persuadir o Imperador de que minha [petitioner.GetCapitalLocation.GetName] precisa disso."
 tgp_decision_events.0100.desc_change_province_protectorate:0 "alterar o $game_concept_province_administration$ para $celestial_province_protectorate_short$!\n\n'Os circuitos precisam ser fortalecidos para proteger o povo de possíveis invasores e bandidos.'"
 tgp_decision_events.0100.desc_change_retirement_law_decrease:0 "diminuir o $celestial_retirement_law$!\n\n'Os circuitos precisam ser fortalecidos rotacionando os governadores sempre que possível.'"
 tgp_decision_events.0100.desc_change_retirement_law_increase:0 "aumentar o $celestial_retirement_law$!\n\n'Os circuitos precisam ser mantidos por governadores competentes o máximo de tempo possível.'"
 tgp_decision_events.0100.desc_change_retirement_law_outro:0 "Esta é a única forma de nos manter fortes e prósperos. [petition_recipient.GetTitleAsNameNoTooltip] terá que concordar comigo!"
 tgp_decision_events.0100.desc_hold_examinations:0 "realizar exames!\n\nCaso contrário, o Império enfrentará estagnação ou declínio."
 tgp_decision_events.0100.desc_increase_budget:0 "aumentar os salários de todos"
 tgp_decision_events.0100.desc_increase_budget_military:0 "$tgp_decision_events.0100.desc_increase_budget$ comandantes.\n\nEles devem manter nossos exércitos e ter meios de mobilizá-los. Nossos inimigos devem nos temer!"
 tgp_decision_events.0100.desc_increase_budget_ministry:0 "$tgp_decision_events.0100.desc_increase_budget$ ministros.\n\nEles iniciam muitos projetos importantes e precisam de financiamento para mantê-los."
 tgp_decision_events.0100.desc_increase_budget_outro:0 "\n\nNo entanto, os cofres de [hegemon.GetTitleAsNamePossessive] são finitos. Para que esta petição seja financiada, outra deverá perder fundos."
 tgp_decision_events.0100.desc_increase_budget_salary:0 "$tgp_decision_events.0100.desc_increase_budget$ governadores.\n\nEles precisam de mais tesouro para manter o reino próspero. Invista em atividades culturais e construções."
 tgp_decision_events.0100.f:0 "Generais desperdiçam fundos em nome da nossa defesa."
 tgp_decision_events.0100.g:0 "Governadores são excessivamente liberais com suas despesas."
 tgp_decision_events.0100.h:0 "Ministros saqueiam o tesouro em projetos inúteis."
