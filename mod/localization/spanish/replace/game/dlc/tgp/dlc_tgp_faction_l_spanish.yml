 tgp_decision_events.0102.c:0 "Há outras formas de persuasão..."
 tgp_decision_events.0102.d:0 "Oferecerei a mim mesmo."
 tgp_decision_events.0102.desc:0 "[petition_recipient.GetName] me olha surpreso.\n\n\"Não esperava ouvir uma reivindicação tão ousada hoje. Estou divertido! Contudo, receio que tenho que recusar.\" [petition_recipient.GetSheHe|U] me afasta com um gesto. \"Convide o próximo peticionário, por favor.\"\n\nFico atônito por um breve momento. Ainda deve haver algo que eu possa fazer!"
 tgp_decision_events.0102.forfeit:0 "Não vou discordar da vontade dos Céus."
 tgp_decision_events.0102.petition_accepted:0 "Petição foi #P aceita#!"
 tgp_decision_events.0102.petition_refused:0 "Petição foi #X recusada#!"
 tgp_decision_events.0102.t:0 "$tgp_decision_events.0100.t$"
 tgp_decision_events.0103.a:0 "\"Muito bem, concederei o que você deseja.\""
 tgp_decision_events.0103.a_title:0 "$tgp_decision_events.0101.a_title$"
 tgp_decision_events.0103.b:0 "\"Saia da minha vista — #emp agora!#!\""
 tgp_decision_events.0103.b_title:0 "Petição Recusada"
 tgp_decision_events.0103.desc:0 "Minha recusa está causando aflição em [petitioner.GetName], mas [petitioner.GetSheHe] rapidamente recupera a compostura e pergunta:\n\n\"Perdoe minha insolência, mas não serei descartado tão facilmente. A questão é importante para todos os membros do [actors_movement.GetName]. Por favor, reconsidere.\" [petitioner.GetSheHe|U] estende a mão."
 tgp_decision_events.0103.desc_give_hook:0 "\"Estou me oferecendo como servo leal. Você poderá usar minha força e alcance quando os tempos sombrios chegarem, assim como estou pedindo agora o seu apoio.\""
 tgp_decision_events.0103.desc_give_influence:0 "\"Sou respeitado entre meu povo e eles confiam em mim para ser sua voz. Nós nos preocupamos apenas com o bem-estar de [GetTitleByKey('h_china').GetName].\""
 tgp_decision_events.0103.desc_give_maa:0 "\"O Império poderia usar regimentos dos meus melhores soldados. Concorde conosco e eles estarão sob seu comando.\""
 tgp_decision_events.0103.desc_use_hook:0 "\"Nos conhecemos muito bem há algum tempo. Acho que você me deve um favor e gostaria que concordasse conosco.\""
 tgp_decision_events.0103.t:0 "$tgp_decision_events.0100.t$"
 tgp_decision_events.0199.a:0 "Terei que tentar novamente em breve."
 tgp_decision_events.0199.desc:0 "Atualmente não posso receber sua petição. Por favor, volte para casa."
 tgp_decision_events.0199.opening:0 "[petition_recipient.Custom2('AppropriateGreetingPositive', petitioner)]"
 tgp_faction_events.0201.b.cm:0 "Você arriscaria despedaçar o [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]?!"
 tgp_faction_events.0201.b:0 "Você pagará por manchar a honra de [faction.GetSpecialCharacter.GetTitleAsNamePossessiveNoTooltip]!"
 tgp_faction_events.0206.a:0 "Vida longa a [claimant.GetTitleAsNameNoTooltip]!"
 tgp_faction_events.0206.b:0 "O caminho é árduo, nosso suserano deve ser guiado..."
 tgp_faction_events.0206.desc:0 "Finalmente, a causa lealista provou ser vitoriosa em nossa guerra justa para erradicar a vileza de [defender.GetTitledFirstName] e libertar [claimant.GetTitleAsName] da influência corrupta [defender.GetHerHim].\n\nEmbora a corte imperial tenha sido restaurada à ordem, a guerra abalou o condado, e todos os [defender.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] me veem como o portador da paz e guardião da família real..."
 tgp_faction_events.0206.t:0 "A Serviço de [claimant.GetTitleAsNameNoTooltip]"
