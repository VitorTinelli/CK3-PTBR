l_spanish:
 FACTIONS_WINDOW_JAPANESE_REGENT:0 "Desafiante"
 FACTIONS_WINDOW_JAPANESE_RESTORE_EMPEROR:0 "[ceremonial_liege|E]"
 FACTION_CEREMONIAL_CLAIMANT_DYNAMIC_NAME:0 "Instalar [ROOT.Faction.GetSpecialCharacter.GetTitledFirstName] no Trono [ROOT.Faction.GetSpecialTitle.GetAdjective]"
 FACTION_JAPANESE_REPLACE_REGENT:0 "Exigência $replace_ceremonial_regent_faction_name$"
 FACTION_JAPANESE_REPLACE_REGENT_ACCEPTED:0 "Exigências $replace_ceremonial_regent_faction_name$ Aceitas"
 FACTION_JAPANESE_REPLACE_REGENT_ACCEPTED_DESC:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nSuas descaradas e vergonhosas tentativas de tomar o poder apenas enfraquecerão [faction_target.GetPrimaryTitle.GetNameNoTier]. No entanto, para evitar um derramamento de sangue desnecessário, aceitarei suas exigências..."
 FACTION_JAPANESE_REPLACE_REGENT_DESC:0 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nOs nobres leais do [faction_target.GetPrimaryTitle.GetNameNoTierNoTooltip] não têm confiança em sua intolerável regência! Entregue seu poder a mim, ou enfrente nossas espadas no campo de batalha!"
 FACTION_JAPANESE_REPLACE_REGENT_NAME_DYNAMIC:0 "Instalar [ROOT.Faction.GetSpecialCharacter.GetShortUINameNotMe|U] como $game_concept_ceremonial_regent$"
 FACTION_JAPANESE_REPLACE_REGENT_REFUSED:0 "Exigências $replace_ceremonial_regent_faction_name$ Recusadas"
 FACTION_JAPANESE_REPLACE_REGENT_REFUSED_DESC:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nSua tentativa ridícula de intimidação nunca terá sucesso. Eu sou [Select_CString( faction_target.IsFemale, 'a legítima', 'o legítimo' )] [faction_target.GetTitleAsNameNoTooltip] de [faction_target.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]! Todos os traidores enfrentarão a justiça — no campo de batalha, se necessário!"
 FACTION_JAPANESE_REPLACE_REGENT_SEND_DEMAND_NOTIFICATION:0 "O Regente Deve Cair!"
 FACTION_JAPANESE_REPLACE_REGENT_SEND_DEMAND_NOTIFICATION_DESC:0 "O momento chegou! Os lordes da [faction.GetName] concordam que [faction_target.GetName] é um déspota que deve ceder seu poder — pela espada, se necessário!"
 FACTION_JAPANESE_REPLACE_RULER_DESC:0 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nOs nobres leais do [faction_target.GetPrimaryTitle.GetNameNoTierNoTooltip] não confiam em seu governo despótico e desorientado! Delegue seus poderes a mim, ou enfrente nossas espadas no campo de batalha!"
 FACTION_JAPANESE_RESTORE_EMPEROR:0 "Demanda $restore_ceremonial_liege_faction_name$"
 FACTION_JAPANESE_RESTORE_EMPEROR_ACCEPTED:0 "Demanda $restore_ceremonial_liege_faction_name$ Aceita"
 FACTION_JAPANESE_RESTORE_EMPEROR_ACCEPTED_DESC:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nEu só tenho os melhores interesses da corte [ROOT.Char.Custom('GetTitleTierAdjective')], da família real e de todos os [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] em mente!\n\nEmbora eu questione suas motivações, não impedirei [faction.GetSpecialCharacter.GetTitledFirstName]."
 FACTION_JAPANESE_RESTORE_EMPEROR_DESC:0 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nSua tirania sobre a corte [ROOT.Char.Custom('GetTitleTierAdjective')], a família real e todos os [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] deve acabar.\n\nSaia do caminho por nosso verdadeiro governante, [faction.GetSpecialCharacter.GetTitledFirstName]!"
 FACTION_JAPANESE_RESTORE_EMPEROR_NAME_DYNAMIC:0 "Restaurar [ROOT.Faction.GetSpecialCharacter.GetShortUINameNotMe|U]"
 FACTION_JAPANESE_RESTORE_EMPEROR_REFUSED:0 "Demanda $restore_ceremonial_liege_faction_name$ Recusada"
 FACTION_JAPANESE_RESTORE_EMPEROR_REFUSED_DESC:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nQue insolência! Eu só tenho os melhores interesses da corte [ROOT.Char.Custom('GetTitleTierAdjective')], da família real e de todos os [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] em mente!\n\nVocê e seu bando de traidores pagarão por manchar a honra de [faction.GetSpecialCharacter.GetTitleAsNamePossessiveNoTooltip]!"
 FACTION_JAPANESE_RESTORE_EMPEROR_SEND_DEMAND_NOTIFICATION:0 "$restore_ceremonial_liege_faction_name$"
 FACTION_JAPANESE_RESTORE_EMPEROR_SEND_DEMAND_NOTIFICATION_DESC:0 "[faction_leader.Custom2('AppropriateGreetingPositive', ROOT.Char)]\n\nA tirania de [faction_target.GetTitledFirstNamePossessive] sobre a corte [ROOT.Char.Custom('GetTitleTierAdjective')], a família real e todos os [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] deve acabar.\n\nDevemos estar prontos para lutar para restaurar nosso verdadeiro governante, [faction.GetSpecialCharacter.GetTitledFirstName]!"
