l_spanish:
 combat_train_monks:0 "Treinar Monges para Combate"
 combat_train_monks_contract:0 "$combat_train_monks$"
 combat_train_monks_desc:0 "Um mosteiro neste condado abriga vários monges que poderiam ser usados para fortalecer as defesas do reino, se devidamente treinados."
 combat_train_monks_desc_title:0 "$task_contract_governance_desc_title$"
 combat_train_monks_request:0 "Resolva a situação possivelmente usando seu [martial|E], [diplomacy|E] ou [learning|E]"
 escaped_justice:0 "Justiça Fugitiva"
 escaped_justice_contract:0 "$escaped_justice$"
 escaped_justice_desc:0 "Um criminoso escapou da justiça e fugiu para este condado em vez de atender à sua intimação judicial."
 escaped_justice_desc_title:0 "$task_contract_governance_desc_title$"
 escaped_justice_request:0 "Resolva a situação possivelmente usando seu [martial|E] ou [diplomacy|E]"
 forced_conscription:0 "Conscrição Forçada"
 forced_conscription_contract:0 "$forced_conscription$"
 forced_conscription_desc:0 "Mobilize os recrutas para preparar seu exército para a guerra."
 forced_conscription_desc_title:0 "$task_contract_governance_desc_title$"
 forced_conscription_request:0 "Esta situação permite que você escolha um resultado"
 governor_contract_events_tova.0050.a.tt:0 "Viaje até [deity_destination.GetName] e investigue o problema"
 governor_contract_events_tova.0050.a:0 "Este assunto requer toda a minha atenção."
 governor_contract_events_tova.0050.b:0 "Tenho preocupações mais urgentes..."
 governor_contract_events_tova.0050.desc:0 "Uma quantidade incomum de pessoas se alinha nas ruas de [deity_destination.GetName] para se curvar e queimar incenso diante do santuário de uma divindade ilícita. Agricultores e moradores da cidade vêm de todos os cantos do reino para fazer as humildes oferendas que podem. \n\nSe eu não tratar da situação, essas superstições selvagens continuarão a se espalhar pelo distrito."
 governor_contract_events_tova.0050.t:0 "$unsanctioned_deity$"
 governor_contract_events_tova.0051.a:0 "Sanção pública da divindade."
 governor_contract_events_tova.0051.b:0 "Dispersar os adoradores e queimar o santuário."
 governor_contract_events_tova.0051.c:0 "Confiscar as oferendas."
 governor_contract_events_tova.0051.d:0 "Convencer os adoradores."
 governor_contract_events_tova.0051.desc:0 "Sigo o aroma proeminente de incenso em [deity_destination.GetName], abro caminho pelas ruas movimentadas e alcanço o santuário ofensivo. \n\n[ROOT.Char.Custom('RandomPeasantGrievance')] Pelas manchas de sujeira nas calças [worshipper.GetHerHim], percebo que [worshipper.GetSheHe] percorreu uma boa distância para chegar aqui. \n\nAo ser questionado sobre a divindade, [worshipper.GetSheHe] me diz que ela aparece como [ROOT.Char.Custom('RandomVerySmallCreature')] e vive dentro de [ROOT.Char.Custom('RandomVerySmallCreatureDwelling')] à beira da estrada."
 governor_contract_events_tova.0051.e:0 "Deixarei que os monges cuidem disso."
 governor_contract_events_tova.0052.a:0 "Como deve ser."
 governor_contract_events_tova.0052.desc_burn:0 "Meus guardas rompem rapidamente a multidão, golpeando aqueles que permanecem em seu caminho. Uma tocha cai sobre o santuário, e as chamas logo se erguem aos céus, afastando os poucos adoradores que permanecem. \n\nPosso afirmar com certeza que a ordem foi restaurada no condado de [deity_destination.GetName], livrando-o da superstição para que a razão possa florescer."
 governor_contract_events_tova.0052.desc_debunk:0 "\"...E é por isso que esta criatura #EMP não#! é, de fato, um deus. Cada um de nós faz sua própria fortuna, através da humanidade e da boa conduta moral.\" \n\nA multidão silencia, maravilhada com minhas habilidades retóricas superiores. Vejo claramente o momento em que todos percebem o erro de seus caminhos e começam a se dispersar."
 governor_contract_events_tova.0053.a:0 "Isso não saiu como planejado!"
 governor_contract_events_tova.0053.desc_burn:0 "Meus guardas tentam romper a multidão, e fico surpreso ao ver os adoradores agitados empurrando de volta! A tocha destinada ao santuário cai no chão, e o caos se instaura. \n\nEu e meu séquito mal conseguimos sair a tempo antes que as chamas nos alcancem."
 governor_contract_events_tova.0053.desc_debunk:0 "\"...O que significa que a única maneira real de garantir nossa própria sorte é fazendo o bem por nós mesmos. Mas, é claro, não devemos agir apenas para servir ao nosso próprio interesse. Agora, o que eu estava dizendo?\" \n\nUm murmúrio de desaprovação percorre a multidão. Alguns escondem o que provavelmente são sorrisos irônicos atrás das mangas. \n\nCom o rosto aquecido, viro-me e saio antes de me envergonhar ainda mais."
 governor_contract_events_tova.0055.a.tt:0 "Viaje até [escapee_destination.GetName] e investigue o problema"
 governor_contract_events_tova.0055.a:0 "Devo ir imediatamente!"
 governor_contract_events_tova.0055.b:0 "Esse vil rato acabará mostrando a cara eventualmente..."
 governor_contract_events_tova.0055.desc:0 "Recebo notícias de que [Select_CString( escapee.IsFemale, 'a', 'o' )] [escapee.GetTitledFirstName] negligencia dos deveres [escapee.GetHerHim], chegando a desviar fundos do tesouro real. \n\nQuando recebeu a intimação para prestar contas em meu tribunal, [escapee.GetSheHe] reuniu seus homens e fugiu para a selva, onde agora ocupam a cabana de algum pobre fazendeiro! \n\nOs guardas estão armados e prontos para defender a posição de seu/sua [escapee.Custom('MistressMaster')]. Está claro que [escapee.GetTitledFirstName] não cederá sem minha intervenção."
 governor_contract_events_tova.0055.t:0 "$escaped_justice$"
 governor_contract_events_tova.0056.a:0 "Convencer o fugitivo a enfrentar a justiça."
 governor_contract_events_tova.0056.b:0 "Executar o covarde e seus homens."
 governor_contract_events_tova.0056.c:0 "Estou preparado para oferecer alguma clemência."
 governor_contract_events_tova.0056.d:0 "Banir [escapee.GetSheHe]."
 governor_contract_events_tova.0056.desc:0 "\"Não avance mais!\" grita um arqueiro, mirando em nós por trás de algum [ROOT.Char.Custom('OutdoorsHidingPlace')]. Além da postura ameaçadora [thug.GetHerHim], vislumbro o prédio que abriga o criminoso que estou perseguindo. \n\nPelas estaladas dos galhos nos arbustos altos, percebo que outros guardas estão preparados para minha chegada."
 governor_contract_events_tova.0057.a:0 "Meu trabalho aqui está feito!"
 governor_contract_events_tova.0057.desc_persuade:0 "\"Olhe para si mesmo! Este é o ato de um[Select_CString( escapee.IsFemale, 'a', '' )] [escapee.GetWomanMan] louc[Select_CString( escapee.IsFemale, 'a', 'o' )]. É assim que deseja que a dinastia de [escapee.GetDynastyName] seja lembrada? Poupe sua família da vergonha e venha comigo.\" \n\nTalvez sejam minhas palavras, ou o tom da minha voz, mas [escapee.GetTitledFirstName] sai do esconderijo. [escapee.GetSheHe|U] levanta as mãos em gesto de rendição e se entrega."
 governor_contract_events_tova.0057.desc_slay:0 "A frágil paz se transforma em um estrondo de gritos de batalha e aço se chocando, quando meus homens atacam os guardas de [escapee.GetTitledFirstName]. \n\nToda oposição cai ao chão, suas armaduras quebradas e vidas escorrendo. Então, [escapee.GetTitledFirstName] é arrastad[Select_CString( escapee.IsFemale, 'a', 'o' )] até mim, para que eu possa decapitar [escapee.GetSheHe] com um golpe preciso."
 governor_contract_events_tova.0058.a:0 "Que constrangedor..."
 governor_contract_events_tova.0058.desc_persuade:0 "Abro a boca para falar, mas não encontro motivos para justificar a prisão. Ouço-me dizendo: \"O cativeiro forçado é ótimo para construir caráter!\" E sei que perdi qualquer chance de convencer [escapee.GetTitledFirstName] a vir pacificamente. \n\n[escapee.GetSheHe|U] verá como é agradável apodrecer escondid[Select_CString( escapee.IsFemale, 'a', 'o' )]."
 governor_contract_events_tova.0058.desc_slay:0 "A frágil paz se transforma em um estrondo de gritos de batalha e aço se chocando. \n\nMeus homens lançam-se corajosamente contra a oposição, espadas em punho, mas seus golpes atingem apenas o ar, e eles falham em bloquear os ataques. \n\nVejo meus homens sendo empurrados para trás e percebo que a única opção é recuar."
 governor_contract_events_tova.0060.a.tt:0 "Você investiga o assunto mais a fundo."
 governor_contract_events_tova.0060.a:0 "Pela pura força esmagaremos nossos inimigos!"
 governor_contract_events_tova.0060.b:0 "Não sacrificarei meu povo por tais objetivos."
 governor_contract_events_tova.0060.desc:0 "\"Em tempos de expansão, é nosso dever mobilizar para possíveis guerras\", lê o início da missiva enviada pelo meu senhor. \n\n\"Eles não precisam ser treinados. Não precisam ser equipados. Uma vanguarda de proporção esmagadora servirá para quebrar qualquer oposição.\" \n\nAs famílias camponesas sob meu controle já cederam os homens responsáveis por seus lares, sobrando apenas seus filhos para o recrutamento."
 governor_contract_events_tova.0060.t:0 "$forced_conscription$"
 governor_contract_events_tova.0061.a:0 "Pague uma compensação às famílias."
 governor_contract_events_tova.0061.b:0 "Arrancar seus filhos à força de suas casas!"
 governor_contract_events_tova.0061.c:0 "Use a piedade filial para convencer os filhos a se alistarem."
 governor_contract_events_tova.0061.d:0 "Talvez eu possa poupá-los se aceitarem uma troca."
 governor_contract_events_tova.0061.desc:0 "Olhando para a cidade abaixo de mim, vejo luzes distantes cintilando nas janelas e portas daqueles edifícios mais adiante. \n\nFamílias compartilham refeições juntas na segurança de seus lares. Seus destinos, como o de todos os meus súditos, são minha decisão."
 governor_contract_events_tova.0065.a.tt:0 "Viaje até [monks_destination.GetName] e supervisione seus treinos"
 governor_contract_events_tova.0065.a:0 "Verificarei do que esses monges são feitos."
 governor_contract_events_tova.0065.b:0 "Não, deixarei que sejam monges."
 governor_contract_events_tova.0065.desc:0 "Recebo notícias de que há monges no mosteiro de [monks_destination.GetName] que se destacam no combate corpo a corpo. Eles praticam as artes marciais como forma de meditação, ao que parece, mas talvez essas habilidades possam ser melhor utilizadas para servir ao reino e proteger suas fronteiras. \n\nMas primeiro devo avaliar a coragem dos monges."
 governor_contract_events_tova.0065.t:0 "$combat_train_monks$"
 governor_contract_events_tova.0066.a:0 "Prove seu valor no combate corpo a corpo."
 governor_contract_events_tova.0066.b:0 "Gabar-se de suas realizações marciais."
 governor_contract_events_tova.0066.c:0 "Explique #EMP exatamente#! quão eficazes são as armas."
 governor_contract_events_tova.0066.d:0 "Meu Marechal pode cuidar disso."
 governor_contract_events_tova.0066.desc:0 "Entro no mosteiro durante uma sessão de sparring em andamento. \n\nUm grito alto, um estalo retumbante, e um monge cai ao chão, levantando uma nuvem de poeira. Todos aplaudem, e eu também. \n\nO vencedor se destaca como um dos melhores combatentes do templo. De fato, quando converso com ele, gaba-se de ser responsável por ensinar os demais."
 governor_contract_events_tova.0066.tt_failure_desc:0 "Os monges #bold não#! ficam impressionados"
 governor_contract_events_tova.0066.tt_success:0 "Isso desbloqueia resultados positivos"
 governor_contract_events_tova.0066.tt_success_desc:0 "Os monges ficam impressionados"
 governor_contract_events_tova.0067.a:0 "Todos devem servir no meu exército!"
 governor_contract_events_tova.0067.b:0 "Este monge pode se tornar um cavaleiro útil."
 governor_contract_events_tova.0067.c:0 "Farei destes monges guerreiros."
 governor_contract_events_tova.0067.d:0 "Vou estacionar tropas aqui para ajudar a fortificar a região."
 governor_contract_events_tova.0067.desc:0 ""
 governor_contract_events_tova.0067.desc_diplomacy:0 "\"...E com minha espada posta de lado, agarrei a criatura de cheiro fétido com a qual fui emparelhado, e apresentei sua cabeça aos meus punhos de maneira mais poderosa!\" \n\nPelas expressões extasiadas do meu público, posso dizer que os monges estão convencidos de minhas habilidades e autoridade."
 governor_contract_events_tova.0067.desc_learning:0 "\"A força sozinha é suficiente para quebrar ossos, mesmo que a arma não perfure a armadura! É aí que entram a largura e o material da lâmina...\" \n\nPolvilho conceitos comuns suficientes em meu discurso para tornar-me compreendido mesmo pelo mais simples dos leigos. Quando termino, não há dúvida de que os monges estão totalmente convencidos do meu argumento. \n\nEles ouvem atentamente o que tenho a dizer."
 governor_contract_events_tova.0067.desc_martial:0 "Uma plateia rapidamente forma um círculo ao redor de mim e de meu oponente. \n\nNo momento em que nos curvamos, estou pronto para atacar, e não hesito antes de avançar e derrubar o monge. Essa é a diferença entre aluno e mestre! \n\nCom isso, a luta termina assim que começa. Os espectadores aguardam em expectativa pelo que vou dizer a seguir."
 governor_contract_events_tova.0068.a:0 "Que decepção..."
 governor_contract_events_tova.0068.desc:0 ""
 governor_contract_events_tova.0068.desc_diplomacy:0 "\"Tudo começou quando eu era jovem...\" \n\nNão consigo avançar muito na história antes de perceber que perdi a atenção da maioria das pessoas que me ouvem. A multidão parece rarefeita. \n\nTentar salvar a situação só piora, e um dos monges mais velhos até adormece!"
 governor_contract_events_tova.0068.desc_learning:0 "\"... Mas para realmente entender como as armas funcionam, primeiro você precisa conhecer a história da ferraria.\" \n\nComeço a explicar, mas rapidamente percebo que ninguém parece entender do que estou falando, ou por que é relevante!"
 governor_contract_events_tova.0068.desc_martial:0 "Avanço, cabeça erguida, peito estufado, pronto para dar um show a esses monges. \n\nNos curvamos, e antes que eu tenha tempo de endireitar minhas costas, meu oponente vem em minha direção com um grito alto! Tudo o que vejo é a palma da mão [warrior_monk.GetHerHim] acertando meu peito, roubando o fôlego e me derrubando ao chão. \n\nDeito ali, tentando recuperar o fôlego, perguntando que tipo de água de nascente montanhosa esses monges bebem para ficarem tão fortes."
