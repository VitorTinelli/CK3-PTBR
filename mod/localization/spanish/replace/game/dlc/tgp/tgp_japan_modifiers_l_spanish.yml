l_spanish:
 ceremonial_liege_appointment_support_desc:0 "Apoio ao Monarca Cerimonial"
 tgp_attentive_care_modifier:0 "Cuidado Atencioso"
 tgp_attentive_care_modifier_desc:0 "Este personagem está tendo suas necessidades atendidas."
 tgp_buddhist_fighting_modifier:0 "Conflito Religioso"
 tgp_buddhist_fighting_modifier_desc:0 "Este personagem permaneceu inerte enquanto várias seitas budistas lutavam pelo controle em seu reino."
 tgp_burned_weather_modifier:0 "Edifícios Fortificados"
 tgp_burned_weather_modifier_desc:0 "Este personagem fortificou seus edifícios contra calamidades naturais.\n[development|E] perdido pelos [natural_disasters|E]: #P -20%#!"
 tgp_burned_yokai_modifier:0 "Caçador de Yokai"
 tgp_burned_yokai_modifier_desc:0 "Este personagem se tornou mais cauteloso com [Glossary('Yokai', 'YOKAI_GLOSS')] recentemente."
 tgp_cultural_appreciation_modifier:0 "Apreciação Linguística"
 tgp_cultural_appreciation_modifier_desc:0 "Este personagem reconhece a diferença entre diferentes línguas."
 tgp_faith_defender_modifier:0 "Perseguidor de Hereges"
 tgp_faith_defender_modifier_desc:0 "Este personagem não tolera não-crentes."
 tgp_fertility_boost_modifier:0 "Virilidade"
 tgp_fertility_boost_modifier_desc:0 "Este personagem coloca foco extra em gerar um herdeiro."
 tgp_festival_prosperity:0 "Prosperidade do Festival"
 tgp_festival_prosperity_desc:0 "Este condado sediou um festival próspero."
 tgp_garden_yokai_bloom_modifier:0 "Jardim Florescente"
 tgp_garden_yokai_bloom_modifier_desc:0 "Este personagem acredita ter visto um [Glossary('Yokai', 'YOKAI_GLOSS')] que o inspirou a investir em seu jardim."
 tgp_garden_yokai_building_modifier:0 "Aspirante a Arquiteto"
 tgp_garden_yokai_building_modifier_desc:0 "Este personagem acredita ter visto um [Glossary('Yokai', 'YOKAI_GLOSS')] que o inspirou a construir estruturas em seu domínio."
 tgp_guilt_fever_modifier:0 "Febre da Culpa"
 tgp_guilt_fever_modifier_desc:0 "Este personagem foi sobrecarregado pelas consequências de suas ações."
 tgp_health_resistance_modifier:0 "Saúde Fortalecida"
 tgp_health_resistance_modifier_desc:0 "Este personagem comeu comida de templo enquanto rezava com um monge, e esta melhoria alimentar aumentou sua saúde."
 tgp_japan_a_poetic_life_modifier:0 "Uma Vida Poética"
 tgp_japan_a_poetic_life_modifier_desc:0 "Este personagem priorizou viver uma vida poética. Está aberto a novas experiências e outros buscam compartilhar experiências com ele."
 tgp_japan_abalone_temple_offerings_county_modifier:0 "Ofertas ao Templo"
 tgp_japan_abalone_temple_offerings_county_modifier_desc:0 "Os mergulhadores desta comarca vendem abalones, que se acredita trazer vida longa."
 tgp_japan_banisher_of_demoms_modifer_desc:0 "Mascarado ou não, expulsar os 'demônios' portando tochas fortaleceu a reputação deste personagem."
 tgp_japan_banisher_of_demons_modifer:0 "Exilador de Demônios"
 tgp_japan_banisher_of_demons_modifer_desc:0 "Farsa ou não, banir os \"demônios\" empunhadores de tochas da noite reforçou a reputação deste personagem."
 tgp_japan_cautious_curiosity_character_modifier:0 "Curiosidade Cautelosa"
 tgp_japan_cautious_curiosity_character_modifier_desc:0 "Este personagem foi recentemente enganado por um mero rumor."
 tgp_japan_control_over_emperor:0 "Manipulador do Imperador"
 tgp_japan_control_over_emperor_desc:0 "Este personagem colocou um Imperador submisso no trono."
 tgp_japan_drafted_villagers_modifier:0 "Camponeses Recrutados"
 tgp_japan_drafted_villagers_modifier_desc:0 "Este personagem tem olho para talentos, e sempre há utilidade para camponeses fortes."
 tgp_japan_exchanged_verses_modifier:0 "Uma Vida Poética: Versos Trocados"
 tgp_japan_exchanged_verses_modifier_desc:0 "Este personagem expandiu seu repertório por meio de uma união poética."
 tgp_japan_fire_drilled_county_modifier:0 "Lares Preparados para Incêndio"
 tgp_japan_fire_drilled_county_modifier_desc:0 "Os lares desta comarca foram profundamente instruídos sobre os perigos do fogo, e cada um deve manter um balde em caso de incêndio."
 tgp_japan_fresh_fish_county_modifier:0 "Peixe Fresco"
 tgp_japan_fresh_fish_county_modifier_desc:0 "O povo desta comarca é abastecido com peixe recém-pescado."
 tgp_japan_fujiwara_hidehira_back_in_town:0 "Pela Espada"
 tgp_japan_fujiwara_hidehira_back_in_town_desc:0 "Este personagem deseja restaurar o poder do Fujiwara pela força."
 tgp_japan_hot_spring_mystic_negative_modifier:0 "Espírito Disperso"
 tgp_japan_hot_spring_mystic_negative_modifier_desc:0 "Este personagem não conseguiu se conectar com o eu espiritual."
 tgp_japan_hot_spring_mystic_neutral_modifier:0 "Espírito Cético"
 tgp_japan_hot_spring_mystic_neutral_modifier_desc:0 "Este personagem sentiu #EMP algo#!, mas não conseguiu descobrir exatamente o que."
 tgp_japan_hot_spring_mystic_positive_modifier:0 "Espírito Rejuvenescedor"
 tgp_japan_hot_spring_mystic_positive_modifier_desc:0 "Este personagem compreendeu como se alinhar com seu eu espiritual."
 tgp_japan_instructive_plays_county_modifier:0 "Peças Morais Instrutivas"
 tgp_japan_instructive_plays_county_modifier_desc:0 "O povo desta comarca é lembrado de seu lugar, mesmo quando tenta esquecê-lo por algumas horas assistindo a uma peça."
 tgp_japan_lucky_fan_fragments_modifier:0 "Fragmentos de Leque Afortunados"
 tgp_japan_lucky_fan_fragments_modifier_desc:0 "Este personagem pode não ter ganho o prêmio em arco e flecha, mas levou para casa um dos pedaços do alvo, que dizem trazer boa sorte a quem o guarda."
 tgp_japan_made_high_liege_cuckold_modifier:0 "Uma Vida Poética: Imortalidade Imperial"
 tgp_japan_made_high_liege_cuckold_modifier_desc:0 "Este personagem se imortalizou ao se envolver com o cônjuge de seu senhor. Esta experiência irá inspirar ainda mais sua produção poética."
 tgp_japan_made_poetic_life_artifact_modifier:0 "Uma Vida Poética: Mil Folhas Imortais"
 tgp_japan_made_poetic_life_artifact_modifier_desc:0 "Este personagem criou um pilar de [culture|E] através de sua produção poética."
 tgp_japan_pearl_county_modifier:0 "Pérolas Preciosas"
 tgp_japan_pearl_county_modifier_desc:0 "Os mergulhadores desta comarca às vezes encontram pérolas para vender."
 tgp_japan_poet_medicinal_flowers_modifier:0 "Flores Medicinais"
 tgp_japan_poet_medicinal_flowers_modifier_desc:0 "Este personagem coletou algumas flores medicinais para melhorar sua saúde."
 tgp_japan_poet_poisonous_flowers_modifier:0 "Flores Venenosas"
 tgp_japan_poet_poisonous_flowers_modifier_desc:0 "Este personagem coletou algumas flores tóxicas, para qual propósito, quem pode adivinhar..."
 tgp_japan_poetic_to_the_powerful_modifier:0 "Poeta do Poder"
 tgp_japan_poetic_to_the_powerful_modifier_desc:0 "Este personagem melhorou sua relação com uma figura importante usando um verso inteligente."
 tgp_japan_precise_insight_modifer:0 "Percepção Precisa"
 tgp_japan_precise_insight_modifer_desc:0 "Este personagem consegue extrair insights estratégicos de até os lugares mais comuns e aplicá-los em situações militares."
 tgp_japan_prized_generosity_county_modifier:0 "Generosidade Valorizada"
 tgp_japan_prized_generosity_county_modifier_desc:0 "Poucas coisas incentivam rivalidades saudáveis entre vilas como a promessa de um prêmio em competições, e o povo desta comarca está muito bem motivado."
 tgp_japan_sake_offering_character_modifier:0 "Presente de Sake"
 tgp_japan_sake_offering_character_modifier_desc:0 "Este personagem mostrou respeito aos deuses durante uma celebração das flores de cerejeira."
 tgp_japan_sake_offering_county_modifier:0 "Oferta de Sake"
 tgp_japan_sake_offering_county_modifier_desc:0 "O governante desta comarca mostrou respeito aos deuses durante uma celebração das flores de cerejeira."
 tgp_japan_taxed_entertainment_county_modifier:0 "Entretenimento Tributado"
 tgp_japan_taxed_entertainment_county_modifier_desc:0 "Nesta comarca, nenhuma oportunidade de engordar os cofres do estado é desperdiçada, principalmente com o entretenimento do povo."
 tgp_japan_tengu_rumors_character_modifier:0 "Rumores de Tengu"
 tgp_japan_tengu_rumors_character_modifier_desc:0 "Este personagem ainda está procurando por um [Glossary( 'Tengu', 'TENGU_GLOSS' )] após ouvir um boato.\n\nDiz-se que quem encontrar um e impressioná-lo será generosamente recompensado."
 tgp_japan_train_with_troops_modifier:0 "Tropas Inspiradas"
 tgp_japan_train_with_troops_modifier_desc:0 "Este personagem fez um discurso, inspirando suas tropas antes de qualquer batalha."
 tgp_japan_ushiwakamaru:0 "Ushiwakamaru"
 tgp_japan_ushiwakamaru_2:0 "$tgp_japan_ushiwakamaru$"
 tgp_japan_ushiwakamaru_2_desc:0 "Forte como um touro, este personagem continuará a buscar oponentes mais fortes para duelar.\n$stay_duelist_adventurer$"
 tgp_japan_ushiwakamaru_3:0 "$tgp_japan_ushiwakamaru$"
 tgp_japan_ushiwakamaru_3_desc:0 "Forte como um touro, este personagem continuará a buscar oponentes mais fortes para duelar.\n$stay_duelist_adventurer$"
 tgp_japan_ushiwakamaru_4:0 "$tgp_japan_ushiwakamaru$"
 tgp_japan_ushiwakamaru_4_desc:0 "Forte como um touro, este personagem continuará a buscar oponentes mais fortes para duelar.\n#help O potencial completo deste personagem foi alcançado#!"
 tgp_japan_ushiwakamaru_desc:0 "Forte como um touro, este personagem continuará a buscar oponentes mais fortes para duelar.\n$stay_duelist_adventurer$"
 tgp_law_defender:0 "Defensor da Lei"
 tgp_law_defender_desc:0 "Este personagem garante que todos os criminosos cumpram sua sentença."
 tgp_learned_from_onibi_modifier:0 "Aprendeu com Onibi"
 tgp_learned_from_onibi_modifier_desc:0 "Este personagem adquiriu conhecimento a partir de sua discussão sobre [Glossary('Onibi', 'ONIBI_GLOSS')]"
 tgp_longer_life_modifier:0 "Regente Duradouro"
 tgp_longer_life_modifier_desc:0 "Apesar da idade avançada, este governante busca uma vida longa."
 tgp_moved_shogun_court_modifier:0 "Capital do Shogunato"
 tgp_moved_shogun_court_modifier_desc:0 "Este condado está sendo estabelecido como nova capital do Shogunato, longe da capital imperial."
 tgp_neglected_modifier:0 "Negligenciado"
 tgp_neglected_modifier_desc:0 "A saúde deste personagem é de importância secundária."
 tgp_people_mingler_modifier:0 "Regente Magnânimo"
 tgp_people_mingler_modifier_desc:0 "Este personagem demonstrou magnanimidade em sua corte."
 tgp_power_undermined_modifier:0 "Poder Minado"
 tgp_power_undermined_modifier_desc:0 "O poder deste personagem foi minado por uma força externa.\n@declare_regent_icon! Aceitação de Declaração de Regente: #P +25#!"
 tgp_rebuilder_modifier:0 "Aspirante a Arquiteto"
 tgp_rebuilder_modifier_desc:0 "Este personagem se esforça para construir edifícios não religiosos.\n\n#warning Não pode construir [temples|E]!#!"
 tgp_reflection_modifier:0 "Caminho do Destino"
 tgp_reflection_modifier_desc:0 "Este personagem tem estado reflexivo recentemente e está mais aberto a explorar sua fé.\nCusto de [pilgrimage|E]: #P -20%#!"
 tgp_regent_guarded_modifier:0 "Motivador de Moral"
 tgp_regent_guarded_modifier_desc:0 "Este personagem sabe como influenciar comandantes militares e cavaleiros."
 tgp_regent_history_modifier:0 "Incentivou Estudiosos"
 tgp_regent_history_modifier_desc:0 "Este personagem incentivou estudiosos e poetas a escrever sobre sua grandeza."
 tgp_regent_minted_coin_modifier:0 "Moeda Cunhada"
 tgp_regent_minted_coin_modifier_desc:0 "Este personagem cunhou moedas com sua imagem."
 tgp_rule_follower_modifier:0 "Súdito Obediente"
 tgp_rule_follower_modifier_desc:0 "Este governante segue as leis de seu soberano, e, por consequência, seus súditos também se alinharão."
 tgp_scheme_wary_modifier:0 "Investigador Privado"
 tgp_scheme_wary_modifier_desc:0 "Este personagem possui conhecimento pessoal sobre segredos em sua corte."
 tgp_shadow_yokai_imitation_modifier:0 "Presença Intimidante"
 tgp_shadow_yokai_imitation_modifier_desc:0 "Este personagem carrega uma presença intimidadora, acreditando que possui um aliado [Glossary('Yokai', 'YOKAI_GLOSS')]"
 tgp_shadow_yokai_torch_modifier:0 "Patrulhas Extras"
 tgp_shadow_yokai_torch_modifier_desc:0 "Este personagem acredita que um [Glossary('Yokai', 'YOKAI_GLOSS')] possuiu sua sombra, aumentando as defesas em seu domínio."
 tgp_sharing_power_modifier:0 "Compartilhando Poder"
 tgp_sharing_power_modifier_desc:0 "Este personagem está compartilhando poder para aliviar o estresse."
 tgp_shrine_health_modifier:0 "Corpo Fortalecido"
 tgp_shrine_health_modifier_desc:0 "Este personagem rezou em um santuário e refletiu que deveria investir em sua saúde."
 tgp_shrine_heir_modifier:0 "Favor Dinástico"
 tgp_shrine_heir_modifier_desc:0 "Este personagem rezou em um santuário e refletiu que deveria investir em garantir o futuro de sua família."
 tgp_shrine_piety_modifier:0 "Servo Fiel"
 tgp_shrine_piety_modifier_desc:0 "Este personagem fortaleceu sua fé ao rezar em um santuário."
 tgp_shrine_wealth_modifier:0 "Prosperidade Econômica"
 tgp_shrine_wealth_modifier_desc:0 "Este personagem rezou em um santuário e refletiu que deveria investir em aumentar sua riqueza."
 tgp_siren_yokai_love_modifier:0 "Em Busca do Amor"
 tgp_siren_yokai_love_modifier_desc:0 "Este personagem foi inspirado por um [Glossary('Yokai', 'YOKAI_GLOSS')] a encontrar o amor."
 tgp_siren_yokai_prose_modifier:0 "Aspirante a Contador de Histórias"
 tgp_siren_yokai_prose_modifier_desc:0 "Este personagem foi inspirado pelas canções que sonhou de um [Glossary('Yokai', 'YOKAI_GLOSS')] cantando para ele. Agora escreverá suas próprias histórias."
 tgp_spreading_scholarly_work_modifier:0 "Divulgando Conhecimento"
 tgp_spreading_scholarly_work_modifier_desc:0 "Este personagem incentiva estudiosos a escrever ensaios e memorandos em todo o seu reino."
 tgp_stability_tree_modifier:0 "Raízes Fortes"
 tgp_stability_tree_modifier_desc:0 "Como as raízes de um [Glossary('Bonsai', 'BONSAI_GLOSS')], o reino e a corte deste personagem são estáveis."
 tgp_temple_builder_modifier:0 "Construtor de Santuários"
 tgp_temple_builder_modifier_desc:0 "Este personagem recentemente reconstruiu um santuário que foi incendiado."
 tgp_traveling_safe_modifier:0 "Viajante Cauteloso"
 tgp_traveling_safe_modifier_desc:0 "Este personagem está sendo cauteloso durante viagens, evitando perigos potenciais sem sacrificar velocidade."
 tpg_japan_add_fish_to_pond_modifier:0 "Lago cheio de peixes"
 tpg_japan_add_fish_to_pond_modifier_desc:0 "O jardineiro deste personagem adicionou peixes extras ao lago, tornando-o um local popular para visitação dos cortesãos."
 tpg_japan_hot_spring_relaxation_modifier:0 "Relaxado após Onsen"
 tpg_japan_hot_spring_relaxation_modifier_desc:0 "Este personagem tomou um banho restaurador em um [Glossary( 'onsen', 'ONSEN_GLOSS' )]."
