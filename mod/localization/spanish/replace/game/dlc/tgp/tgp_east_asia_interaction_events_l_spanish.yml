l_spanish:
 attempted_to_embrace_my_tributary_opinion:0 "Tentou Abraçar Meu Tributário"
 auto_accept_interaction_huangdi:0 "O poder do Estado é absoluto"
 celestial_extinguish_noble_family_interaction_banish_explanation:0 "Quaisquer [spouses|E] ou [concubines|E], e [close_family|E] e [extended_family|E] da mesma [house|E], serão [banished|E] do [realm|E]"
 celestial_extinguish_noble_family_interaction_death_explanation:0 "Qualquer pai e filhos adultos — mais jovens que a [retirement_age|E] e do gênero dominante de sua [faithpossessive|E] — serão executados"
 celestial_extinguish_noble_family_interaction_exemption_explanation:0 "Qualquer [spouse|E] ou [concubines|E], [close_family|E] ou [extended_family|E] que sejam [married|E] com ou filhos de um membro da [house|E] governante de [actor.GetHouse.GetName] será poupado"
 embraced_my_tributary_opinion:0 "Abraçou Meu Tributário"
 is_currently_being_purged_tt:0 "[recipient.GetShortUIName] está sendo purgado"
 purged_banishment_opinion:0 "Criminoso Banido"
 purged_execution_opinion:0 "Condenado à Morte"
 tgp_east_asia_interaction_events.0010.a:0 "Como pode ser!"
 tgp_east_asia_interaction_events.0010.desc:0 "Sirvo a outro Devaraja agora. Um que nos mostrará o verdadeiro caminho.\n\nViva [leaving_tributary.GetSuzerain.GetName]!"
 tgp_east_asia_interaction_events.0010.opening:0 "[leaving_tributary.Custom2('AppropriateGreeting', ROOT.Char)]"
 tgp_east_asia_interaction_events.0010.tt:0 "[leaving_tributary.GetShortUIName|U] não é mais seu [tributary|E]"
 tgp_east_asia_interaction_events.0020.a:0 "Era o que eu pensava."
 tgp_east_asia_interaction_events.0020.desc:0 "Meu Devaraja apresenta um argumento convincente.\n\nPermita-nos servir, ainda que por mais algum tempo."
 tgp_east_asia_interaction_events.0020.opening:0 "[recipient.Custom2('AppropriateGreeting', actor )]"
 tgp_east_asia_interaction_events.0025.a:0 "Pois bem, então..."
 tgp_east_asia_interaction_events.0025.desc:0 "Vejo através de suas mentiras mesquinhas e não serei facilmente coagido!\n\nEspero mais de um verdadeiro Devaraja!"
 tgp_east_asia_interaction_events.0025.opening:0 "[recipient.Custom2('AppropriateGreeting', actor )]"
 tgp_east_asia_interaction_events.0030.a:0 "Vou limpar a mente [recipient.GetHerHim] desse absurdo."
 tgp_east_asia_interaction_events.0030.b:0 "Irei lidar com isso pela força!"
 tgp_east_asia_interaction_events.0030.c:0 "Tenho assuntos mais importantes a tratar."
 tgp_east_asia_interaction_events.0030.desc:0 "Parece que aquel[Select_CString( actor.IsFemale, 'a', 'e' )] [actor.Custom2('InsultNoun', ROOT.Char)] [actor.GetTitledFirstName] está tentando desviar [Select_CString( recipient.IsFemale, 'minha tributária', 'meu tributário' )], [recipient.GetTitledFirstName], do caminho.\n\nTentativas foram feitas para convencer [recipient.GetFirstNameNoTooltip] da absurda divindade d[Select_CString( actor.IsFemale, 'a', 'o' )] [actor.GetFirstNamePossessiveNoTooltip], ofuscando a minha."
 tgp_east_asia_interaction_events.0030.t:0 "Abraçado: Um Desafiante se Aproxima"
 tgp_east_asia_interaction_events.0035.a:0 "Entendo."
 tgp_east_asia_interaction_events.0035.desc.warring:0 "Lamento informar, [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('sending_character'))] traiçoeir[Select_CString( sending_character.IsFemale, 'a', 'o' )], que escolhi reafirmar o tributário d[Select_CString( recipient.IsFemale, 'a', 'o' )] [recipient.GetTitledFirstName] pela força.\n\nConsidere isto um aviso."
 tgp_east_asia_interaction_events.0035.desc:0 "Lamento informar que minha fé permanece com meu verdadeiro Devaraja, [recipient.GetSuzerain.GetTitledFirstName].\n\nNão nos incomode mais."
 tgp_east_asia_interaction_events.0035.opening:0 "[sending_character.Custom2('AppropriateGreeting', ROOT.Char)]"
 tgp_east_asia_interaction_events.2000.a.title:0 "Punição Coletiva"
 tgp_east_asia_interaction_events.2000.a.tt:0 "[recipient.GetShortUIName] e sua família foram purgados por [purger.GetShortUIName]"
 tgp_east_asia_interaction_events.2000.a:0 "Por minha vontade e por meu direito, #EMP eu #bold extinguirei#! o nome [recipient.GetHerHim]#!."
 tgp_east_asia_interaction_events.2000.desc:0 "É meu dever celestial promover o bem e eliminar o mal; e, dentre estes, há poucas fontes de perversidade ao meu alcance maiores do que [recipient.GetTitledFirstName]! Os crimes [recipient.GetHerHim] #EMP maculam#! sua linhagem, e para os culpados não pode haver perdão; a erradicação desse mal deve alcançar profundamente suas raízes.\n\nAqueles que se opuserem à nossa vontade tremerão diante do desfazimento de [recipient.GetHerHis]; que sua cabeça seja separada de seu corpo e deixada para apodrecer na praça do mercado, seus ossos insepultos e seu espírito inquieto, e qualquer um que compartilhe de seu sangue venenoso será executado ou banido para os quatro cantos do mundo."
 tgp_east_asia_interaction_events.2000.t:0 "Raiz, Caule e Ramo"
