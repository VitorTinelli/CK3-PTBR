 custom.chaos_new_tributaries_disciples:0 "$BULLET$Todos os [disciples|E] de [title_tier|E] igual ou superior ao #V Seu#! e todos que não são adjacentes ao seu [realm|E]"
 custom.chaos_new_vassals:0 "$BULLET$Todos os membros [independent|E] de [movement|E] e [disciples|E] de [title_tier|E] inferior ao #V Seu#! adjacentes ao seu [realm|E]"
 custom.chaos_new_vassals_disciples:0 "$BULLET$Todos os [disciples|E] [independent|E] de [title_tier|E] inferior ao #V Seu#! adjacentes ao seu [realm|E]"
 dynastic_cycle_entered_chaos_became_independent_tt:0 "[relevant_character.GetShortUIName|U] tornou-se [independent|E]"
 dynastic_cycle_entered_chaos_changed_top_liege_tt:0 "[new_top_liege.GetShortUIName] se tornou seu novo [top_liege|E]"
 dynastic_cycle_entered_chaos_hunagdi_tt:0 "[son_of_heaven|E] abdicou e perdeu todos os [landed|E] [titles|E] e o [mandate_of_heaven|E]"
 dynastic_cycle_entered_chaos_tt:0 "[GetSituation('dynastic_cycle').GetName] entrou em [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_chaos').GetName]"
 dynastic_cycle_entered_conquest_tt:0 "[GetSituation('dynastic_cycle').GetName] entrou em [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability_conquest').GetName]"
 dynastic_cycle_entered_instability_tt:0 "[GetSituation('dynastic_cycle').GetName] entrou em [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName]"
 dynastic_cycle_entered_stability_advancement_past_tt:0 "[GetSituation('dynastic_cycle').GetName] entrou em [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName]"
 dynastic_cycle_entered_stability_advancement_tt:0 "[GetSituation('dynastic_cycle').GetName] entra em [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName]"
 dynastic_cycle_entered_stability_expansion_past_tt:0 "[GetSituation('dynastic_cycle').GetName] entrou em [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName]"
 dynastic_cycle_entered_stability_expansion_tt:0 "[GetSituation('dynastic_cycle').GetName] entra em [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName]"
 intro_event_joined_movement:0 "Ingressou no [my_movement.GetName]"
 tgp_china_consolidation.remain_independent:0 "Permaneça como um [independent_ruler|E]"
 tgp_dynastic_cycle.0051.a.emperor:0 "Que nosso reinado perdure por dez mil anos!"
 tgp_dynastic_cycle.0051.a.interloper:0 "A fortuna é tão incerta quanto os ventos e nuvens."
 tgp_dynastic_cycle.0051.a.involved:0 "Riqueza e honra dependem dos Céus!"
 tgp_dynastic_cycle.0051.desc.advancement:0 "$tgp_dynastic_cycle.0051.desc.intro$ [GetSituation('dynastic_cycle').GetTopCurrentPhase.GetType.GetNameNoTooltip|l], grande progresso tecnológico e acúmulo de riqueza são esperados para todos no reino."
 tgp_dynastic_cycle.0051.desc.advancement_movement:0 "Dizem que deve-se servir como ministro capaz em tempos de paz, mas não se pode negar que tempos de caos frequentemente recompensam aqueles com astúcia e artimanhas em vez dos virtuosos..."
 tgp_dynastic_cycle.0051.desc.conquest:0 "$tgp_dynastic_cycle.0051.desc.intro$ [GetSituation('dynastic_cycle').GetTopCurrentPhase.GetType.GetNameNoTooltip|l], o destino de todos no reino é incerto."
 tgp_dynastic_cycle.0051.desc.conservative_movement:0 "\n\nMinha família sempre seguirá a orientação dos Céus."
 tgp_dynastic_cycle.0051.desc.consolidation:0 "$tgp_dynastic_cycle.0051.desc.intro$ [GetSituation('dynastic_cycle').GetTopCurrentPhase.GetType.GetNameNoTooltip|l], [GetSituation('dynastic_cycle').GetTopSubRegion.GetNameNoTooltip] jaz dilacerada enquanto senhores da guerra disputam o Mandato do Céu. A busca pela virtude moral foi abandonada nestes tempos caóticos."
 tgp_dynastic_cycle.0051.desc.corruption:0 "$tgp_dynastic_cycle.0051.desc.intro$ [GetSituation('dynastic_cycle').GetTopCurrentPhase.GetType.GetNameNoTooltip|l], [GetTitleByKey('h_china').GetHolder.GetSheHe] falhou em herdar as virtudes de seus ancestrais. O estado sucumbiu à imoralidade degenerada e a ministros perversos de caráter ignóbil."
 tgp_dynastic_cycle.0051.desc.emperor:0 "\n\nComo soberano, é minha responsabilidade manter o Mandato e governar virtuosamente, como a Estrela do Norte ao redor da qual todos os corpos celestes giram."
 tgp_dynastic_cycle.0051.desc.expansion:0 "$tgp_dynastic_cycle.0051.desc.intro$ [GetSituation('dynastic_cycle').GetTopCurrentPhase.GetType.GetNameNoTooltip|l], grandes conquistas e feitos de força são esperados por todos no reino."
 tgp_dynastic_cycle.0051.desc.expansion_movement:0 "\n\nPessoas como eu, servindo como generais poderosos, garantirão a estabilidade do reino."
 tgp_dynastic_cycle.0051.desc.interloper:0 "\n\nPode não ser a terra de nossos ancestrais, mas este lugar é rico em oportunidades difíceis de resistir, desde que andemos com cautela."
 tgp_dynastic_cycle.0051.desc.intro:0 "[GetSituation('dynastic_cycle').GetTopSubRegion.GetName] é uma terra imensa e próspera. Dotada do mandato para governar por vontade do Céu, seu soberano deve reinar com justiça para manter o favor divino, enquanto atos de tirania arriscam a ira do Céu.\n\nNeste tempo de"
 tgp_dynastic_cycle.0051.desc.pro_hegemon_movement:0 "\n\nApenas o soberano pode cumprir as promessas, e eu darei a [GetTitleByKey('h_china').GetHolder.GetSheHe] meu apoio inabalável!"
 tgp_dynastic_cycle.0051.desc.unaligned_movement:0 "\n\nMeu papel no ciclo sem fim é incerto. Os Céus me guiarão quando eu estiver pronto para tomar uma posição."
 tgp_dynastic_cycle.0051.t:0 "O $dynastic_cycle$ — [GetSituation('dynastic_cycle').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 tgp_dynastic_cycle.0052.a:0 "Manterei imparcialidade."
 tgp_dynastic_cycle.0052.desc.advancement:0 "Espero pela prosperidade do reino e que o povo possa cultivar suas vidas. Talvez um dia eu olhe com mais interesse para ingressar em [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey('advancement_movement').GetName]."
 tgp_dynastic_cycle.0052.desc.conquest:0 "Embora eu observe o governo de [ROOT.Char.GetTopLiege.GetDynastyName] e aja conforme se eles perderem ou ganharem favores dos Céus."
 tgp_dynastic_cycle.0052.desc.expansion:0 "Vou acompanhar de perto as notícias das frentes e torcer por todas as conquistas. Talvez então eu considere ingressar em [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey('expansion_movement').GetName]."
 tgp_dynastic_cycle.0052.desc.instability:0 "No entanto, ainda me preocupo com a direção do reino e receio que a [ROOT.Char.GetTopLiege.GetDynastyName] governante perca a [ROOT.Char.GetTopLiege.GetLegitimacyType.GetFlavorName(ROOT.Char.GetTopLiege.GetLegitimacyLevel.Self)]."
 tgp_dynastic_cycle.0052.desc.intro:0 "$tgp_dynastic_cycle.0052.desc.intro_common$\n\nExistem muitas tentações e pessoas influentes por aí. Por enquanto, devo manter distância de toda a politicagem e focar na minha propriedade e no meu cargo local.\n\n"
 tgp_dynastic_cycle.0052.desc.intro_common:0 "[GetTitleByKey('h_china').GetHolder.GetName] é ungido pelos Céus para cumprir as promessas de uma Era [GetSituation('dynastic_cycle').GetTopCurrentPhase.GetName]. Enquanto isso, escolhi o caminho do [ROOT.Char.Custom('GetMyMovement')]."
 tgp_dynastic_cycle.0052.t:0 "Ingressou no [ROOT.Char.Custom('GetMyMovementNoTooltip')]"
 tgp_dynastic_cycle.0053.a:0 "Apenas os mais poderosos prevalecerão!"
 tgp_dynastic_cycle.0053.desc.advancement:0 "Embora a postura atual de [ROOT.Char.GetTopLiege.GetName] não nos apoie plenamente. Há ações a serem tomadas para guiar o [GetSituation('dynastic_cycle').GetName] rumo a [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName] e realizar nosso potencial."
 tgp_dynastic_cycle.0053.desc.conquest:0 "A vontade dos Céus é conquistar, e [ROOT.Char.GetTopLiege.GetDynastyName] lidera pelo exemplo."
 tgp_dynastic_cycle.0053.desc.expansion:0 "A vontade dos Céus é conquistar, e estamos prontos!"
 tgp_dynastic_cycle.0053.desc.instability:0 "No entanto, os tempos são incertos e as visões turvas. Apenas o exército pode manter a ordem; esperemos que [ROOT.Char.GetTopLiege.GetDynastyName] perceba isso mais cedo do que tarde."
 tgp_dynastic_cycle.0053.desc.intro:0 "$tgp_dynastic_cycle.0052.desc.intro_common$\n\nHaverá muitas oportunidades para aprender novas táticas e estratégias militares com meus colegas. No topo da hierarquia brilha a mesa do [ROOT.Char.GetTopLiege.GetCouncillor('councillor_marshal').GetCouncilTitle], o auge de uma carreira militar que todos aqui almejam."
 tgp_dynastic_cycle.0053.t:0 "$tgp_dynastic_cycle.0052.t$"
 tgp_dynastic_cycle.0054.a:0 "O mérito supera tudo."
 tgp_dynastic_cycle.0054.desc.advancement:0 "A dinastia [ROOT.Char.GetTopLiege.GetDynastyName] está atualmente no mesmo caminho, que trará prosperidade e iluminação a todos sob o Céu! Vamos manter assim."
 tgp_dynastic_cycle.0054.desc.conquest:0 "A [ROOT.Char.GetTopLiege.GetDynastyName] é nova, portanto maleável para reconhecer que a vontade dos Céus é manifestada por meio de exames e oficiais justos!"
 tgp_dynastic_cycle.0054.desc.expansion:0 "A [ROOT.Char.GetTopLiege.GetDynastyName] segue um caminho destrutivo. Exércitos são caros, e generais são volúveis e perigosos. Precisamos desviar o poder deles."
 tgp_dynastic_cycle.0054.desc.instability:0 "A [ROOT.Char.GetTopLiege.GetDynastyName] está perdida. No entanto, podemos ajudá-la a voltar ao caminho certo garantindo exames frequentes e ministros meritórios."
 tgp_dynastic_cycle.0054.desc.intro:0 "$tgp_dynastic_cycle.0052.desc.intro_common$\n\nNosso objetivo é compartilhar a beleza da arte e do conhecimento. A cultura da mente e da alma é um caminho certo para ser agraciado pelos Céus."
 tgp_dynastic_cycle.0054.t:0 "$tgp_dynastic_cycle.0052.t$"
 tgp_dynastic_cycle.0055.a:0 "Louvem-se os Céus e a [ROOT.Char.GetTopLiege.GetDynastyNameNoTooltip]!"
 tgp_dynastic_cycle.0055.desc.advancement:0 "prosperidade, riqueza e avanços tecnológicos a todos sob o Céu."
 tgp_dynastic_cycle.0055.desc.conquest:0 "todos sob o Céu reconhecerem a [GetTitleByKey('h_china').GetHolder.GetDynastyName] como digna do Mandato do Céu."
 tgp_dynastic_cycle.0055.desc.expansion:0 "novas terras e povos para reconhecerem o destino [GetTitleByKey('h_china').GetHolder.GetHerHim] de governar com justiça sobre eles."
 tgp_dynastic_cycle.0055.desc.instability:0 "trazer o sol de volta nestes tempos nublados."
 tgp_dynastic_cycle.0055.desc.intro:0 "$tgp_dynastic_cycle.0052.desc.intro_common$\n\nEu e meus companheiros de movimento confiamos nossas vidas a [GetTitleByKey('h_china').GetHolder.GetSheHe]. Graças à sabedoria e orientação [GetTitleByKey('h_china').GetHolder.GetHerHim], traremos "
 tgp_dynastic_cycle.0055.t:0 "$tgp_dynastic_cycle.0052.t$"
 tgp_dynastic_cycle.0056.a:0 "A força se encontra nos laços familiares."
 tgp_dynastic_cycle.0056.desc.advancement:0 "No entanto, [ROOT.Char.GetTopLiege.GetName] está cego pelos exames, permitindo que camponeses provinciais ocupem cargos. Logo, desdenharão nossa história."
 tgp_dynastic_cycle.0056.desc.conquest:0 "[ROOT.Char.GetTopLiege.GetName] precisa perceber que este é o único caminho para manter a ordem no reino. Todos sob os Céus reconhecerão o governo d[Select_CString( ROOT.Char.GetTopLiege.IsFemale, 'a', 'o' )] [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip], se apoiado por nossas amadas famílias."
 tgp_dynastic_cycle.0056.desc.expansion:0 "No entanto, [ROOT.Char.GetTopLiege.GetName] está ocupado desperdiçando vidas de nossos irmãos e irmãs em guerras sem sentido. Enquanto isso, os generais agem sem controle, tomando poder e cargos de nossas famílias."
 tgp_dynastic_cycle.0056.desc.instability:0 "[ROOT.Char.GetTopLiege.GetName] perdeu muita credibilidade. A única forma de restaurar a graça [ROOT.Char.GetTopLiege.GetHerHim] é garantir que [ROOT.Char.GetTopLiege.GetSheHe] siga nossas famílias."
 tgp_dynastic_cycle.0056.desc.intro:0 "$tgp_dynastic_cycle.0052.desc.intro_common$\n\nA tradição construída pelas gerações anteriores deve ser a pedra angular da burocracia da [ROOT.Char.GetTopLiege.GetDynastyName].\n\n"
 tgp_dynastic_cycle.0056.t:0 "$tgp_dynastic_cycle.0052.t$"
 tgp_dynastic_cycle.0061.a:0 "É nosso dever promover a virtude e eliminar o vício."
 tgp_dynastic_cycle.0061.b:0 "Sob o vasto céu, #EMP todos#! são súditos d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]."
 tgp_dynastic_cycle.0061.c:0 "Do alto do pico do mundo, tudo mais se torna pequeno."
 tgp_dynastic_cycle.0061.desc:0 "Dizem que os Céus são imparciais e sempre apoiam os virtuosos. Diz-se igualmente que o vencedor se torna rei, e o perdedor, bandido. O trono de [GetTitleByKey('h_china').GetNameNoTierNoTooltip] agora é #EMP meu#!, e com ele a sanção celestial para governar todo [GetTitleByKey('h_china').GetNameNoTierNoTooltip].\n\nAgora devo decidir a direção que meus novos ministros e suas legiões de funcionários devem tomar para canalizar seus esforços."
 tgp_dynastic_cycle.0061.t:0 "[GetTitleByKey('h_china').GetHolder.Custom('GetDaughterSon')|U] Favorito dos Céus "
 tgp_dynastic_cycle.0062.a:0 "Devemos avaliar cuidadosamente as capacidades [GetTitleByKey('h_china').GetHolder.GetHerHim)]."
 tgp_dynastic_cycle.0062.b:0 "$tgp_dynastic_cycle.0072.b$"
 tgp_dynastic_cycle.0062.desc.interloper:0 "À medida que a fortuna de um [GetTitleByKey('h_china').GetHolder.Custom('WomanManPossessive')] diminui, a de outro se amplifica, pois mesmo reis e imperadores não estão imunes às incertezas do destino.\n\n[GetTitleByKey('h_china').GetHolder.GetTitledFirstName] reivindicou o Mandato dos Céus, e todos devem prostrar-se aos pés deste novo soberano."
 tgp_dynastic_cycle.0062.desc.involved:0 "Os favores concedidos pelos Céus sempre aumentaram ou diminuíram de acordo com a virtude — ou a falta dela — de seus soberanos escolhidos.\n\nAgora, a estrela da [GetTitleByKey('h_china').GetHolder.GetDynastyName] está ascendente, e [GetTitleByKey('h_china').GetHolder.GetTitledFirstName] claramente possui a sanção divina dos Céus."
 tgp_dynastic_cycle.0062.desc.uninvolved:0 "Impérios se erguem e caem, e o antigo dá lugar ao novo. O trono de [GetTitleByKey('h_china').GetNameNoTierNoTooltip] foi obtido por [GetTitleByKey('h_china').GetHolder.GetTitledFirstName], e todos devem reconhecer este novo soberano, estejam dentro ou fora do reino [GetTitleByKey('h_china').GetHolder.GetHerHim].\n\nTais mudanças nos ventos do destino não podem ser tratadas levianamente."
 tgp_dynastic_cycle.0071.a:0 "$tgp_dynastic_cycle.0061.a$"
 tgp_dynastic_cycle.0071.b:0 "$tgp_dynastic_cycle.0061.b$"
 tgp_dynastic_cycle.0071.desc:0 "As nuvens de tempestade que permaneciam foram dissipadas, e um céu claro desponta sobre [GetTitleByKey('h_china').GetNameNoTierNoTooltip] mais uma vez. Superei as provas que me foram impostas, e agora ninguém pode duvidar ou contestar que sou realmente [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.Custom('GetDaughterSon')] escolhido pelos Céus.\n\nCom o tempo de dificuldades para trás, devo traçar um novo curso para o futuro, para que todos possam se unir em torno de um propósito singular."
 tgp_dynastic_cycle.0071.t:0 "Depois da Chuva Vem o Sol"
 tgp_dynastic_cycle.0072.a:0 "Uma brisa de primavera sopra, e a grama cresce novamente."
 tgp_dynastic_cycle.0072.b:0 "O único caminho é seguir a vontade do Céu."
 tgp_dynastic_cycle.0072.desc.advancement:0 "Tendo suportado um período de grande dificuldade e turbulência, [GetTitleByKey('h_china').GetNameNoTierNoTooltip] está em paz mais uma vez. As tribulações enviadas pelos Céus foram superadas, e todos podem ter certeza de que [GetTitleByKey('h_china').GetHolder.GetTitledFirstName] mantém o favor dos Céus."
 tgp_dynastic_cycle.0072.desc.conquest:0 "$tgp_dynastic_cycle.0051.desc.advancement$"
 tgp_dynastic_cycle.0072.desc.expansion:0 "$tgp_dynastic_cycle.0051.desc.advancement$"
 tgp_dynastic_cycle.0072.desc.interloper:0 "Tempos de paz oferecem poucas oportunidades para heróis se destacarem, mas outros caminhos de avanço podem agora se apresentar."
 tgp_dynastic_cycle.0072.desc.involved:0 "Para alguns, isso sinaliza o fim de suas ambições, mas para muitos traz um suspiro de alívio."
 tgp_dynastic_cycle.0072.desc.uninvolved:0 "Parece que a dinastia [GetTitleByKey('h_china').GetHolder.GetDynastyName] ainda tem algum vigor."
 tgp_dynastic_cycle.0081.a:0 "Quando a árvore cai, os macacos se dispersam."
 tgp_dynastic_cycle.0081.desc:0 "Em um instante, os Céus tremem e o mundo se volta de cabeça para baixo.\n\nMinistros leais fogem em busca de novos mestres, soldados abandonam seus deveres, e agora até os camponeses abandonam minhas terras por medo da turbulência que se aproxima.\n\nTodos os males são atribuídos ao meu governo #EMP iníquo#!, e é proclamado por toda parte que perdi o Mandato dos Céus!"
 tgp_dynastic_cycle.0081.t:0 "O Império, Longamente Unido, Deve se Dividir"
 tgp_dynastic_cycle.0082.a:0 "Crise é oportunidade."
 tgp_dynastic_cycle.0082.desc.interloper:0 "Onde antes havia um, agora há muitos.\n\nCom a perda do Mandato dos Céus, não há um governante legítimo a obedecer, e todas as pretensões foram abandonadas, todas as ambições veladas reveladas.\n\nOs ousados devem aproveitar as oportunidades conforme surgem."
 tgp_dynastic_cycle.0082.desc.involved:0 "A vontade do povo e a vontade dos Céus são uma só, e neste caso o ditado se confirmou - #EMP o Mandato dos Céus foi perdido#!.\n\nA nação se despedaçou. Dragões e tigres disputam, gananciosamente, o trono.\n\nTempos tumultuados estão por vir."
 tgp_dynastic_cycle.0082.desc.uninvolved:0 "Uma poderosa nação queima, e seus súditos se armam para lutar sobre suas cinzas.\n\n[GetTitleByKey('h_china').GetNameNoTierNoTooltip] se fragmentou, a instabilidade é a única certeza em seu futuro próximo, e aqueles que se envolverem no tumulto que se aproxima entram voluntariamente na toca do tigre."
 tgp_dynastic_cycle.0091.a:0 "A água que mantém um navio flutuando também pode vir a virá-lo."
 tgp_dynastic_cycle.0091.desc:0 "Apesar de meus esforços assíduos para governar com justiça, cada vez mais ouço sussurros de descontentamento.\n\nDevo enfrentar a perspectiva desconfortável de que a fé no favor dos Céus para meu reinado possa ter começado a vacilar, pois tais sentimentos podem abalar até os alicerces mais sólidos de um trono."
 tgp_dynastic_cycle.0091.t:0 "O Presságio da Miséria"
 tgp_dynastic_cycle.0092.a:0 "A maldade é uma doença que nenhum remédio pode curar."
 tgp_dynastic_cycle.0092.desc.interloper:0 "Parece que nem tudo vai bem em [GetTitleByKey('h_china').GetNameNoTierNoTooltip].\n\nA cada dia que passa, outra caravana ou comboio abandona suas terras em busca de pastos proverbialmente mais verdes. Até os mais gananciosos de nossos comerciantes preferem cada vez mais nossas terras às deles, tecendo tristes relatos de extorsão à ponta da espada e da pena."
 tgp_dynastic_cycle.0092.desc.involved:0 "O mundo sofre de uma doença. Uma moléstia do espírito.\n\nMalevolência e má conduta se espalham sem controle onde pilares da virtude outrora se mantinham firmes. Oficiais imorais enriquecem-se às custas das massas que governam, e soldados ponderam se é melhor saquear do que proteger."
 tgp_dynastic_cycle.0092.desc.uninvolved:0 "$tgp_dynastic_cycle.0092.desc.interloper$"
 tgp_dynastic_cycle.9001.a:0 "Que seja ouvido e conhecido!"
 tgp_dynastic_cycle.9001.desc:0 "Assim como todos os rios fluem para leste em direção ao mar, assim também as massas que habitam sob os Céus agora me olham como seu soberano.\n\nO primeiro passo para inaugurar meu reinado deve ser pronunciar o nome de nosso reino, para que todos saibam como chamar aquilo a que pertencem.\n\nCom que nome nossas ações ecoarão através da história?"
 tgp_dynastic_cycle.9001.t:0 "A Fundação de um Estado"
 tgp_dynastic_cycle.9002.black:0 "Nossas bandeiras devem ser #color:{0.4,0.39,0.37};bold pretas#! como águas ilimitadas e insondáveis."
 tgp_dynastic_cycle.9002.desc:0 "Os Céus têm cinco elementos que devem ser devidamente regulados e harmoniosamente atendidos.\n\nMadeira, fogo, terra, metal e água.\n\nDesde os tempos antigos, cada nova dinastia ascendente adotou um desses agentes elementares de mudança como seu próprio e coloriu suas bandeiras de acordo, e agora devo fazer esta escolha também."
 tgp_dynastic_cycle.9002.green:0 "Deve ser o #color:{0.4,0.61,0.3};bold verde#! das folhas da primavera e do crescimento exuberante."
 tgp_dynastic_cycle.9002.red:0 "Que seja #color:{0.80,0.3,0.3};bold vermelho#! como o fogo ardente em meu coração."
 tgp_dynastic_cycle.9002.t:0 "Os Elementos da Virtude"
 tgp_dynastic_cycle.9002.white:0 "Um #color:{1.0,1.0,1.0};bold branco#! puro e imaculado, para o metal firme e inflexível."
 tgp_dynastic_cycle.9002.yellow:0 "Escolho #color:{0.82,0.77,0.5};bold amarelo#!; simbólico da terra, imutável como nossas fundações."
 tgp_dynastic_cycle_decision_event.0101.a:0 "Confio que [new_player.GetFirstNameNoTooltip] cuidará de tudo."
 tgp_dynastic_cycle_decision_event.0101.desc:0 "Luto para enxergar sobre uma pilha de documentos que só cresce. Quando fecho os olhos, tudo o que ouço são as crianças brincando, os anciãos conversando e os adultos se entregando a um banquete. Ah, o cheiro da [ROOT.Char.Custom('RegionalEdibleMeat')] assando!\n\nTrabalhei tanto para chegar até aqui e aproveitei muito disso, mas agora sinto o cansaço. Tenho certeza de que meu [new_player.Custom2('MyCharacterIntroduction', ROOT.Char)] está ansioso para ocupar meu lugar.\n\nMereço desfrutar o tempo que me resta."
 tgp_dynastic_cycle_decision_event.0101.t:0 "$renounce_noble_family_title_decision$"
