l_spanish:
 tgp_china_yearly.0001.a.flavor:0 "... e admitir que falhei em governar meu povo."
 tgp_china_yearly.0001.a:0 "Doar comida e roupas aos pobres."
 tgp_china_yearly.0001.b.critical:0 "Sucesso Incrível!"
 tgp_china_yearly.0001.b.success:0 "Camponeses Subjugados com Sucesso"
 tgp_china_yearly.0001.b:0 "\"Espancá-los de volta ao trabalho!\""
 tgp_china_yearly.0001.c.flavor:0 "Não estou pronto para lidar com questões tão difíceis."
 tgp_china_yearly.0001.c:0 "\"Devo voltar aos meus estudos.\""
 tgp_china_yearly.0001.d:0 "Esses assuntos mundanos estão abaixo de mim."
 tgp_china_yearly.0001.desc:0 "No caminho de volta para minhas residências, não posso deixar de notar uma multidão reunida fora dos portões do [poor_county.GetProvince.GetName] [poor_county.GetProvince.GetHolding.GetType.GetName].\n\nMães, pais e crianças se alinham nas ruas, cabeças baixas de vergonha enquanto suas mãos alcançam restos de viajantes que passam."
 tgp_china_yearly.0001.t:0 "Quando o Caminho Não Prevalece"
 tgp_china_yearly.0005.a:0 "\"Encontrarei um tutor adequado para ele.\""
 tgp_china_yearly.0005.b:0 "\"Ele não poderá honrar s[Select_CString( parent.IsFemale, 'ua', 'eu' )] [parent.GetMotherFather] se o acolhermos.\""
 tgp_china_yearly.0005.c.flavor:0 "Você é lembrado de estudar mais."
 tgp_china_yearly.0005.c:0 "Não estou pronto para decidir sobre isso."
 tgp_china_yearly.0005.d:0 "Não podemos governar a vida e a morte."
 tgp_china_yearly.0005.eunuch:0 "[messenger.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me saúda com uma criança camponesa seguindo seus passos. \n\n\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsName], encontrei est[Select_CString( grieving_child.IsFemale, 'a', 'e' )] [grieving_child.Custom('GirlBoy')] fora dos portões, pedindo audiência com você. [grieving_child.GetSheHe|U] recentemente perdeu seu único parente vivo e não tem meios para um enterro adequado. Deve haver algo que possamos fazer por [grieving_child.GetHerHim]!\""
 tgp_china_yearly.0005.knight:0 "Ouço um grito alto e passos correndo vindos dos portões do pátio. Seguindo o som, encontro [messenger.GetTitledFirstName] segurando uma criança camponesa. \n\n\"Ajude-me, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip]!\" grita a criança. \"M[Select_CString( parent.IsFemale, 'inha', 'eu' )] [parent.GetMotherFather] morreu e me deixou sozinho. Não tenho pano para o corpo, nem pregos para o caixão.\" Pelos olhos vermelhos e pelo muco no nariz da criança, posso perceber que o sofrimento é genuíno."
 tgp_china_yearly.0005.outro:0 "\n\nSe eu não fizer nada, há chance de que esta criança não sobreviva por conta própria."
 tgp_china_yearly.0005.t:0 "Um[Select_CString( grieving_child.IsFemale, 'a', '' )] Verdadeir[Select_CString( grieving_child.IsFemale, 'a', 'o' )] [grieving_child.Custom('GetDaughterSon')|U]"
 tgp_china_yearly.0010.a.tt:0 "Você expulsa o escriba"
 tgp_china_yearly.0010.a:0 "Este escriba não é melhor que um ladrão!"
 tgp_china_yearly.0010.b:0 "[starving_lowborn.GetSheHe|U] poderia ser útil."
 tgp_china_yearly.0010.c:0 "Pergunto-me o que dizem os livros sobre isso."
 tgp_china_yearly.0010.d:0 "Tenho assuntos mais importantes para tratar."
 tgp_china_yearly.0010.desc:0 "Caminhando pelo mercado local, ouço um vendedor gritar: \"Poesia à venda! Palavras de sorte para trazer fortuna à sua casa!\"\n\nEu me afasto da multidão para inspecionar a barraca. A poesia é escrita com letras muito finas, linhas apressadas, quase se misturando em alguns pontos.\n\nTenho pouca fé na habilidade do vendedor, e ainda menos nas reivindicações de [starving_lowborn.GetHerHis], mas muitas pessoas estão na fila para comprar o trabalho de [starving_lowborn.GetHerHis]."
 tgp_china_yearly.0010.t:0 "Golpes de Sorte"
 tgp_china_yearly.0015.a:0 "Expulsar o comerciante."
 tgp_china_yearly.0015.b:0 "Permitir que o comerciante fique, a um custo."
 tgp_china_yearly.0015.c:0 "Eu os calo para poder meditar sobre meus estudos."
 tgp_china_yearly.0015.d:0 "Uma disputa tão mesquinha."
 tgp_china_yearly.0015.desc:0 "Minha visita a uma casa de chá local é interrompida por uma comoção na rua. Olho para fora e vejo [market_vendor.GetTitledFirstName], um pintor local, discutindo com um estranho. \n\n\"Meus clientes esperam me encontrar aqui. Tenho várias encomendas para entregar a eles!\" argumenta [market_vendor.GetTitledFirstNameNoTooltip], mas o comerciante já montou uma barraca e alinhou suas mercadorias.\n\nA barraca contém itens de [ROOT.Char.Custom('GetClothingArticle')], estátuas esculpidas de [ROOT.Char.Custom('RegionalFerociousAnimal')] e vários pentes e grampos de cabelo elaborados. É claro que este comerciante vive do trabalho de outros artesãos."
 tgp_china_yearly.0015.t:0 "Problemas Mercantis"
 tgp_china_yearly.0020.a:0 "Enviar os cobradores de impostos."
 tgp_china_yearly.0020.b:0 "Recusar."
 tgp_china_yearly.0020.desc:0 "[tax_official.GetTitledFirstName] me aborda no jardim com mãos inquietas e um sorriso astuto. Mal tenho tempo de soltar a [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')] em minha mão e encarar [tax_official.GetHerHim] completamente antes que [tax_official.GetSheHe] fale:\n\n\"Seu Soberano me enviou com uma mensagem,\" diz [tax_official.GetSheHe]. \"[tax_liege.GetTitledFirstName] deseja informar que o tesouro imperial precisa de fundos, e [taxless_county.GetProvince.GetName] possui vários impostos atrasados que [tax_liege.GetSheHe] deseja que você cobre.\"\n\nÉ desnecessário dizer que minha reputação sofrerá se eu não obedecer, mas [Glossary('Kǒngzǐ','CONFUCIUS_GLOSS')] nos ensina a abominar a ganância em todas as formas."
 tgp_china_yearly.0020.t:0 "Uma Questão de Serviço Público"
 tgp_china_yearly.0030.a:0 "Aceito graciosamente."
 tgp_china_yearly.0030.b:0 "Infelizmente, minha educação ainda não está completa."
 tgp_china_yearly.0030.desc_elder:0 "Como seu [elder|E], devo admitir que estou impressionado com a reputação que você construiu como um verdadeiro Confuciano."
 tgp_china_yearly.0030.desc_fellow_confucian:0 "Como um confucionista como você, alegra-me ouvir sobre sua dedicação ao Caminho, e espero muitas oportunidades para debates amistosos no futuro."
 tgp_china_yearly.0030.desc_intro_outro:0 "\n\nEm reconhecimento à sua retidão, ofereço apoiar sua candidatura para a governança de [free_title.GetName]."
 tgp_china_yearly.0030.desc_minister_of_personel:0 "[title_offerer.Custom2('AppropriateGreetingPositive', ROOT.Char)]\n\nÉ meu dever encontrar indivíduos talentosos como você e conduzi-los ao cargo."
 tgp_china_yearly.0030.t:0 "A Boa Palavra se Espalha"
 tgp_china_yearly_no_education_first:0 "#weak Você recebe este efeito porque não possui o traço Educação Confucionista.#!"
