l_spanish:
 BIAN_QUE_GLOSS:0 "Bian Que foi o nome de vários médicos lendários chineses: tanto um médico durante o Período dos Estados Combatentes (475 – 221 a.C.) quanto seu homônimo de muito antes, na época do Imperador Amarelo."
 CONFUCIUS_GLOSS:0 "Confúcio, ou Mestre Kong, foi um filósofo que fundou um sistema de crenças em torno da humanidade e da conduta moral. 'O Caminho', como ele descreveu em seus Analectos, tornou-se uma base para governar o estado e seu povo."
 CUJU_GLOSS:0 "Cuju é um esporte competitivo com raízes na dinastia Han. Tem sido praticado para recreação e condicionamento físico desde então, com equipes de até 20 jogadores durante eventos sociais na corte imperial. O jogo envolve principalmente chutar uma bola através de postes altos, evitando que a bola toque o chão."
 FOUR_WAYS_GLOSS:0 "Existem muitos métodos rigorosos para avaliar as qualificações de uma pessoa. Os quatro mais proeminentes são baseados em aparência, retórica, caligrafia e julgamento."
