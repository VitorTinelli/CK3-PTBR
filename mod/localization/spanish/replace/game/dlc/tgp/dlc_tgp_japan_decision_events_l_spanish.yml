 super_soryo_potential_peaceful:0 "@alert_icon!Para que todos os [holders|E] do [county|E] [de_jure|E] de [title_scope.GetName] se tornem seus [vassals|E] sem luta:\n$EFFECT_LIST_BULLET$Seu [prestige_level|E] é [prestige_i][GetModifier( 'prestige_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$Seu [legitimacy_level|E] é maior ou igual a #V 3#!\n$EFFECT_LIST_BULLET$Tenha alto [dread_i][dread|E]\n$EFFECT_LIST_BULLET$Força militar @soldier_icon! esmagadora#!"
 super_soryo_reward_peaceful:0 "Todos os [holders|E] do [county|E] [de_jure|E] de [title_scope.GetName] se tornarão seus [vassals|E]"
 super_soryo_war_no_holder_custom_tooltip:0 "Inicie uma [domination_war|E] contra [main_defender.GetShortUIName] por [title_scope.GetName]\n\t$BULLET$Cada [holder|E] do [county|E] [de_jure|E] de [title_scope.GetName] se juntará a [main_defender.GetShortUIName] como defensor #weak (@soldier_icon![super_soryo_war_current_enemy_strength|N0])#!"
 tgp_bloc_members_join_war_effect_tt:0 "Se você lidera um [bloc|E], seus membros se juntarão à sua [war|E]"
 tgp_japan_assert_regional_dominion_kampaku_crime_effect:0 "@warning_icon! #X O [ceremonial_regent|E] é [ritsuryo|E] e considerará isto um [crime_i|E][crime|E]#!"
 tgp_japan_decision.9001.a.cadet:0 "$tgp_japan_decision.9001.a.fief$"
 tgp_japan_decision.9001.a.fief:0 "Um novo sol nasce."
 tgp_japan_decision.9001.desc.cadet:0 "Sou um orgulhoso [old_house.GetBaseNameNoTooltip], mas é hora de trilhar um novo caminho e estabelecer minha própria casa, independentemente do que o chefe da minha casa, [old_head.GetTitledFirstName], possa pensar."
 tgp_japan_decision.9001.desc.crime:0 "\n\n[regent.GetTitledFirstName] sem dúvida ficará furioso quando [regent.GetSheHe] souber disso, mas isso não é motivo de grande preocupação!"
 tgp_japan_decision.9001.desc.feudal:0 "\n\nA Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip] finalmente se junta às fileiras da nova nobreza, liderada [Select_CString( regent.IsFemale, 'pela', 'pelo' )] [regent.GetTitledFirstName]."
 tgp_japan_decision.9001.desc.fief_name:0 "\n\nTudo que resta é decidir o nome da minha nova casa..."
 tgp_japan_decision.9001.desc.fief_split_house:0 "Sou um orgulhoso [old_house.GetBaseNameNoTooltip], mas é hora de trilhar um novo caminho e estabelecer minhas próprias terras em [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetNameNoTier], independentemente do que o chefe da minha casa, [old_head.GetTitledFirstName], possa pensar."
 tgp_japan_decision.9001.desc.permission:0 "\n\nCom a bênção d[Select_CString( regent.IsFemale, 'a', 'o' )] [regent.GetTitledFirstNamePossessive], há pouca chance de repreensão da capital!"
 tgp_japan_decision.9001.t.cadet:0 "$create_cadet_branch_decision$"
 tgp_japan_decision.9001.t.fief:0 "O Feudo de [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 tgp_japan_decision.9002.a:0 "Um novo sol nasce sobre a Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 tgp_japan_decision.9002.desc.landed:0 "É hora de trilhar um novo caminho e estabelecer [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetNameNoTier] como um feudo permanente da [ROOT.Char.GetHouse.GetBaseName]."
 tgp_japan_decision.9002.desc.landless:0 "É hora de trilhar um novo caminho e abandonar as amarras dos burocratas."
 tgp_japan_decision.9002.desc:0 "Lutamos dentro dos limites da burocracia o melhor que pudemos, mas chega."
 tgp_japan_decision.9002.t.landless:0 "$tgp_japan_decision.9001.t.fief$"
 tgp_japan_decision.9002.t:0 "$tgp_japan_decision.9001.t.fief$"
 tgp_japan_decision.9005.a:0 "O sol brilha intensamente, sem a sombra da [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 tgp_japan_decision.9005.desc:0 "M[Select_CString( new_head.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', new_head)], [new_head.GetTitledFirstName], proclamou corajosamente o início de uma nova casa, a [new_head.GetHouse.GetBaseName], com [Select_CString( new_head.IsFemale, 'ela mesma', 'ele mesmo' )] à frente.\n\nNão posso fingir acolher essa flagrante rejeição da minha autoridade sobre a Casa [ROOT.Char.GetHouse.GetBaseName] — vamos ver como [new_head.GetSheHe] se sai sem minha proteção..."
 tgp_japan_decision.9005.t.landless:0 "$tgp_japan_establish_soryo_manor_decision$: Família se Divide"
 tgp_japan_decision.9005.t:0 "$tgp_japan_establish_house_fief_decision$: Família se Divide"
 tgp_japan_decision.9101.a:0 "Uma medida necessária para garantir a paz..."
 tgp_japan_decision.9101.desc:0 "Uma nova era desponta sobre [GetTitleByKey('e_japan').GetBaseNameNoTierNoTooltip], à medida que o poder se desloca da pena para a espada. Sob a liderança da Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip], a ordem finalmente será restaurada, e os últimos vestígios da antiga burocracia relegados à história.\n\nMas que ninguém se engane — minha autoridade deriva de [Select_CString( ceremonial_liege.IsFemale, 'nossa divina', 'nosso divino' )] [ceremonial_liege.GetTitleAsNameNoTooltip]..."
 tgp_japan_decision.9101.t:0 "O Shōgunato da Casa [shogun.GetHouse.GetBaseNameNoTooltip]"
 tgp_japan_decision.9102.a.admin:0 "É uma nova ordem severa."
 tgp_japan_decision.9102.admin:0 "Minha autoridade foi retirada, minhas terras entregues ao Shōgun. Em meu lugar, chegam beligerantes que governam pela força e não pelas palavras..."
 tgp_japan_decision.9102.desc:0 "O Shōgunato ascendeu sob o governo de [shogun.GetName], pondo fim aos intermináveis fóruns cortesãos. Em seu lugar, a espada e o guerreiro detêm agora o verdadeiro poder, trazendo segurança e ordem diretamente às mãos do povo.\n\n"
 tgp_japan_decision.9102.fallback:0 "Esperançosamente, com o tempo, esta decisão se mostrará frutífera."
 tgp_japan_decision.9102.feudal:0 "Nossas terras permanecem seguras, e a autoridade retorna às nossas mãos. Nesta nova era, a força determina tudo."
 tgp_japan_decision.9102.t:0 "$tgp_japan_decision.9101.t$"
 tgp_japan_decision.9201.a:0 "Tomarei um lugar entre os $dynn_Minamoto$ da [minamoto_house.GetNameNoTooltip]"
 tgp_japan_decision.9201.b:0 "Meu lugar é com os $dynn_Taira$ da [taira_house.GetNameNoTooltip]."
 tgp_japan_decision.9201.both:0 "Ambos os nomes já foram concedidos à prole d[Select_CString( nearest_emperor.IsFemale, 'a', 'o' )] [nearest_emperor.GetTitledFirstNamePossessiveNoTooltip], famílias lideradas [Select_CString( minamoto_head.IsFemale, 'pela minha', 'pelo meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('minamoto_head'))], [minamoto_head.GetTitledFirstName], e [Select_CString( taira_head.IsFemale, 'pela minha', 'pelo meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('taira_head'))], [taira_head.GetTitledFirstName]."
 tgp_japan_decision.9201.c.tt:0 "Você fundou a [dynasty|E] #V [nearest_emperor.GetFirstNameNoTooltip] Minamoto#!"
 tgp_japan_decision.9201.c:0 "Desejo assumir o nome $dynn_Minamoto$."
 tgp_japan_decision.9201.d.tt:0 "Você fundou a [dynasty|E] #V [nearest_emperor.GetFirstNameNoTooltip] Taira#!"
 tgp_japan_decision.9201.d:0 "'$dynn_Taira$ [ROOT.Char.GetFirstNameNoTooltip]' possui certa gravitas."
 tgp_japan_decision.9201.desc:0 "Embora eu seja de sangue real, um verdadeiro descendente [Select_CString( nearest_emperor.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('nearest_emperor'))], [nearest_emperor.GetTitledFirstName], meu chamado e o destino de meus descendentes estão além dos muros do palácio imperial.\n\nRenunciarei a qualquer reivindicação a [ROOT.Char.GetTopLiege.GetPrimaryTitle.MakeScope.Var('administrative_ui_special_title').Title.GetDefinitiveName|l], e assumirei um dos títulos habituais [Glossary( 'Honsei', 'HONSEI_GLOSS' )] concedidos a descendentes imperiais deserdados: [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] ou [Glossary( 'Taira', 'TAIRA_GLOSS' )].\n\n"
 tgp_japan_decision.9201.message_title:0 "Ramos da Família Imperial"
 tgp_japan_decision.9201.minamoto:0 "Os $dynn_Minamoto$ de [nearest_emperor.GetFirstNameNoTooltip] já surgiram, liderados pelo meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('minamoto_head'))], [minamoto_head.GetTitledFirstName]."
 tgp_japan_decision.9201.t:0 "$tgp_japan_imperial_branch_decision$"
 tgp_japan_decision.9201.taira:0 "Os $dynn_Taira$ d[Select_CString( nearest_emperor.IsFemale, 'a', 'o' )] [nearest_emperor.GetFirstNameNoTooltip] já surgiram, liderados [Select_CString( taira_head.IsFemale, 'pela', 'pelo' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('taira_head'))], [taira_head.GetTitledFirstName]."
 tgp_japan_decision.9301.a:0 "Um sol para guiar a terra."
 tgp_japan_decision.9301.desc:0 "Como Imperador, recuperei meu lugar legítimo como verdadeiro líder deste reino.\n\nMeu poder não é mais manejado por aqueles que buscam alimentar suas próprias ambições, e tudo é restaurado ao Trono de Crisântemo."
 tgp_japan_decision.9301.t:0 "A Gaiola Destrancada"
 tgp_japan_decision.9302.a:0 "Que este seja um retorno à ordem."
 tgp_japan_decision.9302.desc:0 "Palavras se espalham como fogo sobre o retorno do $game_concept_tenno_possessive$. [tenno.GetName] restaurou a presença imperial [tenno.GetHerHim], em nome de revogar o poder das mãos ociosas e de má vontade.\n\n[tenno.GetSheHe|U] agora pretende governar mais diretamente o povo desta terra a partir do Trono de Crisântemo, e seu reinado não será mais visto como mera cerimônia."
 tgp_japan_decision.9302.t:0 "[Select_CString( tenno.IsFemale, 'A', 'O' )] [tenno.GetTitleAsNameNoTooltip] Vitorios[Select_CString( tenno.IsFemale, 'a', 'o' )]"
 tgp_japan_decision.9401.a.toast.failure:0 "Você não entende completamente todo esse processo"
 tgp_japan_decision.9401.a.toast.success:0 "Você consegue compreender a poesia com sucesso"
 tgp_japan_decision.9401.a:0 "Não poupando esforços, eu #EMP entenderei#!"
 tgp_japan_decision.9401.b:0 "Mudei de ideia."
 tgp_japan_decision.9401.desc:0 "Dias intermináveis e noites sem dormir passaram em minha busca pela compreensão da poesia. Folhas de papel voam pelo ar, deixando apenas rabiscos com um rastro de tinta em minha busca pelo conhecimento.\n\nChegou o momento de escolher um caminho a seguir. Vale a pena perseguir isso, ou devo abandonar a busca?"
 tgp_japan_decision.9401.t:0 "Metáforas e Sílabas"
 tgp_japan_decision.9500.a:0 "Eu te recebo, Terra Pura celestial."
 tgp_japan_decision.9500.desc:0 "Com um abraço caloroso, recebo meu recém-encontrado esclarecimento em direção ao renascimento — no qual sou renascido novamente.\n\nDevotarei minha vida a [ROOT.Char.GetFaith.GetName], vivendo meus últimos dias para praticar e pregar as descobertas que encontro ao longo do caminho.\n\nServirei m[Select_CString( ROOT.Char.GetLiege.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLiege.GetTitleAsName], encontrando a harmonia entre nosso patrimônio cultural e sendo guiado pela natureza quando ela decidir que uma nova lição pode ser aprendida."
 tgp_japan_decision.9500.t:0 "Um Novo Caminho de Vida"
 tgp_japan_decision.9603.a.bloc:0 "O [ROOT.Char.GetConfederation.GetName] não tolerará isso."
 tgp_japan_decision.9603.a.tt:0 "Todos os membros de [THIS.Char.GetConfederation.GetName|V] se juntarão à [war|E]"
 tgp_japan_decision.9603.a:0 "O [ROOT.Char.GetHouse.GetBaseNameNoTooltip] não tolerará isso."
 tgp_japan_decision.9603.b:0 "Essa não é nossa luta."
 tgp_japan_decision.9603.desc:0 "A ambição insaciável d[Select_CString( daijo_daijin.IsFemale, 'a', 'o' )] [daijo_daijin.GetTitledFirstName] não conhece limites: [daijo_daijin.GetSheHe] agora promove abertamente reformas que consolidariam o poder da casa [daijo_daijin.GetHerHim] e de seus aliados.\n\nQuaisquer que sejam nossos acordos ou desacordos sobre a governança do Japão, o [daijo_daijin.GetHouse.GetBaseNameNoTooltip] assumindo tal posição dominante deve nos fazer refletir."
 tgp_japan_decision.9603.leader:0 "\n\n[leader.GetTitledFirstName] surgiu como líder da resistência, reunindo os exércitos [leader.GetHerHim] mesmo agora."
 tgp_japan_decision.9603.t:0 "Estabelecer Administração Sōryō: Chamado à Ação"
 tgp_japan_decision.9605.a:0 "Esses rebeldes serão esmagados."
 tgp_japan_decision.9605.b:0 "O reino reconheceu a sabedoria."
 tgp_japan_decision.9605.desc:0 "Enquanto promovo reformas e minhas intenções se tornam claras, os traidores se reúnem. [leader.GetTitledFirstName] de [leader.GetHouse.GetBaseNameNoTooltip] surgiu como líder desta traição, reunindo um exército mesmo agora.\n\nNão importa, nós, [ROOT.Char.GetHouse.GetBaseNameNoTooltip], os encontraremos no campo de batalha, e nós, [ROOT.Char.GetHouse.GetBaseNameNoTooltip], triunfaremos."
 tgp_japan_decision.9605.peace:0 "Enquanto promovo reformas e minhas intenções se tornam claras, apenas o silêncio segue — a esperada reação nunca se materializa. Talvez eu tenha subestimado a fé do reino no [ROOT.Char.GetHouse.GetBaseNameNoTooltip].\n\nSem traidores a enfrentar, o Japão finalmente pode florescer sob uma nova era de governo benevolente sob o [daijo_daijin.GetHouse.GetBaseNameNoTooltip]..."
 tgp_japan_decision.9605.t:0 "Estabelecer Administração Sōryō: Às Armas"
 tgp_japan_decision.9606.a:0 "Inevitável e necessário."
 tgp_japan_decision.9606.desc:0 "Finalmente, as forças rebeldes equivocadas foram derrotadas. Com seu líder, [leader.GetTitledFirstName], apresentado a mim em correntes, poucos podem duvidar que a paz prometida agora está ao nosso alcance.\n\nCom todos os detratores silenciados, o Japão finalmente pode florescer sob uma nova era de governo benevolente sob o [daijo_daijin.GetHouse.GetBaseNameNoTooltip]..."
 tgp_japan_decision.9606.t:0 "Estabelecer Administração Sōryō: Dominância do [daijo_daijin.GetHouse.GetBaseNameNoTooltip]"
 tgp_japan_decision.9607.a:0 "Há muito a se refletir."
 tgp_japan_decision.9607.desc.loser:0 "Este é um dia sombrio para [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTooltip] e para o [ROOT.Char.GetHouse.GetBaseNameNoTooltip]..."
 tgp_japan_decision.9607.desc.other:0 "Esperemos que o [ROOT.Char.GetHouse.GetBaseNameNoTooltip] encontre um lugar digno nesta nova ordem."
 tgp_japan_decision.9607.desc.winner:0 "Nosso serviço leal ao [daijo_daijin.GetHouse.GetBaseNameNoTooltip] nesta justa causa certamente será recompensado."
 tgp_japan_decision.9607.desc:0 "Chocando a capital, [daijo_daijin.GetTitledFirstName] emergiu vitorioso contra aqueles que se opuseram às reformas [daijo_daijin.GetHerHim], agora chamados de rebeldes, levando o reino a uma nova era de dominância do [daijo_daijin.GetHouse.GetBaseNameNoTooltip]."
 tgp_japan_decision.9901.a.scion:0 "Finalmente."
 tgp_japan_decision.9901.a:0 "Será uma honra aconselhar [scion.GetSheHe]."
 tgp_japan_decision.9901.desc:0 "O Ten'nō permanece forte, e o Trono de Crisântemo retorna ao seu legítimo herdeiro. Este governo não é apenas um título nobre ou status, mas reflete a antiga conexão dos Yamato com estas terras."
 tgp_japan_decision.9901.t:0 "Yamato Ten'nō Restaurado"
 tgp_japan_decision.9902.a:0 "Viva o Ten'nō!"
 tgp_japan_decision.9902.desc:0 "A sagrada linhagem Yamato exala sua presença no Palácio Imperial mais uma vez. Um filho de Amaterasu, [scion.GetName], está como herdeiro, assim como nos dias antigos.\n\nCom este retorno à tradição, o reino poderá florescer novamente sob a luz cintilante do Trono de Crisântemo."
 tgp_japan_decision.9911.a:0 "Os antigos caminhos são os melhores caminhos."
 tgp_japan_decision.9911.desc:0 "Chegou o momento de um novo governo, não pela força bruta, mas pela pena.\n\nApenas um governo organizado pode aplicar a justiça, enquanto guerreiros distorcem a lei para seu próprio benefício. Sob meu governo, a lei será clara, justa e firme — como nossos nobres antecessores pretendiam."
 tgp_japan_decision.9911.rebel:0 "\n\nOpondo-se aos caminhos de nossos antecessores, [rebel.GetName] se levanta contra minha decisão. Com seus exércitos reunidos, meu desejo por burocracia é desafiado."
 tgp_japan_decision.9911.t:0 "Burocracia Ritsuryō Restaurada"
 tgp_japan_decision.9912.b:0 "Não cederei meu poder!"
 tgp_japan_decision.9912.desc:0 "[kampaku.GetName] retornou aos caminhos de nossos antecessores, propondo uma burocracia sobre nossa classe guerreira. [kampaku.GetSheHe|U] busca restaurar a ordem dentro do reino, trazendo autoridade ao trono e à corte sobre os clãs locais."
 tgp_japan_decision.9912.rebel:0 "\n\nNo entanto, mudanças tão importantes não vêm sem conflito. [rebel.GetName] se levantou contra [kampaku.GetFirstNameNoTooltip] em protesto, com alguns seguindo os sentimentos [rebel.GetHerHim]..."
 tgp_japan_decision.9913.a:0 "Você não ficará sozinho!"
 tgp_japan_decision.9913.b:0 "Você é o traidor!"
 tgp_japan_decision.9913.desc:0 "[actor.GetTitledFirstName] é um tolo que coloca o próprio engrandecimento acima do bem do império. Não ficarei parado enquanto nosso senhor abusa de seus vassalos leais. Exorto você a juntar-se a mim na luta para depor este tirano."
 tgp_japan_decision.9960.a:0 "...Talvez encontrem sabedoria na próxima vida."
 tgp_japan_decision.9960.agree:0 "\n\nOs senhores locais demonstram grande sabedoria..."
 tgp_japan_decision.9960.b:0 "...e todos cedam ao meu domínio."
 tgp_japan_decision.9960.full_war:0 "\n\nOs senhores locais cobiçam a divisão! Por mais imprudente que seja, eles se juntam à bandeira de [main_defender.GetName] em vez de ceder ao meu domínio."
 tgp_japan_decision.9960.intro:0 "Unificarei [title_scope.GetNameNoTier] sob minha bandeira. Este canto de terra será um bastião de estabilidade e servirá de exemplo para nosso império repleto de caos."
 tgp_japan_decision.9960.partial_war:0 "\n\nEnquanto os senhores locais sábios concordam, alguns poucos tolos se juntam à bandeira de [main_defender.GetName] em vez de ceder ao meu domínio."
 tgp_japan_decision.9960.t:0 "Afirmar Domínio Regional"
 tgp_japan_decision.9961.a:0 "Para onde minha bandeira poderia voar a seguir?"
 tgp_japan_decision.9961.desc:0 "Um dia brilhante para [title_scope.GetNameNoTier]! Alguns demoraram a ver a sabedoria em meu governo, mas um mar de flechas e fogo pode ser um professor diligente.\n\nEm breve esta disputa será esquecida. O sangue dos caídos nutrirá o arroz para as crianças de amanhã. Que nossa demonstração de unidade trace o caminho para todo o império."
 tgp_japan_decision.9961.t:0 "[title_scope.GetNameNoTierNoTooltip] Sob Uma Bandeira"
 tgp_japan_decision.9962.a:0 "E agora?"
 tgp_japan_decision.9962.desc:0 "Minha causa era justa. Não deveria ter havido batalha, mas batalha houve. Na derrota, minha sabedoria não é ouvida. O caos reina. [title_scope.GetName], um espelho para o império.\n\nNós que desejamos harmonia sofremos, e os espiritualmente comprometidos são bem-sucedidos."
 tgp_japan_decision.9962.t:0 "Minha Bandeira Está Quebrada"
 tgp_japan_decision.9963.a.tt:0 "Se [super_soryo.GetShortUIName] vencer a [super_soryo_war.GetName], [super_soryo.GetSheHe] ficará com [title_scope.GetName] e você se tornará [vassal|E] [super_soryo.GetHerHim]"
 tgp_japan_decision.9963.a:0 "Eu me submeto"
 tgp_japan_decision.9963.b:0 "À guerra!"
 tgp_japan_decision.9963.desc:0 "Você testemunhou os conflitos que afligem nosso império. Eu, [super_soryo.GetName], unirei [title_scope.GetName] e construirei um bastião de paz e estabilidade. Submeta-se à minha bandeira ou junte-se aos de mente pequena na loucura de sua resistência."
 tgp_japan_decision.9963.opening:0 "[ROOT.Char.GetName], minha bandeira chama,"
 will_found_noble_family_tt:0 "Você se tornará chefe de uma nova [noble_family|E]"
