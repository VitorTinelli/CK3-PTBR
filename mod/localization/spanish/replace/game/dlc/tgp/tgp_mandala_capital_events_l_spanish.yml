 mandala_destruction_aspect_statues_modifier_desc:0 "A cabeça feroz do Aspecto da Destruição, incutindo medo em seus inimigos e determinação em seus aliados."
 mandala_divine_barays_defense_modifier:0 "$great_project_type_mandala_capital_05_contribution_divine_barays$"
 mandala_divine_barays_defense_modifier_desc:0 "Esses barays divinos, além de promoverem a espiritualidade, também ajudam a manter afastados os forasteiros e seus semelhantes."
 mandala_divine_statues_province_modifier:0 "$great_project_type_mandala_capital_03_contribution_divine_statues$"
 mandala_divine_statues_province_modifier_desc:0 "Estátuas divinas nos terrenos do templo local atraem inúmeros fiéis."
 mandala_forest_of_bunga_mas_modifier:0 "$great_project_type_mandala_capital_05_contribution_bunga_mas_forest$"
 mandala_forest_of_bunga_mas_modifier_desc:0 "Uma impressionante floresta dourada, que conta a história de uma renomada dinastia Mandala."
 mandala_gilded_domes_dynasty_modifier:0 "$great_project_type_mandala_capital_03_contribution_gilded_domes$"
 mandala_gilded_domes_dynasty_modifier_desc:0 "As cúpulas douradas contribuídas para seu $building_type_mandala_capital_01$ são uma das maiores realizações desta dinastia."
 mandala_gilded_shrines_province_modifier:0 "$great_project_type_mandala_capital_04_contribution_gilded_shrines$"
 mandala_gilded_shrines_province_modifier_desc:0 "Os santuários dourados locais proporcionam uma medida igual de opulência e ressonância espiritual."
 mandala_ornate_reliefs_tax_modifier:0 "Imposto Turístico"
 mandala_ornate_reliefs_tax_modifier_desc:0 "Este personagem está colhendo as recompensas dos relevos ornamentados anteriormente contribuídos para um $building_mandala_capital_01$."
 mandala_ornate_reliefs_tax_province_modifier:0 "Relevos Ornamentados"
 mandala_ornate_reliefs_tax_province_modifier_desc:0 "Esses relevos, cuidadosamente esculpidos e retratando histórias divinas, atraem visitantes de perto e de longe."
 mandala_sanctified_domes_dynasty_modifier:0 "$great_project_type_mandala_capital_01_contribution_sanctified_domes$"
 mandala_sanctified_domes_dynasty_modifier_desc:0 "A dinastia que teve recursos suficientes para contribuir com essas majestosas cúpulas sagradas também recebeu sua bênção e devoção."
 mandala_serenity_aspect_statues_modifier:0 "$great_project_type_mandala_capital_03_contribution_serenity_aspect$"
 mandala_serenity_aspect_statues_modifier_desc:0 "A cabeça tranquila do Aspecto da Serenidade, inspirando os cidadãos a serem mais tolerantes e a promoverem soluções pacíficas."
 mandala_shallow_pools_defense_modifier:0 "$great_project_type_mandala_capital_02_contribution_shallow_pools$"
 mandala_shallow_pools_defense_modifier_desc:0 "As piscinas rasas do $building_type_mandala_capital_01$ local preenchem sua alma e também impedem seus inimigos."
 mandala_strong_workers_modifier:0 "Trabalhadores Fortes"
 mandala_strong_workers_modifier_desc:0 "Este personagem possui trabalhadores que recentemente ganharam força ao trabalhar em um $building_type_mandala_capital_01$."
 mandala_trickery_aspect_statues_modifier:0 "$great_project_type_mandala_capital_03_contribution_trickery_aspect$"
 mandala_trickery_aspect_statues_modifier_desc:0 "A cabeça sorridente do Aspecto da Trapaça, despertando incerteza e curiosidade quanto à sua verdadeira natureza."
 tgp_east_asia_mandala_capital_events.1000.a.final:0 "Vamos inspecionar os adornos de um #EMP deus#!."
 tgp_east_asia_mandala_capital_events.1000.a.fourth:0 "Este é o meu #EMP verdadeiro#! propósito."
 tgp_east_asia_mandala_capital_events.1000.a.second:0 "A transcendência me aguarda!"
 tgp_east_asia_mandala_capital_events.1000.a.third:0 "Agora estamos chegando lá..."
 tgp_east_asia_mandala_capital_events.1000.a:0 "Um ser divino em formação."
 tgp_east_asia_mandala_capital_events.1000.desc.final:0 "A pedra final foi finalmente colocada em meu complexo em [project_location.GetNameNoTooltip].\n\nO palácio do templo aguarda. Permito-me um momento de pura alegria e admiração enquanto observo as torres transcendentais, os arcos e os [Glossary( 'barays', 'BARAY_GLOSS' )]. O templo está repleto de um esplendor sobrenatural.\n\nAo meu redor, as pessoas comemoram e dançam, celebrando uma de minhas maiores conquistas — uma que será lembrada por eras."
 tgp_east_asia_mandala_capital_events.1000.desc.fourth:0 "Enquanto o sol nasce sobre o complexo do templo, as piscinas refletem a luz em magnificência divina.\n\nObservo o templo, agora completo com amplas áreas de água e um pequeno relicário, reunindo as mais requintadas relíquias.\n\nLentamente, aceno com a cabeça — sim, é aqui que devo estar. É isso que devo fazer. Meus seguidores precisam de mim; estou aqui para guiar seu caminho, e em troca eles construíram para mim este esplêndido templo. Realizaremos grandes feitos, #EMP juntos.#!"
 tgp_east_asia_mandala_capital_events.1000.desc.second:0 "O templo se expandiu, agora abrigando mais santuários e ornamentos — todos cuidadosamente construídos, todos refletindo reverência a #EMP mim#!.\n\nMeus servos pairam ao meu redor como sombras enquanto caminho pelo templo, observando cada canto e encontrando meus seguidores pelo caminho. Sinto meu poder crescer a cada cabeça inclinada e olhar respeitosamente desviado.\n\nEste é o #EMP meu#! momento."
 tgp_east_asia_mandala_capital_events.1000.desc.third:0 "O templo, agora expandido em um complexo maior, fervilha de agitação. Agora há espaço para abrigar dezenas de viajantes distantes, bem como clérigos locais. O culto diário nunca cessa.\n\nOs viajantes — aqui para me ver. Os clérigos — aqui para me adorar.\n\nAs multidões diligentemente abrem caminho para que eu passe, e faço uma breve pausa para tocar algumas cabeças inclinadas ao longo de meu trajeto. Meu povo. Meus seguidores. Minha divindade."
 tgp_east_asia_mandala_capital_events.1000.desc:0 "Enquanto observo o templo, os trabalhadores, agora livres de suas obrigações, se dispersam. Eles deixam para trás uma sólida estrutura de pedra, surgindo do solo — uma manifestação de nosso fervor.\n\nInclino levemente a cabeça para seguir as torres enquanto se estendem em direção ao céu.\n\nSim, sim, isto servirá. Serei o glorioso devaraja, governando sobre este templo e provando meu valor."
 tgp_east_asia_mandala_capital_events.1000.t.base:0 "Capital"
 tgp_east_asia_mandala_capital_events.1000.t.final:0 "$tgp_east_asia_mandala_capital_events.1000.t.base$: o $building_mandala_capital_05$"
 tgp_east_asia_mandala_capital_events.1000.t.fourth:0 "$tgp_east_asia_mandala_capital_events.1000.t.base$: o $building_mandala_capital_04$"
 tgp_east_asia_mandala_capital_events.1000.t.second:0 "$tgp_east_asia_mandala_capital_events.1000.t.base$: o $building_mandala_capital_02$"
 tgp_east_asia_mandala_capital_events.1000.t.third:0 "$tgp_east_asia_mandala_capital_events.1000.t.base$: o $building_mandala_capital_03$"
 tgp_east_asia_mandala_capital_events.1000.t:0 "$tgp_east_asia_mandala_capital_events.1000.t.base$: o $building_mandala_capital_01$"
 tgp_east_asia_mandala_capital_events.1010.a:0 "Envie meus cumprimentos."
 tgp_east_asia_mandala_capital_events.1010.desc:0 "O emissário [Select_CString( overlord_scope.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', overlord_scope)], [overlord_scope.GetTitledFirstName], chega até mim nas primeiras horas da manhã: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! A grandiosa capital do templo em [project_location.GetNameNoTooltip] finalmente foi concluída!\"\n\n\"[Select_CString( overlord_scope.IsFemale, 'Nossa generosa', 'Nosso generoso' )] [overlord_scope.GetTitleAsNameNoTooltip] enviou-me aqui para demonstrar sua gratidão por suas contribuições generosas para essa causa!\" Os olhos [Select_CString( envoy.IsFemale, 'da', 'do' )] [envoy.GetWomanMan] brilham com fervor apaixonado enquanto [envoy.GetSheHe] descreve a visão das torres transcendentes, arcos e [Glossary( 'barays', 'BARAY_GLOSS' )] que conferem ao templo um esplendor de outro mundo.\n\nEu murmuro e aceno, satisfeito com minha contribuição para a causa..."
 tgp_east_asia_mandala_capital_events.1010.t:0 "Recompensas Capitais"
