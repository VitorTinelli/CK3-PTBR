l_spanish:
 tgp_ceremonial_liege_events.0001.a_liege:0 "Lembre-os de quem realmente governa."
 tgp_ceremonial_liege_events.0001.a_regent:0 "Isso precisa ser corrigido antes que [opposing_power.GetFirstNameNoTooltip] veja."
 tgp_ceremonial_liege_events.0001.b:0 "Deixe como está. Que mal há na aparência?"
 tgp_ceremonial_liege_events.0001.b_a:0 "As instruções afirmam sua autoridade"
 tgp_ceremonial_liege_events.0001.b_b:0 "O incidente é esquecido"
 tgp_ceremonial_liege_events.0001.b_c:0 "[opposing_power.GetNameNoTooltip] ganha mais poder"
 tgp_ceremonial_liege_events.0001.desc:0 "[councillor.GetName] enviou, por engano, instruções que carregam tanto o meu selo quanto o de [opposing_power.GetNamePossessive]. \"Foi um erro honesto,\" implora [councillor.GetSheHe]. \"Mas você sabe o quão rápido mentiras e fofocas se espalham pela corte...\"\n\nRevogá-las pode ser bastante caro, mas declará-las publicamente como um erro seria extremamente embaraçoso."
 tgp_ceremonial_liege_events.0001.t:0 "Selo da Confusão"
 tgp_ceremonial_liege_events.0010.a:0 "Você tem razão, não posso fazer isso sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 tgp_ceremonial_liege_events.0010.b:0 "Não, não, apenas me mostrarei menos na corte."
 tgp_ceremonial_liege_events.0010.b_a:0 "O isolamento ajuda bastante"
 tgp_ceremonial_liege_events.0010.b_b:0 "O isolamento não ajuda muito"
 tgp_ceremonial_liege_events.0010.c:0 "De jeito nenhum! Eu sou [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] soberan[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] deste reino."
 tgp_ceremonial_liege_events.0010.d:0 "[opposing_power.GetSheHe|U] mandou você dizer isso, não foi, [opposing_power.GetSheHe]?"
 tgp_ceremonial_liege_events.0010.d_desc:0 "Você acusa [spouse.GetFirstNameNoTooltip] de conspirar com [opposing_power.GetFirstNameNoTooltip]"
 tgp_ceremonial_liege_events.0010.desc:0 "\"Meu amor!\" exclama [spouse.GetName], entrando em nossos aposentos. \"Sua pele está tão pálida, temo por você.\"\n\nA preocupação de [spouse.GetFirstNamePossessiveNoTooltip] é justificada. As horas de cada dia se alongam, e o fardo da coroa pesa cada vez mais sobre mim.\n\n\"Se está tão sobrecarregado(a), talvez [opposing_power.GetName] pudesse governar em seu lugar, temporariamente,\" sugere [spouse.GetFirstNameNoTooltip]."
 tgp_ceremonial_liege_events.0010.t:0 "O Verdadeiro Peso"
 tgp_ceremonial_liege_events.0010.tt.failure:0 "Sua acusação se prova falsa"
 tgp_ceremonial_liege_events.0010.tt.success:0 "Você encontra provas reais da traição [spouse.GetHerHim]"
 tgp_ceremonial_liege_events.0020.a:0 "Talvez seja hora de realizar minha própria [opposing_power.GetInvolvedActivity.GetShortNameNoTooltip|l]."
 tgp_ceremonial_liege_events.0020.a_desc:0 "Você tenta ofuscar [opposing_power.GetFirstNameNoTooltip] com sua própira [activity|E]:\n$BULLET$Você receberá um desconto de #P 15%#! para realizar sua própria [opposing_power.GetInvolvedActivity.GetShortNameNoTooltip|l]\n$BULLET$Se sua próxima [opposing_power.GetInvolvedActivity.GetShortNameNoTooltip|l] for bem-sucedida, você ganhará [prestige|E], e [opposing_power.GetFirstNameNoTooltip] perderá um pouco"
 tgp_ceremonial_liege_events.0020.b.tt.desc:0 "Você tenta minar a autoridade de [opposing_power.GetFirstNamePossessiveNoTooltip]"
 tgp_ceremonial_liege_events.0020.b.tt.failure:0 "Sua interferência apenas causa mais conflito"
 tgp_ceremonial_liege_events.0020.b.tt.success:0 "Você consegue ganhar poder sobre [opposing_power.GetFirstNameNoTooltip]"
 tgp_ceremonial_liege_events.0020.b:0 "Tenho certeza de que [opposing_power.GetFirstNameNoTooltip] não se importará se eu fizer algumas mudanças..."
 tgp_ceremonial_liege_events.0020.c:0 "Envie a [opposing_power.GetSheHe] meus melhores votos."
 tgp_ceremonial_liege_events.0020.desc:0 "[opposing_power.GetName] está ocupad[Select_CString( opposing_power.IsFemale, 'a', 'o' )] com uma [opposing_power.GetInvolvedActivity.GetShortNameNoTooltip|l], aparentemente uma para a qual eu não fui convidado(a)! Enquanto [opposing_power.GetSheHe]"
 tgp_ceremonial_liege_events.0020.desc_end:0 "eu continuo pres[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] aos meus deveres.\n\nEmbora a situação pudesse ser pior, uma oportunidade se apresenta..."
 tgp_ceremonial_liege_events.0020.desc_feast:0 "bebe a noite toda, compartilhando histórias com familiares e amigos,"
 tgp_ceremonial_liege_events.0020.desc_festival:0 "exibe sua autoridade com um festival,"
 tgp_ceremonial_liege_events.0020.desc_hunt:0 "desfruta da emoção de uma caçada,"
 tgp_ceremonial_liege_events.0020.desc_pilgrimage:0 "se aproxima de [opposing_power.GetFaith.HighGodName] em suas viagens,"
 tgp_ceremonial_liege_events.0020.t:0 "Uma [opposing_power.GetInvolvedActivity.GetShortNameNoTooltip] Cerimonial"
 tgp_ceremonial_liege_events.0030.a:0 "Excelente trabalho!"
 tgp_ceremonial_liege_events.0030.b:0 "Mude suas palavras, [scholar.GetFirstNameNoTooltip]."
 tgp_ceremonial_liege_events.0030.b_desc:0 "Você tenta orientar [scholar.GetFirstNameNoTooltip] sobre como escrever um memorial melhor"
 tgp_ceremonial_liege_events.0030.c_liege:0 "Cuidado com a língua..."
 tgp_ceremonial_liege_events.0030.c_regent:0 "Não fale mal de mim, tol[Select_CString( scholar.IsFemale, 'a', 'o' )]!"
 tgp_ceremonial_liege_events.0030.c_tt:0 "Você repreende o trabalho de [scholar.GetFirstNamePossessiveNoTooltip]"
 tgp_ceremonial_liege_events.0030.desc:0 "[scholar.GetName] apresenta um memorial bem escrito sobre a história de [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveName].\n\nNo memorial,"
 tgp_ceremonial_liege_events.0030.liege:0 "Sou mencionad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com frequência e em detalhes, com [scholar.GetFirstNameNoTooltip] certificando-se de incluir informações sobre minha casa, [ROOT.Char.GetHouse.GetName].\n\nO que realmente chamou minha atenção foi quando fui descrito(a) como [ROOT.Char.Custom('ComplimentAdjective')], e [opposing_power.GetFirstNameNoTooltip] como bastante [opposing_power.Custom('InsultAdjective')]..."
 tgp_ceremonial_liege_events.0030.regent:0 "[opposing_power.GetFirstName] é mencionad[Select_CString( opposing_power.IsFemale, 'a', 'o' )] com frequência e em detalhes, com [scholar.GetFirstNameNoTooltip] certificando-se de incluir informações sobre a casa de [opposing_power.GetFirstNamePossessiveNoTooltip], [opposing_power.GetHouse.GetName].\n\nO problema é evidente quando sou descrit[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] como [ROOT.Char.Custom('InsultAdjective')], e [opposing_power.GetFirstNameNoTooltip] como bastante [ROOT.Char.Custom('ComplimentAdjective')]..."
 tgp_ceremonial_liege_events.0030.t:0 "Um Memorial de Erudito"
 tgp_ceremonial_liege_events.0030.tt.failure:0 "Você piora a situação"
 tgp_ceremonial_liege_events.0030.tt.success:0 "[scholar.GetFirstNameNoTooltip] corrige seus erros"
 tgp_ceremonial_liege_events.0040.a:0 "É tudo apenas por aparências, m[Select_CString( inquirer.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', inquirer)]..."
 tgp_ceremonial_liege_events.0040.a_desc:0 "Você tenta dizer a [inquirer.GetSheHe] que tudo é uma fachada"
 tgp_ceremonial_liege_events.0040.b:0 "Há uma razão para tudo."
 tgp_ceremonial_liege_events.0040.b_desc:0 "Você explica [Select_CString( inquirer.IsFemale, 'a', 'ao' )] [inquirer.GetFirstNameNoTooltip] o propósito do papel de [opposing_power.GetFirstNamePossessiveNoTooltip]."
 tgp_ceremonial_liege_events.0040.desc:0 "\"Com licença, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [inquirer.Custom2('RelationToMeShort', ROOT.Char)].\" [inquirer.GetName] sussurra suavemente, enquanto se aproxima de mim.\n\n\"Tenho refletido sobre isso há algum tempo e, perdoe-me se for inadequado,\" [inquirer.GetSheHe|U] diz. \"Mas por que não se livra de [opposing_power.GetFirstName]? Parece inadequado que um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] seja o marionetista de um mero [opposing_power.GetTitleAsNameNoTooltip]!\""
 tgp_ceremonial_liege_events.0040.t:0 "Fachada... Por Enquanto"
 tgp_ceremonial_liege_events.0040.tt.failure:0 "[inquirer.GetSheHe|U] sabe que você está mentindo"
 tgp_ceremonial_liege_events.0040.tt.success:0 "Você convence [inquirer.GetSheHe]"
 tgp_ceremonial_liege_events_0020_discount_desc:0 "Realizando em Retaliação"
 tgp_power_undermined_modifier_tt:0 "[GetModifier('tgp_power_undermined_modifier').GetNameWithTooltip]: #P +25#!"
