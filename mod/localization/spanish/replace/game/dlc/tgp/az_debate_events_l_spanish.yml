l_spanish:
 CONFUCIAN_DAO:0 "Refere-se ao Dao — o caminho moral e a ordem cósmica ensinada pelos sábios. É tanto um guia para a conduta correta quanto a base da harmonia entre Céu, Terra e humanidade."
 CONFUCIAN_LI:0 "Refere-se à propriedade ritual e à observância das formas adequadas, que mantêm a harmonia na sociedade e refletem a virtude interior."
 az_debate.0001.a.failure:0 "Exagero em minhas refutações"
 az_debate.0001.a.success:0 "A sagacidade supera [rival_elder.GetFirstNamePossessiveNoTooltip]"
 az_debate.0001.a:0 "Desafiar [rival_elder.GetHerHim] publicamente."
 az_debate.0001.b.failure:0 "Minhas investidas não têm efeito"
 az_debate.0001.b.success:0 "[disciple_candidate.GetFirstNameNoTooltip] aceita meu convite"
 az_debate.0001.b:0 "Oferecer mentoria em privado."
 az_debate.0001.d:0 "Melhor deixar passar esta oportunidade."
 az_debate.0001.desc:0 "Do outro lado do salão, [rival_elder.Custom2('MyCharacterIntroduction', ROOT.Char)] se inclina em direção a [disciple_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)]. \"Sob minha orientação, disciplina e lealdade são os pilares da verdadeira maestria,\" proclama [rival_elder.GetTitledFirstNameNoTooltip], voz rica de orgulho.\n\n\"É claro, ancião,\" responde [disciple_candidate.GetTitledFirstNameNoTooltip], embora os olhos [disciple_candidate.GetHerHim] se desviem para mim. \"E quanto a novas ideias, testadas em competição aberta?\" Percebo um leve sorriso nos lábios [disciple_candidate.GetHerHim]. A agudeza no tom [disciple_candidate.GetHerHim] é um vislumbre de inquietação e talvez, uma abertura."
 az_debate.0001.t:0 "Um Discípulo que Vale a Pena"
 az_debate.0002.a.failure:0 "Falto ao argumento"
 az_debate.0002.a.success:0 "Meu raciocínio convence"
 az_debate.0002.a:0 "Impressionar com um argumento perfeito."
 az_debate.0002.c.failure:0 "Chego até [elder_candidate.GetSheHe] tarde demais"
 az_debate.0002.c.success:0 "Me movo pela multidão como uma sombra"
 az_debate.0002.c:0 "Garantir sua atenção antes que outros percebam."
 az_debate.0002.d:0 "Deixar o momento passar."
 az_debate.0002.desc:0 "A notícia se espalha rapidamente pelo salão: [elder_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)] chegou.\n\n\"Não vou me demorar,\" diz o Ancião, voz calma, porém penetrante.\n\n[audience_rep.GetFirstNameNoTooltip] se inclina para mim, falando com urgência sussurrada: \"Se você tem algo a dizer, diga agora, antes que os outros empurrem [elder_candidate.GetHerHim] para fora.\""
 az_debate.0002.t:0 "Um Momento com o Ancião"
 az_debate.0003.a:0 "\"Siga-me e eu lhe mostrarei.\""
 az_debate.0003.b.failure:0 "O significado se perde"
 az_debate.0003.b.success:0 "A lição fica clara"
 az_debate.0003.b:0 "\"Ouça bem: a verdade está nas parábolas e provérbios.\""
 az_debate.0003.c:0 "\"Deixe o poder do [my_movement.GetNameNoTooltip] mostrar meu valor.\""
 az_debate.0003.d:0 "\"Encontraremos a resposta através do [ROOT.Char.GetFaith.ReligiousText|U].\""
 az_debate.0003.desc:0 "[disciple_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)|U] avança, olhos brilhando com desafio. \"Se um governante deve escolher entre cumprir uma promessa que prejudicará o reino, ou quebrá-la para salvar seu povo, qual é o caminho justo?\"\n\nNão é apenas uma reflexão ociosa, mas um teste, destinado a medir meu valor."
 az_debate.0003.t:0 "O Dilema"
 az_debate.0004.a:0 "\"A própria razão provará a força do que defendo.\""
 az_debate.0004.b:0 "\"Sua sagacidade se perde lá fora. Caminhe comigo, em vez disso.\""
 az_debate.0004.c.failure:0 "A abordagem sutil falha"
 az_debate.0004.c.success:0 "[freethinker_friend.GetFirstNameNoTooltip] se aquece com sua companhia"
 az_debate.0004.c:0 "\"Discutamos isso sobre [ROOT.Char.Custom('GetExpensiveDrink')].\""
 az_debate.0004.d:0 "\"Então fale livremente e siga seu próprio caminho.\""
 az_debate.0004.desc:0 "Avisto um pequeno grupo em círculo fechado, suas risadas afiadas e desdenhosas. Um deles, [freethinker_friend.Custom2('MyCharacterIntroduction', ROOT.Char)], se inclina para mim com um sorriso astuto.\n\n\"Então diga-nos, [ROOT.Char.GetFirstNameNoTooltip], por que deveríamos nos curvar ao seu movimento? Não temos gosto por bandeiras nem paciência para mestres.\""
 az_debate.0004.t:0 "Um Coro de Dúvidas"
 az_debate.0005.a.failure:0 "Você falha em impressionar [elder_candidate.GetFirstNameNoTooltip]"
 az_debate.0005.a.success:0 "Você impressiona [elder_candidate.GetFirstNameNoTooltip]"
 az_debate.0005.a:0 "\"Estou pronto para provar meu valor.\""
 az_debate.0005.b.tt:0 "Seu [learning|E] não é alto o suficiente e você não é [GetTrait('confucian_education').GetName(ROOT.Char)]"
 az_debate.0005.b:0 "\"Deixe-me trabalhar em seu tratado final.\""
 az_debate.0005.c:0 "\"Não me interporei no caminho.\""
 az_debate.0005.desc:0 "[elder_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)|U] acaricia o queixo pensativamente, olhos alternando entre mim e [rival_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n\"Este pode ser o último discípulo que aceito,\" diz [elder_candidate.GetSheHe] com gravidade. \"Algum de vocês pode me convencer de que é digno?\"\n\n[rival_candidate.GetFirstNameNoTooltip] cruza os braços, sorrindo. \"Não vou perder esta chance.\""
 az_debate.0005.t:0 "A Última Escolha do Ancião"
 az_debate.0006.a:0 "\"Aceitarei a orientação de [new_elder.GetFirstNameNoTooltip].\""
 az_debate.0006.b:0 "\"Seus ensinamentos são suficientes.\""
 az_debate.0006.c.failure:0 "[new_elder.GetFirstNameNoTooltip] se endurece, ofendid[Select_CString( new_elder.IsFemale, 'a', 'o' )]"
 az_debate.0006.c.success:0 "Ambos os anciãos acenam, impressionados"
 az_debate.0006.c:0 "\"Por que a sabedoria deveria se restringir a uma voz?\""
 az_debate.0006.desc:0 "Com olhar ponderado, [current_elder.Custom2('MyCharacterIntroduction', ROOT.Char)] fala suavemente:\n\n\"Você aprendeu tudo o que posso transmitir, [ROOT.Char.GetFirstNameNoTooltip]. Meus ensinamentos se esgotaram, minha lâmpada de sabedoria quase apagada. Mas não se sinta abandonado. Há um cuja visão brilha ainda mais — [new_elder.Custom2('MyCharacterIntroduction', ROOT.Char)].\"\n\nO ancião inclina a cabeça em direção à figura venerável, presença [new_elder.GetHerHim] solene e expectante. \"Se desejar, confiá-lo-ei aos cuidados [new_elder.GetHerHim]. Ou talvez seu caminho siga por outra rota?\"\n\nDiz-se que seguir a cadeia de transmissão é honrar o que os antigos chamavam de [Glossary('dao', 'CONFUCIAN_DAO')]."
 az_debate.0006.t:0 "A Última Lição"
 az_debate.0007.a:0 "\"Não se deixe definir pelo temperamento alheio.\""
 az_debate.0007.b.failure:0 "Minhas palavras tropeçam"
 az_debate.0007.b.success:0 "O discípulo aceita prontamente"
 az_debate.0007.b:0 "\"Conte-me o que [rival_elder.GetSheHe] fez.\""
 az_debate.0007.c:0 "\"Por favor, vamos falar sobre harmonia.\""
 az_debate.0007.desc:0 "\"Você ao menos se ouve?\" [rival_elder.Custom2('MyCharacterIntroduction', ROOT.Char)] dispara, voz cortando o salão. \"Uma criança poderia recitar os clássicos com mais senso!\"\n\nAs palavras caem como golpes sobre [disciple_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)], discípul[Select_CString( disciple_candidate.IsFemale, 'a', 'o' )] [rival_elder.GetHerHim]. Os escribas vacilam a meio traço, tinta formando gotas nos pincéis. [disciple_candidate.GetSheHe|U] baixa o olhar, bochechas coradas, ombros rígidos como se se preparasse para a chuva."
 az_debate.0007.t:0 "Uma Repreensão Diante de Todos"
 az_debate.0008.a:0 "\"Considere a harmonia que o [my_movement.GetNameNoTooltip] oferece.\""
 az_debate.0008.b.failure:0 "Eles assentem, não impressionados"
 az_debate.0008.b.success:0 "Deixo-os sem palavras"
 az_debate.0008.b:0 "\"Pesemos os próprios Clássicos.\""
 az_debate.0008.c:0 "\"Venha, [neutral_scholar.GetTitledHouseNameOrFirstName], e lhe mostrarei a verdadeira virtude.\""
 az_debate.0008.d.flavor:0 "... e refrescar-me sob esta sombra."
 az_debate.0008.d:0 "\"Prefiro não interferir...\""
 az_debate.0008.desc:0 "No canto sombreado do salão, observo [neutral_scholar.Custom2('MyCharacterIntroduction', ROOT.Char)] trocando palavras corteses com [rival_leader.Custom2('MyCharacterIntroduction', ROOT.Char)], membro do [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey('undecided_movement').GetName].\n\n\"O [rival_movement.GetName] cultiva a virtude através da disciplina,\" insiste [rival_leader.GetTitledHouseNameOrFirstName], palmas abertas em confiança calma. \"E ainda assim,\" intervém suavemente [neutral_scholar.GetTitledHouseNameOrFirstName], \"pode a disciplina sozinha nutrir a harmonia sem compaixão?\" A testa do defensor do [rival_movement.GetNameNoTooltip] se franzida."
 az_debate.0008.t:0 "Encruzilhada Acadêmica"
 az_debate.0009.a:0 "\"Não são as palavras, mas a intenção que importa.\""
 az_debate.0009.b:0 "Redirecione o salão com uma anedota cortês."
 az_debate.0009.d:0 "\"Venha, [errant_disciple.GetFirstNameNoTooltip], vamos a outro lugar.\""
 az_debate.0009.desc:0 "Levantando-se com confiança, [errant_disciple.Custom2('MyCharacterIntroduction', ROOT.Char)] limpa a garganta. \"O [Glossary('Mestre', 'CONFUCIUS_GLOSS')] disse: 'Se um governante governa pelo [Glossary('ritual', 'CONFUCIAN_LI')], é como a Estrela do Norte, e todas as estrelas se curvarão diante dela!'\"\n\nUm leve riso percorre o salão. [stickler_scholar.Custom2('MyCharacterIntroduction', ROOT.Char)] inclina a cabeça, voz suave como seda: \"Curioso... mas os Analectos não falam de ritual, e sim de [Glossary('virtue', 'CONFUCIAN_DE')]. É a virtude que mantém as estrelas no lugar, não a cerimônia.\""
 az_debate.0009.t:0 "Um Passo em Falso no Salão"
 az_debate.0010.a:0 "\"Uma clara zombaria de noss[Select_CString( ROOT.Char.GetLiege.IsFemale, 'a', 'o' )] [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]!\""
 az_debate.0010.b:0 "Buscarei o conselho [poet.GetHerHim] em particular."
 az_debate.0010.c:0 "\"Ora, é apenas arte!\""
 az_debate.0010.desc:0 "Observo [poet.Custom2('MyCharacterIntroduction', ROOT.Char)] recitar o último verso de seu poema: \"Um tronco torto se ergue ao céu, suas raízes fundas, seus galhos pesados de sombra.\"\n\nUm murmúrio de aprovação vem da plateia.\n\n[critic.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se inclina, sussurrando ao meu ouvido: \"O poema de [poet.GetFirstNamePossessiveNoTooltip] não é uma simples imagem. Sugere que [Select_CString( ROOT.Char.GetTopLiege.IsFemale, 'a', 'o' )] [ROOT.Char.GetTopLiege.GetTitleAsName] se desvia do Mandato do Céu, que a decadência apodrece em silêncio...\""
 az_debate.0010.t:0 "Um Poema Espinhoso"
 az_debate.0011.a:0 "Talvez [observed_elder.GetSheHe] pudesse me ensinar mais?"
 az_debate.0011.b:0 "\"Uma lição importante.\""
 az_debate.0011.c:0 "\"Um claro endosso ao [GetPlayer.Custom('GetMyMovementShort')]!\""
 az_debate.0011.desc:0 "A disputa se desenrola em cadência deliberada, cada palavra de [observed_elder.Custom2('MyCharacterIntroduction', ROOT.Char)] soando como o toque ritmado de um sino de templo.\n\n\"Os ritos são os ossos do reino; sem eles, a virtude desaba. Ignorar os clássicos é convidar o caos, é fazer crescer ervas daninhas onde deveria haver grãos.\""
 az_debate.0011.t:0 "Observando o Ancião"
 tgp_subtle_counsel_modifier:0 "Conselho Sutil"
 tgp_subtle_counsel_modifier_desc:0 "Este personagem busca conselho de um especialista em sutileza."
