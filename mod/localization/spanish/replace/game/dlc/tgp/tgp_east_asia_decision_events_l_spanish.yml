l_spanish:
 all_tribal_holdings_will_change_to_citadels:0 "Todas as [tribal_holdings|E] no reino se tornarão [temple_citadel_holdings|E]"
 bunga_mas:0 "As Flores Douradas de [ROOT.Char.GetLiege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]"
 common_bunga_mas_desc.tt:0 "Ao entregar ao Suserano:\n$BULLET_WITH_TAB$Receba (#V 1#!) acúmulo de [GetModifier('bunga_mas_tribute_modifier').GetNameWithTooltip]"
 common_bunga_mas_desc:0 "Um [Glossary( 'bunga mas', 'BUNGA_MAS_GLOSS' )] comum, feito de ouro e prata. As flores, em plena floração perpétua, refletem a luz de maneira esplêndida."
 failed_assimilation_payout_msg:0 "Falha na Divindade Mandala"
 failed_assimilation_payout_msg_desc:0 "Você ou seu Devaraja prometido [saved_devaraja.GetShortUIName] não corresponderam à divindade Mandala"
 famed_bunga_mas_desc.tt:0 "Ao entregar ao Suserano:\n$BULLET_WITH_TAB$Receba (#V 2#!) acúmulos de [GetModifier('bunga_mas_tribute_modifier').GetNameWithTooltip]"
 famed_bunga_mas_desc:0 "Flores magistralmente trabalhadas; sutis entalhes nos galhos. Uma árvore [Glossary( 'bunga mas', 'BUNGA_MAS_GLOSS' )] de ouro e prata que não deixará ninguém indiferente."
 illustrious_bunga_mas_desc.tt:0 "Ao entregar ao Suserano:\n$BULLET_WITH_TAB$Receba (#V 3#!) acúmulos de [GetModifier('bunga_mas_tribute_modifier').GetNameWithTooltip]"
 illustrious_bunga_mas_desc:0 "Estas árvores [Glossary( 'bunga mas', 'BUNGA_MAS_GLOSS' )] douradas e prateadas são um deleite de se contemplar. O refinamento nos entalhes; o toque delicado nas folhas. É como se uma árvore viva tivesse sido submersa em metal precioso."
 invite_a_court_brahmin_decision:0 "Procurar um $court_brahmin_court_position$"
 invite_a_court_brahmin_decision_desc:0 "Um brahmim de corte é um aliado poderoso. Ele cuidará das relações tributárias e será uma bússola moral em tempos difíceis."
 invite_a_court_brahmin_decision_tooltip:0 "Seus servos sugerirão diversos candidatos adequados para a posição de [GetCourtPositionType('court_brahmin_court_position').GetName()]"
 invite_a_khlon_glan_decision:0 "Procurar um $khlon_glan_court_position$"
 invite_a_khlon_glan_decision_desc:0 "É hora de encontrar um khlon glan apropriado para auxiliar no desenvolvimento da capital, controlar nossos territórios e organizar minha corte."
 invite_a_khlon_glan_decision_tooltip:0 "Seus servos sugerirão diversos candidatos adequados para a posição de [GetCourtPositionType('khlon_glan_court_position').GetName()]"
 masterwork_bunga_mas_desc.tt:0 "Ao entregar ao Suserano:\n$BULLET_WITH_TAB$Receba até (#V 2#!) acúmulos de [GetModifier('bunga_mas_tribute_modifier').GetNameWithTooltip]"
 masterwork_bunga_mas_desc:0 "Um refinado [Glossary( 'bunga mas', 'BUNGA_MAS_GLOSS' )] de ouro e prata. Detalhes minuciosos e intrincados se entrelaçam nas folhas frágeis, quase translúcidas em sua delicadeza."
 realm_capital_will_change_to_castle:0 "A [holding|E] da [realm_capital|E] se tornará um [castle_holding|E]"
 realm_capital_will_change_to_citadel:0 "A [holding|E] da [realm_capital|E] se tornará um [temple_citadel_holding|E]"
 tgp_east_asia_decision_events.0010.a:0 "Que #EMP isto#! seja meu primeiro decreto."
 tgp_east_asia_decision_events.0010.b:0 "A posse em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] não é digna de um templo, #EMP ainda#!..."
 tgp_east_asia_decision_events.0010.b_temple_citadel:0 "Meu templo já está muito bem em pé em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]!"
 tgp_east_asia_decision_events.0010.desc:0 "Às vezes, a iluminação vem das fontes mais inesperadas.\n\nO caminho Mandala de governar um reino ressoa comigo em um... plano superior. Certamente minha existência serve a um propósito maior, unir o reino sob meu governo divino e benevolente.\n\n#EMP 'Salve Devaraja [ROOT.Char.GetFirstNameNoTooltip]'#! soa muito bem..."
 tgp_east_asia_decision_events.0010.t:0 "Novos Horizontes"
 tgp_east_asia_decision_events.0015.a:0 "O que isso poderá trazer..."
 tgp_east_asia_decision_events.0015.desc:0 "Descobri que minha existência serve a um propósito maior.\n\nJunte-se a mim e aclame seu novo Devaraja!"
 tgp_east_asia_decision_events.0015.opening:0 "[overlord.Custom2('AppropriateGreeting', ROOT.Char)]"
 tgp_east_asia_decision_events.0020.a:0 "Salve!"
 tgp_east_asia_decision_events.0020.b:0 "$tgp_east_asia_decision_events.0010.b$"
 tgp_east_asia_decision_events.0020.close_family_post_tt:0 "[close_family|E] se converteu à #V [GetPlayer.GetOverlord.GetFaith.GetTextIcon][GetPlayer.GetOverlord.GetFaith.GetName]#!"
 tgp_east_asia_decision_events.0020.close_family_pre_tt:0 "[close_family|E] se converterá à #V [GetPlayer.GetOverlord.GetFaith.GetTextIcon][GetPlayer.GetOverlord.GetFaith.GetName]#!"
 tgp_east_asia_decision_events.0020.desc:0 "Vi os sinais. Sei o que é certo. Não há realidade em que eu não possa apoiar [overlord.GetTitledFirstName] e seu governo benevolente sobre este plano de existência.\n\nNos adaptaremos e seguiremos nosso pastor divino para um futuro brilhante.\n\n#EMP Salve Devaraja [overlord.GetFirstNameNoTooltip].#!"
 tgp_east_asia_decision_events.0020.t:0 "Meu Devaraja"
 tgp_east_asia_decision_events.0025.a:0 "$tgp_east_asia_decision_events.0015.a$"
 tgp_east_asia_decision_events.0025.desc:0 "Não há realidade em que eu não possa apoiar [overlord.GetTitledFirstName] e seu governo benevolente sobre este plano de existência.\n\nSalve [overlord.GetTitledFirstName|U]!"
 tgp_east_asia_decision_events.0025.opening:0 "[liege.Custom2('AppropriateGreeting', ROOT.Char)]"
 tgp_east_asia_decision_events.0030.a:0 "Vamos transformar isso em nosso benefício."
 tgp_east_asia_decision_events.0030.desc:0 "Chegou um ofício da mesa [Select_CString( liege.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', ROOT.Char.GetLiege)], [liege.GetTitledFirstName]. Ele denota uma recente mudança no governo e nos exorta a assimilar e apoiar nosso governante.\n\nComo [Select_CString( ROOT.Char.IsFemale, 'vassala legítima', 'vassalo legítimo' )] [Select_CString( liege.IsFemale, 'da nossa', 'do nosso' )] [liege.GetTitleAsNameNoTooltip], é meu dever seguir a linha."
 tgp_east_asia_decision_events.0030.t:0 "Adotando os Costumes do Clã"
 tgp_east_asia_decision_events.0100.a:0 "Que nossas pétalas nunca murchem e caiam."
 tgp_east_asia_decision_events.0100.desc:0 "Nosso amor pelo divino Devaraja [overlord.GetFirstNameNoTooltip] não conhece limites.\n\nNoss[Select_CString( overlord.IsFemale, 'a', 'o' )] [overlord.GetLadyLord] é #EMP transcendente#! e onisciente, seja na sala do trono ou no campo de batalha.\n\nNossas dúvidas, nossas hesitações... todas perdoadas, todas resolvidas — um verdadeiro ser celestial entre nós.\n\nEu sabia desde o início."
 tgp_east_asia_decision_events.0100.t:0 "Dividendos Devotos"
 tgp_east_asia_decision_events.0200.a.aptitude:0 "[aptitude|E] de [great_brahmin_option.GetFirstNameNoTooltip] é [great_brahmin_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_brahmin_court_position' ) )]"
 tgp_east_asia_decision_events.0200.a:0 "[great_brahmin_option.GetTitledFirstNameNoTooltip|U] será uma grande adição."
 tgp_east_asia_decision_events.0200.b.aptitude:0 "[aptitude|E] de [good_brahmin_option.GetFirstNameNoTooltip] é [good_brahmin_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_brahmin_court_position' ) )]"
 tgp_east_asia_decision_events.0200.b:0 "Acredito que [good_brahmin_option.GetTitledFirstNameNoTooltip] tem potencial."
 tgp_east_asia_decision_events.0200.c:0 "Ambos parecem pouco atraentes."
 tgp_east_asia_decision_events.0200.desc:0 "Minha reputação se espalhou amplamente e, finalmente, dois líderes espirituais chegam à minha corte.\n\n[great_brahmin_option.GetTitledFirstName|U] exala uma calma serena e toma um momento para contemplação silenciosa, enquanto o um pouco menos experiente [good_brahmin_option.GetTitledFirstName] olha ao redor com entusiasmo, claramente ansioso para assumir responsabilidades."
 tgp_east_asia_decision_events.0200.t:0 "Um Brahmin na Corte"
 tgp_east_asia_decision_events.0210.a.aptitude:0 "[aptitude|E] de [great_khlon_glan_option.GetFirstNamePossessiveNoTooltip] é [great_khlon_glan_option.GetCourtPositionAptitude( GetCourtPositionType( 'khlon_glan_court_position' ) )]"
 tgp_east_asia_decision_events.0210.a:0 "[great_khlon_glan_option.GetTitledFirstNameNoTooltip] parece a opção mais sábia."
 tgp_east_asia_decision_events.0210.b.aptitude:0 "[aptitude|E] de [good_khlon_glan_option.GetFirstNamePossessiveNoTooltip] é [good_khlon_glan_option.GetCourtPositionAptitude( GetCourtPositionType( 'khlon_glan_court_position' ) )]"
 tgp_east_asia_decision_events.0210.b:0 "[good_khlon_glan_option.GetTitledFirstNameNoTooltip] pode se mostrar útil."
 tgp_east_asia_decision_events.0210.c:0 "$tgp_east_asia_decision_events.0200.c$"
 tgp_east_asia_decision_events.0210.desc:0 "Minha busca por um khlon glan leal fez com que [great_khlon_glan_option.GetTitledFirstName] e [good_khlon_glan_option.GetTitledFirstName] aparecessem à minha porta.\n\nNos reunimos na armaria, onde a maior parte de seus afazeres será conduzida.\n\n[great_khlon_glan_option.GetTitledFirstNameNoTooltip] avalia habilidosamente o inventário com um ou dois olhares, enquanto [good_khlon_glan_option.GetTitledFirstNameNoTooltip] passa alguns segundos olhando ao redor para se situar."
 tgp_east_asia_decision_events.0210.t:0 "O Khlon Glan"
 tgp_east_asia_decision_events.0300.a:0 "Isso deve servir perfeitamente."
 tgp_east_asia_decision_events.0300.desc:0 "[Select_CString( local_artisan.IsFemale, 'A artesã', 'O artesão' )], [local_artisan.GetTitledFirstName], se aproxima de mim com um passo animado: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! O bunga mas está pronto!\" [local_artisan.GetSheHe] gesticula ansiosamente para que eu acompanhe [local_artisan.GetHerHim] até sua oficina.\n\nNo balcão, uma criação impressionante de duas árvores em plena floração. O metal dourado e prateado brilha, polido à perfeição, e há um grau notável de detalhamento em suas delicadas folhas e ramos."
 tgp_east_asia_decision_events.0300.outro.famed:0 "\n\nPermito-me um momento para contemplar as preciosas esculturas e flores delicadas: \"Maravilhoso, [local_artisan.GetTitledFirstNameNoTooltip]!\""
 tgp_east_asia_decision_events.0300.outro.illustrious:0 "\n\nPrendo a respiração por um momento, temporariamente atônito diante da magnificência da criação à minha frente: \"Incrível, [local_artisan.GetTitledFirstNameNoTooltip]!\""
 tgp_east_asia_decision_events.0300.outro.masterwork:0 "\n\nInclino-me, observando os minuciosos detalhes da casca enquanto aceno apreciativamente: \"Impressionante, [local_artisan.GetTitledFirstNameNoTooltip].\""
 tgp_east_asia_decision_events.0300.outro:0 "\n\nDou um leve aceno de aprovação: \"Muito bem, [local_artisan.GetTitledFirstNameNoTooltip].\""
 tgp_east_asia_decision_events.0300.t:0 "Flores de [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]"
