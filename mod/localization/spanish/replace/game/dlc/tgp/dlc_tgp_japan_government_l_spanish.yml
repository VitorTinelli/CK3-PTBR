 japan_castle_construction_trigger_tt:0 "[government|E] [GetGovernment('japan_administrative_government').GetName] só pode construir ou melhorar [holdings|E] de [castle|E] enquanto a [imperial_policy|E] [GetLaw('disarmament_law').GetName] estiver ativa"
 japan_feudal_government:0 "Sōryō"
 japan_feudal_government_adjective:0 "$japan_feudal_government$"
 japan_feudal_government_desc:0 "\n$japan_feudal_government$ é um tipo de [government|E] [feudal|E] único do Japão.\n\n$japan_feudal_government$ representa senhores locais que descartaram ou suplantaram o alcance do governo central [ritsuryo|E] e governam províncias como seus próprios feudos.\n\nPersonagens $japan_feudal_government$ não usam [influence|E], mas [house_head_heads|E] da [noble_family|E] mantêm seu [family_manor|E] e [house_aspiration|E].\n\nEmbora não possam ser eleitos [ceremonial_regent|E], [rulers|E] $japan_feudal_government$ podem tomar poder via a [faction|E] #V $replace_ceremonial_regent_faction_name$#!, e usar a [decision|E] #V Formalizar Shogunato#!.\n\n$japan_feudal_government$ $game_concept_ceremonial_regents$ governam o [realm|E] em nome do [japanese_emperor|E], herdam por [succession|E] $single_heir_succession_law$, e podem ser depostos por demanda de [faction|E].\n\n$game_concept_house_heads$ $japan_feudal_government$ podem criar e participar de [house_blocs|E] dentro do [realm|E]\n\n$japan_government_domain_limit_help$\n\n#F $japan_feudal_government$ refere-se às primeiras etapas da feudalização japonesa iniciadas no período Heian, formalizando-se progressivamente sob o primeiro Shōgunato do período Kamakura.#!"
 japan_feudal_government_vassals_label:0 "As [obligations|E] de $japan_feudal_government$ são baseadas no [vassal_contract|E] de cada [vassal|E]"
