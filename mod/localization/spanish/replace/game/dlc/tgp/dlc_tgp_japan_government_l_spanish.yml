 game_concept_house_bloc:0 "Bloco de Casas"
 game_concept_house_bloc_desc:0 "Um $game_concept_house_bloc$ é uma aliança defensiva de [houses|E] dentro de um [realm|E]. Qualquer [member_house|E] que seja atacada será defendida por todas as outras $game_concept_member_houses$.\n\n[house_heads|E] decidem se tornar [bloc_member_houses|E], com todos os membros governantes de sua Casa no Reino seguindo-os.\n\nBlocos sempre têm uma [leading_house|E], cujo $game_concept_house_head$ pode expulsar outros membros, é o [ceremonial_regent|E] favorecido de todos os membros, e cujo [house_aspiration|E] determina os bônus concedidos pelos níveis mais altos de [cohesion|E].\n\nApenas o $game_concept_house_head$ $game_concept_leading_house_possessive$ pode criar [factions|E] contra o [top_liege|E], e todos os membros $game_concept_bloc_member_houses$ participarão de todas as [factions|E] que ele criar."
