 japan_administrative_government_adjective:0 "$japan_administrative_government$"
 japan_administrative_government_desc:0 "\n$japan_administrative_government$ é um tipo de [government|E] [administrative|E] único do Japão.\n\nÉ uma [government_form|E] [government_bureaucratic_type|E] centralizado onde [characters|E] são nomeados como [governors|E] em nome de seu [liege|E], têm acesso a [influence|E], e [house_head_heads|E] da [noble_family|E] possuem um [family_manor|E] e [house_aspiration|E].\n\nUm [kampaku|E] governa o [realm|E] em nome do [japanese_emperor|E], podendo ser eleito entre [house_head_heads|E] da [noble_family|E], ou imposto por demanda da [faction|E].\n\n[vassals|E] de $japan_administrative_government$ geralmente governam apenas um único [county|E], mas podem rejeitar o sistema centralizado e se tornar senhores locais [soryo|E] para construir seu próprio poder, embora isso geralmente seja considerado um ato [criminal|E].\n\n$game_concept_house_heads$ $japan_administrative_government$ podem criar e participar de [house_blocs|E] dentro do [realm|E], que apoiarão a [leading_house|E] para se tornar $game_concept_kampaku$.\n\n$japan_government_domain_limit_help$\n\n#F O sistema $japan_administrative_government$ refere-se ao governo administrativo centralizado do Japão, inspirado na burocracia confucionista chinesa.#!"
 japan_administrative_government_vassals_label:0 "As [obligations|E] de $japan_administrative_government$ são baseadas em [GetPlayer.Custom('GetProvinceAdministrationConcept')]"
