 game_concept_bloc_cohesion:0 "Coesão do Bloco"
 game_concept_bloc_cohesion_desc:0 "$game_concept_cohesion$ mede a unidade de um [house_bloc|E], com níveis mais altos concedendo benefícios crescentes aos membros de [bloc_member_houses|E], baseados no [house_aspiration|E] do [leading_house_possessive|E].\n\nA principal fonte é [house_relations|E] entre $game_concept_bloc_member_houses$, que pode afetar $game_concept_cohesion$ positivamente ou negativamente. Além disso, o tamanho total do Bloco ou $game_concept_house_aspirations$ desajustadas ou o [government|E] dos membros podem reduzir a $game_concept_cohesion$.\n\nManter um nível de $game_concept_bloc_cohesion$ concederá vários bônus às [member_houses|E], com base na Aspiração da $game_concept_leading_house$.\n\nAo atingir #V 0#! $game_concept_cohesion$, um $game_concept_house_bloc$ será automaticamente dissolvido."
 game_concept_bloc_cohesion_tt:0 "#T @bloc_cohesion! $game_concept_bloc_cohesion$#!\n\n$game_concept_bloc_cohesion_desc$"
