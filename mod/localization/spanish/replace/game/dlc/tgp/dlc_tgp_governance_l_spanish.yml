 tgp_governor_contract_event.0001.a:0 "Renove a prisão, mas que os prisioneiros forneçam a mão de obra."
 tgp_governor_contract_event.0001.b:0 "Devemos melhorar suas condições imediatamente!"
 tgp_governor_contract_event.0001.c:0 "Perdoe os menos culpados entre eles."
 tgp_governor_contract_event.0001.d:0 "Faça com que os reclamantes mais barulhentos sejam silenciados."
 tgp_governor_contract_event.0001.desc:0 "Mal entro na prisão e meus sentidos são atacados pelo cheiro fétido dos mal lavados e pelos lamentos tristes dos internos. Algo pequeno roça meu pé antes de desaparecer nas sombras rápido demais para identificar.\n\nVolto meu olhar para a cela mais próxima e encontro os olhos do prisioneiro dentro dela, [sick_prisoner.GetSheHe] com um olhar de raiva em meio à miséria do semblante [sick_prisoner.GetHerHim]."
 tgp_governor_contract_event.0001.e:0 "Os libertaremos - como mão de obra para nossas fazendas e construções."
 tgp_governor_contract_event.0001.t:0 "Inspeção da Prisão"
 tgp_governor_contract_event.0002.a:0 "Apropriaremos essas poções para suprimentos de emergência."
 tgp_governor_contract_event.0002.b.failure:0 "[snake_oil_peddler.GetSheHe|U] permanece indiferente à sua tentativa de extorsão"
 tgp_governor_contract_event.0002.b.success:0 "Você retira do vendedor parte dos lucros [snake_oil_peddler.GetHerHim]"
 tgp_governor_contract_event.0002.b.toast_failure:0 "O vendedor permaneceu indiferente à sua tentativa de extorsão"
 tgp_governor_contract_event.0002.b.toast_success:0 "Você separou parte dos lucros do vendedor"
 tgp_governor_contract_event.0002.b:0 "Você possui uma #EMP licença#! para esta barraca?"
 tgp_governor_contract_event.0002.c:0 "Arrume suas coisas e leve essa charlatanice para outro lugar."
 tgp_governor_contract_event.0002.d:0 "Acontece que preciso de um médico..."
 tgp_governor_contract_event.0002.desc:0 "Meus acompanhantes dispersaram a teimosa multidão e agora estou diante do vendedor de remédios e das poções [snake_oil_peddler.GetHerHim]. Os olhos desse astuto comerciante observam a qualidade das minhas vestes e percebem uma nova oportunidade lucrativa.\n\n\"Uma única ampola, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [snake_oil_peddler.GetSheHe] levanta um dedo, movimentando-o animadamente para ilustrar. \"Garantido para restaurar sua essência interior e corrigir injustiças!\"\n\n\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLadyLord] estaria interessado em adquirir uma, ou talvez várias?\" O vendedor exibe um sorriso obsequioso cheio de cobiça."
 tgp_governor_contract_event.0002.e:0 "Acredito que vou: para dentro da garrafa!"
 tgp_governor_contract_event.0002.t:0 "Físico Potente"
 tgp_governor_contract_event.0003.a:0 "Perda de seus lucros ilícitos e contemple seu crime na prisão."
 tgp_governor_contract_event.0003.b:0 "A prisão seria um desperdício de uma mentalidade tão #EMP empreendedora#!."
 tgp_governor_contract_event.0003.c:0 "Isso pode refletir mal sobre mim - a verdade não precisa ser conhecida."
 tgp_governor_contract_event.0003.d:0 "Faça restituição e você será perdoado. Desta vez."
 tgp_governor_contract_event.0003.desc:0 "Quase admiraria a elaborada empreitada do peculador, não fosse pelos meus fundos que [dubious_tax_agent.GetSheHe] estava canalizando para os próprios bolsos.\n\nOs escriturários ainda estão desvencilhando a extensão completa das irregularidades, mas o que encontraram até agora é mais que suficiente para condenar [dubious_tax_agent.GetSheHe], não fossem os livros lançados às chamas quando chegamos uma indicação tão clara.\n\nO transgressor está ao meu lado aguardando julgamento, olhos no chão, com o comportamento tão sombrio quanto as perspectivas de seu futuro."
 tgp_governor_contract_event.0003.e.failure:0 "A operação prova-se além de suas habilidades"
 tgp_governor_contract_event.0003.e.success:0 "Você 'ajusta' os registros contábeis a seu favor"
 tgp_governor_contract_event.0003.e.toast_failure:0 "A operação provou-se além de suas habilidades"
 tgp_governor_contract_event.0003.e.toast_success:0 "Você 'ajustou' os registros contábeis a seu favor"
 tgp_governor_contract_event.0003.e:0 "Acho que o que você #EMP realmente#! precisa é de um parceiro..."
 tgp_governor_contract_event.0003.t:0 "Contabilidade Irregular"
 tgp_governor_contract_event.0004.a:0 "Mate [salt_smuggler.GetSheHe] - que #EMP isso#! envie uma mensagem à gangue."
 tgp_governor_contract_event.0004.b:0 "Você tem o acordo, mas não quero ver você novamente."
 tgp_governor_contract_event.0004.c.failure:0 "O contrabandista não sobrevive às suas atenções"
 tgp_governor_contract_event.0004.c.success:0 "Você extrai a informação do contrabandista"
 tgp_governor_contract_event.0004.c.toast_failure:0 "O contrabandista não sobreviveu, junto com seus planos"
 tgp_governor_contract_event.0004.c.toast_success:0 "Você extraiu a informação do contrabandista"
 tgp_governor_contract_event.0004.c:0 "Interrogarei [salt_smuggler.GetSheHe]: teremos seus homens em nossos termos."
 tgp_governor_contract_event.0004.d.failure:0 "Sua sinceridade não é suficientemente convincente"
 tgp_governor_contract_event.0004.d.success:0 "Você convence o contrabandista a entregar o saque"
 tgp_governor_contract_event.0004.d.toast_failure:0 "Sua sinceridade não foi suficientemente convincente"
 tgp_governor_contract_event.0004.d.toast_success:0 "O contrabandista revela onde o saque da gangue estava escondido"
 tgp_governor_contract_event.0004.d:0 "O paradeiro de seus ganhos ilícitos pode comprar-lhe clemência..."
 tgp_governor_contract_event.0004.desc:0 "Algemas podem apertar fortemente as mãos de [salt_smuggler.GetNamePossessive], mas pouco fizeram para suprimir a natureza mendaz do contrabandista. Sua atitude é destemidamente audaciosa, como se fôssemos dois mercadores pechinchando no mercado e não magistrado e fora-da-lei com a vida deste último em jogo.\n\n\"Sim, direi onde estão o resto dos meus homens, assim que afrouxarem isto,\" [salt_smuggler.GetSheHe] ergue as mãos atadas com um significativo inclinar de sobrancelha em direção às amarras, \"e me garantam passagem segura para um lugar onde nunca mais nos encontremos novamente.\""
 tgp_governor_contract_event.0004.e:0 "Eu poderia usar um[Select_CString( salt_smuggler.IsFemale, 'a', '' )] [salt_smuggler.GetWomanMan] com suas habilidades particulares."
 tgp_governor_contract_event.0004.t:0 "Contrabandistas de Sal"
 tgp_governor_contract_event.0005.a:0 "Liberar as reservas de grãos do governo e inundar o mercado."
 tgp_governor_contract_event.0005.b.failure:0 "[grain_hoarding_local_notable.GetSheHe|U] é imune à sua lisonja óbvia"
 tgp_governor_contract_event.0005.b.success:0 "Você apela ao senso de virtude [grain_hoarding_local_notable.GetHerHim]"
 tgp_governor_contract_event.0005.b.toast_failure:0 "Sua tentativa de lisonja fracassou"
 tgp_governor_contract_event.0005.b.toast_success:0 "Seu apelo à dignidade e ao status foi eficaz"
 tgp_governor_contract_event.0005.b:0 "Será que essa mesquinha avareza não está abaixo de um[Select_CString( grain_hoarding_local_notable.IsFemale, 'a', '' )] [grain_hoarding_local_notable.GetWomanMan] de sua evidente dignidade?"
 tgp_governor_contract_event.0005.c.failure:0 "O magnata é imune à sua intimidação mesquinha"
 tgp_governor_contract_event.0005.c.success:0 "Uma ameaça velada é uma das melhores ferramentas de um burocrata"
 tgp_governor_contract_event.0005.c.toast_failure:0 "O magnata rejeitou sua tentativa de intimidação"
 tgp_governor_contract_event.0005.c.toast_success:0 "A ameaça velada cumpriu seu propósito"
 tgp_governor_contract_event.0005.c:0 "Isso pode ser lícito, mas tenho certeza de que #EMP algo#! impróprio poderia ser encontrado."
 tgp_governor_contract_event.0005.d:0 "E se eu me oferecesse para comprar o grão de você?"
 tgp_governor_contract_event.0005.desc:0 "O mobiliário luxuoso da mansão de [grain_hoarding_local_notable.GetNamePossessive] contrasta fortemente com os casebres medíocres que passamos a caminho. Nosso anfitrião não fez nenhum esforço para ocultar ou minimizar suas aquisições, quase se deleitando nelas.\n\n\"Perdoe minha ignorância em assuntos de estado, mas não compreendo o interesse [Select_CString( ROOT.Char.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.GetLadyLord] nesta questão,\" diz [grain_hoarding_local_notable.GetSheHe] insolentemente. \"Isso é simplesmente uma transação comercial legítima, e certamente [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord] tem assuntos mais importantes para tratar...?\" Sua última fala é mais uma afirmação do que uma pergunta."
 tgp_governor_contract_event.0005.e:0 "Eu poderia ter uma posição para você, se tivesse uma atitude mais cooperativa."
 tgp_governor_contract_event.0005.t:0 "Estocagem de Grãos"
 tgp_governor_contract_event.0006.a:0 "Atribua as funções [elderly_magistrate.GetHerHim] a outra pessoa, mas deixe [elderly_magistrate.GetSheHe] manter o cargo."
 tgp_governor_contract_event.0006.b:0 "A idade [elderly_magistrate.GetHerHim] comprometeu suas capacidades: forçar a saída [elderly_magistrate.GetHerHim]."
 tgp_governor_contract_event.0006.c:0 "Est[Select_CString( elderly_magistrate.IsFemale, 'a', 'e' )] [elderly_magistrate.GetWomanMan] está atrasad[Select_CString( elderly_magistrate.IsFemale, 'a', 'o' )] para promoção! Em algum lugar #EMP discreto#!..."
 tgp_governor_contract_event.0006.d:0 "Deixe [elderly_magistrate.GetSheHe] continuar. O Estado sobreviverá a [elderly_magistrate.GetSheHe]."
 tgp_governor_contract_event.0006.desc:0 "Sinto que poderia ter vivido uma segunda vida inteira no tempo que leva para o antigo funcionário se levantar do assento [elderly_magistrate.GetHerHim] e realizar as saudações costumeiras.\n\nA lenta reverência [elderly_magistrate.GetHerHim] parece causar grande dificuldade a [elderly_magistrate.GetSheHe], e [elderly_magistrate.GetSheHe] mantém-se assim por tanto tempo que tenho que contemplar se isso poderia ser o fim [elderly_magistrate.GetHerHim] aqui e agora, antes que dois escriturários corram para ajudá-l[Select_CString( elderly_magistrate.IsFemale, 'a', 'o' )] a se endireitar.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U] me faz grande honra,\" [elderly_magistrate.GetSheHe] rouca, com a voz rangendo como uma roda de carroça velha. \"Como posso servir, [ROOT.Char.Custom('FormOfAddressForLiege')]?\""
 tgp_governor_contract_event.0006.e:0 "[elderly_magistrate.GetSheHe|U] pode continuar trabalhando, mas será como escriturári[Select_CString( elderly_magistrate.IsFemale, 'a', 'o' )] humilde."
 tgp_governor_contract_event.0006.t:0 "Magistrado Débil"
 tgp_governor_contract_event.0007.a.failure:0 "Apesar de seus esforços, nenhuma redistribuição parece viável"
 tgp_governor_contract_event.0007.a.success:0 "Você consegue reequilibrar a carga tributária"
 tgp_governor_contract_event.0007.a.toast_failure:0 "Apesar de seus esforços, nenhuma redistribuição pareceu viável"
 tgp_governor_contract_event.0007.a.toast_success:0 "Você conseguiu reequilibrar a carga tributária"
 tgp_governor_contract_event.0007.a:0 "Vamos transferir a maior parte do fardo para uma área mais próspera."
 tgp_governor_contract_event.0007.b:0 "Reavalie-os a uma taxa reduzida: assumirei total responsabilidade."
 tgp_governor_contract_event.0007.c:0 "Pagarei a diferença eu mesmo, mas o próximo ano dependerá de você."
 tgp_governor_contract_event.0007.d:0 "Não precisam pagar agora, mas os débitos permanecerão até que possam quitá-los."
 tgp_governor_contract_event.0007.desc:0 "Após um longo e cansativo dia ouvindo súplicas e queixas — muitas vezes ambas vindas da mesma boca — o último peticionário se apresenta, um[Select_CString( village_elder.IsFemale, 'a', '' )] [village_elder.GetWomanMan] [Select_CString( village_elder.IsFemale, 'idosa vestida', 'idoso vestido' )] de maneira simples e sóbria, carregando-se com humildade mas não servil. Um escriturário me entrega um bilhete, indicando que est[Select_CString( village_elder.IsFemale, 'a', 'e' )] [village_elder.GetWomanMan] é [Select_CString( village_elder.IsFemale, 'a', 'o' )] chefe de sua vila.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [village_elder.GetSheHe] começa, \"nossa vila é humilde, e sabemos pouco sobre riqueza e prosperidade. As colheitas foram fracas, e os impostos que nos pedem pagar estão além de nossos modestos meios. Imploro a você, deve reduzir nosso fardo, ou então podemos morrer de fome.\""
 tgp_governor_contract_event.0007.e:0 "Quem não puder pagar será preso e seus bens confiscados."
 tgp_governor_contract_event.0007.t:0 "Impostos Onerosos"
 tgp_governor_contract_event.0008.a:0 "Forneceremos escoltas, mas vocês pagarão pelo privilégio."
 tgp_governor_contract_event.0008.b:0 "Entendido. Enviaremos patrulhas para guardar as estradas."
 tgp_governor_contract_event.0008.c.failure:0 "Os mercadores se ofendem com sua insinuação"
 tgp_governor_contract_event.0008.c.success:0 "Você convence os mercadores a empregar mais guardas"
 tgp_governor_contract_event.0008.c.toast_failure:0 "Você ofendeu os mercadores com sua insinuação"
 tgp_governor_contract_event.0008.c.toast_success:0 "Os mercadores foram convencidos a contratar mais guardas"
 tgp_governor_contract_event.0008.c:0 "Seu comércio é perigoso: não possuem proteção?"
 tgp_governor_contract_event.0008.d.failure:0 "Os mercadores não apreciam sua intimidação"
 tgp_governor_contract_event.0008.d.success:0 "Você os ameaça com uma reavaliação tributária"
 tgp_governor_contract_event.0008.d.toast_failure:0 "Os mercadores não se intimidaram"
 tgp_governor_contract_event.0008.d.toast_success:0 "Os mercadores foram intimidados a cumprir"
 tgp_governor_contract_event.0008.d:0 "Seria #EMP infeliz#! se seus impostos precisassem de revisão..."
 tgp_governor_contract_event.0008.desc:0 "Uma delegação de comerciantes, liderada por [fearful_merchant.GetName], lotou meu salão, suas vozes em um clamor de consternação, exigindo proteção para seus comboios após mais um ataque de bandidos. \"Esta situação é insustentável, [ROOT.Char.Custom('FormOfAddressForLiege')],\" proclama seu líder.\n\n\"Se nada for feito rapidamente para proteger nossos bens e vidas desses selvagens, não teremos outra opção senão abandonar nossos interesses em [unsafe_highways_destination.GetName] e levar nosso comércio — e os impostos que pagamos por ele — para outro lugar.\" [fearful_merchant.GetSheHe|U] permanece expectante, ultimato audazmente entregue."
 tgp_governor_contract_event.0008.e.failure:0 "O perigo supera as recompensas prometidas"
 tgp_governor_contract_event.0008.e.success:0 "Suborne os comerciantes para permanecerem onde estão"
 tgp_governor_contract_event.0008.e.toast_failure:0 "Os perigos superam suas promessas"
 tgp_governor_contract_event.0008.e.toast_success:0 "O medo dos comerciantes é menor que sua ganância"
 tgp_governor_contract_event.0008.e:0 "Com perigos vêm recompensas — permaneçam, e farei valer a pena."
 tgp_governor_contract_event.0008.t:0 "Rotas Perigosas"
 tgp_governor_contract_event.0009.a:0 "Mobilize a população local, mas isente os pobres e doentes."
 tgp_governor_contract_event.0009.b:0 "Coloque para trabalhar aqueles que seriam mais afetados pelo colapso."
 tgp_governor_contract_event.0009.c.failure:0 "Eles se recusam a abrir mão de suas riquezas"
 tgp_governor_contract_event.0009.c.success:0 "Você persuade os oligarcas locais a contribuir"
 tgp_governor_contract_event.0009.c.toast_failure:0 "Os notáveis locais se recusaram a contribuir"
 tgp_governor_contract_event.0009.c.toast_success:0 "Os notáveis locais foram convencidos a contribuir"
 tgp_governor_contract_event.0009.c:0 "Os residentes mais ricos devem contribuir conforme sua capacidade."
 tgp_governor_contract_event.0009.d:0 "Riquezas pesam pouco diante de vidas — eu pagarei."
 tgp_governor_contract_event.0009.desc:0 "Uma represa vital em [dam_in_disrepair_destination.GetName] encontra-se em estado de severa deterioração, e as consequências podem ser catastróficas se a situação não for tratada rapidamente.\n\nNo entanto, esta não seria uma tarefa pequena, e a maior parte do nosso orçamento já está comprometida com outros gastos. Para algo mais que uma solução temporária, devemos encontrar uma forma de reduzir os custos."
 tgp_governor_contract_event.0009.e.failure:0 "Os mercadores fogem com suas mercadorias"
 tgp_governor_contract_event.0009.e.success:0 "Sua 'contribuição' será lembrada"
 tgp_governor_contract_event.0009.e.toast_failure:0 "Os mercadores fugiram com suas mercadorias"
 tgp_governor_contract_event.0009.e.toast_success:0 "Os materiais necessários foram confiscados"
 tgp_governor_contract_event.0009.e:0 "Apropriaremos os recursos necessários dos comerciantes locais."
 tgp_governor_contract_event.0009.t:0 "Represa em Ruínas"
 tgp_governor_contract_event.0010.a:0 "Devo cuidar pessoalmente deste assunto."
 tgp_governor_contract_event.0010.a_tt:0 "Viaje para [jail_inspection_destination.GetName] e inspecione pessoalmente a prisão."
 tgp_governor_contract_event.0010.b:0 "As súplicas dos condenados pouco me interessam."
 tgp_governor_contract_event.0010.desc:0 "Parece que os prisioneiros da prisão do distrito de [jail_inspection_destination.GetName] se tornaram inquietos, protestando contra suas condições e resistindo aos esforços dos carcereiros para mantê-los sob controle. Os relatórios alertam que uma solução deve ser encontrada em breve, caso contrário, os prisioneiros podem dominar seus guardas."
 tgp_governor_contract_event.0010.t:0 "Inspeção da Prisão"
 tgp_governor_contract_event.0011.a:0 "Qualquer remédio que desperte tal demanda merece investigação."
 tgp_governor_contract_event.0011.a_tt:0 "Viaje para [potent_physick_destination.GetName] e restaure a ordem no mercado."
 tgp_governor_contract_event.0011.b:0 "Não me interessam os assuntos do mercado."
 tgp_governor_contract_event.0011.desc:0 "Raramente um vendedor ambulante despertaria interesse do governo, mas parece que um indivíduo em [potent_physick_destination.GetName] está promovendo um elixir tão eficaz que as multidões barulhentas que atrai rapidamente se tornam uma perturbação da ordem pública."
 tgp_governor_contract_event.0011.t:0 "Físico Potente"
 tgp_governor_contract_event.0012.a:0 "Isso merece uma investigação mais detalhada."
 tgp_governor_contract_event.0012.a_tt:0 "Viaje para [irregular_accounting_destination.GetName] e investigue a fundo a situação."
 tgp_governor_contract_event.0012.b:0 "Tenho certeza de que isso se resolverá com o tempo."
 tgp_governor_contract_event.0012.desc:0 "Alguma variação no tempo de entrega é esperada no transporte de impostos, seja devido às condições das estradas, ao clima ou outros fatores difíceis de prever ou controlar.\n\nNo entanto, a arrecadação de impostos de [irregular_accounting_destination.GetName] tem chegado incomumente atrasada, e os custos de transporte encaminhados ao meu gabinete parecem cada vez mais excessivos."
 tgp_governor_contract_event.0012.t:0 "Contabilidade Irregular"
 tgp_governor_contract_event.0013.a:0 "Devo ao menos ouvir essa oferta."
 tgp_governor_contract_event.0013.a_tt:0 "Viaje para [salt_smugglers_destination.GetName] e trate com o fora-da-lei, de uma forma ou de outra."
 tgp_governor_contract_event.0013.b:0 "Responder ao chamado de um fora-da-lei está abaixo da minha dignidade."
 tgp_governor_contract_event.0013.desc:0 "O contrabando de sal é uma ofensa grave contra a autoridade do governo, e o líder de justamente tal bando de fora-da-lei foi recentemente capturado em [salt_smugglers_destination.GetName]. Parece que esse chefe exigiu falar comigo pessoalmente, oferecendo sacrificar o resto da gangue em troca de sua própria liberdade."
 tgp_governor_contract_event.0013.t:0 "Contrabandistas de Sal"
 tgp_governor_contract_event.0014.a:0 "Minha presença será necessária para resolver isso."
 tgp_governor_contract_event.0014.a_tt:0 "Viaje para [hoarding_grain_destination.GetName] e resolva a escassez de grãos."
 tgp_governor_contract_event.0014.b:0 "Assuntos de muito maior importância requerem minha atenção."
 tgp_governor_contract_event.0014.desc:0 "É uma prática infeliz, mas não incomum, que famílias ricas comprem grãos muito além de suas necessidades em tempos de abundância com vistas a lucros futuros, mas recebi notícias de que uma família em [hoarding_grain_destination.GetName] excedeu amplamente o normal.\n\nParece que acumularam tanto grão que o preço subiu a ponto de o povo comum mal poder pagar."
 tgp_governor_contract_event.0014.t:0 "Estocagem de Grãos"
 tgp_governor_contract_event.0015.a:0 "Este é um assunto delicado, que devo tratar pessoalmente."
 tgp_governor_contract_event.0015.a_tt:0 "Viaje para [doddering_magistrate_destination.GetName] e avalie o desempenho do funcionário."
 tgp_governor_contract_event.0015.b:0 "Não é lugar deles questionar seu superior."
 tgp_governor_contract_event.0015.desc:0 "O axioma de que com a idade vem a sabedoria e experiência aparentemente não se aplica aos escriturários de [doddering_magistrate_destination.GetName], que coletivamente enviaram múltiplos apelos ao meu escritório implorando que seu superior — de idade particularmente venerável — seja reatribuído ou removido de seu cargo."
 tgp_governor_contract_event.0015.t:0 "Magistrado Débil"
 tgp_governor_contract_event.0020.a:0 "Acho que #EMP poderia#! usar uma pausa do escritório."
 tgp_governor_contract_event.0020.a_tt:0 "Viaje para [lines_in_the_soil_destination.GetName] e medie a disputa."
 tgp_governor_contract_event.0020.b:0 "Deixe as petições juntarem poeira; eles logo se cansarão."
 tgp_governor_contract_event.0020.desc:0 "O cotidiano de um [ROOT.Char.GetTitleTierName] envolve uma quantidade significativa de papelada, mas algo está claramente errado quando quase todas as correspondências de hoje se originam de [lines_in_the_soil_destination.GetName].\n\nExaminando os relatórios, parece que dois proprietários locais entraram em conflito sobre um pedaço de terra situado entre eles e, como consequência, transformaram o escritório da magistratura local em um campo de batalha legal."
 tgp_governor_contract_event.0020.t:0 "Linhas no Solo"
 tgp_governor_contract_event.0021.a:0 "Faça uma nova medição da terra e o resultado será definitivo."
 tgp_governor_contract_event.0021.b.failure:0 "Mais combustível para a disputa pode apenas piorar a situação"
 tgp_governor_contract_event.0021.b.success:0 "Você encontra evidências confiáveis que respaldam a reivindicação de um dos lados"
 tgp_governor_contract_event.0021.b.toast_failure:0 "Os registros fragmentários apenas aprofundam o conflito entre eles"
 tgp_governor_contract_event.0021.b.toast_success:0 "Você encontrou evidências conclusivas a favor da reivindicação de um dos lados"
 tgp_governor_contract_event.0021.b:0 "Consulte os arquivos para descobrir quem tem a melhor reivindicação."
 tgp_governor_contract_event.0021.c:0 "Divida a propriedade igualmente e deixe isso encerrar o assunto."
 tgp_governor_contract_event.0021.d.failure:0 "Sua oferta foi rejeitada categoricamente"
 tgp_governor_contract_event.0021.d.success:0 "Os proprietários de terras acham sua oferta atraente"
 tgp_governor_contract_event.0021.d.toast_failure:0 "A obsessão deles pela propriedade não diminuiu com sua oferta"
 tgp_governor_contract_event.0021.d.toast_success:0 "Você apelou ao interesse material deles, resultando em benefício mútuo"
 tgp_governor_contract_event.0021.d:0 "E se eu oferecesse comprar a terra eu mesmo?"
 tgp_governor_contract_event.0021.desc:0 "Após intermináveis horas de argumentos, debates e vítrea sutilmente disfarçada, só posso concluir que os indivíduos estimados no centro desta disputa são cabeças-duras, #EMP tolos confusos#!.\n\nObviamente, este é apenas o último capítulo de uma longa história de queixas, e nenhum deles está disposto a ceder sequer um punhado de terra ao outro.\n\nSe eu tiver alguma esperança de pôr fim à sua contenda incessante, terei pouca escolha senão decidir como juiz, não como árbitro."
 tgp_governor_contract_event.0021.e:0 "Na ausência de acordo, a terra se torna propriedade do estado."
 tgp_governor_contract_event.0021.t:0 "Linhas no Solo"
 tgp_governor_contract_event.0022.a:0 "Isso merece uma investigação."
 tgp_governor_contract_event.0022.a_tt:0 "Viaje para [fraud_in_broad_daylight_destination.GetName] e restaure a justiça no mercado."
 tgp_governor_contract_event.0022.b:0 "Esses clientes são apenas tolos."
 tgp_governor_contract_event.0022.desc:0 "O estrondo de uma caixa sendo largada no chão sem cerimônia quebra minha concentração e me desperta do trabalho. [reporting_councillor.GetTitledFirstName] está ao lado dela.\n\n\"Mais evidências chegaram, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLadyLord]. Desta vez são frascos de perfume, cheios de terra.\"\n\nOs mercados em [fraud_in_broad_daylight_destination.GetName] têm sido assolados por mercadorias falsificadas recentemente."
 tgp_governor_contract_event.0022.t:0 "Fraude à Luz do Dia"
 tgp_governor_contract_event.0023.a:0 "Verifique todos no mercado e detenha os suspeitos."
 tgp_governor_contract_event.0023.b:0 "Ofereça uma recompensa por informações."
 tgp_governor_contract_event.0023.c.failure:0 "Os funcionários infiltrados falharam em seu papel"
 tgp_governor_contract_event.0023.c.success:0 "Suas táticas investigativas inovadoras dão frutos"
 tgp_governor_contract_event.0023.c.toast_failure:0 "Seus funcionários foram péssimos investigadores e foram facilmente enganados"
 tgp_governor_contract_event.0023.c.toast_success:0 "Os vendedores fraudulentos foram pegos em flagrante e presos"
 tgp_governor_contract_event.0023.c:0 "Envie nossos escriturários disfarçados como compradores."
 tgp_governor_contract_event.0023.d:0 "Deixe que os comerciantes resolvam o problema."
 tgp_governor_contract_event.0023.desc:0 "Apesar de esforços vigorosos, identificar os falsificadores está se mostrando muito mais difícil do que eu previa.\n\nOs comerciantes legítimos, uma vez que seus estoques se esgotam, alugam seus lugares a estranhos pelo restante do dia, permitindo que os fraudadores vendam suas mercadorias falsas e desapareçam sem deixar rastro."
 tgp_governor_contract_event.0023.e.failure:0 "Os falsificadores percebem o perigo e fogem"
 tgp_governor_contract_event.0023.e.success:0 "Você pega os malfeitores desprevenidos"
 tgp_governor_contract_event.0023.e.toast_failure:0 "Os vendedores perceberam seus planos e escaparam"
 tgp_governor_contract_event.0023.e.toast_success:0 "A operação ocorreu sem problemas e os falsificadores foram capturados"
 tgp_governor_contract_event.0023.e:0 "Revise o mercado ao meio-dia!"
 tgp_governor_contract_event.0023.t:0 "Fraude à Luz do Dia"
 tgp_governor_contract_event.0024.a:0 "Diga a eles para se prepararem para a minha chegada. Estou a caminho."
 tgp_governor_contract_event.0024.a_tt:0 "Viaje para [crumbling_bridge_destination.GetName] e lide com as consequências."
 tgp_governor_contract_event.0024.b:0 "Sempre há outra ponte: eles só precisam ir mais longe."
 tgp_governor_contract_event.0024.desc:0 "Uma das responsabilidades centrais de um [ROOT.Char.GetTitleTierNamePossessive] é a manutenção da infraestrutura essencial, o que torna a notícia do recente colapso de uma ponte em [crumbling_bridge_destination.GetName] ainda mais preocupante.\n\nIsso pode não apenas afetar o comércio e o tráfego, mas também minar a confiança na minha administração."
 tgp_governor_contract_event.0024.t:0 "Ponte em Ruínas"
 tgp_governor_contract_event.0025.a:0 "As estradas são as artérias da nação: use o exército para ajudar na reconstrução."
 tgp_governor_contract_event.0025.b:0 "Use todos os recursos para construir uma nova ponte o mais rápido possível."
 tgp_governor_contract_event.0025.c:0 "Estabeleça uma balsa temporária até a ponte ser reconstruída."
 tgp_governor_contract_event.0025.d:0 "A pressa só resultará em outro acidente. Construa uma substituição robusta."
 tgp_governor_contract_event.0025.desc:0 "Olhando para os restos da ponte destruída, a situação é grave. Enquanto os trabalhadores lutam para remover os escombros, a multidão de comerciantes e viajantes continua a crescer à medida que mais chegam sem saber dessa interrupção inesperada em seus planos de viagem.\n\nCom mercadorias se deteriorando e os ânimos se exaltando entre os retidos, as consequências deste incidente podem ser significativas se não forem manejadas com habilidade."
 tgp_governor_contract_event.0025.e.failure:0 "Seus argumentos caem em ouvidos surdos"
 tgp_governor_contract_event.0025.e.success:0 "Os comerciantes são persuadidos a permanecer aqui"
 tgp_governor_contract_event.0025.e.toast_failure:0 "Os caravaneiros foram insensíveis aos seus argumentos e partiram em busca de novas rotas"
 tgp_governor_contract_event.0025.e.toast_success:0 "Convencidos por sua persuasão, os comerciantes optaram por ficar"
 tgp_governor_contract_event.0025.e:0 "Aproveite a oportunidade para convencer os comerciantes retidos a montar suas lojas."
 tgp_governor_contract_event.0025.t:0 "Ponte em Ruínas"
 tgp_governor_contract_event.0026.a:0 "O trabalho de um [ROOT.Char.GetTitleTierNamePossessive] nunca termina."
 tgp_governor_contract_event.0026.a_tt:0 "Viaje para [confusion_of_tongues_destination.GetName] e encontre os comerciantes estrangeiros."
 tgp_governor_contract_event.0026.b:0 "Isto parece problemático: deixem-os onde estão."
 tgp_governor_contract_event.0026.desc:0 "Comerciantes de terras distantes são compreensivelmente atraídos pela prosperidade do nosso grande [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip], viajando vastas distâncias e enfrentando inúmeros perigos em busca de riqueza material.\n\nNo entanto, os perigos mostraram-se demais para alguns infelizes, como acabou de acontecer em [confusion_of_tongues_destination.GetName]. Disseram-me que uma embarcação estrangeira jaz destruída em nossas costas, e o tradutor da tripulação não está entre os sobreviventes.\n\nA magistratura local está completamente perdida quanto a como lidar com os estrangeiros encharcados e atônitos."
 tgp_governor_contract_event.0026.t:0 "Confusão de Línguas"
 tgp_governor_contract_event.0027.a:0 "Erga algumas tendas e informe a capital: eles encontrarão um tradutor."
 tgp_governor_contract_event.0027.b:0 "Volte e veja se há alguém no mercado que os entenda."
 tgp_governor_contract_event.0027.c:0 "O navio naufragou em nossas costas, o que significa que suas mercadorias estão perdidas para nós."
 tgp_governor_contract_event.0027.d.failure:0 "Os comerciantes de terras distantes ficam ainda mais confusos"
 tgp_governor_contract_event.0027.d.success:0 "Suas gesticulações alcançam os estrangeiros"
 tgp_governor_contract_event.0027.d.toast_failure:0 "Suas tentativas de comunicação apenas confundem ainda mais os estrangeiros"
 tgp_governor_contract_event.0027.d.toast_success:0 "Com algum esforço, você conseguiu se comunicar com os comerciantes"
 tgp_governor_contract_event.0027.d:0 "As palavras podem ter falhado, mas posso tentar comunicar-me por gestos."
 tgp_governor_contract_event.0027.desc:0 "O magistrado está claramente no limite quando chego, exausto e exasperado na mesma medida. \"Nenhum deles entende uma palavra do que digo!\" lamenta. \"E cada vez que tentamos movê-los, reagem como se fôssemos bandidos!\"\n\nPerto dali, vejo os comerciantes náufragos amontoados defensivamente ao redor do que restou de suas mercadorias, seus guardas segurando nervosamente os cabos de suas armas."
 tgp_governor_contract_event.0027.e:0 "Apenas tire-os daqui, e use força se necessário."
 tgp_governor_contract_event.0027.f:0 "$epidemic_events.5902.a$"
 tgp_governor_contract_event.0027.t:0 "Confusão de Línguas"
 tgp_governor_contract_event.0028.a:0 "Deixe-me julgar essas palavras com meus próprios ouvidos."
 tgp_governor_contract_event.0028.a_tt:0 "Viaje para [seditious_storytelling_destination.GetName] e ouça os contos do contador de histórias."
 tgp_governor_contract_event.0028.b:0 "Devo me preocupar com meros #EMP artistas#! agora?"
 tgp_governor_contract_event.0028.desc:0 "O último dos peticionários do dia parte de minha presença com gratidão, mas o som distante de sua saída medida é rapidamente substituído por passos apressados trazendo más notícias.\n\nÉ [concerned_councillor.GetFirstName], o semblante grave [concerned_councillor.GetHerHim]. \"Acabo de receber um relatório #EMP ultrajante#!, [ROOT.Char.Custom('FormOfAddressForLiege')]! Um desses contadores de histórias itinerantes tem incitado o povo em [seditious_storytelling_destination.GetName] com relatos de magistrados corruptos e má conduta governamental!\""
 tgp_governor_contract_event.0028.t:0 "Narrativas Sediciosas"
 tgp_governor_contract_event.0029.a:0 "Emita um decreto público censurando [seditious_storyteller.GetHerHim] por perturbar a ordem pública."
 tgp_governor_contract_event.0029.b:0 "Prenda o audacioso tolo imediatamente!"
 tgp_governor_contract_event.0029.c:0 "Contrataremos nossos próprios contadores de histórias para tecer uma narrativa própria."
 tgp_governor_contract_event.0029.d:0 "Poste guardas em todos os eventos [seditious_storyteller.GetHerHim] para lembrar ao público seu lugar."
 tgp_governor_contract_event.0029.desc:0 "Sentado discretamente ao fundo do público, devo admitir que os relatórios foram, se acaso, subestimados.\n\nApenas os mais simples dos simples poderiam não compreender o significado do conto decididamente pontiagudo sobre heróis vagabundos oprimidos enfrentando magistrados vilões e descaradamente corruptos e soldados semelhantes a bandidos, sendo o vilão principal da história #EMP suspeitamente#! familiar.\n\nMais preocupante do que as palavras do contador de histórias, no entanto, é o entusiasmo crescente da plateia por elas."
 tgp_governor_contract_event.0029.e.failure:0 "Seus esforços encontram teimosa intransigência"
 tgp_governor_contract_event.0029.e.success:0 "O contador de histórias mostra-se receptivo aos seus argumentos"
 tgp_governor_contract_event.0029.e.toast_failure:0 "O contador de histórias rejeitou suas apelações e continua a inflamar a população"
 tgp_governor_contract_event.0029.e.toast_success:0 "Comovido por sua eloquência, o contador de histórias concordou em moderar seus relatos"
 tgp_governor_contract_event.0029.e:0 "Organize uma reunião discreta e, talvez, eu possa convencer [seditious_storyteller.GetSheHe]."
 tgp_governor_contract_event.0029.t:0 "Narrativas Sediciosas"
 tgp_governor_contract_event.0030.a:0 "O pânico, como um incêndio, é difícil de extinguir se permitido se espalhar."
 tgp_governor_contract_event.0030.a_tt:0 "Viaje para [quaking_in_panic_destination.GetName] e acalme seus temores."
 tgp_governor_contract_event.0030.b:0 "Dou pouca atenção ao clamor dos camponeses."
 tgp_governor_contract_event.0030.desc:0 "Estou profundamente envolvido em conversa com [my_councillor.GetFirstName] quando [alarmed_councillor.GetFirstName] irrompe na sala com urgência incomum, visivelmente abalado.\n\n\"Um mensageiro de [quaking_in_panic_destination.GetName], [ROOT.Char.Custom('FormOfAddressForLiege')]! Houve um terremoto e os camponeses interpretaram como um presságio terrível, alegando ser um sinal de desagrado divino!\""
 tgp_governor_contract_event.0030.t:0 "Tremores e Pânico"
 tgp_governor_contract_event.0031.a.failure:0 "O medo dos camponeses prova-se grande demais para ser apaziguado"
 tgp_governor_contract_event.0031.a.success:0 "Seu discurso digno acalma as preocupações da multidão"
 tgp_governor_contract_event.0031.a.toast_failure:0 "Amedrontados pelo temor de retaliação divina, ninguém compareceu à reunião"
 tgp_governor_contract_event.0031.a.toast_success:0 "O povo ficou tranquilizado por seu discurso equânime"
 tgp_governor_contract_event.0031.a:0 "Convoque uma reunião pública para tranquilizar o povo."
 tgp_governor_contract_event.0031.b:0 "Estacione um pequeno destacamento de tropas para suprimir a agitação."
 tgp_governor_contract_event.0031.c:0 "Faça os anciãos da aldeia expressarem confiança de que o perigo passou."
 tgp_governor_contract_event.0031.d.failure:0 "O povo fica ainda mais aterrorizado ao ver os danos"
 tgp_governor_contract_event.0031.d.success:0 "Seus esforços calmos e autoritativos ajudam a tranquilizar o povo"
 tgp_governor_contract_event.0031.d.toast_failure:0 "Expor os danos apenas aumentou o medo do povo"
 tgp_governor_contract_event.0031.d.toast_success:0 "Você avalia os danos e inicia os reparos e a reconstrução"
 tgp_governor_contract_event.0031.d:0 "Realize uma revisão completa dos danos e prometa auxílio adicional."
 tgp_governor_contract_event.0031.desc:0 "A aldeia está claramente em estado de agitação ao chegar, camponeses cercando minha escolta com súplicas para que a ira do Céu seja apaziguada antes que outro desastre lhes ocorra.\n\nLançando meus olhos sobre a aldeia atrás deles, as paredes rachadas e portas tortas de suas casas testemunham a fonte de seus medos."
 tgp_governor_contract_event.0031.e:0 "Realocar os mais afetados e consolidar a população da região."
 tgp_governor_contract_event.0031.t:0 "Tremores e Pânico"
 tgp_governor_contract_event.0032.a:0 "Cuidarei pessoalmente deste assunto."
 tgp_governor_contract_event.0032.a_tt:0 "Viaje para [monopoly_in_the_marketplace_destination.GetName] e organize os assuntos do mercado a seu gosto."
 tgp_governor_contract_event.0032.b:0 "Não vejo nada mais incomum do que um comerciante bem-sucedido."
 tgp_governor_contract_event.0032.desc:0 "\"...e se isso continuar, as consequências serão #EMP desastrosas#! para nossos meios de subsistência\", conclui o chefe da delegação.\n\nSegundo seus argumentos, um de seus rivais em [monopoly_in_the_marketplace_destination.GetName] conseguiu adquirir o controle do mercado principal de forma ardilosa, negando acesso a qualquer membro de sua associação, relegando-os a locais menos populares e profundamente não lucrativos."
 tgp_governor_contract_event.0032.t:0 "Monopólio no Mercado"
 tgp_governor_contract_event.0033.a:0 "Nenhum comerciante deve possuir mais de uma barraca."
 tgp_governor_contract_event.0033.b:0 "Expanda o mercado e leiloem novas barracas apenas para membros da associação."
 tgp_governor_contract_event.0033.c:0 "[merchant_magnate.GetSheHe|U] pode permanecer, desde que [merchant_magnate.GetSheHe] esteja dispost[Select_CString( merchant_magnate.IsFemale, 'a', 'o' )] a #EMP pagar#! pelo privilégio."
 tgp_governor_contract_event.0033.d.failure:0 "Tão ineptos quanto eram quando perderam o mercado, falham em retomá-lo"
 tgp_governor_contract_event.0033.d.success:0 "O consórcio recupera seu lugar legítimo"
 tgp_governor_contract_event.0033.d.toast_failure:0 "Seja qual for a tentativa da associação, não conseguiram recuperar seu lugar"
 tgp_governor_contract_event.0033.d.toast_success:0 "Com sua ajuda, o consórcio conseguiu retomar o controle do mercado"
 tgp_governor_contract_event.0033.d:0 "Apoiamos os concorrentes [merchant_magnate.GetHerHim] e deixamos a natureza seguir seu curso."
 tgp_governor_contract_event.0033.desc:0 "Embora raramente sejam exemplos de honestidade, as palavras dos comerciantes parecem verdadeiras nesta ocasião.\n\nEnquanto percorremos discretamente de uma barraca à outra, todas até agora estão ostentando a mesma marca, identificando-as como propriedade coletiva de um único proprietário.\n\nA última barraca que abordamos é a maior e mais elaborada por várias ordens de magnitude, e [Select_CString( merchant_magnate.IsFemale, 'a', 'o' )] [merchant_magnate.GetWomanMan] imponente que a preside está adornad[Select_CString( merchant_magnate.IsFemale, 'a', 'o' )] com luxos flagrantemente inadequados para o status [merchant_magnate.GetHerHim]. Est[Select_CString( merchant_magnate.IsFemale, 'a', 'e' )] é claramente [Select_CString( merchant_magnate.IsFemale, 'a', 'o' )] rival de quem falaram."
 tgp_governor_contract_event.0033.e:0 "Quem é tão próspero deve ser culpado de #EMP algo#!. Confisque os bens [merchant_magnate.GetHerHim]!"
 tgp_governor_contract_event.0033.t:0 "Monopólio no Mercado"
 tgp_governor_contract_event.0034.a:0 "A discórdia em uma família de tal distinção reflete mal em nossa sociedade."
 tgp_governor_contract_event.0034.a_tt:0 "Viaje para [contested_inheritance_destination.GetName] e ponha fim à disputa."
 tgp_governor_contract_event.0034.b:0 "Isso é um assunto familiar e não negócio do Estado."
 tgp_governor_contract_event.0034.desc:0 "Ser um [ROOT.Char.GetTitleTierName] é ser mais do que um mero administrador, e muitos olham para mim como uma figura equitativa em assuntos contenciosos.\n\nÉ nesse papel que uma família proeminente em [contested_inheritance_destination.GetName] solicitou minha presença para resolver uma disputa de herança particularmente feroz, que deixou a família profundamente dividida."
 tgp_governor_contract_event.0034.t:0 "Herança Contestada"
 tgp_governor_contract_event.0035.a:0 "O espólio será responsabilidade de toda a #EMP família#!"
 tgp_governor_contract_event.0035.b:0 "Que o membro mais velho da família seja seu guardião."
 tgp_governor_contract_event.0035.c.failure:0 "Nenhum está inclinado a apelar para sua avareza"
 tgp_governor_contract_event.0035.c.success:0 "Os herdeiros ofertam, literalmente, para conquistar seu favor"
 tgp_governor_contract_event.0035.c.toast_failure:0 "Nenhum dos herdeiros potenciais aceitou sua sugestão"
 tgp_governor_contract_event.0035.c.toast_success:0 "As ofertas vieram rápidas e numerosas, indiscutivelmente em seu benefício"
 tgp_governor_contract_event.0035.c:0 "Por uma quantia simbólica, poderia permitir-me ser #EMP persuadido#!..."
 tgp_governor_contract_event.0035.d:0 "Devemos respeitar os desejos do falecido."
 tgp_governor_contract_event.0035.desc:0 "A tensão no ar é palpável enquanto analisamos novamente as reivindicações concorrentes, cada rodada de debate apenas complicando ainda mais a questão.\n\nApesar de seus esforços transparentes para aparentar cortesia na minha presença, suspeito que, se eu pudesse engarrafar a vitriol velada dos herdeiros aspirantes, ela rivalizaria com qualquer veneno em potência."
 tgp_governor_contract_event.0035.e.failure:0 "Suas recomendações foram ouvidas e ignoradas"
 tgp_governor_contract_event.0035.e.success:0 "A família é persuadida a agir de maneira razoável e equilibrada"
 tgp_governor_contract_event.0035.e.toast_failure:0 "Seu conselho sensato foi graciosamente recebido e prontamente descartado"
 tgp_governor_contract_event.0035.e.toast_success:0 "A pressão imposta por sua postura calma os levou a um acordo"
 tgp_governor_contract_event.0035.e:0 "Devo persuadi-los a resolver isso de maneira mais digna."
 tgp_governor_contract_event.0035.t:0 "Herança Contestada"
 tgp_governor_contract_event.2000.a:0 "Vamos visitar as oficinas."
 tgp_governor_contract_event.2000.a_tt:0 "Vá até as oficinas e resolva o problema pessoalmente"
 tgp_governor_contract_event.2000.b:0 "Sempre posso comprar o equipamento eu mesmo."
 tgp_governor_contract_event.2000.c:0 "Envie um recado para [capital_location.GetNameNoTooltip]. Eventualmente será resolvido."
 tgp_governor_contract_event.2000.desc:0 "Já se passaram #EMP semanas#! desde que o último carregamento de novo equipamento era esperado. Ainda não recebi notícias sobre onde ele possa estar.\n\nA maioria de todas as espadas, bestas, flechas e armaduras é fabricada pelas oficinas em [capital_location.GetNameNoTooltip], que empregam milhares de pessoas. Apenas elas podem entregar as quantidades necessárias.\n\nSem esses carregamentos, não podemos equipar novos recrutas ou substituir armas e armaduras desgastadas."
 tgp_governor_contract_event.2000.t:0 "$missing_equipment$"
 tgp_governor_contract_event.2001.a.tt:0 "Você convence o mestre ameaçando levar o caso a [court_relation.GetShortUIName] na corte imperial"
 tgp_governor_contract_event.2001.a:0 "Um #EMP erro clerical#!? [court_relation.GetFirstNameNoTooltip] ouvirá sobre isso..."
 tgp_governor_contract_event.2001.b:0 "Certamente alguma compensação adicional é devida?"
 tgp_governor_contract_event.2001.c:0 "Seria infeliz se este incidente se tornasse público, não é?"
 tgp_governor_contract_event.2001.d:0 "Muito bem. Apenas certifique-se de que seja feito."
 tgp_governor_contract_event.2001.desc:0 "O mestre da oficina #EMP finalmente#! chega, cumprimentando-me com uma profunda reverência formal.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], que visita inesperada. Revisei os livros contábeis, como solicitado, e parece que um erro clerical pode ser a causa da falta de entregas para [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]. Um infeliz engano. Redirecionaremos nossa próxima entrega para você.\""
 tgp_governor_contract_event.2001.t:0 "$missing_equipment$: A Oficina"
 tgp_governor_contract_event.2001.tt_failure:0 "Você não consegue convencer o mestre a fazer mais do que já prometeu"
 tgp_governor_contract_event.2001.tt_failure_desc:0 "O mestre não está #bold convencido#!"
 tgp_governor_contract_event.2001.tt_success:0 "Você consegue convencer o mestre a fornecer mais"
 tgp_governor_contract_event.2001.tt_success_desc:0 "O mestre foi convencido"
 tgp_governor_contract_event.2002.a:0 "Vamos garantir também as entregas futuras."
 tgp_governor_contract_event.2002.b:0 "Forneça-me os próximos #EMP dois#! carregamentos."
 tgp_governor_contract_event.2002.c:0 "Compensação monetária é necessária."
 tgp_governor_contract_event.2002.d:0 "Envie-me o melhor equipamento que tiver disponível."
 tgp_governor_contract_event.2002.desc:0 "Minhas ameaças nada sutis são rapidamente recompensadas com uma reverência ainda mais profunda. O mestre, visivelmente suando, levanta-se lentamente.\n\n\"Claro, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLadyLord]. Você está completamente correto em sua avaliação. Tenho certeza de que podemos chegar a um acordo. Talvez você já tenha uma sugestão?\""
 tgp_governor_contract_event.2002.t:0 "$missing_equipment$: Sucesso"
 tgp_governor_contract_event.2003.a:0 "#EMP Muito bem.#!"
 tgp_governor_contract_event.2003.desc:0 "O mestre faz uma pausa por um momento e franze o cenho.\n\n\"#EMP Você#! não é o único comandante necessitado de equipamento. Já fiz mais do que o suficiente ao fornecer o próximo carregamento. Um carregamento esperado em outro local, é bom que saiba. Não abuse da sorte, #EMP m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLadyLord]#!.\"\n\n[Select_CString( foreman.IsFemale, 'A', 'O' )] [foreman.GetWomanMan] se vira e vai embora."
 tgp_governor_contract_event.2003.t:0 "$missing_equipment$: Falha"
 unsafe_highways:0 "Rotas Perigosas"
 unsafe_highways_contract:0 "$unsafe_highways$"
 unsafe_highways_desc:0 "Comerciantes estão causando alvoroço, proclamando que as estradas são perigosas para viajar e ameaçando buscar novos mercados se a questão não for resolvida."
 unsafe_highways_desc_title:0 "$task_contract_governance_desc_title$"
 unsafe_highways_request:0 "Esta situação permite que você escolha um resultado"
