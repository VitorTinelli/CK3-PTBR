l_spanish:
 eradicated_my_house_opinion:0 "Minha Casa foi Erradicada"
 every_close_family_house_member_in_court:0 "Você e todos os [spouses|E] e membros da [close_family|E] da [house|E] presentes na [court|E] de [loser.GetShortUINamePossessive]"
 every_house_member_in_court:0 "Todos os [spouses|E] de [loser.GetShortUINamePossessive] e cada membro da [house|E] na [court|E] [loser.GetHerHim]"
 every_house_member_mad:0 "Cada membro sobrevivente da [house|E]"
 house_eradicated_modifier:0 "Casa Erradicada"
 house_eradicated_modifier_desc:0 "Sua [house|E] foi em grande parte eliminada por uma [house|E] [rival|E]. Ninguém mais lhe teme. Essa vergonha e inimizade são combustível promissor para a vingança."
 house_eradicated_suicide_modifier:0 "Casa Erradicada"
 house_eradicated_suicide_modifier_desc:0 "Antes que sua [house|E] fosse em grande parte exterminada por uma [house|E] [rival|E], eles cometeram suicídio para evitar a desonra. A inimizade que resta é combustível promissor para a vingança."
 is_killed_by_you_and_you_kill_self:0 "@death_icon! cometerá suicídio para evitar a desonra nas mãos de [winner.GetShortUIName]"
 new_ceremonial_liege_message_effect:0 "[ceremonial_liege.GetTitledFirstName] ascendeu ao [ceremonial_title.GetDefinitiveName|l]"
 new_ceremonial_liege_message_title:0 "[ceremonial_liege.GetTitleAsNameNoTooltip] Entronizad[Select_CString( ceremonial_liege.IsFemale, 'a', 'o' )]"
 rival_eradicated_modifier:0 "Casa Rival Erradicada"
 rival_eradicated_modifier_desc:0 "Sua [house|E] julgou necessário ir à guerra e eliminar a linhagem de uma [house|E] [rival|E]. Enquanto outros julgam, o medo os cala."
 tgp_house_blocs.1001.a:0 "Estamos unidos!"
 tgp_house_blocs.1001.b:0 "Esta não é a minha guerra."
 tgp_house_blocs.1001.desc:0 "A liderança da Casa [bloc_leader.GetHouse.GetBaseName] é tão firme e audaz como sempre, e [bloc_leader.GetTitledFirstName] agora busca reunir nossa oposição a [defender.GetName].\n\nNenhum que esteja por trás, ou contra, o [bloc_leader.GetConfederation.GetName] pode ignorar nosso poder, e essa força vem da nossa unidade. Não surpreenderia encontrar combatentes de [ROOT.Char.GetHouse.GetBaseNameNoTooltip] entre as fileiras do exército de [bloc_leader.GetHouse.GetBaseNameNoTooltip]."
 tgp_house_blocs.1001.t:0 "[bloc_leader.GetConfederation.GetName]: Chamado às Armas"
 tgp_japan_general.8800.a:0 "M[Select_CString( family_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('family_1'))], [family_1.GetFirstNameNoTooltip], governará bem."
 tgp_japan_general.8800.b:0 "Deverá ser m[Select_CString( family_2.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('family_2'))], [family_2.GetFirstNamePossessiveNoTooltip]."
 tgp_japan_general.8800.c:0 "Que recaia sobre m[Select_CString( family_3.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('family_3'))], [family_3.GetFirstNameNoTooltip]."
 tgp_japan_general.8800.cadet_tt:0 "Fundará uma nova [house|E]"
 tgp_japan_general.8800.desc:0 "Minhas forças podem se orgulhar, tendo me servido bem e ao [attacker.GetConfederation.GetName] contra [war_loser.GetTitledFirstName]. O [target_title.GetName] está perdido, e é meu para conceder.\n\nSeria prudente garantir que estas terras permaneçam com um vassalo confiável e leal, que ouvirá minhas palavras e poderá ser chamado no futuro."
 tgp_japan_general.8800.e:0 "M[Select_CString( fallback_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fallback_1'))], [fallback_1.GetFirstNameNoTooltip], provará [Select_CString( fallback_1.IsFemale, 'a si mesma', 'a si mesmo' )]."
 tgp_japan_general.8800.f:0 "Confio em m[Select_CString( fallback_2.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fallback_2'))], [fallback_2.GetFirstNameNoTooltip]."
 tgp_japan_general.8800.g:0 "É m[Select_CString( fallback_3.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fallback_3'))], [fallback_3.GetFirstNameNoTooltip], quem o merece."
 tgp_japan_general.8800.h:0 "Ainda não decidi..."
 tgp_japan_general.8800.t:0 "A [ROOT.Char.GetConfederation.GetName] Expande"
 tgp_japan_general.9100.a:0 "Viva [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]!"
 tgp_japan_general.9100.desc:0 "\n\nEstou diante de meus vassalos, ajusto minha nova coroa, e [ROOT.Char.Custom('quirk_pos_personal_present')]. Ah, as coisas que realizarei!"
 tgp_japan_general.9100.desc_alive:0 "Agora cabe a mim liderar o vasto [title.GetTierAsNameNoTooltip] que [previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)] deixou para trás."
 tgp_japan_general.9100.desc_dead:0 "Com o falecimento de [previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)] $tgp_japan_general.9100.shoulders$"
 tgp_japan_general.9100.desc_joko:0 "Com a abdicação de [previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)] $tgp_japan_general.9100.shoulders$"
 tgp_japan_general.9100.desc_murdered:0 "Após a trágica e #EMP infeliz#! morte de [previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)] $tgp_japan_general.9100.shoulders$"
 tgp_japan_general.9100.shoulders:0 "a responsabilidade de liderar [title.GetTierAsNameNoTooltip] agora recai sobre meus ombros."
 tgp_japan_general.9100.t:0 "[Select_CString( ROOT.Char.IsFemale, 'Uma Nova', 'Um Novo' )] [ROOT.Char.GetTitleAsNameNoTooltip]"
 tgp_japan_general.9120.a:0 "É hora de entrar no claustro..."
 tgp_japan_general.9120.b:0 "#EMP Eu#! sou [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip], e #EMP eu#! governarei!"
 tgp_japan_general.9120.desc:0 "Com a partida d[Select_CString( previous_holder.IsFemale, 'a', 'o' )] [previous_holder.GetTitledFirstNamePossessive] e minha crescente influência, os assuntos do estado estão novamente sob a supervisão imperial.\n\nComo é costume, muitos esperam que eu raspe a cabeça e passe o trono para meu sucessor, [emperor_player_heir.GetFirstName], dado que a linha está segura, deixando as responsabilidades cerimoniais de um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] de lado para que eu possa focar nas políticas mais urgentes do dia."
 tgp_japan_general.9120.t:0 "Por Trás do Trono"
 tgp_japan_general.9300.a.disarmament_soryo:0 "$epidemic_events.1061.a$"
 tgp_japan_general.9300.a:0 "Assim seja."
 tgp_japan_general.9300.bandit_crackdown_law:0 "#EMP \"A complacência deu origem à bandidagem e depravação, e o povo sofre por isso. A ordem deve ser restaurada para o bem do [liege.GetPrimaryTitle.GetNameNoTierNoTooltip]!\"#!"
 tgp_japan_general.9300.ceremonial_liege:0 "Flanqueado por meus cortesãos e atendentes, observo estoicamente [liege.GetTitledFirstName] enquanto [liege.GetSheHe] rabisca e carimba, finalizando uma nova política para todos os [liege.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 tgp_japan_general.9300.defense_mobilization_law:0 "#EMP \"[liege.GetPrimaryTitle.GetNameNoTierNoTooltip] é ameaçado por novos perigos; se o país deve permanecer forte e livre, o povo deve se preparar para a guerra!\"#!"
 tgp_japan_general.9300.disarmament_law:0 "#EMP \"[liege.GetPrimaryTitle.GetNameNoTierNoTooltip] é assolado por conflitos e injustiças; a violência deve ser contida, e armas confiscadas de quem não tiver causa!\"#!"
 tgp_japan_general.9300.fortification_initative_law:0 "#EMP \"A ameaça de guerra paira sobre [liege.GetPrimaryTitle.GetNameNoTierNoTooltip]; para o bem de todos, devemos construir defesas fortes para nos preparar para o pior.\"#!"
 tgp_japan_general.9300.imperial_expansion_law:0 "#EMP \"Em tempos de necessidade, [liege.GetPrimaryTitle.GetNameNoTierNoTooltip] se defendeu justamente expandindo as fronteiras do país — mais uma vez devemos avançar!\"#!"
 tgp_japan_general.9300.isolation_law:0 "#EMP \"[liege.GetPrimaryTitle.GetNameNoTierNoTooltip] sofre sob influências corruptoras de estrangeiros, cujas ideias e interesses semeiam discórdia; eles devem ser afastados!\"#!"
 tgp_japan_general.9300.liege:0 "Sob o olhar solene d[Select_CString( ceremonial_liege.IsFemale, 'a', 'o' )] [ceremonial_liege.GetTitledFirstName], rabisco e carimbo os últimos detalhes do decreto, uma nova política para todos os [liege.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 tgp_japan_general.9300.manor_reform_law:0 "#EMP \"A grande prosperidade dos senhores de manor vem a custo do [liege.GetPrimaryTitle.GetNameNoTierNoTooltip] e do povo; suas propriedades devem ser contidas!\"#!"
 tgp_japan_general.9300.outro:0 "Mensageiros serão enviados em breve para todos os cantos de [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTooltip], proclamando o decreto d[Select_CString( ceremonial_liege.IsFemale, 'a', 'o' )] [ceremonial_liege.GetTitleAsNamePossessiveNoTooltip]:\n\n"
 tgp_japan_general.9300.religious_reform_law:0 "#EMP \"A vida de sacerdotes e do povo está em conflito. Os velhos dogmas devem ser examinados se quisermos renovar a alma do [liege.GetPrimaryTitle.GetNameNoTierNoTooltip]!\"#!"
 tgp_japan_general.9300.restored_emperor:0 "Flanqueado por meus cortesãos e atendentes, observo estoicamente os rabiscos e carimbos dos oficiais, enquanto finalizam minha nova política para todos os [liege.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 tgp_japan_general.9300.t.bandit_crackdown_law:0 "$tgp_japan_general.9300.t$ $bandit_crackdown_law$"
 tgp_japan_general.9300.t.defense_mobilization_law:0 "$tgp_japan_general.9300.t$ $defense_mobilization_law$"
 tgp_japan_general.9300.t.disarmament_law:0 "$tgp_japan_general.9300.t$ $disarmament_law$"
 tgp_japan_general.9300.t.fortification_initative_law:0 "$tgp_japan_general.9300.t$ $fortification_initative_law$"
 tgp_japan_general.9300.t.imperial_expansion_law:0 "$tgp_japan_general.9300.t$ $imperial_expansion_law$"
 tgp_japan_general.9300.t.isolation_law:0 "$tgp_japan_general.9300.t$ $isolation_law$"
 tgp_japan_general.9300.t.manor_reform_law:0 "$tgp_japan_general.9300.t$ $manor_reform_law$"
 tgp_japan_general.9300.t.religious_reform_law:0 "$tgp_japan_general.9300.t$ $religious_reform_law$"
 tgp_japan_general.9300.t:0 "$game_concept_imperial_policy$:"
 tgp_japan_general.9300.vassal:0 "Todos aguardam notícias do palácio imperial em [liege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], onde hoje [liege.GetTitledFirstName] proclamará uma nova política para todos os [liege.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 tgp_japan_general.9300.vassal_ceremonial:0 "Todos aguardam notícias do palácio imperial em [liege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], onde hoje [liege.GetTitledFirstName] proclamará uma nova política em nome de [ceremonial_liege.GetTitledFirstName].\n\n"
 tgp_japan_general.9550.a.alone.flavor:0 "Morro pelas minhas próprias mãos"
 tgp_japan_general.9550.a.alone:0 "Não terei uma morte ignóbil!"
 tgp_japan_general.9550.a.fam.flavor:0 "Morreremos pelas minhas próprias mãos! Meu herdeiro [loser_heir.GetShortUIName] fugirá para as terras do simpático [savior.GetName]"
 tgp_japan_general.9550.a.fam:0 "Não teremos uma morte ignóbil!"
 tgp_japan_general.9550.b.failure:0 "Você falha em escapar da erradicação."
 tgp_japan_general.9550.b.flavor:0 "Vamos nos reagrupar e um dia nos vingar dos [winner.GetHouse.GetNameNoTooltip]"
 tgp_japan_general.9550.b.success:0 "Você consegue escapar da erradicação."
 tgp_japan_general.9550.b:0 "Devemos usar nossas asas para fugir deste galinheiro!"
 tgp_japan_general.9550.c:0 "Devemos arriscar a misericórdia da raposa."
 tgp_japan_general.9550.desc.alone:0 "\n\nEu me encolho, sozinho."
 tgp_japan_general.9550.desc.end:0 "A cada segundo que passa, as raposas se aproximam das aves aprisionadas que nos tornamos.\n\nComo enfrentaremos nossos últimos momentos, nós da [ROOT.Char.GetHouse.GetNameNoTooltip]?"
 tgp_japan_general.9550.desc.fam:0 "\n\nMinha família e eu nos reunimos, apertados juntos."
 tgp_japan_general.9550.desc.intro.a:0 "Esta guerra, minha instigação, os dividendos, a perdição da minha casa."
 tgp_japan_general.9550.desc.intro.b:0 "Quem poderia imaginar que nossa rixa com [winner.GetHouse.GetNameNoTooltip] levaria a isso?"
 tgp_japan_general.9550.desc:0 "Os gritos dos meus guerreiros e atendentes se aproximam cada vez mais. Seus clamores desesperados são promessa do destino que em breve recairá sobre todos os [ROOT.Char.GetHouse.GetName]."
 tgp_japan_general.9550.t:0 "Encurralados para o Massacre"
 tgp_japan_general.9551.a.flavor:0 "Seus rostos malignos ornamentarão estacas fora de seu antigo solar"
 tgp_japan_general.9551.a:0 "Suas cabeças serão o arauto de sua erradicação!"
 tgp_japan_general.9551.desc.alt.escape:0 "fugiu para as terras de [savior.GetName]."
 tgp_japan_general.9551.desc.alt.intro:0 "Ó a astuta [loser.GetHouse.GetName]! Antes que pudéssemos capturar [loser.GetName], [loser.GetSheHe] "
 tgp_japan_general.9551.desc.alt.outro:0 "\n\nFelizmente ainda há outros [loser.GetHouse.GetNameNoTooltip] para matar."
 tgp_japan_general.9551.desc.alt.suicide:0 "se matou junto com seus mais próximos."
 tgp_japan_general.9551.desc.intro:0 "\"Ainda que seja blasfêmia, desejo renascer como eu mesmo, para que eu possa te matar na próxima vida, [winner.GetFirstNameNoTooltip]—\"\n\n[loser.GetTitledFirstName] rosna, antes que sua cabeça role pelo campo, sua boca ainda amaldiçoando-me em silêncio. Uma morte tão espiritualmente corrompida quanto ignóbil. O corpo sem cabeça [loser.GetHerHim] jaz molenga como uma galinha a ser depenada. Esse amontoado esfacelado de carne, não mais uma ameaça, não mais humano.\n\nO império está mais limpo na ausência da [loser.GetHouse.GetName]..."
 tgp_japan_general.9551.t:0 "Erradicar a [loser.GetHouse.GetNameNoTooltip]"
 tgp_japan_general_8800_custom:0 "Todos os outros possíveis recipientes"
 tgp_japan_soryo_eradicate_cb_heir_move_manor_to_savior_tt:0 "[loser_heir.GetShortUIName] moverá o [manor|E] [loser_heir.GetHouse.GetName] para [savior.GetCapitalLocation.GetBaronyNameExplicitly]"
 tgp_japan_soryo_eradicate_cb_heir_move_to_cap_tt:0 "Você moverá o [manor|E] [loser.GetHouse.GetName] para [loser_heir.GetTopLiege.GetCapitalLocation.GetBaronyNameExplicitly]"
 tgp_japan_soryo_eradicate_cb_heir_move_to_savior_tt:0 "Você moverá o [manor|E] [loser.GetHouse.GetName] para [savior.GetCapitalLocation.GetBaronyNameExplicitly]"
