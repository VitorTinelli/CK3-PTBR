 governance_documents:0 "\"Se um oficial abrir um documento selado sem autorização apropriada, como deve ser disciplinado?\""
 governance_filial:0 "\"Se um criminoso sem parentes conhecidos, condenado à morte, for perdoado após a execução, os documentos apropriados devem ser alterados para restaurar sua reputação?\""
 governance_reinstatement:0 "\"Um oficial merecedor é negado na reintegração, enquanto um oficial não merecedor é reintegrado. Como a situação deve ser julgada?\""
 governance_weaponry:0 "\"Alguém afirma possuir apenas uma lança, enquanto secretamente possui bestas. Qual punição deve ser aplicada?\""
