 hounds_history:0 "Cães de Lü"
 huan_annals:0 "Duque Huan"
 imperial_examination.1000.a.tt:0 "Você terá mais oportunidades de trapacear\n@alert_icon! #alert_trial Você pode ser pego!#! #weak (se permanecer oculto, ganhará um [secret|E] #V $secret_exam_cheater$#!)#!"
 imperial_examination.1000.a:0 "Terei sucesso, custe o que custar!"
 imperial_examination.1000.b:0 "Desejo provar meu valor de forma honrada."
 imperial_examination.1000.desc:0 "Entro na cidade de [ROOT.Char.GetCurrentLocation.GetName] para encontrar suas ruas varridas e ricamente decoradas para nossa chegada. As pessoas se curvam e murmuram orações de boa sorte enquanto passamos, enquanto apostadores fazem suas apostas nos cantos das ruas.\n\nPor toda parte que olho, vejo outros candidatos vestidos com suas melhores roupas de seda, partindo com suas cortesãs para as tavernas locais. Hoje, descubro até onde estou disposto a ir."
 imperial_examination.1000.t:0 "Os Candidatos se Reúnem"
 imperial_examination.1001.a:0 "A assembleia aguarda."
 imperial_examination.1001.desc:0 "Os futuros oficiais do governo enfileiram-se nas ruas de [ROOT.Char.GetCurrentLocation.GetName]. A cidade ganha vida, animada pelas finas vestes de seda dos candidatos e pelas belas cortesãs que os acompanham.\n\nPassar no Exame Imperial é provar um entendimento profundo das cinco virtudes que constituem o ápice do aprendizado confucionista.\n\nNão se trata apenas de recitação, mas de nutrir crença virtuosa e conduta moral."
 imperial_examination.1001.t:0 "$imperial_examination.1000.t$"
 imperial_examination.1002.a.tt:0 "[candidate.GetFirstNameNoTooltip] terá mais oportunidades de trapacear\n@alert_icon! #alert_trial [candidate.GetSheHe|U] pode ser pego!#! #weak (se [candidate.GetSheHe] permanecer oculto, [candidate.GetSheHe] ganhará um [secret|E] #V $secret_exam_cheater$#!)#!"
 imperial_examination.1002.a:0 "\"Tenha sucesso a qualquer custo, [ROOT.Char.Custom2('RelationToMe', candidate )].\""
 imperial_examination.1002.b:0 "\"Não envergonhe a casa [ROOT.Char.GetHouse.GetNameNoTooltip].\""
 imperial_examination.1002.desc:0 "Entro na cidade de [ROOT.Char.GetCurrentLocation.GetName] com m[Select_CString( candidate.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', candidate )] [candidate.GetTitledFirstName] ao meu lado. As ruas estão varridas e ricamente decoradas para nossa chegada.\n\nUma vez que [candidate.GetSheHe] esteja recolhid[Select_CString( candidate.IsFemale, 'a', 'o' )] nas acomodações dos candidatos, minha capacidade de influenciar o progresso [candidate.GetHerHim] será limitada. Talvez eu deva oferecer algumas palavras de conselho."
 imperial_examination.1002.t:0 "$imperial_examination.1000.t$"
 imperial_examination.1003.a:0 "$imperial_examination.1001.a$"
 imperial_examination.1003.desc:0 "Entro na cidade de [ROOT.Char.GetCurrentLocation.GetName], meus braços sobrecarregados por pergaminhos de estudo e materiais de aprendizado.\n\n"
 imperial_examination.1003.not_passed_exam:0 "Ainda não realizei o exame. Ainda assim, há muitas coisas que posso fazer para auxiliar os examinadores no evento, se desejar aprender antes de enfrentar o exame algum dia."
 imperial_examination.1003.passed_all_exams:0 "Como alguém que completou todos os níveis de exames, os examinadores agora me cumprimentam como um deles quando entro nas salas de estudo mais prestigiadas da cidade."
 imperial_examination.1003.passed_metropolitan_not_palace:0 "Lembro-me da liberação da lista quando passei no exame Metropolitano, a euforia que senti rapidamente azedou quando não entrei no top dez. Talvez, se eu me esforçar o suficiente, um dia chegue ao Exame do Palácio."
 imperial_examination.1003.passed_provincial_exam:0 "Hoje, descobrirei o que acontece dentro do estudo do examinador, como a tinta é misturada e os questionários preparados. Tendo completado o exame, agora é hora de cultivar [Glossary( 'guānxi', 'GUANXI_GLOSS' )]."
 imperial_examination.1003.t:0 "$imperial_examination.1000.t$"
 imperial_examination.1020.a.failure.tt:0 "Sua conversa casual não surte efeito"
 imperial_examination.1020.a.success.tt:0 "Você cria um vínculo com [new_entrant.GetShortUIName]"
 imperial_examination.1020.a:0 "\"Você também está nervos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]?\""
 imperial_examination.1020.b:0 "\"Tenho certeza de que tudo ficará bem!\""
 imperial_examination.1020.desc:0 "Na casa de hospedagem, noto outro candidato à mesa, com uma expressão séria enquanto roía ansiosamente as unhas [new_entrant.GetHerHim].\n\nAo olhar para el[Select_CString( new_entrant.IsFemale, 'a', 'e' )], nossos olhos se cruzam por um instante e inicio a conversa: \"Saudações — sou [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitledFirstNameNoTooltip]. Quem é você?\"\n\nO olhar [new_entrant.GetHerHim] vagueia inquieto pelo cômodo enquanto [new_entrant.GetSheHe] responde: \"[new_entrant.GetTitledFirstName]. E daí?\""
 imperial_examination.1020.t:0 "Novos Rostos"
 imperial_examination.1040.a.tt:0 "Você se torna dono de um [artifact|E] de pergaminho de [learning|E]"
 imperial_examination.1040.a.tt_equipped:0 "Comprou um [artifact_scroll.GetName]"
 imperial_examination.1040.a:0 "Devo procurar um pergaminho no mercado."
 imperial_examination.1040.b:0 "Devo comprar um presente para o anfitrião."
 imperial_examination.1040.c:0 "Não tenho tempo para distrações."
 imperial_examination.1040.d.tt.failure:0 "Você não aprende nada de útil"
 imperial_examination.1040.d.tt.success:0 "Você adquire conhecimentos valiosos"
 imperial_examination.1040.d:0 "Devo ver o que posso aprender com os locais."
 imperial_examination.1040.desc.again:0 "Mais uma vez, estou preso no caminho para uma sala de exames, atrás de candidatos de olhos arregalados que lutam para encontrar seu caminho pelas ruas da cidade."
 imperial_examination.1040.desc.outro:0 "\n\nOs futuros governadores se alinham na sala de admissões para anunciar sua chegada. Dado o tamanho da fila, parece que tenho tempo para explorar a cidade antes do início da assembleia."
 imperial_examination.1040.desc:0 "As ruas da cidade fervilham de atividade em preparação para o próximo exame. A antecipação enche o ar, e não posso deixar de me sentir empolgado também."
 imperial_examination.1040.e.tt.failure:0 "Você é derrotado pelos artistas marciais locais"
 imperial_examination.1040.e.tt.success:0 "Você derrota os artistas marciais locais"
 imperial_examination.1040.e:0 "Devo aperfeiçoar minhas habilidades no campo de treinamento!"
 imperial_examination.1040.t:0 "Apreciando a Cidade"
 imperial_examination.1050.a.failure.tt:0 "Seus argumentos não estão errados. Pior, estão obsoletos."
 imperial_examination.1050.a.failure:0 "[examiner.GetTitledFirstName] não ficou impressionad[Select_CString( examiner.IsFemale, 'a', 'o' )]"
 imperial_examination.1050.a.success.tt:0 "[examiner.GetTitledFirstName] ficou impressionad[Select_CString( examiner.IsFemale, 'a', 'o' )]"
 imperial_examination.1050.a:0 "Impressionar com uma análise profunda dos clássicos."
 imperial_examination.1050.b.failure.tt:0 "Você foi peg[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] plagiando"
 imperial_examination.1050.b.success.tt:0 "[examiner.GetTitledFirstName] ficou impressionad[Select_CString( examiner.IsFemale, 'a', 'o' )]"
 imperial_examination.1050.b:0 "Apropriar-se do trabalho de outro candidato."
 imperial_examination.1050.c:0 "Provarei meu valor no exame."
 imperial_examination.1050.desc:0 "É fácil localizar o examinador [examiner.GetTitledFirstName], cercado por outros candidatos que se agrupam como pavões, exibindo pergaminhos de caligrafia e envolvendo [examiner.GetSheHe] em debates eruditos.\n\nDestacar-se e causar uma primeira impressão duradoura nessa multidão não seria tarefa fácil, competindo com esse bando de sociais selvagens."
 imperial_examination.1050.t:0 "Primeiras Impressões"
 imperial_examination.1060.b.tt:0 "[entrant_to_meet.GetTitledFirstName] #BOL Aumentou#! a chance de #BOL sucesso#! devido a [exam_advantage|E]"
 imperial_examination.1060.b:0 "Grandes fortunas virão para aqueles que mostram tal generosidade."
 imperial_examination.1060.c:0 "Vamos aproveitar juntos!"
 imperial_examination.1060.d:0 "Eu irei aproveitar isso!"
 imperial_examination.1060.desc:0 "Um aroma agradável de bolos frescos corta a mistura potente de candidatos suados e pergaminhos empoeirados que permeia o edifício do exame.\n\n\"Trouxe-lhe este humilde presente de minha província natal, [ROOT.Char.GetTitleAsNameNoTooltip]\", diz [entrant_to_meet.GetTitledFirstName], um candidato promissor no próximo exame.\n\n[entrant_to_meet.GetSheHe|U] se curva e apresenta uma caixa de incrustações de madeira de rosa e osso: a fonte do cheiro delicioso e uma clara tentativa de conquistar meu favor."
 imperial_examination.1060.t:0 "Um Doce Agrado"
 imperial_examination.1070.a:0 "Aqueles que compartilham meus interesses devem ser promissores."
 imperial_examination.1070.b.tt:0 "Todo [entrant|E] com os traços [GetTrait('compassionate').GetName(GetNullCharacter)], [GetTrait('just').GetName(GetNullCharacter)], [GetTrait('honest').GetName(GetNullCharacter)] ou [GetTrait('scholar').GetName(GetNullCharacter)] recebe uma #BOL maior#! chance de #BOL sucesso#!"
 imperial_examination.1070.b:0 "Todos que seguem o credo confucionista são dignos."
 imperial_examination.1070.c:0 "Deixarei a julgamento dos examinadores."
 imperial_examination.1070.d.tt:0 "Todo [entrant|E] da sua [dynasty|E] ganha uma #BOL maior#! chance de #BOL sucesso#!"
 imperial_examination.1070.d:0 "Aqueles que são descendentes do filho do céu, é claro."
 imperial_examination.1070.desc:0 "Não posso deixar de imaginar que tipo de candidatos tentarão o exame.\n\nAs [Glossary( 'quatro maneiras', 'FOUR_WAYS_GLOSS' )] de seleção de um oficial sem dúvida determinarão o favor dos candidatos junto aos examinadores. Como [ROOT.Char.GetTitleAsNameNoTooltip], tenho o poder de determinar o que constitui valores #EMP bons#!"
 imperial_examination.1070.t:0 "Um Candidato Muito Favorável"
 imperial_examination.2000.a.tt:0 "[entrant_to_meet.GetTitledFirstName] #BOL Aumentou#! a chance de #BOL sucesso#! devido a [exam_advantage|E]"
 imperial_examination.2000.a:0 "Avisarei os examinadores sobre o nome [entrant_to_meet.GetHerHim]."
 imperial_examination.2000.b:0 "[entrant_to_meet.GetTitleByKey] pode ir longe, com alguma ajuda."
 imperial_examination.2000.c:0 "Infelizmente, meus padrões são mais altos do que estes."
 imperial_examination.2000.desc.fallback:0 "[entrant_to_meet.GetSheHe|U] está sentad[Select_CString( entrant_to_meet.IsFemale, 'a', 'o' )] cercad[Select_CString( entrant_to_meet.IsFemale, 'a', 'o' )] por um pequeno grupo de candidatos, discutindo os clássicos com pontos de vista interessantes, embora um pouco sem inspiração."
 imperial_examination.2000.desc.scoreboardee:0 "Já, [entrant_to_meet.GetSheHe] recita facilmente passagens dos clássicos para uma plateia atenta. Eu também me vejo atraído pelas questões instigantes que [entrant_to_meet.GetSheHe] levanta sobre os textos."
 imperial_examination.2000.desc:0 "O homem age com seu melhor comportamento diante da autoridade. Assim, como [ROOT.Char.GetTitleAsNameNoTooltip], preciso pegar meus súditos desprevenidos para descobrir quem é decente e quem é apenas um bom mentiroso.\n\nSaio das minhas acomodações vestido com uma túnica simples, escondendo-me na multidão para formar uma leitura mais precisa dos candidatos.\n\n[entrant_to_meet.GetTitledFirstName] se destaca como uma figura promissora."
 imperial_examination.2000.t:0 "[ROOT.Char.GetTitleAsNameNoTooltip], ou Ninguém"
 imperial_examination.2010.a.tt:0 "[entrant_to_meet.GetTitledFirstName] #BOL Aumentou#! a chance de #BOL sucesso#! devido a [exam_advantage|E]"
 imperial_examination.2010.a:0 "[entrant_to_meet.GetShortUINameNoTooltip] merece algum reconhecimento."
 imperial_examination.2010.b.tt:0 "[entrant_to_meet_2.GetTitledFirstName] #BOL Aumentou#! a chance de #BOL sucesso#! devido a [exam_advantage|E]"
 imperial_examination.2010.b:0 "Meu desapontamento com um[Select_CString( entrant_to_meet_2.IsFemale, 'a', '' )] [ROOT.Char.Custom2('RelationToMe', entrant_to_meet_2 )] precisa de toda ajuda que [entrant_to_meet_2.GetSheHe] possa obter."
 imperial_examination.2010.c:0 "Creio que não."
 imperial_examination.2010.desc.one:0 "\"Vejo que [dynasty_member.GetTitledFirstName] chegou ao exame\", diz meu examinador [examiner.GetTitledFirstName]. \"Deve estar satisfeit[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )].\"\n\n"
 imperial_examination.2010.desc.outro:0 "Os olhos de [examiner.GetFirstNamePossessiveNoTooltip] percorrem a lista de candidatos, e posso ver o inconfundível volume na bolsa de moedas do examinador devido a subornos já recebidos de chefes de dinastias preocupados.\n\nSem dúvida, eu mesmo poderia fazer uma pequena contribuição, a fim de ajudar um membro da minha casa."
 imperial_examination.2010.desc.two:0 "\"Deve ser bom ter tantos membros de sua dinastia presentes para o exame\", diz meu examinador [examiner.GetTitledFirstName]. \"Embora eu não tenha grandes expectativas para [entrant_to_meet_2.GetTitledFirstName].\"\n\n"
 imperial_examination.2010.t:0 "Preparando o Palco"
 imperial_examination.2030.a.tt:0 "[dynasty_member.GetTitledFirstName] #BOL Aumentou#! a chance de #BOL sucesso#! devido a [exam_advantage|E]"
 imperial_examination.2030.a:0 "Nenhum mero plebeu ofuscará meus familiares!"
 imperial_examination.2030.b:0 "Ficarei de olho neste."
 imperial_examination.2030.c:0 "De fato, todos são iguais sob os céus."
 imperial_examination.2030.desc.exclusive:0 "\"Mais gracios[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip], sinto-me envergonhad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] em admitir que um plebeu sem nome conseguiu entrar nas salas de exame, esperando provar a [Select_CString( promising_lowborn.IsFemale, 'si mesma', 'si mesmo' )].\""
 imperial_examination.2030.desc.open:0 "\"Como esperado com o grande número de candidatos neste exame, vários plebeus tentam se destacar.\""
 imperial_examination.2030.desc.outro:0 "[Select_CString( examiner.IsFemale, 'A', 'O' )] examinador[Select_CString( examiner.IsFemale, 'a', '' )] [examiner.GetTitledFirstName] me informa, olhando para o pátio através da janela.\n\n[examiner.GetTitledFirstName] aponta para um[Select_CString( promising_lowborn.IsFemale, 'a', '' )] [promising_lowborn.GetWomanMan] jovem, que parece estar envolvid[Select_CString( promising_lowborn.IsFemale, 'a', 'o' )] em uma acalorada discussão com dois nobres.\n\n\"[promising_lowborn.GetTitledFirstName], é o nome [promising_lowborn.GetHerHim]. Apesar de sua postura rústica, devo admitir que [promising_lowborn.GetSheHe] demonstra um potencial excepcional.\""
 imperial_examination.2030.desc.restricted:0 "\"Apesar de limitar a admissão do público geral, algum plebeu sempre consegue se infiltrar no exame.\""
 imperial_examination.2030.t:0 "Uma Jade Bruta"
 imperial_examination.2040.a:0 "[rumored_examiner.GetFirstNameNoTooltip] pagará recompenças ao império."
 imperial_examination.2040.b.tt:0 "[dynasty_member.GetTitledFirstName] #BOL Aumentou#! a chance de #BOL sucesso#! devido a [exam_advantage|E]"
 imperial_examination.2040.b:0 "Conheço alguém que poderia usar um pouco de #EMP ajuda#!."
 imperial_examination.2040.c:0 "O exame seguirá normalmente."
 imperial_examination.2040.d:0 "Prendam ess[Select_CString( rumored_examiner.IsFemale, 'a', 'e' )] [rumored_examiner.GetWomanMan] vergonhos[Select_CString( rumored_examiner.IsFemale, 'a', 'o' )]!"
 imperial_examination.2040.desc:0 "Dizem por aí que o examinador [rumored_examiner.GetTitledFirstName] está #EMP recebendo benefícios#! por favorecer certos candidatos. \n\nDe fato, a bolsa [rumored_examiner.GetHerHim] parece abarrotada de moedas, e [rumored_examiner.GetSheHe] se mistura com os candidatos mais do que convém à sua posição. \n\nNenhuma investigação é necessária. Est[Select_CString( rumored_examiner.IsFemale, 'a', 'e' )] [rumored_examiner.GetWomanMan] macula meu exame!"
 imperial_examination.2040.t:0 "Suborno na Mão"
 imperial_examination.3000.a:0 "Começa."
 imperial_examination.3000.desc:0 "Após rigorosa verificação para erradicar qualquer trapaça, os candidatos alinham-se para realizar o exame. Contemplo-os do meu palácio, observando seus rostos expectantes e posturas rígidas. \n\nO sino ressoa da torre do pátio, seguido pela batida de tambores pesados — sons que reverberam sob meus pés e enchem meu coração de justa exaltação."
 imperial_examination.3000.t:0 "O Badalo do Sino"
 imperial_examination.3005.a:0 "Este é um bom lugar para ser visto."
 imperial_examination.3005.b:0 "Devo me misturar à multidão..."
 imperial_examination.3005.desc.martial:0 "O suor escorre pelas minhas costas por carregar flechas para reabastecer aljavas, pequenas cortes cobrem minhas mãos por afiar lâminas."
 imperial_examination.3005.desc.outro.impatient:0 "Por mais que eu deteste admitir, tudo o que podemos fazer agora é esperar."
 imperial_examination.3005.desc.outro:0 "Tudo o que podemos fazer agora é esperar."
 imperial_examination.3005.desc.scholar:0 "O suor escorre pelas minhas costas por carregar pergaminhos entre as cabines de exame, manchas de tinta tingem minhas pontas dos dedos de preto por recarregar os tinteiros."
 imperial_examination.3005.desc:0 "Um silêncio cai na taverna quando os sinos tocam por toda [ROOT.Char.GetCurrentLocation.GetName]. Os portões das salas de exame são fechados.\n\nAo meu redor, vejo pais e anciãos debatendo em sussurros, tentando deduzir o resultado dos testes vindouros. Um esforço em vão."
 imperial_examination.3005.t:0 "$imperial_examination.3000.t$"
 imperial_examination.3006.a:0 "Agora, o trabalho de verdade começa."
 imperial_examination.3006.desc:0 "A antecipação paira no ar enquanto os sinos tocam por toda [ROOT.Char.GetCurrentLocation.GetName]. Os portões das salas de exame estão fechados.\n\nEu sigo de perto [Select_CString( examiner.IsFemale, 'a', 'o' )] examinador[Select_CString( examiner.IsFemale, 'a', '' )] [examiner.GetTitledFirstName]."
 imperial_examination.3006.t:0 "$imperial_examination.3000.t$"
 imperial_examination.3007.a.success_tooltip_first:0 "#weak Para passar no Exame Metropolitano, você precisa de uma pontuação de #V 50#!. Para fazer o Exame do Palácio, é necessário ficar entre os dez melhores.#!"
 imperial_examination.3007.a:0 "Hora de provar meu valor."
 imperial_examination.3007.desc:0 "Com um gemido e um pesado estrondo, os portões do complexo de exames se fecham. Os sinos do pátio tocam, convocando-nos a nos reunir."
 imperial_examination.3007.t:0 "$imperial_examination.3000.t$"
 imperial_examination.3010.a:0 "O trapaceiro pode redimir-se ao meu serviço."
 imperial_examination.3010.b:0 "Quem deve ser punido é o examinador!"
 imperial_examination.3010.c:0 "Deixarei os examinadores resolverem isso."
 imperial_examination.3010.desc:0 "Pauso do lado do escritório dos examinadores, atraído pela conversa em voz baixa. \"Nunca vi um trapaceiro tão engenhoso antes\", diz [Select_CString( examiner.IsFemale, 'a', 'o' )] examinador[Select_CString( examiner.IsFemale, 'a', '' )] [examiner.GetTitledFirstName]."
 imperial_examination.3010.martial:0 "[entrant.GetTitledFirstName] sabotou o arco de seu rival fazendo um corte quase imperceptível no cabo, para que a arma se quebrasse apenas quando fosse tensionada."
 imperial_examination.3010.outro:0 "\n\n[Select_CString( examiner_2.IsFemale, 'A', 'O' )] examinador[Select_CString( examiner_2.IsFemale, 'a', '' )] [examiner_2.GetTitledFirstName] balança a cabeça e murmura: \"Se ao menos [entrant.GetSheHe] aplicasse tais habilidades para passar o teste por meios honestos. [entrant.GetSheHe|U] seria um[Select_CString( entrant.IsFemale, 'a', '' )] funcionári[Select_CString( entrant.IsFemale, 'a', 'o' )] formidável do Estado.\""
 imperial_examination.3010.scholarship:0 "\"A única razão de eu ter notado que as meias d[Select_CString( entrant.IsFemale, 'a', 'o' )] [entrant.GetTitledFirstName] estavam repletas de respostas foi porque [entrant.GetSheHe] acidentalmente se molhou!\""
 imperial_examination.3010.t:0 "Uma Erva entre as Flores"
 imperial_examination.3020.a:0 "[entrant.GetSheHe|U] receberá uma séria repreensão."
 imperial_examination.3020.b:0 "Envie [entrant.GetSheHe] para casa imediatamente!"
 imperial_examination.3020.c:0 "Ah, isso é apenas um golpe de calor, nada mais."
 imperial_examination.3020.desc.outro:0 "\n\nOs examinadores ficam boquiabertos com a cena dramática, intervindo rapidamente, mas o estrago já está feito. Todos os candidatos testemunharam meu membro da própria dinastia se desmoronar diante deles."
 imperial_examination.3020.desc:0 "Uma voz familiar ecoa das cabines de exame, tirando-me de meus aposentos. Encontro m[Select_CString( entrant.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entrant'))] [entrant.GetTitledFirstName] arrancando os próprios cabelos e murmurando incoerências.\n\n"
 imperial_examination.3020.desc_martial:0 "[entrant.GetSheHe|U] abandonou sua arma de haste na grama, deixando o oponente coçando o capacete."
 imperial_examination.3020.desc_scholarship:0 "[entrant.GetSheHe|U] deixou sua cabine, ainda segurando [entrant.GetSheHe] com expressão pálida e frenética no rosto."
 imperial_examination.3020.t:0 "Uma Mancha Sobre Meu Nome"
 imperial_examination.3030.a.flavor:0 "A punição coletiva nunca falha em atingir seu alvo."
 imperial_examination.3030.a:0 "Isso põe em dúvida todos os resultados!"
 imperial_examination.3030.b:0 "Lembrarei disso."
 imperial_examination.3030.c:0 "Ninguém percebeu, além de nós, certamente."
 imperial_examination.3030.desc:0 "Chega até mim a notícia de que [Select_CString( examiner.IsFemale, 'a', 'o' )] examinador[Select_CString( examiner.IsFemale, 'a', '' )] [examiner.GetFirstName] está cochilando diante dos candidatos. Tudo começou com um cotovelo escorregando sobre a mesa, e logo [Select_CString( examiner.IsFemale, 'a', 'o' )] [examiner.GetWomanMan] estava roncando! \n\n[examiner.GetSheHe|U] está acordad[Select_CString( examiner.IsFemale, 'a', 'o' )] agora, mas quem sabe o que os candidatos fizeram enquanto [examiner.GetSheHe] dormia?"
 imperial_examination.3030.t:0 "Dormindo no Dever"
 imperial_examination.4000.a:0 "Eu #EMP preciso#! de toda a ajuda possível..."
 imperial_examination.4000.b.cheater:0 "Faz sentido..."
 imperial_examination.4000.b:0 "Não, isso está errado."
 imperial_examination.4000.desc:0 "Letras, símbolos... Quando fecho os olhos, posso visualizar fragmentos dos textos que passei o dia estudando. Cada traço parece flutuar no escuro, mas seu significado continua evasivo. Terei tempo de dominar todas as interpretações necessárias?\n\nOutro candidato se aproxima de mim, suas vestes roçando contra os meus. \"Não faz bem à mente ficar acordado a noite toda por causa de um exame. Você tem a vida inteira para aprender. Deixe-me fazer o teste no seu lugar, e descanse sua cabeça cansada.\""
 imperial_examination.4000.t:0 "Com Uma Pequena Ajuda"
 imperial_examination.4010.a:0 "Devo me apresentar."
 imperial_examination.4010.b:0 "Não vale o risco."
 imperial_examination.4010.desc:0 "A cada passo do examinador [examiner_to_bribe.GetFirstName], o som de moedas tilintando o acompanha. Sua bolsa está abarrotada. Em várias ocasiões, vejo [examiner_to_bribe.GetSheHe] em conversas baixas com candidatos, tentando e falhando em escapar de olhares curiosos.\n\nEstá claro que est[Select_CString( examiner_to_bribe.IsFemale, 'a', 'e' )] [examiner_to_bribe.GetWomanMan] está no negócio de acordos #EMP lucrativos#!..."
 imperial_examination.4010.t:0 "Vantagens em Salas Escuras"
 imperial_examination.4020.a:0 "Só mais um pouco..."
 imperial_examination.4020.b:0 "Não consigo continuar assim."
 imperial_examination.4020.desc:0 "Sento-me sobre meus livros, vasculhando freneticamente página após página, em um esforço para memorizar todas as letras possíveis para o próximo exame.\n\nUma leve dor na testa me faz perceber o quanto estou semicerrando os olhos na sala mal iluminada. Levanto-me para molhar o pescoço com água e aliviar o esforço mental."
 imperial_examination.4020.t:0 "Desventuras Noturnas"
 imperial_examination.4030.a:0 "\"Por onde começamos?\""
 imperial_examination.4030.b:0 "\"Bem, eu não me importaria de estudar #EMP com você#!...\""
 imperial_examination.4030.c:0 "\"Tenho outro compromisso.\""
 imperial_examination.4030.desc:0 "\"[ROOT.Char.GetTitledFirstNameNoTooltip]! Como você está? Quer se juntar a mim para mais preparativos para o exame?\" m[Select_CString( friendly_entrant.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', friendly_entrant)], [friendly_entrant.GetTitledFirstName], acena de sua confortável cadeira um pouco mais adiante.\n\nÀ frente [friendly_entrant.GetHerHim] está uma mesa cheia de pincéis de caligrafia secando e dezenas de volumosos livros de poesia."
 imperial_examination.4030.outro.lover:0 "\n\n[Did friendly_entrant.GetSheHe] sempre foi tão #EMP atraente#!?"
 imperial_examination.4030.outro:0 "\n\nPenso por um momento, considerando a proposta. Estudar juntos #EMP teria#! suas vantagens..."
 imperial_examination.4030.t:0 "... Com Meus Amigos"
 imperial_examination.4050.a:0 "Conheço o jogo de bebida perfeito!"
 imperial_examination.4050.b:0 "Prefiro compartilhar um momento a sós com você."
 imperial_examination.4050.c:0 "Tenho outro compromisso."
 imperial_examination.4050.desc:0 "\"Alguns de nós estamos planejando compartilhar uma garrafa de Baijiu juntos. Você se juntará a nós, não é?\" pergunta m[Select_CString( friendly_entrant.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', friendly_entrant)], [friendly_entrant.GetTitledFirstName], chamando-me enquanto estou junto a um lago no pátio, admirando como a luz do sol reflete nas escamas dos peixes."
 imperial_examination.4050.t:0 "Baijiu Noturno"
 imperial_examination.4060.a.failure:0 "Você acaba se ridicularizando."
 imperial_examination.4060.a.success:0 "Você ridiculariza [Select_CString( promising_lowborn.IsFemale, 'a', 'o' )] desconhecid[Select_CString( promising_lowborn.IsFemale, 'a', 'o' )]."
 imperial_examination.4060.a:0 "Vou mostrar para [promising_lowborn.GetSheHe]!"
 imperial_examination.4060.b:0 "Talvez [promising_lowborn.GetSheHe] tenha pontos válidos?"
 imperial_examination.4060.c:0 "Recuso-me a reagir."
 imperial_examination.4060.d.tt:0 "Você faz com que [promising_lowborn.GetTitledFirstName] seja expuls[Select_CString( promising_lowborn.IsFemale, 'a', 'o' )] do exame, devido à suspeita sobre a ocupação de sua família."
 imperial_examination.4060.d:0 "S[Select_CString( promising_lowborn.IsFemale, 'ua', 'eu' )] [promising_lowborn.Custom('GetDaughterSon')] de uma prostituta!"
 imperial_examination.4060.desc_learning:0 "Debato com meus pares na hospedaria quando uma voz nasal e irritante interrompe meu argumento, dizendo: \"Essa é uma ideia baixa e altamente discutível!\"\n\nVolto-me para o falante, um[Select_CString( promising_lowborn.IsFemale, 'a', '' )] desconhecid[Select_CString( promising_lowborn.IsFemale, 'a', 'o' )] de [ROOT.Char.GetCurrentLocation.GetName]. Há mais de uma hora, [promising_lowborn.GetSheHe] zombava e revirava os olhos a cada palavra minha.\n\nOutros estudiosos riem de mim quanto mais fico sem reagir a esses insultos."
 imperial_examination.4060.desc_martial:0 "Olho para o pátio fora da hospedaria e noto um gol de [Glossary('cuju','CUJU_GLOSS')] sendo erguido, e um murmúrio de empolgação surge da multidão.\n\nColido com outro candidato a caminho do jogo. [Select_CString( promising_lowborn.IsFemale, 'A', 'O' )] [promising_lowborn.GetWomanMan], um[Select_CString( promising_lowborn.IsFemale, 'a', '' )] desconhecid[Select_CString( promising_lowborn.IsFemale, 'a', 'o' )] de [ROOT.Char.GetCurrentLocation.GetName], zombou de mim e disse: \"E para onde você pensa que vai? Não será para o jogo, espero, com essas pernas finas suas. Elas certamente vão quebrar como gravetos!\"\n\nAs pessoas ao redor riem da insolência [promising_lowborn.GetHerHim]. Se eu nada fizer, a diversão da multidão certamente se voltará contra mim."
 imperial_examination.4060.t:0 "Um Potencial Rival"
 imperial_examination.4070.a.failure:0 "Os planos de s[Select_CString( parent.IsFemale, 'ua', 'eu' )] [parent.GetMotherFatherPossessive] foram expostos"
 imperial_examination.4070.a.success:0 "S[Select_CString( parent.IsFemale, 'ua', 'eu' )] [parent.GetMotherFather] esconde com sucesso suas intenções"
 imperial_examination.4070.a:0 "Só se [parent.GetSheHe] conseguir ser discret[Select_CString( parent.IsFemale, 'a', 'o' )]."
 imperial_examination.4070.b:0 "Posso suportar a indignidade para ter sucesso."
 imperial_examination.4070.c:0 "[parent.GetMotherFather|U], por favor! Vá #EMP embora#!."
 imperial_examination.4070.desc:0 "Ouço uma voz familiar fora da sala de exames e fico surpres[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] ao ver m[Select_CString( parent.IsFemale, 'inha', 'eu' )] [parent.GetMotherFather] conversando com [examiner.GetTitledFirstName].\n\nPuxo m[Select_CString( parent.IsFemale, 'inha', 'eu' )] [parent.GetMotherFather] para o lado e pergunto o que está fazendo aqui, ao que responde alegremente: \"Só quero ajudá-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. Tenho conexões também, sabe! Deixe-me apenas colocar seu nome à frente e garantir que você tenha a chance de ter sucesso.\"\n\nOlho ao redor para garantir que nenhum dos meus colegas nos tenha notado. Por enquanto, ainda tenho tempo de enviar [parent.GetTitledFirstName] para casa sem prejudicar minha reputação."
 imperial_examination.4070.t:0 "Apoio Familiar Não Solicitado"
 imperial_examination.4080.a:0 "Prefiro a obra de [examiner_1.GetTitledFirstNameNoTooltip]."
 imperial_examination.4080.b:0 "[examiner_2.GetTitledFirstNameNoTooltip] é [Select_CString( examiner_2.IsFemale, 'a', 'o' )] estudios[Select_CString( examiner_2.IsFemale, 'a', 'o' )] mais virtuos[Select_CString( examiner_2.IsFemale, 'a', 'o' )]."
 imperial_examination.4080.c:0 "Gosto de ambos igualmente."
 imperial_examination.4080.desc:0 "Para onde quer que eu vá, o burburinho de debates acadêmicos me segue.\n\nDuas vozes particularmente acaloradas sobressaem-se da multidão, e viro uma esquina para encontrar [examiner_1.GetTitledFirstName] e [examiner_2.GetTitledFirstName], dois notórios rivais acadêmicos, envolvidos em mais uma acalorada discussão. Nomeadamente, quem escreveu o estudo mais notável sobre [examiner_1.Custom('EruditeTopic')].\n\n[examiner_1.GetTitledFirstName] cruza meu olhar e pergunta: \"Então, qual texto você #EMP prefere#!?\""
 imperial_examination.4080.t:0 "O Caminho Diverge"
 imperial_examination.4090.a:0 "Estou ansios[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] para conhecê-los!"
 imperial_examination.4090.b.tt:0 "Sua dedicação aos estudos rende [merit_i][merit|E]."
 imperial_examination.4090.b:0 "Tenho textos importantes para ler."
 imperial_examination.4090.desc:0 "Uma sensação de antecipação nervosa preenche a hospedaria, dispersada apenas pela agradável presença d[Select_CString( other_entrant.IsFemale, 'a', 'o' )] m[Select_CString( other_entrant.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('other_entrant'))] [other_entrant.GetTitledFirstName].\n\nCom [other_entrant.GetSheHe], não preciso me explicar, e cada palavra minha ressoa profundamente. Nossas discussões ganham vida própria, surpreendendo-nos com seus altos e baixos!\n\nEventualmente, [other_entrant.GetSheHe] inclina-se para frente e diz: \"Conheço alguns outros indivíduos com interesses semelhantes que estariam ansiosos para conhecê-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], se você quiser que eu faça as apresentações.\""
 imperial_examination.4090.t:0 "Pássaros da Mesma Pena"
 imperial_examination.4100.a.failure:0 "[other_entrant.GetTitledFirstNameNoTooltip] não está convencid[Select_CString( other_entrant.IsFemale, 'a', 'o' )]"
 imperial_examination.4100.a.success:0 "[other_entrant.GetTitledFirstNameNoTooltip] está convencid[Select_CString( other_entrant.IsFemale, 'a', 'o' )] a trapacear com você"
 imperial_examination.4100.a:0 "Compartilhar respostas para agradar [other_entrant.GetTitledFirstNameNoTooltip]."
 imperial_examination.4100.b.failure:0 "[other_entrant.GetTitledFirstNameNoTooltip] não foi enganad[Select_CString( other_entrant.IsFemale, 'a', 'o' )]"
 imperial_examination.4100.b.success:0 "[other_entrant.GetTitledFirstNameNoTooltip] acredita na sua mentira"
 imperial_examination.4100.b:0 "\"Estou aqui para entrar na mentalidade do estudante.\""
 imperial_examination.4100.c:0 "Jogar o papel em uma poça próxima."
 imperial_examination.4100.desc:0 "Caminho com cuidado entre as cabines de exame, na esperança de colocar um pequeno pedaço de papel preparado com algumas informações #EMP úteis#! antes do próximo teste.\n\nNo momento em que encontro uma tábua solta na parede de uma cabine, ouço uma tosse intencional atrás de mim. M[Select_CString( other_entrant.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('other_entrant'))] [other_entrant.GetTitledFirstName] conseguiu se aproximar sem fazer barulho.\n\n[other_entrant.GetSheHe|U] pergunta: \"O que você está fazendo aí?\""
 imperial_examination.4100.t:0 "Uma Folha de Papel"
 imperial_examination.5000.a.cheater:0 "Farei o meu melhor..."
 imperial_examination.5000.a:0 "Onde está meu pincel!"
 imperial_examination.5000.b:0 "\"[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], vá!\""
 imperial_examination.5000.c:0 "\"Examinador [ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], por favor, dê uma olhada na #EMP minha#! resposta...\""
 imperial_examination.5000.d:0 "\"Examinador [ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip], você se lembra do meu #EMP parent#!, não é?\""
 imperial_examination.5000.desc.cheater:0 "Sinto os olhares dos meus pares queimando a nuca enquanto entro na sala de exames e encontro minha cabine. Quantos sabem da minha transgressão? Estou imaginando coisas? Preciso deixar esses pensamentos de lado e focar na redação que se aproxima."
 imperial_examination.5000.desc:0 "[Select_CString( examiner.IsFemale, 'A', 'O' )] examinador[Select_CString( examiner.IsFemale, 'a', '' )] [examiner.GetTitledFirstName] me lança um olhar mortificante enquanto me acomodo na cadeira, tentando me concentrar antes da redação."
 imperial_examination.5000.desc_bridge:0 "\n\nSou solicitad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a abordar o seguinte tema:"
 imperial_examination.5000.e:0 "#EMP dar uma olhada na folha de respostas escondida#!"
 imperial_examination.5000.f:0 "$imperial_examination.5000.d$"
 imperial_examination.5000.t:0 "As Perguntas Comuns"
 imperial_examination.5050.a:0 "Como falou o Mestre Kong..."
 imperial_examination.5050.annals:0 "\"Para analisar a natureza das verdades e mentiras, de acordo com os Anais da Primavera e do Outono, é necessário aprender com a tolice das dinastias passadas.\"$imperial_examination.5050.desc$ Preciso elaborar sobre [ROOT.Char.Custom('GetRandomAnnalsPassage')]."
 imperial_examination.5050.b:0 "\"[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], vá!\""
 imperial_examination.5050.c:0 "\"Examinador [ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], se você ver o #EMP meu#! lado da história...\""
 imperial_examination.5050.changes:0 "\"Para superar dificuldades materiais, de acordo com o Livro das Mutações, é preciso encontrar-se como parte do universo.\"$imperial_examination.5050.desc$ Sou instad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a descrever meu entendimento sobre os modos de adivinhação no texto, das inúmeras linhas às Seis Bestas."
 imperial_examination.5050.d:0 "\"Examinador [ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip], minha #EMP família#! sempre favoreceu este texto.\""
 imperial_examination.5050.desc:0 "\n\nAssim se lê a declaração de abertura no questionário à minha frente. O espaço vazio no meio do [ROOT.Char.Custom('GetWritingMaterial')] parece imensamente grande.\n\nPara este teste,"
 imperial_examination.5050.e:0 "$imperial_examination.5000.e$"
 imperial_examination.5050.f:0 "$imperial_examination.5050.d$"
 imperial_examination.5050.history:0 "\"Para seguir os registros das regulamentações, de acordo com o Livro da História, é necessário conhecer os governantes do passado.\"$imperial_examination.5050.desc$ Sou solicitad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a demonstrar meu conhecimento do discurso [ROOT.Char.Custom('GetRandomHistoryPassage')]."
 imperial_examination.5050.poetry:0 "\"Para refletir sobre o comportamento humano, de acordo com o Livro da Poesia, é preciso estabelecer um espelho de autorreflexão.\"$imperial_examination.5050.desc$ Tenho a tarefa de interpretar os poemas [ROOT.Char.Custom('GetRandomPoetryPassage')]."
 imperial_examination.5050.rites:0 "\"Para compreender a ordem do mundo, de acordo com o Livro dos Ritos, é preciso respeitar o devido cerimonial.\"$imperial_examination.5050.desc$ Necessito listar as principais afirmações de [ROOT.Char.Custom('GetRandomRitesPassage')]."
 imperial_examination.5050.t:0 "Falar em Nome dos Sábios"
 imperial_examination.5100.a:0 "Eu alcanço meu pincel."
 imperial_examination.5100.b:0 "\"[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], vá!\""
 imperial_examination.5100.c:0 "\"Examinador [ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], confio que conhece toda a extensão do meu talento.\""
 imperial_examination.5100.d:0 "\"Examinador [ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip], meu #EMP pai/mãe#! me ensinou tudo que sei sobre poesia.\""
 imperial_examination.5100.desc.explosive:0 "devo escrever com paixão, sem reservas!"
 imperial_examination.5100.desc.fallback:0 "devo buscar inspiração em toda a poesia que já li."
 imperial_examination.5100.desc.lofty:0 "devo deixar meus pensamentos alcançarem as mais longínquas alturas do céu."
 imperial_examination.5100.desc.river:0 "devo deixar meus pensamentos fluírem claros como o rio."
 imperial_examination.5100.desc.straight:0 "devo deixar meus pensamentos enraizarem profundamente na terra."
 imperial_examination.5100.desc:0 "Os candidatos se reúnem nas cabines de exame, e eu tomo meu lugar entre eles. Apesar de nosso número, o ambiente está silencioso, exceto pelo farfalhar das folhas, agitadas pela brisa suave. Incenso queima em um altar próximo, trazendo-me uma modesta paz.\n\nDevemos compor poesia em estrofes de quatro linhas. Se eu quiser ter sucesso,"
 imperial_examination.5100.e:0 "$imperial_examination.5000.e$"
 imperial_examination.5100.f:0 "Sei exatamente o que escrever..."
 imperial_examination.5100.g:0 "$imperial_examination.5000.e$"
 imperial_examination.5100.t:0 "Poesia [ROOT.Char.Custom('GetRegionalPoetryExam')]"
 imperial_examination.5150.a:0 "Seguro meu arco firmemente."
 imperial_examination.5150.b:0 "\"[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], você dispara.\""
 imperial_examination.5150.c:0 "\"[ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], por favor examine #EMP meu#! alvo...\""
 imperial_examination.5150.d:0 "\"Examinador [ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip], você conhece meu pai/mãe, não é?\""
 imperial_examination.5150.desc:0 "Os candidatos se reúnem no campo de tiro, e eu tomo meu lugar entre eles. \n\nApesar de nosso número, o ambiente está silencioso, exceto pelo leve tilintar da armadura enquanto nos posicionamos. \n\nO candidato à minha frente na fila prepara seu arco."
 imperial_examination.5150.e:0 "$imperial_examination.5150.d$"
 imperial_examination.5150.t:0 "Concurso de Tiro com Arco"
 imperial_examination.5160.a:0 "Assumo minha posição."
 imperial_examination.5160.b:0 "\"[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], ocupe meu lugar.\""
 imperial_examination.5160.c:0 "\"Examinador [ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], observe-me!\""
 imperial_examination.5160.d:0 "\"[ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip], você conhece a destreza marcial de meu pai/mãe!\""
 imperial_examination.5160.desc:0 "O peso do meu uniforme é um conforto familiar enquanto me alinham junto aos outros candidatos. Alvos de palha foram espalhados por todo o pátio em frente ao Palácio [ROOT.Char.GetCurrentLocation.GetName].\n\nMinha vez se aproxima. Logo após [other_entrant.GetTitledFirstName], que"
 imperial_examination.5160.e:0 "\"[ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip], isso lembra-lhe do longo alcance da minha família #EMP?!\""
 imperial_examination.5160.t:0 "Demonstração de Armas Longas"
 imperial_examination.5170.a:0 "Agarro as rédeas."
 imperial_examination.5170.b:0 "\"[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], ocupe meu lugar.\""
 imperial_examination.5170.c:0 "\"Examinador [ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], preste atenção!\""
 imperial_examination.5170.d:0 "\"Meu pai/mãe é um excelente arqueiro a cavalo. Certo, [ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip]?\""
 imperial_examination.5170.desc:0 "Acordando antes do galo, os outros candidatos e eu somos levados a um campo de tiro ao ar livre.\n\nUma variedade de belos cavalos nos aguarda no cume de uma colina ensolarada. O candidato à minha frente na fila prepara seu cavalo, e então procede a"
 imperial_examination.5170.e:0 "O arco e eu somos um só. Não posso falhar!"
 imperial_examination.5170.t:0 "Avaliação de Tiro a Cavalo"
 imperial_examination.5200.a:0 "Darei o meu melhor!"
 imperial_examination.5200.b:0 "É melhor não arriscar."
 imperial_examination.5200.desc:0 "[Select_CString( host.IsFemale, 'A', 'O' )] [host.GetTitleAsNameNoTooltip] me observa com um olhar avaliador. Com um gesto amplo em direção a nós, entrantes, [host.GetSheHe] declara: \"Uma postura inadequada revela falta de integridade. Uma técnica fraca revela uma vontade corrompível.\"\n\n[host.GetSheHe|U] junta as pontas dos dedos e observa o pátio. \"Pelo caminho de sua flecha, julgarei sua capacidade de conquistar cidades, proteger nossas fronteiras. Esta é sua última chance de me impressionar.\"\n\n[host.GetSheHe|U] se vira e me chama para frente."
 imperial_examination.5200.t:0 "A Demonstração de Arco e Flecha"
 imperial_examination.5300.a:0 "Apresentarei um argumento completo."
 imperial_examination.5300.b:0 "$imperial_examination.5200.b$"
 imperial_examination.5300.desc:0 "[Select_CString( host.IsFemale, 'A', 'O' )] [host.GetTitleAsNameNoTooltip] me observa com um olhar avaliador. Com um gesto amplo em direção a nós, entrantes, [host.GetSheHe] declara: \"Uma educação clássica fraca revela falta de moral. Um comentário pobre expõe uma resolução vacilante.\"\n\n[host.GetSheHe|U] junta as pontas dos dedos e observa o pátio. \"Pelos traços do seu pincel, julgarei sua capacidade de governar o povo, manter nossas tradições. Esta é sua última chance de me impressionar.\"\n\n[host.GetSheHe|U] se vira e me chama para frente."
 imperial_examination.5300.t:0 "O Ensaio Imperial"
 imperial_examination.5400.a:0 "$imperial_examination.5300.a$"
 imperial_examination.5400.b:0 "$imperial_examination.5200.b$"
 imperial_examination.5400.desc:0 "$imperial_examination.5300.desc$"
 imperial_examination.5400.t:0 "$imperial_examination.5300.t$"
 imperial_examination.5500.a:0 "Sempre me lembrarei deste momento."
 imperial_examination.5500.desc.failed_classics:0 "Luto para lembrar as lições que meus mestres me ensinaram. Passagens de textos importantes parecem banidas da memória."
 imperial_examination.5500.desc.failed_martial:0 "Antes mesmo das penas da flecha tocarem meu protetor de braço, sei que não atingirá corretamente, e observo enquanto ela roça a borda do alvo antes de desaparecer atrás dele."
 imperial_examination.5500.desc.hegemon_negative:0 "\n\n[Select_CString( host.IsFemale, 'A', 'O' )] [host.GetTitleAsNameNoTooltip] me olha, [host.Custom('quirk_neg_pp')]. \"Está dispensado.\""
 imperial_examination.5500.desc.hegemon_positive:0 "\n\n[Select_CString( host.IsFemale, 'A', 'O' )] [host.GetTitleAsNameNoTooltip] me olha, [host.Custom('quirk_pos_pp')]. \"Muito bem.\""
 imperial_examination.5500.desc.safe_learning:0 "Repito os ditados conhecidos que lembro da minha leitura, mas não elaboro nem discuto o assunto longamente."
 imperial_examination.5500.desc.safe_martial:0 "A flecha cai na borda do alvo. O impacto é raso, fazendo a cauda da flecha pender levemente."
 imperial_examination.5500.desc.success_learning:0 "Os ensinamentos dos meus mestres aparecem claramente em minha mente, enquanto passagens dos textos são facilmente lembradas."
 imperial_examination.5500.desc.success_martial:0 "Com um —#EMP THONK#!— a flecha se enterra firmemente no alvo. Um murmúrio de aprovação vem dos espectadores. Está claro que impressionei a multidão."
 imperial_examination.5500.t.critical_success:0 "Sucesso Crítico!"
 imperial_examination.5500.t.failure:0 "Falha!"
 imperial_examination.5500.t.great_success:0 "Grande Sucesso!"
 imperial_examination.5500.t.success:0 "Sucesso!"
 imperial_examination.6000.a:0 "\"Estou sendo incriminado, não vê?!\""
 imperial_examination.6000.b:0 "\"Certamente podemos fazer isso desaparecer, de alguma forma!\""
 imperial_examination.6000.c:0 "\"Sabe, [friend_to_sacrifice.GetTitledFirstNameNoTooltip] foi o #EMP verdadeiro#! instigador... !\""
 imperial_examination.6000.d:0 "\"Isso #EMP nunca#! acontecerá novamente, juro!\""
 imperial_examination.6000.desc:0 "Sudo profusamente enquanto o examinador [examiner.GetFirstName] me observa de cima a baixo, mãos em suas costas. \"Como você #EMP ousa#!, insolente infante. Deveria ir direto ao [activity.GetHost.GetTitleAsNameNoTooltip|U] e informar sua excelência de seus #EMP delitos#!. Se tiver sorte, #EMP apenas#! perderá a pele antes de sua morte.\"\n\nCom streams de suor escorrendo pelas minhas costas, tento avaliar a situação e limpar minha garganta extremamente seca:"
 imperial_examination.6000.misdirection.failure.tt:0 "[examiner.GetShortUIName] não está convencido"
 imperial_examination.6000.misdirection.success.tt:0 "Você convence com sucesso [examiner.GetShortUIName]"
 imperial_examination.6000.t:0 "Pego!"
 imperial_examination.7000.a.cheater:0 "Observando todos, menos a mim."
 imperial_examination.7000.a:0 "Tudo está bem sob os céus."
 imperial_examination.7000.desc.cheater:0 "Os tambores da academia me despertam do meu repouso, onde estou nos arredores do complexo de exames. Observo meus pares correrem para a divulgação dos resultados, esperançosos por seus desempenhos.\n\nAo longe, vejo os entrantes do Exame do Palácio, posicionados à frente do pátio do palácio imperial. O dia está claro, e o céu observa."
 imperial_examination.7000.desc.emperor:0 "Os tambores da academia soam mais uma vez na divulgação dos resultados. Os entrantes se reúnem diante dos resultados publicados, em silêncio, cheios de expectativa e reverência, esperando ter escalado a escada para altos cargos.\n\nOs entrantes do Palácio são colocados à frente de todos os seus pares como exemplo e recompensa, enquanto os estudantes de menor nível abaixam a cabeça em seguida."
 imperial_examination.7000.desc.entrant:0 "Os tambores da academia sinalizam o fim do exame. Corro para a divulgação da lista e descubro que obtive uma pontuação [ROOT.Char.Custom('PlayerGetExamScoreAdjective')] de #V [ROOT.Char.MakeScope.Var('imperial_examination_score').GetValue|0]#!, posicionando-me [ROOT.Char.MakeScope.Var('your_exam_position').GetValue|O] na lista.\n\nEnquanto isso, os candidatos de maior classificação do Exame do Palácio estão posicionados à frente do pátio do palácio imperial. Olho para [first_place_entrant.GetFirstName], que ficou em primeiro lugar entre eles, tornando-se o favorito de [host.GetTitleAsNamePossessiveNoTooltip]."
 imperial_examination.7000.desc.fallback:0 "Pela glória do benevolente [host.GetTitleAsNameNoTooltip], mais um [GetActivityType('activity_imperial_examination').GetName] é concluído. Com ele, uma nova leva de estudiosos escalou a escada para altos cargos."
 imperial_examination.7000.desc.palace_entrant:0 "Os tambores da academia sinalizam o fim do exame. Estou com meus pares do Exame do Palácio, posicionados à frente do pátio do palácio imperial, olhando para os entrantes de nível inferior reunidos diante da divulgação dos resultados abaixo de nós.\n\nQuando os entrantes metropolitanos nos notam, eles se curvam em reverência. Sinto um senso de glória e poder que me aguarda."
 imperial_examination.7000.t:0 "Divulgando os Resultados"
 imperial_examination.7001.a:0 "Este é um dia para recordar."
 imperial_examination.7001.desc.cheater:0 "\n\nNão estou entre os estudiosos da lista, pois os examinadores removeram meu nome da competição."
 imperial_examination.7001.desc.entrant.first:0 "\n\nMeu nome está no topo da lista, e meus pares viram a cabeça para me olhar com inveja. Está decidido: sou o melhor estudioso da prefeitura, e o caminho para o [GetActivityType('activity_imperial_examination').GetName] está aberto para mim."
 imperial_examination.7001.desc.entrant:0 "\n\nEmbora [first_place_entrant.GetFirstName] tenha tomado meu lugar no topo da lista, ainda passei no Exame Provincial com uma nota [ROOT.Char.Custom('PlayerGetExamScoreAdjective')] de #V [ROOT.Char.MakeScope.Var('imperial_examination_score').GetValue|0]#!."
 imperial_examination.7001.desc.fallback:0 "\n\nCom isso, uma nova leva de estudiosos deu seu primeiro, mas mais importante, passo na escada para altos cargos."
 imperial_examination.7001.desc.host:0 "\n\nCom isso, uma nova leva de estudiosos deu seu primeiro, mas mais importante, passo na escada para altos cargos. Preparei o palco para suas carreiras, mas o resto depende deles."
 imperial_examination.7001.desc:0 "O sino toca, sinalizando que o [GetActivityType('activity_local_examination').GetName] terminou e seus resultados foram publicados."
 imperial_examination.7001.t:0 "$imperial_examination.7000.t$"
 imperial_examination.7003.desc:0 "O sino toca, sinalizando que o [GetActivityType('activity_imperial_examination').GetName] terminou e seus resultados foram publicados."
 imperial_examination.7050.a.plural:0 "Espero que #EMP todos#! completem o Exame do Palácio."
 imperial_examination.7050.a.singular:0 "[house_member.GetSheHe|U] #EMP deve#! participar do Exame do Palácio!"
 imperial_examination.7050.a.tt_singular:0 "[house_member.GetShortUINameNoTooltip|U] tentará participar do próximo [GetActivityType('activity_imperial_examination').GetNameNoTooltip]"
 imperial_examination.7050.b:0 "O crédito, é claro, pertence a mim."
 imperial_examination.7050.c.plural:0 "Tenho certeza de que todos se esforçaram ao máximo."
 imperial_examination.7050.c.singular:0 "Tenho certeza de que [house_member.GetSheHe] se esforçou ao máximo."
 imperial_examination.7050.desc:0 "Embora seja ótimo ter a casa [ROOT.Char.GetHouse.GetNameNoTooltip] representada em nossa tradição mais esplêndida e reverenciada, esperava-se... um esforço mais concentrado.\n\n"
 imperial_examination.7050.t:0 "Os Entrantes Metropolitanos"
 imperial_examination.7055.b:0 "Como esperado de um membro da casa [ROOT.Char.GetHouse.GetNameNoTooltip]"
 imperial_examination.7055.desc:0 "É realmente uma bênção ter a casa [ROOT.Char.GetHouse.GetNameNoTooltip] representada no Exame do Palácio. Meus parentes se apresentaram diante [Select_CString( host.IsFemale, 'da própria', 'do próprio' )] [host.Custom('GetDaughterSon')] do Céu, provando serem dignos do elogio [host.GetHerHim].\n\nIsto é certamente um sinal de tempos prósperos por vir."
 imperial_examination.7055.t:0 "Família Honrada no Exame do Palácio"
 imperial_examination.7060.b.tt_plural:0 "As respostas dos candidatos aprovados são creditadas a sua [close_family|E] e [extended_family|E]"
 imperial_examination.7060.b.tt_singular:0 "O resultado de [failed_entrant.GetTitledFirstNamePossessive] será trocado pelo de um entrante bem-sucedido"
 imperial_examination.7060.b:0 "Os resultados podem se confundir às vezes..."
 imperial_examination.7060.c:0 "[house_member.GetSheHe|U] tentou trapacear como #EMP isso#!?"
 imperial_examination.7060.d:0 "Isto é inaceitável!"
 imperial_examination.7060.desc:0 "Como posso me mostrar entre meus pares quando meus parentes se envergonham e falham em manter nossa tradição mais reverenciada? Uma disciplina rigorosa pode ser necessária."
 imperial_examination.7060.t:0 "Família Desonrada no Exame Metropolitano"
 imperial_examination.7100.a.plural:0 "Devo parabenizar os entrantes do Palácio."
 imperial_examination.7100.a.singular:0 "Parabéns são devidos!"
 imperial_examination.7100.a.tt_first:0 "#weak Você se dirige ao entrante bem-sucedido do Palácio#!"
 imperial_examination.7100.b.plural:0 "Desejo me dirigir aos entrantes de nível inferior."
 imperial_examination.7100.b.singular:0 "Recuso-me a aceitar a mediocridade."
 imperial_examination.7100.b.tt_first:0 "#weak Você se dirige ao entrante bem-sucedido metropolitano#!"
 imperial_examination.7100.c.tt_first:0 "#weak Você se dirige ao entrante que falhou#!"
 imperial_examination.7100.c:0 "Falhar não é tolerado nesta casa!"
 imperial_examination.7100.d:0 "Não tenho tempo para isso."
 imperial_examination.7100.desc.all_failed:0 "Todos eles [ROOT.Char.Custom('ActivityGetFaileesBothAll')] falharam."
 imperial_examination.7100.desc.all_passed:0 "[ROOT.Char.Custom('ActivityGetFaileesBothAll')] deles honraram nosso bom nome."
 imperial_examination.7100.desc.all_passed_metropolitan:0 "[ROOT.Char.Custom('ActivityGetSuccessfulBothAll')] deles honraram nosso bom nome e passaram no Exame Provincial."
 imperial_examination.7100.desc.all_passed_provincial:0 "[ROOT.Char.Custom('ActivityGetSuccessfulBothAll')] deles honraram nosso bom nome e passaram no Exame."
 imperial_examination.7100.desc.cheater:0 "Além disso, [house_member.GetSheHe] foi descoberto tentando trapacear no evento."
 imperial_examination.7100.desc.failed_entrant:0 "\n\n[house_member.GetTitledFirstName] falhou no Exame Metropolitano."
 imperial_examination.7100.desc.failed_fallback:0 "Anos e anos de educação extensa e #EMP cara#!, desperdiçados em um instante."
 imperial_examination.7100.desc.got_elder:0 "Ao menos [house_member.GetSheHe] conseguiu impressionar [elder.GetTitledFirstName], um dos examinadores imperiais, que [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] acolheu como [disciple|E]."
 imperial_examination.7100.desc.intro_nr_of_relatives:0 "\n\n[ROOT.Char.MakeScope.Var('num_exam_family_entrants').GetValue] membros da casa [ROOT.Char.GetHouse.GetNameNoTooltip] participaram como candidatos."
 imperial_examination.7100.desc.intro_nr_of_relatives_singular:0 "Apenas [Select_CString( house_member.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', house_member)] [house_member.GetTitledFirstName] participou como candidato."
 imperial_examination.7100.desc.metropolitan_entrant:0 "\n\n[house_member.GetTitledFirstName] passou no Exame Metropolitano com uma nota [activity.Custom('ActivityGetExamScoreAdjective')], mas não conseguiu conquistar uma das cobiçadas vagas no Exame do Palácio."
 imperial_examination.7100.desc.one_passed:0 "Apenas um deles honrou nosso bom nome."
 imperial_examination.7100.desc.palace_entrant:0 "\n\n[house_member.GetTitledFirstName] passou no Exame Metropolitano com uma nota [activity.Custom('ActivityGetExamScoreAdjective')], garantindo a [house_member.GetSheHe] a cobiçada oportunidade de participar do Exame do Palácio perante [Select_CString( host.IsFemale, 'a própria', 'o próprio' )] [host.GetTitleAsNameNoTooltip]! Com isso, [house_member.GetSheHe] trouxe orgulho à casa [ROOT.Char.GetHouse.GetNameNoTooltip]."
 imperial_examination.7100.desc.win_lose_ratio:0 "[ROOT.Char.MakeScope.Var('num_exam_family_entrants_passed').GetValue] passaram, enquanto [ROOT.Char.MakeScope.Var('num_exam_family_entrants_failed').GetValue] falharam no exame."
 imperial_examination.7100.desc.won_palace:0 "Destes, [ROOT.Char.MakeScope.Var('num_exam_family_passed_palace').GetValue] chegaram ao Exame do Palácio."
 imperial_examination.7100.desc:0 "Pela glória do nosso benevolente [host.GetTitleAsNameNoTooltip], temos uma nova leva de futuros governadores seguindo o Exame da Capital em [location.GetName]."
 imperial_examination.7100.t:0 "Família Representada no Exame"
 imperial_examination.8000.a:0 "Os olhos do céu estão sobre mim!"
 imperial_examination.8000.desc:0 "Encontro-me entre os estudiosos mais promissores do reino. Minha vida inteira esperei por este momento. Em breve, caminharei pelos jardins do palácio, comerei os alimentos mais ricos que o império tem a oferecer e ficarei diante [Select_CString( host.IsFemale, 'da própria', 'do próprio' )] [host.GetTitleAsNameNoTooltip]."
 imperial_examination.8000.t:0 "No Palácio"
 imperial_examination.8010.a:0 "Preciso estudar muito para o próximo."
 imperial_examination.8010.b:0 "Ainda assim, estou satisfeit[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com meu resultado."
 imperial_examination.8010.desc:0 "Não recebi um convite para o Exame do Palácio. Minha pontuação real ainda não foi divulgada. Enquanto isso, não estou mais confinado ao complexo de exames.\n\n"
 imperial_examination.8010.desc_fallback:0 "O exame finalmente acabou, e posso respirar aliviad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 imperial_examination.8010.desc_worried:0 "O burburinho da taverna não me alcança, enquanto me sento e pondero o que poderia ter feito de diferente."
 imperial_examination.8010.t:0 "Na Taverna"
 imperial_examination.9000.a.tt_learning:0 "Você recebe esta opção por causa de sua [activity_option|E] $imperial_examination_focus_learning$"
 imperial_examination.9000.a.tt_martial:0 "Você recebe esta opção por causa de sua [activity_option|E] $imperial_examination_focus_martial$"
 imperial_examination.9000.a.tt_stewardship:0 "Você recebe esta opção por causa de sua [activity_option|E] $imperial_examination_focus_stewardship$"
 imperial_examination.9000.a:0 "Esperava um [ROOT.Char.GetInvolvedActivity.Custom('GetExamFocusSkill')]."
 imperial_examination.9000.b:0 "Você honrou bem o império."
 imperial_examination.9000.desc.diplomacy:0 "diplomacia"
 imperial_examination.9000.desc.intro:0 "Com o Exame Metropolitano concluído, o examinador [examiner.GetFirstName] apresenta-me o candidato de mais alta classificação, [first_char.GetTitledFirstName].\n\n\"A afinidade dest[Select_CString( first_char.IsFemale, 'a', 'e' )] [first_char.GetWomanMan] por"
 imperial_examination.9000.desc.martial:0 "guerra"
 imperial_examination.9000.outro:0 "impressionou a todos nós hoje,\" diz [examiner.GetFirstNameNoTooltip]. \"Os outros candidatos de alta classificação estão sendo escoltados para o palácio imperial neste exato momento.\"\n\n[first_char.GetFirstNameNoTooltip] inclina-se profundamente e diz, com voz baixa e reverente: \"Vivo para servir [Select_CString( ROOT.Char.IsFemale, 'a', 'ao' )] [ROOT.Char.GetTitleAsNameNoTooltip].\""
 imperial_examination.9000.t:0 "Uma Reunião Muito Estimada"
 imperial_examination.9001.a:0 "Vivo para servir."
 imperial_examination.9001.b:0 "Nunca esquecerei isto!"
 imperial_examination.9001.c:0 "Farei melhor, a qualquer custo."
 imperial_examination.9001.d:0 "Manter a calma..."
 imperial_examination.9001.desc:0 "Mal secou o suor em minha testa quando sou levad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [Select_CString( host.IsFemale, 'a', 'ao' )] [host.GetTitleAsNameNoTooltip]. Minha mão dói de tanto ter segurado firmemente meu(minha)"
 imperial_examination.9001.desc_bridge:0 "o dia todo. Disseram-me que obtive a maior pontuação entre todos [Select_CString( ROOT.Char.IsFemale, 'as', 'os' )] [ROOT.Char.GetWomenMen] selecionados do reino."
 imperial_examination.9001.desc_brush:0 "pincel"
 imperial_examination.9001.desc_denied:0 "\n\nPara minha surpresa, [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip] lança apenas um olhar quando me prostro diante [host.GetHerHim], dizendo: \"Esperava um [ROOT.Char.GetInvolvedActivity.Custom('GetExamFocusSkill')].\"\n\nMeu rosto queima ao ver outr[Select_CString( favored_entrant.IsFemale, 'a', 'o' )] candidat[Select_CString( favored_entrant.IsFemale, 'a', 'o' )] ser trazid[Select_CString( favored_entrant.IsFemale, 'a', 'o' )] para elogios em meu lugar, [favored_entrant.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 imperial_examination.9001.desc_merit:0 "\n\nProstro-me diante [Select_CString( host.IsFemale, 'da própria', 'do próprio' )] [host.Custom('GetDaughterSon')] dos Céus, inclinando-me o mais profundamente que minhas costas permitem.\n\n\"Você honrou bem o império,\" diz [host.GetSheHe]. Será que capturei um lampejo de orgulho nos olhos [host.GetHerHim]? As luzes desta sala devem estar pregando peças em mim."
 imperial_examination.9001.desc_weapon:0 "arma"
 imperial_examination.9001.t:0 "Sob o Olhar do Céu"
 imperial_examination.advantage.tt:0 "Ganha [exam_advantage|E]"
 imperial_examination.caught_cheating.tt:0 "#warning Diminui#! seu ganho de mérito ao final do exame."
 imperial_examination.cheat.failure.desc:0 "Você foi pego"
 imperial_examination.cheat.failure.tt:0 "Qualquer [merit|E] ganho desta [activity|E] de [examination|E] será #N penalizado#!"
 imperial_examination.cheat.success.desc:0 "Você trapaceia com sucesso no exame"
 imperial_examination.cheat.success.tt:0 "Você aumenta seu [exam_score|E] em [EmptyScope.ScriptValue('imperial_examination_cheat_value')|P0]"
 imperial_examination.cheat.tt:0 "Ganha um [exam_cheat|E]"
 imperial_examination.cheat_spent.tt:0 "Você #BOL gastou#! um [exam_cheat|E]\n"
 imperial_examination.cheat_wash.tt:0 "Seu deslize é coberto e a trapaça esquecida"
 imperial_examination.duel.archery.critical_success.tt:0 "Seu tiro é perfeito"
 imperial_examination.duel.archery.failure.tt:0 "Seu tiro erra completamente"
 imperial_examination.duel.archery.great_success.tt:0 "Seu tiro é um grande sucesso"
 imperial_examination.duel.archery.success.tt:0 "Seu tiro é decente"
 imperial_examination.duel.classics.critical_success.tt:0 "Sua interpretação do trecho é um sucesso crítico"
 imperial_examination.duel.classics.failure.tt:0 "Você estraga a interpretação do trecho"
 imperial_examination.duel.classics.great_success.tt:0 "Você faz pontos muito bons sobre o trecho"
 imperial_examination.duel.classics.success.tt:0 "Seu trecho é decente"
 imperial_examination.duel.critical_success.t:0 "Sucesso Crítico!"
 imperial_examination.duel.essay.critical_success.tt:0 "Você escreve uma redação aclamada pela crítica"
 imperial_examination.duel.essay.failure.tt:0 "Você falha em escrever uma redação adequada"
 imperial_examination.duel.essay.great_success.tt:0 "Você escreve uma boa redação"
 imperial_examination.duel.essay.success.tt:0 "Sua redação é decente"
 imperial_examination.duel.failure.t:0 "Falha"
 imperial_examination.duel.great_success.t:0 "Grande Sucesso!"
 imperial_examination.duel.poetry.critical_success.tt:0 "O tempo parece parar quando você lê seu poema"
 imperial_examination.duel.poetry.failure.tt:0 "Você vacila e falha em escrever um poema envolvente"
 imperial_examination.duel.poetry.great_success.tt:0 "Sua poesia é excelente"
 imperial_examination.duel.poetry.success.tt:0 "Seu poema é razoável"
 imperial_examination.duel.polearm.critical_success.tt:0 "Sua postura é perfeita"
 imperial_examination.duel.polearm.failure.tt:0 "Sua postura é inadequada"
 imperial_examination.duel.polearm.great_success.tt:0 "Sua postura é impressionante"
 imperial_examination.duel.polearm.success.tt:0 "Sua postura é adequada"
 imperial_examination.duel.riding.critical_success.tt:0 "Sua técnica é perfeita"
 imperial_examination.duel.riding.failure.tt:0 "Sua técnica é decepcionante"
 imperial_examination.duel.riding.great_success.tt:0 "Sua técnica é impressionante"
 imperial_examination.duel.riding.success.tt:0 "Sua técnica é adequada"
 imperial_examination.duel.success.t:0 "Sucesso!"
