 other_entrant_cutting_success:0 "corta a cabeça do alvo [other_entrant.GetHerHim] com um floreio que faz os examinadores sorrirem."
 other_entrant_drooping_safe:0 "A flecha atinge a borda do alvo. O impacto raso faz com que a cauda da flecha caia tristemente."
 other_entrant_embarrased_cough:0 "A flecha voa tão longe que não consigo ouvir onde ela caiu atrás do alvo. Alguém, em algum lugar, tosse."
 other_entrant_impressive_success:0 "Um murmúrio de aprovação percorre a plateia enquanto [other_entrant.GetSheHe] crava sua flecha firmemente no alvo."
 other_entrant_piercing_success:0 "A flecha penetra no alvo profundamente, saindo pela parte de trás."
 other_entrant_practiced_ride:0 "galopa com facilidade treinada pelo campo, mas falta-lhe coragem para disparar seu arco, resultando em uma demonstração lamentável."
 other_entrant_practiced_safe:0 "gira, deflete e derruba o oponente de palha [other_entrant.GetHerHim] com movimentos treinados, ainda que um pouco previsíveis."
 other_entrant_practiced_success:0 "movimenta-se com uma facilidade quase natural, que provoca um murmúrio de inveja na multidão."
 other_entrant_shortstop_fail:0 "galopa pelo campo, inclinando-se corretamente sobre a sela, mas nenhuma das flechas [other_entrant.GetHerHim] atinge o alvo."
 other_entrant_spinning_safe:0 "A flecha voa em um arco baixo, girando descontroladamente no vento, mas ainda consegue atingir a borda inferior do alvo."
 other_entrant_spooked_horse:0 "finque suas esporas para assustar o pobre animal, que o derruba com sucesso. É uma visão lamentável, mas de certa forma reconfortante."
 other_entrant_stuck_fail:0 "faz uma investida ousada em direção ao alvo [other_entrant.GetHerHim], mas de alguma forma fica com a arma presa no pequeno corpo de palha."
 other_entrant_stumbling_fail:0 "tropeça e cai, sua arma caindo no chão. Suspiro de alívio."
 other_entrant_swift_success:0 "avança rapidamente pela planície, disparando uma rajada de tiros em rápida sucessão, seus movimentos fluindo como água."
 other_entrant_thundering_success:0 "avança pelo campo, cascos retumbando pela planície. Apesar da velocidade do cavalo, [other_entrant.GetSheHe] permanece perfeitamente firme em seu dorso. É uma visão impressionante e, de certa forma, intimidadora."
 other_entrant_vanishing_arrow:0 "A flecha roça o canto do alvo antes de desaparecer atrás dele."
