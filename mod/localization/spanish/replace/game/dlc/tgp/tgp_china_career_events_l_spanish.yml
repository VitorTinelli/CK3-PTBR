l_spanish:
 keep_civilian_career_desc:0 "Você continua perseguindo uma carreira Civil - permanecendo elegível para [GetPlayer.Custom('GetProvincePluralConcept')] Civil e [GetLaw('celestial_appointment_succession_law').GetName]"
 keep_military_career_desc:0 "Você continua perseguindo uma carreira Militar - permanecendo elegível para [GetPlayer.Custom('GetProvincePluralConcept')] Militar e [GetLaw('celestial_military_appointment_succession_law').GetName]"
 merit_rank_1_gloss:0 "[Glossary('superior-superior','MERIT_UPPER_UPPER_GLOSS')]"
 merit_rank_2_gloss:0 "[Glossary('superior-médio','MERIT_UPPER_MIDDLE_GLOSS')]"
 merit_rank_3_gloss:0 "[Glossary('superior-inferior','MERIT_UPPER_LOWER_GLOSS')]"
 merit_rank_4_gloss:0 "[Glossary('médio-superior','MERIT_MIDDLE_UPPER_GLOSS')]"
 merit_rank_5_gloss:0 "[Glossary('médio-médio','MERIT_MIDDLE_MIDDLE_GLOSS')]"
 merit_rank_6_gloss:0 "[Glossary('médio-inferior','MERIT_MIDDLE_LOWER_GLOSS')]"
 merit_rank_7_gloss:0 "[Glossary('inferior-superior','MERIT_LOWER_UPPER_GLOSS')]"
 merit_rank_8_gloss:0 "[Glossary('inferior-médio','MERIT_LOWER_MIDDLE_GLOSS')]"
 merit_rank_9_gloss:0 "[Glossary('inferior-inferior','MERIT_LOWER_LOWER_GLOSS')]"
 merit_rank_none_gloss:0 "nenhum"
 tgp_china_career.0001.a:0 "O destino não espera. Vamos trabalhar!"
 tgp_china_career.0001.b:0 "Todos saberão quem #EMP eu#! sou."
 tgp_china_career.0001.desc:0 "A burocracia do [emperor.GetPrimaryTitle.GetNameNoTierNoTooltip] é uma máquina vasta e complexa, mas bem lubrificada. É dever de cada cidadão servir ao reino da melhor maneira possível.\n\n"
 tgp_china_career.0001.landed_desc:0 "Como [new_ruler.GetTitleAsNameNoTooltip|l] de [new_ruler.GetPrimaryTitle.GetNameNoTier], tenho muitas responsabilidades a cumprir e obrigações a honrar. O nome [ruler_family.GetName] será conhecido em todo o reino.\n\nTalvez eu até tenha o que é preciso para um dia ocupar um cargo no governo e me tornar ministr[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]?"
 tgp_china_career.0001.minister_desc:0 "Como [new_ruler.GetTitleAsNameNoTooltip], todos os olhos estão sobre mim. Um único passo em falso seria suficiente para ver minha carreira desmoronar.\n\nMostrarei [Select_CString( emperor.IsFemale, 'a', 'ao' )] [emperor.GetTitleAsNameNoTooltip] que sou dign[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] da confiança [emperor.GetHerHim]."
 tgp_china_career.0001.t:0 "Servir ao Filho do Céu"
 tgp_china_career.0001.unlanded_desc:0 "Como membro da família [ruler_family.GetName], terei que trabalhar duro para fazer meu nome. Primeiro, precisarei passar nos [examinations|E] e ganhar [merit|E]. Só então poderei ser nomead[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] oficial."
 tgp_china_career.0010.a:0 "Um marco importante na minha carreira."
 tgp_china_career.0010.aa:0 "Sei que posso fazer melhor."
 tgp_china_career.0010.b1:0 "Um cargo civil me seria mais adequado."
 tgp_china_career.0010.b2:0 "Sou um servidor civil, e um servidor civil permanecerei."
 tgp_china_career.0010.c1:0 "Buscarei a glória no campo de batalha!"
 tgp_china_career.0010.c2:0 "Comandar soldados em batalha é como segunda natureza para mim."
 tgp_china_career.0010.duchy_desc:0 "\n\nPosso iniciar minha carreira de fato — deixando para trás os cargos menores de oficial e abrindo caminho para posições mais importantes. Uma vez que uma oportunidade se apresentar, é claro."
 tgp_china_career.0010.empire_desc:0 "\n\nPoucos obstáculos permanecem em meu caminho. Sou meritóri[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] o suficiente para me tornar ministr[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. Com trabalho suficiente, talvez eu consiga assumir o cargo de chanceler-mor?"
 tgp_china_career.0010.first_rank_desc:0 "Tornei-me suficientemente meritóri[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] para receber o posto de [merit_char.Custom('GetMeritRank')], dando assim o primeiro passo em uma carreira longa e promissora. Finalmente posso ser nomead[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] oficial — para governar terras e trazer prosperidade ao reino.\n\nTalvez uma oportunidade para decidir qual carreira desejo seguir? Subo na hierarquia política como funcionário civil? Ou assumo o comando militar, liderando tropas e trazendo paz ao reino?"
 tgp_china_career.0010.higher_rank_desc:0 "Meu trabalho árduo e diligência foram recompensados. Fui agraciad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com o posto meritório de [merit_char.Custom('GetMeritRank')]."
 tgp_china_career.0010.higher_rank_unspecific:0 "\n\nOs [ROOT.Char.Custom('GetRandomAnnalsPassage')] se tornaram tão familiares para mim quanto o nome de minha mãe. Mas ainda há muito mais a fazer."
 tgp_china_career.0010.highest_rank:0 "\n\nMuitos foram os pergaminhos estudados, as noites passadas acordad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. Esta parte da minha jornada chegou ao fim, mas a estrada segue sem fim."
 tgp_china_career.0010.kingdom_desc:0 "\n\nAgora sou meritóri[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] o suficiente para ser nomead[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] até mesmo para províncias maiores e mais importantes."
 tgp_china_career.0010.t:0 "Um Caminho Meritório"
 tgp_china_career.0030.a.tt:0 "Você buscará um novo [elder|U] entre os grandes e influentes"
 tgp_china_career.0030.a:0 "A jornada de [deceased_elder.GetFirstNamePossessiveNoTooltip] terminou, mas a minha deve continuar."
 tgp_china_career.0030.b:0 "Envie minhas condolências aos parentes [deceased_elder.GetHerHim], e um símbolo do meu respeito."
 tgp_china_career.0030.c:0 "[superior_fellow_disciple.GetFirstNameNoTooltip] é o mais digno entre nós para continuar o trabalho [deceased_elder.Custom('MistressMasterPossessive')|U]."
 tgp_china_career.0030.d:0 "Herdarei a vontade [deceased_elder.GetHerHim] e continuarei o Caminho [deceased_elder.GetHerHim]."
 tgp_china_career.0030.desc:0 "Meu ancião, [deceased_elder.GetFirstName], partiu deste mundo: fui informado de que [deceased_elder.GetSheHe] [deceased_elder.GetDeathReason]. Já começo a sentir a ausência [deceased_elder.GetHerHim]; o reflexo de levantar uma pergunta morre a meio fôlego quando percebo que não há mais ninguém para respondê-la.\n\nAinda assim, tais sentimentos passageiros inevitavelmente cedem ao peso mundano de questões mais práticas: os ritos de sepultamento e luto, bem como a questão de quem assumirá o manto [deceased_elder.Custom('MistressMasterPossessive')|U] e continuará em seu lugar."
 tgp_china_career.0030.t:0 "A Passagem de um Sábio"
 tgp_higher_ambitions_modifier:0 "Ambições Maiores"
 tgp_higher_ambitions_modifier_desc:0 "Este personagem decidiu concentrar todos os seus esforços em subir na hierarquia de mérito."
 tgp_influence_boost_modifier:0 "Foco na Influência"
 tgp_influence_boost_modifier_desc:0 "Este personagem está focado em aumentar sua influência e avançar em seus objetivos."
 tgp_merit_boost_modifier:0 "Foco no Mérito"
 tgp_merit_boost_modifier_desc:0 "Este personagem está focado no mérito e estudando o Caminho."
