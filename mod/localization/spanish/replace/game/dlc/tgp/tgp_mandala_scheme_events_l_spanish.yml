l_spanish:
 coerce_and_leverage_contribution_ongoing.0001.a:0 "Essas pessoas podem poupar uma moeda."
 coerce_and_leverage_contribution_ongoing.0001.b:0 "Elas têm lutas maiores."
 coerce_and_leverage_contribution_ongoing.0001.desc.high_dev:0 "Bancas vendendo [ROOT.Char.Custom('GetExpensiveMeal')] me atraem com um aroma delicioso."
 coerce_and_leverage_contribution_ongoing.0001.desc.intro:0 "Faço uma visita a [target_county.GetName] em meus esforços para fazer com que seus habitantes contribuam para o meu grandioso projeto de [ROOT.Char.GetFaith.HouseOfWorship].\n\n"
 coerce_and_leverage_contribution_ongoing.0001.desc.low_dev:0 "Os locais se aglomeram na [ROOT.Char.Custom('GetSquareCommons')], cercados por [ROOT.Char.Custom('GetCrookedhousesDelapidatedtents')] e comerciantes tentando se livrar de seus [ROOT.Char.Custom('get_region_root_vegetable_plural')] mais podres."
 coerce_and_leverage_contribution_ongoing.0001.desc.outro:0 "\n\n\"Ouvi, ouvi! Para o [peasant.Custom('dummy_peasant_profession')] e o [peasant.Custom2('dummy_peasant_profession', peasant)]! Por apenas a #EMP menor#! quantia de ouro, tudo isso pode ser seu!\""
 coerce_and_leverage_contribution_ongoing.0001.desc.regular_dev:0 "Comerciantes vendendo [ROOT.Char.Custom('GetTradeGoods')] enganam visitantes desavisados."
 coerce_and_leverage_contribution_ongoing.0001.t:0 "[my_scheme.GetNameNoTooltip]: Cada um de vocês"
 coerce_and_leverage_contribution_ongoing.0010.a:0 "\"Que assim seja.\""
 coerce_and_leverage_contribution_ongoing.0010.aa:0 "\"#EMP Eu#! gostaria dessas bênçãos.\""
 coerce_and_leverage_contribution_ongoing.0010.b:0 "Isso não merece sua atenção."
 coerce_and_leverage_contribution_ongoing.0010.desc:0 "O cheiro de [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type_plural')] me dá bom dia, o ar preenchido com a sensação [ROOT.Char.Custom('GetSeasonAdj')] de [ROOT.Char.Custom('GetSeason')].\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], o fardo de erguer uma [ROOT.Char.GetFaith.HouseOfWorship] é pesado\", [Select_CString( court_chaplain.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_chaplain'))], [court_chaplain.GetName], aproxima-se de mim, sorrindo [court_chaplain.Custom('quirk_pos_adverb')]. \"Ainda assim, os fiéis podem ser movidos por uma promessa de favor celestial.\"\n\n\"Se decretarmos assim, aqueles que oferecerem contribuição receberão bênçãos além da sorte comum.\""
 coerce_and_leverage_contribution_ongoing.0010.t:0 "[my_scheme.GetNameNoTooltip]: Salvação em Ouro"
 coerce_and_leverage_contribution_ongoing.0020.a:0 "\"Apresse-se em sua escrita!\""
 coerce_and_leverage_contribution_ongoing.0020.aa:0 "Uma promessa não precisa ser verdadeira..."
 coerce_and_leverage_contribution_ongoing.0020.b:0 "\"Apenas mencione que aprecio a generosidade de [target.GetHerHis].\""
 coerce_and_leverage_contribution_ongoing.0020.desc:0 "M[Select_CString( servant.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('servant'))], [servant.GetName], faz uma reverência, com [servant.Custom('GetWritingMaterialPlural')] em mãos.\n\n\"Os cofres para a [ROOT.Char.GetFaith.HouseOfWorship] crescem devagar demais.\" [servant.GetSheHe|U] anuncia, [servant.Custom('quirk_pos_pp')].\n\n\"Mas palavras podem comprar o que moedas não compram. Talvez uma carta para [target.GetTitledFirstName], com uma promessa tentadora, possa convencer [target.GetHerHis] vontade a ajudar...\""
 coerce_and_leverage_contribution_ongoing.0020.t:0 "[my_scheme.GetNameNoTooltip]: O Valor de uma Promessa"
 coerce_tributary_ongoing.0001.a.failure:0 "[target.GetShortUIName] não cede"
 coerce_tributary_ongoing.0001.a.success:0 "[target.GetShortUIName] aceita pagar"
 coerce_tributary_ongoing.0001.a:0 "[target.GetSheHe|U] aprenderá o quão caro é se opor a nós."
 coerce_tributary_ongoing.0001.b:0 "O tempo fará o trabalho por nós."
 coerce_tributary_ongoing.0001.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" M[Select_CString( steward.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('steward'))], [steward.GetName], está diante de mim com o sorriso mais largo.\n\n\"Eu... #EMP encontrei#! uma escritura antiga que nos permite pressionar [target.GetTitledFirstName] por uma tarifa mais alta caso queira usar nossas estradas. No entanto, precisarei de algum financiamento para enviar uma pequena delegação a [capital.GetName].\""
 coerce_tributary_ongoing.0001.t:0 "[my_scheme.GetNameNoTooltip]: Estradas Fechadas"
 coerce_tributary_ongoing.0010.a.failure:0 "[target.GetShortUIName] se ofende profundamente"
 coerce_tributary_ongoing.0010.a.success:0 "[target.GetShortUIName] foi persuadido"
 coerce_tributary_ongoing.0010.a:0 "\"Que seja feito!\""
 coerce_tributary_ongoing.0010.b:0 "Não há necessidade de irritar [target.GetTitledFirstNameNoTooltip]."
 coerce_tributary_ongoing.0010.desc:0 "M[Select_CString( marshal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))], [marshal.GetName], faz uma reverência profunda, ainda com o suor escorrendo pela testa após treinar os [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')].\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\", [marshal.GetSheHe] começa, \"palavras demais já foram gastas tentando convencer [target.GetTitledFirstName]. Tributo não se implora — se toma.\"\n\n[marshal.GetSheHe|U] cerra o punho.\n\n\"Permita-me marchar com alguns de meus guerreiros até os portões de [capital.GetName].\""
 coerce_tributary_ongoing.0010.t:0 "[my_scheme.GetName]: Negociações Agressivas"
 coerced_contribution_county_modifier:0 "Contribuições 'Voluntárias'"
 coerced_contribution_county_modifier_desc:0 "Os habitantes deste condado foram forçados a contribuir para um grande projeto."
 coerced_my_tributary_opinion:0 "Coagiu Meu Tributo"
 coerced_tributary_opinion:0 "Tributo Coagido"
 disbelieve_mandala_ongoing.0001.a.crit_success:0 "Os milagres são atribuídos a você"
 disbelieve_mandala_ongoing.0001.a.failure.breach:0 "#alert_trial @alert_icon! [my_scheme.GetName] ganha #V 1#! [scheme_breach|E]#!"
 disbelieve_mandala_ongoing.0001.a.failure:0 "Seu agente foi descoberto"
 disbelieve_mandala_ongoing.0001.a.success:0 "Os milagres são considerados falsos"
 disbelieve_mandala_ongoing.0001.a:0 "\"Plano brilhante, [agent.GetFirstNameNoTooltip]!\""
 disbelieve_mandala_ongoing.0001.b:0 "Não vale o risco."
 disbelieve_mandala_ongoing.0001.desc:0 "[Select_CString( agent.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))], [agent.GetName], se aproxima de mim na calada da noite com um plano sussurrado e perverso.\n\n\"Pelos mercados e pátios dos templos. Um mercador aqui, um servo ali, cada um repetindo discretamente as mesmas histórias sobre [target.GetTitledFirstName].\"\n\n\"Dirão que o milagre do rio não passou de um truque de correnteza e luz de lanterna, que o mendigo curado foi visto recebendo moedas de um cortesão de passagem.\""
 disbelieve_mandala_ongoing.0001.t:0 "$disbelieve_mandala$: Nenhum milagre"
 disbelieve_mandala_ongoing.0010.a.failure:0 "Seu agente foi descoberto"
 disbelieve_mandala_ongoing.0010.a.success:0 "O plano é bem-sucedido"
 disbelieve_mandala_ongoing.0010.a:0 "A #EMP [fake_relic.GetNameNoTooltip]#! parece quase real."
 disbelieve_mandala_ongoing.0010.b:0 "[target.GetTitledFirstNameNoTooltip] não é tol[Select_CString( target.IsFemale, 'a', 'o' )]."
 disbelieve_mandala_ongoing.0010.desc:0 "\"Podemos plantar uma relíquia\", sugere [Select_CString( spymaster.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spymaster'))], [spymaster.GetName], depois de insistir para nos encontrarmos no escritório.\n\n\"Uma falsa, cuidadosamente forjada, dentro do santuário [Select_CString( target.IsFemale, 'da', 'do' )] [target.GetTitledFirstName]. Que ela seja #EMP encontrada#! e depois revelada como uma farsa: o povo duvidará dos prodígios, o clero murmura, e a aura sagrada de [target.GetHerHis] ruirá.\""
 disbelieve_mandala_ongoing.0010.t:0 "$disbelieve_mandala$: Tudo não passa de uma falsificação"
 insusceptible_to_coerce_contribution_modifier:0 "Insuscetível à Coerção"
 insusceptible_to_coerce_contribution_modifier_desc:0 "Este condado discorda de ser forçado a financiar um Complexo de Templo Capital."
 insusceptible_to_leverage_contribution_modifier:0 "Insuscetível à Persuasão"
 insusceptible_to_leverage_contribution_modifier_desc:0 "Este personagem não está abrindo nem a bolsa nem o coração para financiar contribuições."
 rival_planted_fake_artifact:0 "[CHARACTER.GetShortUIName] tentou plantar uma relíquia falsa na corte de [TARGET_CHARACTER.GetShortUINamePossessive]."
 rival_planted_fake_artifact_corresponding:0 "$rival_planted_fake_artifact$"
 rival_tried_to_intimidate:0 "[TARGET_CHARACTER.GetShortUIName|U] tentou intimidar [CHARACTER.GetShortUIName] para torná-lo seu tributário."
 rival_tried_to_intimidate_corresponding:0 "[CHARACTER.GetShortUIName|U] foi intimidado por [TARGET_CHARACTER.GetShortUIName] para tentar torná-lo um tributário."
 scheme_coerced_subjects_modifier:0 "$coerced_contribution_county_modifier$"
 scheme_coerced_subjects_modifier_desc:0 "$coerced_contribution_county_modifier_desc$"
 scheme_critical_moments.1212.a:0 "Foi a coisa certa a se fazer."
 scheme_critical_moments.1212.desc:0 "Rachaduras suficientes destroem qualquer coisa.\n\nMeus esforços para espalhar a descrença na natureza divina [Select_CString( target.IsFemale, 'da', 'do' )] [target.GetTitledFirstName] deram frutos, e agora o nome de [target.GetHerHis] não pode ser mencionado sem que pelo menos um dos presentes na conversa questione a veracidade dos rumores. Rumores sobre as ações ardilosas de [target.GetHerHis]. Sobre suas inconsistências e incompetências."
 scheme_critical_moments.1212.desc_discovered:0 "\n\nMesmo que [target.GetFirstNameNoTooltip] saiba do meu envolvimento, não importa! Em breve o mundo conhecerá o único e verdadeiro Devaraja: eu!"
 scheme_critical_moments.1212.desc_secret:0 "\n\n[target.GetFirstNameNoTooltip] continua perplex[Select_CString( target.IsFemale, 'a', 'o' )] com o ódio que recebe, completamente alhei[Select_CString( target.IsFemale, 'a', 'o' )] ao meu envolvimento!"
 scheme_critical_moments.1212.t:0 "[scheme.GetNameNoTooltip]: Sucesso"
 scheme_critical_moments.1213.a:0 "Apenas um pequeno contratempo..."
 scheme_critical_moments.1213.desc:0 "Nada. Meses de planejamento e tramas, espalhando rumores e pagando subornos, e ainda assim a divindade [Select_CString( target.IsFemale, 'da', 'do' )] [target.GetTitledFirstName] continua tão inabalável quanto antes!"
 scheme_critical_moments.1213.desc_discovered:0 "\n\nPara piorar ainda mais, não apenas desperdicei tempo e recursos, como também [target.GetFirstNameNoTooltip] descobriu minhas más intenções mal executadas!"
 scheme_critical_moments.1213.desc_secret:0 "\n\nPelo menos, [target.GetFirstNameNoTooltip] permanece completamente inconsciente de que algo estava acontecendo..."
 scheme_critical_moments.1213.t:0 "[scheme.GetNameNoTooltip]: Fracasso"
 scheme_critical_moments.1214.a:0 "Muito perturbador..."
 scheme_critical_moments.1214.desc:0 "Tudo começa com um olhar. Aquele olhar estranho de #EMP incerteza#!? Quando eu lhes ordeno fazer algo em nome da divindade, hesitam um pouco mais do que deveriam. Os servos sussurram sobre minhas falhas, meus defeitos que provam que sou, de fato, humano e não divino.\n\nComo ousam. Provarei que estão errados. Eu devo."
 scheme_critical_moments.1214.desc_discovered:0 "\n\nE para piorar a humilhação, meus agentes têm certeza: foi [owner.GetTitledFirstName] quem orquestrou essa descrença em minha divindade..."
 scheme_critical_moments.1214.t:0 "Mandala desacreditado"
 scheme_critical_moments.1215.a:0 "Como ousam!"
 scheme_critical_moments.1215.a_discovered:0 "Aquel[Select_CString( owner.IsFemale, 'a', 'e' )] [owner.Custom2('InsultNoun', ROOT.Char)]..."
 scheme_critical_moments.1215.desc:0 "Falsos rumores e sussurros nefastos tentam minar minha autoridade. Tentam fazer com que #EMP eu#! pareça menos divino.\n\nMeus seguidores não se deixam enganar, e minha posição está segura. Por enquanto."
 scheme_critical_moments.1215.desc_discovered:0 "No entanto, meus agentes têm certeza: foi [owner.GetTitledFirstName] quem orquestrou essa descrença em minha divindade..."
 scheme_critical_moments.1215.t:0 "Mandala inquebrável"
 scheme_critical_moments.1222.a:0 "Mais um tributário para atender ao chamado!"
 scheme_critical_moments.1222.desc:0 "Minhas provações e tribulações foram bem-sucedidas! Todo aquele tempo gasto desgastando [target.GetTitledFirstName|U], e agora [target.GetSheHe] finalmente cedeu, disposto(a) a aceitar minha suserania.\n\nGovernarei com esplendor e graça!"
 scheme_critical_moments.1222.t:0 "[scheme.GetNameNoTooltip]: Sucesso"
 scheme_critical_moments.1223.a:0 "Bah. Encontrarei seguidores mais dignos!"
 scheme_critical_moments.1223.desc:0 "[target.GetTitledFirstName|U] rejeitou minhas investidas, insistindo que [target.GetSheHe] está melhor por conta própria. Veremos quanto tempo isso dura."
 scheme_critical_moments.1223.desc_suzerain:0 "[target.GetTitledFirstName|U] rejeitou minhas investidas, alegando a superioridade [Select_CString( target.IsFemale, 'da', 'do' )] [target.GetSuzerain.GetTitledFirstName] como seu único e verdadeiro líder. Que absurdo."
 scheme_critical_moments.1223.intro:0 "Sem sucesso. Todo o meu trabalho árduo, para quê?"
 scheme_critical_moments.1223.t:0 "[scheme.GetNameNoTooltip]: Fracasso"
 scheme_critical_moments.1224.a:0 "Mal posso esperar!"
 scheme_critical_moments.1224.desc:0 "Chegou a hora. O momento para que [target.GetTitledFirstName] deixe o domínio de [target.GetSuzerain.GetTitledFirstName] está próximo. Falta apenas que [target.GetFirstNameNoTooltip] informe [target.GetSuzerain.GetTitledFirstNameNoTooltip] sobre a situação, e então receberei meu tributo...\n\nEspero que [target.GetSuzerain.GetTitledFirstNameNoTooltip|U] seja um governante honrado e permita que [target.GetHerHim] vá em paz para um suserano mais #EMP adequado#!."
 scheme_critical_moments.1224.t:0 "[scheme.GetNameNoTooltip]: Sucesso"
 scheme_critical_moments.1225.a:0 "É melhor eu oferecer algum tipo de #EMP incentivo...#!"
 scheme_critical_moments.1225.b:0 "#EMP Vamos ver quanto tempo isso dura.#!"
 scheme_critical_moments.1225.c:0 "Tudo bem por mim."
 scheme_critical_moments.1225.desc:0 "O tributário [Select_CString( target.IsFemale, 'da', 'do' )] [target.GetTitledFirstName] chega ao meu tribunal, e a mensagem é clara.\n\nAquel[Select_CString( owner.IsFemale, 'a', 'e' )] [owner.Custom2('InsultNoun', ROOT.Char)] [owner.GetTitledFirstName|U] tem manipulado a mente [Select_CString( target.IsFemale, 'da pobre', 'do pobre' )] [target.GetFirstNameNoTooltip], virando [target.GetHerHim] contra mim, e agora [target.GetSheHe] deseja #EMP partir#! do meu domínio, retirando o tributo e rejeitando minha suserania."
 scheme_critical_moments.1225.t:0 "Tributário interrompido"
 scheme_critical_moments.1226.a:0 "\"Para o resgate!\""
 scheme_critical_moments.1226.b:0 "Bem, então..."
 scheme_critical_moments.1226.b_incentivizing:0 "Ah, tudo bem. Fiz o que pude."
 scheme_critical_moments.1226.b_warring:0 "\"Eu não me inscrevi para uma #EMP guerra#!.\""
 scheme_critical_moments.1226.desc:0 "Suserano cedeu"
 scheme_critical_moments.1226.desc_incentivizing:0 "A carta [Select_CString( target.IsFemale, 'da', 'do' )] [target.GetTitledFirstName|U] é um triste relato. [incentivizing_suzerain.GetTitledFirstName] conseguiu #EMP convencer#! [Select_CString( owner.IsFemale, 'a velha', 'o velho' )] [owner.Custom2('InsultNounClumsy', ROOT.Char)] a ficar por #EMP mais um tempo#!...\n\n... e aquele falso 'Devaraja' [incentivizing_suzerain.GetFirstNameNoTooltip] teve que pagar alguns dividendos, na falta de divindade verdadeira.\n\nTalvez da próxima vez [target.GetFirstNameNoTooltip] enxergue a luz e se junte ao meu domínio."
 scheme_critical_moments.1226.desc_warring:0 "O emissário [Select_CString( target.IsFemale, 'da', 'do' )] [target.GetTitledFirstName|U] entra apressado na sala do trono: “Guerra!” [dummy_envoy.GetSheHe] grita, “Guerra! [warring_suzerain.GetTitledFirstName|U] decidiu corrigir o lapso momentâneo de julgamento [Select_CString( target.IsFemale, 'da minha', 'do meu' )] [target.GetLadyLord] à #EMP força!#!”\n\nAinda ofegante, [dummy_envoy.GetSheHe] se curva aos meus pés: “Por favor, por favor, #EMP ajude-nos!#!”\n\nUm arrepio percorre minha espinha. Guerra?"
 scheme_critical_moments.1226.t:0 "[scheme.GetNameNoTooltip]: Deixando ir"
 scheme_critical_moments.1226.t_incentivizing:0 "[scheme.GetNameNoTooltip]: Ganha-se e perde-se"
 scheme_critical_moments.1226.t_warring:0 "[scheme.GetNameNoTooltip]: Unindo forças"
 scheme_critical_moments.1242.a:0 "Bom, bom..."
 scheme_critical_moments.1242.desc:0 "Sempre soube que poderia contar com o povo trabalhador de [target_title.GetBaseNameNoTierNoTooltip] para vir em meu auxílio. Por uma causa maior, e para celebrar seu governante, eles literalmente tiraram as roupas do próprio corpo para financiar meu complexo de templos.\n\nQue encantador."
 scheme_critical_moments.1242.t:0 "[scheme.GetNameNoTooltip]: Sucesso"
 scheme_critical_moments.1243.a:0 "Que insolência!"
 scheme_critical_moments.1243.desc:0 "[Select_CString( owner.IsFemale, 'A', 'O' )] [owner.Custom('InsultNoun')] de [target_title.GetBaseNameNoTierNoTooltip] não conseguem ver a razão e estão rejeitando ativamente meus pedidos para contribuir com o meu #EMP grande#! projeto.\n\nAlegando #EMP falta de fundos#! como justificativa. Que absurdo! Quando há vontade, há um caminho!"
 scheme_critical_moments.1243.t:0 "[scheme.GetNameNoTooltip]: Fracasso"
 scheme_critical_moments.1252.a:0 "Maravilhoso!"
 scheme_critical_moments.1252.desc:0 "Sempre soube que poderia contar com [target.GetTitledFirstName] para vir em meu auxílio! Minha lábia, persuasão e debates deram fruto — [target.GetSheHe] concordou graciosamente em investir em meu projeto, fazendo todo o possível para tornar meu templo ainda mais glorioso.\n\nA transcendência está cada vez mais próxima..."
 scheme_critical_moments.1252.t:0 "[scheme.GetNameNoTooltip]: Sucesso"
 scheme_critical_moments.1253.a:0 "Tsc, tsc..."
 scheme_critical_moments.1253.desc:0 "Entro furiosamente na câmara, punhos cerrados em frustração — aquel[Select_CString( target.IsFemale, 'a', 'e' )] [target.Custom('InsultNoun')] [target.GetTitledFirstName] simplesmente se recusa a ver a razão. Será que não debati, argumentei e #EMP influenciei#! o círculo mais próximo de [target.GetHerHis]?!\n\nAlegando que há #EMP investimentos mais imediatos#! como prioridade no momento, em vez de contribuir com o meu projeto #EMP magnífico#!. Esperava mais de [target.GetHerHim]. Essa não será a última vez que [target.GetSheHe] ouvirá falar disso..."
 scheme_critical_moments.1253.t:0 "[scheme.GetNameNoTooltip]: Fracasso"
 scheme_extra_tariffs:0 "Tarifas Extras"
 scheme_extra_tariffs_desc:0 "O autor do plano convenceu seu alvo de que, se não se tornar voluntariamente seu tributário, haverá #EMP muito mais#! inconvenientes."
 scheme_fake_miracles:0 "Milagres falsos"
 scheme_fake_miracles_desc:0 "Os atos milagrosos do seu alvo são vistos como meras coincidências."
 scheme_potential_suzerain_might_join_war_tt:0 "\n@alert_icon! #alert_trial [CHARACTER.GetShortUIName] pode se tornar o [suzerain|E] de [TARGET_CHARACTER.GetShortUINamePossessive], juntando-se à guerra como defensor!#!"
 scheme_promised_hook_modifier:0 "Gancho Prometido"
 scheme_promised_hook_modifier_desc:0 "O instigador deste plano prometeu um gancho a seu alvo... se ele era real ou não, apenas o dono sabe."
 scheme_tribute_intimidation:0 "Negociações Agressivas"
 scheme_tribute_intimidation_desc:0 "O autor deste plano deixou muito claro ao seu alvo que, se não ceder, haverá consequências piores."
 spared_contribution_county_modifier:0 "Contribuição Poupada"
 spared_contribution_county_modifier_desc:0 "Os habitantes deste condado foram dispensados de suas obrigações monetárias para um grande projeto."
 unlock_coerce_tributary_scheme_tt:0 "Requer nível #V 2#! de [aspect_of_trickery|E]"
