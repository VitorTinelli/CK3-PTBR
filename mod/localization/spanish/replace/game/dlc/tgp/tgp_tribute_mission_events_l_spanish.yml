l_spanish:
 fervor_gain_suzerain_missionaries:0 "Missionários Suseranos"
 fervor_loss_suzerain_missionaries:0 "Missionários Rejeitados"
 refused_seal_of_investiture_opinion:0 "Negou a concessão de um [seal_of_investiture|E]"
 slated_for_castration_opinion:0 "Destinado à Castração"
 suzerain_trade_post_modifier:0 "Postos Comerciais do Suserano"
 suzerain_trade_post_modifier_desc:0 "Este Condado recebe um fluxo constante de mercadores dos postos comerciais do Suserano."
 tribute_mission.1000.abstain.artifact.desc:0 "Um artefato maravilhoso é criado"
 tribute_mission.1000.abstain.development.desc:0 "Comerciantes [overlord_scope.GetCulture.GetCollectiveNounNoTooltip] são enviados para sua capital"
 tribute_mission.1000.abstain.innovation.desc:0 "Progresso tecnológico é compartilhado"
 tribute_mission.1000.abstain.legitimacy.desc:0 "Você recebe bênçãos extras de legitimidade"
 tribute_mission.1000.abstain.monk.desc:0 "Um monge [overlord_scope.GetFaith.GetAdjective] é concedido a você, para espalhar sabedoria"
 tribute_mission.1000.abstain.treasury.desc:0 "Mercadorias preciosas são concedidas"
 tribute_mission.1000.abstain:0 "“Que [tributary_scope.GetFaith.HighGodName] nos traga muita prosperidade.”"
 tribute_mission.1000.artifact.tt:0 "Você recebe um [artifact|E] [overlord_scope.GetCulture.GetCollectiveNounNoTooltip]"
 tribute_mission.1000.artifact:0 "“[overlord_scope.GetCulture.GetCollectiveNounNoTooltip] faz, isso sim é algo...”"
 tribute_mission.1000.desc.adequate_gold:0 " “Estamos apresentando um tributo esplêndido, refletindo a apreciação [Select_CString( overlord_scope.IsFemale, 'da nossa', 'do nosso' )] [overlord_scope.GetLadyLord]!” Sorrio e aceno enquanto as abundantes cestas e urnas são apresentadas à sala."
 tribute_mission.1000.desc.adequate_herd:0 " “Os estábulos estão cheios de nossas criaturas, grandes e pequenas. Todas para noss[Select_CString( overlord_scope.IsFemale, 'a', 'o' )] [overlord_scope.GetLadyLord]!”"
 tribute_mission.1000.desc.artifact:0 " “Este [artifact_to_tribute.Custom('ArtifactType')|l] é um dos meus pertences mais preciosos — agora pertence [Select_CString( overlord_scope.IsFemale, 'a', 'ao' )] [overlord_scope.GetTitleAsNameNoTooltip], como gesto de nossa apreciação mútua.”"
 tribute_mission.1000.desc.bunga_mas:0 "\"Admire este esplendor; um conjunto de árvores bunga mas da mais alta qualidade, criadas apenas para [Select_CString( overlord_scope.IsFemale, 'a', 'o' )] [overlord_scope.GetTitledFirstNameNoTooltip] mais magnífic[Select_CString( overlord_scope.IsFemale, 'a', 'o' )]!\" Os olhos da plateia se arregalam e vários murmúrios percorrem o salão."
 tribute_mission.1000.desc.concubine:0 " “... Apresento [Select_CString( human_tribute.IsFemale, 'a encantadora', 'o encantador' )] [human_tribute.GetTitledFirstName], outra flor no jardim de [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]!” e [human_tribute.GetTitledFirstNameNoTooltip] avança graciosamente, corando enquanto [human_tribute.GetSheHe] atrai a atenção da sala."
 tribute_mission.1000.desc.eunuch:0 " “... Contemplem [Select_CString( human_tribute.IsFemale, 'a estimada', 'o estimado' )] [human_tribute.GetTitledFirstName] eunuc[Select_CString( human_tribute.IsFemale, 'a', 'o' )], orgulhoso de servir à corte do [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]!” e [human_tribute.GetTitledFirstNameNoTooltip] avança, causando um turbilhão de sussurros na sala."
 tribute_mission.1000.desc.excessive_gold:0 " “Contemplem esta magnificência!” Sorrio orgulhosamente enquanto a sala #EMP oo's#! e #EMP aa's#! diante da opulência do tributo — caixas, urnas, cestas, estátuas. #EMP Abundância.#!"
 tribute_mission.1000.desc.excessive_herd:0 " “Uma vasta quantidade de criaturas, grandes, pequenas, fortes, rápidas, foi trazida para noss[Select_CString( overlord_scope.IsFemale, 'a', 'o' )] [overlord_scope.GetLadyLord]! Elas servirão bem à corte do [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]!”"
 tribute_mission.1000.desc.segway:0 "\n\nSem demora, declaro:"
 tribute_mission.1000.desc.small_gold:0 " “Permita-me apresentar um humilde tributo, pequeno em escala mas grande em espírito!” Me curvo enquanto meus servos carregam pequenas caixas de mercadorias."
 tribute_mission.1000.desc.small_herd:0 " “Trouxemos as melhores criaturas de nossos rebanhos, prontas para servir [Select_CString( overlord_scope.IsFemale, 'minha', 'meu' )] [overlord_scope.GetLadyLord]!”"
 tribute_mission.1000.development:0 "“Sobre aqueles mercados inexplorados em [tributary_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]...”"
 tribute_mission.1000.failure.desc:0 "Sua tentativa foi ignorada"
 tribute_mission.1000.failure.t:0 "Tentativa Falhou"
 tribute_mission.1000.failure.tt:0 "[receiving_character.GetShortUIName] decide sobre o presente"
 tribute_mission.1000.innovation.tt:0 "Você descobre uma nova [innovation|E] para pesquisar ou ganha progresso em [fascination|E]"
 tribute_mission.1000.innovation:0 "“Compartilhar conhecimento — existe propósito mais nobre...”"
 tribute_mission.1000.intro.attendant:0 "um dos altos assistentes [Select_CString( overlord_scope.IsFemale, 'da', 'do' )] [overlord_scope.GetTitledFirstName], sorrindo apologeticamente e acenando para que nos aproximemos."
 tribute_mission.1000.intro.councillor:0 "[receiving_character.Custom('CouncilPosition')] [Select_CString( overlord_scope.IsFemale, 'da', 'do' )] [overlord_scope.GetTitledFirstName], [receiving_character.GetTitledFirstName], assentindo com a cabeça e acenando para que nos aproximemos."
 tribute_mission.1000.intro.diarch:0 "[receiving_character.GetDiarchTitle] [Select_CString( overlord_scope.IsFemale, 'da', 'do' )] [overlord_scope.GetTitledFirstName], [receiving_character.GetTitledFirstName], acenando para que nos aproximemos."
 tribute_mission.1000.intro.overlord:0 "[overlord_scope.GetTitledFirstName], acenando de forma régia para que nos aproximemos."
 tribute_mission.1000.intro:0 "Entramos no grande salão de [overlord_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] e somos recebidos por"
 tribute_mission.1000.monk.tt:0 "[receiving_character.GetShortUIName] irá lhe presentear com um [courtier|E] monge [overlord_scope.GetFaith.GetAdjective]"
 tribute_mission.1000.outro.attendant:0 "\n\nO assistente pondera por um momento, permitindo que eu fale antes:"
 tribute_mission.1000.outro:0 "\n\n[receiving_character.GetTitledFirstNameNoTooltip] pondera por um momento, permitindo que eu fale antes:"
 tribute_mission.1000.success.desc:0 "Você convenceu com sucesso [receiving_character.GetHerHim]"
 tribute_mission.1000.success.t:0 "Sucesso"
 tribute_mission.1000.t:0 "$tribute_mission_header$ Pagando Tributo"
 tribute_mission.1000.treasury:0 "“Agora, os tecidos de [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]... que esplendor...”"
 tribute_mission.1002.a:0 "“[human_tribute.GetSheHe|U] provavelmente será útil em algum cargo na corte.”"
 tribute_mission.1002.b.flavor:0 "Não é um #EMP exemplar notável#!..."
 tribute_mission.1002.b:0 "“Bem, deveríamos nomear você #EMP imediatamente...#!”"
 tribute_mission.1002.beauty.concubine.bad:0 "\n\nCabelos emaranhados, pele manchada... o ângulo da mandíbula. Poucas qualidades redentoras em relação à aparência de [human_tribute.GetHerHis]. Aperto levemente os lábios."
 tribute_mission.1002.beauty.concubine.good:0 "\n\nCabelos brilhantes, pele clara, olhos reluzentes e corpo agradável... Delicio meus olhos com a figura de [human_tribute.GetHerHis], sem me saciar completamente ainda."
 tribute_mission.1002.c:0 "“Você trabalhará diretamente para mim.”"
 tribute_mission.1002.d.tt:0 "[human_tribute.GetShortUIName] é encaminhado(a) de volta para [tributary_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTier]"
 tribute_mission.1002.d:0 "“Hmm, creio que estamos completos no momento.”"
 tribute_mission.1002.desc.concubine:0 "Uma concubina encantadora, apresentada como [human_tribute.GetTitledFirstName], pelo que se pode ver."
 tribute_mission.1002.desc.eunuch:0 "Um eunuco experiente, pelo que se nota.\n\n[Select_CString( human_tribute.IsFemale, 'A', 'O' )] [human_tribute.GetWomanMan], apresentad[Select_CString( human_tribute.IsFemale, 'a', 'o' )] como [human_tribute.GetTitledFirstName], exala paz e calma além de seus anos, contemplando silenciosamente enquanto inspeciono [human_tribute.GetHerHis] ser."
 tribute_mission.1002.desc.new_eunuch:0 "Um eunuco muito desconfortável, pelo que se nota.\n\n[Select_CString( human_tribute.IsFemale, 'A', 'O' )] [human_tribute.GetWomanMan], apresentad[Select_CString( human_tribute.IsFemale, 'a', 'o' )] como [human_tribute.GetTitledFirstName], franzindo o rosto ao se aproximar para inspeção."
 tribute_mission.1002.exterior.plain:0 "\n\nA aparência de [human_tribute.GetHerHis|U] pode não ser nada fora do comum, mas o brilho no olho de [human_tribute.GetHerHis] ainda me intriga."
 tribute_mission.1002.personality.angry:0 "\n\nA ruga cada vez mais profunda entre as sobrancelhas de [human_tribute.GetHerHis] conta a história de um[Select_CString( human_tribute.IsFemale, 'a', '' )] [human_tribute.GetWomanMan] bastante opinativ[Select_CString( human_tribute.IsFemale, 'a', 'o' )]."
 tribute_mission.1002.personality.bold:0 "\n\nUma postura vigorosa indica que est[Select_CString( human_tribute.IsFemale, 'a', 'e' )] [human_tribute.GetWomanMan] pode se impor, para o bem ou para o mal."
 tribute_mission.1002.personality.cynical:0 "\n\nUm leve tremor no canto do olho de [human_tribute.GetHerHis], enquanto [human_tribute.GetHerHis] ergue os braços em posição defensiva, indica que est[Select_CString( human_tribute.IsFemale, 'a', 'e' )] [human_tribute.GetWomanMan] tem uma visão muito particular do mundo."
 tribute_mission.1002.personality.fallback:0 "\n\n[human_tribute.GetFirstNameNoTooltip] lança olhares rápidos em minha direção, depois pelo salão, e volta para mim, como se procurasse pistas para decifrar um enigma."
 tribute_mission.1002.personality.shy:0 "\n\n[human_tribute.GetSheHe|U] se encolhe ao passar alguns guardas muito próximos. Tentando ocupar o mínimo de espaço possível, [human_tribute.GetSheHe] abaixa levemente os ombros, sem fazer muito barulho para [Select_CString( human_tribute.IsFemale, 'si mesma', 'si mesmo' )]."
 tribute_mission.1002.physique.concubine.bad:0 "\n\nO constante limpar da garganta, braços finos... algo parece errado no físico de [human_tribute.GetHerHis], mas é difícil identificar exatamente o que. Isso me deixa levemente desconfortável."
 tribute_mission.1002.physique.concubine.good:0 "\n\nO físico impressionante dest[Select_CString( human_tribute.IsFemale, 'a', 'e' )] [human_tribute.GetWomanMan] me faz sentir mais saudável apenas olhando para [human_tribute.GetHerHim]. Gosto bastante disso."
 tribute_mission.1002.segway:0 "[tributary_scope.GetTitledFirstName|U] entra no grande salão com [tributary_scope.GetHerHis] comitiva, ansioso(a) para apresentar [tributary_scope.GetHerHis] tributo."
 tribute_mission.1002.t:0 "$tribute_mission_header$ Qual Destino Aguarda"
 tribute_mission.1005.artifact.tt:0 "Você concede a [tributary_scope.GetShortUINameNoTooltip] um [artifact|E] [overlord_scope.GetCulture.GetCollectiveNounNoTooltip]"
 tribute_mission.1005.artifact:0 "\"Concederei a ti relíquias [overlord_scope.GetCulture.GetCollectiveNounNoTooltip].\""
 tribute_mission.1005.desc.adequate_gold:0 "\n\nAssinto levemente diante do tributo respeitável; os metais preciosos e tecidos refletem a luz ocasionalmente, brilhando suavemente.\n\nAgora, para o próximo ponto: qual benevolência devo conceder em troca..."
 tribute_mission.1005.desc.adequate_herd:0 "\n\nAnimais de qualidade respeitável olham curiosos ao redor do salão enquanto são examinados por meus servos.\n\nSerão uma boa adição. Agora, como recompensar isso..."
 tribute_mission.1005.desc.appointed_concubine:0 "\n\nMinha mente vagueia levemente enquanto permaneço observando as curvas e #EMP atributos#! de [human_tribute.GetHerHis].\n\nEnquanto o sangue corre para minhas bochechas, esforço-me para focar na questão principal — o que devo conceder a [tributary_scope.GetTitledFirstNameNoTooltip] por trazer este #EMP delicioso#! tributo?"
 tribute_mission.1005.desc.appointed_eunuch:0 "\n\nComo meu novo eunuco chefe, [human_tribute.GetSheHe] me servirá bem.\n\nDou um leve sorriso enquanto considero cuidadosamente o que conceder a [tributary_scope.GetTitledFirstNameNoTooltip]..."
 tribute_mission.1005.desc.artifact:0 "\n\nO [artifact_to_tribute.GetName] é um tributo refinado, e deixo minha mão deslizar cuidadosamente por suas bordas. Uma peça sólida, sem dúvida.\n\nAgora, como devo responder a isso..."
 tribute_mission.1005.desc.bunga_mas:0 "\n\nUma árvore de flores douradas! O requintado artefato se sobressai sobre o restante da oferenda, que, em comparação, parece modesta. Pequenas folhas captam a luz e parecem emitir um brilho, apenas igualado pelo meu próprio.\n\nRápido me recomponho, tentando não demonstrar demais, enquanto reflito sobre que benevolência devo retribuir por este magnífico presente..."
 tribute_mission.1005.desc.concubine:0 "\n\nApós ter adicionado [human_tribute.GetHerHim] à nossa corte, tenho certeza de que [human_tribute.GetSheHe] será útil em algum lugar.\n\nDiante disso, devo decidir o que conceder a [tributary_scope.GetTitledFirstNameNoTooltip]..."
 tribute_mission.1005.desc.eunuch:0 "$tribute_mission.1005.desc.concubine$"
 tribute_mission.1005.desc.excessive_gold:0 "\n\nOuro, tecidos, pedras preciosas — uma exibição ostensiva, mas #EMP deliciosa#! me recebe. Observo cuidadosamente minha expressão, tentando não parecer muito impressionado.\n\nIsso será adequado. Agora, como recompensar esta demonstração de opulência..."
 tribute_mission.1005.desc.excessive_herd:0 "\n\nAlguns dos melhores animais que já vi são apresentados como tributo: pelagens brilhantes, olhos reluzentes — e ainda há mais deles esperando do lado de fora. Um tributo bastante impressionante.\n\nAgora, como recompensar esta demonstração de opulência..."
 tribute_mission.1005.desc.rejected_concubine:0 "\n\nUm espécime desprezível, frunzo os lábios enquanto mais uma vez observo este chamado tributo. E [tributary_scope.GetTitledFirstNameNoTooltip] o julgou digno de nossa atenção. #EMP Hmph.#!\n\nAgora, o que devo conceder a [tributary_scope.GetTitledFirstNameNoTooltip]..."
 tribute_mission.1005.desc.rejected_eunuch:0 "$tribute_mission.1005.desc.rejected_concubine$"
 tribute_mission.1005.desc.small_gold:0 "\n\nLevanto uma sobrancelha enquanto os servos examinam as poucas moedas e ornamentos que constituem este tributo menor.\n\nNão encherá nossos cofres — mas ao menos [tributary_scope.GetTitledFirstNameNoTooltip] cumpriu suas obrigações tributárias. Agora, qual benevolência devo conceder em troca..."
 tribute_mission.1005.desc.small_herd:0 "\n\nA pequena quantidade de animais balança a cabeça e olha ao redor ansiosamente enquanto os servos os examinam.\n\nNão é muito — mas ao menos [tributary_scope.GetTitledFirstNameNoTooltip] cumpriu suas obrigações tributárias. Agora, qual benevolência devo conceder em troca..."
 tribute_mission.1005.desc:0 "\n\nConsidero cuidadosamente o tributo apresentado.\n\nAgora, como devo responder a isso..."
 tribute_mission.1005.development:0 "\"Estabeleceremos um maravilhoso posto comercial em sua capital.\""
 tribute_mission.1005.innovation.tt:0 "Você concede a [tributary_scope.GetShortUINameNoTooltip] alguns avanços tecnológicos"
 tribute_mission.1005.innovation:0 "\"Há alguns avanços tecnológicos que podemos compartilhar...\""
 tribute_mission.1005.intro.human_tribute:0 "[tributary_scope.GetTitledFirstName] começa a se mover de um pé para o outro enquanto [tributary_scope.GetSheHe] aguarda minha decisão, lançando olhares ocasionais para [human_tribute.GetTitledFirstName]."
 tribute_mission.1005.intro:0 "[tributary_scope.GetTitledFirstName] entra no grande salão, se aproxima e apresenta [tributary_scope.GetHerHis] tributo com um sorriso bajulador:"
 tribute_mission.1005.legitimacy:0 "\"Reafirmo você como o verdadeiro governante de [tributary_scope.GetCapitalLocation.GetCounty.GetName].\""
 tribute_mission.1005.monk:0 "\"Você será guiado por um dos meus monges mais sábios.\""
 tribute_mission.1005.t.ai.bunga_mas:0 "$tribute_mission_header$ [newly_created_bunga_mas.GetNameNoTooltip]"
 tribute_mission.1005.t.artifact:0 "$tribute_mission_header$ Artefatos [Select_CString( tributary_scope.IsFemale, 'da', 'do' )] [tributary_scope.GetTitledFirstNameNoTooltip]"
 tribute_mission.1005.t.bunga_mas:0 "$tribute_mission_header$ Flores Douradas [Select_CString( tributary_scope.IsFemale, 'da', 'do' )] [tributary_scope.GetTitledFirstNameNoTooltip]"
 tribute_mission.1005.t.concubine:0 "$tribute_mission_header$ Flores [Select_CString( tributary_scope.IsFemale, 'da', 'do' )] [tributary_scope.GetTitledFirstNameNoTooltip]"
 tribute_mission.1005.t.eunuch:0 "$tribute_mission_header$ Servos [Select_CString( tributary_scope.IsFemale, 'da', 'do' )] [tributary_scope.GetTitledFirstNameNoTooltip]"
 tribute_mission.1005.t.gold:0 "$tribute_mission_header$ Ouro [Select_CString( tributary_scope.IsFemale, 'da', 'do' )] [tributary_scope.GetTitledFirstNameNoTooltip]"
 tribute_mission.1005.t.herd:0 "$tribute_mission_header$ Rebanho [Select_CString( tributary_scope.IsFemale, 'da', 'do' )] [tributary_scope.GetTitledFirstNameNoTooltip]"
 tribute_mission.1005.t:0 "$tribute_mission_header$ O Tributo"
 tribute_mission.1005.treasury:0 "\"Vamos recompensar seu tributo com preciosos bens comerciais.\""
 tribute_mission.1006.decline.dont_wanna:0 "[tributary_scope.GetSheHe|U] não merece tal honra."
 tribute_mission.1006.decline.no_money:0 "O tesouro imperial não pode arcar com a despesa."
 tribute_mission.1006.desc:0 "[tributary_scope.GetTitledFirstName|U] permanece prostrado por um período que começa a se tornar desconfortavelmente longo. [tributary_scope.GetSheHe] espera algo mais de mim?\n\nAvisto [Select_CString( scribe_character.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scribe_character'))] [scribe_character.GetShortUIName], o artesão encarregado de criar meus selos oficiais, esperando estoicamente à margem da corte lotada.\n\nÉ hora de conceder [Select_CString( tributary_scope.IsFemale, 'a', 'ao' )] [tributary_scope.GetTitledFirstNameNoTooltip] o reconhecimento oficial do Filho do Céu?"
 tribute_mission.1006.grant.tt:0 "[scribe_character.GetShortUIName] irá criar um [seal_of_investiture|E] para [tributary_scope.GetTitledFirstName]"
 tribute_mission.1006.grant:0 "Formalizaremos este acordo para a eternidade."
 tribute_mission.1006.t:0 "$tribute_mission_header$ Selo de Investidura"
 tribute_mission.1007.a:0 "Isso muda tudo."
 tribute_mission.1007.desc:0 "Após uma pausa prolongada, [receiving_character.GetTitledFirstName] se ergue cerimoniosamente. No momento certo, o escriba imperial [scribe_character.GetShortUIName] surge da multidão, carregando um $game_concept_seal_of_investiture$ finamente elaborado — com meu nome nele!\n\n[receiving_character.GetTitledFirstName] o recebe cuidadosamente e me pede para me levantar. O público acompanha com atenção.\n\nAo receber a bênção do Filho do Céu, um pensamento me ocorre: que novas portas este precioso contrato pode abrir?"
 tribute_mission.1007.t:0 "$tribute_mission_header$ Selo de Investidura"
 tribute_mission.1008.a:0 "\"...e, claro, [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] levaria presentes regularmente a [receiving_character.GetLiege.GetCapitalLocation.GetNameNoTooltip].\""
 tribute_mission.1008.b:0 "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] não se curvará."
 tribute_mission.1008.desc:0 "Enquanto os presentes são trocados em cerimônia, sinto uma expectativa se espalhar pela corte, como se certas palavras tivessem sido deixadas de lado. Embora nunca declarado explicitamente, a expectativa sobre mim torna-se clara lentamente.\n\n[receiving_character.GetTitledFirstNameNoTooltip] deseja meu voto para manter esses presentes fluindo, em troca da benevolência de [receiving_character.GetLiege.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip].\n\nAinda há tempo para recusar a oferta de forma honrada, mantendo minha independência, com todas as implicações que isso possa trazer."
 tribute_mission.1008.t:0 "$tribute_mission_header$ Tributo Contínuo"
 tribute_mission.1010.a:0 "\"Bênçãos sobre ti!\""
 tribute_mission.1010.desc.artifact:0 "$tribute_mission.1010.segway$ um precioso artefato [overlord_scope.GetCulture.GetCollectiveNounNoTooltip], [tribute_reward_type_artifact.GetName], é apresentado a mim sobre uma almofada de veludo, aumentando seu brilho."
 tribute_mission.1010.desc.development:0 "$tribute_mission.1010.segway$ um servo erudito se aproxima, apresentando-me um contrato.\nNo contrato, um acordo comercial para estabelecer postos comerciais [overlord_scope.GetCulture.GetCollectiveNounNoTooltip] em [tributary_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip], contribuindo para o desenvolvimento e riqueza geral da região."
 tribute_mission.1010.desc.innovation:0 "$tribute_mission.1010.segway$ um grupo de monges se aproxima, entregando-me alguns pergaminhos contendo novas informações e revelações sobre suas inovações."
 tribute_mission.1010.desc.legitimacy:0 "\n\n[overlord_scope.GetSheHe|U] acena para que eu me aproxime, e então, com majestosa graça, se aproxima do chão diante de mim. Inclino a cabeça enquanto [overlord_scope.GetTitleAsNameNoTooltip] realizam os gestos cerimoniais [overlord_scope.GetCulture.GetCollectiveNounNoTooltip].\n\nAo final, [overlord_scope.GetSheHe] proclama com voz imponente: \"Reafirmo você como o verdadeiro governante de [tributary_scope.GetCapitalLocation.GetCounty.GetName]. Vá em paz.\""
 tribute_mission.1010.desc.monk:0 "$tribute_mission.1010.segway$ [new_monk.Custom('GetArticledAgeDescriptionGender')] surge e se apresenta como [new_monk.GetTitledFirstName], um monge [overlord_scope.GetFaith.GetAdjectiveNoTooltip]. [new_monk.GetSheHe|U] informa alegremente suas intenções de viajar comigo para [tributary_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip] a fim de oferecer seus serviços."
 tribute_mission.1010.desc.treasury:0 "$tribute_mission.1010.segway$ uma profusão de recipientes carregados com tecidos preciosos, lingotes e especiarias de origem [overlord_scope.GetCulture.GetCollectiveNounNoTooltip] é apresentada em um espetáculo de esplendor."
 tribute_mission.1010.intro.attendant:0 "O atendente pondera por alguns instantes antes de parecer chegar a uma decisão."
 tribute_mission.1010.intro.postseal:0 "Quando a solene e legalista cerimônia de $game_concept_seal_of_investiture$ termina, a opulenta riqueza de [overlord_scope.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip] irrompe."
 tribute_mission.1010.intro:0 "[receiving_character.GetTitledFirstName] avalia meu tributo de cima a baixo antes de parecer chegar a uma decisão."
 tribute_mission.1010.outro:0 "\n\n\"Considere-se agraciado com a graça de [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip], [Select_CString( tributary_scope.IsFemale, 'minha', 'meu' )] [tributary_scope.GetTitleAsNameNoTooltip]. Boa viagem.\""
 tribute_mission.1010.segway:0 "\n\nAcenando em direção ao fundo da sala,"
 tribute_mission.1010.t.artifact:0 "$tribute_mission_header$ O Melhor de [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]"
 tribute_mission.1010.t.development:0 "$tribute_mission_header$ Comerciantes de [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]"
