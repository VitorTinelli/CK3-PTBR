 tribute_mission.9000.a:0 "É mesmo."
 tribute_mission.9000.desc:0 "Infelizmente, não tenho condições de realizar uma exibição de tributo neste momento.\n\nEspero sinceramente que [Select_CString( actor.IsFemale, 'minha', 'meu' )] [actor.GetTitleAsNameNoTooltip] compreenda."
 tribute_mission.9000.opening:0 "[recipient.Custom2('AppropriateGreeting', ROOT.Char )]"
 tribute_mission.9010.a:0 "Excelente."
 tribute_mission.9010.desc:0 "Claro que concederemos [Select_CString( actor.IsFemale, 'a minha', 'ao meu' )] [actor.GetTitleAsNameNoTooltip] o tributo mais requintado!\n\nNossa jornada começa; e nossos olhos estão voltados para [actor.GetCapitalLocation.GetName]."
 tribute_mission.9010.opening:0 "[recipient.Custom2('AppropriateGreeting', ROOT.Char )]"
 tribute_mission.9500.a:0 "Entendo."
 tribute_mission.9500.desc:0 "Achei que você fosse um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] de palavra. Vejo que não é o caso, tributário.\n\nSua recente falha em cumprir uma missão de tributo à minha corte não passou despercebida."
 tribute_mission.9500.opening:0 "[overlord.Custom2('AppropriateGreeting', ROOT.Char )]"
 tribute_mission.9750.a:0 "Não, precisamos completar nosso tributo!"
 tribute_mission.9750.b:0 "Melhor voltar para casa."
 tribute_mission.9750.desc:0 "Por uma série de eventos infelizes, nosso tributo não está mais em nosso grupo! [human_tribute.GetTitledFirstName], desaparecido...\n\nFruncio a testa. Certamente deveríamos voltar e nos reagrupar?"
 tribute_mission.9750.t:0 "$tribute_mission_header$ Tributo Não Mais"
 tribute_mission.9750.tt:0 "$CANCEL_TRAVEL_PLAN_EFFECT$"
 tribute_mission.9760.a.failure:0 "[escapee_eunuch.GetShortUIName] escapa e tenta vingar-se"
 tribute_mission.9760.a.success.tt:0 "[escapee_eunuch.GetShortUIName] está subjugado, e o [tribute_mission|E] continua"
 tribute_mission.9760.a.success:0 "[escapee_eunuch.GetShortUIName] é dominado"
 tribute_mission.9760.a:0 "\"#EMP Ataque!#!\""
 tribute_mission.9760.b.critical_failure:0 "[escapee_eunuch.GetShortUIName] é morto no processo"
 tribute_mission.9760.b.failure:0 "[escapee_eunuch.GetShortUIName] escapa"
 tribute_mission.9760.b.success:0 "$tribute_mission.9760.a.success$"
 tribute_mission.9760.b:0 "\"#EMP Guardas!#!\""
 tribute_mission.9760.c:0 "\"Você está livre para ir. Apenas #EMP saia!#!\""
 tribute_mission.9760.desc.vengeful:0 "O caos do lado de fora finalmente me desperta de meu sono profundo. Quase acordado, escuto relutantemente os gritos fragmentados #EMP '... o tributo escapou! Encontrar [escapee_eunuch.GetHerHim]!'#! quando uma silhueta sombria surge na minha porta.\n\n'#EMP [escapee_eunuch.GetFaith.HighGodName] perdoe meu pecado,'#! nosso tributo humano, [escapee_eunuch.GetTitledFirstName], uiva enquanto [escapee_eunuch.GetSheHe] se lança em minha direção.\n\nEu saio rapidamente da cama, desviando do primeiro golpe, e de repente estamos ambos de pé, circulando um ao outro."
 tribute_mission.9760.desc:0 "Acordo inexplicavelmente por um breve momento. Em meu estado sonolento, olho ao redor da minha tenda e vejo uma sombra passando pelas abas da tenda. Recuando com o frio da noite, levanto-me do meu leito e vou espiar do lado de fora.\n\nPara minha surpresa, sou saudado por ninguém menos que nosso tributo humano, [escapee_eunuch.GetTitledFirstName], que de alguma forma conseguiu escapar de seus acompanhantes.\n\n[escapee_eunuch.GetHerHis|U] olhos se arregalam de medo ao notar minha presença. '[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [escapee_eunuch.Custom2('RelationToMe', ROOT.Char )], por favor... eu não posso continuar com isso. Por favor,' [escapee_eunuch.GetSheHe] implora, pronto para fugir na noite."
 tribute_mission.9760.t:0 "$tribute_mission_header$ A Fuga"
 tribute_mission.9800.a:0 "Vamos retornar para casa por enquanto."
 tribute_mission.9800.desc.different_end_location:0 "Com a mudança de suserano, parece que [current_overlord.GetTitledFirstName] possui sua capital em um local diferente.\n\nNossa viagem e tributo estava planejada para [old_overlord.GetTitledFirstName], então meus conselheiros insistem que a decisão sábia seria retornar a [ROOT.Char.GetCapitalLocation.GetName] e nos reagrupar."
 tribute_mission.9800.desc.no_longer_tributary:0 "Que reviravolta! Chega até mim a notícia de que não estamos mais sob o jugo do tributo!\n\nTantos assuntos e questões a resolver em casa — e lidar com essa nova independência é o principal deles."
 tribute_mission.9800.desc.suzerain_turned_liege:0 "Parece que minhas obrigações tributárias mudaram, agora que sou de fato um vassalo [Select_CString( ROOT.Char.GetLiege.IsFemale, 'da', 'do' )] [ROOT.Char.GetLiege.GetTitledFirstName].\n\nDiante disso, há muitos outros assuntos a tratar em casa, dos quais pagar tributo não é mais um deles. Que reviravolta!"
 tribute_mission.9800.desc.unable_to_accept_tribute:0 "Os murmúrios da estrada me informam que nosso novo suserano não parece interessado no tipo de tributo que irei apresentar.\n\nPrefiro não arriscar enfurecer sua alteza, então o movimento mais sensato seria nos reagrupar em [ROOT.Char.GetCapitalLocation.GetName]."
 tribute_mission.9800.t:0 "$tribute_mission_header$ Mudança de Planos"
 tribute_mission.adequate_reserved_gold:0 "Reserve @gold_icon!#V [THIS.Char.MakeScope.ScriptValue('adequate_gold_tribute_value')]#! para o [tribute|E]"
 tribute_mission_common_bunga_mas_desc:0 "Um [Glossary( 'Bunga Mas', 'BUNGA_MAS_GLOSS' )], apresentado como tributo [Select_CString( overlord_scope.IsFemale, 'a', 'ao' )] [overlord_scope.GetTitledFirstName] [Select_CString( tributary_scope.IsFemale, 'pela', 'pelo' )] [tributary_scope.GetTitledFirstName]."
 tribute_mission_famed_bunga_mas_desc:0 "Duas árvores douradas e prateadas requintadas, estes [Glossary( 'Bunga Mas', 'BUNGA_MAS_GLOSS' )] foram apresentados [Select_CString( overlord_scope.IsFemale, 'a', 'ao' )] [overlord_scope.GetTitledFirstName] [Select_CString( tributary_scope.IsFemale, 'pela', 'pelo' )] [tributary_scope.GetTitledFirstName] como tributo. O trabalho em metal e as esculturas narram a história de uma arte refinada."
 tribute_mission_header:0 "Missão de Tributo:"
 tribute_mission_illustrious_bunga_mas_desc:0 "Oferecido como tributo [Select_CString( overlord_scope.IsFemale, 'a', 'ao' )] [overlord_scope.GetTitledFirstName] [Select_CString( tributary_scope.IsFemale, 'pela', 'pelo' )] [tributary_scope.GetTitledFirstName], o [Glossary( 'Bunga Mas', 'BUNGA_MAS_GLOSS' )] consiste em um magnífico conjunto de árvores douradas e prateadas, meticulosamente forjadas e esculpidas a partir dos melhores metais; flores capturadas como flores perpétuas."
 tribute_mission_masterwork_bunga_mas_desc:0 "Oferecido primeiramente como tributo [Select_CString( overlord_scope.IsFemale, 'a', 'ao' )] [overlord_scope.GetTitledFirstName] [Select_CString( tributary_scope.IsFemale, 'pela', 'pelo' )] [tributary_scope.GetTitledFirstName], este fino conjunto de [Glossary( 'Bunga Mas', 'BUNGA_MAS_GLOSS' )] captura a luz de maneira espetacular."
 tribute_mission_notification.new_overlord.desc:0 "Sua [tribute_mission|E] suserana mudou para [new_overlord.GetShortUIName]"
 tribute_mission_notification.new_overlord.title:0 "Mudança de Suserano da Missão de Tributo"
 tribute_mission_suzerain_legitimacy_gain_title:0 "Legitimidade Ganha com Tributo"
 tribute_mission_tributary_subject_standing_gain_title:0 "Ganhou [ConcatIfNeitherEmpty(GetPlayer.Custom('SubjectStandingIcon'),' ')][tributary_scope.Custom('SubjectStanding')]"
 tribute_mission_tributary_subject_standing_gain_tt_major:0 "[tributary_scope.GetShortUIName|U] ganhou #EMP muito#! de [ConcatIfNeitherEmpty(tributary_scope.Custom('SubjectStandingIcon'),' ')][tributary_scope.Custom('SubjectStanding')]"
 tribute_mission_tributary_subject_standing_gain_tt_minor:0 "[tributary_scope.GetShortUIName|U] ganhou um pouco de [ConcatIfNeitherEmpty(tributary_scope.Custom('SubjectStandingIcon'),' ')][tributary_scope.Custom('SubjectStanding')]"
