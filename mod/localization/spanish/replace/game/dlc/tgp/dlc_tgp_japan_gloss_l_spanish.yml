l_spanish:
 CHRYSANTHEMUM_THRONE_GLOSS:0 "O #bold Trono do Crisântemo#! refere-se ao Takamikura ou trono imperial do Japão, tanto no sentido literal quanto como uma representação metonímica do [Glossary( 'Imperador', 'TENNO_GLOSS' )] e da autoridade legal para a existência do governo. O selo imperial que utiliza um crisântemo de dezesseis pétalas foi adotado pela primeira vez pelo imperador Go-Toba (1180-1239) como seu símbolo pessoal, sendo posteriormente adotado pela [Glossary( 'casa imperial', 'YAMATO_GLOSS' )]. O crisântemo representa longevidade e renovação, em consonância com a linhagem imperial ininterrupta do Japão."
 FUJIWARA_GLOSS:0 "#bold $dynn_Fujiwara$#! foi um [Glossary( 'Honsei', 'HONSEI_GLOSS' )] concedido pelo imperador $Tenji$ ao seu influente cortesão, $dynn_Nakatomi$ $Kamatari$.\n\nOs muitos ramos de seus descendentes dominariam a política japonesa por séculos, servindo simultaneamente como [Glossary( 'Kampaku', 'KAMPAKU_GLOSS' )] da família imperial [Glossary( 'Yamato', 'YAMATO_GLOSS' )].\n\nJunto com os [Glossary( 'Seiwa Minamoto', 'MINAMOTO_GLOSS' )] e [Glossary( 'Kanmu Taira', 'TAIRA_GLOSS' )], os $dynn_Fujiwara$ foram uma das casas mais poderosas do Japão medieval inicial.\n\nSeu [Glossary( 'Mon', 'MON_GLOSS' )] tradicional era uma #EMP Sagarifuji#! — glicínia pendente — flor."
 HEIJI_REBELLION_GLOSS:0 "A #bold Rebelião Heiji#! foi um conflito entre a casa [Glossary( 'Kawachi Minamoto', 'MINAMOTO_GLOSS' )] e o clã [Glossary( 'Kanmu Taira', 'TAIRA_GLOSS' )], sendo que este último contava com o apoio de várias outras casas Minamoto, disputando o controle sobre o Imperador do Japão. \n\nAcreditando que a corte imperial favorecia seus rivais, os Minamoto se rebelaram para tentar evitar isso. No fim, foram derrotados, e muitos membros da casa foram exilados ou executados."
 HONSEI_GLOSS:0 "#bold Honsei#! — #EMP sobrenomes originais#! — como #EMP [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )]#!, #EMP [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )]#!, #EMP [Glossary( 'Taira', 'MINAMOTO_GLOSS' )]#!, #EMP [Glossary( 'Tachibana', 'TACHIBANA_GLOSS' )]#! e #EMP [Glossary( 'Takashina', 'TAKASHINA_GLOSS' )]#!, são os sobrenomes mais antigos e prestigiosos do Japão, concedidos a cortesãos pela família imperial.\n\nEsses nomes eventualmente seriam diferenciados ou substituídos pelos nomes #EMP Kamei#! e #EMP Uji#!, à medida que crescia a necessidade de distinguir ramos familiares e a corte imperial entrava em declínio."
 JOKO_GLOSS:0 "#bold Jōkō#! é o termo geral para um ex-[Glossary( 'Imperador', 'TENNO_GLOSS' )] que abdicou do Trono do Crisântemo. À medida que o poder foi sendo tomado da família imperial, tornou-se cada vez mais comum que um Imperador escolhesse abdicar quando sua sucessão estivesse garantida por um herdeiro saudável, permitindo-lhe participar da política por trás do trono, sem suas responsabilidades cerimoniais."
 KAMPAKU_GLOSS:0 "#bold Kampaku#! é um título dado ao regente oficial de um Imperador adulto do Japão. Inicialmente uma posição de honra próxima ao [Glossary( 'Imperador', 'TENNO_GLOSS' )], a família Fujiwara gradualmente tomou o controle, até que o Kampaku se tornou o governante de fato, e os Imperadores meras figuras simbólicas."
 MINAMOTO_GLOSS:0 "#bold $dynn_Minamoto$#! — ou #EMP Genji#! — foi um [Glossary( 'Honsei', 'HONSEI_GLOSS' )] concedido a descendentes deserdados da família imperial [Glossary( 'Yamato', 'YAMATO_GLOSS' )]. A família $dynn_Minamoto$ mais importante descendia do imperador $Seiwa$.\n\nJunto com os [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )] e [Glossary( 'Kanmu Taira', 'TAIRA_GLOSS' )], os $Seiwa$ $dynn_Minamoto$ foram uma das casas mais poderosas do Japão medieval inicial.\n\nSeu [Glossary( 'Mon', 'MON_GLOSS' )] tradicional era composto por três #EMP Rindō#! — gencianas — flores brotando de cinco folhas de bambu."
 MON_GLOSS:0 "#bold Mon#! - #EMP brasão#! - eram os emblemas que passaram a ser associados e usados para identificar as casas aristocráticas do Japão e seus muitos ramos."
 RONIN_GLOSS:0 "#bold Rōnin#! — literalmente #EMP pessoa-onda#! — o termo surgiu no final do período Nara, referindo-se a um servo que havia fugido das terras de seu mestre. Posteriormente, passou a designar samurais sem mestre, seja por sua morte ou pela perda de prestígio ou status. Desempregados e com poucas habilidades além do combate, muitos rōnin recorriam ao crime para sobreviver.."
 SHOEN_GLOSS:0 "#bold Shōen#! eram as casas senhoriais dos clãs nobres japoneses, e as terras agrícolas anexas que eles gradualmente tomaram do controle central à medida que o sistema [ritsuryo|E] centralizado entrou em declínio."
 TACHIBANA_GLOSS:0 "#bold $dynn_Tachibana$#! foi um [Glossary( 'Honsei', 'HONSEI_GLOSS' )] concedido a descendentes deserdados da família imperial [Glossary( 'Yamato', 'YAMATO_GLOSS' )].\n\nA família $dynn_Tachibana$ mais importante descendia do imperador $Bidatsu$.\n\nSeu [Glossary( 'Mon', 'MON_GLOSS' )] tradicional era um #EMP Tachibana#! — flor da laranjeira."
 TAIRA_GLOSS:0 "#bold $dynn_Taira$#! — ou #EMP Heike#! — foi um [Glossary( 'Honsei', 'HONSEI_GLOSS' )] concedido a descendentes deserdados da família imperial [Glossary( 'Yamato', 'YAMATO_GLOSS' )]. A família $dynn_Taira$ mais importante descendia do imperador $Kanmu$.\n\nJunto com os #EMP [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )]#! e #EMP [Glossary( 'Seiwa Minamoto', 'MINAMOTO_GLOSS' )]#!, os $Kanmu$ $dynn_Taira$ foram uma das casas mais poderosas do Japão medieval inicial.\n\nSeu [Glossary( 'Mon', 'MON_GLOSS' )] tradicional era um #EMP Agehachō#! — borboleta de cauda de andorinha."
 TAKASHINA_GLOSS:0 "#bold $dynn_Takashina$#! foi um [Glossary( 'Honsei', 'HONSEI_GLOSS' )] concedido a descendentes deserdados da família imperial [Glossary( 'Yamato', 'YAMATO_GLOSS' )].\n\nA família $dynn_Takashina$ mais significativa descendia do imperador $Tenmu$."
 TENNO_GLOSS:0 "#bold Ten'nō#! é o título dado ao Imperador do Japão. Com o tempo, os regentes Fujiwara gradualmente tomaram o controle da família imperial, até que o [Glossary( 'Kampaku', 'KAMPAKU_GLOSS' )] se tornou o governante de fato, e os Imperadores meras figuras simbólicas."
 YAMATO_GLOSS:0 "#bold $dynn_Yamato$#! é a casa imperial do Japão, dita descendente da deusa do sol Amaterasu. Embora outrora poderosos imperadores, os influentes [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )] tomaram o controle dos verdadeiros órgãos do Estado, governando como regentes da dinastia imperial.\n\nMuitas das famílias mais influentes do Japão descendem diretamente dos imperadores Yamato, incluindo os [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] e [Glossary( 'Taira', 'TAIRA_GLOSS' )].\n\nSeu [Glossary( 'Mon', 'MON_GLOSS' )] tradicional era um #EMP Kikka#! — flor de crisântemo."
