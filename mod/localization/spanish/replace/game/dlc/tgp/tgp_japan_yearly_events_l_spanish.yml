 scheme.target.japan_1071.value_desc:0 "Vingança contra [target.GetFirstName]: $VALUE|+=0$"
 tgp_japan_yearly_events.0001.a:0 "É o gesto perfeito para alegrar [Select_CString( gift_receiver.IsFemale, 'minha querida', 'meu querido' )] [gift_receiver.GetFirstNameNoTooltip]."
 tgp_japan_yearly_events.0001.a_spouse_toast:0 "[gift_receiver.GetTitledFirstNameNoTooltip] $tgp_japan_yearly_events.0001.tt.gift_appreciation$"
 tgp_japan_yearly_events.0001.b.flavor:0 "...mas o presente perfeito para mim!"
 tgp_japan_yearly_events.0001.b:0 "Não, este é um presente longe de ser simples para [gift_receiver.GetSheHe]..."
 tgp_japan_yearly_events.0001.c:0 "Esses mercadores esfomeados são exaustivos."
 tgp_japan_yearly_events.0001.desc:0 "Embora eu seja próximo [Select_CString( gift_receiver.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', gift_receiver)], [gift_receiver.GetFirstName], não posso deixar de notar que [gift_receiver.GetSheHe] está sorrindo menos que o habitual. Eu odiaria pensar que é por minha causa!\n\nAo observar as delícias que o mercado oferece, me deparo com um vendedor que vende uma variedade de elegantes [Glossary( 'uchiwa', 'UCHIWA_GLOSS' )]. Ele insiste:\n\n\"Enrole isto em seu [Glossary( 'furoshiki', 'FUROSHIKI_GLOSS' )] e quem o receber saberá que você pretende espalhar alegria!\""
 tgp_japan_yearly_events.0001.friend_toast:0 "[gift_receiver.GetTitledFirstNameNoTooltip] $tgp_japan_yearly_events.0001.tt.gift_appreciation$"
 tgp_japan_yearly_events.0001.lover_toast:0 "[gift_receiver.GetTitledFirstNameNoTooltip] $tgp_japan_yearly_events.0001.tt.gift_appreciation$"
 tgp_japan_yearly_events.0001.t:0 "Espalhando Alegria"
 tgp_japan_yearly_events.0001.tt.gift_appreciation:0 "aprecia o presente"
 tgp_japan_yearly_events.0006.a:0 "Esta captura deve ser compartilhada com os locais."
 tgp_japan_yearly_events.0006.b:0 "Eu poderia poupar você de uma ida ao mercado."
 tgp_japan_yearly_events.0006.c:0 "O templo seria honrado pelo que [ROOT.Char.GetFaith.WaterGodName] provê."
 tgp_japan_yearly_events.0006.d:0 "Você é um testemunho da sua habilidade, devo me retirar."
 tgp_japan_yearly_events.0006.desc:0 "Enquanto caminho pela costa em [pearl_diver.GetCurrentLocation.GetBaronyNameExplicitly], tropeço em um grupo de mergulhadoras [Glossary( 'Ama', 'AMA_DIVERS_GLOSS' )] examinando sua captura.\n\nA líder se cobre e se aproxima, \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], contemple o tesouro que o mar nos entrega!\"\n\nA abundância de pérolas e abalones suculentos é realmente impressionante."
 tgp_japan_yearly_events.0006.t:0 "Tesouros do Mar"
 tgp_japan_yearly_events.0006.tt.failure:0 "[pearl_diver.GetTitledFirstNameNoTooltip] não está convencid[Select_CString( pearl_diver.IsFemale, 'a', 'o' )]"
 tgp_japan_yearly_events.0006.tt.success:0 "Negócio estabelecido com sucesso"
 tgp_japan_yearly_events.0012.a.monkey.martial.tt.failure:0 "O macaco ignora minha tentativa patética de assustá-lo"
 tgp_japan_yearly_events.0012.a.monkey.martial.tt.success:0 "O macaco foge assustado"
 tgp_japan_yearly_events.0012.a:0 "#EMP Agite os braços, gritando."
 tgp_japan_yearly_events.0012.b.monkey.intrigue.tt.failure:0 "O macaco me investe, ameaçando-me para que recue"
 tgp_japan_yearly_events.0012.b.monkey.intrigue.tt.success:0 "O macaco parece intrigado, mas me deixa em paz"
 tgp_japan_yearly_events.0012.b:0 "Finjo que não sou ameaça."
 tgp_japan_yearly_events.0012.c:0 "Não mexa com o macaco."
 tgp_japan_yearly_events.0012.desc:0 "Subindo pelas [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], uma névoa quente desce sobre mim.\n\nQue sorte! Avisto um [Glossary( 'onsen', 'ONSEN_GLOSS' )] fumegante, mas não pareço ser o primeiro visitante do dia.\n\nUm travesso macaco-da-neve já entrou no banho! Embora meus músculos estejam cansados e minhas axilas comecem a feder, questiono se é seguro tomar banho com um animal selvagem."
 tgp_japan_yearly_events.0012.t:0 "Travessuras de Macaco"
 tgp_japan_yearly_events.0013.a:0 "Participo do ritual."
 tgp_japan_yearly_events.0013.b.mystic.learning.tt.failure:0 "Não faço ideia do que está sendo dito"
 tgp_japan_yearly_events.0013.b.mystic.learning.tt.success:0 "Compreendo o significado da sabedoria"
 tgp_japan_yearly_events.0013.b:0 "Peço orientação ao místico."
 tgp_japan_yearly_events.0013.c:0 "Deixe [mystic.GetSheHe] em paz."
 tgp_japan_yearly_events.0013.desc:0 "Um canto suave me chama pelo caminho da montanha. Aproximando-me da sua origem, sou recebido por um denso manto de névoa quente, envolvendo a silhueta de [Select_CString( mystic.IsFemale, 'uma', 'um' )] [mystic.GetWomanMan].\n\n[mystic.GetSheHe] apenas olha na minha direção e faz um gesto para que eu me junte a [mystic.GetSheHe] no [Glossary( 'onsen', 'ONSEN_GLOSS' )]. Ao que parece, um ritual está prestes a ser realizado."
 tgp_japan_yearly_events.0013.t:0 "Purificando o Espírito"
 tgp_japan_yearly_events.0014.a:0 "Quem pode resistir a uma fonte termal?!"
 tgp_japan_yearly_events.0014.b:0 "Ficar mais um pouco."
 tgp_japan_yearly_events.0014.c:0 "Não há tempo a perder."
 tgp_japan_yearly_events.0014.desc:0 "Minha respiração está pesada enquanto inalo o ar fino e gelado da montanha. Olhando para cima no caminho em direção ao cume, sou recebido por uma visão de névoa ondulante e neve derretida nas árvores próximas.\n\nChegando à sua origem, finalmente posso respirar e admirar o convidativo [Glossary( 'onsen', 'ONSEN_GLOSS' )] à minha frente."
 tgp_japan_yearly_events.0014.t:0 "Um Alívio Bem-vindo"
 tgp_japan_yearly_events.0021.a:0 "Ofereço um pouco de saquê."
 tgp_japan_yearly_events.0021.a_char_modifier.tt:0 "Sinto como se um peso tivesse sido tirado de meus ombros"
 tgp_japan_yearly_events.0021.a_county_modifier.tt:0 "Os cidadãos viram minhas ações"
 tgp_japan_yearly_events.0021.a_nothing_happens.tt:0 "Minhas ações caem em ouvidos surdos"
 tgp_japan_yearly_events.0021.a_pleased_deities.tt:0 "Os deuses #EMP parecem#! ter notado minhas ações"
 tgp_japan_yearly_events.0021.b:0 "Dedico um tempo para admirar as árvores."
 tgp_japan_yearly_events.0021.desc:0 "[Glossary( 'Hanami', 'HANAMI_GLOSS' )] está sobre nós! Cerejeiras, carregadas de flores sumptuosas, elevam o espírito de todos. O povo de [ROOT.Char.GetCurrentLocation.GetName] sabe quando plantar seu arroz e ora por uma colheita farta que virá.\n\n[Select_CString( hanami_enjoyer.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', hanami_enjoyer)], [hanami_enjoyer.GetTitledFirstName] declara: \"A vida é como a beleza efêmera de uma flor.\" As palavras [hanami_enjoyer.GetHerHim] me lembram que uma oferenda é necessária."
 tgp_japan_yearly_events.0021.t:0 "Entre as Flores"
 tgp_japan_yearly_events.0026.a.tt:0 "Da próxima vez que eu viajar pelas montanhas ou florestas, ficarei atento a esse ser misterioso."
 tgp_japan_yearly_events.0026.a:0 "Pergunto-me se é verdade."
 tgp_japan_yearly_events.0026.b:0 "Apenas o tagarelar de bêbados..."
 tgp_japan_yearly_events.0026.desc:0 "A voz familiar [Select_CString( rumormonger.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', rumormonger)] [rumormonger.GetTitledFirstName] ecoa de uma taverna, seguida das risadas embriagadas de saquê [Select_CString( gossiper.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', gossiper)] [gossiper.GetTitledFirstName].\n\n\"Por todas as nossas indomáveis terras selvagens, espreita o [Glossary( 'Tengu', 'TENGU_GLOSS' )]! Um monstro coberto de penas, cujo temperamento é tão feroz quanto sua habilidade com a espada. Este espírito maligno condena tudo que é sagrado!\n\nTomando outro gole do saquê [rumormonger.GetHerHim], \"Embora deva ser dito, quem puder se provar digno aos olhos da fera será recompensado com maestria na astúcia marcial. Mas, ao olhar este mar de covardes, tenho certeza de que é uma causa perdida!\""
 tgp_japan_yearly_events.0026.t:0 "Histórias do Tengu"
 tgp_japan_yearly_events.0027.a.tt.failure:0 "Perco a batalha, mas não ileso"
 tgp_japan_yearly_events.0027.a.tt.success:0 "Sobrevivi para lutar outro dia"
 tgp_japan_yearly_events.0027.a.tt.success_explanation:0 "Você pode ganhar #P traits positivos adicionais#!"
 tgp_japan_yearly_events.0027.a:0 "Devo lutar."
 tgp_japan_yearly_events.0027.b.tt.failure:0 "[tengu_warrior.GetSheHe] não se importa com o que eu tenho a dizer"
 tgp_japan_yearly_events.0027.b.tt.success:0 "[tengu_warrior.GetSheHe] parece ter sido persuadido pelas minhas palavras"
 tgp_japan_yearly_events.0027.b:0 "'Escute o que tenho a dizer!'"
 tgp_japan_yearly_events.0027.c:0 "Fujo enquanto ainda posso."
 tgp_japan_yearly_events.0027.desc:0 "Enquanto caminho pelas terras selvagens de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], não consigo esquecer as histórias que ouvi sobre o [Glossary( 'Tengu', 'TENGU_GLOSS' )].\n\nSem nenhuma alma à vista, tudo o que escuto é meu coração martelando. Enquanto tento controlar minha respiração ofegante, um temor rastejante percorre minha espinha... estou sendo observado.\n\nMeus olhos disparam na direção do som de passos. Procurando desesperadamente ao redor, eu vejo o reflexo de uma lâmina cintilar através da névoa densa."
 tgp_japan_yearly_events.0027.t:0 "Prove seu Valor"
 tgp_japan_yearly_events.0028.a:0 "Não serei enganado novamente."
 tgp_japan_yearly_events.0028.b:0 "Soltar um grito."
 tgp_japan_yearly_events.0028.desc:0 "Encontrando-me em [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], não consigo deixar de manter meus olhos atentos a um [Glossary( 'Tengu', 'TENGU_GLOSS' )].\n\nEm todos os meus dias, nunca houve uma caminhada mais monótona pelos [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')]. Eu deveria saber melhor do que confiar nas histórias exageradas de um bêbado."
 tgp_japan_yearly_events.0028.t:0 "Desviado do Caminho"
 tgp_japan_yearly_events.0029.a:0 "Não basta derrubar homens, devo guiá-los."
 tgp_japan_yearly_events.0029.b:0 "Esperarei para ver aonde seu treinamento me leva."
 tgp_japan_yearly_events.0029.desc:0 "Embora [tengu_warrior.GetTitledFirstName] possa não ser um [Glossary( 'Tengu', 'TENGU_GLOSS' )], [tengu_warrior.GetSheHe] é um mestre da lâmina!\n\nIncontáveis horas de treino diligente sob o olhar atento [tengu_warrior.GetHerHim] finalmente deram frutos.\n\nMinha espada não mais se sente como um machado de lenhador para cortar os membros dos homens, mas como uma bela extensão do meu corpo, pronta para alcançar e tocar aqueles que me prejudicariam.\n\nMeu mestre me lembra: \"Isto é apenas o começo, você ainda tem muito a dominar.\""
 tgp_japan_yearly_events.0029.t:0 "Técnica Tengu"
 tgp_japan_yearly_events.0036.a.random_chance:0 "Quanto maior sua [stewardship|E], melhores as chances:"
 tgp_japan_yearly_events.0036.a:0 "Mais flores de lótus e talvez..."
 tgp_japan_yearly_events.0036.b.flavor:0 "Muita da política da corte pode ser resolvida quando um homem está focado em um peixe."
 tgp_japan_yearly_events.0036.b:0 "Mais peixes!"
 tgp_japan_yearly_events.0036.desc:0 "[Select_CString( gardener.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', gardener)] [gardener.GetTitledFirstName] está dando os últimos retoques na extensão do lago no meu jardim.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], seu jardim é um reflexo perfeito do paraíso de [ROOT.Char.GetFaith.GetName]! Há algum toque final que eu possa adicionar?\""
 tgp_japan_yearly_events.0036.t:0 "Reflexo do Paraíso Puro"
 tgp_japan_yearly_events.1000.a.tt.failure:0 "Ao perseguir o Onibi, você escorregou no terreno molhado, se machucando"
 tgp_japan_yearly_events.1000.a.tt.success:0 "Ao perseguir o Onibi, você encontrou um tesouro escondido"
 tgp_japan_yearly_events.1000.a:0 "Ao diabo com o perigo, vamos ver o que são essas luzes!"
 tgp_japan_yearly_events.1000.b.tt.failure:0 "As inconsistências na explicação de [chaplain.GetFirstNameNoTooltip] fazem sua cabeça doer"
 tgp_japan_yearly_events.1000.b.tt.success:0 "[chaplain.GetFirstNameNoTooltip] fornece informações sobre Onibi que ajudam a entender outras leituras que você fez"
 tgp_japan_yearly_events.1000.b:0 "Vamos nos abrigar da chuva, você pode me contar mais"
 tgp_japan_yearly_events.1000.c:0 "Sim, melhor não demorar."
 tgp_japan_yearly_events.1000.desc:0 "Uma chuva leve nos acompanha enquanto atravessamos os [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip].\n\nÀ medida que a garoa se intensifica, noto luzes dançantes, cintilando à distância.\n\nMeu [ROOT.Char.Custom2('RelationToMe', chaplain)], [chaplain.GetFirstNameNoTooltip] aconselha cautela, sugerindo que poderiam ser [Glossary( 'Onibi', 'ONIBI_GLOSS' )] tentando nos atrair para o perigo."
 tgp_japan_yearly_events.1000.t:0 "Chamas Dançantes"
 tgp_japan_yearly_events.1010.a:0 "Apoiaria os monges [buddhist_councillor_1.GetFaith.GetAdjectiveNoTooltip]."
 tgp_japan_yearly_events.1010.a_discount:0 "Você ganha #p 50%#! de desconto ao converter-se para [buddhist_councillor_1.GetFaith.GetName]"
 tgp_japan_yearly_events.1010.b:0 "Os [buddhist_councillor_2.GetFaith.GetAdherentNamePluralNoTooltip] estão certos."
 tgp_japan_yearly_events.1010.b_discount:0 "Você ganha #p 50%#! de desconto ao converter-se para [buddhist_councillor_2.GetFaith.GetName]"
 tgp_japan_yearly_events.1010.c.tt:0 "O conflito causa instabilidade em todo o reino"
 tgp_japan_yearly_events.1010.c:0 "Por que eu deveria me importar com a forma como [ROOT.Char.GetFaith.HighGodName] é venerado?"
 tgp_japan_yearly_events.1010.desc:0 "\"A tensão entre os [buddhist_councillor_1.Custom('DescriptorPositiveStandalone')] [buddhist_councillor_1.GetFaith.GetAdherentNamePlural] e os [buddhist_councillor_2.Custom('DescriptorNegativeStandalone')] [buddhist_councillor_2.GetFaith.GetAdherentNamePlural] aumenta a cada dia, [ROOT.Char.Custom('FormOfAddressForLiege')]!\"\n\nM[Select_CString( buddhist_councillor_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', buddhist_councillor_1)], [buddhist_councillor_1.GetFirstName], exclama.\n\n\"Os monges [buddhist_councillor_2.Custom('DescriptorNegativeStandalone')] [buddhist_councillor_2.GetFaith.GetAdherentNameNoTooltip] estão orando por nossa queda. Por favor, pelo bem de [ROOT.Char.GetFaith.HighGodName], deixe claro que você apoia os [buddhist_councillor_1.Custom('DescriptorPositiveStandalone')] [buddhist_councillor_1.GetFaith.GetAdherentNamePluralNoTooltip] e será óbvio que devemos ser favorecidos!\""
 tgp_japan_yearly_events.1010.t:0 "Conflito Sectário"
 tgp_japan_yearly_events.1020.a_garden:0 "Este solo deve ser especial, continuar a cultivá-lo."
 tgp_japan_yearly_events.1020.a_shadow:0 "Somente meus inimigos devem temer minha sombra!"
 tgp_japan_yearly_events.1020.a_siren:0 "O amor que ela canta, devo possuí-lo!"
 tgp_japan_yearly_events.1020.b_garden:0 "Preciso construir sobre este jardim para selá-lo."
 tgp_japan_yearly_events.1020.b_shadow:0 "Preciso manter tochas acesas o tempo todo, nada deve escapar."
 tgp_japan_yearly_events.1020.b_siren:0 "Tal beleza deve ser compartilhada, espalhar sua história pelo reino."
 tgp_japan_yearly_events.1020.c:0 "Bah! É [ROOT.Char.GetFaith.TricksterGodName] pregando peças em mim."
 tgp_japan_yearly_events.1020.desc_drunk:0 "Bebo profundamente de uma generosa medida de [ROOT.Char.Custom('RegionalAlcoholicDrink')], mas isso oferece pouco consolo. Por mais lamentável que seja, cumprir meus deveres enquanto bêbado tornou-se algo natural."
 tgp_japan_yearly_events.1020.desc_dumb:0 "Mais uma vez falho em compreender as maquinações diárias da corte. Infelizmente, ninguém poderia me confundir com um estudioso ou mesmo com um burocrata capaz."
 tgp_japan_yearly_events.1020.desc_end:0 "\n\nSerá que é o estresse de ser um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip], ou poderia ser obra de um [Glossary('Yokai', 'YOKAI_GLOSS')]?"
 tgp_japan_yearly_events.1020.desc_garden:0 "Enquanto caminho pelo jardim, noto uma flor exótica.\n\nAo sentir seu aroma, uma brisa me envolve como um sussurro suave; ao olhar para o sol, ele me cega momentaneamente. Retorno meu olhar à flor apenas para ver uma cabeça grotesca franzindo o cenho. Piscar novamente, e o rosto desaparece."
 tgp_japan_yearly_events.1020.desc_shadow:0 "Minha sombra tem estado... estranha. Parece linger por um momento após eu começar a andar. Ao desviar o olhar, parece dançar com outras sombras, mas ao olhar novamente retorna ao meu lado.\n\nEmbora ainda não tenha me prejudicado, uma sombra que pode deixar seu mestre parece perigosa."
 tgp_japan_yearly_events.1020.desc_siren:0 "Uma melodia assombrosa me desperta do sono. Uma mulher, pálida e elegante, flutua acima de mim, cantando sobre um coração partido.\n\nAo tentar alcançá-la, sua imagem se dissipa. Ao voltar à consciência, a angústia dessa mulher em sonho e o amor que poderia ter existido me assombram."
 tgp_japan_yearly_events.1020.t_garden:0 "A Cabeça Florescida"
 tgp_japan_yearly_events.1020.t_shadow:0 "A Profundidade da Minha Sombra"
 tgp_japan_yearly_events.1020.t_siren:0 "A Melodia de um Oni"
 tgp_japan_yearly_events.1030.a:0 "Minha saúde, acima de tudo."
 tgp_japan_yearly_events.1030.b:0 "O futuro da Casa [ROOT.Char.GetDynasty.GetNameNoTooltip] deve ser assegurado."
 tgp_japan_yearly_events.1030.c:0 "A prosperidade de nossa família é de extrema importância."
 tgp_japan_yearly_events.1030.d:0 "Tudo o que preciso é do favor de [ROOT.Char.GetFaith.HighGodName]!"
 tgp_japan_yearly_events.1030.desc:0 "Sou atraído por um [ROOT.Char.GetFaith.HouseOfWorship] próximo pelo som suave das palmas dos adoradores enquanto imploram a [ROOT.Char.GetFaith.HighGodName] por boa sorte.\n\nFaz algum tempo desde que tive a oportunidade de oração e reflexão. Em que devo focar nos anos que virão?"
 tgp_japan_yearly_events.1030.e:0 "Não deixarei que a oração perturbe minha paz."
 tgp_japan_yearly_events.1030.t:0 "Reflexões para o Futuro"
 tgp_japan_yearly_events.1040.a:0 "Esta é uma ponte sagrada, atravessaremos com cuidado."
 tgp_japan_yearly_events.1040.b:0 "Como [ROOT.Char.GetTitleAsNameNoTooltip], ninguém atravessará antes de mim."
 tgp_japan_yearly_events.1040.c:0 "Não ouso caminhar sobre tal estrutura, e se ela ceder?"
 tgp_japan_yearly_events.1040.desc:0 "Ao tentar atravessar um canal, encontro uma bela ponte arqueada adornada em vermelho. Paro, maravilhado com a sutileza e elegância desta [Glossary('Soribashi', 'SORIBASHI_GLOSS')].\n\nÀs vezes, um ato tão simples quanto atravessar um riacho pode ser imbuído de intenção."
 tgp_japan_yearly_events.1040.discount:0 "Você ganha #p 50%#! de desconto ao converter-se para [GetReligionByKey('shintoism_religion').GetName]"
 tgp_japan_yearly_events.1040.t:0 "Uma Ponte da Lua"
 tgp_japan_yearly_events.1050.a:0 "Como [ROOT.Char.GetLiege.GetSheHe] deseja."
 tgp_japan_yearly_events.1050.b.tt:0 "Você tenta convencer [Select_CString( messenger.IsFemale, 'a', 'o' )] [messenger.GetFirstNameNoTooltip] de que esta obscura regra não é mais válida"
 tgp_japan_yearly_events.1050.b:0 "Essa regulamentação não está mais em vigor."
 tgp_japan_yearly_events.1050.c:0 "[ROOT.Char.GetLiege.GetSheHe|U] não terá seu devido!"
 tgp_japan_yearly_events.1050.desc.a:0 "#EMP Seu jardim contém flores amarelas em excesso.#!"
 tgp_japan_yearly_events.1050.desc.b:0 "#EMP As armas em seu quartel são afiadas com muito pouca frequência.#!"
 tgp_japan_yearly_events.1050.desc.c:0 "#EMP Você continua segurando seu [Glossary('Sensu', 'SENSU_GLOSS')] incorretamente.#!"
 tgp_japan_yearly_events.1050.desc.outro:0 "\n\nPor esta violação, você é obrigado a fazer uma doação considerável aos cofres [Select_CString( ROOT.Char.GetLiege.IsFemale, 'da sua', 'do seu' )] [ROOT.Char.Custom2('RelationToMeShort', ROOT.Char.GetLiege)], [ROOT.Char.GetLiege.GetTitledFirstName]."
 tgp_japan_yearly_events.1050.desc:0 "Lamento informar que você está violando uma regra imperativa:"
 tgp_japan_yearly_events.1050.opening:0 "[messenger.Custom2('AppropriateGreeting', ROOT.Char)]"
 tgp_japan_yearly_events.1050.tt.failure:0 "[messenger.GetSheHe|U] ordena que você pague"
 tgp_japan_yearly_events.1050.tt.success:0 "A multa é cancelada"
 tgp_japan_yearly_events.1060.a:0 "Muito bem, concederei seu desejo."
 tgp_japan_yearly_events.1060.b:0 "Talvez eu possa melhorar as condições de confinamento para você."
 tgp_japan_yearly_events.1060.c:0 "Seu sofrimento não terá alívio!"
 tgp_japan_yearly_events.1060.d:0 "Não, suas condições não mudarão."
 tgp_japan_yearly_events.1060.desc:0 "Desalinhado e insatisfeito, [Select_CString( prisoner.IsFemale, 'a', 'o' )] [prisoner.Custom2('InsultAdjective', ROOT.Char)] [prisoner.GetFirstName] incomoda os guardas em busca de atenção, pedindo que escutem sua súplica. Curioso, encontro [prisoner.GetSheHe] em sua [prisoner.Custom('PrisonTypeCell')], aguardando para ouvir o que [prisoner.GetSheHe] está tão desesperado para dizer.\n\n[prisoner.GetSheHe|U] me encara e chora,"
 tgp_japan_yearly_events.1060.desc_generic:0 "\"Não desejo mais viver nos limites desta cela."
 tgp_japan_yearly_events.1060.desc_injured:0 "\"Minha saúde está falhando, e as feridas que coço não cicatrizam mais. A dor se intensifica sem fim à vista."
 tgp_japan_yearly_events.1060.desc_long:0 "\"Fui mantido aqui por tempo demais e cheguei à conclusão de que não desejo retornar."
 tgp_japan_yearly_events.1060.desc_old:0 "\"Meus ossos estão frágeis e rígidos, meu tempo neste mundo já foi suficiente."
 tgp_japan_yearly_events.1060.desc_outro:0 "Se você tem misericórdia em seu coração, termine minha vida rapidamente!"
 tgp_japan_yearly_events.1060.desc_young:0 "\"Não vi muito em minha vida, mas não posso me sentir realizado com as memórias desta prisão."
 tgp_japan_yearly_events.1060.t:0 "Pela Misericórdia ou Justiça"
 tgp_japan_yearly_events.1070.a:0 "Vamos reconstruí-lo melhor do que antes."
 tgp_japan_yearly_events.1070.b:0 "Talvez [ROOT.Char.GetFaith.HighGodName] esteja abrindo espaço para algo novo."
 tgp_japan_yearly_events.1070.c:0 "Preciso investigar como este [ROOT.Char.Custom('GetFaithTemple')] foi incendiado..."
 tgp_japan_yearly_events.1070.c_tt:0 "Você inicia uma investigação sobre como o incêndio começou"
 tgp_japan_yearly_events.1070.desc:0 "\"Um prédio nos terrenos do [province.GetName] [ROOT.Char.Custom('GetFaithTemple')] foi consumido pelo fogo!\" chora m[Select_CString( messenger.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', messenger)|U] [messenger.GetName].\n\n\"Monks e estudiosos correm para encontrar um novo local para seus trabalhos\" continua [messenger.GetNameNoTooltip], \"Se você puder ajudar a restaurar o [ROOT.Char.Custom('GetFaithTemple')], certamente [ROOT.Char.GetFaith.HighGodName] o abençoará.\""
 tgp_japan_yearly_events.1070.t:0 "Cinzas Sagradas"
 tgp_japan_yearly_events.1071.a:0 "Isso não acontecerá novamente!"
 tgp_japan_yearly_events.1071.b:0 "Ah, bem, agora já passou..."
 tgp_japan_yearly_events.1071.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', messenger)|U] traz notícias do recente incêndio no [ROOT.Char.Custom('GetFaithTemple')], assegurando-me que seus esforços de investigação foram bem-sucedidos.\n\n"
 tgp_japan_yearly_events.1071.desc_heretics:0 "\"Os moradores locais sugeriram que um grupo de dissidentes foi responsável. Devemos enviar uma mensagem a esses hereges!\" insiste m[Select_CString( messenger.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', messenger)|U] [messenger.GetFirstName]."
 tgp_japan_yearly_events.1071.desc_rival:0 "\"[rival.GetName] parecia estar observando a cidade antes do incidente, buscando causar caos sob seu governo. [rival.GetSheHe|U] não deve escapar impune!\" insiste m[Select_CString( messenger.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', messenger)|U] [messenger.GetFirstName]."
 tgp_japan_yearly_events.1071.desc_weather:0 "\"O incêndio foi resultado de um fenômeno natural. Com o ar tão seco e o sol escaldante, não é de se surpreender que um fogo tenha começado. Seria melhor reforçar nosso abrigo contra os elementos.\" comenta [messenger.GetFirstName]."
 tgp_japan_yearly_events.1071.desc_yokai:0 "\"Muitos na região relataram avistamentos de um estranho [Glossary( 'Yokai', 'YOKAI_GLOSS' )] dias antes do incêndio. Talvez ele seja o culpado por esta tragédia?\" exclama [Select_CString( messenger.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', messenger)] [messenger.GetFirstName]."
 tgp_japan_yearly_events.1080.a:0 "Magnanimamente, esquecerei essa falta de conduta."
 tgp_japan_yearly_events.1080.b.tt:0 "Você interroga [fisherman.GetNameNoTooltip] em busca de informações sobre a corte"
 tgp_japan_yearly_events.1080.b:0 "O que mais [fisherman.GetSheHe] viu no meu jardim?"
 tgp_japan_yearly_events.1080.c:0 "Não pode [fisherman.GetSheHe] fazer isso em outro lugar?!"
 tgp_japan_yearly_events.1080.desc:0 "O [Glossary( 'Tsuridono', 'TSURIDONO_GLOSS' )] do meu jardim é um lugar para descansar e refletir, e a vista serena proporciona um encerramento perfeito para um passeio noturno. As águas que o cercam costumam estar calmas, interrompidas apenas por uma ou outra carpa abocanhando um inseto na superfície. No entanto, hoje a atmosfera tranquila é quebrada por violentos respingos!\n\nM[Select_CString( fisherman.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', fisherman)] [fisherman.GetName] está à beira d’água, com a vara de pesca lançada no outrora sereno lago. Será que [fisherman.GetSheHe] ousa procurar sua próxima refeição no meu lago?!"
 tgp_japan_yearly_events.1080.t:0 "Um Pescador Errante"
 tgp_japan_yearly_events.1080.tt.failure:0 "[fisherman.GetSheHe|U] não diz muita coisa"
 tgp_japan_yearly_events.1080.tt.success:0 "[fisherman.GetSheHe|U] fornece informações valiosas"
 tgp_japan_yearly_events.1080.tt_family:0 "Cada [courtier|E] que for membro da família:\n$BULLET$Ganha o modificador [GetModifier('tgp_scheme_wary_modifier').GetNameWithTooltip] por #V 3 anos#!"
 tgp_japan_yearly_events.1080.tt_secret:0 "[fisherman.GetSheHe|U] revela um [secret|E] aleatório de um dos seus [courtiers|E]"
 tgp_japan_yearly_events.1090.a:0 "Redobrarei meus esforços."
 tgp_japan_yearly_events.1090.a_tt:0 "Você ganha uma nova [concubine|E]"
 tgp_japan_yearly_events.1090.b:0 "Meu herdeiro será escolhido por mim!"
 tgp_japan_yearly_events.1090.b_tt:0 "Até a morte, você ganha acesso à [interaction|E] #V $adopt_interaction$#!"
 tgp_japan_yearly_events.1090.c:0 "Governarei pelo máximo de tempo possível."
 tgp_japan_yearly_events.1090.c_uncaring:0 "Por que eu me importaria com o que acontece quando eu me for?"
 tgp_japan_yearly_events.1090.desc:0 "Meus [ROOT.Char.GetAge] anos passaram como a vida de uma efêmera. Meus cabelos embranquecem e meus ossos rangem. Bebês que vi ao seio de suas mães agora cresceram e encontraram seu propósito. Antes que meu fim me alcance, talvez eu possa atender ao apelo de [informer.GetNamePossessiveNoTooltip]."
 tgp_japan_yearly_events.1090.desc_intro:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')], você não estará aqui para governar para sempre,\" grita [informer.GetTitledFirstName]. \"Seria uma pena ver seu legado esquecido! Alguém deve assumir [target_title.GetName] em seu lugar.\"\n\n"
 tgp_japan_yearly_events.1090.desc_intro_dead:0 "Sobrevivi a todos os meus filhos, e todos os meus descendentes repousam sob a terra."
 tgp_japan_yearly_events.1090.desc_intro_none:0 "Apesar da minha longa vida, falhei em trazer qualquer filho a este mundo."
 tgp_japan_yearly_events.1090.t:0 "Uma Herança Estéril"
 tgp_japan_yearly_events.1100.a:0 "Este é um sinal, devo expiar!"
 tgp_japan_yearly_events.1100.a_tt:0 "Você revela todos os seus [secrets|E] de Assassinato"
 tgp_japan_yearly_events.1100.b:0 "Meus erros permanecerão enterrados dentro de mim."
 tgp_japan_yearly_events.1100.b_tt:0 "#warning Não é possível iniciar um [scheme|E] de Assassinato por #V 5#! anos #!"
 tgp_japan_yearly_events.1100.desc:0 "Tenho me sentido cada vez mais atormentado após a morte de [victim.GetName], e nenhum tratamento me traz alívio. Em todos os espelhos vejo seu rosto, pairando como um espectro atrás de mim. Seus últimos momentos se repetem na minha mente, o ato horrendo se tornando cada vez mais repugnante a cada repetição."
 tgp_japan_yearly_events.1100.desc_2:0 "\n\nAlém disso, a voz de [victim_2.GetNamePossessive] sussurra para mim à noite, despertando-me do sono mais profundo. [victim_2.GetSheHe|U] pode estar em paz, algo que eu não consigo ultimamente."
 tgp_japan_yearly_events.1100.desc_3:0 "A menção do nome [victim_3.GetName] provoca um choque na minha espinha, me atormentando como os outros que caíram por minhas ordens."
 tgp_japan_yearly_events.1100.desc_outro:0 "\n\nEstou numa prisão de minha própria criação. Roubar vidas me roubou também toda paz."
 tgp_japan_yearly_events.1100.t:0 "Uma Febre Carregada de Culpa"
 tgp_japan_yearly_events.1110.a:0 "[ROOT.Char.GetFaith.FateGodSheHe|U] deseja minha reflexão."
 tgp_japan_yearly_events.1110.b.tt:0 "O cervo te conduz a um tesouro"
 tgp_japan_yearly_events.1110.b:0 "Um sinal de boa sorte está por vir!"
 tgp_japan_yearly_events.1110.c.tt:0 "Você tenta atacar o cervo onde ele está"
 tgp_japan_yearly_events.1110.c:0 "Ficaria maravilhoso em meus salões."
 tgp_japan_yearly_events.1110.desc:0 "O Santuário de [ROOT.Char.GetFaith.FateGodName|U] recebe muitos visitantes de todos os segmentos da vida. Hoje não é exceção, com um magnífico cervo apreciando a paz.\n\nNo entanto, este animal demonstra interesse por mim, encarando-me sem piscar. Alguns dizem que os animais agem como médiuns, e talvez este cervo seja simplesmente [ROOT.Char.GetFaith.FateGodName|U] trazendo-me uma mensagem."
 tgp_japan_yearly_events.1110.t:0 "O Cervo de [ROOT.Char.GetFaith.FateGodNamePossessive|U]"
 tgp_japan_yearly_events.1110.tt.failure:0 "O cervo foge rapidamente"
 tgp_japan_yearly_events.1110.tt.success:0 "O cervo cai diante da sua força"
 tgp_japan_yearly_events.1120.a:0 "Aceito seu desafio!"
 tgp_japan_yearly_events.1120.a_warrior:0 "Superar você será um prazer. Prepare-se!"
 tgp_japan_yearly_events.1120.b.tt:0 "Você tenta convencer o monge a seguir você sem a necessidade de combate físico"
 tgp_japan_yearly_events.1120.b:0 "A corte é meu campo de batalha. Minha astúcia, minha lâmina."
 tgp_japan_yearly_events.1120.c:0 "Guardas, tirem [warrior_monk.GetSheHe] do meu caminho!"
 tgp_japan_yearly_events.1120.c_tt:0 "Seus guardas lutam contra o monge, permitindo que seu grupo passe sem atraso."
 tgp_japan_yearly_events.1120.d:0 "Vamos pelo caminho cênico."
 tgp_japan_yearly_events.1120.desc:0 "\n\n'Apenas verdadeiros guerreiros podem trilhar este caminho. Passei eras dedicando-me aos ensinamentos de [warrior_monk.GetFaith.WarGodName|U], e ainda não encontrei um desafiador digno de minha lâmina.'\n\nPercebendo meu status como [ROOT.Char.GetTitleAsName], [warrior_monk.GetSheHe] estreita os olhos e sorri: 'Supere-me em combate, e eu seguirei você até que minha cabeça se separe do corpo ou os vermes me limpem por completo.'"
 tgp_japan_yearly_events.1120.desc_intro:0 "Uma figura solitária, com [warrior_monk.Custom('GetRegionalSword')] empunhada, bloqueia nosso progresso."
 tgp_japan_yearly_events.1120.desc_intro_river:0 "Ao nos aproximarmos de uma ponte, uma figura solitária com [warrior_monk.Custom('GetRegionalSword')] empunhada bloqueia nosso caminho."
 tgp_japan_yearly_events.1120.t:0 "O Desafio Final"
 tgp_japan_yearly_events.1120.tt.failure:0 "Você falha em convencer o monge"
 tgp_japan_yearly_events.1120.tt.success:0 "O monge guerreiro se junta às suas fileiras"
 tgp_japan_yearly_events.1130.a.tt:0 "Você a incentiva a se tornar poeta"
 tgp_japan_yearly_events.1130.a:0 "'Suas palavras são maravilhosas, [poet_daughter.GetFirstNameNoTooltip].'"
 tgp_japan_yearly_events.1130.b:0 "Isso é um absurdo! Comporte-se como [Select_CString( poet_daughter.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMeShort', poet_daughter)] de um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip]!"
 tgp_japan_yearly_events.1130.desc:0 "Todas as noites, m[Select_CString( poet_daughter.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', poet_daughter)], [poet_daughter.GetName], passa a contemplar a lua. Manchas de tinta mancham suas delicadas mãos, embora eu não ouça nada sobre [poet_daughter.GetSheHe] escrevendo cartas. Essas excentricidades poderiam ser toleradas, mas agora [poet_daughter.GetSheHe] começou a negligenciar sua saúde, o que pode refletir mal sobre mim.\n\nSeguindo [poet_daughter.GetSheHe] até seus aposentos, espreito através de um [Glossary( 'biombo shoji', 'SHOJI_GLOSS' )], e vejo a causa do comportamento estranho [poet_daughter.GetHerHim].\n\n'[poet_daughter.Custom2('RelationToMeShort', ROOT.Char)|U]! Parece que não posso esconder meu trabalho de você.' Ela diz, entregando-me um [ROOT.Char.Custom('GetWritingMaterial')] cheio de versos."
 tgp_japan_yearly_events.1130.nice_try:0 "Ela avança em sua escrita"
 tgp_japan_yearly_events.1130.poet:0 "Ela se torna uma poeta"
 tgp_japan_yearly_events.1130.poet_critical:0 "Ela se torna uma poeta saudável"
 tgp_japan_yearly_events.1130.t:0 "Versos d[Select_CString( poet_daughter.IsFemale, 'a', 'o' )] [poet_daughter.GetFirstNameNoTooltip]"
 tgp_japan_yearly_events.1140.a:0 "Deixe [toll_warrior.GetSheHe] cobrar seu pedágio, mas lembrarei disso."
 tgp_japan_yearly_events.1140.b.tt:0 "Você tenta apelar para o respeito de [toll_warrior.GetNamePossessiveNoTooltip] ao seu status"
 tgp_japan_yearly_events.1140.b:0 "Você sabe quem eu sou?!"
 tgp_japan_yearly_events.1140.c:0 "Não pagarei uma única moeda para s[Select_CString( local_ruler.IsFemale, 'ua', 'eu' )] '[local_ruler.GetTitleAsNameNoTooltip]'!"
 tgp_japan_yearly_events.1140.desc:0 "Ao atravessar as terras de [local_county.GetNameNoTier], nosso progresso é interrompido por um grupo de homens armados.\n\n'Em nome de [local_ruler.GetName], devo cobrar uma pequena taxa.' diz [toll_warrior.GetSheHe]. Percebendo minha confusão, [toll_warrior.GetSheHe] acrescenta: 'Estas não são mais estradas Imperiais. Aqui apenas a vontade [Select_CString( local_ruler.IsFemale, 'da', 'do' )] [local_ruler.GetTitleAsName] é cumprida.'"
 tgp_japan_yearly_events.1140.t:0 "Parados na Estrada do Clã"
 tgp_japan_yearly_events.1140.tt.failure:0 "Você é forçado a procurar outra rota"
 tgp_japan_yearly_events.1140.tt.success:0 "Você convence os guerreiros"
 tgp_japan_yearly_events.1150.a:0 "Uma modesta homenagem é adequada."
 tgp_japan_yearly_events.1150.b.flavor:0 "Compartilhar arroz e bebida certamente colocará sua casa em boa reputação."
 tgp_japan_yearly_events.1150.b:0 "Estender a hospitalidade da casa de [local_ruler.GetHouse.GetNameNoTooltip] [Select_CString( emperor.IsFemale, 'a', 'ao' )] [emperor.GetTitleAsNameNoTooltip]."
 tgp_japan_yearly_events.1150.c:0 "Presentearei [emperor.GetSheHe] com um verso!"
 tgp_japan_yearly_events.1150.c_tt:0 "Você escreve um poema para aumentar a opinião [emperor.GetHerHim] sobre você, dependendo da sua [learning_i][learning_skill|E]."
 tgp_japan_yearly_events.1150.d.flavor:0 "Você envia guerreiros para libertar ouro"
 tgp_japan_yearly_events.1150.d:0 "[Select_CString( emperor.IsFemale, 'A', 'O' )] [emperor.GetTitleAsNameNoTooltip] deveria compartilhar sua riqueza..."
 tgp_japan_yearly_events.1150.desc:0 "Meus cortesãos me informam que [Select_CString( emperor.IsFemale, 'a', 'o' )] [emperor.GetTitleAsNameNoTooltip], [emperor.GetFirstName], está viajando por minhas terras.\n\n'[Select_CString( emperor.IsFemale, 'A', 'O' )] [emperor.GetTitleAsNameNoTooltip] em [emperor_location.GetNameNoTooltip]? Que sorte! É raro ter acesso tão próximo [Select_CString( emperor.IsFemale, 'a própria', 'ao próprio' )] [emperor.Custom('FormOfAddressForLiege')].'\n\nEsta é uma oportunidade ideal para enviar uma mensagem a [emperor.GetSheHe]..."
 tgp_japan_yearly_events.1150.f.flavor:0 "Depor a aranha levará tempo, primeiro você deve revelar seus modos desprezíveis a todos"
 tgp_japan_yearly_events.1150.f.tt:0 "$tgp_japan_yearly_events.1200.b.tt$"
 tgp_japan_yearly_events.1150.f:0 "A proximidade [emperor.GetHerHim] me lembra o quanto detesto [emperor.GetSheHe]!"
 tgp_japan_yearly_events.1150.t:0 "Avistamento do Soberano"
 tgp_japan_yearly_events.1151.a:0 "Você me honra, [local_ruler.GetNameNoTooltip]!"
 tgp_japan_yearly_events.1151.b:0 "Tentativa admirável, suponho..."
 tgp_japan_yearly_events.1151.c:0 "Não serei intimidado!"
 tgp_japan_yearly_events.1151.c_bandits:0 "Guarda, afaste-os!"
 tgp_japan_yearly_events.1151.d:0 "Suponho que teremos que contornar, então."
 tgp_japan_yearly_events.1151.d_bandits:0 "Deixe que fiquem com um pouco de ouro. Não vale a luta."
 tgp_japan_yearly_events.1151.desc:0 "Ao cruzarmos para [emperor_location.GetName], somos abordados por um cortesão [Select_CString( local_ruler.IsFemale, 'da sua', 'do seu' )] [local_ruler.GetTitleAsNameNoTooltip], [local_ruler.GetFirstName]."
 tgp_japan_yearly_events.1151.desc_bandits:0 "'[local_ruler.GetTitledFirstNameNoTooltip] exige tributo pela passagem por suas terras. Não deveria haver necessidade de recorrer à violência.'\n\nO tom de [messenger.GetNamePossessive] é razoável, embora o grupo de guerreiros armados que o acompanha sugira o contrário."
 tgp_japan_yearly_events.1151.desc_gift:0 "'Um presente, cortesia de [local_ruler.GetNameNoTooltip].' diz [messenger.GetName], entregando um saco de ouro. 'Desejamos o melhor em sua viagem, [emperor.GetTitleAsNameNoTooltip].'"
 tgp_japan_yearly_events.1151.desc_hospitality:0 "'[local_ruler.GetTitledFirstNameNoTooltip] lhe dá as boas-vindas ao [local_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip].' diz [messenger.GetName], curvando-se graciosamente. 'Seria uma honra [local_ruler.GetHerHim] caso você pare e desfrute de nossa hospitalidade.'"
 tgp_japan_yearly_events.1151.desc_poem:0 "'Alguns versos de [local_ruler.GetNameNoTooltip].' diz [messenger.GetName], entregando-me um [emperor.Custom('GetWritingMaterial')] dourado repleto de caracteres. 'Espero que você aprecie o trabalho [local_ruler.GetHerHim].'"
 tgp_japan_yearly_events.1151.t:0 "Mensagem [Select_CString( local_ruler.IsFemale, 'da', 'do' )] [local_ruler.GetTitleAsNameNoTooltip]"
 tgp_japan_yearly_events.1151.tt_good.failure:0 "Seu gesto não impressiona o governante"
 tgp_japan_yearly_events.1151.tt_good.success:0 "O governante aprecia seu gesto"
 tgp_japan_yearly_events.1160.a:0 "...Mas [new_concubine.GetSheHe] é uma oferta demasiado tentadora para não explorar."
 tgp_japan_yearly_events.1160.b:0 "Isto é uma piada? Envie [new_concubine.GetSheHe] de volta."
 tgp_japan_yearly_events.1160.c:0 "Como posso confiar neles? Matem [new_concubine.GetSheHe]!"
 tgp_japan_yearly_events.1160.d:0 "[new_concubine.GetSheHe|U] fará uma ótima refeição."
 tgp_japan_yearly_events.1160.desc:0 "A amarga inimizade entre minha grande casa de [ROOT.Char.GetHouse.GetName] e a inútil [feuding_house.GetName] é conhecida por todos. Até hoje, os suínos não fizeram nenhum gesto de paz!\n\nFico ainda mais curioso, então, quando [Select_CString( new_concubine.IsFemale, 'uma bela', 'um belo' )] [new_concubine.GetWomanMan] jovem, [new_concubine.GetName], é apresentada por eles como uma oferta. Embora eu esteja encantado com quão [new_concubine.Custom('ComplimentAdjective')] [new_concubine.GetSheHe] é, não posso deixar de pensar que isto é outro truque da [feuding_house.GetNameNoTooltip]..."
 tgp_japan_yearly_events.1160.t:0 "Uma Oferta de [feuding_house.GetNameNoTooltip]"
 tgp_japan_yearly_events.1170.a:0 "Talvez seja hora de aprender nossa língua irmã."
 tgp_japan_yearly_events.1170.b:0 "Bah! Diga [Select_CString( foreign_ruler.IsFemale, 'a', 'ao' )] [foreign_ruler.GetFirstNameNoTooltip] que seus poetas são um desastre!"
 tgp_japan_yearly_events.1170.c.flavor:0 "Essa breve distração fortalece sua imaginação"
 tgp_japan_yearly_events.1170.c:0 "A falta de clareza é bela!"
 tgp_japan_yearly_events.1170.desc:0 "Embora eu não seja falante da língua [foreign_ruler.GetCulture.GetLanguage.GetName], a poesia de [foreign_ruler.GetPrimaryTitle.GetName] é bem conhecida por sua profundidade e nuance.\n\nÉ interessante identificar caracteres familiares, mas tenho dificuldade em discernir todas as alusões e sutilezas presentes."
 tgp_japan_yearly_events.1170.t:0 "Traços Cativantes"
 tgp_japan_yearly_events.1180.a:0 "Serei guiado por sua estabilidade."
 tgp_japan_yearly_events.1180.b:0 "[ROOT.Char.GetFaith.FertilityGodName] é honrado pela árvore, cuide bem dela."
 tgp_japan_yearly_events.1180.c:0 "Gostaria de assumir a tarefa de moldá-la."
 tgp_japan_yearly_events.1180.desc:0 "Uma nova adição ao meu jardim tem sido o assunto da corte. Embora não dê frutos e seja pequeno demais para oferecer sombra, esta árvore [Glossary('Bonsai', 'BONSAI_GLOSS')] é um testemunho de anos de paciência.\n\nMeu [GetCourtPositionType('court_gardener_court_position').GetName()], [gardener.GetFirstName], me observa estudando-a,\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')], uma árvore deixada à própria sorte é uma coisa bruta. Só quando moldada com cuidado amoroso sua forma e estilo adquirem a capacidade de inspirar. Isso desperta algo em você?\""
 tgp_japan_yearly_events.1180.t:0 "Moldando o Crescimento"
 tgp_japan_yearly_events.1190.a:0 "Devo enfrentar essa falha!"
 tgp_japan_yearly_events.1190.b:0 "Meu conselho deve decidir em meu lugar."
 tgp_japan_yearly_events.1190.c:0 "Uma decisão ruim é melhor que nenhuma..."
 tgp_japan_yearly_events.1190.c_tt:0 "Um [county|E] aleatório em seu reino perderá algum [control|E]"
 tgp_japan_yearly_events.1190.desc:0 "\n\nEu olho para uma pilha de [ROOT.Char.Custom('GetWritingMaterialPlural')] tendo esquecido por que são importantes. Relendo seu conteúdo não encontro clareza, mas as exigências do estado demandam que eu tome decisões, por mais mal informadas que sejam."
 tgp_japan_yearly_events.1190.desc_annoyed:0 "O tagarelar da corte e as reclamações dos lordes me irritam, e a última coisa em minha mente são as disputas de um cidadão comum."
 tgp_japan_yearly_events.1190.t:0 "Lutando Com Meus Deveres"
 tgp_japan_yearly_events.1200.a:0 "Arranquem-no do cavalo!"
 tgp_japan_yearly_events.1200.b.tt:0 "Seu [scheme|E] [GetScheme('slander').GetTypeName] recebe o modificador [GetModifier('bided_my_time').GetNameWithTooltip]"
 tgp_japan_yearly_events.1200.b:0 "Deixe-o pensar que pode se safar com isso."
 tgp_japan_yearly_events.1200.c.tt:0 "Seu [scheme|E] [GetScheme('befriend').GetTypeName] recebe o modificador [GetModifier('settled_differences_modifier').GetNameWithTooltip]"
 tgp_japan_yearly_events.1200.c:0 "A maior vitória é a amizade."
 tgp_japan_yearly_events.1200.desc:0 "Foi uma longa manhã de reuniões em [kampaku.GetCurrentLocation.GetBaronyNameExplicitly], o trabalho de um[Select_CString( kampaku.IsFemale, 'a', '' )] [kampaku.GetTitleAsName] nunca termina! Meu grupo parte para o [GetBuilding('heian_palace_01').GetName] para participar de uma cerimônia na qual [Select_CString( emperor.IsFemale, 'a', 'o' )] [emperor.GetTitleAsName] estará presente.\n\nPara muitos, o agito da capital é um desafio para se locomover, mas como [kampaku.GetTitleAsNameNoTooltip] o povo se abre como sardinhas diante de um tubarão.\n\nDe repente, o progresso do meu grupo é interrompido. Meus assistentes me alertam que o arrogante [upstart.GetName] cortou à frente na estrada e não moverá seu cavalo para nos deixar passar. O suino obstinado!"
 tgp_japan_yearly_events.1200.t:0 "Congestionamento na Capital"
 tgp_japan_yearly_events.1210.a:0 "\"Conheça seu lugar ou vá embora!\""
 tgp_japan_yearly_events.1210.b.flavor:0 "A liderança duradoura se constrói com compromisso. Você permite que [contester.GetName] funde uma nova [house|E]"
 tgp_japan_yearly_events.1210.b.tt:0 "[contester.GetName] fundará uma nova [house|E]. Eles pensarão com carinho de você e dos seus."
 tgp_japan_yearly_events.1210.b:0 "A planta de arroz madura baixa a cabeça."
 tgp_japan_yearly_events.1210.c.bad:0 "Tive que lubrificar as engrenagens..."
 tgp_japan_yearly_events.1210.c.good.tt:0 "$custom.every_house_member$"
 tgp_japan_yearly_events.1210.c.good:0 "A ferida mais fácil de curar é aquela que nunca existiu."
 tgp_japan_yearly_events.1210.c.ugly:0 "Parece que fiz um inimigo"
 tgp_japan_yearly_events.1210.c:0 "Vou mudar a perspectiva [contester.GetHerHim]."
 tgp_japan_yearly_events.1210.d.flavor:0 "Ignore [contester.GetSheHe]"
 tgp_japan_yearly_events.1210.d.tt:0 "[contester.GetName] fundará uma nova [house|E]. Eles pensarão mal de você e dos seus."
 tgp_japan_yearly_events.1210.d:0 "Por que reconhecer uma queixa imaginária?"
 tgp_japan_yearly_events.1210.desc.bad_genetic:0 "os lamentáveis defeitos do meu nascimento"
 tgp_japan_yearly_events.1210.desc.concubine_child:0 "meu status como filho de concubina"
 tgp_japan_yearly_events.1210.desc.illegitimized:0 "minha ilegitimidade"
 tgp_japan_yearly_events.1210.desc.intro:0 "Minha ascensão como chefe da Casa [ROOT.Char.GetHouse.GetName] foi comprometida. M[Select_CString( contester.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', contester)], aquel[Select_CString( contester.IsFemale, 'a', 'e' )] aranha, [contester.GetName], teceu uma teia de mentiras sedosas, envenenando os ouvidos de todos que quiserem ouvir.\n\n\"[ROOT.Char.GetTitledFirstName] não é apto para liderar a Casa [ROOT.Char.GetHouse.GetNameNoTooltip]!\"\n\n[contester.GetSheHe|U] diz acima de tudo,"
 tgp_japan_yearly_events.1210.desc.low_legitimacy:0 "minha legitimidade questionável"
 tgp_japan_yearly_events.1210.desc.older_sibling:0 "a existência do meu irmão mais velho"
 tgp_japan_yearly_events.1210.desc.outro:0 "deveria me impedir de liderar a família e exige meu assento. Se deixar essa podridão se espalhar, consumirá o corpo. Pelo bem da Casa [ROOT.Char.GetHouse.GetNameNoTooltip], devo agir."
 tgp_japan_yearly_events.1210.desc.reason_bad_health:0 "minha saúde debilitada"
 tgp_japan_yearly_events.1210.desc.reason_drunkard:0 "minha bebedeira interminável"
 tgp_japan_yearly_events.1210.desc.reason_fallback:0 "o primeiro sonho do novo ano [contester.GetHerHim] foi inauspicioso e"
 tgp_japan_yearly_events.1210.desc.reason_non_dominant_gender:0 "meu gênero menos que ideal"
 tgp_japan_yearly_events.1210.desc.reason_weak_prowess:0 "minha destreza lamentável"
 tgp_japan_yearly_events.1210.desc.sinful:0 "meu comportamento pecaminoso"
 tgp_japan_yearly_events.1210.t:0 "Apto para Liderar?"
 tgp_japan_yearly_events.1220.a:0 "Incrível! Preciso procurar este monge."
 tgp_japan_yearly_events.1220.b:0 "Deve haver uma explicação lógica... em algum lugar."
 tgp_japan_yearly_events.1220.c.tt:0 "Você estuda o milagre"
 tgp_japan_yearly_events.1220.c:0 "Devo aprender os caminhos [monk.GetHerHim]..."
 tgp_japan_yearly_events.1220.desc:0 "M[Select_CString( miracle_recipient.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', miracle_recipient)], [miracle_recipient.GetName], traz-me notícias de que o monge viajante, [monk.GetName], realizou um milagre.\n\n"
 tgp_japan_yearly_events.1220.desc_health:0 "\"Minha doença já não me atormenta, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [miracle_recipient.Custom2('RelationToMeShort', ROOT.Char)]! Na verdade, o poder das orações [monk.GetHerHim] me tornou mais forte do que antes da doença.\""
 tgp_japan_yearly_events.1220.desc_knowledge:0 "\"Alguns poderiam ter me considerado lento antes de conhecer este monge. Agora, após receber os ensinamentos [monk.GetHerHim], minha mente transborda conhecimento e acuidade mental!\""
 tgp_japan_yearly_events.1220.desc_wealth:0 "\"Ofereci ao monge um saco de ouro e, meses depois, [monk.GetSheHe] retornou com um dez vezes maior, retribuindo o favor!\""
 tgp_japan_yearly_events.1220.t:0 "Um Milagre em Vestes"
 tgp_japan_yearly_events.1220.tt:0 "O monge realiza um milagre sobre você"
 tgp_japan_yearly_events.1220.tt_lose:0 "Os caminhos do monge se perdem para você"
 tgp_japan_yearly_events.1220.tt_wealth:0 "Você investe no templo e parece que os retornos são confiáveis."
 tgp_japan_yearly_events.1220.tt_win:0 "Você aprende os caminhos do monge"
 tgp_japan_yearly_events.1225.a.flavor:0 "Com o tempo, serei poeta não apenas de nome"
 tgp_japan_yearly_events.1225.a:0 "Então começarei a viver!"
 tgp_japan_yearly_events.1225.b:0 "Estudarei poesia hoje, mas busco uma vida menos frívola."
 tgp_japan_yearly_events.1225.desc.intro.influencer:0 "M[Select_CString( poet_influencer.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('poet_influencer'))] tem um brilho nos olhos esta manhã. Sempre atento ao meu aprimoramento, [poet_influencer.GetSheHe] inicia uma recitação apaixonada.\n\n"
 tgp_japan_yearly_events.1225.desc.intro:0 "Enquanto perquiro textos para meu aprimoramento, deparo-me com uma passagem que chama minha atenção."
 tgp_japan_yearly_events.1225.desc:0 "#EMP \"A semente da poesia [ROOT.Char.GetTopLiege.GetCulture.GetNameNoTooltip] reside no coração de todos. Se nutrida, florescerá em folhas de dez mil palavras.\n\nEstas palavras podem tomar as pequenas coisas que vemos e ouvimos e dar-lhes o poder de mover céus e terra, despertar os sentimentos dos deuses e espíritos invisíveis, harmonizar as relações entre homens e mulheres, e acalmar os corações dos guerreiros ferozes!\"#!\n\n\"Ser poeta é viver e, vivendo, pode-se tornar um poeta melhor.\""
 tgp_japan_yearly_events.1225.t:0 "Uma Vida Poética"
 tgp_japan_yearly_events.1230.a:0 "Repare-o antes que ganhe vida!"
 tgp_japan_yearly_events.1230.b:0 "Não serei assombrado por um objeto..."
 tgp_japan_yearly_events.1230.c:0 "Esperemos que nada aconteça..."
 tgp_japan_yearly_events.1230.c_cynical:0 "Bem, não acredito nessas histórias."
 tgp_japan_yearly_events.1230.desc:0 "O [cursed_artifact.GetName] não é mais o [cursed_artifact.GetSlotType|l] que já foi. Com [cursed_artifact.Custom('GetArtifactDecayDesc')], e sua antiga idade de [cursed_artifact.GetAge] anos, este artefato está atrasado para reparos.\n\nAs lendas contam que objetos têm memórias e emoções como nós, e se negligenciados, podem ser possuídos por um [Glossary('Yokai', 'YOKAI_GLOSS')]..."
 tgp_japan_yearly_events.1230.t:0 "Assombrado pelo Negligenciamento"
 tgp_japan_yearly_events.1240.a:0 "Traga um tutor para [traveler.GetSheHe], por favor!"
 tgp_japan_yearly_events.1240.b:0 "Haha! Que bom riso."
 tgp_japan_yearly_events.1240.c:0 "Vamos ver se consigo explicar em sua língua..."
 tgp_japan_yearly_events.1240.desc:0 "Um poeta [traveler.GetCulture.GetName], [traveler.GetName], viajando por minhas terras aproxima-se de mim com um texto em [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip].\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip], ouvi falar da rica tradição poética do seu povo, mas não consigo decifrar a escrita de vocês.\"\n\n[traveler.GetSheHe|U] começa a ler o pergaminho com um forte sotaque, e o problema se torna aparente. [traveler.GetSheHe|U] lê da esquerda para a direita, enquanto a escrita tradicional [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] é vertical.\n\nOs cortesãos observam e riem, enquanto [traveler.GetSheHe] continua com seu turbilhão de palavras."
 tgp_japan_yearly_events.1240.t:0 "Perdido nas Linhas"
 tgp_japan_yearly_events.1250.a:0 "Pendure-o acima da cama conjugal."
 tgp_japan_yearly_events.1250.b:0 "Coloque-o na corte, para que todos possam ver."
 tgp_japan_yearly_events.1250.c:0 "Guarde-o com segurança, para que nossos descendentes possam lê-lo."
 tgp_japan_yearly_events.1250.desc:0 "[scroll_gifter.GetName] avança, trazendo um objeto longo e embrulhado. \"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [scroll_gifter.Custom2('RelationToMeShort', ROOT.Char)], tenho um presente para sua união.\" [scroll_gifter.GetNameNoTooltip] diz, apresentando um pergaminho. \"Um [Glossary( 'Kakejiku Scroll', 'KAKEJIKU_GLOSS' )], com prosa do mais fino poeta, que vocês possam lembrar de seu significado nos momentos difíceis.\""
 tgp_japan_yearly_events.1250.t:0 "Uma História para a Eternidade"
 tgp_japan_yearly_events.1260.a.flavor:0 "Como posso esperar avançar em minha arte de outra forma?"
 tgp_japan_yearly_events.1260.a:0 "É meu dever perseguir envolvimentos amorosos!"
 tgp_japan_yearly_events.1260.b:0 "O romance está além de mim, assim como a poesia, temo."
 tgp_japan_yearly_events.1260.desc:0 "A manhã se inicia com um ar sonoro e doce enquanto pássaros voam à procura de um parceiro.\n\n\"Em breve estarão mortos, e ainda assim vivem plenamente, compondo palavras de amor a manhã inteira.\"\n\nObservo mais, enquanto insetos são arrastados do ar, desmembrados e devorados pelos vorazes amantes alados.\n\nComo poeta, meu chamado, meu dever, é destilar toda a beleza e horror em algumas palavras selecionadas para que outros meditem. Toda poesia fala de amor ou morte. A morte está ao nosso redor, mas o amor, o amor devemos buscar."
 tgp_japan_yearly_events.1260.t:0 "$tgp_japan_yearly_events.1225.t$: Amor e Morte"
 tgp_japan_yearly_events.1261.a.flavor:0 "Mais belo que qualquer palavra minha, meu sangue ecoará pela história."
 tgp_japan_yearly_events.1261.a:0 "Meu sangue fortalecerá [top_cuckold.GetPrimaryTitle.GetNameNoTooltip]!"
 tgp_japan_yearly_events.1261.b:0 "Melhor trocarmos poemas, não..."
 tgp_japan_yearly_events.1261.c:0 "Não exporei a insuficiência amorosa d[Select_CString( top_cuckold.IsFemale, 'a', 'o' )] [top_cuckold.GetTitleAsNameNoTooltip]."
 tgp_japan_yearly_events.1261.chop.desc:0 "\n\n[top_liege_spouse.GetSheHe] não deve saber da minha falta de aparelho reprodutivo..."
 tgp_japan_yearly_events.1261.d:0 "Vamos nos divertir, mesmo assim!"
 tgp_japan_yearly_events.1261.desc:0 "Minhas façanhas poéticas chamaram a atenção [Select_CString( top_cuckold.IsFemale, 'da minha', 'do meu' )] [inspired_poet.Custom2('RelationToMeShort', SCOPE.sC('top_cuckold'))] [top_cuckold.GetTitledFirstName] [top_cuckold.Custom2('RelationToMeShort', SCOPE.sC('top_liege_spouse'))], [top_liege_spouse.GetTitledFirstName]:\n\n\"Suas palavras já garantiram imortalidade na mente de todo o povo [inspired_poet.GetTopLiege.GetCulture.GetNameNoTooltip], mas e se pudesse assegurar a imortalidade do corpo?\"\n\nAs palavras [top_liege_spouse.GetHerHim] de elogio chegam elegantemente ao limiar de seus aposentos. Parece que [top_liege_spouse.GetSheHe] deseja mais do que validar rumores sobre minha habilidade entre os travesseiros. Será que [top_liege_spouse.GetSheHe] espera que nossa união gere um novo herdeiro para [Select_CString( top_cuckold.IsFemale, 'a', 'o' )] [top_cuckold.GetTitleAsNameNoTooltip]?!"
 tgp_japan_yearly_events.1261.t:0 "$tgp_japan_yearly_events.1225.t$: Imortalidade Imperial"
 tgp_japan_yearly_events.1262.a.flavor:0 "#EMP \"O vento traz tua voz,\n\nsuave como o suspiro das folhas caídas,\n\nsob céus de outono.\"#!"
 tgp_japan_yearly_events.1262.a:0 "Tenho o verso perfeito!"
 tgp_japan_yearly_events.1262.b.flavor:0 "Nossas vozes ecoarão inúmeros 'versos' pela noite."
 tgp_japan_yearly_events.1262.b:0 "Vamos trocar mais que palavras..."
 tgp_japan_yearly_events.1262.c:0 "Ou será que [local_poet.GetSheHe] é uma assassina?!"
 tgp_japan_yearly_events.1262.desc.intro:0 "Muitos versos potentes são descobertos enquanto se aprecia o ar da noite. Ao meditar sobre "
 tgp_japan_yearly_events.1262.desc:0 "De repente me deparo com a encantadora poeta [local_poet.GetName] recitando um verso:\n\n#EMP \"Pelo tranquilo [local_poet_spot.Custom('GetTerrainType')],\n\nEspero ouvir teus passos,\n\nno [local_poet_spot.Custom('RoamingLegendaryBeastProvinceWeather')] do entardecer.\"#!\n\nPercebendo minha disposição poética, [local_poet.GetSheHe] gesticula para que eu me junte a [local_poet.GetSheHe] nas sombras. Seria este um convite para engajar em "
 tgp_japan_yearly_events.1262.inspo:0 "uma força além de mim,"
 tgp_japan_yearly_events.1262.japan.inspo:0 "[Glossary('mono no aware', 'MONONOAWARE_GLOSS')],"
 tgp_japan_yearly_events.1262.japan.outro.outro:0 "ou será que seu olhar, semelhante ao de [local_poet.Custom('VenomousCreature')], prenuncia algo mais lascivo?"
 tgp_japan_yearly_events.1262.japan.outro:0 "[Glossary('renga', 'RENGA_GLOSS')]"
 tgp_japan_yearly_events.1262.outro:0 "uma troca poética"
 tgp_japan_yearly_events.1262.t:0 "$tgp_japan_yearly_events.1225.t$: Uma Troca de Versos"
 tgp_japan_yearly_events.1263.a.flavor:0 "Que se dane a chuva, você se entrega entre os [SCOPE.Custom('ArtifactFlowerSpeciesPlural')]. Esta memória certamente fortalecerá sua poesia!"
 tgp_japan_yearly_events.1263.a:0 "Vamos celebrar nossas vidas efêmeras..."
 tgp_japan_yearly_events.1263.b.flavor:0 "Uma pequena rebelião contra a tirania do tempo."
 tgp_japan_yearly_events.1263.b:0 "Devo preservar ao menos uma [SCOPE.Custom('ArtifactFlowerSpecies')]!"
 tgp_japan_yearly_events.1263.c.medicinal:0 "#EMP Presentes de [rural_beauty.GetFaith.HealthGodName]...#!"
 tgp_japan_yearly_events.1263.c.poisonous:0 "#EMP Presentes de [rural_beauty.GetFaith.DeathDeityName]...#!"
 tgp_japan_yearly_events.1263.c:0 "Será que as pétalas esmagadas têm outro propósito?"
 tgp_japan_yearly_events.1263.desc:0 "A verdade do mundo é revelada através da natureza! Durante uma breve caminhada por um luxuoso [rural_beauty_location.Custom('GetTerrainType')] próximo a [inspired_poet.GetCurrentLocation.GetBaronyNameExplicitly], sou surpreendido por uma chuva repentina.\n\nEm busca de abrigo, deparo-me com um[Select_CString( rural_beauty.IsFemale, 'a', '' )] [rural_beauty.GetWomanMan] dançando em um leito de [SCOPE.Custom('ArtifactFlowerSpeciesPlural')].\n\nA chuva bate nos pés [rural_beauty.GetHerHim], destruindo as pétalas delicadas. Esta beleza fugaz é realçada pelo aparente caos descuidado. Notando minha forma encharcada, [rural_beauty.GetSheHe] me chama com um discreto levantar de queixo."
 tgp_japan_yearly_events.1263.t:0 "$tgp_japan_yearly_events.1225.t$: Um Efêmero [SCOPE.Custom('ArtifactFlowerSpecies')|U]"
 tgp_japan_yearly_events.1270.a:0 "O [ROOT.Char.Custom('GetCourt')] deve se beneficiar da minha sabedoria amorosa!"
 tgp_japan_yearly_events.1270.a_effect:0 "[newly_created_artifact.GetName] é feito um [court_artifact|E] e ganhará o modificador de [grandeur|E]"
 tgp_japan_yearly_events.1270.b:0 "Mesmo que minha carne definha e apodreça, minha virilidade permanecerá eterna."
 tgp_japan_yearly_events.1270.b_effect:0 "Você recebe o [artifact|E] [newly_created_artifact.GetName]"
 tgp_japan_yearly_events.1270.desc.death_memory_1:0 "#EMP [death_memory_1.GetDescription]#!, "
 tgp_japan_yearly_events.1270.desc.death_memory_2:0 "#EMP [death_memory_2.GetDescription]#!, "
 tgp_japan_yearly_events.1270.desc.death_memory_3:0 "#EMP [death_memory_3.GetDescription].#!"
 tgp_japan_yearly_events.1270.desc.love_memory_1:0 "#EMP [love_memory_1.GetDescription]#!, "
 tgp_japan_yearly_events.1270.desc.love_memory_2:0 "#EMP [love_memory_2.GetDescription]#!, "
 tgp_japan_yearly_events.1270.desc.love_memory_3:0 "#EMP [love_memory_3.GetDescription]#!, "
 tgp_japan_yearly_events.1270.desc:0 "Embora todos nasçam com sementes de poesia no coração, as minhas foram nutridas pelo sol amoroso em que busquei me banhar e pelas doces águas da morte que nos cercam a todos.\n\nIsso culminou na criação de #EMP $poetic_life_artifact_name$#!, certamente um pilar da cultura [ROOT.Char.GetTopLiege.GetCulture.GetNameNoTooltip] daqui em diante.\n\nTodos se lembrarão de quando, "
 tgp_japan_yearly_events.1270.t:0 "$tgp_japan_yearly_events.1225.t$: Mil Folhas Imortais"
 tgp_japan_yearly_events.cannibal.1160.t:0 "Uma Oferta de Carne de [feuding_house.GetNameNoTooltip]"
 tgp_japan_yearly_mystic_negative.tt:0 "Não compreendo o que está sendo pedido"
 tgp_japan_yearly_mystic_neutral.tt:0 "Tento compreender o significado por trás das palavras"
 tgp_japan_yearly_mystic_positive.tt:0 "Busco dentro de mim para encontrar uma verdade"
 tgp_learning_poetry_modifier:0 "Aprendendo Poesia"
 tgp_learning_poetry_modifier_desc:0 "Este personagem está praticando seus versos"
 tgp_reflection_modifier_desc_tt:0 "[GetModifier('tgp_reflection_modifier').GetNameWithTooltip]"
 uchiwa:0 "Uchiwa"
 uchiwa_desc:0 "Padrões delicados adornam este leque artesanal, feito de bambu e papel."
