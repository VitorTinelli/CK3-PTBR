 friend_nice_gesture_corresponding:0 "[CHARACTER.GetShortUIName|U] enviou um gesto amigável para [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltip] durante suas viagens."
 guilt_fever_tt:0 "Você sofre de Febre da Culpa"
 house_relation_friendly_reason_cadet_branch_permission_desc:0 "Onde o arroz pode cair, uma árvore com muitos galhos pode ser apoiada para não tombar."
 house_relation_quarrel_reason_cadet_branch_permission_desc:0 "Você ignorou as preocupações d[Select_CString( contester.IsFemale, 'a', 'o' )] [contester.GetTitledFirstName]"
