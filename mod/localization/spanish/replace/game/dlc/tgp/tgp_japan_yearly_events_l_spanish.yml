l_spanish:
 1071_rival_tt:0 "Por #V 2#! anos, qualquer [scheme|E] hostil iniciado contra [rival.GetNameNoTooltip] terá aumento na [success_chance|E]"
 AMA_DIVERS_GLOSS:0 "#bold Ama#! — que significa 'mulheres do mar' — são mergulhadoras especializadas em coletar pérolas e frutos do mar do fundo do mar. São conhecidas por sua habilidade de prender a respiração por longos períodos."
 BONSAI_GLOSS:0 "#bold Bonsai#! é a arte de cultivar e moldar pequenas árvores em recipientes. Alguns estudiosos dizem que as árvores refletem seus donos."
 FUROSHIKI_GLOSS:0 "Um pano decorativo e funcional. Literalmente 'cobertura de banho', de furo ou 'banho' e shiki como 'cobertura'. O termo origina-se dos nobres que visitavam a casa de banho e embalavam seus pertences em um pano decorado com o brasão da família."
 HANAMI_GLOSS:0 "#bold Hanami#! - \"observação de flores\", uma tradição japonesa herdada da China de admirar flores de ameixeira. Com o tempo e com influências poéticas como o Genji Monogatari, no período Heian o foco passou a priorizar as flores de cerejeira."
 KAKEJIKU_GLOSS:0 "Um #bold Pergaminho Kakejiku#! — ou #bold Kakemono#! é um rolo que exibe caligrafia ou pinturas, geralmente contando uma história."
 MONONOAWARE_GLOSS:0 "Uma mentalidade que se adota ao compor poesia no Japão Heian. Envolve uma sensibilidade emocional intensa, porém equilibrada, com foco na beleza efêmera e uma melancólica consciência da tirania do tempo."
 ONIBI_GLOSS:0 "#bold Onibi#! ou 'fogo demoníaco' são uma forma de [Glossary('Yokai', 'YOKAI_GLOSS')] que se manifesta como orbes de luz ou chamas, nascidos das almas dos mortos. Frequentemente maliciosos, podem levar viajantes a situações perigosas ou fatais."
 ONSEN_GLOSS:0 "#bold Onsen#! — fontes termais japonesas — uma nascente natural conhecida por suas propriedades terapêuticas."
 RENGA_GLOSS:0 "Poema japonês 'encadeado', forma em que múltiplos poetas contribuem com estrofes alternadas."
 SENSU_GLOSS:0 "Um #bold Sensu#! é um leque de mão dobrável, comumente usado no verão."
 SHOJI_GLOSS:0 "Uma divisória de ambiente com estrutura de treliça, geralmente composta por painéis translúcidos, permitindo que luz e sombra passem através dela."
 SORIBASHI_GLOSS:0 "#bold Soribashi#! ou 'Pontes da Lua', originárias da China, são pontes para pedestres com grande arco. Utilizadas para fins ornamentais em jardins ou para atravessar córregos permitindo que barcos passem por baixo."
 TENGU_GLOSS:0 "#bold Tengu#! — significando \"Cão Celestial\" — são uma forma de [Glossary( 'Yokai', 'YOKAI_GLOSS' )], frequentemente retratados como criaturas aviárias. Espíritos protetores, porém perigosos, que residem em montanhas ou florestas. A versão mais conhecida de um Tengu nos tempos modernos são seus rostos vermelhos combinados com um nariz comprido."
 TSURIDONO_GLOSS:0 "#bold Tsuridono#! — que significa 'pavilhão de pesca' — é uma estrutura construída sobre um lago, usada para observar o jardim e realizar pequenos atos de entretenimento."
 UCHIWA_GLOSS:0 "Um elegante leque de mão redondo da Dinastia Tang (618-907 d.C.) na China, que ganhou popularidade entre a nobreza japonesa devido às missões comerciais com a China. Frequentemente associado ao verão e à feminilidade. Sua popularidade e belos designs resultaram na criação de leis sumptuárias para restringir sua decoração."
 YOKAI_GLOSS:0 "#bold Yōkai#! ou 'aparição estranha' são seres sobrenaturais da mitologia japonesa, que variam de fantasmas, demônios, monstros, metamorfos e trapaceiros. Frequentemente apresentam características animais."
 artifact_decay_cracked:0 "superfície cheia de rachaduras"
 artifact_decay_dull:0 "pontas afiadas se tornando cegas"
 artifact_decay_fracture:0 "superfície cheia de fraturas"
 artifact_decay_scratched:0 "superfície riscada e perfurada"
 artifact_decay_torn:0 "ligaduras e tecido rasgados"
 artifact_decay_worn:0 "como está gasto"
 artifact_fertility_gain_2_modifier:0 "Fertilidade"
 artifact_kakejiku_scroll_crane_desc:0 "$artifact_kakejiku_scroll_desc$ uma garça solitária, cuidando de uma árvore.\n\n#weak As penas da garça se agitam ao vento, observando a muda. As garças se unem para a vida toda, mas esta árvore leva séculos para crescer...#!"
 artifact_kakejiku_scroll_desc:0 "Um [Glossary( 'Pergaminho Kakejiku', 'KAKEJIKU_GLOSS' )] contando a história de"
 artifact_kakejiku_scroll_friends_desc:0 "$artifact_kakejiku_scroll_desc$ duas pessoas unidas pelo destino, crescendo através de suas lutas e desenvolvendo uma profunda amizade.\n\n#weak Duas figuras se encontram sob um céu estrelado, seu vínculo unido por uma ponte celestial...#!"
 artifact_kakejiku_scroll_name:0 "Pergaminho Kakejiku"
 artifact_kakejiku_scroll_sword_desc:0 "$artifact_kakejiku_scroll_desc$ uma espada encantada, capaz de ser empunhada apenas pelos guerreiros mais honoráveis.\n\n#weak Uma cerejeira floresce sobre um lago calmo, e sob ela uma lâmina embainhada...#!"
