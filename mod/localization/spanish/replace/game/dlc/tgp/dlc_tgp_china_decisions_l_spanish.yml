 tgp_minister_request_bestowal_of_honors_decision_confirm:0 "Solicitar Honrarias"
 tgp_minister_request_bestowal_of_honors_decision_desc:0 "Meu mandato como Ministro me concedeu influência considerável dentro do Império [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier]. Usarei essa influência para solicitar que membros da Casa [ROOT.Char.GetHouse.GetName] sejam honrados como estadistas da mais alta ordem em nosso campo."
