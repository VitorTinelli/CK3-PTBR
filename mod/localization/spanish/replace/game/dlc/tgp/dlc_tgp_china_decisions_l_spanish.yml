 tgp_minister_recruit_courtiers_decision_confirm:0 "Recrutar Cortesãos"
 tgp_minister_recruit_courtiers_decision_desc:0 "Do canto mais distante de nosso reino à cidade mais populosa. Pessoas com talentos incríveis podem ser encontradas em qualquer lugar. Ao percorrer cada rua, casa de chá e vale, garantiremos empregar apenas os melhores para manter a vasta burocracia do governo funcionando sem problemas."
 tgp_minister_recruit_courtiers_decision_effect_desc:0 "Você recrutará vários [characters|E] habilidosos para sua [court|E]"
