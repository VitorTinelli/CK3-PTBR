 tgp_personal_honors_modifier_desc:0 "Este Ministro proeminente foi agraciado com honrarias do Imperador graças à sua influência.\n\n[movement_power|E]: [movement_power_i]#P +300#!"
 tgp_refuse_appointments_decision:0 "Recusar Novas Nomeações"
 tgp_refuse_appointments_decision_accept_desc:0 "Aceitar futuras [appointments|E] e adicionar-se ao [merit_pool|E] de [titles|E] elegíveis"
 tgp_refuse_appointments_decision_accept_t:0 "Aceitar Nomeações"
 tgp_refuse_appointments_decision_confirm:0 "Recusar novas nomeações"
 tgp_refuse_appointments_decision_confirm_accept:0 "Aceitar nomeações"
 tgp_refuse_appointments_decision_desc:0 "Governar não é um fardo fácil. Serei realmente apto a governar terras tão vastas — a tomar decisões difíceis que sirvam ao bem maior? Talvez seja hora de recusar futuras nomeações e permanecer aqui em paz."
 tgp_refuse_appointments_decision_refuse_desc:0 "Recusar futuras [appointments|E] e remover-se do [merit_pool|E] de todos os [titles|E] potenciais"
 tgp_refuse_appointments_decision_tooltip:0 "Deixe claro que você não deseja mais ser considerado para #EMP quaisquer#! futuras [appointments|E] até novo aviso"
 tgp_resume_appointments_decision:0 "Retomar Novas Nomeações"
 tgp_resume_appointments_decision_confirm:0 "Retomar novas nomeações"
 tgp_resume_appointments_decision_desc:0 "Por ora, não estou inclinado a aceitar novas nomeações. Contudo, posso enviar aviso de que estou pronto para retomar minhas funções a qualquer momento."
 tgp_resume_appointments_decision_tooltip:0 "Disponibilize-se imediatamente para todos os futuras [appointments|E] removendo restrições atuais"
