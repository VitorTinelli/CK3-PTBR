 tgp_tea_ceremony_decision_effect_desc:0 "Você pode ganhar qualquer um dos seguintes:\n$BULLET_WITH_TAB$Reduzir [stress_i|E][stress|E]\n$BULLET_WITH_TAB$Ganhar [opinion_i][opinion|E] com membros do seu [court|E]\n$BULLET_WITH_TAB$Um [courtier|E] se torna [inspired|E]\n$BULLET_WITH_TAB$Ganhar um benefício aleatório de #P Chá#! por #V 5#! anos"
