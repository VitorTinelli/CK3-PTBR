 mandala_realm_contract_0011_desc:0 "Um raio atingiu uma árvore sagrada, queimando o bosque ao redor em [TaskContract.GetLocation.GetNameNoTooltip]. Os aldeões estão assustados e pedem que você realize um ritual de fertilidade sob a árvore."
 mandala_realm_contract_0011_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0011_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão com base no seu [mandala_aspect|E]"
