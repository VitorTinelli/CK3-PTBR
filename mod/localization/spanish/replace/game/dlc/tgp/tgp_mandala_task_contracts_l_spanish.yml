 mandala_ritual_prefix:0 "Ritual Mandala:"
 mocked_idol_modifier:0 "Ídolo Zombado"
 mocked_idol_modifier_desc:0 "Um ídolo construído por um Devaraja é amplamente zombado neste condado."
 motivated_men_at_arms_modifier:0 "Homens-de-armas Motivados"
 motivated_men_at_arms_modifier_desc:0 "Os homens-de-armas que guardam esta província estão muito motivados após uma exibição do seu Devaraja. Ou, pelo menos, o que restou deles."
 msg_mandala_realm_contract_appear.desc:0 "O [mandala_ritual|E] [new_mandala_visit.GetType.GetName|V] apareceu em [target_province.GetName], desejando minha presença."
 msg_mandala_realm_contract_appear.t:0 "Ritual Mandala Disponível"
 new_shrines_modifier:0 "Novos Santuários"
 new_shrines_modifier_desc:0 "O Devaraja ergueu novos santuários para aplacar as disputas monásticas nesta província."
 no_healers_modifier:0 "Sem Curandeiros"
 no_healers_modifier_desc:0 "O Devaraja mandou matar curandeiros e xamãs nesta província."
 omnipresent_authority_modifier:0 "Autoridade Onipresente"
 omnipresent_authority_modifier_desc:0 "É quase como se o Devaraja morasse neste condado, pelo quanto é visto... mas ele não deveria morar na capital?"
 pious_silpakaras_modifier:0 "Śilpakāras Piedosos"
 pious_silpakaras_modifier_desc:0 "Um grupo de [Glossary('Śilpakāras', 'SILPAKARAS_GLOSS')] piedosos trabalha nesta província."
 plagued_by_nightmares_modifier:0 "Campos de Batalha Não Purificados"
 plagued_by_nightmares_modifier_desc:0 "Após o Devaraja escolher não purificar os campos de batalha, os camponeses foram 'atormentados por pesadelos', tornando-se menos produtivos."
 punished_charlatan_modifier:0 "Charlatão Punido"
 punished_charlatan_modifier_desc:0 "Um charlatão foi recentemente exposto e punido aqui."
 ritually_disarmed_modifier:0 "Ritualmente Desarmado"
 ritually_disarmed_modifier_desc:0 "Este personagem enterrou suas armas como parte de um cerimonial mandala."
 river_crocodile_god_modifier:0 "Deus Crocodilo"
 river_crocodile_god_modifier_desc:0 "Um enorme crocodilo, frequentemente confundido com um [Glossary('nāga', 'NAGA_GLOSS')], habita as águas desta província — devorando exércitos invasores e amedrontando camponeses."
 ruler_idol_modifier:0 "Ídolo Espiritual do Devaraja"
 ruler_idol_modifier_desc:0 "Um ídolo construído por um Devaraja é amplamente acreditado afastar espíritos malignos."
 safer_roads_modifier:0 "Estradas Mais Seguras"
 safer_roads_modifier_desc:0 "As estradas ficaram um pouco mais seguras após uma visita do Devaraja."
 slaughtered_village_modifier:0 "Aldeia Massacrada"
 slaughtered_village_modifier_desc:0 "Um Devaraja massacrou a população de uma aldeia desafiadora dentro deste condado."
 stone_head_shrine_modifier:0 "Santuário da Cabeça de Pedra Gigante"
 stone_head_shrine_modifier_desc:0 "A antiga estátua de um rei esquecido foi transformada em um santuário para um Devaraja local."
 sworn_peace_tt:0 "Você jurou não declarar nenhuma guerra!"
 task_contract_reward_effect_common_mandala_desc:0 "Oportunidades:"
 task_contract_reward_effect_custom_tooltip_desc:0 "Você terá a chance de ganhar [piety_i][piety|E] ou [legitimacy_i][legitimacy|E]"
 tgp_east_asia_mandala_task_contract_events.0990.a:0 "O povo de [ongoing_destination.GetNameNoTooltip] está me esperando!"
 tgp_east_asia_mandala_task_contract_events.0990.a_tt:0 "$governor_contract_event.1012.a_tt$"
 tgp_east_asia_mandala_task_contract_events.0990.b:0 "$governor_contract_event.1012.b$"
 tgp_east_asia_mandala_task_contract_events.0990.b_tt:0 "[ongoing_contract.GetType.GetName] em [ongoing_destination.GetName] foi abandonado"
 tgp_east_asia_mandala_task_contract_events.0990.desc:0 "Hesitante, reconsidero meus planos de partir para [ongoing_destination.GetTitle.GetName] para realizar os rituais.\n\nSerá que este é realmente o momento certo para viajar? Meu tempo não seria melhor gasto em outro lugar? Questões importantes para um ícone religioso."
 tgp_east_asia_mandala_task_contract_events.0990.t:0 "$mandala_ritual_prefix$ Tendo Segundo Pensamentos"
 tgp_east_asia_mandala_task_contract_events.1000.a:0 "Eles devem se concentrar em me reverenciar."
 tgp_east_asia_mandala_task_contract_events.1000.b:0 "Deixe-os se banhar em minha glória!"
 tgp_east_asia_mandala_task_contract_events.1000.desc.creation:0 "#EMP Criação.#! A vida é frágil, e é nosso dever cuidar dela o melhor que pudermos. Se cuidarmos da vida, dos animais e da natureza, isso nos fortalecerá e nos dará poder dez vezes mais. Olho ao redor enquanto cuidamos da flora local.\n\nCrianças, adultos, idosos — todos se reúnem para celebrar a vida. As crianças, alegremente cavando a terra com seus instrumentos improvisados, plantando sementes.\n\nUm dos participantes mais zelosos, [local_character.GetTitledFirstName], com o suor escorrendo pela testa, sorri e me olha com expectativa enquanto aguarda novas instruções."
 tgp_east_asia_mandala_task_contract_events.1000.desc.destruction:0 "As piras estão acesas. Os sacrifícios foram feitos. Contemplo a cena, uma poderosa demonstração de força liderada pelo chefe local, [local_character.GetTitledFirstName], e pelos seus mais fortes, tudo orquestrado por mim.\n\nTodos eles, ansiosos para servir, ansiosos para afastar o mal antes que o mal consuma a Criação. Nossa Criação.\n\nColetivamente, eles se voltam para mim, uma pergunta unânime escrita em seus rostos: o que desejo que façam agora?"
 tgp_east_asia_mandala_task_contract_events.1000.desc.serenity:0 "Um leve farfalhar no dossel. Olho por cima do ombro e vejo mulheres, homens, idosos, jovens e até algumas crianças pequenas participando da cerimônia, repetindo silenciosamente meus movimentos.\n\n#EMP Dobre. Estique. Respire. Estenda. Respire.#!\n\nUm morador particularmente prestativo, [local_character.GetTitledFirstName], se apressa até mim depois, perguntando qual deve ser seu próximo curso de ação."
 tgp_east_asia_mandala_task_contract_events.1000.desc.trickery:0 "Ilusões, travessuras e jogos mentais entre si. Tudo de boa fé. Tudo #EMP benigno#!. Até que deixa de ser.\n\nOs cidadãos de [ritual_location.GetName], sem saber, revelam seus segredos mais profundos ao participar de meus rituais, e aqueles que percebem isso são os que devem liderar o rebanho e servir em meu nome, exclusivamente...\n\nUm dos mais astutos, [local_character.GetTitledFirstName], me lança um olhar enganoso, aguardando meu próximo comando para as massas."
 tgp_east_asia_mandala_task_contract_events.1000.t.creation:0 "$mandala_ritual_prefix$ Abraçando o Criador"
 tgp_east_asia_mandala_task_contract_events.1000.t.destruction:0 "$mandala_ritual_prefix$ Abraçando o Destruidor"
 tgp_east_asia_mandala_task_contract_events.1000.t.serenity:0 "$mandala_ritual_prefix$ Abraçando o Sereno"
 tgp_east_asia_mandala_task_contract_events.1000.t.trickery:0 "$mandala_ritual_prefix$ Abraçando o Trapaceiro"
 tgp_east_asia_mandala_task_contract_events.1100.a:0 "O ritual durará um mês!"
 tgp_east_asia_mandala_task_contract_events.1100.b:0 "Um ritual de uma semana será suficiente."
 tgp_east_asia_mandala_task_contract_events.1100.c:0 "Ficarei por um dia."
 tgp_east_asia_mandala_task_contract_events.1100.desc:0 "\"Oh, grande e divin[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip], ouça o clamor de minha aldeia\", diz [Select_CString( local_character.IsFemale, 'a', 'o' )] [local_character.GetWomanMan] líder, colocando a mão sobre uma novilha magra ao seu lado. \"Faça nossas vacas darem cria novamente!\"\n\n[local_character.GetSheHe|U] faz um gesto para os aldeões, que trazem grandes guirlandas de coloridas [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type_plural')] para o ritual."
 tgp_east_asia_mandala_task_contract_events.1100.t:0 "$mandala_ritual_prefix$ Gado Estéril"
 tgp_east_asia_mandala_task_contract_events.1200.a:0 "O(a) [ritual_location.Custom('TerrainTypeProvince')] terá um mês de nossa união!"
 tgp_east_asia_mandala_task_contract_events.1200.b:0 "Deitemos onde será colocada a primeira pedra."
 tgp_east_asia_mandala_task_contract_events.1200.c:0 "Eu posso... lidar com isso sozinho(a)."
 tgp_east_asia_mandala_task_contract_events.1200.desc:0 "\"Grande [ROOT.Char.GetTitleAsNameNoTooltip], nós — seus humildes servos — desejamos erguer um [GetBuilding('temple_citadel_01').GetName] em seu glorioso nome\", diz [Select_CString( local_character.IsFemale, 'a', 'o' )] [local_character.GetWomanMan] líder, contemplando o(a) [ritual_location.Custom('TerrainTypeProvince')] diante de nós. \"Mas o solo ainda não foi consagrado. Precisamos que você plante a primeira semente — para preencher a terra com sua criação.\"\n\nUm[Select_CString( local_character_2.IsFemale, 'a', '' )] [local_character_2.GetWomanMan] se adianta, abanando-se timidamente. \"Ó divino, eu me ofereço de bom grado para ajudá-lo(a) a completar o ritual — para que todo [ritual_location.GetName] veja!\""
 tgp_east_asia_mandala_task_contract_events.1200.t:0 "$mandala_ritual_prefix$ A Primeira Semente"
 tgp_east_asia_mandala_task_contract_events.1300.a:0 "Minha divindade não conhece limites — contemplem meu corpo!"
 tgp_east_asia_mandala_task_contract_events.1300.b:0 "Comida e vestes fazem parte do ritual."
 tgp_east_asia_mandala_task_contract_events.1300.c:0 "Uma efígie minha será suficiente..."
 tgp_east_asia_mandala_task_contract_events.1300.desc:0 "\"É um desastre\", lamenta o ancião da aldeia. \"Nossa novilha sagrada se recusa a deitar — um presságio certo de esterilidade e decadência!\"\n\n\"Por favor, precisamos de #EMP você#! para nos abençoar em seu lugar. Suba neste pedestal de pedra e revele sua radiância divina para todos verem — para que os campos de [ritual_location.GetName] se tornem férteis!\" O ancião me encara.\n\nEspera-se que eu fique sobre o pedestal nu, por uma semana, sem comer..."
 tgp_east_asia_mandala_task_contract_events.1300.t:0 "$mandala_ritual_prefix$ Novilha Sagrada"
 tgp_east_asia_mandala_task_contract_events.1400.a:0 "Ah, farei mais do que apenas 'testemunhar'..."
 tgp_east_asia_mandala_task_contract_events.1400.b:0 "Observarei sua união."
 tgp_east_asia_mandala_task_contract_events.1400.c:0 "Ter minhas roupas entre vocês deve bastar."
 tgp_east_asia_mandala_task_contract_events.1400.desc:0 "\"Ó [ROOT.Char.GetTitleAsNameNoTooltip] radiante, [Select_CString( local_character_2.IsFemale, 'minha', 'meu' )] [local_character_2.GetWifeHusband] e eu ainda não fomos abençoados com filhos\", diz [Select_CString( local_character.IsFemale, 'a', 'o' )] nobre [local_character.GetTitledFirstName], com tristeza na voz. \"Mandei construir um pavilhão no(a) [ritual_location.Custom('TerrainTypeProvince')] para o ritual.\"\n\n[Select_CString( local_character_2.IsFemale, 'Sua', 'Seu' )] [local_character_2.GetWifeHusband] continua: \"Precisamos que você durma entre nós, como uma testemunha divina. Só então seremos abençoados com uma criança! Claro... pode levar algumas noites...\""
 tgp_east_asia_mandala_task_contract_events.1400.t:0 "$mandala_ritual_prefix$ Testemunha Divina"
 tgp_east_asia_mandala_task_contract_events.1500.a.stand_in.acolyte:0 "Meu servo e eu cuidaremos de [local_character_2.GetFirstNameNoTooltip]."
 tgp_east_asia_mandala_task_contract_events.1500.a.stand_in.no_relation:0 "[Select_CString( 1500_stand_in_character.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', 1500_stand_in_character )] e eu cuidaremos de [local_character_2.GetFirstNameNoTooltip]."
 tgp_east_asia_mandala_task_contract_events.1500.a.stand_in:0 "[Select_CString( 1500_stand_in_character.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', 1500_stand_in_character )] cuidará de [local_character_2.GetFirstNameNoTooltip], lá em [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]."
 tgp_east_asia_mandala_task_contract_events.1500.a:0 "Venha para [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], [local_character_2.GetFirstNameNoTooltip]."
 tgp_east_asia_mandala_task_contract_events.1500.b.stand_in.acolyte:0 "Acólito [1500_stand_in_character.GetTitledFirstNameNoTooltip], espalhe as sementes do meu reinado."
 tgp_east_asia_mandala_task_contract_events.1500.b.stand_in:0 "[1500_stand_in_character.GetTitledFirstNameNoTooltip], espalhe as sementes do meu reinado."
 tgp_east_asia_mandala_task_contract_events.1500.b:0 "Deitaremos juntos esta noite."
 tgp_east_asia_mandala_task_contract_events.1500.c:0 "Nesta noite, meu #EMP espírito#! estará com você..."
 tgp_east_asia_mandala_task_contract_events.1500.desc.stand_in.acolyte:0 "\n\nOlho para um dos meus devotos, [1500_stand_in_character.GetFirstName]. Eu #EMP ando#! querendo experimentar algo novo..."
 tgp_east_asia_mandala_task_contract_events.1500.desc.stand_in:0 "\n\nOlho para [Select_CString( 1500_stand_in_character.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', 1500_stand_in_character)], [1500_stand_in_character.GetFirstName]. Tenho certeza de que [1500_stand_in_character.GetSheHe] conseguiria #EMP sustentar#! essa responsabilidade..."
 tgp_east_asia_mandala_task_contract_events.1500.desc:0 "Ao me aproximar do vilarejo nos arredores de [ritual_location.GetName], um grupo de parteiras me recebe. \"Todas tivemos o mesmo sonho, grande [ROOT.Char.GetTitleAsNameNoTooltip]\", dizem em uníssono. \"Esta é [local_character_2.GetFirstName] — nascido(a) em uma noite de presságios.\"\n\n\"Uma criança destinada a salvar [ritual_location.GetName] nascerá se você se deitar com [local_character_2.GetSheHe].\" As parteiras se calam enquanto [Select_CString( local_character_2.IsFemale, 'a', 'o' )] [local_character_2.GetWomanMan] incomum se aproxima, sorrindo timidamente para mim."
 tgp_east_asia_mandala_task_contract_events.1500.t:0 "$mandala_ritual_prefix$ O Sonho das Parteiras"
 tgp_east_asia_mandala_task_contract_events.1600.a:0 "Este lugar não é apenas um campo — é um santuário!"
 tgp_east_asia_mandala_task_contract_events.1600.b:0 "Deixe-me adicionar mais oferendas aos espíritos."
 tgp_east_asia_mandala_task_contract_events.1600.c:0 "Eu ungirei a criança, como esperado."
 tgp_east_asia_mandala_task_contract_events.1600.desc:0 "\"[ROOT.Char.GetTitleAsNameNoTooltip], ó [ROOT.Char.GetTitleAsNameNoTooltip] divin[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )],\" grita o fazendeiro, prostrando [Select_CString( local_character.IsFemale, 'a si mesma', 'a si mesmo' )]. \"Uma antiga estátua no meu campo começou a chorar leite!\" Eu olho — uma grande cabeça de pedra coberta por panos e flores, o rosto riscado de branco.\n\n\"Os espíritos estão passando por ela! Por favor, unja este recém-nascido sobre ela para conquistar seu favor!\" [local_character.GetSheHe] implora."
 tgp_east_asia_mandala_task_contract_events.1600.t:0 "$mandala_ritual_prefix$ Estátua Chorona"
 tgp_east_asia_mandala_task_contract_events.1700.a:0 "Vocês precisam de mais que isso... Mandem buscar arroz da capital."
 tgp_east_asia_mandala_task_contract_events.1700.b:0 "Andarei descalço com a terra, faça chuva ou sol."
 tgp_east_asia_mandala_task_contract_events.1700.c:0 "Beijarei a terra, mas nada além disso."
 tgp_east_asia_mandala_task_contract_events.1700.desc:0 "\"Oh, por que nos abandonaste, [ROOT.Char.GetTitleAsNameNoTooltip]?\" diz [Select_CString( local_character.IsFemale, 'a', 'o' )] chefe, com a voz carregada de desespero. \"Nossas mudas estão sendo sufocadas por [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type_plural')] — nenhum campo foi poupado!\"\n\n\"Sem grãos, morreremos de fome... você deve andar descalço pelos campos, para dizer à terra o que deve crescer nela.\""
 tgp_east_asia_mandala_task_contract_events.1700.t:0 "$mandala_ritual_prefix$ Flores Brotam"
 tgp_east_asia_mandala_task_contract_events.1800.a:0 "Junte-se a mim no rio, [local_character_2.GetFirstNameNoTooltip]."
 tgp_east_asia_mandala_task_contract_events.1800.b:0 "Basta lançar arroz na água."
 tgp_east_asia_mandala_task_contract_events.1800.c:0 "Todos esses peixes... vocês não estão pagando tributo suficiente."
 tgp_east_asia_mandala_task_contract_events.1800.desc:0 "Um grupo de [local_character.GetWomenMen] pescador[Select_CString( local_character.IsFemale, 'as', 'es' )] está à beira do rio, cestos cheios da pesca do dia. \"Grande [ROOT.Char.GetTitleAsNameNoTooltip]! O rio está repleto de [ROOT.Char.Custom('GetRegionalFish')], mas nossos anciãos dizem que estará estéril no próximo ano!\" diz [Select_CString( local_character.IsFemale, 'uma das', 'um dos' )] [local_character.GetWomenMen].\n\n\"Esta noite haverá uma lua cheia rara. Precisamos que você abençoe as águas com fertilidade divina — [local_character_2.GetFirstName] ofereceu [Select_CString( local_character_2.IsFemale, 'a si emsma', 'a si mesmo' )] para se juntar a você no ritual.\""
 tgp_east_asia_mandala_task_contract_events.1800.t:0 "$mandala_ritual_prefix$ Ritual do Rio"
 tgp_east_asia_mandala_task_contract_events.1900.a:0 "Eu farei isso — amarrem-me!"
 tgp_east_asia_mandala_task_contract_events.1900.b:0 "Eu semeio; [entourage_character.GetFirstNameNoTooltip] puxa o arado..."
 tgp_east_asia_mandala_task_contract_events.1900.c:0 "Plantarei apenas uma semente."
 tgp_east_asia_mandala_task_contract_events.1900.desc:0 "\"Este é o sétimo arado a quebrar esta semana, [ROOT.Char.GetTitleAsNameNoTooltip],\" diz [Select_CString( local_character.IsFemale, 'a', 'o' )] chefe, gesticulando com raiva em direção aos campos. \"Um espírito da terra invejoso está quebrando-os, sem dúvida alguma!\"\n\n\"Para quebrar a maldição, você — em sua radiante divindade — deve arrastar o arado por cada campo e semear o primeiro sulco!\""
 tgp_east_asia_mandala_task_contract_events.1900.t:0 "$mandala_ritual_prefix$ Campos Amaldiçoados"
 tgp_east_asia_mandala_task_contract_events.2000.a.female:0 "Eu a ajudarei a plantar sementes a partir da capital..."
 tgp_east_asia_mandala_task_contract_events.2000.a:0 "Você terá sementes da capital — e de mim!"
 tgp_east_asia_mandala_task_contract_events.2000.b:0 "Então deitemo-nos juntos."
 tgp_east_asia_mandala_task_contract_events.2000.c:0 "Ungir vocês com carvão já basta."
 tgp_east_asia_mandala_task_contract_events.2000.desc:0 "\"Divino [ROOT.Char.GetTitleAsNameNoTooltip], um raio atingiu nossa árvore sagrada, queimando o bosque...\" diz [Select_CString( local_character.IsFemale, 'a', 'o' )] [local_character.GetWomanMan], apontando para os restos carbonizados. \"Tememos que não vá brotar de novo — os [ROOT.Char.Custom('GetRandomRegionalSmallGamePlural')] e os [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')] desapareceram.\n\n\"Debaixo da árvore chamuscada é onde devemos nos unir. Se nossa união dar fruto, o bosque também dará. Deixem que o carvão nos unja, até que não possamos ser distinguidos do céu noturno!\""
 tgp_east_asia_mandala_task_contract_events.2000.t:0 "$mandala_ritual_prefix$ Bosque Ressequido"
 tgp_east_asia_mandala_task_contract_events.2100.a:0 "Um porco? Não — providenciarei cinquenta!"
 tgp_east_asia_mandala_task_contract_events.2100.b:0 "O porco será sacrificado, e o juramento selado."
 tgp_east_asia_mandala_task_contract_events.2100.c:0 "Terão um juramento de misericórdia em vez disso."
 tgp_east_asia_mandala_task_contract_events.2100.desc:0 "\"Grande e poderos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip], buscamos sua bênção.\" [Select_CString( local_character.IsFemale, 'A', 'O' )] [local_character.GetWomanMan] aponta para um chiqueiro. \"Vamos saquear nossos inimigos em [vengeance_target.GetNameNoTier] — mas não antes de você fazer um sacrifício.\n\n\"Leve este porco preto ao [ritual_location.Custom('TerrainTypeProvince')] e derrame seu sangue sobre a pedra do juramento. Só então nosso voto de vingança será selado!\""
 tgp_east_asia_mandala_task_contract_events.2100.t:0 "$mandala_ritual_prefix$ Juramento do Abate"
 tgp_east_asia_mandala_task_contract_events.2200.a:0 "Meu próprio sangue agradará os espíritos."
 tgp_east_asia_mandala_task_contract_events.2200.b:0 "O seu sacrifício curará a terra."
 tgp_east_asia_mandala_task_contract_events.2200.c:0 "Um porco será suficiente."
 tgp_east_asia_mandala_task_contract_events.2200.desc:0 "Ao nos aproximarmos de [ritual_location.GetName], um grupo de dez agricultores se aproxima. \"Poderos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip],\" diz o líder, com a voz firme. \"Nossos campos estão estéreis — amaldiçoados por espíritos da terra que exigem sacrifício.\"\n\n[local_character.GetSheHe|U] ajoelha-se na terra e aponta para minha espada. \"Punisca-nos. Derrame nosso sangue sobre o solo. Os espíritos serão alimentados — e assim também nossas famílias.\""
 tgp_east_asia_mandala_task_contract_events.2200.t:0 "$mandala_ritual_prefix$ Ira Ritual"
 tgp_east_asia_mandala_task_contract_events.2300.a.failure:0 "[local_character_3.GetFirstName] nos elude"
 tgp_east_asia_mandala_task_contract_events.2300.a.success:0 "[local_character_3.GetFirstName] é [Select_CString( local_character_3.IsFemale, 'capturada e morta', 'capturado e morto' )]"
 tgp_east_asia_mandala_task_contract_events.2300.a:0 "Vamos rastrear [local_character_3.GetFirstName] em vez disso."
 tgp_east_asia_mandala_task_contract_events.2300.b:0 "O crime [local_character_3.GetHerHim], a punição [local_character_3.GetHerHim]. Assim será."
 tgp_east_asia_mandala_task_contract_events.2300.c:0 "Deixe-me ungir o arroz novamente."
 tgp_east_asia_mandala_task_contract_events.2300.desc:0 "Uma multidão de aldeões cerca um[Select_CString( local_character_2.IsFemale, 'a', '' )] [local_character_2.GetWomanMan] solitári[Select_CString( local_character_2.IsFemale, 'a', 'o' )] e seu filho quando chegamos a [ritual_location.GetName]. \"Grande [ROOT.Char.GetTitleAsNameNoTooltip],\" grita [Select_CString( local_character.IsFemale, 'a', 'o' )] chefe. \"[local_character_3.GetFirstName] — um ladrão desta aldeia — roubou nosso arroz sagrado e fugiu para o [ritual_location.Custom('TerrainTypeProvince')]!\"\n\n[local_character.GetSheHe|U] aponta para [Select_CString( local_character_2.IsFemale, 'a', 'o' )] [local_character_2.GetWomanMan]. \"Se [local_character_3.GetSheHe] não sofrer punição, então a família [local_character_3.GetHerHim] deve. Apliquem sobre eles a justiça divina!\""
 tgp_east_asia_mandala_task_contract_events.2300.t:0 "$mandala_ritual_prefix$ Punição Coletiva"
 tgp_east_asia_mandala_task_contract_events.2400.a:0 "Vamos caçar falsos curandeiros em todo [ritual_location.GetNameNoTooltip]."
 tgp_east_asia_mandala_task_contract_events.2400.b:0 "Eu queimarei a cabana, com o portador de espíritos dentro."
 tgp_east_asia_mandala_task_contract_events.2400.c:0 "O portador de espíritos vem comigo."
 tgp_east_asia_mandala_task_contract_events.2400.desc:0 "\"Perdoe nosso estado, poderos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip],\" diz um[Select_CString( local_character.IsFemale, 'a', '' )] [local_character.GetWomanMan] de aparência doente, tossindo na própria mão. \"Estamos todos doentes — todos menos [Select_CString( local_character_2.IsFemale, 'a', 'o' )] [local_character_2.GetWomanMan] #EMP que finge#! nos tratar.\"\n\n\"[local_character_2.GetSheHe|U] deve estar abrigando espíritos malignos!\" [local_character.GetSheHe] escarra. \"Queimem a cabana do portador de espíritos — isso os afugentará!\""
 tgp_east_asia_mandala_task_contract_events.2400.t:0 "$mandala_ritual_prefix$ Espíritos Doentes"
 tgp_east_asia_mandala_task_contract_events.2500.a:0 "Eles aprenderão a servir — com sangue."
 tgp_east_asia_mandala_task_contract_events.2500.b:0 "Cada um deles terá minha palavra — ou meu açoite."
 tgp_east_asia_mandala_task_contract_events.2500.c:0 "Um simples discurso será suficiente."
 tgp_east_asia_mandala_task_contract_events.2500.desc:0 "\"Eles duvidam da sua divindade, [ROOT.Char.GetTitleAsNameNoTooltip],\" diz o ancião, a voz pesada. \"Os guerreiros passam os dias bebendo — as estradas estão inseguras e a bandidagem prolifera...\" [local_character.GetSheHe|U] aponta para a taverna próxima.\n\n\"Você deve discipliná-los. Use sua presença divina — e sua espada divina — para amedrontá-los e colocá-los em ordem!\""
 tgp_east_asia_mandala_task_contract_events.2500.t:0 "$mandala_ritual_prefix$ Lanças Embotadas"
 tgp_east_asia_mandala_task_contract_events.2600.a:0 "Não deixarei ninguém vivo. O sangue irá encharcar o chão."
 tgp_east_asia_mandala_task_contract_events.2600.b:0 "Queimarei seus celeiros."
 tgp_east_asia_mandala_task_contract_events.2600.c:0 "Eles só precisam de uma palavra de reafirmação."
 tgp_east_asia_mandala_task_contract_events.2600.desc:0 "Ao nos aproximarmos de [ritual_location.GetName], somos recebidos pela zombaria: uma efígie minha pendurada de cabeça para baixo, coberta de cinzas e estrume. Aldeões dançam ao redor, cantando canções sobre minha fraqueza, uivando como cães selvagens.\n\nEles não me temem.\nEles imploram por ira."
 tgp_east_asia_mandala_task_contract_events.2600.t:0 "$mandala_ritual_prefix$ Aldeia Desafiante"
 tgp_east_asia_mandala_task_contract_events.2700.a:0 "Recolherei sangue, não moedas. O recrutamento será atendido."
 tgp_east_asia_mandala_task_contract_events.2700.b:0 "A moeda de sangue será colecionada."
 tgp_east_asia_mandala_task_contract_events.2700.c:0 "Minha presença já será suficiente."
 tgp_east_asia_mandala_task_contract_events.2700.desc:0 "Ao nos aproximarmos de [ritual_location.GetName], um oficial nos cumprimenta. \"[ROOT.Char.GetTitleAsNameNoTooltip], esta vila recusou-se a responder ao recrutamento,\" diz [local_character.GetSheHe], lançando um olhar ao pergaminho. \"A punição deles é pagar moeda de sangue — e você deve exigí-la.\"\n\n\"Eles não vão me ouvir, mas vão acatar sua palavra divina. Faça-os pagar o que devem.\" [local_character.GetSheHe|U] faz uma vênia."
 tgp_east_asia_mandala_task_contract_events.2700.t:0 "$mandala_ritual_prefix$ Imposto de Sangue"
 tgp_east_asia_mandala_task_contract_events.2800.a:0 "Farei um exemplo sangrento desta aldeia."
 tgp_east_asia_mandala_task_contract_events.2800.b:0 "Entreguem as lanças [Select_CString( ROOT.Char.IsFemale, 'a sua', 'ao seu' )] [ROOT.Char.GetTitleAsNameNoTooltip]."
 tgp_east_asia_mandala_task_contract_events.2800.c:0 "Um esforço louvável."
 tgp_east_asia_mandala_task_contract_events.2800.desc:0 "Ao cavalgar em direção a [ritual_location.GetName], lanças de bambu afiadas enfileiram as aldeias como um arsenAL improvisado. \"Oh, [ROOT.Char.GetTitleAsNameNoTooltip], estamos apenas afiando essas varas para nos defendermos contra... [ROOT.Char.Custom('RegionalOnlyFerociousAnimalPlural')], certo\", diz [Select_CString( local_character.IsFemale, 'uma das', 'um dos' )] [local_character.GetWomenMen], com tom pouco convincente.\n\n\"Nunca as usaríamos para outra coisa — não — não duvidamos da sua #EMP divindade#! ou qualquer coisa do tipo...\""
 tgp_east_asia_mandala_task_contract_events.2800.t:0 "$mandala_ritual_prefix$ Rebeldes do Bambu"
 tgp_east_asia_mandala_task_contract_events.2900.a:0 "Meu sangue divino os saciará."
 tgp_east_asia_mandala_task_contract_events.2900.b:0 "Cinco dos meus cavalos serão suficientes."
 tgp_east_asia_mandala_task_contract_events.2900.c:0 "Traga um porco da vila."
 tgp_east_asia_mandala_task_contract_events.2900.desc:0 "\"Grande [ROOT.Char.GetTitleAsNameNoTooltip], as estradas não são seguras em [ritual_location.GetName],\" diz o ancião local. \"Viajantes são atacados, caravanas saqueadas — não há fim.\"\n\n\"Os espíritos da estrada devem estar irados.\" [local_character.GetSheHe|U] ergue uma adaga. \"Eles precisam ser alimentados, com sangue, até que a violência pare.\""
 tgp_east_asia_mandala_task_contract_events.2900.t:0 "$mandala_ritual_prefix$ Sacrifício na Estrada"
 tgp_east_asia_mandala_task_contract_events.3000.a:0 "Através de sangue e fogo, eles me adorarão."
 tgp_east_asia_mandala_task_contract_events.3000.b:0 "Esses camponeses servirão de exemplo."
 tgp_east_asia_mandala_task_contract_events.3000.c:0 "Muito bem. Vamos participar das festividades."
 tgp_east_asia_mandala_task_contract_events.3000.desc:0 "Em [ritual_location.GetName], aldeões dançam em volta de um grande boneco — um que não é o meu. #EMP \"[ritual_location.GetCounty.GetFaith.WarGodName]! [ritual_location.GetCounty.GetFaith.WarGodName]! [ritual_location.GetCounty.GetFaith.WarGodName]!\"#! eles gritam. Meu nome nunca é pronunciado.\n\nUm camponês se aproxima, sorrindo. \"Venha celebrar [ritual_location.GetCounty.GetFaith.WarGodName]!\" [local_character.GetSheHe] diz.\n\n#bold Mas eu sou [ritual_location.GetCounty.GetFaith.WarGodName].\nE espera-se que eu os puna.#!"
 tgp_east_asia_mandala_task_contract_events.3000.t:0 "$mandala_ritual_prefix$ Festival do Deus da Guerra"
 tgp_east_asia_mandala_task_contract_events.3100.a.failure:0 "A situação se agrava"
 tgp_east_asia_mandala_task_contract_events.3100.a.success:0 "Você encontra um compromisso com sucesso"
 tgp_east_asia_mandala_task_contract_events.3100.a:0 "Agora pronuncio meu julgamento divino."
 tgp_east_asia_mandala_task_contract_events.3100.b:0 "Novos santuários serão erguidos para ambos os lados."
 tgp_east_asia_mandala_task_contract_events.3100.c:0 "Vocês terão que compartilhar a terra."
 tgp_east_asia_mandala_task_contract_events.3100.desc:0 "\"[ritual_location.GetName] é legitimamente nossa, s[Select_CString( local_character.IsFemale, 'ua', 'eu' )] [local_character_2.Custom2('InsultNoun', local_character)] ímpi[Select_CString( local_character.IsFemale, 'a', 'o' )]!\" grita um [GetTrait('devoted').GetName( local_character )|l], sua voz afiada como um sino. \"Que [local_character_2.GetFaith.WarGodName] arrase você e seu mosteiro da face da terra!\" O outro retruca, inabalável.\n\nO ar crepita de fúria — mas minha presença o acalma. Agora, eles aguardam meu veredito."
 tgp_east_asia_mandala_task_contract_events.3100.t:0 "$mandala_ritual_prefix$ Monges em Conflito"
 tgp_east_asia_mandala_task_contract_events.3200.a:0 "Juro que haverá paz."
 tgp_east_asia_mandala_task_contract_events.3200.b:0 "A procissão será conduzida."
 tgp_east_asia_mandala_task_contract_events.3200.c:0 "Cantar para os espíritos será o suficiente."
 tgp_east_asia_mandala_task_contract_events.3200.desc:0 "\"Paz e graça, [ROOT.Char.GetTitleAsNameNoTooltip], um de nossos campos já foi um campo de batalha,\" diz o ancião, com a expressão tomada pela preocupação. \"Os espíritos foram perturbados pelo derramamento de sangue — agora assombram nossos sonhos.\"\n\n\"Você deve purificar o campo com uma procissão descalça — e abandonar suas armas, ainda que por um tempo. Deixe que a terra esqueça o peso do aço, e os espíritos voltarão a dormir.\""
 tgp_east_asia_mandala_task_contract_events.3200.t:0 "$mandala_ritual_prefix$ Purificar Campo de Batalha"
 tgp_east_asia_mandala_task_contract_events.3300.a:0 "Tecerei uma imagem de ouro e seda de [ROOT.Char.GetFaith.WealthGodName]."
 tgp_east_asia_mandala_task_contract_events.3300.b:0 "Uma imagem de [ROOT.Char.GetFaith.HealthGodName] adornada com prata é apropriada."
 tgp_east_asia_mandala_task_contract_events.3300.c:0 "Uma simples tapeçaria retratando [ROOT.Char.GetFaith.DivineRealm] será suficiente."
 tgp_east_asia_mandala_task_contract_events.3300.desc:0 "Ao chegarmos em [ritual_location.GetName], um dos muitos tecelões se curva diante de mim. \"Nossos teares retratam o divino — [ROOT.Char.GetFaith.WealthGodName], [ROOT.Char.GetFaith.HealthGodName], e agora você, [ROOT.Char.GetTitleAsNameNoTooltip].\" [local_character.GetSheHe|U] diz, desenrolando um conjunto de vibrantes tapeçarias.\n\n\"Abençoe nosso ofício com prosperidade e nossa aldeia com paz. Teça algo com suas próprias mãos — um símbolo para venerarmos.\""
 tgp_east_asia_mandala_task_contract_events.3300.t:0 "$mandala_ritual_prefix$ Abençoar os Tecelões"
 tgp_east_asia_mandala_task_contract_events.3400.a:0 "Quebrarei até minha própria lança — a paz reinará."
 tgp_east_asia_mandala_task_contract_events.3400.b:0 "As lanças serão quebradas."
 tgp_east_asia_mandala_task_contract_events.3400.c:0 "Quebrar uma lança é o suficiente."
 tgp_east_asia_mandala_task_contract_events.3400.desc:0 "\"[ROOT.Char.GetTitleAsNameNoTooltip] Misericordios[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], hoje é um dia de alegria!\" diz [Select_CString( local_character.IsFemale, 'a', 'o' )] líder, radiante. \"Uma antiga rixa chegou ao fim — nossos filhos não mais morrerão em vão!\"\n\n\"Agora pedimos apenas por paz. Pegue nossas lanças e quebre-as sobre o fogo, para que os espíritos confiem em nossas intenções.\""
 tgp_east_asia_mandala_task_contract_events.3400.t:0 "$mandala_ritual_prefix$ Quebra das Lanças"
 tgp_east_asia_mandala_task_contract_events.3500.a:0 "Eles conhecerão a serenidade — e você caminhará ao meu lado."
 tgp_east_asia_mandala_task_contract_events.3500.b:0 "Tenho muito a aprender, quer se juntar a mim?"
 tgp_east_asia_mandala_task_contract_events.3500.c:0 "As lanças deles servem à minha divindade."
 tgp_east_asia_mandala_task_contract_events.3500.desc:0 "\"[ROOT.Char.GetTitleAsNameNoTooltip] Exaltad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], eu sou [Select_CString( local_character.IsFemale, 'a', 'o' )] guru [local_character.GetFirstName] — guio o povo de [ritual_location.GetName],\" diz o(a) [GetTrait('devoted').GetName( local_character )|l], com a voz firme e convicta. \"Chamei você aqui porque estas terras precisam de mãos para trabalhar a terra, não para empunhar lanças.\"\n\n\"Que os filhos dos fazendeiros lavrem os campos de seus pais — que uma geração cresça conhecendo a verdadeira serenidade.\""
 tgp_east_asia_mandala_task_contract_events.3500.t:0 "$mandala_ritual_prefix$ A Paz do Guru"
 tgp_east_asia_mandala_task_contract_events.3600.a:0 "...que as armas são proibidas."
 tgp_east_asia_mandala_task_contract_events.3600.b:0 "...que as disputas devem ser resolvidas com palavras."
 tgp_east_asia_mandala_task_contract_events.3600.c:0 "...que eu sou bom e grandioso."
 tgp_east_asia_mandala_task_contract_events.3600.desc:0 "\"Grande [ROOT.Char.GetTitleAsNameNoTooltip], em [ritual_location.GetName], as disputas são resolvidas com lança e fogo — não com palavras\", diz o ancião, colocando uma grande tábua de pedra junto com ferramentas de inscrição. \"Sua palavra é lei divina. Grave a paz na pedra e ponha fim à violência.\"\n\nEu pego as ferramentas. Irei inscrever..."
 tgp_east_asia_mandala_task_contract_events.3600.t:0 "$mandala_ritual_prefix$ Édito de Reconciliação"
 tgp_east_asia_mandala_task_contract_events.3700.a:0 "Suportarei isso como um Bodhisattva."
 tgp_east_asia_mandala_task_contract_events.3700.b:0 "Seguirei o caminho, ainda que precise descansar."
 tgp_east_asia_mandala_task_contract_events.3700.c:0 "Vai ser mais rápido a cavalo..."
 tgp_east_asia_mandala_task_contract_events.3700.desc:0 "\"[ritual_location.GetName] está cheia de vilas — e cheia de fadiga, rivalidade e vício\", diz o ancião, girando lentamente enquanto [local_character.GetSheHe] gesticula em um amplo círculo. \"Oito delas cercam este [ritual_location.Custom('GetRandomRegionalDangerSingular')], cada uma em uma direção diferente.\"\n\n\"Para ensiná-las o [Glossary('Eightfold Path', 'EIGHTFOLD_PATH_GLOSS')], você deve percorrê-lo pessoalmente — oito vilas, oito fardos — sem descanso ou conforto. Só então elas entenderão o que significa o verdadeiro esforço virtuoso.\""
 tgp_east_asia_mandala_task_contract_events.3700.t:0 "$mandala_ritual_prefix$ Caminho Óctuplo"
 tgp_east_asia_mandala_task_contract_events.3800.a:0 "Meus homens-armados irão guardar os bosques."
 tgp_east_asia_mandala_task_contract_events.3800.b:0 "A guarnição de [county_scope.GetNameNoTooltip] protegerá as terras."
 tgp_east_asia_mandala_task_contract_events.3800.c:0 "Uma bênção limpará a corrupção."
 tgp_east_asia_mandala_task_contract_events.3800.desc:0 "\"Nossos sagrados bosques de [ritual_location.Custom('GetRandomRegionalWood')] foram corrompidos, [ROOT.Char.GetTitleAsNameNoTooltip],\" dizem os habitantes da floresta, gesticulando para uma clareira. \"Tornaram-se um refúgio para caçadores, ladrões e madeireiros. Por favor — envie seus soldados para corrigir essa injustiça e deixe a terra prosperar novamente.\""
 tgp_east_asia_mandala_task_contract_events.3800.t:0 "$mandala_ritual_prefix$ Bosque Sagrado Ameaçado"
 tgp_east_asia_mandala_task_contract_events.3900.a:0 "Deixemos que três luas passem em silêncio, e a serenidade seguirá."
 tgp_east_asia_mandala_task_contract_events.3900.b:0 "Uma semana de silêncio acalmará a agitação."
 tgp_east_asia_mandala_task_contract_events.3900.c:0 "Um passeio pela vila deve acalmar todos."
 tgp_east_asia_mandala_task_contract_events.3900.desc:0 "Antes mesmo de vislumbrarmos [ritual_location.GetName], ouvimos: gritos, discussões, barulho constante. Este não é um lugar sereno.\n\n\"Grande [ROOT.Char.GetTitleAsNameNoTooltip], se você permanecer em silêncio, eles também o farão — se você estiver em paz, assim estarão eles,\" implora o ancião. \"Prove sua divindade e nos livre dessa discórdia.\""
 tgp_east_asia_mandala_task_contract_events.3900.t:0 "$mandala_ritual_prefix$ Voto de Quietude"
 tgp_east_asia_mandala_task_contract_events.4000.a:0 "Ordenarei que meu exército deite suas armas."
 tgp_east_asia_mandala_task_contract_events.4000.b:0 "Meu [sacrificial_regiment.GetNameNoTooltip] entregará suas armas."
 tgp_east_asia_mandala_task_contract_events.4000.c:0 "Enterrarei uma de minhas espadas sob a terra."
 tgp_east_asia_mandala_task_contract_events.4000.desc:0 "\"[ROOT.Char.GetTitleAsNameNoTooltip] Seren[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], somos os [Glossary('Śilpakāras', 'SILPAKARAS_GLOSS')] de [ritual_location.GetName],\" dizem [Select_CString( local_character.IsFemale, 'as', 'os' )] [local_character.GetWomenMen], inclinando-se enquanto levantam seus martelos de construção. \"Desejamos erguer uma estrutura no espírito de paz e prosperidade.\"\n\n\"Mas antes de começarmos, pedimos que você enterre seus [Glossary('pedangs', 'PEDANG_GLOSS')] sob a fundação — para expulsar espíritos violentos e consagrar o terreno.\""
 tgp_east_asia_mandala_task_contract_events.4000.t:0 "$mandala_ritual_prefix$ Colocação de Pedra"
 tgp_east_asia_mandala_task_contract_events.4100.a:0 "Você acha que pode enganar [ROOT.Char.GetTitleAsNameNoTooltip]? Nunca!"
 tgp_east_asia_mandala_task_contract_events.4100.b:0 "[local_character.GetSheHe|U] deve me ensinar!"
 tgp_east_asia_mandala_task_contract_events.4100.c:0 "[local_character.GetSheHe|U] é uma encarnação da minha vontade."
 tgp_east_asia_mandala_task_contract_events.4100.desc:0 "Um riso alto nos recebe ao chegarmos em [ritual_location.GetName]. Uma multidão cercou um [GetTrait('devoted').GetName( local_character )|l] rechonchudo, seus rostos iluminados pela expectativa. \"...e agora, vejam o [GetTrait('arrogant').GetName( local_character_2 )|l] [local_character_2.Custom('dummy_peasant_profession')] saindo de sua casa,\" diz o asceta, com voz baixa e brincalhona.\n\nNesse momento, um barril tomba da porta — encharcando [Select_CString( local_character_2.IsFemale, 'a', 'o' )] [local_character_2.GetWomanMan] com um estrondoso splash. \"Seu ego foi completamente lavado!\" exclama o [GetTrait('devoted').GetName( local_character )|l], segurando a barriga de tanto rir. Os habitantes explodem em gargalhadas — até a vítima encharcada ri junto."
 tgp_east_asia_mandala_task_contract_events.4100.t:0 "$mandala_ritual_prefix$ Asceta Risonho"
 tgp_east_asia_mandala_task_contract_events.4200.a:0 "Construirei um grande ídolo de [local_character.Custom('RegionalRootVegetable')] para intimidá-los."
 tgp_east_asia_mandala_task_contract_events.4200.b:0 "Um ídolo multifacetado de mim mesmo os banirá."
 tgp_east_asia_mandala_task_contract_events.4200.c:0 "Um boneco de [ROOT.Char.GetFaith.HealthGodName] os acalmará."
 tgp_east_asia_mandala_task_contract_events.4200.desc:0 "\"[ROOT.Char.GetTitleAsNameNoTooltip], os espíritos estão amaldiçoando nossos [local_character.Custom('RegionalRootVegetablePlural')], deixando apenas podridão para trás,\" diz [Select_CString( local_character.IsFemale, 'a', 'o' )] chefe, apontando para uma pilha de madeira e [ritual_location.Custom('GetRandomImprovisedBridgeMaterial')]. \"Você deve construir um ídolo para enganar os espíritos — para acalmá-los ou atraí-los para longe.\""
 tgp_east_asia_mandala_task_contract_events.4200.t:0 "$mandala_ritual_prefix$ Isca Espiritual"
 tgp_east_asia_mandala_task_contract_events.4300.a:0 "Movirei as peças com as mãos de [ROOT.Char.GetFaith.TricksterGodNamePossessive]."
 tgp_east_asia_mandala_task_contract_events.4300.b:0 "Minha habilidade me guiará à vitória."
 tgp_east_asia_mandala_task_contract_events.4300.c:0 "Apenas um jogo amigável, nada mais."
 tgp_east_asia_mandala_task_contract_events.4300.desc:0 "Ao nos aproximarmos do(a) [ritual_location.GetHolding.GetType.GetName] em [ritual_location.GetName], sou recebid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por [local_character.GetTitledFirstNameNicknamed]. \"Grande e astut[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip], exijo de você um jogo de [local_character.Custom('BG_GameType_Generic')],\" diz [local_character.GetSheHe], erguendo uma peça esculpida. \"Vença, e terá meu respeito. Vença por meio da #EMP enganação#! — e terá minha lealdade eterna.\"\n\nServos entram com [local_character.Custom('GetExpensiveMeal')] e [local_character.Custom('GetExpensiveDrink_Singular')]. \"Mas se perder... bem, veremos.\""
 tgp_east_asia_mandala_task_contract_events.4300.t:0 "$mandala_ritual_prefix$ Jogo de Inteligência"
 tgp_east_asia_mandala_task_contract_events.4400.a:0 "Chega de furtos — você falará com minha voz em [ritual_location.GetNameNoTooltip]."
 tgp_east_asia_mandala_task_contract_events.4400.b:0 "Você é útil. Voltará comigo."
 tgp_east_asia_mandala_task_contract_events.4400.c:0 "Devolva tudo o que roubou."
 tgp_east_asia_mandala_task_contract_events.4400.desc:0 "\"Exijo seu colar — é vital para meu ritual\", diz um[Select_CString( local_character.IsFemale, 'a', '' )] [local_character.GetWomanMan] que parece #EMP assustadoramente#! comigo, pairando sobre um(a) aldeão(ã) assustado(a). \"Apresse-se, não faça s[Select_CString( ROOT.Char.IsFemale, 'ua', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip] esperar!\"\n\n[local_character.GetSheHe|U] se vira — e congela ao me ver. \"Ó mais venerável [ROOT.Char.GetTitleAsNameNoTooltip]..! Eu estava apenas... cobrando tributo em seu nome!\" [local_character.GetSheHe] gagueja."
 tgp_east_asia_mandala_task_contract_events.4400.t:0 "$mandala_ritual_prefix$ Ladrão Divino"
 tgp_east_asia_mandala_task_contract_events.4500.a:0 "Reúna a aldeia — eu irei 'sacrificar' uma criança!"
 tgp_east_asia_mandala_task_contract_events.4500.b:0 "Usarei um bode treinado para desmaiar."
 tgp_east_asia_mandala_task_contract_events.4500.c:0 "Oferecerei frutas... e depois as comerei no jantar."
 tgp_east_asia_mandala_task_contract_events.4500.desc:0 "\"Grande [ROOT.Char.GetTitleAsNameNoTooltip], estamos sendo enganados por um(a) [ritual_location.Custom('GetProvinceTricksterSpirit')],\" gemeu o(a) ancião(ã), esfregando a testa. \"O poço está cheio de rãs, os bolos de arroz ficaram amargos da noite para o dia, um bando de [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')] assustou as crianças — e acordei com um(a) #EMP [local_character.Custom('RegionalPoxAnimal')]#! dormindo ao meu lado!\"\n\n[local_character.GetSheHe|U] se inclina, olhos inquietos. \"Você deve superar o espírito travesso... faça um sacrifício falso para confundi-lo!\""
 tgp_east_asia_mandala_task_contract_events.4500.t:0 "$mandala_ritual_prefix$ Provação do Espírito"
 tgp_east_asia_mandala_task_contract_events.4600.a:0 "Irei como um mendigo."
 tgp_east_asia_mandala_task_contract_events.4600.b:0 "Irei como um soldado."
 tgp_east_asia_mandala_task_contract_events.4600.c:0 "Irei como... eu mesmo(a)."
 tgp_east_asia_mandala_task_contract_events.4600.desc:0 "Ao chegarmos em [ritual_location.GetName], uma criança usando uma coroa improvisada corre na minha frente. \"Eu sou [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]! Contemplem minha divindade!\" [local_character_2.GetSheHe] grita. A aldeia está viva com um festival onde os papéis são invertidos: os pobres se vestem como nobres, servos agem como senhores e mestres carregam bandejas.\n\nSe eu me juntasse a eles disfarçado, despercebido, eles testemunhariam a verdadeira divindade."
 tgp_east_asia_mandala_task_contract_events.4600.t:0 "$mandala_ritual_prefix$ Festival da Inversão"
 tgp_east_asia_mandala_task_contract_events.4700.a:0 "Contanto que meu 'mensageiro' pague um dízimo..."
 tgp_east_asia_mandala_task_contract_events.4700.b:0 "Você e a cabra me acompanharão."
 tgp_east_asia_mandala_task_contract_events.4700.c:0 "...quatro, cinco! Cinco arranhões — penitência pública será!"
 tgp_east_asia_mandala_task_contract_events.4700.desc:0 "\"Venham todos — testemunhem a cabra divina através da qual [ROOT.Char.GetTitledFirstNameNoTooltip] fala!\" [Select_CString( local_character.IsFemale, 'A', 'O' )] [local_character.GetWomanMan] se curva teatralmente, e a cabra raspa o chão com o casco. \"...seis, sete, oito! Oito arranhões! É um sinal — todos devemos comprar [local_character_2.GetFirstNamePossessive] [local_character_2.Custom('GetExpensiveDrink_Singular')]!\"\n\n[local_character.GetSheHe|U] olha para cima e congela. \"Oh... divin[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]..! Eu — eu não o(a) vi ali...\"\n\nUm charlatão engenhoso. Com uma cabra treinada. Útil."
 tgp_east_asia_mandala_task_contract_events.4700.t:0 "$mandala_ritual_prefix$ Oráculo da Cabra"
 tgp_east_asia_mandala_task_contract_events.4800.a:0 "Nós as capturaremos; suas peles decorarão meu trono."
 tgp_east_asia_mandala_task_contract_events.4800.b:0 "Vamos expulsá-las, o [ritual_location.Custom('TerrainTypeProvince')] será nosso escudo."
 tgp_east_asia_mandala_task_contract_events.4800.c:0 "Não, elas são meus mensageiros."
 tgp_east_asia_mandala_task_contract_events.4800.desc:0 "Ao passarmos por [ritual_location.GetName], sinto olhos invisíveis nos observando desde os [ritual_location.Custom('TerrainTypeProvince')]. \"[ROOT.Char.GetTitleAsNameNoTooltip] Astut[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], fique quiet[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )],\" sussurra um camponês. \"[ROOT.Char.Custom('RegionalOnlyFerociousAnimalPlural')|U] — e outras bestas — estão por toda parte. Atraia-as, capture-as — imploramos, faça algo.\""
 tgp_east_asia_mandala_task_contract_events.4800.t:0 "$mandala_ritual_prefix$ Bestas no [ritual_location.Custom('TerrainTypeProvince')|U]"
 tgp_east_asia_mandala_task_contract_events.4900.a:0 "[entourage_character.GetFirstNameNoTooltip], pegue esta carne — devemos capturá-lo!"
 tgp_east_asia_mandala_task_contract_events.4900.b:0 "Atirem flechas nele, não podemos deixá-lo viver."
 tgp_east_asia_mandala_task_contract_events.4900.c:0 "Ele me serve, mantenham-se afastados dos rios."
 tgp_east_asia_mandala_task_contract_events.4900.desc:0 "\"Sábi[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip], um [Glossary('nāga', 'NAGA_GLOSS')] vingativo espreita nos rios de [ritual_location.GetName],\" implora um[Select_CString( local_character.IsFemale, 'a', '' )] [local_character.GetWomanMan] trêmul[Select_CString( local_character.IsFemale, 'a', 'o' )]. \"Dez camponeses desapareceram — arrastados para as águas. Você deve afastá-lo antes que faça mais vítimas!\"\n\nCavalgamos pela margem do rio, o ar espesso com névoa e medo. Então — movimento nos juncos. Não é um nāga, mas um crocodilo monstruoso, vasto e antigo, um deus-rio em seu templo."
 tgp_east_asia_mandala_task_contract_events.4900.t:0 "$mandala_ritual_prefix$ Nāga do Rio"
 tgp_east_asia_mandala_task_contract_events.5000.a:0 "Sou [local_character.GetFaith.TricksterGodName], seu lar está em [ruler_capital_county.GetNameNoTooltip]."
 tgp_east_asia_mandala_task_contract_events.5000.b:0 "Sou um Devaraja, e [ritual_location.GetNameNoTooltip] é sua terra prometida."
 tgp_east_asia_mandala_task_contract_events.5000.c:0 "Sou um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip], e desejo sorte em sua busca."
 tgp_east_asia_mandala_task_contract_events.5000.desc:0 "Após cavalgar pelos [ritual_location.Custom('TerrainTypeProvince')] de [ritual_location.GetName], finalmente avistamos os peregrinos — fracos, exaustos, e contando centenas.\n\nO líder se ergue, voz trêmula de cansaço: \"Somos peregrinos [local_character.GetFaith.GetAdjective], buscando nossa terra prometida. Você veio nos conduzir? É um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] — ou talvez um deus?\""
 tgp_east_asia_mandala_task_contract_events.5000.t:0 "$mandala_ritual_prefix$ Terra Prometida"
 unable_to_declare_war_tt:0 "@alert_icon! #alert_trial Você jura não declarar nenhuma guerra por 5 anos!#!"
 upset_monks_modifier:0 "Monges Irritados"
 upset_monks_modifier_desc:0 "Os mosteiros neste condado estão discutindo e brigando."
 upset_peasants_modifier:0 "Camponeses Irritados"
 upset_peasants_modifier_desc:0 "Por um motivo ou outro, os camponeses deste condado estão indisciplinados."
 vegetable_idol_modifier:0 "Ídolo Espiritual Vegetal"
 vegetable_idol_modifier_desc:0 "Um ídolo construído por um Devaraja é amplamente acreditado trazer colheitas prósperas."
 walked_the_eightfold_path_modifier:0 "Percorreu o Caminho Óctuplo"
 walked_the_eightfold_path_modifier_desc:0 "Este Devaraja demonstrou as virtudes do [Glossary('Caminho Óctuplo', 'EIGHTFOLD_PATH_GLOSS')] ao caminhar por oito vilas sem descansar."
 wealthgod_symbol_modifier:0 "Guildas de Tecelagem Prósperas"
 wealthgod_symbol_modifier_desc:0 "Os tecelões desta província criam belas imagens de deuses que representam prosperidade e riqueza."
 weapon_ban_modifier:0 "Inscrição de Proibição de Armas"
 weapon_ban_modifier_desc:0 "Nenhuma arma é permitida por decreto do Devaraja."
 well_armed_peasants_modifier:0 "Camponeses Bem-Armados"
 well_armed_peasants_modifier_desc:0 "Os camponeses deste condado têm permissão para manter grandes quantidades de lanças."
 well_protected_groves_modifier:0 "Bosques Bem Protegidos"
 well_protected_groves_modifier_desc:0 "Os bosques desta província estão bem protegidos."
