 mandala_realm_contract_0039_contract:0 "Bestas na Escuridão"
 mandala_realm_contract_0039_desc:0 "A população de [TaskContract.GetLocation.GetNameNoTooltip] é atormentada por bestas que rondam os [TaskContract.GetLocation.Custom('TerrainTypeProvince')]. Eles pedem que você as capture — ou as engane."
