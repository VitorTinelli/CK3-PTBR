 mandala_realm_contract_0009_desc:0 "Um rio em [TaskContract.GetLocation.GetNameNoTooltip] é a fonte de vida dos habitantes locais. Os pescadores pedem que você realize um ritual de fertilidade para mantê-lo repleto de peixes."
