 mandala_realm_contract_0012_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão com base no seu [mandala_aspect|E]"
 mandala_realm_contract_0013_contract:0 "Ira Ritual"
 mandala_realm_contract_0013_desc:0 "Um ano de fracasso nas colheitas deixou uma aldeia em [TaskContract.GetLocation.GetNameNoTooltip] implorando por punição — voluntários suplicam para serem feridos para apaziguar os espíritos."
 mandala_realm_contract_0013_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0013_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão com base no seu [mandala_aspect|E]"
 mandala_realm_contract_0014_contract:0 "Punição Coletiva"
 mandala_realm_contract_0014_desc:0 "Um ladrão em [TaskContract.GetLocation.GetNameNoTooltip] roubou arroz sagrado e fugiu. Os aldeões querem a família dele punida em seu lugar."
 mandala_realm_contract_0014_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0014_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão com base no seu [mandala_aspect|E]"
 mandala_realm_contract_0015_contract:0 "Espíritos Doentes"
 mandala_realm_contract_0015_desc:0 "Um xamã em [TaskContract.GetLocation.GetNameNoTooltip] é acusado de abrigar espíritos que trazem doença. Os aldeões querem sua cabana queimada — com ele dentro, se necessário."
 mandala_realm_contract_0015_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0015_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão com base no seu [mandala_aspect|E]"
 mandala_realm_contract_0016_contract:0 "Lanças Embotadas"
 mandala_realm_contract_0016_desc:0 "Os soldados locais em [TaskContract.GetLocation.GetNameNoTooltip] estão preguiçosos e desmoralizados. O ancião da aldeia suplica para que você os discipline."
 mandala_realm_contract_0016_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0016_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão com base no seu [mandala_aspect|E]"
 mandala_realm_contract_0017_contract:0 "Aldeia Desafiante"
 mandala_realm_contract_0017_desc:0 "Uma aldeia em [TaskContract.GetLocation.GetNameNoTooltip] se recusa a pagar tributo, zombando da sua divindade. O sacerdote local implora que você marche até lá pessoalmente."
 mandala_realm_contract_0017_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0017_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão com base no seu [mandala_aspect|E]"
 mandala_realm_contract_0018_contract:0 "Imposto de Sangue"
 mandala_realm_contract_0018_desc:0 "Um recrutamento militar em [TaskContract.GetLocation.GetNameNoTooltip] não foi atendido. O oficial local pede que você exija #EMP moeda de sangue#! — aqueles que não puderem servir devem oferecer um substituto."
 mandala_realm_contract_0018_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0018_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão com base no seu [mandala_aspect|E]"
 mandala_realm_contract_0019_contract:0 "Rebeldes do Bambu"
 mandala_realm_contract_0019_desc:0 "Camponeses em [TaskContract.GetLocation.GetNameNoTooltip] estão afiando varas de bambu, alegando que agora podem #EMP \"se proteger\"#!. Sua presença marcial é solicitada — antes que a rebelião comece."
 mandala_realm_contract_0019_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0019_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão com base no seu [mandala_aspect|E]"
 mandala_realm_contract_0020_contract:0 "SACRIFÍCIO NA ESTRADA"
 mandala_realm_contract_0020_desc:0 "Uma estrada em [TaskContract.GetLocation.GetNameNoTooltip] sofreu sucessivos ataques de bandidos. Os locais acreditam que ela deve ser #EMP \"alimentada\"#! para suprimir a violência."
 mandala_realm_contract_0020_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
