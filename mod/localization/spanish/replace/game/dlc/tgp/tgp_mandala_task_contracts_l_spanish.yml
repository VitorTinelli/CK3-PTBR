 mandala_realm_contract_0010_desc:0 "Arados continuam quebrando nos campos de [TaskContract.GetLocation.GetNameNoTooltip]. Os aldeões suspeitam de um espírito maligno e pedem sua ajuda para quebrar a maldição."
