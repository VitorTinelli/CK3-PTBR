 mandala_realm_contract_0021_desc:0 "Um santuário em [TaskContract.GetLocation.GetNameNoTooltip] está celebrando o deus da guerra [TaskContract.GetLocation.GetCounty.GetFaith.WarGodName] — mas sem te honrar. Espera-se que você interrompa o ritual e reafirme sua divindade."
 mandala_realm_contract_0021_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0021_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão baseada em seu [mandala_aspect|E]"
 mandala_realm_contract_0022_contract:0 "Monges em Conflito"
 mandala_realm_contract_0022_desc:0 "Uma disputa de terras eclodiu em [TaskContract.GetLocation.GetNameNoTooltip] entre dois mosteiros locais. Você é chamado para restaurar a paz."
 mandala_realm_contract_0022_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0022_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão baseada em seu [mandala_aspect|E]"
 mandala_realm_contract_0023_contract:0 "Purificar Campo de Batalha"
 mandala_realm_contract_0023_desc:0 "Um campo em [TaskContract.GetLocation.GetNameNoTooltip], outrora manchado pela guerra, agora assombra os aldeões com pesadelos — eles pedem que você o purifique."
 mandala_realm_contract_0023_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0023_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão baseada em seu [mandala_aspect|E]"
 mandala_realm_contract_0024_contract:0 "Abençoar os Tecelões"
 mandala_realm_contract_0024_desc:0 "Os trabalhadores têxteis em [TaskContract.GetLocation.GetNameNoTooltip] pedem que você abençoe seus teares para o sucesso."
 mandala_realm_contract_0024_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0024_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão baseada em seu [mandala_aspect|E]"
 mandala_realm_contract_0025_contract:0 "Quebra das Lanças"
 mandala_realm_contract_0025_desc:0 "Os anciãos de [TaskContract.GetLocation.GetNameNoTooltip] pedem que você quebre lanças cerimoniais, simbolizando o fim das disputas de sangue locais."
 mandala_realm_contract_0025_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0025_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão baseada em seu [mandala_aspect|E]"
 mandala_realm_contract_0026_contract:0 "A Paz do Guru"
 mandala_realm_contract_0026_desc:0 "Um guru local prega a paz, para que as crianças de [TaskContract.GetLocation.GetNameNoTooltip] cresçam arando os campos em vez de morrer em disputas."
 mandala_realm_contract_0026_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0026_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão baseada em seu [mandala_aspect|E]"
 mandala_realm_contract_0027_contract:0 "Édito de Reconciliação"
 mandala_realm_contract_0027_desc:0 "O ancião de [TaskContract.GetLocation.GetNameNoTooltip] pede que você proíba patrulhas armadas e decrete que todas as disputas sejam resolvidas por arbitragem."
 mandala_realm_contract_0027_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0027_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão baseada em seu [mandala_aspect|E]"
 mandala_realm_contract_0028_contract:0 "Caminho Óctuplo"
 mandala_realm_contract_0028_desc:0 "Um líder local solicita que você passe em silêncio por oito vilas — uma para cada canto de [TaskContract.GetLocation.GetNameNoTooltip]."
 mandala_realm_contract_0028_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0028_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão com base em seu [mandala_aspect|E]"
 mandala_realm_contract_0029_contract:0 "Bosque Sagrado Ameaçado"
 mandala_realm_contract_0029_desc:0 "Um bosque sagrado em [TaskContract.GetLocation.GetNameNoTooltip] está ameaçado por caçadores e madeireiros. Os locais imploram que você deixe guerreiros para protegê-lo."
 mandala_realm_contract_0029_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0029_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão com base em seu [mandala_aspect|E]"
 mandala_realm_contract_0030_contract:0 "Voto de Quietude"
 mandala_realm_contract_0030_desc:0 "[TaskContract.GetLocation.GetNameNoTooltip] solicita que você faça um voto público de não-violência — sentando-se em silêncio por dias, para ensinar serenidade."
