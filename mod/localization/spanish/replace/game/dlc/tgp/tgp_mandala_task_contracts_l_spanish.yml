l_spanish:
 EIGHTFOLD_PATH_GLOSS:0 "Uma doutrina central do Budismo, que descreve oito princípios para uma vida justa — Visão Correta, Intenção Correta, Fala Correta, Ação Correta, Meio de Vida Correto, Esforço Correto, Atenção Correta e Concentração Correta.\n\nIdeais semelhantes eram respeitados entre as tradições hindus, animistas e sincréticas no Sul e Sudeste Asiático como guia para a harmonia pessoal e social."
 SILPAKARAS_GLOSS:0 "Em sânscrito, Śilpakāra refere-se a um artesão habilidoso em arquitetura ou escultura. Nos tribunais hindu-budistas do Sul e Sudeste Asiático, formavam guildas organizadas. Em mandalas políticas do Khmer, Javanês e Indiano, os Śilpakāras frequentemente trabalhavam sob patrocínio divino ou real."
 arbitration_edict_modifier:0 "Inscrição de Arbitragem"
 arbitration_edict_modifier_desc:0 "As disputas devem ser resolvidas apenas com palavras, por decreto do Devaraja."
 aspect_concept_creation:0 "[aspect_of_creation|E]"
 aspect_concept_destruction:0 "[aspect_of_destruction|E]"
 aspect_concept_serenity:0 "[aspect_of_serenity|E]"
 aspect_concept_trickery:0 "[aspect_of_trickery|E]"
 aspect_noun_creation:0 "criação"
 aspect_noun_destruction:0 "destruição"
 aspect_noun_serenity:0 "serenidade"
 aspect_noun_trickery:0 "trapaça"
 beast_free_modifier:0 "Livre de Bestas"
 beast_free_modifier_desc:0 "Esta província foi liberada de bestas perigosas por um poderoso Devaraja."
 brimming_with_beasts_modifier:0 "Cheia de Bestas"
 brimming_with_beasts_modifier_desc:0 "Esta província está repleta de bestas ferozes que gostam de devorar viajantes."
 collective_punishments_modifier:0 "Punições Coletivas"
 collective_punishments_modifier_desc:0 "As famílias de ladrões neste condado são punidas por crimes que não cometeram."
 discordant_town_modifier:0 "Vila Discordante"
 discordant_town_modifier_desc:0 "Esta província está assolada por discórdia e brigas."
 eightfold_path_modifier:0 "Caminho Óctuplo"
 eightfold_path_modifier_desc:0 "Um Devaraja demonstrou as virtudes do [Glossary('Caminho Óctuplo', 'EIGHTFOLD_PATH_GLOSS')] aqui."
 enforced_levy_modifier:0 "Recrutamento Forçado"
 enforced_levy_modifier_desc:0 "Um Devaraja assegurou, através de demonstração de violência, que este condado cumpra o recrutamento."
 fearful_population_modifier:0 "População Amedrontada"
 fearful_population_modifier_desc:0 "O Devaraja garantiu mais do que o suficiente para que saibam que apenas ele pode ser adorado aqui."
 fertile_ground_modifier:0 "Campos Férteis"
 fertile_ground_modifier_desc:0 "Um influxo de sementes e ferramentas da capital tornou estas terras prontas para o desenvolvimento."
 feudless_village_modifier:0 "Aldeia Sem Rixas"
 feudless_village_modifier_desc:0 "Uma aldeia nesta província quebrou todas as suas lanças em uma celebração de paz."
 gain_hunt_artifact_tt:0 "Você ganha um [artifact|E] relacionado à caça"
 garrisoned_groves_modifier:0 "Bosques Guarnecidos"
 garrisoned_groves_modifier_desc:0 "Os bosques desta província são protegidos pela guarnição principal, espalhando-a por várias áreas."
 generation_of_peace_modifier:0 "Geração da Paz"
 generation_of_peace_modifier_desc:0 "Uma geração de camponeses tem permissão para crescer em paz, sem imposição de alistamento."
 goat_oracle_modifier:0 "Oráculo da Cabra"
 goat_oracle_modifier_desc:0 "Um oráculo de cabra está sendo exibido neste condado, supostamente falando pelo Devaraja."
 healthgod_symbol_modifier:0 "Guildas de Tecelagem Serenas"
 healthgod_symbol_modifier_desc:0 "Os tecelões desta província criam belas imagens de deuses que representam saúde e longevidade."
 holy_compliment_almighty:0 "todo-poderoso"
 holy_compliment_divine:0 "divino"
 holy_compliment_most_omnipotent:0 "mais onipotente"
 holy_compliment_reverent:0 "reverente"
 holy_compliment_venerable:0 "venerável"
 lush_grove_modifier:0 "Bosque Viçoso"
 lush_grove_modifier_desc:0 "Graças à doação de sementes de um Devaraja vindas da capital, os bosques deste condado estão florescendo."
 mandala_contract_invalidated_desc:0 "O [mandala_ritual|E] em andamento foi invalidado"
 mandala_contract_invalidated_title:0 "[GetPlayer.Custom('GetContractOrIssue')] Invalidado"
 mandala_followers_doubting:0 "Súditos Exigem [mandala_rituals|E]"
 mandala_generic_reward_tt:0 "Você terá a chance de ganhar [piety_i][piety|E] ou [legitimacy_i][legitimacy|E]"
 mandala_provincial_ritual_desc_01:0 "Nossa fé está nas mãos do [GetPlayer.Custom('MistressMaster')|U]; aguardamos ansiosamente sua presença para receber suas bênçãos."
 mandala_provincial_ritual_desc_02:0 "As pétalas estão murchando e nossa paz de espírito com elas; aguardamos ansiosamente que nossas almas e mentes sejam rejuvenescidas pela presença [GetPlayer.GetHerHim]."
 mandala_realm_contract_0001_contract:0 "Ritual Provincial de [GetPlayer.Custom('GetAspectNoun')|U]"
 mandala_realm_contract_0001_desc:0 "[TaskContract.MakeScope.Var('loc_desc').GetFlagName|U]"
 mandala_realm_contract_0001_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0001_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e ganhe recompensas com base em sua [skill|E] no [mandala_aspect|E]"
 mandala_realm_contract_0002_contract:0 "Gado Estéril"
 mandala_realm_contract_0002_desc:0 "O gado de [TaskContract.GetLocation.GetNameNoTooltip] está estéril, com poucos bezerros nascendo. Os moradores pedem um ritual de fertilidade, antes que seus meios de subsistência desapareçam."
 mandala_realm_contract_0002_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0002_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão baseada em seu [mandala_aspect|E]"
 mandala_realm_contract_0003_contract:0 "A Primeira Semente"
 mandala_realm_contract_0003_desc:0 "O povo de [TaskContract.GetLocation.GetNameNoTooltip] planeja erguer um [GetBuilding('temple_citadel_01').GetName] em seu nome. Eles se recusam a começar até que você 'plante a primeira semente' no local."
 mandala_realm_contract_0003_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0003_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão baseada em seu [mandala_aspect|E]"
 mandala_realm_contract_0004_contract:0 "Novilha Sagrada"
 mandala_realm_contract_0004_desc:0 "Uma novilha sagrada se recusa a ajoelhar em [TaskContract.GetLocation.GetNameNoTooltip], um presságio de esterilidade. Eles o(a) convocam para restaurar o equilíbrio."
 mandala_realm_contract_0004_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0004_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão baseada em seu [mandala_aspect|E]"
 mandala_realm_contract_0005_contract:0 "Testemunha Divina"
 mandala_realm_contract_0005_desc:0 "Um casal nobre em [TaskContract.GetLocation.GetNameNoTooltip] não tem filhos. Eles precisam que você abençoe sua união."
 mandala_realm_contract_0005_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0005_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão baseada em seu [mandala_aspect|E]"
 mandala_realm_contract_0006_contract:0 "O Sonho das Parteiras"
 mandala_realm_contract_0006_desc:0 "Parteiras em [TaskContract.GetLocation.GetNameNoTooltip] sonham todas a mesma coisa — sua divindade, unida em sagrada união com uma mulher marcada por presságios."
 mandala_realm_contract_0006_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0006_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão baseada em seu [mandala_aspect|E]"
 mandala_realm_contract_0007_contract:0 "Estátua Chorona"
 mandala_realm_contract_0007_desc:0 "Uma estátua negligenciada em [TaskContract.GetLocation.GetNameNoTooltip] dizem que chora leite. Os aldeões pedem que você unja um recém-nascido sobre ela."
 mandala_realm_contract_0007_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0007_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão com base no seu [mandala_aspect|E]"
 mandala_realm_contract_0008_contract:0 "Flores Brotam"
 mandala_realm_contract_0008_desc:0 "Uma estranha flor sufocou as mudas em [TaskContract.GetLocation.GetNameNoTooltip]. Os aldeões acreditam que é obra sua e exigem que você restaure o equilíbrio apropriado."
