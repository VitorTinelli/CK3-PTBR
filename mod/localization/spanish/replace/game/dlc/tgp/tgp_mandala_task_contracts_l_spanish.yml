 mandala_realm_contract_0030_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão com base em seu [mandala_aspect|E]"
 mandala_realm_contract_0031_contract:0 "Colocação de Pedra"
 mandala_realm_contract_0031_desc:0 "Os habitantes de [TaskContract.GetLocation.GetNameNoTooltip] desejam erguer um edifício em sua honra. Eles exigem uma deposição cerimonial de armas antes do início da construção."
 mandala_realm_contract_0031_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0031_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão com base em seu [mandala_aspect|E]"
 mandala_realm_contract_0032_contract:0 "Asceta Risonho"
 mandala_realm_contract_0032_desc:0 "Um asceta brincalhão está semeando caos em [TaskContract.GetLocation.GetNameNoTooltip]. Os habitantes chamam você para superar este agente da travessura."
 mandala_realm_contract_0032_desc_title:0 "[GetPlayer.GetTitleAsNameNoTooltip] [TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U],"
 mandala_realm_contract_0032_request:0 "Faça uma aparição em [TaskContract.GetLocation.GetName] e tome uma decisão com base em seu [mandala_aspect|E]"
