l_spanish:
 all_non_arbitrary_participants:0 "Todos os participantes não-[GetTrait('arbitrary').GetName( GetNullCharacter )]"
 bribed_necklace_desc:0 "Este colar é uma peça simples, mas elegante."
 bribed_necklace_name:0 "Colar Fino"
 every_attending_chaperone:0 "Todos os acompanhantes de um participante"
 every_examiner:0 "Todos os examinadores"
 imperial_examination.advantage.child.tt:0 "[child.GetShortUIName] ganha [exam_advantage|E]"
 imperial_examination.advantage.no_character.tt:0 "Ganha [exam_advantage|E]"
 imperial_examination.cheat.cheater_child.tt:0 "[cheater_child.GetTitledFirstName] ganha um [exam_cheat|E]"
 imperial_examination.cheat.child.tt:0 "[child.GetTitledFirstName] ganha um [exam_cheat|E]"
 imperial_examination.lose_advantage.child.tt:0 "[child.GetShortUIName] perde [exam_advantage|E]"
 imperial_examination.lose_advantage.no_character.tt:0 "Perde [exam_advantage|E]"
 imperial_examination_jay.0010.a:0 "Mas nossa amizade continuará!"
 imperial_examination_jay.0010.b:0 "Precisamos apresentar as crianças!"
 imperial_examination_jay.0010.c:0 "Infelizmente, não estamos aqui por prazer."
 imperial_examination_jay.0010.desc:0 "\"Você deveria ter visto [friends_child.GetTitledFirstName]!\", ri [friend.GetTitledFirstName] — outro pai que nos últimos dias tem proporcionado a companhia mais agradável — \"Meu [friends_child.Custom('GetDaughterSon')] passou dias implorando por um pequeno [ROOT.Char.Custom('SmallAnimal')]. Então, claro, o que encontro piando debaixo do travesseiro [friends_child.GetHerHim]?\"\n\nAmbos caímos na risada. Que pena que em breve teremos que nos separar!"
 imperial_examination_jay.0010.t:0 "Mentes Iguais"
 imperial_examination_jay.0040.a:0 "Devo me manifestar sobre esse esquema."
 imperial_examination_jay.0040.b:0 "Esta informação pode ser útil."
 imperial_examination_jay.0040.c:0 "Tudo o que quero é um pouco de paz."
 imperial_examination_jay.0040.desc:0 "O sol brilha sobre os pardais, os Koi saltam no lago, até que duas figuras caminham descuidadamente pelo caminho do jardim, afugentando todos os pássaros e peixes. O primeiro [parent.GetWomanMan] reconheço como um dos examinadores. O outro é [parent.GetTitledFirstName], [cheater_child.Custom2('RelationToMe', parent )] de [cheater_child.GetTitledFirstName].\n\n[parent.GetFirstNameNoTooltip] desliza um saco tilintante dentro das vestes do examinador [examiner.GetFirstNamePossessive], que por sua vez revela uma folha de respostas e comenta o quão #EMP 'bem estudado'#! [cheater_child.GetTitledFirstNameNoTooltip] certamente é."
 imperial_examination_jay.0040.t:0 "Raposas no Jardim"
 imperial_examination_jay.0080.a.failure:0 "[examiner.GetSheHe|U] percebe o que você fez"
 imperial_examination_jay.0080.a.success:0 "[examiner.GetSheHe|U] assume a culpa"
 imperial_examination_jay.0080.a:0 "\"Oh não! Você derramou tinta nesses papéis!\""
 imperial_examination_jay.0080.b:0 "\"[examiner.GetFirstNameNoTooltip]! Você está bem!?\""
 imperial_examination_jay.0080.c:0 "\"Hahaha, seu desastrado!"
 imperial_examination_jay.0080.desc:0 "O examinador [examiner.GetTitledFirstName] deveria saber melhor do que correr com tanto! Em um momento [examiner.GetSheHe] corre pelos corredores com uma pilha precária de papéis e pincéis, e no instante seguinte, com um agudo grito, [examiner.GetSheHe] cai no chão em meio a um turbilhão de detritos acadêmicos.\n\nUma página caída chama minha atenção: um teste com o nome de [child.Custom2('MyCharacterIntroduction', ROOT.Char)], os erros visíveis mesmo à primeira vista..."
 imperial_examination_jay.0080.t:0 "A Queda"
 imperial_examination_jay.0110.a:0 "Bem #EMP eu#! tenho um presente do meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetTitledFirstNameNoTooltip]."
 imperial_examination_jay.0110.b.equipped_tt:0 "Adquirido [bribed_necklace.GetName] de [examiner.GetTitledFirstName]."
 imperial_examination_jay.0110.b.tt:0 "Você se torna dono de um [artifact|E] de colar de [prestige|E]"
 imperial_examination_jay.0110.b:0 "Este artefato é inútil. Deixe-me #EMP descartá-lo#!"
 imperial_examination_jay.0110.c:0 "Não me associei com tais [examiner.GetWomenMen]."
 imperial_examination_jay.0110.desc:0 "O examinador [examiner.GetFirstName] conversa comigo sobre [ROOT.Char.Custom('RegionalDrink')], o cheiro persistente do perfume [examiner.GetHerHim] sobrepujando o da bebida. Um pedaço de joia em volta do pescoço [examiner.GetHerHim] tilinta sempre que [examiner.GetSheHe] toma um gole.\n\n\"Esta peça,\" sorri [examiner.GetSheHe], \"foi um #EMP 'presente'#! de um antigo estudante.\""
 imperial_examination_jay.0110.t:0 "Um Examinador Adornado"
 imperial_examination_jay.0120.a:0 "A erudição da família [ROOT.Char.GetHouse.GetNameNoTooltip] é conhecida por todos!"
 imperial_examination_jay.0120.b:0 "Por que não ajudar a aprimorar os talentos [child.GetHerHim]?"
 imperial_examination_jay.0120.c:0 "Diga a [child.GetSheHe] o quanto estou orgulhoso, examinador."
 imperial_examination_jay.0120.d:0 "A destreza de [child.GetTitledFirstNamePossessiveNoTooltip] será conhecida por todos!"
 imperial_examination_jay.0120.desc:0 "O examinador [examiner.GetTitledFirstName], meu [ROOT.Char.Custom2('RelationToMe', examiner )], faz uma profunda reverência ao se aproximar. \"[child.GetTitledFirstName] é seu [child.Custom('GetDaughterSon')], sim?\"\n\nA profundidade da reverência [examiner.GetHerHim] aumenta com minha resposta. \"O desempenho de [child.GetFirstNamePossessiveNoTooltip] até agora me impressionou imensamente. [child.GetSheHe|U] é uma honra para a família [ROOT.Char.GetHouse.GetName]. Você claramente treinou [child.GetSheHe] muito bem!\""
 imperial_examination_jay.0120.t:0 "O Prodígio"
 imperial_examination_jay.0170.a:0 "Uma advertência pública é necessária."
 imperial_examination_jay.0170.b.tt:0 "Dependendo dos resultados do exame [child.GetHerHim], [child.GetShortUIName] ganhará ou perderá mais [prestige|E] e [merit|E]."
 imperial_examination_jay.0170.b:0 "[child.GetFirstNameNoTooltip] não precisa de ajuda para passar!"
 imperial_examination_jay.0170.c:0 "[child.GetFirstNameNoTooltip] se beneficiará, que fofocem."
 imperial_examination_jay.0170.desc:0 "\"A família [ROOT.Char.GetHouse.GetName] é verdadeiramente um lar de crença virtuosa,\" diz o examinador [examiner.GetFirstName], aproximando-se de mim com mãos inquietas e um olhar que percorre nosso redor. \"Estou certo de que seu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child'))] passaria no exame [child.GetHerHim] com alguma orientação. Eu poderia ser esse guia, se você fizesse algo em retorno?\"\n\nApesar da cautela de [examiner.GetFirstNamePossessiveNoTooltip], os outros pais e anciãos começaram a lançar olhares curiosos em nossa direção."
 imperial_examination_jay.0170.t:0 "Elogio Adoçado"
 nosy_opinion:0 "Intrometido"
 tgp_known_prodigy_modifier:0 "Prodígio Reconhecido"
 tgp_slapback_modifier:0 "Honra Protegida"
 tgp_slapback_modifier_desc:0 "Este personagem está mais do que disposto a entrar em conflito para defender a honra de sua família."
 tgp_studious_house_modifier:0 "Casa Estudiosa"
 tgp_studious_house_modifier_desc:0 "Os membros desta Casa são bem respeitados por sua reputação erudita.\n[characters|E] receberão um [exam_advantage|E] gratuito ao iniciar o [imperial_examination|E]."
